<style>
:root{--p:#7B2CD9;--pd:#6420B8;--lav:#EADDF7;--bg:#F3ECFA;--ink:#1d1b20}

body{margin:0;background:#d8cce8;font-family:"Noto Sans Gujarati","Shruti","Nirmala UI",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink)}

.sec{margin-bottom:14px}
.sh{background:var(--lav);display:flex;align-items:center;justify-content:space-between;padding:16px 14px 16px 18px;font-weight:800;font-size:17px;position:relative}

.kw{color:#C792EA;font-weight:700}.ty{color:#82AAFF}.st{color:#C3E88D}.cm{color:#8E9AAF;font-style:italic}.pp{color:#F78C6C}.nu{color:#F9C46B}.fn{color:#FFCB6B}

<script>
const U = {"subject": "DI01000111", "unit": 3, "format": "notes", "title": {"en": "Projections of Points and Lines"}, "hours": 5, "weightage": 20, "official": true, "languages": ["en"], "tabs": ["notes", "diagrams", "equations", "viva", "exam"], "intro_text": {"en": "Unit 3 of Engineering Graphics: how a three-dimensional object becomes two views on paper. The two reference planes and the four quadrants are built first, then points are projected with their heights and depths, then lines are carried through every position - parallel to a plane, perpendicular to it, inclined to one plane and inclined to both - with the true length, the true inclinations and the traces drawn out of the projections. Every topic is a numbered construction on the sheet, and seven fully solved drawing problems follow in section 4."}, "notes": [{"title": {"en": "1. The Reference Planes and the Projection of Points"}, "items": [{"h": {"en": "3.1 Two planes, four quadrants, one XY line"}, "body": {"en": "<h4>What the two planes are</h4><p>The <b>horizontal plane (HP)</b> is the flat plane you look down on and the <b>vertical plane (VP)</b> is the upright plane you look at. They meet at right angles in the <b>reference line XY</b>. In the drawing both planes are opened out flat, so XY becomes one horizontal line: everything drawn above XY is on the VP (an <b>elevation</b>, the view from the front) and everything below XY is on the HP (a <b>plan</b>, the view from above).</p><h4>The notation you must use</h4><ul><li>A point in space is a capital letter: <b>A</b>.</li><li>Its elevation is the same letter with a dash: <b>a'</b>, always above or below XY on the VP side.</li><li>Its plan is the plain small letter: <b>a</b>, on the HP side.</li><li>A point and both its views lie on one thin <b>projector</b> drawn square to XY - this is the one rule that never breaks.</li></ul><h4>The four quadrants</h4><table><tr><th>quadrant</th><th>the point is</th><th>elevation a'</th><th>plan a</th></tr><tr><td>first</td><td>above HP, in front of VP</td><td>above XY</td><td>below XY</td></tr><tr><td>second</td><td>above HP, behind VP</td><td>above XY</td><td>above XY</td></tr><tr><td>third</td><td>below HP, behind VP</td><td>below XY</td><td>above XY</td></tr><tr><td>fourth</td><td>below HP, in front of VP</td><td>below XY</td><td>below XY</td></tr></table><h4>Construction, step by step</h4><ol><li>Draw XY as a thin line across the middle of the sheet and letter it X at the left and Y at the right.</li><li>Measure the height of the point above HP along a perpendicular to XY and mark a' there: above XY for a point above HP, below XY for one below HP.</li><li>On the same perpendicular measure the distance in front of VP and mark a: below XY for a point in front of VP, above XY for one behind it.</li><li>Darken only the two letters and the short projector between them; XY, the projector and the construction stay thin.</li><li>Check the pair: both views on one line square to XY, each at the right distance from XY, and the quadrant written in words beside the point.</li></ol><p><b>Why it works.</b> Only two measurements fix a point - its height and its depth - and each of the two planes can show only one of them truly. The elevation shows height, the plan shows depth, and the projector is the same vertical line seen from both sides.</p><p><b>Common mistake.</b> Marking a plan above XY for a point in the first quadrant. Above HP puts the elevation above XY; in front of VP puts the plan below XY. Learn the two sentences, not the picture.</p>"}, "diagram": "u3_quadrants", "syllabus_item": "3.1"}, {"h": {"en": "3.1 Six points and how to read a drawing backwards"}, "body": {"en": "<h4>The set of points used in this unit</h4><table><tr><th>point</th><th>position</th><th>a' from XY</th><th>a from XY</th></tr><tr><td>A</td><td>25 above HP, 30 in front of VP</td><td>25 above</td><td>30 below</td></tr><tr><td>B</td><td>20 below HP, 35 in front of VP</td><td>20 below</td><td>35 below</td></tr><tr><td>C</td><td>30 above HP, 25 behind VP</td><td>30 above</td><td>25 above</td></tr><tr><td>D</td><td>15 below HP, 40 behind VP</td><td>15 below</td><td>40 above</td></tr><tr><td>E</td><td>on HP, 25 in front of VP</td><td>on XY</td><td>25 below</td></tr><tr><td>F</td><td>on VP, 20 above HP</td><td>20 above</td><td>on XY</td></tr></table><h4>Construction, step by step</h4><ol><li>Draw XY once for all six points and put the six projectors in a row, each square to XY, spaced so the letters will not touch.</li><li>For every point mark the elevation first, measuring the height above or below HP, and letter it with a dash.</li><li>Mark the plan on the same projector, measuring the depth in front of or behind VP, and letter it plain.</li><li>A point that lies on a plane throws one view on to XY itself: E on HP puts e' on XY, F on VP puts f on XY.</li><li>Number the answers in words under each point, as in the table, so the drawing states the quadrant it belongs to.</li></ol><h4>Reading a drawing backwards - the exam favourite</h4><p>When the question gives you the two views and asks for the position, read the signs and the distances, never the picture: <b>a' above XY</b> means the point is that far above HP; <b>a below XY</b> means it is that far in front of VP. Both views above XY is the second quadrant, both below XY is the fourth.</p><h4>Construction, step by step</h4><ol><li>Measure the distance of a' from XY and write it as a height: above XY = above HP, below XY = below HP.</li><li>Measure the distance of a from XY and write it as a depth: below XY = in front of VP, above XY = behind VP.</li><li>Combine the two sentences to name the quadrant, then state the point in the form 'A is 25 mm above HP and 30 mm in front of VP'.</li><li>As a proof, draw the projector: if a and a' are not on one line square to XY, the drawing you were given is wrong.</li></ol><p><b>Why it works.</b> The two planes are the only measuring sticks you have; every question about a point is really a question about two distances from XY and the side each one falls on.</p><p><b>Common mistake.</b> Calling the second quadrant 'behind HP'. Behind belongs to VP, below belongs to HP; mixing the words costs marks even when the drawing is right.</p>"}, "diagram": "u3_points", "syllabus_item": "3.1"}]}, {"title": {"en": "2. Projections of Lines: Inclinations and True Length"}, "items": [{"h": {"en": "3.2 The three positions worth memorising"}, "body": {"en": "<h4>A line is fixed by its end points</h4><p>A straight line is projected by projecting both ends and joining the two views. Its true length appears only in a view taken parallel to it, so the whole of this unit is one idea: put the line in a position where one view looks along it and the other looks across it, then read the true length off the view that sees it flat.</p><table><tr><th>position of the line</th><th>elevation</th><th>plan</th></tr><tr><td>parallel to both HP and VP</td><td>true length, parallel to XY</td><td>true length, parallel to XY</td></tr><tr><td>perpendicular to HP, parallel to VP</td><td>a point</td><td>true length, square to XY</td></tr><tr><td>perpendicular to VP, parallel to HP</td><td>true length, square to XY</td><td>a point</td></tr><tr><td>parallel to HP, inclined to VP</td><td>shortened to L cos of the angle</td><td>true length at the true angle</td></tr><tr><td>parallel to VP, inclined to HP</td><td>true length at the true angle</td><td>shortened to L cos of the angle</td></tr></table><h4>Construction, step by step</h4><ol><li>Draw XY, then mark the first end from its two distances exactly as if it were a point.</li><li>Decide which plane the line is parallel to: the view on that plane is the true-length view and the other view comes out shortened.</li><li>Draw the true-length view at the given angle, mark the second end there, and drop or raise a projector from it.</li><li>Complete the shortened view along a line parallel to XY through the first end, and check its length by L cos of the angle.</li><li>Ink the two views of the line, keep the projectors and the locus lines thin, and write the true length and the angle beside the true-length view.</li></ol><p><b>Why it works.</b> A line perpendicular to a plane is seen end-on, so it collapses to a point in that view; a line parallel to a plane is seen flat, so that view is a true length. Every construction in this unit is a way of arranging one of those two happy accidents.</p><p><b>Common mistake.</b> Drawing a line 60 mm long in both views when it is inclined: only the view of the plane it is parallel to may show the full 60 mm.</p>"}, "diagram": "u3_line_basic", "syllabus_item": "3.2"}, {"h": {"en": "3.2 Inclined to HP and parallel to VP"}, "body": {"en": "<h4>AB = 70 mm at 30 degrees to HP, A 20 mm above HP and 25 mm in front of VP</h4><p>Because the line is parallel to VP, no depth is lost and the elevation is the true-length view: <b>a'b' = 70 mm at 30 degrees to XY</b>. The plan is then just that view dropped down, parallel to XY and shortened to 70 cos 30 = 60.6 mm.</p><h4>Construction, step by step</h4><ol><li>Draw XY and mark a' 20 mm above it and a 25 mm below it, on one projector.</li><li>From a' draw a line at 30 degrees to XY, 70 mm long, and mark b' at its end - this one line is the whole answer for length and angle.</li><li>Drop a projector from b' perpendicular to XY.</li><li>Through a draw a line parallel to XY (the locus of b) and cut it with the projector from b' - that gives b, and ab is the plan.</li><li>Measure ab: it must be 60.6 mm and parallel to XY, and b' must stand 20 + 70 sin 30 = 55 mm above XY.</li></ol><h4>The numbers to predict before you draw</h4><ul><li>Elevation: true length 70 mm at 30 degrees, so b' is 55 mm above XY.</li><li>Plan: 70 cos 30 = 60.6 mm, parallel to XY, 25 mm below XY.</li><li>Height gained along the line: 70 sin 30 = 35 mm.</li><li>Both views sit between the same pair of projectors, 60.6 mm apart.</li></ul><p><b>Why it works.</b> Parallel to VP means the VP sees the line without foreshortening in the vertical sense: the height it gains and the length it runs are both seen truly, so the elevation is the real line. The HP sees only the run, so the plan keeps the run and loses the rise.</p><p><b>Common mistake.</b> Making the plan slope as well. With the line parallel to VP the plan must be parallel to XY; a sloping plan belongs to a line inclined to VP.</p>"}, "diagram": "u3_line_hp", "syllabus_item": "3.2"}, {"h": {"en": "3.2 Inclined to VP and parallel to HP"}, "body": {"en": "<h4>AB = 65 mm at 40 degrees to VP, A 20 mm above HP and 25 mm in front of VP</h4><p>The same argument with the planes swapped: parallel to HP means the plan is the true-length view, so the <b>plan is 65 mm at 40 degrees to XY</b>, and the elevation is that view lifted up, parallel to XY and shortened to 65 cos 40 = 49.8 mm.</p><h4>Construction, step by step</h4><ol><li>Draw XY and mark a' 20 mm above it and a 25 mm below it.</li><li>From a draw a line at 40 degrees to XY, 65 mm long, and mark b at its end.</li><li>Raise a projector from b perpendicular to XY.</li><li>Through a' draw a line parallel to XY (the locus of b') and cut it with the projector from b - that gives b', and a'b' is the elevation.</li><li>Check: a'b' = 49.8 mm parallel to XY, and both ends keep the same height, so the elevation is horizontal.</li></ol><h4>Where each angle is seen</h4><table><tr><th>given in the question</th><th>which view is true length</th><th>which view is shortened</th></tr><tr><td>parallel to VP, inclined to HP</td><td>elevation, at the true angle to XY</td><td>plan, parallel to XY, L cos of the angle</td></tr><tr><td>parallel to HP, inclined to VP</td><td>plan, at the true angle to XY</td><td>elevation, parallel to XY, L cos of the angle</td></tr><tr><td>inclined to both planes</td><td>neither view - both are shortened</td><td>the true length has to be constructed</td></tr></table><p><b>Why it works.</b> The plane that the line is parallel to sees the line square-on, so it can show the length and the angle; the other plane sees the line end-on to the tilt and can show only the run.</p><p><b>Common mistake.</b> Writing the angle in the elevation when the line is inclined to VP. The angle belongs to the plan in this case, and to the elevation only when the line is inclined to HP.</p>"}, "diagram": "u3_line_vp", "syllabus_item": "3.2"}, {"h": {"en": "3.2 Inclined to both planes - the two-stage construction"}, "body": {"en": "<h4>AB = 80 mm, 35 degrees to HP, plan at 45 degrees to XY, A 20 mm above HP, 25 mm in front of VP</h4><p>Neither view can be the true length now, so the line is built in two stages. <b>Stage 1</b> parks the line parallel to VP and inclined at 35 degrees to HP, where the elevation is honest. <b>Stage 2</b> swings the plan about a through the second angle; a swing about a vertical axis cannot change any height, so the elevation's second end must stay on the level it reached in stage 1 - the locus of b'.</p><h4>Construction, step by step</h4><ol><li>Draw XY, a' 20 mm above it and a 25 mm below it, on one projector.</li><li>Stage 1: from a' draw a'b1' = 80 mm at 35 degrees to XY. This is the true length at the true angle to HP.</li><li>Drop a projector from b1' to the locus of b (the line through a parallel to XY) and mark b1: ab1 = 65.5 mm is the plan of that parked position.</li><li>Stage 2: with a as centre and radius ab1 draw an arc, and strike the plan at 45 degrees to XY to get b2. The arc keeps the plan length, so no length is lost in the swing.</li><li>Draw the locus of b', the line through b1' parallel to XY. Raise a projector from b2 to cut it at b2', the new elevation of the second end.</li><li>Join a to b2 for the final plan and a' to b2' for the final elevation, ink them, and leave the stage-1 lines thin and dashed as construction.</li></ol><h4>What the finished drawing must measure</h4><table><tr><th>quantity</th><th>value</th><th>how it comes out</th></tr><tr><td>true length</td><td>80 mm</td><td>a'b1' in stage 1 - the arc and the locus preserve it</td></tr><tr><td>angle to HP</td><td>35 degrees</td><td>the elevation of stage 1</td></tr><tr><td>plan</td><td>65.5 mm at 45 degrees to XY</td><td>80 cos 35, swung round about a</td></tr><tr><td>elevation</td><td>65.2 mm</td><td>46.3 run with the 45.9 rise kept from stage 1</td></tr><tr><td>b1' height</td><td>45.9 mm above a'</td><td>80 sin 35</td></tr></table><p><b>Why it works.</b> Rotating the plan about a vertical axis through a keeps every point at its own height, and the arc keeps every point at its own distance from a in plan. Those two invariants are why the second stage is only a swing on the locus: the length and the heights were settled in stage 1 and cannot drift.</p><p><b>Check before you ink.</b> The elevation's end must lie on the horizontal locus through b1', and b2 must lie on the arc of radius ab1 - if either is off, the second stage was rotated about the wrong centre.</p><p><b>Common mistake.</b> Swinging the elevation instead of the plan. Stage 2 is always a rotation of the plan about a: the elevation is then read off the locus, never rotated itself.</p><p><b>What the 45 degrees means.</b> The stage-2 swing is made to the angle given with the VP, and that angle is measured on the plan. If a question asks for the true inclination of the finished line with VP, it comes from the plan: sin (inclination) = (plan length x sin 45) / true length = 65.5 x 0.707 / 80, which is 35.4 degrees. Draw the construction as above - that is what the examiner expects - and use this line only when the true angle is asked for.</p>"}, "diagram": "u3_line_both", "syllabus_item": "3.2"}, {"h": {"en": "3.2 True length, inclinations and traces from the two views"}, "body": {"en": "<h4>The reverse problem: the projections are given</h4><p>Sometimes the plan and the elevation are given and the true length, the true angles and the traces are wanted. Take the plan 45 mm long at 30 degrees to XY and the elevation 50 mm long at 38.8 degrees to XY, with a' 20 mm above XY and a 25 mm below it.</p><h4>Construction, step by step</h4><ol><li>Draw XY and the two given views, a' 20 above with the elevation rising, a 25 below with the plan falling.</li><li>Drop perpendiculars from b' to the plan line and from b to the elevation line to confirm both views share the same run along XY: 45 cos 30 = 39 mm and 50 cos 38.8 = 39 mm agree, which proves the pair.</li><li>For the true length, set the height difference against the plan: TL squared = 45 squared + 31.3 squared, so TL = 54.8 mm.</li><li>True inclination to HP: sin of the angle = rise / TL = 31.3 / 54.8, so the line rises at 34.9 degrees. True inclination to VP: sin = depth / TL = 22.5 / 54.8, so it leans 24.3 degrees.</li></ol><h4>Traces - where the line meets the two planes</h4><h4>Construction, step by step</h4><ol><li>Produce the elevation until it cuts XY and letter that point h'.</li><li>From h' drop a projector to meet the plan produced: that point is the <b>horizontal trace HT</b>, the place where the line would hit HP.</li><li>Produce the plan until it cuts XY and letter that point v.</li><li>From v raise a projector to meet the elevation produced: that point is the <b>vertical trace VT</b>, where the line would hit VP.</li><li>Ink HT and VT and leave the produced parts of the views thin and dashed.</li></ol><h4>Rules worth quoting</h4><ul><li>A line parallel to HP never meets HP, so it has no HT; parallel to VP it has no VT - the trace has gone to infinity.</li><li>A line in HP has its HT on the line itself, and a line in VP likewise.</li><li>The HT lies on the plan produced, the VT on the elevation produced, and each projects back to XY.</li><li>True length squared = (run along XY) squared + (rise) squared + (depth) squared.</li></ul><p><b>Why it works.</b> A trace is simply a point of the line that happens to lie on one of the planes, and a point on a plane has one of its views on XY. That is why the trace is found by cutting XY and projecting back into the other view.</p><p><b>Common mistake.</b> Projecting h' upwards. The elevation meets XY at h', and h' is the elevation of the HT, so the HT itself is found by dropping down to the plan produced.</p>"}, "diagram": "u3_traces", "syllabus_item": "3.2"}]}, {"title": {"en": "4. Solved Drawing Problems, Step by Step"}, "items": [{"h": {"en": "Problem 1. Draw the projections of four points and name the quadrant of each: A 25 mm above HP and 30 mm in front of VP; B 20 mm below HP and 35 mm in front of VP; C 30 mm above HP and 25 mm behind VP; D 15 mm below HP and 40 mm behind VP."}, "body": {"en": "<h4>Given</h4><p>Four points with a height above or below HP and a depth in front of or behind VP. One XY line carries all four, with the projectors square to it.</p><h4>Construction, step by step</h4><ol><li>Draw XY across the middle of the sheet and space four projectors along it, square to XY.</li><li>A: mark a' 25 mm above XY and a 30 mm below XY on the first projector.</li><li>B: mark b' 20 mm below XY and b 35 mm below XY on the second.</li><li>C: mark c' 30 mm above XY and c 25 mm above XY on the third - both views above XY, because the point is behind VP.</li><li>D: mark d' 15 mm below XY and d 40 mm above XY on the fourth.</li><li>Letter every view and write the quadrant in words under each point.</li></ol><h4>The answers</h4><p>A is in the first quadrant - above HP, in front of VP. B is in the fourth - below HP, in front of VP. C is in the second - above HP, behind VP. D is in the third - below HP, behind VP. In every case the pair sits on one projector, each view at its own distance from XY.</p>"}}, {"h": {"en": "Problem 2. The elevation a' of a point P is 30 mm above XY and its plan p is 40 mm below XY. State the position of P and its quadrant, then repeat for a point Q whose elevation is 25 mm above XY and whose plan is 18 mm above XY."}, "body": {"en": "<h4>Read the signs first</h4><p>Both views can only be read against XY: a' above XY means the point is above HP, a below XY means it is in front of VP.</p><h4>Point P</h4><ol><li>a' is 30 mm above XY, so P is 30 mm above HP.</li><li>p is 40 mm below XY, so P is 40 mm in front of VP.</li><li>Above HP and in front of VP is the first quadrant.</li><li>Write the answer as a sentence: P is 30 mm above HP and 40 mm in front of VP, first quadrant.</li></ol><h4>Point Q</h4><ol><li>q' is 25 mm above XY, so Q is 25 mm above HP.</li><li>q is 18 mm above XY, so Q is 18 mm behind VP.</li><li>Above HP and behind VP is the second quadrant.</li><li>Q is 25 mm above HP and 18 mm behind VP, second quadrant.</li></ol><h4>The check</h4><p>On the drawing, both views of P and both views of Q must each lie on a single projector square to XY. If they do not, the point has been read from the wrong side of XY.</p>"}}, {"h": {"en": "Problem 3. A line AB 60 mm long is parallel to both HP and VP, 25 mm above HP and 30 mm in front of VP. Draw its projections."}, "body": {"en": "<h4>Given</h4><p>A line parallel to both planes keeps both distances, so both views show the true length of 60 mm and both are parallel to XY.</p><h4>Construction, step by step</h4><ol><li>Draw XY and mark a' 25 mm above it, a directly below at 30 mm below XY.</li><li>Draw a'b' 60 mm long parallel to XY from a'.</li><li>Drop projectors from a' and from b' and mark a and b at 30 mm below XY.</li><li>Join ab: it is 60 mm and parallel to XY.</li><li>Check that the projectors from a' and b' pass through a and b, and that both views measure 60 mm.</li></ol><h4>The answer</h4><p>Both the elevation a'b' and the plan ab are 60 mm long and parallel to XY, the elevation 25 mm above XY and the plan 30 mm below it. A line in this position is the only one that shows its true length in both views.</p>"}}, {"h": {"en": "Problem 4. A line AB 70 mm long is inclined at 30 degrees to HP and parallel to VP. Its end A is 20 mm above HP and 25 mm in front of VP. Draw its projections and state the plan length."}, "body": {"en": "<h4>Given</h4><p>Parallel to VP, so the elevation is the true-length view; inclined 30 degrees to HP, so the elevation rises at 30 degrees to XY. Plan length = 70 cos 30 = 60.6 mm.</p><h4>Construction, step by step</h4><ol><li>Draw XY and mark a' 20 mm above it and a 25 mm below it on one projector.</li><li>From a' draw a line at 30 degrees to XY, mark b' at 70 mm along it - that is the true length at the true angle.</li><li>Drop a projector from b' perpendicular to XY.</li><li>Through a draw a line parallel to XY and cut it with the projector from b' to get b.</li><li>Join ab and measure it: 60.6 mm, parallel to XY.</li></ol><h4>The numbers</h4><p>b' stands 20 + 70 sin 30 = 55 mm above XY and the plan is 60.6 mm long, so the run along XY is 60.6 mm and the rise is 35 mm; 60.6 squared + 35 squared = 4900 = 70 squared, which proves the construction.</p>"}}, {"h": {"en": "Problem 5. A line AB 65 mm long is inclined at 40 degrees to VP and parallel to HP. Its end A is 20 mm above HP and 25 mm in front of VP. Draw its projections and state the elevation length."}, "body": {"en": "<h4>Given</h4><p>Parallel to HP, so the plan is now the true-length view at 40 degrees to XY; the elevation is parallel to XY and shortened to 65 cos 40 = 49.8 mm.</p><h4>Construction, step by step</h4><ol><li>Draw XY and mark a' 20 mm above it and a 25 mm below it.</li><li>From a draw a line at 40 degrees to XY and mark b 65 mm along it.</li><li>Raise a projector from b perpendicular to XY.</li><li>Through a' draw a line parallel to XY and cut it with the projector from b to get b'.</li><li>Join a'b' and check that it is 49.8 mm and horizontal.</li></ol><h4>The numbers</h4><p>The plan gives the run 65 cos 40 = 49.8 mm and the depth 65 sin 40 = 41.8 mm; the elevation is 49.8 mm long and stays at 20 mm above XY because both ends are at the same height. Depth check: 49.8 squared + 41.8 squared = 4225 = 65 squared.</p>"}}, {"h": {"en": "Problem 6. A line AB 80 mm long is inclined at 35 degrees to HP, and its plan is at 45 degrees to XY. Its end A is 20 mm above HP and 25 mm in front of VP. Draw its projections and give the lengths of both views."}, "body": {"en": "<h4>Given</h4><p>The line is inclined to both planes, so both views are shortened and the construction has two stages: park the line parallel to VP, then swing the plan.</p><h4>Construction, step by step</h4><ol><li>Draw XY, a' 20 mm above it, a 25 mm below it, on one projector.</li><li>Stage 1: draw a'b1' = 80 mm at 35 degrees to XY - the true length at the true angle to HP.</li><li>Drop a projector from b1' to the locus of b, the line through a parallel to XY, and mark b1. ab1 = 80 cos 35 = 65.5 mm.</li><li>Stage 2: with a as centre and radius 65.5 mm draw an arc, and strike the plan at 45 degrees to XY to get b2.</li><li>Draw the locus of b', the line through b1' parallel to XY, and raise a projector from b2 to cut it at b2'.</li><li>Join a to b2 for the plan and a' to b2' for the elevation; ink both and leave the stage-1 lines dashed.</li></ol><h4>The numbers</h4><p>Plan 65.5 mm at 45 degrees to XY; elevation 65.2 mm, because the second end keeps its 45.9 mm rise and now stands 46.3 mm along XY, and 46.3 squared + 45.9 squared = 4250. The true inclination with VP, when asked, is sin = 65.5 x sin 45 / 80, that is 35.4 degrees.</p>"}}, {"h": {"en": "Problem 7. The plan of a line AB is 45 mm long at 30 degrees to XY and its elevation is 50 mm long, with a' 20 mm above XY and a 25 mm below it. Find the true length, the true inclinations and both traces."}, "body": {"en": "<h4>Given</h4><p>Both views are given, so the true length and the inclinations have to be built from them, and the traces are found where the produced views meet XY.</p><h4>Construction, step by step</h4><ol><li>Draw XY and the two views: a' 20 mm above XY with the elevation rising 50 mm, a 25 mm below XY with the plan falling 45 mm.</li><li>Check the pair: both views must share the run 45 cos 30 = 39 mm and 50 cos 38.8 = 39 mm.</li><li>From b' drop a perpendicular to the level of a and measure the rise 31.3 mm; from b drop one to the level of a and measure the depth 22.5 mm.</li><li>True length = square root of (39 squared + 31.3 squared + 22.5 squared) = 54.8 mm.</li><li>True inclination to HP: sin = 31.3 / 54.8 = 0.571, so 34.9 degrees. True inclination to VP: sin = 22.5 / 54.8 = 0.411, so 24.3 degrees.</li><li>Produce the elevation to cut XY at h' and drop a projector to the plan produced - that is HT, 10.7 mm below XY on the plan side.</li><li>Produce the plan to cut XY at v and raise a projector to the elevation produced - that is VT, 14.9 mm below XY on the elevation side - the produced line has dipped below HP as well as behind VP.</li></ol><h4>The answers</h4><p>True length 54.8 mm, inclined 34.9 degrees to HP and 24.3 degrees to VP. HT lies 10.7 mm below XY on the plan produced and VT 14.9 mm below XY on the elevation produced, because the line produced backwards goes below HP as well as behind VP. Both traces are finite because the line is inclined to both planes.</p>"}}]}], "diagrams": [{"id": "u3_quadrants", "title": {"en": "Four quadrants, one XY line"}, "file": "diagrams/u3_quadrants.svg", "caption": {"en": "The elevation goes above XY and the plan below it; whether the point is above HP or in front of VP only decides how far and on which side."}}, {"id": "u3_points", "title": {"en": "Six points and what their projectors say"}, "file": "diagrams/u3_points.svg", "caption": {"en": "A point and both its views always sit on one thin projector drawn square to XY - that single line is the whole grammar of this unit."}}, {"id": "u3_line_basic", "title": {"en": "Three easy positions of a line"}, "file": "diagrams/u3_line_basic.svg", "caption": {"en": "Parallel to both planes: two true-length views. Perpendicular to HP: the elevation collapses to a point. Parallel to HP: the plan shows the true length."}}, {"id": "u3_line_hp", "title": {"en": "Inclined to HP, parallel to VP"}, "file": "diagrams/u3_line_hp.svg", "caption": {"en": "The elevation carries the true length and the angle to XY; the plan comes down on the projectors, parallel to XY and shortened to L cos of the angle."}}, {"id": "u3_line_vp", "title": {"en": "Inclined to VP, parallel to HP"}, "file": "diagrams/u3_line_vp.svg", "caption": {"en": "The mirror image of the previous figure: now the plan carries the true length and the elevation is the shortened view."}}, {"id": "u3_line_both", "title": {"en": "Line inclined to both planes"}, "file": "diagrams/u3_line_both.svg", "caption": {"en": "Assume the line parallel to VP first, then swing the plan round to the second angle - the elevation finishes on the locus of the first attempt."}}, {"id": "u3_traces", "title": {"en": "True length, inclinations and traces"}, "file": "diagrams/u3_traces.svg", "caption": {"en": "The traces are found where the produced views meet XY and drop back onto the other view: the plan gives the VT, the elevation gives the HT."}}], "equations": [{"title": {"en": "Positions of a point"}, "items": [{"name": {"en": "Elevation from HP"}, "f": "a' distance from XY = height above or below HP", "terms": {"en": "Measured on a projector square to XY: above XY for a point above HP, below XY for a point below HP."}}, {"name": {"en": "Plan from VP"}, "f": "a distance from XY = distance in front of or behind VP", "terms": {"en": "Below XY for a point in front of VP, above XY for a point behind VP."}}, {"name": {"en": "Quadrant test"}, "f": "sign of (a' - XY) and sign of (a - XY)", "terms": {"en": "Above-above is the second quadrant, below-below the fourth, above-below the first and below-above the third."}}]}, {"title": {"en": "Apparent and true lengths"}, "items": [{"name": {"en": "True length, tilted in one view"}, "f": "plan = TL x cos(angle to HP)", "terms": {"en": "The plan keeps the run and loses the rise, so it is the true length times the cosine of the angle the line makes with HP."}}, {"name": {"en": "True length, tilted the other way"}, "f": "elevation = TL x cos(angle to VP)", "terms": {"en": "The elevation keeps the rise and the run along XY and loses the depth, so it is shortened by the cosine of the angle with VP."}}, {"name": {"en": "True length from both views"}, "f": "TL = square root of (run squared + rise squared + depth squared)", "terms": {"en": "Run is measured along XY, rise between the elevations and depth between the plans; the three are at right angles, so they add as squares."}}, {"name": {"en": "True inclination to HP"}, "f": "sin(theta) = rise / TL", "terms": {"en": "The rise is the difference between the distances of the two ends above HP, read off the elevation."}}, {"name": {"en": "True inclination to VP"}, "f": "sin(phi) = depth / TL", "terms": {"en": "The depth is the difference between the distances of the two ends in front of VP, read off the plan."}}]}, {"title": {"en": "Traces"}, "items": [{"name": {"en": "Horizontal trace"}, "f": "elevation produced meets XY at h', project down", "terms": {"en": "A point on HP has its elevation on XY, so the HT is found by cutting XY with the elevation produced and projecting to the plan produced."}}, {"name": {"en": "Vertical trace"}, "f": "plan produced meets XY at v, project up", "terms": {"en": "A point on VP has its plan on XY, so the VT is found by cutting XY with the plan produced and projecting to the elevation produced."}}]}], "viva": [{"title": {"en": "Planes and points"}, "items": [{"q": {"en": "What are the principal planes of projection?"}, "a": {"en": "The horizontal plane HP, on which the plan (top view) is drawn, and the vertical plane VP, on which the elevation (front view) is drawn. They are at right angles in space and meet in the reference line XY, and the drawing is the two planes opened out flat about XY."}}, {"q": {"en": "Why is the plan drawn below XY?"}, "a": {"en": "In first-angle projection the object sits between the observer and the plane, so the plan is formed on the HP behind the object and, when the HP is rotated down about XY to lie in the paper, the plan ends up below XY. The elevation, formed on the VP behind the object, stays above XY."}}, {"q": {"en": "How many measurements fix a point in space?"}, "a": {"en": "Two: its distance above or below HP and its distance in front of or behind VP. Each plane can show only one of them truly, which is why both views are needed."}}, {"q": {"en": "What is a projector and what is it always perpendicular to?"}, "a": {"en": "The thin line joining a point's elevation to its plan. It is always perpendicular to XY, because the two views are of the same point seen from two directions at right angles."}}, {"q": {"en": "A point has both its views above XY. Where is it?"}, "a": {"en": "In the second quadrant: above HP, because the elevation is above XY, and behind VP, because the plan is above XY. The distances of the two views from XY are the height above HP and the distance behind VP, and both views sit on one projector."}}, {"q": {"en": "Where do the views of a point lying on HP fall?"}, "a": {"en": "The elevation falls on XY itself, because the point is at zero height, while the plan lies below XY at the distance the point is in front of VP."}}]}, {"title": {"en": "Lines, inclinations and true length"}, "items": [{"q": {"en": "When does a view of a line show its true length?"}, "a": {"en": "When the view is taken parallel to the line, which happens when the line is parallel to the plane of that view. So a line parallel to VP shows its true length in the elevation, and one parallel to HP shows it in the plan."}}, {"q": {"en": "What is the difference between the true length and the apparent length?"}, "a": {"en": "The true length is the real length of the line in space; the apparent length is the length measured in a particular view. Every view except the one parallel to the line is foreshortened, so the apparent length is always less than or equal to the true length."}}, {"q": {"en": "Why does a line perpendicular to HP appear as a point in the elevation?"}, "a": {"en": "Because the elevation looks along the direction of the line, so its two ends fall on the same projector and coincide. The plan then shows the true length, square to XY."}}, {"q": {"en": "In the two-stage construction, why is the plan rotated and not the elevation?"}, "a": {"en": "Rotating the plan about a is a rotation about a vertical axis through a, which cannot change the height of any point. The elevations therefore stay on their locus lines, and the second stage is read off those loci. Rotating the elevation would change the heights and destroy the first stage."}}, {"q": {"en": "What does the arc in the second stage guarantee?"}, "a": {"en": "That the plan length is unchanged: every point on the arc is the same distance from a, so the swing turns the plan without stretching it. The true length settled in stage 1 is therefore preserved."}}, {"q": {"en": "What is a trace of a line?"}, "a": {"en": "The point where the line, produced if necessary, meets one of the reference planes. The point where it meets HP is the horizontal trace HT and where it meets VP the vertical trace VT."}}, {"q": {"en": "Which line has no vertical trace, and why?"}, "a": {"en": "A line parallel to VP, because it never meets VP however far it is produced; its trace is said to be at infinity. In the same way a line parallel to HP has no horizontal trace."}}, {"q": {"en": "How are the two traces found from the views?"}, "a": {"en": "Produce the elevation to cut XY at h' and drop a projector to meet the plan produced: that is the HT. Produce the plan to cut XY at v and raise a projector to meet the elevation produced: that is the VT."}}]}], "exam_questions": [{"q": {"en": "Draw the projections of four points and name the quadrant of each: A 25 mm above HP and 30 mm in front of VP; B 20 mm below HP and 35 mm in front of VP; C 30 mm above HP and 25 mm behind VP; D 15 mm below HP and 40 mm behind VP."}, "marks": 5}, {"q": {"en": "The elevation a' of a point P is 30 mm above XY and its plan p is 40 mm below XY. State the position of P and its quadrant, then repeat for a point Q whose elevation is 25 mm above XY and whose plan is 18 mm above XY."}, "marks": 4}, {"q": {"en": "A line AB 60 mm long is parallel to both HP and VP, 25 mm above HP and 30 mm in front of VP. Draw its projections."}, "marks": 3}, {"q": {"en": "A line AB 70 mm long is inclined at 30 degrees to HP and parallel to VP. Its end A is 20 mm above HP and 25 mm in front of VP. Draw its projections and state the plan length."}, "marks": 5}, {"q": {"en": "A line AB 65 mm long is inclined at 40 degrees to VP and parallel to HP. Its end A is 20 mm above HP and 25 mm in front of VP. Draw its projections and state the elevation length."}, "marks": 5}, {"q": {"en": "A line AB 80 mm long is inclined at 35 degrees to HP, and its plan is at 45 degrees to XY. Its end A is 20 mm above HP and 25 mm in front of VP. Draw its projections and give the lengths of both views."}, "marks": 6}, {"q": {"en": "The plan of a line AB is 45 mm long at 30 degrees to XY and its elevation is 50 mm long, with a' 20 mm above XY and a 25 mm below it. Find the true length, the true inclinations and both traces."}, "marks": 6}], "learning_outcomes": [{"en": "Draw the projections of points, lines and planes under different conditions and find true length and true inclination."}], "course_outcomes": ["CO3"], "practical_numbers": [3], "content_kind": "theory", "lesson_count": 7, "answered_practice_count": 7, "assessment_note": {"en": "Official course: theory ESE 70 + PA 30 and practical PA 20 + ESE 30 = 150 marks, 3 credits, 30 teaching hours (2 lecture + 2 practical). This unit carries 20 % weightage, 5 of the 30 hours and 14 of the 70 theory marks (the PDF prints weightage only, so the marks are split by weightage). The solved drawing problems in section 4 are revision constructions with suggested marks, not official GTU papers, and the syllabus allows any valid method in the exam, so the notes show one clear method for each curve and name the alternatives."}, "question_provenance": "Original solved drawing problems written for revision; not official past papers", "question_marks_are_suggested": true, "sources": [{"title": "GTU DI01000111 Engineering Graphics syllabus (uploaded PDF, w.e.f. 2024-25)", "url": "https://syllabus.gtu.ac.in/"}, {"title": "N. D. Bhatt - Elementary Engineering Drawing, Charotar Publishing House, Anand (chapters 9-10: projections of points and straight lines)", "url": "https://www.charotarbookstall.com/"}, {"title": "P. S. Gill - A Text Book of Engineering Drawing, S. K. Kataria & Sons, Delhi (points, lines and traces)", "url": "https://www.skkatariaandsons.com/"}, {"title": "BIS SP 46 - Engineering drawing practice: first-angle projection and the reference line", "url": "https://www.bis.gov.in/"}]};

    const w = esc(m[0]);
    if (m[1]) o += `<span class="cm">${w}</span>`;
    else if (m[2]) o += `<span class="st">${w}</span>`;
    else if (m[3]) o += `<span class="pp">${w}</span>`;
    else if (m[4]) o += PKW.has(m[4]) ? `<span class="kw">${w}</span>` : PTY.has(m[4]) ? `<span class="ty">${w}</span>` : `<span class="fn">${w}</span>`;
    else if (m[5]) o += PKW.has(m[5]) ? `<span class="kw">${w}</span>` : PTY.has(m[5]) ? `<span class="ty">${w}</span>` : w;
    else o += `<span class="nu">${w}</span>`;
  }
  return o + esc(src.slice(last));
}
function hl(src){
  if (META.code_lang === 'python') return hlPy(src);
  if (META.code_lang === 'nosql') return esc(src);
  const re = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(^[ \t]*#[^\n]*)|([A-Za-z_]\w*)(?=\s*\()|([A-Za-z_]\w*)|(\b\d+(?:\.\d+)?[fFlLuU]*\b)/gm;
  let o='', last=0, m;
  while ((m = re.exec(src))){
    o += esc(src.slice(last, m.index)); last = re.lastIndex;
    const w = esc(m[0]);
    if (m[1]) o += `<span class="cm">${w}</span>`;
    else if (m[2]) o += `<span class="st">${w}</span>`;
    else if (m[3]) o += `<span class="pp">${w}</span>`;
    else if (m[4]) o += KW.has(m[4]) ? `<span class="kw">${w}</span>` : TY.has(m[4]) ? `<span class="ty">${w}</span>` : `<span class="fn">${w}</span>`;
    else if (m[5]) o += KW.has(m[5]) ? `<span class="kw">${w}</span>` : TY.has(m[5]) ? `<span class="ty">${w}</span>` : w;
    else o += `<span class="nu">${w}</span>`;
  }
  return o + esc(src.slice(last));
}
const progBody = p => p.items
  ? p.items.map(it => fixTables(t(it.body)) + (it.diagram?dgInline(it.diagram):'')).join('')
  : `<div class="pl">${L('code')}</div><pre class="code">${hl(t(p.code))}</pre><div class="pl">${L('output')}</div><pre class="out">${esc(p.out)}</pre>${p.plot?`<div class="pl">${L('plot')}</div>`+dgInline(p.plot).replace('class="dg"','class="dg pg"'):''}${p.expl?`<div class="pl">${L('expl')}</div>${fixTables(t(p.expl))}`:''}`;
const pBox = id => { const p=(U.programs||[]).find(x=>x.id===id); if(!p) return ''; return `<div class="pbox"><div class="et">${L('prog')}: ${t(p.title)}</div>${progBody(p)}</div>`; };
const exBox = id => { const n=(U.numericals||[]).find(x=>x.id===id); if(!n) return ''; return `<div class="ex"><div class="et">${L('ex')}</div><div class="eq2">${t(n.q)}</div>${fixTables(t(n.a))}</div>`; };
function notes(){
  let h = `<div class="intro"><b>${t(U.title)}</b><div>${L('unit')} ${U.unit} · ${U.weightage}% ${L('intro')} · ${U.hours} ${L('hours')}</div><div>${U.intro_text ? t(U.intro_text) : L(U.programs?(META.code_lang==='python'?'intropy':'introc'):'introd')}</div></div>`;
  U.notes.forEach((sec,si)=>{
    h += `<div class="sec">${head(t(sec.title))}`;
    sec.items.forEach((it,i)=>{
      const open = si===0&&i===0 ? ' open' : '';
      if (it.h) {
        h += `<div class="card${it.key?' key':''}${open}"><div class="q hd"><span class="t">${it.key?'⭐ ':''}${t(it.h)}</span>${chev}</div>
        <div class="a rn" style="padding-left:18px">${fixTables(t(it.body)).replace(/margin:0 0 10px -36px/g,'')}${it.diagram?dgInline(it.diagram):''}${(it.examples||[]).map(exBox).join('')}${(it.programs||[]).map(pBox).join('')}</div></div>`;
      } else {
        h += `<div class="card${open}"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(it.q)}</span>${chev}</div>
        <div class="a">${fixTables(t(it.a))}${it.diagram?dgInline(it.diagram):''}</div></div>`;
      }
    });
    h += `</div>`;
  });
  return h;
}
function numericals(){
  return `<div class="sec">${head(L('numericals'))}` + (U.numericals||[]).map((n,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(n.q)}</span>${chev}</div><div class="a">${fixTables(t(n.a))}</div></div>`).join('') + `</div>`;
}
function diagrams(){
  return `<div class="sec">${head(L((U.tabs ? U.tabs.includes('flowcharts')&&!U.tabs.includes('diagrams') : U.programs&&META.code_lang!=='python')?'flowcharts':'diagrams'),false)}<div style="height:10px"></div>` + U.diagrams.map((d,i)=>
    `<div class="dcard" data-dg="${d.id}"><div class="h">${i+1}. ${t(d.title)}</div>${SVG[d.id]}</div>`).join('') + `</div>`;
}
function equations(){
  return U.equations.map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><span class="fbox">${e.f}</span></span>${chev}</div>
     <div class="a"><p>${t(e.terms)}</p></div></div>`).join('') + `</div>`).join('');
}
function viva(){
  // two shapes exist in the corpus: flat [{q,a}] and grouped [{title, items:[{q,a}]}]
  const groups = U.viva.every(v=>v && v.q) ? [{items: U.viva}] : U.viva;
  return groups.map(g=>{
    const items = g.items || [];
    return `<div class="sec">${g.title?head(t(g.title)):''}` + items.map((v,i)=>
      `<div class="card"><div class="q hd"><span class="n">${i+1}.</span><span class="t">${t(v.q)}</span>${chev}</div><div class="a"><p>${t(v.a)}</p></div></div>`).join('') + `</div>`;
  }).join('');
}
function exam(){
  return `<div class="sec">${head(L('examhead'),false)}` + U.exam_questions.map((x,i)=>
    `<div class="card"><div class="q" style="cursor:default"><span class="n">${i+1}.</span><span class="t">${t(x.q)}</span><span class="mk">${x.marks} ${L('marks')}</span></div></div>`).join('') + `</div>`;
}
function programs(){
  return `<div class="sec">${head(L('programs'))}` + (U.programs||[]).map((p,i)=>
    `<div class="card"><div class="q hd"><span class="n">${i+1}.</span><span class="t">${t(p.title)}</span>${chev}</div><div class="a pa">${progBody(p)}</div></div>`).join('') + `</div>`;
}
function syntax(key){
  return (U[typeof key==='string'?key:'syntax']||[]).map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><pre class="code sx">${hl(e.f)}</pre></span>${chev}</div>
     <div class="a">${e.terms && t(e.terms) ? fixTables(t(e.terms)) : ''}</div></div>`).join('') + `</div>`).join('');
}
const flowcharts = diagrams;
const algorithms = () => syntax('algorithms');
const ALLV = {notes, programs, diagrams, flowcharts, algorithms, syntax, equations, numericals, viva, exam};
const VIEWS = U.tabs ? Object.fromEntries(U.tabs.map(k=>[k, ALLV[k]])) : U.programs ? (META.code_lang==='python' ? {notes, programs, diagrams, syntax, viva, exam} : {notes, programs, flowcharts, syntax, viva, exam}) : U.numericals ? {notes, diagrams, equations, numericals, viva, exam} : {notes, diagrams, equations, viva, exam};
function render(){
  document.getElementById('title').textContent = `${L('unit')} ${U.unit}: ${t(U.title)}`;
  document.getElementById('sub').textContent = `${t(META.name)} · ${META.code}`;
  document.getElementById('lang').textContent = S.lang==='en' ? 'ગુ' : 'EN';
  document.getElementById('lang').style.display = META.languages.includes('gu') ? '' : 'none';
  document.getElementById('tabs').innerHTML = Object.keys(VIEWS).map(k=>`<button class="tab${S.tab===k?' on':''}" data-tab="${k}">${L(k)}</button>`).join('');
  document.getElementById('view').innerHTML = VIEWS[S.tab]();
  document.querySelectorAll('#view pre.c').forEach(e=>{ e.innerHTML = hl(e.textContent); e.className='code'; });
}
let zoom = 1;
function setZoom(z){ zoom = Math.min(4, Math.max(1, z)); const w=document.getElementById('zw'); w.style.width=(zoom*100)+'%'; document.getElementById('zr').textContent=Math.round(zoom*100)+'%'; }
document.addEventListener('click', e=>{
  const q = e.target.closest('.q'); if (q && q.parentElement.querySelector('.a')) { q.parentElement.classList.toggle('open'); return; }
  const tb = e.target.closest('[data-tab]'); if (tb){ S.tab = tb.dataset.tab; render(); window.scrollTo(0,0); return; }
  if (e.target.closest('#lang')){ S.lang = S.lang==='en'?'gu':'en'; render(); return; }
  const m = e.target.closest('[data-more]');
  document.querySelectorAll('.menu.show').forEach(x=>{ if(!m || x!==m.nextElementSibling) x.classList.remove('show'); });
  if (m){ m.nextElementSibling.classList.toggle('show'); return; }
  const act = e.target.closest('[data-act]');
  if (act){ act.closest('.sec').querySelectorAll('.card').forEach(c=>{ if(c.querySelector('.a')) c.classList.toggle('open', act.dataset.act==='expand'); }); act.parentElement.classList.remove('show'); return; }
  const dg = e.target.closest('[data-dg]');
  if (dg){ const id=dg.dataset.dg; document.getElementById('mt').textContent=t(U.diagrams.find(d=>d.id===id).title); document.getElementById('zw').innerHTML=SVG[id]; setZoom(1); document.getElementById('modal').classList.add('show'); return; }
  if (e.target.closest('#mx')) document.getElementById('modal').classList.remove('show');
  if (e.target.closest('#zi')) setZoom(zoom+0.5);
  if (e.target.closest('#zo')) setZoom(zoom-0.5);
  if (e.target.closest('#zr')) setZoom(1);
});
render();
</script></body></html>
