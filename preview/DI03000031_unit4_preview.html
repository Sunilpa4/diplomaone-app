<script>
const U = {"subject": "DI03000031", "unit": 4, "format": "notes", "title": {"en": "Database Integrity Constraints and Objects"}, "weightage": 16, "hours": 7, "notes": [{"title": {"en": "4.1 Integrity Constraints"}, "items": [{"h": {"en": "Integrity Constraints: Introduction and Types"}, "body": {"en": "\n<p><b>Data integrity</b> means the data in a database is accurate, valid and consistent. <b>Integrity constraints</b> are rules defined on the columns of a table that the DBMS checks automatically on every INSERT, UPDATE and DELETE. A statement that breaks a rule is rejected with an error, so invalid data never enters the table.</p>\n<h4>Types of integrity constraints</h4>\n<table><tr><th>Type</th><th>Purpose</th><th>Constraints</th></tr>\n<tr><td>Domain integrity</td><td>Each value is valid for its column (domain)</td><td>NOT NULL, CHECK (and data type, DEFAULT)</td></tr>\n<tr><td>Entity integrity</td><td>Each row is unique and identifiable</td><td>UNIQUE, PRIMARY KEY</td></tr>\n<tr><td>Referential integrity</td><td>Links between tables stay valid</td><td>FOREIGN KEY, REFERENCES, ON DELETE CASCADE / SET NULL</td></tr></table>\n<h4>Column level and table level</h4>\n<ul><li><b>Column-level</b> constraint: written with the column definition. It applies to that one column. NOT NULL can only be column level.</li>\n<li><b>Table-level</b> constraint: written after all columns. It is required when the constraint uses <b>more than one column</b> (composite primary key, multi-column CHECK).</li></ul>\n<pre class=\"c\">-- column level\ncol datatype [CONSTRAINT name] type\n\n-- table level (after all columns)\n[CONSTRAINT name] type (col1, col2)</pre>\n<h4>Naming constraints</h4>\n<p>A constraint can be given a name with <code>CONSTRAINT name</code> (e.g. pk_emp, fk_emp_dept, ck_sal). If no name is given, Oracle creates one like <b>SYS_C008401</b>. Named constraints give clear error messages and are easy to drop, disable or enable.</p>\n<p>Constraints can be defined in CREATE TABLE or added later with ALTER TABLE.</p>\n"}, "diagram": "db4_constraints"}, {"h": {"en": "NOT NULL Constraint"}, "body": {"en": "\n<p>A <b>NOT NULL</b> constraint ensures that a column <b>cannot contain NULL</b>: a value must be given for it in every row. By default every column allows NULL.</p>\n<ul><li>It is a <b>domain integrity</b> constraint.</li>\n<li>It can be defined only at <b>column level</b>.</li>\n<li>Inserting NULL gives <b>ORA-01400: cannot insert NULL into (...)</b>; updating to NULL gives <b>ORA-01407</b>.</li>\n<li>DESC shows NOT NULL in the Null? column.</li>\n<li>Add it to an existing column with <code>ALTER TABLE t MODIFY col NOT NULL;</code> (only if the column has no NULLs). Remove it with <code>MODIFY col NULL</code>.</li></ul>\n<pre class=\"c\">CREATE TABLE customer (\n  cid   NUMBER(4),\n  cname VARCHAR2(20) NOT NULL,\n  city  VARCHAR2(15)\n        CONSTRAINT nn_city NOT NULL\n);</pre>\n<p>Use NOT NULL for mandatory data such as name, date of birth or price.</p>\n"}, "programs": ["q4_1"]}, {"h": {"en": "CHECK Constraint"}, "body": {"en": "\n<p>A <b>CHECK</b> constraint defines a condition that each row must satisfy. A value is accepted only if the condition is TRUE (or UNKNOWN because of NULL).</p>\n<ul><li>It is a <b>domain integrity</b> constraint: it limits the range or list of valid values.</li>\n<li>It can be column level or table level; a condition on two or more columns must be table level.</li>\n<li>Violation gives <b>ORA-02290: check constraint (...) violated</b>.</li>\n<li>A table can have many CHECK constraints; one column can have several.</li>\n<li>The condition cannot use sub-queries, SYSDATE, USER, ROWNUM, sequences or values from other rows.</li></ul>\n<pre class=\"c\">age   NUMBER(2)\n      CONSTRAINT ck_age\n      CHECK (age BETWEEN 15 AND 30),\ngender CHAR(1)\n      CHECK (gender IN ('M', 'F')),\nCONSTRAINT ck_marks\n  CHECK (marks &gt;= 0 AND marks &lt;= 100)</pre>\n<p>Examples: marks between 0 and 100, salary &gt; 0, gender IN ('M', 'F'), city = UPPER(city).</p>\n"}, "programs": ["q4_2"]}, {"h": {"en": "UNIQUE Constraint"}, "body": {"en": "\n<p>A <b>UNIQUE</b> constraint ensures that no two rows have the same value in the column (or combination of columns).</p>\n<ul><li>It is an <b>entity integrity</b> constraint.</li>\n<li>It <b>allows NULL</b>, and many rows can have NULL, because NULL is not equal to anything.</li>\n<li>A table can have <b>many</b> UNIQUE constraints.</li>\n<li>Oracle automatically creates a <b>unique index</b> with the same name to enforce it.</li>\n<li>A duplicate value gives <b>ORA-00001: unique constraint (...) violated</b>.</li>\n<li>A column set with a UNIQUE constraint can be referenced by a foreign key.</li></ul>\n<pre class=\"c\">email VARCHAR2(25)\n      CONSTRAINT uq_email UNIQUE,\nCONSTRAINT uq_phone UNIQUE (phone)</pre>\n<p>Typical use: alternate keys such as email, mobile number, Aadhaar number or vehicle number.</p>\n"}, "programs": ["q4_3"]}, {"h": {"en": "PRIMARY KEY Constraint"}, "body": {"en": "\n<p>A <b>PRIMARY KEY</b> uniquely identifies each row of a table. <b>PRIMARY KEY = UNIQUE + NOT NULL.</b></p>\n<ul><li>It is an <b>entity integrity</b> constraint: every row has an identity.</li>\n<li>A table can have <b>only one</b> primary key (ORA-02260 if you try to add a second).</li>\n<li>Duplicate values give ORA-00001; NULL gives ORA-01400.</li>\n<li>Oracle automatically creates a unique index for it.</li>\n<li>A primary key on two or more columns is a <b>composite primary key</b> and must be defined at <b>table level</b>.</li>\n<li>It is referenced by foreign keys of child tables.</li></ul>\n<pre class=\"c\">book_id NUMBER(4)\n        CONSTRAINT pk_book PRIMARY KEY\n\n-- composite key: table level only\nCONSTRAINT pk_enroll\n  PRIMARY KEY (roll, cid)</pre>\n<p>Choose a value that never changes and is short, e.g. roll number, employee number, product code.</p>\n"}, "diagram": "db4_pk_unique", "programs": ["q4_4", "q4_5"]}, {"h": {"en": "FOREIGN KEY (REFERENCES) Constraint"}, "body": {"en": "\n<p>A <b>FOREIGN KEY</b> is a column (or set of columns) in one table whose values must match the <b>primary key or unique key</b> of another table (or of the same table). It creates a <b>parent-child relationship</b> and enforces <b>referential integrity</b>.</p>\n<ul><li><b>Parent (referenced / master) table:</b> the table containing the primary key, e.g. DEPT.</li>\n<li><b>Child (referencing / detail) table:</b> the table containing the foreign key, e.g. EMP.</li>\n<li>The keyword <b>REFERENCES</b> names the parent table and column. If the column is omitted, the parent's primary key is used.</li>\n<li>At table level the keywords <code>FOREIGN KEY (col)</code> are written before REFERENCES.</li></ul>\n<pre class=\"c\">-- column level\ndeptno NUMBER(2)\n       CONSTRAINT fk_emp_dept\n       REFERENCES dept (deptno)\n\n-- table level\nCONSTRAINT fk_emp_dept\n  FOREIGN KEY (deptno)\n  REFERENCES dept (deptno)</pre>\n<h4>Rules enforced</h4>\n<ul><li>A child row can only contain a value that exists in the parent, or NULL; otherwise <b>ORA-02291: parent key not found</b>.</li>\n<li>A parent row that has child rows cannot be deleted (or its key updated): <b>ORA-02292: child record found</b>.</li>\n<li>The parent table must be created first and cannot be dropped while it is referenced (ORA-02449); use <code>DROP TABLE dept CASCADE CONSTRAINTS</code>.</li>\n<li>A <b>self-referencing</b> foreign key refers to the same table, e.g. EMP.MGR REFERENCES EMP(EMPNO).</li></ul>\n"}, "diagram": "db4_fk", "programs": ["q4_6"]}, {"h": {"en": "ON DELETE CASCADE and ON DELETE SET NULL"}, "body": {"en": "\n<p>By default Oracle does not allow a parent row to be deleted while child rows refer to it. A <b>delete rule</b> written with the foreign key changes this behaviour:</p>\n<table><tr><th>Rule</th><th>When a parent row is deleted</th></tr>\n<tr><td>(none) / NO ACTION</td><td>Delete is rejected with ORA-02292 while child rows exist</td></tr>\n<tr><td>ON DELETE CASCADE</td><td>All matching child rows are deleted automatically</td></tr>\n<tr><td>ON DELETE SET NULL</td><td>The foreign key of matching child rows is set to NULL</td></tr></table>\n<pre class=\"c\">deptno NUMBER(2)\n       REFERENCES dept (deptno)\n       ON DELETE CASCADE\n\ndeptno NUMBER(2)\n       REFERENCES dept (deptno)\n       ON DELETE SET NULL</pre>\n<ul><li>Use <b>CASCADE</b> when child rows have no meaning without the parent (order items of an order, marks of a student).</li>\n<li>Use <b>SET NULL</b> when child rows should be kept (employees of a closed department).</li>\n<li>The delete rule is shown in the DELETE_RULE column of USER_CONSTRAINTS.</li>\n<li>Oracle has no ON UPDATE CASCADE; parent keys should not be changed.</li></ul>\n"}, "diagram": "db4_cascade", "programs": ["q4_7", "q4_8"]}, {"h": {"en": "Adding, Dropping, Enabling and Disabling Constraints"}, "body": {"en": "\n<p>Constraints can be managed on an existing table with <b>ALTER TABLE</b>.</p>\n<h4>Adding constraints</h4>\n<pre class=\"c\">ALTER TABLE item\nADD CONSTRAINT pk_item PRIMARY KEY (icode);\n\nALTER TABLE item\nADD CONSTRAINT ck_rate CHECK (rate &gt; 0);\n\nALTER TABLE emp\nADD CONSTRAINT fk_dept FOREIGN KEY (deptno)\nREFERENCES dept (deptno);\n\nALTER TABLE item MODIFY iname NOT NULL;</pre>\n<p>When a constraint is added, Oracle first checks the <b>existing rows</b>. If any row breaks the rule, the constraint is not created, e.g. ORA-02293 (check), ORA-02437 (primary key), ORA-02299 (unique), ORA-02298 (foreign key) or ORA-02296 (NOT NULL).</p>\n<h4>Dropping, disabling and enabling</h4>\n<pre class=\"c\">ALTER TABLE item DROP CONSTRAINT ck_rate;\nALTER TABLE dept DROP PRIMARY KEY CASCADE;\n\nALTER TABLE emp DISABLE CONSTRAINT fk_dept;\nALTER TABLE emp ENABLE CONSTRAINT fk_dept;</pre>\n<ul><li><b>DROP CONSTRAINT</b> removes the rule permanently.</li>\n<li>A primary/unique key referenced by a foreign key cannot be dropped (ORA-02273) unless CASCADE is used, which also drops the foreign keys.</li>\n<li><b>DISABLE</b> turns a constraint off temporarily, e.g. to load large amounts of data quickly. <b>ENABLE</b> turns it on again and checks all rows.</li>\n<li>Disabling a primary key also drops its index; enabling re-creates it.</li></ul>\n"}, "programs": ["q4_9", "q4_10"]}, {"h": {"en": "Viewing Constraints: USER_CONSTRAINTS"}, "body": {"en": "\n<p>Constraint definitions are stored in the <b>data dictionary</b>.</p>\n<ul><li><b>USER_CONSTRAINTS</b>: one row per constraint. Important columns: CONSTRAINT_NAME, CONSTRAINT_TYPE, TABLE_NAME, SEARCH_CONDITION, R_CONSTRAINT_NAME, DELETE_RULE, STATUS.</li>\n<li><b>USER_CONS_COLUMNS</b>: the columns used in each constraint.</li></ul>\n<table><tr><th>CONSTRAINT_TYPE</th><th>Meaning</th></tr>\n<tr><td>P</td><td>Primary key</td></tr><tr><td>U</td><td>Unique key</td></tr>\n<tr><td>R</td><td>Referential (foreign key)</td></tr><tr><td>C</td><td>Check (NOT NULL is also stored as C)</td></tr></table>\n<pre class=\"c\">SELECT constraint_name, constraint_type,\n       table_name, status\nFROM user_constraints\nWHERE table_name = 'EMP';</pre>\n<p>Practical 11 (re-implementing the Practical 1 tables with constraints) uses all of these: create the parent tables first with primary keys, then the child tables with foreign keys, CHECK and NOT NULL, and then test valid and invalid rows.</p>\n"}, "programs": ["q4_11", "q4_12"]}]}, {"title": {"en": "4.2 Database Objects"}, "items": [{"h": {"en": "Database Objects: Overview"}, "body": {"en": "\n<p>A <b>database object</b> is any named structure stored in the database. Besides tables, Oracle provides:</p>\n<table><tr><th>Object</th><th>Purpose</th></tr>\n<tr><td>Table</td><td>Basic unit of storage: rows and columns</td></tr>\n<tr><td>View</td><td>Logical (virtual) table based on a query</td></tr>\n<tr><td>Synonym</td><td>Alternative name for an object</td></tr>\n<tr><td>Sequence</td><td>Generates unique numeric values</td></tr>\n<tr><td>Index</td><td>Improves the speed of data retrieval</td></tr></table>\n<p>All objects are created with CREATE, changed with ALTER (where allowed) and removed with DROP. Their details are stored in the data dictionary views USER_TABLES, USER_VIEWS, USER_SYNONYMS, USER_SEQUENCES, USER_INDEXES and USER_OBJECTS.</p>\n"}, "diagram": "db4_objects"}, {"h": {"en": "Views: Concept and CREATE VIEW"}, "body": {"en": "\n<p>A <b>view</b> is a <b>virtual table</b> based on the result of a SELECT statement. It has rows and columns like a table but <b>stores no data</b> of its own; only its query is stored in the data dictionary. Each time the view is used, Oracle runs the query on the <b>base table(s)</b>, so the view always shows current data.</p>\n<pre class=\"c\">CREATE [OR REPLACE] [FORCE] VIEW name\n  [(alias1, alias2, ...)]\nAS SELECT ...\n[WITH CHECK OPTION]\n[WITH READ ONLY];</pre>\n<ul><li><b>OR REPLACE</b>: re-creates the view if it already exists.</li>\n<li><b>FORCE</b>: creates the view even if the base table does not exist yet.</li>\n<li><b>Aliases</b>: column names for the view.</li>\n<li><b>WITH CHECK OPTION</b> / <b>WITH READ ONLY</b>: restrict DML through the view.</li></ul>\n<pre class=\"c\">CREATE VIEW emp20 AS\nSELECT empno, ename, job, sal\nFROM emp\nWHERE deptno = 20;\n\nSELECT * FROM emp20;</pre>\n<h4>Advantages of views</h4>\n<ul><li><b>Security:</b> users see only selected columns and rows (e.g. no salary).</li>\n<li><b>Simplicity:</b> a complex join or calculation is written once and used like a table.</li>\n<li><b>Data independence:</b> applications use the view even if the base table structure changes.</li>\n<li><b>Different views</b> of the same data for different users.</li>\n<li>No extra storage is needed.</li></ul>\n<p><b>Disadvantages:</b> a view on a complex query can be slow, and DML through complex views is restricted.</p>\n"}, "diagram": "db4_view", "programs": ["q4_13"]}, {"h": {"en": "Simple and Complex Views; DML through Views"}, "body": {"en": "\n<table><tr><th>Simple view</th><th>Complex view</th></tr>\n<tr><td>Based on one table</td><td>Based on one or more tables (joins)</td></tr>\n<tr><td>No functions, GROUP BY or DISTINCT</td><td>Can contain group functions, GROUP BY, DISTINCT, expressions</td></tr>\n<tr><td>INSERT, UPDATE, DELETE allowed (usually)</td><td>DML not always allowed</td></tr></table>\n<pre class=\"c\">CREATE VIEW dept_summary AS\nSELECT d.dname, COUNT(e.empno) total,\n       SUM(e.sal) total_sal\nFROM dept d JOIN emp e\nON d.deptno = e.deptno\nGROUP BY d.dname;</pre>\n<h4>Rules for DML through a view</h4>\n<ul><li>INSERT, UPDATE and DELETE on a simple view change the <b>base table</b>.</li>\n<li>DML is <b>not allowed</b> if the view contains group functions, GROUP BY, DISTINCT or ROWNUM: <b>ORA-01732</b>.</li>\n<li>A column defined by an expression (e.g. sal * 12) cannot be inserted or updated: <b>ORA-01733</b>.</li>\n<li>INSERT through a view fails if a NOT NULL column of the base table is not in the view.</li>\n<li>For a join view, only the <b>key-preserved</b> table can be modified.</li></ul>\n"}, "diagram": "db4_view_types", "programs": ["q4_14", "q4_15"]}, {"h": {"en": "WITH CHECK OPTION and WITH READ ONLY"}, "body": {"en": "\n<p><b>WITH CHECK OPTION</b> ensures that every row inserted or updated through the view satisfies the view's WHERE condition, so it remains visible through the view. Otherwise Oracle gives <b>ORA-01402: view WITH CHECK OPTION where-clause violation</b>.</p>\n<p><b>WITH READ ONLY</b> prevents all DML operations through the view (<b>ORA-42399</b>). The view can only be queried.</p>\n<pre class=\"c\">CREATE VIEW emp30 AS\nSELECT empno, ename, sal, deptno\nFROM emp WHERE deptno = 30\nWITH CHECK OPTION;\n\nCREATE VIEW emp_public AS\nSELECT empno, ename, job FROM emp\nWITH READ ONLY;</pre>\n<ul><li>Through EMP30 you cannot insert an employee of department 10 or move an employee to department 20.</li>\n<li>Through EMP_PUBLIC users can see employee names and jobs but cannot change anything.</li>\n<li>A name can be given: <code>WITH CHECK OPTION CONSTRAINT ck_emp30</code>.</li></ul>\n"}, "programs": ["q4_16", "q4_17"]}, {"h": {"en": "ALTER VIEW and DROP VIEW"}, "body": {"en": "\n<pre class=\"c\">CREATE OR REPLACE VIEW v_emp AS\nSELECT empno, ename, sal FROM emp;\n\nALTER VIEW v_emp COMPILE;\n\nDROP VIEW v_emp;</pre>\n<ul><li><b>CREATE OR REPLACE VIEW</b> is the way to change a view's query. The view keeps its name and the privileges granted on it.</li>\n<li><b>ALTER VIEW view_name COMPILE</b> recompiles a view that became invalid after a change to its base table. ALTER VIEW cannot change the query.</li>\n<li><b>DROP VIEW</b> removes the view definition only; the base table data is not affected. Views built on the dropped view become invalid.</li>\n<li>If the base table is dropped, the view becomes <b>invalid</b> and gives an error when used.</li>\n<li>View definitions can be seen in <b>USER_VIEWS</b> (VIEW_NAME, TEXT).</li></ul>\n"}, "programs": ["q4_18"]}, {"h": {"en": "Synonyms: CREATE SYNONYM and DROP SYNONYM"}, "body": {"en": "\n<p>A <b>synonym</b> is an alternative name (alias) for a table, view, sequence, procedure or another synonym. It stores no data; it only points to the object.</p>\n<pre class=\"c\">CREATE [PUBLIC] SYNONYM syn_name\nFOR [schema.]object_name;\n\nDROP [PUBLIC] SYNONYM syn_name;\n\nCREATE SYNONYM e FOR emp;\nSELECT * FROM e;</pre>\n<h4>Types</h4>\n<ul><li><b>Private synonym</b> (default): owned by a user and usable by that user (and others with privileges).</li>\n<li><b>Public synonym</b>: created with PUBLIC by the DBA and usable by all users, e.g. <code>CREATE PUBLIC SYNONYM emp FOR scott.emp</code>.</li></ul>\n<h4>Uses / advantages</h4>\n<ul><li>Gives a short, simple name for a long object name such as scott.employee_details.</li>\n<li>Hides the owner and real name of the object (location transparency and security).</li>\n<li>If the object moves, only the synonym is changed; programs stay the same.</li></ul>\n<p>SELECT and DML on a synonym work on the real object. DROP SYNONYM removes only the alias. Synonyms are listed in <b>USER_SYNONYMS</b>.</p>\n"}, "programs": ["q4_19"]}, {"h": {"en": "Sequences: CREATE SEQUENCE, NEXTVAL and CURRVAL"}, "body": {"en": "\n<p>A <b>sequence</b> is a database object that generates a series of unique integers automatically. It is mainly used to generate <b>primary key values</b> such as roll numbers, bill numbers or order numbers.</p>\n<pre class=\"c\">CREATE SEQUENCE seq_name\n  [START WITH n]\n  [INCREMENT BY n]\n  [MINVALUE n | NOMINVALUE]\n  [MAXVALUE n | NOMAXVALUE]\n  [CYCLE | NOCYCLE]\n  [CACHE n | NOCACHE];</pre>\n<table><tr><th>Option</th><th>Meaning (default)</th></tr>\n<tr><td>START WITH</td><td>First number (1)</td></tr>\n<tr><td>INCREMENT BY</td><td>Gap between numbers; negative for descending (1)</td></tr>\n<tr><td>MINVALUE / MAXVALUE</td><td>Lowest and highest value</td></tr>\n<tr><td>CYCLE / NOCYCLE</td><td>Restart after MAXVALUE or stop with an error (NOCYCLE)</td></tr>\n<tr><td>CACHE n / NOCACHE</td><td>Pre-allocate n numbers in memory for speed (CACHE 20)</td></tr></table>\n<h4>Pseudo columns</h4>\n<ul><li><b>seq.NEXTVAL</b>: returns the next number and advances the sequence.</li>\n<li><b>seq.CURRVAL</b>: returns the current (last generated) number in this session; it can be used only after NEXTVAL (else ORA-08002).</li></ul>\n<pre class=\"c\">CREATE SEQUENCE seq_bill\nSTART WITH 1001 INCREMENT BY 1;\n\nINSERT INTO bill\nVALUES (seq_bill.NEXTVAL, 'Aarav');\n\nSELECT seq_bill.CURRVAL FROM dual;</pre>\n<p>A sequence is independent of tables: one sequence can be used for many tables. Numbers are not rolled back, so gaps can appear after ROLLBACK or a crash.</p>\n"}, "diagram": "db4_sequence", "programs": ["q4_20"]}, {"h": {"en": "ALTER SEQUENCE and DROP SEQUENCE"}, "body": {"en": "\n<pre class=\"c\">ALTER SEQUENCE seq_bill\n  INCREMENT BY 10\n  MAXVALUE 99999\n  CYCLE;\n\nDROP SEQUENCE seq_bill;</pre>\n<ul><li><b>ALTER SEQUENCE</b> can change INCREMENT BY, MINVALUE, MAXVALUE, CYCLE and CACHE. The change affects only future numbers.</li>\n<li><b>START WITH cannot be altered</b> (ORA-02283); drop and re-create the sequence to restart it.</li>\n<li>MAXVALUE cannot be set lower than the current value.</li>\n<li>With NOCYCLE, NEXTVAL after MAXVALUE gives <b>ORA-08004</b>.</li>\n<li><b>DROP SEQUENCE</b> removes the sequence; values already stored in tables stay.</li>\n<li><b>USER_SEQUENCES</b> shows SEQUENCE_NAME, MIN_VALUE, MAX_VALUE, INCREMENT_BY, CYCLE_FLAG, CACHE_SIZE and LAST_NUMBER.</li></ul>\n"}, "programs": ["q4_21"]}, {"h": {"en": "Indexes: Concept, Unique and Composite Index"}, "body": {"en": "\n<p>An <b>index</b> is a database object that speeds up the retrieval of rows, just like the index at the back of a book. It stores the column values in <b>sorted order</b> together with the <b>ROWID</b> (address) of each row. Oracle uses an index automatically when a query searches on the indexed column; without an index, Oracle reads every row (<b>full table scan</b>).</p>\n<pre class=\"c\">CREATE [UNIQUE] INDEX index_name\nON table_name (col1 [, col2 ...]);\n\nDROP INDEX index_name;</pre>\n<h4>Types of indexes</h4>\n<ul><li><b>Simple (single-column) index:</b> on one column.</li>\n<li><b>Composite (concatenated) index:</b> on two or more columns, e.g. (deptno, job). It is used when the WHERE clause uses the leading column(s).</li>\n<li><b>Unique index:</b> does not allow duplicate values. Oracle creates one automatically for every PRIMARY KEY and UNIQUE constraint.</li>\n<li><b>Non-unique index:</b> allows duplicates (the default).</li></ul>\n<pre class=\"c\">CREATE INDEX idx_ename ON emp (ename);\n\nCREATE UNIQUE INDEX idx_dname\nON dept (dname);\n\nCREATE INDEX idx_dept_job\nON emp (deptno, job);</pre>\n<h4>When to create an index</h4>\n<ul><li>The column is used often in WHERE, JOIN or ORDER BY.</li>\n<li>The table is large and queries return a small part of its rows.</li>\n<li>The column has many different values.</li></ul>\n<h4>When not to</h4>\n<ul><li>Small tables, or columns that are rarely searched.</li>\n<li>Tables that are updated very often: every INSERT, UPDATE and DELETE must also update the indexes, and indexes take disk space.</li></ul>\n"}, "diagram": "db4_index", "programs": ["q4_22"]}, {"h": {"en": "DROP INDEX and Index Rules"}, "body": {"en": "\n<p><code>DROP INDEX index_name;</code> removes an index. The table and its data are not affected; queries still work but may be slower.</p>\n<ul><li>A unique index cannot be created on a column that already contains duplicates: <b>ORA-01452</b>.</li>\n<li>The same column list cannot be indexed twice: <b>ORA-01408</b> (e.g. a primary key column is already indexed).</li>\n<li>An index used by a PRIMARY KEY or UNIQUE constraint cannot be dropped directly (<b>ORA-02429</b>); drop or disable the constraint.</li>\n<li>When a table is dropped, all its indexes are dropped automatically.</li>\n<li>Indexes are listed in <b>USER_INDEXES</b> and their columns in <b>USER_IND_COLUMNS</b>.</li>\n<li><b>Practical 13</b> also compares query time with and without an index: in SQL*Plus, <code>SET TIMING ON</code> shows the time taken by each statement, and the difference appears clearly on a large table.</li></ul>\n"}, "programs": ["q4_23"]}]}], "programs": [{"id": "q4_1", "title": {"en": "NOT NULL constraint"}, "code": {"en": "CREATE TABLE customer (\n  cid   NUMBER(4),\n  cname VARCHAR2(20) NOT NULL,\n  city  VARCHAR2(15)\n        CONSTRAINT nn_city NOT NULL,\n  phone VARCHAR2(10)\n);\n\nINSERT INTO customer\nVALUES (1, 'Mehta Stores', 'Surat', NULL);\n\nINSERT INTO customer\nVALUES (2, NULL, 'Anand', '9876543210');\n\nINSERT INTO customer (cid, cname)\nVALUES (3, 'Shah Traders');\n\nDESC customer"}, "out": "Table created.\n\n1 row created.\n\nERROR at line 1:\nORA-01400: cannot insert NULL into (\"SCOTT\".\"CUSTOMER\".\"CNAME\")\n\nERROR at line 1:\nORA-01400: cannot insert NULL into (\"SCOTT\".\"CUSTOMER\".\"CITY\")\n\n Name   Null?    Type\n ------ -------- ------------\n CID             NUMBER(4)\n CNAME  NOT NULL VARCHAR2(20)\n CITY   NOT NULL VARCHAR2(15)\n PHONE           VARCHAR2(10)", "expl": {"en": "\n<ul><li><b>NOT NULL</b> means the column must always have a value. It can only be defined at <b>column level</b>.</li>\n<li>CNAME has an unnamed NOT NULL (Oracle gives it a SYS_C name); CITY has a named constraint <code>nn_city</code>.</li>\n<li>PHONE has no constraint, so NULL is accepted in the first insert.</li>\n<li>The second and third inserts fail with <b>ORA-01400</b>, because CNAME and CITY are left NULL.</li>\n<li>DESC shows NOT NULL in the Null? column.</li></ul>\n"}}, {"id": "q4_2", "title": {"en": "CHECK constraint (column and table level)"}, "code": {"en": "CREATE TABLE student4 (\n  roll   NUMBER(3),\n  name   VARCHAR2(15),\n  gender CHAR(1)\n         CHECK (gender IN ('M', 'F')),\n  age    NUMBER(2)\n         CONSTRAINT ck_age\n         CHECK (age BETWEEN 15 AND 30),\n  min_m  NUMBER(3),\n  marks  NUMBER(3),\n  CONSTRAINT ck_marks\n    CHECK (marks >= 0 AND marks <= 100)\n);\n\nINSERT INTO student4\nVALUES (1, 'Aarav', 'M', 18, 35, 82);\n\nINSERT INTO student4\nVALUES (2, 'Diya', 'X', 17, 35, 91);\n\nINSERT INTO student4\nVALUES (3, 'Karan', 'M', 12, 35, 67);\n\nINSERT INTO student4\nVALUES (4, 'Isha', 'F', 19, 35, 120);"}, "out": "Table created.\n\n1 row created.\n\nERROR at line 1:\nORA-02290: check constraint (SCOTT.SYS_C008401) violated\n\nERROR at line 1:\nORA-02290: check constraint (SCOTT.CK_AGE) violated\n\nERROR at line 1:\nORA-02290: check constraint (SCOTT.CK_MARKS) violated", "expl": {"en": "\n<ul><li><b>CHECK</b> allows only values for which the condition is TRUE (or NULL).</li>\n<li>Gender 'X' violates the unnamed check (SYS_C name), age 12 violates <code>ck_age</code>, and marks 120 violates the table-level check <code>ck_marks</code>. Each gives <b>ORA-02290</b>.</li>\n<li>Naming constraints (ck_age, ck_marks) makes error messages easy to understand.</li>\n<li>A CHECK condition cannot use SYSDATE, sub-queries or other rows.</li></ul>\n"}}, {"id": "q4_3", "title": {"en": "UNIQUE constraint"}, "code": {"en": "CREATE TABLE users4 (\n  uid4  NUMBER(3),\n  email VARCHAR2(25)\n        CONSTRAINT uq_email UNIQUE,\n  phone VARCHAR2(10),\n  CONSTRAINT uq_phone UNIQUE (phone)\n);\n\nINSERT INTO users4\nVALUES (1, 'a@mail.com', '9800000001');\nINSERT INTO users4\nVALUES (2, 'a@mail.com', '9800000002');\nINSERT INTO users4\nVALUES (3, NULL, '9800000003');\nINSERT INTO users4\nVALUES (4, NULL, NULL);\n\nSELECT * FROM users4 ORDER BY uid4;"}, "out": "Table created.\n\n1 row created.\n\nERROR at line 1:\nORA-00001: unique constraint (SCOTT.UQ_EMAIL) violated\n\n1 row created.\n\n1 row created.\n\nUID4 EMAIL      PHONE\n---- ---------- ----------\n   1 a@mail.com 9800000001\n   3            9800000003\n   4", "expl": {"en": "\n<ul><li><b>UNIQUE</b> does not allow duplicate values in the column: the repeated email gives <b>ORA-00001</b>.</li>\n<li>UNIQUE <b>allows NULL</b>, and several rows may have NULL, because NULL is not equal to any value (rows 3 and 4).</li>\n<li>A table may have <b>many</b> UNIQUE constraints (email and phone).</li></ul>\n"}}, {"id": "q4_4", "title": {"en": "PRIMARY KEY constraint"}, "code": {"en": "CREATE TABLE book (\n  book_id NUMBER(4)\n          CONSTRAINT pk_book PRIMARY KEY,\n  title   VARCHAR2(25) NOT NULL,\n  price   NUMBER(6, 2)\n);\n\nINSERT INTO book\nVALUES (101, 'DBMS Concepts', 450);\nINSERT INTO book\nVALUES (101, 'Oracle SQL', 520);\nINSERT INTO book\nVALUES (NULL, 'PL/SQL Guide', 380);\n\nDESC book"}, "out": "Table created.\n\n1 row created.\n\nERROR at line 1:\nORA-00001: unique constraint (SCOTT.PK_BOOK) violated\n\nERROR at line 1:\nORA-01400: cannot insert NULL into (\"SCOTT\".\"BOOK\".\"BOOK_ID\")\n\n Name     Null?    Type\n -------- -------- ------------\n BOOK_ID  NOT NULL NUMBER(4)\n TITLE    NOT NULL VARCHAR2(25)\n PRICE             NUMBER(6,2)", "expl": {"en": "\n<ul><li><b>PRIMARY KEY = UNIQUE + NOT NULL</b>. It identifies every row uniquely.</li>\n<li>The duplicate 101 gives <b>ORA-00001</b> (unique constraint PK_BOOK violated), and the NULL key gives <b>ORA-01400</b>.</li>\n<li>A table can have only <b>one</b> primary key. DESC shows BOOK_ID as NOT NULL.</li></ul>\n"}}, {"id": "q4_5", "title": {"en": "Composite PRIMARY KEY (table level)"}, "code": {"en": "CREATE TABLE enroll4 (\n  roll  NUMBER(3),\n  cid   VARCHAR2(4),\n  edate DATE DEFAULT SYSDATE,\n  CONSTRAINT pk_enroll\n    PRIMARY KEY (roll, cid)\n);\n\nINSERT INTO enroll4 (roll, cid)\nVALUES (1, 'C1');\nINSERT INTO enroll4 (roll, cid)\nVALUES (1, 'C2');\nINSERT INTO enroll4 (roll, cid)\nVALUES (2, 'C1');\nINSERT INTO enroll4 (roll, cid)\nVALUES (1, 'C1');\n\nSELECT * FROM enroll4 ORDER BY roll, cid;"}, "out": "Table created.\n\n1 row created.\n\n1 row created.\n\n1 row created.\n\nERROR at line 1:\nORA-00001: unique constraint (SCOTT.PK_ENROLL) violated\n\nROLL CID EDATE\n---- --- ---------\n   1 C1  28-OCT-26\n   1 C2  28-OCT-26\n   2 C1  28-OCT-26", "expl": {"en": "\n<ul><li>A key on more than one column is a <b>composite key</b>; it must be defined at <b>table level</b>.</li>\n<li>Roll 1 can join C1 and C2, and C1 can have rolls 1 and 2; only the <b>combination</b> (1, C1) must be unique, so the last insert fails.</li>\n<li><code>DEFAULT SYSDATE</code> fills EDATE automatically when no value is given.</li></ul>\n"}}, {"id": "q4_6", "title": {"en": "FOREIGN KEY: parent and child tables"}, "code": {"en": "CREATE TABLE emp4 (\n  empno  NUMBER(4) PRIMARY KEY,\n  ename  VARCHAR2(10),\n  deptno NUMBER(2)\n         CONSTRAINT fk_emp4_dept\n         REFERENCES dept4 (deptno)\n);\n\nINSERT INTO emp4 VALUES (1, 'AMIT', 20);\nINSERT INTO emp4 VALUES (2, 'NEHA', 20);\nINSERT INTO emp4 VALUES (3, 'RAVI', 50);\nINSERT INTO emp4 VALUES (4, 'MEET', NULL);\n\nDELETE FROM dept4 WHERE deptno = 20;\nDELETE FROM dept4 WHERE deptno = 30;\nDROP TABLE dept4;"}, "out": "Table created.\n\n1 row created.\n\n1 row created.\n\nERROR at line 1:\nORA-02291: integrity constraint (SCOTT.FK_EMP4_DEPT) violated - parent key not found\n\n1 row created.\n\nERROR at line 1:\nORA-02292: integrity constraint (SCOTT.FK_EMP4_DEPT) violated - child record found\n\n1 row deleted.\n\nERROR at line 1:\nORA-02449: unique/primary keys in table referenced by foreign keys", "expl": {"en": "\n<ul><li>DEPT4 is the <b>parent</b> (referenced) table and EMP4 is the <b>child</b> (referencing) table.</li>\n<li>Department 50 does not exist, so the insert fails with <b>ORA-02291: parent key not found</b>. A NULL foreign key is allowed (MEET).</li>\n<li>Department 20 has employees, so it cannot be deleted: <b>ORA-02292: child record found</b>. Department 30 has no employees, so it is deleted.</li>\n<li>The parent table cannot be dropped while a foreign key refers to it (<b>ORA-02449</b>); use <code>DROP TABLE dept4 CASCADE CONSTRAINTS</code> or drop the child first.</li></ul>\n"}}, {"id": "q4_7", "title": {"en": "ON DELETE CASCADE"}, "code": {"en": "CREATE TABLE emp4 (\n  empno  NUMBER(4) PRIMARY KEY,\n  ename  VARCHAR2(10),\n  deptno NUMBER(2)\n         REFERENCES dept4 (deptno)\n         ON DELETE CASCADE\n);\n\nINSERT INTO emp4 VALUES (1, 'AMIT', 20);\nINSERT INTO emp4 VALUES (2, 'HETAL', 10);\nINSERT INTO emp4 VALUES (3, 'RAJESH', 10);\n\nDELETE FROM dept4 WHERE deptno = 10;\n\nSELECT * FROM emp4;"}, "out": "Table created.\n\n1 row created.\n\n1 row created.\n\n1 row created.\n\n1 row deleted.\n\nEMPNO ENAME DEPTNO\n----- ----- ------\n    1 AMIT      20", "expl": {"en": "\n<ul><li>With <b>ON DELETE CASCADE</b>, deleting a parent row automatically deletes all its child rows.</li>\n<li>Deleting department 10 also removed HETAL and RAJESH. Only \"1 row deleted.\" is shown, because the child rows are deleted by Oracle, not by our statement.</li>\n<li>Use it when child rows have no meaning without the parent, e.g. order items of an order.</li></ul>\n"}}, {"id": "q4_8", "title": {"en": "ON DELETE SET NULL"}, "code": {"en": "CREATE TABLE emp4 (\n  empno  NUMBER(4) PRIMARY KEY,\n  ename  VARCHAR2(10),\n  deptno NUMBER(2)\n         REFERENCES dept4 (deptno)\n         ON DELETE SET NULL\n);\n\nINSERT INTO emp4 VALUES (1, 'AMIT', 20);\nINSERT INTO emp4 VALUES (2, 'HETAL', 10);\nINSERT INTO emp4 VALUES (3, 'RAJESH', 10);\n\nDELETE FROM dept4 WHERE deptno = 10;\n\nSELECT * FROM emp4 ORDER BY empno;"}, "out": "Table created.\n\n1 row created.\n\n1 row created.\n\n1 row created.\n\n1 row deleted.\n\nEMPNO ENAME  DEPTNO\n----- ------ ------\n    1 AMIT       20\n    2 HETAL\n    3 RAJESH", "expl": {"en": "\n<ul><li>With <b>ON DELETE SET NULL</b>, the child rows are kept but their foreign key becomes NULL.</li>\n<li>HETAL and RAJESH still exist, now without a department.</li>\n<li>The foreign key column must allow NULL for this rule.</li></ul>\n"}}, {"id": "q4_9", "title": {"en": "Add constraints to an existing table (ALTER TABLE)"}, "code": {"en": "CREATE TABLE item (\n  icode NUMBER(3),\n  iname VARCHAR2(15),\n  rate  NUMBER(6)\n);\nINSERT INTO item VALUES (1, 'Pen', 10);\nINSERT INTO item VALUES (2, 'Book', -60);\n\nALTER TABLE item\nADD CONSTRAINT pk_item PRIMARY KEY (icode);\n\nALTER TABLE item\nADD CONSTRAINT ck_rate CHECK (rate > 0);\n\nUPDATE item SET rate = 60 WHERE icode = 2;\n\nALTER TABLE item\nADD CONSTRAINT ck_rate CHECK (rate > 0);\n\nALTER TABLE item MODIFY iname NOT NULL;"}, "out": "Table created.\n\n1 row created.\n\n1 row created.\n\nTable altered.\n\nERROR at line 1:\nORA-02293: cannot validate (SCOTT.CK_RATE) - check constraint violated\n\n1 row updated.\n\nTable altered.\n\nTable altered.", "expl": {"en": "\n<ul><li><code>ALTER TABLE ... ADD CONSTRAINT</code> adds PRIMARY KEY, UNIQUE, CHECK or FOREIGN KEY to an existing table. NOT NULL is added with <code>MODIFY</code>.</li>\n<li>Oracle checks the existing rows first. The rate -60 breaks the new check, so it fails with <b>ORA-02293: cannot validate</b>.</li>\n<li>After correcting the data, the same constraint is added successfully.</li></ul>\n"}}, {"id": "q4_10", "title": {"en": "Drop, disable and enable constraints"}, "code": {"en": "ALTER TABLE emp DISABLE CONSTRAINT fk_dept;\n\nINSERT INTO emp (empno, ename, deptno)\nVALUES (120, 'RAVI', 50);\n\nALTER TABLE emp ENABLE CONSTRAINT fk_dept;\n\nDELETE FROM emp WHERE empno = 120;\n\nALTER TABLE emp ENABLE CONSTRAINT fk_dept;\n\nALTER TABLE dept DROP PRIMARY KEY;\n\nALTER TABLE emp DROP CONSTRAINT fk_dept;\n\nALTER TABLE dept DROP PRIMARY KEY;"}, "out": "Table altered.\n\n1 row created.\n\nERROR at line 1:\nORA-02298: cannot validate (SCOTT.FK_DEPT) - parent keys not found\n\n1 row deleted.\n\nTable altered.\n\nERROR at line 1:\nORA-02273: this unique/primary key is referenced by some foreign keys\n\nTable altered.\n\nTable altered.", "expl": {"en": "\n<ul><li><b>DISABLE</b> switches a constraint off temporarily (for example, during bulk data loading); <b>ENABLE</b> switches it on again.</li>\n<li>Enabling fails with <b>ORA-02298</b> while a row (department 50) breaks the rule; after the bad row is removed it succeeds.</li>\n<li>A primary key that is referenced by a foreign key cannot be dropped (<b>ORA-02273</b>). Drop the foreign key first, or use <code>DROP PRIMARY KEY CASCADE</code>.</li></ul>\n"}}, {"id": "q4_11", "title": {"en": "View constraints in the data dictionary"}, "code": {"en": "SELECT constraint_name, constraint_type,\n       table_name, r_constraint_name\nFROM user_constraints\nWHERE table_name IN ('DEPT', 'EMP')\nORDER BY table_name, constraint_name;\n\nSELECT constraint_name, column_name,\n       position\nFROM user_cons_columns\nWHERE table_name = 'EMP'\nORDER BY constraint_name;"}, "out": "CONSTRAINT_NAME CONSTRAINT_TYPE TABLE_NAME R_CONSTRAINT_NAME\n--------------- --------------- ---------- -----------------\nPK_DEPT         P               DEPT\nFK_DEPT         R               EMP        PK_DEPT\nPK_EMP          P               EMP\n\nCONSTRAINT_NAME COLUMN_NAME POSITION\n--------------- ----------- --------\nFK_DEPT         DEPTNO             1\nPK_EMP          EMPNO              1", "expl": {"en": "\n<ul><li><b>USER_CONSTRAINTS</b> lists every constraint you own. CONSTRAINT_TYPE: <b>P</b> = primary key, <b>U</b> = unique, <b>R</b> = foreign key (referential), <b>C</b> = check or NOT NULL.</li>\n<li>R_CONSTRAINT_NAME shows the parent key that a foreign key refers to (FK_DEPT → PK_DEPT).</li>\n<li><b>USER_CONS_COLUMNS</b> shows which columns belong to each constraint.</li></ul>\n"}}, {"id": "q4_12", "title": {"en": "Practical 11: college database with all constraints"}, "code": {"en": "CREATE TABLE branch (\n  bcode CHAR(2) PRIMARY KEY,\n  bname VARCHAR2(20) NOT NULL UNIQUE\n);\n\nCREATE TABLE stud (\n  enrol NUMBER(4) PRIMARY KEY,\n  sname VARCHAR2(20) NOT NULL,\n  bcode CHAR(2) REFERENCES branch\n        ON DELETE CASCADE,\n  sem   NUMBER(1)\n        CHECK (sem BETWEEN 1 AND 6),\n  email VARCHAR2(25) UNIQUE\n);\n\nINSERT INTO branch\nVALUES ('CE', 'Computer');\nINSERT INTO branch\nVALUES ('IT', 'Information Tech');\nINSERT INTO stud\nVALUES (101, 'Aarav', 'CE', 3, 'a@g.in');\nINSERT INTO stud\nVALUES (102, 'Diya', 'IT', 3, 'd@g.in');\nINSERT INTO stud\nVALUES (103, 'Karan', 'ME', 3, 'k@g.in');\nINSERT INTO stud\nVALUES (104, 'Isha', 'CE', 9, 'i@g.in');\n\nSELECT table_name, constraint_type,\n       COUNT(*) total\nFROM user_constraints\nGROUP BY table_name, constraint_type\nORDER BY table_name, constraint_type;"}, "out": "Table created.\n\nTable created.\n\n1 row created.\n\n1 row created.\n\n1 row created.\n\n1 row created.\n\nERROR at line 1:\nORA-02291: integrity constraint (SCOTT.SYS_C008406) violated - parent key not found\n\nERROR at line 1:\nORA-02290: check constraint (SCOTT.SYS_C008407) violated\n\nTABLE_NAME CONSTRAINT_TYPE TOTAL\n---------- --------------- -----\nBRANCH     C                   1\nBRANCH     P                   1\nBRANCH     U                   1\nSTUD       C                   2\nSTUD       P                   1\nSTUD       R                   1\nSTUD       U                   1\n\n7 rows selected.", "expl": {"en": "\n<ul><li>All three types of integrity are used: <b>domain</b> (NOT NULL, CHECK on sem), <b>entity</b> (PRIMARY KEY, UNIQUE) and <b>referential</b> (FOREIGN KEY with ON DELETE CASCADE).</li>\n<li><code>REFERENCES branch</code> without a column refers to the parent's primary key.</li>\n<li>Branch 'ME' does not exist (ORA-02291) and semester 9 is out of range (ORA-02290), so those rows are rejected.</li>\n<li>The last query counts the constraints of each type in each table (C includes the NOT NULL constraints).</li></ul>\n"}}, {"id": "q4_13", "title": {"en": "Create a simple view and query it"}, "code": {"en": "CREATE VIEW emp20 AS\nSELECT empno, ename, job, sal\nFROM emp\nWHERE deptno = 20;\n\nSELECT * FROM emp20 ORDER BY empno;\n\nSELECT ename, sal FROM emp20\nWHERE sal > 30000\nORDER BY sal DESC;\n\nDESC emp20"}, "out": "View created.\n\nEMPNO ENAME JOB       SAL\n----- ----- ------- -----\n  102 AMIT  MANAGER 60000\n  104 NEHA  ANALYST 45000\n  105 KIRAN CLERK   22000\n\nENAME   SAL\n----- -----\nAMIT  60000\nNEHA  45000\n\n Name   Null?    Type\n ------ -------- ------------\n EMPNO  NOT NULL NUMBER(4)\n ENAME           VARCHAR2(10)\n JOB             VARCHAR2(10)\n SAL             NUMBER(7,2)", "expl": {"en": "\n<ul><li>A <b>view</b> is a stored SELECT statement that behaves like a virtual table. No data is copied; each query on EMP20 reads EMP.</li>\n<li>The view hides the other columns (MGR, COMM, DEPTNO...) and other departments' rows: a simple way of giving <b>security</b>.</li>\n<li>A view can be queried, filtered and described just like a table.</li></ul>\n"}}, {"id": "q4_14", "title": {"en": "INSERT, UPDATE and DELETE through a simple view"}, "code": {"en": "CREATE VIEW emp20 AS\nSELECT empno, ename, sal, deptno\nFROM emp WHERE deptno = 20;\n\nINSERT INTO emp20\nVALUES (111, 'RAVI', 25000, 20);\n\nUPDATE emp20 SET sal = sal + 2000\nWHERE ename = 'KIRAN';\n\nDELETE FROM emp20 WHERE empno = 111;\n\nSELECT empno, ename, sal, deptno\nFROM emp WHERE deptno = 20\nORDER BY empno;"}, "out": "View created.\n\n1 row created.\n\n1 row updated.\n\n1 row deleted.\n\nEMPNO ENAME   SAL DEPTNO\n----- ----- ----- ------\n  102 AMIT  60000     20\n  104 NEHA  45000     20\n  105 KIRAN 24000     20", "expl": {"en": "\n<ul><li>DML on a <b>simple view</b> (one table, no group functions, DISTINCT or expressions) changes the <b>base table</b>.</li>\n<li>RAVI was inserted into EMP and then deleted; KIRAN's salary in EMP became 24000.</li>\n<li>Columns not in the view (JOB, MGR ...) are set to NULL or their default when a row is inserted through the view, so NOT NULL columns of the base table must be included in the view.</li></ul>\n"}}, {"id": "q4_15", "title": {"en": "Complex view (join and GROUP BY)"}, "code": {"en": "CREATE VIEW dept_summary AS\nSELECT d.dname, COUNT(e.empno) total,\n       SUM(e.sal) total_sal\nFROM dept d JOIN emp e\nON d.deptno = e.deptno\nGROUP BY d.dname;\n\nSELECT * FROM dept_summary\nORDER BY dname;\n\nUPDATE dept_summary SET total = 10\nWHERE dname = 'SALES';\n\nCREATE VIEW emp_annual (id, name, annual)\nAS SELECT empno, ename, sal * 12\nFROM emp;\n\nUPDATE emp_annual SET annual = 0\nWHERE id = 101;"}, "out": "View created.\n\nDNAME    TOTAL TOTAL_SAL\n-------- ----- ---------\nACCOUNTS     2    130000\nRESEARCH     3    127000\nSALES        4    136000\n\nERROR at line 1:\nORA-01732: data manipulation operation not legal on this view\n\nView created.\n\nERROR at line 1:\nORA-01733: virtual column not allowed here", "expl": {"en": "\n<ul><li>A <b>complex view</b> uses joins, group functions, GROUP BY, DISTINCT or expressions. It is very useful for reports.</li>\n<li>DML on a group view is not allowed: <b>ORA-01732</b>.</li>\n<li>A column made from an expression (sal * 12) is a <b>virtual column</b>; it cannot be updated (<b>ORA-01733</b>), but the other columns of that view can be.</li>\n<li>Column aliases can be given in the view header: <code>emp_annual (id, name, annual)</code>.</li></ul>\n"}}, {"id": "q4_16", "title": {"en": "WITH CHECK OPTION"}, "code": {"en": "CREATE VIEW emp30 AS\nSELECT empno, ename, sal, deptno\nFROM emp WHERE deptno = 30\nWITH CHECK OPTION;\n\nINSERT INTO emp30\nVALUES (112, 'ZARA', 21000, 30);\n\nINSERT INTO emp30\nVALUES (113, 'TINA', 21000, 10);\n\nUPDATE emp30 SET deptno = 20\nWHERE ename = 'VIJAY';\n\nUPDATE emp30 SET sal = 21000\nWHERE ename = 'VIJAY';"}, "out": "View created.\n\n1 row created.\n\nERROR at line 1:\nORA-01402: view WITH CHECK OPTION where-clause violation\n\nERROR at line 1:\nORA-01402: view WITH CHECK OPTION where-clause violation\n\n1 row updated.", "expl": {"en": "\n<ul><li><b>WITH CHECK OPTION</b> allows only those inserts and updates whose resulting rows can still be seen through the view.</li>\n<li>Inserting a department 10 row, or moving VIJAY to department 20, would make the row disappear from EMP30, so Oracle gives <b>ORA-01402: view WITH CHECK OPTION where-clause violation</b>.</li>\n<li>Changes that keep deptno = 30 are allowed.</li></ul>\n"}}, {"id": "q4_17", "title": {"en": "WITH READ ONLY view"}, "code": {"en": "CREATE VIEW emp_public AS\nSELECT empno, ename, job\nFROM emp\nWITH READ ONLY;\n\nSELECT * FROM emp_public\nWHERE job = 'MANAGER'\nORDER BY empno;\n\nUPDATE emp_public SET job = 'CEO'\nWHERE empno = 101;\n\nDELETE FROM emp_public;"}, "out": "View created.\n\nEMPNO ENAME JOB\n----- ----- -------\n  102 AMIT  MANAGER\n  103 PRIYA MANAGER\n\nERROR at line 1:\nORA-42399: cannot perform a DML operation on a read-only view\n\nERROR at line 1:\nORA-42399: cannot perform a DML operation on a read-only view", "expl": {"en": "\n<ul><li>A <b>READ ONLY</b> view can only be queried. Any INSERT, UPDATE or DELETE through it gives <b>ORA-42399</b>.</li>\n<li>Use it to let users see data (without salary) but never change it.</li></ul>\n"}}, {"id": "q4_18", "title": {"en": "Alter, replace and drop a view"}, "code": {"en": "CREATE VIEW v_emp AS\nSELECT empno, ename FROM emp;\n\nCREATE OR REPLACE VIEW v_emp AS\nSELECT empno, ename, sal FROM emp\nWHERE sal > 50000;\n\nALTER VIEW v_emp COMPILE;\n\nSELECT * FROM v_emp ORDER BY empno;\n\nSELECT view_name, text\nFROM user_views;\n\nDROP VIEW v_emp;\n\nSELECT * FROM v_emp;"}, "out": "View created.\n\nView created.\n\nView altered.\n\nEMPNO ENAME    SAL\n----- ------ -----\n  101 RAJESH 90000\n  102 AMIT   60000\n  103 PRIYA  58000\n\nVIEW_NAME TEXT\n--------- ---------------------------------------------------\nV_EMP     SELECT empno, ename, sal FROM emp WHERE sal > 50000\n\nView dropped.\n\nERROR at line 1:\nORA-00942: table or view does not exist", "expl": {"en": "\n<ul><li><b>CREATE OR REPLACE VIEW</b> changes the definition of an existing view without dropping it (privileges granted on it are kept).</li>\n<li><b>ALTER VIEW ... COMPILE</b> recompiles a view, e.g. after its base table was changed. (ALTER VIEW cannot change the query.)</li>\n<li><b>USER_VIEWS</b> stores the view's query text.</li>\n<li><b>DROP VIEW</b> removes only the definition; the data in EMP is not affected. Afterwards the view no longer exists (ORA-00942).</li></ul>\n"}}, {"id": "q4_19", "title": {"en": "Create, use and drop a synonym"}, "code": {"en": "CREATE SYNONYM e FOR emp;\n\nSELECT ename, sal FROM e\nWHERE deptno = 10\nORDER BY ename;\n\nUPDATE e SET sal = 16000\nWHERE empno = 110;\n\nSELECT synonym_name, table_owner,\n       table_name\nFROM user_synonyms;\n\nDROP SYNONYM e;\n\nSELECT COUNT(*) FROM e;"}, "out": "Synonym created.\n\nENAME    SAL\n------ -----\nHETAL  40000\nRAJESH 90000\n\n1 row updated.\n\nSYNONYM_NAME TABLE_OWNER TABLE_NAME\n------------ ----------- ----------\nE            SCOTT       EMP\n\nSynonym dropped.\n\nERROR at line 1:\nORA-00942: table or view does not exist", "expl": {"en": "\n<ul><li>A <b>synonym</b> is an alias (another name) for a table, view, sequence or other object. It stores no data.</li>\n<li>All SELECT and DML statements on the synonym work on the real table EMP.</li>\n<li>It hides the real owner and name, and gives a short name for a long one (e.g. <code>CREATE PUBLIC SYNONYM emp FOR scott.emp</code>, so other users need not write scott.emp).</li>\n<li>After DROP SYNONYM the name no longer exists, but the table is unaffected.</li></ul>\n"}}, {"id": "q4_20", "title": {"en": "Sequence with NEXTVAL and CURRVAL"}, "code": {"en": "CREATE TABLE bill (\n  bill_no NUMBER(5) PRIMARY KEY,\n  cust    VARCHAR2(15)\n);\n\nCREATE SEQUENCE seq_bill\nSTART WITH 1001\nINCREMENT BY 1\nNOCACHE;\n\nINSERT INTO bill\nVALUES (seq_bill.NEXTVAL, 'Aarav');\nINSERT INTO bill\nVALUES (seq_bill.NEXTVAL, 'Diya');\nINSERT INTO bill\nVALUES (seq_bill.NEXTVAL, 'Karan');\n\nSELECT * FROM bill ORDER BY bill_no;\n\nSELECT seq_bill.CURRVAL FROM dual;"}, "out": "Table created.\n\nSequence created.\n\n1 row created.\n\n1 row created.\n\n1 row created.\n\nBILL_NO CUST\n------- -----\n   1001 Aarav\n   1002 Diya\n   1003 Karan\n\nCURRVAL\n-------\n   1003", "expl": {"en": "\n<ul><li>A <b>sequence</b> generates unique numbers automatically; it is mostly used for primary key values such as bill numbers.</li>\n<li><b>NEXTVAL</b> returns the next number and advances the sequence; <b>CURRVAL</b> returns the last number given by NEXTVAL in this session.</li>\n<li>CURRVAL cannot be used before the first NEXTVAL in a session (ORA-08002).</li></ul>\n"}}, {"id": "q4_21", "title": {"en": "ALTER SEQUENCE, CYCLE and DROP SEQUENCE"}, "code": {"en": "CREATE SEQUENCE seq_tok\nSTART WITH 1 INCREMENT BY 1\nMAXVALUE 3 NOCYCLE NOCACHE;\n\nSELECT seq_tok.NEXTVAL FROM dual;\nSELECT seq_tok.NEXTVAL FROM dual;\nSELECT seq_tok.NEXTVAL FROM dual;\nSELECT seq_tok.NEXTVAL FROM dual;\n\nALTER SEQUENCE seq_tok\nINCREMENT BY 10 MAXVALUE 100;\n\nSELECT seq_tok.NEXTVAL FROM dual;\n\nSELECT sequence_name, increment_by,\n       max_value, last_number\nFROM user_sequences;\n\nDROP SEQUENCE seq_tok;"}, "out": "Sequence created.\n\nNEXTVAL\n-------\n      1\n\nNEXTVAL\n-------\n      2\n\nNEXTVAL\n-------\n      3\n\nERROR at line 1:\nORA-08004: sequence SEQ_TOK.NEXTVAL exceeds MAXVALUE and cannot be instantiated\n\nSequence altered.\n\nNEXTVAL\n-------\n     13\n\nSEQUENCE_NAME INCREMENT_BY MAX_VALUE LAST_NUMBER\n------------- ------------ --------- -----------\nSEQ_TOK                 10       100          23\n\nSequence dropped.", "expl": {"en": "\n<ul><li>With <b>NOCYCLE</b>, the sequence stops at MAXVALUE: the 4th call gives <b>ORA-08004</b>. With <b>CYCLE</b> it would start again from MINVALUE.</li>\n<li><b>ALTER SEQUENCE</b> can change INCREMENT BY, MAXVALUE, MINVALUE, CYCLE and CACHE, but <b>not START WITH</b> (drop and re-create the sequence for that).</li>\n<li>After the change, the next number is 3 + 10 = 13. <b>USER_SEQUENCES</b> shows the settings; LAST_NUMBER is the next number to be given.</li></ul>\n"}}, {"id": "q4_22", "title": {"en": "Simple, composite and unique indexes"}, "code": {"en": "CREATE INDEX idx_ename ON emp (ename);\n\nCREATE INDEX idx_dept_job\nON emp (deptno, job);\n\nCREATE UNIQUE INDEX idx_dname\nON dept (dname);\n\nSELECT index_name, table_name,\n       uniqueness\nFROM user_indexes\nORDER BY table_name, index_name;\n\nSELECT index_name, column_name,\n       column_position\nFROM user_ind_columns\nWHERE index_name = 'IDX_DEPT_JOB'\nORDER BY column_position;\n\nSELECT ename, sal FROM emp\nWHERE ename = 'NEHA';"}, "out": "Index created.\n\nIndex created.\n\nIndex created.\n\nINDEX_NAME   TABLE_NAME UNIQUENESS\n------------ ---------- ----------\nIDX_DNAME    DEPT       UNIQUE\nPK_DEPT      DEPT       UNIQUE\nIDX_DEPT_JOB EMP        NONUNIQUE\nIDX_ENAME    EMP        NONUNIQUE\nPK_EMP       EMP        UNIQUE\n\nINDEX_NAME   COLUMN_NAME COLUMN_POSITION\n------------ ----------- ---------------\nIDX_DEPT_JOB DEPTNO                    1\nIDX_DEPT_JOB JOB                       2\n\nENAME   SAL\n----- -----\nNEHA  45000", "expl": {"en": "\n<ul><li>An <b>index</b> speeds up searching (WHERE, JOIN, ORDER BY) on its columns, like the index of a book. Oracle uses it automatically; queries do not change.</li>\n<li><b>Composite index</b>: on two or more columns (deptno, job); most useful when the WHERE clause uses the leading column.</li>\n<li><b>Unique index</b>: also stops duplicate values. PK_DEPT and PK_EMP were created automatically by the primary keys.</li></ul>\n"}}, {"id": "q4_23", "title": {"en": "Index rules and DROP INDEX"}, "code": {"en": "CREATE UNIQUE INDEX idx_job ON emp (job);\n\nCREATE INDEX idx_empno ON emp (empno);\n\nCREATE INDEX idx_sal ON emp (sal);\n\nDROP INDEX pk_emp;\n\nDROP INDEX idx_sal;\n\nINSERT INTO dept\nVALUES (50, 'HR', 'SURAT');\nCREATE UNIQUE INDEX idx_loc\nON dept (loc);"}, "out": "ERROR at line 1:\nORA-01452: cannot CREATE UNIQUE INDEX; duplicate keys found\n\nERROR at line 1:\nORA-01408: such column list already indexed\n\nIndex created.\n\nERROR at line 1:\nORA-02429: cannot drop index used for enforcement of unique/primary key\n\nIndex dropped.\n\n1 row created.\n\nERROR at line 1:\nORA-01452: cannot CREATE UNIQUE INDEX; duplicate keys found", "expl": {"en": "\n<ul><li>A unique index cannot be created on a column that already has duplicates (several CLERKs): <b>ORA-01452</b>.</li>\n<li>EMPNO is already indexed by its primary key: <b>ORA-01408</b>.</li>\n<li>An index that enforces a primary key / unique constraint cannot be dropped directly (<b>ORA-02429</b>); drop or disable the constraint instead.</li>\n<li>After a second SURAT department is inserted, a unique index on LOC also fails with ORA-01452.</li>\n<li><b>DROP INDEX</b> removes only the index, never the table data. Too many indexes slow down INSERT, UPDATE and DELETE, because every index must be updated as well.</li></ul>\n"}}], "diagrams": [{"id": "db4_constraints", "title": {"en": "Types of Integrity Constraints"}, "file": "diagrams/db4_constraints.svg"}, {"id": "db4_pk_unique", "title": {"en": "PRIMARY KEY vs UNIQUE"}, "file": "diagrams/db4_pk_unique.svg"}, {"id": "db4_fk", "title": {"en": "Foreign Key: Parent and Child"}, "file": "diagrams/db4_fk.svg"}, {"id": "db4_cascade", "title": {"en": "Delete Rules for a Parent Row"}, "file": "diagrams/db4_cascade.svg"}, {"id": "db4_objects", "title": {"en": "Oracle Database Objects"}, "file": "diagrams/db4_objects.svg"}, {"id": "db4_view", "title": {"en": "A View is a Window on a Table"}, "file": "diagrams/db4_view.svg"}, {"id": "db4_view_types", "title": {"en": "Simple View vs Complex View"}, "file": "diagrams/db4_view_types.svg"}, {"id": "db4_sequence", "title": {"en": "Sequence: Automatic Number Generator"}, "file": "diagrams/db4_sequence.svg"}, {"id": "db4_index", "title": {"en": "Index on EMP(ENAME)"}, "file": "diagrams/db4_index.svg"}], "syntax": [{"title": {"en": "Integrity Constraints"}, "items": [{"name": {"en": "Column and table level"}, "f": "-- column level\ncol datatype [CONSTRAINT name] type\n\n-- table level (after all columns)\n[CONSTRAINT name] type (col1, col2)", "terms": {"en": "NOT NULL is column level only; composite keys are table level only."}}, {"name": {"en": "NOT NULL"}, "f": "CREATE TABLE customer (\n  cid   NUMBER(4),\n  cname VARCHAR2(20) NOT NULL,\n  city  VARCHAR2(15)\n        CONSTRAINT nn_city NOT NULL\n);", "terms": {"en": "Error: ORA-01400 cannot insert NULL."}}, {"name": {"en": "CHECK"}, "f": "age   NUMBER(2)\n      CONSTRAINT ck_age\n      CHECK (age BETWEEN 15 AND 30),\ngender CHAR(1)\n      CHECK (gender IN ('M', 'F')),\nCONSTRAINT ck_marks\n  CHECK (marks >= 0 AND marks <= 100)", "terms": {"en": "Error: ORA-02290 check constraint violated."}}, {"name": {"en": "UNIQUE"}, "f": "email VARCHAR2(25)\n      CONSTRAINT uq_email UNIQUE,\nCONSTRAINT uq_phone UNIQUE (phone)", "terms": {"en": "Allows NULLs. Error: ORA-00001."}}, {"name": {"en": "PRIMARY KEY"}, "f": "book_id NUMBER(4)\n        CONSTRAINT pk_book PRIMARY KEY\n\n-- composite key: table level only\nCONSTRAINT pk_enroll\n  PRIMARY KEY (roll, cid)", "terms": {"en": "UNIQUE + NOT NULL; only one per table."}}, {"name": {"en": "FOREIGN KEY"}, "f": "-- column level\ndeptno NUMBER(2)\n       CONSTRAINT fk_emp_dept\n       REFERENCES dept (deptno)\n\n-- table level\nCONSTRAINT fk_emp_dept\n  FOREIGN KEY (deptno)\n  REFERENCES dept (deptno)", "terms": {"en": "ORA-02291 parent key not found; ORA-02292 child record found."}}, {"name": {"en": "Delete rules"}, "f": "deptno NUMBER(2)\n       REFERENCES dept (deptno)\n       ON DELETE CASCADE\n\ndeptno NUMBER(2)\n       REFERENCES dept (deptno)\n       ON DELETE SET NULL", "terms": {"en": "CASCADE deletes child rows; SET NULL keeps them with NULL."}}, {"name": {"en": "Add constraints"}, "f": "ALTER TABLE item\nADD CONSTRAINT pk_item PRIMARY KEY (icode);\n\nALTER TABLE item\nADD CONSTRAINT ck_rate CHECK (rate > 0);\n\nALTER TABLE emp\nADD CONSTRAINT fk_dept FOREIGN KEY (deptno)\nREFERENCES dept (deptno);\n\nALTER TABLE item MODIFY iname NOT NULL;", "terms": {"en": "Existing rows are validated first."}}, {"name": {"en": "Drop / disable / enable"}, "f": "ALTER TABLE item DROP CONSTRAINT ck_rate;\nALTER TABLE dept DROP PRIMARY KEY CASCADE;\n\nALTER TABLE emp DISABLE CONSTRAINT fk_dept;\nALTER TABLE emp ENABLE CONSTRAINT fk_dept;", "terms": {"en": "CASCADE also drops (or disables) dependent foreign keys."}}, {"name": {"en": "Data dictionary"}, "f": "SELECT constraint_name, constraint_type,\n       table_name, status\nFROM user_constraints\nWHERE table_name = 'EMP';", "terms": {"en": "Types: P primary, U unique, R foreign, C check / NOT NULL."}}]}, {"title": {"en": "Views"}, "items": [{"name": {"en": "CREATE VIEW"}, "f": "CREATE [OR REPLACE] [FORCE] VIEW name\n  [(alias1, alias2, ...)]\nAS SELECT ...\n[WITH CHECK OPTION]\n[WITH READ ONLY];", "terms": {"en": "A view stores only the query, not data."}}, {"name": {"en": "Simple view"}, "f": "CREATE VIEW emp20 AS\nSELECT empno, ename, job, sal\nFROM emp\nWHERE deptno = 20;\n\nSELECT * FROM emp20;", "terms": {"en": ""}}, {"name": {"en": "Complex view"}, "f": "CREATE VIEW dept_summary AS\nSELECT d.dname, COUNT(e.empno) total,\n       SUM(e.sal) total_sal\nFROM dept d JOIN emp e\nON d.deptno = e.deptno\nGROUP BY d.dname;", "terms": {"en": "DML not allowed with GROUP BY / DISTINCT (ORA-01732)."}}, {"name": {"en": "CHECK OPTION / READ ONLY"}, "f": "CREATE VIEW emp30 AS\nSELECT empno, ename, sal, deptno\nFROM emp WHERE deptno = 30\nWITH CHECK OPTION;\n\nCREATE VIEW emp_public AS\nSELECT empno, ename, job FROM emp\nWITH READ ONLY;", "terms": {"en": "ORA-01402 check option violation; ORA-42399 read-only view."}}, {"name": {"en": "Change and drop"}, "f": "CREATE OR REPLACE VIEW v_emp AS\nSELECT empno, ename, sal FROM emp;\n\nALTER VIEW v_emp COMPILE;\n\nDROP VIEW v_emp;", "terms": {"en": "Use CREATE OR REPLACE to change the query."}}]}, {"title": {"en": "Synonyms, Sequences, Indexes"}, "items": [{"name": {"en": "Synonym"}, "f": "CREATE [PUBLIC] SYNONYM syn_name\nFOR [schema.]object_name;\n\nDROP [PUBLIC] SYNONYM syn_name;\n\nCREATE SYNONYM e FOR emp;\nSELECT * FROM e;", "terms": {"en": "PUBLIC synonyms are available to all users."}}, {"name": {"en": "CREATE SEQUENCE"}, "f": "CREATE SEQUENCE seq_name\n  [START WITH n]\n  [INCREMENT BY n]\n  [MINVALUE n | NOMINVALUE]\n  [MAXVALUE n | NOMAXVALUE]\n  [CYCLE | NOCYCLE]\n  [CACHE n | NOCACHE];", "terms": {"en": "Defaults: START WITH 1, INCREMENT BY 1, NOCYCLE, CACHE 20."}}, {"name": {"en": "NEXTVAL / CURRVAL"}, "f": "CREATE SEQUENCE seq_bill\nSTART WITH 1001 INCREMENT BY 1;\n\nINSERT INTO bill\nVALUES (seq_bill.NEXTVAL, 'Aarav');\n\nSELECT seq_bill.CURRVAL FROM dual;", "terms": {"en": "CURRVAL works only after NEXTVAL in the session."}}, {"name": {"en": "ALTER / DROP SEQUENCE"}, "f": "ALTER SEQUENCE seq_bill\n  INCREMENT BY 10\n  MAXVALUE 99999\n  CYCLE;\n\nDROP SEQUENCE seq_bill;", "terms": {"en": "START WITH cannot be altered."}}, {"name": {"en": "CREATE / DROP INDEX"}, "f": "CREATE [UNIQUE] INDEX index_name\nON table_name (col1 [, col2 ...]);\n\nDROP INDEX index_name;", "terms": {"en": "PRIMARY KEY and UNIQUE create a unique index automatically."}}, {"name": {"en": "Index examples"}, "f": "CREATE INDEX idx_ename ON emp (ename);\n\nCREATE UNIQUE INDEX idx_dname\nON dept (dname);\n\nCREATE INDEX idx_dept_job\nON emp (deptno, job);", "terms": {"en": "Composite index: leading column matters."}}]}], "viva": [{"title": {"en": "Integrity Constraints"}, "items": [{"q": {"en": "What is an integrity constraint?"}, "a": {"en": "A rule defined on a table column that the DBMS checks automatically to keep the data valid and consistent."}}, {"q": {"en": "Name the three types of integrity constraints."}, "a": {"en": "Domain integrity (NOT NULL, CHECK), entity integrity (UNIQUE, PRIMARY KEY) and referential integrity (FOREIGN KEY)."}}, {"q": {"en": "What is the difference between column-level and table-level constraints?"}, "a": {"en": "A column-level constraint is written with the column and applies to it; a table-level constraint is written after all columns and can use several columns."}}, {"q": {"en": "Which constraint can only be defined at column level?"}, "a": {"en": "NOT NULL."}}, {"q": {"en": "When must a constraint be defined at table level?"}, "a": {"en": "When it uses more than one column, e.g. a composite primary key."}}, {"q": {"en": "What name does Oracle give to an unnamed constraint?"}, "a": {"en": "A system name like SYS_C008401."}}, {"q": {"en": "What does a CHECK constraint do?"}, "a": {"en": "It allows only values for which a given condition is true, e.g. CHECK (marks BETWEEN 0 AND 100)."}}, {"q": {"en": "Can a UNIQUE column contain NULL?"}, "a": {"en": "Yes, and several rows can contain NULL."}}, {"q": {"en": "What is the difference between PRIMARY KEY and UNIQUE?"}, "a": {"en": "A primary key does not allow NULL and there can be only one per table; UNIQUE allows NULLs and there can be many."}}, {"q": {"en": "What is a composite primary key?"}, "a": {"en": "A primary key made of two or more columns, defined at table level, e.g. PRIMARY KEY (roll, cid)."}}, {"q": {"en": "What is a foreign key?"}, "a": {"en": "A column whose values must match the primary or unique key of another (parent) table, or be NULL."}}, {"q": {"en": "Which table must be created first: parent or child?"}, "a": {"en": "The parent (referenced) table."}}, {"q": {"en": "What does ON DELETE CASCADE do?"}, "a": {"en": "When a parent row is deleted, all its child rows are deleted automatically."}}, {"q": {"en": "What does ON DELETE SET NULL do?"}, "a": {"en": "When a parent row is deleted, the foreign key in its child rows is set to NULL."}}, {"q": {"en": "What is a self-referencing foreign key?"}, "a": {"en": "A foreign key that refers to the primary key of the same table, e.g. EMP.MGR → EMP.EMPNO."}}, {"q": {"en": "What is ORA-02291?"}, "a": {"en": "Integrity constraint violated – parent key not found (child value has no matching parent)."}}, {"q": {"en": "What is ORA-02292?"}, "a": {"en": "Integrity constraint violated – child record found (parent row has children)."}}, {"q": {"en": "How do you add a primary key to an existing table?"}, "a": {"en": "ALTER TABLE t ADD CONSTRAINT pk_t PRIMARY KEY (col);"}}, {"q": {"en": "Why disable a constraint?"}, "a": {"en": "To load or change a large amount of data quickly; it is enabled again afterwards."}}, {"q": {"en": "Which dictionary view shows constraints?"}, "a": {"en": "USER_CONSTRAINTS (and USER_CONS_COLUMNS for their columns)."}}]}, {"title": {"en": "Views and Synonyms"}, "items": [{"q": {"en": "What is a view?"}, "a": {"en": "A virtual table based on a stored SELECT query; it stores no data."}}, {"q": {"en": "Give two advantages of views."}, "a": {"en": "Security (hide columns and rows) and simplicity (hide complex joins)."}}, {"q": {"en": "What is the difference between a simple and a complex view?"}, "a": {"en": "A simple view uses one table without functions or grouping and allows DML; a complex view uses joins, functions or GROUP BY and may not allow DML."}}, {"q": {"en": "Can we insert data through a view?"}, "a": {"en": "Yes, through a simple view; the row is inserted into the base table."}}, {"q": {"en": "What is WITH CHECK OPTION?"}, "a": {"en": "It allows only inserts and updates that produce rows visible through the view."}}, {"q": {"en": "What is WITH READ ONLY?"}, "a": {"en": "It prevents any INSERT, UPDATE or DELETE through the view."}}, {"q": {"en": "How do you change the query of a view?"}, "a": {"en": "With CREATE OR REPLACE VIEW."}}, {"q": {"en": "What happens to the table when a view is dropped?"}, "a": {"en": "Nothing; only the view definition is removed."}}, {"q": {"en": "What is a synonym?"}, "a": {"en": "An alternative name (alias) for a database object such as a table or view."}}, {"q": {"en": "What is a public synonym?"}, "a": {"en": "A synonym available to all users, created with CREATE PUBLIC SYNONYM."}}]}, {"title": {"en": "Sequences and Indexes"}, "items": [{"q": {"en": "What is a sequence?"}, "a": {"en": "A database object that generates unique numbers automatically, mainly for primary keys."}}, {"q": {"en": "What is the difference between NEXTVAL and CURRVAL?"}, "a": {"en": "NEXTVAL gives the next number and advances the sequence; CURRVAL gives the last number generated in the session."}}, {"q": {"en": "Can CURRVAL be used before NEXTVAL?"}, "a": {"en": "No, it gives ORA-08002."}}, {"q": {"en": "What does CYCLE mean in a sequence?"}, "a": {"en": "After reaching MAXVALUE the sequence starts again from MINVALUE."}}, {"q": {"en": "Which sequence option cannot be altered?"}, "a": {"en": "START WITH."}}, {"q": {"en": "What is the use of CACHE in a sequence?"}, "a": {"en": "Oracle pre-allocates numbers in memory for faster access (default 20)."}}, {"q": {"en": "What is an index?"}, "a": {"en": "An object that stores sorted column values with ROWIDs to speed up searching."}}, {"q": {"en": "What is a composite index?"}, "a": {"en": "An index on two or more columns."}}, {"q": {"en": "What is a unique index?"}, "a": {"en": "An index that does not allow duplicate values; created automatically for PRIMARY KEY and UNIQUE."}}, {"q": {"en": "What is a disadvantage of too many indexes?"}, "a": {"en": "They slow down INSERT, UPDATE and DELETE and use extra storage."}}, {"q": {"en": "Does DROP INDEX delete table data?"}, "a": {"en": "No, only the index is removed."}}]}], "exam_questions": [{"q": {"en": "What is an integrity constraint? List the types of integrity constraints."}, "marks": 3}, {"q": {"en": "Explain domain integrity constraints NOT NULL and CHECK with examples."}, "marks": 4}, {"q": {"en": "Explain entity integrity constraints UNIQUE and PRIMARY KEY with examples."}, "marks": 4}, {"q": {"en": "Differentiate between PRIMARY KEY and UNIQUE constraints."}, "marks": 3}, {"q": {"en": "Explain FOREIGN KEY constraint with ON DELETE CASCADE with an example."}, "marks": 4}, {"q": {"en": "Explain all integrity constraints with suitable examples."}, "marks": 7}, {"q": {"en": "Differentiate between column-level and table-level constraints."}, "marks": 3}, {"q": {"en": "Write SQL to add, drop, enable and disable a constraint on an existing table."}, "marks": 4}, {"q": {"en": "Create tables DEPT and EMP with appropriate primary key, foreign key, NOT NULL and CHECK constraints."}, "marks": 4}, {"q": {"en": "What is a view? Explain its advantages."}, "marks": 3}, {"q": {"en": "Explain CREATE VIEW, ALTER VIEW and DROP VIEW with examples."}, "marks": 4}, {"q": {"en": "Differentiate between a simple view and a complex view."}, "marks": 3}, {"q": {"en": "Explain WITH CHECK OPTION and WITH READ ONLY with examples."}, "marks": 4}, {"q": {"en": "What is a synonym? Explain CREATE SYNONYM and DROP SYNONYM."}, "marks": 3}, {"q": {"en": "What is a sequence? Explain CREATE SEQUENCE with all options and an example."}, "marks": 4}, {"q": {"en": "Explain NEXTVAL and CURRVAL. Write SQL to insert rows using a sequence."}, "marks": 3}, {"q": {"en": "What is an index? Explain unique and composite indexes with examples."}, "marks": 4}, {"q": {"en": "Explain views, synonyms, sequences and indexes with syntax and examples."}, "marks": 7}], "tabs": ["notes", "programs", "diagrams", "syntax", "viva", "exam"], "intro_text": {"en": "Detailed notes as per GTU syllabus with diagrams, solved Oracle SQL queries with real output, syntax and viva."}};

  document.querySelectorAll('.menu.show').forEach(x=>{ if(!m || x!==m.nextElementSibling) x.classList.remove('show'); });
  if (m){ m.nextElementSibling.classList.toggle('show'); return; }
  const act = e.target.closest('[data-act]');
  if (act){ act.closest('.sec').querySelectorAll('.card').forEach(c=>{ if(c.querySelector('.a')) c.classList.toggle('open', act.dataset.act==='expand'); }); act.parentElement.classList.remove('show'); return; }
  const dg = e.target.closest('[data-dg]');
  if (dg){ const id=dg.dataset.dg; document.getElementById('mt').textContent=t(U.diagrams.find(d=>d.id===id).title); document.getElementById('zw').innerHTML=SVG[id]; setZoom(1); document.getElementById('modal').classList.add('show'); return; }
  if (e.target.closest('#mx')) document.getElementById('modal').classList.remove('show');
  if (e.target.closest('#zi')) setZoom(zoom+0.5);
  if (e.target.closest('#zo')) setZoom(zoom-0.5);
  if (e.target.closest('#zr')) setZoom(1);
});
render();
</script></body></html>
