<style>

<script>
const U = {"subject": "DI05007021", "unit": 1, "format": "notes", "title": {"en": "Introduction to Information Security"}, "hours": 6, "weightage": 15, "tabs": ["notes", "programs", "diagrams", "syntax", "viva", "exam"], "intro_text": {"en": "English-only Unit 1: need for security; CIA goals; active/passive attacks and DoS; five security services; specific and pervasive mechanisms. Includes safe Practical 1 guidance, six executed supporting examples, diagrams, viva and answered revision. Suggested practice-question marks are not official GTU paper marks. Actual ping permission denial is reported honestly."}, "notes": [{"title": {"en": "1. Foundations and Security Goals"}, "items": [{"h": {"en": "1.1 Information security and the need for protection"}, "body": {"en": "<p><b>Information security</b> protects information and the systems that handle it against unauthorized disclosure, improper change or destruction, and loss of useful access. It applies to digital records, paper, devices, people and procedures—not only antivirus software.</p><ul><li><b>Assets:</b> student records, credentials, business documents, services and reputation.</li><li><b>Threat:</b> a potential cause of harm; <b>vulnerability:</b> a weakness that may be exploited; <b>attack:</b> an attempt to violate security. An accidental fault can also harm an asset without being an attack.</li><li><b>Why security is needed:</b> protect privacy and valuable work, maintain trustworthy records, keep services usable, and reduce operational and financial harm.</li><li><b>Controls:</b> combine technical measures with physical protection and administrative procedures. Choose controls for the asset, threat and consequence; no single product removes all risk.</li></ul>"}}, {"h": {"en": "1.2 The CIA triad"}, "body": {"en": "<p>The three core goals are <b>confidentiality, integrity and availability</b>. Consider a college result portal:</p><table><tr><th>Goal</th><th>Meaning</th><th>Failure and useful controls</th></tr><tr><td>Confidentiality</td><td>Only authorized parties can access or receive protected information.</td><td>A result file is disclosed to an outsider. Use access restrictions and suitable encryption.</td></tr><tr><td>Integrity</td><td>Information is not improperly modified or destroyed.</td><td>A mark is changed without permission. Use authorization, protected integrity checks and audit records.</td></tr><tr><td>Availability</td><td>Authorized users have timely, reliable access to information and services.</td><td>Students cannot obtain results when needed. Use capacity planning, recovery procedures and suitable redundancy.</td></tr></table><p>One incident can affect several goals. Encryption does not keep a failed server online; a backup does not by itself stop disclosure; a publicly stored hash does not authenticate a sender.</p>"}, "diagram": "sec1_cia"}]}, {"title": {"en": "2. Security Attacks"}, "items": [{"h": {"en": "2.1 Passive attacks: observation without alteration"}, "body": {"en": "<p>A <b>passive attack</b> observes information or communication without altering the system or data.</p><ul><li><b>Release of message contents:</b> unauthorized reading of an unprotected message.</li><li><b>Traffic analysis:</b> learning from endpoints, timing, frequency or volume, even when message contents are encrypted.</li><li><b>Main concern:</b> confidentiality. Observation can leave little visible evidence, so prevention is important. Encryption protects content; it does not automatically hide all metadata.</li></ul><p>Passive does not mean harmless or authorized. Reading someone else’s traffic without permission is not part of this lab.</p>"}, "diagram": "sec1_attacks"}, {"h": {"en": "2.2 Active attacks: alteration, impersonation or disruption"}, "body": {"en": "<p>An <b>active attack</b> deliberately changes system state, introduces false information, impersonates an entity or disrupts service.</p><table><tr><th>Type</th><th>Classroom example</th><th>Relevant protection</th></tr><tr><td>Masquerade</td><td>An outsider acts as an authorized staff member.</td><td>Strong authentication and appropriate access control.</td></tr><tr><td>Replay</td><td>A previously valid message is submitted again without permission.</td><td>Authenticated freshness, such as correctly checked nonces or sequence numbers.</td></tr><tr><td>Modification</td><td>An attendance value is changed in transit.</td><td>Authenticated integrity plus authorization at the endpoint.</td></tr><tr><td>Denial of service</td><td>A malicious action prevents legitimate service use.</td><td>Layered prevention, detection, response and recovery.</td></tr></table><p><b>Compare:</b> passive observation mainly seeks information; active attacks alter behaviour, information or access. Detection and recovery are especially important for active attacks. Neither class is always completely preventable.</p>"}}, {"h": {"en": "2.3 Denial of service, distributed DoS and ordinary faults"}, "body": {"en": "<p><b>DoS</b> aims to deny legitimate use of a resource. <b>DDoS</b> is a distributed form in which multiple systems participate. The main CIA goal affected is availability, although an incident may cause other harm too.</p><ul><li><b>Recognize:</b> failed service requests, unusual resource consumption or abnormal traffic can justify investigation. They do not alone prove a malicious attack.</li><li><b>Respond defensively:</b> follow the incident procedure, preserve relevant evidence, involve the administrator/provider, apply appropriate traffic controls and recover the service. Avoid blocking legitimate users unnecessarily.</li><li><b>Important distinction:</b> a broken cable, maintenance, permissions or a configuration error can also cause an outage.</li><li><b>Lab boundary:</b> do not generate floods, exhaust resources or test other people’s hosts. This unit makes no DoS experiment or mitigation-performance claim.</li></ul><p>The cited CISA article is an archived explanation of the concept, not a current policy or a prescribed implementation guide.</p>"}, "diagram": "sec1_dos"}]}, {"title": {"en": "3. Security Services"}, "items": [{"h": {"en": "3.1 What a security service provides"}, "body": {"en": "<p>A <b>security service</b> is a protection supplied to users, data or a communicating system. A <b>mechanism</b> is a means used to supply that protection.</p><table><tr><th>Syllabus service</th><th>Protection sought</th><th>Example</th></tr><tr><td>Confidentiality</td><td>Prevent unauthorized disclosure.</td><td>Restrict who can read a result file.</td></tr><tr><td>Integrity</td><td>Protect against improper changes or destruction.</td><td>Detect an altered attendance message using a trusted integrity mechanism.</td></tr><tr><td>Authentication</td><td>Establish a claimed identity or data origin.</td><td>Verify an account holder or the origin of a protected message.</td></tr><tr><td>Non-repudiation</td><td>Provide evidence against false denial of a relevant action.</td><td>Evidence of message origin or receipt under an agreed process.</td></tr><tr><td>Access control</td><td>Prevent unauthorized use of a resource or operation.</td><td>A student can view their result but cannot edit marks.</td></tr></table><p>Availability remains an essential security <b>goal</b>. This syllabus’s service list and the core X.800 categories above should not be confused with a guarantee that a cryptographic mechanism supplies availability.</p>"}, "diagram": "sec1_services"}, {"h": {"en": "3.2 Authentication versus authorization and access control"}, "body": {"en": "<p><b>Authentication:</b> “Who or what is this?” <b>Authorization:</b> “What is this subject allowed to do?” <b>Access control:</b> enforcement of those permissions.</p><ul><li>A valid student login must not gain the teacher’s permission to change marks. Successful authentication does not authorize every operation.</li><li>Apply least privilege: grant only the access needed for the task, then enforce the policy for each protected operation.</li><li>Authentication may concern a peer/entity or a message’s origin. Integrity and freshness checks are separate requirements; replaying a valid old message can still be harmful.</li><li>Access control helps protect confidentiality and integrity, but a configuration mistake or untrusted enforcement component can defeat it.</li></ul><p>The diagram is a conceptual decision flow, not a deployed authentication server.</p>"}, "diagram": "sec1_authz"}, {"h": {"en": "3.3 Non-repudiation: evidence, not an absolute promise"}, "body": {"en": "<p><b>Non-repudiation of origin</b> addresses a sender falsely denying a message. <b>Non-repudiation of delivery/receipt</b> addresses a recipient falsely denying the relevant delivery or receipt.</p><ul><li>Digital signatures and trusted evidence-handling processes can support non-repudiation. Identity binding, private-key control, timestamps and the applicable procedure matter.</li><li>A signature verifies a cryptographic relationship under its assumptions; it does not automatically prove which human operated a device, that the signed statement is true, or a particular legal result.</li><li><b>HMAC is not a digital signature:</b> both parties sharing the secret can create valid tags, so it does not supply publicly verifiable proof against the other key holder.</li><li>A plain hash is not sender authentication. Encryption alone is not proof of authorship or receipt. Unit 3 covers public keys and certificates in more detail.</li></ul>"}}]}, {"title": {"en": "4. Security Mechanisms"}, "items": [{"h": {"en": "4.1 Eight specific mechanisms in X.800"}, "body": {"en": "<p><b>Specific mechanisms</b> directly support one or more particular security services. Learn each name with one purpose and example; they are not eight interchangeable security products.</p><table><tr><th>Specific mechanism</th><th>Purpose and limitation</th></tr><tr><td>Encipherment</td><td>Transforms data using a cryptographic scheme to help protect confidentiality. Key management matters; encryption alone does not guarantee integrity or availability.</td></tr><tr><td>Digital signature</td><td>Creates a verifiable signature with a private signing key. Supports integrity, origin authentication and evidence for non-repudiation under suitable trust and key-control assumptions.</td></tr><tr><td>Access control</td><td>Enforces which subjects may perform which operations on which resources; e.g. a reader cannot change a protected record.</td></tr><tr><td>Data integrity</td><td>Detects unauthorized changes. Depending on scope, mechanisms may also check ordering, insertion, deletion or replay; a bare message digest alone does not provide all these properties.</td></tr><tr><td>Authentication exchange</td><td>Uses an appropriate protocol to establish a claimed identity or origin, e.g. a protected challenge-response exchange. Freshness checks can resist replay.</td></tr><tr><td>Traffic padding</td><td>Adds protected cover/padding traffic to reduce what an observer can infer from traffic patterns. It does not mean renaming or merely compressing a file.</td></tr><tr><td>Routing control</td><td>Selects or constrains communication paths according to security policy; not a claim that any alternative route is automatically secure.</td></tr><tr><td>Notarization</td><td>Uses a trusted third party to provide evidence about properties of a communication, such as origin or time, under an agreed procedure.</td></tr></table><p>This is the X.800 classification. It is not a recommendation to deploy old algorithms from the standard. Detailed cipher algorithms belong to later units.</p>"}, "diagram": "sec1_specific"}, {"h": {"en": "4.2 Five pervasive mechanisms in X.800"}, "body": {"en": "<p><b>Pervasive mechanisms</b> provide supporting security functions that are not confined to a single particular service. They can support several protections across a system.</p><table><tr><th>Pervasive mechanism</th><th>Meaning and classroom example</th></tr><tr><td>Trusted functionality</td><td>Security-critical functions must behave as intended; e.g. a trustworthy reference monitor. Trusted is an assumption requiring assurance, not a claim of infallibility.</td></tr><tr><td>Security labels</td><td>Associate resources with security attributes such as Public or Restricted so policy can interpret them. Labels alone do not enforce permissions.</td></tr><tr><td>Event detection</td><td>Recognizes selected security-relevant events, such as repeated failed access attempts, and may trigger an alert or response. A detected event is not automatically a confirmed attack.</td></tr><tr><td>Security audit trail</td><td>Records relevant events for examination and accountability. Logs need access protection and integrity controls; plain editable logs are not conclusive proof.</td></tr><tr><td>Security recovery</td><td>Restores an acceptable secure state after a failure or incident, e.g. verified restoration and credential replacement when appropriate. A backup is useful only if recovery works.</td></tr></table><p><b>Contrast:</b> encipherment is a specific protection mechanism; a security audit trail is pervasive support. Both are needed in an appropriate design—pervasive does not mean optional or automatically stronger.</p>"}, "diagram": "sec1_pervasive"}, {"h": {"en": "4.3 Relating goals, services, mechanisms and attacks"}, "body": {"en": "<p>Use this order in a worked answer: <b>asset → threatened goal → required service → suitable mechanism → remaining limitation</b>.</p><table><tr><th>Situation</th><th>Service / mechanism</th><th>Limitation</th></tr><tr><td>An outsider reads a private file.</td><td>Confidentiality / access control and appropriate encryption.</td><td>An authorized recipient may still disclose what they read.</td></tr><tr><td>A protected message is changed.</td><td>Integrity and origin authentication / suitable authenticated integrity checking.</td><td>A bare digest is useful only with a trusted reference; a valid tag alone does not prove freshness.</td></tr><tr><td>A user denies sending an instruction.</td><td>Non-repudiation / signature and trusted evidence process.</td><td>Key compromise and identity/evidence assumptions must be considered.</td></tr><tr><td>A server is unavailable.</td><td>Availability goal / appropriate capacity, monitoring and recovery controls.</td><td>First distinguish attacks from ordinary faults; encryption alone does not repair availability.</td></tr></table><p>Relationships are <b>many-to-many</b>: one mechanism can support several services and a service may require several mechanisms. Avoid “one goal, one magic tool” answers.</p>"}}]}, {"title": {"en": "5. Safe Practical 1 and Revision"}, "items": [{"h": {"en": "5.1 TCP/IP utilities: commands and honest execution labels"}, "body": {"en": "<p><b>Practical 1:</b> execute basic TCP/IP utilities. Use only your own computer or an instructor-authorized lab. Start with read-only observations, record the command, result, interpretation and limitation, and omit private addresses or credentials from shared reports.</p><table><tr><th>Purpose / utility</th><th>Bounded example</th><th>Status in this reference</th></tr><tr><td>Address configuration: ipconfig / ip</td><td>Windows: <code>ipconfig /all</code><br>Linux: <code>ip -j address show dev lo</code></td><td>Linux loopback query actually executed; Windows guided only.</td></tr><tr><td>Reachability: ping</td><td>Linux: <code>ping -n -c 1 -W 2 127.0.0.1</code><br>Windows: <code>ping -n 1 127.0.0.1</code></td><td>Linux attempted; sandbox denied socket permission. No ICMP success claimed.</td></tr><tr><td>Route: tracert / traceroute</td><td>Windows: <code>tracert -d 127.0.0.1</code><br>Linux: <code>traceroute -n 127.0.0.1</code></td><td>Guided only. The executed <code>ip route get</code> is a local route decision, not a hop trace.</td></tr><tr><td>Neighbours: arp / ip neigh</td><td>Windows: <code>arp -a</code><br>Linux: <code>ip -j neigh show dev lo</code></td><td>Linux loopback query executed; an empty neighbour table is normal here.</td></tr><tr><td>Sockets: netstat / ss</td><td>Windows: <code>netstat -an</code><br>Linux: <code>ss -ltnH</code> with a lab-owned port filter</td><td>Filtered ss actually inspected only the example’s own listening socket.</td></tr><tr><td>DNS: nslookup / host</td><td><code>nslookup example.org</code><br><code>host example.org</code></td><td>Guided only. Actual <code>getent ahostsv4 localhost</code> is system name resolution, not proof of a DNS query.</td></tr><tr><td>Registration: whois</td><td><code>whois example.org</code></td><td>Guided public example; not executed. WHOIS is not a host-reachability or ownership-authentication test.</td></tr><tr><td>Capture: tcpdump</td><td><code>tcpdump -i lo -nn -c 1</code></td><td>Guided only; requires suitable permission and an authorized packet source. No captured traffic is claimed.</td></tr><tr><td>Legacy clients: ftp / telnet</td><td><code>ftp &lt;lab-host&gt;</code><br><code>telnet &lt;lab-host&gt; &lt;port&gt;</code></td><td>Guided only, using a disposable instructor-provided service. Legacy plaintext FTP/Telnet are unsuitable for real passwords.</td></tr></table><p>Utilities and permissions differ by OS. Do not change host security settings merely to force a lab result. A denied or unavailable command should be reported honestly and checked with the instructor.</p>"}}, {"h": {"en": "5.2 Six executed supporting examples and their limits"}, "body": {"en": "<p>The downloadable kit contains six small, actually executed Python examples. Python’s standard library handles hashing/HMAC and the private TCP example; the Linux utility examples require existing <code>ip</code>, <code>ss</code>, <code>getent</code> and <code>ping</code>.</p><ul><li><b>01:</b> compare a SHA-256 digest with a trusted reference. This is change detection, not encryption or identity proof.</li><li><b>02:</b> verify a real HMAC tag with an ephemeral key. This is not a public signature or a replay-prevention protocol.</li><li><b>03:</b> exchange exactly one teaching message over private loopback TCP; all sockets and the worker close.</li><li><b>04:</b> read actual loopback address, route and neighbour information.</li><li><b>05:</b> attempt one local ping and record the actual permission denial in this sandbox.</li><li><b>06:</b> resolve localhost through the OS and inspect an owned listening socket, then close it.</li></ul><p>These illustrations do not implement an enterprise security system. They are not substitutes for the later official cipher, simulator, Wireshark or Kali Linux practicals. Windows GUI/commands and those later tools are not claimed as executed.</p>"}, "programs": ["sec1p01", "sec1p02", "sec1p03", "sec1p04", "sec1p05", "sec1p06"]}, {"h": {"en": "5.3 Diagnose carefully and prepare a defensible answer"}, "body": {"en": "<p>For a failed connection, inspect <b>local configuration → name resolution → route/reachability → service listening and policy</b>. Interpret each result within its layer; successful ping is neither a secure-login test nor proof that a web application works.</p><ul><li>A loopback connection tests this computer’s local stack/service, not the Internet connection.</li><li>A permission-denied ping and a working TCP exchange can occur together. Do not label that observation a DoS attack.</li><li>For a theory answer, give a definition, distinguish nearby terms, draw a labelled diagram where useful, and apply one concrete example.</li><li><b>Assessment:</b> theory ESE 70 + PA 30, practical PA 20 + ESE 30 = 150. Unit 1 is 6 hours / 15% syllabus weight; that is not a guaranteed number of questions or marks in a paper.</li><li><b>Practice pool:</b> the following twelve answered questions have suggested 3/4/7-mark practice sizes only. They are original revision questions, not official GTU past-paper questions or a promised paper pattern.</li></ul><p><b>Primary references:</b> <a href=\"https://s3-ap-southeast-1.amazonaws.com/gtusitecirculars/Syallbus/DI05007021.pdf\">GTU DI05007021, Information Security, 2026–27 (uploaded syllabus)</a>, <a href=\"https://csrc.nist.gov/glossary/term/confidentiality\">NIST glossary: confidentiality</a>, <a href=\"https://csrc.nist.gov/glossary/term/integrity\">NIST glossary: integrity</a>, <a href=\"https://csrc.nist.gov/glossary/term/availability\">NIST glossary: availability</a>, <a href=\"https://csrc.nist.gov/glossary/term/passive_attack\">NIST glossary: passive attack</a>, <a href=\"https://www.itu.int/rec/T-REC-X.800-199103-I/en\">ITU-T X.800: security services and specific/pervasive mechanisms</a>, <a href=\"https://www.cisa.gov/news-events/news/understanding-denial-service-attacks\">CISA: Understanding Denial-of-Service Attacks (archived educational article, 2021)</a>, <a href=\"https://docs.python.org/3/library/hashlib.html\">Python: hashlib</a>, <a href=\"https://docs.python.org/3/library/hmac.html\">Python: hmac</a>. Definitions are paraphrased and examples are fictional.</p>"}, "diagram": "sec1_diagnose"}]}, {"title": {"en": "6. Answered Exam-Style Practice — Suggested Marks Only"}, "role": "practice", "items": [{"h": {"en": "Practice 1. Define information security and explain why a college needs it."}, "body": {"en": "<p>Information security protects information and supporting systems against unauthorized disclosure, improper change/destruction and loss of useful access. A college needs it to protect private student records, keep marks accurate and make essential services available. Technical controls, physical protection and procedures work together; antivirus alone is insufficient.</p>"}}, {"h": {"en": "Practice 2. Explain the CIA triad using a result-portal example."}, "body": {"en": "<p><b>Confidentiality:</b> only authorized users can see protected results; use access restrictions and appropriate encryption. <b>Integrity:</b> marks cannot be improperly changed or destroyed; use authorization, protected integrity checks and audit records. <b>Availability:</b> authorized users can obtain results when needed; use suitable capacity and tested recovery. Draw the three labelled goals and give one failure for each. One event may harm multiple goals; no single control guarantees all three.</p>"}}, {"h": {"en": "Practice 3. Differentiate passive and active attacks with examples."}, "body": {"en": "<p>A passive attack observes without altering the system or data: unauthorized message reading and traffic analysis are examples. An active attack changes state, inserts/replays information, impersonates a user or disrupts service: modification, masquerade, replay and DoS are examples. Passive attacks mainly threaten confidentiality and may be hard to notice; active attacks make integrity, authentication, availability, detection and recovery particularly important. Passive does not mean harmless.</p>"}}, {"h": {"en": "Practice 4. Explain DoS and DDoS and distinguish them from an ordinary outage."}, "body": {"en": "<p>DoS is a malicious attempt to prevent legitimate use of a resource. DDoS distributes participation across multiple systems. Both primarily threaten availability. A broken link, planned maintenance or a permission error can also stop access, so an outage alone is not evidence of attack. Investigate, preserve evidence and follow authorized incident-response and recovery procedures. No attack traffic needs to be generated to explain the concept.</p>"}}, {"h": {"en": "Practice 5. Explain the five security services listed in this unit."}, "body": {"en": "<p><b>Confidentiality</b> protects against unauthorized disclosure; <b>integrity</b> protects against improper change/destruction; <b>authentication</b> establishes a claimed identity or data origin; <b>access control</b> prevents unauthorized operations; <b>non-repudiation</b> supplies evidence against false denial of a relevant action. Use a result system to illustrate restricted reading, protected marks, identity checking, permission enforcement and an appropriately signed/evidenced instruction. A service states the protection; mechanisms implement it.</p>"}}, {"h": {"en": "Practice 6. Differentiate authentication, authorization and access control."}, "body": {"en": "<p>Authentication establishes who or what is making a claim. Authorization decides the permitted operations on resources. Access control enforces those decisions. A student may authenticate successfully and be authorized to view their own result, but must still be denied permission to edit a teacher’s mark sheet. Apply least privilege rather than treating login as unrestricted access.</p>"}}, {"h": {"en": "Practice 7. Explain non-repudiation and why HMAC is not a digital signature."}, "body": {"en": "<p>Non-repudiation supplies evidence concerning origin or receipt so a relevant party cannot easily deny the action falsely. A digital signature can support this under identity, key-control and evidence-handling assumptions; it is not an automatic legal or human-identity guarantee. HMAC uses a shared secret, so either holder can generate a valid tag. It therefore does not supply public proof against the other holder. Encryption and a bare hash alone do not provide non-repudiation.</p>"}}, {"h": {"en": "Practice 8. List and explain the eight specific security mechanisms."}, "body": {"en": "<p><b>Encipherment:</b> cryptographic transformation; <b>digital signature:</b> verifiable signing; <b>access control:</b> enforcement of permitted use; <b>data integrity:</b> protected change detection and, where designed, sequence checks; <b>authentication exchange:</b> establish a claimed identity/origin; <b>traffic padding:</b> reduce inference from traffic patterns; <b>routing control:</b> constrain paths by security policy; <b>notarization:</b> trusted third-party evidence. Explain a purpose, not just an acronym. The mechanisms may support overlapping services.</p>"}}, {"h": {"en": "Practice 9. Explain five pervasive security mechanisms with examples."}, "body": {"en": "<p><b>Trusted functionality:</b> dependable security-critical enforcement; <b>security labels:</b> security attributes interpreted by policy; <b>event detection:</b> recognize selected security-relevant events; <b>security audit trail:</b> protected records for examination/accountability; <b>security recovery:</b> restore an acceptable secure state. For a result system, use a trustworthy permission check, a Restricted label, a failed-access alert, protected logs and verified restoration. Labels and editable logs alone do not enforce security or conclusively prove an event.</p>"}}, {"h": {"en": "Practice 10. Differentiate a security service and a mechanism with two mappings."}, "body": {"en": "<p>A service states what protection is supplied; a mechanism describes a means of supplying it. Confidentiality may use suitable encryption together with access restrictions. Integrity and origin authentication may use a suitable authenticated integrity mechanism. A service can need several mechanisms, and one mechanism can support several services. Do not claim that encryption alone guarantees integrity, identity and availability.</p>"}}, {"h": {"en": "Practice 11. A message and its plain hash both match after replacement. Is the sender authenticated?"}, "body": {"en": "<p>No. An attacker who can replace both data and the digest can make a matching pair. A hash comparison is useful only when its reference is trustworthy and does not itself identify a sender. A properly keyed MAC can support authentication among secret holders; public signatures require their own trust assumptions. Neither a matching hash nor a MAC by itself proves freshness or human identity.</p>"}}, {"h": {"en": "Practice 12. Ping is denied, but a private TCP exchange succeeds. Interpret the observation."}, "body": {"en": "<p>The recorded ping result is a local socket-permission denial, not evidence of an ICMP response and not proof of a network attack. A successful one-message loopback TCP exchange demonstrates that particular local TCP service at that moment. It does not prove Internet access, confidentiality, authenticated login or future availability. Record the command and limitation, and use an authorized alternative rather than disabling security settings.</p>"}}]}], "programs": [{"id": "sec1p01", "title": {"en": "Integrity check against a trusted reference"}, "code": {"en": "import hashlib\n\noriginal = b\"Student S01: attendance=80\"\nchanged = b\"Student S01: attendance=30\"\ntrusted_digest = hashlib.sha256(original).digest()\n\ndef matches_reference(data):\n    return hashlib.sha256(data).digest() == trusted_digest\n\nprint(\"unchanged_matches:\", matches_reference(original))\nprint(\"changed_matches:\", matches_reference(changed))\nprint(\"sha256_bytes:\", len(trusted_digest))\n"}, "expl": {"en": "SHA-256 really hashes both byte strings. A mismatch detects this change only because the reference digest is trusted. A bare hash does not identify the sender, encrypt data or prevent an attacker replacing both message and digest."}, "out": "unchanged_matches: True\nchanged_matches: False\nsha256_bytes: 32\n"}, {"id": "sec1p02", "title": {"en": "Message integrity with HMAC — not encryption or a signature"}, "code": {"en": "import hashlib\nimport hmac\nimport secrets\n\nsecret = secrets.token_bytes(32)\nmessage = b\"Student S01: attendance=80\"\nchanged = b\"Student S01: attendance=30\"\ntag = hmac.new(secret, message, hashlib.sha256).digest()\n\ndef verifies(data):\n    candidate = hmac.new(secret, data, hashlib.sha256).digest()\n    return hmac.compare_digest(candidate, tag)\n\nprint(\"original_verifies:\", verifies(message))\nprint(\"changed_verifies:\", verifies(changed))\nprint(\"tag_bytes:\", len(tag))\n"}, "expl": {"en": "The program genuinely computes and verifies HMAC-SHA256 with a fresh in-memory key that is never printed or saved. It illustrates integrity and authentication among key holders, not confidentiality, replay protection or public non-repudiation. This is a small supporting illustration, not an official Unit 1 cipher practical."}, "out": "original_verifies: True\nchanged_verifies: False\ntag_bytes: 32\n"}, {"id": "sec1p03", "title": {"en": "One private loopback TCP exchange"}, "code": {"en": "import socket\nimport threading\n\ndef receive_exact(conn, count):\n    data = bytearray()\n    while len(data) < count:\n        chunk = conn.recv(count - len(data))\n        if not chunk:\n            raise ConnectionError(\"Incomplete teaching message\")\n        data.extend(chunk)\n    return bytes(data)\n\nwith socket.socket() as listener:\n    listener.bind((\"127.0.0.1\", 0))\n    listener.listen(1)\n    listener.settimeout(3)\n    address = listener.getsockname()\n    errors = []\n\n    def serve_one():\n        try:\n            conn, _ = listener.accept()\n            with conn:\n                conn.settimeout(3)\n                data = receive_exact(conn, 5)\n                conn.sendall(data)\n        except Exception as error:\n            errors.append(type(error).__name__)\n\n    worker = threading.Thread(target=serve_one)\n    worker.start()\n    try:\n        with socket.create_connection(address, timeout=3) as client:\n            client.sendall(b\"UNIT1\")\n            reply = receive_exact(client, 5)\n    finally:\n        worker.join(4)\n    assert not worker.is_alive() and not errors, errors\n    assert reply == b\"UNIT1\"\n    print(\"loopback_only:\", address[0] == \"127.0.0.1\")\n    print(\"tcp_reply:\", reply.decode())\n    print(\"worker_stopped:\", not worker.is_alive())\nprint(\"listener_closed:\", listener.fileno() == -1)\n"}, "expl": {"en": "One real client connects to one private TCP listener on 127.0.0.1 and an OS-assigned port. The worker, client and listener finish inside the program. A successful exchange demonstrates this local service at that moment; plain TCP does not itself provide confidentiality or authenticate a user. It is not a DoS experiment or production server."}, "out": "loopback_only: True\ntcp_reply: UNIT1\nworker_stopped: True\nlistener_closed: True\n"}, {"id": "sec1p04", "title": {"en": "Inspect only the loopback interface and local route"}, "code": {"en": "import json\nimport subprocess\n\ndef ip_json(*parts):\n    result = subprocess.run(\n        [\"ip\", \"-j\", *parts], check=True,\n        text=True, capture_output=True, timeout=3)\n    return json.loads(result.stdout)\n\ninterface = ip_json(\"address\", \"show\", \"dev\", \"lo\")[0]\nipv4 = sorted(a[\"local\"] for a in interface[\"addr_info\"]\n              if a[\"family\"] == \"inet\")\nroute = ip_json(\"route\", \"get\", \"127.0.0.1\")[0]\nneighbors = ip_json(\"neigh\", \"show\", \"dev\", \"lo\")\nprint(\"interface:\", interface[\"ifname\"])\nprint(\"administratively_up:\", \"UP\" in interface[\"flags\"])\nprint(\"loopback_ipv4:\", \",\".join(ipv4))\nprint(\"route_device:\", route[\"dev\"])\nprint(\"loopback_neighbor_entries:\", len(neighbors))\n"}, "expl": {"en": "These are actual read-only iproute2 queries. Only the loopback interface, loopback route and its neighbour table are inspected, so no real network addresses are published. No ARP neighbour is needed for a loopback exchange. Interface state and routing do not prove application-level security."}, "out": "interface: lo\nadministratively_up: True\nloopback_ipv4: 127.0.0.1\nroute_device: lo\nloopback_neighbor_entries: 0\n"}, {"id": "sec1p05", "title": {"en": "Attempt one localhost ping and report its real status"}, "code": {"en": "import re\nimport subprocess\n\nresult = subprocess.run(\n    [\"ping\", \"-n\", \"-c\", \"1\", \"-W\", \"2\", \"127.0.0.1\"],\n    text=True, capture_output=True, timeout=4)\nif result.returncode == 0:\n    stats = re.search(r\"(\\d+) packets transmitted, (\\d+) received\",\n                      result.stdout)\n    assert stats and stats.groups() == (\"1\", \"1\")\n    status = \"one_local_echo_reply\"\nelif \"operation not permitted\" in result.stderr.lower():\n    status = \"blocked_by_lab_permissions\"\nelse:\n    raise RuntimeError(\"Unexpected ping failure: \" + result.stderr)\nprint(\"target: 127.0.0.1\")\nprint(\"requested_echoes: 1\")\nprint(\"observed_status:\", status)\n"}, "expl": {"en": "The reference sandbox actually denied the ping socket operation. The output records that denial; no successful ICMP reply is invented. On a machine with the required permissions the same bounded command may receive one reply instead. Missing replies alone cannot establish a DoS attack. Never use flood mode or public targets for this exercise."}, "out": "target: 127.0.0.1\nrequested_echoes: 1\nobserved_status: blocked_by_lab_permissions\n"}, {"id": "sec1p06", "title": {"en": "Local name resolution and an owned listening socket"}, "code": {"en": "import socket\nimport subprocess\n\ndef run(*args):\n    return subprocess.run(args, check=True, text=True,\n                          capture_output=True, timeout=3).stdout\n\nrecords = run(\"getent\", \"ahostsv4\", \"localhost\")\naddresses = sorted({line.split()[0]\n                    for line in records.splitlines() if line.strip()})\nwith socket.socket() as listener:\n    listener.bind((\"127.0.0.1\", 0))\n    listener.listen(1)\n    port = listener.getsockname()[1]\n    rows = run(\"ss\", \"-ltnH\", f\"sport = :{port}\")\n    found = f\"127.0.0.1:{port}\" in rows\n    print(\"localhost_ipv4:\", \",\".join(addresses))\n    print(\"owned_listener_visible:\", found)\nprint(\"owned_listener_closed:\", listener.fileno() == -1)\n"}, "expl": {"en": "getent resolves localhost using the system name-service configuration (not necessarily DNS); ss reads the real kernel socket table for the program's own ephemeral port only. The socket closes on exit. No foreign hosts, processes or credentials are inspected. Windows ipconfig/netstat and DNS tools remain separately labelled guided commands."}, "out": "localhost_ipv4: 127.0.0.1\nowned_listener_visible: True\nowned_listener_closed: True\n"}], "diagrams": [{"id": "sec1_cia", "title": {"en": "CIA Security Goals"}, "file": "diagrams/sec1_cia.svg"}, {"id": "sec1_attacks", "title": {"en": "Passive and Active Attacks"}, "file": "diagrams/sec1_attacks.svg"}, {"id": "sec1_dos", "title": {"en": "DoS, DDoS and Ordinary Outages"}, "file": "diagrams/sec1_dos.svg"}, {"id": "sec1_services", "title": {"en": "Five Syllabus Security Services"}, "file": "diagrams/sec1_services.svg"}, {"id": "sec1_authz", "title": {"en": "Authentication, Authorization and Enforcement"}, "file": "diagrams/sec1_authz.svg"}, {"id": "sec1_specific", "title": {"en": "Eight Specific Security Mechanisms"}, "file": "diagrams/sec1_specific.svg"}, {"id": "sec1_pervasive", "title": {"en": "Five Pervasive Security Mechanisms"}, "file": "diagrams/sec1_pervasive.svg"}, {"id": "sec1_diagnose", "title": {"en": "Safe Layer-by-Layer Diagnosis"}, "file": "diagrams/sec1_diagnose.svg"}], "syntax": [{"title": {"en": "Security and Utility Quick Reference"}, "items": [{"name": {"en": "CIA"}, "f": "C = confidentiality\nI = integrity\nA = availability", "terms": {"en": "Goals may overlap; a single mechanism does not guarantee all three."}}, {"name": {"en": "Attack classes"}, "f": "Passive: observe\nActive: alter, impersonate, replay or disrupt", "terms": {"en": "Classify by what the action does, not whether it looks harmless."}}, {"name": {"en": "Authentication and access"}, "f": "Authenticate the subject\nAuthorize the operation\nEnforce the policy", "terms": {"en": "A successful login is not permission to do everything."}}, {"name": {"en": "Service versus mechanism"}, "f": "Service: what protection?\nMechanism: how is it supplied?", "terms": {"en": "For example: confidentiality service; appropriate encryption plus access restrictions."}}, {"name": {"en": "Specific mechanisms, part 1"}, "f": "Encipherment; digital signature\nAccess control; data integrity", "terms": {"en": "Four of the eight X.800 specific mechanisms."}}, {"name": {"en": "Specific mechanisms, part 2"}, "f": "Authentication exchange; traffic padding\nRouting control; notarization", "terms": {"en": "The remaining four X.800 specific mechanisms."}}, {"name": {"en": "Pervasive mechanisms"}, "f": "Trusted functionality; security labels\nEvent detection; security audit trail\nSecurity recovery", "terms": {"en": "Supporting mechanisms not confined to a single particular security service."}}, {"name": {"en": "Hash, MAC and signature"}, "f": "Hash + trusted reference: change check\nMAC: shared-secret integrity/authentication\nSignature: public verification under trust", "terms": {"en": "Neither a bare hash nor HMAC supplies public non-repudiation; encryption is a different service."}}, {"name": {"en": "Linux loopback observations"}, "f": "ip -j address show dev lo\nip -j route get 127.0.0.1\nip -j neigh show dev lo", "terms": {"en": "Actually executed read-only queries. Route lookup is not traceroute; loopback usually needs no ARP neighbour."}}, {"name": {"en": "Bounded ping"}, "f": "ping -n -c 1 -W 2 127.0.0.1", "terms": {"en": "Actually attempted, but this reference sandbox denied socket permission. Windows uses different count flags."}}, {"name": {"en": "Local resolver and socket table"}, "f": "getent ahostsv4 localhost\nss -ltnH \"sport = :<owned-port>\"", "terms": {"en": "Actual examples use only localhost and an OS-assigned owned listener. getent is not necessarily DNS."}}, {"name": {"en": "Practical journal"}, "f": "Command -> observation -> interpretation\n-> limitation -> safe next step", "terms": {"en": "Separate actual results from guided commands; never invent outputs or publish credentials."}}]}], "viva": [{"title": {"en": "Unit 1 Viva and Short Revision"}, "items": [{"q": {"en": "What is information security?"}, "a": {"en": "Protection of information and supporting systems against unauthorized disclosure, improper change/destruction and loss of useful access."}}, {"q": {"en": "Why is security not just antivirus?"}, "a": {"en": "It also requires suitable permissions, trustworthy processes, physical protection, recovery and other controls."}}, {"q": {"en": "What does CIA stand for?"}, "a": {"en": "Confidentiality, integrity and availability."}}, {"q": {"en": "Does confidentiality mean no one may read the data?"}, "a": {"en": "No. It means access and disclosure are restricted to authorized parties."}}, {"q": {"en": "What is integrity?"}, "a": {"en": "Protection against improper modification or destruction; a suitable integrity check needs trustworthy assumptions."}}, {"q": {"en": "What is availability?"}, "a": {"en": "Timely, reliable access to and use of information and services by authorized users."}}, {"q": {"en": "Can one event violate several CIA goals?"}, "a": {"en": "Yes. For example, a destructive data theft incident can involve disclosure, alteration and loss of access."}}, {"q": {"en": "What is a passive attack?"}, "a": {"en": "Unauthorized observation without altering the system or data, such as eavesdropping or traffic analysis."}}, {"q": {"en": "Can encrypted communication reveal traffic patterns?"}, "a": {"en": "Yes. Content encryption does not automatically hide endpoints, timing or volume."}}, {"q": {"en": "Name four active attack types."}, "a": {"en": "Masquerade, replay, message modification and denial of service."}}, {"q": {"en": "Why can replay be active even if old message bytes are unchanged?"}, "a": {"en": "Unauthorized reintroduction changes the communication or system behaviour; integrity alone may not establish freshness."}}, {"q": {"en": "What is DoS?"}, "a": {"en": "A malicious attempt to prevent legitimate access to or use of a resource."}}, {"q": {"en": "What makes DDoS distributed?"}, "a": {"en": "Multiple participating systems act against the target; a single failure is not automatically DDoS."}}, {"q": {"en": "Does a failed ping prove DoS?"}, "a": {"en": "No. Permissions, filtering, a fault or configuration may explain it; investigate within authorized scope."}}, {"q": {"en": "What is a security service?"}, "a": {"en": "A protection provided to a user, data or communication; it states the required security property."}}, {"q": {"en": "Name the five listed security services."}, "a": {"en": "Confidentiality, integrity, authentication, non-repudiation and access control."}}, {"q": {"en": "How do authentication and authorization differ?"}, "a": {"en": "Authentication checks a claimed identity/origin; authorization determines permitted operations."}}, {"q": {"en": "What is least privilege?"}, "a": {"en": "Grant only the access needed for a task and enforce the applicable policy."}}, {"q": {"en": "What is non-repudiation of origin?"}, "a": {"en": "Evidence supporting the origin of data against a sender’s false denial, under the relevant trust and evidence assumptions."}}, {"q": {"en": "Does a digital signature prove a statement is true?"}, "a": {"en": "No. It verifies a cryptographic relationship under assumptions, not truth or automatic human/legal attribution."}}, {"q": {"en": "Why is HMAC not public non-repudiation?"}, "a": {"en": "Each shared-secret holder can create a valid tag, so it cannot provide public proof against the other holder."}}, {"q": {"en": "What is a specific mechanism?"}, "a": {"en": "A mechanism that directly supports one or more particular services, such as encipherment or an authentication exchange."}}, {"q": {"en": "What is traffic padding intended to reduce?"}, "a": {"en": "Inference from traffic patterns; it requires appropriate protection and is not merely file compression."}}, {"q": {"en": "What is notarization?"}, "a": {"en": "Use of a trusted third party to provide evidence about properties of a communication under an agreed process."}}, {"q": {"en": "Name the five pervasive mechanisms."}, "a": {"en": "Trusted functionality, security labels, event detection, security audit trail and security recovery."}}, {"q": {"en": "Does a security label enforce access by itself?"}, "a": {"en": "No. A trustworthy policy-enforcement mechanism must interpret and enforce it."}}, {"q": {"en": "Why protect audit logs?"}, "a": {"en": "An editable or untrusted record may be changed or misattributed and is not conclusive evidence on its own."}}, {"q": {"en": "What is the limitation of the practical reference?"}, "a": {"en": "It runs small standard-library and Linux-loopback examples, records a real denied ping, and does not claim Windows, simulator, packet-capture or DoS execution."}}]}], "exam_questions": [{"q": {"en": "Practice: Define information security and explain why a college needs it."}, "marks": 3}, {"q": {"en": "Practice: Explain the CIA triad using a result-portal example."}, "marks": 7}, {"q": {"en": "Practice: Differentiate passive and active attacks with examples."}, "marks": 4}, {"q": {"en": "Practice: Explain DoS and DDoS and distinguish them from an ordinary outage."}, "marks": 4}, {"q": {"en": "Practice: Explain the five security services listed in this unit."}, "marks": 7}, {"q": {"en": "Practice: Differentiate authentication, authorization and access control."}, "marks": 3}, {"q": {"en": "Practice: Explain non-repudiation and why HMAC is not a digital signature."}, "marks": 4}, {"q": {"en": "Practice: List and explain the eight specific security mechanisms."}, "marks": 7}, {"q": {"en": "Practice: Explain five pervasive security mechanisms with examples."}, "marks": 7}, {"q": {"en": "Practice: Differentiate a security service and a mechanism with two mappings."}, "marks": 4}, {"q": {"en": "Practice: A message and its plain hash both match after replacement. Is the sender authenticated?"}, "marks": 3}, {"q": {"en": "Practice: Ping is denied, but a private TCP exchange succeeds. Interpret the observation."}, "marks": 4}], "lesson_count": 14, "answered_practice_count": 12, "learning_outcomes": [{"en": "CO1: Describe the fundamentals of information security."}], "practical_numbers": [1], "content_kind": "theory_with_safe_practical_support", "assessment_note": {"en": "Official course: theory ESE 70 + PA 30; practical PA 20 + ESE 30 = 150. Practice sizes are suggested, not official GTU questions, paper patterns or guaranteed unit marks. Model answers are in Notes section 6."}, "question_provenance": "Original answered revision questions; not official past papers", "question_marks_are_suggested": true, "runtime_evidence": {"python": "3.13.16", "os": "Debian GNU/Linux 13 (trixie)", "architecture": "x86_64", "iproute2": "ip utility, iproute2-6.15.0, libbpf 1.5.0", "ss": "ss utility, iproute2-6.15.0", "ping": "ping from iputils 20240905", "programs_executed": 6, "network_scope": "Owned IPv4 loopback only; OS-assigned TCP ports", "external_network_targets": false, "persistent_service": false, "dos_traffic_generated": false, "privileged_host_changes": false, "packet_capture_executed": false, "windows_commands_executed": false, "simulator_or_kali_executed": false, "ping_attempted": true, "ping_observed_status": "blocked_by_lab_permissions", "normalization": "Actual result fields; no fixed dynamic ports or packet timings; HMAC key never published", "crypto_scope": "SHA-256 with trusted reference and HMAC-SHA256 illustration, not a cipher practical or production protocol"}, "sources": [{"title": "GTU DI05007021, Information Security, 2026–27 (uploaded syllabus)", "url": "https://s3-ap-southeast-1.amazonaws.com/gtusitecirculars/Syallbus/DI05007021.pdf"}, {"title": "NIST glossary: confidentiality", "url": "https://csrc.nist.gov/glossary/term/confidentiality"}, {"title": "NIST glossary: integrity", "url": "https://csrc.nist.gov/glossary/term/integrity"}, {"title": "NIST glossary: availability", "url": "https://csrc.nist.gov/glossary/term/availability"}, {"title": "NIST glossary: passive attack", "url": "https://csrc.nist.gov/glossary/term/passive_attack"}, {"title": "ITU-T X.800: security services and specific/pervasive mechanisms", "url": "https://www.itu.int/rec/T-REC-X.800-199103-I/en"}, {"title": "CISA: Understanding Denial-of-Service Attacks (archived educational article, 2021)", "url": "https://www.cisa.gov/news-events/news/understanding-denial-service-attacks"}, {"title": "Python: hashlib", "url": "https://docs.python.org/3/library/hashlib.html"}, {"title": "Python: hmac", "url": "https://docs.python.org/3/library/hmac.html"}]};
const SVG = {"sec1_cia": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 404\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"404\" fill=\"#ffffff\"/><text x=\"180\" y=\"28.9\" font-size=\"14\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">CIA: three core security goals</text><text x=\"180\" y=\"51.7\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">Example asset: a college result portal</text><rect x=\"18\" y=\"76\" width=\"324\" height=\"70\" rx=\"8\" fill=\"#EAF3FD\" stroke=\"#1565C0\" stroke-width=\"1.6\"/><text x=\"180\" y=\"103.2\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1565C0\" font-weight=\"bold\">CONFIDENTIALITY</text><text x=\"180\" y=\"124.7\" font-size=\"10.7\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">Authorized access and disclosure</text><rect x=\"18\" y=\"164\" width=\"324\" height=\"70\" rx=\"8\" fill=\"#F2EBFA\" stroke=\"#7B2CD9\" stroke-width=\"1.6\"/><text x=\"180\" y=\"191.2\" font-size=\"12\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">INTEGRITY</text><text x=\"180\" y=\"212.7\" font-size=\"10.7\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">No improper change or destruction</text><rect x=\"18\" y=\"252\" width=\"324\" height=\"70\" rx=\"8\" fill=\"#EAF6EC\" stroke=\"#2E7D32\" stroke-width=\"1.6\"/><text x=\"180\" y=\"279.2\" font-size=\"12\" text-anchor=\"middle\" fill=\"#2E7D32\" font-weight=\"bold\">AVAILABILITY</text><text x=\"180\" y=\"300.7\" font-size=\"10.7\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">Timely, reliable access and use</text><text x=\"180\" y=\"362.6\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">One event can harm more than one goal.</text><text x=\"180\" y=\"379.6\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">No single mechanism guarantees all three.</text></svg>", "sec1_attacks": "<svg xmlns=\ =\"middle\" fill=\"#666\" font-weight=\"normal\">No flood or exhaustion experiment is needed.</text></svg>", "sec1_services": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 542\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"542\" fill=\"#ffffff\"/><text x=\"180\" y=\"28.9\" font-size=\"14\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">Services: what protection is supplied?</text><rect x=\"18\" y=\"63\" width=\"324\" height=\"65\" rx=\"8\" fill=\"#EAF3FD\" stroke=\"#1565C0\" stroke-width=\"1.6\"/><text x=\"180\" y=\"90.2\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1565C0\" font-weight=\"bold\">Confidentiality</text><text x=\"180\" y=\"111.7\" font-size=\"10.7\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">Restrict unauthorized disclosure</text><rect x=\"18\" y=\"143\" width=\"324\" height=\"65\" rx=\"8\" fill=\"#F2EBFA\" stroke=\"#7B2CD9\" stroke-width=\"1.6\"/><text x=\"180\" y=\"170.2\" font-size=\"12\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">Integrity</text><text x=\"180\" y=\"191.7\" font-size=\"10.7\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">Protect against improper change/destruction</text><rect x=\"18\" y=\"223\" width=\"324\" height=\"65\" rx=\"8\" fill=\"#EAF6EC\" stroke=\"#2E7D32\" stroke-width=\"1.6\"/><text x=\"180\" y=\"250.2\" font-size=\"12\" text-anchor=\"middle\" fill=\"#2E7D32\" font-weight=\"bold\">Authentication</text><text x=\"180\" y=\"271.7\" font-size=\"10.7\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">Establish a claimed identity or data origin</text><rect x=\"18\" y=\"303\" width=\"324\" height=\"65\" rx=\"8\" fill=\"#FFF4DF\" stroke=\"#B66A00\" stroke-width=\"1.6\"/><text x=\"180\" y=\"330.2\" font-size=\"12\" text-anchor=\"middle\" fill=\"#B66A00\" font-weight=\"bold\">Access control</text><text x=\"180\" y=\"351.7\" font-size=\"10.7\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">Prevent unauthorized use/operations</text><rect x=\"18\" y=\"383\" width=\"324\" height=\"65\" rx=\"8\" fill=\"#FDECF0\" stroke=\"#BD2543\" stroke-width=\"1.6\"/><text x=\"180\" y=\"410.2\" font-size=\"12\" text-anchor=\"middle\" fill=\"#BD2543\" font-weight=\"bold\">Non-repudiation</text><text x=\"180\" y=\"431.7\" font-size=\"10.7\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">Evidence against false denial</text><text x=\"180\" y=\"499.6\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">Mechanisms are the means of supplying services.</text><text x=\"180\" y=\"516.6\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">Availability remains an essential security goal.</text></svg>", "sec1_authz": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 520\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"520\" fill=\"#ffffff\"/><text x=\"180\" y=\"28.9\" font-size=\"14\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">A valid identity is not every permission</text><rect x=\"18.0\" y=\"65.0\" width=\"324\" height=\"66\" rx=\"7\" fill=\"#EAF3FD\" stroke=\"#1565C0\" stroke-width=\"1.6\"/><text x=\"180\" y=\"95.2\" font-size=\"12\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">AUTHENTICATION</text><text x=\"180\" y=\"109.2\" font-size=\"12\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">Verify the claimed identity</text><path d=\"M180 131 L180 188\" fill=\"none\" stroke=\"#7B2CD9\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polygon points=\"180.0,188.0 183.5,181.0 176.5,181.0\" fill=\"#7B2CD9\"/><rect x=\"44\" y=\"145\" width=\"272\" height=\"27\" fill=\"white\"/><text x=\"180\" y=\"163.6\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#555\" font-weight=\"normal\">Continue only after identity verification</text><rect x=\"18.0\" y=\"188.0\" width=\"324\" height=\"68\" rx=\"7\" fill=\"#F2EBFA\" stroke=\"# }
let zoom = 1;
function setZoom(z){ zoom = Math.min(4, Math.max(1, z)); const w=document.getElementById('zw'); w.style.width=(zoom*100)+'%'; document.getElementById('zr').textContent=Math.round(zoom*100)+'%'; }
document.addEventListener('click', e=>{
  const q = e.target.closest('.q'); if (q && q.parentElement.querySelector('.a')) { q.parentElement.classList.toggle('open'); return; }
  const tb = e.target.closest('[data-tab]'); if (tb){ S.tab = tb.dataset.tab; render(); window.scrollTo(0,0); return; }
  if (e.target.closest('#lang')){ S.lang = S.lang==='en'?'gu':'en'; render(); return; }
  const m = e.target.closest('[data-more]');
  document.querySelectorAll('.menu.show').forEach(x=>{ if(!m || x!==m.nextElementSibling) x.classList.remove('show'); });
  if (m){ m.nextElementSibling.classList.toggle('show'); return; }
  const act = e.target.closest('[data-act]');
  if (act){ act.closest('.sec').querySelectorAll('.card').forEach(c=>{ if(c.querySelector('.a')) c.classList.toggle('open', act.dataset.act==='expand'); }); act.parentElement.classList.remove('show'); return; }
  const dg = e.target.closest('[data-dg]');
  if (dg){ const id=dg.dataset.dg; document.getElementById('mt').textContent=t(U.diagrams.find(d=>d.id===id).title); document.getElementById('zw').innerHTML=SVG[id]; setZoom(1); document.getElementById('modal').classList.add('show'); return; }
  if (e.target.closest('#mx')) document.getElementById('modal').classList.remove('show');
  if (e.target.closest('#zi')) setZoom(zoom+0.5);
  if (e.target.closest('#zo')) setZoom(zoom-0.5);
  if (e.target.closest('#zr')) setZoom(1);
});
render();
</script></body></html>
