<style>
:root{--p:#7B2CD9;--pd:#6420B8;--lav:#EADDF7;--bg:#F3ECFA;--ink:#1d1b20}

.kw{color:#C792EA;font-weight:700}.ty{color:#82AAFF}.st{color:#C3E88D}.cm{color:#8E9AAF;font-style:italic}.pp{color:#F78C6C}.nu{color:#F9C46B}.fn{color:#FFCB6B}

<script>
const U = {"subject": "DI01000021", "unit": 0, "format": "notes", "title": {"en": "Start Mathematics From Zero (Foundation)"}, "hours": 0, "weightage": 0, "official": false, "foundation": true, "languages": ["en"], "tabs": ["notes", "diagrams", "equations", "numericals", "viva", "exam"], "intro_text": {"en": "Our own foundation chapter, written for students who reach diploma Mathematics-I without the school-level tools the GTU syllabus assumes. It rebuilds numbers and signs, fractions, LCM and GCD, BODMAS, indices and surds, standard form, algebraic expansion and factorisation, linear and simultaneous equations, quadratic equations, sets, ratio, percentage, averages and the coordinate plane - then adds a five-step study method and an exam plan. Twenty-two fully solved numericals, and every definition written in the same style as the official units. This chapter carries no GTU hours or marks."}, "notes": [{"title": {"en": "1. Numbers, Signs and Fractions"}, "items": [{"h": {"en": "1.1 The number line and the families of numbers"}, "body": {"en": "<h4>Definition</h4><p>Every number you will use this semester sits on one line. Moving right adds, moving left subtracts, and the distance from zero is the <b>absolute value</b> |x|.</p><h4>The families, from smallest to largest</h4><table><tr><th>Family</th><th>Symbol</th><th>Examples</th><th>What it adds</th></tr><tr><td>Natural</td><td>N</td><td>1, 2, 3, …</td><td>Counting</td></tr><tr><td>Whole</td><td>W</td><td>0, 1, 2, 3, …</td><td>Zero</td></tr><tr><td>Integers</td><td>Z</td><td>…, −2, −1, 0, 1, 2, …</td><td>Negative direction</td></tr><tr><td>Rational</td><td>Q</td><td>3/4, −2.5, 0.333…</td><td>Every fraction of integers</td></tr><tr><td>Irrational</td><td>R − Q</td><td>√2, π, e</td><td>Cannot be written as a fraction</td></tr><tr><td>Real</td><td>R</td><td>All of the above</td><td>Every point on the line</td></tr></table><h4>Rules you will use daily</h4><ul><li>|−7| = 7 and |7| = 7: absolute value removes the sign.</li><li>On the line, −5 < −2 because −5 lies to the left.</li><li>A rational number has a terminating or repeating decimal; √2 = 1.41421… never repeats.</li><li>Between any two rational numbers there is another rational number - the line is dense, which is why graphs look continuous.</li></ul><details class=\"self-check\"><summary>Is 0.75 rational?</summary><p>Yes: 0.75 = 3/4, a fraction of integers.</p></details>"}, "diagram": "m0_numberline", "syllabus_item": "foundation:1"}, {"h": {"en": "1.2 Sign rules for integers"}, "body": {"en": "<h4>Definition</h4><p>Two signs next to each other combine into one: <b>same signs give +, different signs give −</b>. Then apply the operation.</p><h4>Explanation and application</h4><table><tr><th>Expression</th><th>Combine</th><th>Result</th></tr><tr><td>(−3) + (+7) − (−2)</td><td>−3 + 7 + 2</td><td>6</td></tr><tr><td>(−8) − (−5)</td><td>−8 + 5</td><td>−3</td></tr><tr><td>(−4) × (−3)</td><td>same signs → positive</td><td>12</td></tr><tr><td>(−12) ÷ (+4)</td><td>different signs → negative</td><td>−3</td></tr><tr><td>−2² vs (−2)²</td><td>−2² = −(2×2); (−2)² = (−2)(−2)</td><td>−4 vs 4</td></tr></table><h4>Common mistake / conditions</h4><p>The last row decides many exam marks: <b>−2² = −4</b> because the power applies to 2 only, while <b>(−2)² = 4</b> because the bracket carries the sign. Write brackets when you mean them.</p>"}, "examples": ["m0n1"], "syllabus_item": "foundation:1"}, {"h": {"en": "1.3 Fractions: simplify, add, multiply, divide"}, "body": {"en": "<h4>Definition</h4><p>A fraction a/b means a parts out of b equal parts. It is simplified when no number except 1 divides both a and b.</p><h4>The four operations</h4><ol><li><b>Simplify:</b> divide top and bottom by their GCD. 18/24 → 3/4.</li><li><b>Add or subtract:</b> take the LCM of the denominators, rewrite both fractions, then add the numerators: 5/6 + 3/4 = 10/12 + 9/12 = 19/12.</li><li><b>Multiply:</b> multiply tops and bottoms, then simplify: 5/6 × 9/10 = 45/60 = 3/4.</li><li><b>Divide:</b> flip the second fraction and multiply: 2/3 ÷ 4/9 = 2/3 × 9/4 = 18/12 = 3/2.</li></ol><h4>Common mistake / conditions</h4><p>Denominators are never added: 5/6 + 3/4 is not 8/10. If the answer is bigger than 1, give it as a mixed number too - 19/12 = 1 7/12 - because that is how marks are usually written.</p>"}, "examples": ["m0n2", "m0n3"], "syllabus_item": "foundation:1"}, {"h": {"en": "1.4 GCD and LCM by prime factorisation"}, "body": {"en": "<h4>Definition</h4><p><b>GCD</b> (HCF) is the largest number dividing both; <b>LCM</b> is the smallest number both divide. Prime factorisation gives both in one step.</p><h4>Method</h4><ol><li>Write each number as a product of primes: 48 = 2⁴ × 3 and 180 = 2² × 3² × 5.</li><li>For the GCD take the <b>common primes with the smallest</b> powers: 2² × 3 = 12.</li><li>For the LCM take <b>every prime with the largest</b> power: 2⁴ × 3² × 5 = 720.</li><li>Check with GCD × LCM = product: 12 × 720 = 8640 = 48 × 180. ✓</li></ol><h4>Where it is used</h4><p>Adding fractions (LCM of denominators), simplifying ratios, timing problems (two bells ring together again after the LCM of their intervals) and factorising algebraic expressions (GCD of coefficients).</p>"}, "examples": ["m0n4"], "syllabus_item": "foundation:1"}, {"h": {"en": "1.5 Decimals, percentages and averages"}, "body": {"en": "<h4>Definition</h4><p>A percentage is a fraction with denominator 100: 75 % = 75/100 = 0.75 = 3/4. An average (mean) divides a total equally among the count.</p><h4>Three conversions you must do without thinking</h4><ul><li>Fraction → decimal: divide top by bottom (3/8 = 0.375).</li><li>Decimal → percentage: multiply by 100 (0.375 = 37.5 %).</li><li>Percentage → fraction: put over 100 and simplify (36 % = 9/25).</li></ul><h4>Application</h4><p>15 % of 240 = 0.15 × 240 = 36. Increasing 240 by 15 % gives 240 + 36 = 276, which is the same as 240 × 1.15. Averages are used for internal marks and for reading graphs: the mean of 62, 78, 85 and 55 is 280/4 = 70.</p>"}, "examples": ["m0n5"], "syllabus_item": "foundation:1"}]}, {"title": {"en": "2. Order of Operations, Powers and Roots"}, "items": [{"h": {"en": "2.1 BODMAS: the only order that gives one answer"}, "body": {"en": "<h4>Definition</h4><p>An expression with several operations is evaluated in a fixed order: <b>B</b>rackets, <b>O</b>rders (powers and roots), <b>D</b>ivision and <b>M</b>ultiplication (left to right), <b>A</b>ddition and <b>S</b>ubtraction (left to right).</p><h4>Worked example</h4><p>8 + 2 × (5 − 3)² = 8 + 2 × 2² = 8 + 2 × 4 = 8 + 8 = <b>16</b>. Brackets first, then the power, then multiplication, then addition.</p><h4>Common mistake / conditions</h4><p>2 + 3 × 4 is <b>14</b>, not 20: multiplication is done before addition. Similarly 12 ÷ 3 × 2 is <b>8</b>, because division and multiplication are evaluated left to right - not 12 ÷ 6.</p>"}, "diagram": "m0_bodmas", "examples": ["m0n6"], "syllabus_item": "foundation:2"}, {"h": {"en": "2.2 Laws of indices"}, "body": {"en": "<h4>Definition</h4><p>An index counts repeated multiplication: aⁿ = a × a × … (n times). The laws follow from that definition, so they never need to be memorised blindly.</p><h4>The five laws</h4><table><tr><th>Law</th><th>Example</th><th>Reason</th></tr><tr><td>aᵐ × aⁿ = aᵐ⁺ⁿ</td><td>2³ × 2⁴ = 2⁷</td><td>count the factors</td></tr><tr><td>aᵐ ÷ aⁿ = aᵐ⁻ⁿ</td><td>2⁵ ÷ 2² = 2³</td><td>cancel common factors</td></tr><tr><td>(aᵐ)ⁿ = aᵐⁿ</td><td>(2³)² = 2⁶</td><td>three factors, repeated twice</td></tr><tr><td>a⁰ = 1 (a ≠ 0)</td><td>7⁰ = 1</td><td>aⁿ ÷ aⁿ = 1</td></tr><tr><td>a⁻ⁿ = 1/aⁿ</td><td>2⁻³ = 1/8</td><td>negative index means reciprocal</td></tr></table><h4>Application</h4><p>In electronics, 10⁻⁶ means micro and 10³ means kilo; in units, m/s = m·s⁻¹. A fractional index is a root: a^(1/2) = √a and a^(2/3) = ∛(a²).</p>"}, "examples": ["m0n7"], "syllabus_item": "foundation:2"}, {"h": {"en": "2.3 Roots and surds"}, "body": {"en": "<h4>Definition</h4><p>√a is the positive number whose square is a. A <b>surd</b> is a root that cannot be simplified to a whole number, such as √2 or 3√5.</p><h4>Simplifying a surd</h4><ol><li>Factor out the largest perfect square: √72 = √(36 × 2) = 6√2.</li><li>Only like surds combine: √72 − √18 = 6√2 − 3√2 = 3√2 ≈ 4.243.</li><li>Rationalise a denominator by multiplying top and bottom by the surd: 1/√2 = √2/2 ≈ 0.707.</li></ol><h4>Common mistake / conditions</h4><p>√(a + b) is not √a + √b. For a = 9 and b = 16, √25 = 5 but 3 + 4 = 7. Check any rule with numbers before using it in an exam.</p>"}, "examples": ["m0n8"], "syllabus_item": "foundation:2"}, {"h": {"en": "2.4 Standard form (scientific notation)"}, "body": {"en": "<h4>Definition</h4><p>A number is in standard form when it is written as <b>a × 10ⁿ</b> with 1 ≤ a < 10. It keeps very large and very small engineering quantities readable.</p><h4>Rules</h4><ul><li>Multiply: multiply the front numbers, add the powers - (3.6 × 10⁴)(2.5 × 10³) = 9.0 × 10⁷.</li><li>Divide: divide the front numbers, subtract the powers.</li><li>Add or subtract: make the powers equal first, then add - 3.6 × 10⁴ + 2.5 × 10³ = 36,000 + 2,500 = 38,500.</li><li>Move the decimal point right → smaller power; left → larger power.</li></ul><p>A calculator display of 4.2E−3 means 4.2 × 10⁻³ = 0.0042, not 4200.</p>"}, "examples": ["m0n9"], "syllabus_item": "foundation:2"}]}, {"title": {"en": "3. Algebra: Expressions, Expansion and Factorisation"}, "items": [{"h": {"en": "3.1 Terms, coefficients and substitution"}, "body": {"en": "<h4>Definition</h4><p>In 5x² − 3x + 7 the parts 5x², −3x and 7 are <b>terms</b>; 5 and −3 are <b>coefficients</b>; 7 is the constant. Only <b>like terms</b> (same letter, same power) may be combined.</p><p>Such a sum of terms with whole-number powers is a <b>polynomial</b>. Its highest power is the <b>degree</b> - 2 here, so it is a quadratic - and the degree tells you how many solutions the related equation can have: one for a linear polynomial, up to two for a quadratic, three for a cubic.</p><h4>Explanation and application</h4><ul><li>3x + 5x = 8x, but 3x + 5x² cannot be simplified - different powers.</li><li>Multiply powers by adding indices: x² · x³ = x⁵.</li><li>Substitution means replacing the letter by a number in brackets: 2x² − 3x + 1 at x = −2 is 2(−2)² − 3(−2) + 1 = 8 + 6 + 1 = 15.</li></ul><h4>Common mistake / conditions</h4><p>Always put a negative value in brackets before substituting. Squaring without brackets gives −4 instead of 4 and the whole answer is wrong.</p>"}, "examples": ["m0n10"], "syllabus_item": "foundation:3"}, {"h": {"en": "3.2 Expansion and the three identities"}, "body": {"en": "<h4>Definition</h4><p>Expanding means multiplying every term of one bracket by every term of the other. Three patterns appear so often that they are worth knowing by sight.</p><h4>The identities</h4><table><tr><th>Identity</th><th>Expanded form</th><th>Typical use</th></tr><tr><td>(a + b)²</td><td>a² + 2ab + b²</td><td>(x + 4)² = x² + 8x + 16</td></tr><tr><td>(a − b)²</td><td>a² − 2ab + b²</td><td>(2a − 3b)² = 4a² − 12ab + 9b²</td></tr><tr><td>(a + b)(a − b)</td><td>a² − b²</td><td>(x + 5)(x − 5) = x² − 25</td></tr></table><h4>General expansion</h4><p>(x + 3)(x − 5) = x² − 5x + 3x − 15 = <b>x² − 2x − 15</b>. The middle term is the sum of the cross products; that is why the sign matters.</p><h4>Common mistake / conditions</h4><p>(a + b)² is not a² + b². The middle term 2ab is the most frequently forgotten term in the paper.</p>"}, "diagram": "m0_factor", "examples": ["m0n11"], "syllabus_item": "foundation:3"}, {"h": {"en": "3.3 Factorisation: the reverse of expansion"}, "body": {"en": "<h4>Definition</h4><p>Factorising writes a sum as a product. Always try the steps in this order.</p><h4>Four-step checklist</h4><ol><li><b>Common factor:</b> 6x² + 9x = 3x(2x + 3).</li><li><b>Difference of squares:</b> 4x² − 25 = (2x − 5)(2x + 5).</li><li><b>Quadratic trinomial:</b> find two numbers whose product is c and sum is b. x² − 7x + 12 → −3 and −4 → (x − 3)(x − 4).</li><li><b>Check by expanding:</b> (x − 3)(x − 4) = x² − 7x + 12 ✓ - this check takes ten seconds and saves the whole question.</li></ol><h4>When the leading coefficient is not 1</h4><p>For 2x² + 7x − 15, multiply 2 × (−15) = −30; find 10 and −3 (product −30, sum 7); split the middle term and group: 2x² + 10x − 3x − 15 = 2x(x + 5) − 3(x + 5) = (x + 5)(2x − 3).</p>"}, "examples": ["m0n12"], "syllabus_item": "foundation:3"}, {"h": {"en": "3.4 Which tool for which expression?"}, "body": {"en": "<h4>Definition</h4><p>Choosing the right first move is most of the work in algebra. Use this decision table before writing anything.</p><h4>Decision table</h4><table><tr><th>Expression looks like</th><th>First move</th></tr><tr><td>Every term shares a factor</td><td>Take the common factor out</td></tr><tr><td>Two squares with a minus between</td><td>a² − b² = (a + b)(a − b)</td></tr><tr><td>ax² + bx + c with a = 1</td><td>Two numbers with product c, sum b</td></tr><tr><td>ax² + bx + c with a ≠ 1</td><td>Split the middle term, then group</td></tr><tr><td>Fraction with a common factor on top and bottom</td><td>Factorise both, then cancel</td></tr></table><h4>Why it matters later</h4><p>Quadratic equations in Section 5, limits in Unit 5 and partial fractions in later semesters all begin with factorisation. A student who cannot factorise loses marks across the paper, not only in one question.</p>"}, "syllabus_item": "foundation:3"}]}, {"title": {"en": "4. Linear Equations and Simultaneous Equations"}, "items": [{"h": {"en": "4.1 One variable: transposition"}, "body": {"en": "<h4>Definition</h4><p>An equation is a balance. Whatever you do to one side you must do to the other, which is why moving a term across the equals sign changes its sign.</p><h4>Worked example</h4><p>3(x − 2) = 2x + 5 → 3x − 6 = 2x + 5 → 3x − 2x = 5 + 6 → <b>x = 11</b>.</p><h4>The safe procedure</h4><ol><li>Remove brackets.</li><li>Collect the letter terms on one side and numbers on the other.</li><li>Divide by the coefficient of the letter.</li><li>Substitute the answer back into the original equation - both sides must agree.</li></ol><h4>Common mistake / conditions</h4><p>Do not divide by a variable that could be zero, and never drop a minus sign while moving a term. The check step is not optional: 3(11 − 2) = 27 and 2(11) + 5 = 27 ✓.</p>"}, "examples": ["m0n13"], "syllabus_item": "foundation:4"}, {"h": {"en": "4.2 Turning a word problem into an equation"}, "body": {"en": "<h4>Definition</h4><p>Every word problem is a translation exercise: name the unknown, write the relation, solve, then answer the question that was asked.</p><h4>Pattern: sum and difference</h4><p>Two numbers add to 45 and differ by 9. Let them be x and x + 9 (because the difference is fixed). Then x + (x + 9) = 45 → 2x = 36 → x = 18, so the numbers are <b>18 and 27</b>.</p><h4>Pattern: ages, speeds, mixtures</h4><ul><li>Age problem: write both ages now, then add the same number of years to both.</li><li>Speed problem: distance = speed × time; keep the units consistent.</li><li>Mixture problem: track the amount of the substance, not only the volume.</li></ul><h4>Condition</h4><p>State what the letter means before solving. \"Let x be the number of pens\" prevents the common error of finding a number and then reporting the wrong quantity.</p>"}, "examples": ["m0n15"], "syllabus_item": "foundation:4"}, {"h": {"en": "4.3 Two variables: elimination and substitution"}, "body": {"en": "<h4>Definition</h4><p>A linear equation in two variables, such as 2x + 3y = 12, has infinitely many solutions on its own; two such equations are needed for two unknowns. <b>Elimination</b> removes one variable by adding or subtracting multiples of the equations; <b>substitution</b> replaces one variable using the other equation.</p><h4>Worked example (substitution)</h4><p>2x + 3y = 12 and x − y = 1. From the second, x = y + 1. Substitute: 2(y + 1) + 3y = 12 → 5y = 10 → y = 2, x = 3. Check: 2(3) + 3(2) = 12 ✓.</p><h4>Worked example (elimination)</h4><p>3p + 2q = 80 and 2p + 3q = 70. Multiply the first by 3 and the second by 2: 9p + 6q = 240 and 4p + 6q = 140. Subtract: 5p = 100 → p = 20, then q = 10.</p><h4>Which to choose</h4><p>Use substitution when one equation already gives a variable (x = …). Use elimination when both equations look alike - multiply to match the coefficients, then subtract.</p>"}, "examples": ["m0n14"], "syllabus_item": "foundation:4"}, {"h": {"en": "4.4 Checking, and what no solution means"}, "body": {"en": "<h4>Definition</h4><p>A pair of linear equations can meet once, never, or everywhere. The graph is two straight lines, and their relationship tells you the answer before you solve anything.</p><h4>Three cases</h4><table><tr><th>Case</th><th>Graph</th><th>Algebraic sign</th><th>Answer</th></tr><tr><td>One solution</td><td>Lines cross once</td><td>Different slopes</td><td>Unique (x, y)</td></tr><tr><td>No solution</td><td>Parallel lines</td><td>Same slope, different intercept</td><td>Inconsistent</td></tr><tr><td>Infinite solutions</td><td>Same line</td><td>One equation is a multiple of the other</td><td>Infinitely many</td></tr></table><h4>Check routine</h4><ol><li>Substitute the pair into <b>both</b> original equations.</li><li>Confirm the units and answer the question in words.</li><li>If a substitution fails, the algebra - not the method - is wrong; solve again slowly.</li></ol><p>In the pens example, 3(20) + 2(10) = 80 and 2(20) + 3(10) = 70, so a pen is ₹20 and a pencil ₹10.</p>"}, "examples": ["m0n15"], "syllabus_item": "foundation:4"}]}, {"title": {"en": "5. Quadratic Equations"}, "items": [{"h": {"en": "5.1 Standard form and the three methods"}, "body": {"en": "<h4>Definition</h4><p>A quadratic equation has the form <b>ax² + bx + c = 0</b> with a ≠ 0. It can have two, one or no real solutions, and its graph is a parabola.</p><h4>Three methods</h4><table><tr><th>Method</th><th>Use it when</th><th>Speed</th></tr><tr><td>Factorisation</td><td>The factors are obvious integers</td><td>Fastest, no calculator</td></tr><tr><td>Quadratic formula</td><td>Always</td><td>Never fails; needs care with signs</td></tr><tr><td>Completing the square</td><td>You need the vertex or a proof</td><td>Slow, shows the structure</td></tr></table><h4>Before choosing</h4><p>Write the equation in standard form first. 3x(x − 2) = 15 must become 3x² − 6x − 15 = 0 (or x² − 2x − 5 = 0) before any method is applied.</p>"}, "syllabus_item": "foundation:5"}, {"h": {"en": "5.2 Factorisation method"}, "body": {"en": "<h4>Definition</h4><p>If two factors multiply to zero, at least one of them is zero. That single idea turns a quadratic into two linear equations.</p><h4>Worked examples</h4><p>x² − 5x + 6 = 0 → (x − 2)(x − 3) = 0 → <b>x = 2 or x = 3</b>.</p><p>2x² + 7x − 15 = 0 → (2x − 3)(x + 5) = 0 → <b>x = 3/2 or x = −5</b>.</p><h4>Procedure for a ≠ 1</h4><ol><li>Multiply a and c: 2 × (−15) = −30.</li><li>Find two numbers with product −30 and sum 7: 10 and −3.</li><li>Split the middle term, group and factorise.</li><li>Set each bracket to zero and solve.</li></ol><h4>Common mistake / conditions</h4><p>(2x − 3) = 0 gives x = 3/2, not 3. Divide by the coefficient of x inside the bracket, and check both roots in the original equation.</p>"}, "diagram": "m0_parabola", "examples": ["m0n12"], "syllabus_item": "foundation:5"}, {"h": {"en": "5.3 The quadratic formula and the discriminant"}, "body": {"en": "<h4>Formula</h4><p>For ax² + bx + c = 0, <b>x = (−b ± √(b² − 4ac)) / 2a</b>, and D = b² − 4ac is the <b>discriminant</b>.</p><h4>What D tells you before you finish</h4><table><tr><th>D</th><th>Roots</th><th>Graph</th></tr><tr><td>D > 0</td><td>Two distinct real roots</td><td>Parabola cuts the x-axis twice</td></tr><tr><td>D = 0</td><td>One repeated root, x = −b/2a</td><td>Parabola touches the x-axis</td></tr><tr><td>D < 0</td><td>No real roots</td><td>Parabola stays above or below the axis</td></tr></table><h4>Worked example</h4><p>3x² − 4x + 5 = 0: D = (−4)² − 4(3)(5) = 16 − 60 = <b>−44</b>. D < 0, so there is no real solution - do not force the formula and invent a root.</p><h4>Check with the sum and product</h4><p>The roots satisfy x₁ + x₂ = −b/a and x₁x₂ = c/a. For 2x² + 7x − 15: sum = −7/2 = 1.5 + (−5) ✓ and product = −15/2 = 1.5 × (−5) ✓.</p>"}, "diagram": "m0_parabola", "examples": ["m0n16"], "syllabus_item": "foundation:5"}, {"h": {"en": "5.4 Word problems that become quadratic"}, "body": {"en": "<h4>Definition</h4><p>Any situation with an area, a product, or a squared unknown produces a quadratic. The physical meaning then decides which root to keep.</p><h4>Worked example</h4><p>A rectangle is 5 m longer than it is wide and its area is 84 m². Let the width be w; then w(w + 5) = 84 → w² + 5w − 84 = 0 → (w + 12)(w − 7) = 0 → w = 7 or w = −12.</p><h4>Choosing the root</h4><p>A length cannot be negative, so w = −12 is rejected. Width = <b>7 m</b>, length = <b>12 m</b>, and 7 × 12 = 84 ✓. Always state the rejected root and why.</p>"}, "examples": ["m0n17"], "syllabus_item": "foundation:5"}]}, {"title": {"en": "6. Sets, Ratio, Percentage and Average"}, "items": [{"h": {"en": "6.1 Sets and the three operations"}, "body": {"en": "<h4>Definition</h4><p>A set is a collection of distinct objects. If A = {1, 2, 3, 4} and B = {3, 4, 5}, then the three operations give:</p><table><tr><th>Operation</th><th>Meaning</th><th>Answer for A and B</th><th>Count</th></tr><tr><td>A ∪ B (union)</td><td>Everything in A or B</td><td>{1, 2, 3, 4, 5}</td><td>5</td></tr><tr><td>A ∩ B (intersection)</td><td>Only what is in both</td><td>{3, 4}</td><td>2</td></tr><tr><td>A − B (difference)</td><td>In A but not in B</td><td>{1, 2}</td><td>2</td></tr></table><h4>Why it is in the prerequisite list</h4><p>Domain and range in Unit 1, solution sets of inequalities, and probability in later semesters are all written in set notation. The counting rule n(A ∪ B) = n(A) + n(B) − n(A ∩ B) explains double counting: 4 + 3 − 2 = 5 ✓.</p>"}, "examples": ["m0n21"], "syllabus_item": "foundation:6"}, {"h": {"en": "6.2 Ratio and proportion"}, "body": {"en": "<h4>Definition</h4><p>A ratio compares parts of the same whole; a proportion says two ratios are equal (a : b = c : d, so ad = bc).</p><h4>Dividing an amount in a ratio</h4><ol><li>Add the ratio parts: 2 + 3 + 4 = 9.</li><li>One part = total / 9 = 4500 / 9 = 500.</li><li>Multiply: 2 × 500 = 1000, 3 × 500 = 1500, 4 × 500 = 2000.</li><li>Check: 1000 + 1500 + 2000 = 4500 ✓.</li></ol><h4>Application</h4><p>Mixing concrete 1 : 2 : 4, dividing profit between partners, scaling a map or a drawing, and resolving a force into components all use the same arithmetic.</p>"}, "examples": ["m0n18"], "syllabus_item": "foundation:6"}, {"h": {"en": "6.3 Percentage change and reverse percentage"}, "body": {"en": "<h4>Definition</h4><p>Percentage change compares the change with the <b>original</b> value: change % = (new − old)/old × 100.</p><h4>Worked examples</h4><ul><li>Price 800 → 920: change = +120, so 120/800 × 100 = <b>+15 %</b>.</li><li>Price 920 → 800: change = −120, and the original is now 920, so 120/920 × 100 = <b>−13.04 %</b>.</li><li>A 15 % rise followed by a 15 % fall does not return to the start: 800 × 1.15 × 0.85 = 782.</li></ul><h4>Common mistake / conditions</h4><p>Always divide by the value <b>before</b> the change, and remember that successive percentages multiply. The GST-style question \"price before tax\" is a reverse percentage: divide by (1 + rate), do not subtract the rate from the final price.</p>"}, "examples": ["m0n19"], "syllabus_item": "foundation:6"}, {"h": {"en": "6.4 Average, and when it misleads"}, "body": {"en": "<h4>Definition</h4><p>Mean = sum of values / number of values. It is the balance point of the data, and the only average you need this semester.</p><h4>Worked example</h4><p>Marks 62, 78, 85, 55: sum = 280, count = 4, mean = <b>70</b>. If the next test is 90, the new mean is 370/5 = 74 - one high score lifts the average by 4 marks.</p><h4>Limitation</h4><p>A single extreme value pulls the mean. The median (middle value when sorted) is safer for salaries or house prices. State which average you used and why.</p>"}, "examples": ["m0n22"], "syllabus_item": "foundation:6"}]}, {"title": {"en": "7. The Coordinate Plane"}, "items": [{"h": {"en": "7.1 Axes, quadrants and plotting a point"}, "body": {"en": "<h4>Definition</h4><p>Two perpendicular number lines give every point a unique address (x, y): x is measured along the horizontal axis, y along the vertical axis.</p><h4>The four quadrants</h4><table><tr><th>Quadrant</th><th>x</th><th>y</th><th>Example</th></tr><tr><td>I</td><td>positive</td><td>positive</td><td>(3, 2)</td></tr><tr><td>II</td><td>negative</td><td>positive</td><td>(−4, 3)</td></tr><tr><td>III</td><td>negative</td><td>negative</td><td>(−2, −5)</td></tr><tr><td>IV</td><td>positive</td><td>negative</td><td>(6, −1)</td></tr></table><h4>Rules</h4><ul><li>A point on the x-axis has y = 0; on the y-axis x = 0; the origin is (0, 0).</li><li>Plot by counting along x first, then along y - in that order.</li><li>Always write the bracket and the comma; (3, 2) and (2, 3) are different points.</li></ul><p>This section is the bridge to Unit 4: distance, midpoint and slope are all measured on this grid.</p>"}, "diagram": "m0_quadrants", "syllabus_item": "foundation:7"}, {"h": {"en": "7.2 Distance between two points"}, "body": {"en": "<h4>Formula</h4><p>For A(x₁, y₁) and B(x₂, y₂): <b>AB = √((x₂ − x₁)² + (y₂ − y₁)²)</b> - Pythagoras on the horizontal and vertical gaps.</p><h4>Worked example</h4><p>A(2, 3) and B(6, 6): gaps are 4 and 3, so AB = √(16 + 9) = √25 = <b>5 units</b>.</p><h4>Checks that catch errors</h4><ul><li>Distance is never negative; a negative answer means a sign slip.</li><li>Order does not matter, because both gaps are squared.</li><li>If the points share an x or a y, the distance is simply the other gap.</li></ul><h4>Application</h4><p>Length of a side of a plot, distance between two machines on a layout, error between a measured point and a nominal point.</p>"}, "examples": ["m0n20"], "syllabus_item": "foundation:7"}, {"h": {"en": "7.3 Midpoint and slope"}, "body": {"en": "<h4>Formulae</h4><p>Midpoint M = ((x₁ + x₂)/2, (y₁ + y₂)/2). Slope m = (y₂ − y₁)/(x₂ − x₁) = rise / run.</p><h4>Worked example</h4><p>A(2, 3) and B(6, 6): midpoint = (4, 4.5) and slope = (6 − 3)/(6 − 2) = 3/4 = 0.75. A line rising 3 units for every 4 to the right.</p><h4>Reading the slope</h4><table><tr><th>Slope</th><th>Meaning</th></tr><tr><td>positive</td><td>line rises left to right</td></tr><tr><td>negative</td><td>line falls left to right</td></tr><tr><td>zero</td><td>horizontal line</td></tr><tr><td>undefined</td><td>vertical line (x₂ = x₁)</td></tr></table><p>Slope is the first thing Unit 4 asks for: it appears in the two-point form, the slope-point form, the parallel and perpendicular conditions, and the tangent to a circle.</p>"}, "examples": ["m0n20"], "syllabus_item": "foundation:7"}]}, {"title": {"en": "8. How to Study Mathematics: The Five-Step Method"}, "items": [{"h": {"en": "8.1 The five steps"}, "body": {"en": "<h4>The method</h4><p>Mathematics is learnt by <b>doing</b>, not by reading. Use the same five steps for every topic in this subject.</p><ol><li><b>Read a solved example</b> with a pen in hand: cover the solution, predict the next line, then check.</li><li><b>Copy it closed-book</b> immediately, then compare line by line. Any line you cannot reproduce is the line you did not understand.</li><li><b>Change the numbers</b> and solve the same skeleton again - same method, your values.</li><li><b>Attempt an unsolved problem</b> and write every step, even the wrong ones.</li><li><b>Log the error</b> in one line (\"moved −3 without changing sign\") and revise it after 1 day, 1 week and 1 month.</li></ol><h4>Why it works</h4><p>Steps 1-2 build recognition, step 3 builds transfer, step 4 exposes gaps, and step 5 stops the same mistake from returning in the exam.</p>"}, "diagram": "m0_cycle", "syllabus_item": "foundation:8"}, {"h": {"en": "8.2 A weekly routine that fits a diploma timetable"}, "body": {"en": "<h4>The plan</h4><ul><li><b>20 minutes daily:</b> one numerical from the current unit, written fully.</li><li><b>Twice a week:</b> five viva answers spoken aloud - speaking exposes fake understanding.</li><li><b>Once a week:</b> one timed 12-mark set from the Exam tab, closed book.</li><li><b>Before a test:</b> re-solve only the questions in your error log, not the whole chapter.</li></ul><h4>How to use this app</h4><ol><li>Open the unit, read a card, then close it and say the definition aloud.</li><li>Open the gold <b>EX</b> box only after trying the numerical yourself.</li><li>Use <b>Viva</b> for one-line answers and <b>Exam Qs</b> for written practice.</li><li>Check your answer against the \"Interpretation and check\" line; a right number with no check is half an answer.</li></ol><h4>Condition</h4><p>Do not read mathematics like a story. If your pen has not moved in five minutes, you are not studying - you are watching.</p>"}, "syllabus_item": "foundation:8"}, {"h": {"en": "8.3 Exam strategy for a 70-mark paper"}, "body": {"en": "<h4>Before you write</h4><ul><li>Read the whole paper once and mark the questions you can finish (usually 60-70 % of it).</li><li>Attempt in order of confidence, not in order of the paper.</li><li>For each question, write the formula first - formula marks are awarded even if arithmetic fails.</li></ul><h4>During the paper</h4><ol><li>Show every step; a correct answer with no working loses method marks.</li><li>Carry units and brackets; write the final answer as a sentence with units.</li><li>Leave 5 minutes for arithmetic checks and for unanswered one-mark parts.</li></ol><h4>Where the marks are</h4><p>The official specification splits 70 marks as R 19, U 27, A 24 - more than half the paper is understanding and application. Memorising definitions alone cannot reach a pass.</p>"}, "syllabus_item": "foundation:8"}]}, {"title": {"en": "9. Answered Practice (foundation level, suggested marks)"}, "items": [{"h": {"en": "Practice 1. Simplify (−8) − (−5) + (−3) × 2."}, "body": {"en": "<h4>Working</h4><ol><li>(−3) × 2 = −6 (multiplication before addition)</li><li>(−8) + 5 = −3</li><li>−3 + (−6) = −9</li></ol><h4>Answer</h4><p><b>−9.</b> Check by counting on the number line from −8: right 5 → −3, left 6 → −9.</p>"}}, {"h": {"en": "Practice 2. Add 3/8 + 5/6 and simplify."}, "body": {"en": "<h4>Working</h4><ol><li>LCM(8, 6) = 24</li><li>3/8 = 9/24 and 5/6 = 20/24</li><li>9/24 + 20/24 = 29/24</li></ol><h4>Answer</h4><p><b>29/24 = 1 5/24 ≈ 1.208.</b> Both fractions are close to 1/2 and 5/6 is close to 1, so an answer near 1.2 is expected; 8/14 - adding the tops and the bottoms - is the classic wrong answer and does not even keep the size of the number.</p>"}}, {"h": {"en": "Practice 3. Find the GCD and LCM of 36 and 60."}, "body": {"en": "<h4>Working</h4><ol><li>36 = 2² × 3²</li><li>60 = 2² × 3 × 5</li><li>GCD = 2² × 3 = 12</li><li>LCM = 2² × 3² × 5 = 180</li></ol><h4>Check</h4><p>12 × 180 = 2160 = 36 × 60 ✓. The GCD is a factor of both numbers and the LCM is a multiple of both: 36 = 12 × 3 and 60 = 12 × 5, while 180/36 = 5 and 180/60 = 3 - the cross-values match, which is a quick second check.</p>"}}, {"h": {"en": "Practice 4. Evaluate 12 ÷ 3 × 2 + (4 − 1)²."}, "body": {"en": "<h4>Working</h4><ol><li>(4 − 1)² = 9</li><li>12 ÷ 3 = 4, then 4 × 2 = 8 (left to right)</li><li>8 + 9 = 17</li></ol><h4>Answer</h4><p><b>17.</b> Dividing as 12 ÷ 6 = 2 is the classic wrong path: division and multiplication have equal priority, so they are read left to right. A calculator entered as 12 ÷ 3 × 2 also returns 8, which is a fast way to confirm the order.</p>"}}, {"h": {"en": "Practice 5. Simplify 3x² − 5x + 2x² + 7 − x."}, "body": {"en": "<h4>Working</h4><p>Collect like terms: (3x² + 2x²) + (−5x − x) + 7 = 5x² − 6x + 7. Nothing else combines, because 5x², −6x and 7 are unlike terms.</p><h4>Answer</h4><p><b>5x² − 6x + 7.</b> Check by substituting x = 2: the original expression gives 12 − 10 + 8 + 7 − 2 = 15, and 5(4) − 12 + 7 = 15 ✓. A substitution check works for any simplification question.</p>"}}, {"h": {"en": "Practice 6. Expand (2x − 3)(x + 4)."}, "body": {"en": "<h4>Working</h4><ol><li>2x(x + 4) = 2x² + 8x</li><li>−3(x + 4) = −3x − 12</li><li>2x² + 8x − 3x − 12</li></ol><h4>Answer</h4><p><b>2x² + 5x − 12.</b> Check at x = 1: (2 − 3)(1 + 4) = −5 and 2 + 5 − 12 = −5 ✓.</p>"}}, {"h": {"en": "Practice 7. Factorise x² − 9x + 20."}, "body": {"en": "<h4>Working</h4><p>Two numbers with product 20 and sum −9: −4 and −5, because (−4)(−5) = 20 and (−4) + (−5) = −9. Therefore x² − 9x + 20 = (x − 4)(x − 5).</p><h4>Check</h4><p>Expanding gives x² − 5x − 4x + 20 = x² − 9x + 20 ✓, so the roots of the related equation would be x = 4 and x = 5.</p>"}}, {"h": {"en": "Practice 8. Solve 5(x + 1) = 3x + 17."}, "body": {"en": "<h4>Working</h4><ol><li>5x + 5 = 3x + 17</li><li>5x − 3x = 17 − 5</li><li>2x = 12</li><li>x = 6</li></ol><h4>Check</h4><p>Left: 5(6 + 1) = 35. Right: 3(6) + 17 = 35 ✓. Both sides agree, so x = 6 is correct; divide by the coefficient only at the last step, never before collecting the terms.</p>"}}, {"h": {"en": "Practice 9. Solve 3x + 2y = 16 and x − y = 2."}, "body": {"en": "<h4>Working</h4><ol><li>From the second equation, x = y + 2</li><li>3(y + 2) + 2y = 16</li><li>5y + 6 = 16 → y = 2</li><li>x = 2 + 2 = 4</li></ol><h4>Check</h4><p>3(4) + 2(2) = 16 ✓ and 4 − 2 = 2 ✓. The lines have different slopes (−3/2 and 1), so exactly one pair (4, 2) exists - the answer is consistent with the geometry.</p>"}}, {"h": {"en": "Practice 10. Solve x² + 2x − 8 = 0 and state the nature of the roots."}, "body": {"en": "<h4>Working</h4><p>Two numbers with product −8 and sum 2 are 4 and −2, so x² + 2x − 8 = (x + 4)(x − 2) = 0, giving x = −4 or x = 2. Independently, D = 2² − 4(1)(−8) = 36 > 0, which confirms two distinct real roots.</p><h4>Check</h4><p>Sum = −4 + 2 = −2 = −b/a ✓ and product = (−4)(2) = −8 = c/a ✓. Because a > 0 the parabola opens upward and cuts the x-axis at −4 and 2.</p>"}}, {"h": {"en": "Practice 11. A number plus its square is 30. Find the number."}, "body": {"en": "<h4>Working</h4><p>x + x² = 30 → x² + x − 30 = 0 → (x + 6)(x − 5) = 0 → x = 5 or x = −6.</p><h4>Answer</h4><p>Both satisfy the words: 5 + 25 = 30 and −6 + 36 = 30. Unless the question says \"positive number\", give both.</p>"}}, {"h": {"en": "Practice 12. Find the distance, midpoint and slope for P(1, 2) and Q(7, 10)."}, "body": {"en": "<h4>Working</h4><ol><li>Gaps: 6 and 8</li><li>PQ = √(36 + 64) = 10</li><li>Midpoint = (4, 6)</li><li>Slope = 8/6 = 4/3 ≈ 1.33</li></ol><h4>Check</h4><p>(6 − 2)/(4 − 1) = 4/3, the same slope from the midpoint ✓.</p>"}}, {"h": {"en": "Practice 13. What is 18 % of 250, and what is 250 increased by 18 %?"}, "body": {"en": "<h4>Working</h4><ol><li>18 % = 0.18</li><li>0.18 × 250 = 45</li><li>250 + 45 = 295, and 250 × 1.18 = 295</li></ol><h4>Answer</h4><p><b>45 and 295.</b> Note the difference between the two parts of the question: \"18 % of 250\" is the part, while \"increased by 18 %\" is the new whole. GST of 18 % on a ₹250 item is added the same way.</p>"}}, {"h": {"en": "Practice 14. A sum of ₹6,000 is divided in the ratio 3 : 5. Find both shares."}, "body": {"en": "<h4>Working</h4><ol><li>Sum of parts = 3 + 5 = 8</li><li>One part = 6000 / 8 = ₹750</li><li>Shares = 3 × 750 = ₹2,250 and 5 × 750 = ₹3,750</li></ol><h4>Check</h4><p>2250 + 3750 = 6000 ✓, and dividing both shares by 750 returns 3 : 5 ✓. State the answer with the rupee symbol and a comma for thousands, as a marker expects.</p>"}}]}], "diagrams": [{"id": "m0_numberline", "title": {"en": "The number line and absolute value"}, "file": "diagrams/m0_numberline.svg"}, {"id": "m0_bodmas", "title": {"en": "BODMAS: one fixed order"}, "file": "diagrams/m0_bodmas.svg"}, {"id": "m0_factor", "title": {"en": "Area model for (x + 2)(x + 3)"}, "file": "diagrams/m0_factor.svg"}, {"id": "m0_parabola", "title": {"en": "A quadratic is a parabola"}, "file": "diagrams/m0_parabola.svg"}, {"id": "m0_quadrants", "title": {"en": "The four quadrants"}, "file": "diagrams/m0_quadrants.svg"}, {"id": "m0_cycle", "title": {"en": "The five-step study cycle"}, "file": "diagrams/m0_cycle.svg"}], "equations": [{"title": {"en": "Identities"}, "items": [{"name": {"en": "Square of a sum"}, "f": "(a + b)² = a² + 2ab + b²", "terms": {"en": "The middle term 2ab is the one most often forgotten."}}, {"name": {"en": "Square of a difference"}, "f": "(a − b)² = a² − 2ab + b²", "terms": {"en": "Sign of the middle term follows the bracket."}}, {"name": {"en": "Difference of squares"}, "f": "a² − b² = (a + b)(a − b)", "terms": {"en": "Use it in both directions: expand and factorise."}}, {"name": {"en": "Trinomial with a = 1"}, "f": "x² + (p + q)x + pq = (x + p)(x + q)", "terms": {"en": "Find two numbers whose sum is the middle coefficient and product is the constant."}}]}, {"title": {"en": "Quadratics"}, "items": [{"name": {"en": "Standard form"}, "f": "ax² + bx + c = 0, a ≠ 0", "terms": {"en": "Always arrange the equation in this form before choosing a method."}}, {"name": {"en": "Quadratic formula"}, "f": "x = (−b ± √(b² − 4ac)) / 2a", "terms": {"en": "Works for every quadratic; substitute signs carefully."}}, {"name": {"en": "Discriminant"}, "f": "D = b² − 4ac", "terms": {"en": "D > 0: two real roots; D = 0: one repeated root; D < 0: no real root."}}, {"name": {"en": "Sum and product of roots"}, "f": "x₁ + x₂ = −b/a, x₁x₂ = c/a", "terms": {"en": "Fastest check of a factorisation or of the formula."}}]}, {"title": {"en": "Arithmetic tools"}, "items": [{"name": {"en": "LCM and GCD"}, "f": "GCD(a,b) × LCM(a,b) = a × b", "terms": {"en": "Find both from prime factorisation: common primes (smallest) and all primes (largest)."}}, {"name": {"en": "Percentage change"}, "f": "change % = (new − old) / old × 100", "terms": {"en": "Divide by the value before the change; successive changes multiply."}}, {"name": {"en": "Mean"}, "f": "mean = sum of values / count", "terms": {"en": "Sensitive to extreme values; the median is safer for skewed data."}}, {"name": {"en": "Ratio share"}, "f": "one part = total / sum of ratio parts", "terms": {"en": "Multiply one part by each ratio term and check the total."}}]}, {"title": {"en": "Coordinate geometry (bridge to Unit 4)"}, "items": [{"name": {"en": "Distance"}, "f": "AB = √((x₂−x₁)² + (y₂−y₁)²)", "terms": {"en": "Pythagoras on the horizontal and vertical gaps."}}, {"name": {"en": "Midpoint"}, "f": "M = ((x₁+x₂)/2, (y₁+y₂)/2)", "terms": {"en": "Average the x-coordinates and the y-coordinates separately."}}, {"name": {"en": "Slope"}, "f": "m = (y₂−y₁)/(x₂−x₁)", "terms": {"en": "Rise over run; vertical line (x₂ = x₁) has no finite slope."}}]}], "numericals": [{"id": "m0n1", "q": {"en": "Simplify: (−3) + (+7) − (−2)."}, "a": {"en": "<h4>Given and assumptions</h4><p>Two signs together combine first: same signs give +, different signs give −.</p><h4>Formula</h4><p>a − (−b) = a + b and a + (−b) = a − b</p><h4>Step-by-step solution</h4><ol><li>(−3) + (+7) = 4</li><li>4 − (−2) = 4 + 2</li><li>= 6</li></ol><h4>Interpretation and check</h4><p><b>6.</b> Sanity: starting at −3, moving 7 right reaches 4, then 2 more right reaches 6.</p>"}}, {"id": "m0n2", "q": {"en": "Add 5/6 + 3/4 and give the answer as a mixed number."}, "a": {"en": "<h4>Given and assumptions</h4><p>Denominators 6 and 4; LCM(6, 4) = 12.</p><h4>Formula</h4><p>a/b + c/d = (ad + bc)/bd, then simplify</p><h4>Step-by-step solution</h4><ol><li>5/6 = 10/12 and 3/4 = 9/12</li><li>10/12 + 9/12 = 19/12</li><li>19/12 = 1 7/12</li></ol><h4>Interpretation and check</h4><p><b>19/12 ≈ 1.583.</b> Estimate 0.833 + 0.75 = 1.583 ✓ - the answer must be close to the estimate.</p>"}}, {"id": "m0n3", "q": {"en": "Divide (2/3) ÷ (4/9)."}, "a": {"en": "<h4>Given and assumptions</h4><p>Dividing by a fraction is multiplying by its reciprocal.</p><h4>Formula</h4><p>a/b ÷ c/d = a/b × d/c</p><h4>Step-by-step solution</h4><ol><li>2/3 × 9/4</li><li>= 18/12</li><li>= 3/2 = 1.5</li></ol><h4>Interpretation and check</h4><p><b>3/2.</b> Check by multiplication: (3/2)(4/9) = 12/18 = 2/3 ✓.</p>"}}, {"id": "m0n4", "q": {"en": "Find the GCD and LCM of 48 and 180."}, "a": {"en": "<h4>Given and assumptions</h4><p>Prime factorisation of both numbers.</p><h4>Formula</h4><p>GCD = common primes, smallest powers; LCM = all primes, largest powers</p><h4>Step-by-step solution</h4><ol><li>48 = 2⁴ × 3</li><li>180 = 2² × 3² × 5</li><li>GCD = 2² × 3 = 12</li><li>LCM = 2⁴ × 3² × 5 = 720</li></ol><h4>Interpretation and check</h4><p><b>GCD 12, LCM 720.</b> Check GCD × LCM = 12 × 720 = 8640 = 48 × 180 ✓.</p>"}}, {"id": "m0n5", "q": {"en": "Find 15 % of 240, and the value after a 15 % increase."}, "a": {"en": "<h4>Given and assumptions</h4><p>Base value 240; rate 15 %.</p><h4>Formula</h4><p>part = rate × base; increased value = base × (1 + rate)</p><h4>Step-by-step solution</h4><ol><li>15 % = 0.15</li><li>0.15 × 240 = 36</li><li>240 + 36 = 276, or 240 × 1.15 = 276</li></ol><h4>Interpretation and check</h4><p><b>36 and 276.</b> Check: 10 % of 240 is 24 and 5 % is 12, so 15 % is 36 ✓.</p>"}}, {"id": "m0n6", "q": {"en": "Evaluate 8 + 2 × (5 − 3)²."}, "a": {"en": "<h4>Given and assumptions</h4><p>Apply BODMAS: brackets, orders, multiplication, addition.</p><h4>Formula</h4><p>B → O → D/M left to right → A/S left to right</p><h4>Step-by-step solution</h4><ol><li>(5 − 3) = 2</li><li>2² = 4</li><li>2 × 4 = 8</li><li>8 + 8 = 16</li></ol><h4>Interpretation and check</h4><p><b>16.</b> The common wrong answer 100 comes from squaring 8 + 2 first, which ignores the brackets.</p>"}}, {"id": "m0n7", "q": {"en": "Simplify (2³ × 2⁻⁵) ÷ 2⁻¹."}, "a": {"en": "<h4>Given and assumptions</h4><p>Laws of indices with the same base 2.</p><h4>Formula</h4><p>aᵐ × aⁿ = aᵐ⁺ⁿ and aᵐ ÷ aⁿ = aᵐ⁻ⁿ</p><h4>Step-by-step solution</h4><ol><li>2³ × 2⁻⁵ = 2⁻²</li><li>2⁻² ÷ 2⁻¹ = 2⁻² ⁺ ¹ = 2⁻¹</li><li>2⁻¹ = 1/2</li></ol><h4>Interpretation and check</h4><p><b>1/2 = 0.5.</b> Check numerically: (8 × 1/32) ÷ (1/2) = (1/4) × 2 = 1/2 ✓.</p>"}}, {"id": "m0n8", "q": {"en": "Simplify √72 − √18, and give the decimal value."}, "a": {"en": "<h4>Given and assumptions</h4><p>Extract the largest perfect square from each surd.</p><h4>Formula</h4><p>√(a²b) = a√b</p><h4>Step-by-step solution</h4><ol><li>√72 = √(36 × 2) = 6√2</li><li>√18 = √(9 × 2) = 3√2</li><li>6√2 − 3√2 = 3√2 = 3 × 1.41421 = 4.243</li></ol><h4>Interpretation and check</h4><p><b>3√2 ≈ 4.243.</b> Check: 6 × 1.414 = 8.485 and 3 × 1.414 = 4.243; the difference is 4.243 ✓.</p>"}}, {"id": "m0n9", "q": {"en": "Multiply (3.6 × 10⁴) by (2.5 × 10³) and write the answer in standard form."}, "a": {"en": "<h4>Given and assumptions</h4><p>Front numbers and powers handled separately.</p><h4>Formula</h4><p>(a × 10ᵐ)(b × 10ⁿ) = ab × 10ᵐ⁺ⁿ</p><h4>Step-by-step solution</h4><ol><li>3.6 × 2.5 = 9.0</li><li>10⁴ × 10³ = 10⁷</li><li>= 9.0 × 10⁷ = 90,000,000</li></ol><h4>Interpretation and check</h4><p><b>9.0 × 10⁷.</b> Estimate 4 × 10⁴ × 2.5 × 10³ = 10 × 10⁷ = 1 × 10⁸, so 9 × 10⁷ is right.</p>"}}, {"id": "m0n10", "q": {"en": "Evaluate 2x² − 3x + 1 at x = −2."}, "a": {"en": "<h4>Given and assumptions</h4><p>Substitute the negative value inside brackets.</p><h4>Formula</h4><p>Replace x by (−2) everywhere, then apply BODMAS</p><h4>Step-by-step solution</h4><ol><li>2(−2)² − 3(−2) + 1</li><li>= 2(4) + 6 + 1</li><li>= 8 + 6 + 1 = 15</li></ol><h4>Interpretation and check</h4><p><b>15.</b> The common error is writing −2² for (−2)², which gives 8 − 6 + 1 = 3 instead of 15.</p>"}}, {"id": "m0n11", "q": {"en": "Expand (x + 3)(x − 5)."}, "a": {"en": "<h4>Given and assumptions</h4><p>Two binomials; multiply every term of the first by every term of the second.</p><h4>Formula</h4><p>(x + a)(x + b) = x² + (a + b)x + ab</p><h4>Step-by-step solution</h4><ol><li>x(x − 5) = x² − 5x</li><li>3(x − 5) = 3x − 15</li><li>x² − 5x + 3x − 15 = x² − 2x − 15</li></ol><h4>Interpretation and check</h4><p><b>x² − 2x − 15.</b> Check with x = 1: LHS (4)(−4) = −16; RHS 1 − 2 − 15 = −16 ✓.</p>"}}, {"id": "m0n12", "q": {"en": "Factorise 2x² + 7x − 15 and solve 2x² + 7x − 15 = 0."}, "a": {"en": "<h4>Given and assumptions</h4><p>a = 2, b = 7, c = −15; product a·c = −30.</p><h4>Formula</h4><p>Find two numbers with product a·c and sum b, split the middle term, group</p><h4>Step-by-step solution</h4><ol><li>10 × (−3) = −30 and 10 + (−3) = 7</li><li>2x² + 10x − 3x − 15 = 2x(x + 5) − 3(x + 5)</li><li>= (x + 5)(2x − 3)</li><li>x + 5 = 0 → x = −5; 2x − 3 = 0 → x = 3/2</li></ol><h4>Interpretation and check</h4><p><b>(x + 5)(2x − 3), roots −5 and 3/2.</b> Sum = −7/2 = −b/a ✓; product = −15/2 = c/a ✓.</p>"}}, {"id": "m0n13", "q": {"en": "Solve 3(x − 2) = 2x + 5."}, "a": {"en": "<h4>Given and assumptions</h4><p>One variable, one equation; remove the bracket first.</p><h4>Formula</h4><p>The same operation on both sides keeps the balance</p><h4>Step-by-step solution</h4><ol><li>3x − 6 = 2x + 5</li><li>3x − 2x = 5 + 6</li><li>x = 11</li></ol><h4>Interpretation and check</h4><p><b>x = 11.</b> Check: 3(11 − 2) = 27 and 2(11) + 5 = 27 ✓.</p>"}}, {"id": "m0n14", "q": {"en": "Solve 2x + 3y = 12 and x − y = 1."}, "a": {"en": "<h4>Given and assumptions</h4><p>Two equations, two unknowns; substitution is easiest because the second gives x.</p><h4>Formula</h4><p>x = y + 1 from the second equation</p><h4>Step-by-step solution</h4><ol><li>2(y + 1) + 3y = 12</li><li>2y + 2 + 3y = 12</li><li>5y = 10 → y = 2</li><li>x = 2 + 1 = 3</li></ol><h4>Interpretation and check</h4><p><b>x = 3, y = 2.</b> Check both: 2(3) + 3(2) = 12 ✓ and 3 − 2 = 1 ✓.</p>"}}, {"id": "m0n15", "q": {"en": "Three pens and two pencils cost ₹80; two pens and three pencils cost ₹70. Find the price of each."}, "a": {"en": "<h4>Given and assumptions</h4><p>Let a pen cost p and a pencil q. The words become two equations.</p><h4>Formula</h4><p>3p + 2q = 80 and 2p + 3q = 70</p><h4>Step-by-step solution</h4><ol><li>Multiply the first by 3: 9p + 6q = 240</li><li>Multiply the second by 2: 4p + 6q = 140</li><li>Subtract: 5p = 100 → p = 20</li><li>Then 3(20) + 2q = 80 → q = 10</li></ol><h4>Interpretation and check</h4><p><b>Pen ₹20, pencil ₹10.</b> Check the second equation: 2(20) + 3(10) = 70 ✓. Always answer in words with units.</p>"}}, {"id": "m0n16", "q": {"en": "Solve 3x² − 4x + 5 = 0 and comment on the roots."}, "a": {"en": "<h4>Given and assumptions</h4><p>a = 3, b = −4, c = 5.</p><h4>Formula</h4><p>x = (−b ± √(b² − 4ac)) / 2a; D = b² − 4ac</p><h4>Step-by-step solution</h4><ol><li>D = (−4)² − 4(3)(5) = 16 − 60 = −44</li><li>D < 0, so √D is not a real number</li><li>No real solution exists</li></ol><h4>Interpretation and check</h4><p><b>D = −44, no real roots.</b> The correct conclusion is \"no real roots\", not \"x = 0\". The parabola y = 3x² − 4x + 5 stays above the x-axis.</p>"}}, {"id": "m0n17", "q": {"en": "A rectangle is 5 m longer than it is wide and has area 84 m². Find its dimensions."}, "a": {"en": "<h4>Given and assumptions</h4><p>Let width = w metres, so length = w + 5 metres.</p><h4>Formula</h4><p>area = width × length</p><h4>Step-by-step solution</h4><ol><li>w(w + 5) = 84</li><li>w² + 5w − 84 = 0</li><li>(w + 12)(w − 7) = 0</li><li>w = 7 or w = −12</li></ol><h4>Interpretation and check</h4><p><b>7 m × 12 m.</b> A width cannot be negative, so −12 is rejected; 7 × 12 = 84 ✓.</p>"}}, {"id": "m0n18", "q": {"en": "Divide ₹4,500 in the ratio 2 : 3 : 4."}, "a": {"en": "<h4>Given and assumptions</h4><p>Total 4500; ratio parts 2, 3 and 4.</p><h4>Formula</h4><p>one part = total / sum of parts</p><h4>Step-by-step solution</h4><ol><li>Sum of parts = 9</li><li>One part = 4500 / 9 = 500</li><li>Shares = 1000, 1500, 2000</li></ol><h4>Interpretation and check</h4><p><b>₹1,000, ₹1,500 and ₹2,000.</b> Check the total: 1000 + 1500 + 2000 = 4500 ✓.</p>"}}, {"id": "m0n19", "q": {"en": "A price rises from ₹800 to ₹920 and later falls back to ₹800. Find both percentage changes."}, "a": {"en": "<h4>Given and assumptions</h4><p>Percentage change is measured against the original value each time.</p><h4>Formula</h4><p>change % = (new − old)/old × 100</p><h4>Step-by-step solution</h4><ol><li>Rise: (920 − 800)/800 × 100 = 15 %</li><li>Fall: (800 − 920)/920 × 100 = −13.04 %</li><li>Net: 800 × 1.15 × 0.8696 = 800 (back to the start only because 920 → 800 is a different base)</li></ol><h4>Interpretation and check</h4><p><b>+15 % then −13.04 %.</b> The two percentages are not equal because the bases differ - this is the classic successive-percentage trap.</p>"}}, {"id": "m0n20", "q": {"en": "For A(2, 3) and B(6, 6) find the distance AB, the midpoint and the slope of AB."}, "a": {"en": "<h4>Given and assumptions</h4><p>x₁ = 2, y₁ = 3 and x₂ = 6, y₂ = 6; gaps are 4 and 3.</p><h4>Formula</h4><p>AB = √((x₂−x₁)² + (y₂−y₁)²); M = ((x₁+x₂)/2, (y₁+y₂)/2); m = (y₂−y₁)/(x₂−x₁)</p><h4>Step-by-step solution</h4><ol><li>AB = √(4² + 3²) = √25 = 5</li><li>M = (8/2, 9/2) = (4, 4.5)</li><li>m = 3/4 = 0.75</li></ol><h4>Interpretation and check</h4><p><b>AB = 5, midpoint (4, 4.5), slope 0.75.</b> Check slope with the midpoint: (4.5 − 3)/(4 − 2) = 1.5/2 = 0.75 ✓.</p>"}}, {"id": "m0n21", "q": {"en": "If A = {1, 2, 3, 4} and B = {3, 4, 5}, find n(A ∪ B), A ∩ B and A − B."}, "a": {"en": "<h4>Given and assumptions</h4><p>Two sets with two elements in common.</p><h4>Formula</h4><p>n(A ∪ B) = n(A) + n(B) − n(A ∩ B)</p><h4>Step-by-step solution</h4><ol><li>A ∩ B = {3, 4}, so n(A ∩ B) = 2</li><li>n(A ∪ B) = 4 + 3 − 2 = 5, and indeed A ∪ B = {1, 2, 3, 4, 5}</li><li>A − B = {1, 2}</li></ol><h4>Interpretation and check</h4><p><b>5, {3, 4} and {1, 2}.</b> Check the parts: 1 and 2 only in A (2 elements), 3 and 4 in both (2), 5 only in B (1) → 2 + 2 + 1 = 5 ✓.</p>"}}, {"id": "m0n22", "q": {"en": "The marks of a student are 62, 78, 85 and 55. Find the mean. What is the new mean if the next test is 90?"}, "a": {"en": "<h4>Given and assumptions</h4><p>Four values, then five values after the next test.</p><h4>Formula</h4><p>mean = sum of values / count</p><h4>Step-by-step solution</h4><ol><li>Sum = 62 + 78 + 85 + 55 = 280</li><li>Mean = 280 / 4 = 70</li><li>After 90: (280 + 90) / 5 = 370 / 5 = 74</li></ol><h4>Interpretation and check</h4><p><b>70, then 74.</b> Check the change: the new value is 20 above the old mean, so the mean rises by 20/5 = 4 ✓.</p>"}}], "viva": [{"title": {"en": "Numbers, fractions and indices"}, "items": [{"q": {"en": "Is every integer a rational number?"}, "a": {"en": "Yes: any integer n can be written as n/1."}}, {"q": {"en": "What is the difference between GCD and LCM?"}, "a": {"en": "GCD is the largest number dividing both values; LCM is the smallest number both values divide."}}, {"q": {"en": "How do you add two fractions with different denominators?"}, "a": {"en": "Take the LCM of the denominators, rewrite both fractions over it, then add the numerators."}}, {"q": {"en": "State the BODMAS order."}, "a": {"en": "Brackets, Orders (powers and roots), Division and Multiplication left to right, Addition and Subtraction left to right."}}, {"q": {"en": "What is a⁻ⁿ?"}, "a": {"en": "The reciprocal of aⁿ: a⁻ⁿ = 1/aⁿ, so 2⁻³ = 1/8."}}, {"q": {"en": "What is a surd?"}, "a": {"en": "An irrational root such as √2 or 3√5 that cannot be simplified to a whole number."}}]}, {"title": {"en": "Algebra"}, "items": [{"q": {"en": "Expand (a + b)²."}, "a": {"en": "a² + 2ab + b² - the middle term must not be dropped."}}, {"q": {"en": "Factorise a² − b²."}, "a": {"en": "(a + b)(a − b), the difference of two squares."}}, {"q": {"en": "How do you factorise 2x² + 7x − 15?"}, "a": {"en": "Split the middle term using numbers with product −30 and sum 7 (10 and −3), group, then write (x + 5)(2x − 3)."}}, {"q": {"en": "What does it mean if a quadratic has D < 0?"}, "a": {"en": "The equation has no real roots; the parabola does not meet the x-axis."}}, {"q": {"en": "Give the quadratic formula."}, "a": {"en": "x = (−b ± √(b² − 4ac)) / 2a for ax² + bx + c = 0."}}]}, {"title": {"en": "Equations and word problems"}, "items": [{"q": {"en": "Why do you substitute the answer back into the equation?"}, "a": {"en": "To verify the solution satisfies the original equation and to catch sign or arithmetic errors."}}, {"q": {"en": "When do two linear equations have no solution?"}, "a": {"en": "When their slopes are equal but intercepts differ, that is the lines are parallel."}}, {"q": {"en": "Which method is faster for x − y = 1 and 2x + 3y = 12?"}, "a": {"en": "Substitution, because the first equation already gives x = y + 1."}}, {"q": {"en": "In a rectangle word problem, why is the negative root rejected?"}, "a": {"en": "Because a physical length cannot be negative; state the rejection explicitly."}}]}, {"title": {"en": "Ratio, percentage, sets, coordinates"}, "items": [{"q": {"en": "How do you divide an amount in a given ratio?"}, "a": {"en": "Divide the total by the sum of the ratio parts, then multiply by each part."}}, {"q": {"en": "Why is a 15 % rise followed by a 15 % fall not a return to the original price?"}, "a": {"en": "The percentages are taken on different bases; the factors 1.15 and 0.85 multiply to 0.9775."}}, {"q": {"en": "What is A ∩ B?"}, "a": {"en": "The set of elements present in both A and B."}}, {"q": {"en": "State the distance formula."}, "a": {"en": "AB = √((x₂ − x₁)² + (y₂ − y₁)²)."}}, {"q": {"en": "What does a slope of zero mean?"}, "a": {"en": "The line is horizontal: y does not change as x changes."}}, {"q": {"en": "Why is the mean not always a good average?"}, "a": {"en": "A single extreme value can pull it far from the typical value; the median resists this."}}]}], "exam_questions": [{"q": {"en": "Practice: Simplify (−8) − (−5) + (−3) × 2."}, "marks": 3}, {"q": {"en": "Practice: Add 3/8 + 5/6 and simplify."}, "marks": 3}, {"q": {"en": "Practice: Find the GCD and LCM of 36 and 60."}, "marks": 4}, {"q": {"en": "Practice: Evaluate 12 ÷ 3 × 2 + (4 − 1)²."}, "marks": 3}, {"q": {"en": "Practice: Simplify 3x² − 5x + 2x² + 7 − x."}, "marks": 3}, {"q": {"en": "Practice: Expand (2x − 3)(x + 4)."}, "marks": 4}, {"q": {"en": "Practice: Factorise x² − 9x + 20."}, "marks": 3}, {"q": {"en": "Practice: Solve 5(x + 1) = 3x + 17."}, "marks": 3}, {"q": {"en": "Practice: Solve 3x + 2y = 16 and x − y = 2."}, "marks": 4}, {"q": {"en": "Practice: Solve x² + 2x − 8 = 0 and state the nature of the roots."}, "marks": 4}, {"q": {"en": "Practice: A number plus its square is 30. Find the number."}, "marks": 4}, {"q": {"en": "Practice: Find the distance, midpoint and slope for P(1, 2) and Q(7, 10)."}, "marks": 4}, {"q": {"en": "Practice: What is 18 % of 250, and what is 250 increased by 18 %?"}, "marks": 3}, {"q": {"en": "Practice: A sum of ₹6,000 is divided in the ratio 3 : 5. Find both shares."}, "marks": 3}], "learning_outcomes": [{"en": "Use fractions, powers, roots and standard form without a calculator."}, {"en": "Expand and factorise algebraic expressions, and check the result by expanding back."}, {"en": "Solve linear, simultaneous and quadratic equations, including word problems."}, {"en": "Work with sets, ratio, percentage and averages in engineering contexts."}, {"en": "Read the coordinate plane and compute distance, midpoint and slope."}], "course_outcomes": [], "practical_numbers": [], "content_kind": "theory", "lesson_count": 31, "answered_practice_count": 14, "assessment_note": {"en": "This is a DiplomaOne foundation chapter, not a GTU syllabus unit: it carries no official hours, weightage or marks. Practice marks are suggested revision sizes. Model answers are in Notes section 9."}, "question_provenance": "Original answered revision questions; not official past papers", "question_marks_are_suggested": true, "sources": [{"title": "GTU DI01000021, Mathematics-I, Branch: All, Semester 1, w.e.f. 2024-25 (uploaded syllabus)", "url": "https://s3-ap-southeast-1.amazonaws.com/gtusitecirculars/Syallbus/DI01000021.pdf"}, {"title": "Khan Academy - arithmetic, algebra basics and quadratics", "url": "https://www.khanacademy.org/math/algebra"}, {"title": "GeoGebra - plot functions, lines and circles to check your answers", "url": "https://www.geogebra.org/"}, {"title": "OpenStax - Elementary Algebra 2e (free textbook)", "url": "https://openstax.org/details/books/elementary-algebra-2e"}, {"title": "NCERT - Class 10 Mathematics textbook (fractions, polynomials, coordinate geometry)", "url": "https://ncert.nic.in/textbook.php"}]};
const SVG = {"m0_numberline": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 240\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"240\" fill=\"#ffffff\"/><text x=\"180\" y=\"28.9\" font-size=\"14\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">One line holds every number</text><text x=\"180\" y=\"49.7\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">Right adds, left subtracts, |x| is the distance from 0</text><path d=\"M24 150 H330\" fill=\"none\" stroke=\"#333\" stroke-width=\"2.0\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polygon points=\"342,150 332,146 332,154\" fill=\"#333\"/><path d=\"M24 145 V155\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"24\" y=\"173.2\" font-size=\"9\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">−6</text><path d=\"M50 145 V155\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"173.2\" font-size=\"9\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">−5</text><path d=\"M76 145 V155\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"76\" y=\"173.2\" font-size=\"9\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">−4</text><path d=\"M102 145 V155\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"102\" y=\"173.2\" font-size=\"9\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">−3</text><path d=\"M128 145 V155\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"128\" y=\"173.2\" font-size=\"9\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">−2</text><path d=\"M154 145 V155\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke const dgInline = id => `<div class="dg" data-dg="${id}">${SVG[id]}</div><div class="dgc">📐 ${t(U.diagrams.find(d=>d.id===id).title)} · ${L('tapzoom')}</div>`;

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const KW = new Set('auto break case const continue default do else enum extern for goto if register return signed sizeof static struct switch typedef union unsigned volatile while'.split(' '));
const TY = new Set('int char float double void long short FILE size_t'.split(' '));
const PKW = new Set('False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield'.split(' '));
const PTY = new Set('int float str bool list tuple set dict complex frozenset bytes bytearray range object'.split(' '));
function hlPy(src){
  const re = /(#[^\n]*)|((?:\b[rRbBfFuU]{1,2})?(?:'{3}[\s\S]*?'{3}|"{3}[\s\S]*?"{3}|'(?:\\.|[^'\\\n])*'|"(?:\\.|[^"\\\n])*"))|(^>>>|^\.\.\.(?= ))|([A-Za-z_]\w*)(?=\s*\()|([A-Za-z_]\w*)|(\b(?:0[xXoObB][0-9a-fA-F_]+|\d[\d_]*(?:\.\d+)?(?:[eE][-+]?\d+)?j?)\b)/gm;
  let o='', last=0, m;
  while ((m = re.exec(src))){
    o += esc(src.slice(last, m.index)); last = re.lastIndex;
    const w = esc(m[0]);
    if (m[1]) o += `<span class="cm">${w}</span>`;
    else if (m[2]) o += `<span class="st">${w}</span>`;
    else if (m[3]) o += `<span class="pp">${w}</span>`;
    else if (m[4]) o += PKW.has(m[4]) ? `<span class="kw">${w}</span>` : PTY.has(m[4]) ? `<span class="ty">${w}</span>` : `<span class="fn">${w}</span>`;
    else if (m[5]) o += PKW.has(m[5]) ? `<span class="kw">${w}</span>` : PTY.has(m[5]) ? `<span class="ty">${w}</span>` : w;
    else o += `<span class="nu">${w}</span>`;
  }
  return o + esc(src.slice(last));
}
function hl(src){
  if (META.code_lang === 'python') return hlPy(src);
  if (META.code_lang === 'nosql') return esc(src);
  const re = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(^[ \t]*#[^\n]*)|([A-Za-z_]\w*)(?=\s*\()|([A-Za-z_]\w*)|(\b\d+(?:\.\d+)?[fFlLuU]*\b)/gm;
  let o='', last=0, m;
  while ((m = re.exec(src))){
    o += esc(src.slice(last, m.index)); last = re.lastIndex;
    const w = esc(m[0]);
    if (m[1]) o += `<span class="cm">${w}</span>`;
    else if (m[2]) o += `<span class="st">${w}</span>`;
    else if (m[3]) o += `<span class="pp">${w}</span>`;
    else if (m[4]) o += KW.has(m[4]) ? `<span class="kw">${w}</span>` : TY.has(m[4]) ? `<span class="ty">${w}</span>` : `<span class="fn">${w}</span>`;
    else if (m[5]) o += KW.has(m[5]) ? `<span class="kw">${w}</span>` : TY.has(m[5]) ? `<span class="ty">${w}</span>` : w;
    else o += `<span class="nu">${w}</span>`;
  }
  return o + esc(src.slice(last));
}
const progBody = p => p.items
  ? p.items.map(it => fixTables(t(it.body)) + (it.diagram?dgInline(it.diagram):'')).join('')
  : `<div class="pl">${L('code')}</div><pre class="code">${hl(t(p.code))}</pre><div class="pl">${L('output')}</div><pre class="out">${esc(p.out)}</pre>${p.plot?`<div class="pl">${L('plot')}</div>`+dgInline(p.plot).replace('class="dg"','class="dg pg"'):''}${p.expl?`<div class="pl">${L('expl')}</div>${fixTables(t(p.expl))}`:''}`;
const pBox = id => { const p=(U.programs||[]).find(x=>x.id===id); if(!p) return ''; return `<div class="pbox"><div class="et">${L('prog')}: ${t(p.title)}</div>${progBody(p)}</div>`; };
const exBox = id => { const n=(U.numericals||[]).find(x=>x.id===id); if(!n) return ''; return `<div class="ex"><div class="et">${L('ex')}</div><div class="eq2">${t(n.q)}</div>${fixTables(t(n.a))}</div>`; };
function notes(){
  let h = `<div class="intro"><b>${t(U.title)}</b><div>${L('unit')} ${U.unit} · ${U.weightage}% ${L('intro')} · ${U.hours} ${L('hours')}</div><div>${U.intro_text ? t(U.intro_text) : L(U.programs?(META.code_lang==='python'?'intropy':'introc'):'introd')}</div></div>`;
  U.notes.forEach((sec,si)=>{
    h += `<div class="sec">${head(t(sec.title))}`;
    sec.items.forEach((it,i)=>{
      const open = si===0&&i===0 ? ' open' : '';
      if (it.h) {
        h += `<div class="card${it.key?' key':''}${open}"><div class="q hd"><span class="t">${it.key?'⭐ ':''}${t(it.h)}</span>${chev}</div>
        <div class="a rn" style="padding-left:18px">${fixTables(t(it.body)).replace(/margin:0 0 10px -36px/g,'')}${it.diagram?dgInline(it.diagram):''}${(it.examples||[]).map(exBox).join('')}${(it.programs||[]).map(pBox).join('')}</div></div>`;
      } else {
        h += `<div class="card${open}"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(it.q)}</span>${chev}</div>
        <div class="a">${fixTables(t(it.a))}${it.diagram?dgInline(it.diagram):''}</div></div>`;
      }
    });
    h += `</div>`;
  });
  return h;
}
function numericals(){
  return `<div class="sec">${head(L('numericals'))}` + (U.numericals||[]).map((n,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(n.q)}</span>${chev}</div><div class="a">${fixTables(t(n.a))}</div></div>`).join('') + `</div>`;
}
function diagrams(){
  return `<div class="sec">${head(L((U.tabs ? U.tabs.includes('flowcharts')&&!U.tabs.includes('diagrams') : U.programs&&META.code_lang!=='python')?'flowcharts':'diagrams'),false)}<div style="height:10px"></div>` + U.diagrams.map((d,i)=>
    `<div class="dcard" data-dg="${d.id}"><div class="h">${i+1}. ${t(d.title)}</div>${SVG[d.id]}</div>`).join('') + `</div>`;
}
function equations(){
  return U.equations.map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><span class="fbox">${e.f}</span></span>${chev}</div>
     <div class="a"><p>${t(e.terms)}</p></div></div>`).join('') + `</div>`).join('');
}
function viva(){
  // two shapes exist in the corpus: flat [{q,a}] and grouped [{title, items:[{q,a}]}]
  const groups = U.viva.every(v=>v && v.q) ? [{items: U.viva}] : U.viva;
  return groups.map(g=>{
    const items = g.items || [];
    return `<div class="sec">${g.title?head(t(g.title)):''}` + items.map((v,i)=>
      `<div class="card"><div class="q hd"><span class="n">${i+1}.</span><span class="t">${t(v.q)}</span>${chev}</div><div class="a"><p>${t(v.a)}</p></div></div>`).join('') + `</div>`;
  }).join('');
}
function exam(){
  return `<div class="sec">${head(L('examhead'),false)}` + U.exam_questions.map((x,i)=>
    `<div class="card"><div class="q" style="cursor:default"><span class="n">${i+1}.</span><span class="t">${t(x.q)}</span><span class="mk">${x.marks} ${L('marks')}</span></div></div>`).join('') + `</div>`;
}
function programs(){
  return `<div class="sec">${head(L('programs'))}` + (U.programs||[]).map((p,i)=>
    `<div class="card"><div class="q hd"><span class="n">${i+1}.</span><span class="t">${t(p.title)}</span>${chev}</div><div class="a pa">${progBody(p)}</div></div>`).join('') + `</div>`;
}
function syntax(key){
  return (U[typeof key==='string'?key:'syntax']||[]).map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><pre class="code sx">${hl(e.f)}</pre></span>${chev}</div>
     <div class="a">${e.terms && t(e.terms) ? fixTables(t(e.terms)) : ''}</div></div>`).join('') + `</div>`).join('');
}
const flowcharts = diagrams;
const algorithms = () => syntax('algorithms');
const ALLV = {notes, programs, diagrams, flowcharts, algorithms, syntax, equations, numericals, viva, exam};
const VIEWS = U.tabs ? Object.fromEntries(U.tabs.map(k=>[k, ALLV[k]])) : U.programs ? (META.code_lang==='python' ? {notes, programs, diagrams, syntax, viva, exam} : {notes, programs, flowcharts, syntax, viva, exam}) : U.numericals ? {notes, diagrams, equations, numericals, viva, exam} : {notes, diagrams, equations, viva, exam};
function render(){
  document.getElementById('title').textContent = `${L('unit')} ${U.unit}: ${t(U.title)}`;
  document.getElementById('sub').textContent = `${t(META.name)} · ${META.code}`;
  document.getElementById('lang').textContent = S.lang==='en' ? 'ગુ' : 'EN';
  document.getElementById('lang').style.display = META.languages.includes('gu') ? '' : 'none';
  document.getElementById('tabs').innerHTML = Object.keys(VIEWS).map(k=>`<button class="tab${S.tab===k?' on':''}" data-tab="${k}">${L(k)}</button>`).join('');
  document.getElementById('view').innerHTML = VIEWS[S.tab]();
  document.querySelectorAll('#view pre.c').forEach(e=>{ e.innerHTML = hl(e.textContent); e.className='code'; });
}
let zoom = 1;
function setZoom(z){ zoom = Math.min(4, Math.max(1, z)); const w=document.getElementById('zw'); w.style.width=(zoom*100)+'%'; document.getElementById('zr').textContent=Math.round(zoom*100)+'%'; }
document.addEventListener('click', e=>{
  const q = e.target.closest('.q'); if (q && q.parentElement.querySelector('.a')) { q.parentElement.classList.toggle('open'); return; }
  const tb = e.target.closest('[data-tab]'); if (tb){ S.tab = tb.dataset.tab; render(); window.scrollTo(0,0); return; }
  if (e.target.closest('#lang')){ S.lang = S.lang==='en'?'gu':'en'; render(); return; }
  const m = e.target.closest('[data-more]');
  document.querySelectorAll('.menu.show').forEach(x=>{ if(!m || x!==m.nextElementSibling) x.classList.remove('show'); });
  if (m){ m.nextElementSibling.classList.toggle('show'); return; }
  const act = e.target.closest('[data-act]');
  if (act){ act.closest('.sec').querySelectorAll('.card').forEach(c=>{ if(c.querySelector('.a')) c.classList.toggle('open', act.dataset.act==='expand'); }); act.parentElement.classList.remove('show'); return; }
  const dg = e.target.closest('[data-dg]');
  if (dg){ const id=dg.dataset.dg; document.getElementById('mt').textContent=t(U.diagrams.find(d=>d.id===id).title); document.getElementById('zw').innerHTML=SVG[id]; setZoom(1); document.getElementById('modal').classList.add('show'); return; }
  if (e.target.closest('#mx')) document.getElementById('modal').classList.remove('show');
  if (e.target.closest('#zi')) setZoom(zoom+0.5);
  if (e.target.closest('#zo')) setZoom(zoom-0.5);
  if (e.target.closest('#zr')) setZoom(1);
});
render();
</script></body></html>
