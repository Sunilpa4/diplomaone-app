<style>
:root{--p:#7B2CD9;--pd:#6420B8;--lav:#EADDF7;--bg:#F3ECFA;--ink:#1d1b20}

body{margin:0;background:#d8cce8;font-family:"Noto Sans Gujarati","Shruti","Nirmala UI",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink)}

.sh{background:var(--lav);display:flex;align-items:center;justify-content:space-between;padding:16px 14px 16px 18px;font-weight:800;font-size:17px;position:relative}
.more{background:none;border:0;padding:4px 6px;cursor:pointer;border-radius:50%}
.menu{display:none;position:absolute;right:12px;top:48px;background:#fff;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.18);z-index:5;overflow:hidden;min-width:150px}
.menu.show{display:block}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:12px 16px;font-size:14.5px;cursor:pointer}

.intro{margin:12px 10px;background:linear-gradient(135deg,#8E3BE8,#5B1BB0);color:#fff;border-radius:14px;padding:14px 16px}

.chips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.chips span{background:rgba(255,255,255,.18);border-radius:12px;padding:3px 10px;font-size:12px;font-weight:700}
pre.code{background:#1E1530;color:#EDE7F6;border-radius:8px;padding:10px 12px;font:13px/1.55 "JetBrains Mono",Consolas,"DejaVu Sans Mono","Noto Sans Gujarati",monospace;overflow-x:auto;margin:0 0 10px;white-space:pre;tab-size:4}

.kw{color:#C792EA;font-weight:700}.ty{color:#82AAFF}.st{color:#C3E88D}.cm{color:#8E9AAF;font-style:italic}.pp{color:#F78C6C}.nu{color:#F9C46B}.fn{color:#FFCB6B}
.pl{font-size:12px;font-weight:800;color:var(--pd);margin:10px 0 4px;letter-spacing:.4px;text-transform:uppercase}
@media (max-width:480px){pre.code,pre.out{font-size:11.5px;padding:9px 10px}}
.a code{background:#F1E9FB;color:#5B1BB0;padding:1px 5px;border-radius:4px;font-family:Consolas,"DejaVu Sans Mono",monospace;font-size:.9em}
.pbox{margin:12px 0 10px;border:1.5px dashed #2E8B7A;background:#F2FBF8;border-radius:10px;padding:10px 12px}
.pbox .et{font-weight:800;color:#1F6E60;font-size:13.5px;margin-bottom:6px}
.sx{margin:6px 0 0;font-size:12.5px;padding:8px 10px}
.a.pa{padding-left:16px}

<script>
const U = {"subject": "DI04000031", "unit": 5, "format": "notes", "title": {"en": "Key-Value Databases: Redis"}, "hours": 10, "weightage": 17, "tabs": ["notes", "programs", "diagrams", "syntax", "viva"], "intro_text": {"en": "Concise syllabus coverage: Redis overview/setup; Strings, Lists, Sets and Hashes; basic commands; transactions; caching/TTL; AI use cases and simplified application integration. Includes eight real Redis examples for Practical 9, without advanced extras."}, "notes": [{"title": {"en": "Redis — Required Topics in Brief"}, "items": [{"h": {"en": "5.1 Overview and installation"}, "body": {"en": "<p><b>Redis</b> stores keys mapped to data structures, mainly served from memory. It is useful for caches, sessions, counters and simple queues. Persistence is configurable; do not assume a memory-first cache is a durable system of record.</p><p>Install using the official guide for your OS. Start a private, authenticated instance and connect with redis-cli. The usual port is <b>6379</b>; use your actual settings. Keep passwords out of shared code and never expose Redis directly to public browsers.</p><pre class=\"c\">redis-cli --user YOUR_USER --askpass PING\n# Enter your private password; expected CLI reply: PONG</pre><p>This unit covers <b>10 hours / 17%</b>, <b>CO5</b> and <b>Practical 9</b>: install Redis and practise Strings, Lists, Sets and Hashes. CLI snippets use practice keys on your own instance; the downloadable Python examples isolate and clean their own keys.</p>"}, "diagram": "ns5_types", "programs": ["ns5p01"]}, {"h": {"en": "5.2 Strings and basic key operations"}, "body": {"en": "<p>A <b>String</b> stores a byte/string value. Use SET/GET, INCR for an integer-formatted counter, EXISTS to test a key, TYPE to inspect its type and DEL to remove it. A missing GET returns nil/null; using the wrong structure command can raise WRONGTYPE.</p><pre class=\"c\">SET lab:product 'Sensor Node'\nGET lab:product\nSET lab:views 10\nINCR lab:views\nTYPE lab:product\nEXISTS lab:product\nDEL lab:product</pre><p>SET normally replaces the existing value. Redis hash field values and numeric-looking strings are not automatically Python numbers.</p>"}, "programs": ["ns5p01", "ns5p02"]}, {"h": {"en": "5.3 Lists"}, "body": {"en": "<p>A <b>List</b> is ordered and allows duplicates. LPUSH/RPUSH add at the left/right; LPOP/RPOP remove from those ends. LRANGE 0 -1 reads the whole list. RPUSH plus LPOP gives a basic FIFO pattern, not a complete reliable job-processing system.</p><pre class=\"c\">RPUSH lab:jobs train evaluate\nLPUSH lab:jobs load\nLRANGE lab:jobs 0 -1\nLPOP lab:jobs</pre><p>Here the list is load, train, evaluate; LPOP removes load.</p>"}, "programs": ["ns5p03"]}, {"h": {"en": "5.4 Sets"}, "body": {"en": "<p>A <b>Set</b> stores unique, unordered members. SADD adds, SMEMBERS reads, SISMEMBER tests membership and SREM removes. Adding Python twice does not create two members.</p><pre class=\"c\">SADD lab:skills Python Redis Python\nSMEMBERS lab:skills\nSISMEMBER lab:skills Python\nSREM lab:skills Redis</pre><p>Suitable examples: unique skills, tags or visitor IDs. Display order is not guaranteed; the Python example sorts only for readable output.</p>"}, "programs": ["ns5p04"]}, {"h": {"en": "5.5 Hashes"}, "body": {"en": "<p>A <b>Hash</b> stores field–value pairs under one key, for example a small user/profile record. HSET writes fields, HGET reads one, HGETALL reads all and HDEL removes fields.</p><pre class=\"c\">HSET lab:user name Asha city Surat age 20\nHGET lab:user name\nHGETALL lab:user\nHDEL lab:user age</pre><p>The age value is stored/read as string \"20\" in these examples. Use a list for ordered items, a set for unique members and a hash for named fields.</p>"}, "programs": ["ns5p05"]}, {"h": {"en": "5.6 Transactions"}, "body": {"en": "<p><b>MULTI</b> queues commands; <b>EXEC</b> executes them together without another client’s command interleaving during execution. <b>DISCARD</b> cancels the queued work before execution.</p><pre class=\"c\">MULTI\nINCR lab:views\nGET lab:views\nEXEC\n# DISCARD cancels queued commands before execution.</pre><p><b>No rollback:</b> an execution-time error does not undo successful commands, and later queued commands can still run. Program 6 demonstrates this with a non-integer INCR and a later successful write. The Python transaction pipeline uses MULTI/EXEC.</p>"}, "diagram": "ns5_transaction", "programs": ["ns5p06"]}, {"h": {"en": "5.7 Caching, expiry and invalidation"}, "body": {"en": "<p>A <b>cache hit</b> finds the value; a <b>miss</b> requires the source. In <b>cache-aside</b>, the application reads Redis first, then loads and caches the source value on a miss.</p><pre class=\"c\">SET lab:recs 'P101,P102' EX 60\nGET lab:recs\nTTL lab:recs\nDEL lab:recs   # invalidate after a source-data change</pre><ul><li><b>TTL:</b> limits lifetime. TTL returns seconds; -1 means no expiry and -2 means missing.</li><li><b>Invalidation:</b> delete/update cached data when the authoritative value changes.</li><li><b>Other strategies:</b> write-through updates cache with source writes; write-behind delays source writes and needs careful failure handling.</li></ul><p>Expiry is not memory-pressure eviction. Caches may be stale or unavailable; keep a source fallback and do not claim unlimited memory, durability or guaranteed speedups.</p>"}, "diagram": "ns5_cache", "programs": ["ns5p02", "ns5p07"]}, {"h": {"en": "5.8 AI use cases and simplified application integration"}, "body": {"en": "<p>Redis can cache <b>recommendation IDs</b>, temporary feature values or sessions, and hold simple job lists. Storing these values does <b>not train an AI model</b>.</p><p><b>Integration:</b> application → Redis; on a miss → source database/service → Redis with TTL → response. Use an official client such as Python redis-py. Version cache keys when the model/data meaning changes and protect personal data.</p><pre class=\"c\">GET cache-key\n# HIT: return the cached value.\n# MISS: read the authoritative source, then\nSET cache-key value EX 60</pre><p>Program 8 really connects Python to Redis and shows source → cache → invalidation. Its source is a small <b>local dictionary fixture</b>, not a live MongoDB/Cassandra integration or benchmark. The reference uses Redis/CLI <b>8.10.3</b> and redis-py <b>8.1.0</b>, privately on port 6385.</p>"}, "diagram": "ns5_integration", "programs": ["ns5p07", "ns5p08"]}]}, {"title": {"en": "Five Short Practical Tasks"}, "role": "practice", "items": [{"h": {"en": "Install/connect and verify one stored round-trip."}, "body": {"en": "Use your OS guide, private authentication and redis-cli PING. SET a disposable string, GET the same value, then DEL only that key."}}, {"h": {"en": "Choose and practise the four structures."}, "body": {"en": "String: product name/counter. List: ordered jobs. Set: unique skills. Hash: named user fields. Use the corresponding quick-reference commands."}}, {"h": {"en": "Execute a small transaction and explain failure behaviour."}, "body": {"en": "Use MULTI/EXEC (or the Python transaction pipeline). Program 6 returns [11,\"11\"]; a later example’s failed INCR does not prevent its subsequent SET. DISCARD cancels before execution."}}, {"h": {"en": "Add expiry and invalidate a cached recommendation."}, "body": {"en": "SET the result with EX 60, confirm TTL is active, read it as a hit, then DEL it on source change. TTL -2 confirms it is missing."}}, {"h": {"en": "Demonstrate simple application integration."}, "body": {"en": "Run program 8: first read comes from the local source fixture; second from Redis. Update the fixture, invalidate, and read the new value. Record actual outputs; no trained model or live multi-database claim."}}]}], "programs": [{"id": "ns5p01", "title": {"en": "Connect and Use Basic Keys"}, "code": {"en": "from lab import Lab, show\n\nwith Lab('ns5p01',['product']) as lab:\n    r=lab.r; k=lab.key('product')\n    show('ping',r.ping())\n    show('set',r.set(k,'Sensor Node'))\n    show('get',r.get(k))\n    show('exists',r.exists(k))\n    show('type',r.type(k))\n    show('deleted',r.delete(k))\n    show('missing',r.get(k))"}, "out": "ping: true\nset: true\nget: \"Sensor Node\"\nexists: 1\ntype: \"string\"\ndeleted: 1\nmissing: null", "expl": {"en": "<p>Real stored round-trip. redis-py reports PING/SET success as true; redis-cli shows PONG/OK. Lab isolates and cleans declared keys.</p>"}}, {"id": "ns5p02", "title": {"en": "String Counter and Expiry"}, "code": {"en": "from lab import Lab, show\n\nwith Lab('ns5p02',['views','temporary']) as lab:\n    r=lab.r; k=lab.key('views'); temp=lab.key('temporary')\n    r.set(k,'10')\n    show('incremented',r.incr(k))\n    show('stored_string',r.get(k))\n    r.set(temp,'cached',ex=60)\n    show('ttl_active',0<r.ttl(temp)<=60)\n    r.expire(temp,0)\n    show('after_immediate_expiry',r.get(temp))\n    show('missing_ttl',r.ttl(temp))"}, "out": "incremented: 11\nstored_string: \"11\"\nttl_active: true\nafter_immediate_expiry: null\nmissing_ttl: -2", "expl": {"en": "<p>INCR returns integer 11; GET reads string \"11\". SET EX adds a lifetime; EXPIRE 0 immediately expires the key. TTL -2 means missing.</p>"}}, {"id": "ns5p03", "title": {"en": "Ordered List Operations"}, "code": {"en": "from lab import Lab, show\n\nwith Lab('ns5p03',['jobs']) as lab:\n    r=lab.r; k=lab.key('jobs')\n    r.rpush(k,'train','evaluate'); r.lpush(k,'load')\n    show('jobs',r.lrange(k,0,-1))\n    show('removed_left',r.lpop(k))\n    show('remaining',r.lrange(k,0,-1))\n    show('length',r.llen(k))"}, "out": "jobs: [\"load\",\"train\",\"evaluate\"]\nremoved_left: \"load\"\nremaining: [\"train\",\"evaluate\"]\nlength: 2", "expl": {"en": "<p>Lists preserve order. These are job-name strings, not executed AI training or a reliable-worker implementation.</p>"}}, {"id": "ns5p04", "title": {"en": "Unique Set Members"}, "code": {"en": "from lab import Lab, show\n\nwith Lab('ns5p04',['skills']) as lab:\n    r=lab.r; k=lab.key('skills')\n    show('added',r.sadd(k,'Python','Redis','Python'))\n    show('members',sorted(r.smembers(k)))\n    show('has_python',r.sismember(k,'Python'))\n    show('removed',r.srem(k,'Redis'))\n    show('remaining',sorted(r.smembers(k)))"}, "out": "added: 2\nmembers: [\"Python\",\"Redis\"]\nhas_python: 1\nremoved: 1\nremaining: [\"Python\"]", "expl": {"en": "<p>Duplicate Python is stored once. Sorting is only for readable output; Redis set order is not guaranteed.</p>"}}, {"id": "ns5p05", "title": {"en": "Hash Fields"}, "code": {"en": "from lab import Lab, show\n\nwith Lab('ns5p05',['user']) as lab:\n    r=lab.r; k=lab.key('user')\n    show('new_fields',r.hset(k,mapping={\n        'name':'Asha','city':'Surat','age':'20'}))\n    show('name',r.hget(k,'name'))\n    show('profile',r.hgetall(k))\n    show('removed_age',r.hdel(k,'age'))\n    show('remaining',r.hgetall(k))"}, "out": "new_fields: 3\nname: \"Asha\"\nprofile: {\"age\":\"20\",\"city\":\"Surat\",\"name\":\"Asha\"}\nremoved_age: 1\nremaining: {\"city\":\"Surat\",\"name\":\"Asha\"}", "expl": {"en": "<p>A hash keeps named string fields under one key. The helper sorts map fields for stable display; it does not change stored values.</p>"}}, {"id": "ns5p06", "title": {"en": "Transactions and the No-Rollback Rule"}, "code": {"en": "from lab import Lab, show\n\nwith Lab('ns5p06',['count','after']) as lab:\n    r=lab.r; k=lab.key('count'); after=lab.key('after')\n    r.set(k,'10')\n    with r.pipeline(transaction=True) as p:\n        p.incr(k); p.get(k)\n        show('exec',p.execute())\n    r.set(k,'text')\n    with r.pipeline(transaction=True) as p:\n        p.incr(k); p.set(after,'done')\n        show('exec_with_error',p.execute(raise_on_error=False))\n    show('later_write',r.get(after))"}, "out": "exec: [11,\"11\"]\nexec_with_error: [{\"server_error\":\"value is not an integer or out of range\"},true]\nlater_write: \"done\"", "expl": {"en": "<p>The transaction pipeline uses MULTI/EXEC. A real non-integer INCR error does not stop the later SET; Redis does not roll back successful commands.</p>"}}, {"id": "ns5p07", "title": {"en": "Recommendation Cache and Invalidation"}, "code": {"en": "from lab import Lab, show\n\nwith Lab('ns5p07',['recs:U42:v1']) as lab:\n    r=lab.r; k=lab.key('recs:U42:v1')\n    show('initial_miss',r.get(k))\n    r.set(k,'P101,P102',ex=60)\n    show('cache_hit',r.get(k))\n    show('ttl_active',0<r.ttl(k)<=60)\n    r.delete(k)\n    show('after_invalidation',r.get(k))"}, "out": "initial_miss: null\ncache_hit: \"P101,P102\"\nttl_active: true\nafter_invalidation: null", "expl": {"en": "<p>Cache recommendation IDs under a versioned key with TTL. These fixed IDs are not output from a trained model; invalidation removes the cached copy.</p>"}}, {"id": "ns5p08", "title": {"en": "Python Cache-Aside Integration"}, "code": {"en": "from lab import Lab, show\n\nwith Lab('ns5p08',['product:P101']) as lab:\n    r=lab.r; k=lab.key('product:P101')\n    source={'P101':'Sensor Node'}\n    def read_product():\n        value=r.get(k)\n        if value is not None:\n            return {'from':'cache','value':value}\n        value=source['P101']\n        r.set(k,value,ex=60)\n        return {'from':'source','value':value}\n    show('first',read_product())\n    show('second',read_product())\n    source['P101']='Sensor Node v2'; r.delete(k)\n    show('after_update',read_product())"}, "out": "first: {\"from\":\"source\",\"value\":\"Sensor Node\"}\nsecond: {\"from\":\"cache\",\"value\":\"Sensor Node\"}\nafter_update: {\"from\":\"source\",\"value\":\"Sensor Node v2\"}", "expl": {"en": "<p>Actual Python + Redis: miss → source fixture, hit → Redis, update/invalidate → new source value. The dictionary is not a live MongoDB/Cassandra service or a performance benchmark.</p>"}}], "diagrams": [{"id": "ns5_types", "title": {"en": "Four Required Redis Structures"}, "file": "diagrams/ns5_types.svg"}, {"id": "ns5_transaction", "title": {"en": "MULTI, EXEC and DISCARD"}, "file": "diagrams/ns5_transaction.s const head = (title, menu=true) => `<div class="sh"><span>${title}</span>${menu?`<button class="more" data-more>${dots}</button><div class="menu"><button data-act="expand">${L('expand')}</button><button data-act="collapse">${L('collapse')}</button></div>`:''}</div>`;
const dgInline = id => `<div class="dg" data-dg="${id}">${SVG[id]}</div><div class="dgc">📐 ${t(U.diagrams.find(d=>d.id===id).title)} · ${L('tapzoom')}</div>`;

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const KW = new Set('auto break case const continue default do else enum extern for goto if register return signed sizeof static struct switch typedef union unsigned volatile while'.split(' '));
const TY = new Set('int char float double void long short FILE size_t'.split(' '));
const PKW = new Set('False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield'.split(' '));
const PTY = new Set('int float str bool list tuple set dict complex frozenset bytes bytearray range object'.split(' '));
function hlPy(src){
  const re = /(#[^\n]*)|((?:\b[rRbBfFuU]{1,2})?(?:'{3}[\s\S]*?'{3}|"{3}[\s\S]*?"{3}|'(?:\\.|[^'\\\n])*'|"(?:\\.|[^"\\\n])*"))|(^>>>|^\.\.\.(?= ))|([A-Za-z_]\w*)(?=\s*\()|([A-Za-z_]\w*)|(\b(?:0[xXoObB][0-9a-fA-F_]+|\d[\d_]*(?:\.\d+)?(?:[eE][-+]?\d+)?j?)\b)/gm;
  let o='', last=0, m;
  while ((m = re.exec(src))){
    o += esc(src.slice(last, m.index)); last = re.lastIndex;
    const w = esc(m[0]);
    if (m[1]) o += `<span class="cm">${w}</span>`;
    else if (m[2]) o += `<span class="st">${w}</span>`;
    else if (m[3]) o += `<span class="pp">${w}</span>`;
    else if (m[4]) o += PKW.has(m[4]) ? `<span class="kw">${w}</span>` : PTY.has(m[4]) ? `<span class="ty">${w}</span>` : `<span class="fn">${w}</span>`;
    else if (m[5]) o += PKW.has(m[5]) ? `<span class="kw">${w}</span>` : PTY.has(m[5]) ? `<span class="ty">${w}</span>` : w;
    else o += `<span class="nu">${w}</span>`;
  }
  return o + esc(src.slice(last));
}
function hl(src){
  if (META.code_lang === 'python') return hlPy(src);
  if (META.code_lang === 'nosql') return esc(src);
  const re = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(^[ \t]*#[^\n]*)|([A-Za-z_]\w*)(?=\s*\()|([A-Za-z_]\w*)|(\b\d+(?:\.\d+)?[fFlLuU]*\b)/gm;
  let o='', last=0, m;
  while ((m = re.exec(src))){
    o += esc(src.slice(last, m.index)); last = re.lastIndex;
    const w = esc(m[0]);
    if (m[1]) o += `<span class="cm">${w}</span>`;
    else if (m[2]) o += `<span class="st">${w}</span>`;
    else if (m[3]) o += `<span class="pp">${w}</span>`;
    else if (m[4]) o += KW.has(m[4]) ? `<span class="kw">${w}</span>` : TY.has(m[4]) ? `<span class="ty">${w}</span>` : `<span class="fn">${w}</span>`;
    else if (m[5]) o += KW.has(m[5]) ? `<span class="kw">${w}</span>` : TY.has(m[5]) ? `<span class="ty">${w}</span>` : w;
    else o += `<span class="nu">${w}</span>`;
  }
  return o + esc(src.slice(last));
}
const progBody = p => `<div class="pl">${L('code')}</div><pre class="code">${hl(t(p.code))}</pre><div class="pl">${L('output')}</div><pre class="out">${esc(p.out)}</pre>${p.plot?`<div class="pl">${L('plot')}</div>`+dgInline(p.plot).replace('class="dg"','class="dg pg"'):''}${p.expl?`<div class="pl">${L('expl')}</div>${fixTables(t(p.expl))}`:''}`;
const pBox = id => { const p=(U.programs||[]).find(x=>x.id===id); if(!p) return ''; return `<div class="pbox"><div class="et">${L('prog')}: ${t(p.title)}</div>${progBody(p)}</div>`; };
const exBox = id => { const n=(U.numericals||[]).find(x=>x.id===id); if(!n) return ''; return `<div class="ex"><div class="et">${L('ex')}</div><div class="eq2">${t(n.q)}</div>${fixTables(t(n.a))}</div>`; };
function notes(){
  let h = `<div class="intro"><b>${t(U.title)}</b><div>${L('unit')} ${U.unit} · ${U.weightage}% ${L('intro')} · ${U.hours} ${L('hours')}</div><div>${U.intro_text ? t(U.intro_text) : L(U.programs?(META.code_lang==='python'?'intropy':'introc'):'introd')}</div></div>`;
  U.notes.forEach((sec,si)=>{
    h += `<div class="sec">${head(t(sec.title))}`;
    sec.items.forEach((it,i)=>{
      const open = si===0&&i===0 ? ' open' : '';
      if (it.h) {
        h += `<div class="card${it.key?' key':''}${open}"><div class="q hd"><span class="t">${it.key?'⭐ ':''}${t(it.h)}</span>${chev}</div>
        <div class="a rn" style="padding-left:18px">${fixTables(t(it.body)).replace(/margin:0 0 10px -36px/g,'')}${it.diagram?dgInline(it.diagram):''}${(it.examples||[]).map(exBox).join('')}${(it.programs||[]).map(pBox).join('')}</div></div>`;
      } else {
        h += `<div class="card${open}"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(it.q)}</span>${chev}</div>
        <div class="a">${fixTables(t(it.a))}${it.diagram?dgInline(it.diagram):''}</div></div>`;
      }
    });
    h += `</div>`;
  });
  return h;
}
function numericals(){
  return `<div class="sec">${head(L('numericals'))}` + (U.numericals||[]).map((n,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(n.q)}</span>${chev}</div><div class="a">${fixTables(t(n.a))}</div></div>`).join('') + `</div>`;
}
function diagrams(){
  return `<div class="sec">${head(L((U.tabs ? U.tabs.includes('flowcharts')&&!U.tabs.includes('diagrams') : U.programs&&META.code_lang!=='python')?'flowcharts':'diagrams'),false)}<div style="height:10px"></div>` + U.diagrams.map((d,i)=>
    `<div class="dcard" data-dg="${d.id}"><div class="h">${i+1}. ${t(d.title)}</div>${SVG[d.id]}</div>`).join('') + `</div>`;
}
function equations(){
  return U.equations.map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><span class="fbox">${e.f}</span></span>${chev}</div>
     <div class="a"><p>${t(e.terms)}</p></div></div>`).join('') + `</div>`).join('');
}
function viva(){
  return U.viva.map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((v,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(v.q)}</span>${chev}</div><div class="a"><p>${t(v.a)}</p></div></div>`).join('') + `</div>`).join('');
}
function exam(){
  return `<div class="sec">${head(L('examhead'),false)}` + U.exam_questions.map((x,i)=>
    `<div class="card"><div class="q" style="cursor:default"><span class="n">${i+1}.</span><span class="t">${t(x.q)}</span><span class="mk">${x.marks} ${L('marks')}</span></div></div>`).join('') + `</div>`;
}
function programs(){
  return `<div class="sec">${head(L('programs'))}` + (U.programs||[]).map((p,i)=>
    `<div class="card"><div class="q hd"><span class="n">${i+1}.</span><span class="t">${t(p.title)}</span>${chev}</div><div class="a pa">${progBody(p)}</div></div>`).join('') + `</div>`;
}
function syntax(key){
  return (U[typeof key==='string'?key:'syntax']||[]).map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><pre class="code sx">${hl(e.f)}</pre></span>${chev}</div>
     <div class="a">${e.terms && t(e.terms) ? fixTables(t(e.terms)) : ''}</div></div>`).join('') + `</div>`).join('');
}
const flowcharts = diagrams;
const algorithms = () => syntax('algorithms');
const ALLV = {notes, programs, diagrams, flowcharts, algorithms, syntax, equations, numericals, viva, exam};
const VIEWS = U.tabs ? Object.fromEntries(U.tabs.map(k=>[k, ALLV[k]])) : U.programs ? (META.code_lang==='python' ? {notes, programs, diagrams, syntax, viva, exam} : {notes, programs, flowcharts, syntax, viva, exam}) : U.numericals ? {notes, diagrams, equations, numericals, viva, exam} : {notes, diagrams, equations, viva, exam};
function render(){
  document.getElementById('title').textContent = `${L('unit')} ${U.unit}: ${t(U.title)}`;
  document.getElementById('sub').textContent = `${t(META.name)} · ${META.code}`;
  document.getElementById('lang').textContent = S.lang==='en' ? 'ગુ' : 'EN';
  document.getElementById('lang').style.display = META.languages.includes('gu') ? '' : 'none';
  document.getElementById('tabs').innerHTML = Object.keys(VIEWS).map(k=>`<button class="tab${S.tab===k?' on':''}" data-tab="${k}">${L(k)}</button>`).join('');
  document.getElementById('view').innerHTML = VIEWS[S.tab]();
  document.querySelectorAll('#view pre.c').forEach(e=>{ e.innerHTML = hl(e.textContent); e.className='code'; });
}
let zoom = 1;
function setZoom(z){ zoom = Math.min(4, Math.max(1, z)); const w=document.getElementById('zw'); w.style.width=(zoom*100)+'%'; document.getElementById('zr').textContent=Math.round(zoom*100)+'%'; }
document.addEventListener('click', e=>{
  const q = e.target.closest('.q'); if (q && q.parentElement.querySelector('.a')) { q.parentElement.classList.toggle('open'); return; }
  const tb = e.target.closest('[data-tab]'); if (tb){ S.tab = tb.dataset.tab; render(); window.scrollTo(0,0); return; }
  if (e.target.closest('#lang')){ S.lang = S.lang==='en'?'gu':'en'; render(); return; }
  const m = e.target.closest('[data-more]');
  document.querySelectorAll('.menu.show').forEach(x=>{ if(!m || x!==m.nextElementSibling) x.classList.remove('show'); });
  if (m){ m.nextElementSibling.classList.toggle('show'); return; }
  const act = e.target.closest('[data-act]');
  if (act){ act.closest('.sec').querySelectorAll('.card').forEach(c=>{ if(c.querySelector('.a')) c.classList.toggle('open', act.dataset.act==='expand'); }); act.parentElement.classList.remove('show'); return; }
  const dg = e.target.closest('[data-dg]');
  if (dg){ const id=dg.dataset.dg; document.getElementById('mt').textContent=t(U.diagrams.find(d=>d.id===id).title); document.getElementById('zw').innerHTML=SVG[id]; setZoom(1); document.getElementById('modal').classList.add('show'); return; }
  if (e.target.closest('#mx')) document.getElementById('modal').classList.remove('show');
  if (e.target.closest('#zi')) setZoom(zoom+0.5);
  if (e.target.closest('#zo')) setZoom(zoom-0.5);
  if (e.target.closest('#zr')) setZoom(1);
});
render();
</script></body></html>
