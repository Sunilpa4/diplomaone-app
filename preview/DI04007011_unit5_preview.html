id'] ?>\">\n    <button>Delete contact</button>\n  </form>\n</article>\n<?php endforeach; ?>"}, "out": "# 1. Open the empty MVC contact form\n$ curl -b cookies.txt -c cookies.txt 'http://localhost/index.php'\n<!doctype html><meta charset=\"utf-8\"><title>MVC Contacts</title><style>body{font:16px system-ui;max-width:840px;margin:24px auto;padding:12px}article{border:1px solid #ccc;padding:12px;margin:12px 0}form{margin:10px 0}input,textarea,button,select{font:inherit;margin:4px}textarea{display:block;width:95%}</style><h1>MVC Contacts</h1><p></p>\n<form method=\"get\">\n  <input name=\"q\" placeholder=\"Search name/email\" value=\"\">\n  <button>Search</button>\n</form>\n<form method=\"post\">\n  <input type=\"hidden\" name=\"csrf\" value=\"90d992d241b82cf295a8c4c35d544f5e\">  <input type=\"hidden\" name=\"action\" value=\"save\">\n  <input type=\"hidden\" name=\"id\" value=\"0\">\n  <input name=\"name\" maxlength=\"80\" required value=\"\">\n  <input name=\"email\" type=\"email\" required value=\"\">\n  <button>Save contact</button>\n</form>\n<p>Contacts: 0</p>\n\n# 2. Add an apostrophe-containing name\n$ curl -L -b cookies.txt -c cookies.txt -d 'action=save&id=0&name=O%27Neil&email=oneil%40example.test&csrf=90d992d241b82cf295a8c4c35d544f5e' 'http://localhost/index.php'\n<!doctype html><meta charset=\"utf-8\"><title>MVC Contacts</title><style>body{font:16px system-ui;max-width:840px;margin:24px auto;padding:12px}article{border:1px solid #ccc;padding:12px;margin:12px 0}form{margin:10px 0}input,textarea,button,select{font:inherit;margin:4px}textarea{display:block;width:95%}</style><h1>MVC Contacts</h1><p role=\"status\">Contact added.</p><p></p>\n<form method=\"get\">\n  <input name=\"q\" placeholder=\"Search name/email\" value=\"\">\n  <button>Search</button>\n</form>\n<form method=\"post\">\n  <input type=\"hidden\" name=\"csrf\" value=\"90d992d241b82cf295a8c4c35d544f5e\">  <input type=\"hidden\" name=\"action\" value=\"save\">\n  <input type=\"hidden\" name=\"id\" \n# 4. Injection-shaped search remains literal data\n$ curl -b cookies.txt -c cookies.txt 'http://localhost/index.php?q=%27+OR+%271%27%3D%271'\n<!doctype html><meta charset=\"utf-8\"><title>MVC Contacts</title><style>body{font:16px system-ui;max-width:840px;margin:24px auto;padding:12px}article{border:1px solid #ccc;padding:12px;margin:12px 0}form{margin:10px 0}input,textarea,button,select{font:inherit;margin:4px}textarea{display:block;width:95%}</style><h1>MVC Contacts</h1><p></p>\n<form method=\"get\">\n  <input name=\"q\" placeholder=\"Search name/email\" value=\"&#039; OR &#039;1&#039;=&#039;1\">\n  <button>Search</button>\n</form>\n<form method=\"post\">\n  <input type=\"hidden\" name=\"csrf\" value=\"90d992d241b82cf295a8c4c35d544f5e\">  <input type=\"hidden\" name=\"action\" value=\"save\">\n  <input type=\"hidden\" name=\"id\" value=\"0\">\n  <input name=\"name\" maxlength=\"80\" required value=\"\">\n  <input name=\"email\" type=\"email\" required value=\"\">\n  <button>Save contact</button>\n</form>\n<p>Contacts: 0</p>\n\n# 5. Edit the contact\n$ curl -L -b cookies.txt -c cookies.txt -d 'action=save&id=1&name=O%27Neil+Shah&email=oneil.shah%40example.test&csrf=90d992d241b82cf295a8c4c35d544f5e' 'http://localhost/index.php'\n<!doctype html><meta charset=\"utf-8\"><title>MVC Contacts</title><style>body{font:16px system-ui;max-width:840px;margin:24px auto;padding:12px}article{border:1px solid #ccc;padding:12px;margin:12px 0}form{margin:10px 0}input,textarea,button,select{font:inherit;margin:4px}textarea{display:block;width:95%}</style><h1>MVC Contacts</h1><p role=\"status\">Contact updated.</p><p></p>\n<form method=\"get\">\n  <input name=\"q\" placeholder=\"Search name/email\" value=\"\">\n  <button>Search</button>\n</form>\n<form method=\"post\">\n  <input type=\"hidden\" name=\"csrf\" value=\"90d992d241b82cf295a8c4c35d544f5e\">  <input type=\"hidden\" name=\"action\" value=\"save\">\n  <input type=\"hidden\" name=\"id\" value=\"0\">\n  <input name=\"name\" maxlength=\"80\" required value=\"\">\n  <input name=\"email\" type=\"email\" required value=\"\">\n  <button>Save contact</button>\n</form>\n<p>Contacts: 1</p>\n<article data-id=\"1\">\n  <b>O&#039;Neil Shah</b>\n  <span>oneil.shah@example.test</span>\n  <a href=\"?edit=1\">Edit</a>\n  <form method=\"post\">\n    <input type=\"hidden\" name=\"csrf\" value=\"90d992d241b82cf295a8c4c35d544f5e\">    <input type=\"hidden\" name=\"action\" value=\"delete\">\n    <input type=\"hidden\" name=\"id\" value=\"1\">\n    <button>Delete contact</button>\n  </form>\n</article>\n\n# 6. Delete one contact with a primary-key predicate\n$ curl -L -b cookies.txt -c cookies.txt -d 'action=delete&id=1&csrf=90d992d241b82cf295a8c4c35d544f5e' 'http://localhost/index.php'\n<!doctype html><meta charset=\"utf-8\"><title>MVC Contacts</title><style>body{font:16px system-ui;max-width:840px;margin:24px auto;padding:12px}article{border:1px solid #ccc;padding:12px;margin:12px 0}form{margin:10px 0}input,textarea,button,select{font:inherit;margin:4px}textarea{display:block;width:95%}</style><h1>MVC Contacts</h1><p role=\"status\">Contact deleted.</p><p></p>\n<form method=\"get\">\n  <input name=\"q\" placeholder=\"Search name/email\" value=\"\">\n  <button>Search</button>\n</form>\n<form method=\"post\">\n  <input type=\"hidden\" name=\"csrf\" value=\"90d992d241b82cf295a8c4c35d544f5e\">  <input type=\"hidden\" name=\"action\" value=\"save\">\n  <input type=\"hidden\" name=\"id\" value=\"0\">\n  <input name=\"name\" maxlength=\"80\" required value=\"\">\n  <input name=\"email\" type=\"email\" required value=\"\">\n  <button>Save contact</button>\n</form>\n<p>Contacts: 0</p>", "expl": {"en": "<p>A genuine small MVC app: index.php dispatches; ContactController handles HTTP/validation/redirects; Contact owns all database operations; views/contacts.php renders escaped data. Dependencies are supplied through constructors. Search, insert, update and delete all bind values. The transcript searches for O'Neil successfully and an injection-shaped value returns zero rows. Like the blog, this local admin lab needs a login/authorisation guard before public deployment.</p><p><b>One-time schema/seed setup:</b> select the lesson database in phpMyAdmin and run this SQL before opening the PHP page.</p><pre class=\"c\">CREATE TABLE contacts (\n  id INT PRIMARY KEY AUTO_INCREMENT,\n  name VARCHAR(80) NOT NULL,\n  email VARCHAR(120) NOT NULL\n) ENGINE=InnoDB;</pre><p>Save each labelled PHP section as a separate file. db.php reads DB_HOST, DB_USER, DB_PASS and DB_NAME from the environment; its classroom defaults require the lab account described in the notes. DB_SOCKET is optional and used only by the isolated test harness. The output is actual HTTP/HTML source from PHP 8.4 with a real MariaDB server through MySQLi; the browser renders the forms. These temporary test databases are deleted afterwards.</p>"}}, {"id": "wd5p10", "title": {"en": "AI-assisted To-Do reference: add/edit/toggle/filter/delete (Practical 22)"}, "code": {"en": "<?php\n// ===== File: index.php =====\nrequire __DIR__ . \"/web.php\";\n$edit = [\"id\" => 0, \"title\" => \"\"];\n$error = \"\";\nif ($_SERVER[\"REQUEST_METHOD\"] === \"POST\") {\n    check_csrf();\n    $action = text($_POST, \"action\");\n    if ($action === \"toggle\" || $action === \"delete\") {\n        $id = positiveId($_POST[\"id\"] ?? null);\n        $sql = $action === \"toggle\"\n             ? \"UPDATE todos SET done=1-done WHERE id=?\"\n             : \"DELETE FROM todos WHERE id=?\";\n        $s = $db->prepare($sql);\n        $s->bind_param(\"i\", $id);\n        $s->execute();\n        if ($s->affected_rows !== 1) {\n            fail(\"Task not found.\", 404);\n        }\n        redirect($action === \"toggle\" ? \"Status changed.\" : \"Task deleted.\");\n    }\n    if ($action !== \"save\") {\n        fail(\"Unknown action.\");\n    }\n    $id = recordId($_POST[\"id\"] ?? 0);\n    $title = text($_POST, \"title\");\n    $edit = [\"id\" => $id, \"title\" => $title];\n    if ($id > 0) {\n        $s = $db->prepare(\"SELECT id FROM todos WHERE id=?\");\n        $s->bind_param(\"i\", $id);\n        $s->execute();\n        if (!$s->get_result()->fetch_assoc()) {\n            fail(\"Task not found.\", 404);\n        }\n    }\n    if ($title === \"\" || strlen($title) > 150) {\n        http_response_code(422);\n        $error = \"Title must contain 1-150 characters.\";\n    } else {\n        if ($id === 0) {\n            $s = $db->prepare(\"INSERT INTO todos(title) VALUES (?)\");\n            $s->bind_param(\"s\", $title);\n        } else {\n            $s = $db->prepare(\"UPDATE todos SET title=? WHERE id=?\");\n            $s->bind_param(\"si\", $title, $id);\n        }\n        $s->execute();\n        redirect($id === 0 ? \"Task added.\" : \"Task updated.\");\n    }\n} elseif (isset($_GET[\"edit\"])) {\n    $id = positiveId($_GET[\"edit\"]);\n    $s = $db->prepare(\"SELECT id,title FROM todos WHERE id=?\");\n    $s->bind_param(\"i\", $id);\n    $s->execute();\n    $edit = $s->get_result()->fetch_assoc();\n    if (!$edit) {\n        fail(\"Task not found.\", 404);\n    }\n}\n$filter = text($_GET, \"filter\") ?: \"all\";\n// Only trusted SQL fragments; never concatenate a submitted clause.\n$conditions = [\n    \"all\" => \"\", \"pending\" => \" WHERE done=0\",\n    \"done\" => \" WHERE done=1\"\n];\nif (!array_key_exists($filter, $conditions)) {\n    fail(\"Unknown filter.\");\n}\n$sql = \"SELECT * FROM todos\" . $conditions[$filter] . \" ORDER BY id\";\n$rows = $db->query($sql)->fetch_all(MYSQLI_ASSOC);\npage(\"Study To-Do List\");\n?>\n<p><?= e($error) ?></p>\n<a href=\"?filter=all\">All</a>\n<a href=\"?filter=pending\">Pending</a>\n<a href=\"?filter=done\">Done</a>\n<form method=\"post\">\n  <?= csrf_field() ?>\n  <input type=\"hidden\" name=\"action\" value=\"save\">\n  <input type=\"hidden\" name=\"id\" value=\"<?= (int)$edit['id'] ?>\">\n  <input name=\"title\" maxlength=\"150\" required value=\"<?= e($edit['title']) ?>\">\n  <button>Save task</button>\n</form>\n<p>Tasks: <?= count($rows) ?></p>\n<?php foreach ($rows as $task): ?>\n<article data-id=\"<?= (int)$task['id'] ?>\">\n  <span><?= e($task['title']) ?></span>\n  <b><?= $task['done'] ? \"Done\" : \"Pending\" ?></b>\n  <a href=\"?edit=<?= (int)$task['id'] ?>\">Edit</a>\n  <form method=\"post\">\n    <?= csrf_field() ?>\n    <input type=\"hidden\" name=\"id\" value=\"<?= (int)$task['id'] ?>\">\n    <button name=\"action\" value=\"toggle\">Toggle done</button>\n    <button name=\"action\" value=\"delete\">Delete task</button>\n  </form>\n</article>\n<?php endforeach; ?>\n\n<?php\n// ===== File: db.php =====\nmysqli_report(MYSQLI_REPORT_ERROR | MYSQLI_REPORT_STRICT);\n$host = getenv(\"DB_HOST\") ?: \"localhost\";\n$user = getenv(\"DB_USER\") ?: \"busbook_app\";\n$pass = getenv(\"DB_PASS\");\nif ($pass === false) {\n    $pass = \"change-this-lab-password\";\n}\n$name = getenv(\"DB_NAME\") ?: \"busbook\";\n$socket = getenv(\"DB_SOCKET\") ?: null;\ntry {\n    $db = new mysqli($host, $user, $pass, $name, 3306, $socket);\n    $db->set_charset(\"utf8mb4\");\n} catch (mysqli_sql_exception $e) {\n    error_log($e->getMessage());\n    http_response_code(500);\n    exit(\"Database unavailable. Check server configuration.\");\n}\n\n<?php\n// ===== File: web.php =====\nrequire_once __DIR__ . \"/db.php\";\nset_exception_handler(function (Throwable $e): void {\n    error_log($e->getMessage());\n    http_response_code(500);\n    echo \"Operation failed. Check the server log.\";\n});\nini_set(\"session.use_strict_mode\", \"1\");\nini_set(\"session.use_only_cookies\", \"1\");\n$https = !empty($_SERVER[\"HTTPS\"])\n         && $_SERVER[\"HTTPS\"] !== \"off\";\nsession_set_cookie_params([\n    \"path\" => \"/\", \"secure\" => $https,\n    \"httponly\" => true, \"samesite\" => \"Lax\"\n]);\nsession_start();\n$_SESSION[\"csrf\"] ??= bin2hex(random_bytes(16));\nfunction e(string $s): string {\n    return htmlspecialchars($s, ENT_QUOTES | ENT_SUBSTITUTE, \"UTF-8\");\n}\nfunction text(array $source, string $key): string {\n    $v = $source[$key] ?? \"\";\n    return is_string($v) ? trim($v) : \"\";\n}\nfunction fail(string $message, int $status = 400): void {\n    http_response_code($status);\n    exit(e($message));\n}\nfunction recordId($raw): int {\n    $id = filter_var($raw, FILTER_VALIDATE_INT, [\n        \"options\" => [\"min_range\" => 0]\n    ]);\n    if ($id === false) {\n        fail(\"Invalid record ID.\");\n    }\n    return $id;\n}\nfunction positiveId($raw): int {\n    $id = recordId($raw);\n    if ($id < 1) {\n        fail(\"Invalid record ID.\");\n    }\n    return $id;\n}\nfunction csrf_field(): string {\n    return '<input type=\"hidden\" name=\"csrf\" value=\"'\n           . e($_SESSION[\"csrf\"]) . '\">';\n}\nfunction check_csrf(): void {\n    $token = $_POST[\"csrf\"] ?? null;\n    if (!is_string($token)\n        || !hash_equals($_SESSION[\"csrf\"], $token)) {\n        fail(\"Invalid CSRF token.\", 403);\n    }\n}\nfunction redirect(string $message = \"\"): void {\n    $_SESSION[\"flash\"] = $message;\n    header(\"Location: index.php\", true, 303);\n    exit;\n}\nfunction page(string $title): void {\n    echo '<!doctype html><meta charset=\"utf-8\">';\n    echo '<title>', e($title), '</title>';\n    echo '<style>body{font:16px system-ui;max-width:840px;';\n    echo 'margin:24px auto;padding:12px}article{border:1px solid #ccc;';\n    echo 'padding:12px;margin:12px 0}form{margin:10px 0}';\n    echo 'input,textarea,button,select{font:inherit;margin:4px}';\n    echo 'textarea{display:block;width:95%}</style>';\n    echo '<h1>', e($title), '</h1>';\n    $flash = $_SESSION[\"flash\"] ?? \"\";\n    unset($_SESSION[\"flash\"]);\n    if ($flash !== \"\") {\n        echo '<p role=\"status\">', e($flash), '</p>';\n    }\n}\nif (!in_array($_SERVER[\"REQUEST_METHOD\"], [\"GET\", \"POST\"], true)) {\n    header(\"Allow: GET, POST\");\n    fail(\"Method not allowed.\", 405);\n}"}, "out": "# \n  <form method=\"post\">\n    <input type=\"hidden\" name=\"csrf\" value=\"58120d69b1d65f48cf25cc2b1726be2f\">    <input type=\"hidden\" name=\"id\" value=\"1\">\n    <button name=\"action\" value=\"toggle\">Toggle done</button>\n    <button name=\"action\" value=\"delete\">Delete task</button>\n  </form>\n</article>\n\n# 3. Mark it done\n$ curl -L -b cookies.txt -c cookies.txt -d 'action=toggle&id=1&csrf=58120d69b1d65f48cf25cc2b1726be2f' 'http://localhost/index.php'\n<!doctype html><meta charset=\"utf-8\"><title>Study To-Do List</title><style>body{font:16px system-ui;max-width:840px;margin:24px auto;padding:12px}article{border:1px solid #ccc;padding:12px;margin:12px 0}form{margin:10px 0}input,textarea,button,select{font:inherit;margin:4px}textarea{display:block;width:95%}</style><h1>Study To-Do List</h1><p role=\"status\">Status changed.</p><p></p>\n<a href=\"?filter=all\">All</a>\n<a href=\"?filter=pending\">Pending</a>\n<a href=\"?filter=done\">Done</a>\n<form method=\"post\">\n  <input type=\"hidden\" name=\"csrf\" value=\"58120d69b1d65f48cf25cc2b1726be2f\">  <input type=\"hidden\" name=\"action\" value=\"save\">\n  <input type=\"hidden\" name=\"id\" value=\"0\">\n  <input name=\"title\" maxlength=\"150\" required value=\"\">\n  <button>Save task</button>\n</form>\n<p>Tasks: 1</p>\n<article data-id=\"1\">\n  <span>Revise MySQLi</span>\n  <b>Done</b>\n  <a href=\"?edit=1\">Edit</a>\n  <form method=\"post\">\n    <input type=\"hidden\" name=\"csrf\" value=\"58120d69b1d65f48cf25cc2b1726be2f\">    <input type=\"hidden\" name=\"id\" value=\"1\">\n    <button name=\"action\" value=\"toggle\">Toggle done</button>\n    <button name=\"action\" value=\"delete\">Delete task</button>\n  </form>\n</article>\n\n# 4. Read only done tasks\n$ curl -b cookies.txt -c cookies.txt 'http://localhost/index.php?filter=done'\n<!doctype html><meta charset=\"utf-8\"><title>Study To-Do List</title><style>body{font:16px system-ui;max-width:840px;margin:24px auto;padding:12px}article{border:1px solid #ccc;padding:12px;margin:12px 0}form{margin:10px 0}input,textarea,button,select{font:inherit;margin:4px}textarea{display:block;width:95%}</style><h1>Study To-Do List</h1><p></p>\n<a href=\"?filter=all\">All</a>\n<a href=\"?filter=pending\">Pending</a>\n<a href=\"?filter=done\">Done</a>\n<form method=\"post\">\n  <input type=\"hidden\" name=\"csrf\" value=\"58120d69b1d65f48cf25cc2b1726be2f\">  <input type=\"hidden\" name=\"action\" value=\"save\">\n  <input type=\"hidden\" name=\"id\" value=\"0\">\n  <input name=\"title\" maxlength=\"150\" required value=\"\">\n  <button>Save task</button>\n</form>\n<p>Tasks: 1</p>\n<article data-id=\"1\">\n  <span>Revise MySQLi</span>\n  <b>Done</b>\n  <a href=\"?edit=1\">Edit</a>\n  <form method=\"post\">\n    <input type=\"hidden\" name=\"csrf\" value=\"58120d69b1d65f48cf25cc2b1726be2f\">    <input type=\"hidden\" name=\"id\" value=\"1\">\n    <button name=\"action\" value=\"toggle\">Toggle done</button>\n    <button name=\"action\" value=\"delete\">Delete task</button>\n  </form>\n</article>\n\n# 5. Edit the task title\n$ curl -L -b cookies.txt -c cookies.txt -d 'action=save&id=1&title=Practise+prepared+statements&csrf=58120d69b1d65f48cf25cc2b1726be2f' 'http://localhost/index.php'\n<!doctype html><meta charset=\"utf-8\"><title>Study To-Do List</title><style>body{font:16px system-ui;max-width:840px;margin:24px auto;padding:12px}article{border:1px solid #ccc;padding:12px;margin:12px 0}form{margin:10px 0}input,textarea,button,select{font:inherit;margin:4px}textarea{display:block;width:95%}</style><h1>Study To-Do List</h1><p role=\"status\">Task updated.</p><p></p>\n<a href=\"?filter=all\">All</a>\n<a href=\"?filter=pending\">Pending</a>\n<a href=\"?filter=done\">Done</a>\n<form method=\"post\">\n  <input type=\"hidden\" name=\"csrf\" value=\"58120d69b1d65f48cf25cc2b1726be2f\">  <input type=\"hidden\" name=\"action\" value=\"save\">\n  <input type=\"hidden\" name=\"id\" value=\"0\">\n  <input name=\"title\" maxlength=\"150\" required value=\"\">\n  <button>Save task</button>\n</form>\n<p>Tasks: 1</p>\n<article data-id=\"1\">\n  <span>Practise prepared statements</span>\n  <b>Done</b>\n  <a href=\"?edit=1\">Edit</a>\n  <form method=\"post\">\n    <input type=\"hidden\" name=\"csrf\" value=\"58120d69b1d65f48cf25cc2b1726be2f\">    <input type=\"hidden\" name=\"id\" value=\"1\">\n    <button name=\"action\" value=\"toggle\">Toggle done</button>\n    <button name=\"action\" value=\"delete\">Delete task</button>\n  </form>\n</article>\n\n# 6. Delete the completed task\n$ curl -L -b cookies.txt -c cookies.txt -d 'action=delete&id=1&csrf=58120d69b1d65f48cf25cc2b1726be2f' 'http://localhost/index.php'\n<!doctype html><meta charset=\"utf-8\"><title>Study To-Do List</title><style>body{font:16px system-ui;max-width:840px;margin:24px auto;padding:12px}article{border:1px solid #ccc;padding:12px;margin:12px 0}form{margin:10px 0}input,textarea,button,select{font:inherit;margin:4px}textarea{display:block;width:95%}</style><h1>Study To-Do List</h1><p role=\"status\">Task deleted.</p><p></p>\n<a href=\"?filter=all\">All</a>\n<a href=\"?filter=pending\">Pending</a>\n<a href=\"?filter=done\">Done</a>\n<form method=\"post\">\n  <input type=\"hidden\" name=\"csrf\" value=\"58120d69b1d65f48cf25cc2b1726be2f\">  <input type=\"hidden\" name=\"action\" value=\"save\">\n  <input type=\"hidden\" name=\"id\" value=\"0\">\n  <input name=\"title\" maxlength=\"150\" required value=\"\">\n  <button>Save task</button>\n</form>\n<p>Tasks: 0</p>", "expl": {"en": "<p>Complete PHP/MySQLi To-Do application generated for this lesson and executed against the real database. It is a reference for the AI-assisted practical, not a claim that a separate external AI service was used. Students should record their prompt, review and explain the returned code, make corrections, and run the test matrix in the notes. The filter maps an allowlisted key to trusted SQL, while record values are bound. Blank titles, forged CSRF, invalid IDs and arbitrary filter clauses are rejected. This is a local single-user lab; add access control before hosting it publicly.</p><p><b>One-time schema/seed setup:</b> select the lesson database in phpMyAdmin and run this SQL before opening the PHP page.</p><pre class=\"c\">CREATE TABLE todos (\n  id INT PRIMARY KEY AUTO_INCREMENT,\n  title VARCHAR(150) NOT NULL,\n  done TINYINT NOT NULL DEFAULT 0 CHECK (done IN (0,1))\n) ENGINE=InnoDB;</pre><p>Save each labelled PHP section as a separate file. db.php reads DB_HOST, DB_USER, DB_PASS and DB_NAME from the environment; its classroom defaults require the lab account described in the notes. DB_SOCKET is optional and used only by the isolated test harness. The output is actual HTTP/HTML source from PHP 8.4 with a real MariaDB server through MySQLi; the browser renders the forms. These temporary test databases are deleted afterwards.</p>"}}, {"id": "wd5p11", "title": {"en": "Authenticated Inventory CRUD and stock checks (Practical 23)"}, "code": {"en": "<?php\n// ===== File: index.php =====\nrequire __DIR__ . \"/auth.php\";\nfunction product(mysqli $db, int $id): ?array {\n    $s = $db->prepare(\"SELECT * FROM products WHERE id=?\");\n    $s->bind_param(\"i\", $id);\n    $s->execute();\n    return $s->get_result()->fetch_assoc();\n}\n$error = \"\";\n$edit = [\"id\" => 0, \"sku\" => \"\", \"name\" => \"\", \"qty\" => \"0\", \"price\" => \"0.00\"];\nif ($_SERVER[\"REQUEST_METHOD\"] === \"POST\") {\n    check_csrf();\n    $action = text($_POST, \"action\");\n    if (in_array($action, [\"delete\", \"sell\", \"restock\"], true)) {\n        $id = positiveId($_POST[\"id\"] ?? null);\n        if (!product($db, $id)) {\n            fail(\"Product not found.\", 404);\n        }\n        if ($action === \"delete\") {\n            $s = $db->prepare(\"DELETE FROM products WHERE id=?\");\n            $s->bind_param(\"i\", $id);\n            $s->execute();\n            redirect(\"Product deleted.\");\n        }\n        $amount = filter_var($_POST[\"amount\"] ?? null, FILTER_VALIDATE_INT, [\n            \"options\" => [\"min_range\" => 1, \"max_range\" => 1000000]\n        ]);\n        if ($amount === false) {\n            fail(\"Amount must be a positive integer.\", 422);\n        }\n        $sql = $action === \"sell\"\n             ? \"UPDATE products SET qty=qty-? WHERE id=? AND qty>=?\"\n             : \"UPDATE products SET qty=qty+? WHERE id=? AND qty<=1000000-?\";\n        $s = $db->prepare($sql);\n        $s->bind_param(\"iii\", $amount, $id, $amount);\n        $s->execute();\n        if ($s->affected_rows !== 1) {\n            fail(\"Stock change rejected; quantity unchanged.\", 409);\n        }\n        redirect(\"Stock changed.\");\n    }\n    if ($action !== \"save\") {\n        fail(\"Unknown action.\");\n    }\n    $id = recordId($_POST[\"id\"] ?? 0);\n    $sku = text($_POST, \"sku\");\n    $name = text($_POST, \"name\");\n    $qtyText = text($_POST, \"qty\");\n    $price = text($_POST, \"price\");\n    $qty = filter_var($qtyText, FILTER_VALIDATE_INT, [\n        \"options\" => [\"min_range\" => 0, \"max_range\" => 1000000]\n    ]);\n    $edit = [\"id\" => $id, \"sku\" => $sku, \"name\" => $name,\n             \"qty\" => $qtyText, \"price\" => $price];\n    if ($id > 0 && !product($db, $id)) {\n        fail(\"Product not found.\", 404);\n    }\n    if (!preg_match('/^[A-Za-z0-9_-]{1,30}$/', $sku)\n        || $name === \"\" || strlen($name) > 80 || $qty === false\n        || !preg_match('/^\\d{1,7}(?:\\.\\d{1,2})?$/', $price)) {\n        $error = \"Use a valid SKU/name, non-negative integer qty and price (max 2 decimals).\";\n    } else {\n        try {\n            if ($id === 0) {\n                $s = $db->prepare(\n                    \"INSERT INTO products(sku,name,qty,price) VALUES (?,?,?,?)\"\n                );\n                $s->bind_param(\"ssis\", $sku, $name, $qty, $price);\n            } else {\n                $s = $db->prepare(\n                    \"UPDATE products SET sku=?,name=?,qty=?,price=? WHERE id=?\"\n                );\n                $s->bind_param(\"ssisi\", $sku, $name, $qty, $price, $id);\n            }\n            $s->execute();\n            redirect($id === 0 ? \"Product added.\" : \"Product updated.\");\n        } catch (mysqli_sql_exception $e) {\n            if ($e->getCode() !== 1062) {\n                throw $e;\n            }\n            $error = \"SKU already exists.\";\n        }\n    }\n    http_response_code(422);\n} elseif (isset($_GET[\"edit\"])) {\n    $edit = product($db, positiveId($_GET[\"edit\"]));\n    if (!$edit) {\n        fail(\"Product not found.\", 404);\n    }\n}\n$rows = $db->query(\"SELECT * FROM products ORDER BY id\")->fetch_all(MYSQLI_ASSOC);\npage(\"Inventory Manager\");\n?>\n<form method=\"post\">\n  <?= csrf_field() ?>\n  <button name=\"action\" value=\"logout\">Log out</button>\n</form>\n<p><?= e($error) ?></p>\n<form method=\"post\">\n  <?= csrf_field() ?>\n  <input type=\"hidden\" name=\"action\" value=\"save\">\n  <input type=\"hidden\" name=\"id\" value=\"<?= (int)$edit['id'] ?>\">\n  SKU: <input name=\"sku\" required value=\"<?= e($edit['sku']) ?>\"><br>\n  Name: <input name=\"name\" required value=\"<?= e($edit['name']) ?>\"><br>\n  Quantity: <input name=\"qty\" type=\"number\" min=\"0\" required value=\"<?= e((string)$edit['qty']) ?>\"><br>\n  Price: <input name=\"price\" type=\"number\" step=\"0.01\" min=\"0\" required value=\"<?= e((string)$edit['price']) ?>\"><br>\n  <button>Save product</button>\n</form>\n<p>Products: <?= count($rows) ?></p>\n<?php foreach ($rows as $p): ?>\n<article data-id=\"<?= (int)$p['id'] ?>\">\n  <b><?= e($p['sku']) ?>: <?= e($p['name']) ?></b>\n  <p>Qty: <?= (int)$p['qty'] ?> | Price: Rs <?= e($p['price']) ?></p>\n  <?php if ($p['qty'] <= 3): ?><strong>Low stock</strong><?php endif; ?>\n  <a href=\"?edit=<?= (int)$p['id'] ?>\">Edit</a>\n  <form method=\"post\">\n    <?= csrf_field() ?>\n    <input type=\"hidden\" name=\"id\" value=\"<?= (int)$p['id'] ?>\">\n    <input name=\"amount\" type=\"number\" min=\"1\" value=\"1\">\n    <button name=\"action\" value=\"sell\">Sell</button>\n    <button name=\"action\" value=\"restock\">Restock</button>\n    <button name=\"action\" value=\"delete\">Delete</button>\n  </form>\n</article>\n<?php endforeach; ?>\n\n<?php\n// ===== File: db.php =====\nmysqli_report(MYSQLI_REPORT_ERROR | MYSQLI_REPORT_STRICT);\n$host = getenv(\"DB_HOST\") ?: \"localhost\";\n$user = getenv(\"DB_USER\") ?: \"busbook_app\";\n$pass = getenv(\"DB_PASS\");\nif ($pass === false) {\n    $pass = \"change-this-lab-password\";\n}\n$name = getenv(\"DB_NAME\") ?: \"busbook\";\n$socket = getenv(\"DB_SOCKET\") ?: null;\ntry {\n    $db = new mysqli($host, $user, $pass, $name, 3306, $socket);\n    $db->set_charset(\"utf8mb4\");\n} catch (mysqli_sql_exception $e) {\n    error_log($e->getMessage());\n    http_response_code(500);\n    exit(\"Database unavailable. Check server configuration.\");\n}\n\n<?php\n// ===== File: web.php =====\nrequire_once __DIR__ . \"/db.php\";\nset_exception_handler(function (Throwable $e): void {\n    error_log($e->getMessage());\n    http_response_code(500);\n    echo \"Operation failed. Check the server log.\";\n});\nini_set(\"session.use_strict_mode\", \"1\");\nini_set(\"session.use_only_cookies\", \"1\");\n$https = !empty($_SERVER[\"HTTPS\"])\n         && $_SERVER[\"HTTPS\"] !== \"off\";\nsession_set_cookie_params([\n    \"path\" => \"/\", \"secure\" => $https,\n    \"httponly\" => true, \"samesite\" => \"Lax\"\n]);\nsession_start();\n$_SESSION[\"csrf\"] ??= bin2hex(random_bytes(16));\nfunction e(string $s): string {\n    return htmlspecialchars($s, ENT_QUOTES | ENT_SUBSTITUTE, \"UTF-8\");\n}\nfunction text(array $source, string $key): string {\n    $v = $source[$key] ?? \"\";\n    return is_string($v) ? trim($v) : \"\";\n}\nfunction fail(string $message, int $status = 400): void {\n    http_response_code($status);\n    exit(e($message));\n}\nfunction recordId($raw): int {\n    $id = filter_var($raw, FILTER_VALIDATE_INT, [\n        \"options\" => [\"min_range\" => 0]\n    ]);\n    if ($id === false) {\n        fail(\"Invalid record ID.\");\n    }\n    return $id;\n}\nfunction positiveId($raw): int {\n    $id = recordId($raw);\n    if ($id < 1) {\n        fail(\"Invalid record ID.\");\n    }\n    return $id;\n}\nfunction csrf_field(): string {\n    return '<input type=\"hidden\" name=\"csrf\" value=\"'\n           . e($_SESSION[\"csrf\"]) . '\">';\n}\nfunction check_csrf(): void {\n    $token = $_POST[\"csrf\"] ?? null;\n    if (!is_string($token)\n        || !hash_equals($_SESSION[\"csrf\"], $token)) {\n        fail(\"Invalid CSRF token.\", 403);\n    }\n}\nfunction redirect(string $message = \"\"): void {\n    $_SESSION[\"flash\"] = $message;\n    header(\"Location: index.php\", true, 303);\n    exit;\n}\nfunction page(string $title): void {\n    echo '<!doctype html><meta charset=\"utf-8\">';\n    echo '<title>', e($title), '</title>';\n    echo '<style>body{font:16px system-ui;max-width:840px;';\n    echo 'margin:24px auto;padding:12px}article{border:1px solid #ccc;';\n    echo 'padding:12px;margin:12px 0}form{margin:10px 0}';\n    echo 'input,textarea,button,select{font:inherit;margin:4px}';\n    echo 'textarea{display:block;width:95%}</style>';\n    echo '<h1>', e($title), '</h1>';\n    $flash = $_SESSION[\"flash\"] ?? \"\";\n    unset($_SESSION[\"flash\"]);\n    if ($flash !== \"\") {\n        echo '<p role=\"status\">', e($flash), '</p>';\n    }\n}\nif (!in_array($_SERVER[\"REQUEST_METHOD\"], [\"GET\", \"POST\"], true)) {\n    header(\"Allow: GET, POST\");\n    fail(\"Method not allowed.\", 405);\n}\n\n<?php\n// ===== File: auth.php =====\nrequire_once __DIR__ . \"/web.php\";\n$adminHash = getenv(\"ADMIN_HASH\") ?: \"\";\nif ($adminHash === \"\") {\n    fail(\"Configure ADMIN_HASH before using inventory.\", 503);\n}\n$error = \"\";\nif (!isset($_SESSION[\"admin\"])) {\n    if ($_SERVER[\"REQUEST_METHOD\"] === \"POST\") {\n        check_csrf();\n        if (text($_POST, \"action\") !== \"login\") {\n            fail(\"Sign in first.\", 401);\n        }\n        $user = text($_POST, \"username\");\n        // Do not trim a password: spaces can be intentional.\n        $pass = $_POST[\"password\"] ?? null;\n        if ($user === \"admin\" && is_string($pass)\n            && password_verify($pass, $adminHash)) {\n            session_regenerate_id(true);\n            $_SESSION[\"admin\"] = true;\n            $_SESSION[\"csrf\"] = bin2hex(random_bytes(16));\n            redirect(\"Signed in.\");\n        }\n        http_response_code(401);\n        $error = \"Invalid username or password.\";\n    }\n    page(\"Inventory Login\");\n    echo '<p>', e($error), '</p>';\n    echo '<form method=\"post\">', csrf_field();\n    echo '<input type=\"hidden\" name=\"action\" value=\"login\">';\n    echo '<input name=\"username\" required placeholder=\"Username\">';\n    echo '<input name=\"password\" type=\"password\" required>';\n    echo '<button>Log in</button></form>';\n    exit;\n}\nif ($_SERVER[\"REQUEST_METHOD\"] === \"POST\"\n    && text($_POST, \"action\") === \"logout\") {\n    check_csrf();\n    $_SESSION = [];\n    $p = session_get_cookie_params();\n    setcookie(session_name(), \"\", [\n        \"expires\" => time() - 3600, \"path\" => $p[\"path\"],\n        \"domain\" => $p[\"domain\"], \"secure\" => $p[\"secure\"],\n        \"httponly\" => $p[\"httponly\"],\n        \"samesite\" => $p[\"samesite\"] ?? \"Lax\"\n    ]);\n    session_destroy();\n    header(\"Location: index.php\", true, 303);\n    exit;\n}"}, "out": "# 1. Anonymous request receives login, not inventory\n$ curl -b cookies.txt -c cookies.txt 'http://localhost/index.php'\n<!doctype html><meta charset=\"utf-8\"><title>Inventory Login</title><style>body{font:16px system-ui;max-width:840px;margin:24px auto;padding:12px}article{border:1px solid #ccc;padding:12px;margin:12px 0}form{margin:10px 0}input,textarea,button,select{font:inherit;margin:4px}textarea{display:block;width:95%}</style><h1>Inventory Login</h1><p></p><form method=\"post\"><input type=\"hidden\" name=\"csrf\" value=\"30991302429b0b1b91d2ce76b1e3a052\"><input type=\"hidden\" name=\"action\" value=\"login\"><input name=\"username\" required placeholder=\"Username\"><input name=\"password\" type=\"password\" required><button>Log in</button></form>\n\n# 2. Authenticate; redirected form has a new CSRF token\n$ curl -L -b cookies.txt -c cookies.txt -d 'action=login&username=admin&password=inventory%40123&csrf=30991302429b0b1b91d2ce76b1e3a052' 'http://localhost/index.php'\n<!doctype html><meta charset=\"utf-8\"><title>Inventory Manager</title><style>body{font:16px system-ui;max-width:840px;margin:24px auto;padding:12px}article{border:1px solid #ccc;padding:12px;margin:12px 0}form{margin:10px 0}input,textarea,button,select{font:inherit;margin:4px}textarea{display:block;width:95%}</style><h1>Inventory Manager</h1><p role=\"status\">Signed in.</p><form method=\"post\">\n  <input type=\"hidden\" name=\"csrf\" value=\"21aa3208868f66aa45c3b40cd29eeb5b\">  <button name=\"action\" value=\"logout\">Log out</button>\n</form>\n<p></p>\n<form method=\"post\">\n  <input type=\"hidden\" name=\"csrf\" value=\"21aa3208868f66aa45c3b40cd29eeb5b\">  <input type=\"hidden\" name=\"action\" value=\"save\">\n  <input type=\"hidden\" name=\"id\" value=\"0\">\n  SKU: <input name=\"sku\" required value=\"\"><br>\n  Name: <input name=\"name\" required value=\"\"><br>\n  Quantity: <input name=\"qty\" type=\"number\" min=\"0\" required value=\"0\"><br>\n  Price: <input name=\"price\" type=\"number\" step=\"0.01\" min=\"0\" required value=\"0.00\"><br>\n  <button>Save product</button>\n</form>\n<p>Products: 0</p>\n\n# 3. Add a product\n$ curl -L -b cookies.txt -c cookies.txt -d 'action=save&id=0&sku=USB001&name=USB+Cable&qty=5&price=149.50&csrf=21aa3208868f66aa45c3b40cd29eeb5b' 'http://localhost/index.php'\n<!doctype html><meta charset=\"utf-8\"><title>Inventory Manager</title><style>body{font:16px system-ui;max-width:840px;margin:24px auto;padding:12px}article{border:1px solid #ccc;padding:12px;margin:12px 0}form{margin:10px 0}input,textarea,button,select{font:inherit;margin:4px}textarea{display:block;width:95%}</style><h1>Inventory Manager</h1><p role=\"status\">Product added.</p><form method=\"post\">\n  <input type=\"hidden\" name=\"csrf\" value=\"21aa3208868f66aa45c3b40cd29eeb5b\">  <button name=\"action\" value=\"logout\">Log out</button>\n</form>\n<p></p>\n<form method=\"post\">\n  <input type=\"hidden\" name=\"csrf\" value=\"21aa3208868f66aa45c3b40cd29eeb5b\">  <input type=\"hidden\" name=\"action\" value=\"save\">\n  <input type=\"hidden\" name=\"id\" value=\"0\">\n  SKU: <input name=\"sku\" required value=\"\"><br>\n  Name: <input name=\"name\" required value=\"\"><br>\n  Quantity: <input name=\"qty\" type=\"number\" min=\"0\" required value=\"0\"><br>\n  Price: <input name=\"price\" type=\"number\" step=\"0.01\" min=\"0\" required value=\"0.00\"><br>\n  <button>Save product</button>\n</form>\n<p>Products: 1</p>\n<article data-id=\"1\">\n  <b>USB001: USB Cable</b>\n  <p>Qty: 5 | Price: Rs 149.50</p>\n    <a href=\"?edit=1\">Edit</a>\n  <form method=\"post\">\n    <input type=\"hidden\" name=\"csrf\" value=\"21aa3208868f66aa45c3b40cd29eeb5b\">    <input type=\"hidden\" name=\"id\" value=\"1\">\n    <input name=\"amount\" type=\"number\" min=\"1\" value=\"1\">\n    <button name=\"action\" value=\"sell\">Sell</button>\n    <button name=\"action\" value=\"restock\">Restock</button>\n    <button name=\"action\" value=\"delete\">Delete</button>\n  </form>\n</article>\n\n# 4. Update quantity and price\n$ curl -L -b cookies.txt -c cookies.txt -d 'action=save&id=1&sku=USB001&name=USB+Cable&qty=8&price=159.50&csrf=21aa3208868f66aa45c3b40cd29eeb5b' 'http://localhost/index.php'\n<!doctype html><meta charset=\"utf-8\"><title>Inventory Manager</title><style>body{font:16px system-ui;max-width:840px;margin:24px auto;padding:12px}article{border:1px solid #ccc;padding:12px;margin:12px 0}form{margin:10px 0}input,textarea,button,select{font:inherit;margin:4px}textarea{display:block;width:95%}</style><h1>Inventory Manager</h1><p role=\"status\">Product updated.</p><form method=\"post\">\n  <input type=\"hidden\" name=\"csrf\" value=\"21aa3208868f66aa45c3b40cd29eeb5b\">  <button name=\"action\" value=\"logout\">Log out</button>\n</form>\n<p></p>\n<form method=\"post\">\n  <input type=\"hidden\" name=\"csrf\" value=\"21aa3208868f66aa45c3b40cd29eeb5b\">  <input type=\"hidden\" name=\"action\" value=\"save\">\n  <input type=\"hidden\" name=\"id\" value=\"0\">\n  SKU: <input name=\"sku\" required value=\"\"><br>\n  Name: <input name=\"name\" required value=\"\"><br>\n  Quantity: <input name=\"qty\" type=\"number\" min=\"0\" required value=\"0\"><br>\n  Price: <input name=\"price\" type=\"number\" step=\"0.01\" min=\"0\" required value=\"0.00\"><br>\n  <button>Save product</button>\n</form>\n<p>Products: 1</p>\n<article data-id=\"1\">\n  <b>USB001: USB Cable</b>\n  <p>Qty: 8 | Price: Rs 159.50</p>\n    <a href=\"?edit=1\">Edit</a>\n  <form method=\"post\">\n    <input type=\"hidden\" name=\"csrf\" value=\"21aa3208868f66aa45c3b40cd29eeb5b\">    <input type=\"hidden\" name=\"id\" value=\"1\">\n    <input name=\"amount\" type=\"number\" min=\"1\" value=\"1\">\n    <button name=\"action\" value=\"sell\">Sell</button>\n    <button name=\"action\" value=\"restock\">Restock</button>\n    <button name=\"action\" value=\"delete\">Delete</button>\n  </form>\n</article>\n\n# 5. Sell six; quantity 2 triggers low-stock alert\n$ curl -L -b cookies.txt -c cookies.txt -d 'action=sell&id=1&amount=6&csrf=21aa3208868f66aa45c3b40cd29eeb5b' 'http://localhost/index.php'\n<!doctype html><meta charset=\"utf-8\"><title>Inventory Manager</title><style>body{font:16px system-ui;max-width:840px;margin:24px auto;padding:12px}article{border:1px solid #ccc;padding:12px;margin:12px 0}form{margin:10px 0}input,textarea,button,select{font:inherit;margin:4px}textarea{display:block;width:95%}</style><h1>Inventory Manager</h1><p role=\"status\">Stock changed.</p><form method=\"post\">\n  <input type=\"hidden\" name=\"csrf\" value=\"21aa3208868f66aa45c3b40cd29eeb5b\">  <button name=\"action\" value=\"logout\">Log out</button>\n</form>\n<p></p>\n<form method=\"post\">\n  <input type=\"hidden\" name=\"csrf\" value=\"21aa3208868f66aa45c3b40cd29eeb5b\">  <input type=\"hidden\" name=\"action\" value=\"save\">\n  <input type=\"hidden\" name=\"id\" value=\"0\">\n  SKU: <input name=\"sku\" required value=\"\"><br>\n  Name: <input name=\"name\" required value=\"\"><br>\n  Quantity: <input name=\"qty\" type=\"number\" min=\"0\" required value=\"0\"><br>\n  Price: <input name=\"price\" type=\"number\" step=\"0.01\" min=\"0\" required value=\"0.00\"><br>\n  <button>Save product</button>\n</form>\n<p>Products: 1</p>\n<article data-id=\"1\">\n  <b>USB001: USB Cable</b>\n  <p>Qty: 2 | Price: Rs 159.50</p>\n  <strong>Low stock</strong>  <a href=\"?edit=1\">Edit</a>\n  <form method=\"post\">\n    <input type=\"hidden\" name=\"csrf\" value=\"21aa3208868f66aa45c3b40cd29eeb5b\">    <input type=\"hidden\" name=\"id\" value=\"1\">\n    <input name=\"amount\" type=\"number\" min=\"1\" value=\"1\">\n    <button name=\"action\" value=\"sell\">Sell</button>\n    <button name=\"action\" value=\"restock\">Restock</button>\n    <button name=\"action\" value=\"delete\">Delete</button>\n  </form>\n</article>\n\n# 6. Oversell is rejected without changing stock\n$ curl -i -b cookies.txt -c cookies.txt -d 'action=sell&id=1&amount=99&csrf=21aa3208868f66aa45c3b40cd29eeb5b' 'http://localhost/index.php'\nHTTP/1.1 409 Conflict\nHost: 127.0.0.1:49309\nDate: Thu, 29 Oct 2026 06:09:13 GMT\nConnection: close\nX-Powered-By: PHP/8.4.27\nExpires: Thu, 19 Nov 1981 08:52:00 GMT\nCache-Control: no-store, no-cache, must-revalidate\nPragma: no-cache\nContent-type: text/html; charset=UTF-8\n\nStock change rejected; quantity unchanged.\n\n# 7. Restock three; quantity becomes 5\n$ curl -L -b cookies.txt -c cookies.txt -d 'action=restock&id=1&amount=3&csrf=21aa3208868f66aa45c3b40cd29eeb5b' 'http://localhost/index.php'\n<!doctype html><meta charset=\"utf-8\"><title>Inventory Manager</title><style>body{font:16px system-ui;max-width:840px;margin:24px auto;padding:12px}article{border:1px solid #ccc;padding:12px;margin:12px 0}form{margin:10px 0}input,textarea,button,select{font:inherit;margin:4px}textarea{display:block;width:95%}</style><h1>Inventory Manager</h1><p role=\"status\">Stock changed.</p><form method=\"post\">\n  <input type=\"hidden\" name=\"csrf\" value=\"21aa3208868f66aa45c3b40cd29eeb5b\">  <button name=\"action\" value=\"logout\">Log out</button>\n</form>\n<p></p>\n<form method=\"post\">\n  <input type=\"hidden\" name=\"csrf\" value=\"21aa3208868f66aa45c3b40cd29eeb5b\">  <input type=\"hidden\" name=\"action\" value=\"save\">\n  <input type=\"hidden\" name=\"id\" value=\"0\">\n  SKU: <input name=\"sku\" required value=\"\"><br>\n  Name: <input name=\"name\" required value=\"\"><br>\n  Quantity: <input name=\"qty\" type=\"number\" min=\"0\" required value=\"0\"><br>\n  Price: <input name=\"price\" type=\"number\" step=\"0.01\" min=\"0\" required value=\"0.00\"><br>\n  <button>Save product</button>\n</form>\n<p>Products: 1</p>\n<article data-id=\"1\">\n  <b>USB001: USB Cable</b>\n  <p>Qty: 5 | Price: Rs 159.50</p>\n    <a href=\"?edit=1\">Edit</a>\n  <form method=\"post\">\n    <input type=\"hidden\" name=\"csrf\" value=\"21aa3208868f66aa45c3b40cd29eeb5b\">    <input type=\"hidden\" name=\"id\" value=\"1\">\n    <input name=\"amount\" type=\"number\" min=\"1\" value=\"1\">\n    <button name=\"action\" value=\"sell\">Sell</button>\n    <button name=\"action\" value=\"restock\">Restock</button>\n    <button name=\"action\" value=\"delete\">Delete</button>\n  </form>\n</article>\n\n# 8. Delete the product\n$ curl -L -b cookies.txt -c cookies.txt -d 'action=delete&id=1&csrf=21aa3208868f66aa45c3b40cd29eeb5b' 'http://localhost/index.php'\n<!doctype html><meta charset=\"utf-8\"><title>Inventory Manager</title><style>body{font:16px system-ui;max-width:840px;margin:24px auto;padding:12px}article{border:1px solid #ccc;padding:12px;margin:12px 0}form{margin:10px 0}input,textarea,button,select{font:inherit;margin:4px}textarea{display:block;width:95%}</style><h1>Inventory Manager</h1><p role=\"status\">Product deleted.</p><form method=\"post\">\n  <input type=\"hidden\" name=\"csrf\" value=\"21aa3208868f66aa45c3b40cd29eeb5b\">  <button name=\"action\" value=\"logout\">Log out</button>\n</form>\n<p></p>\n<form method=\"post\">\n  <input type=\"hidden\" name=\"csrf\" value=\"21aa3208868f66aa45c3b40cd29eeb5b\">  <input type=\"hidden\" name=\"action\" value=\"save\">\n  <input type=\"hidden\" name=\"id\" value=\"0\">\n  SKU: <input name=\"sku\" required value=\"\"><br>\n  Name: <input name=\"name\" required value=\"\"><br>\n  Quantity: <input name=\"qty\" type=\"number\" min=\"0\" required value=\"0\"><br>\n  Price: <input name=\"price\" type=\"number\" step=\"0.01\" min=\"0\" required value=\"0.00\"><br>\n  <button>Save product</button>\n</form>\n<p>Products: 0</p>\n\n# 9. Logout restores the login gate\n$ curl -L -b cookies.txt -c cookies.txt -d 'action=logout&csrf=21aa3208868f66aa45c3b40cd29eeb5b' 'http://localhost/index.php'\n<!doctype html><meta charset=\"utf-8\"><title>Inventory Login</title><style>body{font:16px system-ui;max-width:840px;margin:24px auto;padding:12px}article{border:1px solid #ccc;padding:12px;margin:12px 0}form{margin:10px 0}input,textarea,button,select{font:inherit;margin:4px}textarea{display:block;width:95%}</style><h1>Inventory Login</h1><p></p><form method=\"post\"><input type=\"hidden\" name=\"csrf\" value=\"4c0e950841b95e8e2e6f30825dd3f75c\"><input type=\"hidden\" name=\"action\" value=\"login\"><input name=\"username\" required placeholder=\"Username\"><input name=\"password\" type=\"password\" required><button>Log in</button></form>", "expl": {"en": "<p>Inventory Manager supports product CRUD, unique SKU, integer quantities, DECIMAL prices, low-stock alerts, atomic sell/restock and authenticated access. auth.php requires an <code>ADMIN_HASH</code> environment value generated with password_hash; it has no built-in default password. The test supplies a temporary lab hash and uses <code>admin / inventory@123</code> only for this local demonstration. Set your own unique password/hash before running or hosting it.</p><p>All mutations require a CSRF-protected POST; after login the session ID/token rotate, and logout clears both server state and cookie. Selling 99 when only 2 remain returns 409 and leaves stock unchanged. Prices are bound as validated decimal strings, not binary floating-point arithmetic. The local HTTP test is real, but this application has <b>not</b> been deployed to an external host; the notes provide the separate HTTPS/credentials/import/backup/smoke-test hosting checklist.</p><p><b>One-time schema/seed setup:</b> select the lesson database in phpMyAdmin and run this SQL before opening the PHP page.</p><pre class=\"c\">CREATE TABLE products (\n  id INT PRIMARY KEY AUTO_INCREMENT,\n  sku VARCHAR(30) NOT NULL UNIQUE,\n  name VARCHAR(80) NOT NULL,\n  qty INT NOT NULL DEFAULT 0 CHECK (qty BETWEEN 0 AND 1000000),\n  price DECIMAL(10,2) NOT NULL CHECK (price &gt;= 0)\n) ENGINE=InnoDB;</pre><p>Save each labelled PHP section as a separate file. db.php reads DB_HOST, DB_USER, DB_PASS and DB_NAME from the environment; its classroom defaults require the lab account described in the notes. DB_SOCKET is optional and used only by the isolated test harness. The output is actual HTTP/HTML source from PHP 8.4 with a real MariaDB server through MySQLi; the browser renders the forms. These temporary test databases are deleted afterwards.</p>"}}], "diagrams": [{"id": "wd5_stack", "title": {"en": "From Browser Form to Stored Rows"}, "file": "diagrams/wd5_stack.svg"}, {"id": "wd5_phpmyadmin", "title": {"en": "phpMyAdmin: Practical 19 Workflow"}, "file": "diagrams/wd5_phpmyadmin.svg"}, {"id": "wd5_table_design", "title": {"en": "Table Design: Types, Keys and Rules"}, "file": "diagrams/wd5_table_design.svg"}, {"id": "wd5_connection", "title": {"en": "A MySQLi Connection's Working Life"}, "file": "diagrams/wd5_connection.svg"}, {"id": "wd5_crud", "title": {"en": "CRUD: HTTP Action, SQL and Evidence"}, "file": "diagrams/wd5_crud.svg"}, {"id": "wd5_prepared", "title": {"en": "Prepared Statements Keep Values Separate"}, "file": "diagrams/wd5_prepared.svg"}, {"id": "wd5_injection", "title": {"en": "SQL Injection: Code vs Literal Data"}, "file": "diagrams/wd5_injection.svg"}, {"id": "wd5_transaction", "title": {"en": "Transaction: All Writes or No Writes"}, "file": "diagrams/wd5_transaction.svg"}, {"id": "wd5_mvc", "title": {"en": "MVC Contacts: Each Layer Has One Job"}, "file": "diagrams/wd5_mvc.svg"}, {"id": "wd5_deploy", "title": {"en": "Inventory Hosting: A Separate Checklist"}, "file": "diagrams/wd5_deploy.svg"}], "syntax": [{"title": {"en": "Connection and Database Cards"}, "items": [{"name": {"en": "Connect and charset"}, "f": "mysqli_report(\n  MYSQLI_REPORT_ERROR | MYSQLI_REPORT_STRICT\n);\n$db = new mysqli($host,$user,$pass,$name);\n$db->set_charset(\"utf8mb4\");", "terms": {"en": "Credentials are private server configuration. Catch/log failures safely."}}, {"name": {"en": "Query results"}, "f": "SELECT query() -> mysqli_result\nDML query()    -> true on success\nfetch_assoc()  -> next named row\nnum_rows       -> SELECT count\ninsert_id      -> generated ID", "terms": {"en": "Strict reporting throws on SQL failures. Do not fetch rows from a successful UPDATE boolean."}}, {"name": {"en": "DDL and keys"}, "f": "CREATE TABLE / ALTER TABLE / DROP TABLE\nid INT PRIMARY KEY AUTO_INCREMENT\nemail VARCHAR(120) UNIQUE\nprice DECIMAL(10,2)\nENGINE=InnoDB", "terms": {"en": "Structure is DDL; row CRUD changes data. IDs are not gap-free row counts."}}]}, {"title": {"en": "Prepared CRUD Cards"}, "items": [{"name": {"en": "Fetch a SELECT"}, "f": "$r = $db->query($constantSql);\nwhile ($row = $r->fetch_assoc()) {\n  echo htmlspecialchars($row[\"name\"]);\n}\n$r->free();", "terms": {"en": "Only use a constant/trusted query here; bind all submitted values."}}, {"name": {"en": "Prepared INSERT"}, "f": "$s = $db->prepare(\n  \"INSERT INTO contacts(name,email) VALUES (?,?)\"\n);\n$s->bind_param(\"ss\", $name, $email);\n$s->execute();\n$id = $db->insert_id;", "terms": {"en": "SQL shape and literal values travel separately. ? is not quoted."}}, {"name": {"en": "Binding and reuse"}, "f": "i integer   d double\ns string    b blob\nbind_param(\"si\", $name, $marks);\n// Variables bind by reference.\n// Change values, execute again.\n// ? count = type count = variable count.", "terms": {"en": "For SELECT, get_result needs mysqlnd; bind_result/fetch is an alternative."}}, {"name": {"en": "Targeted writes"}, "f": "UPDATE posts SET title=? WHERE id=?\nDELETE FROM posts WHERE id=?\n$s->affected_rows\n// 0 on UPDATE can mean unchanged OR absent.\n// Validate IDs; never omit the predicate.", "terms": {"en": "Mutations use POST + CSRF + authorisation; redirect after success."}}]}, {"title": {"en": "Security and Consistency Cards"}, "items": [{"name": {"en": "Placeholder boundaries"}, "f": "WHERE name=?        // yes: value\nORDER BY ?          // not a column selector\nFROM ?              // not a table selector\n// Allowlist identifiers / sort keywords.\n// A LIKE value may still contain % wildcards.", "terms": {"en": "Prepared parameters protect values, not SQL structure supplied elsewhere."}}, {"name": {"en": "Different defences"}, "f": "Validate input       -> business rules\nPrepared SQL         -> injection defence\nhtmlspecialchars     -> safe HTML output\nPOST + CSRF          -> request integrity\nLogin + permissions  -> access control", "terms": {"en": "No single layer replaces the others. Stored database text can still carry XSS."}}, {"name": {"en": "Transaction"}, "f": "$db->begin_transaction();\ntry {\n  // Related InnoDB row writes.\n  $db->commit();\n} catch (Throwable $e) {\n  $db->rollback();\n  throw $e;\n}", "terms": {"en": "Keep all related writes or none. DDL can cause implicit commits."}}]}, {"title": {"en": "Projects and Hosting Cards"}, "items": [{"name": {"en": "MVC responsibilities"}, "f": "Controller: request, validation, redirect\nModel:      prepared SQL and data access\nView:       escaped HTML, no queries\nindex.php:  construct dependencies, dispatch", "terms": {"en": "The controller passes model data to the view; no framework is required for this small MVC example."}}, {"name": {"en": "AI-assisted To-Do review"}, "f": "Specify features + schema + security.\nInspect every generated query/echo/ID.\nRun add/edit/toggle/filter/delete tests.\nChallenge blank input, CSRF and injection.\nRecord corrections + observed evidence.", "terms": {"en": "Generated code is a draft. Never mark an unrun test as passed or provide production secrets."}}, {"name": {"en": "Inventory rules"}, "f": "SKU: unique, allowlisted shape\nQty: non-negative integer\nPrice: validated decimal -> DECIMAL\nSell: UPDATE ... WHERE qty >= amount\nAdmin: password_verify + session guard", "terms": {"en": "ADMIN_HASH is required; there is no built-in admin password. Oversell must not change stock."}}, {"name": {"en": "Deployment checklist"}, "f": "PHP + mysqli/mysqlnd + database + HTTPS\nImport schema with admin account.\nRuntime account: minimum CRUD rights.\nPrivate DB settings + ADMIN_HASH.\nHide debug output; test backups + logout.", "terms": {"en": "Static hosting cannot execute PHP. Local reference tests are not proof of external deployment."}}]}], "viva": [{"title": {"en": "Database Foundations and Administration"}, "items": [{"q": {"en": "What does MySQLi stand for?"}, "a": {"en": "MySQL Improved: PHP's extension/API for connecting to a MySQL-compatible database and executing queries, including prepared statements."}}, {"q": {"en": "MySQL vs phpMyAdmin?"}, "a": {"en": "MySQL is a database server. phpMyAdmin is a web administration interface for it or a compatible server; your own PHP application uses a client API such as MySQLi."}}, {"q": {"en": "Which database actually generated this unit's outputs?"}, "a": {"en": "A real MariaDB server through PHP 8.4 mysqlnd/MySQLi. MariaDB is MySQL-compatible; these outputs are not SQLite emulation or hand-written rows."}}, {"q": {"en": "Why use a database instead of a feedback text file?"}, "a": {"en": "Structured queries, keys, constraints, shared persistent storage and transactional/concurrent changes become easier to manage reliably."}}, {"q": {"en": "Name the usual MySQLi connection arguments."}, "a": {"en": "Host, username, password and database, with optional port and Unix socket. Keep credentials in private server configuration."}}, {"q": {"en": "Why can localhost and 127.0.0.1 behave differently?"}, "a": {"en": "localhost may select a local Unix socket, whereas 127.0.0.1 normally uses TCP. Match the server listener and connection configuration."}}, {"q": {"en": "Why call set_charset('utf8mb4')?"}, "a": {"en": "It configures full-Unicode encoding on the database connection. A UTF-8 HTML meta tag does not configure the connection or table charset."}}, {"q": {"en": "Object-oriented vs procedural MySQLi?"}, "a": {"en": "They expose the same underlying API in different syntax: $db->query($sql) versus mysqli_query($db,$sql), for example."}}, {"q": {"en": "phpMyAdmin Structure vs Browse vs SQL?"}, "a": {"en": "Structure shows columns/indexes/constraints; Browse shows records; SQL runs entered statements and presents their results or errors."}}, {"q": {"en": "CREATE TABLE, ALTER TABLE and DROP TABLE do what?"}, "a": {"en": "Create defines structure, alter changes it, and drop removes the table including its data. These are DDL operations."}}, {"q": {"en": "DELETE FROM vs DROP TABLE?"}, "a": {"en": "DELETE removes selected rows while keeping table structure; DROP removes the structure and its rows. Be certain of the target and back up first."}}, {"q": {"en": "Primary key, UNIQUE and AUTO_INCREMENT?"}, "a": {"en": "A primary key uniquely identifies a non-null row; UNIQUE rejects duplicate values under its rules; AUTO_INCREMENT generates numeric identifiers, not gap-free row numbers."}}]}, {"title": {"en": "MySQLi, Results and Prepared CRUD"}, "items": [{"q": {"en": "What does query() return for SELECT versus a successful UPDATE?"}, "a": {"en": "SELECT returns mysqli_result; an UPDATE through query returns true on success. With strict reporting, failures throw rather than being ordinary successful results."}}, {"q": {"en": "What does fetch_assoc do at the end of a result?"}, "a": {"en": "It returns the next associative row each time and null when no rows remain. The keys correspond to selected column names or aliases."}}, {"q": {"en": "num_rows vs affected_rows?"}, "a": {"en": "num_rows counts buffered result rows from a SELECT; affected_rows reports the last write's affected-row count, subject to operation/client flags."}}, {"q": {"en": "What is insert_id?"}, "a": {"en": "The generated auto-increment ID from the last applicable insert on that connection. It is not the number of records in the table."}}, {"q": {"en": "The normal prepared-statement sequence?"}, "a": {"en": "prepare the SQL template; bind variables; execute; fetch SELECT results or inspect write evidence; close when finished."}}, {"q": {"en": "What are the bind_param type letters?"}, "a": {"en": "i integer, d double, s string and b blob. The type-string length/order and variables must match the placeholders."}}, {"q": {"en": "What does binding by reference mean?"}, "a": {"en": "The statement uses the current values of its bound variables at execute time. Change those variables and execute again to reuse it; bind variables rather than temporary expressions."}}, {"q": {"en": "Why must the question-mark placeholder not be quoted?"}, "a": {"en": "The unquoted question mark marks a parameter position. Quoting it makes it a literal SQL string rather than that parameter placeholder."}}, {"q": {"en": "What if get_result is unavailable?"}, "a": {"en": "get_result requires mysqlnd. Bind output variables with bind_result and loop fetch instead, or deploy with mysqlnd support."}}, {"q": {"en": "Why is WHERE critical in UPDATE and DELETE?"}, "a": {"en": "Without the intended predicate the statement can affect all rows. Parameterisation does not repair a missing or logically wrong WHERE clause."}}, {"q": {"en": "Does UPDATE affected_rows=0 always mean no matching ID?"}, "a": {"en": "No. With default client flags it can also mean the matching row already had those values. Check existence separately if the UI needs that distinction."}}, {"q": {"en": "Should the production runtime account have CREATE/DROP privileges?"}, "a": {"en": "Normally not for a CRUD application. Import/migrate schemas with an appropriate admin account, then grant only the runtime privileges actually required."}}]}, {"title": {"en": "Injection, Security and Transactions"}, "items": [{"q": {"en": "What is SQL injection?"}, "a": {"en": "Untrusted input is incorporated into SQL syntax and changes the query structure, potentially disclosing or changing unintended data."}}, {"q": {"en": "How does a prepared parameter prevent value-based injection?"}, "a": {"en": "It keeps the SQL template separate from the bound value, so quotes or OR clauses in that value remain literal data rather than new SQL syntax."}}, {"q": {"en": "Can a parameter stand for a table or column name?"}, "a": {"en": "No. Use a controlled mapping/allowlist of trusted identifiers, sort directions or clauses. Bind ordinary values separately."}}, {"q": {"en": "Does htmlspecialchars prevent SQL injection?"}, "a": {"en": "No. It escapes HTML output. Prepared SQL values prevent SQL injection; they do not automatically escape the value when rendering HTML."}}, {"q": {"en": "Does a bound LIKE value make percent signs literal?"}, "a": {"en": "No. Percent/underscore can still have LIKE wildcard semantics inside the value. That is search behaviour, not SQL injection; escape wildcards separately if literal matching is required."}}, {"q": {"en": "Is a CSRF token the same as authentication?"}, "a": {"en": "No. It helps verify request origin/integrity for a session; login and authorisation decide who may access or change the data."}}, {"q": {"en": "Why use POST and a redirect for mutations?"}, "a": {"en": "GET should not delete or otherwise mutate records. A validated CSRF-protected POST performs the change, then 303/GET displays stored state and reduces refresh resubmission."}}, {"q": {"en": "What do commit and rollback do?"}, "a": {"en": "commit keeps a completed transaction's related changes; rollback undoes its uncommitted transactional row changes after failure."}}, {"q": {"en": "Why use InnoDB, and can DDL be rolled back like row writes?"}, "a": {"en": "InnoDB supports these transactions. CREATE/ALTER/DROP can trigger implicit commits, so do not assume DDL participates like ordinary transactional row updates."}}, {"q": {"en": "Why check availability inside the stock UPDATE?"}, "a": {"en": "A conditional UPDATE with qty >= amount checks and changes stock atomically. A separate read-then-write can race unless adequate concurrency control is used."}}, {"q": {"en": "Why use DECIMAL for prices?"}, "a": {"en": "It stores exact fixed-point decimal amounts; binary floating-point can introduce rounding surprises. The reference validates and binds price strings into DECIMAL."}}, {"q": {"en": "How should duplicate key error 1062 and unexpected errors be handled?"}, "a": {"en": "Recognise the known duplicate case and show a clear validation message; log unexpected details securely and return a safe generic failure instead of exposing raw database messages."}}]}, {"title": {"en": "MVC, Projects, AI Review and Hosting"}, "items": [{"q": {"en": "What is MVC?"}, "a": {"en": "Model-View-Controller: a separation of data access, presentation and request/application coordination. A small PHP MVC app does not require a framework."}}, {"q": {"en": "What belongs in the Contact model?"}, "a": {"en": "Prepared database operations such as search/find/save/delete. It should not read $_POST or emit HTML."}}, {"q": {"en": "What belongs in the controller?"}, "a": {"en": "Read and validate HTTP input, check CSRF/permissions, call the appropriate model method, choose a redirect or pass data to a view."}}, {"q": {"en": "What belongs in the view?"}, "a": {"en": "Forms and escaped HTML output. It should not open database connections or execute SQL."}}, {"q": {"en": "Why pass a model/connection through a constructor?"}, "a": {"en": "Dependencies become explicit and replaceable, rather than hidden global state inside every method; the front controller wires them together."}}, {"q": {"en": "Name the four Blog CRUD actions in Practical 20."}, "a": {"en": "Create a validated post, list/read/search stored posts, load and save an edit, and delete one primary key using a CSRF-protected POST."}}, {"q": {"en": "What evidence should an AI-assisted To-Do practical record?"}, "a": {"en": "The requirement prompt, generated draft, your review/corrections, and actually observed add/edit/toggle/filter/delete and negative-test results. Never claim unrun tests passed."}}, {"q": {"en": "Why is the To-Do filter allowlisted?"}, "a": {"en": "The all/pending/done key selects a fixed trusted SQL fragment. Arbitrary submitted SQL clauses are not concatenated into the query."}}, {"q": {"en": "Which Inventory values must be validated?"}, "a": {"en": "SKU shape/uniqueness, name length, non-negative integer quantity, decimal price precision, positive stock-change amount and explicit record ID, alongside session/CSRF checks."}}, {"q": {"en": "Why does Inventory require ADMIN_HASH?"}, "a": {"en": "There is no built-in default admin password. The operator configures a hash of a unique chosen password; login checks it with password_verify and starts authenticated access."}}, {"q": {"en": "Can this PHP inventory run on static hosting such as GitHub Pages?"}, "a": {"en": "No. It needs a PHP-capable server with MySQLi/mysqlnd and a compatible database. Publishing study-material JSON/HTML is different from hosting that database application."}}, {"q": {"en": "What proves a successful remote deployment?"}, "a": {"en": "Remote guest/login/CRUD/validation/oversell/logout smoke tests over HTTPS, correctly configured private credentials, safe errors and a tested backup/restore process; local execution alone is not proof."}}]}], "exam_questions": [{"q": {"en": "Explain the browser-PHP-MySQLi-database request path. Distinguish MySQL/MariaDB, MySQLi and phpMyAdmin."}, "marks": 4}, {"q": {"en": "Perform the phpMyAdmin practical: create/select a scratch database, create and alter a table, run CRUD SQL, export a backup, then safely drop the scratch table/database. Record observed evidence. (Practical 19)"}, "marks": 6}, {"q": {"en": "Compare CREATE, ALTER, DROP and DELETE; explain suitable data types, primary/foreign keys, UNIQUE, NOT NULL and CHECK."}, "marks": 4}, {"q": {"en": "Write a MySQLi connection with explicit error reporting and utf8mb4. Explain private credentials, local socket/TCP differences and safe error handling."}, "marks": 4}, {"q": {"en": "Write a SELECT program using num_rows, fetch_assoc and free. Show its procedural equivalents and explain result types."}, "marks": 4}, {"q": {"en": "Write and reuse a prepared INSERT with bind_param, insert_id and duplicate-email handling. Explain placeholder order, type letters and binding by reference."}, "marks": 6}, {"q": {"en": "Write prepared UPDATE and DELETE statements for a supplied primary key. Explain missing WHERE hazards and the ambiguity of UPDATE affected_rows=0."}, "marks": 6}, {"q": {"en": "Demonstrate SQL injection using an isolated read-only lookup, then correct it with a prepared parameter. Test an apostrophe-containing name and an injection-shaped value."}, "marks": 6}, {"q": {"en": "Explain why parameters cannot replace table/column names, how to allowlist sorting/filter options, and why SQL parameterisation is different from HTML escaping."}, "marks": 4}, {"q": {"en": "Implement an InnoDB stock decrement plus movement log in one transaction. Commit success, roll back insufficient stock/failure, and verify quantity and movement count."}, "marks": 6}, {"q": {"en": "Give a layered security checklist covering validation, prepared SQL, escaped stored text, POST/CSRF, authentication/authorisation and least-privilege credentials."}, "marks": 4}, {"q": {"en": "Develop the complete Blog application with create/list/search/edit/delete, sticky validation errors, prepared values, safe HTML and Post/Redirect/Get. (Practical 20)"}, "marks": 6}, {"q": {"en": "Draw MVC request/data flow and explain the responsibilities of the front controller, model, controller and view in a PHP/OOP application."}, "marks": 4}, {"q": {"en": "Develop MVC Contacts with add/search/update/delete. Use constructor-supplied dependencies, prepared SQL, CSRF checks and escaped views. Prove injection-shaped search remains data. (Practical 21)"}, "marks": 6}, {"q": {"en": "Use an AI code-generation workflow to build/review a PHP/MySQLi To-Do app. Record the prompt, corrections and actual add/edit/toggle/filter/delete plus negative-test evidence. (Practical 22)"}, "marks": 6}, {"q": {"en": "Develop authenticated Inventory CRUD with unique SKU, integer quantity, DECIMAL price, atomic stock checks, low-stock alerts and full logout. (Practical 23)"}, "marks": 6}, {"q": {"en": "Carry out the Inventory hosting checklist on a PHP-capable account: import, private settings, unique admin hash, HTTPS, safe errors, remote smoke tests and backup/restore. Distinguish local proof from deployment proof. (Practical 23)"}, "marks": 6}, {"q": {"en": "Design an acceptance-test matrix for CRUD, malformed/missing IDs, XSS/injection probes, forged CSRF, duplicate/negative stock, oversell, transaction rollback and logged-out access."}, "marks": 4}]};
const SVG = {"wd5_stack": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 342\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"342\" fill=\"#ffffff\"/><text x=\"180\" y=\"23.1\" font-size=\"14.5\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">From Browser Form to Stored Rows</text><rect x=\"12\" y=\"46\" width=\"336\" height=\"48\" rx=\"8\" fill=\"#E3F0FC\" stroke=\"#1565C0\" stroke-width=\"1.3\"/><text x=\"180\" y=\"64.3\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#1565C0\" font-weight=\"bold\">BROWSER / PRESENTATION</text><text x=\"180\" y=\"83.0\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">HTML forms, links, rendered responses</text><rect x=\"12\" y=\"118\" width=\"336\" height=\"48\" rx=\"8\" fill=\"#F1E8FC\" stroke=\"#7B2CD9\" stroke-width=\"1.3\"/><text x=\"180\" y=\"136.3\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">PHP + MySQLi / APPLICATION</text><text x=\"180\" y=\"155.0\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">validate -&gt; prepare -&gt; bind -&gt; execute</text><rect x=\"12\" y=\"190\" width=\"336\" height=\"48\" rx=\"8\" fill=\"#E3F5E6\" stroke=\"#2E7D32\" stroke-width=\"1.3\"/><text x=\"180\" y=\"208.3\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#2E7D32\" font-weight=\"bold\">MySQL-COMPATIBLE SERVER / DATA</text><text x=\"180\" y=\"227.0\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">tables, keys, constraints, transactions</text><path d=\"M170 94 L170 118\" fill=\"none\" stroke=\"#1565C0\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polygon points=\"170.0,118.0 173.5,111.0 166.5,111.0\" fill=\"#1565C0\"/><path d=\"M190 118 L190 94\" fill=\"none\" stroke=\"#2E7D32\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polygon points=\"190.0,94.0 186.5,101.0 193.5,101.0\" fill=\"#2E7D32\"/><path d=\"M170 166 L170 190\" fill=\"none\" stroke=\"#7B2CD9\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polygon points=\"170.0,190.0 173.5,183.0 166.5,183.0\" fill=\"#7B2CD9\"/><path d=\"M190 190 L190 166\" fill=\"none\" stroke=\"#2E7D32\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polygon points=\"190.0,166.0 186.5,173.0 193.5,173.0\" fill=\"#2E7D32\"/><rect x=\"12\" y=\"258\" width=\"336\" height=\"70\" rx=\"7\" fill=\"#E3F0FC\" stroke=\"#1565C0\" stroke-width=\"1.1\"/><text x=\"20\" y=\"276.1\" font-size=\"8.8\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">MySQLi is PHP's client API, not a database.</text><text x=\"20\" y=\"291.1\" font-size=\"8.8\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">phpMyAdmin is a web administration UI.</text><text x=\"20\" y=\"306.1\" font-size=\"8.8\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">The lesson runs real MySQLi against MariaDB,</text><text x=\"20\" y=\"321.1\" font-size=\"8.8\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">a MySQL-compatible server, not a SQL emulator.</text></svg>", "wd5_phpmyadmin": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 420\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"420\" fill=\"#ffffff\"/><text x=\"180\" y=\"23.1\" font-size=\"14.5\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">phpMyAdmin: Practical 19 Workflow</text><rect x=\"12\" y=\"44\" width=\"336\" height=\"38\" rx=\"7\" fill=\"#E3F0FC\" stroke=\"#1565C0\" stroke-width=\"1.2\"/><text x=\"24\" y=\"58.9\" font-size=\"8.4\" text-anchor=\"start\" fill=\"#1565C0\" font-weight=\"bold\">1  START SERVICES</text><text x=\"24\" y=\"73.8\" font-size=\"8.0\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">Local Apache/PHP + MySQL/MariaDB</text><path d=\"M180 82 L180 94\" fill=\"none\" stroke=\"#222\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"ro "1.2\"/><text x=\"24\" y=\"258.9\" font-size=\"8.4\" text-anchor=\"start\" fill=\"#2E7D32\" font-weight=\"bold\">5  INSPECT RESULTS</text><text x=\"24\" y=\"273.8\" font-size=\"8.0\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">Structure = columns; Browse = stored rows</text><path d=\"M180 282 L180 294\" fill=\"none\" stroke=\"#222\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polygon points=\"180.0,294.0 183.5,287.0 176.5,287.0\" fill=\"#222\"/><rect x=\"12\" y=\"294\" width=\"336\" height=\"38\" rx=\"7\" fill=\"#FFF1DE\" stroke=\"#E07B00\" stroke-width=\"1.2\"/><text x=\"24\" y=\"308.9\" font-size=\"8.4\" text-anchor=\"start\" fill=\"#E07B00\" font-weight=\"bold\">6  EXPORT BEFORE DESTRUCTIVE WORK</text><text x=\"24\" y=\"323.8\" font-size=\"8.0\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">Back up first; DROP only the scratch schema</text><rect x=\"12\" y=\"350\" width=\"336\" height=\"55\" rx=\"7\" fill=\"#E3F0FC\" stroke=\"#1565C0\" stroke-width=\"1.1\"/><text x=\"20\" y=\"368.1\" font-size=\"8.9\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">SQL executes on the database server; the GUI</text><text x=\"20\" y=\"383.1\" font-size=\"8.9\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">helps manage it. Screens differ by version.</text><text x=\"20\" y=\"398.1\" font-size=\"8.9\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">Never expose a root/blank-password admin UI.</text></svg>", "wd5_table_design": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 378\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"378\" fill=\"#ffffff\"/><text x=\"180\" y=\"23.1\" font-size=\"14.5\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">Table Design: Types, Keys and Rules</text><rect x=\"12\" y=\"44\" width=\"80\" height=\"25\" rx=\"0\" fill=\"#7B2CD9\" stroke=\"#C9B3EC\" stroke-width=\"1\"/><text x=\"52.0\" y=\"59.1\" font-size=\"7.5\
