<script>
const U = {"subject": "DI04007011", "unit": 5, "format": "notes", "title": {"en": "Database Connectivity using MySQLi"}, "weightage": 30, "hours": 16, "notes": [{"title": {"en": "5.1 Database Connectivity and MySQLi"}, "items": [{"h": {"en": "What Database Connectivity Does"}, "body": {"en": "\n<p>A dynamic application needs durable, structured data shared by different requests and users. PHP connects to a database server, sends SQL, reads rows/results, and renders an HTML response. A text file can store feedback, but a relational database adds keys, constraints, efficient queries and controlled concurrent updates.</p>\n<ul><li><b>MySQL</b> is a database server; <b>MariaDB</b> is a MySQL-compatible server used by these real executions. <b>MySQLi</b> (MySQL Improved) is PHP's client extension/API; it is not another database server.</li>\n<li><b>phpMyAdmin</b> is a PHP web administration interface for managing databases. It is neither MySQL itself nor the connection library used by your own application.</li>\n<li>The request path is browser &rarr; PHP validation/application logic &rarr; MySQLi &rarr; database &rarr; result handling &rarr; HTML response. Do not connect browser JavaScript directly to the database with a privileged password.</li>\n<li>Credentials, SQL and data rules belong on the server. A successful form submission must actually write to the database; a success message alone is not evidence.</li>\n<li>All Unit 5 program outputs come from PHP 8.4 using mysqlnd/MySQLi and an actual MariaDB server. Each test uses a fresh private database/user; no SQLite emulation or manually invented result rows are used.</li></ul>\n"}, "diagram": "wd5_stack"}, {"h": {"en": "Connecting, Character Sets and the Two MySQLi Styles"}, "body": {"en": "\n<table><tr><th>Operation</th><th>Object-oriented</th><th>Procedural equivalent</th></tr>\n<tr><td>Connect</td><td>new mysqli(...)</td><td>mysqli_connect(...)</td></tr>\n<tr><td>Set charset</td><td>$db-&gt;set_charset('utf8mb4')</td><td>mysqli_set_charset($db, 'utf8mb4')</td></tr>\n<tr><td>Query</td><td>$db-&gt;query($sql)</td><td>mysqli_query($db, $sql)</td></tr>\n<tr><td>Fetch</td><td>$result-&gt;fetch_assoc()</td><td>mysqli_fetch_assoc($result)</td></tr>\n<tr><td>Close</td><td>$db-&gt;close()</td><td>mysqli_close($db)</td></tr></table>\n<pre class=\"c\">&lt;?php\nmysqli_report(MYSQLI_REPORT_ERROR | MYSQLI_REPORT_STRICT);\n$db = new mysqli(\n    \"localhost\", \"busbook_app\",\n    getenv(\"DB_PASS\"), \"busbook\"\n);\n$db-&gt;set_charset(\"utf8mb4\");\n// Check configuration and catch failures safely.</pre>\n<ul><li>Connection arguments identify host, account, password and database; optional port/socket parameters support other local/server configurations. <code>localhost</code> may use a Unix socket; <code>127.0.0.1</code> normally selects TCP.</li>\n<li>Explicit <code>mysqli_report(MYSQLI_REPORT_ERROR | MYSQLI_REPORT_STRICT)</code> gives consistent exception-based error handling. Modern PHP commonly enables strict reporting by default, but reference code should make its expectation clear.</li>\n<li><code>set_charset('utf8mb4')</code> configures the connection for full Unicode; also create the database/tables with an appropriate charset. A browser's UTF-8 meta tag alone does not configure a database connection.</li>\n<li>The complete db.php reads environment settings and handles connection failures safely. For local setup, create the database/account as admin, import each schema as admin, then run the app with the less-privileged account.</li>\n<li>Classroom fallback credentials are deliberately labelled local-only. For production, choose unique secrets in private server configuration; never publish root credentials, connection dumps or a password-bearing config download.</li></ul>\n<pre class=\"c\">-- Run once using an ADMIN account in phpMyAdmin.\nCREATE DATABASE busbook\n  CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;\nCREATE USER 'busbook_app'@'localhost'\n  IDENTIFIED BY 'change-this-lab-password';\nGRANT SELECT, INSERT, UPDATE, DELETE\n  ON busbook.* TO 'busbook_app'@'localhost';\n-- This sample password is for a LOCAL lab only.\n-- Production: unique secrets, not committed files.</pre>\n"}, "diagram": "wd5_connection", "programs": ["wd5p1"]}]}, {"title": {"en": "5.2 phpMyAdmin and Database Structure (Practical 19)"}, "items": [{"h": {"en": "phpMyAdmin: Create, Inspect, Run SQL, Export and Delete"}, "body": {"en": "\n<ol><li>Start the local web/PHP and database services in XAMPP/WAMP/LAMP. Open <code>http://localhost/phpmyadmin</code> where that stack provides it; authenticate with the appropriate local admin account.</li>\n<li>Use <b>New / Databases</b> to create a disposable schema with utf8mb4. Select the database in the navigation tree before creating its tables.</li>\n<li><b>Structure</b> shows columns, types, indexes and constraints. <b>Browse</b> shows stored rows. <b>SQL</b> executes entered SQL and displays result/error feedback; menu details vary by version.</li>\n<li><b>Import</b> loads a schema/data SQL file; <b>Export</b> creates a backup. Export before destructive work, and verify you can restore it.</li>\n<li>DROP only the intended scratch database/table. Confirm its name before accepting a destructive action. The SQL lab below intentionally deletes its own disposable schema.</li></ol>\n<pre class=\"c\">-- Disposable schema: never use a real project's name.\nCREATE DATABASE busbook_scratch CHARACTER SET utf8mb4;\nUSE busbook_scratch;\nCREATE TABLE books (\n  id INT PRIMARY KEY AUTO_INCREMENT,\n  title VARCHAR(80) NOT NULL\n);\nALTER TABLE books ADD qty INT NOT NULL DEFAULT 0;\nINSERT INTO books(title,qty) VALUES ('PHP Guide',3);\nSELECT id,title,qty FROM books;\nUPDATE books SET qty=4 WHERE id=1;\nDELETE FROM books WHERE id=1;\nALTER TABLE books DROP COLUMN qty;\nDROP TABLE books;\nDROP DATABASE busbook_scratch;</pre>\n<ul><li>The matching PHP program executes these kinds of SQL statements and checks metadata after ALTER/DROP; it does not pretend that the phpMyAdmin GUI itself was automated.</li>\n<li>CREATE/DROP DATABASE and schema alteration require suitable privileges. An ordinary runtime account with only SELECT/INSERT/UPDATE/DELETE should not administer schemas.</li>\n<li>To run the PHP scratch lab with the default account, an admin may grant <code>CREATE, ALTER, DROP, SELECT ON busbook_scratch.*</code> to that local lab account; remove administrative privileges when no longer needed.</li>\n<li>Never expose an unprotected phpMyAdmin/root account on the public internet. Use the host's controlled admin access, strong credentials and suitable access restrictions.</li></ul>\n"}, "diagram": "wd5_phpmyadmin", "programs": ["wd5p2"]}, {"h": {"en": "Designing Tables: Types, Keys, Constraints and DDL"}, "body": {"en": "\n<pre class=\"c\">CREATE TABLE students (\n  id INT PRIMARY KEY AUTO_INCREMENT,\n  name VARCHAR(80) NOT NULL,\n  email VARCHAR(120) NOT NULL UNIQUE,\n  city VARCHAR(40) NOT NULL,\n  marks INT NOT NULL CHECK (marks BETWEEN 0 AND 100)\n) ENGINE=InnoDB;</pre>\n<ul><li><b>INT</b> stores whole numbers; <b>VARCHAR(n)</b> stores bounded text; <b>TEXT</b> stores longer post bodies; <b>DECIMAL(10,2)</b> stores exact fixed-point prices; <b>TIMESTAMP</b> can record creation time. Do not use binary FLOAT for exact money calculations.</li>\n<li>A <b>PRIMARY KEY</b> uniquely identifies each row and cannot be null. <b>AUTO_INCREMENT</b> generates a new numeric ID; IDs are identifiers, not guaranteed gap-free row counts.</li>\n<li><b>NOT NULL</b>, <b>UNIQUE</b> and <b>CHECK</b> enforce server-side rules. Test the target server version's support; these lesson constraints are actually executed on the test server.</li>\n<li>A <b>FOREIGN KEY</b> links related rows, e.g. movements.stock_id to stock.id. Decide deletion/update behaviour deliberately rather than silently orphaning dependent rows.</li>\n<li><b>CREATE TABLE</b> defines structure; <b>ALTER TABLE</b> adds/changes/removes columns or keys; <b>DROP TABLE</b> removes structure and rows. <b>DELETE FROM ... WHERE ...</b> removes selected data, not the table.</li>\n<li>Constraints complement validation: validate for clear user feedback, then let database rules protect consistency when requests race or another client writes data.</li></ul>\n"}, "diagram": "wd5_table_design"}]}, {"title": {"en": "5.3 Queries, Prepared Statements and CRUD"}, "items": [{"h": {"en": "Executing SELECT and Processing Result Sets"}, "body": {"en": "\n<pre class=\"c\">&lt;?php\n$r = $db-&gt;query(\"SELECT id,name FROM students ORDER BY id\");\necho $r-&gt;num_rows;\nwhile ($row = $r-&gt;fetch_assoc()) {\n    echo htmlspecialchars($row[\"name\"]);\n}\n$r-&gt;free();</pre>\n<ul><li><code>query()</code> with a successful SELECT returns a <code>mysqli_result</code>. A successful INSERT/UPDATE/DELETE through query returns true rather than a row set. With strict reporting, failures throw mysqli_sql_exception.</li>\n<li><code>num_rows</code> counts rows in a buffered result. <code>fetch_assoc()</code> returns the next row keyed by column names; null marks exhaustion. <code>fetch_all(MYSQLI_ASSOC)</code> reads all remaining rows as an array.</li>\n<li>Use explicit columns and stable <code>ORDER BY</code> when order matters. Do not assume rows arrive in insertion order just because a small test happened to do so.</li>\n<li><code>free()</code> releases the result; close statements/connections when their work is finished. PHP also cleans up request-bound resources, but explicit lifecycle knowledge matters for long-running work.</li>\n<li>The procedural program selects two Surat students from a genuine seeded table. Hard-coded constant SQL is safe from value interpolation; any submitted search/filter value should instead be bound.</li>\n<li>Values stored in a database are not automatically safe HTML. Escape output even if the original source was a trusted-looking form.</li></ul>\n"}, "programs": ["wd5p3"]}, {"h": {"en": "prepare, bind_param, execute and Fetching Prepared Results"}, "body": {"en": "\n<pre class=\"c\">&lt;?php\n$s = $db-&gt;prepare(\n    \"INSERT INTO students(name,email,city,marks) VALUES (?,?,?,?)\"\n);\n$name = \"Diya\";\n$email = \"diya@example.test\";\n$city = \"Surat\";\n$marks = 88;\n$s-&gt;bind_param(\"sssi\", $name, $email, $city, $marks);\n$s-&gt;execute();\necho $db-&gt;insert_id;\n$s-&gt;close();</pre>\n<ol><li><b>Prepare</b> the SQL template with unquoted <code>?</code> placeholders in value positions.</li>\n<li><b>Bind</b> variables in placeholder order. Type letters are <code>i</code> integer, <code>d</code> double, <code>s</code> string and <code>b</code> blob. Count and order must match.</li>\n<li><b>Execute</b> using the current bound variable values. bind_param binds by reference; use variables, not temporary literal expressions.</li>\n<li><b>Inspect:</b> INSERT can supply <code>$db-&gt;insert_id</code>; writes expose <code>$stmt-&gt;affected_rows</code>; SELECT can use <code>get_result()</code> then fetch rows.</li>\n<li><b>Reuse/close:</b> assign new variable values and execute again if appropriate; close the statement after its work.</li></ol>\n<ul><li><code>get_result()</code> requires mysqlnd support. Where unavailable, use <code>bind_result($id, $name)</code> followed by <code>fetch()</code> instead. The supplied runtime includes mysqlnd.</li>\n<li>The INSERT program actually stores Diya and O'Neil, then demonstrates the UNIQUE email constraint rejecting a duplicate. The successful row count remains two; a rejected insert may still consume an auto-increment value.</li>\n<li>For exact money, validate a decimal string and store it in DECIMAL; the inventory program binds that decimal string as <code>s</code>, avoiding application-side binary floating-point arithmetic.</li></ul>\n"}, "diagram": "wd5_prepared", "programs": ["wd5p4"]}, {"h": {"en": "CRUD: Create, Read, Update and Delete Safely"}, "body": {"en": "\n<table><tr><th>CRUD</th><th>SQL pattern</th><th>Typical form behaviour</th></tr>\n<tr><td>Create</td><td>INSERT INTO posts(title,body) VALUES (?,?)</td><td>Validated POST, obtain new ID, redirect</td></tr>\n<tr><td>Read</td><td>SELECT ... WHERE id=?</td><td>GET listing/detail/search; fetch results</td></tr>\n<tr><td>Update</td><td>UPDATE posts SET title=? WHERE id=?</td><td>Load edit form by GET; save by POST</td></tr>\n<tr><td>Delete</td><td>DELETE FROM posts WHERE id=?</td><td>Explicit CSRF-protected POST; never a deleting GET link</td></tr></table>\n<ul><li>Validate record IDs as positive integers and check existence where needed. Casting arbitrary input to int is not a substitute for meaningful validation.</li>\n<li><b>WHERE is critical:</b> without it, UPDATE/DELETE may alter every row. A prepared statement without the intended WHERE is still logically dangerous.</li>\n<li><code>affected_rows</code> is evidence of the last write, not a SELECT count. With default client flags, UPDATE can return zero both for a missing row and for an unchanged value. Check existence separately if the UI must distinguish those cases.</li>\n<li>On successful writes, use <b>Post/Redirect/Get</b>: send a 303 Location response and exit. The fresh GET lists committed state and reduces refresh resubmission.</li>\n<li>POST/CSRF prevents some forged or unintended requests; it does not grant permission to edit someone else's data. Add ownership/role checks for a real multi-user application.</li></ul>\n"}, "diagram": "wd5_crud", "programs": ["wd5p5"]}, {"h": {"en": "Preventing SQL Injection: Values Are Not SQL Syntax"}, "body": {"en": "\n<p>SQL injection occurs when untrusted input is concatenated into SQL and changes the query's structure. A value like <code>missing' OR '1'='1</code> can turn a supposed exact lookup into an always-true predicate.</p>\n<pre class=\"c\">&lt;?php\n$s = $db-&gt;prepare(\"SELECT id,name FROM contacts WHERE name=?\");\n$name = $_GET[\"name\"] ?? \"\";\nif (!is_string($name)) {\n    http_response_code(400);\n    exit(\"Invalid name.\");\n}\n$s-&gt;bind_param(\"s\", $name);\n$s-&gt;execute();\n$rows = $s-&gt;get_result()-&gt;fetch_all(MYSQLI_ASSOC);</pre>\n<ul><li><b>Prepared statements</b> keep SQL structure separate from parameter data. The server treats an apostrophe or OR expression in a bound value as data, not as newly supplied SQL syntax.</li>\n<li>Do not quote the placeholder itself: use <code>WHERE name=?</code>, not a quoted question mark. Do not concatenate a submitted value elsewhere in the same query and assume the prepared part protects it.</li>\n<li><code>?</code> cannot stand for a table name, column name, ASC/DESC keyword or arbitrary SQL clause. Map submitted options through a small allowlist of trusted identifiers/fragments.</li>\n<li><code>htmlspecialchars</code> protects HTML output, not SQL. <code>addslashes</code> is not the preferred SQL defence. Even proper SQL escaping requires correct connection encoding and is more error-prone than parameterising values.</li>\n<li>A bound LIKE value can still contain legitimate LIKE wildcards such as %. That affects search semantics, not SQL structure; escape wildcards separately if the requirement is literal substring matching.</li>\n<li>The isolated read-only anti-example returns all three seed contacts; the prepared probe returns zero, and a genuine O'Neil lookup returns one. The unsafe query is labelled a lab anti-example and is absent from all four web apps.</li></ul>\n"}, "diagram": "wd5_injection", "programs": ["wd5p6"]}]}, {"title": {"en": "5.4 Error Handling, Consistency and Application Security"}, "items": [{"h": {"en": "Database Exceptions, Transactions, Commit and Rollback"}, "body": {"en": "\n<ul><li>Use strict MySQLi reporting and catch <code>mysqli_sql_exception</code> where a known condition needs a specific response. For example, duplicate key error 1062 can become a clear validation message; unrelated failures should still be logged/handled rather than silently ignored.</li>\n<li>A transaction groups related writes: <code>begin_transaction()</code> &rarr; operations &rarr; <code>commit()</code> on complete success; <code>rollback()</code> on failure. Use transactional tables such as <b>InnoDB</b>.</li>\n<li>Stock change + movement log is a useful example: either decrement the quantity and record the movement, or keep neither change. A failure between independent autocommitted writes otherwise leaves inconsistent data.</li>\n<li>A conditional statement such as <code>UPDATE stock SET qty=qty-? WHERE id=? AND qty&gt;=?</code> checks availability in the write itself. A separate read-then-update without adequate locking can race with another request.</li>\n<li>The program commits a sale of 2 from 5, rejects a later sale of 9, and verifies the remaining quantity (3) and movement rows (1). Validate positive quantities before processing any stock request.</li>\n<li>CREATE/ALTER/DROP can cause <b>implicit commits</b>; do not assume DDL will roll back like normal InnoDB row changes. Transactions also do not magically undo external email or other non-database side effects.</li>\n<li>Keep detailed errors in restricted server logs, not in public HTML. Free result resources and close statements when finished; roll back any pending transaction before propagating an unexpected failure.</li></ul>\n"}, "diagram": "wd5_transaction", "programs": ["wd5p7"]}, {"h": {"en": "Validation, Escaping, CSRF and Authorisation Are Separate Jobs"}, "body": {"en": "\n<table><tr><th>Boundary</th><th>Required control</th></tr>\n<tr><td>Input shape/business rules</td><td>Validate IDs, lengths, email, non-negative integer stock, permitted actions and decimal prices.</td></tr>\n<tr><td>SQL execution</td><td>Bind values; allowlist structural options; use a least-privileged database account.</td></tr>\n<tr><td>HTML output</td><td>Escape database/form values with htmlspecialchars, including attributes and textarea content.</td></tr>\n<tr><td>State-changing HTTP request</td><td>POST + a server-checked session CSRF token + Post/Redirect/Get after success.</td></tr>\n<tr><td>Access to private data</td><td>Authenticate and authorise every applicable request; a CSRF token is not a login.</td></tr>\n<tr><td>Deployment/configuration</td><td>HTTPS, secure session cookies, private secrets, safe public errors, updates and backups.</td></tr></table>\n<ul><li>A row read back from the database can contain a stored XSS payload. For a post body use <code>nl2br(htmlspecialchars($body))</code>, not raw HTML rendering.</li>\n<li>Hidden fields and dropdowns are editable by a client. Check every posted ID/action and re-check permissions on the server.</li>\n<li>All project writes use CSRF-protected POSTs. Blog, Contacts and To-Do are intentionally local, single-user/admin labs; add the Unit 4 access guard and record-level permissions before public or multi-user use.</li>\n<li>Inventory includes its own login gate and has no default admin password: ADMIN_HASH must be configured. Its successful login rotates the session ID/token; full logout revokes access.</li></ul>\n"}}]}, {"title": {"en": "5.5 Complete Database Applications (Practicals 20-23)"}, "items": [{"h": {"en": "Blog Application: Complete Create, Read, Update and Delete (Practical 20)"}, "body": {"en": "\n<pre class=\"c\">CREATE TABLE posts (\n  id INT PRIMARY KEY AUTO_INCREMENT,\n  title VARCHAR(100) NOT NULL,\n  body TEXT NOT NULL,\n  created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP\n) ENGINE=InnoDB;</pre>\n<ul><li><b>Create:</b> a POST supplies title/body; validate title 1-100 and body 1-5000 bytes in this reference, execute a prepared INSERT, then redirect.</li>\n<li><b>Read:</b> list posts in stable ID order and search titles with a bound LIKE value. All displayed titles/bodies are escaped; newline formatting is applied only after escaping.</li>\n<li><b>Update:</b> a GET edit ID loads the existing row into a sticky form; POST validates both input and row existence before a prepared UPDATE.</li>\n<li><b>Delete:</b> the per-post form sends a positive ID, action and CSRF token by POST. Delete one matching primary key, then redirect to the updated list.</li>\n<li><b>Files:</b> index.php, db.php, web.php, plus the one-time schema SQL. The full code card shows each PHP file; save sections separately.</li>\n<li><b>Verify:</b> create BusBook Begins, edit it to Weekend Route Update, search Weekend, then delete it. The genuine transcript ends with <code>Posts: 0</code>.</li>\n<li>Lengths in these compact references use strlen (byte length); use mb_strlen plus a consistent validation policy when character-count rules for multilingual text are required.</li></ul>\n"}, "programs": ["wd5p8"]}, {"h": {"en": "MVC + OOP Contact Management (Practical 21)"}, "body": {"en": "\n<p><b>MVC</b> separates responsibilities so changes to HTML do not force changes to SQL. It is an organisation pattern, not a framework you must install.</p>\n<pre class=\"c\">index.php                 front controller / wiring\ndb.php                    connection and charset\nweb.php                   CSRF, validation, HTML helpers\napp/Contact.php           MODEL: prepared SQL only\napp/ContactController.php CONTROLLER: request handling\nviews/contacts.php        VIEW: escaped HTML only\nschema.sql                one-time admin import</pre>\n<pre class=\"c\">CREATE TABLE contacts (\n  id INT PRIMARY KEY AUTO_INCREMENT,\n  name VARCHAR(80) NOT NULL,\n  email VARCHAR(120) NOT NULL\n) ENGINE=InnoDB;</pre>\n<ul><li><b>Model (Contact):</b> owns prepared database operations: search, find, save and delete. It knows table structure but does not read $_POST or emit HTML.</li>\n<li><b>Controller (ContactController):</b> reads the request, validates name/email/ID, checks CSRF, chooses the model operation, redirects after writes, and passes data to the view.</li>\n<li><b>View:</b> renders forms and contact rows using escaped values. It does not open connections or run SQL.</li>\n<li><b>Front controller:</b> index.php creates the dependencies and calls handle. Constructors receive a connection/model, illustrating a simple OOP design without hidden global dependencies inside the classes.</li>\n<li>All four requirements are implemented: <b>add, search, update, delete</b>. Name and email search values and every write ID/value are bound parameters.</li>\n<li>Test O'Neil as legitimate data and an injection-shaped search as literal input. Correct handling is one matching contact for the real name and no broad data disclosure for the probe.</li></ul>\n"}, "diagram": "wd5_mvc", "programs": ["wd5p9"]}, {"h": {"en": "AI-Assisted To-Do Development and Review (Practical 22)"}, "body": {"en": "\n<p>The practical asks for a PHP To-Do application with the help of an AI code-generation tool. The reference here is generated for this lesson, reviewed and really executed; it does not claim that a separate external AI service was used.</p>\n<pre class=\"c\">CREATE TABLE todos (\n  id INT PRIMARY KEY AUTO_INCREMENT,\n  title VARCHAR(150) NOT NULL,\n  done TINYINT NOT NULL DEFAULT 0 CHECK (done IN (0,1))\n) ENGINE=InnoDB;</pre>\n<p><b>Example requirement prompt:</b></p>\n<pre class=\"c\">Build a small PHP 8/MySQLi To-Do app.\nRequirements: add, list, edit, toggle done, delete,\nand filter all/pending/done. Use a todos table.\nUse prepared values, strict ID validation, server-side\nvalidation, escaped HTML, POST + CSRF for writes,\nand Post/Redirect/Get. Separate connection secrets.\nProvide schema.sql and a test matrix. Do not use\nproduction credentials or claim unrun tests passed.</pre>\n<ol><li><b>Specify:</b> list features, table fields, PHP/MySQLi requirement, safety rules and acceptance tests before requesting code. Do not provide real production credentials.</li>\n<li><b>Inspect:</b> explain each query and request branch. Replace concatenated values, deleting GET links, raw HTML echoes and unchecked IDs; ensure server-side validation exists.</li>\n<li><b>Run:</b> import a fresh schema, configure the connection, open through a PHP server, then test create/edit/toggle/filter/delete against actual stored rows.</li>\n<li><b>Challenge:</b> submit a blank title, forged token, missing ID and unrecognised filter. The reference rejects them and keeps valid state.</li>\n<li><b>Document:</b> retain the prompt, original response, your corrections, screenshots and the observed test results. Be able to explain the code rather than merely copying generated output.</li></ol>\n<ul><li>The implementation uses a boolean-like done field constrained to 0/1. Toggle updates one ID; all/pending/done filters map to fixed allowlisted SQL fragments.</li>\n<li>Human review and real execution are necessary even when generated code looks plausible. Never record a test as passed without actually running it.</li></ul>\n"}, "programs": ["wd5p10"]}, {"h": {"en": "Inventory Management: CRUD, Login and Stock Integrity (Practical 23)"}, "body": {"en": "\n<pre class=\"c\">CREATE TABLE products (\n  id INT PRIMARY KEY AUTO_INCREMENT,\n  sku VARCHAR(30) NOT NULL UNIQUE,\n  name VARCHAR(80) NOT NULL,\n  qty INT NOT NULL DEFAULT 0 CHECK (qty BETWEEN 0 AND 1000000),\n  price DECIMAL(10,2) NOT NULL CHECK (price &gt;= 0)\n) ENGINE=InnoDB;</pre>\n<ul><li><b>Products:</b> unique SKU, name, integer quantity and DECIMAL price. Create/update validate every field; list/edit/delete target explicit IDs.</li>\n<li><b>Stock operations:</b> sell/restock use positive integers and conditional UPDATEs. Overselling returns 409 without decreasing quantity; restocking also enforces the maximum quantity. Quantity at or below 3 shows a low-stock alert.</li>\n<li><b>Authentication:</b> auth.php refuses operation unless ADMIN_HASH is configured. Login uses password_verify; successful authentication rotates the session ID/token. Anonymous requests see login, not product records.</li>\n<li><b>Writes:</b> CSRF-protected POSTs and prepared values; duplicate SKU becomes a user-facing validation error instead of a raw database message.</li>\n<li><b>Money:</b> validated decimal strings are bound as strings into DECIMAL. This avoids relying on binary floating-point calculations for the displayed price.</li>\n<li><b>Local proof:</b> add USB Cable at qty 5, update to 8, sell 6 (qty 2), reject an oversell, restock 3 (qty 5), delete and log out. Test credentials in the transcript are only disposable lab credentials.</li>\n<li><b>Hosting is a separate step:</b> the reference has been locally executed, not externally deployed as a live inventory service. Follow the next section to carry out the hosting part on your own PHP-capable account.</li></ul>\n<pre class=\"c\"># Choose your OWN password; do not reuse the test password.\n# Run PHP locally and type your chosen password + Enter.\n# Copy the hash to private ADMIN_HASH configuration,\n# never to a public page:\nphp -r 'echo password_hash(rtrim(fgets(STDIN), \"\\r\\n\"), PASSWORD_DEFAULT), PHP_EOL;'\n# DB_HOST, DB_NAME, DB_USER, DB_PASS and ADMIN_HASH are\n# server-side configuration. Plain PHP does not automatically\n# read a .env file; configure the server/hosting environment.</pre>\n"}, "programs": ["wd5p11"]}]}, {"title": {"en": "5.6 Hosting and Practical Verification"}, "items": [{"h": {"en": "Hosting the Inventory Application: Deployment Checklist"}, "body": {"en": "\n<ol><li><b>Choose an appropriate host:</b> supported PHP with mysqli/mysqlnd, a MySQL-compatible database and HTTPS. Static-file hosting, including GitHub Pages, cannot execute PHP or run this database application.</li>\n<li><b>Back up:</b> export schema/data with phpMyAdmin or an appropriate dump tool; retain a restorable local copy. Practise import before changing the deployed database.</li>\n<li><b>Create database/account:</b> import schema using an administrative account, then give the runtime application only the SELECT/INSERT/UPDATE/DELETE privileges it needs on that database.</li>\n<li><b>Configure secrets privately:</b> set DB_HOST, DB_NAME, DB_USER, DB_PASS and a unique ADMIN_HASH using the hosting/server's environment mechanism. PHP does not automatically load .env. Never place real passwords in a public repository, downloadable SQL backup or source-view endpoint.</li>\n<li><b>Upload files:</b> transfer the required PHP files and confirm paths/case sensitivity. Keep admin-only imports/backups and private configuration outside the public document root where possible.</li>\n<li><b>Enforce HTTPS:</b> make sure the server correctly recognises HTTPS and sends Secure/HttpOnly/SameSite session cookies. Behind a TLS proxy, configure this according to the trusted deployment rather than trusting an arbitrary client-supplied header.</li>\n<li><b>Safe error policy:</b> disable public debug/stack-trace output, log details to restricted server logs and test the friendly failure path with a temporary bad configuration.</li>\n<li><b>Remote smoke test:</b> guest blocked, login succeeds with your own password, CRUD persists after reload, duplicate/negative values fail, oversell does not alter stock, CSRF fails safely and logout revokes direct access.</li>\n<li><b>Maintain:</b> keep PHP/server dependencies updated, rotate credentials when needed, monitor access/errors and regularly test backup restoration.</li></ol>\n<p>The lesson's publication makes the <b>study material</b> available in the app. It is not a claim that the inventory PHP/database project itself has been hosted on an external service.</p>\n"}, "diagram": "wd5_deploy"}, {"h": {"en": "Acceptance Test Matrix for Practicals 19-23"}, "body": {"en": "\n<table><tr><th>Test</th><th>Expected evidence</th></tr>\n<tr><td>Connect + UTF-8</td><td>Actual query returns 5; utf8mb4 and a Unicode round trip work.</td></tr>\n<tr><td>DDL scratch lab</td><td>Columns change after ALTER; deleted scratch schema is absent from metadata.</td></tr>\n<tr><td>Prepared CRUD</td><td>New ID, real changed rows, intended deletion and remaining records verified.</td></tr>\n<tr><td>Apostrophe/injection</td><td>O'Neil works; injection-shaped bound input does not broaden results.</td></tr>\n<tr><td>Blog</td><td>Create/edit/search/delete, escaped stored HTML, blank/missing-ID/CSRF rejection.</td></tr>\n<tr><td>MVC Contacts</td><td>Add/search/update/delete with controller/model/view separation and literal search data.</td></tr>\n<tr><td>To-Do</td><td>Persist title, edit, toggle, filter done/pending, delete; invalid filter is rejected.</td></tr>\n<tr><td>Inventory gate</td><td>Anonymous and wrong-password requests cannot read/alter stock; logout removes access.</td></tr>\n<tr><td>Inventory rules</td><td>Negative/fractional stock, excess decimals, duplicate SKU and oversell are rejected.</td></tr>\n<tr><td>Transaction failure</td><td>No partial stock/log update; committed count and final quantity match.</td></tr>\n<tr><td>Request safety</td><td>GET cannot delete; forged CSRF and malformed IDs do not mutate rows.</td></tr>\n<tr><td>Hosted environment</td><td>Own remote smoke-test evidence, HTTPS configuration and restorable backup, not merely a local success message.</td></tr></table>\n<ul><li>Use a fresh disposable database for repeatable tests. A listing screenshot alone may hide a failed write; query the stored state or reload independently.</li>\n<li>Record expected and observed results separately. The unit's local database tests and app-render checks are distinct from a student's future hosting verification.</li>\n<li>Practicals 19-23 together cover administration, CRUD, MVC/OOP, SQL-injection prevention, AI-assisted review and deployment discipline.</li></ul>\n"}}]}], "programs": [{"id": "wd5p1", "title": {"en": "Connect to a database with MySQLi and utf8mb4"}, "code": {"en": "<?php\n// ===== File: connect.php =====\nrequire __DIR__ . \"/db.php\";\nheader(\"Content-Type: text/plain; charset=UTF-8\");\necho \"Connection established.\\n\";\necho \"Server: \", $db->server_info, \"\\n\";\necho \"Character set: \", $db->character_set_name(), \"\\n\";\n$r = $db->query(\"SELECT 2 + 3 AS answer\");\necho \"Query answer: \", $r->fetch_assoc()[\"answer\"], \"\\n\";\n$r->free();\n$db->close();\necho \"Connection closed.\\n\";\n\n<?php\n// ===== File: db.php =====\nmysqli_report(MYSQLI_REPORT_ERROR | MYSQLI_REPORT_STRICT);\n$host = getenv(\"DB_HOST\") ?: \"localhost\";\n$user = getenv(\"DB_USER\") ?: \"busbook_app\";\n$pass = getenv(\"DB_PASS\");\nif ($pass === false) {\n    $pass = \"change-this-lab-password\";\n}\n$name = getenv(\"DB_NAME\") ?: \"busbook\";\n$socket = getenv(\"DB_SOCKET\") ?: null;\ntry {\n    $db = new mysqli($host, $user, $pass, $name, 3306, $socket);\n    $db->set_charset(\"utf8mb4\");\n} catch (mysqli_sql_exception $e) {\n    error_log($e->getMessage());\n    http_response_code(500);\n    exit(\"Database unavailable. Check server configuration.\");\n}"}, "out": "$ curl 'http://localhost/connect.php'\nConnection established.\nServer: 11.8.6-MariaDB-0+deb13u1 from Debian\nCharacter set: utf8mb4\nQuery answer: 5\nConnection closed.", "expl": {"en": "<p>db.php enables strict MySQLi reporting, connects, selects the database and sets <code>utf8mb4</code>. The main page executes a constant SELECT, fetches one associative row, frees the result and closes the connection. Errors are logged server-side; the browser receives a generic configuration message rather than credentials or a stack trace. The server version in the genuine output identifies MariaDB (MySQL-compatible); MySQLi is PHP's client API, not the server's name.</p><p>Save each labelled PHP section as a separate file. db.php reads DB_HOST, DB_USER, DB_PASS and DB_NAME from the environment; its classroom defaults require the lab account described in the notes. DB_SOCKET is optional and used only by the isolated test harness. The output is actual HTTP/HTML source from PHP 8.4 with a real MariaDB server through MySQLi; the browser renders the forms. These temporary test databases are deleted afterwards.</p>"}}, {"id": "wd5p2", "title": {"en": "Database and table lifecycle: phpMyAdmin SQL lab (Practical 19)"}, "code": {"en": "<?php\n// ===== File: schema_lab.php =====\nrequire __DIR__ . \"/db.php\";\nheader(\"Content-Type: text/plain; charset=UTF-8\");\n// Disposable database, never a real application's database.\n$scratch = $name . \"_scratch\";\nif (!preg_match('/^[A-Za-z0-9_]+$/', $scratch)) {\n    exit(\"Invalid database identifier.\");\n}\n$db->query(\"CREATE DATABASE `$scratch` CHARACTER SET utf8mb4\");\necho \"Created scratch database.\\n\";\n$db->query(\"CREATE TABLE `$scratch`.books (\"\n    . \"id INT PRIMARY KEY, title VARCHAR(80) NOT NULL)\");\necho \"Created books table.\\n\";\n$db->query(\"ALTER TABLE `$scratch`.books ADD qty INT NOT NULL DEFAULT 0\");\n$r = $db->query(\"SHOW COLUMNS FROM `$scratch`.books\");\necho \"After ADD: \", implode(\", \", array_column($r->fetch_all(MYSQLI_ASSOC), \"Field\")), \"\\n\";\n$db->query(\"ALTER TABLE `$scratch`.books DROP COLUMN qty\");\n$r = $db->query(\"SHOW COLUMNS FROM `$scratch`.books\");\necho \"After DROP COLUMN: \", implode(\", \", array_column($r->fetch_all(MYSQLI_ASSOC), \"Field\")), \"\\n\";\n$db->query(\"DROP TABLE `$scratch`.books\");\necho \"Dropped books table.\\n\";\n$db->query(\"DROP DATABASE `$scratch`\");\n$s = $db->prepare(\"SELECT COUNT(*) AS n FROM information_schema.SCHEMATA WHERE SCHEMA_NAME=?\");\n$s->bind_param(\"s\", $scratch);\n$s->execute();\necho \"Scratch databases remaining: \", $s->get_result()->fetch_assoc()[\"n\"], \"\\n\";\n\n<?php\n// ===== File: db.php =====\nmysqli_report(MYSQLI_REPORT_ERROR | MYSQLI_REPORT_STRICT);\n$host = getenv(\"DB_HOST\") ?: \"localhost\";\n$user = getenv(\"DB_USER\") ?: \"busbook_app\";\n$pass = getenv(\"DB_PASS\");\nif ($pass === false) {\n    $pass = \"change-this-lab-password\";\n}\n$name = getenv(\"DB_NAME\") ?: \"busbook\";\n$socket = getenv(\"DB_SOCKET\") ?: null;\ntry {\n    $db = new mysqli($host, $user, $pass, $name, 3306, $socket);\n    $db->set_charset(\"utf8mb4\");\n} catch (mysqli_sql_exception $e) {\n    error_log($e->getMessage());\n    http_response_code(500);\n    exit(\"Database unavailable. Check server configuration.\");\n}"}, "out": "$ curl 'http://localhost/schema_lab.php'\nCreated scratch database.\nCreated books table.\nAfter ADD: id, title, qty\nAfter DROP COLUMN: id, title\nDropped books table.\nScratch databases remaining: 0", "expl": {"en": "<p>This executes the same CREATE/ALTER/DROP SQL used in phpMyAdmin's SQL tab. It verifies column lists before/after alteration and queries metadata after deletion. It does <b>not</b> claim to automate or screenshot phpMyAdmin's GUI. CREATE/DROP DATABASE requires suitable administrative privileges; the test account is granted rights only to its disposable lesson schemas. Identifiers cannot be bound with <code>?</code>: this generated database name is validated before quoting.</p><p>Save each labelled PHP section as a separate file. db.php reads DB_HOST, DB_USER, DB_PASS and DB_NAME from the environment; its classroom defaults require the lab account described in the notes. DB_SOCKET is optional and used only by the isolated test harness. The output is actual HTTP/HTML source from PHP 8.4 with a real MariaDB server through MySQLi; the browser renders the forms. These temporary test databases are deleted afterwards.</p>"}}, {"id": "wd5p3", "title": {"en": "Procedural MySQLi: SELECT, num_rows and fetch_assoc"}, "code": {"en": "<?php\n// ===== File: read_students.php =====\nrequire __DIR__ . \"/db.php\";\nheader(\"Content-Type: text/plain; charset=UTF-8\");\n// Constant query: no untrusted value is concatenated.\n$sql = \"SELECT id,name,marks FROM students WHERE city='Surat' ORDER BY id\";\n$result = mysqli_query($db, $sql);\necho \"Rows: \", mysqli_num_rows($result), \"\\n\";\nwhile ($row = mysqli_fetch_assoc($result)) {\n    echo $row[\"id\"], \" | \", $row[\"name\"], \" | \", $row[\"marks\"], \"\\n\";\n}\nmysqli_free_result($result);\nmysqli_close($db);\n\n<?php\n// ===== File: db.php =====\nmysqli_report(MYSQLI_REPORT_ERROR | MYSQLI_REPORT_STRICT);\n$host = getenv(\"DB_HOST\") ?: \"localhost\";\n$user = getenv(\"DB_USER\") ?: \"busbook_app\";\n$pass = getenv(\"DB_PASS\");\nif ($pass === false) {\n    $pass = \"change-this-lab-password\";\n}\n$name = getenv(\"DB_NAME\") ?: \"busbook\";\n$socket = getenv(\"DB_SOCKET\") ?: null;\ntry {\n    $db = new mysqli($host, $user, $pass, $name, 3306, $socket);\n    $db->set_charset(\"utf8mb4\");\n} catch (mysqli_sql_exception $e) {\n    error_log($e->getMessage());\n    http_response_code(500);\n    exit(\"Database unavailable. Check server configuration.\");\n}"}, "out": "$ curl 'http://localhost/read_students.php'\nRows: 2\n1 | Ravi Patel | 82\n3 | Mihir Desai | 75", "expl": {"en": "<p>The procedural functions operate on the same mysqli connection object used by the object-oriented API. SELECT returns a result set; <code>mysqli_num_rows</code> counts it and <code>mysqli_fetch_assoc</code> advances one row at a time. Never echo an unescaped database value into HTML; this demonstration deliberately sends <code>text/plain</code>. In a template use htmlspecialchars, because stored data can also contain unsafe markup.</p><p><b>One-time schema/seed setup:</b> select the lesson database in phpMyAdmin and run this SQL before opening the PHP page.</p><pre class=\"c\">CREATE TABLE students (\n  id INT PRIMARY KEY AUTO_INCREMENT,\n  name VARCHAR(80) NOT NULL,\n  email VARCHAR(120) NOT NULL UNIQUE,\n  city VARCHAR(40) NOT NULL,\n  marks INT NOT NULL CHECK (marks BETWEEN 0 AND 100)\n) ENGINE=InnoDB;\nINSERT INTO students(name,email,city,marks) VALUES\n('Ravi Patel','ravi@example.test','Surat',82),\n('Asha Shah','asha@example.test','Vadodara',91),\n('Mihir Desai','mihir@example.test','Surat',75);</pre><p>Save each labelled PHP section as a separate file. db.php reads DB_HOST, DB_USER, DB_PASS and DB_NAME from the environment; its classroom defaults require the lab account described in the notes. DB_SOCKET is optional and used only by the isolated test harness. The output is actual HTTP/HTML source from PHP 8.4 with a real MariaDB server through MySQLi; the browser renders the forms. These temporary test databases are deleted afterwards.</p>"}}, {"id": "wd5p4", "title": {"en": "Prepared INSERT, bind_param and insert_id"}, "code": {"en": "<?php\n// ===== File: insert_students.php =====\nrequire __DIR__ . \"/db.php\";\nheader(\"Content-Type: text/plain; charset=UTF-8\");\n$s = $db->prepare(\"INSERT INTO students(name,email,city,marks) VALUES (?,?,?,?)\");\n$studentName = \"Diya Shah\";\n$email = \"diya@example.test\";\n$city = \"Surat\";\n$marks = 88;\n$s->bind_param(\"sssi\", $studentName, $email, $city, $marks);\n$s->execute();\necho \"Inserted ID: \", $db->insert_id, \"; rows: \", $s->affected_rows, \"\\n\";\n// Same prepared statement, new variable values.\n$studentName = \"O'Neil\";\n$email = \"oneil@example.test\";\n$marks = 79;\n$s->execute();\necho \"Inserted ID: \", $db->insert_id, \"; rows: \", $s->affected_rows, \"\\n\";\ntry {\n    $s->execute();\n} catch (mysqli_sql_exception $e) {\n    if ($e->getCode() !== 1062) {\n        throw $e;\n    }\n    echo \"Duplicate email rejected (1062).\\n\";\n}\n$s->close();\n$r = $db->query(\"SELECT id,name,marks FROM students ORDER BY id\");\nforeach ($r->fetch_all(MYSQLI_ASSOC) as $row) {\n    echo $row[\"id\"], \" | \", $row[\"name\"], \" | \", $row[\"marks\"], \"\\n\";\n}\n\n<?php\n// ===== File: db.php =====\nmysqli_report(MYSQLI_REPORT_ERROR | MYSQLI_REPORT_STRICT);\n$host = getenv(\"DB_HOST\") ?: \"localhost\";\n$user = getenv(\"DB_USER\") ?: \"busbook_app\";\n$pass = getenv(\"DB_PASS\");\nif ($pass === false) {\n    $pass = \"change-this-lab-password\";\n}\n$name = getenv(\"DB_NAME\") ?: \"busbook\";\n$socket = getenv(\"DB_SOCKET\") ?: null;\ntry {\n    $db = new mysqli($host, $user, $pass, $name, 3306, $socket);\n    $db->set_charset(\"utf8mb4\");\n} catch (mysqli_sql_exception $e) {\n    error_log($e->getMessage());\n    http_response_code(500);\n    exit(\"Database unavailable. Check server configuration.\");\n}"}, "out": "$ curl 'http://localhost/insert_students.php'\nInserted ID: 1; rows: 1\nInserted ID: 2; rows: 1\nDuplicate email rejected (1062).\n1 | Diya Shah | 88\n2 | O'Neil | 79", "expl": {"en": "<p>The four placeholders have four bound variables and a four-letter type string: <code>sssi</code> = string, string, string, integer. Bound variables are references: changing their values then calling execute reuses the prepared statement. Apostrophes in O'Neil stay data. The UNIQUE email constraint rejects the intentional duplicate; only error 1062 is handled as that known case. Other database errors are not silently swallowed.</p><p><b>One-time schema/seed setup:</b> select the lesson database in phpMyAdmin and run this SQL before opening the PHP page.</p><pre class=\"c\">CREATE TABLE students (\n  id INT PRIMARY KEY AUTO_INCREMENT,\n  name VARCHAR(80) NOT NULL,\n  email VARCHAR(120) NOT NULL UNIQUE,\n  city VARCHAR(40) NOT NULL,\n  marks INT NOT NULL CHECK (marks BETWEEN 0 AND 100)\n) ENGINE=InnoDB;</pre><p>Save each labelled PHP section as a separate file. db.php reads DB_HOST, DB_USER, DB_PASS and DB_NAME from the environment; its classroom defaults require the lab account described in the notes. DB_SOCKET is optional and used only by the isolated test harness. The output is actual HTTP/HTML source from PHP 8.4 with a real MariaDB server through MySQLi; the browser renders the forms. These temporary test databases are deleted afterwards.</p>"}}, {"id": "wd5p5", "title": {"en": "Prepared UPDATE/DELETE with WHERE and affected_rows"}, "code": {"en": "<?php\n// ===== File: update_delete.php =====\nrequire __DIR__ . \"/db.php\";\nheader(\"Content-Type: text/plain; charset=UTF-8\");\n$s = $db->prepare(\"UPDATE students SET marks=? WHERE id=?\");\n$marks = 95;\n$id = 1;\n$s->bind_param(\"ii\", $marks, $id);\n$s->execute();\necho \"Updated matching row: \", $s->affected_rows, \"\\n\";\n$id = 999;\n$s->execute();\necho \"Updated missing ID: \", $s->affected_rows, \"\\n\";\n$s->close();\n$s = $db->prepare(\"DELETE FROM students WHERE id=?\");\n$id = 2;\n$s->bind_param(\"i\", $id);\n$s->execute();\necho \"Deleted rows: \", $s->affected_rows, \"\\n\";\n$s->close();\n$r = $db->query(\"SELECT id,name,marks FROM students ORDER BY id\");\nforeach ($r->fetch_all(MYSQLI_ASSOC) as $row) {\n    echo $row[\"id\"], \" | \", $row[\"name\"], \" | \", $row[\"marks\"], \"\\n\";\n}\n\n<?php\n// ===== File: db.php =====\nmysqli_report(MYSQLI_REPORT_ERROR | MYSQLI_REPORT_STRICT);\n$host = getenv(\"DB_HOST\") ?: \"localhost\";\n$user = getenv(\"DB_USER\") ?: \"busbook_app\";\n$pass = getenv(\"DB_PASS\");\nif ($pass === false) {\n    $pass = \"change-this-lab-password\";\n}\n$name = getenv(\"DB_NAME\") ?: \"busbook\";\n$socket = getenv(\"DB_SOCKET\") ?: null;\ntry {\n    $db = new mysqli($host, $user, $pass, $name, 3306, $socket);\n    $db->set_charset(\"utf8mb4\");\n} catch (mysqli_sql_exception $e) {\n    error_log($e->getMessage());\n    http_response_code(500);\n    exit(\"Database unavailable. Check server configuration.\");\n}"}, "out": "$ curl 'http://localhost/update_delete.php'\nUpdated matching row: 1\nUpdated missing ID: 0\nDeleted rows: 1\n1 | Ravi Patel | 95\n3 | Mihir Desai | 75", "expl": {"en": "<p>The WHERE clause targets one primary key. Omit it and UPDATE/DELETE can affect the whole table. affected_rows reports the last write, not a SELECT count; for UPDATE a zero can mean missing ID <b>or an unchanged value</b> with the default client flags. The full apps check existence separately when that distinction matters. HTTP deletion belongs in a validated, CSRF-protected POST, not an edit-style GET link.</p><p><b>One-time schema/seed setup:</b> select the lesson database in phpMyAdmin and run this SQL before opening the PHP page.</p><pre class=\"c\">CREATE TABLE students (\n  id INT PRIMARY KEY AUTO_INCREMENT,\n  name VARCHAR(80) NOT NULL,\n  email VARCHAR(120) NOT NULL UNIQUE,\n  city VARCHAR(40) NOT NULL,\n  marks INT NOT NULL CHECK (marks BETWEEN 0 AND 100)\n) ENGINE=InnoDB;\nINSERT INTO students(name,email,city,marks) VALUES\n('Ravi Patel','ravi@example.test','Surat',82),\n('Asha Shah','asha@example.test','Vadodara',91),\n('Mihir Desai','mihir@example.test','Surat',75);</pre><p>Save each labelled PHP section as a separate file. db.php reads DB_HOST, DB_USER, DB_PASS and DB_NAME from the environment; its classroom defaults require the lab account described in the notes. DB_SOCKET is optional and used only by the isolated test harness. The output is actual HTTP/HTML source from PHP 8.4 with a real MariaDB server through MySQLi; the browser renders the forms. These temporary test databases are deleted afterwards.</p>"}}, {"id": "wd5p6", "title": {"en": "SQL-injection regression: unsafe lab query vs prepared lookup"}, "code": {"en": "<?php\n// ===== File: injection_lab.php =====\nrequire __DIR__ . \"/db.php\";\nheader(\"Content-Type: text/plain; charset=UTF-8\");\n$probe = \"missing' OR '1'='1\";\n// ISOLATED READ-ONLY LAB ANTI-EXAMPLE. Never use in an app.\n$unsafe = \"SELECT id FROM contacts WHERE name='$probe'\";\necho \"Unsafe concatenation rows: \", $db->query($unsafe)->num_rows, \"\\n\";\n$s = $db->prepare(\"SELECT id FROM contacts WHERE name=?\");\n$s->bind_param(\"s\", $probe);\n$s->execute();\necho \"Prepared probe rows: \", $s->get_result()->num_rows, \"\\n\";\n$probe = \"O'Neil\";\n$s->execute();\necho \"Prepared apostrophe-name rows: \", $s->get_result()->num_rows, \"\\n\";\n$s->close();\n\n<?php\n// ===== File: db.php =====\nmysqli_report(MYSQLI_REPORT_ERROR | MYSQLI_REPORT_STRICT);\n$host = getenv(\"DB_HOST\") ?: \"localhost\";\n$user = getenv(\"DB_USER\") ?: \"busbook_app\";\n$pass = getenv(\"DB_PASS\");\nif ($pass === false) {\n    $pass = \"change-this-lab-password\";\n}\n$name = getenv(\"DB_NAME\") ?: \"busbook\";\n$socket = getenv(\"DB_SOCKET\") ?: null;\ntry {\n    $db = new mysqli($host, $user, $pass, $name, 3306, $socket);\n    $db->set_charset(\"utf8mb4\");\n} catch (mysqli_sql_exception $e) {\n    error_log($e->getMessage());\n    http_response_code(500);\n    exit(\"Database unavailable. Check server configuration.\");\n}"}, "out": "$ curl 'http://localhost/injection_lab.php'\nUnsafe concatenation rows: 3\nPrepared probe rows: 0\nPrepared apostrophe-name rows: 1", "expl": {"en": "<p>A deliberately unsafe, read-only query is run <b>only against this isolated test database</b> to make the failure visible: the injected OR condition returns every row. The parameterised lookup treats the same string as one literal name and returns zero; a legitimate apostrophe-containing name returns one. None of the web apps use this unsafe concatenation. Prepared statements protect value positions, not arbitrary column names or SQL fragments; allowlist those separately.</p><p><b>One-time schema/seed setup:</b> select the lesson database in phpMyAdmin and run this SQL before opening the PHP page.</p><pre class=\"c\">CREATE TABLE contacts (\n  id INT PRIMARY KEY AUTO_INCREMENT,\n  name VARCHAR(80) NOT NULL,\n  email VARCHAR(120) NOT NULL\n) ENGINE=InnoDB;\nINSERT INTO contacts(name,email) VALUES\n('Ravi','ravi@example.test'),\n('Asha','asha@example.test'),\n('O''Neil','oneil@example.test');</pre><p>Save each labelled PHP section as a separate file. db.php reads DB_HOST, DB_USER, DB_PASS and DB_NAME from the environment; its classroom defaults require the lab account described in the notes. DB_SOCKET is optional and used only by the isolated test harness. The output is actual HTTP/HTML source from PHP 8.4 with a real MariaDB server through MySQLi; the browser renders the forms. These temporary test databases are deleted afterwards.</p>"}}, {"id": "wd5p7", "title": {"en": "Transaction: atomic stock change with commit and rollback"}, "code": {"en": "<?php\n// ===== File: stock_transaction.php =====\nrequire __DIR__ . \"/db.php\";\nheader(\"Content-Type: text/plain; charset=UTF-8\");\nfunction sell(mysqli $db, int $wanted): void {\n    if ($wanted <= 0) {\n        throw new InvalidArgumentException(\"Quantity must be positive.\");\n    }\n    $db->begin_transaction();\n    try {\n        $id = 1;\n        $s = $db->prepare(\"UPDATE stock SET qty=qty-? WHERE id=? AND qty>=?\");\n        $s->bind_param(\"iii\", $wanted, $id, $wanted);\n        $s->execute();\n        if ($s->affected_rows !== 1) {\n            throw new RuntimeException(\"Insufficient stock.\");\n        }\n        $s->close();\n        $delta = -$wanted;\n        $s = $db->prepare(\"INSERT INTO movements(stock_id,delta) VALUES (?,?)\");\n        $s->bind_param(\"ii\", $id, $delta);\n        $s->execute();\n        $s->close();\n        $db->commit();\n        echo \"Committed sale of $wanted.\\n\";\n    } catch (RuntimeException $e) {\n        $db->rollback();\n        echo \"Rolled back: \", $e->getMessage(), \"\\n\";\n    } catch (Throwable $e) {\n        $db->rollback();\n        throw $e;\n    }\n}\nsell($db, 2);\nsell($db, 9);\necho \"Final qty: \", $db->query(\"SELECT qty FROM stock WHERE id=1\")->fetch_assoc()[\"qty\"], \"\\n\";\necho \"Movement rows: \", $db->query(\"SELECT COUNT(*) AS n FROM movements\")->fetch_assoc()[\"n\"], \"\\n\";\n\n<?php\n// ===== File: db.php =====\nmysqli_report(MYSQLI_REPORT_ERROR | MYSQLI_REPORT_STRICT);\n$host = getenv(\"DB_HOST\") ?: \"localhost\";\n$user = getenv(\"DB_USER\") ?: \"busbook_app\";\n$pass = getenv(\"DB_PASS\");\nif ($pass === false) {\n    $pass = \"change-this-lab-password\";\n}\n$name = getenv(\"DB_NAME\") ?: \"busbook\";\n$socket = getenv(\"DB_SOCKET\") ?: null;\ntry {\n    $db = new mysqli($host, $user, $pass, $name, 3306, $socket);\n    $db->set_charset(\"utf8mb4\");\n} catch (mysqli_sql_exception $e) {\n    error_log($e->getMessage());\n    http_response_code(500);\n    exit(\"Database unavailable. Check server configuration.\");\n}"}, "out": "$ curl 'http://localhost/stock_transaction.php'\nCommitted sale of 2.\nRolled back: Insufficient stock.\nFinal qty: 3\nMovement rows: 1", "expl": {"en": "<p>InnoDB groups the stock decrement and audit insert into one unit. A conditional UPDATE prevents selling more than the available quantity; commit keeps both writes, rollback prevents a partial operation. The first sale (2 of 5) succeeds; the second (9 of 3) fails, leaving quantity 3 and one movement. The function rejects non-positive quantities before beginning; real request handlers must also validate submitted integer shape/range. DDL such as CREATE/ALTER often causes implicit commits and is not part of this transaction.</p><p><b>One-time schema/seed setup:</b> select the lesson database in phpMyAdmin and run this SQL before opening the PHP page.</p><pre class=\"c\">CREATE TABLE stock (\n  id INT PRIMARY KEY AUTO_INCREMENT,\n  name VARCHAR(80) NOT NULL,\n  qty INT NOT NULL CHECK (qty &gt;= 0)\n) ENGINE=InnoDB;\nCREATE TABLE movements (\n  id INT PRIMARY KEY AUTO_INCREMENT,\n  stock_id INT NOT NULL,\n  delta INT NOT NULL,\n  FOREIGN KEY (stock_id) REFERENCES stock(id)\n) ENGINE=InnoDB;\nINSERT INTO stock(name,qty) VALUES ('USB Cable',5);</pre><p>Save each labelled PHP section as a separate file. db.php reads DB_HOST, DB_USER, DB_PASS and DB_NAME from the environment; its classroom defaults require the lab account described in the notes. DB_SOCKET is optional and used only by the isolated test harness. The output is actual HTTP/HTML source from PHP 8.4 with a real MariaDB server through MySQLi; the browser renders the forms. These temporary test databases are deleted afterwards.</p>"}}, {"id": "wd5p8", "title": {"en": "Complete Blog CRUD with forms and prepared SQL (Practical 20)"}, "code": {"en": "<?php\n// ===== File: index.php =====\nrequire __DIR__ . \"/web.php\";\nfunction findPost(mysqli $db, int $id): ?array {\n    $s = $db->prepare(\"SELECT * FROM posts WHERE id=?\");\n    $s->bind_param(\"i\", $id);\n    $s->execute();\n    $row = $s->get_result()->fetch_assoc();\n    $s->close();\n    return $row;\n}\n$error = \"\";\n$edit = [\"id\" => 0, \"title\" => \"\", \"body\" => \"\"];\nif ($_SERVER[\"REQUEST_METHOD\"] === \"POST\") {\n    check_csrf();\n    $action = text($_POST, \"action\");\n    if ($action === \"delete\") {\n        $id = positiveId($_POST[\"id\"] ?? null);\n        $s = $db->prepare(\"DELETE FROM posts WHERE id=?\");\n        $s->bind_param(\"i\", $id);\n        $s->execute();\n        if ($s->affected_rows !== 1) {\n            fail(\"Post not found.\", 404);\n        }\n        redirect(\"Post deleted.\");\n    }\n    if ($action !== \"save\") {\n        fail(\"Unknown action.\");\n    }\n    $id = recordId($_POST[\"id\"] ?? 0);\n    $title = text($_POST, \"title\");\n    $body = text($_POST, \"body\");\n    $edit = [\"id\" => $id, \"title\" => $title, \"body\" => $body];\n    if ($id > 0 && !findPost($db, $id)) {\n        fail(\"Post not found.\", 404);\n    }\n    if ($title === \"\" || strlen($title) > 100\n        || $body === \"\" || strlen($body) > 5000) {\n        http_response_code(422);\n        $error = \"Title (1-100) and body (1-5000) are required.\";\n    } else {\n        if ($id === 0) {\n            $s = $db->prepare(\"INSERT INTO posts(title,body) VALUES (?,?)\");\n            $s->bind_param(\"ss\", $title, $body);\n        } else {\n            $s = $db->prepare(\"UPDATE posts SET title=?,body=? WHERE id=?\");\n            $s->bind_param(\"ssi\", $title, $body, $id);\n        }\n        $s->execute();\n        redirect($id === 0 ? \"Post created.\" : \"Post updated.\");\n    }\n} elseif (isset($_GET[\"edit\"])) {\n    $id = positiveId($_GET[\"edit\"]);\n    $edit = findPost($db, $id);\n    if (!$edit) {\n        fail(\"Post not found.\", 404);\n    }\n}\n$q = text($_GET, \"q\");\n$like = \"%$q%\";\n$s = $db->prepare(\"SELECT * FROM posts WHERE title LIKE ? ORDER BY id DESC\");\n$s->bind_param(\"s\", $like);\n$s->execute();\n$rows = $s->get_result()->fetch_all(MYSQLI_ASSOC);\n$s->close();\npage(\"BusBook Blog\");\n?>\n<p><?= e($error) ?></p>\n<form method=\"get\">\n  <input name=\"q\" value=\"<?= e($q) ?>\" placeholder=\"Search title\">\n  <button>Search</button>\n</form>\n<form method=\"post\">\n  <?= csrf_field() ?>\n  <input type=\"hidden\" name=\"action\" value=\"save\">\n  <input type=\"hidden\" name=\"id\" value=\"<?= (int)$edit['id'] ?>\">\n  <input name=\"title\" maxlength=\"100\" required value=\"<?= e($edit['title']) ?>\">\n  <textarea name=\"body\" required><?= e($edit['body']) ?></textarea>\n  <button>Save post</button>\n</form>\n<p>Posts: <?= count($rows) ?></p>\n<?php foreach ($rows as $post): ?>\n<article data-id=\"<?= (int)$post['id'] ?>\">\n  <h2><?= e($post['title']) ?></h2>\n  <p><?= nl2br(e($post['body'])) ?></p>\n  <a href=\"?edit=<?= (int)$post['id'] ?>\">Edit</a>\n  <form method=\"post\">\n    <?= csrf_field() ?>\n    <input type=\"hidden\" name=\"action\" value=\"delete\">\n    <input type=\"hidden\" name=\"id\" value=\"<?= (int)$post['id'] ?>\">\n    <button>Delete post</button>\n  </form>\n</article>\n<?php endforeach; ?>\n\n<?php\n// ===== File: db.php =====\nmysqli_report(MYSQLI_REPORT_ERROR | MYSQLI_REPORT_STRICT);\n$host = getenv(\"DB_HOST\") ?: \"localhost\";\n$user = getenv(\"DB_USER\") ?: \"busbook_app\";\n$pass = getenv(\"DB_PASS\");\nif ($pass === false) {\n    $pass = \"change-this-lab-password\";\n}\n$name = getenv(\"DB_NAME\") ?: \"busbook\";\n$socket = getenv(\"DB_SOCKET\") ?: null;\ntry {\n    $db = new mysqli($host, $user, $pass, $name, 3306, $socket);\n    $db->set_charset(\"utf8mb4\");\n} catch (mysqli_sql_exception $e) {\n    error_log($e->getMessage());\n    http_response_code(500);\n    exit(\"Database unavailable. Check server configuration.\");\n}\n\n<?php\n// ===== File: web.php =====\nrequire_once __DIR__ . \"/db.php\";\nset_exception_handler(function (Throwable $e): void {\n    error_log($e->getMessage());\n    http_response_code(500);\n    echo \"Operation failed. Check the server log.\";\n});\nini_set(\"session.use_strict_mode\", \"1\");\nini_set(\"session.use_only_cookies\", \"1\");\n$https = !empty($_SERVER[\"HTTPS\"])\n         && $_SERVER[\"HTTPS\"] !== \"off\";\nsession_set_cookie_params([\n    \"path\" => \"/\", \"secure\" => $https,\n    \"httponly\" => true, \"samesite\" => \"Lax\"\n]);\nsession_start();\n$_SESSION[\"csrf\"] ??= bin2hex(random_bytes(16));\nfunction e(string $s): string {\n    return htmlspecialchars($s, ENT_QUOTES | ENT_SUBSTITUTE, \"UTF-8\");\n}\nfunction text(array $source, string $key): string {\n    $v = $source[$key] ?? \"\";\n    return is_string($v) ? trim($v) : \"\";\n}\nfunction fail(string $message, int $status = 400): void {\n    http_response_code($status);\n    exit(e($message));\n}\nfunction recordId($raw): int {\n    $id = filter_var($raw, FILTER_VALIDATE_INT, [\n        \"options\" => [\"min_range\" => 0]\n    ]);\n    if ($id === false) {\n        fail(\"Invalid record ID.\");\n    }\n    return $id;\n}\nfunction positiveId($raw): int {\n    $id = recordId($raw);\n    if ($id < 1) {\n        fail(\"Invalid record ID.\");\n    }\n    return $id;\n}\nfunction csrf_field(): string {\n    return '<input type=\"hidden\" name=\"csrf\" value=\"'\n           . e($_SESSION[\"csrf\"]) . '\">';\n}\nfunction check_csrf(): void {\n    $token = $_POST[\"csrf\"] ?? null;\n    if (!is_string($token)\n        || !hash_equals($_SESSION[\"csrf\"], $token)) {\n        fail(\"Invalid CSRF token.\", 403);\n    }\n}\nfunction redirect(string $message = \"\"): void {\n    $_SESSION[\"flash\"] = $message;\n    header(\"Location: index.php\", true, 303);\n    exit;\n}\nfunction page(string $title): void {\n    echo '<!doctype html><meta charset=\"utf-8\">';\n    echo '<title>', e($title), '</title>';\n    echo '<style>body{font:16px system-ui;max-width:840px;';\n    echo 'margin:24px auto;padding:12px}article{border:1px solid #ccc;';\n    echo 'padding:12px;margin:12px 0}form{margin:10px 0}';\n    echo 'input,textarea,button,select{font:inherit;margin:4px}';\n    echo 'textarea{display:block;width:95%}</style>';\n    echo '<h1>', e($title), '</h1>';\n    $flash = $_SESSION[\"flash\"] ?? \"\";\n    unset($_SESSION[\"flash\"]);\n    if ($flash !== \"\") {\n        echo '<p role=\"status\">', e($flash), '</p>';\n    }\n}\nif (!in_array($_SERVER[\"REQUEST_METHOD\"], [\"GET\", \"POST\"], true)) {\n    header(\"Allow: GET, POST\");\n    fail(\"Method not allowed.\", 405);\n}"}, "out": "# 1. Open the empty blog form\n$ curl -b cookies.txt -c cookies.txt 'http://localhost/index.php'\n<!doctype html><meta charset=\"utf-8\"><title>BusBook Blog</title><style>body{font:16px system-ui;max-width:840px;margin:24px auto;padding:12px}article{border:1px solid #ccc;padding:12px;margin:12px 0}form{margin:10px 0}input,textarea,button,select{font:inherit;margin:4px}textarea{display:block;width:95%}</style><h1>BusBook Blog</h1><p></p>\n<form method=\"get\">\n  <input name=\"q\" value=\"\" placeholder=\"Search title\">\n  <button>Search</button>\n</form>\n<form method=\"post\">\n  <input type=\"hidden\" name=\"csrf\" value=\"946633d18d7804c055e80246c1bfdda7\">  <input type=\"hidden\" name=\"action\" value=\"save\">\n  <input type=\"hidden\" name=\"id\" value=\"0\">\n  <input name=\"title\" maxlength=\"100\" required value=\"\">\n  <textarea name=\"body\" required></textarea>\n  <button>Save post</button>\n</form>\n<p>Posts: 0</p>\n\n# 2. Create a post and follow Post/Redirect/Get\n$ curl -L -b cookies.txt -c cookies.txt -d 'action=save&id=0&title=BusBook+Begins&body=Our+first+Surat+route+is+live.&csrf=946633d18d7804c055e80246c1bfdda7' 'http://localhost/index.php'\n<!doctype html><meta charset=\"utf-8\"><title>BusBook Blog</title><style>body{font:16px system-ui;max-width:840px;margin:24px auto;padding:12px}article{border:1px solid #ccc;padding:12px;margin:12px 0}form{margin:10px 0}input,textarea,button,select{font:inherit;margin:4px}textarea{display:block;width:95%}</style><h1>BusBook Blog</h1><p role=\"status\">Post created.</p><p></p>\n<form method=\"get\">\n  <input name=\"q\" value=\"\" placeholder=\"Search title\">\n  <button>Search</button>\n</form>\n<form method=\"post\">\n  <input type=\"hidden\" name=\"csrf\" value=\"946633d18d7804c055e80246c1bfdda7\">  <input type=\"hidden\" name=\"action\" value=\"save\">\n  <input type=\"hidden\" name=\"id\" value=\"0\">\n  <input name=\"title\" maxlength=\"100\" required value=\"\">\n  <textarea name=\"body\" required></textarea>\n  <button>Save post</button>\n</form>\n<p>Posts: 1</p>\n<article data-id=\"1\">\n  <h2>BusBook Begins</h2>\n  <p>Our first Surat route is live.</p>\n  <a href=\"?edit=1\">Edit</a>\n  <form method=\"post\">\n    <input type=\"hidden\" name=\"csrf\" value=\"946633d18d7804c055e80246c1bfdda7\">    <input type=\"hidden\" name=\"action\" value=\"delete\">\n    <input type=\"hidden\" name=\"id\" value=\"1\">\n    <button>Delete post</button>\n  </form>\n</article>\n\n# 3. Load the edit form\n$ curl -b cookies.txt -c cookies.txt 'http://localhost/index.php?edit=1'\n<!doctype html><meta charset=\"utf-8\"><title>BusBook Blog</title><style>body{font:16px system-ui;max-width:840px;margin:24px auto;padding:12px}article{border:1px solid #ccc;padding:12px;margin:12px 0}form{margin:10px 0}input,textarea,button,select{font:inherit;margin:4px}textarea{display:block;width:95%}</style><h1>BusBook Blog</h1><p></p>\n<form method=\"get\">\n  <input name=\"q\" value=\"\" placeholder=\"Search title\">\n  <button>Search</button>\n</form>\n<form method=\"post\">\n  <input type=\"hidden\" name=\"csrf\" value=\"946633d18d7804c055e80246c1bfdda7\">  <input type=\"hidden\" name=\"action\" value=\"save\">\n  <input type=\"hidden\" name=\"id\" value=\"1\">\n  <input name=\"title\" maxlength=\"100\" required value=\"BusBook Begins\">\n  <textarea name=\"body\" required>Our first Surat route is live.</textarea>\n  <button>Save post</button>\n</form>\n<p>Posts: 1</p>\n<article data-id=\"1\">\n  <h2>BusBook Begins</h2>\n  <p>Our first Surat route is live.</p>\n  <a href=\"?edit=1\">Edit</a>\n  <form method=\"post\">\n    <input type=\"hidden\" name=\"csrf\" value=\"946633d18d7804c055e80246c1bfdda7\">    <input type=\"hidden\" name=\"action\" value=\"delete\">\n    <input type=\"hidden\" name=\"id\" value=\"1\">\n    <button>Delete post</button>\n  </form>\n</article>\n\n# 4. Update that primary key\n$ curl -L -b cookies.txt -c cookies.txt -d 'action=save&id=1&title=Weekend+Route+Update&body=Extra+buses+on+Saturday.&csrf=946633d18d7804c055e80246c1bfdda7' 'http://localhost/index.php'\n<!doctype html><meta charset=\"utf-8\"><title>BusBook Blog</title><style>body{font:16px system-ui;max-width:840px;margin:24px auto;padding:12px}article{border:1px solid #ccc;padding:12px;margin:12px 0}form{margin:10px 0}input,textarea,button,select{font:inherit;margin:4px}textarea{display:block;width:95%}</style><h1>BusBook Blog</h1><p role=\"status\">Post updated.</p><p></p>\n<form method=\"get\">\n  <input name=\"q\" value=\"\" placeholder=\"Search title\">\n  <button>Search</button>\n</form>\n<form method=\"post\">\n  <input type=\"hidden\" name=\"csrf\" value=\"946633d18d7804c055e80246c1bfdda7\">  <input type=\"hidden\" name=\"action\" value=\"save\">\n  <input type=\"hidden\" name=\"id\" value=\"0\">\n  <input name=\"title\" maxlength=\"100\" required value=\"\">\n  <textarea name=\"body\" required></textarea>\n  <button>Save post</button>\n</form>\n<p>Posts: 1</p>\n<article data-id=\"1\">\n  <h2>Weekend Route Update</h2>\n  <p>Extra buses on Saturday.</p>\n  <a href=\"?edit=1\">Edit</a>\n  <form method=\"post\">\n    <input type=\"hidden\" name=\"csrf\" value=\"946633d18d7804c055e80246c1bfdda7\">    <input type=\"hidden\" name=\"action\" value=\"delete\">\n    <input type=\"hidden\" name=\"id\" value=\"1\">\n    <button>Delete post</button>\n  </form>\n</article>\n\n# 5. Search uses a bound LIKE value\n$ curl -b cookies.txt -c cookies.txt 'http://localhost/index.php?q=Weekend'\n<!doctype html><meta charset=\"utf-8\"><title>BusBook Blog</title><style>body{font:16px system-ui;max-width:840px;margin:24px auto;padding:12px}article{border:1px solid #ccc;padding:12px;margin:12px 0}form{margin:10px 0}input,textarea,button,select{font:inherit;margin:4px}textarea{display:block;width:95%}</style><h1>BusBook Blog</h1><p></p>\n<form method=\"get\">\n  <input name=\"q\" value=\"Weekend\" placeholder=\"Search title\">\n  <button>Search</button>\n</form>\n<form method=\"post\">\n  <input type=\"hidden\" name=\"csrf\" value=\"946633d18d7804c055e80246c1bfdda7\">  <input type=\"hidden\" name=\"action\" value=\"save\">\n  <input type=\"hidden\" name=\"id\" value=\"0\">\n  <input name=\"title\" maxlength=\"100\" required value=\"\">\n  <textarea name=\"body\" required></textarea>\n  <button>Save post</button>\n</form>\n<p>Posts: 1</p>\n<article data-id=\"1\">\n  <h2>Weekend Route Update</h2>\n  <p>Extra buses on Saturday.</p>\n  <a href=\"?edit=1\">Edit</a>\n  <form method=\"post\">\n    <input type=\"hidden\" name=\"csrf\" value=\"946633d18d7804c055e80246c1bfdda7\">    <input type=\"hidden\" name=\"action\" value=\"delete\">\n    <input type=\"hidden\" name=\"id\" value=\"1\">\n    <button>Delete post</button>\n  </form>\n</article>\n\n# 6. Delete with POST; listing becomes empty\n$ curl -L -b cookies.txt -c cookies.txt -d 'action=delete&id=1&csrf=946633d18d7804c055e80246c1bfdda7' 'http://localhost/index.php'\n<!doctype html><meta charset=\"utf-8\"><title>BusBook Blog</title><style>body{font:16px system-ui;max-width:840px;margin:24px auto;padding:12px}article{border:1px solid #ccc;padding:12px;margin:12px 0}form{margin:10px 0}input,textarea,button,select{font:inherit;margin:4px}textarea{display:block;width:95%}</style><h1>BusBook Blog</h1><p role=\"status\">Post deleted.</p><p></p>\n<form method=\"get\">\n  <input name=\"q\" value=\"\" placeholder=\"Search title\">\n  <button>Search</button>\n</form>\n<form method=\"post\">\n  <input type=\"hidden\" name=\"csrf\" value=\"946633d18d7804c055e80246c1bfdda7\">  <input type=\"hidden\" name=\"action\" value=\"save\">\n  <input type=\"hidden\" name=\"id\" value=\"0\">\n  <input name=\"title\" maxlength=\"100\" required value=\"\">\n  <textarea name=\"body\" required></textarea>\n  <button>Save post</button>\n</form>\n<p>Posts: 0</p>", "expl": {"en": "<p>End-to-end create, list/search, edit and delete. Server-side rules validate title/body; every value-bearing SQL statement is prepared; output is escaped (including stored text), mutations require POST + CSRF, and successful writes redirect with 303. Invalid or missing IDs are rejected instead of becoming broad updates/deletes. This is a local single-editor lab: add the Unit 4 authentication/authorisation guard before exposing it publicly.</p><p><b>One-time schema/seed setup:</b> select the lesson database in phpMyAdmin and run this SQL before opening the PHP page.</p><pre class=\"c\">CREATE TABLE posts (\n  id INT PRIMARY KEY AUTO_INCREMENT,\n  title VARCHAR(100) NOT NULL,\n  body TEXT NOT NULL,\n  created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP\n) ENGINE=InnoDB;</pre><p>Save each labelled PHP section as a separate file. db.php reads DB_HOST, DB_USER, DB_PASS and DB_NAME from the environment; its classroom defaults require the lab account described in the notes. DB_SOCKET is optional and used only by the isolated test harness. The output is actual HTTP/HTML source from PHP 8.4 with a real MariaDB server through MySQLi; the browser renders the forms. These temporary test databases are deleted afterwards.</p>"}}, {"id": "wd5p9", "title": {"en": "OOP MVC Contacts: add/search/update/delete safely (Practical 21)"}, "code": {"en": "<?php\n// ===== File: index.php =====\nrequire __DIR__ . \"/web.php\";\nrequire __DIR__ . \"/app/Contact.php\";\nrequire __DIR__ . \"/app/ContactController.php\";\n$model = new Contact($db);\n$controller = new ContactController($model);\n$controller->handle();\n\n<?php\n// ===== File: db.php =====\nmysqli_report(MYSQLI_REPORT_ERROR | MYSQLI_REPORT_STRICT);\n$host = getenv(\"DB_HOST\") ?: \"localhost\";\n$user = getenv(\"DB_USER\") ?: \"busbook_app\";\n$pass = getenv(\"DB_PASS\");\nif ($pass === false) {\n    $pass = \"change-this-lab-password\";\n}\n$name = getenv(\"DB_NAME\") ?: \"busbook\";\n$socket = getenv(\"DB_SOCKET\") ?: null;\ntry {\n    $db = new mysqli($host, $user, $pass, $name, 3306, $socket);\n    $db->set_charset(\"utf8mb4\");\n} catch (mysqli_sql_exception $e) {\n    error_log($e->getMessage());\n    http_response_code(500);\n    exit(\"Database unavailable. Check server configuration.\");\n}\n\n<?php\n// ===== File: web.php =====\nrequire_once __DIR__ . \"/db.php\";\nset_exception_handler(function (Throwable $e): void {\n    error_log($e->getMessage());\n    http_response_code(500);\n    echo \"Operation failed. Check the server log.\";\n});\nini_set(\"session.use_strict_mode\", \"1\");\nini_set(\"session.use_only_cookies\", \"1\");\n$https = !empty($_SERVER[\"HTTPS\"])\n         && $_SERVER[\"HTTPS\"] !== \"off\";\nsession_set_cookie_params([\n    \"path\" => \"/\", \"secure\" => $https,\n    \"httponly\" => true, \"samesite\" => \"Lax\"\n]);\nsession_start();\n$_SESSION[\"csrf\"] ??= bin2hex(random_bytes(16));\nfunction e(string $s): string {\n    return htmlspecialchars($s, ENT_QUOTES | ENT_SUBSTITUTE, \"UTF-8\");\n}\nfunction text(array $source, string $key): string {\n    $v = $source[$key] ?? \"\";\n    return is_string($v) ? trim($v) : \"\";\n}\nfunction fail(string $message, int $status = 400): void {\n    http_response_code($status);\n    exit(e($message));\n}\nfunction recordId($raw): int {\n    $id = filter_var($raw, FILTER_VALIDATE_INT, [\n        \"options\" => [\"min_range\" => 0]\n    ]);\n    if ($id === false) {\n        fail(\"Invalid record ID.\");\n    }\n    return $id;\n}\nfunction positiveId($raw): int {\n    $id = recordId($raw);\n    if ($id < 1) {\n        fail(\"Invalid record ID.\");\n    }\n    return $id;\n}\nfunction csrf_field(): string {\n    return '<input type=\"hidden\" name=\"csrf\" value=\"'\n           . e($_SESSION[\"csrf\"]) . '\">';\n}\nfunction check_csrf(): void {\n    $token = $_POST[\"csrf\"] ?? null;\n    if (!is_string($token)\n        || !hash_equals($_SESSION[\"csrf\"], $token)) {\n        fail(\"Invalid CSRF token.\", 403);\n    }\n}\nfunction redirect(string $message = \"\"): void {\n    $_SESSION[\"flash\"] = $message;\n    header(\"Location: index.php\", true, 303);\n    exit;\n}\nfunction page(string $title): void {\n    echo '<!doctype html><meta charset=\"utf-8\">';\n    echo '<title>', e($title), '</title>';\n    echo '<style>body{font:16px system-ui;max-width:840px;';\n    echo 'margin:24px auto;padding:12px}article{border:1px solid #ccc;';\n    echo 'padding:12px;margin:12px 0}form{margin:10px 0}';\n    echo 'input,textarea,button,select{font:inherit;margin:4px}';\n    echo 'textarea{display:block;width:95%}</style>';\n    echo '<h1>', e($title), '</h1>';\n    $flash = $_SESSION[\"flash\"] ?? \"\";\n    unset($_SESSION[\"flash\"]);\n    if ($flash !== \"\") {\n        echo '<p role=\"status\">', e($flash), '</p>';\n    }\n}\nif (!in_array($_SERVER[\"REQUEST_METHOD\"], [\"GET\", \"POST\"], true)) {\n    header(\"Allow: GET, POST\");\n    fail(\"Method not allowed.\", 405);\n}\n\n<?php\n// ===== File: app/Contact.php =====\nclass Contact {\n    private mysqli $db;\n    public function __construct(mysqli $db) {\n        $this->db = $db;\n    }\n    public function search(string $q): array {\n        $sql = \"SELECT id,name,email FROM contacts \"\n             . \"WHERE name LIKE ? OR email LIKE ? ORDER BY id\";\n        $s = $this->db->prepare($sql);\n        $like = \"%$q%\";\n        $s->bind_param(\"ss\", $like, $like);\n        $s->execute();\n        $rows = $s->get_result()->fetch_all(MYSQLI_ASSOC);\n        $s->close();\n        return $rows;\n    }\n    public function find(int $id): ?array {\n        $s = $this->db->prepare(\"SELECT * FROM contacts WHERE id=?\");\n        $s->bind_param(\"i\", $id);\n        $s->execute();\n        $row = $s->get_result()->fetch_assoc();\n        $s->close();\n        return $row;\n    }\n    public function save(int $id, string $name, string $email): void {\n        if ($id === 0) {\n            $s = $this->db->prepare(\n                \"INSERT INTO contacts(name,email) VALUES (?,?)\"\n            );\n            $s->bind_param(\"ss\", $name, $email);\n        } else {\n            $s = $this->db->prepare(\n                \"UPDATE contacts SET name=?,email=? WHERE id=?\"\n            );\n            $s->bind_param(\"ssi\", $name, $email, $id);\n        }\n        $s->execute();\n        $s->close();\n    }\n    public function delete(int $id): bool {\n        $s = $this->db->prepare(\"DELETE FROM contacts WHERE id=?\");\n        $s->bind_param(\"i\", $id);\n        $s->execute();\n        $deleted = $s->affected_rows === 1;\n        $s->close();\n        return $deleted;\n    }\n}\n\n<?php\n// ===== File: app/ContactController.php =====\nclass ContactController {\n    private Contact $model;\n    public function __construct(Contact $model) {\n        $this->model = $model;\n    }\n    public function handle(): void {\n        $error = \"\";\n        $edit = [\"id\" => 0, \"name\" => \"\", \"email\" => \"\"];\n        if ($_SERVER[\"REQUEST_METHOD\"] === \"POST\") {\n            check_csrf();\n            $action = text($_POST, \"action\");\n            if ($action === \"delete\") {\n                $id = positiveId($_POST[\"id\"] ?? null);\n                if (!$this->model->delete($id)) {\n                    fail(\"Contact not found.\", 404);\n                }\n                redirect(\"Contact deleted.\");\n            }\n            if ($action !== \"save\") {\n                fail(\"Unknown action.\");\n            }\n            $id = recordId($_POST[\"id\"] ?? 0);\n            $name = text($_POST, \"name\");\n            $email = text($_POST, \"email\");\n            $edit = [\"id\" => $id, \"name\" => $name, \"email\" => $email];\n            if ($id > 0 && !$this->model->find($id)) {\n                fail(\"Contact not found.\", 404);\n            }\n            if (strlen($name) < 2 || strlen($name) > 80\n                || strlen($email) > 120\n                || !filter_var($email, FILTER_VALIDATE_EMAIL)) {\n                http_response_code(422);\n                $error = \"Name (2-80) and a valid email are required.\";\n            } else {\n                $this->model->save($id, $name, $email);\n                redirect($id === 0 ? \"Contact added.\" : \"Contact updated.\");\n            }\n        } elseif (isset($_GET[\"edit\"])) {\n            $id = positiveId($_GET[\"edit\"]);\n            $edit = $this->model->find($id);\n            if (!$edit) {\n                fail(\"Contact not found.\", 404);\n            }\n        }\n        $q = text($_GET, \"q\");\n        $rows = $this->model->search($q);\n        require __DIR__ . \"/../views/contacts.php\";\n    }\n}\n\n<?php\n// ===== File: views/contacts.php =====\n page(\"MVC Contacts\"); ?>\n<p><?= e($error) ?></p>\n<form method=\"get\">\n  <input name=\"q\" placeholder=\"Search name/email\" value=\"<?= e($q) ?>\">\n  <button>Search</button>\n</form>\n<form method=\"post\">\n  <?= csrf_field() ?>\n  <input type=\"hidden\" name=\"action\" value=\"save\">\n  <input type=\"hidden\" name=\"id\" value=\"<?= (int)$edit['id'] ?>\">\n  <input name=\"name\" maxlength=\"80\" required value=\"<?= e($edit['name']) ?>\">\n  <input name=\"email\" type=\"email\" required value=\"<?= e($edit['email']) ?>\">\n  <button>Save contact</button>\n</form>\n<p>Contacts: <?= count($rows) ?></p>\n<?php foreach ($rows as $contact): ?>\n<article data-id=\"<?= (int)$contact['id'] ?>\">\n  <b><?= e($contact['name']) ?></b>\n  <span><?= e($contact['email']) ?></span>\n  <a href=\"?edit=<?= (int)$contact['id'] ?>\">Edit</a>\n  <form method=\"post\">\n    <?= csrf_field() ?>\n    <input type=\"hidden\" name=\"action\" value=\"delete\">\n    <input type=\"hidden\" name=\"id\" value=\"<?= (int)$contact['
