<style>
:root{--p:#7B2CD9;--pd:#6420B8;--lav:#EADDF7;--bg:#F3ECFA;--ink:#1d1b20}

body{margin:0;background:#d8cce8;font-family:"Noto Sans Gujarati","Shruti","Nirmala UI",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink)}

.kw{color:#C792EA;font-weight:700}.ty{color:#82AAFF}.st{color:#C3E88D}.cm{color:#8E9AAF;font-style:italic}.pp{color:#F78C6C}.nu{color:#F9C46B}.fn{color:#FFCB6B}

<script>
const U = {"subject": "DI01000111", "unit": 6, "format": "notes", "title": {"en": "Isometric View"}, "hours": 6, "weightage": 20, "official": true, "languages": ["en"], "tabs": ["notes", "diagrams", "equations", "viva", "exam"], "intro_text": {"en": "Unit 6 of Engineering Graphics: the isometric view, the one picture that shows three faces at once. The three axes, the 30 degree lines and the isometric scale come first, then the box method that turns three views into one pictorial view, then offsets for sloping and non-isometric edges, and finally the round and regular solids - cylinder, cone, prism and pyramid - built on the exact isometric ellipse, with the free-hand sketches the syllabus asks for. Six solved problems follow in section 3."}, "notes": [{"title": {"en": "1. The Isometric Frame and the Box Method"}, "items": [{"h": {"en": "6.1 The three axes, the 30 degree lines and the isometric scale"}, "body": {"en": "<h4>One picture instead of three views</h4><p>An <b>isometric view</b> is a single pictorial view in which the three axes of the object are drawn 120 degrees apart in space and appear on paper as two lines at <b>30 degrees to the horizontal</b> and one line straight up. All three axes are foreshortened equally, which is why the three visible faces look equally important and no face is seen square-on.</p><table><tr><th>term</th><th>what it means</th><th>what you draw</th></tr><tr><td>isometric axes</td><td>the three directions of the object, 120 degrees apart in space</td><td>two lines at 30 degrees, one vertical</td></tr><tr><td>isometric lines</td><td>edges parallel to the three axes</td><td>drawn parallel to the axes, at full scale</td></tr><tr><td>non-isometric line</td><td>an edge not parallel to an axis, such as a slope or a diagonal</td><td>found by offsets, never measured directly</td></tr><tr><td>isometric scale</td><td>0.816 of the true length</td><td>used only in the isometric projection</td></tr></table><h4>Drawing or projection - the one difference</h4><ul><li><b>Isometric drawing</b> (what you draw in an exam): every length along an axis is set off at <b>full scale</b>, so a 30 mm edge is drawn 30 mm.</li><li><b>Isometric projection</b>: every axis length is multiplied by <b>0.816</b>, so the same 30 mm edge is drawn 24.5 mm.</li><li>The picture is identical in shape; only the size changes, so a drawing made at full scale is simply a larger copy.</li></ul><h4>Construction, step by step</h4><ol><li>Draw the three axes from one point, the origin: one vertical and two at 30 degrees above the horizontal, one each side.</li><li>Decide which axis carries the length, the width and the height of the object, and write them on the axes.</li><li>Set every dimension off along the axes at full scale from the origin, using a scale or a divider, never by eye.</li><li>Join the marks parallel to the axes to build the visible faces, and finish with the outer outline thickened.</li><li>Check: every edge parallel to an axis in the object must be parallel to the same axis in the drawing, and the three axes must never be drawn at right angles.</li></ol><p><b>Why it works.</b> The isometric view looks along the body diagonal of a cube, so the three faces of the cube are seen equally - which is why each axis is shortened by the same factor, 0.816, and why all three appear at 120 degrees in space.</p><p><b>Common mistake.</b> Using 30 degrees for the vertical as well. Only two axes are inclined; the third is always vertical, and the angles between the three drawn axes are 120 degrees.</p>"}, "diagram": "u6_axes", "syllabus_item": "6.1"}, {"h": {"en": "6.1 The box method - from three views to one picture"}, "body": {"en": "<h4>A block 60 x 40 x 30, given as front, top and side views</h4><p>Every isometric drawing starts as a box. The overall length, width and height are measured along the three axes, giving a box that encloses the object; the object is then cut out of that box, face by face. For a plain block the box <i>is</i> the object, and only three faces are drawn - the three that face the observer.</p><h4>Construction, step by step</h4><ol><li>From the views, write down the overall size: 60 along one axis, 40 along the second, 30 up the third.</li><li>Draw the three axes from the lowest corner and set the three sizes off along them, giving three points.</li><li>Through each of those points draw lines parallel to the other two axes: the three lines meet in the three visible edges of the box.</li><li>Complete the top face, the front face and the side face as parallelograms, each bounded by two axis directions.</li><li>Thicken the outer outline, and leave out every hidden edge - an isometric view shows only what is visible, unless a hidden line is asked for.</li></ol><h4>How the sizes appear</h4><table><tr><th>edge</th><th>true size</th><th>drawn</th><th>direction</th></tr><tr><td>length</td><td>60 mm</td><td>60 mm</td><td>along the 30 degree axis to the right</td></tr><tr><td>width</td><td>40 mm</td><td>40 mm</td><td>along the 30 degree axis to the left</td></tr><tr><td>height</td><td>30 mm</td><td>30 mm</td><td>vertical</td></tr></table><p><b>Why it works.</b> The three views give the three sizes and the isometric axes give the three directions; once a size is set off along the right axis, the corner is fixed. That is why a drawing made from three views and one made from a pictorial view come out identical.</p><p><b>Check before you ink.</b> Measure the outline: the box's silhouette is a hexagon whose opposite sides are equal and parallel, and the three visible faces meet at the front corner with 120 degrees between their edges.</p><p><b>Common mistake.</b> Making the front face a true rectangle. In isometric no face is seen square-on: every face is a parallelogram whose sides follow two of the three axes.</p>"}, "diagram": "u6_box", "syllabus_item": "6.1"}, {"h": {"en": "6.1 Offsets: points and slopes that are off the axes"}, "body": {"en": "<h4>A wedge 50 x 30 with a height of 20 at one end</h4><p>The sloping face of a wedge is a <b>non-isometric line</b>: it is not parallel to any axis, so it cannot be measured along an axis and it is not true to length in the drawing. Its ends are located by <b>offsets</b> - distances measured along the axes from a known corner - and then joined.</p><h4>Construction, step by step</h4><ol><li>Draw the base rhombus on the two horizontal axes: 50 along X and 30 along Y.</li><li>Erect the vertical edges at the corners where the object has height - here 20 mm at the far end of X.</li><li>Mark the top edge at that end, 20 mm up, parallel to the 30 mm side.</li><li>Locate any other point on the sloping face by offsets: go 25 along X, 15 along Y, and 10 up - each offset measured from the origin along an axis and joined by a line parallel to that axis.</li><li>Join the corners of the sloping face and thicken it; the slope's true length is never measured on the drawing.</li></ol><h4>Which lines are which</h4><ul><li><b>Isometric lines</b> - parallel to an axis: drawn at full length along the axis, no offsets needed.</li><li><b>Non-isometric lines</b> - slopes, diagonals, chamfers: both ends found by offsets, then joined.</li><li>A circle in an isometric face is an ellipse - never a compass circle.</li></ul><p><b>Why it works.</b> An offset is a pair (or a triple) of axis measurements, and axis measurements are the only ones the isometric frame preserves. Any point in space is therefore reachable, which is why the offset method can build a shape of any outline.</p><p><b>Common mistake.</b> Measuring a sloping edge along its own direction on the paper. A slope is foreshortened differently from every axis, so its drawn length means nothing - locate its ends, then join them.</p>"}, "diagram": "u6_offsets", "syllabus_item": "6.1"}]}, {"title": {"en": "2. Round and Regular Solids in Isometric"}, "items": [{"h": {"en": "6.2 The cylinder: the isometric ellipse and its tangents"}, "body": {"en": "<h4>Cylinder of 40 mm diameter and 40 mm height, axis vertical</h4><p>A circle in an isometric face is drawn as an <b>ellipse</b>, and the exact ellipse is easy to remember: its major axis is <b>1.22 d</b> and its minor axis <b>0.71 d</b>, with the major axis square to the axis about which the face is tilted. For a circle of 40 mm in a horizontal face the ellipse is therefore 49 mm by 28 mm, lying inside the isometric square of side 40.</p><h4>Construction, step by step</h4><ol><li>Draw the isometric square of side 40 mm on the two horizontal axes; its four side mid-points are the points where the ellipse touches it.</li><li>Through the centre draw the long axis, 1.22 x 40 = 49 mm, parallel to the longer diagonal of the square, and the short axis, 0.71 x 40 = 28 mm, square to it.</li><li>Sketch the ellipse through the four touching points and the four axis ends, or plot it by offsets from the square.</li><li>Repeat the same ellipse 40 mm higher for the top face, keeping the same centre line.</li><li>Join the two ellipses with the two vertical tangents, drawn at the ends of the major axis, and thicken the visible outline: the far half of the bottom ellipse stays thin or dashed.</li></ol><h4>Numbers for round solids</h4><table><tr><th>true circle</th><th>isometric ellipse</th><th>used for</th></tr><tr><td>40 mm diameter</td><td>49 mm x 28 mm</td><td>the two ends of a 40 mm cylinder</td></tr><tr><td>30 mm diameter</td><td>36.6 mm x 21.3 mm</td><td>a 30 mm rod in a bearing</td></tr><tr><td>20 mm diameter</td><td>24.4 mm x 14.2 mm</td><td>a hole through a plate</td></tr></table><p><b>Why it works.</b> The foreshortening is the same 0.816 in every direction, so a circle - which is the same in every direction - becomes an ellipse whose axes are the two extreme foreshortenings of that face: 1.22 across the tilt and 0.71 along it.</p><p><b>Check before you ink.</b> The ellipse must touch its isometric square at the middle of each side, and the long axis must lie along the longer diagonal. If it touches a corner, the square is the wrong size.</p><p><b>Common mistake.</b> Drawing the top and bottom circles the same way round and joining them with vertical lines at the sides of the ellipse. The tangents belong at the ends of the <b>major</b> axis, which is wider than the square.</p>"}, "diagram": "u6_cylinder", "syllabus_item": "6.1"}, {"h": {"en": "6.2 Prism, pyramid and cone - and the free-hand sketches"}, "body": {"en": "<h4>Base first, then up the axis</h4><p>A prism, a pyramid and a cone are all built the same way: draw the base polygon in the two horizontal axes, then take the vertical edges - or the apex - up the third axis. The base is drawn true in isometric, which for a square means a rhombus and for a hexagon means the hexagon squeezed on to the two 30 degree axes.</p><h4>Construction, step by step</h4><ol><li>Draw the base polygon on the two horizontal axes: a rhombus for a square or hexagon base, a circle (ellipse) for a cylinder or cone.</li><li>From every corner of the base draw the vertical edges, at full height, along the vertical axis.</li><li>For a prism, join the top corners to give the second base; for a pyramid or cone, mark the apex on the vertical axis through the centre of the base.</li><li>Join the apex to the visible base corners - only the two or three that face the observer - and leave the rest out or thin.</li><li>Sketch free-hand in the same order: base rhombus, verticals, top or apex; a free-hand isometric is only the same construction done quickly.</li></ol><h4>The four solids the syllabus names</h4><table><tr><th>solid</th><th>base in isometric</th><th>the rest</th></tr><tr><td>prism</td><td>regular polygon on the two horizontal axes</td><td>vertical edges and a second polygon on top</td></tr><tr><td>pyramid</td><td>regular polygon, drawn with its diagonals</td><td>apex on the vertical axis through the centre</td></tr><tr><td>cylinder</td><td>ellipse 1.22 d by 0.71 d</td><td>second ellipse above and two tangents</td></tr><tr><td>cone</td><td>ellipse 1.22 d by 0.71 d</td><td>apex on the axis and two tangents to the base ellipse</td></tr></table><p><b>Why it works.</b> Every one of these solids is a base carried up a vertical axis, so the isometric frame only has to be set up once: the base is a true polygon on the two horizontal axes and the height is read straight up the vertical axis.</p><p><b>Check before you ink.</b> For a pyramid or cone the apex must sit exactly above the centre of the base - measured to the crossing of the diagonals or the centre of the ellipse, not guessed by eye.</p><p><b>Common mistake.</b> Drawing the apex above the nearest corner instead of above the centre. The axis of the solid is vertical, so the apex is directly over the centre of the base.</p>"}, "diagram": "u6_solids", "syllabus_item": "6.2"}]}, {"title": {"en": "3. Solved Drawing Problems, Step by Step"}, "items": [{"h": {"en": "Problem 1. A rectangular block 60 mm x 40 mm x 30 mm is given by its three views. Draw its isometric view, taking full scale along the axes."}, "body": {"en": "<h4>Given</h4><p>Length 60, width 40, height 30. The isometric view is drawn at full scale, so the three sizes go straight along the axes.</p><h4>Construction, step by step</h4><ol><li>Draw the three axes from the lowest corner: one vertical and two at 30 degrees to the horizontal.</li><li>Set 60 mm along the right-hand axis, 40 mm along the left-hand axis and 30 mm up the vertical axis.</li><li>Through each of those three points draw lines parallel to the other two axes, giving the three visible faces.</li><li>Complete the three parallelograms - front face 60 x 30, side face 40 x 30, top face 60 x 40 - and thicken the outer outline.</li><li>Check that every edge is parallel to one of the axes, and that no face is a true rectangle.</li></ol><h4>The answer</h4><p>A hexagonal outline 60 mm and 40 mm along the two 30 degree directions with vertical edges of 30 mm. Every line in the drawing is parallel to one of the three axes, and all three visible faces are parallelograms.</p>"}}, {"h": {"en": "Problem 2. The same block is to be drawn as an isometric projection. What lengths go along the axes, and how do the two drawings differ?"}, "body": {"en": "<h4>The scale</h4><p>An isometric projection shortens every axis length by 0.816, so a 60 mm edge is drawn 60 x 0.816 = 49 mm.</p><h4>Construction, step by step</h4><ol><li>Work out the three shortened lengths: 60 x 0.816 = 49.0 mm, 40 x 0.816 = 32.6 mm and 30 x 0.816 = 24.5 mm.</li><li>Draw the same three axes and set these three lengths off along them.</li><li>Complete the same three parallelograms as before.</li><li>Measure the outline: every dimension is 0.816 of the drawing made at full scale.</li><li>State in the answer which of the two you have drawn, because the pictures look identical apart from size.</li></ol><h4>The answer</h4><p>49.0, 32.6 and 24.5 mm. The isometric projection is the same picture reduced to 0.816, so the shape is identical and only the size differs; exam questions normally ask for the isometric view at full scale.</p>"}}, {"h": {"en": "Problem 3. A wedge has a base 50 mm x 30 mm and rises to 20 mm at one end, the top face sloping down to the opposite edge of the base. Draw its isometric view and state which of its lines are non-isometric."}, "body": {"en": "<h4>Given</h4><p>The base lies on the two horizontal axes; the sloping face is not parallel to any axis, so it is a non-isometric line.</p><h4>Construction, step by step</h4><ol><li>Draw the base rhombus: 50 mm along X and 30 mm along Y.</li><li>Erect the 20 mm vertical edge at the corners at the high end and join their tops.</li><li>Locate any intermediate point on the slope by offsets - for example 25 along X, 15 along Y and 10 up - each measured from the origin.</li><li>Join the high edge to the far edge of the base to complete the sloping face.</li><li>Thicken the visible edges and check that the four sloping edges are the only ones not parallel to an axis.</li></ol><h4>The answer</h4><p>The base edges and the vertical edges are isometric lines; the four edges of the sloping face are non-isometric, and a point on that face is fixed by offsets such as 25, 15 and 10 mm from the origin.</p>"}}, {"h": {"en": "Problem 4. A cylinder of 40 mm diameter and 40 mm height stands on its base. Draw its isometric view, stating the axes of both ellipses."}, "body": {"en": "<h4>Given</h4><p>The base is a horizontal circle of 40 mm, so it is drawn as an ellipse of 1.22 x 40 = 49 mm by 0.71 x 40 = 28 mm.</p><h4>Construction, step by step</h4><ol><li>Draw the isometric square of side 40 mm on the two horizontal axes and mark the mid-points of its four sides.</li><li>Through the centre draw the long axis 49 mm, along the longer diagonal, and the short axis 28 mm square to it.</li><li>Sketch the ellipse through the four mid-points and the four axis ends.</li><li>Repeat the ellipse 40 mm higher for the top face, using the same centre line.</li><li>Join the two ellipses with vertical tangents at the ends of the long axis, thicken the visible outline, and leave the hidden half of the base thin or dashed.</li></ol><h4>The answer</h4><p>Two ellipses of 49 mm by 28 mm with their long axes parallel, joined by two vertical tangents 49 mm apart. The tangents are at the ends of the major axis, not at the sides of the 40 mm square.</p>"}}, {"h": {"en": "Problem 5. A square pyramid has a base of 30 mm side and an axis of 45 mm. Draw its isometric view."}, "body": {"en": "<h4>Given</h4><p>The base square is drawn as a rhombus on the two horizontal axes; the apex stands on the vertical axis above the centre of the base.</p><h4>Construction, step by step</h4><ol><li>Draw the rhombus for the 30 mm square on the two 30 degree axes.</li><li>Draw both diagonals of the rhombus; their crossing is the centre of the base.</li><li>Through that centre draw the vertical axis and mark the apex 45 mm up.</li><li>Join the apex to the three visible corners of the base, and leave the fourth edge thin or dashed.</li><li>Check that the apex is vertically above the crossing of the diagonals.</li></ol><h4>The answer</h4><p>A rhombus base 30 mm on a side with the apex 45 mm above its centre, giving a pyramid whose visible edges are the two front base edges and the three edges up to the apex.</p>"}}, {"h": {"en": "Problem 6. Sketch free-hand the isometric view of a triangular prism with a base of 40 mm side and a height of 50 mm, leaving the construction visible."}, "body": {"en": "<h4>The order to sketch in</h4><p>Base first, uprights second, top third - the same order as with instruments, only faster and lighter.</p><h4>Construction, step by step</h4><ol><li>Lightly draw the three axes from a corner.</li><li>Lay the triangular base on the two horizontal axes: 40 mm on one, 40 mm on the other, and the third corner placed by offsets.</li><li>Draw the three vertical edges 50 mm high from the base corners.</li><li>Join the tops to give the second triangle, and thicken only the visible edges.</li><li>Check that the three vertical edges are equal and parallel and that both triangles are the same shape.</li></ol><h4>The answer</h4><p>A prism whose two triangles lie one above the other with three vertical edges of 50 mm between them. The construction axes and the light base lines stay visible - that is what marks it as a proper free-hand isometric sketch.</p>"}}]}], "diagrams": [{"id": "u6_axes", "title": {"en": "The three isometric axes and the scale"}, "file": "diagrams/u6_axes.svg", "caption": {"en": "Thirty degrees above the horizontal both ways, and one axis up: that is the whole frame. Lines off the frame are not drawn true."}}, {"id": "u6_box", "title": {"en": "The box method: three views to one picture"}, "file": "diagrams/u6_box.svg", "caption": {"en": "Box the object in first, then cut the corners away - the outline of the isometric is always a hexagon that holds the object."}}, {"id": "u6_offsets", "title": {"en": "Points off the axes: offsets and a slope"}, "file": "diagrams/u6_offsets.svg", "caption": {"en": "A point that is not on an axis is fixed by measuring along the axes from a known corner, never by guessing."}}, {"id": "u6_cylinder", "title": {"en": "A cylinder: two ellipses and two tangents"}, "file": "diagrams/u6_cylinder.svg", "caption": {"en": "The isometric circle is an ellipse 1.22 d by 0.71 d, drawn inside the isometric square of side d and touching it at four points."}}, {"id": "u6_solids", "title": {"en": "Prism, pyramid and cone in isometric"}, "file": "diagrams/u6_solids.svg", "caption": {"en": "Base first - a rhombus for the square, a polygon for the prism - then the vertical edges, then the apex or the second base."}}], "equations": [{"title": {"en": "The isometric frame"}, "items": [{"name": {"en": "Isometric scale"}, "f": "isometric length = 0.816 x true length", "terms": {"en": "Every axis is foreshortened by the same factor, 0.816, in the isometric projection; the isometric drawing takes the factor as 1 and uses full scale."}}, {"name": {"en": "Angles between the axes"}, "f": "120 degrees in space; 30, 30 and vertical on paper", "terms": {"en": "The two horizontal axes are drawn at 30 degrees above the horizontal and the third straight up, giving 120 degrees between every pair."}}, {"name": {"en": "Isometric square"}, "f": "a true square of side a becomes a rhombus of side a", "terms": {"en": "Its long diagonal is 1.22 a and its short diagonal 0.71 a, which is the frame the isometric ellipse is drawn in."}}]}, {"title": {"en": "Circles and solids in isometric"}, "items": [{"name": {"en": "Isometric ellipse"}, "f": "major axis 1.22 d, minor axis 0.71 d", "terms": {"en": "A circle of diameter d in one of the coordinate faces projects as an ellipse with those axes; the major axis lies along the longer diagonal of the isometric square."}}, {"name": {"en": "Cylinder in isometric"}, "f": "two ellipses 1.22 d by 0.71 d joined by tangents", "terms": {"en": "The tangents are drawn at the ends of the major axis, because that is where the ellipse's own tangent is vertical."}}, {"name": {"en": "Cone or pyramid in isometric"}, "f": "apex on the vertical axis above the centre of the base", "terms": {"en": "The base is drawn true as a polygon or an ellipse, and every visible apex edge is drawn from the base corner to the apex."}}, {"name": {"en": "Offset to a point"}, "f": "(x, y, z) measured along the three axes from a known corner", "terms": {"en": "A point that does not lie on an axis is fixed by three distances along the axes, joined by lines parallel to the axes."}}]}], "viva": [{"title": {"en": "Axes and scale"}, "items": [{"q": {"en": "What are the isometric axes and why are they 30 degrees apart on paper?"}, "a": {"en": "They are the three edges of a cube meeting at one corner, which are 120 degrees apart in space. The isometric view looks along the body diagonal of the cube, so that corner points at the observer and the three edges appear on paper as two lines at 30 degrees to the horizontal and one line straight up."}}, {"q": {"en": "What is the difference between an isometric view and an isometric projection?"}, "a": {"en": "In an isometric projection every axis length is multiplied by 0.816, so the picture is smaller. In an isometric drawing the axis lengths are set off at their true sizes, so the picture is the same shape but 1/0.816 = 1.22 times larger. Exams normally ask for the isometric view."}}, {"q": {"en": "What is the isometric scale and where does 0.816 come from?"}, "a": {"en": "It is the factor by which every axis is shortened in the projection: 0.816, the cosine of the angle between the axis and the plane of the picture, which is about 35 degrees 16 minutes. All three axes are shortened by the same factor."}}, {"q": {"en": "Which lines are true in an isometric drawing?"}, "a": {"en": "Only the isometric lines - the edges parallel to the three axes. Any edge not parallel to an axis is a non-isometric line and is foreshortened in a way that cannot be measured along the paper."}}]}, {"title": {"en": "Drawing the objects"}, "items": [{"q": {"en": "How do you start the isometric view of any object?"}, "a": {"en": "With the box. Take the overall length, width and height from the views, set them along the three axes from one corner, and complete the enclosing box; then cut the object out of that box face by face, drawing only the visible faces."}}, {"q": {"en": "How is a circle drawn in an isometric face?"}, "a": {"en": "As an ellipse with a major axis of 1.22 d and a minor axis of 0.71 d, drawn inside the isometric square of side d so that it touches the mid-points of the four sides. The long axis lies along the longer diagonal of that square."}}, {"q": {"en": "Where are the vertical tangents of a cylinder drawn?"}, "a": {"en": "At the ends of the major axis of the ellipse, because that is where the ellipse's own tangent is vertical. They are therefore 1.22 d apart, not d apart."}}, {"q": {"en": "How is the apex of a cone or a pyramid located?"}, "a": {"en": "On the vertical axis through the centre of the base - the crossing of the diagonals for a polygon, the centre of the ellipse for a circle - at the given axial height. Then only the visible base corners are joined to it."}}, {"q": {"en": "How do you locate a point that lies on a sloping face?"}, "a": {"en": "By offsets: measure its distances along the three axes from a known corner and draw lines parallel to the axes to meet in the point. Its position on the sloping face is then fixed without ever measuring along the slope itself."}}, {"q": {"en": "Which edges are left out of an isometric view?"}, "a": {"en": "The hidden ones. An isometric view is a pictorial view of what the observer can see, so the outline and the visible edges are drawn thick and the back edges are omitted unless the question asks for hidden detail."}}, {"q": {"en": "What check proves an isometric drawing?"}, "a": {"en": "Every edge must be parallel to one of the three axes, apart from the deliberately non-isometric edges; equal edges of the object must come out equal; and the three visible faces must meet at the front corner with 120 degrees between their edges."}}]}], "exam_questions": [{"q": {"en": "A rectangular block 60 mm x 40 mm x 30 mm is given by its three views. Draw its isometric view, taking full scale along the axes."}, "marks": 5}, {"q": {"en": "The same block is to be drawn as an isometric projection. What lengths go along the axes, and how do the two drawings differ?"}, "marks": 4}, {"q": {"en": "A wedge has a base 50 mm x 30 mm and rises to 20 mm at one end, the top face sloping down to the opposite edge of the base. Draw its isometric view and state which of its lines are non-isometric."}, "marks": 5}, {"q": {"en": "A cylinder of 40 mm diameter and 40 mm height stands on its base. Draw its isometric view, stating the axes of both ellipses."}, "marks": 6}, {"q": {"en": "A square pyramid has a base of 30 mm side and an axis of 45 mm. Draw its isometric view."}, "marks": 5}, {"q": {"en": "Sketch free-hand the isometric view of a triangular prism with a base of 40 mm side and a height of 50 mm, leaving the construction visible."}, "marks": 4}], "learning_outcomes": [{"en": "Draw the isometric view of a simple object from its orthographic views, using the isometric scale."}], "course_outcomes": ["CO5"], "practical_numbers": [6], "content_kind": "theory", "lesson_count": 5, "answered_practice_count": 6, "assessment_note": {"en": "Official course: theory ESE 70 + PA 30 and practical PA 20 + ESE 30 = 150 marks, 3 credits, 30 teaching hours (2 lecture + 2 practical). This unit carries 20 % weightage, 6 of the 30 hours and 14 of the 70 theory marks (the PDF prints weightage only, so the marks are split by weightage). The solved drawing problems in section 4 are revision constructions with suggested marks, not official GTU papers, and the syllabus allows any valid method in the exam, so the notes show one clear method for each curve and name the alternatives."}, "question_provenance": "Original solved drawing problems written for revision; not official past papers", "question_marks_are_suggested": true, "sources": [{"title": "GTU DI01000111 Engineering Graphics syllabus (uploaded PDF, w.e.f. 2024-25)", "url": "https://syllabus.gtu.ac.in/"}, {"title": "N. D. Bhatt - Elementary Engineering Drawing, Charotar Publishing House, Anand (chapter 12: isometric projection)", "url": "https://www.charotarbookstall.com/"}, {"title": "P. S. Gill - A Text Book of Engineering Drawing, S. K. Kataria & Sons, Delhi (isometric view, isometric scale and solids in isometric)", "url": "https://www.skkatariaandsons.com/"}, {"title": "BIS SP 46 - Engineering drawing practice: isometric drawing and isometric scale", "url": "https://www.bis.gov.in/"}]};

  return o + esc(src.slice(last));
}
const progBody = p => p.items
  ? p.items.map(it => fixTables(t(it.body)) + (it.diagram?dgInline(it.diagram):'')).join('')
  : `<div class="pl">${L('code')}</div><pre class="code">${hl(t(p.code))}</pre><div class="pl">${L('output')}</div><pre class="out">${esc(p.out)}</pre>${p.plot?`<div class="pl">${L('plot')}</div>`+dgInline(p.plot).replace('class="dg"','class="dg pg"'):''}${p.expl?`<div class="pl">${L('expl')}</div>${fixTables(t(p.expl))}`:''}`;
const pBox = id => { const p=(U.programs||[]).find(x=>x.id===id); if(!p) return ''; return `<div class="pbox"><div class="et">${L('prog')}: ${t(p.title)}</div>${progBody(p)}</div>`; };
const exBox = id => { const n=(U.numericals||[]).find(x=>x.id===id); if(!n) return ''; return `<div class="ex"><div class="et">${L('ex')}</div><div class="eq2">${t(n.q)}</div>${fixTables(t(n.a))}</div>`; };
function notes(){
  let h = `<div class="intro"><b>${t(U.title)}</b><div>${L('unit')} ${U.unit} · ${U.weightage}% ${L('intro')} · ${U.hours} ${L('hours')}</div><div>${U.intro_text ? t(U.intro_text) : L(U.programs?(META.code_lang==='python'?'intropy':'introc'):'introd')}</div></div>`;
  U.notes.forEach((sec,si)=>{
    h += `<div class="sec">${head(t(sec.title))}`;
    sec.items.forEach((it,i)=>{
      const open = si===0&&i===0 ? ' open' : '';
      if (it.h) {
        h += `<div class="card${it.key?' key':''}${open}"><div class="q hd"><span class="t">${it.key?'⭐ ':''}${t(it.h)}</span>${chev}</div>
        <div class="a rn" style="padding-left:18px">${fixTables(t(it.body)).replace(/margin:0 0 10px -36px/g,'')}${it.diagram?dgInline(it.diagram):''}${(it.examples||[]).map(exBox).join('')}${(it.programs||[]).map(pBox).join('')}</div></div>`;
      } else {
        h += `<div class="card${open}"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(it.q)}</span>${chev}</div>
        <div class="a">${fixTables(t(it.a))}${it.diagram?dgInline(it.diagram):''}</div></div>`;
      }
    });
    h += `</div>`;
  });
  return h;
}
function numericals(){
  return `<div class="sec">${head(L('numericals'))}` + (U.numericals||[]).map((n,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(n.q)}</span>${chev}</div><div class="a">${fixTables(t(n.a))}</div></div>`).join('') + `</div>`;
}
function diagrams(){
  return `<div class="sec">${head(L((U.tabs ? U.tabs.includes('flowcharts')&&!U.tabs.includes('diagrams') : U.programs&&META.code_lang!=='python')?'flowcharts':'diagrams'),false)}<div style="height:10px"></div>` + U.diagrams.map((d,i)=>
    `<div class="dcard" data-dg="${d.id}"><div class="h">${i+1}. ${t(d.title)}</div>${SVG[d.id]}</div>`).join('') + `</div>`;
}
function equations(){
  return U.equations.map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><span class="fbox">${e.f}</span></span>${chev}</div>
     <div class="a"><p>${t(e.terms)}</p></div></div>`).join('') + `</div>`).join('');
}
function viva(){
  // two shapes exist in the corpus: flat [{q,a}] and grouped [{title, items:[{q,a}]}]
  const groups = U.viva.every(v=>v && v.q) ? [{items: U.viva}] : U.viva;
  return groups.map(g=>{
    const items = g.items || [];
    return `<div class="sec">${g.title?head(t(g.title)):''}` + items.map((v,i)=>
      `<div class="card"><div class="q hd"><span class="n">${i+1}.</span><span class="t">${t(v.q)}</span>${chev}</div><div class="a"><p>${t(v.a)}</p></div></div>`).join('') + `</div>`;
  }).join('');
}
function exam(){
  return `<div class="sec">${head(L('examhead'),false)}` + U.exam_questions.map((x,i)=>
    `<div class="card"><div class="q" style="cursor:default"><span class="n">${i+1}.</span><span class="t">${t(x.q)}</span><span class="mk">${x.marks} ${L('marks')}</span></div></div>`).join('') + `</div>`;
}
function programs(){
  return `<div class="sec">${head(L('programs'))}` + (U.programs||[]).map((p,i)=>
    `<div class="card"><div class="q hd"><span class="n">${i+1}.</span><span class="t">${t(p.title)}</span>${chev}</div><div class="a pa">${progBody(p)}</div></div>`).join('') + `</div>`;
}
function syntax(key){
  return (U[typeof key==='string'?key:'syntax']||[]).map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><pre class="code sx">${hl(e.f)}</pre></span>${chev}</div>
     <div class="a">${e.terms && t(e.terms) ? fixTables(t(e.terms)) : ''}</div></div>`).join('') + `</div>`).join('');
}
const flowcharts = diagrams;
const algorithms = () => syntax('algorithms');
const ALLV = {notes, programs, diagrams, flowcharts, algorithms, syntax, equations, numericals, viva, exam};
const VIEWS = U.tabs ? Object.fromEntries(U.tabs.map(k=>[k, ALLV[k]])) : U.programs ? (META.code_lang==='python' ? {notes, programs, diagrams, syntax, viva, exam} : {notes, programs, flowcharts, syntax, viva, exam}) : U.numericals ? {notes, diagrams, equations, numericals, viva, exam} : {notes, diagrams, equations, viva, exam};
function render(){
  document.getElementById('title').textContent = `${L('unit')} ${U.unit}: ${t(U.title)}`;
  document.getElementById('sub').textContent = `${t(META.name)} · ${META.code}`;
  document.getElementById('lang').textContent = S.lang==='en' ? 'ગુ' : 'EN';
  document.getElementById('lang').style.display = META.languages.includes('gu') ? '' : 'none';
  document.getElementById('tabs').innerHTML = Object.keys(VIEWS).map(k=>`<button class="tab${S.tab===k?' on':''}" data-tab="${k}">${L(k)}</button>`).join('');
  document.getElementById('view').innerHTML = VIEWS[S.tab]();
  document.querySelectorAll('#view pre.c').forEach(e=>{ e.innerHTML = hl(e.textContent); e.className='code'; });
}
let zoom = 1;
function setZoom(z){ zoom = Math.min(4, Math.max(1, z)); const w=document.getElementById('zw'); w.style.width=(zoom*100)+'%'; document.getElementById('zr').textContent=Math.round(zoom*100)+'%'; }
document.addEventListener('click', e=>{
  const q = e.target.closest('.q'); if (q && q.parentElement.querySelector('.a')) { q.parentElement.classList.toggle('open'); return; }
  const tb = e.target.closest('[data-tab]'); if (tb){ S.tab = tb.dataset.tab; render(); window.scrollTo(0,0); return; }
  if (e.target.closest('#lang')){ S.lang = S.lang==='en'?'gu':'en'; render(); return; }
  const m = e.target.closest('[data-more]');
  document.querySelectorAll('.menu.show').forEach(x=>{ if(!m || x!==m.nextElementSibling) x.classList.remove('show'); });
  if (m){ m.nextElementSibling.classList.toggle('show'); return; }
  const act = e.target.closest('[data-act]');
  if (act){ act.closest('.sec').querySelectorAll('.card').forEach(c=>{ if(c.querySelector('.a')) c.classList.toggle('open', act.dataset.act==='expand'); }); act.parentElement.classList.remove('show'); return; }
  const dg = e.target.closest('[data-dg]');
  if (dg){ const id=dg.dataset.dg; document.getElementById('mt').textContent=t(U.diagrams.find(d=>d.id===id).title); document.getElementById('zw').innerHTML=SVG[id]; setZoom(1); document.getElementById('modal').classList.add('show'); return; }
  if (e.target.closest('#mx')) document.getElementById('modal').classList.remove('show');
  if (e.target.closest('#zi')) setZoom(zoom+0.5);
  if (e.target.closest('#zo')) setZoom(zoom-0.5);
  if (e.target.closest('#zr')) setZoom(1);
});
render();
</script></body></html>
