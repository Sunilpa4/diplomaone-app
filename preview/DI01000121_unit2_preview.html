.kw{color:#C792EA;font-weight:700}.ty{color:#82AAFF}.st{color:#C3E88D}.cm{color:#8E9AAF;font-style:italic}.pp{color:#F78C6C}.nu{color:#F9C46B}.fn{color:#FFCB6B}

<script>
const U = {"subject": "DI01000121", "unit": 2, "format": "notes", "title": {"en": "Circular Motion", "gu": "વર્તુળ ગતિ"}, "hours": 8, "weightage": 14, "official": true, "languages": ["en", "gu"], "tabs": ["notes", "diagrams", "equations", "numericals", "viva", "exam"], "intro_text": {"en": "Unit 2 of Applied Physics: momentum and impulse, the law of conservation of linear momentum with the recoil of a gun, angular displacement, velocity and acceleration with their linear links and the three rotational equations, centripetal and centrifugal force, the banking of roads and the bending of a cyclist, and the machines that run on centrifugal action. Sixteen lecture cards, five diagrams, nineteen fully solved numericals and fourteen answered practice questions.", "gu": "એપ્લાઇડ ફિઝિક્સનું યુનિટ 2: વેગમાન અને આઘાત, રેખીય વેગમાનના સંરક્ષણનો નિયમ અને બંદૂકનો રીકોઇલ, કોણીય સ્થાનાંતરણ, વેગ અને પ્રવર્ગ તથા તેમના રેખીય સંબંધો અને ભ્રમણનાં ત્રણ સમીકરણો, કેન્દ્રગામી અને કેન્દ્રત્યાગી બળ, રસ્તાનું બેન્કિંગ અને સાયકલ સવારનું નમવું, અને કેન્દ્રત્યાગી ક્રિયાથી ચાલતાં મશીનો. સોળ પાઠ-કાર્ડ, પાંચ આકૃતિઓ, ઓગણીસ પૂરા ઉકેલાયેલા દાખલા અને ચૌદ ઉત્તરસહિત સરાવ પ્રશ્નો."}, "notes": [{"title": {"en": "1. Force, Momentum and Its Conservation", "gu": "1. બળ, વેગમાન અને તેનું સંરક્ષણ"}, "items": [{"h": {"en": "1.1 Force and the rate of change of momentum", "gu": "1.1 બળ અને વેગમાનના ફેરફારનો દર"}, "body": {"en": "<h4>Definition</h4><p><b>Momentum</b> p = m v is the quantity of motion a body carries; it is a vector pointing along the velocity. Its SI unit is kg·m/s.</p><p><b>Force</b> is the rate of change of momentum: F = dp/dt = m a when the mass is constant.</p><h4>Worked example</h4><p>A 1500 kg car at 20 m/s carries p = 1500 × 20 = 30 000 kg·m/s. Bringing it to rest in 5 s needs F = 30 000/5 = 6000 N.</p><h4>Why momentum and not just velocity</h4><p>A truck at 2 m/s and a cricket ball at 40 m/s can carry the same momentum, but the truck is far harder to stop. Momentum measures both mass and motion, which is what a brake, a catch or a collision actually deals with.</p><h4>Common mistake</h4><p>Treating momentum as a scalar and adding speeds. Momentum is a vector: a ball that rebounds reverses sign, so the change is twice as large as stopping it.</p>", "gu": "<h4>વ્યાખ્યા</h4><p><b>વેગમાન</b> p = m v એ શરીરમાં રહેલી ગતિનો જથ્થો છે; તે વેગની દિશામાં હોય તેવી સદિશ રાશિ છે. તેનો SI એકમ kg·m/s છે.</p><p><b>બળ</b> એ વેગમાનના ફેરફારનો દર છે: દ્રવ્યમાન અચળ હોય ત્યારે F = dp/dt = m a.</p><h4>ઉકેલાયેલ દાખલો</h4><p>1500 kg ની કાર 20 m/s પર p = 1500 × 20 = 30 000 kg·m/s ધરાવે છે. તેને 5 sમાં ઊભી કરવા F = 30 000/5 = 6000 N જોઈએ.</p><h4>ફક્ત વેગ નહીં, વેગમાન કેમ</h4><p>2 m/s પરનો ટ્રક અને 40 m/s પરનો ક્રિકેટ બોલ સમાન વેગમાન ધરાવી શકે, પણ ટ્રકને ઊભો કરવો ઘણો અઘરો છે. વેગમાન દ્રવ્યમાન અને ગતિ બંને માપે છે, જે બ્રેક, કેચ કે અથડામણ ખરેખર સંભાળે છે.</p><h4>સામાન્ય ભૂલ</h4><p>વેગમાનને અદિશ ગણીને ઝડપો જોડવી. વેગમાન સદિશ છે: પાછો ઉછળતો બોલ ચિહ્ન બદલે છે, તેથી ફેરફાર તેને ઊભો કરવા કરતાં બમણો થાય.</p>"}, "syllabus_item": "2.1"}, {"h": {"en": "1.2 Impulse and why vehicles have crumple zones", "gu": "1.2 આઘાત (ઇમ્પલ્સ) અને વાહનમાં ક્રમ્પલ ઝોન કેમ હોય"}, "body": {"en": "<h4>Definition</h4><p><b>Impulse</b> J = F × t is the product of a force and the time it acts, and it equals the change in momentum: J = Δp = m v − m u. Unit: N·s = kg·m/s.</p><h4>The useful form</h4><p>F = Δp / t. For a fixed change of momentum, a longer time means a smaller force.</p><table><tr><th>Situation</th><th>Time is made…</th><th>Force on the body</th></tr><tr><td>airbag opens</td><td>longer</td><td>smaller, so no injury</td></tr><tr><td>crumple zone folds</td><td>longer</td><td>smaller, cabin survives</td></tr><tr><td>cricketer lowers the hands</td><td>longer</td><td>smaller, no stinging catch</td></tr><tr><td>hammer hits a nail</td><td>shorter</td><td>larger, nail goes in</td></tr></table><h4>Worked example</h4><p>A 0.15 kg ball arrives at 20 m/s and leaves at 20 m/s the other way. Δp = 0.15 × (20 + 20) = 6 N·s. Stopped in 0.02 s the force is 300 N; in 0.2 s it is 30 N.</p><h4>Common mistake</h4><p>Using only the incoming speed in Δp. When a body reverses, both velocities add in magnitude with opposite signs: Δp = m(v + u).</p>", "gu": "<h4>વ્યાખ્યા</h4><p><b>આઘાત</b> J = F × t એ બળ અને તે લાગે તે સમયનો ગુણાકાર છે, અને તે વેગમાનના ફેરફાર બરાબર છે: J = Δp = m v − m u. એકમ: N·s = kg·m/s.</p><h4>ઉપયોગી સ્વરૂપ</h4><p>F = Δp / t. વેગમાનનો ફેરફાર નિશ્ચિત હોય તો સમય લાંબો એટલે બળ નાનું.</p><table><tr><th>પરિસ્થિતિ</th><th>સમય બનાવાય છે…</th><th>શરીર પરનું બળ</th></tr><tr><td>એરબેગ ખૂલે</td><td>લાંબો</td><td>નાનું, તેથી ઈજા નહીં</td></tr><tr><td>ક્રમ્પલ ઝોન દબાય</td><td>લાંબો</td><td>નાનું, કેબિન સલામત</td></tr><tr><td>ક્રિકેટર હાથ નીચે લાવે</td><td>લાંબો</td><td>નાનું, હાથમાં દુખાવો નહીં</td></tr><tr><td>હેમર ખીલી પર પડે</td><td>ટૂંકો</td><td>મોટું, ખીલી ઘૂસે</td></tr></table><h4>ઉકેલાયેલ દાખલો</h4><p>0.15 kg નો બોલ 20 m/s થી આવે અને વિરુદ્ધ દિશામાં 20 m/s થી જાય. Δp = 0.15 × (20 + 20) = 6 N·s. 0.02 sમાં ઊભો કરો તો બળ 300 N; 0.2 s લાગે તો 30 N.</p><h4>સામાન્ય ભૂલ</h4><p>Δpમાં ફક્ત આવતી ઝડપ વાપરવી. શરીર દિશા બદલે ત્યારે બંને વેગ વિરુદ્ધ ચિહ્ન સાથે મૂલ્યમાં જોડાય: Δp = m(v + u).</p>"}, "diagram": "u2_momentum", "syllabus_item": "2.1"}, {"h": {"en": "1.3 Law of conservation of linear momentum", "gu": "1.3 રેખીય વેગમાનના સંરક્ષણનો નિયમ"}, "body": {"en": "<h4>Statement</h4><p>If no external force acts on a system, its total linear momentum stays constant: m₁u₁ + m₂u₂ = m₁v₁ + m₂v₂.</p><h4>Why it holds</h4><p>It follows from Newton's third law: the two bodies push each other with equal and opposite forces for the same time, so the impulses cancel and the total momentum cannot change.</p><h4>Where it is used</h4><table><tr><th>Event</th><th>Before</th><th>After</th></tr><tr><td>collision of two trolleys</td><td>m₁u₁ + m₂u₂</td><td>(m₁ + m₂)v if they stick</td></tr><tr><td>recoil of a gun</td><td>0 (both at rest)</td><td>m v + M V = 0</td></tr><tr><td>explosion into two pieces</td><td>0</td><td>m₁v₁ + m₂v₂ = 0</td></tr><tr><td>person jumping off a boat</td><td>0</td><td>momentum shared, boat moves back</td></tr></table><h4>Worked example</h4><p>A 2 kg trolley at 3 m/s hits a 1 kg trolley at rest and they stick together. 2 × 3 = (2 + 1) × v, so v = 2 m/s in the original direction.</p><h4>Common mistake</h4><p>Forgetting that momentum is conserved only when no external force acts. A ball thrown upward loses momentum to gravity all the way up.</p>", "gu": "<h4>વિધાન</h4><p>જો સિસ્ટમ પર કોઈ બાહ્ય બળ ન લાગે, તો તેનું કુલ રેખીય વેગમાન અચળ રહે: m₁u₁ + m₂u₂ = m₁v₁ + m₂v₂.</p><h4>કેમ સાચું છે</h4><p>તે ન્યૂટનના ત્રીજા નિયમમાંથી નીકળે છે: બંને શરીરો સમાન અને વિરુદ્ધ બળ સમાન સમય માટે લગાડે છે, તેથી આઘાત રદ થાય અને કુલ વેગમાન બદલાઈ શકતું નથી.</p><h4>ક્યાં વપરાય</h4><table><tr><th>ઘટના</th><th>પહેલાં</th><th>પછી</th></tr><tr><td>બે ટ્રોલીની અથડામણ</td><td>m₁u₁ + m₂u₂</td><td>ચોંટે તો (m₁ + m₂)v</td></tr><tr><td>બંદૂકનો રીકોઇલ</td><td>0 (બંને સ્થિર)</td><td>m v + M V = 0</td></tr><tr><td>બે ટુકડામાં વિસ્ફોટ</td><td>0</td><td>m₁v₁ + m₂v₂ = 0</td></tr><tr><td>હોડીમાંથી કૂદતો માણસ</td><td>0</td><td>વેગમાન વહેંચાય, હોડી પાછળ જાય</td></tr></table><h4>ઉકેલાયેલ દાખલો</h4><p>2 kg ની ટ્રોલી 3 m/s પર 1 kg ની સ્થિર ટ્રોલી સાથે અથડાઈને ચોંટે છે. 2 × 3 = (2 + 1) × v, તેથી v = 2 m/s પહેલાની દિશામાં.</p><h4>સામાન્ય ભૂલ</h4><p>વેગમાન ફક્ત ત્યારે સંરક્ષિત રહે જ્યારે બાહ્ય બળ ન હોય તે ભૂલવું. ઉપર ફેંકેલો દડો ઉપર જતી વખતે ગુરુત્વાકર્ષણને કારણે વેગમાન ગુમાવે છે.</p>"}, "syllabus_item": "2.1"}, {"h": {"en": "1.4 Recoil of a gun", "gu": "1.4 બંદૂકનો રીકોઇલ"}, "body": {"en": "<h4>Method</h4><ol><li>Before firing both the gun and the bullet are at rest, so the total momentum is zero.</li><li>After firing, m v + M V = 0 where m, v are for the bullet and M, V for the gun.</li><li>So V = − m v / M: the gun moves backwards with the opposite momentum.</li></ol><h4>Worked example</h4><p>A 20 g bullet leaves a 5 kg rifle at 400 m/s: V = (0.020 × 400)/5 = 1.6 m/s backwards.</p><h4>Engineering reading</h4><ul><li>The recoil velocity is small because M ≫ m; the recoil momentum is not.</li><li>Recoil energy goes into the shoulder, so the stock is made heavy and the spring absorbs part of it.</li><li>The same equation sizes the recoil of a rocket nozzle or a hose jet.</li></ul><h4>Common mistake</h4><p>Giving the gun the same velocity as the bullet. Momentum is shared in inverse proportion to mass, not equally.</p>", "gu": "<h4>રીત</h4><ol><li>ગોળી ચલાવતા પહેલાં બંદૂક અને ગોળી બંને સ્થિર છે, તેથી કુલ વેગમાન શૂન્ય છે.</li><li>ચલાવ્યા પછી m v + M V = 0, જ્યાં m, v ગોળી માટે અને M, V બંદૂક માટે.</li><li>તેથી V = − m v / M: બંદૂક વિરુદ્ધ દિશામાં તે જ વેગમાન સાથે પાછી ખસે છે.</li></ol><h4>ઉકેલાયેલ દાખલો</h4><p>20 g ની ગોળી 5 kg ની રાયફલમાંથી 400 m/s પર નીકળે: V = (0.020 × 400)/5 = 1.6 m/s પાછળ.</p><h4>ઇજનેરી અર્થઘટન</h4><ul><li>M ≫ m હોવાથી રીકોઇલ વેગ નાનો છે; રીકોઇલ વેગમાન નાનું નથી.</li><li>રીકોઇલની ઊર્જા ખભામાં જાય, તેથી સ્ટોક ભારે બનાવાય અને સ્પ્રિંગ તેનો ભાગ શોષે.</li><li>એ જ સમીકરણ રોકેટ નોઝલ કે પાઇપના જેટના રીકોઇલનું માપ નક્કી કરે છે.</li></ul><h4>સામાન્ય ભૂલ</h4><p>બંદૂકને ગોળી જેટલો જ વેગ આપવો. વેગમાન દ્રવ્યમાનના વ્યસ્ત પ્રમાણમાં વહેંચાય છે, સમાન રીતે નહીં.</p>"}, "diagram": "u2_recoil", "syllabus_item": "2.1"}]}, {"title": {"en": "2. Circular Motion: Angles, Speed and Acceleration", "gu": "2. વર્તુળ ગતિ: કોણ, ઝડપ અને પ્રવર્ગ"}, "items": [{"h": {"en": "2.1 Angular displacement and the radian", "gu": "2.1 કોણીય સ્થાનાંતરણ અને રેડિયન"}, "body": {"en": "<h4>Definition</h4><p><b>Angular displacement</b> θ is the angle swept by the radius joining the body to the centre. Its unit is the radian, where one radian is the angle that cuts an arc equal to the radius.</p><p>Arc length s = r θ (θ in radians). One full circle is 2π rad = 360°, so 1 rad = 57.3°.</p><h4>Conversions you will use constantly</h4><table><tr><th>Degrees</th><th>Radians</th></tr><tr><td>90°</td><td>π/2 = 1.571</td></tr><tr><td>180°</td><td>π = 3.142</td></tr><tr><td>360°</td><td>2π = 6.283</td></tr><tr><td>1 revolution</td><td>2π rad</td></tr></table><h4>Worked example</h4><p>A wheel of radius 0.4 m turns through 3 rad. The rim travels s = 0.4 × 3 = 1.2 m, which is the length of belt a pulley of that size would move.</p><h4>Common mistake</h4><p>Putting degrees into s = rθ. The formula needs radians; 30° is 0.524 rad, not 30.</p>", "gu": "<h4>વ્યાખ્યા</h4><p><b>કોણીય સ્થાનાંતરણ</b> θ એ શરીરને કેન્દ્ર સાથે જોડતી ત્રિજ્યા દ્વારા ઘૂમાયેલો કોણ છે. તેનો એકમ રેડિયન છે, જ્યાં એક રેડિયન એ ત્રિજ્યા જેટલી ચાપ કાપતો કોણ છે.</p><p>ચાપની લંબાઈ s = r θ (θ રેડિયનમાં). પૂરું વર્તુળ 2π રેડિયન = 360°, તેથી 1 રેડિયન = 57.3°.</p><h4>વારંવાર વપરાતાં રૂપાંતરણ</h4><table><tr><th>અંશ</th><th>રેડિયન</th></tr><tr><td>90°</td><td>π/2 = 1.571</td></tr><tr><td>180°</td><td>π = 3.142</td></tr><tr><td>360°</td><td>2π = 6.283</td></tr><tr><td>1 પરિભ્રમણ</td><td>2π રેડિયન</td></tr></table><h4>ઉકેલાયેલ દાખલો</h4><p>0.4 m ત્રિજ્યાનું ચક્ર 3 રેડિયન ફરે. કિનારો s = 0.4 × 3 = 1.2 m કાપે, જેટલી લંબાઈનો પટ્ટો તે માપની ગરગડી ખસેડશે.</p><h4>સામાન્ય ભૂલ</h4><p>s = rθ માં અંશ મૂકવા. સૂત્રને રેડિયન જોઈએ; 30° એ 0.524 રેડિયન છે, 30 નહીં.</p>"}, "diagram": "u2_angular", "syllabus_item": "2.2"}, {"h": {"en": "2.2 Angular velocity and angular acceleration", "gu": "2.2 કોણીય વેગ અને કોણીય પ્રવર્ગ"}, "body": {"en": "<h4>Definitions</h4><p><b>Angular velocity</b> ω = Δθ/Δt (rad/s) is the rate of change of angular displacement. <b>Angular acceleration</b> α = Δω/Δt (rad/s²) is the rate of change of angular velocity.</p><h4>The three relations that link line and circle</h4><table><tr><th>Linear</th><th>Angular</th><th>Link</th></tr><tr><td>displacement s</td><td>θ</td><td>s = r θ</td></tr><tr><td>velocity v</td><td>ω</td><td>v = r ω</td></tr><tr><td>tangential acceleration a</td><td>α</td><td>a = r α</td></tr></table><h4>Period, frequency and rpm</h4><p>ω = 2π/T = 2πn, where T is the period in seconds and n the frequency in hertz. For a shaft turning N revolutions per minute, ω = 2πN/60.</p><h4>Worked example</h4><p>A 300 rpm shaft: ω = 2π × 300/60 = 31.4 rad/s. A 0.4 m pulley on it has rim speed v = 0.4 × 31.4 = 12.6 m/s.</p><h4>Common mistake</h4><p>Using rpm directly as ω. 300 rpm is 31.4 rad/s, a factor of 31.4 — enough to make a belt-drive calculation wrong by an order of magnitude.</p>", "gu": "<h4>વ્યાખ્યાઓ</h4><p><b>કોણીય વેગ</b> ω = Δθ/Δt (rad/s) એ કોણીય સ્થાનાંતરણના ફેરફારનો દર છે. <b>કોણીય પ્રવર્ગ</b> α = Δω/Δt (rad/s²) એ કોણીય વેગના ફેરફારનો દર છે.</p><h4>રેખા અને વર્તુળ જોડતા ત્રણ સંબંધ</h4><table><tr><th>રેખીય</th><th>કોણીય</th><th>સંબંધ</th></tr><tr><td>સ્થાનાંતરણ s</td><td>θ</td><td>s = r θ</td></tr><tr><td>વેગ v</td><td>ω</td><td>v = r ω</td></tr><tr><td>સ્પર્શીય પ્રવર્ગ a</td><td>α</td><td>a = r α</td></tr></table><h4>આવર્તકાળ, આવૃત્તિ અને rpm</h4><p>ω = 2π/T = 2πn, જ્યાં T સેકન્ડમાં આવર્તકાળ અને n હર્ટ્ઝમાં આવૃત્તિ છે. N પરિભ્રમણ પ્રતિ મિનિટ ફરતી શાફ્ટ માટે ω = 2πN/60.</p><h4>ઉકેલાયેલ દાખલો</h4><p>300 rpm ની શાફ્ટ: ω = 2π × 300/60 = 31.4 rad/s. તેના 0.4 m ની ગરગડીની કિનાર ઝડપ v = 0.4 × 31.4 = 12.6 m/s.</p><h4>સામાન્ય ભૂલ</h4><p>rpm ને સીધું ω તરીકે વાપરવું. 300 rpm એટલે 31.4 rad/s, 31.4 નો અવયવ — પટ્ટા-ચાલકની ગણતરી પૂરા ક્રમ જેટલી ખોટી થઈ શકે.</p>"}, "syllabus_item": "2.2"}, {"h": {"en": "2.3 Equations of rotational motion", "gu": "2.3 ભ્રમણાત્મક ગતિનાં સમીકરણો"}, "body": {"en": "<h4>The three equations</h4><p>They are the straight-line equations with s → θ, u → ω₀, v → ω and a → α:</p><table><tr><th>Rotational form</th><th>Linear twin</th></tr><tr><td>ω = ω₀ + α t</td><td>v = u + a t</td></tr><tr><td>θ = ω₀ t + ½ α t²</td><td>s = u t + ½ a t²</td></tr><tr><td>ω² = ω₀² + 2 α θ</td><td>v² = u² + 2 a s</td></tr></table><h4>Worked example</h4><p>A wheel at rest reaches 20 rad/s in 4 s. α = 20/4 = 5 rad/s² and θ = 0 + ½ × 5 × 16 = 40 rad, that is 6.37 revolutions.</p><h4>When to use which</h4><ul><li>Time is given or asked: use the first two equations.</li><li>Time is neither given nor asked: use ω² = ω₀² + 2αθ.</li><li>Only for constant α; a varying drive torque needs integration.</li></ul><h4>Common mistake</h4><p>Using θ in degrees. All three equations need radians, because θ = s/r is defined that way.</p>", "gu": "<h4>ત્રણ સમીકરણો</h4><p>તેઓ સુરેખ ગતિનાં સમીકરણો જ છે જ્યાં s → θ, u → ω₀, v → ω અને a → α:</p><table><tr><th>ભ્રમણાત્મક સ્વરૂપ</th><th>સુરેખ જોડિયું</th></tr><tr><td>ω = ω₀ + α t</td><td>v = u + a t</td></tr><tr><td>θ = ω₀ t + ½ α t²</td><td>s = u t + ½ a t²</td></tr><tr><td>ω² = ω₀² + 2 α θ</td><td>v² = u² + 2 a s</td></tr></table><h4>ઉકેલાયેલ દાખલો</h4><p>સ્થિર ચક્ર 4 sમાં 20 rad/s પર પહોંચે. α = 20/4 = 5 rad/s² અને θ = 0 + ½ × 5 × 16 = 40 rad, એટલે 6.37 પરિભ્રમણ.</p><h4>ક્યારે કયું વાપરવું</h4><ul><li>સમય આપેલો કે માગેલો હોય: પહેલાં બે સમીકરણો વાપરો.</li><li>સમય આપેલો ન હોય કે માગેલો ન હોય: ω² = ω₀² + 2αθ વાપરો.</li><li>ફક્ત અચળ α માટે; બદલાતા ડ્રાઇવ ટોર્ક માટે સંકલન કરવું પડે.</li></ul><h4>સામાન્ય ભૂલ</h4><p>θ અંશમાં વાપરવું. ત્રણેય સમીકરણોને રેડિયન જોઈએ, કારણ કે θ = s/r એમ જ વ્યાખ્યાયિત છે.</p>"}, "syllabus_item": "2.2"}, {"h": {"en": "2.4 Uniform and non-uniform circular motion", "gu": "2.3 સમાન અને અસમાન વર્તુળ ગતિ"}, "body": {"en": "<h4>Two cases</h4><table><tr><th>Uniform circular motion</th><th>Non-uniform circular motion</th></tr><tr><td>speed constant, direction changes</td><td>both speed and direction change</td></tr><tr><td>α = 0</td><td>α ≠ 0</td></tr><tr><td>only centripetal acceleration a<sub>c</sub> = v²/r</td><td>a<sub>c</sub> = v²/r plus tangential a<sub>t</sub> = rα</td></tr><tr><td>example: a fan at full speed</td><td>example: a fan speeding up</td></tr></table><h4>Resultant acceleration</h4><p>The two components are perpendicular, so the total is a = √(a<sub>c</sub>² + a<sub>t</sub>²) and its direction is not towards the centre once α ≠ 0.</p><h4>Worked example</h4><p>A 0.3 m wheel spinning at 4 m/s while braking with α = 2 rad/s² has a<sub>c</sub> = 16/0.3 = 53.3 m/s² and a<sub>t</sub> = 0.3 × 2 = 0.6 m/s². The centripetal part dominates, which is why brake pads see mostly radial loading.</p><h4>Common mistake</h4><p>Saying a body in uniform circular motion has no acceleration because its speed is constant. The direction changes every instant, so the velocity does change.</p>", "gu": "<h4>બે સ્થિતિ</h4><table><tr><th>સમાન વર્તુળ ગતિ</th><th>અસમાન વર્તુળ ગતિ</th></tr><tr><td>ઝડપ અચળ, દિશા બદલાય</td><td>ઝડપ અને દિશા બંને બદલાય</td></tr><tr><td>α = 0</td><td>α ≠ 0</td></tr><tr><td>ફક્ત કેન્દ્રગામી પ્રવર્ગ a<sub>c</sub> = v²/r</td><td>a<sub>c</sub> = v²/r ઉપરાંત સ્પર્શીય a<sub>t</sub> = rα</td></tr><tr><td>ઉદાહરણ: પૂરી ઝડપે ચાલતો પંખો</td><td>ઉદાહરણ: ઝડપ પકડતો પંખો</td></tr></table><h4>પરિણામી પ્રવર્ગ</h4><p>બંને ઘટકો લંબ છે, તેથી કુલ a = √(a<sub>c</sub>² + a<sub>t</sub>²) અને α ≠ 0 હોય ત્યારે તેની દિશા કેન્દ્ર તરફ રહેતી નથી.</p><h4>ઉકેલાયેલ દાખલો</h4><p>0.3 m નું ચક્ર 4 m/s પર ફરતાં α = 2 rad/s² થી બ્રેક થાય તો a<sub>c</sub> = 16/0.3 = 53.3 m/s² અને a<sub>t</sub> = 0.3 × 2 = 0.6 m/s². કેન્દ્રગામી ભાગ પ્રભાવી છે, તેથી જ બ્રેક પૅડ પર મુખ્યત્વે ત્રિજ્યાકીય ભાર પડે.</p><h4>સામાન્ય ભૂલ</h4><p>સમાન વર્તુળ ગતિમાં ઝડપ અચળ હોવાથી પ્રવર્ગ નથી એમ કહેવું. દિશા દર ક્ષણે બદલાય છે, તેથી વેગ બદલાય છે જ.</p>"}, "syllabus_item": "2.2"}]}, {"title": {"en": "3. Centripetal and Centrifugal Force", "gu": "3. કેન્દ્રગામી અને કેન્દ્રત્યાગી બળ"}, "items": [{"h": {"en": "3.1 Centripetal force: the force that keeps a body on the circle", "gu": "3.1 કેન્દ્રગામી બળ: શરીરને વર્તુળ પર રાખતું બળ"}, "body": {"en": "<h4>Definition and formula</h4><p><b>Centripetal force</b> is the inward force needed to keep a body of mass m moving on a circle of radius r at speed v: F = m v²/r = m r ω². The acceleration it produces is a<sub>c</sub> = v²/r, directed towards the centre.</p><h4>Who supplies it</h4><table><tr><th>Situation</th><th>Force that acts as centripetal</th></tr><tr><td>stone on a string</td><td>tension in the string</td></tr><tr><td>car on a curve</td><td>friction between tyre and road</td></tr><tr><td>satellite in orbit</td><td>gravitational attraction</td></tr><tr><td>electron around a nucleus</td><td>electrostatic attraction</td></tr><tr><td>bucket of water whirled overhead</td><td>tension plus weight at the top</td></tr></table><h4>Worked example</h4><p>A 0.2 kg stone on a 0.5 m string moving at 4 m/s needs F = 0.2 × 16/0.5 = 6.4 N of tension, which is the minimum strength of the string.</p><h4>Common mistake</h4><p>Adding a separate 'centripetal force' to the free-body diagram. It is not an extra force; it is the name of the net inward force already present.</p>", "gu": "<h4>વ્યાખ્યા અને સૂત્ર</h4><p><b>કેન્દ્રગામી બળ</b> એ દ્રવ્યમાન m ના શરીરને r ત્રિજ્યાના વર્તુળ પર v ઝડપે રાખવા જરૂરી અંદર તરફનું બળ છે: F = m v²/r = m r ω². તે જે પ્રવર્ગ ઉત્પન્ન કરે તે a<sub>c</sub> = v²/r છે, જે કેન્દ્ર તરફ છે.</p><h4>તે કોણ પૂરું પાડે</h4><table><tr><th>પરિસ્થિતિ</th><th>કેન્દ્રગામી બળ પૂરું પાડતું બળ</th></tr><tr><td>દોરી સાથેનો પથ્થર</td><td>દોરીમાં તણાવ</td></tr><tr><td>વળાંક પર કાર</td><td>ટાયર અને રસ્તા વચ્ચેનું ઘર્ષણ</td></tr><tr><td>કક્ષામાં ઉપગ્રહ</td><td>ગુરુત્વાકર્ષણ</td></tr><tr><td>ન્યુક્લિયસ ફરતો ઇલેક્ટ્રોન</td><td>સ્થિરવિદ્યુત આકર્ષણ</td></tr><tr><td>માથા પર ફેરવાતી પાણીની ડોલ</td><td>ઉપર તણાવ અને વજન</td></tr></table><h4>ઉકેલાયેલ દાખલો</h4><p>0.5 m દોરી પર 4 m/s પર ફરતા 0.2 kg પથ્થરને F = 0.2 × 16/0.5 = 6.4 N તણાવ જોઈએ, જે દોરીની લઘુતમ મજબૂતાઈ છે.</p><h4>સામાન્ય ભૂલ</h4><p>મુક્ત-શરીર આકૃતિમાં અલગ 'કેન્દ્રગામી બળ' ઉમેરવું. તે વધારાનું બળ નથી; તે પહેલેથી હાજર ચોખ્ખા અંદર તરફના બળનું નામ છે.</p>"}, "diagram": "u2_centripetal", "syllabus_item": "2.3"}, {"h": {"en": "3.2 Centrifugal force: real or not?", "gu": "3.2 કેન્દ્રત્યાગી બળ: સાચું કે નહીં?"}, "body": {"en": "<h4>What it is</h4><p><b>Centrifugal force</b> is the outward pseudo force felt in the rotating frame: F = m v²/r, equal in size to the centripetal force and opposite in direction. It appears because the observer is accelerating, not because something pushes outward.</p><h4>The two side by side</h4><table><tr><th>Point</th><th>Centripetal</th><th>Centrifugal</th></tr><tr><td>direction</td><td>towards the centre</td><td>away from the centre</td></tr><tr><td>nature</td><td>real force</td><td>pseudo force</td></tr><tr><td>frame</td><td>inertial frame</td><td>rotating frame only</td></tr><tr><td>example</td><td>tension, friction, gravity</td><td>mud leaving a tyre, cream pushed out in a centrifuge</td></tr></table><h4>Worked example</h4><p>In a washing machine drum of radius 0.25 m at 1200 rpm, ω = 125.7 rad/s and a = rω² ≈ 3950 m/s² ≈ 400 g. Water leaves through the holes because the drum cannot supply that much inward force.</p><h4>Common mistake</h4><p>Drawing both forces on the same free-body diagram in the ground frame. Choose one frame and stay in it.</p>", "gu": "<h4>તે શું છે</h4><p><b>કેન્દ્રત્યાગી બળ</b> એ ફરતી ફ્રેમમાં અનુભવાતું બહાર તરફનું આભાસી બળ છે: F = m v²/r, જે કદમાં કેન્દ્રગામી બળ જેટલું અને દિશામાં વિરુદ્ધ છે. તે દેખાય છે કારણ કે નિરીક્ષક પ્રવર્ગિત છે, એટલા માટે નહીં કે કંઈક બહાર ધકેલે છે.</p><h4>બંને સાથે</h4><table><tr><th>મુદ્દો</th><th>કેન્દ્રગામી</th><th>કેન્દ્રત્યાગી</th></tr><tr><td>દિશા</td><td>કેન્દ્ર તરફ</td><td>કેન્દ્રથી દૂર</td></tr><tr><td>સ્વરૂપ</td><td>સાચું બળ</td><td>આભાસી બળ</td></tr><tr><td>ફ્રેમ</td><td>જડત્વીય ફ્રેમ</td><td>ફક્ત ફરતી ફ્રેમમાં</td></tr><tr><td>ઉદાહરણ</td><td>તણાવ, ઘર્ષણ, ગુરુત્વાકર્ષણ</td><td>ટાયરમાંથી નીકળતો કાદવ, સેન્ટ્રિફ્યુજમાં બહાર ધકેલાતી ક્રીમ</td></tr></table><h4>ઉકેલાયેલ દાખલો</h4><p>0.25 m ત્રિજ્યાના ધોવાના મશીનના ડ્રમમાં 1200 rpm પર ω = 125.7 rad/s અને a = rω² ≈ 3950 m/s² ≈ 400 g. પાણી છિદ્રોમાંથી નીકળે છે કારણ કે ડ્રમ એટલું અંદરનું બળ પૂરું પાડી શકતું નથી.</p><h4>સામાન્ય ભૂલ</h4><p>જમીનની ફ્રેમમાં બંને બળ એક જ આકૃતિમાં દોરવાં. એક ફ્રેમ પસંદ કરો અને તેમાં જ રહો.</p>"}, "syllabus_item": "2.3"}, {"h": {"en": "3.3 Banking of roads", "gu": "3.3 રસ્તાનું બેન્કિંગ"}, "body": {"en": "<h4>Why roads are banked</h4><p>On a flat curve the friction alone must supply m v²/r. Tilting the road by θ lets the normal reaction contribute too, so the same curve can be taken faster and with less skidding in rain.</p><h4>Derivation (friction ignored)</h4><ol><li>Resolve: N cos θ balances weight m g, and N sin θ supplies the centripetal force.</li><li>N sin θ = m v²/r and N cos θ = m g.</li><li>Divide: <b>tan θ = v²/(r g)</b>.</li></ol><h4>With friction it is safer still</h4><p>v<sub>max</sub> = √(r g (μ + tan θ)/(1 − μ tan θ)). With no banking (θ = 0) this reduces to v<sub>max</sub> = √(μ r g).</p><h4>Worked example</h4><p>A curve of radius 100 m designed for 72 km/h (20 m/s): tan θ = 400/(100 × 9.8) = 0.408, so θ = 22.2°.</p><h4>Common mistake</h4><p>Forgetting to convert km/h to m/s before squaring. 72 km/h is 20 m/s, and the square is 400, not 5184.</p>", "gu": "<h4>રસ્તા કેમ બેન્ક કરાય</h4><p>સપાટ વળાંક પર ફક્ત ઘર્ષણે m v²/r પૂરું પાડવું પડે. રસ્તો θ જેટલો નમાવવાથી અભિલંબ પ્રતિક્રિયા પણ ફાળો આપે, તેથી એ જ વળાંક વધુ ઝડપે અને વરસાદમાં ઓછા લપસવા સાથે લઈ શકાય.</p><h4>સૂત્ર (ઘર્ષણ અવગણીને)</h4><ol><li>ઘટકો પાડો: N cos θ વજન m g ને સંતુલિત કરે અને N sin θ કેન્દ્રગામી બળ પૂરું પાડે.</li><li>N sin θ = m v²/r અને N cos θ = m g.</li><li>ભાગાકાર કરો: <b>tan θ = v²/(r g)</b>.</li></ol><h4>ઘર્ષણ સાથે વધુ સલામત</h4><p>v<sub>max</sub> = √(r g (μ + tan θ)/(1 − μ tan θ)). બેન્કિંગ ન હોય (θ = 0) તો તે v<sub>max</sub> = √(μ r g) થાય.</p><h4>ઉકેલાયેલ દાખલો</h4><p>72 km/h (20 m/s) માટે રચાયેલ 100 m ત્રિજ્યાનો વળાંક: tan θ = 400/(100 × 9.8) = 0.408, તેથી θ = 22.2°.</p><h4>સામાન્ય ભૂલ</h4><p>વર્ગ કરતાં પહેલાં km/h ને m/s માં ફેરવવાનું ભૂલવું. 72 km/h એટલે 20 m/s, અને તેનો વર્ગ 400 છે, 5184 નહીં.</p>"}, "diagram": "u2_banking", "syllabus_item": "2.3"}, {"h": {"en": "3.4 Centrifugal machines: pump, separator, governor", "gu": "3.4 કેન્દ્રત્યાગી મશીનો: પંપ, વિભાજક, ગવર્નર"}, "body": {"en": "<h4>One idea, three machines</h4><table><tr><th>Machine</th><th>What the rotation does</th><th>Design quantity</th></tr><tr><td>centrifugal pump</td><td>throws water outward into the casing</td><td>head ∝ ω² r²</td></tr><tr><td>cream separator</td><td>heavier milk moves out, cream stays in</td><td>separation ∝ ω² r</td></tr><tr><td>fly-ball governor</td><td>balls rise as speed rises</td><td>lift ∝ ω² r</td></tr><tr><td>spin dryer</td><td>water leaves through the drum holes</td><td>extraction ∝ ω² r</td></tr></table><h4>Worked example</h4><p>A separator of radius 0.1 m at 6000 rpm: ω = 628 rad/s and a = r ω² ≈ 39 400 m/s² ≈ 4000 g, which separates cream in seconds.</p><h4>The engineering catch</h4><p>The load rises with the square of speed, so a 10 % overspeed means 21 % more stress. That is why every one of these machines has a speed limit and a guard.</p><h4>Common mistake</h4><p>Sizing the motor from the flow alone. The casing and the impeller are sized by the centrifugal pressure, which grows with ω².</p>", "gu": "<h4>એક ખ્યાલ, ત્રણ મશીન</h4><table><tr><th>મશીન</th><th>ભ્રમણ શું કરે</th><th>રચનાની રાશિ</th></tr><tr><td>સેન્ટ્રિફ્યુગલ પંપ</td><td>પાણીને બહાર કેસિંગમાં ફેંકે</td><td>હેડ ∝ ω² r²</td></tr><tr><td>ક્રીમ વિભાજક</td><td>ભારે દૂધ બહાર જાય, ક્રીમ અંદર રહે</td><td>અલગીકરણ ∝ ω² r</td></tr><tr><td>ફ્લાય-બોલ ગવર્નર</td><td>ઝડપ વધે તેમ દડા ઉપર જાય</td><td>ઉપર ઉઠવું ∝ ω² r</td></tr><tr><td>સ્પિન ડ્રાયર</td><td>ડ્રમના છિદ્રોમાંથી પાણી નીકળે</td><td>નિષ્કર્ષણ ∝ ω² r</td></tr></table><h4>ઉકેલાયેલ દાખલો</h4><p>0.1 m ત્રિજ્યાનો વિભાજક 6000 rpm પર: ω = 628 rad/s અને a = r ω² ≈ 39 400 m/s² ≈ 4000 g, જે ક્રીમને સેકન્ડોમાં અલગ કરે.</p><h4>ઇજનેરી ચેતવણી</h4><p>ભાર ઝડપના વર્ગ પ્રમાણે વધે, તેથી 10 % વધુ ઝડપ એટલે 21 % વધુ પ્રતિબળ. તેથી જ આ દરેક મશીન પર ઝડપ મર્યાદા અને ગાર્ડ હોય છે.</p><h4>સામાન્ય ભૂલ</h4><p>ફક્ત પ્રવાહ પરથી મોટરનું માપ નક્કી કરવું. કેસિંગ અને ઇમ્પેલરનું માપ કેન્દ્રત્યાગી દબાણ પ્રમાણે થાય, જે ω² સાથે વધે.</p>"}, "syllabus_item": "2.3"}, {"h": {"en": "3.5 Bending of a cyclist on a curve", "gu": "3.4 વળાંક પર સાયકલ સવારનું નમવું"}, "body": {"en": "<h4>The physics</h4><p>A cyclist leans inward by an angle θ so that the resultant of weight m g and the normal reaction passes through the line joining the tyre contact to the centre of mass. Otherwise the torque would topple the cycle.</p><p><b>tan θ = v²/(r g)</b> — exactly the banking angle for the same speed and radius.</p><h4>Worked example</h4><p>At 5 m/s on a 10 m radius, tan θ = 25/98 = 0.255 and θ = 14.3° from the vertical.</p><h4>Consequences an engineer uses</h4><ul><li>Lean depends on v², so doubling the speed quadruples the lean.</li><li>A loaded carrier needs the same lean angle but its higher centre of mass makes the margin smaller.</li><li>Wet roads reduce μ, so the lean angle at which the tyre slips arrives earlier.</li></ul><h4>Common mistake</h4><p>Leaning outward, or thinking the lean is for balance only. The lean is what supplies the centripetal force through the ground reaction.</p>", "gu": "<h4>ભૌતિકી</h4><p>સાયકલ સવાર અંદર તરફ θ કોણે નમે છે જેથી વજન m g અને અભિલંબ પ્રતિક્રિયાનું પરિણામ ટાયરના સંપર્કથી દ્રવ્યમાન કેન્દ્ર સુધીની રેખામાંથી પસાર થાય. નહીં તો ટોર્ક સાયકલને ઢોળી નાખે.</p><p><b>tan θ = v²/(r g)</b> — તે જ ઝડપ અને ત્રિજ્યા માટે બેન્કિંગ કોણ જેટલું જ.</p><h4>ઉકેલાયેલ દાખલો</h4><p>10 m ત્રિજ્યા પર 5 m/s પર tan θ = 25/98 = 0.255 અને ઊર્ધ્વથી θ = 14.3°.</p><h4>ઇજનેર વાપરે તેવા પરિણામો</h4><ul><li>નમવું v² પર આધારિત છે, તેથી ઝડપ બમણી કરો તો નમવું ચાર ગણું થાય.</li><li>ભાર વહેતા વાહનને એ જ કોણ જોઈએ, પણ ઊંચું દ્રવ્યમાન કેન્દ્ર માર્જિન ઘટાડે.</li><li>ભીના રસ્તા μ ઘટાડે, તેથી ટાયર લપસે તેવો કોણ વહેલો આવે.</li></ul><h4>સામાન્ય ભૂલ</h4><p>બહાર તરફ નમવું, અથવા નમવું ફક્ત સંતુલન માટે છે એમ માનવું. નમવું એ જ જમીનની પ્રતિક્રિયા દ્વારા કેન્દ્રગામી બળ પૂરું પાડે છે.</p>"}, "syllabus_item": "2.3"}]}, {"title": {"en": "4. Circular Motion in the Workshop and on the Road", "gu": "4. કાર્યશાળા અને રસ્તા પર વર્તુળ ગતિ"}, "items": [{"h": {"en": "4.1 Choosing the right formula", "gu": "4.1 યોગ્ય સૂત્રની પસંદગી"}, "body": {"en": "<h4>A decision table</h4><table><tr><th>Question asks for</th><th>Use</th></tr><tr><td>momentum of a moving body</td><td>p = m v</td></tr><tr><td>force from a change of momentum in time t</td><td>F = Δp / t</td></tr><tr><td>recoil or explosion</td><td>m₁v₁ + m₂v₂ = 0</td></tr><tr><td>speed of a shaft in rpm</td><td>ω = 2πN/60</td></tr><tr><td>rim speed from angular speed</td><td>v = r ω</td></tr><tr><td>acceleration towards the centre</td><td>a = v²/r = r ω²</td></tr><tr><td>maximum speed on a flat curve</td><td>v = √(μ r g)</td></tr><tr><td>banking angle</td><td>tan θ = v²/(r g)</td></tr></table><h4>Checklist before substituting</h4><ol><li>Write every quantity in SI: m, kg, s, rad/s.</li><li>Convert rpm to rad/s and km/h to m/s first.</li><li>Decide the direction and keep signs for vectors.</li><li>Check the answer against a known case: a car on a 100 m curve is a few hundred kN of force, not a few newtons.</li></ol><h4>Common mistake</h4><p>Mixing units: 20 m/s with a radius in cm. Convert, then calculate.</p>", "gu": "<h4>નિર્ણય કોષ્ટક</h4><table><tr><th>પ્રશ્ન શું માગે</th><th>વાપરો</th></tr><tr><td>ગતિમાન શરીરનું વેગમાન</td><td>p = m v</td></tr><tr><td>સમય t માં વેગમાનના ફેરફારથી બળ</td><td>F = Δp / t</td></tr><tr><td>રીકોઇલ કે વિસ્ફોટ</td><td>m₁v₁ + m₂v₂ = 0</td></tr><tr><td>શાફ્ટની ઝડપ rpm માં</td><td>ω = 2πN/60</td></tr><tr><td>કોણીય ઝડપથી કિનારની ઝડપ</td><td>v = r ω</td></tr><tr><td>કેન્દ્ર તરફનો પ્રવર્ગ</td><td>a = v²/r = r ω²</td></tr><tr><td>સપાટ વળાંક પર મહત્તમ ઝડપ</td><td>v = √(μ r g)</td></tr><tr><td>બેન્કિંગ કોણ</td><td>tan θ = v²/(r g)</td></tr></table><h4>આંકડા મૂકતાં પહેલાંની ચકાસણી</h4><ol><li>દરેક રાશિ SIમાં લખો: m, kg, s, rad/s.</li><li>પહેલાં rpm ને rad/s અને km/h ને m/s માં ફેરવો.</li><li>દિશા નક્કી કરો અને સદિશો માટે ચિહ્ન રાખો.</li><li>જાણીતી સ્થિતિ સાથે જવાબ ચકાસો: 100 m વળાંક પર કાર પર થોડા ન્યૂટન નહીં, થોડા લાખ ન્યૂટન બળ પડે.</li></ol><h4>સામાન્ય ભૂલ</h4><p>એકમ ભેગાં કરવાં: 20 m/s સાથે ત્રિજ્યા cm માં. પહેલાં રૂપાંતરણ, પછી ગણતરી.</p>"}, "syllabus_item": "2.3"}, {"h": {"en": "4.2 Where circular motion decides a design", "gu": "4.2 વર્તુળ ગતિ કઈ રચના નક્કી કરે"}, "body": {"en": "<h4>Five everyday examples</h4><table><tr><th>Machine or situation</th><th>What is designed with it</th></tr><tr><td>centrifugal pump</td><td>impeller radius sets the head at a given rpm</td></tr><tr><td>washing machine spin</td><td>drum speed high enough for water to leave</td></tr><tr><td>road curve</td><td>banking angle and speed limit</td></tr><tr><td>grinding wheel</td><td>burst speed from safe rim velocity</td></tr><tr><td>roller bearing</td><td>centripetal load on the cage at speed</td></tr></table><h4>Worked example: the speed limit of a curve</h4><p>A flat curve of radius 50 m with μ = 0.4: v = √(0.4 × 50 × 9.8) = 14 m/s = 50 km/h. In rain μ falls to 0.25, giving 11 m/s = 40 km/h, which is why the sign shows two limits.</p><h4>Common mistake</h4><p>Designing for the posted speed only. Loaded trucks have a higher centre of mass and roll over long before they slide.</p>", "gu": "<h4>પાંચ રોજિંદા ઉદાહરણ</h4><table><tr><th>મશીન કે પરિસ્થિતિ</th><th>તેનાથી શું રચાય</th></tr><tr><td>સેન્ટ્રિફ્યુગલ પંપ</td><td>આપેલ rpm પર ઇમ્પેલરની ત્રિજ્યા હેડ નક્કી કરે</td></tr><tr><td>ધોવાના મશીનનું સ્પિન</td><td>પાણી નીકળે તેટલી ડ્રમની ઝડપ</td></tr><tr><td>રસ્તાનો વળાંક</td><td>બેન્કિંગ કોણ અને ઝડપ મર્યાદા</td></tr><tr><td>ઘંટીનું ચક્ર</td><td>સલામત કિનાર ઝડપથી ફાટવાની ઝડપ</td></tr><tr><td>રોલર બેરિંગ</td><td>ઝડપે કેજ પર કેન્દ્રગામી ભાર</td></tr></table><h4>ઉકેલાયેલ દાખલો: વળાંકની ઝડપ મર્યાદા</h4><p>μ = 0.4 સાથે 50 m ત્રિજ્યાનો સપાટ વળાંક: v = √(0.4 × 50 × 9.8) = 14 m/s = 50 km/h. વરસાદમાં μ ઘટીને 0.25 થાય, તેથી 11 m/s = 40 km/h — તેથી જ બોર્ડ પર બે મર્યાદા હોય છે.</p><h4>સામાન્ય ભૂલ</h4><p>ફક્ત લખેલી ઝડપ માટે રચના કરવી. ભરેલા ટ્રકનું દ્રવ્યમાન કેન્દ્ર ઊંચું હોય છે અને તે લપસે તે પહેલાં ઊંધા પડે.</p>"}, "syllabus_item": "2.3"}, {"h": {"en": "4.3 What the exam asks from Unit 2", "gu": "4.3 યુનિટ 2 પરથી પરીક્ષામાં શું પૂછાય"}, "body": {"en": "<h4>Question types</h4><table><tr><th>Question</th><th>What to write</th><th>Marks</th></tr><tr><td>State and prove conservation of linear momentum</td><td>statement + Newton's third law argument + equation</td><td>4</td></tr><tr><td>Explain the recoil of a gun</td><td>before/after momentum + formula + one numerical</td><td>3-4</td></tr><tr><td>Define angular displacement, velocity, acceleration</td><td>three definitions with units + v = rω</td><td>3</td></tr><tr><td>Derive tan θ = v²/rg for a banked road</td><td>resolved components + division + one line of meaning</td><td>4-7</td></tr><tr><td>Numerical on centripetal force</td><td>formula, substitution, unit, direction</td><td>3-4</td></tr></table><h4>Time plan for a 7-mark answer</h4><ol><li>Statement and the one assumption (no external force).</li><li>A labelled diagram with before and after.</li><li>The equation, then one substitution with units.</li><li>One engineering application in a sentence.</li></ol><h4>Common mistake</h4><p>Writing only the formula. The marks for a derivation sit in the resolved components and the division step.</p>", "gu": "<h4>પ્રશ્નના પ્રકાર</h4><table><tr><th>પ્રશ્ન</th><th>શું લખવું</th><th>માર્ક્સ</th></tr><tr><td>રેખીય વેગમાનના સંરક્ષણનો નિયમ જણાવી સાબિત કરો</td><td>વિધાન + ન્યૂટનના ત્રીજા નિયમની દલીલ + સમીકરણ</td><td>4</td></tr><tr><td>બંદૂકનો રીકોઇલ સમજાવો</td><td>પહેલાં/પછીનું વેગમાન + સૂત્ર + એક દાખલો</td><td>3-4</td></tr><tr><td>કોણીય સ્થાનાંતરણ, વેગ, પ્રવર્ગની વ્યાખ્યા</td><td>ત્રણ વ્યાખ્યા એકમ સાથે + v = rω</td><td>3</td></tr><tr><td>બેન્ક કરેલા રસ્તા માટે tan θ = v²/rg સાબિત કરો</td><td>ઘટકો + ભાગાકાર + એક લાઇન અર્થ</td><td>4-7</td></tr><tr><td>કેન્દ્રગામી બળ પર દાખલો</td><td>સૂત્ર, આંકડા, એકમ, દિશા</td><td>3-4</td></tr></table><h4>7 માર્કના જવાબનો સમય પ્લાન</h4><ol><li>વિધાન અને એક ધારણા (બાહ્ય બળ નહીં).</li><li>પહેલાં અને પછી દર્શાવતું લેબલવાળું ચિત્ર.</li><li>સમીકરણ, પછી એકમ સાથે એક આંકડા મૂકવા.</li><li>એક વાક્યમાં એક ઇજનેરી ઉપયોગ.</li></ol><h4>સામાન્ય ભૂલ</h4><p>ફક્ત સૂત્ર લખવું. સાબિતીના માર્ક્સ ઘટકો પાડવામાં અને ભાગાકારના પગલામાં છે.</p>"}, "syllabus_item": "2.1"}]}, {"title": {"en": "5. Practice Questions with Model Answers", "gu": "5. સરાવ પ્રશ્નો અને આદર્શ જવાબો"}, "items": [{"h": {"en": "Practice 1. State and explain the law of conservation of linear momentum with one example.", "gu": "સરાવ 1. રેખીય વેગમાનના સંરક્ષણનો નિયમ જણાવીને એક ઉદાહરણ સાથે સમજાવો."}, "body": {"en": "<p>If no external force acts on a system, its total linear momentum remains constant: m₁u₁ + m₂u₂ = m₁v₁ + m₂v₂.</p><p>It follows from Newton's third law. During an interaction the two bodies exert equal and opposite forces for the same time, so the two impulses are equal and opposite and cancel; the momentum gained by one is exactly the momentum lost by the other.</p><p>Example: a 20 g bullet leaving a 5 kg rifle at 400 m/s gives the rifle a recoil of 0.020 × 400/5 = 1.6 m/s backwards, because the total momentum must stay zero.</p>", "gu": "<p>જો સિસ્ટમ પર બાહ્ય બળ ન લાગે તો તેનું કુલ રેખીય વેગમાન અચળ રહે: m₁u₁ + m₂u₂ = m₁v₁ + m₂v₂.</p><p>તે ન્યૂટનના ત્રીજા નિયમમાંથી નીકળે. ક્રિયાપ્રતિક્રિયા દરમિયાન બંને શરીરો સમાન સમય માટે સમાન અને વિરુદ્ધ બળ લગાડે, તેથી બંને આઘાત સમાન અને વિરુદ્ધ હોઈ રદ થાય; એકે મેળવેલું વેગમાન બીજાએ ગુમાવેલા વેગમાન જેટલું જ હોય.</p><p>ઉદાહરણ: 20 g ગોળી 5 kg રાયફલમાંથી 400 m/s પર નીકળે તો રાયફલને 0.020 × 400/5 = 1.6 m/s પાછળનો રીકોઇલ મળે, કારણ કે કુલ વેગમાન શૂન્ય જ રહેવું જોઈએ.</p>"}}, {"h": {"en": "Practice 2. Define impulse and show that it equals the change of momentum.", "gu": "સરાવ 2. આઘાતની વ્યાખ્યા આપો અને તે વેગમાનના ફેરફાર જેટલો છે તે દર્શાવો."}, "body": {"en": "<p>Impulse is the product of a force and the time for which it acts: J = F × t, measured in N·s.</p><p>From Newton's second law F = Δp/Δt, so F t = Δp and therefore J = m v − m u.</p><p>This is why an airbag works: the same Δp spread over 0.2 s instead of 0.02 s cuts the force by a factor of ten and keeps the occupant inside the survival limit.</p><p>Worked check: a 0.15 kg ball arriving at 20 m/s and leaving at 20 m/s the other way changes momentum by 6 N·s, so stopping it in 0.02 s needs 300 N and in 0.2 s only 30 N.</p>", "gu": "<p>આઘાત એ બળ અને તે લાગે તે સમયનો ગુણાકાર છે: J = F × t, એકમ N·s.</p><p>ન્યૂટનના બીજા નિયમ F = Δp/Δt પરથી F t = Δp, તેથી J = m v − m u.</p><p>તેથી જ એરબેગ કામ કરે: એ જ Δp 0.02 s ને બદલે 0.2 s સુધી ફેલાય તો બળ દશ ગણું ઘટે અને મુસાફર જીવિત રહે તે મર્યાદામાં રહે.</p><p>ઉકેલાયેલ ચકાસણી: 0.15 kg બોલ 20 m/s પર આવીને વિરુદ્ધ દિશામાં 20 m/s પર જાય તો વેગમાનમાં 6 N·s ફેરફાર થાય, તેથી 0.02 sમાં ઊભો કરવા 300 N અને 0.2 sમાં ફક્ત 30 N જોઈએ.</p>"}}, {"h": {"en": "Practice 3. Explain the recoil of a gun using conservation of momentum.", "gu": "સરાવ 3. વેગમાનના સંરક્ષણનો ઉપયોગ કરીને બંદૂકનો રીકોઇલ સમજાવો."}, "body": {"en": "<p>Before firing, the gun and the bullet are at rest, so the total momentum is zero.</p><p>After firing, 0 = m v + M V, so V = −m v/M: the gun moves backwards with equal momentum.</p><p>The negative sign only fixes the direction. Because M ≫ m the recoil speed is small, but the recoil energy m²v²/2M still has to be absorbed by the shoulder or the recoil spring.</p>", "gu": "<p>ચલાવતા પહેલાં બંદૂક અને ગોળી સ્થિર છે, તેથી કુલ વેગમાન શૂન્ય છે.</p><p>ચલાવ્યા પછી 0 = m v + M V, તેથી V = −m v/M: બંદૂક સમાન વેગમાન સાથે પાછળ ખસે છે.</p><p>ઋણ ચિહ્ન ફક્ત દિશા બતાવે છે. M ≫ m હોવાથી રીકોઇલની ઝડપ નાની છે, પણ રીકોઇલની ઊર્જા m²v²/2M છતાં ખભા કે રીકોઇલ સ્પ્રિંગે શોષવી પડે.</p>"}}, {"h": {"en": "Practice 4. Define angular displacement, angular velocity and angular acceleration, and give their relations with the linear quantities.", "gu": "સરાવ 4. કોણીય સ્થાનાંતરણ, કોણીય વેગ અને કોણીય પ્રવર્ગની વ્યાખ્યા આપી રેખીય રાશિઓ સાથેનો સંબંધ જણાવો."}, "body": {"en": "<p>Angular displacement θ is the angle swept by the radius, in radians; angular velocity ω = Δθ/Δt in rad/s; angular acceleration α = Δω/Δt in rad/s².</p><p>The links are s = r θ, v = r ω and a = r α. Every point on a rigid rotating body has the same ω and α but a different v and a, proportional to its distance from the axis.</p><p>For a shaft at N rpm, ω = 2πN/60; 300 rpm is 31.4 rad/s, and a 0.4 m pulley on it gives a rim speed of 12.6 m/s.</p>", "gu": "<p>કોણીય સ્થાનાંતરણ θ એ ત્રિજ્યા દ્વારા ઘૂમાયેલો કોણ, રેડિયનમાં; કોણીય વેગ ω = Δθ/Δt, rad/s માં; કોણીય પ્રવર્ગ α = Δω/Δt, rad/s² માં.</p><p>સંબંધ s = r θ, v = r ω અને a = r α છે. કઠણ ફરતા શરીરના દરેક બિંદુનું ω અને α સમાન હોય, પણ v અને a ધરીથી અંતર પ્રમાણે જુદા હોય.</p><p>N rpm પરની શાફ્ટ માટે ω = 2πN/60; 300 rpm એટલે 31.4 rad/s, અને તેના 0.4 m ગરગડીની કિનાર ઝડપ 12.6 m/s.</p>"}}, {"h": {"en": "Practice 5. Derive the expression for the banking angle of a road and state what happens when friction is also present.", "gu": "સરાવ 5. રસ્તાના બેન્કિંગ કોણનું સૂત્ર સાબિત કરો અને ઘર્ષણ હાજર હોય ત્યારે શું થાય તે જણાવો."}, "body": {"en": "<p>On a road banked at θ, the normal reaction N is perpendicular to the surface. Resolving vertically and horizontally: N cos θ = m g and N sin θ = m v²/r.</p><p>Dividing the second by the first removes N and m: tan θ = v²/(r g). For r = 100 m and v = 20 m/s this gives tan θ = 0.408, that is θ = 22.2°.</p><p>With friction the tyre can also push along the surface, and the limit becomes v_max = √(r g (μ + tan θ)/(1 − μ tan θ)), which falls back to √(μ r g) on a flat road.</p>", "gu": "<p>θ કોણે બેન્ક કરેલા રસ્તા પર અભિલંબ પ્રતિક્રિયા N સપાટીને લંબ છે. ઊર્ધ્વ અને સમક્ષિતિજ ઘટકો: N cos θ = m g અને N sin θ = m v²/r.</p><p>બીજાને પહેલાથી ભાગતાં N અને m જતાં રહે: tan θ = v²/(r g). r = 100 m અને v = 20 m/s માટે tan θ = 0.408, એટલે θ = 22.2°.</p><p>ઘર્ષણ સાથે ટાયર સપાટી પર પણ ધકેલી શકે, અને મર્યાદા v_max = √(r g (μ + tan θ)/(1 − μ tan θ)) થાય, જે સપાટ રસ્તે √(μ r g) બને છે.</p>"}}, {"h": {"en": "Practice 6. A car of 1200 kg takes a 45 m curve at 15 m/s. Find the centripetal force and the friction coefficient needed.", "gu": "સરાવ 6. 1200 kg કાર 45 m વળાંક 15 m/s પર લે છે. કેન્દ્રગામી બળ અને જરૂરી ઘર્ષણ ગુણાંક શોધો."}, "body": {"en": "<p>F = m v²/r = 1200 × 225/45 = 6000 N towards the centre of the curve.</p><p>Friction must supply it, and the maximum available is μ m g, so μ ≥ 6000/(1200 × 9.8) = 0.51.</p><p>Dry asphalt gives about 0.7 and wet asphalt about 0.4, so this curve would be posted at a lower speed in rain or banked to reduce the demand on friction.</p>", "gu": "<p>F = m v²/r = 1200 × 225/45 = 6000 N વળાંકના કેન્દ્ર તરફ.</p><p>તે ઘર્ષણે પૂરું પાડવું પડે, અને વધુમાં વધુ μ m g મળે, તેથી μ ≥ 6000/(1200 × 9.8) = 0.51.</p><p>સૂકા ડામર પર લગભગ 0.7 અને ભીના પર 0.4 મળે, તેથી આ વળાંક વરસાદમાં ઓછી ઝડપે લેવો પડે અથવા ઘર્ષણ પરની માગ ઘટાડવા બેન્ક કરવો પડે.</p>"}}, {"h": {"en": "Practice 7. Why does a cyclist lean while turning? Derive the lean angle.", "gu": "સરાવ 7. સાયકલ સવાર વળાંક વખતે કેમ નમે છે? નમવાનું કોણ સાબિત કરો."}, "body": {"en": "<p>The weight acts through the centre of mass and the ground reaction through the tyre contact. If the cycle stayed upright, these two would form a couple and topple it outward.</p><p>Leaning inward by θ makes the resultant pass through the contact point, and its horizontal component supplies m v²/r: tan θ = v²/(r g).</p><p>At 5 m/s on a 10 m radius the lean is 14.3°; doubling the speed to 10 m/s quadruples tan θ and takes the lean to 45.6°, which is why fast turns feel so committed.</p>", "gu": "<p>વજન દ્રવ્યમાન કેન્દ્રમાંથી અને જમીનની પ્રતિક્રિયા ટાયરના સંપર્કમાંથી લાગે. સાયકલ સીધી રહે તો બંને કપલ બનાવીને બહાર તરફ ઢોળે.</p><p>અંદર તરફ θ નમવાથી પરિણામ સંપર્ક બિંદુમાંથી પસાર થાય, અને તેનો સમક્ષિતિજ ઘટક m v²/r પૂરો પાડે: tan θ = v²/(r g).</p><p>10 m ત્રિજ્યા પર 5 m/s પર નમવું 14.3° છે; ઝડપ 10 m/s કરતાં tan θ ચાર ગણું થાય અને નમવું 45.6° થાય, તેથી જ ઝડપી વળાંક ખૂબ નમેલા લાગે.</p>"}}, {"h": {"en": "Practice 8. Distinguish between centripetal and centrifugal force.", "gu": "સરાવ 8. કેન્દ્રગામી અને કેન્દ્રત્યાગી બળ વચ્ચેનો ભેદ સમજાવો."}, "body": {"en": "<p>Centripetal force is a real inward force, such as tension, friction or gravity, that keeps a body on its circle; its magnitude is m v²/r.</p><p>Centrifugal force is a pseudo force of the same magnitude but directed outward, and it exists only for an observer in the rotating frame.</p><p>In the ground frame, a stone on a string has only tension; in the frame of the stone, the string's tension is balanced by the outward centrifugal force and the stone appears at rest.</p>", "gu": "<p>કેન્દ્રગામી બળ સાચું અંદર તરફનું બળ છે, જેમ કે તણાવ, ઘર્ષણ કે ગુરુત્વાકર્ષણ, જે શરીરને વર્તુળ પર રાખે; તેનું મૂલ્ય m v²/r છે.</p><p>કેન્દ્રત્યાગી બળ એ જ મૂલ્યનું પણ બહાર તરફનું આભાસી બળ છે, અને તે ફક્ત ફરતી ફ્રેમમાં રહેલા નિરીક્ષક માટે હોય છે.</p><p>જમીનની ફ્રેમમાં દોરી પરના પથ્થર પર ફક્ત તણાવ છે; પથ્થરની ફ્રેમમાં તણાવને બહાર તરફનું કેન્દ્રત્યાગી બળ સંતુલિત કરે અને પથ્થર સ્થિર દેખાય.</p>"}}, {"h": {"en": "Practice 9. A shaft turns at 1200 rpm. Find ω, and the rim speed of a 0.05 m grinding wheel on it. Comment on the result.", "gu": "સરાવ 9. શાફ્ટ 1200 rpm પર ફરે છે. ω અને તેના 0.05 m ઘંટી ચક્રની કિનાર ઝડપ શોધો. પરિણામ પર ટીકા કરો."}, "body": {"en": "<p>ω = 2πN/60 = 2π × 1200/60 = 125.7 rad/s, that is 20 revolutions per second.</p><p>Rim speed v = r ω = 0.05 × 125.7 = 6.28 m/s, a safe surface speed for a bonded wheel.</p><p>The centripetal acceleration is r ω² ≈ 790 m/s², about 80 g, so the wheel must be rated for that bursting load and guarded in case it fails.</p>", "gu": "<p>ω = 2πN/60 = 2π × 1200/60 = 125.7 rad/s, એટલે પ્રતિ સેકન્ડ 20 પરિભ્રમણ.</p><p>કિનાર ઝડપ v = r ω = 0.05 × 125.7 = 6.28 m/s, જે બોન્ડેડ ચક્ર માટે સલામત સપાટી ઝડપ છે.</p><p>કેન્દ્રગામી પ્રવર્ગ r ω² ≈ 790 m/s², લગભગ 80 g છે, તેથી ચક્ર એ ફાટવાના ભાર માટે રેટેડ હોવું જોઈએ અને ફાટે તો બચાવ માટે ગાર્ડ હોવો જોઈએ.</p>"}}, {"h": {"en": "Practice 10. Explain with a diagram-free argument why a centrifuge separates cream from milk.", "gu": "સરાવ 10. કેન્દ્રત્યાગી યંત્ર ક્રીમને દૂધથી કેમ અલગ કરે છે તે ચિત્ર વગર સમજાવો."}, "body": {"en": "<p>Every particle in the spinning bowl needs an inward force m v²/r to stay on its circle. The bowl supplies this only through the milk around the particle.</p><p>Denser particles need a larger force than the fluid can give, so they move outward; lighter fat globules are pushed inward. The separation therefore follows density, not weight.</p><p>At 1200 rpm in a 0.25 m drum the acceleration is about 400 g, which separates in seconds what gravity would take hours to do.</p>", "gu": "<p>ફરતા વાટકામાંના દરેક કણને વર્તુળ પર રહેવા અંદર તરફનું બળ m v²/r જોઈએ. વાટકો તે પોતાની આસપાસના દૂધ દ્વારા જ પૂરું પાડે.</p><p>ઘનતાવાળા કણોને પ્રવાહી આપી શકે તેનાથી વધુ બળ જોઈએ, તેથી તેઓ બહાર જાય; હલકા ચરબીના ગોળા અંદર ધકેલાય. તેથી અલગીકરણ ઘનતા પ્રમાણે થાય, વજન પ્રમાણે નહીં.</p><p>0.25 m ડ્રમમાં 1200 rpm પર પ્રવર્ગ લગભગ 400 g થાય, જે ગુરુત્વાકર્ષણને કલાકો લાગે તે કામ સેકન્ડોમાં કરે.</p>"}}, {"h": {"en": "Practice 11. What is the maximum speed of a car on a flat curve of radius 80 m if μ = 0.35, and how does banking at 10° change it?", "gu": "સરાવ 11. μ = 0.35 સાથે 80 m ત્રિજ્યાના સપાટ વળાંક પર કારની મહત્તમ ઝડપ કેટલી, અને 10° બેન્કિંગ તેને કેવી રીતે બદલે?"}, "body": {"en": "<p>On a flat curve friction alone supplies the centripetal force, so v = √(μ r g) = √(0.35 × 80 × 9.8) = √274.4 = 16.6 m/s ≈ 60 km/h.</p><p>With 10° banking, tan θ = 0.176, and v_max = √(r g (μ + tan θ)/(1 − μ tan θ)) = √(784 × 0.526/0.938) = √439 = 21.0 m/s ≈ 75 km/h.</p><p>Banking therefore buys about 25 % more speed for the same tyres, which is why highway curves are tilted long before friction becomes the limiting factor.</p>", "gu": "<p>સપાટ વળાંક પર ફક્ત ઘર્ષણ કેન્દ્રગામી બળ પૂરું પાડે, તેથી v = √(μ r g) = √(0.35 × 80 × 9.8) = √274.4 = 16.6 m/s ≈ 60 km/h.</p><p>10° બેન્કિંગ સાથે tan θ = 0.176 અને v_max = √(r g (μ + tan θ)/(1 − μ tan θ)) = √(784 × 0.526/0.938) = √439 = 21.0 m/s ≈ 75 km/h.</p><p>તેથી બેન્કિંગ એ જ ટાયર માટે લગભગ 25 % વધુ ઝડપ આપે, અને તેથી જ હાઇવેના વળાંક ઘર્ષણ મર્યાદિત બને તે પહેલાં નમાવાય છે.</p>"}}, {"h": {"en": "Practice 12. Show that in uniform circular motion the speed is constant but the velocity is not.", "gu": "સરાવ 12. સમાન વર્તુળ ગતિમાં ઝડપ અચળ પણ વેગ અચળ નથી તે દર્શાવો."}, "body": {"en": "<p>Speed is the magnitude of velocity. In uniform circular motion the body covers equal arcs in equal times, so the magnitude v stays the same.</p><p>The direction of motion is always along the tangent, and the tangent turns as the body moves, so the velocity vector changes every instant.</p><p>That change of direction is the centripetal acceleration a = v²/r, directed towards the centre, and it is what the centripetal force produces.</p>", "gu": "<p>ઝડપ એ વેગનું મૂલ્ય છે. સમાન વર્તુળ ગતિમાં શરીર સમાન સમયમાં સમાન ચાપ કાપે, તેથી મૂલ્ય v અચળ રહે.</p><p>ગતિની દિશા હંમેશા સ્પર્શ રેખા પર હોય, અને શરીર ખસે તેમ સ્પર્શ રેખા ફરે, તેથી વેગ સદિશ દર ક્ષણે બદલાય.</p><p>દિશાનો એ ફેરફાર જ કેન્દ્રગામી પ્રવર્ગ a = v²/r છે, જે કેન્દ્ર તરફ છે, અને કેન્દ્રગામી બળ તે જ ઉત્પન્ન કરે છે.</p>"}}, {"h": {"en": "Practice 13. A 0.5 kg stone is whirled in a vertical circle of radius 1 m at 4 m/s. Find the tension at the top and at the bottom.", "gu": "સરાવ 13. 0.5 kg પથ્થર 1 m ત્રિજ્યાના ઊર્ધ્વ વર્તુળમાં 4 m/s પર ફેરવાય છે. ઉપર અને નીચે તણાવ શોધો."}, "body": {"en": "<p>At the top, tension and weight both act towards the centre: T + m g = m v²/r.</p><p>T = m v²/r − m g = 0.5 × 16/1 − 0.5 × 9.8 = 8 − 4.9 = 3.1 N.</p><p>At the bottom the weight points away, so T = m v²/r + m g = 8 + 4.9 = 12.9 N; the string is most likely to break at the bottom, which is why the cord is chosen for that value.</p><p>The minimum speed at the top follows from T = 0, giving v = √(r g) = 3.13 m/s: below that the stone leaves the circle instead of completing it.</p>", "gu": "<p>ઉપર તણાવ અને વજન બંને કેન્દ્ર તરફ લાગે: T + m g = m v²/r.</p><p>T = m v²/r − m g = 0.5 × 16/1 − 0.5 × 9.8 = 8 − 4.9 = 3.1 N.</p><p>નીચે વજન બહાર તરફ હોય, તેથી T = m v²/r + m g = 8 + 4.9 = 12.9 N; દોરી નીચે જ તૂટવાની સંભાવના વધુ હોય, તેથી દોરી એ મૂલ્ય માટે પસંદ કરાય.</p><p>ઉપર લઘુતમ ઝડપ T = 0 પરથી મળે, v = √(r g) = 3.13 m/s: તેનાથી ઓછી ઝડપે પથ્થર વર્તુળ પૂરું ન કરી શકે અને છૂટી જાય.</p>"}}, {"h": {"en": "Practice 14. Why must the least count of a speedometer-free measurement (rpm from a tachometer) be matched to the machine? Answer with the circular-motion relation.", "gu": "સરાવ 14. ટેકોમીટરથી મપાયેલી rpm ની ચોકસાઈ મશીનને અનુરૂપ કેમ હોવી જોઈએ? વર્તુળ ગતિના સંબંધથી જવાબ આપો."}, "body": {"en": "<p>The rim speed is v = r ω, so an error of 1 % in ω is an error of 1 % in v, but the centripetal load goes as ω², so an error of 1 % in speed becomes about 2 % in force and in stress.</p><p>A tachometer reading 2 % high therefore understates the stress on a grinding wheel or a turbine disc by about 4 %, which is the wrong side of a safety margin.</p><p>Calibration against a stroboscope or an optical tachometer keeps the reading honest, the same argument as for the vernier in Unit 1.</p>", "gu": "<p>કિનાર ઝડપ v = r ω છે, તેથી ω માં 1 % ભૂલ એ v માં 1 % ભૂલ છે, પણ કેન્દ્રગામી ભાર ω² પ્રમાણે હોવાથી ઝડપની 1 % ભૂલ બળ અને પ્રતિબળમાં લગભગ 2 % ભૂલ બને.</p><p>2 % વધુ વાંચતું ટેકોમીટર ઘંટી ચક્ર કે ટર્બાઇન ડિસ્ક પરના પ્રતિબળને લગભગ 4 % ઓછું આંકે, જે સલામતી માર્જિનની ખોટી બાજુ છે.</p><p>સ્ટ્રોબોસ્કોપ કે ઓપ્ટિકલ ટેકોમીટર સામે કેલિબ્રેશન વાંચન સાચું રાખે, જે યુનિટ 1 ના વર્નિયર જેવી જ દલીલ છે.</p>"}}]}], "diagrams": [{"id": "u2_momentum", "title": {"en": "Momentum before and after a collision", "gu": "અથડામણ પહેલાં અને પછીનું વેગમાન"}, "file": "diagrams/u2_momentum.svg", "caption": {"en": "Two trolleys: momentum is conserved, energy is not.", "gu": "બે ટ્રોલી: વેગમાન સંરક્ષિત રહે, ઊર્જા નહીં."}}, {"id": "u2_recoil", "title": {"en": "Recoil of a gun: total momentum stays zero", "gu": "બંદૂકનો રીકોઇલ: કુલ વેગમાન શૂન્ય જ રહે"}, "file": "diagrams/u2_recoil.svg", "caption": {"en": "A 20 g bullet at 400 m/s gives a 5 kg rifle 1.6 m/s of recoil.", "gu": "400 m/s પરની 20 g ગોળી 5 kg રાયફલને 1.6 m/s રીકોઇલ આપે."}}, {"id": "u2_angular", "title": {"en": "Angular displacement, velocity and acceleration", "gu": "કોણીય સ્થાનાંતરણ, વેગ અને પ્રવર્ગ"}, "file": "diagrams/u2_angular.svg", "caption": {"en": "One circle, three angular quantities and their linear links.", "gu": "એક વર્તુળ, ત્રણ કોણીય રાશિઓ અને તેમના રેખીય સંબંધ."}}, {"id": "u2_centripetal", "title": {"en": "Centripetal force points at the centre", "gu": "કેન્દ્રગામી બળ કેન્દ્ર તરફ હોય"}, "file": "diagrams/u2_centripetal.svg", "caption": {"en": "The velocity is tangential, the force and acceleration are radial.", "gu": "વેગ સ્પર્શીય, બળ અને પ્રવર્ગ ત્રિજ્યાકીય."}}, {"id": "u2_banking", "title": {"en": "Why a banked road holds a fast car", "gu": "બેન્ક કરેલો રસ્તો ઝડપી કારને કેમ સંભાળે"}, "file": "diagrams/u2_banking.svg", "caption": {"en": "Resolving N and m g gives tan θ = v²/rg.", "gu": "N અને m g ના ઘટકો પાડતાં tan θ = v²/rg મળે."}}], "equations": [{"title": {"en": "Momentum, impulse and collisions", "gu": "વેગમાન, આઘાત અને અથડામણ"}, "items": [{"name": {"en": "Linear momentum", "gu": "રેખીય વેગમાન"}, "f": "p = m v", "terms": {"en": "A vector along the velocity, unit kg·m/s.", "gu": "વેગની દિશામાં સદિશ, એકમ kg·m/s."}}, {"name": {"en": "Force", "gu": "બળ"}, "f": "F = dp/dt = m a", "terms": {"en": "Rate of change of momentum.", "gu": "વેગમાનના ફેરફારનો દર."}}, {"name": {"en": "Impulse", "gu": "આઘાત"}, "f": "J = F t = Δp = m(v − u)", "terms": {"en": "Same Δp over a longer time means a smaller force.", "gu": "એ જ Δp લાંબા સમયમાં એટલે નાનું બળ."}}, {"name": {"en": "Conservation of momentum", "gu": "વેગમાનનું સંરક્ષણ"}, "f": "m₁u₁ + m₂u₂ = m₁v₁ + m₂v₂", "terms": {"en": "Valid when no external force acts.", "gu": "બાહ્ય બળ ન હોય ત્યારે માન્ય."}}, {"name": {"en": "Recoil of a gun", "gu": "બંદૂકનો રીકોઇલ"}, "f": "V = − m v / M", "terms": {"en": "The gun moves back with the bullet's momentum.", "gu": "બંદૂક ગોળીના વેગમાન સાથે પાછી ખસે."}}]}, {"title": {"en": "Circular motion", "gu": "વર્તુળ ગતિ"}, "items": [{"name": {"en": "Arc and angle", "gu": "ચાપ અને કોણ"}, "f": "s = r θ", "terms": {"en": "θ must be in radians.", "gu": "θ રેડિયનમાં હોવો જોઈએ."}}, {"name": {"en": "Angular velocity", "gu": "કોણીય વેગ"}, "f": "ω = Δθ/Δt = 2π/T = 2πN/60", "terms": {"en": "N is revolutions per minute.", "gu": "N પ્રતિ મિનિટ પરિભ્રમણ છે."}}, {"name": {"en": "Angular acceleration", "gu": "કોણીય પ્રવર્ગ"}, "f": "α = Δω/Δt", "terms": {"en": "Unit rad/s².", "gu": "એકમ rad/s²."}}, {"name": {"en": "Line and circle", "gu": "રેખા અને વર્તુળ"}, "f": "v = r ω,  a = r α", "terms": {"en": "Rim speed and tangential acceleration.", "gu": "કિનારની ઝડપ અને સ્પર્શીય પ્રવર્ગ."}}, {"name": {"en": "Centripetal force", "gu": "કેન્દ્રગામી બળ"}, "f": "F = m v²/r = m r ω²", "terms": {"en": "Directed towards the centre.", "gu": "કેન્દ્ર તરફ દિશિત."}}, {"name": {"en": "Banking, no friction", "gu": "બેન્કિંગ, ઘર્ષણ વગર"}, "f": "tan θ = v²/(r g)", "terms": {"en": "Same angle for a cyclist leaning into the curve.", "gu": "વળાંકમાં નમતા સાયકલ સવાર માટે એ જ કોણ."}}, {"name": {"en": "Flat curve, friction only", "gu": "સપાટ વળાંક, ફક્ત ઘર્ષણ"}, "f": "v_max = √(μ r g)", "terms": {"en": "Wet roads lower μ and lower the limit.", "gu": "ભીના રસ્તા μ ઘટાડે અને મર્યાદા ઘટાડે."}}, {"name": {"en": "Banked curve with friction", "gu": "ઘર્ષણ સાથે બેન્ક કરેલો વળાંક"}, "f": "v_max = √(r g (μ + tan θ)/(1 − μ tan θ))", "terms": {"en": "Reduces to √(μ r g) when θ = 0.", "gu": "θ = 0 હોય તો √(μ r g) થાય."}}]}], "numericals": [{"id": "u2n01", "unit": 2, "h": {"en": "Momentum of a 1500 kg car at 20 m/s.", "gu": "20 m/s પર 1500 kg કારનું વેગમાન."}, "q": {"en": "A car of mass 1500 kg moves at 20 m/s. Find its linear momentum.", "gu": "1500 kg દ્રવ્યમાનની કાર 20 m/s પર ચાલે છે. તેનું રેખીય વેગમાન શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A car of mass 1500 kg moves at 20 m/s. Find its linear momentum.</p><h4>Step-by-step solution</h4><p>p = m v = 1500 × 20</p><p>= 30 000 kg·m/s, along the velocity.</p><h4>Answer</h4><p><b>30 000 kg·m/s</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>1500 kg દ્રવ્યમાનની કાર 20 m/s પર ચાલે છે. તેનું રેખીય વેગમાન શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>p = m v = 1500 × 20</p><p>= 30 000 kg·m/s, વેગની દિશામાં.</p><h4>જવાબ</h4><p><b>30 000 kg·m/s</b></p>"}, "answer": {"en": "30 000 kg·m/s", "gu": "30 000 kg·m/s"}}, {"id": "u2n02", "unit": 2, "h": {"en": "Impulse needed to stop that car in 5 s.", "gu": "તે કારને 5 sમાં ઊભી કરવા જરૂરી આઘાત."}, "q": {"en": "The same 1500 kg car at 20 m/s is brought to rest in 5 s. Find the impulse and the force.", "gu": "એ જ 1500 kg કાર 20 m/s થી 5 sમાં ઊભી કરાય છે. આઘાત અને બળ શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>The same 1500 kg car at 20 m/s is brought to rest in 5 s. Find the impulse and the force.</p><h4>Step-by-step solution</h4><p>Impulse J = Δp = 30 000 − 0 = 30 000 N·s</p><p>F = J/t = 30 000/5 = 6000 N</p><p>The force opposes the motion, so the car stops.</p><h4>Answer</h4><p><b>30 000 N·s and 6000 N</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>એ જ 1500 kg કાર 20 m/s થી 5 sમાં ઊભી કરાય છે. આઘાત અને બળ શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>આઘાત J = Δp = 30 000 − 0 = 30 000 N·s</p><p>F = J/t = 30 000/5 = 6000 N</p><p>બળ ગતિની વિરુદ્ધ છે, તેથી કાર ઊભી રહે.</p><h4>જવાબ</h4><p><b>30 000 N·s અને 6000 N</b></p>"}, "answer": {"en": "30 000 N·s and 6000 N", "gu": "30 000 N·s અને 6000 N"}}, {"id": "u2n03", "unit": 2, "h": {"en": "Change of momentum of a rebounding ball.", "gu": "પાછો ઉછળતા બોલના વેગમાનમાં ફેરફાર."}, "q": {"en": "A 0.15 kg ball hits a wall at 20 m/s and rebounds at 20 m/s opposite. Find the change of momentum and the force if contact lasts 0.02 s.", "gu": "0.15 kg નો બોલ 20 m/s પર દીવાલે અથડાઈને વિરુદ્ધ દિશામાં 20 m/s પર પાછો આવે છે. વેગમાનનો ફેરફાર અને 0.02 s સંપર્ક માટે બળ શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A 0.15 kg ball hits a wall at 20 m/s and rebounds at 20 m/s opposite. Find the change of momentum and the force if contact lasts 0.02 s.</p><h4>Step-by-step solution</h4><p>Take the incoming direction as positive: u = +20 m/s, v = −20 m/s.</p><p>Δp = m(v − u) = 0.15 × (−20 − 20) = −6 N·s</p><p>Magnitude 6 N·s; F = 6/0.02 = 300 N.</p><h4>Answer</h4><p><b>6 N·s and 300 N</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>0.15 kg નો બોલ 20 m/s પર દીવાલે અથડાઈને વિરુદ્ધ દિશામાં 20 m/s પર પાછો આવે છે. વેગમાનનો ફેરફાર અને 0.02 s સંપર્ક માટે બળ શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>આવતી દિશાને ધન ગણો: u = +20 m/s, v = −20 m/s.</p><p>Δp = m(v − u) = 0.15 × (−20 − 20) = −6 N·s</p><p>મૂલ્ય 6 N·s; F = 6/0.02 = 300 N.</p><h4>જવાબ</h4><p><b>6 N·s અને 300 N</b></p>"}, "answer": {"en": "6 N·s and 300 N", "gu": "6 N·s અને 300 N"}}, {"id": "u2n04", "unit": 2, "h": {"en": "Recoil velocity of a 5 kg rifle.", "gu": "5 kg રાયફલનો રીકોઇલ વેગ."}, "q": {"en": "A 20 g bullet leaves a 5 kg rifle at 400 m/s. Find the recoil velocity of the rifle.", "gu": "20 g ગોળી 5 kg રાયફલમાંથી 400 m/s પર નીકળે છે. રાયફલનો રીકોઇલ વેગ શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A 20 g bullet leaves a 5 kg rifle at 400 m/s. Find the recoil velocity of the rifle.</p><h4>Step-by-step solution</h4><p>Before firing, total momentum = 0.</p><p>After: m v + M V = 0, so V = −m v/M</p><p>V = −(0.020 × 400)/5 = −1.6 m/s</p><h4>Answer</h4><p><b>1.6 m/s backwards</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>20 g ગોળી 5 kg રાયફલમાંથી 400 m/s પર નીકળે છે. રાયફલનો રીકોઇલ વેગ શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>ચલાવતા પહેલાં કુલ વેગમાન = 0.</p><p>પછી: m v + M V = 0, તેથી V = −m v/M</p><p>V = −(0.020 × 400)/5 = −1.6 m/s</p><h4>જવાબ</h4><p><b>1.6 m/s પાછળ તરફ</b></p>"}, "answer": {"en": "1.6 m/s backwards", "gu": "1.6 m/s પાછળ તરફ"}}, {"id": "u2n05", "unit": 2, "h": {"en": "Two trolleys sticking together.", "gu": "ચોંટતી બે ટ્રોલી."}, "q": {"en": "A 2 kg trolley at 3 m/s collides with a stationary 1 kg trolley and they move together. Find the common velocity.", "gu": "2 kg ટ્રોલી 3 m/s પર સ્થિર 1 kg ટ્રોલી સાથે અથડાઈને સાથે ચાલે છે. સામાન્ય વેગ શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A 2 kg trolley at 3 m/s collides with a stationary 1 kg trolley and they move together. Find the common velocity.</p><h4>Step-by-step solution</h4><p>m₁u₁ + m₂u₂ = (m₁ + m₂)v</p><p>2 × 3 + 1 × 0 = 3 v</p><p>v = 6/3 = 2 m/s in the original direction</p><h4>Answer</h4><p><b>2 m/s</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>2 kg ટ્રોલી 3 m/s પર સ્થિર 1 kg ટ્રોલી સાથે અથડાઈને સાથે ચાલે છે. સામાન્ય વેગ શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>m₁u₁ + m₂u₂ = (m₁ + m₂)v</p><p>2 × 3 + 1 × 0 = 3 v</p><p>v = 6/3 = 2 m/s પહેલાની દિશામાં</p><h4>જવાબ</h4><p><b>2 m/s</b></p>"}, "answer": {"en": "2 m/s", "gu": "2 m/s"}}, {"id": "u2n06", "unit": 2, "h": {"en": "Shaft speed 300 rpm in rad/s.", "gu": "300 rpm શાફ્ટની ઝડપ rad/s માં."}, "q": {"en": "A shaft turns at 300 revolutions per minute. Find its angular velocity.", "gu": "શાફ્ટ 300 પરિભ્રમણ પ્રતિ મિનિટ ફરે છે. તેનો કોણીય વેગ શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A shaft turns at 300 revolutions per minute. Find its angular velocity.</p><h4>Step-by-step solution</h4><p>ω = 2πN/60</p><p>= 2π × 300/60 = 10π</p><p>= 31.4 rad/s</p><h4>Answer</h4><p><b>31.4 rad/s</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>શાફ્ટ 300 પરિભ્રમણ પ્રતિ મિનિટ ફરે છે. તેનો કોણીય વેગ શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>ω = 2πN/60</p><p>= 2π × 300/60 = 10π</p><p>= 31.4 rad/s</p><h4>જવાબ</h4><p><b>31.4 rad/s</b></p>"}, "answer": {"en": "31.4 rad/s", "gu": "31.4 rad/s"}}, {"id": "u2n07", "unit": 2, "h": {"en": "Rim speed of a 0.4 m pulley at 300 rpm.", "gu": "300 rpm પર 0.4 m ગરગડીની કિનાર ઝડપ."}, "q": {"en": "The pulley of radius 0.4 m is on the shaft of 31.4 rad/s. Find the speed of a point on its rim.", "gu": "0.4 m ત્રિજ્યાની ગરગડી 31.4 rad/s ની શાફ્ટ પર છે. તેની કિનાર પરના બિંદુની ઝડપ શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>The pulley of radius 0.4 m is on the shaft of 31.4 rad/s. Find the speed of a point on its rim.</p><h4>Step-by-step solution</h4><p>v = r ω = 0.4 × 31.4</p><p>= 12.6 m/s</p><h4>Answer</h4><p><b>12.6 m/s</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>0.4 m ત્રિજ્યાની ગરગડી 31.4 rad/s ની શાફ્ટ પર છે. તેની કિનાર પરના બિંદુની ઝડપ શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>v = r ω = 0.4 × 31.4</p><p>= 12.6 m/s</p><h4>જવાબ</h4><p><b>12.6 m/s</b></p>"}, "answer": {"en": "12.6 m/s", "gu": "12.6 m/s"}}, {"id": "u2n08", "unit": 2, "h": {"en": "Angular velocity for a period of 0.5 s.", "gu": "0.5 s આવર્તકાળ માટે કોણીય વેગ."}, "q": {"en": "A body completes one revolution in 0.5 s. Find its angular velocity and frequency.", "gu": "શરીર 0.5 sમાં એક પરિભ્રમણ પૂરું કરે છે. તેનો કોણીય વેગ અને આવૃત્તિ શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A body completes one revolution in 0.5 s. Find its angular velocity and frequency.</p><h4>Step-by-step solution</h4><p>ω = 2π/T = 2π/0.5</p><p>= 12.57 rad/s</p><p>n = 1/T = 2 Hz</p><h4>Answer</h4><p><b>12.57 rad/s and 2 Hz</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>શરીર 0.5 sમાં એક પરિભ્રમણ પૂરું કરે છે. તેનો કોણીય વેગ અને આવૃત્તિ શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>ω = 2π/T = 2π/0.5</p><p>= 12.57 rad/s</p><p>n = 1/T = 2 Hz</p><h4>જવાબ</h4><p><b>12.57 rad/s અને 2 Hz</b></p>"}, "answer": {"en": "12.57 rad/s and 2 Hz", "gu": "12.57 rad/s અને 2 Hz"}}, {"id": "u2n09", "unit": 2, "h": {"en": "Angular acceleration of a wheel spun up in 4 s.", "gu": "4 sમાં ઝડપ પકડતા ચક્રનો કોણીય પ્રવર્ગ."}, "q": {"en": "A wheel at rest reaches 20 rad/s in 4 s. Find its angular acceleration and the angle turned.", "gu": "સ્થિર ચક્ર 4 sમાં 20 rad/s પર પહોંચે છે. તેનો કોણીય પ્રવર્ગ અને ઘૂમેલો કોણ શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A wheel at rest reaches 20 rad/s in 4 s. Find its angular acceleration and the angle turned.</p><h4>Step-by-step solution</h4><p>α = (ω − ω₀)/t = 20/4 = 5 rad/s²</p><p>θ = ω₀t + ½αt² = 0 + ½ × 5 × 16 = 40 rad</p><p>40 rad is 6.37 revolutions.</p><h4>Answer</h4><p><b>5 rad/s² and 40 rad</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>સ્થિર ચક્ર 4 sમાં 20 rad/s પર પહોંચે છે. તેનો કોણીય પ્રવર્ગ અને ઘૂમેલો કોણ શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>α = (ω − ω₀)/t = 20/4 = 5 rad/s²</p><p>θ = ω₀t + ½αt² = 0 + ½ × 5 × 16 = 40 rad</p><p>40 રેડિયન એટલે 6.37 પરિભ્રમણ.</p><h4>જવાબ</h4><p><b>5 rad/s² અને 40 rad</b></p>"}, "answer": {"en": "5 rad/s² and 40 rad", "gu": "5 rad/s² અને 40 rad"}}, {"id": "u2n10", "unit": 2, "h": {"en": "Tangential acceleration on a 0.3 m wheel.", "gu": "0.3 m ચક્ર પર સ્પર્શીય પ્રવર્ગ."}, "q": {"en": "A wheel of radius 0.3 m has an angular acceleration of 2 rad/s². Find the tangential acceleration of a point on its rim.", "gu": "0.3 m ત્રિજ્યાના ચક્રનો કોણીય પ્રવર્ગ 2 rad/s² છે. કિનાર પરના બિંદુનો સ્પર્શીય પ્રવર્ગ શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A wheel of radius 0.3 m has an angular acceleration of 2 rad/s². Find the tangential acceleration of a point on its rim.</p><h4>Step-by-step solution</h4><p>a = r α = 0.3 × 2</p><p>= 0.6 m/s² along the tangent</p><h4>Answer</h4><p><b>0.6 m/s²</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>0.3 m ત્રિજ્યાના ચક્રનો કોણીય પ્રવર્ગ 2 rad/s² છે. કિનાર પરના બિંદુનો સ્પર્શીય પ્રવર્ગ શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>a = r α = 0.3 × 2</p><p>= 0.6 m/s² સ્પર્શની દિશામાં</p><h4>જવાબ</h4><p><b>0.6 m/s²</b></p>"}, "answer": {"en": "0.6 m/s²", "gu": "0.6 m/s²"}}, {"id": "u2n11", "unit": 2, "h": {"en": "Centripetal acceleration at 10 m/s on a 20 m circle.", "gu": "20 m વર્તુળ પર 10 m/s પર કેન્દ્રગામી પ્રવર્ગ."}, "q": {"en": "A body moves at 10 m/s on a circle of radius 20 m. Find its centripetal acceleration.", "gu": "શરીર 20 m ત્રિજ્યાના વર્તુળ પર 10 m/s પર ચાલે છે. તેનો કેન્દ્રગામી પ્રવર્ગ શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A body moves at 10 m/s on a circle of radius 20 m. Find its centripetal acceleration.</p><h4>Step-by-step solution</h4><p>a = v²/r = 10²/20</p><p>= 5 m/s² towards the centre</p><h4>Answer</h4><p><b>5 m/s²</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>શરીર 20 m ત્રિજ્યાના વર્તુળ પર 10 m/s પર ચાલે છે. તેનો કેન્દ્રગામી પ્રવર્ગ શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>a = v²/r = 10²/20</p><p>= 5 m/s² કેન્દ્ર તરફ</p><h4>જવાબ</h4><p><b>5 m/s²</b></p>"}, "answer": {"en": "5 m/s²", "gu": "5 m/s²"}}, {"id": "u2n12", "unit": 2, "h": {"en": "Tension in a string whirling a 0.2 kg stone.", "gu": "0.2 kg પથ્થર ફેરવતી દોરીમાં તણાવ."}, "q": {"en": "A 0.2 kg stone on a 0.5 m string moves at 4 m/s in a horizontal circle. Find the tension.", "gu": "0.5 m દોરી પરનો 0.2 kg પથ્થર સમક્ષિતિજ વર્તુળમાં 4 m/s પર ફરે છે. તણાવ શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A 0.2 kg stone on a 0.5 m string moves at 4 m/s in a horizontal circle. Find the tension.</p><h4>Step-by-step solution</h4><p>Centripetal force is supplied by the tension.</p><p>T = m v²/r = 0.2 × 16/0.5</p><p>= 6.4 N</p><h4>Answer</h4><p><b>6.4 N</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>0.5 m દોરી પરનો 0.2 kg પથ્થર સમક્ષિતિજ વર્તુળમાં 4 m/s પર ફરે છે. તણાવ શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>કેન્દ્રગામી બળ દોરીનો તણાવ પૂરો પાડે છે.</p><p>T = m v²/r = 0.2 × 16/0.5</p><p>= 6.4 N</p><h4>જવાબ</h4><p><b>6.4 N</b></p>"}, "answer": {"en": "6.4 N", "gu": "6.4 N"}}, {"id": "u2n13", "unit": 2, "h": {"en": "Maximum speed on a flat curve of 50 m, μ = 0.4.", "gu": "50 m સપાટ વળાંક પર મહત્તમ ઝડપ, μ = 0.4."}, "q": {"en": "A car takes a flat curve of radius 50 m where μ = 0.4. Find the maximum speed without skidding.", "gu": "કાર 50 m ત્રિજ્યાના સપાટ વળાંક પર ફરે છે જ્યાં μ = 0.4 છે. લપસ્યા વગરની મહત્તમ ઝડપ શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A car takes a flat curve of radius 50 m where μ = 0.4. Find the maximum speed without skidding.</p><h4>Step-by-step solution</h4><p>Friction supplies m v²/r and can be at most μ m g.</p><p>v² = μ r g = 0.4 × 50 × 9.8 = 196</p><p>v = 14 m/s = 50.4 km/h</p><h4>Answer</h4><p><b>14 m/s (about 50 km/h)</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>કાર 50 m ત્રિજ્યાના સપાટ વળાંક પર ફરે છે જ્યાં μ = 0.4 છે. લપસ્યા વગરની મહત્તમ ઝડપ શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>ઘર્ષણ m v²/r પૂરું પાડે અને વધુમાં વધુ μ m g હોઈ શકે.</p><p>v² = μ r g = 0.4 × 50 × 9.8 = 196</p><p>v = 14 m/s = 50.4 km/h</p><h4>જવાબ</h4><p><b>14 m/s (લગભગ 50 km/h)</b></p>"}, "answer": {"en": "14 m/s (about 50 km/h)", "gu": "14 m/s (લગભગ 50 km/h)"}}, {"id": "u2n14", "unit": 2, "h": {"en": "Banking angle for 20 m/s on a 100 m curve.", "gu": "100 m વળાંક પર 20 m/s માટે બેન્કિંગ કોણ."}, "q": {"en": "A curve of radius 100 m is designed for 20 m/s with no friction. Find the banking angle.", "gu": "100 m ત્રિજ્યાનો વળાંક ઘર્ષણ વગર 20 m/s માટે રચાય છે. બેન્કિંગ કોણ શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A curve of radius 100 m is designed for 20 m/s with no friction. Find the banking angle.</p><h4>Step-by-step solution</h4><p>tan θ = v²/(r g) = 400/(100 × 9.8)</p><p>= 0.408</p><p>θ = tan⁻¹ 0.408 = 22.2°</p><h4>Answer</h4><p><b>22.2°</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>100 m ત્રિજ્યાનો વળાંક ઘર્ષણ વગર 20 m/s માટે રચાય છે. બેન્કિંગ કોણ શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>tan θ = v²/(r g) = 400/(100 × 9.8)</p><p>= 0.408</p><p>θ = tan⁻¹ 0.408 = 22.2°</p><h4>જવાબ</h4><p><b>22.2°</b></p>"}, "answer": {"en": "22.2°", "gu": "22.2°"}}, {"id": "u2n15", "unit": 2, "h": {"en": "Lean of a cyclist at 5 m/s on a 10 m curve.", "gu": "10 m વળાંક પર 5 m/s પર સાયકલ સવારનું નમવું."}, "q": {"en": "A cyclist takes a curve of radius 10 m at 5 m/s. At what angle must he lean?", "gu": "સાયકલ સવાર 10 m ત્રિજ્યાનો વળાંક 5 m/s પર લે છે. તેણે કેટલા કોણે નમવું જોઈએ?"}, "a": {"en": "<h4>Given and assumptions</h4><p>A cyclist takes a curve of radius 10 m at 5 m/s. At what angle must he lean?</p><h4>Step-by-step solution</h4><p>tan θ = v²/(r g) = 25/(10 × 9.8)</p><p>= 0.255</p><p>θ = 14.3° from the vertical</p><h4>Answer</h4><p><b>14.3°</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>સાયકલ સવાર 10 m ત્રિજ્યાનો વળાંક 5 m/s પર લે છે. તેણે કેટલા કોણે નમવું જોઈએ?</p><h4>પગલાવાર ઉકેલ</h4><p>tan θ = v²/(r g) = 25/(10 × 9.8)</p><p>= 0.255</p><p>ઊર્ધ્વથી θ = 14.3°</p><h4>જવાબ</h4><p><b>14.3°</b></p>"}, "answer": {"en": "14.3°", "gu": "14.3°"}}, {"id": "u2n16", "unit": 2, "h": {"en": "Angle turned in 5 revolutions.", "gu": "5 પરિભ્રમણમાં ઘૂમેલો કોણ."}, "q": {"en": "A wheel makes 5 revolutions. Express the angular displacement in radians and degrees.", "gu": "ચક્ર 5 પરિભ્રમણ કરે છે. કોણીય સ્થાનાંતરણ રેડિયન અને અંશમાં દર્શાવો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A wheel makes 5 revolutions. Express the angular displacement in radians and degrees.</p><h4>Step-by-step solution</h4><p>θ = 5 × 2π = 10π</p><p>= 31.4 rad</p><p>= 5 × 360° = 1800°</p><h4>Answer</h4><p><b>31.4 rad = 1800°</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>ચક્ર 5 પરિભ્રમણ કરે છે. કોણીય સ્થાનાંતરણ રેડિયન અને અંશમાં દર્શાવો.</p><h4>પગલાવાર ઉકેલ</h4><p>θ = 5 × 2π = 10π</p><p>= 31.4 rad</p><p>= 5 × 360° = 1800°</p><h4>જવાબ</h4><p><b>31.4 rad = 1800°</b></p>"}, "answer": {"en": "31.4 rad = 1800°", "gu": "31.4 rad = 1800°"}}, {"id": "u2n17", "unit": 2, "h": {"en": "Angular velocity of the earth on its axis.", "gu": "પોતાની ધરી પર પૃથ્વીનો કોણીય વેગ."}, "q": {"en": "The earth turns once in 24 hours. Find its angular velocity.", "gu": "પૃથ્વી 24 કલાકમાં એક વાર ફરે છે. તેનો કોણીય વેગ શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>The earth turns once in 24 hours. Find its angular velocity.</p><h4>Step-by-step solution</h4><p>T = 24 × 3600 = 86 400 s</p><p>ω = 2π/T = 6.283/86 400</p><p>= 7.27 × 10⁻⁵ rad/s</p><h4>Answer</h4><p><b>7.27 × 10⁻⁵ rad/s</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>પૃથ્વી 24 કલાકમાં એક વાર ફરે છે. તેનો કોણીય વેગ શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>T = 24 × 3600 = 86 400 s</p><p>ω = 2π/T = 6.283/86 400</p><p>= 7.27 × 10⁻⁵ rad/s</p><h4>જવાબ</h4><p><b>7.27 × 10⁻⁵ rad/s</b></p>"}, "answer": {"en": "7.27 × 10⁻⁵ rad/s", "gu": "7.27 × 10⁻⁵ rad/s"}}, {"id": "u2n18", "unit": 2, "h": {"en": "Centripetal force on a 1200 kg car at 15 m/s on a 45 m curve.", "gu": "45 m વળાંક પર 15 m/s પર 1200 kg કાર પર કેન્દ્રગામી બળ."}, "q": {"en": "A 1200 kg car takes a curve of radius 45 m at 15 m/s. Find the centripetal force needed.", "gu": "1200 kg કાર 45 m ત્રિજ્યાનો વળાંક 15 m/s પર લે છે. જરૂરી કેન્દ્રગામી બળ શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A 1200 kg car takes a curve of radius 45 m at 15 m/s. Find the centripetal force needed.</p><h4>Step-by-step solution</h4><p>F = m v²/r = 1200 × 225/45</p><p>= 6000 N</p><p>That force must come from friction: μ needed = 6000/(1200 × 9.8) = 0.51.</p><h4>Answer</h4><p><b>6000 N (μ ≥ 0.51)</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>1200 kg કાર 45 m ત્રિજ્યાનો વળાંક 15 m/s પર લે છે. જરૂરી કેન્દ્રગામી બળ શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>F = m v²/r = 1200 × 225/45</p><p>= 6000 N</p><p>એ બળ ઘર્ષણમાંથી આવવું જોઈએ: જરૂરી μ = 6000/(1200 × 9.8) = 0.51.</p><h4>જવાબ</h4><p><b>6000 N (μ ≥ 0.51)</b></p>"}, "answer": {"en": "6000 N (μ ≥ 0.51)", "gu": "6000 N (μ ≥ 0.51)"}}, {"id": "u2n19", "unit": 2, "h": {"en": "Force on a wall from a ball bouncing every 0.5 s.", "gu": "દર 0.5 sે ઉછળતા બોલથી દીવાલ પર બળ."}, "q": {"en": "A 0.2 kg ball hits a wall at 10 m/s and rebounds at 10 m/s, repeating every 0.5 s. Find the average force on the wall.", "gu": "0.2 kg બોલ 10 m/s પર દીવાલે અથડાઈને 10 m/s પર પાછો આવે છે અને દર 0.5 sે પુનરાવર્તન થાય છે. દીવાલ પર સરેરાશ બળ શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A 0.2 kg ball hits a wall at 10 m/s and rebounds at 10 m/s, repeating every 0.5 s. Find the average force on the wall.</p><h4>Step-by-step solution</h4><p>Δp per hit = m(v − u) = 0.2 × (−10 − 10) = −4 kg·m/s</p><p>Average force = |Δp|/t = 4/0.5</p><p>= 8 N on the wall, opposite to the ball's return.</p><h4>Answer</h4><p><b>8 N</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>0.2 kg બોલ 10 m/s પર દીવાલે અથડાઈને 10 m/s પર પાછો આવે છે અને દર 0.5 sે પુનરાવર્તન થાય છે. દીવાલ પર સરેરાશ બળ શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>દરેક અથડામણમાં Δp = m(v − u) = 0.2 × (−10 − 10) = −4 kg·m/s</p><p>સરેરાશ બળ = |Δp|/t = 4/0.5</p><p>= 8 N દીવાલ પર, બોલના પરત ફરવાની વિરુદ્ધ.</p><h4>જવાબ</h4><p><b>8 N</b></p>"}, "answer": {"en": "8 N", "gu": "8 N"}}], "viva": [{"title": {"en": "Momentum and impulse", "gu": "વેગમાન અને આઘાત"}, "items": [{"q": {"en": "Define linear momentum and give its unit.", "gu": "રેખીય વેગમાનની વ્યાખ્યા આપો અને તેનો એકમ જણાવો."}, "a": {"en": "The product of mass and velocity, p = m v, a vector along the velocity, measured in kg·m/s.", "gu": "દ્રવ્યમાન અને વેગનો ગુણાકાર, p = m v, વેગની દિશામાં સદિશ, kg·m/s માં મપાય."}}, {"q": {"en": "State Newton's second law in terms of momentum.", "gu": "વેગમાનના સંદર્ભમાં ન્યૂટનનો બીજો નિયમ જણાવો."}, "a": {"en": "The rate of change of momentum of a body is equal to the applied force and takes place in the direction of the force: F = dp/dt.", "gu": "શરીરના વેગમાનના ફેરફારનો દર લાગુ બળ જેટલો હોય છે અને બળની દિશામાં થાય છે: F = dp/dt."}}, {"q": {"en": "What is impulse, and how is it useful in vehicle safety?", "gu": "આઘાત શું છે અને વાહન સલામતીમાં કેમ ઉપયોગી છે?"}, "a": {"en": "Impulse is force × time and equals the change of momentum. An airbag or crumple zone stretches the same Δp over a longer time, so the force on the body falls.", "gu": "આઘાત એટલે બળ × સમય અને તે વેગમાનના ફેરફાર જેટલો. એરબેગ કે ક્રમ્પલ ઝોન એ જ Δp લાંબા સમય સુધી ફેલાવે, તેથી શરીર પરનું બળ ઘટે."}}, {"q": {"en": "State the law of conservation of linear momentum.", "gu": "રેખીય વેગમાનના સંરક્ષણનો નિયમ જણાવો."}, "a": {"en": "If no external force acts on a system, the total linear momentum of the system stays constant, which gives m₁u₁ + m₂u₂ = m₁v₁ + m₂v₂ for two bodies.", "gu": "જો સિસ્ટમ પર બાહ્ય બળ ન લાગે તો કુલ રેખીય વેગમાન અચળ રહે, જે બે શરીરો માટે m₁u₁ + m₂u₂ = m₁v₁ + m₂v₂ આપે."}}, {"q": {"en": "Why does a gun recoil?", "gu": "બંદૂક પાછી કેમ ખસે?"}, "a": {"en": "The total momentum before firing is zero, so after firing the bullet's forward momentum must be balanced by the gun's backward momentum; the gun's velocity is smaller by the mass ratio M/m.", "gu": "ચલાવતા પહેલાં કુલ વેગમાન શૂન્ય છે, તેથી પછી ગોળીના આગળના વેગમાનની સામે બંદૂકના પાછળના વેગમાને સંતુલન કરવું પડે; દ્રવ્યમાન ગુણોત્તર M/m જેટલો બંદૂકનો વેગ નાનો હોય."}}, {"q": {"en": "Give one example of momentum conservation in engineering.", "gu": "ઇજનેરીમાં વેગમાન સંરક્ષણનું એક ઉદાહરણ આપો."}, "a": {"en": "A rocket: exhaust leaves backwards, so the rocket gains equal forward momentum; the same equation gives the thrust of a water jet or a hose.", "gu": "રોકેટ: એક્ઝોસ્ટ પાછળ નીકળે, તેથી રોકેટ સમાન આગળનું વેગમાન મેળવે; એ જ સમીકરણ પાણીના જેટ કે પાઇપનું થ્રસ્ટ આપે."}}]}, {"title": {"en": "Circular motion", "gu": "વર્તુળ ગતિ"}, "items": [{"q": {"en": "Define angular displacement and its unit.", "gu": "કોણીય સ્થાનાંતરણ અને તેનો એકમ જણાવો."}, "a": {"en": "The angle swept by the radius, measured in radians where one radian cuts an arc equal to the radius.", "gu": "ત્રિજ્યા દ્વારા ઘૂમાયેલો કોણ, રેડિયનમાં મપાય જ્યાં એક રેડિયન ત્રિજ્યા જેટલી ચાપ કાપે."}}, {"q": {"en": "Write the relation between linear and angular velocity.", "gu": "રેખીય અને કોણીય વેગ વચ્ચેનો સંબંધ લખો."}, "a": {"en": "v = r ω, with ω in rad/s; for a shaft at N rpm, ω = 2πN/60.", "gu": "v = r ω, ω rad/s માં; N rpm પરની શાફ્ટ માટે ω = 2πN/60."}}, {"q": {"en": "What is centripetal force, and who supplies it for a car on a curve?", "gu": "કેન્દ્રગામી બળ શું છે અને વળાંક પરની કાર માટે તે કોણ પૂરું પાડે?"}, "a": {"en": "The inward force F = m v²/r that keeps a body on the circle; for a car it is friction between the tyres and the road, helped by banking.", "gu": "શરીરને વર્તુળ પર રાખતું અંદર તરફનું બળ F = m v²/r; કાર માટે તે ટાયર અને રસ્તા વચ્ચેનું ઘર્ષણ છે, જેને બેન્કિંગ મદદ કરે."}}, {"q": {"en": "Is centrifugal force a real force?", "gu": "કેન્દ્રત્યાગી બળ સાચું બળ છે?"}, "a": {"en": "No. It is a pseudo force that appears only in a rotating frame, equal to m v²/r and directed outward; in the ground frame only the inward centripetal force exists.", "gu": "ના. તે આભાસી બળ છે જે ફક્ત ફરતી ફ્રેમમાં દેખાય, m v²/r જેટલું અને બહાર તરફ; જમીનની ફ્રેમમાં ફક્ત અંદર તરફનું કેન્દ્રગામી બળ હોય."}}, {"q": {"en": "Why are roads banked on curves?", "gu": "વળાંક પર રસ્તા કેમ બેન્ક કરાય?"}, "a": {"en": "Banking lets the normal reaction supply part of the centripetal force, so the curve can be taken faster and with less dependence on friction, which matters on wet roads.", "gu": "બેન્કિંગથી અભિલંબ પ્રતિક્રિયા કેન્દ્રગામી બળનો ભાગ પૂરો પાડે, તેથી વળાંક વધુ ઝડપે અને ઘર્ષણ પર ઓછા આધારે લઈ શકાય, જે ભીના રસ્તે મહત્વનું છે."}}, {"q": {"en": "At what angle does a cyclist lean, and why?", "gu": "સાયકલ સવાર કેટલા કોણે નમે છે અને કેમ?"}, "a": {"en": "He leans inward by θ with tan θ = v²/(r g) so that the resultant of weight and ground reaction passes through the centre of mass; otherwise the torque would topple the cycle.", "gu": "તે અંદર તરફ θ નમે છે જ્યાં tan θ = v²/(r g), જેથી વજન અને જમીનની પ્રતિક્રિયાનું પરિણામ દ્રવ્યમાન કેન્દ્રમાંથી પસાર થાય; નહીં તો ટોર્ક સાયકલ ઢોળી નાખે."}}]}], "exam_questions": [{"q": {"en": "Practice: State and explain the law of conservation of linear momentum with one example.", "gu": "સરાવ: રેખીય વેગમાનના સંરક્ષણનો નિયમ જણાવીને એક ઉદાહરણ સાથે સમજાવો."}, "marks": 4}, {"q": {"en": "Practice: Define impulse and show that it equals the change of momentum.", "gu": "સરાવ: આઘાતની વ્યાખ્યા આપો અને તે વેગમાનના ફેરફાર જેટલો છે તે દર્શાવો."}, "marks": 4}, {"q": {"en": "Practice: Explain the recoil of a gun using conservation of momentum.", "gu": "સરાવ: વેગમાનના સંરક્ષણનો ઉપયોગ કરીને બંદૂકનો રીકોઇલ સમજાવો."}, "marks": 4}, {"q": {"en": "Practice: Define angular displacement, angular velocity and angular acceleration, and give their relations with the linear quantities.", "gu": "સરાવ: કોણીય સ્થાનાંતરણ, કોણીય વેગ અને કોણીય પ્રવર્ગની વ્યાખ્યા આપી રેખીય રાશિઓ સાથેનો સંબંધ જણાવો."}, "marks": 5}, {"q": {"en": "Practice: Derive the expression for the banking angle of a road and state what happens when friction is also present.", "gu": "સરાવ: રસ્તાના બેન્કિંગ કોણનું સૂત્ર સાબિત કરો અને ઘર્ષણ હાજર હોય ત્યારે શું થાય તે જણાવો."}, "marks": 5}, {"q": {"en": "Practice: A car of 1200 kg takes a 45 m curve at 15 m/s. Find the centripetal force and the friction coefficient needed.", "gu": "સરાવ: 1200 kg કાર 45 m વળાંક 15 m/s પર લે છે. કેન્દ્રગામી બળ અને જરૂરી ઘર્ષણ ગુણાંક શોધો."}, "marks": 4}, {"q": {"en": "Practice: Why does a cyclist lean while turning? Derive the lean angle.", "gu": "સરાવ: સાયકલ સવાર વળાંક વખતે કેમ નમે છે? નમવાનું કોણ સાબિત કરો."}, "marks": 4}, {"q": {"en": "Practice: Distinguish between centripetal and centrifugal force.", "gu": "સરાવ: કેન્દ્રગામી અને કેન્દ્રત્યાગી બળ વચ્ચેનો ભેદ સમજાવો."}, "marks": 4}, {"q": {"en": "Practice: A shaft turns at 1200 rpm. Find ω, and
