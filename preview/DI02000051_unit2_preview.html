nd the share of methane.</p><h4>Step-by-step solution</h4><p>CO₂ = 100 × 1 = 100 t</p><p>CH₄ = 2 × 28 = 56 t CO₂e</p><p>N₂O = 0.1 × 265 = 26.5 t CO₂e</p><p>Total = 182.5 t CO₂e, and methane is 56 / 182.5 = 31 % of it</p><h4>Answer</h4><p><b>182.5 t CO₂e, of which 31 % is methane</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>એક કારખાનું વર્ષે 100 t CO₂, 2 t મિથેન અને 0.1 t નાઇટ્રસ ઓક્સાઇડ છોડે છે. GWP 1, 28 અને 265 વાપરીને CO₂ સમમૂલ્યમાં કુલ અને મિથેનનો હિસ્સો શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>CO₂ = 100 × 1 = 100 t</p><p>CH₄ = 2 × 28 = 56 t CO₂e</p><p>N₂O = 0.1 × 265 = 26.5 t CO₂e</p><p>કુલ = 182.5 t CO₂e, અને મિથેન તેના 56 / 182.5 = 31 % છે</p><h4>જવાબ</h4><p><b>182.5 t CO₂e, જેમાં 31 % મિથેન</b></p>"}, "answer": {"en": "182.5 t CO₂e, of which 31 % is methane", "gu": "182.5 t CO₂e, જેમાં 31 % મિથેન"}}, {"id": "u4n06", "unit": 4, "h": {"en": "Ocean acidification in numbers.", "gu": "આંકડામાં મહાસાગરનું અમ્લીકરણ."}, "q": {"en": "Surface ocean pH has fallen from 8.20 to 8.10. Find the change in hydrogen ion concentration and explain why it matters to shell-forming life.", "gu": "સપાટીના મહાસાગરનો pH 8.20થી 8.10 થયો છે. હાઇડ્રોજન આયન સાંદ્રતામાં ફેરફાર શોધો અને શેલ બનાવતા જીવો માટે તે કેમ મહત્ત્વનું છે તે સમજાવો."}, "a": {"en": "<h4>Given and assumptions</h4><p>Surface ocean pH has fallen from 8.20 to 8.10. Find the change in hydrogen ion concentration and explain why it matters to shell-forming life.</p><h4>Step-by-step solution</h4><p>[H⁺] = 10^(−pH), so the ratio is 10^(8.20 − 8.10) = 10^0.1 = 1.26</p><p>Hydrogen ions are up 26 %, so the water is 26 % more acidic even though pH moved 0.1</p><p>Corals and molluscs spend more energy building calcium carbonate and less on growth</p><h4>Answer</h4><p><b>A 26 % rise in hydrogen ions for a pH fall of 0.1</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>સપાટીના મહાસાગરનો pH 8.20થી 8.10 થયો છે. હાઇડ્રોજન આયન સાંદ્રતામાં ફેરફાર શોધો અને શેલ બનાવતા જીવો માટે તે કેમ મહત્ત્વનું છે તે સમજાવો.</p><h4>પગલાવાર ઉકેલ</h4><p>[H⁺] = 10^(−pH), તેથી ગુણોત્તર 10^(8.20 − 8.10) = 10^0.1 = 1.26</p><p>હાઇડ્રોજન આયન 26 % વધ્યા, તેથી pH 0.1 ખસ્યો છતાં પાણી 26 % વધુ અમ્લીય છે</p><p>પરવાળા અને શંખ કેલ્શિયમ કાર્બોનેટ બનાવવામાં વધુ ઊર્જા ખર્ચે અને વૃદ્ધિ પર ઓછી</p><h4>જવાબ</h4><p><b>pH 0.1ના ઘટાડા માટે હાઇડ્રોજન આયનમાં 26 % વધારો</b></p>"}, "answer": {"en": "A 26 % rise in hydrogen ions for a pH fall of 0.1", "gu": "pH 0.1ના ઘટાડા માટે હાઇડ્રોજન આયનમાં 26 % વધારો"}}, {"id": "u4n07", "unit": 4, "h": {"en": "Forest area needed to offset a coal station.", "gu": "કોલસા સ્ટેશનને સરભર કરવા જરૂરી વન વિસ્તાર."}, "q": {"en": "The station of 2.37 Mt CO₂ a year is to be offset by new forest that takes up 12 t of CO₂ per hectare a year. Find the area needed, and compare it with the 500 MW station's own land.", "gu": "વર્ષે 2.37 Mt CO₂ વાળા સ્ટેશનને પ્રતિ હેક્ટર વર્ષે 12 t CO₂ લેતા નવા વનથી સરભર કરવું છે. જરૂરી વિસ્તાર શોધો અને 500 MW સ્ટેશનની પોતાની જમીન સાથે સરખાવો."}, "a": {"en": "<h4>Given and assumptions</h4><p>The station of 2.37 Mt CO₂ a year is to be offset by new forest that takes up 12 t of CO₂ per hectare a year. Find the area needed, and compare it with the 500 MW station's own land.</p><h4>Step-by-step solution</h4><p>Area = 2.37 × 10⁶ / 12 = 1.98 × 10⁵ ha = about 1.98 lakh hectares</p><p>That is 1,980 km², about twice the area of Surat district</p><p>The station itself occupies about 4 km², so planting cannot replace closing it</p><h4>Answer</h4><p><b>About 1.98 lakh hectares (1,980 km²) every year</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>વર્ષે 2.37 Mt CO₂ વાળા સ્ટેશનને પ્રતિ હેક્ટર વર્ષે 12 t CO₂ લેતા નવા વનથી સરભર કરવું છે. જરૂરી વિસ્તાર શોધો અને 500 MW સ્ટેશનની પોતાની જમીન સાથે સરખાવો.</p><h4>પગલાવાર ઉકેલ</h4><p>વિસ્તાર = 2.37 × 10⁶ / 12 = 1.98 × 10⁵ હેક્ટર = લગભગ 1.98 લાખ હેક્ટર</p><p>તે 1,980 km² છે, લગભગ સુરત જિલ્લાના વિસ્તાર કરતાં બમણું</p><p>સ્ટેશન પોતે લગભગ 4 km² લે છે, તેથી વાવેતર તેને બંધ કરવાનો વિકલ્પ ન બને</p><h4>જવાબ</h4><p><b>દર વર્ષે લગભગ 1.98 લાખ હેક્ટર (1,980 km²)</b></p>"}, "answer": {"en": "About 1.98 lakh hectares (1,980 km²) every year", "gu": "દર વર્ષે લગભગ 1.98 લાખ હેક્ટર (1,980 km²)"}}, {"id": "u4n08", "unit": 4, "h": {"en": "Warming from a doubling of CO₂.", "gu": "CO₂ બમણું થવાથી ગરમી."}, "q": {"en": "Doubling CO₂ gives a forcing of 3.71 W/m². Find the equilibrium warming for climate sensitivities of 0.6, 0.8 and 1.2 °C per W/m² and comment on the range.", "gu": "CO₂ બમણું થવાથી 3.71 W/m² બળ મળે. પ્રતિ W/m² 0.6, 0.8 અને 1.2 °C સંવેદનશીલતા માટે સંતુલન ગરમી શોધો અને શ્રેણી પર ટિપ્પણી કરો."}, "a": {"en": "<h4>Given and assumptions</h4><p>Doubling CO₂ gives a forcing of 3.71 W/m². Find the equilibrium warming for climate sensitivities of 0.6, 0.8 and 1.2 °C per W/m² and comment on the range.</p><h4>Step-by-step solution</h4><p>For λ = 0.6: ΔT = 0.6 × 3.71 = 2.2 °C</p><p>For λ = 0.8: ΔT = 0.8 × 3.71 = 3.0 °C</p><p>For λ = 1.2: ΔT = 1.2 × 3.71 = 4.5 °C</p><p>The range 2.2-4.5 °C is the IPCC likely range; the water vapour feedback makes the high end likely</p><h4>Answer</h4><p><b>2.2, 3.0 and 4.5 °C, a likely range of 2.2 to 4.5 °C</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>CO₂ બમણું થવાથી 3.71 W/m² બળ મળે. પ્રતિ W/m² 0.6, 0.8 અને 1.2 °C સંવેદનશીલતા માટે સંતુલન ગરમી શોધો અને શ્રેણી પર ટિપ્પણી કરો.</p><h4>પગલાવાર ઉકેલ</h4><p>λ = 0.6 માટે: ΔT = 0.6 × 3.71 = 2.2 °C</p><p>λ = 0.8 માટે: ΔT = 0.8 × 3.71 = 3.0 °C</p><p>λ = 1.2 માટે: ΔT = 1.2 × 3.71 = 4.5 °C</p><p>2.2-4.5 °Cની શ્રેણી IPCCની સંભવિત શ્રેણી છે; પાણીની વરાળનો પ્રતિસંદર્શ ઊંચા અંતને સંભવિત બનાવે</p><h4>જવાબ</h4><p><b>2.2, 3.0 અને 4.5 °C, લગભગ 2.2 થી 4.5 °C શ્રેણી</b></p>"}, "answer": {"en": "2.2, 3.0 and 4.5 °C, a likely range of 2.2 to 4.5 °C", "gu": "2.2, 3.0 અને 4.5 °C, લગભગ 2.2 થી 4.5 °C શ્રેણી"}}, {"id": "u4n09", "unit": 4, "h": {"en": "Carbon capture with its energy penalty.", "gu": "ઊર્જા ખોટ સાથે કાર્બન પકડ."}, "q": {"en": "A 600 MW coal plant emits 0.9 t CO₂ per MWh at a 70 % capacity factor. A CCS unit captures 90 % of the CO₂ but uses 25 % of the plant's output. Find the CO₂ captured and the net output.", "gu": "600 MW કોલસા સ્ટેશન 70 % ક્ષમતા અવયવે પ્રતિ MWh 0.9 t CO₂ છોડે. CCS એકમ 90 % CO₂ પકડે પણ સ્ટેશનના ઉત્પાદનના 25 % વાપરે. પકડાયેલું CO₂ અને ચોખ્ખું ઉત્પાદન શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A 600 MW coal plant emits 0.9 t CO₂ per MWh at a 70 % capacity factor. A CCS unit captures 90 % of the CO₂ but uses 25 % of the plant's output. Find the CO₂ captured and the net output.</p><h4>Step-by-step solution</h4><p>Gross energy = 600 × 8,760 × 0.70 = 3.68 × 10⁶ MWh</p><p>CO₂ emitted = 3.68 × 10⁶ × 0.9 = 3.31 Mt; captured = 0.90 × 3.31 = 2.98 Mt</p><p>Net output = 600 × 0.75 = 450 MW, so 25 % of the capacity is spent on capture</p><p>Still 0.33 Mt escapes, so CCS cuts emissions by 90 % and not by 100 %</p><h4>Answer</h4><p><b>2.98 Mt captured, 450 MW net instead of 600 MW</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>600 MW કોલસા સ્ટેશન 70 % ક્ષમતા અવયવે પ્રતિ MWh 0.9 t CO₂ છોડે. CCS એકમ 90 % CO₂ પકડે પણ સ્ટેશનના ઉત્પાદનના 25 % વાપરે. પકડાયેલું CO₂ અને ચોખ્ખું ઉત્પાદન શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>કુલ ઊર્જા = 600 × 8,760 × 0.70 = 3.68 × 10⁶ MWh</p><p>છૂટેલું CO₂ = 3.68 × 10⁶ × 0.9 = 3.31 Mt; પકડાયું = 0.90 × 3.31 = 2.98 Mt</p><p>ચોખ્ખું ઉત્પાદન = 600 × 0.75 = 450 MW, તેથી 25 % ક્ષમતા પકડમાં જાય</p><p>હજી 0.33 Mt નીકળે, તેથી CCS ઉત્સર્જન 90 % ઘટાડે, 100 % નહીં</p><h4>જવાબ</h4><p><b>2.98 Mt પકડાયું, 600 MWને બદલે 450 MW ચોખ્ખું</b></p>"}, "answer": {"en": "2.98 Mt captured, 450 MW net instead of 600 MW", "gu": "2.98 Mt પકડાયું, 600 MWને બદલે 450 MW ચોખ્ખું"}}, {"id": "u4n10", "unit": 4, "h": {"en": "Per capita emissions and a fair share of the budget.", "gu": "માથાદીઠ ઉત્સર્જન અને બજેટનો ન્યાયી હિસ્સો."}, "q": {"en": "India emits about 3.0 Gt CO₂e a year for 1.42 billion people; the world emits 42 Gt for 8.0 billion. Compare the per capita figures and India's share of a 250 Gt budget on an equal per capita basis.", "gu": "ભારત 1.42 અબજ લોકો માટે વર્ષે લગભગ 3.0 Gt CO₂e છોડે છે; દુનિયા 8.0 અબજ માટે 42 Gt. માથાદીઠ આંકડા અને સમાન માથાદીઠ ધોરણે 250 Gt બજેટમાં ભારતનો હિસ્સો સરખાવો."}, "a": {"en": "<h4>Given and assumptions</h4><p>India emits about 3.0 Gt CO₂e a year for 1.42 billion people; the world emits 42 Gt for 8.0 billion. Compare the per capita figures and India's share of a 250 Gt budget on an equal per capita basis.</p><h4>Step-by-step solution</h4><p>India = 3.0 × 10⁹ / 1.42 × 10⁹ = 2.1 t per person a year</p><p>World = 42 × 10⁹ / 8.0 × 10⁹ = 5.25 t per person a year</p><p>Equal share of 250 Gt = 250 / 8.0 = 31 t per person in total; India has 1.42 × 31 = 44 Gt</p><p>At 3.0 Gt a year that share lasts about 15 years, so India's 2070 net-zero pledge is a development question, not only an energy one</p><h4>Answer</h4><p><b>2.1 t against 5.25 t per person; an equal share is 31 t per person</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>ભારત 1.42 અબજ લોકો માટે વર્ષે લગભગ 3.0 Gt CO₂e છોડે છે; દુનિયા 8.0 અબજ માટે 42 Gt. માથાદીઠ આંકડા અને સમાન માથાદીઠ ધોરણે 250 Gt બજેટમાં ભારતનો હિસ્સો સરખાવો.</p><h4>પગલાવાર ઉકેલ</h4><p>ભારત = 3.0 × 10⁹ / 1.42 × 10⁹ = 2.1 t પ્રતિ વ્યક્તિ વર્ષે</p><p>દુનિયા = 42 × 10⁹ / 8.0 × 10⁹ = 5.25 t પ્રતિ વ્યક્તિ વર્ષે</p><p>250 Gtનો સમાન હિસ્સો = 250 / 8.0 = 31 t પ્રતિ વ્યક્તિ કુલ; ભારતને 1.42 × 31 = 44 Gt</p><p>વર્ષે 3.0 Gt પર તે હિસ્સો લગભગ 15 વર્ષ ચાલે, તેથી ભારતનું 2070 નેટ-ઝીરો વચન ફક્ત ઊર્જાનો નહીં, વિકાસનો પ્રશ્ન છે</p><h4>જવાબ</h4><p><b>પ્રતિ વ્યક્તિ 2.1 t સામે 5.25 t; સમાન હિસ્સો પ્રતિ વ્યક્તિ 31 t</b></p>"}, "answer": {"en": "2.1 t against 5.25 t per person; an equal share is 31 t per person", "gu": "પ્રતિ વ્યક્તિ 2.1 t સામે 5.25 t; સમાન હિસ્સો પ્રતિ વ્યક્તિ 31 t"}}], "viva": [{"title": {"en": "Science and evidence", "gu": "વિજ્ઞાન અને પુરાવા"}, "items": [{"q": {"en": "What is the greenhouse effect and why is it necessary?", "gu": "હરિતગૃહ પ્રભાવ શું છે અને તે કેમ આવશ્યક છે?"}, "a": {"en": "Short-wave sunlight passes through the atmosphere and warms the surface; the surface re-emits that energy as long-wave infrared, which water vapour, CO₂, methane and nitrous oxide absorb and re-radiate, half of it back downwards. Without this natural effect the mean surface temperature would be about −18 °C instead of 15 °C, and liquid water and life as we know it would not exist. The problem is the extra trapping we add by raising the concentration of those gases.", "gu": "ટૂંકી તરંગલંબાઈનો સૂર્યપ્રકાશ વાતાવરણમાંથી પસાર થઈ સપાટીને ગરમ કરે; સપાટી તે ઊર્જા લાંબી તરંગલંબાઈના ઇન્ફ્રારેડ તરીકે પાછી ફેંકે, જે પાણીની વરાળ, CO₂, મિથેન અને નાઇટ્રસ ઓક્સાઇડ શોષી ફરી કિરણોત્સર્ગ કરે, અડધું નીચે. આ કુદરતી પ્રભાવ વગર સરેરાશ સપાટીનું તાપમાન 15 °Cને બદલે લગભગ −18 °C હોત, અને પ્રવાહી પાણી તથા આપણે જાણીએ તેવું જીવન ન હોત. સમસ્યા તે વાયુઓની સાંદ્રતા વધારીને આપણે ઉમેરતું વધારાનું રોકાણ છે."}}, {"q": {"en": "How do we know the warming is caused by greenhouse gases and not by the sun?", "gu": "ગરમી સૂર્યથી નહીં પણ હરિતગૃહ વાયુથી છે તે આપણે કેવી રીતે જાણીએ?"}, "a": {"en": "Three fingerprints. First, the pattern with height: greenhouse gases warm the troposphere and cool the stratosphere, while a brighter sun would warm both. Second, the pattern in time: nights warm faster than days and winters faster than summers, which a stronger sun does not do. Third, the spectrum measured from space shows less outgoing infrared at exactly the wavelengths that CO₂ and methane absorb. Satellites also measure the total solar output directly and find no upward trend since 1980, while the earth has warmed about 0.6 °C in that time.", "gu": "ત્રણ અંગૂઠાનાં નિશાન. પ્રથમ, ઊંચાઈ પ્રમાણેનો નમૂનો: હરિતગૃહ વાયુ ટ્રોપોસ્ફિયરને ગરમ અને સ્ટ્રેટોસ્ફિયરને ઠંડું કરે, જ્યારે તેજસ્વી સૂર્ય બંનેને ગરમ કરે. બીજું, સમય પ્રમાણેનો નમૂનો: દિવસ કરતાં રાત અને ઉનાળા કરતાં શિયાળો ઝડપથી ગરમ થાય, જે વધુ તાકાતવાન સૂર્ય ન કરે. ત્રીજું, અવકાશથી માપેલા વર્ણપટમાં બરાબર તે તરંગલંબાઈ પર ઓછું ઇન્ફ્રારેડ નીકળે જે CO₂ અને મિથેન શોષે. ઉપગ્રહો કુલ સૌર ઉત્પાદન પણ સીધું માપે અને 1980થી ઉપરનો ટ્રેન્ડ જોતા નથી, જ્યારે પૃથ્વી તે સમયમાં લગભગ 0.6 °C ગરમ થઈ છે."}}, {"q": {"en": "What are the main greenhouse gases and their sources?", "gu": "મુખ્ય હરિતગૃહ વાયુ અને તેમના સ્રોત કયા છે?"}, "a": {"en": "CO₂ from coal, oil, gas, cement and land clearing is the largest, at about 64 % of the warming. Methane at 28 times the strength comes from cattle, rice paddies, landfills, coal mines and gas leaks, and 17 % of the warming. Nitrous oxide at 265 times comes mainly from nitrogen fertiliser and manure, 6 %. Fluorinated gases from refrigeration and air conditioning are thousands of times stronger but small in mass, 3 %. Water vapour is the strongest absorber of all, but it is a feedback rather than a forcing.", "gu": "કોલસો, તેલ, ગેસ, સિમેન્ટ અને જમીન સફાઈમાંથી CO₂ સૌથી મોટું છે, લગભગ 64 % ગરમી. 28 ગણા શક્તિશાળી મિથેન ઢોર, ડાંગરનાં ખેતર, કચરાભરાવ, કોલસાની ખાણ અને ગેસ લીકેજમાંથી આવે અને 17 % ગરમી. 265 ગણું નાઇટ્રસ ઓક્સાઇડ મુખ્યત્વે નાઇટ્રોજન ખાતર અને છાણમાંથી, 6 %. ઠંડક અને વાતાનુકૂલનના ફ્લોરિનવાળા વાયુ હજારો ગણા શક્તિશાળી પણ દળમાં નાના, 3 %. પાણીની વરાળ સૌથી શક્તિશાળી શોષક છે, પણ તે બળ નહીં, પ્રતિસંદર્શ છે."}}, {"q": {"en": "What is albedo and how does melting ice change it?", "gu": "આલ્બેડો શું છે અને બરફ પીગળવાથી તે કેવી રીતે બદલાય?"}, "a": {"en": "Albedo is the fraction of sunlight a surface reflects. Fresh snow reflects 80-90 %, sea ice 50-70 %, forest 10-15 %, bare soil 20-30 % and open ocean only 6 %. When white ice melts it exposes darker water or land, which absorbs the energy instead of reflecting it, so the surface warms further and melts more ice. This ice-albedo feedback is why the Arctic warms three to four times faster than the global average and why losing summer sea ice matters far more than its area suggests.", "gu": "આલ્બેડો એ સપાટી જે પ્રમાણમાં સૂર્યપ્રકાશ પરાવર્તિત કરે તે છે. તાજો બરફ 80-90 %, દરિયાઈ બરફ 50-70 %, વન 10-15 %, ખુલ્લી જમીન 20-30 % અને ખુલ્લો મહાસાગર ફક્ત 6 % પરાવર્તિત કરે. સફેદ બરફ પીગળે ત્યારે ઘેરું પાણી કે જમીન ખુલે, જે ઊર્જા પરાવર્તિત કરવાને બદલે શોષે, તેથી સપાટી વધુ ગરમ થાય અને વધુ બરફ પીગળે. આ બરફ-આલ્બેડો પ્રતિસંદર્શને કારણે જ આર્કટિક વૈશ્વિક સરેરાશ કરતાં ત્રણથી ચાર ગણું ઝડપથી ગરમ થાય અને ઉનાળાનો દરિયાઈ બરફ ગુમાવવો તેના વિસ્તાર કરતાં ઘણો વધુ મહત્ત્વનો છે."}}, {"q": {"en": "What is a carbon budget and why is it used?", "gu": "કાર્બન બજેટ શું છે અને તે કેમ વપરાય છે?"}, "a": {"en": "It is the total amount of CO₂ that can still be released while keeping warming below a chosen limit, and it exists because the temperature responds to the cumulative total, not to the emissions in any one year. About 250 Gt remain for a good chance of 1.5 °C and about 1,150 Gt for 2 °C, against 42 Gt a year today. It is used because it turns a vague promise into an arithmetic test: at the present rate the 1.5 °C budget lasts about six years, which is why every year of delay makes the later cuts steeper.", "gu": "તે એ કુલ CO₂ છે જે પસંદ કરેલી મર્યાદાથી નીચે ગરમી રાખવા હજી છોડી શકાય, અને તે એટલા માટે છે કે તાપમાન કુલ સરવાળા પર પ્રતિક્રિયા આપે, કોઈ એક વર્ષના ઉત્સર્જન પર નહીં. 1.5 °Cની સારી શક્યતા માટે લગભગ 250 Gt અને 2 °C માટે લગભગ 1,150 Gt બાકી છે, આજે વર્ષે 42 Gt સામે. તે વપરાય કારણ કે અસ્પષ્ટ વચનને ગણિતની કસોટીમાં ફેરવે: હાલના દરે 1.5 °Cનું બજેટ લગભગ છ વર્ષ ચાલે, તેથી જ દરેક વર્ષની મોડ પછીના ઘટાડા વધુ તીવ્ર કરે."}}]}, {"title": {"en": "Impacts and mitigation", "gu": "અસરો અને શમન"}, "items": [{"q": {"en": "Why do extreme events change even when the average moves only a little?", "gu": "સરેરાશ થોડું જ ખસે તો પણ આત્યંતિક ઘટનાઓ કેમ બદલાય?"}, "a": {"en": "Because the extremes sit in the tails of a distribution. A shift of the whole curve by one degree moves the tail much further in probability terms: an event that happened once in fifty years may become once in ten. In addition, warmer air holds about 7 % more water vapour per degree, so when it does rain the total can be heavier. That is why the record shows more heat records than cold ones and more one-day rainfall extremes even where the annual total has not changed.", "gu": "કારણ કે આત્યંતિક ઘટનાઓ વિતરણની પૂંછડીમાં બેસે છે. આખી વણકર એક ડિગ્રીે ખસે તો શક્યતાની દૃષ્ટિએ પૂંછડી ઘણે દૂર ખસે: પચાસ વર્ષે એક વારની ઘટના દસ વર્ષે એક વાર બની શકે. વધુમાં, ગરમ હવા દરેક ડિગ્રીે લગભગ 7 % વધુ પાણીની વરાળ ધરે, તેથી જ્યારે વરસે ત્યારે કુલ ભારે હોઈ શકે. તેથી જ રેકોર્ડમાં ઠંડા કરતાં વધુ ગરમ રેકોર્ડ અને એક દિવસના વરસાદની વધુ ચરમસીમા દેખાય, જ્યાં વાર્ષિક કુલ ન બદલ્યું હોય ત્યાં પણ."}}, {"q": {"en": "What is ocean acidification and how is it different from warming?", "gu": "મહાસાગરનું અમ્લીકરણ શું છે અને તે ગરમીથી કેવી રીતે જુદું છે?"}, "a": {"en": "It is a chemical change, not a thermal one. The CO₂ that dissolves in sea water forms carbonic acid, which releases hydrogen ions and lowers pH from 8.2 to 8.1 - a 26 % rise in acidity. Warming is about heat; acidification is about chemistry, and cooling the ocean would not reverse it. The consequence is that corals, oysters and some plankton find it harder to build calcium carbonate shells and skeletons, so reefs grow more slowly and dissolve faster, which threatens fish nurseries and coastal protection.", "gu": "તે ઉષ્મીય નહીં, રાસાયણિક ફેરફાર છે. દરિયાના પાણીમાં ઓગળતું CO₂ કાર્બોનિક એસિડ બનાવે, જે હાઇડ્રોજન આયન છોડે અને pH 8.2થી 8.1 કરે - અમ્લતામાં 26 % વધારો. ગરમી ઉષ્મા વિશે છે; અમ્લીકરણ રસાયણ વિશે છે, અને મહાસાગરને ઠંડો કરવાથી તે ઊલટાવાય નહીં. પરિણામ એ છે કે પરવાળા, ઓઇસ્ટર અને કેટલાક પ્લવકને કેલ્શિયમ કાર્બોનેટ શેલ અને હાડપિંજર બનાવવું મુશ્કેલ થાય, તેથી ભરતી ધીમે વધે અને ઝડપથી ઓગળે, જે માછલીના બચ્ચાં અને કિનારાના રક્ષણને ધમકાવે."}}, {"q": {"en": "What is desertification and how is it linked to climate change?", "gu": "મરુસ્થલીકરણ શું છે અને તે જળવાયુ પરિવર્તન સાથે કેવી રીતે જોડાય છે?"}, "a": {"en": "It is the degradation of land in dry regions - loss of vegetation, soil and productivity - caused by overgrazing, deforestation, bad irrigation, salt build-up and repeated drought. Climate change amplifies it because higher temperature raises evaporation from already dry soil, so the same rainfall produces less growth and a dry spell becomes a failed crop. About 40 % of India's land is degraded to some degree, and the loss pushes families from Kutch, Rajasthan and the Deccan towards cities.", "gu": "તે સૂકા વિસ્તારોમાં જમીનનો ક્ષય છે - વનસ્પતિ, જમીન અને ઉત્પાદકતાનું નુકસાન - જે વધુ ચરાવાણ, વનનાબૂદી, ખરાબ સિંચાઈ, ક્ષારનો સંગ્રહ અને વારંવારના દુષ્કાળથી થાય. જળવાયુ પરિવર્તન તેને વધારે કારણ કે ઊંચું તાપમાન પહેલેથી સૂકી જમીનમાંથી બાષ્પીભવન વધારે, તેથી એ જ વરસાદ ઓછી વૃદ્ધિ આપે અને સૂકો સમય નિષ્ફળ પાક બને. ભારતની લગભગ 40 % જમીન અમુક અંશે ક્ષીણ છે, અને નુકસાન કચ્છ, રાજસ્થાન અને દક્કનના કુટુંબોને શહેરો તરફ ધકેલે છે."}}, {"q": {"en": "Distinguish mitigation from adaptation with two examples each.", "gu": "શમન અને અનુકૂલનને દરેકના બે ઉદાહરણ સાથે જુદા પાડો."}, "a": {"en": "Mitigation attacks the cause by cutting emissions: a solar plant replacing coal generation, or a bus fleet shifted to electric. Adaptation accepts that the warming is already here and reduces the damage: a heat action plan that opens cooling shelters and changes working hours, or a coastal embankment and mangrove belt against storm surge. Mitigation is global in benefit and slow to show; adaptation is local and immediate. A country must do both, and India's National Action Plan on Climate Change has separate missions for each.", "gu": "શમન કારણ પર હુમલો કરે, ઉત્સર્જન ઘટાડીને: કોલસા ઉત્પાદનને બદલતું સૌર સ્ટેશન, કે ઇલેક્ટ્રિક થયેલી બસ સેવા. અનુકૂલન સ્વીકારે કે ગરમી પહેલેથી છે અને નુકસાન ઘટાડે: ઠંડા આશ્રય ખોલતી અને કામનો સમય બદલતી ગરમી કાર્ય યોજના, કે તોફાની ભરતી સામે કિનારાનો બંધ અને કાંદા (મેનગ્રોવ)નો પટ્ટો. શમનનો લાભ વૈશ્વિક અને દેખાવા માટે ધીમો; અનુકૂલન સ્થાનિક અને તાત્કાલિક. દેશે બંને કરવાં પડે, અને ભારતની રાષ્ટ્રીય જળવાયુ કાર્ય યોજનામાં દરેક માટે અલગ મિશન છે."}}, {"q": {"en": "How does carbon capture and storage work, and what are its limits?", "gu": "કાર્બન પકડ અને સંગ્રહ કેવી રીતે ચાલે અને તેની મર્યાદા શું છે?"}, "a": {"en": "CO₂ is separated from the flue gas by an amine solvent, a membrane or oxy-fuel burning, compressed to about 100 bar, transported by pipeline and injected 1-3 km down into a saline aquifer or a depleted gas field where a cap rock seals it. Limits: the capture unit uses 20-30 % of the plant's energy, so more fuel is burnt for the same output; capture efficiency is 85-95 %, so some CO₂ still escapes; pipelines, storage sites and monitoring cost money; and a leak or a well failure would release the stored gas. It is essential for cement and steel, where the CO₂ comes from the chemistry, and should not be used to keep an old coal station alive.", "gu": "CO₂ ને એમાઇન દ્રાવક, પડદો કે ઓક્સી-ફ્યુઅલ દહનથી ધુમાડામાંથી અલગ કરાય, લગભગ 100 bar સુધી દબાવાય, પાઇપલાઇનથી લઈ જઈ 1-3 km નીચે ખારા જળાશય કે ખાલી ગેસ ક્ષેત્રમાં દબાવાય જ્યાં ઢાંકણ ખડક તેને સીલ કરે. મર્યાદા: પકડ એકમ સ્ટેશનની 20-30 % ઊર્જા વાપરે, તેથી એ જ ઉત્પાદન માટે વધુ ઇંધણ બળે; પકડ કાર્યક્ષમતા 85-95 % છે, તેથી થોડું CO₂ હજી નીકળે; પાઇપલાઇન, સંગ્રહ સ્થળ અને દેખરેખ પૈસા માંગે; અને લીકેજ કે કૂવાની નિષ્ફળતા સંગ્રહેલો ગેસ છોડે. સિમેન્ટ અને પોલાદ માટે તે આવશ્યક છે, જ્યાં CO₂ રસાયણમાંથી આવે, અને જૂનું કોલસા સ્ટેશન જીવતું રાખવા વાપરવું ન જોઈએ."}}, {"q": {"en": "Why is energy efficiency called the first fuel?", "gu": "ઊર્જા કાર્યક્ષમતાને પ્રથમ ઇંધણ કેમ કહેવાય?"}, "a": {"en": "Because a unit of energy saved needs no fuel, no plant, no land, no transmission line and no subsidy, and it produces no emissions. It is almost always the cheapest option per tonne of CO₂ and is available immediately: an LED lamp, a five-star air conditioner, an efficient pump, a variable speed drive on a motor. The saved energy also multiplies down the system - a smaller load needs a smaller transformer, a smaller solar plant and fewer batteries - which is why efficiency is counted before any new supply in every serious climate plan.", "gu": "કારણ કે બચેલો ઊર્જા એકમ કોઈ ઇંધણ, સ્ટેશન, જમીન, ટ્રાન્સમિશન લાઇન કે સબસિડી માંગતો નથી અને કોઈ ઉત્સર્જન કરતો નથી. તે લગભગ હંમેશા પ્રતિ ટન CO₂ સૌથી સસ્તો વિકલ્પ હોય અને તરત ઉપલબ્ધ હોય: LED દીવો, પાંચ સ્ટાર એરકન્ડીશનર, કાર્યક્ષમ પંપ, મોટર પર ચલ ગતિ ડ્રાઇવ. બચેલી ઊર્જા આખી પ્રણાલીમાં ગુણાકાર કરે - નાનો ભાર નાનું ટ્રાન્સફોર્મર, નાનું સૌર સ્ટેશન અને ઓછી બેટરી માંગે - તેથી જ દરેક ગંભીર જળવાયુ યોજનામાં કાર્યક્ષમતા કોઈ પણ નવા પુરવઠા પહેલાં ગણાય."}}, {"q": {"en": "What does net zero mean, and why is 2070 India's target?", "gu": "નેટ ઝીરો એટલે શું, અને 2070 ભારતનું લક્ષ્ય કેમ છે?"}, "a": {"en": "Net zero means the CO₂ still released is balanced by the CO₂ removed by forests, soils and engineered sinks, so the net addition to the atmosphere is zero. It is not the same as zero emissions, which is impossible for cement, steel and aviation with today's technology. India chose 2070 because the country still needs to build houses, steel and power for a growing population, and a 2050 date would have meant importing the technology and paying for it before the economy could afford it; 2070 with 500 GW of non-fossil capacity by 2030 and a 45 % cut in emission intensity is the development path that also cuts carbon.", "gu": "નેટ ઝીરો એટલે હજી છૂટતું CO₂ વન, જમીન અને ઇજનેરી શોષક દૂર કરે તેના દ્વારા સંતુલિત થાય, તેથી વાતાવરણમાં ચોખ્ખો ઉમેરો શૂન્ય. તે શૂન્ય ઉત્સર્જન નથી, જે આજની ટેક્નોલોજીથી સિમેન્ટ, પોલાદ અને વિમાન માટે અશક્ય છે. ભારતે 2070 પસંદ કર્યું કારણ કે દેશે વધતી વસ્તી માટે હજી ઘર, પોલાદ અને વીજળી બાંધવાં છે, અને 2050ની તારીખનો અર્થ ટેક્નોલોજી આયાત કરીને અર્થતંત્ર પરવડે તે પહેલાં ભરપાઈ કરવો થાત; 2030 સુધીમાં 500 GW બિન-અશ્મીય ક્ષમતા અને ઉત્સર્જન તીવ્રતામાં 45 % ઘટાડા સાથે 2070 એ વિકાસનો રસ્તો છે જે કાર્બન પણ ઘટાડે."}}, {"q": {"en": "Why is methane called a short-lived but powerful lever?", "gu": "મિથેનને ટૂંકા આયુષ્યનો પણ શક્તિશાળી લિવર કેમ કહેવાય?"}, "a": {"en": "Methane absorbs about 28 times more heat than CO₂ over a century, but its lifetime in the air is only about twelve years, because sunlight and the hydroxyl radical destroy it. That short life is the good news: cutting a methane source gives almost the whole benefit within a decade, whereas a CO₂ cut accumulates slowly. It is therefore the fastest way to slow the rate of warming and to reduce peak temperature, which is why landfill capping, preventing gas leaks and better manure and paddy management appear at the top of every cheap-abatement list.", "gu": "મિથેન સદીમાં CO₂ કરતાં લગભગ 28 ગણી વધુ ઉષ્મા શોષે, પણ હવામાં તેનું આયુષ્ય ફક્ત લગભગ બાર વર્ષ છે, કારણ કે સૂર્યપ્રકાશ અને હાઇડ્રોક્સિલ રેડિકલ તેને નષ્ટ કરે. તે ટૂંકું આયુષ્ય સારા સમાચાર છે: મિથેનનો સ્રોત ઘટાડવાથી લગભગ આખો લાભ દાયકામાં મળે, જ્યારે CO₂નો ઘટાડો ધીમે એકઠો થાય. તેથી તે ગરમીનો દર ધીમો કરવાનો અને ટોચનું તાપમાન ઘટાડવાનો સૌથી ઝડપી રસ્તો છે, અને તેથી જ કચરાભરાવ ઢાંકવો, ગેસ લીકેજ અટકાવવું અને છાણ તથા ડાંગરનું સારું સંચાલન દરેક સસ્તા-ઘટાડાની યાદીમાં ટોચે આવે."}}, {"q": {"en": "What is climate justice?", "gu": "જળવાયુ ન્યાય એટલે શું?"}, "a": {"en": "It is the observation that the people who caused least of the emissions suffer most of the damage, and can afford least of the protection. A farmer in Kutch or Bihar faces failed rain while a high-consuming household in a serviced city does not, and the countries that industrialised first have already used most of the carbon budget. Climate justice therefore argues for finance and technology transfer from rich to poor countries, for loss-and-damage funds, and for the UNFCCC principle of common but differentiated responsibilities and respective capabilities.", "gu": "તે એ નિરીક્ષણ છે કે જેણે સૌથી ઓછું ઉત્સર્જન કર્યું તે સૌથી વધુ નુકસાન સહે છે અને સૌથી ઓછું રક્ષણ પરવડી શકે છે. કચ્છ કે બિહારનો ખેડૂત નિષ્ફળ વરસાદ સહે જ્યારે સેવાવાળા શહેરનું વધુ વપરાશકર્તા કુટુંબ નહીં, અને જેણે પહેલાં ઉદ્યોગીકરણ કર્યું તે દેશોએ કાર્બન બજેટનો મોટો ભાગ પહેલેથી વાપરી લીધો છે. તેથી જળવાયુ ન્યાય શ્રીમંત દેશોમાંથી ગરીબ દેશો તરફ નાણું અને ટેક્નોલોજીના હસ્તાંતરણ, નુકસાન-વળતર ફંડ અને UNFCCCના સમાન પણ ભિન્ન જવાબદારીઓ તથા સંબંધિત ક્ષમતાના સિદ્ધાંતની વકીલાત કરે છે."}}]}], "exam_questions": [{"q": {"en": "Practice: Explain the greenhouse effect with a diagram and list the gases responsible.", "gu": "સરાવ: રેખાચિત્ર સાથે હરિતગૃહ પ્રભાવ સમજાવો અને જવાબદાર વાયુઓની યાદી આપો."}, "marks": 5}, {"q": {"en": "Practice: Give five lines of evidence that the climate is changing and explain each.", "gu": "સરાવ: જળવાયુ બદલાઈ રહ્યું છે તેના પાંચ પુરાવા આપી દરેક સમજાવો."}, "marks": 5}, {"q": {"en": "Practice: Describe the impacts of climate change on Indian agriculture, water and health.", "gu": "સરાવ: ભારતની ખેતી, પાણી અને આરોગ્ય પર જળવાયુ પરિવર્તનની અસરોનું વર્ણન કરો."}, "marks": 5}, {"q": {"en": "Practice: List the mitigation options for greenhouse gases in order of cost and explain any three.", "gu": "સરાવ: હરિતગૃહ વાયુ માટેના શમન વિકલ્પો ખર્ચના ક્રમમાં ગણાવો અને કોઈ પણ ત્રણ સમજાવો."}, "marks": 5}, {"q": {"en": "Practice: What is climate sensitivity and why is its range so wide?", "gu": "સરાવ: જળવાયુ સંવેદનશીલતા શું છે અને તેની શ્રેણી આટલી પહોળી કેમ છે?"}, "marks": 4}, {"q": {"en": "Practice: Explain carbon capture and storage with a block diagram and its limitations.", "gu": "સરાવ: બ્લોક ડાયાગ્રામ સાથે કાર્બન પકડ અને સંગ્રહ તથા તેની મર્યાદા સમજાવો."}, "marks": 4}, {"q": {"en": "Practice: A city wants to reach net zero. Prepare a ten-point plan with a rough priority order.", "gu": "સરાવ: એક શહેર નેટ ઝીરો પામવા માંગે છે. અંદાજિત પ્રાથમિકતા ક્રમ સાથે દસ મુદ્દાની યોજના બનાવો."}, "marks": 5}, {"q": {"en": "Practice: Explain the evidence for sea level rise and its threat to Indian coastal cities.", "gu": "સરાવ: દરિયા સપાટીના વધારાના પુરાવા અને ભારતીય કિનારાનાં શહેરો માટેના જોખમને સમજાવો."}, "marks": 4}, {"q": {"en": "Practice: What is extreme event attribution? Answer with one heat wave and one rainfall example.", "gu": "સરાવ: આત્યંતિક ઘટના કારણ નિર્ધારણ શું છે? એક ગરમીની લહેર અને એક વરસાદના ઉદાહરણ સાથે જવાબ આપો."}, "marks": 4}, {"q": {"en": "Practice: Explain the difference between the ozone hole and global warming.", "gu": "સરાવ: ઓઝોન છિદ્ર અને વૈશ્વિક ગરમી વચ્ચેનો ફરક સમજાવો."}, "marks": 3}, {"q": {"en": "Practice: Why is adaptation necessary even if mitigation succeeds?", "gu": "સરાવ: શમન સફળ થાય તો પણ અનુકૂલન કેમ આવશ્યક છે?"}, "marks": 4}, {"q": {"en": "Practice: State India's climate commitments and the three numbers behind them.", "gu": "સરાવ: ભારતની જળવાયુ પ્રતિબદ્ધતાઓ અને તેમની પાછળના ત્રણ આંકડા જણાવો."}, "marks": 4}], "learning_outcomes": [{"en": "Analyse the impact of climate change and choose suitable mitigation measures.", "gu": "જળવાયુ પરિવર્તનની અસરનું વિશ્લેષણ કરી યોગ્ય શમન પગલાં પસંદ કરવાં."}], "course_outcomes": ["CO4"], "practical_numbers": [], "content_kind": "theory", "lesson_count": 9, "answered_practice_count": 12, "assessment_note": {"en": "Official course: theory ESE 70 + PA 30 = 100 marks, 2 credits, 30 teaching hours, no practical. This unit carries 20 % weightage, 6 of the 30 hours and 14 of the 70 theory marks (the PDF prints weightage only, so the marks are split by weightage). Practice marks 3/4/5 are suggested revision sizes, not GTU allocations. Model answers are in Notes section 5.", "gu": "અધિકૃત કોર્સ: થિયરી ESE 70 + PA 30 = 100 માર્ક્સ, 2 ક્રેડિટ, 30 શિક્ષણ કલાક, પ્રેક્ટિકલ નથી. આ યુનિટનું વેઇટેજ 20 %, 30માંથી 6 કલાક અને 70 થિયરી માર્ક્સમાંથી 14 માર્ક્સ (PDFમાં ફક્ત વેઇટેજ છે, તેથી માર્ક્સ વેઇટેજ પ્રમાણે વહેંચ્યા છે). સરાવના 3/4/5 માર્ક્સ સૂચિત પુનરાવર્તન માપ છે, GTU ફાળવણી નહીં. આદર્શ જવાબો નોંધ વિભાગ 5માં છે."}, "question_provenance": "Original answered revision questions; not official past papers", "question_marks_are_suggested": true, "sources": [{"title": "GTU DI02000051 Environmental Sustainability syllabus (uploaded PDF, w.e.f. 2024-25)", "url": "https://syllabus.gtu.ac.in/"}, {"title": "IPCC Sixth Assessment Report, Working Group I (physical science) and Working Group II (impacts)", "url": "https://www.envis.nic.in/"}, {"title": "IPCC AR6 Synthesis Report, Summary for Policymakers, 2023", "url": "https://www.envis.nic.in/"}, {"title": "India's Third National Communication and Biennial Update Reports to the UNFCCC (MoEFCC)", "url": "https://www.envis.nic.in/"}, {"title": "WMO State of the Global Climate and the India Meteorological Department climate statements", "url": "https://www.envis.nic.in/"}]};

const head = (title, menu=true) => `<div class="sh"><span>${title}</span>${menu?`<button class="more" data-more>${dots}</button><div class="menu"><button data-act="expand">${L('expand')}</button><button data-act="collapse">${L('collapse')}</button></div>`:''}</div>`;
const dgInline = id => `<div class="dg" data-dg="${id}">${SVG[id]}</div><div class="dgc">📐 ${t(U.diagrams.find(d=>d.id===id).title)} · ${L('tapzoom')}</div>`;

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const KW = new Set('auto break case const continue default do else enum extern for goto if register return signed sizeof static struct switch typedef union unsigned volatile while'.split(' '));
const TY = new Set('int char float double void long short FILE size_t'.split(' '));
const PKW = new Set('False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield'.split(' '));
const PTY = new Set('int float str bool list tuple set dict complex frozenset bytes bytearray range object'.split(' '));
function hlPy(src){
  const re = /(#[^\n]*)|((?:\b[rRbBfFuU]{1,2})?(?:'{3}[\s\S]*?'{3}|"{3}[\s\S]*?"{3}|'(?:\\.|[^'\\\n])*'|"(?:\\.|[^"\\\n])*"))|(^>>>|^\.\.\.(?= ))|([A-Za-z_]\w*)(?=\s*\()|([A-Za-z_]\w*)|(\b(?:0[xXoObB][0-9a-fA-F_]+|\d[\d_]*(?:\.\d+)?(?:[eE][-+]?\d+)?j?)\b)/gm;
  let o='', last=0, m;
  while ((m = re.exec(src))){
    o += esc(src.slice(last, m.index)); last = re.lastIndex;
    const w = esc(m[0]);
    if (m[1]) o += `<span class="cm">${w}</span>`;
    else if (m[2]) o += `<span class="st">${w}</span>`;
    else if (m[3]) o += `<span class="pp">${w}</span>`;
    else if (m[4]) o += PKW.has(m[4]) ? `<span class="kw">${w}</span>` : PTY.has(m[4]) ? `<span class="ty">${w}</span>` : `<span class="fn">${w}</span>`;
    else if (m[5]) o += PKW.has(m[5]) ? `<span class="kw">${w}</span>` : PTY.has(m[5]) ? `<span class="ty">${w}</span>` : w;
    else o += `<span class="nu">${w}</span>`;
  }
  return o + esc(src.slice(last));
}
function hl(src){
  if (META.code_lang === 'python') return hlPy(src);
  if (META.code_lang === 'nosql') return esc(src);
  const re = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(^[ \t]*#[^\n]*)|([A-Za-z_]\w*)(?=\s*\()|([A-Za-z_]\w*)|(\b\d+(?:\.\d+)?[fFlLuU]*\b)/gm;
  let o='', last=0, m;
  while ((m = re.exec(src))){
    o += esc(src.slice(last, m.index)); last = re.lastIndex;
    const w = esc(m[0]);
    if (m[1]) o += `<span class="cm">${w}</span>`;
    else if (m[2]) o += `<span class="st">${w}</span>`;
    else if (m[3]) o += `<span class="pp">${w}</span>`;
    else if (m[4]) o += KW.has(m[4]) ? `<span class="kw">${w}</span>` : TY.has(m[4]) ? `<span class="ty">${w}</span>` : `<span class="fn">${w}</span>`;
    else if (m[5]) o += KW.has(m[5]) ? `<span class="kw">${w}</span>` : TY.has(m[5]) ? `<span class="ty">${w}</span>` : w;
    else o += `<span class="nu">${w}</span>`;
  }
  return o + esc(src.slice(last));
}
const progBody = p => p.items
  ? p.items.map(it => fixTables(t(it.body)) + (it.diagram?dgInline(it.diagram):'')).join('')
  : `<div class="pl">${L('code')}</div><pre class="code">${hl(t(p.code))}</pre><div class="pl">${L('output')}</div><pre class="out">${esc(p.out)}</pre>${p.plot?`<div class="pl">${L('plot')}</div>`+dgInline(p.plot).replace('class="dg"','class="dg pg"'):''}${p.expl?`<div class="pl">${L('expl')}</div>${fixTables(t(p.expl))}`:''}`;
const pBox = id => { const p=(U.programs||[]).find(x=>x.id===id); if(!p) return ''; return `<div class="pbox"><div class="et">${L('prog')}: ${t(p.title)}</div>${progBody(p)}</div>`; };
const exBox = id => { const n=(U.numericals||[]).find(x=>x.id===id); if(!n) return ''; return `<div class="ex"><div class="et">${L('ex')}</div><div class="eq2">${t(n.q)}</div>${fixTables(t(n.a))}</div>`; };
function notes(){
  let h = `<div class="intro"><b>${t(U.title)}</b><div>${L('unit')} ${U.unit} · ${U.weightage}% ${L('intro')} · ${U.hours} ${L('hours')}</div><div>${U.intro_text ? t(U.intro_text) : L(U.programs?(META.code_lang==='python'?'intropy':'introc'):'introd')}</div></div>`;
  U.notes.forEach((sec,si)=>{
    h += `<div class="sec">${head(t(sec.title))}`;
    sec.items.forEach((it,i)=>{
      const open = si===0&&i===0 ? ' open' : '';
      if (it.h) {
        h += `<div class="card${it.key?' key':''}${open}"><div class="q hd"><span class="t">${it.key?'⭐ ':''}${t(it.h)}</span>${chev}</div>
        <div class="a rn" style="padding-left:18px">${fixTables(t(it.body)).replace(/margin:0 0 10px -36px/g,'')}${it.diagram?dgInline(it.diagram):''}${(it.examples||[]).map(exBox).join('')}${(it.programs||[]).map(pBox).join('')}</div></div>`;
      } else {
        h += `<div class="card${open}"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(it.q)}</span>${chev}</div>
        <div class="a">${fixTables(t(it.a))}${it.diagram?dgInline(it.diagram):''}</div></div>`;
      }
    });
    h += `</div>`;
  });
  return h;
}
function numericals(){
  return `<div class="sec">${head(L('numericals'))}` + (U.numericals||[]).map((n,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(n.q)}</span>${chev}</div><div class="a">${fixTables(t(n.a))}</div></div>`).join('') + `</div>`;
}
function diagrams(){
  return `<div class="sec">${head(L((U.tabs ? U.tabs.includes('flowcharts')&&!U.tabs.includes('diagrams') : U.programs&&META.code_lang!=='python')?'flowcharts':'diagrams'),false)}<div style="height:10px"></div>` + U.diagrams.map((d,i)=>
    `<div class="dcard" data-dg="${d.id}"><div class="h">${i+1}. ${t(d.title)}</div>${SVG[d.id]}</div>`).join('') + `</div>`;
}
function equations(){
  return U.equations.map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><span class="fbox">${e.f}</span></span>${chev}</div>
     <div class="a"><p>${t(e.terms)}</p></div></div>`).join('') + `</div>`).join('');
}
function viva(){
  // two shapes exist in the corpus: flat [{q,a}] and grouped [{title, items:[{q,a}]}]
  const groups = U.viva.every(v=>v && v.q) ? [{items: U.viva}] : U.viva;
  return groups.map(g=>{
    const items = g.items || [];
    return `<div class="sec">${g.title?head(t(g.title)):''}` + items.map((v,i)=>
      `<div class="card"><div class="q hd"><span class="n">${i+1}.</span><span class="t">${t(v.q)}</span>${chev}</div><div class="a"><p>${t(v.a)}</p></div></div>`).join('') + `</div>`;
  }).join('');
}
function exam(){
  return `<div class="sec">${head(L('examhead'),false)}` + U.exam_questions.map((x,i)=>
    `<div class="card"><div class="q" style="cursor:default"><span class="n">${i+1}.</span><span class="t">${t(x.q)}</span><span class="mk">${x.marks} ${L('marks')}</span></div></div>`).join('') + `</div>`;
}
function programs(){
  return `<div class="sec">${head(L('programs'))}` + (U.programs||[]).map((p,i)=>
    `<div class="card"><div class="q hd"><span class="n">${i+1}.</span><span class="t">${t(p.title)}</span>${chev}</div><div class="a pa">${progBody(p)}</div></div>`).join('') + `</div>`;
}
function syntax(key){
  return (U[typeof key==='string'?key:'syntax']||[]).map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><pre class="code sx">${hl(e.f)}</pre></span>${chev}</div>
     <div class="a">${e.terms && t(e.terms) ? fixTables(t(e.terms)) : ''}</div></div>`).join('') + `</div>`).join('');
}
const flowcharts = diagrams;
const algorithms = () => syntax('algorithms');
const ALLV = {notes, programs, diagrams, flowcharts, algorithms, syntax, equations, numericals, viva, exam};
const VIEWS = U.tabs ? Object.fromEntries(U.tabs.map(k=>[k, ALLV[k]])) : U.programs ? (META.code_lang==='python' ? {notes, programs, diagrams, syntax, viva, exam} : {notes, programs, flowcharts, syntax, viva, exam}) : U.numericals ? {notes, diagrams, equations, numericals, viva, exam} : {notes, diagrams, equations, viva, exam};
function render(){
  document.getElementById('title').textContent = `${L('unit')} ${U.unit}: ${t(U.title)}`;
  document.getElementById('sub').textContent = `${t(META.name)} · ${META.code}`;
  document.getElementById('lang').textContent = S.lang==='en' ? 'ગુ' : 'EN';
  document.getElementById('lang').style.display = META.languages.includes('gu') ? '' : 'none';
  document.getElementById('tabs').innerHTML = Object.keys(VIEWS).map(k=>`<button class="tab${S.tab===k?' on':''}" data-tab="${k}">${L(k)}</button>`).join('');
  document.getElementById('view').innerHTML = VIEWS[S.tab]();
  document.querySelectorAll('#view pre.c').forEach(e=>{ e.innerHTML = hl(e.textContent); e.className='code'; });
}
let zoom = 1;
function setZoom(z){ zoom = Math.min(4, Math.max(1, z)); const w=document.getElementById('zw'); w.style.width=(zoom*100)+'%'; document.getElementById('zr').textContent=Math.round(zoom*100)+'%'; }
document.addEventListener('click', e=>{
  const q = e.target.closest('.q'); if (q && q.parentElement.querySelector('.a')) { q.parentElement.classList.toggle('open'); return; }
  const tb = e.target.closest('[data-tab]'); if (tb){ S.tab = tb.dataset.tab; render(); window.scrollTo(0,0); return; }
  if (e.target.closest('#lang')){ S.lang = S.lang==='en'?'gu':'en'; render(); return; }
  const m = e.target.closest('[data-more]');
  document.querySelectorAll('.menu.show').forEach(x=>{ if(!m || x!==m.nextElementSibling) x.classList.remove('show'); });
  if (m){ m.nextElementSibling.classList.toggle('show'); return; }
  const act = e.target.closest('[data-act]');
  if (act){ act.closest('.sec').querySelectorAll('.card').forEach(c=>{ if(c.querySelector('.a')) c.classList.toggle('open', act.dataset.act==='expand'); }); act.parentElement.classList.remove('show'); return; }
  const dg = e.target.closest('[data-dg]');
  if (dg){ const id=dg.dataset.dg; document.getElementById('mt').textContent=t(U.diagrams.find(d=>d.id===id).title); document.getElementById('zw').innerHTML=SVG[id]; setZoom(1); document.getElementById('modal').classList.add('show'); return; }
  if (e.target.closest('#mx')) document.getElementById('modal').classList.remove('show');
  if (e.target.closest('#zi')) setZoom(zoom+0.5);
  if (e.target.closest('#zo')) setZoom(zoom-0.5);
  if (e.target.closest('#zr')) setZoom(1);
});
render();
</script></body></html>
