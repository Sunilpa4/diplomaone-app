<script>
const U = {"subject": "DI02000051", "unit": 4, "format": "notes", "title": {"en": "Climate Change: Science and Solutions", "gu": "જળવાયુ પરિવર્તન: વિજ્ઞાન અને ઉકેલ"}, "hours": 6, "weightage": 20, "official": true, "languages": ["en", "gu"], "tabs": ["notes", "diagrams", "equations", "numericals", "viva", "exam"], "intro_text": {"en": "Unit 4 of Environmental Sustainability: the five parts of the climate system and the greenhouse effect; the gases, their global warming potential and their sources; the evidence - temperature records and proxies, melting ice, rising seas, shifting rain and extreme events, with the attribution method; the impacts on species, the ocean, dry land, health and the economy; and the mitigation ladder from efficiency and electrification through carbon capture and land sinks to net zero. Nine lecture cards, six diagrams, ten fully solved numericals and twelve answered practice questions.", "gu": "પર્યાવરણીય ટકાઉપણાનું યુનિટ 4: જળવાયુ પ્રણાલીના પાંચ ભાગ અને હરિતગૃહ પ્રભાવ; વાયુ, તેમની વૈશ્વિક ગરમી સંભાવના અને સ્રોત; પુરાવા - તાપમાન રેકોર્ડ અને પરોક્ષ પુરાવા, પીગળતો બરફ, વધતો દરિયો, બદલાતો વરસાદ અને આત્યંતિક ઘટનાઓ, કારણ નિર્ધારણની રીત સાથે; જાતિઓ, મહાસાગર, સૂકી જમીન, આરોગ્ય અને અર્થતંત્ર પર અસરો; અને કાર્યક્ષમતા તથા વીજીકરણથી કાર્બન પકડ અને જમીન શોષક થઈને નેટ ઝીરો સુધીનું શમન સોપાન. નવ પાઠ-કાર્ડ, છ આકૃતિઓ, દસ પૂરા ઉકેલાયેલા દાખલા અને બાર ઉત્તરસહિત સરાવ પ્રશ્નો."}, "notes": [{"title": {"en": "1. The Climate System and the Greenhouse Effect", "gu": "1. જળવાયુ પ્રણાલી અને હરિતગૃહ પ્રભાવ"}, "items": [{"h": {"en": "4.1 The earth's climate system and the greenhouse effect", "gu": "4.1 પૃથ્વીની જળવાયુ પ્રણાલી અને હરિતગૃહ પ્રભાવ"}, "body": {"en": "<h4>Five parts of one system</h4><p>The climate system has five interacting parts: the <b>atmosphere</b>, the <b>hydrosphere</b> (oceans, rivers, ice), the <b>cryosphere</b> (glaciers, ice sheets, sea ice, permafrost), the <b>lithosphere</b> (soil and rock) and the <b>biosphere</b> (plants, animals, microbes). Weather is what one of them does in a day; climate is the average and the variability of all five over thirty years or more. Energy comes in from the sun and leaves as infrared radiation, and the balance between the two sets the temperature.</p><h4>The natural greenhouse effect</h4><p>Of the sunlight reaching the top of the atmosphere, about 30 % is reflected by clouds, ice and deserts - that reflectivity is the <b>albedo</b> - and 70 % is absorbed by the surface and the atmosphere. The warm surface radiates that energy back as infrared light, and the gases that have more than two atoms per molecule - water vapour, carbon dioxide, methane, nitrous oxide, ozone - absorb part of it and re-emit half downwards. That back radiation keeps the surface at about 15 °C instead of −18 °C, so the natural greenhouse effect is what makes life possible; the problem is the extra effect we are adding.</p><h4>Forcing, feedback, sensitivity</h4><table><tr><th>Term</th><th>Meaning</th><th>Example</th></tr><tr><td>radiative forcing</td><td>change in energy balance, W/m², from a cause</td><td>CO₂ at 420 ppm gives about +2.2 W/m²</td></tr><tr><td>positive feedback</td><td>amplifies the first change</td><td>less ice means less reflection, so more warming</td></tr><tr><td>negative feedback</td><td>damps the change</td><td>a warmer surface radiates more energy away</td></tr><tr><td>climate sensitivity</td><td>warming for a doubling of CO₂</td><td>1.5-4.5 °C, best estimate 3 °C</td></tr></table><h4>Worked example</h4><p>Radiative forcing grows with the logarithm of concentration: ΔF = 5.35 ln(C/280). Going from 280 ppm before industry to 420 ppm today gives 5.35 × ln(1.5) = 2.17 W/m², which with a sensitivity of 0.8 °C per W/m² means about 1.7 °C of eventual warming - close to the 1.2 °C already measured, because the ocean has not caught up yet.</p><h4>Common mistake</h4><p>Saying the greenhouse effect is bad, or blaming the ozone hole. The natural effect is essential; the ozone hole is a separate problem of chlorine chemistry in the stratosphere, and ozone depletion is not the cause of global warming.</p>", "gu": "<h4>એક પ્રણાલીના પાંચ ભાગ</h4><p>જળવાયુ પ્રણાલીમાં પાંચ પરસ્પર જોડાયેલા ભાગ છે: <b>વાતાવરણ</b>, <b>જળગોળ</b> (મહાસાગર, નદી, બરફ), <b>હિમગોળ</b> (હિમનદી, બરફનાં પડ, દરિયાઈ બરફ, કાયમી ઠંડું જમીન), <b>શિલાગોળ</b> (જમીન અને ખડક) અને <b>જૈવગોળ</b> (છોડ, પ્રાણી, સૂક્ષ્મજીવ). હવામાન એ એક દિવસમાં તેમાંથી એક શું કરે તે છે; જળવાયુ એ ત્રીસ કે વધુ વર્ષની બધાની સરેરાશ અને બદલાવ છે. ઊર્જા સૂર્યથી આવે અને ઇન્ફ્રારેડ કિરણો તરીકે નીકળે, અને બંને વચ્ચેનું સંતુલન તાપમાન નક્કી કરે.</p><h4>કુદરતી હરિતગૃહ પ્રભાવ</h4><p>વાતાવરણની ટોચે પહોંચતા સૂર્યપ્રકાશમાંથી લગભગ 30 % વાદળ, બરફ અને રણ પરાવર્તિત કરે - તે પરાવર્તકતા જ <b>આલ્બેડો</b> છે - અને 70 % સપાટી તથા વાતાવરણ શોષે. ગરમ સપાટી તે ઊર્જા ઇન્ફ્રારેડ પ્રકાશ તરીકે પાછી ફેંકે અને પ્રતિ અણુ બે કરતાં વધુ પરમાણુ ધરાવતા વાયુ - પાણીની વરાળ, કાર્બન ડાયોક્સાઇડ, મિથેન, નાઇટ્રસ ઓક્સાઇડ, ઓઝોન - તેનો ભાગ શોષી અડધો નીચે ફેંકે. તે પરાવર્તિત કિરણોત્સર્ગ સપાટીને −18 °Cને બદલે લગભગ 15 °C રાખે, તેથી કુદરતી હરિતગૃહ પ્રભાવ જીવન શક્ય બનાવે; સમસ્યા આપણે ઉમેરતો વધારાનો પ્રભાવ છે.</p><h4>બળ, પ્રતિસંદર્શ અને સંવેદનશીલતા</h4><table><tr><th>શબ્દ</th><th>અર્થ</th><th>ઉદાહરણ</th></tr><tr><td>કિરણોત્સર્ગી બળ</td><td>કારણથી ઊર્જા સંતુલનમાં ફેરફાર, W/m²</td><td>420 ppm CO₂ લગભગ +2.2 W/m² આપે</td></tr><tr><td>ધન પ્રતિસંદર્શ</td><td>પ્રથમ ફેરફારને વધારે</td><td>ઓછો બરફ એટલે ઓછું પરાવર્તન, તેથી વધુ ગરમી</td></tr><tr><td>ઋણ પ્રતિસંદર્શ</td><td>ફેરફારને દબાવે</td><td>ગરમ સપાટી વધુ ઊર્જા ફેંકે</td></tr><tr><td>જળવાયુ સંવેદનશીલતા</td><td>CO₂ બમણું થવા પર ગરમી</td><td>1.5-4.5 °C, શ્રેષ્ઠ અંદાજ 3 °C</td></tr></table><h4>ઉકેલાયેલ દાખલો</h4><p>કિરણોત્સર્ગી બળ સાંદ્રતાના લઘુગણક સાથે વધે: ΔF = 5.35 ln(C/280). ઉદ્યોગ પહેલાંના 280 ppmથી આજના 420 ppm સુધી જવાય તો 5.35 × ln(1.5) = 2.17 W/m², જે પ્રતિ W/m² 0.8 °C સંવેદનશીલતાએ લગભગ 1.7 °C અંતિમ ગરમી દર્શાવે - માપેલા 1.2 °Cની નજીક, કારણ કે મહાસાગર હજી પકડ્યું નથી.</p><h4>સામાન્ય ભૂલ</h4><p>હરિતગૃહ પ્રભાવ ખરાબ છે તેમ કહેવું, કે ઓઝોન છિદ્રને દોષ દેવો. કુદરતી પ્રભાવ આવશ્યક છે; ઓઝોન છિદ્ર સ્ટ્રેટોસ્ફિયરમાં ક્લોરિન રસાયણની અલગ સમસ્યા છે, અને ઓઝોનનો ક્ષય વૈશ્વિક ગરમીનું કારણ નથી.</p>"}, "diagram": "u4_balance", "syllabus_item": "4.1"}, {"h": {"en": "4.1 Greenhouse gases, their sources and their strength", "gu": "4.1 હરિતગૃહ વાયુ, તેમના સ્રોત અને તેમની શક્તિ"}, "body": {"en": "<h4>The main gases</h4><p>Carbon dioxide is the largest single cause, but it is not the only one and not the strongest per kilogram. Each gas is compared with CO₂ by its <b>global warming potential</b> (GWP) over one hundred years, which folds in how much infrared it absorbs and how long it stays in the air. Methane is about 28 times CO₂ and lives only twelve years; nitrous oxide is 265 times and lives 120 years; the fluorinated gases used in refrigeration are thousands of times stronger.</p><h4>Sources and shares</h4><table><tr><th>Gas</th><th>GWP, 100 yr</th><th>Main sources</th><th>Share of warming</th></tr><tr><td>CO₂</td><td>1</td><td>coal, oil, gas, cement, land clearing</td><td>about 64 %</td></tr><tr><td>CH₄</td><td>28</td><td>cattle, rice paddies, landfills, gas leaks</td><td>about 17 %</td></tr><tr><td>N₂O</td><td>265</td><td>nitrogen fertiliser, manure, industry</td><td>about 6 %</td></tr><tr><td>fluorinated gases</td><td>up to 14,800</td><td>refrigerants, air conditioning, aerosols</td><td>about 3 %</td></tr><tr><td>water vapour</td><td>not counted</td><td>evaporation, a feedback not a forcing</td><td>amplifies the rest</td></tr></table><h4>The carbon cycle and the budget</h4><p>Of every tonne of CO₂ released, about 45 % stays in the air, 25 % is taken by the ocean and 30 % by land plants. Because the ocean absorbs slowly and acidifies as it does, a pulse of CO₂ warms the earth for centuries. The carbon budget - the total that can still be emitted for a given temperature - is therefore the honest way to plan: about 250 Gt of CO₂ remain for a 1.5 °C chance and about 1,150 Gt for 2 °C, against current emissions near 42 Gt a year.</p><h4>Worked example</h4><p>A city of one million people emits 1.2 t of CO₂ per person a year from fuel, plus 40,000 t of methane from its landfill. In CO₂ equivalent the landfill adds 40,000 × 28 = 1.12 Mt, almost as much as the fuel - which is why capping and flaring a landfill is one of the cheapest climate actions available.</p>", "gu": "<h4>મુખ્ય વાયુ</h4><p>કાર્બન ડાયોક્સાઇડ સૌથી મોટું એક કારણ છે, પણ તે એકમાત્ર નથી અને પ્રતિ કિલો સૌથી શક્તિશાળી પણ નથી. દરેક વાયુની સરખામણી તેના સો વર્ષના <b>વૈશ્વિક ગરમી સંભાવના</b> (GWP) દ્વારા CO₂ સાથે થાય, જે તે કેટલું ઇન્ફ્રારેડ શોષે અને હવામાં કેટલું ટકે તે બંને સમાવે. મિથેન CO₂ કરતાં લગભગ 28 ગણું અને ફક્ત બાર વર્ષ ટકે; નાઇટ્રસ ઓક્સાઇડ 265 ગણું અને 120 વર્ષ ટકે; ઠંડકમાં વપરાતા ફ્લોરિનવાળા વાયુ હજારો ગણા શક્તિશાળી છે.</p><h4>સ્રોત અને હિસ્સો</h4><table><tr><th>વાયુ</th><th>GWP, 100 વર્ષ</th><th>મુખ્ય સ્રોત</th><th>ગરમીમાં હિસ્સો</th></tr><tr><td>CO₂</td><td>1</td><td>કોલસો, તેલ, ગેસ, સિમેન્ટ, જમીન સફાઈ</td><td>લગભગ 64 %</td></tr><tr><td>CH₄</td><td>28</td><td>ઢોર, ડાંગરનાં ખેતર, કચરાભરાવ, ગેસ લીકેજ</td><td>લગભગ 17 %</td></tr><tr><td>N₂O</td><td>265</td><td>નાઇટ્રોજન ખાતર, છાણ, ઉદ્યોગ</td><td>લગભગ 6 %</td></tr><tr><td>ફ્લોરિનવાળા વાયુ</td><td>14,800 સુધી</td><td>રેફ્રિજરન્ટ, વાતાનુકૂલન, એરોસોલ</td><td>લગભગ 3 %</td></tr><tr><td>પાણીની વરાળ</td><td>ગણાય નહીં</td><td>બાષ્પીભવન, બળ નહીં પ્રતિસંદર્શ</td><td>બાકીનાને વધારે</td></tr></table><h4>કાર્બન ચક્ર અને બજેટ</h4><p>છૂટતા દરેક ટન CO₂માંથી લગભગ 45 % હવામાં રહે, 25 % મહાસાગર લે અને 30 % જમીનના છોડ. મહાસાગર ધીમે શોષે અને શોષતાં અમ્લિક બને, તેથી CO₂નો એક ધક્કો સદીઓ સુધી પૃથ્વીને ગરમ કરે. તેથી કાર્બન બજેટ - આપેલા તાપમાન માટે હજી કુલ કેટલું છોડી શકાય - યોજના માટે પ્રામાણિક માર્ગ છે: 1.5 °Cની શક્યતા માટે લગભગ 250 Gt CO₂ અને 2 °C માટે લગભગ 1,150 Gt બાકી છે, જ્યારે હાલનું ઉત્સર્જન વર્ષે 42 Gtની નજીક છે.</p><h4>ઉકેલાયેલ દાખલો</h4><p>દસ લાખ વસ્તીનું શહેર ઇંધણમાંથી વર્ષે પ્રતિ વ્યક્તિ 1.2 t CO₂ છોડે, ઉપરાંત તેના કચરાભરાવમાંથી 40,000 t મિથેન. CO₂ સમમૂલ્યમાં કચરાભરાવ 40,000 × 28 = 1.12 Mt ઉમેરે, લગભગ ઇંધણ જેટલું જ - તેથી કચરાભરાવ ઢાંકવો અને ગેસ બાળવો સૌથી સસ્તા જળવાયુ પગલાંમાં છે.</p>"}, "diagram": "u4_ghg", "syllabus_item": "4.1"}]}, {"title": {"en": "2. Evidence of Climate Change", "gu": "2. જળવાયુ પરિવર્તનના પુરાવા"}, "items": [{"h": {"en": "4.2 Temperature records and how we know the past", "gu": "4.2 તાપમાનના રેકોર્ડ અને ભૂતકાળ કેવી રીતે જાણીએ"}, "body": {"en": "<h4>Two kinds of thermometer</h4><p><b>Instrumental records</b> start in the 1850s with land stations and, from the 1950s, include weather balloons and satellites; after removing urban heat-island effects and correcting for station moves, they show about 1.2 °C of warming since pre-industrial times, with the last decade the warmest in the record. <b>Proxy records</b> go back much further: tree rings, ice cores with trapped air bubbles, corals, lake sediment and stalagmites. Ice cores from Antarctica hold air 800,000 years old in which CO₂ never exceeded 300 ppm until the twentieth century.</p><h4>What the curve looks like</h4><table><tr><th>Period</th><th>Change</th><th>What caused it</th></tr><tr><td>last 800,000 years</td><td>ice ages with CO₂ 180-280 ppm</td><td>orbital cycles, the Milankovitch rhythm</td></tr><tr><td>1850-1900</td><td>the pre-industrial baseline</td><td>almost steady near 280 ppm</td></tr><tr><td>1901-2023</td><td>+1.2 °C, faster since 1970</td><td>fossil fuel burning, land use</td></tr><tr><td>1979 to now</td><td>Arctic sea ice down about 40 % in September</td><td>polar amplification</td></tr></table><h4>Fingerprints</h4><p>A warming that came from the sun would heat the whole atmosphere evenly and warm the stratosphere too. What is measured instead is a warming troposphere and a cooling stratosphere, nights warming faster than days, winters faster than summers, and the lower atmosphere warming while the upper atmosphere cools. Each of these is a fingerprint of greenhouse gases rather than of a brighter sun, and each is why the scientific case is described as settled.</p><h4>Common mistake</h4><p>Pointing at one cold winter as proof that warming has stopped. Climate is a thirty-year average; a single season is weather. The test is the trend in a running average, not the last cold morning.</p>", "gu": "<h4>બે પ્રકારના તાપમાનમાપક</h4><p><b>ઉપકરણ રેકોર્ડ</b> 1850ના દાયકામાં જમીન સ્ટેશનોથી શરૂ થાય અને 1950થી હવામાન ફુગ્ગા તથા ઉપગ્રહોનો સમાવેશ કરે; શહેરી ઉષ્મા-ટાપુ અસર દૂર કરી અને સ્ટેશન ખસેડવાનું સુધારીને તે ઉદ્યોગ પહેલાંના સમયથી લગભગ 1.2 °C ગરમી દર્શાવે, અને છેલ્લો દાયકો રેકોર્ડમાં સૌથી ગરમ છે. <b>પરોક્ષ રેકોર્ડ</b> ઘણો પાછળ જાય: વૃક્ષના વલય, ફસાયેલા હવાના પરપોટા સાથે બરફના નમૂના, પરવાળા, તળાવનો કાંપ અને સ્ટેલેગ્માઇટ. એન્ટાર્કટિકાના બરફના નમૂનામાં 8,00,000 વર્ષ જૂની હવા છે જેમાં વીસમી સદી પહેલાં CO₂ કદી 300 ppm વટાવ્યું નથી.</p><h4>વણકર કેવી દેખાય</h4><table><tr><th>સમયગાળો</th><th>ફેરફાર</th><th>કારણ</th></tr><tr><td>છેલ્લા 8,00,000 વર્ષ</td><td>CO₂ 180-280 ppm સાથે હિમયુગ</td><td>કક્ષીય ચક્ર, મિલાનકોવિચ લય</td></tr><tr><td>1850-1900</td><td>ઉદ્યોગ પહેલાંનો આધાર</td><td>280 ppm નજીક લગભગ સ્થિર</td></tr><tr><td>1901-2023</td><td>+1.2 °C, 1970થી ઝડપી</td><td>અશ્મી ઇંધણનું દહન, જમીન ઉપયોગ</td></tr><tr><td>1979થી આજ સુધી</td><td>સપ્ટેમ્બરમાં આર્કટિક દરિયાઈ બરફ લગભગ 40 % ઘટ્યો</td><td>ધ્રુવીય વૃદ્ધિ</td></tr></table><h4>અંગૂઠાના નિશાન</h4><p>સૂર્યથી આવતી ગરમી આખા વાતાવરણને સરખું ગરમ કરે અને સ્ટ્રેટોસ્ફિયરને પણ ગરમ કરે. તેના બદલે જે માપાય છે તે છે ગરમ થતું ટ્રોપોસ્ફિયર અને ઠંડું થતું સ્ટ્રેટોસ્ફિયર, દિવસ કરતાં રાત વધુ ગરમ, ઉનાળા કરતાં શિયાળો વધુ ગરમ, અને નીચું વાતાવરણ ગરમ થાય જ્યારે ઉપરનું ઠંડું થાય. આ દરેક તેજસ્વી સૂર્યને બદલે હરિતગૃહ વાયુનું અંગૂઠાનું નિશાન છે, અને તેથી જ વૈજ્ઞાનિક પુરાવાને નિર્ણિત કહેવાય છે.</p><h4>સામાન્ય ભૂલ</h4><p>એક ઠંડા શિયાળાને ગરમી થંભી ગઈ હોવાના પુરાવા તરીકે બતાવવું. જળવાયુ ત્રીસ વર્ષની સરેરાશ છે; એક ઋતુ હવામાન છે. કસોટી ચાલતી સરેરાશનો ટ્રેન્ડ છે, છેલ્લી ઠંડી સવાર નહીં.</p>"}, "diagram": "u4_temp", "syllabus_item": "4.2"}, {"h": {"en": "4.2 Melting ice, rising seas and shifting rain", "gu": "4.2 પીગળતો બરફ, વધતો દરિયો અને બદલાતો વરસાદ"}, "body": {"en": "<h4>Where the water comes from</h4><p>Sea level rises for three reasons. <b>Thermal expansion</b>: water expands as it warms, which has given about 1.4 mm a year. <b>Glacier and ice-cap melt</b> in the Himalayas, Alps and Andes adds about 0.8 mm. <b>Ice sheets</b> in Greenland and West Antarctica add about 0.8 mm and are the largest long-term risk, because they hold enough water to raise the sea by 65 m. Melting sea ice raises nothing - it is already floating - but it removes the bright surface that reflected sunlight.</p><h4>The numbers</h4><table><tr><th>Indicator</th><th>Measured change</th><th>Why it matters</th></tr><tr><td>global mean sea level</td><td>+20 cm since 1900, +4.5 mm a year now</td><td>coastal flooding, salt water in wells</td></tr><tr><td>Arctic sea ice</td><td>September extent down about 13 % a decade</td><td>less reflection, more warming</td></tr><tr><td>Himalayan glaciers</td><td>losing mass faster since 2000</td><td>Ganga and Indus flow in the dry season</td></tr><tr><td>monsoon rainfall</td><td>more in fewer, heavier spells</td><td>flash floods and longer dry spells</td></tr><tr><td>snow cover</td><td>spring snow melting 1-2 weeks earlier</td><td>water arrives before the crop needs it</td></tr></table><h4>India in particular</h4><p>India has 7,500 km of coastline and about 40 % of its people live within 100 km of the sea, so a 0.5 m rise threatens Mumbai, Surat, Kochi and Chennai through tidal flooding, saline intrusion into the coastal aquifer and loss of beaches. The Sundarbans, the Delta and the Lakshadweep atolls face the same pressure with a smaller margin.</p>", "gu": "<h4>પાણી ક્યાંથી આવે</h4><p>દરિયાની સપાટી ત્રણ કારણે વધે. <b>ઉષ્મીય વિસ્તરણ</b>: પાણી ગરમ થતાં ફેલાય, જે વર્ષે લગભગ 1.4 mm આપ્યું છે. હિમાલય, આલ્પ્સ અને એન્ડીઝમાં <b>હિમનદી અને બરફનાં પડનું પીગળવું</b> લગભગ 0.8 mm ઉમેરે. ગ્રીનલેન્ડ અને પશ્ચિમ એન્ટાર્કટિકાનાં <b>બરફનાં પડ</b> લગભગ 0.8 mm ઉમેરે અને સૌથી મોટું લાંબાગાળાનું જોખમ છે, કારણ કે તેમાં દરિયો 65 m વધારવા પૂરતું પાણી છે. દરિયાઈ બરફ પીગળવાથી કંઈ વધતું નથી - તે તો પહેલેથી તરે છે - પણ સૂર્યપ્રકાશ પરાવર્તિત કરતી તેજસ્વી સપાટી દૂર થાય.</p><h4>આંકડા</h4><table><tr><th>સૂચક</th><th>માપેલો ફેરફાર</th><th>કેમ મહત્ત્વનું</th></tr><tr><td>વૈશ્વિક સરેરાશ દરિયા સપાટી</td><td>1900થી +20 cm, હવે વર્ષે +4.5 mm</td><td>દરિયાકાંઠાનું પૂર, કૂવામાં ખારું પાણી</td></tr><tr><td>આર્કટિક દરિયાઈ બરફ</td><td>સપ્ટેમ્બરનો વિસ્તાર દાયકે લગભગ 13 % ઘટ્યો</td><td>ઓછું પરાવર્તન, વધુ ગરમી</td></tr><tr><td>હિમાલયની હિમનદી</td><td>2000થી ઝડપથી દળ ગુમાવે</td><td>શુષ્ક ઋતુમાં ગંગા અને સિંધુનો પ્રવાહ</td></tr><tr><td>ચોમાસાનો વરસાદ</td><td>ઓછી પણ ભારે ઝાપટામાં વધુ</td><td>ઝડપી પૂર અને લાંબા સૂકા સમય</td></tr><tr><td>બરફનું આવરણ</td><td>વસંતનો બરફ 1-2 અઠવાડિયું વહેલો પીગળે</td><td>પાકને જરૂર પડે તે પહેલાં પાણી આવે</td></tr></table><h4>ખાસ કરીને ભારત</h4><p>ભારતનો 7,500 km દરિયાકિનારો છે અને લગભગ 40 % લોકો દરિયાથી 100 kmમાં રહે છે, તેથી 0.5 m વધારો ભરતીના પૂર, કિનારાના જળસ્તરમાં ખારા પાણીના ઘૂસણ અને દરિયાકિનારા ગુમાવીને મુંબઈ, સુરત, કોચી અને ચેન્નાઈને ધમકાવે. સુંદરબન, ડેલ્ટા અને લક્ષદ્વીપના પરવાળા ટાપુઓ નાના માર્જિન સાથે એ જ દબાણ સહે છે.</p>"}, "diagram": "u4_sea", "syllabus_item": "4.2"}, {"h": {"en": "4.2 Extreme weather and how it is attributed", "gu": "4.2 આત્યંતિક હવામાન અને તેનું કારણ નિર્ધારણ"}, "body": {"en": "<h4>Why extremes change first</h4><p>A small shift in the average moves the tails of the distribution a long way. If the mean temperature rises by 1 °C, the chance of a heat wave that used to happen once in fifty years may rise three to ten times, and a record that was a one-in-a-thousand event becomes a one-in-fifty. Warmer air also holds about 7 % more water vapour for every degree, so a storm that does form can rain harder - the same total monsoon rain arriving in fewer, more violent spells.</p><h4>What India records</h4><table><tr><th>Event</th><th>Change observed</th><th>Damage route</th></tr><tr><td>heat waves</td><td>more frequent, longer and hotter since 1980</td><td>heat stroke, crop failure, power demand</td></tr><tr><td>heavy rainfall</td><td>more one-day extremes, fewer rainy days</td><td>urban flooding, landslides</td></tr><tr><td>cyclones</td><td>stronger, slower and wetter; not clearly more frequent</td><td>storm surge, wind damage, rain flooding</td></tr><tr><td>drought</td><td>more frequent in the rabi season, driven by heat</td><td>groundwater fall, migration</td></tr><tr><td>sea-level extremes</td><td>once-a-century floods now every few years</td><td>coastal cities, ports, aquifers</td></tr></table><h4>Attribution science</h4><p>Attribution does not ask whether a storm was caused by climate change; it asks how much likelier or more severe the event became because of it. The method runs thousands of simulations of the same world with and without the measured greenhouse forcing, and compares the odds. That is how scientists can now say a particular heat wave was thirty times more likely, or that a rainfall total was 10 % heavier, within days of the event - and why a single flood is still described as weather, not proof.</p><h4>Common mistake</h4><p>Saying that climate change caused a particular flood, or that no single event can be linked to it. The correct statement is about probability and severity: the event became more likely or more intense because of warming, while its timing and place were weather.</p>", "gu": "<h4>આત્યંતિક ઘટનાઓ પહેલાં કેમ બદલાય</h4><p>સરેરાશમાં નાનું ખસેડું વિતરણની પૂંછડીઓને ઘણે દૂર ખસેડે. સરેરાશ તાપમાન 1 °C વધે તો પહેલાં પચાસ વર્ષે એક વાર આવતી ગરમીની લહેરની શક્યતા ત્રણથી દસ ગણી વધે, અને હજારમાં એક વારની ઘટના પચાસમાં એક વાર બને. ગરમ હવા દરેક ડિગ્રીે લગભગ 7 % વધુ પાણીની વરાળ ધરે, તેથી જે તોફાન બને તે વધુ ભારે વરસી શકે - એ જ કુલ ચોમાસાનો વરસાદ ઓછી પણ હિંસક ઝાપટામાં આવે.</p><h4>ભારત શું નોંધે</h4><table><tr><th>ઘટના</th><th>જણાયેલો ફેરફાર</th><th>નુકસાનનો રસ્તો</th></tr><tr><td>ગરમીની લહેર</td><td>1980થી વધુ વારંવાર, લાંબી અને ગરમ</td><td>લૂ લાગવી, પાક નિષ્ફળ, વીજ માંગ</td></tr><tr><td>ભારે વરસાદ</td><td>એક દિવસની ચરમસીમા વધુ, વરસાદી દિવસ ઓછા</td><td>શહેરી પૂર, ભૂસ્ખલન</td></tr><tr><td>વાવાઝોડું</td><td>તાકાતવાન, ધીમું અને વધુ પલળતું; સંખ્યા સ્પષ્ટ વધી નથી</td><td>તોફાની ભરતી, પવનનું નુકસાન, વરસાદી પૂર</td></tr><tr><td>દુષ્કાળ</td><td>રવિ ઋતુમાં વધુ વારંવાર, ઉષ્માથી ચાલિત</td><td>ભૂગર્ભજળ ઘટે, સ્થળાંતર</td></tr><tr><td>દરિયા સપાટીની ચરમસીમા</td><td>સદીમાં એક વારનું પૂર હવે થોડા વર્ષે</td><td>કિનારાનાં શહેર, બંદર, જળાશય</td></tr></table><h4>કારણ નિર્ધારણ વિજ્ઞાન</h4><p>કારણ નિર્ધારણ એ પૂછતું નથી કે તોફાન જળવાયુ પરિવર્તનથી થયું કે નહીં; તે પૂછે છે કે તેના કારણે ઘટના કેટલી વધુ શક્ય કે વધુ તીવ્ર બની. આ રીત માપેલા હરિતગૃહ બળ સાથે અને વગર એ જ દુનિયાના હજારો અનુકરણ ચલાવી શક્યતા સરખાવે. તેથી વૈજ્ઞાનિકો હવે ઘટનાના થોડા દિવસોમાં કહી શકે કે અમુક ગરમીની લહેર ત્રીસ ગણી વધુ શક્ય હતી, કે વરસાદ 10 % વધુ ભારે હતો - અને તેથી જ એક પૂરને હજી હવામાન કહેવાય, પુરાવો નહીં.</p><h4>સામાન્ય ભૂલ</h4><p>ચોક્કસ પૂર જળવાયુ પરિવર્તનથી થયું છે તેમ કહેવું, કે કોઈ એક ઘટના સાથે તેને જોડી જ ન શકાય તેમ કહેવું. સાચું વિધાન શક્યતા અને તીવ્રતા વિશે છે: ગરમીને કારણે ઘટના વધુ શક્ય કે વધુ તીવ્ર બની, જ્યારે તેનો સમય અને સ્થળ હવામાન હતા.</p>"}, "syllabus_item": "4.2"}]}, {"title": {"en": "3. Impacts of Climate Change", "gu": "3. જળવાયુ પરિવર્તનની અસરો"}, "items": [{"h": {"en": "4.3 Biodiversity loss, ocean acidification and desertification", "gu": "4.3 જૈવવિવિધતાનો ક્ષય, મહાસાગરનું અમ્લીકરણ અને મરુસ્થલીકરણ"}, "body": {"en": "<h4>Species move uphill and poleward</h4><p>Every species lives inside a range of temperature and rainfall. When the range shifts, a mobile animal or a wind-blown seed can follow it; a coral, a mountain frog or a tree that takes fifty years to mature cannot. The measured result is that about half of studied species have already moved 10-20 km poleward or 10 m uphill per decade, and the IPCC finds that 1.5 °C puts 9 % of species at high extinction risk, while 3 °C raises that to 29 %. Warming also breaks <b>timing</b>: birds arrive after the insects they eat have already hatched, a mismatch called a phenological shift.</p><h4>Ocean acidification</h4><p>The ocean has absorbed about a quarter of all the CO₂ people have released. That CO₂ forms carbonic acid, and the pH of the surface ocean has fallen from 8.2 to 8.1 - a 26 % rise in hydrogen ions, because pH is a logarithmic scale. Corals, oysters, mussels and some plankton build shells from calcium carbonate, and they build them more slowly as the water becomes less alkaline; coral reefs, which shelter a quarter of marine species and protect coasts, bleach in hot years and then fail to rebuild. This is the second CO₂ problem and it cannot be fixed by cooling alone.</p><h4>Desertification</h4><p><b>Desertification</b> is land degradation in dry regions, not the advance of sand dunes. It comes from overgrazing, deforestation, poor irrigation, salt build-up and more frequent drought, and climate change is an amplifier: higher evaporation in already dry soil turns a dry spell into a failed season. About 40 % of India's land is degraded to some degree - in Rajasthan, Gujarat's Kutch, the Deccan plateau - and each hectare lost pushes a family to a city.</p>", "gu": "<h4>જાતિઓ ઊંચાઈ અને ધ્રુવ તરફ ખસે</h4><p>દરેક જાતિ તાપમાન અને વરસાદની એક શ્રેણીમાં જીવે. શ્રેણી ખસે ત્યારે ચલ-વચલું પ્રાણી કે પવનમાં ઊડતું બીજ તેની પાછળ જઈ શકે; પરવાળું, પર્વતીય દેડકું કે પચાસ વર્ષમાં પુખ્ત થતું ઝાડ નહીં. માપેલું પરિણામ એ છે કે અભ્યાસ કરેલી લગભગ અડધી જાતિઓ દાયકે 10-20 km ધ્રુવ તરફ કે 10 m ઊંચાઈ તરફ ખસી છે, અને IPCC ને લાગે છે કે 1.5 °C નવ જાતિઓમાંથી એકને લુપ્ત થવાનું ઊંચું જોખમ આપે, જ્યારે 3 °C તેને 29 % કરે. ગરમી <b>સમય</b> પણ તોડે: પક્ષીઓ પોતાના ખોરાકના જીવડાં મોસમ પૂરી કર્યા પછી આવે, જેને ફિનોલોજિકલ ખસેડું કહે છે.</p><h4>મહાસાગરનું અમ્લીકરણ</h4><p>મહાસાગરે લોકોએ છોડેલા આખા CO₂માંથી લગભગ ચોથા ભાગનું શોષણ કર્યું. તે CO₂ કાર્બોનિક એસિડ બનાવે અને સપાટીના મહાસાગરનો pH 8.2થી 8.1 થયો - હાઇડ્રોજન આયનમાં 26 % વધારો, કારણ કે pH લઘુગણક માપક્રમ છે. પરવાળા, ઓઇસ્ટર, શંખ અને કેટલાક પ્લવક કેલ્શિયમ કાર્બોનેટમાંથી શેલ બનાવે અને પાણી ઓછું આલ્કલાઇન થાય તેમ ધીમે બનાવે; પરવાળાની ભરતી, જે ચોથા ભાગની દરિયાઈ જાતિઓને આશ્રય આપે અને કિનારા બચાવે, ગરમ વર્ષોમાં ધવલિત થઈ પછી ફરી ન બની શકે. આ બીજી CO₂ સમસ્યા છે અને ફક્ત ઠંડકથી ઠીક ન થાય.</p><h4>મરુસ્થલીકરણ</h4><p><b>મરુસ્થલીકરણ</b> એ સૂકા વિસ્તારોમાં જમીનનો ક્ષય છે, રેતીના ટેકરા આગળ વધવા નહીં. તે વધુ ચરાવાણ, વનનાબૂદી, નબળી સિંચાઈ, ક્ષારનો સંગ્રહ અને વધુ વારંવારના દુષ્કાળમાંથી આવે છે, અને જળવાયુ પરિવર્તન તેને વધારે: પહેલેથી સૂકી જમીનમાં વધુ બાષ્પીભવન સૂકા સમયને નિષ્ફળ ઋતુમાં ફેરવે. ભારતની લગભગ 40 % જમીન અમુક અંશે ક્ષીણ છે - રાજસ્થાન, ગુજરાતનું કચ્છ, દક્કનનો ઉચ્ચપ્રદેશ - અને ગુમાવેલું દરેક હેક્ટર એક કુટુંબને શહેર તરફ ધકેલે.</p>"}, "diagram": "u4_impacts", "syllabus_item": "4.3"}, {"h": {"en": "4.3 Social and economic impacts", "gu": "4.3 સામાજિક અને આર્થિક અસરો"}, "body": {"en": "<h4>Why impact is risk, not just temperature</h4><p>The IPCC frames impact as risk from three things together: <b>hazard</b> (the heat, flood or drought), <b>exposure</b> (how many people or fields are in its path) and <b>vulnerability</b> (how little capacity they have to cope). A heat wave of 45 °C is a hazard everywhere; it kills in a city where the poorest live under tin roofs and has little effect in a city with parks, shutters, water and hospitals. That is why the same warming is not the same loss everywhere, and why adaptation is not an optional extra.</p><h4>Sector by sector</h4><table><tr><th>Sector</th><th>Impact</th><th>Indian evidence</th></tr><tr><td>agriculture</td><td>wheat and rice yield fall per degree; pests spread</td><td>about 6 % fall in wheat for 1 °C</td></tr><tr><td>water</td><td>less snow storage, more evaporation, deeper wells</td><td>groundwater falling in the north-west</td></tr><tr><td>health</td><td>heat deaths, dengue and malaria spreading</td><td>heat waves kill thousands since 2010</td></tr><tr><td>labour productivity</td><td>outdoor work impossible in the afternoon</td><td>construction and farm wages lost</td></tr><tr><td>migration</td><td>drought and coastal erosion move families</td><td>seasonal and permanent movement to cities</td></tr><tr><td>infrastructure</td><td>rails buckle, roads flood, power fails</td><td>Mumbai 2005, Chennai 2015, Kerala 2018</td></tr></table><h4>The social justice point</h4><p>The countries that emitted least are hit first and hardest, because they depend on rain-fed farming and cannot pay for air conditioning, sea walls or insurance. Within India the same pattern repeats: a landless labourer in Kutch and a farmer in Bihar carry a cost that a car-owning household in a serviced city does not. That is the meaning of <b>climate justice</b> and the reason the UNFCCC speaks of common but differentiated responsibilities.</p>", "gu": "<h4>અસર તાપમાન નહીં, જોખમ કેમ છે</h4><p>IPCC અસરને ત્રણ ભેગાં મળીને જોખમ તરીકે ગણે છે: <b>જોખમી ઘટના</b> (ગરમી, પૂર કે દુષ્કાળ), <b>સંપર્ક</b> (કેટલા લોકો કે ખેતર તેના રસ્તામાં છે) અને <b>સંવેદનશીલતા</b> (તેમની સામે લડવાની ક્ષમતા કેટલી ઓછી છે). 45 °Cની ગરમી દરેક જગ્યાએ જોખમ છે; તે શહેરમાં મારે જ્યાં સૌથી ગરીબ લોકો પતરાની છત નીચે રહે, અને બગીચા, બારી, પાણી તથા હોસ્પિટલવાળા શહેરમાં થોડી અસર કરે. તેથી જ એક જ ગરમી દરેક જગ્યાએ એક જ નુકસાન નથી, અને તેથી જ અનુકૂલન વૈકલ્પિક વધારો નથી.</p><h4>ક્ષેત્ર પ્રમાણે</h4><table><tr><th>ક્ષેત્ર</th><th>અસર</th><th>ભારતીય પુરાવો</th></tr><tr><td>ખેતી</td><td>દરેક ડિગ્રીે ઘઉં અને ચોખાનું ઉત્પાદન ઘટે; જીવાત ફેલાય</td><td>1 °C માટે ઘઉંમાં લગભગ 6 % ઘટાડો</td></tr><tr><td>પાણી</td><td>ઓછો બરફ સંગ્રહ, વધુ બાષ્પીભવન, ઊંડા કૂવા</td><td>વાયવ્યમાં ભૂગર્ભજળ ઘટે</td></tr><tr><td>આરોગ્ય</td><td>ગરમીથી મોત, ડેન્ગ્યુ અને મલેરિયા ફેલાય</td><td>2010થી ગરમીની લહેરોએ હજારોને માર્યા</td></tr><tr><td>શ્રમ ઉત્પાદકતા</td><td>બપોરે બહારનું કામ અશક્ય</td><td>બાંધકામ અને ખેત મજૂરી ગુમાવાય</td></tr><tr><td>સ્થળાંતર</td><td>દુષ્કાળ અને કિનારાનો ક્ષય કુટુંબો ખસેડે</td><td>શહેરો તરફ મોસમી અને કાયમી ખસેડું</td></tr><tr><td>માળખું</td><td>પાટા વળે, રસ્તા પૂરમાં, વીજળી જાય</td><td>મુંબઈ 2005, ચેન્નાઈ 2015, કેરળ 2018</td></tr></table><h4>સામાજિક ન્યાયનો મુદ્દો</h4><p>જેણે સૌથી ઓછું ઉત્સર્જન કર્યું તે પહેલાં અને સૌથી વધુ માર ખાય, કારણ કે તે વરસાદ આધારિત ખેતી પર નિર્ભર છે અને વાતાનુકૂલન, દરિયાની દીવાલ કે વીમો પરવડી શકતું નથી. ભારતમાં પણ એ જ નમૂનો પુનરાવર્તિત થાય: કચ્છનો ભૂમિહીન મજૂર અને બિહારનો ખેડૂત એવો ખર્ચ ઉઠાવે જે સેવાવાળા શહેરના કારવાળા કુટુંબને નડતો નથી. આ <b>જળવાયુ ન્યાય</b>નો અર્થ છે અને UNFCCC સમાન પણ ભિન્ન જવાબદારીઓની વાત કેમ કરે છે તેનું કારણ.</p>"}, "syllabus_item": "4.3"}]}, {"title": {"en": "4. Climate Change Mitigation", "gu": "4. જળવાયુ પરિવર્તન શમન"}, "items": [{"h": {"en": "4.4 Energy efficiency and the renewable transition", "gu": "4.4 ઊર્જા કાર્યક્ષમતા અને પુનઃપ્રાપ્ય સંક્રમણ"}, "body": {"en": "<h4>Two levers, one ladder</h4><p>Mitigation means cutting the emissions that cause the warming, and it is done in a fixed order of cheapness. <b>Efficiency</b> comes first because a unit of energy not used costs nothing and emits nothing: an LED lamp, an efficient motor, a well insulated roof, a compressor with a variable drive. Then <b>electrification</b> of heat and transport, because an electric motor and a heat pump use energy three times better than a boiler or a petrol engine. Then <b>clean supply</b> - solar, wind, hydro, nuclear - to feed that larger electricity demand.</p><h4>Where the emissions are</h4><table><tr><th>Sector</th><th>Share of global CO₂</th><th>First cut to make</th></tr><tr><td>electricity and heat</td><td>about 34 %</td><td>solar, wind, storage instead of coal</td></tr><tr><td>industry</td><td>about 24 %</td><td>efficient furnaces, scrap steel, green hydrogen</td></tr><tr><td>transport</td><td>about 15 %</td><td>public transport, rail, electric two and three wheelers</td></tr><tr><td>buildings</td><td>about 6 %</td><td>cooling efficiency, shading, rooftop solar</td></tr><tr><td>agriculture and land</td><td>about 12 % of all gases</td><td>less fertiliser loss, less stubble burning</td></tr></table><h4>Efficiency is the cheapest tonne</h4><p>A 9 W LED replaces a 60 W incandescent lamp and gives the same light, saving 51 W for eight hours a day - about 150 kWh a year per lamp. In a home with ten lamps that is 1,500 kWh, or roughly 1.1 t of CO₂ at the Indian grid factor, for an investment of a few thousand rupees. No power plant, no land and no fuel are needed, which is why efficiency is called the first fuel and is counted before any supply is built.</p><h4>Worked example</h4><p>An office block cuts its demand from 200 MWh to 150 MWh a year by better cooling and lighting, then buys 150 MWh of solar. The saved 50 MWh is the cheapest part - about 35 t of CO₂ avoided for a payback of three years - and it also shrinks the size of the solar plant that has to be bought, built and maintained.</p>", "gu": "<h4>બે લિવર, એક સોપાન</h4><p>શમન એટલે ગરમી કરતું ઉત્સર્જન ઘટાડવું, અને તે સસ્તાઈના નિશ્ચિત ક્રમમાં થાય. <b>કાર્યક્ષમતા</b> પહેલાં આવે કારણ કે ન વપરાયેલો ઊર્જા એકમ કંઈ ખર્ચતો નથી અને કંઈ છોડતો નથી: LED દીવો, કાર્યક્ષમ મોટર, સારી રીતે ઇન્સ્યુલેટેડ છત, ચલ ડ્રાઇવવાળો કોમ્પ્રેસર. પછી ઉષ્મા અને વાહનવ્યવહારનું <b>વીજીકરણ</b>, કારણ કે વીજ મોટર અને ઉષ્મા પંપ બોઇલર કે પેટ્રોલ એન્જિન કરતાં ઊર્જા ત્રણ ગણી સારી વાપરે. પછી તે વધેલી વીજ માંગ પૂરી કરવા <b>સ્વચ્છ પુરવઠો</b> - સૌર, પવન, જળ, ન્યુક્લિયર.</p><h4>ઉત્સર્જન ક્યાં છે</h4><table><tr><th>ક્ષેત્ર</th><th>વૈશ્વિક CO₂માં હિસ્સો</th><th>પહેલો ઘટાડો</th></tr><tr><td>વીજળી અને ઉષ્મા</td><td>લગભગ 34 %</td><td>કોલસાને બદલે સૌર, પવન, સંગ્રહ</td></tr><tr><td>ઉદ્યોગ</td><td>લગભગ 24 %</td><td>કાર્યક્ષમ ભઠ્ઠી, ભંગાર પોલાદ, લીલું હાઇડ્રોજન</td></tr><tr><td>વાહનવ્યવહાર</td><td>લગભગ 15 %</td><td>જાહેર વાહનવ્યવહાર, રેલ, વીજ બે અને ત્રણ પૈડાં</td></tr><tr><td>ઇમારત</td><td>લગભગ 6 %</td><td>ઠંડક કાર્યક્ષમતા, છાયો, છત પર સૌર</td></tr><tr><td>ખેતી અને જમીન</td><td>બધા વાયુમાં લગભગ 12 %</td><td>ઓછી ખાતર ખોટ, ઓછું પરાળ બાળવું</td></tr></table><h4>કાર્યક્ષમતા સૌથી સસ્તું ટન</h4><p>9 Wનો LED 60 Wના તાપદીપને બદલે એ જ પ્રકાશ આપે અને દિવસે આઠ કલાક 51 W બચાવે - દીવા દીઠ વર્ષે લગભગ 150 kWh. દસ દીવાવાળા ઘરમાં તે 1,500 kWh, એટલે ભારતીય ગ્રિડ અવયવે લગભગ 1.1 t CO₂, થોડા હજાર રૂપિયાના રોકાણે. કોઈ સ્ટેશન, જમીન કે ઇંધણ જોઈએ નહીં, તેથી કાર્યક્ષમતાને પ્રથમ ઇંધણ કહે છે અને કોઈ પુરવઠો બાંધતાં પહેલાં તેને ગણે છે.</p><h4>ઉકેલાયેલ દાખલો</h4><p>એક ઓફિસ ઇમારત સારી ઠંડક અને પ્રકાશથી તેની માંગ વર્ષે 200 MWhથી 150 MWh કરે, પછી 150 MWh સૌર ખરીદે. બચેલા 50 MWh સૌથી સસ્તા ભાગ છે - ત્રણ વર્ષના પરતફેળે લગભગ 35 t CO₂ બચે - અને તે ખરીદવા, બાંધવા તથા જાળવવા પડતા સૌર સ્ટેશનનું માપ પણ ઘટાડે.</p>"}, "diagram": "u4_mitigation", "syllabus_item": "4.4"}, {"h": {"en": "4.4 Carbon capture, land use, forestry and net zero", "gu": "4.4 કાર્બન પકડ, જમીન ઉપયોગ, વન અને નેટ ઝીરો"}, "body": {"en": "<h4>Carbon capture and storage</h4><p><b>CCS</b> separates CO₂ from a flue gas or a industrial process, compresses it to about 100 bar, pipes it to a geological store - a depleted gas field, a saline aquifer - and keeps it there for thousands of years. Capture needs 20-30 % of the plant's energy, so the same coal station gives less electricity or burns more coal for the same output. <b>CCUS</b> adds use: CO₂ for enhanced oil recovery, in soft drinks, or as a feedstock for chemicals and fuels. It is the only option for cement and steel, where the CO₂ comes from the chemistry itself, not from the fuel.</p><h4>Land use and forestry</h4><p>Forests remove CO₂ as they grow: a fast-growing tropical plantation takes up 10-15 t of CO₂ per hectare a year while it is young, and a mature forest approaches zero because growth and decay balance. So a forest is a <b>sink for decades, then a store</b> that must be protected against fire and felling. Soil carbon matters as much: no-till farming, mulching, compost and agroforestry add organic matter, and a hectare of improved soil can hold 1-3 t of CO₂ a year - while ploughing and bare fallow release what was stored.</p><h4>Net zero in numbers</h4><table><tr><th>Term</th><th>Meaning</th><th>India's line</th></tr><tr><td>gross emissions</td><td>everything released in a year</td><td>about 3.0 Gt CO₂e</td></tr><tr><td>sinks</td><td>forests and soils taking carbon back</td><td>forest and tree cover target of 2.5-3.0 Gt CO₂e</td></tr><tr><td>net zero</td><td>gross minus sinks equals zero</td><td>pledged for 2070</td></tr><tr><td>hard to abate</td><td>cement, steel, aviation, shipping</td><td>need CCS, hydrogen or offsets</td></tr></table><h4>Common mistake</h4><p>Treating a tree-planting pledge as a substitute for cutting emissions. A hectare of new forest takes up 10-15 t of CO₂ a year, while one 500 MW coal station emits 2.4 Mt - so that single station needs about 1,80,000 hectares of new forest every year to offset it. Planting is useful, but it cannot carry the load alone.</p>", "gu": "<h4>કાર્બન પકડ અને સંગ્રહ</h4><p><b>CCS</b> ધુમાડાના ગેસ કે ઉદ્યોગની પ્રક્રિયામાંથી CO₂ અલગ કરે, લગભગ 100 bar સુધી દબાવે, ભૂસ્તરીય સંગ્રહ સુધી - ખાલી થયેલું ગેસ ક્ષેત્ર, ખારું જળાશય - પાઇપમાં લઈ જાય અને હજારો વર્ષ ત્યાં રાખે. પકડ માટે સ્ટેશનની 20-30 % ઊર્જા જોઈએ, તેથી એ જ કોલસા સ્ટેશન ઓછી વીજળી આપે કે એ જ ઉત્પાદન માટે વધુ કોલસો બાળે. <b>CCUS</b> ઉપયોગ ઉમેરે: તેલ ઉત્પાદન વધારવા, ઠંડા પીણાંમાં, કે રસાયણ અને ઇંધણના કાચા માલ તરીકે CO₂. સિમેન્ટ અને પોલાદ માટે તે એકમાત્ર વિકલ્પ છે, જ્યાં CO₂ ઇંધણમાંથી નહીં, રસાયણ પ્રક્રિયામાંથી આવે.</p><h4>જમીન ઉપયોગ અને વન</h4><p>વન ઉગતાં CO₂ દૂર કરે: ઝડપથી ઉગતું ઉષ્ણકટિબંધીય વૃક્ષારોપણ જુવાન હોય ત્યારે વર્ષે પ્રતિ હેક્ટર 10-15 t CO₂ લે, અને પુખ્ત વન શૂન્યની નજીક આવે કારણ કે વૃદ્ધિ અને ક્ષય સંતુલિત થાય. તેથી વન <b>દાયકાઓ સુધી શોષક, પછી સંગ્રહ</b> છે જેને આગ અને કાપણીથી બચાવવો પડે. જમીનનો કાર્બન પણ એટલો જ મહત્ત્વનો: ખેડ ન કરવી, આચ્છાદન, કમ્પોસ્ટ અને કૃષિવન કાર્બનિક દ્રવ્ય ઉમેરે, અને સુધારેલી જમીનનું હેક્ટર વર્ષે 1-3 t CO₂ ધરી શકે - જ્યારે ખેડ અને ખુલ્લી પડતી જમીન સંગ્રહેલું છોડે.</p><h4>આંકડામાં નેટ ઝીરો</h4><table><tr><th>શબ્દ</th><th>અર્થ</th><th>ભારતની રેખા</th></tr><tr><td>કુલ ઉત્સર્જન</td><td>વર્ષમાં છૂટેલું બધું</td><td>લગભગ 3.0 Gt CO₂e</td></tr><tr><td>શોષક</td><td>વન અને જમીન કાર્બન પાછું લે</td><td>વન અને વૃક્ષ આવરણનું 2.5-3.0 Gt CO₂e લક્ષ્ય</td></tr><tr><td>નેટ ઝીરો</td><td>કુલ ઓછા શોષક શૂન્ય</td><td>2070 માટે વચન</td></tr><tr><td>ઘટાડવો કઠિન</td><td>સિમેન્ટ, પોલાદ, વિમાન, જહાજ</td><td>CCS, હાઇડ્રોજન કે ઓફસેટ જોઈએ</td></tr></table><h4>સામાન્ય ભૂલ</h4><p>વૃક્ષારોપણના વચનને ઉત્સર્જન ઘટાડવાનો વિકલ્પ ગણવો. નવા વનનું હેક્ટર વર્ષે 10-15 t CO₂ લે, જ્યારે એક 500 MW કોલસા સ્ટેશન 2.4 Mt છોડે - તેથી તે એક સ્ટેશનને સરભર કરવા દર વર્ષે લગભગ 1,80,000 હેક્ટર નવું વન જોઈએ. વાવેતર ઉપયોગી છે, પણ એકલું ભાર ઉપાડી ન શકે.</p>"}, "syllabus_item": "4.4"}]}, {"title": {"en": "5. Practice Questions with Model Answers", "gu": "5. સરાવ પ્રશ્નો અને આદર્શ જવાબો"}, "items": [{"h": {"en": "Practice 1. Explain the greenhouse effect with a diagram and list the gases responsible.", "gu": "સરાવ 1. રેખાચિત્ર સાથે હરિતગૃહ પ્રભાવ સમજાવો અને જવાબદાર વાયુઓની યાદી આપો."}, "body": {"en": "<p>Draw the earth as a circle with three arrows in and three out. Incoming short-wave solar radiation brings about 340 W/m² at the top of the atmosphere. Roughly 100 W/m² is reflected by clouds, ice and deserts - the albedo - and about 240 W/m² is absorbed by the surface and the atmosphere. The warm surface emits long-wave infrared, of which about 390 W/m² leaves the surface, and the greenhouse gases absorb part of it in the lower atmosphere and re-emit half upwards and half downwards.</p><p>The gases are those with three or more atoms per molecule, because such molecules can vibrate in bending modes that absorb infrared: water vapour (the largest absorber), carbon dioxide, methane, nitrous oxide, ozone and the fluorinated gases. Nitrogen and oxygen, with two atoms, are transparent to infrared, which is why 99 % of the atmosphere does not cause the effect.</p><p>Quantitatively, the natural effect lifts the surface from −18 °C to 15 °C, a gain of 33 °C. Since 1750 the CO₂ concentration has gone from 280 to 420 ppm, adding 2.17 W/m² of forcing, and all the gases together add about 3 W/m². That looks small against 340 W/m², but it is a net imbalance of nearly 1 %, which is why the earth accumulates heat equal to several Hiroshima bombs per second.</p>", "gu": "<p>પૃથ્વીને વર્તુળ તરીકે અને અંદર તથા બહાર ત્રણ તીર દોરો. આવતું ટૂંકા તરંગનું સૂર્યકિરણોત્સર્ગ વાતાવરણની ટોચે લગભગ 340 W/m² લાવે. લગભગ 100 W/m² વાદળ, બરફ અને રણ પરાવર્તિત કરે - આલ્બેડો - અને લગભગ 240 W/m² સપાટી તથા વાતાવરણ શોષે. ગરમ સપાટી લાંબા તરંગનું ઇન્ફ્રારેડ ફેંકે, જેમાંથી લગભગ 390 W/m² સપાટી છોડે, અને હરિતગૃહ વાયુ તેનો ભાગ નીચલા વાતાવરણમાં શોષી અડધો ઉપર અને અડધો નીચે ફેંકે.</p><p>વાયુ તે છે જેમના પ્રતિ અણુ ત્રણ કે વધુ પરમાણુ હોય, કારણ કે તેવા અણુ વળાંક પ્રકારે કંપી ઇન્ફ્રારેડ શોષી શકે: પાણીની વરાળ (સૌથી મોટું શોષક), કાર્બન ડાયોક્સાઇડ, મિથેન, નાઇટ્રસ ઓક્સાઇડ, ઓઝોન અને ફ્લોરિનવાળા વાયુ. બે પરમાણુવાળા નાઇટ્રોજન અને ઓક્સિજન ઇન્ફ્રારેડ માટે પારદર્શક છે, તેથી જ વાતાવરણના 99 % પ્રભાવ ન કરે.</p><p>આંકડાકીય રીતે કુદરતી પ્રભાવ સપાટીને −18 °Cથી 15 °C કરે, એટલે 33 °Cનો લાભ. 1750થી CO₂ સાંદ્રતા 280થી 420 ppm થઈ, 2.17 W/m² બળ ઉમેર્યું, અને બધા વાયુ ભેગા લગભગ 3 W/m² ઉમેરે. 340 W/m² સામે તે નાનું લાગે, પણ તે લગભગ 1 %નું ચોખ્ખું અસંતુલન છે, તેથી જ પૃથ્વી દર સેકન્ડે અનેક હિરોશિમા બોમ્બ જેટલી ઉષ્મા એકઠી કરે.</p>"}}, {"h": {"en": "Practice 2. Give five lines of evidence that the climate is changing and explain each.", "gu": "સરાવ 2. જળવાયુ બદલાઈ રહ્યું છે તેના પાંચ પુરાવા આપી દરેક સમજાવો."}, "body": {"en": "<p>Temperature: the instrumental record from 1850 shows +1.2 °C, with the ten warmest years all since 2010, and the warming is confirmed by proxies such as tree rings, ice cores and corals that extend the record 800,000 years. Ice: Arctic September sea ice has shrunk about 13 % a decade, mountain glaciers have lost mass every year since the 1980s, and the Greenland and Antarctic sheets are losing ice faster than they gain it.</p><p>Sea level: about 20 cm since 1900, now rising 4.5 mm a year, from thermal expansion, glacier melt and ice sheets - measured by tide gauges and since 1992 by satellite altimetry. Precipitation: the total monsoon rain is nearly unchanged but it arrives in fewer, heavier spells, and the number of rainy days has fallen, so dry spells are longer and floods sharper.</p><p>Extremes: heat waves are more frequent, longer and hotter; the number of record hot days exceeds record cold days by a wide margin; and the sea surface is warmer, so cyclones carry more moisture and stall longer. Underlying all five is the measured rise in greenhouse gases, which is the only driver that explains the pattern with height - a warming troposphere and a cooling stratosphere - that is actually observed.</p>", "gu": "<p>તાપમાન: 1850થી ઉપકરણ રેકોર્ડ +1.2 °C દર્શાવે, સૌથી ગરમ દસ વર્ષ 2010 પછીના છે, અને વૃક્ષવલય, બરફના નમૂના તથા પરવાળા જેવા પરોક્ષ પુરાવા રેકોર્ડને 8,00,000 વર્ષ સુધી લંબાવી તેની પુષ્ટિ કરે. બરફ: આર્કટિકનો સપ્ટેમ્બરનો દરિયાઈ બરફ દાયકે લગભગ 13 % ઘટ્યો, પર્વતીય હિમનદી 1980થી દર વર્ષે દળ ગુમાવે છે, અને ગ્રીનલેન્ડ તથા એન્ટાર્કટિકનાં પડ મેળવે તેના કરતાં ઝડપથી બરફ ગુમાવે છે.</p><p>દરિયા સપાટી: 1900થી લગભગ 20 cm, હવે વર્ષે 4.5 mm વધે, ઉષ્મીય વિસ્તરણ, હિમનદી પીગળવા અને બરફનાં પડમાંથી - ભરતી માપક અને 1992થી ઉપગ્રહ ઊંચાઈ માપનથી માપાય. વરસાદ: કુલ ચોમાસાનો વરસાદ લગભગ અબદલ છે પણ ઓછી, ભારે ઝાપટામાં આવે, અને વરસાદી દિવસોની સંખ્યા ઘટી, તેથી સૂકા સમય લાંબા અને પૂર વધુ તીવ્ર.</p><p>આત્યંતિક ઘટનાઓ: ગરમીની લહેરો વધુ વારંવાર, લાંબી અને ગરમ; રેકોર્ડ ગરમ દિવસો ઠંડા દિવસો કરતાં ઘણા વધુ; અને દરિયાની સપાટી ગરમ, તેથી વાવાઝોડું વધુ ભેજ લઈ જાય અને લાંબું થોભે. પાંચેયની નીચે માપેલો હરિતગૃહ વાયુનો વધારો છે, જે એકમાત્ર એવું કારણ છે જે ઊંચાઈ પ્રમાણેનો નમૂનો - ગરમ ટ્રોપોસ્ફિયર અને ઠંડું સ્ટ્રેટોસ્ફિયર - સમજાવે, જે ખરેખર જણાય છે.</p>"}}, {"h": {"en": "Practice 3. Describe the impacts of climate change on Indian agriculture, water and health.", "gu": "સરાવ 3. ભારતની ખેતી, પાણી અને આરોગ્ય પર જળવાયુ પરિવર્તનની અસરોનું વર્ણન કરો."}, "body": {"en": "<p>Agriculture: wheat is the most sensitive crop because it fills grain in February and March, exactly when the temperature is now rising fastest. Studies put the loss at about 5-7 % of wheat yield per degree of warming, with the Indo-Gangetic plain worst affected; rice is less sensitive but suffers from heat at flowering, and pulses and mustard lose from warm winters. Pests and diseases move to new areas, and the stubble-burning season now overlaps with earlier harvests.</p><p>Water: the Himalayan glaciers feed the Ganga, Indus and Brahmaputra in the pre-monsoon months, and their retreat first increases and then reduces that flow; groundwater is already falling in Punjab, Haryana and western Uttar Pradesh because evapotranspiration rises with temperature; and heavier rain in shorter spells means more runoff and less recharge, so the same annual total recharges the aquifer less.</p><p>Health: heat waves kill the poorest first - outdoor workers, the elderly, slum residents under tin roofs - and the 2010 Ahmedabad and 2015 Andhra heat waves showed how a simple action plan saves lives. Warmer, wetter conditions extend the season and range of dengue, malaria and chikungunya; floods bring diarrhoea and leptospirosis; and air pollution, which shares the same fossil fuels, multiplies the harm. The economic cost appears as lost labour hours, lower yields and higher food prices.</p>", "gu": "<p>ખેતી: ઘઉં સૌથી સંવેદનશીલ પાક છે કારણ કે તે ફેબ્રુઆરી-માર્ચમાં દાણો ભરે, બરાબર જ્યારે તાપમાન હવે સૌથી ઝડપથી વધે છે. અભ્યાસ દરેક ડિગ્રી ગરમીે ઘઉંના ઉત્પાદનમાં લગભગ 5-7 % ખોટ દર્શાવે, જેમાં સૌથી વધુ અસર સિંધુ-ગંગાના મેદાન પર; ચોખા ઓછા સંવેદનશીલ પણ ફૂલ આવતી વખતે ગરમીથી પીડાય, અને કઠોળ તથા રાયડો ગરમ શિયાળાથી ગુમાવે. જીવાત અને રોગ નવા વિસ્તારોમાં જાય, અને પરાળ બાળવાની ઋતુ હવે વહેલી કાપણી સાથે મળી જાય છે.</p><p>પાણી: હિમાલયની હિમનદી ચોમાસા પહેલાંના મહિનામાં ગંગા, સિંધુ અને બ્રહ્મપુત્રને પોષે, અને તેમનો ક્ષય પહેલાં પ્રવાહ વધારે પછી ઘટાડે; પંજાબ, હરિયાણા અને પશ્ચિમ ઉત્તર પ્રદેશમાં ભૂગર્ભજળ પહેલેથી ઘટે છે કારણ કે તાપમાન સાથે બાષ્પવાહન વધે; અને ઓછા સમયમાં વધુ ભારે વરસાદ એટલે વધુ વહી જવું અને ઓછું ભરાવું, તેથી એ જ વાર્ષિક કુલ જળાશયને ઓછું ભરે.</p><p>આરોગ્ય: ગરમીની લહેરો સૌથી ગરીબને પહેલાં મારે - બહારના કામદાર, વૃદ્ધો, પતરાની છત નીચેના ઝૂંપડપટ્ટીના રહેવાસી - અને 2010ના અમદાવાદ તથા 2015ના આંધ્રની ગરમીની લહેરોએ દર્શાવ્યું કે સાદી કાર્ય યોજના જીવ બચાવે. ગરમ, ભેજવાળી સ્થિતિ ડેન્ગ્યુ, મલેરિયા અને ચિકનગુનિયાની ઋતુ તથા વિસ્તાર લંબાવે; પૂર ઝાડા અને લેપ્ટોસ્પાઇરોસિસ લાવે; અને એ જ અશ્મી ઇંધણમાંથી આવતું વાયુ પ્રદૂષણ નુકસાનને ગુણકારે. આર્થિક ખર્ચ ગુમાવેલા શ્રમ કલાક, ઓછા ઉત્પાદન અને વધુ ખાદ્ય ભાવ તરીકે દેખાય.</p>"}}, {"h": {"en": "Practice 4. List the mitigation options for greenhouse gases in order of cost and explain any three.", "gu": "સરાવ 4. હરિતગૃહ વાયુ માટેના શમન વિકલ્પો ખર્ચના ક્રમમાં ગણાવો અને કોઈ પણ ત્રણ સમજાવો."}, "body": {"en": "<p>Cheapest first: energy efficiency in buildings, industry and appliances; methane capture from landfills, coal mines and gas leaks; solar and wind generation; fuel switching from coal to gas where a plant is young; electrification of two and three wheelers, buses and low-temperature process heat; afforestation and soil carbon; then, most expensive, carbon capture on cement and steel, green hydrogen for steel and fertiliser, and direct air capture.</p><p>Methane capture: a landfill or a coal mine releases methane for decades. Covering the waste, flaring the gas or burning it in a small engine converts CH₄ to CO₂, and since GWP is 28 the climate benefit per tonne is large for a small cost; a single well-run landfill can cut thousands of tonnes of CO₂e a year. It is the classic example of a cheap, fast win.</p><p>Solar and wind: the levelised cost is now 2.5-3.8 rupees a unit against 4.5-6 for new coal, so the switch is an economic decision as much as a climate one; the constraint is not cost but the grid, storage and land. CCS: essential for cement and steel where the CO₂ comes from chemistry, but it consumes 20-30 % of the plant's energy and is still expensive. The honest conclusion is that the first six options can deliver most of the cut needed by 2030 and CCS is needed for the last hard 15 %.</p>", "gu": "<p>સૌથી સસ્તું પહેલાં: ઇમારત, ઉદ્યોગ અને સાધનોમાં ઊર્જા કાર્યક્ષમતા; કચરાભરાવ, કોલસાની ખાણ અને ગેસ લીકેજમાંથી મિથેન પકડ; સૌર અને પવન ઉત્પાદન; નવું હોય તેવા સ્ટેશનમાં કોલસાથી ગેસ તરફ ઇંધણ બદલો; બે અને ત્રણ પૈડાં, બસ તથા નીચા તાપમાનની પ્રક્રિયા ઉષ્માનું વીજીકરણ; વનરોપણ અને જમીન કાર્બન; પછી સૌથી મોંઘું - સિમેન્ટ અને પોલાદ પર કાર્બન પકડ, પોલાદ-ખાતર માટે લીલું હાઇડ્રોજન અને હવામાંથી સીધું પકડ.</p><p>મિથેન પકડ: કચરાભરાવ કે કોલસાની ખાણ દાયકાઓ સુધી મિથેન છોડે. કચરો ઢાંકવો, ગેસ બાળવો કે નાના એન્જિનમાં બાળવો CH₄ને CO₂માં ફેરવે, અને GWP 28 હોવાથી ટન દીઠ જળવાયુ લાભ ઓછા ખર્ચે મોટો થાય; એક સારી રીતે ચાલતો કચરાભરાવ વર્ષે હજારો ટન CO₂e ઘટાડે. સસ્તા, ઝડપી લાભનું તે ઉત્તમ ઉદાહરણ છે.</p><p>સૌર અને પવન: સમતુલિત ખર્ચ હવે યુનિટના 2.5-3.8 રૂપિયા, નવા કોલસાના 4.5-6 સામે, તેથી બદલો જળવાયુ જેટલો આર્થિક નિર્ણય પણ છે; મર્યાદા ખર્ચ નહીં, ગ્રિડ, સંગ્રહ અને જમીન છે. CCS: સિમેન્ટ અને પોલાદ માટે આવશ્યક જ્યાં CO₂ રસાયણમાંથી આવે, પણ તે સ્ટેશનની 20-30 % ઊર્જા ખાય અને હજી મોંઘું છે. પ્રામાણિક નિષ્કર્ષ એ છે કે પ્રથમ છ વિકલ્પો 2030 સુધીમાં જરૂરી ઘટાડાનો મોટો ભાગ આપી શકે અને છેલ્લા કઠિન 15 % માટે CCS જોઈએ.</p>"}}, {"h": {"en": "Practice 5. What is climate sensitivity and why is its range so wide?", "gu": "સરાવ 5. જળવાયુ સંવેદનશીલતા શું છે અને તેની શ્રેણી આટલી પહોળી કેમ છે?"}, "body": {"en": "<p>Climate sensitivity is the equilibrium warming caused by a doubling of CO₂, usually quoted as the range 1.5-4.5 °C with a best estimate near 3 °C. It is a property of the planet, not of the emissions path: it says how much warming one unit of forcing finally produces once the oceans and ice have caught up, which takes centuries for some parts.</p><p>The range is wide because of the feedbacks. The strongest, water vapour, roughly doubles the direct warming and is well measured. The cloud feedback is the uncertain one: low clouds reflect sunlight and cool, high thin clouds trap heat and warm, and models disagree on how the balance shifts as the pattern of sea surface temperature changes. Ice-albedo and permafrost carbon add further positive feedback, and each uncertainty multiplies into the final number.</p><p>The number matters for policy. At 2 °C per doubling, a 2 °C target allows a larger carbon budget and slower action; at 4.5 °C, even the present concentration already commits us to dangerous change. That is why the uncertainty is not a reason to wait - it is a reason to insure, because the downside is much worse than the upside is good.</p>", "gu": "<p>જળવાયુ સંવેદનશીલતા એ CO₂ બમણું થવાથી થતી સંતુલન ગરમી છે, સામાન્ય રીતે 1.5-4.5 °C શ્રેણી અને લગભગ 3 °C શ્રેષ્ઠ અંદાજ તરીકે કહેવાય. તે ગ્રહનો ગુણધર્મ છે, ઉત્સર્જન માર્ગનો નહીં: તે કહે છે કે બળના એક એકમથી આખરે કેટલી ગરમી થાય, જ્યારે મહાસાગર અને બરફ પકડી લે, જે કેટલાક ભાગોમાં સદીઓ લે.</p><p>શ્રેણી પહોળી છે કારણ કે પ્રતિસંદર્શ છે. સૌથી શક્તિશાળી પાણીની વરાળ સીધી ગરમી લગભગ બમણી કરે અને સારી રીતે માપાય છે. વાદળનો પ્રતિસંદર્શ અનિશ્ચિત છે: નીચલા વાદળ સૂર્યપ્રકાશ પરાવર્તિત કરી ઠંડક આપે, ઊંચા પાતળા વાદળ ઉષ્મા રોકી ગરમી આપે, અને દરિયાની સપાટીના તાપમાનનો નમૂનો બદલાતાં સંતુલન કેવી રીતે ખસે તેમાં નમૂનાઓ સહમત નથી. બરફ-આલ્બેડો અને કાયમી ઠંડી જમીનનો કાર્બન વધુ ધન પ્રતિસંદર્શ ઉમેરે, અને દરેક અનિશ્ચિતતા અંતિમ આંકડામાં ગુણાકાર કરે.</p><p>આંકડો નીતિ માટે મહત્ત્વનો છે. પ્રતિ બમણા 2 °C પર, 2 °Cનું લક્ષ્ય મોટું કાર્બન બજેટ અને ધીમી કાર્યવાહી પરવડે; 4.5 °C પર, હાલની સાંદ્રતા પણ આપણને ખતરનાક પરિવર્તન માટે બંધાયેલા કરે. તેથી જ અનિશ્ચિતતા રાહ જોવાનું કારણ નથી - તે વીમો લેવાનું કારણ છે, કારણ કે નુકસાનની બાજુ લાભની બાજુ કરતાં ઘણી ખરાબ છે.</p>"}}, {"h": {"en": "Practice 6. Explain carbon capture and storage with a block diagram and its limitations.", "gu": "સરાવ 6. બ્લોક ડાયાગ્રામ સાથે કાર્બન પકડ અને સંગ્રહ તથા તેની મર્યાદા સમજાવો."}, "body": {"en": "<p>The chain has four blocks: capture, compression, transport and storage. Capture is done in three ways - post-combustion, where an amine solvent absorbs CO₂ from the flue gas and is regenerated with heat; pre-combustion, where the fuel is turned into hydrogen and CO₂ before burning, as in an IGCC plant; and oxy-fuel, where the fuel is burnt in pure oxygen so the flue gas is almost pure CO₂ and needs no separation.</p><p>The captured CO₂ is dried and compressed to about 100 bar, when it becomes a dense supercritical fluid that can be pumped like a liquid. It travels by pipeline, often hundreds of kilometres, and is injected 1-3 km down into a saline aquifer or a depleted oil or gas field, where a cap rock of shale or salt seals it; monitoring wells check that it stays. Storage capacity worldwide is estimated in thousands of gigatonnes, far more than the emissions of a century.</p><p>Limitations: the capture unit costs 20-30 % of the plant's output, so more coal is burnt for the same electricity; capture is 85-95 %, so 5-15 % escapes; the amine solvent degrades and needs replacing; pipeline and storage need capital and public acceptance; and CCS is a reason to keep burning fuel, so it must not displace cheaper efficiency and renewables. Its true niche is cement and steel, where 50-60 % of the CO₂ comes from the process chemistry and cannot be avoided by changing the fuel.</p>", "gu": "<p>શૃંખલામાં ચાર બ્લોક છે: પકડ, દબાવટ, વહન અને સંગ્રહ. પકડ ત્રણ રીતે થાય - દહન પછી, જ્યાં એમાઇન દ્રાવક ધુમાડામાંથી CO₂ શોષે અને ઉષ્માથી ફરી મુક્ત થાય; દહન પહેલાં, જ્યાં ઇંધણ બાળતાં પહેલાં હાઇડ્રોજન અને CO₂માં ફેરવાય, જેમ કે IGCC સ્ટેશનમાં; અને ઓક્સી-ફ્યુઅલ, જ્યાં ઇંધણ શુદ્ધ ઓક્સિજનમાં બળે તેથી ધુમાડો લગભગ શુદ્ધ CO₂ હોય અને અલગ કરવો ન પડે.</p><p>પકડાયેલું CO₂ સૂકવી લગભગ 100 bar સુધી દબાવાય, જ્યારે તે ગાઢ અતિક્રાંતિક પ્રવાહી બને જે પ્રવાહીની જેમ પંપાય. તે પાઇપલાઇનથી, ઘણી વાર સેંકડો કિલોમીટર, જાય અને 1-3 km નીચે ખારા જળાશય કે ખાલી તેલ-ગેસ ક્ષેત્રમાં દબાવાય, જ્યાં શેલ કે મીઠાનો ઢાંકણ ખડક સીલ કરે; દેખરેખ કૂવા તેને રહેવાની ખાતરી કરે. દુનિયાભરની સંગ્રહ ક્ષમતા હજારો ગીગાટન આંકાય છે, જે સદીના ઉત્સર્જન કરતાં ઘણી વધુ.</p><p>મર્યાદા: પકડ એકમ સ્ટેશનના ઉત્પાદનના 20-30 % ખર્ચે, તેથી એ જ વીજળી માટે વધુ કોલસો બળે; પકડ 85-95 % છે, તેથી 5-15 % નીકળે; એમાઇન દ્રાવક બગડે અને બદલવો પડે; પાઇપલાઇન અને સંગ્રહને મૂડી તથા લોકસ્વીકૃતિ જોઈએ; અને CCS ઇંધણ બાળવાનું કારણ બને, તેથી તે સસ્તી કાર્યક્ષમતા અને પુનઃપ્રાપ્યને હટાવવું ન જોઈએ. તેની ખરી જગ્યા સિમેન્ટ અને પોલાદ છે, જ્યાં 50-60 % CO₂ પ્રક્રિયા રસાયણમાંથી આવે અને ઇંધણ બદલીને ટાળી ન શકાય.</p>"}}, {"h": {"en": "Practice 7. A city wants to reach net zero. Prepare a ten-point plan with a rough priority order.", "gu": "સરાવ 7. એક શહેર નેટ ઝીરો પામવા માંગે છે. અંદાજિત પ્રાથમિકતા ક્રમ સાથે દસ મુદ્દાની યોજના બનાવો."}, "body": {"en": "<p>1. Measure: build a greenhouse gas inventory for electricity, transport, buildings, waste and industry, because you cannot manage what you do not measure. 2. Efficiency first: LED street lighting, five-star appliances, insulation and cool roofs, which cut demand 15-25 % before any new supply is built. 3. Rooftop and ground solar with net metering, using the 500 m² of every school and hospital. 4. Electrify the bus fleet and the two and three wheelers, with charging at depots.</p><p>5. Waste: segregate at source, compost the wet half, and capture landfill gas - the cheapest tonne in the plan. 6. Water: pump with solar, repair leaks, and recharge with rainwater harvesting, because pumping is the city's largest single electricity load. 7. Buildings: make the green building code mandatory for new construction above 500 m² under the local rating system. 8. Industry: waste heat recovery, efficient boilers and a cluster-level common facility.</p><p>9. Sinks: protect and expand the city forest, plant along roads and canals, and turn the landfill into a park once it is capped. 10. Governance and money: a climate cell with a budget, green municipal bonds, a carbon registry and an annual public report. The order matters: measurement and efficiency first, because they pay for themselves and make every later step smaller, and offsets last, because a city that buys credits without cutting its own emissions has not reached net zero.</p>", "gu": "<p>1. માપો: વીજળી, વાહનવ્યવહાર, ઇમારત, કચરો અને ઉદ્યોગ માટે હરિતગૃહ વાયુ ગણતરી બનાવો, કારણ કે જે માપી ન શકાય તેનું સંચાલન ન થાય. 2. પહેલાં કાર્યક્ષમતા: LED શેરી દીવા, પાંચ સ્ટાર સાધનો, ઇન્સ્યુલેશન અને ઠંડી છત, જે કોઈ નવો પુરવઠો બાંધતાં પહેલાં માંગ 15-25 % ઘટાડે. 3. નેટ મીટરિંગ સાથે છત અને જમીન પરનું સૌર, દરેક શાળા અને હોસ્પિટલની 500 m² વાપરીને. 4. ડેપો પર ચાર્જિંગ સાથે બસ સેવા તથા બે અને ત્રણ પૈડાંનું વીજીકરણ.</p><p>5. કચરો: સ્રોત પર અલગ કરો, ભીનો અડધો ખાતર બનાવો અને કચરાભરાવનો ગેસ પકડો - યોજનાનું સૌથી સસ્તું ટન. 6. પાણી: સૌરથી પંપ ચલાવો, લીકેજ સુધારો અને વરસાદી જળ સંગ્રહથી ભરાવો, કારણ કે પંપ શહેરનો સૌથી મોટો એક વીજ ભાર છે. 7. ઇમારત: 500 m²થી મોટા નવા બાંધકામ માટે સ્થાનિક રેટિંગ પ્રણાલી હેઠળ લીલા ઇમારત નિયમાવલી ફરજિયાત કરો. 8. ઉદ્યોગ: કચરા ઉષ્માનો પુનઃઉપયોગ, કાર્યક્ષમ બોઇલર અને ક્લસ્ટર સ્તરે સામાન્ય સુવિધા.</p><p>9. શોષક: શહેરી વન સાચવો અને વધારો, રસ્તા અને કેનાલ પર વાવો, અને ઢાંક્યા પછી કચરાભરાવને બગીચો બનાવો. 10. શાસન અને નાણું: બજેટ સાથે જળવાયુ કોષ, લીલા નગરપાલિકા બોન્ડ, કાર્બન નોંધ અને વાર્ષિક જાહેર અહેવાલ. ક્રમ મહત્ત્વનો છે: પહેલાં માપન અને કાર્યક્ષમતા, કારણ કે તે પોતાનો ખર્ચ કાઢે અને પછીનું દરેક પગલું નાનું કરે, અને ઓફસેટ છેલ્લે, કારણ કે પોતાનું ઉત્સર્જન ઘટાડ્યા વગર ક્રેડિટ ખરીદતું શહેર નેટ ઝીરો પામ્યું નથી.</p>"}}, {"h": {"en": "Practice 8. Explain the evidence for sea level rise and its threat to Indian coastal cities.", "gu": "સરાવ 8. દરિયા સપાટીના વધારાના પુરાવા અને ભારતીય કિનારાનાં શહેરો માટેના જોખમને સમજાવો."}, "body": {"en": "<p>Evidence: tide gauges show about 20 cm since 1900; satellite altimetry since 1992 shows the rate has doubled to 4.5 mm a year; the three contributors are measured separately - thermal expansion 1.4 mm, glaciers 0.8 mm, ice sheets 0.8 mm - and the budget closes, which is what makes the result trustworthy. Gravity satellites show Greenland losing about 250 Gt of ice a year and Antarctica about 150 Gt.</p><p>Threat to India: 7,500 km of coast, 40 % of the population within 100 km of the sea, and twelve major ports. Mumbai's reclaimed land and its storm-water drains, Surat's Tapi estuary, Kochi's backwaters and Chennai's beaches all face three hazards together: tidal flooding on spring tides, salt water pushing into the coastal aquifer as the sea rises, and stronger cyclone surge. A 0.5 m rise is expected to put about 35 million Indians at risk of once-a-century flooding.</p><p>Response: a mix of protection, accommodation and retreat. Protection means sea walls, embankments and mangrove belts, as in the Sundarbans where mangroves absorb surge energy. Accommodation means raised plinths, flood-proof drainage, salt-tolerant crops and early warning. Retreat means no new construction in the highest-risk zones, with planned relocation rather than a rushed evacuation after the next flood.</p>", "gu": "<p>પુરાવા: ભરતી માપક 1900થી લગભગ 20 cm દર્શાવે; 1992થી ઉપગ્રહ ઊંચાઈ માપન દર વર્ષે 4.5 mm સુધી બમણો થયો દર્શાવે; ત્રણ ફાળાવાળા ઘટક અલગ માપાય - ઉષ્મીય વિસ્તરણ 1.4 mm, હિમનદી 0.8 mm, બરફનાં પડ 0.8 mm - અને ગણતરી મળી જાય, તેથી જ પરિણામ ભરોસાપાત્ર બને. ગુરુત્વ ઉપગ્રહ ગ્રીનલેન્ડ વર્ષે લગભગ 250 Gt અને એન્ટાર્કટિકા લગભગ 150 Gt બરફ ગુમાવતું દર્શાવે.</p><p>ભારત માટે જોખમ: 7,500 km કિનારો, 40 % વસ્તી દરિયાથી 100 kmમાં અને બાર મોટાં બંદર. મુંબઈની ભરાવટવાળી જમીન અને વરસાદી ગટર, સુરતનું તાપી મુખ, કોચીનું કાલ કેનાલ અને ચેન્નાઈના દરિયાકિનારા ત્રણ જોખમ સાથે મળે છે: અમાસ-પૂનમની ભરતીનું પૂર, દરિયો વધતાં કિનારાના જળાશયમાં ખારું પાણી ઘૂસવું અને વધુ તાકાતવાન વાવાઝોડાની ભરતી. 0.5 m વધારો લગભગ 3.5 કરોડ ભારતીયોને સદીમાં એક વારના પૂરના જોખમમાં મૂકશે તેમ અપેક્ષિત છે.</p><p>પ્રતિસાદ: રક્ષણ, અનુકૂલન અને પીછેહઠનું મિશ્રણ. રક્ષણ એટલે દરિયાની દીવાલ, બંધ અને કાંદાના પટ્ટા, જેમ કે સુંદરબનમાં જ્યાં કાંદા ભરતીની ઊર્જા શોષે. અનુકૂલન એટલે ઊંચા પાયા, પૂર-પ્રતિરોધી ગટર, ખારા-સહિષ્ણુ પાક અને વહેલી ચેતવણી. પીછેહઠ એટલે સૌથી વધુ જોખમવાળા વિસ્તારોમાં નવું બાંધકામ નહીં, અને આગલા પૂર પછીની ઉતાવળી ખાલી કરાવવાને બદલે યોજનાબદ્ધ સ્થળાંતર.</p>"}}, {"h": {"en": "Practice 9. What is extreme event attribution? Answer with one heat wave and one rainfall example.", "gu": "સરાવ 9. આત્યંતિક ઘટના કારણ નિર્ધારણ શું છે? એક ગરમીની લહેર અને એક વરસાદના ઉદાહરણ સાથે જવાબ આપો."}, "body": {"en": "<p>Attribution asks a conditional question: given the world as it is, how did greenhouse warming change the probability or the intensity of this event? The method runs two large ensembles of a climate model - one with the actual greenhouse gas concentrations, one with pre-industrial concentrations - and compares how often an event of that size occurs in each. The answer is a ratio or a percentage, not a yes or no.</p><p>Heat wave example: the 2022 India-Pakistan pre-monsoon heat, with 49 °C in Delhi in April, was found to be about thirty times more likely and about 1 °C hotter because of human-caused warming. The physics is direct: the baseline temperature is higher, so the same weather pattern produces a more extreme maximum.</p><p>Rainfall example: in the 2018 Kerala floods, attribution studies found that the heaviest three-day totals were about 6-18 % heavier than they would have been without warming, because the air held more moisture. Note the wording in both cases: the event still happened because of a weather pattern, and warming changed its odds or its size. That is exactly the statement the IPCC makes, and it is why a single flood is not proof but a thousand floods are a pattern.</p>", "gu": "<p>કારણ નિર્ધારણ શરતી પ્રશ્ન પૂછે: આજની દુનિયામાં હરિતગૃહ ગરમીએ આ ઘટનાની શક્યતા કે તીવ્રતા કેવી રીતે બદલી? આ રીત જળવાયુ નમૂનાના બે મોટા સમૂહ ચલાવે - એક વાસ્તવિક હરિતગૃહ વાયુ સાંદ્રતા સાથે, એક ઉદ્યોગ પહેલાંની સાંદ્રતા સાથે - અને દરેકમાં તે માપની ઘટના કેટલી વાર આવે તે સરખાવે. જવાબ હા કે ના નહીં, ગુણોત્તર કે ટકા હોય.</p><p>ગરમીની લહેરનું ઉદાહરણ: 2022ના ભારત-પાકિસ્તાનના ચોમાસા પહેલાંની ગરમીમાં દિલ્હીમાં એપ્રિલમાં 49 °C, માનવજન્ય ગરમીને કારણે લગભગ ત્રીસ ગણી વધુ શક્ય અને લગભગ 1 °C વધુ ગરમ મળી. ભૌતિકશાસ્ત્ર સીધું છે: આધાર તાપમાન ઊંચું હોવાથી એ જ હવામાન નમૂનો વધુ તીવ્ર મહત્તમ બનાવે.</p><p>વરસાદનું ઉદાહરણ: 2018ના કેરળ પૂરમાં કારણ નિર્ધારણ અભ્યાસે જણાવ્યું કે સૌથી ભારે ત્રણ દિવસનો કુલ વરસાદ ગરમી વગર કરતાં લગભગ 6-18 % વધુ ભારે હતો, કારણ કે હવામાં વધુ ભેજ હતો. બંને કિસ્સામાં શબ્દો ધ્યાનમાં લો: ઘટના હજી હવામાનના નમૂનાને કારણે થઈ, અને ગરમીએ તેની શક્યતા કે માપ બદલ્યું. IPCC બરાબર એ જ વિધાન કરે છે, અને તેથી જ એક પૂર પુરાવો નથી પણ હજાર પૂર એક નમૂનો છે.</p>"}}, {"h": {"en": "Practice 10. Explain the difference between the ozone hole and global warming.", "gu": "સરાવ 10. ઓઝોન છિદ્ર અને વૈશ્વિક ગરમી વચ્ચેનો ફરક સમજાવો."}, "body": {"en": "<p>They are two different problems that are often confused. The ozone hole is a thinning of the stratospheric ozone layer 15-35 km up, caused by chlorofluorocarbons. It lets more harmful ultraviolet-B radiation reach the ground, raising skin cancer and crop damage, and it is worst over Antarctica in spring. Global warming is the trapping of outgoing infrared radiation in the troposphere by greenhouse gases.</p><p>The links are indirect. CFCs are themselves potent greenhouse gases, so phasing them out under the Montreal Protocol also slowed warming - the single most successful environmental treaty. And a cooler stratosphere, which greenhouse warming produces, makes polar ozone depletion slightly worse. But ozone does not cause global warming and cutting CO₂ will not repair the ozone layer; each problem needed its own treaty and its own control measure.</p>", "gu": "<p>તે બે જુદી સમસ્યા છે જે ઘણી વાર ભેગી થાય. ઓઝોન છિદ્ર 15-35 km ઉપરના સ્ટ્રેટોસ્ફિયરના ઓઝોન સ્તરનું પાતળું થવું છે, જે ક્લોરોફ્લોરોકાર્બનથી થાય. તે વધુ હાનિકારક પારજાંબલી-B કિરણો જમીન સુધી પહોંચવા દે, જે ત્વચાના કેન્સર અને પાકના નુકસાનને વધારે, અને વસંતમાં એન્ટાર્કટિકા પર સૌથી વધુ હોય. વૈશ્વિક ગરમી ટ્રોપોસ્ફિયરમાં હરિતગૃહ વાયુ દ્વારા બહાર જતા ઇન્ફ્રારેડ કિરણોને રોકવાની છે.</p><p>સંબંધ પરોક્ષ છે. CFC પોતે શક્તિશાળી હરિતગૃહ વાયુ છે, તેથી મોન્ટ્રિયલ પ્રોટોકોલ હેઠળ તેમને દૂર કરવાથી ગરમી પણ ધીમી પડી - સૌથી સફળ પર્યાવરણ સંધિ. અને હરિતગૃહ ગરમી ઉત્પન્ન કરતું ઠંડું સ્ટ્રેટોસ્ફિયર ધ્રુવીય ઓઝોન ક્ષયને થોડો વધારે. પણ ઓઝોન વૈશ્વિક ગરમીનું કારણ નથી અને CO₂ ઘટાડવાથી ઓઝોન સ્તર સુધરશે નહીં; દરેક સમસ્યાને પોતાની સંધિ અને પોતાનું નિયંત્રણ પગલું જોઈએ.</p>"}}, {"h": {"en": "Practice 11. Why is adaptation necessary even if mitigation succeeds?", "gu": "સરાવ 11. શમન સફળ થાય તો પણ અનુકૂલન કેમ આવશ્યક છે?"}, "body": {"en": "<p>Because of the lag in the system. The ocean has absorbed more than 90 % of the extra heat, and it releases it slowly, so about 0.5 °C of further warming is already locked in even if emissions stopped today; sea level will keep rising for centuries because the ice sheets respond over hundreds of years. Mitigation decides how bad it gets after 2050; adaptation decides how many people are hurt before then.</p><p>Adaptation is also cheaper. A heat action plan in Ahmedabad cost about one crore rupees and saved an estimated 1,100 lives in its first decade; a sea wall costs a fraction of the damage from one flood; drought-resistant seed and micro-irrigation protect a farmer's whole income. And adaptation buys time for mitigation to work - a city that floods every year spends its budget on repair instead of on the transition.</p>", "gu": "<p>પ્રણાલીના વિલંબને કારણે. મહાસાગરે વધારાની 90 %થી વધુ ઉષ્મા શોષી છે અને તે ધીમે છોડે, તેથી આજે ઉત્સર્જન બંધ થાય તો પણ લગભગ 0.5 °C વધુ ગરમી પહેલેથી નિશ્ચિત છે; દરિયા સપાટી સદીઓ સુધી વધતી રહેશે કારણ કે બરફનાં પડ સેંકડો વર્ષમાં પ્રતિક્રિયા આપે. શમન નક્કી કરે કે 2050 પછી કેટલું ખરાબ થશે; અનુકૂલન નક્કી કરે કે ત્યાં સુધીમાં કેટલા લોકોને નુકસાન થશે.</p><p>અનુકૂલન સસ્તું પણ છે. અમદાવાદની ગરમી કાર્ય યોજના લગભગ એક કરોડ રૂપિયાની થઈ અને પ્રથમ દાયકામાં અંદાજે 1,100 જીવ બચાવ્યા; દરિયાની દીવાલ એક પૂરના નુકસાનના થોડા ભાગમાં પડે; દુષ્કાળ-સહિષ્ણુ બીજ અને સૂક્ષ્મ સિંચાઈ ખેડૂતની આખી આવક બચાવે. અને અનુકૂલન શમનને કામ કરવા સમય આપે - દર વર્ષે પૂરમાં ડૂબતું શહેર તેનું બજેટ સુધારણા પર ખર્ચે, સંક્રમણ પર નહીં.</p>"}}, {"h": {"en": "Practice 12. State India's climate commitments and the three numbers behind them.", "gu": "સરાવ 12. ભારતની જળવાયુ પ્રતિબદ્ધતાઓ અને તેમની પાછળના ત્રણ આંકડા જણાવો."}, "body": {"en": "<p>India's updated Nationally Determined Contribution and the Panchamrit pledges of 2021 are usually summarised as five numbers: 500 GW of non-fossil electricity capacity by 2030; 50 % of installed capacity from non-fossil sources by 2030; a 1 billion tonne reduction in projected CO₂ by 2030; a 45 % cut in emission intensity of GDP against 2005 by 2030; and net zero by 2070. It has also led the International Solar Alliance and the LiFE mission on lifestyle.</p><p>The three numbers that decide whether the pledges are real are money, land and grid. Money: about 2.5-3 lakh crore rupees a year of investment is needed for the 500 GW, and most must come from private capital, which needs stable auctions and payment security. Land: 500 GW of solar alone needs about 8,000 km², so rooftop, agrivoltaics and wasteland matter. Grid: the inter-state transmission system and storage must grow with the plants, or the capacity is built and not used.</p>", "gu": "<p>ભારતનું અદ્યતન રાષ્ટ્રીય નિર્ધારિત યોગદાન અને 2021ના પંચામૃત વચન સામાન્ય રીતે પાંચ આંકડામાં સારાંશાય: 2030 સુધીમાં 500 GW બિન-અશ્મીય વીજ ક્ષમતા; 2030 સુધીમાં સ્થાપિત ક્ષમતાના 50 % બિન-અશ્મીય સ્રોતમાંથી; 2030 સુધીમાં અંદાજિત CO₂માં 1 અબજ ટન ઘટાડો; 2030 સુધીમાં 2005 સામે GDPની ઉત્સર્જન તીવ્રતામાં 45 % ઘટાડો; અને 2070 સુધીમાં નેટ ઝીરો. તેણે આંતરરાષ્ટ્રીય સૌર ગઠબંધન અને જીવનશૈલી પર LiFE મિશનનું નેતૃત્વ પણ કર્યું છે.</p><p>વચનો ખરાં છે કે નહીં તે નક્કી કરતા ત્રણ આંકડા નાણું, જમીન અને ગ્રિડ છે. નાણું: 500 GW માટે વર્ષે લગભગ 2.5-3 લાખ કરોડ રૂપિયાનું રોકાણ જોઈએ, અને મોટો ભાગ ખાનગી મૂડીમાંથી આવવો જોઈએ, જેને સ્થિર હરાજી અને ચુકવણી સુરક્ષા જોઈએ. જમીન: ફક્ત 500 GW સૌરને લગભગ 8,000 km² જોઈએ, તેથી છત, કૃષિ-સૌર અને બંજર જમીન મહત્ત્વનાં. ગ્રિડ: આંતર-રાજ્ય ટ્રાન્સમિશન પ્રણાલી અને સંગ્રહ સ્ટેશનો સાથે વધવાં જોઈએ, નહીં તો ક્ષમતા બનશે પણ વપરાશે નહીં.</p>"}}]}], "diagrams": [{"id": "u4_balance", "title": {"en": "The energy balance and the greenhouse effect", "gu": "પૃથ્વીનું ઊર્જા સંતુલન અને હરિતગૃહ પ્રભાવ"}, "file": "diagrams/u4_balance.svg", "caption": {"en": "Sunlight comes in short, leaves as infrared; the greenhouse gases slow the exit and lift the surface from -18 C to 15 C.", "gu": "સૂર્યપ્રકાશ ટૂંકા તરંગે આવે અને ઇન્ફ્રારેડ તરીકે નીકળે; હરિતગૃહ વાયુ નીકળવાનું ધીમું કરે અને સપાટી -18 Cથી 15 C કરે."}}, {"id": "u4_ghg", "title": {"en": "Greenhouse gases by strength and by source", "gu": "શક્તિ અને સ્રોત પ્રમાણે હરિતગૃહ વાયુ"}, "file": "diagrams/u4_ghg.svg", "caption": {"en": "CO2 is the largest share, methane the fastest lever, fluorinated gases the strongest per kilogram.", "gu": "CO₂ સૌથી મોટો હિસ્સો, મિથેન સૌથી ઝડપી લિવર, ફ્લોરિનવાળા વાયુ પ્રતિ કિલો સૌથી શક્તિશાળી."}}, {"id": "u4_temp", "title": {"en": "Warming since 1850, and the fingerprints", "gu": "1850થી ગરમી, અને કારણ બતાવતાં અંગૂઠાનાં નિશાન"}, "file": "diagrams/u4_temp.svg", "caption": {"en": "The average moved 1.2 C, but the pattern with height and with the seasons is what proves the cause.", "gu": "સરેરાશ 1.2 C ખસ્યું, પણ ઊંચાઈ અને ઋતુ પ્રમાણેનો નમૂનો જ કારણ પુરવાર કરે."}}, {"id": "u4_sea", "title": {"en": "Three routes to a higher sea", "gu": "ઊંચા દરિયા સુધીના ત્રણ રસ્તા"}, "file": "diagrams/u4_sea.svg", "caption": {"en": "Expansion, glaciers and ice sheets add about 4.5 mm a year; melting sea ice adds nothing because it already floats.", "gu": "વિસ્તરણ, હિમનદી અને બરફનાં પડ વર્ષે લગભગ 4.5 mm ઉમેરે; દરિયાઈ બરફ પીગળવાથી કંઈ વધતું નથી કારણ કે તે પહેલેથી તરે છે."}}, {"id": "u4_impacts", "title": {"en": "What a warmer world does to land and sea", "gu": "ગરમ દુનિયા જમીન અને દરિયા સાથે શું કરે"}, "file": "diagrams/u4_impacts.svg", "caption": {"en": "Species move, the ocean turns more acidic, dry land degrades - three different mechanisms from the same warming.", "gu": "જાતિઓ ખસે, મહાસાગર વધુ અમ્લીય બને, સૂકી જમીન ક્ષીણ થાય - એક જ ગરમીની ત્રણ જુદી રીતો."}}, {"id": "u4_mitigation", "title": {"en": "The mitigation ladder from efficiency to net zero", "gu": "કાર્યક્ષમતાથી નેટ ઝીરો સુધીનું શમન સોપાન"}, "file": "diagrams/u4_mitigation.svg", "caption": {"en": "Save it, electrify it, clean it, capture what is left; offsets are the last step, not the first.", "gu": "બચાવો, વીજીકરણ કરો, સ્વચ્છ કરો, બાકીનું પકડો; ઓફસેટ પહેલું નહીં, છેલ્લું પગલું છે."}}], "equations": [{"title": {"en": "Forcing and temperature", "gu": "બળ અને તાપમાન"}, "items": [{"name": {"en": "Radiative forcing of CO₂", "gu": "CO₂નું કિરણોત્સર્ગી બળ"}, "f": "ΔF = 5.35 ln(C / C₀)", "terms": {"en": "C is the present concentration in ppm and C₀ the pre-industrial 280 ppm.", "gu": "C એ હાલની સાંદ્રતા ppmમાં અને C₀ ઉદ્યોગ પહેલાંનું 280 ppm."}}, {"name": {"en": "Equilibrium warming", "gu": "સંતુલન ગરમી"}, "f": "ΔT = λ ΔF", "terms": {"en": "λ is about 0.8 °C per W/m²; the IPCC likely range of λ gives 2.2-4.5 °C for a doubling.", "gu": "λ લગભગ 0.8 °C પ્રતિ W/m²; IPCCની સંભવિત શ્રેણી બમણા માટે 2.2-4.5 °C આપે."}}, {"name": {"en": "CO₂ equivalent", "gu": "CO₂ સમમૂલ્ય"}, "f": "CO₂e = Σ (mass × GWP)", "terms": {"en": "GWP is 1 for CO₂, 28 for methane and 265 for nitrous oxide over 100 years.", "gu": "100 વર્ષમાં GWP CO₂ માટે 1, મિથેન માટે 28 અને નાઇટ્રસ ઓક્સાઇડ માટે 265 છે."}}, {"name": {"en": "Carbon budget", "gu": "કાર્બન બજેટ"}, "f": "years = budget / annual emissions", "terms": {"en": "The budget is the total CO₂ that can still be emitted for a temperature goal.", "gu": "બજેટ એ તાપમાન લક્ષ્ય માટે હજી છોડી શકાય તેવું કુલ CO₂ છે."}}]}, {"title": {"en": "Ice, sea and ocean chemistry", "gu": "બરફ, દરિયો અને મહાસાગર રસાયણ"}, "items": [{"name": {"en": "Sea level from melt", "gu": "પીગળવાથી દરિયા સપાટી"}, "f": "SLR (mm) = mass lost (Gt) / 361", "terms": {"en": "361 Gt of water spread over the ocean raises it by about one millimetre.", "gu": "મહાસાગર પર ફેલાયેલું 361 Gt પાણી તેને લગભગ એક મિલીમીટર વધારે."}}, {"name": {"en": "Hydrogen ion change", "gu": "હાઇડ્રોજન આયન ફેરફાર"}, "f": "[H⁺] = 10^(−pH),  ratio = 10^(pH_old − pH_new)", "terms": {"en": "A fall of 0.1 in pH is a 26 % rise in acidity, not 1 %.", "gu": "pH માં 0.1નો ઘટાડો અમ્લતામાં 26 % વધારો છે, 1 % નહીં."}}]}, {"title": {"en": "Mitigation arithmetic", "gu": "શમનનું ગણિત"}, "items": [{"name": {"en": "Emissions of a plant", "gu": "સ્ટેશનનું ઉત્સર્જન"}, "f": "m_CO₂ = P × 8,760 × CF × EF", "terms": {"en": "P is the rating in MW, CF the capacity factor and EF the emission factor in t per MWh.", "gu": "P એ MWમાં રેટિંગ, CF ક્ષમતા અવયવ અને EF એ પ્રતિ MWh ટનમાં ઉત્સર્જન અવયવ."}}, {"name": {"en": "Emitted CO₂ avoided", "gu": "બચતનું CO₂"}, "f": "m = E × (EF_grid − EF_new)", "terms": {"en": "For solar against the Indian grid: EF_grid about 0.71 t per MWh and EF_solar about 0.05.", "gu": "ભારતીય ગ્રિડ સામે સૌર માટે: EF_grid લગભગ 0.71 t પ્રતિ MWh અને EF_solar લગભગ 0.05."}}, {"name": {"en": "Capture with a penalty", "gu": "ખોટ સાથે પકડ"}, "f": "m_captured = η_capture × m_emitted;  P_net = P × (1 − penalty)", "terms": {"en": "A capture unit of 90 % efficiency with a 25 % energy penalty leaves 10 % escaping.", "gu": "90 % કાર્યક્ષમતાનો પકડ એકમ 25 % ઊર્જા ખોટ સાથે 10 % નીકળવા દે."}}, {"name": {"en": "Land sink", "gu": "જમીન શોષક"}, "f": "area = emissions / uptake per hectare", "terms": {"en": "Young tropical forest takes up 10-15 t CO₂ per hectare a year.", "gu": "જુવાન ઉષ્ણકટિબંધીય વન વર્ષે પ્રતિ હેક્ટર 10-15 t CO₂ લે."}}]}], "numericals": [{"id": "u4n01", "unit": 4, "h": {"en": "How long the 1.5 °C carbon budget lasts.", "gu": "1.5 °Cનું કાર્બન બજેટ કેટલું ચાલશે."}, "q": {"en": "About 250 Gt of CO₂ can still be emitted if warming is to stay near 1.5 °C, and the world emits 42 Gt a year. Find the years left at the present rate and the cut needed to stretch the budget to 30 years.", "gu": "ગરમી 1.5 °C નજીક રાખવી હોય તો હજી લગભગ 250 Gt CO₂ છોડી શકાય અને દુનિયા વર્ષે 42 Gt છોડે છે. હાલના દરે બાકી વર્ષો અને બજેટ 30 વર્ષ લંબાવવા જરૂરી ઘટાડો શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>About 250 Gt of CO₂ can still be emitted if warming is to stay near 1.5 °C, and the world emits 42 Gt a year. Find the years left at the present rate and the cut needed to stretch the budget to 30 years.</p><h4>Step-by-step solution</h4><p>Years left = 250 / 42 = 5.95 ≈ 6 years</p><p>For 30 years the rate must be 250 / 30 = 8.3 Gt a year</p><p>So emissions must fall by (42 − 8.3) / 42 = 80 %</p><h4>Answer</h4><p><b>6 years at the present rate; 80 % cut to stretch it to 30 years</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>ગરમી 1.5 °C નજીક રાખવી હોય તો હજી લગભગ 250 Gt CO₂ છોડી શકાય અને દુનિયા વર્ષે 42 Gt છોડે છે. હાલના દરે બાકી વર્ષો અને બજેટ 30 વર્ષ લંબાવવા જરૂરી ઘટાડો શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>બાકી વર્ષ = 250 / 42 = 5.95 ≈ 6 વર્ષ</p><p>30 વર્ષ માટે દર 250 / 30 = 8.3 Gt વર્ષે હોવો જોઈએ</p><p>તેથી ઉત્સર્જન (42 − 8.3) / 42 = 80 % ઘટવું જોઈએ</p><h4>જવાબ</h4><p><b>હાલના દરે 6 વર્ષ; 30 વર્ષ લંબાવવા 80 % ઘટાડો</b></p>"}, "answer": {"en": "6 years at the present rate; 80 % cut to stretch it to 30 years", "gu": "હાલના દરે 6 વર્ષ; 30 વર્ષ લંબાવવા 80 % ઘટાડો"}}, {"id": "u4n02", "unit": 4, "h": {"en": "Radiative forcing and the warming it implies.", "gu": "કિરણોત્સર્ગી બળ અને તેની ગરમી."}, "q": {"en": "CO₂ has risen from 280 ppm to 420 ppm. Using ΔF = 5.35 ln(C/C₀) and a climate sensitivity of 0.8 °C per W/m², find the forcing and the equilibrium warming.", "gu": "CO₂ 280 ppmથી 420 ppm થયું છે. ΔF = 5.35 ln(C/C₀) અને પ્રતિ W/m² 0.8 °C જળવાયુ સંવેદનશીલતા વાપરીને બળ અને સંતુલન ગરમી શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>CO₂ has risen from 280 ppm to 420 ppm. Using ΔF = 5.35 ln(C/C₀) and a climate sensitivity of 0.8 °C per W/m², find the forcing and the equilibrium warming.</p><h4>Step-by-step solution</h4><p>C/C₀ = 420 / 280 = 1.5</p><p>ΔF = 5.35 × ln 1.5 = 5.35 × 0.4055 = 2.17 W/m²</p><p>ΔT = λ ΔF = 0.8 × 2.17 = 1.74 °C at equilibrium</p><p>About 1.2 °C is observed so far because the ocean is still catching up</p><h4>Answer</h4><p><b>2.17 W/m² and 1.74 °C at equilibrium</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>CO₂ 280 ppmથી 420 ppm થયું છે. ΔF = 5.35 ln(C/C₀) અને પ્રતિ W/m² 0.8 °C જળવાયુ સંવેદનશીલતા વાપરીને બળ અને સંતુલન ગરમી શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>C/C₀ = 420 / 280 = 1.5</p><p>ΔF = 5.35 × ln 1.5 = 5.35 × 0.4055 = 2.17 W/m²</p><p>સંતુલને ΔT = λ ΔF = 0.8 × 2.17 = 1.74 °C</p><p>હજી લગભગ 1.2 °C જણાય છે કારણ કે મહાસાગર હજી પકડી રહ્યો છે</p><h4>જવાબ</h4><p><b>2.17 W/m² અને સંતુલને 1.74 °C</b></p>"}, "answer": {"en": "2.17 W/m² and 1.74 °C at equilibrium", "gu": "2.17 W/m² અને સંતુલને 1.74 °C"}}, {"id": "u4n03", "unit": 4, "h": {"en": "Sea level rise from melting ice.", "gu": "બરફ પીગળવાથી દરિયા સપાટીનો વધારો."}, "q": {"en": "Ice sheets and glaciers lose 400 Gt of ice a year. One millimetre of global sea level is about 361 Gt of water, and thermal expansion adds 1.4 mm a year. Find the total rise.", "gu": "બરફનાં પડ અને હિમનદી વર્ષે 400 Gt બરફ ગુમાવે છે. વૈશ્વિક દરિયા સપાટીનો એક મિલીમીટર લગભગ 361 Gt પાણી છે અને ઉષ્મીય વિસ્તરણ વર્ષે 1.4 mm ઉમેરે છે. કુલ વધારો શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>Ice sheets and glaciers lose 400 Gt of ice a year. One millimetre of global sea level is about 361 Gt of water, and thermal expansion adds 1.4 mm a year. Find the total rise.</p><h4>Step-by-step solution</h4><p>Melt contribution = 400 / 361 = 1.11 mm a year</p><p>Total = 1.11 + 1.4 = 2.51 mm a year</p><p>Over 80 years that is about 20 cm, matching the measured rise since 1900</p><h4>Answer</h4><p><b>About 2.5 mm a year, 20 cm in 80 years</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>બરફનાં પડ અને હિમનદી વર્ષે 400 Gt બરફ ગુમાવે છે. વૈશ્વિક દરિયા સપાટીનો એક મિલીમીટર લગભગ 361 Gt પાણી છે અને ઉષ્મીય વિસ્તરણ વર્ષે 1.4 mm ઉમેરે છે. કુલ વધારો શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>પીગળવાનો ફાળો = 400 / 361 = 1.11 mm વર્ષે</p><p>કુલ = 1.11 + 1.4 = 2.51 mm વર્ષે</p><p>80 વર્ષમાં તે લગભગ 20 cm, 1900થી માપેલા વધારા સાથે મળે</p><h4>જવાબ</h4><p><b>વર્ષે લગભગ 2.5 mm, 80 વર્ષમાં 20 cm</b></p>"}, "answer": {"en": "About 2.5 mm a year, 20 cm in 80 years", "gu": "વર્ષે લગભગ 2.5 mm, 80 વર્ષમાં 20 cm"}}, {"id": "u4n04", "unit": 4, "h": {"en": "Emissions of one coal station.", "gu": "એક કોલસા સ્ટેશનનું ઉત્સર્જન."}, "q": {"en": "A 500 MW coal station runs at a 60 % capacity factor and emits 0.9 t of CO₂ per MWh. Find its yearly energy and emissions, and the CO₂ per kWh.", "gu": "500 MW કોલસા સ્ટેશન 60 % ક્ષમતા અવયવે ચાલે અને પ્રતિ MWh 0.9 t CO₂ છોડે. તેની વાર્ષિક ઊર્જા અને ઉત્સર્જન તથા પ્રતિ kWh CO₂ શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A 500 MW coal station runs at a 60 % capacity factor and emits 0.9 t of CO₂ per MWh. Find its yearly energy and emissions, and the CO₂ per kWh.</p><h4>Step-by-step solution</h4><p>Energy = 500 × 8,760 × 0.60 = 2.63 × 10⁶ MWh = 2.63 TWh</p><p>CO₂ = 2.63 × 10⁶ × 0.9 = 2.37 × 10⁶ t = 2.37 Mt a year</p><p>Per kWh = 0.9 kg, which is why one unit of coal power is described as a kilogram of CO₂</p><h4>Answer</h4><p><b>2.63 TWh and 2.37 Mt of CO₂ a year, 0.9 kg per kWh</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>500 MW કોલસા સ્ટેશન 60 % ક્ષમતા અવયવે ચાલે અને પ્રતિ MWh 0.9 t CO₂ છોડે. તેની વાર્ષિક ઊર્જા અને ઉત્સર્જન તથા પ્રતિ kWh CO₂ શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>ઊર્જા = 500 × 8,760 × 0.60 = 2.63 × 10⁶ MWh = 2.63 TWh</p><p>CO₂ = 2.63 × 10⁶ × 0.9 = 2.37 × 10⁶ t = 2.37 Mt વર્ષે</p><p>પ્રતિ kWh = 0.9 કિલો, તેથી જ એક યુનિટ કોલસા વીજળીને એક કિલો CO₂ કહે છે</p><h4>જવાબ</h4><p><b>વર્ષે 2.63 TWh અને 2.37 Mt CO₂, પ્રતિ kWh 0.9 કિલો</b></p>"}, "answer": {"en": "2.63 TWh and 2.37 Mt of CO₂ a year, 0.9 kg per kWh", "gu": "વર્ષે 2.63 TWh અને 2.37 Mt CO₂, પ્રતિ kWh 0.9 કિલો"}}, {"id": "u4n05", "unit": 4, "h": {"en": "A greenhouse gas basket in CO₂ equivalent.", "gu": "CO₂ સમમૂલ્યમાં હરિતગૃહ વાયુની ટોપલી."}, "q": {"en": "A factory releases 100 t of CO₂, 2 t of methane and 0.1 t of nitrous oxide in a year. Using GWP values of 1, 28 and 265, find the total in CO₂ equivalent and the share of methane.", "gu": "એક કારખાનું વર્ષે 100 t CO₂, 2 t મિથેન અને 0.1 t નાઇટ્રસ ઓક્સાઇડ છોડે છે. GWP 1, 28 અને 265 વાપરીને CO₂ સમમૂલ્યમાં કુલ અને મિથેનનો હિસ્સો શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A factory releases 100 t of CO₂, 2 t of methane and 0.1 t of nitrous oxide in a year. Using GWP values of 1, 28 and 265, find the total in CO₂ equivalent a
