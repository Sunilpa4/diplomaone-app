<style>
:root{--p:#7B2CD9;--pd:#6420B8;--lav:#EADDF7;--bg:#F3ECFA;--ink:#1d1b20}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#d8cce8;font-family:"Noto Sans Gujarati","Shruti","Nirmala UI",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink)}

.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;color:rgba(255,255,255,.75);padding:10px 14px 12px;font-size:14.5px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;background:none;border-top:0;border-left:0;border-right:0}
.tab.on{color:#fff;border-bottom-color:#fff}
.sec{margin-bottom:14px}
.sh{background:var(--lav);display:flex;align-items:center;justify-content:space-between;padding:16px 14px 16px 18px;font-weight:800;font-size:17px;position:relative}
.more{background:none;border:0;padding:4px 6px;cursor:pointer;border-radius:50%}
.menu{display:none;position:absolute;right:12px;top:48px;background:#fff;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.18);z-index:5;overflow:hidden;min-width:150px}
.menu.show{display:block}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:12px 16px;font-size:14.5px;cursor:pointer}
.menu button:hover{background:#f4eefc}
.card{background:#fff;border-radius:6px;margin:0 0 8px;box-shadow:0 1px 3px rgba(60,20,110,.14)}
.q{display:flex;gap:10px;align-items:flex-start;padding:16px 14px 16px 18px;color:var(--p);font-size:16.5px;line-height:1.45;cursor:pointer}
.q .n{flex:none;min-width:24px}

.q.hd{font-weight:700}
.chev{flex:none;transition:transform .2s;margin-top:1px}
.card.open .chev{transform:rotate(180deg)}
.a{display:none;padding:0 16px 18px 52px;font-size:15.5px;line-height:1.65;color:#222}
.card.open .a{display:block;animation:fd .2s}
@keyframes fd{from{opacity:0;transform:translateY(-4px)}to{opacity:1}}
.a p{margin:0 0 10px}.a ul,.a ol{margin:0 0 10px;padding-left:20px}.a li{margin-bottom:4px}
.a b{color:#111}
.eq{background:#F5EEFD;border-left:4px solid var(--p);padding:8px 12px;border-radius:4px;font-weight:700;font-size:16.5px;color:var(--pd)}

.tw{overflow-x:auto;margin:0 0 10px -36px;padding-left:0}
table{border-collapse:collapse;font-size:13.5px;min-width:100%;line-height:1.4}

td{border-bottom:1px solid #eadff6;padding:7px 8px;vertical-align:top}
tr:nth-child(even) td{background:#faf7fe}

.fbox{margin:4px 0 0;background:#F5EEFD;border-radius:6px;padding:9px 12px;font-size:18px;font-weight:700;color:var(--pd);display:inline-block}

.mk{flex:none;background:#FFF1D6;color:#9A5B00;border-radius:12px;padding:2px 9px;font-size:12.5px;font-weight:800;margin-top:2px}
.ad{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:56px;background:#fff;border-top:1px solid #e3d8f0;display:flex;align-items:center;justify-content:center;gap:8px;color:#8b8199;font-size:12.5px;z-index:9}

.mb svg{display:block;width:100%;height:auto}

.intro{margin:12px 10px;background:linear-gradient(135deg,#8E3BE8,#5B1BB0);color:#fff;border-radius:14px;padding:14px 16px}

.chips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

pre.code{background:#1E1530;color:#EDE7F6;border-radius:8px;padding:10px 12px;font:13px/1.55 "JetBrains Mono",Consolas,"DejaVu Sans Mono","Noto Sans Gujarati",monospace;overflow-x:auto;margin:0 0 10px;white-space:pre;tab-size:4}
pre.out{background:#0E1B12;color:#B9F6CA;border-radius:8px;padding:10px 12px;font:13px/1.5 Consolas,"DejaVu Sans Mono",monospace;overflow-x:auto;margin:0 0 10px;white-space:pre}
.kw{color:#C792EA;font-weight:700}.ty{color:#82AAFF}.st{color:#C3E88D}.cm{color:#8E9AAF;font-style:italic}.pp{color:#F78C6C}.nu{color:#F9C46B}.fn{color:#FFCB6B}
.pl{font-size:12px;font-weight:800;color:var(--pd);margin:10px 0 4px;letter-spacing:.4px;text-transform:uppercase}
@media (max-width:480px){pre.code,pre.out{font-size:11.5px;padding:9px 10px}}
.a code{background:#F1E9FB;color:#5B1BB0;padding:1px 5px;border-radius:4px;font-family:Consolas,"DejaVu Sans Mono",monospace;font-size:.9em}
.pbox{margin:12px 0 10px;border:1.5px dashed #2E8B7A;background:#F2FBF8;border-radius:10px;padding:10px 12px}
.pbox .et{font-weight:800;color:#1F6E60;font-size:13.5px;margin-bottom:6px}
.sx{margin:6px 0 0;font-size:12.5px;padding:8px 10px}
.a.pa{padding-left:16px}

<script>
const U = {"subject": "DI01000031", "unit": 4, "format": "notes", "title": {"en": "Techniques of Writing"}, "hours": 8, "weightage": 20, "official": true, "languages": ["en"], "tabs": ["notes", "diagrams", "viva", "exam"], "intro_text": {"en": "Unit 4 of Communication Skills in English: the business e-mail - its eight blocks, subject lines, salutation and tone - and the four types the syllabus names (inquiry, reply to inquiry, order, complaint), each with a complete model; then paragraph writing of about 150 words on festivals, nature and the environment, famous personalities, favourite sports and friends and family, with five full model paragraphs. Twelve answered practice questions are in section 4."}, "notes": [{"title": {"en": "1. The Shape of a Business E-mail"}, "items": [{"h": {"en": "1.1 The eight parts of an e-mail"}, "body": {"en": "<h4>The blocks, top to bottom</h4><table><tr><th>Part</th><th>What goes there</th><th>Example</th></tr><tr><td>To</td><td>the person who must act</td><td>purchase@shreetools.in</td></tr><tr><td>Cc</td><td>people who must know</td><td>stores@abctools.in</td></tr><tr><td>Bcc</td><td>people who must know, without the others seeing</td><td>your project manager</td></tr><tr><td>Subject</td><td>one line naming the topic and the action</td><td>Inquiry - 12 mm MS plates, 2 tonnes</td></tr><tr><td>Salutation</td><td>the greeting</td><td>Dear Sir / Dear Ms Shah / Dear Sir or Madam</td></tr><tr><td>Opening</td><td>why you are writing, in one sentence</td><td>We need 2 tonnes of 12 mm MS plates for our Surat site.</td></tr><tr><td>Body</td><td>the details, in short paragraphs or a list</td><td>quantity, delivery place, expected date, payment terms</td></tr><tr><td>Closing and signature</td><td>the courteous close and who you are</td><td>Regards, / R. Patel, Site Engineer, ABC Engineering, Surat</td></tr></table><h4>A model to copy</h4><p>To: purchase@shreetools.in<br>Cc: stores@abctools.in<br>Subject: Inquiry - 12 mm MS plates, 2 tonnes<br><br>Dear Sir,<br><br>We need 2 tonnes of 12 mm MS plates for a fabrication job at our Surat site.<br>Please send us your rate per tonne, the earliest delivery date and your<br>payment terms.<br><br>We plan to place the order on Friday, so a reply by Thursday evening would<br>help us keep the schedule.<br><br>Regards,<br>R. Patel<br>Site Engineer, ABC Engineering, Surat<br>+91 98xxxxxx21</p><h4>Common mistake</h4><p>Loading the subject line with the whole message, or leaving it empty. One clear line: <i>Inquiry - 12 mm MS plates, 2 tonnes</i>.</p>"}, "diagram": "w1_email", "syllabus_item": "4.1"}, {"h": {"en": "1.2 Subject lines"}, "body": {"en": "<h4>Four rules</h4><ol><li>Name the topic in two to five words.</li><li>Add the action or the document number.</li><li>No greetings, no \"urgent\" without a reason.</li><li>Keep it under about sixty characters so a phone shows it fully.</li></ol><h4>Weak and strong subjects</h4><table><tr><th>Weak</th><th>Strong</th></tr><tr><td>Hello</td><td>Inquiry - 12 mm MS plates, 2 tonnes</td></tr><tr><td>Invoice</td><td>Invoice INV-2291 dated 4 March - payment status</td></tr><tr><td>Problem</td><td>Complaint - 6 of 20 bearings undersize, PO-4471</td></tr><tr><td>Pls do the needful</td><td>Approval needed: drawing DRG-118 revision B</td></tr><tr><td>Meeting</td><td>Meeting - Friday 10 am, Room 4, line-2 downtime</td></tr><tr><td>Regards</td><td>Status update - pump repair at Bhilad site</td></tr></table><h4>What a subject line does</h4><p>It decides whether the mail is opened, filed or forgotten. A reader who searches \"PO-4471\" six months later must find this mail.</p><h4>Examples for the four e-mail types</h4><ul><li><b>Inquiry:</b> Inquiry - 12 mm MS plates, 2 tonnes</li><li><b>Reply:</b> Re: Inquiry - 12 mm MS plates: rate, delivery and terms</li><li><b>Order:</b> Order PO-4471 - 20 bearings 6205, delivery by 20 March</li><li><b>Complaint:</b> Complaint - short supply in PO-4471, 6 of 20 bearings</li></ul><h4>Common mistake</h4><p>Writing \"Re:\" yourself on a new mail. <i>Re:</i> belongs to a reply that the system has already marked.</p>"}, "syllabus_item": "4.1"}, {"h": {"en": "1.3 Salutations and closings"}, "body": {"en": "<h4>Choose by relationship</h4><table><tr><th>Situation</th><th>Salutation</th><th>Closing</th></tr><tr><td>You do not know the name</td><td>Dear Sir or Madam</td><td>Yours faithfully</td></tr><tr><td>You know the name, formal</td><td>Dear Mr Mehta / Dear Ms Shah</td><td>Yours sincerely</td></tr><tr><td>Colleague or regular supplier</td><td>Dear Amit / Dear Ritu</td><td>Best regards</td></tr><tr><td>Customer you meet often</td><td>Dear Sir / Dear Madam</td><td>Regards</td></tr><tr><td>Team or group</td><td>Dear Team / Dear All</td><td>Regards</td></tr><tr><td>Very informal (not for exams)</td><td>Hi Amit</td><td>Thanks / Cheers</td></tr></table><h4>Examples in place</h4><p>Dear Ms Shah,<br><br>Thank you for your quotation of 6 March. We would like to place an order.<br><br>Yours sincerely,<br>R. Patel, Site Engineer</p><h4>Three rules that save marks</h4><ul><li>Never open with \"Respected sir\" in a business mail unless your organisation requires it; \"Dear Sir\" is standard.</li><li>Never close with \"Thanking you\" as a final line on its own; end with an action sentence.</li><li>Do not mix registers: \"Dear Sir\" with \"Cheers\" looks careless.</li></ul><h4>Common mistake</h4><p>Using one closing for everybody. A complaint to a stranger and a note to a colleague do not end the same way.</p>"}, "syllabus_item": "4.1"}, {"h": {"en": "1.4 Tone: formal, neutral and informal"}, "body": {"en": "<h4>Same request, three registers</h4><table><tr><th>Register</th><th>Model sentence</th><th>Use it when</th></tr><tr><td>Formal</td><td>We should be grateful if you could confirm the delivery date by Friday.</td><td>first contact, senior person, written record</td></tr><tr><td>Neutral</td><td>Please confirm the delivery date by Friday.</td><td>regular suppliers, colleagues</td></tr><tr><td>Informal</td><td>Can you confirm the date by Friday?</td><td>people you work with every day</td></tr></table><h4>What \"formal\" does not mean</h4><ul><li>It does not mean long. \"Please confirm by Friday\" is formal and clear.</li><li>It does not mean old-fashioned. Avoid \"kindly do the needful\" and \"revert back\".</li><li>It does not mean impersonal. \"Thank you\" is correct in a formal mail.</li></ul><h4>Examples of the same mail at two tones</h4><p><b>Too harsh:</b> \"Send the report immediately. You are delaying the project.\"</p><p><b>Firm and polite:</b> \"The report is needed for Monday's review. Could you send it by Friday afternoon?\"</p><h4>Common mistake</h4><p>Thinking that politeness means weakness in a complaint. Facts plus a clear request is the strongest tone there is.</p>"}, "syllabus_item": "4.1"}, {"h": {"en": "1.5 Ten mistakes that cost marks"}, "body": {"en": "<h4>The list</h4><table><tr><th>Mistake</th><th>Fix</th></tr><tr><td>no subject</td><td>one clear subject line</td></tr><tr><td>\"do the needful\"</td><td>say exactly what you want done</td></tr><tr><td>a wall of text</td><td>two or three short paragraphs, or a list</td></tr><tr><td>attachment not attached</td><td>attach first, then write the mail</td></tr><tr><td>reply all by habit</td><td>check the Cc list before you send</td></tr><tr><td>angry capitals</td><td>facts, evidence, remedy - in that order</td></tr><tr><td>no signature</td><td>name, role, organisation, phone</td></tr><tr><td>\"revert back\"</td><td>\"reply\" or \"get back to me\"</td></tr><tr><td>vague dates</td><td>\"by Friday 5 pm\" not \"as soon as possible\"</td></tr><tr><td>no closing action</td><td>end with the one thing you want</td></tr></table><h4>Examples: the same mail before and after</h4><ul><li>Before: \"Pls do the needful by EOD.\" After: \"Please send the inspection report by 5 pm today.\"</li><li>Before: \"Mail attached.\" After: \"The inspection report is attached; see page 2 for the bore readings.\"</li><li>Before: \"Reaching shortly.\" After: \"I will reach the Sachin site by 11 am.\"</li></ul><h4>A checklist before you press send</h4><ol><li>Subject names the topic.</li><li>First line says why you are writing.</li><li>Every question is answered or asked.</li><li>Dates, numbers and part numbers are correct.</li><li>Attachment present, signature complete, Cc list right.</li></ol><h4>Common mistake</h4><p>Sending a long mail with no request in it. The reader finishes and still does not know what to do.</p>"}, "syllabus_item": "4.1"}]}, {"title": {"en": "2. The Four Types of E-mail"}, "items": [{"h": {"en": "2.1 Inquiry"}, "body": {"en": "<h4>Structure</h4><ol><li>Who you are and what you need - one sentence.</li><li>The details: item, specification, quantity, place and date needed.</li><li>The questions: rate, stock, delivery, payment terms, warranty.</li><li>The deadline and a courteous close.</li></ol><h4>Model inquiry</h4><p>Subject: Inquiry - 12 mm MS plates, 2 tonnes<br><br>Dear Sir,<br><br>We are a fabrication unit in Surat and we need 2 tonnes of 12 mm MS plates<br>for a structural job.<br><br>Please send us:<br>1. your rate per tonne, inclusive of GST;<br>2. the earliest delivery date to Surat;<br>3. your payment terms and any discount for 5 tonnes.<br><br>We shall place the order on Friday, so a reply by Thursday evening would help<br>us plan the work.<br><br>Regards,<br>R. Patel, Site Engineer, ABC Engineering, Surat</p><h4>Why this works</h4><ul><li>The first line says who is asking, so the supplier can judge the enquiry.</li><li>The questions are numbered, so they can be answered one by one.</li><li>The deadline is stated with the reason for it.</li></ul><h4>Common mistake</h4><p>Writing \"Please send details\" with no list. The supplier replies with a catalogue and you still do not know the delivery date.</p>"}, "diagram": "w3_types", "syllabus_item": "4.1"}, {"h": {"en": "2.2 Reply to an inquiry"}, "body": {"en": "<h4>Structure</h4><ol><li>Thank the sender and refer to their mail and date.</li><li>Answer their questions <b>in the same order</b>.</li><li>Add what they did not ask but need: packing, transport, validity.</li><li>Close with the next step and an offer of help.</li></ol><h4>Model reply</h4><p>Subject: Re: Inquiry - 12 mm MS plates: rate, delivery and terms<br><br>Dear Mr Patel,<br><br>Thank you for your inquiry of 6 March. Our answers are below, in your order.<br><br>1. Rate: Rs 58,400 per tonne, inclusive of GST, ex-works Surat.<br>2. Delivery: 4 working days from the date of your purchase order.<br>3. Payment: 50 % with the order, 50 % against delivery.<br>4. For 5 tonnes we can offer a 2 % discount on the basic rate.<br><br>The quotation is valid for 15 days. If you confirm by Friday, we can dispatch<br>on Monday.<br><br>Please call me on +91 98xxxxxx10 if you need any clarification.<br><br>Regards,<br>N. Shah, Sales Executive, Shree Tools Pvt Ltd</p><h4>Why this works</h4><ul><li>Every question is answered, numbered as asked.</li><li>The reply adds packing, validity and a phone number.</li><li>It ends with a date and a next step.</li></ul><h4>Common mistake</h4><p>Answering only the easy question and leaving the delivery date out. The customer then has to write again, and the sale slows down.</p>"}, "syllabus_item": "4.1"}, {"h": {"en": "2.3 Order"}, "body": {"en": "<h4>Structure</h4><ol><li>Refer to the quotation and its date.</li><li>List item, specification, quantity, rate - in a table or numbered list.</li><li>State delivery address, date and mode.</li><li>State payment terms and ask for an acknowledgement.</li></ol><h4>Model order</h4><p>Subject: Order PO-4471 - 20 bearings 6205, delivery by 20 March<br><br>Dear Ms Shah,<br><br>With reference to your quotation of 6 March, please supply the following:<br><br>Item: deep-groove ball bearing 6205 ZZ<br>Quantity: 20 numbers<br>Rate: Rs 212 per number, plus GST<br>Delivery: ABC Engineering, Plot 42, GIDC Sachin, Surat, by 20 March<br><br>Payment will be made by NEFT within 15 days of delivery, as agreed.<br><br>Please acknowledge this order and confirm the dispatch date.<br><br>Regards,<br>R. Patel, Site Engineer, ABC Engineering</p><h4>Why this works</h4><ul><li>The quotation is referenced, so the price is not in dispute later.</li><li>Specification, quantity and rate sit together, which prevents the wrong part.</li><li>Delivery address and date are exact, and an acknowledgement is requested.</li></ul><h4>Common mistake</h4><p>Writing \"send 20 bearings\" with no size, no rate and no date. The supplier chooses for you, and the wrong part arrives.</p>"}, "syllabus_item": "4.1"}, {"h": {"en": "2.4 Complaint"}, "body": {"en": "<h4>Structure - four moves</h4><table><tr><th>Move</th><th>Content</th><th>Example</th></tr><tr><td>1. Facts</td><td>order number, date, what arrived</td><td>PO-4471, delivered 18 March; 6 of 20 bearings</td></tr><tr><td>2. Problem</td><td>what is wrong, with measurement</td><td>bore 24.98 mm against 25.00 mm; they do not fit the shaft</td></tr><tr><td>3. Evidence</td><td>photographs, test report, measurement sheet</td><td>photographs and our inspection sheet attached</td></tr><tr><td>4. Remedy</td><td>replacement, credit note, or visit - one clear request</td><td>replace the 6 pieces by 25 March or issue a credit note</td></tr></table><h4>Model complaint</h4><p>Subject: Complaint - 6 of 20 bearings undersize, PO-4471<br><br>Dear Ms Shah,<br><br>We received our order PO-4471 on 18 March. On inspection, 6 of the 20 bearings<br>have a bore of 24.98 mm against the specified 25.00 mm, so they will not fit<br>the shaft.<br><br>Our inspection sheet and photographs are attached. The remaining 14 pieces are<br>correct and have been accepted.<br><br>Please replace the 6 undersize pieces by 25 March, or issue a credit note for<br>Rs 1,272 plus GST. The line is waiting for these bearings, so an early reply<br>would help.<br><br>Regards,<br>R. Patel, Site Engineer, ABC Engineering</p><h4>Why this works</h4><ul><li>It states facts and measurements, not anger.</li><li>It separates the good pieces from the bad, which is fair and speeds the answer.</li><li>It offers the supplier two clear options and a date.</li></ul><h4>Common mistake</h4><p>Sending an angry mail with no order number and no measurement. The supplier cannot act, and the delay grows.</p>"}, "syllabus_item": "4.1"}, {"h": {"en": "2.5 Exam strategy for the e-mail question"}, "body": {"en": "<h4>Marks are usually given for these five things</h4><table><tr><th>Component</th><th>What the examiner looks for</th></tr><tr><td>Format</td><td>To, Subject, Salutation, Body, Closing, Signature</td></tr><tr><td>Content</td><td>all the points in the question are covered</td></tr><tr><td>Organisation</td><td>short paragraphs, numbered questions, logical order</td></tr><tr><td>Language</td><td>correct grammar, spelling and punctuation</td></tr><tr><td>Tone</td><td>polite, firm where needed, no slang</td></tr></table><h4>Ten-minute plan</h4><ol><li>One minute: underline every point in the question.</li><li>Two minutes: write the subject line and list the points in order.</li><li>Five minutes: write the body, one point per sentence or line.</li><li>One minute: salutation, closing, signature.</li><li>One minute: check numbers, dates, spelling and that nothing is missing.</li></ol><h4>Model answer skeleton</h4><p>Subject: [topic + action]<br><br>Dear [name],<br><br>[why I am writing]<br>[the details, in the order asked]<br>[the request and the date]<br><br>[closing],<br>[name, role, organisation]</p><h4>Common mistake</h4><p>Writing a beautiful paragraph that never names the item, the quantity or the date. In a business mail, missing facts lose more marks than imperfect grammar.</p>"}, "syllabus_item": "4.1"}]}, {"title": {"en": "3. Paragraph Writing"}, "items": [{"h": {"en": "3.1 What a paragraph must do"}, "body": {"en": "<h4>Three parts</h4><table><tr><th>Part</th><th>Work</th><th>Example (topic: festivals)</th></tr><tr><td>Topic sentence</td><td>states the one idea</td><td>Festivals are the calendar of a community's feelings.</td></tr><tr><td>Supporting sentences</td><td>3 to 5 facts, examples or reasons</td><td>Diwali brings lights and sweets; Navratri brings dance; Holi brings colour and forgiveness.</td></tr><tr><td>Concluding sentence</td><td>rounds off or looks ahead</td><td>A festival is therefore not a holiday from life but a rehearsal of it.</td></tr></table><h4>Word budget for 150 words</h4><ul><li>Topic sentence: 20-25 words.</li><li>Three to five supporting sentences: 90-110 words.</li><li>Concluding sentence: 20-25 words.</li></ul><h4>A model paragraph (149 words)</h4><p>Festivals are the calendar of a community's feelings. Every Indian month seems to carry one, and each carries a different emotion. Diwali arrives with lamps, sweets and a house swept clean, and it teaches that light is something people make together. Navratri brings nine nights of dance, when neighbours who rarely speak share the same ground. Holi is louder and more forgiving; it lets old quarrels dissolve in colour and cold water. In towns like Surat, these festivals also keep the economy moving, from potters and sweet-makers to the flower sellers at the crossroads. What matters most is not the ritual but the return: the cousin who comes home, the friend who is remembered, the meal that is eaten late and together. A festival is therefore not a holiday from life; it is life, rehearsed in colour and shared once a year.</p><h4>Common mistake</h4><p>Writing four sentences that are all topic sentences. A paragraph needs support, not a list of headings.</p>"}, "diagram": "w2_paragraph", "syllabus_item": "4.2"}, {"h": {"en": "3.2 Unity, coherence and linkers"}, "body": {"en": "<h4>Unity</h4><p>One paragraph carries <b>one idea</b>. If a second idea arrives, it gets a second paragraph. A reader should be able to name the topic in three words after the first sentence.</p><h4>Coherence</h4><p>The sentences must follow in a logical order: general to particular, cause to effect, or problem to solution. Linkers make that order visible.</p><h4>Linkers and what they signal</h4><table><tr><th>Signal</th><th>Linkers</th></tr><tr><td>addition</td><td>and, also, moreover, in addition, besides</td></tr><tr><td>contrast</td><td>but, however, yet, on the other hand, although</td></tr><tr><td>cause</td><td>because, since, as, due to</td></tr><tr><td>effect</td><td>so, therefore, as a result, hence, consequently</td></tr><tr><td>example</td><td>for example, for instance, such as, namely</td></tr><tr><td>sequence</td><td>first, then, next, finally, meanwhile</td></tr><tr><td>conclusion</td><td>in short, to sum up, therefore, in the end</td></tr></table><h4>Examples</h4><p><b>Without linkers:</b> \"The machine was old. It broke often. We replaced it.\"</p><p><b>With linkers:</b> \"The machine was old and, as a result, it broke often; therefore we replaced it.\"</p><h4>Common mistake</h4><p>Starting every sentence with a linker. Two or three in a paragraph are enough; more makes the writing sound mechanical.</p>"}, "syllabus_item": "4.2"}, {"h": {"en": "3.3 Planning 150 words in five minutes"}, "body": {"en": "<h4>The five-minute plan</h4><ol><li>Underline the key word in the topic: <i>festivals</i>, <i>environment</i>, <i>sport</i>.</li><li>Choose one angle - do not try to say everything. For festivals: what they do to people, not a list of dates.</li><li>Write the topic sentence in one line.</li><li>Jot three or four supports as single words: lights, dance, colour, return.</li><li>Write, then cut. A 165-word draft becomes a 150-word paragraph.</li></ol><h4>Worked planning sheet (topic: nature and environment)</h4><table><tr><th>Step</th><th>Your note</th></tr><tr><td>Angle</td><td>nature gives free services that money cannot replace</td></tr><tr><td>Topic sentence</td><td>A tree is the cheapest machine a city owns.</td></tr><tr><td>Support 1</td><td>shade and cool air in a Surat summer</td></tr><tr><td>Support 2</td><td>roots hold soil in the monsoon</td></tr><tr><td>Support 3</td><td>birds and insects return when trees return</td></tr><tr><td>Conclusion</td><td>planting is a civic duty, not a decoration</td></tr></table><h4>Why 150 words</h4><p>It is long enough for an idea and its proof, and short enough to be read in one breath. Counting words is not the aim; covering the idea is.</p><h4>Common mistake</h4><p>Writing 250 words to be safe. Long paragraphs lose unity and lose marks for relevance.</p>"}, "syllabus_item": "4.2"}, {"h": {"en": "3.4 Model paragraph: Festivals"}, "body": {"en": "<h4>The paragraph (152 words)</h4><p>A festival is a date on which a whole town agrees to remember something together. In Gujarat the year turns on such dates: Uttarayan fills the sky with kites and the terraces with cousins; Navratri fills nine nights with garba until the street itself seems to dance; Diwali fills the dark with lamps and the doorways with rangoli. Each one looks like celebration, but each one is also a lesson. Uttarayan teaches that the wind is a friend if the string is strong. Navratri teaches that a community is made by people who move together. Diwali teaches that light is something people make, not something they wait for. The best part arrives after the rituals, when the family sits down to eat far too late and talks far too long. Festivals, then, are not breaks from ordinary life; they are ordinary life, remembered properly once a year.</p><h4>Why it works</h4><ul><li>One idea: festivals teach while they celebrate.</li><li>Three supports, one per festival, each with a lesson.</li><li>A concrete ending: the late meal and the long talk.</li></ul><h4>Common mistake</h4><p>Describing five festivals in one line each. Three, with a lesson attached, is a paragraph; five is a list.</p>"}, "syllabus_item": "4.2"}, {"h": {"en": "3.5 Model paragraph: Nature and environment"}, "body": {"en": "<h4>The paragraph (151 words)</h4><p>A tree is the cheapest machine a city owns. It costs nothing to run, needs no electricity and quietly does the work of an air-conditioner, a water tank and a bird sanctuary at the same time. In a Surat summer, the difference between a road with trees and a road without them can be felt within ten steps. When the monsoon comes, the same roots hold the soil that would otherwise silt the drains. When the leaves fall, they return to the earth the food the tree took from it, and nothing is wasted. Birds and insects come back within a season of planting, which is the clearest sign that a place is alive. None of this appears in a budget, which is why it is so easily forgotten. Planting a tree, then, is not decoration; it is civic maintenance of the cheapest and most useful kind.</p><h4>Why it works</h4><ul><li>The topic sentence is an image, not a slogan.</li><li>Each support answers a different question: heat, water, soil, life.</li><li>The conclusion turns the image into an argument about duty.</li></ul><h4>Common mistake</h4><p>Writing \"we should save trees because they are important\". That is an opinion without a single detail to hold it up.</p>"}, "syllabus_item": "4.2"}, {"h": {"en": "3.6 Model paragraph: A famous personality"}, "body": {"en": "<h4>The paragraph (150 words)</h4><p>Dr A. P. J. Abdul Kalam is remembered less for the posts he held than for the way he used them. He came from Rameswaram, sold newspapers as a boy, studied physics and aerospace engineering, and went on to lead India's missile programmes at a time when the country had very little of the technology it needed. What made him unusual was not the success but the audience he chose afterwards: schoolchildren. For twenty years he spoke in classrooms, answered questions for hours and told students that a dream is not what you see in sleep but what does not let you sleep. He carried his own bag, kept a modest room and refused the comforts his position could have bought. When he died in 2015, in Shillong, he was teaching. That is the sentence his life deserves: a scientist who spent his last hour explaining something to students.</p><h4>Why it works</h4><ul><li>Facts, not adjectives: Rameswaram, newspapers, missiles, Shillong.</li><li>The paragraph chooses one angle - what he did with success.</li><li>The last line closes the idea and the life together.</li></ul><h4>Common mistake</h4><p>Listing every award from memory. Two or three facts used well beat ten facts used as a list.</p>"}, "syllabus_item": "4.2"}, {"h": {"en": "3.7 Model paragraph: Favourite sport"}, "body": {"en": "<h4>The paragraph (148 words)</h4><p>Cricket is a slow game that rewards patience more than speed, which is why it suits a country that has learned to wait. A Test match takes five days and can still end without a result, yet people sit in the sun for all five, because the interest lies in the small contest inside the large one: a bowler against a batsman, over after over, each one adjusting to the other. On the street outside my house the game is simpler. A tennis ball, a broomstick for a stump and a rule that a shot into the neighbour's compound is out. Nobody keeps a score for long, and nobody minds. What the game teaches is easy to state and hard to practise: watch the ball, play the one you can reach, and stay at the crease. Everything else, including the result, is a bonus.</p><h4>Why it works</h4><ul><li>A clear angle: patience, in the stadium and on the street.</li><li>Two settings compared, which keeps the paragraph moving.</li><li>The ending gives a rule of life drawn from the game.</li></ul><h4>Common mistake</h4><p>Describing the rules of the game. The reader wants to know why you like it, not how many players are on each side.</p>"}, "syllabus_item": "4.2"}, {"h": {"en": "3.8 Model paragraph: Friends and family"}, "body": {"en": "<h4>The paragraph (150 words)</h4><p>A family is given to you; a friend is chosen, and the two are more alike than they look. In a family you are known before you have done anything, which is a comfort and sometimes a trap. With a friend you are known for what you do, and the knowing has to be earned conversation by conversation. The best families contain friendship, and the best friendships slowly become family: the friend who comes to the hospital at two in the morning, the one who remembers your father's name, the one who tells you the truth about your work when nobody else will. My own arrangement is simple. At home there are four people who know my worst moods and ignore them. Outside there are two friends who know my best plans and test them. Between the two, a person is held steady.</p><h4>Why it works</h4><ul><li>A comparison gives the paragraph its structure: given versus chosen.</li><li>Examples are specific: the hospital, the father's name, the honest friend.</li><li>The last line answers the topic in a single image.</li></ul><h4>Common mistake</h4><p>Writing only about family or only about friends when the topic names both. The comparison is the paragraph.</p>"}, "syllabus_item": "4.2"}]}, {"title": {"en": "4. Practice Questions with Model Answers"}, "items": [{"h": {"en": "Practice 1. Write an inquiry e-mail to a supplier asking for the rate and delivery of 50 safety helmets."}, "body": {"en": "<p><b>Subject:</b> Inquiry - 50 safety helmets, delivery to Surat</p><p>Dear Sir,</p><p>We are a fabrication unit at GIDC Sachin, Surat, and we need 50 industrial safety helmets (IS 2925 certified) for our shop floor.</p><p>Please send us your rate per piece inclusive of GST, the earliest delivery date to Sachin, the brand and certification you supply, and your payment terms. We shall place the order on Monday, so a reply by Friday evening would help us plan.</p><p>Regards,<br>R. Patel<br>Site Engineer, ABC Engineering, Surat<br>+91 98xxxxxx21</p><p><b>Why it scores:</b> the subject names topic and quantity; the first line says who is asking; the questions are listed; the deadline comes with the reason for it.</p>"}}, {"h": {"en": "Practice 2. Reply to that inquiry, giving a rate of Rs 240 per helmet, delivery in five days and 30 days credit."}, "body": {"en": "<p><b>Subject:</b> Re: Inquiry - 50 safety helmets: rate, delivery and terms</p><p>Dear Mr Patel,</p><p>Thank you for your inquiry of 6 March. We can supply 50 IS 2925 certified helmets at Rs 240 per piece inclusive of GST.</p><p>Delivery will be made to your Sachin address within five working days of your order. We offer 30 days credit to regular customers, and the rate is valid for 30 days. Our helmets carry a one-year replacement guarantee against manufacturing defects.</p><p>If you confirm by Monday, we can dispatch on Tuesday. Please call me on +91 98xxxxxx10 for any clarification.</p><p>Regards,<br>N. Shah<br>Sales Executive, Shree Tools Pvt Ltd</p><p><b>Why it scores:</b> every question is answered in the order it was asked, and the reply adds two useful facts the buyer did not ask for: the guarantee and the validity.</p>"}}, {"h": {"en": "Practice 3. Place an order for 20 ball bearings 6205 ZZ at Rs 212 each, delivery by 20 March."}, "body": {"en": "<p><b>Subject:</b> Order PO-4471 - 20 bearings 6205 ZZ, delivery by 20 March</p><p>Dear Ms Shah,</p><p>With reference to your quotation of 6 March, please supply the following:</p><p>Item: deep-groove ball bearing 6205 ZZ<br>Quantity: 20 numbers<br>Rate: Rs 212 per number, plus GST<br>Delivery: ABC Engineering, Plot 42, GIDC Sachin, Surat, by 20 March</p><p>Payment will be made by NEFT within 15 days of delivery, as agreed in your quotation. Please acknowledge this order and confirm the dispatch date.</p><p>Regards,<br>R. Patel<br>Site Engineer, ABC Engineering</p><p><b>Why it scores:</b> the quotation is referenced, the specification sits next to the quantity, the delivery address is complete, and an acknowledgement is requested.</p>"}}, {"h": {"en": "Practice 4. Write a complaint about 6 of 20 bearings that are undersize."}, "body": {"en": "<p><b>Subject:</b> Complaint - 6 of 20 bearings undersize, PO-4471</p><p>Dear Ms Shah,</p><p>We received order PO-4471 on 18 March. On inspection, 6 of the 20 bearings measure 24.98 mm at the bore against the specified 25.00 mm, so they do not fit the shaft.</p><p>Our inspection sheet and photographs are attached. The other 14 pieces are correct and have been accepted.</p><p>Please replace the 6 undersize pieces by 25 March, or issue a credit note for Rs 1,272 plus GST. The line is waiting for these bearings, so an early reply would help.</p><p>Regards,<br>R. Patel<br>Site Engineer, ABC Engineering</p><p><b>Why it scores:</b> facts first, measured; the good pieces are separated from the bad; two clear remedies with a date; the tone is firm without a single angry word.</p>"}}, {"h": {"en": "Practice 5. Rewrite these subject lines: (a) Hello (b) Problem (c) Pls do the needful."}, "body": {"en": "<p>(a) \"Hello\" says nothing. Rewrite: <b>Inquiry - 12 mm MS plates, 2 tonnes</b>.</p><p>(b) \"Problem\" does not say where or how big. Rewrite: <b>Complaint - 6 of 20 bearings undersize, PO-4471</b>.</p><p>(c) \"Pls do the needful\" asks for nothing in particular. Rewrite: <b>Approval needed: drawing DRG-118 revision B</b>.</p><p>A good subject line names the topic and the action in five words or fewer, so that the reader knows before opening whether to act now or later.</p>"}}, {"h": {"en": "Practice 6. Describe the format of a business e-mail."}, "body": {"en": "<p>A business e-mail has eight blocks: To, Cc and Bcc for the recipients, a Subject line, a Salutation, an opening sentence, the body, and a closing with a signature.</p><p>The subject names the topic and the action; the salutation matches the relationship (\"Dear Sir or Madam\" with \"Yours faithfully\", \"Dear Ms Shah\" with \"Yours sincerely\"); the opening says why you are writing; the body gives the details in short paragraphs or a numbered list.</p><p>The closing states the one action you want and the date, and the signature carries name, role, organisation and phone number. Format earns marks because it shows the reader at once who the mail is for and what it is about.</p>"}}, {"h": {"en": "Practice 7. Write a paragraph of about 150 words on Festivals."}, "body": {"en": "<p>Festivals are the days on which a community agrees to remember what it values. In Surat, Uttarayan turns the terraces into a meeting place, and the sky becomes a field of kites flown by every generation at once. Navratri gathers nine nights of garba, so that neighbours who only nod to each other during the year end up dancing in the same circle. Diwali is quieter and closer: lamps on the window, rangoli at the door, sweets carried from house to house until nobody can eat another. Each festival looks like entertainment, but each one carries a lesson about living together - share the terrace, share the circle, share the food. The best moment usually comes late at night, when the rituals are over and the family sits talking far longer than planned. A festival, then, is not an escape from ordinary life; it is ordinary life, carefully remembered once a year.</p>"}}, {"h": {"en": "Practice 8. Write a paragraph of about 150 words on Nature and Environment."}, "body": {"en": "<p>A city that plants trees is buying services it could never afford to install. A single shade tree cools a stretch of road, holds the dust down and gives a hundred birds somewhere to sit, all without a rupee of maintenance. In a Surat summer the difference is easy to test: walk ten steps from a bare footpath to a shaded one and feel the temperature change. When the monsoon arrives, the same roots hold the soil that would otherwise silt the drains and flood the low-lying streets. Fallen leaves return to the soil the food the tree has taken, so nothing is wasted in the whole cycle. Birds and insects come back within a season of planting, which is the clearest proof that a place is alive again. None of this appears in a municipal budget, and that is exactly why it is neglected. Planting, then, is not decoration; it is the cheapest maintenance a city can do.</p>"}}, {"h": {"en": "Practice 9. Write a paragraph of about 150 words on your favourite sport."}, "body": {"en": "<p>Kabaddi is the only sport I know that begins with a single person walking into a crowd of seven. There is no equipment, no field to book and no excuse: a line in the dust is enough. The raider has thirty seconds to tag an opponent and get back, and in those thirty seconds everything is decided by breath, balance and nerve. That is what makes it worth watching. The defender who stands still is lost; the raider who hesitates is caught. In my village the game is played after the evening meal, under one tube light, with the whole street as spectators and commentators. Nobody keeps a record of wins and losses, and nobody minds. What the game teaches can be said in one line: go in alone, keep breathing, and come back before you are held. Everything else is a scoreboard.</p>"}}, {"h": {"en": "Practice 10. Write a paragraph of about 150 words on a famous personality you admire."}, "body": {"en": "<p>Kalpana Chawla is remembered for a sentence she wrote in her school magazine: that a dream is not what you see in sleep, but what does not let you sleep. She grew up in Karnal, studied aeronautical engineering in Chandigarh, and then crossed an ocean to study and work in a field that hardly had room for a woman from a small Indian town. She became an astronaut, flew on Columbia in 1997, and died with her crew in 2003 when the shuttle broke apart on its way home. What I admire is not the tragedy but the arithmetic behind the career: one application after another, one refusal after another, until the answer changed. She never pretended the work was easy, and she never suggested that the difficulty was a reason to stop. That is a useful thing to remember in an examination hall and, more importantly, in a workshop.</p>"}}, {"h": {"en": "Practice 11. Write a paragraph of about 150 words on Friends and Family members."}, "body": {"en": "<p>A family is given and a friend is chosen, and the two arrangements support each other more than we usually admit. At home a person is known before he has done anything, which is a comfort on bad days and a small trap on good ones, because nobody there expects you to change. With friends you are known for what you do, and that knowledge has to be renewed conversation by conversation, which keeps a person honest. The best families contain friendship, and the best friendships slowly become family: the friend who reaches the hospital at two in the morning, the one who remembers your father's name, the one who tells you plainly that your work is not good enough. In my own life there are four people at home who ignore my worst moods and two friends outside who test my best plans. Held between those two, a person stays steady.</p>"}}, {"h": {"en": "Practice 12. Identify the topic sentence, the supports and the conclusion in this paragraph: \"A workshop is a noisy place, and noise is a safety hazard. It hides the sound of a bearing beginning to fail, so a fault is noticed late. It makes instructions hard to hear, so mistakes multiply. It tires the ear over eight hours, so attention drops exactly when it is needed. A quiet machine is therefore not a luxury; it is part of the guard.\""}, "body": {"en": "<p><b>Topic sentence:</b> \"A workshop is a noisy place, and noise is a safety hazard.\" It states the one idea that the rest of the paragraph proves.</p><p><b>Supports:</b> the three sentences beginning \"It hides...\", \"It makes...\" and \"It tires...\". Each names one effect of noise - late fault detection, wrong instructions, dropping attention.</p><p><b>Concluding sentence:</b> \"A quiet machine is therefore not a luxury; it is part of the guard.\" The word \"therefore\" shows that the sentence draws the idea together, and it leaves the reader with a policy, not just a fact.</p>"}}, {"h": {"en": "Practice 13. Improve this paragraph: \"Sports are good. Everyone should play. It keeps us healthy. It teaches us discipline. So we should play sports.\""}, "body": {"en": "<p>Improved: \"Sport is the cheapest form of self-education a student can get. It keeps the body healthy, but that is the least of it. A player learns to lose in public and to try again the next week; a team learns that a good pass matters more than a good shot; a captain learns that shouting is not the same as leading. These lessons arrive without a lecture and stay longer than most lectures do. A school without a ground, then, is not short of a playground; it is short of a classroom.\"</p><p>What changed: a topic sentence with an idea instead of a slogan, three distinct supports instead of three repetitions, a linker (\"then\") before the conclusion, and a closing line that says something the first line did not.</p><p>The original paragraph had four sentences making one point; the improved one has one idea supported from four angles, which is what the examiner is looking for.</p>"}}]}], "diagrams": [{"id": "w1_email", "title": {"en": "The parts of a business e-mail"}, "file": "diagrams/w1_email.svg"}, {"id": "w2_paragraph", "title": {"en": "The shape of a paragraph"}, "file": "diagrams/w2_paragraph.svg"}, {"id": "w3_types", "title": {"en": "Four e-mails you will write"}, "file": "diagrams/w3_types.svg"}], "equations": [{"title": {"en": "E-mail skeleton"}, "items": [{"terms": {"en": "Header"}, "a": {"en": "To, Cc, Bcc, Subject"}}, {"terms": {"en": "Salutation"}, "a": {"en": "Dear Sir / Dear Ms Shah / Dear Sir or Madam"}}, {"terms": {"en": "Body"}, "a": {"en": "purpose, details in order, request with a date"}}, {"terms": {"en": "Closing"}, "a": {"en": "Yours faithfully / Yours sincerely / Regards"}}, {"terms": {"en": "Signature"}, "a": {"en": "name, role, organisation, phone"}}]}, {"title": {"en": "Paragraph skeleton"}, "items": [{"terms": {"en": "Topic sentence"}, "a": {"en": "one idea in 20-25 words"}}, {"terms": {"en": "Support"}, "a": {"en": "3-5 facts, examples or reasons, 90-110 words"}}, {"terms": {"en": "Conclusion"}, "a": {"en": "rounds off or looks ahead, 20-25 words"}}, {"terms": {"en": "Length"}, "a": {"en": "about 150 words, one idea per paragraph"}}]}], "viva": [{"title": {"en": "E-mail"}, "items": [{"q": {"en": "Name the parts of a business e-mail."}, "a": {"en": "To, Cc, Bcc, Subject, Salutation, Opening, Body, and Closing with signature."}}, {"q": {"en": "What makes a good subject line?"}, "a": {"en": "It names the topic in two to five words and adds the action or the document number, for example \"Inquiry - 12 mm MS plates, 2 tonnes\"."}}, {"q": {"en": "How do you close a mail to a person whose name you know?"}, "a": {"en": "\"Yours sincerely\" with the name; \"Yours faithfully\" is for \"Dear Sir or Madam\", where the name is unknown."}}, {"q": {"en": "What is the difference between Cc and Bcc?"}, "a": {"en": "Cc shows the copied person to everybody; Bcc copies without the other recipients seeing the address."}}, {"q": {"en": "What four things must an inquiry e-mail contain?"}, "a": {"en": "Who you are, the specification and quantity, the questions (rate, delivery, terms), and the date by which you need the reply."}}, {"q": {"en": "What four moves make a good complaint?"}, "a": {"en": "Facts with the order number, the problem with a measurement, the evidence, and one clear remedy with a date."}}]}, {"title": {"en": "Paragraph"}, "items": [{"q": {"en": "What are the three parts of a paragraph?"}, "a": {"en": "A topic sentence, three to five supporting sentences, and a concluding sentence."}}, {"q": {"en": "What is unity in a paragraph?"}, "a": {"en": "Every sentence serves one idea; a second idea needs a second paragraph."}}, {"q": {"en": "What is coherence?"}, "a": {"en": "The sentences follow in a clear logical order, and linkers such as however, therefore and for example make that order visible."}}, {"q": {"en": "How many words is the paragraph in this syllabus?"}, "a": {"en": "About 150 words, which is roughly twelve to fifteen lines."}}, {"q": {"en": "Give four linkers of contrast and result."}, "a": {"en": "Contrast: but, however, on the other hand, although. Result: so, therefore, as a result, consequently."}}, {"q": {"en": "How should a 150-word paragraph be planned?"}, "a": {"en": "Choose one angle, write the topic sentence, jot three or four supports as single words, write the draft, then cut it down to about 150 words."}}]}], "exam_questions": [{"q": {"en": "Practice: Write an inquiry e-mail to a supplier asking for the rate and delivery of 50 safety helmets."}, "marks": 5}, {"q": {"en": "Practice: Reply to that inquiry, giving a rate of Rs 240 per helmet, delivery in five days and 30 days credit."}, "marks": 5}, {"q": {"en": "Practice: Place an order for 20 ball bearings 6205 ZZ at Rs 212 each, delivery by 20 March."}, "marks": 5}, {"q": {"en": "Practice: Write a complaint about 6 of 20 bearings that are undersize."}, "marks": 5}, {"q": {"en": "Practice: Rewrite these subject lines: (a) Hello (b) Problem (c) Pls do the needful."}, "marks": 3}, {"q": {"en": "Practice: Describe the format of a business e-mail."}, "marks": 4}, {"q": {"en": "Practice: Write a paragraph of about 150 words on Festivals."}, "marks": 5}, {"q": {"en": "Practice: Write a paragraph of about 150 words on Nature and Environment."}, "marks": 5}, {"q": {"en": "Practice: Write a paragraph of about 150 words on your favourite sport."}, "marks": 5}, {"q": {"en": "Practice: Write a paragraph of about 150 words on a famous personality you admire."}, "marks": 5}, {"q": {"en": "Practice: Write a paragraph of about 150 words on Friends and Family members."}, "marks": 5}, {"q": {"en": "Practice: Identify the topic sentence, the supports and the conclusion in this paragraph: \"A workshop is a noisy place, and noise is a safety hazard. It hides the sound of a bearing beginning to fail, so a fault is noticed late. It makes instructions hard to hear, so mistakes multiply. It tires the ear over eight hours, so attention drops exactly when it is needed. A quiet machine is therefore not a luxury; it is part of the guard.\""}, "marks": 4}, {"q": {"en": "Practice: Improve this paragraph: \"Sports are good. Everyone should play. It keeps us healthy. It teaches us discipline. So we should play sports.\""}, "marks": 4}], "learning_outcomes": [{"en": "CO4: Compose different types of written communication."}], "course_outcomes": ["CO4"], "practical_numbers": [], "content_kind": "theory", "lesson_count": 18, "answered_practice_count": 13, "assessment_note": {"en": "Official course: theory ESE 70 + PA 30 and practical PA 20 + ESE 30 = 150 marks, 3 credits, 30 teaching hours; this unit carries 20 % weightage and 14 of the 70 theory marks. Practice-question marks (3/4) are suggested revision sizes, not official GTU allocations. Model answers are in Notes section 7."}, "question_provenance": "Original answered revision questions; not official past papers", "question_marks_are_suggested": true, "sources": [{"title": "GTU DI01000031, Communication Skills in English, Semester 1, HSMC-1 (uploaded syllabus)", "url": "https://syllabus.gtu.ac.in/"}, {"title": "Purdue Online Writing Lab - e-mail etiquette and paragraph structure", "url": "https://owl.purdue.edu/"}, {"title": "British Council LearnEnglish - writing: e-mails and paragraphs", "url": "https://learnenglish.britishcouncil.org/skills/writing"}, {"title": "William Sanborn Pfeiffer and T. V. S. Padmaja - Technical Communication: A Practical Approach (Pearson, 2007)", "url": "https://www.pearson.com/"}]};

  U.notes.forEach((sec,si)=>{
    h += `<div class="sec">${head(t(sec.title))}`;
    sec.items.forEach((it,i)=>{
      const open = si===0&&i===0 ? ' open' : '';
      if (it.h) {
        h += `<div class="card${it.key?' key':''}${open}"><div class="q hd"><span class="t">${it.key?'⭐ ':''}${t(it.h)}</span>${chev}</div>
        <div class="a rn" style="padding-left:18px">${fixTables(t(it.body)).replace(/margin:0 0 10px -36px/g,'')}${it.diagram?dgInline(it.diagram):''}${(it.examples||[]).map(exBox).join('')}${(it.programs||[]).map(pBox).join('')}</div></div>`;
      } else {
        h += `<div class="card${open}"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(it.q)}</span>${chev}</div>
        <div class="a">${fixTables(t(it.a))}${it.diagram?dgInline(it.diagram):''}</div></div>`;
      }
    });
    h += `</div>`;
  });
  return h;
}
function numericals(){
  return `<div class="sec">${head(L('numericals'))}` + (U.numericals||[]).map((n,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(n.q)}</span>${chev}</div><div class="a">${fixTables(t(n.a))}</div></div>`).join('') + `</div>`;
}
function diagrams(){
  return `<div class="sec">${head(L((U.tabs ? U.tabs.includes('flowcharts')&&!U.tabs.includes('diagrams') : U.programs&&META.code_lang!=='python')?'flowcharts':'diagrams'),false)}<div style="height:10px"></div>` + U.diagrams.map((d,i)=>
    `<div class="dcard" data-dg="${d.id}"><div class="h">${i+1}. ${t(d.title)}</div>${SVG[d.id]}</div>`).join('') + `</div>`;
}
function equations(){
  return U.equations.map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><span class="fbox">${e.f}</span></span>${chev}</div>
     <div class="a"><p>${t(e.terms)}</p></div></div>`).join('') + `</div>`).join('');
}
function viva(){
  // two shapes exist in the corpus: flat [{q,a}] and grouped [{title, items:[{q,a}]}]
  const groups = U.viva.every(v=>v && v.q) ? [{items: U.viva}] : U.viva;
  return groups.map(g=>{
    const items = g.items || [];
    return `<div class="sec">${g.title?head(t(g.title)):''}` + items.map((v,i)=>
      `<div class="card"><div class="q hd"><span class="n">${i+1}.</span><span class="t">${t(v.q)}</span>${chev}</div><div class="a"><p>${t(v.a)}</p></div></div>`).join('') + `</div>`;
  }).join('');
}
function exam(){
  return `<div class="sec">${head(L('examhead'),false)}` + U.exam_questions.map((x,i)=>
    `<div class="card"><div class="q" style="cursor:default"><span class="n">${i+1}.</span><span class="t">${t(x.q)}</span><span class="mk">${x.marks} ${L('marks')}</span></div></div>`).join('') + `</div>`;
}
function programs(){
  return `<div class="sec">${head(L('programs'))}` + (U.programs||[]).map((p,i)=>
    `<div class="card"><div class="q hd"><span class="n">${i+1}.</span><span class="t">${t(p.title)}</span>${chev}</div><div class="a pa">${progBody(p)}</div></div>`).join('') + `</div>`;
}
function syntax(key){
  return (U[typeof key==='string'?key:'syntax']||[]).map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><pre class="code sx">${hl(e.f)}</pre></span>${chev}</div>
     <div class="a">${e.terms && t(e.terms) ? fixTables(t(e.terms)) : ''}</div></div>`).join('') + `</div>`).join('');
}
const flowcharts = diagrams;
const algorithms = () => syntax('algorithms');
const ALLV = {notes, programs, diagrams, flowcharts, algorithms, syntax, equations, numericals, viva, exam};
const VIEWS = U.tabs ? Object.fromEntries(U.tabs.map(k=>[k, ALLV[k]])) : U.programs ? (META.code_lang==='python' ? {notes, programs, diagrams, syntax, viva, exam} : {notes, programs, flowcharts, syntax, viva, exam}) : U.numericals ? {notes, diagrams, equations, numericals, viva, exam} : {notes, diagrams, equations, viva, exam};
function render(){
  document.getElementById('title').textContent = `${L('unit')} ${U.unit}: ${t(U.title)}`;
  document.getElementById('sub').textContent = `${t(META.name)} · ${META.code}`;
  document.getElementById('lang').textContent = S.lang==='en' ? 'ગુ' : 'EN';
  document.getElementById('lang').style.display = META.languages.includes('gu') ? '' : 'none';
  document.getElementById('tabs').innerHTML = Object.keys(VIEWS).map(k=>`<button class="tab${S.tab===k?' on':''}" data-tab="${k}">${L(k)}</button>`).join('');
  document.getElementById('view').innerHTML = VIEWS[S.tab]();
  document.querySelectorAll('#view pre.c').forEach(e=>{ e.innerHTML = hl(e.textContent); e.className='code'; });
}
let zoom = 1;
function setZoom(z){ zoom = Math.min(4, Math.max(1, z)); const w=document.getElementById('zw'); w.style.width=(zoom*100)+'%'; document.getElementById('zr').textContent=Math.round(zoom*100)+'%'; }
document.addEventListener('click', e=>{
  const q = e.target.closest('.q'); if (q && q.parentElement.querySelector('.a')) { q.parentElement.classList.toggle('open'); return; }
  const tb = e.target.closest('[data-tab]'); if (tb){ S.tab = tb.dataset.tab; render(); window.scrollTo(0,0); return; }
  if (e.target.closest('#lang')){ S.lang = S.lang==='en'?'gu':'en'; render(); return; }
  const m = e.target.closest('[data-more]');
  document.querySelectorAll('.menu.show').forEach(x=>{ if(!m || x!==m.nextElementSibling) x.classList.remove('show'); });
  if (m){ m.nextElementSibling.classList.toggle('show'); return; }
  const act = e.target.closest('[data-act]');
  if (act){ act.closest('.sec').querySelectorAll('.card').forEach(c=>{ if(c.querySelector('.a')) c.classList.toggle('open', act.dataset.act==='expand'); }); act.parentElement.classList.remove('show'); return; }
  const dg = e.target.closest('[data-dg]');
  if (dg){ const id=dg.dataset.dg; document.getElementById('mt').textContent=t(U.diagrams.find(d=>d.id===id).title); document.getElementById('zw').innerHTML=SVG[id]; setZoom(1); document.getElementById('modal').classList.add('show'); return; }
  if (e.target.closest('#mx')) document.getElementById('modal').classList.remove('show');
  if (e.target.closest('#zi')) setZoom(zoom+0.5);
  if (e.target.closest('#zo')) setZoom(zoom-0.5);
  if (e.target.closest('#zr')) setZoom(1);
});
render();
</script></body></html>
