<script>
const U = {"subject": "DI04000021", "unit": 1, "format": "notes", "title": {"en": "Introduction to Java Programming"}, "weightage": 20, "hours": 10, "notes": [{"title": {"en": "1.1 Introduction to Java"}, "items": [{"h": {"en": "Introduction, Features and Applications of Java"}, "body": {"en": "\n<p><b>Java</b> is an object-oriented, platform-independent programming language. It was created by <b>James Gosling</b> and his team (called the \"Green Team\") at <b>Sun Microsystems in 1995</b>; the language was first named <b>Oak</b> and later renamed Java. Oracle Corporation now owns it.</p>\n<h4>Features of Java (bases of the language)</h4>\n<ul><li><b>Simple</b> - syntax is like C/C++, so it is easy to learn; there are no pointers, goto or operator overloading.</li>\n<li><b>Object oriented</b> - everything is organised inside classes and objects.</li>\n<li><b>Platform independent</b> - <i>Write Once, Run Anywhere</i>: compile once into byte code and run the same <code>.class</code> file on Windows, Linux or Mac.</li>\n<li><b>Compiled and interpreted</b> - javac compiles to byte code, the JVM interprets it line by line.</li>\n<li><b>Robust</b> - strong type checking, exception handling and automatic garbage collection catch errors early.</li>\n<li><b>Secure</b> - programs run inside the JVM sandbox; byte code is verified before execution.</li>\n<li><b>Multithreaded</b> - several parts of a program can run at the same time.</li>\n<li><b>Portable and high performance</b> - the same primitive sizes on every machine; the JIT compiler speeds up hot code.</li></ul>\n<h4>Applications of Java</h4>\n<ul><li><b>Android apps</b> - Java was the original language of Android development.</li>\n<li><b>Web and enterprise applications</b> - banking systems, e-commerce servers (Spring, JSP).</li>\n<li><b>Desktop applications</b> - IDEs like Eclipse and NetBeans are themselves written in Java.</li>\n<li><b>Big data and AI</b> - Hadoop, Elasticsearch and libraries like Deeplearning4j run on the JVM.</li></ul>\n"}}]}, {"title": {"en": "1.2 Writing and Running the First Program"}, "items": [{"h": {"en": "JDK, JRE, JVM and Byte Code"}, "body": {"en": "\n<p>Three names you must distinguish for every exam:</p>\n<ul><li><b>JDK (Java Development Kit)</b> - the complete kit for <b>writing</b> programs: the compiler <code>javac</code>, the launcher <code>java</code>, a debugger and other tools. It contains the JRE.</li>\n<li><b>JRE (Java Runtime Environment)</b> - everything needed to <b>run</b> a program: class libraries (String, Scanner...) plus the JVM. Ordinary users install only the JRE.</li>\n<li><b>JVM (Java Virtual Machine)</b> - the \"virtual computer\" that executes byte code instruction by instruction (interpreter), with a JIT compiler for speed. It is different for every operating system.</li></ul>\n<p><b>Byte code</b> is the intermediate code stored in <code>.class</code> files after compilation. It is not machine code of any real processor - that is exactly why it is <b>portable</b>.</p>\n"}, "diagram": "jv1_jdk_jre_jvm"}, {"h": {"en": "Compile Once, Run Anywhere"}, "body": {"en": "\n<p>The life of a Java program has two steps:</p>\n<ol><li><b>Compile:</b> <code>javac Main.java</code> reads the source code and writes <code>Main.class</code>, which contains <b>byte code</b>.</li>\n<li><b>Run:</b> <code>java Main</code> starts the JVM, which loads and verifies the byte code and executes it.</li></ol>\n<ul><li>C/C++ compile straight to the machine code of one OS, so the result works only on that OS.</li>\n<li>Java compiles to byte code instead; each OS has its own JVM to execute the same <code>.class</code> file. This is the meaning of <i>Write Once, Run Anywhere</i>.</li>\n<li>Debug and execute steps are identical on any machine once the JDK is installed.</li></ul>\n"}, "diagram": "jv1_wora"}, {"h": {"en": "Structure of a Java Program and Hello World"}, "body": {"en": "\n<p>Every Java program lives inside a <b>class</b>:</p>\n<ul><li>The file name must match the class name (<code>Main.java</code> for <code>class Main</code>).</li>\n<li>Execution starts at <code>public static void main(String[] args)</code> - <b>public</b> so that the JVM can call it, <b>static</b> so no object is needed first, <b>void</b> because it returns nothing.</li>\n<li>Statements end with <code>;</code>, blocks are wrapped in <code>{ }</code>.</li>\n<li><code>System.out.println(...)</code> prints a line; <code>System.out</code> is the console, <code>println</code> the method.</li>\n<li>Java is <b>case sensitive</b>: <code>Main</code>, <code>main</code> and <code>MAIN</code> are three different names.</li></ul>\n<p>Run the Hello World program below and study how the output matches each println/print statement.</p>\n"}, "diagram": "jv1_structure", "programs": ["jv1_1"]}]}, {"title": {"en": "1.3 Data Types, Variables and Operators"}, "items": [{"h": {"en": "Data Types and Variables"}, "body": {"en": "\n<ul><li>A <b>variable</b> is a named memory location that stores a changeable value; a <b>data type</b> fixes what kind of value it can hold and how much memory it uses.</li>\n<li>Java's 8 <b>primitive types</b>: whole numbers - <code>byte</code>, <code>short</code>, <code>int</code>, <code>long</code>; decimals - <code>float</code>, <code>double</code>; character - <code>char</code>; truth - <code>boolean</code>.</li>\n<li><b>Declaring and initializing</b>: <code>int marks = 452;</code> - type, name, initial value, all in one statement. A variable must be initialized (or assigned) before use; Java refuses to read uninitialized local variables.</li>\n<li>Note the suffixes: <code>L</code> for long values, <code>f</code> for float values.</li>\n<li><code>String</code> is a <b>class</b>, not a primitive type - but it is so common that it is written without <code>new</code>: <code>String city = \"Surat\";</code>.</li></ul>\n"}, "diagram": "jv1_datatypes", "programs": ["jv1_2"]}, {"h": {"en": "Scope and Lifetime of Variables"}, "body": {"en": "\n<ul><li><b>Scope</b> tells in which region of code a variable may be used; <b>lifetime</b> tells how long it keeps its memory.</li>\n<li>A variable declared inside a block <code>{ }</code> is a <b>local variable</b>: it is born when the block is entered and dies when the block ends.</li>\n<li>Inner blocks may use outer variables; outer code may never use a variable declared inside a block.</li>\n<li>Fields (member variables) of a class live as long as the object lives - scope and lifetime become important again in Unit 2.</li></ul>\n"}, "programs": ["jv1_4"]}, {"h": {"en": "Type Conversion and Type Casting"}, "body": {"en": "\n<ul><li><b>Automatic (widening) conversion</b>: Java itself converts a smaller type into a larger one when no data can be lost: byte -&gt; short -&gt; int -&gt; long -&gt; float -&gt; double. Example: <code>long l = 452;</code>.</li>\n<li><b>Manual (narrowing) casting</b>: converting a larger type into a smaller one needs an explicit cast and may lose data: <code>int r = (int) 9.7;</code> gives 9.</li>\n<li><code>char</code> and <code>int</code> convert freely using the character's code value ('A' is 65): <code>int code = 'A';</code> and <code>char nx = (char)('A' + 1);</code> gives 'B'.</li>\n<li>In mixed expressions Java widens the smaller operand first, so <code>(double) a / b</code> divides exactly while <code>a / b</code> (two ints) drops the fraction.</li></ul>\n"}, "diagram": "jv1_casting", "programs": ["jv1_3"]}, {"h": {"en": "Operators in Java"}, "body": {"en": "\n<ul><li><b>Arithmetic:</b> <code>+ - * / %</code>; <code>%</code> gives the remainder, integer division discards the fraction.</li>\n<li><b>Relational:</b> <code>&lt; &gt; &lt;= &gt;= == !=</code> - answers are boolean.</li>\n<li><b>Logical:</b> <code>&amp;&amp; || !</code> combine conditions.</li>\n<li><b>Assignment:</b> <code>=</code> and shortcuts <code>+= -= *= /= %=</code>.</li>\n<li><b>Conditional (ternary):</b> <code>condition ? a : b</code> - a one-line if-else that returns a value.</li>\n<li><b>Increment/decrement:</b> <code>++</code> and <code>--</code>; prefix (<code>++i</code>) changes first, postfix (<code>i++</code>) uses the old value first.</li>\n<li><b>Bitwise:</b> <code>&amp; | ^ &lt;&lt; &gt;&gt;</code> operate on bits; shifts multiply/divide by powers of 2.</li></ul>\n<p>Careful with <code>==</code>: it compares values for primitives, but objects (like String) are compared with <code>equals()</code>.</p>\n"}, "diagram": "jv1_operators", "programs": ["jv1_5"]}]}, {"title": {"en": "1.4 Control Flow"}, "items": [{"h": {"en": "Selection: if, if-else, Ladder and Nested if"}, "body": {"en": "\n<ul><li><b>if</b> runs a block only when its condition is true; <b>if-else</b> gives a second path for false.</li>\n<li>The <b>if-else-if ladder</b> checks a list of conditions top-down and executes the first true one, then skips the rest - used for ranges like grades.</li>\n<li>A <b>nested if</b> (an if inside another if) is used when the second question matters only after the first answer, e.g. the maximum-of-three program.</li></ul>\n"}, "programs": ["jv1_6", "jv1_7"]}, {"h": {"en": "switch-case"}, "body": {"en": "\n<ul><li><code>switch</code> chooses one of many <code>case</code> blocks by matching a single value - cleaner than a long ladder when testing equality.</li>\n<li>Each case must end with <code>break</code>; otherwise execution falls through into the next case.</li>\n<li><code>default</code> catches all unmatched values.</li>\n<li>Allowed values: char, byte, short, int, and since Java 7 also <b>String</b>.</li></ul>\n"}, "programs": ["jv1_8"]}, {"h": {"en": "Loops: for, while, do-while"}, "body": {"en": "\n<ul><li><b>for(initialisation; condition; update)</b> - all loop control on one line; the right choice when the count is known (tables, array indexes).</li>\n<li><b>while</b> - condition checked before every round; the body may never run. Perfect for \"until it becomes zero\" algorithms like digit counting.</li>\n<li><b>do-while</b> - condition checked after the body, so the body always runs at least once; used for menu-driven programs.</li>\n<li>The <b>for-each</b> form <code>for (int m : marks)</code> visits every element of an array without an index.</li></ul>\n"}, "programs": ["jv1_9", "jv1_10", "jv1_15"]}, {"h": {"en": "Jump Statements: break and continue"}, "body": {"en": "\n<ul><li><code>break</code> leaves the innermost loop or switch immediately - used when the answer is already found and more rounds would be wasted.</li>\n<li><code>continue</code> skips only the rest of the current round and starts the next one - used to filter (e.g. skip even numbers).</li>\n<li>Both are called <b>jump statements</b>; overusing them makes code harder to follow, so use them for clear cases only.</li></ul>\n"}, "diagram": "jv1_loops", "programs": ["jv1_11"]}]}, {"title": {"en": "1.5 Arrays"}, "items": [{"h": {"en": "1D Arrays: Declaration, Initialization and Traversal"}, "body": {"en": "\n<ul><li>An <b>array</b> is a single name for a numbered group of same-type values, stored one after another in memory.</li>\n<li>Declaration: <code>int[] marks;</code>; create: <code>marks = new int[5];</code>; or both with values: <code>int[] marks = {78, 85, 66, 90, 71};</code>.</li>\n<li>Indexes are <b>0-based</b>: the first element is <code>marks[0]</code>, the last <code>marks[marks.length - 1]</code>.</li>\n<li><code>marks.length</code> (a field, no brackets) keeps the size - loops that use it survive array resizing automatically.</li>\n<li>Traverse with an indexed <code>for</code> loop or with <code>for-each</code>; classic tasks are sum/average and min/max in one pass.</li></ul>\n"}, "programs": ["jv1_12", "jv1_14"]}, {"h": {"en": "2D Arrays"}, "body": {"en": "\n<ul><li>A <b>2D array</b> is an array of arrays - picture it as a table with rows and columns (a matrix).</li>\n<li>Declaration with values: <code>int[][] a = {{1,2,3},{4,5,6}};</code> (2 rows, 3 columns).</li>\n<li><code>a.length</code> = number of rows; <code>a[i].length</code> = number of columns in row i.</li>\n<li>Two nested loops visit every cell; <code>a[i][j]</code> is the element at row i, column j.</li>\n<li>Matrix addition: add elements at matching positions and store the result in a third matrix of the same shape.</li></ul>\n"}, "programs": ["jv1_13"]}]}], "programs": [{"id": "jv1_1", "title": {"en": "Hello World - first Java program"}, "code": {"en": "// File: Main.java - one class per program.\nclass Main {\n  // main(): execution always starts here\n  public static void main(String[] args) {\n    System.out.println(\"Hello, World!\");\n    System.out.println(\"Welcome to GTU\");\n    // no new line\n    System.out.print(\"Java is \");\n    System.out.println(\"simple.\");\n  }\n}"}, "out": "$ javac Main.java\n$ java Main\nHello, World!\nWelcome to GTU\nJava is simple.", "expl": {"en": "\n<p><b>Practical 1(a).</b> Steps: save the file as <code>Main.java</code>, compile with <code>javac Main.java</code> (creates <code>Main.class</code> - byte code), run with <code>java Main</code> (JVM reads the class file).</p>\n<ul><li>The output window shows the two commands and the printed lines.</li>\n<li><code>println</code> moves to a new line after printing; <code>print</code> stays on the same line.</li>\n<li><code>//</code> starts a comment, which the compiler ignores.</li></ul>\n"}}, {"id": "jv1_2", "title": {"en": "Declaring and initializing variables of all primitive types"}, "code": {"en": "class Main {\n  public static void main(String[] args) {\n    // -128 to 127\n    byte roll = 7;\n    // 2 bytes\n    short sem = 4;\n    // 4 bytes\n    int marks = 452;\n    // suffix L\n    long mob = 9876543210L;\n    // suffix f\n    float per = 78.5f;\n    // 8 bytes\n    double cgpa = 8.25;\n    // single quotes\n    char sec = 'A';\n    // true or false only\n    boolean ok = true;\n\n    System.out.println(\"roll = \" + roll);\n    System.out.println(\"sem = \" + sem);\n    System.out.println(\"marks = \" + marks);\n    System.out.println(\"mobile = \" + mob);\n    System.out.println(\"per = \" + per);\n    System.out.println(\"cgpa = \" + cgpa);\n    System.out.println(\"section = \" + sec);\n    System.out.println(\"passed = \" + ok);\n  }\n}"}, "out": "$ javac Main.java\n$ java Main\nroll = 7\nsem = 4\nmarks = 452\nmobile = 9876543210\nper = 78.5\ncgpa = 8.25\nsection = A\npassed = true", "expl": {"en": "\n<p>Java has <b>8 primitive data types</b>. Four store whole numbers (byte, short, int, long), two store decimals (float, double), one stores a single character (char) and one a truth value (boolean).</p>\n<ul><li><code>long</code> values end with <code>L</code> and <code>float</code> values with <code>f</code>, otherwise the compiler treats them as int and double.</li>\n<li><code>+</code> with a string <b>joins</b> (concatenates) the value to the text.</li></ul>\n"}}, {"id": "jv1_3", "title": {"en": "Arithmetic operations and type casting"}, "code": {"en": "class Main {\n  public static void main(String[] args) {\n    int a = 17, b = 5;\n    int add = a + b, sub = a - b;\n    int mul = a * b;\n    // int division: 3\n    int div = a / b;\n    // remainder: 2\n    int rem = a % b;\n    System.out.println(\"add = \" + add);\n    System.out.println(\"sub = \" + sub);\n    System.out.println(\"mul = \" + mul);\n    System.out.println(\"div = \" + div);\n    System.out.println(\"rem = \" + rem);\n\n    // type casting\n    double exact = (double) a / b;\n    System.out.println(\"exact = \" + exact);\n\n    // double -> int\n    int r = (int) 9.7;\n    System.out.println(\"cast = \" + r);\n\n    char ch = 'A';\n    // char -> int (auto)\n    int code = ch;\n    char nx = (char)(ch + 1);\n    System.out.println(\"code = \" + code);\n    System.out.println(\"next = \" + nx);\n  }\n}"}, "out": "$ javac Main.java\n$ java Main\nadd = 22\nsub = 12\nmul = 85\ndiv = 3\nrem = 2\nexact = 3.4\ncast = 9\ncode = 65\nnext = B", "expl": {"en": "\n<p><b>Practical 1(b).</b> Integer division throws the decimal part away: 17/5 gives 3. To get the exact answer, <b>cast</b> one operand to double before dividing.</p>\n<ul><li><b>Widening</b> (automatic, no data loss): byte -&gt; short -&gt; int -&gt; long -&gt; float -&gt; double; char -&gt; int.</li>\n<li><b>Narrowing</b> (manual cast, possible data loss): <code>(int) 9.7</code> cuts the fraction and keeps 9.</li>\n<li>The remainder operator <code>%</code> returns what is left after division (17 % 5 = 2).</li></ul>\n"}}, {"id": "jv1_4", "title": {"en": "Scope and lifetime of variables"}, "code": {"en": "class Main {\n  public static void main(String[] args) {\n    // born here\n    int x = 10;\n    System.out.println(\"x = \" + x);\n    {\n      // born in inner block\n      int y = 20;\n      System.out.println(\"y = \" + y);\n      // outer var visible\n      int z = x + y;\n      System.out.println(\"x + y = \" + z);\n    }\n    // y = 30;  // ERROR: y died at the }\n    // up to here x lives, y and z are gone\n    System.out.println(\"x again = \" + x);\n  }\n}"}, "out": "$ javac Main.java\n$ java Main\nx = 10\ny = 20\nx + y = 30\nx again = 10", "expl": {"en": "\n<p><b>Scope</b> = where a variable can be used; <b>lifetime</b> = how long it exists.</p>\n<ul><li>A variable is usable only inside the block <code>{ }</code> where it is declared. When the block ends, the variable dies.</li>\n<li>Inner blocks can see outer variables (<code>z = x + y</code> works), but outer code cannot see variables declared inside (<code>y = 30;</code> after the block would be a compile error - it is commented out here, try removing the // to see the error yourself in a lab).</li>\n<li>Because dead variables disappear quickly, Java programs stay memory-efficient.</li></ul>\n"}}, {"id": "jv1_5", "title": {"en": "Operators: arithmetic, relational, logical, bitwise, ternary, ++/--"}, "code": {"en": "class Main {\n  public static void main(String[] args) {\n    int a = 10, b = 3;\n    System.out.println(\"a/b = \" + (a / b));\n    System.out.println(\"a%b = \" + (a % b));\n\n    // relational\n    System.out.println(\"a>b = \" + (a > b));\n    // logical\n    boolean ok = (a > 5) && (b < 5);\n    System.out.println(\"both = \" + ok);\n\n    // bitwise AND\n    System.out.println(\"a&b = \" + (a & b));\n    // bitwise OR\n    System.out.println(\"a|b = \" + (a | b));\n    // XOR\n    System.out.println(\"a^b = \" + (a ^ b));\n    int sh = a << 1;\n    // shift\n    System.out.println(\"a<<1 = \" + sh);\n\n    int max = (a > b) ? a : b;    // ternary\n    System.out.println(\"max = \" + max);\n\n    // use, then add 1\n    int c = a++;\n    // add 1, then use\n    int d = ++a;\n    System.out.println(\"c = \" + c);\n    System.out.println(\"d = \" + d);\n  }\n}"}, "out": "$ javac Main.java\n$ java Main\na/b = 3\na%b = 1\na>b = true\nboth = true\na&b = 2\na|b = 11\na^b = 9\na<<1 = 20\nmax = 10\nc = 10\nd = 12", "expl": {"en": "\n<ul><li><b>Arithmetic:</b> + - * / %. Wrap arithmetic in brackets inside println - <code>\"a/b = \" + a / b</code> would not even compile, because <code>+</code> joins the string to <code>a</code> first and then tries to divide a string.</li>\n<li><b>Relational:</b> &gt; &lt; &gt;= &lt;= == != give true/false. <b>Logical:</b> &amp;&amp; || !</li>\n<li><b>Bitwise:</b> 10 = 1010 and 3 = 0011 in binary, so a&amp;b=2 (0010), a|b=11 (1011), a^b=9 (1001); <code>a &lt;&lt; 1</code> shifts bits left = 20.</li>\n<li><b>Ternary:</b> <code>condition ? valueIfTrue : valueIfFalse</code>.</li>\n<li><code>a++</code> uses the old value then increments (c = 10, afterwards a = 11); <code>++a</code> increments first (d = 12).</li></ul>\n"}}, {"id": "jv1_6", "title": {"en": "if, if-else and if-else-if ladder (result grades)"}, "code": {"en": "class Main {\n  public static void main(String[] args) {\n    int marks = 72;\n\n    // 1. simple if\n    if (marks >= 35)\n      System.out.println(\"Result: Pass\");\n\n    // 2. if-else\n    if (marks >= 60) {\n      System.out.println(\"Type: First\");\n    } else {\n      System.out.println(\"Type: below 60\");\n    }\n\n    // 3. if-else-if ladder\n    if (marks >= 70)\n      System.out.println(\"Grade: A\");\n    else if (marks >= 60)\n      System.out.println(\"Grade: B\");\n    else if (marks >= 50)\n      System.out.println(\"Grade: C\");\n    else if (marks >= 35)\n      System.out.println(\"Grade: D\");\n    else\n      System.out.println(\"Grade: Fail\");\n  }\n}"}, "out": "$ javac Main.java\n$ java Main\nResult: Pass\nType: First\nGrade: A", "expl": {"en": "\n<ul><li><b>Simple if</b> runs its statement only when the condition is true.</li>\n<li><b>if-else</b> chooses between two paths.</li>\n<li><b>Ladder</b> checks conditions from top and runs the FIRST true branch - so put the highest limit first (70 before 35); otherwise 72 would wrongly fall into a lower grade.</li>\n<li>For a single statement the braces <code>{ }</code> are optional.</li></ul>\n"}}, {"id": "jv1_7", "title": {"en": "Nested if-else: maximum of three numbers"}, "code": {"en": "class Main {\n  public static void main(String[] args) {\n    int a = 25, b = 40, c = 15;\n    int g;\n    // outer if\n    if (a > b) {\n      // inner if\n      if (a > c)\n        g = a;\n      else\n        g = c;\n    } else {\n      // nested in else\n      if (b > c)\n        g = b;\n      else\n        g = c;\n    }\n    System.out.println(\"greatest = \" + g);\n  }\n}"}, "out": "$ javac Main.java\n$ java Main\ngreatest = 40", "expl": {"en": "\n<p><b>Practical 2(a).</b> An if inside another if is a <b>nested if</b>. The program first compares a with b, then compares the winner with c and stores the greatest number in <code>g</code>.</p>\n<ul><li>Indentation (inner code shifted right) makes nested logic readable.</li>\n<li>Short alternative: <code>Math.max(a, Math.max(b, c))</code>, or one ternary expression.</li></ul>\n"}}, {"id": "jv1_8", "title": {"en": "switch-case: day of the week and a simple menu"}, "code": {"en": "class Main {\n  public static void main(String[] args) {\n    int day = 3;\n    switch (day) {\n      case 1:\n        System.out.println(\"Monday\");\n        break;\n      case 2:\n        System.out.println(\"Tuesday\");\n        break;\n      case 3:\n        System.out.println(\"Wednesday\");\n        break;\n      case 4:\n        System.out.println(\"Thursday\");\n        break;\n      case 5:\n        System.out.println(\"Friday\");\n        break;\n      default:\n        System.out.println(\"Weekend\");\n    }\n\n    // switch on a String (Java 7+)\n    String op = \"+\";\n    int x = 8, y = 4;\n    int res = 0;\n    switch (op) {\n      case \"+\":\n        res = x + y;\n        break;\n      case \"*\":\n        res = x * y;\n        break;\n      default:\n        res = -1;\n    }\n    System.out.println(\"result = \" + res);\n  }\n}"}, "out": "$ javac Main.java\n$ java Main\nWednesday\nresult = 12", "expl": {"en": "\n<ul><li><code>switch</code> compares one value against many <code>case</code> labels; the matching block runs.</li>\n<li><b>break is compulsory</b>: without it, execution falls through into the next case (a famous interview question).</li>\n<li><code>default</code> runs when no case matches.</li>\n<li>Since Java 7, switch works on <b>String</b> too, as the small calculator menu shows.</li></ul>\n"}}, {"id": "jv1_9", "title": {"en": "Loops: for, while and do-while"}, "code": {"en": "class Main {\n  public static void main(String[] args) {\n    // 1. for: fixed count\n    System.out.println(\"Table of 7:\");\n    for (int i = 1; i <= 5; i++) {\n      int p = 7 * i;\n      System.out.println(i + \" x 7 = \" + p);\n    }\n\n    // 2. while: check before entering\n    int n = 160, count = 0;\n    // count the digits\n    while (n > 0) {\n      n = n / 10;\n      count++;\n    }\n    System.out.println(\"digits = \" + count);\n\n    // 3. do-while: body runs at least once\n    int k = 5;\n    do {\n      System.out.println(\"k = \" + k);\n      k--;\n    } while (k > 0);\n  }\n}"}, "out": "$ javac Main.java\n$ java Main\nTable of 7:\n1 x 7 = 7\n2 x 7 = 14\n3 x 7 = 21\n4 x 7 = 28\n5 x 7 = 35\ndigits = 3\nk = 5\nk = 4\nk = 3\nk = 2\nk = 1", "expl": {"en": "\n<ul><li><b>for(init; condition; step)</b> - best when the number of repetitions is known.</li>\n<li><b>while</b> tests the condition first; if it is false at the start, the body never runs.</li>\n<li><b>do-while</b> tests after the body, so the body always runs <b>at least once</b> (useful for menus).</li>\n<li>The digit-counting trick divides by 10 repeatedly - a very common exam question.</li></ul>\n"}}, {"id": "jv1_10", "title": {"en": "Sum of digits of a number (while loop)"}, "code": {"en": "class Main {\n  public static void main(String[] args) {\n    int num = 4782;\n    int n = num;\n    int sum = 0;\n    while (n != 0) {\n      int d = n % 10;     // last digit\n      sum = sum + d;\n      n = n / 10;         // drop last digit\n    }\n    System.out.println(\"number = \" + num);\n    System.out.println(\"sum = \" + sum);\n  }\n}"}, "out": "$ javac Main.java\n$ java Main\nnumber = 4782\nsum = 21", "expl": {"en": "\n<p><b>Practical 2(b).</b> The classic digit-splitting pattern:</p>\n<ul><li><code>n % 10</code> peels off the last digit, <code>n / 10</code> removes it.</li>\n<li>Repeat until the number becomes 0; add each digit into <code>sum</code>.</li>\n<li>Dry run for 4782: 2 + 8 + 7 + 4 = 21.</li></ul>\n"}}, {"id": "jv1_11", "title": {"en": "break and continue statements"}, "code": {"en": "class Main {\n  public static void main(String[] args) {\n    // continue: skip to the next round\n    System.out.print(\"odd numbers 1..9: \");\n    for (int i = 1; i <= 9; i++) {\n      if (i % 2 == 0)\n        continue;          // skip evens\n      System.out.print(i + \" \");\n    }\n    System.out.println();\n\n    // break: leave the loop immediately\n    int[] stops = {3, 5, 12, 7, 9};\n    for (int s : stops) {\n      if (s > 10) {\n        System.out.println(\"big = \" + s);\n        break;             // stop searching\n      }\n    }\n  }\n}"}, "out": "$ javac Main.java\n$ java Main\nodd numbers 1..9: 1 3 5 7 9 \nbig = 12", "expl": {"en": "\n<ul><li><code>continue</code> skips only the current iteration; the loop keeps going.</li>\n<li><code>break</code> ends the loop at once - e.g. after finding what we were searching for.</li>\n<li>The <b>for-each</b> loop <code>for (int s : stops)</code> walks through every element of an array without an index.</li></ul>\n"}}, {"id": "jv1_12", "title": {"en": "1D array: declaration, traversal, sum and average"}, "code": {"en": "class Main {\n  public static void main(String[] args) {\n    // declare + initialize in one step\n    int[] marks = {78, 85, 66, 90, 71};\n\n    // traversal with index\n    System.out.println(\"All marks:\");\n    for (int i = 0; i < marks.length; i++) {\n      int m = marks[i];\n      System.out.println(i + \" : \" + m);\n    }\n\n    // sum and average with for-each\n    int sum = 0;\n    for (int m : marks)\n      sum += m;\n    double avg = 1.0 * sum / marks.length;\n\n    System.out.println(\"sum = \" + sum);\n    System.out.println(\"average = \" + avg);\n  }\n}"}, "out": "$ javac Main.java\n$ java Main\nAll marks:\n0 : 78\n1 : 85\n2 : 66\n3 : 90\n4 : 71\nsum = 390\naverage = 78.0", "expl": {"en": "\n<p><b>Practical 3(a).</b></p>\n<ul><li>An <b>array</b> stores many values of one type under one name; indexes run from 0 to length-1.</li>\n<li><code>marks.length</code> gives the number of elements (no brackets - it is a field, not a method).</li>\n<li><code>1.0 * sum</code> makes the division decimal, so the average keeps its fraction.</li></ul>\n"}}, {"id": "jv1_13", "title": {"en": "2D array: addition of two matrices"}, "code": {"en": "class Main {\n  public static void main(String[] args) {\n    int[][] a = {{1, 2, 3},\n                 {4, 5, 6}};\n    int[][] b = {{7, 8, 9},\n                 {1, 2, 3}};\n    int rows = a.length;\n    int cols = a[0].length;\n    int[][] sum = new int[rows][cols];\n\n    for (int i = 0; i < rows; i++) {\n      for (int j = 0; j < cols; j++) {\n        sum[i][j] = a[i][j] + b[i][j];\n        System.out.print(sum[i][j] + \" \");\n      }\n      System.out.println();      // next row\n    }\n  }\n}"}, "out": "$ javac Main.java\n$ java Main\n8 10 12 \n5 7 9 ", "expl": {"en": "\n<p><b>Practical 3(b).</b></p>\n<ul><li>A 2D array is an array of arrays - here a 2x3 matrix.</li>\n<li><code>a.length</code> is the number of rows and <code>a[0].length</code> the number of columns.</li>\n<li>Nested loops visit every cell; corresponding cells are added into <code>sum[i][j]</code>.</li>\n<li>The inner <code>print</code> stays on the same line; after each row <code>println()</code> jumps to the next line, forming the matrix layout. Genuine output: 8 10 12 / 5 7 9.</li></ul>\n"}}, {"id": "jv1_14", "title": {"en": "Finding smallest and largest in an array"}, "code": {"en": "class Main {\n  public static void main(String[] args) {\n    int[] t = {42, 17, 55, 9, 31};\n    int min = t[0];\n    int max = t[0];\n    for (int v : t) {\n      if (v < min)\n        // new minimum found\n        min = v;\n      if (v > max)\n        // new maximum found\n        max = v;\n    }\n    System.out.println(\"smallest = \" + min);\n    System.out.println(\"largest = \" + max);\n  }\n}"}, "out": "$ javac Main.java\n$ java Main\nsmallest = 9\nlargest = 55", "expl": {"en": "\n<p>The scan-and-remember pattern:</p>\n<ul><li>Assume the first element is the answer, then compare it with every element; whenever a smaller/larger value appears, remember it.</li>\n<li>Runs in one pass - a favourite GTU 4-marker.</li></ul>\n"}}, {"id": "jv1_15", "title": {"en": "Star patterns with nested loops"}, "code": {"en": "class Main {\n  public static void main(String[] args) {\n    // pattern 1: right triangle\n    for (int i = 1; i <= 4; i++) {\n      for (int j = 1; j <= i; j++)\n        System.out.print(\"* \");\n      System.out.println();\n    }\n\n    // pattern 2: number triangle\n    System.out.println(\"---\");\n    for (int i = 4; i >= 1; i--) {\n      for (int j = i; j >= 1; j--)\n        System.out.print(j + \" \");\n      System.out.println();\n    }\n  }\n}"}, "out": "$ javac Main.java\n$ java Main\n* \n* * \n* * * \n* * * * \n---\n4 3 2 1 \n3 2 1 \n2 1 \n1 ", "expl": {"en": "\n<ul><li>The <b>outer loop</b> fixes the row number; the <b>inner loop</b> prints that row's characters.</li>\n<li>Row i of pattern 1 prints i stars; the inner loop's limit depends on i - this dependency is the key idea of every pattern program.</li>\n<li>Pattern 2 counts down (4 to 1) and prints the numbers descending in each row.</li></ul>\n"}}], "diagrams": [{"id": "jv1_jdk_jre_jvm", "title": {"en": "JDK, JRE and JVM"}, "file": "diagrams/jv1_jdk_jre_jvm.svg"}, {"id": "jv1_wora", "title": {"en": "Write Once, Run Anywhere"}, "file": "diagrams/jv1_wora.svg"}, {"id": "jv1_structure", "title": {"en": "Structure of a Java Program"}, "file": "diagrams/jv1_structure.svg"}, {"id": "jv1_datatypes", "title": {"en": "Primitive Data Types of Java"}, "file": "diagrams/jv1_datatypes.svg"}, {"id": "jv1_casting", "title": {"en": "Type Conversion and Casting"}, "file": "diagrams/jv1_casting.svg"}, {"id": "jv1_operators", "title": {"en": "Operators in Java"}, "file": "diagrams/jv1_operators.svg"}, {"id": "jv1_loops", "title": {"en": "Control Flow Overview"}, "file": "diagrams/jv1_loops.svg"}], "syntax": [{"title": {"en": "First Program"}, "items": [{"name": {"en": "Program skeleton"}, "f": "class Main {\n  public static void main(String[] args) {\n    // statements\n  }\n}\n// javac Main.java  then  java Main", "terms": {"en": "class name = file name; main() = entry point"}}, {"name": {"en": "Printing"}, "f": "System.out.println(\"text\");  // + new line\nSystem.out.print(\"text\");    // same line\nSystem.out.println(\"x = \" + x);   // join", "terms": {"en": "println vs print; + joins text and value"}}]}, {"title": {"en": "Data Types and Operators"}, "items": [{"name": {"en": "Primitive types"}, "f": "byte b = 7;      short s = 400;\nint i = 452;      long l = 9876543210L;\nfloat f = 78.5f;  double d = 8.25;\nchar c = 'A';     boolean ok = true;", "terms": {"en": "8 primitives; L and f suffixes"}}, {"name": {"en": "Casting"}, "f": "double d = i;            // auto (widen)\nint r = (int) 9.7;       // manual cast\nint code = 'A';          // 65\nchar nx = (char)('A'+1); // 'B'", "terms": {"en": "widening automatic, narrowing needs (type)"}}, {"name": {"en": "Operators"}, "f": "+ - * / %          arithmetic\n< > <= >= == !=    relational\n&& || !            logical\n+= -= *= /= %=     compound assignment\ncond ? x : y       ternary\n++ --              increment / decrement\n& | ^ << >>        bitwise", "terms": {"en": "postfix i++ uses old value, prefix ++i new value"}}]}, {"title": {"en": "Control Flow"}, "items": [{"name": {"en": "if / if-else / ladder"}, "f": "if (x > 0) { }\nif (x > 0) { } else { }\nif (m>=70) A;\nelse if (m>=60) B;\nelse if (m>=35) D;\nelse Fail;", "terms": {"en": "ladder: first true branch runs"}}, {"name": {"en": "switch-case"}, "f": "switch (day) {\n  case 1:\n    System.out.println(\"Mon\");\n    break;\n  default:\n    System.out.println(\"Other\");\n}", "terms": {"en": "break required; String allowed (Java 7+)"}}, {"name": {"en": "Loops"}, "f": "for (int i = 1; i <= 5; i++) { }\nwhile (n != 0) { }\ndo { } while (k > 0);\nfor (int m : marks) { }   // for-each", "terms": {"en": "while tests first; do-while runs at least once"}}, {"name": {"en": "break and continue"}, "f": "if (s > 10) break;     // exit loop\nif (i % 2 == 0) continue; // next round", "terms": {"en": "break exits innermost loop/switch"}}]}, {"title": {"en": "Arrays"}, "items": [{"name": {"en": "1D arrays"}, "f": "int[] a = {78, 85, 66};\nint[] b = new int[5];\na.length                   // size (field)\na[0] .. a[a.length - 1]    // 0-based", "terms": {"en": "declaration, creation, length, indexing"}}, {"name": {"en": "2D arrays"}, "f": "int[][] m = {{1,2,3},{4,5,6}};\nm.length      // rows\nm[0].length   // columns\nm[i][j]       // row i, column j", "terms": {"en": "array of arrays; nested loops to visit cells"}}]}], "viva": [{"title": {"en": "Introduction, JDK/JRE/JVM"}, "items": [{"q": {"en": "Who developed Java and in which year?"}, "a": {"en": "James Gosling with the Green Team at Sun Microsystems, in 1995; the language was first called Oak."}}, {"q": {"en": "What is Java?"}, "a": {"en": "An object-oriented, platform-independent programming language that is both compiled (to byte code) and interpreted (by the JVM)."}}, {"q": {"en": "Give five features of Java."}, "a": {"en": "Simple, object oriented, platform independent, robust, secure; also multithreaded, portable and high performance."}}, {"q": {"en": "Why is Java called platform independent?"}, "a": {"en": "javac produces byte code, not machine code; the same .class file runs on any OS because every OS has its own JVM."}}, {"q": {"en": "Name four application areas of Java."}, "a": {"en": "Android apps, web and enterprise servers, desktop applications, and big data / AI tools."}}, {"q": {"en": "What are JDK, JRE and JVM?"}, "a": {"en": "JDK = development kit for writing programs (javac + tools), contains JRE; JRE = runtime environment (libraries + JVM); JVM = virtual machine that executes byte code."}}, {"q": {"en": "What is byte code?"}, "a": {"en": "The intermediate, OS-independent code that javac writes into .class files; the JVM executes it."}}, {"q": {"en": "Write the commands to compile and run Main.java."}, "a": {"en": "javac Main.java (compile to Main.class) and java Main (run on the JVM)."}}, {"q": {"en": "What does 'Write Once, Run Anywhere' mean?"}, "a": {"en": "Compile the program a single time into byte code and run the same file on every operating system."}}, {"q": {"en": "Which method starts every Java program?"}, "a": {"en": "public static void main(String[] args)."}}, {"q": {"en": "Why must main() be public and static?"}, "a": {"en": "public so the JVM can call it from outside; static so it can run without creating an object first."}}, {"q": {"en": "What does void in main() mean?"}, "a": {"en": "The method returns nothing."}}, {"q": {"en": "Why must the file be saved as Main.java?"}, "a": {"en": "The file name must match the class name declared inside it."}}, {"q": {"en": "Is Java case sensitive?"}, "a": {"en": "Yes: Main, main and MAIN are different names."}}, {"q": {"en": "Difference between print() and println()?"}, "a": {"en": "println adds a new line after printing; print stays on the same line."}}]}, {"title": {"en": "Data Types, Scope, Casting, Operators"}, "items": [{"q": {"en": "List the 8 primitive data types of Java."}, "a": {"en": "byte, short, int, long, float, double, char, boolean."}}, {"q": {"en": "What are the sizes of int and double?"}, "a": {"en": "int = 4 bytes, double = 8 bytes."}}, {"q": {"en": "Why do we write 9876543210L and 78.5f?"}, "a": {"en": "Without L the number is treated as int (too large here); without f a decimal is treated as double and cannot go into a float."}}, {"q": {"en": "Is String a primitive type?"}, "a": {"en": "No, String is a class; but Java allows the easy literal form String s = \"Hi\";."}}, {"q": {"en": "What is a variable?"}, "a": {"en": "A named memory location whose value can change; in Java it must be declared with a type before use."}}, {"q": {"en": "Define scope and lifetime of a variable."}, "a": {"en": "Scope = the region of code where the variable can be used (its block); lifetime = how long it exists (block entry to block end)."}}, {"q": {"en": "Can outer code use a variable declared inside { }?"}, "a": {"en": "No - the variable dies when the block ends; using it outside is a compile error."}}, {"q": {"en": "What is the difference between widening and narrowing?"}, "a": {"en": "Widening converts a smaller type to a larger one automatically without data loss; narrowing needs a manual cast and may lose data."}}, {"q": {"en": "What does (int) 9.7 do?"}, "a": {"en": "A narrowing cast: the fraction is cut, so the value is 9."}}, {"q": {"en": "What is the output of char ch = 'A' + 1?"}, "a": {"en": "'A' + 1 is int 66; assigning back to char needs a cast: (char)('A'+1) gives 'B'."}}, {"q": {"en": "Why does 17/5 print 3 but (double)17/5 prints 3.4?"}, "a": {"en": "int/int is integer division; casting one operand to double makes it decimal division."}}, {"q": {"en": "Name the groups of operators in Java."}, "a": {"en": "Arithmetic, relational, logical, assignment, conditional (ternary), increment/decrement, bitwise."}}, {"q": {"en": "Difference between i++ and ++i?"}, "a": {"en": "i++ uses the old value then increments; ++i increments first and uses the new value."}}, {"q": {"en": "What does the ternary operator do?"}, "a": {"en": "condition ? valueIfTrue : valueIfFalse - a one-line if-else that returns a value."}}, {"q": {"en": "What is the operator precedence problem in \"sum = \" + a + b?"}, "a": {"en": "It joins as text (sum = 105); to add first, write \"sum = \" + (a + b)."}}, {"q": {"en": "Why is 17 % 5 equal to 2?"}, "a": {"en": "% is the remainder operator: 17 = 5 x 3 + 2."}}]}, {"title": {"en": "Control Flow and Arrays"}, "items": [{"q": {"en": "When do you use an if-else-if ladder?"}, "a": {"en": "When several ranges are tested, like grade calculation; the first true branch runs."}}, {"q": {"en": "What is a nested if?"}, "a": {"en": "An if statement placed inside another if (or else) block."}}, {"q": {"en": "Why must each case in switch end with break?"}, "a": {"en": "Without break, execution falls through and the following cases also run."}}, {"q": {"en": "Can switch work on strings?"}, "a": {"en": "Yes, since Java 7 switch accepts String values."}}, {"q": {"en": "Differentiate while and do-while."}, "a": {"en": "while tests before the body (may run zero times); do-while tests after, so the body always runs at least once."}}, {"q": {"en": "When is the for loop preferred?"}, "a": {"en": "When the number of repetitions is known in advance."}}, {"q": {"en": "What is the role of break and continue?"}, "a": {"en": "break exits the innermost loop or switch immediately; continue skips to the next iteration."}}, {"q": {"en": "What is the difference between length in arrays and length() in String?"}, "a": {"en": "length is a field of an array; length() is a method of the String class."}}, {"q": {"en": "How are array elements numbered?"}, "a": {"en": "From 0 to length-1; marks[0] is the first element."}}, {"q": {"en": "How do you create an array of 5 integers?"}, "a": {"en": "int[] a = new int[5]; or with values int[] a = {78, 85, 66, 90, 71};."}}, {"q": {"en": "What is a 2D array?"}, "a": {"en": "An array of arrays, viewed as rows and columns; a[0].length is the number of columns."}}, {"q": {"en": "Why are two loops used for matrix addition?"}, "a": {"en": "The outer loop selects the row i and the inner loop the column j, so every cell m[i][j] is added."}}, {"q": {"en": "What is the sum-of-digits algorithm?"}, "a": {"en": "while n != 0: add n % 10 and set n = n / 10, until the number becomes 0."}}, {"q": {"en": "What is for-each loop in Java?"}, "a": {"en": "for (int m : marks) - visits each element of the array without an index variable."}}]}], "exam_questions": [{"q": {"en": "Define Java. Explain any four features of Java."}, "marks": 4}, {"q": {"en": "Differentiate compiling and interpreting with respect to Java."}, "marks": 3}, {"q": {"en": "Explain JDK, JRE and JVM with a neat diagram."}, "marks": 4}, {"q": {"en": "Explain byte code and 'Write Once, Run Anywhere'."}, "marks": 4}, {"q": {"en": "Explain the structure of a Java program with the Hello World example."}, "marks": 4}, {"q": {"en": "List and explain the primitive data types of Java with sizes and examples."}, "marks": 6}, {"q": {"en": "Explain the scope and lifetime of variables in Java."}, "marks": 3}, {"q": {"en": "Explain widening and narrowing conversion with examples."}, "marks": 4}, {"q": {"en": "Explain any four operators of Java with examples."}, "marks": 4}, {"q": {"en": "Explain if-else and the if-else-if ladder with a grading example."}, "marks": 4}, {"q": {"en": "Explain switch-case with an example. Why is break needed?"}, "marks": 4}, {"q": {"en": "Differentiate while and do-while loops with examples."}, "marks": 3}, {"q": {"en": "Explain break and continue with examples."}, "marks": 3}, {"q": {"en": "Write a Java program to find the maximum of three numbers using nested if. (Practical 2a)"}, "marks": 4}, {"q": {"en": "Write a Java program to find the sum of digits of a number. (Practical 2b)"}, "marks": 4}, {"q": {"en": "Write a Java program to print the sum and average of array elements. (Practical 3a)"}, "marks": 4}, {"q": {"en": "Write a Java program to add two matrices. (Practical 3b)"}, "marks": 6}, {"q": {"en": "Explain arithmetic operations and type casting with a Java program. (Practical 1b)"}, "marks": 4}]};

    const w = esc(m[0]);
    if (m[1]) o += `<span class="cm">${w}</span>`;
    else if (m[2]) o += `<span class="st">${w}</span>`;
    else if (m[3]) o += `<span class="pp">${w}</span>`;
    else if (m[4]) o += PKW.has(m[4]) ? `<span class="kw">${w}</span>` : PTY.has(m[4]) ? `<span class="ty">${w}</span>` : `<span class="fn">${w}</span>`;
    else if (m[5]) o += PKW.has(m[5]) ? `<span class="kw">${w}</span>` : PTY.has(m[5]) ? `<span class="ty">${w}</span>` : w;
    else o += `<span class="nu">${w}</span>`;
  }
  return o + esc(src.slice(last));
}
function hl(src){
  if (META.code_lang === 'python') return hlPy(src);
  const re = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(^[ \t]*#[^\n]*)|([A-Za-z_]\w*)(?=\s*\()|([A-Za-z_]\w*)|(\b\d+(?:\.\d+)?[fFlLuU]*\b)/gm;
  let o='', last=0, m;
  while ((m = re.exec(src))){
    o += esc(src.slice(last, m.index)); last = re.lastIndex;
    const w = esc(m[0]);
    if (m[1]) o += `<span class="cm">${w}</span>`;
    else if (m[2]) o += `<span class="st">${w}</span>`;
    else if (m[3]) o += `<span class="pp">${w}</span>`;
    else if (m[4]) o += KW.has(m[4]) ? `<span class="kw">${w}</span>` : TY.has(m[4]) ? `<span class="ty">${w}</span>` : `<span class="fn">${w}</span>`;
    else if (m[5]) o += KW.has(m[5]) ? `<span class="kw">${w}</span>` : TY.has(m[5]) ? `<span class="ty">${w}</span>` : w;
    else o += `<span class="nu">${w}</span>`;
  }
  return o + esc(src.slice(last));
}
const progBody = p => `<div class="pl">${L('code')}</div><pre class="code">${hl(t(p.code))}</pre><div class="pl">${L('output')}</div><pre class="out">${esc(p.out)}</pre>${p.plot?`<div class="pl">${L('plot')}</div>`+dgInline(p.plot).replace('class="dg"','class="dg pg"'):''}${p.expl?`<div class="pl">${L('expl')}</div>${fixTables(t(p.expl))}`:''}`;
const pBox = id => { const p=(U.programs||[]).find(x=>x.id===id); if(!p) return ''; return `<div class="pbox"><div class="et">${L('prog')}: ${t(p.title)}</div>${progBody(p)}</div>`; };
const exBox = id => { const n=(U.numericals||[]).find(x=>x.id===id); if(!n) return ''; return `<div class="ex"><div class="et">${L('ex')}</div><div class="eq2">${t(n.q)}</div>${fixTables(t(n.a))}</div>`; };
function notes(){
  let h = `<div class="intro"><b>${t(U.title)}</b><div>${L('unit')} ${U.unit} · ${U.weightage}% ${L('intro')} · ${U.hours} ${L('hours')}</div><div>${L(U.programs?(META.code_lang==='python'?'intropy':'introc'):'introd')}</div></div>`;
  U.notes.forEach((sec,si)=>{
    h += `<div class="sec">${head(t(sec.title))}`;
    sec.items.forEach((it,i)=>{
      const open = si===0&&i===0 ? ' open' : '';
      if (it.h) {
        h += `<div class="card${it.key?' key':''}${open}"><div class="q hd"><span class="t">${it.key?'⭐ ':''}${t(it.h)}</span>${chev}</div>
        <div class="a rn" style="padding-left:18px">${fixTables(t(it.body)).replace(/margin:0 0 10px -36px/g,'')}${it.diagram?dgInline(it.diagram):''}${(it.examples||[]).map(exBox).join('')}${(it.programs||[]).map(pBox).join('')}</div></div>`;
      } else {
        h += `<div class="card${open}"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(it.q)}</span>${chev}</div>
        <div class="a">${fixTables(t(it.a))}${it.diagram?dgInline(it.diagram):''}</div></div>`;
      }
    });
    h += `</div>`;
  });
  return h;
}
function numericals(){
  return `<div class="sec">${head(L('numericals'))}` + (U.numericals||[]).map((n,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(n.q)}</span>${chev}</div><div class="a">${fixTables(t(n.a))}</div></div>`).join('') + `</div>`;
}
function diagrams(){
  return `<div class="sec">${head(L(U.programs&&META.code_lang!=='python'?'flowcharts':'diagrams'),false)}<div style="height:10px"></div>` + U.diagrams.map((d,i)=>
    `<div class="dcard" data-dg="${d.id}"><div class="h">${i+1}. ${t(d.title)}</div>${SVG[d.id]}</div>`).join('') + `</div>`;
}
function equations(){
  return U.equations.map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><span class="fbox">${e.f}</span></span>${chev}</div>
     <div class="a"><p>${t(e.terms)}</p></div></div>`).join('') + `</div>`).join('');
}
function viva(){
  return U.viva.map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((v,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(v.q)}</span>${chev}</div><div class="a"><p>${t(v.a)}</p></div></div>`).join('') + `</div>`).join('');
}
function exam(){
  return `<div class="sec">${head(L('examhead'),false)}` + U.exam_questions.map((x,i)=>
    `<div class="card"><div class="q" style="cursor:default"><span class="n">${i+1}.</span><span class="t">${t(x.q)}</span><span class="mk">${x.marks} ${L('marks')}</span></div></div>`).join('') + `</div>`;
}
function programs(){
  return `<div class="sec">${head(L('programs'))}` + (U.programs||[]).map((p,i)=>
    `<div class="card"><div class="q hd"><span class="n">${i+1}.</span><span class="t">${t(p.title)}</span>${chev}</div><div class="a pa">${progBody(p)}</div></div>`).join('') + `</div>`;
}
function syntax(key){
  return (U[typeof key==='string'?key:'syntax']||[]).map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><pre class="code sx">${hl(e.f)}</pre></span>${chev}</div>
     <div class="a">${e.terms && t(e.terms) ? fixTables(t(e.terms)) : ''}</div></div>`).join('') + `</div>`).join('');
}
const flowcharts = diagrams;
const algorithms = () => syntax('algorithms');
const ALLV = {notes, programs, diagrams, flowcharts, algorithms, syntax, equations, numericals, viva, exam};
const VIEWS = U.tabs ? Object.fromEntries(U.tabs.map(k=>[k, ALLV[k]])) : U.programs ? (META.code_lang==='python' ? {notes, programs, diagrams, syntax, viva, exam} : {notes, programs, flowcharts, syntax, viva, exam}) : U.numericals ? {notes, diagrams, equations, numericals, viva, exam} : {notes, diagrams, equations, viva, exam};
function render(){
  document.getElementById('title').textContent = `${L('unit')} ${U.unit}: ${t(U.title)}`;
  document.getElementById('sub').textContent = `${t(META.name)} · ${META.code}`;
  document.getElementById('lang').textContent = S.lang==='en' ? 'ગુ' : 'EN';
  document.getElementById('lang').style.display = META.languages.includes('gu') ? '' : 'none';
  document.getElementById('tabs').innerHTML = Object.keys(VIEWS).map(k=>`<button class="tab${S.tab===k?' on':''}" data-tab="${k}">${L(k)}</button>`).join('');
  document.getElementById('view').innerHTML = VIEWS[S.tab]();
  document.querySelectorAll('#view pre.c').forEach(e=>{ e.innerHTML = hl(e.textContent); e.className='code'; });
}
let zoom = 1;
function setZoom(z){ zoom = Math.min(4, Math.max(1, z)); const w=document.getElementById('zw'); w.style.width=(zoom*100)+'%'; document.getElementById('zr').textContent=Math.round(zoom*100)+'%'; }
document.addEventListener('click', e=>{
  const q = e.target.closest('.q'); if (q && q.parentElement.querySelector('.a')) { q.parentElement.classList.toggle('open'); return; }
  const tb = e.target.closest('[data-tab]'); if (tb){ S.tab = tb.dataset.tab; render(); window.scrollTo(0,0); return; }
  if (e.target.closest('#lang')){ S.lang = S.lang==='en'?'gu':'en'; render(); return; }
  const m = e.target.closest('[data-more]');
  document.querySelectorAll('.menu.show').forEach(x=>{ if(!m || x!==m.nextElementSibling) x.classList.remove('show'); });
  if (m){ m.nextElementSibling.classList.toggle('show'); return; }
  const act = e.target.closest('[data-act]');
  if (act){ act.closest('.sec').querySelectorAll('.card').forEach(c=>{ if(c.querySelector('.a')) c.classList.toggle('open', act.dataset.act==='expand'); }); act.parentElement.classList.remove('show'); return; }
  const dg = e.target.closest('[data-dg]');
  if (dg){ const id=dg.dataset.dg; document.getElementById('mt').textContent=t(U.diagrams.find(d=>d.id===id).title); document.getElementById('zw').innerHTML=SVG[id]; setZoom(1); document.getElementById('modal').classList.add('show'); return; }
  if (e.target.closest('#mx')) document.getElementById('modal').classList.remove('show');
  if (e.target.closest('#zi')) setZoom(zoom+0.5);
  if (e.target.closest('#zo')) setZoom(zoom-0.5);
  if (e.target.closest('#zr')) setZoom(1);
});
render();
</script></body></html>
