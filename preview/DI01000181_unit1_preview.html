<script>
const U = {"subject": "DI01000181", "unit": 1, "format": "notes", "title": {"en": "Introduction of Engineering Materials", "gu": "ઇજનેરી સામગ્રીનો પરિચય"}, "hours": 6, "weightage": 14, "theory_marks": 10, "official": true, "languages": ["en", "gu"], "tabs": ["notes", "diagrams", "equations", "viva", "exam"], "intro_text": {"en": "Unit 1 of Engineering Materials Science: the four families of material, the five kinds of bond and the properties each one explains, the crystal and its unit cell with the BCC, FCC and HCP numbers, the density that follows from a cell edge, and the properties a designer actually asks for - strength, ductility, hardness, conductivity and expansion. Every number in this unit is computed from a formula that is printed beside it: the packing fractions, the densities of iron and copper, the specific strengths and the technical values of the tensile test. Six solved numericals follow in section 1.5.", "gu": "Engineering Materials Science નું Unit 1: સામગ્રીનાં ચાર કુટુંબ, બંધનના પાંચ પ્રકાર અને દરેક જે ગુણધર્મ સમજાવે, crystal અને તેનો unit cell BCC, FCC તથા HCP ના આંકડા સાથે, cell edge પરથી નીકળતી density, અને designer ખરેખર માંગે તે ગુણધર્મો - તાકાત, ductility, hardness, વાહકતા અને પ્રસરણ. આ unit નો દરેક આંકડો તેની બાજુમાં છપાયેલા સૂત્ર પરથી ગણાયેલો છે: packing fractions, iron અને copper ની density, specific strengths અને tensile test ના મૂલ્યો. વિભાગ 1.5 માં છ ઉકેલેલા દાખલા છે."}, "notes": [{"title": {"en": "1.1 Classification of engineering materials", "gu": "1.1 ઇજનેરી સામગ્રીનું વર્ગીકરણ"}, "items": [{"h": {"en": "Classification of engineering materials", "gu": "ઇજનેરી સામગ્રીનું વર્ગીકરણ"}, "body": {"en": "<p>Every engineering material belongs to one of four families, and the family fixes what the material can and cannot do. Metals are strong in tension and conduct heat and current; ceramics are hard, brittle and heat resistant; polymers are light, cheap and easy to shape; composites take the best of two materials by putting strong fibres in a light matrix. Two newer groups sit beside them - semiconductors and smart materials.</p><table><tr><th>Family</th><th>Typical members</th><th>One strength</th><th>One weakness</th></tr><tr><td>Metals</td><td>steel, cast iron, copper, brass, aluminium</td><td>strong and tough, easy to machine and weld</td><td>rusts, heavy, loses strength when hot</td></tr><tr><td>Ceramics</td><td>alumina, silicon carbide, glass, cement</td><td>hard, wear resistant, survives 1000 C</td><td>brittle, no plastic deformation</td></tr><tr><td>Polymers</td><td>PE, PVC, nylon, epoxy, rubber</td><td>light, cheap, corrosion proof, mouldable</td><td>softens when hot, creeps under load</td></tr><tr><td>Composites</td><td>CFRP, GFRP, cermet, plywood</td><td>highest strength per kilogram</td><td>costly, hard to recycle, brittle fibre</td></tr></table><div class=\"math\">metals: free electrons -> conduct heat and current, deform before breaking\nceramics: ionic or covalent bonds -> no slip, so hard and brittle\npolymers: long chain molecules -> low strength, large elongation\ncomposites: fibre carries load, matrix transfers and protects</div><p><b>Why it is true.</b> The family decides the bonding, the bonding decides how the atoms are held together, and that decides the properties. That is why the classification is the first thing to learn: from the family you can predict the strength, the melting point, the conductivity and the way the material will fail.</p><p><b>Check your answer.</b> Test a classification by its exceptions: graphite is a non-metal that conducts, silicon is a metalloid, and a cermet is a ceramic-metal composite. If a family cannot describe the exception, the exception belongs to two families at once.</p><p><b>Common mistake.</b> Saying \"steel is the strongest material\" without the duty. Steel is the strongest per rupee, not per kilogram: titanium and carbon fibre beat it by three to eight times on strength per unit weight, and alumina beats it on wear at 1000 C.</p>", "gu": "<p>દરેક ઇજનેરી સામગ્રી ચાર પૈકી એક કુટુંબમાં આવે છે, અને કુટુંબ જ નક્કી કરે છે કે સામગ્રી શું કરી શકે અને શું ન કરી શકે. ધાતુઓ tension માં મજબૂત હોય છે અને heat તથા current વહન કરે; ceramics સખત, ભંગુર અને ગરમી સહેનારાં હોય; polymers હલકા, સસ્તા અને આકાર આપવામાં સહેલા હોય; composites હલકા matrix માં મજબૂત fibres નાખીને બે સામગ્રીનું શ્રેષ્ઠ લે છે. તેમની બાજુમાં બે નવા સમૂહ છે - semiconductors અને smart materials.</p><table><tr><th>કુટુંબ</th><th>સામાન્ય સભ્યો</th><th>એક તાકાત</th><th>એક નબળાઈ</th></tr><tr><td>ધાતુઓ</td><td>steel, cast iron, copper, brass, aluminium</td><td>મજબૂત અને tough, સહેલા machine તથા weld થાય</td><td>કાટ લાગે, ભારે, ગરમીમાં તાકાત ઘટે</td></tr><tr><td>Ceramics</td><td>alumina, silicon carbide, glass, cement</td><td>સખત, ઘસારો સહે, 1000 C સહે</td><td>ભંગુર, plastic deformation નહીં</td></tr><tr><td>Polymers</td><td>PE, PVC, nylon, epoxy, rubber</td><td>હલકા, સસ્તા, કાટરહિત, mould થાય</td><td>ગરમીમાં મૃદુ પડે, load નીચે creep થાય</td></tr><tr><td>Composites</td><td>CFRP, GFRP, cermet, plywood</td><td>કિલોગ્રામ દીઠ સૌથી વધુ તાકાત</td><td>ખર્ચાળ, recycle કરવું અઘરું, fibre ભંગુર</td></tr></table><div class=\"math\">metals: free electrons -> conduct heat and current, deform before breaking\nceramics: ionic or covalent bonds -> no slip, so hard and brittle\npolymers: long chain molecules -> low strength, large elongation\ncomposites: fibre carries load, matrix transfers and protects</div><p><b>કેમ સાચું છે.</b> કુટુંબ bonding નક્કી કરે, bonding નક્કી કરે કે atoms કેવી રીતે જોડાયેલા છે, અને તે ગુણધર્મો નક્કી કરે. તેથી વર્ગીકરણ પહેલું શીખવાનું હોય: કુટુંબ પરથી તમે તાકાત, ગલનબિંદુ, વાહકતા અને નિષ્ફળ થવાની રીત અનુમાન કરી શકો.</p><p><b>જવાબ ચકાસો.</b> વર્ગીકરણને તેના અપવાદોથી ચકાસો: graphite અધાતુ છે પણ current વહન કરે, silicon metalloid છે, અને cermet એ ceramic-metal composite છે. જે કુટુંબ અપવાદનું વર્ણન ન કરી શકે તે અપવાદ એકસાથે બે કુટુંબનો હોય.</p><p><b>સામાન્ય ભૂલ.</b> \"steel સૌથી મજબૂત સામગ્રી છે\" એમ કામ જણાવ્યા વગર કહેવું. Steel રૂપિયા દીઠ સૌથી મજબૂત છે, કિલોગ્રામ દીઠ નહીં: titanium અને carbon fibre તેને વજન દીઠ તાકાતમાં ત્રણથી આઠ ગણા વટાવે છે, અને alumina 1000 C પર ઘસારામાં તેને વટાવે છે.</p>"}, "diagram": "u1_class", "syllabus_item": "1.1"}, {"h": {"en": "Choosing a material: strength per unit weight, then cost", "gu": "સામગ્રી પસંદગી: વજન દીઠ તાકાત, પછી ખર્ચ"}, "body": {"en": "<p>A material is chosen in a fixed order: the duty first (what load, what temperature, what corrosion), then the property that the duty demands, then the process that can make the shape, and only then the price. For anything that moves - a bicycle, a fan blade, a connecting rod - the deciding property is not strength but strength per unit weight.</p><div class=\"math\">specific strength = UTS / density        (kN m / kg when UTS is in MPa)\nsteel   : 450 / 7.85 =  57 kN m/kg\naluminium: 310 / 2.70 = 115 kN m/kg\ntitanium : 950 / 4.43 = 214 kN m/kg\nCFRP     : 700 / 1.60 = 438 kN m/kg</div><table><tr><th>Step</th><th>Question</th><th>What it removes</th></tr><tr><td>1 duty</td><td>load, temperature, corrosion, wear</td><td>families that cannot survive</td></tr><tr><td>2 property</td><td>strength, stiffness, conductivity, weight</td><td>materials that are too weak or too heavy</td></tr><tr><td>3 process</td><td>cast, forge, weld, machine, mould</td><td>materials that cannot make the shape</td></tr><tr><td>4 cost</td><td>price per kg, per part, per year of life</td><td>the ones that are affordable now</td></tr></table><div class=\"eq\">specific strength = UTS / rho   material index = strength^(2/3) / rho for a light beam</div><p><b>Why it is true.</b> Weight saved in a moving part is saved again every second: a lighter connecting rod reduces the inertia force, which allows a higher speed, which gives more power from the same engine. That is why the specific strength and not the strength is the design number in transport.</p><p><b>Check your answer.</b> Check the unit: MPa = N/mm2 and density = g/cm3, so MPa/(g/cm3) = 1000 N m/kg = 1 kN m/kg. A specific strength quoted in m2/s2 is the same number multiplied by 1000, which is where most unit mistakes in this topic come from.</p><p><b>Common mistake.</b> Choosing by strength alone and then paying for the weight. A steel bracket that is three times stronger than needed but five times heavier than an aluminium one is the wrong choice for a drone and the right choice for a machine bed.</p>", "gu": "<p>સામગ્રી એક નિશ્ચિત ક્રમમાં પસંદ થાય: પહેલા કામ (કેટલો load, કેટલું temperature, કેવો કાટ), પછી કામ માંગે તે ગુણધર્મ, પછી જે આકાર બનાવી શકે તે process, અને પછી જ ભાવ. જે પણ હલે છે તેના માટે - સાયકલ, fan blade, connecting rod - નિર્ણાયક ગુણધર્મ તાકાત નહીં, વજન દીઠ તાકાત છે.</p><div class=\"math\">specific strength = UTS / density        (kN m / kg when UTS is in MPa)\nsteel   : 450 / 7.85 =  57 kN m/kg\naluminium: 310 / 2.70 = 115 kN m/kg\ntitanium : 950 / 4.43 = 214 kN m/kg\nCFRP     : 700 / 1.60 = 438 kN m/kg</div><table><tr><th>પગલું</th><th>પ્રશ્ન</th><th>શું કાઢે</th></tr><tr><td>1 કામ</td><td>load, temperature, કાટ, ઘસારો</td><td>જે કુટુંબ ટકી ન શકે</td></tr><tr><td>2 ગુણધર્મ</td><td>તાકાત, stiffness, વાહકતા, વજન</td><td>બહુ નબળી કે બહુ ભારે સામગ્રી</td></tr><tr><td>3 process</td><td>cast, forge, weld, machine, mould</td><td>જે આકાર ન બનાવી શકે</td></tr><tr><td>4 ખર્ચ</td><td>કિલો દીઠ, ભાગ દીઠ, આયુષ્ય દીઠ ભાવ</td><td>જે અત્યારે પરવડે તે</td></tr></table><div class=\"eq\">specific strength = UTS / rho   material index = strength^(2/3) / rho for a light beam</div><p><b>કેમ સાચું છે.</b> હલતા ભાગમાં બચેલું વજન દર સેકન્ડે ફરી બચે છે: હલકો connecting rod inertia force ઘટાડે, જે વધુ ઝડપ આપે, જે એ જ engine માંથી વધુ power આપે. તેથી વાહનમાં design નો આંકડો તાકાત નહીં, specific strength છે.</p><p><b>જવાબ ચકાસો.</b> એકમ ચકાસો: MPa = N/mm2 અને density = g/cm3, તેથી MPa/(g/cm3) = 1000 N m/kg = 1 kN m/kg. m2/s2 માં લખાયેલી specific strength એ જ આંકડો 1000 ગણો છે, અને આ topic ની મોટા ભાગની એકમ ભૂલો ત્યાંથી જ આવે છે.</p><p><b>સામાન્ય ભૂલ.</b> ફક્ત તાકાત પરથી પસંદગી કરી પછી વજનની કિંમત ચૂકવવી. જરૂર કરતાં ત્રણ ગણું મજબૂત પણ aluminium કરતાં પાંચ ગણું ભારે steel bracket drone માટે ખોટી પસંદગી છે અને machine bed માટે સાચી.</p>"}, "diagram": "u1_select", "syllabus_item": "1.1"}]}, {"title": {"en": "1.2 Types of bonds and their characteristics", "gu": "1.2 બંધનના પ્રકાર અને તેમની લાક્ષણિકતાઓ"}, "items": [{"h": {"en": "The five kinds of bond", "gu": "બંધનના પાંચ પ્રકાર"}, "body": {"en": "<p>Atoms join because the joined state has less energy than the separate atoms. There are only five ways to do it, and they differ in one thing: where the electrons go. An electron may be transferred, shared, donated by one atom, shared through a hydrogen bridge, or given up to a pool that belongs to the whole crystal.</p><table><tr><th>Bond</th><th>How it is formed</th><th>One property it explains</th><th>Example</th></tr><tr><td>Electrovalent (ionic)</td><td>a metal atom loses electrons, a non-metal gains them</td><td>high melting point but brittle and soluble</td><td>NaCl, MgO, CaF2</td></tr><tr><td>Covalent</td><td>two atoms share a pair of electrons</td><td>very hard, very high melting point, insulator</td><td>diamond, silicon carbide, Si</td></tr><tr><td>Coordinate (dative)</td><td>one atom donates both electrons of the pair</td><td>explains complex ions and catalysts</td><td>NH3 -> BF3, [Cu(NH3)4]2+</td></tr><tr><td>Hydrogen</td><td>H of one molecule is attracted to O, N or F of another</td><td>low melting point, high boiling point for its size</td><td>water, ice, DNA, cellulose</td></tr><tr><td>Metallic</td><td>atoms leave their outer electrons in a common pool</td><td>conducts heat and current, deforms without breaking</td><td>all metals and alloys</td></tr></table><div class=\"math\">bond energy (kJ/mol):  H-bond 20  <  metallic Fe-Fe 415  <  ionic NaCl 787\nmelting point (C):      ice 0  <  iron 1538  <  rock salt 801\nthe stronger the bond, the more heat needed to break it</div><p><b>Why it is true.</b> Properties are the bond seen from the outside. A bond that cannot slide explains a brittle solid; a bond with mobile electrons explains conduction; a bond made of weak attractions explains why water boils at 100 C but the water molecule itself does not break until far above that.</p><p><b>Check your answer.</b> Predict first, then check: a solid with a melting point above 1000 C and no conductivity is covalent or ionic; one that conducts and dents before breaking is metallic; one that softens at 120 C is held by hydrogen bonds or van der Waals forces.</p><p><b>Common mistake.</b> Calling a covalent bond weak because carbon is light. The C-C bond is one of the strongest known (348 kJ/mol in diamond's network); it is the crystal that is brittle, not the bond that is weak.</p>", "gu": "<p>Atoms જોડાય છે કારણ કે જોડાયેલી સ્થિતિની ઊર્જા અલગ atoms કરતાં ઓછી હોય છે. તે કરવાની ફક્ત પાંચ રીતો છે, અને તેમાં ફરક એક જ છે: electrons ક્યાં જાય છે. Electron transferred થઈ શકે, shared થઈ શકે, એક atom દાન આપી શકે, hydrogen bridge દ્વારા shared થઈ શકે, કે આખા crystal ના pool માં જતો રહે.</p><table><tr><th>બંધન</th><th>કેવી રીતે બને</th><th>એક ગુણધર્મ જે સમજાવે</th><th>ઉદાહરણ</th></tr><tr><td>Electrovalent (ionic)</td><td>ધાતુ atom electrons ગુમાવે, અધાતુ મેળવે</td><td>ઊંચું ગલનબિંદુ પણ ભંગુર અને દ્રાવ્ય</td><td>NaCl, MgO, CaF2</td></tr><tr><td>Covalent</td><td>બે atoms electrons ની જોડી share કરે</td><td>ખૂબ સખત, ઊંચું ગલનબિંદુ, અવાહક</td><td>diamond, silicon carbide, Si</td></tr><tr><td>Coordinate (dative)</td><td>એક atom જોડીના બંને electrons દાન કરે</td><td>complex ions અને catalysts સમજાવે</td><td>NH3 -> BF3, [Cu(NH3)4]2+</td></tr><tr><td>Hydrogen</td><td>એક molecule નો H બીજા molecule ના O, N કે F તરફ ખેંચાય</td><td>નીચું ગલનબિંદુ, પોતાના માપ માટે ઊંચું ઉકળતું બિંદુ</td><td>water, ice, DNA, cellulose</td></tr><tr><td>Metallic</td><td>atoms પોતાના બહારના electrons સામાન્ય pool માં છોડે</td><td>heat અને current વહન કરે, તૂટ્યા વગર deform થાય</td><td>બધી ધાતુઓ અને alloy</td></tr></table><div class=\"math\">bond energy (kJ/mol):  H-bond 20  <  metallic Fe-Fe 415  <  ionic NaCl 787\nmelting point (C):      ice 0  <  iron 1538  <  rock salt 801\nthe stronger the bond, the more heat needed to break it</div><p><b>કેમ સાચું છે.</b> ગુણધર્મો એ બહારથી દેખાતું બંધન છે. જે બંધન સરકી ન શકે તે ભંગુર ઘન સમજાવે; જે બંધનમાં  electrons હલે તે વાહકતા સમજાવે; નબળા આકર્ષણનું બંધન સમજાવે કે પાણી 100 C પર કેમ ઉકળે પણ પાણીનું molecule ઘણા ઊંચા temperature સુધી તૂટતું નથી.</p><p><b>જવાબ ચકાસો.</b> પહેલા અનુમાન કરો, પછી ચકાસો: 1000 C થી ઊંચું ગલનબિંદુ અને વાહકતા નહીં તેવો ઘન covalent કે ionic છે; જે વહન કરે અને તૂટતા પહેલા દબાય તે metallic છે; જે 120 C પર મૃદુ પડે તે hydrogen bonds કે van der Waals થી જોડાયેલો છે.</p><p><b>સામાન્ય ભૂલ.</b> Carbon હલકું છે તેથી covalent bond નબળું ગણવું. C-C bond જાણીતા સૌથી મજબૂત bonds માં એક છે (diamond ના network માં 348 kJ/mol); ભંગુર crystal છે, bond નબળું નથી.</p>"}, "diagram": "u1_bonds", "syllabus_item": "1.2"}, {"h": {"en": "What the bond decides: strength, melting point and conduction", "gu": "બંધન શું નક્કી કરે: તાકાત, ગલનબિંદુ અને વહન"}, "body": {"en": "<p>Bond energy is the energy needed to pull one mole of atoms apart. It is measured in kilojoules per mole and it runs parallel to the melting point, because melting means breaking the bonds far enough for the atoms to slide. The same number also decides the elastic modulus, the hardness and the thermal expansion.</p><div class=\"math\">H-bond 20 kJ/mol -> ice melts at 0 C\nFe-Fe metallic 415 kJ/mol -> iron melts at 1538 C\nNaCl ionic 787 kJ/mol -> rock salt melts at 801 C\nC-C covalent 348 kJ/mol -> graphite sublimes near 3650 C</div><h4>Why a strong bond does not mean a strong part</h4><p>A high bond energy makes the material hard and heat resistant, but it also makes it brittle: if the atoms cannot slide, a crack cannot be blunted, and the part breaks without warning. Toughness needs a bond that can slide a little - which is exactly what the metallic bond provides.</p><div class=\"eq\">bond energy -> melting point, modulus, hardness   mobile electrons -> conduction, ductility</div><p><b>Why it is true.</b> Melting is a bond-breaking process, so the heat of fusion and the melting temperature both scale with bond energy. Conduction is an electron-movement process, so it appears only where the electrons are free: metals and graphite, not ceramics or polymers.</p><p><b>Check your answer.</b> Two materials can have the same melting point and different toughness. Compare alumina (2050 C, brittle) with iron (1538 C, tough): the melting point follows the bond energy, the toughness follows whether the bond can slide.</p><p><b>Common mistake.</b> Reading a bond-energy table as if it were a strength table. Bond energy is per mole of bonds; the strength of a part depends also on how many bonds cross a square millimetre - diamond and polythene differ in both.</p>", "gu": "<p>Bond energy એ એક mole atoms અલગ કરવા જરૂરી ઊર્જા છે. તે કિલોજૂલ પ્રતિ mole માં મપાય છે અને ગલનબિંદુ સાથે સમાંતર ચાલે છે, કારણ કે ગલન એટલે bonds એટલા તોડવા કે atoms સરકી શકે. એ જ આંકડો elastic modulus, hardness અને thermal expansion પણ નક્કી કરે છે.</p><div class=\"math\">H-bond 20 kJ/mol -> ice melts at 0 C\nFe-Fe metallic 415 kJ/mol -> iron melts at 1538 C\nNaCl ionic 787 kJ/mol -> rock salt melts at 801 C\nC-C covalent 348 kJ/mol -> graphite sublimes near 3650 C</div><h4>મજબૂત bond એટલે મજબૂત ભાગ નહીં, કેમ</h4><p>ઊંચી bond energy સામગ્રીને સખત અને ગરમી સહેનારી બનાવે, પણ ભંગુર પણ બનાવે: atoms સરકી ન શકે તો crack શમી ન શકે અને ભાગ ચેતવણી વગર તૂટે. Toughness માટે થોડું સરકી શકે તેવું બંધન જોઈએ - જે metallic bond આપે છે.</p><div class=\"eq\">bond energy -> melting point, modulus, hardness   mobile electrons -> conduction, ductility</div><p><b>કેમ સાચું છે.</b> ગલન એ bond તૂટવાની પ્રક્રિયા છે, તેથી heat of fusion અને ગલનબિંદુ બંને bond energy સાથે વધે. વહન એ electrons હલવાની પ્રક્રિયા છે, તેથી તે ફક્ત ત્યાં દેખાય જ્યાં electrons મુક્ત હોય: ધાતુઓ અને graphite, ceramics કે polymers નહીં.</p><p><b>જવાબ ચકાસો.</b> બે સામગ્રીનું ગલનબિંદુ સરખું અને toughness જુદું હોઈ શકે. alumina (2050 C, ભંગુર) ને iron (1538 C, tough) સાથે સરખાવો: ગલનબિંદુ bond energy પાછળ જાય, toughness bond સરકી શકે છે કે નહીં તેની પાછળ જાય.</p><p><b>સામાન્ય ભૂલ.</b> Bond-energy કોષ્ટકને તાકાતના કોષ્ટક જેવું વાંચવું. Bond energy એક mole bonds દીઠ છે; ભાગની તાકાત એના પર પણ આધારે છે કે એક ચોરસ મિલીમીટર કેટલા bonds કાપે - diamond અને polythene બંનેમાં જુદા પડે.</p>"}, "diagram": "u1_bondenergy", "syllabus_item": "1.2"}]}, {"title": {"en": "1.3 Structure of solids: crystal, unit cell, BCC, FCC and HCP", "gu": "1.3 ઘનની રચના: crystal, unit cell, BCC, FCC અને HCP"}, "items": [{"h": {"en": "Crystal, lattice and unit cell", "gu": "Crystal, lattice અને unit cell"}, "body": {"en": "<p>A metal is crystalline: its atoms sit on a repeating pattern, and the smallest block that can be repeated to build the whole solid is the unit cell. Three cells cover almost every engineering metal - body centred cubic, face centred cubic and hexagonal close packed - and the cell a metal has decides its density, its ductility and the way it behaves when it is heated.</p><div class=\"math\">lattice: the repeating set of points;  basis: the atom(s) at each point\nunit cell: the smallest block that tiles the crystal\nBCC: atoms at 8 corners + 1 at the body centre  ->  8 x 1/8 + 1 = 2 atoms\nFCC: atoms at 8 corners + 1 at each of 6 faces ->  8 x 1/8 + 6 x 1/2 = 4 atoms\nHCP: 6 atoms in a hexagonal prism (12 x 1/6 + 2 x 1/2 + 3 = 6)</div><table><tr><th>Structure</th><th>Atoms per cell</th><th>Coordination number</th><th>Typical metals</th></tr><tr><td>BCC</td><td>2</td><td>8</td><td>Fe below 912 C, Cr, W, Mo, V</td></tr><tr><td>FCC</td><td>4</td><td>12</td><td>Cu, Al, Ni, Ag, Au, Fe 912-1394 C</td></tr><tr><td>HCP</td><td>6</td><td>12</td><td>Mg, Zn, Cd, Ti, Co</td></tr></table><h4>Single crystal against polycrystal</h4><p>A turbine blade grown as one crystal has no grain boundaries to creep along; a cast bracket is a polycrystal with millions of grains in random orientation and behaves the same in every direction. Most engineering metals are polycrystalline, and Unit 2 takes the grain as its subject.</p><p><b>Why it is true.</b> The cell is a counting device. Once the cell and its atoms are known, the number of atoms in a gram, the density, the gap between atoms and the number of slip systems can all be calculated - which is why the three cells are learnt by heart.</p><p><b>Check your answer.</b> Count the fractions before trusting the table: a corner atom is shared by eight cells and a face atom by two, so BCC is 8 x 1/8 + 1 = 2 and FCC is 8 x 1/8 + 6 x 1/2 = 4. Any other count means the cell was drawn wrong.</p><p><b>Common mistake.</b> Drawing a unit cell as if the atoms were inside a box that belongs to them. The cell shares its corner and face atoms with its neighbours, and forgetting that inflates the atom count by a factor of four or more.</p>", "gu": "<p>ધાતુ crystalline છે: તેના atoms એક પુનરાવર્તી ભાત પર બેસે છે, અને આખો ઘન બનાવવા પુનરાવર્તિત થઈ શકે તેવો સૌથી નાનો ટુકડો unit cell છે. ત્રણ cell લગભગ દરેક ઇજનેરી ધાતુને આવરે છે - body centred cubic, face centred cubic અને hexagonal close packed - અને ધાતુ માં કયો cell છે તે તેની density, ductility અને ગરમ કરવા પરનું વર્તન નક્કી કરે છે.</p><div class=\"math\">lattice: the repeating set of points;  basis: the atom(s) at each point\nunit cell: the smallest block that tiles the crystal\nBCC: atoms at 8 corners + 1 at the body centre  ->  8 x 1/8 + 1 = 2 atoms\nFCC: atoms at 8 corners + 1 at each of 6 faces ->  8 x 1/8 + 6 x 1/2 = 4 atoms\nHCP: 6 atoms in a hexagonal prism (12 x 1/6 + 2 x 1/2 + 3 = 6)</div><table><tr><th>રચના</th><th>cell દીઠ atoms</th><th>Coordination number</th><th>સામાન્ય ધાતુઓ</th></tr><tr><td>BCC</td><td>2</td><td>8</td><td>912 C નીચે Fe, Cr, W, Mo, V</td></tr><tr><td>FCC</td><td>4</td><td>12</td><td>Cu, Al, Ni, Ag, Au, Fe 912-1394 C</td></tr><tr><td>HCP</td><td>6</td><td>12</td><td>Mg, Zn, Cd, Ti, Co</td></tr></table><h4>Single crystal સામે polycrystal</h4><p>એક crystal તરીકે ઉગાડેલા turbine blade માં creep થવા માટે grain boundaries હોતી નથી; casting કરેલો bracket લાખો grains વાળો polycrystal છે અને દરેક દિશામાં સરખો વર્તે છે. મોટા ભાગની ઇજનેરી ધાતુઓ polycrystalline છે, અને Unit 2 grain ને વિષય બનાવે છે.</p><p><b>કેમ સાચું છે.</b> Cell એ ગણતરીનું સાધન છે. Cell અને તેના atoms ખબર હોય તો એક ગ્રામમાં atoms ની સંખ્યા, density, atoms વચ્ચેનું અંતર અને slip systems ની સંખ્યા બધું ગણી શકાય - તેથી જ ત્રણ cells મોઢે ગોખાય છે.</p><p><b>જવાબ ચકાસો.</b> કોષ્ટક માનતા પહેલા અંશ ગણો: corner atom આઠ cells વચ્ચે અને face atom બે વચ્ચે વહેંચાય છે, તેથી BCC 8 x 1/8 + 1 = 2 અને FCC 8 x 1/8 + 6 x 1/2 = 4. બીજી કોઈ ગણતરી આવે તો cell ખોટો દોરાયો છે.</p><p><b>સામાન્ય ભૂલ.</b> Unit cell એવી રીતે દોરવો કે જાણે atoms તેમના જ box ની અંદર હોય. Cell પોતાના corner અને face atoms પાડોશી સાથે વહેંચે છે, અને તે ભૂલવાથી atom ની ગણતરી ચાર કે તેથી વધુ ગણી વધી જાય.</p>"}, "diagram": "u1_cells", "syllabus_item": "1.3"}, {"h": {"en": "Packing fraction: why close-packed metals are denser", "gu": "Packing fraction: close-packed ધાતુઓ ઘન કેમ હોય"}, "body": {"en": "<p>Packing fraction is the fraction of the cell volume that the atoms themselves occupy. It depends only on how the spheres of equal size are stacked, not on which metal they are: simple cubic fills 52 %, body centred cubic 68 %, and the two close-packed arrangements 74 %.</p><div class=\"math\">APF = volume of atoms in the cell / volume of the cell\nBCC: atoms touch along the body diagonal, 4R = a sqrt(3), so a = 4R/sqrt(3), n = 2\n      APF = 2 (4/3 pi R^3)/(4R/sqrt(3))^3 = pi sqrt(3)/8 = 0.680\nFCC: atoms touch along the face diagonal, 4R = a sqrt(2), so a = 2 sqrt(2) R, n = 4\n      APF = 4 (4/3 pi R^3)/(2 sqrt(2) R)^3 = pi/(3 sqrt(2)) = 0.740</div><div class=\"eq\">APF BCC = pi sqrt(3)/8 = 0.68   APF FCC = APF HCP = pi/(3 sqrt(2)) = 0.74</div><table><tr><th>Structure</th><th>APF</th><th>Empty space</th><th>What the gap is used for</th></tr><tr><td>Simple cubic</td><td>0.52</td><td>48 %</td><td>no engineering metal uses it</td></tr><tr><td>BCC</td><td>0.68</td><td>32 %</td><td>carbon fits only in the small holes, 0.025 % solubility</td></tr><tr><td>FCC / HCP</td><td>0.74</td><td>26 %</td><td>the larger holes take 2 % carbon - why FCC iron is used for carburising</td></tr></table><p><b>Why it is true.</b> A close-packed structure leaves less empty space, so the same atoms give a larger density and a slightly larger expansion when heated. The same holes are the reason carbon dissolves in FCC iron twenty times more easily than in BCC iron, which is the whole basis of the heat treatment in Unit 2.</p><p><b>Check your answer.</b> Sanity check the arithmetic: pi sqrt(3)/8 = 3.1416 x 1.7321/8 = 0.6802 and pi/(3 sqrt(2)) = 3.1416/4.2426 = 0.7405. Both must be below 0.8, because spheres cannot fill all the space.</p><p><b>Common mistake.</b> Using 0.74 for BCC iron because iron is \"close packed\" in daily speech. Iron is BCC at room temperature, so its APF is 0.68 - it becomes close packed only above 912 C.</p>", "gu": "<p>Packing fraction એ cell ના volume નો જે ભાગ atoms પોતે રોકે છે તે અંશ છે. તે ફક્ત એના પર આધારે છે કે સરખા માપના ગોળા કેવી રીતે ગોઠવાયા છે, ધાતુ કઈ છે તેના પર નહીં: simple cubic 52 %, body centred cubic 68 %, અને બે close-packed ગોઠવણી 74 % ભરે છે.</p><div class=\"math\">APF = volume of atoms in the cell / volume of the cell\nBCC: atoms touch along the body diagonal, 4R = a sqrt(3), so a = 4R/sqrt(3), n = 2\n      APF = 2 (4/3 pi R^3)/(4R/sqrt(3))^3 = pi sqrt(3)/8 = 0.680\nFCC: atoms touch along the face diagonal, 4R = a sqrt(2), so a = 2 sqrt(2) R, n = 4\n      APF = 4 (4/3 pi R^3)/(2 sqrt(2) R)^3 = pi/(3 sqrt(2)) = 0.740</div><div class=\"eq\">APF BCC = pi sqrt(3)/8 = 0.68   APF FCC = APF HCP = pi/(3 sqrt(2)) = 0.74</div><table><tr><th>રચના</th><th>APF</th><th>ખાલી જગ્યા</th><th>જગ્યાનો ઉપયોગ</th></tr><tr><td>Simple cubic</td><td>0.52</td><td>48 %</td><td>કોઈ ઇજનેરી ધાતુ તેનો ઉપયોગ કરતી નથી</td></tr><tr><td>BCC</td><td>0.68</td><td>32 %</td><td>carbon ફક્ત નાના છિદ્રોમાં બેસે, 0.025 % દ્રાવ્યતા</td></tr><tr><td>FCC / HCP</td><td>0.74</td><td>26 %</td><td>મોટા છિદ્રો 2 % carbon લે - તેથી carburising માં FCC iron વપરાય</td></tr></table><p><b>કેમ સાચું છે.</b> Close-packed રચના ઓછી ખાલી જગ્યા રાખે, તેથી એ જ atoms વધુ density આપે અને ગરમ કરવા પર થોડું વધુ પ્રસરે. એ જ છિદ્રોનાં કારણે carbon FCC iron માં BCC iron કરતાં વીસ ગણું સહેલાઈથી ઓગળે, જે Unit 2 ના heat treatment નો આખો પાયો છે.</p><p><b>જવાબ ચકાસો.</b> ગણતરી ચકાસો: pi sqrt(3)/8 = 3.1416 x 1.7321/8 = 0.6802 અને pi/(3 sqrt(2)) = 3.1416/4.2426 = 0.7405. બંને 0.8 થી નીચે જ હોવા જોઈએ, કારણ કે ગોળા આખી જગ્યા ભરી શકતા નથી.</p><p><b>સામાન્ય ભૂલ.</b> રોજિંદી ભાષામાં iron \"close packed\" હોવાથી BCC iron માટે 0.74 વાપરવું. Room temperature પર iron BCC છે, તેથી તેનું APF 0.68 છે - તે 912 C ઉપર જ close packed થાય.</p>"}, "diagram": "u1_packing", "syllabus_item": "1.3"}, {"h": {"en": "Density from the unit cell", "gu": "Unit cell પરથી density"}, "body": {"en": "<p>The density of a metal can be calculated from its cell alone: count the atoms in the cell, multiply by the atomic mass, and divide by the volume of the cell times Avogadro's number. The answer comes within one per cent of the handbook value, which is the best proof that the cell model is right.</p><div class=\"math\">rho = n A /(N_A a^3)     n = atoms per cell, a = cell edge, N_A = 6.022e23\nBCC iron: n = 2, A = 55.85, a = 0.2866 nm\n  a^3 = (2.866e-8 cm)^3 = 2.354e-23 cm3\n  rho = 2 x 55.85/(6.022e23 x 2.354e-23) = 111.7/14.18 = 7.88 g/cm3  (measured 7.87)\nFCC copper: n = 4, A = 63.55, a = 0.3615 nm\n  rho = 4 x 63.55/(6.022e23 x 4.725e-23) = 254.2/28.45 = 8.94 g/cm3  (measured 8.96)</div><h4>Atoms per cubic millimetre</h4><div class=\"math\">atoms per cell / cell volume = n/a^3\niron: 2/(2.866e-7 mm)^3 = 2/2.354e-20 = 8.5e19 atoms per mm3</div><div class=\"eq\">rho = n A/(N_A a^3)   atoms per unit volume = n/a^3</div><p><b>Why it is true.</b> Density is mass per volume, and the cell gives both: n atoms of mass A/N_A inside a volume a^3. Nothing else is needed, so a density that disagrees with the handbook by more than a per cent means the wrong cell, the wrong n or the wrong unit of a.</p><p><b>Check your answer.</b> Work in centimetres throughout: 1 nm = 1e-7 cm, so 0.2866 nm = 2.866e-8 cm and a^3 = 2.354e-23 cm3. Mixing nanometres with grams per cubic centimetre is the most common mistake in the whole calculation.</p><p><b>Common mistake.</b> Using the lattice parameter of one metal for another, or forgetting that a is an edge and not a radius. The cell edge of iron is 0.287 nm but its atomic radius is 0.124 nm, and mixing the two changes the density by a factor of ten.</p>", "gu": "<p>ધાતુની density ફક્ત તેના cell પરથી ગણાય: cell માં atoms ગણો, atomic mass થી ગુણો, અને cell ના volume ગુણ્યા Avogadro's number થી ભાગો. જવાબ handbook ના મૂલ્યની એક ટકાની અંદર આવે છે, જે cell model સાચું છે તેનો સૌથી સારો પુરાવો છે.</p><div class=\"math\">rho = n A /(N_A a^3)     n = atoms per cell, a = cell edge, N_A = 6.022e23\nBCC iron: n = 2, A = 55.85, a = 0.2866 nm\n  a^3 = (2.866e-8 cm)^3 = 2.354e-23 cm3\n  rho = 2 x 55.85/(6.022e23 x 2.354e-23) = 111.7/14.18 = 7.88 g/cm3  (measured 7.87)\nFCC copper: n = 4, A = 63.55, a = 0.3615 nm\n  rho = 4 x 63.55/(6.022e23 x 4.725e-23) = 254.2/28.45 = 8.94 g/cm3  (measured 8.96)</div><h4>ઘન મિલીમીટર દીઠ atoms</h4><div class=\"math\">atoms per cell / cell volume = n/a^3\niron: 2/(2.866e-7 mm)^3 = 2/2.354e-20 = 8.5e19 atoms per mm3</div><div class=\"eq\">rho = n A/(N_A a^3)   atoms per unit volume = n/a^3</div><p><b>કેમ સાચું છે.</b> Density એ volume દીઠ દળ છે, અને cell બંને આપે: a^3 volume માં A/N_A દળના n atoms. બીજું કંઈ જરૂરી નથી, તેથી handbook સાથે એક ટકાથી વધુ ફરક આવે તો ખોટો cell, ખોટો n કે a નો ખોટો એકમ છે.</p><p><b>જવાબ ચકાસો.</b> આખી ગણતરી સેન્ટીમીટરમાં કરો: 1 nm = 1e-7 cm, તેથી 0.2866 nm = 2.866e-8 cm અને a^3 = 2.354e-23 cm3. નેનોમીટરને ગ્રામ પ્રતિ ઘન સેન્ટીમીટર સાથે ભેગા કરવું આખી ગણતરીની સૌથી સામાન્ય ભૂલ છે.</p><p><b>સામાન્ય ભૂલ.</b> એક ધાતુનો lattice parameter બીજા માટે વાપરવો, કે a radius નહીં પણ edge છે તે ભૂલવું. iron નો cell edge 0.287 nm છે પણ atomic radius 0.124 nm, અને બંને ભેગા કરવાથી density દશ ગણી બદલાય.</p>"}, "syllabus_item": "1.3"}]}, {"title": {"en": "1.4 Properties of materials", "gu": "1.4 સામગ્રીના ગુણધર્મો"}, "items": [{"h": {"en": "Mechanical properties and the tensile test", "gu": "Mechanical ગુણધર્મો અને tensile test"}, "body": {"en": "<p>Mechanical properties say how a material answers a force. The tensile test answers all of them at once: a standard specimen is pulled until it breaks, and the load and the extension are recorded. Stress is the load divided by the original area, strain is the extension divided by the original length, and the curve of one against the other gives the modulus, the yield strength, the ultimate strength and the ductility.</p><div class=\"math\">stress sigma = P/A0        strain epsilon = dL/L0\nelastic: sigma = E epsilon, so E = slope of the straight part (steel 200 GPa)\nyield strength: the stress at which 0.2 % permanent strain is left behind\nUTS: the highest stress on the curve (necking starts here)\nductility: % elongation = 100 (Lf - L0)/L0;  % reduction in area = 100 (A0 - Af)/A0\ntoughness = area under the stress-strain curve up to fracture</div><table><tr><th>Property</th><th>Meaning</th><th>Mild steel value</th></tr><tr><td>elasticity</td><td>returns to shape after the load</td><td>E = 200 GPa</td></tr><tr><td>yield strength</td><td>first permanent deformation</td><td>250 MPa</td></tr><tr><td>ultimate strength</td><td>highest stress before necking</td><td>450 MPa</td></tr><tr><td>ductility</td><td>stretch before fracture</td><td>25 % elongation</td></tr><tr><td>hardness</td><td>resistance to indentation and wear</td><td>150 HB</td></tr><tr><td>toughness</td><td>energy absorbed before fracture</td><td>high - it bends before it breaks</td></tr></table><p><b>Why it is true.</b> The straight part and the curved part answer two different questions. In the straight part the bonds stretch and spring back, so the slope is a property of the bond and not of the part. Past the yield point the atoms slide over one another and the change is permanent, so the shape and the grain size now matter as much as the material.</p><p><b>Check your answer.</b> Two numbers must agree with the curve you drew: the UTS is the highest point (not the fracture point) and the fracture stress is usually lower than the UTS, because the area has already necked down. If the drawn curve peaks at the fracture, it is wrong.</p><p><b>Common mistake.</b> Quoting the UTS as the safe working stress. The allowable stress is the yield strength divided by a factor of safety, and for a brittle material it is the UTS divided by a much larger factor, because there is no yield to warn you.</p>", "gu": "<p>Mechanical ગુણધર્મો કહે છે કે સામગ્રી બળને કેવો જવાબ આપે. Tensile test એ બધાનો જવાબ એકસાથે આપે: પ્રમાણભૂત specimen તૂટે ત્યાં સુધી ખેંચાય, અને load તથા લંબાઈ નોંધાય. Stress એ load ભાગ્યું મૂળ area, strain એ લંબાઈ ભાગ્યું મૂળ લંબાઈ, અને એક સામે બીજાનો વક્ર modulus, yield strength, ultimate strength અને ductility આપે.</p><div class=\"math\">stress sigma = P/A0        strain epsilon = dL/L0\nelastic: sigma = E epsilon, so E = slope of the straight part (steel 200 GPa)\nyield strength: the stress at which 0.2 % permanent strain is left behind\nUTS: the highest stress on the curve (necking starts here)\nductility: % elongation = 100 (Lf - L0)/L0;  % reduction in area = 100 (A0 - Af)/A0\ntoughness = area under the stress-strain curve up to fracture</div><table><tr><th>ગુણધર્મ</th><th>અર્થ</th><th>Mild steel મૂલ્ય</th></tr><tr><td>elasticity</td><td>load હટે પછી આકાર પાછો</td><td>E = 200 GPa</td></tr><tr><td>yield strength</td><td>પહેલું કાયમી વિકાર</td><td>250 MPa</td></tr><tr><td>ultimate strength</td><td>necking પહેલા સૌથી ઊંચો stress</td><td>450 MPa</td></tr><tr><td>ductility</td><td>તૂટતા પહેલા ખેંચાય</td><td>25 % elongation</td></tr><tr><td>hardness</td><td>દબાવટ અને ઘસારાનો અવરોધ</td><td>150 HB</td></tr><tr><td>toughness</td><td>તૂટતા પહેલા શોષાતી ઊર્જા</td><td>ઊંચી - તૂટતા પહેલા વળે</td></tr></table><p><b>કેમ સાચું છે.</b> સીધો ભાગ અને વળાંકવાળો ભાગ બે જુદા પ્રશ્નોના જવાબ આપે. સીધા ભાગમાં bonds ખેંચાય અને પાછા આવે, તેથી ઢોળાવ bond નું લક્ષણ છે, ભાગનું નહીં. Yield પછી atoms એકબીજા પર સરકે અને ફેરફાર કાયમી થાય, તેથી હવે આકાર અને grain size પણ સામગ્રી જેટલા જ મહત્વના બને.</p><p><b>જવાબ ચકાસો.</b> તમે દોરેલા વક્ર સાથે બે આંકડા મળવા જોઈએ: UTS સૌથી ઊંચું બિંદુ છે (તૂટવાનું બિંદુ નહીં) અને fracture stress સામાન્ય રીતે UTS કરતાં નીચો હોય, કારણ કે area ત્યાં સુધીમાં necked થઈ ગઈ છે. દોરેલો વક્ર fracture પર ટોચે પહોંચે તો તે ખોટો છે.</p><p><b>સામાન્ય ભૂલ.</b> UTS ને સલામત working stress તરીકે લખવું. Allowable stress એ yield strength ભાગ્યું factor of safety છે, અને ભંગુર સામગ્રી માટે UTS ભાગ્યું ઘણો મોટો factor, કારણ કે ચેતવણી આપે તેવું yield ત્યાં હોતું નથી.</p>"}, "diagram": "u1_stress", "syllabus_item": "1.4"}, {"h": {"en": "Physical, chemical, electrical, electromagnetic and thermal properties", "gu": "Physical, chemical, electrical, electromagnetic અને thermal ગુણધર્મો"}, "body": {"en": "<p>The other five property groups decide whether a material survives the place it is put in. Physical properties are density and melting point; chemical properties are corrosion and oxidation resistance; electrical properties are resistivity and conductivity; electromagnetic properties are permeability and coercivity, which decide motor and transformer cores; thermal properties are conductivity, expansion and specific heat.</p><div class=\"math\">thermal expansion: dL = alpha L0 dT     steel 12e-6/K, aluminium 23e-6/K\nresistance: R = rho_e L/A       copper 1.7e-8, aluminium 2.8e-8 ohm m\nheat to warm a part: Q = m c dT   steel 490, aluminium 900 J/(kg K)\nconductivity: copper 385, aluminium 205, steel 50, rubber 0.15 W/(m K)</div><table><tr><th>Group</th><th>Property</th><th>Where it decides the design</th></tr><tr><td>Physical</td><td>density, melting point</td><td>weight of the part, safe working temperature</td></tr><tr><td>Chemical</td><td>corrosion, oxidation resistance</td><td>pipe, tank, marine and food equipment</td></tr><tr><td>Electrical</td><td>resistivity, conductivity</td><td>busbar, heating element, insulator</td></tr><tr><td>Electromagnetic</td><td>permeability, coercivity</td><td>motor and transformer core, magnet</td></tr><tr><td>Thermal</td><td>conductivity, expansion, specific heat</td><td>heat exchanger, bearing clearance, welding distortion</td></tr></table><div class=\"eq\">dL = alpha L0 dT   R = rho_e L / A   Q = m c dT</div><p><b>Why it is true.</b> Thermal expansion is the property that breaks parts quietly. Two materials bolted together at 25 C and heated to 200 C expand by different amounts, and the difference becomes a stress: steel against aluminium over 200 mm gives about 0.5 mm of mismatch, which is enough to bow a flange or crack a weld.</p><p><b>Check your answer.</b> Compare conductivities as ratios, not as numbers: copper conducts 385/50 = 7.7 times better than steel and 385/0.15 = 2570 times better than rubber. The ratios are what a designer uses; the absolute values only look impressive.</p><p><b>Common mistake.</b> Treating resistivity as a single number for an alloy family. Adding 1 % of alloying element can double or triple the resistivity of copper, which is why a brass terminal runs hotter than a copper one of the same size.</p>", "gu": "<p>બાકીના પાંચ ગુણધર્મ સમૂહ નક્કી કરે કે સામગ્રી જ્યાં મૂકાય છે ત્યાં ટકશે કે નહીં. Physical ગુણધર્મ density અને ગલનબિંદુ છે; chemical ગુણધર્મ કાટ અને oxidation નો અવરોધ છે; electrical ગુણધર્મ resistivity અને conductivity છે; electromagnetic ગુણધર્મ permeability અને coercivity છે, જે motor તથા transformer ના core નક્કી કરે; thermal ગુણધર્મ conductivity, expansion અને specific heat છે.</p><div class=\"math\">thermal expansion: dL = alpha L0 dT     steel 12e-6/K, aluminium 23e-6/K\nresistance: R = rho_e L/A       copper 1.7e-8, aluminium 2.8e-8 ohm m\nheat to warm a part: Q = m c dT   steel 490, aluminium 900 J/(kg K)\nconductivity: copper 385, aluminium 205, steel 50, rubber 0.15 W/(m K)</div><table><tr><th>સમૂહ</th><th>ગુણધર્મ</th><th>design માં ક્યાં નક્કી કરે</th></tr><tr><td>Physical</td><td>density, ગલનબિંદુ</td><td>ભાગનું વજન, સલામત temperature</td></tr><tr><td>Chemical</td><td>કાટ, oxidation અવરોધ</td><td>pipe, tank, marine અને food equipment</td></tr><tr><td>Electrical</td><td>resistivity, conductivity</td><td>busbar, heating element, insulator</td></tr><tr><td>Electromagnetic</td><td>permeability, coercivity</td><td>motor અને transformer core, magnet</td></tr><tr><td>Thermal</td><td>conductivity, expansion, specific heat</td><td>heat exchanger, bearing clearance, welding distortion</td></tr></table><div class=\"eq\">dL = alpha L0 dT   R = rho_e L / A   Q = m c dT</div><p><b>કેમ સાચું છે.</b> Thermal expansion એ ગુણધર્મ છે જે ભાગોને ચૂપચાપ તોડે. 25 C પર બોલ્ટ કરેલી બે સામગ્રી 200 C પર જુદા પ્રમાણમાં પ્રસરે, અને ફરક stress બને: 200 mm પર steel સામે aluminium લગભગ 0.5 mm ફરક આપે, જે flange વાળવા કે weld તોડવા પૂરતું છે.</p><p><b>જવાબ ચકાસો.</b> Conductivity ને ગુણોત્તર તરીકે સરખાવો, આંકડા તરીકે નહીં: copper steel કરતાં 385/50 = 7.7 ગણું અને rubber કરતાં 385/0.15 = 2570 ગણું સારું વહન કરે. ગુણોત્તર જ designer વાપરે છે; નિરપેક્ષ મૂલ્યો ફક્ત પ્રભાવક લાગે.</p><p><b>સામાન્ય ભૂલ.</b> એલોય કુટુંબ માટે resistivity ને એક જ આંકડો ગણવો. 1 % alloying element ઉમેરવાથી copper નું resistivity બમણું કે ત્રણ ગણું થઈ શકે, તેથી જ સરખા માપનું brass terminal copper કરતાં વધુ ગરમ થાય.</p>"}, "diagram": "u1_thermal", "syllabus_item": "1.4"}]}, {"title": {"en": "1.5 Solved Numericals, Step by Step", "gu": "1.5 ઉકેલેલા દાખલા, પગલે પગલે"}, "items": [{"h": {"en": "Cell geometry and atoms per cubic millimetre of iron", "gu": "Iron ના cell ની ભૂમિતિ અને ઘન મિલીમીટર દીઠ atoms"}, "body": {"en": "<h4>Question (6 marks)</h4><p>Iron at room temperature is BCC with a cell edge of 0.2866 nm and an atomic mass of 55.85. Find the atomic radius, the number of atoms in one cubic millimetre and the packing fraction, and say how far the calculated density is from the handbook value of 7.87 g/cm3.</p><h4>Step 1 - the atomic radius</h4><div class=\"math\">BCC: atoms touch along the body diagonal, 4R = a sqrt(3)\nR = a sqrt(3)/4 = 0.2866 x 1.732/4 = 0.1241 nm</div><h4>Step 2 - atoms per cubic millimetre</h4><div class=\"math\">a = 0.2866 nm = 2.866e-7 mm, so a^3 = 2.354e-20 mm3\nn = 2 atoms per cell\nN_v = 2/2.354e-20 = 8.50e19 atoms per mm3</div><h4>Step 3 - packing fraction and density</h4><div class=\"math\">APF = pi sqrt(3)/8 = 0.680  (68 %)\nrho = 2 x 55.85/(6.022e23 x 2.354e-23) = 7.88 g/cm3\nagainst 7.87 measured: 0.1 % high</div><div class=\"eq\">R = 0.124 nm,  N_v = 8.5e19 per mm3,  APF = 0.68,  rho = 7.88 g/cm3</div><p>The calculation lands within a tenth of a per cent of the handbook value, which is the standard proof that the BCC assignment for room-temperature iron is right. The small excess comes from the ideal-crystal assumption: a real metal has vacancies and is slightly expanded.</p><p><b>Check your answer.</b> exp of the two routes: from R, APF = 2 x (4/3 pi R^3)/a^3 gives the same 0.68, so the radius and the packing fraction are consistent.</p><p><b>Common mistake.</b> Using a = 0.2866 nm with the radius formula of FCC. In BCC the contact is along the body diagonal (4R = a sqrt 3); using the FCC relation would give R = 0.101 nm and a wrong density.</p>", "gu": "<h4>પ્રશ્ન (6 marks)</h4><p>Room temperature પર iron BCC છે, cell edge 0.2866 nm અને atomic mass 55.85 છે. Atomic radius, એક ઘન મિલીમીટરમાં atoms ની સંખ્યા અને packing fraction શોધો, અને ગણેલી density handbook ના 7.87 g/cm3 થી કેટલી દૂર છે તે કહો.</p><h4>પગલું 1 - atomic radius</h4><div class=\"math\">BCC: atoms touch along the body diagonal, 4R = a sqrt(3)\nR = a sqrt(3)/4 = 0.2866 x 1.732/4 = 0.1241 nm</div><h4>પગલું 2 - ઘન મિલીમીટર દીઠ atoms</h4><div class=\"math\">a = 0.2866 nm = 2.866e-7 mm, so a^3 = 2.354e-20 mm3\nn = 2 atoms per cell\nN_v = 2/2.354e-20 = 8.50e19 atoms per mm3</div><h4>પગલું 3 - packing fraction અને density</h4><div class=\"math\">APF = pi sqrt(3)/8 = 0.680  (68 %)\nrho = 2 x 55.85/(6.022e23 x 2.354e-23) = 7.88 g/cm3\nagainst 7.87 measured: 0.1 % high</div><div class=\"eq\">R = 0.124 nm,  N_v = 8.5e19 per mm3,  APF = 0.68,  rho = 7.88 g/cm3</div><p>ગણતરી handbook મૂલ્યની એક દશાંશ ટકાની અંદર આવે છે, જે room-temperature iron માટે BCC સોંપણી સાચી છે તેનો પ્રમાણભૂત પુરાવો છે. થોડો વધારો આદર્શ-crystal ધારણામાંથી આવે: સાચી ધાતુમાં vacancies હોય અને તે થોડી પ્રસરેલી હોય.</p><p><b>જવાબ ચકાસો.</b> બે રસ્તા ચકાસો: R પરથી APF = 2 x (4/3 pi R^3)/a^3 પણ એ જ 0.68 આપે, તેથી radius અને packing fraction સુસંગત છે.</p><p><b>સામાન્ય ભૂલ.</b> BCC માટે FCC નું radius સૂત્ર વાપરવું. BCC માં સ્પર્શ body diagonal પર છે (4R = a sqrt 3); FCC સંબંધ વાપરવાથી R = 0.101 nm આવે અને density ખોટી થાય.</p>"}}, {"h": {"en": "Density and radius of copper from its FCC cell", "gu": "FCC cell પરથી copper ની density અને radius"}, "body": {"en": "<h4>Question (7 marks)</h4><p>Copper is FCC with a cell edge of 0.3615 nm and an atomic mass of 63.55. Calculate the density, the atomic radius and the number of atoms per cubic centimetre, and compare the density with the handbook value 8.96 g/cm3.</p><h4>Step 1 - density</h4><div class=\"math\">a = 0.3615 nm = 3.615e-8 cm,  a^3 = 4.725e-23 cm3,  n = 4\nrho = n A/(N_A a^3) = 4 x 63.55/(6.022e23 x 4.725e-23)\n    = 254.2/28.45 = 8.93 g/cm3</div><h4>Step 2 - atomic radius</h4><div class=\"math\">FCC: 4R = a sqrt(2)  ->  R = 3.615 x 1.4142/4 = 0.1278 nm</div><h4>Step 3 - atoms per cubic centimetre</h4><div class=\"math\">N_v = n/a^3 = 4/4.725e-23 = 8.47e22 atoms per cm3</div><div class=\"eq\">rho = 8.93 g/cm3,  R = 0.128 nm,  N_v = 8.5e22 per cm3</div><p>The density is 0.3 % below the handbook value, which is the usual agreement for a defect-free cell at room temperature. Copper and aluminium are both FCC, and that is why both are easy to draw into wire.</p><p><b>Check your answer.</b> Compare with iron: copper 8.93 against iron 7.88, a ratio of 1.13, while their atomic masses are 63.55 against 55.85, a ratio of 1.14. The two ratios agree because the cell volumes per atom are similar.</p><p><b>Common mistake.</b> Forgetting that n = 4 for FCC. Using n = 2 halves the answer and makes copper 4.5 g/cm3, which is lighter than titanium - a result easy to spot if the order of magnitude is known.</p>", "gu": "<h4>પ્રશ્ન (7 marks)</h4><p>Copper FCC છે, cell edge 0.3615 nm અને atomic mass 63.55 છે. Density, atomic radius અને ઘન સેન્ટીમીટર દીઠ atoms ગણો, અને density ને handbook ના 8.96 g/cm3 સાથે સરખાવો.</p><h4>પગલું 1 - density</h4><div class=\"math\">a = 0.3615 nm = 3.615e-8 cm,  a^3 = 4.725e-23 cm3,  n = 4\nrho = n A/(N_A a^3) = 4 x 63.55/(6.022e23 x 4.725e-23)\n    = 254.2/28.45 = 8.93 g/cm3</div><h4>પગલું 2 - atomic radius</h4><div class=\"math\">FCC: 4R = a sqrt(2)  ->  R = 3.615 x 1.4142/4 = 0.1278 nm</div><h4>પગલું 3 - ઘન સેન્ટીમીટર દીઠ atoms</h4><div class=\"math\">N_v = n/a^3 = 4/4.725e-23 = 8.47e22 atoms per cm3</div><div class=\"eq\">rho = 8.93 g/cm3,  R = 0.128 nm,  N_v = 8.5e22 per cm3</div><p>Density handbook મૂલ્ય કરતાં 0.3 % નીચી આવે છે, જે room temperature પર દોષરહિત cell માટે સામાન્ય સરખામણી છે. Copper અને aluminium બંને FCC છે, તેથી જ બંનેને wire માં ખેંચવા સહેલા છે.</p><p><b>જવાબ ચકાસો.</b> Iron સાથે સરખાવો: copper 8.93 સામે iron 7.88, ગુણોત્તર 1.13, જ્યારે atomic mass 63.55 સામે 55.85, ગુણોત્તર 1.14. બંને ગુણોત્તર મળે કારણ કે પ્રતિ atom cell volume સરખું છે.</p><p><b>સામાન્ય ભૂલ.</b> FCC માટે n = 4 છે તે ભૂલવું. n = 2 વાપરવાથી જવાબ અડધો થાય અને copper 4.5 g/cm3 આવે, જે titanium કરતાં પણ હલકું છે - order of magnitude ખબર હોય તો સહેલાઈથી પકડાય.</p>"}}, {"h": {"en": "Reading a tensile test", "gu": "Tensile test નું વાંચન"}, "body": {"en": "<h4>Question (8 marks)</h4><p>A 12.5 mm diameter, 50 mm gauge length specimen of steel is tested. It yields at 40 kN, reaches a maximum load of 62 kN and breaks at a gauge length of 62.5 mm with a diameter at the neck of 9.5 mm. Find the yield strength, the ultimate tensile strength, the percentage elongation and the percentage reduction in area.</p><h4>Step 1 - the areas</h4><div class=\"math\">A0 = pi d0^2/4 = pi (12.5)^2/4 = 122.7 mm2\nAf = pi (9.5)^2/4 = 70.9 mm2</div><h4>Step 2 - the strengths</h4><div class=\"math\">sigma_y = 40 000/122.7 = 326 MPa\nsigma_UTS = 62 000/122.7 = 505 MPa</div><h4>Step 3 - the ductility</h4><div class=\"math\">elongation = 100 (62.5 - 50)/50 = 25 %\nreduction in area = 100 (122.7 - 70.9)/122.7 = 42.2 %</div><div class=\"eq\">sigma_y = 326 MPa,  sigma_UTS = 505 MPa,  25 % elongation,  42 % RA</div><p>Both strengths are above the textbook mild-steel values (250 and 450 MPa), so this is a medium-carbon or a work-hardened steel. An elongation of 25 % with a 42 % reduction in area marks a ductile material: it would have warned before breaking.</p><p><b>Check your answer.</b> The safety factor on yield: 326/250 is not the check, but sigma_y/1.5 = 217 MPa is the allowable stress for a ductile part with a factor of safety of 1.5.</p><p><b>Common mistake.</b> Dividing the breaking load by the necked area and calling it the UTS. The UTS is defined on the original area; the true stress at fracture is higher and is a different quantity.</p>", "gu": "<h4>પ્રશ્ન (8 marks)</h4><p>12.5 mm વ્યાસ અને 50 mm gauge length વાળો steel specimen test કરાય. 40 kN પર yield થાય, 62 kN પર મહત્તમ load આવે, અને 62.5 mm gauge length તથા neck પર 9.5 mm વ્યાસ સાથે તૂટે. Yield strength, ultimate tensile strength, ટકાવારી elongation અને ટકાવારી reduction in area શોધો.</p><h4>પગલું 1 - areas</h4><div class=\"math\">A0 = pi d0^2/4 = pi (12.5)^2/4 = 122.7 mm2\nAf = pi (9.5)^2/4 = 70.9 mm2</div><h4>પગલું 2 - strengths</h4><div class=\"math\">sigma_y = 40 000/122.7 = 326 MPa\nsigma_UTS = 62 000/122.7 = 505 MPa</div><h4>પગલું 3 - ductility</h4><div class=\"math\">elongation = 100 (62.5 - 50)/50 = 25 %\nreduction in area = 100 (122.7 - 70.9)/122.7 = 42.2 %</div><div class=\"eq\">sigma_y = 326 MPa,  sigma_UTS = 505 MPa,  25 % elongation,  42 % RA</div><p>બંને strength textbook માંના mild steel મૂલ્ય (250 અને 450 MPa) કરતાં ઊંચા છે, તેથી આ medium-carbon કે work-hardened steel છે. 25 % elongation અને 42 % reduction in area ductile સામગ્રી દર્શાવે: તે તૂટતા પહેલા ચેતવણી આપત.</p><p><b>જવાબ ચકાસો.</b> Yield પર safety factor: 326/250 ચકાસણી નથી, પણ sigma_y/1.5 = 217 MPa એ 1.5 factor of safety વાળા ductile ભાગ માટે allowable stress છે.</p><p><b>સામાન્ય ભૂલ.</b> તૂટવાના load ને necked area થી ભાગી તેને UTS કહેવું. UTS મૂળ area પર વ્યાખ્યાયિત છે; fracture પરનો true stress ઊંચો હોય છે અને તે જુદી રાશિ છે.</p>"}}, {"h": {"en": "Thermal expansion of a rail", "gu": "રેલનું thermal expansion"}, "body": {"en": "<h4>Question (7 marks)</h4><p>A steel rail is 20 m long at 20 C. The rail may reach 55 C in summer. Taking the expansion coefficient of steel as 11.7e-6 per K, find the expansion and the gap to be left between rails. If the gap were zero, estimate the thermal stress with E = 200 GPa.</p><h4>Step 1 - temperature rise</h4><div class=\"math\">dT = 55 - 20 = 35 K</div><h4>Step 2 - expansion</h4><div class=\"math\">dL = alpha L0 dT = 11.7e-6 x 20 000 x 35 = 8.19 mm</div><h4>Step 3 - the stress if the rail cannot expand</h4><div class=\"math\">sigma = E alpha dT = 200e9 x 11.7e-6 x 35 = 81.9e6 Pa = 82 MPa</div><div class=\"eq\">dL = 8.2 mm,  thermal stress if restrained = 82 MPa</div><p>82 MPa is a third of the yield strength of mild steel, so a restrained rail is not far from yielding on a hot day; a few joints with the wrong gap will buckle the track. Welded track uses the same number to set the stress-free temperature.</p><p><b>Check your answer.</b> Unit check: 11.7e-6 per K times 20 m times 35 K is a length, so metres; 8.19e-3 m is 8.19 mm. A result in metres that looks like millimetres means the 1e-6 was dropped.</p><p><b>Common mistake.</b> Leaving the gap equal to the expansion of one rail only. The gap is set for the expansion over the installation temperature range, and two rails meet at each joint, so the practical allowance is arrived at from the design temperature, not from one day's weather.</p>", "gu": "<h4>પ્રશ્ન (7 marks)</h4><p>Steel રેલ 20 C પર 20 m લાંબી છે. ઉનાળામાં 55 C સુધી પહોંચી શકે. Steel નો expansion coefficient 11.7e-6 પ્રતિ K લઈ, પ્રસરણ અને રેલ વચ્ચે રાખવાનું અંતર શોધો. અંતર શૂન્ય હોય તો E = 200 GPa સાથે thermal stress અંદાજો.</p><h4>પગલું 1 - temperature વધારો</h4><div class=\"math\">dT = 55 - 20 = 35 K</div><h4>પગલું 2 - પ્રસરણ</h4><div class=\"math\">dL = alpha L0 dT = 11.7e-6 x 20 000 x 35 = 8.19 mm</div><h4>પગલું 3 - રેલ પ્રસરી ન શકે તો stress</h4><div class=\"math\">sigma = E alpha dT = 200e9 x 11.7e-6 x 35 = 81.9e6 Pa = 82 MPa</div><div class=\"eq\">dL = 8.2 mm,  thermal stress if restrained = 82 MPa</div><p>82 MPa mild steel ની yield strength ના ત્રીજા ભાગ જેટલું છે, તેથી ગરમ દિવસે રોકાયેલી રેલ yield ની નજીક હોય; ખોટા અંતરવાળા થોડા joints track ને વાળી નાખે. Welded track એ જ આંકડાથી stress-free temperature ઠરાવે.</p><p><b>જવાબ ચકાસો.</b> એકમ ચકાસો: 11.7e-6 પ્રતિ K ગુણ્યા 20 m ગુણ્યા 35 K એ લંબાઈ છે, તેથી મીટર; 8.19e-3 m એટલે 8.19 mm. મીટરમાં જવાબ મિલીમીટર જેવો લાગે તો 1e-6 ખૂટે છે.</p><p><b>સામાન્ય ભૂલ.</b> એક રેલના પ્રસરણ જેટલું જ અંતર રાખવું. અંતર installation temperature ની રેન્જ પરના પ્રસરણ માટે ઠરાવાય, અને દરેક joint પર બે રેલ મળે, તેથી વ્યવહારની છૂટ design temperature પરથી આવે, એક દિવસના હવામાન પરથી નહીં.</p>"}}, {"h": {"en": "Copper against aluminium for a conductor", "gu": "Conductor માટે copper સામે aluminium"}, "body": {"en": "<h4>Question (6 marks)</h4><p>A 100 m run of conductor has a cross-section of 2.5 mm2. Find the resistance with copper (rho = 1.72e-8 ohm m) and with aluminium (rho = 2.82e-8 ohm m), and compare the masses (densities 8.96 and 2.70 g/cm3). State which you would use for an overhead line and why.</p><h4>Step 1 - resistances</h4><div class=\"math\">R = rho L/A,  A = 2.5 mm2 = 2.5e-6 m2,  L = 100 m\ncopper: R = 1.72e-8 x 100/2.5e-6 = 0.688 ohm\naluminium: R = 2.82e-8 x 100/2.5e-6 = 1.128 ohm</div><h4>Step 2 - masses</h4><div class=\"math\">volume = 2.5e-6 x 100 = 2.5e-4 m3 = 250 cm3\ncopper: 250 x 8.96 = 2240 g\naluminium: 250 x 2.70 = 675 g</div><div class=\"eq\">R: 0.69 ohm copper, 1.13 ohm aluminium;  mass: 2.24 kg against 0.68 kg</div><p>Aluminium has 1.64 times the resistance but only 0.30 of the mass, so for the same conductance it still weighs half as much. That is why overhead lines are ACSR - aluminium conductors with a steel core - while a switchgear busbar, where space matters, stays copper.</p><p><b>Check your answer.</b> Ratios: 1.128/0.688 = 1.64 = 2.82/1.72, the resistivity ratio, and 8.96/2.70 = 3.32, the density ratio. Every answer in this problem is one of those two ratios.</p><p><b>Common mistake.</b> Comparing resistances of equal mass instead of equal size. A fair comparison for a line is at equal conductance and equal span, which means a larger aluminium section - and only then does the mass advantage become the 2:1 that the industry quotes.</p>", "gu": "<h4>પ્રશ્ન (6 marks)</h4><p>100 m લાંબા conductor નો cross-section 2.5 mm2 છે. Copper (rho = 1.72e-8 ohm m) અને aluminium (rho = 2.82e-8 ohm m) સાથે resistance શોધો, અને દળની સરખામણી કરો (density 8.96 અને 2.70 g/cm3). Overhead line માટે કયું વાપરશો અને કેમ તે કહો.</p><h4>પગલું 1 - resistances</h4><div class=\"math\">R = rho L/A,  A = 2.5 mm2 = 2.5e-6 m2,  L = 100 m\ncopper: R = 1.72e-8 x 100/2.5e-6 = 0.688 ohm\naluminium: R = 2.82e-8 x 100/2.5e-6 = 1.128 ohm</div><h4>પગલું 2 - દળ</h4><div class=\"math\">volume = 2.5e-6 x 100 = 2.5e-4 m3 = 250 cm3\ncopper: 250 x 8.96 = 2240 g\naluminium: 250 x 2.70 = 675 g</div><div class=\"eq\">R: 0.69 ohm copper, 1.13 ohm aluminium;  mass: 2.24 kg against 0.68 kg</div><p>Aluminium નું resistance 1.64 ગણું પણ દળ ફક્ત 0.30 ગણું છે, તેથી એ જ conductance માટે પણ તે અડધું વજન ધરાવે. તેથી overhead lines ACSR - steel core વાળા aluminium conductors - હોય છે, જ્યારે જ્યાં જગ્યા મહત્વની છે તેવા switchgear busbar copper જ રહે.</p><p><b>જવાબ ચકાસો.</b> ગુણોત્તર: 1.128/0.688 = 1.64 = 2.82/1.72, જે resistivity ગુણોત્તર છે, અને 8.96/2.70 = 3.32, જે density ગુણોત્તર છે. આ દાખલાનો દરેક જવાબ એ બે ગુણોત્તરમાંથી એક છે.</p><p><b>સામાન્ય ભૂલ.</b> સરખા દળની જગ્યાએ સરખા માપની resistance સરખાવવી. લાઇન માટે ન્યાયી સરખામણી સરખા conductance અને સરખા span પર થાય, એટલે aluminium નું section મોટું લેવાય - ત્યારે જ દળનો ફાયદો ઉદ્યોગ કહે તે 2:1 થાય.</p>"}}, {"h": {"en": "Specific stiffness of a carbon composite", "gu": "Carbon composite ની specific stiffness"}, "body": {"en": "<h4>Question (7 marks)</h4><p>A carbon-fibre composite contains 60 % by volume of fibre (E = 230 GPa, density 1.8 g/cm3) in an epoxy matrix (E = 3.5 GPa, density 1.2 g/cm3). Find the density, the modulus along the fibre and the specific stiffness, and compare it with steel (E = 200 GPa, density 7.85 g/cm3).</p><h4>Step 1 - density by the rule of mixtures</h4><div class=\"math\">rho_c = f rho_f + (1 - f) rho_m = 0.6 x 1.8 + 0.4 x 1.2\n      = 1.08 + 0.48 = 1.56 g/cm3</div><h4>Step 2 - modulus along the fibre</h4><div class=\"math\">E_c = f E_f + (1 - f) E_m = 0.6 x 230 + 0.4 x 3.5\n    = 138 + 1.4 = 139.4 GPa</div><h4>Step 3 - specific stiffness</h4><div class=\"math\">composite: 139.4/1.56 = 89.4 GPa per g/cm3\nsteel: 200/7.85 = 25.5 GPa per g/cm3\nratio = 89.4/25.5 = 3.5</div><div class=\"eq\">rho = 1.56 g/cm3,  E = 139 GPa,  specific stiffness 3.5 times steel</div><p>The composite is barely stiffer than steel in absolute terms (139 against 200 GPa) but 3.5 times stiffer for the same weight, which is the whole argument for a Formula-style chassis or a wind-turbine blade. The price is cost and a fibre direction that must be designed, not assumed.</p><p><b>Check your answer.</b> The rule of mixtures must lie between the two values: 1.2 < 1.56 < 1.8 for density and 3.5 < 139 < 230 for the modulus. A result outside those bounds means the fractions were added to 1.1 or 0.9.</p><p><b>Common mistake.</b> Using the rule of mixtures across the fibres. Loaded across the fibre direction the modulus falls to a series combination, about 6 GPa for this lay-up, so a composite is highly anisotropic and the direction has to be stated with every value.</p>", "gu": "<h4>પ્રશ્ન (7 marks)</h4><p>Carbon-fibre composite માં volume પ્રમાણે 60 % fibre (E = 230 GPa, density 1.8 g/cm3) અને epoxy matrix (E = 3.5 GPa, density 1.2 g/cm3) છે. Density, fibre દિશામાં modulus અને specific stiffness શોધો, અને steel (E = 200 GPa, density 7.85 g/cm3) સાથે સરખાવો.</p><h4>પગલું 1 - rule of mixtures થી density</h4><div class=\"math\">rho_c = f rho_f + (1 - f) rho_m = 0.6 x 1.8 + 0.4 x 1.2\n      = 1.08 + 0.48 = 1.56 g/cm3</div><h4>પગલું 2 - fibre દિશામાં modulus</h4><div class=\"math\">E_c = f E_f + (1 - f) E_m = 0.6 x 230 + 0.4 x 3.5\n    = 138 + 1.4 = 139.4 GPa</div><h4>પગલું 3 - specific stiffness</h4><div class=\"math\">composite: 139.4/1.56 = 89.4 GPa per g/cm3\nsteel: 200/7.85 = 25.5 GPa per g/cm3\nratio = 89.4/25.5 = 3.5</div><div class=\"eq\">rho = 1.56 g/cm3,  E = 139 GPa,  specific stiffness 3.5 times steel</div><p>Composite સંપૂર્ણ રીતે steel કરતાં ભાગ્યે જ વધુ stiff છે (139 સામે 200 GPa) પણ એ જ વજન માટે 3.5 ગણું stiff છે, જે Formula-style chassis કે wind-turbine blade ની આખી દલીલ છે. કિંમત ખર્ચ અને fibre ની દિશા છે, જે design કરવી પડે, ધારી ન લેવાય.</p><p><b>જવાબ ચકાસો.</b> Rule of mixtures બે મૂલ્યો વચ્ચે જ હોવું જોઈએ: density માટે 1.2 < 1.56 < 1.8 અને modulus માટે 3.5 < 139 < 230. સીમાની બહાર જવાબ આવે તો fractions નો સરવાળો 1.1 કે 0.9 થયો છે.</p><p><b>સામાન્ય ભૂલ.</b> Fibres ની આડી દિશામાં rule of mixtures વાપરવું. Fibre દિશાની આડી load માં modulus series સંયોજન થાય, આ lay-up માટે લગભગ 6 GPa, તેથી composite ખૂબ anisotropic છે અને દરેક મૂલ્ય સાથે દિશા જણાવવી પડે.</p>"}}]}], "diagrams": [{"id": "u1_class", "title": {"en": "Classification of engineering materials", "gu": "ઇજનેરી સામગ્રીનું વર્ગીકરણ"}, "file": "diagrams/u1_class.svg", "caption": {"en": "Four families cover almost every machine part - metals, ceramics, polymers and composites; semiconductors and smart materials are the two modern additions.", "gu": "ચાર કુટુંબ લગભગ દરેક machine part આવરે છે - ધાતુ, ceramics, polymers અને composites; semiconductors અને smart materials તેમાંના બે નવા ઉમેરા છે."}}, {"id": "u1_select", "title": {"en": "Choosing by strength per unit weight", "gu": "વજન દીઠ તાકાત પરથી પસંદગી"}, "file": "diagrams/u1_select.svg", "caption": {"en": "Plot tensile strength against density and the lines of constant strength per unit weight appear: titanium and carbon fibre sit on much steeper lines than steel.", "gu": "Tensile strength સામે density દોરો તો વજન દીઠ તાકાતની રેખાઓ દેખાય: titanium અને carbon fibre steel કરતાં ઘણી તીવ્ર રેખા પર બેસે છે."}}, {"id": "u1_bonds", "title": {"en": "The five kinds of bond", "gu": "બંધનના પાંચ પ્રકાર"}, "file": "diagrams/u1_bonds.svg", "caption": {"en": "Bonds differ only in where the electrons go - transferred, shared, donated by one atom, shared through a hydrogen bridge, or pooled in a metal.", "gu": "બંધનમાં ફરક ફક્ત એટલો છે કે electrons ક્યાં જાય - transferred, shared, એક atom દાન કરે, hydrogen bridge થી shared, કે ધાતુમાં pool થઈ જાય."}}, {"id": "u1_bondenergy", "title": {"en": "Bond strength decides the melting point", "gu": "બંધનની તાકાત ગલનબિંદુ નક્કી કરે"}, "file": "diagrams/u1_bondenergy.svg", "caption": {"en": "The stronger the bond, the more heat it takes to break it and the higher the melting point: 20 kJ/mol for a hydrogen bond against 787 for rock salt.", "gu": "બંધન જેટલું મજબૂત તેટલી તેને તોડવા વધુ ગરમી જોઈએ અને ગલનબિંદુ ઊંચું: hydrogen bond માટે 20 kJ/mol સામે rock salt માટે 787."}}, {"id": "u1_cells", "title": {"en": "BCC, FCC and HCP unit cells", "gu": "BCC, FCC અને HCP unit cells"}, "file": "diagrams/u1_cells.svg", "caption": {"en": "BCC has two atoms per cell and 68 % packing, FCC four and HCP six with 74 % - which is why the close-packed metals are the ductile ones.", "gu": "BCC માં cell દીઠ બે atoms અને 68 % packing, FCC માં ચાર અને HCP માં છ atoms સાથે 74 % - તેથી જ close-packed ધાતુઓ વધુ ductile હોય છે."}}, {"id": "u1_packing", "title": {"en": "Packing fraction of the four structures", "gu": "ચાર રચનાનું packing fraction"}, "file": "diagrams/u1_packing.svg", "caption": {"en": "Simple cubic wastes 48 % of the space, BCC 32 % and the close-packed structures only 26 %; the packing fraction is what sets the density.", "gu": "Simple cubic 48 % જગ્યા વેડફે, BCC 32 % અને close-packed રચના ફક્ત 26 %; packing fraction જ density નક્કી કરે છે."}}, {"id": "u1_stress", "title": {"en": "The tensile test and its properties", "gu": "Tensile test અને તેના ગુણધર્મો"}, "file": "diagrams/u1_stress.svg", "caption": {"en": "A tensile test gives the modulus from the slope, the yield and ultimate strengths from the two peaks, and ductility from how far the specimen stretches first.", "gu": "Tensile test ઢોળાવ પરથી modulus, બે શિખર પરથી yield અને ultimate strength, અને specimen કેટલું ખેંચાયું તેના પરથી ductility આપે છે."}}, {"id": "u1_thermal", "title": {"en": "Thermal and electrical properties", "gu": "Thermal અને electrical ગુણધર્મો"}, "file": "diagrams/u1_thermal.svg", "caption": {"en": "Metals conduct heat and current through the same free electrons: copper conducts eight times better than steel and two thousand times better than rubber.", "gu": "ધાતુઓ એ જ મુક્ત electrons થી ગરમી અને current બંને વહન કરે: copper steel કરતાં આઠ ગણું અને rubber કરતાં બે હજાર ગણું સારું વહન કરે."}}], "equations": [{"title": {"en": "Crystal geometry", "gu": "Crystal ભૂમિતિ"}, "items": [{"name": {"en": "BCC cell edge", "gu": "BCC cell edge"}, "f": "a = 4R/sqrt(3) = 2.309 R", "terms": {"en": "Atoms touch along the body diagonal of the cube.", "gu": "Atoms cube ના body diagonal પર સ્પર્શે છે."}}, {"name": {"en": "FCC cell edge", "gu": "FCC cell edge"}, "f": "a = 2 sqrt(2) R = 2.828 R", "terms": {"en": "Atoms touch along the face diagonal, the close-packed direction.", "gu": "Atoms face diagonal પર સ્પર્શે છે, જે close-packed દિશા છે."}}, {"name": {"en": "HCP ratio", "gu": "HCP ગુણોત્તર"}, "f": "c/a = sqrt(8/3) = 1.633", "terms": {"en": "The ideal ratio for touching spheres; Mg and Zn are near it.", "gu": "સ્પર્શતા ગોળા માટેનો આદર્શ ગુણોત્તર; Mg અને Zn તેની નજીક છે."}}, {"name": {"en": "Packing fraction", "gu": "Packing fraction"}, "f": "APF = n (4/3 pi R^3)/a^3 = 0.68 (BCC), 0.74 (FCC, HCP)", "terms": {"en": "Depends only on the stacking, not on the metal.", "gu": "ફક્ત ગોઠવણી પર આધારે છે, ધાતુ પર નહીં."}}]}, {"title": {"en": "Density and atom count", "gu": "Density અને atoms ની ગણતરી"}, "items": [{"name": {"en": "Atoms per cell", "gu": "cell દીઠ atoms"}, "f": "n = 2 (BCC), 4 (FCC), 6 (HCP)", "terms": {"en": "Count corner atoms as 1/8 and face atoms as 1/2.", "gu": "Corner atoms 1/8 અને face atoms 1/2 ગણો."}}, {"name": {"en": "Density from the cell", "gu": "cell પરથી density"}, "f": "rho = n A/(N_A a^3)", "terms": {"en": "A is the atomic mass in g/mol and a the cell edge in cm.", "gu": "A એ g/mol માં atomic mass અને a એ cm માં cell edge છે."}}, {"name": {"en": "Atoms per unit volume", "gu": "એકમ volume દીઠ atoms"}, "f": "N_v = n/a^3", "terms": {"en": "Used for atoms per mm3 and for the number of interstitial sites.", "gu": "mm3 દીઠ atoms અને interstitial sites ની સંખ્યા માટે વપરાય."}}]}, {"title": {"en": "Mechanical properties", "gu": "Mechanical ગુણધર્મો"}, "items": [{"name": {"en": "Engineering stress", "gu": "Engineering stress"}, "f": "sigma = P/A0", "terms": {"en": "Load divided by the original cross-section, not the current one.", "gu": "Load ભાગ્યું મૂળ cross-section, હાલનું નહીં."}}, {"name": {"en": "Engineering strain", "gu": "Engineering strain"}, "f": "epsilon = dL/L0", "terms": {"en": "Extension divided by the original gauge length.", "gu": "લંબાઈ ભાગ્યું મૂળ gauge length."}}, {"name": {"en": "Hooke's law", "gu": "Hooke's law"}, "f": "sigma = E epsilon,  E = 200 GPa for steel", "terms": {"en": "Holds only in the straight part of the curve.", "gu": "વક્રના ફક્ત સીધા ભાગમાં લાગુ પડે."}}, {"name": {"en": "Ductility", "gu": "Ductility"}, "f": "% elongation = 100 (Lf - L0)/L0;  % RA = 100 (A0 - Af)/A0", "terms": {"en": "Two measures of the same thing: how far it stretched.", "gu": "એક જ બાબતનાં બે માપ: કેટલું ખેંચાયું."}}, {"name": {"en": "Allowable stress", "gu": "Allowable stress"}, "f": "sigma_allow = sigma_yield / FOS", "terms": {"en": "FOS is 2 to 4 for ductile parts, 6 to 10 for brittle ones.", "gu": "Ductile ભાગો માટે FOS 2 થી 4, ભંગુર માટે 6 થી 10."}}]}, {"title": {"en": "Thermal and electrical", "gu": "Thermal અને electrical"}, "items": [{"name": {"en": "Thermal expansion", "gu": "Thermal expansion"}, "f": "dL = alpha L0 dT", "terms": {"en": "Steel 12e-6/K, aluminium 23e-6/K, invar 1.2e-6/K.", "gu": "આંકડા: steel 12e-6/K, aluminium 23e-6/K, invar 1.2e-6/K."}}, {"name": {"en": "Resistance", "gu": "Resistance"}, "f": "R = rho_e L/A", "terms": {"en": "Copper 1.7e-8, aluminium 2.8e-8, iron 1.0e-7 ohm m.", "gu": "આંકડા: copper 1.7e-8, aluminium 2.8e-8, iron 1.0e-7 ohm m."}}, {"name": {"en": "Heat to warm a part", "gu": "ભાગ ગરમ કરવાની ઉષ્મા"}, "f": "Q = m c dT", "terms": {"en": "Steel 490, aluminium 900 J/(kg K).", "gu": "આંકડા: steel 490, aluminium 900 J/(kg K)."}}]}, {"title": {"en": "Selection and mixtures", "gu": "પસંદગી અને મિશ્રણ"}, "items": [{"name": {"en": "Specific strength", "gu": "Specific strength"}, "f": "specific strength = UTS/rho   (kN m/kg when UTS is in MPa)", "terms": {"en": "The design number for anything that moves.", "gu": "હલતી કોઈપણ વસ્તુ માટેનો design આંકડો."}}, {"name": {"en": "Composite density", "gu": "Composite ની density"}, "f": "rho_c = f rho_f + (1 - f) rho_m", "terms": {"en": "Rule of mixtures by volume fraction f of fibre.", "gu": "Fibre ના volume fraction f પ્રમાણે rule of mixtures."}}, {"name": {"en": "Composite modulus", "gu": "Composite નું modulus"}, "f": "E_c = f E_f + (1 - f) E_m", "terms": {"en": "For continuous fibres loaded along their length only.", "gu": "ફક્ત લંબાઈ સાથે load થતા સતત fibres માટે."}}]}], "viva": [{"title": {"en": "Atoms and bonds", "gu": "Atoms અને bonds"}, "items": [{"q": {"en": "Why does a metal conduct electricity while a ceramic does not?", "gu": "ધાતુ current વહન કરે પણ ceramic ન કરે, કેમ?"}, "a": {"en": "Because of where the electrons are. In a metal the outer electrons are shared by the whole crystal and move freely, so a voltage drives a current. In a ceramic the electrons are locked into ionic or covalent bonds and cannot move, so the material is an insulator until the voltage is high enough to break the bond.", "gu": "કારણ electrons ક્યાં છે તે છે. ધાતુમાં બહારના electrons આખા crystal ના હોય અને મુક્ત હલે, તેથી voltage current ચલાવે. Ceramic માં electrons ionic કે covalent bonds માં બંધ હોય અને હલી ન શકે, તેથી bond તોડવા પૂરતું voltage ન આવે ત્યાં સુધી તે અવાહક રહે."}}, {"q": {"en": "Diamond and graphite are both pure carbon. Why is one the hardest material and the other a lubricant?", "gu": "Diamond અને graphite બંને શુદ્ધ carbon છે. એક સૌથી સખત અને બીજો lubricant કેમ?"}, "a": {"en": "The bond is the same (covalent C-C), the arrangement is not. In diamond every carbon is bonded to four others in three dimensions, so nothing can slide. In graphite each carbon is bonded to three others in flat sheets that are held to one another only by weak forces, so the sheets slide easily - which is what a lubricant has to do.", "gu": "Bond એ જ છે (covalent C-C), ગોઠવણી નથી. Diamond માં દરેક carbon ચાર બીજા સાથે ત્રણ આયામોમાં જોડાયેલો છે, તેથી કંઈ સરકી ન શકે. Graphite માં દરેક carbon ત્રણ સાથે સપાટ પાનમાં જોડાયેલો છે અને પાન એકબીજા સાથે ફક્ત નબળા બળથી જોડાય છે, તેથી પાન સહેલાઈથી સરકે - lubricant એ જ કરવાનું હોય છે."}}, {"q": {"en": "Which bond explains the low melting point of polythene?", "gu": "Polythene નું નીચું ગલનબિંદુ કયું બંધન સમજાવે?"}, "a": {"en": "Within the chain the bonds are strong covalent C-C bonds, but between the chains there are only weak van der Waals and hydrogen forces. Melting means separating the chains, not breaking them, so polythene softens near 110 C while the molecule itself is stable to well above 300 C.", "gu": "શૃંખલાની અંદર મજબૂત covalent C-C bonds છે, પણ શૃંખલાઓ વચ્ચે ફક્ત નબળા van der Waals અને hydrogen બળ છે. ગલન એટલે શૃંખલાઓ અલગ થવી, તૂટવી નહીં, તેથી polythene 110 C આસપાસ મૃદુ પડે જ્યારે molecule પોતે 300 C ઉપર પણ ટકે."}}]}, {"title": {"en": "Crystal structure", "gu": "Crystal રચના"}, "items": [{"q": {"en": "Why is FCC iron able to dissolve far more carbon than BCC iron?", "gu": "FCC iron BCC iron કરતાં ઘણું વધુ carbon કેમ ઓગાળે?"}, "a": {"en": "Because of the holes. FCC packs 74 % of the space and leaves larger interstitial holes, which take up to 2 % carbon by weight; BCC packs only 68 % but the holes are smaller and distorted, so it takes about 0.025 %. That difference is the basis of carburising and of the whole heat treatment.", "gu": "કારણ છિદ્રો છે. FCC 74 % જગ્યા ભરે અને મોટા interstitial છિદ્રો રાખે, જે વજનથી 2 % સુધી carbon લે; BCC ફક્ત 68 % ભરે પણ છિદ્રો નાનાં અને વિકૃત હોય, તેથી લગભગ 0.025 % લે. એ ફરક જ carburising અને આખા heat treatment નો પાયો છે."}}, {"q": {"en": "Why do FCC metals such as copper and aluminium bend so easily?", "gu": "Copper અને aluminium જેવી FCC ધાતુઓ સહેલાઈથી વળે, કેમ?"}, "a": {"en": "Close packing gives twelve slip systems on four planes, so a dislocation can move in many directions without breaking a bond. HCP metals have only a few slip systems and BCC fewer than FCC, which is why they are less ductile at room temperature.", "gu": "Close packing ચાર planes પર બાર slip systems આપે, તેથી dislocation bond તોડ્યા વગર ઘણી દિશામાં હલી શકે. HCP ધાતુઓમાં થોડા જ slip systems હોય અને BCC માં FCC કરતાં ઓછા, તેથી તે room temperature પર ઓછી ductile હોય."}}, {"q": {"en": "A density calculated from the unit cell is 0.3 % higher than the handbook value. Explain.", "gu": "Unit cell પરથી ગણેલી density handbook મૂલ્ય કરતાં 0.3 % વધારે છે. સમજાવો."}, "a": {"en": "The cell model assumes a perfect crystal at zero kelvin with no defects. A real metal has vacancies, dislocations and grain boundaries, and it is slightly expanded at room temperature, so the measured density is a little lower. An agreement within a few tenths of a per cent confirms the model.", "gu": "Cell model શૂન્ય kelvin પર દોષરહિત crystal ધારે છે. સાચી ધાતુમાં vacancies, dislocations અને grain boundaries હોય, અને room temperature પર તે થોડી પ્રસરેલી હોય, તેથી માપેલી density થોડી ઓછી આવે. થોડા દશાંશ ટકાની સરખામણી model સાચું છે તે સાબિત કરે."}}]}, {"title": {"en": "Properties and testing", "gu": "ગુણધર્મો અને પરીક્ષણ"}, "items": [{"q": {"en": "What is the difference between strength and toughness?", "gu": "Strength અને toughness માં શું ફરક છે?"}, "a": {"en": "Strength is how large a stress the material can take; toughness is how much energy it absorbs before it breaks. Glass is strong in compression and weak in toughness, mild steel is less strong than hardened steel but far tougher, which is why springs are not made of the hardest steel.", "gu": "Strength એટલે સામગ્રી કેટલો stress સહી શકે; toughness એટલે તૂટતા પહેલા કેટલી ઊર્જા શોષે. કાચ compression માં મજબૂત પણ toughness માં નબળો છે, mild steel hardened steel કરતાં ઓછું મજબૂત પણ ઘણું tough છે, તેથી springs સૌથી સખત steel ના બનતા નથી."}}, {"q": {"en": "Why does the test specimen have a standard shape and gauge length?", "gu": "Test specimen નો આકાર અને gauge length પ્રમાણભૂત કેમ હોય?"}, "a": {"en": "So that results can be compared. A thin specimen necks earlier and a short gauge length hides the localised elongation; the standard 50 mm gauge and the specified shoulder radius make the elongation and the UTS reproducible between laboratories.", "gu": "જેથી પરિણામો સરખાવી શકાય. પાતળો specimen વહેલો necked થાય અને ટૂંકી gauge length સ્થાનિક લંબાઈ છુપાવે; પ્રમાણભૂત 50 mm gauge અને નિર્દિષ્ટ shoulder radius elongation તથા UTS ને પ્રયોગશાળાઓ વચ્ચે પુનરાવર્તનીય બનાવે."}}, {"q": {"en": "Why is hardness measured on a polished surface?", "gu": "Hardness પોલિશ કરેલી સપાટી પર કેમ મપાય?"}, "a": {"en": "Because hardness is read from the size of an indentation a few tenths of a millimetre across, and a rough or decarburised surface changes that size. The specimen is polished so that the indenter meets the true material and the diameter can be measured accurately.", "gu": "કારણ કે hardness થોડા દશાંશ મિલીમીટરના indentation ના માપ પરથી વંચાય, અને ખરબચડી કે decarburised સપાટી એ માપ બદલે. Indenter સાચી સામગ્રીને મળે અને વ્યાસ ચોક્કસ મપાય તે માટે specimen પોલિશ કરાય."}}]}, {"title": {"en": "Choosing a material", "gu": "સામગ્રીની પસંદગી"}, "items": [{"q": {"en": "Why is the specific strength used in transport and not the strength?", "gu": "વાહનમાં strength નહીં, specific strength કેમ વપરાય?"}, "a": {"en": "Because every kilogram saved also saves the fuel needed to move it and the force needed to accelerate it. A material with a third of the strength but a fifth of the density carries the same load at less weight, so strength per kilogram decides the choice.", "gu": "કારણ કે બચેલો દરેક કિલોગ્રામ તેને ખસેડવાનું fuel અને accelerate કરવાનું બળ પણ બચાવે. ત્રીજા ભાગની strength પણ પાંચમા ભાગની density વાળી સામગ્રી એ જ load ઓછા વજનમાં ઉપાડે, તેથી કિલોગ્રામ દીઠ strength પસંદગી નક્કી કરે."}}, {"q": {"en": "Give one application where a low thermal conductivity is wanted and one where a high one is wanted.", "gu": "એક ઉપયોગ કહો જ્યાં નીચી thermal conductivity જોઈએ અને એક જ્યાં ઊંચી જોઈએ."}, "a": {"en": "Low: the handle of a welding torch or a furnace door, where heat must not reach the hand, and a refrigerator body, where heat must not leak in. High: the cylinder head of an engine or the pot of a cooking vessel, where heat must be carried away or spread quickly.", "gu": "નીચી: welding torch નું હેન્ડલ કે furnace ના દરવાજા, જ્યાં ગરમી હાથ સુધી ન પહોંચવી જોઈએ, અને ફ્રિજનું શરીર, જ્યાં ગરમી અંદર ન ઘૂસવી જોઈએ. ઊંચી: engine નું cylinder head કે રાંધવાના પાત્રનું તળિયું, જ્યાં ગરમી ઝડપથી દૂર થવી કે ફેલાવવી જોઈએ."}}, {"q": {"en": "Why can the same part be made from four different families of material?", "gu": "એક જ ભાગ ચાર જુદા કુટુંબની સામગ્રીમાંથી કેમ બની શકે?"}, "a": {"en": "Because the drawing fixes only the shape and the load, not the material. A gear can be cut from steel for strength, sintered from ceramic for wear at high temperature, moulded from nylon for quiet running, or laid up from carbon composite for low inertia - and each answer is right for its own duty.", "gu": "કારણ કે દોરડું ફક્ત આકાર અને load નક્કી કરે, સામગ્રી નહીં. ગિયર તાકાત માટે steel માંથી કાપી શકાય, ઊંચા temperature પર ઘસારા માટે ceramic થી sinter કરી શકાય, શાંત ચાલવા માટે nylon માંથી mould કરી શકાય, કે ઓછી inertia માટે carbon composite થી બનાવી શકાય - અને દરેક જવાબ પોતાના કામ માટે સાચો છે."}}]}], "exam_questions": [{"q": {"en": "Iron at room temperature is BCC with a cell edge of 0.2866 nm and an atomic mass of 55.85. Find the atomic radius, the number of atoms in one cubic millimetre and the packing fraction, and say how far the calculated density is from the handbook value of 7.87 g/cm3.", "gu": "Room temperature પર iron BCC છે, cell edge 0.2866 nm અને atomic mass 55.85 છે. Atomic radius, એક ઘન મિલીમીટરમાં atoms ની સંખ્યા અને packing fraction શોધો, અને ગણેલી density handbook ના 7.87 g/cm3 થી કેટલી દૂર છે તે કહો."}, "marks": 6}, {"q": {"en": "Copper is FCC with a cell edge of 0.3615 nm and an atomic mass of 63.55. Calculate the density, the atomic radius and the number of atoms per cubic centimetre, and compare the density with the handbook value 8.96 g/cm3.", "gu": "Copper FCC છે, cell edge 0.3615 nm અને atomic mass 63.55 છે. Density, atomic radius અને ઘન સેન્ટીમીટર દીઠ atoms ગણો, અને density ને handbook ના 8.96 g/cm3 સાથે સરખાવો."}, "marks": 7}, {"q": {"en": "A 12.5 mm diameter, 50 mm gauge length specimen of steel is tested. It yields at 40 kN, reaches a maximum load of 62 kN and breaks at a gauge length of 62.5 mm with a diameter at the neck of 9.5 mm. Find the yield strength, the ultimate tensile strength, the percentage elongation and the percentage reduction in area.", "gu": "12.5 mm વ્યાસ અને 50 mm gauge length વાળો steel specimen test કરાય. 40 kN પર yield થાય, 62 kN પર મહત્તમ load આવે, અને 62.5 mm gauge length તથા neck પર 9.5 mm વ્યાસ સાથે તૂટે. Yield strength, ultimate tensile strength, ટકાવારી elongation અને ટકાવારી reduction in area શોધો."}, "marks": 8}, {"q": {"en": "A steel rail is 20 m long at 20 C. The rail may reach 55 C in summer. Taking the expansion coefficient of steel as 11.7e-6 per K, find the expansion and the gap to be left between rails. If the gap were zero, estimate the thermal stress with E = 200 GPa.", "gu": "Steel રેલ 20 C પર 20 m લાંબી છે. ઉનાળામાં 55 C સુધી પહોંચી શકે. Steel નો expansion coefficient 11.7e-6 પ્રતિ K લઈ, પ્રસરણ અને રેલ વચ્ચે રાખવાનું અંતર શોધો. અંતર શૂન્ય હોય તો E = 200 GPa સાથે thermal stress અંદાજો."}, "marks": 7}, {"q": {"en": "A 100 m run of conductor has a cross-section of 2.5 mm2. Find the resistance with copper (rho = 1.72e-8 ohm m) and with aluminium (rho = 2.82e-8 ohm m), and compare the masses (densities 8.96 and 2.70 g/cm3). State which you would use for an overhead line and why.", "gu": "100 m લાંબા conductor નો cross-section 2.5 mm2 છે. Copper (rho = 1.72e-8 ohm m) અને aluminium (rho = 2.82e-8 ohm m) સાથે resistance શોધો, અને દળની સરખામણી કરો (density 8.96 અને 2.70 g/cm3). Overhead line માટે કયું વાપરશો અને કેમ તે કહો."}, "marks": 6}, {"q": {"en": "A carbon-fibre composite contains 60 % by volume of fibre (E = 230 GPa, density 1.8 g/cm3) in an epoxy matrix (E = 3.5 GPa, density 1.2 g/cm3). Find the density, the modulus along the fibre and the specific stiffness, and compare it with steel (E = 200 GPa, density 7.85 g/cm3).", "gu": "Carbon-fibre composite માં volume પ્રમાણે 60 % fibre (E = 230 GPa, density 1.8 g/cm3) અને epoxy matrix (E = 3.5 GPa, density 1.2 g/cm3) છે. Density, fibre દિશામાં modulus અને specific stiffness શોધો, અને steel (E = 200 GPa, density 7.85 g/cm3) સાથે સરખાવો."}, "marks": 7}], "learning_outcomes": [{"en": "Compare appropriate material for manufacturing various components.", "gu": "જુદા જુદા components બનાવવા માટે યોગ્ય સામગ્રીની સરખામણી કરવી."}], "course_outcomes": ["CO1"], "practical_numbers": [1, 2, 3], "content_kind": "theory", "lesson_count": 15, "answered_practice_count": 6, "assessment_note": {"en": "Official course: theory ESE 70 + PA 30 and practical PA 20 + ESE 30 = 150 marks, 4 credits (3 lecture + 2 practical), 45 teaching hours. This unit carries 14 % weightage, 6 of the printed unit hours and 10 of the 70 theory marks. The six numericals of section 1.5 are original revision problems with suggested marks, not GTU papers.", "gu": "અધિકૃત course: theory ESE 70 + PA 30 અને practical PA 20 + ESE 30 = 150 marks, 4 credits (3 lecture + 2 practical), 45 teaching hours. આ unit નું weightage 14 %, છપાયેલા unit hours માંથી 6 અને 70 theory marks માંથી 10 છે. વિભાગ 1.5 ના છ દાખલા revision માટેના મૂળ પ્રશ્નો છે, GTU પેપર નહીં."}, "question_provenance": "Original solved numericals written for revision; not official past papers", "question_marks_are_suggested": true, "sources": [{"title": "GTU DI01000181 Engineering Materials Science syllabus (uploaded PDF, w.e.f. 2024-25)", "url": "https://syllabus.gtu.ac.in/"}, {"title": "G. B. S. Narang - Materials Science, Khanna Publishers (bonding, crystal structure, properties)", "url": "https://www.khannapublishers.in/"}, {"title": "V. Raghavan - Materials Science and Engineering, Prentice Hall India (crystal geometry, unit cells, density calculations)", "url": "https://www.pearson.com/"}, {"title": "Substech open materials science reference - crystal structures and the iron-carbon diagram", "url": "https://www.substech.com/dokuwiki/doku.php?id=iron_carbon_phase_diagram"}, {"title": "NPTEL / virtual labs on materials science and metallography", "url": "https://vlab.co.in/"}]};
