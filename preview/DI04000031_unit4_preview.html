<script>
const U = {"subject": "DI04000031", "unit": 4, "format": "notes", "title": {"en": "Graph Databases: Neo4j"}, "hours": 12, "weightage": 20, "tabs": ["notes", "programs", "diagrams", "syntax", "viva"], "intro_text": {"en": "Application-oriented property graphs, Desktop/Aura and Browser setup guidance, basic Cypher and graph CRUD. Includes 16 real Neo4j programs, verified synthetic graph import and transparent recommendation/shared-device pattern examples for Practicals 7–8. Graph algorithms are examples only, not implementations; the reference is a private Community server, not a performed Desktop/Aura GUI setup."}, "notes": [{"title": {"en": "1. Graph Foundations, Scope and Modeling"}, "items": [{"h": {"en": "1.1 Official scope, practical assessment and honest evidence"}, "body": {"en": "\n<p><b>Unit 4: Graph Databases — Neo4j, 12 hours / 20% content weightage.</b> CO4 is “Utilize Neo4j to solve relationship-based problems with graph queries.” The emphasis is application-oriented graph concepts, installation, basic Cypher and graph operations. There are no mathematical graph proofs or graph-algorithm implementations in this unit.</p>\n<p><b>Practical 7</b> asks for Neo4j Desktop or Aura setup and exploration of nodes, relationships and properties in Browser. <b>Practical 8</b> asks for node/relationship creation and MATCH, WHERE, RETURN queries with friend-recommendation or fraud-use-case demonstrations. The guided Desktop/Aura/Browser procedure and the executed reference are not the same evidence.</p>\n<p>The reference actually runs a private authenticated <b>Neo4j Community 5.26.32</b> server with <b>Cypher Shell 5.26.32</b>, official Python driver <b>5.28.8</b>, <b>Temurin Java 21.0.13+9</b> and Python 3.13.16 on Debian 13 x86_64. All 16 full programs are sent to the real database. The reference does <b>not</b> claim Desktop installation, Aura provisioning, Browser GUI automation, clustering, a GDS installation, model training or a performance benchmark.</p>\n<p>This is a practical-only course: theory ESE/PA are 0; practical PA 20 + ESE 30 = 50 for the <b>course</b>. Twenty percent is unit content weightage, not an invented theory-paper allocation or per-question mark scheme. Use the answered tasks and viva to prepare your actual journal and demonstration.</p>"}, "programs": ["ns4p01"]}, {"h": {"en": "1.2 Property graph: nodes, labels, relationships and properties"}, "body": {"en": "\n<p>A <b>node</b> represents an entity such as a person, film, account or device. A node can have zero, one or several <b>labels</b>, such as Person and Student. Labels classify nodes; a label is not an automatic primary-key or required-property declaration.</p>\n<p>A <b>relationship</b> connects a source node to a target node, has exactly one type such as KNOWS or LIKES, and always has a stored direction. The endpoints may even be the same node. Multiple relationships between the same pair can exist when the model permits them.</p>\n<p>Both nodes and relationships can have <b>properties</b>, for example a person’s name/age or a KNOWS relationship’s since year. The property graph is not a drawing format: it is a data model supporting stored entities and connection queries.</p><table><tr><th>Component</th><th>Reference meaning</th></tr><tr><td>Person node P01</td><td>Asha, age 20, city Surat</td></tr><tr><td>Person/Student labels</td><td>Several classifications can describe one node</td></tr><tr><td>P01 -[KNOWS]-&gt; P02</td><td>One stored directed typed relationship</td></tr><tr><td>since: 2024</td><td>A property of that relationship, not another endpoint</td></tr><tr><td>person_id: P01</td><td>Application business ID; enforce intended uniqueness explicitly</td></tr></table>\n<p>Default schema flexibility does not remove the need for consistent naming, validation, identity rules and access controls. Keep application IDs stable; do not assume an internal node identifier is a permanent external business key.</p>"}, "diagram": "ns4_property", "programs": ["ns4p02", "ns4p03"]}, {"h": {"en": "1.3 Direction, paths, hops and application-oriented graph theory"}, "body": {"en": "\n<p>A <b>path</b> alternates nodes and relationships. A traversal follows relationships according to the pattern and conditions. A <b>hop</b> is one relationship step; Asha → Ravi → Meera is two hops. A node’s degree is about incident relationships, not automatically popularity, trust or a prediction.</p>\n<pre class=\"c\">(a)-[:KNOWS]-&gt;(b)  // outgoing from a\n(a)&lt;-[:KNOWS]-(b)  // incoming to a\n(a)-[:KNOWS]-(b)   // read either orientation\n// Parentheses = nodes; brackets = relationship.</pre>\n<p>The first two patterns respect the selected direction; the third reads either orientation while leaving storage unchanged. In the fixture, Asha has outgoing KNOWS links to Ravi and Neha. Ravi’s incoming link is from Asha; ignoring direction finds Asha, Meera and Imran.</p>\n<p>Decide the business meaning. FOLLOWS may be intentionally asymmetric. “KNOWS” in this tiny fixture is stored once and read without direction for a connection-suggestion example; that is not proof of reciprocal consent or friendship quality. An undirected query is not a command to create reverse duplicate relationships.</p>\n<p>Bound the question and path length. Two hops through a high-degree node can still produce many candidates. A graph sketch or short query does not prove asymptotic/runtime performance, and this unit does not implement BFS, DFS, PageRank or community-detection procedures.</p>"}, "diagram": "ns4_direction", "programs": ["ns4p05", "ns4p13"]}, {"h": {"en": "1.4 Design a graph from relationship questions, not from circles alone"}, "body": {"en": "\n<p>Start with the questions: Who is connected to Asha? What do known people like that she has not liked? Which account pairs share a device? Then choose entities, relationship types/direction and properties that make those paths meaningful.</p>\n<ol><li>Give independently identifiable entities appropriate node labels and stable business IDs.</li><li>Name relationship types by meaning: Person KNOWS Person, Person LIKES Movie, Account USES_DEVICE Device.</li><li>Place an attribute on its owner: birth/age on a person; since year on a connection.</li><li>Choose a uniqueness rule and decide how updates/deletions affect relationships.</li><li>Use a selective entry condition and bounded traversal; review access, retention and bias.</li></ol>\n<p>Do not turn every scalar into a node automatically. City may be a Person property for simple filtering; a City node with LIVES_IN relationships can be justified if city entities and their connections matter. Avoid both an enormous opaque property blob and meaningless relationship proliferation.</p>\n<p>Relational databases can also store and query relationships. A graph is attractive when connection paths are central; it is not a universal replacement for stable tables, transactional ledgers or ordinary reporting. Evaluate constraints, data volume, query patterns, operational cost and actual measured behaviour.</p>"}, "programs": ["ns4p03", "ns4p14"]}]}, {"title": {"en": "2. Installation, Desktop/Aura and the Browser Workbench"}, "items": [{"h": {"en": "2.1 Practical 7 setup: choose Desktop or Aura deliberately"}, "body": {"en": "\n<p><b>Desktop route:</b> check the official OS requirements and current security notices, download from the Neo4j deployment center, install the application, create a local database instance/project as supported by that Desktop version, set a private password, choose a compatible database version and start it. Desktop is a development/management application; its included Developer-license edition is not the same thing as Community Server or an unrestricted production license.</p>\n<p><b>Aura route:</b> use your own authorized account in the Aura console, choose a suitable <b>AuraDB</b> learning instance/tier, check any billing/limits before creating resources, save the generated credentials privately and wait for the instance to be ready. Use the service-provided encrypted connection URI. Do not create paid resources, activate algorithm services or share database credentials merely to follow a note.</p>\n<p>Record the actual deployment, edition, server version, connection URI without a password, database name and successful write/read. UI labels and availability change; follow the linked official instructions for your release. This reference has <b>not</b> installed Desktop or provisioned Aura, and its server output must not be submitted as if it were your Browser/desktop screenshot evidence.</p>\n<p><b>Reference server alternative:</b> a checksum-verified official Community 5.26.32 tarball and Temurin 21 runtime run on loopback only. Authentication is enabled and a random private initial password is set before launch. A tiny heap/page cache is a constrained teaching choice, not recommended production sizing. The GTU resource list recommends an 8 GB learning computer. Debian 13 was actually used here; that observation is not a claim of vendor certification for an OS absent from the versioned support matrix.</p>"}, "diagram": "ns4_setup"}, {"h": {"en": "2.2 Browser exploration: connection, graph view and table view"}, "body": {"en": "\n<p>Open Browser/Query from your own Desktop/Aura instance, or the bundled Browser address of your own local server. For an ordinary local installation, the usual Browser URL is <b>http://localhost:7474/browser</b> and Bolt URI <b>bolt://localhost:7687</b>. Those addresses refer to <b>your computer</b>, not this published notes app or a remote workspace. Check the instance’s actual ports and encryption settings.</p>\n<ol><li>Choose the matching connection scheme, supply your authorized username/password and select the intended database.</li><li>Run RETURN 1 and the component query; inspect the reported server/edition rather than just an application version.</li><li>In an empty, authorized disposable learning database, create a small graph with a unique practice label.</li><li>Return nodes/relationships for graph visualization; select elements to inspect labels, properties, type and arrow direction.</li><li>Return scalar columns for table-style observations, and compare the results with the model.</li><li>Record screenshots/observations from your own actual interface and remove only owned practice data.</li></ol>\n<pre class=\"c\">CREATE (a:PracticePerson {person_id:'P01',name:'Asha'}),\n       (b:PracticePerson {person_id:'P02',name:'Ravi'}),\n       (a)-[:KNOWS {since:2024}]-&gt;(b);</pre>\n<pre class=\"c\">MATCH (a:PracticePerson)-[r:KNOWS]-&gt;(b:PracticePerson)\nRETURN a,r,b;</pre>\n<pre class=\"c\">MATCH (a:PracticePerson)-[r:KNOWS]-&gt;(b:PracticePerson)\nRETURN a.name AS source,type(r) AS relation,\n       b.name AS target,r.since AS since;</pre>\n<p><b>Important:</b> RETURN a,r,b supplies graph entities; RETURN a.name,b.name supplies values. A scalar result appearing as a table is not a broken database or missing relationships. Browser is a client, not the database engine. No Browser GUI test or fabricated screenshot is claimed by the reference.</p>\n<p>The bundled local Browser may use an unencrypted local connection in this private lab. For remote/Aura connections, retain the supported TLS scheme/certificate verification; do not bypass certificate errors or expose a default-password service publicly.</p>"}, "diagram": "ns4_browser", "programs": ["ns4p01", "ns4p03"]}, {"h": {"en": "2.3 Separate tools, verify a stored round-trip and protect access"}, "body": {"en": "\n<pre class=\"c\">CALL dbms.components() YIELD name,versions,edition\nRETURN name,versions,edition;\nRETURN 1 AS connected;</pre>\n<pre class=\"c\"># On YOUR computer; use its actual connection settings.\nexport NEO4J_URI=bolt://127.0.0.1:7687\nbin/cypher-shell --address \"$NEO4J_URI\" --username neo4j\n# Enter YOUR password at the hidden prompt, not in shared notes.</pre>\n<p><b>Neo4j Server</b> stores the graph. <b>Desktop</b> manages local development instances/tools. <b>AuraDB</b> is a managed database service. <b>Browser</b> is an interactive query/visualization client. <b>Cypher Shell</b> is a command-line client; the <b>official Python driver</b> is an application client. They are not interchangeable installation/edition claims.</p>\n<p>The reference really observes Server/Community and Cypher Shell <b>5.26.32</b>, Java <b>21.0.13+9</b> and Python driver <b>5.28.8</b>. It uses Bolt <b>127.0.0.1:7688</b> and local HTTP <b>127.0.0.1:7475</b>, not the usual default ports. These exact patch versions are reference evidence, not a timeless latest-release guarantee. Neo4j 5.26 LTS and newer calendar-version releases coexist; match the documentation/Cypher language version to your server.</p>\n<p>Java 17/21 are supported by the versioned 5.26 requirements; this lab uses Java 21. Desktop manages its own compatible runtime. Use platform instructions rather than copying Linux paths to Windows or assuming that a different default Java is sufficient.</p>\n<p>Passwords belong in a protected manager/private environment or a hidden client prompt, never a public URI, source file, screenshot or submission. Keep database and management interfaces private. Default-password/anonymous rejection and a successful committed write/read are stronger evidence than a version command alone; they do not by themselves establish production TLS, backup, authorization design or security hardening.</p>"}, "programs": ["ns4p01"]}]}, {"title": {"en": "3. Basic Cypher and Graph CRUD"}, "items": [{"h": {"en": "3.1 CREATE, labels, properties and values that can be stored"}, "body": {"en": "\n<pre class=\"c\">CREATE (:PracticePerson:Student {\n  person_id:'P01',name:'Asha',age:20,active:true,\n  skills:['Python','Cypher'],joined:date('2026-10-29')\n});</pre>\n<p>CREATE makes a new graph element; repeated CREATE can produce duplicates unless a relevant constraint prevents them. The example uses two labels on one node, not two copies of Asha. Scalar strings, numbers, booleans, temporal values and suitable homogeneous property arrays are supported.</p>\n<p>A query can construct a map or receive a list of maps as parameters. That does <b>not</b> mean a nested map can be stored as a property value: CREATE (:Bad {payload:{nested:1}}) is actually rejected with a server TypeError in program 16. Choose properties or related nodes for structured graph data.</p>\n<p>Absent properties evaluate as null. Setting a property to null removes it; null is not stored as an ordinary property value. A label does not make every node have the same fields/types. This flexible model differs from Cassandra’s explicit table columns and fixed primary-key design.</p>\n<p>Use consistent business IDs and property naming, and deliberately add appropriate identity constraints. A normal node CREATE is not an INSERT upsert; ordinary MATCH is a read/bind operation, while MERGE has separate complete-pattern semantics.</p>"}, "programs": ["ns4p02", "ns4p03", "ns4p16"]}, {"h": {"en": "3.2 MATCH → WHERE → RETURN: pattern, filter and projection"}, "body": {"en": "\n<pre class=\"c\">MATCH (p:Person)\nWHERE p.city='Surat' AND p.age&gt;=20\nRETURN p.person_id AS id,p.name AS name,p.age AS age\nORDER BY id;</pre>\n<p>Parentheses describe nodes, colon introduces a label/type, square brackets describe a relationship, braces hold properties, and a variable names a matched element. Variables such as p are local to the query/pipeline; a stored node is not literally named “p.”</p>\n<p>MATCH binds the requested graph pattern. WHERE applies conditions such as equality, comparisons, IN, AND or OR. RETURN selects entities or expressions and aliases columns. With the six-person fixture, Surat and age at least 20 gives <b>P01 Asha 20</b> and <b>P05 Imran 20</b>. Ages 19/23 select Neha/Dev; Bharuch or age greater than 22 selects Ravi/Dev.</p>\n<p>p.age='20' does not equal integer 20 in the demonstrated equality filter; it returns no rows rather than silently converting the string. Missing P99 is an empty result, not automatically an error. Use parameters for application-supplied values.</p>\n<p>The arrows/pattern matter as much as the properties. Avoid accidentally matching unrelated independent variables and forming a Cartesian product. A syntactically valid query can still answer the wrong business question.</p>"}, "diagram": "ns4_query", "programs": ["ns4p04", "ns4p05"]}, {"h": {"en": "3.3 Stable ordering, limiting, DISTINCT and aggregation"}, "body": {"en": "\n<pre class=\"c\">MATCH (p:Person)\nRETURN p.person_id AS id,p.name AS name,p.age AS age\nORDER BY age DESC,id ASC LIMIT 3;\n\nMATCH (p:Person)\nRETURN p.city AS city,count(p) AS people ORDER BY city;</pre>\n<p>The oldest-three query returns <b>Dev 23, Meera 22, Ravi 21</b>. Add a stable ID tie-breaker when primary sort values may tie. Without ORDER BY, do not promise the same row order across plans, data or versions. LIMIT is useful for small displays but is not a guarantee that little traversal work occurred.</p>\n<p>DISTINCT removes duplicate returned values/tuples, not necessarily duplicate stored nodes or relationships. Different paths can reach the same recommendation candidate. Decide whether your question counts paths, relationships or distinct entities.</p>\n<p>Grouping by city gives <b>Surat 3</b> and <b>Bharuch/Rajkot/Vadodara 1 each</b>. count(*) counts rows; count(expression) ignores null expressions. A WITH clause can carry selected variables/aggregates to a later part of the query, and variables not carried forward are no longer available there.</p>\n<p>These are tiny-query observations, not graph-wide analytic performance evidence. Query-specific indexes can help entry lookups, but high-degree expansion and large result sets still need a workload-appropriate design.</p>"}, "programs": ["ns4p06", "ns4p10", "ns4p13"]}, {"h": {"en": "3.4 CREATE versus MATCH versus MERGE"}, "body": {"en": "\n<pre class=\"c\">MERGE (p:Person {person_id:'P09'})\nON CREATE SET p.name='Jai',p.visits=1\nON MATCH SET p.visits=p.visits+1\nRETURN p.person_id,p.name,p.visits;</pre>\n<p>On a new P09, the first MERGE creates Jai with visits 1; the second finds that complete ID pattern and changes visits to 2. The read-back counts one business node.</p><table><tr><th>Clause/approach</th><th>Meaning and caution</th></tr><tr><td>CREATE</td><td>Create a new element/pattern; repeated data can duplicate without constraints</td></tr><tr><td>MATCH</td><td>Bind existing patterns; no match produces no row and no automatic creation</td></tr><tr><td>MERGE</td><td>Match the complete specified pattern, otherwise create it</td></tr><tr><td>ON CREATE / ON MATCH</td><td>Apply selected SET actions on the corresponding MERGE branch</td></tr><tr><td>Business-ID uniqueness</td><td>An explicit schema rule, not an assumption from a Person label</td></tr></table>\n<p>Do not put every changeable field into an identity MERGE pattern. Changing name/city can mean the whole pattern no longer matches and a new node is attempted. Match/merge the intended stable identity, then SET changeable values. A null identifying property is not allowed in the demonstrated MERGE.</p>\n<p>MERGE alone is not a universal concurrent-uniqueness guarantee. Use the appropriate constraint for identity and consider transaction/concurrency requirements. This simple sequential example does not benchmark races or implement an enterprise transaction workflow.</p>"}, "diagram": "ns4_merge", "programs": ["ns4p07", "ns4p11", "ns4p16"]}, {"h": {"en": "3.5 SET, REMOVE, DELETE and destructive scope"}, "body": {"en": "\n<pre class=\"c\">MATCH (p:Person {person_id:'P02'})\nSET p.city='Surat',p.age=22;\nMATCH (p:Person {person_id:'P02'}) REMOVE p.city;\nMATCH (p:Person {person_id:'P02'}) SET p:Graduate;\nMATCH (p:Person {person_id:'P02'}) REMOVE p:Graduate;</pre>\n<p>SET updates properties or adds a label. REMOVE can remove a property or a label while preserving the node. An absent city reads as null; the other age/name properties remain. SET n = map replaces all properties; SET n += map changes the supplied properties. Labels are not property-map entries.</p>\n<p>Unlike Cassandra’s ordinary UPDATE, MATCH plus SET for absent P99 creates nothing. Six people remain in the fixture. Select the intended graph entities first and inspect the match before changing or deleting them.</p>\n<pre class=\"c\">MATCH (a:PracticePerson {person_id:'P01'})\n      -[r:KNOWS]-&gt;(:PracticePerson {person_id:'P02'})\nDELETE r;\n// An isolated node can be deleted without DETACH.\nMATCH (p:PracticePerson {person_id:'P01'}) DELETE p;\n// Preview the selected owned node before destructive DETACH.\nMATCH (p:PracticePerson {person_id:'P02'}) DETACH DELETE p;</pre>\n<p>A connected node cannot be deleted by ordinary DELETE while leaving incident relationships behind: program 9 receives a genuine ConstraintValidationFailed rejection. DELETE r removes the selected relationship but retains its endpoints. DETACH DELETE removes the selected node <b>and all its incident relationships</b>; other endpoints remain unless separately selected.</p>\n<p>Never copy a whole-database delete into a shared/production graph. The provided complete files claim and clean only an isolated owned scope. Deleting visible graph records does not imply immediate physical byte erasure, undo availability or removal of all schema objects.</p>"}, "diagram": "ns4_delete", "programs": ["ns4p08", "ns4p09"]}]}, {"title": {"en": "4. Nulls, Identity, Safe Input and Fixture Import"}, "items": [{"h": {"en": "4.1 OPTIONAL MATCH: preserve unmatched entities deliberately"}, "body": {"en": "\n<pre class=\"c\">MATCH (p:Person)\nOPTIONAL MATCH (p)-[:MENTORS]-&gt;(mentee:Person)\nRETURN p.person_id AS id,mentee.name AS mentee\nORDER BY id;</pre>\n<p>After MATCH identifies each person, OPTIONAL MATCH tries the outgoing MENTORS pattern. If that whole optional pattern cannot be matched, the optional variable is null rather than removing the existing person row.</p>\n<p>Only Asha has a stored outgoing mentor relationship, to Ravi. The fixture therefore returns <b>P01 → Ravi</b> and <b>P02–P06 → null</b>. There are <b>six rows</b> but <b>one non-null mentee</b>: count(*) and count(mentee) answer different questions.</p>\n<p>WHERE attached to an OPTIONAL MATCH is part of that optional pattern’s matching conditions. By contrast, a later WITH p,mentee WHERE mentee IS NOT NULL intentionally removes the unmatched rows. The demonstrated later filter leaves Asha/Ravi only.</p>\n<p>Use IS NULL/IS NOT NULL for null tests rather than treating null like an ordinary equality value. Optional patterns are useful for profiles with missing relationships, but are not automatic proof that a missing connection means a negative real-world fact.</p>"}, "diagram": "ns4_optional", "programs": ["ns4p10"]}, {"h": {"en": "4.2 Business identity, scoped uniqueness and statement rollback"}, "body": {"en": "\n<pre class=\"c\">CREATE CONSTRAINT practice_person_id\nFOR (p:PracticePerson) REQUIRE p.person_id IS UNIQUE;\nSHOW CONSTRAINTS YIELD name,type,properties;\n// Drop ONLY a constraint that you created/own.\nDROP CONSTRAINT practice_person_id;</pre>\n<p>A Person label does not automatically make name or person_id unique. A uniqueness constraint on the chosen property/label can prevent conflicting IDs and has an index-backed implementation. The reference business constraint is scoped to its own disposable label rather than changing every Person in a shared database.</p>\n<p>Program 11 observes the constraint and its <b>ONLINE</b> backing index. One write statement creates transient P98 then attempts duplicate P01; the server rejects the duplicate and <b>P98 is absent afterward</b>. That is evidence of rollback of that single implicit transaction. A later independent statement still works.</p>\n<p>Uniqueness alone permits a node without person_id; the example creates “No ID” and reads null for the absent property. Required-property, key and type constraints have edition/version boundaries; the basic Community uniqueness example does not claim to implement Enterprise-only policies.</p>\n<p>The runner uses one separate newly created named <b>ownership constraint</b> as an atomic namespace claim, then a marker node. A pre-existing name/scope is refused. Cleanup ownership begins only after CREATE succeeds; IF NOT EXISTS is not used to pretend an existing constraint belongs to this run. Only captured owned nodes/schema are removed. This is a guard for trusted prepared files, not a sandbox/parser for arbitrary untrusted Cypher.</p>\n<p>Each runner statement is an auto-commit transaction. The entire multi-statement program is <b>not</b> one atomic transaction; a later failure does not magically undo earlier commits. Owned finally cleanup is a lab safeguard, not an application transaction or backup strategy.</p>"}, "diagram": "ns4_identity", "programs": ["ns4p11"]}, {"h": {"en": "4.3 Parameters and actual JSON-to-graph fixture import"}, "body": {"en": "\n<pre class=\"c\">// Browser/cypher-shell client command, not server Cypher:\n:param name =&gt; 'Asha'\n// Server query; $name is supplied separately by the client.\nMATCH (p:Person) WHERE p.name=$name\nRETURN p.person_id AS id,p.name AS name;</pre>\n<p>Keep query structure fixed and send values separately. Program 12 really supplies the name parameter to the official driver: Asha matches, while the quote/operator-shaped text <b>Asha' OR true //</b> is only a literal unmatched name. Do not build a WHERE clause by concatenating untrusted input.</p>\n<p>Client commands such as :param are not native server Cypher. The downloadable runner’s // @params and // @params_file lines are ordinary comments interpreted by that runner. A manual client user must set parameters using the client’s facility. Dynamic labels/types have version-specific syntax; do not assume a value placeholder can replace arbitrary Cypher clauses.</p>\n<pre class=\"c\">// $people is a client-supplied array of property maps.\nUNWIND $people AS row\nCREATE (p:PracticePerson) SET p=row;\n// A map can supply properties; it cannot be nested as\n// a stored map-valued property such as p.payload={x:1}.</pre>\n<p>Program 15 reads the actual bundled <b>graph_fixture.json</b>, supplies its arrays as parameters and uses UNWIND to create <b>six people and six KNOWS relationships</b>. A second read verifies every person ID/name/city/age and every source/target/since triple against the input. There is no hidden duplicate seed. The file also contains separate movie/banking data, but this import program intentionally imports only the social arrays.</p>\n<p>UNWIND turns list elements into rows; it does not promise an input-result ordering without ORDER BY. Data maps can be expanded into primitive properties with SET p=row; they cannot be stored as nested map properties. This is a synthetic snapshot, not LOAD CSV, live hardware, an ETL benchmark or a trained AI pipeline.</p>\n<p>Parameterization does not replace authentication, authorization, input validation or privacy policies. Use only the authorized disposable graph; never put real bank/account/profile records into a public learning submission.</p>"}, "diagram": "ns4_import", "programs": ["ns4p12", "ns4p15"]}]}, {"title": {"en": "5. Relationship-Based Application Examples"}, "items": [{"h": {"en": "5.1 Friend candidates: a bounded pattern with explicit exclusions"}, "body": {"en": "\n<p>The shared synthetic social fixture has six people and six stored KNOWS links. For Asha/P01, the direct connections are Ravi/P02 and Neha/P03. Ravi connects to Meera/P04 and Imran/P05; Neha also connects to Meera. Meera connects onward to Dev/P06.</p>\n<pre class=\"c\">MATCH (me:Person {person_id:'P01'})\n      -[:KNOWS]-(:Person)-[:KNOWS]-(candidate:Person)\nWHERE candidate&lt;&gt;me AND NOT (me)-[:KNOWS]-(candidate)\nRETURN DISTINCT candidate.person_id AS id,\n       candidate.name AS name ORDER BY id;</pre>\n<p>The basic two-hop pattern gives <b>Meera/P04</b> and <b>Imran/P05</b>. Excluding the starting person and direct connections prevents unsuitable trivial suggestions. DISTINCT prevents Meera being returned twice through Ravi and Neha. Dev is three hops from Asha on these links, so this two-hop question does not return him.</p>\n<p>This implements a <b>basic Cypher candidate query</b> required by Practical 8, not a graph-algorithm implementation, a trained recommendation model or a measured ranking system. Common-neighbour/similarity ideas are discussed conceptually; no similarity score, PageRank, custom BFS or GDS algorithm is implemented.</p>\n<p>Real suggestions require consent, blocks, eligibility, deduplication, freshness, abuse controls and relevance evaluation. A relationship path is a traceable reason for a candidate, not proof that a connection should be recommended to a user.</p>"}, "diagram": "ns4_social", "programs": ["ns4p13"]}, {"h": {"en": "5.2 Movie candidates and the LinkedIn/Netflix workload analogies"}, "body": {"en": "\n<p>Asha likes Graph Journeys/M01. Ravi likes M01 and Database Stories/M02; Neha likes Space Signals/M03. Asha’s known people therefore supply M02 and M03 as unseen candidate titles.</p>\n<pre class=\"c\">MATCH (me:Person {person_id:'P01'})\n      -[:KNOWS]-(friend:Person)-[:LIKES]-&gt;(m:Movie)\nWHERE NOT (me)-[:LIKES]-&gt;(m)\nRETURN DISTINCT m.movie_id AS id,m.title AS title\nORDER BY id;</pre>\n<p>The returned titles are <b>Database Stories</b> and <b>Space Signals</b>. The NOT pattern excludes M01 because Asha already likes it; DISTINCT removes duplicate candidate paths. The query does not establish a user’s full watch history, personal consent or a relevance score.</p>\n<p>The GTU syllabus names <b>LinkedIn, Netflix and banking</b> as AI-use-case contexts. Here, <b>LinkedIn-like</b> means professional connection/skill relationship questions, and <b>Netflix-like</b> means user-to-content preference/candidate questions. These are <b>workload analogies, not verified claims that those companies use Neo4j</b>, and no company dataset or deployment is reproduced.</p>\n<p>A graph can support feature/context retrieval for an AI application, but a full recommender additionally needs eligibility rules, training or ranking if used, evaluation, monitoring and responsible data handling. This small example has no trained model, claimed accuracy uplift or throughput/latency result.</p>"}, "diagram": "ns4_movies", "programs": ["ns4p13"]}, {"h": {"en": "5.3 Shared-device banking patterns: investigation signals, not verdicts"}, "body": {"en": "\n<pre class=\"c\">MATCH (a:Account)-[:USES_DEVICE]-&gt;(d:Device)\n      &lt;-[:USES_DEVICE]-(b:Account)\nWHERE a.account_id&lt;b.account_id\nRETURN d.device_id AS device,a.account_id AS account_a,\n       b.account_id AS account_b\nORDER BY device,account_a,account_b;</pre>\n<p>The synthetic fixture has four accounts and two devices. D01 is used by A01, A02 and A04; D02 is used only by A03. The query returns exactly <b>(A01,A02), (A01,A04), (A02,A04)</b> on D01. It does not return A03 or self-pairs.</p>\n<p>The condition a.account_id &lt; b.account_id selects one canonical orientation and excludes self/symmetric duplicates. Three account pairs do not mean three independent fraud incidents. The observed relationship means only “uses the same modeled device.”</p>\n<p>Shared family devices, public computers, test accounts, data errors and device reassignment can all create legitimate overlaps. A result is a <b>review candidate, not a fraud verdict or accusation</b>. Add authorized context, time windows, provenance, consent/retention rules, analyst review and fairness/false-positive evaluation before any real decision.</p>\n<p>Fraud-ring/community/anomaly techniques are conceptual application examples only. This unit does not implement ring detection, graph analytics, a classifier, identity surveillance or real financial transaction processing. All account/device records are synthetic.</p>"}, "diagram": "ns4_fraud", "programs": ["ns4p14"]}]}, {"title": {"en": "6. Algorithm Awareness, Troubleshooting and the Journal"}, "items": [{"h": {"en": "6.1 Graph-algorithm families and AI: examples only, no implementation"}, "body": {"en": "\n<p>The syllabus asks for graph-algorithm <b>examples, not implementations</b>. Recognize the kinds of relationship question an algorithm family can support; no mathematical proof, pseudocode or GDS installation/call is required here.</p><table><tr><th>Family/example</th><th>Possible application question — conceptual only</th></tr><tr><td>Similarity / common-neighbour intuition</td><td>Which users/items have related connection patterns?</td></tr><tr><td>Centrality / ranking intuition</td><td>Which entities occupy influential positions in this chosen graph?</td></tr><tr><td>Community detection</td><td>Which densely connected groups might merit exploration?</td></tr><tr><td>Path finding</td><td>What connection route links two entities under stated rules?</td></tr><tr><td>Link-prediction intuition</td><td>Which missing relationship might be plausible, subject to evaluation?</td></tr></table>\n<p>Centrality is not human worth or trust; a community is not automatically a fraud ring; a short path is not causation. Graph Data Science is a separate optional library/service, not something automatically executed by a MATCH query. The reference does not install GDS or run its algorithms.</p>\n<p>The executed friend/movie/shared-device queries are <b>basic pattern demonstrations</b> for Practical 8. They are not implementations of the algorithm families above and do not train AI. A knowledge graph can organize entities/relationships for search or model context, but it does not automatically make an AI answer true, current, unbiased or authorized.</p>\n<p>Bound traversal depth, choose selective starting points, handle high-degree nodes and compare actual plans/measurements when optimization is needed. This unit observes an index state and tiny result sets, not distributed scaling, cluster failover, model accuracy, causal inference or real-time performance guarantees.</p>"}, "diagram": "ns4_ai"}, {"h": {"en": "6.2 Troubleshooting, practical journal and primary references"}, "body": {"en": "\n<p><b>Cannot connect:</b> distinguish a stopped instance/wrong port from bad credentials, required password change, wrong database or a TLS/certificate mismatch. A URI for your local computer cannot magically reach a private remote workspace. Check the selected deployment’s actual settings; do not disable authentication or certificate validation as a shortcut.</p>\n<p><b>Unexpected empty result:</b> check labels/types, property spelling, ID types, arrow direction, WHERE conditions and whether the seed was actually created. An undefined variable/bad pattern is a syntax rejection, whereas a valid absent match is empty. An absent property can read as null.</p>\n<p><b>Unexpected duplicate candidate:</b> inspect path multiplicity and use DISTINCT only if the desired unit is an entity. <b>MERGE duplication:</b> inspect the complete identity pattern and constraints. <b>DELETE rejection:</b> inspect incident relationships and destructive scope before selecting DETACH. <b>Map-property error:</b> expand valid primitive properties or model related entities.</p>\n<p><b>Journal for Practicals 7–8:</b> aim/CO4, actual Desktop/Aura setup evidence, versions/edition/OS, password-free URI/database, Browser graph/table observations, entity/relationship/property design, input/parameters, exact Cypher, actual positive and deliberate-negative results, candidate exclusions, full import verification, false-positive/AI limits, owned cleanup and conclusion. Do not relabel guided steps as completed GUI actions, edit output to imitate success or assign invented official theory marks.</p>\n<p><b>Reproduce the reference:</b> use the guarded practical ZIP and your own private compatible instance. Complete files contain an administrative claim header and cleanup footer; prefer the runner, which stops on unexpected setup errors. A manual client that continues after a failed claim could later run a destructive footer, so inspect a fresh disposable scope and stop on unexpected errors. Interrupted/ambiguous runs need investigation, not a bulk deletion of every matching label.</p>\n<p><b>Primary sources checked 29 October 2026:</b></p><ul><li><a href=\"https://s3-ap-southeast-1.amazonaws.com/gtusitecirculars/Syallbus/DI04000031.pdf\">GTU DI04000031 syllabus, effective 2025–26</a></li><li><a href=\"https://neo4j.com/docs/getting-started/appendix/graphdb-concepts/\">Neo4j property-graph concepts</a></li><li><a href=\"https://neo4j.com/deployment-center/\">Neo4j deployment choices and releases</a></li><li><a href=\"https://neo4j.com/docs/operations-manual/5/installation/requirements/\">Neo4j 5 system and Java requirements</a></li><li><a href=\"https://neo4j.com/docs/operations-manual/5/installation/linux/tarball/\">Neo4j 5 Linux tarball installation</a></li><li><a href=\"https://neo4j.com/docs/desktop/current/installation/\">Neo4j Desktop installation</a></li><li><a href=\"https://neo4j.com/docs/aura/getting-started/create-instance/\">Aura: create an instance</a></li><li><a href=\"https://neo4j.com/docs/browser/operations/dbms-connection/\">Neo4j Browser: connect to an instance</a></li><li><a href=\"https://neo4j.com/docs/operations-manual/current/cypher-shell/\">Cypher Shell client guide — reference client 5.26.32</a></li><li><a href=\"https://neo4j.com/docs/cypher-manual/5/clauses/match/\">Cypher 5 MATCH</a></li><li><a href=\"https://neo4j.com/docs/cypher-manual/5/clauses/create/\">Cypher 5 CREATE</a></li><li><a href=\"https://neo4j.com/docs/cypher-manual/5/clauses/merge/\">Cypher 5 MERGE</a></li><li><a href=\"https://neo4j.com/docs/cypher-manual/5/clauses/set/\">Cypher 5 SET</a></li><li><a href=\"https://neo4j.com/docs/cypher-manual/5/clauses/delete/\">Cypher 5 DELETE</a></li><li><a href=\"https://neo4j.com/docs/cypher-manual/5/clauses/optional-match/\">Cypher 5 OPTIONAL MATCH</a></li><li><a href=\"https://neo4j.com/docs/cypher-manual/5/constraints/\">Cypher 5 constraints and edition boundaries</a></li><li><a href=\"https://neo4j.com/docs/cypher-manual/5/syntax/parameters/\">Cypher 5 parameters</a></li><li><a href=\"https://neo4j.com/docs/graph-data-science/current/algorithms/\">Neo4j Graph Data Science algorithm families — conceptual reference only</a></li></ul>\n<p>The unit contains no official theory-question-paper tab. The final Notes section provides answered practical revision tasks; Redis is covered separately in Unit 5; this unit focuses on Neo4j.</p>"}, "programs": ["ns4p15", "ns4p16"]}]}, {"title": {"en": "Answered Practical Revision Tasks — Not a Theory Question Paper"}, "role": "practice", "items": [{"h": {"en": "Plan and record the official Practical 7 setup without overstating the reference."}, "body": {"en": "<p>Choose your authorized Desktop or AuraDB route, check current OS/security/tier terms, install/create your learning instance, keep credentials private, start/connect and record actual server/edition/version/database. The reference is Community Server 5.26.32, not a performed Desktop/Aura installation. Include your own Browser observations rather than submitting CLI evidence as a GUI screenshot.</p>"}}, {"h": {"en": "Create a small Browser graph and explain why another query shows only a table."}, "body": {"en": "<p>In a fresh authorized disposable graph, create the two PracticePerson nodes and KNOWS relationship. Return entities for graph visualization, then scalar properties for table output. Inspect arrows, labels and since=2024.</p><pre class=\"c\">CREATE (a:PracticePerson {person_id:'P01',name:'Asha'}),\n       (b:PracticePerson {person_id:'P02',name:'Ravi'}),\n       (a)-[:KNOWS {since:2024}]-&gt;(b);</pre><pre class=\"c\">MATCH (a:PracticePerson)-[r:KNOWS]-&gt;(b:PracticePerson)\nRETURN a,r,b;</pre><pre class=\"c\">MATCH (a:PracticePerson)-[r:KNOWS]-&gt;(b:PracticePerson)\nRETURN a.name AS source,type(r) AS relation,\n       b.name AS target,r.since AS since;</pre>"}}, {"h": {"en": "Model a user-to-movie-to-user question and justify properties versus nodes."}, "body": {"en": "<p>Use Person nodes with stable person_id and Movie nodes with stable movie_id/title, connected by LIKES. A simple age/city can be a Person property; use separate City entities only if city-specific identity/relationships matter. Define direction and identity rules. Do not turn every scalar into a node or claim a graph always outperforms relational joins.</p>"}}, {"h": {"en": "Store two people and one relationship with a relationship property."}, "body": {"en": "<p>Use program 3. The actual stored row is Asha / KNOWS / Ravi / since 2024. The relationship has exactly one type and a source/target direction; it can be read in reverse/either direction without creating another relationship.</p>"}}, {"h": {"en": "Find Surat people aged at least 20 and predict the exact reference result."}, "body": {"en": "<pre class=\"c\">MATCH (p:Person)\nWHERE p.city='Surat' AND p.age&gt;=20\nRETURN p.person_id AS id,p.name AS name,p.age AS age\nORDER BY id;</pre><p>Expected P01 Asha 20 and P05 Imran 20, ordered by ID. Neha is 19 and is excluded. Program 4 also verifies age-string equality is not integer equality and a valid missing match is empty.</p>"}}, {"h": {"en": "Explain Ravi’s incoming versus either-direction KNOWS neighbours."}, "body": {"en": "<p>Incoming to P02 finds Asha/P01. Either-direction at P02 finds Asha/P01, Meera/P04 and Imran/P05. The stored graph is not modified and no reciprocal-consent fact is inferred.</p>"}}, {"h": {"en": "Produce the oldest three and a per-city person count."}, "body": {"en": "<pre class=\"c\">MATCH (p:Person)\nRETURN p.person_id AS id,p.name AS name,p.age AS age\nORDER BY age DESC,id ASC LIMIT 3;\n\nMATCH (p:Person)\nRETURN p.city AS city,count(p) AS people ORDER BY city;</pre><p>Top three: Dev 23, Meera 22, Ravi 21. City counts: Bharuch 1, Rajkot 1, Surat 3, Vadodara 1. The secondary ID order handles equal ages deterministically; LIMIT does not guarantee cheap execution.</p>"}}, {"h": {"en": "Run the same identity MERGE twice and compare it with CREATE."}, "body": {"en": "<pre class=\"c\">MERGE (p:Person {person_id:'P09'})\nON CREATE SET p.name='Jai',p.visits=1\nON MATCH SET p.visits=p.visits+1\nRETURN p.person_id,p.name,p.visits;</pre><p>Observed Jai/P09 visits 1 then 2 and one business node. CREATE would create a new node unless a constraint prevented duplication. MERGE matches the whole specified pattern; do not put mutable name/city fields into identity casually.</p>"}}, {"h": {"en": "Update Ravi, remove a property/label and attempt a missing-key update."}, "body": {"en": "<p>Program 8 updates Ravi to Surat/22; REMOVE city leaves city null and age 22. Graduate is true after SET and false after REMOVE. MATCH plus SET for absent P99 returns no rows and creates no person; all six people remain. This is not Cassandra UPDATE upsert behaviour.</p>"}}, {"h": {"en": "Demonstrate relationship-only deletion, connected-node rejection and DETACH safely."}, "body": {"en": "<p>Program 9’s connected Asha DELETE is rejected with the actual Neo.ClientError.Schema.ConstraintValidationFailed code. DELETE r removes one KNOWS edge while endpoints remain; deleting now-isolated Asha removes one node. Later DETACH Ravi removes one node and one incident relationship, leaving P03 Neha. Preview scope; do not use a whole-database wipe.</p>"}}, {"h": {"en": "Use OPTIONAL MATCH and explain six rows versus one non-null link."}, "body": {"en": "<pre class=\"c\">MATCH (p:Person)\nOPTIONAL MATCH (p)-[:MENTORS]-&gt;(mentee:Person)\nRETURN p.person_id AS id,mentee.name AS mentee\nORDER BY id;</pre><p>Asha/P01 has mentee Ravi; P02–P06 return null. count(*) is 6 and count(mentee) is 1. A later WITH/WHERE mentee IS NOT NULL intentionally leaves only Asha/Ravi.</p>"}}, {"h": {"en": "Show a uniqueness rejection and prove the failed statement did not partly persist."}, "body": {"en": "<p>Program 11 creates a scoped person_id uniqueness rule and observes its ONLINE backing index. One statement tries P98 then conflicting P01; it fails and P98 count is 0. A later No ID person is accepted, showing uniqueness alone is not existence. Earlier separate commits are not automatically rolled back.</p>"}}, {"h": {"en": "Pass a quote/operator-shaped name safely as data."}, "body": {"en": "<pre class=\"c\">// Browser/cypher-shell client command, not server Cypher:\n:param name =&gt; 'Asha'\n// Server query; $name is supplied separately by the client.\nMATCH (p:Person) WHERE p.name=$name\nRETURN p.person_id AS id,p.name AS name;</pre><p>The driver supplies the value separately to fixed query text. Asha matches; the literal name containing an apostrophe and OR true // returns no rows. Do not concatenate user input into Cypher. Parameters do not replace authorization, validation or privacy controls.</p>"}}, {"h": {"en": "Import graph_fixture.json and verify every social element."}, "body": {"en": "<p>Run the guarded program 15 with the supplied fixture folder. Actual counters show six people and six KNOWS relationships. Compare every person ID/name/city/age and every directed endpoint/since triple with the input. The file’s movie/banking arrays are not imported by this program; no hidden seed or live/AI pipeline is claimed.</p>"}}, {"h": {"en": "Explain the actual two-hop candidates and Meera’s duplicate paths."}, "body": {"en": "<pre class=\"c\">MATCH (me:Person {person_id:'P01'})\n      -[:KNOWS]-(:Person)-[:KNOWS]-(candidate:Person)\nWHERE candidate&lt;&gt;me AND NOT (me)-[:KNOWS]-(candidate)\nRETURN DISTINCT candidate.person_id AS id,\n       candidate.name AS name ORDER BY id;</pre><p>Return Meera/P04 and Imran/P05. Asha and direct neighbours are excluded. Meera is reachable through Ravi and Neha, so DISTINCT removes repeated candidate rows. Dev/P06 is three hops away. This is a basic candidate pattern, not an implementation of GDS/similarity algorithms or a trained recommender.</p>"}}, {"h": {"en": "Find unseen movie candidates and state what the result does not prove."}, "body": {"en": "<pre class=\"c\">MATCH (me:Person {person_id:'P01'})\n      -[:KNOWS]-(friend:Person)-[:LIKES]-&gt;(m:Movie)\nWHERE NOT (me)-[:LIKES]-&gt;(m)\nRETURN DISTINCT m.movie_id AS id,m.title AS title\nORDER BY id;</pre><p>M02 Database Stories and M03 Space Signals are returned; already-liked M01 is excluded. No ranking quality, model training, Netflix deployment, watch-history completeness or real-time benchmark is established.</p>"}}, {"h": {"en": "List shared-device review pairs and two reasons not to call them fraud."}, "body": {"en": "<pre class=\"c\">MATCH (a:Account)-[:USES_DEVICE]-&gt;(d:Device)\n      &lt;-[:USES_DEVICE]-(b:Account)\nWHERE a.account_id&lt;b.account_id\nRETURN d.device_id AS device,a.account_id AS account_a,\n       b.account_id AS account_b\nORDER BY device,account_a,account_b;</pre><p>D01 gives A01–A02, A01–A04 and A02–A04; D02/A03 gives no shared pair. Family/public computers and device reassignment/data errors can be legitimate explanations. Use authorized context, false-positive evaluation, consent/retention and human review; a pattern is not a verdict.</p>"}}, {"h": {"en": "Prepare an honest CO4 demonstration and revision checklist."}, "body": {"en": "<p>Include actual Desktop/Aura/Browser setup evidence, versions/edition, password-free connection details, model/key rationale, input and parameters, exact Cypher, real read-back/counters and server rejection codes, all-element import checks, recommendation exclusions, banking/AI limits and owned cleanup. Describe algorithm families conceptually only; no GDS implementation or graph proof is required. This is a practical course with PA 20 + ESE 30 = 50 and no official theory-paper marks.</p>"}}]}], "programs": [{"id": "ns4p01", "title": {"en": "Verify Neo4j, Write a Node and Read it Back"}, "code": {"en": "// Trusted prepared example; fresh disposable scope only.\n// @scope NS4_ns4p01\nCREATE CONSTRAINT di04000031_u4_ns4p01_owner\nFOR (n:NS4_ns4p01) REQUIRE n.__owner IS UNIQUE;\nCREATE (:NS4_ns4p01 {__owner:'di04000031_u4_ns4p01'});\n// @result server_components\nCALL dbms.components() YIELD name,versions,edition\nRETURN name,versions,edition;\n// @result created_probe\n// @stats\nCREATE (p:NS4_ns4p01:Probe {probe_id:1,message:'Graph connected'})\nRETURN p.probe_id AS id,p.message AS message;\n// @result stored_roundtrip\nMATCH (p:NS4_ns4p01:Probe {probe_id:1}) RETURN p.message AS message;\n\n// Remove only this newly owned graph, then release its claim.\nMATCH (n:NS4_ns4p01) DETACH DELETE n;\nDROP CONSTRAINT di04000031_u4_ns4p01_owner;"}, "out": "server_components: [{\"name\":\"Neo4j Kernel\",\"versions\":[\"5.26.32\"],\"edition\":\"community\"}]\ncreated_probe: [{\"id\":1,\"message\":\"Graph connected\"}]\ncreated_probe_counters: {\"nodes_created\":1,\"nodes_deleted\":0,\"relationships_created\":0,\"relationships_deleted\":0,\"properties_set\":2,\"labels_added\":2,\"labels_removed\":0,\"constraints_added\":0,\"constraints_removed\":0}\nstored_roundtrip: [{\"message\":\"Graph connected\"}]\nScoped graph and constraints removed: true", "expl": {"en": "<p>The version/edition come from the real server, followed by a committed node write and separate read-back. Counters are actual driver summary counters, not invented acknowledgements.</p><p>The administrative header atomically claims one disposable scope with a newly created named constraint. It is a safety wrapper, not a requirement to understand every graph query first. Only that owned graph/schema is removed at the end.</p>"}}, {"id": "ns4p02", "title": {"en": "Nodes, Multiple Labels and Typed Properties"}, "code": {"en": "// Trusted prepared example; fresh disposable scope only.\n// @scope NS4_ns4p02\nCREATE CONSTRAINT di04000031_u4_ns4p02_owner\nFOR (n:NS4_ns4p02) REQUIRE n.__owner IS UNIQUE;\nCREATE (:NS4_ns4p02 {__owner:'di04000031_u4_ns4p02'});\nCREATE (:NS4_ns4p02:Person:Student {\n  person_id:'P01',name:'Asha',age:20,active:true,\n  score:85.5,skills:['Python','Cypher'],\n  joined:date('2026-10-29'),\n  observed_at:datetime('2026-10-29T09:00:00Z')\n});\n// @result typed_person\nMATCH (p:NS4_ns4p02:Person {person_id:'P01'})\nRETURN p.name AS name,p.age AS age,p.active AS active,\n  p.score AS score,p.skills AS skills,p.joined AS joined,\n  p.observed_at AS observed_at,p:Student AS student_label;\n\n// Remove only this newly owned graph, then release its claim.\nMATCH (n:NS4_ns4p02) DETACH DELETE n;\nDROP CONSTRAINT di04000031_u4_ns4p02_owner;"}, "out": "typed_person: [{\"name\":\"Asha\",\"age\":20,\"active\":true,\"score\":85.5,\"skills\":[\"Python\",\"Cypher\"],\"joined\":\"2026-10-29\",\"observed_at\":\"2026-10-29T09:00:00.000Z\",\"student_label\":true}]\nScoped graph and constraints removed: true", "expl": {"en": "<p>A node can carry several labels. String, integer, boolean, float, homogeneous string list, date and zoned datetime values are real stored properties. The runner displays temporal values as ISO text without changing their database types.</p><p>Use an application business ID, not an assumed durable internal node ID. Maps can be query values but cannot be stored as a nested property map; a genuine TypeError example appears in program 16.</p>"}}, {"id": "ns4p03", "title": {"en": "Create a Typed Directed Relationship with Properties"}, "code": {"en": "// Trusted prepared example; fresh disposable scope only.\n// @scope NS4_ns4p03\nCREATE CONSTRAINT di04000031_u4_ns4p03_owner\nFOR (n:NS4_ns4p03) REQUIRE n.__owner IS UNIQUE;\nCREATE (:NS4_ns4p03 {__owner:'di04000031_u4_ns4p03'});\nCREATE (:NS4_ns4p03:Person {person_id:'P01',name:'Asha'});\nCREATE (:NS4_ns4p03:Person {person_id:'P02',name:'Ravi'});\nMATCH (a:NS4_ns4p03:Person {person_id:'P01'}),\n      (b:NS4_ns4p03:Person {person_id:'P02'})\nCREATE (a)-[:KNOWS {since:2024}]->(b);\n\n// @result stored_relationship\nMATCH (a:NS4_ns4p03:Person)-[r:KNOWS]->(b:NS4_ns4p03:Person)\nRETURN a.name AS source,type(r) AS relationship,\n  b.name AS target,r.since AS since;\n\n// Remove only this newly owned graph, then release its claim.\nMATCH (n:NS4_ns4p03) DETACH DELETE n;\nDROP CONSTRAINT di04000031_u4_ns4p03_owner;"}, "out": "stored_relationship: [{\"source\":\"Asha\",\"relationship\":\"KNOWS\",\"target\":\"Ravi\",\"since\":2024}]\nScoped graph and constraints removed: true", "expl": {"en": "<p>The two existing scoped nodes become endpoints of one KNOWS relationship with since=2024. Every stored relationship has one direction and one type; its properties are optional.</p><p>The arrow represents the modeled direction, not a universal rule that real friendship is one-way. An undirected read can traverse either orientation without creating a reverse duplicate.</p>"}}, {"id": "ns4p04", "title": {"en": "MATCH, WHERE, RETURN and Value Filters"}, "code": {"en": "// Trusted prepared example; fresh disposable scope only.\n// @scope NS4_ns4p04\nCREATE CONSTRAINT di04000031_u4_ns4p04_owner\nFOR (n:NS4_ns4p04) REQUIRE n.__owner IS UNIQUE;\nCREATE (:NS4_ns4p04 {__owner:'di04000031_u4_ns4p04'});\nCREATE (:NS4_ns4p04:Person {person_id:'P01',\n  name:'Asha', city:'Surat', age:20});\nCREATE (:NS4_ns4p04:Person {person_id:'P02',\n  name:'Ravi', city:'Bharuch', age:21});\nCREATE (:NS4_ns4p04:Person {person_id:'P03',\n  name:'Neha', city:'Surat', age:19});\nCREATE (:NS4_ns4p04:Person {person_id:'P04',\n  name:'Meera', city:'Vadodara', age:22});\nCREATE (:NS4_ns4p04:Person {person_id:'P05',\n  name:'Imran', city:'Surat', age:20});\nCREATE (:NS4_ns4p04:Person {person_id:'P06',\n  name:'Dev', city:'Rajkot', age:23});\n\n// @result surat_adults\nMATCH (p:NS4_ns4p04:Person)\nWHERE p.city='Surat' AND p.age>=20\nRETURN p.person_id AS id,p.name AS name,p.age AS age ORDER BY id;\n// @result selected_ages\nMATCH (p:NS4_ns4p04:Person) WHERE p.age IN [19,23]\nRETURN p.person_id AS id,p.name AS name ORDER BY id;\n// @result either_condition\nMATCH (p:NS4_ns4p04:Person) WHERE p.city='Bharuch' OR p.age>22\nRETURN p.person_id AS id,p.name AS name ORDER BY id;\n// @result string_is_not_integer\nMATCH (p:NS4_ns4p04:Person) WHERE p.age='20'\nRETURN p.person_id AS id ORDER BY id;\n\n// Remove only this newly owned graph, then release its claim.\nMATCH (n:NS4_ns4p04) DETACH DELETE n;\nDROP CONSTRAINT di04000031_u4_ns4p04_owner;"}, "out": "surat_adults: [{\"id\":\"P01\",\"name\":\"Asha\",\"age\":20},{\"id\":\"P05\",\"name\":\"Imran\",\"age\":20}]\nselected_ages: [{\"id\":\"P03\",\"name\":\"Neha\"},{\"id\":\"P06\",\"name\":\"Dev\"}]\neither_condition: [{\"id\":\"P02\",\"name\":\"Ravi\"},{\"id\":\"P06\",\"name\":\"Dev\"}]\nstring_is_not_integer: []\nScoped graph and constraints removed: true", "expl": {"en": "<p>MATCH finds a pattern, WHERE restricts it and RETURN chooses columns. Surat age-at-least-20 gives Asha and Imran; ages 19/23 give Neha and Dev. Typed numeric equality is not automatic string-to-number conversion.</p><p>These are declarative graph queries. The filtered rows and ordered output do not prove a latency improvement, and a missing match is an empty result rather than an error.</p>"}}, {"id": "ns4p05", "title": {"en": "Read Outgoing, Incoming and Undirected Connections"}, "code": {"en": "// Trusted prepared example; fresh disposable scope only.\n// @scope NS4_ns4p05\nCREATE CONSTRAINT di04000031_u4_ns4p05_owner\nFOR (n:NS4_ns4p05) REQUIRE n.__owner IS UNIQUE;\nCREATE (:NS4_ns4p05 {__owner:'di04000031_u4_ns4p05'});\nCREATE (:NS4_ns4p05:Person {person_id:'P01',\n  name:'Asha', city:'Surat', age:20});\nCREATE (:NS4_ns4p05:Person {person_id:'P02',\n  name:'Ravi', city:'Bharuch', age:21});\nCREATE (:NS4_ns4p05:Person {person_id:'P03',\n  name:'Neha', city:'Surat', age:19});\nCREATE (:NS4_ns4p05:Person {person_id:'P04',\n  name:'Meera', city:'Vadodara', age:22});\nCREATE (:NS4_ns4p05:Person {person_id:'P05',\n  name:'Imran', city:'Surat', age:20});\nCREATE (:NS4_ns4p05:Person {person_id:'P06',\n  name:'Dev', city:'Rajkot', age:23});\nMATCH (a:NS4_ns4p05:Person {person_id:'P01'}),\n      (b:NS4_ns4p05:Person {person_id:'P02'})\nCREATE (a)-[:KNOWS {since:2024}]->(b);\nMATCH (a:NS4_ns4p05:Person {person_id:'P01'}),\n      (b:NS4_ns4p05:Person {person_id:'P03'})\nCREATE (a)-[:KNOWS {since:2025}]->(b);\nMATCH (a:NS4_ns4p05:Person {person_id:'P02'}),\n      (b:NS4_ns4p05:Person {person_id:'P04'})\nCREATE (a)-[:KNOWS {since:2023}]->(b);\nMATCH (a:NS4_ns4p05:Person {person_id:'P03'}),\n      (b:NS4_ns4p05:Person {person_id:'P04'})\nCREATE (a)-[:KNOWS {since:2024}]->(b);\nMATCH (a:NS4_ns4p05:Person {person_id:'P02'}),\n      (b:NS4_ns4p05:Person {person_id:'P05'})\nCREATE (a)-[:KNOWS {since:2025}]->(b);\nMATCH (a:NS4_ns4p05:Person {person_id:'P04'}),\n      (b:NS4_ns4p05:Person {person_id:'P06'})\nCREATE (a)-[:KNOWS {since:2022}]->(b);\n\n// @result asha_outgoing\nMATCH (a:NS4_ns4p05:Person {person_id:'P01'})\n      -[:KNOWS]->(b:NS4_ns4p05:Person)\nRETURN b.person_id AS id,b.name AS name ORDER BY id;\n// @result ravi_incoming\nMATCH (a:NS4_ns4p05:Person {person_id:'P02'})\n      <-[:KNOWS]-(b:NS4_ns4p05:Person)\nRETURN b.person_id AS id,b.name AS name ORDER BY id;\n// @result ravi_either_direction\nMATCH (a:NS4_ns4p05:Person {person_id:'P02'})\n      -[:KNOWS]-(b:NS4_ns4p05:Person)\nRETURN b.person_id AS id,b.name AS name ORDER BY id;\n\n// Remove only this newly owned graph, then release its claim.\nMATCH (n:NS4_ns4p05) DETACH DELETE n;\nDROP CONSTRAINT di04000031_u4_ns4p05_owner;"}, "out": "asha_outgoing: [{\"id\":\"P02\",\"name\":\"Ravi\"},{\"id\":\"P03\",\"name\":\"Neha\"}]\nravi_incoming: [{\"id\":\"P01\",\"name\":\"Asha\"}]\nravi_either_direction: [{\"id\":\"P01\",\"name\":\"Asha\"},{\"id\":\"P04\",\"name\":\"Meera\"},{\"id\":\"P05\",\"name\":\"Imran\"}]\nScoped graph and constraints removed: true", "expl": {"en": "<p>Asha has stored outgoing links to Ravi and Neha. Ravi has an incoming link from Asha; ignoring direction finds Asha, Meera and Imran.</p><p>The undirected read does not change the stored arrows or establish reciprocal business consent. Match direction according to the relationship meaning and query requirement.</p>"}}, {"id": "ns4p06", "title": {"en": "ORDER BY, LIMIT, DISTINCT and Simple Counts"}, "code": {"en": "// Trusted prepared example; fresh disposable scope only.\n// @scope NS4_ns4p06\nCREATE CONSTRAINT di04000031_u4_ns4p06_owner\nFOR (n:NS4_ns4p06) REQUIRE n.__owner IS UNIQUE;\nCREATE (:NS4_ns4p06 {__owner:'di04000031_u4_ns4p06'});\nCREATE (:NS4_ns4p06:Person {person_id:'P01',\n  name:'Asha', city:'Surat', age:20});\nCREATE (:NS4_ns4p06:Person {person_id:'P02',\n  name:'Ravi', city:'Bharuch', age:21});\nCREATE (:NS4_ns4p06:Person {person_id:'P03',\n  name:'Neha', city:'Surat', age:19});\nCREATE (:NS4_ns4p06:Person {person_id:'P04',\n  name:'Meera', city:'Vadodara', age:22});\nCREATE (:NS4_ns4p06:Person {person_id:'P05',\n  name:'Imran', city:'Surat', age:20});\nCREATE (:NS4_ns4p06:Person {person_id:'P06',\n  name:'Dev', city:'Rajkot', age:23});\n\n// @result oldest_three\nMATCH (p:NS4_ns4p06:Person)\nRETURN p.person_id AS id,p.name AS name,p.age AS age\nORDER BY age DESC,id ASC LIMIT 3;\n// @result distinct_cities\nMATCH (p:NS4_ns4p06:Person)\nRETURN DISTINCT p.city AS city ORDER BY city;\n// @result people_per_city\nMATCH (p:NS4_ns4p06:Person)\nRETURN p.city AS city,count(p) AS people ORDER BY city;\n// @result surat_count\nMATCH (p:NS4_ns4p06:Person) WHERE p.city='Surat'\nRETURN count(p) AS people;\n\n// Remove only this newly owned graph, then release its claim.\nMATCH (n:NS4_ns4p06) DETACH DELETE n;\nDROP CONSTRAINT di04000031_u4_ns4p06_owner;"}, "out": "oldest_three: [{\"id\":\"P06\",\"name\":\"Dev\",\"age\":23},{\"id\":\"P04\",\"name\":\"Meera\",\"age\":22},{\"id\":\"P02\",\"name\":\"Ravi\",\"age\":21}]\ndistinct_cities: [{\"city\":\"Bharuch\"},{\"city\":\"Rajkot\"},{\"city\":\"Surat\"},{\"city\":\"Vadodara\"}]\npeople_per_city: [{\"city\":\"Bharuch\",\"people\":1},{\"city\":\"Rajkot\",\"people\":1},{\"city\":\"Surat\",\"people\":3},{\"city\":\"Vadodara\",\"people\":1}]\nsurat_count: [{\"people\":3}]\nScoped graph and constraints removed: true", "expl": {"en": "<p>The oldest three are Dev 23, Meera 22 and Ravi 21. A secondary business-ID order makes ties deterministic. DISTINCT cities removes repeated values; grouping counts Surat=3 and the other listed cities=1 each.</p><p>Cypher ORDER BY and aggregation are not Cassandra partition-key rules. Without ORDER BY, a particular row order is not a result contract. LIMIT controls returned rows, not every possible traversal cost.</p>"}}, {"id": "ns4p07", "title": {"en": "MERGE, ON CREATE and ON MATCH"}, "code": {"en": "// Trusted prepared example; fresh disposable scope only.\n// @scope NS4_ns4p07\nCREATE CONSTRAINT di04000031_u4_ns4p07_owner\nFOR (n:NS4_ns4p07) REQUIRE n.__owner IS UNIQUE;\nCREATE (:NS4_ns4p07 {__owner:'di04000031_u4_ns4p07'});\n// @result first_merge\nMERGE (p:NS4_ns4p07:Person {person_id:'P09'})\nON CREATE SET p.name='Jai',p.visits=1\nON MATCH SET p.visits=p.visits+1\nRETURN p.person_id AS id,p.name AS name,p.visits AS visits;\n// @result second_merge\nMERGE (p:NS4_ns4p07:Person {person_id:'P09'})\nON CREATE SET p.name='Jai',p.visits=1\nON MATCH SET p.visits=p.visits+1\nRETURN p.person_id AS id,p.name AS name,p.visits AS visits;\n// @result one_business_node\nMATCH (p:NS4_ns4p07:Person {person_id:'P09'}) RETURN count(p) AS people;\n\n// Remove only this newly owned graph, then release its claim.\nMATCH (n:NS4_ns4p07) DETACH DELETE n;\nDROP CONSTRAINT di04000031_u4_ns4p07_owner;"}, "out": "first_merge: [{\"id\":\"P09\",\"name\":\"Jai\",\"visits\":1}]\nsecond_merge: [{\"id\":\"P09\",\"name\":\"Jai\",\"visits\":2}]\none_business_node: [{\"people\":1}]\nScoped graph and constraints removed: true", "expl": {"en": "<p>The first MERGE creates Jai with visits 1; the second matches the same ID and changes visits to 2. There is one business node.</p><p>MERGE matches the complete specified pattern, not every human interpretation of identity. Use a stable identity pattern and an appropriate uniqueness constraint; MERGE alone is not a general concurrent uniqueness guarantee. CREATE normally creates a new element, while MATCH alone does not create a missing one.</p>"}}, {"id": "ns4p08", "title": {"en": "SET and REMOVE: Properties, Labels and a Missing Match"}, "code": {"en": "// Trusted prepared example; fresh disposable scope only.\n// @scope NS4_ns4p08\nCREATE CONSTRAINT di04000031_u4_ns4p08_owner\nFOR (n:NS4_ns4p08) REQUIRE n.__owner IS UNIQUE;\nCREATE (:NS4_ns4p08 {__owner:'di04000031_u4_ns4p08'});\nCREATE (:NS4_ns4p08:Person {person_id:'P01',\n  name:'Asha', city:'Surat', age:20});\nCREATE (:NS4_ns4p08:Person {person_id:'P02',\n  name:'Ravi', city:'Bharuch', age:21});\nCREATE (:NS4_ns4p08:Person {person_id:'P03',\n  name:'Neha', city:'Surat', age:19});\nCREATE (:NS4_ns4p08:Person {person_id:'P04',\n  name:'Meera', city:'Vadodara', age:22});\nCREATE (:NS4_ns4p08:Person {person_id:'P05',\n  name:'Imran', city:'Surat', age:20});\nCREATE (:NS4_ns4p08:Person {person_id:'P06',\n  name:'Dev', city:'Rajkot', age:23});\n\n// @result updated_ravi\nMATCH (p:NS4_ns4p08:Person {person_id:'P02'})\nSET p.city='Surat',p.age=22\nRETURN p.name AS name,p.city AS city,p.age AS age;\n// @result removed_city\nMATCH (p:NS4_ns4p08:Person {person_id:'P02'}) REMOVE p.city\nRETURN p.name AS name,p.city AS city,p.age AS age;\n// @result label_added\nMATCH (p:NS4_ns4p08:Person {person_id:'P02'}) SET p:Graduate\nRETURN p.name AS name,p:Graduate AS graduate;\n// @result label_removed\nMATCH (p:NS4_ns4p08:Person {person_id:'P02'}) REMOVE p:Graduate\nRETURN p.name AS name,p:Graduate AS graduate;\n// @result missing_update\nMATCH (p:NS4_ns4p08:Person {person_id:'P99'}) SET p.city='Surat'\nRETURN p.person_id AS id;\n// @result people_unchanged\nMATCH (p:NS4_ns4p08:Person) RETURN count(p) AS people;\n\n// Remove only this newly owned graph, then release its claim.\nMATCH (n:NS4_ns4p08) DETACH DELETE n;\nDROP CONSTRAINT di04000031_u4_ns4p08_owner;"}, "out": "updated_ravi: [{\"name\":\"Ravi\",\"city\":\"Surat\",\"age\":22}]\nremoved_city: [{\"name\":\"Ravi\",\"city\":null,\"age\":22}]\nlabel_added: [{\"name\":\"Ravi\",\"graduate\":true}]\nlabel_removed: [{\"name\":\"Ravi\",\"graduate\":false}]\nmissing_update: []\npeople_unchanged: [{\"people\":6}]\nScoped graph and constraints removed: true", "expl": {"en": "<p>Ravi changes to Surat/22, then city is removed while age remains. An absent property reads as null; null is not a stored nested empty object. Graduate is added and removed without deleting the node.</p><p>MATCH plus SET on absent P99 returns no rows and creates no node: all six people remain. This is different from ordinary Cassandra UPDATE upsert semantics. SET n = map replaces all properties; SET n += map updates/merges the supplied properties.</p>"}}, {"id": "ns4p09", "title": {"en": "DELETE a Relationship, Reject Connected Deletion and DETACH"}, "code": {"en": "// Trusted prepared example; fresh disposable scope only.\n// @scope NS4_ns4p09\nCREATE CONSTRAINT di04000031_u4_ns4p09_owner\nFOR (n:NS4_ns4p09) REQUIRE n.__owner IS UNIQUE;\nCREATE (:NS4_ns4p09 {__owner:'di04000031_u4_ns4p09'});\nCREATE (:NS4_ns4p09:Person {person_id:'P01',name:'Asha'});\nCREATE (:NS4_ns4p09:Person {person_id:'P02',name:'Ravi'});\nMATCH (a:NS4_ns4p09:Person {person_id:'P01'}),\n      (b:NS4_ns4p09:Person {person_id:'P02'})\nCREATE (a)-[:KNOWS {since:2024}]->(b);\n\n// @result connected_node_rejected\n// @expect Neo.ClientError.Schema.ConstraintValidationFailed\nMATCH (p:NS4_ns4p09:Person {person_id:'P01'}) DELETE p;\n// @result asha_still_present\nMATCH (p:NS4_ns4p09:Person {person_id:'P01'}) RETURN count(p) AS people;\n// @result delete_relationship\n// @stats\nMATCH (a:NS4_ns4p09:Person {person_id:'P01'})\n      -[r:KNOWS]->(:NS4_ns4p09:Person {person_id:'P02'}) DELETE r;\n// @result delete_now_isolated_asha\n// @stats\nMATCH (p:NS4_ns4p09:Person {person_id:'P01'}) DELETE p;\nMATCH (r:NS4_ns4p09:Person {person_id:'P02'})\nCREATE (r)-[:KNOWS]->(:NS4_ns4p09:Person {person_id:'P03',name:'Neha'});\n// @result detach_ravi\n// @stats\nMATCH (p:NS4_ns4p09:Person {person_id:'P02'}) DETACH DELETE p;\n// @result remaining_people\nMATCH (p:NS4_ns4p09:Person)\nRETURN p.person_id AS id,p.name AS name ORDER BY id;\n\n// Remove only this newly owned graph, then release its claim.\nMATCH (n:NS4_ns4p09) DETACH DELETE n;\nDROP CONSTRAINT di04000031_u4_ns4p09_owner;"}, "out": "connected_node_rejected: Neo.ClientError.Schema.ConstraintValidationFailed (server rejection)\nasha_still_present: [{\"people\":1}]\ndelete_relationship_counters: {\"nodes_created\":0,\"nodes_deleted\":0,\"relationships_created\":0,\"relationships_deleted\":1,\"properties_set\":0,\"labels_added\":0,\"labels_removed\":0,\"constraints_added\":0,\"constraints_removed\":0}\ndelete_now_isolated_asha_counters: {\"nodes_created\":0,\"nodes_deleted\":1,\"relationships_created\":0,\"relationships_deleted\":0,\"properties_set\":0,\"labels_added\":0,\"labels_removed\":0,\"constraints_added\":0,\"constraints_removed\":0}\ndetach_ravi_counters: {\"nodes_created\":0,\"nodes_deleted\":1,\"relationships_created\":0,\"relationships_deleted\":1,\"properties_set\":0,\"labels_added\":0,\"labels_removed\":0,\"constraints_added\":0,\"constraints_removed\":0}\nremaining_people: [{\"id\":\"P03\",\"name\":\"Neha\"}]\nScoped graph and constraints removed: true", "expl": {"en": "<p>Plain DELETE of connected Asha is genuinely rejected. Deleting the KNOWS relationship leaves its endpoint nodes; Asha can then be deleted as an isolated node. Later DETACH DELETE removes Ravi and his incident relationship, leaving Neha.</p><p>DETACH DELETE can remove relationships to other endpoints: preview and bound the target carefully. Never run a whole-database delete in a shared database. Logical disappearance is not a claim of immediate physical disk erasure.</p>"}}, {"id": "ns4p10", "title": {"en": "OPTIONAL MATCH and Null-Aware Relationship Counts"}, "code": {"en": "// Trusted prepared example; fresh disposable scope only.\n// @scope NS4_ns4p10\nCREATE CONSTRAINT di04000031_u4_ns4p10_owner\nFOR (n:NS4_ns4p10) REQUIRE n.__owner IS UNIQUE;\nCREATE (:NS4_ns4p10 {__owner:'di04000031_u4_ns4p10'});\nCREATE (:NS4_ns4p10:Person {person_id:'P01',\n  name:'Asha', city:'Surat', age:20});\nCREATE (:NS4_ns4p10:Person {person_id:'P02',\n  name:'Ravi', city:'Bharuch', age:21});\nCREATE (:NS4_ns4p10:Person {person_id:'P03',\n  name:'Neha', city:'Surat', age:19});\nCREATE (:NS4_ns4p10:Person {person_id:'P04',\n  name:'Meera', city:'Vadodara', age:22});\nCREATE (:NS4_ns4p10:Person {person_id:'P05',\n  name:'Imran', city:'Surat', age:20});\nCREATE (:NS4_ns4p10:Person {person_id:'P06',\n  name:'Dev', city:'Rajkot', age:23});\n\nMATCH (a:NS4_ns4p10:Person {person_id:'P01'}),\n      (b:NS4_ns4p10:Person {person_id:'P02'}) CREATE (a)-[:MENTORS]->(b);\n// @result optional_mentees\nMATCH (p:NS4_ns4p10:Person)\nOPTIONAL MATCH (p)-[:MENTORS]->(mentee:NS4_ns4p10:Person)\nRETURN p.person_id AS id,mentee.name AS mentee ORDER BY id;\n// @result row_vs_linked_count\nMATCH (p:NS4_ns4p10:Person)\nOPTIONAL MATCH (p)-[:MENTORS]->(mentee:NS4_ns4p10:Person)\nRETURN count(*) AS rows,count(mentee) AS linked;\n// @result only_linked_people\nMATCH (p:NS4_ns4p10:Person)\nOPTIONAL MATCH (p)-[:MENTORS]->(mentee:NS4_ns4p10:Person)\nWITH p,mentee WHERE mentee IS NOT NULL\nRETURN p.name AS mentor,mentee.name AS mentee ORDER BY mentor;\n\n// Remove only this newly owned graph, then release its claim.\nMATCH (n:NS4_ns4p10) DETACH DELETE n;\nDROP CONSTRAINT di04000031_u4_ns4p10_owner;"}, "out": "optional_mentees: [{\"id\":\"P01\",\"mentee\":\"Ravi\"},{\"id\":\"P02\",\"mentee\":null},{\"id\":\"P03\",\"mentee\":null},{\"id\":\"P04\",\"mentee\":null},{\"id\":\"P05\",\"mentee\":null},{\"id\":\"P06\",\"mentee\":null}]\nrow_vs_linked_count: [{\"rows\":6,\"linked\":1}]\nonly_linked_people: [{\"mentor\":\"Asha\",\"mentee\":\"Ravi\"}]\nScoped graph and constraints removed: true", "expl": {"en": "<p>OPTIONAL MATCH preserves each person even without a matched outgoing MENTORS relationship; the optional value is null. Asha mentors Ravi in this fixture. There are six rows but only one non-null mentee.</p><p>count(*) counts rows and count(mentee) ignores null. A later WITH/WHERE that requires a non-null mentee removes the unmatched rows. Choose this behaviour deliberately rather than accidentally discarding isolated entities.</p>"}}, {"id": "ns4p11", "title": {"en": "A Scoped Uniqueness Constraint and Real Failed-Write Rollback"}, "code": {"en": "// Trusted prepared example; fresh disposable scope only.\n// @scope NS4_ns4p11\nCREATE CONSTRAINT di04000031_u4_ns4p11_owner\nFOR (n:NS4_ns4p11) REQUIRE n.__owner IS UNIQUE;\nCREATE (:NS4_ns4p11 {__owner:'di04000031_u4_ns4p11'});\nCREATE (:NS4_ns4p11:Person {person_id:'P01',name:'Asha'});\nCREATE CONSTRAINT di04000031_u4_ns4p11_person_id\nFOR (p:NS4_ns4p11) REQUIRE p.person_id IS UNIQUE;\nCALL db.awaitIndexes(60);\n// @result business_constraint\nSHOW CONSTRAINTS YIELD name,type,properties\nWHERE name='di04000031_u4_ns4p11_person_id' RETURN name,type,properties;\n// @result backing_index\nSHOW INDEXES YIELD state,owningConstraint\nWHERE owningConstraint='di04000031_u4_ns4p11_person_id'\nRETURN state,owningConstraint;\n// @result duplicate_rejected\n// @expect Neo.ClientError.Schema.ConstraintValidationFailed\nCREATE (:NS4_ns4p11:Person {person_id:'P98',name:'Transient'})\nCREATE (:NS4_ns4p11:Person {person_id:'P01',name:'Duplicate'});\n// @result failed_statement_rolled_back\nMATCH (p:NS4_ns4p11:Person {person_id:'P98'}) RETURN count(p) AS people;\nCREATE (:NS4_ns4p11:Person {name:'No ID'});\n// @result missing_id_is_allowed_by_uniqueness_only\nMATCH (p:NS4_ns4p11:Person)\nRETURN p.person_id AS id,p.name AS name ORDER BY id;\nDROP CONSTRAINT di04000031_u4_ns4p11_person_id;\n\n// Remove only this newly owned graph, then release its claim.\nMATCH (n:NS4_ns4p11) DETACH DELETE n;\nDROP CONSTRAINT di04000031_u4_ns4p11_owner;"}, "out": "business_constraint: [{\"name\":\"di04000031_u4_ns4p11_person_id\",\"type\":\"UNIQUENESS\",\"properties\":[\"person_id\"]}]\nbacking_index: [{\"state\":\"ONLINE\",\"owningConstraint\":\"di04000031_u4_ns4p11_person_id\"}]\nduplicate_rejected: Neo.ClientError.Schema.ConstraintValidationFailed (server rejection)\nfailed_statement_rolled_back: [{\"people\":0}]\nmissing_id_is_allowed_by_uniqueness_only: [{\"id\":\"P01\",\"name\":\"Asha\"},{\"id\":null,\"name\":\"No ID\"}]\nScoped graph and constraints removed: true", "expl": {"en": "<p>The scoped uniqueness constraint has an ONLINE backing index. A duplicate ID is rejected; P98 from the same failed statement is absent, showing rollback of that single implicit transaction. A later statement creates a person with no ID: uniqueness alone is not a required-property constraint.</p><p>This is schema/identity awareness, not an execution-plan or timing benchmark. The separate lab-claim constraint protects ownership and is not a business-ID policy. Both the business constraint and lab claim are explicitly removed only when owned.</p>"}}, {"id": "ns4p12", "title": {"en": "Parameterized Queries: Input Remains a Value"}, "code": {"en": "// Trusted prepared example; fresh disposable scope only.\n// @scope NS4_ns4p12\nCREATE CONSTRAINT di04000031_u4_ns4p12_owner\nFOR (n:NS4_ns4p12) REQUIRE n.__owner IS UNIQUE;\nCREATE (:NS4_ns4p12 {__owner:'di04000031_u4_ns4p12'});\nCREATE (:NS4_ns4p12:Person {person_id:'P01',\n  name:'Asha', city:'Surat', age:20});\nCREATE (:NS4_ns4p12:Person {person_id:'P02',\n  name:'Ravi', city:'Bharuch', age:21});\nCREATE (:NS4_ns4p12:Person {person_id:'P03',\n  name:'Neha', city:'Surat', age:19});\nCREATE (:NS4_ns4p12:Person {person_id:'P04',\n  name:'Meera', city:'Vadodara', age:22});\nCREATE (:NS4_ns4p12:Person {person_id:'P05',\n  name:'Imran', city:'Surat', age:20});\nCREATE (:NS4_ns4p12:Person {person_id:'P06',\n  name:'Dev', city:'Rajkot', age:23});\n\n// @params {\"name\":\"Asha\"}\n// @result parameter_match\nMATCH (p:NS4_ns4p12:Person) WHERE p.name=$name\nRETURN p.person_id AS id,p.name AS name,p.city AS city ORDER BY id;\n// @params {\"name\":\"Asha' OR true //\"}\n// @result selector_shaped_text_is_not_query_code\nMATCH (p:NS4_ns4p12:Person) WHERE p.name=$name\nRETURN p.person_id AS id ORDER BY id;\n// @params {\"name\":\"Nobody\"}\n// @result missing_parameter_value\nMATCH (p:NS4_ns4p12:Person) WHERE p.name=$name\nRETURN p.person_id AS id ORDER BY id;\n\n// Remove only this newly owned graph, then release its claim.\nMATCH (n:NS4_ns4p12) DETACH DELETE n;\nDROP CONSTRAINT di04000031_u4_ns4p12_owner;"}, "out": "parameter_match: [{\"id\":\"P01\",\"name\":\"Asha\",\"city\":\"Surat\"}]\nselector_shaped_text_is_not_query_code: []\nmissing_parameter_value: []\nScoped graph and constraints removed: true", "expl": {"en": "<p>The same fixed Cypher query is executed with official-driver parameters. Asha matches; the quote/operator-shaped string is treated as a literal name and returns no rows, not an expanded WHERE clause.</p><p>@params is a comment annotation for this runner. In Browser/cypher-shell, set the parameter through the client parameter facility first. Validate application input and keep credentials private; parameterization does not itself provide authorization, privacy policy or permission to run arbitrary source.</p>"}}, {"id": "ns4p13", "title": {"en": "Social and Movie Candidate Examples with Basic Patterns"}, "code": {"en": "// Trusted prepared example; fresh disposable scope only.\n// @scope NS4_ns4p13\nCREATE CONSTRAINT di04000031_u4_ns4p13_owner\nFOR (n:NS4_ns4p13) REQUIRE n.__owner IS UNIQUE;\nCREATE (:NS4_ns4p13 {__owner:'di04000031_u4_ns4p13'});\nCREATE (:NS4_ns4p13:Person {person_id:'P01',\n  name:'Asha', city:'Surat', age:20});\nCREATE (:NS4_ns4p13:Person {person_id:'P02',\n  name:'Ravi', city:'Bharuch', age:21});\nCREATE (:NS4_ns4p13:Person {person_id:'P03',\n  name:'Neha', city:'Surat', age:19});\nCREATE (:NS4_ns4p13:Person {person_id:'P04',\n  name:'Meera', city:'Vadodara', age:22});\nCREATE (:NS4_ns4p13:Person {person_id:'P05',\n  name:'Imran', city:'Surat', age:20});\nCREATE (:NS4_ns4p13:Person {person_id:'P06',\n  name:'Dev', city:'Rajkot', age:23});\nMATCH (a:NS4_ns4p13:Person {person_id:'P01'}),\n      (b:NS4_ns4p13:Person {person_id:'P02'})\nCREATE (a)-[:KNOWS {since:2024}]->(b);\nMATCH (a:NS4_ns4p13:Person {person_id:'P01'}),\n      (b:NS4_ns4p13:Person {person_id:'P03'})\nCREATE (a)-[:KNOWS {since:2025}]->(b);\nMATCH (a:NS4_ns4p13:Person {person_id:'P02'}),\n      (b:NS4_ns4p13:Person {person_id:'P04'})\nCREATE (a)-[:KNOWS {since:2023}]->(b);\nMATCH (a:NS4_ns4p13:Person {person_id:'P03'}),\n      (b:NS4_ns4p13:Person {person_id:'P04'})\nCREATE (a)-[:KNOWS {since:2024}]->(b);\nMATCH (a:NS4_ns4p13:Person {person_id:'P02'}),\n      (b:NS4_ns4p13:Person {person_id:'P05'})\nCREATE (a)-[:KNOWS {since:2025}]->(b);\nMATCH (a:NS4_ns4p13:Person {person_id:'P04'}),\n      (b:NS4_ns4p13:Person {person_id:'P06'})\nCREATE (a)-[:KNOWS {since:2022}]->(b);\nCREATE (:NS4_ns4p13:Movie {movie_id:'M01',\n  title:'Graph Journeys'});\nCREATE (:NS4_ns4p13:Movie {movie_id:'M02',\n  title:'Database Stories'});\nCREATE (:NS4_ns4p13:Movie {movie_id:'M03',\n  title:'Space Signals'});\nMATCH (p:NS4_ns4p13:Person {person_id:'P01'}),\n      (m:NS4_ns4p13:Movie {movie_id:'M01'})\nCREATE (p)-[:LIKES]->(m);\nMATCH (p:NS4_ns4p13:Person {person_id:'P02'}),\n      (m:NS4_ns4p13:Movie {movie_id:'M01'})\nCREATE (p)-[:LIKES]->(m);\nMATCH (p:NS4_ns4p13:Person {person_id:'P02'}),\n      (m:NS4_ns4p13:Movie {movie_id:'M02'})\nCREATE (p)-[:LIKES]->(m);\nMATCH (p:NS4_ns4p13:Person {person_id:'P03'}),\n      (m:NS4_ns4p13:Movie {movie_id:'M03'})\nCREATE (p)-[:LIKES]->(m);\n\n// @result friend_candidates\nMATCH (me:NS4_ns4p13:Person {person_id:'P01'})\n      -[:KNOWS]-(:NS4_ns4p13:Person)-[:KNOWS]-(c:NS4
