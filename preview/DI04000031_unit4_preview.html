_ns4p13:Person)\nWHERE c<>me AND NOT (me)-[:KNOWS]-(c)\nRETURN DISTINCT c.person_id AS id,c.name AS name ORDER BY id;\n// @result unseen_movies_liked_by_known_people\nMATCH (me:NS4_ns4p13:Person {person_id:'P01'})\n      -[:KNOWS]-(friend:NS4_ns4p13:Person)-[:LIKES]->(m:NS4_ns4p13:Movie)\nWHERE NOT (me)-[:LIKES]->(m)\nRETURN DISTINCT m.movie_id AS id,m.title AS title ORDER BY id;\n\n// Remove only this newly owned graph, then release its claim.\nMATCH (n:NS4_ns4p13) DETACH DELETE n;\nDROP CONSTRAINT di04000031_u4_ns4p13_owner;"}, "out": "friend_candidates: [{\"id\":\"P04\",\"name\":\"Meera\"},{\"id\":\"P05\",\"name\":\"Imran\"}]\nunseen_movies_liked_by_known_people: [{\"id\":\"M02\",\"title\":\"Database Stories\"},{\"id\":\"M03\",\"title\":\"Space Signals\"}]\nScoped graph and constraints removed: true", "expl": {"en": "<p>The two-hop basic pattern gives Meera/P04 and Imran/P05 after excluding self/direct connections and deduplicating paths. Friends’ liked movies not already liked by Asha give Database Stories/M02 and Space Signals/M03.</p><p>These are transparent candidate queries for Practical 8, not graph-algorithm implementations, GDS procedures, a trained recommender or a relevance/latency evaluation. LinkedIn-like connections and Netflix-like viewing are workload analogies; this lab does not establish those companies’ actual Neo4j deployments.</p>"}}, {"id": "ns4p14", "title": {"en": "Shared-Device Banking Patterns: Review Candidates, Not Fraud"}, "code": {"en": "// Trusted prepared example; fresh disposable scope only.\n// @scope NS4_ns4p14\nCREATE CONSTRAINT di04000031_u4_ns4p14_owner\nFOR (n:NS4_ns4p14) REQUIRE n.__owner IS UNIQUE;\nCREATE (:NS4_ns4p14 {__owner:'di04000031_u4_ns4p14'});\nCREATE (:NS4_ns4p14:Account {account_id:'A01',\n  holder:'User One'});\nCREATE (:NS4_ns4p14:Account {account_id:'A02',\n  holder:'User Two'});\nCREATE (:NS4_ns4p14:Account {account_id:'A03',\n  holder:'User Three'});\nCREATE (:NS4_ns4p14:Account {account_id:'A04',\n  holder:'User Four'});\nCREATE (:NS4_ns4p14:Device {device_id:'D01'});\nCREATE (:NS4_ns4p14:Device {device_id:'D02'});\nMATCH (a:NS4_ns4p14:Account {account_id:'A01'}),\n      (d:NS4_ns4p14:Device {device_id:'D01'})\nCREATE (a)-[:USES_DEVICE]->(d);\nMATCH (a:NS4_ns4p14:Account {account_id:'A02'}),\n      (d:NS4_ns4p14:Device {device_id:'D01'})\nCREATE (a)-[:USES_DEVICE]->(d);\nMATCH (a:NS4_ns4p14:Account {account_id:'A03'}),\n      (d:NS4_ns4p14:Device {device_id:'D02'})\nCREATE (a)-[:USES_DEVICE]->(d);\nMATCH (a:NS4_ns4p14:Account {account_id:'A04'}),\n      (d:NS4_ns4p14:Device {device_id:'D01'})\nCREATE (a)-[:USES_DEVICE]->(d);\n\n// @result accounts_per_device\nMATCH (a:NS4_ns4p14:Account)-[:USES_DEVICE]->(d:NS4_ns4p14:Device)\nRETURN d.device_id AS device,count(DISTINCT a) AS accounts\nORDER BY device;\n// @result shared_device_pairs\nMATCH (a:NS4_ns4p14:Account)-[:USES_DEVICE]->(d:NS4_ns4p14:Device)\n      <-[:USES_DEVICE]-(b:NS4_ns4p14:Account)\nWHERE a.account_id<b.account_id\nRETURN d.device_id AS device,a.account_id AS account_a,\n  b.account_id AS account_b ORDER BY device,account_a,account_b;\n\n// Remove only this newly owned graph, then release its claim.\nMATCH (n:NS4_ns4p14) DETACH DELETE n;\nDROP CONSTRAINT di04000031_u4_ns4p14_owner;"}, "out": "accounts_per_device: [{\"device\":\"D01\",\"accounts\":3},{\"device\":\"D02\",\"accounts\":1}]\nshared_device_pairs: [{\"device\":\"D01\",\"account_a\":\"A01\",\"account_b\":\"A02\"},{\"device\":\"D01\",\"account_a\":\"A01\",\"account_b\":\"A04\"},{\"device\":\"D01\",\"account_a\":\"A02\",\"account_b\":\"A04\"}]\nScoped graph and constraints removed: true", "expl": {"en": "<p>D01 is used by A01, A02 and A04, giving three distinct unordered account pairs. D02 is used only by A03 and contributes no pair. The less-than condition excludes self and symmetric duplicate pairs.</p><p>A shared device is a possible review signal, not a fraud verdict: family/shared computers and public access can be legitimate. No real bank records, criminal identification, classifier, ring-detection algorithm or GDS library is used. Governance, consent, context, false positives and human review remain essential.</p>"}}, {"id": "ns4p15", "title": {"en": "Import a Synthetic JSON Fixture with Parameters and UNWIND"}, "code": {"en": "// Trusted prepared example; fresh disposable scope only.\n// @scope NS4_ns4p15\nCREATE CONSTRAINT di04000031_u4_ns4p15_owner\nFOR (n:NS4_ns4p15) REQUIRE n.__owner IS UNIQUE;\nCREATE (:NS4_ns4p15 {__owner:'di04000031_u4_ns4p15'});\n// @params_file graph_fixture.json\n// @result imported_people\n// @stats\nUNWIND $people AS row\nCREATE (p:NS4_ns4p15:Person) SET p=row;\n// @params_file graph_fixture.json\n// @result imported_friendships\n// @stats\nUNWIND $friendships AS row\nMATCH (a:NS4_ns4p15:Person {person_id:row.from}),\n      (b:NS4_ns4p15:Person {person_id:row.to})\nCREATE (a)-[:KNOWS {since:row.since}]->(b);\n// @result verify_every_person\nMATCH (p:NS4_ns4p15:Person)\nRETURN p.person_id AS id,p.name AS name,p.city AS city,p.age AS age\nORDER BY id;\n// @result verify_every_relationship\nMATCH (a:NS4_ns4p15:Person)-[r:KNOWS]->(b:NS4_ns4p15:Person)\nRETURN a.person_id AS source,b.person_id AS target,r.since AS since\nORDER BY source,target;\n\n// Remove only this newly owned graph, then release its claim.\nMATCH (n:NS4_ns4p15) DETACH DELETE n;\nDROP CONSTRAINT di04000031_u4_ns4p15_owner;"}, "out": "imported_people_counters: {\"nodes_created\":6,\"nodes_deleted\":0,\"relationships_created\":0,\"relationships_deleted\":0,\"properties_set\":24,\"labels_added\":12,\"labels_removed\":0,\"constraints_added\":0,\"constraints_removed\":0}\nimported_friendships_counters: {\"nodes_created\":0,\"nodes_deleted\":0,\"relationships_created\":6,\"relationships_deleted\":0,\"properties_set\":6,\"labels_added\":0,\"labels_removed\":0,\"constraints_added\":0,\"constraints_removed\":0}\nverify_every_person: [{\"id\":\"P01\",\"name\":\"Asha\",\"city\":\"Surat\",\"age\":20},{\"id\":\"P02\",\"name\":\"Ravi\",\"city\":\"Bharuch\",\"age\":21},{\"id\":\"P03\",\"name\":\"Neha\",\"city\":\"Surat\",\"age\":19},{\"id\":\"P04\",\"name\":\"Meera\",\"city\":\"Vadodara\",\"age\":22},{\"id\":\"P05\",\"name\":\"Imran\",\"city\":\"Surat\",\"age\":20},{\"id\":\"P06\",\"name\":\"Dev\",\"city\":\"Rajkot\",\"age\":23}]\nverify_every_relationship: [{\"source\":\"P01\",\"target\":\"P02\",\"since\":2024},{\"source\":\"P01\",\"target\":\"P03\",\"since\":2025},{\"source\":\"P02\",\"target\":\"P04\",\"since\":2023},{\"source\":\"P02\",\"target\":\"P05\",\"since\":2025},{\"source\":\"P03\",\"target\":\"P04\",\"since\":2024},{\"source\":\"P04\",\"target\":\"P06\",\"since\":2022}]\nScoped graph and constraints removed: true", "expl": {"en": "<p>The runner actually reads the supplied JSON and passes its arrays as official-driver parameters; UNWIND creates six people, then six KNOWS relationships. Every stored person/edge/property is read back and compared with the fixture in validation.</p><p>The file also contains the separately demonstrated movie and banking fixtures; this program imports only people/friendships. It is not LOAD CSV, live ingestion or a trained AI data pipeline. SET p=row replaces properties but leaves the scope/domain labels intact. Each statement is its own implicit transaction, not one multi-statement atomic import.</p>"}}, {"id": "ns4p16", "title": {"en": "Actual Cypher Rejections, Flexible Types and Missing Results"}, "code": {"en": "// Trusted prepared example; fresh disposable scope only.\n// @scope NS4_ns4p16\nCREATE CONSTRAINT di04000031_u4_ns4p16_owner\nFOR (n:NS4_ns4p16) REQUIRE n.__owner IS UNIQUE;\nCREATE (:NS4_ns4p16 {__owner:'di04000031_u4_ns4p16'});\nCREATE (:NS4_ns4p16:Person {person_id:'P01',\n  name:'Asha', city:'Surat', age:20});\nCREATE (:NS4_ns4p16:Person {person_id:'P02',\n  name:'Ravi', city:'Bharuch', age:21});\nCREATE (:NS4_ns4p16:Person {person_id:'P03',\n  name:'Neha', city:'Surat', age:19});\nCREATE (:NS4_ns4p16:Person {person_id:'P04',\n  name:'Meera', city:'Vadodara', age:22});\nCREATE (:NS4_ns4p16:Person {person_id:'P05',\n  name:'Imran', city:'Surat', age:20});\nCREATE (:NS4_ns4p16:Person {person_id:'P06',\n  name:'Dev', city:'Rajkot', age:23});\n\n// @result nested_property_map_rejected\n// @expect Neo.ClientError.Statement.TypeError\nCREATE (:NS4_ns4p16:Bad {payload:{nested:1}});\n// @result unknown_variable_rejected\n// @expect Neo.ClientError.Statement.SyntaxError\nRETURN unknown.name AS name;\n// @result null_merge_key_rejected\n// @expect Neo.ClientError.Statement.SemanticError\nMERGE (:NS4_ns4p16:Person {person_id:null});\n// @result bad_pattern_syntax\n// @expect Neo.ClientError.Statement.SyntaxError\nMATCH (p:NS4_ns4p16:Person RETURN p.name;\n// @result valid_people_unchanged\nMATCH (p:NS4_ns4p16:Person) RETURN count(p) AS people;\n// @result missing_person\nMATCH (p:NS4_ns4p16:Person {person_id:'P99'}) RETURN p.name AS name;\n\n// Remove only this newly owned graph, then release its claim.\nMATCH (n:NS4_ns4p16) DETACH DELETE n;\nDROP CONSTRAINT di04000031_u4_ns4p16_owner;"}, "out": "nested_property_map_rejected: Neo.ClientError.Statement.TypeError (server rejection)\nunknown_variable_rejected: Neo.ClientError.Statement.SyntaxError (server rejection)\nnull_merge_key_rejected: Neo.ClientError.Statement.SemanticError (server rejection)\nbad_pattern_syntax: Neo.ClientError.Statement.SyntaxError (server rejection)\nvalid_people_unchanged: [{\"people\":6}]\nmissing_person: []\nScoped graph and constraints removed: true", "expl": {"en": "<p>All four failure codes come from the actual Neo4j server. A nested property map is not a valid stored property; an unbound variable/bad pattern is a syntax error; MERGE cannot use a null identifying property.</p><p>Six valid people remain and missing P99 returns an empty list. Error messages, internal IDs, timings and non-error notifications are not invented as stable output. This is a flexible property-graph model, not a Cassandra table with mandatory column types.</p>"}}], "diagrams": [{"id": "ns4_property", "title": {"en": "Property Graph: Nodes, Labels, Relationships and Properties"}, "file": "diagrams/ns4_property.svg"}, {"id": "ns4_direction", "title": {"en": "Stored Direction versus the Direction of a Read Pattern"}, "file": "diagrams/ns4_direction.svg"}, {"id": "ns4_setup", "title": {"en": "Desktop or Aura Setup versus the Executed Server Reference"}, "file": "diagrams/ns4_setup.svg"}, {"id": "ns4_browser", "title": {"en": "Browser Graph Entities versus Scalar Table Results"}, "file": "diagrams/ns4_browser.svg"}, {"id": "ns4_query", "title": {"en": "MATCH, WHERE, RETURN, ORDER BY and LIMIT"}, "file": "diagrams/ns4_query.svg"}, {"id": "ns4_merge", "title": {"en": "CREATE, MATCH and Complete-Pattern MERGE"}, "file": "diagrams/ns4_merge.svg"}, {"id": "ns4_delete", "title": {"en": "Relationship DELETE, Connected Rejection and DETACH"}, "file": "diagrams/ns4_delete.svg"}, {"id": "ns4_optional", "title": {"en": "OPTIONAL MATCH Preserves Rows with Nulls"}, "file": "diagrams/ns4_optional.svg"}, {"id": "ns4_identity", "title": {"en": "Business Uniqueness, Atomic Lab Claim and Statement Rollback"}, "file": "diagrams/ns4_identity.svg"}, {"id": "ns4_import", "title": {"en": "Actual JSON Parameters and UNWIND Import Verification"}, "file": "diagrams/ns4_import.svg"}, {"id": "ns4_social", "title": {"en": "Two-Hop Friend Candidates in the Six-Person Fixture"}, "file": "diagrams/ns4_social.svg"}, {"id": "ns4_movies", "title": {"en": "Unseen Movies Liked by Known People"}, "file": "diagrams/ns4_movies.svg"}, {"id": "ns4_fraud", "title": {"en": "Shared Devices Yield Review Candidates, Not Fraud Verdicts"}, "file": "diagrams/ns4_fraud.svg"}, {"id": "ns4_ai", "title": {"en": "Basic Query Examples versus Unimplemented AI/Algorithms"}, "file": "diagrams/ns4_ai.svg"}], "syntax": [{"title": {"en": "Tools, Graph Elements and Read Queries"}, "items": [{"name": {"en": "Verify the real server"}, "f": "CALL dbms.components() YIELD name,versions,edition\nRETURN name,versions,edition;\nRETURN 1 AS connected;", "terms": {"en": "Server metadata and connectivity checks. Also perform a stored write/read. Desktop, Browser, driver and server version numbers are different evidence."}}, {"name": {"en": "Property-graph pattern"}, "f": "(p:Person:Student {person_id:'P01'})\n(a)-[r:KNOWS {since:2024}]->(b)\n// Node labels may be multiple; relationship type is one.", "terms": {"en": "Pattern notation summary. Labels classify; properties describe; the arrow is the stored relationship direction. A label is not an automatic primary-key constraint."}}, {"name": {"en": "MATCH, WHERE and RETURN"}, "f": "MATCH (p:Person)\nWHERE p.city='Surat' AND p.age>=20\nRETURN p.person_id AS id,p.name AS name,p.age AS age\nORDER BY id;", "terms": {"en": "On the reference six-person fixture, the result is P01 Asha 20 and P05 Imran 20. Complete files add the explicit disposable scope label."}}, {"name": {"en": "Outgoing, incoming and undirected reads"}, "f": "(a)-[:KNOWS]->(b)  // outgoing from a\n(a)<-[:KNOWS]-(b)  // incoming to a\n(a)-[:KNOWS]-(b)   // read either orientation\n// Parentheses = nodes; brackets = relationship.", "terms": {"en": "The read pattern can ignore direction without changing stored arrows or creating reverse duplicate relationships."}}]}, {"title": {"en": "Ordering, Creation and Updates"}, "items": [{"name": {"en": "Sort, limit, distinct and grouping"}, "f": "MATCH (p:Person)\nRETURN p.person_id AS id,p.age AS age\nORDER BY age DESC,id ASC LIMIT 3;\nMATCH (p:Person)\nRETURN DISTINCT p.city AS city ORDER BY city;", "terms": {"en": "Use a tie-breaker for stable top rows. DISTINCT deduplicates returned values/tuples; LIMIT is not a bound on every traversal cost."}}, {"name": {"en": "CREATE versus identity MERGE"}, "f": "MERGE (p:Person {person_id:'P09'})\nON CREATE SET p.name='Jai',p.visits=1\nON MATCH SET p.visits=p.visits+1\nRETURN p.person_id,p.name,p.visits;", "terms": {"en": "First MERGE creates Jai/visits 1; the second matches and sets visits 2. Match the intended complete identity pattern and enforce appropriate uniqueness."}}, {"name": {"en": "SET and REMOVE"}, "f": "MATCH (p:Person {person_id:'P02'})\nSET p.city='Surat',p.age=22;\nMATCH (p:Person {person_id:'P02'}) REMOVE p.city;\nMATCH (p:Person {person_id:'P02'}) SET p:Graduate;\nMATCH (p:Person {person_id:'P02'}) REMOVE p:Graduate;", "terms": {"en": "Properties and labels can change without deleting the node. Missing MATCH plus SET is not an upsert. SET n=map replaces properties; SET n+=map changes supplied properties."}}, {"name": {"en": "Relationship/node deletion"}, "f": "MATCH (a:PracticePerson {person_id:'P01'})\n      -[r:KNOWS]->(:PracticePerson {person_id:'P02'})\nDELETE r;\n// An isolated node can be deleted without DETACH.\nMATCH (p:PracticePerson {person_id:'P01'}) DELETE p;\n// Preview the selected owned node before destructive DETACH.\nMATCH (p:PracticePerson {person_id:'P02'}) DETACH DELETE p;", "terms": {"en": "Plain connected-node DELETE is rejected; DELETE r preserves endpoints; DETACH DELETE removes the selected node and all its incident relationships. Preview and bound the owned scope."}}]}, {"title": {"en": "Nulls, Identity and Safe Data Input"}, "items": [{"name": {"en": "OPTIONAL MATCH and counts"}, "f": "MATCH (p:Person)\nOPTIONAL MATCH (p)-[:MENTORS]->(m:Person)\nRETURN count(*) AS rows,count(m) AS linked;", "terms": {"en": "The reference has six person rows and one non-null mentee. Optional-match predicates and later non-null filtering have different row-preservation effects."}}, {"name": {"en": "Business uniqueness"}, "f": "CREATE CONSTRAINT practice_person_id\nFOR (p:PracticePerson) REQUIRE p.person_id IS UNIQUE;\nSHOW CONSTRAINTS YIELD name,type,properties;\n// Drop ONLY a constraint that you created/own.\nDROP CONSTRAINT practice_person_id;", "terms": {"en": "Scope schema deliberately. Uniqueness has an index-backed implementation but alone does not require the property to exist; the example does not promise a timing speedup."}}, {"name": {"en": "Parameters are client-supplied values"}, "f": "// Browser/cypher-shell client command, not server Cypher:\n:param name => 'Asha'\n// Server query; $name is supplied separately by the client.\nMATCH (p:Person) WHERE p.name=$name\nRETURN p.person_id AS id,p.name AS name;", "terms": {"en": "The :param line is a client command. The Python runner instead sends a parameter dictionary; // @params annotations are ordinary comments, not server Cypher syntax."}}, {"name": {"en": "Actual fixture import"}, "f": "// $people is a client-supplied array of property maps.\nUNWIND $people AS row\nCREATE (p:PracticePerson) SET p=row;\n// A map can supply properties; it cannot be nested as\n// a stored map-valued property such as p.payload={x:1}.", "terms": {"en": "Program 15 supplies graph_fixture.json as driver parameters and really creates six people and six KNOWS edges. Verify every ID/property/endpoint/year, not only input length."}}]}, {"title": {"en": "Application Patterns and Evidence Boundaries"}, "items": [{"name": {"en": "Two-hop connection candidates"}, "f": "MATCH (me:Person {person_id:'P01'})\n      -[:KNOWS]-(:Person)-[:KNOWS]-(candidate:Person)\nWHERE candidate<>me AND NOT (me)-[:KNOWS]-(candidate)\nRETURN DISTINCT candidate.person_id AS id,\n       candidate.name AS name ORDER BY id;", "terms": {"en": "The fixture gives P04 Meera and P05 Imran. Exclude self/direct connections and deduplicate paths. This is an introductory pattern query, not a GDS algorithm or trained model."}}, {"name": {"en": "Unseen movie candidates"}, "f": "MATCH (me:Person {person_id:'P01'})\n      -[:KNOWS]-(friend:Person)-[:LIKES]->(m:Movie)\nWHERE NOT (me)-[:LIKES]->(m)\nRETURN DISTINCT m.movie_id AS id,m.title AS title\nORDER BY id;", "terms": {"en": "Returns M02 Database Stories and M03 Space Signals, excluding already-liked M01. This does not evaluate ranking quality or establish Netflix’s actual deployment."}}, {"name": {"en": "Shared-device review pairs"}, "f": "MATCH (a:Account)-[:USES_DEVICE]->(d:Device)\n      <-[:USES_DEVICE]-(b:Account)\nWHERE a.account_id<b.account_id\nRETURN d.device_id AS device,a.account_id AS account_a,\n       b.account_id AS account_b\nORDER BY device,account_a,account_b;", "terms": {"en": "D01 yields A01–A02, A01–A04 and A02–A04; single-account D02 yields no pair. A shared device is a review signal, not a fraud verdict."}}, {"name": {"en": "Algorithm and execution scope"}, "f": "EXECUTED: basic Cypher on private Community 5.26.32\nGUIDED: your own Desktop/Aura and Browser workflow\nCONCEPTUAL: graph-algorithm families and AI use cases\nNOT CLAIMED: GDS implementation, training or benchmarks", "terms": {"en": "Use actual observations in the journal. LinkedIn-like/Netflix-like are workload analogies, not verified company Neo4j deployment claims. No official theory-paper marks exist for this practical course."}}]}], "viva": [{"title": {"en": "Property-Graph Foundations"}, "items": [{"q": {"en": "What is Neo4j?"}, "a": {"en": "A graph database using a property-graph model: nodes, directed typed relationships, labels and properties, queried with Cypher."}}, {"q": {"en": "What does a node represent?"}, "a": {"en": "An entity such as a Person, Movie, Account or Device. Choose independently meaningful entities rather than making every scalar a separate node automatically."}}, {"q": {"en": "How many labels can a node have?"}, "a": {"en": "Zero to many. A Person can also be a Student; this is one node with multiple classifications, not two duplicated people."}}, {"q": {"en": "What is required of a stored relationship?"}, "a": {"en": "It connects source and target endpoints, has a direction and exactly one relationship type. Endpoints can be the same node, and properties are optional."}}, {"q": {"en": "Can a relationship have properties?"}, "a": {"en": "Yes. A KNOWS relationship may store since=2024; that value describes the connection rather than either endpoint’s identity."}}, {"q": {"en": "What are a path and a hop?"}, "a": {"en": "A path alternates nodes and relationships; one hop is one relationship step. Asha–Ravi–Meera is a two-hop example."}}, {"q": {"en": "Does a Person label automatically make person_id unique?"}, "a": {"en": "No. Labels classify nodes. Define an appropriate uniqueness constraint when business identity requires one."}}, {"q": {"en": "Does graph mean relational databases cannot store connections?"}, "a": {"en": "No. Relational systems can store and join related data. A graph is a workload/modeling choice when connection paths are central, not a universal replacement."}}]}, {"title": {"en": "Installation, Tools and Evidence"}, "items": [{"q": {"en": "Desktop versus Community Server?"}, "a": {"en": "Desktop is a local development/management application with its own developer-license edition/tooling. Community Server is the database edition actually used in this reference."}}, {"q": {"en": "What is AuraDB?"}, "a": {"en": "A managed Neo4j database service. The student uses an authorized account, checks tier/cost terms, saves credentials privately and follows the provided encrypted connection details."}}, {"q": {"en": "What is Neo4j Browser?"}, "a": {"en": "An interactive query/visualization client connecting to a database. It is not the storage engine, and opening it is not proof that a database write worked."}}, {"q": {"en": "Which versions were really tested?"}, "a": {"en": "Neo4j Community and Cypher Shell 5.26.32, official Python driver 5.28.8, Temurin Java 21.0.13+9 and Python 3.13.16 on Debian 13 x86_64."}}, {"q": {"en": "Was Desktop or Aura provisioned by the reference?"}, "a": {"en": "No. Those routes and Browser exploration are guided procedures. Actual evidence comes from the private Community server, real driver runs and matching Cypher Shell."}}, {"q": {"en": "What are the usual local Browser/Bolt ports?"}, "a": {"en": "Browser HTTP commonly uses 7474 and Bolt 7687. The private reference deliberately uses 7475 and 7688; use the actual settings of your own instance."}}, {"q": {"en": "Why is a stored write/read stronger than a version command?"}, "a": {"en": "It proves an authorized connection can store and retrieve the expected data. A client binary version alone does not establish a working server or storage round-trip."}}, {"q": {"en": "How should database credentials be handled?"}, "a": {"en": "Use a hidden prompt or private manager/environment, keep interfaces private and retain TLS verification for remote services. Do not embed passwords in shared code, public URIs, screenshots or submissions."}}]}, {"title": {"en": "Reading with Cypher"}, "items": [{"q": {"en": "What do MATCH, WHERE and RETURN do?"}, "a": {"en": "MATCH binds a graph pattern; WHERE restricts matches; RETURN selects entities/expressions and optionally aliases the output columns."}}, {"q": {"en": "What are parentheses, brackets and braces used for?"}, "a": {"en": "Parentheses describe nodes, square brackets describe relationships and braces contain property maps within a graph pattern."}}, {"q": {"en": "Is the variable p a permanent stored node name?"}, "a": {"en": "No. It is a query-local variable referring to matched/created elements. Carry needed variables through WITH when moving to a later pipeline stage."}}, {"q": {"en": "What happens for a valid missing-node match?"}, "a": {"en": "It returns no rows. That is different from an invalid query, undefined variable or syntax error."}}, {"q": {"en": "Does an undirected KNOWS read create reverse relationships?"}, "a": {"en": "No. It traverses either stored orientation for that query while leaving the graph unchanged."}}, {"q": {"en": "How do you make top-three output deterministic?"}, "a": {"en": "Use ORDER BY with an appropriate secondary business-ID tie-breaker, then LIMIT 3. Without ordering, do not promise a particular row sequence."}}, {"q": {"en": "What exactly does DISTINCT remove?"}, "a": {"en": "Duplicate returned values or tuples. It does not delete stored duplicate nodes and is not automatically the correct choice when the question counts paths."}}, {"q": {"en": "Does LIMIT 1 guarantee little query work?"}, "a": {"en": "No. Limiting returned rows is not a universal bound on scanning/expansion work. Use selective entry points and bounded patterns, then measure when necessary."}}]}, {"title": {"en": "Graph Writes and Deletion"}, "items": [{"q": {"en": "CREATE versus MATCH?"}, "a": {"en": "CREATE makes new elements; MATCH binds existing patterns. Missing MATCH does not automatically create a node."}}, {"q": {"en": "What is the exact role of MERGE?"}, "a": {"en": "It matches the complete specified pattern, otherwise creates it. ON CREATE/ON MATCH can perform branch-specific SET actions."}}, {"q": {"en": "Why is a changing name a poor identity MERGE component?"}, "a": {"en": "When that property changes, the whole pattern may not match and a new node can be attempted. Match a stable business identity and SET mutable attributes deliberately."}}, {"q": {"en": "Is MERGE alone a universal concurrent uniqueness guarantee?"}, "a": {"en": "No. Use an appropriate uniqueness constraint and consider transaction/concurrency requirements; the displayed two sequential MERGEs are not a concurrent load test."}}, {"q": {"en": "Does MATCH plus SET on P99 upsert a new person?"}, "a": {"en": "No. In the reference the missing match returns no rows and all six existing people remain, unlike ordinary Cassandra UPDATE’s missing-key upsert behaviour."}}, {"q": {"en": "SET n=map versus SET n+=map?"}, "a": {"en": "The first replaces all node properties; the second updates/merges the supplied properties. Labels are separate from the property map."}}, {"q": {"en": "What happens when a property is removed or set to null?"}, "a": {"en": "It is absent and a read of that property evaluates to null. Null is not stored as an ordinary property value."}}, {"q": {"en": "DELETE r, DELETE n and DETACH DELETE n?"}, "a": {"en": "DELETE r removes a selected relationship only. DELETE n requires no remaining incident relationships; DETACH DELETE n also removes all incident relationships, while other endpoints remain unless selected."}}]}, {"title": {"en": "Nulls, Identity, Transactions and Input"}, "items": [{"q": {"en": "Why use OPTIONAL MATCH?"}, "a": {"en": "To preserve already matched rows when an optional relationship/pattern is missing, returning null for the optional elements rather than discarding the row."}}, {"q": {"en": "count(*) versus count(mentee) in the reference?"}, "a": {"en": "There are six rows and one non-null mentee. count(*) counts all rows; count(mentee) ignores null."}}, {"q": {"en": "Does uniqueness require the property to exist?"}, "a": {"en": "No. The demonstrated Community uniqueness rule accepts a Person without person_id; required-property/key/type rules have separate edition/version requirements."}}, {"q": {"en": "What does P98 count 0 after the duplicate prove?"}, "a": {"en": "The valid P98 creation and conflicting P01 creation were in one failed statement transaction; P98 was rolled back. It does not prove that all earlier separate statements were undone."}}, {"q": {"en": "Is the entire runner file one transaction?"}, "a": {"en": "No. Each statement is an implicit auto-commit transaction. Finally cleanup is an owned lab safeguard, not a replacement for application transaction design or backups."}}, {"q": {"en": "Why use query parameters?"}, "a": {"en": "To keep the query structure fixed and supply values separately. The selector-shaped name remains a literal value rather than becoming an injected WHERE clause."}}, {"q": {"en": "Are :param and // @params the same as native Cypher?"}, "a": {"en": "No. :param is a client command; // @params is a comment interpreted by this Python runner. A native query uses the supplied value through $name."}}, {"q": {"en": "Can a map be a stored property because UNWIND uses maps?"}, "a": {"en": "No. A parameter/query map can supply valid primitive properties via SET n=map, but nested map-valued properties are rejected with a real TypeError."}}]}, {"title": {"en": "Recommendation, Banking and AI Examples"}, "items": [{"q": {"en": "Who are Asha’s two-hop candidates?"}, "a": {"en": "Meera/P04 and Imran/P05, after excluding Asha and her direct connections and applying DISTINCT. Dev/P06 is three hops away in this fixture."}}, {"q": {"en": "Why can Meera otherwise appear twice?"}, "a": {"en": "Two different two-hop routes reach her: through Ravi and through Neha. Deduplicate only when the desired output is a distinct candidate rather than a path count."}}, {"q": {"en": "Which movies are unseen candidates for Asha?"}, "a": {"en": "M02 Database Stories and M03 Space Signals, liked by known people and not already liked by Asha. M01 Graph Journeys is excluded."}}, {"q": {"en": "Does the movie example train a recommender?"}, "a": {"en": "No. It is a transparent basic pattern lookup. There is no trained model, graph-algorithm implementation, ranking-quality result or latency claim."}}, {"q": {"en": "Do the LinkedIn/Netflix examples establish those companies use Neo4j?"}, "a": {"en": "No. They are syllabus-named workload analogies. A claim about an actual company deployment would need verified primary evidence and is not made here."}}, {"q": {"en": "Which device/accounts generate review pairs?"}, "a": {"en": "D01 has A01, A02 and A04, giving A01–A02, A01–A04 and A02–A04. D02 has only A03 and generates no shared pair."}}, {"q": {"en": "Why is a shared device not a fraud verdict?"}, "a": {"en": "Legitimate family/public-device usage, reassignment and data errors can create overlaps. Context, consent, false-positive evaluation and human review are essential."}}, {"q": {"en": "Are graph algorithms or GDS implemented in this unit?"}, "a": {"en": "No. Similarity, centrality, community detection, path finding and link-prediction ideas are conceptual examples. Only introductory Cypher patterns are executed; no GDS algorithm or mathematical proof is implemented."}}]}, {"title": {"en": "Practical Safety, Verification and Assessment"}, "items": [{"q": {"en": "What exactly is imported in program 15?"}, "a": {"en": "The actual JSON people/friendships arrays: six people with ID/name/city/age, then six KNOWS edges with endpoints/since. Movie/banking arrays are present but used separately, not imported by that program."}}, {"q": {"en": "Why compare every imported element instead of a count only?"}, "a": {"en": "Correct counts can hide wrong properties or edges. Verify each business ID/value and each source/target/year triple against the synthetic input."}}, {"q": {"en": "What does the fresh ownership constraint protect?"}, "a": {"en": "Its uniquely named CREATE is an atomic namespace claim. Ownership begins only after success; a pre-existing or failed claim must not authorize removing somebody else’s scope/schema."}}, {"q": {"en": "Why not use IF NOT EXISTS for the ownership claim?"}, "a": {"en": "A non-creating success could mean the object already belonged to another run. It would not establish new cleanup ownership."}}, {"q": {"en": "Is this runner a general Cypher security sandbox?"}, "a": {"en": "No. It guards trusted prepared teaching files and captured scope cleanup; arbitrary untrusted Cypher requires a different security/authorization design."}}, {"q": {"en": "Does visible deletion prove immediate disk erasure?"}, "a": {"en": "No. Logical deletion and space reuse are not an immediate physical-byte-erasure guarantee, nor is a normal delete an undo/backup mechanism."}}, {"q": {"en": "What must the Practical 7–8 journal distinguish?"}, "a": {"en": "Your actual Desktop/Aura/Browser setup/observations, the executed reference server output, synthetic inputs, positive/negative queries, candidate/AI limits and owned cleanup. Never label guided GUI steps as performed evidence."}}, {"q": {"en": "What is the official assessment and which unit covers Redis?"}, "a": {"en": "Theory ESE/PA 0; course practical PA 20 plus ESE 30 gives 50. Tasks have no invented theory-paper marks. This is the Neo4j unit; Redis is covered separately in Unit 5."}}]}], "exam_questions": [], "lesson_count": 20, "practice_task_count": 18, "practical_numbers": [7, 8], "learning_outcomes": [{"en": "Utilize Neo4j to solve relationship-based problems with graph queries (CO4)."}], "content_kind": "real_neo4j_practical", "assessment_note": {"en": "Practical PA 20 + ESE 30 = 50 for the course; theory ESE/PA 0. Twenty percent is content weightage, not an invented theory-paper or per-question allocation."}, "runtime_evidence": {"server": "Neo4j", "server_version": "5.26.32", "edition": "community", "shell": "Cypher Shell", "shell_version": "5.26.32", "driver": "official Python neo4j", "driver_version": "5.28.8", "bolt_protocol": "5.8", "java": "Temurin 21.0.13+9", "python": "3.13.16", "os": "Debian 13 x86_64", "authenticated": true, "password_change_required": false, "anonymous_rejection": "Neo.ClientError.Security.Unauthorized", "factory_password_rejection": "Neo.ClientError.Security.Unauthorized", "physical_instances": 1, "public_database_endpoint": false, "desktop_installed": false, "aura_provisioned": false, "browser_ui_automated": false, "cypher_shell_connection_verified": true, "server_usage_reporting": false, "driver_telemetry": false, "graph_algorithm_library_installed": false, "graph_algorithms_implemented": false, "model_trained": false, "company_deployments_verified": false, "cluster_failover_tested": false, "performance_benchmarked": false, "programs_executed": 16, "execution_client": "Official Python driver over real Bolt; separate matching Cypher Shell connectivity proof", "output_origin": "Actual returned rows and summary counters; JSON preserves row order; temporal display ISO UTC; internal IDs/timings/non-error notifications not published as stable output", "transaction_scope": "Each statement is an implicit auto-commit transaction; not whole-file atomicity", "cleanup_scope": "Atomic fresh named constraint claim; only captured owned nodes and successfully created constraints removed", "business_index_observation": "ONLINE", "fixture": {"file": "graph_fixture.json", "synthetic": true, "sha256": "add007d124e93d642ae2b043a0d5bd9d02b870be8e182a243113c76ae8491921", "imported_social_people": 6, "imported_social_relationships": 6, "actual_json_parameter_import": true, "all_person_ids_values_match": true, "all_relationship_endpoints_years_match": true, "live_ingestion": false, "movie_banking_sections_imported_by_program15": false}}, "sources": [{"title": "GTU DI04000031 syllabus, effective 2025–26", "url": "https://s3-ap-southeast-1.amazonaws.com/gtusitecirculars/Syallbus/DI04000031.pdf"}, {"title": "Neo4j property-graph concepts", "url": "https://neo4j.com/docs/getting-started/appendix/graphdb-concepts/"}, {"title": "Neo4j deployment choices and releases", "url": "https://neo4j.com/deployment-center/"}, {"title": "Neo4j 5 system and Java requirements", "url": "https://neo4j.com/docs/operations-manual/5/installation/requirements/"}, {"title": "Neo4j 5 Linux tarball installation", "url": "https://neo4j.com/docs/operations-manual/5/installation/linux/tarball/"}, {"title": "Neo4j Desktop installation", "url": "https://neo4j.com/docs/desktop/current/installation/"}, {"title": "Aura: create an instance", "url": "https://neo4j.com/docs/aura/getting-started/create-instance/"}, {"title": "Neo4j Browser: connect to an instance", "url": "https://neo4j.com/docs/browser/operations/dbms-connection/"}, {"title": "Cypher Shell client guide — reference client 5.26.32", "url": "https://neo4j.com/docs/operations-manual/current/cypher-shell/"}, {"title": "Cypher 5 MATCH", "url": "https://neo4j.com/docs/cypher-manual/5/clauses/match/"}, {"title": "Cypher 5 CREATE", "url": "https://neo4j.com/docs/cypher-manual/5/clauses/create/"}, {"title": "Cypher 5 MERGE", "url": "https://neo4j.com/docs/cypher-manual/5/clauses/merge/"}, {"title": "Cypher 5 SET", "url": "https://neo4j.com/docs/cypher-manual/5/clauses/set/"}, {"title": "Cypher 5 DELETE", "url": "https://neo4j.com/docs/cypher-manual/5/clauses/delete/"}, {"title": "Cypher 5 OPTIONAL MATCH", "url": "https://neo4j.com/docs/cypher-manual/5/clauses/optional-match/"}, {"title": "Cypher 5 constraints and edition boundaries", "url": "https://neo4j.com/docs/cypher-manual/5/constraints/"}, {"title": "Cypher 5 parameters", "url": "https://neo4j.com/docs/cypher-manual/5/syntax/parameters/"}, {"title": "Neo4j Graph Data Science algorithm families — conceptual reference only", "url": "https://neo4j.com/docs/graph-data-science/current/algorithms/"}]};

eight=\"normal\">NODE properties: person_id, name, age</text><text x=\"180\" y=\"263.7\" font-size=\"10.7\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">A label does not automatically make an ID unique.</text><rect x=\"18\" y=\"306\" width=\"324\" height=\"95\" rx=\"9\" fill=\"#F3ECFB\" stroke=\"#7B2CD9\" stroke-width=\"1.4\"/><text x=\"180\" y=\"334.0\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">RELATIONSHIP type: exactly one, KNOWS</text><text x=\"180\" y=\"358.0\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">Stored direction: Asha -&gt; Ravi</text><text x=\"180\" y=\"382.0\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">RELATIONSHIP property: since = 2024</text><text x=\"180\" y=\"442.7\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#625B71\" font-weight=\"normal\">Each relationship has source and target endpoints.</text><text x=\"180\" y=\"458.7\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#625B71\" font-weight=\"normal\">The endpoints may even be the same node.</text><text x=\"180\" y=\"474.7\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#625B71\" font-weight=\"normal\">Use business identity rules, not internal IDs.</text></svg>", "ns4_direction": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 498\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"498\" fill=\"#ffffff\"/><text x=\"180\" y=\"27.2\" font-size=\"15\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">Stored arrows, chosen read pattern</text><text x=\"180\" y=\"48.7\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#625B71\" font-weight=\"normal\">All three read patterns leave the data unchanged</text><rect x=\"18\" y=\"68\" width=\"324\" height=\"103\" rx=\"9\" fill=\"#EAF3FE\" stroke=\"#1565C0\" stroke-width=\"1.4\"/><text x=\"180\" y=\"94.2\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1565C0\" font-weight=\"bol \" font-size=\"12\" text-anchor=\"middle\" fill=\"#2E7D32\" font-weight=\"bold\">MERGE P09: first execution</text><text x=\"180\" y=\"330.8\" font-size=\"10.8\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">Not found -&gt; create Jai, visits 1</text><rect x=\"18\" y=\"375\" width=\"324\" height=\"79\" rx=\"9\" fill=\"#FFF4DF\" stroke=\"#AA5C00\" stroke-width=\"1.4\"/><text x=\"180\" y=\"402.2\" font-size=\"12\" text-anchor=\"middle\" fill=\"#AA5C00\" font-weight=\"bold\">MERGE P09: second execution</text><text x=\"180\" y=\"432.8\" font-size=\"10.8\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">Found -&gt; ON MATCH sets visits 2</text><text x=\"180\" y=\"487.7\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#625B71\" font-weight=\"normal\">MERGE matches the whole specified pattern.</text><text x=\"180\" y=\"503.7\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#625B71\" font-weight=\"normal\">A changing name is a poor identity component.</text></svg>", "ns4_delete": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 485\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"485\" fill=\"#ffffff\"/><text x=\"180\" y=\"27.2\" font-size=\"15\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">Deletion has a graph scope</text><text x=\"180\" y=\"48.7\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#625B71\" font-weight=\"normal\">Preview the match; use only owned disposable data</text><rect x=\"18\" y=\"70\" width=\"324\" height=\"88\" rx=\"9\" fill=\"#FDECEA\" stroke=\"#B3261E\" stroke-width=\"1.4\"/><text x=\"180\" y=\"98.2\" font-size=\"12\" text-anchor=\"middle\" fill=\"#B3261E\" font-weight=\"bold\">DELETE connected node</text><text x=\"180\" y=\"130.7\" font-size=\"10.7\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">Rejected while incident relationships remain</text><rect x=\"18\" y=\"184\" width=\"324\" height=\"88\" rx=\"9\" fill=\"#EAF3FE\" stroke=\"#1565C0\" stroke-w
