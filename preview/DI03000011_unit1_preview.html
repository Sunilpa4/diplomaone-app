<script>
const U = {"subject": "DI03000011", "unit": 1, "format": "notes", "title": {"en": "Number Systems and Binary Codes", "gu": "Number Systems અને Binary Codes"}, "weightage": 20, "hours": 6, "notes": [{"title": {"en": "1.1 Introduction to Digital Systems", "gu": "1.1 Digital Systems નો પરિચય"}, "items": [{"h": {"en": "1.1.1 Analog and Digital Signals", "gu": "1.1.1 Analog અને Digital Signals"}, "body": {"en": "<p>A <b>signal</b> is a physical quantity (usually voltage) that carries information. Signals are of two types:</p>\n<h4>Analog signal</h4>\n<p>An <b>analog signal</b> is a <b>continuous</b> signal. It can have <b>any (infinite) value</b> within a range, and it changes smoothly with time.</p>\n<p><i>Examples:</i> output of a microphone, temperature, sound, a sine wave from a signal generator, a needle-type (analog) meter.</p>\n<h4>Digital signal</h4>\n<p>A <b>digital signal</b> is a <b>discrete</b> signal. It has only <b>two levels</b>: HIGH (logic <b>1</b>, e.g. +5 V) and LOW (logic <b>0</b>, e.g. 0 V). It changes in steps, not smoothly.</p>\n<p><i>Examples:</i> data inside a computer, output of a digital clock, signals on a USB cable.</p>\n<h4>Comparison</h4>\n<table><tr><th>Point</th><th>Analog</th><th>Digital</th></tr>\n<tr><td>Nature</td><td>Continuous</td><td>Discrete (0 and 1)</td></tr>\n<tr><td>Values</td><td>Infinite</td><td>Only two</td></tr>\n<tr><td>Effect of noise</td><td>High</td><td>Low</td></tr>\n<tr><td>Accuracy</td><td>Lower</td><td>High</td></tr>\n<tr><td>Storage</td><td>Difficult</td><td>Easy (memory)</td></tr>\n<tr><td>Circuit</td><td>Amplifier, filter</td><td>Logic gates, flip-flops</td></tr>\n<tr><td>Example</td><td>Analog watch, thermometer</td><td>Digital watch, computer</td></tr></table>", "gu": "<p><b>Signal</b> એ એવી physical quantity (સામાન્ય રીતે voltage) છે જે માહિતી લઈ જાય છે. Signals બે પ્રકારના હોય છે:</p>\n<h4>Analog signal</h4>\n<p><b>Analog signal</b> એ <b>સતત (continuous)</b> signal છે. તે range ની અંદર <b>કોઈ પણ (અનંત) કિંમત</b> લઈ શકે છે અને સમય સાથે ધીમે ધીમે (smoothly) બદલાય છે.</p>\n<p><i>ઉદાહરણ:</i> microphone નું output, તાપમાન, અવાજ, signal generator માંથી મળતી sine wave, સોયવાળું (analog) meter.</p>\n<h4>Digital signal</h4>\n<p><b>Digital signal</b> એ <b>discrete (અલગ-અલગ)</b> signal છે. તેમાં માત્ર <b>બે levels</b> હોય છે: HIGH (logic <b>1</b>, દા.ત. +5 V) અને LOW (logic <b>0</b>, દા.ત. 0 V). તે smoothly નહીં પણ steps માં બદલાય છે.</p>\n<p><i>ઉદાહરણ:</i> computer ની અંદરનો data, digital clock નું output, USB cable પરના signals.</p>\n<h4>સરખામણી</h4>\n<table><tr><th>મુદ્દો</th><th>Analog</th><th>Digital</th></tr>\n<tr><td>પ્રકૃતિ</td><td>Continuous</td><td>Discrete (0 અને 1)</td></tr>\n<tr><td>કિંમતો</td><td>અનંત</td><td>માત્ર બે</td></tr>\n<tr><td>Noise ની અસર</td><td>વધુ</td><td>ઓછી</td></tr>\n<tr><td>ચોકસાઈ</td><td>ઓછી</td><td>વધુ</td></tr>\n<tr><td>Storage</td><td>અઘરું</td><td>સરળ (memory)</td></tr>\n<tr><td>Circuit</td><td>Amplifier, filter</td><td>Logic gates, flip-flops</td></tr>\n<tr><td>ઉદાહરણ</td><td>Analog ઘડિયાળ, thermometer</td><td>Digital ઘડિયાળ, computer</td></tr></table>"}, "diagram": "de1_analog_digital", "key": true}, {"h": {"en": "1.1.2 Digital System and its Applications", "gu": "1.1.2 Digital System અને તેના ઉપયોગો"}, "body": {"en": "<p>A <b>digital system</b> is a combination of electronic circuits that <b>accepts, processes, stores and outputs information in binary form</b> (0 and 1).</p>\n<h4>Parts of a digital system</h4>\n<ol>\n<li><b>Input unit:</b> gives data to the system, e.g. keyboard, switches, sensors. An analog input is first converted to digital by an <b>ADC</b> (Analog-to-Digital Converter).</li>\n<li><b>Processing unit:</b> performs logical and arithmetic operations using <b>logic gates, flip-flops, counters, registers, processor and memory</b>.</li>\n<li><b>Output unit:</b> gives the result, e.g. display, LEDs, printer. A <b>DAC</b> (Digital-to-Analog Converter) is used when an analog output (such as sound) is needed.</li>\n</ol>\n<h4>Applications</h4>\n<ul>\n<li>Computers, laptops, servers and calculators</li>\n<li>Mobile phones, digital cameras, smart TVs</li>\n<li>Digital watches, digital multimeters, weighing machines</li>\n<li>ATMs, traffic-light controllers, washing machines (microcontrollers)</li>\n<li>Digital communication: internet, satellite, digital TV, Wi-Fi</li>\n</ul>", "gu": "<p><b>Digital system</b> એ electronic circuits નું એવું જૂથ છે જે માહિતીને <b>binary સ્વરૂપમાં (0 અને 1) લે છે, process કરે છે, store કરે છે અને output આપે છે</b>.</p>\n<h4>Digital system ના ભાગો</h4>\n<ol>\n<li><b>Input unit:</b> system ને data આપે છે, દા.ત. keyboard, switches, sensors. Analog input ને પહેલાં <b>ADC</b> (Analog-to-Digital Converter) દ્વારા digital માં ફેરવવામાં આવે છે.</li>\n<li><b>Processing unit:</b> <b>logic gates, flip-flops, counters, registers, processor અને memory</b> ની મદદથી logical અને arithmetic operations કરે છે.</li>\n<li><b>Output unit:</b> પરિણામ આપે છે, દા.ત. display, LEDs, printer. Analog output (જેમ કે અવાજ) જોઈએ ત્યારે <b>DAC</b> (Digital-to-Analog Converter) વપરાય છે.</li>\n</ol>\n<h4>ઉપયોગો (Applications)</h4>\n<ul>\n<li>Computers, laptops, servers અને calculators</li>\n<li>Mobile phones, digital cameras, smart TVs</li>\n<li>Digital ઘડિયાળ, digital multimeter, વજન કાંટા</li>\n<li>ATM, traffic-light controller, washing machine (microcontrollers)</li>\n<li>Digital communication: internet, satellite, digital TV, Wi-Fi</li>\n</ul>"}, "diagram": "de1_digital_system"}, {"h": {"en": "1.1.3 Advantages and Disadvantages of Digital Systems", "gu": "1.1.3 Digital Systems ના ફાયદા અને ગેરફાયદા"}, "body": {"en": "<h4>Advantages</h4>\n<ol>\n<li><b>Less affected by noise:</b> only two levels have to be recognised, so small noise does not change the data.</li>\n<li><b>High accuracy and precision:</b> accuracy can be increased simply by using more bits.</li>\n<li><b>Easy storage:</b> data can be stored for a long time in memory (RAM, ROM, flash, hard disk).</li>\n<li><b>Programmable:</b> the operation can be changed by changing the program (software), without changing hardware.</li>\n<li><b>Easy design:</b> only switching circuits (ON/OFF) are needed; exact voltage values are not important.</li>\n<li><b>Integration:</b> millions of gates can be put on one IC chip, so systems are small, cheap and reliable.</li>\n<li><b>Error detection and correction</b> is possible using codes (parity, Hamming code).</li>\n</ol>\n<h4>Disadvantages</h4>\n<ol>\n<li>The real world is <b>analog</b>; so ADC and DAC are needed, which increases cost and delay.</li>\n<li>Converting analog to digital causes <b>quantisation error</b> (some information is lost).</li>\n<li>Digital circuits use more power at high speed, and need more bandwidth for transmission.</li>\n</ol>", "gu": "<h4>ફાયદા (Advantages)</h4>\n<ol>\n<li><b>Noise ની ઓછી અસર:</b> માત્ર બે levels ઓળખવાના હોય છે, તેથી નાનો noise data બદલી શકતો નથી.</li>\n<li><b>વધુ ચોકસાઈ (accuracy):</b> વધુ bits વાપરીને સહેલાઈથી ચોકસાઈ વધારી શકાય છે.</li>\n<li><b>સરળ storage:</b> data ને memory (RAM, ROM, flash, hard disk) માં લાંબા સમય સુધી store કરી શકાય છે.</li>\n<li><b>Programmable:</b> hardware બદલ્યા વગર માત્ર program (software) બદલીને કાર્ય બદલી શકાય છે.</li>\n<li><b>સરળ design:</b> માત્ર switching circuits (ON/OFF) જોઈએ; ચોક્કસ voltage કિંમત મહત્વની નથી.</li>\n<li><b>Integration:</b> એક IC chip પર લાખો gates મૂકી શકાય છે, તેથી systems નાના, સસ્તા અને વિશ્વસનીય બને છે.</li>\n<li>Codes (parity, Hamming code) વડે <b>error detection અને correction</b> શક્ય છે.</li>\n</ol>\n<h4>ગેરફાયદા (Disadvantages)</h4>\n<ol>\n<li>વાસ્તવિક દુનિયા <b>analog</b> છે; તેથી ADC અને DAC જોઈએ, જેનાથી cost અને delay વધે છે.</li>\n<li>Analog ને digital માં ફેરવતાં <b>quantisation error</b> આવે છે (થોડી માહિતી ગુમાય છે).</li>\n<li>વધુ speed પર digital circuits વધુ power વાપરે છે અને transmission માટે વધુ bandwidth જોઈએ છે.</li>\n</ol>"}, "key": true}, {"h": {"en": "1.1.4 Bit, Nibble, Byte and Word", "gu": "1.1.4 Bit, Nibble, Byte અને Word"}, "body": {"en": "<ul>\n<li><b>Bit</b> (<b>Bi</b>nary digi<b>t</b>): a single 0 or 1. It is the smallest unit of information.</li>\n<li><b>Nibble:</b> a group of <b>4 bits</b>, e.g. 1011. One hexadecimal digit = one nibble.</li>\n<li><b>Byte:</b> a group of <b>8 bits</b>, e.g. 1011 0110. One character (ASCII) is stored in one byte.</li>\n<li><b>Word:</b> the number of bits a processor handles at one time, e.g. 16, 32 or 64 bits.</li>\n</ul>\n<p><b>MSB</b> (Most Significant Bit) is the left-most bit with the highest weight; <b>LSB</b> (Least Significant Bit) is the right-most bit with the lowest weight.</p>\n<p>With <b>n bits</b>, 2<sup>n</sup> different combinations are possible (0 to 2<sup>n</sup> − 1). For example, 4 bits give 16 combinations (0 to 15) and 8 bits give 256 (0 to 255).</p>\n<p><i>Memory units:</i> 1 KB = 1024 bytes, 1 MB = 1024 KB, 1 GB = 1024 MB, 1 TB = 1024 GB.</p>", "gu": "<ul>\n<li><b>Bit</b> (<b>Bi</b>nary digi<b>t</b>): એક 0 અથવા 1. તે માહિતીનો સૌથી નાનો એકમ છે.</li>\n<li><b>Nibble:</b> <b>4 bits</b> નું જૂથ, દા.ત. 1011. એક hexadecimal digit = એક nibble.</li>\n<li><b>Byte:</b> <b>8 bits</b> નું જૂથ, દા.ત. 1011 0110. એક character (ASCII) એક byte માં store થાય છે.</li>\n<li><b>Word:</b> processor એક સાથે જેટલા bits પર કામ કરે તે, દા.ત. 16, 32 અથવા 64 bits.</li>\n</ul>\n<p><b>MSB</b> (Most Significant Bit) એ સૌથી ડાબી બાજુનો અને સૌથી વધુ weight વાળો bit છે; <b>LSB</b> (Least Significant Bit) એ સૌથી જમણી બાજુનો અને સૌથી ઓછા weight વાળો bit છે.</p>\n<p><b>n bits</b> વડે 2<sup>n</sup> જુદા જુદા combinations શક્ય છે (0 થી 2<sup>n</sup> − 1). દા.ત. 4 bits થી 16 combinations (0 થી 15) અને 8 bits થી 256 (0 થી 255) મળે.</p>\n<p><i>Memory units:</i> 1 KB = 1024 bytes, 1 MB = 1024 KB, 1 GB = 1024 MB, 1 TB = 1024 GB.</p>"}}]}, {"title": {"en": "1.2 Number Systems", "gu": "1.2 Number Systems"}, "items": [{"h": {"en": "1.2.1 Number System, Base and Positional Weight", "gu": "1.2.1 Number System, Base અને Positional Weight"}, "body": {"en": "<p>A <b>number system</b> is a method of representing numbers using a set of symbols (digits).</p>\n<ul>\n<li><b>Base or radix (r):</b> the number of different digits used in the system. Digits go from 0 to (r − 1).</li>\n<li><b>Positional (weighted) system:</b> the value of a digit depends on its <b>position</b>. Each position has a <b>weight</b> = r<sup>position</sup>.</li>\n</ul>\n<p>For a number with integer digits d<sub>n−1</sub> … d<sub>1</sub> d<sub>0</sub> and fraction digits d<sub>−1</sub> d<sub>−2</sub> …:</p>\n<p style=\"text-align:center\"><b>Value = d<sub>n−1</sub>×r<sup>n−1</sup> + … + d<sub>1</sub>×r<sup>1</sup> + d<sub>0</sub>×r<sup>0</sup> + d<sub>−1</sub>×r<sup>−1</sup> + d<sub>−2</sub>×r<sup>−2</sup> + …</b></p>\n<p>Positions to the left of the point are 0, 1, 2 …; positions to the right are −1, −2, −3 …</p>\n<p>The base is written as a subscript to avoid confusion: (101)<sub>2</sub>, (101)<sub>8</sub>, (101)<sub>10</sub> and (101)<sub>16</sub> are four different values (5, 65, 101 and 257).</p>\n<h4>Four number systems used in digital electronics</h4>\n<table><tr><th>System</th><th>Base</th><th>Digits</th></tr>\n<tr><td>Binary</td><td>2</td><td>0, 1</td></tr>\n<tr><td>Octal</td><td>8</td><td>0 to 7</td></tr>\n<tr><td>Decimal</td><td>10</td><td>0 to 9</td></tr>\n<tr><td>Hexadecimal</td><td>16</td><td>0 to 9, A to F</td></tr></table>", "gu": "<p><b>Number system</b> એ symbols (digits) ના સમૂહ વડે સંખ્યાઓ દર્શાવવાની પદ્ધતિ છે.</p>\n<ul>\n<li><b>Base અથવા radix (r):</b> system માં વપરાતા જુદા જુદા digits ની સંખ્યા. Digits 0 થી (r − 1) સુધી હોય છે.</li>\n<li><b>Positional (weighted) system:</b> digit ની કિંમત તેના <b>સ્થાન (position)</b> પર આધાર રાખે છે. દરેક position નું <b>weight</b> = r<sup>position</sup>.</li>\n</ul>\n<p>Integer digits d<sub>n−1</sub> … d<sub>1</sub> d<sub>0</sub> અને fraction digits d<sub>−1</sub> d<sub>−2</sub> … વાળી સંખ્યા માટે:</p>\n<p style=\"text-align:center\"><b>કિંમત = d<sub>n−1</sub>×r<sup>n−1</sup> + … + d<sub>1</sub>×r<sup>1</sup> + d<sub>0</sub>×r<sup>0</sup> + d<sub>−1</sub>×r<sup>−1</sup> + d<sub>−2</sub>×r<sup>−2</sup> + …</b></p>\n<p>Point ની ડાબી બાજુના positions 0, 1, 2 … અને જમણી બાજુના positions −1, −2, −3 … છે.</p>\n<p>ગૂંચવણ ટાળવા base ને subscript માં લખાય છે: (101)<sub>2</sub>, (101)<sub>8</sub>, (101)<sub>10</sub> અને (101)<sub>16</sub> ચાર અલગ કિંમતો છે (5, 65, 101 અને 257).</p>\n<h4>Digital electronics માં વપરાતી ચાર number systems</h4>\n<table><tr><th>System</th><th>Base</th><th>Digits</th></tr>\n<tr><td>Binary</td><td>2</td><td>0, 1</td></tr>\n<tr><td>Octal</td><td>8</td><td>0 થી 7</td></tr>\n<tr><td>Decimal</td><td>10</td><td>0 થી 9</td></tr>\n<tr><td>Hexadecimal</td><td>16</td><td>0 થી 9, A થી F</td></tr></table>"}, "diagram": "de1_number_systems", "key": true}, {"h": {"en": "1.2.2 Decimal Number System", "gu": "1.2.2 Decimal Number System"}, "body": {"en": "<p>The <b>decimal</b> system has base <b>10</b> and uses ten digits <b>0, 1, 2, … 9</b>. It is the system we use in daily life.</p>\n<p>Weights of positions: … 10<sup>3</sup>=1000, 10<sup>2</sup>=100, 10<sup>1</sup>=10, 10<sup>0</sup>=1 . 10<sup>−1</sup>=0.1, 10<sup>−2</sup>=0.01 …</p>\n<p><b>Example:</b> (526.34)<sub>10</sub> = 5×10<sup>2</sup> + 2×10<sup>1</sup> + 6×10<sup>0</sup> + 3×10<sup>−1</sup> + 4×10<sup>−2</sup> = 500 + 20 + 6 + 0.3 + 0.04</p>\n<p>Digital circuits cannot easily work with ten voltage levels, so the decimal system is <b>not used directly inside</b> digital systems. Decimal numbers are converted to binary (or coded in BCD).</p>", "gu": "<p><b>Decimal</b> system નો base <b>10</b> છે અને તેમાં દસ digits <b>0, 1, 2, … 9</b> વપરાય છે. આ system આપણે રોજિંદા જીવનમાં વાપરીએ છીએ.</p>\n<p>Positions ના weights: … 10<sup>3</sup>=1000, 10<sup>2</sup>=100, 10<sup>1</sup>=10, 10<sup>0</sup>=1 . 10<sup>−1</sup>=0.1, 10<sup>−2</sup>=0.01 …</p>\n<p><b>ઉદાહરણ:</b> (526.34)<sub>10</sub> = 5×10<sup>2</sup> + 2×10<sup>1</sup> + 6×10<sup>0</sup> + 3×10<sup>−1</sup> + 4×10<sup>−2</sup> = 500 + 20 + 6 + 0.3 + 0.04</p>\n<p>Digital circuits માટે દસ voltage levels સાથે કામ કરવું અઘરું છે, તેથી decimal system digital systems ની <b>અંદર સીધી વપરાતી નથી</b>. Decimal સંખ્યાઓને binary માં ફેરવાય છે (અથવા BCD માં code કરાય છે).</p>"}}, {"h": {"en": "1.2.3 Binary Number System", "gu": "1.2.3 Binary Number System"}, "body": {"en": "<p>The <b>binary</b> system has base <b>2</b> and uses only two digits, <b>0 and 1</b>. Each binary digit is called a <b>bit</b>.</p>\n<p>Weights of positions: … 2<sup>4</sup>=16, 2<sup>3</sup>=8, 2<sup>2</sup>=4, 2<sup>1</sup>=2, 2<sup>0</sup>=1 . 2<sup>−1</sup>=0.5, 2<sup>−2</sup>=0.25, 2<sup>−3</sup>=0.125 …</p>\n<p><b>Example:</b> (1101.101)<sub>2</sub> = 8 + 4 + 0 + 1 + 0.5 + 0 + 0.125 = <b>(13.625)<sub>10</sub></b></p>\n<h4>Why binary is used in digital systems</h4>\n<ul>\n<li>Electronic devices have two natural states: switch ON/OFF, transistor saturation/cut-off, LED ON/OFF, high/low voltage.</li>\n<li>Circuits for two states are <b>simple, cheap and reliable</b>, and less affected by noise.</li>\n<li>Binary arithmetic and logic (Boolean algebra) are very simple.</li>\n</ul>\n<p><b>Disadvantage:</b> binary numbers are long (e.g. 255 = 11111111), so they are hard for humans to read. Octal and hexadecimal are used as short forms.</p>", "gu": "<p><b>Binary</b> system નો base <b>2</b> છે અને તેમાં માત્ર બે digits <b>0 અને 1</b> વપરાય છે. દરેક binary digit ને <b>bit</b> કહે છે.</p>\n<p>Positions ના weights: … 2<sup>4</sup>=16, 2<sup>3</sup>=8, 2<sup>2</sup>=4, 2<sup>1</sup>=2, 2<sup>0</sup>=1 . 2<sup>−1</sup>=0.5, 2<sup>−2</sup>=0.25, 2<sup>−3</sup>=0.125 …</p>\n<p><b>ઉદાહરણ:</b> (1101.101)<sub>2</sub> = 8 + 4 + 0 + 1 + 0.5 + 0 + 0.125 = <b>(13.625)<sub>10</sub></b></p>\n<h4>Digital systems માં binary કેમ વપરાય છે</h4>\n<ul>\n<li>Electronic devices ની બે કુદરતી અવસ્થાઓ હોય છે: switch ON/OFF, transistor saturation/cut-off, LED ON/OFF, high/low voltage.</li>\n<li>બે અવસ્થા માટેના circuits <b>સરળ, સસ્તા અને વિશ્વસનીય</b> હોય છે અને noise ની અસર ઓછી થાય છે.</li>\n<li>Binary arithmetic અને logic (Boolean algebra) ખૂબ સરળ છે.</li>\n</ul>\n<p><b>ગેરફાયદો:</b> binary સંખ્યાઓ લાંબી હોય છે (દા.ત. 255 = 11111111), તેથી માણસ માટે વાંચવી અઘરી છે. ટૂંકા સ્વરૂપ તરીકે octal અને hexadecimal વપરાય છે.</p>"}, "diagram": "de1_positional", "key": true}, {"h": {"en": "1.2.4 Octal and Hexadecimal Number Systems", "gu": "1.2.4 Octal અને Hexadecimal Number Systems"}, "body": {"en": "<h4>Octal number system</h4>\n<p>Base <b>8</b>, digits <b>0 to 7</b>. Weights: 8<sup>0</sup>=1, 8<sup>1</sup>=8, 8<sup>2</sup>=64, 8<sup>3</sup>=512 …</p>\n<p>Since 8 = 2<sup>3</sup>, <b>one octal digit = 3 bits</b>. Digits 8 and 9 do not exist in octal.</p>\n<h4>Hexadecimal number system</h4>\n<p>Base <b>16</b>, sixteen digits <b>0–9 and A–F</b>, where A=10, B=11, C=12, D=13, E=14, F=15. Weights: 16<sup>0</sup>=1, 16<sup>1</sup>=16, 16<sup>2</sup>=256, 16<sup>3</sup>=4096 …</p>\n<p>Since 16 = 2<sup>4</sup>, <b>one hex digit = 4 bits (one nibble)</b>; one byte = two hex digits (e.g. 1011 0110 = B6).</p>\n<h4>Uses</h4>\n<ul>\n<li>Short and readable form of long binary numbers.</li>\n<li>Hex is used for <b>memory addresses</b>, machine code, colour codes in HTML (#7B2CD9), MAC addresses.</li>\n<li>Octal is used for file permissions in Linux (chmod 755) and in older computers.</li>\n</ul>\n<h4>Counting table (0 to 15) – learn this</h4><table><tr><th>Decimal</th><th>Binary</th><th>Octal</th><th>Hex</th></tr><tr><td>0</td><td>0000</td><td>0</td><td>0</td></tr><tr><td>1</td><td>0001</td><td>1</td><td>1</td></tr><tr><td>2</td><td>0010</td><td>2</td><td>2</td></tr><tr><td>3</td><td>0011</td><td>3</td><td>3</td></tr><tr><td>4</td><td>0100</td><td>4</td><td>4</td></tr><tr><td>5</td><td>0101</td><td>5</td><td>5</td></tr><tr><td>6</td><td>0110</td><td>6</td><td>6</td></tr><tr><td>7</td><td>0111</td><td>7</td><td>7</td></tr><tr><td>8</td><td>1000</td><td>10</td><td>8</td></tr><tr><td>9</td><td>1001</td><td>11</td><td>9</td></tr><tr><td>10</td><td>1010</td><td>12</td><td>A</td></tr><tr><td>11</td><td>1011</td><td>13</td><td>B</td></tr><tr><td>12</td><td>1100</td><td>14</td><td>C</td></tr><tr><td>13</td><td>1101</td><td>15</td><td>D</td></tr><tr><td>14</td><td>1110</td><td>16</td><td>E</td></tr><tr><td>15</td><td>1111</td><td>17</td><td>F</td></tr></table>", "gu": "<h4>Octal number system</h4>\n<p>Base <b>8</b>, digits <b>0 થી 7</b>. Weights: 8<sup>0</sup>=1, 8<sup>1</sup>=8, 8<sup>2</sup>=64, 8<sup>3</sup>=512 …</p>\n<p>8 = 2<sup>3</sup> હોવાથી <b>એક octal digit = 3 bits</b>. Octal માં 8 અને 9 digits હોતા નથી.</p>\n<h4>Hexadecimal number system</h4>\n<p>Base <b>16</b>, સોળ digits <b>0–9 અને A–F</b>, જ્યાં A=10, B=11, C=12, D=13, E=14, F=15. Weights: 16<sup>0</sup>=1, 16<sup>1</sup>=16, 16<sup>2</sup>=256, 16<sup>3</sup>=4096 …</p>\n<p>16 = 2<sup>4</sup> હોવાથી <b>એક hex digit = 4 bits (એક nibble)</b>; એક byte = બે hex digits (દા.ત. 1011 0110 = B6).</p>\n<h4>ઉપયોગો</h4>\n<ul>\n<li>લાંબી binary સંખ્યાઓનું ટૂંકું અને વાંચી શકાય તેવું સ્વરૂપ.</li>\n<li>Hex નો ઉપયોગ <b>memory addresses</b>, machine code, HTML ના colour codes (#7B2CD9), MAC addresses માં થાય છે.</li>\n<li>Octal નો ઉપયોગ Linux ની file permissions (chmod 755) અને જૂના computers માં થાય છે.</li>\n</ul>\n<h4>ગણતરી કોષ્ટક (0 થી 15) – યાદ રાખો</h4><table><tr><th>Decimal</th><th>Binary</th><th>Octal</th><th>Hex</th></tr><tr><td>0</td><td>0000</td><td>0</td><td>0</td></tr><tr><td>1</td><td>0001</td><td>1</td><td>1</td></tr><tr><td>2</td><td>0010</td><td>2</td><td>2</td></tr><tr><td>3</td><td>0011</td><td>3</td><td>3</td></tr><tr><td>4</td><td>0100</td><td>4</td><td>4</td></tr><tr><td>5</td><td>0101</td><td>5</td><td>5</td></tr><tr><td>6</td><td>0110</td><td>6</td><td>6</td></tr><tr><td>7</td><td>0111</td><td>7</td><td>7</td></tr><tr><td>8</td><td>1000</td><td>10</td><td>8</td></tr><tr><td>9</td><td>1001</td><td>11</td><td>9</td></tr><tr><td>10</td><td>1010</td><td>12</td><td>A</td></tr><tr><td>11</td><td>1011</td><td>13</td><td>B</td></tr><tr><td>12</td><td>1100</td><td>14</td><td>C</td></tr><tr><td>13</td><td>1101</td><td>15</td><td>D</td></tr><tr><td>14</td><td>1110</td><td>16</td><td>E</td></tr><tr><td>15</td><td>1111</td><td>17</td><td>F</td></tr></table>"}}]}, {"title": {"en": "1.3 Conversion between Number Systems", "gu": "1.3 Number Systems વચ્ચે Conversion"}, "items": [{"h": {"en": "1.3.1 Binary, Octal and Hexadecimal to Decimal", "gu": "1.3.1 Binary, Octal અને Hexadecimal થી Decimal"}, "body": {"en": "<p>Any number can be converted to decimal by the <b>positional weight method</b>:</p>\n<ol>\n<li>Write the weight (base<sup>position</sup>) under each digit. Positions are 0, 1, 2 … to the left of the point and −1, −2 … to the right.</li>\n<li>Multiply each digit by its weight.</li>\n<li>Add all the products. The sum is the decimal number.</li>\n</ol>\n<p><b>Example:</b> (2AF)<sub>16</sub> to decimal (A = 10, F = 15):</p><table><tr><th>Digit</th><th>Weight</th><th>Weight value</th><th>Digit × weight</th></tr><tr><td>2</td><td>16<sup>2</sup></td><td>256</td><td>512</td></tr><tr><td>A (10)</td><td>16<sup>1</sup></td><td>16</td><td>160</td></tr><tr><td>F (15)</td><td>16<sup>0</sup></td><td>1</td><td>15</td></tr></table>\n<p>(2AF)<sub>16</sub> = 512 + 160 + 15 = <b>(687)<sub>10</sub></b></p>\n<p><i>Quick rule for binary:</i> just add the weights (1, 2, 4, 8, 16 …) of the positions that contain 1. E.g. (101101)<sub>2</sub> = 32 + 8 + 4 + 1 = 45.</p>", "gu": "<p>કોઈ પણ સંખ્યાને <b>positional weight method</b> થી decimal માં ફેરવી શકાય:</p>\n<ol>\n<li>દરેક digit નીચે તેનું weight (base<sup>position</sup>) લખો. Point ની ડાબી બાજુ positions 0, 1, 2 … અને જમણી બાજુ −1, −2 … છે.</li>\n<li>દરેક digit ને તેના weight સાથે ગુણો.</li>\n<li>બધા ગુણાકારનો સરવાળો કરો. સરવાળો એ decimal સંખ્યા છે.</li>\n</ol>\n<p><b>ઉદાહરણ:</b> (2AF)<sub>16</sub> ને decimal માં (A = 10, F = 15):</p><table><tr><th>Digit</th><th>Weight</th><th>Weight ની કિંમત</th><th>Digit × weight</th></tr><tr><td>2</td><td>16<sup>2</sup></td><td>256</td><td>512</td></tr><tr><td>A (10)</td><td>16<sup>1</sup></td><td>16</td><td>160</td></tr><tr><td>F (15)</td><td>16<sup>0</sup></td><td>1</td><td>15</td></tr></table>\n<p>(2AF)<sub>16</sub> = 512 + 160 + 15 = <b>(687)<sub>10</sub></b></p>\n<p><i>Binary માટે ઝડપી નિયમ:</i> જે positions માં 1 હોય તેમના weights (1, 2, 4, 8, 16 …) નો સરવાળો કરો. દા.ત. (101101)<sub>2</sub> = 32 + 8 + 4 + 1 = 45.</p>"}, "examples": ["de1n1", "de1n2", "de1n3"], "key": true}, {"h": {"en": "1.3.2 Decimal to Binary (Integer Part)", "gu": "1.3.2 Decimal થી Binary (Integer ભાગ)"}, "body": {"en": "<p>The integer part is converted by the <b>repeated division method</b> (double-dabble method):</p>\n<ol>\n<li>Divide the decimal number by <b>2</b>. Write the quotient and the remainder (0 or 1).</li>\n<li>Divide the quotient again by 2. Repeat until the quotient becomes <b>0</b>.</li>\n<li>Write the remainders <b>from bottom to top</b>. The first remainder is the <b>LSB</b> and the last remainder is the <b>MSB</b>.</li>\n</ol>\n<p><b>Example:</b> (45)<sub>10</sub> to binary:</p><table><tr><th>Divide</th><th>Quotient</th><th>Remainder</th></tr><tr><td>45 ÷ 2</td><td>22</td><td><b>1</b></td></tr><tr><td>22 ÷ 2</td><td>11</td><td><b>0</b></td></tr><tr><td>11 ÷ 2</td><td>5</td><td><b>1</b></td></tr><tr><td>5 ÷ 2</td><td>2</td><td><b>1</b></td></tr><tr><td>2 ÷ 2</td><td>1</td><td><b>0</b></td></tr><tr><td>1 ÷ 2</td><td>0</td><td><b>1</b></td></tr></table>\n<p>Reading the remainders upward: (45)<sub>10</sub> = <b>(101101)<sub>2</sub></b></p>\n<p><i>Check:</i> 32 + 8 + 4 + 1 = 45 ✓</p>", "gu": "<p>Integer ભાગને <b>repeated division method</b> (double-dabble method) થી ફેરવાય છે:</p>\n<ol>\n<li>Decimal સંખ્યાને <b>2</b> વડે ભાગો. ભાગફળ અને શેષ (0 અથવા 1) લખો.</li>\n<li>ભાગફળને ફરીથી 2 વડે ભાગો. ભાગફળ <b>0</b> થાય ત્યાં સુધી આમ કરો.</li>\n<li>શેષને <b>નીચેથી ઉપર</b> લખો. પહેલી શેષ <b>LSB</b> અને છેલ્લી શેષ <b>MSB</b> છે.</li>\n</ol>\n<p><b>ઉદાહરણ:</b> (45)<sub>10</sub> ને binary માં:</p><table><tr><th>ભાગાકાર</th><th>ભાગફળ</th><th>શેષ</th></tr><tr><td>45 ÷ 2</td><td>22</td><td><b>1</b></td></tr><tr><td>22 ÷ 2</td><td>11</td><td><b>0</b></td></tr><tr><td>11 ÷ 2</td><td>5</td><td><b>1</b></td></tr><tr><td>5 ÷ 2</td><td>2</td><td><b>1</b></td></tr><tr><td>2 ÷ 2</td><td>1</td><td><b>0</b></td></tr><tr><td>1 ÷ 2</td><td>0</td><td><b>1</b></td></tr></table>\n<p>શેષ ઉપર તરફ વાંચતાં: (45)<sub>10</sub> = <b>(101101)<sub>2</sub></b></p>\n<p><i>ચકાસણી:</i> 32 + 8 + 4 + 1 = 45 ✓</p>"}, "diagram": "de1_division", "examples": ["de1n4"], "key": true}, {"h": {"en": "1.3.3 Decimal Fraction to Binary", "gu": "1.3.3 Decimal Fraction થી Binary"}, "body": {"en": "<p>The fraction part is converted by the <b>repeated multiplication method</b>:</p>\n<ol>\n<li>Multiply the fraction by <b>2</b>.</li>\n<li>The <b>integer part</b> of the product (0 or 1) is the next binary digit.</li>\n<li>Multiply the remaining fraction part by 2 again.</li>\n<li>Stop when the fraction becomes <b>0</b>, or when the required number of bits (usually 4 to 6) is obtained.</li>\n<li>Write the integer parts <b>from top to bottom</b> (first one is just after the point).</li>\n</ol>\n<p><b>Example:</b> (0.625)<sub>10</sub> to binary:</p><table><tr><th>Multiply</th><th>Product</th><th>Integer part</th></tr><tr><td>0.625 × 2</td><td>1.25</td><td><b>1</b></td></tr><tr><td>0.25 × 2</td><td>0.5</td><td><b>0</b></td></tr><tr><td>0.5 × 2</td><td>1</td><td><b>1</b></td></tr></table>\n<p>(0.625)<sub>10</sub> = <b>(0.101)<sub>2</sub></b></p>\n<p><b>Note:</b> Many fractions such as 0.1, 0.2 and 0.3 never become 0; the bits repeat. The answer is then <b>approximate</b>, e.g. (0.3)<sub>10</sub> ≈ (0.01001)<sub>2</sub>.</p>\n<p>For a mixed number (e.g. 25.6875), convert the integer and fraction parts separately and join them with a point.</p>", "gu": "<p>Fraction ભાગને <b>repeated multiplication method</b> થી ફેરવાય છે:</p>\n<ol>\n<li>Fraction ને <b>2</b> વડે ગુણો.</li>\n<li>ગુણનફળનો <b>integer ભાગ</b> (0 અથવા 1) એ પછીનો binary digit છે.</li>\n<li>બાકી રહેલા fraction ભાગને ફરીથી 2 વડે ગુણો.</li>\n<li>Fraction <b>0</b> થાય, અથવા જરૂરી bits (સામાન્ય રીતે 4 થી 6) મળે ત્યારે અટકો.</li>\n<li>Integer ભાગોને <b>ઉપરથી નીચે</b> લખો (પહેલો point ની તરત પછી આવે).</li>\n</ol>\n<p><b>ઉદાહરણ:</b> (0.625)<sub>10</sub> ને binary માં:</p><table><tr><th>ગુણાકાર</th><th>ગુણનફળ</th><th>પૂર્ણાંક ભાગ</th></tr><tr><td>0.625 × 2</td><td>1.25</td><td><b>1</b></td></tr><tr><td>0.25 × 2</td><td>0.5</td><td><b>0</b></td></tr><tr><td>0.5 × 2</td><td>1</td><td><b>1</b></td></tr></table>\n<p>(0.625)<sub>10</sub> = <b>(0.101)<sub>2</sub></b></p>\n<p><b>નોંધ:</b> 0.1, 0.2, 0.3 જેવા ઘણા fractions ક્યારેય 0 થતા નથી; bits પુનરાવર્તિત થાય છે. ત્યારે જવાબ <b>અંદાજિત (approximate)</b> હોય છે, દા.ત. (0.3)<sub>10</sub> ≈ (0.01001)<sub>2</sub>.</p>\n<p>Mixed સંખ્યા (દા.ત. 25.6875) માટે integer અને fraction ભાગને અલગ અલગ ફેરવી point વડે જોડો.</p>"}, "diagram": "de1_fraction", "examples": ["de1n5", "de1n6"]}, {"h": {"en": "1.3.4 Decimal to Octal and Hexadecimal", "gu": "1.3.4 Decimal થી Octal અને Hexadecimal"}, "body": {"en": "<p>The same methods are used, but with base 8 or 16:</p>\n<ul>\n<li><b>Integer part:</b> divide repeatedly by <b>8</b> (octal) or <b>16</b> (hex); read the remainders upward.</li>\n<li><b>Fraction part:</b> multiply repeatedly by <b>8</b> or <b>16</b>; read the integer parts downward.</li>\n<li>In hex, remainders 10 to 15 are written as <b>A to F</b>.</li>\n</ul>\n<p><b>Example 1:</b> (125)<sub>10</sub> to octal:</p><table><tr><th>Divide</th><th>Quotient</th><th>Remainder</th></tr><tr><td>125 ÷ 8</td><td>15</td><td><b>5</b></td></tr><tr><td>15 ÷ 8</td><td>1</td><td><b>7</b></td></tr><tr><td>1 ÷ 8</td><td>0</td><td><b>1</b></td></tr></table>\n<p>(125)<sub>10</sub> = <b>(175)<sub>8</sub></b>. Check: 1×64 + 7×8 + 5 = 125 ✓</p>\n<p><b>Example 2:</b> (2748)<sub>10</sub> to hexadecimal:</p><table><tr><th>Divide</th><th>Quotient</th><th>Remainder</th></tr><tr><td>2748 ÷ 16</td><td>171</td><td><b>C</b> (12)</td></tr><tr><td>171 ÷ 16</td><td>10</td><td><b>B</b> (11)</td></tr><tr><td>10 ÷ 16</td><td>0</td><td><b>A</b> (10)</td></tr></table>\n<p>(2748)<sub>10</sub> = <b>(ABC)<sub>16</sub></b>. Check: 10×256 + 11×16 + 12 = 2748 ✓</p>\n<p><i>Alternative:</i> convert decimal → binary first, then binary → octal/hex by grouping.</p>", "gu": "<p>આ જ methods વપરાય છે, પણ base 8 અથવા 16 સાથે:</p>\n<ul>\n<li><b>Integer ભાગ:</b> <b>8</b> (octal) અથવા <b>16</b> (hex) વડે વારંવાર ભાગો; શેષ ઉપર તરફ વાંચો.</li>\n<li><b>Fraction ભાગ:</b> <b>8</b> અથવા <b>16</b> વડે વારંવાર ગુણો; integer ભાગો નીચે તરફ વાંચો.</li>\n<li>Hex માં શેષ 10 થી 15 ને <b>A થી F</b> તરીકે લખાય છે.</li>\n</ul>\n<p><b>ઉદાહરણ 1:</b> (125)<sub>10</sub> ને octal માં:</p><table><tr><th>ભાગાકાર</th><th>ભાગફળ</th><th>શેષ</th></tr><tr><td>125 ÷ 8</td><td>15</td><td><b>5</b></td></tr><tr><td>15 ÷ 8</td><td>1</td><td><b>7</b></td></tr><tr><td>1 ÷ 8</td><td>0</td><td><b>1</b></td></tr></table>\n<p>(125)<sub>10</sub> = <b>(175)<sub>8</sub></b>. ચકાસણી: 1×64 + 7×8 + 5 = 125 ✓</p>\n<p><b>ઉદાહરણ 2:</b> (2748)<sub>10</sub> ને hexadecimal માં:</p><table><tr><th>ભાગાકાર</th><th>ભાગફળ</th><th>શેષ</th></tr><tr><td>2748 ÷ 16</td><td>171</td><td><b>C</b> (12)</td></tr><tr><td>171 ÷ 16</td><td>10</td><td><b>B</b> (11)</td></tr><tr><td>10 ÷ 16</td><td>0</td><td><b>A</b> (10)</td></tr></table>\n<p>(2748)<sub>10</sub> = <b>(ABC)<sub>16</sub></b>. ચકાસણી: 10×256 + 11×16 + 12 = 2748 ✓</p>\n<p><i>બીજી રીત:</i> પહેલાં decimal → binary કરો, પછી grouping દ્વારા binary → octal/hex કરો.</p>"}, "examples": ["de1n7", "de1n8"]}, {"h": {"en": "1.3.5 Binary to Octal / Hexadecimal and Back", "gu": "1.3.5 Binary થી Octal / Hexadecimal અને પાછું"}, "body": {"en": "<h4>Binary → Octal (groups of 3)</h4>\n<ol>\n<li>Starting from the binary point, make <b>groups of 3 bits</b>: towards the <b>left</b> for the integer part and towards the <b>right</b> for the fraction part.</li>\n<li>Add zeros at the <b>left end</b> of the integer part and the <b>right end</b> of the fraction part to complete the groups.</li>\n<li>Replace each group by its octal digit (000=0 … 111=7).</li>\n</ol>\n<h4>Binary → Hexadecimal (groups of 4)</h4>\n<p>Same method, but with <b>groups of 4 bits</b> (0000=0 … 1111=F).</p>\n<p><b>Example:</b> (11010110.1011)<sub>2</sub></p>\n<ul>\n<li>Octal: 011 010 110 . 101 100 → <b>(326.54)<sub>8</sub></b></li>\n<li>Hex: 1101 0110 . 1011 → <b>(D6.B)<sub>16</sub></b></li>\n</ul>\n<h4>Octal / Hex → Binary</h4>\n<p>Replace <b>each octal digit by 3 bits</b> and <b>each hex digit by 4 bits</b>; then remove extra zeros at the ends.</p>\n<p>E.g. (3A7.C)<sub>16</sub> = 0011 1010 0111 . 1100 = <b>(1110100111.11)<sub>2</sub></b></p>\n<p>This method is fast because 8 = 2<sup>3</sup> and 16 = 2<sup>4</sup>; no division is needed.</p>", "gu": "<h4>Binary → Octal (3 ના groups)</h4>\n<ol>\n<li>Binary point થી શરૂ કરીને <b>3 bits ના groups</b> બનાવો: integer ભાગ માટે <b>ડાબી</b> તરફ અને fraction ભાગ માટે <b>જમણી</b> તરફ.</li>\n<li>Groups પૂરા કરવા integer ભાગની <b>ડાબી બાજુએ</b> અને fraction ભાગની <b>જમણી બાજુએ</b> zeros ઉમેરો.</li>\n<li>દરેક group ની જગ્યાએ તેનો octal digit લખો (000=0 … 111=7).</li>\n</ol>\n<h4>Binary → Hexadecimal (4 ના groups)</h4>\n<p>આ જ method, પણ <b>4 bits ના groups</b> સાથે (0000=0 … 1111=F).</p>\n<p><b>ઉદાહરણ:</b> (11010110.1011)<sub>2</sub></p>\n<ul>\n<li>Octal: 011 010 110 . 101 100 → <b>(326.54)<sub>8</sub></b></li>\n<li>Hex: 1101 0110 . 1011 → <b>(D6.B)<sub>16</sub></b></li>\n</ul>\n<h4>Octal / Hex → Binary</h4>\n<p><b>દરેક octal digit ને 3 bits</b> અને <b>દરેક hex digit ને 4 bits</b> વડે બદલો; પછી છેડા પરના વધારાના zeros કાઢી નાખો.</p>\n<p>દા.ત. (3A7.C)<sub>16</sub> = 0011 1010 0111 . 1100 = <b>(1110100111.11)<sub>2</sub></b></p>\n<p>8 = 2<sup>3</sup> અને 16 = 2<sup>4</sup> હોવાથી આ method ઝડપી છે; ભાગાકારની જરૂર નથી.</p>"}, "diagram": "de1_grouping", "examples": ["de1n9", "de1n10"], "key": true}, {"h": {"en": "1.3.6 Octal ↔ Hexadecimal and Summary of Conversions", "gu": "1.3.6 Octal ↔ Hexadecimal અને Conversions નો સારાંશ"}, "body": {"en": "<p>Octal and hexadecimal are converted <b>through binary</b>:</p>\n<ul>\n<li><b>Octal → Hex:</b> octal → binary (3 bits each) → regroup in 4 bits → hex.</li>\n<li><b>Hex → Octal:</b> hex → binary (4 bits each) → regroup in 3 bits → octal.</li>\n</ul>\n<p><b>Example:</b> (725)<sub>8</sub> = 111 010 101 = 1 1101 0101 = <b>(1D5)<sub>16</sub></b></p>\n<p>(Through decimal is also possible: 725<sub>8</sub> = 469<sub>10</sub> = 1D5<sub>16</sub>, but it is longer.)</p>\n<h4>Summary</h4>\n<table><tr><th>From → To</th><th>Method</th></tr>\n<tr><td>Any base → Decimal</td><td>Multiply each digit by its weight and add</td></tr>\n<tr><td>Decimal → any base (integer)</td><td>Repeated division by base, remainders upward</td></tr>\n<tr><td>Decimal → any base (fraction)</td><td>Repeated multiplication by base, integers downward</td></tr>\n<tr><td>Binary → Octal / Hex</td><td>Groups of 3 / 4 bits from the point</td></tr>\n<tr><td>Octal / Hex → Binary</td><td>Each digit → 3 / 4 bits</td></tr>\n<tr><td>Octal ↔ Hex</td><td>Through binary</td></tr></table>", "gu": "<p>Octal અને hexadecimal ને <b>binary મારફતે</b> ફેરવાય છે:</p>\n<ul>\n<li><b>Octal → Hex:</b> octal → binary (દરેકના 3 bits) → 4 bits માં ફરી group → hex.</li>\n<li><b>Hex → Octal:</b> hex → binary (દરેકના 4 bits) → 3 bits માં ફરી group → octal.</li>\n</ul>\n<p><b>ઉદાહરણ:</b> (725)<sub>8</sub> = 111 010 101 = 1 1101 0101 = <b>(1D5)<sub>16</sub></b></p>\n<p>(Decimal મારફતે પણ થઈ શકે: 725<sub>8</sub> = 469<sub>10</sub> = 1D5<sub>16</sub>, પણ તે લાંબી રીત છે.)</p>\n<h4>સારાંશ</h4>\n<table><tr><th>From → To</th><th>Method</th></tr>\n<tr><td>કોઈ પણ base → Decimal</td><td>દરેક digit ને તેના weight સાથે ગુણી સરવાળો કરો</td></tr>\n<tr><td>Decimal → કોઈ base (integer)</td><td>Base વડે વારંવાર ભાગાકાર, શેષ ઉપર તરફ</td></tr>\n<tr><td>Decimal → કોઈ base (fraction)</td><td>Base વડે વારંવાર ગુણાકાર, integers નીચે તરફ</td></tr>\n<tr><td>Binary → Octal / Hex</td><td>Point થી 3 / 4 bits ના groups</td></tr>\n<tr><td>Octal / Hex → Binary</td><td>દરેક digit → 3 / 4 bits</td></tr>\n<tr><td>Octal ↔ Hex</td><td>Binary મારફતે</td></tr></table>"}, "diagram": "de1_conv_map", "examples": ["de1n11", "de1n12"]}]}, {"title": {"en": "1.4 Binary Arithmetic and Complements", "gu": "1.4 Binary Arithmetic અને Complements"}, "items": [{"h": {"en": "1.4.1 Binary Addition", "gu": "1.4.1 Binary Addition (સરવાળો)"}, "body": {"en": "<p>Binary addition is done column by column from the <b>LSB (right)</b>, like decimal addition. When the sum in a column is 2 or more, a <b>carry</b> goes to the next column.</p>\n<h4>Rules of binary addition</h4>\n<table><tr><th>A</th><th>B</th><th>Sum</th><th>Carry</th></tr>\n<tr><td>0</td><td>0</td><td>0</td><td>0</td></tr><tr><td>0</td><td>1</td><td>1</td><td>0</td></tr>\n<tr><td>1</td><td>0</td><td>1</td><td>0</td></tr><tr><td>1</td><td>1</td><td>0</td><td>1</td></tr></table>\n<p>Also 1 + 1 + 1 = 1 with carry 1 (i.e. 11<sub>2</sub> = 3).</p>\n<p><b>Example:</b> 1011 + 1101 (11 + 13):</p><pre>Carry    1111 \n          1011\n+         1101\n         -----\nSum      11000</pre>\n<p>Result = <b>(11000)<sub>2</sub></b> = 24 ✓</p>", "gu": "<p>Binary સરવાળો decimal ની જેમ જ <b>LSB (જમણી બાજુ)</b> થી column-wise થાય છે. કોઈ column નો સરવાળો 2 કે વધુ થાય ત્યારે આગળના column માં <b>carry</b> જાય છે.</p>\n<h4>Binary addition ના નિયમો</h4>\n<table><tr><th>A</th><th>B</th><th>Sum</th><th>Carry</th></tr>\n<tr><td>0</td><td>0</td><td>0</td><td>0</td></tr><tr><td>0</td><td>1</td><td>1</td><td>0</td></tr>\n<tr><td>1</td><td>0</td><td>1</td><td>0</td></tr><tr><td>1</td><td>1</td><td>0</td><td>1</td></tr></table>\n<p>તેમજ 1 + 1 + 1 = 1 અને carry 1 (એટલે કે 11<sub>2</sub> = 3).</p>\n<p><b>ઉદાહરણ:</b> 1011 + 1101 (11 + 13):</p><pre>Carry    1111 \n          1011\n+         1101\n         -----\nSum      11000</pre>\n<p>જવાબ = <b>(11000)<sub>2</sub></b> = 24 ✓</p>"}, "diagram": "de1_binary_add", "examples": ["de1n13"], "key": true}, {"h": {"en": "1.4.2 Binary Subtraction (Direct Method)", "gu": "1.4.2 Binary Subtraction (Direct Method)"}, "body": {"en": "<p>In direct subtraction, when a smaller bit has a larger bit subtracted from it (0 − 1), we <b>borrow 1</b> from the next higher column. A borrowed 1 is worth <b>2</b> (10<sub>2</sub>) in the current column.</p>\n<h4>Rules of binary subtraction</h4>\n<table><tr><th>A</th><th>B</th><th>Difference</th><th>Borrow</th></tr>\n<tr><td>0</td><td>0</td><td>0</td><td>0</td></tr><tr><td>0</td><td>1</td><td>1</td><td>1</td></tr>\n<tr><td>1</td><td>0</td><td>1</td><td>0</td></tr><tr><td>1</td><td>1</td><td>0</td><td>0</td></tr></table>\n<p><b>Example:</b> 1101 − 0110 (13 − 6):</p><pre>         1101\n-        0110\n         ----\nDiff     0111</pre>\n<p>Result = <b>(0111)<sub>2</sub></b> = 7 ✓</p>\n<p>Digital circuits do not subtract this way; it needs a separate subtractor. Using <b>complements</b>, subtraction is done with the <b>adder</b> itself, so the same hardware performs both addition and subtraction.</p>", "gu": "<p>Direct subtraction માં જ્યારે નાના bit માંથી મોટો bit બાદ કરવાનો હોય (0 − 1), ત્યારે આગળના મોટા column માંથી <b>1 ઉધાર (borrow)</b> લેવાય છે. ઉધાર લીધેલા 1 ની કિંમત ચાલુ column માં <b>2</b> (10<sub>2</sub>) છે.</p>\n<h4>Binary subtraction ના નિયમો</h4>\n<table><tr><th>A</th><th>B</th><th>Difference</th><th>Borrow</th></tr>\n<tr><td>0</td><td>0</td><td>0</td><td>0</td></tr><tr><td>0</td><td>1</td><td>1</td><td>1</td></tr>\n<tr><td>1</td><td>0</td><td>1</td><td>0</td></tr><tr><td>1</td><td>1</td><td>0</td><td>0</td></tr></table>\n<p><b>ઉદાહરણ:</b> 1101 − 0110 (13 − 6):</p><pre>         1101\n-        0110\n         ----\nDiff     0111</pre>\n<p>જવાબ = <b>(0111)<sub>2</sub></b> = 7 ✓</p>\n<p>Digital circuits આ રીતે બાદબાકી કરતા નથી; તે માટે અલગ subtractor જોઈએ. <b>Complements</b> વાપરીને બાદબાકી <b>adder</b> વડે જ થાય છે, તેથી એક જ hardware સરવાળો અને બાદબાકી બંને કરે છે.</p>"}, "examples": ["de1n14"]}, {"h": {"en": "1.4.3 1's and 2's Complement", "gu": "1.4.3 1's અને 2's Complement"}, "body": {"en": "<h4>1's complement</h4>\n<p>The 1's complement of a binary number is obtained by <b>inverting every bit</b>: change each 0 to 1 and each 1 to 0.</p>\n<p>E.g. 1's complement of 10110 = <b>01001</b>. (A NOT gate on each bit gives the 1's complement.)</p>\n<h4>2's complement</h4>\n<p>2's complement = <b>1's complement + 1</b> (add 1 at the LSB).</p>\n<p>E.g. 10110 → 1's complement 01001 → + 1 → <b>01010</b>.</p>\n<p><b>Shortcut:</b> start from the LSB, copy all bits up to and including the <b>first 1</b>, then invert all the remaining bits. 10110 → keep \"10\", invert \"101\" to \"010\" → 01010.</p>\n<h4>General rule</h4>\n<p>For base r there are two complements: the <b>(r−1)'s complement</b> and the <b>r's complement</b> = (r−1)'s complement + 1. For decimal these are the 9's and 10's complements; for binary they are the 1's and 2's complements.</p>\n<p><b>Uses:</b> complements are used to represent <b>negative numbers</b> and to perform <b>subtraction using addition</b>.</p>", "gu": "<h4>1's complement</h4>\n<p>Binary સંખ્યાનો 1's complement મેળવવા <b>દરેક bit ને ઉલટાવો (invert)</b>: દરેક 0 ને 1 અને દરેક 1 ને 0 કરો.</p>\n<p>દા.ત. 10110 નો 1's complement = <b>01001</b>. (દરેક bit પર NOT gate મૂકવાથી 1's complement મળે.)</p>\n<h4>2's complement</h4>\n<p>2's complement = <b>1's complement + 1</b> (LSB માં 1 ઉમેરો).</p>\n<p>દા.ત. 10110 → 1's complement 01001 → + 1 → <b>01010</b>.</p>\n<p><b>Shortcut:</b> LSB થી શરૂ કરી <b>પહેલો 1</b> આવે ત્યાં સુધીના (તે 1 સહિત) bits એમ જ લખો, પછી બાકીના બધા bits invert કરો. 10110 → \"10\" એમ જ, \"101\" ને \"010\" → 01010.</p>\n<h4>સામાન્ય નિયમ</h4>\n<p>Base r માટે બે complements હોય છે: <b>(r−1)'s complement</b> અને <b>r's complement</b> = (r−1)'s complement + 1. Decimal માટે 9's અને 10's complement; binary માટે 1's અને 2's complement.</p>\n<p><b>ઉપયોગ:</b> complements નો ઉપયોગ <b>negative સંખ્યાઓ</b> દર્શાવવા અને <b>સરવાળા વડે બાદબાકી</b> કરવા થાય છે.</p>"}, "diagram": "de1_complement", "examples": ["de1n15"], "key": true}, {"h": {"en": "1.4.4 Subtraction using 1's Complement", "gu": "1.4.4 1's Complement વડે Subtraction"}, "body": {"en": "<p>To find <b>A − B</b> using 1's complement:</p>\n<ol>\n<li>Make A and B the <b>same number of bits</b> (add leading zeros).</li>\n<li>Find the <b>1's complement of B</b> (the subtrahend).</li>\n<li><b>Add</b> A and the 1's complement of B.</li>\n<li>If a <b>carry</b> is generated: the result is <b>positive</b>. Remove the carry and <b>add it to the LSB</b> (this is called <b>end-around carry</b>).</li>\n<li>If <b>no carry</b>: the result is <b>negative</b>. Take the 1's complement of the sum and put a minus sign.</li>\n</ol>\n<p><b>Example:</b> 1101 − 0110 (13 − 6):</p><ol><li>Make both numbers 4 bits: A = 1101, B = 0110.</li><li>1's complement of B = <b>1001</b>.</li><li>Add A and the 1's complement of B:<pre>          1101\n+         1001\n         -----\n         10110</pre></li><li>A carry is generated, so the result is <b>positive</b>. Add the carry to the LSB (<b>end-around carry</b>):<pre>         0110\n+ carry     1\n         ----\n         0111</pre></li></ol><p>Answer = <b>(0111)<sub>2</sub></b> = 7 ✓</p>", "gu": "<p>1's complement વડે <b>A − B</b> શોધવા:</p>\n<ol>\n<li>A અને B ને <b>સરખા bits</b> ના બનાવો (આગળ zeros ઉમેરો).</li>\n<li><b>B (subtrahend) નો 1's complement</b> શોધો.</li>\n<li>A અને B ના 1's complement નો <b>સરવાળો</b> કરો.</li>\n<li>જો <b>carry</b> મળે: જવાબ <b>positive</b> છે. Carry ને કાઢીને <b>LSB માં ઉમેરો</b> (તેને <b>end-around carry</b> કહે છે).</li>\n<li>જો <b>carry ન મળે</b>: જવાબ <b>negative</b> છે. સરવાળાનો 1's complement લઈ minus નિશાની મૂકો.</li>\n</ol>\n<p><b>ઉદાહરણ:</b> 1101 − 0110 (13 − 6):</p><ol><li>બંને numbers ને 4 bits ના બનાવો: A = 1101, B = 0110.</li><li>B નો 1's complement = <b>1001</b>.</li><li>A અને B ના 1's complement નો સરવાળો કરો:<pre>          1101\n+         1001\n         -----\n         10110</pre></li><li>Carry ઉત્પન્ન થાય છે, તેથી જવાબ <b>positive</b> છે. Carry ને LSB માં ઉમેરો (<b>end-around carry</b>):<pre>         0110\n+ carry     1\n         ----\n         0111</pre></li></ol><p>જવાબ = <b>(0111)<sub>2</sub></b> = 7 ✓</p>"}, "examples": ["de1n16", "de1n17"], "key": true}, {"h": {"en": "1.4.5 Subtraction using 2's Complement", "gu": "1.4.5 2's Complement વડે Subtraction"}, "body": {"en": "<p>To find <b>A − B</b> using 2's complement:</p>\n<ol>\n<li>Make A and B the <b>same number of bits</b>.</li>\n<li>Find the <b>2's complement of B</b>.</li>\n<li><b>Add</b> A and the 2's complement of B.</li>\n<li>If a <b>carry</b> is generated: <b>discard</b> it. The result is <b>positive</b>.</li>\n<li>If <b>no carry</b>: the result is <b>negative</b> and in 2's complement form. Take the 2's complement of the sum and put a minus sign.</li>\n</ol>\n<p><b>Example:</b> 1101 − 0110 (13 − 6):</p><ol><li>Make both numbers 4 bits: A = 1101, B = 0110.</li><li>2's complement of B = 1's complement + 1 = 1001 + 1 = <b>1010</b>.</li><li>Add A and the 2's complement of B:<pre>          1101\n+         1010\n         -----\n         10111</pre></li><li>A carry is generated: <b>discard it</b>. The result is positive: <b>0111</b>.</li></ol><p>Answer = <b>(0111)<sub>2</sub></b> = 7 ✓</p>\n<h4>1's vs 2's complement method</h4>\n<table><tr><th>1's complement</th><th>2's complement</th></tr>\n<tr><td>Carry is added back (end-around carry)</td><td>Carry is simply discarded</td></tr>\n<tr><td>Two zeros: +0 (0000) and −0 (1111)</td><td>Only one zero</td></tr>\n<tr><td>Slower (extra addition)</td><td>Faster; used in all computers</td></tr></table>", "gu": "<p>2's complement વડે <b>A − B</b> શોધવા:</p>\n<ol>\n<li>A અને B ને <b>સરખા bits</b> ના બનાવો.</li>\n<li><b>B નો 2's complement</b> શોધો.</li>\n<li>A અને B ના 2's complement નો <b>સરવાળો</b> કરો.</li>\n<li>જો <b>carry</b> મળે: તેને <b>અવગણો (discard)</b>. જવાબ <b>positive</b> છે.</li>\n<li>જો <b>carry ન મળે</b>: જવાબ <b>negative</b> છે અને 2's complement સ્વરૂપમાં છે. સરવાળાનો 2's complement લઈ minus નિશાની મૂકો.</li>\n</ol>\n<p><b>ઉદાહરણ:</b> 1101 − 0110 (13 − 6):</p><ol><li>બંને numbers ને 4 bits ના બનાવો: A = 1101, B = 0110.</li><li>B નો 2's complement = 1's complement + 1 = 1001 + 1 = <b>1010</b>.</li><li>A અને B ના 2's complement નો સરવાળો કરો:<pre>          1101\n+         1010\n         -----\n         10111</pre></li><li>Carry ઉત્પન્ન થાય છે: તેને <b>અવગણો (discard)</b>. જવાબ positive છે: <b>0111</b>.</li></ol><p>જવાબ = <b>(0111)<sub>2</sub></b> = 7 ✓</p>\n<h4>1's અને 2's complement method ની સરખામણી</h4>\n<table><tr><th>1's complement</th><th>2's complement</th></tr>\n<tr><td>Carry પાછો ઉમેરાય છે (end-around carry)</td><td>Carry ને અવગણવામાં આવે છે</td></tr>\n<tr><td>બે zero: +0 (0000) અને −0 (1111)</td><td>માત્ર એક zero</td></tr>\n<tr><td>ધીમું (વધારાનો સરવાળો)</td><td>ઝડપી; બધા computers માં વપરાય છે</td></tr></table>"}, "diagram": "de1_sub_flow", "examples": ["de1n18", "de1n19", "de1n20"], "key": true}, {"h": {"en": "1.4.6 Signed Binary Numbers", "gu": "1.4.6 Signed Binary Numbers"}, "body": {"en": "<p>In a <b>signed number</b>, the MSB is used as the <b>sign bit</b>: <b>0 = positive</b>, <b>1 = negative</b>. Negative numbers can be written in three ways:</p>\n<ol>\n<li><b>Sign-magnitude:</b> sign bit + magnitude in normal binary.</li>\n<li><b>1's complement form:</b> negative number = 1's complement of the positive number.</li>\n<li><b>2's complement form:</b> negative number = 2's complement of the positive number.</li>\n</ol>\n<p><b>Example (8 bits):</b></p><table><tr><th>Number</th><th>Sign-magnitude</th><th>1's comp</th><th>2's comp</th></tr><tr><td>+5</td><td>0000 0101</td><td>0000 0101</td><td>0000 0101</td></tr><tr><td>−5</td><td>1000 0101</td><td>1111 1010</td><td>1111 1011</td></tr></table>\n<p>Positive numbers are the same in all three forms. Range with n bits in 2's complement: <b>−2<sup>n−1</sup> to +(2<sup>n−1</sup> − 1)</b>; for 8 bits, −128 to +127.</p>\n<p>The 2's complement form is used in computers because it has only one zero and subtraction is done by simple addition.</p>", "gu": "<p><b>Signed સંખ્યા</b> માં MSB ને <b>sign bit</b> તરીકે વપરાય છે: <b>0 = positive</b>, <b>1 = negative</b>. Negative સંખ્યાઓ ત્રણ રીતે લખી શકાય:</p>\n<ol>\n<li><b>Sign-magnitude:</b> sign bit + સામાન્ય binary માં magnitude.</li>\n<li><b>1's complement form:</b> negative સંખ્યા = positive સંખ્યાનો 1's complement.</li>\n<li><b>2's complement form:</b> negative સંખ્યા = positive સંખ્યાનો 2's complement.</li>\n</ol>\n<p><b>ઉદાહરણ (8 bits):</b></p><table><tr><th>સંખ્યા</th><th>Sign-magnitude</th><th>1's comp</th><th>2's comp</th></tr><tr><td>+5</td><td>0000 0101</td><td>0000 0101</td><td>0000 0101</td></tr><tr><td>−5</td><td>1000 0101</td><td>1111 1010</td><td>1111 1011</td></tr></table>\n<p>Positive સંખ્યાઓ ત્રણેય સ્વરૂપમાં સરખી હોય છે. n bits ના 2's complement માં range: <b>−2<sup>n−1</sup> થી +(2<sup>n−1</sup> − 1)</b>; 8 bits માટે −128 થી +127.</p>\n<p>2's complement સ્વરૂપમાં માત્ર એક zero હોય છે અને બાદબાકી સાદા સરવાળાથી થાય છે, તેથી computers માં તે વપરાય છે.</p>"}}]}, {"title": {"en": "1.5 Binary Codes", "gu": "1.5 Binary Codes"}, "items": [{"h": {"en": "1.5.1 BCD and Excess-3 Codes", "gu": "1.5.1 BCD અને Excess-3 Codes"}, "body": {"en": "<p>A <b>binary code</b> is a group of bits used to represent numbers, letters or symbols.</p>\n<h4>BCD (Binary Coded Decimal) / 8421 code</h4>\n<ul>\n<li>Each <b>decimal digit</b> is written separately as a <b>4-bit</b> binary number with weights 8-4-2-1.</li>\n<li>Only 0000 to 1001 are used; 1010 to 1111 are <b>invalid</b> in BCD.</li>\n<li>E.g. (58)<sub>10</sub> = 0101 1000 (BCD). Compare: (58)<sub>10</sub> = 111010 in pure binary.</li>\n<li>Used in digital clocks, calculators and 7-segment displays.</li>\n</ul>\n<h4>Excess-3 (XS-3) code</h4>\n<ul>\n<li>Excess-3 code = <b>BCD + 3 (0011)</b> for each digit. It is a <b>non-weighted</b> code.</li>\n<li>E.g. (58)<sub>10</sub>: 5+3 = 8 → 1000, 8+3 = 11 → 1011, so XS-3 = 1000 1011.</li>\n<li>It is <b>self-complementing</b>: the 9's complement of a digit is obtained by inverting its bits.</li>\n</ul><table><tr><th>Decimal</th><th>BCD (8421)</th><th>Excess-3</th><th>Gray</th></tr><tr><td>0</td><td>0000</td><td>0011</td><td>0000</td></tr><tr><td>1</td><td>0001</td><td>0100</td><td>0001</td></tr><tr><td>2</td><td>0010</td><td>0101</td><td>0011</td></tr><tr><td>3</td><td>0011</td><td>0110</td><td>0010</td></tr><tr><td>4</td><td>0100</td><td>0111</td><td>0110</td></tr><tr><td>5</td><td>0101</td><td>1000</td><td>0111</td></tr><tr><td>6</td><td>0110</td><td>1001</td><td>0101</td></tr><tr><td>7</td><td>0111</td><td>1010</td><td>0100</td></tr><tr><td>8</td><td>1000</td><td>1011</td><td>1100</td></tr><tr><td>9</td><td>1001</td><td>1100</td><td>1101</td></tr></table>", "gu": "<p><b>Binary code</b> એ સંખ્યાઓ, અક્ષરો કે symbols દર્શાવવા માટે વપરાતા bits નો group છે.</p>\n<h4>BCD (Binary Coded Decimal) / 8421 code</h4>\n<ul>\n<li>દરેક <b>decimal digit</b> ને અલગથી 8-4-2-1 weights વાળી <b>4-bit</b> binary સંખ્યા તરીકે લખાય છે.</li>\n<li>માત્ર 0000 થી 1001 વપરાય છે; 1010 થી 1111 BCD માં <b>invalid</b> છે.</li>\n<li>દા.ત. (58)<sub>10</sub> = 0101 1000 (BCD). સરખામણી: (58)<sub>10</sub> = 111010 (pure binary).</li>\n<li>Digital ઘડિયાળ, calculators અને 7-segment displays માં વપરાય છે.</li>\n</ul>\n<h4>Excess-3 (XS-3) code</h4>\n<ul>\n<li>Excess-3 code = દરેક digit માટે <b>BCD + 3 (0011)</b>. તે <b>non-weighted</b> code છે.</li>\n<li>દા.ત. (58)<sub>10</sub>: 5+3 = 8 → 1000, 8+3 = 11 → 1011, તેથી XS-3 = 1000 1011.</li>\n<li>તે <b>self-complementing</b> છે: digit ના bits invert કરવાથી તેનો 9's complement મળે છે.</li>\n</ul><table><tr><th>Decimal</th><th>BCD (8421)</th><th>Excess-3</th><th>Gray</th></tr><tr><td>0</td><td>0000</td><td>0011</td><td>0000</td></tr><tr><td>1</td><td>0001</td><td>0100</td><td>0001</td></tr><tr><td>2</td><td>0010</td><td>0101</td><td>0011</td></tr><tr><td>3</td><td>0011</td><td>0110</td><td>0010</td></tr><tr><td>4</td><td>0100</td><td>0111</td><td>0110</td></tr><tr><td>5</td><td>0101</td><td>1000</td><td>0111</td></tr><tr><td>6</td><td>0110</td><td>1001</td><td>0101</td></tr><tr><td>7</td><td>0111</td><td>1010</td><td>0100</td></tr><tr><td>8</td><td>1000</td><td>1011</td><td>1100</td></tr><tr><td>9</td><td>1001</td><td>1100</td><td>1101</td></tr></table>"}, "examples": ["de1n21"]}, {"h": {"en": "1.5.2 Gray Code and ASCII Code", "gu": "1.5.2 Gray Code અને ASCII Code"}, "body": {"en": "<h4>Gray code</h4>\n<ul>\n<li>In Gray code, <b>only one bit changes</b> between two successive numbers (unit-distance code). It is non-weighted.</li>\n<li>Used in shaft-position encoders and K-maps (Unit 3) to avoid errors during transitions.</li>\n</ul>\n<p><b>Binary → Gray:</b> MSB stays the same; each next Gray bit = XOR of the current and previous binary bits.<br>E.g. 1011 → 1, 1⊕0=1, 0⊕1=1, 1⊕1=0 → <b>1110</b>.</p>\n<p><b>Gray → Binary:</b> MSB stays the same; each next binary bit = XOR of the previous <i>binary</i> bit and the current Gray bit.<br>E.g. 1101 → 1, 1⊕1=0, 0⊕0=0, 0⊕1=1 → <b>1001</b>.</p>\n<h4>ASCII code</h4>\n<ul>\n<li><b>ASCII</b> (American Standard Code for Information Interchange) is a <b>7-bit alphanumeric code</b> giving 128 characters: letters, digits, symbols and control characters.</li>\n<li>'A' = 65 = 100 0001, 'a' = 97 = 110 0001, '0' = 48 = 011 0000, space = 32.</li>\n<li>Used in keyboards, computers and text files. (Unicode extends ASCII for all languages, including Gujarati.)</li>\n</ul>", "gu": "<h4>Gray code</h4>\n<ul>\n<li>Gray code માં બે ક્રમિક સંખ્યાઓ વચ્ચે <b>માત્ર એક જ bit બદલાય</b> છે (unit-distance code). તે non-weighted છે.</li>\n<li>Transition દરમિયાન errors ટાળવા shaft-position encoders અને K-maps (Unit 3) માં વપરાય છે.</li>\n</ul>\n<p><b>Binary → Gray:</b> MSB એમ જ રહે; પછીનો દરેક Gray bit = ચાલુ અને આગળના binary bits નો XOR.<br>દા.ત. 1011 → 1, 1⊕0=1, 0⊕1=1, 1⊕1=0 → <b>1110</b>.</p>\n<p><b>Gray → Binary:</b> MSB એમ જ રહે; પછીનો દરેક binary bit = આગળના <i>binary</i> bit અને ચાલુ Gray bit નો XOR.<br>દા.ત. 1101 → 1, 1⊕1=0, 0⊕0=0, 0⊕1=1 → <b>1001</b>.</p>\n<h4>ASCII code</h4>\n<ul>\n<li><b>ASCII</b> (American Standard Code for Information Interchange) એ <b>7-bit alphanumeric code</b> છે જે 128 characters આપે છે: અક્ષરો, digits, symbols અને control characters.</li>\n<li>'A' = 65 = 100 0001, 'a' = 97 = 110 0001, '0' = 48 = 011 0000, space = 32.</li>\n<li>Keyboards, computers અને text files માં વપરાય છે. (Unicode એ ASCII ને બધી ભાષાઓ, ગુજરાતી સહિત, માટે વિસ્તારે છે.)</li>\n</ul>"}, "examples": ["de1n22"]}]}], "numericals": [{"id": "de1n1", "q": {"en": "Convert (10110.011)<sub>2</sub> to decimal.", "gu": "(10110.011)<sub>2</sub> ને decimal માં ફેરવો."}, "a": {"en": "<table><tr><th>Digit</th><th>Weight</th><th>Weight value</th><th>Digit × weight</th></tr><tr><td>1</td><td>2<sup>4</sup></td><td>16</td><td>16</td></tr><tr><td>0</td><td>2<sup>3</sup></td><td>8</td><td>0</td></tr><tr><td>1</td><td>2<sup>2</sup></td><td>4</td><td>4</td></tr><tr><td>1</td><td>2<sup>1</sup></td><td>2</td><td>2</td></tr><tr><td>0</td><td>2<sup>0</sup></td><td>1</td><td>0</td></tr><tr><td>0</td><td>2<sup>-1</sup></td><td>0.5</td><td>0</td></tr><tr><td>1</td><td>2<sup>-2</sup></td><td>0.25</td><td>0.25</td></tr><tr><td>1</td><td>2<sup>-3</sup></td><td>0.125</td><td>0.125</td></tr></table><p>(10110.011)<sub>2</sub> = 1×2<sup>4</sup> + 0×2<sup>3</sup> + 1×2<sup>2</sup> + 1×2<sup>1</sup> + 0×2<sup>0</sup> + 0×2<sup>-1</sup> + 1×2<sup>-2</sup> + 1×2<sup>-3</sup></p><p><b>(10110.011)<sub>2</sub> = (22.375)<sub>10</sub></b></p>", "gu": "<table><tr><th>Digit</th><th>Weight</th><th>Weight ની કિંમત</th><th>Digit × weight</th></tr><tr><td>1</td><td>2<sup>4</sup></td><td>16</td><td>16</td></tr><tr><td>0</td><td>2<sup>3</sup></td><td>8</td><td>0</td></tr><tr><td>1</td><td>2<sup>2</sup></td><td>4</td><td>4</td></tr><tr><td>1</td><td>2<sup>1</sup></td><td>2</td><td>2</td></tr><tr><td>0</td><td>2<sup>0</sup></td><td>1</td><td>0</td></tr><tr><td>0</td><td>2<sup>-1</sup></td><td>0.5</td><td>0</td></tr><tr><td>1</td><td>2<sup>-2</sup></td><td>0.25</td><td>0.25</td></tr><tr><td>1</td><td>2<sup>-3</sup></td><td>0.125</td><td>0.125</td></tr>
