><td></td></tr></table><p>Page faults = <b>9</b></p><p><b>4 frames:</b></p><table><tr><th>Ref</th><th>F1</th><th>F2</th><th>F3</th><th>F4</th><th>Fault / Hit</th><th>Victim</th></tr><tr><td><b>1</b></td><td><b>1</b></td><td>–</td><td>–</td><td>–</td><td>F</td><td></td></tr><tr><td><b>2</b></td><td>1</td><td><b>2</b></td><td>–</td><td>–</td><td>F</td><td></td></tr><tr><td><b>3</b></td><td>1</td><td>2</td><td><b>3</b></td><td>–</td><td>F</td><td></td></tr><tr><td><b>4</b></td><td>1</td><td>2</td><td>3</td><td><b>4</b></td><td>F</td><td></td></tr><tr><td><b>1</b></td><td>1</td><td>2</td><td>3</td><td>4</td><td>H</td><td></td></tr><tr><td><b>2</b></td><td>1</td><td>2</td><td>3</td><td>4</td><td>H</td><td></td></tr><tr><td><b>5</b></td><td><b>5</b></td><td>2</td><td>3</td><td>4</td><td>F</td><td>1</td></tr><tr><td><b>1</b></td><td>5</td><td><b>1</b></td><td>3</td><td>4</td><td>F</td><td>2</td></tr><tr><td><b>2</b></td><td>5</td><td>1</td><td><b>2</b></td><td>4</td><td>F</td><td>3</td></tr><tr><td><b>3</b></td><td>5</td><td>1</td><td>2</td><td><b>3</b></td><td>F</td><td>4</td></tr><tr><td><b>4</b></td><td><b>4</b></td><td>1</td><td>2</td><td>3</td><td>F</td><td>5</td></tr><tr><td><b>5</b></td><td>4</td><td><b>5</b></td><td>2</td><td>3</td><td>F</td><td>1</td></tr></table><p>Page faults = <b>10</b></p><p><b>વધુ frames હોવા છતાં FIFO વધુ faults આપે છે</b> (10 &gt; 9). આ અણધાર્યા પરિણામને <b>Belady's anomaly</b> કહે છે. LRU અને optimal માં તે ક્યારેય થતું નથી (તેઓ stack algorithms છે).</p>"}}], "equations": [{"title": {"en": "Address Binding and Protection", "gu": "Address Binding અને Protection"}, "items": [{"name": {"en": "Physical address (relocation)", "gu": "Physical address (relocation)"}, "f": "PA = relocation (base) register + LA", "terms": {"en": "LA = logical address generated by the CPU", "gu": "LA = CPU એ બનાવેલું logical address"}}, {"name": {"en": "Protection check", "gu": "Protection check"}, "f": "LA &lt; limit register, else trap", "terms": {"en": "Limit = size of the process's address range", "gu": "Limit = process ની address range નું કદ"}}, {"name": {"en": "Internal fragmentation", "gu": "Internal fragmentation"}, "f": "Waste = partition size − process size", "terms": {"en": "Summed over all allocated partitions", "gu": "બધા ફાળવેલા partitions નો સરવાળો"}}]}, {"title": {"en": "Paging", "gu": "Paging"}, "items": [{"name": {"en": "Page number", "gu": "Page number"}, "f": "p = LA div page size", "terms": {"en": "Integer part of LA ÷ page size", "gu": "LA ÷ page size નો પૂર્ણાંક ભાગ"}}, {"name": {"en": "Offset", "gu": "Offset"}, "f": "d = LA mod page size", "terms": {"en": "Position inside the page", "gu": "Page ની અંદર સ્થાન"}}, {"name": {"en": "Physical address", "gu": "Physical address"}, "f": "PA = f × page size + d", "terms": {"en": "f = page_table[p]", "gu": "f = page_table[p]"}}, {"name": {"en": "Address bits", "gu": "Address bits"}, "f": "LA bits = log<sub>2</sub>(pages) + log<sub>2</sub>(page size)", "terms": {"en": "PA bits = log<sub>2</sub>(frames) + log<sub>2</sub>(page size)", "gu": "PA bits = log<sub>2</sub>(frames) + log<sub>2</sub>(page size)"}}]}, {"title": {"en": "Segmentation and Page Replacement", "gu": "Segmentation અને Page Replacement"}, "items": [{"name": {"en": "Segment address", "gu": "Segment address"}, "f": "PA = base[s] + d   (if d &lt; limit[s])", "terms": {"en": "Otherwise trap: addressing error", "gu": "નહીં તો trap: addressing error"}}, {"name": {"en": "Page fault rate", "gu": "Page fault rate"}, "f": "Fault rate = page faults / references", "terms": {"en": "× 100 for percentage", "gu": "ટકા માટે × 100"}}, {"name": {"en": "Hit ratio", "gu": "Hit ratio"}, "f": "Hit ratio = (references − faults) / references", "terms": {"en": "Hit ratio + fault rate = 1", "gu": "Hit ratio + fault rate = 1"}}]}], "viva": [{"title": {"en": "Addresses and Swapping", "gu": "Addresses અને Swapping"}, "items": [{"q": {"en": "What is a logical address?", "gu": "Logical address શું છે?"}, "a": {"en": "An address generated by the CPU; also called a virtual address.", "gu": "CPU એ બનાવેલું address; તેને virtual address પણ કહે છે."}}, {"q": {"en": "What is a physical address?", "gu": "Physical address શું છે?"}, "a": {"en": "The actual address of a location in main memory, seen by the memory unit.", "gu": "Main memory માં સ્થાનનું ખરું address, જે memory unit જુએ છે."}}, {"q": {"en": "What is the MMU?", "gu": "MMU શું છે?"}, "a": {"en": "Memory Management Unit: hardware that maps logical addresses to physical addresses at run time.", "gu": "Memory Management Unit: run time પર logical addresses ને physical addresses માં map કરતું hardware."}}, {"q": {"en": "What is swapping?", "gu": "Swapping શું છે?"}, "a": {"en": "Temporarily moving a process from memory to a backing store and bringing it back later.", "gu": "Process ને કામચલાઉ memory માંથી backing store પર ખસેડી પછી પાછી લાવવી."}}, {"q": {"en": "What is roll out, roll in?", "gu": "Roll out, roll in શું છે?"}, "a": {"en": "A swapping variant for priority scheduling: a low-priority process is swapped out for a high-priority one.", "gu": "Priority scheduling માટે swapping નો પ્રકાર: high-priority process માટે low-priority process swap out થાય."}}]}, {"title": {"en": "Contiguous Allocation", "gu": "Contiguous Allocation"}, "items": [{"q": {"en": "What is internal fragmentation?", "gu": "Internal fragmentation શું છે?"}, "a": {"en": "Unused memory inside an allocated partition or page.", "gu": "ફાળવેલા partition કે page ની અંદરની ન વપરાયેલી memory."}}, {"q": {"en": "What is external fragmentation?", "gu": "External fragmentation શું છે?"}, "a": {"en": "Enough total free memory exists but it is split into non-contiguous holes.", "gu": "કુલ free memory પૂરતી હોય પણ non-contiguous holes માં વહેંચાયેલી હોય."}}, {"q": {"en": "What is compaction?", "gu": "Compaction શું છે?"}, "a": {"en": "Moving processes so that all free holes join into one large block.", "gu": "Processes ખસેડી બધા free holes ને એક મોટા block માં જોડવા."}}, {"q": {"en": "Which fit leaves the largest leftover hole?", "gu": "કયો fit સૌથી મોટો બાકી hole છોડે છે?"}, "a": {"en": "Worst fit, because it always uses the largest hole.", "gu": "Worst fit, કારણ કે તે હંમેશા સૌથી મોટો hole વાપરે છે."}}, {"q": {"en": "Which registers are used for protection?", "gu": "Protection માટે કયા registers વપરાય?"}, "a": {"en": "The relocation (base) register and the limit register.", "gu": "Relocation (base) register અને limit register."}}, {"q": {"en": "What is MFT and MVT?", "gu": "MFT અને MVT શું છે?"}, "a": {"en": "MFT: multiprogramming with a fixed number of tasks (fixed partitions); MVT: with a variable number of tasks (dynamic partitions).", "gu": "MFT: fixed partitions સાથે multiprogramming; MVT: dynamic (variable) partitions સાથે multiprogramming."}}]}, {"title": {"en": "Paging and Segmentation", "gu": "Paging અને Segmentation"}, "items": [{"q": {"en": "What are pages and frames?", "gu": "Pages અને frames શું છે?"}, "a": {"en": "Fixed-size blocks of logical memory are pages; equal-size blocks of physical memory are frames.", "gu": "Logical memory ના fixed-size blocks pages છે; physical memory ના સમાન કદના blocks frames છે."}}, {"q": {"en": "What does a page table contain?", "gu": "Page table માં શું હોય છે?"}, "a": {"en": "The frame number for each page of the process (plus valid/invalid and protection bits).", "gu": "Process ના દરેક page નો frame number (સાથે valid/invalid અને protection bits)."}}, {"q": {"en": "Does paging have external fragmentation?", "gu": "Paging માં external fragmentation હોય?"}, "a": {"en": "No; it can have only internal fragmentation in the last page.", "gu": "ના; માત્ર છેલ્લા page માં internal fragmentation હોઈ શકે."}}, {"q": {"en": "What is a segment?", "gu": "Segment શું છે?"}, "a": {"en": "A logical unit of a program such as main, a function, the stack or an array, of variable size.", "gu": "Program નો logical unit જેમ કે main, function, stack કે array, જેનું કદ બદલાય."}}, {"q": {"en": "What does a segment table entry contain?", "gu": "Segment table entry માં શું હોય?"}, "a": {"en": "The base (starting physical address) and limit (length) of the segment.", "gu": "Segment નો base (શરૂઆતનું physical address) અને limit (લંબાઈ)."}}]}, {"title": {"en": "Page Replacement", "gu": "Page Replacement"}, "items": [{"q": {"en": "What is a page fault?", "gu": "Page fault શું છે?"}, "a": {"en": "A trap that occurs when a process accesses a page that is not in main memory.", "gu": "Process main memory માં ન હોય તેવું page access કરે ત્યારે થતો trap."}}, {"q": {"en": "What is demand paging?", "gu": "Demand paging શું છે?"}, "a": {"en": "Loading a page into memory only when it is needed (on a page fault).", "gu": "Page ની જરૂર પડે ત્યારે જ (page fault પર) તેને memory માં load કરવું."}}, {"q": {"en": "Which page does FIFO replace?", "gu": "FIFO કયું page બદલે છે?"}, "a": {"en": "The page that has been in memory the longest (loaded first).", "gu": "Memory માં સૌથી લાંબા સમયથી રહેલું (પહેલું load થયેલું) page."}}, {"q": {"en": "Which page does LRU replace?", "gu": "LRU કયું page બદલે છે?"}, "a": {"en": "The page that has not been used for the longest period of time.", "gu": "સૌથી લાંબા સમયથી ન વપરાયેલું page."}}, {"q": {"en": "What is Belady's anomaly?", "gu": "Belady's anomaly શું છે?"}, "a": {"en": "With FIFO, increasing the number of frames can increase the number of page faults.", "gu": "FIFO માં frames ની સંખ્યા વધારવાથી page faults વધી શકે."}}, {"q": {"en": "What is thrashing?", "gu": "Thrashing શું છે?"}, "a": {"en": "A process spends more time paging (swapping pages in and out) than executing.", "gu": "Process execution કરતાં paging (pages અંદર-બહાર) માં વધુ સમય ગાળે."}}]}], "exam_questions": [{"q": {"en": "Differentiate between logical and physical address.", "gu": "Logical અને physical address વચ્ચે તફાવત આપો."}, "marks": 3}, {"q": {"en": "Explain swapping with a diagram.", "gu": "Swapping આકૃતિ સાથે સમજાવો."}, "marks": 3}, {"q": {"en": "Explain multiprogramming with fixed partitions and dynamic partitions.", "gu": "Fixed partitions અને dynamic partitions સાથે multiprogramming સમજાવો."}, "marks": 4}, {"q": {"en": "Differentiate between internal and external fragmentation. What is compaction?", "gu": "Internal અને external fragmentation વચ્ચે તફાવત આપો. Compaction શું છે?"}, "marks": 4}, {"q": {"en": "Explain memory relocation and protection using base and limit registers.", "gu": "Base અને limit registers વડે memory relocation અને protection સમજાવો."}, "marks": 4}, {"q": {"en": "Explain first fit, best fit and worst fit with an example.", "gu": "First fit, best fit અને worst fit ઉદાહરણ સાથે સમજાવો."}, "marks": 4}, {"q": {"en": "Jobs 20, 200, 500, 50, 150 KB; partitions 50, 300, 75, 700, 100 KB. Apply first, best and worst fit.", "gu": "Jobs 20, 200, 500, 50, 150 KB; partitions 50, 300, 75, 700, 100 KB. First, best અને worst fit લાગુ કરો."}, "marks": 7}, {"q": {"en": "Explain paging with a diagram.", "gu": "Paging આકૃતિ સાથે સમજાવો."}, "marks": 4}, {"q": {"en": "Explain address translation in paging with the hardware diagram.", "gu": "Hardware diagram સાથે paging માં address translation સમજાવો."}, "marks": 7}, {"q": {"en": "Explain segmentation and its address translation.", "gu": "Segmentation અને તેનું address translation સમજાવો."}, "marks": 7}, {"q": {"en": "Differentiate between paging and segmentation.", "gu": "Paging અને segmentation વચ્ચે તફાવત આપો."}, "marks": 4}, {"q": {"en": "What is a page fault? Explain the steps in handling a page fault.", "gu": "Page fault શું છે? Page fault સંભાળવાના પગલાં સમજાવો."}, "marks": 4}, {"q": {"en": "Explain FIFO page replacement. What is Belady's anomaly?", "gu": "FIFO page replacement સમજાવો. Belady's anomaly શું છે?"}, "marks": 4}, {"q": {"en": "Find page faults using FIFO and LRU for 1, 2, 3, 4, 5, 1, 3, 1, 6, 3, 2, 3 with 4 frames.", "gu": "4 frames સાથે 1, 2, 3, 4, 5, 1, 3, 1, 6, 3, 2, 3 માટે FIFO અને LRU વડે page faults શોધો."}, "marks": 7}, {"q": {"en": "Compare FIFO and LRU page replacement algorithms.", "gu": "FIFO અને LRU page replacement algorithms ની સરખામણી કરો."}, "marks": 3}], "tabs": ["notes", "diagrams", "equations", "numericals", "viva", "exam"], "diagrams": [{"id": "os3_mmu", "title": {"en": "Logical to Physical Address (MMU)", "gu": "Logical થી Physical Address (MMU)"}, "file": "diagrams/os3_mmu.svg"}, {"id": "os3_swap", "title": {"en": "Swapping of Two Processes", "gu": "બે Processes નું Swapping"}, "file": "diagrams/os3_swap.svg"}, {"id": "os3_fixed", "title": {"en": "Fixed Partitions: Internal Fragmentation", "gu": "Fixed Partitions: Internal Fragmentation"}, "file": "diagrams/os3_fixed.svg"}, {"id": "os3_dynamic", "title": {"en": "Dynamic (Variable) Partitions", "gu": "Dynamic (Variable) Partitions"}, "file": "diagrams/os3_dynamic.svg"}, {"id": "os3_frag", "title": {"en": "Internal vs External Fragmentation", "gu": "Internal vs External Fragmentation"}, "file": "diagrams/os3_frag.svg"}, {"id": "os3_compact", "title": {"en": "Compaction", "gu": "Compaction"}, "file": "diagrams/os3_compact.svg"}, {"id": "os3_protect", "title": {"en": "Relocation and Protection Hardware", "gu": "Relocation અને Protection Hardware"}, "file": "diagrams/os3_protect.svg"}, {"id": "os3_fit", "title": {"en": "First, Best and Worst Fit (Practical 3)", "gu": "First, Best અને Worst Fit (Practical 3)"}, "file": "diagrams/os3_fit.svg"}, {"id": "os3_paging", "title": {"en": "Paging Model", "gu": "Paging Model"}, "file": "diagrams/os3_paging.svg"}, {"id": "os3_paging_hw", "title": {"en": "Address Translation in Paging", "gu": "Paging માં Address Translation"}, "file": "diagrams/os3_paging_hw.svg"}, {"id": "os3_segment", "title": {"en": "Segmentation: Segment Table", "gu": "Segmentation: Segment Table"}, "file": "diagrams/os3_segment.svg"}, {"id": "os3_seg_hw", "title": {"en": "Address Translation in Segmentation", "gu": "Segmentation માં Address Translation"}, "file": "diagrams/os3_seg_hw.svg"}, {"id": "os3_pagefault", "title": {"en": "Steps in Handling a Page Fault", "gu": "Page Fault handle કરવાના પગલાં"}, "file": "diagrams/os3_pagefault.svg"}, {"id": "os3_fifo", "title": {"en": "FIFO Page Replacement (Practical 4)", "gu": "FIFO Page Replacement (Practical 4)"}, "file": "diagrams/os3_fifo.svg"}, {"id": "os3_lru", "title": {"en": "LRU Page Replacement (Practical 4)", "gu": "LRU Page Replacement (Practical 4)"}, "file": "diagrams/os3_lru.svg"}]};

"0\" fill=\"#fff\" stroke=\"#BBB\" stroke-width=\"1.2\"/><text x=\"224\" y=\"259.8\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"bold\">free 70</text><text x=\"310\" y=\"43.2\" font-size=\"9.2\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">(d) P1 ends</text><rect x=\"272\" y=\"50\" width=\"76\" height=\"31.200000000000003\" rx=\"0\" fill=\"#F1E8FC\" stroke=\"#7B2CD9\" stroke-width=\"1.2\"/><text x=\"310\" y=\"68.7\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">OS</text><rect x=\"272\" y=\"81.2\" width=\"76\" height=\"46.800000000000004\" rx=\"0\" fill=\"#fff\" stroke=\"#BBB\" stroke-width=\"1.2\"/><text x=\"310\" y=\"107.7\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"bold\">hole 60</text><rect x=\"272\" y=\"128.0\" width=\"76\" height=\"39.0\" rx=\"0\" fill=\"#E3F0FC\" stroke=\"#1565C0\" stroke-width=\"1.2\"/><text x=\"310\" y=\"150.6\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1565C0\" font-weight=\"bold\">P4 (50)</text><rect x=\"272\" y=\"167.0\" width=\"76\" height=\"23.400000000000002\" rx=\"0\" fill=\"#fff\" stroke=\"#BBB\" stroke-width=\"1.2\"/><text x=\"310\" y=\"181.8\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"bold\">hole 30</text><rect x=\"272\" y=\"190.4\" width=\"76\" height=\"39.0\" rx=\"0\" fill=\"#E3F5E6\" stroke=\"#2E7D32\" stroke-width=\"1.2\"/><text x=\"310\" y=\"213.0\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#2E7D32\" font-weight=\"bold\">P3 (50)</text><rect x=\"272\" y=\"229.4\" width=\"76\" height=\"54.6\" rx=\"0\" fill=\"#fff\" stroke=\"#BBB\" stroke-width=\"1.2\"/><text x=\"310\" y=\"259.8\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"bold\">free 70</text><rect x=\"12\" y=\"298.0\" width=\"336\" height=\"85\" rx=\"7\" fill=\"#E3F0FC\" stroke=\"#1565C0\" stroke-width=\"1.1\"/><text x=\"20\" y=\"316.4\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">Partitions are created at run time with exactly the</text><text x=\"20\" y=\"331.4\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">size each process needs (MVT): no internal waste.</text><text x=\"20\" y=\"346.4\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">As processes leave, holes of various sizes appear</text><text x=\"20\" y=\"361.4\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">scattered in memory: external fragmentation.</text><text x=\"20\" y=\"376.4\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">Here 60 + 30 + 70 = 160 KB is free, but not contiguous.</text></svg>", "os3_frag": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 320\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"320\" fill=\"#ffffff\"/><text x=\"180\" y=\"23.1\" font-size=\"14.5\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">Internal vs External Fragmentation</text><defs><pattern id=\"hx\" width=\"6\" height=\"6\" patternUnits=\"userSpaceOnUse\" patternTransform=\"rotate(45)\"><rect width=\"6\" height=\"6\" fill=\"#FFF6D6\"/><line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"6\" stroke=\"#E0A800\" stroke-width=\"2\"/></pattern></defs><text x=\"90\" y=\"43.9\" font-size=\"11\" text-anchor=\"middle\" fill=\"#8A6400\" font-weight=\"bold\">Internal</text><rect x=\"40\" y=\"52\" width=\"100\" height=\"120\" rx=\"0\" fill=\"#fff\" stroke=\"#222\" stroke-width=\"1.4\"/><text x=\"36\" y=\"115.1\" font-size=\"8.8\" text-anchor=\"end\" fill=\"#666\" font-weight=\"normal\">100 KB</text><rect x=\"40\" y=\"52\" width=\"100\" height=\"92\" rx=\"0\" fill=\"#E3F5E6\" stroke=\"#2E7D32\" stroke-width=\"1.2\"/><text x=\"90\" y=\"101.2\" font-size=\"9\" text-anchor=\"middle\" fill=\"#2E7D32\" font-weight=\"bold\">process 77 KB</text><rect x=\"40\" y=\"144\" width=\"100\" height=\"28\" fill=\"url(#hx)\" stroke=\"#E0A800\" stroke-width=\"1.2\"/><te     else if (m[5]) o += PKW.has(m[5]) ? `<span class="kw">${w}</span>` : PTY.has(m[5]) ? `<span class="ty">${w}</span>` : w;
    else o += `<span class="nu">${w}</span>`;
  }
  return o + esc(src.slice(last));
}
function hl(src){
  if (META.code_lang === 'python') return hlPy(src);
  const re = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(^[ \t]*#[^\n]*)|([A-Za-z_]\w*)(?=\s*\()|([A-Za-z_]\w*)|(\b\d+(?:\.\d+)?[fFlLuU]*\b)/gm;
  let o='', last=0, m;
  while ((m = re.exec(src))){
    o += esc(src.slice(last, m.index)); last = re.lastIndex;
    const w = esc(m[0]);
    if (m[1]) o += `<span class="cm">${w}</span>`;
    else if (m[2]) o += `<span class="st">${w}</span>`;
    else if (m[3]) o += `<span class="pp">${w}</span>`;
    else if (m[4]) o += KW.has(m[4]) ? `<span class="kw">${w}</span>` : TY.has(m[4]) ? `<span class="ty">${w}</span>` : `<span class="fn">${w}</span>`;
    else if (m[5]) o += KW.has(m[5]) ? `<span class="kw">${w}</span>` : TY.has(m[5]) ? `<span class="ty">${w}</span>` : w;
    else o += `<span class="nu">${w}</span>`;
  }
  return o + esc(src.slice(last));
}
const progBody = p => `<div class="pl">${L('code')}</div><pre class="code">${hl(t(p.code))}</pre><div class="pl">${L('output')}</div><pre class="out">${esc(p.out)}</pre>${p.plot?`<div class="pl">${L('plot')}</div>`+dgInline(p.plot).replace('class="dg"','class="dg pg"'):''}${p.expl?`<div class="pl">${L('expl')}</div>${fixTables(t(p.expl))}`:''}`;
const pBox = id => { const p=(U.programs||[]).find(x=>x.id===id); if(!p) return ''; return `<div class="pbox"><div class="et">${L('prog')}: ${t(p.title)}</div>${progBody(p)}</div>`; };
const exBox = id => { const n=(U.numericals||[]).find(x=>x.id===id); if(!n) return ''; return `<div class="ex"><div class="et">${L('ex')}</div><div class="eq2">${t(n.q)}</div>${fixTables(t(n.a))}</div>`; };
function notes(){
  let h = `<div class="intro"><b>${t(U.title)}</b><div>${L('unit')} ${U.unit} · ${U.weightage}% ${L('intro')} · ${U.hours} ${L('hours')}</div><div>${L(U.programs?(META.code_lang==='python'?'intropy':'introc'):'introd')}</div></div>`;
  U.notes.forEach((sec,si)=>{
    h += `<div class="sec">${head(t(sec.title))}`;
    sec.items.forEach((it,i)=>{
      const open = si===0&&i===0 ? ' open' : '';
      if (it.h) {
        h += `<div class="card${it.key?' key':''}${open}"><div class="q hd"><span class="t">${it.key?'⭐ ':''}${t(it.h)}</span>${chev}</div>
        <div class="a rn" style="padding-left:18px">${fixTables(t(it.body)).replace(/margin:0 0 10px -36px/g,'')}${it.diagram?dgInline(it.diagram):''}${(it.examples||[]).map(exBox).join('')}${(it.programs||[]).map(pBox).join('')}</div></div>`;
      } else {
        h += `<div class="card${open}"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(it.q)}</span>${chev}</div>
        <div class="a">${fixTables(t(it.a))}${it.diagram?dgInline(it.diagram):''}</div></div>`;
      }
    });
    h += `</div>`;
  });
  return h;
}
function numericals(){
  return `<div class="sec">${head(L('numericals'))}` + (U.numericals||[]).map((n,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(n.q)}</span>${chev}</div><div class="a">${fixTables(t(n.a))}</div></div>`).join('') + `</div>`;
}
function diagrams(){
  return `<div class="sec">${head(L(U.programs&&META.code_lang!=='python'?'flowcharts':'diagrams'),false)}<div style="height:10px"></div>` + U.diagrams.map((d,i)=>
    `<div class="dcard" data-dg="${d.id}"><div class="h">${i+1}. ${t(d.title)}</div>${SVG[d.id]}</div>`).join('') + `</div>`;
}
function equations(){
  return U.equations.map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><span class="fbox">${e.f}</span></span>${chev}</div>
     <div class="a"><p>${t(e.terms)}</p></div></div>`).join('') + `</div>`).join('');
}
function viva(){
  return U.viva.map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((v,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(v.q)}</span>${chev}</div><div class="a"><p>${t(v.a)}</p></div></div>`).join('') + `</div>`).join('');
}
function exam(){
  return `<div class="sec">${head(L('examhead'),false)}` + U.exam_questions.map((x,i)=>
    `<div class="card"><div class="q" style="cursor:default"><span class="n">${i+1}.</span><span class="t">${t(x.q)}</span><span class="mk">${x.marks} ${L('marks')}</span></div></div>`).join('') + `</div>`;
}
function programs(){
  return `<div class="sec">${head(L('programs'))}` + (U.programs||[]).map((p,i)=>
    `<div class="card"><div class="q hd"><span class="n">${i+1}.</span><span class="t">${t(p.title)}</span>${chev}</div><div class="a pa">${progBody(p)}</div></div>`).join('') + `</div>`;
}
function syntax(key){
  return (U[typeof key==='string'?key:'syntax']||[]).map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><pre class="code sx">${hl(e.f)}</pre></span>${chev}</div>
     <div class="a">${e.terms && t(e.terms) ? fixTables(t(e.terms)) : ''}</div></div>`).join('') + `</div>`).join('');
}
const flowcharts = diagrams;
const algorithms = () => syntax('algorithms');
const ALLV = {notes, programs, diagrams, flowcharts, algorithms, syntax, equations, numericals, viva, exam};
const VIEWS = U.tabs ? Object.fromEntries(U.tabs.map(k=>[k, ALLV[k]])) : U.programs ? (META.code_lang==='python' ? {notes, programs, diagrams, syntax, viva, exam} : {notes, programs, flowcharts, syntax, viva, exam}) : U.numericals ? {notes, diagrams, equations, numericals, viva, exam} : {notes, diagrams, equations, viva, exam};
function render(){
  document.getElementById('title').textContent = `${L('unit')} ${U.unit}: ${t(U.title)}`;
  document.getElementById('sub').textContent = `${t(META.name)} · ${META.code}`;
  document.getElementById('lang').textContent = S.lang==='en' ? 'ગુ' : 'EN';
  document.getElementById('lang').style.display = META.languages.includes('gu') ? '' : 'none';
  document.getElementById('tabs').innerHTML = Object.keys(VIEWS).map(k=>`<button class="tab${S.tab===k?' on':''}" data-tab="${k}">${L(k)}</button>`).join('');
  document.getElementById('view').innerHTML = VIEWS[S.tab]();
  document.querySelectorAll('#view pre.c').forEach(e=>{ e.innerHTML = hl(e.textContent); e.className='code'; });
}
let zoom = 1;
function setZoom(z){ zoom = Math.min(4, Math.max(1, z)); const w=document.getElementById('zw'); w.style.width=(zoom*100)+'%'; document.getElementById('zr').textContent=Math.round(zoom*100)+'%'; }
document.addEventListener('click', e=>{
  const q = e.target.closest('.q'); if (q && q.parentElement.querySelector('.a')) { q.parentElement.classList.toggle('open'); return; }
  const tb = e.target.closest('[data-tab]'); if (tb){ S.tab = tb.dataset.tab; render(); window.scrollTo(0,0); return; }
  if (e.target.closest('#lang')){ S.lang = S.lang==='en'?'gu':'en'; render(); return; }
  const m = e.target.closest('[data-more]');
  document.querySelectorAll('.menu.show').forEach(x=>{ if(!m || x!==m.nextElementSibling) x.classList.remove('show'); });
  if (m){ m.nextElementSibling.classList.toggle('show'); return; }
  const act = e.target.closest('[data-act]');
  if (act){ act.closest('.sec').querySelectorAll('.card').forEach(c=>{ if(c.querySelector('.a')) c.classList.toggle('open', act.dataset.act==='expand'); }); act.parentElement.classList.remove('show'); return; }
  const dg = e.target.closest('[data-dg]');
  if (dg){ const id=dg.dataset.dg; document.getElementById('mt').textContent=t(U.diagrams.find(d=>d.id===id).title); document.getElementById('zw').innerHTML=SVG[id]; setZoom(1); document.getElementById('modal').classList.add('show'); return; }
  if (e.target.closest('#mx')) document.getElementById('modal').classList.remove('show');
  if (e.target.closest('#zi')) setZoom(zoom+0.5);
  if (e.target.closest('#zo')) setZoom(zoom-0.5);
  if (e.target.closest('#zr')) setZoom(1);
});
render();
</script></body></html>
