<script>
const U = {"subject": "DI03000041", "unit": 3, "format": "notes", "title": {"en": "Memory Management", "gu": "Memory Management"}, "weightage": 23, "hours": 10, "notes": [{"title": {"en": "3.1 Memory Management Basics", "gu": "3.1 Memory Management ની મૂળભૂત બાબતો"}, "items": [{"h": {"en": "3.1.1 Logical and Physical Address", "gu": "3.1.1 Logical અને Physical Address"}, "body": {"en": "<p><b>Memory management</b> is the function of the OS that keeps track of every memory location (free or allocated), decides which process gets memory and how much, allocates and frees it, and protects processes from each other. A program must be brought into main memory to run, because the CPU can directly access only registers and main memory.</p>\n<ul>\n<li><b>Logical address (virtual address):</b> the address generated by the CPU while executing a program. The set of all logical addresses of a program is its <b>logical address space</b>.</li>\n<li><b>Physical address:</b> the actual address of a location in main memory, i.e. the address loaded into the memory-address register. The set of these is the <b>physical address space</b>.</li>\n</ul>\n<h4>Memory Management Unit (MMU)</h4>\n<p>The <b>MMU</b> is a hardware device that maps logical addresses to physical addresses <b>at run time</b>. In the simplest scheme, the value of the <b>relocation register</b> is added to every logical address:</p>\n<p style=\"text-align:center\"><b>physical address = relocation register + logical address</b></p>\n<p>Example: relocation register = 14000, logical address 346 → physical address 14346. The user program deals only with logical addresses (0 to max); it never sees the real physical addresses (R + 0 to R + max).</p>\n<h4>Address binding</h4>\n<ul><li><b>Compile time:</b> absolute code if the memory location is known in advance.</li><li><b>Load time:</b> relocatable code; addresses fixed when loaded.</li><li><b>Execution time:</b> binding delayed until run time (needs MMU); a process can be moved during execution. Logical and physical addresses differ only in this scheme.</li></ul>\n<h4>Logical vs physical address</h4>\n<table><tr><th>Point</th><th>Logical address</th><th>Physical address</th></tr><tr><td>Generated by</td><td>CPU (program)</td><td>Computed by MMU</td></tr><tr><td>Also called</td><td>Virtual address</td><td>Real address</td></tr><tr><td>Visible to</td><td>User program</td><td>Memory unit only; user never sees it</td></tr><tr><td>Address space</td><td>Set of all logical addresses of a program</td><td>Set of physical addresses corresponding to them</td></tr><tr><td>Example</td><td>346</td><td>14346 (if relocation = 14000)</td></tr></table>", "gu": "<p><b>Memory management</b> એ OS નું કાર્ય છે જે દરેક memory location (free કે allocated) નો હિસાબ રાખે છે, કઈ process ને કેટલી memory મળે તે નક્કી કરે, memory ફાળવે અને મુક્ત કરે, અને processes ને એકબીજાથી સુરક્ષિત રાખે. Program ચલાવવા તેને main memory માં લાવવો પડે, કારણ કે CPU સીધું માત્ર registers અને main memory access કરી શકે છે.</p>\n<ul>\n<li><b>Logical address (virtual address):</b> program ચલાવતી વખતે CPU એ બનાવેલું address. Program ના બધા logical addresses નો સમૂહ તેની <b>logical address space</b> છે.</li>\n<li><b>Physical address:</b> main memory માં સ્થાનનું ખરું address, એટલે કે memory-address register માં load થતું address. તેમનો સમૂહ <b>physical address space</b> છે.</li>\n</ul>\n<h4>Memory Management Unit (MMU)</h4>\n<p><b>MMU</b> એ hardware device છે જે logical addresses ને <b>run time પર</b> physical addresses માં map કરે છે. સૌથી સરળ પદ્ધતિમાં દરેક logical address માં <b>relocation register</b> ની કિંમત ઉમેરાય છે:</p>\n<p style=\"text-align:center\"><b>physical address = relocation register + logical address</b></p>\n<p>ઉદાહરણ: relocation register = 14000, logical address 346 → physical address 14346. User program માત્ર logical addresses (0 થી max) સાથે કામ કરે છે; તે ક્યારેય ખરા physical addresses (R + 0 થી R + max) જોતો નથી.</p>\n<h4>Address binding</h4>\n<ul><li><b>Compile time:</b> memory location અગાઉથી ખબર હોય તો absolute code.</li><li><b>Load time:</b> relocatable code; load થાય ત્યારે addresses નક્કી.</li><li><b>Execution time:</b> binding run time સુધી મોકૂફ (MMU જોઈએ); execution દરમિયાન process ખસેડી શકાય. માત્ર આ પદ્ધતિમાં logical અને physical addresses જુદા હોય છે.</li></ul>\n<h4>Logical vs physical address</h4>\n<table><tr><th>મુદ્દો</th><th>Logical address</th><th>Physical address</th></tr><tr><td>કોણ બનાવે</td><td>CPU (program)</td><td>MMU ગણે</td></tr><tr><td>બીજું નામ</td><td>Virtual address</td><td>Real address</td></tr><tr><td>કોને દેખાય</td><td>User program</td><td>માત્ર memory unit; user ક્યારેય જોતો નથી</td></tr><tr><td>Address space</td><td>Program ના બધા logical addresses નો સમૂહ</td><td>તેમને અનુરૂપ physical addresses નો સમૂહ</td></tr><tr><td>ઉદાહરણ</td><td>346</td><td>14346 (relocation = 14000 હોય તો)</td></tr></table>"}, "diagram": "os3_mmu"}, {"h": {"en": "3.1.2 Swapping", "gu": "3.1.2 Swapping"}, "body": {"en": "<p><b>Swapping</b> is a technique in which a process is <b>temporarily moved out of main memory to a backing store</b> (fast disk) and later <b>brought back into memory</b> for continued execution. It allows the total memory needed by all processes to exceed the real physical memory, increasing the degree of multiprogramming.</p>\n<ul>\n<li><b>Swap out (roll out):</b> move a process from memory to the backing store.</li>\n<li><b>Swap in (roll in):</b> bring it back from the backing store into memory.</li>\n<li><b>Backing store:</b> a fast disk, large enough to hold copies of memory images of all users, with direct access to them.</li>\n</ul>\n<h4>Example</h4>\n<p>In Round Robin, when a quantum expires, the memory manager swaps out the process that just finished and swaps in another process. In priority scheduling, if a higher-priority process arrives, a lower-priority process is swapped out (<b>roll out, roll in</b>).</p>\n<h4>Points to note</h4>\n<ul>\n<li>The <b>medium-term scheduler</b> performs swapping.</li>\n<li>Most of the swap time is <b>transfer time</b>, proportional to the amount of memory swapped. E.g. a 100 MB process at 50 MB/s needs 2 s to swap out and 2 s to swap in.</li>\n<li>If binding is at execution time, a process can be swapped back into a <b>different location</b>.</li>\n<li>A process waiting for pending I/O should not be swapped out.</li>\n<li>Modern systems (Linux, Windows) swap <b>pages</b> rather than whole processes (paging + swap space).</li>\n</ul>\n<p><b>Advantages:</b> more processes than memory can run; better memory use. <b>Disadvantage:</b> large swap time (disk I/O) slows the system.</p>", "gu": "<p><b>Swapping</b> એવી પદ્ધતિ છે જેમાં process ને <b>કામચલાઉ main memory માંથી backing store</b> (ઝડપી disk) પર ખસેડાય છે અને પછી આગળ execution માટે <b>memory માં પાછી લવાય</b> છે. તેનાથી બધી processes ને જોઈતી કુલ memory ખરી physical memory કરતાં વધી શકે છે, અને degree of multiprogramming વધે છે.</p>\n<ul>\n<li><b>Swap out (roll out):</b> process ને memory માંથી backing store પર ખસેડવી.</li>\n<li><b>Swap in (roll in):</b> તેને backing store માંથી memory માં પાછી લાવવી.</li>\n<li><b>Backing store:</b> ઝડપી disk, જે બધા users ની memory images ની નકલો રાખી શકે તેટલી મોટી અને તેમનો direct access આપે.</li>\n</ul>\n<h4>ઉદાહરણ</h4>\n<p>Round Robin માં quantum પૂરો થાય ત્યારે memory manager હમણાં પૂરી થયેલી process ને swap out કરે અને બીજી process swap in કરે. Priority scheduling માં ઊંચી priority વાળી process આવે તો ઓછી priority વાળી swap out થાય (<b>roll out, roll in</b>).</p>\n<h4>નોંધવાના મુદ્દા</h4>\n<ul>\n<li><b>Medium-term scheduler</b> swapping કરે છે.</li>\n<li>મોટા ભાગનો swap time <b>transfer time</b> છે, જે swap થતી memory ના પ્રમાણમાં છે. દા.ત. 50 MB/s પર 100 MB process ને swap out કરવા 2 s અને swap in કરવા 2 s લાગે.</li>\n<li>Binding execution time પર હોય તો process ને <b>જુદા સ્થાને</b> swap in કરી શકાય.</li>\n<li>Pending I/O ની રાહ જોતી process ને swap out ન કરવી જોઈએ.</li>\n<li>આધુનિક systems (Linux, Windows) આખી processes ને બદલે <b>pages</b> swap કરે છે (paging + swap space).</li>\n</ul>\n<p><b>ફાયદા:</b> memory કરતાં વધુ processes ચાલી શકે; memory નો સારો ઉપયોગ. <b>ગેરફાયદો:</b> મોટો swap time (disk I/O) system ધીમી કરે.</p>"}, "diagram": "os3_swap"}]}, {"title": {"en": "3.2 Contiguous Memory Allocation", "gu": "3.2 Contiguous Memory Allocation"}, "items": [{"h": {"en": "3.2.1 Multiprogramming with Fixed Partitions (MFT)", "gu": "3.2.1 Fixed Partitions સાથે Multiprogramming (MFT)"}, "body": {"en": "<p>In <b>contiguous memory allocation</b>, each process is placed in a <b>single contiguous block</b> of memory. Memory is usually divided into two parts: the <b>OS</b> (low memory, with the interrupt vector) and the <b>user processes</b>.</p>\n<p>In <b>multiprogramming with fixed partitions</b> (MFT, Multiprogramming with a Fixed number of Tasks), user memory is divided into a number of <b>fixed-size partitions</b> when the system starts. Partitions may be of <b>equal</b> or <b>unequal</b> sizes, but they cannot change later.</p>\n<h4>Working</h4>\n<ul>\n<li>Each partition can hold <b>exactly one process</b>.</li>\n<li>When a partition is free, a process from the input queue is loaded into it; when the process ends, the partition becomes free again.</li>\n<li>The OS keeps a <b>partition table</b> (start, size, free/used).</li>\n<li>Queues: a separate queue for each partition, or a single queue for all.</li>\n</ul>\n<h4>Advantages</h4>\n<ul><li>Simple to implement; little OS overhead.</li><li>Easy protection with base and limit registers.</li></ul>\n<h4>Disadvantages</h4>\n<ul>\n<li><b>Internal fragmentation:</b> a process smaller than the partition wastes the remaining space (e.g. a 20 KB job in a 50 KB partition wastes 30 KB).</li>\n<li>The <b>degree of multiprogramming is limited</b> by the number of partitions.</li>\n<li>A process larger than the largest partition can never run.</li>\n</ul>\n<p>Used in early IBM OS/360 (MFT).</p>", "gu": "<p><b>Contiguous memory allocation</b> માં દરેક process memory ના <b>એક જ સળંગ block</b> માં મુકાય છે. Memory સામાન્ય રીતે બે ભાગમાં વહેંચાય છે: <b>OS</b> (નીચી memory, interrupt vector સાથે) અને <b>user processes</b>.</p>\n<p><b>Fixed partitions સાથે multiprogramming</b> (MFT, Multiprogramming with a Fixed number of Tasks) માં system શરૂ થાય ત્યારે user memory ને ઘણા <b>fixed-size partitions</b> માં વહેંચાય છે. Partitions <b>સરખા</b> કે <b>અસમાન</b> કદના હોઈ શકે, પણ પછી બદલાતા નથી.</p>\n<h4>કાર્યપદ્ધતિ</h4>\n<ul>\n<li>દરેક partition માં <b>બરાબર એક process</b> રહી શકે.</li>\n<li>Partition મુક્ત હોય ત્યારે input queue માંથી process તેમાં load થાય; process પૂરી થાય ત્યારે partition ફરી મુક્ત થાય.</li>\n<li>OS <b>partition table</b> (start, size, free/used) રાખે છે.</li>\n<li>Queues: દરેક partition માટે અલગ queue, અથવા બધા માટે એક queue.</li>\n</ul>\n<h4>ફાયદા</h4>\n<ul><li>અમલ કરવો સરળ; OS overhead ઓછો.</li><li>Base અને limit registers વડે સરળ protection.</li></ul>\n<h4>ગેરફાયદા</h4>\n<ul>\n<li><b>Internal fragmentation:</b> partition કરતાં નાની process બાકીની જગ્યા વેડફે છે (દા.ત. 50 KB partition માં 20 KB job 30 KB વેડફે).</li>\n<li><b>Degree of multiprogramming</b> partitions ની સંખ્યાથી <b>મર્યાદિત</b>.</li>\n<li>સૌથી મોટા partition કરતાં મોટી process ક્યારેય ચાલી ન શકે.</li>\n</ul>\n<p>શરૂઆતની IBM OS/360 (MFT) માં વપરાતું.</p>"}, "diagram": "os3_fixed"}, {"h": {"en": "3.2.2 Multiprogramming with Dynamic Partitions (MVT)", "gu": "3.2.2 Dynamic Partitions સાથે Multiprogramming (MVT)"}, "body": {"en": "<p>In <b>multiprogramming with dynamic (variable) partitions</b> (MVT, Multiprogramming with a Variable number of Tasks), partitions are <b>not fixed in advance</b>. When a process arrives, it is given a partition of <b>exactly the size it needs</b>.</p>\n<h4>Working</h4>\n<ul>\n<li>Initially all user memory is one large free block called a <b>hole</b>.</li>\n<li>When a process arrives, the OS searches for a hole large enough; the process gets the needed part and the rest stays as a smaller hole.</li>\n<li>When a process ends, its memory becomes a hole; adjacent holes are <b>merged</b> into one bigger hole.</li>\n<li>The OS keeps a list of allocated partitions and a list of free holes.</li>\n<li>Which hole to choose is decided by <b>first fit, best fit or worst fit</b>.</li>\n</ul>\n<h4>Advantages</h4>\n<ul><li><b>No internal fragmentation</b>: each process gets exactly what it needs.</li><li>Number and size of processes are flexible; better memory use.</li></ul>\n<h4>Disadvantages</h4>\n<ul><li><b>External fragmentation:</b> after many loads and exits, memory is full of small scattered holes.</li><li>More complex allocation and de-allocation; compaction may be needed.</li></ul>\n<h4>Fixed vs dynamic partitions</h4>\n<table><tr><th>Point</th><th>Fixed partition (MFT)</th><th>Dynamic partition (MVT)</th></tr><tr><td>Partition size</td><td>Fixed at system start</td><td>Created at run time = process size</td></tr><tr><td>Number of partitions</td><td>Fixed</td><td>Varies</td></tr><tr><td>Fragmentation</td><td>Internal</td><td>External</td></tr><tr><td>Degree of multiprogramming</td><td>Limited by the number of partitions</td><td>Flexible</td></tr><tr><td>Implementation</td><td>Simple</td><td>Complex (holes list, compaction)</td></tr></table>", "gu": "<p><b>Dynamic (variable) partitions સાથે multiprogramming</b> (MVT, Multiprogramming with a Variable number of Tasks) માં partitions <b>અગાઉથી નક્કી હોતા નથી</b>. Process આવે ત્યારે તેને <b>જોઈએ તેટલા જ કદનું</b> partition અપાય છે.</p>\n<h4>કાર્યપદ્ધતિ</h4>\n<ul>\n<li>શરૂઆતમાં આખી user memory એક મોટો free block છે જેને <b>hole</b> કહે છે.</li>\n<li>Process આવે ત્યારે OS પૂરતો મોટો hole શોધે; process ને જરૂરી ભાગ મળે અને બાકીનો નાનો hole રહે.</li>\n<li>Process પૂરી થાય ત્યારે તેની memory hole બને; બાજુ બાજુના holes ને એક મોટા hole માં <b>જોડાય</b>.</li>\n<li>OS ફાળવેલા partitions ની યાદી અને free holes ની યાદી રાખે છે.</li>\n<li>કયો hole પસંદ કરવો તે <b>first fit, best fit અથવા worst fit</b> નક્કી કરે છે.</li>\n</ul>\n<h4>ફાયદા</h4>\n<ul><li><b>Internal fragmentation નહીં</b>: દરેક process ને બરાબર જોઈએ તેટલું મળે.</li><li>Processes ની સંખ્યા અને કદ લવચીક; memory નો સારો ઉપયોગ.</li></ul>\n<h4>ગેરફાયદા</h4>\n<ul><li><b>External fragmentation:</b> ઘણા load અને exit પછી memory નાના વેરવિખેર holes થી ભરાઈ જાય.</li><li>Allocation અને de-allocation વધુ જટિલ; compaction ની જરૂર પડી શકે.</li></ul>\n<h4>Fixed vs dynamic partitions</h4>\n<table><tr><th>મુદ્દો</th><th>Fixed partition (MFT)</th><th>Dynamic partition (MVT)</th></tr><tr><td>Partition નું કદ</td><td>System શરૂઆતે નક્કી</td><td>Run time પર = process નું કદ</td></tr><tr><td>Partitions ની સંખ્યા</td><td>નક્કી</td><td>બદલાય</td></tr><tr><td>Fragmentation</td><td>Internal</td><td>External</td></tr><tr><td>Degree of multiprogramming</td><td>Partitions ની સંખ્યાથી મર્યાદિત</td><td>લવચીક</td></tr><tr><td>અમલ</td><td>સરળ</td><td>જટિલ (holes list, compaction)</td></tr></table>"}, "diagram": "os3_dynamic"}, {"h": {"en": "3.2.3 Internal and External Fragmentation", "gu": "3.2.3 Internal અને External Fragmentation"}, "body": {"en": "<p><b>Fragmentation</b> is the wastage of memory: free memory exists but cannot be used effectively.</p>\n<h4>Internal fragmentation</h4>\n<p>Memory allocated to a process is <b>slightly larger than requested</b>; the unused space is <b>inside</b> the allocated block and cannot be used by any other process. It occurs with fixed partitions and paging (the last page of a process is usually not full).</p>\n<p>Example: a partition of 100 KB holds a 77 KB process → 23 KB internal fragmentation.</p>\n<h4>External fragmentation</h4>\n<p>The <b>total free memory is enough</b> to satisfy a request, but it is <b>not contiguous</b>: it is broken into many small holes <b>between</b> allocated blocks. It occurs with dynamic partitions and segmentation. Statistical analysis of first fit shows that for N allocated blocks, about 0.5 N blocks are lost to fragmentation (the <b>50-percent rule</b>).</p>\n<p>Example: holes of 40, 30 and 30 KB = 100 KB free, but an 80 KB process cannot be loaded.</p>\n<h4>Solutions to external fragmentation</h4>\n<ul><li><b>Compaction</b> (join holes).</li><li><b>Non-contiguous allocation:</b> paging and segmentation allow a process to be placed in pieces.</li></ul>\n<h4>Comparison</h4>\n<table><tr><th>Point</th><th>Internal fragmentation</th><th>External fragmentation</th></tr><tr><td>Meaning</td><td>Wasted space inside an allocated block</td><td>Free space outside blocks, split into small holes</td></tr><tr><td>Occurs in</td><td>Fixed partitions, paging</td><td>Dynamic partitions, segmentation</td></tr><tr><td>Cause</td><td>Block is larger than the request</td><td>Processes loaded and removed leave scattered holes</td></tr><tr><td>Solution</td><td>Smaller / variable-size blocks, best fit</td><td>Compaction, paging, segmentation with paging</td></tr><tr><td>Example</td><td>77 KB process in 100 KB partition → 23 KB wasted</td><td>40 + 30 + 30 KB free, 80 KB process cannot load</td></tr></table>", "gu": "<p><b>Fragmentation</b> એટલે memory નો બગાડ: free memory હોય પણ અસરકારક રીતે વાપરી ન શકાય.</p>\n<h4>Internal fragmentation</h4>\n<p>Process ને ફાળવેલી memory <b>માંગ કરતાં થોડી મોટી</b> હોય; ન વપરાયેલી જગ્યા ફાળવેલા block ની <b>અંદર</b> હોય અને બીજી કોઈ process તેને વાપરી ન શકે. તે fixed partitions અને paging માં થાય (process નું છેલ્લું page સામાન્ય રીતે પૂરું ભરાતું નથી).</p>\n<p>ઉદાહરણ: 100 KB partition માં 77 KB process → 23 KB internal fragmentation.</p>\n<h4>External fragmentation</h4>\n<p>Request સંતોષવા <b>કુલ free memory પૂરતી</b> હોય, પણ તે <b>સળંગ નથી</b>: ફાળવેલા blocks <b>વચ્ચે</b> ઘણા નાના holes માં તૂટેલી હોય. તે dynamic partitions અને segmentation માં થાય. First fit ના આંકડાકીય અભ્યાસ મુજબ N ફાળવેલા blocks માટે આશરે 0.5 N blocks fragmentation માં ગુમાવાય છે (<b>50-percent rule</b>).</p>\n<p>ઉદાહરણ: 40, 30 અને 30 KB ના holes = 100 KB free, પણ 80 KB process load ન થઈ શકે.</p>\n<h4>External fragmentation ના ઉકેલ</h4>\n<ul><li><b>Compaction</b> (holes જોડવા).</li><li><b>Non-contiguous allocation:</b> paging અને segmentation process ને ટુકડાઓમાં મૂકવા દે છે.</li></ul>\n<h4>સરખામણી</h4>\n<table><tr><th>મુદ્દો</th><th>Internal fragmentation</th><th>External fragmentation</th></tr><tr><td>અર્થ</td><td>ફાળવેલા block ની અંદર વેડફાતી જગ્યા</td><td>Blocks ની બહારની free જગ્યા, નાના holes માં વહેંચાયેલી</td></tr><tr><td>ક્યાં થાય</td><td>Fixed partitions, paging</td><td>Dynamic partitions, segmentation</td></tr><tr><td>કારણ</td><td>Block request કરતાં મોટો</td><td>Processes load અને દૂર થતાં વેરવિખેર holes રહે</td></tr><tr><td>ઉકેલ</td><td>નાના / variable-size blocks, best fit</td><td>Compaction, paging, segmentation with paging</td></tr><tr><td>ઉદાહરણ</td><td>100 KB partition માં 77 KB process → 23 KB વેડફાય</td><td>40 + 30 + 30 KB free, 80 KB process load ન થાય</td></tr></table>"}, "diagram": "os3_frag"}, {"h": {"en": "3.2.4 Compaction", "gu": "3.2.4 Compaction"}, "body": {"en": "<p><b>Compaction</b> is a solution to external fragmentation. The OS <b>shuffles the memory contents</b> so that all processes are moved to one end of memory and <b>all free holes are combined into one large contiguous block</b>.</p>\n<h4>Example</h4>\n<p>Before: OS | P1 | hole 40 KB | P2 | hole 30 KB | P3 | hole 30 KB.<br>After: OS | P1 | P2 | P3 | free 100 KB. Now an 80 KB process can be loaded.</p>\n<h4>Requirements and problems</h4>\n<ul>\n<li>Possible only if <b>relocation is dynamic</b> (done at execution time): the processes are moved and only the relocation (base) register is changed.</li>\n<li>Not possible with static relocation (compile or load time).</li>\n<li><b>Expensive:</b> copying memory takes a lot of CPU time; processes must be stopped while being moved.</li>\n<li>Processes doing I/O into their memory buffers cannot be moved (or I/O must go through OS buffers).</li>\n<li>Choosing the cheapest compaction strategy is difficult (moving everything to one end is simple but not always optimal).</li>\n</ul>", "gu": "<p><b>Compaction</b> એ external fragmentation નો ઉકેલ છે. OS <b>memory ની સામગ્રીને ફેરવે</b> છે જેથી બધી processes memory ના એક છેડે જાય અને <b>બધા free holes એક મોટા સળંગ block માં ભેગા થાય</b>.</p>\n<h4>ઉદાહરણ</h4>\n<p>પહેલાં: OS | P1 | hole 40 KB | P2 | hole 30 KB | P3 | hole 30 KB.<br>પછી: OS | P1 | P2 | P3 | free 100 KB. હવે 80 KB process load થઈ શકે.</p>\n<h4>જરૂરિયાતો અને સમસ્યાઓ</h4>\n<ul>\n<li>માત્ર <b>relocation dynamic</b> (execution time પર) હોય તો જ શક્ય: processes ખસેડાય અને માત્ર relocation (base) register બદલાય.</li>\n<li>Static relocation (compile કે load time) માં શક્ય નથી.</li>\n<li><b>મોંઘું:</b> memory copy કરવામાં ઘણો CPU time લાગે; ખસેડાતી વખતે processes અટકાવવી પડે.</li>\n<li>તેમના memory buffers માં I/O કરતી processes ખસેડી ન શકાય (અથવા I/O OS buffers દ્વારા કરવો પડે).</li>\n<li>સૌથી સસ્તી compaction strategy પસંદ કરવી મુશ્કેલ (બધું એક છેડે ખસેડવું સરળ છે પણ હંમેશા શ્રેષ્ઠ નથી).</li>\n</ul>"}, "diagram": "os3_compact"}, {"h": {"en": "3.2.5 Memory Relocation and Protection Mechanism", "gu": "3.2.5 Memory Relocation અને Protection Mechanism"}, "body": {"en": "<p>With many processes in memory, the OS must solve two problems:</p>\n<ul>\n<li><b>Relocation:</b> a program does not know in advance where it will be loaded, and it may be moved (swapping, compaction). Its addresses must be adjusted to the actual location.</li>\n<li><b>Protection:</b> a process must not access the memory of the OS or of other processes, by mistake or on purpose.</li>\n</ul>\n<h4>Hardware: relocation and limit registers</h4>\n<ul>\n<li><b>Relocation (base) register:</b> contains the smallest physical address of the process (e.g. 100040).</li>\n<li><b>Limit register:</b> contains the range (size) of logical addresses (e.g. 74600).</li>\n</ul>\n<h4>Working (for every memory reference)</h4>\n<ol>\n<li>The CPU generates a logical address.</li>\n<li>The MMU checks: <b>logical address &lt; limit register?</b></li>\n<li>If <b>no</b> → <b>trap</b> to the OS: addressing error (the process is usually terminated).</li>\n<li>If <b>yes</b> → physical address = logical address + relocation register; memory is accessed.</li>\n</ol>\n<p>When the CPU scheduler selects a process, the <b>dispatcher loads the relocation and limit registers</b> with the correct values from its PCB. Only the OS (in kernel mode) can change these registers, using privileged instructions. This protects the OS and user programs from each other and allows dynamic relocation (the OS can move a process by just changing its relocation value).</p>", "gu": "<p>Memory માં ઘણી processes હોય ત્યારે OS એ બે સમસ્યા ઉકેલવી પડે:</p>\n<ul>\n<li><b>Relocation:</b> program ને અગાઉથી ખબર નથી કે તે ક્યાં load થશે, અને તેને ખસેડાઈ શકે (swapping, compaction). તેના addresses ખરા સ્થાન મુજબ ગોઠવવા પડે.</li>\n<li><b>Protection:</b> process ભૂલથી કે જાણીજોઈને OS કે બીજી processes ની memory access ન કરે.</li>\n</ul>\n<h4>Hardware: relocation અને limit registers</h4>\n<ul>\n<li><b>Relocation (base) register:</b> process નું સૌથી નાનું physical address (દા.ત. 100040).</li>\n<li><b>Limit register:</b> logical addresses ની range (કદ) (દા.ત. 74600).</li>\n</ul>\n<h4>કાર્યપદ્ધતિ (દરેક memory reference માટે)</h4>\n<ol>\n<li>CPU logical address બનાવે.</li>\n<li>MMU તપાસે: <b>logical address &lt; limit register?</b></li>\n<li><b>ના</b> → OS ને <b>trap</b>: addressing error (process સામાન્ય રીતે terminate થાય).</li>\n<li><b>હા</b> → physical address = logical address + relocation register; memory access થાય.</li>\n</ol>\n<p>CPU scheduler process પસંદ કરે ત્યારે <b>dispatcher તેના PCB માંથી relocation અને limit registers</b> માં સાચી કિંમતો load કરે છે. માત્ર OS (kernel mode માં) privileged instructions વડે આ registers બદલી શકે. આ OS અને user programs ને એકબીજાથી સુરક્ષિત રાખે છે અને dynamic relocation શક્ય બનાવે છે (OS માત્ર relocation value બદલી process ખસેડી શકે).</p>"}, "diagram": "os3_protect"}, {"h": {"en": "3.2.6 Allocation Techniques: First Fit, Best Fit, Worst Fit", "gu": "3.2.6 Allocation Techniques: First Fit, Best Fit, Worst Fit"}, "body": {"en": "<p>When a process needs memory, the OS must choose a free partition / hole from the available ones. This is the <b>dynamic storage-allocation problem</b>. Three common strategies:</p>\n<h4>1. First fit</h4>\n<p>Allocate the <b>first</b> hole that is big enough. Searching starts at the beginning of the list (or where the previous search ended: <b>next fit</b>) and stops as soon as a suitable hole is found.</p>\n<ul><li><b>+</b> Fastest; simple.</li><li><b>−</b> Leaves small holes at the beginning of memory.</li></ul>\n<h4>2. Best fit</h4>\n<p>Allocate the <b>smallest</b> hole that is big enough. The entire list must be searched (unless sorted by size).</p>\n<ul><li><b>+</b> Least wasted space in the chosen hole; large holes remain for large processes.</li><li><b>−</b> Slower; produces tiny leftover holes that are useless.</li></ul>\n<h4>3. Worst fit</h4>\n<p>Allocate the <b>largest</b> hole. The entire list must be searched.</p>\n<ul><li><b>+</b> Leftover hole is large and may still be useful.</li><li><b>−</b> Large holes are used up quickly, so big processes may have to wait; usually the worst performance.</li></ul>\n<p><b>Conclusion:</b> simulations show that first fit and best fit are better than worst fit in both time and storage use; first fit is generally the fastest.</p>\n<h4>Practical 3 summary (fixed partitions 50, 300, 75, 700, 100 KB)</h4>\n<ul><li>First fit and best fit: J5 (150 KB) waits; internal fragmentation 355 KB.</li><li>Worst fit: J3 (500 KB) and J5 wait; internal fragmentation 830 KB.</li></ul>", "gu": "<p>Process ને memory જોઈએ ત્યારે OS એ ઉપલબ્ધ partitions / holes માંથી એક પસંદ કરવું પડે. આને <b>dynamic storage-allocation problem</b> કહે છે. ત્રણ સામાન્ય પદ્ધતિઓ:</p>\n<h4>1. First fit</h4>\n<p>પૂરતો મોટો હોય તેવો <b>પહેલો</b> hole ફાળવો. શોધ યાદીની શરૂઆતથી (અથવા પાછલી શોધ જ્યાં પૂરી થઈ ત્યાંથી: <b>next fit</b>) શરૂ થાય અને યોગ્ય hole મળતાં જ અટકે.</p>\n<ul><li><b>+</b> સૌથી ઝડપી; સરળ.</li><li><b>−</b> Memory ની શરૂઆતમાં નાના holes છોડે.</li></ul>\n<h4>2. Best fit</h4>\n<p>પૂરતો મોટો હોય તેવો <b>સૌથી નાનો</b> hole ફાળવો. આખી યાદી શોધવી પડે (કદ પ્રમાણે sorted ન હોય તો).</p>\n<ul><li><b>+</b> પસંદ કરેલા hole માં ઓછામાં ઓછો બગાડ; મોટી processes માટે મોટા holes રહે.</li><li><b>−</b> ધીમું; નકામા નાના બાકી holes બનાવે.</li></ul>\n<h4>3. Worst fit</h4>\n<p><b>સૌથી મોટો</b> hole ફાળવો. આખી યાદી શોધવી પડે.</p>\n<ul><li><b>+</b> બાકી hole મોટો રહે અને હજી ઉપયોગી બની શકે.</li><li><b>−</b> મોટા holes ઝડપથી વપરાઈ જાય, તેથી મોટી processes એ રાહ જોવી પડે; સામાન્ય રીતે સૌથી ખરાબ performance.</li></ul>\n<p><b>નિષ્કર્ષ:</b> simulations દર્શાવે છે કે સમય અને storage બંનેમાં first fit અને best fit, worst fit કરતાં સારા છે; first fit સામાન્ય રીતે સૌથી ઝડપી છે.</p>\n<h4>Practical 3 નો સાર (fixed partitions 50, 300, 75, 700, 100 KB)</h4>\n<ul><li>First fit અને best fit: J5 (150 KB) રાહ જુએ; internal fragmentation 355 KB.</li><li>Worst fit: J3 (500 KB) અને J5 રાહ જુએ; internal fragmentation 830 KB.</li></ul>"}, "diagram": "os3_fit", "examples": ["os3n1", "os3n2", "os3n3", "os3n4", "os3n5"]}]}, {"title": {"en": "3.3 Non-contiguous Allocation: Paging and Segmentation", "gu": "3.3 Non-contiguous Allocation: Paging અને Segmentation"}, "items": [{"h": {"en": "3.3.1 Paging", "gu": "3.3.1 Paging"}, "body": {"en": "<p><b>Paging</b> is a memory-management scheme that allows the physical address space of a process to be <b>non-contiguous</b>. It completely avoids external fragmentation and the need for compaction.</p>\n<h4>Basic method</h4>\n<ul>\n<li><b>Physical memory</b> is divided into fixed-size blocks called <b>frames</b>.</li>\n<li><b>Logical memory</b> (the process) is divided into blocks of the same size called <b>pages</b>.</li>\n<li>Page size = frame size, a power of 2 (typically 4 KB; range 512 bytes to 1 GB).</li>\n<li>To run a process of n pages, the OS finds n free frames (anywhere) and loads the pages into them.</li>\n<li>A <b>page table</b> (one per process) stores, for every page, the frame in which it is loaded.</li>\n<li>The OS keeps a <b>frame table</b> showing which frames are free or allocated.</li>\n</ul>\n<p>Example: a process of 4 pages (0–3) may be loaded as page 0 → frame 1, page 1 → frame 4, page 2 → frame 3, page 3 → frame 7. The pages are scattered, but the program sees one contiguous logical space.</p>\n<h4>Advantages</h4>\n<ul><li>No external fragmentation; any free frame can be used.</li><li>Easy allocation (just a list of free frames); no compaction.</li><li>Supports sharing of common code (reentrant code) and virtual memory.</li></ul>\n<h4>Disadvantages</h4>\n<ul><li><b>Internal fragmentation</b> in the last page (on average half a page per process).</li><li>Page table needs memory and each access needs an extra memory reference (solved with a <b>TLB</b>).</li></ul>", "gu": "<p><b>Paging</b> એ memory-management પદ્ધતિ છે જે process ની physical address space ને <b>non-contiguous</b> (છૂટી છૂટી) રહેવા દે છે. તે external fragmentation અને compaction ની જરૂરિયાત સંપૂર્ણ ટાળે છે.</p>\n<h4>મૂળ પદ્ધતિ</h4>\n<ul>\n<li><b>Physical memory</b> ને fixed-size blocks માં વહેંચાય છે જેને <b>frames</b> કહે છે.</li>\n<li><b>Logical memory</b> (process) ને સરખા કદના blocks માં વહેંચાય છે જેને <b>pages</b> કહે છે.</li>\n<li>Page size = frame size, 2 ની ઘાત (સામાન્ય રીતે 4 KB; range 512 bytes થી 1 GB).</li>\n<li>n pages ની process ચલાવવા OS n free frames (ગમે ત્યાં) શોધી pages તેમાં load કરે.</li>\n<li><b>Page table</b> (દરેક process માટે એક) દરેક page કઈ frame માં load છે તે રાખે છે.</li>\n<li>OS <b>frame table</b> રાખે છે જે બતાવે કે કઈ frames free કે allocated છે.</li>\n</ul>\n<p>ઉદાહરણ: 4 pages (0–3) ની process આ રીતે load થઈ શકે: page 0 → frame 1, page 1 → frame 4, page 2 → frame 3, page 3 → frame 7. Pages વેરવિખેર છે, પણ program ને એક સળંગ logical space દેખાય છે.</p>\n<h4>ફાયદા</h4>\n<ul><li>External fragmentation નહીં; કોઈ પણ free frame વાપરી શકાય.</li><li>સરળ allocation (માત્ર free frames ની યાદી); compaction નહીં.</li><li>Common code (reentrant code) નું sharing અને virtual memory ને support.</li></ul>\n<h4>ગેરફાયદા</h4>\n<ul><li>છેલ્લા page માં <b>internal fragmentation</b> (સરેરાશ process દીઠ અડધું page).</li><li>Page table ને memory જોઈએ અને દરેક access માં એક વધારાનો memory reference (<b>TLB</b> વડે ઉકેલ).</li></ul>"}, "diagram": "os3_paging"}, {"h": {"en": "3.3.2 Address Translation in Paging", "gu": "3.3.2 Paging માં Address Translation"}, "body": {"en": "<p>Every logical address generated by the CPU is divided into two parts:</p>\n<ul>\n<li><b>Page number (p):</b> used as an index into the page table.</li>\n<li><b>Page offset (d):</b> position of the byte within the page.</li>\n</ul>\n<p>If the logical address space is 2<sup>m</sup> and page size is 2<sup>n</sup>, the high-order <b>m − n bits</b> give p and the low-order <b>n bits</b> give d.</p>\n<h4>Steps (paging hardware)</h4>\n<ol>\n<li>CPU generates logical address (p, d).</li>\n<li>p = LA div page size, d = LA mod page size.</li>\n<li>Page table[p] gives frame number <b>f</b>.</li>\n<li>Physical address = <b>f × page size + d</b> (i.e. f replaces p; d is copied unchanged).</li>\n</ol>\n<h4>Worked example</h4>\n<p>Page size = 1 KB (1024 bytes), page table: page 0 → 5, 1 → 6, 2 → 1, 3 → 2. Logical address 2500:</p>\n<ul><li>p = 2500 div 1024 = 2, d = 2500 mod 1024 = 452.</li><li>f = page table[2] = 1.</li><li>PA = 1 × 1024 + 452 = <b>1476</b>.</li></ul>\n<h4>Translation look-aside buffer (TLB)</h4>\n<p>Keeping the page table in memory needs two memory accesses per reference. A <b>TLB</b> is a small, fast associative cache of recent (page, frame) pairs. On a <b>TLB hit</b> the frame is found immediately; on a <b>TLB miss</b> the page table in memory is used and the pair is added to the TLB.</p>\n<p><b>Effective access time (EAT)</b> = h × (TLB time + memory time) + (1 − h) × (TLB time + 2 × memory time), where h is the hit ratio.</p>\n<p><b>Protection:</b> each page-table entry has a <b>valid–invalid bit</b> and read/write bits; access to an invalid page causes a trap.</p>", "gu": "<p>CPU એ બનાવેલું દરેક logical address બે ભાગમાં વહેંચાય છે:</p>\n<ul>\n<li><b>Page number (p):</b> page table માં index તરીકે વપરાય.</li>\n<li><b>Page offset (d):</b> page ની અંદર byte નું સ્થાન.</li>\n</ul>\n<p>Logical address space 2<sup>m</sup> અને page size 2<sup>n</sup> હોય તો ઊંચા <b>m − n bits</b> p આપે અને નીચા <b>n bits</b> d આપે.</p>\n<h4>પગલાં (paging hardware)</h4>\n<ol>\n<li>CPU logical address (p, d) બનાવે.</li>\n<li>p = LA div page size, d = LA mod page size.</li>\n<li>Page table[p] frame number <b>f</b> આપે.</li>\n<li>Physical address = <b>f × page size + d</b> (એટલે કે p ની જગ્યાએ f આવે; d એમનો એમ copy થાય).</li>\n</ol>\n<h4>ઉકેલેલું ઉદાહરણ</h4>\n<p>Page size = 1 KB (1024 bytes), page table: page 0 → 5, 1 → 6, 2 → 1, 3 → 2. Logical address 2500:</p>\n<ul><li>p = 2500 div 1024 = 2, d = 2500 mod 1024 = 452.</li><li>f = page table[2] = 1.</li><li>PA = 1 × 1024 + 452 = <b>1476</b>.</li></ul>\n<h4>Translation look-aside buffer (TLB)</h4>\n<p>Page table memory માં રાખવાથી દરેક reference માટે બે memory accesses જોઈએ. <b>TLB</b> એ તાજેતરના (page, frame) જોડીઓનો નાનો, ઝડપી associative cache છે. <b>TLB hit</b> પર frame તરત મળે; <b>TLB miss</b> પર memory માંની page table વપરાય અને જોડી TLB માં ઉમેરાય.</p>\n<p><b>Effective access time (EAT)</b> = h × (TLB time + memory time) + (1 − h) × (TLB time + 2 × memory time), જ્યાં h hit ratio છે.</p>\n<p><b>Protection:</b> દરેક page-table entry માં <b>valid–invalid bit</b> અને read/write bits હોય; invalid page ના access પર trap થાય.</p>"}, "diagram": "os3_paging_hw", "examples": ["os3n6", "os3n7", "os3n8"]}, {"h": {"en": "3.3.3 Segmentation", "gu": "3.3.3 Segmentation"}, "body": {"en": "<p><b>Segmentation</b> is a memory-management scheme that supports the <b>programmer's (user's) view of memory</b>. A program is seen as a collection of logical units of <b>different sizes</b>, called <b>segments</b>: main program, functions, stack, symbol table, global data, arrays, etc.</p>\n<h4>Basic method</h4>\n<ul>\n<li>Each segment has a <b>name (number)</b> and a <b>length</b>.</li>\n<li>A logical address is a pair <b>&lt;segment number s, offset d&gt;</b>.</li>\n<li>The compiler creates the segments automatically (e.g. code, global variables, heap, stack, C library).</li>\n<li>Each segment is loaded into a contiguous area of memory, but different segments can be anywhere (non-contiguous).</li>\n<li>A <b>segment table</b> stores for each segment:<ul><li><b>Base:</b> starting physical address of the segment.</li><li><b>Limit:</b> length of the segment.</li></ul></li>\n</ul>\n<h4>Advantages</h4>\n<ul><li>Matches the user's view; segments can grow (e.g. stack).</li><li>Easy <b>protection</b> (code segment read-only) and <b>sharing</b> (a shared library segment).</li><li>No internal fragmentation.</li></ul>\n<h4>Disadvantages</h4>\n<ul><li><b>External fragmentation</b>, because segments are of variable size (needs best/first fit, compaction).</li><li>Large segments may be hard to place. Solution: <b>segmentation with paging</b> (used by Intel x86).</li></ul>", "gu": "<p><b>Segmentation</b> એ memory-management પદ્ધતિ છે જે <b>programmer (user) ના memory view</b> ને support કરે છે. Program ને <b>જુદા જુદા કદના</b> logical units નો સમૂહ ગણાય છે જેને <b>segments</b> કહે છે: main program, functions, stack, symbol table, global data, arrays વગેરે.</p>\n<h4>મૂળ પદ્ધતિ</h4>\n<ul>\n<li>દરેક segment ને <b>નામ (number)</b> અને <b>length</b> હોય.</li>\n<li>Logical address એક જોડી છે <b>&lt;segment number s, offset d&gt;</b>.</li>\n<li>Compiler segments આપમેળે બનાવે (દા.ત. code, global variables, heap, stack, C library).</li>\n<li>દરેક segment memory ના એક સળંગ વિસ્તારમાં load થાય, પણ જુદા segments ગમે ત્યાં હોઈ શકે (non-contiguous).</li>\n<li><b>Segment table</b> દરેક segment માટે રાખે:<ul><li><b>Base:</b> segment નું શરૂઆતનું physical address.</li><li><b>Limit:</b> segment ની length.</li></ul></li>\n</ul>\n<h4>ફાયદા</h4>\n<ul><li>User ના view સાથે મેળ; segments વધી શકે (દા.ત. stack).</li><li>સરળ <b>protection</b> (code segment read-only) અને <b>sharing</b> (shared library segment).</li><li>Internal fragmentation નહીં.</li></ul>\n<h4>ગેરફાયદા</h4>\n<ul><li>Segments variable size ના હોવાથી <b>external fragmentation</b> (best/first fit, compaction જોઈએ).</li><li>મોટા segments મૂકવા મુશ્કેલ. ઉકેલ: <b>segmentation with paging</b> (Intel x86 માં વપરાય).</li></ul>"}, "diagram": "os3_segment"}, {"h": {"en": "3.3.4 Address Translation in Segmentation", "gu": "3.3.4 Segmentation માં Address Translation"}, "body": {"en": "<p>The <b>segmentation hardware</b> maps the two-dimensional logical address (s, d) to a one-dimensional physical address using the segment table.</p>\n<h4>Steps</h4>\n<ol>\n<li>CPU generates logical address <b>(s, d)</b>.</li>\n<li>Segment number s is used as an index into the segment table to get <b>base</b> and <b>limit</b>.</li>\n<li>Check: <b>d &lt; limit?</b><ul><li>No → <b>trap</b> to OS (addressing error: offset beyond end of segment).</li><li>Yes → <b>physical address = base + d</b>.</li></ul></li>\n</ol>\n<p>Two registers help: <b>STBR</b> (segment-table base register) points to the segment table in memory, and <b>STLR</b> (segment-table length register) gives the number of segments; s must be &lt; STLR.</p>\n<h4>Worked example</h4>\n<p>Segment table: segment 2 → base 4300, limit 400; segment 3 → base 3200, limit 1100.</p>\n<ul>\n<li>(2, 53): 53 &lt; 400 ✓ → PA = 4300 + 53 = <b>4353</b>.</li>\n<li>(3, 852): 852 &lt; 1100 ✓ → PA = 3200 + 852 = <b>4052</b>.</li>\n<li>(2, 500): 500 ≥ 400 ✗ → <b>trap</b> (illegal address).</li>\n</ul>\n<p>Each segment-table entry can also hold protection bits (read / write / execute) and a valid bit.</p>", "gu": "<p><b>Segmentation hardware</b> segment table વડે બે-પરિમાણી logical address (s, d) ને એક-પરિમાણી physical address માં map કરે છે.</p>\n<h4>પગલાં</h4>\n<ol>\n<li>CPU logical address <b>(s, d)</b> બનાવે.</li>\n<li>Segment number s ને segment table માં index તરીકે વાપરી <b>base</b> અને <b>limit</b> મેળવાય.</li>\n<li>તપાસ: <b>d &lt; limit?</b><ul><li>ના → OS ને <b>trap</b> (addressing error: offset segment ના અંત પછી).</li><li>હા → <b>physical address = base + d</b>.</li></ul></li>\n</ol>\n<p>બે registers મદદ કરે: <b>STBR</b> (segment-table base register) memory માંની segment table તરફ point કરે, અને <b>STLR</b> (segment-table length register) segments ની સંખ્યા આપે; s &lt; STLR હોવું જોઈએ.</p>\n<h4>ઉકેલેલું ઉદાહરણ</h4>\n<p>Segment table: segment 2 → base 4300, limit 400; segment 3 → base 3200, limit 1100.</p>\n<ul>\n<li>(2, 53): 53 &lt; 400 ✓ → PA = 4300 + 53 = <b>4353</b>.</li>\n<li>(3, 852): 852 &lt; 1100 ✓ → PA = 3200 + 852 = <b>4052</b>.</li>\n<li>(2, 500): 500 ≥ 400 ✗ → <b>trap</b> (illegal address).</li>\n</ul>\n<p>દરેક segment-table entry માં protection bits (read / write / execute) અને valid bit પણ રાખી શકાય.</p>"}, "diagram": "os3_seg_hw", "examples": ["os3n9"]}, {"h": {"en": "3.3.5 Paging vs Segmentation", "gu": "3.3.5 Paging vs Segmentation"}, "body": {"en": "<p>Both are <b>non-contiguous</b> allocation methods, but they divide memory differently: paging uses fixed-size physical blocks, segmentation uses variable-size logical blocks.</p>\n<table><tr><th>Point</th><th>Paging</th><th>Segmentation</th></tr><tr><td>Division</td><td>Fixed-size pages (by hardware)</td><td>Variable-size segments (logical units)</td></tr><tr><td>Done by</td><td>OS / hardware; invisible to the programmer</td><td>Compiler / programmer view</td></tr><tr><td>Address</td><td>(page number p, offset d)</td><td>(segment number s, offset d)</td></tr><tr><td>Table</td><td>Page table: frame number</td><td>Segment table: base + limit</td></tr><tr><td>Fragmentation</td><td>Internal (last page)</td><td>External</td></tr><tr><td>User view</td><td>Not supported</td><td>Supports the user's view (main, stack, data…)</td></tr><tr><td>Sharing / protection</td><td>Harder (page may mix code and data)</td><td>Easy, per segment</td></tr><tr><td>Size check</td><td>Not needed (d always fits)</td><td>d &lt; limit checked, else trap</td></tr></table>\n<p><b>Segmentation with paging:</b> each segment is itself divided into pages, combining the user view of segmentation with the no-external-fragmentation benefit of paging (e.g. Intel IA-32).</p>", "gu": "<p>બંને <b>non-contiguous</b> allocation પદ્ધતિઓ છે, પણ memory ને જુદી રીતે વહેંચે છે: paging fixed-size physical blocks વાપરે, segmentation variable-size logical blocks વાપરે.</p>\n<table><tr><th>મુદ્દો</th><th>Paging</th><th>Segmentation</th></tr><tr><td>વિભાજન</td><td>Fixed-size pages (hardware વડે)</td><td>Variable-size segments (logical units)</td></tr><tr><td>કોણ કરે</td><td>OS / hardware; programmer ને દેખાતું નથી</td><td>Compiler / programmer નો view</td></tr><tr><td>Address</td><td>(page number p, offset d)</td><td>(segment number s, offset d)</td></tr><tr><td>Table</td><td>Page table: frame number</td><td>Segment table: base + limit</td></tr><tr><td>Fragmentation</td><td>Internal (છેલ્લું page)</td><td>External</td></tr><tr><td>User view</td><td>Support નથી</td><td>User ના view ને support (main, stack, data…)</td></tr><tr><td>Sharing / protection</td><td>અઘરું (page માં code અને data ભળી શકે)</td><td>સરળ, દરેક segment મુજબ</td></tr><tr><td>Size check</td><td>જરૂર નથી (d હંમેશા સમાય)</td><td>d &lt; limit તપાસાય, નહીં તો trap</td></tr></table>\n<p><b>Segmentation with paging:</b> દરેક segment ને pages માં વહેંચાય, જેથી segmentation નો user view અને paging નો no-external-fragmentation લાભ બંને મળે (દા.ત. Intel IA-32).</p>"}}]}, {"title": {"en": "3.4 Page Replacement", "gu": "3.4 Page Replacement"}, "items": [{"h": {"en": "3.4.1 Virtual Memory, Demand Paging and Page Fault", "gu": "3.4.1 Virtual Memory, Demand Paging અને Page Fault"}, "body": {"en": "<p><b>Virtual memory</b> is a technique that allows a process to execute even if it is <b>not completely in main memory</b>. Programs can be larger than physical memory, more programs run at once, and less I/O is needed to load programs.</p>\n<h4>Demand paging</h4>\n<p>In <b>demand paging</b>, a page is loaded into memory <b>only when it is needed</b> (on demand), not in advance. A <b>lazy swapper (pager)</b> never brings a page into memory unless it will be used. The <b>valid–invalid bit</b> in the page table tells whether the page is in memory (v) or not (i).</p>\n<h4>Page fault</h4>\n<p>A <b>page fault</b> occurs when a process accesses a page that is <b>not in main memory</b> (invalid bit). Steps to handle it:</p>\n<ol>\n<li>The process references a page; the page-table entry is invalid → <b>trap</b> to the OS.</li>\n<li>The OS checks: if the reference is illegal, terminate the process; if legal but not in memory, page it in.</li>\n<li>Find a <b>free frame</b> (if none, use a <b>page-replacement algorithm</b> to choose a victim).</li>\n<li>Schedule a disk operation to read the page from the <b>backing store</b> into the frame.</li>\n<li>Update the page table (frame number, valid bit = v).</li>\n<li><b>Restart the instruction</b> that caused the fault.</li>\n</ol>\n<h4>Page replacement</h4>\n<p>When no frame is free, the OS selects a <b>victim page</b>, writes it to disk if it was modified (<b>dirty / modify bit</b>), and loads the new page in its place. A good algorithm gives the <b>lowest page-fault rate</b>. Algorithms are evaluated on a <b>reference string</b> (sequence of page numbers) with a given number of frames.</p>\n<p><b>Thrashing:</b> if a process does not have enough frames, it page-faults continuously and spends more time paging than executing.</p>", "gu": "<p><b>Virtual memory</b> એવી પદ્ધતિ છે જે process <b>સંપૂર્ણ main memory માં ન હોય</b> તો પણ તેને ચલાવવા દે છે. Programs physical memory કરતાં મોટા હોઈ શકે, એક સાથે વધુ programs ચાલે, અને programs load કરવા ઓછો I/O જોઈએ.</p>\n<h4>Demand paging</h4>\n<p><b>Demand paging</b> માં page અગાઉથી નહીં, પણ <b>જરૂર પડે ત્યારે જ</b> (on demand) memory માં load થાય છે. <b>Lazy swapper (pager)</b> જે page વપરાશે નહીં તેને ક્યારેય memory માં લાવતો નથી. Page table નો <b>valid–invalid bit</b> કહે છે કે page memory માં છે (v) કે નથી (i).</p>\n<h4>Page fault</h4>\n<p>Process <b>main memory માં ન હોય</b> (invalid bit) તેવું page access કરે ત્યારે <b>page fault</b> થાય. તેને handle કરવાના પગલાં:</p>\n<ol>\n<li>Process page નો reference કરે; page-table entry invalid → OS ને <b>trap</b>.</li>\n<li>OS તપાસે: reference ગેરકાયદે હોય તો process terminate; કાયદેસર પણ memory માં ન હોય તો page in કરે.</li>\n<li><b>Free frame</b> શોધે (ન હોય તો victim પસંદ કરવા <b>page-replacement algorithm</b> વાપરે).</li>\n<li><b>Backing store</b> માંથી page ને frame માં વાંચવા disk operation schedule કરે.</li>\n<li>Page table update કરે (frame number, valid bit = v).</li>\n<li>Fault કરનાર <b>instruction ફરી શરૂ</b> કરે.</li>\n</ol>\n<h4>Page replacement</h4>\n<p>કોઈ frame free ન હોય ત્યારે OS <b>victim page</b> પસંદ કરે, તે બદલાયું હોય (<b>dirty / modify bit</b>) તો disk પર લખે, અને તેની જગ્યાએ નવું page load કરે. સારો algorithm <b>ઓછામાં ઓછો page-fault rate</b> આપે. Algorithms ને આપેલી frames સાથે <b>reference string</b> (page numbers નો ક્રમ) પર મૂલવાય છે.</p>\n<p><b>Thrashing:</b> process પાસે પૂરતી frames ન હોય તો તે સતત page fault કરે અને execution કરતાં paging માં વધુ સમય ગાળે.</p>"}, "diagram": "os3_pagefault"}, {"h": {"en": "3.4.2 FIFO Page Replacement and Belady's Anomaly", "gu": "3.4.2 FIFO Page Replacement અને Belady's Anomaly"}, "body": {"en": "<p><b>FIFO (First In First Out)</b> is the simplest page-replacement algorithm. When a page must be replaced, the <b>oldest page</b> (the one brought into memory first) is chosen as the victim.</p>\n<h4>Working</h4>\n<ul>\n<li>The OS keeps a <b>FIFO queue</b> of all pages in memory.</li>\n<li>A new page is inserted at the tail; the page at the <b>head</b> is replaced.</li>\n<li>If the referenced page is already in memory → <b>hit</b> (queue does not change).</li>\n</ul>\n<h4>Example (Practical 4)</h4>\n<p>Reference string 1, 2, 3, 4, 5, 1, 3, 1, 6, 3, 2, 3 with 4 frames → <b>9 page faults</b> using FIFO (see the solved numerical).</p>\n<h4>Advantages</h4>\n<ul><li>Easy to understand and implement; low overhead.</li></ul>\n<h4>Disadvantages</h4>\n<ul><li>Performance is not always good: the oldest page may be a heavily used page (e.g. a variable initialised early and used all the time).</li><li>Suffers from <b>Belady's anomaly</b>.</li></ul>\n<h4>Belady's anomaly</h4>\n<p>Normally, giving more frames should reduce page faults. <b>Belady's anomaly</b> is the unexpected situation in which the <b>page-fault rate increases when the number of frames increases</b>. It occurs with FIFO.</p>\n<p>Example: reference string 1, 2, 3, 4, 1, 2, 5, 1, 2, 3, 4, 5 → FIFO gives <b>9 faults with 3 frames</b> but <b>10 faults with 4 frames</b>.</p>\n<p>LRU and Optimal are <b>stack algorithms</b> (the set of pages with n frames is always a subset of the set with n + 1 frames), so they never suffer from Belady's anomaly.</p>", "gu": "<p><b>FIFO (First In First Out)</b> એ સૌથી સરળ page-replacement algorithm છે. Page બદલવું પડે ત્યારે <b>સૌથી જૂનું page</b> (memory માં પહેલું આવેલું) victim તરીકે પસંદ થાય છે.</p>\n<h4>કાર્યપદ્ધતિ</h4>\n<ul>\n<li>OS memory માંના બધા pages ની <b>FIFO queue</b> રાખે છે.</li>\n<li>નવું page tail પર ઉમેરાય; <b>head</b> પરનું page બદલાય.</li>\n<li>Reference થયેલું page memory માં પહેલેથી હોય → <b>hit</b> (queue બદલાતી નથી).</li>\n</ul>\n<h4>ઉદાહરણ (Practical 4)</h4>\n<p>Reference string 1, 2, 3, 4, 5, 1, 3, 1, 6, 3, 2, 3 અને 4 frames → FIFO વડે <b>9 page faults</b> (ઉકેલેલું numerical જુઓ).</p>\n<h4>ફાયદા</h4>\n<ul><li>સમજવા અને અમલ કરવા સરળ; overhead ઓછો.</li></ul>\n<h4>ગેરફાયદા</h4>\n<ul><li>Performance હંમેશા સારું નથી: સૌથી જૂનું page ખૂબ વપરાતું page હોઈ શકે (દા.ત. શરૂઆતમાં initialise થયેલો અને સતત વપરાતો variable).</li><li><b>Belady's anomaly</b> થાય છે.</li></ul>\n<h4>Belady's anomaly</h4>\n<p>સામાન્ય રીતે વધુ frames આપવાથી page faults ઘટવા જોઈએ. <b>Belady's anomaly</b> એ અણધારી સ્થિતિ છે જેમાં <b>frames ની સંખ્યા વધારતાં page-fault rate વધે</b>. તે FIFO માં થાય છે.</p>\n<p>ઉદાહરણ: reference string 1, 2, 3, 4, 1, 2, 5, 1, 2, 3, 4, 5 → FIFO <b>3 frames સાથે 9 faults</b> પણ <b>4 frames સાથે 10 faults</b> આપે.</p>\n<p>LRU અને Optimal <b>stack algorithms</b> છે (n frames સાથેના pages નો set હંમેશા n + 1 frames સાથેના set નો subset હોય), તેથી તેમાં Belady's anomaly ક્યારેય થતી નથી.</p>"}, "diagram": "os3_fifo", "examples": ["os3n10", "os3n12", "os3n14"]}, {"h": {"en": "3.4.3 LRU (Least Recently Used) Page Replacement", "gu": "3.4.3 LRU (Least Recently Used) Page Replacement"}, "body": {"en": "<p><b>LRU</b> replaces the page that has <b>not been used for the longest period of time</b>. It uses the recent past as an approximation of the near future (principle of <b>locality</b>): a page not used for a long time is unlikely to be used soon.</p>\n<h4>Working</h4>\n<ul>\n<li>Each page is associated with the time of its <b>last use</b>.</li>\n<li>On a fault with no free frame, the page with the <b>oldest last-use time</b> is replaced.</li>\n<li>On a hit, the page becomes the <b>most recently used</b> (its time is updated) – this is the key difference from FIFO.</li>\n</ul>\n<h4>Implementation</h4>\n<ul>\n<li><b>Counters:</b> a logical clock is copied into the page-table entry on every reference; replace the page with the smallest time value.</li>\n<li><b>Stack:</b> keep a stack of page numbers; a referenced page is moved to the top; the LRU page is always at the bottom.</li>\n<li>Both need hardware support; approximations such as the <b>reference bit</b> / <b>second-chance (clock)</b> algorithm are used in practice.</li>\n</ul>\n<h4>Example (Practical 4)</h4>\n<p>Reference string 1, 2, 3, 4, 5, 1, 3, 1, 6, 3, 2, 3 with 4 frames → <b>8 page faults</b> using LRU (FIFO gave 9). For the classic string 7, 0, 1, 2, 0, 3, 0, 4, 2, 3, 0, 3, 2, 1, 2, 0, 1, 7, 0, 1 with 3 frames: LRU = 12, FIFO = 15.</p>\n<h4>Advantages / disadvantages</h4>\n<ul><li><b>+</b> Good performance, close to optimal; no Belady's anomaly.</li><li><b>−</b> Costly to implement: needs a timestamp or stack update on every memory reference.</li></ul>\n<h4>Optimal (OPT) – for comparison</h4>\n<p>Replace the page that <b>will not be used for the longest time in the future</b>. It gives the lowest possible fault rate but needs future knowledge, so it is used only as a benchmark (classic string: 9 faults).</p>", "gu": "<p><b>LRU</b> એવું page બદલે છે જે <b>સૌથી લાંબા સમયથી વપરાયું નથી</b>. તે નજીકના ભવિષ્યના અંદાજ તરીકે તાજેતરના ભૂતકાળનો ઉપયોગ કરે છે (<b>locality</b> નો સિદ્ધાંત): લાંબા સમયથી ન વપરાયેલું page જલ્દી વપરાય તેવી શક્યતા ઓછી છે.</p>\n<h4>કાર્યપદ્ધતિ</h4>\n<ul>\n<li>દરેક page સાથે તેના <b>છેલ્લા ઉપયોગનો સમય</b> જોડાય.</li>\n<li>Free frame વગર fault થાય ત્યારે <b>સૌથી જૂના last-use time</b> વાળું page બદલાય.</li>\n<li>Hit પર page <b>most recently used</b> બને (તેનો time update થાય) – FIFO થી આ મુખ્ય તફાવત છે.</li>\n</ul>\n<h4>અમલ</h4>\n<ul>\n<li><b>Counters:</b> દરેક reference પર logical clock ને page-table entry માં copy કરાય; સૌથી નાની time value વાળું page બદલાય.</li>\n<li><b>Stack:</b> page numbers નો stack રાખો; reference થયેલું page top પર ખસે; LRU page હંમેશા bottom પર.</li>\n<li>બંનેને hardware support જોઈએ; વ્યવહારમાં <b>reference bit</b> / <b>second-chance (clock)</b> algorithm જેવા અંદાજો વપરાય.</li>\n</ul>\n<h4>ઉદાહરણ (Practical 4)</h4>\n<p>Reference string 1, 2, 3, 4, 5, 1, 3, 1, 6, 3, 2, 3 અને 4 frames → LRU વડે <b>8 page faults</b> (FIFO એ 9 આપ્યા). Classic string 7, 0, 1, 2, 0, 3, 0, 4, 2, 3, 0, 3, 2, 1, 2, 0, 1, 7, 0, 1 અને 3 frames માટે: LRU = 12, FIFO = 15.</p>\n<h4>ફાયદા / ગેરફાયદા</h4>\n<ul><li><b>+</b> સારું performance, optimal ની નજીક; Belady's anomaly નહીં.</li><li><b>−</b> અમલ મોંઘો: દરેક memory reference પર timestamp કે stack update જોઈએ.</li></ul>\n<h4>Optimal (OPT) – સરખામણી માટે</h4>\n<p>એવું page બદલો જે <b>ભવિષ્યમાં સૌથી લાંબા સમય સુધી વપરાશે નહીં</b>. તે શક્ય તેટલો ઓછો fault rate આપે પણ ભવિષ્યની જાણકારી જોઈએ, તેથી માત્ર benchmark તરીકે વપરાય (classic string: 9 faults).</p>"}, "diagram": "os3_lru", "examples": ["os3n11", "os3n13"]}, {"h": {"en": "3.4.4 Comparison of FIFO, LRU and Optimal", "gu": "3.4.4 FIFO, LRU અને Optimal ની સરખામણી"}, "body": {"en": "<p>The three algorithms differ only in how they choose the victim page when memory is full.</p>\n<table><tr><th>Point</th><th>FIFO</th><th>LRU</th><th>Optimal (OPT)</th></tr><tr><td>Victim page</td><td>Oldest loaded page</td><td>Page not used for the longest past time</td><td>Page not used for the longest future time</td></tr><tr><td>Needs</td><td>Queue of load order</td><td>Time of last use (counter / stack)</td><td>Future reference string</td></tr><tr><td>Implementation</td><td>Simplest</td><td>Harder; needs hardware help</td><td>Not possible (only for comparison)</td></tr><tr><td>Belady's anomaly</td><td>Yes, can occur</td><td>No (stack algorithm)</td><td>No</td></tr><tr><td>Faults (classic string, 3 frames)</td><td>15</td><td>12</td><td>9</td></tr></table>\n<h4>How to solve a page-replacement numerical (exam method)</h4>\n<ol>\n<li>Draw a table: one column per reference, one row per frame.</li>\n<li>For each reference: if the page is in a frame → hit (write H or leave blank); otherwise → fault (F).</li>\n<li>If a frame is free, load the page there; else choose the victim by the algorithm rule (FIFO: oldest loaded; LRU: least recently used; OPT: used farthest in future).</li>\n<li>Count the faults. <b>Page-fault rate</b> = faults ÷ references; <b>hit ratio</b> = hits ÷ references.</li>\n</ol>\n<p>Practical 4 (12 references, 4 frames): FIFO 9 faults (75%), LRU 8 faults (66.7%), OPT 6 faults (50%).</p>", "gu": "<p>ત્રણેય algorithms માત્ર memory ભરાઈ જાય ત્યારે victim page કેવી રીતે પસંદ કરે છે તેમાં જ જુદા પડે છે.</p>\n<table><tr><th>મુદ્દો</th><th>FIFO</th><th>LRU</th><th>Optimal (OPT)</th></tr><tr><td>Victim page</td><td>સૌથી જૂનું load થયેલું page</td><td>ભૂતકાળમાં સૌથી લાંબા સમયથી ન વપરાયેલું page</td><td>ભવિષ્યમાં સૌથી લાંબા સમય સુધી ન વપરાનાર page</td></tr><tr><td>જરૂર</td><td>Load ક્રમની queue</td><td>છેલ્લા ઉપયોગનો સમય (counter / stack)</td><td>ભવિષ્યની reference string</td></tr><tr><td>અમલ</td><td>સૌથી સરળ</td><td>અઘરો; hardware મદદ જોઈએ</td><td>શક્ય નથી (માત્ર સરખામણી માટે)</td></tr><tr><td>Belady's anomaly</td><td>હા, થઈ શકે</td><td>ના (stack algorithm)</td><td>ના</td></tr><tr><td>Faults (classic string, 3 frames)</td><td>15</td><td>12</td><td>9</td></tr></table>\n<h4>Page-replacement numerical કેવી રીતે ઉકેલવું (exam પદ્ધતિ)</h4>\n<ol>\n<li>Table દોરો: દરેક reference માટે એક column, દરેક frame માટે એક row.</li>\n<li>દરેક reference માટે: page કોઈ frame માં હોય → hit (H લખો કે ખાલી છોડો); નહીં તો → fault (F).</li>\n<li>Frame free હોય તો page ત્યાં load કરો; નહીં તો algorithm ના નિયમ મુજબ victim પસંદ કરો (FIFO: સૌથી જૂનું load; LRU: least recently used; OPT: ભવિષ્યમાં સૌથી દૂર વપરાનાર).</li>\n<li>Faults ગણો. <b>Page-fault rate</b> = faults ÷ references; <b>hit ratio</b> = hits ÷ references.</li>\n</ol>\n<p>Practical 4 (12 references, 4 frames): FIFO 9 faults (75%), LRU 8 faults (66.7%), OPT 6 faults (50%).</p>"}}]}], "numericals": [{"id": "os3n1", "q": {"en": "(Practical 3) First fit: Jobs J1 = 20 KB, J2 = 200 KB, J3 = 500 KB, J4 = 50 KB, J5 = 150 KB arrive in this order. Memory partitions are 50, 300, 75, 700 and 100 KB. Allocate the jobs using first fit (fixed partitions) and find the internal fragmentation.", "gu": "(Practical 3) First fit: Jobs J1 = 20 KB, J2 = 200 KB, J3 = 500 KB, J4 = 50 KB, J5 = 150 KB આ ક્રમમાં આવે છે. Memory partitions 50, 300, 75, 700 અને 100 KB છે. First fit (fixed partitions) વડે jobs ફાળવો અને internal fragmentation શોધો."}, "a": {"en": "<p><b>Rule:</b> Allocate the <b>first</b> partition (from the beginning) that is big enough. One job per partition (fixed partitions).</p><table><tr><th>Job</th><th>Size (KB)</th><th>Partition</th><th>Internal frag. (KB)</th></tr><tr><td>J1</td><td>20</td><td>50 KB (#1)</td><td>50 − 20 = 30</td></tr><tr><td>J2</td><td>200</td><td>300 KB (#2)</td><td>300 − 200 = 100</td></tr><tr><td>J3</td><td>500</td><td>700 KB (#4)</td><td>700 − 500 = 200</td></tr><tr><td>J4</td><td>50</td><td>75 KB (#3)</td><td>75 − 50 = 25</td></tr><tr><td>J5</td><td>150</td><td>waits (no partition)</td><td>–</td></tr></table><p><b>Total internal fragmentation = 355 KB</b></p><p>Partitions left free: 100 KB. Jobs that must wait: <b>J5</b>.</p>", "gu": "<p><b>નિયમ:</b> પૂરતું મોટું હોય તેવું <b>પહેલું</b> partition (શરૂઆતથી) ફાળવો. દરેક partition માં એક જ job (fixed partitions).</p><table><tr><th>Job</th><th>Size (KB)</th><th>Partition</th><th>Internal frag. (KB)</th></tr><tr><td>J1</td><td>20</td><td>50 KB (#1)</td><td>50 − 20 = 30</td></tr><tr><td>J2</td><td>200</td><td>300 KB (#2)</td><td>300 − 200 = 100</td></tr><tr><td>J3</td><td>500</td><td>700 KB (#4)</td><td>700 − 500 = 200</td></tr><tr><td>J4</td><td>50</td><td>75 KB (#3)</td><td>75 − 50 = 25</td></tr><tr><td>J5</td><td>150</td><td>રાહ જુએ (કોઈ partition નહીં)</td><td>–</td></tr></table><p><b>કુલ internal fragmentation = 355 KB</b></p><p>મુક્ત રહેલા partitions: 100 KB. રાહ જોતા jobs: <b>J5</b>.</p>"}}, {"id": "os3n2", "q": {"en": "(Practical 3) Best fit: Jobs J1 = 20 KB, J2 = 200 KB, J3 = 500 KB, J4 = 50 KB, J5 = 150 KB arrive in this order. Memory partitions are 50, 300, 75, 700 and 100 KB. Allocate the jobs using best fit (fixed partitions) and find the internal fragmentation.", "gu": "(Practical 3) Best fit: Jobs J1 = 20 KB, J2 = 200 KB, J3 = 500 KB, J4 = 50 KB, J5 = 150 KB આ ક્રમમાં આવે છે. Memory partitions 50, 300, 75, 700 અને 100 KB છે. Best fit (fixed partitions) વડે jobs ફાળવો અને internal fragmentation શોધો."}, "a": {"en": "<p><b>Rule:</b> Allocate the <b>smallest</b> partition that is big enough. One job per partition (fixed partitions).</p><table><tr><th>Job</th><th>Size (KB)</th><th>Partition</th><th>Internal frag. (KB)</th></tr><tr><td>J1</td><td>20</td><td>50 KB (#1)</td><td>50 − 20 = 30</td></tr><tr><td>J2</td><td>200</td><td>300 KB (#2)</td><td>300 − 200 = 100</td></tr><tr><td>J3</td><td>500</td><td>700 KB (#4)</td><td>700 − 500 = 200</td></tr><tr><td>J4</td><td>50</td><td>75 KB (#3)</td><td>75 − 50 = 25</td></tr><tr><td>J5</td><td>150</td><td>waits (no partition)</td><td>–</td></tr></table><p><b>Total internal fragmentation = 355 KB</b></p><p>Partitions left free: 100 KB. Jobs that must wait: <b>J5</b>.</p>", "gu": "<p><b>નિયમ:</b> પૂરતું મોટું હોય તેવું <b>સૌથી નાનું</b> partition ફાળવો. દરેક partition માં એક જ job (fixed partitions).</p><table><tr><th>Job</th><th>Size (KB)</th><th>Partition</th><th>Internal frag. (KB)</th></tr><tr><td>J1</td><td>20</td><td>50 KB (#1)</td><td>50 − 20 = 30</td></tr><tr><td>J2</td><td>200</td><td>300 KB (#2)</td><td>300 − 200 = 100</td></tr><tr><td>J3</td><td>500</td><td>700 KB (#4)</td><td>700 − 500 = 200</td></tr><tr><td>J4</td><td>50</td><td>75 KB (#3)</td><td>75 − 50 = 25</td></tr><tr><td>J5</td><td>150</td><td>રાહ જુએ (કોઈ partition નહીં)</td><td>–</td></tr></table><p><b>કુલ internal fragmentation = 355 KB</b></p><p>મુક્ત રહેલા partitions: 100 KB. રાહ જોતા jobs: <b>J5</b>.</p>"}}, {"id": "os3n3", "q": {"en": "(Practical 3) Worst fit: Jobs J1 = 20 KB, J2 = 200 KB, J3 = 500 KB, J4 = 50 KB, J5 = 150 KB arrive in this order. Memory partitions are 50, 300, 75, 700 and 100 KB. Allocate the jobs using worst fit (fixed partitions) and find the internal fragmentation.", "gu": "(Practical 3) Worst fit: Jobs J1 = 20 KB, J2 = 200 KB, J3 = 500 KB, J4 = 50 KB, J5 = 150 KB આ ક્રમમાં આવે છે. Memory partitions 50, 300, 75, 700 અને 100 KB છે. Worst fit (fixed partitions) વડે jobs ફાળવો અને internal fragmentation શોધો."}, "a": {"en": "<p><b>Rule:</b> Allocate the <b>largest</b> available partition. One job per partition (fixed partitions).</p><table><tr><th>Job</th><th>Size (KB)</th><th>Partition</th><th>Internal frag. (KB)</th></tr><tr><td>J1</td><td>20</td><td>700 KB (#4)</td><td>700 − 20 = 680</td></tr><tr><td>J2</td><td>200</td><td>300 KB (#2)</td><td>300 − 200 = 100</td></tr><tr><td>J3</td><td>500</td><td>waits (no partition)</td><td>–</td></tr><tr><td>J4</td><td>50</td><td>100 KB (#5)</td><td>100 − 50 = 50</td></tr><tr><td>J5</td><td>150</td><td>waits (no partition)</td><td>–</td></tr></table><p><b>Total internal fragmentation = 830 KB</b></p><p>Partitions left free: 50 KB, 75 KB. Jobs that must wait: <b>J3, J5</b>.</p>", "gu": "<p><b>નિયમ:</b> ઉપલબ્ધ <b>સૌથી મોટું</b> partition ફાળવો. દરેક partition માં એક જ job (fixed partitions).</p><table><tr><th>Job</th><th>Size (KB)</th><th>Partition</th><th>Internal frag. (KB)</th></tr><tr><td>J1</td><td>20</td><td>700 KB (#4)</td><td>700 − 20 = 680</td></tr><tr><td>J2</td><td>200</td><td>300 KB (#2)</td><td>300 − 200 = 100</td></tr><tr><td>J3</td><td>500</td><td>રાહ જુએ (કોઈ partition નહીં)</td><td>–</td></tr><tr><td>J4</td><td>50</td><td>100 KB (#5)</td><td>100 − 50 = 50</td></tr><tr><td>J5</td><td>150</td><td>રાહ જુએ (કોઈ partition નહીં)</td><td>–</td></tr></table><p><b>કુલ internal fragmentation = 830 KB</b></p><p>મુક્ત રહેલા partitions: 50 KB, 75 KB. રાહ જોતા jobs: <b>J3, J5</b>.</p>"}}, {"id": "os3n4", "q": {"en": "(Practical 3, variable partitions) Treat the partitions 50, 300, 75, 700, 100 KB as free holes: a job uses part of a hole and the rest remains free. Allocate J1 = 20, J2 = 200, J3 = 500, J4 = 50, J5 = 150 KB using first, best and worst fit.", "gu": "(Practical 3, variable partitions) Partitions 50, 300, 75, 700, 100 KB ને free holes ગણો: job hole નો ભાગ વાપરે અને બાકીનો મુક્ત રહે. J1 = 20, J2 = 200, J3 = 500, J4 = 50, J5 = 150 KB ને first, best અને worst fit વડે ફાળવો."}, "a": {"en": "<p><b>First fit</b></p><table><tr><th>Job</th><th>Size</th><th>Hole used</th><th>Hole left (KB)</th></tr><tr><td>J1</td><td>20</td><td>hole #1 (50 KB)</td><td>50 − 20 = 30</td></tr><tr><td>J2</td><td>200</td><td>hole #2 (300 KB)</td><td>300 − 200 = 100</td></tr><tr><td>J3</td><td>500</td><td>hole #4 (700 KB)</td><td>700 − 500 = 200</td></tr><tr><td>J4</td><td>50</td><td>hole #2 (100 KB)</td><td>100 − 50 = 50</td></tr><tr><td>J5</td><td>150</td><td>hole #4 (200 KB)</td><td>200 − 150 = 50</td></tr></table><p>Free holes at the end: 30, 50, 75, 50, 100 KB</p><p><b>Best fit</b></p><table><tr><th>Job</th><th>Size</th><th>Hole used</th><th>Hole left (KB)</th></tr><tr><td>J1</td><td>20</td><td>hole #1 (50 KB)</td><td>50 − 20 = 30</td></tr><tr><td>J2</td><td>200</td><td>hole #2 (300 KB)</td><td>300 − 200 = 100</td></tr><tr><td>J3</td><td>500</td><td>hole #4 (700 KB)</td><td>700 − 500 = 200</td></tr><tr><td>J4</td><td>50</td><td>hole #3 (75 KB)</td><td>75 − 50 = 25</td></tr><tr><td>J5</td><td>150</td><td>hole #4 (200 KB)</td><td>200 − 150 = 50</td></tr></table><p>Free holes at the end: 30, 100, 25, 50, 100 KB</p><p><b>Worst fit</b></p><table><tr><th>Job</th><th>Size</th><th>Hole used</th><th>Hole left (KB)</th></tr><tr><td>J1</td><td>20</td><td>hole #4 (700 KB)</td><td>700 − 20 = 680</td></tr><tr><td>J2</td><td>200</td><td>hole #4 (680 KB)</td><td>680 − 200 = 480</td></tr><tr><td>J3</td><td>500</td><td>waits</td><td>–</td></tr><tr><td>J4</td><td>50</td><td>hole #4 (480 KB)</td><td>480 − 50 = 430</td></tr><tr><td>J5</td><td>150</td><td>hole #4 (430 KB)</td><td>430 − 150 = 280</td></tr></table><p>Free holes at the end: 50, 300, 75, 280, 100 KB</p><p><b>Result:</b> first and best fit place all five jobs; worst fit fills the 700 KB hole first, so J3 (500 KB) cannot be placed and must wait.</p>", "gu": "<p><b>First fit</b></p><table><tr><th>Job</th><th>Size</th><th>Hole used</th><th>Hole left (KB)</th></tr><tr><td>J1</td><td>20</td><td>hole #1 (50 KB)</td><td>50 − 20 = 30</td></tr><tr><td>J2</td><td>200</td><td>hole #2 (300 KB)</td><td>300 − 200 = 100</td></tr><tr><td>J3</td><td>500</td><td>hole #4 (700 KB)</td><td>700 − 500 = 200</td></tr><tr><td>J4</td><td>50</td><td>hole #2 (100 KB)</td><td>100 − 50 = 50</td></tr><tr><td>J5</td><td>150</td><td>hole #4 (200 KB)</td><td>200 − 150 = 50</td></tr></table><p>અંતે free holes: 30, 50, 75, 50, 100 KB</p><p><b>Best fit</b></p><table><tr><th>Job</th><th>Size</th><th>Hole used</th><th>Hole left (KB)</th></tr><tr><td>J1</td><td>20</td><td>hole #1 (50 KB)</td><td>50 − 20 = 30</td></tr><tr><td>J2</td><td>200</td><td>hole #2 (300 KB)</td><td>300 − 200 = 100</td></tr><tr><td>J3</td><td>500</td><td>hole #4 (700 KB)</td><td>700 − 500 = 200</td></tr><tr><td>J4</td><td>50</td><td>hole #3 (75 KB)</td><td>75 − 50 = 25</td></tr><tr><td>J5</td><td>150</td><td>hole #4 (200 KB)</td><td>200 − 150 = 50</td></tr></table><p>અંતે free holes: 30, 100, 25, 50, 100 KB</p><p><b>Worst fit</b></p><table><tr><th>Job</th><th>Size</th><th>Hole used</th><th>Hole left (KB)</th></tr><tr><td>J1</td><td>20</td><td>hole #4 (700 KB)</td><td>700 − 20 = 680</td></tr><tr><td>J2</td><td>200</td><td>hole #4 (680 KB)</td><td>680 − 200 = 480</td></tr><tr><td>J3</td><td>500</td><td>રાહ જુએ</td><td>–</td></tr><tr><td>J4</td><td>50</td><td>hole #4 (480 KB)</td><td>480 − 50 = 430</td></tr><tr><td>J5</td><td>150</td><td>hole #4 (430 KB)</td><td>430 − 150 = 280</td></tr></table><p>અંતે free holes: 50, 300, 75, 280, 100 KB</p><p><b>પરિણામ:</b> first અને best fit પાંચેય jobs મૂકે છે; worst fit પહેલાં 700 KB hole ભરે છે, તેથી J3 (500 KB) મૂકી શકાતો નથી અને રાહ જુએ છે.</p>"}}, {"id": "os3n5", "q": {"en": "Given memory holes of 100, 500, 200, 300 and 600 KB (in order), how would first fit, best fit and worst fit place processes of 212, 417, 112 and 426 KB (in order)? Which algorithm uses memory most efficiently?", "gu": "Memory holes 100, 500, 200, 300 અને 600 KB (ક્રમમાં) હોય, તો first fit, best fit અને worst fit 212, 417, 112 અને 426 KB (ક્રમમાં) ની processes કેવી રીતે મૂકશે? કયો algorithm memory નો સૌથી કાર્યક્ષમ ઉપયોગ કરે છે?"}, "a": {"en": "<p><b>First fit</b></p><table><tr><th>Job</th><th>Size</th><th>Hole used</th><th>Hole left (KB)</th></tr><tr><td>P1</td><td>212</td><td>hole #2 (500 KB)</td><td>500 − 212 = 288</td></tr><tr><td>P2</td><td>417</td><td>hole #5 (600 KB)</td><td>600 − 417 = 183</td></tr><tr><td>P3</td><td>112</td><td>hole #2 (288 KB)</td><td>288 − 112 = 176</td></tr><tr><td>P4</td><td>426</td><td>waits</td><td>–</td></tr></table><p><b>Best fit</b></p><table><tr><th>Job</th><th>Size</th><th>Hole used</th><th>Hole left (KB)</th></tr><tr><td>P1</td><td>212</td><td>hole #4 (300 KB)</td><td>300 − 212 = 88</td></tr><tr><td>P2</td><td>417</td><td>hole #2 (500 KB)</td><td>500 − 417 = 83</td></tr><tr><td>P3</td><td>112</td><td>hole #3 (200 KB)</td><td>200 − 112 = 88</td></tr><tr><td>P4</td><td>426</td><td>hole #5 (600 KB)</td><td>600 − 426 = 174</td></tr></table><p><b>Worst fit</b></p><table><tr><th>Job</th><th>Size</th><th>Hole used</th><th>Hole left (KB)</th></tr><tr><td>P1</td><td>212</td><td>hole #5 (600 KB)</td><td>600 − 212 = 388</td></tr><tr><td>P2</td><td>417</td><td>hole #2 (500 KB)</td><td>500 − 417 = 83</td></tr><tr><td>P3</td><td>112</td><td>hole #5 (388 KB)</td><td>388 − 112 = 276</td></tr><tr><td>P4</td><td>426</td><td>waits</td><td>–</td></tr></table><p><b>Best fit</b> is the most efficient here: it is the only one that places all four processes (426 KB must wait in first and worst fit).</p>", "gu": "<p><b>First fit</b></p><table><tr><th>Job</th><th>Size</th><th>Hole used</th><th>Hole left (KB)</th></tr><tr><td>P1</td><td>212</td><td>hole #2 (500 KB)</td><td>500 − 212 = 288</td></tr><tr><td>P2</td><td>417</td><td>hole #5 (600 KB)</td><td>600 − 417 = 183</td></tr><tr><td>P3</td><td>112</td><td>hole #2 (288 KB)</td><td>288 − 112 = 176</td></tr><tr><td>P4</td><td>426</td><td>રાહ જુએ</td><td>–</td></tr></table><p><b>Best fit</b></p><table><tr><th>Job</th><th>Size</th><th>Hole used</th><th>Hole left (KB)</th></tr><tr><td>P1</td><td>212</td><td>hole #4 (300 KB)</td><td>300 − 212 = 88</td></tr><tr><td>P2</td><td>417</td><td>hole #2 (500 KB)</td><td>500 − 417 = 83</td></tr><tr><td>P3</td><td>112</td><td>hole #3 (200 KB)</td><td>200 − 112 = 88</td></tr><tr><td>P4</td><td>426</td><td>hole #5 (600 KB)</td><td>600 − 426 = 174</td></tr></table><p><b>Worst fit</b></p><table><tr><th>Job</th><th>Size</th><th>Hole used</th><th>Hole left (KB)</th></tr><tr><td>P1</td><td>212</td><td>hole #5 (600 KB)</td><td>600 − 212 = 388</td></tr><tr><td>P2</td><td>417</td><td>hole #2 (500 KB)</td><td>500 − 417 = 83</td></tr><tr><td>P3</td><td>112</td><td>hole #5 (388 KB)</td><td>388 − 112 = 276</td></tr><tr><td>P4</td><td>426</td><td>રાહ જુએ</td><td>–</td></tr></table><p>અહીં <b>best fit</b> સૌથી કાર્યક્ષમ છે: તે એકમાત્ર ચારેય processes મૂકે છે (first અને worst fit માં 426 KB એ રાહ જોવી પડે).</p>"}}, {"id": "os3n6", "q": {"en": "A system uses paging with page size 1 KB (1024 bytes). The page table of a process is: page 0 → frame 5, page 1 → frame 2, page 2 → frame 7, page 3 → frame 9. Find the physical addresses for logical addresses (i) 2500 (ii) 1200 (iii) 5000.", "gu": "System page size 1 KB (1024 bytes) સાથે paging વાપરે છે. Process નું page table: page 0 → frame 5, page 1 → frame 2, page 2 → frame 7, page 3 → frame 9. Logical addresses (i) 2500 (ii) 1200 (iii) 5000 માટે physical addresses શોધો."}, "a": {"en": "<p>p = LA ÷ 1024 (integer part), d = LA mod 1024, PA = f × 1024 + d</p><p><b>(i)</b> 2500 ÷ 1024 → p = 2, d = 2500 − 2048 = 452; f = 7 → PA = 7 × 1024 + 452 = 7168 + 452 = <b>7620</b></p><p><b>(ii)</b> 1200 ÷ 1024 → p = 1, d = 176; f = 2 → PA = 2 × 1024 + 176 = <b>2224</b></p><p><b>(iii)</b> 5000 ÷ 1024 → p = 4, d = 904. The process has only pages 0–3, so page 4 is <b>invalid → trap (addressing error)</b>.</p>", "gu": "<p>p = LA ÷ 1024 (પૂર્ણાંક ભાગ), d = LA mod 1024, PA = f × 1024 + d</p><p><b>(i)</b> 2500 ÷ 1024 → p = 2, d = 2500 − 2048 = 452; f = 7 → PA = 7 × 1024 + 452 = 7168 + 452 = <b>7620</b></p><p><b>(ii)</b> 1200 ÷ 1024 → p = 1, d = 176; f = 2 → PA = 2 × 1024 + 176 = <b>2224</b></p><p><b>(iii)</b> 5000 ÷ 1024 → p = 4, d = 904. Process પાસે માત્ર pages 0–3 છે, તેથી page 4 <b>invalid → trap (addressing error)</b>.</p>"}}, {"id": "os3n7", "q": {"en": "Page size = 4 bytes, physical memory = 32 bytes (8 frames). Page table: 0 → 5, 1 → 6, 2 → 1, 3 → 2. Find the physical address of logical addresses 0, 3, 4 and 13.", "gu": "Page size = 4 bytes, physical memory = 32 bytes (8 frames). Page table: 0 → 5, 1 → 6, 2 → 1, 3 → 2. Logical addresses 0, 3, 4 અને 13 ના physical address શોધો."}, "a": {"en": "<table><tr><th>Logical address</th><th>p = LA ÷ 4</th><th>d = LA mod 4</th><th>f</th><th>PA = f × 4 + d</th></tr><tr><td>0</td><td>0</td><td>0</td><td>5</td><td>5 × 4 + 0 = 20</td></tr><tr><td>3</td><td>0</td><td>3</td><td>5</td><td>5 × 4 + 3 = 23</td></tr><tr><td>4</td><td>1</td><td>0</td><td>6</td><td>6 × 4 + 0 = 24</td></tr><tr><td>13</td><td>3</td><td>1</td><td>2</td><td>2 × 4 + 1 = 9</td></tr></table><p>E.g. logical address 13 is in page 3 at offset 1; page 3 is in frame 2, so PA = 2 × 4 + 1 = <b>9</b>.</p>", "gu": "<table><tr><th>Logical address</th><th>p = LA ÷ 4</th><th>d = LA mod 4</th><th>f</th><th>PA = f × 4 + d</th></tr><tr><td>0</td><td>0</td><td>0</td><td>5</td><td>5 × 4 + 0 = 20</td></tr><tr><td>3</td><td>0</td><td>3</td><td>5</td><td>5 × 4 + 3 = 23</td></tr><tr><td>4</td><td>1</td><td>0</td><td>6</td><td>6 × 4 + 0 = 24</td></tr><tr><td>13</td><td>3</td><td>1</td><td>2</td><td>2 × 4 + 1 = 9</td></tr></table><p>દા.ત. logical address 13 page 3 માં offset 1 પર છે; page 3 frame 2 માં છે, તેથી PA = 2 × 4 + 1 = <b>9</b>.</p>"}}, {"id": "os3n8", "q": {"en": "A logical address space has 8 pages of 1024 words each, mapped onto a physical memory of 32 frames. How many bits are there in (i) the logical address (ii) the physical address?", "gu": "Logical address space માં 1024 words ના 8 pages છે, જે 32 frames ની physical memory પર map થાય છે. (i) logical address (ii) physical address માં કેટલા bits છે?"}, "a": {"en": "<p>Offset: page size 1024 = 2<sup>10</sup> → <b>10 bits</b> for d.</p><p><b>(i)</b> 8 pages = 2<sup>3</sup> → 3 bits for p. Logical address = 3 + 10 = <b>13 bits</b> (8 × 1024 = 8192 = 2<sup>13</sup>).</p><p><b>(ii)</b> 32 frames = 2<sup>5</sup> → 5 bits for f. Physical address = 5 + 10 = <b>15 bits</b> (32 × 1024 = 32768 = 2<sup>15</sup>).</p>", "gu": "<p>Offset: page size 1024 = 2<sup>10</sup> → d માટે <b>10 bits</b>.</p><p><b>(i)</b> 8 pages = 2<sup>3</sup> → p માટે 3 bits. Logical address = 3 + 10 = <b>13 bits</b> (8 × 1024 = 8192 = 2<sup>13</sup>).</p><p><b>(ii)</b> 32 frames = 2<sup>5</sup> → f માટે 5 bits. Physical address = 5 + 10 = <b>15 bits</b> (32 × 1024 = 32768 = 2<sup>15</sup>).</p>"}}, {"id": "os3n9", "q": {"en": "Consider the segment table: segment 0 (base 219, length 600), 1 (2300, 14), 2 (90, 100), 3 (1327, 580), 4 (1952, 96). What are the physical addresses for the logical addresses (0, 430), (1, 10), (2, 500), (3, 400) and (4, 112)?", "gu": "Segment table: segment 0 (base 219, length 600), 1 (2300, 14), 2 (90, 100), 3 (1327, 580), 4 (1952, 96). Logical addresses (0, 430), (1, 10), (2, 500), (3, 400) અને (4, 112) ના physical addresses શું છે?"}, "a": {"en": "<table><tr><th>Segment</th><th>Base</th><th>Length (limit)</th></tr><tr><td>0</td><td>219</td><td>600</td></tr><tr><td>1</td><td>2300</td><td>14</td></tr><tr><td>2</td><td>90</td><td>100</td></tr><tr><td>3</td><td>1327</td><td>580</td></tr><tr><td>4</td><td>1952</td><td>96</td></tr></table><p>Rule: if d &lt; limit, PA = base + d; otherwise trap to the OS.</p><table><tr><th>(s, d)</th><th>d &lt; limit?</th><th>Physical address</th></tr><tr><td>(0, 430)</td><td>430 &lt; 600 ✓</td><td>219 + 430 = <b>649</b></td></tr><tr><td>(1, 10)</td><td>10 &lt; 14 ✓</td><td>2300 + 10 = <b>2310</b></td></tr><tr><td>(2, 500)</td><td>500 ≥ 100 ✗</td><td><b>trap</b> (illegal)</td></tr><tr><td>(3, 400)</td><td>400 &lt; 580 ✓</td><td>1327 + 400 = <b>1727</b></td></tr><tr><td>(4, 112)</td><td>112 ≥ 96 ✗</td><td><b>trap</b> (illegal)</td></tr></table>", "gu": "<table><tr><th>Segment</th><th>Base</th><th>Length (limit)</th></tr><tr><td>0</td><td>219</td><td>600</td></tr><tr><td>1</td><td>2300</td><td>14</td></tr><tr><td>2</td><td>90</td><td>100</td></tr><tr><td>3</td><td>1327</td><td>580</td></tr><tr><td>4</td><td>1952</td><td>96</td></tr></table><p>નિયમ: d &lt; limit હોય તો PA = base + d; નહીં તો OS ને trap.</p><table><tr><th>(s, d)</th><th>d &lt; limit?</th><th>Physical address</th></tr><tr><td>(0, 430)</td><td>430 &lt; 600 ✓</td><td>219 + 430 = <b>649</b></td></tr><tr><td>(1, 10)</td><td>10 &lt; 14 ✓</td><td>2300 + 10 = <b>2310</b></td></tr><tr><td>(2, 500)</td><td>500 ≥ 100 ✗</td><td><b>trap</b> (અમાન્ય)</td></tr><tr><td>(3, 400)</td><td>400 &lt; 580 ✓</td><td>1327 + 400 = <b>1727</b></td></tr><tr><td>(4, 112)</td><td>112 ≥ 96 ✗</td><td><b>trap</b> (અમાન્ય)</td></tr></table>"}}, {"id": "os3n10", "q": {"en": "(Practical 4) Find the number of page faults using FIFO. Reference string 1, 2, 3, 4, 5, 1, 3, 1, 6, 3, 2, 3 with 4 frames (initially empty).", "gu": "(Practical 4) FIFO વડે page faults શોધો. Reference string 1, 2, 3, 4, 5, 1, 3, 1, 6, 3, 2, 3, 4 frames (શરૂઆતમાં ખાલી)."}, "a": {"en": "<p><b>FIFO:</b> on a fault with all frames full, replace the page that was <b>loaded earliest</b>.</p><table><tr><th>Ref</th><th>F1</th><th>F2</th><th>F3</th><th>F4</th><th>Fault / Hit</th><th>Victim</th></tr><tr><td><b>1</b></td><td><b>1</b></td><td>–</td><td>–</td><td>–</td><td>F</td><td></td></tr><tr><td><b>2</b></td><td>1</td><td><b>2</b></td><td>–</td><td>–</td><td>F</td><td></td></tr><tr><td><b>3</b></td><td>1</td><td>2</td><td><b>3</b></td><td>–</td><td>F</td><td></td></tr><tr><td><b>4</b></td><td>1</td><td>2</td><td>3</td><td><b>4</b></td><td>F</td><td></td></tr><tr><td><b>5</b></td><td><b>5</b></td><td>2</td><td>3</td><td>4</td><td>F</td><td>1</td></tr><tr><td><b>1</b></td><td>5</td><td><b>1</b></td><td>3</td><td>4</td><td>F</td><td>2</td></tr><tr><td><b>3</b></td><td>5</td><td>1</td><td>3</td><td>4</td><td>H</td><td></td></tr><tr><td><b>1</b></td><td>5</td><td>1</td><td>3</td><td>4</td><td>H</td><td></td></tr><tr><td><b>6</b></td><td>5</td><td>1</td><td><b>6</b></td><td>4</td><td>F</td><td>3</td></tr><tr><td><b>3</b></td><td>5</td><td>1</td><td>6</td><td><b>3</b></td><td>F</td><td>4</td></tr><tr><td><b>2</b></td><td><b>2</b></td><td>1</t  સારું છે. (Optimal algorithm 9 આપે.)</p>"}}, {"id": "os3n14", "q": {"en": "Show Belady's anomaly using FIFO for the reference string 1, 2, 3, 4, 1, 2, 5, 1, 2, 3, 4, 5 with 3 frames and with 4 frames.", "gu": "Reference string 1, 2, 3, 4, 1, 2, 5, 1, 2, 3, 4, 5 માટે 3 frames અને 4 frames સાથે FIFO વડે Belady's anomaly બતાવો."}, "a": {"en": "<p><b>3 frames:</b></p><table><tr><th>Ref</th><th>F1</th><th>F2</th><th>F3</th><th>Fault / Hit</th><th>Victim</th></tr><tr><td><b>1</b></td><td><b>1</b></td><td>–</td><td>–</td><td>F</td><td></td></tr><tr><td><b>2</b></td><td>1</td><td><b>2</b></td><td>–</td><td>F</td><td></td></tr><tr><td><b>3</b></td><td>1</td><td>2</td><td><b>3</b></td><td>F</td><td></td></tr><tr><td><b>4</b></td><td><b>4</b></td><td>2</td><td>3</td><td>F</td><td>1</td></tr><tr><td><b>1</b></td><td>4</td><td><b>1</b></td><td>3</td><td>F</td><td>2</td></tr><tr><td><b>2</b></td><td>4</td><td>1</td><td><b>2</b></td><td>F</td><td>3</td></tr><tr><td><b>5</b></td><td><b>5</b></td><td>1</td><td>2</td><td>F</td><td>4</td></tr><tr><td><b>1</b></td><td>5</td><td>1</td><td>2</td><td>H</td><td></td></tr><tr><td><b>2</b></td><td>5</td><td>1</td><td>2</td><td>H</td><td></td></tr><tr><td><b>3</b></td><td>5</td><td><b>3</b></td><td>2</td><td>F</td><td>1</td></tr><tr><td><b>4</b></td><td>5</td><td>3</td><td><b>4</b></td><td>F</td><td>2</td></tr><tr><td><b>5</b></td><td>5</td><td>3</td><td>4</td><td>H</td><td></td></tr></table><p>Page faults = <b>9</b></p><p><b>4 frames:</b></p><table><tr><th>Ref</th><th>F1</th><th>F2</th><th>F3</th><th>F4</th><th>Fault / Hit</th><th>Victim</th></tr><tr><td><b>1</b></td><td><b>1</b></td><td>–</td><td>–</td><td>–</td><td>F</td><td></td></tr><tr><td><b>2</b></td><td>1</td><td><b>2</b></td><td>–</td><td>–</td><td>F</td><td></td></tr><tr><td><b>3</b></td><td>1</td><td>2</td><td><b>3</b></td><td>–</td><td>F</td><td></td></tr><tr><td><b>4</b></td><td>1</td><td>2</td><td>3</td><td><b>4</b></td><td>F</td><td></td></tr><tr><td><b>1</b></td><td>1</td><t
