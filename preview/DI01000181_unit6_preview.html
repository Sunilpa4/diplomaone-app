l cost of a 2.5 kg part that sells for Rs 180.", "gu": "પ્રેસ શોપ વર્ષે 2000 કલાક ચાલે, કલાકે 500 કિલો સ્ટીલ ભાગ. વપરાયેલી શીટના 18 % ભંગાર થાય, તેમાંથી 92 % સાફ grade તરીકે વસૂલાય, અને grade કિલોએ રૂ 32 વેચાય. વાર્ષિક ભંગાર, વસૂલાયેલું દળ, તેની કિંમત, અને રૂ 180 માં વેચાતા 2.5 કિલોના ભાગની સામગ્રી કિંમત પર recovery ની અસર શોધો."}, "marks": 5}], "learning_outcomes": [{"en": "Identify green material as an alternative of existing materials.", "gu": "હાલની સામગ્રીના વિકલ્પ તરીકે green material ઓળખવી."}], "course_outcomes": ["CO6"], "practical_numbers": [7], "content_kind": "theory", "lesson_count": 14, "answered_practice_count": 6, "assessment_note": {"en": "Official course: theory ESE 70 + PA 30 and practical PA 20 + ESE 30 = 150 marks, 4 credits (3 lecture + 2 practical), 45 teaching hours. This last unit carries 15 % weightage, 6 of the printed unit hours and 10 of the 70 theory marks; practical 7, the report on green materials, is assessed there. The embodied energy, carbon and recycling figures are typical published values, not measurements of a particular plant, and the grid emission factor 0.71 kg CO2 per kWh is the Indian figure used throughout. The six numericals of section 6.6 are original revision problems with suggested marks, not GTU papers; the scrap price in problem 6 is an assumption and is stated as one.", "gu": "અધિકૃત course: theory ESE 70 + PA 30 અને practical PA 20 + ESE 30 = 150 marks, 4 credits (3 lecture + 2 practical), 45 teaching hours. આ છેલ્લા unit નું weightage 15 %, છપાયેલા unit hours માંથી 6 અને 70 theory marks માંથી 10 છે; practical 7, green materials નો રિપોર્ટ, ત્યાં મપાય છે. embodied energy, કાર્બન અને recycling ના આંકડા પ્રકાશિત લાક્ષણિક મૂલ્યો છે, કોઈ એક કારખાનાના માપ નહીં, અને grid emission factor 0.71 kg CO2 પ્રતિ kWh એ સ્થળે વપરાયેલો ભારતીય આંકડો છે. વિભાગ 6.6 ના છ દાખલા revision માટેના મૂળ પ્રશ્નો છે, GTU પેપર નહીં; દાખલા 6 માંનો ભંગારનો ભાવ ધારેલો છે અને એ સ્પષ્ટ લખેલું છે."}, "question_provenance": "Original solved numericals written for revision; not official past papers", "question_marks_are_suggested": true, "sources": [{"title": "GTU DI01000181 Engineering Materials Science syllabus (uploaded PDF, w.e.f. 2024-25)", "url": "https://syllabus.gtu.ac.in/"}, {"title": "M. F. Ashby - Materials and the Environment: eco-informed material choice, Butterworth-Heinemann (embodied energy, eco-audit, energy payback)", "url": "https://www.elsevier.com/books/materials-and-the-environment/ashby/978-0-12-385971-6"}, {"title": "V. Raghavan - Materials Science and Engineering, Prentice Hall India (energy materials, semiconductors for photovoltaics)", "url": "https://www.pearson.com/"}, {"title": "O. P. Khanna - Material Science and Metallurgy, Dhanpat Rai (advanced materials, composite materials)", "url": "https://www.dhanpatrai.com/"}, {"title": "Central Electricity Authority - CO2 Baseline Database for the Indian Power Sector (grid emission factor)", "url": "https://cea.nic.in/"}, {"title": "IEA - Global EV Outlook (battery chemistry, pack specific energy, recycling)", "url": "https://www.iea.org/reports/global-ev-outlook-2024"}, {"title": "MNRE - solar photovoltaic grid connected systems, module and balance of system specifications", "url": "https://mnre.gov.in/"}]};

or=\"middle\" fill=\"#666666\" font-weight=\"normal\">the service life</text><path d=\"M176.0 76.0L184.0 76.0\" fill=\"none\" stroke=\"#222222\" stroke-width=\"1.2\" stroke-linecap=\"round\"/><path d=\"M179.0 74.2L184.0 76.0L179.0 77.8Z\" fill=\"#222222\"/><path d=\"M270.0 108.0L270.0 150.0\" fill=\"none\" stroke=\"#222222\" stroke-width=\"1.2\" stroke-linecap=\"round\"/><path d=\"M271.8 145.0L270.0 150.0L268.2 145.0Z\" fill=\"#222222\"/><path d=\"M184.0 180.0L176.0 180.0\" fill=\"none\" stroke=\"#222222\" stroke-width=\"1.2\" stroke-linecap=\"round\"/><path d=\"M181.0 181.8L176.0 180.0L181.0 178.2Z\" fill=\"#222222\"/><path d=\"M64.0 150.0L64.0 108.0\" fill=\"none\" stroke=\"#2E7D32\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><path d=\"M62.2 113.0L64.0 108.0L65.8 113.0Z\" fill=\"#2E7D32\"/><text x=\"74\" y=\"128.2\" font-size=\"6.4\" text-anchor=\"start\" fill=\"#2E7D32\" font-weight=\"bold\">recycle closes the loop</text><path d=\"M64.0 212.0L64.0 234.0\" fill=\"none\" stroke=\"#BD2543\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><path d=\"M65.8 229.0L64.0 234.0L62.2 229.0Z\" fill=\"#BD2543\"/><text x=\"74\" y=\"230.2\" font-size=\"6.4\" text-anchor=\"start\" fill=\"#BD2543\" font-weight=\"normal\">landfill leaves it open</text><rect x=\"6.0\" y=\"242.0\" width=\"348.0\" height=\"72.0\" rx=\"5\" fill=\"#F5EEFD\" stroke=\"#7B2CD9\" stroke-width=\"1\"/><text x=\"180.0\" y=\"256.9\" font-size=\"8.2\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">a green material is green on four counts, and never on one</text><text x=\"180.0\" y=\"270.7\" font-size=\"7.6\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"normal\">renewable: grown again in a human lifetime - wood, cork, jute, bamboo</text><text x=\"180.0\" y=\"282.2\" font-size=\"7.6\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"normal\">recyclable: a second life with a fraction of the first energy - all metals</text><text x=\"180.0\" y=\"293.7\" font-size=\"7.6\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"normal\">low impact: little energy, water or toxicity per kilogram delivered</text><text x=\"180.0\" y=\"305.2\" font-size=\"7.6\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"normal\">durable: the greenest part is the one that does not have to be replaced</text><text x=\"180.0\" y=\"333.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">Ask for the whole life, not the label: a bamboo chair glued with formaldehyde and</text><text x=\"180.0\" y=\"345.5\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">flown across the world is not greener than a steel one that lasts forty years.</text></svg>", "u6_energy": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 282\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"282\" fill=\"#ffffff\"/><text x=\"180.0\" y=\"24.3\" font-size=\"12.2\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"bold\">Embodied energy per kg, and what recycling saves</text><text x=\"180.0\" y=\"40.2\" font-size=\"9.2\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">MJ to deliver one kilogram, on a linear scale</text><text x=\"96\" y=\"64.4\" font-size=\"6.8\" text-anchor=\"end\" fill=\"#222\" font-weight=\"normal\">concrete</text><path d=\"M104.0 54.5L104.4 54.5L104.4 62.5L104.0 62.5Z\" fill=\"#E9EDF1\" stroke=\"#666666\" stroke-width=\"0.7\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"109.38\" y=\"64.2\" font-size=\"6.2\" text-anchor=\"start\" fill=\"#666666\" font-weight=\"normal\">1</text><text x=\"130.38\" y=\"64.0\" font-size=\"5.8\" text-anchor=\"start\" fill=\"#2E7D32\" font-weight=\"normal\">rec 0.9</text><text x=\"96\" y=\"84.4\" font-size=\"6.8\" text-anchor=\"end\" fill=\"#222\" font-weight=\"normal\">glass</text><path d=\"M104.0 74.5L109.7 74.5L109.7 82.5L104.0 82.5Z\" fill=\"#D8EDEA\" stroke=\"#00695C\" stroke-width=\"0.7\" stroke-linejoin=\"round\" st  stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"141.72\" y=\"125.2\" font-size=\"6.2\" text-anchor=\"start\" fill=\"#666666\" font-weight=\"normal\">180 kg</text><text x=\"176.72\" y=\"125.1\" font-size=\"6.0\" text-anchor=\"start\" fill=\"#222222\" font-weight=\"normal\">12 %</text><text x=\"112\" y=\"146.2\" font-size=\"6.4\" text-anchor=\"end\" fill=\"#222\" font-weight=\"normal\">copper</text><path d=\"M118.0 136.0L125.8 136.0L125.8 145.0L118.0 145.0Z\" fill=\"#F6E3C5\" stroke=\"#B66A00\" stroke-width=\"0.7\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"130.8\" y=\"146.2\" font-size=\"6.2\" text-anchor=\"start\" fill=\"#666666\" font-weight=\"normal\">75 kg</text><text x=\"165.8\" y=\"146.1\" font-size=\"6.0\" text-anchor=\"start\" fill=\"#222222\" font-weight=\"normal\">5 %</text><text x=\"112\" y=\"167.2\" font-size=\"6.4\" text-anchor=\"end\" fill=\"#222\" font-weight=\"normal\">glass and other</text><path d=\"M118.0 157.0L122.7 157.0L122.7 166.0L118.0 166.0Z\" fill=\"#D8EDEA\" stroke=\"#00695C\" stroke-width=\"0.7\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"127.68\" y=\"167.2\" font-size=\"6.2\" text-anchor=\"start\" fill=\"#666666\" font-weight=\"normal\">45 kg</text><text x=\"162.68\" y=\"167.1\" font-size=\"6.0\" text-anchor=\"start\" fill=\"#222222\" font-weight=\"normal\">3 %</text><text x=\"118\" y=\"186.2\" font-size=\"6.2\" text-anchor=\"start\" fill=\"#666666\" font-weight=\"normal\">total 1500 kg, of which 15 % is the battery</text><rect x=\"6.0\" y=\"204.0\" width=\"348.0\" height=\"58.0\" rx=\"5\" fill=\"#F5EEFD\" stroke=\"#7B2CD9\" stroke-width=\"1\"/><text x=\"180.0\" y=\"218.9\" font-size=\"8.2\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">three numbers that shape the material choice</text><text x=\"180.0\" y=\"232.7\" font-size=\"7.6\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"normal\">every 100 kg removed is about 0.4 kWh less energy per 100 km</text><text x=\"180.0\" y=\"244.2\" font-size=\"7.6\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"normal\">the pack is 225 kg and 35 kWh: 155 Wh per kg of pack, not of cell</text><text x=\"180.0\" y=\"255.7\" font-size=\"7.6\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"normal\">an EV uses 3 times the copper of a car with an engine: 75 kg against 23</text><text x=\"180.0\" y=\"279.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">The green car is not a different material world: it is the same steel, aluminium</text><text x=\"180.0\" y=\"291.5\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">and copper, rearranged around a battery that was not there before.</text></svg>", "u6_batt": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 264\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"264\" fill=\"#ffffff\"/><text x=\"180.0\" y=\"24.3\" font-size=\"12.2\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"bold\">The five materials in one lithium-ion cell</text><text x=\"180.0\" y=\"40.2\" font-size=\"9.2\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">each layer has one job</text><rect x=\"40.0\" y=\"56.0\" width=\"190.0\" height=\"10.0\" fill=\"#E9EDF1\" stroke=\"#9AA3AD\" stroke-width=\"1.1\"/><rect x=\"40.0\" y=\"66.0\" width=\"190.0\" height=\"20.0\" fill=\"#EFE4FB\" stroke=\"#7B2CD9\" stroke-width=\"1.1\"/><text x=\"135.0\" y=\"80.4\" font-size=\"5.8\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"normal\">cathode: NMC or LFP, 60 um</text><rect x=\"40.0\" y=\"86.0\" width=\"190.0\" height=\"14.0\" fill=\"#FFF6EC\" stroke=\"#B66A00\" stroke-width=\"1.1\"/><text x=\"135.0\" y=\"97.4\" font-size=\"5.8\" text-anchor=\"middle\" fill=\"#B66A00\" font-weight=\"normal\">separator plus electrolyte, 20 um</text><rect x=\"40.0\" y=\"100.0\" width=\"190.0\" height=\"18.0\" fill=\"#D8EEDA\" stroke=\"#2E7D32\" stroke-width=\"1.1\"/><text x=\"135.0\" y=\"113.4\" font-size=\"5.8\" text-anchor=\"middle\" fill=\"#2E7D32\" font-weight=\"normal\">anode: graphite, 50 um</text><rect x=\"40.0\" y=\"118.0\" width=\"190.0\" height=\"10.0\" fill=\"#E9EDF1\" stroke=\"#9AA3AD\" stroke-width=\"1.1\"/><text x=\"40\" y=\"50.3\" font-size=\"6.6\" text-anchor=\"start\" fill=\"#222\" font-weight=\"bold\">a single cell, 3.7 V</text><path d=\"M232.0 61.0L240.0 61.0\" fill=\"none\" stroke=\"#9AA3AD\" stroke-width=\"0.8\" stroke-linecap=\"round\" stroke-dasharray=\"2,2\"/><circle cx=\"232.0\" cy=\"61.0\" r=\"1.5\" fill=\"#9AA3AD\"/><text x=\"244\" y=\"65.1\" font-size=\"6.0\" text-anchor=\"start\" fill=\"#666666\" font-weight=\"normal\">aluminium foil, 15 um</text><path d=\"M232.0 123.0L240.0 123.0\" fill=\"none\" stroke=\"#9AA3AD\" stroke-width=\"0.8\" stroke-linecap=\"round\" stroke-dasharray=\"2,2\"/><circle cx=\"232.0\" cy=\"123.0\" r=\"1.5\" fill=\"#9AA3AD\"/><text x=\"244\" y=\"127.1\" font-size=\"6.0\" text-anchor=\"start\" fill=\"#666666\" font-weight=\"normal\">copper foil, 10 um</text><path d=\"M232.0 76.0L240.0 76.0\" fill=\"none\" stroke=\"#9AA3AD\" stroke-width=\"0.8\" stroke-linecap=\"round\" stroke-dasharray=\"2,2\"/><circle cx=\"232.0\" cy=\"76.0\" r=\"1.5\" fill=\"#9AA3AD\"/><text x=\"244\" y=\"81.1\" font-size=\"6.0\" text-anchor=\"start\" fill=\"#7B2CD9\" font-weight=\"normal\">holds the lithium</text><path d=\"M232.0 93.0L240.0 93.0\" fill=\"none\" stroke=\"#9AA3AD\" stroke-width=\"0.8\" stroke-linecap=\"round\" stroke-dasharray=\"2,2\"/><circle cx=\"232.0\" cy=\"93.0\" r=\"1.5\" fill=\"#9AA3AD\"/><text x=\"244\" y=\"98.1\" font-size=\"6.0\" text-anchor=\"start\" fill=\"#B66A00\" font-weight=\"normal\">keeps the plates apart</text><rect x=\"6.0\" y=\"146.0\" width=\"348.0\" height=\"74.0\" rx=\"5\" fill=\"#F5EEFD\" stroke=\"#7B2CD9\" stroke-width=\"1\"/><text x=\"180.0\" y=\"160.9\" font-size=\"8.2\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">the four numbers of a cell, and what they mean for the car</text><text x=\"180.0\" y=\"174.7\" font-size=\"7.6\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"normal\">cell 3.7 V and 50 Ah: energy 185 Wh, and a 96 cell pack is 355 V and 17.8 kWh</text><text x=\"180.0\" y=\"186.2\" font-size=\"7.6\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"normal\">specific energy: LFP 140, NMC 220 Wh/kg of cell; the pack is 30 % less</text><text x=\"180.0\" y=\"197.7\" font-size=\"7.6\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"normal\">life is counted in cycles: 1500 to 3000 for a car, 5000 for a stationary pack</text><text x=\"180.0\" y=\"209.2\" font-size=\"7.6\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"normal\">at end of life the metals are worth recovering: Li, Ni, Co and the copper</text><text x=\"180.0\" y=\"245.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">A battery is the only part of a machine whose material is chosen for its chemistry</text><text x=\"180.0\" y=\"257.5\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">rather than its strength, and the only one whose second life is a problem.</text></svg>", "u6_solar": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 288\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"288\" fill=\"#ffffff\"/><text x=\"180.0\" y=\"24.3\" font-size=\"12.2\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"bold\">From 1000 W/m2 of sunlight to 1.28 kWh a day</text><text x=\"180.0\" y=\"40.2\" font-size=\"9.2\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">the losses at each step</text><text x=\"142\" y=\"64.2\" font-size=\"6.2\" text-anchor=\"end\" fill=\"#222\" font-weight=\"normal\">sunlight on the panel</text><path d=\"M150.0 53.0L300.0 53.0L300.0 64.0L150.0 64.0Z\" fill=\"#E9EDF1\" stroke=\"#666666\" stroke-width=\"0.8\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"306.0\" y=\"64.2\" font-size=\"6.2\" text-anchor=\"start\" fill=\"#666666\" font-weight=\"normal\">1000 W/m2</text><text x=\"142\" y=\"88.2\" font-size=\"6.2\" text-anchor=\"end\" fill=\"#222\" font-weight=\"normal\">after reflection and heat</text><path d=\"M150.0 77.0L277.5 77.0L277.5 88.0L150.0 88.0Z\" fill=\"#DCEEFB\" stroke=\"#1565C0\" stroke-width=\"0.8\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"283.5\" y=\"88.2\" font-size=\"6.2\" text-anchor=\"start\" fill=\"#1565C0\" font-weight=\"normal\">850 W/m2</text><text x=\"142\" y=\"112.2\" font-size=\"6.2\" text-anchor=\"end\" fill=\"#222\" font-weight=\"normal\">converted by the cells at 20 %</text><path d=\"M150.0 101.0L180.0 101.0L180.0 112.0L150.0 112.0Z\" fill=\"#D8EDEA\" stroke=\"#00695C\" stroke-width=\"0.8\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"186.0\" y=\"112.2\" font-size=\"6.2\" text-anchor=\"start\" fill=\"#00695C\" font-weight=\"normal\">200 W/m2</text><text x=\"142\" y=\"136.2\" font-size=\"6.2\" text-anchor=\"end\" fill=\"#222\" font-weight=\"normal\">after inverter and wiring</text><path d=\"M150.0 125.0L175.5 125.0L175.5 136.0L150.0 136.0Z\" fill=\"#D8EEDA\" stroke=\"#2E7D32\" stroke-width=\"0.8\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"181.5\" y=\"136.2\" font-size=\"6.2\" text-anchor=\"start\" fill=\"#2E7D32\" font-weight=\"normal\">170 W/m2</text><text x=\"150\" y=\"160.3\" font-size=\"6.6\" text-anchor=\"start\" fill=\"#222\" font-weight=\"bold\">2 m2 panel at 200 W/m2 = 400 W peak</text><text x=\"150\" y=\"172.2\" font-size=\"6.2\" text-anchor=\"start\" fill=\"#666666\" font-weight=\"normal\">4 peak sun hours at 0.8 performance ratio</text><text x=\"150\" y=\"184.2\" font-size=\"6.4\" text-anchor=\"start\" fill=\"#2E7D32\" font-weight=\"bold\">= 400 x 4 x 0.8 = 1280 Wh = 1.28 kWh per day</text><rect x=\"6.0\" y=\"196.0\" width=\"348.0\" height=\"58.0\" rx=\"5\" fill=\"#F5EEFD\" stroke=\"#7B2CD9\" stroke-width=\"1\"/><text x=\"180.0\" y=\"210.9\" font-size=\"8.2\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">the materials behind the number</text><text x=\"180.0\" y=\"224.7\" font-size=\"7.6\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"normal\">mono silicon 20 - 22 %, poly 16 - 18 %, CdTe and CIGS 16 - 18 % of module area</text><text x=\"180.0\" y=\"236.2\" font-size=\"7.6\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"normal\">a module is glass, EVA, cells, backsheet and an aluminium frame: 70 % is not cell</text><text x=\"180.0\" y=\"247.7\" font-size=\"7.6\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"normal\">energy payback 1 to 3 years against 25: nine tenths of its output is carbon free</text><text x=\"180.0\" y=\"271.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">Efficiency is a material property, so the panel is chosen for the area it can use:</text><text x=\"180.0\" y=\"283.5\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">a roof short of area buys mono silicon, a field buys whatever is cheapest per kWh.</text></svg>", "u6_light": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 282\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"282\" fill=\"#ffffff\"/><text x=\"180.0\" y=\"24.3\" font-size=\"12.2\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"bold\">Specific strength: the fair comparison</text><text x=\"180.0\" y=\"40.2\" font-size=\"9.2\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">UTS divided by density, in kN m per kg</text><text x=\"120\" y=\"64.2\" font-size=\"6.4\" text-anchor=\"end\" fill=\"#222\" font-weight=\"normal\">mild steel</text><path d=\"M126.0 54.5L136.7 54.5L136.7 62.5L126.0 62.5Z\" fill=\"#E9EDF1\" stroke=\"#666666\" stroke-width=\"0.7\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"141.68\" y=\"64.2\" font-size=\"6.2\" text-anchor=\"start\" fill=\"#666666\" font-weight=\"normal\">57</text><text x=\"166.68\" y=\"64.0\" font-size=\"5.8\" text-anchor=\"start\" fill=\"#9AA3AD\" font-weight=\"normal\">rho 7.85</text><text x=\"120\" y=\"84.2\" font-size=\"6.4\" text-anchor=\"end\" fill=\"#222\" font-weight=\"normal\">aluminium 6061-T6</text><path d=\"M126.0 74.5L147.5 74.5L147.5 82.5L126.0 82.5Z\" fill=\"#DCEEFB\" stroke=\"#1565C0\" stroke-width=\"0.7\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"152.54736842105262\" y=\"84.2\" font-size=\"6.2\" text-anchor=\"start\" fill=\"#666666\" font-weight=\"normal\">115</text><text x=\"177.54736842105262\" y=\"84.0\" font-size=\"5.8\" text-anchor=\"start\" fill=\"#9AA3AD\" font-weight=\"normal\">rho 2.7</text><text x=\"120\" y=\"104.2\" font-size=\"6.4\" text-anchor=\"end\" fill=\"#222\" font-weight=\"normal\">magnesium AZ91</text><path d=\"M126.0 94.5L147.5 94.5L147.5 102.5L126.0 102.5Z\" fill=\"#D8EDEA\" stroke=\"#00695C\" stroke-width=\"0.7\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"152.54736842105262\" y=\"104.2\" font-size=\"6.2\" text-anchor=\"start\" fill=\"#666666\" font-weight=\"normal\">115</text><text x=\"177.54736842105262\" y=\"104.0\" font-size=\"5.8\" text-anchor=\"start\" fill=\"#9AA3AD\" font-weight=\"normal\">rho 1.74</text><text x=\"120\" y=\"124.2\" font-size=\"6.4\" text-anchor=\"end\" fill=\"#222\" font-weight=\"normal\">GFRP laminate</text><path d=\"M126.0 114.5L155.6 114.5L155.6 122.5L126.0 122.5Z\" fill=\"#F6E3C5\" stroke=\"#B66A00\" stroke-width=\"0.7\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"160.6042105263158\" y=\"124.2\" font-size=\"6.2\" text-anchor=\"start\" fill=\"#666666\" font-weight=\"normal\">158</text><text x=\"185.6042105263158\" y=\"124.0\" font-size=\"5.8\" text-anchor=\"start\" fill=\"#9AA3AD\" font-weight=\"normal\">rho 1.9</text><text x=\"120\" y=\"144.2\" font-size=\"6.4\" text-anchor=\"end\" fill=\"#222\" font-weight=\"normal\">titanium 6Al-4V</text><path d=\"M126.0 134.5L174.7 134.5L174.7 142.5L126.0 142.5Z\" fill=\"#EFE4FB\" stroke=\"#7B2CD9\" stroke-width=\"0.7\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"179.7157894736842\" y=\"144.2\" font-size=\"6.2\" text-anchor=\"start\" fill=\"#666666\" font-weight=\"normal\">260</text><text x=\"204.7157894736842\" y=\"144.0\" font-size=\"5.8\" text-anchor=\"start\" fill=\"#9AA3AD\" font-weight=\"normal\">rho 4.43</text><text x=\"120\" y=\"164.2\" font-size=\"6.4\" text-anchor=\"end\" fill=\"#222\" font-weight=\"normal\">CFRP laminate</text><path d=\"M126.0 154.5L301.8 154.5L301.8 162.5L126.0 162.5Z\" fill=\"#F7DDE3\" stroke=\"#BD2543\" stroke-width=\"0.7\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"306.75157894736844\" y=\"164.2\" font-size=\"6.2\" text-anchor=\"start\" fill=\"#666666\" font-weight=\"normal\">938</text><text x=\"331.75157894736844\" y=\"164.0\" font-size=\"5.8\" text-anchor=\"start\" fill=\"#9AA3AD\" font-weight=\"normal\">rho 1.6</text><rect x=\"6.0\" y=\"190.0\" width=\"348.0\" height=\"58.0\" rx=\"5\" fill=\"#F5EEFD\" stroke=\"#7B2CD9\" stroke-width=\"1\"/><text x=\"180.0\" y=\"204.9\" font-size=\"8.2\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">the same number, two engineering meanings</text><text x=\"180.0\" y=\"218.7\" font-size=\"7.6\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"normal\">lightweighting: 100 kg off a car is 0.4 kWh per 100 km less to move</text><text x=\"180.0\" y=\"230.2\" font-size=\"7.6\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"normal\">green: half the material is half the embodied energy and half the fuel</text><text x=\"180.0\" y=\"241.7\" font-size=\"7.6\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"normal\">but stiffness, not strength, decides a panel: CFRP needs a thicker section</text><text x=\"180.0\" y=\"265.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">A moving part is judged by specific strength and a static part by stiffness, which</text><text x=\"180.0\" y=\"277.5\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">is why the same two materials win in two different places on the same car.</text></svg>"};

     intro:'વેઇટેજ',hours:'કલાક',introd:'GTU syllabus મુજબ આકૃતિ, સૂત્રો, ઉકેલેલા દાખલા અને viva સાથે વિગતવાર નોટ્સ.',
     marks:'ગુણ',programs:'પ્રોગ્રામ્સ',flowcharts:'ફ્લોચાર્ટ',syntax:'સિન્ટેક્સ',algorithms:'અલ્ગોરિધમ',prog:'💻 પ્રોગ્રામ',code:'કોડ',output:'આઉટપુટ',plot:'પ્લોટ (આઉટપુટ)',expl:'સમજૂતી',
     introc:'GTU syllabus મુજબ flowcharts, આઉટપુટ સાથેના ઉકેલેલા C programs, syntax અને viva સાથે વિગતવાર નોટ્સ.'}};
const L = k => STR[S.lang][k];
const t = o => (o && typeof o === 'object') ? (o[S.lang] || o.en) : (o || '');
const chev = '<svg class="chev" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#7B2CD9" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
const dots = '<svg width="22" height="22" viewBox="0 0 24 24" fill="#222"><circle cx="12" cy="5" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="12" cy="19" r="2.2"/></svg>';
const fixTables = h => h.replace(/<table>/g,'<div class="tw"><table>').replace(/<\/table>/g,'</table></div>');
const head = (title, menu=true) => `<div class="sh"><span>${title}</span>${menu?`<button class="more" data-more>${dots}</button><div class="menu"><button data-act="expand">${L('expand')}</button><button data-act="collapse">${L('collapse')}</button></div>`:''}</div>`;
const dgInline = id => `<div class="dg" data-dg="${id}">${SVG[id]}</div><div class="dgc">📐 ${t(U.diagrams.find(d=>d.id===id).title)} · ${L('tapzoom')}</div>`;

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const KW = new Set('auto break case const continue default do else enum extern for goto if register return signed sizeof static struct switch typedef union unsigned volatile while'.split(' '));
const TY = new Set('int char float double void long short FILE size_t'.split(' '));
const PKW = new Set('False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield'.split(' '));
const PTY = new Set('int float str bool list tuple set dict complex frozenset bytes bytearray range object'.split(' '));
function hlPy(src){
  const re = /(#[^\n]*)|((?:\b[rRbBfFuU]{1,2})?(?:'{3}[\s\S]*?'{3}|"{3}[\s\S]*?"{3}|'(?:\\.|[^'\\\n])*'|"(?:\\.|[^"\\\n])*"))|(^>>>|^\.\.\.(?= ))|([A-Za-z_]\w*)(?=\s*\()|([A-Za-z_]\w*)|(\b(?:0[xXoObB][0-9a-fA-F_]+|\d[\d_]*(?:\.\d+)?(?:[eE][-+]?\d+)?j?)\b)/gm;
  let o='', last=0, m;
  while ((m = re.exec(src))){
    o += esc(src.slice(last, m.index)); last = re.lastIndex;
    const w = esc(m[0]);
    if (m[1]) o += `<span class="cm">${w}</span>`;
    else if (m[2]) o += `<span class="st">${w}</span>`;
    else if (m[3]) o += `<span class="pp">${w}</span>`;
    else if (m[4]) o += PKW.has(m[4]) ? `<span class="kw">${w}</span>` : PTY.has(m[4]) ? `<span class="ty">${w}</span>` : `<span class="fn">${w}</span>`;
    else if (m[5]) o += PKW.has(m[5]) ? `<span class="kw">${w}</span>` : PTY.has(m[5]) ? `<span class="ty">${w}</span>` : w;
    else o += `<span class="nu">${w}</span>`;
  }
  return o + esc(src.slice(last));
}
function hl(src){
  if (META.code_lang === 'python') return hlPy(src);
  if (META.code_lang === 'nosql') return esc(src);
  const re = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(^[ \t]*#[^\n]*)|([A-Za-z_]\w*)(?=\s*\()|([A-Za-z_]\w*)|(\b\d+(?:\.\d+)?[fFlLuU]*\b)/gm;
  let o='', last=0, m;
  while ((m = re.exec(src))){
    o += esc(src.slice(last, m.index)); last = re.lastIndex;
    const w = esc(m[0]);
    if (m[1]) o += `<span class="cm">${w}</span>`;
    else if (m[2]) o += `<span class="st">${w}</span>`;
    else if (m[3]) o += `<span class="pp">${w}</span>`;
    else if (m[4]) o += KW.has(m[4]) ? `<span class="kw">${w}</span>` : TY.has(m[4]) ? `<span class="ty">${w}</span>` : `<span class="fn">${w}</span>`;
    else if (m[5]) o += KW.has(m[5]) ? `<span class="kw">${w}</span>` : TY.has(m[5]) ? `<span class="ty">${w}</span>` : w;
    else o += `<span class="nu">${w}</span>`;
  }
  return o + esc(src.slice(last));
}
const progBody = p => p.items
  ? p.items.map(it => fixTables(t(it.body)) + (it.diagram?dgInline(it.diagram):'')).join('')
  : `<div class="pl">${L('code')}</div><pre class="code">${hl(t(p.code))}</pre><div class="pl">${L('output')}</div><pre class="out">${esc(p.out)}</pre>${p.plot?`<div class="pl">${L('plot')}</div>`+dgInline(p.plot).replace('class="dg"','class="dg pg"'):''}${p.expl?`<div class="pl">${L('expl')}</div>${fixTables(t(p.expl))}`:''}`;
const pBox = id => { const p=(U.programs||[]).find(x=>x.id===id); if(!p) return ''; return `<div class="pbox"><div class="et">${L('prog')}: ${t(p.title)}</div>${progBody(p)}</div>`; };
const exBox = id => { const n=(U.numericals||[]).find(x=>x.id===id); if(!n) return ''; return `<div class="ex"><div class="et">${L('ex')}</div><div class="eq2">${t(n.q)}</div>${fixTables(t(n.a))}</div>`; };
function notes(){
  let h = `<div class="intro"><b>${t(U.title)}</b><div>${L('unit')} ${U.unit} · ${U.weightage}% ${L('intro')} · ${U.hours} ${L('hours')}</div><div>${U.intro_text ? t(U.intro_text) : L(U.programs?(META.code_lang==='python'?'intropy':'introc'):'introd')}</div></div>`;
  U.notes.forEach((sec,si)=>{
    h += `<div class="sec">${head(t(sec.title))}`;
    sec.items.forEach((it,i)=>{
      const open = si===0&&i===0 ? ' open' : '';
      if (it.h) {
        h += `<div class="card${it.key?' key':''}${open}"><div class="q hd"><span class="t">${it.key?'⭐ ':''}${t(it.h)}</span>${chev}</div>
        <div class="a rn" style="padding-left:18px">${fixTables(t(it.body)).replace(/margin:0 0 10px -36px/g,'')}${it.diagram?dgInline(it.diagram):''}${(it.examples||[]).map(exBox).join('')}${(it.programs||[]).map(pBox).join('')}</div></div>`;
      } else {
        h += `<div class="card${open}"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(it.q)}</span>${chev}</div>
        <div class="a">${fixTables(t(it.a))}${it.diagram?dgInline(it.diagram):''}</div></div>`;
      }
    });
    h += `</div>`;
  });
  return h;
}
function numericals(){
  return `<div class="sec">${head(L('numericals'))}` + (U.numericals||[]).map((n,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(n.q)}</span>${chev}</div><div class="a">${fixTables(t(n.a))}</div></div>`).join('') + `</div>`;
}
function diagrams(){
  return `<div class="sec">${head(L((U.tabs ? U.tabs.includes('flowcharts')&&!U.tabs.includes('diagrams') : U.programs&&META.code_lang!=='python')?'flowcharts':'diagrams'),false)}<div style="height:10px"></div>` + U.diagrams.map((d,i)=>
    `<div class="dcard" data-dg="${d.id}"><div class="h">${i+1}. ${t(d.title)}</div>${SVG[d.id]}</div>`).join('') + `</div>`;
}
function equations(){
  return U.equations.map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><span class="fbox">${e.f}</span></span>${chev}</div>
     <div class="a"><p>${t(e.terms)}</p></div></div>`).join('') + `</div>`).join('');
}
function viva(){
  // two shapes exist in the corpus: flat [{q,a}] and grouped [{title, items:[{q,a}]}]
  const groups = U.viva.every(v=>v && v.q) ? [{items: U.viva}] : U.viva;
  return groups.map(g=>{
    const items = g.items || [];
    return `<div class="sec">${g.title?head(t(g.title)):''}` + items.map((v,i)=>
      `<div class="card"><div class="q hd"><span class="n">${i+1}.</span><span class="t">${t(v.q)}</span>${chev}</div><div class="a"><p>${t(v.a)}</p></div></div>`).join('') + `</div>`;
  }).join('');
}
function exam(){
  return `<div class="sec">${head(L('examhead'),false)}` + U.exam_questions.map((x,i)=>
    `<div class="card"><div class="q" style="cursor:default"><span class="n">${i+1}.</span><span class="t">${t(x.q)}</span><span class="mk">${x.marks} ${L('marks')}</span></div></div>`).join('') + `</div>`;
}
function programs(){
  return `<div class="sec">${head(L('programs'))}` + (U.programs||[]).map((p,i)=>
    `<div class="card"><div class="q hd"><span class="n">${i+1}.</span><span class="t">${t(p.title)}</span>${chev}</div><div class="a pa">${progBody(p)}</div></div>`).join('') + `</div>`;
}
function syntax(key){
  return (U[typeof key==='string'?key:'syntax']||[]).map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><pre class="code sx">${hl(e.f)}</pre></span>${chev}</div>
     <div class="a">${e.terms && t(e.terms) ? fixTables(t(e.terms)) : ''}</div></div>`).join('') + `</div>`).join('');
}
const flowcharts = diagrams;
const algorithms = () => syntax('algorithms');
const ALLV = {notes, programs, diagrams, flowcharts, algorithms, syntax, equations, numericals, viva, exam};
const VIEWS = U.tabs ? Object.fromEntries(U.tabs.map(k=>[k, ALLV[k]])) : U.programs ? (META.code_lang==='python' ? {notes, programs, diagrams, syntax, viva, exam} : {notes, programs, flowcharts, syntax, viva, exam}) : U.numericals ? {notes, diagrams, equations, numericals, viva, exam} : {notes, diagrams, equations, viva, exam};
function render(){
  document.getElementById('title').textContent = `${L('unit')} ${U.unit}: ${t(U.title)}`;
  document.getElementById('sub').textContent = `${t(META.name)} · ${META.code}`;
  document.getElementById('lang').textContent = S.lang==='en' ? 'ગુ' : 'EN';
  document.getElementById('lang').style.display = META.languages.includes('gu') ? '' : 'none';
  document.getElementById('tabs').innerHTML = Object.keys(VIEWS).map(k=>`<button class="tab${S.tab===k?' on':''}" data-tab="${k}">${L(k)}</button>`).join('');
  document.getElementById('view').innerHTML = VIEWS[S.tab]();
  document.querySelectorAll('#view pre.c').forEach(e=>{ e.innerHTML = hl(e.textContent); e.className='code'; });
}
let zoom = 1;
function setZoom(z){ zoom = Math.min(4, Math.max(1, z)); const w=document.getElementById('zw'); w.style.width=(zoom*100)+'%'; document.getElementById('zr').textContent=Math.round(zoom*100)+'%'; }
document.addEventListener('click', e=>{
  const q = e.target.closest('.q'); if (q && q.parentElement.querySelector('.a')) { q.parentElement.classList.toggle('open'); return; }
  const tb = e.target.closest('[data-tab]'); if (tb){ S.tab = tb.dataset.tab; render(); window.scrollTo(0,0); return; }
  if (e.target.closest('#lang')){ S.lang = S.lang==='en'?'gu':'en'; render(); return; }
  const m = e.target.closest('[data-more]');
  document.querySelectorAll('.menu.show').forEach(x=>{ if(!m || x!==m.nextElementSibling) x.classList.remove('show'); });
  if (m){ m.nextElementSibling.classList.toggle('show'); return; }
  const act = e.target.closest('[data-act]');
  if (act){ act.closest('.sec').querySelectorAll('.card').forEach(c=>{ if(c.querySelector('.a')) c.classList.toggle('open', act.dataset.act==='expand'); }); act.parentElement.classList.remove('show'); return; }
  const dg = e.target.closest('[data-dg]');
  if (dg){ const id=dg.dataset.dg; document.getElementById('mt').textContent=t(U.diagrams.find(d=>d.id===id).title); document.getElementById('zw').innerHTML=SVG[id]; setZoom(1); document.getElementById('modal').classList.add('show'); return; }
  if (e.target.closest('#mx')) document.getElementById('modal').classList.remove('show');
  if (e.target.closest('#zi')) setZoom(zoom+0.5);
  if (e.target.closest('#zo')) setZoom(zoom-0.5);
  if (e.target.closest('#zr')) setZoom(1);
});
render();
</script></body></html>
