<script>
const U = {"subject": "DI01000181", "unit": 6, "format": "notes", "title": {"en": "Green Material", "gu": "હરિત સામગ્રી"}, "hours": 6, "weightage": 15, "theory_marks": 10, "official": true, "languages": ["en", "gu"], "tabs": ["notes", "diagrams", "equations", "viva", "exam"], "intro_text": {"en": "Unit 6 closes the syllabus with the question the first five units leave open: which material should a part be made of, once energy and life are counted as well as strength. It defines a green material on four counts and sets out the account - embodied energy, carbon, energy payback - then applies it to the automotive sector, where a 1500 kg electric car is 675 kg of steel and 225 kg of battery, and to renewable energy, where a solar module is mostly glass and a wind blade is 60 tonnes of composite. Natural fibre, recycled metal and biolubricants follow on the shop floor, and advanced materials - AHSS, aluminium, NdFeB magnets, Al-SiC - close the unit with the trade between mass, money and carbon. Six solved numericals follow in section 6.6.", "gu": "Unit 6 પહેલા પાંચ unit જે પ્રશ્ન ખુલ્લો રાખે તેનાથી અભ્યાસક્રમ પૂરો કરે: ઊર્જા અને આયુષ્ય પણ ગણતરીમાં લેતાં ભાગ કઈ સામગ્રીનો બનવો જોઈએ. તે green સામગ્રીને ચાર ગણતરીએ વ્યાખ્યાયિત કરે અને હિસાબ મૂકે - embodied energy, કાર્બન, energy payback - પછી તેને ઓટોમોબાઇલ ક્ષેત્રે લગાવે, જ્યાં 1500 કિલોની ઇલેક્ટ્રિક કાર 675 કિલો સ્ટીલ અને 225 કિલો battery છે, અને નવીનીકરણીય ઊર્જામાં, જ્યાં સોલાર module મોટે ભાગે કાચ છે અને પવન blade 60 ટન composite છે. કારખાના ફ્લોર પર કુદરતી રેસા, recycled ધાતુ અને biolubricant આવે, અને advanced materials - AHSS, aluminium, NdFeB magnet, Al-SiC - દળ, પૈસા અને કાર્બન વચ્ચેના સોદા સાથે unit પૂરો કરે. વિભાગ 6.6 માં છ ઉકેલેલા દાખલા છે."}, "notes": [{"title": {"en": "6.1 Green materials: the idea and the account", "gu": "6.1 Green materials: વિચાર અને હિસાબ"}, "items": [{"h": {"en": "What makes a material green", "gu": "સામગ્રી green ક્યારે કહેવાય"}, "body": {"en": "<p>A material is not green or dirty by itself; the whole life of the part it becomes is green or dirty. Four questions decide it: is the raw material <b>renewable</b>, can the material be <b>recycled</b> at the end, how much <b>energy, water and emission</b> went into each kilogram, and does the part <b>last</b>. The fourth question is the one students forget and designers cannot: a bamboo chair that is reglued every two years costs more material, more glue and more transport than a steel one that outlives its owner.</p><div class=\"math\">the four counts, as a designer writes them:\nrenewable: regrown in a human lifetime - wood, bamboo, cork, jute, PLA\nrecyclable: a second life at a fraction of the first energy - all metals\nlow impact: MJ, litres and kg of CO2 per kilogram delivered\ndurable: years of service per kilogram, which multiplies all three</div><table><tr><th>material</th><th>renewable</th><th>recycled today</th><th>the catch</th></tr><tr><td>steel</td><td>no</td><td>85 - 90 %</td><td>25 MJ/kg to make</td></tr><tr><td>aluminium</td><td>no</td><td>75 %</td><td>170 MJ/kg new, 8 from scrap</td></tr><tr><td>concrete</td><td>no</td><td>little</td><td>1 MJ/kg, but 4 billion tonnes a year</td></tr><tr><td>timber</td><td>yes</td><td>yes</td><td>1 - 5 MJ/kg, but land and glue</td></tr><tr><td>CFRP</td><td>no</td><td>almost none</td><td>500 MJ/kg, and it cannot be melted</td></tr></table><p><b>Why it is true.</b> every kilogram of material carries a bill that was paid before the part existed - a mine, a furnace, a refinery, a lorry - and that bill is paid again every time the part is replaced. Green design is therefore mostly arithmetic on mass and life, not a choice of fashionable material.</p><p><b>Common mistake.</b> a bio-based label is not a life cycle. A jute composite bonded with an epoxy, shipped wet and painted with a solvent paint can carry more energy than a glass fibre part made two hundred kilometres away; ask for the MJ per kilogram of the finished part, not of the fibre.</p><p><b>Check your answer.</b> for the part in front of you, write four numbers: mass, embodied energy, expected life and what happens at end of life. If any of the four is unknown, the material choice is not yet a decision, it is a preference.</p>", "gu": "<p>સામગ્રી પોતે green કે ગંદી હોતી નથી; તે જે ભાગ બને તેનું આખું જીવન green કે ગંદું હોય. ચાર પ્રશ્નો તે નક્કી કરે: કાચો માલ <b>renewable</b> છે કે નહીં, અંતે સામગ્રી <b>recycle</b> થઈ શકે કે નહીં, દરેક કિલોગ્રામ પાછળ કેટલી <b>ઊર્જા, પાણી અને emission</b> ગઈ, અને ભાગ <b>ટકે</b> છે કે નહીં. ચોથો પ્રશ્ન વિદ્યાર્થી ભૂલે અને designer ભૂલી ન શકે: દર બે વર્ષે ફરી ગુંદાયેલી bamboo ખુરશી એ સ્ટીલની ખુરશી કરતાં વધુ સામગ્રી, ગુંદર અને વહન માંગે જે તેના માલિક કરતાં વધુ ટકે છે.</p><div class=\"math\">the four counts, as a designer writes them:\nrenewable: regrown in a human lifetime - wood, bamboo, cork, jute, PLA\nrecyclable: a second life at a fraction of the first energy - all metals\nlow impact: MJ, litres and kg of CO2 per kilogram delivered\ndurable: years of service per kilogram, which multiplies all three</div><table><tr><th>સામગ્રી</th><th>renewable</th><th>આજે recycle થાય</th><th>અડચણ</th></tr><tr><td>સ્ટીલ</td><td>ના</td><td>85 - 90 %</td><td>બનાવવા 25 MJ/kg</td></tr><tr><td>aluminium</td><td>ના</td><td>75 %</td><td>નવું 170, scrap થી 8 MJ/kg</td></tr><tr><td>concrete</td><td>ના</td><td>થોડું</td><td>1 MJ/kg, પણ વર્ષે 4 અબજ ટન</td></tr><tr><td>લાકડું</td><td>હા</td><td>હા</td><td>1 - 5 MJ/kg, પણ જમીન અને ગુંદર</td></tr><tr><td>CFRP</td><td>ના</td><td>લગભગ નહીં</td><td>500 MJ/kg, અને ઓગળે નહીં</td></tr></table><p><b>કેમ સાચું છે.</b> ભાગ અસ્તિત્વમાં આવે તે પહેલાં જ દરેક કિલોગ્રામનું બિલ ભરાઈ ગયું હોય છે - ખાણ, ભઠ્ઠી, રિફાઇનરી, લારી - અને ભાગ બદલાય ત્યારે એ બિલ ફરી ભરાય. તેથી green design મોટે ભાગે દળ અને આયુષ્યનું ગણિત છે, ફેશનેબલ સામગ્રીની પસંદગી નહીં.</p><p><b>સામાન્ય ભૂલ.</b> bio-based લેબલ એ જીવનચક્ર નથી. epoxy સાથે જોડાયેલું, ભીનું વહન થયેલું અને solvent પેન્ટ કરેલું jute composite બસો કિલોમીટર દૂર બનેલા glass fibre ભાગ કરતાં વધુ ઊર્જા વાળું હોઈ શકે; fiber નહીં, તૈયાર ભાગના MJ પ્રતિ કિલોગ્રામ માંગો.</p><p><b>જવાબ ચકાસો.</b> તમારી સામેનો ભાગ લો અને ચાર આંકડા લખો: દળ, embodied energy, અપેક્ષિત આયુષ્ય અને અંતે શું થાય. ચારમાંથી એક પણ અજાણ્યો હોય તો સામગ્રીની પસંદગી હજી નિર્ણય નથી, પસંદગી માત્ર છે.</p>"}, "diagram": "u6_cycle"}, {"h": {"en": "The account: embodied energy, carbon and the payback", "gu": "હિસાબ: embodied energy, carbon અને payback"}, "body": {"en": "<p>The number that makes the argument is <b>embodied energy</b>: the primary energy needed to deliver one kilogram of a material ready to use, in MJ/kg. Aluminium is 170 and concrete is 1, a factor of a hundred and seventy before a single part is machined. Multiplying by mass gives the bill for the part, and dividing the extra energy of a lightweight choice by the energy it saves in service gives the <b>energy payback distance</b> - and that distance, not the mass on the drawing, decides whether the lighter part is a green part or only a lighter one.</p><div class=\"math\">part 12 kg in steel, replaced by 6.19 kg of aluminium that is equally stiff:\nextra embodied energy = 6.19 x 170 - 12 x 25 = 1052 - 300 = 752 MJ\nsaving in use for 5.81 kg = 0.4 x 0.0581 = 0.0232 kWh per 100 km = 0.836 kJ/km\npayback = 752/0.000836 = 900 000 km - primary aluminium does not pay back</div><table><tr><th>material</th><th>MJ/kg new</th><th>MJ/kg recycled</th><th>kg CO2 per kg</th></tr><tr><td>concrete</td><td>1</td><td>0.9</td><td>0.1</td></tr><tr><td>glass</td><td>15</td><td>12</td><td>1.3</td></tr><tr><td>steel</td><td>25</td><td>10</td><td>1.9</td></tr><tr><td>PET</td><td>80</td><td>40</td><td>2.7</td></tr><tr><td>aluminium</td><td>170</td><td>8</td><td>11.5</td></tr><tr><td>CFRP</td><td>500</td><td>300</td><td>25</td></tr></table><p><b>Why it is true.</b> the account is additive along the chain, so the biggest number wins: melting recycled aluminium takes 5 % of the electricity of smelting it from alumina, and that single fact is why a scrap yard is a mine with better ore. The same arithmetic on steel gives 60 %, on glass 20 % and on a thermoplastic 50 %, because a polymer can only be re-melted, not re-refined.</p><p><b>Common mistake.</b> one number is not an LCA. A full life cycle assessment (ISO 14040/14044) adds extraction, manufacture, transport, use and end of life, and the answer can flip with the grid: an aluminium part made with hydroelectricity is a different material from the same part made with coal power.</p><p><b>Check your answer.</b> quote embodied energy per kilogram of the finished part, with the recycling route stated: 'aluminium, 170 MJ/kg new, 8 MJ/kg from scrap, 60 % recycled content' is a claim that can be checked; 'eco-friendly aluminium' is not.</p>", "gu": "<p>દલીલ કરતો આંકડો છે <b>embodied energy</b>: વાપરવા તૈયાર એક કિલોગ્રામ સામગ્રી પહોંચાડવા જોઈતી પ્રાથમિક ઊર્જા, MJ/kg માં. aluminium 170 અને concrete 1, એટલે એક ભાગ machined થાય તે પહેલાં જ સો સિત્તેર ગણો ફરક. દળ સાથે ગુણવાથી ભાગનું બિલ મળે, અને હલકી પસંદગીની વધારાની ઊર્જાને સેવામાં બચતલી ઊર્જાથી ભાગીએ તો <b>energy payback distance</b> મળે - અને એ અંતર જ નક્કી કરે કે હલકો ભાગ green ભાગ છે કે ફક્ત હલકો.</p><div class=\"math\">part 12 kg in steel, replaced by 6.19 kg of aluminium that is equally stiff:\nextra embodied energy = 6.19 x 170 - 12 x 25 = 1052 - 300 = 752 MJ\nsaving in use for 5.81 kg = 0.4 x 0.0581 = 0.0232 kWh per 100 km = 0.836 kJ/km\npayback = 752/0.000836 = 900 000 km - primary aluminium does not pay back</div><table><tr><th>સામગ્રી</th><th>નવું MJ/kg</th><th>recycled MJ/kg</th><th>kg CO2 પ્રતિ kg</th></tr><tr><td>concrete</td><td>1</td><td>0.9</td><td>0.1</td></tr><tr><td>કાચ</td><td>15</td><td>12</td><td>1.3</td></tr><tr><td>સ્ટીલ</td><td>25</td><td>10</td><td>1.9</td></tr><tr><td>PET</td><td>80</td><td>40</td><td>2.7</td></tr><tr><td>aluminium</td><td>170</td><td>8</td><td>11.5</td></tr><tr><td>CFRP</td><td>500</td><td>300</td><td>25</td></tr></table><p><b>કેમ સાચું છે.</b> હિસાબ સાંકળ પર ઉમેરાય, તેથી સૌથી મોટો આંકડો જીતે: recycled aluminium ઓગાળવા alumina થી smelt કરતાં 5 % વીજળી જોઈએ, અને એ એક હકીકત જ કારણ છે કે ભંગારનું યાર્ડ સારો ore ધરાવતી ખાણ છે. એ જ ગણિત સ્ટીલમાં 60 %, કાચમાં 20 % અને thermoplastic માં 50 % આપે, કારણ કે polymer ફરી ઓગળે, ફરી refine ન થાય.</p><p><b>સામાન્ય ભૂલ.</b> એક આંકડો LCA નથી. પૂરું life cycle assessment (ISO 14040/14044) extraction, ઉત્પાદન, વહન, વપરાશ અને અંત જોડે, અને જવાબ grid સાથે ઊલટો થઈ શકે: જળવિદ્યુતથી બનેલો aluminium ભાગ કોલસાની વીજળીથી બનેલા એ જ ભાગ કરતાં જુદી સામગ્રી છે.</p><p><b>જવાબ ચકાસો.</b> તૈયાર ભાગના કિલોગ્રામ દીઠ embodied energy કહો અને recycling માર્ગ પણ: 'aluminium, નવું 170 MJ/kg, scrap થી 8, 60 % recycled content' ચકાસી શકાય તેવો દાવો છે; 'eco-friendly aluminium' નથી.</p>"}, "diagram": "u6_energy"}]}, {"title": {"en": "6.2 Green materials in the automotive sector", "gu": "6.2 ઓટોમોબાઇલ ક્ષેત્રે green materials"}, "items": [{"h": {"en": "The materials of an electric car", "gu": "ઇલેક્ટ્રિક કારની સામગ્રી"}, "body": {"en": "<p>An electric car is not built of new materials; it is the old list rearranged around a battery. Of 1500 kg, 675 kg is still steel and high strength steel for the body and the safety cage, 300 kg is aluminium for bonnet, doors and subframe, 225 kg is the pack, 180 kg is polymer and composite, 75 kg is copper and 45 kg is glass. What changed is the copper - 75 kg against 23 kg in a car with an engine, because the motor windings, the busbars and the charger all carry heavy current - and the pack, which is 15 % of the car and 100 % of the new material problem.</p><div class=\"math\">the two numbers that drive every material decision on the car:\nmass: every 100 kg removed is about 0.4 kWh less per 100 km\nso 300 kg of aluminium instead of steel is 1.2 kWh per 100 km, about 8 %\nand the pack that stores 35 kWh weighs 225 kg: 155 Wh per kg of pack</div><table><tr><th>material</th><th>mass, kg</th><th>why it is there</th><th>green issue</th></tr><tr><td>steel and AHSS</td><td>675</td><td>crash structure, 1500 MPa in the pillars</td><td>85 % recycled, easy to sort</td></tr><tr><td>aluminium</td><td>300</td><td>half the weight of steel</td><td>170 MJ/kg, but 8 from scrap</td></tr><tr><td>battery pack</td><td>225</td><td>35 kWh of energy on board</td><td>Li, Ni and Co recovery needed</td></tr><tr><td>polymers</td><td>180</td><td>bumpers, trim, insulation</td><td>9 % recycled worldwide</td></tr><tr><td>copper</td><td>75</td><td>windings, busbars, 12 V and HV wiring</td><td>high value, well recycled</td></tr></table><p><b>Why it is true.</b> lightweighting and greening pull in the same direction up to a point and then pull apart: aluminium saves fuel in service but costs seven times the embodied energy of the steel it replaces, and CFRP saves more fuel still at 500 MJ/kg and with no melting route at end of life. The green car is therefore not the lightest car; it is the car whose saved energy has paid back its extra energy.</p><p><b>Common mistake.</b> a battery pack is not a fuel tank that can be drained and scrapped. It is 225 kg of material with a second life as a stationary store, and only then a recycling problem - so write the end-of-life route into the design, not into the disposal contract.</p><p><b>Check your answer.</b> when a part is made lighter, ask two questions: how many kilometres before the extra energy is paid back, and what happens to this material at end of life. A 12 kg steel subframe replaced by primary aluminium never pays back inside 200 000 km; the same part in 60 % recycled aluminium pays back in 180 000 km, and in scrap-only aluminium it saves energy from the first kilometre.</p>", "gu": "<p>ઇલેક્ટ્રિક કાર નવી સામગ્રીની બનતી નથી; એ જૂની યાદી છે જે battery ફરતે ગોઠવાઈ છે. 1500 કિલોમાં 675 કિલો હજી સ્ટીલ અને high strength steel છે - body અને safety cage માટે, 300 કિલો aluminium - bonnet, દરવાજા અને subframe, 225 કિલો pack, 180 કિલો polymer અને composite, 75 કિલો copper અને 45 કિલો કાચ. બદલાયું છે copper - એન્જિન વાળી કારના 23 કિલો સામે 75 કિલો, કારણ કે motor winding, busbar અને charger બધા ભારે current વહન કરે - અને pack, જે કારના 15 % અને નવી સામગ્રી સમસ્યાના 100 % છે.</p><div class=\"math\">the two numbers that drive every material decision on the car:\nmass: every 100 kg removed is about 0.4 kWh less per 100 km\nso 300 kg of aluminium instead of steel is 1.2 kWh per 100 km, about 8 %\nand the pack that stores 35 kWh weighs 225 kg: 155 Wh per kg of pack</div><table><tr><th>સામગ્રી</th><th>દળ, kg</th><th>કેમ છે</th><th>green મુદ્દો</th></tr><tr><td>સ્ટીલ અને AHSS</td><td>675</td><td>crash માળખું, pillar માં 1500 MPa</td><td>85 % recycled, છૂટું પડે સહેલું</td></tr><tr><td>aluminium</td><td>300</td><td>સ્ટીલ કરતાં અડધું દળ</td><td>170 MJ/kg, પણ scrap થી 8</td></tr><tr><td>battery pack</td><td>225</td><td>બોર્ડ પર 35 kWh ઊર્જા</td><td>Li, Ni અને Co recovery જરૂરી</td></tr><tr><td>polymer</td><td>180</td><td>bumper, trim, insulation</td><td>દુનિયાભરમાં 9 % recycled</td></tr><tr><td>copper</td><td>75</td><td>winding, busbar, 12 V અને HV wiring</td><td>ઊંચી કિંમત, સારી રીતે recycled</td></tr></table><p><b>કેમ સાચું છે.</b> lightweighting અને greening એક બિંદુ સુધી એક જ દિશામાં ખેંચે, પછી અલગ પડે: aluminium સેવામાં બળતણ બચાવે પણ તે બદલતા સ્ટીલ કરતાં સાત ગણી embodied energy માંગે, અને CFRP 500 MJ/kg પર વધુ બચાવે પણ અંતે ઓગાળવાનો રસ્તો નથી. તેથી green કાર સૌથી હલકી કાર નથી; એ કાર છે જેની બચાવેલી ઊર્જાએ તેની વધારાની ઊર્જા ચૂકવી નાખી છે.</p><p><b>સામાન્ય ભૂલ.</b> battery pack એ ખાલી કરીને ભંગાર કરી શકાય તેવી fuel ટાંકી નથી. એ 225 કિલો સામગ્રી છે જેનું બીજું જીવન stationary store તરીકે છે, અને પછી જ recycling સમસ્યા - તેથી end-of-life માર્ગ design માં લખો, disposal કરારમાં નહીં.</p><p><b>જવાબ ચકાસો.</b> ભાગ હલકો કરો ત્યારે બે પ્રશ્ન પૂછો: વધારાની ઊર્જા પાછી મળતાં કેટલા કિલોમીટર, અને અંતે આ સામગ્રીનું શું થાય. 12 કિલોનું સ્ટીલ subframe primary aluminium થી બદલો તો 200,000 કિલોમીટરમાં પણ payback થતું નથી; એ જ ભાગ 60 % recycled aluminium માં 180,000 કિલોમીટરમાં payback થાય, અને ફક્ત scrap ના aluminium માં પહેલા કિલોમીટરથી ઊર્જા બચે.</p>"}, "diagram": "u6_ev"}, {"h": {"en": "The battery: five materials, one cell", "gu": "Battery: પાંચ સામગ્રી, એક cell"}, "body": {"en": "<p>A lithium-ion cell is five materials stacked 150 micrometres thick: an aluminium foil current collector, a cathode of lithium metal oxide 60 micrometres thick, a separator with liquid electrolyte 20 micrometres, a graphite anode 50 micrometres, and a copper foil. Lithium does not sit in the electrodes as metal; it sits <b>inside</b> the crystal lattice of the cathode and the graphite - intercalation - and moves back and forth on every charge, which is why the cell ages by counting cycles rather than by corroding.</p><div class=\"math\">cell 3.7 V and 50 Ah:\nenergy = 3.7 x 50 = 185 Wh, and mass about 0.9 kg -> 205 Wh per kg of cell\n96 in series: 355 V and 50 Ah = 17.8 kWh; two strings in parallel: 35.5 kWh\nthe pack weighs 236 kg, so 150 Wh per kg of pack - 73 % of it is cells</div><table><tr><th>chemistry</th><th>Wh/kg cell</th><th>cycles</th><th>where it wins</th></tr><tr><td>lead-acid</td><td>35</td><td>400</td><td>cost, and it is 99 % recycled</td></tr><tr><td>LFP</td><td>140</td><td>3000</td><td>safety, life, no cobalt</td></tr><tr><td>NMC</td><td>220</td><td>1500</td><td>range in a small pack</td></tr><tr><td>LTO</td><td>70</td><td>20 000</td><td>fast charge, cold, buses</td></tr><tr><td>sodium-ion</td><td>140</td><td>3000</td><td>no lithium, cheap salt</td></tr></table><p><b>Why it is true.</b> the cathode is the expensive, the heavy and the contested part: nickel and cobalt cost money and come from few countries, so LFP - iron and phosphorus - has come back and now carries most of the world's new car cells. The anode, the separator and the electrolyte set the safety: a separator that shuts its pores at 130 C is a safety device, not a packing sheet.</p><p><b>Common mistake.</b> capacity fade is not 'the battery wearing out'. It is lithium lost to side reactions, cracks in the cathode particles and a growing film on the anode - and a cell kept at 45 C ages about twice as fast as one kept at 25 C, which is why the pack has a cooling plate and not just a box.</p><p><b>Check your answer.</b> read a pack spec as three numbers and not one: kWh (range), kg (the mass it costs) and cycles (the life). 35 kWh at 150 Wh/kg and 1500 cycles is a different product from 35 kWh at 120 Wh/kg and 3000 cycles, even though both say 35 kWh on the label.</p>", "gu": "<p>લિથિયમ-ion cell એ 150 માઇક્રોમીટર જાડાઈમાં ગોઠવાયેલી પાંચ સામગ્રી છે: aluminium foil current collector, 60 માઇક્રોમીટર જાડું lithium metal oxide નું cathode, 20 માઇક્રોમીટરનું separator અને liquid electrolyte, 50 માઇક્રોમીટરનું graphite anode, અને copper foil. લિથિયમ ધાતુ તરીકે electrode માં બેસતું નથી; તે cathode અને graphite ના crystal lattice <b>અંદર</b> બેસે - intercalation - અને દરેક charge પર આમતેમ ફરે, તેથી cell કાટ ખાઈને નહીં, cycle ગણીને વૃદ્ધ થાય.</p><div class=\"math\">cell 3.7 V and 50 Ah:\nenergy = 3.7 x 50 = 185 Wh, and mass about 0.9 kg -> 205 Wh per kg of cell\n96 in series: 355 V and 50 Ah = 17.8 kWh; two strings in parallel: 35.5 kWh\nthe pack weighs 236 kg, so 150 Wh per kg of pack - 73 % of it is cells</div><table><tr><th>chemistry</th><th>cell Wh/kg</th><th>cycle</th><th>ક્યાં જીતે</th></tr><tr><td>lead-acid</td><td>35</td><td>400</td><td>કિંમત, અને 99 % recycled</td></tr><tr><td>LFP</td><td>140</td><td>3000</td><td>સલામતી, આયુષ્ય, cobalt નહીં</td></tr><tr><td>NMC</td><td>220</td><td>1500</td><td>નાના pack માં વધુ અંતર</td></tr><tr><td>LTO</td><td>70</td><td>20 000</td><td>ઝડપી charge, ઠંડી, બસ</td></tr><tr><td>sodium-ion</td><td>140</td><td>3000</td><td>લિથિયમ નહીં, સસ્તું ક્ષાર</td></tr></table><p><b>કેમ સાચું છે.</b> cathode મોંઘો, ભારે અને વિવાદિત ભાગ છે: nickel અને cobalt પૈસા માગે અને થોડા દેશોમાંથી આવે, તેથી LFP - લોહ અને ફોસ્ફરસ - પાછું આવ્યું અને હવે દુનિયાના નવા car cell મોટા ભાગે તે જ છે. anode, separator અને electrolyte સલામતી નક્કી કરે: 130 C પર છિદ્ર બંધ કરતું separator સલામતીનું સાધન છે, પેકિંગ કાગળ નહીં.</p><p><b>સામાન્ય ભૂલ.</b> capacity ઘટવું એ 'battery ઘસાઈ જવું' નથી. એ આડી પ્રક્રિયાઓમાં ગુમાવેલું લિથિયમ, cathode કણોમાં તિરાડો અને anode પર વધતી ફિલ્મ છે - અને 45 C પર રખાયેલો cell 25 C કરતાં લગભગ બમણો ઝડપથી વૃદ્ધ થાય, તેથી pack માં ફક્ત ખોખું નહીં, cooling plate હોય.</p><p><b>જવાબ ચકાસો.</b> pack ની spec એક નહીં, ત્રણ આંકડા તરીકે વાંચો: kWh (અંતર), kg (જે દળ ખર્ચે) અને cycle (આયુષ્ય). 150 Wh/kg અને 1500 cycle વાળું 35 kWh, 120 Wh/kg અને 3000 cycle વાળા 35 kWh કરતાં જુદું ઉત્પાદન છે, જોકે બંને લેબલ પર 35 kWh લખે.</p>"}, "diagram": "u6_batt"}]}, {"title": {"en": "6.3 Green materials in renewable energy", "gu": "6.3 નવીનીકરણીય ઊર્જામાં green materials"}, "items": [{"h": {"en": "A solar panel is mostly not silicon", "gu": "સોલાર પેનલ મોટે ભાગે silicon નથી"}, "body": {"en": "<p>A photovoltaic module converts 20 % of the sunlight that reaches it, so four fifths of the area is there to hold, protect and cool the cells. On 2 m2 the cells make 400 W at 1000 W/m2 - the standard test condition - and after the inverter and the wiring a 0.8 performance ratio turns 4 peak sun hours into 1.28 kWh a day. The materials are therefore a system: 3.2 mm toughened glass, EVA encapsulant, the cells, a backsheet, an anodised aluminium frame and a junction box, and the frame and glass are 70 % of the module mass.</p><div class=\"math\">2 m2 module, 20 % cells, at Surat's 5 peak sun hours:\npeak power = 1000 x 2 x 0.20 = 400 W\ndaily energy = 0.4 kW x 5 h x 0.8 = 1.6 kWh, and 3 modules give 4.8 kWh\narea for a 4 kWh a day house = 4/(1 x 0.2 x 5 x 0.8) = 5 m2 of module</div><table><tr><th>layer</th><th>material</th><th>job</th><th>why this one</th></tr><tr><td>cover</td><td>3.2 mm low iron glass</td><td>hail, 25 years of UV</td><td>92 % transmission, and it does not yellow</td></tr><tr><td>encapsulant</td><td>EVA sheet</td><td>seals the cell from water</td><td>melts and cross-links at 150 C</td></tr><tr><td>cell</td><td>mono silicon, 20 - 22 %</td><td>the only part that works</td><td>150 micrometre wafer of pure silicon</td></tr><tr><td>frame</td><td>anodised aluminium</td><td>stiffness, mounting</td><td>extruded, so no machining</td></tr><tr><td>backsheet</td><td>PET and aluminium foil</td><td>electrical insulation</td><td>blocks water vapour at 0.1 g per m2 a day</td></tr></table><p><b>Why it is true.</b> efficiency is a material property and area is what a roof has, so the choice runs the other way from a machine: a house short of roof buys mono silicon at 22 % and pays for it, a solar farm with land buys 17 % thin film because the cost per kWh, not the cost per square metre, is what it sells. The glass, frame and backsheet are the same in both, which is why they are 70 % of the mass.</p><p><b>Common mistake.</b> a panel is not a material that can be left to the weather. The encapsulant is the life limiting part: a pinhole lets water in, the EVA hydrolyses to acetic acid, and the acid eats the silver fingers on the cell. A 25 year warranty is a statement about the laminate, not about the silicon.</p><p><b>Check your answer.</b> size a panel in three steps and never in one: energy needed per day, energy one module gives in a day at your peak sun hours, and the number of modules rounded up. Surat gives about 5 peak sun hours, not the 4 of a European roof.</p>", "gu": "<p>ફોટોવોલ્ટેઇક module પર પડતા સૂર્યપ્રકાશના 20 % ને વીજળીમાં ફેરવે, તેથી પાંચમાંથી ચાર ભાગ ક્ષેત્ર cell પકડવા, બચાવવા અને ઠંડા રાખવા માટે હોય. 2 m2 પર 1000 W/m2 - standard test condition - આગળ cell 400 W બનાવે, અને inverter તથી wiring પછી 0.8 performance ratio 4 peak sun hour ને દિવસના 1.28 kWh માં ફેરવે. તેથી સામગ્રી એક તંત્ર છે: 3.2 mm toughened કાચ, EVA encapsulant, cell, backsheet, anodised aluminium frame અને junction box, અને frame તથી કાચ module ના દળના 70 % છે.</p><div class=\"math\">2 m2 module, 20 % cells, at Surat's 5 peak sun hours:\npeak power = 1000 x 2 x 0.20 = 400 W\ndaily energy = 0.4 kW x 5 h x 0.8 = 1.6 kWh, and 3 modules give 4.8 kWh\narea for a 4 kWh a day house = 4/(1 x 0.2 x 5 x 0.8) = 5 m2 of module</div><table><tr><th>સ્તર</th><th>સામગ્રી</th><th>કામ</th><th>આ જ કેમ</th></tr><tr><td>cover</td><td>3.2 mm low iron કાચ</td><td>કરા, 25 વર્ષ UV</td><td>92 % transmission, પીળું નહીં પડે</td></tr><tr><td>encapsulant</td><td>EVA શીટ</td><td>cell ને પાણીથી સીલ કરે</td><td>150 C પર ઓગળી cross-link થાય</td></tr><tr><td>cell</td><td>mono silicon, 20 - 22 %</td><td>કામ કરતો એકમાત્ર ભાગ</td><td>શુદ્ધ silicon નું 150 માઇક્રોમીટર wafer</td></tr><tr><td>frame</td><td>anodised aluminium</td><td>કઠોરતા, mounting</td><td>extruded, તેથી machining નહીં</td></tr><tr><td>backsheet</td><td>PET અને aluminium foil</td><td>વિદ્યુત insulation</td><td>દિવસે 0.1 g પ્રતિ m2 બાષ્પ રોકે</td></tr></table><p><b>કેમ સાચું છે.</b> efficiency સામગ્રીનો ગુણધર્મ છે અને છત પાસે ક્ષેત્ર હોય છે, તેથી પસંદગી મશીનથી ઊલટી દિશામાં ચાલે: છત ઓછી હોય તે ઘર 22 % નું mono silicon ખરીદે અને ભરે, જમીન વાળું સોલાર ફાર્મ 17 % thin film ખરીદે કારણ કે તે પ્રતિ kWh કિંમત વેચે, પ્રતિ ચોરસ મીટર નહીં. કાચ, frame અને backsheet બંનેમાં એક જ છે, તેથી જ તે દળના 70 % છે.</p><p><b>સામાન્ય ભૂલ.</b> પેનલ એ હવામાન પર છોડી દેવાય તેવી સામગ્રી નથી. encapsulant જ આયુષ્ય મર્યાદિત કરે: નાનું છિદ્ર પાણી અંદર લે, EVA hydrolyse થઈ acetic acid બને, અને એસિડ cell પરની silver finger ખાઈ જાય. 25 વર્ષની warranty laminate વિશે છે, silicon વિશે નહીં.</p><p><b>જવાબ ચકાસો.</b> પેનલ ત્રણ પગલામાં માપો, એકમાં નહીં: દિવસની જરૂરી ઊર્જા, તમારા peak sun hour આગળ એક module દિવસમાં કેટલી આપે, અને module ની સંખ્યા ઉપર તરફ પૂર્ણાંકમાં. સુરત લગભગ 5 peak sun hour આપે, યુરોપની છતના 4 નહીં.</p>"}, "diagram": "u6_solar"}, {"h": {"en": "Wind and hydro: where the tonnes are", "gu": "પવન અને જળ: ટન ક્યાં છે"}, "body": {"en": "<p>A 3 MW wind turbine is 300 tonnes of material for 3 MW, and almost all of it is ordinary: 200 tonnes of steel in the tower, 20 tonnes of cast iron in the hub and the gearbox casing, and 60 tonnes of blade. The blade is the interesting part - glass fibre and epoxy for the shell, carbon fibre in the spar caps that carry the bending - because it must be 25 % lighter than steel for the same stiffness and must survive 10^8 load cycles in salt air. A direct-drive machine trades the gearbox for 2 tonnes of NdFeB magnets.</p><div class=\"math\">why the blade is a composite and the tower is not:\nspecific stiffness of steel = 200/7.85 = 25 GPa per g per cm3\nof glass epoxy = 40/1.9 = 21, of carbon epoxy = 120/1.6 = 75\nso a 80 m blade needs carbon in the spar, and a tower does not</div><table><tr><th>machine</th><th>the material that matters</th><th>the number</th><th>the failure it prevents</th></tr><tr><td>wind blade</td><td>glass and carbon epoxy</td><td>60 t for 3 MW, 10^8 cycles</td><td>fatigue at the root</td></tr><tr><td>wind tower</td><td>S355 steel plate</td><td>200 t, 120 m</td><td>buckling, and welded fatigue</td></tr><tr><td>direct drive</td><td>NdFeB magnets</td><td>2 t of magnet, 1.3 T</td><td>gearbox failure disappears</td></tr><tr><td>hydro runner</td><td>13Cr-4Ni martensitic stainless</td><td>5 - 15 t, 300 m head</td><td>cavitation and silt erosion</td></tr></table><p><b>Why it is true.</b> renewable energy is material-intensive in a way a power station is not: a coal plant concentrates 500 MW in one building, while a wind farm spreads the same rating over 20 km2 of blades and towers. The material bill per kWh is therefore dominated by the structure and not by the generator, and the recycling question arrives 25 years later as 60 tonnes of thermoset blade that cannot be melted.</p><p><b>Common mistake.</b> the greenest machine has the hardest waste. A thermoset blade cannot be re-melted, so most of the 60 tonnes ends in cement kilns as fuel and filler; a thermoplastic blade is now being made precisely so that it can be melted back into a new one.</p><p><b>Check your answer.</b> count the tonnes before praising the megawatt: a 3 MW turbine is 300 tonnes of material, so its 6 g CO2 per kWh is a statement about 25 years of service and not about the machine in the yard today.</p>", "gu": "<p>3 MW નું પવન turbine 3 MW માટે 300 ટન સામગ્રી છે, અને લગભગ બધું સામાન્ય: tower માં 200 ટન સ્ટીલ, hub અને gearbox casing માં 20 ટન cast iron, અને blade માં 60 ટન. blade રસપ્રદ ભાગ છે - shell માટે glass fibre અને epoxy, bending ઉપાડતા spar cap માં carbon fibre - કારણ કે એ જ કઠોરતા માટે સ્ટીલ કરતાં 25 % હલકું હોવું જોઈએ અને ખારા હવામાં 10^8 load cycle ઝીલવા પડે. direct-drive મશીન gearbox બદલે 2 ટન NdFeB magnet માંગે.</p><div class=\"math\">why the blade is a composite and the tower is not:\nspecific stiffness of steel = 200/7.85 = 25 GPa per g per cm3\nof glass epoxy = 40/1.9 = 21, of carbon epoxy = 120/1.6 = 75\nso a 80 m blade needs carbon in the spar, and a tower does not</div><table><tr><th>મશીન</th><th>મહત્ત્વની સામગ્રી</th><th>આંકડો</th><th>જે નિષ્ફળતા રોકે</th></tr><tr><td>પવન blade</td><td>glass અને carbon epoxy</td><td>3 MW માટે 60 ટન, 10^8 cycle</td><td>root પર fatigue</td></tr><tr><td>પવન tower</td><td>S355 સ્ટીલ પ્લેટ</td><td>200 ટન, 120 મીટર</td><td>buckling, અને weld fatigue</td></tr><tr><td>direct drive</td><td>NdFeB magnet</td><td>2 ટન magnet, 1.3 T</td><td>gearbox નિષ્ફળતા જતી રહે</td></tr><tr><td>જળ runner</td><td>13Cr-4Ni martensitic stainless</td><td>5 - 15 ટન, 300 મીટર head</td><td>cavitation અને કાંપ ઘસારો</td></tr></table><p><b>કેમ સાચું છે.</b> નવીનીકરણીય ઊર્જા એ રીતે સામગ્રી-ભારે છે જે રીતે વીજળી ઘર નથી: કોલસા પ્લાન્ટ 500 MW એક મકાનમાં એકઠા કરે, જ્યારે પવન ફાર્મ એ જ ક્ષમતા 20 km2 માં blade અને tower પર ફેલાવે. તેથી પ્રતિ kWh સામગ્રીનું બિલ મોટે ભાગે માળખાનું હોય, generator નું નહીં, અને recycling નો પ્રશ્ન 25 વર્ષ પછી 60 ટન thermoset blade તરીકે આવે જે ઓગળે નહીં.</p><p><b>સામાન્ય ભૂલ.</b> સૌથી green મશીનનો કચરો સૌથી અઘરો હોય. thermoset blade ફરી ઓગળે નહીં, તેથી 60 ટનમાંથી મોટો ભાગ સિમેન્ટ ભઠ્ઠીમાં બળતણ અને filler તરીકે જાય; thermoplastic blade હવે એટલા માટે જ બનાવાય છે કે તે ઓગળીને નવું બની શકે.</p><p><b>જવાબ ચકાસો.</b> megawatt ની પ્રશંસા પહેલાં ટન ગણો: 3 MW turbine 300 ટન સામગ્રી છે, તેથી તેનું 6 g CO2 પ્રતિ kWh 25 વર્ષની સેવા વિશે છે, આજે યાર્ડમાં ઊભેલા મશીન વિશે નહીં.</p>"}}]}, {"title": {"en": "6.4 Sustainable and renewable materials in mechanical industries", "gu": "6.4 યાંત્રિક ઉદ્યોગોમાં ટકાઉ અને નવીનીકરણીય સામગ્રી"}, "items": [{"h": {"en": "Bio-based and recycled materials on the shop floor", "gu": "કારખાનાના ફ્લોર પર bio-based અને recycled સામગ્રી"}, "body": {"en": "<p>Three families are already in production and not in a laboratory. <b>Natural fibre composites</b> - jute, hemp, flax in a PLA or epoxy matrix - give 40 to 60 MPa at a density of 1.4, so a third of the specific strength of glass fibre but at 4 to 10 MJ/kg instead of 30 to 50. <b>Biolubricants</b> from vegetable esters have a viscosity index of 180 to 220, far above the 95 of a mineral oil, and are 90 % biodegraded in 28 days. <b>Recycled metals</b> are the strongest case: secondary aluminium at 8 MJ/kg and electric steel at 10 MJ/kg are the same metals, not substitutes.</p><div class=\"math\">the comparison a designer actually makes, specific strength in kN m per kg:\njute-epoxy: 50 MPa/1.4 = 36;  GFRP: 300/1.9 = 158;  CFRP: 1500/1.6 = 938\nembodied energy: jute 8, glass fibre 40, carbon fibre 400 MJ/kg\nso a natural fibre panel is 5 times lighter in energy and 4 times heavier in mass</div><table><tr><th>material</th><th>strength</th><th>MJ/kg</th><th>where it is used</th></tr><tr><td>jute - PLA</td><td>40 MPa, E 4 GPa</td><td>8</td><td>door trim, parcel shelf</td></tr><tr><td>flax - epoxy</td><td>60 MPa, E 6 GPa</td><td>12</td><td>boat hull, sports panels</td></tr><tr><td>bamboo</td><td>150 MPa along fibre</td><td>3</td><td>scaffold boards, flooring</td></tr><tr><td>cork</td><td>1 MPa, but 0.5 g/cm3</td><td>4</td><td>gaskets, insulation, grips</td></tr><tr><td>recycled PP</td><td>25 MPa</td><td>30</td><td>battery trays, liners</td></tr><tr><td>biolubricant</td><td>VI 180 - 220</td><td>20</td><td>chainsaw, rail, hydraulic in forest</td></tr></table><p><b>Why it is true.</b> the natural fibre is weaker than glass, so it does not win on strength - it wins on energy, mass per kilogram of fibre and on what happens at the end: a jute-PLA panel can be composted, and a glass fibre panel cannot. Where the load is low and the volume is high - door trims, parcel shelves, packaging trays - that is enough.</p><p><b>Common mistake.</b> bio-based does not mean compostable and compostable does not mean strong. A PLA part softens at 60 C, so a dashboard moulding in PLA sags in a parked car in a Surat summer; the fibre is chosen for the load and the matrix for the temperature, separately.</p><p><b>Check your answer.</b> on a shop floor the greenest move is usually the cheapest one: segregate the swarf by alloy and sell it as a grade instead of as mixed scrap, use a water-based coolant with a tramp oil separator, and cut dry where the material allows. None of it needs a new material, only a new habit.</p>", "gu": "<p>ત્રણ કુટુંબ હવે ઉત્પાદનમાં છે, પ્રયોગશાળામાં નહીં. <b>કુદરતી રેસા composite</b> - jute, hemp, flax, PLA કે epoxy matrix માં - 1.4 ઘનતા પર 40 થી 60 MPa આપે, એટલે glass fibre ના specific strength નો ત્રીજો ભાગ, પણ 30 - 50 MJ/kg ને બદલે 4 - 10 MJ/kg પર. <b>Biolubricant</b> વનસ્પતિ ester માંથી બને છે, તેનો viscosity index 180 - 220, mineral oil ના 95 કરતાં ઘણો ઊંચો, અને 28 દિવસમાં 90 % biodegraded થાય. <b>Recycled ધાતુ</b> સૌથી મજબૂત કેસ છે: 8 MJ/kg નું secondary aluminium અને 10 MJ/kg નું electric સ્ટીલ એ જ ધાતુ છે, વિકલ્પ નહીં.</p><div class=\"math\">the comparison a designer actually makes, specific strength in kN m per kg:\njute-epoxy: 50 MPa/1.4 = 36;  GFRP: 300/1.9 = 158;  CFRP: 1500/1.6 = 938\nembodied energy: jute 8, glass fibre 40, carbon fibre 400 MJ/kg\nso a natural fibre panel is 5 times lighter in energy and 4 times heavier in mass</div><table><tr><th>સામગ્રી</th><th>મજબૂતાઈ</th><th>MJ/kg</th><th>ક્યાં વપરાય</th></tr><tr><td>jute - PLA</td><td>40 MPa, E 4 GPa</td><td>8</td><td>દરવાજાનો ટ્રિમ, parcel shelf</td></tr><tr><td>flax - epoxy</td><td>60 MPa, E 6 GPa</td><td>12</td><td>હોડીનું હલ, sports પેનલ</td></tr><tr><td>વાંસ</td><td>રેસા દિશામાં 150 MPa</td><td>3</td><td>scaffold બોર્ડ, ફ્લોરિંગ</td></tr><tr><td>કોર્ક</td><td>1 MPa, પણ 0.5 g/cm3</td><td>4</td><td>gasket, insulation, grip</td></tr><tr><td>recycled PP</td><td>25 MPa</td><td>30</td><td>battery tray, liner</td></tr><tr><td>biolubricant</td><td>VI 180 - 220</td><td>20</td><td>chainsaw, rail, જંગલમાં hydraulic</td></tr></table><p><b>કેમ સાચું છે.</b> કુદરતી રેસા કાચ કરતાં નબળું છે, તેથી મજબૂતાઈમાં જીતતું નથી - તે ઊર્જામાં, રેસાના કિલોગ્રામ દીઠ દળમાં અને અંતમાં શું થાય તેમાં જીતે: jute-PLA પેનલ compost થઈ શકે, glass fibre પેનલ નહીં. જ્યાં ભાર ઓછો અને જથ્થો મોટો હોય - દરવાજાનો ટ્રિમ, parcel shelf, પેકેજિંગ ટ્રે - ત્યાં એ પૂરતું છે.</p><p><b>સામાન્ય ભૂલ.</b> bio-based એ compostable નથી અને compostable એ મજબૂત નથી. PLA ભાગ 60 C પર નરમ પડે, તેથી PLA નું dashboard moulding સુરતના ઉનાળામાં પાર્ક કરેલી કારમાં નમી જાય; રેસા ભાર માટે અને matrix તાપમાન માટે અલગ અલગ પસંદ થાય.</p><p><b>જવાબ ચકાસો.</b> કારખાનામાં સૌથી green પગલું ઘણી વાર સૌથી સસ્તું હોય: swarf ને alloy પ્રમાણે અલગ કરીને mixed scrap ને બદલે grade તરીકે વેચો, tramp oil separator વાળું water-based coolant વાપરો, અને સામગ્રી પરવાનગી આપે ત્યાં dry cut કરો. એમાં નવી સામગ્રી નહીં, નવી ટેવ જોઈએ.</p>"}}]}, {"title": {"en": "6.5 Advanced materials for the automotive sector", "gu": "6.5 ઓટોમોબાઇલ ક્ષેત્ર માટે advanced materials"}, "items": [{"h": {"en": "Advanced materials: light, strong, magnetic, cool", "gu": "Advanced materials: હલકી, મજબૂત, ચુંબકીય, ઠંડી"}, "body": {"en": "<p>The advanced material in a modern car is chosen for a number, not for a name. <b>Lightweighting</b> is judged by specific strength: steel 57, aluminium and magnesium 115, GFRP 158, titanium 260, CFRP 938 kN m per kg - and a body-in-white that was 400 kg of steel can be 250 kg in aluminium and AHSS. <b>Magnets</b> are the second: an NdFeB traction motor gives 1.3 T and 250 to 400 kJ/m3 of energy product, which is why a 150 kW motor fits in a bag-sized housing. <b>Thermal materials</b> are the third: Al-SiC and graphite spread the heat of a 200 A inverter, and a 700 bar hydrogen tank is a CFRP winding with a polymer liner.</p><div class=\"math\">the three numbers behind an advanced material choice:\nspecific strength = UTS/density: steel 450/7.85 = 57, CFRP 1500/1.6 = 938\nmagnet energy product: NdFeB 250 - 400 kJ/m3 against ferrite 30 kJ/m3\n700 bar tank: 5 kg of hydrogen in 100 kg of CFRP, 5 % by mass</div><table><tr><th>part</th><th>advanced material</th><th>number</th><th>replaces</th></tr><tr><td>body structure</td><td>AHSS 1500 MPa, hot stamped</td><td>3 times the strength of mild steel</td><td>thicker mild steel</td></tr><tr><td>closures</td><td>aluminium 6061 sheet</td><td>2.7 g/cm3, 300 MPa</td><td>steel at 7.85</td></tr><tr><td>motor</td><td>NdFeB magnet, 1.3 T</td><td>150 kW in 40 kg</td><td>ferrite and a bigger frame</td></tr><tr><td>brake disc</td><td>Al-SiC composite</td><td>40 % lighter, 400 C stable</td><td>grey cast iron</td></tr><tr><td>hydrogen tank</td><td>CFRP over HDPE liner</td><td>700 bar, 5 kg of H2</td><td>steel at 300 bar</td></tr></table><p><b>Why it is true.</b> an advanced material is a trade of money against a number that the customer can feel: CFRP gives 938 kN m per kg and costs thirty times a steel sheet, so it goes where the number is worth the money - a Formula car, a 700 bar tank, a blade tip - and stays out of a hatchback floor. The engineering judgement is knowing which number the part is actually bought for.</p><p><b>Common mistake.</b> the lightest material is often the least green: CFRP carries 500 MJ/kg and no melting route, aluminium carries 170 and recycles at 8. Fitting the greenest available material is therefore a whole-life calculation, and on a car it usually ends at aluminium and AHSS, not at carbon.</p><p><b>Check your answer.</b> justify an advanced material with three sentences: the number it improves, the money it costs per kilogram, and what happens to the part at end of life. A material that cannot answer the third sentence is a prototype, not a production choice.</p>", "gu": "<p>આધુનિક કારમાં advanced material નામ માટે નહીં, આંકડા માટે પસંદ થાય. <b>Lightweighting</b> specific strength થી મપાય: સ્ટીલ 57, aluminium અને magnesium 115, GFRP 158, titanium 260, CFRP 938 kN m પ્રતિ kg - અને 400 કિલો સ્ટીલનું body-in-white aluminium અને AHSS માં 250 કિલો થઈ શકે. <b>Magnet</b> બીજું: NdFeB traction motor 1.3 T અને 250 - 400 kJ/m3 energy product આપે, તેથી 150 kW motor થેલી જેટલા housing માં આવે. <b>Thermal સામગ્રી</b> ત્રીજું: Al-SiC અને graphite 200 A inverter ની ગરમી ફેલાવે, અને 700 bar hydrogen ટાંકી polymer liner પર CFRP winding છે.</p><div class=\"math\">the three numbers behind an advanced material choice:\nspecific strength = UTS/density: steel 450/7.85 = 57, CFRP 1500/1.6 = 938\nmagnet energy product: NdFeB 250 - 400 kJ/m3 against ferrite 30 kJ/m3\n700 bar tank: 5 kg of hydrogen in 100 kg of CFRP, 5 % by mass</div><table><tr><th>ભાગ</th><th>advanced સામગ્રી</th><th>આંકડો</th><th>બદલે</th></tr><tr><td>body માળખું</td><td>AHSS 1500 MPa, hot stamped</td><td>mild સ્ટીલ કરતાં 3 ગણી મજબૂતાઈ</td><td>જાડું mild સ્ટીલ</td></tr><tr><td>closures</td><td>aluminium 6061 શીટ</td><td>2.7 g/cm3, 300 MPa</td><td>7.85 નું સ્ટીલ</td></tr><tr><td>motor</td><td>NdFeB magnet, 1.3 T</td><td>40 કિલોમાં 150 kW</td><td>ferrite અને મોટું frame</td></tr><tr><td>બ્રેક ડિસ્ક</td><td>Al-SiC composite</td><td>40 % હલકું, 400 C સ્થિર</td><td>grey cast iron</td></tr><tr><td>hydrogen ટાંકી</td><td>HDPE liner પર CFRP</td><td>700 bar, 5 કિલો H2</td><td>300 bar નું સ્ટીલ</td></tr></table><p><b>કેમ સાચું છે.</b> advanced સામગ્રી પૈસા અને ગ્રાહકને અનુભવાય તેવા આંકડા વચ્ચેનો સોદો છે: CFRP 938 kN m પ્રતિ kg આપે અને સ્ટીલ શીટ કરતાં ત્રીસ ગણું મોંઘું પડે, તેથી એ ત્યાં જાય જ્યાં આંકડો પૈસા જેટલો કીમતી હોય - Formula કાર, 700 bar ટાંકી, blade ની ટોચ - અને hatchback ના ફ્લોરથી દૂર રહે. એન્જિનિયરિંગની સમજ એ છે કે ભાગ ખરેખર કયા આંકડા માટે ખરીદાય છે.</p><p><b>સામાન્ય ભૂલ.</b> સૌથી હલકી સામગ્રી ઘણી વાર સૌથી ઓછી green હોય: CFRP 500 MJ/kg અને ઓગાળવાનો રસ્તો નહીં, aluminium 170 અને 8 પર recycle. તેથી ઉપલબ્ધ સૌથી green સામગ્રી લગાવવી એ આખા જીવનનું ગણિત છે, અને કાર પર એ સામાન્ય રીતે aluminium અને AHSS પર પૂરું થાય, carbon પર નહીં.</p><p><b>જવાબ ચકાસો.</b> advanced સામગ્રીને ત્રણ વાક્યથી ન્યાય આપો: જે આંકડો સુધારે, પ્રતિ કિલોગ્રામ કેટલો ખર્ચ, અને ભાગનું અંતે શું થાય. ત્રીજા વાક્યનો જવાબ ન આપી શકે તે સામગ્રી prototype છે, ઉત્પાદનની પસંદગી નહીં.</p>"}, "diagram": "u6_light"}]}, {"title": {"en": "6.6 Solved Numericals, Step by Step", "gu": "6.6 ઉકેલેલા દાખલા, પગલે પગલે"}, "items": [{"h": {"en": "A lightweight subframe, and whether it pays back", "gu": "હલકું subframe, અને તે payback થાય છે કે નહીં"}, "body": {"en": "<h4>Question (7 marks)</h4><p>A steel subframe of 12 kg is to be replaced by an aluminium one of equal stiffness, which needs 1.5 times the section area. Steel is 7.85 g/cm3 and 25 MJ/kg; aluminium is 2.70 g/cm3, 170 MJ/kg primary and 8 MJ/kg secondary. The car covers 200 000 km and saves 0.4 kWh per 100 km per 100 kg. Find the new mass, the mass saved, and the distance over which the extra embodied energy is paid back for primary aluminium, for 60 % recycled aluminium, and for scrap-only aluminium.</p><h4>Step 1 - the mass of the aluminium part</h4><div class=\"math\">m = 12 x (2.70/7.85) x 1.5 = 12 x 0.344 x 1.5\nm = 6.19 kg, so 5.81 kg saved, 48 %\nthe 1.5 is the price of stiffness: aluminium has a third of the modulus of steel</div><h4>Step 2 - the extra embodied energy, three routes</h4><div class=\"math\">primary: 6.19 x 170 = 1052 MJ - 12 x 25 = 300  ->  + 752 MJ\n60 % recycled: e = 0.6 x 8 + 0.4 x 170 = 72.8 MJ/kg -> 451 MJ  ->  + 151 MJ\nscrap only: 6.19 x 8 = 50 MJ  ->  - 250 MJ, lighter than the steel it replaces</div><h4>Step 3 - the payback distance</h4><div class=\"math\">saving = 0.4 x 0.0581 = 0.0232 kWh per 100 km = 0.000232 kWh/km = 0.836 kJ/km\nprimary: 752/0.000836 = 900 000 km - four times the life of the car\n60 % recycled: 151/0.000836 = 180 000 km - paid back inside the 200 000 km</div><div class=\"eq\">6.19 kg,  5.81 kg saved,  752 MJ extra,  payback 900 000 km primary / 180 000 km recycled</div><p>The answer is uncomfortable and useful: primary aluminium is the wrong way to build a green car. The same part is green only when the metal is secondary, and the specification that decides it is the recycled content written on the drawing - 60 % is enough to pay back inside the life, 100 % saves energy from the first kilometre. Lightweighting is not a material choice, it is a specification choice.</p><p><b>Check your answer.</b> watch the units, because this is the step that goes wrong: 0.0232 kWh per 100 km is 0.000232 kWh per km, which is 0.836 kJ/km - not 0.836 MJ/km. Slip one decimal and the payback changes from 900 000 km to 900 km.</p>", "gu": "<h4>પ્રશ્ન (7 marks)</h4><p>12 કિલોનું સ્ટીલ subframe એ જ કઠોરતા વાળા aluminium થી બદલવાનું છે, જેના માટે 1.5 ગણું section area જોઈએ. સ્ટીલ 7.85 g/cm3 અને 25 MJ/kg; aluminium 2.70 g/cm3, primary 170 MJ/kg અને secondary 8 MJ/kg. કાર 200,000 km ચાલે અને પ્રતિ 100 km પ્રતિ 100 kg 0.4 kWh બચાવે. નવું દળ, બચેલું દળ, અને primary aluminium, 60 % recycled aluminium તથી ફક્ત scrap ના aluminium માટે વધારાની embodied energy કેટલા અંતરે payback થાય તે શોધો.</p><h4>પગલું 1 - aluminium ભાગનું દળ</h4><div class=\"math\">m = 12 x (2.70/7.85) x 1.5 = 12 x 0.344 x 1.5\nm = 6.19 kg, so 5.81 kg saved, 48 %\nthe 1.5 is the price of stiffness: aluminium has a third of the modulus of steel</div><h4>પગલું 2 - વધારાની embodied energy, ત્રણ માર્ગ</h4><div class=\"math\">primary: 6.19 x 170 = 1052 MJ - 12 x 25 = 300  ->  + 752 MJ\n60 % recycled: e = 0.6 x 8 + 0.4 x 170 = 72.8 MJ/kg -> 451 MJ  ->  + 151 MJ\nscrap only: 6.19 x 8 = 50 MJ  ->  - 250 MJ, lighter than the steel it replaces</div><h4>પગલું 3 - payback અંતર</h4><div class=\"math\">saving = 0.4 x 0.0581 = 0.0232 kWh per 100 km = 0.000232 kWh/km = 0.836 kJ/km\nprimary: 752/0.000836 = 900 000 km - four times the life of the car\n60 % recycled: 151/0.000836 = 180 000 km - paid back inside the 200 000 km</div><div class=\"eq\">6.19 kg,  5.81 kg saved,  752 MJ extra,  payback 900 000 km primary / 180 000 km recycled</div><p>જવાબ અઘરો અને ઉપયોગી છે: primary aluminium green કાર બનાવવાનો ખોટો રસ્તો છે. એ જ ભાગ ત્યારે જ green છે જ્યારે ધાતુ secondary હોય, અને તે નક્કી કરતી specification ડ્રોઇંગ પર લખાયેલું recycled content છે - 60 % જીવનકાળમાં payback થવા પૂરતું છે, 100 % પહેલા કિલોમીટરથી ઊર્જા બચાવે. Lightweighting સામગ્રીની પસંદગી નહીં, specification ની પસંદગી છે.</p><p><b>જવાબ ચકાસો.</b> એકમ પર ધ્યાન રાખો, કારણ કે આ પગલું જ ખોટું પડે: 0.0232 kWh પ્રતિ 100 km એટલે 0.000232 kWh પ્રતિ km, એટલે 0.836 kJ/km - 0.836 MJ/km નહીં. એક દશાંશ ખસે તો payback 900,000 km થી 900 km થઈ જાય.</p>"}}, {"h": {"en": "Sizing a rooftop array for a house", "gu": "ઘર માટે છત પરની array નું માપ"}, "body": {"en": "<h4>Question (6 marks)</h4><p>A house in Surat needs 4 kWh a day. Choose a module of 2 m2 and 20 % cell efficiency, with a performance ratio of 0.8 and 5 peak sun hours a day. Find the peak power of one module, the energy it gives in a day, the number of modules, the roof area and the CO2 avoided per year at 0.71 kg per kWh.</p><h4>Step 1 - one module</h4><div class=\"math\">P = 1000 x 2 x 0.20 = 400 W peak\nE_day = 0.4 x 5 x 0.8 = 1.6 kWh\nso one module is 40 % of the daily need</div><h4>Step 2 - how many, and the area</h4><div class=\"math\">n = 4/1.6 = 2.5  ->  3 modules\narea = 3 x 2 = 6 m2, array 1.2 kW peak\nyearly output = 3 x 1.6 x 365 = 1752 kWh</div><h4>Step 3 - the carbon</h4><div class=\"math\">CO2 avoided = 1752 x 0.71 = 1244 kg a year\nover 25 years with 0.5 % a year degradation: about 29 tonnes\nagainst 25 x 1.9 GJ of module and frame, about 1300 kg of CO2 to build it</div><div class=\"eq\">400 W per module,  3 modules,  6 m2,  1244 kg of CO2 a year</div><p>Three modules is the answer for the arithmetic and four is the answer for the weather: a wet monsoon week, a dusty panel and a 20 % margin all argue for one more. The size of the array is set by the worst week, and the cost of the array by the average one.</p><p><b>Check your answer.</b> use the peak sun hours of the site, not of a textbook: Surat gives about 5, Jaisalmer 6, Kolkata 4.2, and London 2.8 - the same panel is a different power plant in each.</p>", "gu": "<h4>પ્રશ્ન (6 marks)</h4><p>સુરતમાં ઘરને દિવસના 4 kWh જોઈએ. 2 m2 અને 20 % cell efficiency વાળું module પસંદ કરો, performance ratio 0.8 અને દિવસના 5 peak sun hour. એક module ની peak power, દિવસમાં તે આપે તે ઊર્જા, module ની સંખ્યા, છતનું ક્ષેત્ર અને 0.71 kg પ્રતિ kWh આગળ વર્ષે ટળતું CO2 શોધો.</p><h4>પગલું 1 - એક module</h4><div class=\"math\">P = 1000 x 2 x 0.20 = 400 W peak\nE_day = 0.4 x 5 x 0.8 = 1.6 kWh\nso one module is 40 % of the daily need</div><h4>પગલું 2 - કેટલા, અને ક્ષેત્ર</h4><div class=\"math\">n = 4/1.6 = 2.5  ->  3 modules\narea = 3 x 2 = 6 m2, array 1.2 kW peak\nyearly output = 3 x 1.6 x 365 = 1752 kWh</div><h4>પગલું 3 - કાર્બન</h4><div class=\"math\">CO2 avoided = 1752 x 0.71 = 1244 kg a year\nover 25 years with 0.5 % a year degradation: about 29 tonnes\nagainst 25 x 1.9 GJ of module and frame, about 1300 kg of CO2 to build it</div><div class=\"eq\">400 W per module,  3 modules,  6 m2,  1244 kg of CO2 a year</div><p>ગણિતનો જવાબ ત્રણ module છે અને હવામાનનો જવાબ ચાર: ભીનું ચોમાસું, ધૂળવાળી પેનલ અને 20 % margin બધા એક વધુ માંગે. Array નું માપ સૌથી ખરાબ અઠવાડિયું નક્કી કરે, અને કિંમત સરેરાશ અઠવાડિયું.</p><p><b>જવાબ ચકાસો.</b> સાઇટના peak sun hour વાપરો, પુસ્તકના નહીં: સુરત લગભગ 5, જેસલમેર 6, કોલકાતા 4.2 અને લંડન 2.8 આપે - એ જ પેનલ દરેક જગ્યાએ જુદો પાવર પ્લાન્ટ છે.</p>"}}, {"h": {"en": "An electric car against a petrol car, in grams of CO2", "gu": "ઇલેક્ટ્રિક કાર સામે પેટ્રોલ કાર, CO2 ગ્રામમાં"}, "body": {"en": "<h4>Question (6 marks)</h4><p>An electric car uses 0.15 kWh per km and charges on the Indian grid at 0.71 kg CO2 per kWh. A petrol car in the same class uses 6 L per 100 km, and petrol releases 2.31 kg of CO2 per litre. Find the g/km of each, the annual difference at 15 000 km, and the g/km of the electric car charged from its own roof.</p><h4>Step 1 - the electric car</h4><div class=\"math\">CO2 = 0.15 x 0.71 = 0.1065 kg/km\n= 107 g/km on the Indian grid\non solar from the roof: about 0.04 kg/kWh, so 6 g/km</div><h4>Step 2 - the petrol car</h4><div class=\"math\">6 L/100 km = 0.06 L/km\nCO2 = 0.06 x 2.31 = 0.1386 kg/km\n= 139 g/km, and 30 % of it is the carbon the fuel carries</div><h4>Step 3 - the year, and the honest note</h4><div class=\"math\">electric: 107 x 15000 = 1605 kg     petrol: 139 x 15000 = 2085 kg\ndifference = 480 kg a year, and 12 tonnes over 25 000 km a year for 10 years\na 35 kWh pack takes about 5 tonnes of CO2 to make, so the pack is paid back in 10 years</div><div class=\"eq\">107 g/km electric,  139 g/km petrol,  480 kg a year saved</div><p>The electric car is cleaner on this grid and much cleaner on a solar roof, but the gap is not the factor of ten that the brochure implies: the pack carries 5 tonnes of CO2 before the first kilometre. On a coal-heavy grid the honest answer is 'about 25 % less', and on a rooftop it is 'almost nothing'.</p><p><b>Check your answer.</b> quote the grid factor you used, because it decides the answer: 0.71 kg/kWh in India, 0.4 in the UK, 0.05 in Norway. The same car is a different climate argument in each.</p>", "gu": "<h4>પ્રશ્ન (6 marks)</h4><p>ઇલેક્ટ્રિક કાર 0.15 kWh પ્રતિ km વાપરે છે અને ભારતીય grid પર 0.71 kg CO2 પ્રતિ kWh આગળ charge થાય. એ જ વર્ગની પેટ્રોલ કાર 6 L પ્રતિ 100 km વાપરે, અને પેટ્રોલ પ્રતિ લિટર 2.31 kg CO2 છોડે. દરેકના g/km, 15,000 km પર વાર્ષિક ફરક, અને પોતાની છત પરથી charge થતી ઇલેક્ટ્રિક કારના g/km શોધો.</p><h4>પગલું 1 - ઇલેક્ટ્રિક કાર</h4><div class=\"math\">CO2 = 0.15 x 0.71 = 0.1065 kg/km\n= 107 g/km on the Indian grid\non solar from the roof: about 0.04 kg/kWh, so 6 g/km</div><h4>પગલું 2 - પેટ્રોલ કાર</h4><div class=\"math\">6 L/100 km = 0.06 L/km\nCO2 = 0.06 x 2.31 = 0.1386 kg/km\n= 139 g/km, and 30 % of it is the carbon the fuel carries</div><h4>પગલું 3 - વર્ષ, અને પ્રામાણિક નોંધ</h4><div class=\"math\">electric: 107 x 15000 = 1605 kg     petrol: 139 x 15000 = 2085 kg\ndifference = 480 kg a year, and 12 tonnes over 25 000 km a year for 10 years\na 35 kWh pack takes about 5 tonnes of CO2 to make, so the pack is paid back in 10 years</div><div class=\"eq\">107 g/km electric,  139 g/km petrol,  480 kg a year saved</div><p>આ grid પર ઇલેક્ટ્રિક કાર સ્વચ્છ છે અને સોલાર છત પર ઘણી વધુ સ્વચ્છ, પણ ફરક બ્રોશર કહે તેવો દસ ગણો નથી: પહેલા કિલોમીટર પહેલાં pack 5 ટન CO2 ઉપાડી લે છે. કોલસા-ભારે grid પર પ્રામાણિક જવાબ 'લગભગ 25 % ઓછું' છે, અને છત પર 'લગભગ કંઈ નહીં'.</p><p><b>જવાબ ચકાસો.</b> વાપરેલો grid factor કહો, કારણ કે તે જવાબ નક્કી કરે: ભારતમાં 0.71 kg/kWh, UK માં 0.4, નોર્વેમાં 0.05. એ જ કાર દરેક જગ્યાએ જુદી climate દલીલ છે.</p>"}}, {"h": {"en": "The energy and mass of a battery pack", "gu": "Battery pack ની ઊર્જા અને દળ"}, "body": {"en": "<h4>Question (5 marks)</h4><p>A pack is built from 192 cells of 3.7 V and 50 Ah, arranged 96 in series and 2 in parallel. Each cell is 0.9 kg and the finished pack is 236 kg. Find the pack voltage, capacity, energy, the specific energy of the cells and of the pack, and the range at 0.15 kWh per km.</p><h4>Step 1 - voltage and capacity</h4><div class=\"math\">V = 96 x 3.7 = 355 V\nAh = 2 x 50 = 100 Ah\nnumber of cells = 96 x 2 = 192</div><h4>Step 2 - the energy</h4><div class=\"math\">E = 355 x 100 = 35 500 Wh = 35.5 kWh\ncells: 192 x 0.9 = 172.8 kg, so 35 500/172.8 = 205 Wh per kg of cell\npack: 35 500/236 = 150 Wh per kg, so 73 % of the pack is cells</div><h4>Step 3 - the range</h4><div class=\"math\">range = 35.5/0.15 = 237 km\nof the 0.15 kWh/km, the pack's own 236 kg costs about 0.001 kWh/km per kg x 2.36... = 0.05\nso a 10 % lighter pack would add 10 km, which is why cell chemistry matters</div><div class=\"eq\">355 V,  100 Ah,  35.5 kWh,  205 Wh/kg cell,  150 Wh/kg pack,  237 km</div><p>The gap between 205 and 150 is the casing, the cooling plate, the busbars and the BMS - 63 kg of material that stores nothing. That is where a pack designer earns a living: not in the cell, which is bought, but in the 27 % of the mass that carries it.</p><p><b>Check your answer.</b> keep Wh and Ah apart: a 355 V pack at 100 Ah is 35.5 kWh, and quoting 100 Ah alone says nothing about the energy. The unit that a customer buys is kWh, and the unit that a welder sizes a cable for is A.</p>", "gu": "<h4>પ્રશ્ન (5 marks)</h4><p>Pack 3.7 V અને 50 Ah ના 192 cell થી બને છે, 96 series અને 2 parallel માં. દરેક cell 0.9 કિલો અને તૈયાર pack 236 કિલો. Pack નો voltage, capacity, ઊર્જા, cell અને pack ની specific energy, અને 0.15 kWh પ્રતિ km આગળ અંતર શોધો.</p><h4>પગલું 1 - voltage અને capacity</h4><div class=\"math\">V = 96 x 3.7 = 355 V\nAh = 2 x 50 = 100 Ah\nnumber of cells = 96 x 2 = 192</div><h4>પગલું 2 - ઊર્જા</h4><div class=\"math\">E = 355 x 100 = 35 500 Wh = 35.5 kWh\ncells: 192 x 0.9 = 172.8 kg, so 35 500/172.8 = 205 Wh per kg of cell\npack: 35 500/236 = 150 Wh per kg, so 73 % of the pack is cells</div><h4>પગલું 3 - અંતર</h4><div class=\"math\">range = 35.5/0.15 = 237 km\nof the 0.15 kWh/km, the pack's own 236 kg costs about 0.001 kWh/km per kg x 2.36... = 0.05\nso a 10 % lighter pack would add 10 km, which is why cell chemistry matters</div><div class=\"eq\">355 V,  100 Ah,  35.5 kWh,  205 Wh/kg cell,  150 Wh/kg pack,  237 km</div><p>205 અને 150 વચ્ચેનો ફરક casing, cooling plate, busbar અને BMS છે - 63 કિલો એવી સામગ્રી જે કંઈ સંગ્રહતી નથી. ત્યાં જ pack designerની કમાણી છે: cell માં નહીં, જે ખરીદાય છે, પણ એને ઉપાડતા દળના 27 % માં.</p><p><b>જવાબ ચકાસો.</b> Wh અને Ah અલગ રાખો: 355 V નું 100 Ah pack 35.5 kWh છે, અને ફક્ત 100 Ah કહેવાથી ઊર્જા વિશે કંઈ ન કહેવાય. ગ્રાહક kWh ખરીદે, અને welder કેબલ માપે A પર.</p>"}}, {"h": {"en": "Embodied energy and carbon of one aluminium part", "gu": "એક aluminium ભાગની embodied energy અને કાર્બન"}, "body": {"en": "<h4>Question (5 marks)</h4><p>A bracket is 20 kg of aluminium. Primary aluminium is 170 MJ/kg and 11.5 kg CO2 per kg; secondary is 8 MJ/kg and 0.5 kg CO2 per kg; 4 kg of bauxite are mined per kg of primary metal. Find the embodied energy, the CO2 and the bauxite for both routes, and the saving.</p><h4>Step 1 - the primary route</h4><div class=\"math\">EE = 20 x 170 = 3400 MJ = 0.94 MWh\nCO2 = 20 x 11.5 = 230 kg\nbauxite = 20 x 4 = 80 kg of ore, and 8 kg of alumina</div><h4>Step 2 - the secondary route</h4><div class=\"math\">EE = 20 x 8 = 160 MJ\nCO2 = 20 x 0.5 = 10 kg\nno bauxite, no alumina, no red mud</div><h4>Step 3 - the saving</h4><div class=\"math\">energy saved = 3400 - 160 = 3240 MJ = 0.9 MWh, 95 %\nCO2 saved = 230 - 10 = 220 kg on one bracket\na fleet of 10 000 brackets: 2200 tonnes of CO2, 8 000 tonnes of ore</div><div class=\"eq\">3400 MJ and 230 kg CO2 new,  160 MJ and 10 kg from scrap,  95 % saved</div><p>This is the arithmetic behind the recycled-content target in every automotive contract: the metal does not change, only the route it took to the press shop. A part with 60 % recycled content is 86 % of the way to the secondary figure, which is why the percentage is written on the drawing.</p><p><b>Check your answer.</b> do not add the transport to the bauxite figure and leave out the alumina: a full account is ore, alumina, smelt, cast, roll, truck. The 170 MJ/kg already contains all of them, which is why it is used as a single number.</p>", "gu": "<h4>પ્રશ્ન (5 marks)</h4><p>એક bracket 20 કિલો aluminium નું છે. Primary aluminium 170 MJ/kg અને પ્રતિ કિલો 11.5 kg CO2; secondary 8 MJ/kg અને 0.5 kg CO2; પ્રતિ કિલો primary ધાતુ માટે 4 કિલો bauxite ખોદાય. બંને માર્ગની embodied energy, CO2 અને bauxite, અને બચત શોધો.</p><h4>પગલું 1 - primary માર્ગ</h4><div class=\"math\">EE = 20 x 170 = 3400 MJ = 0.94 MWh\nCO2 = 20 x 11.5 = 230 kg\nbauxite = 20 x 4 = 80 kg of ore, and 8 kg of alumina</div><h4>પગલું 2 - secondary માર્ગ</h4><div class=\"math\">EE = 20 x 8 = 160 MJ\nCO2 = 20 x 0.5 = 10 kg\nno bauxite, no alumina, no red mud</div><h4>પગલું 3 - બચત</h4><div class=\"math\">energy saved = 3400 - 160 = 3240 MJ = 0.9 MWh, 95 %\nCO2 saved = 230 - 10 = 220 kg on one bracket\na fleet of 10 000 brackets: 2200 tonnes of CO2, 8 000 tonnes of ore</div><div class=\"eq\">3400 MJ and 230 kg CO2 new,  160 MJ and 10 kg from scrap,  95 % saved</div><p>દરેક ઓટોમોબાઇલ કરારમાં recycled-content લક્ષ્ય પાછળ આ ગણિત છે: ધાતુ બદલાતી નથી, ફક્ત press shop સુધીનો તેનો રસ્તો બદલાય. 60 % recycled content વાળો ભાગ secondary આંકડાના 86 % સુધી પહોંચે, તેથી જ ટકાવારી ડ્રોઇંગ પર લખાય.</p><p><b>જવાબ ચકાસો.</b> bauxite ના આંકડામાં વહન ઉમેરીને alumina ભૂલશો નહીં: પૂરો હિસાબ ore, alumina, smelt, cast, roll, ટ્રક છે. 170 MJ/kg એ બધું સમાવે છે, તેથી જ તે એક આંકડા તરીકે વપરાય.</p>"}}, {"h": {"en": "Scrap recovery in a press shop", "gu": "પ્રેસ શોપમાં ભંગાર વસૂલાત"}, "body": {"en": "<h4>Question (5 marks)</h4><p>A press shop runs 2000 hours a year at 500 kg of steel parts an hour. Scrap is 18 % of the sheet consumed, 92 % of the scrap is recovered as a clean grade, and the grade sells at Rs 32 a kilogram. Find the annual scrap, the mass recovered, its value, and what the recovery does to the material cost of a 2.5 kg part that sells for Rs 180.</p><h4>Step 1 - the output and the scrap</h4><div class=\"math\">output = 500 x 2000 = 1 000 000 kg = 1000 t of parts\nsheet consumed = 1000/0.82 = 1220 t\nscrap = 1220 - 1000 = 220 t, which is 18 % of the sheet</div><h4>Step 2 - recovered and its value</h4><div class=\"math\">recovered = 220 x 0.92 = 202.4 t\nvalue = 202 400 x 32 = Rs 64.8 lakh a year\nunrecovered = 17.6 t, which is Rs 5.6 lakh lost as mixed swarf</div><h4>Step 3 - what it means per part</h4><div class=\"math\">sheet per part = 2.5/0.82 = 3.05 kg at Rs 55/kg = Rs 168\nscrap credit = (3.05 - 2.5) x 32 x 0.92 = Rs 16.2 per part\nmaterial cost = 168 - 16 = Rs 152, so the scrap account is 9 % of the price</div><div class=\"eq\">220 t of scrap,  202 t recovered,  Rs 64.8 lakh a year,  Rs 16 per part</div><p>The segregation is the whole trick: 220 tonnes sold as a clean grade is Rs 64.8 lakh, the same 220 tonnes sold as mixed swarf is about half of that and a reprocessing problem for somebody else. On a shop floor, a labelled bin is a green measure that pays for itself in a month.</p><p><b>Check your answer.</b> count the sheet consumed, not the parts sold: 18 % scrap means 1000 t of parts needs 1220 t of sheet, and using 1000 t in the sum understates both the scrap and the credit.</p>", "gu": "<h4>પ્રશ્ન (5 marks)</h4><p>પ્રેસ શોપ વર્ષે 2000 કલાક ચાલે, કલાકે 500 કિલો સ્ટીલ ભાગ. વપરાયેલી શીટના 18 % ભંગાર થાય, તેમાંથી 92 % સાફ grade તરીકે વસૂલાય, અને grade કિલોએ રૂ 32 વેચાય. વાર્ષિક ભંગાર, વસૂલાયેલું દળ, તેની કિંમત, અને રૂ 180 માં વેચાતા 2.5 કિલોના ભાગની સામગ્રી કિંમત પર recovery ની અસર શોધો.</p><h4>પગલું 1 - ઉત્પાદન અને ભંગાર</h4><div class=\"math\">output = 500 x 2000 = 1 000 000 kg = 1000 t of parts\nsheet consumed = 1000/0.82 = 1220 t\nscrap = 1220 - 1000 = 220 t, which is 18 % of the sheet</div><h4>પગલું 2 - વસૂલાત અને કિંમત</h4><div class=\"math\">recovered = 220 x 0.92 = 202.4 t\nvalue = 202 400 x 32 = Rs 64.8 lakh a year\nunrecovered = 17.6 t, which is Rs 5.6 lakh lost as mixed swarf</div><h4>પગલું 3 - પ્રતિ ભાગ શું અર્થ</h4><div class=\"math\">sheet per part = 2.5/0.82 = 3.05 kg at Rs 55/kg = Rs 168\nscrap credit = (3.05 - 2.5) x 32 x 0.92 = Rs 16.2 per part\nmaterial cost = 168 - 16 = Rs 152, so the scrap account is 9 % of the price</div><div class=\"eq\">220 t of scrap,  202 t recovered,  Rs 64.8 lakh a year,  Rs 16 per part</div><p>અલગ કરવું એ જ આખી યુક્તિ છે: 220 ટન સાફ grade તરીકે રૂ 64.8 લાખ, એ જ 220 ટન mixed swarf તરીકે લગભગ અડધું અને બીજા કોઈની reprocessing સમસ્યા. કારખાનામાં લેબલવાળી ડબ્બી એ green પગલું છે જે એક મહિનામાં પોતાનો ખર્ચ કાઢી લે.</p><p><b>જવાબ ચકાસો.</b> વેચાયેલા ભાગ નહીં, વપરાયેલી શીટ ગણો: 18 % ભંગાર એટલે 1000 ટન ભાગ માટે 1220 ટન શીટ, અને ગણતરીમાં 1000 ટન વાપરવાથી ભંગાર અને credit બંને ઓછા આવે.</p>"}}]}], "diagrams": [{"id": "u6_cycle", "title": {"en": "The life cycle of a material", "gu": "સામગ્રીનું જીવનચક્ર"}, "file": "diagrams/u6_cycle.svg", "caption": {"en": "Raw material, manufacture, use and end of life, with recycling closing the loop and landfill leaving it open - the difference between cradle to grave and cradle to cradle.", "gu": "કાચો માલ, ઉત્પાદન, વપરાશ અને જીવનનો અંત, જેમાં recycling ચક્ર બંધ કરે અને landfill તેને ખુલ્લું રાખે - cradle to grave અને cradle to cradle વચ્ચેનો ફરક."}}, {"id": "u6_energy", "title": {"en": "Embodied energy and recycling", "gu": "Embodied energy અને recycling"}, "file": "diagrams/u6_energy.svg", "caption": {"en": "One kilogram of aluminium carries 170 MJ of primary energy and one kilogram of concrete carries one; recycling the aluminium saves 95 % of that energy, which is why scrap is a raw material.", "gu": "એક કિલોગ્રામ aluminium 170 MJ પ્રાથમિક ઊર્જા ઉપાડે અને એક કિલોગ્રામ concrete એક; એ aluminium recycle કરવાથી 95 % ઊર્જા બચે, તેથી ભંગાર કાચો માલ છે."}}, {"id": "u6_ev", "title": {"en": "Materials in an electric car", "gu": "ઇલેક્ટ્રિક કારમાં સામગ્રી"}, "file": "diagrams/u6_ev.svg", "caption": {"en": "A 1500 kg electric car is 675 kg of steel, 300 kg of aluminium and 225 kg of battery, and the battery is the part that did not exist in the material list before.", "gu": "1500 કિલોની ઇલેક્ટ્રિક કાર 675 કિલો સ્ટીલ, 300 કિલો aluminium અને 225 કિલો battery છે, અને battery એ ભાગ છે જે સામગ્રીની યાદીમાં પહેલાં નહોતો."}}, {"id": "u6_batt", "title": {"en": "The layers of a lithium-ion cell", "gu": "લિથિયમ-ion cell ના સ્તર"}, "file": "diagrams/u6_batt.svg", "caption": {"en": "Current collector, cathode, separator and electrolyte, anode, current collector: five materials stacked 150 micrometres thick, and one cell of 3.7 V and 185 Wh.", "gu": "Current collector, cathode, separator અને electrolyte, anode, current collector: 150 માઇક્રોમીટર જાડાઈમાં પાંચ સામગ્રી, અને એક cell 3.7 V અને 185 Wh."}}, {"id": "u6_solar", "title": {"en": "From sunlight to kWh", "gu": "સૂર્યપ્રકાશથી kWh સુધી"}, "file": "diagrams/u6_solar.svg", "caption": {"en": "1000 W/m2 arrives, 200 W/m2 leaves the cells as electricity, and a 2 m2 panel on four peak sun hours delivers 1.28 kWh a day after the inverter.", "gu": "1000 W/m2 આવે, cell માંથી 200 W/m2 વીજળી તરીકે નીકળે, અને 2 m2 પેનલ ચાર peak sun hour પર inverter પછી દિવસના 1.28 kWh આપે."}}, {"id": "u6_light", "title": {"en": "Specific strength for lightweighting", "gu": "Lightweighting માટે specific strength"}, "file": "diagrams/u6_light.svg", "caption": {"en": "Steel 57 against CFRP 938 kN m per kg: specific strength is what decides a moving part, and stiffness is what usually decides a panel.", "gu": "સ્ટીલ 57 સામે CFRP 938 kN m પ્રતિ kg: ચાલતો ભાગ specific strength નક્કી કરે, અને પેનલ સામાન્ય રીતે stiffness નક્કી કરે."}}], "equations": [{"title": {"en": "Green material accounting", "gu": "Green સામગ્રીનો હિસાબ"}, "items": [{"name": {"en": "Embodied energy of a part", "gu": "ભાગની embodied energy"}, "f": "EE = sum(m_i x e_i)", "terms": {"en": "Mass of each material in kilograms times its MJ per kilogram. A 20 kg aluminium part is 3400 MJ; the same part in steel is 500 MJ.", "gu": "દરેક સામગ્રીનું દળ કિલોગ્રામમાં ગુણ્યું તેના MJ પ્રતિ કિલોગ્રામ સાથે. 20 કિલોનો aluminium ભાગ 3400 MJ; એ જ ભાગ સ્ટીલમાં 500 MJ."}}, {"name": {"en": "Energy payback distance", "gu": "Energy payback અંતર"}, "f": "d = dEE/(saving per km)", "terms": {"en": "The extra embodied energy of the lighter part divided by the energy it saves per kilometre: 752 MJ against 0.836 MJ/km is 900 km.", "gu": "હલકા ભાગની વધારાની embodied energy ભાગ્યા પ્રતિ કિલોમીટરની બચત: 752 MJ સામે 0.836 MJ/km એટલે 900 કિલોમીટર."}}, {"name": {"en": "Recycling saving", "gu": "Recycling બચત"}, "f": "saving % = (1 - e_rec/e_new) x 100", "terms": {"en": "Aluminium 8 against 170 saves 95 %, steel 10 against 25 saves 60 %, glass 12 against 15 saves 20 %.", "gu": "aluminium 170 સામે 8 એટલે 95 % બચત, સ્ટીલ 25 સામે 10 એટલે 60 %, કાચ 15 સામે 12 એટલે 20 %."}}, {"name": {"en": "Specific strength and stiffness", "gu": "Specific strength અને stiffness"}, "f": "specific strength = sigma/rho,  specific stiffness = E/rho", "terms": {"en": "Steel 57, aluminium 115, GFRP 158, CFRP 938 kN m per kg. For a panel the stiffness version is nearer the truth.", "gu": "સ્ટીલ 57, aluminium 115, GFRP 158, CFRP 938 kN m પ્રતિ kg. પેનલ માટે stiffness વાળું સૂત્ર સત્યની નજીક છે."}}]}, {"title": {"en": "Solar photovoltaics", "gu": "સોલાર ફોટોવોલ્ટેઇક"}, "items": [{"name": {"en": "Peak power of a module", "gu": "Module ની peak power"}, "f": "P = G A eta", "terms": {"en": "At G 1000 W/m2, 2 m2 and 20 % the answer is 400 W - the number on the label.", "gu": "G 1000 W/m2, 2 m2 અને 20 % પર જવાબ 400 W - લેબલ પરનો આંકડો."}}, {"name": {"en": "Daily energy", "gu": "દૈનિક ઊર્જા"}, "f": "E_day = P x PSH x PR", "terms": {"en": "Peak sun hours and a performance ratio of 0.8 for dust, heat and the inverter: 0.4 x 5 x 0.8 = 1.6 kWh in Surat.", "gu": "Peak sun hour અને ધૂળ, ગરમી તથી inverter માટે 0.8 performance ratio: સુરતમાં 0.4 x 5 x 0.8 = 1.6 kWh."}}, {"name": {"en": "Area for a load", "gu": "ભાર માટે ક્ષેત્ર"}, "f": "A = E/(G eta PSH PR)", "terms": {"en": "4 kWh a day needs 5 m2 of 20 % module, and the roof, not the module, is usually the limit.", "gu": "દિવસના 4 kWh માટે 20 % module ના 5 m2 જોઈએ, અને મર્યાદા સામાન્ય રીતે છત હોય, module નહીં."}}]}, {"title": {"en": "Battery and electric vehicle", "gu": "Battery અને ઇલેક્ટ્રિક વાહન"}, "items": [{"name": {"en": "Cell and pack energy", "gu": "Cell અને pack ની ઊર્જા"}, "f": "E = V x Ah   (pack: V = n_s V_cell, Ah = n_p Ah_cell)", "terms": {"en": "96 cells of 3.7 V and 50 Ah in series gives 355 V and 17.8 kWh; two strings in parallel give 35.5 kWh.", "gu": "3.7 V અને 50 Ah ના 96 cell series માં 355 V અને 17.8 kWh આપે; બે string parallel માં 35.5 kWh."}}, {"name": {"en": "Specific energy", "gu": "Specific energy"}, "f": "e = E/m", "terms": {"en": "Cells 205 Wh/kg, the pack 150 Wh/kg, and the difference is the casing, the cooling plate and the busbars.", "gu": "cell 205 Wh/kg, pack 150 Wh/kg, અને ફરક casing, cooling plate અને busbar નો છે."}}, {"name": {"en": "Range", "gu": "અંતર"}, "f": "range = E/consumption", "terms": {"en": "35.5 kWh at 0.15 kWh per km is 237 km - and 0.05 kWh per km of that is the mass of the pack itself.", "gu": "0.15 kWh પ્રતિ km આગળ 35.5 kWh એટલે 237 km - અને એમાં 0.05 kWh પ્રતિ km pack ના પોતાના દળનો છે."}}, {"name": {"en": "CO2 per kilometre", "gu": "પ્રતિ કિલોમીટર CO2"}, "f": "g/km = EF x consumption", "terms": {"en": "0.71 kg CO2 per kWh on the Indian grid at 0.15 kWh/km is 107 g/km, against 139 g/km for a petrol car at 6 L/100 km.", "gu": "ભારતીય grid પર 0.71 kg CO2 પ્રતિ kWh, 0.15 kWh/km આગળ 107 g/km, જ્યારે 6 L/100 km વાળી પેટ્રોલ કાર 139 g/km."}}]}, {"title": {"en": "Recycling and life", "gu": "Recycling અને આયુષ્ય"}, "items": [{"name": {"en": "Scrap recovered", "gu": "વસૂલ થતો ભંગાર"}, "f": "m_rec = m_total x scrap % x recovery %", "terms": {"en": "1000 t of pressings at 18 % scrap and 92 % recovery gives 165.6 t back to the furnace.", "gu": "18 % scrap અને 92 % recovery આગળ 1000 ટન pressings પૈકી 165.6 ટન ભઠ્ઠીમાં પાછા."}}, {"name": {"en": "Value of the scrap", "gu": "ભંગારની કિંમત"}, "f": "value = m_rec x rate", "terms": {"en": "165.6 t at Rs 32 per kg is Rs 53 lakh a year - a material account, not a waste account.", "gu": "165.6 ટન, કિલોએ રૂ 32 એટલે વર્ષે રૂ 53 લાખ - એ કચરાનું નહીં, સામગ્રીનું ખાતું છે."}}, {"name": {"en": "CO2 avoided by recycling", "gu": "Recycling થી ટળતું CO2"}, "f": "dCO2 = m x (c_new - c_rec)", "terms": {"en": "20 kg of aluminium: 230 kg of CO2 new against 10 kg from scrap, so 220 kg avoided on one part.", "gu": "20 કિલો aluminium: નવું 230 કિલો CO2 સામે scrap થી 10 કિલો, એટલે એક ભાગ પર 220 કિલો ટળે."}}]}], "viva": [{"title": {"en": "Green materials", "gu": "Green materials"}, "items": [{"q": {"en": "What makes a material green?", "gu": "સામગ્રી green ક્યારે કહેવાય?"}, "a": {"en": "Four counts, and none of them alone: renewable, recyclable, low impact per kilogram delivered, and durable. A material that is grown but thrown away, or recycled but weak, fails the test.", "gu": "ચાર ગણતરી, અને એકલી કોઈ નહીં: renewable, recyclable, પ્રતિ કિલોગ્રામ ઓછી અસર, અને ટકાઉ. ઊગે પણ ફેંકાય તેવી, કે recycle થાય પણ નબળી હોય તેવી સામગ્રી કસોટીમાં નિષ્ફળ જાય."}}, {"q": {"en": "What is embodied energy, and why is it quoted per kilogram?", "gu": "Embodied energy શું, અને પ્રતિ કિલોગ્રામ કેમ?"}, "a": {"en": "The primary energy needed to deliver a kilogram of the material ready to use, from the mine to the loading bay. Per kilogram is what makes two materials comparable, because the part's mass then multiplies it into the bill.", "gu": "ખાણથી લોડિંગ બે થી વાપરવા તૈયાર એક કિલોગ્રામ પહોંચાડવા જોઈતી પ્રાથમિક ઊર્જા. પ્રતિ કિલોગ્રામ હોવાથી બે સામગ્રી સરખાવી શકાય, કારણ કે ભાગનું દળ ગુણાઈને બિલ બનાવે."}}, {"q": {"en": "Why does recycling aluminium save so much more than recycling glass?", "gu": "Recycling થી aluminium માં કાચ કરતાં ઘણી વધુ બચત કેમ?"}, "a": {"en": "Because smelting aluminium from alumina is an electrolytic process with a very high energy input, and re-melting the metal needs only 5 % of it. Glass is already made by melting, so its second melt saves only the 20 % that the raw materials and the reaction cost.", "gu": "કારણ કે alumina થી aluminium smelt કરવું ખૂબ ઊંચી ઊર્જા માંગતી electrolytic પ્રક્રિયા છે, અને ધાતુ ફરી ઓગાળવા તેના ફક્ત 5 % જોઈએ. કાચ તો ઓગાળીને જ બનેલો હોય, તેથી બીજા ઓગળવામાં ફક્ત કાચો માલ અને પ્રક્રિયાના 20 % બચે."}}]}, {"title": {"en": "Vehicles and batteries", "gu": "વાહન અને battery"}, "items": [{"q": {"en": "Is an electric car made of different materials from a petrol car?", "gu": "ઇલેક્ટ્રિક કાર પેટ્રોલ કાર કરતાં જુદી સામગ્રીની બને છે?"}, "a": {"en": "Mostly not: steel, aluminium and polymer are the same list. What changes is the copper, three times as much, and the 225 kg battery that did not exist before.", "gu": "મોટે ભાગે નહીં: સ્ટીલ, aluminium અને polymer એ જ યાદી છે. બદલાય છે copper - ત્રણ ગણું - અને 225 કિલોની battery જે પહેલાં નહોતી."}}, {"q": {"en": "What are the five materials in a lithium-ion cell?", "gu": "લિથિયમ-ion cell માં પાંચ સામગ્રી કઈ?"}, "a": {"en": "Aluminium current collector, lithium metal oxide cathode, separator with electrolyte, graphite anode and copper current collector - 150 micrometres in all, 3.7 V and 185 Wh for the cell.", "gu": "aluminium current collector, lithium metal oxide cathode, electrolyte સાથે separator, graphite anode અને copper current collector - કુલ 150 માઇક્રોમીટર, cell માટે 3.7 V અને 185 Wh."}}, {"q": {"en": "Why has LFP come back against NMC?", "gu": "NMC સામે LFP પાછું કેમ આવ્યું?"}, "a": {"en": "LFP is iron and phosphorus instead of nickel and cobalt: cheaper, safer, and 3000 cycles instead of 1500. It gives 140 Wh/kg against 220, so it wins where there is room for a bigger pack.", "gu": "LFP માં nickel અને cobalt ને બદલે લોહ અને ફોસ્ફરસ છે: સસ્તું, સલામત, અને 1500 ને બદલે 3000 cycle. તે 220 સામે 140 Wh/kg આપે, તેથી જ્યાં મોટું pack ગોઠવાય ત્યાં જીતે."}}]}, {"title": {"en": "Renewable energy", "gu": "નવીનીકરણીય ઊર્જા"}, "items": [{"q": {"en": "A panel is 20 % efficient. What is the other 80 %?", "gu": "પેનલ 20 % efficient છે. બાકીના 80 % શું?"}, "a": {"en": "Four fifths of the sunlight is reflected, absorbed as heat below the band gap or lost as heat from the excited electrons; and by mass it is the glass, frame, encapsulant and backsheet that hold the cells, not the cells.", "gu": "પાંચમાંથી ચાર ભાગ સૂર્યપ્રકાશ પરાવર્તિત થાય, band gap નીચે ગરમી તરીકે શોષાય કે ઉત્તેજિત electrons ની ગરમી તરીકે જાય; અને દળ પ્રમાણે એ કાચ, frame, encapsulant અને backsheet છે જે cell પકડે, cell નહીં."}}, {"q": {"en": "Why is a wind blade a composite and the tower steel?", "gu": "પવન blade composite અને tower સ્ટીલ કેમ?"}, "a": {"en": "The blade must be stiff and light because every kilogram at 80 m radius is a bending moment, and carbon epoxy gives 75 GPa per g/cm3 against 25 for steel. The tower only has to carry compression, so plate steel is cheaper and weldable.", "gu": "blade કઠોર અને હલકું જોઈએ કારણ કે 80 મીટર ત્રિજ્યા પર દરેક કિલોગ્રામ bending moment છે, અને carbon epoxy પ્રતિ g/cm3 75 GPa આપે, સ્ટીલ 25. tower ને ફક્ત compression ઉપાડવું પડે, તેથી પ્લેટ સ્ટીલ સસ્તું અને weldable છે."}}, {"q": {"en": "What is the end-of-life problem of a wind blade?", "gu": "પવન blade ની end-of-life સમસ્યા શું?"}, "a": {"en": "It is a thermoset: cross-linked epoxy that cannot be melted, so 60 tonnes per turbine goes to cement kilns or landfill. Thermoplastic resins and recyclable epoxy are the answer being built now.", "gu": "એ thermoset છે: cross-linked epoxy જે ઓગળે નહીં, તેથી પ્રતિ turbine 60 ટન સિમેન્ટ ભઠ્ઠી કે landfill જાય. thermoplastic resin અને recyclable epoxy એ હવે બનતો જવાબ છે."}}]}, {"title": {"en": "Advanced materials", "gu": "Advanced materials"}, "items": [{"q": {"en": "Why is specific strength used instead of strength?", "gu": "મજબૂતાઈને બદલે specific strength કેમ?"}, "a": {"en": "Because a moving part carries its own mass: UTS divided by density compares what a kilogram of material can do, and that is the fair comparison between steel at 57 and CFRP at 938 kN m per kg.", "gu": "કારણ કે ચાલતો ભાગ પોતાનું દળ ઉપાડે: UTS ભાગ્યા ઘનતા સરખાવે કે એક કિલોગ્રામ સામગ્રી શું કરી શકે, અને એ જ 57 વાળા સ્ટીલ અને 938 kN m પ્રતિ kg વાળા CFRP વચ્ચેની ન્યાયી તુલના છે."}}, {"q": {"en": "What does an NdFeB magnet give a motor that a ferrite does not?", "gu": "NdFeB magnet ferrite કરતાં motor ને શું આપે?"}, "a": {"en": "Energy product: 250 to 400 kJ/m3 against 30, and 1.3 T against 0.4 T. The same torque comes from a much smaller and lighter motor, which is why a 150 kW unit fits in 40 kg.", "gu": "Energy product: 30 સામે 250 - 400 kJ/m3, અને 0.4 T સામે 1.3 T. એ જ torque ઘણા નાના અને હલકા motor માંથી મળે, તેથી 150 kW એકમ 40 કિલોમાં આવે."}}, {"q": {"en": "Is the lightest material always the greenest choice?", "gu": "સૌથી હલકી સામગ્રી હંમેશા સૌથી green પસંદગી છે?"}, "a": {"en": "No. CFRP is the lightest structural choice at 938 kN m per kg but carries 500 MJ/kg and cannot be melted, so on a hatchback aluminium at 170 MJ/kg and 8 from scrap is the greener answer - check the payback distance.", "gu": "ના. CFRP 938 kN m પ્રતિ kg સાથે સૌથી હલકી માળખાકીય પસંદગી છે પણ 500 MJ/kg ધરાવે અને ઓગળે નહીં, તેથી hatchback પર 170 MJ/kg અને scrap થી 8 વાળું aluminium વધુ green જવાબ છે - payback અંતર ચકાસો."}}]}], "exam_questions": [{"q": {"en": "A steel subframe of 12 kg is to be replaced by an aluminium one of equal stiffness, which needs 1.5 times the section area. Steel is 7.85 g/cm3 and 25 MJ/kg; aluminium is 2.70 g/cm3, 170 MJ/kg primary and 8 MJ/kg secondary. The car covers 200 000 km and saves 0.4 kWh per 100 km per 100 kg. Find the new mass, the mass saved, and the distance over which the extra embodied energy is paid back for primary aluminium, for 60 % recycled aluminium, and for scrap-only aluminium.", "gu": "12 કિલોનું સ્ટીલ subframe એ જ કઠોરતા વાળા aluminium થી બદલવાનું છે, જેના માટે 1.5 ગણું section area જોઈએ. સ્ટીલ 7.85 g/cm3 અને 25 MJ/kg; aluminium 2.70 g/cm3, primary 170 MJ/kg અને secondary 8 MJ/kg. કાર 200,000 km ચાલે અને પ્રતિ 100 km પ્રતિ 100 kg 0.4 kWh બચાવે. નવું દળ, બચેલું દળ, અને primary aluminium, 60 % recycled aluminium તથી ફક્ત scrap ના aluminium માટે વધારાની embodied energy કેટલા અંતરે payback થાય તે શોધો."}, "marks": 7}, {"q": {"en": "A house in Surat needs 4 kWh a day. Choose a module of 2 m2 and 20 % cell efficiency, with a performance ratio of 0.8 and 5 peak sun hours a day. Find the peak power of one module, the energy it gives in a day, the number of modules, the roof area and the CO2 avoided per year at 0.71 kg per kWh.", "gu": "સુરતમાં ઘરને દિવસના 4 kWh જોઈએ. 2 m2 અને 20 % cell efficiency વાળું module પસંદ કરો, performance ratio 0.8 અને દિવસના 5 peak sun hour. એક module ની peak power, દિવસમાં તે આપે તે ઊર્જા, module ની સંખ્યા, છતનું ક્ષેત્ર અને 0.71 kg પ્રતિ kWh આગળ વર્ષે ટળતું CO2 શોધો."}, "marks": 6}, {"q": {"en": "An electric car uses 0.15 kWh per km and charges on the Indian grid at 0.71 kg CO2 per kWh. A petrol car in the same class uses 6 L per 100 km, and petrol releases 2.31 kg of CO2 per litre. Find the g/km of each, the annual difference at 15 000 km, and the g/km of the electric car charged from its own roof.", "gu": "ઇલેક્ટ્રિક કાર 0.15 kWh પ્રતિ km વાપરે છે અને ભારતીય grid પર 0.71 kg CO2 પ્રતિ kWh આગળ charge થાય. એ જ વર્ગની પેટ્રોલ કાર 6 L પ્રતિ 100 km વાપરે, અને પેટ્રોલ પ્રતિ લિટર 2.31 kg CO2 છોડે. દરેકના g/km, 15,000 km પર વાર્ષિક ફરક, અને પોતાની છત પરથી charge થતી ઇલેક્ટ્રિક કારના g/km શોધો."}, "marks": 6}, {"q": {"en": "A pack is built from 192 cells of 3.7 V and 50 Ah, arranged 96 in series and 2 in parallel. Each cell is 0.9 kg and the finished pack is 236 kg. Find the pack voltage, capacity, energy, the specific energy of the cells and of the pack, and the range at 0.15 kWh per km.", "gu": "Pack 3.7 V અને 50 Ah ના 192 cell થી બને છે, 96 series અને 2 parallel માં. દરેક cell 0.9 કિલો અને તૈયાર pack 236 કિલો. Pack નો voltage, capacity, ઊર્જા, cell અને pack ની specific energy, અને 0.15 kWh પ્રતિ km આગળ અંતર શોધો."}, "marks": 5}, {"q": {"en": "A bracket is 20 kg of aluminium. Primary aluminium is 170 MJ/kg and 11.5 kg CO2 per kg; secondary is 8 MJ/kg and 0.5 kg CO2 per kg; 4 kg of bauxite are mined per kg of primary metal. Find the embodied energy, the CO2 and the bauxite for both routes, and the saving.", "gu": "એક bracket 20 કિલો aluminium નું છે. Primary aluminium 170 MJ/kg અને પ્રતિ કિલો 11.5 kg CO2; secondary 8 MJ/kg અને 0.5 kg CO2; પ્રતિ કિલો primary ધાતુ માટે 4 કિલો bauxite ખોદાય. બંને માર્ગની embodied energy, CO2 અને bauxite, અને બચત શોધો."}, "marks": 5}, {"q": {"en": "A press shop runs 2000 hours a year at 500 kg of steel parts an hour. Scrap is 18 % of the sheet consumed, 92 % of the scrap is recovered as a clean grade, and the grade sells at Rs 32 a kilogram. Find the annual scrap, the mass recovered, its value, and what the recovery does to the materia
