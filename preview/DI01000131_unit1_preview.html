<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Computer Programming Fundamentals – Unit 1</title>
<style>
:root{--p:#7B2CD9;--pd:#6420B8;--lav:#EADDF7;--bg:#F3ECFA;--ink:#1d1b20}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#d8cce8;font-family:"Noto Sans Gujarati","Shruti","Nirmala UI",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink)}
.phone{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:70px;position:relative}
.bar{position:sticky;top:0;z-index:10;background:var(--p);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.top{display:flex;align-items:center;gap:14px;padding:14px 14px 10px}
.top svg{flex:none}
.ttl{flex:1;min-width:0}
.ttl b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{opacity:.85;font-size:12.5px}
.lang{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:18px;padding:6px 12px;font-weight:700;font-size:14px;cursor:pointer}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;padding:0 6px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;color:rgba(255,255,255,.75);padding:10px 14px 12px;font-size:14.5px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;background:none;border-top:0;border-left:0;border-right:0}
.tab.on{color:#fff;border-bottom-color:#fff}
.sec{margin-bottom:14px}
.sh{background:var(--lav);display:flex;align-items:center;justify-content:space-between;padding:16px 14px 16px 18px;font-weight:800;font-size:17px;position:relative}
.more{background:none;border:0;padding:4px 6px;cursor:pointer;border-radius:50%}
.menu{display:none;position:absolute;right:12px;top:48px;background:#fff;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.18);z-index:5;overflow:hidden;min-width:150px}
.menu.show{display:block}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:12px 16px;font-size:14.5px;cursor:pointer}
.menu button:hover{background:#f4eefc}
.card{background:#fff;border-radius:6px;margin:0 0 8px;box-shadow:0 1px 3px rgba(60,20,110,.14)}
.q{display:flex;gap:10px;align-items:flex-start;padding:16px 14px 16px 18px;color:var(--p);font-size:16.5px;line-height:1.45;cursor:pointer}
.q .n{flex:none;min-width:24px}
.q .t{flex:1}
.q.hd{font-weight:700}
.chev{flex:none;transition:transform .2s;margin-top:1px}
.card.open .chev{transform:rotate(180deg)}
.a{display:none;padding:0 16px 18px 52px;font-size:15.5px;line-height:1.65;color:#222}
.card.open .a{display:block;animation:fd .2s}
@keyframes fd{from{opacity:0;transform:translateY(-4px)}to{opacity:1}}
.a p{margin:0 0 10px}.a ul,.a ol{margin:0 0 10px;padding-left:20px}.a li{margin-bottom:4px}
.a b{color:#111}
.eq{background:#F5EEFD;border-left:4px solid var(--p);padding:8px 12px;border-radius:4px;font-weight:700;font-size:16.5px;color:var(--pd)}
.tw{overflow-x:auto;margin:0 0 10px -36px;padding-left:0}
table{border-collapse:collapse;font-size:13.5px;min-width:100%;line-height:1.4}
th{background:var(--p);color:#fff;text-align:left;padding:7px 8px;font-weight:700}
td{border-bottom:1px solid #eadff6;padding:7px 8px;vertical-align:top}
tr:nth-child(even) td{background:#faf7fe}
.dg{margin:6px 0 4px -36px;border:1px solid #eadff6;border-radius:10px;overflow:hidden;cursor:zoom-in;background:#fff}
.dg svg{display:block;width:100%;height:auto}
.dgc{font-size:12px;color:#7a6f88;text-align:center;margin:-2px 0 10px -36px}
.dcard{background:#fff;border-radius:10px;margin:0 10px 12px;box-shadow:0 1px 3px rgba(60,20,110,.14);overflow:hidden;cursor:zoom-in}
.dcard .h{padding:12px 14px;color:var(--p);font-weight:700;font-size:15.5px;border-bottom:1px solid #f0e8f9}
.dcard svg{display:block;width:100%;height:auto}
.fbox{margin:4px 0 0;background:#F5EEFD;border-radius:6px;padding:9px 12px;font-size:18px;font-weight:700;color:var(--pd);display:inline-block}
.q .t .nm{display:block}
.mk{flex:none;background:#FFF1D6;color:#9A5B00;border-radius:12px;padding:2px 9px;font-size:12.5px;font-weight:800;margin-top:2px}
.ad{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:56px;background:#fff;border-top:1px solid #e3d8f0;display:flex;align-items:center;justify-content:center;gap:8px;color:#8b8199;font-size:12.5px;z-index:9}
.ad i{font-style:normal;background:#f2c94c;color:#5b4300;font-weight:800;font-size:10.5px;padding:1px 5px;border-radius:3px}
.modal{position:fixed;inset:0;background:rgba(20,10,35,.92);z-index:50;display:none;flex-direction:column}
.modal.show{display:flex}
.mh{display:flex;align-items:center;justify-content:space-between;color:#fff;padding:12px 16px;font-weight:700}
.mh button{background:rgba(255,255,255,.15);border:0;color:#fff;font-size:18px;width:38px;height:38px;border-radius:50%;cursor:pointer}
.mb{flex:1;overflow:auto;padding:10px}
.mb .zw{background:#fff;border-radius:8px;margin:auto;transform-origin:top left}
.mb svg{display:block;width:100%;height:auto}
.zb{display:flex;justify-content:center;gap:14px;padding:12px}
.zb button{background:#fff;border:0;border-radius:22px;padding:8px 20px;font-size:18px;font-weight:800;color:var(--p);cursor:pointer}
.a h4{margin:14px 0 6px;color:var(--pd);font-size:15.5px}
.a h4:first-child{margin-top:0}
.card.key{border-left:4px solid #2E7D32}
.card.key .q{color:#1B5E20}
.ex{margin:12px 0 10px -36px;border:1.5px dashed #C9A227;background:#FFFBEF;border-radius:10px;padding:10px 12px}
.ex .et{font-weight:800;color:#9A5B00;font-size:13px;margin-bottom:4px}
.ex .eq2{font-weight:700;margin-bottom:6px}
.ex p{margin:0 0 6px}
.a.rn .dg,.a.rn .dgc,.a.rn .tw,.a.rn .ex{margin-left:0}
.intro{margin:12px 10px;background:linear-gradient(135deg,#8E3BE8,#5B1BB0);color:#fff;border-radius:14px;padding:14px 16px}
.intro b{font-size:16px}.intro div{font-size:13px;opacity:.9;margin-top:4px}
.chips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.chips span{background:rgba(255,255,255,.18);border-radius:12px;padding:3px 10px;font-size:12px;font-weight:700}
pre.code{background:#1E1530;color:#EDE7F6;border-radius:8px;padding:10px 12px;font:13px/1.55 "JetBrains Mono",Consolas,"DejaVu Sans Mono","Noto Sans Gujarati",monospace;overflow-x:auto;margin:0 0 10px;white-space:pre;tab-size:4}
pre.out{background:#0E1B12;color:#B9F6CA;border-radius:8px;padding:10px 12px;font:13px/1.5 Consolas,"DejaVu Sans Mono",monospace;overflow-x:auto;margin:0 0 10px;white-space:pre}
.kw{color:#C792EA;font-weight:700}.ty{color:#82AAFF}.st{color:#C3E88D}.cm{color:#8E9AAF;font-style:italic}.pp{color:#F78C6C}.nu{color:#F9C46B}.fn{color:#FFCB6B}
.pl{font-size:12px;font-weight:800;color:var(--pd);margin:10px 0 4px;letter-spacing:.4px;text-transform:uppercase}
@media (max-width:480px){pre.code,pre.out{font-size:11.5px;padding:9px 10px}}
.a code{background:#F1E9FB;color:#5B1BB0;padding:1px 5px;border-radius:4px;font-family:Consolas,"DejaVu Sans Mono",monospace;font-size:.9em}
.pbox{margin:12px 0 10px;border:1.5px dashed #2E8B7A;background:#F2FBF8;border-radius:10px;padding:10px 12px}
.pbox .et{font-weight:800;color:#1F6E60;font-size:13.5px;margin-bottom:6px}
.sx{margin:6px 0 0;font-size:12.5px;padding:8px 10px}
.a.pa{padding-left:16px}
</style></head>

<script>
const U = {"subject": "DI01000131", "unit": 1, "format": "notes", "title": {"en": "Flowchart, Algorithm, Basics of C, Operators"}, "weightage": 20, "hours": 8, "notes": [{"title": {"en": "1.1 Flowchart"}, "items": [{"h": {"en": "1.1.1 Definition and Symbols of Flowchart"}, "body": {"en": "<p><b>Definition:</b> A <b>flowchart</b> is a <b>pictorial (graphical) representation</b> of the steps of an algorithm or program, drawn using <b>standard symbols</b> connected by <b>arrows</b> that show the flow of control.</p>\n<p>It shows <i>what</i> is done at each step and <i>in which order</i>. Flowcharts are drawn before writing a program to plan the logic.</p>\n<h4>Standard flowchart symbols (see diagram)</h4>\n<table>\n<tr><th>Symbol</th><th>Name</th><th>Purpose</th></tr>\n<tr><td>Oval / rounded rectangle</td><td><b>Terminal</b></td><td>Start and Stop of the flowchart</td></tr>\n<tr><td>Parallelogram</td><td><b>Input / Output</b></td><td>Read input data or print output (READ, PRINT)</td></tr>\n<tr><td>Rectangle</td><td><b>Process</b></td><td>Calculations, assignments (e.g. SUM = A + B)</td></tr>\n<tr><td>Diamond (rhombus)</td><td><b>Decision</b></td><td>Checking a condition; has two exits: Yes / No (True / False)</td></tr>\n<tr><td>Arrow</td><td><b>Flow line</b></td><td>Shows the direction of flow of steps</td></tr>\n<tr><td>Small circle</td><td><b>Connector</b></td><td>Joins two parts of a flowchart (on the same page) when lines would cross or the chart is long</td></tr>\n<tr><td>Rectangle with double side lines</td><td><b>Predefined process</b></td><td>A function / sub-program defined elsewhere</td></tr>\n</table>"}, "diagram": "c1_fc_symbols"}, {"h": {"en": "1.1.2 Rules, Advantages and Disadvantages of Flowchart"}, "body": {"en": "<h4>Rules (guidelines) for drawing a flowchart</h4>\n<ol>\n<li>Every flowchart must have exactly one <b>Start</b> and at least one <b>Stop</b> terminal.</li>\n<li>Use only <b>standard symbols</b>.</li>\n<li>The flow should be from <b>top to bottom</b> and <b>left to right</b>.</li>\n<li>Flow lines should not cross each other; use <b>connectors</b> if needed.</li>\n<li>A process symbol has one entry and one exit; a <b>decision</b> symbol has one entry and <b>two exits</b> (Yes / No).</li>\n<li>Write statements inside symbols <b>briefly and clearly</b>.</li>\n<li>The flowchart should be neat, simple and easy to follow.</li>\n</ol>\n<h4>Advantages</h4>\n<ul>\n<li><b>Easy to understand:</b> a picture is easier to understand than text.</li>\n<li><b>Better communication</b> of logic to other programmers.</li>\n<li><b>Effective analysis:</b> problems can be analysed and logic errors found easily.</li>\n<li>Acts as a <b>guide (blueprint)</b> while writing the program – <b>efficient coding</b>.</li>\n<li><b>Proper documentation</b> of the program.</li>\n<li>Helps in <b>debugging</b> and <b>program maintenance</b>.</li>\n</ul>\n<h4>Disadvantages</h4>\n<ul>\n<li>Drawing flowcharts for <b>large, complex programs</b> is time-consuming and difficult.</li>\n<li>If the logic changes, the flowchart must be <b>redrawn</b> (difficult to modify).</li>\n<li>No standard for the <b>level of detail</b> to be shown.</li>\n<li>Takes more space; reproduction is difficult.</li>\n<li>It is not a program – it must still be converted into a programming language.</li>\n</ul>"}}, {"h": {"en": "1.1.3 Flowchart Example – Sum of Two Numbers"}, "body": {"en": "<p>This is a <b>sequential</b> flowchart – the steps are executed one after another without any decision.</p>\n<ol>\n<li><b>Start</b></li>\n<li><b>Input:</b> Read two numbers A and B (parallelogram).</li>\n<li><b>Process:</b> SUM = A + B (rectangle).</li>\n<li><b>Output:</b> Print SUM (parallelogram).</li>\n<li><b>Stop</b></li>\n</ol>\n<p>Most simple programs follow this pattern: <b>Input → Process → Output</b>. The C program for this flowchart is given in topic 1.5.3.</p>"}, "diagram": "c1_fc_sum"}, {"h": {"en": "1.1.4 Flowchart Example – Largest of Three Numbers"}, "body": {"en": "<p>This flowchart uses <b>decision</b> (diamond) symbols – an example of <b>branching</b>.</p>\n<ol>\n<li>Start; read A, B, C.</li>\n<li>Is A &gt; B?\n<ul><li><b>Yes</b> → Is A &gt; C? Yes → print A; No → print C.</li>\n<li><b>No</b> → Is B &gt; C? Yes → print B; No → print C.</li></ul></li>\n<li>Stop.</li>\n</ol>\n<p><b>Dry run:</b> A = 25, B = 67, C = 43 → A &gt; B? No → B &gt; C? Yes → print <b>67</b>.</p>"}, "diagram": "c1_fc_largest", "programs": ["c1p13"]}, {"h": {"en": "1.1.5 Flowchart Example – Factorial of a Number (Loop)"}, "body": {"en": "<p>Factorial: N! = 1 × 2 × 3 × … × N. This flowchart shows a <b>loop (iteration)</b> – a set of steps repeated while a condition is true.</p>\n<ol>\n<li>Start; read N.</li>\n<li>Initialise F = 1, i = 1.</li>\n<li>Is i ≤ N? If <b>Yes</b>: F = F × i, i = i + 1 and go back to the condition.</li>\n<li>If <b>No</b>: print F; Stop.</li>\n</ol>\n<p><b>Dry run (N = 4):</b></p>\n<table><tr><th>i</th><th>i ≤ 4?</th><th>F = F × i</th></tr>\n<tr><td>1</td><td>Yes</td><td>1</td></tr><tr><td>2</td><td>Yes</td><td>2</td></tr>\n<tr><td>3</td><td>Yes</td><td>6</td></tr><tr><td>4</td><td>Yes</td><td>24</td></tr>\n<tr><td>5</td><td>No</td><td>print 24</td></tr></table>\n<p>The three basic structures of any logic are: <b>sequence</b> (1.1.3), <b>selection / decision</b> (1.1.4) and <b>iteration / loop</b> (1.1.5).</p>"}, "diagram": "c1_fc_factorial"}, {"h": {"en": "Key Points – 1.1"}, "body": {"en": "<ul>\n<li>Flowchart = <b>pictorial representation</b> of an algorithm using standard symbols.</li>\n<li>Oval → Start/Stop; parallelogram → Input/Output; rectangle → Process; diamond → Decision; circle → Connector.</li>\n<li>Decision symbol has <b>two exits</b> (Yes/No); flow is top-to-bottom.</li>\n<li>Advantages: easy understanding, communication, analysis, documentation, debugging.</li>\n<li>Disadvantages: hard for complex logic, difficult to modify, time-consuming.</li>\n<li>Three structures: <b>sequence, selection, iteration</b>.</li>\n</ul>"}, "key": true}]}, {"title": {"en": "1.2 Algorithm"}, "items": [{"h": {"en": "1.2.1 Definition and Characteristics of Algorithm"}, "body": {"en": "<p><b>Definition:</b> An <b>algorithm</b> is a <b>finite set of well-defined, step-by-step instructions</b> for solving a particular problem. The word comes from the name of the Persian mathematician <b>Al-Khwarizmi</b>.</p>\n<p>An algorithm is written in simple English-like language, independent of any programming language. A program is an algorithm written in a programming language.</p>\n<h4>Characteristics (properties) of a good algorithm</h4>\n<ol>\n<li><b>Input:</b> It takes zero or more inputs.</li>\n<li><b>Output:</b> It produces at least one output (result).</li>\n<li><b>Definiteness:</b> Each step must be clear and unambiguous (only one meaning).</li>\n<li><b>Finiteness:</b> It must terminate after a finite number of steps.</li>\n<li><b>Effectiveness:</b> Each step must be basic enough to be carried out (by hand, with pen and paper) in finite time.</li>\n<li><b>Generality / language independence:</b> It should solve all problems of a given type and can be coded in any language.</li>\n</ol>"}}, {"h": {"en": "1.2.2 Writing Algorithms using Pseudo Code"}, "body": {"en": "<p><b>Pseudo code</b> (\"false code\") is an informal, English-like way of writing an algorithm that looks similar to a program but does not follow the exact syntax of any language. It is meant for humans, not for the computer.</p>\n<h4>Common pseudo-code keywords</h4>\n<table>\n<tr><th>Purpose</th><th>Keywords</th></tr>\n<tr><td>Start / end</td><td>START (BEGIN), STOP (END)</td></tr>\n<tr><td>Input</td><td>READ, INPUT, GET</td></tr>\n<tr><td>Output</td><td>PRINT, DISPLAY, WRITE</td></tr>\n<tr><td>Process</td><td>COMPUTE, CALCULATE, SET, ← (assignment)</td></tr>\n<tr><td>Decision</td><td>IF … THEN … ELSE … ENDIF</td></tr>\n<tr><td>Loop</td><td>WHILE … DO … ENDWHILE, FOR … TO … ENDFOR, REPEAT … UNTIL</td></tr>\n</table>\n<h4>Steps to develop an algorithm</h4>\n<ol>\n<li>Understand the problem: identify the <b>input</b>, required <b>output</b> and the <b>formula / logic</b>.</li>\n<li>Write the steps in order, numbered Step 1, Step 2, …</li>\n<li>Use proper keywords and indentation for decisions and loops.</li>\n<li>Check (dry run) with sample data.</li>\n</ol>\n<h4>Example: area of a rectangle</h4>\n<p>Step 1: START<br>Step 2: READ length L, breadth B<br>Step 3: AREA ← L × B<br>Step 4: PRINT AREA<br>Step 5: STOP</p>"}}, {"h": {"en": "1.2.3 Algorithm Examples"}, "body": {"en": "<h4>1. Simple interest</h4>\n<p>Step 1: START<br>Step 2: READ P, R, N<br>Step 3: SI ← (P × R × N) / 100<br>Step 4: PRINT SI<br>Step 5: STOP</p>\n<h4>2. Check whether a number is even or odd</h4>\n<p>Step 1: START<br>Step 2: READ N<br>Step 3: IF N MOD 2 = 0 THEN PRINT \"Even\" ELSE PRINT \"Odd\"<br>Step 4: STOP</p>\n<h4>3. Largest of three numbers</h4>\n<p>Step 1: START<br>Step 2: READ A, B, C<br>Step 3: IF A &gt; B AND A &gt; C THEN PRINT A<br>Step 4: ELSE IF B &gt; C THEN PRINT B<br>Step 5: ELSE PRINT C<br>Step 6: STOP</p>\n<h4>4. Factorial of N</h4>\n<p>Step 1: START<br>Step 2: READ N<br>Step 3: F ← 1, I ← 1<br>Step 4: WHILE I ≤ N DO<br>&nbsp;&nbsp;&nbsp;&nbsp;F ← F × I<br>&nbsp;&nbsp;&nbsp;&nbsp;I ← I + 1<br>&nbsp;&nbsp;&nbsp;ENDWHILE<br>Step 5: PRINT F<br>Step 6: STOP</p>\n<h4>5. Sum of first N natural numbers</h4>\n<p>Step 1: START<br>Step 2: READ N<br>Step 3: SUM ← 0, I ← 1<br>Step 4: REPEAT SUM ← SUM + I, I ← I + 1 UNTIL I &gt; N<br>Step 5: PRINT SUM<br>Step 6: STOP</p>"}, "programs": ["c1p4"]}, {"h": {"en": "1.2.4 Advantages and Disadvantages of Algorithm; Algorithm vs Flowchart"}, "body": {"en": "<h4>Advantages of algorithm</h4>\n<ul>\n<li>Step-by-step representation – <b>easy to understand</b>.</li>\n<li><b>Language independent</b> – can be converted into any programming language.</li>\n<li>Breaks a problem into small steps; makes it <b>easy to write the program</b>.</li>\n<li>Easy to <b>find errors</b> (debug) in logic before coding.</li>\n<li>Easy to modify compared with a flowchart; no special symbols needed.</li>\n</ul>\n<h4>Disadvantages of algorithm</h4>\n<ul>\n<li><b>Time-consuming</b> to write for large problems.</li>\n<li>Branching and looping are <b>difficult to show</b> clearly in text.</li>\n<li>Not as easy to understand at a glance as a flowchart (no picture).</li>\n<li>No standard rules for writing pseudo code.</li>\n</ul>\n<h4>Difference between algorithm and flowchart</h4>\n<table>\n<tr><th>Algorithm</th><th>Flowchart</th></tr>\n<tr><td>Step-by-step written (text) procedure</td><td>Pictorial (graphical) representation</td></tr>\n<tr><td>Uses English-like statements / pseudo code</td><td>Uses standard symbols and arrows</td></tr>\n<tr><td>Comparatively difficult to understand</td><td>Easy to understand</td></tr>\n<tr><td>Easy to write and modify</td><td>Difficult to draw and modify</td></tr>\n<tr><td>Branching and looping hard to show</td><td>Branching and looping easy to show</td></tr>\n<tr><td>Suitable for large / complex problems</td><td>Becomes complex for large problems</td></tr>\n<tr><td>Usually written first</td><td>Usually drawn from the algorithm</td></tr>\n</table>"}}, {"h": {"en": "Key Points – 1.2"}, "body": {"en": "<ul>\n<li>Algorithm = <b>finite, step-by-step</b> procedure to solve a problem.</li>\n<li>Properties: <b>input, output, definiteness, finiteness, effectiveness</b>.</li>\n<li>Pseudo code = English-like algorithm using keywords READ, PRINT, IF-THEN-ELSE, WHILE, FOR.</li>\n<li>Algorithm is text and easy to modify; flowchart is a picture and easy to understand.</li>\n</ul>"}, "key": true}]}, {"title": {"en": "1.3 Overview of C"}, "items": [{"h": {"en": "1.3.1 History of C"}, "body": {"en": "<p><b>C</b> is a general-purpose, structured programming language developed by <b>Dennis M. Ritchie</b> at <b>AT&amp;T Bell Laboratories</b>, USA, in <b>1972</b>. It was developed to write the <b>UNIX operating system</b>.</p>\n<table>\n<tr><th>Year</th><th>Language</th><th>Developed by</th></tr>\n<tr><td>1960</td><td>ALGOL 60</td><td>International committee</td></tr>\n<tr><td>1963</td><td>CPL (Combined Programming Language)</td><td>Cambridge &amp; London University</td></tr>\n<tr><td>1967</td><td>BCPL (Basic CPL)</td><td>Martin Richards</td></tr>\n<tr><td>1970</td><td>B</td><td>Ken Thompson (Bell Labs)</td></tr>\n<tr><td><b>1972</b></td><td><b>C</b></td><td><b>Dennis Ritchie (Bell Labs)</b></td></tr>\n<tr><td>1978</td><td>K&amp;R C (book \"The C Programming Language\")</td><td>Kernighan &amp; Ritchie</td></tr>\n<tr><td>1989 / 1990</td><td>ANSI C (C89) / ISO C (C90)</td><td>ANSI / ISO committee</td></tr>\n<tr><td>1999</td><td>C99</td><td>ISO</td></tr>\n<tr><td>2011, 2018, 2024</td><td>C11, C17, C23</td><td>ISO</td></tr>\n</table>\n<p>C took many ideas from <b>B</b> and <b>BCPL</b> and added data types. The name \"C\" comes from being the successor of \"B\".</p>"}}, {"h": {"en": "1.3.2 Importance and Features of C"}, "body": {"en": "<ol>\n<li><b>Middle-level language:</b> combines features of high-level languages (easy to write) with low-level features (bit manipulation, direct memory access using pointers). Suitable for both system and application programs.</li>\n<li><b>Structured language:</b> a program is divided into <b>functions (modules)</b>; easy to write, test, debug and maintain.</li>\n<li><b>Fast and efficient:</b> programs written in C run very fast because of its rich set of data types and operators and its closeness to the hardware.</li>\n<li><b>Portable:</b> a C program written on one computer can run on another with little or no modification.</li>\n<li><b>Rich library:</b> many built-in (library) functions; we can also add our own functions to the library – <b>extensible</b>.</li>\n<li><b>Small number of keywords:</b> only <b>32 keywords</b> (ANSI C) – easy to learn.</li>\n<li><b>Powerful operators and data types</b>, including pointers, dynamic memory allocation and recursion.</li>\n<li><b>Case sensitive:</b> <code>sum</code> and <code>Sum</code> are different.</li>\n<li><b>Base for other languages:</b> C++, Java, C#, Python (CPython) etc. borrow its syntax.</li>\n</ol>\n<h4>Applications of C</h4>\n<p>Operating systems (UNIX, Linux kernel, parts of Windows), compilers and interpreters, embedded systems and microcontrollers, device drivers, databases (MySQL), text editors, network software and games.</p>"}}, {"h": {"en": "1.3.3 Basic Structure of a C Program"}, "body": {"en": "<p>A C program is made of the following sections (see diagram). Only the <b>main()</b> section is compulsory.</p>\n<ol>\n<li><b>Documentation section:</b> comments giving the program name, author, date and purpose. Comments are written between <code>/* … */</code> or after <code>//</code> and are ignored by the compiler.</li>\n<li><b>Link section:</b> tells the compiler to link functions from the system library using <code>#include</code>, e.g. <code>#include &lt;stdio.h&gt;</code>, <code>#include &lt;math.h&gt;</code>.</li>\n<li><b>Definition section:</b> defines symbolic constants using <code>#define</code>, e.g. <code>#define PI 3.14</code>.</li>\n<li><b>Global declaration section:</b> declares global variables (usable in all functions) and user-defined function prototypes. It is outside all functions.</li>\n<li><b>main() function section:</b> every program must have one <code>main()</code>; execution starts here. It has two parts inside braces <code>{ }</code>:\n<ul><li><b>Declaration part</b> – declares all variables used in the executable part.</li>\n<li><b>Executable part</b> – at least one statement. Every statement ends with a semicolon <code>;</code>.</li></ul></li>\n<li><b>Subprogram section:</b> contains user-defined functions called from <code>main()</code>. Usually placed after main().</li>\n</ol>\n<h4>Example showing all sections</h4>\n<pre class=\"c\">/* Program: Area of circle        (Documentation) */\n/* Link section */\n#include &lt;stdio.h&gt;\n/* Definition section */\n#define PI 3.14\n\n/* Global declaration */\nfloat area;\n\n/* main() function */\nint main(void)\n{\n    /* Declaration part */\n    float r = 5;\n    /* Executable part */\n    area = PI * r * r;\n    printf(\"Area = %.2f\\n\", area);\n    return 0;\n}</pre>"}, "diagram": "c1_structure", "programs": ["c1p1"]}, {"h": {"en": "1.3.4 Executing a C Program"}, "body": {"en": "<p>Executing a C program involves the following steps (see diagram):</p>\n<ol>\n<li><b>Creating (editing) the program:</b> type the program in an editor and save it with extension <b>.c</b> (e.g. <code>prog.c</code>). This is the <b>source code</b>.</li>\n<li><b>Preprocessing:</b> the preprocessor handles lines beginning with <code>#</code> – it inserts header files (<code>#include</code>) and replaces symbolic constants (<code>#define</code>).</li>\n<li><b>Compiling:</b> the <b>compiler</b> checks the program for <b>syntax errors</b> and translates it into machine language – <b>object code</b> (<code>prog.obj</code> in Windows / <code>prog.o</code> in Linux). If there are errors, the program is corrected and compiled again.</li>\n<li><b>Linking:</b> the <b>linker</b> joins the object code with the code of the <b>library functions</b> used (such as <code>printf()</code>) and creates an <b>executable file</b> (<code>prog.exe</code> / <code>a.out</code>).</li>\n<li><b>Loading and executing:</b> the <b>loader</b> loads the executable into memory and it runs. Input data is given and output is obtained.</li>\n<li><b>Testing:</b> if the output is wrong (<b>logic error</b>), the program is corrected and the steps are repeated.</li>\n</ol>\n<h4>Commands</h4>\n<table>\n<tr><th>Environment</th><th>Compile</th><th>Run</th><th>See output</th></tr>\n<tr><td>Turbo C / Borland (Windows)</td><td>Alt + F9</td><td>Ctrl + F9</td><td>Alt + F5</td></tr>\n<tr><td>GCC (Linux / Windows MinGW)</td><td colspan=\"2\"><code>gcc prog.c -o prog</code> then <code>./prog</code></td><td>Terminal</td></tr>\n<tr><td>Code::Blocks / Dev-C++ / VS Code</td><td colspan=\"2\">Build and Run (F9 / F11 / Ctrl+F5)</td><td>Console window</td></tr>\n</table>\n<pre class=\"c\">$ gcc prog.c -o prog      (compile + link)\n$ ./prog                  (run)</pre>\n<h4>Types of errors</h4>\n<ul>\n<li><b>Syntax (compile-time) errors:</b> violation of grammar rules, e.g. missing semicolon, undeclared variable – detected by the compiler.</li>\n<li><b>Linker errors:</b> e.g. misspelled <code>main</code> or library function not found.</li>\n<li><b>Run-time errors:</b> occur while running, e.g. division by zero.</li>\n<li><b>Logical errors:</b> program runs but gives wrong output, e.g. using <code>+</code> instead of <code>*</code> – found by testing.</li>\n</ul>"}, "diagram": "c1_execute"}, {"h": {"en": "Key Points – 1.3"}, "body": {"en": "<ul>\n<li>C developed by <b>Dennis Ritchie</b>, <b>Bell Labs, 1972</b>, for UNIX; derived from BCPL and B.</li>\n<li>Features: middle-level, structured, fast, portable, rich library, 32 keywords, case sensitive.</li>\n<li>Structure: Documentation → Link → Definition → Global declaration → <b>main()</b> → Subprograms.</li>\n<li>Steps: Edit (.c) → Preprocess → Compile (.obj/.o) → Link (.exe) → Load &amp; Run.</li>\n<li>Errors: syntax, linker, run-time, logical.</li>\n</ul>"}, "key": true}]}, {"title": {"en": "1.4 Constants, Variables and Data Types"}, "items": [{"h": {"en": "1.4.1 Introduction and Character Set"}, "body": {"en": "<p>Just as English has alphabets → words → sentences → paragraphs, C has <b>characters → tokens → instructions (statements) → programs</b>.</p>\n<p>The <b>character set</b> is the set of characters that can be used to write a C program. C uses the following four groups:</p>\n<table>\n<tr><th>Group</th><th>Characters</th></tr>\n<tr><td><b>Letters</b></td><td>Uppercase A … Z and lowercase a … z</td></tr>\n<tr><td><b>Digits</b></td><td>0 … 9</td></tr>\n<tr><td><b>Special characters</b></td><td>, . ; : ? ' \" ! | / \\ ~ _ $ % # &amp; ^ * - + &lt; &gt; ( ) [ ] { }</td></tr>\n<tr><td><b>White spaces</b></td><td>Blank space, horizontal tab, carriage return, newline, form feed</td></tr>\n</table>\n<p>The compiler ignores white spaces except inside strings and between keywords/identifiers. <b>Trigraph sequences</b> (e.g. <code>??=</code> for <code>#</code>) were provided for keyboards without some special characters.</p>"}}, {"h": {"en": "1.4.2 C Tokens"}, "body": {"en": "<p><b>Definition:</b> The <b>smallest individual unit</b> of a C program is called a <b>token</b>. A C program is written using these tokens and the syntax of the language.</p>\n<p>C has <b>six types of tokens</b> (see diagram):</p>\n<table>\n<tr><th>Token</th><th>Meaning</th><th>Examples</th></tr>\n<tr><td><b>Keywords</b></td><td>Reserved words with fixed meaning</td><td><code>int, float, if, while, return</code></td></tr>\n<tr><td><b>Identifiers</b></td><td>Names given to variables, functions, arrays</td><td><code>sum, main, total_marks</code></td></tr>\n<tr><td><b>Constants</b></td><td>Fixed values that do not change</td><td><code>10, -5, 3.14, 'A'</code></td></tr>\n<tr><td><b>Strings</b></td><td>Sequence of characters in double quotes</td><td><code>\"GTU\", \"Hello\"</code></td></tr>\n<tr><td><b>Special symbols</b></td><td>Punctuators / separators</td><td><code>{ } [ ] ( ) ; , #</code></td></tr>\n<tr><td><b>Operators</b></td><td>Symbols that perform operations</td><td><code>+ - * / = == &amp;&amp;</code></td></tr>\n</table>\n<p><b>Example:</b> <code>int sum = a + 10;</code> has 7 tokens: <code>int</code> (keyword), <code>sum</code> (identifier), <code>=</code> (operator), <code>a</code> (identifier), <code>+</code> (operator), <code>10</code> (constant), <code>;</code> (special symbol).</p>"}, "diagram": "c1_tokens"}, {"h": {"en": "1.4.3 Keywords and Identifiers"}, "body": {"en": "<h4>Keywords</h4>\n<p><b>Keywords</b> are <b>reserved words</b> whose meaning is already defined by the compiler. They cannot be used as variable or function names. All keywords are written in <b>lowercase</b>. ANSI C has <b>32 keywords</b>:</p>\n<table>\n<tr><td>auto</td><td>double</td><td>int</td><td>struct</td></tr>\n<tr><td>break</td><td>else</td><td>long</td><td>switch</td></tr>\n<tr><td>case</td><td>enum</td><td>register</td><td>typedef</td></tr>\n<tr><td>char</td><td>extern</td><td>return</td><td>union</td></tr>\n<tr><td>const</td><td>float</td><td>short</td><td>unsigned</td></tr>\n<tr><td>continue</td><td>for</td><td>signed</td><td>void</td></tr>\n<tr><td>default</td><td>goto</td><td>sizeof</td><td>volatile</td></tr>\n<tr><td>do</td><td>if</td><td>static</td><td>while</td></tr>\n</table>\n<h4>Identifiers</h4>\n<p><b>Identifiers</b> are <b>user-defined names</b> given to variables, functions, arrays, structures etc.</p>\n<p><b>Rules for identifiers:</b></p>\n<ol>\n<li>Can contain only <b>letters, digits and underscore ( _ )</b>.</li>\n<li>The <b>first character must be a letter or underscore</b>, not a digit.</li>\n<li><b>No spaces</b> or other special characters are allowed.</li>\n<li>Cannot be a <b>keyword</b>.</li>\n<li>They are <b>case sensitive</b>: <code>Total</code> and <code>total</code> are different.</li>\n<li>ANSI C guarantees at least the first <b>31 characters</b> are significant.</li>\n</ol>\n<table>\n<tr><th>Valid</th><th>Invalid (reason)</th></tr>\n<tr><td><code>sum</code></td><td><code>2sum</code> (starts with digit)</td></tr>\n<tr><td><code>total_marks</code></td><td><code>total marks</code> (space)</td></tr>\n<tr><td><code>_count</code></td><td><code>int</code> (keyword)</td></tr>\n<tr><td><code>num1</code></td><td><code>num-1</code> (special char –)</td></tr>\n<tr><td><code>Area</code></td><td><code>$amount</code> ($ not allowed in standard C)</td></tr>\n</table>"}}, {"h": {"en": "1.4.4 Constants"}, "body": {"en": "<p><b>Constants</b> are <b>fixed values</b> that do not change during the execution of a program.</p>\n<h4>Types of constants</h4>\n<ul>\n<li><b>Numeric constants</b> – integer constants and real constants</li>\n<li><b>Character constants</b> – single character constants and string constants</li>\n</ul>\n<h4>1. Integer constants</h4>\n<p>Whole numbers without a decimal point. Three types:</p>\n<table>\n<tr><th>Type</th><th>Digits</th><th>Prefix</th><th>Examples</th></tr>\n<tr><td>Decimal</td><td>0 – 9</td><td>none</td><td><code>123, -45, 0</code></td></tr>\n<tr><td>Octal</td><td>0 – 7</td><td><code>0</code></td><td><code>037, 0435</code></td></tr>\n<tr><td>Hexadecimal</td><td>0 – 9, A – F</td><td><code>0x</code> or <code>0X</code></td><td><code>0x2A, 0X9F</code></td></tr>\n</table>\n<p>Suffix <code>L</code> = long (<code>50000L</code>), <code>U</code> = unsigned (<code>100U</code>). Commas and spaces are not allowed (<code>10,000</code> is invalid).</p>\n<h4>2. Real (floating-point) constants</h4>\n<p>Numbers with a fractional part. Two forms:</p>\n<ul><li><b>Fractional form:</b> <code>0.0083, -0.75, 435.36, 215.</code></li>\n<li><b>Exponential form:</b> <code>mantissa e exponent</code> – e.g. <code>2.15e2</code> = 215, <code>1.5e-3</code> = 0.0015. Useful for very large or small numbers.</li></ul>\n<h4>3. Single character constants</h4>\n<p>One character in <b>single quotes</b>: <code>'A'</code>, <code>'5'</code>, <code>';'</code>, <code>' '</code>. Each has an integer ASCII value: <code>'A'</code> = 65, <code>'a'</code> = 97, <code>'0'</code> = 48.</p>\n<h4>4. String constants</h4>\n<p>A sequence of characters in <b>double quotes</b>: <code>\"Hello\"</code>, <code>\"2024\"</code>, <code>\"A\"</code>. A string is automatically terminated by the null character <code>'\\0'</code>, so <code>'A'</code> (1 byte) ≠ <code>\"A\"</code> (2 bytes).</p>\n<h4>5. Backslash character constants (escape sequences)</h4>\n<table>\n<tr><th>Escape</th><th>Meaning</th><th>Escape</th><th>Meaning</th></tr>\n<tr><td><code>\\n</code></td><td>New line</td><td><code>\\\\</code></td><td>Backslash</td></tr>\n<tr><td><code>\\t</code></td><td>Horizontal tab</td><td><code>\\'</code></td><td>Single quote</td></tr>\n<tr><td><code>\\a</code></td><td>Alert (beep)</td><td><code>\\\"</code></td><td>Double quote</td></tr>\n<tr><td><code>\\b</code></td><td>Backspace</td><td><code>\\?</code></td><td>Question mark</td></tr>\n<tr><td><code>\\r</code></td><td>Carriage return</td><td><code>\\0</code></td><td>Null character</td></tr>\n<tr><td><code>\\f</code></td><td>Form feed</td><td><code>\\v</code></td><td>Vertical tab</td></tr>\n</table>"}}, {"h": {"en": "1.4.5 Variables"}, "body": {"en": "<p><b>Definition:</b> A <b>variable</b> is a <b>named memory location</b> used to store a data value. Unlike a constant, the value of a variable <b>can change</b> during program execution.</p>\n<p>Example: in <code>int age = 18;</code> – <code>age</code> is the variable name, <code>int</code> its type and 18 its value. The compiler reserves memory (e.g. 4 bytes) for it.</p>\n<h4>Rules for variable names</h4>\n<p>Variable names are identifiers, so all identifier rules apply: letters, digits and underscore only; must begin with a letter or underscore; no keywords; no spaces; case sensitive. Choose <b>meaningful names</b> such as <code>total_marks</code> instead of <code>tm</code>.</p>\n<h4>Constant vs variable</h4>\n<table>\n<tr><th>Constant</th><th>Variable</th></tr>\n<tr><td>Fixed value, cannot change</td><td>Value can change during execution</td></tr>\n<tr><td>e.g. 10, 3.14, 'A'</td><td>e.g. <code>sum</code>, <code>rate</code></td></tr>\n<tr><td>No name needed (literal)</td><td>Has a name and data type</td></tr>\n</table>"}}, {"h": {"en": "1.4.6 Data Types"}, "body": {"en": "<p>A <b>data type</b> specifies the <b>type of data</b> a variable can store, the <b>memory size</b> and the <b>range</b> of values. C data types are classified as (see diagram):</p>\n<ul>\n<li><b>Primary (fundamental / built-in):</b> <code>int, char, float, double, void</code></li>\n<li><b>Derived:</b> array, pointer, function</li>\n<li><b>User-defined:</b> <code>struct, union, enum, typedef</code></li>\n</ul>\n<h4>Primary data types</h4>\n<table>\n<tr><th>Type</th><th>Size*</th><th>Range</th><th>Format</th><th>Use</th></tr>\n<tr><td><code>char</code></td><td>1 byte</td><td>−128 to 127</td><td>%c</td><td>Single character</td></tr>\n<tr><td><code>int</code></td><td>2 / 4 bytes</td><td>−32768 to 32767 (2 bytes)<br>−2,147,483,648 to 2,147,483,647 (4 bytes)</td><td>%d</td><td>Whole numbers</td></tr>\n<tr><td><code>float</code></td><td>4 bytes</td><td>3.4E−38 to 3.4E+38 (6–7 digit precision)</td><td>%f</td><td>Real numbers</td></tr>\n<tr><td><code>double</code></td><td>8 bytes</td><td>1.7E−308 to 1.7E+308 (15–16 digit precision)</td><td>%lf</td><td>Large / precise real numbers</td></tr>\n<tr><td><code>void</code></td><td>–</td><td>No value</td><td>–</td><td>Functions returning nothing</td></tr>\n</table>\n<p>*<code>int</code> is 2 bytes in 16-bit compilers (Turbo C) and 4 bytes in 32/64-bit compilers (GCC, Visual C).</p>\n<h4>Type modifiers (qualifiers)</h4>\n<p><code>signed, unsigned, short, long</code> change the size/range of the basic types:</p>\n<table>\n<tr><th>Type</th><th>Size (GCC)</th><th>Range</th><th>Format</th></tr>\n<tr><td><code>unsigned char</code></td><td>1</td><td>0 to 255</td><td>%c</td></tr>\n<tr><td><code>short int</code></td><td>2</td><td>−32768 to 32767</td><td>%hd</td></tr>\n<tr><td><code>unsigned int</code></td><td>4</td><td>0 to 4,294,967,295</td><td>%u</td></tr>\n<tr><td><code>long int</code></td><td>4 / 8</td><td>at least −2,147,483,648 to 2,147,483,647</td><td>%ld</td></tr>\n<tr><td><code>long double</code></td><td>10 / 12 / 16</td><td>3.4E−4932 to 1.1E+4932</td><td>%Lf</td></tr>\n</table>\n<p>Use <code>sizeof</code> to find the size on your compiler (see program).</p>"}, "diagram": "c1_datatypes", "programs": ["c1p15"]}, {"h": {"en": "1.4.7 Declaration of Variables and Assigning Values"}, "body": {"en": "<h4>Declaration</h4>\n<p>Every variable must be <b>declared before use</b>. Declaration tells the compiler (1) the <b>name</b> of the variable and (2) the <b>type of data</b> it will hold, so that memory can be reserved.</p>\n<p><b>Syntax:</b> <code>data_type var1, var2, …, varN;</code></p>\n<pre class=\"c\">int count;                 // one variable\n// many variables of same type\nint a, b, total;\nfloat price, rate;\nchar grade;\ndouble distance;</pre>\n<h4>Assigning values</h4>\n<p>Values can be given to variables in three ways:</p>\n<ol>\n<li><b>Assignment statement:</b> <code>variable = expression;</code> e.g. <code>sum = a + b;</code></li>\n<li><b>Initialization at declaration:</b> <code>int a = 10;</code></li>\n<li><b>Reading from keyboard</b> with <code>scanf()</code>.</li>\n</ol>\n<pre class=\"c\">// declaration + initialization\nint a = 10;\nfloat pi = 3.14f;\nchar ch = 'Y';\nint x, y, z;\n// multiple assignment\nx = y = z = 0;\n// value from keyboard\nscanf(\"%d\", &amp;a);</pre>\n<p>An uninitialized local variable contains a <b>garbage value</b> (unknown value), so always initialize variables like <code>sum = 0</code> before using them.</p>\n<h4>User-defined type declarations</h4>\n<p><code>typedef</code> gives a new name to an existing type; <code>enum</code> defines a set of named integer constants.</p>\n<pre class=\"c\">// marks is another name for int\ntypedef int marks;\nmarks m1, m2;\n\n// Mon=0, Tue=1, Wed=2\nenum day {Mon, Tue, Wed};\nenum day today = Tue;</pre>"}, "programs": ["c1p6"]}, {"h": {"en": "1.4.8 Defining Symbolic Constants"}, "body": {"en": "<p>A <b>symbolic constant</b> is a <b>name that represents a constant value</b>. It is defined with the <b>#define</b> preprocessor directive.</p>\n<p><b>Syntax:</b> <code>#define SYMBOLIC_NAME value</code></p>\n<pre class=\"c\">#define PI 3.14159\n#define MAX 100\n#define PASS_MARK 35</pre>\n<p>Before compilation, the preprocessor replaces every occurrence of the name with its value.</p>\n<h4>Why use symbolic constants?</h4>\n<ul>\n<li><b>Modifiability:</b> the value is changed at one place only (e.g. change <code>MAX</code> from 100 to 200).</li>\n<li><b>Understandability:</b> <code>PASS_MARK</code> is more meaningful than the number 35.</li>\n</ul>\n<h4>Rules</h4>\n<ol>\n<li>Written in <b>CAPITAL letters</b> (by convention) to distinguish them from variables.</li>\n<li><b>No semicolon</b> at the end and <b>no = sign</b>: <code>#define PI 3.14</code>.</li>\n<li><code>#</code> must be the first character in the line; usually placed at the beginning of the program.</li>\n<li>No blank space between <code>#</code> and <code>define</code>.</li>\n<li>A symbolic name cannot be assigned a new value inside the program (<code>PI = 3.5;</code> is invalid).</li>\n<li>They are not declared with a data type.</li>\n</ol>\n<h4>const qualifier</h4>\n<p>A variable can also be made constant using the <code>const</code> keyword. Unlike <code>#define</code>, it has a data type and occupies memory.</p>\n<pre class=\"c\">// value cannot be changed\nconst int SIZE = 50;\nconst float G = 9.81f;\n/* SIZE = 60;   -&gt; compile error */</pre>"}, "programs": ["c1p3"]}, {"h": {"en": "Key Points – 1.4"}, "body": {"en": "<ul>\n<li>Character set: letters, digits, special characters, white spaces.</li>\n<li><b>6 tokens:</b> keywords, identifiers, constants, strings, special symbols, operators.</li>\n<li><b>32 keywords</b>, all lowercase. Identifier: letters/digits/_ , not starting with digit, not a keyword.</li>\n<li>Constants: integer (decimal, octal 0…, hex 0x…), real (fractional, exponent), character 'A', string \"A\" (ends with \\0).</li>\n<li>Variable = named memory location; declare before use: <code>int a;</code></li>\n<li>char 1 byte (%c), int 2/4 (%d), float 4 (%f), double 8 (%lf).</li>\n<li><code>#define PI 3.14</code> – no semicolon, no =, capital letters.</li>\n</ul>"}, "key": true}]}, {"title": {"en": "1.5 Managing Input and Output Operations"}, "items": [{"h": {"en": "1.5.1 Reading a Character"}, "body": {"en": "<p>C has no built-in input/output statements. All I/O is done through <b>library functions</b> declared in the header file <code>&lt;stdio.h&gt;</code> (standard input-output).</p>\n<p>I/O functions are of two types: <b>unformatted</b> (<code>getchar(), putchar(), gets(), puts()</code>) and <b>formatted</b> (<code>scanf(), printf()</code>).</p>\n<h4>getchar()</h4>\n<p>Reads <b>a single character</b> from the standard input (keyboard).</p>\n<p><b>Syntax:</b> <code>variable_name = getchar();</code></p>\n<pre class=\"c\">char ch;\n// reads one character\nch = getchar();\n// displays one character\nputchar(ch);</pre>\n<ul>\n<li>It waits until a key is pressed <b>and Enter</b> is pressed (buffered input).</li>\n<li>It returns the character read (as an int); returns <code>EOF</code> at end of file.</li>\n</ul>\n<p>Related (non-standard, <code>&lt;conio.h&gt;</code> in Turbo C): <code>getch()</code> – reads a character without echo and without Enter; <code>getche()</code> – reads with echo.</p>\n<h4>Character test functions – &lt;ctype.h&gt;</h4>\n<table>\n<tr><th>Function</th><th>Test / action</th></tr>\n<tr><td><code>isalpha(c)</code></td><td>Is c a letter?</td></tr>\n<tr><td><code>isdigit(c)</code></td><td>Is c a digit?</td></tr>\n<tr><td><code>isalnum(c)</code></td><td>Letter or digit?</td></tr>\n<tr><td><code>islower(c)</code> / <code>isupper(c)</code></td><td>Lowercase / uppercase letter?</td></tr>\n<tr><td><code>isspace(c)</code></td><td>White-space character?</td></tr>\n<tr><td><code>ispunct(c)</code></td><td>Punctuation character?</td></tr>\n<tr><td><code>tolower(c)</code> / <code>toupper(c)</code></td><td>Convert to lowercase / uppercase</td></tr>\n</table>"}, "programs": ["c1p7"]}, {"h": {"en": "1.5.2 Writing a Character"}, "body": {"en": "<h4>putchar()</h4>\n<p>Displays (writes) <b>a single character</b> on the standard output (screen).</p>\n<p><b>Syntax:</b> <code>putchar(variable_name);</code> or <code>putchar('A');</code></p>\n<ul>\n<li><code>putchar(ch);</code> – prints the character stored in <code>ch</code>.</li>\n<li><code>putchar('\\n');</code> – moves the cursor to the next line.</li>\n<li>It returns the character written, or <code>EOF</code> on error.</li>\n</ul>\n<p>Related: <code>putch()</code> (<code>&lt;conio.h&gt;</code>, Turbo C). For strings, <code>gets()</code>/<code>puts()</code> are used (Unit 5).</p>\n<h4>getchar() vs putchar()</h4>\n<table>\n<tr><th>getchar()</th><th>putchar()</th></tr>\n<tr><td>Input function</td><td>Output function</td></tr>\n<tr><td>Reads one character from keyboard</td><td>Writes one character to screen</td></tr>\n<tr><td><code>ch = getchar();</code> – no argument</td><td><code>putchar(ch);</code> – one argument</td></tr>\n</table>"}}, {"h": {"en": "1.5.3 Formatted Input – scanf()"}, "body": {"en": "<p><code>scanf()</code> reads <b>formatted data</b> (int, float, char, string, …) from the keyboard.</p>\n<p><b>Syntax:</b> <code>scanf(\"control string\", &amp;var1, &amp;var2, …);</code></p>\n<ul>\n<li><b>Control string</b> contains <b>format specifiers</b> (beginning with <code>%</code>) that tell the type of data to read.</li>\n<li>The <b>address-of operator &amp;</b> must be written before each variable name, because scanf stores the value at that address (not needed for strings / arrays).</li>\n<li>Inputs are separated by spaces, tabs or Enter.</li>\n<li>scanf returns the number of values successfully read.</li>\n</ul>\n<h4>Format specifiers</h4>\n<table>\n<tr><th>Specifier</th><th>Data type</th><th>Specifier</th><th>Data type</th></tr>\n<tr><td><code>%d</code> / <code>%i</code></td><td>int</td><td><code>%c</code></td><td>char</td></tr>\n<tr><td><code>%f</code></td><td>float</td><td><code>%s</code></td><td>string</td></tr>\n<tr><td><code>%lf</code></td><td>double</td><td><code>%u</code></td><td>unsigned int</td></tr>\n<tr><td><code>%ld</code></td><td>long int</td><td><code>%o</code> / <code>%x</code></td><td>octal / hexadecimal</td></tr>\n<tr><td><code>%hd</code></td><td>short int</td><td><code>%e</code></td><td>float (exponent)</td></tr>\n</table>\n<pre class=\"c\">int a; float b; char c;\nscanf(\"%d\", &amp;a);           // integer\nscanf(\"%f\", &amp;b);           // float\n// space skips previous Enter\nscanf(\" %c\", &amp;c);\nscanf(\"%d %f\", &amp;a, &amp;b);    // mixed input\n// reads max 2 digits\nscanf(\"%2d\", &amp;a);</pre>\n<p><b>Field width:</b> <code>%2d</code> reads at most 2 digits; e.g. input <code>12345</code> with <code>scanf(\"%2d%3d\", &amp;a, &amp;b)</code> gives a = 12, b = 345.</p>"}, "programs": ["c1p2"]}, {"h": {"en": "1.5.4 Formatted Output – printf()"}, "body": {"en": "<p><code>printf()</code> displays <b>formatted output</b> on the screen.</p>\n<p><b>Syntax:</b></p>\n<pre class=\"c\">printf(\"control string\", arg1, arg2, ...);\nprintf(\"Sum = %d\\n\", sum);\nprintf(\"%d + %d = %d\\n\", a, b, a + b);</pre>\n<p>The control string may contain: (1) <b>characters</b> printed as they are, (2) <b>format specifiers</b> (<code>%d, %f, …</code>) replaced by the values of the arguments, (3) <b>escape sequences</b> (<code>\\n, \\t</code>).</p>\n<h4>Format specification: %[flag][width][.precision]type</h4>\n<ul>\n<li><b>width</b> – minimum number of columns.</li>\n<li><b>.precision</b> – digits after decimal point (for float) or maximum characters (for strings).</li>\n<li><b>flags</b> – <code>-</code> left justify, <code>0</code> pad with zeros, <code>+</code> show sign.</li>\n</ul>\n<table>\n<tr><th>Statement</th><th>Output (□ = space)</th></tr>\n<tr><td><code>printf(\"%d\", 9876)</code></td><td>9876</td></tr>\n<tr><td><code>printf(\"%6d\", 9876)</code></td><td>□□9876</td></tr>\n<tr><td><code>printf(\"%-6d\", 9876)</code></td><td>9876□□</td></tr>\n<tr><td><code>printf(\"%06d\", 9876)</code></td><td>009876</td></tr>\n<tr><td><code>printf(\"%2d\", 9876)</code></td><td>9876 (width ignored)</td></tr>\n<tr><td><code>printf(\"%.2f\", 98.7654)</code></td><td>98.77</td></tr>\n<tr><td><code>printf(\"%8.2f\", 98.7654)</code></td><td>□□□98.77</td></tr>\n<tr><td><code>printf(\"%e\", 98.7654)</code></td><td>9.876540e+01</td></tr>\n<tr><td><code>printf(\"%10s\", \"GTU\")</code></td><td>□□□□□□□GTU</td></tr>\n<tr><td><code>printf(\"%.2s\", \"GTU\")</code></td><td>GT</td></tr>\n</table>"}, "programs": ["c1p8"]}, {"h": {"en": "1.5.5 Formatted vs Unformatted I/O"}, "body": {"en": "<table>\n<tr><th>Formatted I/O</th><th>Unformatted I/O</th></tr>\n<tr><td><code>scanf()</code>, <code>printf()</code></td><td><code>getchar(), putchar(), gets(), puts(), getch()</code></td></tr>\n<tr><td>Use format specifiers (%d, %f …)</td><td>No format specifiers</td></tr>\n<tr><td>Can read/write any data type</td><td>Only characters / strings</td></tr>\n<tr><td>Output can be arranged (width, precision)</td><td>No formatting control</td></tr>\n<tr><td>Slower, more flexible</td><td>Simple and faster</td></tr>\n</table>\n<h4>scanf() vs printf()</h4>\n<table>\n<tr><th>scanf()</th><th>printf()</th></tr>\n<tr><td>Input function</td><td>Output function</td></tr>\n<tr><td>Needs <code>&amp;</code> (address) before variables</td><td>Variables written without <code>&amp;</code></td></tr>\n<tr><td>Returns number of items read</td><td>Returns number of characters printed</td></tr>\n</table>"}}, {"h": {"en": "Key Points – 1.5"}, "body": {"en": "<ul>\n<li>I/O functions are in <code>&lt;stdio.h&gt;</code>.</li>\n<li><code>getchar()</code> reads one character; <code>putchar()</code> writes one character.</li>\n<li><code>scanf(\"%d\", &amp;a);</code> – <b>&amp;</b> is compulsory for variables.</li>\n<li><code>printf(\"%6.2f\", x);</code> – width 6, 2 decimals; <code>-</code> flag left-justifies.</li>\n<li>%d int, %f float, %lf double, %c char, %s string, %u unsigned, %ld long.</li>\n</ul>"}, "key": true}]}, {"title": {"en": "1.6 Operators and Expressions"}, "items": [{"h": {"en": "1.6.1 Introduction and Classification of Operators"}, "body": {"en": "<p>An <b>operator</b> is a <b>symbol</b> that tells the computer to perform a mathematical or logical operation. The values on which it operates are called <b>operands</b>. An <b>expression</b> is a combination of operands and operators that gives a value, e.g. <code>a + b * 5</code>.</p>\n<h4>Based on number of operands</h4>\n<ul>\n<li><b>Unary</b> – one operand: <code>-a, ++a, !x, sizeof(a)</code></li>\n<li><b>Binary</b> – two operands: <code>a + b, a &gt; b, a &amp;&amp; b</code></li>\n<li><b>Ternary</b> – three operands: <code>?:</code> (conditional operator)</li>\n</ul>\n<h4>Based on operation – 8 categories (see diagram)</h4>\n<ol>\n<li>Arithmetic operators: <code>+ - * / %</code></li>\n<li>Relational operators: <code>&lt; &lt;= &gt; &gt;= == !=</code></li>\n<li>Logical operators: <code>&amp;&amp; || !</code></li>\n<li>Assignment operators: <code>= += -= *= /= %=</code></li>\n<li>Increment and decrement operators: <code>++ --</code></li>\n<li>Conditional operator: <code>? :</code></li>\n<li>Bitwise operators: <code>&amp; | ^ ~ &lt;&lt; &gt;&gt;</code></li>\n<li>Special operators: <code>, sizeof &amp; * . -&gt;</code></li>\n</ol>"}, "diagram": "c1_operators"}, {"h": {"en": "1.6.2 Arithmetic Operators"}, "body": {"en": "<table>\n<tr><th>Operator</th><th>Meaning</th><th>Example (a = 17, b = 5)</th><th>Result</th></tr>\n<tr><td><code>+</code></td><td>Addition / unary plus</td><td><code>a + b</code></td><td>22</td></tr>\n<tr><td><code>-</code></td><td>Subtraction / unary minus</td><td><code>a - b</code></td><td>12</td></tr>\n<tr><td><code>*</code></td><td>Multiplication</td><td><code>a * b</code></td><td>85</td></tr>\n<tr><td><code>/</code></td><td>Division</td><td><code>a / b</code></td><td>3</td></tr>\n<tr><td><code>%</code></td><td>Modulo (remainder)</td><td><code>a % b</code></td><td>2</td></tr>\n</table>\n<h4>Types of arithmetic</h4>\n<ul>\n<li><b>Integer arithmetic:</b> both operands integers → result integer. Division <b>truncates</b> the fractional part: <code>5 / 2 = 2</code>, <code>-7 / 2 = -3</code>.</li>\n<li><b>Real arithmetic:</b> both operands real → real result: <code>5.0 / 2.0 = 2.5</code>.</li>\n<li><b>Mixed-mode arithmetic:</b> one integer and one real operand → the integer is converted to real and the result is real: <code>5 / 2.0 = 2.5</code>.</li>\n</ul>\n<h4>Modulus operator %</h4>\n<ul>\n<li>Works <b>only with integers</b> (not float/double; use <code>fmod()</code> for reals).</li>\n<li>The sign of the result is the <b>sign of the first operand</b>: <code>-14 % 3 = -2</code>, <code>14 % -3 = 2</code>.</li>\n<li>Uses: checking even/odd (<code>n % 2</code>), extracting digits (<code>n % 10</code>), divisibility.</li>\n</ul>"}, "programs": ["c1p9", "c1p10"]}, {"h": {"en": "1.6.3 Relational Operators"}, "body": {"en": "<p><b>Relational operators</b> compare two values. The result of a relational expression is <b>1 (true)</b> or <b>0 (false)</b>. They are used in decision making (<code>if</code>) and loops.</p>\n<table>\n<tr><th>Operator</th><th>Meaning</th><th>Example (a = 10, b = 20)</th><th>Result</th></tr>\n<tr><td><code>&lt;</code></td><td>less than</td><td><code>a &lt; b</code></td><td>1</td></tr>\n<tr><td><code>&lt;=</code></td><td>less than or equal to</td><td><code>a &lt;= 10</code></td><td>1</td></tr>\n<tr><td><code>&gt;</code></td><td>greater than</td><td><code>a &gt; b</code></td><td>0</td></tr>\n<tr><td><code>&gt;=</code></td><td>greater than or equal to</td><td><code>b &gt;= 25</code></td><td>0</td></tr>\n<tr><td><code>==</code></td><td>equal to</td><td><code>a == b</code></td><td>0</td></tr>\n<tr><td><code>!=</code></td><td>not equal to</td><td><code>a != b</code></td><td>1</td></tr>\n</table>\n<p><b>Note:</b> <code>=</code> is assignment and <code>==</code> is comparison. Writing <code>if (a = 5)</code> instead of <code>if (a == 5)</code> is a common logical error. Arithmetic operators have higher priority than relational operators: <code>a + b &gt; c</code> means <code>(a + b) &gt; c</code>.</p>"}}, {"h": {"en": "1.6.4 Logical Operators"}, "body": {"en": "<p><b>Logical operators</b> combine two or more conditions (relational expressions). The result is 1 (true) or 0 (false). In C, any <b>non-zero value is true</b> and <b>zero is false</b>.</p>\n<table>\n<tr><th>Operator</th><th>Meaning</th><th>Result is true when</th></tr>\n<tr><td><code>&amp;&amp;</code></td><td>Logical AND</td><td>both conditions are true</td></tr>\n<tr><td><code>||</code></td><td>Logical OR</td><td>at least one condition is true</td></tr>\n<tr><td><code>!</code></td><td>Logical NOT</td><td>condition is false (reverses it)</td></tr>\n</table>\n<h4>Truth table</h4>\n<table>\n<tr><th>A</th><th>B</th><th>A &amp;&amp; B</th><th>A || B</th><th>!A</th></tr>\n<tr><td>0</td><td>0</td><td>0</td><td>0</td><td>1</td></tr>\n<tr><td>0</td><td>1</td><td>0</td><td>1</td><td>1</td></tr>\n<tr><td>1</td><td>0</td><td>0</td><td>1</td><td>0</td></tr>\n<tr><td>1</td><td>1</td><td>1</td><td>1</td><td>0</td></tr>\n</table>\n<p><b>Examples:</b> <code>(marks &gt;= 35) &amp;&amp; (marks &lt;= 100)</code>; <code>(ch == 'y') || (ch == 'Y')</code>; <code>!(n % 2)</code> is true for even n.</p>\n<p><b>Short-circuit evaluation:</b> in <code>A &amp;&amp; B</code>, if A is false, B is not evaluated; in <code>A || B</code>, if A is true, B is not evaluated.</p>"}, "programs": ["c1p11"]}, {"h": {"en": "1.6.5 Assignment Operators"}, "body": {"en": "<p>The <b>assignment operator =</b> assigns the value of the expression on the right to the variable on the left: <code>variable = expression;</code></p>\n<p>C also has <b>shorthand (compound) assignment operators</b> of the form <code>v op= exp;</code> which is the same as <code>v = v op (exp);</code></p>\n<pre class=\"c\">a += 5;     // a = a + 5\na -= 2;     // a = a - 2\na *= b + 1; // a = a * (b + 1)\na /= 4;     // a = a / 4\na %= 3;     // a = a % 3</pre>\n<table>\n<tr><th>Simple assignment</th><th>Shorthand</th></tr>\n<tr><td><code>a = a + 1</code></td><td><code>a += 1</code></td></tr>\n<tr><td><code>a = a - 1</code></td><td><code>a -= 1</code></td></tr>\n<tr><td><code>a = a * (n + 1)</code></td><td><code>a *= n + 1</code></td></tr>\n<tr><td><code>a = a / (n + 1)</code></td><td><code>a /= n + 1</code></td></tr>\n<tr><td><code>a = a % b</code></td><td><code>a %= b</code></td></tr>\n</table>\n<h4>Advantages of shorthand operators</h4>\n<ul><li>Left-hand variable is written only once – less typing.</li>\n<li>Statement is more concise and easier to read.</li>\n<li>More efficient.</li></ul>\n<p><b>Multiple assignment:</b> <code>a = b = c = 0;</code> (right-to-left associativity).</p>"}}, {"h": {"en": "1.6.6 Increment and Decrement Operators"}, "body": {"en": "<p><code>++</code> adds 1 to the operand and <code>--</code> subtracts 1. They are <b>unary</b> operators and work only on variables (not constants: <code>5++</code> is invalid).</p>\n<table>\n<tr><th>Form</th><th>Name</th><th>Meaning</th></tr>\n<tr><td><code>++a</code></td><td>Pre-increment (prefix)</td><td>First increment a, then use the new value</td></tr>\n<tr><td><code>a++</code></td><td>Post-increment (postfix)</td><td>First use the current value, then increment</td></tr>\n<tr><td><code>--a</code></td><td>Pre-decrement</td><td>First decrement, then use</td></tr>\n<tr><td><code>a--</code></td><td>Post-decrement</td><td>First use, then decrement</td></tr>\n</table>\n<p>When used alone (<code>a++;</code> or <code>++a;</code>) both forms give the same result. The difference appears in expressions:</p>\n<ul>\n<li><code>a = 5; b = ++a;</code> → a = 6, b = 6</li>\n<li><code>a = 5; b = a++;</code> → a = 6, b = 5</li>\n</ul>\n<p><b>Caution:</b> do not use the same variable with ++/-- more than once in one expression (e.g. <code>a++ + ++a</code>) – the result is <b>undefined</b> and differs between compilers.</p>"}, "programs": ["c1p12"]}, {"h": {"en": "1.6.7 Conditional Operator"}, "body": {"en": "<p>The <b>conditional operator ?:</b> is the only <b>ternary operator</b> in C (three operands). It is a short form of a simple <code>if…else</code>.</p>\n<p><b>Syntax:</b> <code>exp1 ? exp2 : exp3</code></p>\n<p><code>exp1</code> is evaluated first. If it is <b>true (non-zero)</b>, <code>exp2</code> is evaluated and becomes the value of the whole expression; otherwise <code>exp3</code> is evaluated.</p>\n<pre class=\"c\">max = (a &gt; b) ? a : b;\nprintf(\"%s\\n\", (n % 2 == 0) ? \"Even\" : \"Odd\");</pre>\n<p>Equivalent <code>if…else</code>: <code>if (a &gt; b) max = a; else max = b;</code></p>\n<p>It can be <b>nested</b> to find the largest of three numbers (see program), but deep nesting reduces readability.</p>"}, "programs": ["c1p13"]}, {"h": {"en": "1.6.8 Bitwise Operators"}, "body": {"en": "<p><b>Bitwise operators</b> work on the individual <b>bits</b> (0/1) of integer operands (<code>char, int, long</code>; not float/double). They are used in low-level programming, device control, encryption and compression.</p>\n<table>\n<tr><th>Operator</th><th>Meaning</th><th>Rule</th></tr>\n<tr><td><code>&amp;</code></td><td>Bitwise AND</td><td>1 if both bits are 1</td></tr>\n<tr><td><code>|</code></td><td>Bitwise OR</td><td>1 if any bit is 1</td></tr>\n<tr><td><code>^</code></td><td>Bitwise XOR</td><td>1 if bits are different</td></tr>\n<tr><td><code>~</code></td><td>One's complement</td><td>Inverts every bit (unary); ~a = −(a+1)</td></tr>\n<tr><td><code>&lt;&lt;</code></td><td>Left shift</td><td>Shifts bits left; a &lt;&lt; n = a × 2ⁿ</td></tr>\n<tr><td><code>&gt;&gt;</code></td><td>Right shift</td><td>Shifts bits right; a &gt;&gt; n = a ÷ 2ⁿ</td></tr>\n</table>\n<h4>Example: a = 12 (0000 1100), b = 10 (0000 1010)</h4>\n<table>\n<tr><th>Expression</th><th>Binary</th><th>Decimal</th></tr>\n<tr><td><code>a &amp; b</code></td><td>0000 1000</td><td>8</td></tr>\n<tr><td><code>a | b</code></td><td>0000 1110</td><td>14</td></tr>\n<tr><td><code>a ^ b</code></td><td>0000 0110</td><td>6</td></tr>\n<tr><td><code>a &lt;&lt; 2</code></td><td>0011 0000</td><td>48</td></tr>\n<tr><td><code>a &gt;&gt; 2</code></td><td>0000 0011</td><td>3</td></tr>\n<tr><td><code>~a</code></td><td>1111 0011</td><td>−13</td></tr>\n</table>\n<p><b>Logical vs bitwise:</b> <code>&amp;&amp;</code> works on whole values (true/false), <code>&amp;</code> works bit by bit: <code>12 &amp;&amp; 10 = 1</code> but <code>12 &amp; 10 = 8</code>.</p>"}, "programs": ["c1p14"]}, {"h": {"en": "1.6.9 Special Operators"}, "body": {"en": "<h4>1. Comma operator ( , )</h4>\n<p>Links related expressions together. Expressions are evaluated <b>left to right</b> and the value of the <b>rightmost</b> expression is the value of the whole expression.</p>\n<pre class=\"c\">int a, b, c;\nc = (a = 10, b = 20, a + b);     // c = 30\n// comma in for loop\nfor (i = 0, j = 10; i &lt; j; i++, j--)\n    ;</pre>\n<h4>2. sizeof operator</h4>\n<p>A compile-time unary operator that returns the <b>number of bytes</b> occupied by a variable, constant or data type. Used to find sizes of arrays/structures and for dynamic memory allocation.</p>\n<pre class=\"c\">int n;\n// 4 (on GCC)\nprintf(\"%zu\", sizeof(n));\nprintf(\"%zu\", sizeof(double));  // 8</pre>\n<h4>3. Pointer operators – &amp; and *</h4>\n<p><code>&amp;</code> (address of) gives the memory address of a variable: <code>&amp;a</code>. <code>*</code> (indirection / value at address) gives the value stored at an address: <code>*p</code>. (Details in Unit 3.)</p>\n<h4>4. Member selection operators – . and -&gt;</h4>\n<p>Used to access members of structures and unions: <code>s.roll</code> (with a structure variable) and <code>p-&gt;roll</code> (with a pointer to a structure).</p>"}}, {"h": {"en": "1.6.10 Arithmetic Expressions and Their Evaluation"}, "body": {"en": "<p>An <b>arithmetic expression</b> is a combination of variables, constants and arithmetic operators. Algebraic expressions must be written in C form – multiplication must be shown with <code>*</code> and there is no operator for power (use <code>pow()</code> from <code>&lt;math.h&gt;</code>).</p>\n<table>\n<tr><th>Algebraic expression</th><th>C expression</th></tr>\n<tr><td>a × b − c</td><td><code>a * b - c</code></td></tr>\n<tr><td>(m + n)(x + y)</td><td><code>(m + n) * (x + y)</code></td></tr>\n<tr><td>ab / c</td><td><code>a * b / c</code></td></tr>\n<tr><td>3x² + 2x + 1</td><td><code>3 * x * x + 2 * x + 1</code></td></tr>\n<tr><td>x / y + c</td><td><code>x / y + c</code></td></tr>\n<tr><td>(a + b) / (c + d)</td><td><code>(a + b) / (c + d)</code></td></tr>\n<tr><td>√(b² − 4ac)</td><td><code>sqrt(b * b - 4 * a * c)</code></td></tr>\n<tr><td>πr²</td><td><code>3.14 * r * r</code></td></tr>\n</table>\n<h4>Evaluation</h4>\n<p>Expressions are evaluated using an assignment statement <code>variable = expression;</code>. All variables in the expression must have values before evaluation. The expression is evaluated first and the result replaces the previous value of the variable on the left.</p>\n<p>e.g. <code>x = a * b - c;</code> &nbsp; <code>y = b / c * a;</code> &nbsp; <code>z = a - b / c + d;</code></p>"}, "programs": ["c1p5"]}, {"h": {"en": "1.6.11 Precedence of Arithmetic Operators"}, "body": {"en": "<p>When an expression has more than one operator, the order of evaluation is decided by <b>precedence (priority)</b>. Arithmetic operators have two priority levels:</p>\n<ul>\n<li><b>High priority:</b> <code>*  /  %</code></li>\n<li><b>Low priority:</b> <code>+  -</code></li>\n</ul>\n<p>Operators of the same priority are evaluated <b>left to right</b> (associativity). Expressions in <b>parentheses ( )</b> are evaluated first; innermost parentheses first.</p>\n<h4>Example 1: x = a - b / 3 + c * 2 - 1, with a = 9, b = 12, c = 3</h4>\n<p><b>First pass</b> (high priority, left to right):<br>Step 1: b / 3 = 12 / 3 = 4 → x = 9 − 4 + c * 2 − 1<br>Step 2: c * 2 = 3 * 2 = 6 → x = 9 − 4 + 6 − 1</p>\n<p><b>Second pass</b> (low priority, left to right):<br>Step 3: 9 − 4 = 5<br>Step 4: 5 + 6 = 11<br>Step 5: 11 − 1 = <b>10</b></p>\n<h4>Example 2: y = a - b / (3 + c) * (2 - 1)</h4>\n<p>Parentheses first: (3 + c) = 6, (2 − 1) = 1 → y = 9 − 12 / 6 * 1<br>Then: 12 / 6 = 2 → 2 * 1 = 2 → 9 − 2 = <b>7</b></p>\n<p><b>Rules:</b> use parentheses to make the order clear; the number of opening and closing parentheses must be equal.</p>"}}, {"h": {"en": "1.6.12 Type Conversions in Expressions"}, "body": {"en": "<p>When an expression contains operands of different data types, they are converted to a common type. There are two kinds of type conversion:</p>\n<h4>1. Implicit (automatic) type conversion</h4>\n<p>Done <b>automatically by the compiler</b>. In a mixed expression, the operand of the <b>lower type is promoted to the higher type</b> before the operation, and the result is of the higher type (see hierarchy diagram). This is also called <b>type promotion</b>.</p>\n<ul>\n<li><code>char</code> and <code>short</code> are always converted to <code>int</code>.</li>\n<li>int + float → float; int + double → double; float + double → double; int + long → long.</li>\n<li>In an <b>assignment</b>, the right side is converted to the type of the left side. If a higher type is assigned to a lower type, data may be lost: float → int truncates the fraction; double → float rounds digits; long → int drops higher bits.</li>\n</ul>\n<p>e.g. <code>int i = 5; float f = 2.5; double d = i * f;</code> → i is promoted to float, i * f = 12.5 (float), then converted to double.</p>\n<h4>2. Explicit type conversion (type casting)</h4>\n<p>Done <b>by the programmer</b> using the <b>cast operator</b>.</p>\n<p><b>Syntax:</b> <code>(type_name) expression</code></p>\n<pre class=\"c\">int a = 7, b = 2;\n// 3.000000 (integer division first)\nfloat r1 = a / b;\nfloat r2 = (float) a / b;    // 3.500000\n// 9 (fraction truncated)\nint   k  = (int) 9.87;</pre>\n<table>\n<tr><th>Implicit conversion</th><th>Explicit conversion (casting)</th></tr>\n<tr><td>Automatic, by compiler</td><td>Done by programmer with (type)</td></tr>\n<tr><td>Lower → higher type (promotion)</td><td>Any type to any type</td></tr>\n<tr><td>No data loss in expressions</td><td>Data may be lost (e.g. (int) 9.87 = 9)</td></tr>\n</table>"}, "diagram": "c1_type_hierarchy", "programs": ["c1p16"]}, {"h": {"en": "1.6.13 Operator Precedence and Associativity"}, "body": {"en": "<p><b>Precedence</b> decides which operator is evaluated first when an expression has different operators. <b>Associativity</b> decides the order (left-to-right or right-to-left) when operators of the <b>same precedence</b> appear together.</p>\n<table>\n<tr><th>Rank</th><th>Operators</th><th>Description</th><th>Associativity</th></tr>\n<tr><td>1</td><td><code>() [] -&gt; .</code></td><td>Function call, array, member</td><td>Left to right</td></tr>\n<tr><td>2</td><td><code>+ - ++ -- ! ~ * &amp; sizeof (type)</code></td><td>Unary operators</td><td>Right to left</td></tr>\n<tr><td>3</td><td><code>* / %</code></td><td>Multiplicative</td><td>Left to right</td></tr>\n<tr><td>4</td><td><code>+ -</code></td><td>Additive</td><td>Left to right</td></tr>\n<tr><td>5</td><td><code>&lt;&lt; &gt;&gt;</code></td><td>Shift</td><td>Left to right</td></tr>\n<tr><td>6</td><td><code>&lt; &lt;= &gt; &gt;=</code></td><td>Relational</td><td>Left to right</td></tr>\n<tr><td>7</td><td><code>== !=</code></td><td>Equality</td><td>Left to right</td></tr>\n<tr><td>8</td><td><code>&amp;</code></td><td>Bitwise AND</td><td>Left to right</td></tr>\n<tr><td>9</td><td><code>^</code></td><td>Bitwise XOR</td><td>Left to right</td></tr>\n<tr><td>10</td><td><code>|</code></td><td>Bitwise OR</td><td>Left to right</td></tr>\n<tr><td>11</td><td><code>&amp;&amp;</code></td><td>Logical AND</td><td>Left to right</td></tr>\n<tr><td>12</td><td><code>||</code></td><td>Logical OR</td><td>Left to right</td></tr>\n<tr><td>13</td><td><code>?:</code></td><td>Conditional</td><td>Right to left</td></tr>\n<tr><td>14</td><td><code>= += -= *= /= %= &amp;= ^= |= &lt;&lt;= &gt;&gt;=</code></td><td>Assignment</td><td>Right to left</td></tr>\n<tr><td>15</td><td><code>,</code></td><td>Comma</td><td>Left to right</td></tr>\n</table>\n<h4>Example</h4>\n<p><code>if (x == 10 + 15 &amp;&amp; y &lt; 10)</code> with x = 20, y = 5:<br>\n1. <code>10 + 15</code> = 25 (arithmetic first)<br>\n2. <code>x == 25</code> → 0 (false); <code>y &lt; 10</code> → 1 (true) (relational before equality, both before &amp;&amp;)<br>\n3. <code>0 &amp;&amp; 1</code> → <b>0</b> (false)</p>\n<p><b>Memory aid:</b> Unary → Arithmetic → Shift → Relational → Equality → Bitwise → Logical → Conditional → Assignment → Comma.</p>"}}, {"h": {"en": "Key Points – 1.6"}, "body": {"en": "<ul>\n<li>8 operator types: arithmetic, relational, logical, assignment, ++/--, conditional, bitwise, special.</li>\n<li>Integer division truncates (5/2 = 2); % only for integers; sign of % = sign of first operand.</li>\n<li>Relational/logical results are 1 or 0; <code>&amp;&amp;</code> and <code>||</code> use short-circuit evaluation.</li>\n<li><code>b = ++a</code> (increment then use) vs <code>b = a++</code> (use then increment).</li>\n<li><code>?:</code> is the only ternary operator. <code>~a = -(a+1)</code>; <code>a&lt;&lt;n = a×2ⁿ</code>.</li>\n<li>Precedence: <code>* / %</code> before <code>+ -</code>; same level left to right; parentheses first.</li>\n<li>Implicit conversion: lower → higher type; explicit: <code>(float) a / b</code>.</li>\n<li>Unary, conditional and assignment operators are right-to-left associative.</li>\n</ul>"}, "key": true}]}], "programs": [{"id": "c1p1", "title": {"en": "Hello World – first C program"}, "code": {"en": "/* Program to print a message */\n// link section: header file\n#include <stdio.h>\n\n// execution starts here\nint main(void)\n{\n    printf(\"Hello, World!\\n\");\n    printf(\"Welcome to C Programming.\\n\");\n    // program ended successfully\n    return 0;\n}"}, "out": "Hello, World!\nWelcome to C Programming.", "expl": {"en": "<ul><li><code>#include &lt;stdio.h&gt;</code> adds the standard input-output header which declares <code>printf()</code>.</li>\n<li><code>main()</code> is the function where every C program starts executing.</li>\n<li><code>\\n</code> is the newline escape sequence; it moves the cursor to the next line.</li>\n<li><code>return 0;</code> tells the operating system that the program ended normally.</li></ul>"}}, {"id": "c1p2", "title": {"en": "Sum of two numbers (input from user)"}, "code": {"en": "#include <stdio.h>\n\nint main(void)\n{\n    // declaration\n    int a, b, sum;\n\n    printf(\"Enter two numbers: \");\n    // read two integers\n    scanf(\"%d %d\", &a, &b);\n\n    // process\n    sum = a + b;\n    printf(\"Sum = %d\\n\", sum);\n    return 0;\n}"}, "out": "Enter two numbers: 25 17\nSum = 42", "expl": {"en": "<p>This program follows the flowchart <b>Read → Process → Print</b>. <code>scanf()</code> needs the <b>address</b> of each variable, so <code>&amp;a</code> and <code>&amp;b</code> are used. <code>%d</code> is the format specifier for <code>int</code>.</p>"}}, {"id": "c1p3", "title": {"en": "Area and circumference of a circle using symbolic constant"}, "code": {"en": "#include <stdio.h>\n// symbolic constant\n#define PI 3.14159\n\nint main(void)\n{\n    float r, area, circum;\n\n    printf(\"Enter radius: \");\n    scanf(\"%f\", &r);\n\n    area   = PI * r * r;\n    circum = 2 * PI * r;\n\n    // 2 digits after decimal\n    printf(\"Area = %.2f\\n\", area);\n    printf(\"Circumference = %.2f\\n\", circum);\n    return 0;\n}"}, "out": "Enter radius: 5\nArea = 78.54\nCircumference = 31.42", "expl": {"en": "<p><code>#define PI 3.14159</code> creates a <b>symbolic constant</b>. Before compilation the preprocessor replaces every <code>PI</code> with <code>3.14159</code>. <code>%.2f</code> prints a float with 2 digits after the decimal point.</p>"}}, {"id": "c1p4", "title": {"en": "Simple interest"}, "code": {"en": "#include <stdio.h>\n\nint main(void)\n{\n    float p, r, n, si;\n\n    printf(\"Enter principal amount: \");\n    scanf(\"%f\", &p);\n    // %% prints % sign\n    printf(\"Enter rate of interest (%%): \");\n    scanf(\"%f\", &r);\n    printf(\"Enter number of years: \");\n    scanf(\"%f\", &n);\n\n    si = (p * r * n) / 100;\n    printf(\"Simple Interest = %.2f\\n\", si);\n    printf(\"Total Amount    = %.2f\\n\", p + si);\n    return 0;\n}"}, "out": "Enter principal amount: 10000\nEnter rate of interest (%): 8.5\nEnter number of years: 3\nSimple Interest = 2550.00\nTotal Amount    = 12550.00", "expl": {"en": "<p>Formula: <b>SI = P × R × N / 100</b>. To print a <code>%</code> sign inside <code>printf()</code>, write <code>%%</code>.</p>"}}, {"id": "c1p5", "title": {"en": "Convert temperature from Celsius to Fahrenheit"}, "code": {"en": "#include <stdio.h>\n\nint main(void)\n{\n    float c, f;\n\n    printf(\"Enter temperature in Celsius: \");\n    scanf(\"%f\", &c);\n\n    // use 9.0/5.0, not 9/5\n    f = (9.0 / 5.0) * c + 32;\n\n    printf(\"%.2f Celsius = %.2f Fahrenheit\\n\", c, f);\n    return 0;\n}"}, "out": "Enter temperature in Celsius: 37\n37.00 Celsius = 98.60 Fahrenheit", "expl": {"en": "<p>Formula: <b>F = (9/5) × C + 32</b>. In C, <code>9/5</code> is <b>integer division</b> and gives <code>1</code>, which would give a wrong answer. Writing <code>9.0/5.0</code> makes it real division (1.8).</p>"}}, {"id": "c1p6", "title": {"en": "Swap two numbers (with and without third variable)"}, "code": {"en": "#include <stdio.h>\n\nint main(void)\n{\n    int a, b, temp;\n\n    printf(\"Enter a and b: \");\n    scanf(\"%d %d\", &a, &b);\n\n    /* Method 1: using third variable */\n    temp = a;\n    a = b;\n    b = temp;\n    printf(\"After swap (temp)   : a = %d, b = %d\\n\", a, b);\n\n    /* Method 2: without third variable */\n    a = a + b;\n    b = a - b;\n    a = a - b;\n    printf(\"After swap again    : a = %d, b = %d\\n\", a, b);\n    return 0;\n}"}, "out": "Enter a and b: 10 20\nAfter swap (temp)   : a = 20, b = 10\nAfter swap again    : a = 10, b = 20", "expl": {"en": "<p><b>Method 1:</b> the value of <code>a</code> is saved in <code>temp</code>, then <code>a = b</code> and <code>b = temp</code>.</p>\n<p><b>Method 2:</b> a = 10 + 20 = 30; b = 30 − 20 = 10; a = 30 − 10 = 20. The second swap brings the numbers back to the original order.</p>"}}, {"id": "c1p7", "title": {"en": "Read a character, print it, its ASCII value and uppercase"}, "code": {"en": "#include <stdio.h>\n// for toupper()\n#include <ctype.h>\n\nint main(void)\n{\n    char ch;\n\n    printf(\"Enter a character: \");\n    // read one character\n    ch = getchar();\n\n    printf(\"You entered: \");\n    // write one character\n    putchar(ch);\n    putchar('\\n');\n\n    printf(\"ASCII value = %d\\n\", ch);\n    printf(\"Uppercase   = %c\\n\", toupper(ch));\n    return 0;\n}"}, "out": "Enter a character: g\nYou entered: g\nASCII value = 103\nUppercase   = G", "expl": {"en": "<p><code>getchar()</code> reads <b>one character</b> from the keyboard and <code>putchar()</code> displays one character. A <code>char</code> is stored as its <b>ASCII code</b>, so printing it with <code>%d</code> shows the number (g = 103). <code>toupper()</code> from <code>&lt;ctype.h&gt;</code> converts to uppercase.</p>"}}, {"id": "c1p8", "title": {"en": "Formatted output with printf() – width, precision and flags"}, "code": {"en": "#include <stdio.h>\n\nint main(void)\n{\n    int n = 9876;\n    float x = 98.7654;\n\n    printf(\"[%d]\\n\", n);        // normal\n    // width 6, right aligned\n    printf(\"[%6d]\\n\", n);\n    // left aligned\n    printf(\"[%-6d]\\n\", n);\n    // padded with zeros\n    printf(\"[%06d]\\n\", n);\n    // width less than digits\n    printf(\"[%2d]\\n\", n);\n\n    // 6 decimals by default\n    printf(\"[%f]\\n\", x);\n    // 2 decimals\n    printf(\"[%.2f]\\n\", x);\n    // width 8, 2 decimals\n    printf(\"[%8.2f]\\n\", x);\n    // exponent form\n    printf(\"[%e]\\n\", x);\n\n    printf(\"[%c] [%s]\\n\", 'A', \"GTU\");\n    printf(\"[%10s] [%-10s]\\n\", \"GTU\", \"GTU\");\n    return 0;\n}"}, "out": "[9876]\n[  9876]\n[9876  ]\n[009876]\n[9876]\n[98.765404]\n[98.77]\n[   98.77]\n[9.876540e+01]\n[A] [GTU]\n[       GTU] [GTU       ]", "expl": {"en": "<p>The square brackets show the exact space used by each field.</p>\n<ul><li><code>%6d</code>: minimum width 6, right justified; <code>%-6d</code>: left justified; <code>%06d</code>: leading zeros.</li>\n<li>If the width is smaller than the number (<code>%2d</code>), the full number is still printed.</li>\n<li><code>%.2f</code>: 2 digits after the decimal point (rounded); <code>%8.2f</code>: total width 8.</li>\n<li><code>%e</code>: exponential (scientific) notation.</li>\n<li><code>%f</code> printed 98.765404, not 98.765400, because a <code>float</code> stores only about 6–7 significant digits accurately.</li></ul>"}}, {"id": "c1p9", "title": {"en": "Arithmetic operators"}, "code": {"en": "#include <stdio.h>\n\nint main(void)\n{\n    int a, b;\n\n    printf(\"Enter two integers: \");\n    scanf(\"%d %d\", &a, &b);\n\n    printf(\"a + b = %d\\n\", a + b);\n    printf(\"a - b = %d\\n\", a - b);\n    printf(\"a * b = %d\\n\", a * b);\n    // integer division\n    printf(\"a / b = %d\\n\", a / b);\n    // remainder\n    printf(\"a %% b = %d\\n\", a % b);\n    printf(\"Real division = %.2f\\n\", (float)a / b);\n    return 0;\n}"}, "out": "Enter two integers: 17 5\na + b = 22\na - b = 12\na * b = 85\na / b = 3\na % b = 2\nReal division = 3.40", "expl": {"en": "<p>17 / 5 gives <b>3</b> because both operands are integers (fractional part is truncated). <code>17 % 5</code> gives the remainder <b>2</b>. Casting one operand to <code>float</code> gives real division 3.40.</p>"}}, {"id": "c1p10", "title": {"en": "Sum of digits of a three-digit number"}, "code": {"en": "#include <stdio.h>\n\nint main(void)\n{\n    int n, d1, d2, d3;\n\n    printf(\"Enter a 3-digit number: \");\n    scanf(\"%d\", &n);\n\n    d3 = n % 10;            // last digit\n    d2 = (n / 10) % 10;     // middle digit\n    d1 = n / 100;           // first digit\n\n    printf(\"Digits: %d %d %d\\n\", d1, d2, d3);\n    printf(\"Sum of digits = %d\\n\", d1 + d2 + d3);\n    printf(\"Reverse = %d%d%d\\n\", d3, d2, d1);\n    return 0;\n}"}, "out": "Enter a 3-digit number: 472\nDigits: 4 7 2\nSum of digits = 13\nReverse = 274", "expl": {"en": "<p><code>n % 10</code> gives the last digit, <code>n / 10</code> removes the last digit (integer division), and <code>n / 100</code> gives the first digit of a 3-digit number.</p>"}}, {"id": "c1p11", "title": {"en": "Relational and logical operators"}, "code": {"en": "#include <stdio.h>\n\nint main(void)\n{\n    int a = 10, b = 20;\n\n    printf(\"a <  b : %d\\n\", a < b);\n    printf(\"a >  b : %d\\n\", a > b);\n    printf(\"a == b : %d\\n\", a == b);\n    printf(\"a != b : %d\\n\", a != b);\n\n    printf(\"(a > 5) && (b > 5) : %d\\n\", (a > 5) && (b > 5));\n    printf(\"(a > 15) || (b > 15): %d\\n\", (a > 15) || (b > 15));\n    printf(\"!(a == 10)         : %d\\n\", !(a == 10));\n    return 0;\n}"}, "out": "a <  b : 1\na >  b : 0\na == b : 0\na != b : 1\n(a > 5) && (b > 5) : 1\n(a > 15) || (b > 15): 1\n!(a == 10)         : 0", "expl": {"en": "<p>Relational and logical expressions give <b>1 for true</b> and <b>0 for false</b>. <code>&amp;&amp;</code> is true only if both conditions are true; <code>||</code> is true if any one is true; <code>!</code> reverses the result.</p>"}}, {"id": "c1p12", "title": {"en": "Increment and decrement operators (prefix and postfix)"}, "code": {"en": "#include <stdio.h>\n\nint main(void)\n{\n    int a = 5, b;\n\n    // prefix: first increment, then use\n    b = ++a;\n    printf(\"Prefix : a = %d, b = %d\\n\", a, b);\n\n    a = 5;\n    // postfix: first use, then increment\n    b = a++;\n    printf(\"Postfix: a = %d, b = %d\\n\", a, b);\n\n    a = 5;\n    b = --a;\n    printf(\"--a    : a = %d, b = %d\\n\", a, b);\n\n    a = 5;\n    b = a--;\n    printf(\"a--    : a = %d, b = %d\\n\", a, b);\n    return 0;\n}"}, "out": "Prefix : a = 6, b = 6\nPostfix: a = 6, b = 5\n--a    : a = 4, b = 4\na--    : a = 4, b = 5", "expl": {"en": "<ul><li><b>Prefix</b> (<code>++a</code>): the value is incremented first and then the new value is used → a = 6, b =
