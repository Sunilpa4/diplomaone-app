 6.</li>\n<li><b>Postfix</b> (<code>a++</code>): the old value is used first and then incremented → b = 5, a = 6.</li></ul>"}}, {"id": "c1p13", "title": {"en": "Largest of three numbers using conditional operator"}, "code": {"en": "#include <stdio.h>\n\nint main(void)\n{\n    int a, b, c, max;\n\n    printf(\"Enter three numbers: \");\n    scanf(\"%d %d %d\", &a, &b, &c);\n\n    // nested ?:\n    max = (a > b) ? ((a > c) ? a : c) : ((b > c) ? b : c);\n\n    printf(\"Largest = %d\\n\", max);\n    return 0;\n}"}, "out": "Enter three numbers: 25 67 43\nLargest = 67", "expl": {"en": "<p>Syntax: <code>condition ? expr1 : expr2</code>. If <code>a &gt; b</code> is true, we compare a with c, otherwise b with c. This is the same logic as the flowchart <i>Largest of Three Numbers</i>.</p>"}}, {"id": "c1p14", "title": {"en": "Bitwise operators"}, "code": {"en": "#include <stdio.h>\n\nint main(void)\n{\n    // 12 = 1100, 10 = 1010\n    int a = 12, b = 10;\n\n    // 1000 = 8\n    printf(\"a & b  = %d\\n\", a & b);\n    // 1110 = 14\n    printf(\"a | b  = %d\\n\", a | b);\n    // 0110 = 6\n    printf(\"a ^ b  = %d\\n\", a ^ b);\n    // -(a+1) = -13\n    printf(\"~a     = %d\\n\", ~a);\n    // 12 x 4 = 48\n    printf(\"a << 2 = %d\\n\", a << 2);\n    // 12 / 4 = 3\n    printf(\"a >> 2 = %d\\n\", a >> 2);\n    return 0;\n}"}, "out": "a & b  = 8\na | b  = 14\na ^ b  = 6\n~a     = -13\na << 2 = 48\na >> 2 = 3", "expl": {"en": "<table><tr><th>Operation</th><th>Binary</th><th>Result</th></tr>\n<tr><td>12 &amp; 10</td><td>1100 &amp; 1010 = 1000</td><td>8</td></tr>\n<tr><td>12 | 10</td><td>1100 | 1010 = 1110</td><td>14</td></tr>\n<tr><td>12 ^ 10</td><td>1100 ^ 1010 = 0110</td><td>6</td></tr>\n<tr><td>~12</td><td>one's complement</td><td>−13</td></tr>\n<tr><td>12 &lt;&lt; 2</td><td>110000</td><td>48 (× 2²)</td></tr>\n<tr><td>12 &gt;&gt; 2</td><td>0011</td><td>3 (÷ 2²)</td></tr></table>"}}, {"id": "c1p15", "title": {"en": "Size of data types using sizeof operator"}, "code": {"en": "#include <stdio.h>\n\nint main(void)\n{\n    printf(\"char        : %zu byte\\n\",  sizeof(char));\n    printf(\"short int   : %zu bytes\\n\", sizeof(short));\n    printf(\"int         : %zu bytes\\n\", sizeof(int));\n    printf(\"long int    : %zu bytes\\n\", sizeof(long));\n    printf(\"float       : %zu bytes\\n\", sizeof(float));\n    printf(\"double      : %zu bytes\\n\", sizeof(double));\n    printf(\"long double : %zu bytes\\n\", sizeof(long double));\n    return 0;\n}"}, "out": "char        : 1 byte\nshort int   : 2 bytes\nint         : 4 bytes\nlong int    : 8 bytes\nfloat       : 4 bytes\ndouble      : 8 bytes\nlong double : 16 bytes", "expl": {"en": "<p>This output is from <b>GCC on a 64-bit Linux system</b>. Sizes depend on the compiler: in the old 16-bit <b>Turbo C</b>, <code>int</code> is 2 bytes, <code>long</code> is 4 bytes and <code>long double</code> is 10 bytes. <code>%zu</code> is the format specifier for the result of <code>sizeof</code> (in Turbo C use <code>%d</code>).</p>"}}, {"id": "c1p16", "title": {"en": "Average of marks – implicit and explicit type conversion"}, "code": {"en": "#include <stdio.h>\n\nint main(void)\n{\n    int m1 = 75, m2 = 82, m3 = 90, total;\n    float avg1, avg2;\n\n    // 247\n    total = m1 + m2 + m3;\n\n    // int / int = 82 (fraction lost)\n    avg1 = total / 3;\n    // explicit cast\n    avg2 = (float) total / 3;\n\n    printf(\"Total = %d\\n\", total);\n    printf(\"Average without cast = %.2f\\n\", avg1);\n    printf(\"Average with cast    = %.2f\\n\", avg2);\n    return 0;\n}"}, "out": "Total = 247\nAverage without cast = 82.00\nAverage with cast    = 82.33", "expl": {"en": "<p><code>total / 3</code> is integer division, so 247 / 3 = 82; only then is it converted to float (82.00) – the fraction is lost. With <code>(float) total</code> the division is done in float: 247.0 / 3 = 82.33.</p>"}}], "diagrams": [{"id": "c1_fc_symbols", "title": {"en": "Flowchart Symbols"}, "file": "diagrams/c1_fc_symbols.svg"}, {"id": "c1_fc_sum", "title": {"en": "Flowchart: Sum of Two Numbers"}, "file": "diagrams/c1_fc_sum.svg"}, {"id": "c1_fc_largest", "title": {"en": "Flowchart: Largest of Three Numbers"}, "file": "diagrams/c1_fc_largest.svg"}, {"id": "c1_fc_factorial", "title": {"en": "Flowchart: Factorial of N (Loop)"}, "file": "diagrams/c1_fc_factorial.svg"}, {"id": "c1_structure", "title": {"en": "Basic Structure of a C Program"}, "file": "diagrams/c1_structure.svg"}, {"id": "c1_execute", "title": {"en": "Executing a C Program"}, "file": "diagrams/c1_execute.svg"}, {"id": "c1_tokens", "title": {"en": "C Tokens"}, "file": "diagrams/c1_tokens.svg"}, {"id": "c1_datatypes", "title": {"en": "Classification of Data Types"}, "file": "diagrams/c1_datatypes.svg"}, {"id": "c1_type_hierarchy", "title": {"en": "Implicit Type Conversion Hierarchy"}, "file": "diagrams/c1_type_hierarchy.svg"}, {"id": "c1_operators", "title": {"en": "Classification of C Operators"}, "file": "diagrams/c1_operators.svg"}], "syntax": [{"title": {"en": "Program Structure"}, "items": [{"name": {"en": "Minimum C program"}, "f": "#include <stdio.h>\nint main(void)\n{\n    statements;\n    return 0;\n}", "terms": {"en": "Every program needs exactly one main()."}}, {"name": {"en": "Comments"}, "f": "/* multi-line comment */\n// single-line comment (C99)", "terms": {"en": "Ignored by the compiler."}}, {"name": {"en": "Header file"}, "f": "#include <stdio.h>\n#include <math.h>\n#include <ctype.h>", "terms": {"en": "Link section."}}, {"name": {"en": "Symbolic constant"}, "f": "#define NAME value\n#define PI 3.14159", "terms": {"en": "No semicolon, no = sign."}}, {"name": {"en": "const variable"}, "f": "const int MAX = 100;", "terms": {"en": "Value cannot be changed."}}]}, {"title": {"en": "Variables and Data Types"}, "items": [{"name": {"en": "Declaration"}, "f": "data_type var1, var2;\nint a, b;  float x;  char ch;", "terms": {"en": ""}}, {"name": {"en": "Initialization"}, "f": "int count = 0;\nfloat rate = 8.5f;\nchar grade = 'A';", "terms": {"en": ""}}, {"name": {"en": "Multiple assignment"}, "f": "a = b = c = 0;", "terms": {"en": "Right to left."}}, {"name": {"en": "typedef"}, "f": "typedef int marks;\nmarks m1, m2;", "terms": {"en": "New name for an existing type."}}, {"name": {"en": "enum"}, "f": "enum day {Mon, Tue, Wed};\nenum day d = Tue;   /* d = 1 */", "terms": {"en": ""}}]}, {"title": {"en": "Input / Output"}, "items": [{"name": {"en": "Read / write a character"}, "f": "ch = getchar();\nputchar(ch);", "terms": {"en": ""}}, {"name": {"en": "Formatted input"}, "f": "scanf(\"control string\", &var1, &var2);\nscanf(\"%d %f\", &n, &x);", "terms": {"en": "& is required before variables."}}, {"name": {"en": "Formatted output"}, "f": "printf(\"control string\", var1, var2);\nprintf(\"Sum = %d\\n\", sum);", "terms": {"en": ""}}, {"name": {"en": "Width and precision"}, "f": "printf(\"%6d\", n);    /* width 6 */\nprintf(\"%-6d\", n);   /* left */\nprintf(\"%8.2f\", x);  /* 2 decimals */", "terms": {"en": "%[flag][width][.precision]type"}}, {"name": {"en": "Format specifiers"}, "f": "%d int   %f float   %lf double\n%c char  %s string  %u unsigned\n%ld long %o octal   %x hex   %e exp", "terms": {"en": ""}}, {"name": {"en": "Escape sequences"}, "f": "\\n newline   \\t tab     \\a beep\n\\b backspace \\\\ backslash \\0 null\n\\' quote     \\\" dquote  \\r return", "terms": {"en": ""}}]}, {"title": {"en": "Operators"}, "items": [{"name": {"en": "Arithmetic"}, "f": "a + b   a - b   a * b   a / b   a % b", "terms": {"en": "% only with integers."}}, {"name": {"en": "Relational"}, "f": "a < b   a <= b   a > b   a >= b   a == b   a != b", "terms": {"en": "Result 1 or 0."}}, {"name": {"en": "Logical"}, "f": "(a > 0) && (b > 0)\n(a > 0) || (b > 0)\n!(a > 0)", "terms": {"en": ""}}, {"name": {"en": "Shorthand assignment"}, "f": "a += 5;  a -= 5;  a *= 5;  a /= 5;  a %= 5;", "terms": {"en": "v op= exp  ≡  v = v op (exp)"}}, {"name": {"en": "Increment / decrement"}, "f": "++a;  a++;  --a;  a--;", "terms": {"en": "Prefix: change then use; postfix: use then change."}}, {"name": {"en": "Conditional operator"}, "f": "variable = exp1 ? exp2 : exp3;\nmax = (a > b) ? a : b;", "terms": {"en": ""}}, {"name": {"en": "Bitwise"}, "f": "a & b   a | b   a ^ b   ~a   a << n   a >> n", "terms": {"en": ""}}, {"name": {"en": "sizeof and comma"}, "f": "sizeof(int)   sizeof(x)\nc = (a = 1, b = 2, a + b);", "terms": {"en": ""}}, {"name": {"en": "Type cast"}, "f": "(type_name) expression\navg = (float) total / n;", "terms": {"en": ""}}]}], "viva": [{"title": {"en": "Flowchart and Algorithm"}, "items": [{"q": {"en": "What is a flowchart?"}, "a": {"en": "A pictorial representation of the steps of an algorithm using standard symbols and arrows."}}, {"q": {"en": "Which symbol is used for decision in a flowchart?"}, "a": {"en": "Diamond (rhombus) – it has two exits, Yes and No."}}, {"q": {"en": "Which symbol is used for input/output?"}, "a": {"en": "Parallelogram."}}, {"q": {"en": "What is the use of a connector?"}, "a": {"en": "To join two parts of a flowchart when lines would cross or the chart continues elsewhere."}}, {"q": {"en": "What is an algorithm?"}, "a": {"en": "A finite set of well-defined step-by-step instructions to solve a problem."}}, {"q": {"en": "List the characteristics of an algorithm."}, "a": {"en": "Input, output, definiteness, finiteness and effectiveness."}}, {"q": {"en": "What is pseudo code?"}, "a": {"en": "An informal English-like way of writing an algorithm that looks like a program but does not follow exact syntax."}}]}, {"title": {"en": "Overview of C and Tokens"}, "items": [{"q": {"en": "Who developed C and when?"}, "a": {"en": "Dennis Ritchie at AT&T Bell Laboratories in 1972."}}, {"q": {"en": "Why is C called a middle-level language?"}, "a": {"en": "It has features of high-level languages and also low-level features like bit manipulation and pointers."}}, {"q": {"en": "Which function is compulsory in every C program?"}, "a": {"en": "main() – program execution starts from main()."}}, {"q": {"en": "What is the extension of a C source file?"}, "a": {"en": ".c (object file .obj/.o, executable .exe)."}}, {"q": {"en": "What is the role of the compiler?"}, "a": {"en": "It checks syntax errors and translates the source program into object (machine) code."}}, {"q": {"en": "What does the linker do?"}, "a": {"en": "It links the object code with library functions to create the executable file."}}, {"q": {"en": "What is a token?"}, "a": {"en": "The smallest individual unit of a program. C has six tokens: keywords, identifiers, constants, strings, special symbols and operators."}}, {"q": {"en": "How many keywords are there in ANSI C?"}, "a": {"en": "32."}}, {"q": {"en": "Can a keyword be used as a variable name?"}, "a": {"en": "No, keywords are reserved words."}}, {"q": {"en": "Is 2total a valid identifier?"}, "a": {"en": "No, an identifier cannot start with a digit."}}]}, {"title": {"en": "Constants, Variables, Data Types and I/O"}, "items": [{"q": {"en": "What is the difference between 'A' and \"A\"?"}, "a": {"en": "'A' is a character constant (1 byte); \"A\" is a string constant ending with '\\0' (2 bytes)."}}, {"q": {"en": "What is an escape sequence? Give examples."}, "a": {"en": "A backslash character constant with special meaning, e.g. \\n newline, \\t tab, \\0 null."}}, {"q": {"en": "What is a variable?"}, "a": {"en": "A named memory location whose value can change during execution."}}, {"q": {"en": "Name the primary data types of C."}, "a": {"en": "int, char, float, double and void."}}, {"q": {"en": "What is the size of int?"}, "a": {"en": "2 bytes in 16-bit compilers (Turbo C), 4 bytes in 32/64-bit compilers (GCC)."}}, {"q": {"en": "What is a symbolic constant?"}, "a": {"en": "A name for a constant value defined with #define, e.g. #define PI 3.14."}}, {"q": {"en": "Why is & used in scanf()?"}, "a": {"en": "scanf needs the address of the variable to store the input value."}}, {"q": {"en": "What is the format specifier for double?"}, "a": {"en": "%lf."}}, {"q": {"en": "Difference between getchar() and scanf()?"}, "a": {"en": "getchar() reads only one character (unformatted); scanf() reads any type using format specifiers."}}]}, {"title": {"en": "Operators and Expressions"}, "items": [{"q": {"en": "What is the output of 7 / 2 and 7 % 2?"}, "a": {"en": "3 and 1."}}, {"q": {"en": "Can % be used with float?"}, "a": {"en": "No, only with integers (use fmod() for reals)."}}, {"q": {"en": "What is the difference between = and ==?"}, "a": {"en": "= is assignment; == is the equality (comparison) operator."}}, {"q": {"en": "What is short-circuit evaluation?"}, "a": {"en": "In A && B, B is not evaluated if A is false; in A || B, B is not evaluated if A is true."}}, {"q": {"en": "Difference between ++a and a++?"}, "a": {"en": "++a increments first then uses the value; a++ uses the value first then increments."}}, {"q": {"en": "Which is the ternary operator in C?"}, "a": {"en": "The conditional operator ?:"}}, {"q": {"en": "What is the value of ~5?"}, "a": {"en": "−6, because ~a = −(a + 1)."}}, {"q": {"en": "What does sizeof return?"}, "a": {"en": "The number of bytes occupied by a variable or data type."}}, {"q": {"en": "What is type casting?"}, "a": {"en": "Explicit conversion of one data type to another using (type), e.g. (float) a."}}, {"q": {"en": "What is operator precedence and associativity?"}, "a": {"en": "Precedence decides which operator is evaluated first; associativity decides the order among operators of equal precedence."}}]}], "exam_questions": [{"q": {"en": "Define flowchart. Explain flowchart symbols."}, "marks": 3}, {"q": {"en": "State advantages and disadvantages of flowchart."}, "marks": 3}, {"q": {"en": "Draw a flowchart to find the largest of three numbers."}, "marks": 3}, {"q": {"en": "Draw a flowchart and write an algorithm to find the factorial of a number."}, "marks": 4}, {"q": {"en": "Define algorithm. Explain characteristics of an algorithm."}, "marks": 3}, {"q": {"en": "Differentiate between algorithm and flowchart."}, "marks": 3}, {"q": {"en": "Explain the history and importance (features) of C language."}, "marks": 4}, {"q": {"en": "Explain the basic structure of a C program with example."}, "marks": 4}, {"q": {"en": "Explain the process of executing a C program with diagram."}, "marks": 4}, {"q": {"en": "What is a token? Explain different C tokens."}, "marks": 3}, {"q": {"en": "Define identifier. State the rules for naming identifiers."}, "marks": 3}, {"q": {"en": "Explain different types of constants in C with examples."}, "marks": 4}, {"q": {"en": "Explain data types of C with size, range and format specifier."}, "marks": 4}, {"q": {"en": "What is a symbolic constant? How is it defined? State its rules."}, "marks": 3}, {"q": {"en": "Explain getchar() and putchar() with example."}, "marks": 3}, {"q": {"en": "Explain formatted input and output functions with examples."}, "marks": 4}, {"q": {"en": "List the operators of C. Explain arithmetic and relational operators."}, "marks": 4}, {"q": {"en": "Explain logical and bitwise operators with examples."}, "marks": 4}, {"q": {"en": "Explain increment/decrement and conditional operators with examples."}, "marks": 4}, {"q": {"en": "Explain implicit and explicit type conversion."}, "marks": 3}, {"q": {"en": "Explain operator precedence and associativity with example."}, "marks": 4}, {"q": {"en": "Write a C program to find the area and circumference of a circle."}, "marks": 3}, {"q": {"en": "Write a C program to swap two numbers without using a third variable."}, "marks": 3}, {"q": {"en": "Write a C program to find the largest of three numbers using the conditional operator."}, "marks": 3}, {"q": {"en": "Evaluate: x = a - b / 3 + c * 2 - 1 where a = 9, b = 12, c = 3."}, "marks": 3}]};

  document.getElementById('title').textContent = `${L('unit')} ${U.unit}: ${t(U.title)}`;
  document.getElementById('sub').textContent = `${t(META.name)} · ${META.code}`;
  document.getElementById('lang').textContent = S.lang==='en' ? 'ગુ' : 'EN';
  document.getElementById('lang').style.display = META.languages.includes('gu') ? '' : 'none';
  document.getElementById('tabs').innerHTML = Object.keys(VIEWS).map(k=>`<button class="tab${S.tab===k?' on':''}" data-tab="${k}">${L(k)}</button>`).join('');
  document.getElementById('view').innerHTML = VIEWS[S.tab]();
  document.querySelectorAll('#view pre.c').forEach(e=>{ e.innerHTML = hl(e.textContent); e.className='code'; });
}
let zoom = 1;
function setZoom(z){ zoom = Math.min(4, Math.max(1, z)); const w=document.getElementById('zw'); w.style.width=(zoom*100)+'%'; document.getElementById('zr').textContent=Math.round(zoom*100)+'%'; }
document.addEventListener('click', e=>{
  const q = e.target.closest('.q'); if (q && q.parentElement.querySelector('.a')) { q.parentElement.classList.toggle('open'); return; }
  const tb = e.target.closest('[data-tab]'); if (tb){ S.tab = tb.dataset.tab; render(); window.scrollTo(0,0); return; }
  if (e.target.closest('#lang')){ S.lang = S.lang==='en'?'gu':'en'; render(); return; }
  const m = e.target.closest('[data-more]');
  document.querySelectorAll('.menu.show').forEach(x=>{ if(!m || x!==m.nextElementSibling) x.classList.remove('show'); });
  if (m){ m.nextElementSibling.classList.toggle('show'); return; }
  const act = e.target.closest('[data-act]');
  if (act){ act.closest('.sec').querySelectorAll('.card').forEach(c=>{ if(c.querySelector('.a')) c.classList.toggle('open', act.dataset.act==='expand'); }); act.parentElement.classList.remove('show'); return; }
  const dg = e.target.closest('[data-dg]');
  if (dg){ const id=dg.dataset.dg; document.getElementById('mt').textContent=t(U.diagrams.find(d=>d.id===id).title); document.getElementById('zw').innerHTML=SVG[id]; setZoom(1); document.getElementById('modal').classList.add('show'); return; }
  if (e.target.closest('#mx')) document.getElementById('modal').classList.remove('show');
  if (e.target.closest('#zi')) setZoom(zoom+0.5);
  if (e.target.closest('#zo')) setZoom(zoom-0.5);
  if (e.target.closest('#zr')) setZoom(1);
});
render();
</script></body></html>
