 with two surfaces, p = 4T/r</p><p>= 4 × 0.025/0.02</p><p>= 5 Pa</p><h4>Answer</h4><p><b>5 Pa</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>T = 0.025 N/m સાથે 2 cm ત્રિજ્યાના સાબુના પરપોટા અંદરનું વધારાનું દબાણ શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>બે સપાટીવાળા પરપોટા માટે p = 4T/r</p><p>= 4 × 0.025/0.02</p><p>= 5 Pa</p><h4>જવાબ</h4><p><b>5 Pa</b></p>"}, "answer": {"en": "5 Pa", "gu": "5 Pa"}}, {"id": "u3n13", "unit": 3, "h": {"en": "Velocity gradient in an oil film.", "gu": "તેલના પડમાં વેગ પ્રવણતા."}, "q": {"en": "The top plate of an oil film 2 mm thick moves at 0.5 m/s while the bottom plate is fixed. Find the velocity gradient and the viscous force with η = 1.0 Pa·s and A = 0.5 m².", "gu": "2 mm જાડા તેલ પડની ઉપરની પ્લેટ 0.5 m/s પર ચાલે અને નીચેની સ્થિર છે. વેગ પ્રવણતા અને η = 1.0 Pa·s તથા A = 0.5 m² સાથે શ્યાન બળ શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>The top plate of an oil film 2 mm thick moves at 0.5 m/s while the bottom plate is fixed. Find the velocity gradient and the viscous force with η = 1.0 Pa·s and A = 0.5 m².</p><h4>Step-by-step solution</h4><p>dv/dx = 0.5/0.002 = 250 s⁻¹</p><p>F = η A dv/dx</p><p>= 1.0 × 0.5 × 250 = 125 N</p><h4>Answer</h4><p><b>250 s⁻¹ and 125 N</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>2 mm જાડા તેલ પડની ઉપરની પ્લેટ 0.5 m/s પર ચાલે અને નીચેની સ્થિર છે. વેગ પ્રવણતા અને η = 1.0 Pa·s તથા A = 0.5 m² સાથે શ્યાન બળ શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>dv/dx = 0.5/0.002 = 250 s⁻¹</p><p>F = η A dv/dx</p><p>= 1.0 × 0.5 × 250 = 125 N</p><h4>જવાબ</h4><p><b>250 s⁻¹ અને 125 N</b></p>"}, "answer": {"en": "250 s⁻¹ and 125 N", "gu": "250 s⁻¹ અને 125 N"}}, {"id": "u3n14", "unit": 3, "h": {"en": "Terminal velocity of a steel ball in glycerine.", "gu": "ગ્લિસરિનમાં સ્ટીલના દડાનો અંતિમ વેગ."}, "q": {"en": "A steel ball of radius 1 mm (ρ = 7800 kg/m³) falls in glycerine (σ = 1260 kg/m³, η = 0.83 Pa·s). Find the terminal velocity.", "gu": "1 mm ત્રિજ્યાનો સ્ટીલ દડો (ρ = 7800 kg/m³) ગ્લિસરિન (σ = 1260 kg/m³, η = 0.83 Pa·s)માં પડે છે. અંતિમ વેગ શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A steel ball of radius 1 mm (ρ = 7800 kg/m³) falls in glycerine (σ = 1260 kg/m³, η = 0.83 Pa·s). Find the terminal velocity.</p><h4>Step-by-step solution</h4><p>v = 2r²(ρ − σ)g/(9η)</p><p>= 2 × 10⁻⁶ × 6540 × 9.8/(9 × 0.83)</p><p>= 0.1282/7.47 = 1.72 × 10⁻² m/s</p><h4>Answer</h4><p><b>1.72 × 10⁻² m/s (1.7 cm/s)</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>1 mm ત્રિજ્યાનો સ્ટીલ દડો (ρ = 7800 kg/m³) ગ્લિસરિન (σ = 1260 kg/m³, η = 0.83 Pa·s)માં પડે છે. અંતિમ વેગ શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>v = 2r²(ρ − σ)g/(9η)</p><p>= 2 × 10⁻⁶ × 6540 × 9.8/(9 × 0.83)</p><p>= 0.1282/7.47 = 1.72 × 10⁻² m/s</p><h4>જવાબ</h4><p><b>1.72 × 10⁻² m/s (1.7 cm/s)</b></p>"}, "answer": {"en": "1.72 × 10⁻² m/s (1.7 cm/s)", "gu": "1.72 × 10⁻² m/s (1.7 cm/s)"}}, {"id": "u3n15", "unit": 3, "h": {"en": "Viscosity from a measured terminal velocity.", "gu": "માપેલા અંતિમ વેગ પરથી શ્યાનતા."}, "q": {"en": "A ball of radius 2 mm (ρ = 7800 kg/m³) falls at a steady 0.10 m/s in glycerine of density 1260 kg/m³. Find the viscosity.", "gu": "2 mm ત્રિજ્યાનો દડો (ρ = 7800 kg/m³) 1260 kg/m³ ઘનતાવાળા ગ્લિસરિનમાં 0.10 m/s ના અચળ વેગથી પડે છે. શ્યાનતા શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A ball of radius 2 mm (ρ = 7800 kg/m³) falls at a steady 0.10 m/s in glycerine of density 1260 kg/m³. Find the viscosity.</p><h4>Step-by-step solution</h4><p>η = 2r²(ρ − σ)g/(9v)</p><p>= 2 × 4 × 10⁻⁶ × 6540 × 9.8/(9 × 0.10)</p><p>= 0.5127/0.9 = 0.57 Pa·s</p><h4>Answer</h4><p><b>0.57 Pa·s</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>2 mm ત્રિજ્યાનો દડો (ρ = 7800 kg/m³) 1260 kg/m³ ઘનતાવાળા ગ્લિસરિનમાં 0.10 m/s ના અચળ વેગથી પડે છે. શ્યાનતા શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>η = 2r²(ρ − σ)g/(9v)</p><p>= 2 × 4 × 10⁻⁶ × 6540 × 9.8/(9 × 0.10)</p><p>= 0.5127/0.9 = 0.57 Pa·s</p><h4>જવાબ</h4><p><b>0.57 Pa·s</b></p>"}, "answer": {"en": "0.57 Pa·s", "gu": "0.57 Pa·s"}}, {"id": "u3n16", "unit": 3, "h": {"en": "Reynolds number of water in a 50 mm pipe.", "gu": "50 mm નળીમાં પાણીનો રેનોલ્ડ્સ આંક."}, "q": {"en": "Water (ρ = 1000 kg/m³, η = 10⁻³ Pa·s) flows at 2 m/s in a pipe of diameter 50 mm. Find Re and state the type of flow.", "gu": "પાણી (ρ = 1000 kg/m³, η = 10⁻³ Pa·s) 50 mm વ્યાસની નળીમાં 2 m/s પર વહે છે. Re શોધો અને પ્રવાહનો પ્રકાર જણાવો."}, "a": {"en": "<h4>Given and assumptions</h4><p>Water (ρ = 1000 kg/m³, η = 10⁻³ Pa·s) flows at 2 m/s in a pipe of diameter 50 mm. Find Re and state the type of flow.</p><h4>Step-by-step solution</h4><p>Re = ρ v d/η</p><p>= 1000 × 2 × 0.05/10⁻³</p><p>= 10⁵, far above 4000, so the flow is turbulent</p><h4>Answer</h4><p><b>Re = 10⁵, turbulent</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>પાણી (ρ = 1000 kg/m³, η = 10⁻³ Pa·s) 50 mm વ્યાસની નળીમાં 2 m/s પર વહે છે. Re શોધો અને પ્રવાહનો પ્રકાર જણાવો.</p><h4>પગલાવાર ઉકેલ</h4><p>Re = ρ v d/η</p><p>= 1000 × 2 × 0.05/10⁻³</p><p>= 10⁵, 4000થી ઘણું ઉપર, તેથી પ્રવાહ વમળીય છે</p><h4>જવાબ</h4><p><b>Re = 10⁵, વમળીય</b></p>"}, "answer": {"en": "Re = 10⁵, turbulent", "gu": "Re = 10⁵, વમળીય"}}, {"id": "u3n17", "unit": 3, "h": {"en": "Critical velocity for Re = 2000.", "gu": "Re = 2000 માટે ક્રાંતિક વેગ."}, "q": {"en": "For water in a 50 mm pipe, find the critical velocity at Re = 2000.", "gu": "50 mm નળીમાં પાણી માટે Re = 2000 પર ક્રાંતિક વેગ શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>For water in a 50 mm pipe, find the critical velocity at Re = 2000.</p><h4>Step-by-step solution</h4><p>v_c = Re η/(ρ d)</p><p>= 2000 × 10⁻³/(1000 × 0.05)</p><p>= 2/50 = 0.04 m/s</p><h4>Answer</h4><p><b>0.04 m/s</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>50 mm નળીમાં પાણી માટે Re = 2000 પર ક્રાંતિક વેગ શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>v_c = Re η/(ρ d)</p><p>= 2000 × 10⁻³/(1000 × 0.05)</p><p>= 2/50 = 0.04 m/s</p><h4>જવાબ</h4><p><b>0.04 m/s</b></p>"}, "answer": {"en": "0.04 m/s", "gu": "0.04 m/s"}}, {"id": "u3n18", "unit": 3, "h": {"en": "Spring constant from an extension.", "gu": "ખેંચાણ પરથી સ્પ્રિંગ અચળાંક."}, "q": {"en": "A spring extends 2 cm under a load of 10 N. Find its force constant and the extension under 25 N.", "gu": "સ્પ્રિંગ 10 N ભાર હેઠળ 2 cm ખેંચાય છે. તેનો બળ અચળાંક અને 25 N હેઠળ ખેંચાણ શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A spring extends 2 cm under a load of 10 N. Find its force constant and the extension under 25 N.</p><h4>Step-by-step solution</h4><p>k = F/x = 10/0.02 = 500 N/m</p><p>x = F/k = 25/500</p><p>= 0.05 m = 5 cm</p><h4>Answer</h4><p><b>500 N/m and 5 cm</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>સ્પ્રિંગ 10 N ભાર હેઠળ 2 cm ખેંચાય છે. તેનો બળ અચળાંક અને 25 N હેઠળ ખેંચાણ શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>k = F/x = 10/0.02 = 500 N/m</p><p>x = F/k = 25/500</p><p>= 0.05 m = 5 cm</p><h4>જવાબ</h4><p><b>500 N/m અને 5 cm</b></p>"}, "answer": {"en": "500 N/m and 5 cm", "gu": "500 N/m અને 5 cm"}}, {"id": "u3n19", "unit": 3, "h": {"en": "Pressure needed to make a 1 mm water drop.", "gu": "1 mm પાણીના ટીપા માટે જરૂરી દબાણ."}, "q": {"en": "Find the excess pressure inside a water drop of radius 1 mm (T = 0.072 N/m).", "gu": "1 mm ત્રિજ્યાના પાણીના ટીપા અંદરનું વધારાનું દબાણ શોધો (T = 0.072 N/m)."}, "a": {"en": "<h4>Given and assumptions</h4><p>Find the excess pressure inside a water drop of radius 1 mm (T = 0.072 N/m).</p><h4>Step-by-step solution</h4><p>A drop has one surface, so p = 2T/r</p><p>= 2 × 0.072/10⁻³</p><p>= 144 Pa</p><h4>Answer</h4><p><b>144 Pa</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>1 mm ત્રિજ્યાના પાણીના ટીપા અંદરનું વધારાનું દબાણ શોધો (T = 0.072 N/m).</p><h4>પગલાવાર ઉકેલ</h4><p>ટીપાને એક સપાટી હોય, તેથી p = 2T/r</p><p>= 2 × 0.072/10⁻³</p><p>= 144 Pa</p><h4>જવાબ</h4><p><b>144 Pa</b></p>"}, "answer": {"en": "144 Pa", "gu": "144 Pa"}}, {"id": "u3n20", "unit": 3, "h": {"en": "Bearing friction in an oil film.", "gu": "તેલના પડમાં બેરિંગનું ઘર્ષણ."}, "q": {"en": "A bearing surface of 0.02 m² moves at 5 m/s over an oil film 0.05 mm thick with η = 0.25 Pa·s. Find the viscous force.", "gu": "0.02 m² બેરિંગ સપાટી 0.05 mm જાડા તેલ પડ પર 5 m/s પર ચાલે છે, η = 0.25 Pa·s. શ્યાન બળ શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A bearing surface of 0.02 m² moves at 5 m/s over an oil film 0.05 mm thick with η = 0.25 Pa·s. Find the viscous force.</p><h4>Step-by-step solution</h4><p>F = η A v/x</p><p>= 0.25 × 0.02 × 5/(5 × 10⁻⁵)</p><p>= 0.025/5 × 10⁻⁵ = 500 N</p><h4>Answer</h4><p><b>500 N</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>0.02 m² બેરિંગ સપાટી 0.05 mm જાડા તેલ પડ પર 5 m/s પર ચાલે છે, η = 0.25 Pa·s. શ્યાન બળ શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>F = η A v/x</p><p>= 0.25 × 0.02 × 5/(5 × 10⁻⁵)</p><p>= 0.025/5 × 10⁻⁵ = 500 N</p><h4>જવાબ</h4><p><b>500 N</b></p>"}, "answer": {"en": "500 N", "gu": "500 N"}}, {"id": "u3n21", "unit": 3, "h": {"en": "Height of a mercury column in a 0.2 mm tube.", "gu": "0.2 mm નળીમાં પારાના સ્તંભની ઊંચાઈ."}, "q": {"en": "Mercury (T = 0.465 N/m, ρ = 13 600 kg/m³, θ = 140°) in a tube of radius 0.2 mm: find the depression.", "gu": "0.2 mm ત્રિજ્યાની નળીમાં પારો (T = 0.465 N/m, ρ = 13 600 kg/m³, θ = 140°): ઉતાર શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>Mercury (T = 0.465 N/m, ρ = 13 600 kg/m³, θ = 140°) in a tube of radius 0.2 mm: find the depression.</p><h4>Step-by-step solution</h4><p>h = 2T cos θ/(ρ g r)</p><p>cos 140° = −0.766</p><p>h = 2 × 0.465 × (−0.766)/(13 600 × 9.8 × 2 × 10⁻⁴) = −0.712/26.66 = −0.027 m</p><p>The minus sign means a depression of 2.7 cm.</p><h4>Answer</h4><p><b>2.7 cm depression</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>0.2 mm ત્રિજ્યાની નળીમાં પારો (T = 0.465 N/m, ρ = 13 600 kg/m³, θ = 140°): ઉતાર શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>h = 2T cos θ/(ρ g r)</p><p>cos 140° = −0.766</p><p>h = 2 × 0.465 × (−0.766)/(13 600 × 9.8 × 2 × 10⁻⁴) = −0.712/26.66 = −0.027 m</p><p>ઋણ ચિહ્ન એટલે 2.7 cm નો ઉતાર.</p><h4>જવાબ</h4><p><b>2.7 cm ઉતાર</b></p>"}, "answer": {"en": "2.7 cm depression", "gu": "2.7 cm ઉતાર"}}, {"id": "u3n22", "unit": 3, "h": {"en": "Load that a steel rod can carry at 100 MPa.", "gu": "100 MPa પર સ્ટીલ સળિયો કેટલો ભાર લઈ શકે."}, "q": {"en": "A steel rod of cross-section 10 mm² is limited to a working stress of 100 MPa. Find the safe load.", "gu": "10 mm² કાપવાળા સ્ટીલ સળિયા માટે કાર્યકારી પ્રતિબળ 100 MPa સુધી મર્યાદિત છે. સલામત ભાર શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A steel rod of cross-section 10 mm² is limited to a working stress of 100 MPa. Find the safe load.</p><h4>Step-by-step solution</h4><p>F = σ A = 100 × 10⁶ × 10 × 10⁻⁶</p><p>= 1000 N</p><p>With a yield stress of 250 MPa this is a safety factor of 2.5.</p><h4>Answer</h4><p><b>1000 N</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>10 mm² કાપવાળા સ્ટીલ સળિયા માટે કાર્યકારી પ્રતિબળ 100 MPa સુધી મર્યાદિત છે. સલામત ભાર શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>F = σ A = 100 × 10⁶ × 10 × 10⁻⁶</p><p>= 1000 N</p><p>250 MPa ઉપજ પ્રતિબળ સાથે આ 2.5 નો સલામતી અવયવ છે.</p><h4>જવાબ</h4><p><b>1000 N</b></p>"}, "answer": {"en": "1000 N", "gu": "1000 N"}}, {"id": "u3n23", "unit": 3, "h": {"en": "Surface energy needed to blow a 2 cm soap bubble.", "gu": "2 cm સાબુના પરપોટા ફૂંકવા જરૂરી પૃષ્ઠઊર્જા."}, "q": {"en": "Find the work needed to blow a soap bubble of radius 2 cm (T = 0.025 N/m).", "gu": "2 cm ત્રિજ્યાનો સાબુનો પરપોટો ફૂંકવા જરૂરી કાર્ય શોધો (T = 0.025 N/m)."}, "a": {"en": "<h4>Given and assumptions</h4><p>Find the work needed to blow a soap bubble of radius 2 cm (T = 0.025 N/m).</p><h4>Step-by-step solution</h4><p>A bubble has two surfaces: A = 2 × 4πr²</p><p>A = 2 × 4π × 4 × 10⁻⁴ = 1.005 × 10⁻² m²</p><p>W = T A = 0.025 × 1.005 × 10⁻² = 2.5 × 10⁻⁴ J</p><h4>Answer</h4><p><b>2.5 × 10⁻⁴ J</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>2 cm ત્રિજ્યાનો સાબુનો પરપોટો ફૂંકવા જરૂરી કાર્ય શોધો (T = 0.025 N/m).</p><h4>પગલાવાર ઉકેલ</h4><p>પરપોટાને બે સપાટી: A = 2 × 4πr²</p><p>A = 2 × 4π × 4 × 10⁻⁴ = 1.005 × 10⁻² m²</p><p>W = T A = 0.025 × 1.005 × 10⁻² = 2.5 × 10⁻⁴ J</p><h4>જવાબ</h4><p><b>2.5 × 10⁻⁴ J</b></p>"}, "answer": {"en": "2.5 × 10⁻⁴ J", "gu": "2.5 × 10⁻⁴ J"}}, {"id": "u3n24", "unit": 3, "h": {"en": "Pipe diameter that keeps water flow streamline at 1 m/s.", "gu": "1 m/s પર પાણીનો પ્રવાહ સ્તરીય રહે તેવો નળીનો વ્યાસ."}, "q": {"en": "For water at 1 m/s, what is the largest pipe diameter that keeps Re below 2000?", "gu": "1 m/s પર પાણી માટે Re 2000થી નીચે રહે તેવો સૌથી મોટો નળીનો વ્યાસ કેટલો?"}, "a": {"en": "<h4>Given and assumptions</h4><p>For water at 1 m/s, what is the largest pipe diameter that keeps Re below 2000?</p><h4>Step-by-step solution</h4><p>Re = ρ v d/η, so d = Re η/(ρ v)</p><p>= 2000 × 10⁻³/(1000 × 1)</p><p>= 2 × 10⁻³ m = 2 mm</p><p>Any larger pipe is turbulent at 1 m/s — which is why real pipes run slower.</p><h4>Answer</h4><p><b>2 mm</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>1 m/s પર પાણી માટે Re 2000થી નીચે રહે તેવો સૌથી મોટો નળીનો વ્યાસ કેટલો?</p><h4>પગલાવાર ઉકેલ</h4><p>Re = ρ v d/η, તેથી d = Re η/(ρ v)</p><p>= 2000 × 10⁻³/(1000 × 1)</p><p>= 2 × 10⁻³ m = 2 mm</p><p>તેનાથી મોટી કોઈ પણ નળી 1 m/s પર વમળીય થાય — તેથી જ વાસ્તવિક નળીઓ ધીમે ચાલે.</p><h4>જવાબ</h4><p><b>2 mm</b></p>"}, "answer": {"en": "2 mm", "gu": "2 mm"}}], "viva": [{"title": {"en": "Elasticity", "gu": "સ્થિતિસ્થાપકતા"}, "items": [{"q": {"en": "Define stress and strain with their units.", "gu": "પ્રતિબળ અને વિકૃતિ તેમના એકમ સાથે સમજાવો."}, "a": {"en": "Stress is restoring force per unit area (N/m²); strain is the fractional change of dimension and has no unit.", "gu": "પ્રતિબળ એકમ ક્ષેત્રફળ દીઠ પુનઃસ્થાપક બળ (N/m²) છે; વિકૃતિ પરિમાણમાં અંશતઃ ફેરફાર છે અને તેને એકમ નથી."}}, {"q": {"en": "State Hooke's law and its limit.", "gu": "હૂકનો નિયમ અને તેની મર્યાદા જણાવો."}, "a": {"en": "Within the elastic limit stress is proportional to strain, σ = E ε; beyond the yield point the material stays deformed.", "gu": "સ્થિતિસ્થાપક મર્યાદા સુધી પ્રતિબળ વિકૃતિના સમપ્રમાણમાં, σ = E ε; ઉપજ બિંદુ પછી પદાર્થ વિકૃત જ રહે."}}, {"q": {"en": "Name the three moduli of elasticity and the deformation each resists.", "gu": "સ્થિતિસ્થાપકતાના ત્રણ ગુણાંક અને દરેક કઈ વિકૃતિનો પ્રતિરોધ કરે તે જણાવો."}, "a": {"en": "Young's modulus resists stretching, bulk modulus resists volume change and shear modulus resists change of shape.", "gu": "યંગ ગુણાંક ખેંચાણનો, બલ્ક ગુણાંક ઘનફળના ફેરફારનો અને શિયર ગુણાંક આકારના ફેરફારનો પ્રતિરોધ કરે."}}, {"q": {"en": "What do the points A, B, D and E on a stress-strain curve mean?", "gu": "પ્રતિબળ-વિકૃતિ વક્ર પર A, B, D અને E બિંદુનો અર્થ શું?"}, "a": {"en": "A is the proportional limit where the straight line ends, B the elastic limit, D the ultimate tensile strength and E the fracture point.", "gu": "A સમપ્રમાણ મર્યાદા જ્યાં સીધી રેખા પૂરી થાય, B સ્થિતિસ્થાપક મર્યાદા, D અંતિમ તણાવ મજબૂતાઈ અને E ભંગ બિંદુ છે."}}, {"q": {"en": "Why is a safety factor used in design?", "gu": "રચનામાં સલામતી અવયવ કેમ વપરાય?"}, "a": {"en": "The working stress is kept well below the yield stress so that the part springs back after every load and survives overloads and fatigue.", "gu": "કાર્યકારી પ્રતિબળ ઉપજ પ્રતિબળથી ઘણું નીચે રખાય જેથી દરેક ભાર પછી પાર્ટ પાછો આવે અને ઓવરલોડ તથા થાક સહે."}}]}, {"title": {"en": "Surface tension", "gu": "પૃષ્ઠતાણ"}, "items": [{"q": {"en": "Define surface tension and give both its units.", "gu": "પૃષ્ઠતાણની વ્યાખ્યા આપો અને તેના બંને એકમ જણાવો."}, "a": {"en": "Force per unit length along the surface, N/m, which is also surface energy per unit area, J/m².", "gu": "સપાટી પર એકમ લંબાઈ દીઠ બળ, N/m, જે એકમ ક્ષેત્રફળ દીઠ પૃષ્ઠઊર્જા J/m² પણ છે."}}, {"q": {"en": "Why does a liquid surface behave like a stretched membrane?", "gu": "પ્રવાહીની સપાટી તંગ પડ જેવી કેમ વર્તે?"}, "a": {"en": "A molecule at the surface has only part of its sphere of influence filled, so it is pulled inwards; the surface stores energy and tries to shrink.", "gu": "સપાટી પરના અણુનો પ્રભાવ ગોળો અંશતઃ ભરેલો હોય, તેથી તે અંદર ખેંચાય; સપાટી ઊર્જા ધરાવે અને સંકોચાવા પ્રયત્ન કરે."}}, {"q": {"en": "What is the angle of contact, and what does θ > 90° mean?", "gu": "સંપર્ક કોણ શું છે અને θ > 90° નો અર્થ શું?"}, "a": {"en": "The angle between the liquid surface tangent and the solid inside the liquid; θ > 90° means the liquid does not wet the solid — mercury in glass.", "gu": "પ્રવાહીની સપાટીના સ્પર્શક અને પ્રવાહીની અંદરની ઘન સપાટી વચ્ચેનો ખૂણો; θ > 90° એટલે પ્રવાહી ઘનને ભીનું કરતું નથી — કાચમાં પારો."}}, {"q": {"en": "State the Ascent formula and say what happens for mercury.", "gu": "આરોહણ સૂત્ર જણાવો અને પારા માટે શું થાય તે કહો."}, "a": {"en": "h = 2T cos θ/(ρ g r); for mercury cos θ is negative, so h is negative and the liquid is depressed in the tube.", "gu": "h = 2T cos θ/(ρ g r); પારા માટે cos θ ઋણ હોય, તેથી h ઋણ થાય અને નળીમાં પ્રવાહી ઉતરે."}}, {"q": {"en": "How do temperature and impurity change surface tension?", "gu": "તાપમાન અને અશુદ્ધિ પૃષ્ઠતાણ કેવી રીતે બદલે?"}, "a": {"en": "Surface tension falls as temperature rises; highly soluble impurities raise it slightly and sparingly soluble ones such as soap lower it sharply.", "gu": "તાપમાન વધે તેમ પૃષ્ઠતાણ ઘટે; ખૂબ દ્રાવ્ય અશુદ્ધિ થોડું વધારે અને સાબુ જેવી ઓછી દ્રાવ્ય અશુદ્ધિ ઝડપથી ઘટાડે."}}, {"q": {"en": "Why is water used in a capillary tube and mercury not?", "gu": "કેશનળીમાં પાણી વપરાય અને પારો કેમ નહીં?"}, "a": {"en": "Water wets glass (θ ≈ 0), so it rises and the height is easy to read; mercury has θ ≈ 140°, so it is depressed and the column is short.", "gu": "પાણી કાચને ભીનું કરે (θ ≈ 0), તેથી ચઢે અને ઊંચાઈ વાંચવી સહેલી; પારાનો θ ≈ 140° હોવાથી ઉતરે અને સ્તંભ ટૂંકો રહે."}}]}, {"title": {"en": "Viscosity", "gu": "શ્યાનતા"}, "items": [{"q": {"en": "Define viscosity and its SI unit.", "gu": "શ્યાનતા અને તેનો SI એકમ જણાવો."}, "a": {"en": "The internal friction of a fluid opposing relative motion of its layers, measured by the coefficient η in Pa·s (= 10 poise).", "gu": "પ્રવાહીનું આંતરિક ઘર્ષણ જે તેના સ્તરોની સાપેક્ષ ગતિનો વિરોધ કરે, જે ગુણાંક η થી મપાય, Pa·s (= 10 પોઇઝ)."}}, {"q": {"en": "State Newton's law of viscosity.", "gu": "ન્યૂટનનો શ્યાનતાનો નિયમ જણાવો."}, "a": {"en": "The viscous force between two layers is proportional to their area and to the velocity gradient: F = −η A dv/dx.", "gu": "બે સ્તરો વચ્ચેનું શ્યાન બળ તેમના ક્ષેત્રફળ અને વેગ પ્રવણતાના સમપ્રમાણમાં છે: F = −η A dv/dx."}}, {"q": {"en": "What is the Reynolds number and what do its values mean?", "gu": "રેનોલ્ડ્સ આંક શું છે અને તેનાં મૂલ્યોનો અર્થ શું?"}, "a": {"en": "Re = ρ v d/η, a dimensionless number; below about 2000 the flow is streamline, above about 4000 turbulent.", "gu": "Re = ρ v d/η, પરિમાણરહિત આંક; લગભગ 2000થી નીચે પ્રવાહ સ્તરીય, 4000થી ઉપર વમળીય."}}, {"q": {"en": "State Stokes' law and the conditions for its use.", "gu": "સ્ટોક્સનો નિયમ અને તેના ઉપયોગની શરતો જણાવો."}, "a": {"en": "F = 6π η r v for a smooth sphere moving slowly and steadily through an infinite viscous fluid with no turbulence.", "gu": "સરખા ગોળા માટે F = 6π η r v, જે વમળ વગરના અનંત શ્યાન પ્રવાહીમાં ધીમે અને સ્થિર ગતિએ માન્ય છે."}}, {"q": {"en": "Why does terminal velocity depend on r²?", "gu": "અંતિમ વેગ r² પર કેમ આધારિત છે?"}, "a": {"en": "Weight and upthrust both grow as r³ while the drag at a given speed grows only as r, so the balance is reached at a speed proportional to r².", "gu": "વજન અને ઉત્પ્લાવક બંને r³ પ્રમાણે વધે જ્યારે આપેલ ઝડપે પ્રતિરોધ ફક્ત r પ્રમાણે વધે, તેથી સંતુલન r² પ્રમાણવાળી ઝડપે મળે."}}, {"q": {"en": "How does temperature affect the viscosity of a liquid and of a gas?", "gu": "તાપમાન પ્રવાહી અને વાયુની શ્યાનતાને કેવી રીતે અસર કરે?"}, "a": {"en": "Liquid viscosity falls as temperature rises because molecules slip past each other; gas viscosity rises because molecular momentum transfer increases.", "gu": "તાપમાન વધે તેમ પ્રવાહીની શ્યાનતા ઘટે કારણ કે અણુઓ સરકી જાય; વાયુની શ્યાનતા વધે કારણ કે આણ્વીય વેગમાન સ્થાનાંતરણ વધે."}}]}], "exam_questions": [{"q": {"en": "Practice: Define stress, strain and Young's modulus, and derive Y = FL/(A ΔL).", "gu": "સરાવ: પ્રતિબળ, વિકૃતિ અને યંગ ગુણાંકની વ્યાખ્યા આપી Y = FL/(A ΔL) મેળવો."}, "marks": 5}, {"q": {"en": "Practice: Explain the stress-strain curve and mark its important points.", "gu": "સરાવ: પ્રતિબળ-વિકૃતિ વક્ર સમજાવો અને તેના મહત્વના બિંદુ દર્શાવો."}, "marks": 4}, {"q": {"en": "Practice: Explain surface tension on the basis of molecular theory and give its two units.", "gu": "સરાવ: આણ્વીય સિદ્ધાંતના આધારે પૃષ્ઠતાણ સમજાવો અને તેના બે એકમ આપો."}, "marks": 4}, {"q": {"en": "Practice: Derive or state the Ascent formula and explain one engineering use of capillarity.", "gu": "સરાવ: આરોહણ સૂત્ર જણાવો અને કેશનળી ચઢાણનો એક ઇજનેરી ઉપયોગ સમજાવો."}, "marks": 5}, {"q": {"en": "Practice: What is the angle of contact? Explain why water wets glass but mercury does not.", "gu": "સરાવ: સંપર્ક કોણ શું છે? પાણી કાચને ભીનું કરે પણ પારો કેમ નહીં તે સમજાવો."}, "marks": 4}, {"q": {"en": "Practice: Explain surface tension, surface energy and their relation with a numerical example.", "gu": "સરાવ: પૃષ્ઠતાણ, પૃષ્ઠઊર્જા અને તેમનો સંબંધ દાખલા સાથે સમજાવો."}, "marks": 4}, {"q": {"en": "Practice: State Newton's law of viscosity and define the coefficient of viscosity with its units.", "gu": "સરાવ: ન્યૂટનનો શ્યાનતાનો નિયમ જણાવો અને શ્યાનતા ગુણાંક તેના એકમ સાથે સમજાવો."}, "marks": 4}, {"q": {"en": "Practice: Distinguish streamline and turbulent flow, and explain the Reynolds number.", "gu": "સરાવ: સ્તરીય અને વમળીય પ્રવાહમાં ભેદ સમજાવો અને રેનોલ્ડ્સ આંક સમજાવો."}, "marks": 4}, {"q": {"en": "Practice: State Stokes' law, define terminal velocity and derive its expression.", "gu": "સરાવ: સ્ટોક્સનો નિયમ જણાવો, અંતિમ વેગની વ્યાખ્યા આપો અને તેનું સૂત્ર મેળવો."}, "marks": 5}, {"q": {"en": "Practice: How does temperature affect viscosity? Why do liquids and gases behave differently?", "gu": "સરાવ: તાપમાન શ્યાનતાને કેવી રીતે અસર કરે? પ્રવાહી અને વાયુ જુદા કેમ વર્તે?"}, "marks": 4}, {"q": {"en": "Practice: A steel ball of 2 mm radius falls steadily at 0.1 m/s in glycerine of density 1260 kg/m³. Find the viscosity.", "gu": "સરાવ: 2 mm ત્રિજ્યાનો સ્ટીલ દડો 1260 kg/m³ ઘનતાવાળા ગ્લિસરિનમાં 0.1 m/s ના અચળ વેગથી પડે છે. શ્યાનતા શોધો."}, "marks": 5}, {"q": {"en": "Practice: Why does a bearing need oil of the right viscosity? Use Newton's law to argue.", "gu": "સરાવ: બેરિંગને યોગ્ય શ્યાનતાવાળું તેલ કેમ જોઈએ? ન્યૂટનના નિયમથી દલીલ કરો."}, "marks": 4}, {"q": {"en": "Practice: Explain two engineering applications of surface tension and two of viscosity.", "gu": "સરાવ: પૃષ્ઠતાણના બે અને શ્યાનતાના બે ઇજનેરી ઉપયોગો સમજાવો."}, "marks": 4}, {"q": {"en": "Practice: A wire of 2 m and 1 mm² hangs a 50 N load. Find the stress, the strain and the extension (Y = 2 × 10¹¹ N/m²).", "gu": "સરાવ: 2 m અને 1 mm² નો તાર 50 N ભાર લટકાવે છે. Y = 2 × 10¹¹ N/m² સાથે પ્રતિબળ, વિકૃતિ અને ખેંચાણ શોધો."}, "marks": 4}, {"q": {"en": "Practice: Why is steel used for springs and not cast iron? Answer with the stress-strain curve.", "gu": "સરાવ: સ્પ્રિંગ માટે સ્ટીલ વપરાય અને કાસ્ટ આયર્ન નહીં કેમ? પ્રતિબળ-વિકૃતિ વક્રથી જવાબ આપો."}, "marks": 4}, {"q": {"en": "Practice: Water rises 7.35 cm in a capillary of radius 0.1 mm. Find the surface tension.", "gu": "સરાવ: 0.1 mm ત્રિજ્યાની કેશનળીમાં પાણી 7.35 cm ચઢે છે. પૃષ્ઠતાણ શોધો."}, "marks": 3}], "learning_outcomes": [{"en": "3.a Explain Hooke's law, the stress-strain curve and the moduli of elasticity.", "gu": "3.a હૂકનો નિયમ, પ્રતિબળ-વિકૃતિ વક્ર અને સ્થિતિસ્થાપકતાના ગુણાંક સમજાવવા."}, {"en": "3.b Explain surface tension, cohesive and adhesive forces.", "gu": "3.b પૃષ્ઠતાણ, સંસક્તિ અને આસક્તિ બળો સમજાવવા."}, {"en": "3.c Apply the Ascent formula to find the surface tension of a liquid.", "gu": "3.c આરોહણ સૂત્રથી પ્રવાહીનું પૃષ્ઠતાણ શોધવું."}, {"en": "3.d Explain viscosity, coefficient of viscosity, terminal velocity and Stokes' law.", "gu": "3.d શ્યાનતા, શ્યાનતા ગુણાંક, અંતિમ વેગ અને સ્ટોક્સનો નિયમ સમજાવવો."}, {"en": "3.e Explain types of fluid motion and the Reynolds number.", "gu": "3.e પ્રવાહની ગતિના પ્રકારો અને રેનોલ્ડ્સ આંક સમજાવવો."}], "course_outcomes": ["CO3"], "practical_numbers": [4, 5, 6], "content_kind": "theory", "lesson_count": 21, "answered_practice_count": 16, "assessment_note": {"en": "Official course: theory ESE 70 + PA 30 and practical PA 20 + ESE 30 = 150 marks, 4 credits, 45 teaching hours; this unit carries 28 % weightage, 12 of the 45 hours and 19 of the 70 theory marks (the PDF prints weightage only, so the marks are split by weightage). Practice marks 3/4/5 are suggested revision sizes, not GTU allocations. Model answers are in Notes section 5.", "gu": "અધિકૃત કોર્સ: થિયરી ESE 70 + PA 30 અને પ્રેક્ટિકલ PA 20 + ESE 30 = 150 માર્ક્સ, 4 ક્રેડિટ, 45 શિક્ષણ કલાક; આ યુનિટનું વેઇટેજ 28 %, 45માંથી 12 કલાક અને 70 થિયરી માર્ક્સમાંથી 19 માર્ક્સ (PDFમાં ફક્ત વેઇટેજ છે, તેથી માર્ક્સ વેઇટેજ પ્રમાણે વહેંચ્યા છે). સરાવના 3/4/5 માર્ક્સ સૂચિત પુનરાવર્તન માપ છે, GTU ફાળવણી નહીં. આદર્શ જવાબો નોંધ વિભાગ 5માં છે."}, "question_provenance": "Original answered revision questions; not official past papers", "question_marks_are_suggested": true, "sources": [{"title": "GTU DI01000121 Applied Physics syllabus (uploaded PDF, w.e.f. 2024-25)", "url": "https://syllabus.gtu.ac.in/"}, {"title": "NCERT Physics Class XI, Part II - Mechanical Properties of Solids and Fluids", "url": "https://syllabus.gtu.ac.in/"}, {"title": "H. C. Verma - Concepts of Physics, Vol. I, chapters 14 and 15", "url": "https://syllabus.gtu.ac.in/"}, {"title": "M. N. Avadhanulu - A Textbook of Engineering Physics, properties of matter chapters", "url": "https://syllabus.gtu.ac.in/"}, {"title": "C. L. Arora - B.Sc. Practical Physics: Searle's modulus, capillary rise, Stokes' law", "url": "https://syllabus.gtu.ac.in/"}]};
