<script>
const U = {"subject": "DI01000121", "unit": 3, "format": "notes", "title": {"en": "General Properties of Matter", "gu": "દ્રવ્યના સામાન્ય ગુણધર્મો"}, "hours": 12, "weightage": 28, "official": true, "languages": ["en", "gu"], "tabs": ["notes", "diagrams", "equations", "numericals", "viva", "exam"], "intro_text": {"en": "Unit 3 of Applied Physics: elasticity with stress, strain, Hooke's law, the three moduli and the stress-strain curve; surface tension from the molecular theory through cohesion and adhesion, the angle of contact, capillarity and its engineering uses; and viscosity with Newton's law, streamline and turbulent flow, the Reynolds number and Stokes' law. Twenty-one lecture cards, five diagrams, twenty-four fully solved numericals and sixteen answered practice questions.", "gu": "એપ્લાઇડ ફિઝિક્સનું યુનિટ 3: સ્થિતિસ્થાપકતા સાથે પ્રતિબળ, વિકૃતિ, હૂકનો નિયમ, ત્રણ ગુણાંક અને પ્રતિબળ-વિકૃતિ વક્ર; આણ્વીય સિદ્ધાંતથી પૃષ્ઠતાણ, સંસક્તિ-આસક્તિ, સંપર્ક કોણ, કેશનળી ચઢાણ અને તેના ઇજનેરી ઉપયોગો; અને શ્યાનતા સાથે ન્યૂટનનો નિયમ, સ્તરીય તથા વમળીય પ્રવાહ, રેનોલ્ડ્સ આંક અને સ્ટોક્સનો નિયમ. એકવીસ પાઠ-કાર્ડ, પાંચ આકૃતિઓ, ચોવીસ પૂરા ઉકેલાયેલા દાખલા અને સોળ ઉત્તરસહિત સરાવ પ્રશ્નો."}, "notes": [{"title": {"en": "1. Elasticity", "gu": "1. સ્થિતિસ્થાપકતા"}, "items": [{"h": {"en": "1.1 Deforming and restoring force", "gu": "1.1 વિકૃતિકારક અને પુનઃસ્થાપક બળ"}, "body": {"en": "<h4>Definition</h4><p>A <b>deforming force</b> changes the shape or size of a body. The internal force the body develops to oppose that change is the <b>restoring force</b>. A body that returns to its original shape when the load is removed is <b>elastic</b>; one that does not is <b>plastic</b>.</p><h4>Everyday and engineering examples</h4><table><tr><th>Object</th><th>Behaviour</th></tr><tr><td>rubber band, spring</td><td>elastic: returns fully</td></tr><tr><td>clay, wet soil</td><td>plastic: stays deformed</td></tr><tr><td>steel beam of a bridge</td><td>elastic within the design load</td></tr><tr><td>copper wire bent many times</td><td>plastic, then it breaks</td></tr></table><h4>Worked example</h4><p>A spring stretched by 2 cm with 10 N returns fully when released. Its restoring force is 10 N at that extension, and k = F/x = 10/0.02 = 500 N/m.</p><h4>Common mistake</h4><p>Calling every spring elastic at any load. Beyond its elastic limit even steel stays stretched, which is how a suspension is ruined by overloading.</p>", "gu": "<h4>વ્યાખ્યા</h4><p><b>વિકૃતિકારક બળ</b> શરીરનો આકાર કે માપ બદલે છે. તે ફેરફારનો વિરોધ કરવા શરીરમાં ઉત્પન્ન થતું આંતરિક બળ <b>પુનઃસ્થાપક બળ</b> છે. ભાર દૂર કરતાં જે શરીર પોતાનો મૂળ આકાર પાછો મેળવે તે <b>સ્થિતિસ્થાપક</b> છે; જે ન મેળવે તે <b>સ્થાયી</b> (પ્લાસ્ટિક) છે.</p><h4>રોજિંદા અને ઇજનેરી ઉદાહરણો</h4><table><tr><th>વસ્તુ</th><th>વર્તન</th></tr><tr><td>રબર બેન્ડ, સ્પ્રિંગ</td><td>સ્થિતિસ્થાપક: પૂરું પાછું આવે</td></tr><tr><td>માટી, ભીની જમીન</td><td>સ્થાયી: વિકૃત જ રહે</td></tr><tr><td>પુલનો સ્ટીલ બીમ</td><td>રચનાના ભાર સુધી સ્થિતિસ્થાપક</td></tr><tr><td>વારંવાર વળેલો તાંબાનો તાર</td><td>સ્થાયી, પછી તૂટે</td></tr></table><h4>ઉકેલાયેલ દાખલો</h4><p>2 cm ખેંચેલી સ્પ્રિંગ 10 N સાથે છોડતાં પૂરી પાછી આવે છે. તે ખેંચાણ પર પુનઃસ્થાપક બળ 10 N છે અને k = F/x = 10/0.02 = 500 N/m.</p><h4>સામાન્ય ભૂલ</h4><p>કોઈપણ ભાર પર દરેક સ્પ્રિંગને સ્થિતિસ્થાપક કહેવી. સ્થિતિસ્થાપક મર્યાદા પછી સ્ટીલ પણ ખેંચાયેલું રહે છે, અને તેથી જ વધુ ભારથી સસ્પેન્શન બગડે છે.</p>"}, "diagram": "u3_stress", "syllabus_item": "3.1.1"}, {"h": {"en": "1.2 Stress and strain, and their types", "gu": "1.2 પ્રતિબળ અને વિકૃતિ તથા તેમના પ્રકાર"}, "body": {"en": "<h4>Definitions</h4><p><b>Stress</b> = restoring force / area, σ = F/A, in N/m² (pascal). <b>Strain</b> = fractional change of dimension; it has no unit.</p><h4>Three kinds of stress and strain</h4><table><tr><th>Type</th><th>What changes</th><th>Strain</th></tr><tr><td>tensile / compressive</td><td>length</td><td>ΔL/L</td></tr><tr><td>volume (hydraulic)</td><td>volume</td><td>ΔV/V</td></tr><tr><td>shear (tangential)</td><td>shape, not volume</td><td>Δx/h = tan φ</td></tr></table><h4>Worked example</h4><p>A 100 N load on a wire of cross-section 2 mm² gives σ = 100/(2 × 10⁻⁶) = 5 × 10⁷ N/m². Stretching it by 0.5 mm over 2 m is a strain of 2.5 × 10⁻⁴.</p><h4>Common mistake</h4><p>Using the diameter instead of the area, and forgetting to convert mm² to m². 1 mm² = 10⁻⁶ m², which changes the answer by a factor of a million.</p>", "gu": "<h4>વ્યાખ્યાઓ</h4><p><b>પ્રતિબળ</b> = પુનઃસ્થાપક બળ / ક્ષેત્રફળ, σ = F/A, N/m² (પાસ્કલ)માં. <b>વિકૃતિ</b> = પરિમાણમાં થતો અંશતઃ ફેરફાર; તેને એકમ હોતું નથી.</p><h4>ત્રણ પ્રકારનાં પ્રતિબળ અને વિકૃતિ</h4><table><tr><th>પ્રકાર</th><th>શું બદલાય</th><th>વિકૃતિ</th></tr><tr><td>તણાવ / સંકોચન</td><td>લંબાઈ</td><td>ΔL/L</td></tr><tr><td>ઘનફળ (દ્રવ્યાવસ્થિક)</td><td>ઘનફળ</td><td>ΔV/V</td></tr><tr><td>શિયર (સ્પર્શીય)</td><td>આકાર, ઘનફળ નહીં</td><td>Δx/h = tan φ</td></tr></table><h4>ઉકેલાયેલ દાખલો</h4><p>2 mm² કાપવાળા તાર પર 100 N ભાર σ = 100/(2 × 10⁻⁶) = 5 × 10⁷ N/m² આપે. 2 m પર 0.5 mm ખેંચાણ એ 2.5 × 10⁻⁴ વિકૃતિ છે.</p><h4>સામાન્ય ભૂલ</h4><p>ક્ષેત્રફળને બદલે વ્યાસ વાપરવો, અને mm² ને m² માં ફેરવવાનું ભૂલવું. 1 mm² = 10⁻⁶ m², જે જવાબમાં લાખ ગણો ફરક પાડે.</p>"}, "syllabus_item": "3.1.2"}, {"h": {"en": "1.3 Hooke's law and the elastic limit", "gu": "1.3 હૂકનો નિયમ અને સ્થિતિસ્થાપક મર્યાદા"}, "body": {"en": "<h4>Statement</h4><p>Within the elastic limit, stress is directly proportional to strain: σ ∝ ε, or σ = E ε where E is the modulus of elasticity of the material.</p><h4>What it means in practice</h4><ul><li>Doubling the load doubles the extension, as long as the limit is not crossed.</li><li>The spring constant k = F/x is Hooke's law written for a spring.</li><li>A graph of stress against strain is a straight line through the origin only in this region.</li></ul><h4>Worked example</h4><p>A spring of k = 500 N/m stretched 4 cm carries F = 500 × 0.04 = 20 N. Stretch it 10 cm and the force is 50 N — until the coils close or the wire yields.</p><h4>Common mistake</h4><p>Using Hooke's law past the yield point. A wire loaded beyond its limit keeps stretching with no further increase in load.</p>", "gu": "<h4>વિધાન</h4><p>સ્થિતિસ્થાપક મર્યાદા સુધી પ્રતિબળ વિકૃતિના સમપ્રમાણમાં હોય છે: σ ∝ ε, અથવા σ = E ε, જ્યાં E પદાર્થનો સ્થિતિસ્થાપકતા ગુણાંક છે.</p><h4>વ્યવહારમાં તેનો અર્થ</h4><ul><li>ભાર બમણો કરો તો ખેંચાણ પણ બમણું, જ્યાં સુધી મર્યાદા ન વળંગાય.</li><li>સ્પ્રિંગ અચળાંક k = F/x એ સ્પ્રિંગ માટે લખેલો હૂકનો નિયમ છે.</li><li>પ્રતિબળ–વિકૃતિનો આલેખ ફક્ત આ વિસ્તારમાં ઉદ્ગમમાંથી પસાર થતી સીધી રેખા હોય છે.</li></ul><h4>ઉકેલાયેલ દાખલો</h4><p>k = 500 N/m ની સ્પ્રિંગ 4 cm ખેંચાય તો F = 500 × 0.04 = 20 N. 10 cm ખેંચો તો 50 N — જ્યાં સુધી કોઇલ બંધ ન થાય કે તાર થાકે નહીં.</p><h4>સામાન્ય ભૂલ</h4><p>ઉપજ મર્યાદા પછી પણ હૂકનો નિયમ વાપરવો. મર્યાદા પછી ભાર વધ્યા વગર પણ તાર ખેંચાતો રહે છે.</p>"}, "syllabus_item": "3.1.3"}, {"h": {"en": "1.4 Young's, bulk and shear modulus", "gu": "1.4 યંગ, બલ્ક અને શિયર ગુણાંક"}, "body": {"en": "<h4>The three moduli</h4><table><tr><th>Modulus</th><th>Formula</th><th>Measures resistance to</th></tr><tr><td>Young's modulus Y</td><td>Y = (F/A)/(ΔL/L) = σ/ε</td><td>stretching of a wire</td></tr><tr><td>Bulk modulus K</td><td>K = −ΔP/(ΔV/V)</td><td>change of volume of a solid or liquid</td></tr><tr><td>Shear modulus G</td><td>G = (F/A)/(Δx/h)</td><td>change of shape at constant volume</td></tr></table><h4>Typical values</h4><table><tr><th>Material</th><th>Young's modulus</th></tr><tr><td>steel</td><td>2.0 × 10¹¹ N/m²</td></tr><tr><td>copper</td><td>1.2 × 10¹¹ N/m²</td></tr><tr><td>aluminium</td><td>0.70 × 10¹¹ N/m²</td></tr><tr><td>rubber</td><td>0.01–0.1 × 10¹¹ N/m²</td></tr></table><h4>Worked example</h4><p>A steel wire of area 1 mm² carrying 50 N over 2 m: ΔL = FL/(AY) = 50 × 2/(10⁻⁶ × 2 × 10¹¹) = 0.5 mm.</p><h4>Common mistake</h4><p>Thinking a stiff material is also strong. Stiffness is Y (resistance to bending), strength is the breaking stress; glass is stiff and brittle, rubber is soft and tough.</p>", "gu": "<h4>ત્રણ ગુણાંક</h4><table><tr><th>ગુણાંક</th><th>સૂત્ર</th><th>કઈ વિકૃતિ સામે પ્રતિરોધ</th></tr><tr><td>યંગ ગુણાંક Y</td><td>Y = (F/A)/(ΔL/L) = σ/ε</td><td>તારનું ખેંચાણ</td></tr><tr><td>બલ્ક ગુણાંક K</td><td>K = −ΔP/(ΔV/V)</td><td>ઘન કે પ્રવાહીના ઘનફળનો ફેરફાર</td></tr><tr><td>શિયર ગુણાંક G</td><td>G = (F/A)/(Δx/h)</td><td>અચળ ઘનફળે આકારનો ફેરફાર</td></tr></table><h4>સામાન્ય મૂલ્યો</h4><table><tr><th>પદાર્થ</th><th>યંગ ગુણાંક</th></tr><tr><td>સ્ટીલ</td><td>2.0 × 10¹¹ N/m²</td></tr><tr><td>તાંબું</td><td>1.2 × 10¹¹ N/m²</td></tr><tr><td>એલ્યુમિનિયમ</td><td>0.70 × 10¹¹ N/m²</td></tr><tr><td>રબર</td><td>0.01–0.1 × 10¹¹ N/m²</td></tr></table><h4>ઉકેલાયેલ દાખલો</h4><p>1 mm² કાપવાળો સ્ટીલ તાર 2 m પર 50 N લે: ΔL = FL/(AY) = 50 × 2/(10⁻⁶ × 2 × 10¹¹) = 0.5 mm.</p><h4>સામાન્ય ભૂલ</h4><p>કઠણ પદાર્થ મજબૂત પણ હશે એમ માનવું. કઠોરતા Y છે (વળવાનો પ્રતિરોધ), મજબૂતાઈ તૂટવાનું પ્રતિબળ છે; કાચ કઠણ પણ ભંગુર છે, રબર નરમ પણ ટકાઉ.</p>"}, "diagram": "u3_moduli", "syllabus_item": "3.1.4"}, {"h": {"en": "1.5 The stress-strain curve", "gu": "1.5 પ્રતિબળ-વિકૃતિ વક્ર"}, "body": {"en": "<h4>The five points on the curve</h4><table><tr><th>Point</th><th>Meaning</th></tr><tr><td>O to A</td><td>straight line: Hooke's law holds, slope = Y</td></tr><tr><td>A: proportional limit</td><td>the straight line ends here</td></tr><tr><td>B: elastic limit or yield point</td><td>beyond B the wire stays stretched</td></tr><tr><td>D: ultimate tensile strength</td><td>the highest stress the material carries</td></tr><tr><td>E: fracture point</td><td>the wire breaks</td></tr></table><h4>Why engineers care</h4><p>Design uses only the straight part OA, with a safety factor: the working stress is kept well below the yield stress B so that the part springs back after every load.</p><h4>Worked example</h4><p>A mild-steel specimen with yield stress 250 MPa and a safety factor of 2.5 may be loaded to 100 MPa, which for a 10 mm² section is 1000 N.</p><h4>Common mistake</h4><p>Reading the curve's height as strength alone. Ductile steel reaches D and then stretches far before E; glass breaks at D almost at once.</p>", "gu": "<h4>વક્ર પરનાં પાંચ બિંદુ</h4><table><tr><th>બિંદુ</th><th>અર્થ</th></tr><tr><td>O થી A</td><td>સીધી રેખા: હૂકનો નિયમ લાગુ, ઢાળ = Y</td></tr><tr><td>A: સમપ્રમાણ મર્યાદા</td><td>સીધી રેખા અહીં પૂરી થાય</td></tr><tr><td>B: સ્થિતિસ્થાપક મર્યાદા કે ઉપજ બિંદુ</td><td>B પછી તાર ખેંચાયેલો રહે</td></tr><tr><td>D: અંતિમ તણાવ મજબૂતાઈ</td><td>પદાર્થ લઈ શકે તે સૌથી વધુ પ્રતિબળ</td></tr><tr><td>E: ભંગ બિંદુ</td><td>તાર તૂટે</td></tr></table><h4>ઇજનેરો કેમ ધ્યાન આપે</h4><p>રચના ફક્ત સીધા ભાગ OA નો ઉપયોગ કરે, સલામતી અવયવ સાથે: કાર્યકારી પ્રતિબળ ઉપજ પ્રતિબળ B કરતાં ઘણું નીચે રખાય જેથી દરેક ભાર પછી પાર્ટ પાછો સ્થિતિસ્થાપક રહે.</p><h4>ઉકેલાયેલ દાખલો</h4><p>250 MPa ઉપજ પ્રતિબળવાળા માઇલ્ડ સ્ટીલના નમૂના પર 2.5 નો સલામતી અવયવ હોય તો 100 MPa સુધી ભાર આપી શકાય, જે 10 mm² કાપ માટે 1000 N છે.</p><h4>સામાન્ય ભૂલ</h4><p>વક્રની ઊંચાઈને ફક્ત મજબૂતાઈ ગણવી. નમ્ય સ્ટીલ D સુધી પહોંચીને E પહેલાં ઘણું ખેંચાય છે; કાચ D પર જ લગભગ તરત તૂટે છે.</p>"}, "syllabus_item": "3.1.5"}, {"h": {"en": "1.6 Elastic potential energy and the Searle experiment", "gu": "1.6 સ્થિતિસ્થાપક સ્થિતિઊર્જા અને સર્લનો પ્રયોગ"}, "body": {"en": "<h4>Energy stored</h4><p>Work done in stretching a wire within the elastic limit is stored as elastic potential energy: U = ½ F ΔL = ½ × stress × strain × volume.</p><h4>The Searle experiment (practical 4)</h4><ol><li>Hang a steel wire from a rigid support beside a reference wire.</li><li>Add known loads and read the extension with a vernier scale or micrometer.</li><li>Measure the wire diameter with a screw gauge and the length with a tape.</li><li>Plot load against extension; Y = (F/A)/(ΔL/L) from the straight part.</li></ol><h4>Worked example</h4><p>Stretching a wire by 0.5 mm with 50 N stores U = ½ × 50 × 5 × 10⁻⁴ = 0.0125 J.</p><h4>Common mistake</h4><p>Using U = F ΔL without the ½. The force grows from zero to F, so the average is F/2.</p>", "gu": "<h4>સંગ્રહાયેલી ઊર્જા</h4><p>સ્થિતિસ્થાપક મર્યાદામાં તાર ખેંચવામાં થતું કાર્ય સ્થિતિસ્થાપક સ્થિતિઊર્જા તરીકે સંગ્રહાય છે: U = ½ F ΔL = ½ × પ્રતિબળ × વિકૃતિ × ઘનફળ.</p><h4>સર્લનો પ્રયોગ (પ્રેક્ટિકલ 4)</h4><ol><li>કઠણ આધારથી સ્ટીલનો તાર લટકાવો, સાથે સંદર્ભ તાર પણ.</li><li>જાણીતા ભાર ઉમેરો અને વર્નિયર કે માઇક્રોમીટરથી ખેંચાણ વાંચો.</li><li>તારનો વ્યાસ સ્ક્રુ ગેજથી અને લંબાઈ ટેપથી માપો.</li><li>ભાર સામે ખેંચાણનો આલેખ દોરો; સીધા ભાગ પરથી Y = (F/A)/(ΔL/L).</li></ol><h4>ઉકેલાયેલ દાખલો</h4><p>50 N થી 0.5 mm ખેંચાયેલા તારમાં U = ½ × 50 × 5 × 10⁻⁴ = 0.0125 J સંગ્રહાય છે.</p><h4>સામાન્ય ભૂલ</h4><p>½ વગર U = F ΔL વાપરવું. બળ શૂન્યથી F સુધી વધે છે, તેથી સરેરાશ F/2 થાય.</p>"}, "syllabus_item": "3.1"}]}, {"title": {"en": "2. Surface Tension", "gu": "2. પૃષ્ઠતાણ"}, "items": [{"h": {"en": "2.1 Surface tension: the concept and its units", "gu": "2.1 પૃષ્ઠતાણ: ખ્યાલ અને એકમો"}, "body": {"en": "<h4>Definition</h4><p><b>Surface tension</b> T is the force per unit length acting along the surface of a liquid, perpendicular to any line drawn on it, tending to reduce the area. T = F/L, unit N/m.</p><p>It also equals the surface energy per unit area (J/m²), which is why the same symbol carries two units.</p><h4>Effects you can see</h4><table><tr><th>Observation</th><th>Reason</th></tr><tr><td>a drop is spherical</td><td>a sphere has the least area for a given volume</td></tr><tr><td>a needle floats on water</td><td>the surface film bends and supports it</td></tr><tr><td>water rises in a thin tube</td><td>adhesion beats cohesion and the meniscus pulls it up</td></tr><tr><td>rain forms drops, not a sheet</td><td>the liquid pulls itself into minimum area</td></tr></table><h4>Worked example</h4><p>A wire frame with a 10 cm sliding wire and a soap film needs F = 2 T L because the film has two surfaces: F = 2 × 0.025 × 0.1 = 5 × 10⁻³ N.</p><h4>Common mistake</h4><p>Forgetting the factor 2 for a soap film. A film has a front and a back surface; a liquid drop boundary has only one.</p>", "gu": "<h4>વ્યાખ્યા</h4><p><b>પૃષ્ઠતાણ</b> T એ પ્રવાહીની સપાટી પર દોરેલી કોઈપણ રેખાને લંબરૂપે, એકમ લંબાઈ દીઠ લાગતું બળ છે, જે ક્ષેત્રફળ ઘટાડવા પ્રયત્ન કરે. T = F/L, એકમ N/m.</p><p>તે એકમ ક્ષેત્રફળ દીઠ પૃષ્ઠઊર્જા (J/m²) પણ છે, તેથી જ એક જ સંજ્ઞાને બે એકમ હોય છે.</p><h4>દેખીતી અસરો</h4><table><tr><th>નિરીક્ષણ</th><th>કારણ</th></tr><tr><td>ટીપું ગોળાકાર હોય</td><td>આપેલ ઘનફળ માટે ગોળાનું ક્ષેત્રફળ સૌથી ઓછું</td></tr><tr><td>પાણી પર સોય તરે</td><td>સપાટીનો પડ વળીને ટેકો આપે</td></tr><tr><td>પાતળી નળીમાં પાણી ચઢે</td><td>આસક્તિ સંસક્તિ પર ભારે, મેનિસ્કસ ઉપર ખેંચે</td></tr><tr><td>વરસાદ ટીપાં બનાવે, પડ નહીં</td><td>પ્રવાહી પોતાને લઘુતમ ક્ષેત્રફળમાં ખેંચે</td></tr></table><h4>ઉકેલાયેલ દાખલો</h4><p>10 cm સરકતા તારવાળી ફ્રેમ પર સાબુનો પડ માટે F = 2 T L જોઈએ, કારણ કે પડને બે સપાટી હોય: F = 2 × 0.025 × 0.1 = 5 × 10⁻³ N.</p><h4>સામાન્ય ભૂલ</h4><p>સાબુના પડ માટે 2 નો અવયવ ભૂલવો. પડને આગળ અને પાછળ બે સપાટી હોય; પ્રવાહી ટીપાની સીમાને ફક્ત એક.</p>"}, "diagram": "u3_surface", "syllabus_item": "3.2.1"}, {"h": {"en": "2.2 Cohesive and adhesive forces", "gu": "2.2 સંસક્તિ અને આસક્તિ બળો"}, "body": {"en": "<h4>Definitions</h4><p><b>Cohesive force</b> is the attraction between molecules of the same substance. <b>Adhesive force</b> is the attraction between molecules of different substances.</p><h4>What the balance decides</h4><table><tr><th>Balance</th><th>Result</th><th>Example</th></tr><tr><td>cohesion > adhesion</td><td>liquid does not wet the solid, meniscus convex</td><td>mercury in glass</td></tr><tr><td>adhesion > cohesion</td><td>liquid wets the solid, meniscus concave</td><td>water in glass</td></tr><tr><td>cohesion > adhesion to air</td><td>liquid forms a drop instead of spreading</td><td>water on a waxed surface</td></tr></table><h4>Engineering use</h4><ul><li>Paint must adhere to steel more strongly than it coheres to itself, or it peels.</li><li>Lubricants are chosen so that they do not wet the surfaces too strongly, which is why oil and water are both used in different bearings.</li><li>Detergents work by lowering the surface tension of water so that it wets the cloth.</li></ul><h4>Common mistake</h4><p>Saying mercury 'repels' glass. It simply coheres to itself more strongly than it adheres to glass.</p>", "gu": "<h4>વ્યાખ્યાઓ</h4><p><b>સંસક્તિ બળ</b> એ એક જ પદાર્થના અણુઓ વચ્ચેનું આકર્ષણ છે. <b>આસક્તિ બળ</b> એ જુદા પદાર્થોના અણુઓ વચ્ચેનું આકર્ષણ છે.</p><h4>સંતુલન શું નક્કી કરે</h4><table><tr><th>સંતુલન</th><th>પરિણામ</th><th>ઉદાહરણ</th></tr><tr><td>સંસક્તિ > આસક્તિ</td><td>પ્રવાહી સપાટીને ભીની કરતું નથી, મેનિસ્કસ બહિર્ગોળ</td><td>કાચમાં પારો</td></tr><tr><td>આસક્તિ > સંસક્તિ</td><td>પ્રવાહી સપાટીને ભીની કરે, મેનિસ્કસ અંતર્ગોળ</td><td>કાચમાં પાણી</td></tr><tr><td>હવા સાથે આસક્તિ કરતાં સંસક્તિ વધુ</td><td>પ્રવાહી ફેલાયા વગર ટીપું બનાવે</td><td>મીણવાળી સપાટી પર પાણી</td></tr></table><h4>ઇજનેરી ઉપયોગ</h4><ul><li>પેન્ટ સ્ટીલ સાથે પોતાના સંસક્તિ બળ કરતાં વધુ મજબૂતાઈથી જોડાવું જોઈએ, નહીં તો ઊતરી જાય.</li><li>લુબ્રિકન્ટ એવા પસંદ થાય જે સપાટીને બહુ ભીની ન કરે, તેથી જુદા બેરિંગમાં તેલ અને પાણી બંને વપરાય.</li><li>ડિટરજન્ટ પાણીનું પૃષ્ઠતાણ ઘટાડે જેથી તે કપડાને ભીનું કરે.</li></ul><h4>સામાન્ય ભૂલ</h4><p>પારો કાચને 'દૂર કરે' એમ કહેવું. તે કાચ સાથે આસક્તિ કરતાં પોતાની સાથે વધુ સંસક્તિ ધરાવે છે.</p>"}, "syllabus_item": "3.2.2"}, {"h": {"en": "2.3 Molecular range and the sphere of influence", "gu": "2.3 આણ્વીય પરાસ અને પ્રભાવ ગોળો"}, "body": {"en": "<h4>Definitions</h4><p><b>Molecular range</b> is the maximum distance (about 10⁻⁹ m) up to which the attraction between two molecules is felt. A <b>sphere of influence</b> of radius equal to the molecular range is drawn around a molecule: only the molecules inside it pull on it.</p><h4>Why the surface behaves differently</h4><table><tr><th>Molecule</th><th>Sphere of influence</th><th>Net pull</th></tr><tr><td>deep inside</td><td>completely filled</td><td>zero, all round</td></tr><tr><td>at the surface</td><td>half filled, half empty</td><td>inward, so the surface is stretched</td></tr></table><h4>Worked example</h4><p>If the molecular range is 10⁻⁹ m, a molecule at the surface feels no pull from above beyond 1 nm, while one 5 nm deep has a full sphere — that difference is the surface energy of about 0.072 J/m² for water.</p><h4>Common mistake</h4><p>Thinking the surface layer is thicker than a few molecules. It is only the molecular range deep, roughly a nanometre.</p>", "gu": "<h4>વ્યાખ્યાઓ</h4><p><b>આણ્વીય પરાસ</b> એ સૌથી વધુ અંતર (લગભગ 10⁻⁹ m) છે જ્યાં સુધી બે અણુઓ વચ્ચેનું આકર્ષણ અનુભવાય. આણ્વીય પરાસ જેટલી ત્રિજ્યાનો <b>પ્રભાવ ગોળો</b> અણુની આસપાસ દોરાય: તેમાં રહેલા અણુઓ જ તેને ખેંચે.</p><h4>સપાટી જુદી કેમ વર્તે</h4><table><tr><th>અણુ</th><th>પ્રભાવ ગોળો</th><th>ચોખ્ખું આકર્ષણ</th></tr><tr><td>ઊંડે અંદર</td><td>પૂરો ભરેલો</td><td>શૂન્ય, ચારે બાજુ સમાન</td></tr><tr><td>સપાટી પર</td><td>અડધો ભરેલો, અડધો ખાલી</td><td>અંદર તરફ, તેથી સપાટી તંગ</td></tr></table><h4>ઉકેલાયેલ દાખલો</h4><p>આણ્વીય પરાસ 10⁻⁹ m હોય તો સપાટી પરનો અણુ 1 nm ઉપરથી કોઈ ખેંચાણ અનુભવતું નથી, જ્યારે 5 nm ઊંડે રહેલા અણુનો ગોળો પૂરો છે — એ જ તફાવત પાણી માટે લગભગ 0.072 J/m² પૃષ્ઠઊર્જા છે.</p><h4>સામાન્ય ભૂલ</h4><p>સપાટીનો સ્તર થોડા અણુઓ કરતાં જાડો છે એમ માનવું. તે ફક્ત આણ્વીય પરાસ જેટલો, લગભગ એક નેનોમીટર જાડો હોય છે.</p>"}, "syllabus_item": "3.2.3"}, {"h": {"en": "2.4 Laplace's molecular theory of surface tension", "gu": "2.4 પૃષ્ઠતાણનો લાપ્લાસનો આણ્વીય સિદ્ધાંત"}, "body": {"en": "<h4>The idea</h4><p>A molecule inside a liquid is pulled equally in all directions. A molecule at the surface is pulled only inwards and downwards, so the surface behaves like a stretched membrane that tries to shrink.</p><h4>What the theory explains</h4><ol><li>Why the surface has energy: pulling a molecule to the surface needs work.</li><li>Why a free drop is spherical: minimum surface area for the volume.</li><li>Why surface tension falls with temperature: molecules move faster and the range of attraction is less effective.</li></ol><h4>Worked example</h4><p>For water T = 0.072 N/m at 20 °C and about 0.059 N/m at 100 °C, a fall of nearly 20 % — enough to change how a boiler surface wets and how condensate drains.</p><h4>Common mistake</h4><p>Believing the surface is a real skin. There is no membrane; the effect comes from the unbalanced molecular pull.</p>", "gu": "<h4>ખ્યાલ</h4><p>પ્રવાહીની અંદરનો અણુ ચારે બાજુ સમાન ખેંચાણ અનુભવે છે. સપાટી પરનો અણુ ફક્ત અંદર અને નીચે ખેંચાય છે, તેથી સપાટી તંગ પડ જેવી વર્તે જે સંકોચાવા પ્રયત્ન કરે.</p><h4>સિદ્ધાંત શું સમજાવે</h4><ol><li>સપાટીમાં ઊર્જા કેમ છે: અણુને સપાટી પર લાવવા કાર્ય કરવું પડે.</li><li>મુક્ત ટીપું ગોળાકાર કેમ છે: ઘનફળ માટે લઘુતમ પૃષ્ઠ ક્ષેત્રફળ.</li><li>તાપમાન સાથે પૃષ્ઠતાણ કેમ ઘટે: અણુઓ ઝડપથી ફરે અને આકર્ષણની અસર ઘટે.</li></ol><h4>ઉકેલાયેલ દાખલો</h4><p>પાણી માટે 20 °C પર T = 0.072 N/m અને 100 °C પર લગભગ 0.059 N/m, એટલે લગભગ 20 % ઘટાડો — જે બોઇલરની સપાટી ભીની થવાની રીત અને કન્ડેન્સેટ વહેવાની રીત બદલી નાખે.</p><h4>સામાન્ય ભૂલ</h4><p>સપાટીને સાચી ત્વચા માનવી. કોઈ પડ નથી; અસર અસંતુલિત આણ્વીય ખેંચાણમાંથી આવે છે.</p>"}, "syllabus_item": "3.2.4"}, {"h": {"en": "2.5 Surface tension and surface energy", "gu": "2.5 પૃષ્ઠતાણ અને પૃષ્ઠઊર્જા"}, "body": {"en": "<h4>The relation</h4><p>Work done in increasing the surface area by ΔA is W = T ΔA, so surface tension equals the surface energy per unit area: T = W/ΔA. Numerically 1 N/m = 1 J/m².</p><h4>Worked example</h4><p>Blowing a soap bubble of radius 2 cm needs W = T × 2 × 4πr² = 0.025 × 2 × 4π(0.02)² = 2.5 × 10⁻⁴ J, because a bubble has two surfaces.</p><h4>Engineering reading</h4><p>Atomising a liquid into fine droplets costs surface energy, which is why a nozzle needs pressure and why fine sprays are hard to make with viscous liquids.</p><h4>Common mistake</h4><p>Using 4πr² for a bubble instead of 2 × 4πr², or applying the factor 2 to a drop, which has only one surface.</p>", "gu": "<h4>સંબંધ</h4><p>સપાટીનું ક્ષેત્રફળ ΔA જેટલું વધારવામાં થતું કાર્ય W = T ΔA છે, તેથી પૃષ્ઠતાણ એકમ ક્ષેત્રફળ દીઠ પૃષ્ઠઊર્જા બરાબર છે: T = W/ΔA. આંકડામાં 1 N/m = 1 J/m².</p><h4>ઉકેલાયેલ દાખલો</h4><p>2 cm ત્રિજ્યાનો સાબુનો પરપોટો ફૂંકવા W = T × 2 × 4πr² = 0.025 × 2 × 4π(0.02)² = 2.5 × 10⁻⁴ J જોઈએ, કારણ કે પરપોટાને બે સપાટી હોય.</p><h4>ઇજનેરી અર્થઘટન</h4><p>પ્રવાહીને ઝીણા ટીપાંમાં છંટકાવવા પૃષ્ઠઊર્જા ખર્ચાય, તેથી નોઝલને દબાણ જોઈએ અને શ્યાન પ્રવાહીના ઝીણા ફુવારા બનાવવા અઘરા છે.</p><h4>સામાન્ય ભૂલ</h4><p>પરપોટા માટે 2 × 4πr² ને બદલે 4πr² વાપરવું, અથવા ટીપા પર 2 નો અવયવ લગાડવો, જેને ફક્ત એક સપાટી હોય.</p>"}, "syllabus_item": "3.2.6"}, {"h": {"en": "2.6 Angle of contact", "gu": "2.6 સંપર્ક કોણ"}, "body": {"en": "<h4>Definition</h4><p>The <b>angle of contact</b> θ is the angle between the tangent to the liquid surface and the solid surface inside the liquid, measured at the point of contact.</p><table><tr><th>Liquid and surface</th><th>Angle of contact</th><th>Meniscus</th></tr><tr><td>water and clean glass</td><td>0° to 8°</td><td>concave, rises</td></tr><tr><td>mercury and glass</td><td>about 140°</td><td>convex, falls</td></tr><tr><td>water and waxed surface</td><td>about 110°</td><td>convex</td></tr><tr><td>kerosene and glass</td><td>near 0°</td><td>concave</td></tr></table><h4>What fixes the angle</h4><p>The angle is set by the balance of three surface tensions: solid–liquid, solid–vapour and liquid–vapour. A liquid wets a surface when θ < 90°.</p><h4>Common mistake</h4><p>Measuring the angle outside the liquid. It is always measured inside, which is why mercury reads about 140° and not 40°.</p>", "gu": "<h4>વ્યાખ્યા</h4><p><b>સંપર્ક કોણ</b> θ એ પ્રવાહીની સપાટીને સ્પર્શક અને પ્રવાહીની અંદરની ઘન સપાટી વચ્ચેનો ખૂણો છે, જે સંપર્ક બિંદુએ મપાય.</p><table><tr><th>પ્રવાહી અને સપાટી</th><th>સંપર્ક કોણ</th><th>મેનિસ્કસ</th></tr><tr><td>પાણી અને સ્વચ્છ કાચ</td><td>0° થી 8°</td><td>અંતર્ગોળ, ચઢે</td></tr><tr><td>પારો અને કાચ</td><td>લગભગ 140°</td><td>બહિર્ગોળ, ઉતરે</td></tr><tr><td>પાણી અને મીણવાળી સપાટી</td><td>લગભગ 110°</td><td>બહિર્ગોળ</td></tr><tr><td>કેરોસીન અને કાચ</td><td>લગભગ 0°</td><td>અંતર્ગોળ</td></tr></table><h4>કોણ શું નક્કી કરે</h4><p>કોણ ત્રણ પૃષ્ઠતાણના સંતુલનથી નક્કી થાય: ઘન–પ્રવાહી, ઘન–બાષ્પ અને પ્રવાહી–બાષ્પ. θ < 90° હોય ત્યારે પ્રવાહી સપાટીને ભીની કરે.</p><h4>સામાન્ય ભૂલ</h4><p>કોણ પ્રવાહીની બહાર માપવો. તે હંમેશા અંદર મપાય, તેથી જ પારો 40° નહીં પણ લગભગ 140° વાંચે.</p>"}, "diagram": "u3_capillary", "syllabus_item": "3.2.5"}]}, {"title": {"en": "3. Capillarity and the Uses of Surface Tension", "gu": "3. કેશનળી ચઢાણ અને પૃષ્ઠતાણના ઉપયોગો"}, "items": [{"h": {"en": "3.1 The Ascent formula (no derivation)", "gu": "3.1 આરોહણ સૂત્ર (સાબિતી વગર)"}, "body": {"en": "<h4>The formula</h4><p>A liquid of surface tension T, density ρ and contact angle θ rises in a tube of radius r to height h: <b>h = 2T cos θ / (ρ g r)</b>. Mercury, with θ > 90°, gives a negative h, that is a depression.</p><h4>What the formula says</h4><ul><li>Thinner tube, higher rise: h ∝ 1/r.</li><li>Lighter liquid, higher rise: h ∝ 1/ρ.</li><li>Warmer liquid, lower rise because T falls with temperature.</li><li>For water in glass cos θ ≈ 1, so h = 2T/(ρ g r).</li></ul><h4>Worked example</h4><p>Water (T = 0.072 N/m) in a tube of r = 0.2 mm: h = 2 × 0.072/(1000 × 9.8 × 2 × 10⁻⁴) = 0.0735 m = 7.35 cm.</p><h4>Common mistake</h4><p>Using the diameter for r. A 0.2 mm bore has r = 0.1 mm, which doubles the answer.</p>", "gu": "<h4>સૂત્ર</h4><p>પૃષ્ઠતાણ T, ઘનતા ρ અને સંપર્ક કોણ θ વાળું પ્રવાહી r ત્રિજ્યાની નળીમાં h ઊંચાઈ સુધી ચઢે: <b>h = 2T cos θ / (ρ g r)</b>. પારા માટે θ > 90° હોવાથી h ઋણ મળે, એટલે ઉતાર.</p><h4>સૂત્ર શું કહે</h4><ul><li>પાતળી નળી, વધુ ચઢાણ: h ∝ 1/r.</li><li>હલકું પ્રવાહી, વધુ ચઢાણ: h ∝ 1/ρ.</li><li>ગરમ પ્રવાહી, ઓછું ચઢાણ કારણ કે T તાપમાન સાથે ઘટે.</li><li>કાચમાં પાણી માટે cos θ ≈ 1, તેથી h = 2T/(ρ g r).</li></ul><h4>ઉકેલાયેલ દાખલો</h4><p>r = 0.2 mm ની નળીમાં પાણી (T = 0.072 N/m): h = 2 × 0.072/(1000 × 9.8 × 2 × 10⁻⁴) = 0.0735 m = 7.35 cm.</p><h4>સામાન્ય ભૂલ</h4><p>r માટે વ્યાસ વાપરવો. 0.2 mm બોરની r = 0.1 mm હોય, જે જવાબ બમણો કરે.</p>"}, "syllabus_item": "3.2.5"}, {"h": {"en": "3.2 Applications of surface tension", "gu": "3.2 પૃષ્ઠતાણના ઉપયોગો"}, "body": {"en": "<h4>Where it is used deliberately</h4><table><tr><th>Application</th><th>How surface tension acts</th></tr><tr><td>detergents and soap</td><td>lower T so water wets the cloth and lifts grease</td></tr><tr><td>waterproofing and wax coating</td><td>high contact angle keeps drops from spreading</td></tr><tr><td>soldering and brazing</td><td>flux lowers T so solder wets the joint</td></tr><tr><td>cooling-tower packing, wicks</td><td>capillary rise spreads the liquid over the surface</td></tr><tr><td>spray nozzles and paints</td><td>droplet size set by T and pressure</td></tr><tr><td>anti-foam and emulsifiers</td><td>change T at interfaces to break or hold a foam</td></tr></table><h4>Worked example</h4><p>A soap film on a frame is pulled flat by surface tension; adding soap to clean water drops T from 0.072 to about 0.030 N/m, so the water penetrates a fabric instead of beading on it.</p><h4>Common mistake</h4><p>Thinking detergents clean by 'bubbles'. They work because they lower the surface tension and emulsify the grease.</p>", "gu": "<h4>જ્યાં તેનો ઉપયોગ થાય</h4><table><tr><th>ઉપયોગ</th><th>પૃષ્ઠતાણ કેવી રીતે કામ કરે</th></tr><tr><td>ડિટરજન્ટ અને સાબુ</td><td>T ઘટાડે જેથી પાણી કપડાને ભીનું કરી ચરબી ઉપાડે</td></tr><tr><td>વોટરપ્રૂફિંગ અને મીણ કોટિંગ</td><td>વધુ સંપર્ક કોણ ટીપાંને ફેલાવા દેતો નથી</td></tr><tr><td>સોલ્ડરિંગ અને બ્રેઝિંગ</td><td>ફ્લક્સ T ઘટાડે જેથી સોલ્ડર જોડને ભીની કરે</td></tr><tr><td>કૂલિંગ ટાવર પેકિંગ, વિક</td><td>કેશનળી ચઢાણ પ્રવાહીને સપાટી પર ફેલાવે</td></tr><tr><td>સ્પ્રે નોઝલ અને પેન્ટ</td><td>ટીપાનું માપ T અને દબાણ નક્કી કરે</td></tr><tr><td>એન્ટી-ફોમ અને ઇમલ્સિફાયર</td><td>ઇન્ટરફેસ પર T બદલીને ફોમ તોડે કે ટકાવે</td></tr></table><h4>ઉકેલાયેલ દાખલો</h4><p>ફ્રેમ પરનો સાબુનો પડ પૃષ્ઠતાણથી સપાટ ખેંચાય; સ્વચ્છ પાણીમાં સાબુ નાખતાં T 0.072 થી લગભગ 0.030 N/m થાય, તેથી પાણી કાપડમાં ઊતરે, તેના પર ટીપાં ન બનાવે.</p><h4>સામાન્ય ભૂલ</h4><p>ડિટરજન્ટ 'પરપોટા'થી સાફ કરે એમ માનવું. તે પૃષ્ઠતાણ ઘટાડીને ચરબીનું ઇમલ્શન બનાવે છે તેથી કામ કરે.</p>"}, "syllabus_item": "3.2.7"}, {"h": {"en": "3.3 Effect of temperature and impurity", "gu": "3.3 તાપમાન અને અશુદ્ધિની અસર"}, "body": {"en": "<h4>Rules</h4><table><tr><th>Change</th><th>Effect on surface tension</th><th>Example</th></tr><tr><td>temperature rises</td><td>T falls, to zero at the critical point</td></tr><tr><td>highly soluble impurity (salt, sugar)</td><td>T increases slightly</td><td>salt water</td></tr><tr><td>sparingly soluble impurity (soap, detergent, oil)</td><td>T decreases sharply</td><td>soap solution</td></tr><tr><td>dust or dirt on the surface</td><td>T falls, film weakens</td></tr></table><h4>Numbers worth remembering</h4><ul><li>Water: 0.0756 N/m at 0 °C, 0.0728 at 20 °C, 0.0589 at 100 °C.</li><li>Mercury: about 0.465 N/m at 20 °C, the highest of the common liquids.</li><li>A 0.1 % soap addition can halve the value — the reason a clean needle floats and a soapy one sinks.</li></ul><h4>Engineering consequence</h4><p>In a boiler, a temperature rise lowers T and can also change θ, so the water film on tubes changes from dropwise to filmwise condensation — a difference in heat-transfer coefficient of several times.</p><h4>Common mistake</h4><p>Assuming every impurity raises T. Only highly soluble ones do; soap-like impurities lower it.</p>", "gu": "<h4>નિયમો</h4><table><tr><th>ફેરફાર</th><th>પૃષ્ઠતાણ પર અસર</th><th>ઉદાહરણ</th></tr><tr><td>તાપમાન વધે</td><td>T ઘટે, ક્રાંતિક બિંદુએ શૂન્ય</td></tr><tr><td>ખૂબ દ્રાવ્ય અશુદ્ધિ (મીઠું, ખાંડ)</td><td>T થોડું વધે</td><td>ખારું પાણી</td></tr><tr><td>ઓછી દ્રાવ્ય અશુદ્ધિ (સાબુ, ડિટરજન્ટ, તેલ)</td><td>T ઝડપથી ઘટે</td><td>સાબુનું દ્રાવણ</td></tr><tr><td>સપાટી પર ધૂળ કે ગંદકી</td><td>T ઘટે, પડ નબળો</td></tr></table><h4>યાદ રાખવા જેવા આંકડા</h4><ul><li>પાણી: 0 °C પર 0.0756 N/m, 20 °C પર 0.0728, 100 °C પર 0.0589.</li><li>પારો: 20 °C પર લગભગ 0.465 N/m, સામાન્ય પ્રવાહીમાં સૌથી વધુ.</li><li>0.1 % સાબુ ઉમેરવાથી મૂલ્ય અડધું થઈ શકે — તેથી જ સ્વચ્છ સોય તરે અને સાબુવાળા પાણીમાં ડૂબે.</li></ul><h4>ઇજનેરી પરિણામ</h4><p>બોઇલરમાં તાપમાન વધવાથી T ઘટે અને θ પણ બદલાય, તેથી ટ્યુબ પરનો પાણીનો પડ ટીપા-આકારમાંથી ફિલ્મ-આકારમાં ફેરવાય — ઉષ્મા-સંક્રમણ ગુણાંકમાં ઘણા ગણો ફરક.</p><h4>સામાન્ય ભૂલ</h4><p>દરેક અશુદ્ધિ T વધારે એમ માનવું. ફક્ત ખૂબ દ્રાવ્ય અશુદ્ધિઓ વધારે; સાબુ જેવી અશુદ્ધિઓ ઘટાડે.</p>"}, "syllabus_item": "3.2.8"}]}, {"title": {"en": "4. Viscosity", "gu": "4. શ્યાનતા"}, "items": [{"h": {"en": "4.1 Viscosity: the concept and its units", "gu": "4.1 શ્યાનતા: ખ્યાલ અને એકમો"}, "body": {"en": "<h4>Definition</h4><p><b>Viscosity</b> is the internal friction of a fluid that opposes the relative motion of its layers. A fluid at rest has no shear stress, but the moment one layer slides over another the friction appears.</p><h4>Units and typical values</h4><p>The SI unit of the coefficient is N·s/m² = Pa·s; the CGS unit is the poise, and 1 Pa·s = 10 poise. Water is the reference thin fluid at about 1 mPa·s.</p><table><tr><th>Fluid at 20 °C</th><th>η in Pa·s</th></tr><tr><td>air</td><td>1.8 × 10⁻⁵</td></tr><tr><td>water</td><td>1.0 × 10⁻³</td></tr><tr><td>kerosene</td><td>1.6 × 10⁻³</td></tr><tr><td>engine oil (SAE 30)</td><td>0.20–0.30</td></tr><tr><td>glycerine</td><td>0.83</td></tr><tr><td>honey</td><td>2–10</td></tr></table><h4>What it means for a machine</h4><p>Viscosity decides whether a fluid can carry a load on a film (bearing), how fast a ball settles (Stokes' law), and how much pressure a pump must supply (pipe flow).</p><h4>Common mistake</h4><p>Confusing viscosity with density. Mercury is dense yet thin, honey is dense and viscous, and air is light and thin.</p>", "gu": "<h4>વ્યાખ્યા</h4><p><b>શ્યાનતા</b> એ પ્રવાહીનું આંતરિક ઘર્ષણ છે જે તેના સ્તરોની સાપેક્ષ ગતિનો વિરોધ કરે. સ્થિર પ્રવાહીમાં શિયર પ્રતિબળ હોતું નથી, પણ એક સ્તર બીજા પર સરકે ત્યાં જ ઘર્ષણ ઊભું થાય.</p><h4>એકમ અને સામાન્ય મૂલ્યો</h4><p>ગુણાંકનો SI એકમ N·s/m² = Pa·s છે; CGS એકમ પોઇઝ, અને 1 Pa·s = 10 પોઇઝ. પાણી લગભગ 1 mPa·s સાથે પાતળા પ્રવાહીનો સંદર્ભ છે.</p><table><tr><th>20 °C પર પ્રવાહી</th><th>η Pa·s માં</th></tr><tr><td>હવા</td><td>1.8 × 10⁻⁵</td></tr><tr><td>પાણી</td><td>1.0 × 10⁻³</td></tr><tr><td>કેરોસીન</td><td>1.6 × 10⁻³</td></tr><tr><td>એન્જિન ઓઇલ (SAE 30)</td><td>0.20–0.30</td></tr><tr><td>ગ્લિસરિન</td><td>0.83</td></tr><tr><td>મધ</td><td>2–10</td></tr></table><h4>મશીન માટે તેનો અર્થ</h4><p>શ્યાનતા નક્કી કરે કે પ્રવાહી પડ પર ભાર ઉપાડી શકે (બેરિંગ), દડો કેટલી ઝડપથી બેસે (સ્ટોક્સનો નિયમ), અને પંપે કેટલું દબાણ આપવું પડે (નળીનો પ્રવાહ).</p><h4>સામાન્ય ભૂલ</h4><p>શ્યાનતાને ઘનતા સાથે ભેગી કરવી. પારો ભારે છતાં પાતળો, મધ ભારે અને શ્યાન, અને હવા હલકી તથા પાતળી છે.</p>"}, "diagram": "u3_viscosity", "syllabus_item": "3.3.1"}, {"h": {"en": "4.2 Newton's law of viscosity", "gu": "4.2 ન્યૂટનનો શ્યાનતાનો નિયમ"}, "body": {"en": "<h4>Statement</h4><p>The viscous force between two layers of a fluid is directly proportional to the area of contact and to the velocity gradient between them: <b>F = −η A (dv/dx)</b>. The minus sign shows that the force opposes the motion.</p><h4>Coefficient of viscosity</h4><p>Rearranged, η = F/(A dv/dx): the force per unit area needed to maintain unit velocity gradient. It is a property of the fluid and depends strongly on temperature.</p><h4>Worked example</h4><p>A 2 mm oil film with the top plate at 0.5 m/s: dv/dx = 250 s⁻¹. With η = 1.0 Pa·s and A = 0.5 m², F = 125 N — the force needed to keep the plate moving.</p><h4>Conditions</h4><p>The law holds for Newtonian fluids — water, air, oil — in laminar flow. A non-Newtonian fluid such as paint, blood or toothpaste does not obey it, because its η itself changes with the velocity gradient.</p><h4>Common mistake</h4><p>Applying the law in turbulent flow. Once eddies form, momentum transfer is dominated by mixing and the measured stress is far above η dv/dx.</p>", "gu": "<h4>વિધાન</h4><p>પ્રવાહીના બે સ્તરો વચ્ચેનું શ્યાન બળ તેમના સંપર્ક ક્ષેત્રફળ અને વેગ પ્રવણતાના સીધા સમપ્રમાણમાં છે: <b>F = −η A (dv/dx)</b>. ઋણ ચિહ્ન દર્શાવે કે બળ ગતિનો વિરોધ કરે છે.</p><h4>શ્યાનતા ગુણાંક</h4><p>ગોઠવતાં η = F/(A dv/dx): એકમ વેગ પ્રવણતા જાળવવા એકમ ક્ષેત્રફળ દીઠ જરૂરી બળ. તે પ્રવાહીનો ગુણધર્મ છે અને તાપમાન પર ખૂબ આધાર રાખે છે.</p><h4>ઉકેલાયેલ દાખલો</h4><p>2 mm તેલના પડમાં ઉપરની પ્લેટ 0.5 m/s પર: dv/dx = 250 s⁻¹. η = 1.0 Pa·s અને A = 0.5 m² સાથે F = 125 N — પ્લેટ ચલાવવા જરૂરી બળ.</p><h4>શરતો</h4><p>નિયમ ન્યૂટનીય પ્રવાહી — પાણી, હવા, તેલ — માટે સ્તરીય પ્રવાહમાં લાગુ પડે. પેન્ટ, લોહી કે ટૂથપેસ્ટ જેવું અન્ય ન્યૂટનીય પ્રવાહી તેનું પાલન કરતું નથી, કારણ કે તેનો η પ્રવણતા સાથે બદલાય.</p><h4>સામાન્ય ભૂલ</h4><p>વમળીય પ્રવાહમાં નિયમ લગાડવો. વમળ બન્યા પછી વેગમાન સ્થાનાંતરણ મિશ્રણથી થાય અને મપાયેલું પ્રતિબળ η dv/dx થી ઘણું ઊંચું હોય.</p>"}, "syllabus_item": "3.3.2"}, {"h": {"en": "4.3 Viscous force, velocity gradient and the coefficient", "gu": "4.3 શ્યાન બળ, વેગ પ્રવણતા અને ગુણાંક"}, "body": {"en": "<h4>The three quantities</h4><table><tr><th>Quantity</th><th>Meaning</th><th>Unit</th></tr><tr><td>viscous force F</td><td>drag between two layers</td><td>N</td></tr><tr><td>velocity gradient dv/dx</td><td>how fast the speed changes across the gap</td><td>s⁻¹</td></tr><tr><td>coefficient η</td><td>viscous force per unit area per unit gradient</td><td>Pa·s</td></tr></table><h4>What the gradient means in a pipe</h4><p>The fluid at the wall is at rest and the fluid at the axis moves fastest, so the velocity profile is a parabola and dv/dx is largest at the wall — that is where the shear and the erosion are worst.</p><h4>Worked example</h4><p>Two layers 1 mm apart with speeds differing by 0.2 m/s: dv/dx = 200 s⁻¹. If η = 0.5 Pa·s, the shear stress is τ = η dv/dx = 100 N/m².</p><h4>Common mistake</h4><p>Taking the gradient as v/η or v·x. It is Δv/Δx: speed divided by distance, not by viscosity.</p>", "gu": "<h4>ત્રણ રાશિઓ</h4><table><tr><th>રાશિ</th><th>અર્થ</th><th>એકમ</th></tr><tr><td>શ્યાન બળ F</td><td>બે સ્તરો વચ્ચેનો ખેંચાણ</td><td>N</td></tr><tr><td>વેગ પ્રવણતા dv/dx</td><td>જગ્યા સાથે ઝડપ કેટલી ઝડપથી બદલાય</td><td>s⁻¹</td></tr><tr><td>ગુણાંક η</td><td>એકમ ક્ષેત્રફળ અને એકમ પ્રવણતા દીઠ શ્યાન બળ</td><td>Pa·s</td></tr></table><h4>નળીમાં પ્રવણતાનો અર્થ</h4><p>દીવાલ પાસે પ્રવાહી સ્થિર અને ધરી પાસે સૌથી ઝડપી હોય, તેથી વેગની રૂપરેખા પરવલય બને અને dv/dx દીવાલ પાસે સૌથી વધુ હોય — ત્યાં જ શિયર અને ઘસારો સૌથી વધુ થાય.</p><h4>ઉકેલાયેલ દાખલો</h4><p>1 mm દૂરના બે સ્તરોની ઝડપમાં 0.2 m/s ફરક: dv/dx = 200 s⁻¹. η = 0.5 Pa·s હોય તો શિયર પ્રતિબળ τ = η dv/dx = 100 N/m².</p><h4>સામાન્ય ભૂલ</h4><p>પ્રવણતાને v/η કે v·x લેવી. તે Δv/Δx છે: ઝડપ ભાગ્યા અંતર, શ્યાનતા નહીં.</p>"}, "syllabus_item": "3.3.3"}, {"h": {"en": "4.4 Streamline and turbulent flow, critical velocity and Reynolds number", "gu": "4.4 સ્તરીય અને વમળીય પ્રવાહ, ક્રાંતિક વેગ અને રેનોલ્ડ્સ આંક"}, "body": {"en": "<h4>Two kinds of flow</h4><table><tr><th>Streamline (laminar)</th><th>Turbulent</th></tr><tr><td>layers slide without mixing</td><td>eddies and mixing across the pipe</td></tr><tr><td>velocity below the critical value</td><td>velocity above it</td></tr><tr><td>low energy loss, quiet</td><td>loss rises sharply, noisy</td></tr><tr><td>Re below about 2000</td><td>Re above about 4000</td></tr></table><h4>The Reynolds number</h4><p><b>Re = ρ v d / η</b>, a pure number. Below about 2000 the flow is streamline, above about 4000 it is turbulent, and in between it is transitional.</p><h4>Critical velocity</h4><p>v<sub>c</sub> = Re η/(ρ d). For water in a 50 mm pipe with Re = 2000: v<sub>c</sub> = 2000 × 10⁻³/(1000 × 0.05) = 0.04 m/s.</p><h4>Engineering reading</h4><p>Pipes are sized to stay below Re ≈ 2000 where possible, because turbulent loss rises roughly as v², and pumps are chosen for that pressure drop.</p><h4>Common mistake</h4><p>Using the radius in Re instead of the diameter. Every textbook value (2000, 4000) is defined on the diameter.</p>", "gu": "<h4>બે પ્રકારના પ્રવાહ</h4><table><tr><th>સ્તરીય</th><th>વમળીય</th></tr><tr><td>સ્તરો ભળ્યા વગર સરકે</td><td>વમળ અને નળીમાં આડું મિશ્રણ</td></tr><tr><td>વેગ ક્રાંતિક મૂલ્યથી નીચે</td><td>તેનાથી ઉપર</td></tr><tr><td>ઓછી ઊર્જા ખોટ, શાંત</td><td>ખોટ ઝડપથી વધે, ઘોંઘાટ</td></tr><tr><td>Re લગભગ 2000થી નીચે</td><td>Re લગભગ 4000થી ઉપર</td></tr></table><h4>રેનોલ્ડ્સ આંક</h4><p><b>Re = ρ v d / η</b>, પરિમાણરહિત આંક. લગભગ 2000થી નીચે પ્રવાહ સ્તરીય, લગભગ 4000થી ઉપર વમળીય, અને વચ્ચે સંક્રમણાવસ્થામાં.</p><h4>ક્રાંતિક વેગ</h4><p>v<sub>c</sub> = Re η/(ρ d). 50 mm નળીમાં પાણી માટે Re = 2000 સાથે: v<sub>c</sub> = 2000 × 10⁻³/(1000 × 0.05) = 0.04 m/s.</p><h4>ઇજનેરી અર્થઘટન</h4><p>શક્ય હોય ત્યાં સુધી નળીઓ Re ≈ 2000થી નીચે રખાય, કારણ કે વમળીય ખોટ લગભગ v² પ્રમાણે વધે, અને પંપ તે દબાણ ઘટાડા માટે પસંદ કરાય.</p><h4>સામાન્ય ભૂલ</h4><p>Re માં વ્યાસને બદલે ત્રિજ્યા વાપરવી. દરેક પુસ્તકનું મૂલ્ય (2000, 4000) વ્યાસ પર વ્યાખ્યાયિત છે.</p>"}, "syllabus_item": "3.3.4"}, {"h": {"en": "4.5 Stokes' law and terminal velocity", "gu": "4.5 સ્ટોક્સનો નિયમ અને અંતિમ વેગ"}, "body": {"en": "<h4>Stokes' law</h4><p>A small sphere of radius r falling slowly through a fluid of viscosity η feels a retarding force <b>F = 6π η r v</b>. It holds for a smooth sphere, slow steady motion and no turbulence.</p><h4>Terminal velocity</h4><p>When weight equals upthrust plus viscous drag the acceleration is zero and the sphere falls at a constant terminal velocity: <b>v<sub>t</sub> = 2r²(ρ − σ)g/(9η)</b>, where ρ is the sphere's density and σ the fluid's.</p><table><tr><th>Dependence</th><th>Effect</th></tr><tr><td>bigger radius</td><td>falls much faster: v ∝ r²</td></tr><tr><td>thicker fluid</td><td>falls slower: v ∝ 1/η</td></tr><tr><td>denser sphere</td><td>falls faster: v ∝ (ρ − σ)</td></tr><tr><td>equal densities</td><td>never falls, it stays suspended</td></tr></table><h4>Worked example</h4><p>A steel ball of r = 1 mm (ρ = 7800) in glycerine (σ = 1260, η = 0.83): v<sub>t</sub> = 2 × 10⁻⁶ × 6540 × 9.8/(9 × 0.83) = 1.7 × 10⁻² m/s = 1.7 cm/s.</p><h4>Common mistake</h4><p>Forgetting the buoyancy term (ρ − σ) and using ρ alone. A ball of the same density as the fluid never reaches a terminal velocity at all.</p>", "gu": "<h4>સ્ટોક્સનો નિયમ</h4><p>શ્યાનતા η વાળા પ્રવાહીમાં ધીમે પડતા r ત્રિજ્યાના નાના ગોળા પર પ્રતિરોધક બળ <b>F = 6π η r v</b> લાગે. તે સરખા ગોળા, ધીમી સ્થિર ગતિ અને વમળ વગર માટે માન્ય છે.</p><h4>અંતિમ વેગ</h4><p>જ્યારે વજન = ઉત્પ્લાવક બળ + શ્યાન પ્રતિરોધ થાય ત્યારે પ્રવર્ગ શૂન્ય થાય અને ગોળો અચળ અંતિમ વેગથી પડે: <b>v<sub>t</sub> = 2r²(ρ − σ)g/(9η)</b>, જ્યાં ρ ગોળાની અને σ પ્રવાહીની ઘનતા છે.</p><table><tr><th>આધાર</th><th>અસર</th></tr><tr><td>મોટી ત્રિજ્યા</td><td>ઘણું ઝડપથી પડે: v ∝ r²</td></tr><tr><td>જાડું પ્રવાહી</td><td>ધીમે પડે: v ∝ 1/η</td></tr><tr><td>ઘન ગોળો</td><td>ઝડપથી પડે: v ∝ (ρ − σ)</td></tr><tr><td>સમાન ઘનતા</td><td>કદી ન પડે, સ્થિર રહે</td></tr></table><h4>ઉકેલાયેલ દાખલો</h4><p>ગ્લિસરિન (σ = 1260, η = 0.83) માં r = 1 mm નો સ્ટીલ દડો (ρ = 7800): v<sub>t</sub> = 2 × 10⁻⁶ × 6540 × 9.8/(9 × 0.83) = 1.7 × 10⁻² m/s = 1.7 cm/s.</p><h4>સામાન્ય ભૂલ</h4><p>ઉત્પ્લાવકતાનું પદ (ρ − σ) ભૂલીને ફક્ત ρ વાપરવું. પ્રવાહી જેટલી જ ઘનતાવાળો દડો અંતિમ વેગ સુધી પહોંચતો જ નથી.</p>"}, "syllabus_item": "3.3.5"}, {"h": {"en": "4.6 Effect of temperature and the use of viscosity in bearings", "gu": "4.6 તાપમાનની અસર અને બેરિંગમાં શ્યાનતાનો ઉપયોગ"}, "body": {"en": "<h4>Temperature</h4><p>Viscosity of <b>liquids falls</b> as temperature rises, because molecules slip past each other more easily. Viscosity of <b>gases rises</b>, because the momentum transfer between faster molecules increases.</p><table><tr><th>Fluid</th><th>20 °C</th><th>40 °C</th><th>100 °C</th></tr><tr><td>water (mPa·s)</td><td>1.00</td><td>0.65</td><td>0.28</td></tr><tr><td>engine oil (Pa·s)</td><td>0.25</td><td>0.08</td><td>0.01</td></tr></table><h4>Why a bearing needs the right grade</h4><ul><li>Too thick: the oil cannot enter the clearance, the shaft runs on metal and wears.</li><li>Too thin: the film collapses under load and the surfaces touch.</li><li>A multigrade oil keeps the grade nearly constant from cold start to running temperature, which is why 20W-40 is specified instead of a single grade.</li></ul><h4>Worked example</h4><p>Engine oil at 0.25 Pa·s drags a 0.02 m² bearing surface at 5 m/s across a 0.05 mm film: F = η A v/x = 0.25 × 0.02 × 5/5 × 10⁻⁵ = 500 N — the friction the pump must overcome.</p><h4>Common mistake</h4><p>Assuming every fluid thins on heating. Air and steam thicken, which changes the design of a gas bearing completely.</p>", "gu": "<h4>તાપમાન</h4><p>તાપમાન વધે તેમ <b>પ્રવાહીની શ્યાનતા ઘટે</b>, કારણ કે અણુઓ એકબીજા પરથી સહેલાઈથી સરકે. <b>વાયુની શ્યાનતા વધે</b>, કારણ કે ઝડપી અણુઓ વચ્ચે વેગમાનનું સ્થાનાંતરણ વધે.</p><table><tr><th>પ્રવાહી</th><th>20 °C</th><th>40 °C</th><th>100 °C</th></tr><tr><td>પાણી (mPa·s)</td><td>1.00</td><td>0.65</td><td>0.28</td></tr><tr><td>એન્જિન ઓઇલ (Pa·s)</td><td>0.25</td><td>0.08</td><td>0.01</td></tr></table><h4>બેરિંગને યોગ્ય ગ્રેડ કેમ જોઈએ</h4><ul><li>બહુ જાડું: તેલ ગેપમાં જઈ શકતું નથી, શાફ્ટ ધાતુ પર ચાલે અને ઘસાય.</li><li>બહુ પાતળું: ભાર હેઠળ પડ પડી જાય અને સપાટીઓ અડે.</li><li>મલ્ટીગ્રેડ તેલ ઠંડા સ્ટાર્ટથી ચાલુ તાપમાન સુધી ગ્રેડ લગભગ અચળ રાખે, તેથી જ એક જ ગ્રેડને બદલે 20W-40 સૂચવાય.</li></ul><h4>ઉકેલાયેલ દાખલો</h4><p>0.25 Pa·s નું એન્જિન ઓઇલ 0.02 m² બેરિંગ સપાટીને 0.05 mm ફિલ્મમાં 5 m/s પર ખેંચે: F = η A v/x = 0.25 × 0.02 × 5/5 × 10⁻⁵ = 500 N — પંપે એ ઘર્ષણ દૂર કરવું પડે.</p><h4>સામાન્ય ભૂલ</h4><p>દરેક પ્રવાહી ગરમ થતાં પાતળું થાય એમ માનવું. હવા અને વરાળ જાડાં થાય છે, જે ગેસ બેરિંગની રચના સાવ બદલી નાખે.</p>"}, "syllabus_item": "3.3.6"}]}, {"title": {"en": "5. Practice Questions with Model Answers", "gu": "5. સરાવ પ્રશ્નો અને આદર્શ જવાબો"}, "items": [{"h": {"en": "Practice 1. Define stress, strain and Young's modulus, and derive Y = FL/(A ΔL).", "gu": "સરાવ 1. પ્રતિબળ, વિકૃતિ અને યંગ ગુણાંકની વ્યાખ્યા આપી Y = FL/(A ΔL) મેળવો."}, "body": {"en": "<p>Stress is the restoring force per unit area, σ = F/A, in N/m²; strain is the fractional change of length, ε = ΔL/L, with no unit.</p><p>Young's modulus is the ratio within the elastic limit: Y = σ/ε = (F/A)/(ΔL/L) = FL/(A ΔL). The rearrangement is what the Searle experiment uses.</p><p>A steel wire of 1 mm² and 2 m carrying 50 N extends by 0.5 mm, giving Y = 50 × 2/(10⁻⁶ × 5 × 10⁻⁴) = 2 × 10¹¹ N/m².</p>", "gu": "<p>પ્રતિબળ એકમ ક્ષેત્રફળ દીઠ પુનઃસ્થાપક બળ છે, σ = F/A, N/m² માં; વિકૃતિ લંબાઈમાં અંશતઃ ફેરફાર છે, ε = ΔL/L, જેને એકમ નથી.</p><p>યંગ ગુણાંક સ્થિતિસ્થાપક મર્યાદામાં ગુણોત્તર છે: Y = σ/ε = (F/A)/(ΔL/L) = FL/(A ΔL). આ ગોઠવણી જ સર્લના પ્રયોગમાં વપરાય છે.</p><p>1 mm² અને 2 m નો સ્ટીલ તાર 50 N સાથે 0.5 mm ખેંચાય, તેથી Y = 50 × 2/(10⁻⁶ × 5 × 10⁻⁴) = 2 × 10¹¹ N/m².</p>"}}, {"h": {"en": "Practice 2. Explain the stress-strain curve and mark its important points.", "gu": "સરાવ 2. પ્રતિબળ-વિકૃતિ વક્ર સમજાવો અને તેના મહત્વના બિંદુ દર્શાવો."}, "body": {"en": "<p>The curve starts with a straight line OA through the origin where Hooke's law holds; the slope of that line is Young's modulus.</p><p>A is the proportional limit, B the elastic limit or yield point, D the ultimate tensile strength and E the fracture point. Between B and D the wire stretches plastically.</p><p>Ductile materials such as mild steel have a long B–E region, brittle ones such as glass break just after D; design always stays below B with a safety factor.</p>", "gu": "<p>વક્ર ઉદ્ગમમાંથી પસાર થતી સીધી રેખા OA થી શરૂ થાય જ્યાં હૂકનો નિયમ લાગુ પડે; તે રેખાનો ઢાળ યંગ ગુણાંક છે.</p><p>A સમપ્રમાણ મર્યાદા, B સ્થિતિસ્થાપક મર્યાદા કે ઉપજ બિંદુ, D અંતિમ તણાવ મજબૂતાઈ અને E ભંગ બિંદુ છે. B અને D વચ્ચે તાર સ્થાયી રીતે ખેંચાય છે.</p><p>માઇલ્ડ સ્ટીલ જેવા નમ્ય પદાર્થોમાં B–E વિસ્તાર લાંબો હોય, કાચ જેવા ભંગુર D પછી તરત તૂટે; રચના હંમેશા સલામતી અવયવ સાથે B નીચે રહે.</p>"}}, {"h": {"en": "Practice 3. Explain surface tension on the basis of molecular theory and give its two units.", "gu": "સરાવ 3. આણ્વીય સિદ્ધાંતના આધારે પૃષ્ઠતાણ સમજાવો અને તેના બે એકમ આપો."}, "body": {"en": "<p>A molecule inside a liquid has its sphere of influence full of other molecules, so the attraction cancels; a molecule at the surface has it only half full, so there is a net inward pull.</p><p>That inward pull makes the surface behave like a stretched membrane, and its strength is the force per unit length T = F/L in N/m.</p><p>Pulling a molecule to the surface needs work, so T is also the surface energy per unit area, J/m²; for water T ≈ 0.072 N/m at 20 °C.</p>", "gu": "<p>પ્રવાહીની અંદરના અણુનો પ્રભાવ ગોળો બીજા અણુઓથી ભરેલો હોય, તેથી આકર્ષણ રદ થાય; સપાટી પરના અણુનો અડધો ભરેલો હોય, તેથી ચોખ્ખું અંદર તરફ ખેંચાણ રહે.</p><p>એ અંદર તરફના ખેંચાણથી સપાટી તંગ પડ જેવી વર્તે, અને તેની મજબૂતાઈ એકમ લંબાઈ દીઠ બળ T = F/L, N/m છે.</p><p>અણુને સપાટી પર લાવવા કાર્ય કરવું પડે, તેથી T એકમ ક્ષેત્રફળ દીઠ પૃષ્ઠઊર્જા પણ છે, J/m²; 20 °C પર પાણી માટે T ≈ 0.072 N/m.</p>"}}, {"h": {"en": "Practice 4. Derive or state the Ascent formula and explain one engineering use of capillarity.", "gu": "સરાવ 4. આરોહણ સૂત્ર જણાવો અને કેશનળી ચઢાણનો એક ઇજનેરી ઉપયોગ સમજાવો."}, "body": {"en": "<p>The formula is h = 2T cos θ/(ρ g r), where T is the surface tension, θ the contact angle, ρ the density and r the tube radius.</p><p>Water in a 0.2 mm tube rises h = 0.144/(1000 × 9.8 × 2 × 10⁻⁴) = 7.35 cm; mercury with θ = 140° gives a negative h, so the column is depressed.</p><p>Engineering use: wicks and cooling-tower packing rely on capillary rise to spread water over a large surface without a pump, and soil moisture moves the same way.</p>", "gu": "<p>સૂત્ર h = 2T cos θ/(ρ g r) છે, જ્યાં T પૃષ્ઠતાણ, θ સંપર્ક કોણ, ρ ઘનતા અને r નળીની ત્રિજ્યા છે.</p><p>0.2 mm નળીમાં પાણી h = 0.144/(1000 × 9.8 × 2 × 10⁻⁴) = 7.35 cm ચઢે; θ = 140° વાળો પારો ઋણ h આપે, તેથી સ્તંભ ઉતરે.</p><p>ઇજનેરી ઉપયોગ: વિક અને કૂલિંગ ટાવર પેકિંગ કેશનળી ચઢાણથી પંપ વગર પાણીને મોટી સપાટી પર ફેલાવે, અને જમીનનો ભેજ પણ એ જ રીતે ચાલે.</p>"}}, {"h": {"en": "Practice 5. What is the angle of contact? Explain why water wets glass but mercury does not.", "gu": "સરાવ 5. સંપર્ક કોણ શું છે? પાણી કાચને ભીનું કરે પણ પારો કેમ નહીં તે સમજાવો."}, "body": {"en": "<p>The angle of contact is measured inside the liquid between the tangent to its surface and the solid wall; it is set by the balance of the solid–liquid, solid–vapour and liquid–vapour surface tensions.</p><p>For water on clean glass adhesion is stronger than cohesion, so θ is nearly zero and the meniscus is concave; for mercury cohesion wins, θ ≈ 140°, and the meniscus is convex.</p><p>The consequence is practical: water climbs a capillary and soaks a wick, mercury is pushed down and reads a depression, which is exactly what a mercury barometer corrects for.</p>", "gu": "<p>સંપર્ક કોણ પ્રવાહીની અંદર તેની સપાટીના સ્પર્શક અને ઘન દીવાલ વચ્ચે મપાય; તે ઘન–પ્રવાહી, ઘન–બાષ્પ અને પ્રવાહી–બાષ્પ પૃષ્ઠતાણના સંતુલનથી નક્કી થાય.</p><p>સ્વચ્છ કાચ પર પાણી માટે આસક્તિ સંસક્તિ કરતાં વધુ મજબૂત છે, તેથી θ લગભગ શૂન્ય અને મેનિસ્કસ અંતર્ગોળ; પારા માટે સંસક્તિ જીતે, θ ≈ 140°, અને મેનિસ્કસ બહિર્ગોળ.</p><p>પરિણામ વ્યવહારુ છે: પાણી કેશનળીમાં ચઢે અને વિક ભીનો કરે, પારો નીચે ધકેલાય અને ઉતાર દર્શાવે, જે પારા બેરોમીટરમાં સુધારા તરીકે ગણાય.</p>"}}, {"h": {"en": "Practice 6. Explain surface tension, surface energy and their relation with a numerical example.", "gu": "સરાવ 6. પૃષ્ઠતાણ, પૃષ્ઠઊર્જા અને તેમનો સંબંધ દાખલા સાથે સમજાવો."}, "body": {"en": "<p>Surface tension is the force per unit length along a liquid surface; surface energy is the work needed to create unit area of new surface. They are numerically equal: 1 N/m = 1 J/m².</p><p>Blowing a soap bubble of 2 cm radius: A = 2 × 4πr² = 1.005 × 10⁻² m², so W = 0.025 × 1.005 × 10⁻² = 2.5 × 10⁻⁴ J.</p><p>The factor two appears because the bubble has an inside and an outside surface; a drop has only one, which is why the excess pressure formulas differ (4T/r against 2T/r).</p>", "gu": "<p>પૃષ્ઠતાણ પ્રવાહીની સપાટી પર એકમ લંબાઈ દીઠ બળ છે; પૃષ્ઠઊર્જા નવી સપાટીના એકમ ક્ષેત્રફળ માટે જરૂરી કાર્ય છે. બંને આંકડામાં સમાન છે: 1 N/m = 1 J/m².</p><p>2 cm ત્રિજ્યાનો સાબુનો પરપોટો ફૂંકતાં: A = 2 × 4πr² = 1.005 × 10⁻² m², તેથી W = 0.025 × 1.005 × 10⁻² = 2.5 × 10⁻⁴ J.</p><p>2 નો અવયવ એટલા માટે કે પરપોટાને અંદર અને બહાર બે સપાટી હોય; ટીપાને ફક્ત એક, તેથી જ વધારાના દબાણનાં સૂત્ર જુદાં પડે (4T/r સામે 2T/r).</p>"}}, {"h": {"en": "Practice 7. State Newton's law of viscosity and define the coefficient of viscosity with its units.", "gu": "સરાવ 7. ન્યૂટનનો શ્યાનતાનો નિયમ જણાવો અને શ્યાનતા ગુણાંક તેના એકમ સાથે સમજાવો."}, "body": {"en": "<p>Newton's law: the viscous force between two layers is proportional to their area and to the velocity gradient, F = −η A dv/dx.</p><p>The constant η is the coefficient of viscosity, numerically the force per unit area per unit velocity gradient, with SI unit Pa·s and CGS unit poise (1 Pa·s = 10 poise).</p><p>Water has η = 10⁻³ Pa·s and glycerine 0.83 Pa·s at 20 °C, which is why a steel ball sinks in water at once but drifts down glycerine at about 1.7 cm/s.</p>", "gu": "<p>ન્યૂટનનો નિયમ: બે સ્તરો વચ્ચેનું શ્યાન બળ તેમના ક્ષેત્રફળ અને વેગ પ્રવણતાના સમપ્રમાણમાં છે, F = −η A dv/dx.</p><p>અચળાંક η શ્યાનતા ગુણાંક છે, આંકડામાં એકમ ક્ષેત્રફળ અને એકમ વેગ પ્રવણતા દીઠ બળ, SI એકમ Pa·s અને CGS એકમ પોઇઝ (1 Pa·s = 10 પોઇઝ).</p><p>20 °C પર પાણીનો η = 10⁻³ Pa·s અને ગ્લિસરિનનો 0.83 Pa·s છે, તેથી જ સ્ટીલનો દડો પાણીમાં તરત ઊતરે પણ ગ્લિસરિનમાં લગભગ 1.7 cm/s પર સરકે.</p>"}}, {"h": {"en": "Practice 8. Distinguish streamline and turbulent flow, and explain the Reynolds number.", "gu": "સરાવ 8. સ્તરીય અને વમળીય પ્રવાહમાં ભેદ સમજાવો અને રેનોલ્ડ્સ આંક સમજાવો."}, "body": {"en": "<p>In streamline flow the layers slide past one another without mixing, the loss is small and the flow is quiet; in turbulent flow eddies form, the loss rises steeply with speed and the flow is noisy.</p><p>The Reynolds number Re = ρ v d/η compares inertia to viscosity; below about 2000 the flow is streamline, above about 4000 turbulent.</p><p>Water at 2 m/s in a 50 mm pipe gives Re = 10⁵, so the flow is fully turbulent and the pump must supply a pressure drop that grows as v².</p>", "gu": "<p>સ્તરીય પ્રવાહમાં સ્તરો ભળ્યા વગર સરકે, ખોટ ઓછી અને પ્રવાહ શાંત; વમળીય પ્રવાહમાં વમળ બને, ઝડપ સાથે ખોટ ઝડપથી વધે અને પ્રવાહ ઘોંઘાટિયો.</p><p>રેનોલ્ડ્સ આંક Re = ρ v d/η જડત્વની શ્યાનતા સાથે સરખામણી કરે; લગભગ 2000થી નીચે પ્રવાહ સ્તરીય, 4000થી ઉપર વમળીય.</p><p>50 mm નળીમાં 2 m/s પર પાણી Re = 10⁵ આપે, તેથી પ્રવાહ પૂરો વમળીય છે અને પંપે v² પ્રમાણે વધતો દબાણ ઘટાડો પૂરો પાડવો પડે.</p>"}}, {"h": {"en": "Practice 9. State Stokes' law, define terminal velocity and derive its expression.", "gu": "સરાવ 9. સ્ટોક્સનો નિયમ જણાવો, અંતિમ વેગની વ્યાખ્યા આપો અને તેનું સૂત્ર મેળવો."}, "body": {"en": "<p>Stokes' law: a sphere of radius r moving slowly at speed v through a fluid of viscosity η feels F = 6π η r v.</p><p>Three forces act: weight (4/3)πr³ρg down, upthrust (4/3)πr³σg up, and drag 6πηrv up. Terminal velocity is reached when they balance.</p><p>Setting them equal gives v_t = 2r²(ρ − σ)g/(9η); for a 1 mm steel ball in glycerine that is 1.72 × 10⁻² m/s.</p>", "gu": "<p>સ્ટોક્સનો નિયમ: η શ્યાનતાવાળા પ્રવાહીમાં v ઝડપે ધીમે ચાલતા r ત્રિજ્યાના ગોળા પર F = 6π η r v લાગે.</p><p>ત્રણ બળ લાગે: વજન (4/3)πr³ρg નીચે, ઉત્પ્લાવક (4/3)πr³σg ઉપર અને પ્રતિરોધ 6πηrv ઉપર. સંતુલન થાય ત્યારે અંતિમ વેગ મળે.</p><p>તેમને સમાન ગણતાં v_t = 2r²(ρ − σ)g/(9η) મળે; ગ્લિસરિનમાં 1 mm સ્ટીલ દડા માટે તે 1.72 × 10⁻² m/s છે.</p>"}}, {"h": {"en": "Practice 10. How does temperature affect viscosity? Why do liquids and gases behave differently?", "gu": "સરાવ 10. તાપમાન શ્યાનતાને કેવી રીતે અસર કરે? પ્રવાહી અને વાયુ જુદા કેમ વર્તે?"}, "body": {"en": "<p>Liquid viscosity falls with temperature: water goes from 1.00 mPa·s at 20 °C to 0.28 at 100 °C, and engine oil from 0.25 to about 0.01 Pa·s.</p><p>The reason is that in a liquid the molecules are held by close-range attraction; heating gives them enough energy to slip past each other, so the internal friction drops.</p><p>In a gas the viscosity comes from momentum transfer between molecules, and heating speeds them up, so gas viscosity rises — about 1.8 × 10⁻⁵ Pa·s for air at 20 °C, rising with temperature.</p>", "gu": "<p>તાપમાન સાથે પ્રવાહીની શ્યાનતા ઘટે: પાણી 20 °C પર 1.00 mPa·s થી 100 °C પર 0.28 થાય, અને એન્જિન ઓઇલ 0.25 થી લગભગ 0.01 Pa·s.</p><p>કારણ કે પ્રવાહીમાં અણુઓ નજીકના આકર્ષણથી બંધાયેલા હોય; ગરમી તેમને એકબીજા પરથી સરકવા પૂરતી ઊર્જા આપે, તેથી આંતરિક ઘર્ષણ ઘટે.</p><p>વાયુમાં શ્યાનતા અણુઓ વચ્ચે વેગમાન સ્થાનાંતરણથી આવે, અને ગરમી તેમને ઝડપી કરે, તેથી વાયુની શ્યાનતા વધે — 20 °C પર હવા માટે લગભગ 1.8 × 10⁻⁵ Pa·s, જે તાપમાન સાથે વધે.</p>"}}, {"h": {"en": "Practice 11. A steel ball of 2 mm radius falls steadily at 0.1 m/s in glycerine of density 1260 kg/m³. Find the viscosity.", "gu": "સરાવ 11. 2 mm ત્રિજ્યાનો સ્ટીલ દડો 1260 kg/m³ ઘનતાવાળા ગ્લિસરિનમાં 0.1 m/s ના અચળ વેગથી પડે છે. શ્યાનતા શોધો."}, "body": {"en": "<p>Use v_t = 2r²(ρ − σ)g/(9η) with ρ = 7800 kg/m³ for steel and r = 2 × 10⁻³ m.</p><p>η = 2 × (2 × 10⁻³)² × 6540 × 9.8/(9 × 0.1) = 0.5127/0.9 = 0.57 Pa·s.</p><p>The handbook value for glycerine at 20 °C is about 0.83 Pa·s, so this sample is warmer or slightly diluted — which is exactly how the experiment is used to check purity.</p>", "gu": "<p>ρ = 7800 kg/m³ (સ્ટીલ) અને r = 2 × 10⁻³ m સાથે v_t = 2r²(ρ − σ)g/(9η) વાપરો.</p><p>η = 2 × (2 × 10⁻³)² × 6540 × 9.8/(9 × 0.1) = 0.5127/0.9 = 0.57 Pa·s.</p><p>20 °C પર ગ્લિસરિન માટે પુસ્તકનું મૂલ્ય લગભગ 0.83 Pa·s છે, તેથી આ નમૂનો ગરમ કે થોડો ભળેલો છે — આ પ્રયોગ શુદ્ધતા ચકાસવા એમ જ વપરાય છે.</p>"}}, {"h": {"en": "Practice 12. Why does a bearing need oil of the right viscosity? Use Newton's law to argue.", "gu": "સરાવ 12. બેરિંગને યોગ્ય શ્યાનતાવાળું તેલ કેમ જોઈએ? ન્યૂટનના નિયમથી દલીલ કરો."}, "body": {"en": "<p>The oil film carries the shaft: F = η A v/x. If η is too low the film cannot support the load and the surfaces touch; if η is too high the friction loss is large and the oil cannot enter the clearance.</p><p>A 0.02 m² surface at 5 m/s over a 0.05 mm film with η = 0.25 Pa·s gives 500 N of drag, so the oil pump has to supply that much work away as heat.</p><p>Because η falls with temperature in a liquid, a multigrade oil is specified so that the film is still thick enough when the engine is hot.</p>", "gu": "<p>તેલનો પડ શાફ્ટ ઉપાડે: F = η A v/x. η ખૂબ ઓછું હોય તો પડ ભાર ઉપાડી શકતું નથી અને સપાટીઓ અડે; ખૂબ વધુ હોય તો ઘર્ષણ ખોટ મોટી થાય અને તેલ ગેપમાં જઈ શકતું નથી.</p><p>0.25 Pa·s સાથે 0.05 mm ફિલ્મ પર 5 m/s પર 0.02 m² સપાટી 500 N ખેંચાણ આપે, તેથી તેલ પંપે એટલું કાર્ય ઉષ્મા તરીકે દૂર કરવું પડે.</p><p>પ્રવાહીમાં તાપમાન સાથે η ઘટતું હોવાથી મલ્ટીગ્રેડ તેલ સૂચવાય, જેથી એન્જિન ગરમ હોય ત્યારે પણ પડ પૂરતો જાડો રહે.</p>"}}, {"h": {"en": "Practice 13. Explain two engineering applications of surface tension and two of viscosity.", "gu": "સરાવ 13. પૃષ્ઠતાણના બે અને શ્યાનતાના બે ઇજનેરી ઉપયોગો સમજાવો."}, "body": {"en": "<p>Surface tension: in soldering a flux lowers T so that the solder wets the joint instead of beading, and in a cooling tower capillary rise spreads water over the packing so that air meets a thin film rather than a stream.</p><p>Viscosity: the oil film in a journal bearing separates the shaft from the bush so that wear is replaced by fluid friction, and the dashpot of a shock absorber uses viscous drag to turn motion into heat.</p><p>Both are about controlling an interface: surface tension acts at a free surface, viscosity acts between two layers of the same fluid.</p>", "gu": "<p>પૃષ્ઠતાણ: સોલ્ડરિંગમાં ફ્લક્સ T ઘટાડે જેથી સોલ્ડર ટીપાં ન બનાવી જોડને ભીની કરે, અને કૂલિંગ ટાવરમાં કેશનળી ચઢાણ પાણીને પેકિંગ પર ફેલાવે જેથી હવા ધારાને બદલે પાતળી ફિલ્મને મળે.</p><p>શ્યાનતા: જર્નલ બેરિંગમાં તેલનો પડ શાફ્ટને બુશથી અલગ રાખે જેથી ઘસારાને બદલે પ્રવાહી ઘર્ષણ રહે, અને શોક એબ્ઝોર્બરનો ડેશપોટ શ્યાન પ્રતિરોધથી ગતિને ઉષ્મામાં ફેરવે.</p><p>બંને એક ઇન્ટરફેસ નિયંત્રણ વિશે છે: પૃષ્ઠતાણ મુક્ત સપાટી પર કામ કરે, શ્યાનતા એક જ પ્રવાહીના બે સ્તરો વચ્ચે.</p>"}}, {"h": {"en": "Practice 14. A wire of 2 m and 1 mm² hangs a 50 N load. Find the stress, the strain and the extension (Y = 2 × 10¹¹ N/m²).", "gu": "સરાવ 14. 2 m અને 1 mm² નો તાર 50 N ભાર લટકાવે છે. Y = 2 × 10¹¹ N/m² સાથે પ્રતિબળ, વિકૃતિ અને ખેંચાણ શોધો."}, "body": {"en": "<p>σ = F/A = 50/10⁻⁶ = 5 × 10⁷ N/m².</p><p>ε = σ/Y = 5 × 10⁷/2 × 10¹¹ = 2.5 × 10⁻⁴.</p><p>ΔL = ε L = 2.5 × 10⁻⁴ × 2 = 5 × 10⁻⁴ m = 0.5 mm, which matches the direct formula FL/(AY).</p><p>Check the answer: 0.5 mm in 2 m is a working stress of 50 MPa, far below the 250 MPa yield stress of mild steel, so the wire is safe and springs back fully. The weight of the wire itself has been neglected, which is justified because 2 m of 1 mm² steel weighs only about 0.15 N against the 50 N load.</p>", "gu": "<p>σ = F/A = 50/10⁻⁶ = 5 × 10⁷ N/m².</p><p>ε = σ/Y = 5 × 10⁷/2 × 10¹¹ = 2.5 × 10⁻⁴.</p><p>ΔL = ε L = 2.5 × 10⁻⁴ × 2 = 5 × 10⁻⁴ m = 0.5 mm, જે FL/(AY) સૂત્ર સાથે મળે છે.</p><p>જવાબ ચકાસો: 2 m માં 0.5 mm એટલે 50 MPa કાર્યકારી પ્રતિબળ, જે માઇલ્ડ સ્ટીલના 250 MPa ઉપજ પ્રતિબળ કરતાં ઘણું નીચે છે, તેથી તાર સલામત છે અને પૂરો પાછો આવે. તારનું પોતાનું વજન ગણતરીમાં લીધું નથી, જે વાજબી છે કારણ કે 1 mm² ના 2 m સ્ટીલનું વજન 50 N સામે ફક્ત લગભગ 0.15 N થાય.</p>"}}, {"h": {"en": "Practice 15. Why is steel used for springs and not cast iron? Answer with the stress-strain curve.", "gu": "સરાવ 15. સ્પ્રિંગ માટે સ્ટીલ વપરાય અને કાસ્ટ આયર્ન નહીં કેમ? પ્રતિબળ-વિકૃતિ વક્રથી જવાબ આપો."}, "body": {"en": "<p>A spring must return to its shape after every cycle, so it must work well inside the elastic region and have a high yield point.</p><p>Spring steel has a long straight OA and a high yield point B, so it stores large elastic energy U = ½F ΔL without permanent set.</p><p>Cast iron is brittle: it reaches D and breaks almost immediately with little plastic region, so a spring made of it would snap instead of deflecting.</p><p>The energy a spring can store per unit volume is ½ × stress × strain = σ²/(2Y) at the yield stress, so a steel with a high yield stress and a moderate Y stores the most — that is the reason spring steel is alloyed and heat-treated rather than simply hardened.</p>", "gu": "<p>સ્પ્રિંગે દરેક ચક્ર પછી પોતાનો આકાર પાછો મેળવવો પડે, તેથી તેને સ્થિતિસ્થાપક વિસ્તારમાં સારી રીતે કામ કરવું પડે અને ઊંચું ઉપજ બિંદુ જોઈએ.</p><p>સ્પ્રિંગ સ્ટીલમાં લાંબો સીધો OA અને ઊંચું ઉપજ બિંદુ B હોય, તેથી તે સ્થાયી વિકૃતિ વગર મોટી સ્થિતિસ્થાપક ઊર્જા U = ½F ΔL સંગ્રહે.</p><p>કાસ્ટ આયર્ન ભંગુર છે: તે D સુધી પહોંચીને લગભગ તરત તૂટે, સ્થાયી વિસ્તાર ઓછો હોય, તેથી તેની સ્પ્રિંગ નમવાને બદલે તૂટી પડે.</p><p>સ્પ્રિંગ એકમ ઘનફળમાં જેટલી ઊર્જા સંગ્રહી શકે તે ઉપજ પ્રતિબળ પાસે ½ × પ્રતિબળ × વિકૃતિ = σ²/(2Y) છે, તેથી ઊંચું ઉપજ પ્રતિબળ અને સામાન્ય Y વાળું સ્ટીલ સૌથી વધુ સંગ્રહે — તેથી જ સ્પ્રિંગ સ્ટીલને ફક્ત કઠણ કરવાને બદલે મિશ્રધાતુ બનાવી ઉષ્મા-પ્રક્રિયા આપાય છે.</p>"}}, {"h": {"en": "Practice 16. Water rises 7.35 cm in a capillary of radius 0.1 mm. Find the surface tension.", "gu": "સરાવ 16. 0.1 mm ત્રિજ્યાની કેશનળીમાં પાણી 7.35 cm ચઢે છે. પૃષ્ઠતાણ શોધો."}, "body": {"en": "<p>Use T = ρ g h r/2 with θ = 0°.</p><p>T = 1000 × 9.8 × 0.0735 × 10⁻⁴/2.</p><p>= 0.072 N/m, the standard value for water at about 20 °C — which is why the capillary-rise method is used as a practical.</p><p>The result is only as good as the assumptions behind it: the tube must be clean so that θ ≈ 0°, the bore must be uniform, and the meniscus is read at its lowest point. A 0.1 mm error in the radius changes T by about 0.07 %, so the radius is measured with a travelling microscope.</p>", "gu": "<p>θ = 0° સાથે T = ρ g h r/2 વાપરો.</p><p>T = 1000 × 9.8 × 0.0735 × 10⁻⁴/2.</p><p>= 0.072 N/m, જે લગભગ 20 °C પર પાણીનું માનક મૂલ્ય છે — તેથી જ કેશનળી ચઢાણ રીત પ્રેક્ટિકલ તરીકે વપરાય.</p><p>પરિણામ તેટલું જ સારું જેટલી તેની પાછળની ધારણાઓ: નળી સ્વચ્છ હોવી જોઈએ જેથી θ ≈ 0°, બોર સરખું હોવું જોઈએ, અને મેનિસ્કસ તેના સૌથી નીચા બિંદુએ વંચાય. ત્રિજ્યામાં 0.1 mm ની ભૂલ T માં લગભગ 0.07 % ફરક પાડે, તેથી ત્રિજ્યા ટ્રાવેલિંગ માઇક્રોસ્કોપથી મપાય.</p>"}}]}], "diagrams": [{"id": "u3_stress", "title": {"en": "The stress-strain curve and its four key points", "gu": "પ્રતિબળ-વિકૃતિ વક્ર અને તેના ચાર મુખ્ય બિંદુ"}, "file": "diagrams/u3_stress.svg", "caption": {"en": "Design stays on the straight part OA; the safety factor keeps the working stress well below B.", "gu": "રચના સીધા ભાગ OA પર જ રહે; સલામતી અવયવ કાર્યકારી પ્રતિબળને B થી ઘણું નીચે રાખે."}}, {"id": "u3_moduli", "title": {"en": "Three moduli for three kinds of deformation", "gu": "ત્રણ પ્રકારની વિકૃતિ માટે ત્રણ ગુણાંક"}, "file": "diagrams/u3_moduli.svg", "caption": {"en": "Young's modulus for a wire, bulk modulus for a compressed liquid, shear modulus for a twisted block.", "gu": "તાર માટે યંગ ગુણાંક, દબાયેલા પ્રવાહી માટે બલ્ક ગુણાંક, વળેલા બ્લોક માટે શિયર ગુણાંક."}}, {"id": "u3_surface", "title": {"en": "Why the surface of a liquid pulls inwards", "gu": "પ્રવાહીની સપાટી અંદર તરફ કેમ ખેંચાય છે"}, "file": "diagrams/u3_surface.svg", "caption": {"en": "A molecule inside has a full sphere of influence; one at the surface has half, so the net pull is inward.", "gu": "અંદરના અણુનો પ્રભાવ ગોળો પૂરો, સપાટી પરના અણુનો અડધો, તેથી ચોખ્ખું ખેંચાણ અંદર તરફ."}}, {"id": "u3_capillary", "title": {"en": "Capillary rise and the angle of contact", "gu": "કેશનળી ચઢાણ અને સંપર્ક કોણ"}, "file": "diagrams/u3_capillary.svg", "caption": {"en": "The meniscus climbs until the weight of the column balances the upward pull of surface tension.", "gu": "સ્તંભનું વજન પૃષ્ઠતાણના ઉપર તરફના ખેંચાણ સાથે સંતુલિત થાય ત્યાં સુધી મેનિસ્કસ ચઢે."}}, {"id": "u3_viscosity", "title": {"en": "Velocity profile and terminal velocity", "gu": "વેગ રૂપરેખા અને અંતિમ વેગ"}, "file": "diagrams/u3_viscosity.svg", "caption": {"en": "The layer at the wall is at rest and the drag grows with speed, so the ball settles at a constant terminal velocity.", "gu": "દીવાલ પાસેનું સ્તર સ્થિર અને પ્રતિરોધ ઝડપ સાથે વધે, તેથી દડો અચળ અંતિમ વેગે બેસે."}}], "equations": [{"title": {"en": "Elasticity", "gu": "સ્થિતિસ્થાપકતા"}, "items": [{"name": {"en": "Stress", "gu": "પ્રતિબળ"}, "f": "σ = F/A  (N/m²)", "terms": {"en": "Restoring force per unit area.", "gu": "એકમ ક્ષેત્રફળ દીઠ પુનઃસ્થાપક બળ."}}, {"name": {"en": "Strain", "gu": "વિકૃતિ"}, "f": "ε = ΔL/L, ΔV/V or Δx/h", "terms": {"en": "No unit; a pure ratio.", "gu": "એકમ નહીં; શુદ્ધ ગુણોત્તર."}}, {"name": {"en": "Hooke's law", "gu": "હૂકનો નિયમ"}, "f": "σ = E ε", "terms": {"en": "Valid only up to the elastic limit.", "gu": "ફક્ત સ્થિતિસ્થાપક મર્યાદા સુધી માન્ય."}}, {"name": {"en": "Young's modulus", "gu": "યંગ ગુણાંક"}, "f": "Y = (F/A)/(ΔL/L) = F L/(A ΔL)", "terms": {"en": "Slope of the straight part of the stress-strain curve.", "gu": "પ્રતિબળ-વિકૃતિ વક્રના સીધા ભાગનો ઢાળ."}}, {"name": {"en": "Bulk modulus", "gu": "બલ્ક ગુણાંક"}, "f": "K = −ΔP/(ΔV/V)", "terms": {"en": "Negative sign keeps K positive for compression.", "gu": "ઋણ ચિહ્ન સંકોચનમાં K ધન રાખે."}}, {"name": {"en": "Shear modulus", "gu": "શિયર ગુણાંક"}, "f": "G = (F/A)/(Δx/h)", "terms": {"en": "Shape changes, volume does not.", "gu": "આકાર બદલાય, ઘનફળ નહીં."}}, {"name": {"en": "Elastic energy", "gu": "સ્થિતિસ્થાપક ઊર્જા"}, "f": "U = ½ F ΔL", "terms": {"en": "Stored in a stretched spring or wire.", "gu": "ખેંચાયેલી સ્પ્રિંગ કે તારમાં સંગ્રહાય."}}]}, {"title": {"en": "Surface tension and capillarity", "gu": "પૃષ્ઠતાણ અને કેશનળી ચઢાણ"}, "items": [{"name": {"en": "Surface tension", "gu": "પૃષ્ઠતાણ"}, "f": "T = F/L  (N/m) = energy/area (J/m²)", "terms": {"en": "Force along the surface per unit length.", "gu": "સપાટી પર એકમ લંબાઈ દીઠ બળ."}}, {"name": {"en": "Soap film force", "gu": "સાબુના પડનું બળ"}, "f": "F = 2 T L", "terms": {"en": "Two surfaces; a drop boundary has one.", "gu": "બે સપાટી; ટીપાની સીમાને એક."}}, {"name": {"en": "Surface energy", "gu": "પૃષ્ઠઊર્જા"}, "f": "W = T ΔA", "terms": {"en": "Work to create new surface.", "gu": "નવી સપાટી બનાવવાનું કાર્ય."}}, {"name": {"en": "Excess pressure, drop", "gu": "ટીપામાં વધારાનું દબાણ"}, "f": "p = 2T/r", "terms": {"en": "Smaller drop, larger pressure.", "gu": "નાનું ટીપું, વધુ દબાણ."}}, {"name": {"en": "Excess pressure, bubble", "gu": "પરપોટામાં વધારાનું દબાણ"}, "f": "p = 4T/r", "terms": {"en": "Because a bubble has two surfaces.", "gu": "કારણ કે પરપોટાને બે સપાટી હોય."}}, {"name": {"en": "Ascent formula", "gu": "આરોહણ સૂત્ર"}, "f": "h = 2T cos θ/(ρ g r)", "terms": {"en": "Negative h for mercury: a depression.", "gu": "પારા માટે h ઋણ: ઉતાર."}}]}, {"title": {"en": "Viscosity", "gu": "શ્યાનતા"}, "items": [{"name": {"en": "Newton's law of viscosity", "gu": "ન્યૂટનનો શ્યાનતાનો નિયમ"}, "f": "F = −η A (dv/dx)", "terms": {"en": "Force proportional to area and velocity gradient.", "gu": "બળ ક્ષેત્રફળ અને વેગ પ્રવણતાના સમપ્રમાણમાં."}}, {"name": {"en": "Coefficient of viscosity", "gu": "શ્યાનતા ગુણાંક"}, "f": "η = F/(A dv/dx)  (Pa·s)", "terms": {"en": "1 Pa·s = 10 poise.", "gu": "1 Pa·s = 10 પોઇઝ."}}, {"name": {"en": "Reynolds number", "gu": "રેનોલ્ડ્સ આંક"}, "f": "Re = ρ v d/η", "terms": {"en": "Below 2000 streamline, above 4000 turbulent.", "gu": "2000થી નીચે સ્તરીય, 4000થી ઉપર વમળીય."}}, {"name": {"en": "Critical velocity", "gu": "ક્રાંતિક વેગ"}, "f": "v_c = Re η/(ρ d)", "terms": {"en": "Speed above which the flow breaks into eddies.", "gu": "જેનાથી ઉપર પ્રવાહ વમળમાં તૂટે."}}, {"name": {"en": "Stokes' law", "gu": "સ્ટોક્સનો નિયમ"}, "f": "F = 6π η r v", "terms": {"en": "Drag on a small sphere moving slowly.", "gu": "ધીમે ચાલતા નાના ગોળા પરનો પ્રતિરોધ."}}, {"name": {"en": "Terminal velocity", "gu": "અંતિમ વેગ"}, "f": "v_t = 2r²(ρ − σ)g/(9η)", "terms": {"en": "Reached when weight = upthrust + drag.", "gu": "વજન = ઉત્પ્લાવક + પ્રતિરોધ ત્યારે મળે."}}]}], "numericals": [{"id": "u3n01", "unit": 3, "h": {"en": "Stress in a wire carrying 100 N over 2 mm².", "gu": "2 mm² પર 100 N વહેતા તારમાં પ્રતિબળ."}, "q": {"en": "A wire of cross-section 2 mm² carries a load of 100 N. Find the stress.", "gu": "2 mm² કાપવાળો તાર 100 N ભાર લે છે. પ્રતિબળ શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A wire of cross-section 2 mm² carries a load of 100 N. Find the stress.</p><h4>Step-by-step solution</h4><p>A = 2 mm² = 2 × 10⁻⁶ m²</p><p>σ = F/A = 100/(2 × 10⁻⁶)</p><p>= 5 × 10⁷ N/m² = 50 MPa</p><h4>Answer</h4><p><b>5 × 10⁷ N/m² (50 MPa)</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>2 mm² કાપવાળો તાર 100 N ભાર લે છે. પ્રતિબળ શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>A = 2 mm² = 2 × 10⁻⁶ m²</p><p>σ = F/A = 100/(2 × 10⁻⁶)</p><p>= 5 × 10⁷ N/m² = 50 MPa</p><h4>જવાબ</h4><p><b>5 × 10⁷ N/m² (50 MPa)</b></p>"}, "answer": {"en": "5 × 10⁷ N/m² (50 MPa)", "gu": "5 × 10⁷ N/m² (50 MPa)"}}, {"id": "u3n02", "unit": 3, "h": {"en": "Strain when a 2 m wire stretches 0.5 mm.", "gu": "2 m તાર 0.5 mm ખેંચાય ત્યારે વિકૃતિ."}, "q": {"en": "A wire 2 m long stretches by 0.5 mm. Find the strain.", "gu": "2 m લાંબો તાર 0.5 mm ખેંચાય છે. વિકૃતિ શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A wire 2 m long stretches by 0.5 mm. Find the strain.</p><h4>Step-by-step solution</h4><p>ΔL = 0.5 mm = 5 × 10⁻⁴ m</p><p>ε = ΔL/L = 5 × 10⁻⁴/2</p><p>= 2.5 × 10⁻⁴ (no unit)</p><h4>Answer</h4><p><b>2.5 × 10⁻⁴</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>2 m લાંબો તાર 0.5 mm ખેંચાય છે. વિકૃતિ શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>ΔL = 0.5 mm = 5 × 10⁻⁴ m</p><p>ε = ΔL/L = 5 × 10⁻⁴/2</p><p>= 2.5 × 10⁻⁴ (એકમ નહીં)</p><h4>જવાબ</h4><p><b>2.5 × 10⁻⁴</b></p>"}, "answer": {"en": "2.5 × 10⁻⁴", "gu": "2.5 × 10⁻⁴"}}, {"id": "u3n03", "unit": 3, "h": {"en": "Young's modulus from stress and strain.", "gu": "પ્રતિબળ અને વિકૃતિ પરથી યંગ ગુણાંક."}, "q": {"en": "A material shows a stress of 5 × 10⁷ N/m² at a strain of 2.5 × 10⁻⁴. Find its Young's modulus.", "gu": "પદાર્થમાં 2.5 × 10⁻⁴ વિકૃતિ પર પ્રતિબળ 5 × 10⁷ N/m² છે. તેનો યંગ ગુણાંક શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A material shows a stress of 5 × 10⁷ N/m² at a strain of 2.5 × 10⁻⁴. Find its Young's modulus.</p><h4>Step-by-step solution</h4><p>Y = σ/ε = 5 × 10⁷ / 2.5 × 10⁻⁴</p><p>= 2 × 10¹¹ N/m²</p><p>That is the value for steel.</p><h4>Answer</h4><p><b>2 × 10¹¹ N/m²</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>પદાર્થમાં 2.5 × 10⁻⁴ વિકૃતિ પર પ્રતિબળ 5 × 10⁷ N/m² છે. તેનો યંગ ગુણાંક શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>Y = σ/ε = 5 × 10⁷ / 2.5 × 10⁻⁴</p><p>= 2 × 10¹¹ N/m²</p><p>આ સ્ટીલનું મૂલ્ય છે.</p><h4>જવાબ</h4><p><b>2 × 10¹¹ N/m²</b></p>"}, "answer": {"en": "2 × 10¹¹ N/m²", "gu": "2 × 10¹¹ N/m²"}}, {"id": "u3n04", "unit": 3, "h": {"en": "Extension of a steel wire: 50 N, 2 m, 1 mm².", "gu": "સ્ટીલ તારનું ખેંચાણ: 50 N, 2 m, 1 mm²."}, "q": {"en": "A steel wire of length 2 m and area 1 mm² (Y = 2 × 10¹¹ N/m²) carries 50 N. Find the extension.", "gu": "2 m લંબાઈ અને 1 mm² કાપવાળો સ્ટીલ તાર (Y = 2 × 10¹¹ N/m²) 50 N લે છે. ખેંચાણ શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A steel wire of length 2 m and area 1 mm² (Y = 2 × 10¹¹ N/m²) carries 50 N. Find the extension.</p><h4>Step-by-step solution</h4><p>ΔL = F L/(A Y)</p><p>= 50 × 2/(10⁻⁶ × 2 × 10¹¹)</p><p>= 100/(2 × 10⁵) = 5 × 10⁻⁴ m = 0.5 mm</p><h4>Answer</h4><p><b>0.5 mm</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>2 m લંબાઈ અને 1 mm² કાપવાળો સ્ટીલ તાર (Y = 2 × 10¹¹ N/m²) 50 N લે છે. ખેંચાણ શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>ΔL = F L/(A Y)</p><p>= 50 × 2/(10⁻⁶ × 2 × 10¹¹)</p><p>= 100/(2 × 10⁵) = 5 × 10⁻⁴ m = 0.5 mm</p><h4>જવાબ</h4><p><b>0.5 mm</b></p>"}, "answer": {"en": "0.5 mm", "gu": "0.5 mm"}}, {"id": "u3n05", "unit": 3, "h": {"en": "Bulk modulus from a pressure change.", "gu": "દબાણના ફેરફાર પરથી બલ્ક ગુણાંક."}, "q": {"en": "A liquid suffers a volume change of 5 × 10⁻⁵ of its volume when the pressure rises by 10⁵ Pa. Find its bulk modulus.", "gu": "દબાણ 10⁵ Pa વધતાં પ્રવાહીના ઘનફળમાં 5 × 10⁻⁵ ફેરફાર થાય છે. તેનો બલ્ક ગુણાંક શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A liquid suffers a volume change of 5 × 10⁻⁵ of its volume when the pressure rises by 10⁵ Pa. Find its bulk modulus.</p><h4>Step-by-step solution</h4><p>K = ΔP/(ΔV/V)</p><p>= 10⁵/(5 × 10⁻⁵)</p><p>= 2 × 10⁹ N/m²</p><h4>Answer</h4><p><b>2 × 10⁹ N/m²</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>દબાણ 10⁵ Pa વધતાં પ્રવાહીના ઘનફળમાં 5 × 10⁻⁵ ફેરફાર થાય છે. તેનો બલ્ક ગુણાંક શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>K = ΔP/(ΔV/V)</p><p>= 10⁵/(5 × 10⁻⁵)</p><p>= 2 × 10⁹ N/m²</p><h4>જવાબ</h4><p><b>2 × 10⁹ N/m²</b></p>"}, "answer": {"en": "2 × 10⁹ N/m²", "gu": "2 × 10⁹ N/m²"}}, {"id": "u3n06", "unit": 3, "h": {"en": "Shear modulus of a block displaced 0.5 mm.", "gu": "0.5 mm ખસેડાયેલા બ્લોકનો શિયર ગુણાંક."}, "q": {"en": "A tangential force of 500 N acts on the top face (0.01 m²) of a block 5 mm thick and displaces it by 0.5 mm. Find the shear modulus.", "gu": "5 mm જાડા બ્લોકની ઉપરની સપાટી (0.01 m²) પર 500 N સ્પર્શીય બળ લાગે અને તે 0.5 mm ખસે છે. શિયર ગુણાંક શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A tangential force of 500 N acts on the top face (0.01 m²) of a block 5 mm thick and displaces it by 0.5 mm. Find the shear modulus.</p><h4>Step-by-step solution</h4><p>Shear stress = 500/0.01 = 5 × 10⁴ N/m²</p><p>Shear strain = 0.5/5 = 0.1</p><p>G = 5 × 10⁴/0.1 = 5 × 10⁵ N/m²</p><h4>Answer</h4><p><b>5 × 10⁵ N/m²</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>5 mm જાડા બ્લોકની ઉપરની સપાટી (0.01 m²) પર 500 N સ્પર્શીય બળ લાગે અને તે 0.5 mm ખસે છે. શિયર ગુણાંક શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>શિયર પ્રતિબળ = 500/0.01 = 5 × 10⁴ N/m²</p><p>શિયર વિકૃતિ = 0.5/5 = 0.1</p><p>G = 5 × 10⁴/0.1 = 5 × 10⁵ N/m²</p><h4>જવાબ</h4><p><b>5 × 10⁵ N/m²</b></p>"}, "answer": {"en": "5 × 10⁵ N/m²", "gu": "5 × 10⁵ N/m²"}}, {"id": "u3n07", "unit": 3, "h": {"en": "Energy stored in a stretched wire.", "gu": "ખેંચાયેલા તારમાં સંગ્રહાયેલી ઊર્જા."}, "q": {"en": "A wire is stretched by 0.5 mm by a force rising to 50 N. Find the energy stored.", "gu": "તાર 0.5 mm ખેંચાય છે અને બળ 50 N સુધી પહોંચે છે. સંગ્રહાયેલી ઊર્જા શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A wire is stretched by 0.5 mm by a force rising to 50 N. Find the energy stored.</p><h4>Step-by-step solution</h4><p>U = ½ F ΔL</p><p>= ½ × 50 × 5 × 10⁻⁴</p><p>= 1.25 × 10⁻² J</p><h4>Answer</h4><p><b>1.25 × 10⁻² J</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>તાર 0.5 mm ખેંચાય છે અને બળ 50 N સુધી પહોંચે છે. સંગ્રહાયેલી ઊર્જા શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>U = ½ F ΔL</p><p>= ½ × 50 × 5 × 10⁻⁴</p><p>= 1.25 × 10⁻² J</p><h4>જવાબ</h4><p><b>1.25 × 10⁻² J</b></p>"}, "answer": {"en": "1.25 × 10⁻² J", "gu": "1.25 × 10⁻² J"}}, {"id": "u3n08", "unit": 3, "h": {"en": "Force on a sliding wire with a soap film.", "gu": "સાબુના પડ સાથે સરકતા તાર પર બળ."}, "q": {"en": "A soap film of surface tension 0.025 N/m is held on a frame with a 10 cm sliding wire. Find the force on the wire.", "gu": "0.025 N/m પૃષ્ઠતાણવાળો સાબુનો પડ 10 cm સરકતા તારવાળી ફ્રેમ પર છે. તાર પરનું બળ શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A soap film of surface tension 0.025 N/m is held on a frame with a 10 cm sliding wire. Find the force on the wire.</p><h4>Step-by-step solution</h4><p>A film has two surfaces, so F = 2 T L</p><p>= 2 × 0.025 × 0.1</p><p>= 5 × 10⁻³ N</p><h4>Answer</h4><p><b>5 × 10⁻³ N</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>0.025 N/m પૃષ્ઠતાણવાળો સાબુનો પડ 10 cm સરકતા તારવાળી ફ્રેમ પર છે. તાર પરનું બળ શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>પડને બે સપાટી હોય, તેથી F = 2 T L</p><p>= 2 × 0.025 × 0.1</p><p>= 5 × 10⁻³ N</p><h4>જવાબ</h4><p><b>5 × 10⁻³ N</b></p>"}, "answer": {"en": "5 × 10⁻³ N", "gu": "5 × 10⁻³ N"}}, {"id": "u3n09", "unit": 3, "h": {"en": "Capillary rise of water in a 0.2 mm tube.", "gu": "0.2 mm નળીમાં પાણીનું કેશનળી ચઢાણ."}, "q": {"en": "Find the height to which water (T = 0.072 N/m, θ = 0°) rises in a capillary of radius 0.2 mm.", "gu": "r = 0.2 mm ત્રિજ્યાની કેશનળીમાં પાણી (T = 0.072 N/m, θ = 0°) કેટલી ઊંચાઈ સુધી ચઢે તે શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>Find the height to which water (T = 0.072 N/m, θ = 0°) rises in a capillary of radius 0.2 mm.</p><h4>Step-by-step solution</h4><p>h = 2T cos θ/(ρ g r)</p><p>= 2 × 0.072 × 1/(1000 × 9.8 × 2 × 10⁻⁴)</p><p>= 0.144/1.96 = 0.0735 m</p><h4>Answer</h4><p><b>7.35 cm</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>r = 0.2 mm ત્રિજ્યાની કેશનળીમાં પાણી (T = 0.072 N/m, θ = 0°) કેટલી ઊંચાઈ સુધી ચઢે તે શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>h = 2T cos θ/(ρ g r)</p><p>= 2 × 0.072 × 1/(1000 × 9.8 × 2 × 10⁻⁴)</p><p>= 0.144/1.96 = 0.0735 m</p><h4>જવાબ</h4><p><b>7.35 cm</b></p>"}, "answer": {"en": "7.35 cm", "gu": "7.35 cm"}}, {"id": "u3n10", "unit": 3, "h": {"en": "Radius of a tube from a 5 cm rise.", "gu": "5 cm ચઢાણ પરથી નળીની ત્રિજ્યા."}, "q": {"en": "Water rises 5 cm in a capillary. Find the radius of the tube (T = 0.072 N/m, θ = 0°).", "gu": "કેશનળીમાં પાણી 5 cm ચઢે છે. નળીની ત્રિજ્યા શોધો (T = 0.072 N/m, θ = 0°)."}, "a": {"en": "<h4>Given and assumptions</h4><p>Water rises 5 cm in a capillary. Find the radius of the tube (T = 0.072 N/m, θ = 0°).</p><h4>Step-by-step solution</h4><p>r = 2T/(ρ g h)</p><p>= 0.144/(1000 × 9.8 × 0.05)</p><p>= 0.144/490 = 2.94 × 10⁻⁴ m</p><h4>Answer</h4><p><b>2.94 × 10⁻⁴ m (0.29 mm)</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>કેશનળીમાં પાણી 5 cm ચઢે છે. નળીની ત્રિજ્યા શોધો (T = 0.072 N/m, θ = 0°).</p><h4>પગલાવાર ઉકેલ</h4><p>r = 2T/(ρ g h)</p><p>= 0.144/(1000 × 9.8 × 0.05)</p><p>= 0.144/490 = 2.94 × 10⁻⁴ m</p><h4>જવાબ</h4><p><b>2.94 × 10⁻⁴ m (0.29 mm)</b></p>"}, "answer": {"en": "2.94 × 10⁻⁴ m (0.29 mm)", "gu": "2.94 × 10⁻⁴ m (0.29 mm)"}}, {"id": "u3n11", "unit": 3, "h": {"en": "Surface tension from a 6 cm rise in a 0.25 mm tube.", "gu": "0.25 mm નળીમાં 6 cm ચઢાણ પરથી પૃષ્ઠતાણ."}, "q": {"en": "Water rises 6 cm in a tube of radius 0.25 mm. Find the surface tension (θ = 0°).", "gu": "0.25 mm ત્રિજ્યાની નળીમાં પાણી 6 cm ચઢે છે. પૃષ્ઠતાણ શોધો (θ = 0°)."}, "a": {"en": "<h4>Given and assumptions</h4><p>Water rises 6 cm in a tube of radius 0.25 mm. Find the surface tension (θ = 0°).</p><h4>Step-by-step solution</h4><p>T = ρ g h r/2</p><p>= 1000 × 9.8 × 0.06 × 2.5 × 10⁻⁴/2</p><p>= 0.147/2 = 0.0735 N/m</p><h4>Answer</h4><p><b>0.0735 N/m</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>0.25 mm ત્રિજ્યાની નળીમાં પાણી 6 cm ચઢે છે. પૃષ્ઠતાણ શોધો (θ = 0°).</p><h4>પગલાવાર ઉકેલ</h4><p>T = ρ g h r/2</p><p>= 1000 × 9.8 × 0.06 × 2.5 × 10⁻⁴/2</p><p>= 0.147/2 = 0.0735 N/m</p><h4>જવાબ</h4><p><b>0.0735 N/m</b></p>"}, "answer": {"en": "0.0735 N/m", "gu": "0.0735 N/m"}}, {"id": "u3n12", "unit": 3, "h": {"en": "Excess pressure inside a soap bubble.", "gu": "સાબુના પરપોટા અંદર વધારાનું દબાણ."}, "q": {"en": "Find the excess pressure inside a soap bubble of radius 2 cm with T = 0.025 N/m.", "gu": "T = 0.025 N/m સાથે 2 cm ત્રિજ્યાના સાબુના પરપોટા અંદરનું વધારાનું દબાણ શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>Find the excess pressure inside a soap bubble of radius 2 cm with T = 0.025 N/m.</p><h4>Step-by-step solution</h4><p>For a bubble
