<script>
const U = {"subject": "DI01000111", "unit": 5, "format": "notes", "title": {"en": "Orthographic Projections"}, "hours": 6, "weightage": 20, "official": true, "languages": ["en"], "tabs": ["notes", "diagrams", "equations", "viva", "exam"], "intro_text": {"en": "Unit 5 of Engineering Graphics: reading a pictorial view and turning it into the three orthographic views. The first-angle layout, the lines that carry meaning - visible, hidden, centre - and the shapes that always draw the same way are set out first, then the stepped block, the cylinder and the drilled plate are drawn view by view, then the third view is recovered from two given views, and the unit closes with the free-hand sketches of the square, triangle, circle, semicircle, hexagon and pentagon. Six solved problems follow in section 2."}, "notes": [{"title": {"en": "1. From the Pictorial View to the Three Views"}, "items": [{"h": {"en": "5.1 First angle: what the three views are and where they go"}, "body": {"en": "<h4>The object is placed between you and the paper</h4><p>In <b>first-angle projection</b> the object stands between the observer and the plane of projection, so every view lands on the far side of the object. Open the box out and the three views sit like this: the <b>front view</b> (elevation) in the middle, the <b>top view</b> (plan) directly <b>below</b> it, and the <b>side view</b> taken from the left, placed directly to the <b>right</b>.</p><table><tr><th>view</th><th>what it shows</th><th>where it is placed</th></tr><tr><td>front view</td><td>width and height, as seen from the front</td><td>centre</td></tr><tr><td>top view</td><td>width and depth, as seen from above</td><td>below the front view</td></tr><tr><td>side view</td><td>depth and height, as seen from the left</td><td>right of the front view</td></tr></table><h4>Construction, step by step</h4><ol><li>Decide the front view first. Choose the direction that shows the most shape and the fewest hidden lines, and call it the front.</li><li>Draw the front view in the middle of the sheet, leaving room below and to the right for the other two views.</li><li>Project down from every corner of the front view with thin lines square to the base line, and draw the top view between them.</li><li>Project across from the front view to the right, and carry each depth round from the top view with a 45 degree mitre line, to draw the side view.</li><li>Check the three views: height the same in the front and the side, width the same in the front and the top, depth the same in the top and the side.</li></ol><h4>Lines and what they mean</h4><ul><li><b>Visible outline</b> - a continuous thick line: an edge you can see.</li><li><b>Hidden edge</b> - a dashed line of the same thickness: an edge behind material.</li><li><b>Centre line</b> - a thin chain line through the axis of a hole or a cylinder.</li><li>No view is ever drawn on top of another, and no dimension is repeated in two views.</li></ul><p><b>Why it works.</b> The three views are three directions of looking at one object, so each pair must agree in the dimension they share. That agreement is not decoration - it is the proof that the views describe one solid.</p><p><b>Common mistake.</b> Placing the top view above the front view. That is third angle; in first angle the top view goes below and the left side view goes on the right.</p>"}, "diagram": "u5_layout", "syllabus_item": "5.2"}, {"h": {"en": "5.1 Reading a pictorial view - the three shapes in this unit"}, "body": {"en": "<h4>A stepped block: 60 wide, 40 deep, 40 high</h4><p>Read the pictorial view as a set of boxes. This object is a base plate 60 x 40 x 15 with an upright 20 x 40 x 25 standing on its left end. Its three views come out as one L, one rectangle divided in two, and one rectangle with a hidden line.</p><h4>Construction, step by step</h4><ol><li>Box the object in: write down the overall width, depth and height from the pictorial view - here 60, 40 and 40.</li><li>Decide the front direction and list what you see from there: a base 60 wide and 15 high, and an upright 20 wide and 25 high on the left, so the front view is an L.</li><li>Look from above: the plate 60 x 40 with a visible line across it at 20 from the left end, where the upright's face meets the plate, so the top view is a 60 x 40 rectangle divided into 20 and 40.</li><li>Look from the left: the upright face 40 wide by 40 high on the near side, and the top of the plate hidden behind it - so the side view is a 40 x 40 square with a dashed line 15 up from the base.</li><li>Place the front view, project to the top view below and the side view to the right, and check the three shared dimensions before inking.</li></ol><h4>Shapes that always draw the same way</h4><table><tr><th>solid</th><th>front view</th><th>top view</th><th>side view</th></tr><tr><td>rectangular block</td><td>rectangle</td><td>rectangle</td><td>rectangle</td></tr><tr><td>cylinder standing</td><td>rectangle</td><td>circle</td><td>rectangle</td></tr><tr><td>cylinder lying</td><td>rectangle</td><td>rectangle</td><td>circle</td></tr><tr><td>cone standing</td><td>triangle</td><td>circle with a centre dot</td><td>triangle</td></tr><tr><td>prism standing</td><td>rectangle</td><td>regular polygon</td><td>rectangle</td></tr></table><p><b>Why it works.</b> An object made of prisms and cylinders has views made of rectangles, circles and polygons only. Once you can name the three views in words, the drawing is just the sizes put in the right places.</p><p><b>Check before you ink.</b> Count the corners in the pictorial view and the corners in each of your views; every visible edge of the object must appear in at least one view, thick or dashed.</p><p><b>Common mistake.</b> Drawing the top view 60 wide and 40 deep but the side view 60 deep. The side view shows the depth, and the depth of this block is 40.</p>"}, "diagram": "u5_stepped", "syllabus_item": "5.1"}, {"h": {"en": "5.2 Objects of revolution: cylinder, cone and hole"}, "body": {"en": "<h4>A cylinder of 40 mm diameter and 50 mm height standing on HP</h4><p>A circular edge is a circle when seen square-on, a straight line when seen edge-on, and an ellipse when seen at an angle. So a standing cylinder gives a rectangle 40 x 50 in the front and side views and a circle of diameter 40 in the top view, with a centre line through the axis in both rectangles.</p><h4>Construction, step by step</h4><ol><li>Draw the top view first when the object is round: the circle of diameter 40 with two centre lines crossing at its centre.</li><li>Project up from the two extreme generators of the circle to get the front view, 40 wide.</li><li>Set the height 50 above the base line and close the rectangle 40 x 50.</li><li>Draw the axis as a thin chain line down the middle of the rectangle.</li><li>Repeat the front view at the side position, or project across from it - the side view of a standing cylinder is the same rectangle.</li></ol><p><b>Why it works.</b> Every point of a circular edge is at the same distance from the axis, so the view along the axis is a circle and the view across the axis is the same silhouette as the extreme generators - a rectangle.</p><p><b>Common mistake.</b> Drawing an ellipse in the side view of a standing cylinder. Side and front views of a standing cylinder are identical rectangles; the ellipse appears only when the axis is tilted to the line of sight.</p>"}, "diagram": "u5_cylinder", "syllabus_item": "5.2"}, {"h": {"en": "5.2 A hole: a circle in one view, a dashed pair in the others"}, "body": {"en": "<h4>A plate 60 x 40 x 15 with a 20 mm hole drilled vertically through it</h4><p>The hole removes material, and the edges of the material it removes are edges of the object. From above you look straight down the hole and see a clean circle; from the front and from the side the hole is behind the face of the plate, so its two sides are drawn as <b>dashed vertical lines 20 mm apart</b>.</p><h4>Construction, step by step</h4><ol><li>Draw the front view first: a rectangle 60 mm by 15 mm, with the base line as the lowest edge.</li><li>Mark the two sides of the hole 20 mm apart, centred on the plate, and draw them as thin chain-centre lines first so that they stay vertical.</li><li>Change those two lines to dashed lines running the full 15 mm thickness - the hole passes right through the material.</li><li>Project down and draw the top view 60 x 40, with a solid circle of diameter 20 at the centre and two thin chain centre lines crossing there.</li><li>Project across to the side view, 40 x 15, and repeat the two dashed lines in the same relative position; check that all three views show the same 20 mm.</li></ol><h4>Line conventions you must apply</h4><ul><li><b>Visible outline</b> - continuous thick: the edges of the plate.</li><li><b>Hidden edge</b> - dashed, same thickness: the hole's sides in the front and side views.</li><li><b>Centre line</b> - thin chain line, extending a little past the outline: the hole's axis in the top view and the centre of the hole in the other views.</li><li>Dashed lines start and end on the visible outline, and where they cross each other the dash pattern continues.</li></ul><p><b>Why it works.</b> A hole is a circular edge seen along its axis in one view - a circle - and across its axis in the others. Across the axis the two extreme points of the circle are the only edges that show, and they are hidden behind the material.</p><p><b>Check before you ink.</b> The circle's diameter and the distance between the two dashed lines must be the same 20 mm; the dashed lines must stop at the top and bottom faces of the plate, never run past them.</p><p><b>Common mistake.</b> Drawing the hole as a solid circle in the front view. In a view where the material is in front of the hole, only the hidden (dashed) lines are drawn.</p>"}, "diagram": "u5_hidden", "syllabus_item": "5.2"}, {"h": {"en": "5.2 Hidden lines and the two-view problem"}, "body": {"en": "<h4>Given two views, draw the third</h4><p>The examiner often gives the front and top views and asks for the side view. It is built from two rules only: <b>every corner is projected across from the front view and carried round from the top view</b>, and <b>every dimension already shown is repeated, never invented</b>.</p><h4>Construction, step by step</h4><ol><li>Draw the two given views in their correct relative positions and add the projectors between them.</li><li>Take the height of every corner from the front view: draw light horizontals across to the right, where the side view will stand.</li><li>Take the depth of every corner from the top view: carry each depth round with a 45 degree mitre line, or with a pair of dividers, to the side view position.</li><li>Mark where each height meets each depth - those are the corners of the side view - and join them, thick where the edge is seen and dashed where it is hidden.</li><li>Check that the side view's height equals the front view's height and its width equals the top view's depth.</li></ol><h4>Lines you must not forget</h4><table><tr><th>line</th><th>used for</th><th>example here</th></tr><tr><td>continuous thick</td><td>visible outlines</td><td>the L of the front view</td></tr><tr><td>dashed</td><td>hidden edges</td><td>the step hidden behind the upright in the side view</td></tr><tr><td>thin chain</td><td>axes and centre lines</td><td>the axis of a hole</td></tr><tr><td>thin continuous</td><td>projectors and construction</td><td>the lines joining the views</td></tr></table><p><b>Why it works.</b> The side view is nothing but the same object seen from a third direction, so its height must come out of the front view and its depth out of the top view. Projecting the two sets of measurements on to one view is the whole method.</p><p><b>Check before you ink.</b> Before inking, trace one corner round: height from the front, depth from the top, and the point where they cross must be a corner in the side view. If any corner is left over, a line is missing.</p><p><b>Common mistake.</b> Inventing a dimension in the third view because the other two views did not obviously supply it. Every size in the third view is already in the other two.</p>"}, "diagram": "u5_missing", "syllabus_item": "5.2"}, {"h": {"en": "5.3 Free-hand sketches the syllabus asks for"}, "body": {"en": "<h4>Square, triangle, circle, semicircle, hexagon, pentagon - in one minute each</h4><p>A free-hand sketch is a drawing made without instruments but with the same construction: a light box or circle to hold the proportions, the construction lines, and the outline in one confident stroke. Speed comes from the order of the strokes, not from a steadier hand.</p><h4>Construction, step by step</h4><ol><li>Draw a light square or circle to hold the shape: it fixes the proportions before any outline is committed.</li><li>For a square, mark the four corners on the box and join them with long strokes from the shoulder, not the wrist; check the diagonals are equal.</li><li>For a triangle, draw the base first, mark the apex above its midpoint, then join; an equilateral triangle is as tall as 0.866 of its side.</li><li>For a circle, draw the light square, mark the four tangents, then join with four arcs; a circle that fits its square is round.</li><li>For a semicircle, draw the diameter, erect the radius at the centre and sweep half the circle from that centre.</li><li>For a hexagon, draw the light circle, step the radius round it six times, and join alternate points; for a pentagon, draw the circle, mark the top point and step 72 degrees round it.</li></ol><h4>Proportions worth remembering</h4><ul><li>Equilateral triangle: height = 0.866 x side; the apex is above the midpoint.</li><li>Regular hexagon: side = circumradius, across corners = 2 x side, across flats = 1.732 x side.</li><li>Regular pentagon: side = 1.176 x circumradius, and each interior angle is 108 degrees.</li><li>Semicircle: the angle in the semicircle is a right angle, which is the quickest check on the sketch.</li></ul><p><b>Why it works.</b> Every one of these shapes is built from a circle or a box, so sketching them free-hand is the same construction as drawing them with instruments - only the light construction is done by eye instead of by a compass.</p><p><b>Common mistake.</b> Sketching the outline first and the construction afterwards. The construction is what makes the sketch look right; it must come first, lightly, and stay visible.</p>"}, "diagram": "u5_freehand", "syllabus_item": "5.3"}]}, {"title": {"en": "2. Solved Drawing Problems, Step by Step"}, "items": [{"h": {"en": "Problem 1. A stepped block has a base plate 60 mm x 40 mm x 15 mm and an upright 20 mm x 40 mm x 25 mm on its left end. Draw its front, top and side views in first angle."}, "body": {"en": "<h4>Read the object</h4><p>Overall 60 wide, 40 deep and 40 high. The upright stands on the left end of the plate and runs the full depth, so the side view is a plain square.</p><h4>Construction, step by step</h4><ol><li>Draw the front view in the middle of the sheet: an L, 60 wide and 40 high, with the upright 20 wide and 25 high on the left and the plate 15 high across the bottom.</li><li>Project down from every corner and draw the top view below: a 60 x 40 rectangle with a visible line across it 20 from the left end.</li><li>Project across to the right and draw the side view: a 40 x 40 square, because the upright fills the depth and the height.</li><li>Add the hidden line in the side view: the top of the plate is 15 up from the base and is hidden behind the upright, so it is drawn dashed.</li><li>Check the shared dimensions: 40 high in the front and the side, 60 wide in the front and the top, 40 deep in the top and the side.</li></ol><h4>The answer</h4><p>Front view: an L 60 x 40 with a 20 x 25 upright. Top view: a 60 x 40 rectangle divided at 20. Side view: a 40 x 40 square with one dashed line 15 up from the base.</p>"}}, {"h": {"en": "Problem 2. A cylinder of 40 mm diameter and 50 mm height stands on HP. Draw its three views, showing the axis."}, "body": {"en": "<h4>Read the object</h4><p>A standing cylinder is round about a vertical axis, so the view down the axis is a circle and the other two views are the same rectangle.</p><h4>Construction, step by step</h4><ol><li>Draw the top view first: a circle of 40 mm diameter, with two thin chain centre lines crossing at its centre.</li><li>Project up from the two extreme points of the circle, 40 mm apart.</li><li>Set the height 50 mm above the base line and close the front view as a rectangle 40 x 50.</li><li>Draw the vertical axis as a thin chain line through the middle of the rectangle.</li><li>Draw the side view as the identical rectangle 40 x 50 to the right, with the same axis, and check both rectangles are the same height.</li></ol><h4>The answer</h4><p>Top view: a circle of diameter 40 with centre lines. Front and side views: the same rectangle 40 x 50 with a chain centre line. Nothing is hidden, so no dashed line is needed.</p>"}}, {"h": {"en": "Problem 3. A rectangular plate 60 mm x 40 mm x 15 mm has a hole of 20 mm diameter drilled vertically through its centre. Draw the three views."}, "body": {"en": "<h4>Read the object</h4><p>The hole runs through the 15 mm thickness, so it is seen as a circle from above and as two hidden lines from the front and the side.</p><h4>Construction, step by step</h4><ol><li>Draw the front view: a rectangle 60 x 15 with two vertical dashed lines 20 mm apart, centred.</li><li>Project down and draw the top view: a 60 x 40 rectangle with the circle of diameter 20 in the middle and cross centre lines through it.</li><li>Project the front view across to the right and draw the side view: a rectangle 40 x 15.</li><li>Draw the hole in the side view as two vertical dashed lines 20 mm apart, in the same relative position as in the front view.</li><li>Check the circle and the dashed lines are the same 20 mm, and that the dashed lines run the full 15 mm thickness.</li></ol><h4>The answer</h4><p>Front and side views: solid outline 60 x 15 and 40 x 15 with a pair of dashed lines 20 mm apart. Top view: 60 x 40 with a solid circle of diameter 20 and centre lines. The hole is hidden in two views and visible in one.</p>"}}, {"h": {"en": "Problem 4. A square pyramid has a base 40 mm square and an axis 50 mm long, standing on HP with two sides of the base parallel to VP. Draw its three views."}, "body": {"en": "<h4>Read the object</h4><p>With the base square sitting square to the viewer, the front view shows the true triangle of the pyramid and the top view shows the square with its diagonals meeting at the apex.</p><h4>Construction, step by step</h4><ol><li>Draw the top view first: a square 40 x 40 with both diagonals, which meet at the centre - that centre is the apex seen from above.</li><li>Project up from the four corners and from the centre.</li><li>Set the axis 50 mm above the base line and mark the apex at the centre.</li><li>Join the apex to the two base corners that are visible in the front view, giving a triangle of base 40 and height 50.</li><li>Draw the two edges to the far corners as thin or dashed lines, and repeat the triangle in the side view, where the base shows 40 mm again.</li></ol><h4>The answer</h4><p>Top view: a 40 mm square with diagonals. Front and side views: a triangle 40 wide and 50 high. The slant edge measures the square root of (50 squared + 20 squared + 20 squared) = 57.4 mm, which is the check on the pyramid.</p>"}}, {"h": {"en": "Problem 5. The front view of an object is an L 60 mm wide and 40 mm high with the upright 20 mm wide, and its top view is a 60 mm x 40 mm rectangle divided 20 mm from one end. Draw the side view and state what it must contain."}, "body": {"en": "<h4>Given</h4><p>Two views of a stepped block are given; the third must be derived from them and must not invent a single dimension.</p><h4>Construction, step by step</h4><ol><li>Project the two given views and add the projector lines between them.</li><li>Carry the heights across from the front view: the base line, 15 mm and 40 mm.</li><li>Carry the depth, 40 mm, round from the top view with a 45 degree mitre line.</li><li>Draw the outline: a 40 x 40 square, because the upright fills both the depth and the height.</li><li>Add the hidden line 15 mm above the base, since the top of the plate is behind the upright, and ink the outline thick.</li></ol><h4>The answer</h4><p>A 40 mm x 40 mm square with one dashed horizontal line 15 mm above the base. Its height equals the front view's height and its width equals the top view's depth - the two checks that prove the third view belongs to the same object.</p>"}}, {"h": {"en": "Problem 6. Sketch free-hand, in about a minute each: a square, an equilateral triangle, a circle, a semicircle, a regular hexagon and a regular pentagon, each about 50 mm across, leaving the construction lines visible."}, "body": {"en": "<h4>The method for all six</h4><p>A light box or circle first, the construction lines second, the outline last and in one stroke. The construction is what makes the sketch correct; it is not erased.</p><h4>Construction, step by step</h4><ol><li>Square: a light box with equal diagonals, corners joined with long strokes.</li><li>Triangle: base first, apex above its midpoint at 0.866 of the base, then the two sides.</li><li>Circle: a light square, the four tangent points, then four arcs joined smoothly.</li><li>Semicircle: the diameter, the radius erected at its centre, and half a circle swept from that centre.</li><li>Hexagon: a light circle, the radius stepped round six times, alternate points joined; across flats = 1.732 x side.</li><li>Pentagon: a light circle, the top point and then 72 degrees steps, points joined; each interior angle is 108 degrees.</li></ol><h4>The checks</h4><p>The square's diagonals must be equal, the triangle's sides equal, the circle must touch all four sides of its box, the hexagon must be 1.732 times its side across the flats, and the pentagon's five chords must all measure the same.</p>"}}]}], "diagrams": [{"id": "u5_layout", "title": {"en": "First angle: where each view goes"}, "file": "diagrams/u5_layout.svg", "caption": {"en": "In first angle the object sits between you and the paper, so the top view lands below the front view and the side view to its right."}}, {"id": "u5_stepped", "title": {"en": "A stepped block and its three views"}, "file": "diagrams/u5_stepped.svg", "caption": {"en": "Same height in the front and the side view, same width in the front and the top, same depth in the top and the side - that is the whole grammar."}}, {"id": "u5_cylinder", "title": {"en": "A cylinder and its three views"}, "file": "diagrams/u5_cylinder.svg", "caption": {"en": "A cylinder gives two rectangles and one circle; the centre line in both rectangles marks the axis."}}, {"id": "u5_hidden", "title": {"en": "Hidden edges: the hole you cannot see"}, "file": "diagrams/u5_hidden.svg", "caption": {"en": "The hole is invisible from the front and the side, so it is drawn as a dashed outline there and as a solid circle only in the top view."}}, {"id": "u5_missing", "title": {"en": "Two views given, the third to draw"}, "file": "diagrams/u5_missing.svg", "caption": {"en": "Build the missing view from two rules: project every corner, and repeat each height and each depth that the given views already show."}}, {"id": "u5_freehand", "title": {"en": "Free-hand sketches you must be able to make"}, "file": "diagrams/u5_freehand.svg", "caption": {"en": "Six shapes, six habits: box first, then diagonals, then the curve - the same construction you use with instruments, only faster."}}], "equations": [{"title": {"en": "Placement and agreement of the views"}, "items": [{"name": {"en": "First angle layout"}, "f": "top view below the front view, left side view to the right", "terms": {"en": "In first-angle projection the view is placed on the far side of the object, so the plan swings down below the elevation and the left side view sits on the right."}}, {"name": {"en": "Shared dimensions"}, "f": "front/side share height, front/top share width, top/side share depth", "terms": {"en": "Each pair of views looks along the axis of the third, so the two dimensions they share must come out identical; this is the check on any set of views."}}, {"name": {"en": "Depth transfer"}, "f": "45 degree mitre line from the top view to the side view", "terms": {"en": "A line at 45 degrees to the base line turns a depth measured below the front view into the same depth measured across the side view."}}]}, {"title": {"en": "Shapes in the views"}, "items": [{"name": {"en": "Cylinder standing"}, "f": "front and side 2r x h, top a circle of diameter 2r", "terms": {"en": "The view along the axis is a circle and the views across it show the extreme generators, so both are the same rectangle."}}, {"name": {"en": "Cone standing"}, "f": "front and side an isosceles triangle 2r x h, top a circle", "terms": {"en": "The slant height is the square root of (r squared + h squared), and it is the true length of the generator drawn in the elevation."}}, {"name": {"en": "Square pyramid"}, "f": "top a square with diagonals, views a triangle b x h", "terms": {"en": "The apex appears in the plan as the crossing of the diagonals and in the elevation at the height of the axis."}}, {"name": {"en": "Hexagon, free hand"}, "f": "across flats = 1.732 x side", "terms": {"en": "Side equals circumradius, so the across-corners size is twice the side and the across-flats size is 1.732 times it."}}, {"name": {"en": "Pentagon, free hand"}, "f": "side = 1.176 x R, interior angle 108 degrees", "terms": {"en": "Stepping 72 degrees round the circumcircle gives the five vertices; every chord and every interior angle comes out equal."}}]}], "viva": [{"title": {"en": "First angle and layout"}, "items": [{"q": {"en": "What is the difference between first-angle and third-angle projection?"}, "a": {"en": "In first angle the object is between the observer and the plane, so the view is placed on the far side of the object: the top view goes below the front view. In third angle the plane is between the observer and the object, so the top view goes above. India uses first angle by BIS convention."}}, {"q": {"en": "Where is the side view placed in first angle, and which side is it taken from?"}, "a": {"en": "To the right of the front view, and it is the view from the left of the object, because the left side view formed on the right-hand plane swings round to the right when the box is opened out."}}, {"q": {"en": "Which dimensions do the front and side views share?"}, "a": {"en": "The height. The front and the top views share the width, and the top and the side views share the depth. If any pair disagrees the three views do not describe one object."}}, {"q": {"en": "What is the use of the 45 degree mitre line?"}, "a": {"en": "It transfers a depth from the top view across to the side view: a horizontal line from the top view meets the mitre line and is then turned into a vertical at the side view, so the depth is carried round accurately without measuring twice."}}, {"q": {"en": "Why is a hidden edge drawn dashed and not left out?"}, "a": {"en": "Because it is still an edge of the object, and the drawing must describe the whole object. A dashed line shows where an edge lies behind material, which is exactly what the reader needs in order to picture the shape."}}]}, {"title": {"en": "Reading the object"}, "items": [{"q": {"en": "How do you choose the front view of an object?"}, "a": {"en": "Pick the direction that shows the most of the shape and the fewest hidden edges, and that leaves the object in a natural standing position. That view becomes the front view and the other two follow from it."}}, {"q": {"en": "What are the three views of a standing cylinder?"}, "a": {"en": "A circle of diameter 2r in the top view and identical rectangles 2r by h in the front and side views, each with a thin chain centre line on the axis. Nothing is hidden, so no dashed line appears."}}, {"q": {"en": "What are the three views of a standing cone?"}, "a": {"en": "A circle with a centre point in the top view, and an isosceles triangle in the front and side views: base 2r, height h, and the slant sides equal to the square root of (r squared plus h squared)."}}, {"q": {"en": "A hole passes vertically through a plate. How does it appear in each view?"}, "a": {"en": "As a solid circle with centre lines in the top view, and as two dashed vertical lines 20 mm apart in the front and side views, running the full thickness of the material, because the hole is hidden there."}}, {"q": {"en": "How do you draw the third view when two are given?"}, "a": {"en": "Project every corner of the given views into the position of the new view, taking the height from the front view and the depth from the top view, and joining the crossings. No new dimension is invented; every size is already in the two views."}}]}, {"title": {"en": "Free-hand sketching"}, "items": [{"q": {"en": "What makes a free-hand sketch acceptable in an examination?"}, "a": {"en": "Correct proportions and correct construction shown lightly: the box or circle that holds the shape, the construction lines, and a clean outline. Instruments are not needed, but the geometry must still be right."}}, {"q": {"en": "How do you sketch a circle free-hand?"}, "a": {"en": "Draw a light square first, mark the four tangent points at the middle of each side, and join them with four arcs, turning the paper rather than the hand. A circle that touches all four sides of its square is round enough for a sketch."}}, {"q": {"en": "How do you sketch a regular hexagon?"}, "a": {"en": "Draw a light circle, step the radius round its circumference six times, and join alternate points for the three long diagonals. The across-corners size is twice the side and the across-flats size is 1.732 times the side."}}, {"q": {"en": "What check proves a sketched pentagon?"}, "a": {"en": "All five sides equal, all five interior angles 108 degrees, and the five vertices 72 degrees apart on the circumcircle. The side is 1.176 times the circumradius."}}]}], "exam_questions": [{"q": {"en": "A stepped block has a base plate 60 mm x 40 mm x 15 mm and an upright 20 mm x 40 mm x 25 mm on its left end. Draw its front, top and side views in first angle."}, "marks": 6}, {"q": {"en": "A cylinder of 40 mm diameter and 50 mm height stands on HP. Draw its three views, showing the axis."}, "marks": 5}, {"q": {"en": "A rectangular plate 60 mm x 40 mm x 15 mm has a hole of 20 mm diameter drilled vertically through its centre. Draw the three views."}, "marks": 6}, {"q": {"en": "A square pyramid has a base 40 mm square and an axis 50 mm long, standing on HP with two sides of the base parallel to VP. Draw its three views."}, "marks": 6}, {"q": {"en": "The front view of an object is an L 60 mm wide and 40 mm high with the upright 20 mm wide, and its top view is a 60 mm x 40 mm rectangle divided 20 mm from one end. Draw the side view and state what it must contain."}, "marks": 5}, {"q": {"en": "Sketch free-hand, in about a minute each: a square, an equilateral triangle, a circle, a semicircle, a regular hexagon and a regular pentagon, each about 50 mm across, leaving the construction lines visible."}, "marks": 5}], "learning_outcomes": [{"en": "Read a pictorial (isometric) view and produce the front, top and side views of a simple object by first-angle projection."}], "course_outcomes": ["CO4"], "practical_numbers": [5], "content_kind": "theory", "lesson_count": 6, "answered_practice_count": 6, "assessment_note": {"en": "Official course: theory ESE 70 + PA 30 and practical PA 20 + ESE 30 = 150 marks, 3 credits, 30 teaching hours (2 lecture + 2 practical). This unit carries 20 % weightage, 6 of the 30 hours and 14 of the 70 theory marks (the PDF prints weightage only, so the marks are split by weightage). The solved drawing problems in section 4 are revision constructions with suggested marks, not official GTU papers, and the syllabus allows any valid method in the exam, so the notes show one clear method for each curve and name the alternatives."}, "question_provenance": "Original solved drawing problems written for revision; not official past papers", "question_marks_are_suggested": true, "sources": [{"title": "GTU DI01000111 Engineering Graphics syllabus (uploaded PDF, w.e.f. 2024-25)", "url": "https://syllabus.gtu.ac.in/"}, {"title": "N. D. Bhatt - Elementary Engineering Drawing, Charotar Publishing House, Anand (chapters 7-8: orthographic projections, first and third angle)", "url": "https://www.charotarbookstall.com/"}, {"title": "P. S. Gill - A Text Book of Engineering Drawing, S. K. Kataria & Sons, Delhi (reading a pictorial view and drawing the three views)", "url": "https://www.skkatariaandsons.com/"}, {"title": "BIS SP 46 - Engineering drawing practice: layout of views, hidden detail, centre lines", "url": "https://www.bis.gov.in/"}]};
const SVG = {"u5_layout": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 314\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"314\" fill=\"#ffffff\"/><text x=\"180\" y=\"25.3\" font-size=\"12.4\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"bold\">Where each view goes in first angle</text><rect x=\"60.0\" y=\"74.0\" width=\"96.0\" height=\"58.0\" fill=\"#1565C0\" fill-opacity=\"0.12\" stroke=\"#1565C0\" stroke-width=\"1.8\"/><text x=\"108.0\" y=\"108.9\" font-size=\"8.4\" text-anchor=\"middle\" fill=\"#1565C0\" font-weight=\"bold\">FRONT</text><text x=\"108.0\" y=\"120.3\" font-size=\"6.6\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">elevation</text><rect x=\"60.0\" y=\"158.0\" width=\"96.0\" height=\"46\" fill=\"#7B2CD9\" fill-opacity=\"0.12\" stroke=\"#7B2CD9\" stroke-width=\"1.8\"/><text x=\"108.0\" y=\"187.8\" font-size=\"8.0\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">TOP  (plan)</text><rect x=\"182.0\" y=\"74.0\" width=\"52\" height=\"58.0\" fill=\"#2E7D32\" fill-opacity=\"0.12\" stroke=\"#2E7D32\" stroke-width=\"1.8\"/><text x=\"208.0\" y=\"103.8\" font-size=\"8.0\" text-anchor=\"middle\" fill=\"#2E7D32\" font-weight=\"bold\">SIDE</text><text x=\"208.0\" y=\"115.2\" font-size=\"6.4\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">from the left</text><path d=\"M108.0 136.0L108.0 154.0\" fill=\"none\" stroke=\"#7B2CD9\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><path d=\"M109.6 149.0L108.0 154.0L106.4 149.0Z\" fill=\"#7B2CD9\"/><path d=\"M160.0 103.0L178.0 103.0\" fill=\"none\" stroke=\"#2E7D32\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><path d=\"M173.0 101.4L178.0 103.0L173.0 104.6Z\" fill=\"#2E7D32\"/><text x=\"114.0\" y=\"150.2\" font-size=\"6.4\" text-anchor=\"start\" fill=\"#7B2CD9\" font-weight=\"normal\">swings down</text><text x=\"168.0\" y=\"99.2\" font-size=\"6.2\" text-anchor=\"start\" fill=\"#2E7D32\" font-weight=\"normal\">turns</text> const chev = '<svg class="chev" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#7B2CD9" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
const dots = '<svg width="22" height="22" viewBox="0 0 24 24" fill="#222"><circle cx="12" cy="5" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="12" cy="19" r="2.2"/></svg>';
const fixTables = h => h.replace(/<table>/g,'<div class="tw"><table>').replace(/<\/table>/g,'</table></div>');
const head = (title, menu=true) => `<div class="sh"><span>${title}</span>${menu?`<button class="more" data-more>${dots}</button><div class="menu"><button data-act="expand">${L('expand')}</button><button data-act="collapse">${L('collapse')}</button></div>`:''}</div>`;
const dgInline = id => `<div class="dg" data-dg="${id}">${SVG[id]}</div><div class="dgc">📐 ${t(U.diagrams.find(d=>d.id===id).title)} · ${L('tapzoom')}</div>`;

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const KW = new Set('auto break case const continue default do else enum extern for goto if register return signed sizeof static struct switch typedef union unsigned volatile while'.split(' '));
const TY = new Set('int char float double void long short FILE size_t'.split(' '));
const PKW = new Set('False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield'.split(' '));
const PTY = new Set('int float str bool list tuple set dict complex frozenset bytes bytearray range object'.split(' '));
function hlPy(src){
  const re = /(#[^\n]*)|((?:\b[rRbBfFuU]{1,2})?(?:'{3}[\s\S]*?'{3}|"{3}[\s\S]*?"{3}|'(?:\\.|[^'\\\n])*'|"(?:\\.|[^"\\\n])*"))|(^>>>|^\.\.\.(?= ))|([A-Za-z_]\w*)(?=\s*\()|([A-Za-z_]\w*)|(\b(?:0[xXoObB][0-9a-fA-F_]+|\d[\d_]*(?:\.\d+)?(?:[eE][-+]?\d+)?j?)\b)/gm;
  let o='', last=0, m;
  while ((m = re.exec(src))){
    o += esc(src.slice(last, m.index)); last = re.lastIndex;
    const w = esc(m[0]);
    if (m[1]) o += `<span class="cm">${w}</span>`;
    else if (m[2]) o += `<span class="st">${w}</span>`;
    else if (m[3]) o += `<span class="pp">${w}</span>`;
    else if (m[4]) o += PKW.has(m[4]) ? `<span class="kw">${w}</span>` : PTY.has(m[4]) ? `<span class="ty">${w}</span>` : `<span class="fn">${w}</span>`;
    else if (m[5]) o += PKW.has(m[5]) ? `<span class="kw">${w}</span>` : PTY.has(m[5]) ? `<span class="ty">${w}</span>` : w;
    else o += `<span class="nu">${w}</span>`;
  }
  return o + esc(src.slice(last));
}
function hl(src){
  if (META.code_lang === 'python') return hlPy(src);
  if (META.code_lang === 'nosql') return esc(src);
  const re = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(^[ \t]*#[^\n]*)|([A-Za-z_]\w*)(?=\s*\()|([A-Za-z_]\w*)|(\b\d+(?:\.\d+)?[fFlLuU]*\b)/gm;
  let o='', last=0, m;
  while ((m = re.exec(src))){
    o += esc(src.slice(last, m.index)); last = re.lastIndex;
    const w = esc(m[0]);
    if (m[1]) o += `<span class="cm">${w}</span>`;
    else if (m[2]) o += `<span class="st">${w}</span>`;
    else if (m[3]) o += `<span class="pp">${w}</span>`;
    else if (m[4]) o += KW.has(m[4]) ? `<span class="kw">${w}</span>` : TY.has(m[4]) ? `<span class="ty">${w}</span>` : `<span class="fn">${w}</span>`;
    else if (m[5]) o += KW.has(m[5]) ? `<span class="kw">${w}</span>` : TY.has(m[5]) ? `<span class="ty">${w}</span>` : w;
    else o += `<span class="nu">${w}</span>`;
  }
  return o + esc(src.slice(last));
}
const progBody = p => p.items
  ? p.items.map(it => fixTables(t(it.body)) + (it.diagram?dgInline(it.diagram):'')).join('')
  : `<div class="pl">${L('code')}</div><pre class="code">${hl(t(p.code))}</pre><div class="pl">${L('output')}</div><pre class="out">${esc(p.out)}</pre>${p.plot?`<div class="pl">${L('plot')}</div>`+dgInline(p.plot).replace('class="dg"','class="dg pg"'):''}${p.expl?`<div class="pl">${L('expl')}</div>${fixTables(t(p.expl))}`:''}`;
const pBox = id => { const p=(U.programs||[]).find(x=>x.id===id); if(!p) return ''; return `<div class="pbox"><div class="et">${L('prog')}: ${t(p.title)}</div>${progBody(p)}</div>`; };
const exBox = id => { const n=(U.numericals||[]).find(x=>x.id===id); if(!n) return ''; return `<div class="ex"><div class="et">${L('ex')}</div><div class="eq2">${t(n.q)}</div>${fixTables(t(n.a))}</div>`; };
function notes(){
  let h = `<div class="intro"><b>${t(U.title)}</b><div>${L('unit')} ${U.unit} · ${U.weightage}% ${L('intro')} · ${U.hours} ${L('hours')}</div><div>${U.intro_text ? t(U.intro_text) : L(U.programs?(META.code_lang==='python'?'intropy':'introc'):'introd')}</div></div>`;
  U.notes.forEach((sec,si)=>{
    h += `<div class="sec">${head(t(sec.title))}`;
    sec.items.forEach((it,i)=>{
      const open = si===0&&i===0 ? ' open' : '';
      if (it.h) {
        h += `<div class="card${it.key?' key':''}${open}"><div class="q hd"><span class="t">${it.key?'⭐ ':''}${t(it.h)}</span>${chev}</div>
        <div class="a rn" style="padding-left:18px">${fixTables(t(it.body)).replace(/margin:0 0 10px -36px/g,'')}${it.diagram?dgInline(it.diagram):''}${(it.examples||[]).map(exBox).join('')}${(it.programs||[]).map(pBox).join('')}</div></div>`;
      } else {
        h += `<div class="card${open}"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(it.q)}</span>${chev}</div>
        <div class="a">${fixTables(t(it.a))}${it.diagram?dgInline(it.diagram):''}</div></div>`;
      }
    });
    h += `</div>`;
  });
  return h;
}
function numericals(){
  return `<div class="sec">${head(L('numericals'))}` + (U.numericals||[]).map((n,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(n.q)}</span>${chev}</div><div class="a">${fixTables(t(n.a))}</div></div>`).join('') + `</div>`;
}
function diagrams(){
  return `<div class="sec">${head(L((U.tabs ? U.tabs.includes('flowcharts')&&!U.tabs.includes('diagrams') : U.programs&&META.code_lang!=='python')?'flowcharts':'diagrams'),false)}<div style="height:10px"></div>` + U.diagrams.map((d,i)=>
    `<div class="dcard" data-dg="${d.id}"><div class="h">${i+1}. ${t(d.title)}</div>${SVG[d.id]}</div>`).join('') + `</div>`;
}
function equations(){
  return U.equations.map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><span class="fbox">${e.f}</span></span>${chev}</div>
     <div class="a"><p>${t(e.terms)}</p></div></div>`).join('') + `</div>`).join('');
}
function viva(){
  // two shapes exist in the corpus: flat [{q,a}] and grouped [{title, items:[{q,a}]}]
  const groups = U.viva.every(v=>v && v.q) ? [{items: U.viva}] : U.viva;
  return groups.map(g=>{
    const items = g.items || [];
    return `<div class="sec">${g.title?head(t(g.title)):''}` + items.map((v,i)=>
      `<div class="card"><div class="q hd"><span class="n">${i+1}.</span><span class="t">${t(v.q)}</span>${chev}</div><div class="a"><p>${t(v.a)}</p></div></div>`).join('') + `</div>`;
  }).join('');
}
function exam(){
  return `<div class="sec">${head(L('examhead'),false)}` + U.exam_questions.map((x,i)=>
    `<div class="card"><div class="q" style="cursor:default"><span class="n">${i+1}.</span><span class="t">${t(x.q)}</span><span class="mk">${x.marks} ${L('marks')}</span></div></div>`).join('') + `</div>`;
}
function programs(){
  return `<div class="sec">${head(L('programs'))}` + (U.programs||[]).map((p,i)=>
    `<div class="card"><div class="q hd"><span class="n">${i+1}.</span><span class="t">${t(p.title)}</span>${chev}</div><div class="a pa">${progBody(p)}</div></div>`).join('') + `</div>`;
}
function syntax(key){
  return (U[typeof key==='string'?key:'syntax']||[]).map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><pre class="code sx">${hl(e.f)}</pre></span>${chev}</div>
     <div class="a">${e.terms && t(e.terms) ? fixTables(t(e.terms)) : ''}</div></div>`).join('') + `</div>`).join('');
}
const flowcharts = diagrams;
const algorithms = () => syntax('algorithms');
const ALLV = {notes, programs, diagrams, flowcharts, algorithms, syntax, equations, numericals, viva, exam};
const VIEWS = U.tabs ? Object.fromEntries(U.tabs.map(k=>[k, ALLV[k]])) : U.programs ? (META.code_lang==='python' ? {notes, programs, diagrams, syntax, viva, exam} : {notes, programs, flowcharts, syntax, viva, exam}) : U.numericals ? {notes, diagrams, equations, numericals, viva, exam} : {notes, diagrams, equations, viva, exam};
function render(){
  document.getElementById('title').textContent = `${L('unit')} ${U.unit}: ${t(U.title)}`;
  document.getElementById('sub').textContent = `${t(META.name)} · ${META.code}`;
  document.getElementById('lang').textContent = S.lang==='en' ? 'ગુ' : 'EN';
  document.getElementById('lang').style.display = META.languages.includes('gu') ? '' : 'none';
  document.getElementById('tabs').innerHTML = Object.keys(VIEWS).map(k=>`<button class="tab${S.tab===k?' on':''}" data-tab="${k}">${L(k)}</button>`).join('');
  document.getElementById('view').innerHTML = VIEWS[S.tab]();
  document.querySelectorAll('#view pre.c').forEach(e=>{ e.innerHTML = hl(e.textContent); e.className='code'; });
}
let zoom = 1;
function setZoom(z){ zoom = Math.min(4, Math.max(1, z)); const w=document.getElementById('zw'); w.style.width=(zoom*100)+'%'; document.getElementById('zr').textContent=Math.round(zoom*100)+'%'; }
document.addEventListener('click', e=>{
  const q = e.target.closest('.q'); if (q && q.parentElement.querySelector('.a')) { q.parentElement.classList.toggle('open'); return; }
  const tb = e.target.closest('[data-tab]'); if (tb){ S.tab = tb.dataset.tab; render(); window.scrollTo(0,0); return; }
  if (e.target.closest('#lang')){ S.lang = S.lang==='en'?'gu':'en'; render(); return; }
  const m = e.target.closest('[data-more]');
  document.querySelectorAll('.menu.show').forEach(x=>{ if(!m || x!==m.nextElementSibling) x.classList.remove('show'); });
  if (m){ m.nextElementSibling.classList.toggle('show'); return; }
  const act = e.target.closest('[data-act]');
  if (act){ act.closest('.sec').querySelectorAll('.card').forEach(c=>{ if(c.querySelector('.a')) c.classList.toggle('open', act.dataset.act==='expand'); }); act.parentElement.classList.remove('show'); return; }
  const dg = e.target.closest('[data-dg]');
  if (dg){ const id=dg.dataset.dg; document.getElementById('mt').textContent=t(U.diagrams.find(d=>d.id===id).title); document.getElementById('zw').innerHTML=SVG[id]; setZoom(1); document.getElementById('modal').classList.add('show'); return; }
  if (e.target.closest('#mx')) document.getElementById('modal').classList.remove('show');
  if (e.target.closest('#zi')) setZoom(zoom+0.5);
  if (e.target.closest('#zo')) setZoom(zoom-0.5);
  if (e.target.closest('#zr')) setZoom(1);
});
render();
</script></body></html>
