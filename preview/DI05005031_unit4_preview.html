90 % conversion at first order - while each tank stays simple and easy to control.", "gu": "સરખા tanks ની શ્રેણી સંખ્યા વધે તેમ plug flow જેવી વર્તે, તેથી આપેલા conversion માટે કુલ volume ઝડપથી ઘટે - first order માં 90 % માટે બે tanks પહેલેથી અડધું volume કરે - જ્યારે દરેક tank સાદું અને નિયંત્રણમાં સહેલું રહે."}}, {"q": {"en": "What breaks plug flow in a tube?", "gu": "નળીમાં plug flow શું તોડે?"}, "a": {"en": "Axial dispersion, a laminar velocity profile, natural convection, and too short a tube for its diameter. All of them let fluid of different ages mix, so the residence times spread out and the reactor drifts towards CSTR behaviour.", "gu": "Axial dispersion, laminar velocity profile, natural convection, અને વ્યાસ કરતાં ખૂબ ટૂંકી નળી. તે બધા જુદી ઉંમરનું પ્રવાહી ભેળવે, તેથી residence times ફેલાય અને reactor CSTR વર્તન તરફ જાય."}}, {"q": {"en": "When would you deliberately choose a CSTR for a reaction that needs a big volume?", "gu": "મોટું volume જોઈએ તેવી પ્રક્રિયા માટે ક્યારે જાણી જોઈને CSTR પસંદ કરશો?"}, "a": {"en": "For an autocatalytic or a strongly exothermic reaction, or one that must be held at a low concentration to avoid a side product. In those cases a low concentration is an advantage, not a penalty, and the excellent temperature control matters more than the volume.", "gu": "Autocatalytic કે તીવ્ર exothermic પ્રક્રિયા માટે, અથવા જે side product ટાળવા નીચા concentration પર રાખવી પડે તેના માટે. તે કિસ્સામાં નીચું concentration ગેરફાયદો નહીં પણ ફાયદો છે, અને ઉત્તમ temperature control volume કરતાં વધુ મહત્ત્વનું છે."}}]}, {"title": {"en": "Packed and fluidised beds", "gu": "Packed અને fluidised beds"}, "items": [{"q": {"en": "Why does a fixed bed suffer hot spots but a fluidised bed does not?", "gu": "Fixed bed માં hot spots કેમ થાય પણ fluidised bed માં નહીં?"}, "a": {"en": "In a fixed bed the gas moves in channels and the solid cannot move, so heat released locally can only leave by conduction through the pellets - slowly. In a fluidised bed the solids circulate violently, so any hot particle is carried into the cooler bulk within seconds and the bed is isothermal.", "gu": "Fixed bed માં gas channels માં ચાલે અને ઘન હલી શકે નહીં, તેથી સ્થાનિક રીતે છૂટેલી heat ફક્ત pellets દ્વારા conduction થી જ નીકળે - ધીમે. Fluidised bed માં ઘન જોરદાર રીતે ફરે, તેથી ગરમ particle સેકન્ડોમાં ઠંડા જથ્થામાં આવી જાય અને bed isothermal રહે."}}, {"q": {"en": "Why is a cyclone compulsory on a fluidised bed?", "gu": "Fluidised bed પર cyclone કેમ ફરજિયાત છે?"}, "a": {"en": "Because the gas leaving the bed always entrains fine catalyst. Without a cyclone and a dipleg to return it, the inventory is carried out of the reactor within days and both the conversion and the catalyst bill collapse.", "gu": "કારણ કે bed માંથી નીકળતો gas હંમેશા બારીક catalyst ઉપાડી જાય. પાછો મોકલતો cyclone અને dipleg ન હોય તો inventory દિવસોમાં reactor ની બહાર જાય અને conversion તથા catalyst નો ખર્ચ બંને બગડે."}}, {"q": {"en": "What does WHSV mean, and why is it used instead of space time?", "gu": "WHSV નો અર્થ શું, અને space time ને બદલે તે કેમ વપરાય?"}, "a": {"en": "Weight hourly space velocity is the mass of feed per hour divided by the mass of catalyst. Catalyst is bought and loaded by weight and its activity is quoted per kilogram, so WHSV is the natural variable for a solid-catalysed reactor, just as space time is natural for a homogeneous one.", "gu": "Weight hourly space velocity એ કલાક દીઠ feed નું દળ ભાગ્યું catalyst ના દળ. Catalyst વજનથી ખરીદાય અને ભરાય, અને તેની activity પ્રતિ કિલોગ્રામ લખાય, તેથી ઘન-ઉત્પ્રેરિત reactor માટે WHSV સ્વાભાવિક ચલ છે, જેમ homogeneous માટે space time."}}]}, {"title": {"en": "Multiphase reactors", "gu": "Multiphase reactors"}, "items": [{"q": {"en": "Which phase is dispersed in a bubble column, and which in a spray tower?", "gu": "Bubble column માં કયો phase વેરાય છે, અને spray tower માં કયો?"}, "a": {"en": "In a bubble column the gas is dispersed as bubbles in a continuous liquid; in a spray tower the liquid is dispersed as drops in a continuous gas. The choice decides the hold-up, the interfacial area and therefore the size of the vessel.", "gu": "Bubble column માં gas સતત પ્રવાહીમાં bubbles તરીકે વેરાય; spray tower માં પ્રવાહી સતત gas માં ટીપાં તરીકે વેરાય. આ પસંદગી hold-up, interfacial area અને તેથી પાત્રનું size નક્કી કરે."}}, {"q": {"en": "How do you know that a three-phase reaction is limited by mass transfer?", "gu": "Three-phase પ્રક્રિયા mass transfer થી મર્યાદિત છે તે કેમ ખબર પડે?"}, "a": {"en": "Increase the stirring or the gas rate: if the rate rises, mass transfer was controlling; if it does not move, the kinetics were. The other test is temperature - a mass-transfer-limited reaction is nearly insensitive to it.", "gu": "Stirring કે gas rate વધારો: rate વધે તો mass transfer નિયંત્રણ કરતું હતું; ન બદલાય તો kinetics. બીજી ચકાસણી temperature છે - mass-transfer-limited પ્રક્રિયા તેના પર લગભગ સંવેદનશીલ નથી."}}, {"q": {"en": "Why is a trickle bed preferred for hydrotreating?", "gu": "Hydrotreating માટે trickle bed કેમ પસંદ થાય?"}, "a": {"en": "Because the reaction is slow and needs a large amount of catalyst held in place at high pressure, with both gas and liquid passing continuously. A slurry would need a catalyst separation step at pressure, which is far more expensive.", "gu": "કારણ કે પ્રક્રિયા ધીમી છે અને ઊંચા pressure પર જગ્યાએ પકડેલો મોટો catalyst જથ્થો જોઈએ, જ્યાં gas અને પ્રવાહી બંને સતત પસાર થાય. Slurry માં pressure પર જ catalyst અલગ કરવાનું પગલું જોઈએ, જે ઘણું ખર્ચાળ છે."}}]}], "exam_questions": [{"q": {"en": "A 1.0 m3 batch reactor is charged with CA0 = 2.0 kmol/m3 of A. The reaction is first order with k = 0.020 min-1 and is run to 95 % conversion. Find the reaction time, the cycle time with 30 min of filling, heating and emptying, and the daily production of A reacted.", "gu": "1.0 m3 ના batch reactor માં CA0 = 2.0 kmol/m3 A ભરાય છે. પ્રક્રિયા first order છે, k = 0.020 min-1, અને 95 % conversion સુધી ચલાવાય છે. Reaction time, ભરવા-ગરમ કરવા-ખાલી કરવાના 30 min સાથે cycle time, અને રોજ પ્રક્રિયા થતા A નું ઉત્પાદન શોધો."}, "marks": 6}, {"q": {"en": "A first order reaction with k = 0.25 h-1 must be carried out to 80 % conversion in a CSTR. The feed rate is 7.2 m3/h. Find the space time and the reactor volume.", "gu": "k = 0.25 h-1 વાળી first order પ્રક્રિયા CSTR માં 80 % conversion સુધી કરવી છે. Feed rate 7.2 m3/h છે. Space time અને reactor નું volume શોધો."}, "marks": 7}, {"q": {"en": "The same feed (v0 = 7.2 m3/h, k = 0.25 h-1, X = 0.80) is now to be treated in two equal CSTRs in series. Find the volume of each and compare the total with the single tank of the previous problem.", "gu": "એ જ feed (v0 = 7.2 m3/h, k = 0.25 h-1, X = 0.80) હવે series માં બે સરખા CSTR માં લેવાની છે. દરેકનું volume શોધો અને કુલ volume ને પાછલા દાખલાની એક tank સાથે સરખાવો."}, "marks": 8}, {"q": {"en": "A gas reaction follows first order kinetics with k = 0.50 h-1 and is to reach 90 % conversion at a feed rate of 10 m3/h. Find the PFR volume, the space time, and the volume a single CSTR would need for the same duty.", "gu": "Gas પ્રક્રિયા k = 0.50 h-1 સાથે first order છે અને 10 m3/h feed rate પર 90 % conversion સુધી લઈ જવી છે. PFR નું volume, space time, અને એ જ કામ માટે એક CSTR ને લાગતું volume શોધો."}, "marks": 7}, {"q": {"en": "A fixed bed reactor treats 500 kg/h of gas over 250 kg of catalyst of bulk density 600 kg/m3 and particle density 1100 kg/m3. The bed is in a tube of 0.60 m inside diameter. Find the space velocity, the bed volume, the bed height and the void fraction.", "gu": "Fixed bed reactor 500 kg/h gas ને 250 kg catalyst પર પ્રક્રિયા કરાવે છે, જેની bulk density 600 kg/m3 અને particle density 1100 kg/m3 છે. Bed 0.60 m આંતરિક વ્યાસની નળીમાં છે. Space velocity, bed volume, bed height અને void fraction શોધો."}, "marks": 6}, {"q": {"en": "A powder of dp = 100 micron and rho_p = 2500 kg/m3 is to be fluidised by a gas of density 1.2 kg/m3 and viscosity 1.8e-5 Pa s in a bed of 0.30 m diameter carrying 40 kg of solids. Find Umf, the bed height at eps = 0.45, and say whether an operating velocity of 0.05 m/s fluidises the bed.", "gu": "dp = 100 micron અને rho_p = 2500 kg/m3 વાળો પાવડર 1.2 kg/m3 density અને 1.8e-5 Pa s viscosity વાળા gas થી 0.30 m વ્યાસના bed માં fluidise કરવો છે, જેમાં 40 kg ઘન છે. Umf, eps = 0.45 પર bed ની ઊંચાઈ શોધો, અને 0.05 m/s ની operating velocity bed ને fluidise કરશે કે નહીં કહો."}, "marks": 7}], "learning_outcomes": [{"en": "Control the different reactors efficiently using the knowledge of their functioning.", "gu": "રિએક્ટરોની કાર્યપદ્ધતિના જ્ઞાનથી તેમને કાર્યક્ષમ રીતે નિયંત્રિત કરવા."}], "course_outcomes": ["CO4"], "practical_numbers": [12, 13, 14, 15], "content_kind": "theory", "lesson_count": 15, "answered_practice_count": 6, "assessment_note": {"en": "Official course: theory ESE 70 + PA 30 and practical PA 20 + ESE 30 = 150 marks, 4 credits, 45 teaching hours. This unit carries 24 % weightage, 11 of the printed unit hours and 17 of the 70 theory marks - the largest single share of the paper, because the practical list (experiments 12 to 15) is all reactor work. The numericals of section 4.4 are original revision problems with suggested marks, not GTU papers.", "gu": "અધિકૃત course: theory ESE 70 + PA 30 અને practical PA 20 + ESE 30 = 150 marks, 4 credits, 45 teaching hours. આ unit નું weightage 24 %, છપાયેલા unit hours માંથી 11 અને 70 theory marks માંથી 17 છે - પેપરનો સૌથી મોટો હિસ્સો, કારણ કે practical યાદી (experiments 12 થી 15) આખી reactor નું કામ છે. વિભાગ 4.4 ના દાખલા revision માટેના મૂળ પ્રશ્નો છે, GTU પેપર નહીં."}, "question_provenance": "Original solved numericals written for revision; not official past papers", "question_marks_are_suggested": true, "sources": [{"title": "GTU DI05005031 Chemical Reaction Engineering syllabus (uploaded PDF, w.e.f. 2026-27)", "url": "https://syllabus.gtu.ac.in/"}, {"title": "Octave Levenspiel - Chemical Reaction Engineering, 3rd ed., Wiley (chapter 5: ideal reactors for a single reaction; chapter 6: design for single reactions)", "url": "ht
