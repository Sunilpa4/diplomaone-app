<script>
const U = {"subject": "DI05005031", "unit": 4, "format": "notes", "title": {"en": "Ideal Reactors", "gu": "આદર્શ રિએક્ટર"}, "hours": 11, "weightage": 24, "theory_marks": 17, "official": true, "languages": ["en", "gu"], "tabs": ["notes", "diagrams", "equations", "viva", "exam"], "intro_text": {"en": "Unit 4 of Chemical Reaction Engineering: the reactors themselves, built and worked part by part. The three ideal mixing models come first, then the batch and semi-batch vessels, the CSTR and the plug flow tube, the fixed bed and the fluidised bed, and finally the multiphase family - slurry, bubble column, spray tower and trickle bed. Each reactor is shown with its construction, its working steps, its design equation and its own strengths and limits. Six solved numericals follow in section 4.4.", "gu": "Chemical Reaction Engineering નું Unit 4: reactors પોતે, ભાગે ભાગે બનાવેલા અને સમજાવેલા. પહેલા ત્રણ આદર્શ mixing models, પછી batch અને semi-batch પાત્રો, CSTR અને plug flow નળી, fixed bed અને fluidised bed, અને અંતે multiphase કુટુંબ - slurry, bubble column, spray tower અને trickle bed. દરેક reactor તેની રચના, કાર્યપદ્ધતિના પગલાં, design equation અને પોતાની તાકાત તથા મર્યાદા સાથે દર્શાવેલો છે. વિભાગ 4.4 માં છ ઉકેલેલા દાખલા છે."}, "notes": [{"title": {"en": "4.1 What makes a reactor ideal", "gu": "4.1 Reactor આદર્શ કેવી રીતે બને"}, "items": [{"h": {"en": "Three ideal models, and why engineers start from them", "gu": "ત્રણ આદર્શ models, અને engineer તેમનાથી કેમ શરૂ કરે"}, "body": {"en": "<p>A real reactor has dead corners, a jet that short-circuits the inlet to the outlet, catalyst pellets with different amounts of gas on each side. None of that can be put into an equation directly, so the subject starts from three <b>ideal</b> models - pictures of perfect behaviour - and designs against them.</p><div class=\"math\">ideal batch: no in, no out, perfectly mixed inside\nideal CSTR : steady in and out, perfectly mixed inside\nideal PFR  : steady in and out, no mixing along the flow</div><h4>The assumptions, written down</h4><ul><li>Perfect mixing: at any instant the composition and temperature are the same at every point of a batch or CSTR.</li><li>Plug flow: in a PFR the velocity is the same across the section, so every element spends the same time in the reactor.</li><li>Steady state: for the flow reactors nothing changes with time at a fixed point.</li><li>Constant density unless an expansion factor says otherwise (Unit 3).</li></ul><h4>The three design equations that follow</h4><div class=\"math\"> 1. batch: t = NA0 x integral dX/(-rA V)          no flow term at all\n 2. CSTR : V = FA0 X / (-rA)exit               one algebraic line\n 3. PFR  : V = FA0 x integral dX/(-rA)         an integral along the tube\n 4. all three come from one mole balance - the difference is only the mixing picture</div><p>The three equations are the whole of Unit 5. Here they are only written down so that each reactor in this unit can be judged by the equation it satisfies.</p><table><tr><th>Model</th><th>Flow</th><th>What varies inside</th><th>Design variable</th></tr><tr><td>Batch</td><td>none</td><td>composition changes with time</td><td>time t</td></tr><tr><td>CSTR</td><td>in and out</td><td>nothing varies inside</td><td>volume V</td></tr><tr><td>PFR</td><td>in and out</td><td>composition along the length</td><td>volume V</td></tr></table><p><b>Why it is true.</b> Ideals are useful because they are bounds. A real reactor cannot beat a PFR for a positive order reaction and cannot do worse than a CSTR, so the two ideals bracket the plant: design against the bad one, pay for the good one, and measure the gap with a tracer.</p><p><b>Check your answer.</b> For first order with 90 % conversion, k tau is 2.303 in a PFR and 9 in a CSTR - a factor of 3.9 in volume. Any answer between the two is a real reactor.</p><p><b>Common mistake.</b> Calling a stirred tank a CSTR because it is stirred. A CSTR needs the mixing time far below the space time and a feed and outlet that do not short-circuit; a badly baffled tank is neither CSTR nor PFR.</p>", "gu": "<p>સાચા reactor માં મૃત ખૂણા, inlet થી outlet સુધી સીધો જતો jet, અને દરેક બાજુ જુદો gas ધરાવતા catalyst pellets હોય છે. એમાંથી કંઈ સીધું સમીકરણમાં મૂકી શકાતું નથી, તેથી વિષય ત્રણ <b>આદર્શ</b> models થી શરૂ થાય છે - સંપૂર્ણ વર્તનનાં ચિત્રો - અને તેમની સામે design કરે છે.</p><div class=\"math\">ideal batch: no in, no out, perfectly mixed inside\nideal CSTR : steady in and out, perfectly mixed inside\nideal PFR  : steady in and out, no mixing along the flow</div><h4>ધારણાઓ, લખેલી રીતે</h4><ul><li>Perfect mixing: કોઈ પણ ક્ષણે batch કે CSTR ના દરેક બિંદુએ રચના અને temperature સરખાં.</li><li>Plug flow: PFR માં આખા section પર velocity સરખી, તેથી દરેક element reactor માં સરખો સમય ગાળે.</li><li>Steady state: flow reactors માટે કોઈ બિંદુએ સમય સાથે કંઈ બદલાતું નથી.</li><li>Expansion factor કહે નહીં ત્યાં સુધી density અચળ (Unit 3).</li></ul><h4>ત્યારબાદ મળતાં ત્રણ design equations</h4><div class=\"math\"> 1. batch: t = NA0 x integral dX/(-rA V)          no flow term at all\n 2. CSTR : V = FA0 X / (-rA)exit               one algebraic line\n 3. PFR  : V = FA0 x integral dX/(-rA)         an integral along the tube\n 4. all three come from one mole balance - the difference is only the mixing picture</div><p>આ ત્રણ equations એ આખું Unit 5 છે. અહીં તે ફક્ત એટલા માટે લખ્યા છે કે આ unit ના દરેક reactor ને તે જે equation પાળે છે તેનાથી અજમાવી શકાય.</p><table><tr><th>Model</th><th>Flow</th><th>અંદર શું બદલાય</th><th>Design variable</th></tr><tr><td>Batch</td><td>કંઈ નહીં</td><td>રચના સમય સાથે બદલાય</td><td>સમય t</td></tr><tr><td>CSTR</td><td>અંદર અને બહાર</td><td>અંદર કંઈ બદલાતું નથી</td><td>volume V</td></tr><tr><td>PFR</td><td>અંદર અને બહાર</td><td>લંબાઈ પર રચના</td><td>volume V</td></tr></table><p><b>કેમ સાચું છે.</b> આદર્શ એટલા માટે ઉપયોગી છે કે તે મર્યાદાઓ છે. ધન order ની પ્રક્રિયા માટે સાચો reactor PFR થી સારો ન હોઈ શકે અને CSTR થી ખરાબ ન હોઈ શકે, તેથી બંને આદર્શ plant ને બંને બાજુથી બાંધે: ખરાબ વાળા સામે design કરો, સારા વાળાની કિંમત આપો, અને tracer થી અંતર માપો.</p><p><b>જવાબ ચકાસો.</b> 90 % conversion સાથે first order માટે PFR માં k tau 2.303 અને CSTR માં 9 છે - volume માં 3.9 ગણો ફરક. બંને વચ્ચેનો કોઈ પણ જવાબ સાચો reactor છે.</p><p><b>સામાન્ય ભૂલ.</b> હલાવેલી tank ને ફક્ત હલાવે છે તેથી CSTR કહેવું. CSTR માટે mixing time space time કરતાં ઘણો નાનો જોઈએ અને feed તથા outlet short-circuit ન કરે; ખરાબ baffle વાળી tank CSTR પણ નથી અને PFR પણ નથી.</p>"}, "diagram": "u4_models", "syllabus_item": "4.1"}]}, {"title": {"en": "4.2 Batch and semi-batch reactors", "gu": "4.2 Batch અને semi-batch reactors"}, "items": [{"h": {"en": "The batch reactor: construction and working", "gu": "Batch reactor: રચના અને કાર્યપદ્ધતિ"}, "body": {"en": "<h4>Construction: what it is made of</h4><ul><li>Shell with a dished bottom - holds the charge and takes the pressure.</li><li>Agitator: motor, gearbox, shaft and impeller - keeps the batch uniform and speeds up heat transfer.</li><li>Baffles - stop the liquid rotating as a solid body, so the impeller really mixes.</li><li>Jacket (or coils) - heating or cooling medium, the only way to hold the temperature of an exotherm.</li><li>Thermometer pocket, pressure gauge and relief valve - the batch is watched and protected.</li><li>Charge nozzle, sight glass, sample point and bottom drain valve - filling, watching, testing and emptying.</li></ul><h4>Working: step by step</h4><ol><li>Charge: weigh and add the reactants (and the solvent) through the charge nozzle.</li><li>Bring to temperature: jacket heating with the agitator running, so no local hot spot forms.</li><li>React: start the clock at the moment the last reactant is in; sample at set times or run for the calculated time.</li><li>Control: jacket cooling takes the heat of reaction away; if the temperature runs, the charge rate was too high.</li><li>Discharge: empty through the bottom valve, quench or neutralise, then clean the vessel before the next batch.</li></ol><h4>The design equation</h4><div class=\"math\"> 1. mole balance on A over the whole batch: NA0 dX/dt = -rA V\n 2. constant volume: t = CA0 x integral from 0 to X of dX/(-rA)\n 3. first order: t = (1/k) ln[1/(1 - X)]\n 4. second order, CA0 = CB0: t = X/[k CA0 (1 - X)]</div><div class=\"math\">example: k = 0.02 min-1, X = 0.95\nt = (1/0.02) ln(1/0.05) = 50 x 3.00 = 150 min</div><table><tr><th>Strengths</th><th>Weaknesses</th></tr><tr><td>one vessel does many products; recipe changes are easy</td><td>labour, cleaning and downtime between batches</td></tr><tr><td>high conversion per pass if the batch is left long enough</td><td>batch-to-batch variation, so quality control is harder</td></tr><tr><td>small scale is cheap; good for pharma, dyes and polymerisation</td><td>a runaway exotherm has nowhere to go</td></tr></table><p><b>Why it is true.</b> Everything in the batch reactor is a function of time alone, because the mixing assumption removes position from the problem. That is why the batch equations of Unit 3 apply to it without any correction.</p><p><b>Check your answer.</b> With a 30 min turnaround the cycle is 180 min, so 8 batches a day fit in; a continuous reactor of the same volume would process the same material in 150 min of steady running but cannot be cleaned between products.</p><p><b>Common mistake.</b> Sizing a batch reactor from the reaction time alone. The vessel must also hold the fouling allowance, the freeboard for foam, and the time lost in filling, heating and emptying.</p>", "gu": "<h4>રચના: તે કયા ભાગોથી બનેલું છે</h4><ul><li>ચાર્જ ધરાવતું અને pressure ખમતું છીછરા તળિયા વાળું shell.</li><li>Agitator: motor, gearbox, shaft અને impeller - batch સરખું રાખે અને heat transfer ઝડપી કરે.</li><li>Baffles - પ્રવાહીને ઘન પદાર્થની જેમ ફરતું અટકાવે, જેથી impeller ખરેખર મિક્સ કરે.</li><li>Jacket (કે coils) - ગરમ કે ઠંડું કરતું માધ્યમ, exotherm નું temperature પકડી રાખવાનો એક જ રસ્તો.</li><li>Thermometer pocket, pressure gauge અને relief valve - batch પર નજર અને રક્ષણ.</li><li>Charge nozzle, sight glass, sample point અને તળિયાનો drain valve - ભરવું, જોવું, ચકાસવું અને ખાલી કરવું.</li></ul><h4>કાર્યપદ્ધતિ: પગલે પગલે</h4><ol><li>ચાર્જ: reactants (અને solvent) તોળીને charge nozzle થી ઉમેરો.</li><li>Temperature પર લાવો: agitator ચાલુ રાખીને jacket થી ગરમ કરો, જેથી local hot spot ન બને.</li><li>પ્રક્રિયા: છેલ્લો reactant ઉમેરાય તે ક્ષણે ઘડિયાળ શરૂ કરો; નક્કી સમયે sample લો કે ગણેલા સમય સુધી ચલાવો.</li><li>નિયંત્રણ: jacket નું ઠંડક પ્રક્રિયાની heat કાઢે; temperature દોડે તો charge rate વધારે હતો.</li><li>ડિસ્ચાર્જ: તળિયાના valve થી ખાલી કરો, quench કે neutralise કરો, પછી આગલા batch પહેલાં પાત્ર સાફ કરો.</li></ol><h4>Design equation</h4><div class=\"math\"> 1. mole balance on A over the whole batch: NA0 dX/dt = -rA V\n 2. constant volume: t = CA0 x integral from 0 to X of dX/(-rA)\n 3. first order: t = (1/k) ln[1/(1 - X)]\n 4. second order, CA0 = CB0: t = X/[k CA0 (1 - X)]</div><div class=\"math\">example: k = 0.02 min-1, X = 0.95\nt = (1/0.02) ln(1/0.05) = 50 x 3.00 = 150 min</div><table><tr><th>તાકાત</th><th>નબળાઈ</th></tr><tr><td>એક પાત્ર ઘણા products કરે; recipe બદલવી સહેલી</td><td>batch વચ્ચે મજૂરી, સફાઈ અને downtime</td></tr><tr><td>batch પૂરતો સમય રહે તો પ્રતિ pass ઊંચું conversion</td><td>batch દર batch ફરક, તેથી quality control અઘરું</td></tr><tr><td>નાના scale પર સસ્તું; pharma, dyes અને polymerisation માટે સારું</td><td>runaway exotherm ને જવાની જગ્યા નથી</td></tr></table><p><b>કેમ સાચું છે.</b> Batch reactor માં બધું ફક્ત સમયનું વિધેય છે, કારણ કે mixing ની ધારણા સ્થાનને સમસ્યામાંથી કાઢી નાખે છે. તેથી જ Unit 3 ના batch equations કોઈ સુધારા વગર તેના પર લાગુ પડે.</p><p><b>જવાબ ચકાસો.</b> 30 min turnaround સાથે cycle 180 min છે, તેથી દિવસમાં 8 batch બેસે; એ જ volume નો continuous reactor એ જ material 150 min સ્થિર રનમાં પ્રક્રિયા કરે પણ products વચ્ચે સાફ ન થઈ શકે.</p><p><b>સામાન્ય ભૂલ.</b> ફક્ત reaction time પરથી batch reactor નું size કરવું. પાત્રમાં fouling માટે જગ્યા, foam માટે freeboard, અને ભરવા-ગરમ કરવા-ખાલી કરવામાં જતો સમય પણ ગણવો પડે.</p>"}, "diagram": "u4_batch", "syllabus_item": "4.2"}, {"h": {"en": "The semi-batch reactor: construction and working", "gu": "Semi-batch reactor: રચના અને કાર્યપદ્ધતિ"}, "body": {"en": "<p>A semi-batch reactor is a batch vessel with one reactant fed in during the run. There is no outlet, so the volume grows while the reaction proceeds.</p><h4>Construction: what it is made of</h4><ul><li>Feed tank and feed pump - deliver the second reactant at a set rate.</li><li>Control valve and flow meter - the feed rate is the operating variable.</li><li>Dip tube - puts the feed below the liquid surface so it mixes at once and does not flash off.</li><li>Agitator and baffles - the same duty as in a batch vessel, but now against a rising level.</li><li>Jacket - removes the heat of a reaction that is deliberately fast.</li><li>Level and temperature instruments - the level tells the operator how much has been dosed.</li></ul><h4>Working: step by step</h4><ol><li>Charge reactant A (often with a solvent) and bring it to temperature.</li><li>Start the agitator, then open the feed of B at the chosen rate - the two start together so no slug of B ever sits in the vessel.</li><li>B reacts as it arrives, so its concentration stays low and the heat is spread over the whole dosing time.</li><li>Stop the feed when the calculated amount is in; let the batch finish reacting (the cook-out).</li><li>Cool, discharge and clean as for a batch.</li></ol><h4>The mole balance that makes it different</h4><div class=\"math\"> 1. for the fed reactant B: accumulation = in - reaction\n 2. dnB/dt = FB0 - (-rB) V\n 3. for the reactant already in the vessel: dnA/dt = -(-rA) V\n 4. volume grows: dV/dt = FB0/CB0  (if the feed is a pure liquid)\n 5. the two balances must be solved together - there is no closed form for a general law</div><div class=\"math\">special case, B fed into a large excess of A:\nA is nearly constant, so -rB = k' CB with k' = k CA\nCB = (FB0/(k' V)) (1 - exp(-k' t))  -> a plateau, not a decay</div><table><tr><th>Why feed instead of charging</th><th>Where it is used</th></tr><tr><td>a fast exotherm is spread over time, so the jacket can cope</td><td>nitration, chlorination, sulphonation</td></tr><tr><td>the fed reactant stays dilute, which favours the wanted product</td><td>polymerisation (monomer fed into the initiator)</td></tr><tr><td>gas-liquid reactions: the gas is sparged in as the second reactant</td><td>hydrogenation, oxidation, fermentation feeds</td></tr></table><p><b>Why it is true.</b> Semi-batch is the standard answer to a reaction that is too fast to charge and too exothermic to run in one go: the feed rate becomes the handle on both the rate and the heat release.</p><p><b>Check your answer.</b> If the feed stops, the reaction slows within one mixing time - the vessel cannot hold a large inventory of the unstable reactant. That is the safety argument in one sentence.</p><p><b>Common mistake.</b> Starting the feed before the agitator. The first litres of B then land in a still vessel and react as a local slug - the classic cause of a runaway in a semi-batch plant.</p>", "gu": "<p>Semi-batch reactor એ batch પાત્ર છે જેમાં રન દરમિયાન એક reactant ઉમેરાતો રહે છે. Outlet નથી, તેથી પ્રક્રિયા ચાલે તેમ volume વધે છે.</p><h4>રચના: તે કયા ભાગોથી બનેલું છે</h4><ul><li>Feed tank અને feed pump - બીજો reactant નક્કી rate પર પહોંચાડે.</li><li>Control valve અને flow meter - feed rate એ ઓપરેટિંગ ચલ છે.</li><li>Dip tube - feed ને પ્રવાહીની સપાટી નીચે મૂકે, જેથી તે તરત મિક્સ થાય અને ઊડી ન જાય.</li><li>Agitator અને baffles - batch પાત્ર જેવું જ કામ, પણ હવે વધતી સપાટી સામે.</li><li>Jacket - જાણી જોઈને ઝડપી રાખેલી પ્રક્રિયાની heat કાઢે.</li><li>Level અને temperature instruments - level કહે કે કેટલું dose થઈ ગયું.</li></ul><h4>કાર્યપદ્ધતિ: પગલે પગલે</h4><ol><li>Reactant A (ઘણી વાર solvent સાથે) charge કરો અને temperature પર લાવો.</li><li>Agitator ચાલુ કરો, પછી B નો feed પસંદ કરેલા rate પર ખોલો - બંને સાથે શરૂ થાય જેથી B નો ગઠ્ઠો પાત્રમાં કદી ન રહે.</li><li>B આવતાં જ પ્રક્રિયા કરે, તેથી તેનું concentration નીચું રહે અને heat આખા dosing સમય પર વહેંચાય.</li><li>ગણેલી માત્રા આવી જાય ત્યારે feed બંધ કરો; batch ને પૂરી પ્રક્રિયા કરવા દો (cook-out).</li><li>ઠંડું કરો, ખાલી કરો અને batch ની જેમ સાફ કરો.</li></ol><h4>જે તેને અલગ બનાવે તે mole balance</h4><div class=\"math\"> 1. for the fed reactant B: accumulation = in - reaction\n 2. dnB/dt = FB0 - (-rB) V\n 3. for the reactant already in the vessel: dnA/dt = -(-rA) V\n 4. volume grows: dV/dt = FB0/CB0  (if the feed is a pure liquid)\n 5. the two balances must be solved together - there is no closed form for a general law</div><div class=\"math\">special case, B fed into a large excess of A:\nA is nearly constant, so -rB = k' CB with k' = k CA\nCB = (FB0/(k' V)) (1 - exp(-k' t))  -> a plateau, not a decay</div><table><tr><th>ચાર્જ કરવાને બદલે feed કેમ</th><th>ક્યાં વપરાય</th></tr><tr><td>ઝડપી exotherm સમય પર વહેંચાય, તેથી jacket સંભાળી શકે</td><td>nitration, chlorination, sulphonation</td></tr><tr><td>ઉમેરાતો reactant પાતળો રહે, જે ઇચ્છિત product ને ફાયદો આપે</td><td>polymerisation (monomer ને initiator માં ફીડ)</td></tr><tr><td>gas-liquid પ્રક્રિયા: gas ને બીજા reactant તરીકે sparge કરાય</td><td>hydrogenation, oxidation, fermentation feed</td></tr></table><p><b>કેમ સાચું છે.</b> Semi-batch એ એવી પ્રક્રિયાનો પ્રમાણભૂત જવાબ છે જે charge કરવા માટે ખૂબ ઝડપી અને એક વારમાં ચલાવવા માટે ખૂબ exothermic છે: feed rate જ rate અને heat release બંનેનું હેન્ડલ બની જાય.</p><p><b>જવાબ ચકાસો.</b> Feed અટકે તો પ્રક્રિયા એક mixing time માં ધીમી પડે - પાત્ર અસ્થિર reactant નો મોટો ભંડાર રાખી શકતું નથી. એ જ એક વાક્યમાં સલામતીનો દલીલ છે.</p><p><b>સામાન્ય ભૂલ.</b> Agitator પહેલાં feed ખોલવો. ત્યારે B ના પહેલા લિટર સ્થિર પાત્રમાં પડે અને સ્થાનિક ગઠ્ઠા તરીકે પ્રક્રિયા કરે - semi-batch plant માં runaway નું પ્રમાણભૂત કારણ.</p>"}, "diagram": "u4_semibatch", "syllabus_item": "4.2"}]}, {"title": {"en": "4.2 The flow reactors: CSTR and PFR", "gu": "4.2 Flow reactors: CSTR અને PFR"}, "items": [{"h": {"en": "The CSTR (mixed flow reactor): construction and working", "gu": "CSTR (mixed flow reactor): રચના અને કાર્યપદ્ધતિ"}, "body": {"en": "<p>The continuous stirred tank reactor is a stirred vessel with a continuous feed and a continuous overflow. Because the stirrer works faster than the feed, the contents are uniform - and the outlet carries exactly the composition that is inside.</p><h4>Construction: what it is made of</h4><ul><li>Shell with a dished bottom - sized for the space time, not for the reaction time.</li><li>Overflow nozzle at the liquid level - fixes the volume, so the level never rises.</li><li>Feed pump and inlet nozzle - brings the mixed feed to the bottom of the impeller.</li><li>Turbine impeller and baffles - the impeller alone makes a swirl; the baffles turn it into real mixing.</li><li>Jacket or internal coil - holds the temperature at the exit condition, which is the only condition the reactor ever sees.</li><li>Level and temperature control loops - a CSTR that loses its level loses its residence time.</li></ul><h4>Working: step by step</h4><ol><li>Feed enters below the impeller and is thrown outward into the baffled bulk.</li><li>One pass of the impeller mixes the whole vessel in a time of the order of a few seconds to a minute.</li><li>The mixture leaves through the overflow at the same composition as the bulk.</li><li>Steady state is reached after about three space times; the product from then on is constant.</li><li>The conversion is set by the space time, so the operator changes flow or temperature, never the level.</li></ol><h4>The design equation</h4><div class=\"math\"> 1. mole balance on A at steady state: in - out - reaction = 0\n 2. FA0 - FA - (-rA) V = 0\n 3. with FA = FA0(1 - X):   V = FA0 X / (-rA)exit\n 4. dividing by the feed rate:  tau = V/v0 = CA0 X / (-rA)exit\n 5. first order: tau = X/[k(1 - X)]</div><div class=\"math\">first order, X = 0.90: tau = 0.9/(k x 0.1) = 9/k\nPFR for the same duty: tau = ln(10)/k = 2.30/k, so 3.9 times less volume</div><p><b>Why it is true.</b> The CSTR is the only reactor that always works at the outlet concentration, which is the lowest concentration in the system. For a positive order reaction that is the slowest possible rate, which is exactly why it needs the largest volume - and exactly why it is the safest to control.</p><p><b>Check your answer.</b> With X = 0.9 the CSTR needs k tau = 9 while a PFR needs 2.3; with X = 0.5 the two are 1 and 0.69, so the penalty of a CSTR is worst at high conversion.</p><p><b>Common mistake.</b> Putting a CSTR in series with itself and expecting the same volume. Two equal CSTRs in series reach 90 % in k tau = 4.3 instead of 9 - half the volume for the same duty, which is why trains of tanks are common.</p>", "gu": "<p>Continuous stirred tank reactor એ સતત feed અને સતત overflow વાળું હલાવેલું પાત્ર છે. Stirrer feed કરતાં ઝડપી કામ કરે છે, તેથી અંદરનું બધું સરખું હોય - અને outlet અંદરની જ રચના ધરાવે.</p><h4>રચના: તે કયા ભાગોથી બનેલું છે</h4><ul><li>છીછરા તળિયા વાળું shell - space time માટે, reaction time માટે નહીં.</li><li>પ્રવાહી સપાટી પરનું overflow nozzle - volume નક્કી રાખે, તેથી level કદી ન વધે.</li><li>Feed pump અને inlet nozzle - મિશ્ર feed ને impeller ના તળિયે લાવે.</li><li>Turbine impeller અને baffles - ફક્ત impeller વંટોળ બનાવે; baffles તેને ખરું mixing બનાવે.</li><li>Jacket કે અંદરની coil - temperature exit ની શરત પર રાખે, જે એક જ શરત reactor જુએ છે.</li><li>Level અને temperature control loops - level ગુમાવતો CSTR પોતાનો residence time ગુમાવે.</li></ul><h4>કાર્યપદ્ધતિ: પગલે પગલે</h4><ol><li>Feed impeller નીચે આવે અને baffles વાળા જથ્થામાં બહાર ફેંકાય.</li><li>Impeller નો એક ફેરો આખું પાત્ર કેટલાક second થી એક મિનિટમાં મિક્સ કરે.</li><li>મિશ્રણ overflow થી જથ્થાની જ રચના સાથે નીકળે.</li><li>લગભગ ત્રણ space times પછી steady state આવે; ત્યાર પછીનું product અચળ.</li><li>Conversion space time નક્કી કરે, તેથી ઓપરેટર flow કે temperature બદલે, level નહીં.</li></ol><h4>Design equation</h4><div class=\"math\"> 1. mole balance on A at steady state: in - out - reaction = 0\n 2. FA0 - FA - (-rA) V = 0\n 3. with FA = FA0(1 - X):   V = FA0 X / (-rA)exit\n 4. dividing by the feed rate:  tau = V/v0 = CA0 X / (-rA)exit\n 5. first order: tau = X/[k(1 - X)]</div><div class=\"math\">first order, X = 0.90: tau = 0.9/(k x 0.1) = 9/k\nPFR for the same duty: tau = ln(10)/k = 2.30/k, so 3.9 times less volume</div><p><b>કેમ સાચું છે.</b> CSTR એ જ reactor છે જે હંમેશા outlet concentration પર કામ કરે, જે system માં સૌથી નીચું concentration છે. ધન order ની પ્રક્રિયા માટે એ સૌથી ધીમો possible rate છે, તેથી જ તેને સૌથી મોટું volume જોઈએ - અને તેથી જ તે નિયંત્રણમાં સૌથી સલામત છે.</p><p><b>જવાબ ચકાસો.</b> X = 0.9 સાથે CSTR ને k tau = 9 જોઈએ જ્યારે PFR ને 2.3; X = 0.5 પર બંને 1 અને 0.69 છે, તેથી CSTR ની સજા ઊંચા conversion પર સૌથી વધુ છે.</p><p><b>સામાન્ય ભૂલ.</b> CSTR ને તેની જ સાથે series માં મૂકીને એ જ volumeની અપેક્ષા રાખવી. બે સરખા CSTR series માં 90 % સુધી k tau = 4.3 માં પહોંચે, 9 ને બદલે - એટલે અડધું volume, તેથી tank ની શ્રેણી સામાન્ય છે.</p>"}, "diagram": "u4_cstr", "syllabus_item": "4.2"}, {"h": {"en": "The tubular (plug flow) reactor: construction and working", "gu": "Tubular (plug flow) reactor: રચના અને કાર્યપદ્ધતિ"}, "body": {"en": "<p>A PFR is a tube. Fluid enters at one end and leaves at the other, and the only mixing is across the tube - none along it. Every element therefore sees the same history, and the concentration falls steadily from inlet to outlet.</p><h4>Construction: what it is made of</h4><ul><li>Tube or a bundle of tubes - gives the length and the volume; no moving parts at all.</li><li>Jacket or shell around the tubes - removes or adds heat along the whole length.</li><li>Inlet distributor and outlet header - spread the feed evenly over all the tubes.</li><li>Baffles in the shell side - force the coolant across the tubes so the heat transfer coefficient stays high.</li><li>Support plates and expansion joint - hold long tubes and let them grow when hot.</li></ul><h4>Working: step by step</h4><ol><li>Feed is pushed through the tube by a pump or a compressor at a steady rate.</li><li>Across any cross-section the fluid is mixed; along the tube it is not, so a slice moves like a piston.</li><li>Reaction starts at the inlet and slows towards the outlet, because the concentration is falling.</li><li>Heat is exchanged along the length, so a PFR is also a heat exchanger - its temperature profile is a design variable.</li><li>All the fluid leaves after the same residence time tau = V/v0.</li></ol><h4>The design equation</h4><div class=\"math\"> 1. mole balance on a slice dV: FA(V) - FA(V + dV) - (-rA) dV = 0\n 2. so dFA/dV = -(-rA), and with FA = FA0(1 - X):\n 3. FA0 dX/dV = -rA   ->   V = FA0 x integral from 0 to X of dX/(-rA)\n 4. first order: V = v0 ln[1/(1 - X)] / k,  i.e. tau = ln[1/(1 - X)]/k</div><div class=\"math\">first order, X = 0.90: tau = 2.303/k\nthe same duty in one CSTR: tau = 9/k</div><table><tr><th>CSTR</th><th>PFR</th></tr><tr><td>mixed: works at the exit concentration</td><td>unmixed: concentration falls along the tube</td></tr><tr><td>large volume at high conversion</td><td>smallest volume for a positive order reaction</td></tr><tr><td>temperature uniform and easy to hold</td><td>temperature profile along the length; hot spots possible</td></tr><tr><td>good for slow reactions, autocatalytic ones and crystallisation</td><td>good for gas phase, high temperature and large scale</td></tr></table><p><b>Why it is true.</b> Plug flow is the best possible arrangement for a positive order reaction: the reactant is kept at its highest concentration for as long as possible, and the integral of the rate is maximised.</p><p><b>Check your answer.</b> At X = 0.99 the PFR needs 4.61/k but the CSTR needs 99/k - a factor of 21. The higher the conversion asked for, the stronger the case for a tube.</p><p><b>Common mistake.</b> Treating a long pipe as a PFR without checking. Axial dispersion, laminar velocity profiles and natural convection all break plug flow; a tube is only a PFR while the dispersion number stays small.</p>", "gu": "<p>PFR એ નળી છે. પ્રવાહી એક છેડેથી આવે અને બીજા છેડેથી નીકળે, અને mixing ફક્ત નળીની પહોળાઈમાં થાય - લંબાઈમાં નહીં. તેથી દરેક element સરખો ઇતિહાસ જુએ, અને concentration inlet થી outlet સુધી સ્થિર રીતે ઘટે.</p><h4>રચના: તે કયા ભાગોથી બનેલું છે</h4><ul><li>નળી કે નળીઓનો bundle - લંબાઈ અને volume આપે; કોઈ હલતો ભાગ નહીં.</li><li>નળીઓ ફરતું jacket કે shell - આખી લંબાઈ પર heat કાઢે કે ઉમેરે.</li><li>Inlet distributor અને outlet header - feed ને બધી નળીઓ પર સરખો વહેંચે.</li><li>Shell બાજુના baffles - coolant ને નળીઓની આડે ફેરવે જેથી heat transfer coefficient ઊંચો રહે.</li><li>Support plates અને expansion joint - લાંબી નળીઓ પકડે અને ગરમ થતાં વધવા દે.</li></ul><h4>કાર્યપદ્ધતિ: પગલે પગલે</h4><ol><li>Feed ને pump કે compressor સ્થિર rate પર નળીમાં ધકેલે.</li><li>કોઈ પણ cross-section માં પ્રવાહી મિક્સ હોય; લંબાઈમાં નહીં, તેથી slice piston ની જેમ આગળ વધે.</li><li>પ્રક્રિયા inlet પર શરૂ થાય અને outlet તરફ ધીમી પડે, કારણ કે concentration ઘટે છે.</li><li>લંબાઈ પર heat ની આપલે થાય, તેથી PFR heat exchanger પણ છે - તેનો temperature profile design નું ચલ છે.</li><li>બધું પ્રવાહી સરખા residence time tau = V/v0 પછી નીકળે.</li></ol><h4>Design equation</h4><div class=\"math\"> 1. mole balance on a slice dV: FA(V) - FA(V + dV) - (-rA) dV = 0\n 2. so dFA/dV = -(-rA), and with FA = FA0(1 - X):\n 3. FA0 dX/dV = -rA   ->   V = FA0 x integral from 0 to X of dX/(-rA)\n 4. first order: V = v0 ln[1/(1 - X)] / k,  i.e. tau = ln[1/(1 - X)]/k</div><div class=\"math\">first order, X = 0.90: tau = 2.303/k\nthe same duty in one CSTR: tau = 9/k</div><table><tr><th>CSTR</th><th>PFR</th></tr><tr><td>મિશ્ર: exit concentration પર કામ કરે</td><td>અમિશ્ર: concentration નળીમાં ઘટે</td></tr><tr><td>ઊંચા conversion પર મોટું volume</td><td>ધન order પ્રક્રિયા માટે સૌથી નાનું volume</td></tr><tr><td>temperature સરખું અને પકડવું સહેલું</td><td>લંબાઈ પર temperature profile; hot spots શક્ય</td></tr><tr><td>ધીમી, autocatalytic અને crystallisation માટે સારું</td><td>gas phase, ઊંચા temperature અને મોટા scale માટે સારું</td></tr></table><p><b>કેમ સાચું છે.</b> ધન order પ્રક્રિયા માટે plug flow સૌથી સારી ગોઠવણી છે: reactant પોતાના સૌથી ઊંચા concentration પર શક્ય તેટલો સમય રહે, અને rate નો integral મહત્તમ થાય.</p><p><b>જવાબ ચકાસો.</b> X = 0.99 પર PFR ને 4.61/k જોઈએ પણ CSTR ને 99/k - 21 ગણો ફરક. જેટલું ઊંચું conversion માંગો તેટલો નળીનો પક્ષ મજબૂત.</p><p><b>સામાન્ય ભૂલ.</b> લાંબી પાઇપને ચકાસ્યા વગર PFR ગણવી. Axial dispersion, laminar velocity profile અને natural convection plug flow તોડે છે; dispersion number નાનો રહે ત્યાં સુધી જ નળી PFR છે.</p>"}, "diagram": "u4_pfr", "syllabus_item": "4.2"}]}, {"title": {"en": "4.2 Packed beds: the fixed bed and the fluidised bed", "gu": "4.2 Packed beds: fixed bed અને fluidised bed"}, "items": [{"h": {"en": "The fixed bed reactor: construction and working", "gu": "Fixed bed reactor: રચના અને કાર્યપદ્ધતિ"}, "body": {"en": "<h4>Construction: what it is made of</h4><ul><li>Shell - a vertical vessel, usually refractory-lined for high temperature service.</li><li>Inlet distributor - spreads the gas over the whole cross-section so no channel forms.</li><li>Catalyst bed - pellets or rings of 3-10 mm, held between inert layers at top and bottom.</li><li>Support grid and support balls - carry the weight of the bed without blocking the flow.</li><li>Jacket, coils or a quench line - take away the heat of reaction; the alternative is a bed of several stages.</li><li>Thermocouples in a well - the only way to see the hot spot forming.</li></ul><h4>Working: step by step</h4><ol><li>Gas enters at the top, passes through the distributor and spreads over the bed.</li><li>It threads through the voids between pellets; the reaction happens on the wetted pellet surface.</li><li>The gas leaves at the bottom through the support grid, cooler or hotter than it entered.</li><li>Pressure drop rises as the bed fouls; it is the operating signal that the bed must be cleaned or replaced.</li><li>Regeneration or replacement needs the unit shut down - the fixed bed's one big disadvantage.</li></ol><h4>The design relations</h4><div class=\"math\"> 1. rate per unit mass of catalyst: -rA' = -rA/rho_b\n 2. design: W = FA0 x integral from 0 to X of dX/(-rA')\n 3. space velocity: WHSV = mass feed per hour / mass of catalyst\n 4. void fraction: eps = void volume / bed volume, so bed volume = W/(rho_p (1 - eps))</div><div class=\"math\">Ergun for the pressure drop through a packed bed:\ndP/L = 150 mu u (1-eps)^2/(eps^3 dp^2) + 1.75 rho u^2 (1-eps)/(eps^3 dp)</div><table><tr><th>Strengths</th><th>Weaknesses</th></tr><tr><td>big catalyst area in a small volume, no moving parts</td><td>pressure drop, and it grows as the bed fouls</td></tr><tr><td>plug flow gives the highest conversion per unit volume</td><td>hot spots and possible runaway near the inlet</td></tr><tr><td>simple, well understood, easy to scale up in diameter</td><td>catalyst cannot be changed while running; gas channelling</td></tr></table><p><b>Why it is true.</b> A fixed bed is a PFR as seen by the gas, with the catalyst counted in kilograms instead of cubic metres. Every PFR design equation therefore applies, with -rA' and W in place of -rA and V.</p><p><b>Check your answer.</b> A bed of 250 kg with a 500 kg/h feed runs at WHSV = 2 h-1, i.e. a space time of 0.5 h. If the same duty needed WHSV = 1, the bed would have to be 500 kg.</p><p><b>Common mistake.</b> Using the bed volume as if it were all catalyst. The gas only passes through the voids, so eps (usually 0.35-0.45) decides the actual residence time and the pressure drop.</p>", "gu": "<h4>રચના: તે કયા ભાગોથી બનેલું છે</h4><ul><li>Shell - ઊભું પાત્ર, ઊંચા temperature માટે સામાન્ય રીતે refractory લાઇનિંગ વાળું.</li><li>Inlet distributor - gas ને આખા cross-section પર વહેંચે જેથી channel ન બને.</li><li>Catalyst bed - 3-10 mm ના pellets કે rings, ઉપર-નીચે inert સ્તર વચ્ચે.</li><li>Support grid અને support balls - flow રોક્યા વગર bed નું વજન ઉપાડે.</li><li>Jacket, coils કે quench line - પ્રક્રિયાની heat કાઢે; બીજો રસ્તો કેટલાક તબક્કાનો bed છે.</li><li>Well માં thermocouples - બનતો hot spot જોવાનો એક જ રસ્તો.</li></ul><h4>કાર્યપદ્ધતિ: પગલે પગલે</h4><ol><li>Gas ઉપરથી આવે, distributor માંથી પસાર થાય અને bed પર ફેલાય.</li><li>તે pellets વચ્ચેના voids માંથી પસાર થાય; પ્રક્રિયા ભીની pellet સપાટી પર થાય.</li><li>Gas તળિયે support grid થી નીકળે, આવ્યું તેના કરતાં ઠંડું કે ગરમ.</li><li>Bed ગંદું થાય તેમ pressure drop વધે; એ જ સંકેત કે bed સાફ કે બદલવો પડશે.</li><li>Regeneration કે replacement માટે unit બંધ કરવું પડે - fixed bed ની એક મોટી ખામી.</li></ol><h4>Design ના સંબંધો</h4><div class=\"math\"> 1. rate per unit mass of catalyst: -rA' = -rA/rho_b\n 2. design: W = FA0 x integral from 0 to X of dX/(-rA')\n 3. space velocity: WHSV = mass feed per hour / mass of catalyst\n 4. void fraction: eps = void volume / bed volume, so bed volume = W/(rho_p (1 - eps))</div><div class=\"math\">Ergun for the pressure drop through a packed bed:\ndP/L = 150 mu u (1-eps)^2/(eps^3 dp^2) + 1.75 rho u^2 (1-eps)/(eps^3 dp)</div><table><tr><th>તાકાત</th><th>નબળાઈ</th></tr><tr><td>નાના volume માં મોટું catalyst area, હલતો ભાગ નહીં</td><td>pressure drop, અને bed ગંદું થાય તેમ વધે</td></tr><tr><td>plug flow પ્રતિ volume સૌથી ઊંચું conversion આપે</td><td>inlet પાસે hot spots અને runaway શક્ય</td></tr><tr><td>સાદું, સારી રીતે સમજાયેલું, વ્યાસમાં scale up સહેલું</td><td>ચાલુ સ્થિતિમાં catalyst બદલાય નહીં; gas channelling</td></tr></table><p><b>કેમ સાચું છે.</b> Fixed bed એ gas ના દૃષ્ટિકોણથી PFR છે, જેમાં catalyst ઘન મીટરને બદલે કિલોગ્રામમાં ગણાય. તેથી દરેક PFR design equation લાગુ પડે, -rA અને V ની જગ્યાએ -rA' અને W સાથે.</p><p><b>જવાબ ચકાસો.</b> 250 kg નો bed અને 500 kg/h feed સાથે WHSV = 2 h-1, એટલે space time 0.5 h. એ જ કામ માટે WHSV = 1 જોઈએ તો bed 500 kg નો કરવો પડે.</p><p><b>સામાન્ય ભૂલ.</b> આખા bed volume ને catalyst ગણવું. Gas ફક્ત voids માંથી પસાર થાય, તેથી eps (સામાન્ય 0.35-0.45) ખરો residence time અને pressure drop નક્કી કરે.</p>"}, "diagram": "u4_fixed", "syllabus_item": "4.2"}, {"h": {"en": "The fluidised bed reactor: construction and working", "gu": "Fluidised bed reactor: રચના અને કાર્યપદ્ધતિ"}, "body": {"en": "<p>If the gas is pushed through a bed of particles fast enough, the particles are lifted and the bed behaves like a boiling liquid. That single change - a bed that flows - solves the fixed bed's heat problem and creates a new set of its own.</p><h4>Construction: what it is made of</h4><ul><li>Distributor plate (tuyere or perforated grid) - the single most important part: it must give every hole the same gas flow.</li><li>Dense bed - 0.3 to 1 m of catalyst powder (50-150 micron), bubbling like a liquid.</li><li>Freeboard - the empty space above the bed where the particles fall back.</li><li>Cyclones and diplegs - catch the entrained catalyst and return it to the bed; without them the bed is lost in a day.</li><li>Internal coils or a cooled wall - take the heat out of a bed that mixes perfectly.</li><li>Catalyst withdrawal and make-up lines - the bed can be refreshed while the unit runs.</li></ul><h4>Working: step by step</h4><ol><li>Gas enters the windbox below the distributor and is spread evenly.</li><li>Above the minimum fluidisation velocity the particles lift and the bed expands.</li><li>Extra gas passes through as bubbles that rise, grow and burst at the surface.</li><li>The dense phase behaves like a CSTR (strong back-mixing); the bubbles carry gas through almost unreacted.</li><li>Gas leaves through the cyclones, which return the fines to the bed.</li></ol><h4>The relations that decide the design</h4><div class=\"math\"> 1. minimum fluidisation: weight of bed = drag at Umf\n 2. Umf ~ dp^2 (rho_p - rho_g) g / (1650 mu)      for small particles\n 3. the bed is fluidised when U > Umf; bubbling starts near 2-3 Umf\n 4. bed height from the solids: W = rho_p A H (1 - eps)</div><div class=\"math\">dp = 100 micron, rho_p = 2500 kg/m3, rho_g = 1.2, mu = 1.8e-5 Pa s:\nUmf = (1e-4)^2 x 2499 x 9.81/(1650 x 1.8e-5) = 8.3e-3 m/s\nso any gas velocity above about 8 mm/s fluidises this powder</div><table><tr><th>Strengths</th><th>Weaknesses</th></tr><tr><td>uniform temperature: no hot spot, so strong exotherms are safe</td><td>gas back-mixes like a CSTR, so conversion per pass is lower</td></tr><tr><td>catalyst can be withdrawn and replaced while running</td><td>attrition of the particles, and the fines must be caught</td></tr><tr><td>high heat transfer to coils; handles fine, cheap catalyst</td><td>erosion, scale-up difficulty, and a distributor that must not block</td></tr></table><p><b>Why it is true.</b> Fluidisation trades plug flow for perfect mixing of the solids and near-perfect mixing of the gas. That is a bad trade for conversion and a very good trade for temperature control, which is why catalytic crackers use it and ammonia synthesis does not.</p><p><b>Check your answer.</b> At 3 Umf the gas spends about a third of its time as bubbles; if the reaction is fast, much of the conversion happens in the dense phase and the bubbles are wasted - which is why internals are fitted to break them.</p><p><b>Common mistake.</b> Designing a fluidised bed from the reactor equation alone. The gas that bypasses in bubbles never meets the catalyst, so the two-phase model - not the simple CSTR equation - is what the design is checked against.</p>", "gu": "<p>જો gas ને particles ના bed માંથી પૂરતી ઝડપે ધકેલવામાં આવે તો particles ઊંચકાય અને bed ઉકળતા પ્રવાહી જેવો વર્તે. એ એક ફેરફાર - વહેતો bed - fixed bed ની heat સમસ્યા ઉકેલે છે અને પોતાની નવી સમસ્યાઓ ઊભી કરે છે.</p><h4>રચના: તે કયા ભાગોથી બનેલું છે</h4><ul><li>Distributor plate - સૌથી અગત્યનો ભાગ: દરેક છિદ્રને સરખો gas flow આપવો પડે.</li><li>Dense bed - 0.3 થી 1 m catalyst પાવડર (50-150 micron), પ્રવાહીની જેમ ઉકળતો.</li><li>Freeboard - bed ઉપરની ખાલી જગ્યા જ્યાં particles પાછા પડે.</li><li>Cyclones અને diplegs - ઊડી જતો catalyst પકડીને bed માં પાછો મોકલે; તેમના વગર bed એક દિવસમાં ખતમ.</li><li>અંદરની coils કે ઠંડી દીવાલ - સંપૂર્ણ મિશ્ર bed માંથી heat કાઢે.</li><li>Catalyst કાઢવાની અને ભરવાની લાઇન - unit ચાલુ હોય ત્યારે bed તાજો થઈ શકે.</li></ul><h4>કાર્યપદ્ધતિ: પગલે પગલે</h4><ol><li>Gas distributor નીચેના windbox માં આવે અને સરખી રીતે ફેલાય.</li><li>Minimum fluidisation velocity ઉપર particles ઊંચકાય અને bed ફેલાય.</li><li>વધારાનો gas bubbles તરીકે પસાર થાય, જે ઉપર જાય, મોટા થાય અને સપાટી પર ફૂટે.</li><li>ઘન phase CSTR જેવો વર્તે (જોરદાર back-mixing); bubbles gas ને લગભગ પ્રક્રિયા વગર પસાર કરે.</li><li>Gas cyclones થી નીકળે, જે fines ને bed માં પાછા આપે.</li></ol><h4>Design નક્કી કરતા સંબંધો</h4><div class=\"math\"> 1. minimum fluidisation: weight of bed = drag at Umf\n 2. Umf ~ dp^2 (rho_p - rho_g) g / (1650 mu)      for small particles\n 3. the bed is fluidised when U > Umf; bubbling starts near 2-3 Umf\n 4. bed height from the solids: W = rho_p A H (1 - eps)</div><div class=\"math\">dp = 100 micron, rho_p = 2500 kg/m3, rho_g = 1.2, mu = 1.8e-5 Pa s:\nUmf = (1e-4)^2 x 2499 x 9.81/(1650 x 1.8e-5) = 8.3e-3 m/s\nso any gas velocity above about 8 mm/s fluidises this powder</div><table><tr><th>તાકાત</th><th>નબળાઈ</th></tr><tr><td>સરખું temperature: hot spot નહીં, તેથી તીવ્ર exotherm સલામત</td><td>gas CSTR ની જેમ back-mix થાય, તેથી પ્રતિ pass conversion ઓછું</td></tr><tr><td>ચાલુ state માં catalyst કાઢી બદલી શકાય</td><td>particles ઘસાય, અને fines પકડવા પડે</td></tr><tr><td>coils સુધી ઊંચો heat transfer; બારીક, સસ્તો catalyst ચાલે</td><td>erosion, scale-up અઘરું, અને ન બંધાય તેવો distributor</td></tr></table><p><b>કેમ સાચું છે.</b> Fluidisation plug flow ને ઘન પદાર્થના સંપૂર્ણ mixing અને gas ના લગભગ સંપૂર્ણ mixing સાથે બદલે. એ conversion માટે ખરાબ સોદો અને temperature control માટે ખૂબ સારો સોદો છે, તેથી catalytic cracker તે વાપરે અને ammonia synthesis નહીં.</p><p><b>જવાબ ચકાસો.</b> 3 Umf પર gas નો લગભગ ત્રીજો ભાગ bubbles તરીકે જાય; પ્રક્રિયા ઝડપી હોય તો ઘણું conversion ઘન phase માં થાય અને bubbles વેડફાય - તેથી તેમને તોડવા internals બેસાડાય છે.</p><p><b>સામાન્ય ભૂલ.</b> ફક્ત reactor equation પરથી fluidised bed design કરવું. Bubbles માંથી પસાર થતો gas catalyst ને મળતો જ નથી, તેથી design two-phase model સામે ચકાસાય છે, સાદા CSTR equation સામે નહીં.</p>"}, "diagram": "u4_fluidised", "syllabus_item": "4.2"}]}, {"title": {"en": "4.3 Multiphase reactors: gas, liquid and solid together", "gu": "4.3 Multiphase reactors: gas, liquid અને solid સાથે"}, "items": [{"h": {"en": "Slurry and bubble column reactors", "gu": "Slurry અને bubble column reactors"}, "body": {"en": "<p>When a gas must react with a liquid, or with a solid catalyst suspended in a liquid, the contact area between the phases becomes the design problem. Two of the simplest answers are the bubble column - gas bubbled through a liquid with no moving parts - and the slurry reactor - the same, plus a stirrer to keep the solid in suspension.</p><h4>Construction: what it is made of</h4><ul><li>Sparger or distributor at the bottom - makes many small bubbles, because small bubbles mean more interfacial area.</li><li>Column or vessel - the liquid is the continuous phase and holds the gas long enough for it to dissolve.</li><li>Stirrer (slurry reactor only) - keeps the fine catalyst in suspension and breaks the bubbles.</li><li>Jacket or coil - these reactions are usually exothermic hydrogenations or oxidations.</li><li>Settler, filter or cyclone on the outlet - keeps the catalyst in the reactor.</li></ul><h4>Working: step by step</h4><ol><li>Gas enters through the sparger and rises as a swarm of bubbles.</li><li>It dissolves into the liquid film; the dissolved gas then diffuses to the catalyst.</li><li>Reaction takes place on or in the solid; the product leaves with the liquid.</li><li>The slowest of the three steps - dissolution, diffusion, reaction - sets the overall rate.</li></ol><h4>The rate when mass transfer interferes</h4><div class=\"math\"> 1. gas film and liquid film resistances in series:\n 2. 1/K = 1/(kG a) + 1/(kL a H) + 1/(k' a H)\n 3. if the reaction is fast, kL a controls: rate = kL a (CA* - CA)\n 4. if it is slow, the kinetics control and the reactor is a well-mixed vessel</div><table><tr><th>Reactor</th><th>Moving parts</th><th>Typical duty</th><th>Main worry</th></tr><tr><td>Bubble column</td><td>none</td><td>oxidation, fermentation, ozonation</td><td>bubble coalescence and back-mixing</td></tr><tr><td>Slurry reactor</td><td>stirrer</td><td>hydrogenation with a fine catalyst</td><td>catalyst attrition and separation</td></tr></table><p><b>Why it is true.</b> A slurry reactor gives up plug flow and gains a uniform temperature and a catalyst that can be very fine - which is what a fast, exothermic three-phase reaction needs.</p><p><b>Check your answer.</b> If kL a is doubled by better sparging, a mass-transfer-limited reaction doubles its rate while a kinetically limited one does not move at all.</p><p><b>Common mistake.</b> Treating a bubble column as a CSTR of liquid. Gas hold-up can be 10-20 % of the volume, so the liquid residence time is shorter than V/vL suggests.</p>", "gu": "<p>જ્યારે gas ને પ્રવાહી સાથે, કે પ્રવાહીમાં તરતા ઘન catalyst સાથે પ્રક્રિયા કરવી હોય ત્યારે phases વચ્ચેનું contact area design ની સમસ્યા બને. બે સાદા જવાબ છે bubble column - ન હલતા ભાગ સાથે પ્રવાહીમાં gas ના bubbles - અને slurry reactor - એ જ, પણ ઘનને તરતો રાખવા stirrer સાથે.</p><h4>રચના: તે કયા ભાગોથી બનેલું છે</h4><ul><li>તળિયે sparger કે distributor - ઘણા નાના bubbles બનાવે, કારણ કે નાના bubbles વધુ interfacial area આપે.</li><li>Column કે પાત્ર - પ્રવાહી સતત phase છે અને gas ને ઓગળવા પૂરતો સમય રોકે.</li><li>Stirrer (ફક્ત slurry reactor) - બારીક catalyst તરતો રાખે અને bubbles તોડે.</li><li>Jacket કે coil - આ પ્રક્રિયાઓ સામાન્ય રીતે exothermic hydrogenation કે oxidation હોય.</li><li>Outlet પર settler, filter કે cyclone - catalyst ને reactor માં રાખે.</li></ul><h4>કાર્યપદ્ધતિ: પગલે પગલે</h4><ol><li>Gas sparger થી આવે અને bubbles ના ઝુંડ તરીકે ઉપર જાય.</li><li>તે પ્રવાહીના પડમાં ઓગળે; ઓગળેલો gas પછી catalyst સુધી ફેલાય.</li><li>પ્રક્રિયા ઘન પર કે અંદર થાય; product પ્રવાહી સાથે નીકળે.</li><li>ત્રણ પૈકી સૌથી ધીમું પગલું - ઓગળવું, ફેલાવો, પ્રક્રિયા - કુલ rate નક્કી કરે.</li></ol><h4>જ્યારે mass transfer વચ્ચે આવે ત્યારે rate</h4><div class=\"math\"> 1. gas film and liquid film resistances in series:\n 2. 1/K = 1/(kG a) + 1/(kL a H) + 1/(k' a H)\n 3. if the reaction is fast, kL a controls: rate = kL a (CA* - CA)\n 4. if it is slow, the kinetics control and the reactor is a well-mixed vessel</div><table><tr><th>Reactor</th><th>હલતા ભાગ</th><th>સામાન્ય કામ</th><th>મુખ્ય ચિંતા</th></tr><tr><td>Bubble column</td><td>કંઈ નહીં</td><td>oxidation, fermentation, ozonation</td><td>bubble જોડાવું અને back-mixing</td></tr><tr><td>Slurry reactor</td><td>stirrer</td><td>બારીક catalyst સાથે hydrogenation</td><td>catalyst ઘસાવું અને અલગ કરવું</td></tr></table><p><b>કેમ સાચું છે.</b> Slurry reactor plug flow ગુમાવે અને સરખું temperature તથા ખૂબ બારીક catalyst મેળવે - જે ઝડપી, exothermic three-phase પ્રક્રિયાને જોઈએ.</p><p><b>જવાબ ચકાસો.</b> સારા sparging થી kL a બમણું થાય તો mass-transfer-limited પ્રક્રિયાનો rate બમણો થાય જ્યારે kinetically limited પ્રક્રિયા જરાય ન બદલાય.</p><p><b>સામાન્ય ભૂલ.</b> Bubble column ને પ્રવાહીના CSTR ગણવું. Gas hold-up volume ના 10-20 % હોઈ શકે, તેથી પ્રવાહીનો residence time V/vL કહે તેના કરતાં ટૂંકો હોય.</p>"}, "diagram": "u4_slurry", "syllabus_item": "4.3"}, {"h": {"en": "Spray tower and trickle bed", "gu": "Spray tower અને trickle bed"}, "body": {"en": "<p>The other two multiphase arrangements put the phases in contact in opposite ways: in a spray tower the liquid is broken into drops, in a trickle bed the liquid is spread as a film over a fixed packing.</p><h4>Construction: what it is made of</h4><ul><li>Spray tower: nozzle or atomiser at the top - makes drops of 100-1000 micron, and the drop size sets the area.</li><li>Spray tower: empty shell with a gas inlet at the bottom - counter-current, no packing to foul or block.</li><li>Spray tower: liquid outlet and pump - the liquid is recirculated many times.</li><li>Trickle bed: liquid distributor tray above the packing, drilled with many holes.</li><li>Trickle bed: fixed bed of catalyst pellets, with gas and liquid both flowing down.</li><li>Trickle bed: support grid, gas outlet at the bottom and liquid draw-off, so the catalyst stays wetted and in place.</li></ul><h4>Working: step by step</h4><ol><li>Spray tower: liquid is pumped to the nozzle and falls as a spray against the rising gas.</li><li>Spray tower: the gas is absorbed into the drops; the liquid is collected at the bottom and recycled.</li><li>Trickle bed: liquid trickles down as a thin film over the pellets while gas flows down (or up) through the same voids.</li><li>Trickle bed: the reaction happens on the wetted catalyst, so the liquid film thickness controls the rate.</li><li>Both: pressure drop and maldistribution are the practical limits, and a distributor that wets the whole cross-section is essential.</li></ol><table><tr><th>Reactor</th><th>Contact</th><th>Best for</th></tr><tr><td>Spray tower</td><td>drops falling through gas</td><td>absorption, gas cooling, fast gas-liquid reactions</td></tr><tr><td>Trickle bed</td><td>liquid film on a fixed catalyst</td><td>hydrotreating, hydrogenation, slow three-phase reactions</td></tr><tr><td>Slurry</td><td>bubbles in a stirred slurry</td><td>fine catalyst, uniform temperature</td></tr><tr><td>Bubble column</td><td>bubbles in a liquid</td><td>large volumes, no maintenance</td></tr></table><div class=\"math\">area per unit volume: a = 6 eps_g/d_b   for bubbles,   6 eps_d/d_p   for drops\ncontact time: hold-up / flow, so a tall column buys time and a spray buys area</div><p><b>Why it is true.</b> The four multiphase reactors differ only in which phase is dispersed: drops, bubbles or a film. Once that choice is made, the area per unit volume and the residence time follow, and with them the size of the vessel.</p><p><b>Check your answer.</b> A spray tower has a large area but a tiny liquid hold-up, so it suits fast absorption; a trickle bed has a large area and a long contact time, so it suits slow reactions.</p><p><b>Common mistake.</b> Choosing a trickle bed for a reaction that produces a solid. The packing blinds, the pressure drop climbs and the run ends in a shutdown.</p>", "gu": "<p>બાકીની બે multiphase ગોઠવણી phasesને વિરુદ્ધ રીતે સંપર્કમાં લાવે: spray tower માં પ્રવાહી ટીપાંમાં તૂટે, trickle bed માં પ્રવાહી સ્થિર packing પર પડ તરીકે ફેલાય.</p><h4>રચના: તે કયા ભાગોથી બનેલું છે</h4><ul><li>Spray tower: ઉપર nozzle કે atomiser - 100-1000 micron ના ટીપાં બનાવે, અને ટીપાંનું size જ area નક્કી કરે.</li><li>Spray tower: તળિયે gas inlet વાળું ખાલી પાત્ર - counter-current, ગંદું થાય કે બંધાય તેવું packing નહીં.</li><li>Spray tower: પ્રવાહીનું outlet અને pump - પ્રવાહી ઘણી વાર recirculate થાય.</li><li>Trickle bed: packing ઉપર liquid distributor tray, ઘણા છિદ્રો સાથે.</li><li>Trickle bed: catalyst pellets નો fixed bed, gas અને પ્રવાહી બંને નીચે વહે.</li><li>Trickle bed: support grid, તળિયે gas outlet અને liquid draw-off, જેથી catalyst ભીનો અને જગ્યાએ રહે.</li></ul><h4>કાર્યપદ્ધતિ: પગલે પગલે</h4><ol><li>Spray tower: પ્રવાહી nozzle સુધી pump થાય અને ચઢતા gas સામે spray તરીકે પડે.</li><li>Spray tower: gas ટીપાંમાં શોષાય; પ્રવાહી તળિયે ભેગું થાય અને ફરી વપરાય.</li><li>Trickle bed: પ્રવાહી pellets પર પાતળા પડ તરીકે નીચે ટપકે જ્યારે gas એ જ voids માંથી નીચે (કે ઉપર) વહે.</li><li>Trickle bed: પ્રક્રિયા ભીની catalyst પર થાય, તેથી પ્રવાહી પડની જાડાઈ rate નક્કી કરે.</li><li>બંને: pressure drop અને ખરાબ distribution વ્યવહારની મર્યાદા છે, અને આખું cross-section ભીનું કરતો distributor જરૂરી છે.</li></ol><table><tr><th>Reactor</th><th>સંપર્ક</th><th>કોના માટે સારું</th></tr><tr><td>Spray tower</td><td>gas માંથી પડતાં ટીપાં</td><td>absorption, gas ઠંડું કરવું, ઝડપી gas-liquid પ્રક્રિયા</td></tr><tr><td>Trickle bed</td><td>સ્થિર catalyst પર પ્રવાહી પડ</td><td>hydrotreating, hydrogenation, ધીમી three-phase પ્રક્રિયા</td></tr><tr><td>Slurry</td><td>હલાવેલા slurry માં bubbles</td><td>બારીક catalyst, સરખું temperature</td></tr><tr><td>Bubble column</td><td>પ્રવાહીમાં bubbles</td><td>મોટા volumes, જાળવણી વગર</td></tr></table><div class=\"math\">area per unit volume: a = 6 eps_g/d_b   for bubbles,   6 eps_d/d_p   for drops\ncontact time: hold-up / flow, so a tall column buys time and a spray buys area</div><p><b>કેમ સાચું છે.</b> ચાર multiphase reactors માં ફરક ફક્ત એટલો છે કે કયો phase વેરાય છે: ટીપાં, bubbles કે પડ. એ પસંદગી થાય પછી પ્રતિ volume area અને residence time મળે, અને તેમની સાથે પાત્રનું size.</p><p><b>જવાબ ચકાસો.</b> Spray tower માં મોટું area પણ ખૂબ ઓછું liquid hold-up છે, તેથી ઝડપી absorption માટે યોગ્ય; trickle bed માં મોટું area અને લાંબો contact time છે, તેથી ધીમી પ્રક્રિયા માટે.</p><p><b>સામાન્ય ભૂલ.</b> ઘન પદાર્થ બનાવતી પ્રક્રિયા માટે trickle bed પસંદ કરવો. Packing બંધાય, pressure drop વધે અને રન shutdown પર પૂરો થાય.</p>"}, "diagram": "u4_spray", "syllabus_item": "4.3"}]}, {"title": {"en": "4.4 Solved Numericals, Step by Step", "gu": "4.4 ઉકેલેલા દાખલા, પગલે પગલે"}, "items": [{"h": {"en": "Batch time and daily production", "gu": "Batch time અને રોજનું ઉત્પાદન"}, "body": {"en": "<h4>Question (6 marks)</h4><p>A 1.0 m3 batch reactor is charged with CA0 = 2.0 kmol/m3 of A. The reaction is first order with k = 0.020 min-1 and is run to 95 % conversion. Find the reaction time, the cycle time with 30 min of filling, heating and emptying, and the daily production of A reacted.</p><h4>Step 1 - the reaction time</h4><div class=\"math\">t = (1/k) ln[1/(1 - X)] = (1/0.020) ln(1/0.05)\n  = 50 x 2.996 = 149.8 min</div><h4>Step 2 - the cycle</h4><div class=\"math\">cycle = 149.8 + 30 = 179.8 min, so 1440/179.8 = 8 batches a day</div><h4>Step 3 - production</h4><div class=\"math\">A charged per batch = CA0 V = 2.0 x 1.0 = 2.0 kmol\nA reacted per batch = 0.95 x 2.0 = 1.90 kmol\nper day = 8 x 1.90 = 15.2 kmol</div><div class=\"eq\">t = 150 min,  8 batches/day,  15.2 kmol of A reacted per day</div><p>The reactor is only producing for 150 min out of every 180, which is the real cost of a batch plant: about one sixth of the day is filling, heating and emptying.</p><p><b>Check your answer.</b> exp(-0.020 x 149.8) = exp(-3.00) = 0.050, so 5 % of A is left.</p><p><b>Common mistake.</b> Quoting the reactor volume without the freeboard. A vessel is never filled more than 70-80 % full, so a 1.0 m3 charge needs a 1.3 m3 vessel.</p>", "gu": "<h4>પ્રશ્ન (6 marks)</h4><p>1.0 m3 ના batch reactor માં CA0 = 2.0 kmol/m3 A ભરાય છે. પ્રક્રિયા first order છે, k = 0.020 min-1, અને 95 % conversion સુધી ચલાવાય છે. Reaction time, ભરવા-ગરમ કરવા-ખાલી કરવાના 30 min સાથે cycle time, અને રોજ પ્રક્રિયા થતા A નું ઉત્પાદન શોધો.</p><h4>પગલું 1 - reaction time</h4><div class=\"math\">t = (1/k) ln[1/(1 - X)] = (1/0.020) ln(1/0.05)\n  = 50 x 2.996 = 149.8 min</div><h4>પગલું 2 - cycle</h4><div class=\"math\">cycle = 149.8 + 30 = 179.8 min, so 1440/179.8 = 8 batches a day</div><h4>પગલું 3 - ઉત્પાદન</h4><div class=\"math\">A charged per batch = CA0 V = 2.0 x 1.0 = 2.0 kmol\nA reacted per batch = 0.95 x 2.0 = 1.90 kmol\nper day = 8 x 1.90 = 15.2 kmol</div><div class=\"eq\">t = 150 min,  8 batches/day,  15.2 kmol of A reacted per day</div><p>180 માંથી ફક્ત 150 min reactor ઉત્પાદન કરે છે, જે batch plant ની ખરી કિંમત છે: દિવસનો લગભગ છઠ્ઠો ભાગ ભરવા, ગરમ કરવા અને ખાલી કરવામાં જાય.</p><p><b>જવાબ ચકાસો.</b> exp(-0.020 x 149.8) = exp(-3.00) = 0.050, તેથી 5 % A બાકી.</p><p><b>સામાન્ય ભૂલ.</b> Freeboard વગર reactor નું volume લખવું. પાત્ર 70-80 % થી વધુ ભરાતું નથી, તેથી 1.0 m3 ચાર્જ માટે 1.3 m3 પાત્ર જોઈએ.</p>"}}, {"h": {"en": "CSTR volume for a first order reaction", "gu": "First order પ્રક્રિયા માટે CSTR નું volume"}, "body": {"en": "<h4>Question (7 marks)</h4><p>A first order reaction with k = 0.25 h-1 must be carried out to 80 % conversion in a CSTR. The feed rate is 7.2 m3/h. Find the space time and the reactor volume.</p><h4>Step 1 - the space time</h4><div class=\"math\">tau = X/[k(1 - X)] = 0.80/(0.25 x 0.20)\n    = 0.80/0.050 = 16 h</div><h4>Step 2 - the volume</h4><div class=\"math\">tau = V/v0  ->  V = v0 tau = 7.2 x 16 = 115.2 m3</div><div class=\"eq\">tau = 16 h,  V = 115 m3</div><h4>Step 3 - what a PFR would need</h4><div class=\"math\">tau_PFR = ln[1/(1 - X)]/k = ln(5)/0.25 = 1.609/0.25 = 6.44 h\nV_PFR = 7.2 x 6.44 = 46.4 m3</div><p>The CSTR needs 2.5 times the volume of a PFR for the same job at 80 % conversion. The ratio grows with conversion: at 95 % it would be 3.8, at 99 % about 5.</p><p><b>Check your answer.</b> Put the numbers back: -rA at the exit = k CA0(1-X) = 0.25 x CA0 x 0.2 = 0.05 CA0, and V = v0 CA0 X/(-rA) = 7.2 CA0 x 0.8/(0.05 CA0) = 115 m3.</p><p><b>Common mistake.</b> Using the batch time in place of the space time. For a CSTR the space time is the volume divided by the feed rate; it equals the batch time only in the limit of zero conversion.</p>", "gu": "<h4>પ્રશ્ન (7 marks)</h4><p>k = 0.25 h-1 વાળી first order પ્રક્રિયા CSTR માં 80 % conversion સુધી કરવી છે. Feed rate 7.2 m3/h છે. Space time અને reactor નું volume શોધો.</p><h4>પગલું 1 - space time</h4><div class=\"math\">tau = X/[k(1 - X)] = 0.80/(0.25 x 0.20)\n    = 0.80/0.050 = 16 h</div><h4>પગલું 2 - volume</h4><div class=\"math\">tau = V/v0  ->  V = v0 tau = 7.2 x 16 = 115.2 m3</div><div class=\"eq\">tau = 16 h,  V = 115 m3</div><h4>પગલું 3 - PFR ને કેટલું જોઈએ</h4><div class=\"math\">tau_PFR = ln[1/(1 - X)]/k = ln(5)/0.25 = 1.609/0.25 = 6.44 h\nV_PFR = 7.2 x 6.44 = 46.4 m3</div><p>80 % conversion પર એ જ કામ માટે CSTR ને PFR કરતાં 2.5 ગણું volume જોઈએ. ગુણોત્તર conversion સાથે વધે: 95 % પર 3.8, 99 % પર લગભગ 5.</p><p><b>જવાબ ચકાસો.</b> આંકડા પાછા મૂકો: exit પર -rA = k CA0(1-X) = 0.25 x CA0 x 0.2 = 0.05 CA0, અને V = v0 CA0 X/(-rA) = 7.2 CA0 x 0.8/(0.05 CA0) = 115 m3.</p><p><b>સામાન્ય ભૂલ.</b> Space time ની જગ્યાએ batch time વાપરવો. CSTR માટે space time એ volume ભાગ્યું feed rate છે; તે batch time સાથે ફક્ત શૂન્ય conversion ની મર્યાદામાં સરખો થાય.</p>"}}, {"h": {"en": "Two CSTRs in series against one", "gu": "એક CSTR સામે series માં બે CSTR"}, "body": {"en": "<h4>Question (8 marks)</h4><p>The same feed (v0 = 7.2 m3/h, k = 0.25 h-1, X = 0.80) is now to be treated in two equal CSTRs in series. Find the volume of each and compare the total with the single tank of the previous problem.</p><h4>Step 1 - the relation for n equal tanks</h4><div class=\"math\">1 - X = 1/(1 + k tau)^n\n0.20 = 1/(1 + k tau)^2  ->  1 + k tau = 2.236\nk tau = 1.236  ->  tau = 1.236/0.25 = 4.94 h</div><h4>Step 2 - the volume of each tank</h4><div class=\"math\">V1 = V2 = v0 tau = 7.2 x 4.94 = 35.6 m3\ntotal = 71.2 m3</div><div class=\"eq\">each tank 36 m3, total 71 m3 against 115 m3 for one tank</div><p>Two tanks in series save 44 m3 for the same duty, and the first tank does most of the work: it takes the feed to about 55 % conversion at a high rate, and the second finishes the job at a lower rate but a much lower concentration.</p><p><b>Check your answer.</b> Stage 1: X1 = k tau/(1 + k tau) = 1.236/2.236 = 0.553; stage 2 gives X2 = 0.553 + (1-0.553)(0.553) = 0.800. The two stages reach the target.</p><p><b>Common mistake.</b> Splitting an existing tank into two halves and expecting the same conversion. Two tanks of 57.6 m3 each are far more than 71 m3 and would give a higher conversion, while two tanks of 35.6 m3 are the size that reproduces the duty - the volumes must be recomputed, never halved.</p>", "gu": "<h4>પ્રશ્ન (8 marks)</h4><p>એ જ feed (v0 = 7.2 m3/h, k = 0.25 h-1, X = 0.80) હવે series માં બે સરખા CSTR માં લેવાની છે. દરેકનું volume શોધો અને કુલ volume ને પાછલા દાખલાની એક tank સાથે સરખાવો.</p><h4>પગલું 1 - n સરખા tanks માટેનો સંબંધ</h4><div class=\"math\">1 - X = 1/(1 + k tau)^n\n0.20 = 1/(1 + k tau)^2  ->  1 + k tau = 2.236\nk tau = 1.236  ->  tau = 1.236/0.25 = 4.94 h</div><h4>પગલું 2 - દરેક tank નું volume</h4><div class=\"math\">V1 = V2 = v0 tau = 7.2 x 4.94 = 35.6 m3\ntotal = 71.2 m3</div><div class=\"eq\">each tank 36 m3, total 71 m3 against 115 m3 for one tank</div><p>Series માં બે tanks એ જ કામ માટે 44 m3 બચાવે, અને પહેલી tank વધુ કામ કરે: તે feed ને ઊંચા rate પર લગભગ 55 % conversion સુધી લઈ જાય, અને બીજી ઓછા rate પણ ઘણા નીચા concentration પર કામ પૂરું કરે.</p><p><b>જવાબ ચકાસો.</b> તબક્કો 1: X1 = k tau/(1 + k tau) = 1.236/2.236 = 0.553; તબક્કો 2 આપે X2 = 0.553 + (1-0.553)(0.553) = 0.800. બંને તબક્કા લક્ષ્ય સુધી પહોંચે.</p><p><b>સામાન્ય ભૂલ.</b> હાલની tank ને બે ભાગમાં વહેંચીને એ જ conversionની અપેક્ષા રાખવી. દરેક 57.6 m3 હોય તો કુલ 71 m3 કરતાં ઘણું વધારે થાય અને conversion ઊંચું આવે, જ્યારે કામ પાર પાડવા દરેક 35.6 m3 જોઈએ - volumes ફરી ગણવા પડે, અડધા નહીં કરવા.</p>"}}, {"h": {"en": "PFR volume and space time", "gu": "PFR નું volume અને space time"}, "body": {"en": "<h4>Question (7 marks)</h4><p>A gas reaction follows first order kinetics with k = 0.50 h-1 and is to reach 90 % conversion at a feed rate of 10 m3/h. Find the PFR volume, the space time, and the volume a single CSTR would need for the same duty.</p><h4>Step 1 - the PFR space time</h4><div class=\"math\">tau = ln[1/(1 - X)]/k = ln(10)/0.50 = 2.303/0.50 = 4.61 h</div><h4>Step 2 - the volume</h4><div class=\"math\">V = v0 tau = 10 x 4.61 = 46.1 m3</div><h4>Step 3 - the CSTR comparison</h4><div class=\"math\">tau_CSTR = X/[k(1 - X)] = 0.90/(0.50 x 0.10) = 18 h\nV_CSTR = 10 x 18 = 180 m3</div><div class=\"eq\">PFR: tau = 4.61 h, V = 46 m3;  CSTR: 180 m3 - 3.9 times more</div><p>This ratio of 3.9 at 90 % conversion is the standard number to quote when someone asks why tubular reactors are used for high conversion duties.</p><p><b>Check your answer.</b> PFR: CA/CA0 = exp(-k tau) = exp(-2.303) = 0.100, so conversion is 90 %.</p><p><b>Common mistake.</b> Forgetting that a PFR's volume is not the volume of the pipe fittings. The design volume is the tube volume; heads, bends and the jacket add steel but not residence time.</p>", "gu": "<h4>પ્રશ્ન (7 marks)</h4><p>Gas પ્રક્રિયા k = 0.50 h-1 સાથે first order છે અને 10 m3/h feed rate પર 90 % conversion સુધી લઈ જવી છે. PFR નું volume, space time, અને એ જ કામ માટે એક CSTR ને લાગતું volume શોધો.</p><h4>પગલું 1 - PFR નું space time</h4><div class=\"math\">tau = ln[1/(1 - X)]/k = ln(10)/0.50 = 2.303/0.50 = 4.61 h</div><h4>પગલું 2 - volume</h4><div class=\"math\">V = v0 tau = 10 x 4.61 = 46.1 m3</div><h4>પગલું 3 - CSTR સાથે સરખામણી</h4><div class=\"math\">tau_CSTR = X/[k(1 - X)] = 0.90/(0.50 x 0.10) = 18 h\nV_CSTR = 10 x 18 = 180 m3</div><div class=\"eq\">PFR: tau = 4.61 h, V = 46 m3;  CSTR: 180 m3 - 3.9 times more</div><p>90 % conversion પર 3.9 નો આ ગુણોત્તર એ પ્રમાણભૂત આંકડો છે જે કોઈ પૂછે કે ઊંચા conversion ના કામ માટે tubular reactors કેમ વપરાય.</p><p><b>જવાબ ચકાસો.</b> PFR: CA/CA0 = exp(-k tau) = exp(-2.303) = 0.100, તેથી conversion 90 %.</p><p><b>સામાન્ય ભૂલ.</b> PFR નું volume pipe fittings નું volume નથી તે ભૂલવું. Design volume નળીનું volume છે; heads, bends અને jacket steel ઉમેરે પણ residence time નહીં.</p>"}}, {"h": {"en": "Fixed bed: WHSV, bed volume and pressure drop", "gu": "Fixed bed: WHSV, bed volume અને pressure drop"}, "body": {"en": "<h4>Question (6 marks)</h4><p>A fixed bed reactor treats 500 kg/h of gas over 250 kg of catalyst of bulk density 600 kg/m3 and particle density 1100 kg/m3. The bed is in a tube of 0.60 m inside diameter. Find the space velocity, the bed volume, the bed height and the void fraction.</p><h4>Step 1 - space velocity</h4><div class=\"math\">WHSV = feed/catalyst = 500/250 = 2.0 h-1</div><h4>Step 2 - bed volume</h4><div class=\"math\">V_bed = W/rho_b = 250/600 = 0.417 m3</div><h4>Step 3 - bed height</h4><div class=\"math\">A = pi D^2/4 = 3.142 x 0.36/4 = 0.2827 m2\nH = V_bed/A = 0.417/0.2827 = 1.48 m</div><h4>Step 4 - void fraction</h4><div class=\"math\">rho_b = rho_p (1 - eps)  ->  1 - eps = 600/1100 = 0.545\neps = 0.455</div><div class=\"eq\">WHSV = 2.0 h-1,  V_bed = 0.42 m3,  H = 1.48 m,  eps = 0.46</div><p>A void fraction of 0.46 is typical for 3-5 mm pellets. Only that 46 % of the bed carries gas, so the actual gas velocity is 1/(1-eps) = 1.8 times the superficial velocity - and the pressure drop follows the Ergun equation with that velocity.</p><p><b>Check your answer.</b> Mass of solids from the height: rho_p A H (1-eps) = 1100 x 0.2827 x 1.48 x 0.545 = 250 kg, the charge given.</p><p><b>Common mistake.</b> Using the empty-tube velocity in the Ergun equation. The equation already contains (1-eps) and eps^3, but the velocity in it is the superficial one - mixing the two is the usual mistake.</p>", "gu": "<h4>પ્રશ્ન (6 marks)</h4><p>Fixed bed reactor 500 kg/h gas ને 250 kg catalyst પર પ્રક્રિયા કરાવે છે, જેની bulk density 600 kg/m3 અને particle density 1100 kg/m3 છે. Bed 0.60 m આંતરિક વ્યાસની નળીમાં છે. Space velocity, bed volume, bed height અને void fraction શોધો.</p><h4>પગલું 1 - space velocity</h4><div class=\"math\">WHSV = feed/catalyst = 500/250 = 2.0 h-1</div><h4>પગલું 2 - bed volume</h4><div class=\"math\">V_bed = W/rho_b = 250/600 = 0.417 m3</div><h4>પગલું 3 - bed height</h4><div class=\"math\">A = pi D^2/4 = 3.142 x 0.36/4 = 0.2827 m2\nH = V_bed/A = 0.417/0.2827 = 1.48 m</div><h4>પગલું 4 - void fraction</h4><div class=\"math\">rho_b = rho_p (1 - eps)  ->  1 - eps = 600/1100 = 0.545\neps = 0.455</div><div class=\"eq\">WHSV = 2.0 h-1,  V_bed = 0.42 m3,  H = 1.48 m,  eps = 0.46</div><p>3-5 mm pellets માટે 0.46 નું void fraction સામાન્ય છે. Bed ના ફક્ત એ 46 % ભાગમાં gas જાય, તેથી ખરી gas velocity superficial velocity કરતાં 1/(1-eps) = 1.8 ગણી છે - અને pressure drop એ velocity સાથે Ergun equation પ્રમાણે થાય.</p><p><b>જવાબ ચકાસો.</b> ઊંચાઈ પરથી ઘનનું દળ: rho_p A H (1-eps) = 1100 x 0.2827 x 1.48 x 0.545 = 250 kg, જે આપેલો ચાર્જ છે.</p><p><b>સામાન્ય ભૂલ.</b> Ergun equation માં ખાલી નળીની velocity વાપરવી. Equation માં (1-eps) અને eps^3 પહેલેથી છે, પણ તેમાં velocity superficial છે - બંને ભેળવવી સામાન્ય ભૂલ છે.</p>"}}, {"h": {"en": "Fluidised bed: minimum fluidisation and bed height", "gu": "Fluidised bed: minimum fluidisation અને bed height"}, "body": {"en": "<h4>Question (7 marks)</h4><p>A powder of dp = 100 micron and rho_p = 2500 kg/m3 is to be fluidised by a gas of density 1.2 kg/m3 and viscosity 1.8e-5 Pa s in a bed of 0.30 m diameter carrying 40 kg of solids. Find Umf, the bed height at eps = 0.45, and say whether an operating velocity of 0.05 m/s fluidises the bed.</p><h4>Step 1 - minimum fluidisation velocity</h4><div class=\"math\">Umf = dp^2 (rho_p - rho_g) g/(1650 mu)\n    = (1.0e-4)^2 x (2500 - 1.2) x 9.81/(1650 x 1.8e-5)\n    = 1.0e-8 x 24513/0.0297 = 8.25e-3 m/s</div><h4>Step 2 - the bed height</h4><div class=\"math\">A = pi D^2/4 = 3.142 x 0.09/4 = 0.0707 m2\nW = rho_p A H (1 - eps)  ->  H = 40/(2500 x 0.0707 x 0.55)\n   = 40/97.2 = 0.412 m</div><h4>Step 3 - is 0.05 m/s enough?</h4><div class=\"math\">U/Umf = 0.050/0.00825 = 6.1</div><div class=\"eq\">Umf = 8.3 mm/s,  H = 0.41 m,  U/Umf = 6.1 so the bed is vigorously bubbling</div><p>Six times the minimum fluidisation velocity is the normal operating range of a bubbling bed: enough to keep the particles moving, not so much that the catalyst is carried out faster than the cyclone can return it.</p><p><b>Check your answer.</b> At eps = 0.45 the bed holds 2500 x 0.0707 x 0.412 x 0.55 = 40.0 kg, the charge given.</p><p><b>Common mistake.</b> Applying the small-particle formula to coarse sand. Above about 500 micron the inertial term of the Ergun equation dominates and the simple Umf formula under-predicts by a wide margin.</p>", "gu": "<h4>પ્રશ્ન (7 marks)</h4><p>dp = 100 micron અને rho_p = 2500 kg/m3 વાળો પાવડર 1.2 kg/m3 density અને 1.8e-5 Pa s viscosity વાળા gas થી 0.30 m વ્યાસના bed માં fluidise કરવો છે, જેમાં 40 kg ઘન છે. Umf, eps = 0.45 પર bed ની ઊંચાઈ શોધો, અને 0.05 m/s ની operating velocity bed ને fluidise કરશે કે નહીં કહો.</p><h4>પગલું 1 - minimum fluidisation velocity</h4><div class=\"math\">Umf = dp^2 (rho_p - rho_g) g/(1650 mu)\n    = (1.0e-4)^2 x (2500 - 1.2) x 9.81/(1650 x 1.8e-5)\n    = 1.0e-8 x 24513/0.0297 = 8.25e-3 m/s</div><h4>પગલું 2 - bed ની ઊંચાઈ</h4><div class=\"math\">A = pi D^2/4 = 3.142 x 0.09/4 = 0.0707 m2\nW = rho_p A H (1 - eps)  ->  H = 40/(2500 x 0.0707 x 0.55)\n   = 40/97.2 = 0.412 m</div><h4>પગલું 3 - 0.05 m/s પૂરતું છે?</h4><div class=\"math\">U/Umf = 0.050/0.00825 = 6.1</div><div class=\"eq\">Umf = 8.3 mm/s,  H = 0.41 m,  U/Umf = 6.1 so the bed is vigorously bubbling</div><p>Minimum fluidisation velocity કરતાં છ ગણી એ bubbling bed ની સામાન્ય કાર્યશ્રેણી છે: particles હલતા રહે તેટલું, પણ cyclone પાછું લાવી શકે તેનાથી વધુ ઝડપથી catalyst ન ઊડે તેટલું.</p><p><b>જવાબ ચકાસો.</b> eps = 0.45 પર bed માં 2500 x 0.0707 x 0.412 x 0.55 = 40.0 kg રહે, જે આપેલો ચાર્જ છે.</p><p><b>સામાન્ય ભૂલ.</b> બારીક સૂત્ર જાડી રેતી પર વાપરવું. લગભગ 500 micron ઉપર Ergun equation નો inertial ભાગ પ્રભાવી થાય અને સાદું Umf સૂત્ર ઘણું ઓછું આંકે.</p>"}}]}], "diagrams": [{"id": "u4_models", "title": {"en": "The three ideal mixing models", "gu": "ત્રણ આદર્શ mixing models"}, "file": "diagrams/u4_models.svg", "caption": {"en": "Batch: no flow, one composition. CSTR: flow, and the outlet is the same as the contents. PFR: flow, and the composition slides along the tube with no back-mixing.", "gu": "Batch: flow નહીં, એક જ રચના. CSTR: flow, અને outlet અંદરના જેવું જ. PFR: flow, અને રચના નળીમાં આગળ સરકે, પાછળ મિક્સ ન થાય."}}, {"id": "u4_batch", "title": {"en": "The batch reactor, part by part", "gu": "Batch reactor, ભાગે ભાગે"}, "file": "diagrams/u4_batch.svg", "caption": {"en": "A stirred tank with a jacket and a drain: everything goes in at the start, nothing leaves until the end, and the whole batch sees the same composition.", "gu": "Jacket અને drain વાળું હલાવેલું પાત્ર: બધું શરૂઆતમાં ભરાય, અંત સુધી કંઈ નીકળે નહીં, અને આખો batch એક જ રચના જુએ."}}, {"id": "u4_semibatch", "title": {"en": "The semi-batch reactor", "gu": "Semi-batch reactor: અડધું batch"}, "file": "diagrams/u4_semibatch.svg", "caption": {"en": "One reactant is fed into the other at a controlled rate, so its concentration can be held low - the standard way to control a fast or exothermic reaction.", "gu": "એક reactant બીજામાં નિયંત્રિત rate પર ઉમેરાય, જેથી તેનું concentration નીચું રહે - ઝડપી કે exothermic પ્રક્રિયા સંભાળવાનો પ્રમાણભૂત રસ્તો."}}, {"id": "u4_cstr", "title": {"en": "The CSTR (mixed flow reactor)", "gu": "CSTR: સંપૂર્ણ મિશ્ર flow reactor"}, "file": "diagrams/u4_cstr.svg", "caption": {"en": "Feed in, product out through the overflow, and an impeller fast enough that the outlet composition equals the composition everywhere inside.", "gu": "Feed અંદર, product overflow થી બહાર, અને impeller એટલો ઝડપી કે outlet ની રચના અંદર દરેક જગ્યાની રચના જેવી જ હોય."}}, {"id": "u4_pfr", "title": {"en": "The tubular reactor (plug flow)", "gu": "Tubular reactor: નળીમાં plug flow"}, "file": "diagrams/u4_pfr.svg", "caption": {"en": "A tube with no back-mixing: every fluid element spends the same time inside, and the concentration falls along the length like a batch reactor in time.", "gu": "પાછળ મિક્સિંગ વગરની નળી: દરેક element અંદર સરખો સમય ગાળે, અને concentration લંબાઈ પર batch ના સમય જેમ ઘટે."}}, {"id": "u4_fixed", "title": {"en": "The fixed bed reactor", "gu": "Fixed bed reactor (સ્થિર પડ)"}, "file": "diagrams/u4_fixed.svg", "caption": {"en": "Catalyst pellets sit between a distributor and a support grid; the gas or liquid threads through the voids, so pressure drop and hot spots are the design worries.", "gu": "Catalyst pellets distributor અને support grid વચ્ચે બેસે; gas voids માંથી પસાર થાય, તેથી pressure drop અને hot spot design ની ચિંતા."}}, {"id": "u4_fluidised", "title": {"en": "The fluidised bed reactor", "gu": "Fluidised bed reactor (તરતો પડ)"}, "file": "diagrams/u4_fluidised.svg", "caption": {"en": "The gas enters through a distributor fast enough to lift the particles: the bed behaves like a boiling liquid, which carries heat beautifully and back-mixes badly.", "gu": "Gas distributor થી એટલી ઝડપે આવે કે particles ઊંચકાય: bed ઉકળતા પ્રવાહી જેવો વર્તે, જે heat સરસ ઉપાડે પણ back-mixing ખરાબ કરે."}}, {"id": "u4_slurry", "title": {"en": "Slurry and bubble column reactors", "gu": "Slurry અને bubble column reactors"}, "file": "diagrams/u4_slurry.svg", "caption": {"en": "Gas bubbles through a liquid that holds the catalyst: the bubble column has no moving parts, the slurry reactor adds a stirrer to keep the solids suspended.", "gu": "Gas એ પ્રવાહીમાં bubbles કરે જેમાં catalyst તરે છે: bubble column માં હલતો ભાગ નથી, slurry reactor માં ઘન તરતો રાખવા stirrer છે."}}, {"id": "u4_spray", "title": {"en": "Spray tower and trickle bed", "gu": "Spray tower અને trickle bed"}, "file": "diagrams/u4_spray.svg", "caption": {"en": "Liquid falls as drops or as a film over packing while gas rises: the spray tower gives the gas a huge contact area, the trickle bed keeps the catalyst wetted.", "gu": "પ્રવાહી ટીપાં તરીકે કે packing પર પડ તરીકે પડે જ્યારે gas ઉપર જાય: spray tower gas ને વિશાળ contact area આપે, trickle bed catalyst ભીનો રાખે."}}], "equations": [{"title": {"en": "Ideal models", "gu": "આદર્શ models"}, "items": [{"name": {"en": "Batch", "gu": "Batch"}, "f": "t = NA0 x integral dX/(-rA V)", "terms": {"en": "No flow term: the batch equation is a function of time alone.", "gu": "કોઈ flow ભાગ નહીં: batch equation ફક્ત સમયનું વિધેય છે."}}, {"name": {"en": "CSTR", "gu": "CSTR"}, "f": "V = FA0 X / (-rA)", "terms": {"en": "One algebraic line, evaluated at the exit condition.", "gu": "એક બીજગણિતીય લીટી, exit શરત પર ગણાય."}}, {"name": {"en": "PFR", "gu": "PFR"}, "f": "V = FA0 x integral dX/(-rA)", "terms": {"en": "An integral along the tube, from inlet to outlet.", "gu": "નળીની લંબાઈ પર integral, inlet થી outlet સુધી."}}]}, {"title": {"en": "Space time", "gu": "Space time"}, "items": [{"name": {"en": "Space time", "gu": "Space time"}, "f": "tau = V/v0 = CA0 X/(-rA)", "terms": {"en": "The time a volume element would spend inside at inlet conditions.", "gu": "Inlet શરતો પર volume element અંદર ગાળે તે સમય."}}, {"name": {"en": "First order duty", "gu": "First order કામ"}, "f": "CSTR: k tau = X/(1-X);   PFR: k tau = ln[1/(1-X)]", "terms": {"en": "The comparison that decides which reactor to buy.", "gu": "કયો reactor લેવો તે નક્કી કરતી સરખામણી."}}, {"name": {"en": "Space velocity", "gu": "Space velocity"}, "f": "SV = 1/tau = v0/V", "terms": {"en": "The reciprocal of space time, quoted in h-1: how many reactor volumes of feed pass per hour.", "gu": "Space time નો વ્યસ્ત, h-1 માં: કલાક દીઠ કેટલા reactor volumes feed પસાર થાય."}}, {"name": {"en": "CSTRs in series", "gu": "Series માં CSTR"}, "f": "1 - X = 1/(1 + k tau)^n   for n equal tanks", "terms": {"en": "A train of tanks approaches plug flow as n grows.", "gu": "Tanks ની શ્રેણી n વધે તેમ plug flow ની નજીક જાય."}}]}, {"title": {"en": "Packed beds", "gu": "Packed beds"}, "items": [{"name": {"en": "Catalyst basis", "gu": "Catalyst આધાર"}, "f": "W = FA0 x integral dX/(-rA')", "terms": {"en": "The PFR equation with mass of catalyst in place of volume.", "gu": "Volume ની જગ્યાએ catalyst ના દળ સાથેનું PFR equation."}}, {"name": {"en": "Space velocity", "gu": "Space velocity"}, "f": "WHSV = feed mass per hour / catalyst mass", "terms": {"en": "The reciprocal of a space time measured in kilograms.", "gu": "કિલોગ્રામમાં માપેલા space time નો વ્યસ્ત."}}, {"name": {"en": "Void fraction", "gu": "Void fraction"}, "f": "V_bed = W / [rho_p (1 - eps)]", "terms": {"en": "Only the voids carry gas, so eps sets the residence time.", "gu": "ફક્ત voids gas ધરાવે, તેથી eps residence time નક્કી કરે."}}, {"name": {"en": "Ergun pressure drop", "gu": "Ergun pressure drop"}, "f": "dP/L = 150 mu u (1-eps)^2/(eps^3 dp^2) + 1.75 rho u^2 (1-eps)/(eps^3 dp)", "terms": {"en": "Viscous term first, inertial term second.", "gu": "પહેલા viscous ભાગ, પછી inertial ભાગ."}}]}, {"title": {"en": "Fluidisation", "gu": "Fluidisation"}, "items": [{"name": {"en": "Minimum fluidisation", "gu": "ન્યૂનતમ fluidisation velocity"}, "f": "Umf = dp^2 (rho_p - rho_g) g / (1650 mu)", "terms": {"en": "Valid for small particles; the bed lifts above this velocity.", "gu": "નાના particles માટે માન્ય; આ velocity ઉપર bed ઊંચકાય."}}, {"name": {"en": "Bed expansion", "gu": "Bed expansion"}, "f": "H/H_mf = (1 - eps_mf)/(1 - eps)", "terms": {"en": "The same mass of solids in a taller, more open bed.", "gu": "એ જ ઘન દળ વધુ ઊંચા અને વધુ ખુલ્લા bed માં."}}, {"name": {"en": "Solids hold-up", "gu": "Solids hold-up"}, "f": "W = rho_p A H (1 - eps)", "terms": {"en": "Fixes the bed height for a given charge of catalyst.", "gu": "આપેલા catalyst ચાર્જ માટે bed ની ઊંચાઈ નક્કી કરે."}}]}, {"title": {"en": "Multiphase contact", "gu": "Multiphase સંપર્ક"}, "items": [{"name": {"en": "Resistances in series", "gu": "Series માં resistances"}, "f": "1/K = 1/(kG a) + 1/(kL a H) + 1/(k' a H)", "terms": {"en": "The slowest of gas film, liquid film and reaction controls.", "gu": "Gas film, liquid film અને પ્રક્રિયા પૈકી સૌથી ધીમું નિયંત્રણ કરે."}}, {"name": {"en": "Mass transfer limited", "gu": "Mass transfer મર્યાદિત"}, "f": "rate = kL a (CA* - CA)", "terms": {"en": "Doubling kL a doubles the rate - the test for a diffusion-limited reaction.", "gu": "kL a બમણું કરતાં rate બમણો - diffusion-limited પ્રક્રિયાની ચકાસણી."}}, {"name": {"en": "Gas hold-up", "gu": "Gas hold-up"}, "f": "eps_g = V_gas / V_total;   liquid residence time = V(1 - eps_g)/vL", "terms": {"en": "Bubbles occupy volume, so the liquid leaves sooner than V/vL.", "gu": "Bubbles volume રોકે, તેથી પ્રવાહી V/vL કરતાં વહેલું નીકળે."}}, {"name": {"en": "Film thickness", "gu": "પડની જાડાઈ"}, "f": "rate_trickle ~ kL a (CA* - CA) with a from the wetted packing area", "terms": {"en": "A dry patch has no area: wetting the whole bed is the design aim.", "gu": "સૂકો ભાગ area આપતો નથી: આખો bed ભીનો કરવો એ design નો ધ્યેય છે."}}]}], "viva": [{"title": {"en": "Ideal and real reactors", "gu": "આદર્શ અને સાચા reactors"}, "items": [{"q": {"en": "Why does a CSTR need a larger volume than a PFR for the same conversion?", "gu": "એ જ conversion માટે CSTR ને PFR કરતાં મોટું volume કેમ જોઈએ?"}, "a": {"en": "Because it always works at the outlet concentration, which is the lowest in the system, so the rate is at its lowest for the whole residence time. A PFR starts at the inlet concentration and its rate is high where the concentration is high, so the same conversion needs less volume.", "gu": "કારણ કે તે હંમેશા outlet concentration પર કામ કરે, જે system માં સૌથી નીચું છે, તેથી આખા residence time દરમિયાન rate સૌથી નીચો રહે. PFR inlet concentration પર શરૂ થાય અને જ્યાં concentration ઊંચું ત્યાં rate ઊંચો, તેથી એ જ conversion ને ઓછું volume જોઈએ."}}, {"q": {"en": "What would you measure to prove a reactor is not ideal?", "gu": "Reactor આદર્શ નથી તે સાબિત કરવા શું માપશો?"}, "a": {"en": "A tracer response: inject a pulse and record the exit concentration. A perfect CSTR gives one exponential decay, a perfect PFR gives a single delayed spike, and a real reactor gives a curve in between, with a tail that shows dead volume or bypassing.", "gu": "Tracer response: pulse નાખો અને exit concentration નોંધો. સંપૂર્ણ CSTR એક exponential decay આપે, સંપૂર્ણ PFR એક જ વિલંબિત spike આપે, અને સાચો reactor વચ્ચેનો વક્ર આપે, જેની પૂંછડી dead volume કે bypassing દર્શાવે."}}, {"q": {"en": "Why is a batch reactor preferred in a pharmaceutical plant?", "gu": "Pharmaceutical plant માં batch reactor કેમ પસંદ થાય?"}, "a": {"en": "Because many different products are made in the same vessel, each with its own recipe, and the batch record gives complete traceability for every lot - which a continuous unit cannot offer without a great deal of extra work.", "gu": "કારણ કે એક જ પાત્રમાં ઘણા જુદા products બને, દરેકની પોતાની recipe હોય, અને batch record દરેક લોટની સંપૂર્ણ traceability આપે - જે continuous unit ઘણા વધારાના કામ વગર આપી શકતું નથી."}}]}, {"title": {"en": "CSTR and PFR in practice", "gu": "વ્યવહારમાં CSTR અને PFR"}, "items": [{"q": {"en": "Why are several CSTRs often put in series?", "gu": "ઘણી વાર ઘણા CSTR series માં કેમ મૂકાય?"}, "a": {"en": "A train of equal tanks behaves more and more like a PFR as the number grows, so the total volume for a given conversion falls sharply - two tanks already halve the volume needed for
