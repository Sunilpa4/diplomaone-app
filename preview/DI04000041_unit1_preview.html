<script>
const U = {"subject": "DI04000041", "unit": 1, "format": "notes", "title": {"en": "Introduction to Cloud Computing"}, "hours": 6, "weightage": 17, "languages": ["en"], "tabs": ["notes", "diagrams", "equations", "numericals", "viva", "exam"], "intro_text": {"en": "Unit 1 of Cloud Computing: what cloud computing is (and is not), the six central ideas, the five essential characteristics, the challenges that come with them, novel applications including green-hydrogen analytics, the security risks under shared responsibility, and a cost/availability comparison. Eight worked numericals with recomputed answers; practice questions are original and their marks are suggested, not official GTU allocations."}, "notes": [{"title": {"en": "1. Cloud, Computing and the Cloud-Computing Definition"}, "items": [{"h": {"en": "1.1 Cloud, computing and what the two words mean together"}, "body": {"en": "<h4>Definition</h4><p><b>Cloud</b> means the computing resources are not in front of you: they sit in a provider's data centre and are reached over a network. <b>Computing</b> means the work itself - processing, storing and moving data. <b>Cloud computing</b> combines the two: computing delivered as a service from a shared pool, obtained on demand and paid for as it is used.</p><h4>Explanation and application</h4><ul><li>The word cloud is a <b>delivery model</b>, not another name for the Internet. The Internet is the road; the cloud is the managed factory at the end of it.</li><li>The customer no longer buys the server room. The provider owns the building, power, cooling, hardware and the virtualization layer; the customer owns the data, the accounts and the configuration.</li><li>Resources are requested through a console or an API in minutes, not through a purchase order that takes weeks.</li><li>Capacity is shared: your virtual machine runs beside other tenants on the same physical host, isolated by the hypervisor and the provider's controls.</li></ul><table><tr><th>Question</th><th>On-premises server</th><th>Cloud service</th></tr><tr><td>Who owns the hardware?</td><td>The college</td><td>The provider</td></tr><tr><td>Time to add capacity</td><td>Weeks (budget, delivery, install)</td><td>Minutes (API or console)</td></tr><tr><td>Cost pattern</td><td>Capital purchase + maintenance</td><td>Recurring usage-based bill</td></tr><tr><td>Who patches the host?</td><td>College IT staff</td><td>Provider patches the platform; the customer patches the guest OS and application</td></tr></table><h4>Common mistake / conditions</h4><p>A web application running on a single rented server with a fixed yearly bill is <b>hosting</b>, not necessarily cloud computing. Elastic self-service from a shared pool is the test, not the presence of a network cable.</p>"}, "diagram": "cc1_terms", "syllabus_item": "1.1"}, {"h": {"en": "1.2 The standard definition (NIST SP 800-145)"}, "body": {"en": "<h4>Definition</h4><p>Cloud computing is <b>a model for enabling ubiquitous, convenient, on-demand network access to a shared pool of configurable computing resources</b> - networks, servers, storage, applications and services - that can be rapidly provisioned and released with minimal management effort or provider interaction.</p><h4>The definition unpacks into three lists</h4><table><tr><th>Part of the definition</th><th>What it names</th><th>Where it is used</th></tr><tr><td>Five essential characteristics</td><td>On-demand self-service, broad network access, resource pooling, rapid elasticity, measured service</td><td>Unit 1: the properties every cloud must show</td></tr><tr><td>Three service models</td><td>SaaS, PaaS, IaaS</td><td>Unit 3: who manages which layer</td></tr><tr><td>Four deployment models</td><td>Public, private, hybrid, community</td><td>Unit 2: who shares the infrastructure</td></tr></table><h4>Why the wording matters in an exam</h4><ul><li>Every phrase carries a mark: <b>ubiquitous</b> (anywhere), <b>on-demand</b> (no waiting for procurement), <b>shared pool</b> (multi-tenancy), <b>rapidly provisioned and released</b> (elasticity) and <b>minimal management effort</b> (self-service automation).</li><li>The same definition is the reason a private cloud still counts: ownership does not change the model, sharing and automation do.</li></ul><details class=\"self-check\"><summary>Is a college data centre with virtualization but no self-service a cloud?</summary><p>It is a virtualized data centre. Without on-demand self-service, pooling and measured service it does not meet the NIST definition, even though the same hypervisor is used.</p></details>"}, "diagram": "cc1_central", "syllabus_item": "1.1"}, {"h": {"en": "1.3 The central ideas behind cloud computing"}, "body": {"en": "<h4>Definition</h4><p>Six ideas carry the whole model. Remove any one and the economics or the elasticity collapses.</p><h4>Explanation and application</h4><table><tr><th>Central idea</th><th>What it does</th><th>What disappears</th></tr><tr><td>Resource pooling</td><td>Many customers share one large pool of hardware</td><td>One server per application</td></tr><tr><td>Virtualization</td><td>A hypervisor slices hardware into isolated virtual machines</td><td>Hardware bound to one operating system</td></tr><tr><td>Elasticity</td><td>Capacity grows and shrinks with load</td><td>Buying for the yearly peak</td></tr><tr><td>Self-service</td><td>The user provisions through a portal or API</td><td>Ticket queues for a VM</td></tr><tr><td>Measured service</td><td>Usage is metered and billed</td><td>One flat annual bill</td></tr><tr><td>Automation and orchestration</td><td>Templates, autoscaling, infrastructure as code</td><td>Manual rebuilds that nobody can reproduce</td></tr></table><h4>Relation to the syllabus</h4><p>These ideas are the mechanism; the <b>characteristics</b> in the next section are the observable result; the <b>challenges</b> later in this unit are the price paid for them. Answering \"explain central ideas\" by listing the five characteristics loses marks, because the characteristics are outcomes, not mechanisms.</p>"}, "diagram": "cc1_central", "syllabus_item": "1.2"}]}, {"title": {"en": "2. Characteristics of Cloud Computing"}, "items": [{"h": {"en": "2.1 The five essential characteristics"}, "body": {"en": "<h4>Definition</h4><p>A service is cloud computing only if it shows all five essential characteristics. Four out of five is hosting.</p><h4>Explanation and application</h4><table><tr><th>Characteristic</th><th>Meaning</th><th>Observable symptom</th></tr><tr><td>On-demand self-service</td><td>The consumer provisions compute, storage or software without human interaction with the provider</td><td>A student creates a VM at 2 a.m. from a portal</td></tr><tr><td>Broad network access</td><td>Services are reachable over the network from phones, laptops and other standard clients</td><td>The same catalogue opens on a phone and a lab PC</td></tr><tr><td>Resource pooling</td><td>Provider resources serve many consumers from a shared pool, with location abstracted</td><td>A new VM lands in any available host of the region</td></tr><tr><td>Rapid elasticity</td><td>Capacity can scale out and back quickly, appearing unlimited to the consumer</td><td>Result-day traffic is absorbed, then the extra capacity is released</td></tr><tr><td>Measured service</td><td>Usage is automatically metered, controlled and reported</td><td>The bill lists vCPU-hours, GB-months and egress GB</td></tr></table><h4>Common mistake / conditions</h4><p>\"Elastic\" is not the same as \"unlimited\". Elasticity is bounded by the provider's quota, the account's limit and the budget. A quota reached during a result-day spike is a real outage in exactly the same way as a full on-premises server.</p>"}, "diagram": "cc1_characteristics", "syllabus_item": "1.3"}, {"h": {"en": "2.2 Supporting traits that are not on the five-item list"}, "body": {"en": "<h4>Definition</h4><p>Multi-tenancy, resilience, automation and a metered catalogue are not in the NIST list of five, yet they are the properties students actually notice. Treat them as supporting traits.</p><h4>Explanation and application</h4><ul><li><b>Multi-tenancy:</b> several customers share the physical layer. It is the source of the price advantage and the source of the isolation question in Unit 5.</li><li><b>Resilience:</b> a provider replicates across zones, but only if the customer uses more than one zone. A single-zone deployment inherits the zone's failures.</li><li><b>Automation:</b> templates and infrastructure-as-code make environments reproducible, which is what makes elastic scaling safe.</li><li><b>Metered billing:</b> cost becomes a design variable. A poorly designed query can cost more than a server, which is why cost control is listed as a challenge in Section 3.</li></ul><h4>Examination use</h4><p>If a question asks for the characteristics, give the five and name the supporting traits separately. Mixing them into one list is the most common way to lose the structure marks.</p>"}, "syllabus_item": "1.3"}, {"h": {"en": "2.3 What is not cloud computing"}, "body": {"en": "<h4>Definition</h4><p>Three services are often mislabelled as cloud. Each fails at least one essential characteristic.</p><h4>Explanation and application</h4><table><tr><th>Service</th><th>Why it is not cloud</th><th>What it really is</th></tr><tr><td>Colocation</td><td>The customer owns the hardware; no pooling, no self-service, no elasticity</td><td>Rented space, power and cooling</td></tr><tr><td>Plain shared web hosting</td><td>Fixed plans, no measured compute, no API-driven provisioning</td><td>Managed hosting</td></tr><tr><td>A virtual machine on a laptop</td><td>Virtualization without pooling, network access or measured service</td><td>Local virtualization (useful, but not cloud)</td></tr><tr><td>Traditional IT outsourcing</td><td>A contract to run the customer's own servers</td><td>Managed services on dedicated hardware</td></tr></table><h4>Test to apply in the viva</h4><ol><li>Can the consumer provision it without talking to a human?</li><li>Is the capacity drawn from a pool shared with other tenants?</li><li>Can it grow and shrink within minutes?</li><li>Is usage metered and billed?</li></ol><p>Any \"no\" means the service is hosted or virtualized, not cloud computing.</p>"}, "syllabus_item": "1.3"}]}, {"title": {"en": "3. Challenges of Cloud Computing"}, "items": [{"h": {"en": "3.1 Technical challenges"}, "body": {"en": "<h4>Definition</h4><p>Technical challenges come from putting a boundary between the application and the hardware it runs on. Each one has a measurable symptom and a standard mitigation.</p><h4>Explanation and application</h4><ul><li><b>Connectivity dependence:</b> if the campus link is down, a cloud-hosted exam portal is down even though the provider is healthy. Mitigate with a redundant link, not with hope.</li><li><b>Latency and bandwidth:</b> a round trip to a distant region adds delay to every request; data-heavy workflows pay for egress. Keep chatty protocols off long-haul links.</li><li><b>Migration complexity:</b> moving a database is easy until the stored procedures, scheduled jobs and licence dependencies arrive with it.</li><li><b>Integration with legacy systems:</b> an on-premises ERP on a private address space needs a secure tunnel or an API before anything can talk to it.</li><li><b>Performance variability:</b> a noisy neighbour on a shared host, or a burst credit exhausted, changes throughput without changing configuration.</li><li><b>Skills:</b> cloud work is configuration, identity and cost engineering, not only servers.</li></ul><h4>Common mistake / conditions</h4><p>\"The cloud is down\" is usually a statement about one service, one region or one configuration. Diagnose in layers: link, DNS, identity, quota, application, then provider status.</p>"}, "diagram": "cc1_challenges", "syllabus_item": "1.4"}, {"h": {"en": "3.2 Business, legal and cost challenges"}, "body": {"en": "<h4>Definition</h4><p>The commercial and legal obligations do not disappear when the server does; they move into a contract and a bill.</p><h4>Explanation and application</h4><table><tr><th>Challenge</th><th>Why it matters</th><th>Practical control</th></tr><tr><td>Vendor lock-in</td><td>Proprietary services and APIs make exit expensive</td><td>Prefer open formats; keep an export path documented</td></tr><tr><td>Compliance and data residency</td><td>Some records must stay in a stated jurisdiction</td><td>Choose the region first, then the service</td></tr><tr><td>Unpredictable cost</td><td>Elastic capacity can multiply spend in a weekend</td><td>Budgets, alerts, tagging and a monthly review</td></tr><tr><td>Shadow IT</td><td>A department buys its own cloud account outside IT policy</td><td>Central account structure with delegated, audited access</td></tr><tr><td>SLA gaps</td><td>A 99.9 % promise still allows hours of downtime, and credits are not refunds of business loss</td><td>Read the remedy clause; design for failure; keep a fallback</td></tr><tr><td>Exit and skills</td><td>The team that built the system may not be able to rebuild it elsewhere</td><td>Document architecture; avoid unmanaged one-off configuration</td></tr></table><h4>Reading an SLA honestly</h4><p>An SLA is a service credit agreement, not an insurance policy. Before quoting a percentage in an answer, convert it into downtime with the arithmetic in Section 7 - 99.9 % of a month is still about 43 minutes.</p>"}, "syllabus_item": "1.4"}]}, {"title": {"en": "4. Novel Applications of Cloud Computing"}, "items": [{"h": {"en": "4.1 Education and campus services"}, "body": {"en": "<h4>Definition</h4><p>Colleges were early adopters because their load is spiky and their budgets are capital-poor: a result portal is idle for weeks and then serves the whole institute in one morning.</p><h4>Explanation and application</h4><ul><li><b>Learning management:</b> course material, assignments and video lectures in object storage, with the application tier scaled on demand.</li><li><b>Examination and result portals:</b> the classic burst pattern - minutes of extreme load followed by months of quiet.</li><li><b>Virtual laboratories:</b> browser-accessible machines for programming, networking or simulation practicals, reset from a template between batches.</li><li><b>Backup and archival:</b> staff records and project reports replicated to a second region at low cost.</li><li><b>Collaboration:</b> shared documents and mail with identity managed centrally.</li></ul><h4>Why cloud fits</h4><p>The demand curve, not the technology, is the argument: paying for peak capacity all year would waste most of it.</p>"}, "syllabus_item": "1.5"}, {"h": {"en": "4.2 Health, agriculture, transport and media"}, "body": {"en": "<h4>Definition</h4><p>The novel applications share one pattern: many small sites producing data that is analysed centrally and answered back to a phone.</p><h4>Explanation and application</h4><table><tr><th>Domain</th><th>Cloud application</th><th>Why cloud</th></tr><tr><td>Health</td><td>Telemedicine records, imaging archives, appointment systems</td><td>Spiky demand, large images, strict access control</td></tr><tr><td>Agriculture</td><td>Soil and weather advisories, mandi price feeds, drone imagery</td><td>Seasonal peaks, many remote users</td></tr><tr><td>Transport</td><td>Ticketing, fleet tracking, route planning</td><td>Burst load at festival peaks; location data from vehicles</td></tr><tr><td>Media</td><td>Video transcoding, content delivery, recommendation engines</td><td>Storage-heavy and compute-heavy for short periods</td></tr></table><h4>Condition to state in an answer</h4><p>Each of these handles personal data, so the application is only acceptable with the privacy controls of Unit 5: least-privilege access, encryption, audit logging and a deletion policy.</p>"}, "syllabus_item": "1.5"}, {"h": {"en": "4.3 Engineering analytics: the green-hydrogen data hub"}, "body": {"en": "<h4>Definition</h4><p>A hydrogen plant produces a continuous stream of measurements - electrolyser current, stack temperature, pressure, purity, renewable input and output flow. Cloud analytics turns that stream into maintenance decisions and efficiency gains.</p><h4>Explanation and application</h4><ol><li><b>Ingest:</b> sensors and gateways push readings to a cloud endpoint at a fixed interval.</li><li><b>Store:</b> raw telemetry in object storage; downsampled series in a time-series database for fast charts.</li><li><b>Analyse:</b> detect drift, estimate efficiency (energy per kilogram of hydrogen) and flag anomalies before a stack fails.</li><li><b>Predict:</b> a model trained on history schedules maintenance instead of waiting for a breakdown.</li><li><b>Present:</b> a dashboard shows the plant, the fleet of sites and the savings to operators and management.</li></ol><h4>Why cloud, and where its limits are</h4><ul><li>Fits: multi-site data collection, variable computing for model training, and remote dashboards that must work from a phone.</li><li>Limits: a control loop that trips a valve cannot wait for a network round trip - safety control stays local, analytics stays in the cloud.</li><li>Limits: plant data may be commercially sensitive or legally local, so region choice and access control are part of the design, not an afterthought.</li></ul>"}, "diagram": "cc1_hydrogen", "syllabus_item": "1.5"}]}, {"title": {"en": "5. Security Risks of Cloud Computing"}, "items": [{"h": {"en": "5.1 Shared responsibility: who secures what"}, "body": {"en": "<h4>Definition</h4><p>Security in the cloud is split. The provider secures the cloud <b>of</b> the cloud - facilities, hardware, network fabric and the virtualization layer. The customer secures what runs <b>in</b> the cloud - data, identities, configuration and application code.</p><h4>Explanation and application</h4><table><tr><th>Layer</th><th>Responsible party (IaaS)</th><th>Typical failure</th></tr><tr><td>Facility, power, physical access</td><td>Provider</td><td>Rare; covered by provider audits</td></tr><tr><td>Host hardware, network fabric</td><td>Provider</td><td>Hardware fault, network partition</td></tr><tr><td>Hypervisor and isolation</td><td>Provider</td><td>A tenant escape would be a provider fault</td></tr><tr><td>Guest operating system and patches</td><td>Customer</td><td>Unpatched server exploited</td></tr><tr><td>Identity, keys and permissions</td><td>Customer</td><td>Over-privileged account, leaked key</td></tr><tr><td>Data classification and encryption</td><td>Customer</td><td>Public bucket holding student records</td></tr><tr><td>Application code and configuration</td><td>Customer</td><td>Debug endpoint left enabled</td></tr></table><h4>Common mistake / conditions</h4><p>The provider's compliance certificate covers the provider's half. It does not make an openly-readable storage bucket compliant. Most real cloud incidents land on the customer's side of the line.</p>"}, "diagram": "cc1_shared", "syllabus_item": "1.6"}, {"h": {"en": "5.2 Seven common cloud security risks and their controls"}, "body": {"en": "<h4>Definition</h4><p>The risks below are the ones a diploma project or a campus deployment actually meets. Each control is something a student can configure.</p><h4>Explanation and application</h4><table><tr><th>Risk</th><th>What it looks like</th><th>Control</th></tr><tr><td>Misconfiguration</td><td>Storage bucket set to public; security group open to 0.0.0.0/0</td><td>Templates with secure defaults; configuration scanning; review before release</td></tr><tr><td>Account compromise</td><td>No multi-factor authentication; long-lived access keys in code</td><td>MFA on all privileged accounts; short-lived roles; secrets in a managed store</td></tr><tr><td>Insecure API</td><td>Unencrypted endpoints; no rate limit; verbose errors</td><td>TLS everywhere; authentication on every route; throttle and log</td></tr><tr><td>Data breach</td><td>Sensitive data copied out through a stolen credential</td><td>Least privilege, encryption at rest and in transit, anomaly alerts</td></tr><tr><td>Denial of service</td><td>Traffic or cost exhaustion against a public endpoint</td><td>Edge filtering, autoscaling limits, budget alerts, provider DDoS protection</td></tr><tr><td>Malicious insider</td><td>An administrator reads data without a need to know</td><td>Separation of duties, audit trails, access reviews</td></tr><tr><td>Data loss</td><td>Deleted object, failed migration, no tested backup</td><td>Versioning, cross-region backup, restore drills</td></tr></table><h4>Shared-tenancy caution</h4><p>Isolation between tenants is the provider's job, but a shared service still shares fate: a regional control-plane failure affects every tenant in that region, which is why multi-zone design is the customer's decision.</p>"}, "syllabus_item": "1.6"}, {"h": {"en": "5.3 Privacy: location, retention and third-party access"}, "body": {"en": "<h4>Definition</h4><p>Privacy asks a different question from security: not only \"who can reach the data\" but \"who may lawfully hold it, for how long, and where\".</p><h4>Explanation and application</h4><ul><li><b>Location:</b> a region choice decides which country's law applies to the stored copy.</li><li><b>Retention and deletion:</b> a deletion request must also reach backups and replicas, or the data never really leaves.</li><li><b>Third-party access:</b> providers use sub-processors; the customer must know who can touch the data and under what terms.</li><li><b>Access by provider staff:</b> support access should be logged, time-limited and approved.</li><li><b>Exit copy:</b> the customer must be able to take a usable export away, not only a screenshot.</li></ul><h4>Indian context</h4><p>For personal data of students or patients, the Digital Personal Data Protection Act, 2023 introduces consent, purpose limitation and breach-reporting duties on the data fiduciary. Cloud does not transfer those duties to the provider; the institute remains responsible.</p>"}, "syllabus_item": "1.6"}]}, {"title": {"en": "6. Advantages and Disadvantages"}, "items": [{"h": {"en": "6.1 Advantages, with the reason behind each"}, "body": {"en": "<h4>Definition</h4><p>The advantages are all consequences of pooling, elasticity and measured service - which is why they should be stated with their mechanism, not as a list of adjectives.</p><h4>Explanation and application</h4><table><tr><th>Advantage</th><th>Mechanism</th><th>Example</th></tr><tr><td>No capital expenditure</td><td>Provider owns the hardware; the customer pays monthly</td><td>A department starts a project without buying servers</td></tr><tr><td>Elastic capacity</td><td>Pooled resources are added and released in minutes</td><td>Result-day portal absorbs a spike</td></tr><tr><td>Global reach</td><td>Regions place the application near its users</td><td>An app served from Mumbai and Singapore</td></tr><tr><td>Managed services</td><td>Databases, queues and monitoring are run by the provider</td><td>The team writes features instead of patching database hosts</td></tr><tr><td>Resilience options</td><td>Multi-zone replication is a configuration choice</td><td>A zone failure does not stop the service</td></tr><tr><td>Faster experiments</td><td>Environments are created and destroyed on demand</td><td>A lab batch of 60 machines for two hours</td></tr></table><h4>Condition</h4><p>Every advantage is conditional on design. Elastic capacity without a budget alert becomes elastic cost; managed services without an exit plan become lock-in.</p>"}, "diagram": "cc1_advdis", "syllabus_item": "1.7"}, {"h": {"en": "6.2 Disadvantages and their honest limits"}, "body": {"en": "<h4>Definition</h4><p>The disadvantages are the mirror image of the same properties. An exam answer that lists only benefits is incomplete.</p><h4>Explanation and application</h4><ul><li><b>Recurring cost:</b> a stable workload run for years can cost more than owned hardware. Model it - Section 7 does exactly that.</li><li><b>Network dependency:</b> the campus link becomes a single point of failure for teaching systems.</li><li><b>Egress and storage charges:</b> data leaving the provider is billed, and archives grow quietly.</li><li><b>Limited control:</b> no access to the physical host, the hypervisor or the maintenance window.</li><li><b>Vendor lock-in:</b> proprietary APIs, identity models and managed services raise exit cost.</li><li><b>Latency:</b> every call crosses a network boundary; hard real-time control is unsuitable.</li><li><b>Compliance and trust:</b> data location, sub-processors and lawful access are contract questions, not technical ones.</li></ul><h4>Balance</h4><p>The correct conclusion is not \"cloud is good\" or \"cloud is bad\", but \"cloud for spiky, new or distributed workloads; owned hardware for stable, predictable, latency-critical or strictly local workloads\".</p>"}, "syllabus_item": "1.7"}, {"h": {"en": "6.3 When cloud is the wrong choice"}, "body": {"en": "<h4>Definition</h4><p>A decision checklist is more useful than a slogan. If any of these is true, a cloud-first answer needs a strong justification.</p><h4>Explanation and application</h4><ol><li><b>Hard real-time control</b> - a loop that must react in milliseconds stays local.</li><li><b>Strict data localisation</b> - if no available region satisfies the rule, the data cannot leave.</li><li><b>Stable, fully used hardware</b> - a server already running at high utilisation for years is cheap to keep.</li><li><b>No reliable connectivity</b> - a site with intermittent power and link cannot depend on a remote console.</li><li><b>Unbudgeted metered spend</b> - an organisation that cannot monitor a variable bill will either overspend or be surprised.</li></ol><h4>Decision pattern for a report</h4><p>State the workload, the demand shape, the data sensitivity, the connectivity and the cost model. Then choose public, private, hybrid or community - the deployment models are the next unit.</p>"}, "syllabus_item": "1.7"}]}, {"title": {"en": "7. Worked Numericals: Availability, Cost and Sizing"}, "items": [{"h": {"en": "7.1 Availability percentages converted into downtime"}, "body": {"en": "<h4>Definition</h4><p>An availability figure is only meaningful as downtime. The conversion is one line: allowed downtime = (100 % - availability) x total minutes.</p><h4>Explanation and application</h4><p>Three worked examples use a year (525,600 minutes) and a 30-day month (43,200 minutes). They are linked below as EX boxes; the arithmetic and the check line are in each box.</p><ol><li><b>99.9 % for one year:</b> 0.1 % of 525,600 = <b>525.6 minutes = 8.76 hours</b>.</li><li><b>99.95 % for a month:</b> 0.05 % of 43,200 = <b>21.6 minutes</b>.</li><li><b>99.99 % for a month:</b> 0.01 % of 43,200 = <b>4.32 minutes</b>.</li></ol><h4>Interpretation</h4><p>The jump from 99.9 % to 99.99 % is a factor of ten in downtime, and usually a much larger factor in engineering effort: redundancy, health checks, tested failover and rehearsed recovery. Quote the minutes, not the marketing percentage.</p>"}, "examples": ["cc1n1", "cc1n2", "cc1n3"], "syllabus_item": "1.7"}, {"h": {"en": "7.2 Comparing owned hardware with a cloud bill"}, "body": {"en": "<h4>Definition</h4><p>The fair comparison is total cost over the same period: capital cost plus operations on one side, usage-based cost plus egress on the other.</p><h4>Explanation and application</h4><ul><li>One-time purchase is divided by the monthly difference to get a break-even point.</li><li>If the cloud bill is higher every month, break-even is the number of months after which the purchase wins - provided the server really lives that long.</li><li>If the server would be idle for most of the year, there is no break-even to compute: the cloud wins on avoided idle capacity.</li></ul><h4>Worked example</h4><p>A server costs 90,000 once, plus 3,000 per month to run. The equivalent cloud service is 8,000 per month with no purchase. Break-even = 90,000 / (8,000 - 3,000) = <b>18 months</b>. Below 18 months the cloud is cheaper; above it, ownership is - in this simple model that ignores refresh, staff time and failure risk.</p>"}, "examples": ["cc1n4", "cc1n5"], "syllabus_item": "1.7"}, {"h": {"en": "7.3 Sizing storage, egress and sensor data"}, "body": {"en": "<h4>Definition</h4><p>Three bills dominate most student projects: stored GB-months, egress GB and the compute needed after consolidation.</p><h4>Explanation and application</h4><ol><li><b>Growth:</b> stored volume after n years = initial volume x (1 + growth)^n. Multiply by the per-GB rate for the monthly bill.</li><li><b>Egress:</b> monthly transfer x per-GB rate; multiply by 12 for the yearly figure, because it is usually the surprise line.</li><li><b>Consolidation:</b> used capacity = servers x vCPU x utilisation; add headroom before choosing the instance size.</li><li><b>Telemetry:</b> samples per month x bytes per sample. Raw sensor data is small; indexes, replication and dashboards are what cost money.</li></ol><h4>Interpretation</h4><p>Storage grows exponentially but slowly at first; egress grows with popularity; telemetry grows with the number of sensors. Model all three before quoting a monthly cost to a client.</p>"}, "examples": ["cc1n6", "cc1n7", "cc1n8"], "syllabus_item": "1.7"}]}, {"title": {"en": "8. Answered Practice (original questions, suggested marks)"}, "items": [{"h": {"en": "Practice 1. Define cloud computing and explain the five essential characteristics with one example each."}, "body": {"en": "<h4>Definition (1 mark)</h4><p>Cloud computing is a model for enabling ubiquitous, convenient, on-demand network access to a shared pool of configurable computing resources - networks, servers, storage, applications and services - that can be rapidly provisioned and released with minimal management effort or provider interaction.</p><h4>Characteristics (5 marks, 1 each)</h4><ul><li><b>On-demand self-service:</b> a student starts a virtual machine from a portal at midnight without raising a ticket.</li><li><b>Broad network access:</b> the same notes portal opens on a phone, a lab PC and a tablet.</li><li><b>Resource pooling:</b> the new VM is placed on any free host in the region; the student never learns which one.</li><li><b>Rapid elasticity:</b> the result portal scales out on result day and releases the extra capacity the next morning.</li><li><b>Measured service:</b> the bill lists vCPU-hours, GB-months and egress GB for that VM.</li></ul><h4>Conclusion (1 mark)</h4><p>All five must be present; a service with four is hosted or virtualized, not cloud computing.</p>"}}, {"h": {"en": "Practice 2. Differentiate cloud computing from traditional on-premises computing (any four points)."}, "body": {"en": "<h4>Four differences (1 mark each)</h4><table><tr><th>Basis</th><th>On-premises</th><th>Cloud</th></tr><tr><td>Hardware ownership</td><td>College buys and owns it</td><td>Provider owns it; customer rents capacity</td></tr><tr><td>Provisioning time</td><td>Weeks for budget, delivery and installation</td><td>Minutes through a console or API</td></tr><tr><td>Cost pattern</td><td>Capital purchase plus maintenance</td><td>Recurring usage-based bill</td></tr><tr><td>Responsibility</td><td>College patches host, hypervisor and application</td><td>Provider patches the platform; customer patches the guest and the application</td></tr></table><p>Mention any one consequence in a closing line: cloud shifts cost from capital to operating and shifts platform patching to the provider.</p>"}}, {"h": {"en": "Practice 3. Explain the central ideas behind cloud computing."}, "body": {"en": "<h4>Six ideas with the manual practice each replaces</h4><ol><li><b>Resource pooling</b> - one hardware pool serves many customers instead of one server per application.</li><li><b>Virtualization</b> - a hypervisor slices that hardware into isolated virtual machines instead of one operating system per machine.</li><li><b>Elasticity</b> - capacity follows the load instead of being bought for the yearly peak.</li><li><b>Self-service</b> - a portal or API provisions resources instead of a ticket queue.</li><li><b>Measured service</b> - usage is metered and billed instead of one flat annual bill.</li><li><b>Automation and orchestration</b> - templates and infrastructure as code replace manual rebuilds that nobody can reproduce.</li></ol><p>Close by distinguishing mechanism from outcome: these six produce the five characteristics.</p>"}}, {"h": {"en": "Practice 4. What is multi-tenancy? Why does it create both savings and risk?"}, "body": {"en": "<h4>Meaning (1 mark)</h4><p>Multi-tenancy means several customers share the same physical host, storage array or network, with isolation enforced by the virtualization layer and the provider's access controls.</p><h4>Saving (1 mark)</h4><p>Hardware, power and cooling are used by many tenants, so the cost per tenant falls and small workloads become affordable.</p><h4>Risk (1 mark)</h4><p>Isolation is now a security dependency: a hypervisor flaw or a misconfigured shared service can expose one tenant to another, and a noisy neighbour can consume shared capacity. The provider owns isolation; the customer still owns its own permissions and configuration.</p>"}}, {"h": {"en": "Practice 5. Explain any four challenges of cloud computing and one mitigation for each."}, "body": {"en": "<h4>Four challenges (4 marks) and mitigations (3 marks)</h4><table><tr><th>Challenge</th><th>Why it happens</th><th>Mitigation</th></tr><tr><td>Connectivity dependence</td><td>The application sits beyond the campus link</td><td>Redundant links and an offline fallback for critical pages</td></tr><tr><td>Latency and egress</td><td>Every call crosses a network boundary; outbound data is billed</td><td>Choose the nearest region; compress; cache at the edge</td></tr><tr><td>Vendor lock-in</td><td>Proprietary APIs and managed services make exit costly</td><td>Open formats, documented export, portable containers</td></tr><tr><td>Cost control</td><td>Elastic capacity can multiply spend without warning</td><td>Budgets, alerts, tagging and a monthly review</td></tr></table><p>Any four rows earn full credit; add one sentence that each mitigation reduces probability, impact or both.</p>"}}, {"h": {"en": "Practice 6. Describe the shared responsibility model for IaaS with a layer table."}, "body": {"en": "<h4>The split (2 marks)</h4><p>The provider secures the cloud itself - facilities, hardware, network fabric and hypervisor. The customer secures what runs in the cloud - guest operating system, identities, data, configuration and application code.</p><h4>Layer table (4 marks)</h4><table><tr><th>Layer</th><th>Owner</th></tr><tr><td>Building, power, cooling</td><td>Provider</td></tr><tr><td>Servers, storage, network fabric</td><td>Provider</td></tr><tr><td>Hypervisor and tenant isolation</td><td>Provider</td></tr><tr><td>Guest OS patches</td><td>Customer</td></tr><tr><td>Identity, keys, permissions</td><td>Customer</td></tr><tr><td>Data classification and encryption</td><td>Customer</td></tr></table><h4>Conclusion (1 mark)</h4><p>Compliance certificates cover the provider's rows only; a public bucket is still the customer's failure.</p>"}}, {"h": {"en": "Practice 7. List five cloud security risks and the control for each."}, "body": {"en": "<h4>Five risks with controls</h4><ul><li><b>Misconfiguration</b> - public bucket or open security group; control: secure templates and configuration scanning.</li><li><b>Account compromise</b> - no MFA, keys in code; control: MFA, short-lived roles, managed secrets.</li><li><b>Insecure API</b> - unencrypted or unauthenticated endpoints; control: TLS, authentication on every route, throttling.</li><li><b>Data breach</b> - stolen credential copies data out; control: least privilege, encryption, anomaly alerts.</li><li><b>Denial of service or cost exhaustion</b> - control: edge filtering, scaling limits and budget alerts.</li></ul><p>Add data loss (versioning and tested restore) as a sixth if the question allows five plus one.</p>"}}, {"h": {"en": "Practice 8. Explain three novel applications of cloud computing."}, "body": {"en": "<h4>Any three, each with the reason</h4><ol><li><b>Campus services:</b> LMS, result portal and virtual labs - the load is spiky and the budget is capital-poor, so pooled capacity is cheaper than peak hardware.</li><li><b>Healthcare:</b> telemedicine records and imaging archives - large images, many remote users, strict access control and audit.</li><li><b>Green-hydrogen analytics:</b> sensors stream to a cloud store; models flag drift and schedule maintenance, while dashboards show plant efficiency remotely. Safety control stays local.</li></ol><p>One line on privacy: each application handles personal data, so least privilege, encryption and a deletion policy are part of the answer.</p>"}}, {"h": {"en": "Practice 9. State four advantages and three disadvantages of cloud computing."}, "body": {"en": "<h4>Advantages (2 marks)</h4><ul><li>No capital expenditure - monthly billing replaces a purchase.</li><li>Elastic capacity - the result-day peak is absorbed and released.</li><li>Global reach - regions place the app near users.</li><li>Managed services - the team writes features instead of patching database hosts.</li></ul><h4>Disadvantages (2 marks)</h4><ul><li>Recurring cost - a stable long-running workload can cost more than owned hardware.</li><li>Network dependency - the campus link becomes a single point of failure.</li><li>Egress and lock-in - outbound data is billed and proprietary APIs raise exit cost.</li></ul><p>Close with the balance: cloud for spiky, new or distributed loads; owned hardware for stable, latency-critical or strictly local loads.</p>"}}, {"h": {"en": "Practice 10. A provider offers 99.9 % availability. Compute the allowed downtime per year and comment."}, "body": {"en": "<h4>Given and formula</h4><p>Year = 365 x 24 x 60 = 525,600 minutes; allowed downtime = (1 - 0.999) x 525,600.</p><h4>Calculation</h4><p>0.001 x 525,600 = <b>525.6 minutes = 8.76 hours per year</b>.</p><h4>Comment</h4><p>That is roughly one working day. Each additional nine cuts the allowance by about ten, but requires redundancy, health checks and rehearsed failover - so the percentage should be quoted as minutes.</p>"}}, {"h": {"en": "Practice 11. A server costs 90,000 plus 3,000 per month; the cloud equivalent is 8,000 per month. Find the break-even and interpret it."}, "body": {"en": "<h4>Given and formula</h4><p>Purchase = 90,000; monthly difference = 8,000 - 3,000 = 5,000; break-even = purchase / difference.</p><h4>Calculation</h4><p>90,000 / 5,000 = <b>18 months</b>.</p><h4>Interpretation</h4><p>If the server is used for less than 18 months, or sits idle for much of the year, the cloud is cheaper. Beyond 18 months of genuine use, ownership wins in this model - which ignores hardware refresh, staff time and failure risk, so state those assumptions.</p>"}}, {"h": {"en": "Practice 12. When should an organisation avoid moving a workload to the cloud?"}, "body": {"en": "<h4>Five conditions (any three for full marks)</h4><ul><li><b>Hard real-time control</b> - a millisecond loop cannot wait for a network round trip.</li><li><b>Strict data localisation</b> - if no available region satisfies the rule, the data cannot leave.</li><li><b>Stable, fully used hardware</b> - an already busy server is cheap to keep running.</li><li><b>Unreliable connectivity</b> - a site with intermittent power and link cannot depend on a remote console.</li><li><b>No cost governance</b> - an organisation that cannot monitor a metered bill will overspend.</li></ul><p>Then recommend the middle path: keep control and sensitive data local and move analytics or archives to the cloud - a hybrid decision, which is the next unit.</p>"}}]}], "diagrams": [{"id": "cc1_terms", "title": {"en": "Cloud, computing and cloud computing"}, "file": "diagrams/cc1_terms.svg"}, {"id": "cc1_central", "title": {"en": "Six central ideas behind cloud computing"}, "file": "diagrams/cc1_central.svg"}, {"id": "cc1_characteristics", "title": {"en": "Five essential characteristics"}, "file": "diagrams/cc1_characteristics.svg"}, {"id": "cc1_challenges", "title": {"en": "Challenges by category"}, "file": "diagrams/cc1_challenges.svg"}, {"id": "cc1_hydrogen", "title": {"en": "Green-hydrogen analytics in the cloud"}, "file": "diagrams/cc1_hydrogen.svg"}, {"id": "cc1_shared", "title": {"en": "Shared responsibility split"}, "file": "diagrams/cc1_shared.svg"}, {"id": "cc1_advdis", "title": {"en": "Advantages and disadvantages"}, "file": "diagrams/cc1_advdis.svg"}], "equations": [{"title": {"en": "Rules worth quoting exactly"}, "items": [{"name": {"en": "Cloud is not the Internet"}, "f": "cloud = delivered service; Internet = transport", "terms": {"en": "The Internet carries the traffic; the cloud is the managed, metered service at the end of it."}}, {"name": {"en": "The cloud test"}, "f": "self-service + pooling + elasticity + metering", "terms": {"en": "Fail one of these and the service is hosting or virtualization, not cloud computing."}}, {"name": {"en": "Elasticity vs scalability"}, "f": "elastic = up and down; scalable = can grow", "terms": {"en": "Only elasticity releases capacity again, which is what makes the bill follow the load."}}, {"name": {"en": "Multi-tenancy"}, "f": "many tenants → one shared physical pool", "terms": {"en": "Source of the price advantage and of the isolation question in Unit 5."}}, {"name": {"en": "Shared responsibility"}, "f": "provider secures the cloud; customer secures in it", "terms": {"en": "The provider's certificate covers its half only; configuration and data remain the customer's duty."}}]}, {"title": {"en": "Availability arithmetic"}, "items": [{"name": {"en": "Allowed downtime"}, "f": "downtime = (1 - availability) x total minutes", "terms": {"en": "Year = 525,600 min; 30-day month = 43,200 min; 31-day month = 44,640 min."}}, {"name": {"en": "Availability from measurements"}, "f": "A = uptime / (uptime + downtime) x 100 %", "terms": {"en": "Use the same observation window for both terms, otherwise the figure is meaningless."}}, {"name": {"en": "Composite availability"}, "f": "A(total) = A1 x A2 x ... (independent parts in series)", "terms": {"en": "Two 99.9 % components in series give about 99.8 %: chaining services lowers availability."}}, {"name": {"en": "Redundancy"}, "f": "A(pair) = 1 - (1 - A)^2", "terms": {"en": "Two independent 99 % paths give 99.99 %: redundancy raises availability only if the failure modes are independent."}}]}, {"title": {"en": "Cost and sizing formulas"}, "items": [{"name": {"en": "Break-even"}, "f": "months = purchase / (cloud monthly - on-prem monthly)", "terms": {"en": "Only valid when both options deliver the same capacity and service level."}}, {"name": {"en": "Growth"}, "f": "V(n) = V0 x (1 + g)^n", "terms": {"en": "Storage and telemetry planning; multiply by the per-GB-month rate for the bill."}}, {"name": {"en": "Egress"}, "f": "cost = GB out x rate per GB", "terms": {"en": "Inbound traffic is usually free; outbound is billed. Check the current rate in the provider's price list before quoting."}}, {"name": {"en": "Consolidation"}, "f": "used vCPU = servers x vCPU x utilisation", "terms": {"en": "Add 30-50 % headroom before choosing the instance size; a consolidated host is a single point of failure."}}]}, {"title": {"en": "Unit 1 in one line each"}, "items": [{"name": {"en": "Five characteristics"}, "f": "self-service, broad access, pooling, elasticity, measured", "terms": {"en": "All five are required; four out of five is hosting."}}, {"name": {"en": "Three service models"}, "f": "SaaS, PaaS, IaaS", "terms": {"en": "Unit 3. The split decides who patches the operating system."}}, {"name": {"en": "Four deployment models"}, "f": "public, private, hybrid, community", "terms": {"en": "Unit 2. The split decides who shares the infrastructure."}}, {"name": {"en": "Unit 1 sequence"}, "f": "definition → ideas → traits → limits → uses", "terms": {"en": "Answer structure: definition first, then characteristics, then challenges, then applications, then risks."}}]}], "numericals": [{"id": "cc1n1", "q": {"en": "A provider promises 99.9 % availability for one year. How much downtime does that allow, in minutes and in hours?"}, "a": {"en": "<h4>Given and assumptions</h4><p>Availability = 99.9 %; one year = 365 days; a year has 365 x 24 x 60 = 525,600 minutes. Treat the promise as the whole allowed budget for the year.</p><h4>Formula</h4><p>Allowed downtime = (100 % - availability) x total minutes</p><h4>Step-by-step solution</h4><ol><li>Unavailability = 100 % - 99.9 % = 0.1 % = 0.001</li><li>Downtime = 0.001 x 525,600 = 525.6 minutes</li><li>525.6 / 60 = 8.76 hours</li></ol><h4>Interpretation and check</h4><p><b>About 526 minutes, that is 8.76 hours, per year.</b> Check: 8.76 h is a little over one working day, which matches the rule of thumb that each additional 9 in the SLA removes roughly 90 % of the allowed downtime.</p>"}}, {"id": "cc1n2", "q": {"en": "An exam portal is contracted at 99.95 % for a 30-day month. What downtime is permitted?"}, "a": {"en": "<h4>Given and assumptions</h4><p>Availability = 99.95 %; month = 30 days = 30 x 24 x 60 = 43,200 minutes.</p><h4>Formula</h4><p>Allowed downtime = (1 - 0.9995) x 43,200</p><h4>Step-by-step solution</h4><ol><li>Unavailability = 0.0005</li><li>Downtime = 0.0005 x 43,200 = 21.6 minutes</li></ol><h4>Interpretation and check</h4><p><b>21.6 minutes per month.</b> One unplanned 25-minute outage already exceeds the monthly budget, so a result-day deployment needs tested failover rather than a better promise.</p>"}}, {"id": "cc1n3", "q": {"en": "Complete the table for a 30-day month: 99 %, 99.5 %, 99.9 %, 99.95 % and 99.99 % availability, in minutes of allowed downtime."}, "a": {"en": "<h4>Given and assumptions</h4><p>30-day month = 43,200 minutes. Downtime = (1 - availability) x 43,200.</p><h4>Step-by-step solution</h4><table><tr><th>Availability</th><th>Unavailability</th><th>Allowed downtime</th></tr><tr><td>99 %</td><td>0.01</td><td>432 min (7.2 h)</td></tr><tr><td>99.5 %</td><td>0.005</td><td>216 min (3.6 h)</td></tr><tr><td>99.9 %</td><td>0.001</td><td>43.2 min</td></tr><tr><td>99.95 %</td><td>0.0005</td><td>21.6 min</td></tr><tr><td>99.99 %</td><td>0.0001</td><td>4.32 min</td></tr></table><h4>Interpretation and check</h4><p>Each nine divides the allowance by about ten. Check: 43,200 x 0.001 = 43.2, and 43,200 x 0.0001 = 4.32, so the trend is consistent.</p>"}}, {"id": "cc1n4", "q": {"en": "A college can buy a server for 90,000 and run it for 3,000 per month, or rent an equivalent cloud service for 8,000 per month with no purchase. Find the break-even period."}, "a": {"en": "<h4>Given and assumptions</h4><p>Purchase = 90,000 (one time); on-premises running cost = 3,000 per month; cloud = 8,000 per month. Ignore hardware refresh, staff time and failure risk; both options deliver the same capacity.</p><h4>Formula</h4><p>Break-even months = purchase price / (cloud monthly cost - on-premises monthly cost)</p><h4>Step-by-step solution</h4><ol><li>Monthly difference = 8,000 - 3,000 = 5,000</li><li>Break-even = 90,000 / 5,000 = 18 months</li></ol><h4>Interpretation and check</h4><p><b>18 months.</b> If the server is genuinely used for three years, ownership saves 5,000 x 18 = 90,000 after the break-even. If the workload is idle for two thirds of the year, the comparison should be made against a smaller cloud instance instead - the assumption, not the arithmetic, decides the answer.</p>"}}, {"id": "cc1n5", "q": {"en": "A project stores 4 TB today, growing 25 % per year. Cloud storage costs 1.50 per GB-month (1 TB = 1,000 GB). Find the monthly storage cost after two years."}, "a": {"en": "<h4>Given and assumptions</h4><p>Initial volume = 4 TB; growth = 25 % per year for 2 years; rate = 1.50 per GB-month; decimal multiples (1 TB = 1,000 GB).</p><h4>Formula</h4><p>Volume after n years = 4 x (1.25)^n TB; cost = volume in GB x rate</p><h4>Step-by-step solution</h4><ol><li>Year 1: 4 x 1.25 = 5 TB = 5,000 GB</li><li>Year 2: 5 x 1.25 = 6.25 TB = 6,250 GB</li><li>Cost = 6,250 x 1.50 = 9,375 per month</li></ol><h4>Interpretation and check</h4><p><b>9,375 per month</b> after two years, against 6,000 for the first year's 4 TB. Check: 6.25/4 = 1.5625 = 1.25 squared, so the volume grew 56.25 % in two years and the bill grew by the same factor. Archive tiers and lifecycle rules control this line.</p>"}}, {"id": "cc1n6", "q": {"en": "A media project serves 1.5 TB of egress per month at 4.20 per GB. Find the monthly and yearly egress cost."}, "a": {"en": "<h4>Given and assumptions</h4><p>Egress = 1.5 TB per month = 1,500 GB; rate = 4.20 per GB; 12 months.</p><h4>Formula</h4><p>Monthly cost = GB x rate; yearly cost = monthly x 12</p><h4>Step-by-step solution</h4><ol><li>Monthly = 1,500 x 4.20 = 6,300</li><li>Yearly = 6,300 x 12 = 75,600</li></ol><h4>Interpretation and check</h4><p><b>6,300 per month, 75,600 per year.</b> Check the order of magnitude: 4.2 per GB means roughly 4,200 per TB, and 1.5 TB x 4,200 = 6,300. Serving media through a CDN with a committed plan, or compressing it, usually moves this line more than any compute decision.</p>"}}, {"id": "cc1n7", "q": {"en": "Eight servers each have 8 vCPU and average 12 % utilisation. How much capacity is actually used, and what instance size replaces the estate with 40 % headroom?"}, "a": {"en": "<h4>Given and assumptions</h4><p>8 servers x 8 vCPU = 64 vCPU installed; average utilisation 12 %; headroom factor 1.4 before choosing the instance; assume the workload can be consolidated onto one host.</p><h4>Formula</h4><p>Used capacity = servers x vCPU x utilisation; required = used x headroom</p><h4>Step-by-step solution</h4><ol><li>Installed = 8 x 8 = 64 vCPU</li><li>Used = 64 x 0.12 = 7.68 vCPU</li><li>Required with headroom = 7.68 x 1.4 = 10.75, so choose a 12 vCPU instance</li><li>Capacity retired = 64 - 12 = 52 vCPU (81 %)</li></ol><h4>Interpretation and check</h4><p><b>7.68 vCPU are doing the work; a 12 vCPU instance replaces 64.</b> The saving is real, but the consolidated host is now a single point of failure: keep a second instance or a tested restore path before switching off the old servers.</p>"}}, {"id": "cc1n8", "q": {"en": "A hydrogen plant has 2,000 sensors, each sending one 8-byte sample per minute. Find the raw telemetry volume per day and per 30-day month, and its storage cost at 1.50 per GB-month."}, "a": {"en": "<h4>Given and assumptions</h4><p>Sensors = 2,000; rate = 1 sample per minute; payload = 8 bytes; 1 day = 1,440 minutes; month = 30 days; 1 GB = 1,000,000,000 bytes (decimal); ignore protocol and index overhead.</p><h4>Formula</h4><p>Samples per day = sensors x samples per minute x 1,440; bytes = samples x 8</p><h4>Step-by-step solution</h4><ol><li>Samples per day = 2,000 x 1,440 = 2,880,000</li><li>Bytes per day = 2,880,000 x 8 = 23,040,000 B = 23.04 MB</li><li>Bytes per month = 23.04 x 30 = 691.2 MB = 0.6912 GB</li><li>Monthly storage cost = 0.6912 x 1.50 = about 1.04</li></ol><h4>Interpretation and check</h4><p><b>23.04 MB per day, 691.2 MB per month, about 1.04 per month to store raw.</b> The lesson is that raw telemetry is not the cost driver: the time-series index, replication, long retention and the dashboards that query it usually cost far more than the bytes themselves.</p>"}}], "viva": [{"title": {"en": "Basics and definitions"}, "items": [{"q": {"en": "Define cloud computing."}, "a": {"en": "A model that provides on-demand network access to a shared pool of configurable computing resources which can be provisioned and released rapidly with minimal management effort."}}, {"q": {"en": "Is cloud computing the same as the Internet?"}, "a": {"en": "No. The Internet is the transport; cloud computing is computing delivered as a metered service over that transport."}}, {"q": {"en": "Name the five essential characteristics."}, "a": {"en": "On-demand self-service, broad network access, resource pooling, rapid elasticity and measured service."}}, {"q": {"en": "What is resource pooling?"}, "a": {"en": "Provider hardware is shared by many consumers, with the exact physical location hidden from them and isolation enforced by the platform."}}, {"q": {"en": "What is measured service?"}, "a": {"en": "Usage of compute, storage and network is metered automatically and billed, so cost depends on what is consumed."}}, {"q": {"en": "Give four central ideas behind cloud computing."}, "a": {"en": "Virtualization, resource pooling, elasticity and self-service, with automation and metered billing supporting them."}}]}, {"title": {"en": "Characteristics and limits"}, "items": [{"q": {"en": "Is elasticity the same as unlimited capacity?"}, "a": {"en": "No. Quotas, account limits and budget bound elasticity; a reached quota behaves like a full server."}}, {"q": {"en": "Why is colocation not cloud computing?"}, "a": {"en": "The customer owns and manages the hardware, so there is no pooling, self-service or measured compute."}}, {"q": {"en": "What is multi-tenancy?"}, "a": {"en": "Several customers share the same physical resources while the platform keeps their workloads isolated."}}, {"q": {"en": "Can a private cloud be cloud computing?"}, "a": {"en": "Yes, if it provides the same self-service, pooling, elasticity and measured service inside one organisation."}}, {"q": {"en": "Name two supporting traits that are not among the five."}, "a": {"en": "Multi-tenancy and resilience, together with automation and metered billing detail."}}]}, {"title": {"en": "Challenges and risks"}, "items": [{"q": {"en": "Give three technical challenges of cloud computing."}, "a": {"en": "Dependence on connectivity, latency and bandwidth limits, and migration or integration complexity with legacy systems."}}, {"q": {"en": "What is vendor lock-in?"}, "a": {"en": "Dependence on a provider's proprietary services and APIs that makes moving the workload expensive or impractical."}}, {"q": {"en": "What does shared responsibility mean?"}, "a": {"en": "The provider secures the infrastructure and platform; the customer secures data, identities, configuration and application code."}}, {"q": {"en": "Name four common cloud security risks."}, "a": {"en": "Misconfiguration, compromised accounts, insecure APIs and data loss by deletion or failed migration."}}, {"q": {"en": "Why is a public storage bucket a customer problem, not a provider problem?"}, "a": {"en": "Configuration and access policy belong to the customer; the provider's certification does not make a public bucket compliant."}}, {"q": {"en": "What is a data-residency requirement?"}, "a": {"en": "A legal or policy rule that data must be stored or processed in a stated jurisdiction, which fixes the region choice."}}]}, {"title": {"en": "Applications and cost"}, "items": [{"q": {"en": "Why do colleges suit cloud hosting?"}, "a": {"en": "Their load is spiky - result-day and admission peaks - so paying for peak capacity all year would be wasteful."}}, {"q": {"en": "Give one cloud application in agriculture and one in health."}, "a": {"en": "Agriculture: weather and mandi advisories; health: telemedicine records and imaging archives."}}, {"q": {"en": "How is cloud used in a green-hydrogen plant?"}, "a": {"en": "Sensor telemetry is ingested and stored centrally, analysed for efficiency and predictive maintenance, and shown on remote dashboards; safety control stays local."}}, {"q": {"en": "What is a break-even calculation used for?"}, "a": {"en": "It finds the number of months after which an owned server becomes cheaper than a recurring cloud bill."}}, {"q": {"en": "Why is egress often the surprising line on a cloud bill?"}, "a": {"en": "Inbound traffic is usually free but outbound transfer is billed per GB, so popularity increases cost directly."}}, {"q": {"en": "When is cloud a poor choice?"}, "a": {"en": "Hard real-time control, strict localisation, stable fully-used hardware, unreliable connectivity, or an organisation unable to monitor a metered bill."}}]}], "exam_questions": [{"q": {"en": "Practice: Define cloud computing and explain the five essential characteristics with one example each."}, "marks": 7}, {"q": {"en": "Practice: Differentiate cloud computing from traditional on-premises computing (any four points)."}, "marks": 4}, {"q": {"en": "Practice: Explain the central ideas behind cloud computing."}, "marks": 4}, {"q": {"en": "Practice: What is multi-tenancy? Why does it create both savings and risk?"}, "marks": 3}, {"q": {"en": "Practice: Explain any four challenges of cloud computing and one mitigation for each."}, "marks": 7}, {"q": {"en": "Practice: Describe the shared responsibility model for IaaS with a layer table."}, "marks": 7}, {"q": {"en": "Practice: List five cloud security risks and the control for each."}, "marks": 4}, {"q": {"en": "Practice: Explain three novel applications of cloud computing."}, "marks": 4}, {"q": {"en": "Practice: State four advantages and three disadvantages of cloud computing."}, "marks": 4}, {"q": {"en": "Practice: A provider offers 99.9 % availability. Compute the allowed downtime per year and comment."}, "marks": 3}, {"q": {"en": "Practice: A server costs 90,000 plus 3,000 per month; the cloud equivalent is 8,000 per month. Find the break-even and interpret it."}, "marks": 4}, {"q": {"en": "Practice: When should an organisation avoid moving a workload to the cloud?"}, "marks": 3}], "learning_outcomes": [{"en": "CO1: Describe the principles and paradigm of cloud computing."}], "practical_numbers": [1], "content_kind": "theory", "lesson_count": 20, "answered_practice_count": 12, "assessment_note": {"en": "Official course: theory ESE 70 + PA 30, practical PA 20 + ESE 30 = 150 marks, 4 credits. Practice-question marks (3/4/7) are suggested revision sizes, not official GTU allocations or a guaranteed paper pattern. Model answers are in Notes section 8."}, "question_provenance": "Original answered revision questions; not official past papers", "question_marks_are_suggested": true, "sources": [{"title": "GTU DI04000041, Cloud Computing, Semester 4, w.e.f. 2025-26 (uploaded syllabus)", "url": "https://s3-ap-southeast-1.amazonaws.com/gtusitecirculars/Syallbus/DI04000041.pdf"}, {"title": "NIST SP 800-145, The NIST Definition of Cloud Computing", "url": "https://csrc.nist.gov/pubs/sp/800/145/final"}, {"title": "NIST CSRC glossary: cloud computing", "url": "https://csrc.nist.gov/glossary/term/cloud_computing"}, {"title": "Amazon Web Services - Overview of Amazon Web Services (service categories)", "url": "https://docs.aws.amazon.com/whitepapers/latest/aws-overview/"}, {"title": "Microsoft Azure - Azure Architecture Center (cloud design patterns)", "url": "https://learn.microsoft.com/en-us/azure/architecture/"}, {"title": "Google Cloud - Google Cloud overview (regions, zones, shared responsibility)", "url": "https://cloud.google.com/docs/overview"}]};
const SVG = {"cc1_terms": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 392\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"392\" fill=\"#ffffff\"/><text x=\"180\" y=\"28.9\" font-size=\"14\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">Three words, one service</text><text x=\"180\" y=\"49.7\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">The cloud is a delivery model, not the Internet</text><rect x=\"18.0\" y=\"66.0\" width=\"324\" height=\"60\" rx=\"7\" fill=\"#EAF3FD\" stroke=\"#1565C0\" stroke-width=\"1.6\"/><text x=\"180\" y=\"93.3\" font-size=\"11.6\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">CLOUD</text><text x=\"180\" y=\"106.9\" font-size=\"11.6\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">Remote resources in a provider data centre</text><path d=\"M180 126 L180 160\" fill=\"none\" stroke=\"#7B2CD9\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polygon points=\"180.0,160.0 183.5,153.0 176.5,153.0\" fill=\"#7B2CD9\"/><rect x=\"18.0\" y=\"160.0\" width=\"324\" height=\"60\" rx=\"7\" fill=\"#F2EBFA\" stroke=\"#7B2CD9\" stroke-width=\"1.6\"/><text x=\"180\" y=\"187.3\" font-size=\"11.6\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">COMPUTING</text><text x=\"180\" y=\"200.9\" font-size=\"11.6\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">Processing, storage and network</text><path d=\"M180 220 L180 254\" fill=\"none\" stroke=\"#7B2CD9\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polygon points=\"180.0,254.0 183.5,247.0 176.5,247.0\" fill=\"#7B2CD9\"/><rect x=\"18.0\" y=\"254.0\" width=\"324\" height=\"60\" rx=\"7\" fill=\"#EAF6EC\" stroke=\"#2E7D32\" stroke-width=\"1.6\"/><text x=\"180\" y=\"281.3\" font-size=\"11.4\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">CLOUD COMPUTING</text><text x=\"180\" y=\"294.7\" font-size=\"11.4\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">On demand, pooled, elastic, metered</text><text x=\"180\" y=\"363.6\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">Shared pool + network access + rapid provisioning.</text></svg>", "cc1_central": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 508\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"508\" fill=\"#ffffff\"/><text x=\"180\" y=\"28.9\" font-size=\"14\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">Six ideas that carry the model</text><text x=\"180\" y=\"49.7\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">Remove one and the economics collapses</text><rect x=\"18\" y=\"66\" width=\"324\" height=\"58\" rx=\"8\" fill=\"#EAF3FD\" stroke=\"#1565C0\" stroke-width=\"1.6\"/><text x=\"180\" y=\"92.2\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1565C0\" font-weight=\"bold\">1. Resource pooling</text><text x=\"180\" y=\"108.7\" font-size=\"10.7\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">One hardware pool serves many customers</text><rect x=\"18\" y=\"134\" width=\"324\" height=\"58\" rx=\"8\" fill=\"#F2EBFA\" stroke=\"#7B2CD9\" stroke-width=\"1.6\"/><text x=\"180\" y=\"160.2\" font-size=\"12\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">2. Virtualization</text><text x=\"180\" y=\"176.7\" font-size=\"10.7\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">A hypervisor slices host into isolated VMs</text><rect x=\"18\" y=\"202\" width=\"324\" height=\"58\" rx=\"8\" fill=\"#EAF6EC\" stroke=\"#2E7D32\" stroke-width=\"1.6\"/><text x=\"180\" y=\"228.2\" font-size=\"12\" text-anchor=\"middle\" fill=\"#2E7D32\" font-weight=\"bold\">3. Elasticity</text><text x=\"180\" y=\"244.7\" font-size=\"10.7\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">Capacity follows load, up and down</text><rect x=\"18\" y=\"270\" width=\"324\" height=\"58\" const L = k => STR[S.lang][k];

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const KW = new Set('auto break case const continue default do else enum extern for goto if register return signed sizeof static struct switch typedef union unsigned volatile while'.split(' '));

const PKW = new Set('False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield'.split(' '));
const PTY = new Set('int float str bool list tuple set dict complex frozenset bytes bytearray range object'.split(' '));
function hlPy(src){
  const re = /(#[^\n]*)|((?:\b[rRbBfFuU]{1,2})?(?:'{3}[\s\S]*?'{3}|"{3}[\s\S]*?"{3}|'(?:\\.|[^'\\\n])*'|"(?:\\.|[^"\\\n])*"))|(^>>>|^\.\.\.(?= ))|([A-Za-z_]\w*)(?=\s*\()|([A-Za-z_]\w*)|(\b(?:0[xXoObB][0-9a-fA-F_]+|\d[\d_]*(?:\.\d+)?(?:[eE][-+]?\d+)?j?)\b)/gm;
  let o='', last=0, m;
  while ((m = re.exec(src))){
    o += esc(src.slice(last, m.index)); last = re.lastIndex;
    const w = esc(m[0]);
    if (m[1]) o += `<span class="cm">${w}</span>`;
    else if (m[2]) o += `<span class="st">${w}</span>`;
    else if (m[3]) o += `<span class="pp">${w}</span>`;
    else if (m[4]) o += PKW.has(m[4]) ? `<span class="kw">${w}</span>` : PTY.has(m[4]) ? `<span class="ty">${w}</span>` : `<span class="fn">${w}</span>`;
    else if (m[5]) o += PKW.has(m[5]) ? `<span class="kw">${w}</span>` : PTY.has(m[5]) ? `<span class="ty">${w}</span>` : w;
    else o += `<span class="nu">${w}</span>`;
  }
  return o + esc(src.slice(last));
}

  const re = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(^[ \t]*#[^\n]*)|([A-Za-z_]\w*)(?=\s*\()|([A-Za-z_]\w*)|(\b\d+(?:\.\d+)?[fFlLuU]*\b)/gm;

    o += esc(src.slice(last, m.index)); last = re.lastIndex;
    const w = esc(m[0]);
    if (m[1]) o += `<span class="cm">${w}</span>`;

function notes(){

function render(){
  document.getElementById('title').textContent = `${L('unit')} ${U.unit}: ${t(U.title)}`;

  document.getElementById('view').innerHTML = VIEWS[S.tab]();

let zoom = 1;
function setZoom(z){ zoom = Math.min(4, Math.max(1, z)); const w=document.getElementById('zw'); w.style.width=(zoom*100)+'%'; document.getElementById('zr').textContent=Math.round(zoom*100)+'%'; }
document.addEventListener('click', e=>{
  const q = e.target.closest('.q'); if (q && q.parentElement.querySelector('.a')) { q.parentElement.classList.toggle('open'); return; }
  const tb = e.target.closest('[data-tab]'); if (tb){ S.tab = tb.dataset.tab; render(); window.scrollTo(0,0); return; }
