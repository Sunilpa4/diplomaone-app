<script>
const U = {"subject": "DI01000111", "unit": 4, "format": "notes", "title": {"en": "Projections of Planes"}, "hours": 4, "weightage": 10, "official": true, "languages": ["en"], "tabs": ["notes", "diagrams", "equations", "viva", "exam"], "intro_text": {"en": "Unit 4 of Engineering Graphics: the projections of a flat surface. One rule carries the whole unit - a plane parallel to a reference plane shows its true shape there and an edge in the other view, and a tilted plane shows its edge in one view and an apparent shape in the other, shortened by the cosine of the tilt. Square, hexagonal and circular planes are each built step by step in every position the syllabus asks for, including the two-stage method for a plane inclined to both planes, and six solved problems follow in section 2."}, "notes": [{"title": {"en": "1. How a Plane Looks in the Two Views"}, "items": [{"h": {"en": "4.1 Edge view or true shape - the one rule of this unit"}, "body": {"en": "<h4>A plane is shown by its boundary</h4><p>A square, a hexagon or a circle is drawn as what it is, a flat area, and the two views are the boundary seen from the front and from above. The whole unit rests on one rule: <b>a plane parallel to a reference plane is seen in its true shape in that view, and as a straight edge in the other view</b>.</p><table><tr><th>position of the plane</th><th>elevation</th><th>plan</th></tr><tr><td>parallel to HP</td><td>edge, parallel to XY</td><td>true shape</td></tr><tr><td>parallel to VP</td><td>true shape</td><td>edge, parallel to XY</td></tr><tr><td>perpendicular to both HP and VP</td><td>edge, square to XY</td><td>edge, square to XY</td></tr><tr><td>perpendicular to VP, inclined to HP</td><td>edge at the true angle</td><td>apparent shape</td></tr><tr><td>perpendicular to HP, inclined to VP</td><td>apparent shape</td><td>edge at the true angle</td></tr><tr><td>inclined to both HP and VP</td><td>apparent shape</td><td>apparent shape</td></tr></table><h4>Construction, step by step</h4><ol><li>Draw XY and decide, from the words of the question, which reference plane the plane is parallel or perpendicular to.</li><li>Draw the view that shows the edge first - that is the view of the plane the surface is perpendicular to - as one straight line.</li><li>Project every corner from the edge view into the other view with thin projectors square to XY.</li><li>Complete the apparent shape by setting off the dimension along the hinge line true and the dimension across it multiplied by the cosine of the angle.</li><li>Ink the two views, keep the projectors and the hinge line thin, and write the two dimensions beside the apparent shape.</li></ol><h4>The three words you will use</h4><ul><li><b>Edge view</b> - the view in which the plane collapses to a line; it appears in the view of the plane the surface is perpendicular to.</li><li><b>True shape</b> - the outline with no foreshortening, seen only when the plane is parallel to that reference plane.</li><li><b>Apparent shape</b> - the foreshortened outline: one dimension true, the other multiplied by the cosine of the angle of tilt.</li></ul><p><b>Why it works.</b> A plane has no thickness, so a line of sight lying in the plane sees the whole surface as its own edge; a line of sight square to the plane sees the surface without foreshortening. Those two directions are the two reference planes.</p><p><b>Common mistake.</b> Drawing the apparent shape with both dimensions true. Only the dimension parallel to the hinge (the line where the plane meets the reference plane) keeps its full size.</p>"}, "diagram": "u4_basic", "syllabus_item": "4.1"}, {"h": {"en": "4.1 Square plane perpendicular to VP, inclined to HP"}, "body": {"en": "<h4>Square ABCD, side 50 mm, 40 degrees to HP, side AB in HP</h4><p>The plane is perpendicular to VP, so the VP looks along it and the <b>elevation is the edge</b>. The plane rises at 40 degrees, so the edge is drawn at 40 degrees to XY, and the side that lies in the plane and faces VP is seen there at its true length of 50 mm.</p><h4>Construction, step by step</h4><ol><li>Draw XY. Put a' and b' on XY, because A and B lie in HP and a point in HP has its elevation on XY; they share one point because AB is square to VP.</li><li>From that point draw the edge a'd' 50 mm long at 40 degrees to XY - this single line is the whole elevation.</li><li>Project a' and d' down to the plan with thin lines square to XY.</li><li>Set A 20 mm in front of VP on its projector; that fixes the plan's position below XY.</li><li>From a set off 50 cos 40 = 38.3 mm along XY to reach d, and 50 mm square to XY to reach b - the side AB has no tilt, so it keeps its 50 mm.</li><li>Complete the rectangle a b c d, ink it, and check that its sides are 50 mm across the depth and 38.3 mm along XY.</li></ol><h4>Numbers to write on the drawing</h4><ul><li>Edge view: 50 mm at 40 degrees to XY, and the far corners stand 50 sin 40 = 32.1 mm above HP.</li><li>Plan: 50 mm square to XY (true) and 38.3 mm along XY (shortened).</li><li>Every corner keeps the depth it had in the edge view, so the plan's depth side is parallel to XY.</li><li>The area of the plan is 38.3 / 50 = 76.6 per cent of the true area, the cosine of the angle.</li></ul><p><b>Why it works.</b> A tilt about a horizontal hinge cannot change any distance measured along the hinge, so that dimension stays true; the dimension measured across the hinge is foreshortened by the cosine of the tilt. The elevation holds the edge, so the tilt itself is drawn true.</p><p><b>Common mistake.</b> Putting the edge in the plan. The edge belongs to the view of the plane the surface is perpendicular to - here VP, so the elevation.</p>"}, "diagram": "u4_edge_vp", "syllabus_item": "4.1"}, {"h": {"en": "4.1 Hexagonal plane perpendicular to HP, inclined to VP"}, "body": {"en": "<h4>Regular hexagon, 30 mm side, 45 degrees to VP</h4><p>Now the plane is perpendicular to HP, so HP looks along it and the <b>plan is the edge</b>, drawn at 45 degrees to XY. The elevation is the apparent hexagon: the width across the corners parallel to the hinge stays 60 mm, and the other dimension is multiplied by cos 45.</p><h4>Construction, step by step</h4><ol><li>Draw the true hexagon first on a scrap of the sheet, or draw XY and keep the hexagon's centre and its 30 mm radius in mind: side 30 mm means circumradius 30 mm, across corners 60 mm, across flats 51.96 mm.</li><li>In the plan draw the edge as one line at 45 degrees to XY, long enough to carry the 60 mm across corners.</li><li>Mark the six corners on that edge line at their true distances, measured along the edge from the corner nearest VP.</li><li>Project each corner up, square to XY.</li><li>In the elevation set each corner's height at its true distance from the hinge line multiplied by cos 45 = 0.707: the 30 mm apothem becomes 21.2 mm, so the apparent hexagon is 42.4 mm wide and 52 mm from flat to flat.</li><li>Join the six points and ink the apparent hexagon, leaving the edge and the projectors thin.</li></ol><h4>Sizes to predict</h4><table><tr><th>dimension</th><th>true hexagon</th><th>apparent hexagon at 45 deg</th></tr><tr><td>across corners</td><td>60 mm</td><td>60 mm (parallel to the hinge)</td></tr><tr><td>across flats</td><td>51.96 mm</td><td>51.96 mm (parallel to the hinge)</td></tr><tr><td>thickness across the hinge</td><td>60 mm</td><td>60 cos 45 = 42.4 mm</td></tr></table><p><b>Why it works.</b> The hexagon is a polygon like any other: the tilt squeezes one direction only, and because the tilt is about a line parallel to XY that direction is measured square to the hinge. Every vertex moves towards the hinge line by the same factor, so the sides parallel to the hinge keep their length and the rest shorten in proportion.</p><p><b>Common mistake.</b> Using cos 45 on every dimension. Anything measured along the hinge is unchanged; only the distance from the hinge shortens.</p>"}, "diagram": "u4_edge_hp", "syllabus_item": "4.1"}, {"h": {"en": "4.1 Circular plane inclined to HP - the ellipse"}, "body": {"en": "<h4>Circle of 60 mm diameter, perpendicular to VP, 30 degrees to HP</h4><p>A circle has no corners to project, so the apparent shape is built point by point: divide the circle, project each division to the other view and set its distance from the hinge off at cos 30. The result is an <b>ellipse</b> with the major axis equal to the diameter, 60 mm, and the minor axis 60 cos 30 = 51.96 mm.</p><h4>Construction, step by step</h4><ol><li>Draw XY and the elevation as the edge: a line 60 mm long at 30 degrees to XY, the elevation of the diameter that faces VP.</li><li>Divide the diameter in the plan, or divide a semicircle, into twelve equal parts and draw ordinates to the circle.</li><li>Project each ordinate up to the edge view: every point of the circle lies on one of these projectors.</li><li>In the plan, set each point's distance from the hinge line off at d cos 30 from the line through the centre, on both sides.</li><li>Join the points with a French curve: the ellipse 60 mm by 52 mm, with the 60 mm axis along the hinge and the 52 mm axis square to it.</li></ol><h4>Predicting the apparent shape</h4><table><tr><th>true shape</th><th>apparent shape at angle t to the other plane</th></tr><tr><td>circle of diameter d</td><td>ellipse d x d cos t</td></tr><tr><td>square of side a</td><td>rectangle a x a cos t</td></tr><tr><td>hexagon across corners 2R</td><td>hexagon squeezed to 2R cos t across the hinge</td></tr><tr><td>any shape</td><td>same shape with one dimension multiplied by cos t</td></tr></table><p><b>Why it works.</b> Every point of the circle is at a different height, and the plan shows the height only through the foreshortened ordinate. The longest ordinate is the diameter square to the hinge and it shortens by cos t, which is exactly what makes the ellipse.</p><p><b>Check before you ink.</b> The plan's long axis must equal the true diameter and must lie parallel to the hinge; the short axis is the cosine-shrunk one. If the ellipse is longer than 60 mm anywhere, a distance was measured from the wrong line.</p><p><b>Common mistake.</b> Drawing a circle in the plan because the object is a circle. The plan shows what the eye sees from above, and at 30 degrees that is an ellipse.</p>"}, "diagram": "u4_circle", "syllabus_item": "4.1"}, {"h": {"en": "4.1 Plane inclined to both HP and VP - the two-stage method"}, "body": {"en": "<h4>Square 50 mm, 45 degrees to HP and 30 degrees to VP</h4><p>When the plane is inclined to both reference planes, neither view can be the edge and neither can be the true shape, so the drawing is made in two stages, exactly as a line is: <b>stage 1</b> makes the plane perpendicular to VP so that the edge shows in the elevation, and <b>stage 2</b> swings the plan to the second angle, reading the final elevation off the locus lines.</p><h4>Construction, step by step</h4><ol><li>Draw XY and, in the elevation, the edge of the square at 45 degrees to XY with the side 50 mm long.</li><li>Project down and complete the intermediate plan: 50 mm across the depth, 50 cos 45 = 35.4 mm along XY - this plan is the apparent shape for the first angle only.</li><li>Stage 2: with the corner on the hinge as centre, swing the whole intermediate plan through 30 degrees, so that the side which was parallel to XY now makes 30 degrees with XY.</li><li>Draw the locus lines: horizontals through each corner of the stage-1 elevation, because a swing about a vertical axis cannot change a height.</li><li>Raise projectors from the swung plan and cut the loci to get the final elevation.</li><li>Ink the final plan and the final elevation and leave stage 1, the swing and the loci thin and dashed.</li></ol><h4>What is preserved at each stage</h4><table><tr><th>quantity</th><th>stage 1</th><th>after the swing</th></tr><tr><td>length of a side</td><td>true, 50 mm</td><td>true, unchanged by the swing</td></tr><tr><td>height of each corner</td><td>50 sin 45 = 35.4 mm</td><td>unchanged - the swing is about a vertical axis</td></tr><tr><td>dimension along XY</td><td>35.4 mm</td><td>35.4 cos 30 = 30.6 mm</td></tr><tr><td>dimension across the depth</td><td>50 mm</td><td>50 cos 30 with the 35.4 kept</td></tr></table><p><b>Why it works.</b> The two stages separate the two tilts. Stage 1 tilts the plane about a hinge in HP, which changes heights and leaves the along-XY dimension honest; stage 2 rotates about a vertical axis, which changes depths and leaves every height exactly where stage 1 put it.</p><p><b>Check before you ink.</b> Each final corner must sit on its own horizontal locus, at the same height as the corner in stage 1. If a corner has moved up or down, the swing was made about a sloping axis instead of a vertical one.</p><p><b>Common mistake.</b> Swinging the plan before the edge view is complete. Finish stage 1 first: an edge view with the true angle is the only reliable start for a plane inclined to both planes.</p>"}, "diagram": "u4_both", "syllabus_item": "4.1"}]}, {"title": {"en": "2. Solved Drawing Problems, Step by Step"}, "items": [{"h": {"en": "Problem 1. A square plane ABCD of side 50 mm is perpendicular to VP and inclined at 40 degrees to HP. The side AB lies in HP and A is 20 mm in front of VP. Draw its projections and state the size of the plan."}, "body": {"en": "<h4>Given</h4><p>Perpendicular to VP gives the edge in the elevation; inclined 40 degrees gives that edge at 40 degrees to XY; the side AB in HP puts the elevations of A and B on XY.</p><h4>Construction, step by step</h4><ol><li>Draw XY and mark a' and b' together on XY, since A and B are in HP and AB is square to VP.</li><li>Draw a'd' 50 mm at 40 degrees to XY - the edge view and the whole elevation.</li><li>Project a' and d' down, square to XY.</li><li>Set a 20 mm below XY (A is 20 mm in front of VP) and mark d on the same level, 50 cos 40 = 38.3 mm along XY from a.</li><li>From a set off 50 mm square to XY to get b, and complete c opposite d.</li><li>Ink the rectangle a b c d and check the sides: 50 mm across the depth, 38.3 mm along XY.</li></ol><h4>The answer</h4><p>The plan is a rectangle 50 mm by 38.3 mm; the elevation is the single edge line 50 mm long at 40 degrees, with the corners d' and c' standing 50 sin 40 = 32.1 mm above HP.</p>"}}, {"h": {"en": "Problem 2. A circular plate of 60 mm diameter is perpendicular to VP and inclined at 30 degrees to HP. Draw its projections and state the axes of the apparent shape."}, "body": {"en": "<h4>Given</h4><p>The edge is in the elevation, 60 mm long at 30 degrees to XY; the plan is the apparent shape, an ellipse.</p><h4>Construction, step by step</h4><ol><li>Draw XY and the edge view 60 mm long at 30 degrees, one end on XY.</li><li>Divide the diameter into twelve equal parts and draw the ordinates.</li><li>Project every ordinate up to the edge view, square to XY.</li><li>Project each point down into the plan and set its depth off at d cos 30 from the centre line.</li><li>Join the twelve points with a French curve, on both sides of the long axis.</li></ol><h4>The answer</h4><p>An ellipse with its major axis 60 mm along the hinge and its minor axis 60 cos 30 = 51.96 mm square to it. The area is 0.866 of the true circle, the cosine of 30 degrees.</p>"}}, {"h": {"en": "Problem 3. A rectangular plate 60 mm by 40 mm is perpendicular to HP and inclined at 35 degrees to VP. Draw its projections and state the sizes of both views."}, "body": {"en": "<h4>Given</h4><p>Perpendicular to HP puts the edge in the plan at 35 degrees to XY; the elevation is the apparent shape with the 40 mm side foreshortened.</p><h4>Construction, step by step</h4><ol><li>Draw XY and, below it, the edge as a line 60 mm long at 35 degrees to XY.</li><li>Mark the two ends of the 40 mm side on that edge line at their true position.</li><li>Project the four corners up, square to XY.</li><li>In the elevation set the heights: the 40 mm side shortens to 40 cos 35 = 32.8 mm, while the 60 mm side stays 60 mm.</li><li>Complete the rectangle a' b' c' d' and ink it.</li></ol><h4>The answer</h4><p>Plan: the edge, 60 mm at 35 degrees. Elevation: a rectangle 60 mm by 32.8 mm. Check that the 60 mm side is the one parallel to the hinge, which is the side that never shortens.</p>"}}, {"h": {"en": "Problem 4. An equilateral triangle of 50 mm side is perpendicular to VP and inclined at 45 degrees to HP, with one side in HP. Draw its projections and state the apparent height."}, "body": {"en": "<h4>Given</h4><p>The edge is in the elevation; the plan is the apparent triangle with its height foreshortened and its base true.</p><h4>Construction, step by step</h4><ol><li>Draw XY and, above it, the edge at 45 degrees to XY with the side that faces VP drawn true.</li><li>Project the three corners down, square to XY.</li><li>Keep the base 50 mm as it is, because the base lies along the hinge.</li><li>Reduce the height by cos 45: the true height is 50 sin 60 = 43.3 mm, so the apparent height is 43.3 x 0.707 = 30.6 mm.</li><li>Join the three points to complete the apparent triangle and ink it.</li></ol><h4>The answer</h4><p>Plan: a triangle of base 50 mm and height 30.6 mm; elevation: the edge at 45 degrees. The true area is halved by the 45 degree tilt, because cos 45 = 0.707 and the area follows the same factor.</p>"}}, {"h": {"en": "Problem 5. A regular hexagonal plate of 30 mm side is perpendicular to HP and inclined at 45 degrees to VP. Draw its projections and give the sizes of the apparent hexagon."}, "body": {"en": "<h4>Given</h4><p>The plan is the edge at 45 degrees; the elevation is the apparent hexagon, squeezed square to the hinge.</p><h4>Construction, step by step</h4><ol><li>Work out the true hexagon first: side 30 mm, circumradius 30 mm, across corners 60 mm, apothem 30 cos 30 = 25.98 mm and across flats 51.96 mm.</li><li>Draw XY and the edge in the plan at 45 degrees to XY, 60 mm long.</li><li>Mark the six corners on the edge line at their true distances from the first corner.</li><li>Project all six up, square to XY.</li><li>In the elevation set the heights using cos 45 = 0.707 on every distance from the hinge: 42.4 mm across the hinge instead of 60 mm, and 18.4 mm instead of the 25.98 mm apothem.</li><li>Join the six points and ink the apparent hexagon.</li></ol><h4>The answer</h4><p>Plan: the edge, 60 mm at 45 degrees. Elevation: a hexagon 60 mm across the corners parallel to the hinge and 42.4 mm across the corners square to it, with the flats 36.8 mm apart. Both views are drawn with thin projectors and the hinge left as a construction line.</p>"}}, {"h": {"en": "Problem 6. A square plane of 50 mm side has one corner in HP and is inclined at 45 degrees to HP and 30 degrees to VP. Draw its projections by the two-stage method."}, "body": {"en": "<h4>Given</h4><p>Inclined to both planes, so neither view is an edge: stage 1 puts the edge in the elevation at 45 degrees, stage 2 swings the plan through 30 degrees.</p><h4>Construction, step by step</h4><ol><li>Draw XY and, in the elevation, the edge of the square at 45 degrees to XY with the side 50 mm, one end on XY.</li><li>Project down and complete the intermediate plan: 50 mm across the depth and 50 cos 45 = 35.4 mm along XY.</li><li>Check the intermediate plan: it is the apparent shape for 45 degrees only.</li><li>Stage 2: with the corner on XY as centre, swing the whole plan through 30 degrees so that the side that was along XY now makes 30 degrees with it.</li><li>Draw horizontal loci through the stage-1 elevations of the corners.</li><li>Raise projectors from the swung plan and cut the loci; join the four points for the final elevation and ink both final views.</li></ol><h4>The answers</h4><p>Final plan: sides 50 mm and 35.4 mm, the long side at 30 degrees to XY, one corner on the hinge. Final elevation: a parallelogram whose corners stand 0, 35.4, 35.4 and 0 mm above HP, because the swing about a vertical axis kept every height. The dimension along XY falls to 35.4 cos 30 = 30.6 mm in the final plan.</p>"}}]}], "diagrams": [{"id": "u4_basic", "title": {"en": "Three positions that show the true shape"}, "file": "diagrams/u4_basic.svg", "caption": {"en": "Parallel to a plane: that view is the true shape, the other is an edge. Perpendicular to both: two edges."}}, {"id": "u4_edge_vp", "title": {"en": "Square plane, edge view in the elevation"}, "file": "diagrams/u4_edge_vp.svg", "caption": {"en": "The elevation collapses to the edge lying at 40 degrees, and the plan keeps 50 mm across but only 38.3 mm along XY."}}, {"id": "u4_edge_hp", "title": {"en": "Hexagonal plane, edge view in the plan"}, "file": "diagrams/u4_edge_hp.svg", "caption": {"en": "Now the plan is the edge at 45 degrees and the elevation is the squeezed hexagon: 60 mm stays 42.4 mm across."}}, {"id": "u4_circle", "title": {"en": "Circular plane inclined to HP"}, "file": "diagrams/u4_circle.svg", "caption": {"en": "A circle seen at an angle is an ellipse: the diameter parallel to the hinge stays 60 mm, the other shortens to 52 mm."}}, {"id": "u4_both", "title": {"en": "Inclined to both planes: two stages"}, "file": "diagrams/u4_both.svg", "caption": {"en": "Stage 1 gives the edge view at the first angle; the plan is then swung to the second angle and the final elevation is read off the locus."}}], "equations": [{"title": {"en": "Foreshortening in an apparent shape"}, "items": [{"name": {"en": "Dimension across the hinge"}, "f": "apparent = true x cos(angle of tilt)", "terms": {"en": "The dimension measured square to the hinge line shortens by the cosine of the angle the plane makes with the reference plane; the dimension along the hinge is unchanged."}}, {"name": {"en": "Edge view length"}, "f": "edge = true length of the side that faces the plane", "terms": {"en": "In the edge view the plane collapses to a line, but that line still carries the true length of the side lying in it, so it is drawn at full size at the true angle to XY."}}, {"name": {"en": "Height of a corner above HP"}, "f": "h = L sin(angle to HP)", "terms": {"en": "A corner at distance L from the hinge rises L sin of the tilt, which is the distance of its elevation from XY."}}]}, {"title": {"en": "The three shapes of the syllabus"}, "items": [{"name": {"en": "Square, side a, tilted t"}, "f": "plan a x a cos(t)", "terms": {"en": "The side parallel to the hinge stays a, the side square to it becomes a cos t, so the plan is always a rectangle."}}, {"name": {"en": "Hexagon, side s, tilted t"}, "f": "across corners 2s, across hinge 2s cos(t)", "terms": {"en": "Circumradius equals the side, so the across-corners dimension is 2s and the apothem 0.866 s; only the dimension square to the hinge shortens."}}, {"name": {"en": "Circle, diameter d, tilted t"}, "f": "ellipse d x d cos(t)", "terms": {"en": "The diameter along the hinge is the major axis and the diameter square to it is the minor axis d cos t, which is why a tilted circle draws as an ellipse."}}, {"name": {"en": "Area of an apparent shape"}, "f": "apparent area = true area x cos(t)", "terms": {"en": "Every element of the area is foreshortened by the same factor, so the whole area follows the cosine - a useful check on a finished drawing."}}]}], "viva": [{"title": {"en": "Edge view and apparent shape"}, "items": [{"q": {"en": "When does a plane appear as a straight line in a view?"}, "a": {"en": "When the plane is perpendicular to the reference plane of that view, because the line of sight then lies in the surface and the whole area collapses on to its own edge. That line is called the edge view."}}, {"q": {"en": "When does a view show the true shape of a plane?"}, "a": {"en": "Only when the plane is parallel to the reference plane of that view, because then the line of sight is square to the surface and nothing is foreshortened. In any other position the outline is the apparent shape."}}, {"q": {"en": "What is the apparent shape and how is it calculated?"}, "a": {"en": "The outline a tilted plane presents: the dimension parallel to the hinge line stays true and the dimension square to the hinge is multiplied by the cosine of the angle of tilt. The area likewise falls to the true area times that cosine."}}, {"q": {"en": "Which view carries the edge when the plane is perpendicular to VP?"}, "a": {"en": "The elevation, because VP is the plane the surface is perpendicular to, so the elevation looks along the plane and shows it as a line at the true angle of tilt. The plan is then the apparent shape."}}]}, {"title": {"en": "Square, hexagon and circle"}, "items": [{"q": {"en": "A square of 50 mm side is tilted 40 degrees to HP. What size is the plan?"}, "a": {"en": "A rectangle 50 mm by 50 cos 40 = 38.3 mm, with the 50 mm side along the hinge. The tilt only shortens the dimension square to the hinge."}}, {"q": {"en": "Why does a circle appear as an ellipse in the plan?"}, "a": {"en": "Because each diameter is foreshortened according to its direction: the diameter parallel to the hinge keeps its length and becomes the major axis, while the diameter square to the hinge shortens to d cos t and becomes the minor axis."}}, {"q": {"en": "A hexagon of 30 mm side has circumradius 30 mm. What is its across-flats size?"}, "a": {"en": "Twice the apothem: 2 x 30 cos 30 = 51.96 mm, while the across-corners size is 2 x 30 = 60 mm. Those two dimensions are the ones quoted in the apparent shape."}}, {"q": {"en": "How do you start a problem where the plane is inclined to both reference planes?"}, "a": {"en": "With the two-stage method. Stage 1 makes the plane perpendicular to VP so the edge appears in the elevation at the first angle; stage 2 swings the plan about a vertical axis through the second angle and the final elevation is read off the locus lines."}}, {"q": {"en": "What must not change during the second stage?"}, "a": {"en": "The heights of the corners, because the swing is about a vertical axis. That is why each corner keeps its own horizontal locus and the new elevation is found where the projector from the swung plan cuts that locus."}}, {"q": {"en": "What check proves a finished plane drawing?"}, "a": {"en": "Every corner must lie on its projector, each view must be the same size in the dimension along the hinge, and the foreshortened dimension must come out as the true dimension times the cosine of the tilt."}}, {"q": {"en": "What is the hinge line of a tilted plane?"}, "a": {"en": "The line in which the plane meets the reference plane it is tilted about - in these problems the line where the surface cuts HP or VP. Every distance measured along that line is unaffected by the tilt, which is why it is the one dimension that stays true in the apparent shape."}}, {"q": {"en": "Why is the edge view drawn at the angle given to the other plane?"}, "a": {"en": "Because the view perpendicular to the plane shows the surface edge-on, and the line of that edge is the surface seen from the side: its slope is exactly the angle the surface makes with the reference plane, so a 40 degree plane draws a 40 degree edge."}}, {"q": {"en": "What happens when a plane is perpendicular to both HP and VP?"}, "a": {"en": "Both views are edges and both are square to XY: the plane stands on the ground like a fence at right angles to the vertical plane, so neither view can see any part of its area, and no dimension appears in its true size except along the edge itself."}}, {"q": {"en": "How would you find the true shape of a plane from an inclined drawing?"}, "a": {"en": "By the auxiliary plane method: draw a new reference line parallel to the edge view, project the corners square to it and set each corner's distance off from the edge line in that new view. The result is the true shape, and the same view gives the true angle of tilt."}}]}], "exam_questions": [{"q": {"en": "A square plane ABCD of side 50 mm is perpendicular to VP and inclined at 40 degrees to HP. The side AB lies in HP and A is 20 mm in front of VP. Draw its projections and state the size of the plan."}, "marks": 5}, {"q": {"en": "A circular plate of 60 mm diameter is perpendicular to VP and inclined at 30 degrees to HP. Draw its projections and state the axes of the apparent shape."}, "marks": 5}, {"q": {"en": "A rectangular plate 60 mm by 40 mm is perpendicular to HP and inclined at 35 degrees to VP. Draw its projections and state the sizes of both views."}, "marks": 5}, {"q": {"en": "An equilateral triangle of 50 mm side is perpendicular to VP and inclined at 45 degrees to HP, with one side in HP. Draw its projections and state the apparent height."}, "marks": 5}, {"q": {"en": "A regular hexagonal plate of 30 mm side is perpendicular to HP and inclined at 45 degrees to VP. Draw its projections and give the sizes of the apparent hexagon."}, "marks": 6}, {"q": {"en": "A square plane of 50 mm side has one corner in HP and is inclined at 45 degrees to HP and 30 degrees to VP. Draw its projections by the two-stage method."}, "marks": 6}], "learning_outcomes": [{"en": "Project a square, hexagonal or circular plane inclined to the reference planes and read its true shape."}], "course_outcomes": ["CO3"], "practical_numbers": [4], "content_kind": "theory", "lesson_count": 5, "answered_practice_count": 6, "assessment_note": {"en": "Official course: theory ESE 70 + PA 30 and practical PA 20 + ESE 30 = 150 marks, 3 credits, 30 teaching hours (2 lecture + 2 practical). This unit carries 20 % weightage, 4 of the 30 hours and 7 of the 70 theory marks (the PDF prints weightage only, so the marks are split by weightage). The solved drawing problems in section 4 are revision constructions with suggested marks, not official GTU papers, and the syllabus allows any valid method in the exam, so the notes show one clear method for each curve and name the alternatives."}, "question_provenance": "Original solved drawing problems written for revision; not official past papers", "question_marks_are_suggested": true, "sources": [{"title": "GTU DI01000111 Engineering Graphics syllabus (uploaded PDF, w.e.f. 2024-25)", "url": "https://syllabus.gtu.ac.in/"}, {"title": "N. D. Bhatt - Elementary Engineering Drawing, Charotar Publishing House, Anand (chapter 11: projections of planes)", "url": "https://www.charotarbookstall.com/"}, {"title": "P. S. Gill - A Text Book of Engineering Drawing, S. K. Kataria & Sons, Delhi (planes inclined to one and to both reference planes)", "url": "https://www.skkatariaandsons.com/"}, {"title": "BIS SP 46 - Engineering drawing practice: apparent shape and edge view", "url": "https://www.bis.gov.in/"}]};
const SVG = {"u4_basic": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 274\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"274\" fill=\"#ffffff\"/><text x=\"180\" y=\"25.3\" font-size=\"12.4\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"bold\">Edge or true shape: the plane decides</text><rect x=\"4.0\" y=\"52\" width=\"112\" height=\"176\" rx=\"6\" fill=\"#FBFCFD\" stroke=\"#9AA3AD\" stroke-width=\"0.9\"/><text x=\"60.0\" y=\"68.7\" font-size=\"7.6\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"bold\">parallel to HP</text><path d=\"M10.0 138.0L110.0 138.0\" fill=\"none\" stroke=\"#222222\" stroke-width=\"0.9\" stroke-linecap=\"round\"/><text x=\"108.0\" y=\"136.1\" font-size=\"6.0\" text-anchor=\"end\" fill=\"#666666\" font-weight=\"normal\">XY</text><rect x=\"124.0\" y=\"52\" width=\"112\" height=\"176\" rx=\"6\" fill=\"#FBFCFD\" stroke=\"#9AA3AD\" stroke-width=\"0.9\"/><text x=\"180.0\" y=\"68.7\" font-size=\"7.6\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"bold\">parallel to VP</text><path d=\"M130.0 138.0L230.0 138.0\" fill=\"none\" stroke=\"#222222\" stroke-width=\"0.9\" stroke-linecap=\"round\"/><text x=\"228.0\" y=\"136.1\" font-size=\"6.0\" text-anchor=\"end\" fill=\"#666666\" font-weight=\"normal\">XY</text><rect x=\"244.0\" y=\"52\" width=\"112\" height=\"176\" rx=\"6\" fill=\"#FBFCFD\" stroke=\"#9AA3AD\" stroke-width=\"0.9\"/><text x=\"300.0\" y=\"68.7\" font-size=\"7.6\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"bold\">perpendicular to both</text><path d=\"M250.0 138.0L350.0 138.0\" fill=\"none\" stroke=\"#222222\" stroke-width=\"0.9\" stroke-linecap=\"round\"/><text x=\"348.0\" y=\"136.1\" font-size=\"6.0\" text-anchor=\"end\" fill=\"#666666\" font-weight=\"normal\">XY</text><path d=\"M24.0 120.0L90.0 120.0\" fill=\"none\" stroke=\"#BD2543\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><path d=\"M24.0 120.0L24.0 86.0\" fill=\"none\" stroke=\"#9AA3AD\" stroke-width=\"0.7\" stroke-linecap=\"round\" stroke-dasharray=\"4 3\"/><path d=\"M90.0 120.0L90.0 86.0\" fill=\"none\" stroke=\"#9AA3AD\" stroke-width=\"0.7\" stroke-linecap=\"round\" stroke-dasharray=\"4 3\"/><text x=\"60.0\" y=\"84.2\" font-size=\"6.4\" text-anchor=\"middle\" fill=\"#BD2543\" font-weight=\"normal\">edge</text><rect x=\"24.0\" y=\"156\" width=\"66\" height=\"48\" fill=\"#1565C0\" fill-opacity=\"0.14\" stroke=\"#1565C0\" stroke-width=\"2\"/><text x=\"60.0\" y=\"216.4\" font-size=\"6.8\" text-anchor=\"middle\" fill=\"#1565C0\" font-weight=\"normal\">true shape</text><text x=\"60.0\" y=\"228.2\" font-size=\"6.4\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">in the plan</text><rect x=\"144.0\" y=\"74\" width=\"66\" height=\"48\" fill=\"#1565C0\" fill-opacity=\"0.14\" stroke=\"#1565C0\" stroke-width=\"2\"/><text x=\"180.0\" y=\"88.4\" font-size=\"6.8\" text-anchor=\"middle\" fill=\"#1565C0\" font-weight=\"normal\">true shape</text><path d=\"M144.0 160.0L210.0 160.0\" fill=\"none\" stroke=\"#BD2543\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><path d=\"M144.0 160.0L144.0 180.0\" fill=\"none\" stroke=\"#9AA3AD\" stroke-width=\"0.7\" stroke-linecap=\"round\" stroke-dasharray=\"4 3\"/><path d=\"M210.0 160.0L210.0 180.0\" fill=\"none\" stroke=\"#9AA3AD\" stroke-width=\"0.7\" stroke-linecap=\"round\" stroke-dasharray=\"4 3\"/><text x=\"180.0\" y=\"208.2\" font-size=\"6.4\" text-anchor=\"middle\" fill=\"#BD2543\" font-weight=\"normal\">edge</text><text x=\"180.0\" y=\"222.2\" font-size=\"6.4\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">in the plan</text><path d=\"M298.0 78.0L298.0 130.0\" fill=\"none\" stroke=\"#BD2543\" stroke-width=\"2.4\" stroke-linecap=\"round\"/><path d=\"M298.0 146.0L298.0 198.0\" fill=\"none\" stroke=\"#BD2543\" stroke-width=\"2.4\" stroke-linecap=\"round\"/><text x=\"302.0\" y=\"86.2\" font-size=\"6.4\" text-anchor=\"start\" fill=\"#BD2543\" font-weight=\"normal\">edge</text><text x=\"302.0\" y=\"194.2\" font   if (META.code_lang === 'python') return hlPy(src);

  const re = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(^[ \t]*#[^\n]*)|([A-Za-z_]\w*)(?=\s*\()|([A-Za-z_]\w*)|(\b\d+(?:\.\d+)?[fFlLuU]*\b)/gm;
  let o='', last=0, m;
  while ((m = re.exec(src))){
    o += esc(src.slice(last, m.index)); last = re.lastIndex;
    const w = esc(m[0]);
    if (m[1]) o += `<span class="cm">${w}</span>`;
    else if (m[2]) o += `<span class="st">${w}</span>`;
    else if (m[3]) o += `<span class="pp">${w}</span>`;
    else if (m[4]) o += KW.has(m[4]) ? `<span class="kw">${w}</span>` : TY.has(m[4]) ? `<span class="ty">${w}</span>` : `<span class="fn">${w}</span>`;
    else if (m[5]) o += KW.has(m[5]) ? `<span class="kw">${w}</span>` : TY.has(m[5]) ? `<span class="ty">${w}</span>` : w;
    else o += `<span class="nu">${w}</span>`;
  }
  return o + esc(src.slice(last));
}
const progBody = p => p.items
  ? p.items.map(it => fixTables(t(it.body)) + (it.diagram?dgInline(it.diagram):'')).join('')
  : `<div class="pl">${L('code')}</div><pre class="code">${hl(t(p.code))}</pre><div class="pl">${L('output')}</div><pre class="out">${esc(p.out)}</pre>${p.plot?`<div class="pl">${L('plot')}</div>`+dgInline(p.plot).replace('class="dg"','class="dg pg"'):''}${p.expl?`<div class="pl">${L('expl')}</div>${fixTables(t(p.expl))}`:''}`;
const pBox = id => { const p=(U.programs||[]).find(x=>x.id===id); if(!p) return ''; return `<div class="pbox"><div class="et">${L('prog')}: ${t(p.title)}</div>${progBody(p)}</div>`; };
const exBox = id => { const n=(U.numericals||[]).find(x=>x.id===id); if(!n) return ''; return `<div class="ex"><div class="et">${L('ex')}</div><div class="eq2">${t(n.q)}</div>${fixTables(t(n.a))}</div>`; };
function notes(){
  let h = `<div class="intro"><b>${t(U.title)}</b><div>${L('unit')} ${U.unit} · ${U.weightage}% ${L('intro')} · ${U.hours} ${L('hours')}</div><div>${U.intro_text ? t(U.intro_text) : L(U.programs?(META.code_lang==='python'?'intropy':'introc'):'introd')}</div></div>`;
  U.notes.forEach((sec,si)=>{
    h += `<div class="sec">${head(t(sec.title))}`;
    sec.items.forEach((it,i)=>{
      const open = si===0&&i===0 ? ' open' : '';
      if (it.h) {
        h += `<div class="card${it.key?' key':''}${open}"><div class="q hd"><span class="t">${it.key?'⭐ ':''}${t(it.h)}</span>${chev}</div>
        <div class="a rn" style="padding-left:18px">${fixTables(t(it.body)).replace(/margin:0 0 10px -36px/g,'')}${it.diagram?dgInline(it.diagram):''}${(it.examples||[]).map(exBox).join('')}${(it.programs||[]).map(pBox).join('')}</div></div>`;
      } else {
        h += `<div class="card${open}"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(it.q)}</span>${chev}</div>
        <div class="a">${fixTables(t(it.a))}${it.diagram?dgInline(it.diagram):''}</div></div>`;
      }
    });
    h += `</div>`;
  });
  return h;
}
function numericals(){
  return `<div class="sec">${head(L('numericals'))}` + (U.numericals||[]).map((n,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(n.q)}</span>${chev}</div><div class="a">${fixTables(t(n.a))}</div></div>`).join('') + `</div>`;
}
function diagrams(){
  return `<div class="sec">${head(L((U.tabs ? U.tabs.includes('flowcharts')&&!U.tabs.includes('diagrams') : U.programs&&META.code_lang!=='python')?'flowcharts':'diagrams'),false)}<div style="height:10px"></div>` + U.diagrams.map((d,i)=>
    `<div class="dcard" data-dg="${d.id}"><div class="h">${i+1}. ${t(d.title)}</div>${SVG[d.id]}</div>`).join('') + `</div>`;
}
function equations(){
  return U.equations.map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><span class="fbox">${e.f}</span></span>${chev}</div>
     <div class="a"><p>${t(e.terms)}</p></div></div>`).join('') + `</div>`).join('');
}
function viva(){
  // two shapes exist in the corpus: flat [{q,a}] and grouped [{title, items:[{q,a}]}]
  const groups = U.viva.every(v=>v && v.q) ? [{items: U.viva}] : U.viva;
  return groups.map(g=>{
    const items = g.items || [];
    return `<div class="sec">${g.title?head(t(g.title)):''}` + items.map((v,i)=>
      `<div class="card"><div class="q hd"><span class="n">${i+1}.</span><span class="t">${t(v.q)}</span>${chev}</div><div class="a"><p>${t(v.a)}</p></div></div>`).join('') + `</div>`;
  }).join('');
}
function exam(){
  return `<div class="sec">${head(L('examhead'),false)}` + U.exam_questions.map((x,i)=>
    `<div class="card"><div class="q" style="cursor:default"><span class="n">${i+1}.</span><span class="t">${t(x.q)}</span><span class="mk">${x.marks} ${L('marks')}</span></div></div>`).join('') + `</div>`;
}
function programs(){
  return `<div class="sec">${head(L('programs'))}` + (U.programs||[]).map((p,i)=>
    `<div class="card"><div class="q hd"><span class="n">${i+1}.</span><span class="t">${t(p.title)}</span>${chev}</div><div class="a pa">${progBody(p)}</div></div>`).join('') + `</div>`;
}
function syntax(key){
  return (U[typeof key==='string'?key:'syntax']||[]).map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><pre class="code sx">${hl(e.f)}</pre></span>${chev}</div>
     <div class="a">${e.terms && t(e.terms) ? fixTables(t(e.terms)) : ''}</div></div>`).join('') + `</div>`).join('');
}
const flowcharts = diagrams;
const algorithms = () => syntax('algorithms');
const ALLV = {notes, programs, diagrams, flowcharts, algorithms, syntax, equations, numericals, viva, exam};
const VIEWS = U.tabs ? Object.fromEntries(U.tabs.map(k=>[k, ALLV[k]])) : U.programs ? (META.code_lang==='python' ? {notes, programs, diagrams, syntax, viva, exam} : {notes, programs, flowcharts, syntax, viva, exam}) : U.numericals ? {notes, diagrams, equations, numericals, viva, exam} : {notes, diagrams, equations, viva, exam};
function render(){
  document.getElementById('title').textContent = `${L('unit')} ${U.unit}: ${t(U.title)}`;
  document.getElementById('sub').textContent = `${t(META.name)} · ${META.code}`;
  document.getElementById('lang').textContent = S.lang==='en' ? 'ગુ' : 'EN';
  document.getElementById('lang').style.display = META.languages.includes('gu') ? '' : 'none';
  document.getElementById('tabs').innerHTML = Object.keys(VIEWS).map(k=>`<button class="tab${S.tab===k?' on':''}" data-tab="${k}">${L(k)}</button>`).join('');
  document.getElementById('view').innerHTML = VIEWS[S.tab]();
  document.querySelectorAll('#view pre.c').forEach(e=>{ e.innerHTML = hl(e.textContent); e.className='code'; });
}
let zoom = 1;
function setZoom(z){ zoom = Math.min(4, Math.max(1, z)); const w=document.getElementById('zw'); w.style.width=(zoom*100)+'%'; document.getElementById('zr').textContent=Math.round(zoom*100)+'%'; }
document.addEventListener('click', e=>{
  const q = e.target.closest('.q'); if (q && q.parentElement.querySelector('.a')) { q.parentElement.classList.toggle('open'); return; }
  const tb = e.target.closest('[data-tab]'); if (tb){ S.tab = tb.dataset.tab; render(); window.scrollTo(0,0); return; }
  if (e.target.closest('#lang')){ S.lang = S.lang==='en'?'gu':'en'; render(); return; }
  const m = e.target.closest('[data-more]');
  document.querySelectorAll('.menu.show').forEach(x=>{ if(!m || x!==m.nextElementSibling) x.classList.remove('show'); });
  if (m){ m.nextElementSibling.classList.toggle('show'); return; }
  const act = e.target.closest('[data-act]');
  if (act){ act.closest('.sec').querySelectorAll('.card').forEach(c=>{ if(c.querySelector('.a')) c.classList.toggle('open', act.dataset.act==='expand'); }); act.parentElement.classList.remove('show'); return; }
  const dg = e.target.closest('[data-dg]');
  if (dg){ const id=dg.dataset.dg; document.getElementById('mt').textContent=t(U.diagrams.find(d=>d.id===id).title); document.getElementById('zw').innerHTML=SVG[id]; setZoom(1); document.getElementById('modal').classList.add('show'); return; }
  if (e.target.closest('#mx')) document.getElementById('modal').classList.remove('show');
  if (e.target.closest('#zi')) setZoom(zoom+0.5);
  if (e.target.closest('#zo')) setZoom(zoom-0.5);
  if (e.target.closest('#zr')) setZoom(1);
});
render();
</script></body></html>
