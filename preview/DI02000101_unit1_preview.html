<script>
const U = {"subject": "DI02000101", "unit": 1, "format": "notes", "title": {"en": "Introduction and Syntax of Python Programming"}, "weightage": 15, "hours": 7, "notes": [{"title": {"en": "1.1 Introduction to Python"}, "items": [{"h": {"en": "1.1.1 Introduction and History of Python"}, "body": {"en": "<p><b>Python</b> is a <b>high-level, interpreted, general-purpose</b> programming language known for its simple, readable syntax. It supports procedural, object-oriented and functional programming. It is <b>free and open source</b> and is maintained by the <b>Python Software Foundation (PSF)</b>.</p>\n<h4>What is a scripting language?</h4>\n<p>A <b>scripting language</b> is a language whose programs (scripts) are executed by an <b>interpreter</b> without a separate compile-and-link step. Scripts are used to automate tasks, glue software components together and build programs quickly. Python, JavaScript, Perl, PHP and shell script are examples. Python is used both as a scripting language and for full-scale applications.</p>\n<h4>History</h4>\n<ul><li>Python was created by <b>Guido van Rossum</b> at <b>CWI (Centrum Wiskunde &amp; Informatica)</b> in the Netherlands. He started it in December 1989 as a hobby project.</li>\n<li>The name comes from the BBC comedy show <b>\"Monty Python's Flying Circus\"</b>, not from the snake.</li>\n<li>It was influenced by the <b>ABC</b> language (and by Modula-3, C and Unix shell).</li>\n<li><b>1991</b>: Python 0.9.0 released, with functions, exception handling, modules and core data types.</li>\n<li><b>1994</b>: Python 1.0, with lambda, map, filter and reduce.</li>\n<li><b>2000</b>: Python 2.0, with list comprehensions, garbage collection and Unicode support.</li>\n<li><b>2008</b>: Python 3.0, a cleaned-up version that is <b>not backward compatible</b> with 2.x (e.g. <code>print</code> became a function).</li>\n<li><b>2020</b>: Python 2 reached end of life (1 January 2020). Today, all new development uses <b>Python 3</b>.</li>\n<li>Guido van Rossum led the language as its \"Benevolent Dictator For Life\" until 2018. It is now guided by an elected Steering Council.</li></ul>"}, "diagram": "py1_history"}, {"h": {"en": "1.1.2 Features of Python"}, "body": {"en": "<ol>\n<li><b>Simple and easy to learn:</b> English-like syntax with few keywords; programs are short and readable.</li>\n<li><b>Interpreted:</b> code is executed line by line by the interpreter. There is no separate compilation step, and errors are reported as soon as they are reached.</li>\n<li><b>Free and open source:</b> Python can be downloaded, used and distributed freely, and its source code is available.</li>\n<li><b>High-level language:</b> the programmer does not manage memory or hardware details; memory is handled automatically (garbage collection).</li>\n<li><b>Dynamically typed:</b> variables do not need type declarations; the type is decided at run time from the value.</li>\n<li><b>Platform independent (portable):</b> the same program runs on Windows, Linux and macOS without changes.</li>\n<li><b>Object-oriented:</b> supports classes, objects, inheritance and polymorphism. Procedural programming is also supported.</li>\n<li><b>Large standard library (\"batteries included\"):</b> ready modules for maths, files, dates, networking, databases and more. Thousands of further packages (NumPy, Matplotlib, Django) are available through <b>pip</b>.</li>\n<li><b>Extensible and embeddable:</b> code written in C/C++ can be used in Python, and Python can be embedded in other applications.</li>\n<li><b>Interactive mode:</b> statements can be tested immediately at the <code>&gt;&gt;&gt;</code> prompt.</li>\n<li><b>GUI and database support:</b> Tkinter for GUIs; connectors for MySQL, SQLite and others.</li>\n</ol>\n<h4>Limitations</h4>\n<ul><li>Slower than compiled languages like C/C++ because it is interpreted.</li>\n<li>Uses more memory, and is less common for mobile app development.</li>\n<li>Type errors appear only at run time because of dynamic typing.</li></ul>"}, "diagram": "py1_features"}, {"h": {"en": "1.1.3 Applications of Python"}, "body": {"en": "<table>\n<tr><th>Area</th><th>Examples / libraries</th></tr>\n<tr><td>Web development (server side)</td><td>Django, Flask; Instagram and Pinterest use Django</td></tr>\n<tr><td>Data science and analysis</td><td>NumPy, Pandas, Matplotlib</td></tr>\n<tr><td>Artificial intelligence and machine learning</td><td>TensorFlow, PyTorch, scikit-learn</td></tr>\n<tr><td>Automation and scripting</td><td>renaming files, sending e-mails, web scraping</td></tr>\n<tr><td>Desktop GUI applications</td><td>Tkinter, PyQt</td></tr>\n<tr><td>Game development</td><td>Pygame</td></tr>\n<tr><td>Scientific and numeric computing</td><td>SciPy, SymPy</td></tr>\n<tr><td>Networking and cyber security</td><td>socket programming, penetration-testing tools</td></tr>\n<tr><td>Embedded systems and IoT</td><td>Raspberry Pi, MicroPython</td></tr>\n<tr><td>Software development tools</td><td>build and testing tools (SCons, pytest)</td></tr>\n<tr><td>Education</td><td>first programming language in many schools and colleges</td></tr>\n<tr><td>Blockchain and big data</td><td>smart-contract tools, PySpark</td></tr>\n</table>\n<p>Companies using Python include Google, YouTube, NASA, Netflix, Spotify and Dropbox.</p>"}}, {"h": {"en": "1.1.4 Installing and Running Python"}, "body": {"en": "<h4>Installation steps (Windows)</h4>\n<ol><li>Open <b>www.python.org</b> → Downloads → download the latest Python 3 installer.</li>\n<li>Run the installer and <b>tick \"Add python.exe to PATH\"</b> (important).</li>\n<li>Click <b>Install Now</b>. This installs the interpreter, <b>IDLE</b> (Python's built-in editor) and <b>pip</b> (the package installer).</li>\n<li>Verify in the Command Prompt:</li></ol>\n<pre class=\"c\">C:\\&gt; python --version\nPython 3.13.0\nC:\\&gt; pip --version</pre>\n<p>On Linux, Python 3 is usually pre-installed (<code>python3</code>), or it can be installed with <code>sudo apt install python3</code>.</p>\n<h4>Ways to run Python code</h4>\n<p><b>1. Interactive mode (REPL: Read–Evaluate–Print Loop):</b> type <code>python</code> in the command prompt or open IDLE. Each statement is executed immediately after Enter. It is useful for testing small pieces of code, but the code is not saved.</p>\n<pre class=\"c\">&gt;&gt;&gt; 5 + 3\n8\n&gt;&gt;&gt; print(\"Hello\")\nHello\n&gt;&gt;&gt; x = 10\n&gt;&gt;&gt; x * 2\n20\n&gt;&gt;&gt; exit()</pre>\n<p><b>2. Script mode:</b> write the program in a file with the <b>.py</b> extension and run the whole file. The code is saved and can be reused.</p>\n<pre class=\"c\"># hello.py  (save the file, then run)\nprint(\"Hello, GTU!\")\n\n# Command prompt:\n# python hello.py      (Windows)\n# python3 hello.py     (Linux / macOS)</pre>\n<table><tr><th>Interactive mode</th><th>Script mode</th></tr>\n<tr><td>Statement executed immediately</td><td>Whole file executed</td></tr>\n<tr><td>Code is not saved</td><td>Code saved in a .py file</td></tr>\n<tr><td>Good for testing and as a calculator</td><td>Good for complete programs</td></tr>\n<tr><td>Prompt: &gt;&gt;&gt;</td><td>No prompt</td></tr></table>\n<p><b>IDEs and editors:</b> IDLE, VS Code, PyCharm, Spyder, Jupyter Notebook. Online: programiz.com, onlinegdb.com.</p>\n<h4>How a Python program is executed (see diagram)</h4>\n<ol><li>The <b>source code</b> (.py) is first compiled by the Python compiler into <b>byte code</b> (.pyc files, stored in the __pycache__ folder).</li>\n<li>The byte code is executed by the <b>Python Virtual Machine (PVM)</b>, the interpreter.</li>\n<li>This happens automatically. Because the byte code is platform independent, Python programs are portable.</li></ol>\n<p>The standard implementation, written in C, is called <b>CPython</b>. Other implementations include Jython (Java) and PyPy.</p>"}, "diagram": "py1_exec"}, {"h": {"en": "1.1.5 Basic Structure of a Python Program"}, "body": {"en": "<p>A Python program may contain the following sections (see diagram). Only the executable statements are compulsory.</p>\n<ol><li><b>Documentation section:</b> comments giving the program name, author and purpose.</li>\n<li><b>Import section:</b> <code>import</code> statements to use modules (math, random, …).</li>\n<li><b>Global declarations:</b> global variables and constants.</li>\n<li><b>Function / class definitions:</b> user-defined functions with <code>def</code> and classes.</li>\n<li><b>Main program:</b> statements that are executed: input, processing, output.</li></ol>\n<pre class=\"c\"># Program : Area of a circle      &lt;- documentation\n# Author  : Ravi Patel\n\n# import section\nimport math\n\n# global constant\nPI = 3.14159\n\n# function definition\ndef area(r):\n    # docstring\n    \"\"\"Return area of circle.\"\"\"\n    return PI * r * r\n\n# main program\nr = float(input(\"Enter radius: \"))\nprint(\"Area =\", area(r))</pre>\n<h4>Comments</h4>\n<pre class=\"c\"># This is a single-line comment\nx = 5    # inline comment\n\n\"\"\"\nThis is a multi-line string,\noften used as a multi-line comment.\n\"\"\"</pre>\n<p><code>#</code> starts a single-line comment. Python has no special multi-line comment, but a triple-quoted string that is not assigned to anything is often used as one. A triple-quoted string written just after a function header is a <b>docstring</b> (documentation string).</p>\n<h4>Indentation</h4>\n<p>Python uses <b>indentation</b> (spaces at the start of a line), not braces <code>{ }</code>, to mark a <b>block</b> of code. All statements in a block must have the <b>same indentation</b>; 4 spaces is the standard. A colon <code>:</code> starts a new block.</p>\n<pre class=\"c\">if marks &gt;= 35:\n    # 4 spaces = one block\n    print(\"Pass\")\n    print(\"Congratulations\")\nelse:\n    print(\"Fail\")\n# outside the if block\nprint(\"Done\")</pre>\n<pre class=\"c\">if x &gt; 0:\n# IndentationError: expected an indented block\nprint(\"Positive\")</pre>\n<h4>Statements and lines</h4>\n<pre class=\"c\"># ; separates statements\na = 5; b = 10; print(a + b)\n\ntotal = 10 + 20 + \\\n        # \\ continues a line\n        30 + 40\nnums = [1, 2,\n        # inside ( ) [ ] { } no \\ needed\n        3, 4]</pre>\n<ul><li>No semicolon is needed at the end of a statement; a newline ends it.</li>\n<li>Python is <b>case-sensitive</b>: <code>Print</code> and <code>print</code> are different.</li></ul>"}, "diagram": "py1_structure", "programs": ["py1p1"]}, {"h": {"en": "Key Points – 1.1"}, "body": {"en": "<ul>\n<li>Python: high-level, interpreted, dynamically typed, object-oriented, free and open source.</li>\n<li>Created by <b>Guido van Rossum</b> (CWI, Netherlands), started in 1989 and released in 1991; named after Monty Python.</li>\n<li>Python 3.0 (2008) is not backward compatible; Python 2 ended in 2020.</li>\n<li>Applications: web (Django), data science (NumPy, Pandas), AI/ML, automation, GUI, games, IoT.</li>\n<li>Interactive mode (&gt;&gt;&gt;, not saved) vs script mode (.py file).</li>\n<li>Execution: source → byte code (.pyc) → PVM.</li>\n<li>Indentation marks blocks; <code>#</code> starts a comment; no semicolons needed; case-sensitive.</li>\n</ul>"}, "key": true}]}, {"title": {"en": "1.2 Keywords, Variables, Literals, I/O and Type Casting"}, "items": [{"h": {"en": "1.2.1 Keywords and Identifiers"}, "body": {"en": "<h4>Keywords</h4>\n<p><b>Keywords</b> are <b>reserved words</b> with a predefined meaning. They cannot be used as variable, function or class names. Python 3.13 has <b>35 keywords</b>; all are lowercase except <b>True, False and None</b>.</p>\n<table>\n<tr><th>Category</th><th>Keywords</th></tr>\n<tr><td>Values</td><td>True, False, None</td></tr>\n<tr><td>Operators</td><td>and, or, not, in, is</td></tr>\n<tr><td>Control flow</td><td>if, elif, else, for, while, break, continue, pass</td></tr>\n<tr><td>Functions and classes</td><td>def, return, lambda, class, yield, global, nonlocal</td></tr>\n<tr><td>Modules</td><td>import, from, as</td></tr>\n<tr><td>Exception handling</td><td>try, except, finally, raise, assert</td></tr>\n<tr><td>Others</td><td>del, with, async, await</td></tr>\n</table>\n<pre class=\"c\">&gt;&gt;&gt; import keyword\n# list of all keywords\n&gt;&gt;&gt; keyword.kwlist\n&gt;&gt;&gt; keyword.iskeyword(\"if\")\nTrue</pre>\n<h4>Identifiers</h4>\n<p>An <b>identifier</b> is the name given to a variable, function, class or module.</p>\n<p><b>Rules for identifiers:</b></p>\n<ol><li>May contain letters (a–z, A–Z), digits (0–9) and underscore (_).</li>\n<li>Must <b>not start with a digit</b>.</li>\n<li>No spaces or special symbols (@, $, %, -, etc.).</li>\n<li>Must not be a keyword.</li>\n<li>They are <b>case-sensitive</b>: <code>Total</code>, <code>total</code> and <code>TOTAL</code> are different.</li>\n<li>Any length is allowed.</li></ol>\n<pre class=\"c\"># Valid identifiers\nroll_no   _count   Sum1   totalMarks   MAX_SIZE\n\n# Invalid identifiers\n2nd_sem      # starts with a digit\ntotal marks  # contains a space\nmy-name      # contains a hyphen\nfor          # keyword</pre>\n<p><b>Conventions:</b> variables and functions in lowercase_with_underscores (<code>total_marks</code>); constants in UPPERCASE (<code>PI</code>); classes in CapitalWords (<code>Student</code>). A name starting with an underscore indicates internal use.</p>"}, "programs": ["py1p14"]}, {"h": {"en": "1.2.2 Variables"}, "body": {"en": "<p>A <b>variable</b> is a name that <b>refers to a value (object) stored in memory</b>. In Python a variable is created when a value is first assigned to it; there is <b>no declaration statement</b>.</p>\n<pre class=\"c\">age = 18             # int\nheight = 5.6         # float\nname = \"Kavya\"       # str\n# same name, now a str (dynamic typing)\nage = \"eighteen\"\nprint(type(age))     # &lt;class 'str'&gt;</pre>\n<h4>Characteristics</h4>\n<ul><li><b>Dynamic typing:</b> the type is taken from the value, and the same variable can later refer to a value of another type.</li>\n<li>A variable is actually a <b>reference</b> to an object. <code>b = a</code> makes both names refer to the <b>same object</b> (see diagram).</li>\n<li>Every object has an identity (<code>id()</code>), a type (<code>type()</code>) and a value.</li>\n<li>Using a variable before assigning it gives a <b>NameError</b>.</li></ul>\n<pre class=\"c\">&gt;&gt;&gt; a = 10\n&gt;&gt;&gt; b = a\n&gt;&gt;&gt; id(a) == id(b)     # same object\nTrue\n&gt;&gt;&gt; a is b\nTrue</pre>\n<h4>Multiple assignment</h4>\n<pre class=\"c\"># same value to many variables\na = b = c = 0\n# different values\nx, y, z = 10, 20.5, \"GTU\"\na, b = b, a                # swap</pre>\n<h4>Deleting a variable</h4>\n<pre class=\"c\">x = 100\ndel x            # deletes the variable\n# NameError: name 'x' is not defined\nprint(x)</pre>"}, "diagram": "py1_variables", "programs": ["py1p6"]}, {"h": {"en": "1.2.3 Literals"}, "body": {"en": "<p>A <b>literal</b> is a <b>raw value written directly</b> in a program, e.g. <code>25</code>, <code>3.14</code>, <code>\"GTU\"</code>.</p>\n<table>\n<tr><th>Type of literal</th><th>Examples</th></tr>\n<tr><td><b>Integer</b></td><td>Decimal 25, binary 0b11001, octal 0o31, hexadecimal 0x19</td></tr>\n<tr><td><b>Float</b></td><td>3.14, -0.5, 2.5e3 (= 2500.0), 1.5E-2</td></tr>\n<tr><td><b>Complex</b></td><td>4+3j, 2j (real + imaginary part with j)</td></tr>\n<tr><td><b>String</b></td><td>'single', \"double\", &#39;&#39;&#39;triple&#39;&#39;&#39;, &quot;&quot;&quot;multi-line&quot;&quot;&quot;, raw r\"C:\\new\"</td></tr>\n<tr><td><b>Boolean</b></td><td>True (1), False (0)</td></tr>\n<tr><td><b>Special</b></td><td>None (absence of value)</td></tr>\n<tr><td><b>Collection</b></td><td>list [1, 2], tuple (1, 2), set {1, 2}, dict {\"a\": 1}</td></tr>\n</table>\n<pre class=\"c\"># Numeric literals\n# int (dec, bin, oct, hex)\n25    0b11001    0o31    0x19\n3.14  2.5e3                        # float\n4 + 3j                             # complex\n\n# String literals\n'GTU'   \"GTU\"   \"\"\"multi-line\"\"\"   r\"C:\\new\"\n\n# Boolean and special literals\nTrue   False   None\n\n# Collection literals\n[1, 2]   (1, 2)   {1, 2}   {\"a\": 1}</pre>\n<ul><li>Escape sequences in strings: <code>\\n</code> newline, <code>\\t</code> tab, <code>\\\\</code> backslash, <code>\\'</code> and <code>\\\"</code> quotes.</li>\n<li>Underscores can be used in numeric literals for readability: <code>1_00_000</code>.</li></ul>"}, "programs": ["py1p15"]}, {"h": {"en": "1.2.4 Constants"}, "body": {"en": "<p>A <b>constant</b> is a value that should not change while the program runs. Python has <b>no const keyword</b>. By convention, constants are written in <b>UPPERCASE</b> letters, and programmers agree not to modify them.</p>\n<pre class=\"c\">PI = 3.14159\nMAX_STUDENTS = 60\nGRAVITY = 9.8\n# Python does not stop you changing them,\n# so UPPERCASE warns: \"do not modify\".</pre>\n<p>Constants are often placed in a separate module and imported:</p>\n<pre class=\"c\"># constants.py\nPI = 3.14159\nG = 9.8\n\n# main.py\nimport constants\nprint(constants.PI)</pre>\n<p>Built-in constants include <code>True</code>, <code>False</code> and <code>None</code>. The math module provides <code>math.pi</code> (3.14159…) and <code>math.e</code> (2.71828…).</p>\n<table><tr><th>Literal</th><th>Constant</th></tr>\n<tr><td>A raw value written in the code</td><td>A named value that should not change</td></tr>\n<tr><td>3.14159</td><td>PI = 3.14159</td></tr></table>"}, "programs": ["py1p4"]}, {"h": {"en": "1.2.5 Input and Output Functions: input() and print()"}, "body": {"en": "<h4>input()</h4>\n<p><code>variable = input(\"prompt\")</code> displays the prompt, waits for the user to type a line and press Enter, and <b>returns the text as a string (str)</b>. To use the input as a number, convert it with <code>int()</code> or <code>float()</code>.</p>\n<pre class=\"c\">name = input(\"Enter name: \")          # str\nage = int(input(\"Enter age: \"))       # int\n# float\nper = float(input(\"Enter %: \"))\n# two strings\na, b = input(\"Two words: \").split()\nx, y = map(int, input(\"Two numbers: \").split())</pre>\n<ul><li><code>split()</code> breaks the input line at spaces into a list of strings.</li>\n<li><code>map(int, …)</code> applies <code>int()</code> to every item.</li></ul>\n<h4>print()</h4>\n<pre class=\"c\">print(value1, value2, ..., sep=' ', end='\\n', file=sys.stdout)</pre>\n<ul><li>Prints one or more values separated by <b>sep</b> (default a space) and finishes with <b>end</b> (default newline <code>'\\n'</code>).</li>\n<li><b>file</b> sends the output to a file instead of the screen.</li></ul>\n<pre class=\"c\">print(\"A\", \"B\", 5)              # A B 5\nprint(\"A\", \"B\", sep=\"-\")        # A-B\nprint(\"Hi\", end=\" \")            # no newline\n# 2025/10/26\nprint(\"2025\", \"10\", \"26\", sep=\"/\")</pre>\n<h4>Formatting output</h4>\n<pre class=\"c\">name, per = \"Riya\", 77.333\n# comma\nprint(\"Name:\", name, \"Per:\", per)\n# % style\nprint(\"Name: %s Per: %.2f\" % (name, per))\nprint(\"Name: {} Per: {:.2f}\".format(name, per))\n# f-string\nprint(f\"Name: {name} Per: {per:.2f}\")\n# width\nprint(f\"{name:&gt;10}|{per:&lt;8.1f}|\")</pre>\n<table><tr><th>Specifier</th><th>Meaning</th></tr>\n<tr><td>%d / %f / %s</td><td>integer / float / string (old % style)</td></tr>\n<tr><td>{:.2f}</td><td>2 decimal places</td></tr>\n<tr><td>{:10} {:&lt;10} {:&gt;10} {:^10}</td><td>width 10: default / left / right / centre</td></tr>\n<tr><td>{:,}</td><td>thousands separator: 1,00,000 → 100,000</td></tr></table>"}, "diagram": "py1_io", "programs": ["py1p2", "py1p3", "py1p16"]}, {"h": {"en": "1.2.6 Type Casting (Type Conversion)"}, "body": {"en": "<p><b>Type conversion</b> means changing a value from one data type to another. There are two types (see diagram).</p>\n<h4>1. Implicit type conversion</h4>\n<p>Done <b>automatically</b> by Python when different numeric types are mixed in an expression. The smaller type is converted to the larger type so that no data is lost: <b>bool → int → float → complex</b>.</p>\n<pre class=\"c\">a = 10        # int\nb = 3.5       # float\nc = a + b     # int converted to float\nprint(c, type(c))     # 13.5 &lt;class 'float'&gt;\n# 3   (True treated as 1)\nprint(True + 2)</pre>\n<h4>2. Explicit type conversion (type casting)</h4>\n<p>Done <b>by the programmer</b> using built-in functions: <code>target_type(value)</code>.</p>\n<table>\n<tr><th>Function</th><th>Converts to</th><th>Example</th></tr>\n<tr><td>int(x)</td><td>integer (truncates decimals)</td><td>int(\"25\") → 25, int(9.8) → 9</td></tr>\n<tr><td>float(x)</td><td>floating point</td><td>float(\"3.5\") → 3.5</td></tr>\n<tr><td>str(x)</td><td>string</td><td>str(100) → '100'</td></tr>\n<tr><td>bool(x)</td><td>True / False</td><td>bool(0) → False</td></tr>\n<tr><td>complex(a, b)</td><td>complex number</td><td>complex(2, 3) → (2+3j)</td></tr>\n<tr><td>list(x), tuple(x), set(x)</td><td>collections</td><td>list(\"ab\") → ['a', 'b']</td></tr>\n<tr><td>dict(x)</td><td>dictionary</td><td>dict([(\"a\", 1)]) → {'a': 1}</td></tr>\n<tr><td>int(s, base)</td><td>int from a base-2/8/16 string</td><td>int(\"101\", 2) → 5</td></tr>\n</table>\n<pre class=\"c\">int(\"25\")       # 25\nint(9.8)        # 9 (truncates)\nfloat(\"3.5\")    # 3.5\nfloat(7)        # 7.0\nstr(100)        # '100'\nbool(0)         # False\ncomplex(2, 3)   # (2+3j)\nint(\"101\", 2)   # 5 (binary to decimal)</pre>\n<h4>Errors in conversion</h4>\n<pre class=\"c\">int(\"12.5\")    # ValueError\nint(\"abc\")     # ValueError\n# TypeError: can only concatenate str\n\"Age: \" + 18\n\"Age: \" + str(18)   # correct</pre>\n<table><tr><th>Implicit</th><th>Explicit</th></tr>\n<tr><td>Done automatically by Python</td><td>Done by the programmer</td></tr>\n<tr><td>No data loss</td><td>Data may be lost (int(9.8) → 9)</td></tr>\n<tr><td>Only between compatible numeric types</td><td>Between any convertible types</td></tr></table>"}, "diagram": "py1_typecasting", "programs": ["py1p8", "py1p5", "py1p9"]}, {"h": {"en": "Key Points – 1.2"}, "body": {"en": "<ul>\n<li>35 keywords (Python 3.13); True, False and None are capitalised. Keywords cannot be identifiers.</li>\n<li>Identifier: letters, digits and _; not starting with a digit; no spaces or symbols; case-sensitive.</li>\n<li>Variables are created by assignment; they are references to objects; dynamically typed.</li>\n<li>Literals: integer (dec/bin/oct/hex), float, complex, string, boolean, None, collections.</li>\n<li>Constants use UPPERCASE by convention (no const keyword).</li>\n<li><code>input()</code> always returns str; convert it with int()/float(). <code>print(sep=, end=)</code>.</li>\n<li>Implicit conversion is automatic (int → float); explicit conversion uses int(), float(), str(), bool(), etc.</li>\n</ul>"}, "key": true}]}, {"title": {"en": "1.3 Data Types in Python"}, "items": [{"h": {"en": "1.3.1 Introduction to Data Types"}, "body": {"en": "<p>A <b>data type</b> tells what kind of value a variable holds and which operations can be done on it. In Python, <b>everything is an object</b>, and every value has a type (a class). The type is found with <code>type()</code>.</p>\n<table>\n<tr><th>Category</th><th>Types</th><th>Example</th></tr>\n<tr><td>Numeric</td><td>int, float, complex</td><td>10, 3.14, 2+3j</td></tr>\n<tr><td>Boolean</td><td>bool</td><td>True, False</td></tr>\n<tr><td>Sequence</td><td>str, list, tuple (and range)</td><td>\"GTU\", [1, 2], (1, 2)</td></tr>\n<tr><td>Set</td><td>set, frozenset</td><td>{1, 2, 3}</td></tr>\n<tr><td>Mapping</td><td>dict</td><td>{\"a\": 1}</td></tr>\n<tr><td>None type</td><td>NoneType</td><td>None</td></tr>\n</table>\n<h4>Mutable and immutable types</h4>\n<ul><li><b>Mutable</b> (can be changed after creation): <b>list, set, dict</b>.</li>\n<li><b>Immutable</b> (cannot be changed): <b>int, float, complex, bool, str, tuple, frozenset</b>.</li></ul>\n<pre class=\"c\">lst = [1, 2, 3]\n# allowed: list is mutable\nlst[0] = 10\ntup = (1, 2, 3)\n# TypeError: tuple is immutable\ntup[0] = 10</pre>\n<p><b>Declaration and use:</b> Python has no separate declaration. A variable gets its type when a value is assigned, e.g. <code>x = 5</code> (int) or <code>x = [5]</code> (list).</p>"}, "diagram": "py1_datatypes", "programs": ["py1p7"]}, {"h": {"en": "1.3.2 Numbers: int, float, complex (and bool)"}, "body": {"en": "<ul>\n<li><b>int:</b> whole numbers, positive or negative, with <b>no size limit</b> (limited only by memory). They can be written in decimal, binary (0b), octal (0o) or hexadecimal (0x).</li>\n<li><b>float:</b> real numbers with a decimal point or in exponent form, e.g. 3.14 or 1.5e3. Accurate to about 15–17 significant digits, which is why 145/3 prints as 48.333333333333336.</li>\n<li><b>complex:</b> numbers of the form <b>a + bj</b>, where j = √−1. Use <code>.real</code> and <code>.imag</code> to get the parts.</li>\n<li><b>bool:</b> True or False. bool is a subtype of int: True = 1 and False = 0.</li></ul>\n<pre class=\"c\">a = 100              # int (no size limit)\n# 1267650600228229401496703205376\nbig = 2 ** 100\nb = 3.75             # float\nc = 3 + 4j           # complex\n# 3.0 4.0 5.0\nprint(c.real, c.imag, abs(c))\nd = True             # bool (subtype of int)\nprint(True + True)   # 2</pre>"}, "programs": ["py1p3"]}, {"h": {"en": "1.3.3 String (str)"}, "body": {"en": "<p>A <b>string</b> is an <b>ordered, immutable sequence of characters</b> enclosed in single, double or triple quotes. Python has no separate char type; a single character is a string of length 1.</p>\n<h4>Declaration</h4>\n<pre class=\"c\">s1 = 'Python'\ns2 = \"GTU's Diploma\"          # ' inside \" \"\ns3 = \"\"\"Multi\nline string\"\"\"\ns4 = str(123)                 # '123'\nempty = \"\"</pre>\n<h4>Accessing and basic operations</h4>\n<p>Each character has an <b>index</b>: positive from 0 (left to right) and negative from −1 (right to left). <b>Slicing</b> <code>s[start:end:step]</code> extracts part of a string; the end index is excluded (see diagram).</p>\n<pre class=\"c\">s = \"PYTHON\"\ns[0]        # 'P'      first\ns[-1]       # 'N'      last\ns[1:4]      # 'YTH'    slicing\n\"Py\" + \"thon\"   # 'Python'  concatenation\n\"Hi \" * 3       # 'Hi Hi Hi '  repetition\n\"TH\" in s       # True     membership\nlen(s)          # 6</pre>\n<h4>Immutability</h4>\n<pre class=\"c\">s = \"Python\"\ns[0] = \"J\"         # TypeError: immutable\ns = \"J\" + s[1:]    # 'Jython' – a new string</pre>\n<p>String methods such as <code>upper()</code>, <code>lower()</code>, <code>replace()</code>, <code>find()</code> and <code>split()</code> are covered in Unit 4.</p>"}, "diagram": "py1_string_index", "programs": ["py1p10"]}, {"h": {"en": "1.3.4 List"}, "body": {"en": "<p>A <b>list</b> is an <b>ordered, mutable</b> collection of items written in <b>square brackets [ ]</b> and separated by commas.</p>\n<ul><li>It can contain items of <b>different types</b>, and <b>duplicates</b> are allowed.</li>\n<li>Items are accessed by index (0, 1, … or −1, −2, …) and slicing.</li>\n<li>Items can be added, changed and removed after creation.</li></ul>\n<pre class=\"c\">marks = [78, 85, 62]          # create\nmixed = [1, \"two\", 3.5, True]\nempty = []\nmarks[0]          # 78     access\nmarks[1] = 90     # update -&gt; [78, 90, 62]\n# add    -&gt; [78, 90, 62, 70]\nmarks.append(70)\ndel marks[2]      # delete -&gt; [78, 90, 70]\nlen(marks)        # 3</pre>\n<p>Uses: a collection of marks, names or any items that may change. Lists are covered in detail in Unit 3.</p>"}, "programs": ["py1p11"]}, {"h": {"en": "1.3.5 Tuple"}, "body": {"en": "<p>A <b>tuple</b> is an <b>ordered, immutable</b> collection of items written in <b>parentheses ( )</b>.</p>\n<ul><li>Like a list it is indexed and allows duplicates and mixed types, but its items <b>cannot be changed, added or removed</b>.</li>\n<li>A single-item tuple needs a trailing comma: <code>(5,)</code>. Without the comma, <code>(5)</code> is just the int 5.</li>\n<li>It is faster and uses less memory than a list, and it can be used as a dictionary key.</li></ul>\n<pre class=\"c\">t = (10, 20, 30)          # create\n# parentheses optional\nt2 = 1, 2, 3\n# single item: comma needed\none = (5,)\nt[0]          # 10       access\nt[1:]         # (20, 30)\nt[0] = 99     # TypeError: immutable\ndel t         # whole tuple can be deleted</pre>\n<p>Uses: fixed data such as days of the week, (x, y) coordinates or RGB colours.</p>"}, "programs": ["py1p12"]}, {"h": {"en": "1.3.6 Set"}, "body": {"en": "<p>A <b>set</b> is an <b>unordered</b> collection of <b>unique</b> items written in <b>curly braces { }</b>.</p>\n<ul><li><b>No duplicates:</b> repeated values are stored only once.</li>\n<li><b>No indexing or slicing</b>, because there is no fixed order.</li>\n<li>The set itself is mutable (items can be added or removed), but its items must be immutable (numbers, strings, tuples).</li>\n<li>An empty set is created with <code>set()</code>; <code>{}</code> creates an empty dictionary.</li>\n<li>It supports mathematical set operations: union <code>|</code>, intersection <code>&amp;</code>, difference <code>-</code>, symmetric difference <code>^</code>.</li>\n<li><b>frozenset</b> is an immutable version of a set.</li></ul>\n<pre class=\"c\"># {1, 2, 3} duplicates removed\ns = {3, 1, 2, 3}\n# empty set ({} is a dict!)\ne = set()\ns.add(5)                 # add\n# delete (error if missing)\ns.remove(1)\ns.discard(9)             # delete (no error)\n2 in s                   # True\n# TypeError: not subscriptable\ns[0]</pre>\n<p>Uses: removing duplicates, membership testing, finding common items.</p>"}, "programs": ["py1p12"]}, {"h": {"en": "1.3.7 Dictionary (dict)"}, "body": {"en": "<p>A <b>dictionary</b> is a <b>mutable</b> collection of <b>key: value pairs</b> written in <b>curly braces { }</b>. Values are accessed by <b>key</b>, not by index.</p>\n<ul><li>Keys must be <b>unique</b> and <b>immutable</b> (str, int, tuple); values can be of any type and may repeat.</li>\n<li>It keeps insertion order (from Python 3.7).</li>\n<li>Assigning to a new key adds a pair; assigning to an existing key updates its value.</li></ul>\n<pre class=\"c\">d = {\"roll\": 101, \"name\": \"Amit\"}   # create\n# 'Amit'   access by key\nd[\"name\"]\nd.get(\"city\", \"-\")   # '-'      safe access\nd[\"sem\"] = 2         # add new pair\nd[\"name\"] = \"Riya\"   # update\ndel d[\"roll\"]        # delete a pair\nd.keys()   d.values()   d.items()</pre>\n<p>Uses: records (student details), word counts, phone books, configuration settings.</p>"}, "programs": ["py1p13"]}, {"h": {"en": "1.3.8 Comparison: List, Tuple, Set and Dictionary"}, "body": {"en": "<table>\n<tr><th>Property</th><th>List</th><th>Tuple</th><th>Set</th><th>Dictionary</th></tr>\n<tr><td>Brackets</td><td>[ ]</td><td>( )</td><td>{ }</td><td>{key: value}</td></tr>\n<tr><td>Ordered</td><td>Yes</td><td>Yes</td><td>No</td><td>Yes (3.7+)</td></tr>\n<tr><td>Mutable</td><td>Yes</td><td>No</td><td>Yes</td><td>Yes</td></tr>\n<tr><td>Duplicates</td><td>Allowed</td><td>Allowed</td><td>Not allowed</td><td>Keys unique</td></tr>\n<tr><td>Indexing</td><td>By position</td><td>By position</td><td>Not possible</td><td>By key</td></tr>\n<tr><td>Empty</td><td>[] or list()</td><td>() or tuple()</td><td>set()</td><td>{} or dict()</td></tr>\n<tr><td>Example</td><td>[1, 2, 2]</td><td>(1, 2, 2)</td><td>{1, 2}</td><td>{\"a\": 1}</td></tr>\n<tr><td>Use</td><td>Changing collection</td><td>Fixed data</td><td>Unique items</td><td>Key-based lookup</td></tr>\n</table>"}, "diagram": "py1_collections"}, {"h": {"en": "Key Points – 1.3"}, "body": {"en": "<ul>\n<li>Everything in Python is an object; <code>type()</code> gives its class.</li>\n<li>Numeric: int (unlimited size), float, complex (a+bj); bool is a subtype of int (True = 1).</li>\n<li>str: immutable, ordered sequence of characters; indexing from 0 and −1; slicing [start:end:step] with end excluded.</li>\n<li>list [ ]: ordered, mutable, allows duplicates.</li>\n<li>tuple ( ): ordered, immutable; single item needs a comma: (5,).</li>\n<li>set { }: unordered, unique items, no indexing; empty set = set().</li>\n<li>dict {k: v}: key-value pairs; keys unique and immutable; empty dict = {}.</li>\n<li>Mutable: list, set, dict. Immutable: int, float, complex, bool, str, tuple, frozenset.</li>\n</ul>"}, "key": true}]}], "programs": [{"id": "py1p1", "title": {"en": "First Python program and print() options"}, "code": {"en": "# My first Python program\nprint(\"Hello, World!\")\n# values separated by space\nprint(\"Welcome to\", \"GTU\", \"Diploma\")\n# custom separator\nprint(\"A\", \"B\", \"C\", sep=\"-\")\n# no newline at end\nprint(\"Python\", end=\" \")\nprint(\"is easy\")\n# escape sequences\nprint(\"Line1\\nLine2\\tTabbed\")\n# blank line\nprint()\nprint('Single quotes', \"double quotes\", \"\"\"triple quotes\"\"\")"}, "out": "Hello, World!\nWelcome to GTU Diploma\nA-B-C\nPython is easy\nLine1\nLine2\tTabbed\n\nSingle quotes double quotes triple quotes", "expl": {"en": "<ul><li>A Python program needs no <code>main()</code>, header files or semicolons. Statements run from top to bottom.</li>\n<li><code>print()</code> separates values with a space by default. <code>sep</code> changes the separator and <code>end</code> changes what is printed at the end (default <code>'\\n'</code>).</li>\n<li><code>\\n</code> = newline, <code>\\t</code> = tab. Strings may use single, double or triple quotes.</li>\n<li>Text after <code>#</code> is a comment and is ignored by the interpreter.</li></ul>"}}, {"id": "py1p2", "title": {"en": "Read and display personal details (Practical 2)"}, "code": {"en": "name = input(\"Enter your name      : \")\ncontact = input(\"Enter contact number : \")\nemail = input(\"Enter email          : \")\ndob = input(\"Enter birth date     : \")\n\nprint(\"\\n------ Student Details ------\")\nprint(\"Name      :\", name)\nprint(\"Contact   :\", contact)\nprint(\"Email     :\", email)\nprint(\"Birth date:\", dob)\nprint(\"-----------------------------\")"}, "out": "Enter your name      : Ravi Patel\nEnter contact number : 9876543210\nEnter email          : ravi.patel@gmail.com\nEnter birth date     : 15-08-2008\n\n------ Student Details ------\nName      : Ravi Patel\nContact   : 9876543210\nEmail     : ravi.patel@gmail.com\nBirth date: 15-08-2008\n-----------------------------", "expl": {"en": "<p><code>input(prompt)</code> shows the prompt, waits for the user to type and press Enter, and returns the text as a <b>string</b>. Here all four values are kept as strings because no calculation is needed. A contact number is stored as a string so that leading zeros and the + sign are not lost.</p>"}}, {"id": "py1p3", "title": {"en": "Sum and average of three numbers"}, "code": {"en": "a = int(input(\"Enter first number : \"))\nb = int(input(\"Enter second number: \"))\nc = int(input(\"Enter third number : \"))\n\ntotal = a + b + c\navg = total / 3\n\nprint(\"Sum     =\", total)\nprint(\"Average =\", avg)\nprint(\"Average (2 decimals) = %.2f\" % avg)\nprint(f\"Average using f-string = {avg:.2f}\")"}, "out": "Enter first number : 45\nEnter second number: 62\nEnter third number : 38\nSum     = 145\nAverage = 48.333333333333336\nAverage (2 decimals) = 48.33\nAverage using f-string = 48.33", "expl": {"en": "<ul><li><code>input()</code> returns a string, so <code>int()</code> converts it to an integer before adding. Without it, \"45\" + \"62\" would join the strings to give \"4562\".</li>\n<li><code>/</code> always gives a float in Python 3 (145 / 3 = 48.333…).</li>\n<li>Formatting to 2 decimal places: the old style <code>\"%.2f\" % value</code>, or an f-string <code>f\"{value:.2f}\"</code>.</li></ul>"}}, {"id": "py1p4", "title": {"en": "Area and circumference of a circle"}, "code": {"en": "# constant (by convention)\nPI = 3.14159\n\nr = float(input(\"Enter radius: \"))\narea = PI * r * r\ncircum = 2 * PI * r\n\nprint(\"Area          =\", round(area, 2))\nprint(\"Circumference =\", round(circum, 2))"}, "out": "Enter radius: 7\nArea          = 153.94\nCircumference = 43.98", "expl": {"en": "<p><code>float()</code> allows decimal input such as 7.5. Python has no <code>const</code> keyword, so constants are written in <b>UPPERCASE</b> by convention (PI), and the programmer must not change them. <code>round(x, 2)</code> rounds to 2 decimal places.</p>"}}, {"id": "py1p5", "title": {"en": "Simple interest calculation"}, "code": {"en": "p = float(input(\"Principal amount (Rs): \"))\nr = float(input(\"Rate of interest (%) : \"))\nn = float(input(\"Time (years)         : \"))\n\nsi = (p * r * n) / 100\namount = p + si\n\nprint(\"Simple Interest = Rs\", si)\nprint(\"Total Amount    = Rs\", amount)"}, "out": "Principal amount (Rs): 25000\nRate of interest (%) : 8.5\nTime (years)         : 3\nSimple Interest = Rs 6375.0\nTotal Amount    = Rs 31375.0", "expl": {"en": "<p>Formula: <b>SI = P × R × N / 100</b>. Each input is converted with <code>float()</code> because rates and amounts may contain decimals. Arithmetic follows normal mathematical precedence; the parentheses make the order clear.</p>"}}, {"id": "py1p6", "title": {"en": "Swap two numbers (three methods)"}, "code": {"en": "a = int(input(\"Enter a: \"))\nb = int(input(\"Enter b: \"))\nprint(\"Before swap: a =\", a, \" b =\", b)\n\n# Method 1: using a third variable\ntemp = a\na = b\nb = temp\nprint(\"After method 1: a =\", a, \" b =\", b)\n\n# Method 2: without a third variable\na = a + b\nb = a - b\na = a - b\nprint(\"After method 2: a =\", a, \" b =\", b)\n\n# Method 3: Pythonic way (tuple unpacking)\na, b = b, a\nprint(\"After method 3: a =\", a, \" b =\", b)"}, "out": "Enter a: 10\nEnter b: 25\nBefore swap: a = 10  b = 25\nAfter method 1: a = 25  b = 10\nAfter method 2: a = 10  b = 25\nAfter method 3: a = 25  b = 10", "expl": {"en": "<p>Method 3 is unique to Python: <code>a, b = b, a</code> first builds the tuple <code>(b, a)</code> on the right side, then assigns its items to a and b. This is called <b>multiple assignment</b> or <b>tuple unpacking</b>. Each method swaps the values once, so the output alternates.</p>"}}, {"id": "py1p7", "title": {"en": "Data types with type() and isinstance()"}, "code": {"en": "a = 25\nb = 3.75\nc = 2 + 5j\nd = \"Python\"\ne = True\nf = [10, 20, 30]\ng = (1, 2, 3)\nh = {1, 2, 3}\ni = {\"roll\": 101, \"name\": \"Amit\"}\nj = None\n\nfor value in (a, b, c, d, e, f, g, h, i, j):\n    print(repr(value).ljust(30), type(value))\n\nprint(\"isinstance(a, int)   :\", isinstance(a, int))\nprint(\"isinstance(b, float) :\", isinstance(b, float))\nprint(\"Real/imag part of c  :\", c.real, c.imag)"}, "out": "25                             <class 'int'>\n3.75                           <class 'float'>\n(2+5j)                         <class 'complex'>\n'Python'                       <class 'str'>\nTrue                           <class 'bool'>\n[10, 20, 30]                   <class 'list'>\n(1, 2, 3)                      <class 'tuple'>\n{1, 2, 3}                      <class 'set'>\n{'roll': 101, 'name': 'Amit'}  <class 'dict'>\nNone                           <class 'NoneType'>\nisinstance(a, int)   : True\nisinstance(b, float) : True\nReal/imag part of c  : 2.0 5.0", "expl": {"en": "<ul><li>Python is <b>dynamically typed</b>: the type is decided from the value at run time, so no declaration is needed.</li>\n<li><code>type(x)</code> returns the class of the value. <code>isinstance(x, T)</code> checks whether x is of type T.</li>\n<li><code>repr()</code> shows the value as Python code (strings in quotes) and <code>ljust(30)</code> pads it to 30 characters so that the output lines up.</li>\n<li>A complex number has <code>.real</code> and <code>.imag</code> parts; Python uses <code>j</code> for the imaginary unit.</li></ul>"}}, {"id": "py1p8", "title": {"en": "Type casting: implicit and explicit conversion"}, "code": {"en": "# Implicit conversion (done automatically)\nx = 10          # int\ny = 2.5         # float\nz = x + y       # int is promoted to float\nprint(\"10 + 2.5 =\", z, type(z))\nprint(\"True + 5 =\", True + 5)\n\n# Explicit conversion (done by programmer)\nprint('int(\"25\")     =', int(\"25\"))\n# decimal part removed\nprint(\"int(9.99)     =\", int(9.99))\nprint('float(\"3.5\")  =', float(\"3.5\"))\nprint(\"float(7)      =\", float(7))\nprint(\"str(100)      =\", repr(str(100)))\nprint(\"bool(0), bool(5)    =\", bool(0), bool(5))\nprint('bool(\"\"), bool(\"a\") =', bool(\"\"), bool(\"a\"))\nprint(\"complex(2, 3) =\", complex(2, 3))\nprint('list(\"GTU\")   =', list(\"GTU\"))\nprint(\"tuple([1, 2]) =\", tuple([1, 2]))\nprint(\"set([1,1,2])  =\", set([1, 1, 2]))\n# binary string to int\nprint('int(\"1010\", 2)=', int(\"1010\", 2))\n\ntry:\n    int(\"12.5\")\nexcept ValueError as err:\n    print(\"Error:\", err)"}, "out": "10 + 2.5 = 12.5 <class 'float'>\nTrue + 5 = 6\nint(\"25\")     = 25\nint(9.99)     = 9\nfloat(\"3.5\")  = 3.5\nfloat(7)      = 7.0\nstr(100)      = '100'\nbool(0), bool(5)    = False True\nbool(\"\"), bool(\"a\") = False True\ncomplex(2, 3) = (2+3j)\nlist(\"GTU\")   = ['G', 'T', 'U']\ntuple([1, 2]) = (1, 2)\nset([1,1,2])  = {1, 2}\nint(\"1010\", 2)= 10\nError: invalid literal for int() with base 10: '12.5'", "expl": {"en": "<ul><li><b>Implicit conversion:</b> in mixed expressions Python converts the lower type to the higher type (bool → int → float → complex) so that no data is lost.</li>\n<li><b>Explicit conversion (type casting):</b> done using functions like <code>int()</code>, <code>float()</code>, <code>str()</code>, <code>bool()</code>, <code>list()</code>, <code>tuple()</code>, <code>set()</code> and <code>complex()</code>.</li>\n<li><code>int(9.99)</code> truncates to 9 (it does not round). <code>bool()</code> is False for 0, empty strings and empty collections, and True otherwise.</li>\n<li>A string that is not a valid integer, such as \"12.5\", raises a <b>ValueError</b>. Here it is caught with try/except so the program can continue.</li></ul>"}}, {"id": "py1p9", "title": {"en": "Temperature conversion (Celsius ↔ Fahrenheit)"}, "code": {"en": "c = float(input(\"Enter temperature in Celsius: \"))\nf = c * 9 / 5 + 32\nprint(f\"{c} °C = {f:.1f} °F\")\n\nf = float(input(\"Enter temperature in Fahrenheit: \"))\nc = (f - 32) * 5 / 9\nprint(f\"{f} °F = {c:.1f} °C\")"}, "out": "Enter temperature in Celsius: 37\n37.0 °C = 98.6 °F\nEnter temperature in Fahrenheit: 98.6\n98.6 °F = 37.0 °C", "expl": {"en": "<p>Formulas: <b>F = C × 9/5 + 32</b> and <b>C = (F − 32) × 5/9</b>. Inside an f-string, <code>{f:.1f}</code> prints the value with 1 decimal place. The same variable can be reused for a new value, because a variable is just a name for an object.</p>"}}, {"id": "py1p10", "title": {"en": "String operations: index, slice, join, repeat"}, "code": {"en": "s = \"PYTHON\"\nprint(\"String      :\", s)\nprint(\"Length      :\", len(s))\nprint(\"s[0], s[-1] :\", s[0], s[-1])\nprint(\"s[2:5]      :\", s[2:5])\nprint(\"s[:3]       :\", s[:3])\nprint(\"s[3:]       :\", s[3:])\nprint(\"s[::-1]     :\", s[::-1])\n\nfirst = \"Diploma\"\nsecond = \"Engineering\"\nprint(\"Concatenate :\", first + \" \" + second)\nprint(\"Repeat      :\", \"Hi! \" * 3)\nprint(\"Membership  :\", \"PY\" in s, \"Java\" in s)\nprint(\"Upper/lower :\", first.upper(), first.lower())\n\nname = input(\"Enter your name: \")\nprint(\"Hello \" + name + \", your name has\", len(name), \"characters.\")"}, "out": "String      : PYTHON\nLength      : 6\ns[0], s[-1] : P N\ns[2:5]      : THO\ns[:3]       : PYT\ns[3:]       : HON\ns[::-1]     : NOHTYP\nConcatenate : Diploma Engineering\nRepeat      : Hi! Hi! Hi! \nMembership  : True False\nUpper/lower : DIPLOMA diploma\nEnter your name: Kavya\nHello Kavya, your name has 5 characters.", "expl": {"en": "<ul><li>Characters are accessed by <b>index</b>: positive from 0 (left) and negative from −1 (right). See the diagram \"String Indexing and Slicing\".</li>\n<li><b>Slicing</b> <code>s[start:end:step]</code> gives the characters from start up to <b>end − 1</b>. <code>s[::-1]</code> reverses the string.</li>\n<li><code>+</code> joins (concatenates) strings, <code>*</code> repeats them, and <code>in</code> checks whether a substring is present.</li>\n<li>Strings are <b>immutable</b>: methods like <code>upper()</code> return a new string and leave the original unchanged.</li></ul>"}}, {"id": "py1p11", "title": {"en": "List: create, access, update, delete (Practical 3)"}, "code": {"en": "marks = [78, 85, 62, 90]\nprint(\"List          :\", marks)\nprint(\"First, last   :\", marks[0], marks[-1])\nprint(\"Slice [1:3]   :\", marks[1:3])\n\n# update an element\nmarks[2] = 70\nprint(\"After update  :\", marks)\n\n# add at end\nmarks.append(88)\n# add at index 1\nmarks.insert(1, 55)\nprint(\"After add     :\", marks)\n\n# delete by value\nmarks.remove(55)\n# delete by index\ndel marks[0]\nprint(\"After delete  :\", marks)\n\nprint(\"Length, sum   :\", len(marks), sum(marks))\nprint(\"Max, min      :\", max(marks), min(marks))\n# different types allowed\nmixed = [1, \"two\", 3.0, True]\nprint(\"Mixed list    :\", mixed)"}, "out": "List          : [78, 85, 62, 90]\nFirst, last   : 78 90\nSlice [1:3]   : [85, 62]\nAfter update  : [78, 85, 70, 90]\nAfter add     : [78, 55, 85, 70, 90, 88]\nAfter delete  : [85, 70, 90, 88]\nLength, sum   : 4 333\nMax, min      : 90 70\nMixed list    : [1, 'two', 3.0, True]", "expl": {"en": "<p>A <b>list</b> is an ordered, <b>mutable</b> collection written in square brackets. It can hold values of different types and allows duplicates. Elements can be changed with an index, added with <code>append()</code>/<code>insert()</code>, and removed with <code>remove()</code> (by value) or <code>del</code> (by index). Lists are covered in detail in Unit 3.</p>"}}, {"id": "py1p12", "title": {"en": "Tuple and set: create, access, update, delete"}, "code": {"en": "# Tuple: ordered, immutable\nt = (10, 20, 30, 20)\nprint(\"Tuple         :\", t)\nprint(\"t[1], t[-1]   :\", t[1], t[-1])\nprint(\"count(20)     :\", t.count(20))\nprint(\"index(30)     :\", t.index(30))\n# comma needed for one item\nsingle = (5,)\nprint(\"Single tuple  :\", single, type(single))\ntry:\n    # not allowed\n    t[0] = 99\nexcept TypeError as e:\n    print(\"Update error  :\", e)\n# create a new tuple instead\nt = t + (40,)\nprint(\"New tuple     :\", t)\n\n# Set: unordered, unique items, mutable\ns = {3, 1, 2, 3, 1}\n# duplicates removed\nprint(\"Set           :\", s)\ns.add(5)\ns.discard(1)\nprint(\"After add/del :\", s)\nprint(\"2 in s        :\", 2 in s)\na, b = {1, 2, 3}, {2, 3, 4}\nprint(\"Union a | b   :\", a | b)\nprint(\"Intersection  :\", a & b)"}, "out": "Tuple         : (10, 20, 30, 20)\nt[1], t[-1]   : 20 20\ncount(20)     : 2\nindex(30)     : 2\nSingle tuple  : (5,) <class 'tuple'>\nUpdate error  : 'tuple' object does not support item assignment\nNew tuple     : (10, 20, 30, 20, 40)\nSet           : {1, 2, 3}\nAfter add/del : {2, 3, 5}\n2 in s        : True\nUnion a | b   : {1, 2, 3, 4}\nIntersection  : {2, 3}", "expl": {"en": "<ul><li>A <b>tuple</b> ( ) is like a list but <b>immutable</b>: its items cannot be changed, added or removed. A new tuple must be created instead. A single-item tuple needs a trailing comma: <code>(5,)</code>.</li>\n<li>A <b>set</b> { } stores <b>unique</b> items in no fixed order, so duplicates are removed automatically and indexing is not possible. It supports mathematical operations such as union <code>|</code> and intersection <code>&amp;</code>.</li>\n<li>Small integers are printed in sorted order here, but the order of a set is not guaranteed.</li></ul>"}}, {"id": "py1p13", "title": {"en": "Dictionary: student record"}, "code": {"en": "student = {\"roll\": 101, \"name\": \"Amit\", \"branch\": \"Computer\"}\nprint(\"Dictionary   :\", student)\nprint(\"Name         :\", student[\"name\"])\nprint(\"get('city')  :\", student.get(\"city\", \"Not found\"))\n\n# add a new key\nstudent[\"sem\"] = 2\n# update a value\nstudent[\"name\"] = \"Amit Shah\"\nprint(\"After update :\", student)\n\n# delete a key\ndel student[\"branch\"]\nprint(\"After delete :\", student)\n\nprint(\"Keys   :\", list(student.keys()))\nprint(\"Values :\", list(student.values()))\nfor key, value in student.items():\n    print(f\"  {key:5} -> {value}\")"}, "out": "Dictionary   : {'roll': 101, 'name': 'Amit', 'branch': 'Computer'}\nName         : Amit\nget('city')  : Not found\nAfter update : {'roll': 101, 'name': 'Amit Shah', 'branch': 'Computer', 'sem': 2}\nAfter delete : {'roll': 101, 'name': 'Amit Shah', 'sem': 2}\nKeys   : ['roll', 'name', 'sem']\nValues : [101, 'Amit Shah', 2]\n  roll  -> 101\n  name  -> Amit Shah\n  sem   -> 2", "expl": {"en": "<ul><li>A <b>dictionary</b> stores <b>key: value</b> pairs in braces. Values are accessed by <b>key</b>, not by position.</li>\n<li>Keys must be unique and immutable (e.g. str, int, tuple); values can be of any type.</li>\n<li>Assigning to a new key adds it, and assigning to an existing key updates it. <code>del</code> removes a key. <code>get()</code> returns a default value instead of raising an error if the key is missing.</li>\n<li><code>keys()</code>, <code>values()</code> and <code>items()</code> give the keys, the values and the pairs.</li></ul>"}}, {"id": "py1p14", "title": {"en": "Keywords and valid identifiers"}, "code": {"en": "import keyword\n\nprint(\"Total keywords:\", len(keyword.kwlist))\nprint(keyword.kwlist)\n\nnames = [\"roll_no\", \"_count\", \"2nd_sem\", \"total marks\", \"for\", \"Sum1\", \"my-name\"]\nfor n in names:\n    if keyword.iskeyword(n):\n        result = \"invalid (keyword)\"\n    elif n.isidentifier():\n        result = \"valid\"\n    else:\n        result = \"invalid\"\n    print(f\"{n:12} : {result}\")"}, "out": "Total keywords: 35\n['False', 'None', 'True', 'and', 'as', 'assert', 'async', 'await', 'break', 'class', 'continue', 'def', 'del', 'elif', 'else', 'except', 'finally', 'for', 'from', 'global', 'if', 'import', 'in', 'is', 'lambda', 'nonlocal', 'not', 'or', 'pass', 'raise', 'return', 'try', 'while', 'with', 'yield']\nroll_no      : valid\n_count       : valid\n2nd_sem      : invalid\ntotal marks  : invalid\nfor          : invalid (keyword)\nSum1         : valid\nmy-name      : invalid", "expl": {"en": "<ul><li><b>Keywords</b> are reserved words with a special meaning, so they cannot be used as names. Python 3.13 has 35 keywords. <code>True</code>, <code>False</code> and <code>None</code> start with a capital letter.</li>\n<li><b>Identifier rules:</b> use letters, digits and underscore only; do not start with a digit; no spaces or special symbols; not a keyword. Identifiers are <b>case-sensitive</b> (Sum1 and sum1 are different).</li>\n<li><code>str.isidentifier()</code> checks the naming rules and <code>keyword.iskeyword()</code> checks for keywords.</li></ul>"}}, {"id": "py1p15", "title": {"en": "Literals: number systems, strings, boolean, None"}, "code": {"en": "# Integer literals in different number systems\ndec = 25\nbinary = 0b11001\noctal = 0o31\nhexa = 0x19\nprint(\"Decimal, binary, octal, hex:\", dec, binary, octal, hexa)\nprint(\"bin(25), oct(25), hex(25)  :\", bin(25), oct(25), hex(25))\n\n# Float and complex literals\nprint(\"Float literals   :\", 3.14, 2.5e3, 1.5E-2)\nprint(\"Complex literal  :\", 4 + 3j)\n# underscores allowed\nprint(\"Readable number  :\", 1_00_000)\n\n# String literals\nsingle = 'GTU'\nmulti = \"\"\"Line one\nLine two\"\"\"\n# raw: \\ not special\nraw = r\"C:\\new\\test\"\nprint(single, \"|\", raw)\nprint(multi)\n\n# Boolean and special literals\nprint(\"Boolean :\", True, False, True + True)\nprint(\"None    :\", None, type(None))"}, "out": "Decimal, binary, octal, hex: 25 25 25 25\nbin(25), oct(25), hex(25)  : 0b11001 0o31 0x19\nFloat literals   : 3.14 2500.0 0.015\nComplex literal  : (4+3j)\nReadable number  : 100000\nGTU | C:\\new\\test\nLine one\nLine two\nBoolean : True False 2\nNone    : None <class 'NoneType'>", "expl": {"en": "<ul><li>A <b>literal</b> is a fixed value written directly in the code.</li>\n<li><b>Integer literals</b> can be decimal, binary (<code>0b</code>), octal (<code>0o</code>) or hexadecimal (<code>0x</code>). All four above are the same number, 25. <code>bin()</code>, <code>oct()</code> and <code>hex()</code> convert the other way.</li>\n<li><b>Float literals</b> can use exponent form: 2.5e3 = 2500.0. Underscores make big numbers readable.</li>\n<li><b>String literals</b>: single, double, triple (multi-line) and raw (<code>r\"\"</code>, where backslashes are not escape characters).</li>\n<li><b>Boolean literals</b>: True (1) and False (0). <b>Special literal</b>: <code>None</code>, meaning \"no value\".</li></ul>"}}, {"id": "py1p16", "title": {"en": "Formatted output: marksheet with f-strings and format()"}, "code": {"en": "name = input(\"Student name: \")\nm1, m2, m3 = map(int, input(\"Marks of 3 subjects: \").split())\n\ntotal = m1 + m2 + m3\nper = total / 3\n\nprint(\"\\n{:^30}\".format(\"MARKSHEET\"))\nprint(\"-\" * 30)\nprint(f\"{'Name':<12}: {name}\")\nprint(f\"{'Subject 1':<12}: {m1:>5}\")\nprint(f\"{'Subject 2':<12}: {m2:>5}\")\nprint(f\"{'Subject 3':<12}: {m3:>5}\")\nprint(\"-\" * 30)\nprint(f\"{'Total':<12}: {total:>5}\")\nprint(f\"{'Percentage':<12}: {per:>8.2f} %\")\nprint(\"Result: %s with %.1f%%\" % (name, per))"}, "out": "Student name: Riya Shah\nMarks of 3 subjects: 78 85 69\n\n          MARKSHEET           \n------------------------------\nName        : Riya Shah\nSubject 1   :    78\nSubject 2   :    85\nSubject 3   :    69\n------------------------------\nTotal       :   232\nPercentage  :    77.33 %\nResult: Riya Shah with 77.3%", "expl": {"en": "<ul><li><code>input().split()</code> splits the line \"78 85 69\" into three strings. <code>map(int, …)</code> converts each one to int, and they are assigned to m1, m2, m3 in one line.</li>\n<li>Alignment in format specifiers: <code>&lt;</code> left, <code>&gt;</code> right, <code>^</code> centre; <code>:&gt;8.2f</code> means right-aligned, width 8, 2 decimals.</li>\n<li>Three ways to format output: f-strings <code>f\"{x}\"</code> (Python 3.6+), <code>str.format()</code>, and the old <code>%</code> operator (<code>%%</code> prints a % sign).</li></ul>"}}], "diagrams": [{"id": "py1_history", "title": {"en": "History of Python"}, "file": "diagrams/py1_history.svg"}, {"id": "py1_features", "title": {"en": "Features of Python"}, "file": "diagrams/py1_features.svg"}, {"id": "py1_exec", "title": {"en": "How a Python Program is Executed"}, "file": "diagrams/py1_exec.svg"}, {"id": "py1_structure", "title": {"en": "Basic Structure of a Python Program"}, "file": "diagrams/py1_structure.svg"}, {"id": "py1_variables", "title": {"en": "Variables and Objects"}, "file": "diagrams/py1_variables.svg"}, {"id": "py1_io", "title": {"en": "Input and Output"}, "file": "diagrams/py1_io.svg"}, {"id": "py1_typecasting", "title": {"en": "Type Conversion"}, "file": "diagrams/py1_typecasting.svg"}, {"id": "py1_datatypes", "title": {"en": "Built-in Data Types"}, "file": "diagrams/py1_datatypes.svg"}, {"id": "py1_string_index", "title": {"en": "String Indexing and Slicing"}, "file": "diagrams/py1_string_index.svg"}, {"id": "py1_collections", "title": {"en": "List vs Tuple vs Set vs Dictionary"}, "file": "diagrams/py1_collections.svg"}], "syntax": [{"title": {"en": "Running Python and Program Basics"}, "items": [{"name": {"en": "Check version"}, "f": "python --version\npython3 --version", "terms": {"en": "Command prompt / terminal."}}, {"name": {"en": "Run a script"}, "f": "python hello.py", "terms": {"en": "Script mode."}}, {"name": {"en": "Comments"}, "f": "# single-line comment\n\"\"\"multi-line string / docstring\"\"\"", "terms": {"en": ""}}, {"name": {"en": "Block (indentation)"}, "f": "if x > 0:\n    print(\"Positive\")", "terms": {"en": "Colon + 4 spaces."}}, {"name": {"en": "Line continuation"}, "f": "total = a + b + \\\n        c + d", "terms": {"en": "Not needed inside ( ) [ ] { }."}}, {"name": {"en": "Keyword list"}, "f": "import keyword\nprint(keyword.kwlist)", "terms": {"en": ""}}]}, {"title": {"en": "Variables, Literals and Constants"}, "items": [{"name": {"en": "Assignment"}, "f": "x = 10\nname = \"Ravi\"", "terms": {"en": "No declaration needed."}}, {"name": {"en": "Multiple assignment"}, "f": "a = b = c = 0\nx, y = 10, 20\na, b = b, a", "terms": {"en": "Last one swaps."}}, {"name": {"en": "Delete variable"}, "f": "del x", "terms": {"en": ""}}, {"name": {"en": "Type and identity"}, "f": "type(x)\nid(x)\nisinstance(x, int)", "terms": {"en": ""}}, {"name": {"en": "Number literals"}, "f": "25  0b11001  0o31  0x19\n3.14  2.5e3  4+3j", "terms": {"en": "dec, bin, oct, hex"}}, {"name": {"en": "Constant (convention)"}, "f": "PI = 3.14159", "terms": {"en": "UPPERCASE name."}}]}, {"title": {"en": "Input and Output"}, "items": [{"name": {"en": "Read string"}, "f": "name = input(\"Enter name: \")", "terms": {"en": "Always returns str."}}, {"name": {"en": "Read numbers"}, "f": "n = int(input(\"n: \"))\nx = float(input(\"x: \"))", "terms": {"en": ""}}, {"name": {"en": "Read many values"}, "f": "a, b = map(int, input().split())", "terms": {"en": ""}}, {"name": {"en": "print()"}, "f": "print(v1, v2, sep=' ', end='\\n')", "terms": {"en": ""}}, {"name": {"en": "f-string"}, "f": "print(f\"Total = {total}\")\nprint(f\"{per:.2f}\")", "terms": {"en": "Python 3.6+"}}, {"name": {"en": "format() and %"}, "f": "\"{} {:.2f}\".format(a, b)\n\"%d %.2f\" % (a, b)", "terms": {"en": ""}}]}, {"title": {"en": "Type Casting"}, "items": [{"name": {"en": "To int / float"}, "f": "int(\"25\")   int(9.8)\nfloat(\"3.5\")  float(7)", "terms": {"en": "int() truncates."}}, {"name": {"en": "To str / bool"}, "f": "str(100)\nbool(0)   bool(\"a\")", "terms": {"en": ""}}, {"name": {"en": "To complex"}, "f": "complex(2, 3)", "terms": {"en": "(2+3j)"}}, {"name": {"en": "To collections"}, "f": "list(\"ab\")  tuple([1, 2])\nset([1, 1, 2])  dict([(\"a\", 1)])", "terms": {"en": ""}}, {"name": {"en": "From another base"}, "f": "int(\"1010\", 2)\nbin(10)  oct(10)  hex(10)", "terms": {"en": ""}}]}, {"title": {"en": "Data Types"}, "items": [{"name": {"en": "String"}, "f": "s = \"PYTHON\"\ns[0]  s[-1]  s[1:4]  s[::-1]", "terms": {"en": "Immutable."}}, {"name": {"en": "List"}, "f": "lst = [1, 2, 3]\nlst[0] = 10\nlst.append(4)", "terms": {"en": "Mutable, ordered."}}, {"name": {"en": "Tuple"}, "f": "t = (1, 2, 3)\none = (5,)", "terms": {"en": "Immutable."}}, {"name": {"en": "Set"}, "f": "s = {1, 2, 3}\nempty = set()\ns.add(4)", "terms": {"en": "Unique, unordered."}}, {"name": {"en": "Dictionary"}, "f": "d = {\"roll\": 1, \"name\": \"Amit\"}\nd[\"name\"]\nd[\"sem\"] = 2", "terms": {"en": "Key: value."}}]}], "viva": [{"title": {"en": "Introduction to Python"}, "items": [{"q": {"en": "What is Python?"}, "a": {"en": "A high-level, interpreted, general-purpose, dynamically typed and object-oriented programming language."}}, {"q": {"en": "Who developed Python and when?"}, "a": {"en": "Guido van Rossum at CWI, Netherlands. He started in 1989 and the first release (0.9.0) was in 1991."}}, {"q": {"en": "Why is it named Python?"}, "a": {"en": "After the BBC comedy show \"Monty Python's Flying Circus\"."}}, {"q": {"en": "What is a scripting language?"}, "a": {"en": "A language whose programs (scripts) are executed directly by an interpreter without a separate compilation step, e.g. Python, JavaScript, Perl."}}, {"q": {"en": "Is Python compiled or interpreted?"}, "a": {"en": "Both, internally. Source code is compiled to byte code (.pyc), which is executed by the Python Virtual Machine (interpreter). It is generally called an interpreted language."}}, {"q": {"en": "What is PVM?"}, "a": {"en": "The Python Virtual Machine, which executes Python byte code."}}, {"q": {"en": "What is byte code?"}, "a": {"en": "Low-level, platform-independent code produced by compiling .py files; stored in .pyc files."}}, {"q": {"en": "List any five features of Python."}, "a": {"en": "Simple, interpreted, free and open source, dynamically typed, portable, object-oriented, large standard library."}}, {"q": {"en": "Give applications of Python."}, "a": {"en": "Web development (Django, Flask), data science, AI/ML, automation, GUI apps, games, IoT and scientific computing."}}, {"q": {"en": "Difference between Python 2 and Python 3?"}, "a": {"en": "Python 3 is not backward compatible: print is a function, / gives a float result, and strings are Unicode by default. Python 2 ended in 2020."}}, {"q": {"en": "What is IDLE?"}, "a": {"en": "Integrated Development and Learning Environment: Python's built-in editor and shell."}}, {"q": {"en": "What is pip?"}, "a": {"en": "Python's package installer, used to install external libraries, e.g. pip install numpy."}}, {"q": {"en": "Difference between interactive mode and script mode?"}, "a": {"en": "Interactive mode runs each statement immediately at the >>> prompt and does not save the code; script mode runs a saved .py file."}}, {"q": {"en": "What is the extension of a Python file?"}, "a": {"en": ".py (byte code files use .pyc)."}}]}, {"title": {"en": "Syntax, Keywords and Variables"}, "items": [{"q": {"en": "How are blocks defined in Python?"}, "a": {"en": "By indentation (usually 4 spaces) after a colon, instead of braces."}}, {"q": {"en": "What happens if indentation is wrong?"}, "a": {"en": "Python raises an IndentationError."}}, {"q": {"en": "How do you write comments in Python?"}, "a": {"en": "# for single-line comments; triple-quoted strings are often used for multi-line comments and docstrings."}}, {"q": {"en": "What is a docstring?"}, "a": {"en": "A triple-quoted string written as the first statement of a module, function or class, used as its documentation."}}, {"q": {"en": "What are keywords? How many are there?"}, "a": {"en": "Reserved words with a special meaning. Python 3.13 has 35 keywords."}}, {"q": {"en": "Which keywords start with a capital letter?"}, "a": {"en": "True, False and None."}}, {"q": {"en": "What is an identifier? Give its rules."}, "a": {"en": "A name for a variable, function or class. It may use letters, digits and _, must not start with a digit, cannot contain spaces or symbols, cannot be a keyword, and is case-sensitive."}}, {"q": {"en": "Is Python case-sensitive?"}, "a": {"en": "Yes. Total and total are different names."}}, {"q": {"en": "What is a variable in Python?"}, "a": {"en": "A name that refers to an object in memory. It is created when a value is assigned."}}, {"q": {"en": "What is dynamic typing?"}, "a": {"en": "The type of a variable is decided at run time from the value assigned, and it can change."}}, {"q": {"en": "How do you swap two variables in Python?"}, "a": {"en": "a, b = b, a"}}, {"q": {"en": "What does id() return?"}, "a": {"en": "The identity (unique number, related to the memory address) of an object."}}, {"q": {"en": "What is a literal?"}, "a": {"en": "A fixed value written directly in code, e.g. 10, 3.14, 'GTU', True, None."}}, {"q": {"en": "How are binary, octal and hex literals written?"}, "a": {"en": "With the prefixes 0b, 0o and 0x, e.g. 0b101, 0o17, 0x1F."}}, {"q": {"en": "How are constants created in Python?"}, "a": {"en": "There is no const keyword. Names are written in UPPERCASE by convention, e.g. PI = 3.14."}}, {"q": {"en": "What is None?"}, "a": {"en": "A special literal meaning \"no value\". Its type is NoneType."}}]}, {"title": {"en": "Input/Output and Type Casting"}, "items": [{"q": {"en": "What does input() return?"}, "a": {"en": "Always a string (str)."}}, {"q": {"en": "How do you read an integer?"}, "a": {"en": "n = int(input(\"Enter n: \"))"}}, {"q": {"en": "What are sep and end in print()?"}, "a": {"en": "sep is the separator between values (default a space); end is printed at the end (default newline)."}}, {"q": {"en": "What is an f-string?"}, "a": {"en": "A formatted string literal prefixed with f, where expressions in braces are replaced by their values, e.g. f\"Sum = {a+b}\"."}}, {"q": {"en": "What is type casting?"}, "a": {"en": "Converting a value from one data type to another using functions like int(), float(), str()."}}, {"q": {"en": "Difference between implicit and explicit conversion?"}, "a": {"en": "Implicit conversion is done automatically by Python (int to float in 3 + 2.5); explicit conversion is done by the programmer (int(\"25\"))."}}, {"q": {"en": "What is int(7.9)?"}, "a": {"en": "7. int() truncates the decimal part; it does not round."}}, {"q": {"en": "What happens with int(\"12.5\")?"}, "a": {"en": "ValueError, because \"12.5\" is not a valid integer string. Use int(float(\"12.5\"))."}}]}, {"title": {"en": "Data Types"}, "items": [{"q": {"en": "Name the built-in data types of Python."}, "a": {"en": "Numeric (int, float, complex), bool, sequence (str, list, tuple), set (set, frozenset), mapping (dict) and NoneType."}}, {"q": {"en": "Which data types are mutable?"}, "a": {"en": "list, set and dict."}}, {"q": {"en": "Which data types are immutable?"}, "a": {"en": "int, float, complex, bool, str, tuple and frozenset."}}, {"q": {"en": "Is there a char data type in Python?"}, "a": {"en": "No. A single character is a string of length 1."}}, {"q": {"en": "What is negative indexing?"}, "a": {"en": "Accessing items from the end: -1 is the last item, -2 the second last."}}, {"q": {"en": "What is slicing?"}, "a": {"en": "Extracting a part of a sequence with [start:end:step]; the end index is excluded."}}, {"q": {"en": "Difference between list and tuple?"}, "a": {"en": "A list is mutable and uses [ ]; a tuple is immutable, uses ( ) and is faster."}}, {"q": {"en": "How do you create a tuple with one item?"}, "a": {"en": "With a trailing comma: t = (5,)"}}, {"q": {"en": "What is a set?"}, "a": {"en": "An unordered collection of unique items in { }; it supports union and intersection."}}, {"q": {"en": "How do you create an empty set?"}, "a": {"en": "set(). {} creates an empty dictionary."}}, {"q": {"en": "What is a dictionary?"}, "a": {"en": "A mutable collection of key: value pairs; values are accessed by key."}}, {"q": {"en": "Can a list be a dictionary key?"}, "a": {"en": "No. Keys must be immutable; a tuple can be used instead."}}]}], "exam_questions": [{"q": {"en": "What is Python? Explain the history of Python."}, "marks": 3}, {"q": {"en": "Explain the features of Python."}, "marks": 4}, {"q": {"en": "List and explain the applications of Python."}, "marks": 3}, {"q": {"en": "Explain the steps to install Python. Differentiate between interactive mode and script mode."}, "marks": 4}, {"q": {"en": "Explain how a Python program is executed (byte code and PVM)."}, "marks": 3}, {"q": {"en": "Explain the basic structure of a Python program with example."}, "marks": 4}, {"q": {"en": "What is indentation in Python? Why is it important?"}, "marks": 3}, {"q": {"en": "What are keywords and identifiers? Write the rules for naming identifiers."}, "marks": 4}, {"q": {"en": "What is a variable? Explain dynamic typing and multiple assignment with example."}, "marks": 3}, {"q": {"en": "Explain different types of literals in Python with examples."}, "marks": 4}, {"q": {"en": "How are constants defined in Python? Differentiate between literal and constant."}, "marks": 3}, {"q": {"en": "Explain input() and print() functions with example."}, "marks": 4}, {"q": {"en": "Explain different ways of formatting output in Python."}, "marks": 3}, {"q": {"en": "What is type casting? Explain implicit and explicit type conversion with example."}, "marks": 4}, {"q": {"en": "Explain the built-in data types of Python."}, "marks": 7}, {"q": {"en": "Explain string indexing and slicing with example."}, "marks": 4}, {"q": {"en": "Explain list, tuple, set and dictionary with examples."}, "marks": 7}, {"q": {"en": "Differentiate between list, tuple, set and dictionary."}, "marks": 4}, {"q": {"en": "Differentiate between mutable and immutable data types."}, "marks": 3}, {"q": {"en": "Write a Python program to read name, contact number, email and birth date and print them."}, "marks": 3}, {"q": {"en": "Write a Python program to calculate simple      numericals:'દાખલા',ex:'✏️ ઉકેલેલો દાખલો',tapzoom:'મોટું જોવા આકૃતિ પર ટેપ કરો',unit:'એકમ',examhead:'મહત્વના પરીક્ષા પ્રશ્નો',
     intro:'વેઇટેજ',hours:'કલાક',introd:'GTU syllabus મુજબ આકૃતિ, સૂત્રો, ઉકેલેલા દાખલા અને viva સાથે વિગતવાર નોટ્સ.',
     marks:'ગુણ',programs:'પ્રોગ્રામ્સ',flowcharts:'ફ્લોચાર્ટ',syntax:'સિન્ટેક્સ',prog:'💻 પ્રોગ્રામ',code:'કોડ',output:'આઉટપુટ',expl:'સમજૂતી',
     introc:'GTU syllabus મુજબ flowcharts, આઉટપુટ સાથેના ઉકેલેલા C programs, syntax અને viva સાથે વિગતવાર નોટ્સ.'}};
const L = k => STR[S.lang][k];
const t = o => (o && typeof o === 'object') ? (o[S.lang] || o.en) : (o || '');
const chev = '<svg class="chev" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#7B2CD9" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
const dots = '<svg width="22" height="22" viewBox="0 0 24 24" fill="#222"><circle cx="12" cy="5" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="12" cy="19" r="2.2"/></svg>';
const fixTables = h => h.replace(/<table>/g,'<div class="tw"><table>').replace(/<\/table>/g,'</table></div>');
const head = (title, menu=true) => `<div class="sh"><span>${title}</span>${menu?`<button class="more" data-more>${dots}</button><div class="menu"><button data-act="expand">${L('expand')}</button><button data-act="collapse">${L('collapse')}</button></div>`:''}</div>`;
const dgInline = id => `<div class="dg" data-dg="${id}">${SVG[id]}</div><div class="dgc">📐 ${t(U.diagrams.find(d=>d.id===id).title)} · ${L('tapzoom')}</div>`;

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const KW = new Set('auto break case const continue default do else enum extern for goto if register return signed sizeof static struct switch typedef union unsigned volatile while'.split(' '));
const TY = new Set('int char float double void long short FILE size_t'.split(' '));
const PKW = new Set('False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield'.split(' '));
const PTY = new Set('int float str bool list tuple set dict complex frozenset bytes bytearray range object'.split(' '));
function hlPy(src){
  const re = /(#[^\n]*)|((?:\b[rRbBfFuU]{1,2})?(?:'{3}[\s\S]*?'{3}|"{3}[\s\S]*?"{3}|'(?:\\.|[^'\\\n])*'|"(?:\\.|[^"\\\n])*"))|(^>>>|^\.\.\.(?= ))|([A-Za-z_]\w*)(?=\s*\()|([A-Za-z_]\w*)|(\b(?:0[xXoObB][0-9a-fA-F_]+|\d[\d_]*(?:\.\d+)?(?:[eE][-+]?\d+)?j?)\b)/gm;
  let o='', last=0, m;
  while ((m = re.exec(src))){
    o += esc(src.slice(last, m.index)); last = re.lastIndex;
    const w = esc(m[0]);
    if (m[1]) o += `<span class="cm">${w}</span>`;
    else if (m[2]) o += `<span class="st">${w}</span>`;
    else if (m[3]) o += `<span class="pp">${w}</span>`;
    else if (m[4]) o += PKW.has(m[4]) ? `<span class="kw">${w}</span>` : PTY.has(m[4]) ? `<span class="ty">${w}</span>` : `<span class="fn">${w}</span>`;
    else if (m[5]) o += PKW.has(m[5]) ? `<span class="kw">${w}</span>` : PTY.has(m[5]) ? `<span class="ty">${w}</span>` : w;
    else o += `<span class="nu">${w}</span>`;
  }
  return o + esc(src.slice(last));
}
function hl(src){
  if (META.code_lang === 'python') return hlPy(src);
  const re = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(^[ \t]*#[^\n]*)|([A-Za-z_]\w*)(?=\s*\()|([A-Za-z_]\w*)|(\b\d+(?:\.\d+)?[fFlLuU]*\b)/gm;
  let o='', last=0, m;
  while ((m = re.exec(src))){
    o += esc(src.slice(last, m.index)); last = re.lastIndex;
    const w = esc(m[0]);
    if (m[1]) o += `<span class="cm">${w}</span>`;
    else if (m[2]) o += `<span class="st">${w}</span>`;
    else if (m[3]) o += `<span class="pp">${w}</span>`;
    else if (m[4]) o += KW.has(m[4]) ? `<span class="kw">${w}</span>` : TY.has(m[4]) ? `<span class="ty">${w}</span>` : `<span class="fn">${w}</span>`;
    else if (m[5]) o += KW.has(m[5]) ? `<span class="kw">${w}</span>` : TY.has(m[5]) ? `<span class="ty">${w}</span>` : w;
    else o += `<span class="nu">${w}</span>`;
  }
  return o + esc(src.slice(last));
}
const progBody = p => `<div class="pl">${L('code')}</div><pre class="code">${hl(t(p.code))}</pre><div class="pl">${L('output')}</div><pre class="out">${esc(p.out)}</pre>${p.expl?`<div class="pl">${L('expl')}</div>${fixTables(t(p.expl))}`:''}`;
const pBox = id => { const p=(U.programs||[]).find(x=>x.id===id); if(!p) return ''; return `<div class="pbox"><div class="et">${L('prog')}: ${t(p.title)}</div>${progBody(p)}</div>`; };
const exBox = id => { const n=(U.numericals||[]).find(x=>x.id===id); if(!n) return ''; return `<div class="ex"><div class="et">${L('ex')}</div><div class="eq2">${t(n.q)}</div>${fixTables(t(n.a))}</div>`; };
function notes(){
  let h = `<div class="intro"><b>${t(U.title)}</b><div>${L('unit')} ${U.unit} · ${U.weightage}% ${L('intro')} · ${U.hours} ${L('hours')}</div><div>${L(U.programs?(META.code_lang==='python'?'intropy':'introc'):'introd')}</div></div>`;
  U.notes.forEach((sec,si)=>{
    h += `<div class="sec">${head(t(sec.title))}`;
    sec.items.forEach((it,i)=>{
      const open = si===0&&i===0 ? ' open' : '';
      if (it.h) {
        h += `<div class="card${it.key?' key':''}${open}"><div class="q hd"><span class="t">${it.key?'⭐ ':''}${t(it.h)}</span>${chev}</div>
        <div class="a rn" style="padding-left:18px">${fixTables(t(it.body)).replace(/margin:0 0 10px -36px/g,'')}${it.diagram?dgInline(it.diagram):''}${(it.examples||[]).map(exBox).join('')}${(it.programs||[]).map(pBox).join('')}</div></div>`;
      } else {
        h += `<div class="card${open}"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(it.q)}</span>${chev}</div>
        <div class="a">${fixTables(t(it.a))}${it.diagram?dgInline(it.diagram):''}</div></div>`;
      }
    });
    h += `</div>`;
  });
  return h;
}
function numericals(){
  return `<div class="sec">${head(L('numericals'))}` + (U.numericals||[]).map((n,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(n.q)}</span>${chev}</div><div class="a">${fixTables(t(n.a))}</div></div>`).join('') + `</div>`;
}
function diagrams(){
  return `<div class="sec">${head(L(U.programs&&META.code_lang!=='python'?'flowcharts':'diagrams'),false)}<div style="height:10px"></div>` + U.diagrams.map((d,i)=>
    `<div class="dcard" data-dg="${d.id}"><div class="h">${i+1}. ${t(d.title)}</div>${SVG[d.id]}</div>`).join('') + `</div>`;
}
function equations(){
  return U.equations.map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><span class="fbox">${e.f}</span></span>${chev}</div>
     <div class="a"><p>${t(e.terms)}</p></div></div>`).join('') + `</div>`).join('');
}
function viva(){
  return U.viva.map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((v,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(v.q)}</span>${chev}</div><div class="a"><p>${t(v.a)}</p></div></div>`).join('') + `</div>`).join('');
}
function exam(){
  return `<div class="sec">${head(L('examhead'),false)}` + U.exam_questions.map((x,i)=>
    `<div class="card"><div class="q" style="cursor:default"><span class="n">${i+1}.</span><span class="t">${t(x.q)}</span><span class="mk">${x.marks} ${L('marks')}</span></div></div>`).join('') + `</div>`;
}
function programs(){
  return `<div class="sec">${head(L('programs'))}` + (U.programs||[]).map((p,i)=>
    `<div class="card"><div class="q hd"><span class="n">${i+1}.</span><span class="t">${t(p.title)}</span>${chev}</div><div class="a pa">${progBody(p)}</div></div>`).join('') + `</div>`;
}
function syntax(){
  return (U.syntax||[]).map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><pre class="code sx">${hl(e.f)}</pre></span>${chev}</div>
     <div class="a">${e.terms && t(e.terms) ? fixTables(t(e.terms)) : ''}</div></div>`).join('') + `</div>`).join('');
}
const flowcharts = diagrams;
const VIEWS = U.programs ? (META.code_lang==='python' ? {notes, programs, diagrams, syntax, viva, exam} : {notes, programs, flowcharts, syntax, viva, exam}) : U.numericals ? {notes, diagrams, equations, numericals, viva, exam} : {notes, diagrams, equations, viva, exam};
function render(){
  document.getElementById('title').textContent = `${L('unit')} ${U.unit}: ${t(U.title)}`;
  document.getElementById('sub').textContent = `${t(META.name)} · ${META.code}`;
  document.getElementById('lang').textContent = S.lang==='en' ? 'ગુ' : 'EN';
  document.getElementById('lang').style.display = META.languages.includes('gu') ? '' : 'none';
  document.getElementById('tabs').innerHTML = Object.keys(VIEWS).map(k=>`<button class="tab${S.tab===k?' on':''}" data-tab="${k}">${L(k)}</button>`).join('');
  document.getElementById('view').innerHTML = VIEWS[S.tab]();
  document.querySelectorAll('#view pre.c').forEach(e=>{ e.innerHTML = hl(e.textContent); e.className='code'; });
}
let zoom = 1;
function setZoom(z){ zoom = Math.min(4, Math.max(1, z)); const w=document.getElementById('zw'); w.style.width=(zoom*100)+'%'; document.getElementById('zr').textContent=Math.round(zoom*100)+'%'; }
document.addEventListener('click', e=>{
  const q = e.target.closest('.q'); if (q && q.parentElement.querySelector('.a')) { q.parentElement.classList.toggle('open'); return; }
  const tb = e.target.closest('[data-tab]'); if (tb){ S.tab = tb.dataset.tab; render(); window.scrollTo(0,0); return; }
  if (e.target.closest('#lang')){ S.lang = S.lang==='en'?'gu':'en'; render(); return; }
  const m = e.target.closest('[data-more]');
  document.querySelectorAll('.menu.show').forEach(x=>{ if(!m || x!==m.nextElementSibling) x.classList.remove('show'); });
  if (m){ m.nextElementSibling.classList.toggle('show'); return; }
  const act = e.target.closest('[data-act]');
  if (act){ act.closest('.sec').querySelectorAll('.card').forEach(c=>{ if(c.querySelector('.a')) c.classList.toggle('open', act.dataset.act==='expand'); }); act.parentElement.classList.remove('show'); return; }
  const dg = e.target.closest('[data-dg]');
  if (dg){ const id=dg.dataset.dg; document.getElementById('mt').textContent=t(U.diagrams.find(d=>d.id===id).title); document.getElementById('zw').innerHTML=SVG[id]; setZoom(1); document.getElementById('modal').classList.add('show'); return; }
  if (e.target.closest('#mx')) document.getElementById('modal').classList.remove('show');
  if (e.target.closest('#zi')) setZoom(zoom+0.5);
  if (e.target.closest('#zo')) setZoom(zoom-0.5);
  if (e.target.closest('#zr')) setZoom(1);
});
render();
</script></body></html>
