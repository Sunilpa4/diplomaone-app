<script>
const U = {"subject": "DI03000041", "unit": 1, "format": "notes", "title": {"en": "Introduction of Operating System", "gu": "Operating System નો પરિચય"}, "weightage": 13, "hours": 6, "notes": [{"title": {"en": "1.1 Introduction: Goals and Services of OS", "gu": "1.1 પરિચય: OS ના Goals અને Services"}, "items": [{"h": {"en": "1.1.1 What is an Operating System?", "gu": "1.1.1 Operating System શું છે?"}, "body": {"en": "<p>An <b>Operating System (OS)</b> is a <b>system software</b> that acts as an <b>interface between the user and the computer hardware</b>. It manages all hardware and software resources and provides an environment in which users can run programs <b>conveniently</b> and <b>efficiently</b>.</p>\n<p>The OS is the first program loaded into memory when the computer starts (<b>booting</b>), and it keeps running until the computer is shut down. The part of the OS that is always in memory is called the <b>kernel</b>.</p>\n<h4>Components of a computer system</h4>\n<ol>\n<li><b>Hardware:</b> CPU, memory, disk and I/O devices: the basic computing resources.</li>\n<li><b>Operating system:</b> controls the hardware and coordinates its use among the various programs and users.</li>\n<li><b>Application programs:</b> word processors, compilers, web browsers, games: they use the resources to solve users' problems.</li>\n<li><b>Users:</b> people, machines or other computers.</li>\n</ol>\n<h4>Two views of an OS</h4>\n<ul>\n<li><b>User view:</b> the OS is a program that makes the computer <b>easy to use</b> (good interface, ease of use).</li>\n<li><b>System view:</b> the OS is a <b>resource allocator</b> (decides who gets the CPU, memory, files and devices, and for how long) and a <b>control program</b> (controls the running of user programs and prevents errors and misuse).</li>\n</ul>\n<p><b>Examples:</b> Microsoft Windows, Linux (Ubuntu, Fedora), macOS, Unix, Android, iOS.</p>", "gu": "<p><b>Operating System (OS)</b> એક <b>system software</b> છે જે <b>user અને computer hardware વચ્ચે interface</b> તરીકે કામ કરે છે. તે બધા hardware અને software resources નું management કરે છે અને એવું વાતાવરણ આપે છે જેમાં users programs ને <b>સરળતાથી</b> અને <b>કાર્યક્ષમ રીતે</b> ચલાવી શકે.</p>\n<p>Computer શરૂ થાય ત્યારે (<b>booting</b>) memory માં load થતો પહેલો program OS છે, અને computer બંધ થાય ત્યાં સુધી તે ચાલતો રહે છે. OS નો જે ભાગ હંમેશા memory માં રહે છે તેને <b>kernel</b> કહે છે.</p>\n<h4>Computer system ના ઘટકો</h4>\n<ol>\n<li><b>Hardware:</b> CPU, memory, disk અને I/O devices: મૂળભૂત computing resources.</li>\n<li><b>Operating system:</b> hardware ને control કરે છે અને જુદા જુદા programs અને users વચ્ચે તેના ઉપયોગનું સંકલન કરે છે.</li>\n<li><b>Application programs:</b> word processors, compilers, web browsers, games: users ની સમસ્યાઓ ઉકેલવા resources વાપરે છે.</li>\n<li><b>Users:</b> લોકો, machines અથવા બીજા computers.</li>\n</ol>\n<h4>OS ના બે દૃષ્ટિકોણ</h4>\n<ul>\n<li><b>User view:</b> OS એ computer ને <b>વાપરવામાં સરળ</b> બનાવતો program છે (સારો interface, ease of use).</li>\n<li><b>System view:</b> OS એ <b>resource allocator</b> છે (CPU, memory, files અને devices કોને અને કેટલા સમય માટે મળે તે નક્કી કરે) અને <b>control program</b> છે (user programs ના execution ને control કરે અને errors તથા દુરુપયોગ અટકાવે).</li>\n</ul>\n<p><b>ઉદાહરણ:</b> Microsoft Windows, Linux (Ubuntu, Fedora), macOS, Unix, Android, iOS.</p>"}, "diagram": "os1_role"}, {"h": {"en": "1.1.2 Fundamental Goals and Functions of OS", "gu": "1.1.2 OS ના મૂળભૂત Goals અને Functions"}, "body": {"en": "<h4>Fundamental goals</h4>\n<ol>\n<li><b>Convenience:</b> make the computer easy to use; hide hardware details behind a simple interface.</li>\n<li><b>Efficiency:</b> use the CPU, memory and devices in the best possible way (high throughput, little idle time).</li>\n<li><b>Ability to evolve:</b> allow new hardware, new services and bug fixes to be added without disturbing existing work.</li>\n</ol>\n<p>Other goals: <b>reliability</b> (work correctly without crashing), <b>security and protection</b> of data, and <b>fairness</b> among users.</p>\n<h4>Functions of an OS</h4>\n<ol>\n<li><b>Process management:</b> creating and deleting processes, scheduling them on the CPU, suspending/resuming, process synchronisation and communication, deadlock handling.</li>\n<li><b>Memory management:</b> keeping track of which part of memory is used and by whom, allocating and freeing memory, deciding which process to load (virtual memory).</li>\n<li><b>File management:</b> creating, deleting, reading and writing files and directories; mapping files to disk; backup.</li>\n<li><b>Device (I/O) management:</b> controlling devices through <b>device drivers</b>, buffering, caching and spooling.</li>\n<li><b>Secondary storage management:</b> free-space management, storage allocation and <b>disk scheduling</b>.</li>\n<li><b>Security and protection:</b> user login and passwords, access rights to files and memory, protection from viruses.</li>\n<li><b>Networking / communication:</b> data exchange among computers over a network.</li>\n<li><b>User interface:</b> command line (CLI), graphical (GUI) or touch interface.</li>\n<li><b>Error detection and accounting:</b> detect hardware/software errors and keep records of resource use.</li>\n</ol>", "gu": "<h4>મૂળભૂત goals</h4>\n<ol>\n<li><b>Convenience (સુવિધા):</b> computer ને વાપરવામાં સરળ બનાવવું; hardware ની વિગતો સરળ interface પાછળ છુપાવવી.</li>\n<li><b>Efficiency (કાર્યક્ષમતા):</b> CPU, memory અને devices નો શ્રેષ્ઠ ઉપયોગ કરવો (વધુ throughput, ઓછો idle time).</li>\n<li><b>Ability to evolve (વિકાસ ક્ષમતા):</b> ચાલુ કામને ખલેલ વગર નવા hardware, નવી services અને bug fixes ઉમેરી શકાય.</li>\n</ol>\n<p>બીજા goals: <b>reliability</b> (crash વગર સાચું કામ), data ની <b>security અને protection</b>, અને users વચ્ચે <b>fairness</b>.</p>\n<h4>OS ના functions</h4>\n<ol>\n<li><b>Process management:</b> processes બનાવવી અને delete કરવી, CPU પર schedule કરવી, suspend/resume, process synchronisation અને communication, deadlock handling.</li>\n<li><b>Memory management:</b> memory નો કયો ભાગ કોણ વાપરે છે તેનો હિસાબ રાખવો, memory આપવી અને મુક્ત કરવી, કયો process load કરવો તે નક્કી કરવું (virtual memory).</li>\n<li><b>File management:</b> files અને directories બનાવવી, delete કરવી, read અને write કરવી; files ને disk સાથે map કરવી; backup.</li>\n<li><b>Device (I/O) management:</b> <b>device drivers</b> દ્વારા devices નું control, buffering, caching અને spooling.</li>\n<li><b>Secondary storage management:</b> free-space management, storage allocation અને <b>disk scheduling</b>.</li>\n<li><b>Security અને protection:</b> user login અને passwords, files અને memory ના access rights, viruses થી રક્ષણ.</li>\n<li><b>Networking / communication:</b> network પર computers વચ્ચે data ની આપ-લે.</li>\n<li><b>User interface:</b> command line (CLI), graphical (GUI) અથવા touch interface.</li>\n<li><b>Error detection અને accounting:</b> hardware/software errors શોધવી અને resource ઉપયોગનો record રાખવો.</li>\n</ol>"}, "diagram": "os1_functions"}, {"h": {"en": "1.1.3 Operating System Services", "gu": "1.1.3 Operating System Services"}, "body": {"en": "<p>An OS provides an environment for running programs. It offers certain <b>services</b> to programs and users. Programs request these services through <b>system calls</b> (e.g. <code>fork()</code>, <code>open()</code>, <code>read()</code>, <code>write()</code>), which form the interface between a running program and the OS.</p>\n<h4>(A) Services that help the user</h4>\n<ol>\n<li><b>User interface:</b> CLI (commands typed in a shell), GUI (windows, icons, mouse) or touch screen.</li>\n<li><b>Program execution:</b> load a program into memory, run it, and end it normally or abnormally (with an error).</li>\n<li><b>I/O operations:</b> a running program may need a file or device; users cannot control devices directly, so the OS does the I/O.</li>\n<li><b>File-system manipulation:</b> create, delete, read, write, search and list files and directories; manage permissions.</li>\n<li><b>Communication:</b> processes exchange data on the same computer or over a network, using <b>shared memory</b> or <b>message passing</b>.</li>\n<li><b>Error detection:</b> detect and handle errors in CPU, memory, I/O devices (e.g. printer out of paper) and user programs (e.g. divide by zero).</li>\n</ol>\n<h4>(B) Services for efficient operation of the system</h4>\n<ol>\n<li><b>Resource allocation:</b> when many users or jobs run together, the OS allocates CPU cycles, memory, files and devices to each of them.</li>\n<li><b>Accounting:</b> keeps track of which user uses how much and what kind of resources (for billing or usage statistics).</li>\n<li><b>Protection and security:</b> <b>protection</b> controls the access of processes to resources; <b>security</b> defends the system from outsiders using passwords/authentication.</li>\n</ol>", "gu": "<p>OS programs ચલાવવા માટે વાતાવરણ આપે છે. તે programs અને users ને કેટલીક <b>services</b> આપે છે. Programs આ services <b>system calls</b> (દા.ત. <code>fork()</code>, <code>open()</code>, <code>read()</code>, <code>write()</code>) દ્વારા માંગે છે, જે ચાલતા program અને OS વચ્ચેનો interface છે.</p>\n<h4>(A) User ને મદદ કરતી services</h4>\n<ol>\n<li><b>User interface:</b> CLI (shell માં commands type કરવા), GUI (windows, icons, mouse) અથવા touch screen.</li>\n<li><b>Program execution:</b> program ને memory માં load કરવો, ચલાવવો, અને સામાન્ય રીતે અથવા અસામાન્ય રીતે (error સાથે) પૂરો કરવો.</li>\n<li><b>I/O operations:</b> ચાલતા program ને file કે device જોઈએ; users devices ને સીધા control કરી શકતા નથી, તેથી OS I/O કરે છે.</li>\n<li><b>File-system manipulation:</b> files અને directories બનાવવી, delete, read, write, search અને list કરવી; permissions સંભાળવી.</li>\n<li><b>Communication:</b> processes એક જ computer પર કે network પર <b>shared memory</b> અથવા <b>message passing</b> વડે data ની આપ-લે કરે.</li>\n<li><b>Error detection:</b> CPU, memory, I/O devices (દા.ત. printer માં કાગળ ખતમ) અને user programs (દા.ત. શૂન્ય વડે ભાગાકાર) ની errors શોધી સંભાળવી.</li>\n</ol>\n<h4>(B) System ના કાર્યક્ષમ સંચાલન માટેની services</h4>\n<ol>\n<li><b>Resource allocation:</b> ઘણા users કે jobs સાથે ચાલે ત્યારે OS દરેકને CPU cycles, memory, files અને devices ફાળવે છે.</li>\n<li><b>Accounting:</b> કયો user કેટલા અને કેવા resources વાપરે છે તેનો હિસાબ રાખે (billing અથવા usage statistics માટે).</li>\n<li><b>Protection અને security:</b> <b>protection</b> processes ના resources પરના access ને control કરે છે; <b>security</b> passwords/authentication વડે બહારના લોકોથી system નું રક્ષણ કરે છે.</li>\n</ol>"}, "diagram": "os1_services"}]}, {"title": {"en": "1.2 Types of Operating System", "gu": "1.2 Operating System ના પ્રકારો"}, "items": [{"h": {"en": "1.2.1 Multiprogramming Operating System", "gu": "1.2.1 Multiprogramming Operating System"}, "body": {"en": "<p>In early <b>batch systems</b>, only one job was in memory. When that job waited for I/O (which is very slow compared to the CPU), the CPU stayed <b>idle</b>.</p>\n<p>A <b>multiprogramming OS</b> keeps <b>several jobs in main memory at the same time</b>. The OS picks one job and runs it. When this job has to wait for an I/O operation, the OS <b>switches the CPU to another job</b>. When that job waits, the CPU switches again, and so on. As long as at least one job is ready, the CPU is never idle.</p>\n<p><b>Real-life example:</b> a lawyer works on one case; while waiting for a court date, he works on another case instead of sitting idle.</p>\n<h4>Requirements</h4>\n<ul>\n<li><b>Job scheduling:</b> choose which jobs from disk are brought into memory.</li>\n<li><b>Memory management:</b> many jobs must share memory.</li>\n<li><b>CPU scheduling:</b> choose which ready job runs next.</li>\n<li><b>Protection:</b> one job must not disturb another.</li>\n</ul>\n<h4>Advantages</h4>\n<ul><li>High <b>CPU utilisation</b> and throughput.</li><li>Less idle time of CPU and devices.</li></ul>\n<h4>Disadvantages</h4>\n<ul><li>No direct user interaction with a running job.</li><li>Complex scheduling and memory management; a long job may make others wait.</li></ul>\n<p><b>Degree of multiprogramming</b> = number of processes in memory at a time.</p>", "gu": "<p>શરૂઆતની <b>batch systems</b> માં memory માં માત્ર એક job રહેતો. તે job I/O ની રાહ જુએ (જે CPU ની સરખામણીએ ઘણું ધીમું છે) ત્યારે CPU <b>idle</b> રહેતું.</p>\n<p><b>Multiprogramming OS</b> એક જ સમયે <b>main memory માં ઘણા jobs</b> રાખે છે. OS એક job પસંદ કરી તેને ચલાવે છે. આ job ને I/O operation ની રાહ જોવી પડે ત્યારે OS <b>CPU ને બીજા job પર switch કરે છે</b>. તે job રાહ જુએ ત્યારે ફરી switch થાય, વગેરે. ઓછામાં ઓછો એક job ready હોય ત્યાં સુધી CPU ક્યારેય idle રહેતું નથી.</p>\n<p><b>રોજિંદું ઉદાહરણ:</b> વકીલ એક case પર કામ કરે છે; court ની તારીખની રાહ જોતી વખતે બેસી રહેવાને બદલે બીજા case પર કામ કરે છે.</p>\n<h4>જરૂરિયાતો</h4>\n<ul>\n<li><b>Job scheduling:</b> disk પરથી કયા jobs memory માં લાવવા તે પસંદ કરવું.</li>\n<li><b>Memory management:</b> ઘણા jobs એ memory વહેંચવી પડે.</li>\n<li><b>CPU scheduling:</b> કયો ready job આગળ ચાલશે તે પસંદ કરવું.</li>\n<li><b>Protection:</b> એક job બીજાને ખલેલ ન પહોંચાડે.</li>\n</ul>\n<h4>ફાયદા</h4>\n<ul><li>વધુ <b>CPU utilisation</b> અને throughput.</li><li>CPU અને devices નો idle time ઓછો.</li></ul>\n<h4>ગેરફાયદા</h4>\n<ul><li>ચાલતા job સાથે user નું સીધું interaction નહીં.</li><li>જટિલ scheduling અને memory management; લાંબો job બીજાને રાહ જોવડાવી શકે.</li></ul>\n<p><b>Degree of multiprogramming</b> = એક સમયે memory માં રહેલી processes ની સંખ્યા.</p>"}, "diagram": "os1_multiprog"}, {"h": {"en": "1.2.2 Time-Sharing (Multitasking) Operating System", "gu": "1.2.2 Time-Sharing (Multitasking) Operating System"}, "body": {"en": "<p>A <b>time-sharing OS</b> is a logical extension of multiprogramming. The <b>CPU time is divided into small slices</b> called the <b>time quantum</b> (typically 10–100 ms). The CPU executes each user's program for one quantum and then switches to the next one in turn.</p>\n<p>The switching is so fast that <b>each user feels that he has the whole computer</b>, although many users share it through their terminals. It is also called <b>multitasking</b> (one user running many programs together, e.g. music player + browser + editor).</p>\n<h4>Features</h4>\n<ul>\n<li><b>Interactive:</b> the user gives commands and gets the response immediately.</li>\n<li>Uses <b>CPU scheduling</b> (e.g. Round Robin) and fast <b>context switching</b>.</li>\n<li>Needs <b>memory management</b>, <b>virtual memory</b>, file system and <b>protection</b>.</li>\n</ul>\n<h4>Advantages</h4>\n<ul><li>Quick <b>response time</b>; many users share costly hardware.</li><li>Reduces CPU idle time; avoids duplication of software.</li></ul>\n<h4>Disadvantages</h4>\n<ul><li>Problems of reliability, security and data integrity.</li><li>Overhead of frequent context switches; data communication problems.</li></ul>\n<p><b>Examples:</b> Unix, Linux, Multics, Windows (desktop multitasking).</p>\n<h4>Multiprogramming vs Time sharing</h4>\n<table><tr><th>Point</th><th>Multiprogramming</th><th>Time sharing</th></tr><tr><td>Aim</td><td>Maximise CPU use</td><td>Minimise response time</td></tr><tr><td>CPU switch when</td><td>Running job waits for I/O</td><td>Time slice (quantum) ends, or I/O</td></tr><tr><td>User interaction</td><td>Little or none (batch jobs)</td><td>Interactive; many users at terminals</td></tr><tr><td>Extra need</td><td>Job scheduling, memory management</td><td>CPU scheduling, fast context switch, protection</td></tr><tr><td>Example</td><td>IBM OS/360</td><td>Unix, Linux</td></tr></table>", "gu": "<p><b>Time-sharing OS</b> એ multiprogramming નું તાર્કિક વિસ્તરણ છે. <b>CPU time ને નાના ભાગો</b> માં વહેંચવામાં આવે છે જેને <b>time quantum</b> (સામાન્ય રીતે 10–100 ms) કહે છે. CPU દરેક user ના program ને એક quantum સુધી ચલાવે છે અને પછી વારાફરતી બીજા પર જાય છે.</p>\n<p>Switching એટલું ઝડપી છે કે ઘણા users terminals દ્વારા computer વહેંચતા હોવા છતાં <b>દરેક user ને લાગે છે કે આખું computer તેનું જ છે</b>. તેને <b>multitasking</b> પણ કહે છે (એક user ઘણા programs સાથે ચલાવે, દા.ત. music player + browser + editor).</p>\n<h4>લક્ષણો</h4>\n<ul>\n<li><b>Interactive:</b> user commands આપે અને તરત response મળે.</li>\n<li><b>CPU scheduling</b> (દા.ત. Round Robin) અને ઝડપી <b>context switching</b> વાપરે.</li>\n<li><b>Memory management</b>, <b>virtual memory</b>, file system અને <b>protection</b> જરૂરી.</li>\n</ul>\n<h4>ફાયદા</h4>\n<ul><li>ઝડપી <b>response time</b>; ઘણા users મોંઘું hardware વહેંચે.</li><li>CPU idle time ઘટે; software નું duplication ટળે.</li></ul>\n<h4>ગેરફાયદા</h4>\n<ul><li>Reliability, security અને data integrity ની સમસ્યા.</li><li>વારંવાર context switch નો overhead; data communication ની સમસ્યા.</li></ul>\n<p><b>ઉદાહરણ:</b> Unix, Linux, Multics, Windows (desktop multitasking).</p>\n<h4>Multiprogramming vs Time sharing</h4>\n<table><tr><th>મુદ્દો</th><th>Multiprogramming</th><th>Time sharing</th></tr><tr><td>હેતુ</td><td>CPU નો મહત્તમ ઉપયોગ</td><td>Response time ઓછો કરવો</td></tr><tr><td>CPU ક્યારે બદલાય</td><td>ચાલતો job I/O ની રાહ જુએ ત્યારે</td><td>Time slice (quantum) પૂરો થાય, અથવા I/O</td></tr><tr><td>User interaction</td><td>ઓછું કે નહીં (batch jobs)</td><td>Interactive; terminals પર ઘણા users</td></tr><tr><td>વધારાની જરૂર</td><td>Job scheduling, memory management</td><td>CPU scheduling, ઝડપી context switch, protection</td></tr><tr><td>ઉદાહરણ</td><td>IBM OS/360</td><td>Unix, Linux</td></tr></table>"}, "diagram": "os1_timeshare"}, {"h": {"en": "1.2.3 Real-Time Operating System (RTOS)", "gu": "1.2.3 Real-Time Operating System (RTOS)"}, "body": {"en": "<p>A <b>real-time OS</b> is used when the <b>result must be produced within a fixed time limit (deadline)</b>. A correct result that comes late is treated as a wrong result. The time from an event (input) to the system's response is called the <b>response time</b>; in an RTOS it must be small and <b>predictable</b>.</p>\n<p>RTOS is used in systems that control machines or processes, using <b>sensors</b> to read data and <b>actuators</b> to act on it.</p>\n<h4>Types</h4>\n<ol>\n<li><b>Hard real-time system:</b> the deadline must <b>always</b> be met. Missing it causes failure, which may be dangerous. Data is kept in fast memory/ROM; virtual memory and long disk delays are avoided. Examples: airbag system, heart pacemaker, anti-lock brakes (ABS), missile and flight control, industrial robots.</li>\n<li><b>Soft real-time system:</b> a critical task gets <b>priority</b> over other tasks, but an occasional missed deadline is acceptable; only quality drops. Examples: video/audio streaming, online games, VoIP calls, virtual reality.</li>\n</ol>\n<h4>Features</h4>\n<ul><li>Fast, predictable response; priority-based <b>pre-emptive scheduling</b>.</li><li>High reliability; small size; little user interface.</li></ul>\n<p><b>Examples of RTOS:</b> VxWorks, QNX, FreeRTOS, RTLinux, Windows CE.</p>\n<h4>Hard vs Soft real-time</h4>\n<table><tr><th>Point</th><th>Hard real-time</th><th>Soft real-time</th></tr><tr><td>Deadline</td><td>Must always be met</td><td>Small misses are allowed</td></tr><tr><td>Missed deadline</td><td>System failure, may be dangerous</td><td>Only quality / performance drops</td></tr><tr><td>Use of disk, virtual memory</td><td>Avoided (unpredictable delay)</td><td>Can be used</td></tr><tr><td>Examples</td><td>Airbag, pacemaker, ABS, missile control</td><td>Video streaming, online games, VoIP</td></tr></table>", "gu": "<p><b>Real-time OS</b> ત્યારે વપરાય છે જ્યારે <b>પરિણામ નક્કી સમય મર્યાદા (deadline) માં મળવું જ જોઈએ</b>. મોડું આવેલું સાચું પરિણામ પણ ખોટું ગણાય છે. Event (input) થી system ના response સુધીના સમયને <b>response time</b> કહે છે; RTOS માં તે નાનો અને <b>predictable</b> હોવો જોઈએ.</p>\n<p>RTOS machines કે processes ને control કરતી systems માં વપરાય છે, જ્યાં data વાંચવા <b>sensors</b> અને કામ કરવા <b>actuators</b> હોય છે.</p>\n<h4>પ્રકારો</h4>\n<ol>\n<li><b>Hard real-time system:</b> deadline <b>હંમેશા</b> પૂરી થવી જ જોઈએ. ચૂકે તો failure થાય, જે જોખમી બની શકે. Data ઝડપી memory/ROM માં રખાય; virtual memory અને disk ના લાંબા delay ટાળવામાં આવે. ઉદાહરણ: airbag system, heart pacemaker, anti-lock brakes (ABS), missile અને flight control, industrial robots.</li>\n<li><b>Soft real-time system:</b> critical task ને બીજા tasks કરતાં <b>priority</b> મળે, પણ ક્યારેક deadline ચૂકાય તો ચાલે; માત્ર quality ઘટે. ઉદાહરણ: video/audio streaming, online games, VoIP calls, virtual reality.</li>\n</ol>\n<h4>લક્ષણો</h4>\n<ul><li>ઝડપી, predictable response; priority આધારિત <b>pre-emptive scheduling</b>.</li><li>ઊંચી reliability; નાનું કદ; ઓછો user interface.</li></ul>\n<p><b>RTOS ના ઉદાહરણ:</b> VxWorks, QNX, FreeRTOS, RTLinux, Windows CE.</p>\n<h4>Hard vs Soft real-time</h4>\n<table><tr><th>મુદ્દો</th><th>Hard real-time</th><th>Soft real-time</th></tr><tr><td>Deadline</td><td>હંમેશા પૂરી થવી જ જોઈએ</td><td>નાની ચૂક ચાલે</td></tr><tr><td>Deadline ચૂકે તો</td><td>System failure, જોખમી બની શકે</td><td>માત્ર quality / performance ઘટે</td></tr><tr><td>Disk, virtual memory નો ઉપયોગ</td><td>ટાળવામાં આવે (અનિશ્ચિત delay)</td><td>વાપરી શકાય</td></tr><tr><td>ઉદાહરણ</td><td>Airbag, pacemaker, ABS, missile control</td><td>Video streaming, online games, VoIP</td></tr></table>"}, "diagram": "os1_realtime"}, {"h": {"en": "1.2.4 Multithreading Operating System", "gu": "1.2.4 Multithreading Operating System"}, "body": {"en": "<p>A <b>thread</b> is the smallest unit of CPU execution, also called a <b>light-weight process</b>. Each thread has its own <b>thread ID, program counter, registers and stack</b>, but all threads of a process <b>share the code, data and open files</b> of that process.</p>\n<p>A <b>multithreading OS</b> allows <b>one process to have many threads</b> that run concurrently (on one CPU by switching, or truly in parallel on a multi-core CPU).</p>\n<p><b>Examples:</b> a web browser loads images in one thread while you scroll in another; a word processor checks spelling, saves automatically and accepts typing at the same time; a web server serves each client in a separate thread.</p>\n<h4>Benefits</h4>\n<ol>\n<li><b>Responsiveness:</b> the program keeps responding even if one part is busy.</li>\n<li><b>Resource sharing:</b> threads share memory and files without extra effort.</li>\n<li><b>Economy:</b> creating and switching threads is cheaper than processes.</li>\n<li><b>Scalability:</b> threads can run in parallel on multi-core processors.</li>\n</ol>\n<h4>Types of threads</h4>\n<ul>\n<li><b>User-level threads:</b> managed by a thread library in user space; fast, but the kernel does not know them.</li>\n<li><b>Kernel-level threads:</b> managed directly by the OS kernel; slower to create, but the kernel can schedule them on different CPUs.</li>\n</ul>\n<p>Multithreading models: <b>many-to-one</b>, <b>one-to-one</b> and <b>many-to-many</b> (user threads to kernel threads). Windows, Linux, macOS and Solaris support multithreading.</p>", "gu": "<p><b>Thread</b> એ CPU execution નો સૌથી નાનો એકમ છે, જેને <b>light-weight process</b> પણ કહે છે. દરેક thread ને પોતાના <b>thread ID, program counter, registers અને stack</b> હોય છે, પણ process ના બધા threads તે process ના <b>code, data અને open files વહેંચે છે</b>.</p>\n<p><b>Multithreading OS</b> <b>એક process માં ઘણા threads</b> ને સાથે ચલાવવા દે છે (એક CPU પર switching વડે, અથવા multi-core CPU પર ખરેખર parallel).</p>\n<p><b>ઉદાહરણ:</b> web browser એક thread માં images load કરે અને બીજા thread માં તમે scroll કરો; word processor એક સાથે spelling તપાસે, આપોઆપ save કરે અને typing સ્વીકારે; web server દરેક client ને અલગ thread માં સેવા આપે.</p>\n<h4>ફાયદા</h4>\n<ol>\n<li><b>Responsiveness:</b> એક ભાગ વ્યસ્ત હોય તો પણ program response આપતો રહે.</li>\n<li><b>Resource sharing:</b> threads વધારાના પ્રયત્ન વગર memory અને files વહેંચે.</li>\n<li><b>Economy:</b> threads બનાવવા અને switch કરવા processes કરતાં સસ્તું.</li>\n<li><b>Scalability:</b> multi-core processors પર threads parallel ચાલી શકે.</li>\n</ol>\n<h4>Threads ના પ્રકાર</h4>\n<ul>\n<li><b>User-level threads:</b> user space માં thread library વડે સંચાલિત; ઝડપી, પણ kernel તેમને જાણતું નથી.</li>\n<li><b>Kernel-level threads:</b> OS kernel સીધું સંચાલન કરે; બનાવવામાં ધીમા, પણ kernel તેમને જુદા CPUs પર schedule કરી શકે.</li>\n</ul>\n<p>Multithreading models: <b>many-to-one</b>, <b>one-to-one</b> અને <b>many-to-many</b> (user threads થી kernel threads). Windows, Linux, macOS અને Solaris multithreading support કરે છે.</p>"}, "diagram": "os1_multithread"}, {"h": {"en": "1.2.5 Distributed Operating System", "gu": "1.2.5 Distributed Operating System"}, "body": {"en": "<p>A <b>distributed OS</b> manages a group of <b>independent computers (sites/nodes)</b> connected by a <b>communication network</b> and makes them appear to the user as a <b>single computer</b>. Each node has its own CPU, memory and disk (<b>loosely coupled</b> system); nodes communicate by passing messages over the network (LAN/WAN).</p>\n<p>The user does not need to know on which machine a program runs or where a file is stored (<b>transparency</b>).</p>\n<h4>Advantages</h4>\n<ol>\n<li><b>Resource sharing:</b> a user at one site can use files, printers and data of another site.</li>\n<li><b>Computation speed-up:</b> a job is divided into parts that run on different sites at the same time (<b>load sharing</b>).</li>\n<li><b>Reliability:</b> if one site fails, the remaining sites continue to work.</li>\n<li><b>Communication:</b> users at different sites exchange information (e-mail, file transfer).</li>\n<li><b>Scalability:</b> new computers can be added easily.</li>\n</ol>\n<h4>Disadvantages</h4>\n<ul><li>Complex software; network failure can stop communication.</li><li>Security problems because data travels over the network; costly set-up.</li></ul>\n<p><b>Examples:</b> Amoeba, LOCUS, Mach; modern cloud and cluster systems (Google, Hadoop clusters) use the same ideas.</p>\n<p><b>Note:</b> a <b>network OS</b> (e.g. Windows Server) lets users access remote machines knowingly; a <b>distributed OS</b> hides the network completely.</p>", "gu": "<p><b>Distributed OS</b> <b>communication network</b> થી જોડાયેલા <b>સ્વતંત્ર computers (sites/nodes)</b> ના જૂથનું સંચાલન કરે છે અને user ને તે <b>એક જ computer</b> જેવા દેખાડે છે. દરેક node ને પોતાનું CPU, memory અને disk હોય છે (<b>loosely coupled</b> system); nodes network (LAN/WAN) પર messages મોકલી communicate કરે છે.</p>\n<p>Program કયા machine પર ચાલે છે કે file ક્યાં store છે તે user ને જાણવાની જરૂર નથી (<b>transparency</b>).</p>\n<h4>ફાયદા</h4>\n<ol>\n<li><b>Resource sharing:</b> એક site નો user બીજી site ની files, printers અને data વાપરી શકે.</li>\n<li><b>Computation speed-up:</b> job ને ભાગોમાં વહેંચી જુદી sites પર એક સાથે ચલાવાય (<b>load sharing</b>).</li>\n<li><b>Reliability:</b> એક site fail થાય તો બાકીની sites કામ ચાલુ રાખે.</li>\n<li><b>Communication:</b> જુદી sites ના users માહિતીની આપ-લે કરે (e-mail, file transfer).</li>\n<li><b>Scalability:</b> નવા computers સરળતાથી ઉમેરી શકાય.</li>\n</ol>\n<h4>ગેરફાયદા</h4>\n<ul><li>જટિલ software; network failure communication અટકાવી શકે.</li><li>Data network પર જાય તેથી security ની સમસ્યા; set-up મોંઘું.</li></ul>\n<p><b>ઉદાહરણ:</b> Amoeba, LOCUS, Mach; આધુનિક cloud અને cluster systems (Google, Hadoop clusters) આ જ વિચાર વાપરે છે.</p>\n<p><b>નોંધ:</b> <b>network OS</b> (દા.ત. Windows Server) માં users જાણીને remote machines વાપરે છે; <b>distributed OS</b> network ને સંપૂર્ણ છુપાવે છે.</p>"}, "diagram": "os1_distributed"}, {"h": {"en": "1.2.6 Embedded Operating System", "gu": "1.2.6 Embedded Operating System"}, "body": {"en": "<p>An <b>embedded OS</b> is a small OS designed to run inside an <b>embedded system</b>: a computer built into a device to perform a <b>specific, dedicated task</b>. The user usually does not even see it as a computer.</p>\n<p>It runs on a <b>microcontroller</b> or small processor, is stored in <b>ROM / flash memory</b>, takes input from <b>sensors or buttons</b>, and controls <b>motors, displays or other outputs</b>.</p>\n<h4>Features</h4>\n<ul>\n<li>Designed for <b>one dedicated job</b>; limited or no user interface.</li>\n<li><b>Small size</b>, needs little memory; <b>low power</b> (battery devices).</li>\n<li><b>Fast and reliable</b>; often <b>real-time</b>.</li>\n<li>Low cost; usually cannot be changed by the user.</li>\n</ul>\n<h4>Examples of devices</h4>\n<p>Washing machine, microwave oven, digital camera, smart TV, set-top box, ATM, car engine control unit, traffic lights, smartwatch, printers and routers, IoT devices.</p>\n<p><b>Embedded OS examples:</b> FreeRTOS, Embedded Linux, VxWorks, Zephyr, Windows IoT, Android Things.</p>\n<h4>Advantages / disadvantages</h4>\n<ul><li><b>+</b> Fast, small, cheap, reliable, low power.</li><li><b>−</b> Limited resources; hard to upgrade; one-purpose only.</li></ul>", "gu": "<p><b>Embedded OS</b> એક નાની OS છે જે <b>embedded system</b> ની અંદર ચાલવા માટે બનાવાય છે: <b>ચોક્કસ, નિર્ધારિત કામ</b> કરવા device માં જ બનાવેલું computer. User ઘણી વાર તેને computer તરીકે જોતો પણ નથી.</p>\n<p>તે <b>microcontroller</b> કે નાના processor પર ચાલે, <b>ROM / flash memory</b> માં store હોય, <b>sensors અથવા buttons</b> પાસેથી input લે, અને <b>motors, displays અથવા બીજા outputs</b> ને control કરે.</p>\n<h4>લક્ષણો</h4>\n<ul>\n<li><b>એક નિર્ધારિત કામ</b> માટે બનેલી; મર્યાદિત કે કોઈ user interface નહીં.</li>\n<li><b>નાનું કદ</b>, ઓછી memory જોઈએ; <b>ઓછો power</b> (battery devices).</li>\n<li><b>ઝડપી અને reliable</b>; ઘણી વાર <b>real-time</b>.</li>\n<li>ઓછી કિંમત; સામાન્ય રીતે user બદલી શકતો નથી.</li>\n</ul>\n<h4>Devices ના ઉદાહરણ</h4>\n<p>Washing machine, microwave oven, digital camera, smart TV, set-top box, ATM, car engine control unit, traffic lights, smartwatch, printers અને routers, IoT devices.</p>\n<p><b>Embedded OS ના ઉદાહરણ:</b> FreeRTOS, Embedded Linux, VxWorks, Zephyr, Windows IoT, Android Things.</p>\n<h4>ફાયદા / ગેરફાયદા</h4>\n<ul><li><b>+</b> ઝડપી, નાની, સસ્તી, reliable, ઓછો power.</li><li><b>−</b> મર્યાદિત resources; upgrade મુશ્કેલ; માત્ર એક હેતુ.</li></ul>"}, "diagram": "os1_embedded"}, {"h": {"en": "1.2.7 Comparison of Types of OS", "gu": "1.2.7 OS ના પ્રકારોની સરખામણી"}, "body": {"en": "<p>The table below summarises the six types of OS in the syllabus. A modern OS such as Linux or Windows combines several of them: it is multiprogrammed, time-shared and multithreaded, and supports networking.</p>\n<table><tr><th>Type</th><th>Main idea</th><th>Main goal</th><th>Example</th></tr><tr><td>Multiprogramming</td><td>Many jobs in memory; CPU switches when a job waits for I/O</td><td>Maximum CPU utilisation</td><td>IBM OS/360</td></tr><tr><td>Time sharing</td><td>CPU time divided into small slices among users</td><td>Minimum response time</td><td>Unix, Multics</td></tr><tr><td>Real time</td><td>Result must come within a fixed deadline</td><td>Meet deadlines</td><td>VxWorks, QNX</td></tr><tr><td>Multithreading</td><td>One process has many threads running together</td><td>Responsiveness, parallelism</td><td>Windows, Linux</td></tr><tr><td>Distributed</td><td>Many networked computers look like one system</td><td>Resource sharing, reliability</td><td>Amoeba, LOCUS</td></tr><tr><td>Embedded</td><td>Built into a device for a dedicated job</td><td>Small size, low power</td><td>FreeRTOS, Embedded Linux</td></tr></table>", "gu": "<p>નીચેનું table syllabus ના છ પ્રકારની OS નો સાર આપે છે. Linux કે Windows જેવી આધુનિક OS તેમાંના ઘણાને જોડે છે: તે multiprogrammed, time-shared અને multithreaded છે, અને networking support કરે છે.</p>\n<table><tr><th>પ્રકાર</th><th>મુખ્ય વિચાર</th><th>મુખ્ય ધ્યેય</th><th>ઉદાહરણ</th></tr><tr><td>Multiprogramming</td><td>Memory માં ઘણા jobs; job I/O ની રાહ જુએ ત્યારે CPU બીજા job પર જાય</td><td>મહત્તમ CPU utilisation</td><td>IBM OS/360</td></tr><tr><td>Time sharing</td><td>CPU time ના નાના ભાગ users વચ્ચે વહેંચાય</td><td>ઓછામાં ઓછો response time</td><td>Unix, Multics</td></tr><tr><td>Real time</td><td>પરિણામ નક્કી deadline માં મળવું જોઈએ</td><td>Deadlines પૂરી કરવી</td><td>VxWorks, QNX</td></tr><tr><td>Multithreading</td><td>એક process માં ઘણા threads સાથે ચાલે</td><td>Responsiveness, parallelism</td><td>Windows, Linux</td></tr><tr><td>Distributed</td><td>Network થી જોડાયેલા ઘણા computers એક system જેવા દેખાય</td><td>Resource sharing, reliability</td><td>Amoeba, LOCUS</td></tr><tr><td>Embedded</td><td>ચોક્કસ કામ માટે device માં જ બનાવેલી</td><td>નાનું કદ, ઓછો power</td><td>FreeRTOS, Embedded Linux</td></tr></table>"}}]}, {"title": {"en": "1.3 Structure of Operating System", "gu": "1.3 Operating System નું Structure"}, "items": [{"h": {"en": "1.3.0 Introduction: Kernel, User Mode and Kernel Mode", "gu": "1.3.0 પરિચય: Kernel, User Mode અને Kernel Mode"}, "body": {"en": "<p>The <b>structure</b> of an OS means how its parts (process manager, memory manager, file system, drivers) are organised and connected. A large OS must be divided into small parts so that it is easy to build, test and change.</p>\n<ul>\n<li><b>Kernel:</b> the core part of the OS that is always in memory and has full control of the hardware.</li>\n<li><b>Kernel mode (supervisor mode):</b> code can execute every instruction, including privileged ones, and access all memory. The kernel runs here.</li>\n<li><b>User mode:</b> restricted mode for application programs. To get an OS service, a program makes a <b>system call</b>, which switches the CPU from user mode to kernel mode (mode bit: 0 = kernel, 1 = user).</li>\n</ul>\n<p>The syllabus covers three structures: <b>layered</b>, <b>monolithic</b> and <b>microkernel</b>. They differ in how much code runs in kernel mode.</p>", "gu": "<p>OS નું <b>structure</b> એટલે તેના ભાગો (process manager, memory manager, file system, drivers) કઈ રીતે ગોઠવાયેલા અને જોડાયેલા છે. મોટી OS ને નાના ભાગોમાં વહેંચવી પડે જેથી તેને બનાવવી, test કરવી અને બદલવી સરળ બને.</p>\n<ul>\n<li><b>Kernel:</b> OS નો મુખ્ય ભાગ જે હંમેશા memory માં રહે છે અને hardware પર સંપૂર્ણ control ધરાવે છે.</li>\n<li><b>Kernel mode (supervisor mode):</b> code privileged સહિત દરેક instruction ચલાવી શકે અને આખી memory access કરી શકે. Kernel અહીં ચાલે છે.</li>\n<li><b>User mode:</b> application programs માટેનો મર્યાદિત mode. OS service મેળવવા program <b>system call</b> કરે છે, જે CPU ને user mode માંથી kernel mode માં લઈ જાય છે (mode bit: 0 = kernel, 1 = user).</li>\n</ul>\n<p>Syllabus માં ત્રણ structures છે: <b>layered</b>, <b>monolithic</b> અને <b>microkernel</b>. Kernel mode માં કેટલો code ચાલે છે તેમાં તેઓ જુદા પડે છે.</p>"}}, {"h": {"en": "1.3.1 Layered Structure", "gu": "1.3.1 Layered Structure"}, "body": {"en": "<p>In the <b>layered approach</b>, the OS is divided into a number of <b>layers (levels)</b>, each built on top of the lower one. The bottom layer (<b>layer 0</b>) is the <b>hardware</b> and the highest layer (<b>layer N</b>) is the <b>user interface</b>.</p>\n<p><b>Rule:</b> each layer uses <b>only the functions and services of the layer just below it</b>, and provides services to the layer above it. A layer does not need to know how the lower layer works; it only needs to know <b>what</b> it does (data hiding).</p>\n<h4>Example: THE operating system (Dijkstra, 1968)</h4>\n<ul>\n<li>Layer 5: user programs</li>\n<li>Layer 4: buffering for I/O devices</li>\n<li>Layer 3: operator–console (process) communication</li>\n<li>Layer 2: memory management</li>\n<li>Layer 1: CPU scheduling</li>\n<li>Layer 0: hardware</li>\n</ul>\n<h4>Advantages</h4>\n<ul>\n<li><b>Simple to build and debug:</b> layer 1 is tested first using only hardware; when it works, layer 2 is tested, and so on. An error found in a layer must be in that layer.</li>\n<li><b>Modularity and data hiding:</b> a layer can be changed without affecting the others if its interface stays the same.</li>\n</ul>\n<h4>Disadvantages</h4>\n<ul>\n<li><b>Hard to define the layers:</b> each layer may use only lower layers, so careful planning is needed (e.g. the disk driver must be below memory management, which uses it for swapping).</li>\n<li><b>Less efficient:</b> a request passes through many layers, and each adds overhead.</li>\n</ul>", "gu": "<p><b>Layered approach</b> માં OS ને ઘણા <b>layers (levels)</b> માં વહેંચવામાં આવે છે, દરેક નીચેના layer ઉપર બનેલો. સૌથી નીચેનો layer (<b>layer 0</b>) <b>hardware</b> છે અને સૌથી ઉપરનો (<b>layer N</b>) <b>user interface</b> છે.</p>\n<p><b>નિયમ:</b> દરેક layer <b>માત્ર તેની તરત નીચેના layer ના functions અને services</b> વાપરે છે, અને ઉપરના layer ને services આપે છે. નીચેનો layer <b>કેવી રીતે</b> કામ કરે છે તે જાણવાની જરૂર નથી; તે <b>શું</b> કરે છે એટલું જ જાણવું પડે (data hiding).</p>\n<h4>ઉદાહરણ: THE operating system (Dijkstra, 1968)</h4>\n<ul>\n<li>Layer 5: user programs</li>\n<li>Layer 4: I/O devices માટે buffering</li>\n<li>Layer 3: operator–console (process) communication</li>\n<li>Layer 2: memory management</li>\n<li>Layer 1: CPU scheduling</li>\n<li>Layer 0: hardware</li>\n</ul>\n<h4>ફાયદા</h4>\n<ul>\n<li><b>બનાવવું અને debug કરવું સરળ:</b> પહેલાં માત્ર hardware વાપરી layer 1 test થાય; તે બરાબર ચાલે પછી layer 2, વગેરે. કોઈ layer માં મળેલી error તે જ layer માં હોય.</li>\n<li><b>Modularity અને data hiding:</b> interface સરખો રહે તો એક layer ને બીજાને અસર વગર બદલી શકાય.</li>\n</ul>\n<h4>ગેરફાયદા</h4>\n<ul>\n<li><b>Layers નક્કી કરવા મુશ્કેલ:</b> દરેક layer માત્ર નીચેના layers વાપરી શકે, તેથી કાળજીપૂર્વક આયોજન જોઈએ (દા.ત. disk driver memory management ની નીચે હોવો જોઈએ, કારણ કે swapping માટે તે તેને વાપરે છે).</li>\n<li><b>ઓછી કાર્યક્ષમ:</b> request ઘણા layers માંથી પસાર થાય, અને દરેક overhead ઉમેરે.</li>\n</ul>"}, "diagram": "os1_layered"}, {"h": {"en": "1.3.2 Monolithic Structure", "gu": "1.3.2 Monolithic Structure"}, "body": {"en": "<p>In a <b>monolithic kernel</b>, the <b>entire OS runs as one large program in kernel mode</b>. Process management, memory management, file system, device drivers, networking and IPC are all inside a single kernel and share one address space. Any function can directly call any other function.</p>\n<p>User programs request services through the <b>system call interface</b>; the kernel then does the whole job itself.</p>\n<p><b>Simple monolithic</b> (no clear structure, e.g. <b>MS-DOS</b>): application programs could even access the hardware directly, so one faulty program could crash the whole system.</p>\n<p><b>Modular monolithic</b> (e.g. <b>Linux</b>): the kernel is still one large program, but parts such as device drivers can be added or removed at run time as <b>loadable kernel modules</b>.</p>\n<h4>Advantages</h4>\n<ul>\n<li><b>High performance:</b> services communicate through fast, direct function calls; there is very little overhead.</li>\n<li>Simple design for small systems.</li>\n</ul>\n<h4>Disadvantages</h4>\n<ul>\n<li><b>Low reliability:</b> a bug in any part (e.g. a driver) can crash the entire system.</li>\n<li><b>Difficult to maintain, extend and debug</b> because the code is large and closely connected.</li>\n<li>Adding a new feature often means recompiling the whole kernel (unless modules are used).</li>\n</ul>\n<p><b>Examples:</b> MS-DOS, traditional Unix, Linux, FreeBSD.</p>", "gu": "<p><b>Monolithic kernel</b> માં <b>આખી OS kernel mode માં એક મોટા program તરીકે ચાલે છે</b>. Process management, memory management, file system, device drivers, networking અને IPC બધું એક જ kernel માં હોય છે અને એક જ address space વહેંચે છે. કોઈ પણ function બીજા કોઈ પણ function ને સીધું call કરી શકે.</p>\n<p>User programs <b>system call interface</b> દ્વારા services માંગે છે; પછી kernel પોતે આખું કામ કરે છે.</p>\n<p><b>Simple monolithic</b> (સ્પષ્ટ structure નહીં, દા.ત. <b>MS-DOS</b>): application programs hardware ને સીધું પણ access કરી શકતા, તેથી એક ખરાબ program આખી system crash કરી શકતો.</p>\n<p><b>Modular monolithic</b> (દા.ત. <b>Linux</b>): kernel હજી એક મોટો program છે, પણ device drivers જેવા ભાગો run time પર <b>loadable kernel modules</b> તરીકે ઉમેરી કે કાઢી શકાય.</p>\n<h4>ફાયદા</h4>\n<ul>\n<li><b>ઊંચું performance:</b> services ઝડપી, સીધા function calls થી communicate કરે; overhead ખૂબ ઓછો.</li>\n<li>નાની systems માટે સરળ design.</li>\n</ul>\n<h4>ગેરફાયદા</h4>\n<ul>\n<li><b>ઓછી reliability:</b> કોઈ પણ ભાગ (દા.ત. driver) નો bug આખી system crash કરી શકે.</li>\n<li>Code મોટો અને નજીકથી જોડાયેલો હોવાથી <b>maintain, extend અને debug કરવું મુશ્કેલ</b>.</li>\n<li>નવું feature ઉમેરવા ઘણી વાર આખું kernel ફરી compile કરવું પડે (modules ન હોય તો).</li>\n</ul>\n<p><b>ઉદાહરણ:</b> MS-DOS, પરંપરાગત Unix, Linux, FreeBSD.</p>"}, "diagram": "os1_monolithic"}, {"h": {"en": "1.3.3 Microkernel Structure", "gu": "1.3.3 Microkernel Structure"}, "body": {"en": "<p>In the <b>microkernel approach</b>, all non-essential parts are <b>removed from the kernel</b> and run as ordinary programs in <b>user mode</b>, called <b>servers</b>. The kernel becomes very small (a <b>microkernel</b>).</p>\n<p>The microkernel keeps only the minimum functions:</p>\n<ul>\n<li><b>Inter-process communication (IPC)</b>, i.e. message passing</li>\n<li>Basic <b>CPU scheduling</b> and process/thread management</li>\n<li>Basic <b>memory management</b></li>\n</ul>\n<p>File system, device drivers, networking etc. run as <b>user-level servers</b>. When an application wants to read a file, it sends a <b>message</b> to the file server <b>through the microkernel</b>; the file server does the work and replies with a message.</p>\n<h4>Advantages</h4>\n<ul>\n<li><b>Reliability and security:</b> if a server (e.g. a driver) fails, only that server is restarted; the kernel keeps running.</li>\n<li><b>Easy to extend:</b> new services are added as user-mode servers without changing the kernel.</li>\n<li><b>Portability:</b> the small kernel is easy to move to new hardware.</li>\n</ul>\n<h4>Disadvantages</h4>\n<ul>\n<li><b>Lower performance:</b> many messages and user–kernel mode switches add overhead.</li>\n</ul>\n<p><b>Examples:</b> QNX (used in cars), MINIX 3, L4, Mach. <b>Hybrid kernels</b> mix both ideas: macOS (XNU = Mach + BSD) and Windows NT.</p>", "gu": "<p><b>Microkernel approach</b> માં બધા બિન-જરૂરી ભાગો <b>kernel માંથી કાઢી</b> નાખી <b>user mode</b> માં સામાન્ય programs તરીકે ચલાવાય છે, જેને <b>servers</b> કહે છે. Kernel ખૂબ નાનું બને છે (<b>microkernel</b>).</p>\n<p>Microkernel માત્ર ઓછામાં ઓછા functions રાખે છે:</p>\n<ul>\n<li><b>Inter-process communication (IPC)</b>, એટલે કે message passing</li>\n<li>મૂળભૂત <b>CPU scheduling</b> અને process/thread management</li>\n<li>મૂળભૂત <b>memory management</b></li>\n</ul>\n<p>File system, device drivers, networking વગેરે <b>user-level servers</b> તરીકે ચાલે છે. Application ને file વાંચવી હોય ત્યારે તે <b>microkernel દ્વારા</b> file server ને <b>message</b> મોકલે છે; file server કામ કરી message વડે જવાબ આપે છે.</p>\n<h4>ફાયદા</h4>\n<ul>\n<li><b>Reliability અને security:</b> કોઈ server (દા.ત. driver) fail થાય તો માત્ર તે server restart થાય; kernel ચાલુ રહે.</li>\n<li><b>Extend કરવું સરળ:</b> kernel બદલ્યા વગર નવી services user-mode servers તરીકે ઉમેરાય.</li>\n<li><b>Portability:</b> નાનું kernel નવા hardware પર સરળતાથી લઈ જવાય.</li>\n</ul>\n<h4>ગેરફાયદા</h4>\n<ul>\n<li><b>ઓછું performance:</b> ઘણા messages અને user–kernel mode switches overhead ઉમેરે.</li>\n</ul>\n<p><b>ઉદાહરણ:</b> QNX (cars માં વપરાય), MINIX 3, L4, Mach. <b>Hybrid kernels</b> બંને વિચાર ભેગા કરે: macOS (XNU = Mach + BSD) અને Windows NT.</p>"}, "diagram": "os1_microkernel"}, {"h": {"en": "1.3.4 Comparison: Monolithic vs Layered vs Microkernel", "gu": "1.3.4 સરખામણી: Monolithic vs Layered vs Microkernel"}, "body": {"en": "<p>The comparison is often asked as a 4-mark question (monolithic vs microkernel).</p>\n<table><tr><th>Point</th><th>Monolithic</th><th>Layered</th><th>Microkernel</th></tr><tr><td>Kernel size</td><td>Very large</td><td>Large, split into layers</td><td>Very small</td></tr><tr><td>Services run in</td><td>Kernel space</td><td>Kernel, layer by layer</td><td>User space (servers)</td></tr><tr><td>Communication</td><td>Direct function calls</td><td>Calls to the lower layer</td><td>Message passing (IPC)</td></tr><tr><td>Speed</td><td>Fastest</td><td>Slower (many layers)</td><td>Slower (many messages)</td></tr><tr><td>Reliability</td><td>Low: one bug can crash all</td><td>Medium</td><td>High: a server crash does not crash the kernel</td></tr><tr><td>Extending / debugging</td><td>Difficult</td><td>Easy, one layer at a time</td><td>Easy: add a new server</td></tr><tr><td>Examples</td><td>MS-DOS, Unix, Linux</td><td>THE OS, Multics</td><td>QNX, MINIX 3, L4, Mach</td></tr></table>", "gu": "<p>આ સરખામણી ઘણી વાર 4 ગુણના પ્રશ્ન તરીકે પૂછાય છે (monolithic vs microkernel).</p>\n<table><tr><th>મુદ્દો</th><th>Monolithic</th><th>Layered</th><th>Microkernel</th></tr><tr><td>Kernel નું કદ</td><td>ખૂબ મોટું</td><td>મોટું, layers માં વહેંચેલું</td><td>ખૂબ નાનું</td></tr><tr><td>Services ક્યાં ચાલે</td><td>Kernel space</td><td>Kernel, layer પ્રમાણે</td><td>User space (servers)</td></tr><tr><td>Communication</td><td>સીધા function calls</td><td>નીચેના layer ને calls</td><td>Message passing (IPC)</td></tr><tr><td>ઝડપ</td><td>સૌથી ઝડપી</td><td>ધીમું (ઘણા layers)</td><td>ધીમું (ઘણા messages)</td></tr><tr><td>Reliability</td><td>ઓછી: એક bug બધું crash કરે</td><td>મધ્યમ</td><td>વધુ: server crash થી kernel crash ન થાય</td></tr><tr><td>Extend / debug કરવું</td><td>મુશ્કેલ</td><td>સરળ, એક સમયે એક layer</td><td>સરળ: નવો server ઉમેરો</td></tr><tr><td>ઉદાહરણ</td><td>MS-DOS, Unix, Linux</td><td>THE OS, Multics</td><td>QNX, MINIX 3, L4, Mach</td></tr></table>"}}]}, {"title": {"en": "1.4 Case Study: Linux, Windows and macOS", "gu": "1.4 Case Study: Linux, Windows અને macOS"}, "items": [{"h": {"en": "1.4.1 Linux Operating System", "gu": "1.4.1 Linux Operating System"}, "body": {"en": "<p><b>Linux</b> is a <b>free and open-source, Unix-like</b> operating system. Its kernel was first written by <b>Linus Torvalds</b> (a Finnish student) in <b>1991</b>, and it is now developed by thousands of programmers worldwide under the <b>GNU GPL</b> licence. A complete Linux system = Linux kernel + GNU tools + other software, packaged as a <b>distribution (distro)</b>.</p>\n<h4>Structure (layers)</h4>\n<ol>\n<li><b>Hardware:</b> CPU, memory, disk, devices.</li>\n<li><b>Kernel:</b> the core: process scheduling, memory management, file system, device drivers, networking. It is <b>monolithic but modular</b> (loadable kernel modules).</li>\n<li><b>Shell:</b> command interpreter between the user and the kernel (bash, zsh).</li>\n<li><b>Applications and utilities:</b> commands (ls, cp, grep), compilers (gcc), editors, browsers, desktop (GNOME, KDE).</li>\n</ol>\n<h4>Features</h4>\n<ul>\n<li><b>Open source and free;</b> anyone can study and modify the code.</li>\n<li><b>Multi-user and multitasking.</b></li>\n<li><b>Portable:</b> runs on PCs, servers, phones (Android uses the Linux kernel), embedded devices and all of the world's top supercomputers.</li>\n<li><b>Secure:</b> file permissions (read/write/execute), user accounts, root/superuser.</li>\n<li><b>Hierarchical file system</b> starting from root <code>/</code>; file systems ext4, Btrfs, XFS.</li>\n<li>Powerful <b>shell</b> and scripting; GUI desktops are also available.</li>\n</ul>\n<p><b>Popular distributions:</b> Ubuntu, Fedora, Debian, Linux Mint, Red Hat Enterprise Linux (RHEL), Kali Linux.</p>\n<p><b>Uses:</b> web servers, cloud, Android phones, routers, smart TVs, programming and education.</p>", "gu": "<p><b>Linux</b> એક <b>free અને open-source, Unix-જેવી</b> operating system છે. તેનું kernel સૌપ્રથમ <b>Linus Torvalds</b> (Finland ના વિદ્યાર્થી) એ <b>1991</b> માં લખ્યું હતું, અને હવે વિશ્વના હજારો programmers <b>GNU GPL</b> licence હેઠળ તેને વિકસાવે છે. સંપૂર્ણ Linux system = Linux kernel + GNU tools + બીજું software, જે <b>distribution (distro)</b> તરીકે મળે છે.</p>\n<h4>Structure (layers)</h4>\n<ol>\n<li><b>Hardware:</b> CPU, memory, disk, devices.</li>\n<li><b>Kernel:</b> મુખ્ય ભાગ: process scheduling, memory management, file system, device drivers, networking. તે <b>monolithic પણ modular</b> છે (loadable kernel modules).</li>\n<li><b>Shell:</b> user અને kernel વચ્ચેનો command interpreter (bash, zsh).</li>\n<li><b>Applications અને utilities:</b> commands (ls, cp, grep), compilers (gcc), editors, browsers, desktop (GNOME, KDE).</li>\n</ol>\n<h4>લક્ષણો</h4>\n<ul>\n<li><b>Open source અને free;</b> કોઈ પણ code નો અભ્યાસ કરી બદલી શકે.</li>\n<li><b>Multi-user અને multitasking.</b></li>\n<li><b>Portable:</b> PCs, servers, phones (Android Linux kernel વાપરે છે), embedded devices અને વિશ્વના બધા top supercomputers પર ચાલે.</li>\n<li><b>Secure:</b> file permissions (read/write/execute), user accounts, root/superuser.</li>\n<li>Root <code>/</code> થી શરૂ થતી <b>hierarchical file system</b>; file systems ext4, Btrfs, XFS.</li>\n<li>શક્તિશાળી <b>shell</b> અને scripting; GUI desktops પણ ઉપલબ્ધ.</li>\n</ul>\n<p><b>લોકપ્રિય distributions:</b> Ubuntu, Fedora, Debian, Linux Mint, Red Hat Enterprise Linux (RHEL), Kali Linux.</p>\n<p><b>ઉપયોગ:</b> web servers, cloud, Android phones, routers, smart TVs, programming અને શિક્ષણ.</p>"}, "diagram": "os1_linux"}, {"h": {"en": "1.4.2 Microsoft Windows (Latest: Windows 11)", "gu": "1.4.2 Microsoft Windows (નવીનતમ: Windows 11)"}, "body": {"en": "<p><b>Microsoft Windows</b> is the most widely used desktop OS, developed by <b>Microsoft</b>. It is a <b>closed-source, commercial (paid)</b> OS with a graphical user interface. The first version, Windows 1.0, came in 1985. Since <b>Windows NT</b> (1993), all versions use the <b>NT kernel</b>, a <b>hybrid kernel</b> (microkernel ideas, but most services run in kernel mode for speed).</p>\n<p><b>Latest version:</b> <b>Windows 11</b> (first released October 2021). It gets one feature update every year; the latest is <b>version 26H2</b> (September 2026). Support for Windows 10 ended in October 2025.</p>\n<h4>Structure (simplified)</h4>\n<ul>\n<li><b>User mode:</b> applications, environment subsystems (Win32 API), system services.</li>\n<li><b>Kernel mode:</b> Executive (I/O manager, memory manager, process manager, security monitor), kernel, device drivers and the <b>HAL</b> (Hardware Abstraction Layer, which hides hardware differences).</li>\n</ul>\n<h4>Features of Windows 11</h4>\n<ul>\n<li>Modern GUI: centred <b>Start menu and taskbar</b>, snap layouts, virtual desktops, widgets.</li>\n<li><b>Security:</b> needs <b>TPM 2.0</b> and Secure Boot; Windows Hello (face/fingerprint login), Microsoft Defender, BitLocker.</li>\n<li><b>AI features:</b> Copilot assistant and AI actions in File Explorer.</li>\n<li>File system <b>NTFS</b>; command line through <b>PowerShell</b> and Command Prompt; <b>WSL</b> to run Linux inside Windows.</li>\n<li>Runs on x86-64 and ARM PCs; huge support for software, games and hardware drivers.</li>\n</ul>\n<h4>Limitations</h4>\n<ul><li>Paid licence; closed source.</li><li>Higher hardware requirements; the most targeted OS for malware.</li></ul>", "gu": "<p><b>Microsoft Windows</b> સૌથી વધુ વપરાતી desktop OS છે, જે <b>Microsoft</b> એ વિકસાવી છે. તે graphical user interface વાળી <b>closed-source, commercial (paid)</b> OS છે. પહેલું version Windows 1.0 1985 માં આવ્યું. <b>Windows NT</b> (1993) થી બધા versions <b>NT kernel</b> વાપરે છે, જે <b>hybrid kernel</b> છે (microkernel ના વિચારો, પણ ઝડપ માટે મોટા ભાગની services kernel mode માં ચાલે).</p>\n<p><b>નવીનતમ version:</b> <b>Windows 11</b> (પહેલી વાર October 2021 માં). દર વર્ષે એક feature update મળે છે; નવીનતમ <b>version 26H2</b> (September 2026) છે. Windows 10 નો support October 2025 માં પૂરો થયો.</p>\n<h4>Structure (સરળ)</h4>\n<ul>\n<li><b>User mode:</b> applications, environment subsystems (Win32 API), system services.</li>\n<li><b>Kernel mode:</b> Executive (I/O manager, memory manager, process manager, security monitor), kernel, device drivers અને <b>HAL</b> (Hardware Abstraction Layer, જે hardware ના તફાવતો છુપાવે છે).</li>\n</ul>\n<h4>Windows 11 ના લક્ષણો</h4>\n<ul>\n<li>આધુનિક GUI: વચ્ચે <b>Start menu અને taskbar</b>, snap layouts, virtual desktops, widgets.</li>\n<li><b>Security:</b> <b>TPM 2.0</b> અને Secure Boot જરૂરી; Windows Hello (face/fingerprint login), Microsoft Defender, BitLocker.</li>\n<li><b>AI features:</b> Copilot assistant અને File Explorer માં AI actions.</li>\n<li>File system <b>NTFS</b>; <b>PowerShell</b> અને Command Prompt દ્વારા command line; Windows ની અંદર Linux ચલાવવા <b>WSL</b>.</li>\n<li>x86-64 અને ARM PCs પર ચાલે; software, games અને hardware drivers નો વિશાળ support.</li>\n</ul>\n<h4>મર્યાદાઓ</h4>\n<ul><li>Paid licence; closed source.</li><li>વધુ hardware જરૂરિયાત; malware નું સૌથી વધુ નિશાન બનતી OS.</li></ul>"}}, {"h": {"en": "1.4.3 Apple macOS", "gu": "1.4.3 Apple macOS"}, "body": {"en": "<p><b>macOS</b> (earlier Mac OS X / OS X) is the operating system of Apple's <b>Mac</b> computers (MacBook, iMac, Mac mini). It is a <b>Unix-based</b> OS, officially certified as UNIX, and it is <b>free with every Mac</b> but runs only on Apple hardware.</p>\n<p><b>Latest version:</b> <b>macOS 27 \"Golden Gate\"</b> (September 2026). It runs only on Macs with <b>Apple silicon</b> (M-series chips); support for Intel Macs has ended. The previous version, macOS 26 Tahoe, introduced the \"Liquid Glass\" design.</p>\n<h4>Structure</h4>\n<ul>\n<li><b>Darwin:</b> the open-source Unix core of macOS.</li>\n<li><b>XNU kernel</b> (\"X is Not Unix\"): a <b>hybrid kernel</b> = <b>Mach microkernel</b> (IPC, scheduling, memory) + <b>BSD</b> layer (file system, networking, POSIX API, permissions) + I/O Kit for drivers.</li>\n<li>Above it: frameworks (Cocoa), the <b>Aqua</b> GUI and applications.</li>\n</ul>\n<h4>Features</h4>\n<ul>\n<li>Clean, consistent GUI: Dock, Finder, Spotlight search, Mission Control.</li>\n<li><b>Apple Intelligence</b> and Siri AI features; close integration with iPhone/iPad (Handoff, AirDrop, Continuity).</li>\n<li><b>Security:</b> Gatekeeper (only trusted apps), System Integrity Protection (SIP), FileVault encryption, sandboxed apps.</li>\n<li>File system <b>APFS</b> (Apple File System); Terminal with <b>zsh</b> shell; Unix commands work.</li>\n<li>Very stable and power-efficient because Apple makes both the hardware and the software.</li>\n</ul>\n<h4>Limitations</h4>\n<ul><li>Runs only on costly Apple hardware.</li><li>Fewer games; less customisation; mostly closed source.</li></ul>", "gu": "<p><b>macOS</b> (પહેલાં Mac OS X / OS X) Apple ના <b>Mac</b> computers (MacBook, iMac, Mac mini) ની operating system છે. તે <b>Unix-આધારિત</b> OS છે, સત્તાવાર રીતે UNIX તરીકે certified, અને <b>દરેક Mac સાથે free</b> મળે છે પણ માત્ર Apple hardware પર ચાલે છે.</p>\n<p><b>નવીનતમ version:</b> <b>macOS 27 \"Golden Gate\"</b> (September 2026). તે માત્ર <b>Apple silicon</b> (M-series chips) વાળા Macs પર ચાલે છે; Intel Macs નો support પૂરો થયો છે. પાછલા version macOS 26 Tahoe એ \"Liquid Glass\" design રજૂ કરી હતી.</p>\n<h4>Structure</h4>\n<ul>\n<li><b>Darwin:</b> macOS નો open-source Unix core.</li>\n<li><b>XNU kernel</b> (\"X is Not Unix\"): <b>hybrid kernel</b> = <b>Mach microkernel</b> (IPC, scheduling, memory) + <b>BSD</b> layer (file system, networking, POSIX API, permissions) + drivers માટે I/O Kit.</li>\n<li>તેની ઉપર: frameworks (Cocoa), <b>Aqua</b> GUI અને applications.</li>\n</ul>\n<h4>લક્ષણો</h4>\n<ul>\n<li>સ્વચ્છ, એકસરખો GUI: Dock, Finder, Spotlight search, Mission Control.</li>\n<li><b>Apple Intelligence</b> અને Siri AI features; iPhone/iPad સાથે નજીકનું integration (Handoff, AirDrop, Continuity).</li>\n<li><b>Security:</b> Gatekeeper (માત્ર વિશ્વસનીય apps), System Integrity Protection (SIP), FileVault encryption, sandboxed apps.</li>\n<li>File system <b>APFS</b> (Apple File System); <b>zsh</b> shell સાથે Terminal; Unix commands ચાલે.</li>\n<li>Apple hardware અને software બંને બનાવે છે તેથી ખૂબ stable અને power-efficient.</li>\n</ul>\n<h4>મર્યાદાઓ</h4>\n<ul><li>માત્ર મોંઘા Apple hardware પર ચાલે.</li><li>ઓછી games; ઓછું customisation; મોટા ભાગે closed source.</li></ul>"}}, {"h": {"en": "1.4.4 Comparison: Linux vs Windows vs macOS", "gu": "1.4.4 સરખામણી: Linux vs Windows vs macOS"}, "body": {"en": "<p>This comparison is the subject of <b>Practical 1</b> (case study of Linux, latest Windows and macOS). The chart gives the main points.</p>\n<h4>Which to choose?</h4>\n<ul>\n<li><b>Linux:</b> servers, programming, networking, students who want a free and customisable system.</li>\n<li><b>Windows:</b> general office and home use, gaming, widest software support.</li>\n<li><b>macOS:</b> graphics, video editing, app development for Apple devices, users of iPhone/iPad.</li>\n</ul>\n<p><b>Common points:</b> all three are multi-user, multitasking, multithreaded and support networking, GUI, virtual memory and multi-core CPUs.</p>", "gu": "<p>આ સરખામણી <b>Practical 1</b> (Linux, નવીનતમ Windows અને macOS નો case study) નો વિષય છે. Chart મુખ્ય મુદ્દા આપે છે.</p>\n<h4>કઈ પસંદ કરવી?</h4>\n<ul>\n<li><b>Linux:</b> servers, programming, networking, free અને customisable system ઇચ્છતા વિદ્યાર્થીઓ.</li>\n<li><b>Windows:</b> સામાન્ય office અને ઘરનો ઉપયોગ, gaming, સૌથી વધુ software support.</li>\n<li><b>macOS:</b> graphics, video editing, Apple devices માટે app development, iPhone/iPad ના users.</li>\n</ul>\n<p><b>સામાન્ય મુદ્દા:</b> ત્રણેય multi-user, multitasking, multithreaded છે અને networking, GUI, virtual memory અને multi-core CPUs support કરે છે.</p>"}, "diagram": "os1_case"}]}], "numericals": [], "equations": [], "viva": [{"title": {"en": "Introduction, Goals and Services", "gu": "પરિચય, Goals અને Services"}, "items": [{"q": {"en": "What is an operating system?", "gu": "Operating system શું છે?"}, "a": {"en": "System software that acts as an interface between the user and the hardware and manages all resources.", "gu": "User અને hardware વચ્ચે interface તરીકે કામ કરતું અને બધા resources નું management કરતું system software."}}, {"q": {"en": "What is a kernel?", "gu": "Kernel શું છે?"}, "a": {"en": "The core part of the OS that always stays in memory and directly controls the hardware.", "gu": "OS નો મુખ્ય ભાગ જે હંમેશા memory માં રહે છે અને hardware ને સીધું control કરે છે."}}, {"q": {"en": "State the three fundamental goals of an OS.", "gu": "OS ના ત્રણ મૂળભૂત goals જણાવો."}, "a": {"en": "Convenience, efficiency and ability to evolve.", "gu": "Convenience, efficiency અને ability to evolve."}}, {"q": {"en": "Why is the OS called a resource manager?", "gu": "OS ને resource manager કેમ કહે છે?"}, "a": {"en": "It decides which program gets the CPU, memory, files and devices, and for how long.", "gu": "કયા program ને CPU, memory, files અને devices અને કેટલા સમય માટે મળે તે તે નક્કી કરે છે."}}, {"q": {"en": "What is a system call?", "gu": "System call શું છે?"}, "a": {"en": "A request from a running program to the OS for a service, e.g. fork(), open(), read().", "gu": "ચાલતા program દ્વારા OS પાસે service માટેની વિનંતી, દા.ત. fork(), open(), read()."}}, {"q": {"en": "Name any four OS services.", "gu": "કોઈ પણ ચાર OS services જણાવો."}, "a": {"en": "Program execution, I/O operations, file-system manipulation and error detection.", "gu": "Program execution, I/O operations, file-system manipulation અને error detection."}}, {"q": {"en": "What is booting?", "gu": "Booting શું છે?"}, "a": {"en": "The process of loading the OS kernel into memory when the computer is switched on.", "gu": "Computer ચાલુ થાય ત્યારે OS kernel ને memory માં load કરવાની પ્રક્રિયા."}}]}, {"title": {"en": "Types of OS", "gu": "OS ના પ્રકારો"}, "items": [{"q": {"en": "What is multiprogramming?", "gu": "Multiprogramming શું છે?"}, "a": {"en": "Keeping several jobs in memory so that the CPU switches to another job when one waits for I/O.", "gu": "Memory માં ઘણા jobs રાખવા, જેથી એક job I/O ની રાહ જુએ ત્યારે CPU બીજા job પર જાય."}}, {"q": {"en": "What is the degree of multiprogramming?", "gu": "Degree of multiprogramming શું છે?"}, "a": {"en": "The number of processes present in main memory at one time.", "gu": "એક સમયે main memory માં રહેલી processes ની સંખ્યા."}}, {"q": {"en": "What is a time quantum?", "gu": "Time quantum શું છે?"}, "a": {"en": "The small fixed slice of CPU time (about 10–100 ms) given to each process in time sharing.", "gu": "Time sharing માં દરેક process ને મળતો CPU time નો નાનો નક્કી ભાગ (આશરે 10–100 ms)."}}, {"q": {"en": "Differentiate hard and soft real-time systems in one line.", "gu": "Hard અને soft real-time systems નો તફાવત એક લીટીમાં આપો."}, "a": {"en": "Hard: a deadline must never be missed; soft: an occasional miss is tolerated.", "gu": "Hard: deadline ક્યારેય ચૂકાવી ન જોઈએ; soft: ક્યારેક ચૂકાય તો ચાલે."}}, {"q": {"en": "What is a thread?", "gu": "Thread શું છે?"}, "a": {"en": "A light-weight process: the smallest unit of CPU execution with its own PC, registers and stack.", "gu": "Light-weight process: પોતાના PC, registers અને stack વાળો CPU execution નો સૌથી નાનો એકમ."}}, {"q": {"en": "What do threads of a process share?", "gu": "Process ના threads શું વહેંચે છે?"}, "a": {"en": "Code, data and open files of the process.", "gu": "Process ના code, data અને open files."}}, {"q": {"en": "Give two advantages of a distributed OS.", "gu": "Distributed OS ના બે ફાયદા આપો."}, "a": {"en": "Resource sharing and reliability (if one site fails, the others keep working).", "gu": "Resource sharing અને reliability (એક site fail થાય તો બીજી કામ ચાલુ રાખે)."}}, {"q": {"en": "Give two examples of embedded systems.", "gu": "Embedded systems ના બે ઉદાહરણ આપો."}, "a": {"en": "Washing machine and microwave oven (also smartwatch, car engine control).", "gu": "Washing machine અને microwave oven (smartwatch, car engine control પણ)."}}]}, {"title": {"en": "Structure and Case Study", "gu": "Structure અને Case Study"}, "items": [{"q": {"en": "What is the main rule of the layered structure?", "gu": "Layered structure નો મુખ્ય નિયમ શું છે?"}, "a": {"en": "Each layer uses only the services of the layer just below it.", "gu": "દરેક layer માત્ર તેની તરત નીચેના layer ની services વાપરે છે."}}, {"q": {"en": "What is a monolithic kernel?", "gu": "Monolithic kernel શું છે?"}, "a": {"en": "A kernel in which the whole OS runs as one large program in kernel mode.", "gu": "જેમાં આખી OS kernel mode માં એક મોટા program તરીકે ચાલે તે kernel."}}, {"q": {"en": "What functions stay in a microkernel?", "gu": "Microkernel માં કયા functions રહે છે?"}, "a": {"en": "Only IPC (message passing), basic scheduling and basic memory management.", "gu": "માત્ર IPC (message passing), મૂળભૂત scheduling અને મૂળભૂત memory management."}}, {"q": {"en": "Which kernel type do Linux, Windows and macOS use?", "gu": "Linux, Windows અને macOS કયા પ્રકારનું kernel વાપરે છે?"}, "a": {"en": "Linux: monolithic (modular); Windows: hybrid NT kernel; macOS: hybrid XNU kernel.", "gu": "Linux: monolithic (modular); Windows: hybrid NT kernel; macOS: hybrid XNU kernel."}}, {"q": {"en": "Who developed Linux and when?", "gu": "Linux કોણે અને ક્યારે વિકસાવ્યું?"}, "a": {"en": "Linus Torvalds, in 1991.", "gu": "Linus Torvalds એ, 1991 માં."}}, {"q": {"en": "Name the default file systems of Linux, Windows and macOS.", "gu": "Linux, Windows અને macOS ની default file systems જણાવો."}, "a": {"en": "ext4, NTFS and APFS respectively.", "gu": "અનુક્રમે ext4, NTFS અને APFS."}}]}], "exam_questions": [{"q": {"en": "Define operating system. Explain the role of the OS as an interface between user and hardware.", "gu": "Operating system ની વ્યાખ્યા આપો. User અને hardware વચ્ચે interface તરીકે OS ની ભૂમિકા સમજાવો."}, "marks": 3}, {"q": {"en": "List and explain the fundamental goals of an operating system.", "gu": "Operating system ના મૂળભૂત goals જણાવો અને સમજાવો."}, "marks": 3}, {"q": {"en": "Explain the functions of an operating system.", "gu": "Operating system ના functions સમજાવો."}, "marks": 4}, {"q": {"en": "Explain the services provided by an operating system.", "gu": "Operating system દ્વારા અપાતી services સમજાવો."}, "marks": 7}, {"q": {"en": "Explain multiprogramming OS with a diagram. Give its advantages.", "gu": "Multiprogramming OS આકૃતિ સાથે સમજાવો. તેના ફાયદા આપો."}, "marks": 4}, {"q": {"en": "Explain time-sharing OS. Differentiate between multiprogramming and time sharing.", "gu": "Time-sharing OS સમજાવો. Multiprogramming અને time sharing વચ્ચે તફાવત આપો."}, "marks": 4}, {"q": {"en": "What is a real-time OS? Differentiate between hard and soft real-time systems.", "gu": "Real-time OS શું છે? Hard અને soft real-time systems વચ્ચે તફાવત આપો."}, "marks": 4}, {"q": {"en": "Explain multithreading with a diagram. List its benefits.", "gu": "Multithreading આકૃતિ સાથે સમજાવો. તેના ફાયદા જણાવો."}, "marks": 4}, {"q": {"en": "Explain distributed OS with its advantages and disadvantages.", "gu": "Distributed OS તેના ફાયદા અને ગેરફાયદા સાથે સમજાવો."}, "marks": 3}, {"q": {"en": "What is an embedded OS? Give its features and examples.", "gu": "Embedded OS શું છે? તેના લક્ષણો અને ઉદાહરણ આપો."}, "marks": 3}, {"q": {"en": "Explain the layered structure of an OS with a diagram.", "gu": "OS નું layered structure આકૃતિ સાથે સમજાવો."}, "marks": 4}, {"q": {"en": "Explain monolithic and microkernel structures. Compare them.", "gu": "Monolithic અને microkernel structures સમજાવો. તેમની સરખામણી કરો."}, "marks": 7}, {"q": {"en": "Write a short note on the Linux operating system.", "gu": "Linux operating system પર ટૂંકનોંધ લખો."}, "marks": 3}, {"q": {"en": "Compare Linux, Windows and macOS.", "gu": "Linux, Windows અને macOS ની સરખામણી કરો."}, "marks": 4}], "tabs": ["notes", "diagrams", "viva", "exam"], "diagrams": [{"id": "os1_role", "title": {"en": "OS: Interface between User and Hardware", "gu": "OS: User અને Hardware વચ્ચે Interface"}, "file": "diagrams/os1_role.svg"}, {"id": "os1_functions", "title": {"en": "Functions and Goals of an OS", "gu": "OS ના Functions અને Goals"}, "file": "diagrams/os1_functions.svg"}, {"id": "os1_services", "title": {"en": "Operating System Services", "gu": "Operating System Services"}, "file": "diagrams/os1_services.svg"}, {"id": "os1_multiprog", "title": {"en": "Multiprogramming OS", "gu": "Multiprogramming OS"}, "file": "diagrams/os1_multiprog.svg"}, {"id": "os1_timeshare", "title": {"en": "Time-Sharing OS", "gu": "Time-Sharing OS"}, "file": "diagrams/os1_timeshare.svg"}, {"id": "os1_realtime", "title": {"en": "Real-Time OS: Hard and Soft", "gu": "Real-Time OS: Hard અને Soft"}, "file": "diagrams/os1_realtime.svg"}, {"id": "os1_multithread", "title": {"en": "Single-Threaded vs Multithreaded Process", "gu": "Single-Threaded vs Multithreaded Process"}, "file": "diagrams/os1_multithread.svg"}, {"id": "os1_distributed", "title": {"en": "Distributed OS", "gu": "Distributed OS"}, "file": "diagrams/os1_distributed.svg"}, {"id": "os1_embedded", "title": {"en": "Embedded OS", "gu": "Embedded OS"}, "file": "diagrams/os1_embedded.svg"}, {"id": "os1_layered", "title": {"en": "Layered Structure", "gu": "Layered Structure"}, "file": "diagrams/os1_layered.svg"}, {"id": "os1_monolithic", "title": {"en": "Monolithic Kernel", "gu": "Monolithic Kernel"}, "file": "diagrams/os1_monolithic.svg"}, {"id": "os1_microkernel", "title": {"en": "Microkernel", "gu": "Microkernel"}, "file": "diagrams/os1_microkernel.svg"}, {"id": "os1_linux", "title": {"en": "Linux Layers", "gu": "Linux Layers"}, "file": "diagrams/os1_linux.svg"}, {"id": "os1_case", "title": {"en": "Linux vs Windows vs macOS", "gu": "Linux vs Windows vs macOS"}, "file": "diagrams/os1_case.svg"}]};

CD9\" stroke-width=\"2\"/><text x=\"180\" y=\"118.0\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">CPU</text><text x=\"180\" y=\"132.2\" font-size=\"9\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">shared</text><text x=\"180\" y=\"207.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"bold\">Time slices (quantum q) given in turn</text><rect x=\"28\" y=\"214\" width=\"38\" height=\"26\" rx=\"0\" fill=\"#E3F5E6\" stroke=\"#2E7D32\" stroke-width=\"1.2\"/><text x=\"47\" y=\"230.4\" font-size=\"9.6\" text-anchor=\"middle\" fill=\"#2E7D32\" font-weight=\"bold\">U1</text><rect x=\"66\" y=\"214\" width=\"38\" height=\"26\" rx=\"0\" fill=\"#E3F0FC\" stroke=\"#1565C0\" stroke-width=\"1.2\"/><text x=\"85\" y=\"230.4\" font-size=\"9.6\" text-anchor=\"middle\" fill=\"#1565C0\" font-weight=\"bold\">U2</text><rect x=\"104\" y=\"214\" width=\"38\" height=\"26\" rx=\"0\" fill=\"#FFF1DE\" stroke=\"#E07B00\" stroke-width=\"1.2\"/><text x=\"123\" y=\"230.4\" font-size=\"9.6\" text-anchor=\"middle\" fill=\"#E07B00\" font-weight=\"bold\">U3</text><rect x=\"142\" y=\"214\" width=\"38\" height=\"26\" rx=\"0\" fill=\"#FDECEC\" stroke=\"#C62828\" stroke-width=\"1.2\"/><text x=\"161\" y=\"230.4\" font-size=\"9.6\" text-anchor=\"middle\" fill=\"#C62828\" font-weight=\"bold\">U4</text><rect x=\"180\" y=\"214\" width=\"38\" height=\"26\" rx=\"0\" fill=\"#E3F5E6\" stroke=\"#2E7D32\" stroke-width=\"1.2\"/><text x=\"199\" y=\"230.4\" font-size=\"9.6\" text-anchor=\"middle\" fill=\"#2E7D32\" font-weight=\"bold\">U1</text><rect x=\"218\" y=\"214\" width=\"38\" height=\"26\" rx=\"0\" fill=\"#E3F0FC\" stroke=\"#1565C0\" stroke-width=\"1.2\"/><text x=\"237\" y=\"230.4\" font-size=\"9.6\" text-anchor=\"middle\" fill=\"#1565C0\" font-weight=\"bold\">U2</text><rect x=\"256\" y=\"214\" width=\"38\" height=\"26\" rx=\"0\" fill=\"#FFF1DE\" stroke=\"#E07B00\" stroke-width=\"1.2\"/><text x=\"275\" y=\"230.4\" font-size=\"9.6\" text-anchor=\"middle\" fill=\"#E07B00\" font-weight=\"bold\">U3</text><rect x=\"294\" y=\"214\" width=\"38\" height=\"26\" rx=\"0\" fill=\"#FDECEC\" stroke=\"#C62828\" stroke-width=\"1.2\"/><text x=\"313\" y=\"230.4\" font-size=\"9.6\" text-anchor=\"middle\" fill=\"#C62828\" font-weight=\"bold\">U4</text><text x=\"332\" y=\"231.2\" font-size=\"12\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">…</text><rect x=\"12\" y=\"254\" width=\"336\" height=\"70\" rx=\"7\" fill=\"#E3F0FC\" stroke=\"#1565C0\" stroke-width=\"1.1\"/><text x=\"20\" y=\"272.4\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">CPU time is divided into small slices (e.g. 10–100 ms).</text><text x=\"20\" y=\"287.4\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">The OS switches quickly between users / programs,</text><text x=\"20\" y=\"302.4\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">so each user feels the computer is dedicated to him.</text><text x=\"20\" y=\"317.4\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">Goal: minimum response time. Example: Unix, Linux.</text></svg>", "os1_realtime": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 320\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"320\" fill=\"#ffffff\"/><text x=\"180\" y=\"23.1\" font-size=\"14.5\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">Real-Time Operating System (RTOS)</text><path d=\"M30 70 L330 70\" fill=\"none\" stroke=\"#222\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polygon points=\"330.0,70.0 323.0,66.5 323.0,73.5\" fill=\"#222\"/><text x=\"336\" y=\"77.5\" font-size=\"10\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">t</text><path d=\"M60 44 L60 70\" fill=\"none\" stroke=\"#C62828\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"60\" y=\"41.3\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#C62828\" font-weight=\"bold\">event</text><rect x=\"84\" y=\"52\" width=\"120\" height=\"18\" rx=\"3\" fill=\"#7B2CD9\" stroke=\"#7B2CD9\" stroke-width=\"1\"/><text x=\"144\" y=\"64.2\" font-size=\"9\" text-anchor=\"middle\" fill=\"#fff\" font-weight=\"bold\">task runs</text><path d=\"M250 40 L250 76\" fill=\"none\" stroke=\"#2E7D32\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-dasharray=\"4 3\"/><text x=\"250\" y=\"37.3\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#2E7D32\" font-weight=\"bold\">deadline</text><path d=\"M60 86 L204 86\" fill=\"none\" stroke=\"#1565C0\" stroke-width=\"1.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polygon points=\"204.0,86.0 198.0,83.0 198.0,89.0\" fill=\"#1565C0\"/><text x=\"132\" y=\"102.2\" font-size=\"9\" text-anchor=\"middle\" fill=\"#1565C0\" font-weight=\"normal\">response time</text><text x=\"180\" y=\"123.4\" font-size=\"9.8\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">Result must be correct AND produced before the deadline</text><rect x=\"12\" y=\"136\" width=\"164\" height=\"150\" rx=\"8\" fill=\"#FDECEC\" stroke=\"#C62828\" stroke-width=\"1.4\"/><text x=\"94.0\" y=\"154.8\" font-size=\"11\" text-anchor=\"middle\" fill=\"#C62828\" font-weight=\"bold\">Hard real-time</text><text x=\"94.0\" y=\"173.3\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">Deadline must ALWAYS</text><text x=\"94.0\" y=\"187.3\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">be met; a miss means</text><text x=\"94.0\" y=\"201.3\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">system failure.</text><text x=\"94.0\" y=\"215.3\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\"></text><text x=\"94.0\" y=\"229.3\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">Airbag, pacemaker,</text><text x=\"94.0\" y=\"243.3\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">ABS brakes, missile</text><text x=\"94.0\" y=\"257.3\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">and flight control</text><rect x=\"184\" y=\"136\" width=\"164\" height=\"150\" rx=\"8\" fill=\"#E3F5E6\" stroke=\"#2E7D32\" stroke-width=\"1.4\"/><text x=\"266.0\" y=\"154.8\" font-size=\"11\" text-anchor=\"middle\" fill=\"#2E7D32\" font-weight=\"bold\">Soft real-time</text><text x=\"266.0\" y=\"173.3\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">Occasional deadline</text><text x=\"266.0\" y=\"187.3\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">miss is tolerated</text><text x=\"266.0\" y=\"201.3\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">(quality drops).</text><text x=\"266.0\" y=\"215.3\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\"></text><text x=\"266.0\" y=\"229.3\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">Video streaming,</text><text x=\"266.0\" y=\"243.3\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">online games,</text><text x=\"266.0\" y=\"257.3\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">VoIP, multimedia</text><text x=\"180\" y=\"309.4\" font-size=\"9.6\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">RTOS examples: VxWorks, QNX, FreeRTOS, RTLinux</text></svg>", "os1_multithread": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 330\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"330\" fill=\"#ffffff\"/><text x=\"180\" y=\"23.1\" font-size=\"14.5\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">Single-Threaded vs Multithreaded Process</text><rect x=\"12\" y=\"34\" width=\"164\" height=\"196\" rx=\"8\" fill=\"#FBF8FF\" stroke=\"#7B2CD9\" stroke-  rx=\"0\" fill=\"#E3F5E6\" stroke=\"#2E7D32\" stroke-width=\"1.2\"/><text x=\"218\" y=\"77.4\" font-size=\"9.6\" text-anchor=\"middle\" fill=\"#2E7D32\" font-weight=\"bold\">code</text><rect x=\"242\" y=\"62\" width=\"48\" height=\"24\" rx=\"0\" fill=\"#E3F5E6\" stroke=\"#2E7D32\" stroke-width=\"1.2\"/><text x=\"266\" y=\"77.4\" font-size=\"9.6\" text-anchor=\"middle\" fill=\"#2E7D32\" font-weight=\"bold\">data</text><rect x=\"290\" y=\"62\" width=\"48\" height=\"24\" rx=\"0\" fill=\"#E3F5E6\" stroke=\"#2E7D32\" stroke-width=\"1.2\"/><text x=\"314\" y=\"77.4\" font-size=\"9.6\" text-anchor=\"middle\" fill=\"#2E7D32\" font-weight=\"bold\">files</text><rect x=\"194.0\" y=\"92\" width=\"48.0\" height=\"22\" rx=\"0\" fill=\"#E3F0FC\" stroke=\"#1565C0\" stroke-width=\"1.1\"/><text x=\"218.0\" y=\"106.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#1565C0\" font-weight=\"bold\">regs</text><rect x=\"194.0\" y=\"114\" width=\"48.0\" height=\"22\" rx=\"0\" fill=\"#E3F0FC\" stroke=\"#1565C0\" stroke-width=\"1.1\"/><text x=\"218.0\" y=\"128.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#1565C0\" font-weight=\"bold\">stack</text><path d=\"M218.0 144 Q224.0 150 218.0 156 Q212.0 162 218.0 168 Q224.0 174 218.0 180 Q212.0 186 218.0 192 Q224.0 198 218.0 204 Q212.0 210 218.0 216\" fill=\"none\" stroke=\"#C62828\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><rect x=\"242.0\" y=\"92\" width=\"48.0\" height=\"22\" rx=\"0\" fill=\"#E3F0FC\" stroke=\"#1565C0\" stroke-width=\"1.1\"/><text x=\"266.0\" y=\"106.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#1565C0\" font-weight=\"bold\">regs</text><rect x=\"242.0\" y=\"114\" width=\"48.0\" height=\"22\" rx=\"0\" fill=\"#E3F0FC\" stroke=\"#1565C0\" stroke-width=\"1.1\"/><text x=\"266.0\" y=\"128.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#1565C0\" font-weight=\"bold\">stack</text><path d=\"M266.0 144 Q272.0 150 266.0 156 Q260.0 162 266.0 168 Q272.0 174 266.0 180 Q260.0 186 266.0 192 Q272.0 198 266.0 204 Q260.0 210 266.0 216\" fill=\"none\" stroke=\"#C62828\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><rect x=\"290.0\" y=\"92\" width=\"48.0\" height=\"22\" rx=\"0\" fill=\"#E3F0FC\" stroke=\"#1565C0\" stroke-width=\"1.1\"/><text x=\"314.0\" y=\"106.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#1565C0\" font-weight=\"bold\">regs</text><rect x=\"290.0\" y=\"114\" width=\"48.0\" height=\"22\" rx=\"0\" fill=\"#E3F0FC\" stroke=\"#1565C0\" stroke-width=\"1.1\"/><text x=\"314.0\" y=\"128.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#1565C0\" font-weight=\"bold\">stack</text><path d=\"M314.0 144 Q320.0 150 314.0 156 Q308.0 162 314.0 168 Q320.0 174 314.0 180 Q308.0 186 314.0 192 Q320.0 198 314.0 204 Q308.0 210 314.0 216\" fill=\"none\" stroke=\"#C62828\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"266\" y=\"225.3\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#C62828\" font-weight=\"bold\">3 threads</text><rect x=\"12\" y=\"240\" width=\"336\" height=\"85\" rx=\"7\" fill=\"#E3F0FC\" stroke=\"#1565C0\" stroke-width=\"1.1\"/><text x=\"20\" y=\"258.4\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">Thread = light-weight process: a unit of CPU use.</text><text x=\"20\" y=\"273.4\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">Threads of a process share code, data and files;</text><text x=\"20\" y=\"288.4\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">each thread has its own registers, PC and stack.</text><text x=\"20\" y=\"303.4\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">Benefits: responsiveness, resource sharing, economy,</text><text x=\"20\" y=\"318.4\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">use of multi-core CPUs. Example: browser tabs.</text></svg>", "os1_distributed": "<svg xmlns=\"http://www.w3.org/2000/svg\" v
