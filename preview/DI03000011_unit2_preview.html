le=\"text-decoration:overline\">Y</span> = (<span style=\"text-decoration:overline\">A</span>·<span style=\"text-decoration:overline\">B</span> + <span style=\"text-decoration:overline\">C</span>)·1 = <span style=\"text-decoration:overline\">A</span><span style=\"text-decoration:overline\">B</span> + <span style=\"text-decoration:overline\">C</span></p><p>Dual: (A·B + C)·1 = AB + C</p>"}}, {"id": "de2n13", "q": {"en": "Implement Y = AB + CD using only NAND gates.", "gu": "માત્ર NAND gates વડે Y = AB + CD બનાવો."}, "a": {"en": "<p>Y = AB + CD = <span style=\"text-decoration:overline\">AB + CD</span> &nbsp; [double complement]</p><p>= <span style=\"text-decoration:overline\">AB·CD</span> &nbsp; [De Morgan]</p><p>So Y = NAND( NAND(A, B), NAND(C, D) ).</p><p><b>Circuit:</b> two NAND gates at level 1 (inputs A, B and C, D) and one NAND gate at level 2. Total <b>3 NAND gates</b> (one 7400 IC).</p><p><b>Rule:</b> an AND-OR (SOP) circuit becomes NAND-NAND by simply replacing every gate with a NAND gate.</p>", "gu": "<p>Y = AB + CD = <span style=\"text-decoration:overline\">AB + CD</span> &nbsp; [double complement]</p><p>= <span style=\"text-decoration:overline\">AB·CD</span> &nbsp; [De Morgan]</p><p>તેથી Y = NAND( NAND(A, B), NAND(C, D) ).</p><p><b>Circuit:</b> level 1 પર બે NAND gates (inputs A, B અને C, D) અને level 2 પર એક NAND gate. કુલ <b>3 NAND gates</b> (એક 7400 IC).</p><p><b>નિયમ:</b> AND-OR (SOP) circuit માં દરેક gate ને NAND વડે બદલવાથી તે NAND-NAND બને છે.</p>"}}, {"id": "de2n14", "q": {"en": "Prove A + BC = (A + B)(A + C) using a truth table and algebraically.", "gu": "Truth table વડે અને algebra વડે સાબિત કરો: A + BC = (A + B)(A + C)."}, "a": {"en": "<table><tr><th>A</th><th>B</th><th>C</th><th>BC</th><th>A+BC</th><th>A+B</th><th>A+C</th><th>(A+B)(A+C)</th></tr><tr><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td><b>0</b></td></tr><tr><td>0</td><td>0</td><td>1</td><td>0</td><td>0</td><td>0</td><td>1</td><td><b>0</b></td></tr><tr><td>0</td><td>1</td><td>0</td><td>0</td><td>0</td><td>1</td><td>0</td><td><b>0</b></td></tr><tr><td>0</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td><td><b>1</b></td></tr><tr><td>1</td><td>0</td><td>0</td><td>0</td><td>1</td><td>1</td><td>1</td><td><b>1</b></td></tr><tr><td>1</td><td>0</td><td>1</td><td>0</td><td>1</td><td>1</td><td>1</td><td><b>1</b></td></tr><tr><td>1</td><td>1</td><td>0</td><td>0</td><td>1</td><td>1</td><td>1</td><td><b>1</b></td></tr><tr><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td><td><b>1</b></td></tr></table><p>Columns A+BC and (A+B)(A+C) are identical ✓</p><p><b>Algebra:</b> (A + B)(A + C) = A + AC + AB + BC = A(1 + C + B) + BC = A + BC ✓</p>", "gu": "<table><tr><th>A</th><th>B</th><th>C</th><th>BC</th><th>A+BC</th><th>A+B</th><th>A+C</th><th>(A+B)(A+C)</th></tr><tr><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td><b>0</b></td></tr><tr><td>0</td><td>0</td><td>1</td><td>0</td><td>0</td><td>0</td><td>1</td><td><b>0</b></td></tr><tr><td>0</td><td>1</td><td>0</td><td>0</td><td>0</td><td>1</td><td>0</td><td><b>0</b></td></tr><tr><td>0</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td><td><b>1</b></td></tr><tr><td>1</td><td>0</td><td>0</td><td>0</td><td>1</td><td>1</td><td>1</td><td><b>1</b></td></tr><tr><td>1</td><td>0</td><td>1</td><td>0</td><td>1</td><td>1</td><td>1</td><td><b>1</b></td></tr><tr><td>1</td><td>1</td><td>0</td><td>0</td><td>1</td><td>1</td><td>1</td><td><b>1</b></td></tr><tr><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td><td><b>1</b></td></tr></table><p>A+BC અને (A+B)(A+C) ના columns સરખા છે ✓</p><p><b>Algebra:</b> (A + B)(A + C) = A + AC + AB + BC = A(1 + C + B) + BC = A + BC ✓</p>"}}, {"id": "de2n15", "q": {"en": "A gate gives the voltage table below. Identify the gate in positive logic and in negative logic.", "gu": "એક gate નીચે મુજબ voltage table આપે છે. Positive logic અને negative logic માં gate ઓળખો."}, "a": {"en": "<table><tr><th>A</th><th>B</th><th>Y</th></tr><tr><td>0 V</td><td>0 V</td><td>0 V</td></tr><tr><td>0 V</td><td>5 V</td><td>5 V</td></tr><tr><td>5 V</td><td>0 V</td><td>5 V</td></tr><tr><td>5 V</td><td>5 V</td><td>5 V</td></tr></table><p><b>Positive logic</b> (5 V = 1, 0 V = 0):</p><table><tr><th>A</th><th>B</th><th>Y</th></tr><tr><td>0</td><td>0</td><td><b>0</b></td></tr><tr><td>0</td><td>1</td><td><b>1</b></td></tr><tr><td>1</td><td>0</td><td><b>1</b></td></tr><tr><td>1</td><td>1</td><td><b>1</b></td></tr></table><p>Output is 1 when any input is 1 → <b>OR gate</b>.</p><p><b>Negative logic</b> (0 V = 1, 5 V = 0):</p><table><tr><th>A</th><th>B</th><th>Y</th></tr><tr><td>1</td><td>1</td><td><b>1</b></td></tr><tr><td>1</td><td>0</td><td><b>0</b></td></tr><tr><td>0</td><td>1</td><td><b>0</b></td></tr><tr><td>0</td><td>0</td><td><b>0</b></td></tr></table><p>Output is 1 only when both inputs are 1 → <b>AND gate</b>.</p><p>This confirms: positive-logic OR = negative-logic AND.</p>", "gu": "<table><tr><th>A</th><th>B</th><th>Y</th></tr><tr><td>0 V</td><td>0 V</td><td>0 V</td></tr><tr><td>0 V</td><td>5 V</td><td>5 V</td></tr><tr><td>5 V</td><td>0 V</td><td>5 V</td></tr><tr><td>5 V</td><td>5 V</td><td>5 V</td></tr></table><p><b>Positive logic</b> (5 V = 1, 0 V = 0):</p><table><tr><th>A</th><th>B</th><th>Y</th></tr><tr><td>0</td><td>0</td><td><b>0</b></td></tr><tr><td>0</td><td>1</td><td><b>1</b></td></tr><tr><td>1</td><td>0</td><td><b>1</b></td></tr><tr><td>1</td><td>1</td><td><b>1</b></td></tr></table><p>કોઈ પણ input 1 હોય ત્યારે output 1 → <b>OR gate</b>.</p><p><b>Negative logic</b> (0 V = 1, 5 V = 0):</p><table><tr><th>A</th><th>B</th><th>Y</th></tr><tr><td>1</td><td>1</td><td><b>1</b></td></tr><tr><td>1</td><td>0</td><td><b>0</b></td></tr><tr><td>0</td><td>1</td><td><b>0</b></td></tr><tr><td>0</td><td>0</td><td><b>0</b></td></tr></table><p>બંને inputs 1 હોય ત્યારે જ output 1 → <b>AND gate</b>.</p><p>આથી સાબિત થાય છે: positive-logic OR = negative-logic AND.</p>"}}], "equations": [{"title": {"en": "Logic Gates", "gu": "Logic Gates"}, "items": [{"name": {"en": "AND", "gu": "AND"}, "f": "Y = A·B", "terms": {"en": "1 only if all inputs are 1", "gu": "બધા inputs 1 હોય તો જ 1"}}, {"name": {"en": "OR", "gu": "OR"}, "f": "Y = A + B", "terms": {"en": "1 if any input is 1", "gu": "કોઈ પણ input 1 હોય તો 1"}}, {"name": {"en": "NOT", "gu": "NOT"}, "f": "Y = <span style=\"text-decoration:overline\">A</span>", "terms": {"en": "Inverts the input", "gu": "Input ને ઉલટાવે"}}, {"name": {"en": "NAND", "gu": "NAND"}, "f": "Y = <span style=\"text-decoration:overline\">A·B</span>", "terms": {"en": "0 only if all inputs are 1", "gu": "બધા inputs 1 હોય તો જ 0"}}, {"name": {"en": "NOR", "gu": "NOR"}, "f": "Y = <span style=\"text-decoration:overline\">A+B</span>", "terms": {"en": "1 only if all inputs are 0", "gu": "બધા inputs 0 હોય તો જ 1"}}, {"name": {"en": "EX-OR", "gu": "EX-OR"}, "f": "Y = A⊕B = A<span style=\"text-decoration:overline\">B</span> + <span style=\"text-decoration:overline\">A</span>B", "terms": {"en": "1 when inputs differ", "gu": "Inputs જુદા હોય ત્યારે 1"}}, {"name": {"en": "EX-NOR", "gu": "EX-NOR"}, "f": "Y = A⊙B = AB + <span style=\"text-decoration:overline\">A</span><span style=\"text-decoration:overline\">B</span>", "terms": {"en": "1 when inputs are equal", "gu": "Inputs સરખા હોય ત્યારે 1"}}, {"name": {"en": "Truth table rows", "gu": "Truth table rows"}, "f": "Rows = 2<sup>n</sup>", "terms": {"en": "n = number of inputs", "gu": "n = inputs ની સંખ્યા"}}]}, {"title": {"en": "Laws of Boolean Algebra", "gu": "Boolean Algebra ના નિયમો"}, "items": [{"name": {"en": "Identity / Null", "gu": "Identity / Null"}, "f": "A + 0 = A, A·1 = A, A + 1 = 1, A·0 = 0", "terms": {"en": "", "gu": ""}}, {"name": {"en": "Idempotent / Complement", "gu": "Idempotent / Complement"}, "f": "A + A = A, A·A = A, A + <span style=\"text-decoration:overline\">A</span> = 1, A·<span style=\"text-decoration:overline\">A</span> = 0", "terms": {"en": "", "gu": ""}}, {"name": {"en": "Co NOT 1, OR 2, AND 3", "terms": {"en": "", "gu": ""}}]}], "viva": [{"title": {"en": "Binary Logic and Gates", "gu": "Binary Logic અને Gates"}, "items": [{"q": {"en": "What is a logic gate?", "gu": "Logic gate એટલે શું?"}, "a": {"en": "An electronic circuit with one or more inputs and one output that performs a logic operation.", "gu": "એક કે વધુ inputs અને એક output વાળો electronic circuit જે logic operation કરે છે."}}, {"q": {"en": "What is positive logic?", "gu": "Positive logic એટલે શું?"}, "a": {"en": "Higher voltage = logic 1, lower voltage = logic 0.", "gu": "વધુ voltage = logic 1, ઓછું voltage = logic 0."}}, {"q": {"en": "What is negative logic?", "gu": "Negative logic એટલે શું?"}, "a": {"en": "Lower voltage = logic 1, higher voltage = logic 0.", "gu": "ઓછું voltage = logic 1, વધુ voltage = logic 0."}}, {"q": {"en": "A positive-logic AND gate acts as which gate in negative logic?", "gu": "Positive-logic AND gate negative logic માં કયો gate બને?"}, "a": {"en": "OR gate.", "gu": "OR gate."}}, {"q": {"en": "Which are the basic gates?", "gu": "Basic gates કયા છે?"}, "a": {"en": "AND, OR and NOT.", "gu": "AND, OR અને NOT."}}, {"q": {"en": "Which are universal gates and why?", "gu": "Universal gates કયા છે અને કેમ?"}, "a": {"en": "NAND and NOR, because any gate or circuit can be made using only them.", "gu": "NAND અને NOR, કારણ કે માત્ર તેમના વડે કોઈ પણ gate કે circuit બનાવી શકાય."}}, {"q": {"en": "When is the output of an AND gate 1?", "gu": "AND gate નું output ક્યારે 1 થાય?"}, "a": {"en": "Only when all inputs are 1.", "gu": "બધા inputs 1 હોય ત્યારે જ."}}, {"q": {"en": "When is the output of a NOR gate 1?", "gu": "NOR gate નું output ક્યારે 1 થાય?"}, "a": {"en": "Only when all inputs are 0.", "gu": "બધા inputs 0 હોય ત્યારે જ."}}, {"q": {"en": "Why is EX-NOR called an equality detector?", "gu": "EX-NOR ને equality detector કેમ કહે છે?"}, "a": {"en": "Its output is 1 only when both inputs are equal.", "gu": "બંને inputs સરખા હોય ત્યારે જ તેનું output 1 થાય છે."}}, {"q": {"en": "Give two applications of EX-OR gate.", "gu": "EX-OR gate ના બે ઉપયોગ આપો."}, "a": {"en": "Half/full adder sum, parity generator/checker, comparator.", "gu": "Half/full adder sum, parity generator/checker, comparator."}}, {"q": {"en": "How is a NOT gate made from a NAND gate?", "gu": "NAND gate માંથી NOT gate કેવી રીતે બને?"}, "a": {"en": "By connecting both inputs together.", "gu": "બંને inputs ને જોડીને."}}, {"q": {"en": "How many NAND gates make an OR gate?", "gu": "OR gate બનાવવા કેટલા NAND gates જોઈએ?"}, "a": {"en": "Three.", "gu": "ત્રણ."}}, {"q": {"en": "Name the ICs for AND, OR, NOT and NAND gates.", "gu": "AND, OR, NOT અને NAND gates ના ICs ના નામ આપો."}, "a": {"en": "7408, 7432, 7404 and 7400.", "gu": "7408, 7432, 7404 અને 7400."}}, {"q": {"en": "What are VCC and GND pins of a 14-pin TTL IC?", "gu": "14-pin TTL IC ના VCC અને GND pins કયા છે?"}, "a": {"en": "Pin 14 = VCC (+5 V), pin 7 = GND.", "gu": "Pin 14 = VCC (+5 V), pin 7 = GND."}}, {"q": {"en": "How many rows are in the truth table of a 3-input gate?", "gu": "3-input gate ના truth table માં કેટલી rows હોય?"}, "a": {"en": "2³ = 8.", "gu": "2³ = 8."}}]}, {"title": {"en": "Boolean Algebra", "gu": "Boolean Algebra"}, "items": [{"q": {"en": "Who introduced Boolean algebra?", "gu": "Boolean algebra કોણે રજૂ કર્યું?"}, "a": {"en": "George Boole (1854).", "gu": "George Boole (1854)."}}, {"q": {"en": "What is the principle of duality?", "gu": "Principle of duality શું છે?"}, "a": {"en": "An identity remains true if + and · are interchanged and 0 and 1 are interchanged.", "gu": "+ અને · તથા 0 અને 1 ની અદલાબદલી કરવા છતાં identity સાચી રહે છે."}}, {"q": {"en": "State De Morgan's theorems.", "gu": "De Morgan's theorems લખો."}, "a": {"en": "(AB)' = A' + B' and (A + B)' = A'B'.", "gu": "(AB)' = A' + B' અને (A + B)' = A'B'."}}, {"q": {"en": "What is A + 1 and A·0?", "gu": "A + 1 અને A·0 કેટલા?"}, "a": {"en": "A + 1 = 1 and A·0 = 0.", "gu": "A + 1 = 1 અને A·0 = 0."}}, {"q": {"en": "Simplify A + AB.", "gu": "A + AB simplify કરો."}, "a": {"en": "A (absorption law).", "gu": "A (absorption law)."}}, {"q": {"en": "Simplify A + A'B.", "gu": "A + A'B simplify કરો."}, "a": {"en": "A + B.", "gu": "A + B."}}, {"q": {"en": "What is a minterm?", "gu": "Minterm શું છે?"}, "a": {"en": "A product term containing all variables, true or complemented.", "gu": "બધા variables (true અથવા complemented) ધરાવતો product term."}}, {"q": {"en": "What is a maxterm?", "gu": "Maxterm શું છે?"}, "a": {"en": "A sum term containing all variables, true or complemented.", "gu": "બધા variables (true અથવા complemented) ધરાવતો sum term."}}, {"q": {"en": "What is SOP? Which circuit implements it?", "gu": "SOP શું છે? કયો circuit તેને બનાવે?"}, "a": {"en": "Sum of products; an AND-OR (or NAND-NAND) circuit.", "gu": "Sum of products; AND-OR (અથવા NAND-NAND) circuit."}}, {"q": {"en": "What is the difference between complement and dual?", "gu": "Complement અને dual વચ્ચે શું તફાવત છે?"}, "a": {"en": "Both interchange + and ·, 0 and 1; only the complement also complements the variables.", "gu": "બંને + અને ·, 0 અને 1 ની અદલાબદલી કરે છે; માત્ર complement માં variables નો complement પણ લેવાય."}}, {"q": {"en": "Why do we simplify Boolean expressions?", "gu": "Boolean expressions નું simplification કેમ કરીએ છીએ?"}, "a": {"en": "To reduce the number of gates, cost, size, delay and power.", "gu": "Gates ની સંખ્યા, cost, size, delay અને power ઘટાડવા."}}, {"q": {"en": "What is a literal?", "gu": "Literal શું છે?"}, "a": {"en": "A variable or its complement in an expression.", "gu": "Expression માં variable અથવા તેનો complement."}}]}], "exam_questions": [{"q": {"en": "Explain positive and negative logic with an example.", "gu": "ઉદાહરણ સાથે positive અને negative logic સમજાવો."}, "marks": 3}, {"q": {"en": "Draw the symbol, write the Boolean expression and truth table of AND, OR and NOT gates.", "gu": "AND, OR અને NOT gates નો symbol દોરો, Boolean expression અને truth table લખો."}, "marks": 4}, {"q": {"en": "Explain NAND     h += `<div class="sec">${head(t(sec.title))}`;
    sec.items.forEach((it,i)=>{
      const open = si===0&&i===0 ? ' open' : '';
      if (it.h) {
        h += `<div class="card${it.key?' key':''}${open}"><div class="q hd"><span class="t">${it.key?'⭐ ':''}${t(it.h)}</span>${chev}</div>
        <div class="a rn" style="padding-left:18px">${fixTables(t(it.body)).replace(/margin:0 0 10px -36px/g,'')}${it.diagram?dgInline(it.diagram):''}${(it.examples||[]).map(exBox).join('')}${(it.programs||[]).map(pBox).join('')}</div></div>`;
      } else {
        h += `<div class="card${open}"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(it.q)}</span>${chev}</div>
        <div class="a">${fixTables(t(it.a))}${it.diagram?dgInline(it.diagram):''}</div></div>`;
      }
    });
    h += `</div>`;
  });
  return h;
}
function numericals(){
  return `<div class="sec">${head(L('numericals'))}` + (U.numericals||[]).map((n,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(n.q)}</span>${chev}</div><div class="a">${fixTables(t(n.a))}</div></div>`).join('') + `</div>`;
}
function diagrams(){
  return `<div class="sec">${head(L(U.programs&&META.code_lang!=='python'?'flowcharts':'diagrams'),false)}<div style="height:10px"></div>` + U.diagrams.map((d,i)=>
    `<div class="dcard" data-dg="${d.id}"><div class="h">${i+1}. ${t(d.title)}</div>${SVG[d.id]}</div>`).join('') + `</div>`;
}
function equations(){
  return U.equations.map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><span class="fbox">${e.f}</span></span>${chev}</div>
     <div class="a"><p>${t(e.terms)}</p></div></div>`).join('') + `</div>`).join('');
}
function viva(){
  return U.viva.map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((v,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(v.q)}</span>${chev}</div><div class="a"><p>${t(v.a)}</p></div></div>`).join('') + `</div>`).join('');
}
function exam(){
  return `<div class="sec">${head(L('examhead'),false)}` + U.exam_questions.map((x,i)=>
    `<div class="card"><div class="q" style="cursor:default"><span class="n">${i+1}.</span><span class="t">${t(x.q)}</span><span class="mk">${x.marks} ${L('marks')}</span></div></div>`).join('') + `</div>`;
}
function programs(){
  return `<div class="sec">${head(L('programs'))}` + (U.programs||[]).map((p,i)=>
    `<div class="card"><div class="q hd"><span class="n">${i+1}.</span><span class="t">${t(p.title)}</span>${chev}</div><div class="a pa">${progBody(p)}</div></div>`).join('') + `</div>`;
}
function syntax(key){
  return (U[typeof key==='string'?key:'syntax']||[]).map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><pre class="code sx">${hl(e.f)}</pre></span>${chev}</div>
     <div class="a">${e.terms && t(e.terms) ? fixTables(t(e.terms)) : ''}</div></div>`).join('') + `</div>`).join('');
}
const flowcharts = diagrams;
const algorithms = () => syntax('algorithms');
const ALLV = {notes, programs, diagrams, flowcharts, algorithms, syntax, equations, numericals, viva, exam};
const VIEWS = U.tabs ? Object.fromEntries(U.tabs.map(k=>[k, ALLV[k]])) : U.programs ? (META.code_lang==='python' ? {notes, programs, diagrams, syntax, viva, exam} : {notes, programs, flowcharts, syntax, viva, exam}) : U.numericals ? {notes, diagrams, equations, numericals, viva, exam} : {notes, diagrams, equations, viva, exam};
function render(){
  document.getElementById('title').textContent = `${L('unit')} ${U.unit}: ${t(U.title)}`;
  document.getElementById('sub').textContent = `${t(META.name)} · ${META.code}`;
  document.getElementById('lang').textContent = S.lang==='en' ? 'ગુ' : 'EN';
  document.getElementById('lang').style.display = META.languages.includes('gu') ? '' : 'none';
  document.getElementById('tabs').innerHTML = Object.keys(VIEWS).map(k=>`<button class="tab${S.tab===k?' on':''}" data-tab="${k}">${L(k)}</button>`).join('');
  document.getElementById('view').innerHTML = VIEWS[S.tab]();
  document.querySelectorAll('#view pre.c').forEach(e=>{ e.innerHTML = hl(e.textContent); e.className='code'; });
}
let zoom = 1;
function setZoom(z){ zoom = Math.min(4, Math.max(1, z)); const w=document.getElementById('zw'); w.style.width=(zoom*100)+'%'; document.getElementById('zr').textContent=Math.round(zoom*100)+'%'; }
document.addEventListener('click', e=>{
  const q = e.target.closest('.q'); if (q && q.parentElement.querySelector('.a')) { q.parentElement.classList.toggle('open'); return; }
  const tb = e.target.closest('[data-tab]'); if (tb){ S.tab = tb.dataset.tab; render(); window.scrollTo(0,0); return; }
  if (e.target.closest('#lang')){ S.lang = S.lang==='en'?'gu':'en'; render(); return; }
  const m = e.target.closest('[data-more]');
  document.querySelectorAll('.menu.show').forEach(x=>{ if(!m || x!==m.nextElementSibling) x.classList.remove('show'); });
  if (m){ m.nextElementSibling.classList.toggle('show'); return; }
  const act = e.target.closest('[data-act]');
  if (act){ act.closest('.sec').querySelectorAll('.card').forEach(c=>{ if(c.querySelector('.a')) c.classList.toggle('open', act.dataset.act==='expand'); }); act.parentElement.classList.remove('show'); return; }
  const dg = e.target.closest('[data-dg]');
  if (dg){ const id=dg.dataset.dg; document.getElementById('mt').textContent=t(U.diagrams.find(d=>d.id===id).title); document.getElementById('zw').innerHTML=SVG[id]; setZoom(1); document.getElementById('modal').classList.add('show'); return; }
  if (e.target.closest('#mx')) document.getElementById('modal').classList.remove('show');
  if (e.target.closest('#zi')) setZoom(zoom+0.5);
  if (e.target.closest('#zo')) setZoom(zoom-0.5);
  if (e.target.closest('#zr')) setZoom(1);
});
render();
</script></body></html>
