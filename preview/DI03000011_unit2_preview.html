<script>
const U = {"subject": "DI03000011", "unit": 2, "format": "notes", "title": {"en": "Binary Logic and Boolean Algebra", "gu": "Binary Logic અને Boolean Algebra"}, "weightage": 23, "hours": 7, "notes": [{"title": {"en": "2.1 Binary Logic", "gu": "2.1 Binary Logic"}, "items": [{"h": {"en": "2.1.1 Binary Logic and Logic Operations", "gu": "2.1.1 Binary Logic અને Logic Operations"}, "body": {"en": "<p><b>Binary logic</b> deals with <b>binary variables</b> (A, B, C, X, Y …) that can take only two values, <b>0 and 1</b> (FALSE/TRUE, OFF/ON, LOW/HIGH), and with <b>logical operations</b> on them.</p>\n<h4>Three basic logic operations</h4>\n<table><tr><th>Operation</th><th>Symbol</th><th>Meaning</th></tr>\n<tr><td>AND</td><td>A · B or AB</td><td>1 only if both are 1</td></tr>\n<tr><td>OR</td><td>A + B</td><td>1 if any one is 1</td></tr>\n<tr><td>NOT</td><td><span style=\"text-decoration:overline\">A</span> or A'</td><td>Complement (inverts the value)</td></tr></table>\n<p><b>Note:</b> \"+\" here means logical OR, not arithmetic addition. In binary logic 1 + 1 = 1.</p>\n<h4>Truth table</h4>\n<p>A <b>truth table</b> lists the output for <b>every possible combination</b> of inputs. With n inputs there are <b>2<sup>n</sup> rows</b> (2 inputs → 4 rows, 3 inputs → 8 rows, 4 inputs → 16 rows). Inputs are written in binary counting order (000, 001, 010 …).</p>\n<h4>Logic levels</h4>\n<p>In TTL circuits (5 V supply), a voltage from <b>2 V to 5 V</b> is treated as HIGH and <b>0 V to 0.8 V</b> as LOW. The range in between is undefined.</p>", "gu": "<p><b>Binary logic</b> એવા <b>binary variables</b> (A, B, C, X, Y …) સાથે કામ કરે છે જે માત્ર બે કિંમત, <b>0 અને 1</b> (FALSE/TRUE, OFF/ON, LOW/HIGH), લઈ શકે, અને તેમના પરના <b>logical operations</b> સાથે.</p>\n<h4>ત્રણ મૂળભૂત logic operations</h4>\n<table><tr><th>Operation</th><th>Symbol</th><th>અર્થ</th></tr>\n<tr><td>AND</td><td>A · B અથવા AB</td><td>બંને 1 હોય તો જ 1</td></tr>\n<tr><td>OR</td><td>A + B</td><td>કોઈ પણ એક 1 હોય તો 1</td></tr>\n<tr><td>NOT</td><td><span style=\"text-decoration:overline\">A</span> અથવા A'</td><td>Complement (કિંમત ઉલટાવે)</td></tr></table>\n<p><b>નોંધ:</b> અહીં \"+\" નો અર્થ logical OR છે, ગણિતનો સરવાળો નહીં. Binary logic માં 1 + 1 = 1.</p>\n<h4>Truth table</h4>\n<p><b>Truth table</b> માં inputs ના <b>દરેક શક્ય combination</b> માટે output લખાય છે. n inputs માટે <b>2<sup>n</sup> rows</b> હોય (2 inputs → 4 rows, 3 inputs → 8 rows, 4 inputs → 16 rows). Inputs binary ગણતરીના ક્રમમાં (000, 001, 010 …) લખાય છે.</p>\n<h4>Logic levels</h4>\n<p>TTL circuits (5 V supply) માં <b>2 V થી 5 V</b> ને HIGH અને <b>0 V થી 0.8 V</b> ને LOW ગણાય છે. વચ્ચેની range undefined છે.</p>"}, "key": true}, {"h": {"en": "2.1.2 Positive and Negative Logic", "gu": "2.1.2 Positive અને Negative Logic"}, "body": {"en": "<p>The two voltage levels of a digital signal can be assigned to logic 1 and 0 in two ways:</p>\n<h4>Positive logic</h4>\n<p>The <b>higher voltage</b> represents logic <b>1</b> and the lower voltage represents logic <b>0</b>. E.g. +5 V = 1, 0 V = 0. Most digital systems use positive logic.</p>\n<h4>Negative logic</h4>\n<p>The <b>lower voltage</b> represents logic <b>1</b> and the higher voltage represents logic <b>0</b>. E.g. 0 V = 1, +5 V = 0 (or −5 V = 1, 0 V = 0).</p>\n<table><tr><th>Voltage</th><th>Positive logic</th><th>Negative logic</th></tr>\n<tr><td>HIGH (+5 V)</td><td>1</td><td>0</td></tr><tr><td>LOW (0 V)</td><td>0</td><td>1</td></tr></table>\n<h4>Effect on gates</h4>\n<p>The same circuit performs different logic functions depending on the convention. Changing from positive to negative logic converts:</p>\n<ul><li>AND ↔ OR</li><li>NAND ↔ NOR</li><li>NOT remains NOT</li></ul>\n<p><i>Example:</i> a gate whose output is HIGH only when both inputs are HIGH is an <b>AND</b> gate in positive logic; in negative logic the same gate gives logic 0 only when both inputs are 0, i.e. it works as an <b>OR</b> gate.</p>", "gu": "<p>Digital signal ના બે voltage levels ને logic 1 અને 0 સાથે બે રીતે જોડી શકાય:</p>\n<h4>Positive logic</h4>\n<p><b>વધુ voltage</b> logic <b>1</b> અને ઓછું voltage logic <b>0</b> દર્શાવે છે. દા.ત. +5 V = 1, 0 V = 0. મોટા ભાગની digital systems positive logic વાપરે છે.</p>\n<h4>Negative logic</h4>\n<p><b>ઓછું voltage</b> logic <b>1</b> અને વધુ voltage logic <b>0</b> દર્શાવે છે. દા.ત. 0 V = 1, +5 V = 0 (અથવા −5 V = 1, 0 V = 0).</p>\n<table><tr><th>Voltage</th><th>Positive logic</th><th>Negative logic</th></tr>\n<tr><td>HIGH (+5 V)</td><td>1</td><td>0</td></tr><tr><td>LOW (0 V)</td><td>0</td><td>1</td></tr></table>\n<h4>Gates પર અસર</h4>\n<p>એક જ circuit convention પ્રમાણે જુદાં logic functions કરે છે. Positive માંથી negative logic માં બદલતાં:</p>\n<ul><li>AND ↔ OR</li><li>NAND ↔ NOR</li><li>NOT એ NOT જ રહે</li></ul>\n<p><i>ઉદાહરણ:</i> જે gate નું output બંને inputs HIGH હોય ત્યારે જ HIGH થાય તે positive logic માં <b>AND</b> gate છે; negative logic માં એ જ gate બંને inputs 0 હોય ત્યારે જ 0 આપે છે, એટલે કે તે <b>OR</b> gate તરીકે કામ કરે છે.</p>"}, "diagram": "de2_pos_neg", "examples": ["de2n15"]}]}, {"title": {"en": "2.2 Logic Gates", "gu": "2.2 Logic Gates"}, "items": [{"h": {"en": "2.2.1 AND Gate", "gu": "2.2.1 AND Gate"}, "body": {"en": "<p>A <b>logic gate</b> is an electronic circuit with one or more inputs and one output that performs a logic operation. The <b>AND gate</b> performs logical multiplication.</p><p><b>Boolean expression:</b> Y = A·B</p><p><b>Truth table (2-input):</b></p><table><tr><th>A</th><th>B</th><th>Y</th></tr><tr><td>0</td><td>0</td><td><b>0</b></td></tr><tr><td>0</td><td>1</td><td><b>0</b></td></tr><tr><td>1</td><td>0</td><td><b>0</b></td></tr><tr><td>1</td><td>1</td><td><b>1</b></td></tr></table><p><b>Rule:</b> the output is <b>1 only when all inputs are 1</b>; if any input is 0, the output is 0.</p><p>It works like <b>switches in series</b>: the lamp glows only when both switches A and B are closed.</p><p><b>3-input AND:</b> Y = ABC</p><table><tr><th>A</th><th>B</th><th>C</th><th>Y</th></tr><tr><td>0</td><td>0</td><td>0</td><td><b>0</b></td></tr><tr><td>0</td><td>0</td><td>1</td><td><b>0</b></td></tr><tr><td>0</td><td>1</td><td>0</td><td><b>0</b></td></tr><tr><td>0</td><td>1</td><td>1</td><td><b>0</b></td></tr><tr><td>1</td><td>0</td><td>0</td><td><b>0</b></td></tr><tr><td>1</td><td>0</td><td>1</td><td><b>0</b></td></tr><tr><td>1</td><td>1</td><td>0</td><td><b>0</b></td></tr><tr><td>1</td><td>1</td><td>1</td><td><b>1</b></td></tr></table><p><b>IC:</b> 7408 (quad 2-input AND)</p>", "gu": "<p><b>Logic gate</b> એ એક કે વધુ inputs અને એક output વાળો electronic circuit છે જે logic operation કરે છે. <b>AND gate</b> logical ગુણાકાર કરે છે.</p><p><b>Boolean expression:</b> Y = A·B</p><p><b>Truth table (2-input):</b></p><table><tr><th>A</th><th>B</th><th>Y</th></tr><tr><td>0</td><td>0</td><td><b>0</b></td></tr><tr><td>0</td><td>1</td><td><b>0</b></td></tr><tr><td>1</td><td>0</td><td><b>0</b></td></tr><tr><td>1</td><td>1</td><td><b>1</b></td></tr></table><p><b>નિયમ:</b> <b>બધા inputs 1 હોય ત્યારે જ output 1</b>; કોઈ પણ input 0 હોય તો output 0.</p><p>તે <b>series માં જોડેલી switches</b> જેવું કામ કરે છે: switch A અને B બંને બંધ (ON) હોય ત્યારે જ lamp ચાલુ થાય.</p><p><b>3-input AND:</b> Y = ABC</p><table><tr><th>A</th><th>B</th><th>C</th><th>Y</th></tr><tr><td>0</td><td>0</td><td>0</td><td><b>0</b></td></tr><tr><td>0</td><td>0</td><td>1</td><td><b>0</b></td></tr><tr><td>0</td><td>1</td><td>0</td><td><b>0</b></td></tr><tr><td>0</td><td>1</td><td>1</td><td><b>0</b></td></tr><tr><td>1</td><td>0</td><td>0</td><td><b>0</b></td></tr><tr><td>1</td><td>0</td><td>1</td><td><b>0</b></td></tr><tr><td>1</td><td>1</td><td>0</td><td><b>0</b></td></tr><tr><td>1</td><td>1</td><td>1</td><td><b>1</b></td></tr></table><p><b>IC:</b> 7408 (quad 2-input AND)</p>"}, "diagram": "de2_and", "key": true}, {"h": {"en": "2.2.2 OR Gate", "gu": "2.2.2 OR Gate"}, "body": {"en": "<p>The <b>OR gate</b> performs logical addition.</p><p><b>Boolean expression:</b> Y = A + B</p><p><b>Truth table (2-input):</b></p><table><tr><th>A</th><th>B</th><th>Y</th></tr><tr><td>0</td><td>0</td><td><b>0</b></td></tr><tr><td>0</td><td>1</td><td><b>1</b></td></tr><tr><td>1</td><td>0</td><td><b>1</b></td></tr><tr><td>1</td><td>1</td><td><b>1</b></td></tr></table><p><b>Rule:</b> the output is <b>1 when any one (or more) input is 1</b>; the output is 0 only when all inputs are 0.</p><p>It works like <b>switches in parallel</b>: the lamp glows when switch A or switch B (or both) is closed.</p><p><b>3-input OR:</b> Y = A + B + C</p><table><tr><th>A</th><th>B</th><th>C</th><th>Y</th></tr><tr><td>0</td><td>0</td><td>0</td><td><b>0</b></td></tr><tr><td>0</td><td>0</td><td>1</td><td><b>1</b></td></tr><tr><td>0</td><td>1</td><td>0</td><td><b>1</b></td></tr><tr><td>0</td><td>1</td><td>1</td><td><b>1</b></td></tr><tr><td>1</td><td>0</td><td>0</td><td><b>1</b></td></tr><tr><td>1</td><td>0</td><td>1</td><td><b>1</b></td></tr><tr><td>1</td><td>1</td><td>0</td><td><b>1</b></td></tr><tr><td>1</td><td>1</td><td>1</td><td><b>1</b></td></tr></table><p><b>IC:</b> 7432 (quad 2-input OR)</p>", "gu": "<p><b>OR gate</b> logical સરવાળો કરે છે.</p><p><b>Boolean expression:</b> Y = A + B</p><p><b>Truth table (2-input):</b></p><table><tr><th>A</th><th>B</th><th>Y</th></tr><tr><td>0</td><td>0</td><td><b>0</b></td></tr><tr><td>0</td><td>1</td><td><b>1</b></td></tr><tr><td>1</td><td>0</td><td><b>1</b></td></tr><tr><td>1</td><td>1</td><td><b>1</b></td></tr></table><p><b>નિયમ:</b> <b>કોઈ પણ એક (કે વધુ) input 1 હોય ત્યારે output 1</b>; બધા inputs 0 હોય ત્યારે જ output 0.</p><p>તે <b>parallel માં જોડેલી switches</b> જેવું કામ કરે છે: switch A અથવા B (અથવા બંને) બંધ હોય ત્યારે lamp ચાલુ થાય.</p><p><b>3-input OR:</b> Y = A + B + C</p><table><tr><th>A</th><th>B</th><th>C</th><th>Y</th></tr><tr><td>0</td><td>0</td><td>0</td><td><b>0</b></td></tr><tr><td>0</td><td>0</td><td>1</td><td><b>1</b></td></tr><tr><td>0</td><td>1</td><td>0</td><td><b>1</b></td></tr><tr><td>0</td><td>1</td><td>1</td><td><b>1</b></td></tr><tr><td>1</td><td>0</td><td>0</td><td><b>1</b></td></tr><tr><td>1</td><td>0</td><td>1</td><td><b>1</b></td></tr><tr><td>1</td><td>1</td><td>0</td><td><b>1</b></td></tr><tr><td>1</td><td>1</td><td>1</td><td><b>1</b></td></tr></table><p><b>IC:</b> 7432 (quad 2-input OR)</p>"}, "diagram": "de2_or", "key": true}, {"h": {"en": "2.2.3 NOT Gate (Inverter)", "gu": "2.2.3 NOT Gate (Inverter)"}, "body": {"en": "<p>The <b>NOT gate</b> has <b>one input and one output</b>. It performs complementation (inversion).</p><p><b>Boolean expression:</b> Y = <span style=\"text-decoration:overline\">A</span></p><p><b>Truth table (2-input):</b></p><table><tr><th>A</th><th>Y</th></tr><tr><td>0</td><td><b>1</b></td></tr><tr><td>1</td><td><b>0</b></td></tr></table><p><b>Rule:</b> the output is the <b>complement</b> of the input: 0 → 1 and 1 → 0. The small circle (bubble) at the output means inversion.</p><p>Two NOT gates in series give back the original signal: double complement = A.</p><p><b>IC:</b> 7404 (hex inverter, 6 NOT gates)</p>", "gu": "<p><b>NOT gate</b> માં <b>એક input અને એક output</b> હોય છે. તે complement (inversion) કરે છે.</p><p><b>Boolean expression:</b> Y = <span style=\"text-decoration:overline\">A</span></p><p><b>Truth table (2-input):</b></p><table><tr><th>A</th><th>Y</th></tr><tr><td>0</td><td><b>1</b></td></tr><tr><td>1</td><td><b>0</b></td></tr></table><p><b>નિયમ:</b> output એ input નો <b>complement</b> છે: 0 → 1 અને 1 → 0. Output પરનું નાનું વર્તુળ (bubble) inversion દર્શાવે છે.</p><p>Series માં બે NOT gates મૂકવાથી મૂળ signal પાછો મળે: double complement = A.</p><p><b>IC:</b> 7404 (hex inverter, 6 NOT gates)</p>"}, "diagram": "de2_not", "key": true}, {"h": {"en": "2.2.4 NAND Gate", "gu": "2.2.4 NAND Gate"}, "body": {"en": "<p>The <b>NAND gate</b> (NOT-AND) is an <b>AND gate followed by a NOT gate</b>. Its output is the complement of the AND output.</p><p><b>Boolean expression:</b> Y = <span style=\"text-decoration:overline\">A·B</span></p><p><b>Truth table (2-input):</b></p><table><tr><th>A</th><th>B</th><th>Y</th></tr><tr><td>0</td><td>0</td><td><b>1</b></td></tr><tr><td>0</td><td>1</td><td><b>1</b></td></tr><tr><td>1</td><td>0</td><td><b>1</b></td></tr><tr><td>1</td><td>1</td><td><b>0</b></td></tr></table><p><b>Rule:</b> the output is <b>0 only when all inputs are 1</b>; otherwise the output is 1.</p><p>NAND is a <b>universal gate</b> (see 2.2.9).</p><p><b>IC:</b> 7400 (quad 2-input NAND)</p>", "gu": "<p><b>NAND gate</b> (NOT-AND) એ <b>AND gate પછી NOT gate</b> છે. તેનું output AND output નો complement છે.</p><p><b>Boolean expression:</b> Y = <span style=\"text-decoration:overline\">A·B</span></p><p><b>Truth table (2-input):</b></p><table><tr><th>A</th><th>B</th><th>Y</th></tr><tr><td>0</td><td>0</td><td><b>1</b></td></tr><tr><td>0</td><td>1</td><td><b>1</b></td></tr><tr><td>1</td><td>0</td><td><b>1</b></td></tr><tr><td>1</td><td>1</td><td><b>0</b></td></tr></table><p><b>નિયમ:</b> <b>બધા inputs 1 હોય ત્યારે જ output 0</b>; બાકી output 1.</p><p>NAND એ <b>universal gate</b> છે (જુઓ 2.2.9).</p><p><b>IC:</b> 7400 (quad 2-input NAND)</p>"}, "diagram": "de2_nand", "key": true}, {"h": {"en": "2.2.5 NOR Gate", "gu": "2.2.5 NOR Gate"}, "body": {"en": "<p>The <b>NOR gate</b> (NOT-OR) is an <b>OR gate followed by a NOT gate</b>.</p><p><b>Boolean expression:</b> Y = <span style=\"text-decoration:overline\">A+B</span></p><p><b>Truth table (2-input):</b></p><table><tr><th>A</th><th>B</th><th>Y</th></tr><tr><td>0</td><td>0</td><td><b>1</b></td></tr><tr><td>0</td><td>1</td><td><b>0</b></td></tr><tr><td>1</td><td>0</td><td><b>0</b></td></tr><tr><td>1</td><td>1</td><td><b>0</b></td></tr></table><p><b>Rule:</b> the output is <b>1 only when all inputs are 0</b>; if any input is 1, the output is 0.</p><p>NOR is also a <b>universal gate</b> (see 2.2.10).</p><p><b>IC:</b> 7402 (quad 2-input NOR)</p>", "gu": "<p><b>NOR gate</b> (NOT-OR) એ <b>OR gate પછી NOT gate</b> છે.</p><p><b>Boolean expression:</b> Y = <span style=\"text-decoration:overline\">A+B</span></p><p><b>Truth table (2-input):</b></p><table><tr><th>A</th><th>B</th><th>Y</th></tr><tr><td>0</td><td>0</td><td><b>1</b></td></tr><tr><td>0</td><td>1</td><td><b>0</b></td></tr><tr><td>1</td><td>0</td><td><b>0</b></td></tr><tr><td>1</td><td>1</td><td><b>0</b></td></tr></table><p><b>નિયમ:</b> <b>બધા inputs 0 હોય ત્યારે જ output 1</b>; કોઈ પણ input 1 હોય તો output 0.</p><p>NOR પણ <b>universal gate</b> છે (જુઓ 2.2.10).</p><p><b>IC:</b> 7402 (quad 2-input NOR)</p>"}, "diagram": "de2_nor", "key": true}, {"h": {"en": "2.2.6 EX-OR Gate", "gu": "2.2.6 EX-OR Gate"}, "body": {"en": "<p>The <b>Exclusive-OR (EX-OR / XOR)</b> gate gives output 1 when the inputs are <b>different</b>. Symbol of the operation: ⊕.</p><p><b>Boolean expression:</b> Y = A⊕B = A<span style=\"text-decoration:overline\">B</span> + <span style=\"text-decoration:overline\">A</span>B</p><p><b>Truth table (2-input):</b></p><table><tr><th>A</th><th>B</th><th>Y</th></tr><tr><td>0</td><td>0</td><td><b>0</b></td></tr><tr><td>0</td><td>1</td><td><b>1</b></td></tr><tr><td>1</td><td>0</td><td><b>1</b></td></tr><tr><td>1</td><td>1</td><td><b>0</b></td></tr></table><p><b>Rule:</b> the output is <b>1 when an odd number of inputs are 1</b> (for 2 inputs: when A ≠ B).</p><p><b>Applications:</b> half adder and full adder (sum bit), parity generator/checker, comparator, controlled inverter (A⊕1 = <span style=\"text-decoration:overline\">A</span>, A⊕0 = A).</p><p>It can be built using 2 NOT, 2 AND and 1 OR gate (see diagram).</p><p><b>IC:</b> 7486 (quad 2-input EX-OR)</p>", "gu": "<p><b>Exclusive-OR (EX-OR / XOR)</b> gate inputs <b>જુદા</b> હોય ત્યારે output 1 આપે છે. Operation નો symbol: ⊕.</p><p><b>Boolean expression:</b> Y = A⊕B = A<span style=\"text-decoration:overline\">B</span> + <span style=\"text-decoration:overline\">A</span>B</p><p><b>Truth table (2-input):</b></p><table><tr><th>A</th><th>B</th><th>Y</th></tr><tr><td>0</td><td>0</td><td><b>0</b></td></tr><tr><td>0</td><td>1</td><td><b>1</b></td></tr><tr><td>1</td><td>0</td><td><b>1</b></td></tr><tr><td>1</td><td>1</td><td><b>0</b></td></tr></table><p><b>નિયમ:</b> <b>એકી (odd) સંખ્યામાં inputs 1 હોય ત્યારે output 1</b> (2 inputs માટે: A ≠ B હોય ત્યારે).</p><p><b>ઉપયોગો:</b> half adder અને full adder (sum bit), parity generator/checker, comparator, controlled inverter (A⊕1 = <span style=\"text-decoration:overline\">A</span>, A⊕0 = A).</p><p>તેને 2 NOT, 2 AND અને 1 OR gate વડે બનાવી શકાય (આકૃતિ જુઓ).</p><p><b>IC:</b> 7486 (quad 2-input EX-OR)</p>"}, "diagram": "de2_xor", "key": true}, {"h": {"en": "2.2.7 EX-NOR Gate", "gu": "2.2.7 EX-NOR Gate"}, "body": {"en": "<p>The <b>Exclusive-NOR (EX-NOR / XNOR)</b> gate is an EX-OR gate followed by a NOT gate. Symbol: ⊙.</p><p><b>Boolean expression:</b> Y = <span style=\"text-decoration:overline\">A⊕B</span> = AB + <span style=\"text-decoration:overline\">A</span><span style=\"text-decoration:overline\">B</span></p><p><b>Truth table (2-input):</b></p><table><tr><th>A</th><th>B</th><th>Y</th></tr><tr><td>0</td><td>0</td><td><b>1</b></td></tr><tr><td>0</td><td>1</td><td><b>0</b></td></tr><tr><td>1</td><td>0</td><td><b>0</b></td></tr><tr><td>1</td><td>1</td><td><b>1</b></td></tr></table><p><b>Rule:</b> the output is <b>1 when the inputs are equal</b> (both 0 or both 1).</p><p>It is also called the <b>equality</b> or <b>coincidence</b> gate and is used in digital <b>comparators</b> to check whether two bits are equal.</p><p><b>IC:</b> 74266 (quad 2-input EX-NOR)</p>", "gu": "<p><b>Exclusive-NOR (EX-NOR / XNOR)</b> gate એ EX-OR gate પછી NOT gate છે. Symbol: ⊙.</p><p><b>Boolean expression:</b> Y = <span style=\"text-decoration:overline\">A⊕B</span> = AB + <span style=\"text-decoration:overline\">A</span><span style=\"text-decoration:overline\">B</span></p><p><b>Truth table (2-input):</b></p><table><tr><th>A</th><th>B</th><th>Y</th></tr><tr><td>0</td><td>0</td><td><b>1</b></td></tr><tr><td>0</td><td>1</td><td><b>0</b></td></tr><tr><td>1</td><td>0</td><td><b>0</b></td></tr><tr><td>1</td><td>1</td><td><b>1</b></td></tr></table><p><b>નિયમ:</b> <b>inputs સરખા હોય ત્યારે output 1</b> (બંને 0 અથવા બંને 1).</p><p>તેને <b>equality</b> અથવા <b>coincidence</b> gate પણ કહે છે અને બે bits સરખા છે કે નહીં તે ચકાસવા digital <b>comparators</b> માં વપરાય છે.</p><p><b>IC:</b> 74266 (quad 2-input EX-NOR)</p>"}, "diagram": "de2_xnor", "key": true}, {"h": {"en": "2.2.8 Classification and Summary of Logic Gates", "gu": "2.2.8 Logic Gates નું વર્ગીકરણ અને સારાંશ"}, "body": {"en": "<h4>Classification</h4>\n<ol>\n<li><b>Basic gates:</b> AND, OR, NOT. Every Boolean function can be built using these three.</li>\n<li><b>Universal gates:</b> NAND, NOR. Any gate (and any circuit) can be built using only one type of universal gate.</li>\n<li><b>Special (derived) gates:</b> EX-OR, EX-NOR.</li>\n</ol>\n<h4>Summary</h4>\n<table><tr><th>Gate</th><th>Expression</th><th>Output is 1 when</th></tr>\n<tr><td>AND</td><td>AB</td><td>all inputs are 1</td></tr>\n<tr><td>OR</td><td>A + B</td><td>any input is 1</td></tr>\n<tr><td>NOT</td><td><span style=\"text-decoration:overline\">A</span></td><td>input is 0</td></tr>\n<tr><td>NAND</td><td><span style=\"text-decoration:overline\">AB</span></td><td>any input is 0</td></tr>\n<tr><td>NOR</td><td><span style=\"text-decoration:overline\">A+B</span></td><td>all inputs are 0</td></tr>\n<tr><td>EX-OR</td><td>A⊕B</td><td>inputs are different</td></tr>\n<tr><td>EX-NOR</td><td><span style=\"text-decoration:overline\">A⊕B</span></td><td>inputs are equal</td></tr></table>", "gu": "<h4>વર્ગીકરણ</h4>\n<ol>\n<li><b>Basic gates:</b> AND, OR, NOT. આ ત્રણ વડે દરેક Boolean function બનાવી શકાય.</li>\n<li><b>Universal gates:</b> NAND, NOR. માત્ર એક પ્રકારના universal gate વડે કોઈ પણ gate (અને કોઈ પણ circuit) બનાવી શકાય.</li>\n<li><b>Special (derived) gates:</b> EX-OR, EX-NOR.</li>\n</ol>\n<h4>સારાંશ</h4>\n<table><tr><th>Gate</th><th>Expression</th><th>Output 1 ક્યારે</th></tr>\n<tr><td>AND</td><td>AB</td><td>બધા inputs 1</td></tr>\n<tr><td>OR</td><td>A + B</td><td>કોઈ પણ input 1</td></tr>\n<tr><td>NOT</td><td><span style=\"text-decoration:overline\">A</span></td><td>input 0</td></tr>\n<tr><td>NAND</td><td><span style=\"text-decoration:overline\">AB</span></td><td>કોઈ પણ input 0</td></tr>\n<tr><td>NOR</td><td><span style=\"text-decoration:overline\">A+B</span></td><td>બધા inputs 0</td></tr>\n<tr><td>EX-OR</td><td>A⊕B</td><td>inputs જુદા</td></tr>\n<tr><td>EX-NOR</td><td><span style=\"text-decoration:overline\">A⊕B</span></td><td>inputs સરખા</td></tr></table>"}, "diagram": "de2_summary"}, {"h": {"en": "2.2.9 NAND as a Universal Gate", "gu": "2.2.9 Universal Gate તરીકે NAND"}, "body": {"en": "<p>A <b>universal gate</b> is a gate with which <b>all basic gates (NOT, AND, OR)</b> can be made, so any logic circuit can be built using it alone. NAND and NOR are universal gates. They are preferred because only one IC type is needed, which reduces cost and inventory.</p>\n<h4>Basic gates using NAND</h4>\n<ol>\n<li><b>NOT:</b> join both inputs of a NAND gate: Y = <span style=\"text-decoration:overline\">A·A</span> = <span style=\"text-decoration:overline\">A</span>. (1 NAND)</li>\n<li><b>AND:</b> NAND followed by a NAND-inverter: Y = <span style=\"text-decoration:overline\">AB</span> = AB. (2 NAND)</li>\n<li><b>OR:</b> invert both inputs using NAND-inverters, then NAND them: Y = <span style=\"text-decoration:overline\">A·B</span> = A + B (by De Morgan's theorem). (3 NAND)</li>\n</ol>\n<p><b>NOR using NAND:</b> make OR with 3 NAND gates and add one more NAND-inverter (4 NAND).</p>", "gu": "<p><b>Universal gate</b> એવો gate છે જેના વડે <b>બધા basic gates (NOT, AND, OR)</b> બનાવી શકાય, તેથી માત્ર તેના વડે કોઈ પણ logic circuit બનાવી શકાય. NAND અને NOR universal gates છે. માત્ર એક જ પ્રકારનું IC જોઈએ, તેથી cost અને inventory ઘટે છે; માટે તે પસંદ કરાય છે.</p>\n<h4>NAND વડે basic gates</h4>\n<ol>\n<li><b>NOT:</b> NAND gate ના બંને inputs જોડી દો: Y = <span style=\"text-decoration:overline\">A·A</span> = <span style=\"text-decoration:overline\">A</span>. (1 NAND)</li>\n<li><b>AND:</b> NAND પછી NAND-inverter: Y = <span style=\"text-decoration:overline\">AB</span> = AB. (2 NAND)</li>\n<li><b>OR:</b> NAND-inverters વડે બંને inputs invert કરી, પછી NAND કરો: Y = <span style=\"text-decoration:overline\">A·B</span> = A + B (De Morgan's theorem મુજબ). (3 NAND)</li>\n</ol>\n<p><b>NAND વડે NOR:</b> 3 NAND વડે OR બનાવી એક વધુ NAND-inverter ઉમેરો (4 NAND).</p>"}, "diagram": "de2_nand_universal", "examples": ["de2n13"], "key": true}, {"h": {"en": "2.2.10 NOR as a Universal Gate", "gu": "2.2.10 Universal Gate તરીકે NOR"}, "body": {"en": "<h4>Basic gates using NOR</h4>\n<ol>\n<li><b>NOT:</b> join both inputs of a NOR gate: Y = <span style=\"text-decoration:overline\">A+A</span> = <span style=\"text-decoration:overline\">A</span>. (1 NOR)</li>\n<li><b>OR:</b> NOR followed by a NOR-inverter: Y = <span style=\"text-decoration:overline\">A+B</span> = A + B. (2 NOR)</li>\n<li><b>AND:</b> invert both inputs using NOR-inverters, then NOR them: Y = <span style=\"text-decoration:overline\">A+B</span> = AB (by De Morgan's theorem). (3 NOR)</li>\n</ol>\n<p><b>NAND using NOR:</b> make AND with 3 NOR gates and add a NOR-inverter (4 NOR).</p>\n<table><tr><th>Gate to make</th><th>NAND gates</th><th>NOR gates</th></tr>\n<tr><td>NOT</td><td>1</td><td>1</td></tr><tr><td>AND</td><td>2</td><td>3</td></tr><tr><td>OR</td><td>3</td><td>2</td></tr>\n<tr><td>NOR / NAND</td><td>4</td><td>4</td></tr></table>", "gu": "<h4>NOR વડે basic gates</h4>\n<ol>\n<li><b>NOT:</b> NOR gate ના બંને inputs જોડી દો: Y = <span style=\"text-decoration:overline\">A+A</span> = <span style=\"text-decoration:overline\">A</span>. (1 NOR)</li>\n<li><b>OR:</b> NOR પછી NOR-inverter: Y = <span style=\"text-decoration:overline\">A+B</span> = A + B. (2 NOR)</li>\n<li><b>AND:</b> NOR-inverters વડે બંને inputs invert કરી, પછી NOR કરો: Y = <span style=\"text-decoration:overline\">A+B</span> = AB (De Morgan's theorem મુજબ). (3 NOR)</li>\n</ol>\n<p><b>NOR વડે NAND:</b> 3 NOR વડે AND બનાવી NOR-inverter ઉમેરો (4 NOR).</p>\n<table><tr><th>બનાવવાનો gate</th><th>NAND gates</th><th>NOR gates</th></tr>\n<tr><td>NOT</td><td>1</td><td>1</td></tr><tr><td>AND</td><td>2</td><td>3</td></tr><tr><td>OR</td><td>3</td><td>2</td></tr>\n<tr><td>NOR / NAND</td><td>4</td><td>4</td></tr></table>"}, "diagram": "de2_nor_universal", "key": true}, {"h": {"en": "2.2.11 Logic Gate ICs (Practical)", "gu": "2.2.11 Logic Gate ICs (Practical)"}, "body": {"en": "<p>Logic gates are available as <b>TTL 74-series ICs</b> in a 14-pin DIP package. Pin 14 is <b>VCC (+5 V)</b> and pin 7 is <b>GND</b>. Pins are counted anticlockwise from the notch (pin 1 at bottom-left when the notch is on the left).</p>\n<table><tr><th>IC</th><th>Gate</th><th>Gates per IC</th></tr>\n<tr><td>7408</td><td>2-input AND</td><td>4</td></tr><tr><td>7432</td><td>2-input OR</td><td>4</td></tr>\n<tr><td>7404</td><td>NOT</td><td>6</td></tr><tr><td>7400</td><td>2-input NAND</td><td>4</td></tr>\n<tr><td>7402</td><td>2-input NOR</td><td>4</td></tr><tr><td>7486</td><td>2-input EX-OR</td><td>4</td></tr>\n<tr><td>74266</td><td>2-input EX-NOR</td><td>4</td></tr></table>\n<h4>Verifying a truth table (Practical 3)</h4>\n<ol>\n<li>Place the IC on the breadboard; connect pin 14 to +5 V and pin 7 to ground.</li>\n<li>Connect inputs (e.g. pins 1 and 2) to logic switches and the output (pin 3) to an LED with a 330 Ω resistor.</li>\n<li>Apply all input combinations 00, 01, 10, 11 and note the LED: ON = 1, OFF = 0.</li>\n<li>Compare with the theoretical truth table.</li>\n</ol>\n<p><b>Precautions:</b> do not exceed 5 V; never leave TTL inputs floating (they act as 1); switch off the supply while changing connections. <b>Note:</b> the 7402 NOR IC has a different pinout (outputs on pins 1, 4, 10, 13).</p>", "gu": "<p>Logic gates <b>TTL 74-series ICs</b> તરીકે 14-pin DIP package માં મળે છે. Pin 14 <b>VCC (+5 V)</b> અને pin 7 <b>GND</b> છે. Notch થી શરૂ કરીને pins ઘડિયાળની વિરુદ્ધ દિશામાં ગણાય છે (notch ડાબી બાજુ હોય ત્યારે pin 1 નીચે ડાબે).</p>\n<table><tr><th>IC</th><th>Gate</th><th>IC દીઠ gates</th></tr>\n<tr><td>7408</td><td>2-input AND</td><td>4</td></tr><tr><td>7432</td><td>2-input OR</td><td>4</td></tr>\n<tr><td>7404</td><td>NOT</td><td>6</td></tr><tr><td>7400</td><td>2-input NAND</td><td>4</td></tr>\n<tr><td>7402</td><td>2-input NOR</td><td>4</td></tr><tr><td>7486</td><td>2-input EX-OR</td><td>4</td></tr>\n<tr><td>74266</td><td>2-input EX-NOR</td><td>4</td></tr></table>\n<h4>Truth table ની ચકાસણી (Practical 3)</h4>\n<ol>\n<li>IC ને breadboard પર મૂકો; pin 14 ને +5 V અને pin 7 ને ground સાથે જોડો.</li>\n<li>Inputs (દા.ત. pins 1 અને 2) ને logic switches સાથે અને output (pin 3) ને 330 Ω resistor સાથે LED પર જોડો.</li>\n<li>બધા input combinations 00, 01, 10, 11 આપો અને LED નોંધો: ON = 1, OFF = 0.</li>\n<li>Theoretical truth table સાથે સરખાવો.</li>\n</ol>\n<p><b>સાવચેતી:</b> 5 V થી વધુ ન આપો; TTL inputs ખુલ્લા (floating) ન રાખો (તે 1 તરીકે વર્તે છે); connections બદલતી વખતે supply બંધ કરો. <b>નોંધ:</b> 7402 NOR IC ની pin રચના જુદી છે (outputs pins 1, 4, 10, 13 પર).</p>"}, "diagram": "de2_ic7400"}]}, {"title": {"en": "2.3 Boolean Algebra", "gu": "2.3 Boolean Algebra"}, "items": [{"h": {"en": "2.3.1 Boolean Algebra, Postulates and Duality", "gu": "2.3.1 Boolean Algebra, Postulates અને Duality"}, "body": {"en": "<p><b>Boolean algebra</b> is the algebra of binary variables and logic operations, introduced by <b>George Boole</b> (1854). Claude Shannon applied it to switching circuits. It is used to <b>analyse and simplify</b> logic circuits.</p>\n<h4>Postulates (basic rules)</h4>\n<table><tr><th>AND</th><th>OR</th><th>NOT</th></tr>\n<tr><td>0 · 0 = 0</td><td>0 + 0 = 0</td><td><span style=\"text-decoration:overline\">0</span> = 1</td></tr>\n<tr><td>0 · 1 = 0</td><td>0 + 1 = 1</td><td><span style=\"text-decoration:overline\">1</span> = 0</td></tr>\n<tr><td>1 · 0 = 0</td><td>1 + 0 = 1</td><td></td></tr>\n<tr><td>1 · 1 = 1</td><td>1 + 1 = 1</td><td></td></tr></table>\n<p>Huntington's postulates: (1) closure under + and ·; (2) identity elements 0 for + and 1 for ·; (3) commutative laws; (4) distributive laws; (5) for every A there is a complement <span style=\"text-decoration:overline\">A</span> with A + <span style=\"text-decoration:overline\">A</span> = 1 and A·<span style=\"text-decoration:overline\">A</span> = 0; (6) at least two distinct elements (0 and 1).</p>\n<h4>Principle of duality</h4>\n<p>Every Boolean identity remains true if we <b>interchange + and ·</b> and <b>interchange 0 and 1</b> (variables and complements are not changed). The new expression is called the <b>dual</b>.</p>\n<p><i>Example:</i> A + 0 = A → dual: A · 1 = A. &nbsp; A(B + C) = AB + AC → dual: A + BC = (A + B)(A + C).</p>\n<p>So each law of Boolean algebra comes in a pair; proving one proves the other.</p>", "gu": "<p><b>Boolean algebra</b> એ binary variables અને logic operations નું algebra છે, જે <b>George Boole</b> (1854) એ રજૂ કર્યું. Claude Shannon એ તેને switching circuits માં વાપર્યું. તેનો ઉપયોગ logic circuits નું <b>analysis અને simplification</b> કરવા થાય છે.</p>\n<h4>Postulates (મૂળભૂત નિયમો)</h4>\n<table><tr><th>AND</th><th>OR</th><th>NOT</th></tr>\n<tr><td>0 · 0 = 0</td><td>0 + 0 = 0</td><td><span style=\"text-decoration:overline\">0</span> = 1</td></tr>\n<tr><td>0 · 1 = 0</td><td>0 + 1 = 1</td><td><span style=\"text-decoration:overline\">1</span> = 0</td></tr>\n<tr><td>1 · 0 = 0</td><td>1 + 0 = 1</td><td></td></tr>\n<tr><td>1 · 1 = 1</td><td>1 + 1 = 1</td><td></td></tr></table>\n<p>Huntington's postulates: (1) + અને · હેઠળ closure; (2) identity elements: + માટે 0 અને · માટે 1; (3) commutative laws; (4) distributive laws; (5) દરેક A માટે complement <span style=\"text-decoration:overline\">A</span> હોય જેથી A + <span style=\"text-decoration:overline\">A</span> = 1 અને A·<span style=\"text-decoration:overline\">A</span> = 0; (6) ઓછામાં ઓછા બે જુદા elements (0 અને 1).</p>\n<h4>Principle of duality</h4>\n<p>કોઈ પણ Boolean identity માં <b>+ અને · ની અદલાબદલી</b> તથા <b>0 અને 1 ની અદલાબદલી</b> કરવાથી પણ તે સાચી રહે છે (variables અને complements બદલાતા નથી). નવા expression ને <b>dual</b> કહે છે.</p>\n<p><i>ઉદાહરણ:</i> A + 0 = A → dual: A · 1 = A. &nbsp; A(B + C) = AB + AC → dual: A + BC = (A + B)(A + C).</p>\n<p>તેથી Boolean algebra નો દરેક નિયમ જોડીમાં હોય છે; એક સાબિત કરવાથી બીજો પણ સાબિત થાય છે.</p>"}, "key": true}, {"h": {"en": "2.3.2 Laws of Boolean Algebra", "gu": "2.3.2 Boolean Algebra ના નિયમો"}, "body": {"en": "<p>The following laws are used to simplify Boolean expressions. Each can be proved by a truth table (perfect induction).</p><table><tr><th>Law</th><th>Statement</th></tr><tr><td>Commutative</td><td>A + B = B + A<br>A·B = B·A</td></tr><tr><td>Associative</td><td>(A + B) + C = A + (B + C)<br>(AB)C = A(BC)</td></tr><tr><td>Distributive</td><td>A(B + C) = AB + AC<br>A + BC = (A + B)(A + C)</td></tr><tr><td>Identity</td><td>A + 0 = A<br>A · 1 = A</td></tr><tr><td>Null (dominance)</td><td>A + 1 = 1<br>A · 0 = 0</td></tr><tr><td>Idempotent</td><td>A + A = A<br>A · A = A</td></tr><tr><td>Complement</td><td>A + <span style=\"text-decoration:overline\">A</span> = 1<br>A · <span style=\"text-decoration:overline\">A</span> = 0</td></tr><tr><td>Involution (double complement)</td><td>(<span style=\"text-decoration:overline\">A</span>)' = A</td></tr><tr><td>Absorption</td><td>A + AB = A<br>A(A + B) = A<br>A + <span style=\"text-decoration:overline\">A</span>B = A + B</td></tr><tr><td>Consensus</td><td>AB + <span style=\"text-decoration:overline\">A</span>C + BC = AB + <span style=\"text-decoration:overline\">A</span>C</td></tr><tr><td>De Morgan</td><td><span style=\"text-decoration:overline\">A+B</span> = <span style=\"text-decoration:overline\">A</span>·<span style=\"text-decoration:overline\">B</span><br><span style=\"text-decoration:overline\">AB</span> = <span style=\"text-decoration:overline\">A</span> + <span style=\"text-decoration:overline\">B</span></td></tr></table><p><b>Proof of A + <span style=\"text-decoration:overline\">A</span>B = A + B:</b> A + <span style=\"text-decoration:overline\">A</span>B = (A + <span style=\"text-decoration:overline\">A</span>)(A + B) [distributive] = 1·(A + B) = A + B.</p><p><b>Proof of A + AB = A:</b> A + AB = A(1 + B) = A·1 = A.</p><p><b>Caution:</b> Boolean algebra has no subtraction or division, and A + A = A (not 2A), A·A = A (not A²).</p>", "gu": "<p>Boolean expressions ના simplification માટે નીચેના નિયમો વપરાય છે. દરેકને truth table (perfect induction) વડે સાબિત કરી શકાય.</p><table><tr><th>નિયમ</th><th>વિધાન</th></tr><tr><td>Commutative (ક્રમ)</td><td>A + B = B + A<br>A·B = B·A</td></tr><tr><td>Associative (જૂથ)</td><td>(A + B) + C = A + (B + C)<br>(AB)C = A(BC)</td></tr><tr><td>Distributive (વિભાજન)</td><td>A(B + C) = AB + AC<br>A + BC = (A + B)(A + C)</td></tr><tr><td>Identity</td><td>A + 0 = A<br>A · 1 = A</td></tr><tr><td>Null (dominance)</td><td>A + 1 = 1<br>A · 0 = 0</td></tr><tr><td>Idempotent</td><td>A + A = A<br>A · A = A</td></tr><tr><td>Complement</td><td>A + <span style=\"text-decoration:overline\">A</span> = 1<br>A · <span style=\"text-decoration:overline\">A</span> = 0</td></tr><tr><td>Involution (double complement)</td><td>(<span style=\"text-decoration:overline\">A</span>)' = A</td></tr><tr><td>Absorption</td><td>A + AB = A<br>A(A + B) = A<br>A + <span style=\"text-decoration:overline\">A</span>B = A + B</td></tr><tr><td>Consensus</td><td>AB + <span style=\"text-decoration:overline\">A</span>C + BC = AB + <span style=\"text-decoration:overline\">A</span>C</td></tr><tr><td>De Morgan</td><td><span style=\"text-decoration:overline\">A+B</span> = <span style=\"text-decoration:overline\">A</span>·<span style=\"text-decoration:overline\">B</span><br><span style=\"text-decoration:overline\">AB</span> = <span style=\"text-decoration:overline\">A</span> + <span style=\"text-decoration:overline\">B</span></td></tr></table><p><b>A + <span style=\"text-decoration:overline\">A</span>B = A + B ની સાબિતી:</b> A + <span style=\"text-decoration:overline\">A</span>B = (A + <span style=\"text-decoration:overline\">A</span>)(A + B) [distributive] = 1·(A + B) = A + B.</p><p><b>A + AB = A ની સાબિતી:</b> A + AB = A(1 + B) = A·1 = A.</p><p><b>ધ્યાન રાખો:</b> Boolean algebra માં બાદબાકી કે ભાગાકાર નથી, અને A + A = A (2A નહીં), A·A = A (A² નહીં).</p>"}, "examples": ["de2n14"], "key": true}, {"h": {"en": "2.3.3 Simplification of Boolean Expressions", "gu": "2.3.3 Boolean Expressions નું Simplification"}, "body": {"en": "<p><b>Simplification</b> means reducing a Boolean expression to an equivalent form with <b>fewer terms and fewer literals</b> (a literal is a variable or its complement). A simpler expression needs fewer gates, so the circuit is cheaper, faster, smaller and uses less power.</p>\n<h4>Steps</h4>\n<ol>\n<li>Remove brackets by multiplying out (distributive law) or apply De Morgan to remove bars over groups.</li>\n<li>Take common factors from terms.</li>\n<li>Use A + <span style=\"text-decoration:overline\">A</span> = 1, A + 1 = 1, A + AB = A, A + <span style=\"text-decoration:overline\">A</span>B = A + B, etc.</li>\n<li>Check the answer with a truth table if needed.</li>\n</ol>\n<p><b>Example:</b> Y = AB + A<span style=\"text-decoration:overline\">B</span> + <span style=\"text-decoration:overline\">A</span>B</p>\n<p>= A(B + <span style=\"text-decoration:overline\">B</span>) + <span style=\"text-decoration:overline\">A</span>B = A·1 + <span style=\"text-decoration:overline\">A</span>B = A + <span style=\"text-decoration:overline\">A</span>B = <b>A + B</b></p>\n<p>Original: 3 AND + 1 OR + 2 NOT gates. Simplified: just 1 OR gate.</p>", "gu": "<p><b>Simplification</b> એટલે Boolean expression ને <b>ઓછા terms અને ઓછા literals</b> વાળા સમાન સ્વરૂપમાં લાવવું (literal એટલે variable અથવા તેનો complement). સાદા expression માટે ઓછા gates જોઈએ, તેથી circuit સસ્તો, ઝડપી, નાનો બને છે અને ઓછો power વાપરે છે.</p>\n<h4>Steps</h4>\n<ol>\n<li>Distributive law વડે brackets ખોલો અથવા groups પરના bar દૂર કરવા De Morgan લગાવો.</li>\n<li>Terms માંથી common factors લો.</li>\n<li>A + <span style=\"text-decoration:overline\">A</span> = 1, A + 1 = 1, A + AB = A, A + <span style=\"text-decoration:overline\">A</span>B = A + B વગેરે વાપરો.</li>\n<li>જરૂર હોય તો truth table વડે જવાબ ચકાસો.</li>\n</ol>\n<p><b>ઉદાહરણ:</b> Y = AB + A<span style=\"text-decoration:overline\">B</span> + <span style=\"text-decoration:overline\">A</span>B</p>\n<p>= A(B + <span style=\"text-decoration:overline\">B</span>) + <span style=\"text-decoration:overline\">A</span>B = A·1 + <span style=\"text-decoration:overline\">A</span>B = A + <span style=\"text-decoration:overline\">A</span>B = <b>A + B</b></p>\n<p>મૂળ: 3 AND + 1 OR + 2 NOT gates. Simplified: માત્ર 1 OR gate.</p>"}, "examples": ["de2n1", "de2n2", "de2n3", "de2n4", "de2n5", "de2n6"], "key": true}]}, {"title": {"en": "2.4 De Morgan's Theorems and Boolean Functions", "gu": "2.4 De Morgan's Theorems અને Boolean Functions"}, "items": [{"h": {"en": "2.4.1 De Morgan's Theorems", "gu": "2.4.1 De Morgan's Theorems"}, "body": {"en": "<h4>Theorem 1</h4>\n<p>The <b>complement of a product</b> is equal to the <b>sum of the complements</b>:</p>\n<p style=\"text-align:center\"><b><span style=\"text-decoration:overline\">A·B</span> = <span style=\"text-decoration:overline\">A</span> + <span style=\"text-decoration:overline\">B</span></b></p>\n<p>So a <b>NAND gate = bubbled (negative-input) OR gate</b>.</p>\n<h4>Theorem 2</h4>\n<p>The <b>complement of a sum</b> is equal to the <b>product of the complements</b>:</p>\n<p style=\"text-align:center\"><b><span style=\"text-decoration:overline\">A+B</span> = <span style=\"text-decoration:overline\">A</span> · <span style=\"text-decoration:overline\">B</span></b></p>\n<p>So a <b>NOR gate = bubbled (negative-input) AND gate</b>.</p>\n<p><b>Proof of theorem 2 by truth table</b> (theorem 1 is proved in the diagram):</p><table><tr><th>A</th><th>B</th><th>A+B</th><th><span style=\"text-decoration:overline\">A+B</span></th><th><span style=\"text-decoration:overline\">A</span></th><th><span style=\"text-decoration:overline\">B</span></th><th><span style=\"text-decoration:overline\">A</span>·<span style=\"text-decoration:overline\">B</span></th></tr><tr><td>0</td><td>0</td><td>0</td><td>1</td><td>1</td><td>1</td><td><b>1</b></td></tr><tr><td>0</td><td>1</td><td>1</td><td>0</td><td>1</td><td>0</td><td><b>0</b></td></tr><tr><td>1</td><td>0</td><td>1</td><td>0</td><td>0</td><td>1</td><td><b>0</b></td></tr><tr><td>1</td><td>1</td><td>1</td><td>0</td><td>0</td><td>0</td><td><b>0</b></td></tr></table>\n<p>Columns <span style=\"text-decoration:overline\">A+B</span> and <span style=\"text-decoration:overline\">A</span>·<span style=\"text-decoration:overline\">B</span> are identical, hence proved.</p>\n<h4>For more variables</h4>\n<p><span style=\"text-decoration:overline\">ABC</span> = <span style=\"text-decoration:overline\">A</span> + <span style=\"text-decoration:overline\">B</span> + <span style=\"text-decoration:overline\">C</span> &nbsp; and &nbsp; <span style=\"text-decoration:overline\">A+B+C</span> = <span style=\"text-decoration:overline\">A</span>·<span style=\"text-decoration:overline\">B</span>·<span style=\"text-decoration:overline\">C</span></p>\n<p><b>Rule to remember:</b> \"break the bar, change the sign\". Break the long bar into bars over each variable and change · to + (or + to ·).</p>\n<p><b>Uses:</b> simplifying expressions with bars over groups, finding the complement of a function, and converting circuits to NAND-only or NOR-only form.</p>", "gu": "<h4>Theorem 1</h4>\n<p><b>Product નો complement</b> એ <b>complements ના સરવાળા</b> બરાબર છે:</p>\n<p style=\"text-align:center\"><b><span style=\"text-decoration:overline\">A·B</span> = <span style=\"text-decoration:overline\">A</span> + <span style=\"text-decoration:overline\">B</span></b></p>\n<p>તેથી <b>NAND gate = bubbled (negative-input) OR gate</b>.</p>\n<h4>Theorem 2</h4>\n<p><b>Sum નો complement</b> એ <b>complements ના ગુણાકાર</b> બરાબર છે:</p>\n<p style=\"text-align:center\"><b><span style=\"text-decoration:overline\">A+B</span> = <span style=\"text-decoration:overline\">A</span> · <span style=\"text-decoration:overline\">B</span></b></p>\n<p>તેથી <b>NOR gate = bubbled (negative-input) AND gate</b>.</p>\n<p><b>Truth table વડે theorem 2 ની સાબિતી</b> (theorem 1 આકૃતિમાં સાબિત કર્યું છે):</p><table><tr><th>A</th><th>B</th><th>A+B</th><th><span style=\"text-decoration:overline\">A+B</span></th><th><span style=\"text-decoration:overline\">A</span></th><th><span style=\"text-decoration:overline\">B</span></th><th><span style=\"text-decoration:overline\">A</span>·<span style=\"text-decoration:overline\">B</span></th></tr><tr><td>0</td><td>0</td><td>0</td><td>1</td><td>1</td><td>1</td><td><b>1</b></td></tr><tr><td>0</td><td>1</td><td>1</td><td>0</td><td>1</td><td>0</td><td><b>0</b></td></tr><tr><td>1</td><td>0</td><td>1</td><td>0</td><td>0</td><td>1</td><td><b>0</b></td></tr><tr><td>1</td><td>1</td><td>1</td><td>0</td><td>0</td><td>0</td><td><b>0</b></td></tr></table>\n<p><span style=\"text-decoration:overline\">A+B</span> અને <span style=\"text-decoration:overline\">A</span>·<span style=\"text-decoration:overline\">B</span> ના columns સરખા છે, તેથી સાબિત.</p>\n<h4>વધુ variables માટે</h4>\n<p><span style=\"text-decoration:overline\">ABC</span> = <span style=\"text-decoration:overline\">A</span> + <span style=\"text-decoration:overline\">B</span> + <span style=\"text-decoration:overline\">C</span> &nbsp; અને &nbsp; <span style=\"text-decoration:overline\">A+B+C</span> = <span style=\"text-decoration:overline\">A</span>·<span style=\"text-decoration:overline\">B</span>·<span style=\"text-decoration:overline\">C</span></p>\n<p><b>યાદ રાખવાનો નિયમ:</b> \"bar તોડો, sign બદલો\". લાંબા bar ને દરેક variable પરના bars માં તોડો અને · ને + (અથવા + ને ·) માં બદલો.</p>\n<p><b>ઉપયોગ:</b> groups પર bar વાળા expressions નું simplification, function નો complement શોધવો અને circuits ને NAND-only અથવા NOR-only સ્વરૂપમાં ફેરવવા.</p>"}, "diagram": "de2_demorgan", "examples": ["de2n7", "de2n8", "de2n10"], "key": true}, {"h": {"en": "2.4.2 Boolean Functions and Logic Diagrams", "gu": "2.4.2 Boolean Functions અને Logic Diagrams"}, "body": {"en": "<p>A <b>Boolean function</b> is an expression formed with binary variables, the operators AND, OR, NOT, brackets and an equal sign, e.g. Y = AB + <span style=\"text-decoration:overline\">A</span>C. For each combination of input values the function is either 0 or 1.</p>\n<p>A Boolean function can be represented in three ways:</p>\n<ol>\n<li><b>Algebraic expression</b>, e.g. Y = AB + <span style=\"text-decoration:overline\">A</span>C</li>\n<li><b>Truth table</b>: output listed for all 2<sup>n</sup> input combinations</li>\n<li><b>Logic diagram</b>: interconnection of gates</li>\n</ol>\n<h4>Drawing the logic diagram from an expression</h4>\n<ol>\n<li>Use a <b>NOT gate</b> for each complemented variable.</li>\n<li>Use an <b>AND gate</b> for each product term.</li>\n<li>Use an <b>OR gate</b> to add the product terms.</li>\n</ol>\n<h4>Writing the expression from a logic diagram</h4>\n<p>Write the output of each gate, from inputs to output, until the final output is reached.</p>\n<h4>Writing the truth table from an expression</h4>\n<p>List all input combinations and evaluate the expression for each row. For Y = AB + <span style=\"text-decoration:overline\">A</span>C, Y = 1 when (A = 1 and B = 1) or (A = 0 and C = 1), giving rows 1, 3, 6, 7.</p>", "gu": "<p><b>Boolean function</b> એ binary variables, AND, OR, NOT operators, brackets અને બરાબર ચિહ્ન વડે બનેલું expression છે, દા.ત. Y = AB + <span style=\"text-decoration:overline\">A</span>C. Inputs ના દરેક combination માટે function ની કિંમત 0 અથવા 1 હોય છે.</p>\n<p>Boolean function ને ત્રણ રીતે દર્શાવી શકાય:</p>\n<ol>\n<li><b>Algebraic expression</b>, દા.ત. Y = AB + <span style=\"text-decoration:overline\">A</span>C</li>\n<li><b>Truth table</b>: બધા 2<sup>n</sup> input combinations માટે output</li>\n<li><b>Logic diagram</b>: gates ની જોડાણ રચના</li>\n</ol>\n<h4>Expression પરથી logic diagram દોરવો</h4>\n<ol>\n<li>દરેક complemented variable માટે <b>NOT gate</b> વાપરો.</li>\n<li>દરેક product term માટે <b>AND gate</b> વાપરો.</li>\n<li>Product terms નો સરવાળો કરવા <b>OR gate</b> વાપરો.</li>\n</ol>\n<h4>Logic diagram પરથી expression લખવું</h4>\n<p>Inputs થી output તરફ દરેક gate નું output લખતા જાઓ, જ્યાં સુધી અંતિમ output ન મળે.</p>\n<h4>Expression પરથી truth table લખવું</h4>\n<p>બધા input combinations લખી દરેક row માટે expression ની કિંમત શોધો. Y = AB + <span style=\"text-decoration:overline\">A</span>C માટે, (A = 1 અને B = 1) અથવા (A = 0 અને C = 1) હોય ત્યારે Y = 1, એટલે rows 1, 3, 6, 7.</p>"}, "diagram": "de2_func_impl", "examples": ["de2n9"], "key": true}, {"h": {"en": "2.4.3 SOP and POS Forms, Minterms and Maxterms", "gu": "2.4.3 SOP અને POS સ્વરૂપ, Minterms અને Maxterms"}, "body": {"en": "<h4>SOP (Sum of Products)</h4>\n<p>Product (AND) terms are ORed together, e.g. Y = AB + <span style=\"text-decoration:overline\">A</span>C + B<span style=\"text-decoration:overline\">C</span>. It is implemented by an <b>AND-OR</b> circuit.</p>\n<h4>POS (Product of Sums)</h4>\n<p>Sum (OR) terms are ANDed together, e.g. Y = (A + B)(<span style=\"text-decoration:overline\">A</span> + C). It is implemented by an <b>OR-AND</b> circuit.</p>\n<h4>Minterm and maxterm</h4>\n<ul>\n<li><b>Minterm (m):</b> a product term containing <b>all variables</b>, each once (true or complemented). A variable is complemented if its value is 0. Each minterm is 1 for only one row of the truth table.</li>\n<li><b>Maxterm (M):</b> a sum term containing all variables. A variable is complemented if its value is 1. Each maxterm is 0 for only one row.</li>\n<li>M<sub>i</sub> = <span style=\"text-decoration:overline\">m</span><sub>i</sub> (a maxterm is the complement of the minterm with the same number).</li>\n</ul><table><tr><th>ABC</th><th>Minterm</th><th></th><th>Maxterm</th><th></th></tr><tr><td>000</td><td><span style=\"text-decoration:overline\">A</span><span style=\"text-decoration:overline\">B</span><span style=\"text-decoration:overline\">C</span></td><td>m<sub>0</sub></td><td>(A + B + C)</td><td>M<sub>0</sub></td></tr><tr><td>001</td><td><span style=\"text-decoration:overline\">A</span><span style=\"text-decoration:overline\">B</span>C</td><td>m<sub>1</sub></td><td>(A + B + <span style=\"text-decoration:overline\">C</span>)</td><td>M<sub>1</sub></td></tr><tr><td>010</td><td><span style=\"text-decoration:overline\">A</span>B<span style=\"text-decoration:overline\">C</span></td><td>m<sub>2</sub></td><td>(A + <span style=\"text-decoration:overline\">B</span> + C)</td><td>M<sub>2</sub></td></tr><tr><td>011</td><td><span style=\"text-decoration:overline\">A</span>BC</td><td>m<sub>3</sub></td><td>(A + <span style=\"text-decoration:overline\">B</span> + <span style=\"text-decoration:overline\">C</span>)</td><td>M<sub>3</sub></td></tr><tr><td>100</td><td>A<span style=\"text-decoration:overline\">B</span><span style=\"text-decoration:overline\">C</span></td><td>m<sub>4</sub></td><td>(<span style=\"text-decoration:overline\">A</span> + B + C)</td><td>M<sub>4</sub></td></tr><tr><td>101</td><td>A<span style=\"text-decoration:overline\">B</span>C</td><td>m<sub>5</sub></td><td>(<span style=\"text-decoration:overline\">A</span> + B + <span style=\"text-decoration:overline\">C</span>)</td><td>M<sub>5</sub></td></tr><tr><td>110</td><td>AB<span style=\"text-decoration:overline\">C</span></td><td>m<sub>6</sub></td><td>(<span style=\"text-decoration:overline\">A</span> + <span style=\"text-decoration:overline\">B</span> + C)</td><td>M<sub>6</sub></td></tr><tr><td>111</td><td>ABC</td><td>m<sub>7</sub></td><td>(<span style=\"text-decoration:overline\">A</span> + <span style=\"text-decoration:overline\">B</span> + <span style=\"text-decoration:overline\">C</span>)</td><td>M<sub>7</sub></td></tr></table>\n<h4>Canonical (standard) forms</h4>\n<ul>\n<li><b>Canonical SOP</b> = sum of the minterms for which Y = 1: Y = Σm(…)</li>\n<li><b>Canonical POS</b> = product of the maxterms for which Y = 0: Y = ΠM(…)</li>\n</ul>\n<p><i>Example:</i> if Y = 1 for rows 1, 3, 6, 7 then Y = Σm(1, 3, 6, 7) = ΠM(0, 2, 4, 5).</p>\n<p><b>To expand a term to canonical form</b>, multiply a missing variable X by (X + <span style=\"text-decoration:overline\">X</span>) = 1. E.g. A = A(B + <span style=\"text-decoration:overline\">B</span>) = AB + A<span style=\"text-decoration:overline\">B</span>.</p>", "gu": "<h4>SOP (Sum of Products)</h4>\n<p>Product (AND) terms ને OR કરાય છે, દા.ત. Y = AB + <span style=\"text-decoration:overline\">A</span>C + B<span style=\"text-decoration:overline\">C</span>. તે <b>AND-OR</b> circuit વડે બને છે.</p>\n<h4>POS (Product of Sums)</h4>\n<p>Sum (OR) terms ને AND કરાય છે, દા.ત. Y = (A + B)(<span style=\"text-decoration:overline\">A</span> + C). તે <b>OR-AND</b> circuit વડે બને છે.</p>\n<h4>Minterm અને maxterm</h4>\n<ul>\n<li><b>Minterm (m):</b> <b>બધા variables</b> એક વાર (true અથવા complemented) ધરાવતો product term. Variable ની કિંમત 0 હોય તો તેનો complement લેવાય. દરેક minterm truth table ની માત્ર એક row માટે 1 હોય છે.</li>\n<li><b>Maxterm (M):</b> બધા variables ધરાવતો sum term. Variable ની કિંમત 1 હોય તો તેનો complement લેવાય. દરેક maxterm માત્ર એક row માટે 0 હોય છે.</li>\n<li>M<sub>i</sub> = <span style=\"text-decoration:overline\">m</span><sub>i</sub> (maxterm એ સમાન ક્રમના minterm નો complement છે).</li>\n</ul><table><tr><th>ABC</th><th>Minterm</th><th></th><th>Maxterm</th><th></th></tr><tr><td>000</td><td><span style=\"text-decoration:overline\">A</span><span style=\"text-decoration:overline\">B</span><span style=\"text-decoration:overline\">C</span></td><td>m<sub>0</sub></td><td>(A + B + C)</td><td>M<sub>0</sub></td></tr><tr><td>001</td><td><span style=\"text-decoration:overline\">A</span><span style=\"text-decoration:overline\">B</span>C</td><td>m<sub>1</sub></td><td>(A + B + <span style=\"text-decoration:overline\">C</span>)</td><td>M<sub>1</sub></td></tr><tr><td>010</td><td><span style=\"text-decoration:overline\">A</span>B<span style=\"text-decoration:overline\">C</span></td><td>m<sub>2</sub></td><td>(A + <span style=\"text-decoration:overline\">B</span> + C)</td><td>M<sub>2</sub></td></tr><tr><td>011</td><td><span style=\"text-decoration:overline\">A</span>BC</td><td>m<sub>3</sub></td><td>(A + <span style=\"text-decoration:overline\">B</span> + <span style=\"text-decoration:overline\">C</span>)</td><td>M<sub>3</sub></td></tr><tr><td>100</td><td>A<span style=\"text-decoration:overline\">B</span><span style=\"text-decoration:overline\">C</span></td><td>m<sub>4</sub></td><td>(<span style=\"text-decoration:overline\">A</span> + B + C)</td><td>M<sub>4</sub></td></tr><tr><td>101</td><td>A<span style=\"text-decoration:overline\">B</span>C</td><td>m<sub>5</sub></td><td>(<span style=\"text-decoration:overline\">A</span> + B + <span style=\"text-decoration:overline\">C</span>)</td><td>M<sub>5</sub></td></tr><tr><td>110</td><td>AB<span style=\"text-decoration:overline\">C</span></td><td>m<sub>6</sub></td><td>(<span style=\"text-decoration:overline\">A</span> + <span style=\"text-decoration:overline\">B</span> + C)</td><td>M<sub>6</sub></td></tr><tr><td>111</td><td>ABC</td><td>m<sub>7</sub></td><td>(<span style=\"text-decoration:overline\">A</span> + <span style=\"text-decoration:overline\">B</span> + <span style=\"text-decoration:overline\">C</span>)</td><td>M<sub>7</sub></td></tr></table>\n<h4>Canonical (standard) સ્વરૂપ</h4>\n<ul>\n<li><b>Canonical SOP</b> = જ્યાં Y = 1 હોય તે minterms નો સરવાળો: Y = Σm(…)</li>\n<li><b>Canonical POS</b> = જ્યાં Y = 0 હોય તે maxterms નો ગુણાકાર: Y = ΠM(…)</li>\n</ul>\n<p><i>ઉદાહરણ:</i> Y = 1 rows 1, 3, 6, 7 માટે હોય તો Y = Σm(1, 3, 6, 7) = ΠM(0, 2, 4, 5).</p>\n<p><b>કોઈ term ને canonical સ્વરૂપમાં વિસ્તારવા</b>, ખૂટતા variable X માટે (X + <span style=\"text-decoration:overline\">X</span>) = 1 વડે ગુણો. દા.ત. A = A(B + <span style=\"text-decoration:overline\">B</span>) = AB + A<span style=\"text-decoration:overline\">B</span>.</p>"}, "diagram": "de2_sop_pos", "examples": ["de2n11"], "key": true}, {"h": {"en": "2.4.4 Complement and Dual of a Function", "gu": "2.4.4 Function નો Complement અને Dual"}, "body": {"en": "<h4>Complement of a function</h4>\n<p>The complement <span style=\"text-decoration:overline\">Y</span> is 1 where Y is 0. It is found using <b>De Morgan's theorem</b>: interchange + and ·, interchange 0 and 1, and <b>complement every variable</b>.</p>\n<p><i>Example:</i> Y = A<span style=\"text-decoration:overline\">B</span> + C → <span style=\"text-decoration:overline\">Y</span> = (<span style=\"text-decoration:overline\">A</span> + B)·<span style=\"text-decoration:overline\">C</span></p>\n<h4>Dual of a function</h4>\n<p>Interchange + and ·, interchange 0 and 1, but <b>do not complement the variables</b>.</p>\n<p><i>Example:</i> Y = A<span style=\"text-decoration:overline\">B</span> + C → dual = (A + <span style=\"text-decoration:overline\">B</span>)·C</p>\n<table><tr><th>Step</th><th>Complement</th><th>Dual</th></tr>\n<tr><td>+ ↔ ·</td><td>Yes</td><td>Yes</td></tr><tr><td>0 ↔ 1</td><td>Yes</td><td>Yes</td></tr>\n<tr><td>Complement variables</td><td>Yes</td><td>No</td></tr></table>\n<p><b>Tip:</b> keep the original grouping by adding brackets before changing the operators: AB + C → (A + B)·C, not A + B·C.</p>", "gu": "<h4>Function નો complement</h4>\n<p>Complement <span style=\"text-decoration:overline\">Y</span> ત્યાં 1 હોય જ્યાં Y = 0 હોય. તે <b>De Morgan's theorem</b> વડે મળે: + અને · ની અદલાબદલી, 0 અને 1 ની અદલાબદલી, અને <b>દરેક variable નો complement</b>.</p>\n<p><i>ઉદાહરણ:</i> Y = A<span style=\"text-decoration:overline\">B</span> + C → <span style=\"text-decoration:overline\">Y</span> = (<span style=\"text-decoration:overline\">A</span> + B)·<span style=\"text-decoration:overline\">C</span></p>\n<h4>Function નો dual</h4>\n<p>+ અને · ની અદલાબદલી, 0 અને 1 ની અદલાબદલી, પરંતુ <b>variables નો complement લેવો નહીં</b>.</p>\n<p><i>ઉદાહરણ:</i> Y = A<span style=\"text-decoration:overline\">B</span> + C → dual = (A + <span style=\"text-decoration:overline\">B</span>)·C</p>\n<table><tr><th>Step</th><th>Complement</th><th>Dual</th></tr>\n<tr><td>+ ↔ ·</td><td>હા</td><td>હા</td></tr><tr><td>0 ↔ 1</td><td>હા</td><td>હા</td></tr>\n<tr><td>Variables નો complement</td><td>હા</td><td>ના</td></tr></table>\n<p><b>Tip:</b> operators બદલતાં પહેલાં brackets ઉમેરી મૂળ grouping જાળવો: AB + C → (A + B)·C, A + B·C નહીં.</p>"}, "examples": ["de2n12"]}]}], "numericals": [{"id": "de2n1", "q": {"en": "Simplify: Y = AB + A<span style=\"text-decoration:overline\">B</span>", "gu": "Simplify કરો: Y = AB + A<span style=\"text-decoration:overline\">B</span>"}, "a": {"en": "<table><tr><th>Step</th><th>Law used</th></tr><tr><td>Y = AB + A<span style=\"text-decoration:overline\">B</span></td><td>Given</td></tr><tr><td>= A(B + <span style=\"text-decoration:overline\">B</span>)</td><td>Distributive</td></tr><tr><td>= A·1</td><td>Complement: B + !B = 1</td></tr><tr><td>= A</td><td>Identity</td></tr></table><p><b>Answer: Y = A</b></p><p><i>Verified: both expressions give the same truth table.</i></p>", "gu": "<table><tr><th>Step</th><th>વપરાયેલ નિયમ</th></tr><tr><td>Y = AB + A<span style=\"text-decoration:overline\">B</span></td><td>આપેલ</td></tr><tr><td>= A(B + <span style=\"text-decoration:overline\">B</span>)</td><td>Distributive</td></tr><tr><td>= A·1</td><td>Complement: B + !B = 1</td></tr><tr><td>= A</td><td>Identity</td></tr></table><p><b>જવાબ: Y = A</b></p><p><i>ચકાસણી: બંને expressions નું truth table સરખું છે.</i></p>"}}, {"id": "de2n2", "q": {"en": "Simplify: Y = A + AB + A<span style=\"text-decoration:overline\">C</span>", "gu": "Simplify કરો: Y = A + AB + A<span style=\"text-decoration:overline\">C</span>"}, "a": {"en": "<table><tr><th>Step</th><th>Law used</th></tr><tr><td>Y = A + AB + A<span style=\"text-decoration:overline\">C</span></td><td>Given</td></tr><tr><td>= A(1 + B + <span style=\"text-decoration:overline\">C</span>)</td><td>Distributive (common A)</td></tr><tr><td>= A·1</td><td>Null: 1 + X = 1</td></tr><tr><td>= A</td><td>Identity</td></tr></table><p><b>Answer: Y = A</b></p><p><i>Verified: both expressions give the same truth table.</i></p>", "gu": "<table><tr><th>Step</th><th>વપરાયેલ નિયમ</th></tr><tr><td>Y = A + AB + A<span style=\"text-decoration:overline\">C</span></td><td>આપેલ</td></tr><tr><td>= A(1 + B + <span style=\"text-decoration:overline\">C</span>)</td><td>Distributive (common A)</td></tr><tr><td>= A·1</td><td>Null: 1 + X = 1</td></tr><tr><td>= A</td><td>Identity</td></tr></table><p><b>જવાબ: Y = A</b></p><p><i>ચકાસણી: બંને expressions નું truth table સરખું છે.</i></p>"}}, {"id": "de2n3", "q": {"en": "Simplify: Y = <span style=\"text-decoration:overline\">A</span>B + A<span style=\"text-decoration:overline\">B</span> + AB", "gu": "Simplify કરો: Y = <span style=\"text-decoration:overline\">A</span>B + A<span style=\"text-decoration:overline\">B</span> + AB"}, "a": {"en": "<table><tr><th>Step</th><th>Law used</th></tr><tr><td>Y = <span style=\"text-decoration:overline\">A</span>B + A<span style=\"text-decoration:overline\">B</span> + AB</td><td>Given</td></tr><tr><td>= <span style=\"text-decoration:overline\">A</span>B + A(<span style=\"text-decoration:overline\">B</span> + B)</td><td>Distributive</td></tr><tr><td>= <span style=\"text-decoration:overline\">A</span>B + A</td><td>Complement, identity</td></tr><tr><td>= A + <span style=\"text-decoration:overline\">A</span>B</td><td>Commutative</td></tr><tr><td>= A + B</td><td>Absorption: A + !AB = A + B</td></tr></table><p><b>Answer: Y = A + B</b></p><p><i>Verified: both expressions give the same truth table.</i></p>", "gu": "<table><tr><th>Step</th><th>વપરાયેલ નિયમ</th></tr><tr><td>Y = <span style=\"text-decoration:overline\">A</span>B + A<span style=\"text-decoration:overline\">B</span> + AB</td><td>આપેલ</td></tr><tr><td>= <span style=\"text-decoration:overline\">A</span>B + A(<span style=\"text-decoration:overline\">B</span> + B)</td><td>Distributive</td></tr><tr><td>= <span style=\"text-decoration:overline\">A</span>B + A</td><td>Complement, identity</td></tr><tr><td>= A + <span style=\"text-decoration:overline\">A</span>B</td><td>Commutative</td></tr><tr><td>= A + B</td><td>Absorption: A + !AB = A + B</td></tr></table><p><b>જવાબ: Y = A + B</b></p><p><i>ચકાસણી: બંને expressions નું truth table સરખું છે.</i></p>"}}, {"id": "de2n4", "q": {"en": "Simplify: Y = (A + B)(A + C)", "gu": "Simplify કરો: Y = (A + B)(A + C)"}, "a": {"en": "<table><tr><th>Step</th><th>Law used</th></tr><tr><td>Y = (A + B)(A + C)</td><td>Given</td></tr><tr><td>= AA + AC + AB + BC</td><td>Distributive (multiply out)</td></tr><tr><td>= A + AC + AB + BC</td><td>Idempotent: AA = A</td></tr><tr><td>= A(1 + C + B) + BC</td><td>Distributive (common A)</td></tr><tr><td>= A + BC</td><td>Null, identity</td></tr></table><p><b>Answer: Y = A + BC</b></p><p><i>Verified: both expressions give the same truth table.</i></p>", "gu": "<table><tr><th>Step</th><th>વપરાયેલ નિયમ</th></tr><tr><td>Y = (A + B)(A + C)</td><td>આપેલ</td></tr><tr><td>= AA + AC + AB + BC</td><td>Distributive (ગુણાકાર)</td></tr><tr><td>= A + AC + AB + BC</td><td>Idempotent: AA = A</td></tr><tr><td>= A(1 + C + B) + BC</td><td>Distributive (common A)</td></tr><tr><td>= A + BC</td><td>Null, identity</td></tr></table><p><b>જવાબ: Y = A + BC</b></p><p><i>ચકાસણી: બંને expressions નું truth table સરખું છે.</i></p>"}}, {"id": "de2n5", "q": {"en": "Simplify: Y = AB + <span style=\"text-decoration:overline\">A</span>C + BC", "gu": "Simplify કરો: Y = AB + <span style=\"text-decoration:overline\">A</span>C + BC"}, "a": {"en": "<table><tr><th>Step</th><th>Law used</th></tr><tr><td>Y = AB + <span style=\"text-decoration:overline\">A</span>C + BC</td><td>Given</td></tr><tr><td>= AB + <span style=\"text-decoration:overline\">A</span>C + BC(A + <span style=\"text-decoration:overline\">A</span>)</td><td>Complement: A + !A = 1</td></tr><tr><td>= AB + <span style=\"text-decoration:overline\">A</span>C + ABC + <span style=\"text-decoration:overline\">A</span>BC</td><td>Distributive</td></tr><tr><td>= AB(1 + C) + <span style=\"text-decoration:overline\">A</span>C(1 + B)</td><td>Grouping</td></tr><tr><td>= AB + <span style=\"text-decoration:overline\">A</span>C</td><td>Null, identity</td></tr></table><p><b>Answer: Y = AB + <span style=\"text-decoration:overline\">A</span>C</b></p><p><i>Verified: both expressions give the same truth table.</i></p>", "gu": "<table><tr><th>Step</th><th>વપરાયેલ નિયમ</th></tr><tr><td>Y = AB + <span style=\"text-decoration:overline\">A</span>C + BC</td><td>આપેલ</td></tr><tr><td>= AB + <span style=\"text-decoration:overline\">A</span>C + BC(A + <span style=\"text-decoration:overline\">A</span>)</td><td>Complement: A + !A = 1</td></tr><tr><td>= AB + <span style=\"text-decoration:overline\">A</span>C + ABC + <span style=\"text-decoration:overline\">A</span>BC</td><td>Distributive</td></tr><tr><td>= AB(1 + C) + <span style=\"text-decoration:overline\">A</span>C(1 + B)</td><td>Grouping</td></tr><tr><td>= AB + <span style=\"text-decoration:overline\">A</span>C</td><td>Null, identity</td></tr></table><p><b>જવાબ: Y = AB + <span style=\"text-decoration:overline\">A</span>C</b></p><p><i>ચકાસણી: બંને expressions નું truth table સરખું છે.</i></p>"}}, {"id": "de2n6", "q": {"en": "Simplify: Y = <span style=\"text-decoration:overline\">A</span><span style=\"text-decoration:overline\">B</span>C + <span style=\"text-decoration:overline\">A</span>BC + A<span style=\"text-decoration:overline\">B</span>C + ABC", "gu": "Simplify કરો: Y = <span style=\"text-decoration:overline\">A</span><span style=\"text-decoration:overline\">B</span>C + <span style=\"text-decoration:overline\">A</span>BC + A<span style=\"text-decoration:overline\">B</span>C + ABC"}, "a": {"en": "<table><tr><th>Step</th><th>Law used</th></tr><tr><td>Y = <span style=\"text-decoration:overline\">A</span><span style=\"text-decoration:overline\">B</span>C + <span style=\"text-decoration:overline\">A</span>BC + A<span style=\"text-decoration:overline\">B</span>C + ABC</td><td>Given</td></tr><tr><td>= <span style=\"text-decoration:overline\">A</span>C(<span style=\"text-decoration:overline\">B</span> + B) + AC(<span style=\"text-decoration:overline\">B</span> + B)</td><td>Distributive</td></tr><tr><td>= <span style=\"text-decoration:overline\">A</span>C + AC</td><td>Complement, identity</td></tr><tr><td>= C(<span style=\"text-decoration:overline\">A</span> + A)</td><td>Distributive</td></tr><tr><td>= C</td><td>Complement, identity</td></tr></table><p><b>Answer: Y = C</b></p><p><i>Verified: both expressions give the same truth table.</i></p>", "gu": "<table><tr><th>Step</th><th>વપરાયેલ નિયમ</th></tr><tr><td>Y = <span style=\"text-decoration:overline\">A</span><span style=\"text-decoration:overline\">B</span>C + <span style=\"text-decoration:overline\">A</span>BC + A<span style=\"text-decoration:overline\">B</span>C + ABC</td><td>આપેલ</td></tr><tr><td>= <span style=\"text-decoration:overline\">A</span>C(<span style=\"text-decoration:overline\">B</span> + B) + AC(<span style=\"text-decoration:overline\">B</span> + B)</td><td>Distributive</td></tr><tr><td>= <span style=\"text-decoration:overline\">A</span>C + AC</td><td>Complement, identity</td></tr><tr><td>= C(<span style=\"text-decoration:overline\">A</span> + A)</td><td>Distributive</td></tr><tr><td>= C</td><td>Complement, identity</td></tr></table><p><b>જવાબ: Y = C</b></p><p><i>ચકાસણી: બંને expressions નું truth table સરખું છે.</i></p>"}}, {"id": "de2n7", "q": {"en": "Simplify: Y = <span style=\"text-decoration:overline\">AB + C</span>", "gu": "Simplify કરો: Y = <span style=\"text-decoration:overline\">AB + C</span>"}, "a": {"en": "<table><tr><th>Step</th><th>Law used</th></tr><tr><td>Y = <span style=\"text-decoration:overline\">AB + C</span></td><td>Given</td></tr><tr><td>= <span style=\"text-decoration:overline\">AB</span>·<span style=\"text-decoration:overline\">C</span></td><td>De Morgan: !(X+Y) = !X·!Y</td></tr><tr><td>= (<span style=\"text-decoration:overline\">A</span> + <span style=\"text-decoration:overline\">B</span>)·<span style=\"text-decoration:overline\">C</span></td><td>De Morgan: !(XY) = !X + !Y</td></tr><tr><td>= <span style=\"text-decoration:overline\">A</span><span style=\"text-decoration:overline\">C</span> + <span style=\"text-decoration:overline\">B</span><span style=\"text-decoration:overline\">C</span></td><td>Distributive</td></tr></table><p><b>Answer: Y = <span style=\"text-decoration:overline\">A</span><span style=\"text-decoration:overline\">C</span> + <span style=\"text-decoration:overline\">B</span><span style=\"text-decoration:overline\">C</span></b></p><p><i>Verified: both expressions give the same truth table.</i></p>", "gu": "<table><tr><th>Step</th><th>વપરાયેલ નિયમ</th></tr><tr><td>Y = <span style=\"text-decoration:overline\">AB + C</span></td><td>આપેલ</td></tr><tr><td>= <span style=\"text-decoration:overline\">AB</span>·<span style=\"text-decoration:overline\">C</span></td><td>De Morgan: !(X+Y) = !X·!Y</td></tr><tr><td>= (<span style=\"text-decoration:overline\">A</span> + <span style=\"text-decoration:overline\">B</span>)·<span style=\"text-decoration:overline\">C</span></td><td>De Morgan: !(XY) = !X + !Y</td></tr><tr><td>= <span style=\"text-decoration:overline\">A</span><span style=\"text-decoration:overline\">C</span> + <span style=\"text-decoration:overline\">B</span><span style=\"text-decoration:overline\">C</span></td><td>Distributive</td></tr></table><p><b>જવાબ: Y = <span style=\"text-decoration:overline\">A</span><span style=\"text-decoration:overline\">C</span> + <span style=\"text-decoration:overline\">B</span><span style=\"text-decoration:overline\">C</span></b></p><p><i>ચકાસણી: બંને expressions નું truth table સરખું છે.</i></p>"}}, {"id": "de2n8", "q": {"en": "Simplify: Y = <span style=\"text-decoration:overline\">A+B + AB</span>", "gu": "Simplify કરો: Y = <span style=\"text-decoration:overline\">A+B + AB</span>"}, "a": {"en": "<table><tr><th>Step</th><th>Law used</th></tr><tr><td>Y = <span style=\"text-decoration:overline\">A+B + AB</span></td><td>Given</td></tr><tr><td>= <span style=\"text-decoration:overline\">A+B</span>·<span style=\"text-decoration:overline\">AB</span></td><td>De Morgan</td></tr><tr><td>= (A + B)·(A + <span style=\"text-decoration:overline\">B</span>)</td><td>Involution; De Morgan</td></tr><tr><td>= A + B<span style=\"text-decoration:overline\">B</span></td><td>Distributive: (A+B)(A+C) = A + BC</td></tr><tr><td>= A + 0</td><td>Complement: B!B = 0</td></tr><tr><td>= A</td><td>Identity</td></tr></table><p><b>Answer: Y = A</b></p><p><i>Verified: both expressions give the same truth table.</i></p>", "gu": "<table><tr><th>Step</th><th>વપરાયેલ નિયમ</th></tr><tr><td>Y = <span style=\"text-decoration:overline\">A+B + AB</span></td><td>આપેલ</td></tr><tr><td>= <span style=\"text-decoration:overline\">A+B</span>·<span style=\"text-decoration:overline\">AB</span></td><td>De Morgan</td></tr><tr><td>= (A + B)·(A + <span style=\"text-decoration:overline\">B</span>)</td><td>Involution; De Morgan</td></tr><tr><td>= A + B<span style=\"text-decoration:overline\">B</span></td><td>Distributive: (A+B)(A+C) = A + BC</td></tr><tr><td>= A + 0</td><td>Complement: B!B = 0</td></tr><tr><td>= A</td><td>Identity</td></tr></table><p><b>જવાબ: Y = A</b></p><p><i>ચકાસણી: બંને expressions નું truth table સરખું છે.</i></p>"}}, {"id": "de2n9", "q": {"en": "Prepare the truth table of Y = AB + BC + CA and draw its logic diagram. What does the circuit do?", "gu": "Y = AB + BC + CA નું truth table બનાવો અને logic diagram દોરો. Circuit શું કાર્ય કરે છે?"}, "a": {"en": "<table><tr><th>A</th><th>B</th><th>C</th><th>AB</th><th>BC</th><th>CA</th><th>Y</th></tr><tr><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td><b>0</b></td></tr><tr><td>0</td><td>0</td><td>1</td><td>0</td><td>0</td><td>0</td><td><b>0</b></td></tr><tr><td>0</td><td>1</td><td>0</td><td>0</td><td>0</td><td>0</td><td><b>0</b></td></tr><tr><td>0</td><td>1</td><td>1</td><td>0</td><td>1</td><td>0</td><td><b>1</b></td></tr><tr><td>1</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td><b>0</b></td></tr><tr><td>1</td><td>0</td><td>1</td><td>0</td><td>0</td><td>1</td><td><b>1</b></td></tr><tr><td>1</td><td>1</td><td>0</td><td>1</td><td>0</td><td>0</td><td><b>1</b></td></tr><tr><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td><td><b>1</b></td></tr></table><p>Y = 1 for minterms 3, 5, 6, 7 → Y = Σm(3, 5, 6, 7).</p><p><b>Logic diagram:</b> three 2-input AND gates (AB, BC, CA) whose outputs go to one 3-input OR gate.</p><p>The output is 1 when <b>two or more inputs are 1</b>; it is a <b>majority circuit</b> (also the carry output of a full adder).</p>", "gu": "<table><tr><th>A</th><th>B</th><th>C</th><th>AB</th><th>BC</th><th>CA</th><th>Y</th></tr><tr><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td><b>0</b></td></tr><tr><td>0</td><td>0</td><td>1</td><td>0</td><td>0</td><td>0</td><td><b>0</b></td></tr><tr><td>0</td><td>1</td><td>0</td><td>0</td><td>0</td><td>0</td><td><b>0</b></td></tr><tr><td>0</td><td>1</td><td>1</td><td>0</td><td>1</td><td>0</td><td><b>1</b></td></tr><tr><td>1</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td><b>0</b></td></tr><tr><td>1</td><td>0</td><td>1</td><td>0</td><td>0</td><td>1</td><td><b>1</b></td></tr><tr><td>1</td><td>1</td><td>0</td><td>1</td><td>0</td><td>0</td><td><b>1</b></td></tr><tr><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td><td><b>1</b></td></tr></table><p>Y = 1 minterms 3, 5, 6, 7 માટે → Y = Σm(3, 5, 6, 7).</p><p><b>Logic diagram:</b> ત્રણ 2-input AND gates (AB, BC, CA) જેના outputs એક 3-input OR gate માં જાય છે.</p><p><b>બે કે વધુ inputs 1</b> હોય ત્યારે output 1 થાય છે; આ <b>majority circuit</b> છે (full adder નું carry output પણ).</p>"}}, {"id": "de2n10", "q": {"en": "Prove that A⊕B = (A + B)(<span style=\"text-decoration:overline\">A</span> + <span style=\"text-decoration:overline\">B</span>).", "gu": "સાબિત કરો કે A⊕B = (A + B)(<span style=\"text-decoration:overline\">A</span> + <span style=\"text-decoration:overline\">B</span>)."}, "a": {"en": "<p>RHS = (A + B)(<span style=\"text-decoration:overline\">A</span> + <span style=\"text-decoration:overline\">B</span>)</p><p>= A<span style=\"text-decoration:overline\">A</span> + A<span style=\"text-decoration:overline\">B</span> + B<span style=\"text-decoration:overline\">A</span> + B<span style=\"text-decoration:overline\">B</span> &nbsp; [distributive]</p><p>= 0 + A<span style=\"text-decoration:overline\">B</span> + <span style=\"text-decoration:overline\">A</span>B + 0 &nbsp; [A<span style=\"text-decoration:overline\">A</span> = 0]</p><p>= A<span style=\"text-decoration:overline\">B</span> + <span style=\"text-decoration:overline\">A</span>B = A⊕B = LHS ✓</p><p>Also, (A + B)(<span style=\"text-decoration:overline\">A</span> + <span style=\"text-decoration:overline\">B</span>) = (A + B)·<span style=\"text-decoration:overline\">AB</span> by De Morgan: output is 1 when at least one input is 1 but not both.</p>", "gu": "<p>RHS = (A + B)(<span style=\"text-decoration:overline\">A</span> + <span style=\"text-decoration:overline\">B</span>)</p><p>= A<span style=\"text-decoration:overline\">A</span> + A<span style=\"text-decoration:overline\">B</span> + B<span style=\"text-decoration:overline\">A</span> + B<span style=\"text-decoration:overline\">B</span> &nbsp; [distributive]</p><p>= 0 + A<span style=\"text-decoration:overline\">B</span> + <span style=\"text-decoration:overline\">A</span>B + 0 &nbsp; [A<span style=\"text-decoration:overline\">A</span> = 0]</p><p>= A<span style=\"text-decoration:overline\">B</span> + <span style=\"text-decoration:overline\">A</span>B = A⊕B = LHS ✓</p><p>વળી, De Morgan મુજબ (A + B)(<span style=\"text-decoration:overline\">A</span> + <span style=\"text-decoration:overline\">B</span>) = (A + B)·<span style=\"text-decoration:overline\">AB</span>: ઓછામાં ઓછો એક input 1 હોય પણ બંને નહીં ત્યારે output 1.</p>"}}, {"id": "de2n11", "q": {"en": "Express Y = A + <span style=\"text-decoration:overline\">B</span>C in canonical SOP and canonical POS form.", "gu": "Y = A + <span style=\"text-decoration:overline\">B</span>C ને canonical SOP અને canonical POS સ્વરૂપમાં દર્શાવો."}, "a": {"en": "<p>Expand each term with the missing variables:</p><p>A = A(B + <span style=\"text-decoration:overline\">B</span>)(C + <span style=\"text-decoration:overline\">C</span>) = ABC + AB<span style=\"text-decoration:overline\">C</span> + A<span style=\"text-decoration:overline\">B</span>C + A<span style=\"text-decoration:overline\">B</span><span style=\"text-decoration:overline\">C</span> → m7, m6, m5, m4</p><p><span style=\"text-decoration:overline\">B</span>C = <span style=\"text-decoration:overline\">B</span>C(A + <span style=\"text-decoration:overline\">A</span>) = A<span style=\"text-decoration:overline\">B</span>C + <span style=\"text-decoration:overline\">A</span><span style=\"text-decoration:overline\">B</span>C → m5, m1</p><p>Truth table:</p><table><tr><th>A</th><th>B</th><th>C</th><th>Y</th></tr><tr><td>0</td><td>0</td><td>0</td><td><b>0</b></td></tr><tr><td>0</td><td>0</td><td>1</td><td><b>1</b></td></tr><tr><td>0</td><td>1</td><td>0</td><td><b>0</b></td></tr><tr><td>0</td><td>1</td><td>1</td><td><b>0</b></td></tr><tr><td>1</td><td>0</td><td>0</td><td><b>1</b></td></tr><tr><td>1</td><td>0</td><td>1</td><td><b>1</b></td></tr><tr><td>1</td><td>1</td><td>0</td><td><b>1</b></td></tr><tr><td>1</td><td>1</td><td>1</td><td><b>1</b></td></tr></table><p><b>Canonical SOP:</b> Y = Σm(1, 4, 5, 6, 7) = <span style=\"text-decoration:overline\">A</span><span style=\"text-decoration:overline\">B</span>C + A<span style=\"text-decoration:overline\">B</span><span style=\"text-decoration:overline\">C</span> + A<span style=\"text-decoration:overline\">B</span>C + AB<span style=\"text-decoration:overline\">C</span> + ABC</p><p><b>Canonical POS:</b> Y = ΠM(0, 2, 3) = (A + B + C)(A + <span style=\"text-decoration:overline\">B</span> + C)(A + <span style=\"text-decoration:overline\">B</span> + <span style=\"text-decoration:overline\">C</span>)</p>", "gu": "<p>દરેક term ને ખૂટતા variables સાથે વિસ્તારો:</p><p>A = A(B + <span style=\"text-decoration:overline\">B</span>)(C + <span style=\"text-decoration:overline\">C</span>) = ABC + AB<span style=\"text-decoration:overline\">C</span> + A<span style=\"text-decoration:overline\">B</span>C + A<span style=\"text-decoration:overline\">B</span><span style=\"text-decoration:overline\">C</span> → m7, m6, m5, m4</p><p><span style=\"text-decoration:overline\">B</span>C = <span style=\"text-decoration:overline\">B</span>C(A + <span style=\"text-decoration:overline\">A</span>) = A<span style=\"text-decoration:overline\">B</span>C + <span style=\"text-decoration:overline\">A</span><span style=\"text-decoration:overline\">B</span>C → m5, m1</p><p>Truth table:</p><table><tr><th>A</th><th>B</th><th>C</th><th>Y</th></tr><tr><td>0</td><td>0</td><td>0</td><td><b>0</b></td></tr><tr><td>0</td><td>0</td><td>1</td><td><b>1</b></td></tr><tr><td>0</td><td>1</td><td>0</td><td><b>0</b></td></tr><tr><td>0</td><td>1</td><td>1</td><td><b>0</b></td></tr><tr><td>1</td><td>0</td><td>0</td><td><b>1</b></td></tr><tr><td>1</td><td>0</td><td>1</td><td><b>1</b></td></tr><tr><td>1</td><td>1</td><td>0</td><td><b>1</b></td></tr><tr><td>1</td><td>1</td><td>1</td><td><b>1</b></td></tr></table><p><b>Canonical SOP:</b> Y = Σm(1, 4, 5, 6, 7) = <span style=\"text-decoration:overline\">A</span><span style=\"text-decoration:overline\">B</span>C + A<span style=\"text-decoration:overline\">B</span><span style=\"text-decoration:overline\">C</span> + A<span style=\"text-decoration:overline\">B</span>C + AB<span style=\"text-decoration:overline\">C</span> + ABC</p><p><b>Canonical POS:</b> Y = ΠM(0, 2, 3) = (A + B + C)(A + <span style=\"text-decoration:overline\">B</span> + C)(A + <span style=\"text-decoration:overline\">B</span> + <span style=\"text-decoration:overline\">C</span>)</p>"}}, {"id": "de2n12", "q": {"en": "Find the complement and dual of (i) Y = A<span style=\"text-decoration:overline\">B</span> + <span style=\"text-decoration:overline\">A</span>C (ii) Y = (A + B)·C + 0.", "gu": "(i) Y = A<span style=\"text-decoration:overline\">B</span> + <span style=\"text-decoration:overline\">A</span>C (ii) Y = (A + B)·C + 0 નો complement અને dual શોધો."}, "a": {"en": "<p><b>(i) Y = A<span style=\"text-decoration:overline\">B</span> + <span style=\"text-decoration:overline\">A</span>C</b></p><p>Complement: <span style=\"text-decoration:overline\">Y</span> = (<span style=\"text-decoration:overline\">A</span> + B)(A + <span style=\"text-decoration:overline\">C</span>) &nbsp; (interchange + and ·, complement each variable)</p><p>Dual: (A + <span style=\"text-decoration:overline\">B</span>)(<span style=\"text-decoration:overline\">A</span> + C) &nbsp; (interchange + and · only)</p><p><b>(ii) Y = (A + B)·C + 0</b></p><p>Complement: <span style=\"text-decoration:overline\">Y</span> = (<span style=\"text-decoration:overline\">A</span>·<span style=\"text-decoration:overline\">B</span> + <span style=\"text-decoration:overline\">C</span>)·1 = <span style=\"text-decoration:overline\">A</span><span style=\"text-decoration:overline\">B</span> + <span style=\"text-decoration:overline\">C</span></p><p>Dual: (A·B + C)·1 = AB + C</p>", "gu": "<p><b>(i) Y = A<span style=\"text-decoration:overline\">B</span> + <span style=\"text-decoration:overline\">A</span>C</b></p><p>Complement: <span style=\"text-decoration:overline\">Y</span> = (<span style=\"text-decoration:overline\">A</span> + B)(A + <span style=\"text-decoration:overline\">C</span>) &nbsp; (+ અને · ની અદલાબદલી, દરેક variable નો complement)</p><p>Dual: (A + <span style=\"text-decoration:overline\">B</span>)(<span style=\"text-decoration:overline\">A</span> + C) &nbsp; (માત્ર + અને · ની અદલાબદલી)</p><p><b>(ii) Y = (A + B)·C + 0</b></p><p>Complement: <span sty
