.kw{color:#C792EA;font-weight:700}.ty{color:#82AAFF}.st{color:#C3E88D}.cm{color:#8E9AAF;font-style:italic}.pp{color:#F78C6C}.nu{color:#F9C46B}.fn{color:#FFCB6B}

<script>
const U = {"subject": "DI01000021", "unit": 4, "format": "notes", "title": {"en": "Coordinate Geometry"}, "hours": 8, "weightage": 20, "official": true, "languages": ["en"], "tabs": ["notes", "diagrams", "equations", "numericals", "viva", "exam"], "intro_text": {"en": "Unit 4 of Mathematics-I: the straight line - its slope and the four standard forms (slope-intercept, point-slope, two-point and intercept), the general form ax + by + c = 0, the conditions for two lines to be parallel or perpendicular and the angle between them; the distance of a point from a line and the distance between two parallel lines; then the circle - centre-radius form, general form, centre and radius from the coefficients, the tangent and normal at a point, and the length of a tangent drawn from an external point, following syllabus items 4.1 to 4.7. Twenty-six fully solved numericals."}, "notes": [{"title": {"en": "1. Straight Lines and Slope"}, "items": [{"h": {"en": "1.1 Slope and the two-point form"}, "body": {"en": "<h4>Definition</h4><p>The <b>slope</b> of a line is m = tan θ, where θ is the angle it makes with the positive x-axis. Between two points it is <b>m = (y₂ − y₁)/(x₂ − x₁)</b> - rise over run.</p><h4>Two-point form</h4><p>The line through (x₁, y₁) and (x₂, y₂) is <b>(y − y₁)(x₂ − x₁) = (y₂ − y₁)(x − x₁)</b>, which is just the slope formula written as an equation.</p><h4>Worked example</h4><p>Through (1, 2) and (3, 8): m = 6/2 = 3, so y − 2 = 3(x − 1), that is <b>3x − y − 1 = 0</b>. Check the second point: 9 − 8 − 1 = 0 ✓.</p><h4>Common mistake / conditions</h4><p>A vertical line has no finite slope (x₂ = x₁) and its equation is x = a. Never write y = mx + c for a vertical line - that form cannot represent it.</p>"}, "diagram": "cg1_slope", "examples": ["cg1n1", "cg1n2"], "syllabus_item": "4.1"}, {"h": {"en": "1.2 Slope-point and intercept forms"}, "body": {"en": "<h4>The four forms</h4><table><tr><th>Form</th><th>Equation</th><th>Use it when you know</th></tr><tr><td>Slope-intercept</td><td>y = mx + c</td><td>slope and y-intercept</td></tr><tr><td>Point-slope</td><td>y − y₁ = m(x − x₁)</td><td>one point and the slope</td></tr><tr><td>Two-point</td><td>(y − y₁)/(y₂ − y₁) = (x − x₁)/(x₂ − x₁)</td><td>two points</td></tr><tr><td>Intercept</td><td>x/a + y/b = 1</td><td>the intercepts a on x and b on y</td></tr></table><h4>Worked examples</h4><p>Through (−2, 3) with m = 1/2: y − 3 = ½(x + 2) → 2y − 6 = x + 2 → <b>x − 2y + 8 = 0</b>.</p><p>Intercepts 3 and −4: x/3 + y/(−4) = 1 → 4x − 3y = 12.</p><h4>Conditions</h4><p>The intercept form needs both intercepts non-zero. A line through the origin has no intercept form; use y = mx.</p>"}, "diagram": "cg2_forms", "examples": ["cg1n4", "cg1n5"], "syllabus_item": "4.2"}, {"h": {"en": "1.3 The general form and converting between forms"}, "body": {"en": "<h4>Definition</h4><p>Every line can be written <b>ax + by + c = 0</b> with a and b not both zero. From it, slope = −a/b and intercepts are −c/a (x) and −c/b (y).</p><h4>Worked example</h4><p>3x + 4y − 12 = 0 → y = −(3/4)x + 3 (slope −3/4, y-intercept 3) and x/4 + y/3 = 1 (intercepts 4 and 3). Both come from the same equation - choose the form the question asks for.</p><h4>Common mistake / conditions</h4><p>The slope is −a/b, not a/b. A quick check: for 3x + 4y = 12 the line falls as x grows, so the slope must be negative ✓.</p>"}, "examples": ["cg1n6"], "syllabus_item": "4.2"}]}, {"title": {"en": "2. Parallel and Perpendicular Lines"}, "items": [{"h": {"en": "2.1 The two slope conditions"}, "body": {"en": "<h4>Conditions</h4><p><b>Parallel:</b> m₁ = m₂. <b>Perpendicular:</b> m₁m₂ = −1, that is m₂ = −1/m₁.</p><h4>In general form</h4><p>For a₁x + b₁y + c₁ = 0 and a₂x + b₂y + c₂ = 0: parallel when a₁/a₂ = b₁/b₂, perpendicular when <b>a₁a₂ + b₁b₂ = 0</b>.</p><h4>Worked example</h4><p>3x + 4y = 7 and 6x + 8y = 15 are parallel (coefficient ratios 1/2 and 1/2, constants different). 3x + 4y = 7 and 4x − 3y = 2 are perpendicular because 3(4) + 4(−3) = 0.</p><h4>Why m₁m₂ = −1</h4><p>Rotating a line by 90° turns its rise into a run: a slope of p/q becomes −q/p. Their product is −pq/qp = −1. That is the whole proof, and it explains the sign change.</p>"}, "diagram": "cg3_parallel", "examples": ["cg1n3", "cg1n11", "cg1n12"], "syllabus_item": "4.3"}, {"h": {"en": "2.2 Lines parallel or perpendicular to a given line"}, "body": {"en": "<h4>The two-line trick</h4><p>To draw a line parallel to ax + by + c = 0 through a point, keep a and b and change only c. To draw a perpendicular, swap a and b and change the sign of one of them.</p><h4>Worked examples</h4><p>Parallel to 3x − 4y + 5 = 0 through (2, −3): the family is 3x − 4y + k = 0. Substituting gives 6 + 12 + k = 0, so k = −18 and the line is <b>3x − 4y − 18 = 0</b>.</p><p>Perpendicular to 2x + 3y = 6 through (1, 2): the family is 3x − 2y + k = 0, and 3 − 4 + k = 0 gives k = 1, so <b>3x − 2y + 1 = 0</b>.</p><h4>Common mistake / conditions</h4><p>Substituting the point into the <i>family</i>, not into the original line, is what finds k. Writing the original constant again gives a parallel line that misses the point.</p>"}, "diagram": "cg3_parallel", "examples": ["cg1n7", "cg1n8", "cg1n24"], "syllabus_item": "4.3"}]}, {"title": {"en": "3. Angle between Two Lines and Distances"}, "items": [{"h": {"en": "3.1 The angle formula"}, "body": {"en": "<h4>Formula</h4><p><b>tan θ = |(m₁ − m₂)/(1 + m₁m₂)|</b>, the acute angle between two lines of slopes m₁ and m₂.</p><h4>Procedure</h4><ol><li>Write both lines in slope form and read m₁, m₂.</li><li>Substitute into the formula; the modulus makes θ acute.</li><li>If the question wants the obtuse angle, subtract from 180°.</li></ol><h4>Worked example</h4><p>y = 2x + 1 and y = −x + 3: tan θ = |(2 + 1)/(1 − 2)| = 3, so θ = tan⁻¹3 ≈ <b>71.57°</b>.</p><h4>Special cases</h4><p>If 1 + m₁m₂ = 0 the denominator vanishes and θ = 90° - the perpendicular condition. If m₁ = m₂ the numerator vanishes and θ = 0°: the lines are parallel.</p>"}, "diagram": "cg4_angle", "examples": ["cg1n9", "cg1n10"], "syllabus_item": "4.4"}, {"h": {"en": "3.2 Distance from a point to a line, and between parallel lines"}, "body": {"en": "<h4>Formulae</h4><p><b>Point to line:</b> d = |ax₁ + by₁ + c| / √(a² + b²) for the point (x₁, y₁) and the line ax + by + c = 0.</p><p><b>Between parallel lines</b> ax + by + c₁ = 0 and ax + by + c₂ = 0: d = |c₁ − c₂| / √(a² + b²).</p><h4>Worked examples</h4><p>(2, 3) to 3x + 4y − 5 = 0: |6 + 12 − 5|/√25 = 13/5 = <b>2.6 units</b>. The lines 3x + 4y = 5 and 3x + 4y = 15 are |5 − 15|/5 = <b>2 units</b> apart.</p><h4>Conditions</h4><p>Both lines must be in the same form before comparing constants. The distance is never negative - the modulus is part of the formula.</p>"}, "examples": ["cg1n22", "cg1n23"], "syllabus_item": "4.4"}]}, {"title": {"en": "4. The Circle"}, "items": [{"h": {"en": "4.1 Centre-radius form"}, "body": {"en": "<h4>Definition</h4><p>A circle is the set of points at a fixed distance r from a fixed point (h, k). Its equation is</p><p><b>(x − h)² + (y − k)² = r²</b>.</p><h4>From the definition</h4><p>For any point P(x, y) on the circle, the distance CP equals r. Squaring the distance formula √((x − h)² + (y − k)²) = r gives the equation - no memorising needed.</p><h4>Worked example</h4><p>Centre (2, −3), radius 5: (x − 2)² + (y + 3)² = 25, which expands to x² + y² − 4x + 6y − 12 = 0.</p><h4>Conditions</h4><p>Watch the signs: centre (2, −3) gives (y + 3)², not (y − 3)². The right side is r², so a radius of 5 puts 25 there.</p>"}, "diagram": "cg5_circle", "examples": ["cg1n13", "cg1n15"], "syllabus_item": "4.5"}, {"h": {"en": "4.2 The general equation and how to read it"}, "body": {"en": "<h4>Definition</h4><p>The general circle is <b>x² + y² + 2gx + 2fy + c = 0</b>, with <b>centre (−g, −f)</b> and <b>radius √(g² + f² − c)</b>.</p><h4>Where it comes from</h4><p>Expand (x − h)² + (y − k)² = r²: x² + y² − 2hx − 2ky + h² + k² − r² = 0. Comparing with the general form gives g = −h, f = −k and c = h² + k² − r², hence the radius formula.</p><h4>Worked example</h4><p>x² + y² − 6x + 8y − 11 = 0: g = −3, f = 4, c = −11, so centre (3, −4) and radius √(9 + 16 + 11) = <b>6</b>.</p><h4>Conditions</h4><p>The coefficients of x² and y² must both be 1 before reading g and f; divide through if they are not. If g² + f² − c &lt; 0 the equation has no real circle.</p>"}, "diagram": "cg6_general", "examples": ["cg1n14", "cg1n25"], "syllabus_item": "4.6"}, {"h": {"en": "4.3 Circle from a diameter or three conditions"}, "body": {"en": "<h4>Diameter form</h4><p>If (x₁, y₁) and (x₂, y₂) are the ends of a diameter, the circle is <b>(x − x₁)(x − x₂) + (y − y₁)(y − y₂) = 0</b>, because the angle in a semicircle is 90°.</p><h4>Worked example</h4><p>Diameter ends (1, 2) and (5, 8): centre (3, 5) and radius ½√(16 + 36) = √13, so (x − 3)² + (y − 5)² = 13. The diameter form gives the same circle.</p><h4>Three points</h4><p>A circle through three points needs all three in the general equation, which gives three linear equations in g, f, c. Through the origin c = 0 immediately, which is why exam questions like to pass circles through (0, 0).</p>"}, "examples": ["cg1n15", "cg1n25", "cg1n16"], "syllabus_item": "4.5"}]}, {"title": {"en": "5. Tangent and Normal to a Circle"}, "items": [{"h": {"en": "5.1 Tangent at a point on the circle"}, "body": {"en": "<h4>Definition</h4><p>A <b>tangent</b> touches the circle at exactly one point. At the point of contact it is perpendicular to the radius, so its slope is the negative reciprocal of the radius slope.</p><h4>Formula for x² + y² = a²</h4><p>The tangent at (x₁, y₁) on the circle is <b>xx₁ + yy₁ = a²</b> - replace x² by xx₁ and y² by yy₁. For a general circle, use the point-slope form with the perpendicular slope.</p><h4>Worked example</h4><p>At (3, 4) on x² + y² = 25: the tangent is 3x + 4y = 25. Its slope is −3/4 while the radius slope is 4/3, and (4/3)(−3/4) = −1 ✓.</p><h4>Common mistake / conditions</h4><p>The formula needs the point to lie on the circle: check 3² + 4² = 25 first. Using an external point with this formula gives the chord of contact, not the tangent.</p>"}, "diagram": "cg7_tangent", "examples": ["cg1n17", "cg1n18"], "syllabus_item": "4.7"}, {"h": {"en": "5.2 Tangents of a given slope, and the normal"}, "body": {"en": "<h4>Tangent with slope m</h4><p>For x² + y² = a² the tangents of slope m are <b>y = mx ± a√(1 + m²)</b>. The ± gives two parallel tangents, one on each side.</p><h4>Worked example</h4><p>Slope 3/4 to x² + y² = 25: c = ±5√(1 + 9/16) = ±25/4, so the tangents are y = (3/4)x ± 25/4, that is <b>3x − 4y ± 25 = 0</b>.</p><h4>Normal</h4><p>The normal at a point passes through the centre, so for x² + y² = a² it is simply the line joining the centre to that point: through (3, 4) it is <b>y = (4/3)x</b>, or 4x − 3y = 0.</p><h4>Length of a tangent from an external point</h4><p>From P(x₁, y₁) to x² + y² + 2gx + 2fy + c = 0 the length is √(x₁² + y₁² + 2gx₁ + 2fy₁ + c). From (5, 1) to x² + y² = 25 it is √(26 − 25) = 1.</p>"}, "diagram": "cg7_tangent", "examples": ["cg1n19", "cg1n20", "cg1n21"], "syllabus_item": "4.7"}, {"h": {"en": "5.3 Tangency condition: when a line just touches"}, "body": {"en": "<h4>The test</h4><p>A line touches a circle when the <b>perpendicular distance from the centre equals the radius</b>. That single condition replaces every \"show that the line is a tangent\" proof.</p><h4>Worked example</h4><p>Is y = 2x + c tangent to x² + y² = 25? The distance from (0, 0) to 2x − y + c = 0 is |c|/√5, so tangency requires |c|/√5 = 5, giving c = <b>±5√5</b>.</p><h4>Three cases</h4><table><tr><th>Distance from centre</th><th>Line meets the circle</th><th>Name</th></tr><tr><td>d < r</td><td>at two points</td><td>secant</td></tr><tr><td>d = r</td><td>at exactly one point</td><td>tangent</td></tr><tr><td>d > r</td><td>not at all</td><td>external line</td></tr></table><h4>Why this is the safest method</h4><p>Solving the line and circle simultaneously gives a quadratic; the discriminant then decides the case. Both routes are correct, but the distance test is shorter and has fewer sign traps.</p>"}, "diagram": "cg7_tangent", "examples": ["cg1n26"], "syllabus_item": "4.7"}]}, {"title": {"en": "6. Answered Practice (Unit 4 level, suggested marks)"}, "items": [{"h": {"en": "Practice 1. Find the slope and equation of the line through (0, 5) and (3, 11)."}, "body": {"en": "<h4>Working</h4><ol><li>m = (11 − 5)/(3 − 0) = 2</li><li>y − 5 = 2(x − 0)</li><li>y = 2x + 5</li></ol><h4>Answer</h4><p><b>Slope 2, equation 2x − y + 5 = 0.</b> Check both points: 0 − 5 + 5 = 0 ✓ and 6 − 11 + 5 = 0 ✓.</p>"}}, {"h": {"en": "Practice 2. Find the equation of the line with slope −3 passing through (2, 4)."}, "body": {"en": "<h4>Working</h4><ol><li>Start from y − y₁ = m(x − x₁) with m = −3 and (x₁, y₁) = (2, 4)</li><li>y − 4 = −3(x − 2)</li><li>y − 4 = −3x + 6</li><li>y = −3x + 10, that is 3x + y − 10 = 0</li></ol><h4>Answer</h4><p><b>3x + y − 10 = 0.</b> Check: 6 + 4 − 10 = 0 ✓, the y-intercept is 10 ✓, and the slope −a/b = −3 ✓. As a final form, a straight-line answer is safest with integer coefficients and a positive x-term.</p>"}}, {"h": {"en": "Practice 3. Find the equation of the line whose intercepts are −2 on x and 5 on y."}, "body": {"en": "<h4>Working</h4><ol><li>x/(−2) + y/5 = 1</li><li>Multiply by 10: −5x + 2y = 10</li><li>5x − 2y + 10 = 0</li></ol><h4>Answer</h4><p><b>5x − 2y + 10 = 0.</b> Check the intercepts: at y = 0, x = −2 ✓; at x = 0, y = 5 ✓.</p>"}}, {"h": {"en": "Practice 4. Show that the lines 5x − 2y + 3 = 0 and 10x − 4y − 7 = 0 are parallel."}, "body": {"en": "<h4>Working</h4><ol><li>For ax + by + c = 0 the slope is −a/b</li><li>First line: −5/(−2) = 5/2</li><li>Second line: −10/(−4) = 5/2</li><li>Ratio test: 5/10 = (−2)/(−4) = 1/2, but 3/(−7) ≠ 1/2</li></ol><h4>Answer</h4><p><b>Parallel and distinct.</b> Both have slope 5/2, and because the constant ratio differs the two lines never meet. Had all three ratios matched, they would be the same line rather than two parallel ones.</p>"}}, {"h": {"en": "Practice 5. Find the equation of the line through (3, −1) perpendicular to 4x − 3y + 7 = 0."}, "body": {"en": "<h4>Working</h4><ol><li>Perpendicular family: 3x + 4y + k = 0</li><li>3(3) + 4(−1) + k = 0</li><li>k = −5</li><li>3x + 4y − 5 = 0</li></ol><h4>Check</h4><p>a₁a₂ + b₁b₂ = 4(3) + (−3)(4) = 0 ✓ and the point satisfies the new line ✓.</p>"}}, {"h": {"en": "Practice 6. Find the acute angle between 2x − y + 3 = 0 and x + 3y − 2 = 0."}, "body": {"en": "<h4>Working</h4><ol><li>m₁ = 2 and m₂ = −1/3</li><li>tan θ = |(2 + 1/3)/(1 − 2/3)| = |(7/3)/(1/3)| = 7</li><li>θ = 81.87°</li></ol><h4>Answer</h4><p><b>θ ≈ 81.9°.</b> The coefficient test gives 2(1) + (−1)(3) = −1, close to zero, so the lines are nearly perpendicular ✓.</p>"}}, {"h": {"en": "Practice 7. Find the distance between the parallel lines 4x + 3y − 9 = 0 and 4x + 3y + 6 = 0."}, "body": {"en": "<h4>Working</h4><ol><li>|−9 − 6| = 15</li><li>√(16 + 9) = 5</li><li>d = 15/5 = 3</li></ol><h4>Answer</h4><p><b>3 units.</b> Check with a point: (0, 3) lies on the first line and its distance from the second is |0 + 9 + 6|/5 = 3 ✓.</p>"}}, {"h": {"en": "Practice 8. Find the centre and radius of x² + y² + 4x − 6y − 12 = 0."}, "body": {"en": "<h4>Working</h4><ol><li>2g = 4 → g = 2; 2f = −6 → f = −3; c = −12</li><li>Centre (−2, 3)</li><li>r = √(4 + 9 + 12) = √25 = 5</li></ol><h4>Answer</h4><p><b>Centre (−2, 3), radius 5.</b> Check by completing the square: (x + 2)² + (y − 3)² = 25 ✓.</p>"}}, {"h": {"en": "Practice 9. Find the equation of the circle with centre (−1, 2) passing through (3, 5)."}, "body": {"en": "<h4>Working</h4><ol><li>r = √((3 + 1)² + (5 − 2)²) = √(16 + 9) = 5</li><li>(x + 1)² + (y − 2)² = 25</li><li>x² + y² + 2x − 4y − 20 = 0</li></ol><h4>Check</h4><p>The point (3, 5) satisfies 16 + 9 = 25 ✓. The expanded form has centre (−1, 2) again ✓.</p>"}}, {"h": {"en": "Practice 10. Find the tangent to x² + y² = 169 at (5, 12)."}, "body": {"en": "<h4>Working</h4><p>The point is on the circle because 25 + 144 = 169. The tangent is 5x + 12y = 169.</p><h4>Answer</h4><p><b>5x + 12y = 169.</b> Radius slope 12/5, tangent slope −5/12, product −1 ✓.</p>"}}, {"h": {"en": "Practice 11. Find the normal to x² + y² = 25 at (−4, 3)."}, "body": {"en": "<h4>Working</h4><p>The normal joins the centre (0, 0) to (−4, 3): slope 3/(−4) = −3/4, so y = −(3/4)x, that is 3x + 4y = 0.</p><h4>Check</h4><p>The point satisfies −12 + 12 = 0 ✓, and this line is perpendicular to the tangent −4x + 3y = 25 ✓.</p>"}}, {"h": {"en": "Practice 12. Find k if the line 3x + 4y + k = 0 is tangent to x² + y² = 25."}, "body": {"en": "<h4>Working</h4><ol><li>Distance from centre = |k|/5</li><li>Set it equal to the radius: |k|/5 = 5</li><li>k = ±25</li></ol><h4>Answer</h4><p><b>k = ±25.</b> Two tangents, 3x + 4y = ±25. Check: |25|/5 = 5 = r ✓.</p>"}}, {"h": {"en": "Practice 13. Find the length of the tangent from (7, 1) to x² + y² − 4x + 2y − 4 = 0."}, "body": {"en": "<h4>Working</h4><ol><li>Value at the point: 49 + 1 − 28 + 2 − 4 = 20</li><li>Length = √20 = 2√5 ≈ 4.47</li></ol><h4>Answer</h4><p><b>2√5 ≈ 4.47 units.</b> The circle has centre (2, −1) and radius 3, and the point is √((7−2)² + (1+1)²) = √29 ≈ 5.39 from the centre, so a tangent of about 4.47 is consistent with √(29 − 9) ✓.</p>"}}, {"h": {"en": "Practice 14. A circle passes through (2, 3) and has centre (2, 0). Find its equation and the tangent at (2, 3)."}, "body": {"en": "<h4>Working</h4><ol><li>r = 3, so (x − 2)² + y² = 9</li><li>At (2, 3) the radius is vertical, so the tangent is horizontal: y = 3</li></ol><h4>Answer</h4><p><b>(x − 2)² + y² = 9 and the tangent y = 3.</b> The tangent is perpendicular to a vertical radius, which is exactly what the horizontal line gives.</p>"}}, {"h": {"en": "Practice 15. Find the equation of the line through the point of intersection of x + y = 4 and x − y = 2 that is parallel to 3x + 2y = 5."}, "body": {"en": "<h4>Working</h4><ol><li>Solving the pair: x = 3, y = 1</li><li>Slope of 3x + 2y = 5 is −3/2</li><li>y − 1 = −(3/2)(x − 3)</li><li>3x + 2y − 11 = 0</li></ol><h4>Check</h4><p>The point (3, 1) satisfies 9 + 2 − 11 = 0 ✓ and the slope is −3/2 ✓.</p>"}}]}], "diagrams": [{"id": "cg1_slope", "title": {"en": "Slope is rise over run"}, "file": "diagrams/cg1_slope.svg"}, {"id": "cg2_forms", "title": {"en": "Four forms of a straight line"}, "file": "diagrams/cg2_forms.svg"}, {"id": "cg3_parallel", "title": {"en": "Parallel and perpendicular"}, "file": "diagrams/cg3_parallel.svg"}, {"id": "cg4_angle", "title": {"en": "Angle between two lines"}, "file": "diagrams/cg4_angle.svg"}, {"id": "cg5_circle", "title": {"en": "Centre, radius, tangent and normal"}, "file": "diagrams/cg5_circle.svg"}, {"id": "cg6_general", "title": {"en": "Reading the general circle"}, "file": "diagrams/cg6_general.svg"}, {"id": "cg7_tangent", "title": {"en": "Tangent from an external point"}, "file": "diagrams/cg7_tangent.svg"}], "equations": [{"title": {"en": "The straight line"}, "items": [{"name": {"en": "Slope"}, "f": "m = (y₂ − y₁)/(x₂ − x₁) = tan θ", "terms": {"en": "Rise over run; vertical lines have no finite slope."}}, {"name": {"en": "Point-slope"}, "f": "y − y₁ = m(x − x₁)", "terms": {"en": "The workhorse when one point and the slope are known."}}, {"name": {"en": "Two-point"}, "f": "(y − y₁)/(y₂ − y₁) = (x − x₁)/(x₂ − x₁)", "terms": {"en": "Same statement as the slope formula, rearranged."}}, {"name": {"en": "Intercept"}, "f": "x/a + y/b = 1", "terms": {"en": "Only when both intercepts are non-zero."}}, {"name": {"en": "General form"}, "f": "ax + by + c = 0, slope −a/b", "terms": {"en": "Every line can be written this way."}}]}, {"title": {"en": "Pairs of lines"}, "items": [{"name": {"en": "Parallel"}, "f": "m₁ = m₂  or  a₁/a₂ = b₁/b₂", "terms": {"en": "Different constants; the same constants would mean one line."}}, {"name": {"en": "Perpendicular"}, "f": "m₁m₂ = −1  or  a₁a₂ + b₁b₂ = 0", "terms": {"en": "In general form the test needs no division."}}, {"name": {"en": "Angle between lines"}, "f": "tan θ = |(m₁ − m₂)/(1 + m₁m₂)|", "terms": {"en": "The modulus gives the acute angle."}}, {"name": {"en": "Distance to a line"}, "f": "d = |ax₁ + by₁ + c|/√(a² + b²)", "terms": {"en": "Between parallels, use |c₁ − c₂|/√(a² + b²)."}}]}, {"title": {"en": "The circle"}, "items": [{"name": {"en": "Centre-radius form"}, "f": "(x − h)² + (y − k)² = r²", "terms": {"en": "Centre (h, k), radius r."}}, {"name": {"en": "General form"}, "f": "x² + y² + 2gx + 2fy + c = 0", "terms": {"en": "Centre (−g, −f), radius √(g² + f² − c)."}}, {"name": {"en": "Tangent at a point"}, "f": "xx₁ + yy₁ = a²  for  x² + y² = a²", "terms": {"en": "For other circles use the perpendicular-to-radius slope."}}, {"name": {"en": "Tangent of slope m"}, "f": "y = mx ± a√(1 + m²)", "terms": {"en": "Two tangents, one on each side."}}, {"name": {"en": "Tangency test"}, "f": "distance from centre = radius", "terms": {"en": "Less than r: secant. Greater than r: no contact."}}]}], "numericals": [{"id": "cg1n1", "q": {"en": "Find the slope of the line joining (2, 3) and (6, 11)."}, "a": {"en": "<h4>Given and assumptions</h4><p>Two points on the line.</p><h4>Formula</h4><p>m = (y₂ − y₁)/(x₂ − x₁)</p><h4>Step-by-step solution</h4><ol><li>Rise = 11 − 3 = 8</li><li>Run = 6 − 2 = 4</li><li>m = 8/4 = 2</li></ol><h4>Interpretation and check</h4><p><b>m = 2.</b> The line rises 2 units for every 1 to the right, so the angle with the x-axis is tan⁻¹2 ≈ 63.4° - consistent with a fairly steep line.</p>"}}, {"id": "cg1n2", "q": {"en": "Find the equation of the line through (1, 2) and (3, 8)."}, "a": {"en": "<h4>Given and assumptions</h4><p>Two points, so use the two-point form.</p><h4>Formula</h4><p>(y − y₁)/(y₂ − y₁) = (x − x₁)/(x₂ − x₁)</p><h4>Step-by-step solution</h4><ol><li>Slope = (8 − 2)/(3 − 1) = 3</li><li>y − 2 = 3(x − 1)</li><li>y = 3x − 1, that is 3x − y − 1 = 0</li></ol><h4>Interpretation and check</h4><p><b>3x − y − 1 = 0.</b> Check both points: 3 − 2 − 1 = 0 ✓ and 9 − 8 − 1 = 0 ✓. Always substitute both points - one is enough to catch most sign errors.</p>"}}, {"id": "cg1n3", "q": {"en": "Find the slope of a line perpendicular to the line joining (0, 0) and (3, 4)."}, "a": {"en": "<h4>Given and assumptions</h4><p>First the slope of the given line, then the negative reciprocal.</p><h4>Formula</h4><p>m₁m₂ = −1</p><h4>Step-by-step solution</h4><ol><li>m₁ = 4/3</li><li>m₂ = −3/4</li></ol><h4>Interpretation and check</h4><p><b>−3/4.</b> Check the product: (4/3)(−3/4) = −1 ✓. The perpendicular to a rising line must fall, so a negative slope is expected.</p>"}}, {"id": "cg1n4", "q": {"en": "Find the equation of the line through (−2, 3) with slope 1/2."}, "a": {"en": "<h4>Given and assumptions</h4><p>One point and the slope - point-slope form.</p><h4>Formula</h4><p>y − y₁ = m(x − x₁)</p><h4>Step-by-step solution</h4><ol><li>y − 3 = ½(x + 2)</li><li>2y − 6 = x + 2</li><li>x − 2y + 8 = 0</li></ol><h4>Interpretation and check</h4><p><b>x − 2y + 8 = 0.</b> Check the point: −2 − 6 + 8 = 0 ✓, and the slope −a/b = −1/(−2) = ½ ✓.</p>"}}, {"id": "cg1n5", "q": {"en": "Find the equation of the line with x-intercept 3 and y-intercept −4."}, "a": {"en": "<h4>Given and assumptions</h4><p>Both intercepts are given, so use the intercept form.</p><h4>Formula</h4><p>x/a + y/b = 1</p><h4>Step-by-step solution</h4><ol><li>x/3 + y/(−4) = 1</li><li>Multiply by 12: 4x − 3y = 12</li></ol><h4>Interpretation and check</h4><p><b>4x − 3y = 12.</b> Check both intercepts: at y = 0, x = 3 ✓; at x = 0, y = −4 ✓. The line crosses the y-axis below the origin, which the negative intercept records.</p>"}}, {"id": "cg1n6", "q": {"en": "Reduce 3x + 4y − 12 = 0 to slope-intercept and intercept forms."}, "a": {"en": "<h4>Given and assumptions</h4><p>Solve for y for the first, and divide by 12 for the second.</p><h4>Formula</h4><p>slope = −a/b; intercepts = −c/a and −c/b</p><h4>Step-by-step solution</h4><ol><li>y = −(3/4)x + 3</li><li>x/4 + y/3 = 1</li></ol><h4>Interpretation and check</h4><p><b>Slope −3/4, y-intercept 3, x-intercept 4.</b> Check: 3(4) + 0 − 12 = 0 ✓ and 0 + 4(3) − 12 = 0 ✓.</p>"}}, {"id": "cg1n7", "q": {"en": "Find the line through (2, −3) parallel to 3x − 4y + 5 = 0."}, "a": {"en": "<h4>Given and assumptions</h4><p>Parallel lines differ only in the constant term.</p><h4>Formula</h4><p>family 3x − 4y + k = 0, then substitute the point</p><h4>Step-by-step solution</h4><ol><li>3(2) − 4(−3) + k = 0</li><li>6 + 12 + k = 0 → k = −18</li><li>3x − 4y − 18 = 0</li></ol><h4>Interpretation and check</h4><p><b>3x − 4y − 18 = 0.</b> Check the point: 6 + 12 − 18 = 0 ✓, and the slope 3/4 matches the original line's 3/4 ✓.</p>"}}, {"id": "cg1n8", "q": {"en": "Find the line through (1, 2) perpendicular to 2x + 3y = 6."}, "a": {"en": "<h4>Given and assumptions</h4><p>Swap the coefficients and change one sign, then fit the point.</p><h4>Formula</h4><p>perpendicular family 3x − 2y + k = 0</p><h4>Step-by-step solution</h4><ol><li>3(1) − 2(2) + k = 0</li><li>k = 1</li><li>3x − 2y + 1 = 0</li></ol><h4>Interpretation and check</h4><p><b>3x − 2y + 1 = 0.</b> Check perpendicularity from the general forms: a₁a₂ + b₁b₂ = 2(3) + 3(−2) = 0 ✓, and the point satisfies the equation ✓.</p>"}}, {"id": "cg1n9", "q": {"en": "Find the acute angle between y = 2x + 1 and y = −x + 3."}, "a": {"en": "<h4>Given and assumptions</h4><p>Slopes m₁ = 2 and m₂ = −1.</p><h4>Formula</h4><p>tan θ = |(m₁ − m₂)/(1 + m₁m₂)|</p><h4>Step-by-step solution</h4><ol><li>Numerator: |2 − (−1)| = 3</li><li>Denominator: |1 + (2)(−1)| = 1</li><li>tan θ = 3, θ = 71.57°</li></ol><h4>Interpretation and check</h4><p><b>θ ≈ 71.6°.</b> The lines are nowhere near parallel (slopes 2 and −1) and not perpendicular (product −2 ≠ −1), so a large acute angle is expected.</p>"}}, {"id": "cg1n10", "q": {"en": "Find the angle between 3x − y + 4 = 0 and x + 2y − 5 = 0."}, "a": {"en": "<h4>Given and assumptions</h4><p>Convert both to slope form first.</p><h4>Formula</h4><p>tan θ = |(m₁ − m₂)/(1 + m₁m₂)|</p><h4>Step-by-step solution</h4><ol><li>m₁ = 3 and m₂ = −1/2</li><li>Numerator: |3 + 0.5| = 3.5, denominator: |1 − 1.5| = 0.5</li><li>tan θ = 7, θ = 81.87°</li></ol><h4>Interpretation and check</h4><p><b>θ ≈ 81.9°.</b> Nearly perpendicular: a₁a₂ + b₁b₂ = 3(1) + (−1)(2) = 1, which is close to zero - so the angle must be close to 90° ✓.</p>"}}, {"id": "cg1n11", "q": {"en": "Show that 2x + 3y = 5 and 4x + 6y = 11 are parallel."}, "a": {"en": "<h4>Given and assumptions</h4><p>Compare the coefficient ratios.</p><h4>Formula</h4><p>parallel when a₁/a₂ = b₁/b₂ ≠ c₁/c₂</p><h4>Step-by-step solution</h4><ol><li>2/4 = 3/6 = 1/2</li><li>5/11 ≠ 1/2</li><li>The slopes are equal and the constants are not</li></ol><h4>Interpretation and check</h4><p><b>Parallel.</b> Both have slope −2/3. Because 5/11 ≠ 1/2, the lines are distinct - if the ratios had matched they would be the same line.</p>"}}, {"id": "cg1n12", "q": {"en": "Show that 3x + 4y = 7 and 4x − 3y = 2 are perpendicular."}, "a": {"en": "<h4>Given and assumptions</h4><p>Use the general-form test, which avoids fractions.</p><h4>Formula</h4><p>a₁a₂ + b₁b₂ = 0</p><h4>Step-by-step solution</h4><ol><li>3(4) + 4(−3)</li><li>= 12 − 12 = 0</li></ol><h4>Interpretation and check</h4><p><b>Perpendicular.</b> Slope check: m₁ = −3/4 and m₂ = 4/3, product −1 ✓. The coefficient test is faster and has no sign traps.</p>"}}, {"id": "cg1n13", "q": {"en": "Find the equation of the circle with centre (2, −3) and radius 5."}, "a": {"en": "<h4>Given and assumptions</h4><p>Centre-radius form, then expand if the general form is wanted.</p><h4>Formula</h4><p>(x − h)² + (y − k)² = r²</p><h4>Step-by-step solution</h4><ol><li>(x − 2)² + (y + 3)² = 25</li><li>x² − 4x + 4 + y² + 6y + 9 = 25</li><li>x² + y² − 4x + 6y − 12 = 0</li></ol><h4>Interpretation and check</h4><p><b>(x − 2)² + (y + 3)² = 25.</b> Check a point: (7, −3) is 5 units right of the centre and satisfies 25 = 25 ✓. In the expanded form, −g = 2 and −f = −3 restore the centre.</p>"}}, {"id": "cg1n14", "q": {"en": "Find the centre and radius of x² + y² − 6x + 8y − 11 = 0."}, "a": {"en": "<h4>Given and assumptions</h4><p>Compare with x² + y² + 2gx + 2fy + c = 0.</p><h4>Formula</h4><p>centre (−g, −f), radius √(g² + f² − c)</p><h4>Step-by-step solution</h4><ol><li>2g = −6 → g = −3; 2f = 8 → f = 4; c = −11</li><li>Centre = (3, −4)</li><li>r = √(9 + 16 + 11) = √36 = 6</li></ol><h4>Interpretation and check</h4><p><b>Centre (3, −4), radius 6.</b> Check by completing the square: (x − 3)² + (y + 4)² = 9 + 16 + 11 = 36 ✓.</p>"}}, {"id": "cg1n15", "q": {"en": "Find the circle with (1, 2) and (5, 8) as ends of a diameter."}, "a": {"en": "<h4>Given and assumptions</h4><p>The midpoint is the centre and half the distance is the radius.</p><h4>Formula</h4><p>centre = midpoint, r = ½√((x₂−x₁)² + (y₂−y₁)²)</p><h4>Step-by-step solution</h4><ol><li>Centre = (3, 5)</li><li>Diameter = √(16 + 36) = √52 = 2√13, so r = √13</li><li>(x − 3)² + (y − 5)² = 13</li></ol><h4>Interpretation and check</h4><p><b>(x − 3)² + (y − 5)² = 13.</b> Check both diameter ends: (1 − 3)² + (2 − 5)² = 4 + 9 = 13 ✓ and (5 − 3)² + (8 − 5)² = 4 + 9 = 13 ✓.</p>"}}, {"id": "cg1n16", "q": {"en": "Find k so that (2, 3) lies on x² + y² + kx − 4y − 6 = 0."}, "a": {"en": "<h4>Given and assumptions</h4><p>A point on the circle must satisfy its equation.</p><h4>Formula</h4><p>Substitute x = 2, y = 3</p><h4>Step-by-step solution</h4><ol><li>4 + 9 + 2k − 12 − 6 = 0</li><li>2k − 5 = 0</li><li>k = 5/2</li></ol><h4>Interpretation and check</h4><p><b>k = 2.5.</b> Check: 4 + 9 + 5 − 12 − 6 = 0 ✓. Substituting the point is the whole test - no geometry needed.</p>"}}, {"id": "cg1n17", "q": {"en": "Find the tangent to x² + y² = 25 at (3, 4)."}, "a": {"en": "<h4>Given and assumptions</h4><p>The point lies on the circle because 9 + 16 = 25.</p><h4>Formula</h4><p>tangent at (x₁, y₁) to x² + y² = a² is xx₁ + yy₁ = a²</p><h4>Step-by-step solution</h4><ol><li>3x + 4y = 25</li></ol><h4>Interpretation and check</h4><p><b>3x + 4y = 25.</b> Check the slopes: radius slope 4/3, tangent slope −3/4, product −1 ✓. The point (3, 4) satisfies the tangent equation ✓.</p>"}}, {"id": "cg1n18", "q": {"en": "Find the tangent to x² + y² = 13 at (2, 3)."}, "a": {"en": "<h4>Given and assumptions</h4><p>Check the point first: 4 + 9 = 13 ✓.</p><h4>Formula</h4><p>xx₁ + yy₁ = a²</p><h4>Step-by-step solution</h4><ol><li>2x + 3y = 13</li></ol><h4>Interpretation and check</h4><p><b>2x + 3y = 13.</b> The radius slope is 3/2 and the tangent slope is −2/3; their product is −1 ✓.</p>"}}, {"id": "cg1n19", "q": {"en": "Find the tangents to x² + y² = 25 that have slope 3/4."}, "a": {"en": "<h4>Given and assumptions</h4><p>Use the slope form of the tangent.</p><h4>Formula</h4><p>y = mx ± a√(1 + m²)</p><h4>Step-by-step solution</h4><ol><li>m = 3/4 and a = 5</li><li>√(1 + 9/16) = 5/4</li><li>c = ±5 × 5/4 = ±25/4</li><li>y = (3/4)x ± 25/4, that is 3x − 4y ± 25 = 0</li></ol><h4>Interpretation and check</h4><p><b>3x − 4y + 25 = 0 and 3x − 4y − 25 = 0.</b> Check the distance from the centre: |25|/√(9 + 16) = 5 = radius ✓, so both lines just touch the circle.</p>"}}, {"id": "cg1n20", "q": {"en": "Find the normal to x² + y² = 25 at (3, 4)."}, "a": {"en": "<h4>Given and assumptions</h4><p>The normal passes through the centre (0, 0).</p><h4>Formula</h4><p>the line through the centre and the point of contact</p><h4>Step-by-step solution</h4><ol><li>Slope = (4 − 0)/(3 − 0) = 4/3</li><li>y = (4/3)x, that is 4x − 3y = 0</li></ol><h4>Interpretation and check</h4><p><b>4x − 3y = 0.</b> Check the point: 12 − 12 = 0 ✓, and the normal is perpendicular to the tangent 3x + 4y = 25 since (4/3)(−3/4) = −1 ✓.</p>"}}, {"id": "cg1n21", "q": {"en": "Find the length of the tangent from (5, 1) to x² + y² = 25."}, "a": {"en": "<h4>Given and assumptions</h4><p>Use the power of the point.</p><h4>Formula</h4><p>length = √(x₁² + y₁² − a²)</p><h4>Step-by-step solution</h4><ol><li>= √(25 + 1 − 25)</li><li>= √1</li><li>= 1</li></ol><h4>Interpretation and check</h4><p><b>1 unit.</b> The point is just outside the circle (distance from centre √26 ≈ 5.099 > 5), so a short tangent is expected ✓.</p>"}}, {"id": "cg1n22", "q": {"en": "Find the distance from (2, 3) to the line 3x + 4y − 5 = 0."}, "a": {"en": "<h4>Given and assumptions</h4><p>The line is already in general form.</p><h4>Formula</h4><p>d = |ax₁ + by₁ + c|/√(a² + b²)</p><h4>Step-by-step solution</h4><ol><li>Numerator: |6 + 12 − 5| = 13</li><li>Denominator: √25 = 5</li><li>d = 13/5 = 2.6</li></ol><h4>Interpretation and check</h4><p><b>2.6 units.</b> The distance is positive by construction. Note that (2, 3) is far from the origin, so a distance of a few units from this line is plausible.</p>"}}, {"id": "cg1n23", "q": {"en": "Find the distance between 3x + 4y = 5 and 3x + 4y = 15."}, "a": {"en": "<h4>Given and assumptions</h4><p>Parallel lines with the same coefficients.</p><h4>Formula</h4><p>d = |c₁ − c₂|/√(a² + b²)</p><h4>Step-by-step solution</h4><ol><li>|5 − 15| = 10</li><li>√(9 + 16) = 5</li><li>d = 10/5 = 2</li></ol><h4>Interpretation and check</h4><p><b>2 units.</b> Check with a point: (1.667, 0) lies on the first line and its distance from the second is |5 − 15|/5 = 2 ✓.</p>"}}, {"id": "cg1n24", "q": {"en": "Find the line through (2, 3) parallel to the line joining (1, 1) and (4, 5)."}, "a": {"en": "<h4>Given and assumptions</h4><p>First find the slope of the joining line.</p><h4>Formula</h4><p>m = (5 − 1)/(4 − 1) = 4/3, then use point-slope</p><h4>Step-by-step solution</h4><ol><li>y − 3 = (4/3)(x − 2)</li><li>3y − 9 = 4x − 8</li><li>4x − 3y + 1 = 0</li></ol><h4>Interpretation and check</h4><p><b>4x − 3y + 1 = 0.</b> Check the point: 8 − 9 + 1 = 0 ✓ and the slope 4/3 matches ✓.</p>"}}, {"id": "cg1n25", "q": {"en": "Find the circle through (0, 0), (4, 0) and (0, 3)."}, "a": {"en": "<h4>Given and assumptions</h4><p>Because it passes through the origin, c = 0 in the general form.</p><h4>Formula</h4><p>x² + y² + 2gx + 2fy + c = 0</p><h4>Step-by-step solution</h4><ol><li>Through (0, 0): c = 0</li><li>Through (4, 0): 16 + 8g = 0 → g = −2</li><li>Through (0, 3): 9 + 6f = 0 → f = −3/2</li><li>x² + y² − 4x − 3y = 0</li></ol><h4>Interpretation and check</h4><p><b>x² + y² − 4x − 3y = 0.</b> Centre (2, 1.5) and radius √(4 + 2.25) = 2.5 - exactly half the hypotenuse of the 3-4-5 triangle, as a circle through the three vertices of a right triangle must be.</p>"}}, {"id": "cg1n26", "q": {"en": "Find c so that y = 2x + c is a tangent to x² + y² = 25."}, "a": {"en": "<h4>Given and assumptions</h4><p>Tangency means the distance from the centre equals the radius.</p><h4>Formula</h4><p>distance from (0, 0) to 2x − y + c = 0 equals 5</p><h4>Step-by-step solution</h4><ol><li>|c|/√(4 + 1) = 5</li><li>|c| = 5√5</li><li>c = ±5√5 ≈ ±11.18</li></ol><h4>Interpretation and check</h4><p><b>c = ±5√5.</b> Two parallel tangents, one on each side of the circle. Check: the distance from the origin to 2x − y + 5√5 = 0 is 5√5/√5 = 5 = r ✓.</p>"}}], "viva": [{"title": {"en": "Lines"}, "items": [{"q": {"en": "Define the slope of a line."}, "a": {"en": "m = tan θ, the tangent of the angle with the positive x-axis; also (y₂ − y₁)/(x₂ − x₁)."}}, {"q": {"en": "Write the two-point form."}, "a": {"en": "(y − y₁)/(y₂ − y₁) = (x − x₁)/(x₂ − x₁)."}}, {"q": {"en": "What is the slope of a vertical line?"}, "a": {"en": "It is not defined; the equation is x = a."}}, {"q": {"en": "Write the intercept form of a line."}, "a": {"en": "x/a + y/b = 1, where a and b are the x- and y-intercepts."}}, {"q": {"en": "How do you find the slope from ax + by + c = 0?"}, "a": {"en": "m = −a/b."}}, {"q": {"en": "Give the condition for two lines to be parallel."}, "a": {"en": "m₁ = m₂, or a₁/a₂ = b₁/b₂ in general form."}}, {"q": {"en": "Give the condition for two lines to be perpendicular."}, "a": {"en": "m₁m₂ = −1, or a₁a₂ + b₁b₂ = 0."}}]}, {"title": {"en": "Angles and distances"}, "items": [{"q": {"en": "State the angle-between-lines formula."}, "a": {"en": "tan θ = |(m₁ − m₂)/(1 + m₁m₂)|."}}, {"q": {"en": "What does the formula give when 1 + m₁m₂ = 0?"}, "a": {"en": "The denominator vanishes, so θ = 90° - the lines are perpendicular."}}, {"q": {"en": "Write the distance from a point to a line."}, "a": {"en": "d = |ax₁ + by₁ + c|/√(a² + b²)."}}, {"q": {"en": "How do you find the distance between two parallel lines?"}, "a": {"en": "Write both in the same form and use |c₁ − c₂|/√(a² + b²)."}}]}, {"title": {"en": "Circles"}, "items": [{"q": {"en": "Write the equation of a circle with centre (h, k) and radius r."}, "a": {"en": "(x − h)² + (y − k)² = r²."}}, {"q": {"en": "What are the centre and radius of x² + y² + 2gx + 2fy + c = 0?"}, "a": {"en": "Centre (−g, −f), radius √(g² + f² − c)."}}, {"q": {"en": "How do you find the centre when the ends of a diameter are given?"}, "a": {"en": "The midpoint of the two ends; the radius is half the distance between them."}}, {"q": {"en": "What is the tangent at (x₁, y₁) to x² + y² = a²?"}, "a": {"en": "xx₁ + yy₁ = a²."}}, {"q": {"en": "Why is the tangent perpendicular to the radius?"}, "a": {"en": "The radius to the point of contact is the shortest distance to the tangent, so the two are perpendicular."}}, {"q": {"en": "Write the normal to a circle at a point."}, "a": {"en": "The line joining the centre to that point, because every normal passes through the centre."}}, {"q": {"en": "How do you test whether a line is tangent to a circle?"}, "a": {"en": "The perpendicular distance from the centre equals the radius."}}, {"q": {"en": "Give the tangents of slope m to x² + y² = a²."}, "a": {"en": "y = mx ± a√(1 + m²)."}}, {"q": {"en": "What is the length of the tangent from (x₁, y₁) to x² + y² = a²?"}, "a": {"en": "√(x₁² + y₁² − a²)."}}]}], "exam_questions": [{"q": {"en": "Practice: Find the slope and equation of the line through (0, 5) and (3, 11)."}, "marks": 4}, {"q": {"en": "Practice: Find the equation of the line with slope −3 passing through (2, 4)."}, "marks": 3}, {"q": {"en": "Practice: Find the equation of the line whose intercepts are −2 on x and 5 on y."}, "marks": 3}, {"q": {"en": "Practice: Show that the lines 5x − 2y + 3 = 0 and 10x − 4y − 7 = 0 are parallel."}, "marks": 3}, {"q": {"en": "Practice: Find the equation of the line through (3, −1) perpendicular to 4x − 3y + 7 = 0."}, "marks": 4}, {"q": {"en": "Practice: Find the acute angle between 2x − y + 3 = 0 and x + 3y − 2 = 0."}, "marks": 4}, {"q": {"en": "Practice: Find the distance between the parallel lines 4x + 3y − 9 = 0 and 4x + 3y + 6 = 0."}, "marks": 4}, {"q": {"en": "Practice: Find the centre and radius of x² + y² + 4x − 6y − 12 = 0."}, "marks": 4}, {"q": {"en": "Practice: Find the equation of the circle with centre (−1, 2) passing through (3, 5)."}, "marks": 4}, {"q": {"en": "Practice: Find the tangent to x² + y² = 169 at (5, 12)."}, "marks": 3}, {"q": {"en": "Practice: Find the normal to x² + y² = 25 at (−4, 3)."}, "marks": 3}, {"q": {"en": "Practice: Find k if the line 3x + 4y + k = 0 is tangent to x² + y² = 25."}, "marks": 4}, {"q": {"en": "Practice: Find the length of the tangent from (7, 1) to x² + y² − 4x + 2y − 4 = 0."}, "marks": 4}, {"q": {"en": "Practice: A circle passes through (2, 3) and has centre (2, 0). Find its equation and the tangent at (2, 3)."}, "marks": 4}, {"q": {"en": "Practice: Find the equation of the line through the point of intersection of x + y = 4 and x − y = 2 that is parallel to 3x + 2y = 5."}, "marks": 4}], "learning_outcomes": [{"en": "CO4: Solve basic engineering problems under given conditions of straight lines and circle."}], "course_outcomes": ["CO4"], "practical_numbers": [], "content_kind": "theory", "lesson_count": 13, "answered_practice_count": 15, "assessment_note": {"en": "Official course: theory ESE 70 + PA 30 = 100 marks, 4 credits; this unit carries 20 % weightage and about 14 of the 70 theory marks. Practice-question marks (3/4) are suggested revision sizes, not official GTU allocations or a guaranteed paper pattern. Model answers are in Notes section 7.   if (dg){ const id=dg.dataset.dg; document.getElementById('mt').textContent=t(U.diagrams.find(d=>d.id===id).title); document.getElementById('zw').innerHTML=SVG[id]; setZoom(1); document.getElementById('modal').classList.add('show'); return; }
  if (e.target.closest('#mx')) document.getElementById('modal').classList.remove('show');
  if (e.target.closest('#zi')) setZoom(zoom+0.5);
  if (e.target.closest('#zo')) setZoom(zoom-0.5);
  if (e.target.closest('#zr')) setZoom(1);
});
render();
</script></body></html>
