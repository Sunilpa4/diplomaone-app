<script>
const U = {"subject": "DI01000151", "unit": 5, "format": "notes", "title": {"en": "IC 555 Timer", "gu": "IC 555 Timer"}, "weightage": 15, "hours": 4, "notes": [{"title": {"en": "5.1 Introduction to IC 555", "gu": "5.1 IC 555 નો પરિચય"}, "items": [{"h": {"en": "5.1.1 What is IC 555?", "gu": "5.1.1 IC 555 એટલે શું?"}, "body": {"en": "<p>The <b>IC 555</b> is a very popular, low-cost <b>integrated circuit</b> used to produce accurate <b>time delays</b> and <b>oscillations</b> (square / rectangular waves). It is commonly called the <b>555 timer</b>.</p>\n<h4>History</h4>\n<ul>\n<li>Designed by <b>Hans R. Camenzind</b> and introduced by <b>Signetics Corporation</b> in <b>1971</b> (part number <b>NE555</b>).</li>\n<li>The name \"555\" is usually explained by the <b>three 5 kΩ resistors</b> used inside the IC as a voltage divider.</li>\n<li>It is one of the most widely produced ICs in the world – billions are made every year.</li>\n</ul>\n<h4>Versions of 555</h4>\n<table>\n<tr><th>Version</th><th>Description</th></tr>\n<tr><td><b>NE555</b></td><td>Commercial grade, 0 °C to 70 °C</td></tr>\n<tr><td><b>SE555</b></td><td>Military grade, −55 °C to +125 °C</td></tr>\n<tr><td><b>556</b></td><td>Dual timer – two 555 timers in one 14-pin IC</td></tr>\n<tr><td><b>558</b></td><td>Quad timer – four timers in one 16-pin IC</td></tr>\n<tr><td><b>7555 / TLC555 / LMC555</b></td><td>CMOS versions – very low power, can work from about 2 V</td></tr>\n</table>\n<h4>Packages</h4>\n<p>It is available as an <b>8-pin DIP</b> (Dual In-line Package), 8-pin metal can (TO-99) and 8-pin SMD (SOIC) package. The 8-pin DIP is used in the laboratory.</p>", "gu": "<p><b>IC 555</b> એ ખૂબ જાણીતું અને સસ્તું <b>integrated circuit</b> છે, જે ચોક્કસ <b>time delay</b> અને <b>oscillations</b> (square / rectangular waves) ઉત્પન્ન કરવા વપરાય છે. તેને સામાન્ય રીતે <b>555 timer</b> કહે છે.</p>\n<h4>ઇતિહાસ</h4>\n<ul>\n<li><b>Hans R. Camenzind</b> એ ડિઝાઇન કર્યું અને <b>Signetics Corporation</b> એ <b>1971</b> માં રજૂ કર્યું (part number <b>NE555</b>).</li>\n<li>\"555\" નામ સામાન્ય રીતે IC ની અંદર voltage divider તરીકે વપરાતા <b>ત્રણ 5 kΩ resistors</b> પરથી સમજાવાય છે.</li>\n<li>દુનિયામાં સૌથી વધુ બનતા ICs માંનું એક છે – દર વર્ષે અબજો બને છે.</li>\n</ul>\n<h4>555 ના પ્રકારો (Versions)</h4>\n<table>\n<tr><th>Version</th><th>વર્ણન</th></tr>\n<tr><td><b>NE555</b></td><td>Commercial grade, 0 °C થી 70 °C</td></tr>\n<tr><td><b>SE555</b></td><td>Military grade, −55 °C થી +125 °C</td></tr>\n<tr><td><b>556</b></td><td>Dual timer – એક 14-pin IC માં બે 555 timers</td></tr>\n<tr><td><b>558</b></td><td>Quad timer – એક 16-pin IC માં ચાર timers</td></tr>\n<tr><td><b>7555 / TLC555 / LMC555</b></td><td>CMOS versions – ખૂબ ઓછો power, લગભગ 2 V થી પણ કામ કરે</td></tr>\n</table>\n<h4>Packages</h4>\n<p>તે <b>8-pin DIP</b> (Dual In-line Package), 8-pin metal can (TO-99) અને 8-pin SMD (SOIC) package માં મળે છે. Laboratory માં 8-pin DIP વપરાય છે.</p>"}}, {"h": {"en": "5.1.2 Features of IC 555", "gu": "5.1.2 IC 555 ની વિશેષતાઓ (Features)"}, "body": {"en": "<ul>\n<li><b>Wide supply voltage:</b> +4.5 V to +15 V (maximum 16–18 V, depending on manufacturer).</li>\n<li><b>Timing range:</b> from a few <b>microseconds to hours</b>, set by external R and C only.</li>\n<li><b>High output current:</b> output can <b>source or sink up to 200 mA</b> – can drive LEDs, relays, buzzers and small lamps directly.</li>\n<li><b>Output compatible with TTL</b> logic when operated from a 5 V supply.</li>\n<li><b>Adjustable duty cycle</b> in astable mode.</li>\n<li><b>High temperature stability:</b> about <b>0.005 % per °C</b>.</li>\n<li>Timing is <b>independent of supply voltage</b> because the thresholds are fixed fractions (⅔ and ⅓) of V<sub>CC</sub>.</li>\n<li>Works in <b>monostable</b>, <b>astable</b> and <b>bistable</b> modes.</li>\n<li>Small size, low cost, easily available and needs very few external components.</li>\n</ul>\n<h4>Typical ratings (NE555)</h4>\n<table>\n<tr><th>Parameter</th><th>Value</th></tr>\n<tr><td>Supply voltage (V<sub>CC</sub>)</td><td>4.5 V – 15 V</td></tr>\n<tr><td>Supply current (V<sub>CC</sub> = 5 V)</td><td>3 – 6 mA</td></tr>\n<tr><td>Maximum output current</td><td>200 mA</td></tr>\n<tr><td>Maximum power dissipation</td><td>600 mW</td></tr>\n<tr><td>Maximum operating frequency</td><td>about 500 kHz</td></tr>\n<tr><td>Output HIGH level</td><td>≈ V<sub>CC</sub> − 1.7 V</td></tr>\n<tr><td>Output LOW level</td><td>≈ 0.1 V</td></tr>\n</table>", "gu": "<ul>\n<li><b>વિશાળ supply voltage:</b> +4.5 V થી +15 V (manufacturer પ્રમાણે મહત્તમ 16–18 V).</li>\n<li><b>Timing range:</b> થોડા <b>microseconds થી કલાકો</b> સુધી, ફક્ત બહારના R અને C થી નક્કી થાય.</li>\n<li><b>વધુ output current:</b> output <b>200 mA સુધી source અથવા sink</b> કરી શકે – LEDs, relays, buzzers અને નાના lamps સીધા ચલાવી શકે.</li>\n<li>5 V supply પર output <b>TTL logic compatible</b> છે.</li>\n<li>Astable mode માં <b>duty cycle બદલી શકાય</b>.</li>\n<li><b>ઉચ્ચ temperature stability:</b> લગભગ <b>0.005 % પ્રતિ °C</b>.</li>\n<li>Thresholds V<sub>CC</sub> ના નિશ્ચિત ભાગ (⅔ અને ⅓) હોવાથી timing <b>supply voltage થી સ્વતંત્ર</b> છે.</li>\n<li><b>Monostable</b>, <b>astable</b> અને <b>bistable</b> modes માં કામ કરે.</li>\n<li>નાનું કદ, ઓછી કિંમત, સહેલાઈથી મળે અને બહુ ઓછા external components જોઈએ.</li>\n</ul>\n<h4>સામાન્ય ratings (NE555)</h4>\n<table>\n<tr><th>Parameter</th><th>મૂલ્ય</th></tr>\n<tr><td>Supply voltage (V<sub>CC</sub>)</td><td>4.5 V – 15 V</td></tr>\n<tr><td>Supply current (V<sub>CC</sub> = 5 V)</td><td>3 – 6 mA</td></tr>\n<tr><td>મહત્તમ output current</td><td>200 mA</td></tr>\n<tr><td>મહત્તમ power dissipation</td><td>600 mW</td></tr>\n<tr><td>મહત્તમ operating frequency</td><td>લગભગ 500 kHz</td></tr>\n<tr><td>Output HIGH level</td><td>≈ V<sub>CC</sub> − 1.7 V</td></tr>\n<tr><td>Output LOW level</td><td>≈ 0.1 V</td></tr>\n</table>"}}, {"h": {"en": "5.1.3 Modes of Operation", "gu": "5.1.3 Operation ના Modes"}, "body": {"en": "<p>The 555 timer can be operated in three basic modes:</p>\n<table>\n<tr><th>Mode</th><th>Other name</th><th>Stable states</th><th>Output</th><th>Uses</th></tr>\n<tr><td><b>Monostable</b></td><td>One-shot multivibrator</td><td>One (LOW)</td><td>One pulse of fixed width T = 1.1RC for each trigger</td><td>Timers, delay circuits, pulse stretching, debouncing</td></tr>\n<tr><td><b>Astable</b></td><td>Free-running multivibrator</td><td>None (both quasi-stable)</td><td>Continuous rectangular wave, no trigger needed</td><td>Oscillators, LED flashers, clock pulses, tone generators</td></tr>\n<tr><td><b>Bistable</b></td><td>Flip-flop / Schmitt trigger</td><td>Two</td><td>Stays HIGH or LOW until changed by trigger / reset</td><td>ON-OFF switches, memory, debouncing</td></tr>\n</table>\n<p><b>Multivibrator:</b> a circuit that switches between two states (HIGH and LOW). The number of <b>stable states</b> gives its type: mono (1), a-stable (0), bi-stable (2).</p>", "gu": "<p>555 timer ને ત્રણ મૂળભૂત modes માં ચલાવી શકાય છે:</p>\n<table>\n<tr><th>Mode</th><th>બીજું નામ</th><th>Stable states</th><th>Output</th><th>ઉપયોગ</th></tr>\n<tr><td><b>Monostable</b></td><td>One-shot multivibrator</td><td>એક (LOW)</td><td>દરેક trigger માટે નિશ્ચિત પહોળાઈ T = 1.1RC નો એક pulse</td><td>Timers, delay circuits, pulse stretching, debouncing</td></tr>\n<tr><td><b>Astable</b></td><td>Free-running multivibrator</td><td>એક પણ નહીં (બંને quasi-stable)</td><td>સતત rectangular wave, trigger ની જરૂર નથી</td><td>Oscillators, LED flashers, clock pulses, tone generators</td></tr>\n<tr><td><b>Bistable</b></td><td>Flip-flop / Schmitt trigger</td><td>બે</td><td>Trigger / reset થી બદલાય ત્યાં સુધી HIGH અથવા LOW રહે</td><td>ON-OFF switches, memory, debouncing</td></tr>\n</table>\n<p><b>Multivibrator:</b> બે states (HIGH અને LOW) વચ્ચે બદલાતો circuit. <b>Stable states</b> ની સંખ્યા પરથી પ્રકાર નક્કી થાય: mono (1), a-stable (0), bi-stable (2).</p>"}}, {"h": {"en": "5.1.4 Advantages, Limitations and Applications", "gu": "5.1.4 ફાયદા, મર્યાદાઓ અને ઉપયોગો"}, "body": {"en": "<h4>Advantages</h4>\n<ul>\n<li>Very cheap, easily available, simple to use.</li>\n<li>Wide range of supply voltage and timing.</li>\n<li>High output current (200 mA) – drives loads directly.</li>\n<li>Timing does not depend on supply voltage; good temperature stability.</li>\n</ul>\n<h4>Limitations</h4>\n<ul>\n<li>The bipolar NE555 draws a large current spike during output switching; needs a decoupling capacitor across the supply.</li>\n<li>Maximum frequency about 500 kHz – not suitable for very high frequencies.</li>\n<li>For very long delays, large capacitors are needed; leakage of electrolytic capacitors reduces accuracy.</li>\n<li>In the basic astable circuit the duty cycle is always more than 50 %.</li>\n</ul>\n<h4>Applications</h4>\n<p>Pulse generator, square-wave oscillator, time-delay circuit, LED flasher, traffic-light timer, burglar alarm, missing-pulse detector, frequency divider, PWM (pulse width modulation), frequency counter (gate pulse), tone / siren generator, touch switch, water-level indicator, DC-DC converter, etc.</p>", "gu": "<h4>ફાયદા</h4>\n<ul>\n<li>ખૂબ સસ્તું, સહેલાઈથી મળે, વાપરવામાં સરળ.</li>\n<li>Supply voltage અને timing ની વિશાળ range.</li>\n<li>વધુ output current (200 mA) – loads ને સીધા ચલાવે.</li>\n<li>Timing supply voltage પર આધાર રાખતું નથી; સારી temperature stability.</li>\n</ul>\n<h4>મર્યાદાઓ</h4>\n<ul>\n<li>Bipolar NE555 output switching વખતે મોટો current spike લે છે; supply પર decoupling capacitor જોઈએ.</li>\n<li>મહત્તમ frequency લગભગ 500 kHz – ખૂબ ઊંચી frequencies માટે યોગ્ય નથી.</li>\n<li>ખૂબ લાંબા delay માટે મોટા capacitors જોઈએ; electrolytic capacitors નો leakage ચોકસાઈ ઘટાડે.</li>\n<li>Basic astable circuit માં duty cycle હંમેશા 50 % થી વધુ હોય છે.</li>\n</ul>\n<h4>ઉપયોગો</h4>\n<p>Pulse generator, square-wave oscillator, time-delay circuit, LED flasher, traffic-light timer, burglar alarm, missing-pulse detector, frequency divider, PWM (pulse width modulation), frequency counter (gate pulse), tone / siren generator, touch switch, water-level indicator, DC-DC converter વગેરે.</p>"}}, {"h": {"en": "Key Points – 5.1", "gu": "મુખ્ય મુદ્દા – 5.1"}, "body": {"en": "<ul>\n<li>IC 555 = timer IC by <b>Signetics, 1971</b> (designer <b>Hans Camenzind</b>); named after the <b>three 5 kΩ</b> resistors.</li>\n<li>NE555 (commercial), SE555 (military), 556 (dual), 558 (quad), 7555 (CMOS).</li>\n<li>Supply <b>4.5 – 15 V</b>; output current <b>200 mA</b>; timing µs to hours; f<sub>max</sub> ≈ 500 kHz.</li>\n<li>Three modes: <b>monostable</b> (1 stable state), <b>astable</b> (0), <b>bistable</b> (2).</li>\n<li>Timing is independent of V<sub>CC</sub> because thresholds are ⅔V<sub>CC</sub> and ⅓V<sub>CC</sub>.</li>\n</ul>", "gu": "<ul>\n<li>IC 555 = <b>Signetics, 1971</b> નું timer IC (designer <b>Hans Camenzind</b>); નામ <b>ત્રણ 5 kΩ</b> resistors પરથી.</li>\n<li>NE555 (commercial), SE555 (military), 556 (dual), 558 (quad), 7555 (CMOS).</li>\n<li>Supply <b>4.5 – 15 V</b>; output current <b>200 mA</b>; timing µs થી કલાકો; f<sub>max</sub> ≈ 500 kHz.</li>\n<li>ત્રણ modes: <b>monostable</b> (1 stable state), <b>astable</b> (0), <b>bistable</b> (2).</li>\n<li>Thresholds ⅔V<sub>CC</sub> અને ⅓V<sub>CC</sub> હોવાથી timing V<sub>CC</sub> થી સ્વતંત્ર છે.</li>\n</ul>"}, "key": true}]}, {"title": {"en": "5.2 Pin Diagram and Pin Functions", "gu": "5.2 Pin Diagram અને Pin ના કાર્યો"}, "items": [{"h": {"en": "5.2.1 Pin Diagram of IC 555", "gu": "5.2.1 IC 555 નો Pin Diagram"}, "body": {"en": "<p>IC 555 in an <b>8-pin DIP</b> package has four pins on each side. Looking from the <b>top</b>, with the notch upward, <b>pin 1</b> is at the top-left (near the dot / notch) and pins are numbered <b>anticlockwise</b>: 1 → 4 down the left side and 5 → 8 up the right side.</p>\n<table>\n<tr><th>Pin</th><th>Name</th><th>Pin</th><th>Name</th></tr>\n<tr><td>1</td><td>Ground (GND)</td><td>8</td><td>+V<sub>CC</sub></td></tr>\n<tr><td>2</td><td>Trigger</td><td>7</td><td>Discharge</td></tr>\n<tr><td>3</td><td>Output</td><td>6</td><td>Threshold</td></tr>\n<tr><td>4</td><td>Reset</td><td>5</td><td>Control Voltage</td></tr>\n</table>\n<p><i>Memory tip:</i> opposite pins add up to 9 → (1, 8) supply pins, (2, 7), (3, 6), (4, 5).</p>", "gu": "<p><b>8-pin DIP</b> package વાળા IC 555 માં દરેક બાજુ ચાર pins છે. Notch ઉપર રાખી <b>ઉપરથી</b> જોતાં <b>pin 1</b> ઉપર-ડાબી બાજુ (dot / notch પાસે) હોય છે અને pins <b>anticlockwise</b> ગણાય છે: ડાબી બાજુ નીચે 1 → 4 અને જમણી બાજુ ઉપર 5 → 8.</p>\n<table>\n<tr><th>Pin</th><th>નામ</th><th>Pin</th><th>નામ</th></tr>\n<tr><td>1</td><td>Ground (GND)</td><td>8</td><td>+V<sub>CC</sub></td></tr>\n<tr><td>2</td><td>Trigger</td><td>7</td><td>Discharge</td></tr>\n<tr><td>3</td><td>Output</td><td>6</td><td>Threshold</td></tr>\n<tr><td>4</td><td>Reset</td><td>5</td><td>Control Voltage</td></tr>\n</table>\n<p><i>યાદ રાખવાની રીત:</i> સામ-સામેના pins નો સરવાળો 9 → (1, 8) supply pins, (2, 7), (3, 6), (4, 5).</p>"}, "diagram": "u5_pin_diagram"}, {"h": {"en": "5.2.2 Functions of Pins 1 to 4", "gu": "5.2.2 Pin 1 થી 4 ના કાર્યો"}, "body": {"en": "<h4>Pin 1 – Ground (GND)</h4>\n<p>All voltages are measured with respect to this pin. It is connected to the <b>negative terminal</b> (0 V) of the supply.</p>\n<h4>Pin 2 – Trigger</h4>\n<ul>\n<li>It is the <b>inverting (−) input of the lower comparator</b> (comparator 2). Its other input is fixed at <b>⅓V<sub>CC</sub></b>.</li>\n<li>When the voltage at pin 2 falls <b>below ⅓V<sub>CC</sub></b>, the comparator output goes HIGH and <b>sets</b> the flip-flop → <b>output (pin 3) goes HIGH</b>.</li>\n<li>In monostable mode, a <b>negative-going trigger pulse</b> is applied here to start the timing.</li>\n<li>Normally kept above ⅓V<sub>CC</sub> using a pull-up resistor.</li>\n</ul>\n<h4>Pin 3 – Output</h4>\n<ul>\n<li>Output of the timer, taken from a <b>totem-pole output stage</b>.</li>\n<li>HIGH ≈ V<sub>CC</sub> − 1.7 V and LOW ≈ 0 V.</li>\n<li>Can <b>source</b> current (load between pin 3 and ground, ON when output HIGH) or <b>sink</b> current (load between V<sub>CC</sub> and pin 3, ON when output LOW), up to <b>200 mA</b>.</li>\n</ul>\n<h4>Pin 4 – Reset</h4>\n<ul>\n<li><b>Active-LOW</b> reset input. When a voltage <b>below about 0.7 V</b> is applied, the flip-flop is reset: <b>output goes LOW</b> and the discharge transistor turns ON, whatever the other inputs.</li>\n<li>It has the highest priority over all other inputs.</li>\n<li>When not used, it is <b>connected to +V<sub>CC</sub></b> to avoid false resetting by noise.</li>\n</ul>", "gu": "<h4>Pin 1 – Ground (GND)</h4>\n<p>બધા voltages આ pin ના સંદર્ભમાં માપાય છે. તેને supply ના <b>negative terminal</b> (0 V) સાથે જોડાય છે.</p>\n<h4>Pin 2 – Trigger</h4>\n<ul>\n<li>તે <b>નીચેના comparator (comparator 2) નો inverting (−) input</b> છે. તેનો બીજો input <b>⅓V<sub>CC</sub></b> પર નિશ્ચિત છે.</li>\n<li>Pin 2 નો voltage <b>⅓V<sub>CC</sub> થી નીચે</b> જાય ત્યારે comparator output HIGH થાય અને flip-flop ને <b>set</b> કરે → <b>output (pin 3) HIGH</b> થાય.</li>\n<li>Monostable mode માં timing શરૂ કરવા અહીં <b>negative-going trigger pulse</b> અપાય છે.</li>\n<li>સામાન્ય રીતે pull-up resistor વડે ⅓V<sub>CC</sub> થી ઉપર રખાય છે.</li>\n</ul>\n<h4>Pin 3 – Output</h4>\n<ul>\n<li>Timer નો output, <b>totem-pole output stage</b> માંથી લેવાય છે.</li>\n<li>HIGH ≈ V<sub>CC</sub> − 1.7 V અને LOW ≈ 0 V.</li>\n<li><b>Source</b> current (load pin 3 અને ground વચ્ચે, output HIGH હોય ત્યારે ON) અથવા <b>sink</b> current (load V<sub>CC</sub> અને pin 3 વચ્ચે, output LOW હોય ત્યારે ON) <b>200 mA</b> સુધી આપી શકે.</li>\n</ul>\n<h4>Pin 4 – Reset</h4>\n<ul>\n<li><b>Active-LOW</b> reset input. <b>લગભગ 0.7 V થી ઓછો</b> voltage આપતાં flip-flop reset થાય: બીજા inputs ગમે તે હોય તો પણ <b>output LOW</b> થાય અને discharge transistor ON થાય.</li>\n<li>બધા inputs કરતાં તેની priority સૌથી વધુ છે.</li>\n<li>ઉપયોગ ન હોય ત્યારે noise થી ખોટું reset ન થાય તે માટે તેને <b>+V<sub>CC</sub> સાથે જોડાય</b> છે.</li>\n</ul>"}}, {"h": {"en": "5.2.3 Functions of Pins 5 to 8", "gu": "5.2.3 Pin 5 થી 8 ના કાર્યો"}, "body": {"en": "<h4>Pin 5 – Control Voltage (CV)</h4>\n<ul>\n<li>It is connected directly to the <b>⅔V<sub>CC</sub> point</b> of the internal voltage divider (inverting input of the upper comparator).</li>\n<li>By applying an external voltage here, the threshold levels can be changed: upper = V<sub>CON</sub>, lower = V<sub>CON</sub>/2. This changes the timing / frequency → used for <b>PWM</b> and <b>voltage-controlled oscillators (VCO)</b>.</li>\n<li>When not used, it is connected to ground through a <b>0.01 µF capacitor</b> to bypass noise and keep the thresholds stable.</li>\n</ul>\n<h4>Pin 6 – Threshold</h4>\n<ul>\n<li>It is the <b>non-inverting (+) input of the upper comparator</b> (comparator 1), compared with <b>⅔V<sub>CC</sub></b>.</li>\n<li>When the voltage at pin 6 rises <b>above ⅔V<sub>CC</sub></b>, the comparator output goes HIGH and <b>resets</b> the flip-flop → <b>output goes LOW</b>.</li>\n<li>Usually connected to the timing capacitor, which it monitors.</li>\n</ul>\n<h4>Pin 7 – Discharge</h4>\n<ul>\n<li>Connected to the <b>open collector of the internal discharge transistor</b> (Q<sub>d</sub>).</li>\n<li>When output is LOW, Q<sub>d</sub> is ON (saturated) and gives a <b>discharge path</b> to the timing capacitor. When output is HIGH, Q<sub>d</sub> is OFF and the capacitor can charge.</li>\n</ul>\n<h4>Pin 8 – +V<sub>CC</sub></h4>\n<p>Positive supply pin, <b>+4.5 V to +15 V</b> with respect to pin 1. A 0.1 µF decoupling capacitor between pins 8 and 1 is recommended.</p>", "gu": "<h4>Pin 5 – Control Voltage (CV)</h4>\n<ul>\n<li>તે અંદરના voltage divider ના <b>⅔V<sub>CC</sub> બિંદુ</b> (ઉપરના comparator નો inverting input) સાથે સીધો જોડાયેલો છે.</li>\n<li>અહીં બહારનો voltage આપીને threshold levels બદલી શકાય: upper = V<sub>CON</sub>, lower = V<sub>CON</sub>/2. તેથી timing / frequency બદલાય → <b>PWM</b> અને <b>voltage-controlled oscillator (VCO)</b> માટે વપરાય.</li>\n<li>ઉપયોગ ન હોય ત્યારે noise bypass કરવા અને thresholds સ્થિર રાખવા તેને <b>0.01 µF capacitor</b> દ્વારા ground સાથે જોડાય છે.</li>\n</ul>\n<h4>Pin 6 – Threshold</h4>\n<ul>\n<li>તે <b>ઉપરના comparator (comparator 1) નો non-inverting (+) input</b> છે, જેની સરખામણી <b>⅔V<sub>CC</sub></b> સાથે થાય છે.</li>\n<li>Pin 6 નો voltage <b>⅔V<sub>CC</sub> થી ઉપર</b> જાય ત્યારે comparator output HIGH થાય અને flip-flop ને <b>reset</b> કરે → <b>output LOW</b> થાય.</li>\n<li>સામાન્ય રીતે timing capacitor સાથે જોડાય છે અને તેના voltage પર નજર રાખે છે.</li>\n</ul>\n<h4>Pin 7 – Discharge</h4>\n<ul>\n<li>અંદરના <b>discharge transistor</b> (Q<sub>d</sub>) ના <b>open collector</b> સાથે જોડાયેલો છે.</li>\n<li>Output LOW હોય ત્યારે Q<sub>d</sub> ON (saturated) હોય અને timing capacitor ને <b>discharge path</b> આપે. Output HIGH હોય ત્યારે Q<sub>d</sub> OFF હોય અને capacitor charge થઈ શકે.</li>\n</ul>\n<h4>Pin 8 – +V<sub>CC</sub></h4>\n<p>Positive supply pin, pin 1 ના સંદર્ભમાં <b>+4.5 V થી +15 V</b>. Pins 8 અને 1 વચ્ચે 0.1 µF decoupling capacitor રાખવાની ભલામણ છે.</p>"}}, {"h": {"en": "Key Points – 5.2", "gu": "મુખ્ય મુદ્દા – 5.2"}, "body": {"en": "<ul>\n<li>Pins: 1 GND, 2 Trigger, 3 Output, 4 Reset, 5 Control, 6 Threshold, 7 Discharge, 8 V<sub>CC</sub>.</li>\n<li>Trigger (2) &lt; ⅓V<sub>CC</sub> → output HIGH; Threshold (6) &gt; ⅔V<sub>CC</sub> → output LOW.</li>\n<li>Reset (4) is <b>active LOW</b> → tie to V<sub>CC</sub> when unused.</li>\n<li>Control (5) → <b>0.01 µF</b> to ground when unused; external voltage changes the thresholds.</li>\n<li>Discharge (7) → shorts the timing capacitor to ground when output is LOW.</li>\n<li>Output (3) sources / sinks up to <b>200 mA</b>.</li>\n</ul>", "gu": "<ul>\n<li>Pins: 1 GND, 2 Trigger, 3 Output, 4 Reset, 5 Control, 6 Threshold, 7 Discharge, 8 V<sub>CC</sub>.</li>\n<li>Trigger (2) &lt; ⅓V<sub>CC</sub> → output HIGH; Threshold (6) &gt; ⅔V<sub>CC</sub> → output LOW.</li>\n<li>Reset (4) <b>active LOW</b> છે → ઉપયોગ ન હોય ત્યારે V<sub>CC</sub> સાથે જોડો.</li>\n<li>Control (5) → ઉપયોગ ન હોય ત્યારે <b>0.01 µF</b> દ્વારા ground; બહારનો voltage thresholds બદલે.</li>\n<li>Discharge (7) → output LOW હોય ત્યારે timing capacitor ને ground સાથે short કરે.</li>\n<li>Output (3) <b>200 mA</b> સુધી source / sink કરે.</li>\n</ul>"}, "key": true}]}, {"title": {"en": "5.3 Functional Block Diagram of IC 555", "gu": "5.3 IC 555 નો Functional Block Diagram"}, "items": [{"h": {"en": "5.3.1 Internal Blocks of IC 555", "gu": "5.3.1 IC 555 ના અંદરના Blocks"}, "body": {"en": "<p>The internal circuit of IC 555 contains about 25 transistors, 2 diodes and 15 resistors. Functionally it can be represented by the following blocks (see diagram):</p>\n<h4>1. Voltage divider</h4>\n<p>Three equal <b>5 kΩ resistors</b> connected in series between V<sub>CC</sub> (pin 8) and ground (pin 1). They produce two <b>reference voltages</b>:</p>\n<ul>\n<li><b>⅔V<sub>CC</sub></b> at the junction of the upper two resistors (also brought out at pin 5) → reference for the upper comparator.</li>\n<li><b>⅓V<sub>CC</sub></b> at the junction of the lower two resistors → reference for the lower comparator.</li>\n</ul>\n<h4>2. Upper comparator (Comparator 1 – threshold comparator)</h4>\n<p>(+) input = threshold (pin 6), (−) input = ⅔V<sub>CC</sub>. Its output goes <b>HIGH when V<sub>6</sub> &gt; ⅔V<sub>CC</sub></b>. It drives the <b>R (reset)</b> input of the flip-flop.</p>\n<h4>3. Lower comparator (Comparator 2 – trigger comparator)</h4>\n<p>(+) input = ⅓V<sub>CC</sub>, (−) input = trigger (pin 2). Its output goes <b>HIGH when V<sub>2</sub> &lt; ⅓V<sub>CC</sub></b>. It drives the <b>S (set)</b> input of the flip-flop.</p>\n<h4>4. SR flip-flop (control flip-flop)</h4>\n<p>Stores the state. S = 1 → Q = 1, Q̄ = 0; R = 1 → Q = 0, Q̄ = 1. The <b>Q̄</b> output controls both the output stage and the discharge transistor.</p>\n<h4>5. Output stage (power amplifier / inverting buffer)</h4>\n<p>An inverting <b>totem-pole</b> amplifier driven by Q̄. So the <b>output (pin 3) = Q</b>. It gives the high current capability (200 mA) and isolates the flip-flop from the load.</p>\n<h4>6. Discharge transistor (Q<sub>d</sub>)</h4>\n<p>An NPN transistor with its base driven by Q̄, emitter grounded, and collector at pin 7. When Q̄ = 1 (output LOW) it is <b>ON</b> and discharges the external capacitor; when Q̄ = 0 (output HIGH) it is <b>OFF</b>.</p>\n<h4>7. Reset</h4>\n<p>Pin 4 directly resets the flip-flop when taken LOW (active-LOW), overriding all other inputs.</p>", "gu": "<p>IC 555 ના અંદરના circuit માં લગભગ 25 transistors, 2 diodes અને 15 resistors હોય છે. કાર્યની દૃષ્ટિએ તેને નીચેના blocks વડે દર્શાવી શકાય (આકૃતિ જુઓ):</p>\n<h4>1. Voltage divider</h4>\n<p>V<sub>CC</sub> (pin 8) અને ground (pin 1) વચ્ચે series માં જોડાયેલા ત્રણ સમાન <b>5 kΩ resistors</b>. તેઓ બે <b>reference voltages</b> બનાવે છે:</p>\n<ul>\n<li>ઉપરના બે resistors ના જોડાણ પર <b>⅔V<sub>CC</sub></b> (pin 5 પર પણ બહાર લાવેલ) → ઉપરના comparator માટે reference.</li>\n<li>નીચેના બે resistors ના જોડાણ પર <b>⅓V<sub>CC</sub></b> → નીચેના comparator માટે reference.</li>\n</ul>\n<h4>2. ઉપરનો comparator (Comparator 1 – threshold comparator)</h4>\n<p>(+) input = threshold (pin 6), (−) input = ⅔V<sub>CC</sub>. <b>V<sub>6</sub> &gt; ⅔V<sub>CC</sub> થાય ત્યારે</b> તેનો output <b>HIGH</b> થાય. તે flip-flop ના <b>R (reset)</b> input ને ચલાવે છે.</p>\n<h4>3. નીચેનો comparator (Comparator 2 – trigger comparator)</h4>\n<p>(+) input = ⅓V<sub>CC</sub>, (−) input = trigger (pin 2). <b>V<sub>2</sub> &lt; ⅓V<sub>CC</sub> થાય ત્યારે</b> તેનો output <b>HIGH</b> થાય. તે flip-flop ના <b>S (set)</b> input ને ચલાવે છે.</p>\n<h4>4. SR flip-flop (control flip-flop)</h4>\n<p>State ને સંગ્રહે છે. S = 1 → Q = 1, Q̄ = 0; R = 1 → Q = 0, Q̄ = 1. <b>Q̄</b> output, output stage અને discharge transistor બંનેને control કરે છે.</p>\n<h4>5. Output stage (power amplifier / inverting buffer)</h4>\n<p>Q̄ થી ચાલતો inverting <b>totem-pole</b> amplifier. તેથી <b>output (pin 3) = Q</b>. તે વધુ current ક્ષમતા (200 mA) આપે છે અને flip-flop ને load થી અલગ રાખે છે.</p>\n<h4>6. Discharge transistor (Q<sub>d</sub>)</h4>\n<p>NPN transistor જેનો base Q̄ થી ચાલે, emitter ground પર અને collector pin 7 પર છે. Q̄ = 1 (output LOW) હોય ત્યારે તે <b>ON</b> થઈ બહારના capacitor ને discharge કરે; Q̄ = 0 (output HIGH) હોય ત્યારે <b>OFF</b> રહે.</p>\n<h4>7. Reset</h4>\n<p>Pin 4 ને LOW કરતાં (active-LOW) તે બીજા બધા inputs ને અવગણી flip-flop ને સીધો reset કરે છે.</p>"}, "diagram": "u5_block_diagram"}, {"h": {"en": "5.3.2 Working of IC 555 (Function Table)", "gu": "5.3.2 IC 555 નું કાર્ય (Function Table)"}, "body": {"en": "<p>The working depends on the voltages at the <b>trigger (pin 2)</b> and <b>threshold (pin 6)</b> compared with ⅓V<sub>CC</sub> and ⅔V<sub>CC</sub>:</p>\n<ol>\n<li><b>Trigger &lt; ⅓V<sub>CC</sub>:</b> lower comparator output = 1 → S = 1 → flip-flop <b>set</b>, Q = 1, Q̄ = 0 → <b>output HIGH</b>, discharge transistor <b>OFF</b> → external capacitor can charge.</li>\n<li><b>Threshold &gt; ⅔V<sub>CC</sub>:</b> upper comparator output = 1 → R = 1 → flip-flop <b>reset</b>, Q = 0, Q̄ = 1 → <b>output LOW</b>, discharge transistor <b>ON</b> → capacitor discharges through pin 7.</li>\n<li><b>Trigger &gt; ⅓V<sub>CC</sub> and threshold &lt; ⅔V<sub>CC</sub>:</b> both comparator outputs = 0 → S = R = 0 → flip-flop keeps its <b>previous state</b> (no change).</li>\n<li><b>Reset (pin 4) LOW:</b> output LOW, discharge ON, regardless of other inputs.</li>\n</ol>\n<h4>Function table</h4>\n<table>\n<tr><th>Reset (4)</th><th>Trigger (2)</th><th>Threshold (6)</th><th>Output (3)</th><th>Discharge (7)</th></tr>\n<tr><td>LOW</td><td>X</td><td>X</td><td>LOW</td><td>ON (grounded)</td></tr>\n<tr><td>HIGH</td><td>&lt; ⅓V<sub>CC</sub></td><td>X</td><td>HIGH</td><td>OFF (open)</td></tr>\n<tr><td>HIGH</td><td>&gt; ⅓V<sub>CC</sub></td><td>&gt; ⅔V<sub>CC</sub></td><td>LOW</td><td>ON (grounded)</td></tr>\n<tr><td>HIGH</td><td>&gt; ⅓V<sub>CC</sub></td><td>&lt; ⅔V<sub>CC</sub></td><td>No change</td><td>No change</td></tr>\n</table>\n<p>(X = don't care.) In short: <b>the trigger turns the output ON, the threshold turns it OFF</b>. The external R and C decide how long it takes the capacitor voltage to move between ⅓V<sub>CC</sub> and ⅔V<sub>CC</sub>; this sets the timing.</p>\n<h4>Effect of control voltage</h4>\n<p>If a voltage V<sub>CON</sub> is applied at pin 5, the upper threshold becomes V<sub>CON</sub> and the lower threshold becomes V<sub>CON</sub>/2.</p>", "gu": "<p>કાર્ય <b>trigger (pin 2)</b> અને <b>threshold (pin 6)</b> ના voltages ની ⅓V<sub>CC</sub> અને ⅔V<sub>CC</sub> સાથેની સરખામણી પર આધાર રાખે છે:</p>\n<ol>\n<li><b>Trigger &lt; ⅓V<sub>CC</sub>:</b> નીચેના comparator નો output = 1 → S = 1 → flip-flop <b>set</b>, Q = 1, Q̄ = 0 → <b>output HIGH</b>, discharge transistor <b>OFF</b> → બહારનો capacitor charge થઈ શકે.</li>\n<li><b>Threshold &gt; ⅔V<sub>CC</sub>:</b> ઉપરના comparator નો output = 1 → R = 1 → flip-flop <b>reset</b>, Q = 0, Q̄ = 1 → <b>output LOW</b>, discharge transistor <b>ON</b> → capacitor pin 7 દ્વારા discharge થાય.</li>\n<li><b>Trigger &gt; ⅓V<sub>CC</sub> અને threshold &lt; ⅔V<sub>CC</sub>:</b> બંને comparator outputs = 0 → S = R = 0 → flip-flop <b>અગાઉની state</b> જાળવી રાખે (કોઈ ફેરફાર નહીં).</li>\n<li><b>Reset (pin 4) LOW:</b> બીજા inputs ગમે તે હોય, output LOW અને discharge ON.</li>\n</ol>\n<h4>Function table</h4>\n<table>\n<tr><th>Reset (4)</th><th>Trigger (2)</th><th>Threshold (6)</th><th>Output (3)</th><th>Discharge (7)</th></tr>\n<tr><td>LOW</td><td>X</td><td>X</td><td>LOW</td><td>ON (grounded)</td></tr>\n<tr><td>HIGH</td><td>&lt; ⅓V<sub>CC</sub></td><td>X</td><td>HIGH</td><td>OFF (open)</td></tr>\n<tr><td>HIGH</td><td>&gt; ⅓V<sub>CC</sub></td><td>&gt; ⅔V<sub>CC</sub></td><td>LOW</td><td>ON (grounded)</td></tr>\n<tr><td>HIGH</td><td>&gt; ⅓V<sub>CC</sub></td><td>&lt; ⅔V<sub>CC</sub></td><td>ફેરફાર નહીં</td><td>ફેરફાર નહીં</td></tr>\n</table>\n<p>(X = don't care.) ટૂંકમાં: <b>trigger output ને ON કરે, threshold તેને OFF કરે</b>. બહારના R અને C નક્કી કરે છે કે capacitor voltage ને ⅓V<sub>CC</sub> અને ⅔V<sub>CC</sub> વચ્ચે જતાં કેટલો સમય લાગે; આનાથી timing નક્કી થાય છે.</p>\n<h4>Control voltage ની અસર</h4>\n<p>Pin 5 પર V<sub>CON</sub> voltage આપીએ તો upper threshold V<sub>CON</sub> અને lower threshold V<sub>CON</sub>/2 બને છે.</p>"}, "examples": ["u5n7"]}, {"h": {"en": "Key Points – 5.3", "gu": "મુખ્ય મુદ્દા – 5.3"}, "body": {"en": "<ul>\n<li>Blocks: <b>3 × 5 kΩ divider, 2 comparators, SR flip-flop, output stage, discharge transistor, reset</b>.</li>\n<li>Divider gives references <b>⅔V<sub>CC</sub></b> (upper comparator) and <b>⅓V<sub>CC</sub></b> (lower comparator).</li>\n<li>Upper comparator → R input (threshold &gt; ⅔V<sub>CC</sub> → output LOW).</li>\n<li>Lower comparator → S input (trigger &lt; ⅓V<sub>CC</sub> → output HIGH).</li>\n<li>Output LOW ⇔ discharge transistor ON; output HIGH ⇔ discharge transistor OFF.</li>\n<li>With pin 5 voltage V<sub>CON</sub>: thresholds = V<sub>CON</sub> and V<sub>CON</sub>/2.</li>\n</ul>", "gu": "<ul>\n<li>Blocks: <b>3 × 5 kΩ divider, 2 comparators, SR flip-flop, output stage, discharge transistor, reset</b>.</li>\n<li>Divider references આપે: <b>⅔V<sub>CC</sub></b> (ઉપરનો comparator) અને <b>⅓V<sub>CC</sub></b> (નીચેનો comparator).</li>\n<li>ઉપરનો comparator → R input (threshold &gt; ⅔V<sub>CC</sub> → output LOW).</li>\n<li>નીચેનો comparator → S input (trigger &lt; ⅓V<sub>CC</sub> → output HIGH).</li>\n<li>Output LOW ⇔ discharge transistor ON; output HIGH ⇔ discharge transistor OFF.</li>\n<li>Pin 5 પર V<sub>CON</sub> હોય તો: thresholds = V<sub>CON</sub> અને V<sub>CON</sub>/2.</li>\n</ul>"}, "key": true}]}, {"title": {"en": "5.4 Applications of IC 555", "gu": "5.4 IC 555 ના ઉપયોગો"}, "items": [{"h": {"en": "5.4.1 555 as Monostable Multivibrator – Circuit and Working", "gu": "5.4.1 Monostable Multivibrator તરીકે 555 – Circuit અને કાર્ય"}, "body": {"en": "<p>A <b>monostable multivibrator</b> (one-shot) has <b>one stable state</b> (output LOW) and one <b>quasi-stable</b> (temporary) state (output HIGH). When triggered, the output goes HIGH for a fixed time <b>T = 1.1RC</b> and then returns to LOW by itself.</p>\n<h4>Circuit (see diagram)</h4>\n<ul>\n<li>Pin 8 and pin 4 → +V<sub>CC</sub>; pin 1 → ground; pin 5 → 0.01 µF to ground.</li>\n<li>Timing resistor <b>R</b> from V<sub>CC</sub> to pins 6 and 7 (joined together); timing capacitor <b>C</b> from pins 6/7 to ground.</li>\n<li>Trigger input at pin 2, held HIGH by a <b>10 kΩ pull-up</b>; a push switch (or negative pulse) pulls it LOW.</li>\n<li>Output at pin 3 (e.g. LED with series resistor).</li>\n</ul>\n<h4>Working</h4>\n<ol>\n<li><b>Stable state:</b> Trigger is HIGH (&gt; ⅓V<sub>CC</sub>). Flip-flop is reset, Q̄ = 1 → <b>output LOW</b>, discharge transistor <b>ON</b> → capacitor C is shorted, V<sub>C</sub> ≈ 0. The circuit stays like this indefinitely.</li>\n<li><b>Triggering:</b> A <b>negative-going pulse</b> at pin 2 takes it below <b>⅓V<sub>CC</sub></b>. The lower comparator <b>sets</b> the flip-flop → Q̄ = 0 → <b>output HIGH</b>, discharge transistor <b>OFF</b>.</li>\n<li><b>Timing (quasi-stable state):</b> C now <b>charges through R</b> towards V<sub>CC</sub> (exponentially, time constant RC).</li>\n<li><b>End of pulse:</b> When V<sub>C</sub> reaches <b>⅔V<sub>CC</sub></b>, the upper comparator <b>resets</b> the flip-flop → <b>output LOW</b>, discharge transistor <b>ON</b> → C discharges quickly to 0 V.</li>\n<li>The circuit is back in its stable state and waits for the next trigger.</li>\n</ol>\n<p><b>Pulse width:</b> <b>T = 1.1 RC</b> (seconds, with R in Ω and C in F).</p>\n<h4>Important points</h4>\n<ul>\n<li>The trigger pulse must be <b>shorter than T</b>; otherwise the output stays HIGH as long as the trigger is LOW.</li>\n<li>Further triggers during the timing period have no effect (<b>non-retriggerable</b>).</li>\n<li>Applying LOW to reset (pin 4) during timing ends the pulse immediately.</li>\n<li>Applications: time delay, timer, pulse stretching, switch debouncing, missing-pulse detector, frequency divider, gate pulse for frequency counter.</li>\n</ul>", "gu": "<p><b>Monostable multivibrator</b> (one-shot) માં <b>એક stable state</b> (output LOW) અને એક <b>quasi-stable</b> (કામચલાઉ) state (output HIGH) હોય છે. Trigger મળતાં output નિશ્ચિત સમય <b>T = 1.1RC</b> માટે HIGH થાય અને પછી આપોઆપ LOW થઈ જાય.</p>\n<h4>Circuit (આકૃતિ જુઓ)</h4>\n<ul>\n<li>Pin 8 અને pin 4 → +V<sub>CC</sub>; pin 1 → ground; pin 5 → 0.01 µF દ્વારા ground.</li>\n<li>Timing resistor <b>R</b> V<sub>CC</sub> થી pins 6 અને 7 (એકસાથે જોડેલા) સુધી; timing capacitor <b>C</b> pins 6/7 થી ground સુધી.</li>\n<li>Pin 2 પર trigger input, <b>10 kΩ pull-up</b> વડે HIGH રાખેલ; push switch (અથવા negative pulse) તેને LOW કરે.</li>\n<li>Pin 3 પર output (દા.ત. series resistor સાથે LED).</li>\n</ul>\n<h4>કાર્ય</h4>\n<ol>\n<li><b>Stable state:</b> Trigger HIGH (&gt; ⅓V<sub>CC</sub>) છે. Flip-flop reset, Q̄ = 1 → <b>output LOW</b>, discharge transistor <b>ON</b> → capacitor C short, V<sub>C</sub> ≈ 0. Circuit અનિશ્ચિત સમય સુધી આમ જ રહે.</li>\n<li><b>Triggering:</b> Pin 2 પર <b>negative-going pulse</b> તેને <b>⅓V<sub>CC</sub></b> થી નીચે લઈ જાય. નીચેનો comparator flip-flop ને <b>set</b> કરે → Q̄ = 0 → <b>output HIGH</b>, discharge transistor <b>OFF</b>.</li>\n<li><b>Timing (quasi-stable state):</b> હવે C, <b>R દ્વારા charge</b> થઈ V<sub>CC</sub> તરફ જાય (exponential, time constant RC).</li>\n<li><b>Pulse નો અંત:</b> V<sub>C</sub> <b>⅔V<sub>CC</sub></b> પર પહોંચે ત્યારે ઉપરનો comparator flip-flop ને <b>reset</b> કરે → <b>output LOW</b>, discharge transistor <b>ON</b> → C ઝડપથી 0 V સુધી discharge થાય.</li>\n<li>Circuit ફરી stable state માં આવે અને આગલા trigger ની રાહ જુએ.</li>\n</ol>\n<p><b>Pulse width:</b> <b>T = 1.1 RC</b> (seconds, R Ω માં અને C F માં).</p>\n<h4>મહત્વના મુદ્દા</h4>\n<ul>\n<li>Trigger pulse <b>T કરતાં ટૂંકો</b> હોવો જોઈએ; નહીં તો trigger LOW રહે ત્યાં સુધી output HIGH રહે.</li>\n<li>Timing દરમિયાન આવતા બીજા triggers ની કોઈ અસર નથી (<b>non-retriggerable</b>).</li>\n<li>Timing દરમિયાન reset (pin 4) ને LOW કરતાં pulse તરત પૂરો થાય.</li>\n<li>ઉપયોગો: time delay, timer, pulse stretching, switch debouncing, missing-pulse detector, frequency divider, frequency counter માટે gate pulse.</li>\n</ul>"}, "diagram": "u5_mono_circuit", "examples": ["u5n1", "u5n2"]}, {"h": {"en": "5.4.2 Monostable – Waveforms and Pulse Width (T = 1.1RC)", "gu": "5.4.2 Monostable – Waveforms અને Pulse Width (T = 1.1RC)"}, "body": {"en": "<h4>Waveforms (see diagram)</h4>\n<ul>\n<li><b>Trigger (pin 2):</b> normally HIGH; a short negative pulse below ⅓V<sub>CC</sub> starts the cycle.</li>\n<li><b>Output (pin 3):</b> goes HIGH at the trigger instant and stays HIGH for time T, then LOW.</li>\n<li><b>Capacitor voltage V<sub>C</sub> (pins 6, 7):</b> rises exponentially from 0 to ⅔V<sub>CC</sub> during T, then falls suddenly to 0 when discharged.</li>\n</ul>\n<h4>Derivation of T = 1.1RC</h4>\n<p>During the timing period C charges from 0 V towards V<sub>CC</sub> through R:</p>\n<p style=\"text-align:center\"><b>V<sub>C</sub> = V<sub>CC</sub> (1 − e<sup>−t/RC</sup>)</b></p>\n<p>The pulse ends when V<sub>C</sub> = ⅔V<sub>CC</sub> at t = T:</p>\n<p>⅔V<sub>CC</sub> = V<sub>CC</sub> (1 − e<sup>−T/RC</sup>) → e<sup>−T/RC</sup> = ⅓ → T/RC = ln 3 = 1.0986</p>\n<p style=\"text-align:center\"><b>T = 1.0986 RC ≈ 1.1 RC</b></p>\n<p><b>Note:</b> V<sub>CC</sub> cancels out, so the pulse width does <b>not depend on the supply voltage</b>. It depends only on R and C.</p>\n<h4>Choice of components</h4>\n<ul>\n<li>R: about 1 kΩ to 1 MΩ (higher values make leakage currents important).</li>\n<li>C: about 470 pF to a few hundred µF; use low-leakage capacitors for long delays.</li>\n<li>To vary T, use a potentiometer (with a series fixed resistor) in place of R.</li>\n</ul>", "gu": "<h4>Waveforms (આકૃતિ જુઓ)</h4>\n<ul>\n<li><b>Trigger (pin 2):</b> સામાન્ય રીતે HIGH; ⅓V<sub>CC</sub> થી નીચેનો ટૂંકો negative pulse cycle શરૂ કરે.</li>\n<li><b>Output (pin 3):</b> trigger ની ક્ષણે HIGH થાય, T સમય સુધી HIGH રહે, પછી LOW.</li>\n<li><b>Capacitor voltage V<sub>C</sub> (pins 6, 7):</b> T દરમિયાન 0 થી ⅔V<sub>CC</sub> સુધી exponential રીતે વધે, પછી discharge થતાં અચાનક 0 થાય.</li>\n</ul>\n<h4>T = 1.1RC ની સાબિતી (Derivation)</h4>\n<p>Timing સમય દરમિયાન C, R દ્વારા 0 V થી V<sub>CC</sub> તરફ charge થાય છે:</p>\n<p style=\"text-align:center\"><b>V<sub>C</sub> = V<sub>CC</sub> (1 − e<sup>−t/RC</sup>)</b></p>\n<p>t = T પર V<sub>C</sub> = ⅔V<sub>CC</sub> થાય ત્યારે pulse પૂરો થાય:</p>\n<p>⅔V<sub>CC</sub> = V<sub>CC</sub> (1 − e<sup>−T/RC</sup>) → e<sup>−T/RC</sup> = ⅓ → T/RC = ln 3 = 1.0986</p>\n<p style=\"text-align:center\"><b>T = 1.0986 RC ≈ 1.1 RC</b></p>\n<p><b>નોંધ:</b> V<sub>CC</sub> cancel થઈ જાય છે, તેથી pulse width <b>supply voltage પર આધાર રાખતી નથી</b>. તે ફક્ત R અને C પર આધાર રાખે છે.</p>\n<h4>Components ની પસંદગી</h4>\n<ul>\n<li>R: લગભગ 1 kΩ થી 1 MΩ (વધુ મૂલ્યે leakage currents મહત્વના બને).</li>\n<li>C: લગભગ 470 pF થી થોડા સો µF; લાંબા delay માટે low-leakage capacitors વાપરો.</li>\n<li>T બદલવા R ની જગ્યાએ potentiometer (series fixed resistor સાથે) વાપરો.</li>\n</ul>"}, "diagram": "u5_mono_wave"}, {"h": {"en": "5.4.3 555 as Astable Multivibrator (Oscillator) – Circuit and Working", "gu": "5.4.3 Astable Multivibrator (Oscillator) તરીકે 555 – Circuit અને કાર્ય"}, "body": {"en": "<p>An <b>astable multivibrator</b> has <b>no stable state</b>. Its output switches continuously between HIGH and LOW <b>without any external trigger</b>, producing a <b>rectangular (square) wave</b>. So it works as a <b>free-running oscillator</b> or clock generator.</p>\n<h4>Circuit (see diagram)</h4>\n<ul>\n<li>Pin 8 and pin 4 → +V<sub>CC</sub>; pin 1 → ground; pin 5 → 0.01 µF to ground.</li>\n<li><b>R<sub>A</sub></b> between V<sub>CC</sub> and pin 7; <b>R<sub>B</sub></b> between pin 7 and pins 6 + 2.</li>\n<li>Timing capacitor <b>C</b> from pins 6 and 2 (joined together) to ground.</li>\n<li>Output at pin 3.</li>\n</ul>\n<h4>Working</h4>\n<ol>\n<li><b>At switch-on:</b> V<sub>C</sub> = 0 &lt; ⅓V<sub>CC</sub> → trigger comparator sets the flip-flop → <b>output HIGH</b>, discharge transistor OFF.</li>\n<li><b>Charging (t<sub>H</sub>):</b> C charges through <b>R<sub>A</sub> + R<sub>B</sub></b> towards V<sub>CC</sub>. Output stays HIGH.</li>\n<li>When V<sub>C</sub> reaches <b>⅔V<sub>CC</sub></b>, the threshold comparator resets the flip-flop → <b>output LOW</b>, discharge transistor ON (pin 7 grounded).</li>\n<li><b>Discharging (t<sub>L</sub>):</b> C discharges through <b>R<sub>B</sub> only</b> into pin 7. Output stays LOW.</li>\n<li>When V<sub>C</sub> falls to <b>⅓V<sub>CC</sub></b>, the trigger comparator sets the flip-flop again → output HIGH, discharge OFF, and C starts charging again.</li>\n<li>The cycle repeats: V<sub>C</sub> swings between <b>⅓V<sub>CC</sub> and ⅔V<sub>CC</sub></b> and the output is a continuous rectangular wave.</li>\n</ol>\n<p><i>Note:</i> the first HIGH period after switch-on is longer (C charges from 0 instead of ⅓V<sub>CC</sub>), about 1.1(R<sub>A</sub> + R<sub>B</sub>)C.</p>\n<h4>Applications</h4>\n<p>Square-wave / clock generator, LED flasher, tone and siren generators, metronome, traffic-light sequencer clock, PWM, voltage-controlled oscillator (using pin 5).</p>", "gu": "<p><b>Astable multivibrator</b> માં <b>કોઈ stable state નથી</b>. તેનો output <b>બહારના trigger વગર</b> સતત HIGH અને LOW વચ્ચે બદલાતો રહે છે અને <b>rectangular (square) wave</b> બનાવે છે. તેથી તે <b>free-running oscillator</b> અથવા clock generator તરીકે કામ કરે છે.</p>\n<h4>Circuit (આકૃતિ જુઓ)</h4>\n<ul>\n<li>Pin 8 અને pin 4 → +V<sub>CC</sub>; pin 1 → ground; pin 5 → 0.01 µF દ્વારા ground.</li>\n<li><b>R<sub>A</sub></b> V<sub>CC</sub> અને pin 7 વચ્ચે; <b>R<sub>B</sub></b> pin 7 અને pins 6 + 2 વચ્ચે.</li>\n<li>Timing capacitor <b>C</b> pins 6 અને 2 (એકસાથે જોડેલા) થી ground સુધી.</li>\n<li>Pin 3 પર output.</li>\n</ul>\n<h4>કાર્ય</h4>\n<ol>\n<li><b>Switch-on વખતે:</b> V<sub>C</sub> = 0 &lt; ⅓V<sub>CC</sub> → trigger comparator flip-flop ને set કરે → <b>output HIGH</b>, discharge transistor OFF.</li>\n<li><b>Charging (t<sub>H</sub>):</b> C, <b>R<sub>A</sub> + R<sub>B</sub></b> દ્વારા V<sub>CC</sub> તરફ charge થાય. Output HIGH રહે.</li>\n<li>V<sub>C</sub> <b>⅔V<sub>CC</sub></b> પર પહોંચે ત્યારે threshold comparator flip-flop ને reset કરે → <b>output LOW</b>, discharge transistor ON (pin 7 grounded).</li>\n<li><b>Discharging (t<sub>L</sub>):</b> C <b>ફક્ત R<sub>B</sub></b> દ્વારા pin 7 માં discharge થાય. Output LOW રહે.</li>\n<li>V<sub>C</sub> ઘટીને <b>⅓V<sub>CC</sub></b> થાય ત્યારે trigger comparator ફરી flip-flop ને set કરે → output HIGH, discharge OFF, અને C ફરી charge થવા લાગે.</li>\n<li>Cycle પુનરાવર્તિત થાય: V<sub>C</sub> <b>⅓V<sub>CC</sub> અને ⅔V<sub>CC</sub></b> વચ્ચે ઝૂલે અને output સતત rectangular wave બને.</li>\n</ol>\n<p><i>નોંધ:</i> Switch-on પછીનો પહેલો HIGH સમય લાંબો હોય છે (C, ⅓V<sub>CC</sub> ની જગ્યાએ 0 થી charge થાય), લગભગ 1.1(R<sub>A</sub> + R<sub>B</sub>)C.</p>\n<h4>ઉપયોગો</h4>\n<p>Square-wave / clock generator, LED flasher, tone અને siren generators, metronome, traffic-light sequencer clock, PWM, voltage-controlled oscillator (pin 5 વાપરીને).</p>"}, "diagram": "u5_astable_circuit", "examples": ["u5n3"]}, {"h": {"en": "5.4.4 Astable – Waveforms, Frequency and Duty Cycle", "gu": "5.4.4 Astable – Waveforms, Frequency અને Duty Cycle"}, "body": {"en": "<h4>Waveforms (see diagram)</h4>\n<ul>\n<li><b>V<sub>C</sub>:</b> after the first cycle, rises (charging) and falls (discharging) exponentially between ⅓V<sub>CC</sub> and ⅔V<sub>CC</sub>.</li>\n<li><b>Output:</b> HIGH while C charges (t<sub>H</sub>), LOW while C discharges (t<sub>L</sub>).</li>\n</ul>\n<h4>Derivation of timing</h4>\n<p><b>Charging</b> from ⅓V<sub>CC</sub> to ⅔V<sub>CC</sub> through (R<sub>A</sub> + R<sub>B</sub>):</p>\n<p>V<sub>C</sub> = V<sub>CC</sub> − (V<sub>CC</sub> − ⅓V<sub>CC</sub>) e<sup>−t/τ</sup>; putting V<sub>C</sub> = ⅔V<sub>CC</sub> → ⅓ = ⅔ e<sup>−t/τ</sup> → t = τ ln 2 = 0.693τ</p>\n<p style=\"text-align:center\"><b>t<sub>H</sub> = 0.693 (R<sub>A</sub> + R<sub>B</sub>) C</b></p>\n<p><b>Discharging</b> from ⅔V<sub>CC</sub> to ⅓V<sub>CC</sub> through R<sub>B</sub>: V<sub>C</sub> = ⅔V<sub>CC</sub> e<sup>−t/R<sub>B</sub>C</sup> = ⅓V<sub>CC</sub> → t = 0.693 R<sub>B</sub>C</p>\n<p style=\"text-align:center\"><b>t<sub>L</sub> = 0.693 R<sub>B</sub> C</b></p>\n<h4>Total time period and frequency</h4>\n<p style=\"text-align:center\"><b>T = t<sub>H</sub> + t<sub>L</sub> = 0.693 (R<sub>A</sub> + 2R<sub>B</sub>) C</b></p>\n<p style=\"text-align:center\"><b>f = 1/T = 1.44 / [(R<sub>A</sub> + 2R<sub>B</sub>) C]</b></p>\n<h4>Duty cycle</h4>\n<p>Duty cycle = ratio of HIGH time to total time:</p>\n<p style=\"text-align:center\"><b>D = t<sub>H</sub> / T × 100 % = (R<sub>A</sub> + R<sub>B</sub>) / (R<sub>A</sub> + 2R<sub>B</sub>) × 100 %</b></p>\n<ul>\n<li>Since t<sub>H</sub> &gt; t<sub>L</sub> always, the duty cycle of the basic circuit is <b>always more than 50 %</b>.</li>\n<li>If R<sub>B</sub> ≫ R<sub>A</sub>, D approaches 50 % (nearly square wave).</li>\n<li><b>Exactly 50 % (or less):</b> connect a <b>diode across R<sub>B</sub></b> (anode at pin 7). C then charges through R<sub>A</sub> and the diode, and discharges through R<sub>B</sub>, so t<sub>H</sub> = 0.693R<sub>A</sub>C and t<sub>L</sub> = 0.693R<sub>B</sub>C. With R<sub>A</sub> = R<sub>B</sub>, D = 50 %.</li>\n<li>R<sub>A</sub> must not be zero, otherwise pin 7 would short V<sub>CC</sub> when the discharge transistor turns ON (minimum about 1 kΩ).</li>\n</ul>", "gu": "<h4>Waveforms (આકૃતિ જુઓ)</h4>\n<ul>\n<li><b>V<sub>C</sub>:</b> પહેલા cycle પછી ⅓V<sub>CC</sub> અને ⅔V<sub>CC</sub> વચ્ચે exponential રીતે વધે (charging) અને ઘટે (discharging).</li>\n<li><b>Output:</b> C charge થાય ત્યારે HIGH (t<sub>H</sub>), C discharge થાય ત્યારે LOW (t<sub>L</sub>).</li>\n</ul>\n<h4>Timing ની સાબિતી (Derivation)</h4>\n<p>(R<sub>A</sub> + R<sub>B</sub>) દ્વારા ⅓V<sub>CC</sub> થી ⅔V<sub>CC</sub> સુધી <b>Charging</b>:</p>\n<p>V<sub>C</sub> = V<sub>CC</sub> − (V<sub>CC</sub> − ⅓V<sub>CC</sub>) e<sup>−t/τ</sup>; V<sub>C</sub> = ⅔V<sub>CC</sub> મૂકતાં → ⅓ = ⅔ e<sup>−t/τ</sup> → t = τ ln 2 = 0.693τ</p>\n<p style=\"text-align:center\"><b>t<sub>H</sub> = 0.693 (R<sub>A</sub> + R<sub>B</sub>) C</b></p>\n<p>R<sub>B</sub> દ્વારા ⅔V<sub>CC</sub> થી ⅓V<sub>CC</sub> સુધી <b>Discharging</b>: V<sub>C</sub> = ⅔V<sub>CC</sub> e<sup>−t/R<sub>B</sub>C</sup> = ⅓V<sub>CC</sub> → t = 0.693 R<sub>B</sub>C</p>\n<p style=\"text-align:center\"><b>t<sub>L</sub> = 0.693 R<sub>B</sub> C</b></p>\n<h4>કુલ time period અને frequency</h4>\n<p style=\"text-align:center\"><b>T = t<sub>H</sub> + t<sub>L</sub> = 0.693 (R<sub>A</sub> + 2R<sub>B</sub>) C</b></p>\n<p style=\"text-align:center\"><b>f = 1/T = 1.44 / [(R<sub>A</sub> + 2R<sub>B</sub>) C]</b></p>\n<h4>Duty cycle</h4>\n<p>Duty cycle = HIGH સમય અને કુલ સમયનો ગુણોત્તર:</p>\n<p style=\"text-align:center\"><b>D = t<sub>H</sub> / T × 100 % = (R<sub>A</sub> + R<sub>B</sub>) / (R<sub>A</sub> + 2R<sub>B</sub>) × 100 %</b></p>\n<ul>\n<li>t<sub>H</sub> &gt; t<sub>L</sub> હંમેશા હોવાથી basic circuit નો duty cycle <b>હંમેશા 50 % થી વધુ</b> હોય છે.</li>\n<li>R<sub>B</sub> ≫ R<sub>A</sub> હોય તો D લગભગ 50 % (લગભગ square wave).</li>\n<li><b>બરાબર 50 % (અથવા ઓછો):</b> <b>R<sub>B</sub> ની સમાંતર diode</b> (anode pin 7 તરફ) જોડો. પછી C, R<sub>A</sub> અને diode દ્વારા charge થાય અને R<sub>B</sub> દ્વારા discharge થાય, તેથી t<sub>H</sub> = 0.693R<sub>A</sub>C અને t<sub>L</sub> = 0.693R<sub>B</sub>C. R<sub>A</sub> = R<sub>B</sub> રાખતાં D = 50 %.</li>\n<li>R<sub>A</sub> શૂન્ય ન હોવો જોઈએ, નહીં તો discharge transistor ON થતાં pin 7 V<sub>CC</sub> ને short કરે (ન્યૂનતમ લગભગ 1 kΩ).</li>\n</ul>"}, "diagram": "u5_astable_wave", "examples": ["u5n4"]}, {"h": {"en": "5.4.5 555 as Pulse Generator (LED Flasher)", "gu": "5.4.5 Pulse Generator (LED Flasher) તરીકે 555"}, "body": {"en": "<p>A <b>pulse generator</b> produces a continuous train of rectangular pulses of required frequency and width. The <b>astable 555</b> is the simplest pulse generator. A common laboratory example is the <b>LED flasher</b> (see diagram).</p>\n<h4>Circuit</h4>\n<ul>\n<li>Basic astable circuit with R<sub>A</sub> = 10 kΩ, R<sub>B</sub> = 68 kΩ, C = 10 µF (frequency ≈ 1 Hz).</li>\n<li><b>LED2</b> + 470 Ω from pin 3 to <b>ground</b> → current is <b>sourced</b> by the 555.</li>\n<li><b>LED1</b> + 470 Ω from <b>+V<sub>CC</sub></b> to pin 3 → current is <b>sunk</b> by the 555.</li>\n</ul>\n<h4>Working</h4>\n<ul>\n<li>When <b>output is HIGH</b> (C charging), current flows from pin 3 through LED2 to ground → <b>LED2 ON</b>, LED1 OFF (no voltage across it).</li>\n<li>When <b>output is LOW</b> (C discharging), current flows from V<sub>CC</sub> through LED1 into pin 3 → <b>LED1 ON</b>, LED2 OFF.</li>\n<li>So the two LEDs flash <b>alternately</b> about once per second. For a single flasher, use only one LED.</li>\n<li>Flash rate is changed by changing R<sub>B</sub> or C (a potentiometer can be used in place of R<sub>B</sub>).</li>\n</ul>\n<h4>Other pulse-generator uses</h4>\n<ul>\n<li><b>Clock pulses</b> for digital counters and logic circuits (output is TTL compatible at 5 V).</li>\n<li><b>Tone / buzzer generator:</b> with small C (e.g. 0.01 µF) the frequency is in the audio range; a speaker gives a tone.</li>\n<li><b>PWM generator:</b> varying the voltage at pin 5 changes the pulse width – used in motor speed and LED brightness control.</li>\n<li>A <b>monostable</b> 555 is used as a <b>single-pulse generator</b> (one clean pulse of fixed width for each trigger).</li>\n</ul>", "gu": "<p><b>Pulse generator</b> જરૂરી frequency અને width વાળા rectangular pulses ની સતત હારમાળા બનાવે છે. <b>Astable 555</b> સૌથી સરળ pulse generator છે. Laboratory નું સામાન્ય ઉદાહરણ <b>LED flasher</b> છે (આકૃતિ જુઓ).</p>\n<h4>Circuit</h4>\n<ul>\n<li>R<sub>A</sub> = 10 kΩ, R<sub>B</sub> = 68 kΩ, C = 10 µF સાથેનો basic astable circuit (frequency ≈ 1 Hz).</li>\n<li><b>LED2</b> + 470 Ω pin 3 થી <b>ground</b> સુધી → 555 current <b>source</b> કરે.</li>\n<li><b>LED1</b> + 470 Ω <b>+V<sub>CC</sub></b> થી pin 3 સુધી → 555 current <b>sink</b> કરે.</li>\n</ul>\n<h4>કાર્ય</h4>\n<ul>\n<li><b>Output HIGH</b> (C charging) હોય ત્યારે current pin 3 થી LED2 દ્વારા ground માં વહે → <b>LED2 ON</b>, LED1 OFF (તેના પર voltage નથી).</li>\n<li><b>Output LOW</b> (C discharging) હોય ત્યારે current V<sub>CC</sub> થી LED1 દ્વારા pin 3 માં વહે → <b>LED1 ON</b>, LED2 OFF.</li>\n<li>આમ બંને LEDs લગભગ દર સેકન્ડે <b>વારાફરતી</b> ઝબકે. એક જ flasher માટે ફક્ત એક LED વાપરો.</li>\n<li>R<sub>B</sub> અથવા C બદલીને flash rate બદલાય (R<sub>B</sub> ની જગ્યાએ potentiometer વાપરી શકાય).</li>\n</ul>\n<h4>Pulse generator ના બીજા ઉપયોગો</h4>\n<ul>\n<li>Digital counters અને logic circuits માટે <b>clock pulses</b> (5 V પર output TTL compatible).</li>\n<li><b>Tone / buzzer generator:</b> નાના C (દા.ત. 0.01 µF) સાથે frequency audio range માં આવે; speaker tone આપે.</li>\n<li><b>PWM generator:</b> pin 5 નો voltage બદલતાં pulse width બદલાય – motor speed અને LED brightness control માં વપરાય.</li>\n<li><b>Monostable</b> 555 <b>single-pulse generator</b> તરીકે વપરાય (દરેક trigger માટે નિશ્ચિત width નો એક સ્વચ્છ pulse).</li>\n</ul>"}, "diagram": "u5_led_flasher", "examples": ["u5n5"]}, {"h": {"en": "5.4.6 555 as Timer (Time-Delay Circuit)", "gu": "5.4.6 Timer (Time-Delay Circuit) તરીકે 555"}, "body": {"en": "<p>The most direct use of the 555 is as a <b>timer</b>: it keeps a load ON (or OFF) for a fixed, adjustable time after a start signal. The <b>monostable</b> circuit is used for this (see the monostable circuit diagram).</p>\n<h4>Circuit idea</h4>\n<ul>\n<li>Monostable 555 with timing components R and C (T = 1.1RC). R can be a potentiometer + fixed resistor for adjustable time.</li>\n<li>A <b>START push button</b> at pin 2 (with 10 kΩ pull-up) triggers the timer.</li>\n<li>An optional <b>STOP / RESET push button</b> at pin 4 (with pull-up) ends the timing early.</li>\n<li>Pin 3 drives the load directly (LED, buzzer) or through a <b>relay</b> (with a freewheeling diode across the relay coil) for AC loads such as a lamp.</li>\n</ul>\n<h4>Working</h4>\n<ol>\n<li>Pressing START pulls pin 2 below ⅓V<sub>CC</sub> → output HIGH → relay energises → load ON.</li>\n<li>C charges through R; after <b>T = 1.1RC</b>, V<sub>C</sub> = ⅔V<sub>CC</sub> → output LOW → relay de-energises → load OFF automatically.</li>\n<li>Pressing RESET at any time makes the output LOW immediately.</li>\n</ol>\n<h4>Examples of timer applications</h4>\n<ul>\n<li>Staircase / corridor light timer (light ON for 1–2 minutes after pressing a button).</li>\n<li>Delay timer for washing machines, photographic enlargers, battery chargers, microwave ovens.</li>\n<li>Power-on delay (e.g. switch on speakers a few seconds after amplifier power-up).</li>\n<li>Quiz buzzer / game timer, egg timer, auto switch-off for gadgets.</li>\n<li>Very long delays (minutes to hours) are made by using a 555 astable with a counter IC.</li>\n</ul>", "gu": "<p>555 નો સૌથી સીધો ઉપયોગ <b>timer</b> તરીકે છે: start signal પછી તે load ને નિશ્ચિત, બદલી શકાય તેવા સમય માટે ON (અથવા OFF) રાખે છે. આ માટે <b>monostable</b> circuit વપરાય છે (monostable circuit આકૃતિ જુઓ).</p>\n<h4>Circuit ની રચના</h4>\n<ul>\n<li>Timing components R અને C (T = 1.1RC) સાથે monostable 555. સમય બદલવા R ની જગ્યાએ potentiometer + fixed resistor રાખી શકાય.</li>\n<li>Pin 2 પર <b>START push button</b> (10 kΩ pull-up સાથે) timer ને trigger કરે.</li>\n<li>Pin 4 પર વૈકલ્પિક <b>STOP / RESET push button</b> (pull-up સાથે) timing ને વહેલું પૂરું કરે.</li>\n<li>Pin 3 load ને સીધો (LED, buzzer) અથવા lamp જેવા AC loads માટે <b>relay</b> (relay coil ની સમાંતર freewheeling diode સાથે) દ્વારા ચલાવે.</li>\n</ul>\n<h4>કાર્ય</h4>\n<ol>\n<li>START દબાવતાં pin 2 ⅓V<sub>CC</sub> થી નીચે જાય → output HIGH → relay energise થાય → load ON.</li>\n<li>C, R દ્વારા charge થાય; <b>T = 1.1RC</b> પછી V<sub>C</sub> = ⅔V<sub>CC</sub> → output LOW → relay de-energise થાય → load આપોઆપ OFF.</li>\n<li>ગમે ત્યારે RESET દબાવતાં output તરત LOW થાય.</li>\n</ol>\n<h4>Timer ઉપયોગોના ઉદાહરણો</h4>\n<ul>\n<li>Staircase / corridor light timer (button દબાવ્યા પછી 1–2 મિનિટ light ON).</li>\n<li>Washing machines, photographic enlargers, battery chargers, microwave ovens માટે delay timer.</li>\n<li>Power-on delay (દા.ત. amplifier ચાલુ થયા પછી થોડી સેકન્ડે speakers ચાલુ કરવા).</li>\n<li>Quiz buzzer / game timer, egg timer, gadgets માટે auto switch-off.</li>\n<li>ખૂબ લાંબા delay (મિનિટો થી કલાકો) 555 astable અને counter IC વાપરીને બનાવાય.</li>\n</ul>"}}, {"h": {"en": "5.4.7 555 in Frequency Counter", "gu": "5.4.7 Frequency Counter માં 555"}, "body": {"en": "<p>A <b>frequency counter</b> measures the frequency of an unknown signal by <b>counting the number of cycles in a known time interval</b> (called the <b>gate time</b>). The 555 timer is used to produce this accurate <b>gate pulse</b> (see block diagram).</p>\n<p style=\"text-align:center\"><b>f<sub>x</sub> = N / T<sub>gate</sub></b> (N = number of pulses counted)</p>\n<p>If T<sub>gate</sub> = 1 s, the count N directly equals the frequency in Hz.</p>\n<h4>Blocks and working</h4>\n<ol>\n<li><b>Wave shaper (Schmitt trigger):</b> converts the unknown input signal (sine, triangular etc.) into clean rectangular pulses of the same frequency.</li>\n<li><b>555 timer (gate generator):</b> a <b>monostable</b> 555 (or a 555 astable followed by a divider) produces a pulse of exactly known width, e.g. <b>1 s</b> (T = 1.1RC).</li>\n<li><b>AND gate (main gate):</b> one input gets the shaped pulses and the other gets the gate pulse. Pulses pass through <b>only while the gate pulse is HIGH</b>.</li>\n<li><b>Decade counter:</b> counts the pulses passing through the AND gate. It is reset before each measurement; at the end of the gate time the count is latched.</li>\n<li><b>Decoder / driver and 7-segment display:</b> show the count, i.e. the frequency.</li>\n</ol>\n<h4>Gate time and range</h4>\n<ul>\n<li>Gate 1 s → reading in Hz; gate 0.1 s → reading × 10; gate 10 ms → reading × 100 (higher frequency, lower resolution).</li>\n<li>Accuracy depends on the accuracy of the gate time, so stable, low-tolerance R and C are used (crystal-based time bases are used in precision counters).</li>\n</ul>", "gu": "<p><b>Frequency counter</b> અજાણ્યા signal ની frequency, <b>જાણીતા સમયગાળા (gate time) માં cycles ની સંખ્યા ગણીને</b> માપે છે. આ ચોક્કસ <b>gate pulse</b> બનાવવા 555 timer વપરાય છે (block diagram જુઓ).</p>\n<p style=\"text-align:center\"><b>f<sub>x</sub> = N / T<sub>gate</sub></b> (N = ગણેલા pulses ની સંખ્યા)</p>\n<p>T<sub>gate</sub> = 1 s હોય તો count N સીધો Hz માં frequency બરાબર થાય.</p>\n<h4>Blocks અને કાર્ય</h4>\n<ol>\n<li><b>Wave shaper (Schmitt trigger):</b> અજાણ્યા input signal (sine, triangular વગેરે) ને તે જ frequency ના સ્વચ્છ rectangular pulses માં ફેરવે.</li>\n<li><b>555 timer (gate generator):</b> <b>monostable</b> 555 (અથવા divider સાથે 555 astable) બરાબર જાણીતી width નો pulse બનાવે, દા.ત. <b>1 s</b> (T = 1.1RC).</li>\n<li><b>AND gate (main gate):</b> એક input પર shaped pulses અને બીજા પર gate pulse. <b>Gate pulse HIGH હોય ત્યારે જ</b> pulses પસાર થાય.</li>\n<li><b>Decade counter:</b> AND gate માંથી પસાર થતા pulses ગણે. દરેક માપન પહેલાં reset થાય; gate time ના અંતે count latch થાય.</li>\n<li><b>Decoder / driver અને 7-segment display:</b> count એટલે કે frequency દર્શાવે.</li>\n</ol>\n<h4>Gate time અને range</h4>\n<ul>\n<li>Gate 1 s → reading Hz માં; gate 0.1 s → reading × 10; gate 10 ms → reading × 100 (વધુ frequency, ઓછું resolution).</li>\n<li>ચોકસાઈ gate time ની ચોકસાઈ પર આધાર રાખે, તેથી સ્થિર, ઓછા tolerance વાળા R અને C વપરાય (precision counters માં crystal-based time base વપરાય).</li>\n</ul>"}, "diagram": "u5_freq_counter", "examples": ["u5n6"]}, {"h": {"en": "5.4.8 Other Applications and Comparison of Modes", "gu": "5.4.8 બીજા ઉપયોગો અને Modes ની સરખામણી"}, "body": {"en": "<h4>Bistable mode (flip-flop)</h4>\n<p>Pins 6 and 7 are not used for timing (pin 6 grounded); pin 2 (with pull-up) acts as <b>SET</b> and pin 4 (with pull-up) acts as <b>RESET</b>. Pressing SET makes output HIGH and it stays HIGH; pressing RESET makes it LOW. Used as a <b>switch debouncer</b> and ON/OFF touch switch.</p>\n<h4>Other applications</h4>\n<ul>\n<li><b>Missing-pulse detector</b> – detects a missing heartbeat / pulse in a pulse train (alarm systems).</li>\n<li><b>Frequency divider</b> – monostable with T longer than the input period.</li>\n<li><b>PWM and PPM</b> (pulse width / position modulation) – modulating signal at pin 5.</li>\n<li><b>Voltage-controlled oscillator (VCO)</b> – frequency controlled by pin 5 voltage.</li>\n<li><b>Schmitt trigger</b> – pins 2 and 6 joined as input; converts sine into square wave.</li>\n<li><b>Burglar / fire alarm, siren, police-siren (two 555s), water-level indicator, traffic-light controller, touch switch, DC-DC voltage doubler</b>.</li>\n</ul>\n<h4>Comparison: monostable vs astable vs bistable</h4>\n<table>\n<tr><th>Point</th><th>Monostable</th><th>Astable</th><th>Bistable</th></tr>\n<tr><td>Stable states</td><td>1</td><td>0</td><td>2</td></tr>\n<tr><td>Trigger needed</td><td>Yes (one per pulse)</td><td>No</td><td>Yes (set and reset)</td></tr>\n<tr><td>Output</td><td>Single pulse</td><td>Continuous rectangular wave</td><td>Stays HIGH or LOW</td></tr>\n<tr><td>Timing formula</td><td>T = 1.1RC</td><td>f = 1.44/[(R<sub>A</sub>+2R<sub>B</sub>)C]</td><td>None</td></tr>\n<tr><td>Timing components</td><td>R, C</td><td>R<sub>A</sub>, R<sub>B</sub>, C</td><td>None</td></tr>\n<tr><td>Pins 2 and 6</td><td>Separate (2 = trigger in; 6, 7 joined)</td><td>Joined (2 and 6)</td><td>2 = SET, 4 = RESET</td></tr>\n<tr><td>Other name</td><td>One-shot</td><td>Free-running oscillator</td><td>Flip-flop / latch</td></tr>\n<tr><td>Uses</td><td>Timer, delay, gate pulse, debouncing</td><td>Flasher, clock, tone, PWM</td><td>ON/OFF switch, memory</td></tr>\n</table>", "gu": "<h4>Bistable mode (flip-flop)</h4>\n<p>Pins 6 અને 7 timing માટે વપરાતા નથી (pin 6 grounded); pin 2 (pull-up સાથે) <b>SET</b> તરીકે અને pin 4 (pull-up સાથે) <b>RESET</b> તરીકે કામ કરે. SET દબાવતાં output HIGH થાય અને HIGH જ રહે; RESET દબાવતાં LOW થાય. <b>Switch debouncer</b> અને ON/OFF touch switch તરીકે વપરાય.</p>\n<h4>બીજા ઉપયોગો</h4>\n<ul>\n<li><b>Missing-pulse detector</b> – pulse train માં ખૂટતો heartbeat / pulse શોધે (alarm systems).</li>\n<li><b>Frequency divider</b> – input period કરતાં લાંબા T વાળો monostable.</li>\n<li><b>PWM અને PPM</b> (pulse width / position modulation) – pin 5 પર modulating signal.</li>\n<li><b>Voltage-controlled oscillator (VCO)</b> – pin 5 voltage થી frequency control.</li>\n<li><b>Schmitt trigger</b> – pins 2 અને 6 જોડી input; sine ને square wave માં ફેરવે.</li>\n<li><b>Burglar / fire alarm, siren, police-siren (બે 555), water-level indicator, traffic-light controller, touch switch, DC-DC voltage doubler</b>.</li>\n</ul>\n<h4>સરખામણી: monostable vs astable vs bistable</h4>\n<table>\n<tr><th>મુદ્દો</th><th>Monostable</th><th>Astable</th><th>Bistable</th></tr>\n<tr><td>Stable states</td><td>1</td><td>0</td><td>2</td></tr>\n<tr><td>Trigger જોઈએ?</td><td>હા (દરેક pulse માટે એક)</td><td>ના</td><td>હા (set અને reset)</td></tr>\n<tr><td>Output</td><td>એક pulse</td><td>સતત rectangular wave</td><td>HIGH અથવા LOW રહે</td></tr>\n<tr><td>Timing formula</td><td>T = 1.1RC</td><td>f = 1.44/[(R<sub>A</sub>+2R<sub>B</sub>)C]</td><td>નથી</td></tr>\n<tr><td>Timing components</td><td>R, C</td><td>R<sub>A</sub>, R<sub>B</sub>, C</td><td>નથી</td></tr>\n<tr><td>Pins 2 અને 6</td><td>અલગ (2 = trigger in; 6, 7 જોડેલા)</td><td>જોડેલા (2 અને 6)</td><td>2 = SET, 4 = RESET</td></tr>\n<tr><td>બીજું નામ</td><td>One-shot</td><td>Free-running oscillator</td><td>Flip-flop / latch</td></tr>\n<tr><td>ઉપયોગ</td><td>Timer, delay, gate pulse, debouncing</td><td>Flasher, clock, tone, PWM</td><td>ON/OFF switch, memory</td></tr>\n</table>"}}, {"h": {"en": "Key Points – 5.4", "gu": "મુખ્ય મુદ્દા – 5.4"}, "body": {"en": "<ul>\n<li><b>Monostable:</b> one pulse per trigger, <b>T = 1.1RC</b>; C charges 0 → ⅔V<sub>CC</sub>; pins 6 + 7 joined.</li>\n<li><b>Astable:</b> continuous wave, no trigger; C swings ⅓ ↔ ⅔V<sub>CC</sub>; pins 2 + 6 joined.</li>\n<li>t<sub>H</sub> = 0.693(R<sub>A</sub>+R<sub>B</sub>)C, t<sub>L</sub> = 0.693R<sub>B</sub>C, <b>f = 1.44/[(R<sub>A</sub>+2R<sub>B</sub>)C]</b>.</li>\n<li>Duty cycle D = (R<sub>A</sub>+R<sub>B</sub>)/(R<sub>A</sub>+2R<sub>B</sub>) &gt; 50 %; diode across R<sub>B</sub> gives 50 % with R<sub>A</sub> = R<sub>B</sub>.</li>\n<li>Pulse generator / LED flasher = astable; output sources (load to ground) or sinks (load to V<sub>CC</sub>).</li>\n<li>Timer = monostable with START at pin 2, RESET at pin 4, relay at pin 3.</li>\n<li>Frequency counter: 555 gives the <b>gate pulse</b>; <b>f = N / T<sub>gate</sub></b>.</li>\n</ul>", "gu": "<ul>\n<li><b>Monostable:</b> દરેક trigger પર એક pulse, <b>T = 1.1RC</b>; C 0 → ⅔V<sub>CC</sub> charge થાય; pins 6 + 7 જોડેલા.</li>\n<li><b>Astable:</b> સતત wave, trigger નહીં; C ⅓ ↔ ⅔V<sub>CC</sub> વચ્ચે ઝૂલે; pins 2 + 6 જોડેલા.</li>\n<li>t<sub>H</sub> = 0.693(R<sub>A</sub>+R<sub>B</sub>)C, t<sub>L</sub> = 0.693R<sub>B</sub>C, <b>f = 1.44/[(R<sub>A</sub>+2R<sub>B</sub>)C]</b>.</li>\n<li>Duty cycle D = (R<sub>A</sub>+R<sub>B</sub>)/(R<sub>A</sub>+2R<sub>B</sub>) &gt; 50 %; R<sub>B</sub> ની સમાંતર diode અને R<sub>A</sub> = R<sub>B</sub> થી 50 %.</li>\n<li>Pulse generator / LED flasher = astable; output source (load ground તરફ) અથવા sink (load V<sub>CC</sub> તરફ) કરે.</li>\n<li>Timer = pin 2 પર START, pin 4 પર RESET, pin 3 પર relay સાથેનો monostable.</li>\n<li>Frequency counter: 555 <b>gate pulse</b> આપે; <b>f = N / T<sub>gate</sub></b>.</li>\n</ul>"}, "key": true}]}], "numericals": [{"id": "u5n1", "q": {"en": "A 555 monostable multivibrator uses R = 100 kΩ and C = 10 µF. Find the output pulse width.", "gu": "555 monostable multivibrator માં R = 100 kΩ અને C = 10 µF છે. Output pulse width શોધો."}, "a": {"en": "<p>T = 1.1 RC = 1.1 × 100 × 10³ × 10 × 10⁻⁶</p>\n<p>= 1.1 × 1 = <b>1.1 s</b></p>", "gu": "<p>T = 1.1 RC = 1.1 × 100 × 10³ × 10 × 10⁻⁶</p>\n<p>= 1.1 × 1 = <b>1.1 s</b></p>"}}, {"id": "u5n2", "q": {"en": "Design a 555 monostable to give a time delay of 5 s using C = 47 µF.", "gu": "C = 47 µF વાપરી 5 s નો time delay આપતો 555 monostable ડિઝાઇન કરો."}, "a": {"en": "<p>T = 1.1 RC → R = T / (1.1 C) = 5 / (1.1 × 47 × 10⁻⁶)</p>\n<p>= 5 / (51.7 × 10⁻⁶) = <b>96.7 kΩ</b></p>\n<p>Use standard <b>100 kΩ</b> (or a 100 kΩ potentiometer for fine adjustment).</p>\n<p>Check: T = 1.1 × 100 × 10³ × 47 × 10⁻⁶ = <b>5.17 s</b> ≈ 5 s ✓</p>", "gu": "<p>T = 1.1 RC → R = T / (1.1 C) = 5 / (1.1 × 47 × 10⁻⁶)</p>\n<p>= 5 / (51.7 × 10⁻⁶) = <b>96.7 kΩ</b></p>\n<p>Standard <b>100 kΩ</b> વાપરો (અથવા બારીક ગોઠવણ માટે 100 kΩ potentiometer).</p>\n<p>ચકાસણી: T = 1.1 × 100 × 10³ × 47 × 10⁻⁶ = <b>5.17 s</b> ≈ 5 s ✓</p>"}}, {"id": "u5n3", "q": {"en": "A 555 astable multivibrator has R_A = 1 kΩ, R_B = 10 kΩ and C = 0.1 µF. Find t_H, t_L, T, frequency and duty cycle.", "gu": "555 astable multivibrator માં R_A = 1 kΩ, R_B = 10 kΩ અને C = 0.1 µF છે. t_H, t_L, T, frequency અને duty cycle શોધો."}, "a": {"en": "<p>t<sub>H</sub> = 0.693 (R<sub>A</sub> + R<sub>B</sub>) C = 0.693 × 11 × 10³ × 0.1 × 10⁻⁶ = <b>0.762 ms</b></p>\n<p>t<sub>L</sub> = 0.693 R<sub>B</sub> C = 0.693 × 10 × 10³ × 0.1 × 10⁻⁶ = <b>0.693 ms</b></p>\n<p>T = t<sub>H</sub> + t<sub>L</sub> = <b>1.455 ms</b></p>\n<p>f = 1/T = 1 / 1.455 × 10⁻³ = <b>687 Hz</b> (check: 1.44 / (21 × 10³ × 0.1 × 10⁻⁶) = 686 Hz ✓)</p>\n<p>D = t<sub>H</sub>/T × 100 = 0.762/1.455 × 100 = <b>52.4 %</b></p>", "gu": "<p>t<sub>H</sub> = 0.693 (R<sub>A</sub> + R<sub>B</sub>) C = 0.693 × 11 × 10³ × 0.1 × 10⁻⁶ = <b>0.762 ms</b></p>\n<p>t<sub>L</sub> = 0.693 R<sub>B</sub> C = 0.693 × 10 × 10³ × 0.1 × 10⁻⁶ = <b>0.693 ms</b></p>\n<p>T = t<sub>H</sub> + t<sub>L</sub> = <b>1.455 ms</b></p>\n<p>f = 1/T = 1 / 1.455 × 10⁻³ = <b>687 Hz</b> (ચકાસણી: 1.44 / (21 × 10³ × 0.1 × 10⁻⁶) = 686 Hz ✓)</p>\n<p>D = t<sub>H</sub>/T × 100 = 0.762/1.455 × 100 = <b>52.4 %</b></p>"}}, {"id": "u5n4", "q": {"en": "Design a 555 astable multivibrator for a frequency of 1 kHz and duty cycle of 60 % using C = 0.01 µF.", "gu": "C = 0.01 µF વાપરી 1 kHz frequency અને 60 % duty cycle માટે 555 astable multivibrator ડિઝાઇન કરો."}, "a": {"en": "<p>Duty cycle: (R<sub>A</sub> + R<sub>B</sub>)/(R<sub>A</sub> + 2R<sub>B</sub>) = 0.6 → R<sub>A</sub> + R<sub>B</sub> = 0.6R<sub>A</sub> + 1.2R<sub>B</sub> → 0.4R<sub>A</sub> = 0.2R<sub>B</sub> → <b>R<sub>B</sub> = 2R<sub>A</sub></b></p>\n<p>Frequency: f = 1.44 / [(R<sub>A</sub> + 2R<sub>B</sub>) C] → R<sub>A</sub> + 2R<sub>B</sub> = 1.44 / (1000 × 0.01 × 10⁻⁶) = 144 kΩ</p>\n<p>R<sub>A</sub> + 4R<sub>A</sub> = 144 kΩ → <b>R<sub>A</sub> = 28.8 kΩ</b>, <b>R<sub>B</sub> = 57.6 kΩ</b></p>\n<p>Standard values: R<sub>A</sub> = <b>27 kΩ</b>, R<sub>B</sub> = <b>56 kΩ</b></p>\n<p>Check: f = 1.44 / (139 × 10³ × 0.01 × 10⁻⁶) = <b>1036 Hz</b>; D = 83/139 = <b>59.7 %</b> ✓</p>", "gu": "<p>Duty cycle: (R<sub>A</sub> + R<sub>B</sub>)/(R<sub>A</sub> + 2R<sub>B</sub>) = 0.6 → R<sub>A</sub> + R<sub>B</sub> = 0.6R<sub>A</sub> + 1.2R<sub>B</sub> → 0.4R<sub>A</sub> = 0.2R<sub>B</sub> → <b>R<sub>B</sub> = 2R<sub>A</sub></b></p>\n<p>Frequency: f = 1.44 / [(R<sub>A</sub> + 2R<sub>B</sub>) C] → R<sub>A</sub> + 2R<sub>B</sub> = 1.44 / (1000 × 0.01 × 10⁻⁶) = 144 kΩ</p>\n<p>R<sub>A</sub> + 4R<sub>A</sub> = 144 kΩ → <b>R<sub>A</sub> = 28.8 kΩ</b>, <b>R<sub>B</sub> = 57.6 kΩ</b></p>\n<p>Standard મૂલ્યો: R<sub>A</sub> = <b>27 kΩ</b>, R<sub>B</sub> = <b>56 kΩ</b></p>\n<p>ચકાસણી: f = 1.44 / (139 × 10³ × 0.01 × 10⁻⁶) = <b>1036 Hz</b>; D = 83/139 = <b>59.7 %</b> ✓</p>"}}, {"id": "u5n5", "q": {"en": "An LED flasher uses a 555 astable with R_A = 10 kΩ, R_B = 68 kΩ and C = 10 µF. Find the ON time, OFF time, flashing frequency and duty cycle.", "gu": "LED flasher માં R_A = 10 kΩ, R_B = 68 kΩ અને C = 10 µF સાથે 555 astable છે. ON time, OFF time, flashing frequency અને duty cycle શોધો."}, "a": {"en": "<p>t<sub>H</sub> = 0.693 (10 + 68) × 10³ × 10 × 10⁻⁶ = 0.693 × 0.78 = <b>0.541 s</b> (LED2 ON)</p>\n<p>t<sub>L</sub> = 0.693 × 68 × 10³ × 10 × 10⁻⁶ = 0.693 × 0.68 = <b>0.471 s</b> (LED1 ON)</p>\n<p>T = 0.541 + 0.471 = <b>1.012 s</b> → f = 1/T ≈ <b>0.99 Hz</b> (about 1 flash per second)</p>\n<p>D = 0.541/1.012 × 100 = <b>53.4 %</b></p>", "gu": "<p>t<sub>H</sub> = 0.693 (10 + 68) × 10³ × 10 × 10⁻⁶ = 0.693 × 0.78 = <b>0.541 s</b> (LED2 ON)</p>\n<p>t<sub>L</sub> = 0.693 × 68 × 10³ × 10 × 10⁻⁶ = 0.693 × 0.68 = <b>0.471 s</b> (LED1 ON)</p>\n<p>T = 0.541 + 0.471 = <b>1.012 s</b> → f = 1/T ≈ <b>0.99 Hz</b> (લગભગ દર સેકન્ડે એક flash)</p>\n<p>D = 0.541/1.012 × 100 = <b>53.4 %</b></p>"}}, {"id": "u5n6", "q": {"en": "In a frequency counter, the counter shows 2500 counts during a gate time of 1 s. Find the unknown frequency. Also find R of the 555 monostable gate generator if C = 10 µF.", "gu": "Frequency counter માં 1 s ના gate time દરમિયાન counter 2500 counts બતાવે છે. અજાણી frequency શોધો. C = 10 µF હોય તો 555 monostable gate generator નો R પણ શોધો."}, "a": {"en": "<p>f<sub>x</sub> = N / T<sub>gate</sub> = 2500 / 1 = <b>2500 Hz = 2.5 kHz</b></p>\n<p>Gate pulse: T = 1.1 RC → R = 1 / (1.1 × 10 × 10⁻⁶) = <b>90.9 kΩ</b> → use <b>91 kΩ</b> (T = 1.001 s)</p>\n<p><i>If the gate time were 0.1 s, the same signal would give 250 counts.</i></p>", "gu": "<p>f<sub>x</sub> = N / T<sub>gate</sub> = 2500 / 1 = <b>2500 Hz = 2.5 kHz</b></p>\n<p>Gate pulse: T = 1.1 RC → R = 1 / (1.1 × 10 × 10⁻⁶) = <b>90.9 kΩ</b> → <b>91 kΩ</b> વાપરો (T = 1.001 s)</p>\n<p><i>Gate time 0.1 s હોત તો તે જ signal 250 counts આપત.</i></p>"}}, {"id": "u5n7", "q": {"en": "A 555 timer is operated at V_CC = 9 V. Find the upper and lower threshold voltages. What are they if 5 V is applied at the control pin (pin 5)?", "gu": "555 timer V_CC = 9 V પર ચાલે છે. Upper અને lower threshold voltages શોધો. Control pin (pin 5) પર 5 V આપીએ તો તે કેટલા થાય?"}, "a": {"en": "<p>Upper threshold = ⅔ V<sub>CC</sub> = ⅔ × 9 = <b>6 V</b></p>\n<p>Lower (trigger) threshold = ⅓ V<sub>CC</sub> = ⅓ × 9 = <b>3 V</b></p>\n<p>With V<sub>CON</sub> = 5 V at pin 5: upper = V<sub>CON</sub> = <b>5 V</b>, lower = V<sub>CON</sub>/2 = <b>2.5 V</b></p>\n<p><i>Lower thresholds make the capacitor reach them sooner → timing becomes shorter.</i></p>", "gu": "<p>Upper threshold = ⅔ V<sub>CC</sub> = ⅔ × 9 = <b>6 V</b></p>\n<p>Lower (trigger) threshold = ⅓ V<sub>CC</sub> = ⅓ × 9 = <b>3 V</b></p>\n<p>Pin 5 પર V<sub>CON</sub> = 5 V હોય તો: upper = V<sub>CON</sub> = <b>5 V</b>, lower = V<sub>CON</sub>/2 = <b>2.5 V</b></p>\n<p><i>ઓછા thresholds પર capacitor વહેલો પહોંચે → timing ટૂંકું થાય.</i></p>"}}], "diagrams": [{"id": "u5_pin_diagram", "title": {"en": "Pin Diagram of IC 555", "gu": "IC 555 નો Pin Diagram"}, "file": "diagrams/u5_pin_diagram.svg"}, {"id": "u5_block_diagram", "title": {"en": "Functional Block Diagram of IC 555", "gu": "IC 555 નો Functional Block Diagram"}, "file": "diagrams/u5_block_diagram.svg"}, {"id": "u5_mono_circuit", "title": {"en": "555 as Monostable Multivibrator", "gu": "Monostable Multivibrator તરીકે 555"}, "file": "diagrams/u5_mono_circuit.svg"}, {"id": "u5_mono_wave", "title": {"en": "Monostable Waveforms", "gu": "Monostable Waveforms"}, "file": "diagrams/u5_mono_wave.svg"}, {"id": "u5_astable_circuit", "title": {"en": "555 as Astable Multivibrator", "gu": "Astable Multivibrator તરીકે 555"}, "file": "diagrams/u5_astable_circuit.svg"}, {"id": "u5_astable_wave", "title": {"en": "Astable Waveforms", "gu": "Astable Waveforms"}, "file": "diagrams/u5_astable_wave.svg"}, {"id": "u5_led_flasher", "title": {"en": "555 as LED Flasher (Pulse Generator)", "gu": "LED Flasher (Pulse Generator) તરીકે 555"}, "file": "diagrams/u5_led_flasher.svg"}, {"id": "u5_freq_counter", "title": {"en": "Frequency Counter using 555", "gu": "555 વાપરીને Frequency Counter"}, "file": "diagrams/u5_freq_counter.svg"}], "equations": [{"title": {"en": "IC 555 Basics", "gu": "IC 555 મૂળભૂત"}, "items": [{"name": {"en": "Upper threshold", "gu": "Upper threshold"}, "f": "V<sub>UT</sub> = ⅔ V<sub>CC</sub>", "terms": {"en": "Threshold (pin 6) above this → output LOW", "gu": "Threshold (pin 6) આનાથી ઉપર → output LOW"}}, {"name": {"en": "Lower (trigger) threshold", "gu": "Lower (trigger) threshold"}, "f": "V<sub>LT</sub> = ⅓ V<sub>CC</sub>", "terms": {"en": "Trigger (pin 2) below this → output HIGH", "gu": "Trigger (pin 2) આનાથી નીચે → output HIGH"}}, {"name": {"en": "With control voltage at pin 5", "gu": "Pin 5 પર control voltage સાથે"}, "f": "V<sub>UT</sub> = V<sub>CON</sub>, V<sub>LT</sub> = V<sub>CON</sub> / 2", "terms": {"en": "Used for PWM / VCO", "gu": "PWM / VCO માટે વપરાય"}}, {"name": {"en": "Supply range", "gu": "Supply range"}, "f": "V<sub>CC</sub> = 4.5 V – 15 V; I<sub>out(max)</sub> = 200 mA", "terms": {"en": "", "gu": ""}}]}, {"title": {"en": "Monostable Multivibrator", "gu": "Monostable Multivibrator"}, "items": [{"name": {"en": "Capacitor charging", "gu": "Capacitor charging"}, "f": "V<sub>C</sub> = V<sub>CC</sub> (1 − e<sup>−t/RC</sup>)", "terms": {"en": "Starts from 0 V", "gu": "0 V થી શરૂ"}}, {"name": {"en": "Pulse width", "gu": "Pulse width"}, "f": "T = 1.1 R C", "terms": {"en": "From T = RC ln 3; independent of V_CC", "gu": "T = RC ln 3 પરથી; V_CC થી સ્વતંત્ર"}}, {"name": {"en": "Design: resistor", "gu": "Design: resistor"}, "f": "R = T / (1.1 C)", "terms": {"en": "", "gu": ""}}]}, {"title": {"en": "Astable Multivibrator", "gu": "Astable Multivibrator"}, "items": [{"name": {"en": "HIGH time (charging)", "gu": "HIGH time (charging)"}, "f": "t<sub>H</sub> = 0.693 (R<sub>A</sub> + R<sub>B</sub>) C", "terms": {"en": "C charges through R_A + R_B", "gu": "C, R_A + R_B દ્વારા charge થાય"}}, {"name": {"en": "LOW time (discharging)", "gu": "LOW time (discharging)"}, "f": "t<sub>L</sub> = 0.693 R<sub>B</sub> C", "terms": {"en": "C discharges through R_B into pin 7", "gu": "C, R_B દ્વારા pin 7 માં discharge થાય"}}, {"name": {"en": "Time period", "gu": "Time period"}, "f": "T = t<sub>H</sub> + t<sub>L</sub> = 0.693 (R<sub>A</sub> + 2R<sub>B</sub>) C", "terms": {"en": "", "gu": ""}}, {"name": {"en": "Frequency", "gu": "Frequency"}, "f": "f = 1.44 / [(R<sub>A</sub> + 2R<sub>B</sub>) C]", "terms": {"en": "", "gu": ""}}, {"name": {"en": "Duty cycle", "gu": "Duty cycle"}, "f": "D = (R<sub>A</sub> + R<sub>B</sub>) / (R<sub>A</sub> + 2R<sub>B</sub>) × 100 %", "terms": {"en": "Always > 50 % in basic circuit", "gu": "Basic circuit માં હંમેશા > 50 %"}}, {"name": {"en": "LOW-to-HIGH ratio / space ratio", "gu": "LOW-to-HIGH ratio"}, "f": "t<sub>L</sub> / t<sub>H</sub> = R<sub>B</sub> / (R<sub>A</sub> + R<sub>B</sub>)", "terms": {"en": "", "gu": ""}}, {"name": {"en": "With diode across R_B", "gu": "R_B ની સમાંતર diode સાથે"}, "f": "t<sub>H</sub> = 0.693 R<sub>A</sub>C, t<sub>L</sub> = 0.693 R<sub>B</sub>C", "terms": {"en": "R_A = R_B gives 50 % duty cycle", "gu": "R_A = R_B થી 50 % duty cycle"}}, {"name": {"en": "First cycle (from 0 V)", "gu": "પહેલો cycle (0 V થી)"}, "f": "t<sub>H1</sub> ≈ 1.1 (R<sub>A</sub> + R<sub>B</sub>) C", "terms": {"en": "", "gu": ""}}]}, {"title": {"en": "Frequency Counter", "gu": "Frequency Counter"}, "items": [{"name": {"en": "Unknown frequency", "gu": "અજાણી frequency"}, "f": "f<sub>x</sub> = N / T<sub>gate</sub>", "terms": {"en": "N = count; T_gate = 1 s → N = f in Hz", "gu": "N = count; T_gate = 1 s → N = f Hz માં"}}]}], "viva": [{"title": {"en": "IC 555 – Pins and Block Diagram", "gu": "IC 555 – Pins અને Block Diagram"}, "items": [{"q": {"en": "What is IC 555?", "gu": "IC 555 એટલે શું?"}, "a": {"en": "An 8-pin timer IC used to generate accurate time delays and rectangular waves (oscillations).", "gu": "ચોક્કસ time delays અને rectangular waves (oscillations) બનાવવા વપરાતું 8-pin timer IC."}}, {"q": {"en": "Who introduced the 555 and when?", "gu": "555 કોણે અને ક્યારે રજૂ કર્યું?"}, "a": {"en": "Signetics Corporation in 1971; designed by Hans Camenzind.", "gu": "Signetics Corporation એ 1971 માં; Hans Camenzind એ ડિઝાઇન કર્યું."}}, {"q": {"en": "Why is it called '555'?", "gu": "તેને '555' કેમ કહે છે?"}, "a": {"en": "Because of the three 5 kΩ resistors in its internal voltage divider.", "gu": "તેના અંદરના voltage divider ના ત્રણ 5 kΩ resistors ને કારણે."}}, {"q": {"en": "What is the supply voltage range of NE555?", "gu": "NE555 ની supply voltage range કેટલી છે?"}, "a": {"en": "4.5 V to 15 V (maximum about 16–18 V).", "gu": "4.5 V થી 15 V (મહત્તમ લગભગ 16–18 V)."}}, {"q": {"en": "What is the maximum output current of 555?", "gu": "555 નો મહત્તમ output current કેટલો છે?"}, "a": {"en": "About 200 mA (source or sink).", "gu": "લગભગ 200 mA (source અથવા sink)."}}, {"q": {"en": "What is IC 556?", "gu": "IC 556 એટલે શું?"}, "a": {"en": "A dual timer – two 555 timers in one 14-pin package.", "gu": "Dual timer – એક 14-pin package માં બે 555 timers."}}, {"q": {"en": "Name the pins of IC 555.", "gu": "IC 555 ના pins ના નામ આપો."}, "a": {"en": "1 GND, 2 Trigger, 3 Output, 4 Reset, 5 Control voltage, 6 Threshold, 7 Discharge, 8 +V_CC.", "gu": "1 GND, 2 Trigger, 3 Output, 4 Reset, 5 Control voltage, 6 Threshold, 7 Discharge, 8 +V_CC."}}, {"q": {"en": "Why is the reset pin connected to V_CC?", "gu": "Reset pin ને V_CC સાથે કેમ જોડાય છે?"}, "a": {"en": "Reset is active LOW; tying it HIGH prevents accidental resetting by noise.", "gu": "Reset active LOW છે; તેને HIGH રાખવાથી noise થી અચાનક reset થતું અટકે."}}, {"q": {"en": "Why is a 0.01 µF capacitor connected at pin 5?", "gu": "Pin 5 પર 0.01 µF capacitor કેમ જોડાય છે?"}, "a": {"en": "To bypass noise and ripple so that the threshold voltages remain stable.", "gu": "Noise અને ripple bypass કરવા જેથી threshold voltages સ્થિર રહે."}}, {"q": {"en": "What are the two reference voltages inside 555?", "gu": "555 ની અંદર બે reference voltages કયા છે?"}, "a": {"en": "⅔V_CC for the upper (threshold) comparator and ⅓V_CC for the lower (trigger) comparator.", "gu": "ઉપરના (threshold) comparator માટે ⅔V_CC અને નીચેના (trigger) comparator માટે ⅓V_CC."}}, {"q": {"en": "What is the function of the flip-flop in 555?", "gu": "555 માં flip-flop નું કાર્ય શું છે?"}, "a": {"en": "It stores the output state; set by the trigger comparator and reset by the threshold comparator.", "gu": "Output state સંગ્રહે; trigger comparator થી set અને threshold comparator થી reset થાય."}}, {"q": {"en": "What is the function of the discharge transistor?", "gu": "Discharge transistor નું કાર્ય શું છે?"}, "a": {"en": "When output is LOW it turns ON and discharges the timing capacitor through pin 7.", "gu": "Output LOW હોય ત્યારે ON થઈ pin 7 દ્વારા timing capacitor ને discharge કરે."}}, {"q": {"en": "What happens when trigger voltage falls below ⅓V_CC?", "gu": "Trigger voltage ⅓V_CC થી નીચે જાય ત્યારે શું થાય?"}, "a": {"en": "Flip-flop is set and output goes HIGH; discharge transistor turns OFF.", "gu": "Flip-flop set થાય અને output HIGH થાય; discharge transistor OFF થાય."}}, {"q": {"en": "What happens when threshold voltage exceeds ⅔V_CC?", "gu": "Threshold voltage ⅔V_CC થી વધે ત્યારે શું થાય?"}, "a": {"en": "Flip-flop is reset and output goes LOW; discharge transistor turns ON.", "gu": "Flip-flop reset થાય અને output LOW થાય; discharge transistor ON થાય."}}]}, {"title": {"en": "Monostable and Astable", "gu": "Monostable અને Astable"}, "items": [{"q": {"en": "What is a multivibrator?", "gu": "Multivibrator એટલે શું?"}, "a": {"en": "A circuit that switches between two states (HIGH and LOW); used to generate rectangular waves or pulses.", "gu": "બે states (HIGH અને LOW) વચ્ચે બદલાતો circuit; rectangular waves અથવા pulses બનાવવા વપરાય."}}, {"q": {"en": "How many stable states does a monostable have?", "gu": "Monostable માં કેટલી stable states હોય?"}, "a": {"en": "One stable state (output LOW) and one quasi-stable state.", "gu": "એક stable state (output LOW) અને એક quasi-stable state."}}, {"q": {"en": "Why is monostable called a one-shot?", "gu": "Monostable ને one-shot કેમ કહે છે?"}, "a": {"en": "Because it gives exactly one output pulse for each trigger.", "gu": "કારણ કે દરેક trigger માટે બરાબર એક output pulse આપે છે."}}, {"q": {"en": "Give the pulse-width formula of a 555 monostable.", "gu": "555 monostable નું pulse-width formula આપો."}, "a": {"en": "T = 1.1RC.", "gu": "T = 1.1RC."}}, {"q": {"en": "D
