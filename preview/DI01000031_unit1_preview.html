<script>
const U = {"subject": "DI01000031", "unit": 1, "format": "notes", "title": {"en": "Theory of Communication"}, "hours": 6, "weightage": 20, "official": true, "languages": ["en"], "tabs": ["notes", "diagrams", "viva", "exam"], "intro_text": {"en": "Unit 1 of Communication Skills in English: what communication means and why the four language skills (LSRW) carry it, the seven-part model S + E + C + D + R + N + F, the upward and downward levels of an organisation, the verbal, non-verbal, visual, interpersonal, intrapersonal, extra personal and mass types, and the five families of barriers with the cure for each. Every rule is followed by worked examples, and fourteen answered practice questions are in section 7."}, "notes": [{"title": {"en": "1. Communication and the Four Skills"}, "items": [{"h": {"en": "1.1 What communication means"}, "body": {"en": "<h4>Definition</h4><p><b>Communication is the exchange of ideas, information or feelings between two or more people so that the receiver understands what the sender meant.</b></p><p>The key words are <i>exchange</i> (it goes both ways) and <i>understands</i> (the message has to arrive, not just leave).</p><h4>One idea, many forms</h4><table><tr><th>Situation</th><th>What is sent</th><th>How it travels</th></tr><tr><td>Supervisor tells a fitter to check the bearing</td><td>an instruction</td><td>spoken words</td></tr><tr><td>A notice on the workshop board</td><td>a safety rule</td><td>written words</td></tr><tr><td>A red lamp on a machine panel</td><td>a warning</td><td>a visual signal</td></tr><tr><td>A thumbs-up after a job is checked</td><td>approval</td><td>a gesture</td></tr></table><h4>Why a diploma engineer needs it</h4><p>On site you will give instructions, read drawings, write reports, explain a fault and speak to a customer. Each of those is communication, and each can go wrong.</p><h4>Examples of everyday messages</h4><h4>Short messages you already send</h4><ul><li>\"Bring the 12 mm spanner.\" - instruction</li><li>\"The motor is hot, stop the line.\" - warning</li><li>\"Job finished at 4 pm.\" - information</li><li>\"Well done, the alignment is perfect.\" - appreciation</li></ul><h4>Common mistake</h4><p>Treating communication as 'sending'. If the receiver did not understand, the message did not happen.</p>"}, "syllabus_item": "1.1"}, {"h": {"en": "1.2 The four language skills: LSRW"}, "body": {"en": "<h4>The four skills</h4><table><tr><th>Skill</th><th>What you do</th><th>Example from a workshop</th></tr><tr><td>Listening</td><td>receive and interpret speech</td><td>following a briefing before a shutdown</td></tr><tr><td>Speaking</td><td>produce speech</td><td>explaining a fault to the supervisor on the phone</td></tr><tr><td>Reading</td><td>interpret written text</td><td>reading the maintenance manual and the drawing</td></tr><tr><td>Writing</td><td>produce written text</td><td>writing the job card entry and an e-mail to the vendor</td></tr></table><h4>Receptive and productive</h4><p>Listening and reading are <b>receptive</b> (you take in); speaking and writing are <b>productive</b> (you put out). A balanced course practises all four.</p><h4>Examples of each skill in one day</h4><h4>A technician's day</h4><ul><li>7:30 - listens to the shift handover (listening)</li><li>9:00 - reads the wiring diagram before opening the panel (reading)</li><li>11:00 - tells the helper which tools to bring (speaking)</li><li>4:30 - writes the breakdown entry in the log book (writing)</li></ul><h4>Common mistake</h4><p>Calling listening 'hearing'. Hearing is passive; listening is active and takes attention.</p>"}, "syllabus_item": "1.1"}, {"h": {"en": "1.3 Listening is the skill that is used most"}, "body": {"en": "<h4>Hearing and listening are different</h4><p><b>Hearing</b> is the ear receiving sound. <b>Listening</b> is paying attention, understanding and remembering.</p><h4>Examples that show the difference</h4><h4>Same sound, different result</h4><ul><li>You hear the machine alarm but keep working - hearing only.</li><li>You hear the alarm, stop, and check the coolant level - listening.</li><li>You hear a customer say 'make it fast' and you speed up the wrong job - poor listening.</li><li>You repeat back 'so the 40 mm shaft is urgent, the rest later?' - active listening.</li></ul><h4>Three habits of a good listener</h4><ol><li>Face the speaker and keep eye contact.</li><li>Do not plan your reply while the other person is still talking.</li><li>Repeat the key point back in your own words.</li></ol><h4>Common mistake</h4><p>Nodding while thinking about something else. The nod is not evidence of understanding.</p>"}, "syllabus_item": "1.1"}, {"h": {"en": "1.4 Communication skills at work"}, "body": {"en": "<h4>What employers notice first</h4><p>Technical knowledge gets you the interview; clear communication keeps you on the team. The four skills appear in every job advertisement as 'good communication skills'.</p><h4>Examples by situation</h4><table><tr><th>Situation</th><th>Skill needed</th><th>A good version</th></tr><tr><td>Client asks why the pump failed</td><td>speaking + explaining</td><td>\"The seal dried out during the shutdown; we have replaced it and run the pump for an hour.\"</td></tr><tr><td>Writing a daily report</td><td>writing</td><td>\"Line 2 stopped 10:15-11:00 due to belt slip. Belt replaced, alignment checked.\"</td></tr><tr><td>Handover to the next shift</td><td>speaking + listening</td><td>\"Panel 3 is on manual; do not reset until the vendor calls.\"</td></tr><tr><td>Reading a vendor's mail</td><td>reading</td><td>noticing that the delivery date changed from 5th to 12th</td></tr></table><h4>One example of a costly misunderstanding</h4><p>\"Grease the bearing weekly\" is read as \"grease the motor weekly\". The bearing seizes, the motor survives. Twelve words, one breakdown.</p><h4>Common mistake</h4><p>Believing grammar alone is communication skill. Accuracy helps, but clarity and courtesy carry the message.</p>"}, "syllabus_item": "1.1"}, {"h": {"en": "1.5 What communication skill is not"}, "body": {"en": "<h4>Three wrong ideas</h4><ul><li><b>\"It means big words.\"</b> No - \"Please send the drawing\" works better than \"Kindly expedite the despatch of the requisite drawing.\"</li><li><b>\"It is only speaking.\"</b> No - a badly written e-mail can cost a contract before anyone speaks.</li><li><b>\"It is fixed at birth.\"</b> No - it is a skill, so it improves with practice and feedback.</li></ul><h4>Simple words, complete message</h4><table><tr><th>Wordy</th><th>Clear</th></tr><tr><td>at this point in time</td><td>now</td></tr><tr><td>in the event that</td><td>if</td></tr><tr><td>utilise</td><td>use</td></tr><tr><td>please revert</td><td>please reply</td></tr></table><h4>Examples of the same message at three levels</h4><h4>Asking for a report</h4><ul><li>Too blunt: \"Send report.\"</li><li>Too heavy: \"You are hereby requested to furnish the said report at the earliest.\"</li><li>Right: \"Please send the line-2 report by Friday 5 pm.\"</li></ul><h4>Common mistake</h4><p>Adding length to sound professional. Length hides the request; short sentences deliver it.</p>"}, "syllabus_item": "1.1"}]}, {"title": {"en": "2. Effective Communication and the Seven Cs"}, "items": [{"h": {"en": "2.1 What makes communication effective"}, "body": {"en": "<h4>The test</h4><p>Communication is <b>effective</b> when the receiver's understanding matches the sender's intention, and the reply or action shows it.</p><h4>Four conditions</h4><ul><li>A clear purpose - what should the reader or listener do next?</li><li>A suitable channel - a phone call for an urgent stop, an e-mail for a record.</li><li>Simple, correct language.</li><li>Feedback - a reply, a nod, a completed job, a signature.</li></ul><h4>Examples: effective and ineffective</h4><table><tr><th>Message</th><th>Verdict</th><th>Why</th></tr><tr><td>\"Stop the conveyor, the guard is loose.\"</td><td>effective</td><td>one action, one reason, no doubt</td></tr><tr><td>\"Something seems wrong with the machine, maybe check it.\"</td><td>vague</td><td>no action, no machine named</td></tr><tr><td>\"Meeting shifted to 3 pm, Room 4.\"</td><td>effective</td><td>two facts, no padding</td></tr><tr><td>\"As per discussion, needful will be done.\"</td><td>useless</td><td>no one knows what will be done</td></tr></table><h4>Common mistake</h4><p>Judging your own message by how much effort you put in. Judge it by what the receiver does next.</p>"}, "syllabus_item": "1.1"}, {"h": {"en": "2.2 The seven Cs"}, "body": {"en": "<h4>The checklist</h4><p>A good message is <b>clear, concise, concrete, correct, coherent, complete and courteous</b>. Seven words, ten seconds, most misunderstandings prevented.</p><h4>One example for each C</h4><table><tr><th>C</th><th>Weak</th><th>Better</th></tr><tr><td>Clear</td><td>\"Do the needful.\"</td><td>\"Replace the gasket and refit the cover.\"</td></tr><tr><td>Concise</td><td>\"At this point of time we are not in a position to...\"</td><td>\"We cannot supply before Monday.\"</td></tr><tr><td>Concrete</td><td>\"The motor is faulty.\"</td><td>\"The motor draws 9 A against a rated 6 A.\"</td></tr><tr><td>Correct</td><td>\"The bolts is loose.\"</td><td>\"The bolts are loose.\"</td></tr><tr><td>Coherent</td><td>\"Belt replaced. Also the pump. Yesterday.\"</td><td>\"Yesterday we replaced the pump, then the belt.\"</td></tr><tr><td>Complete</td><td>\"Meeting on Monday.\"</td><td>\"Meeting on Monday 10 am, Room 4, agenda: line-2 downtime.\"</td></tr><tr><td>Courteous</td><td>\"Send it now.\"</td><td>\"Please send it by 4 pm so we can finish today.\"</td></tr></table><h4>Common mistake</h4><p>Chasing courtesy and forgetting completeness - a polite message without the date or the part number still stops the work.</p>"}, "diagram": "c5_seven", "syllabus_item": "1.1"}, {"h": {"en": "2.3 Rewriting a weak message"}, "body": {"en": "<h4>Method</h4><ol><li>Name the purpose - what must the reader do?</li><li>Write one sentence for that action.</li><li>Add only the facts needed: what, where, when, how much.</li><li>Close with a courteous request or a thank-you.</li></ol><h4>Worked example: the same message, rewritten</h4><p><b>Before:</b> \"Respected sir, as per telephonic conversation with your good self, the material which was supposed to come has not come, so kindly do the needful at the earliest and oblige.\"</p><p><b>After:</b> \"Sir, the 12 mm MS plates promised on 5 March have not arrived. Please confirm dispatch today, as the job is stopped.\"</p><h4>What changed</h4><ul><li>One paragraph of padding became two short sentences.</li><li>The vague 'material' became '12 mm MS plates'.</li><li>The date and the consequence (job stopped) were added.</li><li>The request is specific: confirm dispatch today.</li></ul><h4>Common mistake</h4><p>Rewriting only the grammar. The weakness is usually missing facts, not missing politeness.</p>"}, "syllabus_item": "1.1"}]}, {"title": {"en": "3. The Communication Model"}, "items": [{"h": {"en": "3.1 The seven parts, in order"}, "body": {"en": "<h4>The model</h4><p><b>S + E + C + D + R + N + F</b>: Sender, Encoding, Channel, Decoding, Receiver, Noise, Feedback.</p><table><tr><th>Part</th><th>Meaning</th><th>Example</th></tr><tr><td>Sender</td><td>the person with the idea</td><td>the supervisor</td></tr><tr><td>Encoding</td><td>turning the idea into words or signs</td><td>choosing the sentence</td></tr><tr><td>Channel</td><td>the route the message travels</td><td>a phone call</td></tr><tr><td>Decoding</td><td>the receiver interprets it</td><td>the fitter understands</td></tr><tr><td>Receiver</td><td>the person the message is for</td><td>the fitter</td></tr><tr><td>Noise</td><td>anything that disturbs the message</td><td>machine noise on the line</td></tr><tr><td>Feedback</td><td>the reply that closes the loop</td><td>\"Bearing checked, no play.\"</td></tr></table><h4>Read the model as a loop</h4><p>Feedback puts the receiver back in the sender's place, so the loop closes and the next message starts from a shared understanding.</p><h4>Common mistake</h4><p>Learning the seven words without an example each. In an exam, one example per part is what earns the marks.</p>"}, "diagram": "c1_cycle", "syllabus_item": "1.2"}, {"h": {"en": "3.2 Encoding and decoding"}, "body": {"en": "<h4>What encoding means</h4><p><b>Encoding</b> is choosing the symbols - words, numbers, gestures, drawings - that will carry the idea. <b>Decoding</b> is the receiver turning those symbols back into meaning.</p><h4>Examples of encoding choices</h4><h4>The same idea, encoded three ways</h4><ul><li>\"Torque to 45 N·m\" - words and a number for a technician.</li><li>A torque wrench with a dial set at 45 - a visual and physical code.</li><li>A drawing with the symbol for 'tighten to 45 N·m' - a standard engineering code.</li></ul><h4>When decoding fails</h4><table><tr><th>Sent</th><th>Understood</th><th>Why</th></tr><tr><td>\"Check the bearing clearance.\"</td><td>cleaned the bearing</td><td>similar sound, careless listening</td></tr><tr><td>\"Use the 6 mm bit.\"</td><td>used the 6 inch bit</td><td>unit dropped in speech</td></tr><tr><td>\"Cut it 2 m long.\"</td><td>cut it 2 feet long</td><td>mixed units</td></tr></table><h4>Common mistake</h4><p>Assuming the other person uses your code. Units, abbreviations and slang differ between trades and regions.</p>"}, "syllabus_item": "1.2"}, {"h": {"en": "3.3 Choosing the channel"}, "body": {"en": "<h4>Channel choice is part of the message</h4><p>The channel decides how fast the message travels, how much detail survives, and whether there is a record.</p><table><tr><th>Channel</th><th>Best for</th><th>Example</th></tr><tr><td>Face to face</td><td>instruction, correction, bad news</td><td>explaining a job to a new helper</td></tr><tr><td>Phone call</td><td>urgent, short, needs an answer now</td><td>\"Stop the line, the guard is loose.\"</td></tr><tr><td>E-mail</td><td>record, detail, attachment</td><td>sending a drawing revision to a vendor</td></tr><tr><td>Notice board</td><td>everyone at once, rules</td><td>the new safety helmet rule</td></tr><tr><td>Drawing or chart</td><td>shapes, positions, quantities</td><td>the panel layout before wiring</td></tr><tr><td>WhatsApp group</td><td>quick coordination on site</td><td>\"Material reached gate 2.\"</td></tr></table><h4>One message, wrong channel</h4><p>A 40-line specification sent as a voice note: it will be misheard and lost. The same text as an e-mail with a table is used for years.</p><h4>Common mistake</h4><p>Using the fastest channel for a message that needs a record, or the most formal channel for a question that needs an answer in one minute.</p>"}, "syllabus_item": "1.2"}, {"h": {"en": "3.4 Noise and feedback in practice"}, "body": {"en": "<h4>Noise</h4><p><b>Noise</b> is anything that reduces the fidelity of the message. It is not only sound.</p><h4>Examples of noise</h4><table><tr><th>Type of noise</th><th>Example</th></tr><tr><td>Physical</td><td>compressor running beside the phone</td></tr><tr><td>Technical</td><td>a weak signal cutting half a sentence</td></tr><tr><td>Semantic</td><td>jargon the receiver does not know</td></tr><tr><td>Psychological</td><td>the receiver is worried about a breakdown</td></tr><tr><td>Organisational</td><td>the message passes through four people before it arrives</td></tr></table><h4>Feedback</h4><p>Feedback can be verbal (\"understood, 45 N·m\"), written (a signed job card), or non-verbal (a nod, a completed task).</p><h4>Examples of feedback that actually checks understanding</h4><h4>Better than \"ok\"</h4><ul><li>\"So the pump runs for one hour, then we check the seal - right?\"</li><li>\"I will send the drawing by 4 pm and call you after the test.\"</li><li>A job card signed by the supervisor after the work is inspected.</li></ul><h4>Common mistake</h4><p>Accepting silence as agreement. Silence is the absence of feedback, not proof of understanding.</p>"}, "syllabus_item": "1.2"}]}, {"title": {"en": "4. Levels of Communication"}, "items": [{"h": {"en": "4.1 Downward communication"}, "body": {"en": "<h4>Definition</h4><p><b>Downward communication</b> flows from a higher level to a lower level: management to supervisors to workers. Its purpose is to direct, inform and explain.</p><h4>What travels down</h4><h4>Examples</h4><ul><li>An order: \"Run line 2 this afternoon.\"</li><li>A circular: \"Safety helmets compulsory from Monday.\"</li><li>A policy: \"Overtime needs written approval.\"</li><li>A job instruction with a drawing.</li><li>Feedback on performance: \"Your rejection rate has dropped to 0.5 %.\"</li></ul><h4>Strengths and risks</h4><p>It is fast and carries authority. The risk is dilution - each level trims or rewords, and the last person hears a different message.</p><h4>Example of dilution</h4><p>Management: \"Reduce material wastage by 10 % this quarter.\" Third level: \"Don't waste material.\" The number has gone, so no one knows what to do.</p><h4>Common mistake</h4><p>Sending a downward message once, in one channel, and assuming it has been received.</p>"}, "diagram": "c3_levels", "syllabus_item": "1.3"}, {"h": {"en": "4.2 Upward communication"}, "body": {"en": "<h4>Definition</h4><p><b>Upward communication</b> flows from a lower level to a higher level: workers to supervisors to management. Its purpose is to report, suggest and warn.</p><h4>What travels up</h4><h4>Examples</h4><ul><li>A report: \"Line 2 was down 45 minutes; belt replaced.\"</li><li>A suggestion: \"A roller stand here would save two men.\"</li><li>A grievance: \"The night shift has no drinking water.\"</li><li>A warning: \"Stock of 6205 bearings will finish by Thursday.\"</li><li>A clarification question: \"Do we hold the batch until the test report arrives?\"</li></ul><h4>Why organisations need it</h4><p>The people closest to the machine know the problems first. If upward flow is weak, management plans with old information.</p><h4>Example of a blocked upward message</h4><p>A fitter notices a crack but says nothing because \"nobody listens\". Three weeks later the coupling fails. The information existed; the channel did not.</p><h4>Common mistake</h4><p>Reporting only good news. Upward communication is most valuable when it carries bad news early.</p>"}, "syllabus_item": "1.3"}, {"h": {"en": "4.3 Difference between the two levels"}, "body": {"en": "<h4>Side by side</h4><table><tr><th>Point</th><th>Downward</th><th>Upward</th></tr><tr><td>Direction</td><td>top to bottom</td><td>bottom to top</td></tr><tr><td>Purpose</td><td>order, inform, explain</td><td>report, suggest, warn</td></tr><tr><td>Typical form</td><td>circular, instruction, appraisal</td><td>report, grievance, suggestion box</td></tr><tr><td>Tone</td><td>directive</td><td>respectful, factual</td></tr><tr><td>Risk</td><td>dilution and distortion</td><td>filtering and fear</td></tr><tr><td>Example</td><td>\"Helmets compulsory from Monday.\"</td><td>\"Two helmets are missing in our section.\"</td></tr></table><h4>Both directions carry the same message</h4><p>A policy goes down, and the confirmation comes back up. Without the return path, the sender never learns whether the policy arrived.</p><h4>Common mistake</h4><p>Calling every internal message 'downward'. Ask who writes to whom; the direction follows from that.</p>"}, "syllabus_item": "1.3"}, {"h": {"en": "4.4 Improving flow in both directions"}, "body": {"en": "<h4>Fixes that work</h4><ul><li>Shorten the chain: fewer levels between the decision and the machine.</li><li>Use one channel per message, and confirm receipt.</li><li>Hold a two-minute shift handover in person.</li><li>Keep a suggestion register with visible responses.</li><li>Answer grievances within a stated time.</li></ul><h4>Examples of a fix in action</h4><table><tr><th>Problem</th><th>Fix</th><th>Result</th></tr><tr><td>Instructions reach the shop floor changed</td><td>a one-page job card with the drawing</td><td>same message at every level</td></tr><tr><td>Workers never hear back on suggestions</td><td>a weekly note listing accepted ideas</td><td>upward flow increases</td></tr><tr><td>Supervisors are flooded with e-mails</td><td>one daily digest at 9 am</td><td>important messages are read</td></tr></table><h4>Common mistake</h4><p>Adding another level to 'improve control'. Every extra level is another place where the message can change.</p>"}, "syllabus_item": "1.3"}]}, {"title": {"en": "5. Types of Communication"}, "items": [{"h": {"en": "5.1 Verbal communication: oral and written"}, "body": {"en": "<h4>Definition</h4><p><b>Verbal communication uses words</b>, spoken or written. It is the type you use most, and the one that carries the detail.</p><h4>Oral and written compared</h4><table><tr><th>Point</th><th>Oral</th><th>Written</th></tr><tr><td>Speed</td><td>instant, with tone</td><td>slower to produce</td></tr><tr><td>Record</td><td>none unless recorded</td><td>permanent and traceable</td></tr><tr><td>Feedback</td><td>immediate</td><td>delayed</td></tr><tr><td>Best for</td><td>quick decisions, corrections, discussion</td><td>specifications, orders, reports, contracts</td></tr><tr><td>Example</td><td>\"Hold the job, I am coming.\"</td><td>\"Job No. 118 is on hold pending inspection.\"</td></tr></table><h4>Examples in a workshop</h4><h4>Ten seconds of verbal communication</h4><ul><li>Spoken instruction: \"Tighten the gland nut, not the body.\"</li><li>Written record: \"Gland nut tightened, no leak after 30 minutes.\"</li><li>Spoken warning: \"Stand clear, starting the motor.\"</li><li>Written rule: \"Never open the panel without isolation.\"</li></ul><h4>Common mistake</h4><p>Leaving an important instruction only in speech. If it must be remembered, write it.</p>"}, "diagram": "c2_types", "syllabus_item": "1.4"}, {"h": {"en": "5.2 Non-verbal communication"}, "body": {"en": "<h4>Definition</h4><p><b>Non-verbal communication</b> passes meaning without words - through the body, the voice and the use of space.</p><h4>Five channels with examples</h4><table><tr><th>Channel</th><th>Meaning</th><th>Example</th></tr><tr><td>Kinesics (body movement)</td><td>gesture, posture</td><td>a thumbs-up after inspection; folded arms during a discussion</td></tr><tr><td>Proxemics (space)</td><td>distance and territory</td><td>standing close to a machine to point at a fault</td></tr><tr><td>Paralanguage</td><td>tone, pitch, speed, pause</td><td>\"Fine.\" said flatly means the opposite</td></tr><tr><td>Haptics (touch)</td><td>physical contact</td><td>a hand on the shoulder in encouragement</td></tr><tr><td>Chronemics (time)</td><td>punctuality as a message</td><td>arriving late for a handover signals little respect for it</td></tr></table><h4>Why it matters</h4><p>In face-to-face talk, the body carries a large share of the meaning. A supervisor who says \"take your time\" while looking at the clock is not believed.</p><h4>Common mistake</h4><p>Reading one gesture as a fixed truth. Arms folded may mean cold, not angry - look at the whole situation.</p>"}, "syllabus_item": "1.4"}, {"h": {"en": "5.3 Visual communication"}, "body": {"en": "<h4>Definition</h4><p><b>Visual communication</b> uses images: drawings, charts, graphs, maps, signs, icons and colour codes.</p><h4>Examples you already meet</h4><table><tr><th>Visual</th><th>What it replaces</th></tr><tr><td>A wiring diagram</td><td>a page of text about connections</td></tr><tr><td>A bar chart of monthly breakdowns</td><td>a table of figures</td></tr><tr><td>A red sign with a crossed circle</td><td>\"Do not enter\"</td></tr><tr><td>A Gantt chart</td><td>paragraphs about the schedule</td></tr><tr><td>A floor plan with escape routes</td><td>a written evacuation description</td></tr></table><h4>Why engineers rely on it</h4><p>A drawing shows shape, position and size at once, in a way no sentence can. Standards (IS, ISO) exist so the same symbol means the same thing everywhere.</p><h4>Examples of visual communication going wrong</h4><h4>When a picture misleads</h4><ul><li>A chart with a cut y-axis makes a 2 % rise look like a doubling.</li><li>A sign in a language the visitor cannot read.</li><li>A drawing without a revision number - two versions in use at once.</li></ul><h4>Common mistake</h4><p>Assuming a picture is automatically clear. Every visual needs a caption, a scale and a date.</p>"}, "syllabus_item": "1.4"}, {"h": {"en": "5.4 Interpersonal communication"}, "body": {"en": "<h4>Definition</h4><p><b>Interpersonal communication</b> is communication between two people, or within a small group, where each can see and answer the other.</p><h4>Features</h4><ul><li>Two-way and immediate.</li><li>Carries feeling as well as information.</li><li>Depends on listening, tone and body language.</li></ul><h4>Examples</h4><h4>Interpersonal moments at work</h4><ul><li>Explaining a mistake to a helper without humiliating him.</li><li>A five-minute conversation with a supplier on the phone.</li><li>A supervisor and an apprentice agreeing on the order of jobs.</li><li>Apologising to a customer for a late delivery.</li></ul><h4>Why the tone matters</h4><p>\"You did it wrong\" closes the conversation; \"Let us see why the bore is oversize\" keeps it open and solves the problem.</p><h4>Common mistake</h4><p>Sending an interpersonal message by e-mail. Criticism, apology and encouragement work better face to face.</p>"}, "syllabus_item": "1.5"}, {"h": {"en": "5.5 Intrapersonal, extra personal and mass communication"}, "body": {"en": "<h4>Intrapersonal</h4><p><b>Intrapersonal communication</b> is communication with yourself - thinking, self-talk, planning, rehearsing.</p><h4>Examples</h4><ul><li>\"Check the torque twice today.\"</li><li>Rehearsing a sentence before a phone call.</li><li>Writing a to-do list and reading it back.</li></ul><h4>Extra personal</h4><p><b>Extra personal communication</b> is between a human being and a non-human: an animal, a machine, or a system that answers.</p><h4>Examples</h4><ul><li>Telling a dog to sit.</li><li>Talking to a machine that will not start.</li><li>Reading a sensor's beep as a message and answering by pressing stop.</li></ul><h4>Mass</h4><p><b>Mass communication</b> reaches a large, unknown audience at once through a medium: newspaper, radio, television, website, social media.</p><h4>Examples</h4><ul><li>A plant's safety week campaign on the notice boards and the website.</li><li>A government advisory on the radio.</li><li>A company's recruitment post on LinkedIn.</li></ul><h4>Common mistake</h4><p>Calling a notice board 'mass communication' when it serves forty workers. Mass means a large, scattered, anonymous audience.</p>"}, "syllabus_item": "1.5"}, {"h": {"en": "5.6 Choosing the type for the situation"}, "body": {"en": "<h4>Method: match the type to the situation</h4><p>Ask three questions - how urgent is it, how much detail must survive, and how many people must receive it? The answers pick the type.</p><table><tr><th>Situation</th><th>Type</th><th>Why</th></tr><tr><td>Correcting a dangerous habit</td><td>interpersonal, verbal + non-verbal</td><td>needs tone, eye contact and immediate feedback</td></tr><tr><td>Announcing a new policy to 300 workers</td><td>mass / downward written</td><td>same words to everyone, with a record</td></tr><tr><td>Recording that a bearing was replaced</td><td>written verbal</td><td>traceable later</td></tr><tr><td>Showing a crack to a colleague</td><td>visual + verbal</td><td>pointing shows it faster than describing it</td></tr><tr><td>Talking yourself through a startup sequence</td><td>intrapersonal</td><td>no second person involved</td></tr><tr><td>Congratulating a team</td><td>interpersonal</td><td>feeling must travel with the words</td></tr></table><h4>Rule of thumb</h4><p>Urgent and personal - speak. Detailed and lasting - write. Shape or position - draw. Many people, one message - publish.</p><h4>Worked examples</h4><ul><li>A guard rail is broken during the shift: speak to the supervisor at once (interpersonal, verbal) and log it the same evening (written).</li><li>A crack on a coupling: call the fitter, point at it (visual), then photograph it for the report.</li><li>A safety rule for 300 workers: a written circular plus a notice-board display (mass, visual).</li></ul><h4>Common mistake</h4><p>Using one favourite type for everything. A team that writes everything wastes time; a team that only speaks keeps no record.</p>"}, "syllabus_item": "1.5"}]}, {"title": {"en": "6. Barriers to Effective Communication"}, "items": [{"h": {"en": "6.1 Physical barriers"}, "body": {"en": "<h4>Definition</h4><p><b>Physical barriers</b> are conditions in the environment or the medium that stop the message travelling intact.</p><h4>Examples</h4><h4>Noise, distance and equipment</h4><ul><li>Two machines running beside a conversation in which a torque figure is given.</li><li>A phone call made from a workshop instead of a quiet corner.</li><li>A weak network dropping the last words of a voice message.</li><li>A guard's whistle lost inside ear protection.</li><li>A handwritten note blurred by rain on a site board.</li></ul><h4>Cures</h4><ul><li>Move to a quiet place before giving a number.</li><li>Repeat the key figure and make the listener repeat it.</li><li>Put critical instructions in writing.</li><li>Use the right channel: a drawing for shape, a call for urgency.</li></ul><h4>Example of the cost</h4><p>\"20 thou\" and \"20 mm\" sound alike through noise. The first is a tolerance, the second is scrap.</p><h4>Common mistake</h4><p>Shouting louder instead of changing the channel. Louder does not remove a language or noise problem.</p>"}, "syllabus_item": "1.6"}, {"h": {"en": "6.2 Language and semantic barriers"}, "body": {"en": "<h4>Definition</h4><p><b>Language barriers</b> come from the words themselves: jargon, ambiguity, poor grammar, different meanings for the same word.</p><h4>Examples</h4><table><tr><th>Language problem</th><th>Example</th></tr><tr><td>Jargon</td><td>\"Fix the DOB and reset the VFD.\" to a first-year apprentice</td></tr><tr><td>Ambiguity</td><td>\"Send it tomorrow\" - which tomorrow, and what is 'it'?</td></tr><tr><td>Wrong word</td><td>\"The pump is not working properly\" instead of \"the pump leaks at the seal\"</td></tr><tr><td>Grammar</td><td>\"The bolts is loose\" - the reader hesitates</td></tr><tr><td>False friend</td><td>British \"chips\" means fried potatoes, American \"chips\" means crispsfoods</td></tr><tr><td>Abbreviation</td><td>MS means mild steel here and Microsoft in an e-mail elsewhere</td></tr></table><h4>Cures</h4><ul><li>Define a term the first time you use it.</li><li>Prefer one short word to three long ones.</li><li>Give numbers with units.</li><li>Ask the receiver to state the instruction back.</li></ul><h4>Worked example</h4><p>\"Do the needful\" is not English that carries meaning. \"Replace the gasket and tighten to 20 N·m\" does.</p><h4>Common mistake</h4><p>Using jargon to look expert. Jargon excludes the person who must act on the message.</p>"}, "syllabus_item": "1.6"}, {"h": {"en": "6.3 Psychological barriers"}, "body": {"en": "<h4>Definition</h4><p><b>Psychological barriers</b> sit inside the people: fear, prejudice, stress, inattention, mistrust, or a fixed idea.</p><h4>Examples</h4><h4>Inside the sender and the receiver</h4><ul><li>A helper does not report a mistake because he fears the supervisor's anger.</li><li>A supervisor stops listening to an operator he has decided is careless.</li><li>A technician is so anxious about a breakdown that he hears only the first sentence.</li><li>A manager's \"suggestion\" is received as a criticism.</li><li>Everyone agrees in the meeting, and nothing changes afterwards.</li></ul><h4>Cures</h4><ul><li>Separate the person from the problem: discuss the bore, not the person.</li><li>Ask what the other person understood before replying.</li><li>Keep bad news safe to report - reward early warnings.</li><li>Pause, breathe and finish the sentence before answering.</li></ul><h4>Example</h4><p>Reporting a crack two days late costs a coupling. Reporting it in the first hour costs a chat.</p><h4>Common mistake</h4><p>Treating fear as a personal weakness. It is a communication barrier, and it is removed by behaviour, not by orders.</p>"}, "diagram": "c4_barriers", "syllabus_item": "1.6"}, {"h": {"en": "6.4 Cultural and organisational barriers"}, "body": {"en": "<h4>Cultural barriers</h4><p><b>Cultural barriers</b> arise when customs, values or gestures differ between people.</p><h4>Examples</h4><ul><li>Direct \"no\" is rude in some cultures, so silence is used instead.</li><li>The same hand gesture can be friendly in one region and offensive in another.</li><li>Hierarchy: a junior may not correct a senior, even when the senior is wrong.</li><li>A festival greeting is expected before business in some regions.</li></ul><h4>Organisational barriers</h4><p><b>Organisational barriers</b> come from the structure: too many levels, unclear channels, overload, or a culture that does not listen.</p><h4>Examples</h4><ul><li>Six signatures needed before a spare is ordered.</li><li>Workers are told of a change after the machine has moved.</li><li>Everyone copies everyone, and the important mail is lost.</li><li>A suggestion box that is never opened.</li></ul><h4>Cures</h4><ul><li>Flatten the chain and name one owner per message.</li><li>Fix a channel per purpose (safety, quality, stores).</li><li>Set a response time and keep it.</li><li>Train the team in listening, not only in tools.</li></ul><h4>Summary of the five families</h4><table><tr><th>Barrier</th><th>First question to ask</th></tr><tr><td>Physical</td><td>Can we hear and see each other?</td></tr><tr><td>Language</td><td>Do we use the same words for the same thing?</td></tr><tr><td>Psychological</td><td>Is either of us afraid, angry or tired?</td></tr><tr><td>Cultural</td><td>Does this gesture mean the same to both of us?</td></tr><tr><td>Organisational</td><td>Is there a clear channel and one owner?</td></tr></table><h4>Common mistake</h4><p>Blaming the receiver (\"he does not listen\") without checking the channel, the wording and the timing.</p>"}, "syllabus_item": "1.6"}]}, {"title": {"en": "7. Practice Questions with Model Answers"}, "items": [{"h": {"en": "Practice 1. Define communication and name its four language skills."}, "body": {"en": "<p><b>Communication</b> is the exchange of ideas, information or feelings between two or more people so that the receiver understands what the sender meant.</p><p>The four language skills are <b>listening, speaking, reading and writing</b> (LSRW). Listening and reading are receptive; speaking and writing are productive.</p><p>Example: a technician listens to the handover, reads the drawing, tells the helper which tools to bring and writes the entry in the log book - all four skills in one day.</p>"}}, {"h": {"en": "Practice 2. Explain the communication cycle with its seven parts."}, "body": {"en": "<p>The cycle is <b>S + E + C + D + R + N + F</b>: Sender, Encoding, Channel, Decoding, Receiver, Noise and Feedback.</p><p>The sender has the idea, encodes it into words or signs, sends it through a channel such as a phone call, and the receiver decodes it. Noise can disturb any stage, and feedback closes the loop.</p><p>Example: the supervisor says \"torque the head bolts to 45 N·m\" (encode, channel = speech); the fitter repeats it back (feedback); a compressor running nearby is the noise.</p>"}}, {"h": {"en": "Practice 3. What is the difference between hearing and listening?"}, "body": {"en": "<p><b>Hearing</b> is the physical reception of sound by the ear; it happens whether or not you pay attention.</p><p><b>Listening</b> is active: you pay attention, interpret and remember, and often reply.</p><p>Example: you hear the machine alarm and keep working (hearing); you hear it, stop the line and check the coolant level (listening).</p>"}}, {"h": {"en": "Practice 4. When is communication called effective? Give one example in favour and one against."}, "body": {"en": "<p>Communication is effective when the receiver's understanding matches the sender's intention, and the reply or action shows that it does.</p><p>Effective: \"Stop the conveyor, the guard is loose.\" One machine, one action, one reason.</p><p>Ineffective: \"Something seems wrong with the machine, maybe check it.\" No machine, no action, no urgency, so nothing happens until something breaks.</p>"}}, {"h": {"en": "Practice 5. Name the seven Cs of effective communication with one example each."}, "body": {"en": "<p>The seven Cs are clear, concise, concrete, correct, coherent, complete and courteous.</p><p>Weak to better: \"Do the needful\" becomes \"replace the gasket and refit the cover\" (clear). \"At this point of time we are not in a position to supply\" becomes \"we cannot supply before Monday\" (concise). \"The motor is faulty\" becomes \"the motor draws 9 A against a rated 6 A\" (concrete).</p><p>\"The bolts is loose\" becomes \"the bolts are loose\" (correct). A jumbled list is put in time order (coherent). \"Meeting on Monday\" gains a time, a room and an agenda (complete). \"Send it now\" becomes \"please send it by 4 pm so we can finish today\" (courteous).</p>"}}, {"h": {"en": "Practice 6. Define downward communication and give three examples."}, "body": {"en": "<p><b>Downward communication</b> flows from a higher level to a lower level of an organisation - from management to supervisors to workers.</p><p>Its purpose is to direct, inform and explain. Examples: an order (\"run line 2 this afternoon\"), a circular (\"safety helmets compulsory from Monday\") and a policy (\"overtime needs written approval\").</p><p>The main risk is dilution: the number in \"reduce wastage by 10 %\" disappears by the time it reaches the shop floor.</p>"}}, {"h": {"en": "Practice 7. Define upward communication and give three examples."}, "body": {"en": "<p><b>Upward communication</b> flows from a lower level to a higher level - from workers to supervisors to management.</p><p>Its purpose is to report, suggest and warn. Examples: a breakdown report (\"line 2 down 45 minutes, belt replaced\"), a suggestion (\"a roller stand here would save two men\") and a warning (\"6205 bearings will finish by Thursday\").</p><p>It is most valuable when it carries bad news early, as a fitter's report of a small crack prevents a coupling failure.</p>"}}, {"h": {"en": "Practice 8. Differentiate between downward and upward communication."}, "body": {"en": "<p>Downward flows from top to bottom; upward flows from bottom to top.</p><p>Downward carries orders, circulars, policy and instructions, in a directive tone; upward carries reports, suggestions, grievances and warnings, in a factual tone.</p><p>Examples: \"helmets compulsory from Monday\" goes down, and \"two helmets are missing in our section\" comes up. The risk of downward flow is dilution; the risk of upward flow is filtering through fear.</p>"}}, {"h": {"en": "Practice 9. What is verbal communication? Compare its oral and written forms."}, "body": {"en": "<p><b>Verbal communication</b> uses words, either spoken or written.</p><p>Oral is instant, carries tone and gives immediate feedback, but leaves no record; written is slower, permanent and traceable, but feedback is delayed.</p><p>Examples: orally - \"hold the job, I am coming\"; in writing - \"job no. 118 is on hold pending inspection\". Details and orders belong in writing; quick corrections belong in speech.</p>"}}, {"h": {"en": "Practice 10. Explain non-verbal communication with three examples."}, "body": {"en": "<p><b>Non-verbal communication</b> carries meaning without words, through the body, the voice and the use of space.</p><p>Kinesics: a thumbs-up after inspection shows approval. Paralanguage: a flat \"fine\" can mean the opposite of the word. Proxemics: standing close to a machine to point at a fault shows where the problem is.</p><p>Two more channels are haptics (touch, such as a hand on the shoulder) and chronemics (time - arriving late for a handover signals that it is not important).</p>"}}, {"h": {"en": "Practice 11. Give two examples of visual communication and say why engineers use it."}, "body": {"en": "<p><b>Visual communication</b> uses drawings, charts, graphs, maps and signs.</p><p>Examples: a wiring diagram shows connections faster than a page of text, and a bar chart of monthly breakdowns shows a trend that a table of figures hides.</p><p>Engineers rely on it because a drawing carries shape, position and size at once, and because standard symbols (IS, ISO) mean the same thing to every reader - provided the drawing has a scale, a caption and a revision number.</p>"}}, {"h": {"en": "Practice 12. Explain interpersonal, intrapersonal, extra personal and mass communication."}, "body": {"en": "<p><b>Interpersonal</b> is between two people or in a small group, two-way and immediate - a supervisor explaining a mistake to a helper.</p><p><b>Intrapersonal</b> is with yourself - rehearsing a phone call or writing a to-do list. <b>Extra personal</b> is between a human being and a non-human - telling a dog to sit, or reading a sensor's beep as a message.</p><p><b>Mass</b> reaches a large, scattered, anonymous audience through a medium - a newspaper, radio, website or social-media post.</p>"}}, {"h": {"en": "Practice 13. Name the five families of barriers and give one example of each."}, "body": {"en": "<p><b>Physical</b>: two machines running beside a phone call in which a torque figure is given. <b>Language</b>: \"fix the DOB and reset the VFD\" to a first-year apprentice.</p><p><b>Psychological</b>: a helper hides a mistake because he fears the supervisor's anger. <b>Cultural</b>: a junior will not correct a senior, even when the senior is wrong.</p><p><b>Organisational</b>: six signatures are needed before a spare is ordered, so the machine stays down.</p>"}}, {"h": {"en": "Practice 14. How can the barriers to communication be removed?"}, "body": {"en": "<p>First name the barrier, then remove its cause.</p><p>For physical barriers, move to a quiet place and confirm key figures back. For language barriers, define terms, use plain words and give numbers with units. For psychological barriers, make early reporting safe and discuss the problem rather than the person.</p><p>For cultural barriers, ask what a gesture means before judging it; for organisational barriers, shorten the chain, keep one owner per message and answer grievances within a stated time.</p>"}}]}], "diagrams": [{"id": "c1_cycle", "title": {"en": "The communication cycle: S E C D R N F"}, "file": "diagrams/c1_cycle.svg"}, {"id": "c2_types", "title": {"en": "Three kinds of communication"}, "file": "diagrams/c2_types.svg"}, {"id": "c3_levels", "title": {"en": "Upward and downward communication"}, "file": "diagrams/c3_levels.svg"}, {"id": "c4_barriers", "title": {"en": "Five families of barriers"}, "file": "diagrams/c4_barriers.svg"}, {"id": "c5_seven", "title": {"en": "The seven Cs of a good message"}, "file": "diagrams/c5_seven.svg"}], "equations": [{"title": {"en": "The model in one line"}, "items": [{"terms": {"en": "Communication cycle"}, "a": {"en": "Sender → Encoding → Channel → Decoding → Receiver, with Noise throughout and Feedback closing the loop"}}, {"terms": {"en": "Effective communication"}, "a": {"en": "the receiver's understanding equals the sender's intention"}}, {"terms": {"en": "Seven Cs"}, "a": {"en": "clear, concise, concrete, correct, coherent, complete, courteous"}}, {"terms": {"en": "Four language skills"}, "a": {"en": "listening, speaking, reading, writing (LSRW)"}}]}, {"title": {"en": "Levels and types"}, "items": [{"terms": {"en": "Downward"}, "a": {"en": "top to bottom: orders, circulars, policy, instructions"}}, {"terms": {"en": "Upward"}, "a": {"en": "bottom to top: reports, suggestions, grievances, warnings"}}, {"terms": {"en": "Verbal / non-verbal / visual"}, "a": {"en": "words / body and voice / images and signs"}}, {"terms": {"en": "Interpersonal / intrapersonal"}, "a": {"en": "between people / with yourself"}}, {"terms": {"en": "Extra personal / mass"}, "a": {"en": "with a non-human / with a large anonymous audience"}}]}, {"title": {"en": "Barriers"}, "items": [{"terms": {"en": "Physical"}, "a": {"en": "noise, distance, weak signal, bad handwriting"}}, {"terms": {"en": "Language"}, "a": {"en": "jargon, ambiguity, wrong word, poor grammar"}}, {"terms": {"en": "Psychological"}, "a": {"en": "fear, prejudice, stress, inattention"}}, {"terms": {"en": "Cultural"}, "a": {"en": "customs, gestures, hierarchy"}}, {"terms": {"en": "Organisational"}, "a": {"en": "too many levels, unclear channel, overload"}}]}], "viva": [{"title": {"en": "Definitions"}, "items": [{"q": {"en": "What is communication?"}, "a": {"en": "The exchange of ideas, information or feelings between people so that the receiver understands what the sender meant."}}, {"q": {"en": "What are the four language skills?"}, "a": {"en": "Listening and speaking (oral), reading and writing (written) - LSRW."}}, {"q": {"en": "What is the difference between hearing and listening?"}, "a": {"en": "Hearing is the ear receiving sound; listening is paying attention, understanding and remembering."}}, {"q": {"en": "When is communication called effective?"}, "a": {"en": "When the receiver's understanding matches the sender's intention and the reply or action shows it."}}, {"q": {"en": "Name the seven Cs."}, "a": {"en": "Clear, concise, concrete, correct, coherent, complete, courteous."}}, {"q": {"en": "Give one example of ineffective communication and say why."}, "a": {"en": "\"Do the needful\" - it names no action, no object and no time, so the reader cannot act on it."}}]}, {"title": {"en": "Model, levels and types"}, "items": [{"q": {"en": "Expand S+E+C+D+R+N+F."}, "a": {"en": "Sender, Encoding, Channel, Decoding, Receiver, Noise, Feedback."}}, {"q": {"en": "What is encoding? Give an example."}, "a": {"en": "Turning an idea into words, numbers or signs - for example saying \"torque to 45 N·m\" instead of pointing at the bolt."}}, {"q": {"en": "What is feedback and why is it important?"}, "a": {"en": "The receiver's reply or action; it closes the loop and proves the message arrived, for example \"bearing checked, no play\"."}}, {"q": {"en": "What is noise in communication?"}, "a": {"en": "Anything that reduces the fidelity of the message - machine noise, a weak signal, jargon, or a distracted receiver."}}, {"q": {"en": "Define downward communication with two examples."}, "a": {"en": "Message from a higher to a lower level: an order to run line 2, or a circular making helmets compulsory."}}, {"q": {"en": "Define upward communication with two examples."}, "a": {"en": "Message from a lower to a higher level: a breakdown report, or a suggestion about a roller stand."}}, {"q": {"en": "Name the three main types of communication by medium."}, "a": {"en": "Verbal (words), non-verbal (body and voice) and visual (images and signs)."}}, {"q": {"en": "Give an example of intrapersonal communication."}, "a": {"en": "Talking yourself through a startup sequence, or writing a to-do list and reading it back."}}, {"q": {"en": "What is mass communication?"}, "a": {"en": "Communication with a large, scattered, anonymous audience through a medium such as a newspaper, radio, website or social media."}}]}, {"title": {"en": "Barriers"}, "items": [{"q": {"en": "Name the five families of barriers."}, "a": {"en": "Physical, language (semantic), psychological, cultural and organisational."}}, {"q": {"en": "Give a physical barrier and its cure."}, "a": {"en": "Machine noise beside a phone call; the cure is to move to a quiet place and confirm the figure back."}}, {"q": {"en": "Give a language barrier and its cure."}, "a": {"en": "\"Fix the DOB and reset the VFD\" to an apprentice; the cure is to define the term or use plain words."}}, {"q": {"en": "Give a psychological barrier and its cure."}, "a": {"en": "A helper hides a mistake out of fear; the cure is to make early reporting safe and to discuss the problem, not the person."}}, {"q": {"en": "How does an organisation create barriers?"}, "a": {"en": "Through too many levels, unclear channels, overload and a culture that does not answer suggestions."}}]}], "exam_questions": [{"q": {"en": "Practice: Define communication and name its four language skills."}, "marks": 3}, {"q": {"en": "Practice: Explain the communication cycle with its seven parts."}, "marks": 4}, {"q": {"en": "Practice: What is the difference between hearing and listening?"}, "marks": 3}, {"q": {"en": "Practice: When is communication called effective? Give one example in favour and one against."}, "marks": 4}, {"q": {"en": "Practice: Name the seven Cs of effective communication with one example each."}, "marks": 4}, {"q": {"en": "Practice: Define downward communication and give three examples."}, "marks": 3}, {"q": {"en": "Practice: Define upward communication and give three examples."}, "marks": 3}, {"q": {"en": "Practice: Differentiate between downward and upward communication."}, "marks": 4}, {"q": {"en": "Practice: What is verbal communication? Compare its oral and written forms."}, "marks": 4}, {"q": {"en": "Practice: Explain non-verbal communication with three examples."}, "marks": 4}, {"q": {"en": "Practice: Give two examples of visual communication and say why engineers use it."}, "marks": 3}, {"q": {"en": "Practice: Explain interpersonal, intrapersonal, extra personal and mass communication."}, "marks": 4}, {"q": {"en": "Practice: Name the five families of barriers and give one example of each."}, "marks": 4}, {"q": {"en": "Practice: How can the barriers to communication be removed?"}, "marks": 4}], "learning_outcomes": [{"en": "CO1: Use strategies to minimize barriers of effective communication."}], "course_outcomes": ["CO1"], "practical_numbers": [], "content_kind": "theory", "lesson_count": 26, "answered_practice_count": 14, "assessment_note": {"en": "Official course: theory ESE 70 + PA 30 and practical PA 20 + ESE 30 = 150 marks, 3 credits, 30 teaching hours; this unit carries 20 % weightage and 14 of the 70 theory marks. Practice-question marks (3/4) are suggested revision sizes, not official GTU allocations. Model answers are in Notes section 7."}, "question_provenance": "Original answered revision questions; not official past papers", "question_marks_are_suggested": true, "sources": [{"title": "GTU DI01000031, Communication Skills in English, Semester 1, HSMC-1 (uploaded syllabus)", "url": "https://syllabus.gtu.ac.in/"}, {"title": "British Council LearnEnglish - speaking, listening and writing skills", "url": "https://learnenglish.britishcouncil.org/skills"}, {"title": "Cambridge Dictionary - definitions and usage examples", "url": "https://dictionary.cambridge.org/dictionary/english/"}, {"title": "Kulbhushan Kumar - Effective Communication Skills (Khanna Publishing House, 2018)", "url": "https://www.khannapublishers.in/"}, {"title": "MindTools - the communication process and the seven Cs", "url": "https://www.mindtools.com/"}]};
const SVG = {"c1_cycle": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 400\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"400\" fill=\"#ffffff\"/><text x=\"180\" y=\"28.9\" font-size=\"14\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">The communication cycle</text><text x=\"180\" y=\"49.6\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">seven parts, in this order</text><rect x=\"15.0\" y=\"61.0\" width=\"330\" height=\"26\" rx=\"7\" fill=\"#EAF3FD\" stroke=\"#1565C0\" stroke-width=\"1.6\"/><text x=\"180\" y=\"77.5\" font-size=\"9.9\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">S - Sender: the person who has the idea</text><path d=\"M180 87 L180 106\" fill=\"none\" stroke=\"#666\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polygon points=\"180.0,106.0 183.5,99.0 176.5,99.0\" fill=\"#666\"/><rect x=\"15.0\" y=\"106.0\" width=\"330\" height=\"26\" rx=\"7\" fill=\"#EAF3FD\" stroke=\"#1565C0\" stroke-width=\"1.6\"/><text x=\"180\" y=\"122.5\" font-size=\"9.9\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">E - Encoding: the idea becomes words, signs or pictures</text><path d=\"M180 132 L180 151\" fill=\"none\" stroke=\"#666\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polygon points=\"180.0,151.0 183.5,144.0 176.5,144.0\" fill=\"#666\"/><rect x=\"15.0\" y=\"151.0\" width=\"330\" height=\"26\" rx=\"7\" fill=\"#EAF6EC\" stroke=\"#2E7D32\" stroke-width=\"1.6\"/><text x=\"180\" y=\"167.5\" font-size=\"9.9\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">C - Channel: speech, e-mail, phone call, notice board</text><path d=\"M180 177 L180 196\" fill=\"none\" stroke=\"#666\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polygon points=\"180.0,196.0 183.5,189.0 176.5,189.0\" fill=\"#666\"/><rect x=\"15.0\" y=\"196.0\" width=\"330\" height=\"26\" rx=\"7\" fill=\"#EAF6EC\" stroke=\"#2E7D32\" stroke-width=\"1.6\"/><text x=\"180\" y=\"212.5\" font-size=\"9.9\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">D - Decoding: the receiver works out what the words mean</text><path d=\"M180 222 L180 241\" fill=\"none\" stroke=\"#666\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polygon points=\"180.0,241.0 183.5,234.0 176.5,234.0\" fill=\"#666\"/><rect x=\"15.0\" y=\"241.0\" width=\"330\" height=\"26\" rx=\"7\" fill=\"#EAF6EC\" stroke=\"#2E7D32\" stroke-width=\"1.6\"/><text x=\"180\" y=\"257.5\" font-size=\"9.9\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">R - Receiver: the person the message is meant for</text><path d=\"M180 267 L180 286\" fill=\"none\" stroke=\"#666\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polygon points=\"180.0,286.0 183.5,279.0 176.5,279.0\" fill=\"#666\"/><rect x=\"15.0\" y=\"286.0\" width=\"330\" height=\"26\" rx=\"7\" fill=\"#FFF4DF\" stroke=\"#B66A00\" stroke-width=\"1.6\"/><text x=\"180\" y=\"302.5\" font-size=\"9.9\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">F - Feedback: the reply that closes the loop</text><rect x=\"15.0\" y=\"327.0\" width=\"330\" height=\"26\" rx=\"7\" fill=\"#FDECF0\" stroke=\"#BD2543\" stroke-width=\"1.6\"/><text x=\"180\" y=\"343.5\" font-size=\"9.9\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">N - Noise: anything that disturbs a part of the cycle</text><text x=\"180\" y=\"379.6\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">Feedback is what makes it communication, not just a broadcast.</text><text x=\"180\" y=\"395.6\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">Noise can enter at any stage - the room, the words, or the mood.</text></svg>", "c2_types": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 380\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"380\" fill=\"#ffffff\"/><text x=\"180\" y=\"28.9\" font-size=\"14\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">Three kinds of communication</text><text x=\"180\" y=\"49.6\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">verbal, non-verbal and visual</text><rect x=\"13.0\" y=\"63.0\" width=\"334\" height=\"26\" rx=\"7\" fill=\"#EAF3FD\" stroke=\"#1565C0\" stroke-width=\"1.6\"/><text x=\"180\" y=\"79.6\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">Verbal: words - spoken or written</text><rect x=\"13.0\" y=\"95.0\" width=\"334\" height=\"26\" rx=\"7\" fill=\"#EAF3FD\" stroke=\"#1565C0\" stroke-width=\"1.6\"/><text x=\"180\" y=\"111.4\" font-size=\"9.6\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">spoken: viva, phone call, lecture, interview</text><rect x=\"13.0\" y=\"127.0\" width=\"334\" height=\"26\" rx=\"7\" fill=\"#EAF3FD\" stroke=\"#1565C0\" stroke-width=\"1.6\"/><text x=\"180\" y=\"143.4\" font-size=\"9.6\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">written: e-mail, report, notice, WhatsApp text</text><rect x=\"13.0\" y=\"165.0\" width=\"334\" height=\"26\" rx=\"7\" fill=\"#EAF6EC\" stroke=\"#2E7D32\" stroke-width=\"1.6\"/><text x=\"180\" y=\"181.6\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">Non-verbal: body and voice, without words</text><rect x=\"13.0\" y=\"197.0\" width=\"334\" height=\"26\" rx=\"7\" fill=\"#EAF6EC\" stroke=\"#2E7D32\" stroke-width=\"1.6\"/><text x=\"180\" y=\"213.3\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">gesture, posture, eye contact, tone, personal space</text><rect x=\"13.0\" y=\"235.0\" width=\"334\" height=\"26\" rx=\"7\" fill=\"#FFF4DF\" stroke=\"#B66A00\" stroke-width=\"1.6\"/><text x=\"180\" y=\"251.6\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">Visual: pictures and layouts</text><rect x=\"13.0\" y=\"267.0\" width=\"334\" height=\"26\" rx=\"7\" fill=\"#FFF4DF\" stroke=\"#B66A00\" stroke-width=\"1.6\"/><text x=\"180\" y=\"283.4\" font-size=\"9.6\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">graph, chart, map, safety sign, icon, flowchart</text><rect x=\"13.0\" y=\"306.0\" width=\"334\" height=\"24\" rx=\"7\" fill=\"#FDECF0\" stroke=\"#BD2543\" stroke-width=\"1.6\"/><text x=\"180\" y=\"321.4\" font-size=\"9.8\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">most messages mix all three at once</text><text x=\"180\" y=\"359.6\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">A safety sign is visual, the warning shout is verbal,</text><text x=\"180\" y=\"375.6\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">and the raised hand that stops the gang is non-verbal.</text></svg>", "c3_levels": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 356\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"356\" fill=\"#ffffff\"/><text x=\"180\" y=\"28.9\" font-size=\"14\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">Upward and downward</text><text x=\"180\" y=\"49.6\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">who sends, who receives</text><rect x=\"105.0\" y=\"65.0\" width=\"150\" height=\"26\" rx=\"7\" fill=\"#EAF3FD\" stroke=\"#1565C0\" stroke-width=\"1.6\"/><text x=\"180\" y=\"81.5\" font-size=\"10.0\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">Top management</text><rect x=\"105.0\" y=\"135.0\" width=\"150\" height=\"26\" rx=\"7\" fill=\"#EAF6EC\" stroke=\"#2E7D32\" stroke-width=\"1.6\"/><text x=\"180\" y=\"151.5\" font-size=\"10.0\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">Middle level</text><rect x=\"105.0\" y=\"205.0\" width=\"150\" height=\"26\" rx=\"7\" fill=\"#FFF4DF\" stroke=\"#B66A00\" stroke-width=\"1.6\"/><text x=\"180\" y=\"221.5\" font-size=\"10.0\" text-an       `<div class="card"><div class="q hd"><span class="n">${i+1}.</span><span class="t">${t(v.q)}</span>${chev}</div><div class="a"><p>${t(v.a)}</p></div></div>`).join('') + `</div>`;
  }).join('');
}
function exam(){
  return `<div class="sec">${head(L('examhead'),false)}` + U.exam_questions.map((x,i)=>
    `<div class="card"><div class="q" style="cursor:default"><span class="n">${i+1}.</span><span class="t">${t(x.q)}</span><span class="mk">${x.marks} ${L('marks')}</span></div></div>`).join('') + `</div>`;
}
function programs(){
  return `<div class="sec">${head(L('programs'))}` + (U.programs||[]).map((p,i)=>
    `<div class="card"><div class="q hd"><span class="n">${i+1}.</span><span class="t">${t(p.title)}</span>${chev}</div><div class="a pa">${progBody(p)}</div></div>`).join('') + `</div>`;
}
function syntax(key){
  return (U[typeof key==='string'?key:'syntax']||[]).map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><pre class="code sx">${hl(e.f)}</pre></span>${chev}</div>
     <div class="a">${e.terms && t(e.terms) ? fixTables(t(e.terms)) : ''}</div></div>`).join('') + `</div>`).join('');
}
const flowcharts = diagrams;
const algorithms = () => syntax('algorithms');
const ALLV = {notes, programs, diagrams, flowcharts, algorithms, syntax, equations, numericals, viva, exam};
const VIEWS = U.tabs ? Object.fromEntries(U.tabs.map(k=>[k, ALLV[k]])) : U.programs ? (META.code_lang==='python' ? {notes, programs, diagrams, syntax, viva, exam} : {notes, programs, flowcharts, syntax, viva, exam}) : U.numericals ? {notes, diagrams, equations, numericals, viva, exam} : {notes, diagrams, equations, viva, exam};
function render(){
  document.getElementById('title').textContent = `${L('unit')} ${U.unit}: ${t(U.title)}`;
  document.getElementById('sub').textContent = `${t(META.name)} · ${META.code}`;
  document.getElementById('lang').textContent = S.lang==='en' ? 'ગુ' : 'EN';
  document.getElementById('lang').style.display = META.languages.includes('gu') ? '' : 'none';
  document.getElementById('tabs').innerHTML = Object.keys(VIEWS).map(k=>`<button class="tab${S.tab===k?' on':''}" data-tab="${k}">${L(k)}</button>`).join('');
  document.getElementById('view').innerHTML = VIEWS[S.tab]();
  document.querySelectorAll('#view pre.c').forEach(e=>{ e.innerHTML = hl(e.textContent); e.className='code'; });
}
let zoom = 1;
function setZoom(z){ zoom = Math.min(4, Math.max(1, z)); const w=document.getElementById('zw'); w.style.width=(zoom*100)+'%'; document.getElementById('zr').textContent=Math.round(zoom*100)+'%'; }
document.addEventListener('click', e=>{
  const q = e.target.closest('.q'); if (q && q.parentElement.querySelector('.a')) { q.parentElement.classList.toggle('open'); return; }
  const tb = e.target.closest('[data-tab]'); if (tb){ S.tab = tb.dataset.tab; render(); window.scrollTo(0,0); return; }
  if (e.target.closest('#lang')){ S.lang = S.lang==='en'?'gu':'en'; render(); return; }
  const m = e.target.closest('[data-more]');
  document.querySelectorAll('.menu.show').forEach(x=>{ if(!m || x!==m.nextElementSibling) x.classList.remove('show'); });
  if (m){ m.nextElementSibling.classList.toggle('show'); return; }
  const act = e.target.closest('[data-act]');
  if (act){ act.closest('.sec').querySelectorAll('.card').forEach(c=>{ if(c.querySelector('.a')) c.classList.toggle('open', act.dataset.act==='expand'); }); act.parentElement.classList.remove('show'); return; }
  const dg = e.target.closest('[data-dg]');
  if (dg){ const id=dg.dataset.dg; document.getElementById('mt').textContent=t(U.diagrams.find(d=>d.id===id).title); document.getElementById('zw').innerHTML=SVG[id]; setZoom(1); document.getElementById('modal').classList.add('show'); return; }
  if (e.target.closest('#mx')) document.getElementById('modal').classList.remove('show');
  if (e.target.closest('#zi')) setZoom(zoom+0.5);
  if (e.target.closest('#zo')) setZoom(zoom-0.5);
  if (e.target.closest('#zr')) setZoom(1);
});
render();
</script></body></html>
