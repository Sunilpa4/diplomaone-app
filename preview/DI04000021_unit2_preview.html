<script>
const U = {"subject": "DI04000021", "unit": 2, "format": "notes", "title": {"en": "Object-Oriented Programming Concepts"}, "weightage": 25, "hours": 10, "notes": [{"title": {"en": "2.1 Principles of OOP"}, "items": [{"h": {"en": "The Four Principles: Abstraction, Encapsulation, Inheritance, Polymorphism"}, "body": {"en": "\n<p>Object-Oriented Programming models software the way humans see the world - as <b>objects with data and behaviour</b>. Four principles support everything built with it:</p>\n<ul><li><b>Abstraction</b> - show only what the user needs, hide the rest. You press an ATM's \"Withdraw\" button and never see its inner code. In Java: abstract classes and interfaces (Unit 3).</li>\n<li><b>Encapsulation</b> - keep data and the methods that guard it together in one <b>safe box</b> (the class), making fields private and offering public methods. A capsule protects its medicine the same way.</li>\n<li><b>Inheritance</b> - a new class <b>reuses</b> an existing class and only adds or changes what is special: class Car extends class Vehicle.</li>\n<li><b>Polymorphism</b> (many forms) - the same name doing different work: <code>add(2,3)</code>, <code>add(2,3,4)</code> and <code>add(2.5,7.5)</code> all \"add\" in their own way.</li></ul>\n<p>These four are the favourite definition question of Unit 2 - learn one real-world example for each.</p>\n"}, "diagram": "jv2_pillars"}]}, {"title": {"en": "2.2 Classes and Objects"}, "items": [{"h": {"en": "Class, Object, Fields and Methods"}, "body": {"en": "\n<ul><li>A <b>class</b> is a user-defined blueprint: it describes which data (fields) and which actions (methods) its objects will have.</li>\n<li>An <b>object</b> is a real instance created with <code>new</code>: <code>Student s1 = new Student();</code> - the class name is the type, <code>new</code> reserves memory in the heap.</li>\n<li><b>Fields</b> (<code>int roll; String name;</code>) hold the state of each object separately; the <b>dot operator</b> reaches members: <code>s1.roll</code>, <code>s1.display()</code>.</li>\n<li>A method called on an object works with <i>that object's own</i> fields - display() of s1 prints s1's data.</li></ul>\n<p>Run the Student program and see how two objects keep separate values even though the code is written once.</p>\n"}, "diagram": "jv2_class_object", "programs": ["jv2_1"]}]}, {"title": {"en": "2.3 Constructors"}, "items": [{"h": {"en": "Default, Parameterized and Overloaded Constructors"}, "body": {"en": "\n<ul><li>A <b>constructor</b> is a special member that initializes a freshly created object. Rules: same name as the class, <b>no return type</b> (not even void), called automatically by <code>new</code>.</li>\n<li><b>Default constructor</b>: no parameters - gives fixed starting values. If you write NO constructor at all, Java quietly supplies an empty default one.</li>\n<li><b>Parameterized constructor</b>: receives values used to set up the object differently each time.</li>\n<li><b>Constructor overloading</b>: several constructors with different parameter lists; the compiler selects by the <code>new</code> call's arguments.</li>\n<li>Constructors are not methods (they cannot be called like <code>obj.Book()</code>) and are not inherited.</li></ul>\n"}, "diagram": "jv2_ctor", "programs": ["jv2_3", "jv2_4"]}]}, {"title": {"en": "2.4 Keywords: this and static"}, "items": [{"h": {"en": "The this Keyword"}, "body": {"en": "\n<ul><li><code>this</code> is a reference to the <b>current object</b> - the one on which the method or constructor is running.</li>\n<li><b>Use 1 - shadowing:</b> when a parameter has the same name as a field, <code>this.name = name;</code> assigns the parameter into the field.</li>\n<li><b>Use 2 - constructor chaining:</b> <code>this(...)</code> as the first statement of a constructor calls another constructor of the same class, so shared setup is written once.</li>\n<li><b>Use 3 - current object as a value:</b> <code>return this;</code> or passing <code>this</code> as an argument.</li></ul>\n"}, "programs": ["jv2_5"]}, {"h": {"en": "The static Keyword"}, "body": {"en": "\n<ul><li><code>static</code> members belong to the <b>class</b>, not to any object: there is exactly ONE copy, created when the class is loaded.</li>\n<li><b>Static variable</b> - shared by all objects; the classic counter in the live program.</li>\n<li><b>Static method</b> - called with the class name (<code>Counter.report()</code>), receives no <code>this</code>, and can directly touch only static members. <code>main()</code> is static for this reason.</li>\n<li><b>Static block</b> - runs once when the class is loaded, before main(); used for one-time setup.</li>\n<li>A <b>static nested class</b> is a helper class attached to an outer class without needing an outer object (Unit 5 uses it in lambdas' cousins).</li></ul>\n"}, "diagram": "jv2_this_static", "programs": ["jv2_6"]}]}, {"title": {"en": "2.5 Access Modifiers"}, "items": [{"h": {"en": "public, private, protected, default"}, "body": {"en": "\n<p>Access modifiers decide <b>who may use</b> a class member:</p>\n<ul><li><b>private</b> - only inside the same class. Hiding fields as private is the heart of encapsulation.</li>\n<li><b>default</b> (no keyword written) - visible everywhere in the same <b>package</b>.</li>\n<li><b>protected</b> - package + subclasses in any package (needed with inheritance, Unit 3).</li>\n<li><b>public</b> - visible from anywhere.</li></ul>\n<ul><li>Order from most open to most restricted: public &gt; protected &gt; default &gt; private.</li>\n<li>Good practice: fields private, behaviour public - outsiders change data only through checked methods (<code>deposit()</code> rejects negative amounts).</li></ul>\n"}, "diagram": "jv2_access", "programs": ["jv2_7"]}]}, {"title": {"en": "2.6 Methods"}, "items": [{"h": {"en": "Method Definition, Calling and Overloading"}, "body": {"en": "\n<ul><li><b>Definition:</b> <code>returnType name(parameters) { body }</code> - e.g. <code>int add(int x, int y) { return x + y; }</code>.</li>\n<li><b>Calling:</b> run the method by its name with matching arguments: <code>int s = add(7, 5);</code>. Values flow into parameters; <code>return</code> sends exactly one value back.</li>\n<li><code>void</code> methods return nothing - they just do work.</li>\n<li><b>Method overloading</b>: the same name with different parameter lists (number or type). The compiler picks the match at <b>compile time</b> - this is compile-time (static) polymorphism. Return type alone cannot overload.</li></ul>\n"}, "programs": ["jv2_2", "jv2_8"]}]}, {"title": {"en": "2.7 Strings"}, "items": [{"h": {"en": "The String Class and Common Methods"}, "body": {"en": "\n<ul><li><code>String</code> is a class; texts are objects created from literals: <code>String s = \"GTU Diploma\";</code>.</li>\n<li>Strings are <b>immutable</b> - every change creates a new string; ten edits create ten objects (for heavy editing use StringBuilder).</li>\n<li>Top methods for the exam: <code>length()</code>, <code>charAt(i)</code>, <code>substring(be)</code>, <code>toUpperCase()</code>, <code>toLowerCase()</code>, <code>indexOf()</code>, <code>contains()</code>, <code>trim()</code>, <code>replace()</code>, <code>equals()</code>, <code>concat()</code>, <code>split()</code>, <code>join()</code>.</li>\n<li>Positions are <b>0-based</b>; substring's end index is <b>excluded</b>.</li>\n<li>Compare text with <code>equals()</code>, NEVER with <code>==</code> (that compares references and works only accidentally when both literals share one object).</li></ul>\n"}, "diagram": "jv2_strings", "programs": ["jv2_9", "jv2_10"]}]}, {"title": {"en": "2.8 Wrapper Classes"}, "items": [{"h": {"en": "Wrapper Classes, Autoboxing and Unboxing"}, "body": {"en": "\n<ul><li>Java is object oriented, but primitives are not objects. Every primitive has an <b>object twin - a wrapper class</b>: Byte, Short, Integer, Long, Float, Double, Character, Boolean.</li>\n<li>Why wrap? Collections (Unit 4) store only objects; wrappers also carry helpers: <code>Integer.parseInt()</code>, <code>MAX_VALUE</code>, <code>toBinaryString()</code>.</li>\n<li><b>Autoboxing</b> - automatic primitive -> wrapper: <code>Integer o = 42;</code>. <b>Unboxing</b> - automatic wrapper -> primitive: <code>int m = o;</code>. Before Java 5 this was written by hand with <code>valueOf()</code> / <code>intValue()</code>.</li>\n<li>Wrapper objects can be <code>null</code>, so unboxing a null throws an exception (Unit 4).</li></ul>\n"}, "diagram": "jv2_boxing", "programs": ["jv2_11", "jv2_12"]}]}, {"title": {"en": "2.9 User Input"}, "items": [{"h": {"en": "Scanner Class and Command Line Arguments"}, "body": {"en": "\n<ul><li><b>Scanner</b> (java.util) reads typed input: attach it to <code>System.in</code> once, then use <code>nextLine()</code> for whole lines, <code>next()</code> for one token, <code>nextInt()</code>, <code>nextDouble()</code> for numbers.</li>\n<li><b>The ENTER trap:</b> numeric reads leave the pressed Enter in the queue, so a following <code>nextLine()</code> returns empty. Cure: one extra <code>sc.nextLine()</code> right after the number.</li>\n<li><b>Command line arguments</b> - strings given after the run command (<code>java Main 15 27</code>) arrive in <code>String[] args</code>: no waiting, perfect for fixed settings; convert with <code>Integer.parseInt()</code>.</li></ul>\n"}, "programs": ["jv2_12", "jv2_13", "jv2_14"]}]}, {"title": {"en": "2.10 Garbage Collection"}, "items": [{"h": {"en": "Garbage Collection and the finalize() Method"}, "body": {"en": "\n<ul><li>Java frees memory <b>automatically</b>: the <b>garbage collector</b> removes objects that no reference can reach anymore. There is no free() / delete keyword like in C++.</li>\n<li>An object becomes garbage when its references are gone: <code>it = null;</code>, or the variable goes out of scope.</li>\n<li><code>System.gc()</code> only <b>requests</b> a collection - the JVM decides when and in which order; you can never force it.</li>\n<li><b>finalize()</b> is invoked by the JVM on an object just before destruction - a last chance to release external resources. It is deprecated in modern Java in favour of try-with-resources (Unit 5), but you must know it for the syllabus.</li></ul>\n"}, "diagram": "jv2_gc", "programs": ["jv2_15"]}]}], "programs": [{"id": "jv2_1", "title": {"en": "A Student class: fields, methods, object creation"}, "code": {"en": "// class = blueprint\nclass Student {\n  // fields (member variables)\n  int roll;\n  String name;\n  // method\n  void setData(int r, String n) {\n    roll = r;\n    name = n;\n  }\n  void display() {\n    System.out.println(roll + \" : \" + name);\n  }\n}\n\nclass Main {\n  public static void main(String[] a) {\n    // 1st object\n    Student s1 = new Student();\n    s1.setData(1, \"Asha\");\n    // 2nd object\n    Student s2 = new Student();\n    s2.setData(2, \"Bhavesh\");\n    // each object keeps\n    s1.display();\n    // its own values\n    s2.display();\n  }\n}"}, "out": "$ javac Main.java\n$ java Main\n1 : Asha\n2 : Bhavesh", "expl": {"en": "\n<p><b>Practical 4.</b> A <b>class</b> is a blueprint; an <b>object</b> is a real copy made from it with <code>new</code>.</p>\n<ul><li><b>Fields</b> (roll, name) store data; <b>methods</b> (setData, display) define behaviour.</li>\n<li>Two objects hold independent values: setting s2 does not change s1.</li>\n<li>Methods are called on an object with a dot: <code>s1.display();</code>.</li></ul>\n"}}, {"id": "jv2_2", "title": {"en": "Methods: parameters, return values and calling"}, "code": {"en": "class Main {\n  // method with two parameters, returns int\n  static int add(int x, int y) {\n    // sends result back\n    return x + y;\n  }\n\n  // returns nothing\n  static void greet(String n) {\n    System.out.println(\"Hi \" + n);\n  }\n\n  static double average(int a, int b) {\n    return (a + b) / 2.0;\n  }\n\n  public static void main(String[] args) {\n    // call + store\n    int s = add(7, 5);\n    System.out.println(\"sum = \" + s);\n    greet(\"Sunil\");\n    double av = average(70, 90);\n    System.out.println(\"avg = \" + av);\n  }\n}"}, "out": "$ javac Main.java\n$ java Main\nsum = 12\nHi Sunil\navg = 80.0", "expl": {"en": "\n<ul><li>A <b>method definition</b> has: return type, name, parameter list, body.</li>\n<li><b>Method calling</b> copies values into the parameters; <code>return</code> sends one value back to the caller.</li>\n<li><code>void</code> methods (greet) perform an action but return nothing.</li>\n<li>Methods inside the same class as main() are called plain (<code>add(7, 5)</code>) because both are <code>static</code>.</li></ul>\n"}}, {"id": "jv2_3", "title": {"en": "Default and parameterized constructors with 'this'"}, "code": {"en": "class Book {\n  String title;\n  double price;\n\n  // default constructor\n  Book() {\n    title = \"Java\";\n    price = 0;\n  }\n\n  Book(String title, double price) {\n    // this.field = parameter\n    this.title = title;\n    this.price = price;\n  }\n\n  void show() {\n    String row = title + \" Rs. \" + price;\n    System.out.println(row);\n  }\n}\n\nclass Main {\n  public static void main(String[] a) {\n    // default\n    Book b1 = new Book();\n    // parameterized\n    Book b2 = new Book(\"OOP in Java\", 299);\n    b1.show();\n    b2.show();\n  }\n}"}, "out": "$ javac Main.java\n$ java Main\nJava Rs. 0.0\nOOP in Java Rs. 299.0", "expl": {"en": "\n<p><b>Practical 5(a).</b> A <b>constructor</b> initializes the new object. It has the same name as the class and no return type (not even void).</p>\n<ul><li>The <b>default constructor</b> takes no arguments; the <b>parameterized constructor</b> receives values.</li>\n<li><b>this</b> distinguishes the field (<code>this.title</code>) from the parameter (<code>title</code>) when both have the same name.</li>\n<li>Which constructor runs is decided by the argument list of <code>new</code>.</li></ul>\n"}}, {"id": "jv2_4", "title": {"en": "Constructor overloading"}, "code": {"en": "class Account {\n  String name;\n  double bal;\n\n  // 1: no args\n  Account() {\n    name = \"Guest\";\n    bal = 0;\n  }\n  // 2: one arg\n  Account(String name) {\n    this.name = name;\n    bal = 500;\n  }\n  // 3: two args\n  Account(String name, double bal) {\n    this.name = name;\n    this.bal = bal;\n  }\n  void show() {\n    System.out.println(name + \" -> \" + bal);\n  }\n}\n\nclass Main {\n  public static void main(String[] a) {\n    Account a1 = new Account();\n    Account a2 = new Account(\"Riya\");\n    Account a3 = new Account(\"Amit\", 5000);\n    a1.show();\n    a2.show();\n    a3.show();\n  }\n}"}, "out": "$ javac Main.java\n$ java Main\nGuest -> 0.0\nRiya -> 500.0\nAmit -> 5000.0", "expl": {"en": "\n<ul><li><b>Constructor overloading</b> = several constructors with different parameter lists in one class.</li>\n<li>The compiler picks the one whose signature matches the <code>new</code> call.</li>\n<li>Gives users flexible ways to create objects with more or less initial data.</li></ul>\n"}}, {"id": "jv2_5", "title": {"en": "The 'this' keyword: shadowing and constructor chaining"}, "code": {"en": "class Mobile {\n  String model;\n  double price;\n\n  Mobile(String model) {\n    // field = parameter\n    this.model = model;\n    this.price = 9999;\n  }\n  // this() calls another constructor first\n  Mobile(String model, double price) {\n    // constructor chaining\n    this(model);\n    this.price = price;\n  }\n  void update(double price) {\n    // field = parameter\n    this.price = price;\n  }\n  Mobile bigger(Mobile o) {\n    // return the costlier mobile\n    return this.price > o.price ? this : o;\n  }\n  void show() {\n    String row = model + \" Rs. \" + price;\n    System.out.println(row);\n  }\n}\n\nclass Main {\n  public static void main(String[] a) {\n    Mobile m1 = new Mobile(\"Note 12\");\n    Mobile m2 = new Mobile(\"Galaxy\", 21249);\n    m1.update(14999);\n    m1.show();\n    m2.show();\n    m1.bigger(m2).show();\n  }\n}"}, "out": "$ javac Main.java\n$ java Main\nNote 12 Rs. 14999.0\nGalaxy Rs. 21249.0\nGalaxy Rs. 21249.0", "expl": {"en": "\n<ul><li><b>this.field</b> solves <b>shadowing</b>: parameter names normally hide the fields.</li>\n<li><b>this(args)</b> calls another constructor of the same class - chaining avoids duplicate code (must be the first statement).</li>\n<li><b>this as a value</b> refers to the current object: <code>m1.bigger(m2)</code> returns this (m1) or o (m2), and show() runs on the result.</li></ul>\n"}}, {"id": "jv2_6", "title": {"en": "The 'static' keyword: variable, method and block"}, "code": {"en": "class Counter {\n  // ONE copy for all objects\n  static int total = 0;\n  // one copy per object\n  int id;\n\n  // static block:\n  static {\n    // runs first\n    System.out.println(\"class loading...\");\n  }\n\n  Counter() {\n    // count every object\n    total++;\n    id = total;\n  }\n\n  // static method:\n  static void report() {\n    // no object\n    System.out.println(\"total = \" + total);\n  }\n}\n\nclass Main {\n  public static void main(String[] a) {\n    new Counter();\n    new Counter();\n    Counter c = new Counter();\n    System.out.println(\"c.id = \" + c.id);\n    // called via class name\n    Counter.report();\n    System.out.println(Counter.total);\n  }\n}"}, "out": "$ javac Main.java\n$ java Main\nclass loading...\nc.id = 3\ntotal = 3\n3", "expl": {"en": "\n<p><b>Practical 5(b).</b></p>\n<ul><li>A <b>static variable</b> belongs to the class, not to objects: all objects share one <code>total</code>, while each has its own <code>id</code>.</li>\n<li>A <b>static block</b> runs once when the class is loaded - before main() starts.</li>\n<li>A <b>static method</b> can be called with the class name (<code>Counter.report()</code>) and can touch only static members directly.</li>\n<li>Static classes (nested) group related helper classes - seen again in Unit 5.</li></ul>\n"}}, {"id": "jv2_7", "title": {"en": "Access modifiers with getters and setters"}, "code": {"en": "class BankAcc {\n  // hidden from outside\n  private double bal;\n  // default: same package\n  String owner;\n  public String bank = \"SBI\";\n\n  public void deposit(double amt) {\n    if (amt > 0)\n      // insiders may change it\n      bal = bal + amt;\n  }\n  // controlled reading\n  public double getBal() {\n    return bal;\n  }\n}\n\nclass Main {\n  public static void main(String[] a) {\n    BankAcc ac = new BankAcc();\n    ac.owner = \"Sunil\";\n    ac.deposit(1200);\n    // rejected by the check\n    ac.deposit(-500);\n    // ac.bal = 99999;\n    // ^ compile error: bal is private\n    String ow = ac.owner;\n    double bl = ac.getBal();\n    System.out.println(\"owner = \" + ow);\n    System.out.println(\"bank = \" + ac.bank);\n    System.out.println(\"balance = \" + bl);\n  }\n}"}, "out": "$ javac Main.java\n$ java Main\nowner = Sunil\nbank = SBI\nbalance = 1200.0", "expl": {"en": "\n<ul><li><b>private</b> - only inside the same class; <b>default</b> (no keyword) - anywhere in the same package; <b>protected</b> - package + subclasses (Unit 3); <b>public</b> - everywhere.</li>\n<li>Hiding <code>bal</code> and giving public <b>getters/setters</b> is <b>encapsulation</b>: the check <code>if (amt > 0)</code> prevents nonsense changes.</li>\n<li>Try uncommenting <code>ac.bal = 99999;</code> - the compiler itself stops you.</li></ul>\n"}}, {"id": "jv2_8", "title": {"en": "Method overloading"}, "code": {"en": "class Calc {\n  // same name, different parameter lists\n  int add(int a, int b) {\n    return a + b;\n  }\n  int add(int a, int b, int c) {\n    return a + b + c;\n  }\n  double add(double a, double b) {\n    return a + b;\n  }\n}\n\nclass Main {\n  public static void main(String[] x) {\n    Calc c = new Calc();\n    System.out.println(c.add(2, 3));\n    System.out.println(c.add(2, 3, 4));\n    System.out.println(c.add(2.5, 3.5));\n  }\n}"}, "out": "$ javac Main.java\n$ java Main\n5\n9\n6.0", "expl": {"en": "\n<p><b>Practical 6.</b></p>\n<ul><li><b>Method overloading</b>: several methods share one name but differ in the <b>number or type of parameters</b> - the compiler chooses by matching the call.</li>\n<li>Changing only the return type is NOT enough; the parameter list must differ.</li>\n<li>This is <b>compile-time (static) polymorphism</b> - the decision is made at compile time.</li></ul>\n"}}, {"id": "jv2_9", "title": {"en": "Common String methods"}, "code": {"en": "class Main {\n  public static void main(String[] a) {\n    String s = \"GTU Diploma\";\n\n    // 11\n    System.out.println(s.length());\n    // 'D'\n    System.out.println(s.charAt(4));\n    // Diploma\n    System.out.println(s.substring(4));\n    // GTU\n    System.out.println(s.substring(0, 3));\n    System.out.println(s.toUpperCase());\n    System.out.println(s.toLowerCase());\n\n    // 4\n    System.out.println(s.indexOf(\"Dip\"));\n    // true\n    System.out.println(s.contains(\"oma\"));\n    System.out.println(s.startsWith(\"GT\"));\n    // hi\n    System.out.println(\"  hi  \".trim());\n    System.out.println(s.concat(\" 2026\"));\n    System.out.println(s.replace('D','d'));\n\n    String t = \"GTU Diploma\";\n    // true\n    System.out.println(s.equals(t));\n    // ?\n    System.out.println(s == t);\n  }\n}"}, "out": "$ javac Main.java\n$ java Main\n11\nD\nDiploma\nGTU\nGTU DIPLOMA\ngtu diploma\n4\ntrue\ntrue\nhi\nGTU Diploma 2026\nGTU diploma\ntrue\ntrue", "expl": {"en": "\n<p><b>Practical 7.</b> String is immutable: every method returns a NEW string, <code>s</code> itself never changes.</p>\n<ul><li><code>substring(4)</code> = from index 4 to the end; <code>substring(0,3)</code> = 0,1,2 (end excluded).</li>\n<li><code>indexOf</code> gives the first position, or -1 if absent.</li>\n<li><code>equals()</code> compares text; <code>==</code> compares references - two strings with the same text may or may not share memory (here both literals do - see output).</li></ul>\n"}}, {"id": "jv2_10", "title": {"en": "String joining, splitting and an array of strings"}, "code": {"en": "class Main {\n  public static void main(String[] a) {\n    String line = \"red,green,blue\";\n    String[] parts = line.split(\",\");\n    for (int i = 0; i < parts.length; i++) {\n      String p = parts[i];\n      System.out.println(i + \" : \" + p);\n    }\n\n    String j = String.join(\" - \", parts);\n    System.out.println(j);\n\n    // char array <-> string\n    char[] ch = \"JAVA\".toCharArray();\n    for (char c : ch)\n      System.out.print(c + \" \");\n    System.out.println();\n    String back = new String(ch);\n    System.out.println(back);\n  }\n}"}, "out": "$ javac Main.java\n$ java Main\n0 : red\n1 : green\n2 : blue\nred - green - blue\nJ A V A \nJAVA", "expl": {"en": "\n<ul><li><code>split(\",\")</code> breaks a string around the separator and returns a <b>String[]</b> array.</li>\n<li><code>String.join(\" - \", parts)</code> glues array pieces with a separator.</li>\n<li><code>toCharArray()</code> gives the characters as a char[]; <code>new String(ch)</code> builds a string back.</li>\n<li>These three appear constantly in data-entry and CSV-style programs.</li></ul>\n"}}, {"id": "jv2_11", "title": {"en": "Wrapper classes: Integer, Double, parsing"}, "code": {"en": "class Main {\n  public static void main(String[] a) {\n    // each primitive type has a wrapper\n    Integer iObj = Integer.valueOf(42);\n    Double dObj = Double.valueOf(7.5);\n    Character cObj = Character.valueOf('A');\n    Boolean bObj = Boolean.valueOf(true);\n\n    System.out.println(iObj);\n    String line = dObj + \" \" + cObj;\n    System.out.println(line + \" \" + bObj);\n\n    // string -> number with parse methods\n    int n = Integer.parseInt(\"153\");\n    double d = Double.parseDouble(\"4.5\");\n    // 154, real math\n    System.out.println(n + 1);\n    System.out.println(d * 2);\n\n    // useful constants and helpers\n    System.out.println(Integer.MAX_VALUE);\n    System.out.println(Integer.MIN_VALUE);\n    String bin = Integer.toBinaryString(10);\n    System.out.println(bin);\n  }\n}"}, "out": "$ javac Main.java\n$ java Main\n42\n7.5 A true\n154\n9.0\n2147483647\n-2147483648\n1010", "expl": {"en": "\n<ul><li><b>Wrapper classes</b> box each primitive into an object: Byte, Short, Integer, Long, Float, Double, Character, Boolean.</li>\n<li>Objects are needed because collections (Unit 4) store only objects, and wrapper classes carry helpers like <code>parseInt</code> and <code>MAX_VALUE</code>.</li>\n<li><code>Integer.parseInt(\"153\")</code> converts text entered by a user into a real number - without it \"153\" + 1 would be \"1531\".</li></ul>\n"}}, {"id": "jv2_12", "title": {"en": "Scanner input + autoboxing and unboxing"}, "code": {"en": "import java.util.Scanner;\n\nclass Main {\n  public static void main(String[] arg) {\n    Scanner sc = new Scanner(System.in);\n    System.out.print(\"Enter name: \");\n    String name = sc.nextLine();\n    System.out.print(\"Enter marks (int): \");\n    int marks = sc.nextInt();\n    System.out.print(\"Enter CGPA: \");\n    double cg = sc.nextDouble();\n\n    // autoboxing: primitive -> wrapper\n    Integer mObj = marks;\n    Double cgObj = cg;\n\n    // unboxing: wrapper -> primitive (auto)\n    int m2 = mObj;\n    double d2 = cgObj;\n\n    System.out.println(\"name: \" + name);\n    int m3 = m2 + 1;\n    System.out.println(\"box marks=\" + mObj);\n    System.out.println(\"marks int = \" + m3);\n    System.out.println(\"box CGPA=\" + cgObj);\n    System.out.println(\"CGPA unbox=\" + d2);\n  }\n}"}, "out": "$ javac Main.java\n$ java Main\nEnter name: Enter marks (int): Enter CGPA: name: Sunil Patel\nbox marks=452\nmarks int = 453\nbox CGPA=8.25\nCGPA unbox=8.25", "expl": {"en": "\n<p><b>Practical 8.</b></p>\n<ul><li><b>Scanner</b> (java.util) reads user input: <code>nextLine()</code> text, <code>nextInt()</code> whole numbers, <code>nextDouble()</code> decimals - the program waits for you to type.</li>\n<li><b>Autoboxing</b>: Java automatically wraps a primitive into its wrapper object (<code>Integer mObj = marks;</code>).</li>\n<li><b>Unboxing</b>: the opposite (<code>int m2 = mObj;</code>), done automatically too. Before Java 5 you had to write <code>Integer.valueOf()</code> / <code>intValue()</code> by hand.</li></ul>\n<p>Try it live: the output shows what the program printed after reading name = Sunil Patel, marks = 452, CGPA = 8.25.</p>\n"}}, {"id": "jv2_13", "title": {"en": "Scanner: mixed input and nextLine pitfalls"}, "code": {"en": "import java.util.Scanner;\n\nclass Main {\n  public static void main(String[] ar) {\n    Scanner sc = new Scanner(System.in);\n    System.out.print(\"Age: \");\n    int age = sc.nextInt();\n    // eat the leftover new line\n    sc.nextLine();\n    System.out.print(\"Full name: \");\n    String nm = sc.nextLine();\n    System.out.print(\"Single token: \");\n    String tk = sc.next();\n    System.out.println(\"age = \" + age);\n    System.out.println(\"name = \" + nm);\n    System.out.println(\"token = \" + tk);\n  }\n}"}, "out": "$ javac Main.java\n$ java Main\nAge: Full name: Single token: age = 19\nname = Priya Sharma\ntoken = hello", "expl": {"en": "\n<ul><li><code>nextInt()</code> reads only the number; the ENTER you pressed stays in the queue.</li>\n<li>The extra <code>sc.nextLine()</code> consumes that leftover ENTER - without it, the following <code>nextLine()</code> would read an empty line and the program would seem to \"skip\" the name input.</li>\n<li><code>next()</code> reads one token (stops at space): \"hello extra\" gives back only \"hello\".</li></ul>\n"}}, {"id": "jv2_14", "title": {"en": "Command line arguments (String[] args)"}, "code": {"en": "class Main {\n  public static void main(String[] args) {\n    int n = args.length;\n    System.out.println(\"count = \" + n);\n    for (int i = 0; i < args.length; i++) {\n      String ar = args[i];\n      System.out.println(i + \" : \" + ar);\n    }\n\n    if (args.length >= 2) {\n      int x = Integer.parseInt(args[0]);\n      int y = Integer.parseInt(args[1]);\n      int sm = x + y;\n      System.out.println(\"sum = \" + sm);\n    }\n  }\n}"}, "out": "$ javac Main.java\n$ java Main 15 27\ncount = 2\n0 : 15\n1 : 27\nsum = 42", "expl": {"en": "\n<ul><li>Everything typed after <code>java Main ...</code> lands inside <code>args</code> as <b>strings</b>.</li>\n<li>This run used <code>java Main 15 27</code> - see both values and their sum in the output window.</li>\n<li>Arguments reach the program without any <code>Scanner</code>; parse with <code>Integer.parseInt</code> for numbers.</li>\n<li>Great for small tools where input stays fixed per run.</li></ul>\n"}}, {"id": "jv2_15", "title": {"en": "Garbage collection and the finalize() method"}, "code": {"en": "class Main {\n  static void drop(String n) {\n    Item it = new Item(n);\n    it = null;\n    // ask the collector\n    System.gc();\n    System.runFinalization();\n    try {\n      Thread.sleep(300);\n    } catch (Exception e) { }\n  }\n  public static void main(String[] a) {\n    drop(\"pen\");\n    drop(\"book\");\n    drop(\"bag\");\n    System.out.println(\"main ends\");\n  }\n}\nclass Item {\n  String n;\n  Item(String n) { this.n = n; }\n  // finalize() runs before the\n  // object is destroyed\n  protected void finalize() {\n    System.out.println(\"collecting \" + n);\n  }\n}"}, "out": "$ javac Main.java\n$ java Main\ncollecting pen\ncollecting book\ncollecting bag\nmain ends", "expl": {"en": "\n<ul><li>Java's <b>garbage collector (GC)</b> frees memory of objects that have no reference left - exactly like <code>it</code> after <code>it = null;</code>.</li>\n<li><b>finalize()</b> is called by the JVM on an object <b>just before</b> it is destroyed - a last chance to clean up (e.g. close a file). Note it is deprecated in modern Java; modern code uses try-with-resources instead (Unit 5).</li>\n<li><code>System.gc()</code> only <b>requests</b> collection; the order and timing belong to the JVM, never to you.</li>\n<li>The output shows each item being collected right after it becomes unreachable.</li></ul>\n"}}], "diagrams": [{"id": "jv2_pillars", "title": {"en": "Four Principles of OOP"}, "file": "diagrams/jv2_pillars.svg"}, {"id": "jv2_class_object", "title": {"en": "Class and Objects"}, "file": "diagrams/jv2_class_object.svg"}, {"id": "jv2_ctor", "title": {"en": "Constructors"}, "file": "diagrams/jv2_ctor.svg"}, {"id": "jv2_this_static", "title": {"en": "this and static"}, "file": "diagrams/jv2_this_static.svg"}, {"id": "jv2_access", "title": {"en": "Access Modifiers"}, "file": "diagrams/jv2_access.svg"}, {"id": "jv2_strings", "title": {"en": "Common String Methods"}, "file": "diagrams/jv2_strings.svg"}, {"id": "jv2_boxing", "title": {"en": "Wrapper Classes, Autoboxing and Unboxing"}, "file": "diagrams/jv2_boxing.svg"}, {"id": "jv2_gc", "title": {"en": "Garbage Collection and finalize()"}, "file": "diagrams/jv2_gc.svg"}], "syntax": [{"title": {"en": "Class, Object, Constructors"}, "items": [{"name": {"en": "Class and object"}, "f": "class Student {\n  int roll;\n  String name;\n  void display() { }\n}\nStudent s = new Student();   // object\ns.roll = 1;                  // dot access\ns.display();                 // method call", "terms": {"en": "class = blueprint; new = creates object"}}, {"name": {"en": "Constructors"}, "f": "Book() { }                  // default\nBook(String t) {         // parameterized\n  this.title = t;        // this = field\n}\nBook(String t, double p) {\n  this(t);               // chaining (first line)\n  this.price = p;\n}", "terms": {"en": "same name as class; no return type"}}, {"name": {"en": "Method form"}, "f": "static int add(int x, int y) {\n  return x + y;\n}\nint s = add(7, 5);       // call", "terms": {"en": "returnType name(params); void = nothing back"}}]}, {"title": {"en": "static, Access, Overloading"}, "items": [{"name": {"en": "static members"}, "f": "static int total = 0;      // one copy\nstatic { }                 // runs at class load\nstatic void report() { }   // no this inside\nCounter.report();          // call by class name", "terms": {"en": "belongs to class; static touches static only"}}, {"name": {"en": "Access modifiers"}, "f": "class X {\n  public String a;      // everywhere\n  protected String b;   // package + subclasses\n  String c;             // default: package\n  private double d;     // this class only\n}", "terms": {"en": "public > protected > default > private"}}, {"name": {"en": "Overloading"}, "f": "int add(int a, int b) { }\nint add(int a, int b, int c) { }\ndouble add(double a, double b) { }\n\nnew Account();          // constructor\nnew Account(\"Riya\");    // overloading too\nnew Account(\"Amit\", 5000);", "terms": {"en": "same name, different parameter list"}}]}, {"title": {"en": "Strings and Wrappers"}, "items": [{"name": {"en": "String methods"}, "f": "s.length()       s.charAt(4)\ns.substring(4)     s.substring(0,3)\ns.toUpperCase()    s.toLowerCase()\ns.indexOf(\"Dip\")   s.contains(\"oma\")\ns.trim()           s.replace('D','d')\ns.equals(t)        s.split(\",\")\nString.join(\"-\", arr)", "terms": {"en": "immutable; new string returned; 0-based"}}, {"name": {"en": "Wrappers and boxing"}, "f": "Integer o = 42;          // autoboxing\nint m = o;               // unboxing\nint n = Integer.parseInt(\"153\");\nInteger.MAX_VALUE", "terms": {"en": "wrapper = object twin of a primitive"}}]}, {"title": {"en": "Input and Garbage Collection"}, "items": [{"name": {"en": "Scanner input"}, "f": "import java.util.Scanner;\nScanner sc = new Scanner(System.in);\nString n = sc.nextLine();   // whole line\nint m = sc.nextInt();       // number\nsc.nextLine();              // eat leftover Enter", "terms": {"en": "after a number read, eat the Enter"}}, {"name": {"en": "Command line args + GC"}, "f": "public static void main(String[] args)\n// java Main 15 27\nargs.length; args[0]; args[1];\n\nit = null;                  // object free\nSystem.gc();                // request GC\nprotected void finalize() { }", "terms": {"en": "args are strings; finalize runs before destroy"}}]}], "viva": [{"title": {"en": "OOP Principles, Class, Object"}, "items": [{"q": {"en": "What is OOP?"}, "a": {"en": "A way of organising programs around objects that hold data (fields) and behaviour (methods), instead of procedures."}}, {"q": {"en": "Name the four principles of OOP."}, "a": {"en": "Abstraction, encapsulation, inheritance and polymorphism."}}, {"q": {"en": "What is abstraction? Give an example."}, "a": {"en": "Showing only the necessary features and hiding the details - an ATM user sees buttons, not the dispensing machinery. Done via abstract classes and interfaces."}}, {"q": {"en": "What is encapsulation? Give an example."}, "a": {"en": "Binding data and its guarding methods inside one class, with private fields - like a capsule protecting medicine; BankAcc keeps bal private and checks deposit()."}}, {"q": {"en": "What is inheritance?"}, "a": {"en": "Creating a new class by reusing an existing class with keyword extends, so common code is written once."}}, {"q": {"en": "What is polymorphism?"}, "a": {"en": "\"Many forms\": the same name doing different work, e.g. overloaded add() methods; runtime version comes via overriding (Unit 3)."}}, {"q": {"en": "What is a class? What is an object?"}, "a": {"en": "A class is a blueprint (a type) describing fields and methods; an object is a real instance of it living in heap memory, created with new."}}, {"q": {"en": "Difference between fields and local variables?"}, "a": {"en": "Fields belong to an object and live as long as it; local variables exist only inside their method or block."}}, {"q": {"en": "How do you access members of an object?"}, "a": {"en": "With the dot operator: s1.roll and s1.display()."}}]}, {"title": {"en": "Constructors, this, static"}, "items": [{"q": {"en": "What is a constructor?"}, "a": {"en": "A special member that runs automatically at new to initialize the object; it has the class name and no return type."}}, {"q": {"en": "What is a default constructor?"}, "a": {"en": "A constructor with no parameters; if a class has none, Java adds an empty one silently."}}, {"q": {"en": "What is a parameterized constructor?"}, "a": {"en": "A constructor that receives values, e.g. new Book(\"Java\", 299) initializes title and price in one step."}}, {"q": {"en": "What is constructor overloading?"}, "a": {"en": "Several constructors with different parameter lists in one class; the compiler matches the new call."}}, {"q": {"en": "Can a constructor have a return type or be called on an object?"}, "a": {"en": "No - a return type (even void) would turn it into an ordinary method, and obj.Book() is illegal."}}, {"q": {"en": "Differentiate constructor and method."}, "a": {"en": "Class name vs any name; no return type vs mandatory one; runs at new vs when called; not inherited vs inheritable."}}, {"q": {"en": "What is this keyword?"}, "a": {"en": "A reference to the current object - used to separate fields from same-named parameters, to chain constructors with this(), and to return the current object."}}, {"q": {"en": "Where must this() be written?"}, "a": {"en": "As the very first statement of a constructor."}}, {"q": {"en": "What is static variable?"}, "a": {"en": "A class-level variable with a single copy shared by all objects, loaded once when the class loads."}}, {"q": {"en": "What is static method?"}, "a": {"en": "A method callable with the class name; it has no this and can directly use only static members."}}, {"q": {"en": "Why is main() static?"}, "a": {"en": "The JVM must start the program without creating any object first."}}, {"q": {"en": "What is a static block and when does it run?"}, "a": {"en": "A block that runs once when the class is loaded, before main()."}}, {"q": {"en": "List the four access modifiers in restrictiveness order."}, "a": {"en": "private < default < protected < public (private most restricted)."}}]}, {"title": {"en": "Access Modifiers and Methods"}, "items": [{"q": {"en": "Difference between default and protected?"}, "a": {"en": "default is visible inside the same package only; protected also in subclasses outside the package."}}, {"q": {"en": "Why keep fields private?"}, "a": {"en": "So outside code cannot put illegal values: changes pass through checked public methods (encapsulation)."}}, {"q": {"en": "What are getters and setters?"}, "a": {"en": "Public methods that read (getBal) or update (deposit) private fields under control of the class."}}, {"q": {"en": "What is method overloading?"}, "a": {"en": "Same method name with different parameter lists in one class; decided at compile time (compile-time polymorphism)."}}, {"q": {"en": "Is changing only the return type valid overloading?"}, "a": {"en": "No - the parameter list must differ; the return type alone cannot overload."}}]}, {"title": {"en": "Strings and Wrappers"}, "items": [{"q": {"en": "What is a String in Java?"}, "a": {"en": "A class; its objects hold immutable character text built from literals like \"GTU\"."}}, {"q": {"en": "What does string immutability mean?"}, "a": {"en": "Methods never change the original string - they create and return a new one."}}, {"q": {"en": "Give any four String methods with purpose."}, "a": {"en": "length() size, charAt(i) ith char, substring() part of the text, indexOf() first position."}}, {"q": {"en": "s == t vs s.equals(t)?"}, "a": {"en": "== compares references (same object?); equals() compares the actual text - always use equals for strings."}}, {"q": {"en": "What does s.substring(0, 3) return for \"GTU\"?"}, "a": {"en": "GTU - characters 0, 1 and 2; the end index is excluded."}}, {"q": {"en": "What do split() and join() do?"}, "a": {"en": "split(\",\") breaks a string into a String[] around the separator; String.join(\"-\", arr) glues the pieces back."}}, {"q": {"en": "What is a wrapper class? Name all eight."}, "a": {"en": "The object twin of a primitive: Byte, Short, Integer, Long, Float, Double, Character, Boolean."}}, {"q": {"en": "What are autoboxing and unboxing?"}, "a": {"en": "Automatic conversions since Java 5: primitive -> wrapper (Integer o = 42) and wrapper -> primitive (int m = o)."}}, {"q": {"en": "Why are wrapper classes needed?"}, "a": {"en": "Collections store objects only, and wrappers supply parsing helpers like Integer.parseInt()."}}, {"q": {"en": "What happens on unboxing a null?"}, "a": {"en": "A NullPointerException is thrown - wrapper objects may be null unlike primitives."}}]}, {"title": {"en": "Input and Garbage Collection"}, "items": [{"q": {"en": "How do you read a whole line and an integer with Scanner?"}, "a": {"en": "new Scanner(System.in); nextLine() reads a line, nextInt() reads an int."}}, {"q": {"en": "What is the nextLine() pitfall after nextInt()?"}, "a": {"en": "nextInt() leaves the pressed Enter; the next nextLine() reads it as an empty line. Use one extra nextLine() to consume it."}}, {"q": {"en": "What is next() vs nextLine()?"}, "a": {"en": "next() reads one space-separated token; nextLine() reads the whole line."}}, {"q": {"en": "What are command line arguments?"}, "a": {"en": "Strings written after the run command: java Main 15 27 -> args = {\"15\",\"27\"}; converted with parseInt."}}, {"q": {"en": "What is garbage collection?"}, "a": {"en": "The automatic freeing of heap memory holding objects that no reference can reach; there is no delete keyword."}}, {"q": {"en": "What does System.gc() guarantee?"}, "a": {"en": "Nothing - it only requests collection; the JVM decides the time and order."}}, {"q": {"en": "What is finalize()?"}, "a": {"en": "A method the JVM calls on an object just before destroying it (last clean-up); deprecated now - try-with-resources is preferred."}}, {"q": {"en": "Why is memory management in Java called automatic?"}, "a": {"en": "Because objects are created with new and destroyed by the garbage collector - the programmer never frees memory by hand."}}, {"q": {"en": "Combine: how do encapsulation, getter/setter and private relate in BankAcc?"}, "a": {"en": "bal is private (hidden), deposit() checks amt > 0 (controlled change), getBal() is the only way to read it - that is encapsulation in practice."}}]}], "exam_questions": [{"q": {"en": "Explain the four principles of OOP with real-world examples."}, "marks": 6}, {"q": {"en": "Define class and object. Explain with a Student class program. (Practical 4)"}, "marks": 4}, {"q": {"en": "What is a constructor? Explain its types with examples."}, "marks": 4}, {"q": {"en": "Differentiate constructor and method."}, "marks": 3}, {"q": {"en": "Explain constructor overloading with a program. (Practical 5 part)"}, "marks": 4}, {"q": {"en": "Explain the this keyword: shadowing and constructor chaining. (Practical 5a)"}, "marks": 4}, {"q": {"en": "Explain the static keyword: static variable, method and block. (Practical 5b)"}, "marks": 4}, {"q": {"en": "Explain the four access modifiers of Java."}, "marks": 4}, {"q": {"en": "Explain encapsulation using a bank account with getters and setters."}, "marks": 4}, {"q": {"en": "What is method overloading? Write a program for it. (Practical 6)"}, "marks": 4}, {"q": {"en": "Explain any five String methods with examples. (Practical 7)"}, "marks": 4}, {"q": {"en": "Why should strings be compared with equals() and not ==?"}, "marks": 3}, {"q": {"en": "Explain wrapper classes, autoboxing and unboxing with examples."}, "marks": 4}, {"q": {"en": "Explain Scanner class input with a program. (Practical 8)"}, "marks": 4}, {"q": {"en": "Explain command line arguments with an example."}, "marks": 3}, {"q": {"en": "Explain garbage collection and the finalize() method."}, "marks": 4}]};
const SVG = {"jv2_pillars": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 398\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"398\" fill=\"#ffffff\"/><text x=\"180\" y=\"23.1\" font-size=\"14.5\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">Four Principles of OOP</text><rect x=\"10\" y=\"130\" width=\"160\" height=\"84\" rx=\"8\" fill=\"#E3F0FC\" stroke=\"#1565C0\" stroke-width=\"1.4\"/><text x=\"90\" y=\"153.7\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#1565C0\" font-weight=\"bold\">Abstraction</text><text x=\"90\" y=\"169.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">shows only what is</text><text x=\"90\" y=\"182.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">needed, hides the</text><text x=\"90\" y=\"195.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">working inside</text><rect x=\"190\" y=\"130\" width=\"160\" height=\"84\" rx=\"8\" fill=\"#E3F5E6\" stroke=\"#2E7D32\" stroke-width=\"1.4\"/><text x=\"270\" y=\"153.7\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#2E7D32\" font-weight=\"bold\">Encapsulation</text><text x=\"270\" y=\"169.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">data + methods in</text><text x=\"270\" y=\"182.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">one safe box (private</text><text x=\"270\" y=\"195.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">fields)</text><rect x=\"10\" y=\"230\" width=\"160\" height=\"84\" rx=\"8\" fill=\"#FFF1DE\" stroke=\"#E07B00\" stroke-width=\"1.4\"/><text x=\"90\" y=\"253.7\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#E07B00\" font-weight=\"bold\">Inheritance</text><text x=\"90\" y=\"269.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">a class reuses its</text><text x=\"90\" y=\"282.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">parent class</text><text x=\"90\" y=\"295.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">(extends)</text><rect x=\"190\" y=\"230\" width=\"160\" height=\"84\" rx=\"8\" fill=\"#F1E8FC\" stroke=\"#7B2CD9\" stroke-width=\"1.4\"/><text x=\"270\" y=\"253.7\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">Polymorphism</text><text x=\"270\" y=\"269.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">same name, many</text><text x=\"270\" y=\"282.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">behaviours</text><text x=\"270\" y=\"295.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">(overloading)</text><rect x=\"12\" y=\"348\" width=\"336\" height=\"55\" rx=\"7\" fill=\"#E3F0FC\" stroke=\"#1565C0\" stroke-width=\"1.1\"/><text x=\"20\" y=\"366.2\" font-size=\"9.2\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">ATM screen = abstraction; capsule = encapsulation;</text><text x=\"20\" y=\"381.2\" font-size=\"9.2\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">child + parent classes = inheritance;</text><text x=\"20\" y=\"396.2\" font-size=\"9.2\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">area() of many shapes = polymorphism.</text></svg>", "jv2_class_object": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 328\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"328\" fill=\"#ffffff\"/><text x=\"180\" y=\"23.1\" font-size=\"14.5\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">Class and Objects</text><rect x=\"30\" y=\"48\" width=\"120\" height=\"200\" rx=\"8\" fill=\"#E3F0FC\" stroke=\"#1565C0\" stroke-width=\"1.4\"/><text x=\"90\" y=\"69.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1565C0\" font-weight=\"bold\">class Student</text><path d=\"M40 76
