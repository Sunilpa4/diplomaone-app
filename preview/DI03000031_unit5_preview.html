n/\n\nUPDATE emp SET sal = sal + 100\nWHERE deptno = 20;\n\nUPDATE emp SET sal = sal + 100\nWHERE deptno = 40;"}, "out": "Trigger created.\n\nTrigger created.\n\nRow trigger: AMIT\nRow trigger: NEHA\nRow trigger: KIRAN\nStatement trigger fired\n\n3 rows updated.\n\nStatement trigger fired\n\n0 rows updated.", "expl": {"en": "\n<ul><li><b>trg_row</b> has FOR EACH ROW, so it fires <b>once for every row</b> changed (3 rows in department 20). It can use :OLD and :NEW.</li>\n<li><b>trg_stmt</b> has no FOR EACH ROW, so it fires <b>once per statement</b>, after all rows are changed.</li>\n<li>The second UPDATE changes 0 rows: the row trigger does not fire, but the statement trigger still fires once.</li>\n<li>Order for one statement: BEFORE statement → (BEFORE row → change → AFTER row) for each row → AFTER statement.</li></ul>\n"}}, {"id": "q5_31", "title": {"en": "BEFORE DELETE / UPDATE OF trigger: block invalid changes"}, "code": {"en": "SET SERVEROUTPUT ON\nCREATE OR REPLACE TRIGGER trg_no_del\nBEFORE DELETE ON emp\nFOR EACH ROW\nWHEN (OLD.job = 'PRESIDENT')\nBEGIN\n  RAISE_APPLICATION_ERROR(-20005,\n    'President cannot be deleted');\nEND;\n/\n\nCREATE OR REPLACE TRIGGER trg_sal_cut\nBEFORE UPDATE OF sal ON emp\nFOR EACH ROW\nBEGIN\n  IF :NEW.sal < :OLD.sal THEN\n    RAISE_APPLICATION_ERROR(-20006,\n      'Salary of ' || :OLD.ename\n      || ' cannot be reduced');\n  END IF;\nEND;\n/\n\nDELETE FROM emp WHERE empno = 101;\nDELETE FROM emp WHERE empno = 110;\nUPDATE emp SET sal = sal - 1000\nWHERE empno = 104;\nUPDATE emp SET job = 'SR ANALYST'\nWHERE empno = 104;"}, "out": "Trigger created.\n\nTrigger created.\n\nERROR at line 1:\nORA-20005: President cannot be deleted\nORA-06512: at \"SCOTT.TRG_NO_DEL\", line 2\nORA-04088: error during execution of trigger 'SCOTT.TRG_NO_DEL'\n\n1 row deleted.\n\nERROR at line 1:\nORA-20006: Salary of NEHA cannot be reduced\nORA-06512: at \"SCOTT.TRG_SAL_CUT\", line 3\nORA-04088: error during execution of trigger 'SCOTT.TRG_SAL_CUT'\n\n1 row updated.", "expl": {"en": "\n<ul><li>The <b>WHEN</b> clause adds a condition: trg_no_del fires only for the president's row. In WHEN, NEW and OLD are written <b>without the colon</b>.</li>\n<li>Deleting employee 110 is allowed, but deleting 101 (PRESIDENT) is rejected.</li>\n<li><b>UPDATE OF sal</b> makes trg_sal_cut fire only when the SAL column is updated. A salary cut is rejected, but changing JOB does not fire the trigger.</li>\n<li>Triggers like these enforce business rules that cannot be written as constraints.</li></ul>\n"}}, {"id": "q5_32", "title": {"en": "Managing triggers: USER_TRIGGERS, DISABLE, ENABLE, DROP"}, "code": {"en": "SET SERVEROUTPUT ON\nCREATE OR REPLACE TRIGGER trg_dept_loc\nBEFORE INSERT OR UPDATE ON dept\nFOR EACH ROW\nBEGIN\n  :NEW.loc := UPPER(:NEW.loc);\nEND;\n/\n\nSELECT trigger_name, trigger_type,\n       triggering_event, status\nFROM user_triggers;\n\nALTER TRIGGER trg_dept_loc DISABLE;\nINSERT INTO dept\nVALUES (50, 'HR', 'Bharuch');\n\nALTER TRIGGER trg_dept_loc ENABLE;\nINSERT INTO dept\nVALUES (60, 'IT', 'Navsari');\n\nSELECT * FROM dept\nWHERE deptno >= 50 ORDER BY deptno;\n\nDROP TRIGGER trg_dept_loc;"}, "out": "Trigger created.\n\nTRIGGER_NAME TRIGGER_TYPE    TRIGGERING_EVENT STATUS\n------------ --------------- ---------------- -------\nTRG_DEPT_LOC BEFORE EACH ROW INSERT OR UPDATE ENABLED\n\nTrigger altered.\n\n1 row created.\n\nTrigger altered.\n\n1 row created.\n\nDEPTNO DNAME LOC\n------ ----- -------\n    50 HR    Bharuch\n    60 IT    NAVSARI\n\nTrigger dropped.", "expl": {"en": "\n<ul><li><b>USER_TRIGGERS</b> lists the triggers of the current user with their type, event and status.</li>\n<li><b>ALTER TRIGGER name DISABLE</b> switches a trigger off without deleting it (useful while bulk-loading data). Row 50 is saved as 'Bharuch' because the trigger was disabled.</li>\n<li><b>ENABLE</b> switches it on again, so 'Navsari' becomes 'NAVSARI'.</li>\n<li><code>ALTER TABLE dept DISABLE ALL TRIGGERS;</code> disables all triggers of a table. <b>DROP TRIGGER</b> deletes the trigger; dropping a table also drops its triggers.</li></ul>\n"}}], "diagrams": [{"id": "db5_block", "title": {"en": "PL/SQL Block Structure"}, "file": "diagrams/db5_block.svg"}, {"id": "db5_engine", "title": {"en": "PL/SQL Engine"}, "file": "diagrams/db5_engine.svg"}, {"id": "db5_type_rowtype", "title": {"en": "%TYPE and %ROWTYPE"}, "file": "diagrams/db5_type_rowtype.svg"}, {"id": "db5_if", "title": {"en": "IF-THEN-ELSIF-ELSE Flow"}, "file": "diagrams/db5_if.svg"}, {"id": "db5_loops", "title": {"en": "Loops in PL/SQL"}, "file": "diagrams/db5_loops.svg"}, {"id": "db5_cursor", "title": {"en": "Cursor: Context Area and Active Set"}, "file": "diagrams/db5_cursor.svg"}, {"id": "db5_cursor_steps", "title": {"en": "Explicit Cursor: Four Steps"}, "file": "diagrams/db5_cursor_steps.svg"}, {"id": "db5_exceptions", "title": {"en": "Types of Exceptions"}, "file": "diagrams/db5_exceptions.svg"}, {"id": "db5_proc_func", "title": {"en": "Procedure vs Function"}, "file": "diagrams/db5_proc_func.svg"}, {"id": "db5_trigger_flow", "title": {"en": "How a Trigger Fires"}, "file": "diagrams/db5_trigger_flow.svg"}, {"id": "db5_trigger_types", "title": {"en": "Types of Triggers"}, "file": "diagrams/db5_trigger_types.svg"}], "syntax": [{"title": {"en": "PL/SQL Basics"}, "items": [{"name": {"en": "Block structure"}, "f": "DECLARE\n  -- declarations (optional)\nBEGIN\n  -- executable statements (mandatory)\nEXCEPTION\n  -- error handlers (optional)\nEND;\n/", "terms": {"en": "Only BEGIN ... END is mandatory. / runs the block in SQL*Plus."}}, {"name": {"en": "Output"}, "f": "SET SERVEROUTPUT ON\nBEGIN\n  DBMS_OUTPUT.PUT_LINE('Hello');\nEND;\n/", "terms": {"en": "SET SERVEROUTPUT ON is needed to see DBMS_OUTPUT."}}, {"name": {"en": "Variables and constants"}, "f": "v_name  VARCHAR2(20);\nv_count NUMBER(4) := 0;\nv_rate  NUMBER(5,2) DEFAULT 8.5;\nv_city  VARCHAR2(15) NOT NULL\n        := 'Surat';\nc_pi    CONSTANT NUMBER := 3.14;\nv_flag  BOOLEAN := FALSE;\nv_dob   DATE := SYSDATE;", "terms": {"en": ":= assigns. CONSTANT and NOT NULL must be initialised."}}, {"name": {"en": "SELECT INTO"}, "f": "SELECT col1, col2\nINTO   var1, var2\nFROM   table_name\nWHERE  condition;  -- exactly one row", "terms": {"en": "No row: NO_DATA_FOUND. Many rows: TOO_MANY_ROWS."}}, {"name": {"en": "%TYPE"}, "f": "variable table.column%TYPE;\n\nv_name emp.ename%TYPE;\nv_sal  emp.sal%TYPE;\nv_new  v_sal%TYPE;", "terms": {"en": "Same data type as a column or variable."}}, {"name": {"en": "%ROWTYPE"}, "f": "record table%ROWTYPE;\n\nv_emp emp%ROWTYPE;\n...\nSELECT * INTO v_emp\nFROM emp WHERE empno = 106;\nDBMS_OUTPUT.PUT_LINE(v_emp.ename);", "terms": {"en": "Record with one field per column."}}]}, {"title": {"en": "Control Structures"}, "items": [{"name": {"en": "IF / ELSIF / ELSE"}, "f": "IF condition THEN\n  statements;\nEND IF;\n\nIF condition THEN\n  statements;\nELSE\n  statements;\nEND IF;\n\nIF condition1 THEN\n  statements;\nELSIF condition2 THEN\n  statements;\nELSE\n  statements;\nEND IF;", "terms": {"en": "ELSIF (not ELSEIF); ends with END IF;"}}, {"name": {"en": "CASE"}, "f": "-- simple CASE\nCASE expression\n  WHEN value1 THEN statements;\n  WHEN value2 THEN statements;\n  ELSE statements;\nEND CASE;\n\n-- searched CASE\nCASE\n  WHEN condition1 THEN statements;\n  WHEN condition2 THEN statements;\n  ELSE statements;\nEND CASE;", "terms": {"en": "No match and no ELSE: CASE_NOT_FOUND."}}, {"name": {"en": "Basic LOOP"}, "f": "LOOP\n  statements;\n  EXIT WHEN condition;\nEND LOOP;", "terms": {"en": "Runs at least once; needs EXIT."}}, {"name": {"en": "WHILE LOOP"}, "f": "WHILE condition LOOP\n  statements;\nEND LOOP;", "terms": {"en": "Condition checked before each iteration."}}, {"name": {"en": "FOR LOOP"}, "f": "FOR counter IN [REVERSE] low..high\nLOOP\n  statements;\nEND LOOP;", "terms": {"en": "Counter declared automatically; REVERSE counts down."}}, {"name": {"en": "EXIT, CONTINUE, labels"}, "f": "<<outer>>\nFOR i IN 1..3 LOOP\n  FOR j IN 1..3 LOOP\n    EXIT outer WHEN i * j = 4;\n    CONTINUE WHEN j = 2;\n    DBMS_OUTPUT.PUT(i * j || ' ');\n  END LOOP;\nEND LOOP outer;\n-- prints: 1 3 2", "terms": {"en": "EXIT label leaves an outer loop."}}, {"name": {"en": "GOTO"}, "f": "BEGIN\n  IF v_marks < 35 THEN\n    GOTO fail_label;\n  END IF;\n  DBMS_OUTPUT.PUT_LINE('Pass');\n  GOTO end_label;\n  <<fail_label>>\n  DBMS_OUTPUT.PUT_LINE('Fail');\n  <<end_label>>\n  NULL;\nEND;", "terms": {"en": "Unconditional jump to a label; avoid it."}}, {"name": {"en": "NULL statement"}, "f": "IF v_sal > 50000 THEN\n  v_tax := v_sal * 0.2;\nELSE\n  NULL;  -- do nothing\nEND IF;", "terms": {"en": "Does nothing."}}]}, {"title": {"en": "Cursors"}, "items": [{"name": {"en": "Implicit cursor"}, "f": "UPDATE emp SET sal = sal + 2000\nWHERE job = 'CLERK';\nIF SQL%FOUND THEN\n  DBMS_OUTPUT.PUT_LINE(SQL%ROWCOUNT\n    || ' rows updated');\nEND IF;", "terms": {"en": "SQL%FOUND, SQL%NOTFOUND, SQL%ROWCOUNT, SQL%ISOPEN (always FALSE)."}}, {"name": {"en": "Explicit cursor"}, "f": "DECLARE\n  CURSOR c_emp IS\n    SELECT ename, sal FROM emp;   -- 1\n  v_name emp.ename%TYPE;\n  v_sal  emp.sal%TYPE;\nBEGIN\n  OPEN c_emp;                     -- 2\n  LOOP\n    FETCH c_emp INTO v_name, v_sal; -- 3\n    EXIT WHEN c_emp%NOTFOUND;\n    -- process the row\n  END LOOP;\n  CLOSE c_emp;                    -- 4\nEND;", "terms": {"en": "DECLARE, OPEN, FETCH, CLOSE."}}, {"name": {"en": "Cursor FOR loop"}, "f": "FOR record IN cursor_name LOOP\n  statements;  -- use record.column\nEND LOOP;\n\nFOR r IN (SELECT ename FROM emp) LOOP\n  DBMS_OUTPUT.PUT_LINE(r.ename);\nEND LOOP;", "terms": {"en": "Opens, fetches and closes automatically."}}, {"name": {"en": "Parameterized cursor"}, "f": "CURSOR c_emp (p_dno NUMBER) IS\n  SELECT ename FROM emp\n  WHERE deptno = p_dno;\n...\nOPEN c_emp(20);\nFOR r IN c_emp(30) LOOP ... END LOOP;", "terms": {"en": "Parameter types without size."}}]}, {"title": {"en": "Exceptions"}, "items": [{"name": {"en": "EXCEPTION section"}, "f": "BEGIN\n  statements;\nEXCEPTION\n  WHEN exception1 THEN\n    statements;\n  WHEN exception2 OR exception3 THEN\n    statements;\n  WHEN OTHERS THEN\n    statements;\nEND;", "terms": {"en": "WHEN OTHERS must be last. SQLCODE, SQLERRM."}}, {"name": {"en": "User-defined exception"}, "f": "DECLARE\n  e_low_bal EXCEPTION;          -- declare\nBEGIN\n  IF v_amt > v_bal THEN\n    RAISE e_low_bal;            -- raise\n  END IF;\nEXCEPTION\n  WHEN e_low_bal THEN           -- handle\n    DBMS_OUTPUT.PUT_LINE('Low balance');\nEND;", "terms": {"en": "Declare, RAISE, handle."}}, {"name": {"en": "PRAGMA EXCEPTION_INIT"}, "f": "DECLARE\n  e_child EXCEPTION;\n  PRAGMA EXCEPTION_INIT(e_child, -2292);\nBEGIN\n  DELETE FROM dept WHERE deptno = 10;\nEXCEPTION\n  WHEN e_child THEN\n    DBMS_OUTPUT.PUT_LINE('Has employees');\nEND;", "terms": {"en": "Names an Oracle error number."}}, {"name": {"en": "RAISE_APPLICATION_ERROR"}, "f": "RAISE_APPLICATION_ERROR(\n  error_number,  -- -20000 to -20999\n  'message');\n\nRAISE_APPLICATION_ERROR(-20010,\n  'Salary below minimum');", "terms": {"en": "Number -20000 to -20999."}}]}, {"title": {"en": "Procedures and Functions"}, "items": [{"name": {"en": "CREATE PROCEDURE"}, "f": "CREATE [OR REPLACE] PROCEDURE name\n  (param1 [IN|OUT|IN OUT] datatype,\n   param2 ...)\nIS | AS\n  -- local declarations\nBEGIN\n  statements;\n[EXCEPTION\n  handlers;]\nEND [name];\n/", "terms": {"en": "IN is the default mode. No DECLARE keyword."}}, {"name": {"en": "Execute a procedure"}, "f": "-- from SQL*Plus\nEXEC raise_sal(105)\nEXECUTE raise_sal(108, 20)\n\n-- from a PL/SQL block\nBEGIN\n  raise_sal(p_empno => 104, p_pct => 5);\nEND;\n/", "terms": {"en": "Positional or named (=>) notation."}}, {"name": {"en": "Parameter modes"}, "f": "CREATE OR REPLACE PROCEDURE get_emp (\n  p_no   IN  NUMBER,\n  p_name OUT VARCHAR2,\n  p_sal  OUT NUMBER) AS\nBEGIN\n  SELECT ename, sal INTO p_name, p_sal\n  FROM emp WHERE empno = p_no;\nEND;\n/", "terms": {"en": "OUT and IN OUT need a variable as actual parameter."}}, {"name": {"en": "CREATE FUNCTION"}, "f": "CREATE [OR REPLACE] FUNCTION name\n  (param1 [IN] datatype, ...)\nRETURN datatype\nIS | AS\n  -- local declarations\nBEGIN\n  statements;\n  RETURN value;\nEND [name];\n/", "terms": {"en": "RETURN datatype in header, RETURN value in body."}}, {"name": {"en": "Calling a function"}, "f": "v_pay := annual_pay(107);\n\nSELECT ename, annual_pay(empno)\nFROM emp;", "terms": {"en": "Usable in SQL if it does no DML."}}, {"name": {"en": "Drop and list"}, "f": "DROP PROCEDURE raise_sal;\nDROP FUNCTION annual_pay;\n\nSELECT object_name, object_type\nFROM user_objects\nWHERE object_type IN\n      ('PROCEDURE', 'FUNCTION');", "terms": {"en": "Code is in USER_SOURCE."}}]}, {"title": {"en": "Triggers"}, "items": [{"name": {"en": "CREATE TRIGGER"}, "f": "CREATE [OR REPLACE] TRIGGER name\n{BEFORE | AFTER}\n{INSERT | UPDATE [OF col] | DELETE}\n  [OR ...]\nON table_name\n[FOR EACH ROW]\n[WHEN (condition)]\n[DECLARE\n  declarations]\nBEGIN\n  statements;\nEND;\n/", "terms": {"en": "FOR EACH ROW = row level; default = statement level."}}, {"name": {"en": "BEFORE row trigger"}, "f": "CREATE OR REPLACE TRIGGER trg_upper\nBEFORE INSERT OR UPDATE ON emp\nFOR EACH ROW\nBEGIN\n  :NEW.ename := UPPER(:NEW.ename);\n  IF :NEW.sal < 0 THEN\n    RAISE_APPLICATION_ERROR(-20002,\n      'Salary cannot be negative');\n  END IF;\nEND;\n/", "terms": {"en": ":NEW can be changed only here."}}, {"name": {"en": "AFTER row trigger"}, "f": "CREATE OR REPLACE TRIGGER trg_sal_log\nAFTER UPDATE OF sal ON emp\nFOR EACH ROW\nBEGIN\n  INSERT INTO sal_log\n  VALUES (:OLD.empno, :OLD.sal,\n          :NEW.sal, SYSDATE);\nEND;\n/", "terms": {"en": "Auditing; :NEW is read-only."}}, {"name": {"en": "Statement trigger"}, "f": "CREATE OR REPLACE TRIGGER trg_emp_stmt\nAFTER DELETE ON emp\nBEGIN\n  DBMS_OUTPUT.PUT_LINE('Rows deleted');\nEND;\n/", "terms": {"en": "Fires once, even for 0 rows."}}, {"name": {"en": "Manage triggers"}, "f": "ALTER TRIGGER trg_upper DISABLE;\nALTER TRIGGER trg_upper ENABLE;\nALTER TABLE emp DISABLE ALL TRIGGERS;\nALTER TABLE emp ENABLE ALL TRIGGERS;\nDROP TRIGGER trg_upper;\n\nSELECT trigger_name, status\nFROM user_triggers;", "terms": {"en": "Disabled triggers do not fire."}}]}], "viva": [{"title": {"en": "PL/SQL Fundamentals"}, "items": [{"q": {"en": "What is PL/SQL?"}, "a": {"en": "Procedural Language extension to SQL: Oracle's language that adds variables, conditions, loops and error handling to SQL."}}, {"q": {"en": "What are the sections of a PL/SQL block?"}, "a": {"en": "DECLARE (optional), BEGIN (mandatory), EXCEPTION (optional) and END."}}, {"q": {"en": "Which section of a block is mandatory?"}, "a": {"en": "The executable section, BEGIN ... END."}}, {"q": {"en": "What is an anonymous block?"}, "a": {"en": "A PL/SQL block without a name that is not stored in the database."}}, {"q": {"en": "Why is SET SERVEROUTPUT ON used?"}, "a": {"en": "To display the output of DBMS_OUTPUT.PUT_LINE in SQL*Plus."}}, {"q": {"en": "Give three advantages of PL/SQL over SQL."}, "a": {"en": "Procedural features (IF, loops), less network traffic because a whole block is sent at once, and error handling."}}, {"q": {"en": "What is the assignment operator in PL/SQL?"}, "a": {"en": ":= (colon equals)."}}, {"q": {"en": "What is a constant?"}, "a": {"en": "A variable declared with CONSTANT whose value is fixed at declaration and cannot be changed."}}, {"q": {"en": "Can BOOLEAN be used as a column data type?"}, "a": {"en": "No, BOOLEAN exists only in PL/SQL."}}, {"q": {"en": "What is %TYPE?"}, "a": {"en": "An attribute that gives a variable the same data type as a table column or another variable."}}, {"q": {"en": "What is %ROWTYPE?"}, "a": {"en": "An attribute that declares a record with the structure of a whole table row or cursor row."}}, {"q": {"en": "What is the advantage of %TYPE?"}, "a": {"en": "If the column type changes, the program need not be changed."}}, {"q": {"en": "What happens if SELECT INTO returns no rows?"}, "a": {"en": "The NO_DATA_FOUND exception is raised."}}]}, {"title": {"en": "Control Structures"}, "items": [{"q": {"en": "Name the three types of control structures."}, "a": {"en": "Conditional (IF, CASE), iterative (loops) and sequential (GOTO, NULL)."}}, {"q": {"en": "What is the difference between IF-ELSIF and CASE?"}, "a": {"en": "Both choose among alternatives; CASE is clearer for many values of one expression, IF-ELSIF for unrelated conditions."}}, {"q": {"en": "What is the difference between simple and searched CASE?"}, "a": {"en": "Simple CASE compares one selector with values; searched CASE has a separate condition in each WHEN."}}, {"q": {"en": "Which loop runs at least once?"}, "a": {"en": "The basic LOOP with EXIT WHEN at the end."}}, {"q": {"en": "Difference between WHILE and FOR loop?"}, "a": {"en": "WHILE repeats while a condition is TRUE; FOR repeats a fixed number of times with an automatic counter."}}, {"q": {"en": "What does REVERSE do in a FOR loop?"}, "a": {"en": "The counter goes from the upper bound down to the lower bound."}}, {"q": {"en": "What is the use of EXIT WHEN?"}, "a": {"en": "It ends the loop when the condition becomes TRUE."}}, {"q": {"en": "What does CONTINUE do?"}, "a": {"en": "It skips the rest of the current iteration and starts the next one."}}, {"q": {"en": "What is the NULL statement?"}, "a": {"en": "A statement that does nothing; used where a statement is required."}}, {"q": {"en": "Why should GOTO be avoided?"}, "a": {"en": "It makes the program flow hard to read and maintain."}}]}, {"title": {"en": "Cursors"}, "items": [{"q": {"en": "What is a cursor?"}, "a": {"en": "A pointer to the context area (memory) that holds the rows returned by a SQL statement."}}, {"q": {"en": "What is an active set?"}, "a": {"en": "The set of rows returned by the cursor's query."}}, {"q": {"en": "What are the types of cursors?"}, "a": {"en": "Implicit cursors (created by Oracle) and explicit cursors (declared by the programmer)."}}, {"q": {"en": "What is the name of the implicit cursor?"}, "a": {"en": "SQL."}}, {"q": {"en": "Why is SQL%ISOPEN always FALSE?"}, "a": {"en": "Oracle closes the implicit cursor immediately after the statement."}}, {"q": {"en": "What are the steps to use an explicit cursor?"}, "a": {"en": "DECLARE, OPEN, FETCH, CLOSE."}}, {"q": {"en": "List the cursor attributes."}, "a": {"en": "%FOUND, %NOTFOUND, %ROWCOUNT and %ISOPEN."}}, {"q": {"en": "What does %ROWCOUNT return for an explicit cursor?"}, "a": {"en": "The number of rows fetched so far."}}, {"q": {"en": "What is a cursor FOR loop?"}, "a": {"en": "A loop that opens the cursor, fetches every row into a record and closes the cursor automatically."}}, {"q": {"en": "What is a parameterized cursor?"}, "a": {"en": "A cursor that accepts parameters, so it can be opened with different values."}}]}, {"title": {"en": "Exceptions"}, "items": [{"q": {"en": "What is an exception?"}, "a": {"en": "A run-time error in a PL/SQL block."}}, {"q": {"en": "What are the types of exceptions?"}, "a": {"en": "Predefined, non-predefined and user-defined."}}, {"q": {"en": "Name four predefined exceptions."}, "a": {"en": "NO_DATA_FOUND, TOO_MANY_ROWS, ZERO_DIVIDE, DUP_VAL_ON_INDEX."}}, {"q": {"en": "What is WHEN OTHERS?"}, "a": {"en": "A handler that catches all exceptions not handled earlier; it must be the last handler."}}, {"q": {"en": "What do SQLCODE and SQLERRM return?"}, "a": {"en": "The error number and the error message of the current exception."}}, {"q": {"en": "How is a user-defined exception raised?"}, "a": {"en": "With the RAISE statement."}}, {"q": {"en": "What is PRAGMA EXCEPTION_INIT?"}, "a": {"en": "A compiler directive that associates an exception name with an Oracle error number."}}, {"q": {"en": "What is RAISE_APPLICATION_ERROR?"}, "a": {"en": "A procedure that raises a user-defined error with a number from -20000 to -20999 and a message."}}, {"q": {"en": "What happens to an unhandled exception?"}, "a": {"en": "It propagates to the enclosing block or caller; if never handled, the program ends with an error."}}]}, {"title": {"en": "Procedures and Functions"}, "items": [{"q": {"en": "What is a stored procedure?"}, "a": {"en": "A named PL/SQL block stored in the database that performs a task and can be called with parameters."}}, {"q": {"en": "How do you execute a procedure in SQL*Plus?"}, "a": {"en": "EXEC procedure_name(arguments);"}}, {"q": {"en": "What are the parameter modes?"}, "a": {"en": "IN (default), OUT and IN OUT."}}, {"q": {"en": "Can an IN parameter be changed inside a procedure?"}, "a": {"en": "No, it is read-only."}}, {"q": {"en": "What is a function?"}, "a": {"en": "A named PL/SQL block that returns exactly one value with RETURN."}}, {"q": {"en": "Give two differences between a procedure and a function."}, "a": {"en": "A function must return a value with RETURN and can be used in SQL; a procedure need not return a value and is called as a statement."}}, {"q": {"en": "Can a function be used in a SELECT statement?"}, "a": {"en": "Yes, if it does not perform DML and has only IN parameters."}}, {"q": {"en": "What is the use of OR REPLACE?"}, "a": {"en": "It re-creates an existing subprogram without dropping it first."}}, {"q": {"en": "How do you see compilation errors?"}, "a": {"en": "With the SHOW ERRORS command."}}, {"q": {"en": "Which view lists procedures and functions?"}, "a": {"en": "USER_OBJECTS (and USER_PROCEDURES); the source code is in USER_SOURCE."}}]}, {"title": {"en": "Triggers"}, "items": [{"q": {"en": "What is a trigger?"}, "a": {"en": "A stored PL/SQL block that fires automatically when an INSERT, UPDATE or DELETE occurs on a table."}}, {"q": {"en": "What is the difference between a trigger and a procedure?"}, "a": {"en": "A trigger fires automatically on an event and has no parameters; a procedure is called explicitly."}}, {"q": {"en": "What is the difference between BEFORE and AFTER triggers?"}, "a": {"en": "A BEFORE trigger fires before the change and can modify :NEW; an AFTER trigger fires after the change."}}, {"q": {"en": "What is a row-level trigger?"}, "a": {"en": "A trigger with FOR EACH ROW that fires once for every affected row."}}, {"q": {"en": "What is a statement-level trigger?"}, "a": {"en": "A trigger without FOR EACH ROW that fires once per statement, even if no rows are affected."}}, {"q": {"en": "What are :NEW and :OLD?"}, "a": {"en": "Pseudo-records that hold the new and old values of the row in a row-level trigger."}}, {"q": {"en": "What is :OLD in an INSERT trigger?"}, "a": {"en": "NULL, because there is no old row."}}, {"q": {"en": "What are INSERTING, UPDATING and DELETING?"}, "a": {"en": "Conditional predicates that tell which event fired the trigger."}}, {"q": {"en": "What is the use of the WHEN clause in a trigger?"}, "a": {"en": "It adds a condition so the trigger fires only for certain rows."}}, {"q": {"en": "How many types of DML triggers are possible?"}, "a": {"en": "12: BEFORE/AFTER × row/statement × INSERT/UPDATE/DELETE."}}, {"q": {"en": "Can a trigger contain COMMIT?"}, "a": {"en": "No, COMMIT and ROLLBACK are not allowed in triggers."}}, {"q": {"en": "How do you disable a trigger?"}, "a": {"en": "ALTER TRIGGER trigger_name DISABLE;"}}, {"q": {"en": "Give two uses of triggers."}, "a": {"en": "Auditing changes and enforcing business rules / validation."}}]}], "exam_questions": [{"q": {"en": "What is PL/SQL? List the advantages of PL/SQL over SQL."}, "marks": 3}, {"q": {"en": "Explain the structure of a PL/SQL block with an example."}, "marks": 4}, {"q": {"en": "Explain %TYPE and %ROWTYPE with examples."}, "marks": 4}, {"q": {"en": "Explain the IF-THEN-ELSIF statement with an example."}, "marks": 3}, {"q": {"en": "Explain different types of loops in PL/SQL with examples."}, "marks": 7}, {"q": {"en": "Write a PL/SQL block to find the factorial of a number."}, "marks": 3}, {"q": {"en": "Write a PL/SQL block to check whether a number is a palindrome."}, "marks": 4}, {"q": {"en": "What is a cursor? Differentiate between implicit and explicit cursors."}, "marks": 4}, {"q": {"en": "Explain the steps of an explicit cursor and its attributes with an example."}, "marks": 7}, {"q": {"en": "Explain the cursor FOR loop with an example."}, "marks": 3}, {"q": {"en": "What is an exception? Explain predefined exceptions."}, "marks": 4}, {"q": {"en": "Explain user-defined exceptions with an example."}, "marks": 4}, {"q": {"en": "Explain exception handling in PL/SQL with all types of exceptions."}, "marks": 7}, {"q": {"en": "What is a stored procedure? Explain with syntax and example."}, "marks": 4}, {"q": {"en": "Explain IN, OUT and IN OUT parameters."}, "marks": 3}, {"q": {"en": "Differentiate between a procedure and a function."}, "marks": 3}, {"q": {"en": "Write a function that returns the annual salary of an employee."}, "marks": 4}, {"q": {"en": "What is a trigger? Explain the types of triggers."}, "marks": 7}, {"q": {"en": "Differentiate between row-level and statement-level triggers."}, "marks": 3}, {"q": {"en": "Write a trigger to convert the employee name to upper case before insert."}, "marks": 4}, {"q": {"en": "Write an AFTER trigger to audit salary changes."}, "marks": 4}], "tabs": ["notes", "programs", "diagrams", "syntax", "viva", "exam"], "intro_text": {"en": "Detailed notes as per GTU syllabus with diagrams, solved Oracle SQL queries with real output, syntax and viva."}};

  return (U[typeof key==='string'?key:'syntax']||[]).map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><pre class="code sx">${hl(e.f)}</pre></span>${chev}</div>
     <div class="a">${e.terms && t(e.terms) ? fixTables(t(e.terms)) : ''}</div></div>`).join('') + `</div>`).join('');
}
const flowcharts = diagrams;
const algorithms = () => syntax('algorithms');
const ALLV = {notes, programs, diagrams, flowcharts, algorithms, syntax, equations, numericals, viva, exam};
const VIEWS = U.tabs ? Object.fromEntries(U.tabs.map(k=>[k, ALLV[k]])) : U.programs ? (META.code_lang==='python' ? {notes, programs, diagrams, syntax, viva, exam} : {notes, programs, flowcharts, syntax, viva, exam}) : U.numericals ? {notes, diagrams, equations, numericals, viva, exam} : {notes, diagrams, equations, viva, exam};
function render(){
  document.getElementById('title').textContent = `${L('unit')} ${U.unit}: ${t(U.title)}`;
  document.getElementById('sub').textContent = `${t(META.name)} · ${META.code}`;
  document.getElementById('lang').textContent = S.lang==='en' ? 'ગુ' : 'EN';
  document.getElementById('lang').style.display = META.languages.includes('gu') ? '' : 'none';
  document.getElementById('tabs').innerHTML = Object.keys(VIEWS).map(k=>`<button class="tab${S.tab===k?' on':''}" data-tab="${k}">${L(k)}</button>`).join('');
  document.getElementById('view').innerHTML = VIEWS[S.tab]();
  document.querySelectorAll('#view pre.c').forEach(e=>{ e.innerHTML = hl(e.textContent); e.className='code'; });
}
let zoom = 1;
function setZoom(z){ zoom = Math.min(4, Math.max(1, z)); const w=document.getElementById('zw'); w.style.width=(zoom*100)+'%'; document.getElementById('zr').textContent=Math.round(zoom*100)+'%'; }
document.addEventListener('click', e=>{
  const q = e.target.closest('.q'); if (q && q.parentElement.querySelector('.a')) { q.parentElement.classList.toggle('open'); return; }
  const tb = e.target.closest('[data-tab]'); if (tb){ S.tab = tb.dataset.tab; render(); window.scrollTo(0,0); return; }
  if (e.target.closest('#lang')){ S.lang = S.lang==='en'?'gu':'en'; render(); return; }
  const m = e.target.closest('[data-more]');
  document.querySelectorAll('.menu.show').forEach(x=>{ if(!m || x!==m.nextElementSibling) x.classList.remove('show'); });
  if (m){ m.nextElementSibling.classList.toggle('show'); return; }
  const act = e.target.closest('[data-act]');
  if (act){ act.closest('.sec').querySelectorAll('.card').forEach(c=>{ if(c.querySelector('.a')) c.classList.toggle('open', act.dataset.act==='expand'); }); act.parentElement.classList.remove('show'); return; }
  const dg = e.target.closest('[data-dg]');
  if (dg){ const id=dg.dataset.dg; document.getElementById('mt').textContent=t(U.diagrams.find(d=>d.id===id).title); document.getElementById('zw').innerHTML=SVG[id]; setZoom(1); document.getElementById('modal').classList.add('show'); return; }
  if (e.target.closest('#mx')) document.getElementById('modal').classList.remove('show');
  if (e.target.closest('#zi')) setZoom(zoom+0.5);
  if (e.target.closest('#zo')) setZoom(zoom-0.5);
  if (e.target.closest('#zr')) setZoom(1);
});
render();
</script></body></html>
