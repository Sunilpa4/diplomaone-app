<script>
const U = {"subject": "DI03000051", "unit": 1, "format": "notes", "title": {"en": "Basics of Computer Network", "gu": "Computer Network ની મૂળભૂત બાબતો"}, "weightage": 18, "hours": 8, "notes": [{"title": {"en": "1.1 Basics of Computer Network", "gu": "1.1 Computer Network ની મૂળભૂત બાબતો"}, "items": [{"h": {"en": "1.1.1 Definition and Need of Computer Network", "gu": "1.1.1 Computer Network ની વ્યાખ્યા અને જરૂરિયાત"}, "body": {"en": "<p>A <b>computer network</b> is a collection of two or more <b>autonomous (independent) computers and devices</b> interconnected by a <b>transmission medium</b> (cable or wireless) so that they can <b>exchange data and share resources</b>, following a set of rules called <b>protocols</b>.</p>\n<p>Devices on a network are called <b>nodes</b> (computers, printers, mobiles, servers, routers). The connection between two nodes is a <b>link</b>.</p>\n<h4>Components of data communication</h4>\n<ol><li><b>Message:</b> the information to be sent (text, numbers, image, audio, video).</li><li><b>Sender:</b> the device that sends the message (computer, phone, camera).</li><li><b>Receiver:</b> the device that receives the message.</li><li><b>Transmission medium:</b> the physical path from sender to receiver (twisted pair, coaxial, fiber, radio waves).</li><li><b>Protocol:</b> the set of rules that governs communication; without a common protocol two devices can be connected but cannot communicate.</li></ol>\n<h4>Need (goals) of computer networks</h4>\n<ul>\n<li><b>Resource sharing:</b> printers, scanners, storage and the Internet connection are shared by many users, which reduces cost.</li>\n<li><b>Information / data sharing:</b> files and databases stored on a server can be accessed from any computer.</li>\n<li><b>Communication:</b> e-mail, chat, video conferencing and VoIP allow fast and cheap communication.</li>\n<li><b>Reliability and backup:</b> data can be copied on several computers; if one fails, another copy is available.</li>\n<li><b>Cost reduction:</b> many cheap PCs sharing one powerful server is cheaper than giving everybody a big computer.</li>\n<li><b>Centralised management:</b> software updates, security and backup are controlled from one place.</li>\n<li><b>Scalability:</b> new computers and users can be added easily as the organisation grows.</li>\n<li><b>Remote access:</b> work from home, online banking, accessing data from anywhere.</li>\n</ul>\n<h4>Characteristics of an effective network</h4>\n<p><b>Delivery</b> (to the correct receiver), <b>accuracy</b> (without errors), <b>timeliness</b> (in time, e.g. live video), and low <b>jitter</b> (uniform delay between packets). Performance is measured by throughput and delay; reliability and security are also important.</p>", "gu": "<p><b>Computer network</b> એ બે કે વધુ <b>સ્વતંત્ર (autonomous) computers અને devices</b> નો સમૂહ છે, જે <b>transmission medium</b> (cable કે wireless) થી જોડાયેલા હોય છે જેથી તેઓ <b>protocols</b> નામના નિયમોને અનુસરીને <b>data ની આપ-લે અને resources ની વહેંચણી</b> કરી શકે.</p>\n<p>Network પરના devices ને <b>nodes</b> કહે છે (computers, printers, mobiles, servers, routers). બે nodes વચ્ચેનું જોડાણ <b>link</b> છે.</p>\n<h4>Data communication ના ઘટકો</h4>\n<ol><li><b>Message:</b> મોકલવાની માહિતી (text, numbers, image, audio, video).</li><li><b>Sender:</b> message મોકલનાર device (computer, phone, camera).</li><li><b>Receiver:</b> message મેળવનાર device.</li><li><b>Transmission medium:</b> sender થી receiver સુધીનો physical માર્ગ (twisted pair, coaxial, fiber, radio waves).</li><li><b>Protocol:</b> communication નિયંત્રિત કરતા નિયમોનો સમૂહ; સામાન્ય protocol વગર બે devices જોડાયેલા હોય તો પણ વાતચીત કરી શકતા નથી.</li></ol>\n<h4>Computer networks ની જરૂરિયાત (goals)</h4>\n<ul>\n<li><b>Resource sharing:</b> printers, scanners, storage અને Internet connection ઘણા users વહેંચે છે, જેથી ખર્ચ ઘટે.</li>\n<li><b>Information / data sharing:</b> server પર રાખેલી files અને databases કોઈ પણ computer પરથી વાપરી શકાય.</li>\n<li><b>Communication:</b> e-mail, chat, video conferencing અને VoIP ઝડપી અને સસ્તો સંદેશાવ્યવહાર આપે.</li>\n<li><b>Reliability અને backup:</b> data ઘણા computers પર copy રાખી શકાય; એક બગડે તો બીજી copy મળે.</li>\n<li><b>ખર્ચમાં ઘટાડો:</b> એક શક્તિશાળી server વહેંચતા ઘણા સસ્તા PCs, દરેકને મોટું computer આપવા કરતાં સસ્તા છે.</li>\n<li><b>Centralised management:</b> software updates, security અને backup એક જગ્યાએથી નિયંત્રિત થાય.</li>\n<li><b>Scalability:</b> સંસ્થા વધે તેમ નવા computers અને users સહેલાઈથી ઉમેરી શકાય.</li>\n<li><b>Remote access:</b> ઘરેથી કામ, online banking, ગમે ત્યાંથી data વાપરવો.</li>\n</ul>\n<h4>અસરકારક network ની લાક્ષણિકતાઓ</h4>\n<p><b>Delivery</b> (સાચા receiver ને), <b>accuracy</b> (errors વગર), <b>timeliness</b> (સમયસર, દા.ત. live video), અને ઓછો <b>jitter</b> (packets વચ્ચે એકસરખો delay). Performance throughput અને delay થી મપાય; reliability અને security પણ મહત્વના છે.</p>"}, "diagram": "cn1_basic"}, {"h": {"en": "1.1.2 Computer Network Applications", "gu": "1.1.2 Computer Network ના ઉપયોગો"}, "body": {"en": "<p>Computer networks are used in almost every field today.</p>\n<ul>\n<li><b>Business applications:</b> resource sharing (printers, servers), client-server databases, e-mail, video conferencing (Zoom, Google Meet), e-commerce (Amazon, Flipkart), ERP systems linking offices and branches.</li>\n<li><b>Banking and finance:</b> ATMs, core banking, online banking, UPI payments, stock market trading.</li>\n<li><b>Home applications:</b> access to remote information (WWW, news, online learning), person-to-person communication (WhatsApp, e-mail, social media), interactive entertainment (OTT video streaming, online games), e-shopping.</li>\n<li><b>Mobile users:</b> smartphones and laptops on Wi-Fi and 4G/5G networks: navigation (maps), mobile banking, m-commerce, cab booking.</li>\n<li><b>Education:</b> e-learning (SWAYAM, NPTEL), online exams, digital libraries, smart classrooms.</li>\n<li><b>Healthcare:</b> telemedicine, online reports, hospital information systems.</li>\n<li><b>Government (e-governance):</b> online forms, DigiLocker, Aadhaar services, railway / bus reservation.</li>\n<li><b>Cloud computing:</b> Google Drive, online office tools and servers rented over the Internet.</li>\n<li><b>Internet of Things (IoT):</b> smart homes, CCTV cameras, smart meters and sensors connected to the network.</li>\n</ul>", "gu": "<p>આજે computer networks લગભગ દરેક ક્ષેત્રમાં વપરાય છે.</p>\n<ul>\n<li><b>Business ઉપયોગો:</b> resource sharing (printers, servers), client-server databases, e-mail, video conferencing (Zoom, Google Meet), e-commerce (Amazon, Flipkart), offices અને branches ને જોડતી ERP systems.</li>\n<li><b>Banking અને finance:</b> ATMs, core banking, online banking, UPI payments, stock market trading.</li>\n<li><b>ઘરના ઉપયોગો:</b> દૂરની માહિતી (WWW, news, online learning), વ્યક્તિ-થી-વ્યક્તિ communication (WhatsApp, e-mail, social media), interactive entertainment (OTT video streaming, online games), e-shopping.</li>\n<li><b>Mobile users:</b> Wi-Fi અને 4G/5G networks પર smartphones અને laptops: navigation (maps), mobile banking, m-commerce, cab booking.</li>\n<li><b>શિક્ષણ:</b> e-learning (SWAYAM, NPTEL), online exams, digital libraries, smart classrooms.</li>\n<li><b>આરોગ્ય:</b> telemedicine, online reports, hospital information systems.</li>\n<li><b>સરકાર (e-governance):</b> online forms, DigiLocker, Aadhaar services, railway / bus reservation.</li>\n<li><b>Cloud computing:</b> Google Drive, online office tools અને Internet પર ભાડે મળતા servers.</li>\n<li><b>Internet of Things (IoT):</b> network સાથે જોડાયેલા smart homes, CCTV cameras, smart meters અને sensors.</li>\n</ul>"}}, {"h": {"en": "1.1.3 Types of Connection: Point to Point and Multipoint", "gu": "1.1.3 Connection ના પ્રકાર: Point to Point અને Multipoint"}, "body": {"en": "<p>The <b>type of connection (line configuration)</b> tells how two or more devices are attached to a link. For communication, devices must be connected to the same link at the same time.</p>\n<h4>1. Point-to-point connection</h4>\n<p>Provides a <b>dedicated link between two devices</b>. The entire capacity of the link is reserved for transmission between those two devices only. It can use a cable or wireless media (microwave, satellite, infrared). Example: a computer connected to a printer by a cable; changing TV channels with an infrared remote.</p>\n<h4>2. Multipoint (multidrop) connection</h4>\n<p>More than two devices <b>share a single link</b>. The capacity of the channel is shared:</p>\n<ul><li><b>Spatially shared:</b> several devices use the link at the same time.</li><li><b>Time shared:</b> devices take turns using the link.</li></ul>\n<p>Example: computers on a bus topology LAN, devices on a Wi-Fi access point.</p>\n<h4>Difference</h4>\n<table><tr><th>Point to Point</th><th>Multipoint</th></tr><tr><td>Dedicated link between exactly two devices</td><td>One link shared by three or more devices</td></tr><tr><td>Entire capacity reserved for the two devices</td><td>Capacity shared spatially or by time-sharing</td></tr><tr><td>No addressing needed on the link</td><td>Addresses needed to identify the receiver</td></tr><tr><td>More cables when many devices are connected</td><td>Fewer cables, cheaper</td></tr><tr><td>High security and speed</td><td>Lower security; collisions possible</td></tr><tr><td>e.g. PC-printer cable, TV remote, leased line, mesh link</td><td>e.g. bus LAN, Wi-Fi, cable TV</td></tr></table>", "gu": "<p><b>Connection નો પ્રકાર (line configuration)</b> બતાવે છે કે બે કે વધુ devices link સાથે કેવી રીતે જોડાયેલા છે. Communication માટે devices એક જ સમયે એક જ link સાથે જોડાયેલા હોવા જોઈએ.</p>\n<h4>1. Point-to-point connection</h4>\n<p><b>બે devices વચ્ચે dedicated link</b> આપે છે. Link ની આખી capacity ફક્ત એ બે devices વચ્ચેના transmission માટે અનામત હોય છે. તે cable કે wireless media (microwave, satellite, infrared) વાપરી શકે. ઉદાહરણ: cable થી printer સાથે જોડાયેલું computer; infrared remote થી TV channels બદલવા.</p>\n<h4>2. Multipoint (multidrop) connection</h4>\n<p>બે થી વધુ devices <b>એક જ link વહેંચે</b> છે. Channel ની capacity વહેંચાય છે:</p>\n<ul><li><b>Spatially shared:</b> ઘણા devices એક જ સમયે link વાપરે.</li><li><b>Time shared:</b> devices વારાફરતી link વાપરે.</li></ul>\n<p>ઉદાહરણ: bus topology LAN પરના computers, Wi-Fi access point પરના devices.</p>\n<h4>તફાવત</h4>\n<table><tr><th>Point to Point</th><th>Multipoint</th></tr><tr><td>બરાબર બે devices વચ્ચે dedicated link</td><td>ત્રણ કે વધુ devices વચ્ચે એક જ shared link</td></tr><tr><td>આખી capacity બે devices માટે અનામત</td><td>Capacity જગ્યા કે સમય પ્રમાણે વહેંચાય</td></tr><tr><td>Link પર addressing ની જરૂર નથી</td><td>Receiver ઓળખવા addresses જરૂરી</td></tr><tr><td>ઘણા devices જોડવા વધુ cables</td><td>ઓછા cables, સસ્તું</td></tr><tr><td>વધુ security અને speed</td><td>ઓછી security; collisions શક્ય</td></tr><tr><td>દા.ત. PC-printer cable, TV remote, leased line, mesh link</td><td>દા.ત. bus LAN, Wi-Fi, cable TV</td></tr></table>"}, "diagram": "cn1_conn"}]}, {"title": {"en": "1.2 Types of Computer Networks", "gu": "1.2 Computer Networks ના પ્રકારો"}, "items": [{"h": {"en": "1.2.1 Local Area Network (LAN)", "gu": "1.2.1 Local Area Network (LAN)"}, "body": {"en": "<p>A <b>LAN</b> is a privately owned network that connects computers and devices within a <b>small geographical area</b> such as a room, a building or a campus (up to about 1 km).</p>\n<h4>Characteristics</h4>\n<ul><li>Owned, used and managed by a single person or organisation.</li><li>High data rate: 100 Mbps, 1 Gbps or 10 Gbps; very low delay and error rate.</li><li>Uses UTP cables, switches and Wi-Fi access points; common standards are <b>Ethernet (IEEE 802.3)</b> and <b>Wi-Fi (IEEE 802.11)</b>.</li><li>Common topologies: star (most used), bus, ring.</li></ul>\n<h4>Uses</h4>\n<p>Sharing files, printers, scanners and one Internet connection in a computer lab, office, school, hotel or home; running client-server applications in an office.</p>\n<h4>Advantages</h4>\n<ul><li>Resource sharing reduces cost; fast and reliable data transfer.</li><li>Centralised data and easy backup; easy communication between users.</li></ul>\n<h4>Disadvantages</h4>\n<ul><li>Covers only a limited area.</li><li>Setting up a server and cabling has an initial cost; a virus can spread to all computers.</li><li>Needs an administrator for security and maintenance.</li></ul>\n<p>A <b>wireless LAN (WLAN)</b> uses Wi-Fi instead of cables. A <b>PAN (Personal Area Network)</b> is even smaller (about 10 m): e.g. a mobile connected to Bluetooth earbuds.</p>", "gu": "<p><b>LAN</b> એ privately owned network છે જે રૂમ, building કે campus જેવા <b>નાના ભૌગોલિક વિસ્તાર</b> (લગભગ 1 km સુધી) માં computers અને devices ને જોડે છે.</p>\n<h4>લાક્ષણિકતાઓ</h4>\n<ul><li>એક જ વ્યક્તિ કે સંસ્થાની માલિકી, ઉપયોગ અને સંચાલન.</li><li>વધુ data rate: 100 Mbps, 1 Gbps કે 10 Gbps; ખૂબ ઓછો delay અને error rate.</li><li>UTP cables, switches અને Wi-Fi access points વાપરે; સામાન્ય standards <b>Ethernet (IEEE 802.3)</b> અને <b>Wi-Fi (IEEE 802.11)</b> છે.</li><li>સામાન્ય topologies: star (સૌથી વધુ વપરાતી), bus, ring.</li></ul>\n<h4>ઉપયોગો</h4>\n<p>Computer lab, office, school, hotel કે ઘરમાં files, printers, scanners અને એક Internet connection વહેંચવા; office માં client-server applications ચલાવવા.</p>\n<h4>ફાયદા</h4>\n<ul><li>Resource sharing થી ખર્ચ ઘટે; ઝડપી અને વિશ્વસનીય data transfer.</li><li>Centralised data અને સહેલું backup; users વચ્ચે સરળ communication.</li></ul>\n<h4>ગેરફાયદા</h4>\n<ul><li>માત્ર મર્યાદિત વિસ્તાર આવરી લે.</li><li>Server અને cabling માટે શરૂઆતી ખર્ચ; virus બધા computers માં ફેલાઈ શકે.</li><li>Security અને maintenance માટે administrator જોઈએ.</li></ul>\n<p><b>Wireless LAN (WLAN)</b> cables ના બદલે Wi-Fi વાપરે. <b>PAN (Personal Area Network)</b> તેનાથી પણ નાનું (લગભગ 10 m) છે: દા.ત. Bluetooth earbuds સાથે જોડાયેલો mobile.</p>"}, "diagram": "cn1_lan"}, {"h": {"en": "1.2.2 Metropolitan Area Network (MAN)", "gu": "1.2.2 Metropolitan Area Network (MAN)"}, "body": {"en": "<p>A <b>MAN</b> is a network that covers a <b>city or a large town</b> (about 5 to 50 km). It is larger than a LAN and smaller than a WAN, and usually interconnects several LANs of a city using a high-speed backbone (generally optical fiber).</p>\n<h4>Characteristics</h4>\n<ul><li>Owned by a single large organisation, a group of organisations, a telephone / cable company or the government.</li><li>Data rate is high (10 Mbps to 1 Gbps or more), slightly lower than a LAN.</li><li>Uses fiber optic cables, routers and switches; earlier standard: DQDB (IEEE 802.6); wireless MAN: WiMAX (IEEE 802.16).</li></ul>\n<h4>Uses / examples</h4>\n<p>Cable TV network of a city, connecting all branches of a bank or all colleges of a university in one city, city-wide Wi-Fi, CCTV surveillance network of a smart city.</p>\n<h4>Advantages</h4>\n<ul><li>Connects many LANs of a city at high speed; sharing of a common Internet connection.</li><li>Cheaper than a WAN for city-level communication.</li></ul>\n<h4>Disadvantages</h4>\n<ul><li>More costly and complex than a LAN; difficult to manage and secure.</li><li>Needs skilled staff; fiber laying is expensive.</li></ul>", "gu": "<p><b>MAN</b> એ <b>શહેર કે મોટા નગર</b> (લગભગ 5 થી 50 km) ને આવરી લેતું network છે. તે LAN થી મોટું અને WAN થી નાનું છે, અને સામાન્ય રીતે high-speed backbone (મોટે ભાગે optical fiber) વડે શહેરના ઘણા LANs ને જોડે છે.</p>\n<h4>લાક્ષણિકતાઓ</h4>\n<ul><li>એક મોટી સંસ્થા, સંસ્થાઓનો સમૂહ, telephone / cable company કે સરકારની માલિકી.</li><li>Data rate વધુ (10 Mbps થી 1 Gbps કે વધુ), LAN કરતાં થોડો ઓછો.</li><li>Fiber optic cables, routers અને switches વાપરે; જૂનું standard: DQDB (IEEE 802.6); wireless MAN: WiMAX (IEEE 802.16).</li></ul>\n<h4>ઉપયોગો / ઉદાહરણો</h4>\n<p>શહેરનું cable TV network, એક શહેરમાં bank ની બધી branches કે university ની બધી colleges ને જોડવી, શહેરવ્યાપી Wi-Fi, smart city નું CCTV surveillance network.</p>\n<h4>ફાયદા</h4>\n<ul><li>શહેરના ઘણા LANs ને ઝડપથી જોડે; સામાન્ય Internet connection ની વહેંચણી.</li><li>શહેર-સ્તરના communication માટે WAN કરતાં સસ્તું.</li></ul>\n<h4>ગેરફાયદા</h4>\n<ul><li>LAN કરતાં વધુ ખર્ચાળ અને જટિલ; સંચાલન અને security મુશ્કેલ.</li><li>કુશળ staff જોઈએ; fiber નાખવું મોંઘું.</li></ul>"}, "diagram": "cn1_man"}, {"h": {"en": "1.2.3 Wide Area Network (WAN)", "gu": "1.2.3 Wide Area Network (WAN)"}, "body": {"en": "<p>A <b>WAN</b> spans a <b>large geographical area</b> such as a state, a country, a continent or the whole world. It connects LANs and MANs that are far apart using <b>routers</b> and long-distance links: leased telephone lines, optical fiber, microwave and satellite.</p>\n<h4>Characteristics</h4>\n<ul><li>Usually not owned by one organisation; links are leased from telecom companies (ISPs).</li><li>Lower speed per link and higher propagation delay and error rate than LAN / MAN.</li><li>Technologies: leased lines, MPLS, Frame Relay, ATM, 4G/5G, satellite links.</li><li>Two kinds: <b>point-to-point WAN</b> (leased line between two sites) and <b>switched WAN</b> (backbone of the Internet).</li></ul>\n<h4>Uses / examples</h4>\n<p>The Internet (largest WAN), railway reservation network, network connecting all branches of a bank across India, ATM network, multinational company networks.</p>\n<h4>Advantages</h4>\n<ul><li>Covers a very large area; people in different cities and countries can communicate and share data.</li><li>Centralised data for all branches; supports business everywhere.</li></ul>\n<h4>Disadvantages</h4>\n<ul><li>High setup and maintenance cost; complex to manage.</li><li>More security problems (hacking, viruses); needs firewalls.</li><li>Slower and higher delay than a LAN.</li></ul>", "gu": "<p><b>WAN</b> રાજ્ય, દેશ, ખંડ કે આખી દુનિયા જેવા <b>મોટા ભૌગોલિક વિસ્તાર</b> માં ફેલાયેલું હોય છે. તે <b>routers</b> અને લાંબા અંતરના links: leased telephone lines, optical fiber, microwave અને satellite વડે દૂર આવેલા LANs અને MANs ને જોડે છે.</p>\n<h4>લાક્ષણિકતાઓ</h4>\n<ul><li>સામાન્ય રીતે એક સંસ્થાની માલિકી નથી; links telecom companies (ISPs) પાસેથી ભાડે લેવાય.</li><li>LAN / MAN કરતાં link દીઠ ઓછી speed અને વધુ propagation delay અને error rate.</li><li>Technologies: leased lines, MPLS, Frame Relay, ATM, 4G/5G, satellite links.</li><li>બે પ્રકાર: <b>point-to-point WAN</b> (બે sites વચ્ચે leased line) અને <b>switched WAN</b> (Internet નું backbone).</li></ul>\n<h4>ઉપયોગો / ઉદાહરણો</h4>\n<p>Internet (સૌથી મોટું WAN), railway reservation network, ભારતભરમાં bank ની બધી branches ને જોડતું network, ATM network, multinational company networks.</p>\n<h4>ફાયદા</h4>\n<ul><li>ખૂબ મોટો વિસ્તાર આવરી લે; જુદાં શહેરો અને દેશોના લોકો communication અને data sharing કરી શકે.</li><li>બધી branches માટે centralised data; દરેક જગ્યાએ business ને support.</li></ul>\n<h4>ગેરફાયદા</h4>\n<ul><li>Setup અને maintenance નો ખર્ચ વધુ; સંચાલન જટિલ.</li><li>વધુ security સમસ્યાઓ (hacking, viruses); firewalls જોઈએ.</li><li>LAN કરતાં ધીમું અને વધુ delay.</li></ul>"}, "diagram": "cn1_wan"}, {"h": {"en": "1.2.4 Internet and Comparison of LAN, MAN, WAN", "gu": "1.2.4 Internet અને LAN, MAN, WAN ની સરખામણી"}, "body": {"en": "<p>The <b>Internet</b> (inter-connected networks) is a <b>worldwide network of networks</b> that connects millions of private, public, academic, business and government networks using the <b>TCP/IP</b> protocol suite. Nobody owns the whole Internet.</p>\n<h4>Structure</h4>\n<ul><li><b>Backbone:</b> very high-speed fiber networks of large (Tier-1) providers, including undersea cables between countries.</li><li><b>ISPs (Internet Service Providers):</b> regional and local companies (Jio, Airtel, BSNL) that connect to the backbone and give Internet access to users.</li><li><b>End users:</b> homes, mobiles, colleges, offices and servers connected through their ISP by broadband, fiber, DSL, 4G/5G or Wi-Fi.</li></ul>\n<h4>Services / uses of the Internet</h4>\n<p>World Wide Web (websites), e-mail, file transfer (FTP), search engines, social media, e-commerce, online banking and UPI, video streaming and conferencing, cloud storage, e-learning.</p>\n<p><b>Intranet:</b> a private network of an organisation using Internet technology (web pages, e-mail), accessible only to its employees. <b>Extranet:</b> part of an intranet opened to selected outsiders (suppliers, customers).</p>\n<h4>Comparison of LAN, MAN and WAN</h4>\n<table><tr><th>Point</th><th>LAN</th><th>MAN</th><th>WAN</th></tr><tr><td>Full form</td><td>Local Area Network</td><td>Metropolitan Area Network</td><td>Wide Area Network</td></tr><tr><td>Area</td><td>Room, building, campus (up to ~1 km)</td><td>City (5-50 km)</td><td>Country, continent, world</td></tr><tr><td>Ownership</td><td>Private (one organisation)</td><td>Private or public</td><td>Mostly public / many owners</td></tr><tr><td>Speed</td><td>Very high (100 Mbps-10 Gbps)</td><td>High (10 Mbps-1 Gbps)</td><td>Lower (Kbps-Mbps per user link)</td></tr><tr><td>Error rate / delay</td><td>Lowest</td><td>Medium</td><td>Highest</td></tr><tr><td>Cost</td><td>Low</td><td>Medium</td><td>Very high</td></tr><tr><td>Media / devices</td><td>UTP, Wi-Fi, switch</td><td>Fiber, routers</td><td>Fiber, satellite, microwave, routers</td></tr><tr><td>Example</td><td>College computer lab</td><td>Cable TV / city network</td><td>Internet, bank network</td></tr></table>", "gu": "<p><b>Internet</b> (inter-connected networks) એ <b>TCP/IP</b> protocol suite વાપરીને લાખો private, public, academic, business અને government networks ને જોડતું <b>વિશ્વવ્યાપી networks નું network</b> છે. આખા Internet નો કોઈ એક માલિક નથી.</p>\n<h4>રચના</h4>\n<ul><li><b>Backbone:</b> મોટા (Tier-1) providers ના ખૂબ high-speed fiber networks, દેશો વચ્ચેના દરિયાઈ (undersea) cables સહિત.</li><li><b>ISPs (Internet Service Providers):</b> backbone સાથે જોડાઈને users ને Internet access આપતી પ્રાદેશિક અને સ્થાનિક companies (Jio, Airtel, BSNL).</li><li><b>End users:</b> broadband, fiber, DSL, 4G/5G કે Wi-Fi વડે પોતાના ISP મારફતે જોડાયેલા ઘરો, mobiles, colleges, offices અને servers.</li></ul>\n<h4>Internet ની સેવાઓ / ઉપયોગો</h4>\n<p>World Wide Web (websites), e-mail, file transfer (FTP), search engines, social media, e-commerce, online banking અને UPI, video streaming અને conferencing, cloud storage, e-learning.</p>\n<p><b>Intranet:</b> Internet technology (web pages, e-mail) વાપરતું સંસ્થાનું private network, ફક્ત તેના કર્મચારીઓ વાપરી શકે. <b>Extranet:</b> પસંદગીના બહારના લોકો (suppliers, customers) માટે ખોલેલો intranet નો ભાગ.</p>\n<h4>LAN, MAN અને WAN ની સરખામણી</h4>\n<table><tr><th>મુદ્દો</th><th>LAN</th><th>MAN</th><th>WAN</th></tr><tr><td>Full form</td><td>Local Area Network</td><td>Metropolitan Area Network</td><td>Wide Area Network</td></tr><tr><td>વિસ્તાર</td><td>રૂમ, building, campus (~1 km સુધી)</td><td>શહેર (5-50 km)</td><td>દેશ, ખંડ, દુનિયા</td></tr><tr><td>માલિકી</td><td>Private (એક સંસ્થા)</td><td>Private કે public</td><td>મોટે ભાગે public / ઘણા માલિક</td></tr><tr><td>Speed</td><td>ખૂબ વધુ (100 Mbps-10 Gbps)</td><td>વધુ (10 Mbps-1 Gbps)</td><td>ઓછી (user link પર Kbps-Mbps)</td></tr><tr><td>Error rate / delay</td><td>સૌથી ઓછો</td><td>મધ્યમ</td><td>સૌથી વધુ</td></tr><tr><td>ખર્ચ</td><td>ઓછો</td><td>મધ્યમ</td><td>ખૂબ વધુ</td></tr><tr><td>Media / devices</td><td>UTP, Wi-Fi, switch</td><td>Fiber, routers</td><td>Fiber, satellite, microwave, routers</td></tr><tr><td>ઉદાહરણ</td><td>College computer lab</td><td>Cable TV / city network</td><td>Internet, bank network</td></tr></table>"}, "diagram": "cn1_internet"}]}, {"title": {"en": "1.3 Network Topology", "gu": "1.3 Network Topology"}, "items": [{"h": {"en": "1.3.1 Network Topology and Bus Topology", "gu": "1.3.1 Network Topology અને Bus Topology"}, "body": {"en": "<p><b>Network topology</b> is the <b>geometric arrangement</b> of devices (nodes) and the links connecting them in a network. <b>Physical topology</b> is the actual layout of cables and devices; <b>logical topology</b> is the way data flows between devices.</p>\n<p><b>Use of topology:</b> it decides the cost, the amount of cable, the speed, the reliability, the ease of installation and fault detection, and how easily the network can grow. The basic topologies are bus, star, ring and mesh; tree and hybrid are combinations.</p>\n<h4>Bus topology</h4>\n<p>All devices are connected to a <b>single main cable called the backbone (bus)</b>. Each device is attached to the backbone by a <b>drop line</b> and a <b>tap</b> (connector). It is a <b>multipoint</b> configuration. A signal sent by one device travels along the backbone in both directions and is received by all devices; only the addressed device accepts it. <b>Terminators</b> at both ends absorb the signal to stop reflection.</p>\n<p><b>Use:</b> early Ethernet LANs (10Base2 / 10Base5 coaxial), small temporary networks, cable TV distribution.</p>\n<h4>Advantages</h4><ul><li>Easy to install; least cable of all topologies, so cheap.</li><li>Easy to add a device by tapping the backbone.</li><li>Good for small, temporary networks.</li></ul><h4>Disadvantages</h4><ul><li>A break in the backbone stops the whole network.</li><li>Only one device can send at a time; collisions increase with more devices; slow under heavy traffic.</li><li>Fault isolation is difficult; limited cable length and number of devices.</li><li>Terminators are needed at both ends to prevent signal reflection.</li></ul>", "gu": "<p><b>Network topology</b> એ network માં devices (nodes) અને તેમને જોડતા links ની <b>ભૌમિતિક ગોઠવણી</b> છે. <b>Physical topology</b> એ cables અને devices ની ખરેખર ગોઠવણી છે; <b>logical topology</b> એ devices વચ્ચે data કેવી રીતે વહે છે તે છે.</p>\n<p><b>Topology નો ઉપયોગ:</b> તે ખર્ચ, cable નું પ્રમાણ, speed, reliability, installation અને fault detection ની સરળતા, અને network કેટલું સહેલાઈથી વધી શકે તે નક્કી કરે છે. મૂળભૂત topologies bus, star, ring અને mesh છે; tree અને hybrid તેમનાં સંયોજનો છે.</p>\n<h4>Bus topology</h4>\n<p>બધા devices <b>backbone (bus) નામના એક મુખ્ય cable</b> સાથે જોડાયેલા હોય છે. દરેક device <b>drop line</b> અને <b>tap</b> (connector) વડે backbone સાથે જોડાય છે. તે <b>multipoint</b> configuration છે. એક device નો signal backbone પર બંને દિશામાં જાય છે અને બધા devices ને મળે છે; માત્ર જેનું address હોય તે device સ્વીકારે છે. બંને છેડે <b>terminators</b> reflection અટકાવવા signal શોષી લે છે.</p>\n<p><b>ઉપયોગ:</b> શરૂઆતના Ethernet LANs (10Base2 / 10Base5 coaxial), નાના કામચલાઉ networks, cable TV distribution.</p>\n<h4>ફાયદા</h4><ul><li>Install કરવું સહેલું; બધી topologies માં સૌથી ઓછો cable, તેથી સસ્તું.</li><li>Backbone પર tap કરી device ઉમેરવું સહેલું.</li><li>નાના, કામચલાઉ networks માટે સારું.</li></ul><h4>ગેરફાયદા</h4><ul><li>Backbone માં break આખું network બંધ કરે.</li><li>એક સમયે એક જ device મોકલી શકે; devices વધતાં collisions વધે; વધુ traffic માં ધીમું.</li><li>Fault શોધવો મુશ્કેલ; cable ની લંબાઈ અને devices ની સંખ્યા મર્યાદિત.</li><li>Signal reflection અટકાવવા બંને છેડે terminators જરૂરી.</li></ul>"}, "diagram": "cn1_bus"}, {"h": {"en": "1.3.2 Star Topology", "gu": "1.3.2 Star Topology"}, "body": {"en": "<p>In a star topology each device has a <b>dedicated point-to-point link only to a central device</b>, a <b>hub or switch</b>. Devices are not directly linked to each other; all traffic passes through the central device. If one device wants to send data to another, it sends it to the hub, which forwards it to the destination (a switch sends it only to the destination port).</p>\n<p><b>Use:</b> the most common topology in modern LANs: college labs, offices and homes (Ethernet with UTP cables and a switch, Wi-Fi with an access point).</p>\n<h4>Advantages</h4><ul><li>Easy to install, configure, add or remove devices.</li><li>Failure of one link or device affects only that device.</li><li>Easy fault detection and isolation from the hub.</li><li>Less cable than mesh; each device needs only one port.</li><li>Good performance with a switch.</li></ul><h4>Disadvantages</h4><ul><li>The whole network depends on the hub / switch; if it fails, all devices stop.</li><li>More cable than bus or ring.</li><li>Cost of the hub / switch; number of devices limited by hub ports.</li></ul>", "gu": "<p>Star topology માં દરેક device પાસે <b>માત્ર central device</b>, એટલે કે <b>hub કે switch</b> સુધી <b>dedicated point-to-point link</b> હોય છે. Devices એકબીજા સાથે સીધા જોડાયેલા નથી; બધો traffic central device માંથી પસાર થાય છે. એક device બીજાને data મોકલવા ઇચ્છે તો તે hub ને મોકલે, જે destination ને forward કરે (switch માત્ર destination port પર મોકલે).</p>\n<p><b>ઉપયોગ:</b> આધુનિક LANs માં સૌથી સામાન્ય topology: college labs, offices અને ઘરો (UTP cables અને switch સાથે Ethernet, access point સાથે Wi-Fi).</p>\n<h4>ફાયદા</h4><ul><li>Install, configure, device ઉમેરવું કે કાઢવું સહેલું.</li><li>એક link કે device બગડે તો માત્ર તે device પર અસર.</li><li>Hub પરથી fault શોધવો અને અલગ કરવો સહેલો.</li><li>Mesh કરતાં ઓછો cable; દરેક device ને એક જ port જોઈએ.</li><li>Switch સાથે સારી performance.</li></ul><h4>ગેરફાયદા</h4><ul><li>આખું network hub / switch પર આધારિત; તે બગડે તો બધા devices બંધ.</li><li>Bus કે ring કરતાં વધુ cable.</li><li>Hub / switch નો ખર્ચ; devices ની સંખ્યા hub ports થી મર્યાદિત.</li></ul>"}, "diagram": "cn1_star"}, {"h": {"en": "1.3.3 Ring Topology", "gu": "1.3.3 Ring Topology"}, "body": {"en": "<p>In a ring topology each device has a dedicated point-to-point connection with <b>only the two devices on either side</b> of it, forming a closed loop (ring). A signal travels around the ring in <b>one direction</b>, from device to device, until it reaches its destination. Each device contains a <b>repeater</b> that regenerates the signal and passes it on.</p>\n<p>Access is usually controlled by a <b>token</b>: a special frame that circulates around the ring; only the device holding the token can send data. A <b>dual ring</b> (two rings in opposite directions, e.g. FDDI) keeps working even if one ring breaks.</p>\n<p><b>Use:</b> IBM Token Ring LAN, FDDI, SONET fiber rings in MAN / telecom backbones.</p>\n<h4>Advantages</h4><ul><li>Equal access for all devices (token); no collisions.</li><li>Easy to install and reconfigure: adding a device changes only two links.</li><li>Each device acts as a repeater, so signal is regenerated; good for long distance.</li><li>Fault isolation is simple (a device can raise an alarm if no signal is received).</li></ul><h4>Disadvantages</h4><ul><li>A break in the ring or failure of one device can stop the whole network (unidirectional ring).</li><li>Adding or removing a device disturbs the network.</li><li>Delay increases with the number of devices since data passes through every device.</li></ul>", "gu": "<p>Ring topology માં દરેક device પાસે <b>તેની બંને બાજુના માત્ર બે devices</b> સાથે dedicated point-to-point જોડાણ હોય છે, જે બંધ loop (ring) બનાવે છે. Signal ring પર <b>એક દિશામાં</b> device થી device જાય છે, destination સુધી પહોંચે ત્યાં સુધી. દરેક device માં <b>repeater</b> હોય છે જે signal ફરી મજબૂત બનાવી આગળ મોકલે.</p>\n<p>Access સામાન્ય રીતે <b>token</b> થી નિયંત્રિત થાય છે: ring પર ફરતો ખાસ frame; token ધરાવતું device જ data મોકલી શકે. <b>Dual ring</b> (વિરુદ્ધ દિશામાં બે rings, દા.ત. FDDI) એક ring તૂટે તો પણ કામ ચાલુ રાખે.</p>\n<p><b>ઉપયોગ:</b> IBM Token Ring LAN, FDDI, MAN / telecom backbones માં SONET fiber rings.</p>\n<h4>ફાયદા</h4><ul><li>બધા devices ને સરખો access (token); collisions નહીં.</li><li>Install અને reconfigure સહેલું: device ઉમેરવાથી માત્ર બે links બદલાય.</li><li>દરેક device repeater તરીકે કામ કરે, signal ફરી મજબૂત થાય; લાંબા અંતર માટે સારું.</li><li>Fault શોધવો સરળ (signal ન મળે તો device alarm આપે).</li></ul><h4>ગેરફાયદા</h4><ul><li>Ring માં break કે એક device બગડે તો આખું network બંધ થઈ શકે (unidirectional ring).</li><li>Device ઉમેરવા કે કાઢવાથી network ખોરવાય.</li><li>Data દરેક device માંથી પસાર થતો હોવાથી devices વધતાં delay વધે.</li></ul>"}, "diagram": "cn1_ring"}, {"h": {"en": "1.3.4 Mesh Topology", "gu": "1.3.4 Mesh Topology"}, "body": {"en": "<p>In a (fully connected) mesh topology <b>every device has a dedicated point-to-point link to every other device</b>. A link carries traffic only between the two devices it connects.</p>\n<h4>Formulas for n devices</h4>\n<ul><li>Number of links (cables) = <b>n(n-1)/2</b> (duplex links)</li><li>Ports (I/O) per device = <b>n-1</b></li><li>Total ports in the network = <b>n(n-1)</b></li></ul>\n<p>Example: for 6 devices, links = 6×5/2 = <b>15</b>, ports per device = <b>5</b>, total ports = <b>30</b>. In a <b>partial mesh</b>, only important devices are fully connected.</p>\n<p><b>Use:</b> Internet backbone between routers, connecting the main offices of a bank, WAN links between telephone exchanges, wireless mesh networks.</p>\n<h4>Advantages</h4><ul><li>Dedicated links: no traffic problem, high speed.</li><li>Robust: if one link fails, others still work (alternate paths).</li><li>Privacy and security: data travels only on the dedicated link.</li><li>Easy fault identification and isolation.</li></ul><h4>Disadvantages</h4><ul><li>Very costly: large amount of cable and many I/O ports.</li><li>Installation and reconnection are difficult.</li><li>Bulk of wiring may need more space than available.</li></ul>", "gu": "<p>(Fully connected) mesh topology માં <b>દરેક device પાસે બીજા દરેક device સુધી dedicated point-to-point link</b> હોય છે. Link માત્ર તે જોડતા બે devices વચ્ચેનો traffic લઈ જાય છે.</p>\n<h4>n devices માટેનાં સૂત્રો</h4>\n<ul><li>Links (cables) ની સંખ્યા = <b>n(n-1)/2</b> (duplex links)</li><li>Device દીઠ ports (I/O) = <b>n-1</b></li><li>Network માં કુલ ports = <b>n(n-1)</b></li></ul>\n<p>ઉદાહરણ: 6 devices માટે, links = 6×5/2 = <b>15</b>, device દીઠ ports = <b>5</b>, કુલ ports = <b>30</b>. <b>Partial mesh</b> માં માત્ર મહત્વના devices જ fully connected હોય છે.</p>\n<p><b>ઉપયોગ:</b> routers વચ્ચે Internet backbone, bank ની મુખ્ય offices જોડવી, telephone exchanges વચ્ચે WAN links, wireless mesh networks.</p>\n<h4>ફાયદા</h4><ul><li>Dedicated links: traffic સમસ્યા નહીં, વધુ speed.</li><li>Robust: એક link બગડે તો બીજા કામ કરે (વૈકલ્પિક માર્ગો).</li><li>Privacy અને security: data માત્ર dedicated link પર જાય.</li><li>Fault ઓળખવો અને અલગ કરવો સહેલો.</li></ul><h4>ગેરફાયદા</h4><ul><li>ખૂબ ખર્ચાળ: ઘણો cable અને ઘણા I/O ports.</li><li>Installation અને ફરી જોડાણ મુશ્કેલ.</li><li>વધુ wiring માટે ઉપલબ્ધ કરતાં વધુ જગ્યા જોઈએ.</li></ul>"}, "diagram": "cn1_mesh", "examples": ["cn1n2", "cn1n3"]}, {"h": {"en": "1.3.5 Tree Topology", "gu": "1.3.5 Tree Topology"}, "body": {"en": "<p>A tree topology is a <b>hierarchical</b> arrangement and a variation of star. Devices are connected to <b>secondary hubs</b>, and the secondary hubs are connected to a <b>central (root) hub</b>. It can also be seen as several star networks connected by a bus backbone. The central hub is active (repeats the signal); secondary hubs may be active or passive.</p>\n<p><b>Use:</b> large organisations and campuses: each department / floor has its own hub (star), and all are connected to the main hub; cable TV networks.</p>\n<h4>Advantages</h4><ul><li>Easy to expand by adding new branches (scalable).</li><li>Fault in one branch does not affect other branches.</li><li>Point-to-point wiring for each segment; easy management in hierarchy.</li><li>Supported by many hardware vendors.</li></ul><h4>Disadvantages</h4><ul><li>If the root (central) hub or backbone fails, the network below it stops.</li><li>More cable than bus; difficult to configure as it grows.</li><li>Costly hubs.</li></ul>", "gu": "<p>Tree topology એ <b>hierarchical</b> ગોઠવણી અને star નો પ્રકાર છે. Devices <b>secondary hubs</b> સાથે જોડાય, અને secondary hubs <b>central (root) hub</b> સાથે જોડાય. તેને bus backbone થી જોડાયેલા ઘણા star networks તરીકે પણ જોઈ શકાય. Central hub active (signal repeat કરે) હોય; secondary hubs active કે passive હોઈ શકે.</p>\n<p><b>ઉપયોગ:</b> મોટી સંસ્થાઓ અને campuses: દરેક department / floor નું પોતાનું hub (star), અને બધા મુખ્ય hub સાથે જોડાયેલા; cable TV networks.</p>\n<h4>ફાયદા</h4><ul><li>નવી branches ઉમેરી વિસ્તારવું સહેલું (scalable).</li><li>એક branch નો fault બીજી branches ને અસર ન કરે.</li><li>દરેક segment માટે point-to-point wiring; hierarchy માં સહેલું સંચાલન.</li><li>ઘણા hardware vendors support કરે.</li></ul><h4>ગેરફાયદા</h4><ul><li>Root (central) hub કે backbone બગડે તો તેની નીચેનું network બંધ.</li><li>Bus કરતાં વધુ cable; મોટું થાય તેમ configure કરવું મુશ્કેલ.</li><li>Hubs ખર્ચાળ.</li></ul>"}, "diagram": "cn1_tree"}, {"h": {"en": "1.3.6 Hybrid Topology", "gu": "1.3.6 Hybrid Topology"}, "body": {"en": "<p>A hybrid topology is a <b>combination of two or more different basic topologies</b> (e.g. star + ring, star + bus). The resulting network does not follow any single standard topology. Example: each department of a college uses a star LAN, and the department switches are connected by a bus or ring backbone.</p>\n<p><b>Use:</b> large organisations, universities, the Internet itself (mixture of all topologies).</p>\n<h4>Advantages</h4><ul><li>Flexible: the best topology can be used for each part.</li><li>Reliable: faults are limited to one part and easy to detect.</li><li>Scalable: easy to add new networks.</li></ul><h4>Disadvantages</h4><ul><li>Complex design and management.</li><li>Costly: needs intelligent hubs and more cabling.</li></ul>", "gu": "<p>Hybrid topology એ <b>બે કે વધુ જુદી મૂળભૂત topologies નું સંયોજન</b> છે (દા.ત. star + ring, star + bus). પરિણામી network કોઈ એક standard topology ને અનુસરતું નથી. ઉદાહરણ: college ના દરેક department માં star LAN, અને department switches bus કે ring backbone થી જોડાયેલા.</p>\n<p><b>ઉપયોગ:</b> મોટી સંસ્થાઓ, universities, Internet પોતે (બધી topologies નું મિશ્રણ).</p>\n<h4>ફાયદા</h4><ul><li>Flexible: દરેક ભાગ માટે શ્રેષ્ઠ topology વાપરી શકાય.</li><li>Reliable: faults એક ભાગ પૂરતા રહે અને શોધવા સહેલા.</li><li>Scalable: નવા networks ઉમેરવા સહેલા.</li></ul><h4>ગેરફાયદા</h4><ul><li>જટિલ design અને સંચાલન.</li><li>ખર્ચાળ: intelligent hubs અને વધુ cabling જોઈએ.</li></ul>"}, "diagram": "cn1_hybrid"}, {"h": {"en": "1.3.7 Comparison of Topologies (Practical 1)", "gu": "1.3.7 Topologies ની સરખામણી (Practical 1)"}, "body": {"en": "<p>The number of cables (links) and ports depends on the topology. For <b>n</b> devices:</p>\n<table><tr><th>Topology</th><th>Links for n devices</th><th>Ports per device</th><th>Main drawback</th></tr><tr><td>Bus</td><td>1 backbone + n drop lines</td><td>1</td><td>Backbone fault stops all</td></tr><tr><td>Star</td><td>n (to hub)</td><td>1 (hub needs n)</td><td>Hub failure stops all</td></tr><tr><td>Ring</td><td>n</td><td>2</td><td>One break can stop ring</td></tr><tr><td>Mesh</td><td>n(n-1)/2</td><td>n-1</td><td>Very high cost</td></tr><tr><td>Tree</td><td>n-1 links in hierarchy</td><td>1 (hubs more)</td><td>Root failure</td></tr><tr><td>Hybrid</td><td>Depends on parts</td><td>Depends</td><td>Complex, costly</td></tr></table>\n<h4>Practical 1: six devices</h4>\n<ul><li><b>Bus:</b> 1 backbone + 6 drop lines; 1 port per device; total 6 ports.</li><li><b>Ring:</b> 6 cables; 2 ports per device; total 12 ports.</li><li><b>Star:</b> 6 cables; 1 port per device + 6 ports on the hub; total 12 ports.</li><li><b>Mesh:</b> 15 cables; 5 ports per device; total 30 ports.</li></ul>\n<h4>Choosing a topology</h4>\n<p>Small lab or office → <b>star</b> (easy, reliable). Very reliable backbone → <b>mesh</b> (partial). Big campus → <b>tree / hybrid</b>. Low-cost temporary network → <b>bus</b>.</p>", "gu": "<p>Cables (links) અને ports ની સંખ્યા topology પર આધાર રાખે છે. <b>n</b> devices માટે:</p>\n<table><tr><th>Topology</th><th>n devices માટે links</th><th>Device દીઠ ports</th><th>મુખ્ય ખામી</th></tr><tr><td>Bus</td><td>1 backbone + n drop lines</td><td>1</td><td>Backbone fault થી બધું બંધ</td></tr><tr><td>Star</td><td>n (hub સુધી)</td><td>1 (hub ને n)</td><td>Hub બગડે તો બધું બંધ</td></tr><tr><td>Ring</td><td>n</td><td>2</td><td>એક break થી ring બંધ</td></tr><tr><td>Mesh</td><td>n(n-1)/2</td><td>n-1</td><td>ખૂબ વધુ ખર્ચ</td></tr><tr><td>Tree</td><td>Hierarchy માં n-1 links</td><td>1 (hubs ને વધુ)</td><td>Root બગડે</td></tr><tr><td>Hybrid</td><td>ભાગો પર આધાર</td><td>આધાર</td><td>જટિલ, ખર્ચાળ</td></tr></table>\n<h4>Practical 1: છ devices</h4>\n<ul><li><b>Bus:</b> 1 backbone + 6 drop lines; device દીઠ 1 port; કુલ 6 ports.</li><li><b>Ring:</b> 6 cables; device દીઠ 2 ports; કુલ 12 ports.</li><li><b>Star:</b> 6 cables; device દીઠ 1 port + hub પર 6 ports; કુલ 12 ports.</li><li><b>Mesh:</b> 15 cables; device દીઠ 5 ports; કુલ 30 ports.</li></ul>\n<h4>Topology ની પસંદગી</h4>\n<p>નાની lab કે office → <b>star</b> (સહેલું, વિશ્વસનીય). ખૂબ વિશ્વસનીય backbone → <b>mesh</b> (partial). મોટું campus → <b>tree / hybrid</b>. ઓછા ખર્ચનું કામચલાઉ network → <b>bus</b>.</p>"}, "examples": ["cn1n1", "cn1n4", "cn1n5", "cn1n6"]}]}, {"title": {"en": "1.4 Standard Organizations and Protocols", "gu": "1.4 Standard Organizations અને Protocols"}, "items": [{"h": {"en": "1.4.1 Protocols", "gu": "1.4.1 Protocols"}, "body": {"en": "<p>A <b>protocol</b> is a <b>set of rules</b> that governs data communication: it defines <b>what</b> is communicated, <b>how</b> it is communicated and <b>when</b> it is communicated. Two devices may be connected, but they can communicate only if they follow the same protocol (like two people need a common language).</p>\n<h4>Key elements of a protocol</h4>\n<ol><li><b>Syntax:</b> the structure or format of the data: the order of fields. e.g. first 8 bits = sender address, next 8 bits = receiver address, rest = message.</li><li><b>Semantics:</b> the meaning of each section of bits: how a pattern is interpreted and what action is taken (e.g. does an address identify the route or the final destination?).</li><li><b>Timing:</b> <b>when</b> data should be sent and <b>how fast</b>; e.g. if the sender sends at 100 Mbps and the receiver can handle only 1 Mbps, data will be lost.</li></ol>\n<h4>Standards</h4>\n<p>A <b>standard</b> is an agreed specification that makes equipment of different manufacturers work together (<b>interoperability</b>). <b>De facto</b> standards are adopted through wide use without formal approval (e.g. early TCP/IP); <b>de jure</b> standards are approved by an official body (e.g. IEEE 802.3).</p>\n<h4>Common protocols</h4>\n<table><tr><th>Protocol</th><th>Use</th></tr><tr><td>HTTP / HTTPS</td><td>Transfer web pages (HTTPS = secure, encrypted)</td></tr><tr><td>FTP</td><td>Transfer files between computers</td></tr><tr><td>SMTP</td><td>Send e-mail</td></tr><tr><td>POP3 / IMAP</td><td>Receive / read e-mail from a mail server</td></tr><tr><td>TCP</td><td>Reliable, connection-oriented delivery of data</td></tr><tr><td>UDP</td><td>Fast, connectionless delivery (video, DNS)</td></tr><tr><td>IP</td><td>Addressing and routing of packets</td></tr><tr><td>DNS</td><td>Converts domain names to IP addresses</td></tr><tr><td>DHCP</td><td>Gives IP addresses automatically to computers</td></tr><tr><td>Telnet / SSH</td><td>Remote login (SSH is secure)</td></tr></table>", "gu": "<p><b>Protocol</b> એ data communication નિયંત્રિત કરતા <b>નિયમોનો સમૂહ</b> છે: તે નક્કી કરે છે કે <b>શું</b> communicate થાય, <b>કેવી રીતે</b> થાય અને <b>ક્યારે</b> થાય. બે devices જોડાયેલા હોય, પરંતુ એક જ protocol અનુસરે ત્યારે જ વાતચીત કરી શકે (જેમ બે વ્યક્તિઓને સામાન્ય ભાષા જોઈએ).</p>\n<h4>Protocol ના મુખ્ય તત્વો</h4>\n<ol><li><b>Syntax:</b> data નું structure કે format: fields નો ક્રમ. દા.ત. પહેલા 8 bits = sender address, પછીના 8 bits = receiver address, બાકી = message.</li><li><b>Semantics:</b> bits ના દરેક ભાગનો અર્થ: pattern નું અર્થઘટન કેવી રીતે થાય અને કઈ ક્રિયા થાય (દા.ત. address route ઓળખે છે કે અંતિમ destination?).</li><li><b>Timing:</b> data <b>ક્યારે</b> મોકલવો અને <b>કેટલી ઝડપે</b>; દા.ત. sender 100 Mbps પર મોકલે અને receiver માત્ર 1 Mbps સંભાળી શકે તો data ખોવાય.</li></ol>\n<h4>Standards</h4>\n<p><b>Standard</b> એ સંમત specification છે જે જુદા manufacturers ના સાધનોને સાથે કામ કરાવે છે (<b>interoperability</b>). <b>De facto</b> standards formal મંજૂરી વગર વ્યાપક ઉપયોગથી અપનાવાય (દા.ત. શરૂઆતનું TCP/IP); <b>de jure</b> standards સત્તાવાર સંસ્થા મંજૂર કરે (દા.ત. IEEE 802.3).</p>\n<h4>સામાન્ય protocols</h4>\n<table><tr><th>Protocol</th><th>ઉપયોગ</th></tr><tr><td>HTTP / HTTPS</td><td>Web pages transfer (HTTPS = secure, encrypted)</td></tr><tr><td>FTP</td><td>Computers વચ્ચે files transfer</td></tr><tr><td>SMTP</td><td>E-mail મોકલવા</td></tr><tr><td>POP3 / IMAP</td><td>Mail server પરથી e-mail મેળવવા / વાંચવા</td></tr><tr><td>TCP</td><td>વિશ્વસનીય, connection-oriented data delivery</td></tr><tr><td>UDP</td><td>ઝડપી, connectionless delivery (video, DNS)</td></tr><tr><td>IP</td><td>Packets નું addressing અને routing</td></tr><tr><td>DNS</td><td>Domain names ને IP addresses માં ફેરવે</td></tr><tr><td>DHCP</td><td>Computers ને આપમેળે IP addresses આપે</td></tr><tr><td>Telnet / SSH</td><td>Remote login (SSH secure છે)</td></tr></table>"}}, {"h": {"en": "1.4.2 Standard Organizations: IEEE, ISOC, IETF, ISO, IRTF", "gu": "1.4.2 Standard Organizations: IEEE, ISOC, IETF, ISO, IRTF"}, "body": {"en": "<p>Standards are developed by <b>standard creation committees</b>, <b>forums</b> and <b>regulatory agencies</b>. The important organisations for computer networks are:</p>\n<table><tr><th>Organisation</th><th>Full form and role</th></tr><tr><td>IEEE</td><td><b>Institute of Electrical and Electronics Engineers</b> (USA, 1963). Largest professional engineering society; develops standards for LANs and wireless: <b>IEEE 802 project</b>: 802.3 Ethernet, 802.11 Wi-Fi, 802.15 Bluetooth/PAN, 802.16 WiMAX.</td></tr><tr><td>ISO</td><td><b>International Organization for Standardization</b> (Geneva, 1947). Body of national standard organisations of about 165 countries; created the <b>OSI reference model</b> (ISO 7498) for open systems interconnection.</td></tr><tr><td>ISOC</td><td><b>Internet Society</b> (1992). Non-profit body that promotes the open development, evolution and use of the Internet; provides the organisational home and funding for IETF, IAB and IRTF.</td></tr><tr><td>IETF</td><td><b>Internet Engineering Task Force</b>. Open community of network designers that develops and publishes <b>Internet standards</b> as <b>RFCs</b> (Request for Comments): TCP, IP, HTTP, SMTP. Works in working groups organised by area.</td></tr><tr><td>IRTF</td><td><b>Internet Research Task Force</b>. Works on <b>long-term research</b> problems of the Internet (future protocols, applications, architecture, technology) through research groups; results may later become IETF standards.</td></tr></table>\n<h4>Internet standards process</h4>\n<p>A specification starts as an <b>Internet Draft</b> (working document, valid for 6 months). If recommended, it is published as an <b>RFC</b>. An RFC moves through maturity levels: <b>Proposed Standard</b> → <b>Internet Standard</b>. The <b>IAB (Internet Architecture Board)</b> gives technical oversight; <b>ICANN</b> manages domain names and IP address allocation.</p>\n<p>Other bodies: <b>ITU-T</b> (telecommunication standards), <b>ANSI</b> (American National Standards Institute), <b>EIA/TIA</b> (cabling standards such as the T568A / T568B colour codes for UTP).</p>", "gu": "<p>Standards <b>standard creation committees</b>, <b>forums</b> અને <b>regulatory agencies</b> બનાવે છે. Computer networks માટે મહત્વની organisations:</p>\n<table><tr><th>Organisation</th><th>Full form અને ભૂમિકા</th></tr><tr><td>IEEE</td><td><b>Institute of Electrical and Electronics Engineers</b> (USA, 1963). સૌથી મોટી professional engineering society; LANs અને wireless માટે standards બનાવે: <b>IEEE 802 project</b>: 802.3 Ethernet, 802.11 Wi-Fi, 802.15 Bluetooth/PAN, 802.16 WiMAX.</td></tr><tr><td>ISO</td><td><b>International Organization for Standardization</b> (Geneva, 1947). લગભગ 165 દેશોની national standard organisations નો સમૂહ; open systems interconnection માટે <b>OSI reference model</b> (ISO 7498) બનાવ્યું.</td></tr><tr><td>ISOC</td><td><b>Internet Society</b> (1992). Internet ના ખુલ્લા વિકાસ, પ્રગતિ અને ઉપયોગને પ્રોત્સાહન આપતી non-profit સંસ્થા; IETF, IAB અને IRTF ને સંસ્થાકીય આધાર અને funding આપે.</td></tr><tr><td>IETF</td><td><b>Internet Engineering Task Force</b>. Network designers નો ખુલ્લો સમુદાય જે <b>Internet standards</b> ને <b>RFCs</b> (Request for Comments) તરીકે બનાવે અને પ્રકાશિત કરે: TCP, IP, HTTP, SMTP. વિસ્તાર પ્રમાણે working groups માં કામ કરે.</td></tr><tr><td>IRTF</td><td><b>Internet Research Task Force</b>. Research groups દ્વારા Internet ની <b>લાંબા ગાળાની research</b> સમસ્યાઓ (ભાવિ protocols, applications, architecture, technology) પર કામ કરે; પરિણામો પછી IETF standards બની શકે.</td></tr></table>\n<h4>Internet standards ની પ્રક્રિયા</h4>\n<p>Specification <b>Internet Draft</b> (કામચલાઉ document, 6 મહિના માન્ય) તરીકે શરૂ થાય. ભલામણ થાય તો <b>RFC</b> તરીકે પ્રકાશિત થાય. RFC maturity levels માંથી પસાર થાય: <b>Proposed Standard</b> → <b>Internet Standard</b>. <b>IAB (Internet Architecture Board)</b> technical દેખરેખ રાખે; <b>ICANN</b> domain names અને IP address ફાળવણી સંભાળે.</p>\n<p>બીજી સંસ્થાઓ: <b>ITU-T</b> (telecommunication standards), <b>ANSI</b> (American National Standards Institute), <b>EIA/TIA</b> (UTP માટે T568A / T568B colour codes જેવા cabling standards).</p>"}}]}, {"title": {"en": "1.5 Types of Servers", "gu": "1.5 Servers ના પ્રકારો"}, "items": [{"h": {"en": "1.5.1 Servers: File Server, Print Server, Mail Server", "gu": "1.5.1 Servers: File Server, Print Server, Mail Server"}, "body": {"en": "<p>In a <b>client-server network</b>, a <b>server</b> is a powerful computer (or software) that <b>provides services</b> to other computers called <b>clients</b>. Clients send requests; the server processes them and sends replies. A server has a fast processor, large RAM and storage, a reliable power supply and a server operating system (Windows Server, Linux). (In a <b>peer-to-peer</b> network, every computer is both client and server.)</p>\n<h4>1. File server</h4>\n<p>Stores files centrally and lets authorised clients <b>store, retrieve, share and update files</b> over the network.</p>\n<ul><li><b>Features:</b> central storage, user accounts and access permissions (read / write), file locking for shared files, quotas, regular backup, RAID disks for reliability.</li><li><b>Applications:</b> shared folders in an office or lab, project files of a team, home directories of students.</li></ul>\n<h4>2. Print server</h4>\n<p>Manages one or more printers and lets many clients <b>share them</b>. Print jobs are received, stored in a <b>print queue (spooling)</b> and sent to the printer one by one.</p>\n<ul><li><b>Features:</b> print queue management (pause, cancel, priority), sharing costly printers, user-wise accounting and limits, status reporting (paper out, error).</li><li><b>Applications:</b> one laser printer shared by all PCs in a lab or office.</li></ul>\n<h4>3. Mail server</h4>\n<p>Stores, sends and receives <b>e-mail</b> for users. It works like a post office: an <b>outgoing (SMTP) server</b> sends mail to the receiver's mail server, and the receiver reads it from the <b>incoming server</b> using <b>POP3</b> (download) or <b>IMAP</b> (keep on server, sync on all devices).</p>\n<ul><li><b>Features:</b> user mailboxes, spam and virus filtering, attachments, address books, auto-reply.</li><li><b>Applications:</b> Gmail, Outlook / Microsoft Exchange, college and company e-mail.</li></ul>", "gu": "<p><b>Client-server network</b> માં <b>server</b> એ શક્તિશાળી computer (કે software) છે જે <b>clients</b> નામના બીજા computers ને <b>સેવાઓ આપે</b> છે. Clients requests મોકલે; server તેની પ્રક્રિયા કરી જવાબ મોકલે. Server માં ઝડપી processor, મોટી RAM અને storage, વિશ્વસનીય power supply અને server operating system (Windows Server, Linux) હોય છે. (<b>Peer-to-peer</b> network માં દરેક computer client અને server બંને હોય.)</p>\n<h4>1. File server</h4>\n<p>Files કેન્દ્રિય રીતે રાખે અને અધિકૃત clients ને network પર <b>files store, retrieve, share અને update</b> કરવા દે.</p>\n<ul><li><b>Features:</b> central storage, user accounts અને access permissions (read / write), shared files માટે file locking, quotas, નિયમિત backup, reliability માટે RAID disks.</li><li><b>ઉપયોગો:</b> office કે lab માં shared folders, team ની project files, students ની home directories.</li></ul>\n<h4>2. Print server</h4>\n<p>એક કે વધુ printers સંભાળે અને ઘણા clients ને <b>તે વહેંચવા</b> દે. Print jobs મેળવી <b>print queue (spooling)</b> માં રાખે અને એક પછી એક printer ને મોકલે.</p>\n<ul><li><b>Features:</b> print queue management (pause, cancel, priority), મોંઘા printers ની વહેંચણી, user પ્રમાણે હિસાબ અને મર્યાદા, status reporting (paper out, error).</li><li><b>ઉપયોગો:</b> lab કે office ના બધા PCs વહેંચતા એક laser printer.</li></ul>\n<h4>3. Mail server</h4>\n<p>Users માટે <b>e-mail</b> store કરે, મોકલે અને મેળવે. તે post office જેવું કામ કરે: <b>outgoing (SMTP) server</b> receiver ના mail server ને mail મોકલે, અને receiver <b>incoming server</b> પરથી <b>POP3</b> (download) કે <b>IMAP</b> (server પર રાખે, બધા devices પર sync) વડે વાંચે.</p>\n<ul><li><b>Features:</b> user mailboxes, spam અને virus filtering, attachments, address books, auto-reply.</li><li><b>ઉપયોગો:</b> Gmail, Outlook / Microsoft Exchange, college અને company e-mail.</li></ul>"}, "diagram": "cn1_client_server"}, {"h": {"en": "1.5.2 Web Server and Proxy Server", "gu": "1.5.2 Web Server અને Proxy Server"}, "body": {"en": "<h4>4. Web server</h4>\n<p>Stores <b>websites</b> (HTML pages, images, scripts) and delivers them to clients' <b>web browsers</b> using <b>HTTP / HTTPS</b>. The browser sends a request for a URL; the web server finds the page (or generates it using PHP, Java, Python with a database) and sends it back.</p>\n<ul><li><b>Features:</b> handles thousands of requests at once, static and dynamic pages, HTTPS security (SSL/TLS certificates), virtual hosting (many websites on one server), logging.</li><li><b>Applications:</b> hosting college, company and e-commerce websites. Software: Apache, Nginx, Microsoft IIS.</li></ul>\n<h4>5. Proxy server</h4>\n<p>An <b>intermediary</b> between clients and the Internet. The client sends its request to the proxy; the proxy forwards it to the web server on behalf of the client, receives the reply and passes it back.</p>\n<ul><li><b>Caching:</b> frequently visited pages are stored; the next request is served from the cache (faster, saves bandwidth).</li><li><b>Filtering / access control:</b> blocks unwanted websites (used in colleges and offices).</li><li><b>Privacy:</b> hides clients' IP addresses from outside servers.</li><li><b>Logging and monitoring</b> of Internet use; <b>sharing</b> one Internet connection.</li><li><b>Applications:</b> college / office Internet gateway (Squid), anonymous browsing, load balancing (reverse proxy in front of web servers).</li></ul>\n<h4>Summary of servers</h4>\n<table><tr><th>Server</th><th>Main protocols / software</th><th>Example</th></tr><tr><td>File server</td><td>SMB/CIFS, NFS, FTP</td><td>Windows Server shared folder, NAS</td></tr><tr><td>Print server</td><td>IPP, LPD</td><td>Lab printer shared by 40 PCs</td></tr><tr><td>Mail server</td><td>SMTP, POP3, IMAP</td><td>Gmail, Microsoft Exchange, Postfix</td></tr><tr><td>Web server</td><td>HTTP, HTTPS</td><td>Apache, Nginx, Microsoft IIS</td></tr><tr><td>Proxy server</td><td>HTTP proxy, SOCKS</td><td>Squid in a college network</td></tr></table>", "gu": "<h4>4. Web server</h4>\n<p><b>Websites</b> (HTML pages, images, scripts) store કરે અને <b>HTTP / HTTPS</b> વડે clients ના <b>web browsers</b> ને આપે. Browser URL માટે request મોકલે; web server page શોધે (કે database સાથે PHP, Java, Python વડે બનાવે) અને પાછું મોકલે.</p>\n<ul><li><b>Features:</b> એક સાથે હજારો requests સંભાળે, static અને dynamic pages, HTTPS security (SSL/TLS certificates), virtual hosting (એક server પર ઘણી websites), logging.</li><li><b>ઉપયોગો:</b> college, company અને e-commerce websites hosting. Software: Apache, Nginx, Microsoft IIS.</li></ul>\n<h4>5. Proxy server</h4>\n<p>Clients અને Internet વચ્ચેનો <b>મધ્યસ્થી</b>. Client પોતાની request proxy ને મોકલે; proxy client વતી web server ને forward કરે, જવાબ મેળવી પાછો આપે.</p>\n<ul><li><b>Caching:</b> વારંવાર જોવાતાં pages સંગ્રહાય; બીજી request cache માંથી પૂરી થાય (ઝડપી, bandwidth બચે).</li><li><b>Filtering / access control:</b> અનિચ્છનીય websites block કરે (colleges અને offices માં વપરાય).</li><li><b>Privacy:</b> બહારના servers થી clients ના IP addresses છુપાવે.</li><li>Internet ઉપયોગનું <b>logging અને monitoring</b>; એક Internet connection ની <b>વહેંચણી</b>.</li><li><b>ઉપયોગો:</b> college / office Internet gateway (Squid), anonymous browsing, load balancing (web servers આગળ reverse proxy).</li></ul>\n<h4>Servers નો સારાંશ</h4>\n<table><tr><th>Server</th><th>મુખ્ય protocols / software</th><th>ઉદાહરણ</th></tr><tr><td>File server</td><td>SMB/CIFS, NFS, FTP</td><td>Windows Server shared folder, NAS</td></tr><tr><td>Print server</td><td>IPP, LPD</td><td>40 PCs વહેંચતા lab printer</td></tr><tr><td>Mail server</td><td>SMTP, POP3, IMAP</td><td>Gmail, Microsoft Exchange, Postfix</td></tr><tr><td>Web server</td><td>HTTP, HTTPS</td><td>Apache, Nginx, Microsoft IIS</td></tr><tr><td>Proxy server</td><td>HTTP proxy, SOCKS</td><td>College network માં Squid</td></tr></table>"}, "diagram": "cn1_proxy"}]}], "numericals": [{"id": "cn1n1", "q": {"en": "(Practical 1) Six devices are connected with wired media. Find the number of cables (links), ports needed in each device and the total number of ports in the network for (a) bus (b) ring (c) star (d) mesh topology.", "gu": "(Practical 1) છ devices wired media થી જોડાયેલા છે. (a) bus (b) ring (c) star (d) mesh topology માટે cables (links) ની સંખ્યા, દરેક device માં જરૂરી ports અને network માં કુલ ports શોધો."}, "a": {"en": "<p>Given n = 6 devices.</p>\n<ul><li><b>Bus:</b> one backbone cable; each device is connected by its own drop line, so 6 drop lines; each device needs 1 port.</li>\n<li><b>Ring:</b> each device is connected to its two neighbours: links = n = 6; ports per device = 2.</li>\n<li><b>Star:</b> each device has one cable to the hub: links = n = 6; 1 port per device, and the hub needs 6 ports.</li>\n<li><b>Mesh:</b> links = n(n-1)/2 = 6×5/2 = 15; ports per device = n-1 = 5; total = n(n-1) = 30.</li></ul><table><tr><th>Topology</th><th>Cables (links)</th><th>Ports per device</th><th>Total ports</th></tr><tr><td>Bus</td><td>1 backbone + 6 drop lines</td><td>1</td><td>6 × 1 = 6</td></tr><tr><td>Ring</td><td>6</td><td>2</td><td>6 × 2 = 12</td></tr><tr><td>Star</td><td>6 (device to hub)</td><td>1</td><td>6 + 6 (hub) = 12</td></tr><tr><td>Mesh</td><td>6(6-1)/2 = 15</td><td>6-1 = 5</td><td>6 × 5 = 30</td></tr></table><p><b>Answer:</b> Bus 6 ports, Ring 12 ports, Star 12 ports (6 devices + 6 hub), Mesh 15 cables and 30 ports.</p>", "gu": "<p>n = 6 devices આપેલ છે.</p>\n<ul><li><b>Bus:</b> એક backbone cable; દરેક device પોતાની drop line થી જોડાય, તેથી 6 drop lines; દરેક device ને 1 port.</li>\n<li><b>Ring:</b> દરેક device તેના બે પડોશીઓ સાથે જોડાય: links = n = 6; device દીઠ ports = 2.</li>\n<li><b>Star:</b> દરેક device નો hub સુધી એક cable: links = n = 6; device દીઠ 1 port, અને hub ને 6 ports.</li>\n<li><b>Mesh:</b> links = n(n-1)/2 = 6×5/2 = 15; device દીઠ ports = n-1 = 5; કુલ = n(n-1) = 30.</li></ul><table><tr><th>Topology</th><th>Cables (links)</th><th>Device દીઠ ports</th><th>કુલ ports</th></tr><tr><td>Bus</td><td>1 backbone + 6 drop lines</td><td>1</td><td>6 × 1 = 6</td></tr><tr><td>Ring</td><td>6</td><td>2</td><td>6 × 2 = 12</td></tr><tr><td>Star</td><td>6 (device to hub)</td><td>1</td><td>6 + 6 (hub) = 12</td></tr><tr><td>Mesh</td><td>6(6-1)/2 = 15</td><td>6-1 = 5</td><td>6 × 5 = 30</td></tr></table><p><b>જવાબ:</b> Bus 6 ports, Ring 12 ports, Star 12 ports (6 devices + 6 hub), Mesh 15 cables અને 30 ports.</p>"}}, {"id": "cn1n2", "q": {"en": "Eight computers are to be connected in a fully connected mesh topology. Find the number of cables, the ports on each computer and the total ports.", "gu": "આઠ computers ને fully connected mesh topology માં જોડવાના છે. Cables ની સંખ્યા, દરેક computer પરના ports અને કુલ ports શોધો."}, "a": {"en": "<p>n = 8</p><p>Cables = n(n-1)/2 = 8×7/2 = <b>28</b></p><p>Ports per computer = n-1 = <b>7</b></p><p>Total ports = n(n-1) = 8×7 = <b>56</b></p>", "gu": "<p>n = 8</p><p>Cables = n(n-1)/2 = 8×7/2 = <b>28</b></p><p>Computer દીઠ ports = n-1 = <b>7</b></p><p>કુલ ports = n(n-1) = 8×7 = <b>56</b></p>"}}, {"id": "cn1n3", "q": {"en": "A fully connected mesh network has 21 links. How many devices are there, and how many ports does each device need?", "gu": "Fully connected mesh network માં 21 links છે. કેટલા devices છે, અને દરેક device ને કેટલા ports જોઈએ?"}, "a": {"en": "<p>n(n-1)/2 = 21 ⇒ n(n-1) = 42 ⇒ n² - n - 42 = 0 ⇒ (n-7)(n+6) = 0</p><p>n = <b>7 devices</b> (n = -6 is not possible)</p><p>Ports per device = n-1 = <b>6</b>; check: 7×6/2 = 21 ✓</p>", "gu": "<p>n(n-1)/2 = 21 ⇒ n(n-1) = 42 ⇒ n² - n - 42 = 0 ⇒ (n-7)(n+6) = 0</p><p>n = <b>7 devices</b> (n = -6 શક્ય નથી)</p><p>Device દીઠ ports = n-1 = <b>6</b>; ચકાસણી: 7×6/2 = 21 ✓</p>"}}, {"id": "cn1n4", "q": {"en": "A lab has 10 computers. Compare the number of cables needed for star and mesh topology. Which is suitable for the lab and why?", "gu": "Lab માં 10 computers છે. Star અને mesh topology માટે જરૂરી cables ની સરખામણી કરો. Lab માટે કઈ યોગ્ય છે અને શા માટે?"}, "a": {"en": "<p>n = 10</p><p><b>Star:</b> cables = n = <b>10</b>; 1 port per computer; hub / switch with at least 10 ports.</p><p><b>Mesh:</b> cables = 10×9/2 = <b>45</b>; 9 ports per computer; total 90 ports.</p><p>Mesh needs 4.5 times more cables and 9 network cards in each PC, which is very costly. <b>Star topology is suitable</b>: cheap, easy to install, and a fault in one cable affects only one computer.</p>", "gu": "<p>n = 10</p><p><b>Star:</b> cables = n = <b>10</b>; computer દીઠ 1 port; ઓછામાં ઓછા 10 ports વાળું hub / switch.</p><p><b>Mesh:</b> cables = 10×9/2 = <b>45</b>; computer દીઠ 9 ports; કુલ 90 ports.</p><p>Mesh ને 4.5 ગણા વધુ cables અને દરેક PC માં 9 network cards જોઈએ, જે ખૂબ ખર્ચાળ છે. <b>Star topology યોગ્ય છે</b>: સસ્તી, install કરવી સહેલી, અને એક cable નો fault માત્ર એક computer ને અસર કરે.</p>"}}, {"id": "cn1n5", "q": {"en": "Find the number of links and ports per device for 5 devices in ring and mesh topology.", "gu": "Ring અને mesh topology માં 5 devices માટે links અને device દીઠ ports શોધો."}, "a": {"en": "<p>n = 5</p><p><b>Ring:</b> links = n = <b>5</b>; ports per device = <b>2</b>; total ports = 10.</p><p><b>Mesh:</b> links = 5×4/2 = <b>10</b>; ports per device = <b>4</b>; total ports = 20.</p>", "gu": "<p>n = 5</p><p><b>Ring:</b> links = n = <b>5</b>; device દીઠ ports = <b>2</b>; કુલ ports = 10.</p><p><b>Mesh:</b> links = 5×4/2 = <b>10</b>; device દીઠ ports = <b>4</b>; કુલ ports = 20.</p>"}}, {"id": "cn1n6", "q": {"en": "In a star network of 24 computers, one 16-port switch is not enough. How many 16-port switches are needed if the switches are connected to each other in a chain (one port of each switch used for each switch-to-switch link)?", "gu": "24 computers ના star network માં એક 16-port switch પૂરતું નથી. Switches એકબીજા સાથે chain માં જોડાય (દરેક switch-to-switch link માટે દરેક switch નો એક port વપરાય) તો કેટલા 16-port switches જોઈએ?"}, "a": {"en": "<p>With 2 switches: 1 link between them uses 1 port on each, so usable ports = 2×16 - 2 = 30 ≥ 24 ✓ (1 switch gives only 16 &lt; 24).</p><p><b>2 switches</b> are needed; cables = 24 (computers) + 1 (switch to switch) = <b>25</b>. This is an extended star (tree).</p>", "gu": "<p>2 switches સાથે: તેમની વચ્ચેની 1 link દરેકનો 1 port વાપરે, તેથી વાપરી શકાય તેવા ports = 2×16 - 2 = 30 ≥ 24 ✓ (1 switch માત્ર 16 &lt; 24 આપે).</p><p><b>2 switches</b> જોઈએ; cables = 24 (computers) + 1 (switch to switch) = <b>25</b>. આ extended star (tree) છે.</p>"}}], "equations": [{"title": {"en": "Topology formulas (n devices)", "gu": "Topology સૂત્રો (n devices)"}, "items": [{"name": {"en": "Mesh: number of links", "gu": "Mesh: links ની સંખ્યા"}, "f": "Links = n(n - 1) / 2", "terms": {"en": "Duplex links; e.g. n = 6 → 15", "gu": "Duplex links; દા.ત. n = 6 → 15"}}, {"name": {"en": "Mesh: ports per device", "gu": "Mesh: device દીઠ ports"}, "f": "Ports per device = n - 1", "terms": {"en": "Each device connects to all others", "gu": "દરેક device બાકી બધા સાથે જોડાય"}}, {"name": {"en": "Mesh: total ports", "gu": "Mesh: કુલ ports"}, "f": "Total ports = n(n - 1)", "terms": {"en": "e.g. n = 6 → 30", "gu": "દા.ત. n = 6 → 30"}}, {"name": {"en": "Star", "gu": "Star"}, "f": "Links = n,  ports/device = 1,  hub ports = n", "terms": {"en": "Total ports = 2n with hub", "gu": "Hub સાથે કુલ ports = 2n"}}, {"name": {"en": "Ring", "gu": "Ring"}, "f": "Links = n,  ports/device = 2,  total = 2n", "terms": {"en": "Each device has two neighbours", "gu": "દરેક device ના બે પડોશી"}}, {"name": {"en": "Bus", "gu": "Bus"}, "f": "1 backbone + n drop lines,  ports/device = 1", "terms": {"en": "Total ports = n; 2 terminators", "gu": "કુલ ports = n; 2 terminators"}}]}], "viva": [{"title": {"en": "Network basics and types", "gu": "Network basics અને પ્રકારો"}, "items": [{"q": {"en": "What is a computer network?", "gu": "Computer network શું છે?"}, "a": {"en": "A collection of interconnected autonomous computers and devices that share data and resources using protocols.", "gu": "Protocols વાપરીને data અને resources વહેંચતા જોડાયેલા સ્વતંત્ર computers અને devices નો સમૂહ."}}, {"q": {"en": "Name the five components of data communication.", "gu": "Data communication ના પાંચ ઘટકો જણાવો."}, "a": {"en": "Message, sender, receiver, transmission medium and protocol.", "gu": "Message, sender, receiver, transmission medium અને protocol."}}, {"q": {"en": "What is a node?", "gu": "Node શું છે?"}, "a": {"en": "Any device connected to a network: computer, printer, router, mobile.", "gu": "Network સાથે જોડાયેલું કોઈ પણ device: computer, printer, router, mobile."}}, {"q": {"en": "Differentiate point-to-point and multipoint connection.", "gu": "Point-to-point અને multipoint connection નો તફાવત આપો."}, "a": {"en": "Point-to-point: dedicated link between two devices. Multipoint: one link shared by more than two devices.", "gu": "Point-to-point: બે devices વચ્ચે dedicated link. Multipoint: બે થી વધુ devices વહેંચતી એક link."}}, {"q": {"en": "Give the range of LAN, MAN and WAN.", "gu": "LAN, MAN અને WAN નો વિસ્તાર આપો."}, "a": {"en": "LAN up to about 1 km (building / campus), MAN 5-50 km (city), WAN country to world.", "gu": "LAN લગભગ 1 km સુધી (building / campus), MAN 5-50 km (શહેર), WAN દેશથી દુનિયા."}}, {"q": {"en": "Which is the largest WAN?", "gu": "સૌથી મોટું WAN કયું છે?"}, "a": {"en": "The Internet.", "gu": "Internet."}}, {"q": {"en": "What is PAN?", "gu": "PAN શું છે?"}, "a": {"en": "Personal Area Network (about 10 m), e.g. a mobile with Bluetooth earbuds.", "gu": "Personal Area Network (લગભગ 10 m), દા.ત. Bluetooth earbuds સાથે mobile."}}, {"q": {"en": "What is an intranet?", "gu": "Intranet શું છે?"}, "a": {"en": "A private network of an organisation using Internet technologies, accessible only to its members.", "gu": "Internet technologies વાપરતું સંસ્થાનું private network, માત્ર તેના સભ્યો વાપરી શકે."}}]}, {"title": {"en": "Topology", "gu": "Topology"}, "items": [{"q": {"en": "What is network topology?", "gu": "Network topology શું છે?"}, "a": {"en": "The geometric arrangement of nodes and links in a network.", "gu": "Network માં nodes અને links ની ભૌમિતિક ગોઠવણી."}}, {"q": {"en": "Why are terminators used in bus topology?", "gu": "Bus topology માં terminators શા માટે વપરાય?"}, "a": {"en": "To absorb the signal at the ends of the backbone and prevent reflection.", "gu": "Backbone ના છેડે signal શોષી reflection અટકાવવા."}}, {"q": {"en": "Which topology is most used in LANs?", "gu": "LANs માં કઈ topology સૌથી વધુ વપરાય?"}, "a": {"en": "Star topology (with a switch).", "gu": "Star topology (switch સાથે)."}}, {"q": {"en": "What happens if the hub fails in star topology?", "gu": "Star topology માં hub બગડે તો શું થાય?"}, "a": {"en": "The whole network stops because all communication passes through the hub.", "gu": "આખું network બંધ થાય કારણ કે બધું communication hub માંથી પસાર થાય."}}, {"q": {"en": "What is a token in ring topology?", "gu": "Ring topology માં token શું છે?"}, "a": {"en": "A special frame circulating in the ring; only the device holding it can transmit.", "gu": "Ring માં ફરતો ખાસ frame; તે ધરાવતું device જ transmit કરી શકે."}}, {"q": {"en": "How many links are needed for 6 devices in mesh?", "gu": "Mesh માં 6 devices માટે કેટલી links જોઈએ?"}, "a": {"en": "n(n-1)/2 = 15 links; 5 ports per device.", "gu": "n(n-1)/2 = 15 links; device દીઠ 5 ports."}}, {"q": {"en": "What is hybrid topology?", "gu": "Hybrid topology શું છે?"}, "a": {"en": "A combination of two or more topologies, e.g. star + bus.", "gu": "બે કે વધુ topologies નું સંયોજન, દા.ત. star + bus."}}]}, {"title": {"en": "Standards, protocols and servers", "gu": "Standards, protocols અને servers"}, "items": [{"q": {"en": "What is a protocol? Give its key elements.", "gu": "Protocol શું છે? તેના મુખ્ય તત્વો આપો."}, "a": {"en": "A set of rules for data communication; key elements: syntax, semantics and timing.", "gu": "Data communication માટેના નિયમોનો સમૂહ; મુખ્ય તત્વો: syntax, semantics અને timing."}}, {"q": {"en": "Give the full forms of IEEE, ISO, ISOC, IETF and IRTF.", "gu": "IEEE, ISO, ISOC, IETF અને IRTF ના full forms આપો."}, "a": {"en": "Institute of Electrical and Electronics Engineers; International Organization for Standardization; Internet Society; Internet Engineering Task Force; Internet Research Task Force.", "gu": "Institute of Electrical and Electronics Engineers; International Organization for Standardization; Internet Society; Internet Engineering Task Force; Internet Research Task Force."}}, {"q": {"en": "What is an RFC?", "gu": "RFC શું છે?"}, "a": {"en": "Request for Comments: a document in which Internet standards are published by the IETF.", "gu": "Request for Comments: IETF દ્વારા Internet standards પ્રકાશિત થતું document."}}, {"q": {"en": "Which IEEE standards are used for Ethernet and Wi-Fi?", "gu": "Ethernet અને Wi-Fi માટે કયા IEEE standards વપરાય?"}, "a": {"en": "IEEE 802.3 for Ethernet and IEEE 802.11 for Wi-Fi.", "gu": "Ethernet માટે IEEE 802.3 અને Wi-Fi માટે IEEE 802.11."}}, {"q": {"en": "Which organisation developed the OSI model?", "gu": "OSI model કઈ સંસ્થાએ બનાવ્યું?"}, "a": {"en": "ISO (International Organization for Standardization).", "gu": "ISO (International Organization for Standardization)."}}, {"q": {"en": "What is a server?", "gu": "Server શું છે?"}, "a": {"en": "A computer or program that provides services to client computers on a network.", "gu": "Network પર client computers ને સેવાઓ આપતું computer કે program."}}, {"q": {"en": "Which protocols does a mail server use?", "gu": "Mail server કયા protocols વાપરે?"}, "a": {"en": "SMTP to send mail; POP3 or IMAP to receive mail.", "gu": "Mail મોકલવા SMTP; મેળવવા POP3 કે IMAP."}}, {"q": {"en": "What is the use of caching in a proxy server?", "gu": "Proxy server માં caching નો ઉપયોગ શું છે?"}, "a": {"en": "Frequently requested pages are stored and served locally, which is faster and saves bandwidth.", "gu": "વારંવાર માંગાતાં pages સંગ્રહાઈ સ્થાનિક રીતે અપાય, જે ઝડપી છે અને bandwidth બચાવે."}}, {"q": {"en": "Name two web server software.", "gu": "બે web server software નાં નામ આપો."}, "a": {"en": "Apache and Nginx (also Microsoft IIS).", "gu": "Apache અને Nginx (Microsoft IIS પણ)."}}]}], "exam_questions": [{"q": {"en": "Define computer network. Explain the need of computer networks.", "gu": "Computer network ની વ્યાખ્યા આપો. Computer networks ની જરૂરિયાત સમજાવો."}, "marks": 3}, {"q": {"en": "Explain the components of data communication with a diagram.", "gu": "આકૃતિ સાથે data communication ના ઘટકો સમજાવો."}, "marks": 3}, {"q": {"en": "List applications of computer networks.", "gu": "Computer networks ના ઉપયોગો જણાવો."}, "marks": 3}, {"q": {"en": "Differentiate point-to-point and multipoint connection.", "gu": "Point-to-point અને multipoint connection નો તફાવત આપો."}, "marks": 3}, {"q": {"en": "Explain LAN with its advantages and disadvantages.", "gu": "LAN તેના ફાયદા અને ગેરફાયદા સાથે સમજાવો."}, "marks": 4}, {"q": {"en": "Explain MAN and WAN with examples.", "gu": "ઉદાહરણો સાથે MAN અને WAN સમજાવો."}, "marks": 4}, {"q": {"en": "Compare LAN, MAN and WAN.", "gu": "LAN, MAN અને WAN ની સરખામણી કરો."}, "marks": 4}, {"q": {"en": "Define network topology. Explain bus topology with its advantages and disadvantages.", "gu": "Network topology ની વ્યાખ્યા આપો. Bus topology તેના ફાયદા અને ગેરફાયદા સાથે સમજાવો."}, "marks": 4}, {"q": {"en": "Explain star and ring topology with diagrams.", "gu": "આકૃતિઓ સાથે star અને ring topology સમજાવો."}, "marks": 7}, {"q": {"en": "Explain mesh topology. Find the number of links and ports for 6 devices.", "gu": "Mesh topology સમજાવો. 6 devices માટે links અને ports શોધો."}, "marks": 4}, {"q": {"en": "Explain tree and hybrid topology.", "gu": "Tree અને hybrid topology સમજાવો."}, "marks": 4}, {"q": {"en": "Explain any four network topologies with diagrams, advantages and disadvantages.", "gu": "કોઈ પણ ચાર network topologies આકૃતિઓ, ફાયદા અને ગેરફાયદા સાથે સમજાવો."}, "marks": 7}, {"q": {"en": "Define protocol. Explain the key elements of a protocol.", "gu": "Protocol ની વ્યાખ્યા આપો. Protocol ના મુખ્ય તત્વો સમજાવો."}, "marks": 3}, {"q": {"en": "Write a short note on standard organisations: IEEE, ISO, ISOC, IETF, IRTF.", "gu": "Standard organisations: IEEE, ISO, ISOC, IETF, IRTF પર ટૂંકનોંધ લખો."}, "marks": 4}, {"q": {"en": "Explain file server, print server and mail server.", "gu": "File server, print server અને mail server સમજાવો."}, "marks": 4}, {"q": {"en": "Explain web server and proxy server with their applications.", "gu": "Web server અને proxy server તેમના ઉપયોગો સાથે સમજાવો."}, "marks": 4}], "tabs": ["notes", "diagrams", "equations", "numericals", "viva", "exam"], "diagrams": [{"id": "cn1_basic", "title": {"en": "Components of Data Communication", "gu": "Data Communication ના ઘટકો"}, "file": "diagrams/cn1_basic.svg"}, {"id": "cn1_conn", "title": {"en": "Point to Point and Multipoint", "gu": "Point to Point અને Multipoint"}, "file": "diagrams/cn1_conn.svg"}, {"id": "cn1_lan", "title": {"e function viva(){
  return U.viva.map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((v,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(v.q)}</span>${chev}</div><div class="a"><p>${t(v.a)}</p></div></div>`).join('') + `</div>`).join('');
}
function exam(){
  return `<div class="sec">${head(L('examhead'),false)}` + U.exam_questions.map((x,i)=>
    `<div class="card"><div class="q" style="cursor:default"><span class="n">${i+1}.</span><span class="t">${t(x.q)}</span><span class="mk">${x.marks} ${L('marks')}</span></div></div>`).join('') + `</div>`;
}
function programs(){
  return `<div class="sec">${head(L('programs'))}` + (U.programs||[]).map((p,i)=>
    `<div class="card"><div class="q hd"><span class="n">${i+1}.</span><span class="t">${t(p.title)}</span>${chev}</div><div class="a pa">${progBody(p)}</div></div>`).join('') + `</div>`;
}
function syntax(key){
  return (U[typeof key==='string'?key:'syntax']||[]).map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><pre class="code sx">${hl(e.f)}</pre></span>${chev}</div>
     <div class="a">${e.terms && t(e.terms) ? fixTables(t(e.terms)) : ''}</div></div>`).join('') + `</div>`).join('');
}
const flowcharts = diagrams;
const algorithms = () => syntax('algorithms');
const ALLV = {notes, programs, diagrams, flowcharts, algorithms, syntax, equations, numericals, viva, exam};
const VIEWS = U.tabs ? Object.fromEntries(U.tabs.map(k=>[k, ALLV[k]])) : U.programs ? (META.code_lang==='python' ? {notes, programs, diagrams, syntax, viva, exam} : {notes, programs, flowcharts, syntax, viva, exam}) : U.numericals ? {notes, diagrams, equations, numericals, viva, exam} : {notes, diagrams, equations, viva, exam};
function render(){
  document.getElementById('title').textContent = `${L('unit')} ${U.unit}: ${t(U.title)}`;
  document.getElementById('sub').textContent = `${t(META.name)} · ${META.code}`;
  document.getElementById('lang').textContent = S.lang==='en' ? 'ગુ' : 'EN';
  document.getElementById('lang').style.display = META.languages.includes('gu') ? '' : 'none';
  document.getElementById('tabs').innerHTML = Object.keys(VIEWS).map(k=>`<button class="tab${S.tab===k?' on':''}" data-tab="${k}">${L(k)}</button>`).join('');
  document.getElementById('view').innerHTML = VIEWS[S.tab]();
  document.querySelectorAll('#view pre.c').forEach(e=>{ e.innerHTML = hl(e.textContent); e.className='code'; });
}
let zoom = 1;
function setZoom(z){ zoom = Math.min(4, Math.max(1, z)); const w=document.getElementById('zw'); w.style.width=(zoom*100)+'%'; document.getElementById('zr').textContent=Math.round(zoom*100)+'%'; }
document.addEventListener('click', e=>{
  const q = e.target.closest('.q'); if (q && q.parentElement.querySelector('.a')) { q.parentElement.classList.toggle('open'); return; }
  const tb = e.target.closest('[data-tab]'); if (tb){ S.tab = tb.dataset.tab; render(); window.scrollTo(0,0); return; }
  if (e.target.closest('#lang')){ S.lang = S.lang==='en'?'gu':'en'; render(); return; }
  const m = e.target.closest('[data-more]');
  document.querySelectorAll('.menu.show').forEach(x=>{ if(!m || x!==m.nextElementSibling) x.classList.remove('show'); });
  if (m){ m.nextElementSibling.classList.toggle('show'); return; }
  const act = e.target.closest('[data-act]');
  if (act){ act.closest('.sec').querySelectorAll('.card').forEach(c=>{ if(c.querySelector('.a')) c.classList.toggle('open', act.dataset.act==='expand'); }); act.parentElement.classList.remove('show'); return; }
  const dg = e.target.closest('[data-dg]');
  if (dg){ const id=dg.dataset.dg; document.getElementById('mt').textContent=t(U.diagrams.find(d=>d.id===id).title); document.getElementById('zw').innerHTML=SVG[id]; setZoom(1); document.getElementById('modal').classList.add('show'); return; }
  if (e.target.closest('#mx')) document.getElementById('modal').classList.remove('show');
  if (e.target.closest('#zi')) setZoom(zoom+0.5);
  if (e.target.closest('#zo')) setZoom(zoom-0.5);
  if (e.target.closest('#zr')) setZoom(1);
});
render();
</script></body></html>
