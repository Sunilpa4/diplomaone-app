e=\"#222222\" stroke-width=\"1.2\"/><circle cx=\"274.0\" cy=\"108.0\" r=\"4.6\" fill=\"#2E3339\" stroke=\"#222222\" stroke-width=\"1.2\"/><circle cx=\"302.0\" cy=\"108.0\" r=\"4.6\" fill=\"#2E3339\" stroke=\"#222222\" stroke-width=\"1.2\"/><text x=\"306\" y=\"139.0\" font-size=\"5.6\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">nodules of graphite</text><text x=\"306\" y=\"148.0\" font-size=\"5.6\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">400 - 600 MPa</text><rect x=\"6.0\" y=\"158.0\" width=\"348.0\" height=\"68.0\" rx=\"5\" fill=\"#F5EEFD\" stroke=\"#7B2CD9\" stroke-width=\"1\"/><text x=\"180.0\" y=\"172.9\" font-size=\"8.2\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">how the graphite got that shape</text><text x=\"180.0\" y=\"186.7\" font-size=\"7.6\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"normal\">grey: slow cooling in a sand mould lets carbon come out as flakes</text><text x=\"180.0\" y=\"198.2\" font-size=\"7.6\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"normal\">white: fast cooling or low silicon keeps carbon in cementite - hard, unmachinable</text><text x=\"180.0\" y=\"209.7\" font-size=\"7.6\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"normal\">malleable: white iron is annealed, the cementite decomposes into temper carbon</text><text x=\"180.0\" y=\"221.2\" font-size=\"7.6\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"normal\">ductile: a little magnesium or cerium is added, so the graphite grows as nodules</text><text x=\"180.0\" y=\"239.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">A flake acts like a crack, so grey iron is weak in tension but excellent in</text><text x=\"180.0\" y=\"251.5\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">compression and damping - machine beds, housings and manhole covers.</text><text x=\"180.0\" y=\"267.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">A nodule does not, so ductile iron reaches 600 MPa with 15 % elongation and</text><text x=\"180.0\" y=\"279.5\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">replaces steel castings: crankshafts, gears, pipe and wagon wheels.</text></svg>", "u3_cu": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 372\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"372\" fill=\"#ffffff\"/><text x=\"180.0\" y=\"24.3\" font-size=\"12.2\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"bold\">Copper and its alloys</text><text x=\"180.0\" y=\"40.2\" font-size=\"9.2\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">strength bought with conductivity</text><text x=\"6\" y=\"68.5\" font-size=\"7.0\" text-anchor=\"start\" fill=\"#222\" font-weight=\"bold\">copper 99.9 %</text><text x=\"6\" y=\"76.0\" font-size=\"5.6\" text-anchor=\"start\" fill=\"#666666\" font-weight=\"normal\">Cu</text><path d=\"M112.0 55.0L185.3 55.0L185.3 67.0L112.0 67.0Z\" fill=\"#F7C88A\" stroke=\"#B66A00\" stroke-width=\"0.8\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"189.33333333333331\" y=\"67.2\" font-size=\"6.4\" text-anchor=\"start\" fill=\"#222222\" font-weight=\"normal\">220 MPa</text><text x=\"352\" y=\"67.2\" font-size=\"6.2\" text-anchor=\"end\" fill=\"#1565C0\" font-weight=\"normal\">100 % IACS</text><text x=\"6\" y=\"102.5\" font-size=\"7.0\" text-anchor=\"start\" fill=\"#222\" font-weight=\"bold\">brass 70/30</text><text x=\"6\" y=\"110.0\" font-size=\"5.6\" text-anchor=\"start\" fill=\"#666666\" font-weight=\"normal\">Cu 70, Zn 30</text><path d=\"M112.0 89.0L228.7 89.0L228.7 101.0L112.0 101.0Z\" fill=\"#F7C88A\" stroke=\"#B66A00\" stroke-width=\"0.8\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"232.66666666666669\" y=\"101.2\" font-size=\"6.4\" text-anchor=\"start\" fill=\"#222222\" font-weight=\"normal\">350 MPa</text><text x=\"352\" y=\"101.2\" font-size=\"6.2\" text-anchor=\"end\" fill=\"#1565C0\" font-weight=\"normal\">28 % IACS</text><text x=\"6\" y=\"136.4\" font-size=\"7.0\" text-anchor=\"start\" fill=\"#222\" font-weight=\"bold\">brass 60/40</text><text x=\"6\" y=\"144.0\" font-size=\"5.6\" text-anchor=\"start\" fill=\"#666666\" font-weight=\"normal\">Cu 60, Zn 40</text><path d=\"M112.0 123.0L252.0 123.0L252.0 135.0L112.0 135.0Z\" fill=\"#F7C88A\" stroke=\"#B66A00\" stroke-width=\"0.8\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"256.0\" y=\"135.2\" font-size=\"6.4\" text-anchor=\"start\" fill=\"#222222\" font-weight=\"normal\">420 MPa</text><text x=\"352\" y=\"135.2\" font-size=\"6.2\" text-anchor=\"end\" fill=\"#1565C0\" font-weight=\"normal\">26 % IACS</text><text x=\"6\" y=\"170.4\" font-size=\"7.0\" text-anchor=\"start\" fill=\"#222\" font-weight=\"bold\">bronze</text><text x=\"6\" y=\"178.0\" font-size=\"5.6\" text-anchor=\"start\" fill=\"#666666\" font-weight=\"normal\">Cu 90, Sn 10</text><path d=\"M112.0 157.0L218.7 157.0L218.7 169.0L112.0 169.0Z\" fill=\"#F7C88A\" stroke=\"#B66A00\" stroke-width=\"0.8\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"222.66666666666669\" y=\"169.2\" font-size=\"6.4\" text-anchor=\"start\" fill=\"#222222\" font-weight=\"normal\">320 MPa</text><text x=\"352\" y=\"169.2\" font-size=\"6.2\" text-anchor=\"end\" fill=\"#1565C0\" font-weight=\"normal\">13 % IACS</text><text x=\"6\" y=\"204.4\" font-size=\"7.0\" text-anchor=\"start\" fill=\"#222\" font-weight=\"bold\">gunmetal</text><text x=\"6\" y=\"212.0\" font-size=\"5.6\" text-anchor=\"start\" fill=\"#666666\" font-weight=\"normal\">Cu 88, Sn 10, Zn 2</text><path d=\"M112.0 191.0L205.3 191.0L205.3 203.0L112.0 203.0Z\" fill=\"#F7C88A\" stroke=\"#B66A00\" stroke-width=\"0.8\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"209.33333333333331\" y=\"203.2\" font-size=\"6.4\" text-anchor=\"start\" fill=\"#222222\" font-weight=\"normal\">280 MPa</text><text x=\"352\" y=\"203.2\" font-size=\"6.2\" text-anchor=\"end\" fill=\"#1565C0\" font-weight=\"normal\">12 % IACS</text><path d=\"M6.0 232.0L352.0 232.0\" fill=\"none\" stroke=\"#9AA3AD\" stroke-width=\"0.8\" stroke-linecap=\"round\"/><text x=\"6\" y=\"246.2\" font-size=\"6.2\" text-anchor=\"start\" fill=\"#666666\" font-weight=\"normal\">bar length = tensile strength;  the figure on the right is electrical</text><text x=\"6\" y=\"256.2\" font-size=\"6.2\" text-anchor=\"start\" fill=\"#666666\" font-weight=\"normal\">conductivity as % of the international annealed copper standard.</text><rect x=\"6.0\" y=\"260.0\" width=\"348.0\" height=\"68.0\" rx=\"5\" fill=\"#F5EEFD\" stroke=\"#7B2CD9\" stroke-width=\"1\"/><text x=\"180.0\" y=\"274.9\" font-size=\"8.2\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">which one to pick</text><text x=\"180.0\" y=\"288.7\" font-size=\"7.6\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"normal\">copper: busbars, windings, electrodes - conductivity first, strength second</text><text x=\"180.0\" y=\"300.2\" font-size=\"7.6\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"normal\">brass 70/30: deep drawing, cartridge cases, radiator fins - ductile and pretty</text><text x=\"180.0\" y=\"311.7\" font-size=\"7.6\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"normal\">brass 60/40: hot stamping, screws, free-cutting rod on a capstan lathe</text><text x=\"180.0\" y=\"323.2\" font-size=\"7.6\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"normal\">bronze and gunmetal: bearings, worm wheels, pump bodies, bells - wear and sea water</text><text x=\"180.0\" y=\"339.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">Adding zinc raises strength but destroys conductivity, because the dissolved</text><text x=\"180.0\" y=\"351.5\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">atoms scatter the free electrons; that trade-off decides every copper-alloy choice.</text></svg>", "u3_desig": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 302\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"302\" fill=\"#ffffff\"/><text x=\"180.0\" y=\"24.3\" font-size=\"12.2\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"bold\">Steels a workshop actually orders</text><text x=\"180.0\" y=\"40.2\" font-size=\"9.2\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">Indian designation, carbon and use</text><path d=\"M6.0 48.0L174.0 48.0L174.0 73.0L6.0 73.0Z\" fill=\"#FBFCFD\" stroke=\"#9AA3AD\" stroke-width=\"0.8\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"12\" y=\"60.5\" font-size=\"7.0\" text-anchor=\"start\" fill=\"#222\" font-weight=\"bold\">C10 / EN32</text><text x=\"12\" y=\"70.1\" font-size=\"6.0\" text-anchor=\"start\" fill=\"#666666\" font-weight=\"normal\">0.10 % C   sheet, wire, nails</text><path d=\"M182.0 48.0L350.0 48.0L350.0 73.0L182.0 73.0Z\" fill=\"#FBFCFD\" stroke=\"#9AA3AD\" stroke-width=\"0.8\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"188\" y=\"60.5\" font-size=\"7.0\" text-anchor=\"start\" fill=\"#222\" font-weight=\"bold\">C20 / EN3B</text><text x=\"188\" y=\"70.1\" font-size=\"6.0\" text-anchor=\"start\" fill=\"#666666\" font-weight=\"normal\">0.20 % C   shafts, studs</text><path d=\"M6.0 78.0L174.0 78.0L174.0 103.0L6.0 103.0Z\" fill=\"#F4F7FA\" stroke=\"#9AA3AD\" stroke-width=\"0.8\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"12\" y=\"90.5\" font-size=\"7.0\" text-anchor=\"start\" fill=\"#222\" font-weight=\"bold\">C40 / EN8</text><text x=\"12\" y=\"100.1\" font-size=\"6.0\" text-anchor=\"start\" fill=\"#666666\" font-weight=\"normal\">0.40 % C   axles, gears</text><path d=\"M182.0 78.0L350.0 78.0L350.0 103.0L182.0 103.0Z\" fill=\"#F4F7FA\" stroke=\"#9AA3AD\" stroke-width=\"0.8\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"188\" y=\"90.5\" font-size=\"7.0\" text-anchor=  does the special work.</text></svg>", "u3_al": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 330\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"330\" fill=\"#ffffff\"/><text x=\"180.0\" y=\"24.3\" font-size=\"12.2\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"bold\">Aluminium: the eight series and what they are for</text><text x=\"180.0\" y=\"40.2\" font-size=\"9.2\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">wrought alloys, 1xxx to 8xxx</text><path d=\"M6.0 48.0L174.0 48.0L174.0 74.0L6.0 74.0Z\" fill=\"#FFF8EF\" stroke=\"#B66A00\" stroke-width=\"0.7\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"12\" y=\"61.7\" font-size=\"7.6\" text-anchor=\"start\" fill=\"#B66A00\" font-weight=\"bold\">1xxx</text><text x=\"40\" y=\"61.3\" font-size=\"6.6\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">99 % Al</text><text x=\"40\" y=\"71.0\" font-size=\"5.8\" text-anchor=\"start\" fill=\"#666666\" font-weight=\"normal\">foil, busbar</text><path d=\"M114.0 63.0L123.9 63.0L123.9 69.0L114.0 69.0Z\" fill=\"#C9DCF2\" stroke=\"#1565C0\" stroke-width=\"0.6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><path d=\"M182.0 48.0L350.0 48.0L350.0 74.0L182.0 74.0Z\" fill=\"#FFF8EF\" stroke=\"#B66A00\" stroke-width=\"0.7\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"188\" y=\"61.7\" font-size=\"7.6\" text-anchor=\"start\" fill=\"#B66A00\" font-weight=\"bold\">2xxx</text><text x=\"216\" y=\"61.3\" font-size=\"6.6\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">Cu</text><text x=\"216\" y=\"71.0\" font-size=\"5.8\" text-anchor=\"start\" fill=\"#666666\" font-weight=\"normal\">aircraft skin</text><path d=\"M290.0 63.0L332.3 63.0L332.3 69.0L290.0 69.0Z\" fill=\"#C9DCF2\" stroke=\"#1565C0\" stroke-width=\"0.6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><path d=\"M6.0 78.0L174.0 78.0L174.0 104.0L6.0 104.0Z\" fill=\"#FFF8EF\" stroke=\"#B66A00\" stroke-w       if (it.h) {
        h += `<div class="card${it.key?' key':''}${open}"><div class="q hd"><span class="t">${it.key?'⭐ ':''}${t(it.h)}</span>${chev}</div>
        <div class="a rn" style="padding-left:18px">${fixTables(t(it.body)).replace(/margin:0 0 10px -36px/g,'')}${it.diagram?dgInline(it.diagram):''}${(it.examples||[]).map(exBox).join('')}${(it.programs||[]).map(pBox).join('')}</div></div>`;
      } else {
        h += `<div class="card${open}"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(it.q)}</span>${chev}</div>
        <div class="a">${fixTables(t(it.a))}${it.diagram?dgInline(it.diagram):''}</div></div>`;
      }
    });
    h += `</div>`;
  });
  return h;
}
function numericals(){
  return `<div class="sec">${head(L('numericals'))}` + (U.numericals||[]).map((n,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(n.q)}</span>${chev}</div><div class="a">${fixTables(t(n.a))}</div></div>`).join('') + `</div>`;
}
function diagrams(){
  return `<div class="sec">${head(L((U.tabs ? U.tabs.includes('flowcharts')&&!U.tabs.includes('diagrams') : U.programs&&META.code_lang!=='python')?'flowcharts':'diagrams'),false)}<div style="height:10px"></div>` + U.diagrams.map((d,i)=>
    `<div class="dcard" data-dg="${d.id}"><div class="h">${i+1}. ${t(d.title)}</div>${SVG[d.id]}</div>`).join('') + `</div>`;
}
function equations(){
  return U.equations.map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><span class="fbox">${e.f}</span></span>${chev}</div>
     <div class="a"><p>${t(e.terms)}</p></div></div>`).join('') + `</div>`).join('');
}
function viva(){
  // two shapes exist in the corpus: flat [{q,a}] and grouped [{title, items:[{q,a}]}]
  const groups = U.viva.every(v=>v && v.q) ? [{items: U.viva}] : U.viva;
  return groups.map(g=>{
    const items = g.items || [];
    return `<div class="sec">${g.title?head(t(g.title)):''}` + items.map((v,i)=>
      `<div class="card"><div class="q hd"><span class="n">${i+1}.</span><span class="t">${t(v.q)}</span>${chev}</div><div class="a"><p>${t(v.a)}</p></div></div>`).join('') + `</div>`;
  }).join('');
}
function exam(){
  return `<div class="sec">${head(L('examhead'),false)}` + U.exam_questions.map((x,i)=>
    `<div class="card"><div class="q" style="cursor:default"><span class="n">${i+1}.</span><span class="t">${t(x.q)}</span><span class="mk">${x.marks} ${L('marks')}</span></div></div>`).join('') + `</div>`;
}
function programs(){
  return `<div class="sec">${head(L('programs'))}` + (U.programs||[]).map((p,i)=>
    `<div class="card"><div class="q hd"><span class="n">${i+1}.</span><span class="t">${t(p.title)}</span>${chev}</div><div class="a pa">${progBody(p)}</div></div>`).join('') + `</div>`;
}
function syntax(key){
  return (U[typeof key==='string'?key:'syntax']||[]).map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><pre class="code sx">${hl(e.f)}</pre></span>${chev}</div>
     <div class="a">${e.terms && t(e.terms) ? fixTables(t(e.terms)) : ''}</div></div>`).join('') + `</div>`).join('');
}
const flowcharts = diagrams;
const algorithms = () => syntax('algorithms');
const ALLV = {notes, programs, diagrams, flowcharts, algorithms, syntax, equations, numericals, viva, exam};
const VIEWS = U.tabs ? Object.fromEntries(U.tabs.map(k=>[k, ALLV[k]])) : U.programs ? (META.code_lang==='python' ? {notes, programs, diagrams, syntax, viva, exam} : {notes, programs, flowcharts, syntax, viva, exam}) : U.numericals ? {notes, diagrams, equations, numericals, viva, exam} : {notes, diagrams, equations, viva, exam};
function render(){
  document.getElementById('title').textContent = `${L('unit')} ${U.unit}: ${t(U.title)}`;
  document.getElementById('sub').textContent = `${t(META.name)} · ${META.code}`;
  document.getElementById('lang').textContent = S.lang==='en' ? 'ગુ' : 'EN';
  document.getElementById('lang').style.display = META.languages.includes('gu') ? '' : 'none';
  document.getElementById('tabs').innerHTML = Object.keys(VIEWS).map(k=>`<button class="tab${S.tab===k?' on':''}" data-tab="${k}">${L(k)}</button>`).join('');
  document.getElementById('view').innerHTML = VIEWS[S.tab]();
  document.querySelectorAll('#view pre.c').forEach(e=>{ e.innerHTML = hl(e.textContent); e.className='code'; });
}
let zoom = 1;
function setZoom(z){ zoom = Math.min(4, Math.max(1, z)); const w=document.getElementById('zw'); w.style.width=(zoom*100)+'%'; document.getElementById('zr').textContent=Math.round(zoom*100)+'%'; }
document.addEventListener('click', e=>{
  const q = e.target.closest('.q'); if (q && q.parentElement.querySelector('.a')) { q.parentElement.classList.toggle('open'); return; }
  const tb = e.target.closest('[data-tab]'); if (tb){ S.tab = tb.dataset.tab; render(); window.scrollTo(0,0); return; }
  if (e.target.closest('#lang')){ S.lang = S.lang==='en'?'gu':'en'; render(); return; }
  const m = e.target.closest('[data-more]');
  document.querySelectorAll('.menu.show').forEach(x=>{ if(!m || x!==m.nextElementSibling) x.classList.remove('show'); });
  if (m){ m.nextElementSibling.classList.toggle('show'); return; }
  const act = e.target.closest('[data-act]');
  if (act){ act.closest('.sec').querySelectorAll('.card').forEach(c=>{ if(c.querySelector('.a')) c.classList.toggle('open', act.dataset.act==='expand'); }); act.parentElement.classList.remove('show'); return; }
  const dg = e.target.closest('[data-dg]');
  if (dg){ const id=dg.dataset.dg; document.getElementById('mt').textContent=t(U.diagrams.find(d=>d.id===id).title); document.getElementById('zw').innerHTML=SVG[id]; setZoom(1); document.getElementById('modal').classList.add('show'); return; }
  if (e.target.closest('#mx')) document.getElementById('modal').classList.remove('show');
  if (e.target.closest('#zi')) setZoom(zoom+0.5);
  if (e.target.closest('#zo')) setZoom(zoom-0.5);
  if (e.target.closest('#zr')) setZoom(1);
});
render();
</script></body></html>
