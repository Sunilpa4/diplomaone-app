.kw{color:#C792EA;font-weight:700}.ty{color:#82AAFF}.st{color:#C3E88D}.cm{color:#8E9AAF;font-style:italic}.pp{color:#F78C6C}.nu{color:#F9C46B}.fn{color:#FFCB6B}

<script>
const U = {"subject": "DI01000181", "unit": 3, "format": "notes", "title": {"en": "Metals and Its Alloys", "gu": "ધાતુઓ અને તેમના એલોય"}, "hours": 8, "weightage": 17, "theory_marks": 12, "official": true, "languages": ["en", "gu"], "tabs": ["notes", "diagrams", "equations", "viva", "exam"], "intro_text": {"en": "Unit 3 of Engineering Materials Science: the two branches of engineering metals, the carbon content that separates steel from cast iron, what each family of steel is ordered for, the four cast irons whose graphite shape decides their strength, and the copper and aluminium alloys that carry the current, save the weight and resist the sea. Every composition and strength quoted here is a handbook value, the designations are the ones used on an Indian drawing, and six solved numericals follow in section 3.6.", "gu": "Engineering Materials Science નું Unit 3: ઇજનેરી ધાતુઓની બે શાખા, steel અને cast iron ને વહેંચતું carbon content, સ્ટીલનું દરેક કુટુંબ શેના માટે ઓર્ડર થાય, જેનો graphite આકાર તાકાત નક્કી કરે તે ચાર cast irons, અને current વહન કરતા, વજન બચાવતા તથી દરિયા સામે ટકતા copper તથી aluminium alloys. અહીંનું દરેક composition અને strength handbook નું મૂલ્ય છે, designations ભારતીય drawing પર વપરાતા છે, અને વિભાગ 3.6 માં છ ઉકેલેલા દાખલા છે."}, "notes": [{"title": {"en": "3.1 Classification of metals, and metals against non-metals", "gu": "3.1 Metals નું વર્ગીકરણ, અને metals સામે non-metals"}, "items": [{"h": {"en": "Two branches, and the carbon content that splits the first one", "gu": "બે શાખા, અને પહેલીને વહેંચતું carbon content"}, "body": {"en": "<p>Engineering metals are either <b>ferrous</b> - based on iron - or <b>non-ferrous</b>, based on some other metal. The ferrous branch splits at one number: <b>2.14 % carbon</b>, the most that austenite can dissolve. Below it the material is <b>steel</b>, which can be rolled, forged and welded; above it the material is <b>cast iron</b>, which is poured into a mould and cannot be rolled because the eutectic at 4.3 % carbon makes it too brittle. Steel itself is described in two ways - by its carbon content (plain carbon steels) or by the element added to give it a property it did not have (alloy steels).</p><table><tr><th>Family</th><th>Carbon</th><th>What it is for</th><th>Examples</th></tr><tr><td>Low carbon steel</td><td>up to 0.30 %</td><td>formable and weldable, cheap</td><td>C10, C20, EN32</td></tr><tr><td>Medium carbon steel</td><td>0.30 - 0.60 %</td><td>hardenable, good strength</td><td>C40, C45, EN8, EN9</td></tr><tr><td>High carbon steel</td><td>0.60 - 2.14 %</td><td>springs, tools, wear</td><td>C80, EN42, EN31</td></tr><tr><td>Alloy steel</td><td>any, plus Cr, Ni, Mo, V</td><td>corrosion, toughness, hardenability</td><td>SS 304, EN19, HSS M2</td></tr><tr><td>Cast iron</td><td>2.14 - 6.67 %</td><td>castings, damping, compression</td><td>grey, white, ductile CI</td></tr><tr><td>Copper alloys</td><td>nil</td><td>conduction, bearing, sea water</td><td>brass, bronze, gunmetal</td></tr><tr><td>Aluminium alloys</td><td>nil</td><td>weight saving, corrosion</td><td>6061-T6, 7075, LM6</td></tr></table><div class=\"math\">steel vs cast iron:  2.14 % C is the boundary\nplain carbon steel classification:  low <= 0.30,  medium 0.30-0.60,  high 0.60-2.14\ncast iron:  eutectic at 4.3 % C, so most cast irons sit at 3.0 - 3.8 % C\n\ndensity: steel 7.85, cast iron 7.2, copper 8.96, aluminium 2.70 g/cm3</div><p><b>Why it is true.</b> Everything in the ferrous branch follows from the iron-carbon diagram of Unit 2. Up to 2.14 % the carbon can hide inside austenite, so the metal can be deformed hot and becomes steel; beyond that the excess carbon has to appear as cementite at the grain boundaries, which is what makes white cast iron hard and unmachinable.</p>", "gu": "<p>ઇજનેરી ધાતુઓ <b>ferrous</b> - લોખંડ પર આધારિત - અથવા <b>non-ferrous</b> હોય છે, જે બીજી કોઈ ધાતુ પર આધારિત હોય. Ferrous શાખા એક જ આંકડા પર વહેંચાય છે: <b>2.14 % carbon</b>, જેટલું austenite ઓગાળી શકે તે વધુમાં વધુ. તેની નીચે સામગ્રી <b>steel</b> છે, જે roll, forge અને weld કરી શકાય; તેની ઉપર <b>cast iron</b> છે, જે mould માં રેડાય છે અને roll થઈ શકતું નથી કારણ કે 4.3 % carbon પરનું eutectic તેને ખૂબ ભંગુર કરે છે. સ્ટીલને બે રીતે વર્ણવાય છે - તેના carbon content થી (plain carbon steels) અથવા જે element ઉમેરાય તે થી (alloy steels).</p><table><tr><th>કુટુંબ</th><th>Carbon</th><th>શેના માટે</th><th>ઉદાહરણ</th></tr><tr><td>Low carbon steel</td><td>0.30 % સુધી</td><td>formable, weldable, સસ્તું</td><td>C10, C20, EN32</td></tr><tr><td>Medium carbon steel</td><td>0.30 - 0.60 %</td><td>hardenable, સારી તાકાત</td><td>C40, C45, EN8, EN9</td></tr><tr><td>High carbon steel</td><td>0.60 - 2.14 %</td><td>સ્પ્રિંગ, tools, wear</td><td>C80, EN42, EN31</td></tr><tr><td>Alloy steel</td><td>કોઈ પણ, સાથે Cr, Ni, Mo, V</td><td>કાટ, toughness, hardenability</td><td>SS 304, EN19, HSS M2 (સ્ટેનલેસ, ટૂલ સ્ટીલ)</td></tr><tr><td>Cast iron</td><td>2.14 - 6.67 %</td><td>castings, damping, compression (કંપન શોષણ)</td><td>grey, white, ductile CI (ભૂખરું, સફેદ)</td></tr><tr><td>Copper alloys</td><td>કંઈ નહીં</td><td>વહન, bearing, દરિયાનું પાણી</td><td>પિત્તળ, bronze, gunmetal</td></tr><tr><td>Aluminium alloys</td><td>કંઈ નહીં</td><td>વજન બચત, corrosion</td><td>6061-T6, 7075, LM6</td></tr></table><div class=\"math\">steel vs cast iron:  2.14 % C is the boundary\nplain carbon steel classification:  low <= 0.30,  medium 0.30-0.60,  high 0.60-2.14\ncast iron:  eutectic at 4.3 % C, so most cast irons sit at 3.0 - 3.8 % C\n\ndensity: steel 7.85, cast iron 7.2, copper 8.96, aluminium 2.70 g/cm3</div><p><b>કેમ સાચું છે.</b> Ferrous શાખાનું બધું Unit 2 ના iron-carbon diagram પરથી આવે. 2.14 % સુધી carbon austenite માં સંતાઈ શકે, તેથી ધાતુ ગરમ કરીને deform કરી શકાય અને steel બને; તેનાથી ઉપર વધારાનો carbon grain boundary પર cementite સ્વરૂપે આવવો પડે, અને તેથી જ white cast iron સખત અને unmachinable બને.</p>"}, "diagram": "u3_tree"}, {"h": {"en": "Metals and non-metals: one test settles it", "gu": "Metals અને non-metals: એક જ કસોટી નક્કી કરે"}, "body": {"en": "<p>A metal has <b>free electrons</b> that belong to the whole crystal instead of to a particular pair of atoms. Every other difference in the comparison below follows from that one: free electrons carry current and heat, reflect light (lustre), and allow layers of atoms to slide without breaking the bond, which is ductility. A non-metal holds its electrons in fixed bonds, so it insulates, looks dull and cracks instead of bending. Silicon and germanium sit between the two and are called <b>metalloids</b>.</p><table><tr><th>Property</th><th>Metal</th><th>Non-metal</th></tr><tr><td>Electrons</td><td>free, shared by the crystal</td><td>held in fixed bonds</td></tr><tr><td>Conduction</td><td>heat and current: copper 385 W/m K</td><td>insulator; graphite and Si are exceptions</td></tr><tr><td>Deformation</td><td>malleable and ductile</td><td>brittle - it cracks</td></tr><tr><td>Lustre</td><td>shiny, reflects light</td><td>dull</td></tr><tr><td>Melting point</td><td>usually high, 660 C to 3400 C</td><td>low (sulphur 115 C) or very high (diamond 3550 C)</td></tr><tr><td>Density</td><td>2.7 to 19 g/cm3</td><td>under 5 g/cm3</td></tr><tr><td>Oxides</td><td>basic: Na2O, FeO, they react with acid</td><td>acidic: CO2, SiO2, they react with alkali</td></tr></table><div class=\"math\">sigma(copper) = 5.8e7 S/m      sigma(glass) = 1e-12 S/m\n5.8e7 / 1e-12 = 5.8e19 -> nineteen orders of magnitude\none free electron per atom is the whole difference</div><p><b>Common mistake.</b> Do not write 'metals are hard'. Lead is a metal and is softer than your thumb; diamond is a non-metal and scratches everything. Hardness is not the test - free electrons are.</p>", "gu": "<p>ધાતુમાં <b>free electrons</b> હોય છે જે કોઈ એક જોડીના atoms ના નહીં પણ આખા crystal ના હોય. નીચેની સરખામણીનો બાકીનો દરેક ફરક એક જ વાત પરથી આવે: free electrons current અને ગરમી વહન કરે, પ્રકાશ પાછો ઝીલે (lustre), અને atoms ના સ્તરો bond તોડ્યા વગર સરકી શકે - એ જ ductility. Non-metal પોતાના electrons નિશ્ચિત bonds માં રાખે, તેથી તે અવાહક, ઝાંખું અને વળવાને બદલે તૂટે છે. Silicon અને germanium વચ્ચે બેસે છે અને તેમને <b>metalloids</b> કહે છે.</p><table><tr><th>ગુણધર્મ</th><th>Metal</th><th>Non-metal</th></tr><tr><td>Electrons</td><td>મુક્ત, crystal આખાના</td><td>નિશ્ચિત bonds માં</td></tr><tr><td>વાહકતા</td><td>ગરમી અને current: copper 385 W/m K</td><td>અવાહક; graphite અને Si અપવાદ</td></tr><tr><td>Deformation</td><td>malleable અને ductile</td><td>ભંગુર - તૂટે</td></tr><tr><td>Lustre</td><td>ચળકતું, પ્રકાશ પાછો ઝીલે</td><td>ઝાંખું</td></tr><tr><td>ગલનબિંદુ</td><td>સામાન્ય રીતે ઊંચું, 660 C થી 3400 C</td><td>નીચું (sulphur 115 C) કે ખૂબ ઊંચું (diamond 3550 C)</td></tr><tr><td>Density</td><td>2.7 થી 19 g/cm3</td><td>5 g/cm3 ની નીચે</td></tr><tr><td>Oxides</td><td>basic: Na2O, FeO, એસિડ સાથે react કરે</td><td>acidic: CO2, SiO2, આલ્કલી સાથે react કરે</td></tr></table><div class=\"math\">sigma(copper) = 5.8e7 S/m      sigma(glass) = 1e-12 S/m\n5.8e7 / 1e-12 = 5.8e19 -> nineteen orders of magnitude\none free electron per atom is the whole difference</div><p><b>સામાન્ય ભૂલ.</b> 'Metals સખત હોય' એવું ન લખો. Lead ધાતુ છે અને અંગૂઠા કરતાં નરમ છે; diamond અધાતુ છે અને બધું ખૂંચે છે. Hardness કસોટી નથી - free electrons છે.</p>"}, "diagram": "u3_compare"}]}, {"title": {"en": "3.2 Steels: plain carbon, alloy, and how they are ordered", "gu": "3.2 Steels: plain carbon, alloy, અને તે કેવી રીતે ઓર્ડર થાય"}, "items": [{"h": {"en": "Plain carbon steels: what carbon buys and what it costs", "gu": "Plain carbon steels: carbon શું આપે અને શું લે"}, "body": {"en": "<p>A plain carbon steel is iron with carbon and nothing else that matters - manganese up to 0.8 % for deoxidation and sulphur and phosphorus kept low. Everything about it follows from the volume fraction of pearlite, and that follows from the carbon content. More carbon means more cementite, so the steel gets stronger and harder and less ductile and less weldable. The strength roughly doubles between 0.1 % and 1.2 % carbon while the elongation falls from 30 % to 5 %, which is why the useful engineering steels sit between 0.2 % and 0.5 %.</p><table><tr><th>Steel</th><th>C %</th><th>UTS (MPa)</th><th>Elongation</th><th>Hardness</th><th>Typical use</th></tr><tr><td>Dead mild</td><td>0.10</td><td>400</td><td>30 %</td><td>110 HB</td><td>sheet, wire, nails, car body</td></tr><tr><td>Mild</td><td>0.20</td><td>450</td><td>27 %</td><td>130 HB</td><td>structurals, studs, chain</td></tr><tr><td>Medium</td><td>0.40</td><td>600</td><td>20 %</td><td>170 HB</td><td>shafts, axles, gears, keys</td></tr><tr><td>Eutectoid</td><td>0.80</td><td>800</td><td>10 %</td><td>230 HB</td><td>springs, piano wire, saws</td></tr><tr><td>Hypereutectoid</td><td>1.20</td><td>900</td><td>5 %</td><td>285 HB</td><td>files, razors, dies, balls</td></tr></table><div class=\"math\">pearlite % = (C - 0.02)/0.78 x 100       every +0.10 % C adds 12.8 % pearlite\n\n0.2 % C -> 23 % pearlite       0.4 % C -> 49 % pearlite\n0.8 % C -> 100 % pearlite      1.2 % C -> 100 % pearlite + 6.8 % cementite\n\nso 'more carbon' means 'more cementite in the mixture', not a different metal</div><p><b>Check your answer.</b> Read the table across, not down: every row trades strength for elongation. A question that asks for 'the strongest steel' is incomplete until it says for what - a file wants 1.2 % and a car body wants 0.1 %.</p>", "gu": "<p>Plain carbon steel એ iron સાથે carbon છે અને બીજું કંઈ નહીં - deoxidation માટે 0.8 % સુધી manganese અને sulphur તથા phosphorus ઓછા રખાય. તેનું બધું pearlite ના volume fraction પરથી આવે, અને એ carbon content પરથી આવે. વધુ carbon એટલે વધુ cementite, તેથી સ્ટીલ વધુ મજબૂત અને સખત પણ ઓછું ductile અને ઓછું weldable બને. 0.1 % થી 1.2 % carbon વચ્ચે તાકાત લગભગ બમણી થાય જ્યારે elongation 30 % થી 5 % થાય, તેથી ઉપયોગી ઇજનેરી સ્ટીલ 0.2 % થી 0.5 % વચ્ચે બેસે છે.</p><table><tr><th>સ્ટીલ</th><th>C %</th><th>UTS (MPa)</th><th>Elongation</th><th>Hardness</th><th>સામાન્ય ઉપયોગ</th></tr><tr><td>Dead mild</td><td>0.10</td><td>400</td><td>30 %</td><td>110 HB</td><td>sheet, wire, nails, car body (ચાદર, તાર, ખીલા)</td></tr><tr><td>Mild</td><td>0.20</td><td>450</td><td>27 %</td><td>130 HB</td><td>structurals, studs, chain (બાંધકામ, ચેઇન)</td></tr><tr><td>Medium</td><td>0.40</td><td>600</td><td>20 %</td><td>170 HB</td><td>shafts, axles, gears, keys (ધરી, ગિયર)</td></tr><tr><td>Eutectoid</td><td>0.80</td><td>800</td><td>10 %</td><td>230 HB</td><td>સ્પ્રિંગ, piano wire, saws</td></tr><tr><td>Hypereutectoid</td><td>1.20</td><td>900</td><td>5 %</td><td>285 HB</td><td>files, razors, dies, balls (પાની, બેરિંગ)</td></tr></table><div class=\"math\">pearlite % = (C - 0.02)/0.78 x 100       every +0.10 % C adds 12.8 % pearlite\n\n0.2 % C -> 23 % pearlite       0.4 % C -> 49 % pearlite\n0.8 % C -> 100 % pearlite      1.2 % C -> 100 % pearlite + 6.8 % cementite\n\nso 'more carbon' means 'more cementite in the mixture', not a different metal</div><p><b>જવાબ ચકાસો.</b> કોષ્ટક આડું વાંચો, ઊભું નહીં: દરેક લાઈન તાકાત સામે elongation નો સોદો કરે. 'સૌથી મજબૂત સ્ટીલ' પૂછે તો શેના માટે તે કહ્યા વગર અધૂરું છે - file ને 1.2 % અને car body ને 0.1 % જોઈએ.</p>"}, "diagram": "u3_carbon"}, {"h": {"en": "Alloy steels, stainless steel and how a designation is read", "gu": "Alloy steels, stainless steel અને designation કેવી રીતે વાંચવું"}, "body": {"en": "<p>Carbon alone cannot give a thick section that hardens all the way through, nor a surface that resists rust, nor a steel that stays tough at 500 C. An <b>alloy steel</b> adds one or more elements to buy exactly those properties: <b>chromium</b> above 12 % forms a passive oxide film (stainless), <b>nickel</b> raises toughness and makes the austenite stable at room temperature (18/8), <b>molybdenum</b> raises hardenability and high-temperature strength, <b>vanadium</b> and <b>tungsten</b> keep the hardness at red heat (tool steels), and small amounts of <b>niobium</b> or <b>titanium</b> give the fine-grain high-strength low-alloy steels used in pipelines.</p><table><tr><th>Steel</th><th>Main elements</th><th>Property it buys</th><th>Where it is used</th></tr><tr><td>SS 304</td><td>18 Cr, 8 Ni, 0.08 C</td><td>corrosion resistance, weldable</td><td>kitchen, dairy, architecture</td></tr><tr><td>SS 316</td><td>16 Cr, 10 Ni, 2 Mo</td><td>resists chlorides and sea water</td><td>chemical plant, marine, surgical</td></tr><tr><td>SS 410</td><td>12 Cr, 0.15 C, no Ni</td><td>hardenable, cheaper stainless</td><td>cutlery blades, pump shafts</td></tr><tr><td>EN19</td><td>0.4 C, 1 Cr, 0.25 Mo</td><td>through-hardenable and tough</td><td>gears, crankshafts, axles</td></tr><tr><td>EN31</td><td>1 C, 1.5 Cr</td><td>very hard and wear resistant</td><td>ball bearings, dies, rolls</td></tr><tr><td>HSS M2</td><td>0.85 C, 4 Cr, 5 Mo, 6 W, 2 V</td><td>keeps hardness up to 600 C</td><td>drills, taps, milling cutters</td></tr></table><div class=\"math\">stainless needs Cr > 12 % for a continuous passive film\n18/8 (304): Cr 18 %, Ni 8 % - austenitic, non-magnetic, not hardenable by quench\n12 % Cr (410): martensitic - hardenable, magnetic, less corrosion resistant\n\ndesignation:  C 45 = 0.45 % C plain carbon;  EN19 = old BS name of 709M40\nX 5 CrNi 18-10 = 0.05 % C, 18 % Cr, 10 % Ni</div><p><b>Common mistake.</b> Stainless steel is not 'steel that cannot rust'. It is steel whose chromium makes a self-healing oxide skin. Scratch it in chloride water, or heat it to 600 C and let chromium carbide form at the grain boundaries, and it corrodes like any steel.</p>", "gu": "<p>ફક્ત carbon થી જાડો ભાગ આખો harden થાય, સપાટી કાટ સામે ટકે, કે 500 C પર toughness જળવાય તે શક્ય નથી. <b>Alloy steel</b> એ એક કે વધુ element ઉમેરીને બરાબર એ ગુણધર્મ ખરીદે છે: 12 % થી ઉપર <b>chromium</b> passive oxide પડ બનાવે (stainless), <b>nickel</b> toughness વધારે અને austenite ને room temperature પર ટકાવે (18/8), <b>molybdenum</b> hardenability અને ઊંચા temperature ની તાકાત વધારે, <b>vanadium</b> અને <b>tungsten</b> લાલ ગરમીમાં પણ hardness રાખે (tool steels), અને થોડું <b>niobium</b> કે <b>titanium</b> pipeline માં વપરાતું fine-grain high-strength low-alloy સ્ટીલ આપે.</p><table><tr><th>સ્ટીલ</th><th>મુખ્ય elements</th><th>જે ગુણધર્મ મળે</th><th>ક્યાં વપરાય</th></tr><tr><td>SS 304</td><td>18 Cr, 8 Ni, 0.08 C</td><td>કાટ પ્રતિકાર, weldable</td><td>રસોડું, dairy, architecture</td></tr><tr><td>SS 316</td><td>16 Cr, 10 Ni, 2 Mo</td><td>chloride અને દરિયાના પાણી સામે ટકે</td><td>chemical plant, દરિયાઈ, surgical</td></tr><tr><td>SS 410</td><td>12 Cr, 0.15 C, Ni નહીં</td><td>hardenable, સસ્તું stainless</td><td>cutlery blades, pump shafts (ચાકુ, પંપ)</td></tr><tr><td>EN19</td><td>0.4 C, 1 Cr, 0.25 Mo (રચના)</td><td>આખું hardenable અને tough</td><td>ગિયર, crankshafts, axles</td></tr><tr><td>EN31</td><td>1 C, 1.5 Cr</td><td>ખૂબ સખત અને wear પ્રતિરોધક</td><td>ball bearings, dies, rolls (બેરિંગ, રોલ)</td></tr><tr><td>HSS M2</td><td>0.85 C, 4 Cr, 5 Mo, 6 W, 2 V (રચના)</td><td>600 C સુધી hardness રાખે</td><td>drills, taps, milling cutters (કોરણી)</td></tr></table><div class=\"math\">stainless needs Cr > 12 % for a continuous passive film\n18/8 (304): Cr 18 %, Ni 8 % - austenitic, non-magnetic, not hardenable by quench\n12 % Cr (410): martensitic - hardenable, magnetic, less corrosion resistant\n\ndesignation:  C 45 = 0.45 % C plain carbon;  EN19 = old BS name of 709M40\nX 5 CrNi 18-10 = 0.05 % C, 18 % Cr, 10 % Ni</div><p><b>સામાન્ય ભૂલ.</b> Stainless steel એ 'કાટ ન લાગે તેવું સ્ટીલ' નથી. તે એવું સ્ટીલ છે જેનું chromium પોતાની જાતે સંધાતું oxide પડ બનાવે. Chloride વાળા પાણીમાં ખૂંચે, કે 600 C પર ગરમ કરી grain boundary પર chromium carbide બનવા દો, તો તે પણ સામાન્ય સ્ટીલની જેમ કાટ ખાય.</p>"}, "diagram": "u3_desig"}]}, {"title": {"en": "3.3 Cast irons: the shape of the graphite decides everything", "gu": "3.3 Cast irons: graphite નો આકાર બધું નક્કી કરે"}, "items": [{"h": {"en": "Four cast irons and what each one is good at", "gu": "ચાર cast irons અને દરેક શેમાં સારું છે"}, "body": {"en": "<p>A cast iron holds 2.5 to 4 % carbon and 1 to 3 % silicon, and that is far more carbon than iron can keep in solution - so the carbon comes out of the melt as either <b>graphite</b> or <b>cementite</b>. Which one it becomes, and what shape the graphite takes, decides the properties completely. <b>Grey iron</b> cools slowly in a sand mould and its graphite forms flakes: cheap, easy to cast, an excellent damper, but weak in tension because every flake is a crack. <b>White iron</b> cools fast or is low in silicon, keeps its carbon as cementite, and is so hard it can only be ground. <b>Malleable iron</b> is white iron that has been annealed until the cementite breaks down into rosettes of temper carbon, and <b>ductile (SG) iron</b> is grey iron whose graphite was made to grow as nodules by adding a little magnesium.</p><table><tr><th>Cast iron</th><th>C %</th><th>Graphite</th><th>UTS (MPa)</th><th>Elongation</th><th>Used for</th></tr><tr><td>Grey</td><td>3.2 - 3.6</td><td>flakes</td><td>150 - 300</td><td>0.5 %</td><td>machine beds, housings, covers</td></tr><tr><td>White</td><td>2.5 - 3.5</td><td>none, all cementite</td><td>300 - 500</td><td>nil</td><td>mill liners, plough shares, rolls</td></tr><tr><td>Malleable</td><td>2.2 - 3.0</td><td>temper carbon rosettes</td><td>350 - 450</td><td>5 - 10 %</td><td>pipe fittings, brackets, hubs</td></tr><tr><td>Ductile (SG)</td><td>3.4 - 3.8</td><td>nodules</td><td>400 - 600</td><td>10 - 18 %</td><td>crankshafts, gears, pipe, wheels</td></tr></table><div class=\"math\">carbon equivalent:  CE = %C + (%Si + %P)/3\n\ngrey iron C 3.4, Si 2.1, P 0.3:  CE = 3.4 + 2.4/3 = 4.20  (just below eutectic)\nductile iron C 3.6, Si 2.4:      CE = 3.6 + 2.4/3 = 4.40  (just above)\nCE near 4.3 gives the best fluidity and the easiest casting</div><p><b>Why it is true.</b> Silicon does the same job as carbon: it is a graphitiser, pushing the carbon out of solution. That is why the carbon equivalent adds a third of the silicon - 1 % of silicon behaves like 0.33 % of carbon. Raise it too far and graphite forms before the metal freezes (kish graphite), which floats and leaves a rough surface.</p>", "gu": "<p>Cast iron માં 2.5 થી 4 % carbon અને 1 થી 3 % silicon હોય છે, જે iron ઓગાળી શકે તેનાથી ઘણું વધુ છે - તેથી carbon પ્રવાહીમાંથી <b>graphite</b> કે <b>cementite</b> સ્વરૂપે બહાર નીકળે છે. કયું બને અને graphite નો આકાર શો હોય તે ગુણધર્મો સંપૂર્ણ નક્કી કરે છે. <b>Grey iron</b> રેતીના mould માં ધીમે ઠંડું થાય તેથી તેનું graphite flake સ્વરૂપે બને: સસ્તું, સહેલાઈથી cast થાય, damping ઉત્તમ, પણ tension માં નબળું કારણ કે દરેક flake એક તિરાડ છે. <b>White iron</b> ઝડપથી ઠંડું થાય કે silicon ઓછું હોય, carbon cementite સ્વરૂપે રાખે, અને એટલું સખત બને કે ફક્ત ઘસી શકાય. <b>Malleable iron</b> એ white iron છે જેને anneal કરીને cementite ને temper carbon ના rosettes માં તોડ્યું છે, અને <b>ductile (SG) iron</b> એ grey iron છે જેનું graphite થોડું magnesium ઉમેરીને nodules સ્વરૂપે વધાવ્યું છે.</p><table><tr><th>Cast iron</th><th>C %</th><th>Graphite</th><th>UTS (MPa)</th><th>Elongation</th><th>ક્યાં વપરાય</th></tr><tr><td>Grey</td><td>3.2 - 3.6</td><td>flakes</td><td>150 - 300</td><td>0.5 %</td><td>machine beds, housings, covers (મશીન બેડ)</td></tr><tr><td>White</td><td>2.5 - 3.5</td><td>કંઈ નહીં, બધું cementite</td><td>300 - 500</td><td>nil</td><td>mill liners, plough shares, rolls (ઘસાતા ભાગ)</td></tr><tr><td>Malleable</td><td>2.2 - 3.0</td><td>temper carbon ના rosettes</td><td>350 - 450</td><td>5 - 10 %</td><td>pipe fittings, brackets, hubs (પાઇપ)</td></tr><tr><td>Ductile (SG)</td><td>3.4 - 3.8</td><td>nodules</td><td>400 - 600</td><td>10 - 18 %</td><td>crankshafts, ગિયર, પાઇપ, wheels</td></tr></table><div class=\"math\">carbon equivalent:  CE = %C + (%Si + %P)/3\n\ngrey iron C 3.4, Si 2.1, P 0.3:  CE = 3.4 + 2.4/3 = 4.20  (just below eutectic)\nductile iron C 3.6, Si 2.4:      CE = 3.6 + 2.4/3 = 4.40  (just above)\nCE near 4.3 gives the best fluidity and the easiest casting</div><p><b>કેમ સાચું છે.</b> Silicon એ carbon જેવું જ કામ કરે: તે graphitiser છે, carbon ને solution માંથી બહાર ધકેલે. તેથી carbon equivalent માં silicon નો ત્રીજો ભાગ ઉમેરાય - 1 % silicon, 0.33 % carbon જેવું વર્તે. ઘણું વધારે કરો તો ધાતુ થીજે તે પહેલાં graphite બને (kish graphite), જે ઉપર તરે અને સપાટી ખરબચડી રાખે.</p>"}, "diagram": "u3_ci"}, {"h": {"en": "Cast iron against steel, and why a machine bed is cast iron", "gu": "Cast iron સામે steel, અને machine bed cast iron કેમ હોય"}, "body": {"en": "<p>The difference between the two is not just composition. A cast iron contains graphite flakes, and a flake is a free surface: it cannot carry tensile stress, it absorbs vibration as the two faces rub, and it holds oil so the surface stays lubricated. So cast iron is weak in tension, roughly three to four times stronger in compression, superb at damping and cheap to make into a complicated shape. Steel has no graphite, so it is equally strong in tension and compression, can be forged and welded, and takes shock without cracking.</p><table><tr><th>Point</th><th>Cast iron</th><th>Steel</th></tr><tr><td>Carbon</td><td>2.14 - 6.67 %</td><td>0.02 - 2.14 %</td></tr><tr><td>Tension against compression</td><td>compression 3-4 times stronger</td><td>the same in both</td></tr><tr><td>Damping</td><td>excellent - graphite rubs</td><td>poor, it rings</td></tr><tr><td>Forming</td><td>casting only</td><td>rolling, forging, welding, machining</td></tr><tr><td>Impact</td><td>brittle, it cracks</td><td>tough if the carbon is low</td></tr><tr><td>Cost of a complex shape</td><td>low - cast to shape, little machining</td><td>high - needs forging and machining</td></tr></table><div class=\"math\">grey iron: UTS 200 MPa in tension, 700 MPa in compression\nsteel C45: UTS 600 MPa in tension and 600 MPa in compression\ndamping capacity of grey iron is 5 to 10 times that of steel\n\nso a lathe bed is cast iron: it is loaded in compression, it must not vibrate,\nand its shape is complicated - three reasons for the same answer</div><p><b>Check your answer.</b> If a question asks why a part is cast iron, look for compression, vibration or a complicated shape. If it is loaded in tension or shock, the answer is steel.</p>", "gu": "<p>બંનેમાં ફરક ફક્ત composition નો નથી. Cast iron માં graphite flakes હોય છે, અને flake એટલે મુક્ત સપાટી: તે tensile stress ખેંચી શકતું નથી, બે સપાટી ઘસાતાં vibration શોષે છે, અને તેલ પકડી રાખે છે તેથી સપાટી lubricated રહે. તેથી cast iron tension માં નબળું, compression માં લગભગ ત્રણ-ચાર ગણું મજબૂત, damping માં ઉત્તમ અને ગૂંચવાડાભરી આકૃતિ બનાવવા સસ્તું છે. Steel માં graphite નથી, તેથી તે tension અને compression બંનેમાં સરખું મજબૂત, forge અને weld થઈ શકે, અને તણાવ સહન કરે પણ તૂટે નહીં.</p><table><tr><th>મુદ્દો</th><th>Cast iron</th><th>Steel</th></tr><tr><td>Carbon</td><td>2.14 - 6.67 %</td><td>0.02 - 2.14 %</td></tr><tr><td>Tension સામે compression</td><td>compression 3-4 ગણું મજબૂત</td><td>બંનેમાં સરખું</td></tr><tr><td>Damping</td><td>ઉત્તમ - graphite ઘસાય</td><td>નબળું, ઘંટડી જેવું વાગે</td></tr><tr><td>Forming</td><td>ફક્ત casting</td><td>rolling, forging, welding, machining (આકાર આપવો)</td></tr><tr><td>Impact</td><td>ભંગુર, તૂટે</td><td>carbon ઓછો હોય તો tough</td></tr><tr><td>ગૂંચવાડાભરી આકૃતિનો ખર્ચ</td><td>ઓછો - આકારમાં cast, ઓછું machining</td><td>વધુ - forging અને machining જોઈએ</td></tr></table><div class=\"math\">grey iron: UTS 200 MPa in tension, 700 MPa in compression\nsteel C45: UTS 600 MPa in tension and 600 MPa in compression\ndamping capacity of grey iron is 5 to 10 times that of steel\n\nso a lathe bed is cast iron: it is loaded in compression, it must not vibrate,\nand its shape is complicated - three reasons for the same answer</div><p><b>જવાબ ચકાસો.</b> કોઈ ભાગ cast iron કેમ છે તે પૂછે તો compression, vibration કે ગૂંચવાડાભરી આકૃતિ શોધો. Tension કે shock નો ભાર હોય તો જવાબ steel છે.</p>"}}]}, {"title": {"en": "3.4 Copper and its alloys", "gu": "3.4 Copper અને તેના alloys"}, "items": [{"h": {"en": "Copper, brass, bronze and gunmetal", "gu": "Copper, brass, bronze અને gunmetal"}, "body": {"en": "<p>Pure copper conducts better than any metal except silver - 385 W/(m K) and 100 % of the international annealed copper standard - but it is soft, 220 MPa, and expensive. Adding a second metal raises its strength and hardness and destroys part of that conductivity, because the dissolved atoms scatter the free electrons. With <b>zinc</b> it becomes <b>brass</b>: 70/30 is soft and ductile, ideal for deep drawing and radiator fins, while 60/40 is stronger and is extruded into rod for screws. With <b>tin</b> it becomes <b>bronze</b>, harder and very wear resistant, the classic bearing and bell metal. Adding both gives <b>gunmetal</b>, which resists sea water and is cast into pump bodies and valve chests.</p><table><tr><th>Alloy</th><th>Composition</th><th>UTS</th><th>Conductivity</th><th>Why it is chosen</th></tr><tr><td>Copper</td><td>99.9 % Cu</td><td>220 MPa</td><td>100 % IACS</td><td>busbar, winding, electrode</td></tr><tr><td>Brass 70/30</td><td>Cu 70, Zn 30</td><td>350 MPa</td><td>28 % IACS</td><td>deep drawing, cartridge, fins</td></tr><tr><td>Brass 60/40</td><td>Cu 60, Zn 40</td><td>420 MPa</td><td>26 % IACS</td><td>hot stamping, screws, rod</td></tr><tr><td>Phosphor bronze</td><td>Cu 94.8, Sn 5, P 0.2</td><td>350 MPa</td><td>12 % IACS</td><td>springs, bearings, gears</td></tr><tr><td>Gunmetal</td><td>Cu 88, Sn 10, Zn 2</td><td>280 MPa</td><td>12 % IACS</td><td>valves, pumps, worms, bells</td></tr><tr><td>Cupronickel</td><td>Cu 70, Ni 30</td><td>380 MPa</td><td>5 % IACS</td><td>condenser tubes, coinage</td></tr></table><div class=\"math\">conductivity of a metal falls as soon as anything is dissolved in it\nCu 100 % IACS -> brass 70/30 28 % -> bronze 13 % -> cupronickel 5 %\nresistivity:  copper 1.7e-8,  brass 6.4e-8,  bronze 1.5e-7 ohm m\n\n%IACS = conductivity/5.8e7 x 100   (5.8e7 S/m is annealed copper)</div><p><b>Why it is true.</b> A pure metal conducts well because its electrons see a perfectly regular lattice. A zinc atom in copper is a different size, so the lattice around it is strained and the electron is scattered - and scattering is resistance. This is the same reason an alloy is stronger than a pure metal: the same distortion that stops a dislocation stops an electron.</p><p><b>Check your answer.</b> For an electrical question choose copper; for a bearing choose bronze; for a casting in sea water choose gunmetal; for something to deep-draw choose 70/30 brass. The alloy follows the duty, not the price list.</p>", "gu": "<p>શુદ્ધ copper silver સિવાય દરેક ધાતુ કરતાં સારું વહન કરે - 385 W/(m K) અને international annealed copper standard ના 100 % - પણ તે નરમ, 220 MPa, અને મોંઘું છે. બીજી ધાતુ ઉમેરો તો તાકાત અને hardness વધે અને વાહકતાનો ભાગ નાશ પામે, કારણ કે ઓગળેલા atoms free electrons ને અથડાવે. <b>Zinc</b> સાથે તે <b>brass</b> બને: 70/30 નરમ અને ductile, deep drawing તથી radiator fins માટે ઉત્તમ, જ્યારે 60/40 વધુ મજબૂત અને screw માટે rod સ્વરૂપે extrude થાય. <b>Tin</b> સાથે તે <b>bronze</b> બને, વધુ સખત અને wear પ્રતિરોધક, પરંપરાગત bearing અને ઘંટડીની ધાતુ. બંને ઉમેરો તો <b>gunmetal</b> મળે, જે દરિયાના પાણી સામે ટકે અને pump bodies તથા valve chests માં cast થાય.</p><table><tr><th>Alloy</th><th>Composition</th><th>UTS</th><th>વાહકતા</th><th>કેમ પસંદ થાય</th></tr><tr><td>Copper</td><td>99.9 % Cu</td><td>220 MPa</td><td>100 % IACS</td><td>busbar, winding, electrode (વીજ)</td></tr><tr><td>Brass 70/30</td><td>Cu 70, Zn 30</td><td>350 MPa</td><td>28 % IACS</td><td>deep drawing, cartridge, fins (ખેંચાઈને બને)</td></tr><tr><td>Brass 60/40</td><td>Cu 60, Zn 40</td><td>420 MPa</td><td>26 % IACS</td><td>hot stamping, screws, rod (બોલ્ટ)</td></tr><tr><td>Phosphor bronze</td><td>Cu 94.8, Sn 5, P 0.2 (રચના)</td><td>350 MPa</td><td>12 % IACS</td><td>સ્પ્રિંગ, bearings, gears</td></tr><tr><td>Gunmetal</td><td>Cu 88, Sn 10, Zn 2</td><td>280 MPa</td><td>12 % IACS</td><td>valves, pumps, worms, bells (વાલ્વ, પંપ)</td></tr><tr><td>Cupronickel</td><td>Cu 70, Ni 30</td><td>380 MPa</td><td>5 % IACS</td><td>condenser tubes, coinage (સિક્કા)</td></tr></table><div class=\"math\">conductivity of a metal falls as soon as anything is dissolved in it\nCu 100 % IACS -> brass 70/30 28 % -> bronze 13 % -> cupronickel 5 %\nresistivity:  copper 1.7e-8,  brass 6.4e-8,  bronze 1.5e-7 ohm m\n\n%IACS = conductivity/5.8e7 x 100   (5.8e7 S/m is annealed copper)</div><p><b>કેમ સાચું છે.</b> શુદ્ધ ધાતુ સારું વહન કરે કારણ કે તેના electrons ને સંપૂર્ણ નિયમિત lattice દેખાય. Copper માં zinc atom જુદા માપનો હોય તેથી તેની આસપાસનું lattice તણાય અને electron અથડાય - અને અથડામણ એ જ resistance. એ જ કારણે alloy શુદ્ધ ધાતુ કરતાં મજબૂત હોય છે: જે વિકૃતિ dislocation ને રોકે છે તે જ electron ને રોકે છે.</p><p><b>જવાબ ચકાસો.</b> Electrical પ્રશ્નમાં copper પસંદ કરો; bearing માટે bronze; દરિયાના પાણીમાં casting માટે gunmetal; deep drawing માટે 70/30 brass. Alloy કામ પ્રમાણે પસંદ થાય, ભાવ પ્રમાણે નહીં.</p>"}, "diagram": "u3_cu"}]}, {"title": {"en": "3.5 Aluminium: wrought alloys, cast alloys and tempers", "gu": "3.5 Aluminium: wrought alloys, cast alloys અને tempers"}, "items": [{"h": {"en": "The eight series and what the number tells you", "gu": "આઠ series અને આંકડો શું કહે છે"}, "body": {"en": "<p>Aluminium is light - 2.70 g/cm3, a third of steel - and it protects itself with a thin oxide film, so it does not rust. Pure aluminium is soft, only 110 MPa, so almost everything used is an alloy. The wrought alloys are numbered by their main alloying element, and the first digit says which: <b>series 1 (1050)</b> is 99 % pure, <b>series 2 (2024)</b> is copper, strong but not weldable, which is why an aircraft skin is riveted, <b>series 3 (3003)</b> is manganese for kitchen foil and utensils, <b>series 4 (4043)</b> is silicon for brazing sheet, <b>series 5 (5052)</b> is magnesium for marine plate because it is the best of them at welding and at sea water, <b>series 6 (6061)</b> is magnesium plus silicon and is the extrusion alloy of window frames, ladders and structures, <b>series 7 (7075)</b> is zinc, the strongest at 570 MPa, used for an aircraft wing, and <b>series 8 (8006)</b> is everything else.</p><table><tr><th>Series</th><th>Main element</th><th>UTS range</th><th>Weldable</th><th>Typical use</th></tr><tr><td>1 (1050)</td><td>none, 99 % Al</td><td>70 - 185 MPa</td><td>yes</td><td>foil, busbar, cladding</td></tr><tr><td>2 (2024)</td><td>copper</td><td>190 - 480 MPa</td><td>no, needs rivets</td><td>aircraft skin, 2024</td></tr><tr><td>3 (3003)</td><td>manganese</td><td>110 - 285 MPa</td><td>yes</td><td>utensils, AC tubing</td></tr><tr><td>4 (4043)</td><td>silicon</td><td>170 - 380 MPa</td><td>brazing</td><td>filler sheet, pistons</td></tr><tr><td>5 (5052)</td><td>magnesium</td><td>125 - 350 MPa</td><td>yes, best</td><td>marine plate, fuel tanks</td></tr><tr><td>6 (6061)</td><td>Mg + Si</td><td>125 - 310 MPa</td><td>yes</td><td>extrusion: frames, ladders</td></tr><tr><td>7 (7075)</td><td>zinc</td><td>220 - 600 MPa</td><td>no</td><td>aircraft wing, 7075</td></tr><tr><td>8 (8006)</td><td>other (Li, Fe, Ni)</td><td>150 - 400 MPa</td><td>varies</td><td>bearings, foil, specialist</td></tr></table><div class=\"math\">temper is written after the alloy:  6061-T6\nO annealed (softest)   H strain hardened   T solution treated and aged   F as made\n6061-O 110 MPa -> 6061-T6 310 MPa: the same alloy, three times the strength\n\n7075-T6 570 MPa against mild steel 450 MPa - and at 2.7 instead of 7.85 g/cm3</div><p><b>Why it is true.</b> The T tempers work by precipitation. The alloy is heated to dissolve the alloying elements, quenched to trap them in a supersaturated solution, then held warm so that fine particles precipitate and block dislocations. Nothing is added and nothing is removed - the strength comes entirely from the heat treatment, which is why the temper letter has to be written with the alloy number.</p>", "gu": "<p>Aluminium હલકું છે - 2.70 g/cm3, સ્ટીલનો ત્રીજો ભાગ - અને પાતળા oxide પડથી પોતાને રક્ષે છે, તેથી કાટ ખાતું નથી. શુદ્ધ aluminium નરમ, ફક્ત 110 MPa, તેથી વપરાતું લગભગ બધું alloy છે. Wrought alloys મુખ્ય alloying element પ્રમાણે ગણાય છે અને પહેલો અંક કહે છે કે કયો: <b>series 1 (1050)</b> 99 % શુદ્ધ, <b>series 2 (2024)</b> copper, મજબૂત પણ weldable નહીં, તેથી aircraft skin rivet થાય, <b>series 3 (3003)</b> manganese - kitchen foil અને વાસણ, <b>series 4 (4043)</b> silicon - brazing sheet, <b>series 5 (5052)</b> magnesium - marine plate, welding અને દરિયાના પાણી માટે સૌથી સારું, <b>series 6 (6061)</b> magnesium અને silicon - window frame, ladders તથી structures નું extrusion alloy, <b>series 7 (7075)</b> zinc - સૌથી મજબૂત, 570 MPa, aircraft wing, અને <b>series 8 (8006)</b> બાકીનું.</p><table><tr><th>Series</th><th>મુખ્ય element</th><th>UTS range</th><th>Weldable</th><th>સામાન્ય ઉપયોગ</th></tr><tr><td>1 (1050)</td><td>કંઈ નહીં, 99 % Al</td><td>70 - 185 MPa</td><td>હા</td><td>foil, busbar, cladding (પન્ની)</td></tr><tr><td>2 (2024)</td><td>copper</td><td>190 - 480 MPa</td><td>ના, rivets જોઈએ</td><td>aircraft skin, 2024</td></tr><tr><td>3 (3003)</td><td>manganese</td><td>110 - 285 MPa</td><td>હા</td><td>utensils, AC tubing</td></tr><tr><td>4 (4043)</td><td>silicon</td><td>170 - 380 MPa</td><td>brazing</td><td>filler sheet, pistons (ભરણી)</td></tr><tr><td>5 (5052)</td><td>magnesium</td><td>125 - 350 MPa</td><td>હા, સૌથી સારું</td><td>marine plate, fuel tanks (દરિયાઈ)</td></tr><tr><td>6 (6061)</td><td>Mg + Si</td><td>125 - 310 MPa</td><td>હા</td><td>extrusion: frames, ladders (ચોકઠાં)</td></tr><tr><td>7 (7075)</td><td>zinc</td><td>220 - 600 MPa</td><td>ના</td><td>aircraft wing, 7075</td></tr><tr><td>8 (8006)</td><td>બીજું (Li, Fe, Ni)</td><td>150 - 400 MPa</td><td>બદલાય</td><td>bearings, foil, વિશિષ્ટ કામ</td></tr></table><div class=\"math\">temper is written after the alloy:  6061-T6\nO annealed (softest)   H strain hardened   T solution treated and aged   F as made\n6061-O 110 MPa -> 6061-T6 310 MPa: the same alloy, three times the strength\n\n7075-T6 570 MPa against mild steel 450 MPa - and at 2.7 instead of 7.85 g/cm3</div><p><b>કેમ સાચું છે.</b> T temper precipitation થી કામ કરે. Alloy ને ગરમ કરીને alloying elements ઓગળાય, quench કરીને supersaturated solution માં ફસાવાય, પછી ગરમ રાખીને નાના particles બનાવાય જે dislocation રોકે. કંઈ ઉમેરાતું નથી કે કાઢાતું નથી - તાકાત આખી heat treatment થી આવે, તેથી temper નો અક્ષર alloy ના આંકડા સાથે જ લખવો પડે.</p>"}, "diagram": "u3_al"}, {"h": {"en": "Cast alloys, and choosing aluminium against steel", "gu": "Cast alloys, અને steel સામે aluminium પસંદ કરવું"}, "body": {"en": "<p>Casting alloys are numbered differently, by a three-digit system and a decimal, because a casting cannot be rolled to close its porosity. The workhorse is <b>LM6</b>, an Al-12 % Si alloy: silicon lowers the melting point and makes the metal fluid, so it fills a mould and casts almost without shrinkage, and the result is light, corrosion-resistant and dimensionally stable - pistons, manifolds and pump bodies. <b>A356</b> with a T6 temper reaches 260 MPa and is used for wheels and gearbox housings. Cast alloys reach about 300 MPa against 600 for the best wrought alloys, so anything highly stressed is forged rather than cast.</p><table><tr><th>Question to ask</th><th>Choose aluminium when</th><th>Choose steel when</th></tr><tr><td>How heavy may it be?</td><td>weight or inertia matters: piston, robot arm, bicycle</td><td>weight is no problem: machine bed, anvil</td></tr><tr><td>How hot does it run?</td><td>below 150 C; strength falls fast above it</td><td>up to 500 C or more with alloy steels</td></tr><tr><td>How is it loaded?</td><td>stiffness-limited, spread over a large section</td><td>fatigue, impact, point loads</td></tr><tr><td>What does it meet?</td><td>sea water, atmosphere, food: the oxide film wins</td><td>abrasion, hot wear, cutting edges</td></tr><tr><td>How is it made?</td><td>extruded, die cast, deep drawn</td><td>welded, forged, induction hardened</td></tr></table><div class=\"math\">same volume: steel 7.85 vs aluminium 2.70 g/cm3 -> aluminium 66 % lighter\nsame weight: aluminium needs 2.9 times the volume\n\nso replace steel by aluminium only if the section can be made thicker\nor if the part is stiffness-limited and the shape can grow</div><p><b>Check your answer.</b> A straight swap of material at the same dimensions is safe only for a stiffness-critical part if the deflection is allowed to grow; for a strength-limited part you must compare specific strength, not strength.</p>", "gu": "<p>Casting alloys જુદી રીતે ગણાય છે, ત્રણ અંક અને decimal થી, કારણ કે casting ને roll કરીને તેના છિદ્રો બંધ કરી શકાતા નથી. મુખ્ય ધોરણ <b>LM6</b> છે, Al-12 % Si alloy: silicon ગલનબિંદુ નીચું કરે અને ધાતુને પ્રવાહી બનાવે, તેથી તે mould ભરે અને લગભગ shrinkage વગર cast થાય, અને પરિણામ હલકું, કાટ-પ્રતિરોધક અને માપમાં ટકી રહેતું હોય - pistons, manifolds અને pump bodies. <b>A356</b> T6 temper સાથે 260 MPa સુધી પહોંચે અને wheels તથી gearbox housings માટે વપરાય. Cast alloys લગભગ 300 MPa સુધી જાય જ્યારે શ્રેષ્ઠ wrought alloys 600, તેથી વધુ ભાર વાળો ભાગ forge કરાય, cast નહીં.</p><table><tr><th>પૂછવાનો પ્રશ્ન</th><th>Aluminium પસંદ કરો જ્યારે</th><th>Steel પસંદ કરો જ્યારે</th></tr><tr><td>કેટલું ભારે ચાલે?</td><td>વજન કે inertia મહત્વનું: piston, robot arm, bicycle</td><td>વજન સમસ્યા નથી: machine bed, anvil</td></tr><tr><td>કેટલું ગરમ ચાલે?</td><td>150 C ની નીચે; ઉપર તાકાત ઝડપથી ઘટે</td><td>alloy steels સાથે 500 C કે વધુ</td></tr><tr><td>ભાર કેવો છે?</td><td>stiffness મુખ્ય, મોટા section પર ફેલાયેલો</td><td>fatigue, impact, બિંદુ ભાર</td></tr><tr><td>શેના સંપર્કમાં આવે?</td><td>દરિયાનું પાણી, હવા, ખોરાક: oxide પડ જીતે</td><td>ઘસરો, ગરમ wear, cutting edges</td></tr><tr><td>કેવી રીતે બને?</td><td>extruded, die cast, deep drawn (આકાર આપવો)</td><td>welded, forged, induction hardened (જોડાય, ઢબાય)</td></tr></table><div class=\"math\">same volume: steel 7.85 vs aluminium 2.70 g/cm3 -> aluminium 66 % lighter\nsame weight: aluminium needs 2.9 times the volume\n\nso replace steel by aluminium only if the section can be made thicker\nor if the part is stiffness-limited and the shape can grow</div><p><b>જવાબ ચકાસો.</b> સરખા માપ પર સીધી સામગ્રી બદલી ફક્ત ત્યારે સલામત છે જ્યારે deflection વધવા દેવાય; તાકાત-મર્યાદિત ભાગ માટે specific strength સરખાવવું પડે, ફક્ત strength નહીં.</p>"}}]}, {"title": {"en": "3.6 Solved Numericals, Step by Step", "gu": "3.6 ઉકેલેલા દાખલા, પગલે પગલે"}, "items": [{"h": {"en": "Density of a 70/30 brass from the rule of mixtures", "gu": "Rule of mixtures થી 70/30 brass ની density"}, "body": {"en": "<h4>Question (7 marks)</h4><p>A 70/30 brass is made by weight from copper (8.96 g/cm3) and zinc (7.14 g/cm3). Estimate its density by adding volumes, compare it with the measured 8.53 g/cm3 and say why the estimate is low.</p><h4>Step 1 - the volume of 100 g of alloy</h4><div class=\"math\">take 100 g of brass: 70 g copper and 30 g zinc\nV(Cu) = 70/8.96 = 7.8125 cm3\nV(Zn) = 30/7.14 = 4.2017 cm3\nV(total) = 12.0142 cm3</div><h4>Step 2 - the density</h4><div class=\"math\">rho = m/V = 100/12.0142 = 8.32 g/cm3\nin the rule form: 1/rho = 0.70/8.96 + 0.30/7.14 = 0.12014</div><h4>Step 3 - compare and explain</h4><div class=\"math\">measured 8.53 g/cm3, estimated 8.32 g/cm3\nerror = (8.32 - 8.53)/8.53 x 100 = -2.5 %</div><div class=\"eq\">rho = 8.32 g/cm3 against 8.53 measured: 2.5 % low</div><p>The rule of mixtures assumes the atoms simply add their volumes, but a zinc atom is smaller than a copper atom and fits into the lattice without pushing it apart, so the real alloy is denser than the sum of its parts. The same assumption is why the rule is only used for an estimate, never for a purchase specification.</p><p><b>Check your answer.</b> A rough check: the answer must lie between 7.14 and 8.96, and nearer to copper because there is more copper. 8.32 satisfies both.</p>", "gu": "<h4>પ્રશ્ન (7 marks)</h4><p>70/30 brass વજન પ્રમાણે copper (8.96 g/cm3) અને zinc (7.14 g/cm3) થી બને છે. Volume ઉમેરીને તેની density નો અંદાજ કાઢો, માપેલા 8.53 g/cm3 સાથે સરખાવો અને અંદાજ ઓછો કેમ આવે તે કહો.</p><h4>પગલું 1 - 100 g alloy નું volume</h4><div class=\"math\">take 100 g of brass: 70 g copper and 30 g zinc\nV(Cu) = 70/8.96 = 7.8125 cm3\nV(Zn) = 30/7.14 = 4.2017 cm3\nV(total) = 12.0142 cm3</div><h4>પગલું 2 - density</h4><div class=\"math\">rho = m/V = 100/12.0142 = 8.32 g/cm3\nin the rule form: 1/rho = 0.70/8.96 + 0.30/7.14 = 0.12014</div><h4>પગલું 3 - સરખાવો અને સમજાવો</h4><div class=\"math\">measured 8.53 g/cm3, estimated 8.32 g/cm3\nerror = (8.32 - 8.53)/8.53 x 100 = -2.5 %</div><div class=\"eq\">rho = 8.32 g/cm3 against 8.53 measured: 2.5 % low</div><p>Rule of mixtures ધારે છે કે atoms ફક્ત પોતાનું volume ઉમેરે, પણ zinc atom copper atom કરતાં નાનો હોય તેથી lattice ને ધકેલ્યા વગર અંદર બેસે, અને સાચો alloy તેના ભાગોના સરવાળા કરતાં ઘનતાવાળો નીકળે. એ જ કારણે આ નિયમ ફક્ત અંદાજ માટે વપરાય, ખરીદીના specification માટે નહીં.</p><p><b>જવાબ ચકાસો.</b> ઝડપી ચકાસણી: જવાબ 7.14 અને 8.96 વચ્ચે અને copper ની નજીક હોવો જોઈએ કારણ કે copper વધુ છે. 8.32 બંને શરત પૂરી કરે છે.</p>"}}, {"h": {"en": "Cost of a brass melt", "gu": "Brass melt નો ખર્ચ"}, "body": {"en": "<h4>Question (7 marks)</h4><p>A foundry needs 250 kg of sound 70/30 brass castings. Melting loss is 3 % of the charge. Copper costs Rs 820 per kg and zinc Rs 280 per kg. Find the charge mass and the metal cost of the heat.</p><h4>Step 1 - the charge mass</h4><div class=\"math\">3 % is lost, so 97 % of the charge becomes casting\n0.97 x charge = 250 kg\ncharge = 250/0.97 = 257.7 kg</div><h4>Step 2 - cost of one kilogram of charge</h4><div class=\"math\">70 % copper: 0.70 x 820 = Rs 574.00\n30 % zinc:   0.30 x 280 = Rs  84.00\ncost per kg = Rs 658.00</div><h4>Step 3 - the cost of the heat</h4><div class=\"math\">cost = 257.7 x 658 = Rs 1,69,587\nper kilogram of good casting: 169587/250 = Rs 678.3</div><div class=\"eq\">charge 257.7 kg,  Rs 1,69,587 for the heat,  Rs 678 per kg of casting</div><p>The melting loss is what makes the casting cost more than the metal in it: 3 % of the charge is lost, so about Rs 20 per kilogram of casting is paid for metal that went up the flue or into the slag. That is why a foundry weighs its charge and its returns carefully.</p><p><b>Common mistake.</b> Do not add 3 % to 250 kg. The loss is taken from the charge, so the charge is larger than the casting by 250/0.97, not 250 x 1.03.</p>", "gu": "<h4>પ્રશ્ન (7 marks)</h4><p>એક ફાઉન્ડ્રીને 250 kg સાચા 70/30 brass castings જોઈએ. Melting loss charge ના 3 % છે. Copper Rs 820 પ્રતિ kg અને zinc Rs 280 પ્રતિ kg. Charge નું દળ અને heat નો metal ખર્ચ શોધો.</p><h4>પગલું 1 - charge નું દળ</h4><div class=\"math\">3 % is lost, so 97 % of the charge becomes casting\n0.97 x charge = 250 kg\ncharge = 250/0.97 = 257.7 kg</div><h4>પગલું 2 - એક kg charge નો ખર્ચ</h4><div class=\"math\">70 % copper: 0.70 x 820 = Rs 574.00\n30 % zinc:   0.30 x 280 = Rs  84.00\ncost per kg = Rs 658.00</div><h4>પગલું 3 - heat નો ખર્ચ</h4><div class=\"math\">cost = 257.7 x 658 = Rs 1,69,587\nper kilogram of good casting: 169587/250 = Rs 678.3</div><div class=\"eq\">charge 257.7 kg,  Rs 1,69,587 for the heat,  Rs 678 per kg of casting</div><p>Melting loss એ જ casting ને તેમાંના metal કરતાં મોંઘું બનાવે: charge ના 3 % જાય છે, તેથી casting ના પ્રતિ kg લગભગ Rs 20 એવી ધાતુના મળે જે ચીમનીમાં કે slag માં ગઈ. તેથી ફાઉન્ડ્રી પોતાનું charge અને returns કાળજીથી તોલે છે.</p><p><b>સામાન્ય ભૂલ.</b> 250 kg માં 3 % ઉમેરશો નહીં. Loss charge માંથી જાય છે, તેથી charge casting કરતાં 250/0.97 જેટલું મોટું હોય, 250 x 1.03 નહીં.</p>"}}, {"h": {"en": "Carbon equivalent of two cast irons", "gu": "બે cast irons નું carbon equivalent"}, "body": {"en": "<h4>Question (6 marks)</h4><p>A grey iron contains 3.4 % C, 2.1 % Si and 0.3 % P; a ductile iron contains 3.6 % C, 2.4 % Si and 0.05 % P. Find the carbon equivalent of each and say what it means for casting.</p><h4>Step 1 - the formula</h4><div class=\"math\">CE = %C + (%Si + %P)/3\nsilicon graphitises a third as strongly as carbon, hence the divisor 3</div><h4>Step 2 - the grey iron</h4><div class=\"math\">CE = 3.4 + (2.1 + 0.3)/3 = 3.4 + 0.80 = 4.20</div><h4>Step 3 - the ductile iron</h4><div class=\"math\">CE = 3.6 + (2.4 + 0.05)/3 = 3.6 + 0.817 = 4.42</div><div class=\"eq\">grey iron CE = 4.20,  ductile iron CE = 4.42,  the eutectic is 4.3</div><p>Both are close to the eutectic value of 4.3, which is what a foundry wants: a metal that freezes in a narrow range, feeds itself, and casts without shrinkage cavities. The grey iron at 4.20 is slightly hypoeutectic and will show a little primary austenite; the ductile iron at 4.42 is slightly hypereutectic, and it is the magnesium addition, not the carbon, that makes its graphite nodular.</p><p><b>Check your answer.</b> CE must not be far above 4.3 in a thin section, or kish graphite forms and the casting surface becomes rough and weak.</p>", "gu": "<h4>પ્રશ્ન (6 marks)</h4><p>એક grey iron માં 3.4 % C, 2.1 % Si અને 0.3 % P છે; એક ductile iron માં 3.6 % C, 2.4 % Si અને 0.05 % P છે. દરેકનું carbon equivalent શોધો અને casting માટે તેનો અર્થ કહો.</p><h4>પગલું 1 - સૂત્ર</h4><div class=\"math\">CE = %C + (%Si + %P)/3\nsilicon graphitises a third as strongly as carbon, hence the divisor 3</div><h4>પગલું 2 - grey iron</h4><div class=\"math\">CE = 3.4 + (2.1 + 0.3)/3 = 3.4 + 0.80 = 4.20</div><h4>પગલું 3 - ductile iron</h4><div class=\"math\">CE = 3.6 + (2.4 + 0.05)/3 = 3.6 + 0.817 = 4.42</div><div class=\"eq\">grey iron CE = 4.20,  ductile iron CE = 4.42,  the eutectic is 4.3</div><p>બંને eutectic મૂલ્ય 4.3 ની નજીક છે, જે ફાઉન્ડ્રીને જોઈએ: એવી ધાતુ જે નાની range માં થીજે, પોતાને feed કરે અને shrinkage છિદ્રો વગર cast થાય. 4.20 વાળું grey iron થોડું hypoeutectic છે અને થોડું primary austenite દેખાશે; 4.42 વાળું ductile iron થોડું hypereutectic છે, અને તેનું graphite nodular magnesium ઉમેરવાથી થાય છે, carbon થી નહીં.</p><p><b>જવાબ ચકાસો.</b> પાતળા ભાગમાં CE 4.3 થી ઘણું ઉપર ન જોઈએ, નહીં તો kish graphite બને અને casting ની સપાટી ખરબચડી તથી નબળી થાય.</p>"}}, {"h": {"en": "Replacing a steel bracket with aluminium", "gu": "Steel bracket ને aluminium થી બદલવું"}, "body": {"en": "<h4>Question (6 marks)</h4><p>A bracket has a volume of 260 cm3 and is made of steel of density 7.85 g/cm3. Find its mass, the mass if it is made of aluminium alloy of density 2.70 g/cm3, and the percentage saved. The steel has UTS 450 MPa and the aluminium alloy 310 MPa - comment on whether the swap is safe at the same dimensions.</p><h4>Step 1 - the two masses</h4><div class=\"math\">m(steel) = rho V = 7.85 x 260 = 2041 g = 2.04 kg\nm(aluminium) = 2.70 x 260 = 702 g = 0.70 kg</div><h4>Step 2 - the saving</h4><div class=\"math\">saving = 2.041 - 0.702 = 1.339 kg\npercentage = 1.339/2.041 x 100 = 65.6 %</div><h4>Step 3 - is it safe at the same size?</h4><div class=\"math\">section area is unchanged, so the load capacity falls in the ratio of the strengths\n310/450 = 0.69 - the aluminium part carries 69 % of the load\nspecific strength: steel 450/7.85 = 57, aluminium 310/2.70 = 115 kN m/kg\nso the swap is safe only if the part was over-designed by 45 % or can be thickened</div><div class=\"eq\">2.04 kg -> 0.70 kg,  65.6 % lighter,  but 31 % weaker at the same section</div><p>This is the standard trap of a material substitution question. Weight falls by two thirds, but strength falls by a third, and stiffness falls by two thirds as well because the modulus of aluminium is 70 GPa against 200 GPa for steel. A part that is stiffness-limited must be redesigned, not just swapped.</p><p><b>Check your answer.</b> Check the units: 260 cm3 x 7.85 g/cm3 gives grams, so divide by 1000 for kilograms.</p>", "gu": "<h4>પ્રશ્ન (6 marks)</h4><p>એક bracket નું volume 260 cm3 છે અને તે 7.85 g/cm3 density ના સ્ટીલનું બનેલું છે. તેનું દળ, 2.70 g/cm3 density ના aluminium alloy નું બન્યું હોય તો દળ, અને થતી ટકાવારી બચત શોધો. સ્ટીલનું UTS 450 MPa અને aluminium alloy નું 310 MPa છે - સરખા માપ પર આ બદલી સલામત છે કે નહીં તે કહો.</p><h4>પગલું 1 - બે દળ</h4><div class=\"math\">m(steel) = rho V = 7.85 x 260 = 2041 g = 2.04 kg\nm(aluminium) = 2.70 x 260 = 702 g = 0.70 kg</div><h4>પગલું 2 - બચત</h4><div class=\"math\">saving = 2.041 - 0.702 = 1.339 kg\npercentage = 1.339/2.041 x 100 = 65.6 %</div><h4>પગલું 3 - સરખા માપ પર સલામત છે?</h4><div class=\"math\">section area is unchanged, so the load capacity falls in the ratio of the strengths\n310/450 = 0.69 - the aluminium part carries 69 % of the load\nspecific strength: steel 450/7.85 = 57, aluminium 310/2.70 = 115 kN m/kg\nso the swap is safe only if the part was over-designed by 45 % or can be thickened</div><div class=\"eq\">2.04 kg -> 0.70 kg,  65.6 % lighter,  but 31 % weaker at the same section</div><p>સામગ્રી બદલવાના પ્રશ્નની આ પ્રમાણભૂત ભૂલ છે. વજન બે-તૃતીયાંશ ઘટે, પણ તાકાત એક-તૃતીયાંશ ઘટે, અને stiffness પણ બે-તૃતીયાંશ ઘટે કારણ કે aluminium નો modulus 70 GPa છે જ્યારે સ્ટીલનો 200 GPa. Stiffness-મર્યાદિત ભાગ ફરી design કરવો પડે, ફક્ત બદલી નાખવાથી ન થાય.</p><p><b>જવાબ ચકાસો.</b> એકમ ચકાસો: 260 cm3 x 7.85 g/cm3 ગ્રામ આપે, તેથી kg માટે 1000 વડે ભાગો.</p>"}}, {"h": {"en": "Copper or brass for a wire", "gu": "Wire માટે copper કે brass"}, "body": {"en": "<h4>Question (7 marks)</h4><p>A 30 m run of 2.5 mm2 wire is to carry 16 A. Compare the resistance and the power lost if the wire is copper (1.72e-8 ohm m) and if it is brass (6.4e-8 ohm m), and say which one a switchboard uses.</p><h4>Step 1 - the resistance of each</h4><div class=\"math\">R = rho L/A,  A = 2.5 mm2 = 2.5e-6 m2,  L = 30 m\nR(Cu)    = 1.72e-8 x 30/2.5e-6 = 0.2064 ohm\nR(brass) = 6.40e-8 x 30/2.5e-6 = 0.7680 ohm</div><h4>Step 2 - the power lost at 16 A</h4><div class=\"math\">P = I^2 R\nP(Cu)    = 16^2 x 0.2064 = 52.8 W\nP(brass) = 16^2 x 0.7680 = 196.6 W</div><h4>Step 3 - compare</h4><div class=\"math\">resistance ratio = 6.4/1.72 = 3.72\nextra loss = 196.6 - 52.8 = 143.8 W in 30 m of wire\nover a 10 hour day: 1.44 kWh wasted per run</div><div class=\"eq\">0.206 ohm against 0.768 ohm;  52.8 W against 196.6 W;  copper by a factor of 3.7</div><p>A switchboard uses copper, or aluminium where the weight matters more than the loss, and never brass. Brass is for a terminal stud or a plug pin, where its strength and its machinability matter and the current path is a few millimetres long.</p><p><b>Common mistake.</b> Area in mm2 must be converted to m2 before it goes into R = rho L/A, otherwise the answer is a million times too small.</p>", "gu": "<h4>પ્રશ્ન (7 marks)</h4><p>2.5 mm2 ની 30 m લાંબી wire 16 A વહન કરે છે. Wire copper (1.72e-8 ohm m) હોય અને brass (6.4e-8 ohm m) હોય તો resistance અને ગુમાવાતી power સરખાવો, અને switchboard કઈ વાપરે તે કહો.</p><h4>પગલું 1 - દરેકનું resistance</h4><div class=\"math\">R = rho L/A,  A = 2.5 mm2 = 2.5e-6 m2,  L = 30 m\nR(Cu)    = 1.72e-8 x 30/2.5e-6 = 0.2064 ohm\nR(brass) = 6.40e-8 x 30/2.5e-6 = 0.7680 ohm</div><h4>પગલું 2 - 16 A પર ગુમાવાતી power</h4><div class=\"math\">P = I^2 R\nP(Cu)    = 16^2 x 0.2064 = 52.8 W\nP(brass) = 16^2 x 0.7680 = 196.6 W</div><h4>પગલું 3 - સરખામણી</h4><div class=\"math\">resistance ratio = 6.4/1.72 = 3.72\nextra loss = 196.6 - 52.8 = 143.8 W in 30 m of wire\nover a 10 hour day: 1.44 kWh wasted per run</div><div class=\"eq\">0.206 ohm against 0.768 ohm;  52.8 W against 196.6 W;  copper by a factor of 3.7</div><p>Switchboard copper વાપરે, અથવા જ્યાં ગુમાવેલા power કરતાં વજન વધુ મહત્વનું હોય ત્યાં aluminium, અને brass કદી નહીં. Brass terminal stud કે plug pin માટે છે, જ્યાં તેની તાકાત અને machining ઉપયોગી છે અને current નો રસ્તો થોડા મિલીમીટરનો છે.</p><p><b>સામાન્ય ભૂલ.</b> R = rho L/A માં નાખતાં પહેલાં mm2 નું area m2 માં ફેરવવું પડે, નહીં તો જવાબ દસ લાખ ગણો નાનો આવે.</p>"}}, {"h": {"en": "From weight per cent to atomic per cent", "gu": "Weight ટકા થી atomic ટકા"}, "body": {"en": "<h4>Question (6 marks)</h4><p>A 70/30 brass and a gunmetal of composition Cu 88, Sn 10, Zn 2 are given by weight. Convert both to atomic per cent (Cu 63.55, Zn 65.38, Sn 118.71) and say why a metallurgist prefers the atomic figure.</p><h4>Step 1 - moles in 100 g of brass</h4><div class=\"math\">n(Cu) = 70/63.55 = 1.1015 mol\nn(Zn) = 30/65.38 = 0.4589 mol\ntotal  = 1.5604 mol</div><h4>Step 2 - atomic per cent of the brass</h4><div class=\"math\">Cu = 1.1015/1.5604 x 100 = 70.6 at %\nZn = 0.4589/1.5604 x 100 = 29.4 at %</div><h4>Step 3 - the gunmetal</h4><div class=\"math\">n(Cu) = 88/63.55 = 1.3847,  n(Sn) = 10/118.71 = 0.0842,  n(Zn) = 2/65.38 = 0.0306\ntotal = 1.4995 mol\nCu 92.3 at %,  Sn 5.6 at %,  Zn 2.0 at %</div><div class=\"eq\">brass 70.6 / 29.4 at %,  gunmetal 92.3 / 5.6 / 2.0 at %</div><p>A phase diagram, a lattice parameter and a density calculation all count atoms, not grams, so the atomic per cent is the composition you need for any structural argument. A datasheet gives weight per cent because that is what the foundry weighs out.</p><p><b>Check your answer.</b> The atomic percentages must still add to 100: 70.6 + 29.4 = 100.0 and 92.3 + 5.6 + 2.0 = 99.9, which is rounding.</p>", "gu": "<h4>પ્રશ્ન (6 marks)</h4><p>70/30 brass અને Cu 88, Sn 10, Zn 2 ના gunmetal વજન પ્રમાણે આપેલા છે. બંનેને atomic ટકામાં ફેરવો (Cu 63.55, Zn 65.38, Sn 118.71) અને metallurgist atomic આંકડો કેમ પસંદ કરે તે કહો.</p><h4>પગલું 1 - 100 g brass માં moles</h4><div class=\"math\">n(Cu) = 70/63.55 = 1.1015 mol\nn(Zn) = 30/65.38 = 0.4589 mol\ntotal  = 1.5604 mol</div><h4>પગલું 2 - brass ના atomic ટકા</h4><div class=\"math\">Cu = 1.1015/1.5604 x 100 = 70.6 at %\nZn = 0.4589/1.5604 x 100 = 29.4 at %</div><h4>પગલું 3 - gunmetal</h4><div class=\"math\">n(Cu) = 88/63.55 = 1.3847,  n(Sn) = 10/118.71 = 0.0842,  n(Zn) = 2/65.38 = 0.0306\ntotal = 1.4995 mol\nCu 92.3 at %,  Sn 5.6 at %,  Zn 2.0 at %</div><div class=\"eq\">brass 70.6 / 29.4 at %,  gunmetal 92.3 / 5.6 / 2.0 at %</div><p>Phase diagram, lattice parameter અને density ની ગણતરી બધું atoms ગણે, ગ્રામ નહીં, તેથી કોઈ પણ રચનાની દલીલ માટે atomic ટકા જોઈએ. Datasheet વજનના ટકા આપે કારણ કે ફાઉન્ડ્રી તોલે છે તે વજન.</p><p><b>જવાબ ચકાસો.</b> Atomic ટકાનો સરવાળો પણ 100 થવો જોઈએ: 70.6 + 29.4 = 100.0 અને 92.3 + 5.6 + 2.0 = 99.9, જે rounding છે.</p>"}}]}], "diagrams": [{"id": "u3_tree", "title": {"en": "Classification of metals", "gu": "Metals નું વર્ગીકરણ"}, "file": "diagrams/u3_tree.svg", "caption": {"en": "Ferrous means iron-based: steel up to 2.14 % carbon and cast iron above it, split by the carbon content and the graphite shape. Non-ferrous means everything else, one base metal plus what is added to it.", "gu": "Ferrous એટલે iron પર આધારિત: 2.14 % carbon સુધી steel અને તેની ઉપર cast iron, જે carbon content તથી graphite ના આકાર પ્રમાણે વહેંચાય. Non-ferrous એટલે બાકીનું બધું, એક base metal અને તેમાં ઉમેરેલું."}}, {"id": "u3_carbon", "title": {"en": "Carbon against strength and ductility", "gu": "Carbon સામે તાકાત અને ductility"}, "file": "diagrams/u3_carbon.svg", "caption": {"en": "Raising carbon from 0.1 % to 1.2 % nearly doubles the tensile strength and cuts the elongation from 30 % to 5 %; the best combination is in the middle.", "gu": "Carbon 0.1 % થી 1.2 % કરો તો tensile strength લગભગ બમણી થાય અને elongation 30 % થી 5 % થાય; સૌથી સારું સંયોજન વચ્ચે મળે છે."}}, {"id": "u3_ci", "title": {"en": "The four cast irons", "gu": "ચાર cast irons"}, "file": "diagrams/u3_ci.svg", "caption": {"en": "All four cast irons hold more than 2 % carbon; what changes is the shape the carbon takes - flakes, cementite, temper carbon or nodules - and that shape decides the strength.", "gu": "ચારેય cast irons માં 2 % થી વધુ carbon હોય છે; બદલાય છે carbon જે આકાર લે છે - flakes, cementite, temper carbon કે nodules - અને એ આકાર તાકાત નક્કી કરે છે."}}, {"id": "u3_cu", "title": {"en": "Copper and its alloys", "gu": "Copper અને તેના alloys"}, "file": "diagrams/u3_cu.svg", "caption": {"en": "Zinc raises the strength of copper and destroys its conductivity at the same time, so electrical work uses copper and bearing work uses bronze.", "gu": "Zinc copper ની તાકાત વધારે અને તે જ વખતે વાહકતા નષ્ટ કરે, તેથી electrical કામમાં copper અને bearing ના કામમાં bronze વપરાય."}}, {"id": "u3_desig", "title": {"en": "Steels a workshop orders", "gu": "Workshop માં ઓર્ડર થતાં સ્ટીલ"}, "file": "diagrams/u3_desig.svg", "caption": {"en": "A steel is ordered by its designation, and the number in the middle is the carbon in hundredths of a per cent.", "gu": "સ્ટીલ તેના designation થી ઓર્ડર થાય, અને વચ્ચેનો આંકડો ટકાના સોમાં ભાગમાં carbon છે."}}, {"id": "u3_al", "title": {"en": "Aluminium: the eight series", "gu": "Aluminium: આઠ series"}, "file": "diagrams/u3_al.svg", "caption": {"en": "The aluminium series number says which element is the main alloying addition; a series 7 zinc alloy reaches 570 MPa, more than twice what plain carbon steel gives at the same weight.", "gu": "Series નો આંકડો કહે છે કે મુખ્ય alloying ઉમેરો કયો છે; series 7 ના zinc alloys 570 MPa સુધી પહોંચે, જે સરખા વજનના plain carbon steel કરતાં બમણાથી વધુ છે."}}, {"id": "u3_compare", "title": {"en": "Metals against non-metals", "gu": "Metals સામે non-metals"}, "file": "diagrams/u3_compare.svg", "caption": {"en": "Metals and non-metals are separated by one property - whether the outer electrons are free - and every other difference in the table follows from it.", "gu": "Metals અને non-metals એક જ ગુણધર્મથી અલગ પડે - outer electrons મુક્ત છે કે નહીં - અને કોષ્ટકનો બાકીનો દરેક ફરક એમાંથી આવે છે."}}], "equations": [{"title": {"en": "Composition and density", "gu": "Composition અને density"}, "items": [{"name": {"en": "Weight per cent", "gu": "Weight ટકા"}, "f": "w(i) % = m(i)/sum(m) x 100", "terms": {"en": "How every alloy composition in a datasheet is written.", "gu": "Datasheet માં દરેક alloy composition આમ જ લખાય છે."}}, {"name": {"en": "Atomic per cent", "gu": "Atomic ટકા"}, "f": "at(i) % = (w(i)/A(i))/sum(w/A) x 100", "terms": {"en": "A is the atomic mass; needed whenever atoms, not grams, do the work.", "gu": "A એ atomic mass; જ્યાં atoms કામ કરે ત્યાં grams નહીં, આ જોઈએ."}}, {"name": {"en": "Density of an alloy", "gu": "Alloy ની density"}, "f": "1/rho = sum(w(i)/rho(i))", "terms": {"en": "Volume-additive estimate; 2 to 3 % low when the atoms pack better than ideal.", "gu": "Volume-ઉમેરાતો અંદાજ; atoms આદર્શ કરતાં સારા ગોઠવાય તો 2-3 % ઓછો આવે."}}, {"name": {"en": "Carbon equivalent of a cast iron", "gu": "Cast iron નું carbon equivalent"}, "f": "CE = %C + (%Si + %P)/3", "terms": {"en": "Silicon graphitises a third as strongly as carbon; CE near 4.3 casts best.", "gu": "Silicon, carbon ના ત્રીજા ભાગ જેટલું graphitise કરે; CE 4.3 ની આસપાસ સૌથી સારું cast થાય."}}]}, {"title": {"en": "Selection numbers", "gu": "પસંદગીના આંકડા"}, "items": [{"name": {"en": "Specific strength", "gu": "Specific strength"}, "f": "specific strength = UTS/rho", "terms": {"en": "MPa/(g/cm3) is the same number as kN m/kg; the fair comparison for weight.", "gu": "MPa/(g/cm3) એ kN m/kg જ છે; વજન માટેની ન્યાયી સરખામણી."}}, {"name": {"en": "Conductivity in IACS", "gu": "IACS માં વાહકતા"}, "f": "%IACS = sigma/5.8e7 x 100", "terms": {"en": "5.8e7 S/m is annealed copper; brass 70/30 is 28 % of it.", "gu": "5.8e7 S/m એ annealed copper છે; brass 70/30 તેના 28 % જેટલું."}}, {"name": {"en": "Mass from volume", "gu": "Volume પરથી દળ"}, "f": "m = rho V", "terms": {"en": "Steel 7.85, cast iron 7.2, copper 8.96, aluminium 2.70 g/cm3.", "gu": "આંકડા: steel 7.85, cast iron 7.2, copper 8.96, aluminium 2.70 g/cm3."}}]}, {"title": {"en": "Steel", "gu": "Steel"}, "items": [{"name": {"en": "The carbon bands", "gu": "Carbon ના પટ્ટા"}, "f": "low <= 0.30 %;  medium 0.30 - 0.60 %;  high 0.60 - 2.14 %", "terms": {"en": "Steel ends at 2.14 % C; cast iron runs from there to 6.67 %.", "gu": "Steel 2.14 % C પર પૂરું થાય; cast iron ત્યાંથી 6.67 % સુધી."}}, {"name": {"en": "Stainless steel", "gu": "Stainless steel"}, "f": "Cr >= 12 % for a continuous passive film", "terms": {"en": "18/8 means 18 % Cr and 8 % Ni: austenitic and non-magnetic.", "gu": "18/8 એટલે 18 % Cr અને 8 % Ni: austenitic અને non-magnetic."}}, {"name": {"en": "Reading a designation", "gu": "Designation વાંચવું"}, "f": "C 45 = 0.45 % C;  EN8 is the same steel under the old BS name", "terms": {"en": "The number is the carbon in hundredths of a per cent.", "gu": "આંકડો એટલે ટકાના સોમાં ભાગમાં carbon."}}]}, {"title": {"en": "Cast iron", "gu": "Cast iron"}, "items": [{"name": {"en": "Graphite shape", "gu": "Graphite નો આકાર"}, "f": "flake = grey,  nodule = ductile,  rosette = malleable,  none = white", "terms": {"en": "The shape, not the carbon content, sets the strength.", "gu": "તાકાત carbon content નહીં, આકાર નક્કી કરે."}}, {"name": {"en": "Tension against compression", "gu": "Tension સામે compression"}, "f": "sigma(compression) = 3 to 4 x sigma(tension) for grey iron", "terms": {"en": "A flake is a crack, so it opens in tension and closes in compression.", "gu": "Flake એ તિરાડ છે, તેથી tension માં ખૂલે અને compression માં બંધ થાય."}}, {"name": {"en": "Damping", "gu": "Damping"}, "f": "damping of grey iron = 5 to 10 x that of steel", "terms": {"en": "The reason a lathe bed and a surface plate are cast iron.", "gu": "Lathe bed અને surface plate cast iron કેમ હોય તેનું કારણ."}}]}, {"title": {"en": "Copper and aluminium", "gu": "Copper અને aluminium"}, "items": [{"name": {"en": "The aluminium series", "gu": "Aluminium ની series"}, "f": "series 1 = 99 % Al; 2 = Cu; 3 = Mn; 4 = Si; 5 = Mg; 6 = Mg+Si; 7 = Zn; 8 = other", "terms": {"en": "The number says the main alloying element of a wrought alloy.", "gu": "આંકડો wrought alloy નું મુખ્ય alloying element કહે છે."}}, {"name": {"en": "Temper letters", "gu": "Temper ના અક્ષરો"}, "f": "temper: O = annealed, H = strain hardened, T = solution treated + aged, F = as fabricated", "terms": {"en": "Always written with the alloy: 6061-T6, not 6061.", "gu": "હંમેશા alloy સાથે લખાય: 6061-T6, ફક્ત 6061 નહીં."}}, {"name": {"en": "The conductivity trade-off", "gu": "વાહકતાનો સોદો"}, "f": "Cu 100 % IACS -> brass 70/30 28 % -> bronze 13 %", "terms": {"en": "Every dissolved atom scatters electrons, so strength costs conductivity.", "gu": "દરેક ઓગળેલો atom electrons ને અથડાવે, તેથી તાકાત વાહકતાનો ભોગ લે."}}]}], "viva": [{"title": {"en": "Classification", "gu": "વર્ગીકરણ"}, "items": [{"q": {"en": "What separates steel from cast iron?", "gu": "Steel અને cast iron ને શું વહેંચે છે?"}, "a": {"en": "The carbon content. Up to 2.14 % it is steel, above it cast iron, and 2.14 % is the most carbon austenite can dissolve.", "gu": "Carbon content. 2.14 % સુધી steel, ઉપર cast iron, અને 2.14 % એ austenite ઓગાળી શકે તે વધુમાં વધુ carbon."}}, {"q": {"en": "Give three differences between a metal and a non-metal.", "gu": "Metal અને non-metal વચ્ચે ત્રણ ફરક આપો."}, "a": {"en": "A metal conducts heat and current, is malleable and ductile, and has lustre; a non-metal insulates, is brittle, and is dull. All three come from free electrons.", "gu": "Metal ગરમી અને current વહન કરે, malleable તથી ductile છે, અને lustre ધરાવે; non-metal અવાહક, ભંગુર અને ઝાંખું છે. ત્રણેય free electrons થી આવે."}}, {"q": {"en": "Why is silicon called a metalloid?", "gu": "Silicon ને metalloid કેમ કહે છે?"}, "a": {"en": "It looks like a metal - shiny and grey - but it is brittle and is a semiconductor, not a conductor.", "gu": "તે ધાતુ જેવું દેખાય - ચળકતું અને ભૂખરું - પણ તે ભંગુર છે અને conductor નહીં, semiconductor છે."}}]}, {"title": {"en": "Steels", "gu": "Steels"}, "items": [{"q": {"en": "Why does strength rise with carbon and ductility fall?", "gu": "Carbon વધતાં તાકાત કેમ વધે અને ductility કેમ ઘટે?"}, "a": {"en": "More carbon means more cementite in the pearlite, and cementite is hard and brittle; the ferrite that used to deform is replaced by it.", "gu": "વધુ carbon એટલે pearlite માં વધુ cementite, અને cementite સખત તથી ભંગુર છે; જે ferrite deform થતું હતું તેની જગ્યાએ તે આવે છે."}}, {"q": {"en": "What does EN19 steel contain and where is it used?", "gu": "EN19 સ્ટીલમાં શું છે અને ક્યાં વપરાય?"}, "a": {"en": "0.4 % carbon with about 1 % chromium and 0.25 % molybdenum, so it hardens right through a thick section: gears, crankshafts and axles.", "gu": "0.4 % carbon સાથે લગભગ 1 % chromium અને 0.25 % molybdenum, તેથી જાડો ભાગ પણ આખો harden થાય: gears, crankshafts અને axles."}}, {"q": {"en": "Why is stainless steel called stainless?", "gu": "Stainless steel ને stainless કેમ કહે છે?"}, "a": {"en": "Because its chromium forms a thin passive oxide film that heals itself in air. Without oxygen, or in chloride water, it is not stainless at all.", "gu": "કારણ કે તેનું chromium પાતળું passive oxide પડ બનાવે જે હવામાં પોતાની જાતે સંધાય. Oxygen ન હોય કે chloride વાળા પાણીમાં તે stainless જ નથી."}}]}, {"title": {"en": "Cast irons, copper and aluminium", "gu": "Cast irons, copper અને aluminium"}, "items": [{"q": {"en": "Why is grey cast iron good for a lathe bed?", "gu": "Lathe bed માટે grey cast iron કેમ સારું છે?"}, "a": {"en": "It is loaded in compression, where it is strong; the graphite damps vibration so the finish stays accurate; and the complicated shape is cast, not machined.", "gu": "તેના પર compression નો ભાર હોય જ્યાં તે મજબૂત છે; graphite vibration શોષે તેથી finish ચોક્કસ રહે; અને ગૂંચવાડાભરી આકૃતિ cast થાય, machined નહીં."}}, {"q": {"en": "What is the difference between brass and bronze?", "gu": "Brass અને bronze માં શું ફરક છે?"}, "a": {"en": "Brass is copper with zinc, and bronze is copper with tin; brass is more ductile and cheaper, bronze is harder and better under wear.", "gu": "Brass એ copper સાથે zinc, અને bronze એ copper સાથે tin; brass વધુ ductile અને સસ્તું, bronze વધુ સખત અને wear માં સારું."}}, {"q": {"en": "Why does adding zinc to copper reduce its conductivity?", "gu": "Copper માં zinc ઉમેરતાં વાહકતા કેમ ઘટે છે?"}, "a": {"en": "The zinc atoms are a different size, so they strain the lattice and scatter the conduction electrons; scattering is resistance.", "gu": "Zinc atoms જુદા માપના હોય તેથી lattice તણાય અને conduction electrons અથડાય; અથડામણ એ resistance છે."}}]}, {"title": {"en": "Aluminium", "gu": "Aluminium"}, "items": [{"q": {"en": "What does the 6 in 6061 mean?", "gu": "6061 માં 6 શું કહે છે?"}, "a": {"en": "The main alloying addition is magnesium plus silicon in a series 6 alloy; the other digits identify the particular composition.", "gu": "series 6 alloy માં મુખ્ય alloying ઉમેરો magnesium અને silicon છે; બાકીના અંક ચોક્કસ composition ઓળખે છે."}}, {"q": {"en": "What does the T6 temper mean?", "gu": "T6 temper એટલે શું?"}, "a": {"en": "Solution heat treated, quenched and then artificially aged, so that fine precipitates block dislocations and raise the strength.", "gu": "Solution heat treatment, quench અને પછી artificial ageing, જેથી નાના precipitates dislocation રોકે અને તાકાત વધારે."}}, {"q": {"en": "Why can aluminium not simply replace steel part for part?", "gu": "Aluminium સ્ટીલની જગ્યાએ ભાગ-બદલ ભાગ કેમ ન લઈ શકે?"}, "a": {"en": "It is a third of the density but also a third of the modulus, so a part of the same size deflects three times as much; a strength-limited part must be compared on specific strength.", "gu": "તેની density ત્રીજા ભાગની છે પણ modulus પણ ત્રીજા ભાગનો, તેથી સરખા માપનો ભાગ ત્રણ ગણો વળે; તાકાત-મર્યાદિત ભાગ specific strength પર સરખાવવો પડે."}}]}], "exam_questions": [{"q": {"en": "A 70/30 brass is made by weight from copper (8.96 g/cm3) and zinc (7.14 g/cm3). Estimate its density by adding volumes, compare it with the measured 8.53 g/cm3 and say why the estimate is low.", "gu": "70/30 brass વજન પ્રમાણે copper (8.96 g/cm3) અને zinc (7.14 g/cm3) થી બને છે. Volume ઉમેરીને તેની density નો અંદાજ કાઢો, માપેલા 8.53 g/cm3 સાથે સરખાવો અને અંદાજ ઓછો કેમ આવે તે કહો."}, "marks": 7}, {"q": {"en": "A foundry needs 250 kg of sound 70/30 brass castings. Melting loss is 3 % of the charge. Copper costs Rs 820 per kg and zinc Rs 280 per kg. Find the charge mass and the metal cost of the heat.", "gu": "એક ફાઉન્ડ્રીને 250 kg સાચા 70/30 brass castings જોઈએ. Melting loss charge ના 3 % છે. Copper Rs 820 પ્રતિ kg અને zinc Rs 280 પ્રતિ kg. Charge નું દળ અને heat નો metal ખર્ચ શોધો."}, "marks": 7}, {"q": {"en": "A grey iron contains 3.4 % C, 2.1 % Si and 0.3 % P; a ductile iron contains 3.6 % C, 2.4 % Si and 0.05 % P. Find the carbon equivalent of each and say what it means for casting.", "gu": "એક grey iron માં 3.4 % C, 2.1 % Si અને 0.3 % P છે; એક ductile iron માં 3.6 % C, 2.4 % Si અને 0.05 % P છે. દરેકનું carbon equivalent શોધો અને casting માટે તેનો અર્થ કહો."}, "marks": 6}, {"q": {"en": "A bracket has a volume of 260 cm3 and is made of steel of density 7.85 g/cm3. Find its mass, the mass if it is made of aluminium alloy of density 2.70 g/cm3, and the percentage saved. The steel has UTS 450 MPa and the aluminium alloy 310 MPa - comment on whether the swap is safe at the same dimensions.", "gu": "એક bracket નું volume 260 cm3 છે અને તે 7.85 g/cm3 density ના સ્ટીલનું બનેલું છે. તેનું દળ, 2.70 g/cm3 density ના aluminium alloy નું બન્યું હોય તો દળ, અને થતી ટકાવારી બચત શોધો. સ્ટીલનું UTS 450 MPa અને aluminium alloy નું 310 MPa છે - સરખા માપ પર આ બદલી સલામત છે કે નહીં તે કહો."}, "marks": 6}, {"q": {"en": "A 30 m run of 2.5 mm2 wire is to carry 16 A. Compare the resistance and the power lost if the wire is copper (1.72e-8 ohm m) and if it is brass (6.4e-8 ohm m), and say which one a switchboard uses.", "gu": "2.5 mm2 ની 30 m લાંબી wire 16 A વહન કરે છે. Wire copper (1.72e-8 ohm m) હોય અને brass (6.4e-8 ohm m) હોય તો resistance અને ગુમાવાતી power સરખાવો, અને switchboard કઈ વાપરે તે કહો."}, "marks": 7}, {"q": {"en": "A 70/30 brass and a gunmetal of composition Cu 88, Sn 10, Zn 2 are given by weight. Convert both to atomic per cent (Cu 63.55, Zn 65.38, Sn 118.71) and say why a metallurgist prefers the atomic figure.", "gu": "70/30 brass અને Cu 88, Sn 10, Zn 2 ના gunmetal વજન પ્રમાણે આપેલા છે. બંનેને atomic ટકામાં ફેરવો (Cu 63.55, Zn 65.38, Sn 118.71) અને metallurgist atomic આંકડો કેમ પસંદ કરે તે કહો."}, "marks": 6}], "learning_outcomes": [{"en": "Understand classification, properties and applications of various metallic materials.", "gu": "વિવિધ ધાતુઈ સામગ્રીનું વર્ગીકરણ, ગુણધર્મો અને ઉપયોગ સમજવા."}], "course_outcomes": ["CO3"], "practical_numbers": [1, 3], "content_kind": "theory", "lesson_count": 15, "answered_practice_count": 6, "assessment_note": {"en": "Official course: theory ESE 70 + PA 30 and practical PA 20 + ESE 30 = 150 marks, 4 credits (3 lecture + 2 practical), 45 teaching hours. This unit carries 17 % weightage, 8 of the printed unit hours and 12 of the 70 theory marks. The six numericals of section 3.6 are original revision problems with suggested marks, not GTU papers; the metal prices in one of them are assumptions, stated as such.", "gu": "અધિકૃત course: theory ESE 70 + PA 30 અને practical PA 20 + ESE 30 = 150 marks, 4 credits (3 lecture + 2 practical), 45 teaching hours. આ unit નું weightage 17 %, છપાયેલા unit hours માંથી 8 અને 70 theory marks માંથી 12 છે. વિભાગ 3.6 ના છ દાખલા revision માટેના મૂળ પ્રશ્નો છે, GTU પેપર નહીં; તેમાંના એકમાં ધાતુના ભાવ ધારેલા છે અને એ સ્પષ્ટ લખેલું છે."}, "question_provenance": "Original solved numericals written for revision; not official past papers", "question_marks_are_suggested": true, "sources": [{"title": "GTU DI01000181 Engineering Materials Science syllabus (uploaded PDF, w.e.f. 2024-25)", "url": "https://syllabus.gtu.ac.in/"}, {"title": "O. P. Khanna - Material Science and Metallurgy, Dhanpat Rai (steels, cast irons, alloys)", "url": "https://www.dhanpatrai.com/"}, {"title": "V. Raghavan - Materials Science and Engineering, Prentice Hall India (alloy systems, non-ferrous metals)", "url": "https://www.pearson.com/"}, {"title": "Substech open materials science reference - cast irons, copper alloys, aluminium alloys", "url": "https://www.substech.com/dokuwiki/doku.php?id=classification_of_metals"}, {"title": "BIS / IS 210 grey iron and IS 1572 aluminium alloy designation data", "url": "https://www.bis.gov.in/"}]};
