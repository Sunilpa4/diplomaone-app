<script>
const U = {"subject": "DI01000121", "unit": 4, "format": "notes", "title": {"en": "Heat and Thermometry", "gu": "ઉષ્મા અને થર્મોમેટ્રી"}, "hours": 8, "weightage": 17, "official": true, "languages": ["en", "gu"], "tabs": ["notes", "diagrams", "equations", "numericals", "viva", "exam"], "intro_text": {"en": "Unit 4 of Applied Physics: heat and temperature and the three modes of transfer; the Kelvin, Celsius and Fahrenheit scales with their conversions; heat capacity and specific heat; mercury and bimetallic thermometers; the coefficient of thermal conductivity with Fourier's law; and the expansion of solids with the coefficient of linear expansion. Seven lecture cards, five diagrams, eighteen fully solved numericals and thirteen answered practice questions.", "gu": "એપ્લાઇડ ફિઝિક્સનું યુનિટ 4: ઉષ્મા અને તાપમાન તથા સંક્રમણની ત્રણ રીતો; કેલ્વિન, સેલ્સિયસ અને ફેરનહીટ માપક્રમ અને તેમનાં રૂપાંતરણ; ઉષ્મા ધારિતા અને વિશિષ્ટ ઉષ્મા; પારા અને બાયમેટાલિક થર્મોમીટર; ઉષ્મીય વાહકતાનો ગુણાંક અને ફોરિયરનો નિયમ; અને ઘનનું પ્રસરણ તથા રેખીય પ્રસરણનો ગુણાંક. સાત પાઠ-કાર્ડ, પાંચ આકૃતિઓ, અઢાર પૂરા ઉકેલાયેલા દાખલા અને તેર ઉત્તરસહિત સરાવ પ્રશ્નો."}, "notes": [{"title": {"en": "1. Heat, Temperature and the Modes of Transfer", "gu": "1. ઉષ્મા, તાપમાન અને સંક્રમણની રીતો"}, "items": [{"h": {"en": "1.1 Heat and temperature are not the same thing", "gu": "1.1 ઉષ્મા અને તાપમાન એક જ વસ્તુ નથી"}, "body": {"en": "<h4>Definitions</h4><p><b>Heat</b> is energy in transit because of a temperature difference; its unit is the joule (J) and the older unit is the calorie (1 cal = 4.186 J). <b>Temperature</b> is the degree of hotness that decides the direction of that flow, measured in kelvin (K).</p><h4>Why the difference matters</h4><table><tr><th>Statement</th><th>True or false</th></tr><tr><td>a bucket of water at 60 °C has more heat than a spoon at 90 °C</td><td>true: heat depends on mass as well as temperature</td></tr><tr><td>heat is stored inside a body</td><td>false: internal energy is stored, heat is only in transit</td></tr><tr><td>two bodies in contact end at the same temperature</td><td>true: this is thermal equilibrium</td></tr></table><h4>Worked example</h4><p>Raising 2 kg of water by 30 K needs Q = m c ΔT = 2 × 4186 × 30 = 2.51 × 10⁵ J, about 60 kcal — the same energy as lifting that water 12.8 km.</p><h4>Common mistake</h4><p>Saying a body 'contains 500 J of heat'. It contains internal energy; 500 J is the heat it gave out or took in.</p>", "gu": "<h4>વ્યાખ્યાઓ</h4><p><b>ઉષ્મા</b> એ તાપમાનના તફાવતને કારણે સ્થાનાંતરિત થતી ઊર્જા છે; તેનો એકમ જૂલ (J) અને જૂનો એકમ કેલરી (1 cal = 4.186 J) છે. <b>તાપમાન</b> એ ગરમીનું માપ છે જે સંક્રમણની દિશા નક્કી કરે, કેલ્વિન (K) માં મપાય.</p><h4>તફાવત કેમ મહત્ત્વનો</h4><table><tr><th>વિધાન</th><th>સાચું કે ખોટું</th></tr><tr><td>60 °C ની ડોલમાં 90 °C ના ચમચા કરતાં વધુ ઉષ્મા છે</td><td>સાચું: ઉષ્મા દળ અને તાપમાન બંને પર આધારિત</td></tr><tr><td>ઉષ્મા શરીરમાં સંગ્રહાય છે</td><td>ખોટું: આંતરિક ઊર્જા સંગ્રહાય, ઉષ્મા ફક્ત સ્થાનાંતરણમાં</td></tr><tr><td>સંપર્કમાં રહેલાં બે શરીર અંતે સમાન તાપમાને આવે</td><td>સાચું: આ ઉષ્મીય સંતુલન છે</td></tr></table><h4>ઉકેલાયેલ દાખલો</h4><p>2 kg પાણીનું તાપમાન 30 K વધારવા Q = m c ΔT = 2 × 4186 × 30 = 2.51 × 10⁵ J જોઈએ, લગભગ 60 kcal — એટલી જ ઊર્જા જેટલી એ પાણીને 12.8 km ઊંચું ઉપાડવા લાગે.</p><h4>સામાન્ય ભૂલ</h4><p>શરીરમાં '500 J ઉષ્મા છે' એમ કહેવું. તેમાં આંતરિક ઊર્જા હોય છે; 500 J એ તેણે આપેલી કે લીધેલી ઉષ્મા છે.</p>"}, "diagram": "u4_transfer", "syllabus_item": "4.1"}, {"h": {"en": "1.2 Conduction, convection and radiation", "gu": "1.2 વહન, સંવહન અને વિકિરણ"}, "body": {"en": "<h4>The three modes</h4><table><tr><th>Mode</th><th>How heat moves</th><th>Needs a medium?</th></tr><tr><td>conduction</td><td>molecules pass energy to neighbours, no bulk motion</td><td>yes, a solid</td></tr><tr><td>convection</td><td>the hot fluid itself moves and carries energy</td><td>yes, a fluid</td></tr><tr><td>radiation</td><td>electromagnetic waves carry energy</td><td>no, works in vacuum</td></tr></table><h4>Where each is used</h4><ul><li>Conduction: the copper base of a cooking pan, or a heat sink on a transistor.</li><li>Convection: a room radiator, a car radiator, or the draught in a chimney.</li><li>Radiation: the Sun's heat reaching the Earth, or an infrared heater.</li></ul><h4>Worked example</h4><p>A 2 mm steel plate of area 0.5 m² with 100 K across it conducts Q/t = k A ΔT/L = 50 × 0.5 × 100/0.002 = 1.25 × 10⁶ W — which is why the same plate in copper (k = 400) would pass eight times more.</p><h4>Common mistake</h4><p>Calling a thermos flask a 'conduction barrier' only. It blocks all three: vacuum stops conduction and convection, and the silvered walls cut radiation.</p>", "gu": "<h4>ત્રણ રીતો</h4><table><tr><th>રીત</th><th>ઉષ્મા કેવી રીતે ચાલે</th><th>માધ્યમ જોઈએ?</th></tr><tr><td>વહન</td><td>અણુઓ પાડોશીને ઊર્જા આપે, પદાર્થ ખસે નહીં</td><td>હા, ઘન</td></tr><tr><td>સંવહન</td><td>ગરમ પ્રવાહી પોતે ખસીને ઊર્જા લઈ જાય</td><td>હા, પ્રવાહી કે વાયુ</td></tr><tr><td>વિકિરણ</td><td>વિદ્યુતચુંબકીય તરંગો ઊર્જા લઈ જાય</td><td>ના, શૂન્યાવકાશમાં પણ</td></tr></table><h4>દરેક ક્યાં વપરાય</h4><ul><li>વહન: રાંધણ તપેલીનો તાંબાનો તળિયો, કે ટ્રાન્ઝિસ્ટર પરનો હીટ સિંક.</li><li>સંવહન: રૂમનો રેડિયેટર, કારનું રેડિયેટર, કે ચિમનીમાંનો ડ્રાફ્ટ.</li><li>વિકિરણ: સૂર્યની ઉષ્મા પૃથ્વી સુધી પહોંચવી, કે ઇન્ફ્રારેડ હીટર.</li></ul><h4>ઉકેલાયેલ દાખલો</h4><p>0.5 m² ક્ષેત્રફળની 2 mm સ્ટીલ પ્લેટ પર 100 K તફાવત હોય તો Q/t = k A ΔT/L = 50 × 0.5 × 100/0.002 = 1.25 × 10⁶ W — તેથી જ એ જ પ્લેટ તાંબામાં (k = 400) આઠ ગણી વધુ પસાર કરે.</p><h4>સામાન્ય ભૂલ</h4><p>થર્મોસ ફ્લાસ્કને ફક્ત 'વહન અવરોધ' કહેવું. તે ત્રણેય રોકે: શૂન્યાવકાશ વહન અને સંવહન અટકાવે, અને ચાંદીવાળી દીવાલો વિકિરણ કાપે.</p>"}, "diagram": "u4_transfer", "syllabus_item": "4.2"}]}, {"title": {"en": "2. Temperature Scales and Thermometers", "gu": "2. તાપમાનના માપક્રમ અને થર્મોમીટર"}, "items": [{"h": {"en": "2.1 Kelvin, Celsius and Fahrenheit", "gu": "2.1 કેલ્વિન, સેલ્સિયસ અને ફેરનહીટ"}, "body": {"en": "<h4>The three scales</h4><table><tr><th>Scale</th><th>Ice point</th><th>Steam point</th><th>Divisions</th></tr><tr><td>Celsius (°C)</td><td>0</td><td>100</td><td>100</td></tr><tr><td>Fahrenheit (°F)</td><td>32</td><td>212</td><td>180</td></tr><tr><td>Kelvin (K)</td><td>273.15</td><td>373.15</td><td>100</td></tr></table><h4>Conversions</h4><p>°F = (9/5) °C + 32 and °C = (5/9)(°F − 32); K = °C + 273.15, so a temperature difference of 1 K equals 1 °C but equals 1.8 °F.</p><h4>Worked example</h4><p>A body at 37 °C is 37 + 273.15 = 310.15 K and (9/5)(37) + 32 = 98.6 °F. The value −40 is the one point where both scales read the same.</p><h4>Common mistake</h4><p>Adding 273 to a temperature difference. Only an absolute temperature is converted; a difference of 20 °C is a difference of 20 K.</p>", "gu": "<h4>ત્રણ માપક્રમ</h4><table><tr><th>માપક્રમ</th><th>બરફ બિંદુ</th><th>વરાળ બિંદુ</th><th>વિભાગ</th></tr><tr><td>સેલ્સિયસ (°C)</td><td>0</td><td>100</td><td>100</td></tr><tr><td>ફેરનહીટ (°F)</td><td>32</td><td>212</td><td>180</td></tr><tr><td>કેલ્વિન (K)</td><td>273.15</td><td>373.15</td><td>100</td></tr></table><h4>રૂપાંતરણ</h4><p>°F = (9/5) °C + 32 અને °C = (5/9)(°F − 32); K = °C + 273.15, તેથી 1 K નો તાપમાન તફાવત 1 °C બરાબર છે પણ 1.8 °F બરાબર છે.</p><h4>ઉકેલાયેલ દાખલો</h4><p>37 °C નું શરીર 37 + 273.15 = 310.15 K અને (9/5)(37) + 32 = 98.6 °F છે. −40 એ એક જ બિંદુ છે જ્યાં બંને માપક્રમ સમાન વાંચે.</p><h4>સામાન્ય ભૂલ</h4><p>તાપમાનના તફાવતમાં 273 ઉમેરવું. ફક્ત નિરપેક્ષ તાપમાનનું રૂપાંતર થાય; 20 °C નો તફાવત 20 K નો તફાવત છે.</p>"}, "diagram": "u4_scales", "syllabus_item": "4.3"}, {"h": {"en": "2.2 Mercury and bimetallic thermometers", "gu": "2.2 પારા અને બાયમેટાલિક થર્મોમીટર"}, "body": {"en": "<h4>Mercury-in-glass</h4><p>A fine bore tube with a mercury bulb. Mercury is used because it does not wet glass, stays liquid from −39 °C to 357 °C and expands evenly; the reading is taken at the top of the column, with the meniscus convex.</p><h4>Bimetallic strip</h4><p>Two metals with different expansion coefficients are riveted together. On heating the pair bends towards the metal that expands less, and that movement switches a contact — the basis of an iron, a thermostat and a fire alarm.</p><table><tr><th>Property</th><th>Mercury thermometer</th><th>Bimetallic strip</th></tr><tr><td>output</td><td>a reading</td><td>mechanical movement</td></tr><tr><td>range</td><td>−39 to 357 °C</td><td>set by the two metals</td></tr><tr><td>use</td><td>clinical and laboratory measurement</td><td>on/off control</td></tr></table><h4>Worked example</h4><p>A brass–iron strip of length 5 cm with a 200 K rise bends by about ΔL = (19 − 12) × 10⁻⁶ × 5 × 200 = 7 × 10⁻³ cm — 0.07 mm of differential movement, enough to open a switch.</p><h4>Common mistake</h4><p>Reading a thermometer immediately after taking it out of the mouth; the column falls before the eye reads it. Read it in place.</p>", "gu": "<h4>પારા-કાચ થર્મોમીટર</h4><p>પાતળી બોરવાળી નળી અને પારાનો બલ્બ. પારો વપરાય કારણ કે તે કાચને ભીનો કરતો નથી, −39 °C થી 357 °C સુધી પ્રવાહી રહે અને સરખી રીતે ફેલાય; વાંચન સ્તંભની ટોચે લેવાય, મેનિસ્કસ બહિર્ગોળ હોય.</p><h4>બાયમેટાલિક પટ્ટી</h4><p>જુદા પ્રસરણ ગુણાંકવાળી બે ધાતુઓ એકબીજા સાથે જોડાય છે. ગરમ કરતાં જોડી ઓછું પ્રસરતી ધાતુ તરફ વળે, અને એ હલનચલન સંપર્ક બદલે — ઇસ્ત્રી, થર્મોસ્ટેટ અને આગ-ચેતવણીનો આધાર.</p><table><tr><th>ગુણધર્મ</th><th>પારા થર્મોમીટર</th><th>બાયમેટાલિક પટ્ટી</th></tr><tr><td>આઉટપુટ</td><td>વાંચન</td><td>યાંત્રિક હલનચલન</td></tr><tr><td>મર્યાદા</td><td>−39 થી 357 °C</td><td>બે ધાતુઓ નક્કી કરે</td></tr><tr><td>ઉપયોગ</td><td>ક્લિનિકલ અને પ્રયોગશાળા માપન</td><td>ચાલુ/બંધ નિયંત્રણ</td></tr></table><h4>ઉકેલાયેલ દાખલો</h4><p>5 cm લાંબી પિત્તળ-લોખંડ પટ્ટી 200 K ગરમ થતાં લગભગ ΔL = (19 − 12) × 10⁻⁶ × 5 × 200 = 7 × 10⁻³ cm વળે — 0.07 mm નું વિભેદક ખસવું, જે સ્વિચ ખોલવા પૂરતું છે.</p><h4>સામાન્ય ભૂલ</h4><p>મોંમાંથી કાઢતાં જ થર્મોમીટર વાંચવું; આંખ વાંચે તે પહેલાં સ્તંભ ઊતરી જાય. તેને જ્યાં છે ત્યાં જ વાંચો.</p>"}, "diagram": "u4_thermometer", "syllabus_item": "4.5"}, {"h": {"en": "2.3 Heat capacity and specific heat", "gu": "2.3 ઉષ્મા ધારિતા અને વિશિષ્ટ ઉષ્મા"}, "body": {"en": "<h4>Definitions</h4><p><b>Heat capacity</b> C = Q/ΔT is the heat needed to raise the whole body by 1 K, in J/K. <b>Specific heat</b> c = Q/(m ΔT) is the heat per unit mass per kelvin, in J/(kg·K).</p><table><tr><th>Substance</th><th>c in J/(kg·K)</th></tr><tr><td>water</td><td>4186</td></tr><tr><td>ice</td><td>2100</td></tr><tr><td>aluminium</td><td>900</td></tr><tr><td>iron</td><td>450</td></tr><tr><td>copper</td><td>390</td></tr><tr><td>lead</td><td>128</td></tr></table><h4>Why water is special</h4><p>Water has one of the highest specific heats, so it is used as a coolant and it makes the sea slow to heat and slow to cool — the reason coastal climates are mild.</p><h4>Worked example</h4><p>Heating 0.5 kg of aluminium from 20 °C to 80 °C needs Q = 0.5 × 900 × 60 = 27 000 J, while the same heat would raise 0.5 kg of water by only 12.9 K.</p><h4>Common mistake</h4><p>Mixing up C and c. Heat capacity belongs to the object (a 2 kg pan), specific heat to the material (aluminium).</p>", "gu": "<h4>વ્યાખ્યાઓ</h4><p><b>ઉષ્મા ધારિતા</b> C = Q/ΔT એ આખા શરીરનું તાપમાન 1 K વધારવા જરૂરી ઉષ્મા છે, J/K માં. <b>વિશિષ્ટ ઉષ્મા</b> c = Q/(m ΔT) એ એકમ દળ દીઠ પ્રતિ કેલ્વિન ઉષ્મા છે, J/(kg·K) માં.</p><table><tr><th>પદાર્થ</th><th>c J/(kg·K) માં</th></tr><tr><td>પાણી</td><td>4186</td></tr><tr><td>બરફ</td><td>2100</td></tr><tr><td>એલ્યુમિનિયમ</td><td>900</td></tr><tr><td>લોખંડ</td><td>450</td></tr><tr><td>તાંબું</td><td>390</td></tr><tr><td>સીસું</td><td>128</td></tr></table><h4>પાણી ખાસ કેમ</h4><p>પાણીની વિશિષ્ટ ઉષ્મા સૌથી વધુમાંથી એક છે, તેથી તે ઠંડક માટે વપરાય અને સમુદ્ર ધીમે ગરમ અને ધીમે ઠંડો થાય — તેથી જ દરિયાકાંઠાનું હવામાન સમશીતોષ્ણ રહે.</p><h4>ઉકેલાયેલ દાખલો</h4><p>0.5 kg એલ્યુમિનિયમ 20 °C થી 80 °C સુધી ગરમ કરવા Q = 0.5 × 900 × 60 = 27 000 J જોઈએ, જ્યારે એટલી જ ઉષ્મા 0.5 kg પાણીનું તાપમાન ફક્ત 12.9 K વધારે.</p><h4>સામાન્ય ભૂલ</h4><p>C અને c ભેગા કરવા. ઉષ્મા ધારિતા વસ્તુની (2 kg તપેલી) અને વિશિષ્ટ ઉષ્મા પદાર્થની (એલ્યુમિનિયમ) હોય છે.</p>"}, "syllabus_item": "4.4"}]}, {"title": {"en": "3. Thermal Conductivity and Expansion", "gu": "3. ઉષ્મીય વાહકતા અને પ્રસરણ"}, "items": [{"h": {"en": "3.1 Coefficient of thermal conductivity", "gu": "3.1 ઉષ્મીય વાહકતાનો ગુણાંક"}, "body": {"en": "<h4>Definition</h4><p>The rate of heat flow through a slab is <b>Q/t = k A ΔT / L</b>, where k is the coefficient of thermal conductivity in W/(m·K). It is numerically the heat passing per second through 1 m² of a 1 m thick slab with 1 K across it.</p><table><tr><th>Material</th><th>k in W/(m·K)</th></tr><tr><td>silver</td><td>430</td></tr><tr><td>copper</td><td>400</td></tr><tr><td>steel</td><td>50</td></tr><tr><td>brick</td><td>0.6</td></tr><tr><td>glass</td><td>0.8</td></tr><tr><td>wood</td><td>0.15</td></tr><tr><td>air (still)</td><td>0.026</td></tr></table><h4>Why air is the best insulator</h4><p>Still air has k about 15 000 times smaller than silver, which is why wool, foam and double glazing work: they trap air and stop it from convecting.</p><h4>Worked example</h4><p>A brick wall 0.2 m thick, 10 m², with 15 K across it loses Q/t = 0.6 × 10 × 15/0.2 = 450 W — the size of a small room heater running all day.</p><h4>Common mistake</h4><p>Forgetting to convert the thickness to metres, or using the temperature of one side instead of the difference ΔT.</p>", "gu": "<h4>વ્યાખ્યા</h4><p>પટ્ટામાંથી ઉષ્મા પ્રવાહનો દર <b>Q/t = k A ΔT / L</b> છે, જ્યાં k ઉષ્મીય વાહકતાનો ગુણાંક W/(m·K) માં છે. આંકડામાં તે 1 m જાડા, 1 m² ક્ષેત્રફળવાળા પટ્ટા પર 1 K તફાવત હોય ત્યારે પ્રતિ સેકન્ડ પસાર થતી ઉષ્મા છે.</p><table><tr><th>પદાર્થ</th><th>k W/(m·K) માં</th></tr><tr><td>ચાંદી</td><td>430</td></tr><tr><td>તાંબું</td><td>400</td></tr><tr><td>સ્ટીલ</td><td>50</td></tr><tr><td>ઇંટ</td><td>0.6</td></tr><tr><td>કાચ</td><td>0.8</td></tr><tr><td>લાકડું</td><td>0.15</td></tr><tr><td>હવા (સ્થિર)</td><td>0.026</td></tr></table><h4>હવા શ્રેષ્ઠ અવાહક કેમ</h4><p>સ્થિર હવાનો k ચાંદી કરતાં લગભગ 15 000 ગણો નાનો છે, તેથી જ ઊન, ફોમ અને બેવડું કાચ કામ કરે: તે હવા પકડી રાખે અને સંવહન અટકાવે.</p><h4>ઉકેલાયેલ દાખલો</h4><p>0.2 m જાડી, 10 m² ની ઇંટની દીવાલ પર 15 K તફાવત હોય તો Q/t = 0.6 × 10 × 15/0.2 = 450 W ગુમાવે — આખો દિવસ ચાલતા નાના રૂમ હીટર જેટલું.</p><h4>સામાન્ય ભૂલ</h4><p>જાડાઈ મીટરમાં ફેરવવાનું ભૂલવું, અથવા તફાવત ΔT ને બદલે એક બાજુનું તાપમાન વાપરવું.</p>"}, "diagram": "u4_conduction", "syllabus_item": "4.6"}, {"h": {"en": "3.2 Expansion of solids and the coefficient of linear expansion", "gu": "3.2 ઘનનું પ્રસરણ અને રેખીય પ્રસરણનો ગુણાંક"}, "body": {"en": "<h4>Definition</h4><p>A rod lengthens by <b>ΔL = α L ΔT</b>, where α is the coefficient of linear expansion in K⁻¹. Area expands as ΔA = 2α A ΔT and volume as ΔV = 3α V ΔT.</p><table><tr><th>Material</th><th>α in 10⁻⁶ K⁻¹</th></tr><tr><td>steel</td><td>12</td></tr><tr><td>iron</td><td>12</td></tr><tr><td>copper</td><td>17</td></tr><tr><td>brass</td><td>19</td></tr><tr><td>aluminium</td><td>23</td></tr><tr><td>invar (alloy)</td><td>1</td></tr></table><h4>Engineering consequences</h4><ul><li>Railway rails are laid with a gap so that summer expansion does not buckle them.</li><li>A bimetallic strip works because α differs between the two metals.</li><li>Invar is used for the pendulum of a precision clock because its α is almost zero.</li></ul><h4>Worked example</h4><p>A 10 m steel rail on a day that is 40 K hotter: ΔL = 12 × 10⁻⁶ × 10 × 40 = 4.8 mm of expansion, so the gap left at laying must be at least 5 mm.</p><h4>Common mistake</h4><p>Using the Celsius value for a Fahrenheit difference, or forgetting that ΔT is a difference and never negative in the formula.</p>", "gu": "<h4>વ્યાખ્યા</h4><p>સળિયાની લંબાઈ <b>ΔL = α L ΔT</b> જેટલી વધે, જ્યાં α રેખીય પ્રસરણનો ગુણાંક K⁻¹ માં છે. ક્ષેત્રફળ ΔA = 2α A ΔT અને ઘનફળ ΔV = 3α V ΔT પ્રમાણે વધે.</p><table><tr><th>પદાર્થ</th><th>α 10⁻⁶ K⁻¹ માં</th></tr><tr><td>સ્ટીલ</td><td>12</td></tr><tr><td>લોખંડ</td><td>12</td></tr><tr><td>તાંબું</td><td>17</td></tr><tr><td>પિત્તળ</td><td>19</td></tr><tr><td>એલ્યુમિનિયમ</td><td>23</td></tr><tr><td>ઇન્વાર (મિશ્રધાતુ)</td><td>1</td></tr></table><h4>ઇજનેરી પરિણામો</h4><ul><li>રેલવે પાટા વચ્ચે જગ્યા રખાય જેથી ઉનાળાનું પ્રસરણ તેમને વાંકા ન કરે.</li><li>બાયમેટાલિક પટ્ટી કામ કરે કારણ કે બે ધાતુઓનો α જુદો હોય.</li><li>ચોક્કસ ઘડિયાળના લોલક માટે ઇન્વાર વપરાય કારણ કે તેનો α લગભગ શૂન્ય છે.</li></ul><h4>ઉકેલાયેલ દાખલો</h4><p>10 m સ્ટીલ પાટો 40 K વધુ ગરમ દિવસે: ΔL = 12 × 10⁻⁶ × 10 × 40 = 4.8 mm પ્રસરે, તેથી નાખતી વખતે ઓછામાં ઓછી 5 mm જગ્યા રાખવી પડે.</p><h4>સામાન્ય ભૂલ</h4><p>ફેરનહીટ તફાવત માટે સેલ્સિયસ મૂલ્ય વાપરવું, અથવા ભૂલવું કે ΔT તફાવત છે અને સૂત્રમાં કદી ઋણ નથી.</p>"}, "diagram": "u4_expansion", "syllabus_item": "4.7"}]}, {"title": {"en": "4. Practice Questions with Model Answers", "gu": "4. સરાવ પ્રશ્નો અને આદર્શ જવાબો"}, "items": [{"h": {"en": "Practice 1. Distinguish heat from temperature and give the unit of each.", "gu": "સરાવ 1. ઉષ્મા અને તાપમાનમાં ભેદ આપો અને દરેકનો એકમ જણાવો."}, "body": {"en": "<p>Heat is energy that flows from a hotter body to a colder one; its SI unit is the joule and 1 cal = 4.186 J. Temperature measures the degree of hotness and its SI unit is the kelvin.</p><p>The same temperature does not mean the same heat: a bucket of water at 60 °C holds more internal energy than a spoon at 90 °C, because heat also depends on mass.</p><p>In equations heat appears as Q = m c ΔT, while temperature appears as ΔT alone. Two bodies in contact stop exchanging heat when their temperatures are equal, not when their heats are equal.</p>", "gu": "<p>ઉષ્મા એ ઊર્જા છે જે ગરમ શરીરથી ઠંડા તરફ વહે; તેનો SI એકમ જૂલ અને 1 cal = 4.186 J. તાપમાન ગરમીનું માપ છે અને તેનો SI એકમ કેલ્વિન છે.</p><p>સમાન તાપમાન એટલે સમાન ઉષ્મા નહીં: 60 °C ની ડોલમાં 90 °C ના ચમચા કરતાં વધુ આંતરિક ઊર્જા હોય, કારણ કે ઉષ્મા દળ પર પણ આધાર રાખે.</p><p>સૂત્રોમાં ઉષ્મા Q = m c ΔT તરીકે આવે, જ્યારે તાપમાન ફક્ત ΔT તરીકે. સંપર્કમાં રહેલાં બે શરીર જ્યારે તેમનાં તાપમાન સમાન થાય ત્યારે ઉષ્મા બદલવાનું બંધ કરે, ઉષ્મા સમાન થાય ત્યારે નહીં.</p>"}}, {"h": {"en": "Practice 2. Explain conduction, convection and radiation with one engineering example each.", "gu": "સરાવ 2. વહન, સંવહન અને વિકિરણ દરેકના એક ઇજનેરી ઉદાહરણ સાથે સમજાવો."}, "body": {"en": "<p>Conduction passes energy molecule to molecule without bulk motion, so it needs a solid medium; the copper base of a pan and a transistor heat sink rely on it.</p><p>Convection carries energy by moving the fluid itself: hot fluid rises and cold fluid sinks. A car radiator and a room radiator both work this way.</p><p>Radiation needs no medium at all, because energy travels as electromagnetic waves; the Sun warming the Earth through vacuum is the standard example, and an infrared heater in a workshop uses the same mechanism.</p>", "gu": "<p>વહન અણુથી અણુ ઊર્જા પસાર કરે, પદાર્થ ખસે નહીં, તેથી તેને ઘન માધ્યમ જોઈએ; તપેલીનો તાંબાનો તળિયો અને ટ્રાન્ઝિસ્ટરનો હીટ સિંક તેના પર આધાર રાખે.</p><p>સંવહન પ્રવાહીને પોતાને ખસેડીને ઊર્જા લઈ જાય: ગરમ પ્રવાહી ઉપર જાય અને ઠંડું નીચે આવે. કારનું રેડિયેટર અને રૂમનું રેડિયેટર બંને એમ કામ કરે.</p><p>વિકિરણને કોઈ માધ્યમની જરૂર જ નથી, કારણ કે ઊર્જા વિદ્યુતચુંબકીય તરંગો તરીકે ચાલે; શૂન્યાવકાશમાંથી સૂર્યની ઉષ્મા પૃથ્વી સુધી પહોંચવી એ મુખ્ય ઉદાહરણ છે, અને કારખાનાનો ઇન્ફ્રારેડ હીટર એ જ રીતે કામ કરે.</p>"}}, {"h": {"en": "Practice 3. Convert 50 °C into K and °F, and state the conversion formulas.", "gu": "સરાવ 3. 50 °C ને K અને °F માં ફેરવો અને સૂત્રો જણાવો."}, "body": {"en": "<p>Formulas: K = °C + 273.15 and °F = (9/5) °C + 32, with the inverse °C = (5/9)(°F − 32).</p><p>For 50 °C: K = 50 + 273.15 = 323.15 K and °F = 90 + 32 = 122 °F.</p><p>Note that only absolute temperatures are shifted by 273.15; a difference of 50 °C is a difference of 50 K but of 90 °F, which is where most conversion errors come from.</p>", "gu": "<p>સૂત્રો: K = °C + 273.15 અને °F = (9/5) °C + 32, તેમજ વ્યસ્ત °C = (5/9)(°F − 32).</p><p>50 °C માટે: K = 50 + 273.15 = 323.15 K અને °F = 90 + 32 = 122 °F.</p><p>ધ્યાન રાખો કે ફક્ત નિરપેક્ષ તાપમાનમાં 273.15 ઉમેરાય; 50 °C નો તફાવત 50 K નો પણ 90 °F નો તફાવત છે, અને મોટા ભાગની ભૂલો ત્યાં જ થાય.</p>"}}, {"h": {"en": "Practice 4. Define specific heat and heat capacity, and explain why water is a good coolant.", "gu": "સરાવ 4. વિશિષ્ટ ઉષ્મા અને ઉષ્મા ધારિતાની વ્યાખ્યા આપો અને પાણી સારું ઠારક કેમ છે તે સમજાવો."}, "body": {"en": "<p>Specific heat c = Q/(m ΔT) is the heat per kilogram per kelvin, in J/(kg·K); heat capacity C = m c = Q/ΔT is the same for a whole object, in J/K.</p><p>Water has c = 4186 J/(kg·K), about ten times that of copper, so for the same heat it warms up far less; that is why it carries heat away in a radiator or a cooling tower.</p><p>Heating 2 kg of water by 30 K takes 2.51 × 10⁵ J, whereas the same energy would raise 2 kg of copper by over 300 K — a useful check when choosing a coolant.</p>", "gu": "<p>વિશિષ્ટ ઊષ્મા c = Q/(m ΔT) એ પ્રતિ કિલોગ્રામ પ્રતિ કેલ્વિન ઉષ્મા છે, J/(kg·K) માં; ઉષ્મા ધારિતા C = m c = Q/ΔT એ આખી વસ્તુ માટે એ જ છે, J/K માં.</p><p>પાણીનો c = 4186 J/(kg·K) છે, તાંબા કરતાં લગભગ દશ ગણો, તેથી એટલી જ ઉષ્મા માટે તે ઘણું ઓછું ગરમ થાય; તેથી જ તે રેડિયેટર કે કૂલિંગ ટાવરમાં ઉષ્મા દૂર લઈ જાય.</p><p>2 kg પાણીનું તાપમાન 30 K વધારવા 2.51 × 10⁵ J જોઈએ, જ્યારે એટલી જ ઊર્જા 2 kg તાંબાનું તાપમાન 300 K થી વધુ વધારે — ઠારક પસંદ કરતી વખતે આ ઉપયોગી ચકાસણી છે.</p>"}}, {"h": {"en": "Practice 5. Describe a mercury thermometer and a bimetallic thermometer with their uses.", "gu": "સરાવ 5. પારા થર્મોમીટર અને બાયમેટાલિક થર્મોમીટર તેમના ઉપયોગ સાથે વર્ણવો."}, "body": {"en": "<p>A mercury thermometer is a glass bulb with a fine uniform bore; the mercury expands up the tube and the reading is taken at the top of the convex column against a graduated scale.</p><p>Mercury suits this because it does not wet glass, is opaque, expands evenly and stays liquid from −39 °C to 357 °C; the range is its main limitation.</p><p>A bimetallic thermometer joins two strips of different α; heating bends the pair and the free end moves a pointer or a switch. It gives no fine number but switches a circuit, so it is used in irons, ovens and fire alarms.</p>", "gu": "<p>પારા થર્મોમીટરમાં કાચનો બલ્બ અને સરખી પાતળી બોર હોય; પારો નળીમાં ઉપર ચઢે અને વાંચન ક્રમાંકિત માપપટ્ટી સામે બહિર્ગોળ સ્તંભની ટોચે લેવાય.</p><p>પારો એટલા માટે યોગ્ય છે કે તે કાચને ભીનો કરતો નથી, અપારદર્શક છે, સરખી રીતે ફેલાય અને −39 °C થી 357 °C સુધી પ્રવાહી રહે; એ શ્રેણી તેની મુખ્ય મર્યાદા છે.</p><p>બાયમેટાલિક થર્મોમીટર જુદા α વાળી બે પટ્ટીઓ જોડે; ગરમ કરતાં જોડી વળે અને મુક્ત છેડો સૂચક કે સ્વિચ ખસેડે. તે સૂક્ષ્મ આંકડો આપતું નથી પણ પરિપથ બદલે, તેથી ઇસ્ત્રી, ઓવન અને આગ-ચેતવણીમાં વપરાય.</p>"}}, {"h": {"en": "Practice 6. Define the coefficient of thermal conductivity and solve one problem with it.", "gu": "સરાવ 6. ઉષ્મીય વાહકતાના ગુણાંકની વ્યાખ્યા આપો અને તેનો એક દાખલો ઉકેલો."}, "body": {"en": "<p>k is the heat conducted per second through 1 m² of a slab 1 m thick when the faces differ by 1 K: Q/t = k A ΔT/L, with k in W/(m·K).</p><p>For a brick wall 0.2 m thick and 10 m² with 15 K across it: Q/t = 0.6 × 10 × 15/0.2 = 450 W.</p><p>Because air has k = 0.026 W/(m·K), the best insulators are materials that trap still air — wool, foam, fibre glass and double glazing — rather than dense solids.</p>", "gu": "<p>k એ 1 K તફાવતવાળા, 1 m જાડા અને 1 m² ક્ષેત્રફળના પટ્ટામાંથી પ્રતિ સેકન્ડ વહેતી ઉષ્મા છે: Q/t = k A ΔT/L, k W/(m·K) માં.</p><p>0.2 m જાડી, 10 m² અને 15 K તફાવતવાળી ઇંટની દીવાલ માટે: Q/t = 0.6 × 10 × 15/0.2 = 450 W.</p><p>હવાનો k = 0.026 W/(m·K) હોવાથી શ્રેષ્ઠ અવાહક એવા પદાર્થો છે જે સ્થિર હવા પકડે — ઊન, ફોમ, ફાઇબર ગ્લાસ અને બેવડું કાચ — ઘન પદાર્થ નહીં.</p>"}}, {"h": {"en": "Practice 7. Explain linear expansion and derive the expression for it from the definition of α.", "gu": "સરાવ 7. રેખીય પ્રસરણ સમજાવો અને α ની વ્યાખ્યામાંથી તેનું સૂત્ર મેળવો."}, "body": {"en": "<p>When a rod of length L is heated through ΔT, experiment shows ΔL ∝ L and ΔL ∝ ΔT for small changes, so ΔL = α L ΔT.</p><p>Here α is the fractional change of length per kelvin, in K⁻¹: α = (ΔL/L)/ΔT. For steel it is 12 × 10⁻⁶ K⁻¹.</p><p>A 10 m rail heated by 40 K therefore grows by 4.8 mm, which is why a gap is left at every joint, and why a bimetallic strip bends when the two metals expand differently.</p>", "gu": "<p>L લંબાઈનો સળિયો ΔT ગરમ થાય ત્યારે પ્રયોગ દર્શાવે કે નાના ફેરફાર માટે ΔL ∝ L અને ΔL ∝ ΔT, તેથી ΔL = α L ΔT.</p><p>અહીં α એ પ્રતિ કેલ્વિન લંબાઈમાં અંશતઃ ફેરફાર છે, K⁻¹ માં: α = (ΔL/L)/ΔT. સ્ટીલ માટે તે 12 × 10⁻⁶ K⁻¹ છે.</p><p>તેથી 10 m પાટો 40 K ગરમ થતાં 4.8 mm વધે, અને તેથી જ દરેક જોડ પર જગ્યા રખાય, અને બે ધાતુઓ જુદી રીતે પ્રસરે ત્યારે બાયમેટાલિક પટ્ટી વળે.</p>"}}, {"h": {"en": "Practice 8. A wall 0.2 m thick loses 450 W through 10 m² with 15 K across it. Find k.", "gu": "સરાવ 8. 0.2 m જાડી દીવાલ 10 m² માંથી 15 K તફાવતે 450 W ગુમાવે છે. k શોધો."}, "body": {"en": "<p>Use Q/t = k A ΔT/L and rearrange for k.</p><p>k = (Q/t) L/(A ΔT) = 450 × 0.2/(10 × 15) = 90/150 = 0.6 W/(m·K).</p><p>That is the handbook value for brick, which confirms the measurement; the same wall in copper would pass about 600 times more heat.</p><p>Note the units: 450 W of heat flow with 90 W·m⁻¹·K⁻¹ of k A ΔT and 0.2 m of length gives 0.6 W/(m·K), and a thicker wall of the same material would cut the loss in proportion.</p>", "gu": "<p>Q/t = k A ΔT/L વાપરો અને k માટે ગોઠવો.</p><p>k = (Q/t) L/(A ΔT) = 450 × 0.2/(10 × 15) = 90/150 = 0.6 W/(m·K).</p><p>આ ઇંટ માટે પુસ્તકનું મૂલ્ય છે, જે માપન ચકાસે; એ જ દીવાલ તાંબાની હોય તો લગભગ 600 ગણી વધુ ઉષ્મા પસાર કરે.</p><p>એકમ ધ્યાનમાં લો: 450 W ઉષ્મા પ્રવાહ, k A ΔT નું 90 W·m⁻¹·K⁻¹ અને 0.2 m લંબાઈ સાથે 0.6 W/(m·K) આપે, અને એ જ પદાર્થની જાડી દીવાલ ખોટ એ જ પ્રમાણમાં ઘટાડે.</p>"}}, {"h": {"en": "Practice 9. Why does a bimetallic strip bend on heating? Give two applications.", "gu": "સરાવ 9. બાયમેટાલિક પટ્ટી ગરમ થતાં કેમ વળે? બે ઉપયોગો આપો."}, "body": {"en": "<p>The two metals have different coefficients of linear expansion, so for the same ΔT one grows more than the other; since they are joined, the pair must curve.</p><p>A brass–iron strip 5 cm long with 200 K rise moves by (19 − 12) × 10⁻⁶ × 0.05 × 200 = 0.07 mm, and a longer strip multiplies that movement.</p><p>Applications: the thermostat in an electric iron, which opens the contact above the set temperature, and the fire alarm or the bimetallic thermometer, where the movement drives a pointer.</p>", "gu": "<p>બે ધાતુઓના રેખીય પ્રસરણ ગુણાંક જુદા હોય, તેથી એ જ ΔT માટે એક બીજા કરતાં વધુ વધે; બંને જોડાયેલા હોવાથી જોડીએ વળવું પડે.</p><p>5 cm લાંબી પિત્તળ-લોખંડ પટ્ટી 200 K વધારે ત્યારે (19 − 12) × 10⁻⁶ × 0.05 × 200 = 0.07 mm ખસે, અને લાંબી પટ્ટી એ હલનચલન ગણું કરે.</p><p>ઉપયોગો: ઇલેક્ટ્રિક ઇસ્ત્રીનો થર્મોસ્ટેટ, જે નક્કી કરેલા તાપમાનથી ઉપર સંપર્ક ખોલે, અને આગ-ચેતવણી કે બાયમેટાલિક થર્મોમીટર, જ્યાં હલનચલન સૂચક ચલાવે.</p>"}}, {"h": {"en": "Practice 10. 50 kg of water is heated from 25 °C to 65 °C in 40 minutes. Find the heat and the power.", "gu": "સરાવ 10. 50 kg પાણી 40 મિનિટમાં 25 °C થી 65 °C સુધી ગરમ થાય. ઉષ્મા અને પાવર શોધો."}, "body": {"en": "<p>Q = m c ΔT = 50 × 4186 × 40 = 8.37 × 10⁶ J.</p><p>t = 40 minutes = 2400 s, so P = Q/t = 8.37 × 10⁶/2400 = 3.49 × 10³ W.</p><p>A real geyser is rated higher, about 4 to 5 kW, because the tank and the surroundings also take up heat; the extra rating covers those losses.</p><p>The bill follows the energy, not the power: 3.5 kW for 40 minutes is 2.3 kWh, so the running cost is set by the 8.37 MJ of heat and by the efficiency of the element.</p>", "gu": "<p>Q = m c ΔT = 50 × 4186 × 40 = 8.37 × 10⁶ J.</p><p>t = 40 મિનિટ = 2400 s, તેથી P = Q/t = 8.37 × 10⁶/2400 = 3.49 × 10³ W.</p><p>વાસ્તવિક ગીઝર વધુ ક્ષમતાનું, લગભગ 4 થી 5 kW, હોય છે, કારણ કે ટાંકી અને આસપાસ પણ ઉષ્મા લે; વધારાની ક્ષમતા એ ખોટ પૂરી કરે.</p><p>બિલ પાવરને નહીં પણ ઊર્જાને અનુસરે: 40 મિનિટ માટે 3.5 kW એટલે 2.3 kWh, તેથી ખર્ચ 8.37 MJ ઉષ્મા અને હીટિંગ એલિમેન્ટની કાર્યક્ષમતાથી નક્કી થાય.</p>"}}, {"h": {"en": "Practice 11. Explain why still air is a better insulator than most solids.", "gu": "સરાવ 11. સ્થિર હવા મોટા ભાગના ઘન કરતાં સારું અવાહક કેમ છે તે સમજાવો."}, "body": {"en": "<p>Heat in a gas is carried by molecular collisions, and air molecules are far apart, so the conductivity of still air is only 0.026 W/(m·K), against 400 for copper and 0.6 for brick.</p><p>The catch is that air must be trapped: if it can move, convection carries heat quickly, which is why a single pane of glass is a poor insulator but two panes with a sealed gap are good.</p><p>Wool, foam and fibreglass work the same way: they are mostly air held in small pockets, and their solid part contributes very little conduction.</p>", "gu": "<p>વાયુમાં ઉષ્મા અણુઓની અથડામણથી ચાલે, અને હવાના અણુઓ ઘણા દૂર હોય, તેથી સ્થિર હવાની વાહકતા ફક્ત 0.026 W/(m·K) છે, જ્યારે તાંબાની 400 અને ઇંટની 0.6.</p><p>શરત એ છે કે હવા પકડાયેલી રહે: જો તે ખસી શકે તો સંવહન ઝડપથી ઉષ્મા લઈ જાય, તેથી જ એક પાનાનો કાચ નબળો અવાહક છે પણ સીલબંધ જગ્યાવાળા બે પાના સારા.</p><p>ઊન, ફોમ અને ફાઇબરગ્લાસ એ જ રીતે કામ કરે: તેમાં મોટા ભાગે નાના ખાનાંમાં પકડાયેલી હવા હોય, અને તેમનો ઘન ભાગ વહનમાં ઘણું ઓછું ફાળો આપે.</p>"}}, {"h": {"en": "Practice 12. 2 kg of water at 80 °C is mixed with 3 kg at 20 °C. Find the final temperature.", "gu": "સરાવ 12. 80 °C નું 2 kg પાણી 20 °C ના 3 kg સાથે ભળે છે. અંતિમ તાપમાન શોધો."}, "body": {"en": "<p>Heat lost by the hot water equals heat gained by the cold water: m₁c(80 − θ) = m₂c(θ − 20).</p><p>2(80 − θ) = 3(θ − 20), so 160 − 2θ = 3θ − 60 and 5θ = 220.</p><p>θ = 44 °C; it lies nearer 20 °C than 80 °C because there is more cold water — a quick check that the answer is sensible.</p><p>The specific heat cancels because both masses are water; with two different liquids it does not, and the same working becomes m₁c₁(80 − θ) = m₂c₂(θ − 20), which is how a calorimeter measures an unknown specific heat.</p>", "gu": "<p>ગરમ પાણીની ખોટ = ઠંડા પાણીનો લાભ: m₁c(80 − θ) = m₂c(θ − 20).</p><p>2(80 − θ) = 3(θ − 20), તેથી 160 − 2θ = 3θ − 60 અને 5θ = 220.</p><p>θ = 44 °C; તે 80 °C કરતાં 20 °C ની નજીક છે કારણ કે ઠંડું પાણી વધુ છે — જવાબ વાજબી છે તેની ઝડપી ચકાસણી.</p><p>બંને દળ પાણી હોવાથી વિશિષ્ટ ઉષ્મા રદ થાય; બે જુદા પ્રવાહી હોય તો ન રદ થાય, અને એ જ ગણતરી m₁c₁(80 − θ) = m₂c₂(θ − 20) બને, જે રીતે કેલરીમીટર અજાણી વિશિષ્ટ ઉષ્મા માપે.</p>"}}, {"h": {"en": "Practice 13. Why must the thickness be in metres and ΔT be a difference in Fourier's law?", "gu": "સરાવ 13. ફોરિયરના નિયમમાં જાડાઈ મીટરમાં અને ΔT તફાવત કેમ હોવો જોઈએ?"}, "body": {"en": "<p>The law Q/t = k A ΔT/L is written for SI units, so k in W/(m·K) expects A in m², L in m and a difference in K (or °C, which is the same size).</p><p>Using 2 mm as 2 instead of 0.002 m makes the answer a thousand times too small, a mistake that shows up immediately as a wall losing almost no heat.</p><p>ΔT must be the difference between the two faces, never the temperature of one face, because heat flow depends on the gradient and not on the absolute level.</p><p>The check is the size of the answer: a 10 m² wall with a 15 K difference should lose a few hundred watts. Any result in megawatts, or a wall that loses almost nothing, points to a unit slip rather than to a new effect.</p>", "gu": "<p>નિયમ Q/t = k A ΔT/L SI એકમો માટે લખાયો છે, તેથી W/(m·K) માંનો k એ A ને m², L ને m અને તફાવતને K (કે °C, જે સમાન માપ છે) માં ધારે.</p><p>2 mm ને 0.002 m ને બદલે 2 લેવાથી જવાબ હજાર ગણો નાનો થાય, અને એ ભૂલ તરત દેખાય કે દીવાલ લગભગ ઉષ્મા ગુમાવતી જ નથી.</p><p>ΔT બે સપાટી વચ્ચેનો તફાવત હોવો જોઈએ, એક સપાટીનું તાપમાન નહીં, કારણ કે ઉષ્મા પ્રવાહ પ્રવણતા પર આધાર રાખે, નિરપેક્ષ સ્તર પર નહીં.</p><p>ચકાસણી જવાબના માપમાં છે: 15 K તફાવતવાળી 10 m² દીવાલે થોડા સો વૉટ ગુમાવવા જોઈએ. મેગાવૉટમાં આવતો જવાબ, કે લગભગ કંઈ જ ન ગુમાવતી દીવાલ, નવી અસરને બદલે એકમની ભૂલ દર્શાવે.</p>"}}]}], "diagrams": [{"id": "u4_transfer", "title": {"en": "Conduction, convection and radiation", "gu": "વહન, સંવહન અને વિકિરણ"}, "file": "diagrams/u4_transfer.svg", "caption": {"en": "Conduction needs a solid, convection needs a fluid, radiation needs nothing at all.", "gu": "વહનને ઘન જોઈએ, સંવહનને પ્રવાહી જોઈએ, વિકિરણને કંઈ જ ન જોઈએ."}}, {"id": "u4_scales", "title": {"en": "The three temperature scales side by side", "gu": "ત્રણ તાપમાન માપક્રમ સાથે સાથે"}, "file": "diagrams/u4_scales.svg", "caption": {"en": "180 Fahrenheit degrees cover the same span as 100 Celsius degrees.", "gu": "180 ફેરનહીટ અંશ એ 100 સેલ્સિયસ અંશ જેટલી જ શ્રેણી આવરે."}}, {"id": "u4_conduction", "title": {"en": "Heat flow through a slab", "gu": "પટ્ટામાંથી ઉષ્મા પ્રવાહ"}, "file": "diagrams/u4_conduction.svg", "caption": {"en": "The rate is proportional to the area and the temperature difference, and inversely proportional to the thickness.", "gu": "દર ક્ષેત્રફળ અને તાપમાન તફાવતના સમપ્રમાણમાં, અને જાડાઈના વ્યસ્ત પ્રમાણમાં."}}, {"id": "u4_expansion", "title": {"en": "Expansion of a rod and the bimetallic strip", "gu": "સળિયાનું પ્રસરણ અને બાયમેટાલિક પટ્ટી"}, "file": "diagrams/u4_expansion.svg", "caption": {"en": "The rod grows by α L ΔT; joined to a metal with a smaller α it must bend.", "gu": "સળિયો α L ΔT જેટલો વધે; ઓછા α વાળી ધાતુ સાથે જોડાય તો વળવું પડે."}}, {"id": "u4_thermometer", "title": {"en": "Reading a mercury thermometer", "gu": "પારા થર્મોમીટરનું વાંચન"}, "file": "diagrams/u4_thermometer.svg", "caption": {"en": "The reading is taken at the top of the column, where the meniscus is convex.", "gu": "વાંચન સ્તંભની ટોચે લેવાય, જ્યાં મેનિસ્કસ બહિર્ગોળ હોય."}}], "equations": [{"title": {"en": "Heat and specific heat", "gu": "ઉષ્મા અને વિશિષ્ટ ઉષ્મા"}, "items": [{"name": {"en": "Heat gained or lost", "gu": "મેળવેલી કે ગુમાવેલી ઉષ્મા"}, "f": "Q = m c ΔT", "terms": {"en": "Mass times specific heat times temperature change.", "gu": "દળ × વિશિષ્ટ ઉષ્મા × તાપમાન ફેરફાર."}}, {"name": {"en": "Heat capacity", "gu": "ઉષ્મા ધારિતા"}, "f": "C = m c = Q/ΔT  (J/K)", "terms": {"en": "Belongs to the object, not the material.", "gu": "વસ્તુની હોય, પદાર્થની નહીં."}}, {"name": {"en": "Latent heat", "gu": "ગુપ્ત ઉષ્મા"}, "f": "Q = m L", "terms": {"en": "Heat at constant temperature during a change of state.", "gu": "અવસ્થા બદલાય ત્યારે અચળ તાપમાને લાગતી ઉષ્મા."}}, {"name": {"en": "Calorie", "gu": "કેલરી"}, "f": "1 cal = 4.186 J", "terms": {"en": "Heat to raise 1 g of water by 1 °C.", "gu": "1 g પાણીનું તાપમાન 1 °C વધારવાની ઉષ્મા."}}]}, {"title": {"en": "Thermometry", "gu": "તાપમાનમાપન"}, "items": [{"name": {"en": "Celsius to Fahrenheit", "gu": "સેલ્સિયસથી ફેરનહીટ"}, "f": "°F = (9/5) °C + 32", "terms": {"en": "180 Fahrenheit degrees span the same range as 100 Celsius degrees.", "gu": "180 ફેરનહીટ અંશ એ 100 સેલ્સિયસ અંશ જેટલી જ શ્રેણી છે."}}, {"name": {"en": "Celsius to kelvin", "gu": "સેલ્સિયસથી કેલ્વિન"}, "f": "K = °C + 273.15", "terms": {"en": "0 K is absolute zero, about −273.15 °C.", "gu": "0 K નિરપેક્ષ શૂન્ય છે, લગભગ −273.15 °C."}}]}, {"title": {"en": "Conduction and expansion", "gu": "વહન અને પ્રસરણ"}, "items": [{"name": {"en": "Fourier's law of conduction", "gu": "વહનનો ફોરિયરનો નિયમ"}, "f": "Q/t = k A ΔT / L", "terms": {"en": "Heat per second along a slab of length L.", "gu": "L લંબાઈના પટ્ટા સાથે પ્રતિ સેકન્ડ ઉષ્મા."}}, {"name": {"en": "Linear expansion", "gu": "રેખીય પ્રસરણ"}, "f": "ΔL = α L ΔT", "terms": {"en": "α in K⁻¹, about 12 × 10⁻⁶ for steel.", "gu": "α K⁻¹ માં, સ્ટીલ માટે લગભગ 12 × 10⁻⁶."}}, {"name": {"en": "Area and volume expansion", "gu": "ક્ષેત્રફળ અને ઘનફળ પ્રસરણ"}, "f": "ΔA = 2α A ΔT,  ΔV = 3α V ΔT", "terms": {"en": "The factors 2 and 3 come from the three dimensions.", "gu": "2 અને 3 અવયવ ત્રણ પરિમાણમાંથી આવે."}}]}], "numericals": [{"id": "u4n01", "unit": 4, "h": {"en": "Heat needed to raise 2 kg of water by 30 K.", "gu": "2 kg પાણીનું તાપમાન 30 K વધારવા જરૂરી ઉષ્મા."}, "q": {"en": "Find the heat needed to raise 2 kg of water from 20 °C to 50 °C (c = 4186 J/(kg·K)).", "gu": "2 kg પાણી 20 °C થી 50 °C સુધી ગરમ કરવા જરૂરી ઉષ્મા શોધો (c = 4186 J/(kg·K))."}, "a": {"en": "<h4>Given and assumptions</h4><p>Find the heat needed to raise 2 kg of water from 20 °C to 50 °C (c = 4186 J/(kg·K)).</p><h4>Step-by-step solution</h4><p>Q = m c ΔT</p><p>= 2 × 4186 × 30</p><p>= 2.51 × 10⁵ J (about 60 kcal)</p><h4>Answer</h4><p><b>2.51 × 10⁵ J</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>2 kg પાણી 20 °C થી 50 °C સુધી ગરમ કરવા જરૂરી ઉષ્મા શોધો (c = 4186 J/(kg·K)).</p><h4>પગલાવાર ઉકેલ</h4><p>Q = m c ΔT</p><p>= 2 × 4186 × 30</p><p>= 2.51 × 10⁵ J (લગભગ 60 kcal)</p><h4>જવાબ</h4><p><b>2.51 × 10⁵ J</b></p>"}, "answer": {"en": "2.51 × 10⁵ J", "gu": "2.51 × 10⁵ J"}}, {"id": "u4n02", "unit": 4, "h": {"en": "Specific heat from a measured heat input.", "gu": "માપેલા ઉષ્મા પ્રવેશ પરથી વિશિષ્ટ ઉષ્મા."}, "q": {"en": "0.5 kg of a metal takes 27 000 J to rise by 60 K. Find its specific heat.", "gu": "0.5 kg ધાતુનું તાપમાન 60 K વધારવા 27 000 J જોઈએ. તેની વિશિષ્ટ ઉષ્મા શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>0.5 kg of a metal takes 27 000 J to rise by 60 K. Find its specific heat.</p><h4>Step-by-step solution</h4><p>c = Q/(m ΔT)</p><p>= 27 000/(0.5 × 60)</p><p>= 900 J/(kg·K), the value for aluminium</p><h4>Answer</h4><p><b>900 J/(kg·K)</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>0.5 kg ધાતુનું તાપમાન 60 K વધારવા 27 000 J જોઈએ. તેની વિશિષ્ટ ઉષ્મા શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>c = Q/(m ΔT)</p><p>= 27 000/(0.5 × 60)</p><p>= 900 J/(kg·K), એલ્યુમિનિયમનું મૂલ્ય</p><h4>જવાબ</h4><p><b>900 J/(kg·K)</b></p>"}, "answer": {"en": "900 J/(kg·K)", "gu": "900 J/(kg·K)"}}, {"id": "u4n03", "unit": 4, "h": {"en": "Convert 37 °C into kelvin and Fahrenheit.", "gu": "37 °C ને કેલ્વિન અને ફેરનહીટમાં ફેરવો."}, "q": {"en": "A patient's temperature is 37 °C. Express it in K and in °F.", "gu": "દર્દીનું તાપમાન 37 °C છે. તેને K અને °F માં દર્શાવો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A patient's temperature is 37 °C. Express it in K and in °F.</p><h4>Step-by-step solution</h4><p>K = °C + 273.15 = 310.15 K</p><p>°F = (9/5)(37) + 32</p><p>= 66.6 + 32 = 98.6 °F</p><h4>Answer</h4><p><b>310.15 K and 98.6 °F</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>દર્દીનું તાપમાન 37 °C છે. તેને K અને °F માં દર્શાવો.</p><h4>પગલાવાર ઉકેલ</h4><p>K = °C + 273.15 = 310.15 K</p><p>°F = (9/5)(37) + 32</p><p>= 66.6 + 32 = 98.6 °F</p><h4>જવાબ</h4><p><b>310.15 K અને 98.6 °F</b></p>"}, "answer": {"en": "310.15 K and 98.6 °F", "gu": "310.15 K અને 98.6 °F"}}, {"id": "u4n04", "unit": 4, "h": {"en": "The temperature at which °C equals °F.", "gu": "જે તાપમાને °C અને °F સમાન થાય."}, "q": {"en": "At what temperature do the Celsius and Fahrenheit scales read the same number?", "gu": "કયા તાપમાને સેલ્સિયસ અને ફેરનહીટ માપક્રમ સમાન આંકડો વાંચે?"}, "a": {"en": "<h4>Given and assumptions</h4><p>At what temperature do the Celsius and Fahrenheit scales read the same number?</p><h4>Step-by-step solution</h4><p>Set x = (9/5)x + 32</p><p>x − 1.8x = 32, so −0.8x = 32</p><p>x = −40, so −40 °C = −40 °F</p><h4>Answer</h4><p><b>−40°</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>કયા તાપમાને સેલ્સિયસ અને ફેરનહીટ માપક્રમ સમાન આંકડો વાંચે?</p><h4>પગલાવાર ઉકેલ</h4><p>x = (9/5)x + 32 મૂકો</p><p>x − 1.8x = 32, તેથી −0.8x = 32</p><p>x = −40, તેથી −40 °C = −40 °F</p><h4>જવાબ</h4><p><b>−40°</b></p>"}, "answer": {"en": "−40°", "gu": "−40°"}}, {"id": "u4n05", "unit": 4, "h": {"en": "Heat conducted through a steel plate.", "gu": "સ્ટીલ પ્લેટમાંથી વહેતી ઉષ્મા."}, "q": {"en": "A steel plate 2 mm thick and 0.5 m² in area has 100 K across it (k = 50 W/(m·K)). Find the heat flow per second.", "gu": "2 mm જાડી અને 0.5 m² ક્ષેત્રફળની સ્ટીલ પ્લેટ પર 100 K તફાવત છે (k = 50 W/(m·K)). પ્રતિ સેકન્ડ ઉષ્મા પ્રવાહ શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A steel plate 2 mm thick and 0.5 m² in area has 100 K across it (k = 50 W/(m·K)). Find the heat flow per second.</p><h4>Step-by-step solution</h4><p>Q/t = k A ΔT/L</p><p>= 50 × 0.5 × 100/0.002</p><p>= 1.25 × 10⁶ W</p><h4>Answer</h4><p><b>1.25 × 10⁶ W</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>2 mm જાડી અને 0.5 m² ક્ષેત્રફળની સ્ટીલ પ્લેટ પર 100 K તફાવત છે (k = 50 W/(m·K)). પ્રતિ સેકન્ડ ઉષ્મા પ્રવાહ શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>Q/t = k A ΔT/L</p><p>= 50 × 0.5 × 100/0.002</p><p>= 1.25 × 10⁶ W</p><h4>જવાબ</h4><p><b>1.25 × 10⁶ W</b></p>"}, "answer": {"en": "1.25 × 10⁶ W", "gu": "1.25 × 10⁶ W"}}, {"id": "u4n06", "unit": 4, "h": {"en": "Heat loss through a brick wall.", "gu": "ઇંટની દીવાલમાંથી ઉષ્મા ખોટ."}, "q": {"en": "A brick wall (k = 0.6 W/(m·K)) is 0.2 m thick and 10 m² in area, with 15 K across it. Find the rate of heat loss.", "gu": "0.6 W/(m·K) વાહકતાવાળી ઇંટની દીવાલ 0.2 m જાડી અને 10 m² ક્ષેત્રફળની છે, તેના પર 15 K તફાવત છે. ઉષ્મા ખોટનો દર શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A brick wall (k = 0.6 W/(m·K)) is 0.2 m thick and 10 m² in area, with 15 K across it. Find the rate of heat loss.</p><h4>Step-by-step solution</h4><p>Q/t = 0.6 × 10 × 15/0.2</p><p>= 90/0.2</p><p>= 450 W</p><h4>Answer</h4><p><b>450 W</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>0.6 W/(m·K) વાહકતાવાળી ઇંટની દીવાલ 0.2 m જાડી અને 10 m² ક્ષેત્રફળની છે, તેના પર 15 K તફાવત છે. ઉષ્મા ખોટનો દર શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>Q/t = 0.6 × 10 × 15/0.2</p><p>= 90/0.2</p><p>= 450 W</p><h4>જવાબ</h4><p><b>450 W</b></p>"}, "answer": {"en": "450 W", "gu": "450 W"}}, {"id": "u4n07", "unit": 4, "h": {"en": "Thickness of insulation for a given loss.", "gu": "આપેલી ખોટ માટે અવાહકની જાડાઈ."}, "q": {"en": "What thickness of brick (k = 0.6) keeps the loss through 20 m² below 300 W with 20 K across it?", "gu": "20 K તફાવતે 20 m² માંથી ખોટ 300 W થી નીચે રાખવા 0.6 વાહકતાવાળી ઇંટની કેટલી જાડાઈ જોઈએ?"}, "a": {"en": "<h4>Given and assumptions</h4><p>What thickness of brick (k = 0.6) keeps the loss through 20 m² below 300 W with 20 K across it?</p><h4>Step-by-step solution</h4><p>L = k A ΔT/(Q/t)</p><p>= 0.6 × 20 × 20/300</p><p>= 240/300 = 0.8 m</p><h4>Answer</h4><p><b>0.8 m</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>20 K તફાવતે 20 m² માંથી ખોટ 300 W થી નીચે રાખવા 0.6 વાહકતાવાળી ઇંટની કેટલી જાડાઈ જોઈએ?</p><h4>પગલાવાર ઉકેલ</h4><p>L = k A ΔT/(Q/t)</p><p>= 0.6 × 20 × 20/300</p><p>= 240/300 = 0.8 m</p><h4>જવાબ</h4><p><b>0.8 m</b></p>"}, "answer": {"en": "0.8 m", "gu": "0.8 m"}}, {"id": "u4n08", "unit": 4, "h": {"en": "Expansion of a 10 m steel rail.", "gu": "10 m સ્ટીલ પાટાનું પ્રસરણ."}, "q": {"en": "A steel rail 10 m long warms by 40 K (α = 12 × 10⁻⁶ K⁻¹). Find the expansion and the gap needed.", "gu": "10 m લાંબો સ્ટીલ પાટો 40 K ગરમ થાય (α = 12 × 10⁻⁶ K⁻¹). પ્રસરણ અને જરૂરી જગ્યા શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A steel rail 10 m long warms by 40 K (α = 12 × 10⁻⁶ K⁻¹). Find the expansion and the gap needed.</p><h4>Step-by-step solution</h4><p>ΔL = α L ΔT = 12 × 10⁻⁶ × 10 × 40</p><p>= 4.8 × 10⁻³ m</p><p>= 4.8 mm, so a gap of 5 mm is left</p><h4>Answer</h4><p><b>4.8 mm</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>10 m લાંબો સ્ટીલ પાટો 40 K ગરમ થાય (α = 12 × 10⁻⁶ K⁻¹). પ્રસરણ અને જરૂરી જગ્યા શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>ΔL = α L ΔT = 12 × 10⁻⁶ × 10 × 40</p><p>= 4.8 × 10⁻³ m</p><p>= 4.8 mm, તેથી 5 mm જગ્યા રખાય</p><h4>જવાબ</h4><p><b>4.8 mm</b></p>"}, "answer": {"en": "4.8 mm", "gu": "4.8 mm"}}, {"id": "u4n09", "unit": 4, "h": {"en": "Linear expansion of an aluminium rod.", "gu": "એલ્યુમિનિયમ સળિયાનું રેખીય પ્રસરણ."}, "q": {"en": "An aluminium rod 2 m long is heated from 20 °C to 120 °C (α = 23 × 10⁻⁶ K⁻¹). Find its new length.", "gu": "2 m લાંબો એલ્યુમિનિયમ સળિયો 20 °C થી 120 °C સુધી ગરમ થાય (α = 23 × 10⁻⁶ K⁻¹). તેની નવી લંબાઈ શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>An aluminium rod 2 m long is heated from 20 °C to 120 °C (α = 23 × 10⁻⁶ K⁻¹). Find its new length.</p><h4>Step-by-step solution</h4><p>ΔL = 23 × 10⁻⁶ × 2 × 100 = 4.6 × 10⁻³ m</p><p>= 4.6 mm</p><p>New length = 2 + 0.0046 = 2.0046 m</p><h4>Answer</h4><p><b>2.0046 m</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>2 m લાંબો એલ્યુમિનિયમ સળિયો 20 °C થી 120 °C સુધી ગરમ થાય (α = 23 × 10⁻⁶ K⁻¹). તેની નવી લંબાઈ શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>ΔL = 23 × 10⁻⁶ × 2 × 100 = 4.6 × 10⁻³ m</p><p>= 4.6 mm</p><p>નવી લંબાઈ = 2 + 0.0046 = 2.0046 m</p><h4>જવાબ</h4><p><b>2.0046 m</b></p>"}, "answer": {"en": "2.0046 m", "gu": "2.0046 m"}}, {"id": "u4n10", "unit": 4, "h": {"en": "Coefficient α from a measured expansion.", "gu": "માપેલા પ્રસરણ પરથી ગુણાંક α."}, "q": {"en": "A 1.5 m brass rod lengthens by 1.14 mm when heated through 40 K. Find α.", "gu": "1.5 m પિત્તળનો સળિયો 40 K ગરમ થતાં 1.14 mm લાંબો થાય. α શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A 1.5 m brass rod lengthens by 1.14 mm when heated through 40 K. Find α.</p><h4>Step-by-step solution</h4><p>α = ΔL/(L ΔT)</p><p>= 1.14 × 10⁻³/(1.5 × 40)</p><p>= 1.9 × 10⁻⁵ K⁻¹</p><h4>Answer</h4><p><b>1.9 × 10⁻⁵ K⁻¹</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>1.5 m પિત્તળનો સળિયો 40 K ગરમ થતાં 1.14 mm લાંબો થાય. α શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>α = ΔL/(L ΔT)</p><p>= 1.14 × 10⁻³/(1.5 × 40)</p><p>= 1.9 × 10⁻⁵ K⁻¹</p><h4>જવાબ</h4><p><b>1.9 × 10⁻⁵ K⁻¹</b></p>"}, "answer": {"en": "1.9 × 10⁻⁵ K⁻¹", "gu": "1.9 × 10⁻⁵ K⁻¹"}}, {"id": "u4n11", "unit": 4, "h": {"en": "Final temperature when hot and cold water mix.", "gu": "ગરમ અને ઠંડું પાણી ભળે ત્યારે અંતિમ તાપમાન."}, "q": {"en": "2 kg of water at 80 °C is mixed with 3 kg at 20 °C. Find the final temperature, ignoring losses.", "gu": "80 °C નું 2 kg પાણી 20 °C ના 3 kg સાથે ભળે છે. ખોટ ગણ્યા વગર અંતિમ તાપમાન શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>2 kg of water at 80 °C is mixed with 3 kg at 20 °C. Find the final temperature, ignoring losses.</p><h4>Step-by-step solution</h4><p>Heat lost = heat gained: 2 c (80 − θ) = 3 c (θ − 20)</p><p>160 − 2θ = 3θ − 60</p><p>5θ = 220, θ = 44 °C</p><h4>Answer</h4><p><b>44 °C</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>80 °C નું 2 kg પાણી 20 °C ના 3 kg સાથે ભળે છે. ખોટ ગણ્યા વગર અંતિમ તાપમાન શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>ખોટ = લાભ: 2 c (80 − θ) = 3 c (θ − 20)</p><p>160 − 2θ = 3θ − 60</p><p>5θ = 220, θ = 44 °C</p><h4>જવાબ</h4><p><b>44 °C</b></p>"}, "answer": {"en": "44 °C", "gu": "44 °C"}}, {"id": "u4n12", "unit": 4, "h": {"en": "Heat capacity of a copper block.", "gu": "તાંબાના બ્લોકની ઉષ્મા ધારિતા."}, "q": {"en": "Find the heat capacity of a 2 kg copper block (c = 390 J/(kg·K)) and the heat needed to raise it by 50 K.", "gu": "2 kg તાંબાના બ્લોકની ઉષ્મા ધારિતા શોધો (c = 390 J/(kg·K)) અને 50 K વધારવા જરૂરી ઉષ્મા."}, "a": {"en": "<h4>Given and assumptions</h4><p>Find the heat capacity of a 2 kg copper block (c = 390 J/(kg·K)) and the heat needed to raise it by 50 K.</p><h4>Step-by-step solution</h4><p>C = m c = 2 × 390 = 780 J/K</p><p>Q = C ΔT</p><p>= 780 × 50 = 39 000 J</p><h4>Answer</h4><p><b>780 J/K and 39 000 J</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>2 kg તાંબાના બ્લોકની ઉષ્મા ધારિતા શોધો (c = 390 J/(kg·K)) અને 50 K વધારવા જરૂરી ઉષ્મા.</p><h4>પગલાવાર ઉકેલ</h4><p>C = m c = 2 × 390 = 780 J/K</p><p>Q = C ΔT</p><p>= 780 × 50 = 39 000 J</p><h4>જવાબ</h4><p><b>780 J/K અને 39 000 J</b></p>"}, "answer": {"en": "780 J/K and 39 000 J", "gu": "780 J/K અને 39 000 J"}}, {"id": "u4n13", "unit": 4, "h": {"en": "Volume expansion of a copper cube.", "gu": "તાંબાના સમઘનનું ઘનફળ પ્રસરણ."}, "q": {"en": "A copper cube of side 10 cm is heated through 100 K (α = 17 × 10⁻⁶ K⁻¹). Find the increase in volume.", "gu": "10 cm બાજુવાળો તાંબાનો સમઘન 100 K ગરમ થાય (α = 17 × 10⁻⁶ K⁻¹). ઘનફળમાં વધારો શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A copper cube of side 10 cm is heated through 100 K (α = 17 × 10⁻⁶ K⁻¹). Find the increase in volume.</p><h4>Step-by-step solution</h4><p>V = 0.1³ = 1 × 10⁻³ m³</p><p>ΔV = 3α V ΔT = 3 × 17 × 10⁻⁶ × 10⁻³ × 100</p><p>= 5.1 × 10⁻⁶ m³ (5.1 cm³)</p><h4>Answer</h4><p><b>5.1 × 10⁻⁶ m³</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>10 cm બાજુવાળો તાંબાનો સમઘન 100 K ગરમ થાય (α = 17 × 10⁻⁶ K⁻¹). ઘનફળમાં વધારો શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>V = 0.1³ = 1 × 10⁻³ m³</p><p>ΔV = 3α V ΔT = 3 × 17 × 10⁻⁶ × 10⁻³ × 100</p><p>= 5.1 × 10⁻⁶ m³ (5.1 cm³)</p><h4>જવાબ</h4><p><b>5.1 × 10⁻⁶ m³</b></p>"}, "answer": {"en": "5.1 × 10⁻⁶ m³", "gu": "5.1 × 10⁻⁶ m³"}}, {"id": "u4n14", "unit": 4, "h": {"en": "Bimetallic strip movement.", "gu": "બાયમેટાલિક પટ્ટીનું ખસવું."}, "q": {"en": "A brass–iron strip 5 cm long is heated through 200 K. If α(brass) = 19 × 10⁻⁶ and α(iron) = 12 × 10⁻⁶ K⁻¹, find the difference in expansion.", "gu": "5 cm લાંબી પિત્તળ-લોખંડ પટ્ટી 200 K ગરમ થાય. α(પિત્તળ) = 19 × 10⁻⁶ અને α(લોખંડ) = 12 × 10⁻⁶ K⁻¹ હોય તો પ્રસરણનો તફાવત શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A brass–iron strip 5 cm long is heated through 200 K. If α(brass) = 19 × 10⁻⁶ and α(iron) = 12 × 10⁻⁶ K⁻¹, find the difference in expansion.</p><h4>Step-by-step solution</h4><p>ΔL = (α₁ − α₂) L ΔT</p><p>= (19 − 12) × 10⁻⁶ × 0.05 × 200</p><p>= 7 × 10⁻⁵ m = 0.07 mm</p><h4>Answer</h4><p><b>7 × 10⁻⁵ m (0.07 mm)</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>5 cm લાંબી પિત્તળ-લોખંડ પટ્ટી 200 K ગરમ થાય. α(પિત્તળ) = 19 × 10⁻⁶ અને α(લોખંડ) = 12 × 10⁻⁶ K⁻¹ હોય તો પ્રસરણનો તફાવત શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>ΔL = (α₁ − α₂) L ΔT</p><p>= (19 − 12) × 10⁻⁶ × 0.05 × 200</p><p>= 7 × 10⁻⁵ m = 0.07 mm</p><h4>જવાબ</h4><p><b>7 × 10⁻⁵ m (0.07 mm)</b></p>"}, "answer": {"en": "7 × 10⁻⁵ m (0.07 mm)", "gu": "7 × 10⁻⁵ m (0.07 mm)"}}, {"id": "u4n15", "unit": 4, "h": {"en": "Energy to heat water in a geyser.", "gu": "ગીઝરમાં પાણી ગરમ કરવાની ઊર્જા."}, "q": {"en": "A geyser heats 50 kg of water from 25 °C to 65 °C in 40 minutes. Find the power needed.", "gu": "ગીઝર 50 kg પાણીને 40 મિનિટમાં 25 °C થી 65 °C સુધી ગરમ કરે છે. જરૂરી પાવર શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A geyser heats 50 kg of water from 25 °C to 65 °C in 40 minutes. Find the power needed.</p><h4>Step-by-step solution</h4><p>Q = 50 × 4186 × 40 = 8.37 × 10⁶ J</p><p>t = 40 × 60 = 2400 s</p><p>P = Q/t = 3.49 × 10³ W ≈ 3.5 kW</p><h4>Answer</h4><p><b>≈ 3.5 kW</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>ગીઝર 50 kg પાણીને 40 મિનિટમાં 25 °C થી 65 °C સુધી ગરમ કરે છે. જરૂરી પાવર શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>Q = 50 × 4186 × 40 = 8.37 × 10⁶ J</p><p>t = 40 × 60 = 2400 s</p><p>P = Q/t = 3.49 × 10³ W ≈ 3.5 kW</p><h4>જવાબ</h4><p><b>≈ 3.5 kW</b></p>"}, "answer": {"en": "≈ 3.5 kW", "gu": "≈ 3.5 kW"}}, {"id": "u4n16", "unit": 4, "h": {"en": "Temperature rise of oil in a bearing.", "gu": "બેરિંગમાં તેલનું તાપમાન વધવું."}, "q": {"en": "2 kg of oil (c = 2000 J/(kg·K)) absorbs 40 000 J of friction heat. Find the temperature rise.", "gu": "2 kg તેલ (c = 2000 J/(kg·K)) 40 000 J ઘર્ષણ ઉષ્મા લે છે. તાપમાન વધારો શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>2 kg of oil (c = 2000 J/(kg·K)) absorbs 40 000 J of friction heat. Find the temperature rise.</p><h4>Step-by-step solution</h4><p>ΔT = Q/(m c)</p><p>= 40 000/(2 × 2000)</p><p>= 10 K</p><h4>Answer</h4><p><b>10 K</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>2 kg તેલ (c = 2000 J/(kg·K)) 40 000 J ઘર્ષણ ઉષ્મા લે છે. તાપમાન વધારો શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>ΔT = Q/(m c)</p><p>= 40 000/(2 × 2000)</p><p>= 10 K</p><h4>જવાબ</h4><p><b>10 K</b></p>"}, "answer": {"en": "10 K", "gu": "10 K"}}, {"id": "u4n17", "unit": 4, "h": {"en": "Heat flow through a glass window.", "gu": "કાચની બારીમાંથી ઉષ્મા પ્રવાહ."}, "q": {"en": "A glass window of 1.5 m² and 5 mm thickness (k = 0.8 W/(m·K)) has 25 K across it. Find the heat loss per second.", "gu": "1.5 m² ક્ષેત્રફળ અને 5 mm જાડાઈની કાચની બારી (k = 0.8 W/(m·K)) પર 25 K તફાવત છે. પ્રતિ સેકન્ડ ઉષ્મા ખોટ શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A glass window of 1.5 m² and 5 mm thickness (k = 0.8 W/(m·K)) has 25 K across it. Find the heat loss per second.</p><h4>Step-by-step solution</h4><p>Q/t = 0.8 × 1.5 × 25/0.005</p><p>= 30/0.005</p><p>= 6000 W</p><h4>Answer</h4><p><b>6000 W</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>1.5 m² ક્ષેત્રફળ અને 5 mm જાડાઈની કાચની બારી (k = 0.8 W/(m·K)) પર 25 K તફાવત છે. પ્રતિ સેકન્ડ ઉષ્મા ખોટ શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>Q/t = 0.8 × 1.5 × 25/0.005</p><p>= 30/0.005</p><p>= 6000 W</p><h4>જવાબ</h4><p><b>6000 W</b></p>"}, "answer": {"en": "6000 W", "gu": "6000 W"}}, {"id": "u4n18", "unit": 4, "h": {"en": "Fahrenheit reading of 100 °C.", "gu": "100 °C નું ફેરનહીટ વાંચન."}, "q": {"en": "Convert 100 °C and −10 °C into °F.", "gu": "100 °C અને −10 °C ને °F માં ફેરવો."}, "a": {"en": "<h4>Given and assumptions</h4><p>Convert 100 °C and −10 °C into °F.</p><h4>Step-by-step solution</h4><p>°F = (9/5)(100) + 32 = 212 °F</p><p>°F = (9/5)(−10) + 32 = −18 + 32</p><p>= 14 °F</p><h4>Answer</h4><p><b>212 °F and 14 °F</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>100 °C અને −10 °C ને °F માં ફેરવો.</p><h4>પગલાવાર ઉકેલ</h4><p>°F = (9/5)(100) + 32 = 212 °F</p><p>°F = (9/5)(−10) + 32 = −18 + 32</p><p>= 14 °F</p><h4>જવાબ</h4><p><b>212 °F અને 14 °F</b></p>"}, "answer": {"en": "212 °F and 14 °F", "gu": "212 °F અને 14 °F"}}], "viva": [{"title": {"en": "Heat and temperature", "gu": "ઉષ્મા અને તાપમાન"}, "items": [{"q": {"en": "Distinguish heat from temperature.", "gu": "ઉષ્મા અને તાપમાનમાં ભેદ આપો."}, "a": {"en": "Heat is energy in transit due to a temperature difference, measured in joules; temperature is the degree of hotness, measured in kelvin, and it decides the direction of flow.", "gu": "ઉષ્મા એ તાપમાનના તફાવતને કારણે સ્થાનાંતરિત થતી ઊર્જા છે, જૂલમાં મપાય; તાપમાન એ ગરમીનું માપ છે, કેલ્વિનમાં મપાય, અને સંક્રમણની દિશા નક્કી કરે."}}, {"q": {"en": "Name the three modes of heat transfer and one example of each.", "gu": "ઉષ્મા સંક્રમણની ત્રણ રીતો અને દરેકનું એક ઉદાહરણ આપો."}, "a": {"en": "Conduction through a metal spoon in hot tea, convection in a room radiator, and radiation from the Sun reaching the Earth through vacuum.", "gu": "ગરમ ચાના ચમચામાં વહન, રૂમ રેડિયેટરમાં સંવહન, અને શૂન્યાવકાશમાંથી સૂર્યનું વિકિરણ પૃથ્વી સુધી."}}, {"q": {"en": "Why is a thermos flask effective?", "gu": "થર્મોસ ફ્લાસ્ક કેમ અસરકારક છે?"}, "a": {"en": "The vacuum between the walls stops conduction and convection, and the silvered surfaces reflect radiation, so all three modes are blocked.", "gu": "દીવાલો વચ્ચેનો શૂન્યાવકાશ વહન અને સંવહન અટકાવે છે, અને ચાંદીવાળી સપાટીઓ વિકિરણ પરાવર્તે છે, તેથી ત્રણેય રીતો અટકે છે."}}]}, {"title": {"en": "Thermometry", "gu": "તાપમાનમાપન"}, "items": [{"q": {"en": "Why is mercury used in a glass thermometer?", "gu": "કાચના થર્મોમીટરમાં પારો કેમ વપરાય?"}, "a": {"en": "It does not wet glass, it expands uniformly, it is opaque and easy to read, and it stays liquid over a wide range from −39 °C to 357 °C.", "gu": "તે કાચને ભીનો કરતો નથી, સરખી રીતે ફેલાય, અપારદર્શક અને વાંચવા સહેલો છે, અને −39 °C થી 357 °C સુધી પ્રવાહી રહે."}}, {"q": {"en": "How does a bimetallic strip work?", "gu": "બાયમેટાલિક પટ્ટી કેવી રીતે કામ કરે?"}, "a": {"en": "Two metals with different α are joined; on heating the pair bends towards the metal with the smaller expansion, and that bending can open or close a switch.", "gu": "જુદા α વાળી બે ધાતુઓ જોડાય છે; ગરમ કરતાં જોડી ઓછા પ્રસરણવાળી ધાતુ તરફ વળે, અને એ વળવું સ્વિચ ખોલી કે બંધ કરી શકે."}}, {"q": {"en": "Which temperature is the same on both scales?", "gu": "કયું તાપમાન બંને માપક્રમ પર સમાન છે?"}, "a": {"en": "−40°, because −40 °C converts to (9/5)(−40) + 32 = −40 °F.", "gu": "−40°, કારણ કે −40 °C નું (9/5)(−40) + 32 = −40 °F થાય."}}]}, {"title": {"en": "Conduction and expansion", "gu": "વહન અને પ્રસરણ"}, "items": [{"q": {"en": "Define the coefficient of thermal conductivity and give its unit.", "gu": "ઉષ્મીય વાહકતાના ગુણાંકની વ્યાખ્યા અને એકમ આપો."}, "a": {"en": "The heat conducted per second through unit area of unit thickness with unit temperature difference across it, in W/(m·K).", "gu": "એકમ ક્ષેત્રફળ, એકમ જાડાઈ અને એકમ તાપમાન તફાવત માટે પ્રતિ સેકન્ડ વહેતી ઉષ્મા, W/(m·K) માં."}}, {"q": {"en": "Why do gaps get left between railway rails?", "gu": "રેલવે પાટા વચ્ચે જગ્યા કેમ રખાય?"}, "a": {"en": "To leave room for ΔL = α L ΔT in summer; without a gap the expansion would buckle the track sideways.", "gu": "ઉનાળામાં ΔL = α L ΔT માટે જગ્યા રહે તે માટે; જગ્યા ન હોય તો પ્રસરણ પાટાને બાજુમાં વાંકો કરી નાખે."}}, {"q": {"en": "Which metal is the best conductor of heat and why is it not always used?", "gu": "કઈ ધાતુ ઉષ્માની શ્રેષ્ઠ વાહક છે અને તે હંમેશા કેમ વપરાતી નથી?"}, "a": {"en": "Silver, with k = 430 W/(m·K), followed closely by copper at 400; silver is too expensive and soft for pipes and heat sinks, so copper is used instead.", "gu": "ચાંદી, k = 430 W/(m·K), પછી તરત તાંબું 400 સાથે; ચાંદી પાઇપ અને હીટ સિંક માટે બહુ મોંઘી અને નરમ છે, તેથી તેના સ્થાને તાંબું વપરાય."}}, {"q": {"en": "Why is a difference of 1 °C equal to a difference of 1 K?", "gu": "1 °C નો તફાવત 1 K ના તફાવત જેટલો કેમ છે?"}, "a": {"en": "The two scales have the same size of degree and differ only in their zero, so a difference is the same number on both; only absolute readings shift by 273.15.", "gu": "બંને માપક્રમમાં અંશનું માપ સરખું છે અને ફક્ત શૂન્ય જુદું છે, તેથી તફાવત બંનેમાં સમાન આંકડો થાય; ફક્ત નિરપેક્ષ વાંચન 273.15 જેટલું ખસે."}}, {"q": {"en": "Why does a car engine need a radiator and not just a fan?", "gu": "કાર એન્જિનને ફક્ત પંખાને બદલે રેડિયેટર કેમ જોઈએ?"}, "a": {"en": "The fan only moves air; the radiator first passes the heat from the coolant to the metal tubes by conduction and then to the air by convection over a large area, which is what actually removes the heat.", "gu": "પંખો ફક્ત હવા ખસેડે; રેડિયેટર પહેલાં ઠારકની ઉષ્મા વહનથી ધાતુની નળીમાં અને પછી મોટા ક્ષેત્રફળ પર સંવહનથી હવામાં લઈ જાય, અને એ જ ખરેખર ઉષ્મા દૂર કરે."}}, {"q": {"en": "Why is invar used in precision instruments?", "gu": "ચોક્કસ ઉપકરણોમાં ઇન્વાર કેમ વપરાય?"}, "a": {"en": "Its coefficient of linear expansion is about 1 × 10⁻⁶ K⁻¹, roughly twelve times smaller than steel, so its length hardly changes with temperature.", "gu": "તેનો રેખીય પ્રસરણ ગુણાંક લગભગ 1 × 10⁻⁶ K⁻¹ છે, સ્ટીલ કરતાં લગભગ બાર ગણો નાનો, તેથી તેની લંબાઈ તાપમાન સાથે ભાગ્યે જ બદલાય."}}]}], "exam_questions": [{"q": {"en": "Practice: Distinguish heat from temperature and give the unit of each.", "gu": "સરાવ: ઉષ્મા અને તાપમાનમાં ભેદ આપો અને દરેકનો એકમ જણાવો."}, "marks": 3}, {"q": {"en": "Practice: Explain conduction, convection and radiation with one engineering example each.", "gu": "સરાવ: વહન, સંવહન અને વિકિરણ દરેકના એક ઇજનેરી ઉદાહરણ સાથે સમજાવો."}, "marks": 4}, {"q": {"en": "Practice: Convert 50 °C into K and °F, and state the conversion formulas.", "gu": "સરાવ: 50 °C ને K અને °F માં ફેરવો અને સૂત્રો જણાવો."}, "marks": 3}, {"q": {"en": "Practice: Define specific heat and heat capacity, and explain why water is a good coolant.", "gu": "સરાવ: વિશિષ્ટ ઉષ્મા અને ઉષ્મા ધારિતાની વ્યાખ્યા આપો અને પાણી સારું ઠારક કેમ છે તે સમજાવો."}, "marks": 4}, {"q": {"en": "Practi les.", "gu": "4.c તાપમાન માપક્રમો વચ્ચે રૂપાંતરણ કરવું."}, {"en": "4.d Explain heat capacity and specific heat.", "gu": "4.d ઉષ્મા ધારિતા અને વિશિષ્ટ ઉષ્મા સમજાવવી."}, {"en": "4.e Explain thermometers and their uses.", "gu": "4.e થર્મોમીટર અને તેના ઉપયોગ સમજાવવા."}, {"en": "4.f Apply the coefficient of thermal conductivity to engineering problems.", "gu": "4.f ઉષ્મીય વાહકતાનો ગુણાંક ઇજનેરી દાખલામાં લાગુ કરવો."}, {"en": "4.g Explain expansion in solids and the coefficient of linear expansion.", "gu": "4.g ઘનનું પ્રસરણ અને રેખીય પ્રસરણ ગુણાંક સમજાવવો."}], "course_outcomes": ["CO4"], "practical_numbers": [7, 8], "content_kind": "theory", "lesson_count": 7, "answered_practice_count": 13, "assessment_note": {"en": "Official course: theory ESE 70 + PA 30 and practical PA 20 + ESE 30 = 150 marks, 4 credits, 45 teaching hours; this unit carries 17 % weightage, 8 of the 45 hours and 12 of the 70 theory marks (the PDF prints weightage only, so the marks are split by weightage). Practice marks 3/4/5 are suggested revision sizes, not GTU allocations. Model answers are in Notes section 5.", "gu": "અધિકૃત કોર્સ: થિયરી ESE 70 + PA 30 અને પ્રેક્ટિકલ PA 20 + ESE 30 = 150 માર્ક્સ, 4 ક્રેડિટ, 45 શિક્ષણ કલાક; આ યુનિટનું વેઇટેજ 17 %, 45માંથી 8 કલાક અને 70 થિયરી માર્ક્સમાંથી 12 માર્ક્સ (PDFમાં ફક્ત વેઇટેજ છે, તેથી માર્ક્સ વેઇટેજ પ્રમાણે વહેંચ્યા છે). સરાવના 3/4/5 માર્ક્સ સૂચિત પુનરાવર્તન માપ છે, GTU ફાળવણી નહીં. આદર્શ જવાબો નોંધ વિભાગ 5માં છે."}, "question_provenance": "Original answered revision questions; not official past papers", "question_marks_are_suggested": true, "sources": [{"title": "GTU DI01000121 Applied Physics syllabus (uploaded PDF, w.e.f. 2024-25)", "url": "https://syllabus.gtu.ac.in/"}, {"title": "NCERT Physics Class XI, Part II - Thermal Properties of Matter", "url": "https://syllabus.gtu.ac.in/"}, {"title": "H. C. Verma - Concepts of Physics, Vol. II, chapters 23 and 24", "url": "https://syllabus.gtu.ac.in/"}, {"title": "M. N. Avadhanulu - A Textbook of Engineering Phy   return o + esc(src.slice(last));
}
const progBody = p => p.items
  ? p.items.map(it => fixTables(t(it.body)) + (it.diagram?dgInline(it.diagram):'')).join('')
  : `<div class="pl">${L('code')}</div><pre class="code">${hl(t(p.code))}</pre><div class="pl">${L('output')}</div><pre class="out">${esc(p.out)}</pre>${p.plot?`<div class="pl">${L('plot')}</div>`+dgInline(p.plot).replace('class="dg"','class="dg pg"'):''}${p.expl?`<div class="pl">${L('expl')}</div>${fixTables(t(p.expl))}`:''}`;
const pBox = id => { const p=(U.programs||[]).find(x=>x.id===id); if(!p) return ''; return `<div class="pbox"><div class="et">${L('prog')}: ${t(p.title)}</div>${progBody(p)}</div>`; };
const exBox = id => { const n=(U.numericals||[]).find(x=>x.id===id); if(!n) return ''; return `<div class="ex"><div class="et">${L('ex')}</div><div class="eq2">${t(n.q)}</div>${fixTables(t(n.a))}</div>`; };
function notes(){
  let h = `<div class="intro"><b>${t(U.title)}</b><div>${L('unit')} ${U.unit} · ${U.weightage}% ${L('intro')} · ${U.hours} ${L('hours')}</div><div>${U.intro_text ? t(U.intro_text) : L(U.programs?(META.code_lang==='python'?'intropy':'introc'):'introd')}</div></div>`;
  U.notes.forEach((sec,si)=>{
    h += `<div class="sec">${head(t(sec.title))}`;
    sec.items.forEach((it,i)=>{
      const open = si===0&&i===0 ? ' open' : '';
      if (it.h) {
        h += `<div class="card${it.key?' key':''}${open}"><div class="q hd"><span class="t">${it.key?'⭐ ':''}${t(it.h)}</span>${chev}</div>
        <div class="a rn" style="padding-left:18px">${fixTables(t(it.body)).replace(/margin:0 0 10px -36px/g,'')}${it.diagram?dgInline(it.diagram):''}${(it.examples||[]).map(exBox).join('')}${(it.programs||[]).map(pBox).join('')}</div></div>`;
      } else {
        h += `<div class="card${open}"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(it.q)}</span>${chev}</div>
        <div class="a">${fixTables(t(it.a))}${it.diagram?dgInline(it.diagram):''}</div></div>`;
      }
    });
    h += `</div>`;
  });
  return h;
}
function numericals(){
  return `<div class="sec">${head(L('numericals'))}` + (U.numericals||[]).map((n,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(n.q)}</span>${chev}</div><div class="a">${fixTables(t(n.a))}</div></div>`).join('') + `</div>`;
}
function diagrams(){
  return `<div class="sec">${head(L((U.tabs ? U.tabs.includes('flowcharts')&&!U.tabs.includes('diagrams') : U.programs&&META.code_lang!=='python')?'flowcharts':'diagrams'),false)}<div style="height:10px"></div>` + U.diagrams.map((d,i)=>
    `<div class="dcard" data-dg="${d.id}"><div class="h">${i+1}. ${t(d.title)}</div>${SVG[d.id]}</div>`).join('') + `</div>`;
}
function equations(){
  return U.equations.map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><span class="fbox">${e.f}</span></span>${chev}</div>
     <div class="a"><p>${t(e.terms)}</p></div></div>`).join('') + `</div>`).join('');
}
function viva(){
  // two shapes exist in the corpus: flat [{q,a}] and grouped [{title, items:[{q,a}]}]
  const groups = U.viva.every(v=>v && v.q) ? [{items: U.viva}] : U.viva;
  return groups.map(g=>{
    const items = g.items || [];
    return `<div class="sec">${g.title?head(t(g.title)):''}` + items.map((v,i)=>
      `<div class="card"><div class="q hd"><span class="n">${i+1}.</span><span class="t">${t(v.q)}</span>${chev}</div><div class="a"><p>${t(v.a)}</p></div></div>`).join('') + `</div>`;
  }).join('');
}
function exam(){
  return `<div class="sec">${head(L('examhead'),false)}` + U.exam_questions.map((x,i)=>
    `<div class="card"><div class="q" style="cursor:default"><span class="n">${i+1}.</span><span class="t">${t(x.q)}</span><span class="mk">${x.marks} ${L('marks')}</span></div></div>`).join('') + `</div>`;
}
function programs(){
  return `<div class="sec">${head(L('programs'))}` + (U.programs||[]).map((p,i)=>
    `<div class="card"><div class="q hd"><span class="n">${i+1}.</span><span class="t">${t(p.title)}</span>${chev}</div><div class="a pa">${progBody(p)}</div></div>`).join('') + `</div>`;
}
function syntax(key){
  return (U[typeof key==='string'?key:'syntax']||[]).map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><pre class="code sx">${hl(e.f)}</pre></span>${chev}</div>
     <div class="a">${e.terms && t(e.terms) ? fixTables(t(e.terms)) : ''}</div></div>`).join('') + `</div>`).join('');
}
const flowcharts = diagrams;
const algorithms = () => syntax('algorithms');
const ALLV = {notes, programs, diagrams, flowcharts, algorithms, syntax, equations, numericals, viva, exam};
const VIEWS = U.tabs ? Object.fromEntries(U.tabs.map(k=>[k, ALLV[k]])) : U.programs ? (META.code_lang==='python' ? {notes, programs, diagrams, syntax, viva, exam} : {notes, programs, flowcharts, syntax, viva, exam}) : U.numericals ? {notes, diagrams, equations, numericals, viva, exam} : {notes, diagrams, equations, viva, exam};
function render(){
  document.getElementById('title').textContent = `${L('unit')} ${U.unit}: ${t(U.title)}`;
  document.getElementById('sub').textContent = `${t(META.name)} · ${META.code}`;
  document.getElementById('lang').textContent = S.lang==='en' ? 'ગુ' : 'EN';
  document.getElementById('lang').style.display = META.languages.includes('gu') ? '' : 'none';
  document.getElementById('tabs').innerHTML = Object.keys(VIEWS).map(k=>`<button class="tab${S.tab===k?' on':''}" data-tab="${k}">${L(k)}</button>`).join('');
  document.getElementById('view').innerHTML = VIEWS[S.tab]();
  document.querySelectorAll('#view pre.c').forEach(e=>{ e.innerHTML = hl(e.textContent); e.className='code'; });
}
let zoom = 1;
function setZoom(z){ zoom = Math.min(4, Math.max(1, z)); const w=document.getElementById('zw'); w.style.width=(zoom*100)+'%'; document.getElementById('zr').textContent=Math.round(zoom*100)+'%'; }
document.addEventListener('click', e=>{
  const q = e.target.closest('.q'); if (q && q.parentElement.querySelector('.a')) { q.parentElement.classList.toggle('open'); return; }
  const tb = e.target.closest('[data-tab]'); if (tb){ S.tab = tb.dataset.tab; render(); window.scrollTo(0,0); return; }
  if (e.target.closest('#lang')){ S.lang = S.lang==='en'?'gu':'en'; render(); return; }
  const m = e.target.closest('[data-more]');
  document.querySelectorAll('.menu.show').forEach(x=>{ if(!m || x!==m.nextElementSibling) x.classList.remove('show'); });
  if (m){ m.nextElementSibling.classList.toggle('show'); return; }
  const act = e.target.closest('[data-act]');
  if (act){ act.closest('.sec').querySelectorAll('.card').forEach(c=>{ if(c.querySelector('.a')) c.classList.toggle('open', act.dataset.act==='expand'); }); act.parentElement.classList.remove('show'); return; }
  const dg = e.target.closest('[data-dg]');
  if (dg){ const id=dg.dataset.dg; document.getElementById('mt').textContent=t(U.diagrams.find(d=>d.id===id).title); document.getElementById('zw').innerHTML=SVG[id]; setZoom(1); document.getElementById('modal').classList.add('show'); return; }
  if (e.target.closest('#mx')) document.getElementById('modal').classList.remove('show');
  if (e.target.closest('#zi')) setZoom(zoom+0.5);
  if (e.target.closest('#zo')) setZoom(zoom-0.5);
  if (e.target.closest('#zr')) setZoom(1);
});
render();
</script></body></html>
