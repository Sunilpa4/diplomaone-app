 are real server results. This small snapshot simulates time-stamped AI/IoT input, not a live stream, a trained model, an ETL benchmark or placement across multiple machines.</p>"}}, {"id": "ns3p13", "title": {"en": "Small Per-Partition Analytical Features for AI/IoT"}, "code": {"en": "-- Independent private lab; the guarded runner refuses existing keyspaces.\nCREATE KEYSPACE di04000031_u3_ns3p13\nWITH replication = {'class':'NetworkTopologyStrategy',\n                    'datacenter1':1};\nUSE di04000031_u3_ns3p13;\n\nCREATE TABLE readings_by_device_day (\n  device_id text, day date, reading_at timestamp,\n  temperature_c double, status text,\n  PRIMARY KEY ((device_id, day), reading_at)\n) WITH CLUSTERING ORDER BY (reading_at DESC);\nINSERT INTO readings_by_device_day\n  (device_id, day, reading_at, temperature_c, status)\nVALUES ('S01', '2026-10-29', '2026-10-29T09:00:00Z',\n        30.0, 'ok');\nINSERT INTO readings_by_device_day\n  (device_id, day, reading_at, temperature_c, status)\nVALUES ('S01', '2026-10-29', '2026-10-29T09:01:00Z',\n        31.0, 'ok');\nINSERT INTO readings_by_device_day\n  (device_id, day, reading_at, temperature_c, status)\nVALUES ('S01', '2026-10-29', '2026-10-29T09:02:00Z',\n        32.0, 'high');\nINSERT INTO readings_by_device_day\n  (device_id, day, reading_at, temperature_c, status)\nVALUES ('S02', '2026-10-29', '2026-10-29T09:00:00Z',\n        28.0, 'ok');\nINSERT INTO readings_by_device_day\n  (device_id, day, reading_at, temperature_c, status)\nVALUES ('S02', '2026-10-29', '2026-10-29T09:01:00Z',\n        29.0, 'ok');\nINSERT INTO readings_by_device_day\n  (device_id, day, reading_at, temperature_c, status)\nVALUES ('S01', '2026-10-30', '2026-10-30T09:00:00Z',\n        33.0, 'high');\nINSERT INTO readings_by_device_day\n  (device_id, day, reading_at, temperature_c, status)\nVALUES ('S01', '2026-10-30', '2026-10-30T09:01:00Z',\n        34.0, 'high');\nINSERT INTO readings_by_device_day\n  (device_id, day, reading_at, temperature_c, status)\nVALUES ('S03', '2026-10-29', '2026-10-29T09:00:00Z',\n        27.0, 'ok');\n\n-- @result s01_day29_features\nSELECT count(*) AS samples, sum(temperature_c) AS total,\n  avg(temperature_c) AS mean, min(temperature_c) AS minimum,\n  max(temperature_c) AS maximum\nFROM readings_by_device_day\nWHERE device_id='S01' AND day='2026-10-29';\n-- @result s02_day29_features\nSELECT count(*) AS samples, avg(temperature_c) AS mean\nFROM readings_by_device_day\nWHERE device_id='S02' AND day='2026-10-29';\n-- @result s01_day30_features\nSELECT count(*) AS samples, avg(temperature_c) AS mean\nFROM readings_by_device_day\nWHERE device_id='S01' AND day='2026-10-30';\n-- @result s03_day29_features\nSELECT count(*) AS samples, avg(temperature_c) AS mean\nFROM readings_by_device_day\nWHERE device_id='S03' AND day='2026-10-29';\n\n-- Drop only the new keyspace created by this independent example.\nUSE system;\nDROP KEYSPACE di04000031_u3_ns3p13;"}, "out": "s01_day29_features: [{\"samples\":3,\"total\":93.0,\"mean\":31.0,\"minimum\":30.0,\"maximum\":32.0}]\ns02_day29_features: [{\"samples\":2,\"mean\":28.5}]\ns01_day30_features: [{\"samples\":2,\"mean\":33.5}]\ns03_day29_features: [{\"samples\":1,\"mean\":27.0}]\nScratch keyspace removed: true", "expl": {"en": "<p>S01/day29 contains 30,31,32: count 3, total 93, mean 31, minimum 30 and maximum 32. Other means are 28.5, 33.5 and 27.0 in their own selected partitions.</p><p>These bounded aggregates can form input features or simple reports. They do not train a classifier or turn Cassandra into an unrestricted columnar data warehouse. Large scans/analytics need an appropriate workload architecture; eight samples do not establish distributed throughput or real-time guarantees.</p>"}}, {"id": "ns3p14", "title": {"en": "Real Server Rejections: Types, Null Key, ORDER BY and Key Mutation"}, "code": {"en": "-- Independent private lab; the guarded runner refuses existing keyspaces.\nCREATE KEYSPACE di04000031_u3_ns3p14\nWITH replication = {'class':'NetworkTopologyStrategy',\n                    'datacenter1':1};\nUSE di04000031_u3_ns3p14;\n\nCREATE TABLE learners_by_id (\n  learner_id int PRIMARY KEY, name text, city text, marks int\n);\nINSERT INTO learners_by_id (learner_id, name, city, marks)\nVALUES (1, 'Asha', 'Surat', 82);\nINSERT INTO learners_by_id (learner_id, name, city, marks)\nVALUES (2, 'Ravi', 'Bharuch', 70);\nINSERT INTO learners_by_id (learner_id, name, city, marks)\nVALUES (3, 'Neha', 'Surat', 92);\n\n-- @result wrong_int_type\n-- @expect InvalidRequest\nINSERT INTO learners_by_id (learner_id, name) VALUES ('one', 'Invalid');\n-- @result null_primary_key\n-- @expect InvalidRequest\nINSERT INTO learners_by_id (learner_id, name) VALUES (null, 'Invalid');\n-- @result regular_column_ordering\n-- @expect InvalidRequest\nSELECT name, marks FROM learners_by_id WHERE learner_id=1\nORDER BY marks DESC;\n-- @result primary_key_set_rejected\n-- @expect InvalidRequest\nUPDATE learners_by_id SET learner_id=9 WHERE learner_id=1;\n-- @result bad_cql_syntax\n-- @expect SyntaxException\nSELECT FROM learners_by_id;\n-- @result valid_rows_unchanged\nSELECT count(*) AS n FROM learners_by_id;\n-- @result missing_is_empty\nSELECT learner_id, name FROM learners_by_id WHERE learner_id=999;\n\n-- Drop only the new keyspace created by this independent example.\nUSE system;\nDROP KEYSPACE di04000031_u3_ns3p14;"}, "out": "wrong_int_type: InvalidRequest (server rejection)\nnull_primary_key: InvalidRequest (server rejection)\nregular_column_ordering: InvalidRequest (server rejection)\nprimary_key_set_rejected: InvalidRequest (server rejection)\nbad_cql_syntax: SyntaxException (server rejection)\nvalid_rows_unchanged: [{\"n\":3}]\nmissing_is_empty: []\nScratch keyspace removed: true", "expl": {"en": "<p>Expected InvalidRequest and SyntaxException outcomes come from the actual server, not a Python substitute. @expect is a runner annotation inside an ordinary comment, so the intended negative tests are visible to a student.</p><p>Wrong int literals, null primary keys, arbitrary regular-column ordering and SET on a primary-key field are rejected. Three valid rows remain and a missing-key SELECT is empty. A manual cqlsh user should distinguish these deliberate failures from unexpected setup errors.</p>"}}], "diagrams": [{"id": "ns3_arch", "title": {"en": "Peer Nodes and a Per-Request Coordinator"}, "file": "diagrams/ns3_arch.svg"}, {"id": "ns3_setup", "title": {"en": "Installation, Private Access and Connection Evidence"}, "file": "diagrams/ns3_setup.svg"}, {"id": "ns3_hierarchy", "title": {"en": "Keyspace, Table, Partition, Row and Column"}, "file": "diagrams/ns3_hierarchy.svg"}, {"id": "ns3_keys", "title": {"en": "Composite Partition Keys versus Clustering Columns"}, "file": "diagrams/ns3_keys.svg"}, {"id": "ns3_partitions", "title": {"en": "Eight Readings in Four Logical Partitions"}, "file": "diagrams/ns3_partitions.svg"}, {"id": "ns3_query", "title": {"en": "A Selected Partition and Bounded Time Query"}, "file": "diagrams/ns3_query.svg"}, {"id": "ns3_upsert", "title": {"en": "INSERT and UPDATE Have Default Upsert Semantics"}, "file": "diagrams/ns3_upsert.svg"}, {"id": "ns3_delete", "title": {"en": "Cell, Row and Partition Deletion Scopes"}, "file": "diagrams/ns3_delete.svg"}, {"id": "ns3_model", "title": {"en": "Two Query Tables and an Explicit Correction"}, "file": "diagrams/ns3_model.svg"}, {"id": "ns3_filter", "title": {"en": "Rejected Filtering versus a Deliberate Access Path"}, "file": "diagrams/ns3_filter.svg"}, {"id": "ns3_csv", "title": {"en": "CSV Import Must Preserve Full Keys and UTC Times"}, "file": "diagrams/ns3_csv.svg"}, {"id": "ns3_features", "title": {"en": "Small Per-Partition Analytical Features"}, "file": "diagrams/ns3_features.svg"}, {"id": "ns3_health", "title": {"en": "Read-Only nodetool Awareness and UN Interpretation"}, "file": "diagrams/ns3_health.svg"}], "syntax": [{"title": {"en": "Foundations and Private Setup"}, "items": [{"name": {"en": "Server, cqlsh and nodetool"}, "f": "Cassandra = database server\ncqlsh = CQL client shell\nnodetool = management/JMX tool\nreference: one private authenticated node", "terms": {"en": "A shell version is not proof of authorized data access. nodetool status was read-only; no cluster-operations experiment is claimed."}}, {"name": {"en": "Version and connection checks"}, "f": "OS: java -version\nOS: bin/cqlsh --version\ncqlsh: SHOW VERSION;\ncqlsh: SHOW HOST;", "terms": {"en": "Context-labelled commands, not one CQL script. The reference used Cassandra 5.0.9, cqlsh 6.2.0 and CQL 3.4.7. Record actual versions for your lab."}}, {"name": {"en": "Keyspace DDL"}, "f": "CREATE KEYSPACE di04000031_u3_manual\nWITH replication={'class':'NetworkTopologyStrategy',\n                  'datacenter1':1};\nUSE di04000031_u3_manual;\nALTER KEYSPACE di04000031_u3_manual\nWITH durable_writes=true;", "terms": {"en": "Use a newly owned scratch namespace and the actual DC name. RF 1 is the one-node reference, not a production availability recommendation. DROP only your own lab after use."}}, {"name": {"en": "Parentheses define the key"}, "f": "PRIMARY KEY (a,b,c)\n  partition: a; clustering: b,c\nPRIMARY KEY ((a,b),c)\n  partition: a+b; clustering: c", "terms": {"en": "Reference key shapes, not complete CREATE TABLE statements. The full primary key identifies one row; a partition is not a physical machine."}}]}, {"title": {"en": "Typed DDL and CRUD"}, "items": [{"name": {"en": "Sensor table shape"}, "f": "CREATE TABLE readings_by_device_day (\n  device_id text, day date, reading_at timestamp,\n  temperature_c double, status text,\n  PRIMARY KEY ((device_id,day),reading_at)\n) WITH CLUSTERING ORDER BY (reading_at DESC);", "terms": {"en": "Requires an authorized fresh lab keyspace. Both device and day select the intended partition; the time column orders rows inside it."}}, {"name": {"en": "INSERT and UPDATE upserts"}, "f": "INSERT INTO learners_by_id (learner_id,name)\nVALUES (1,'Asha Patel');\nUPDATE learners_by_id SET name='Jai',marks=68\nWHERE learner_id=99;", "terms": {"en": "Assumes the demo schema. The first writes supplied values for an existing identity; the second can create missing data. No normal duplicate-key or matched/modified count is returned."}}, {"name": {"en": "Cell, row and partition deletion"}, "f": "DELETE city FROM learners_by_id\nWHERE learner_id=1;\nDELETE FROM learners_by_id WHERE learner_id=2;\n-- Sensor: device+day+time -> one row.\n-- Sensor: device+day -> selected partition.", "terms": {"en": "The last two comments summarize key scope. Deletes use tombstones; do not equate absence from SELECT with immediate physical erasure. Never use system/application data for this exercise."}}, {"name": {"en": "ALTER and DROP table"}, "f": "ALTER TABLE learner_schema ADD city text;\nALTER TABLE learner_schema DROP city;\nDROP TABLE learner_schema;", "terms": {"en": "Requires the disposable demo table. Old rows initially show null for an added regular column. Key-layout changes are not arbitrary in-place ALTER edits."}}]}, {"title": {"en": "Partition Queries and Modeling"}, "items": [{"name": {"en": "WHERE, IN and projection"}, "f": "SELECT name,city FROM learners_by_id\nWHERE learner_id=2;\nSELECT learner_id,name FROM learners_by_id\nWHERE learner_id IN (1,3);", "terms": {"en": "Known-key queries return selected columns. A missing-key SELECT is empty. IN can fan out; its output is not a global sort by name/marks."}}, {"name": {"en": "Range, ORDER BY and LIMIT"}, "f": "SELECT reading_at,temperature_c\nFROM readings_by_device_day\nWHERE device_id='S01' AND day='2026-10-29'\nORDER BY reading_at ASC LIMIT 2;", "terms": {"en": "This is an allowed reverse clustering order within the selected partition: 30.0 then 31.0. A half-open time range can select contiguous clustering rows."}}, {"name": {"en": "Filtering and query-first access"}, "f": "temperature-only query -> InvalidRequest here\nLIMIT 1 does not legalize that WHERE\nselected tiny partition + ALLOW FILTERING\n  -> residual scan is explicitly permitted\nnew read pattern -> deliberate access table/index", "terms": {"en": "Behaviour summaries, not executable CQL. The allowed demo scans only the known three-row fixture partition; it is not an index or scalable-latency promise."}}]}, {"title": {"en": "Dataset, Analytical Features and Health Awareness"}, "items": [{"name": {"en": "CSV import verification"}, "f": "COPY readings_by_device_day\n(device_id,day,reading_at,temperature_c,status)\nFROM 'sensors.csv' WITH HEADER=TRUE\nAND NUMPROCESSES=1\nAND DATETIMEFORMAT='%Y-%m-%dT%H:%M:%S%z';", "terms": {"en": "cqlsh-only, after table creation. The full program also has explicit error/batch options. Verify all eight stored records and UTC times, not just the import progress count."}}, {"name": {"en": "Small bounded aggregate"}, "f": "SELECT count(*) AS samples,\n  avg(temperature_c) AS mean\nFROM readings_by_device_day\nWHERE device_id='S01' AND day='2026-10-29';", "terms": {"en": "Returns three samples and mean 31.0. sum/min/max add simple features. This is not training, a full warehouse workload or a distributed throughput benchmark."}}, {"name": {"en": "Interpret nodetool status"}, "f": "OS: bin/nodetool status\nU/D = Up/Down\nN/L/J/M = Normal/Leaving/Joining/Moving\nUN = Up/Normal; reference has one node", "terms": {"en": "Read-only awareness. Keep management access private. A UN line is not proof of all application, replica, backup or performance guarantees; do not run repair/decommission for this unit."}}]}], "viva": [{"title": {"en": "Foundations and Keys"}, "items": [{"q": {"en": "What type of NoSQL database is Cassandra?"}, "a": {"en": "A distributed wide-column database with typed CQL tables organized into partitions and clustered rows."}}, {"q": {"en": "Is wide-column the same as a columnar analytical warehouse?"}, "a": {"en": "No. Cassandra is designed around partition-oriented access and distributed storage; do not infer unrestricted analytical scans from the word column."}}, {"q": {"en": "Give a suitable workload for the reference model."}, "a": {"en": "A device/day sensor history with frequent timestamped writes and reads for one device over a bounded time range."}}, {"q": {"en": "What does query-first design mean?"}, "a": {"en": "Write the required read patterns first, then choose partition/clustering keys and access tables that serve them predictably."}}, {"q": {"en": "Is there one mandatory global write-primary?"}, "a": {"en": "No. Cassandra peers can coordinate requests; a coordinator is a per-request role, not a single cluster-wide primary."}}, {"q": {"en": "Partitioning versus replication?"}, "a": {"en": "Partitioning divides logical data subsets; replication stores extra copies. Four partition keys do not imply four nodes or four replicas."}}, {"q": {"en": "What is a keyspace?"}, "a": {"en": "A namespace for tables and related schema with options such as replication policy and durable writes."}}, {"q": {"en": "What is a partition?"}, "a": {"en": "The rows sharing the complete partition-key value. A physical node may store many partitions."}}, {"q": {"en": "What identifies one logical row?"}, "a": {"en": "The entire primary key: partition-key component(s) plus any clustering columns."}}, {"q": {"en": "What does PRIMARY KEY ((a,b),c) mean?"}, "a": {"en": "a and b together form a composite partition key; c is the clustering column. Without the extra parentheses, a alone would be the partition key."}}]}, {"title": {"en": "Setup and Typed Schema"}, "items": [{"q": {"en": "What exact runtime was tested?"}, "a": {"en": "Cassandra 5.0.9, cqlsh 6.2.0, CQL 3.4.7, bundled Python driver 3.29.0, Python 3.13.16 and Temurin Java 17.0.21+9 on Debian 13 x86_64."}}, {"q": {"en": "How many physical nodes were tested?"}, "a": {"en": "One private authenticated local node, with lab keyspaces using datacenter1 and RF 1. No multi-node availability or throughput test is claimed."}}, {"q": {"en": "Why use matching cqlsh?"}, "a": {"en": "A client is generally guaranteed for its own Cassandra release; do not assume arbitrary old/new versions or Python interpreters are interchangeable."}}, {"q": {"en": "Does cqlsh --version prove a stored write worked?"}, "a": {"en": "No. Connect, inspect actual server versions and verify an authorized insert/read round-trip as well."}}, {"q": {"en": "What did SHOW VERSION report?"}, "a": {"en": "cqlsh 6.2.0, Cassandra 5.0.9, CQL spec 3.4.7 and native protocol v4. Protocol 4 is a selected wire-protocol version, not the Cassandra product version."}}, {"q": {"en": "Why does the replication map use datacenter1?"}, "a": {"en": "That is the actual local datacenter name verified from system.local. An unrelated DC name is not a universal template."}}, {"q": {"en": "Does RF 1 provide another node’s copy?"}, "a": {"en": "No. It is appropriate only for this one-node teaching reference and does not provide a replica for node loss."}}, {"q": {"en": "Name required/basic CQL types."}, "a": {"en": "int, text and timestamp; the typed example also stores date, boolean, double and uuid with their real CQL types."}}, {"q": {"en": "Single quotes versus double quotes in CQL?"}, "a": {"en": "Single quotes delimit string values; double quotes delimit case-sensitive identifiers. Double an embedded apostrophe inside a string."}}, {"q": {"en": "What does adding city text do to existing rows?"}, "a": {"en": "It adds a regular typed column; the previous row shows city null until it is written. It does not invent a default city or repartition data."}}]}, {"title": {"en": "CRUD and Negative Cases"}, "items": [{"q": {"en": "What happens on a normal INSERT of an existing full key?"}, "a": {"en": "It upserts supplied values for that logical row. In the demo Asha becomes Asha Patel while the omitted existing Surat/82 values remain."}}, {"q": {"en": "Is normal INSERT a whole-row replacement?"}, "a": {"en": "No. It writes supplied values; omitted existing columns are not removed merely because they are absent from the INSERT list."}}, {"q": {"en": "What happens on a normal UPDATE of missing learner 99?"}, "a": {"en": "It creates Jai/68 with city null. Basic UPDATE does not require the row to have existed."}}, {"q": {"en": "Are matchedCount and modifiedCount returned by basic CQL updates?"}, "a": {"en": "No. Those are MongoDB-style result fields, not the normal CQL result. Handle errors and inspect the intended stored state."}}, {"q": {"en": "Can marks=marks+5 update an ordinary int?"}, "a": {"en": "Not as ordinary CQL int arithmetic. Counter columns and collection operations have separate rules; do not translate MongoDB $inc mechanically."}}, {"q": {"en": "What does deleting just city leave for learner 1?"}, "a": {"en": "The row still has Asha and marks 82, while city reads as null."}}, {"q": {"en": "What key deletes one sensor reading?"}, "a": {"en": "The complete device_id/day/reading_at row identity. Supplying just device/day intentionally targets that entire partition."}}, {"q": {"en": "What is a tombstone?"}, "a": {"en": "A logical deletion marker. A missing read result does not prove immediate physical byte erasure from disk."}}, {"q": {"en": "Can SET change a primary-key field into another ID?"}, "a": {"en": "No. The real server rejects that mutation. A key is row identity; changing identity/model needs deliberate new data and cleanup."}}, {"q": {"en": "How are null and wrong-type primary keys handled?"}, "a": {"en": "The shown null key and quoted one-as-int are rejected with real InvalidRequest exceptions; no extra valid row is inserted."}}]}, {"title": {"en": "Queries and Modeling"}, "items": [{"q": {"en": "What does a missing-key SELECT return?"}, "a": {"en": "An empty result set, not a new row and not a MongoDB findOne-style null value."}}, {"q": {"en": "What do the latest-two and earliest-two queries return?"}, "a": {"en": "For S01/day29, descending latest values are 32.0 then 31.0; allowed ascending reverse order gives 30.0 then 31.0."}}, {"q": {"en": "What does [09:00,09:02) include here?"}, "a": {"en": "09:00 and 09:01, but not 09:02. The declared descending clustering order returns 31.0 then 30.0."}}, {"q": {"en": "Can ORDER BY sort any regular column globally?"}, "a": {"en": "No. The shown ORDER BY uses a clustering column with required partition restrictions. ORDER BY marks in the learner table is rejected."}}, {"q": {"en": "Does LIMIT 1 legalize the temperature-only WHERE?"}, "a": {"en": "No. That demonstrated unindexed non-key query remains invalid. LIMIT restricts returned rows; it does not create the access path."}}, {"q": {"en": "What does ALLOW FILTERING mean in this fixture?"}, "a": {"en": "It explicitly permits residual filtering after selecting the known three-row partition. It is not an index or a guarantee of scalable performance."}}, {"q": {"en": "Why use a status/day table as well as a device/day table?"}, "a": {"en": "They serve different read patterns without a join or broad scan; the intentional duplication requires coordinated correction/deletion policies."}}, {"q": {"en": "What did the denormalization correction demonstrate?"}, "a": {"en": "The base reading changed from 32.0 to 35.0 while the second table stayed at 32.0 until a separate explicit write updated it. There is no automatic cross-table correction."}}]}, {"title": {"en": "Dataset and Analytical Features"}, "items": [{"q": {"en": "How many sensor rows and logical partitions are in sensors.csv?"}, "a": {"en": "Eight synthetic rows in four device/day partitions: S01/day29 has 3, S02/day29 has 2, S01/day30 has 2 and S03/day29 has 1."}}, {"q": {"en": "Is COPY FROM native CQL?"}, "a": {"en": "No. It is a cqlsh special command. The reference runner delegates it to real matching cqlsh rather than pretending a driver supports it."}}, {"q": {"en": "Why use DATETIMEFORMAT with %z?"}, "a": {"en": "To parse the CSV’s explicit UTC Z suffix correctly. Wrong parsing or duplicate full keys can collapse distinct records into upserts."}}, {"q": {"en": "Is eight processed/imported rows enough verification?"}, "a": {"en": "No. Verify eight distinct stored rows, all full keys/values/times, four logical partition keys and the correct latest UTC reading."}}, {"q": {"en": "What is the S01/day29 aggregate?"}, "a": {"en": "Three samples, sum 93.0, mean 31.0, minimum 30.0 and maximum 32.0."}}, {"q": {"en": "What are the other per-partition means?"}, "a": {"en": "S02/day29 is 28.5, S01/day30 is 33.5 and S03/day29 is 27.0."}}, {"q": {"en": "Is the CSV example a live stream or trained AI system?"}, "a": {"en": "No. It is a reproducible synthetic snapshot with real database import and simple feature/report calculations, not live hardware, model training or a throughput benchmark."}}, {"q": {"en": "Why are time buckets not automatically safe at every rate?"}, "a": {"en": "Partition size and hotness depend on writes per time unit, row size and access load. A daily bucket may need to be smaller or differently designed for a much faster stream."}}]}, {"title": {"en": "Health, Safety and Evidence"}, "items": [{"q": {"en": "What does nodetool status use?"}, "a": {"en": "Management/JMX, not a CQL statement inside cqlsh. Management access must be private and authorized."}}, {"q": {"en": "What do UN and DN mean?"}, "a": {"en": "U/D indicate Up/Down; N indicates Normal. The actual reference observed one local UN node. Other state letters include L/J/M for Leaving/Joining/Moving."}}, {"q": {"en": "Does UN prove every application and availability guarantee?"}, "a": {"en": "No. It is one signal; correlate application reads/writes and operational evidence. It does not prove backups, multiple replicas or latency objectives."}}, {"q": {"en": "Were repair, decommission or failure injection tested?"}, "a": {"en": "No. The syllabus asks for nodetool/cluster-health awareness only. The only management observation was read-only status."}}, {"q": {"en": "How does the guarded runner protect existing keyspaces?"}, "a": {"en": "It validates the dedicated prefix, refuses an existing namespace, records ownership only after CREATE succeeds and finally drops only that captured newly owned keyspace."}}, {"q": {"en": "What assessment and completion boundary should the journal state?"}, "a": {"en": "Practical PA 20 + ESE 30 = 50 with no theory ESE/PA. Record Practicals 4–6 and real single-node evidence; no official theory paper, multi-node proof or external hosting is claimed."}}]}], "exam_questions": [], "lesson_count": 18, "practice_task_count": 16, "learning_outcomes": [{"en": "Design and implement distributed datasets using Cassandra’s data model and CQL (CO3)."}], "practical_numbers": [4, 5, 6], "content_kind": "real_cassandra_practical", "assessment_note": {"en": "Practical PA 20 + practical ESE 30 = 50; theory ESE/PA are 0. Tasks carry no invented official theory-paper marks."}, "runtime_evidence": {"server": "Apache Cassandra", "server_version": "5.0.9", "shell": "cqlsh", "shell_version": "6.2.0", "cql_version": "3.4.7", "driver_version": "3.29.0", "native_protocol": 4, "java": "Temurin 17.0.21+9", "python": "3.13.16", "os": "Debian 13 x86_64", "authenticated": true, "factory_login_disabled": true, "physical_nodes": 1, "data_center": "datacenter1", "partitioner": "Murmur3Partitioner", "lab_replication_factor": 1, "public_database_endpoint": false, "multi_node_distribution_tested": false, "failover_tested": false, "cluster_operations_performed": false, "nodetool_observation": "UN (single local node)", "programs_executed": 14, "output_origin": "Real Cassandra native-protocol results via bundled driver; COPY FROM delegated to actual cqlsh; JSON preserves result order; dynamic COPY timing/rates omitted", "fixture": {"file": "sensors.csv", "synthetic": true, "live_ingestion": false, "sha256": "8f8a2c834f697e2873146f0993a870de8133d21d07a89d099621d7e3d278f755", "source_rows": 8, "stored_rows": 8, "logical_partitions": 4, "actual_cqlsh_copy": true, "all_keys_values_times_match": true}}, "sources": [{"tit function render(){
  document.getElementById('title').textContent = `${L('unit')} ${U.unit}: ${t(U.title)}`;
  document.getElementById('sub').textContent = `${t(META.name)} · ${META.code}`;
  document.getElementById('lang').textContent = S.lang==='en' ? 'ગુ' : 'EN';
  document.getElementById('lang').style.display = META.languages.includes('gu') ? '' : 'none';
  document.getElementById('tabs').innerHTML = Object.keys(VIEWS).map(k=>`<button class="tab${S.tab===k?' on':''}" data-tab="${k}">${L(k)}</button>`).join('');
  document.getElementById('view').innerHTML = VIEWS[S.tab]();
  document.querySelectorAll('#view pre.c').forEach(e=>{ e.innerHTML = hl(e.textContent); e.className='code'; });
}
let zoom = 1;
function setZoom(z){ zoom = Math.min(4, Math.max(1, z)); const w=document.getElementById('zw'); w.style.width=(zoom*100)+'%'; document.getElementById('zr').textContent=Math.round(zoom*100)+'%'; }
document.addEventListener('click', e=>{
  const q = e.target.closest('.q'); if (q && q.parentElement.querySelector('.a')) { q.parentElement.classList.toggle('open'); return; }
  const tb = e.target.closest('[data-tab]'); if (tb){ S.tab = tb.dataset.tab; render(); window.scrollTo(0,0); return; }
  if (e.target.closest('#lang')){ S.lang = S.lang==='en'?'gu':'en'; render(); return; }
  const m = e.target.closest('[data-more]');
  document.querySelectorAll('.menu.show').forEach(x=>{ if(!m || x!==m.nextElementSibling) x.classList.remove('show'); });
  if (m){ m.nextElementSibling.classList.toggle('show'); return; }
  const act = e.target.closest('[data-act]');
  if (act){ act.closest('.sec').querySelectorAll('.card').forEach(c=>{ if(c.querySelector('.a')) c.classList.toggle('open', act.dataset.act==='expand'); }); act.parentElement.classList.remove('show'); return; }
  const dg = e.target.closest('[data-dg]');
  if (dg){ const id=dg.dataset.dg; document.getElementById('mt').textContent=t(U.diagrams.find(d=>d.id===id).title); document.getElementById('zw').innerHTML=SVG[id]; setZoom(1); document.getElementById('modal').classList.add('show'); return; }
  if (e.target.closest('#mx')) document.getElementById('modal').classList.remove('show');
  if (e.target.closest('#zi')) setZoom(zoom+0.5);
  if (e.target.closest('#zo')) setZoom(zoom-0.5);
  if (e.target.closest('#zr')) setZoom(1);
});
render();
</script></body></html>
