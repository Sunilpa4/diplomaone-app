<script>
const U = {"subject": "DI04000031", "unit": 3, "format": "notes", "title": {"en": "Wide-Column Databases: Cassandra"}, "hours": 12, "weightage": 20, "tabs": ["notes", "programs", "diagrams", "syntax", "viva"], "intro_text": {"en": "Cassandra architecture/setup and cqlsh, keyspaces/tables/partitions, partition and clustering keys, typed CQL DDL/CRUD and WHERE/ORDER BY/LIMIT. Includes 14 real CQL programs and a verified synthetic CSV dataset for Practicals 4–6. nodetool/cluster health remains awareness only; the reference uses one physical node."}, "notes": [{"title": {"en": "3.1 Cassandra Foundations, Architecture and Keys"}, "items": [{"h": {"en": "Cassandra Uses, Query-First Thinking and Peer Architecture"}, "body": {"en": "\n<p><b>Apache Cassandra</b> is a distributed wide-column database suited to partition-oriented workloads such as sensor histories, application events and high-write-volume telemetry. CQL exposes typed tables; “wide-column” does not mean it is a columnar analytical warehouse.</p>\n<p><b>Query first:</b> write the required reads before choosing keys. “Latest readings for one device on one day” suggests a device/day partition and a time clustering column. Cassandra is not a drop-in SQL engine with arbitrary joins, subqueries and free sorting of every column.</p>\n<p><b>Architecture, conceptually:</b> peers own token ranges; a contacted node can coordinate an operation and communicate with replicas. There is no mandatory single write-primary for the whole Cassandra cluster. Partitioning decides data subsets; replication maintains additional copies. Replication/consistency settings affect guarantees—avoid a universal product-wide CP/AP slogan or a claim of perfect availability.</p>\n<p><b>CO3:</b> design and implement distributed datasets using Cassandra’s data model and CQL. Practicals 4–6 cover setup, query-shaped CRUD and an AI-related dataset.</p>\n<p><b>Actual reference:</b> real Cassandra 5.0.9, cqlsh 6.2.0, CQL 3.4.7, Python 3.13.16 and Temurin Java 17.0.21+9 on Debian 13 x86_64. Fourteen CQL scripts were executed on one private authenticated node. Logical partition results are real; multi-machine distribution, replication failover, production capacity and external hosting were not tested.</p>\n"}, "diagram": "ns3_arch"}, {"h": {"en": "Keyspace → Table → Partition → Row → Typed Column"}, "body": {"en": "\n<p>A <b>keyspace</b> is a namespace for tables and defines options such as replication policy and durable writes. A <b>table</b> defines columns and a primary-key layout. A <b>partition</b> contains rows sharing the complete partition-key value.</p>\n<table><tr><th>Level</th><th>Sensor-history example</th></tr><tr><td>Keyspace</td><td>One disposable di04000031_u3_... lab namespace</td></tr><tr><td>Table</td><td>readings_by_device_day</td></tr><tr><td>Partition</td><td>(S01, 2026-10-29)</td></tr><tr><td>Row within partition</td><td>One reading_at timestamp, such as 09:01 UTC</td></tr><tr><td>Regular column</td><td>temperature_c double; status text</td></tr></table>\n<p>Partitions are logical data units; a node may store many partitions and a partition may have replicas. The reference has four logical device/day partitions but only one physical node. Four partitions are not four machines or four copies.</p>\n<p>Keyspaces/tables do not appear merely because a shell connects. Use explicit DDL, verify it with read-only system schema or DESCRIBE, and make an authorized stored-data round-trip. Do not modify system keyspaces.</p>\n"}, "diagram": "ns3_hierarchy"}, {"h": {"en": "Partition Key versus Clustering Columns: Parentheses Matter"}, "body": {"en": "\n<p>A complete <b>primary key</b> uniquely identifies a logical row. Its first component is the partition key; the remaining components are clustering columns. Extra parentheses make a multi-column composite partition key.</p>\n<pre class=\"c\">PRIMARY KEY (device_id, day, reading_at)\n-- Partition key: device_id\n-- Clustering columns: day, reading_at\n\nPRIMARY KEY ((device_id, day), reading_at)\n-- Composite partition key: device_id AND day together\n-- Clustering column: reading_at</pre>\n<p>For PRIMARY KEY ((device_id,day),reading_at), both device and day must match to select the intended partition. Different days for S01 form different partitions; time orders rows inside each one. In PRIMARY KEY (device_id,day,reading_at), day is instead the first clustering column inside a device-only partition.</p>\n<p><b>Growth matters:</b> time bucketing bounds history only relative to the actual write rate and record size. Two readings/minute produce 2,880 readings/day; a much faster stream may need smaller buckets or another deliberate design. Estimate size, query load and skew—“one day” is not automatically safe at every rate.</p>\n<p><b>Identity:</b> two samples with exactly the same full key upsert the same row. If several events can share a millisecond timestamp, consider a justified tie-breaker and its query implications. SET cannot mutate the key into a new identity; key-layout changes require a new model/migration.</p>\n"}, "diagram": "ns3_keys"}]}, {"title": {"en": "3.2 Installation and cqlsh — Practical 4"}, "items": [{"h": {"en": "Install a Compatible Private Server and Matching cqlsh"}, "body": {"en": "\n<ol><li><b>Identify platform:</b> follow the selected release’s official Linux/package/tarball instructions. On Windows, use an instructor-approved Linux/WSL2 or container environment rather than assuming a native Windows server install; only the Debian reference was tested here.</li>\n<li><b>Check prerequisites:</b> Cassandra 5.0 documentation specifies Java 11 or 17; the reference deliberately uses patched Temurin 17.0.21+9, not an unrelated Java default. Use a Python version supported by the bundled cqlsh. The actual 5.0.9 client was verified with Python 3.13.16; do not assume older cqlsh packages support it.</li>\n<li><b>Obtain official binaries:</b> download the selected release and verify its published checksum before extracting. The reference Apache 5.0.9 tarball was SHA-512 verified; its Java runtime archive was SHA-256 verified. These identify the tested run, not a timeless latest-release claim.</li>\n<li><b>Configure private access before starting:</b> keep CQL, internode and management/JMX interfaces private; enable appropriate authentication/authorization. Do not expose factory defaults or an unauthenticated server publicly.</li>\n<li><b>Initialize authorized lab access:</b> on a brand-new private instance, use the vendor’s administrative role procedure to create unique private credentials, verify the new login, then rotate/disable the factory role. The reference did so before any teaching scripts; no private password is shipped.</li>\n<li><b>Start and connect:</b> use the service manager for your package, or a foreground process for a tarball. Record versions and verify a real authorized write/read, not only a client executable.</li></ol>\n<pre class=\"c\"># Operating-system terminal, from the extracted release:\njava -version\npython3 --version\nbin/cassandra -v\nbin/cqlsh --version</pre>\n<pre class=\"c\"># Private learning instance only: cassandra.yaml settings\nlisten_address: 127.0.0.1\nrpc_address: 127.0.0.1\nnative_transport_port: 9043\nauthenticator: PasswordAuthenticator\nauthorizer: CassandraAuthorizer\n# Keep internode and local JMX access private too.\n# This is not a complete production/TLS configuration.</pre>\n<pre class=\"c\"># Terminal A, after private settings and Java compatibility:\n# Run from the extracted Cassandra distribution.\nbin/cassandra -f\n# A package installation may use the OS service manager.\n# Do not start two servers against the same data directory.</pre>\n<p><b>Resource boundary:</b> GTU recommends an 8 GB learning computer. The reference used a reduced 512 MiB Java heap for tiny synthetic fixtures in a constrained sandbox; this is not a production sizing or tuning recommendation. Binaries, database state and credentials stayed outside the project in an excluded private cache.</p>\n"}, "diagram": "ns3_setup"}, {"h": {"en": "Connect with cqlsh and Create/Alter/Drop Keyspaces"}, "body": {"en": "\n<p><b>cqlsh</b> is a client shell, not the database server. Use the client bundled with the chosen Cassandra release, because cross-version compatibility is not universally guaranteed. Enter a private password at a prompt or use a correctly permissioned private credentials file; never submit a password-bearing command, file or history.</p>\n<pre class=\"c\"># Terminal B: your own authorized private lab account.\nbin/cqlsh 127.0.0.1 9043 -u YOUR_LAB_USER --disable-history\n# Enter the password at the hidden prompt; never use -p SECRET.\n# Default native CQL port is 9042; the reference uses 9043.</pre>\n<pre class=\"c\">-- Inside cqlsh, not in the operating-system terminal:\nSHOW VERSION;\nSHOW HOST;\nDESCRIBE KEYSPACES;\nSELECT release_version, cql_version, data_center\nFROM system.local WHERE key='local';</pre>\n<p>The authenticated reference SHOW VERSION reported <b>cqlsh 6.2.0 | Cassandra 5.0.9 | CQL spec 3.4.7 | Native protocol v4</b>. Native protocol version 4 was explicitly selected for this client run; it is not the Cassandra product version.</p>\n<pre class=\"c\">-- Fresh disposable lab namespace; never a production keyspace.\nCREATE KEYSPACE di04000031_u3_manual\nWITH replication = {'class':'NetworkTopologyStrategy',\n                    'datacenter1':1};\nUSE di04000031_u3_manual;\nALTER KEYSPACE di04000031_u3_manual WITH durable_writes=true;\n-- After your lab, drop ONLY the namespace you created:\n-- USE system;\n-- DROP KEYSPACE di04000031_u3_manual;</pre>\n<p><b>Replication map:</b> NetworkTopologyStrategy refers to the actual datacenter name, verified as datacenter1 here. RF 1 fits the single-node lab and offers no extra replica for node loss. Do not copy a DC name or raise RF and pretend it creates machines/copies by itself. durable_writes=true retains commit-log use; this lab does not disable durability.</p>\n<p><b>Shell versus CQL:</b> SHOW, DESCRIBE, COPY and SOURCE are cqlsh commands; application drivers send native CQL statements. CQL uses semicolons, single-quoted string values and typed column definitions.</p>\n<p><b>Safety:</b> each full example creates a distinct di04000031_u3_ namespace. Use the supplied runner: it refuses a pre-existing name, marks ownership only after successful CREATE and drops only that captured namespace. A prefix alone is neither authorization nor a backup. If running manually, stop immediately after an unexpected CREATE/setup error—do not continue into an existing keyspace and its DROP footer.</p>\n"}, "programs": ["ns3p01"]}]}, {"title": {"en": "3.3 Typed CQL DDL and Safe Schema Changes"}, "items": [{"h": {"en": "CREATE TABLE, Basic Types and UTC Values"}, "body": {"en": "\n<p>CQL is a <b>typed</b> language. Define column types and the primary key explicitly; a wrong int literal is not silently accepted as a different string identifier.</p>\n<pre class=\"c\">CREATE TABLE readings_by_device_day (\n  device_id text, day date, reading_at timestamp,\n  temperature_c double, status text,\n  PRIMARY KEY ((device_id, day), reading_at)\n) WITH CLUSTERING ORDER BY (reading_at DESC);</pre>\n<pre class=\"c\">-- Sample literals, not a complete INSERT statement:\nint:       82\ntext:      'Asha'\nboolean:   true\ndate:      '2026-10-29'\ntimestamp: '2026-10-29T09:00:00Z'\nuuid:      11111111-1111-4111-8111-111111111111\ntext with apostrophe: 'Asha''s sensor' </pre>\n<table><tr><th>Type</th><th>Purpose / care</th></tr><tr><td>int / bigint</td><td>Signed 32-bit / 64-bit integers; choose a suitable range.</td></tr><tr><td>text</td><td>UTF-8 text; string values use single quotes.</td></tr><tr><td>timestamp</td><td>Date and time with millisecond precision; include an explicit zone.</td></tr><tr><td>date</td><td>Calendar date without a time-of-day component.</td></tr><tr><td>boolean / double</td><td>true/false and approximate binary fractional numeric data.</td></tr><tr><td>uuid</td><td>An identifier value; a UUID is not necessarily a time-sorting timeuuid.</td></tr></table>\n<p>Unquoted identifiers are case-insensitive/lowercased in normal CQL usage; double quotes name identifiers rather than ordinary string values. Escape a string apostrophe by doubling it. Primary-key components cannot be null.</p>\n<p>The typed example stores a fixed UUID and UTC timestamp. Its JSON display converts dates/UUIDs to strings and timestamps to ISO UTC; these formatting choices do not change the stored CQL types. Use an appropriate exact numeric policy for money rather than assuming double is exact currency.</p>\n"}, "programs": ["ns3p02"]}, {"h": {"en": "ALTER TABLE, New Null Values and DROP TABLE"}, "body": {"en": "\n<p><b>CREATE TABLE</b> defines a new schema; <b>ALTER TABLE ADD</b> adds a regular column. Existing rows do not acquire invented default data: the example’s newly added city reads as null until it is written.</p>\n<pre class=\"c\">ALTER TABLE learner_schema ADD city text;\nALTER TABLE learner_schema WITH comment='Small schema-change lab';\nALTER TABLE learner_schema DROP city;\nDROP TABLE learner_schema;\n-- Requires the disposable table created in the full demo.\n-- These are separate changes, not a primary-key migration.</pre>\n<p>The executable example creates its disposable table first, adds/writes/removes city, changes a comment and verifies schema metadata after DROP. A successful ALTER command is not proof that applications have migrated their data or validation rules.</p>\n<p><b>Key limitation:</b> do not treat ALTER as arbitrary repartitioning. Adding a primary-key component or changing a partition key is not an in-place data-model edit. Primary-key-column rename support changes a name, not which data is grouped together. Plan a new table and controlled migration when access requirements change.</p>\n<p><b>Destruction:</b> dropping a regular column removes that column’s data logically; dropping a table removes the table; dropping a keyspace removes all its contents. Do not experiment with these commands in system or real application namespaces, and do not assume they provide an undo action.</p>\n"}, "programs": ["ns3p09"]}]}, {"title": {"en": "3.4 CQL CRUD and Partition-Oriented Queries — Practical 5"}, "items": [{"h": {"en": "INSERT and the Default Upsert Rule"}, "body": {"en": "\n<p>A normal Cassandra <b>INSERT is an upsert</b>: a new complete primary key creates a row; an existing key writes the specified regular columns. It does not normally throw a duplicate-key error, and it is not whole-row replacement.</p>\n<pre class=\"c\">-- Assumes the learners_by_id schema in the independent demo.\nINSERT INTO learners_by_id (learner_id, name)\nVALUES (1, 'Asha Patel');\n-- Same key: supplied name changes; existing city/marks remain.\n\nUPDATE learners_by_id SET name='Jai', marks=68\nWHERE learner_id=99;\n-- Missing key: normal UPDATE can create a row.</pre>\n<p>For learner 1, name becomes Asha Patel but existing Surat/82 remain. Inserting learner 4 with just a name creates a row with city/marks null. Repeating a complete row identity does not create another logical row with that key.</p>\n<p>Conditional clauses such as IF NOT EXISTS/IF EXISTS use different lightweight-transaction semantics and have costs; they are not implicit in these basic operations. Ordinary writes do not return MongoDB-style matchedCount, modifiedCount or deletedCount, so query the intended state and handle errors deliberately.</p>\n"}, "diagram": "ns3_upsert", "programs": ["ns3p04"]}, {"h": {"en": "SELECT Projection, WHERE Equality and Bounded IN"}, "body": {"en": "\n<p><b>SELECT</b> retrieves the named columns. Use WHERE with the designed key rather than assuming every regular field can be filtered like SQL.</p>\n<pre class=\"c\">SELECT name, city FROM learners_by_id WHERE learner_id=2;\nSELECT learner_id, name FROM learners_by_id\nWHERE learner_id IN (1,3);\n-- A missing key returns an empty result set, not a new row.</pre>\n<p>The fixture returns Ravi/Bharuch for ID 2, names for IDs 1 and 3, and no rows for 999. Selecting only needed columns reduces returned data; it does not modify storage or implement authorization.</p>\n<p>IN on supported key positions can select multiple known values, but large lists may fan out to many partitions. Do not rely on IN result order as a global lexical/marks order. For composite partition keys, supply the intended values of every component; for multiple clustering columns, respect their left-to-right restrictions.</p>\n<p>CQL is SQL-like but does not provide general joins/subqueries or unrestricted OR-style ad-hoc predicates. Use the documented CQL syntax and design another access table when the required read does not fit the key.</p>\n"}, "programs": ["ns3p05"]}, {"h": {"en": "Inspect the Eight-Reading Fixture and Four Logical Partitions"}, "body": {"en": "\n<p>The synthetic sensor data is fixed, reproducible and not measured from live devices. The default time order within a partition is descending. Every independent sensor example includes its seed explicitly, except the CSV example, which actually imports its supplied file.</p>\n<table><tr><th>Device / day</th><th>UTC minute → temperature °C</th></tr><tr><td>S01 / 2026-10-29</td><td>09:00 → 30.0; 09:01 → 31.0; 09:02 → 32.0</td></tr><tr><td>S02 / 2026-10-29</td><td>09:00 → 28.0; 09:01 → 29.0</td></tr><tr><td>S01 / 2026-10-30</td><td>09:00 → 33.0; 09:01 → 34.0</td></tr><tr><td>S03 / 2026-10-29</td><td>09:00 → 27.0</td></tr></table>\n<p>The partition row counts are 3, 2, 2 and 1, totaling 8. SELECT DISTINCT device_id,day lists the four partition-key values, not four server addresses. Hash/token placement is not alphabetical ordering of the device IDs.</p>\n<p><b>Observed versus inferred:</b> the reference queries really retrieve the selected partitions, but they all reside on one physical local node with RF 1. This simulates partition-oriented dataset design; it is not an experiment proving distribution over a multi-node cluster.</p>\n"}, "diagram": "ns3_partitions", "programs": ["ns3p03"]}, {"h": {"en": "WHERE Time Ranges, Clustering ORDER BY and LIMIT"}, "body": {"en": "\n<p>For a device/day partition, use the clustering timestamp to select a contiguous time interval. The table specifies reading_at DESC; the latest two readings are therefore 32.0 at 09:02 followed by 31.0 at 09:01.</p>\n<pre class=\"c\">SELECT reading_at, temperature_c FROM readings_by_device_day\nWHERE device_id='S01' AND day='2026-10-29'\n  AND reading_at &gt;= '2026-10-29T09:00:00Z'\n  AND reading_at &lt;  '2026-10-29T09:02:00Z';\n\nSELECT reading_at, temperature_c FROM readings_by_device_day\nWHERE device_id='S01' AND day='2026-10-29'\nORDER BY reading_at ASC LIMIT 2;</pre>\n<p>The half-open interval [09:00,09:02) returns 31.0 and 30.0 in descending clustering order. Reversing to ASC with LIMIT 2 returns 30.0 then 31.0. Include a timezone; “09:00” without a zone can be ambiguous across machines.</p>\n<p><b>ORDER BY is constrained:</b> it uses permitted clustering order (or its supported reverse) with the required key restrictions. It is not “sort any field in any table.” With multiple clustering columns, their declared sequence matters.</p>\n<p><b>LIMIT:</b> controls returned row count; it does not build an index, fix an invalid WHERE or guarantee a fixed number of underlying reads. Avoid unbounded full-table reads merely because this eight-row fixture is small.</p>\n"}, "diagram": "ns3_query", "programs": ["ns3p06"]}, {"h": {"en": "UPDATE, Missing Rows and the Correct Key Scope"}, "body": {"en": "\n<pre class=\"c\">UPDATE learners_by_id SET city='Surat', marks=75\nWHERE learner_id=2;\n-- Read back; CQL does not return matchedCount/modifiedCount.\nSELECT name, city, marks FROM learners_by_id WHERE learner_id=2;\n-- marks=marks+5 is NOT ordinary int arithmetic in CQL.\n-- Counter columns are a separate feature with restrictions.</pre>\n<p>The observed Ravi update reads back Surat/75. A separate UPDATE of missing learner 99 stores Jai/68 with city null: normal UPDATE can create data. Do not interpret success as proof that the row existed before the write.</p>\n<p>For the shown regular-row updates, specify the intended complete row key. Static columns, counters and conditional writes have different rules and are not shortcuts for the simple schema. A primary-key value is row identity, not a mutable ordinary attribute.</p>\n<p>Changing multiple tables or combining external actions is not automatically one SQL transaction. The examples are sequential and do not claim concurrency stress testing, payment integration or cross-node consistency experiments.</p>\n"}, "programs": ["ns3p07"]}, {"h": {"en": "DELETE a Cell, a Row or a Selected Partition"}, "body": {"en": "\n<pre class=\"c\">DELETE city FROM learners_by_id WHERE learner_id=1;\nDELETE FROM learners_by_id WHERE learner_id=2;\nDELETE FROM readings_by_device_day\nWHERE device_id='S01' AND day='2026-10-29'\n  AND reading_at='2026-10-29T09:02:00Z';\nDELETE FROM readings_by_device_day\nWHERE device_id='S02' AND day='2026-10-29';</pre>\n<p>These four statements have different scopes: delete Asha’s city cell; delete learner 2; delete one full-key S01 reading; delete all rows in the selected S02/day partition. In the reference, Asha retains name/82 with city null, learner 2 returns no rows, S01/day29 retains two readings, and S02/day29 retains zero.</p>\n<p><b>Tombstones:</b> logical deletion uses markers. Disappearance from SELECT is not proof of immediate physical disk erasure; physical cleanup depends on storage lifecycle and safe maintenance conditions. Do not teach repair/compaction procedures as part of this awareness-level unit.</p>\n<p><b>Safety:</b> check the keyspace and every key component. Read-back proves the selected fixture result, not that a pre-read count locked data against concurrent changes. The supplied ownership-aware runner cleans only its newly created lab namespace.</p>\n"}, "diagram": "ns3_delete", "programs": ["ns3p08"]}]}, {"title": {"en": "3.5 Query-First Modeling, Filtering and CSV Input"}, "items": [{"h": {"en": "One Access Pattern per Table and Denormalization Costs"}, "body": {"en": "\n<p>Start with two read requirements: (1) recent readings for one device/day, and (2) high-status readings for one day. The first uses readings_by_device_day; the second uses a separate readings_by_status_day table whose composite partition key is (status,day) and whose clustering columns are device_id then reading_at.</p>\n<p>Deliberate duplication avoids a join or a broad scan for the shown reads. It also creates a consistency obligation: writes/corrections/deletions may need to update more than one representation.</p>\n<p><b>Real demonstration:</b> the high S01/day29 reading starts at 32.0 in both tables. Updating the base table makes it 35.0 there while the lookup table still reads 32.0. Only the explicit second write makes the lookup table read 35.0. These two updates are not automatically one cross-table SQL transaction.</p>\n<p>No foreign-key constraint or cascade updates the second table for you. Define retry, correction and missing-data handling in a real application. The status labels here are synthetic input, not predictions from a trained AI model. Do not use a logged multi-partition batch as a universal bulk-loading or transaction shortcut.</p>\n"}, "diagram": "ns3_model", "programs": ["ns3p10"]}, {"h": {"en": "Unsupported Filters, ALLOW FILTERING and Real Negative Cases"}, "body": {"en": "\n<p>Without a suitable index or access-table design, the demonstrated temperature-only query is rejected with InvalidRequest. The version with LIMIT 1 is also rejected; a small output limit does not legalize that query.</p>\n<pre class=\"c\">-- Expected rejection: no suitable index/query-first key here.\nSELECT device_id, temperature_c FROM readings_by_device_day\nWHERE temperature_c &gt; 30.0 LIMIT 1;\n\n-- Tiny fixture only: three rows in this selected partition.\nSELECT reading_at, temperature_c FROM readings_by_device_day\nWHERE device_id='S01' AND day='2026-10-29'\n  AND temperature_c &gt; 30.0 ALLOW FILTERING;</pre>\n<p>The allowed example fixes one known three-row partition and returns 32.0 and 31.0. ALLOW FILTERING permits residual work; it is not an index, a modeling repair or a latency promise. Prefer an appropriate query-first table or deliberately selected index when an access pattern must scale.</p>\n<p><b>Additional real server rejections:</b> a string where int is required; null primary key; ORDER BY an ordinary marks column; SET on the primary key; malformed SELECT syntax. Expected InvalidRequest/SyntaxException outcomes are captured from the server; the three valid rows remain unchanged.</p>\n<p><b>Runner comments:</b> @result labels display observed result sets; @expect marks an intentionally rejected statement. These are ordinary comments, not extra CQL syntax, and unexpected exceptions still fail the run. JSON preserves server result order rather than silently sorting on the client.</p>\n"}, "diagram": "ns3_filter", "programs": ["ns3p11", "ns3p14"]}, {"h": {"en": "Import the AI/IoT Sensor CSV and Verify Stored Keys — Practical 6"}, "body": {"en": "\n<p>The companion sensors.csv contains eight synthetic, explicitly UTC readings in the same four logical partitions. COPY FROM is a <b>cqlsh-only</b> import command; it is not sent as native CQL through an application driver.</p>\n<pre class=\"c\">-- cqlsh-only command, from the folder with sensors.csv:\nCOPY readings_by_device_day\n  (device_id, day, reading_at, temperature_c, status)\nFROM 'sensors.csv' WITH HEADER=TRUE AND NUMPROCESSES=1\n  AND DATETIMEFORMAT='%Y-%m-%dT%H:%M:%S%z'\n  AND MAXPARSEERRORS=0 AND MAXINSERTERRORS=0\n  AND MINBATCHSIZE=1 AND MAXBATCHSIZE=1;\n-- Verify stored row count AND timestamps, not just import progress.</pre>\n<p><b>Why check timestamps:</b> date/time parsing or duplicate full primary keys can collapse distinct input records into upserts. A message saying eight rows were processed/imported is not enough. The tested program verifies eight stored rows, every stored reading against the CSV, four distinct device/day partitions and latest S01/day29 time 09:02 UTC with 32.0.</p>\n<p><b>Explicit format:</b> DATETIMEFORMAT with %z recognizes the CSV’s UTC Z suffix. Do not depend on a permissive date-only fallback or an unrelated system timezone. HEADER, column mapping and error limits are deliberate; the single worker is for a tiny reference, not an import-throughput recommendation.</p>\n<p><b>Honest scope:</b> this fixed snapshot simulates time-stamped AI/IoT input. It is not live sensor ingestion, a trained model, a production ETL job or a multi-machine distribution benchmark. COPY’s varying timing/rate text is omitted from published output; completion and subsequent server-read results are real.</p>\n"}, "diagram": "ns3_csv", "programs": ["ns3p12"]}]}, {"title": {"en": "3.6 Simple Analytics, Health Awareness and Practical Evidence"}, "items": [{"h": {"en": "Bounded Per-Partition Analytical Features, Not a Trained Model"}, "body": {"en": "\n<p>Counts, totals, means and extrema can summarize a small sensor/day history for a report or later model input. Query the intended bounded partition rather than assuming Cassandra is an unrestricted analytical warehouse.</p>\n<pre class=\"c\">SELECT count(*) AS samples, sum(temperature_c) AS total,\n  avg(temperature_c) AS mean, min(temperature_c) AS minimum,\n  max(temperature_c) AS maximum\nFROM readings_by_device_day\nWHERE device_id='S01' AND day='2026-10-29';</pre>\n<table><tr><th>Selected partition</th><th>Observed summary</th></tr><tr><td>S01 / 29 October</td><td>3 samples; total 93.0; mean 31.0; min 30.0; max 32.0</td></tr><tr><td>S02 / 29 October</td><td>2 samples; mean 28.5</td></tr><tr><td>S01 / 30 October</td><td>2 samples; mean 33.5</td></tr><tr><td>S03 / 29 October</td><td>1 sample; mean 27.0</td></tr></table>\n<p><b>Calculation:</b> (30+31+32)/3 = 31; (28+29)/2 = 28.5. These are simple measured-feature calculations on the synthetic fixture. A mean/threshold flag is not a trained anomaly detector or a guaranteed real-time decision system.</p>\n<p>For real analytics, consider data volume, query frequency, retention, partition growth and suitable downstream tools. Small full-table COUNT queries used only to verify the eight-row import are not advice to scan a production cluster for every request.</p>\n"}, "diagram": "ns3_features", "programs": ["ns3p13"]}, {"h": {"en": "nodetool Awareness, Cluster Health and the Practical 4–6 Journal"}, "body": {"en": "\n<p><b>Scope:</b> the syllabus requests a conceptual overview of cluster health and nodetool, at awareness level only. nodetool is a management tool that uses JMX, not a CQL query typed into cqlsh.</p>\n<pre class=\"c\"># OS terminal; read-only awareness, not a repair procedure:\nbin/nodetool -h 127.0.0.1 -p 7199 status\n# U = Up, D = Down\n# N = Normal, L = Leaving, J = Joining, M = Moving\n# Reference observation: one UN local node.\n# UUID/load/ownership figures are environment-dependent.</pre>\n<p><b>Actual observation:</b> a read-only nodetool status command reported one local UN node in datacenter1. U means Up and N means Normal. DN would describe Down/Normal; Joining/Leaving/Moving are other states to interpret, not instructions to trigger them.</p>\n<p>A UN entry is one useful signal, not proof of application correctness, replicas, backups, latency objectives or full cluster health. Correlate authorized connection/read-write checks and operational signals. Load, UUID and ownership figures vary by environment. JMX/internode ports must remain private; enabling a CQL password alone is not complete production hardening.</p>\n<p><b>No operations lab:</b> no repair, forced compaction, decommission, join/leave, failure injection or multi-node deployment is required or claimed. Token ownership/replication is explained conceptually; the real dataset was tested on one physical node only.</p>\n<h4>Journal and acceptance evidence</h4>\n<pre class=\"c\">Aim and official practical number\nActual OS / Java / Python / Cassandra / cqlsh versions\nAuthorized private connection + stored write/read evidence\nQuery requirements -&gt; partition and clustering key rationale\nCQL / CSV input, actual output, negative cases\nEight stored rows, four logical partitions, correct UTC times\nBounded analytic calculation and AI/IoT relevance\nRead-only health interpretation; single-node evidence limit\nOwned scratch cleanup; no credentials in submission\nConclusion and official references</pre>\n<ul><li><b>Practical 4:</b> actual installation, cqlsh connection, system-keyspace awareness, keyspace definition and key interpretation.</li>\n<li><b>Practical 5:</b> a query-shaped table; INSERT/UPDATE/DELETE/SELECT; correct WHERE, ORDER BY and LIMIT; retrieval from distinct logical partitions.</li>\n<li><b>Practical 6:</b> import the synthetic AI-related sensor CSV; verify all eight keys/values/times; explain four logical partitions and calculate bounded summaries. State the single-node simulation boundary.</li></ul>\n<p><b>Assessment:</b> practical PA 20 + practical ESE 30 = 50; theory ESE/PA are 0. The answered tasks are lab/viva revision, not an official theory question paper or invented per-question marking scheme.</p>\n<h4>Official references</h4><p>Checked 29 October 2026; use platform- and release-specific instructions. Recorded versions identify the reference execution.</p>\n<ol><li><a href=\"https://s3-ap-southeast-1.amazonaws.com/gtusitecirculars/Syallbus/DI04000031.pdf\">GTU DI04000031 syllabus, effective 2025–26</a></li><li><a href=\"https://cassandra.apache.org/_/download.html\">Apache Cassandra official downloads</a></li><li><a href=\"https://cassandra.apache.org/doc/5.0.9/cassandra/installing/installing.html\">Installing Cassandra 5.0.9</a></li><li><a href=\"https://cassandra.apache.org/doc/5.0.9/cassandra/developing/cql/ddl.html\">CQL data definition: keyspaces, keys and tables</a></li><li><a href=\"https://cassandra.apache.org/doc/5.0.9/cassandra/developing/cql/dml.html\">CQL data manipulation: reads and writes</a></li><li><a href=\"https://cassandra.apache.org/doc/5.0.9/cassandra/developing/cql/types.html\">CQL data types</a></li><li><a href=\"https://cassandra.apache.org/doc/5.0.9/cassandra/developing/data-modeling/data-modeling_rdbms.html\">Query-first Cassandra versus relational modeling</a></li><li><a href=\"https://cassandra.apache.org/doc/5.0.9/cassandra/developing/data-modeling/data-modeling_physical.html\">Physical data-model design</a></li><li><a href=\"https://cassandra.apache.org/doc/5.0.9/cassandra/managing/tools/cqlsh.html\">cqlsh commands, credentials and COPY</a></li><li><a href=\"https://cassandra.apache.org/doc/5.0.9/cassandra/managing/tools/nodetool/status.html\">nodetool status: read-only cluster information</a></li><li><a href=\"https://cassandra.apache.org/doc/5.0.9/cassandra/managing/operating/security.html\">Cassandra security and network boundaries</a></li><li><a href=\"https://cassandra.apache.org/doc/5.0.9/cassandra/developing/cql/functions.html\">CQL built-in aggregate functions</a></li></ol>"}, "diagram": "ns3_health"}]}, {"title": {"en": "Answered Practical Revision Tasks — Not a Theory Question Paper"}, "role": "practice", "items": [{"h": {"en": "Explain a Cassandra peer, coordinator, partition and replica without claiming the local lab is a three-node cluster."}, "body": {"en": "<p>A peer can coordinate a request and communicate with the relevant replica nodes. Partitioning divides data subsets using partition-key placement; replication keeps additional copies according to the keyspace policy.</p><p>The diagram is conceptual. The actual reference used one authenticated node and RF 1, so four logical device/day partitions do not establish multi-machine placement, replicated failover or global throughput.</p>"}}, {"h": {"en": "Prepare a compatible, private Cassandra/cqlsh setup and a real storage-verification journal."}, "body": {"en": "<p>Identify OS/architecture and the selected release; install supported Java and matching cqlsh/Python; verify the official download checksum; configure private interfaces and authorized lab access; start the server; connect with a hidden password or protected credentials; record actual versions and an insert/read round-trip.</p><p>The tested reference was Debian 13 x86_64, Cassandra 5.0.9, cqlsh 6.2.0, Python 3.13.16 and Temurin 17.0.21+9. The factory role was disabled/rotated. Do not claim those steps are production hardening or use public default credentials.</p>"}}, {"h": {"en": "Compare PRIMARY KEY (device_id,day,reading_at) with PRIMARY KEY ((device_id,day),reading_at)."}, "body": {"en": "<p>The first partitions on device_id and clusters by day then reading_at; all days of one device share that partition. The second partitions on the pair device_id/day and clusters only by reading_at; a new day creates another logical partition.</p><p>Both complete keys identify one row. Choose the layout from required reads and expected size/load. A partition is not a server, and a daily bucket is not automatically bounded safely for every write rate.</p>"}}, {"h": {"en": "Design the sensor-history table and explain int, text, date and timestamp literals."}, "body": {"en": "<p>Use device_id text, day date, reading_at timestamp, temperature_c double and status text with PRIMARY KEY ((device_id,day),reading_at) and descending time order.</p><p>int is a signed 32-bit integer; text uses single-quoted UTF-8 string values; date stores a calendar day; timestamp stores date/time with millisecond precision. Include an explicit zone such as Z, and do not confuse double-quoted identifiers with string values. Wrong-type and null primary keys are rejected.</p>"}}, {"h": {"en": "Demonstrate Create/Alter/Drop keyspaces and tables, and state the safety/primary-key limitations."}, "body": {"en": "<p>Create a new owned prefix-scoped keyspace with NetworkTopologyStrategy, the actual datacenter1 and RF 1 for this single-node lab. Select it; retain durable writes; create a typed table, add/write/drop a regular column, change a comment and drop the table/keyspace after verification.</p><p>Refuse pre-existing namespaces. ALTER is not arbitrary primary-key repartitioning; a key-layout change needs a new model/migration. Stop after unexpected setup failures rather than continuing into someone else’s data and a DROP footer.</p>"}}, {"h": {"en": "Insert learner 1 again using only a new name. Contrast the observed CQL behaviour with a MongoDB duplicate _id insertion."}, "body": {"en": "<p>The normal CQL INSERT upserts: learner 1 becomes Asha Patel while existing city Surat and marks 82 remain; the logical row count for that key is one. Omitted existing regular columns are not removed.</p><p>That is not a normal MongoDB insertOne duplicate-ID error or whole-document replacement. Conditional/LWT variants have separate semantics and costs; do not assume they are implicit.</p>"}}, {"h": {"en": "Query ID 2, then IDs 1 and 3, then an absent ID, selecting only required columns."}, "body": {"en": "<p>WHERE learner_id=2 returns Ravi/Bharuch; WHERE learner_id IN (1,3) returns the two known identities/names; WHERE learner_id=999 returns an empty result set.</p><p>SELECT column lists shape returned data, not storage or authorization. Do not infer global name/marks ordering from a multi-partition result. Large IN fan-out and unsupported regular-field predicates need deliberate design.</p>"}}, {"h": {"en": "Derive latest two, earliest two and the [09:00,09:02) query for S01/day29."}, "body": {"en": "<p>The partition contains 30.0 at 09:00, 31.0 at 09:01 and 32.0 at 09:02 UTC. Default descending time with LIMIT 2 returns 32.0 then 31.0. Allowed ORDER BY reading_at ASC LIMIT 2 returns 30.0 then 31.0.</p><p>The half-open interval includes 09:00 and 09:01, excludes 09:02 and follows the default descending order: 31.0 then 30.0. This is not an unrestricted SQL ORDER BY on any regular field.</p>"}}, {"h": {"en": "Update Ravi’s city/marks and update previously absent learner 99. Explain the real results."}, "body": {"en": "<p>SET city=Surat and marks=75 for ID 2 reads back Ravi/Surat/75. SET name=Jai and marks=68 for missing ID 99 creates that row with city null.</p><p>Normal UPDATE is an upsert and does not return matchedCount/modifiedCount. Use the correct complete row identity; do not use ordinary-int marks=marks+5 as a mechanical translation of MongoDB $inc.</p>"}}, {"h": {"en": "Compare deleting a city cell, learner row, one sensor row and a device/day partition."}, "body": {"en": "<p>DELETE city leaves Asha/82 with city null. Deleting ID 2 yields no learner row. Deleting the full S01/day29/09:02 key leaves two readings; deleting S02/day29 without a time removes that entire selected partition.</p><p>These scopes are different. Deletes use tombstones, so missing SELECT data is not immediate physical-erasure proof. No deletedCount is returned and no repair/compaction operation is required for this lesson.</p>"}}, {"h": {"en": "Design device/day and status/day access paths and explain the 32.0 → 35.0 stale-copy experiment."}, "body": {"en": "<p>Use readings_by_device_day for one device’s history and readings_by_status_day partitioned by status/day for a different lookup. Deliberate duplicated rows avoid a join or broad scan for these queries.</p><p>The base correction reads 35.0 while the second table still has 32.0. A separate explicit second write produces 35.0 there. There is no automatic foreign-key/cascade correction or implicit cross-table SQL transaction; applications must define retry/correction policies.</p>"}}, {"h": {"en": "Explain the rejected temperature-only queries, the bounded ALLOW FILTERING example and the negative type/order/key tests."}, "body": {"en": "<p>The unindexed temperature-only WHERE is rejected with InvalidRequest, even with LIMIT 1. After fixing S01/day29, ALLOW FILTERING explicitly scans its three known rows and returns 32.0/31.0.</p><p>It is not an index or performance promise. Wrong int literal, null primary key, regular-column ORDER BY and SET on a primary-key field are also rejected; malformed SELECT yields SyntaxException. The three valid learner rows remain unchanged.</p>"}}, {"h": {"en": "Import sensors.csv with actual cqlsh and prove that distinct event keys and UTC times survived."}, "body": {"en": "<p>Create the empty sensor table, run cqlsh COPY FROM with the explicit column list, HEADER, one worker, zero tolerated import/parse errors and DATETIMEFORMAT using %z for the Z suffix.</p><p>Verify eight stored rows against every CSV key/value/time, four logical partition values and latest S01/day29 time 09:02 with 32.0. A processed-row message is not enough: incorrect timestamp parsing or duplicate full keys can collapse rows through upserts. This is a synthetic snapshot, not live ingestion.</p>"}}, {"h": {"en": "Calculate the per-partition feature summaries and explain their honest AI relevance."}, "body": {"en": "<p>S01/day29 has 30+31+32 = 93 over three samples: mean 31, min 30, max 32. S02/day29 has mean 28.5; S01/day30 has mean 33.5; S03/day29 has mean 27.</p><p>These bounded real CQL aggregates can feed a report or later model. They do not train a classifier, guarantee real-time decisions, benchmark distributed throughput or justify unrestricted production full-table scans.</p>"}}, {"h": {"en": "Interpret the actual UN observation and describe what is outside the health-awareness syllabus."}, "body": {"en": "<p>nodetool status uses management/JMX. U/D are Up/Down; N/L/J/M are Normal/Leaving/Joining/Moving. The actual private reference showed one local UN node in datacenter1.</p><p>It is one useful observation, not proof of all application/backup/replica/latency guarantees. Keep management access private. No repair, decommission, join/leave, forced compaction, failure injection or multi-node deployment is required or claimed.</p>"}}, {"h": {"en": "Prepare a Practical 4–6 acceptance checklist and explain why these tasks are not a theory paper."}, "body": {"en": "<p>Record actual platform/versions, private authorized storage evidence, query-to-key reasoning, all DDL/CRUD/WHERE/ORDER BY/LIMIT outputs, expected errors and owned scratch cleanup. For the dataset verify every CSV row/time, four logical partitions and the bounded analytic calculations; record read-only health interpretation.</p><p>Keep credentials out of submissions and state single-node/synthetic limits. Official assessment is practical PA 20 + practical ESE 30 = 50 with zero theory ESE/PA. These answered revision tasks carry no invented official theory-paper marks.</p>"}}]}], "programs": [{"id": "ns3p01", "title": {"en": "Connect, Create/Alter/Drop a Keyspace and Verify Storage"}, "code": {"en": "-- Independent private lab; the guarded runner refuses existing keyspaces.\nCREATE KEYSPACE di04000031_u3_ns3p01\nWITH replication = {'class':'NetworkTopologyStrategy',\n                    'datacenter1':1};\nUSE di04000031_u3_ns3p01;\n\n-- @result server_versions\nSELECT release_version, cql_version FROM system.local WHERE key='local';\n-- @result local_datacenter\nSELECT data_center FROM system.local WHERE key='local';\nALTER KEYSPACE di04000031_u3_ns3p01 WITH durable_writes = true;\n-- @result keyspace_options\nSELECT replication, durable_writes FROM system_schema.keyspaces\nWHERE keyspace_name='di04000031_u3_ns3p01';\nCREATE TABLE connection_probe (id int PRIMARY KEY, message text);\nINSERT INTO connection_probe (id, message) VALUES (1, 'Cassandra connected');\n-- @result stored_roundtrip\nSELECT id, message FROM connection_probe WHERE id=1;\nDROP TABLE connection_probe;\n-- @result tables_after_drop\nSELECT table_name FROM system_schema.tables\nWHERE keyspace_name='di04000031_u3_ns3p01';\n\n-- Drop only the new keyspace created by this independent example.\nUSE system;\nDROP KEYSPACE di04000031_u3_ns3p01;"}, "out": "server_versions: [{\"release_version\":\"5.0.9\",\"cql_version\":\"3.4.7\"}]\nlocal_datacenter: [{\"data_center\":\"datacenter1\"}]\nkeyspace_options: [{\"replication\":{\"class\":\"org.apache.cassandra.locator.NetworkTopologyStrategy\",\"datacenter1\":\"1\"},\"durable_writes\":true}]\nstored_roundtrip: [{\"id\":1,\"message\":\"Cassandra connected\"}]\ntables_after_drop: []\nScratch keyspace removed: true", "expl": {"en": "<p>The complete script creates one lab keyspace, selects it, alters a keyspace option, creates/writes/reads/drops a table and finally drops that newly created keyspace. NetworkTopologyStrategy uses the observed datacenter1 with RF 1 for one local node.</p><p>System tables are queried read-only. An authenticated storage round-trip is stronger evidence than a version executable alone. The public runner refuses existing namespaces and tracks successful creation before allowing cleanup.</p>"}}, {"id": "ns3p02", "title": {"en": "Typed CQL Columns, Fixed UTC Timestamp and UUID"}, "code": {"en": "-- Independent private lab; the guarded runner refuses existing keyspaces.\nCREATE KEYSPACE di04000031_u3_ns3p02\nWITH replication = {'class':'NetworkTopologyStrategy',\n                    'datacenter1':1};\nUSE di04000031_u3_ns3p02;\n\nCREATE TABLE learner_profile (\n  learner_id int PRIMARY KEY, name text, active boolean,\n  joined_at timestamp, exam_day date, score double, profile_id uuid\n);\nINSERT INTO learner_profile\n  (learner_id, name, active, joined_at, exam_day, score, profile_id)\nVALUES (1, 'Asha', true, '2026-10-29T09:00:00Z', '2026-10-29', 85.5,\n        11111111-1111-4111-8111-111111111111);\n-- @result typed_profile\nSELECT learner_id, name, active, joined_at, exam_day, score, profile_id\nFROM learner_profile WHERE learner_id=1;\n\n-- Drop only the new keyspace created by this independent example.\nUSE system;\nDROP KEYSPACE di04000031_u3_ns3p02;"}, "out": "typed_profile: [{\"learner_id\":1,\"name\":\"Asha\",\"active\":true,\"joined_at\":\"2026-10-29T09:00:00.000Z\",\"exam_day\":\"2026-10-29\",\"score\":85.5,\"profile_id\":\"11111111-1111-4111-8111-111111111111\"}]\nScratch keyspace removed: true", "expl": {"en": "<p>CQL tables have an explicit typed schema. int, text, timestamp, date, boolean, double and uuid are genuine stored types; strings use single quotes and the UUID literal is unquoted.</p><p>The runner displays timestamps in ISO UTC and date/UUID values as JSON strings. That display conversion does not change their CQL storage types. A fixed timestamp avoids machine-local timezone ambiguity.</p>"}}, {"id": "ns3p03", "title": {"en": "Composite Partition Keys and Ordered Rows"}, "code": {"en": "-- Independent private lab; the guarded runner refuses existing keyspaces.\nCREATE KEYSPACE di04000031_u3_ns3p03\nWITH replication = {'class':'NetworkTopologyStrategy',\n                    'datacenter1':1};\nUSE di04000031_u3_ns3p03;\n\nCREATE TABLE readings_by_device_day (\n  device_id text, day date, reading_at timestamp,\n  temperature_c double, status text,\n  PRIMARY KEY ((device_id, day), reading_at)\n) WITH CLUSTERING ORDER BY (reading_at DESC);\nINSERT INTO readings_by_device_day\n  (device_id, day, reading_at, temperature_c, status)\nVALUES ('S01', '2026-10-29', '2026-10-29T09:00:00Z',\n        30.0, 'ok');\nINSERT INTO readings_by_device_day\n  (device_id, day, reading_at, temperature_c, status)\nVALUES ('S01', '2026-10-29', '2026-10-29T09:01:00Z',\n        31.0, 'ok');\nINSERT INTO readings_by_device_day\n  (device_id, day, reading_at, temperature_c, status)\nVALUES ('S01', '2026-10-29', '2026-10-29T09:02:00Z',\n        32.0, 'high');\nINSERT INTO readings_by_device_day\n  (device_id, day, reading_at, temperature_c, status)\nVALUES ('S02', '2026-10-29', '2026-10-29T09:00:00Z',\n        28.0, 'ok');\nINSERT INTO readings_by_device_day\n  (device_id, day, reading_at, temperature_c, status)\nVALUES ('S02', '2026-10-29', '2026-10-29T09:01:00Z',\n        29.0, 'ok');\nINSERT INTO readings_by_device_day\n  (device_id, day, reading_at, temperature_c, status)\nVALUES ('S01', '2026-10-30', '2026-10-30T09:00:00Z',\n        33.0, 'high');\nINSERT INTO readings_by_device_day\n  (device_id, day, reading_at, temperature_c, status)\nVALUES ('S01', '2026-10-30', '2026-10-30T09:01:00Z',\n        34.0, 'high');\nINSERT INTO readings_by_device_day\n  (device_id, day, reading_at, temperature_c, status)\nVALUES ('S03', '2026-10-29', '2026-10-29T09:00:00Z',\n        27.0, 'ok');\n\n-- @result logical_partitions\nSELECT DISTINCT device_id, day FROM readings_by_device_day;\n-- @result s01_day29\nSELECT reading_at, temperature_c FROM readings_by_device_day\nWHERE device_id='S01' AND day='2026-10-29';\n-- @result s01_day30\nSELECT reading_at, temperature_c FROM readings_by_device_day\nWHERE device_id='S01' AND day='2026-10-30';\n-- @result s02_day29\nSELECT reading_at, temperature_c FROM readings_by_device_day\nWHERE device_id='S02' AND day='2026-10-29';\n\n-- Drop only the new keyspace created by this independent example.\nUSE system;\nDROP KEYSPACE di04000031_u3_ns3p03;"}, "out": "logical_partitions: [{\"device_id\":\"S01\",\"day\":\"2026-10-30\"},{\"device_id\":\"S01\",\"day\":\"2026-10-29\"},{\"device_id\":\"S03\",\"day\":\"2026-10-29\"},{\"device_id\":\"S02\",\"day\":\"2026-10-29\"}]\ns01_day29: [{\"reading_at\":\"2026-10-29T09:02:00.000Z\",\"temperature_c\":32.0},{\"reading_at\":\"2026-10-29T09:01:00.000Z\",\"temperature_c\":31.0},{\"reading_at\":\"2026-10-29T09:00:00.000Z\",\"temperature_c\":30.0}]\ns01_day30: [{\"reading_at\":\"2026-10-30T09:01:00.000Z\",\"temperature_c\":34.0},{\"reading_at\":\"2026-10-30T09:00:00.000Z\",\"temperature_c\":33.0}]\ns02_day29: [{\"reading_at\":\"2026-10-29T09:01:00.000Z\",\"temperature_c\":29.0},{\"reading_at\":\"2026-10-29T09:00:00.000Z\",\"temperature_c\":28.0}]\nScratch keyspace removed: true", "expl": {"en": "<p>Eight explicit seed records occupy four logical device/day partitions. PRIMARY KEY ((device_id,day),reading_at) uses both fields as the partition key; reading_at is the clustering column in descending order.</p><p>The same device on another day belongs to another partition. DISTINCT partition-key output is not a global lexical sort, and four logical partitions on this single physical node do not prove multi-node distribution.</p>"}}, {"id": "ns3p04", "title": {"en": "INSERT is an Upsert, Not a Duplicate-Key Error"}, "code": {"en": "-- Independent private lab; the guarded runner refuses existing keyspaces.\nCREATE KEYSPACE di04000031_u3_ns3p04\nWITH replication = {'class':'NetworkTopologyStrategy',\n                    'datacenter1':1};\nUSE di04000031_u3_ns3p04;\n\nCREATE TABLE learners_by_id (\n  learner_id int PRIMARY KEY, name text, city text, marks int\n);\nINSERT INTO learners_by_id (learner_id, name, city, marks)\nVALUES (1, 'Asha', 'Surat', 82);\nINSERT INTO learners_by_id (learner_id, name, city, marks)\nVALUES (2, 'Ravi', 'Bharuch', 70);\nINSERT INTO learners_by_id (learner_id, name, city, marks)\nVALUES (3, 'Neha', 'Surat', 92);\n\nINSERT INTO learners_by_id (learner_id, name) VALUES (1, 'Asha Patel');\n-- @result same_primary_key\nSELECT learner_id, name, city, marks FROM learners_by_id WHERE learner_id=1;\nINSERT INTO learners_by_id (learner_id, name) VALUES (4, 'Imran');\n-- @result new_primary_key\nSELECT learner_id, name, city, marks FROM learners_by_id WHERE learner_id=4;\n-- @result one_row_for_id1\nSELECT count(*) AS n FROM learners_by_id WHERE learner_id=1;\n\n-- Drop only the new keyspace created by this independent example.\nUSE system;\nDROP KEYSPACE di04000031_u3_ns3p04;"}, "out": "same_primary_key: [{\"learner_id\":1,\"name\":\"Asha Patel\",\"city\":\"Surat\",\"marks\":82}]\nnew_primary_key: [{\"learner_id\":4,\"name\":\"Imran\",\"city\":null,\"marks\":null}]\none_row_for_id1: [{\"n\":1}]\nScratch keyspace removed: true", "expl": {"en": "<p>A normal INSERT with an existing complete primary key updates the supplied columns: Asha becomes Asha Patel while city and marks remain. No ordinary duplicate-key error is expected.</p><p>A new primary key creates a new row; missing non-key values display as null. This is not whole-row replacement and does not return MongoDB-style inserted/modified counts.</p>"}}, {"id": "ns3p05", "title": {"en": "WHERE, IN and Selecting Only Required Columns"}, "code": {"en": "-- Independent private lab; the guarded runner refuses existing keyspaces.\nCREATE KEYSPACE di04000031_u3_ns3p05\nWITH replication = {'class':'NetworkTopologyStrategy',\n                    'datacenter1':1};\nUSE di04000031_u3_ns3p05;\n\nCREATE TABLE learners_by_id (\n  learner_id int PRIMARY KEY, name text, city text, marks int\n);\nINSERT INTO learners_by_id (learner_id, name, city, marks)\nVALUES (1, 'Asha', 'Surat', 82);\nINSERT INTO learners_by_id (learner_id, name, city, marks)\nVALUES (2, 'Ravi', 'Bharuch', 70);\nINSERT INTO learners_by_id (learner_id, name, city, marks)\nVALUES (3, 'Neha', 'Surat', 92);\n\n-- @result exact_id\nSELECT name, city FROM learners_by_id WHERE learner_id=2;\n-- @result two_known_ids\nSELECT learner_id, name FROM learners_by_id WHERE learner_id IN (1,3);\n-- @result missing_id\nSELECT learner_id, name FROM learners_by_id WHERE learner_id=999;\n\n-- Drop only the new keyspace created by this independent example.\nUSE system;\nDROP KEYSPACE di04000031_u3_ns3p05;"}, "out": "exact_id: [{\"name\":\"Ravi\",\"city\":\"Bharuch\"}]\ntwo_known_ids: [{\"learner_id\":1,\"name\":\"Asha\"},{\"learner_id\":3,\"name\":\"Neha\"}]\nmissing_id: []\nScratch keyspace removed: true", "expl": {"en": "<p>WHERE targets a known partition key; IN explicitly selects two keys. SELECT lists the returned columns and does not modify stored records.</p><p>The missing key yields an empty result set. Multiple partitions do not acquire a global ORDER BY name/marks; large IN lists can fan out work. CQL uses AND conditions and typed SQL-like literals, not MongoDB dollar operators.</p>"}}, {"id": "ns3p06", "title": {"en": "Clustering Order, Time Range, ORDER BY and LIMIT"}, "code": {"en": "-- Independent private lab; the guarded runner refuses existing keyspaces.\nCREATE KEYSPACE di04000031_u3_ns3p06\nWITH replication = {'class':'NetworkTopologyStrategy',\n                    'datacenter1':1};\nUSE di04000031_u3_ns3p06;\n\nCREATE TABLE readings_by_device_day (\n  device_id text, day date, reading_at timestamp,\n  temperature_c double, status text,\n  PRIMARY KEY ((device_id, day), reading_at)\n) WITH CLUSTERING ORDER BY (reading_at DESC);\nINSERT INTO readings_by_device_day\n  (device_id, day, reading_at, temperature_c, status)\nVALUES ('S01', '2026-10-29', '2026-10-29T09:00:00Z',\n        30.0, 'ok');\nINSERT INTO readings_by_device_day\n  (device_id, day, reading_at, temperature_c, status)\nVALUES ('S01', '2026-10-29', '2026-10-29T09:01:00Z',\n        31.0, 'ok');\nINSERT INTO readings_by_device_day\n  (device_id, day, reading_at, temperature_c, status)\nVALUES ('S01', '2026-10-29', '2026-10-29T09:02:00Z',\n        32.0, 'high');\nINSERT INTO readings_by_device_day\n  (device_id, day, reading_at, temperature_c, status)\nVALUES ('S02', '2026-10-29', '2026-10-29T09:00:00Z',\n        28.0, 'ok');\nINSERT INTO readings_by_device_day\n  (device_id, day, reading_at, temperature_c, status)\nVALUES ('S02', '2026-10-29', '2026-10-29T09:01:00Z',\n        29.0, 'ok');\nINSERT INTO readings_by_device_day\n  (device_id, day, reading_at, temperature_c, status)\nVALUES ('S01', '2026-10-30', '2026-10-30T09:00:00Z',\n        33.0, 'high');\nINSERT INTO readings_by_device_day\n  (device_id, day, reading_at, temperature_c, status)\nVALUES ('S01', '2026-10-30', '2026-10-30T09:01:00Z',\n        34.0, 'high');\nINSERT INTO readings_by_device_day\n  (device_id, day, reading_at, temperature_c, status)\nVALUES ('S03', '2026-10-29', '2026-10-29T09:00:00Z',\n        27.0, 'ok');\n\n-- @result latest_two\nSELECT reading_at, temperature_c FROM readings_by_device_day\nWHERE device_id='S01' AND day='2026-10-29' LIMIT 2;\n-- @result earliest_two\nSELECT reading_at, temperature_c FROM readings_by_device_day\nWHERE device_id='S01' AND day='2026-10-29'\nORDER BY reading_at ASC LIMIT 2;\n-- @result bounded_range\nSELECT reading_at, temperature_c FROM readings_by_device_day\nWHERE device_id='S01' AND day='2026-10-29'\n  AND reading_at >= '2026-10-29T09:00:00Z'\n  AND reading_at < '2026-10-29T09:02:00Z';\n\n-- Drop only the new keyspace created by this independent example.\nUSE system;\nDROP KEYSPACE di04000031_u3_ns3p06;"}, "out": "latest_two: [{\"reading_at\":\"2026-10-29T09:02:00.000Z\",\"temperature_c\":32.0},{\"reading_at\":\"2026-10-29T09:01:00.000Z\",\"temperature_c\":31.0}]\nearliest_two: [{\"reading_at\":\"2026-10-29T09:00:00.000Z\",\"temperature_c\":30.0},{\"reading_at\":\"2026-10-29T09:01:00.000Z\",\"temperature_c\":31.0}]\nbounded_range: [{\"reading_at\":\"2026-10-29T09:01:00.000Z\",\"temperature_c\":31.0},{\"reading_at\":\"2026-10-29T09:00:00.000Z\",\"temperature_c\":30.0}]\nScratch keyspace removed: true", "expl": {"en": "<p>The table-defined descending clustering order returns 32.0 then 31.0 for the latest two. An allowed reverse ORDER BY returns 30.0 then 31.0. The half-open interval includes 09:00 and excludes 09:02.</p><p>ORDER BY here applies to the clustering column in a selected partition, not arbitrary regular columns or a general cross-partition SQL sort. LIMIT bounds returned rows, not every possible cost.</p>"}}, {"id": "ns3p07", "title": {"en": "UPDATE Existing Data and Observe a Missing-Key Upsert"}, "code": {"en": "-- Independent private lab; the guarded runner refuses existing keyspaces.\nCREATE KEYSPACE di04000031_u3_ns3p07\nWITH replication = {'class':'NetworkTopologyStrategy',\n                    'datacenter1':1};\nUSE di04000031_u3_ns3p07;\n\nCREATE TABLE learners_by_id (\n  learner_id int PRIMARY KEY, name text, city text, marks int\n);\nINSERT INTO learners_by_id (learner_id, name, city, marks)\nVALUES (1, 'Asha', 'Surat', 82);\nINSERT INTO learners_by_id (learner_id, name, city, marks)\nVALUES (2, 'Ravi', 'Bharuch', 70);\nINSERT INTO learners_by_id (learner_id, name, city, marks)\nVALUES (3, 'Neha', 'Surat', 92);\n\nUPDATE learners_by_id SET city='Surat', marks=75 WHERE learner_id=2;\n-- @result ravi_after_update\nSELECT name, city, marks FROM learners_by_id WHERE learner_id=2;\nUPDATE learners_by_id SET name='Jai', marks=68 WHERE learner_id=99;\n-- @result missing_key_created\nSELECT learner_id, name, city, marks FROM learners_by_id WHERE learner_id=99;\n\n-- Drop only the new keyspace created by this independent example.\nUSE system;\nDROP KEYSPACE di04000031_u3_ns3p07;"}, "out": "ravi_after_update: [{\"name\":\"Ravi\",\"city\":\"Surat\",\"marks\":75}]\nmissing_key_created: [{\"learner_id\":99,\"name\":\"Jai\",\"city\":null,\"marks\":68}]\nScratch keyspace removed: true", "expl": {"en": "<p>UPDATE changes specified regular columns. The missing-key UPDATE creates Jai with city null; normal UPDATE is also an upsert, not “zero matches” in the MongoDB sense.</p><p>Supply the appropriate complete row key for these regular-column updates. Ordinary int values do not support marks=marks+5; counter columns have different restrictions. Conditional/LWT operations are separate from this basic lab.</p>"}}, {"id": "ns3p08", "title": {"en": "Delete a Cell, One Row and a Whole Partition"}, "code": {"en": "-- Independent private lab; the guarded runner refuses existing keyspaces.\nCREATE KEYSPACE di04000031_u3_ns3p08\nWITH replication = {'class':'NetworkTopologyStrategy',\n                    'datacenter1':1};\nUSE di04000031_u3_ns3p08;\n\nCREATE TABLE learners_by_id (\n  learner_id int PRIMARY KEY, name text, city text, marks int\n);\nINSERT INTO learners_by_id (learner_id, name, city, marks)\nVALUES (1, 'Asha', 'Surat', 82);\nINSERT INTO learners_by_id (learner_id, name, city, marks)\nVALUES (2, 'Ravi', 'Bharuch', 70);\nINSERT INTO learners_by_id (learner_id, name, city, marks)\nVALUES (3, 'Neha', 'Surat', 92);\nCREATE TABLE readings_by_device_day (\n  device_id text, day date, reading_at timestamp,\n  temperature_c double, status text,\n  PRIMARY KEY ((device_id, day), reading_at)\n) WITH CLUSTERING ORDER BY (reading_at DESC);\nINSERT INTO readings_by_device_day\n  (device_id, day, reading_at, temperature_c, status)\nVALUES ('S01', '2026-10-29', '2026-10-29T09:00:00Z',\n        30.0, 'ok');\nINSERT INTO readings_by_device_day\n  (device_id, day, reading_at, temperature_c, status)\nVALUES ('S01', '2026-10-29', '2026-10-29T09:01:00Z',\n        31.0, 'ok');\nINSERT INTO readings_by_device_day\n  (device_id, day, reading_at, temperature_c, status)\nVALUES ('S01', '2026-10-29', '2026-10-29T09:02:00Z',\n        32.0, 'high');\nINSERT INTO readings_by_device_day\n  (device_id, day, reading_at, temperature_c, status)\nVALUES ('S02', '2026-10-29', '2026-10-29T09:00:00Z',\n        28.0, 'ok');\nINSERT INTO readings_by_device_day\n  (device_id, day, reading_at, temperature_c, status)\nVALUES ('S02', '2026-10-29', '2026-10-29T09:01:00Z',\n        29.0, 'ok');\nINSERT INTO readings_by_device_day\n  (device_id, day, reading_at, temperature_c, status)\nVALUES ('S01', '2026-10-30', '2026-10-30T09:00:00Z',\n        33.0, 'high');\nINSERT INTO readings_by_device_day\n  (device_id, day, reading_at, temperature_c, status)\nVALUES ('S01', '2026-10-30', '2026-10-30T09:01:00Z',\n        34.0, 'high');\nINSERT INTO readings_by_device_day\n  (device_id, day, reading_at, temperature_c, status)\nVALUES ('S03', '2026-10-29', '2026-10-29T09:00:00Z',\n        27.0, 'ok');\n\nDELETE city FROM learners_by_id WHERE learner_id=1;\n-- @result city_cell_deleted\nSELECT learner_id, name, city, marks FROM learners_by_id WHERE learner_id=1;\nDELETE FROM learners_by_id WHERE learner_id=2;\n-- @result learner_row_deleted\nSELECT learner_id FROM learners_by_id WHERE learner_id=2;\nDELETE FROM readings_by_device_day\nWHERE device_id='S01' AND day='2026-10-29'\n  AND reading_at='2026-10-29T09:02:00Z';\n-- @result one_sensor_row_deleted\nSELECT count(*) AS n FROM readings_by_device_day\nWHERE device_id='S01' AND day='2026-10-29';\nDELETE FROM readings_by_device_day\nWHERE device_id='S02' AND day='2026-10-29';\n-- @result whole_partition_deleted\nSELECT count(*) AS n FROM readings_by_device_day\nWHERE device_id='S02' AND day='2026-10-29';\n\n-- Drop only the new keyspace created by this independent example.\nUSE system;\nDROP KEYSPACE di04000031_u3_ns3p08;"}, "out": "city_cell_deleted: [{\"learner_id\":1,\"name\":\"Asha\",\"city\":null,\"marks\":82}]\nlearner_row_deleted: []\none_sensor_row_deleted: [{\"n\":2}]\nwhole_partition_deleted: [{\"n\":0}]\nScratch keyspace removed: true", "expl": {"en": "<p>Deleting city removes that cell, leaving Asha’s other values. Deleting learner 2 removes its row. The full sensor/day/time key removes one reading; the device/day partition key without a time removes the whole selected partition.</p><p>Deletes create logical deletion markers (tombstones); disappearance from a read is not proof of immediate physical byte erasure. No deletedCount is returned. Confirm key scope and never use a real application keyspace for this lab.</p>"}}, {"id": "ns3p09", "title": {"en": "ALTER TABLE, Nullable New Columns and DROP TABLE"}, "code": {"en": "-- Independent private lab; the guarded runner refuses existing keyspaces.\nCREATE KEYSPACE di04000031_u3_ns3p09\nWITH replication = {'class':'NetworkTopologyStrategy',\n                    'datacenter1':1};\nUSE di04000031_u3_ns3p09;\n\nCREATE TABLE learner_schema (learner_id int PRIMARY KEY, name text);\nINSERT INTO learner_schema (learner_id, name) VALUES (1, 'Asha');\nALTER TABLE learner_schema ADD city text;\n-- @result added_column_initially_null\nSELECT learner_id, name, city FROM learner_schema WHERE learner_id=1;\nUPDATE learner_schema SET city='Surat' WHERE learner_id=1;\n-- @result added_column_written\nSELECT name, city FROM learner_schema WHERE learner_id=1;\nALTER TABLE learner_schema WITH comment='Small schema-change lab';\n-- @result table_comment\nSELECT comment FROM system_schema.tables\nWHERE keyspace_name='di04000031_u3_ns3p09' AND table_name='learner_schema';\nALTER TABLE learner_schema DROP city;\n-- @result columns_after_drop\nSELECT column_name, kind, type FROM system_schema.columns\nWHERE keyspace_name='di04000031_u3_ns3p09' AND table_name='learner_schema';\nDROP TABLE learner_schema;\n-- @result table_removed\nSELECT table_name FROM system_schema.tables\nWHERE keyspace_name='di04000031_u3_ns3p09' AND table_name='learner_schema';\n\n-- Drop only the new keyspace created by this independent example.\nUSE system;\nDROP KEYSPACE di04000031_u3_ns3p09;"}, "out": "added_column_initially_null: [{\"learner_id\":1,\"name\":\"Asha\",\"city\":null}]\nadded_column_written: [{\"name\":\"Asha\",\"city\":\"Surat\"}]\ntable_comment: [{\"comment\":\"Small schema-change lab\"}]\ncolumns_after_drop: [{\"column_name\":\"learner_id\",\"kind\":\"partition_key\",\"type\":\"int\"},{\"column_name\":\"name\",\"kind\":\"regular\",\"type\":\"text\"}]\ntable_removed: []\nScratch keyspace removed: true", "expl": {"en": "<p>ADD introduces a typed regular column; older rows initially display null. The example writes it, changes a table comment, drops the regular column and drops the table.</p><p>ALTER TABLE does not let you append an arbitrary new primary-key component or change partitioning in place. Create a query-shaped new table and migrate deliberately when the key design changes; primary-key-column rename support is not a repartitioning operation.</p>"}}, {"id": "ns3p10", "title": {"en": "Query-First Tables and Denormalization Consistency"}, "code": {"en": "-- Independent private lab; the guarded runner refuses existing keyspaces.\nCREATE KEYSPACE di04000031_u3_ns3p10\nWITH replication = {'class':'NetworkTopologyStrategy',\n                    'datacenter1':1};\nUSE di04000031_u3_ns3p10;\n\nCREATE TABLE readings_by_device_day (\n  device_id text, day date, reading_at timestamp,\n  temperature_c double, status text,\n  PRIMARY KEY ((device_id, day), reading_at)\n) WITH CLUSTERING ORDER BY (reading_at DESC);\nINSERT INTO readings_by_device_day\n  (device_id, day, reading_at, temperature_c, status)\nVALUES ('S01', '2026-10-29', '2026-10-29T09:00:00Z',\n        30.0, 'ok');\nINSERT INTO readings_by_device_day\n  (device_id, day, reading_at, temperature_c, status)\nVALUES ('S01', '2026-10-29', '2026-10-29T09:01:00Z',\n        31.0, 'ok');\nINSERT INTO readings_by_device_day\n  (device_id, day, reading_at, temperature_c, status)\nVALUES ('S01', '2026-10-29', '2026-10-29T09:02:00Z',\n        32.0, 'high');\nINSERT INTO readings_by_device_day\n  (device_id, day, reading_at, temperature_c, status)\nVALUES ('S02', '2026-10-29', '2026-10-29T09:00:00Z',\n        28.0, 'ok');\nINSERT INTO readings_by_device_day\n  (device_id, day, reading_at, temperature_c, status)\nVALUES ('S02', '2026-10-29', '2026-10-29T09:01:00Z',\n        29.0, 'ok');\nINSERT INTO readings_by_device_day\n  (device_id, day, reading_at, temperature_c, status)\nVALUES ('S01', '2026-10-30', '2026-10-30T09:00:00Z',\n        33.0, 'high');\nINSERT INTO readings_by_device_day\n  (device_id, day, reading_at, temperature_c, status)\nVALUES ('S01', '2026-10-30', '2026-10-30T09:01:00Z',\n        34.0, 'high');\nINSERT INTO readings_by_device_day\n  (device_id, day, reading_at, temperature_c, status)\nVALUES ('S03', '2026-10-29', '2026-10-29T09:00:00Z',\n        27.0, 'ok');\nCREATE TABLE readings_by_status_day (\n  status text, day date, device_id text,\n  reading_at timestamp, temperature_c double,\n  PRIMARY KEY ((status, day), device_id, reading_at)\n) WITH CLUSTERING ORDER BY (device_id ASC, reading_at DESC);\nINSERT INTO readings_by_status_day\n  (status, day, device_id, reading_at, temperature_c)\nVALUES ('ok', '2026-10-29', 'S01',\n        '2026-10-29T09:00:00Z', 30.0);\nINSERT INTO readings_by_status_day\n  (status, day, device_id, reading_at, temperature_c)\nVALUES ('ok', '2026-10-29', 'S01',\n        '2026-10-29T09:01:00Z', 31.0);\nINSERT INTO readings_by_status_day\n  (status, day, device_id, reading_at, temperature_c)\nVALUES ('high', '2026-10-29', 'S01',\n        '2026-10-29T09:02:00Z', 32.0);\nINSERT INTO readings_by_status_day\n  (status, day, device_id, reading_at, temperature_c)\nVALUES ('ok', '2026-10-29', 'S02',\n        '2026-10-29T09:00:00Z', 28.0);\nINSERT INTO readings_by_status_day\n  (status, day, device_id, reading_at, temperature_c)\nVALUES ('ok', '2026-10-29', 'S02',\n        '2026-10-29T09:01:00Z', 29.0);\nINSERT INTO readings_by_status_day\n  (status, day, device_id, reading_at, temperature_c)\nVALUES ('high', '2026-10-30', 'S01',\n        '2026-10-30T09:00:00Z', 33.0);\nINSERT INTO readings_by_status_day\n  (status, day, device_id, reading_at, temperature_c)\nVALUES ('high', '2026-10-30', 'S01',\n        '2026-10-30T09:01:00Z', 34.0);\nINSERT INTO readings_by_status_day\n  (status, day, device_id, reading_at, temperature_c)\nVALUES ('ok', '2026-10-29', 'S03',\n        '2026-10-29T09:00:00Z', 27.0);\n\n-- @result high_day29\nSELECT device_id, reading_at, temperature_c FROM readings_by_status_day\nWHERE status='high' AND day='2026-10-29';\nUPDATE readings_by_device_day SET temperature_c=35.0\nWHERE device_id='S01' AND day='2026-10-29'\n  AND reading_at='2026-10-29T09:02:00Z';\n-- @result base_corrected\nSELECT temperature_c FROM readings_by_device_day\nWHERE device_id='S01' AND day='2026-10-29'\n  AND reading_at='2026-10-29T09:02:00Z';\n-- @result second_table_still_old\nSELECT temperature_c FROM readings_by_status_day\nWHERE status='high' AND day='2026-10-29' AND device_id='S01'\n  AND reading_at='2026-10-29T09:02:00Z';\nUPDATE readings_by_status_day SET temperature_c=35.0\nWHERE status='high' AND day='2026-10-29' AND device_id='S01'\n  AND reading_at='2026-10-29T09:02:00Z';\n-- @result second_table_corrected\nSELECT temperature_c FROM readings_by_status_day\nWHERE status='high' AND day='2026-10-29' AND device_id='S01'\n  AND reading_at='2026-10-29T09:02:00Z';\n\n-- Drop only the new keyspace created by this independent example.\nUSE system;\nDROP KEYSPACE di04000031_u3_ns3p10;"}, "out": "high_day29: [{\"device_id\":\"S01\",\"reading_at\":\"2026-10-29T09:02:00.000Z\",\"temperature_c\":32.0}]\nbase_corrected: [{\"temperature_c\":35.0}]\nsecond_table_still_old: [{\"temperature_c\":32.0}]\nsecond_table_corrected: [{\"temperature_c\":35.0}]\nScratch keyspace removed: true", "expl": {"en": "<p>Device/day history and status/day lookup are different access patterns, so two intentionally duplicated tables serve them. No join is needed for the shown reads.</p><p>Correcting the base table to 35.0 leaves the second table at 32.0 until the explicit second write. These writes are not automatically one cross-table SQL transaction, and no automatic foreign key/cascade is provided. The status labels are fixture data, not predictions from a trained model.</p>"}}, {"id": "ns3p11", "title": {"en": "Rejected Non-Key Filters and a Tiny Bounded Filtering Example"}, "code": {"en": "-- Independent private lab; the guarded runner refuses existing keyspaces.\nCREATE KEYSPACE di04000031_u3_ns3p11\nWITH replication = {'class':'NetworkTopologyStrategy',\n                    'datacenter1':1};\nUSE di04000031_u3_ns3p11;\n\nCREATE TABLE readings_by_device_day (\n  device_id text, day date, reading_at timestamp,\n  temperature_c double, status text,\n  PRIMARY KEY ((device_id, day), reading_at)\n) WITH CLUSTERING ORDER BY (reading_at DESC);\nINSERT INTO readings_by_device_day\n  (device_id, day, reading_at, temperature_c, status)\nVALUES ('S01', '2026-10-29', '2026-10-29T09:00:00Z',\n        30.0, 'ok');\nINSERT INTO readings_by_device_day\n  (device_id, day, reading_at, temperature_c, status)\nVALUES ('S01', '2026-10-29', '2026-10-29T09:01:00Z',\n        31.0, 'ok');\nINSERT INTO readings_by_device_day\n  (device_id, day, reading_at, temperature_c, status)\nVALUES ('S01', '2026-10-29', '2026-10-29T09:02:00Z',\n        32.0, 'high');\nINSERT INTO readings_by_device_day\n  (device_id, day, reading_at, temperature_c, status)\nVALUES ('S02', '2026-10-29', '2026-10-29T09:00:00Z',\n        28.0, 'ok');\nINSERT INTO readings_by_device_day\n  (device_id, day, reading_at, temperature_c, status)\nVALUES ('S02', '2026-10-29', '2026-10-29T09:01:00Z',\n        29.0, 'ok');\nINSERT INTO readings_by_device_day\n  (device_id, day, reading_at, temperature_c, status)\nVALUES ('S01', '2026-10-30', '2026-10-30T09:00:00Z',\n        33.0, 'high');\nINSERT INTO readings_by_device_day\n  (device_id, day, reading_at, temperature_c, status)\nVALUES ('S01', '2026-10-30', '2026-10-30T09:01:00Z',\n        34.0, 'high');\nINSERT INTO readings_by_device_day\n  (device_id, day, reading_at, temperature_c, status)\nVALUES ('S03', '2026-10-29', '2026-10-29T09:00:00Z',\n        27.0, 'ok');\n\n-- @result non_key_filter_rejected\n-- @expect InvalidRequest\nSELECT device_id, temperature_c FROM readings_by_device_day\nWHERE temperature_c > 30.0;\n-- @result limit_does_not_legalize_filter\n-- @expect InvalidRequest\nSELECT device_id, temperature_c FROM readings_by_device_day\nWHERE temperature_c > 30.0 LIMIT 1;\n-- @result bounded_partition_filter\nSELECT reading_at, temperature_c FROM readings_by_device_day\nWHERE device_id='S01' AND day='2026-10-29'\n  AND temperature_c > 30.0 ALLOW FILTERING;\n\n-- Drop only the new keyspace created by this independent example.\nUSE system;\nDROP KEYSPACE di04000031_u3_ns3p11;"}, "out": "non_key_filter_rejected: InvalidRequest (server rejection)\nlimit_does_not_legalize_filter: InvalidRequest (server rejection)\nbounded_partition_filter: [{\"reading_at\":\"2026-10-29T09:02:00.000Z\",\"temperature_c\":32.0},{\"reading_at\":\"2026-10-29T09:01:00.000Z\",\"temperature_c\":31.0}]\nScratch keyspace removed: true", "expl": {"en": "<p>The two unindexed non-key queries are deliberately rejected by the server. Adding LIMIT 1 does not make this unsupported access path valid.</p><p>ALLOW FILTERING is demonstrated only after fixing the device/day partition, which contains three known fixture rows. It permits residual filtering; it does not create an index or guarantee scalable latency. Prefer query-first tables or a suitable deliberately chosen index for real access patterns.</p>"}}, {"id": "ns3p12", "title": {"en": "Import the Synthetic Sensor CSV with Actual cqlsh COPY FROM"}, "code": {"en": "-- Independent private lab; the guarded runner refuses existing keyspaces.\nCREATE KEYSPACE di04000031_u3_ns3p12\nWITH replication = {'class':'NetworkTopologyStrategy',\n                    'datacenter1':1};\nUSE di04000031_u3_ns3p12;\n\nCREATE TABLE readings_by_device_day (\n  device_id text, day date, reading_at timestamp,\n  temperature_c double, status text,\n  PRIMARY KEY ((device_id, day), reading_at)\n) WITH CLUSTERING ORDER BY (reading_at DESC);\n\n-- COPY is a cqlsh special command, not a native CQL statement.\n-- The runner delegates this exact command to real matching cqlsh.\n-- Run from the folder containing the supplied sensors.csv.\n-- @result csv_import\nCOPY readings_by_device_day\n  (device_id, day, reading_at, temperature_c, status)\nFROM 'sensors.csv' WITH HEADER=TRUE AND NUMPROCESSES=1\n  AND DATETIMEFORMAT='%Y-%m-%dT%H:%M:%S%z'\n  AND MAXPARSEERRORS=0 AND MAXINSERTERRORS=0\n  AND MINBATCHSIZE=1 AND MAXBATCHSIZE=1;\n-- @result imported_row_count\nSELECT count(*) AS n FROM readings_by_device_day;\n-- @result imported_partitions\nSELECT DISTINCT device_id, day FROM readings_by_device_day;\n-- @result imported_rows\nSELECT device_id, day, reading_at, temperature_c, status\nFROM readings_by_device_day;\n-- @result latest_imported_reading\nSELECT reading_at, temperature_c FROM readings_by_device_day\nWHERE device_id='S01' AND day='2026-10-29' LIMIT 1;\n\n-- Drop only the new keyspace created by this independent example.\nUSE system;\nDROP KEYSPACE di04000031_u3_ns3p12;"}, "out": "csv_import: cqlsh COPY FROM completed (8 rows imported)\nimported_row_count: [{\"n\":8}]\nimported_partitions: [{\"device_id\":\"S01\",\"day\":\"2026-10-30\"},{\"device_id\":\"S01\",\"day\":\"2026-10-29\"},{\"device_id\":\"S03\",\"day\":\"2026-10-29\"},{\"device_id\":\"S02\",\"day\":\"2026-10-29\"}]\nimported_rows: [{\"device_id\":\"S01\",\"day\":\"2026-10-30\",\"reading_at\":\"2026-10-30T09:01:00.000Z\",\"temperature_c\":34.0,\"status\":\"high\"},{\"device_id\":\"S01\",\"day\":\"2026-10-30\",\"reading_at\":\"2026-10-30T09:00:00.000Z\",\"temperature_c\":33.0,\"status\":\"high\"},{\"device_id\":\"S01\",\"day\":\"2026-10-29\",\"reading_at\":\"2026-10-29T09:02:00.000Z\",\"temperature_c\":32.0,\"status\":\"high\"},{\"device_id\":\"S01\",\"day\":\"2026-10-29\",\"reading_at\":\"2026-10-29T09:01:00.000Z\",\"temperature_c\":31.0,\"status\":\"ok\"},{\"device_id\":\"S01\",\"day\":\"2026-10-29\",\"reading_at\":\"2026-10-29T09:00:00.000Z\",\"temperature_c\":30.0,\"status\":\"ok\"},{\"device_id\":\"S03\",\"day\":\"2026-10-29\",\"reading_at\":\"2026-10-29T09:00:00.000Z\",\"temperature_c\":27.0,\"status\":\"ok\"},{\"device_id\":\"S02\",\"day\":\"2026-10-29\",\"reading_at\":\"2026-10-29T09:01:00.000Z\",\"temperature_c\":29.0,\"status\":\"ok\"},{\"device_id\":\"S02\",\"day\":\"2026-10-29\",\"reading_at\":\"2026-10-29T09:00:00.000Z\",\"temperature_c\":28.0,\"status\":\"ok\"}]\nlatest_imported_reading: [{\"reading_at\":\"2026-10-29T09:02:00.000Z\",\"temperature_c\":32.0}]\nScratch keyspace removed: true", "expl": {"en": "<p>Eight synthetic CSV records are actually imported by cqlsh COPY FROM, then verified through Cassandra reads: eight rows, four logical partitions and latest S01/day29 value 32.0. There is no hidden extra seed for this example. Explicit DATETIMEFORMAT with %z preserves the UTC times; a processed-row message alone is not proof of distinct stored rows.</p><p>The runner captures COPY completion while omitting changing rates/timings from the published output; JSON rows
