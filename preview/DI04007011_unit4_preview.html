148.5\" fill=\"#2E7D32\"/><text x=\"171\" y=\"170.7\" font-size=\"7.8\" text-anchor=\"middle\" fill=\"#2E7D32\" font-weight=\"normal\">new ID*</text><rect x=\"12\" y=\"204\" width=\"336\" height=\"42\" rx=\"7\" fill=\"#F1E8FC\" stroke=\"#7B2CD9\" stroke-width=\"1.2\"/><text font-family=\"DejaVu Sans Mono, Consolas, monospace\" x=\"24\" y=\"218.8\" font-size=\"8.0\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">session_start();    // create OR resume</text><text font-family=\"DejaVu Sans Mono, Consolas, monospace\" x=\"24\" y=\"233.8\" font-size=\"8.0\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">$_SESSION[\"seats\"] = 1;</text><rect x=\"12\" y=\"264\" width=\"336\" height=\"70\" rx=\"7\" fill=\"#E3F0FC\" stroke=\"#1565C0\" stroke-width=\"1.1\"/><text x=\"20\" y=\"282.1\" font-size=\"8.9\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">Every participating page starts/resumes first.</text><text x=\"20\" y=\"297.1\" font-size=\"8.9\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">The same browser cookie selects the same data.</text><text x=\"20\" y=\"312.1\" font-size=\"8.9\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">*Set-Cookie is needed for a new/rotated ID,</text><text x=\"20\" y=\"327.1\" font-size=\"8.9\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">not necessarily on every response.</text></svg>", "wd4_login_flow": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 420\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"420\" fill=\"#ffffff\"/><text x=\"180\" y=\"22.7\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">Login to Logout: The Session Gate</text><rect x=\"12\" y=\"44\" width=\"336\" height=\"38\" rx=\"7\" fill=\"#E3F0FC\" stroke=\"#1565C0\" stroke-width=\"1.2\"/><text x=\"24\" y=\"59.0\" font-size=\"8.5\" text-anchor=\"start\" fill=\"#1565C0\" font-weight=\"bold\">1  GUEST ASKS FOR DASHBOARD</text><text x=\"24\" y=\"73.8\" font-size=\"8.0\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">No session user -&gt; redirect to login</text><path d=\"M180 82 L180 94\" fill=\"none\" stroke=\"#222\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polygon points=\"180.0,94.0 183.5,87.0 176.5,87.0\" fill=\"#222\"/><rect x=\"12\" y=\"94\" width=\"336\" height=\"38\" rx=\"7\" fill=\"#E3F0FC\" stroke=\"#1565C0\" stroke-width=\"1.2\"/><text x=\"24\" y=\"109.0\" font-size=\"8.5\" text-anchor=\"start\" fill=\"#1565C0\" font-weight=\"bold\">2  LOGIN FORM POSTS CREDENTIALS</text><text x=\"24\" y=\"123.8\" font-size=\"8.0\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">Check CSRF + username + password_verify()</text><path d=\"M180 132 L180 144\" fill=\"none\" stroke=\"#222\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polygon points=\"180.0,144.0 183.5,137.0 176.5,137.0\" fill=\"#222\"/><rect x=\"12\" y=\"144\" width=\"336\" height=\"38\" rx=\"7\" fill=\"#E3F5E6\" stroke=\"#2E7D32\" stroke-width=\"1.2\"/><text x=\"24\" y=\"159.0\" font-size=\"8.5\" text-anchor=\"start\" fill=\"#2E7D32\" font-weight=\"bold\">3  SUCCESS: ROTATE THE SESSION ID</text><text x=\"24\" y=\"173.8\" font-size=\"8.0\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">session_regenerate_id(true); save session user</text><path d=\"M180 182 L180 194\" fill=\"none\" stroke=\"#222\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polygon points=\"180.0,194.0 183.5,187.0 176.5,187.0\" fill=\"#222\"/><rect x=\"12\" y=\"194\" width=\"336\" height=\"38\" rx=\"7\" fill=\"#E3F5E6\" stroke=\"#2E7D32\" stroke-width=\"1.2\"/><text x=\"24\" y=\"209.0\" font-size=\"8.5\" text-anchor=\"start\" fill=\"#2E7D32\" font-weight=\"bold\">4  DASHBOARD GUARD PASSES</text><text x=\"24\" y=\"223.8\" font-size=\"8.0\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">Read server-side user; escape it before HTML</text><path d=\"M180 232 L180 244\" fill=\"none\" stroke=\"#222\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polygon points=\"180.0,244.0 183.5,237.0 176.5,237.0\" fill=\"#222\"/><rect x=\"12\" y=\"244\" width=\"336\" height=\"38\" rx=\"7\" fill=\"#FDECEC\" stroke=\"#C62828\" stroke-width=\"1.2\"/><text x=\"24\" y=\"259.0\" font-size=\"8.5\" text-anchor=\"start\" fill=\"#C62828\" font-weight=\"bold\">5  LOGOUT: VALID-TOKEN POST</text><text x=\"24\" y=\"273.8\" font-size=\"8.0\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">Clear variables + expire cookie + destroy</text><path d=\"M180 282 L180 294\" fill=\"none\" stroke=\"#222\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polygon points=\"180.0,294.0 183.5,287.0 176.5,287.0\" fill=\"#222\"/><rect x=\"12\" y=\"294\" width=\"336\" height=\"38\" rx=\"7\" fill=\"#FFF1DE\" stroke=\"#E07B00\" stroke-width=\"1.2\"/><text x=\"24\" y=\"309.0\" font-size=\"8.5\" text-anchor=\"start\" fill=\"#E07B00\" font-weight=\"bold\">6  DASHBOARD GUARD FAILS AGAIN</text><text x=\"24\" y=\"323.8\" font-size=\"8.0\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">Direct URL access redirects back to login</text><rect x=\"12\" y=\"350\" width=\"336\" height=\"55\" rx=\"7\" fill=\"#E3F0FC\" stroke=\"#1565C0\" stroke-width=\"1.1\"/><text x=\"20\" y=\"368.1\" font-size=\"8.9\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">Check authentication on EVERY protected page.</text><text x=\"20\" y=\"383.1\" font-size=\"8.9\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">Hiding a link is not protection. Wrong password</text><text x=\"20\" y=\"398.1\" font-size=\"8.9\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">must never create an authenticated session.</text></svg>", "wd4_cookie_vs_session": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 362\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"362\" fill=\"#ffffff\"/><text x=\"180\" y=\"23.1\" font-size=\"14.5\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">Cookies vs Sessions</text><rect x=\"12\" y=\"44\" width=\"78\" height=\"25\" rx=\"0\" fill=\"#7B2CD9\" stroke=\"#C9B3EC\" stroke-width=\"1\"/><text x=\"51.0\" y=\"59.1\" font-size=\"7.4\" text-anchor=\"middle\" fill=\"#fff\" font-weight=\"bold\">feature</text><rect x=\"90\" y=\"44\" width=\"129\" height=\"25\" rx=\"0\" fill=\"#7B2CD9\" stroke=\"#C9B3EC\" stroke-width=\"1\"/><text x=\"154.5\" y=\"59.1\" font-size=\"7.4\" text-anchor=\"middle\" fill=\"#fff\" font-weight=\"bold\">cookie value</text><rect x=\"219\" y=\"44\" width=\"129\" height=\"25\" rx=\"0\" fill=\"#7B2CD9\" stroke=\"#C9B3EC\" stroke-width=\"1\"/><text x=\"283.5\" y=\"59.1\" font-size=\"7.4\" text-anchor=\"middle\" fill=\"#fff\" font-weight=\"bold\">session data</text><rect x=\"12\" y=\"69\" width=\"78\" height=\"25\" rx=\"0\" fill=\"#fff\" stroke=\"#C9B3EC\" stroke-width=\"1\"/><text x=\"51.0\" y=\"84.1\" font-size=\"7.4\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">stored at</text><rect x=\"90\" y=\"69\" width=\"129\" height=\"25\" rx=\"0\" fill=\"#fff\" stroke=\"#C9B3EC\" stroke-width=\"1\"/><text x=\"154.5\" y=\"84.1\" font-size=\"7.4\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">browser</text><rect x=\"219\" y=\"69\" width=\"129\" height=\"25\" rx=\"0\" fill=\"#fff\" stroke=\"#C9B3EC\" stroke-width=\"1\"/><text x=\"283.5\" y=\"84.1\" font-size=\"7.4\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">server</text><rect x=\"12\" y=\"94\" width=\"78\" height=\"25\" rx=\"0\" fill=\"#fff\" stroke=\"#C9B3EC\" stroke-width=\"1\"/><text x=\"51.0\" y=\"109.1\" font-size=\"7.4\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">request sends</text><rect x=\"90\" y=\"94\" width=\"129\" height=\"25\" rx=\"0\" fill=\"#fff\" stroke=\"#C9B3EC\" stroke-width=\"1\"/><text x=\"154.5\" y=\"109.1\" font-size=\"7.4\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">the value</text><rect x=\"219\" y=\"94\" width=\"129\" height=\"25\" rx=\"0\" fill=\"#fff\" stroke=\"#C9B3EC\" stroke-width=\"1\"/><text x=\"283.5\" y=\"109.1\" font-size=\"7.4\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">usually just an ID</text><rect x=\"12\" y=\"119\" width=\"78\" height=\"25\" rx=\"0\" fill=\"#fff\" stroke=\"#C9B3EC\" stroke-width=\"1\"/><text x=\"51.0\" y=\"134.1\" font-size=\"7.4\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">capacity</text><rect x=\"90\" y=\"119\" width=\"129\" height=\"25\" rx=\"0\" fill=\"#fff\" stroke=\"#C9B3EC\" stroke-width=\"1\"/><text x=\"154.5\" y=\"134.1\" font-size=\"7.4\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">small (~4 KB each)</text><rect x=\"219\" y=\"119\" width=\"129\" height=\"25\" rx=\"0\" fill=\"#fff\" stroke=\"#C9B3EC\" stroke-width=\"1\"/><text x=\"283.5\" y=\"134.1\" font-size=\"7.4\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">server limits apply</text><rect x=\"12\" y=\"144\" width=\"78\" height=\"25\" rx=\"0\" fill=\"#fff\" stroke=\"#C9B3EC\" stroke-width=\"1\"/><text x=\"51.0\" y=\"159.1\" font-size=\"7.4\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">lifetime</text><rect x=\"90\" y=\"144\" width=\"129\" height=\"25\" rx=\"0\" fill=\"#fff\" stroke=\"#C9B3EC\" stroke-width=\"1\"/><text x=\"154.5\" y=\"159.1\" font-size=\"7.4\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">expiry/browser policy</text><rect x=\"219\" y=\"144\" width=\"129\" height=\"25\" rx=\"0\" fill=\"#fff\" stroke=\"#C9B3EC\" stroke-width=\"1\"/><text x=\"283.5\" y=\"159.1\" font-size=\"7.4\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">server expiry policy</text><rect x=\"12\" y=\"169\" width=\"78\" height=\"25\" rx=\"0\" fill=\"#fff\" stroke=\"#C9B3EC\" stroke-width=\"1\"/><text x=\"51.0\" y=\"184.1\" font-size=\"7.4\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">control</text><rect x=\"90\" y=\"169\" width=\"129\" height=\"25\" rx=\"0\" fill=\"#fff\" stroke=\"#C9B3EC\" stroke-width=\"1\"/><text x=\"154.5\" y=\"184.1\" font-size=\"7.4\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">client can edit it</text><rect x=\"219\" y=\"169\" width=\"129\" height=\"25\" rx=\"0\" fill=\"#fff\" stroke=\"#C9B3EC\" stroke-width=\"1\"/><text x=\"283.5\" y=\"184.1\" font-size=\"7.4\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">app controls values</text><rect x=\"12\" y=\"194\" width=\"78\" height=\"25\" rx=\"0\" fill=\"#fff\" stroke=\"#C9B3EC\" stroke-width=\"1\"/><text x=\"51.0\" y=\"209.1\" font-size=\"7.4\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">risk</text><rect x=\"90\" y=\"194\" width=\"129\" height=\"25\" rx=\"0\" fill=\"#fff\" stroke=\"#C9B3EC\" stroke-width=\"1\"/><text x=\"154.5\" y=\"209.1\" font-size=\"7.4\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">tampered value</text><rect x=\"219\" y=\"194\" width=\"129\" height=\"25\" rx=\"0\" fill=\"#fff\" stroke=\"#C9B3EC\" stroke-width=\"1\"/><text x=\"283.5\" y=\"209.1\" font-size=\"7.4\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">stolen session ID</text><rect x=\"12\" y=\"219\" width=\"78\" height=\"25\" rx=\"0\" fill=\"#fff\" stroke=\"#C9B3EC\" stroke-width=\"1\"/><text x=\"51.0\" y=\"234.1\" font-size=\"7.4\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">good for</text><rect x=\"90\" y=\"219\" width=\"129\" height=\"25\" rx=\"0\" fill=\"#fff\" stroke=\"#C9B3EC\" stroke-width=\"1\"/><text x=\"154.5\" y=\"234.1\" font-size=\"7.4\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">theme / language</text><rect x=\"219\" y=\"219\" width=\"129\" height=\"25\" rx=\"0\" fill=\"#fff\" stroke=\"#C9B3EC\" stroke-width=\"1\"/><text x=\"283.5\" y=\"234.1\" font-size=\"7.4\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">login / cart / flash</text><rect x=\"12\" y=\"262\" width=\"336\" height=\"85\" rx=\"7\" fill=\"#E3F0FC\" stroke=\"#1565C0\" stroke-width=\"1.1\"/><text x=\"20\" y=\"280.1\" font-size=\"8.9\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">Sessions often USE a cookie to carry the ID.</text><text x=\"20\" y=\"295.1\" font-size=\"8.9\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">They are not independent alternatives at the</text><text x=\"20\" y=\"310.1\" font-size=\"8.9\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">transport layer. Protect the ID with HTTPS,</text><text x=\"20\" y=\"325.1\" font-size=\"8.9\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">HttpOnly and regeneration after login.</text><text x=\"20\" y=\"340.1\" font-size=\"8.9\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">Browser-close is not a reliable logout policy.</text></svg>", "wd4_exception_flow": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 456\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"456\" fill=\"#ffffff\"/><text x=\"180\" y=\"23.1\" font-size=\"14.5\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">Exception Flow: Success and Failure</text><rect x=\"109.0\" y=\"43.0\" width=\"142\" height=\"30\" rx=\"7\" fill=\"#E3F0FC\" stroke=\"#1565C0\" stroke-width=\"1.6\"/><text x=\"180\" y=\"61.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">enter try</text><path d=\"M180 73 L180 100\" fill=\"none\" stroke=\"#222\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polygon points=\"180.0,100.0 183.5,93.0 176.5,93.0\" fill=\"#222\"/><polygon points=\"180,100.0 243.0,124 180,148.0 117.0,124\" fill=\"#FFF1DE\" stroke=\"#E07B00\" stroke-width=\"1.8\"/><text x=\"180\" y=\"127.2\" font-size=\"9\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">exception thrown?</text><path d=\"M117 124 L70 124 L70 186\" fill=\"none\" stroke=\"#1565C0\" stroke-width=\"1.8\" stroke-linecap=\"round\" \" stroke-linejoin=\"round\"/><polygon points=\"180.0,334.0 183.5,327.0 176.5,327.0\" fill=\"#222\"/><rect x=\"72.0\" y=\"335.0\" width=\"216\" height=\"30\" rx=\"15.0\" fill=\"#E3F5E6\" stroke=\"#2E7D32\" stroke-width=\"1.8\"/><text x=\"180\" y=\"353.1\" font-size=\"8.9\" text-anchor=\"middle\" fill=\"#1B5E20\" font-weight=\"bold\">continue after handled result</text><rect x=\"12\" y=\"386\" width=\"336\" height=\"55\" rx=\"7\" fill=\"#E3F0FC\" stroke=\"#1565C0\" stroke-width=\"1.1\"/><text x=\"20\" y=\"404.1\" font-size=\"8.9\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">No matching catch? finally runs, then the</text><text x=\"20\" y=\"419.1\" font-size=\"8.9\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">exception propagates to the caller.</text><text x=\"20\" y=\"434.1\" font-size=\"8.9\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">exit()/process termination can skip finally.</text></svg>", "wd4_exception_tree": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 376\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"376\" fill=\"#ffffff\"/><text x=\"180\" y=\"23.1\" font-size=\"14.5\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">Modern PHP: The Throwable Family</text><rect x=\"107.0\" y=\"40.0\" width=\"146\" height=\"32\" rx=\"7\" fill=\"#F1E8FC\" stroke=\"#7B2CD9\" stroke-width=\"1.6\"/><text x=\"180\" y=\"59.3\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">Throwable (interface)</text><path d=\"M180 72 L180 94 L84 94 L84 116\" fill=\"none\" stroke=\"#1565C0\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polygon points=\"84.0,116.0 87.5,109.0 80.5,109.0\" fill=\"#1565C0\"/><path d=\"M180 94 L276 94 L276 116\" fill=\"none\" stroke=\"#C62828\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polygon points=\"276.0,116.0 279.5,109.0 272.5,109.0\" fill=\"#C62828\"/><rect x=\"14.0\" y=\
