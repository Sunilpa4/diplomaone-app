ins os (notes.txt) and c (prog.c). The current directory is /home/ravi. Write the absolute and relative paths of notes.txt, prog.c, a.c and passwd.", "gu": "Directory tree: / માં bin (ls), home અને etc (passwd); home માં ravi અને priya (a.c); ravi માં os (notes.txt) અને c (prog.c). Current directory /home/ravi છે. notes.txt, prog.c, a.c અને passwd ના absolute અને relative paths લખો."}, "a": {"en": "<p><b>Absolute path</b> starts from the root (/). <b>Relative path</b> starts from the current directory; <code>..</code> means the parent directory and <code>.</code> means the current directory.</p><table><tr><th>File</th><th>Absolute path</th><th>Relative path (cwd = /home/ravi)</th></tr><tr><td>notes.txt</td><td>/home/ravi/os/notes.txt</td><td>os/notes.txt</td></tr><tr><td>prog.c</td><td>/home/ravi/c/prog.c</td><td>c/prog.c</td></tr><tr><td>a.c</td><td>/home/priya/a.c</td><td>../priya/a.c</td></tr><tr><td>passwd</td><td>/etc/passwd</td><td>../../etc/passwd</td></tr></table><p>For passwd: go up twice (ravi → home → /), then down into etc.</p>", "gu": "<p><b>Absolute path</b> root (/) થી શરૂ થાય. <b>Relative path</b> current directory થી શરૂ થાય; <code>..</code> એટલે parent directory અને <code>.</code> એટલે current directory.</p><table><tr><th>File</th><th>Absolute path</th><th>Relative path (cwd = /home/ravi)</th></tr><tr><td>notes.txt</td><td>/home/ravi/os/notes.txt</td><td>os/notes.txt</td></tr><tr><td>prog.c</td><td>/home/ravi/c/prog.c</td><td>c/prog.c</td></tr><tr><td>a.c</td><td>/home/priya/a.c</td><td>../priya/a.c</td></tr><tr><td>passwd</td><td>/etc/passwd</td><td>../../etc/passwd</td></tr></table><p>passwd માટે: બે વાર ઉપર જાઓ (ravi → home → /), પછી etc માં નીચે.</p>"}}, {"id": "os4n12", "q": {"en": "Convert the Unix permissions: (a) rwxr-xr-- and (b) rw-r--r-- to octal; (c) 750 and (d) 600 to symbolic form. Write the chmod command for (a).", "gu": "Unix permissions ફેરવો: (a) rwxr-xr-- અને (b) rw-r--r-- ને octal માં; (c) 750 અને (d) 600 ને symbolic સ્વરૂપમાં. (a) માટે chmod command લખો."}, "a": {"en": "<p>Each group of three (owner, group, others): r = 4, w = 2, x = 1; add the values.</p><table><tr><th>Symbolic</th><th>Octal</th><th>Owner / Group / Others</th></tr><tr><td>rwxr-xr--</td><td>754</td><td>rwx = 7 / r-x = 5 / r-- = 4</td></tr><tr><td>rw-r--r--</td><td>644</td><td>rw- = 6 / r-- = 4 / r-- = 4</td></tr><tr><td>rwxr-x---</td><td>750</td><td>rwx = 7 / r-x = 5 / --- = 0</td></tr><tr><td>rw-------</td><td>600</td><td>rw- = 6 / --- = 0 / --- = 0</td></tr></table><p>(a) <code>chmod 754 file</code> (or <code>chmod u=rwx,g=rx,o=r file</code>). 600 is typical for private files: only the owner can read and write.</p>", "gu": "<p>ત્રણના દરેક group (owner, group, others) માં: r = 4, w = 2, x = 1; કિંમતો ઉમેરો.</p><table><tr><th>Symbolic</th><th>Octal</th><th>Owner / Group / Others</th></tr><tr><td>rwxr-xr--</td><td>754</td><td>rwx = 7 / r-x = 5 / r-- = 4</td></tr><tr><td>rw-r--r--</td><td>644</td><td>rw- = 6 / r-- = 4 / r-- = 4</td></tr><tr><td>rwxr-x---</td><td>750</td><td>rwx = 7 / r-x = 5 / --- = 0</td></tr><tr><td>rw-------</td><td>600</td><td>rw- = 6 / --- = 0 / --- = 0</td></tr></table><p>(a) <code>chmod 754 file</code> (અથવા <code>chmod u=rwx,g=rx,o=r file</code>). 600 private files માટે સામાન્ય છે: માત્ર owner વાંચી અને લખી શકે.</p>"}}, {"id": "os4n13", "q": {"en": "File tr uses contiguous allocation (start 14, length 3). File jeep uses linked allocation 9 → 16 → 1 → 10 → 25 and, in another case, indexed allocation with index block 19. Find the physical block of logical block 2 of tr and logical block 3 of jeep, and the number of disk reads needed in each case.", "gu": "File tr contiguous allocation (start 14, length 3) વાપરે છે. File jeep linked allocation 9 → 16 → 1 → 10 → 25 અને બીજા કિસ્સામાં index block 19 સાથે indexed allocation વાપરે છે. tr નો logical block 2 અને jeep નો logical block 3 કયા physical block માં છે, અને દરેક કિસ્સામાં કેટલા disk reads જોઈએ તે શોધો."}, "a": {"en": "<table><tr><th>Method</th><th>Calculation</th><th>Physical block</th><th>Disk reads</th></tr><tr><td>Contiguous (tr)</td><td>start + i = 14 + 2</td><td><b>16</b></td><td>1 (direct)</td></tr><tr><td>Linked (jeep)</td><td>follow 9 → 16 → 1 → 10</td><td><b>10</b></td><td>4 (blocks 0–3 in turn)</td></tr><tr><td>Indexed (jeep)</td><td>read index block 19, entry 3</td><td><b>10</b></td><td>2 (index + data)</td></tr></table><p>Contiguous and indexed allow <b>direct access</b>; linked allocation needs sequential traversal. If the index block is already in memory, indexed needs only 1 read.</p>", "gu": "<table><tr><th>પદ્ધતિ</th><th>ગણતરી</th><th>Physical block</th><th>Disk reads</th></tr><tr><td>Contiguous (tr)</td><td>start + i = 14 + 2</td><td><b>16</b></td><td>1 (direct)</td></tr><tr><td>Linked (jeep)</td><td>9 → 16 → 1 → 10 અનુસરો</td><td><b>10</b></td><td>4 (blocks 0–3 વારાફરતી)</td></tr><tr><td>Indexed (jeep)</td><td>index block 19 વાંચો, entry 3</td><td><b>10</b></td><td>2 (index + data)</td></tr></table><p>Contiguous અને indexed <b>direct access</b> આપે છે; linked allocation માં ક્રમશઃ traversal કરવું પડે. Index block પહેલેથી memory માં હોય તો indexed માં માત્ર 1 read જોઈએ.</p>"}}, {"id": "os4n14", "q": {"en": "Block size is 1 KB and a disk-block pointer is 4 bytes. Find the maximum file size with (a) one index block and (b) a two-level index. Also find the pointer overhead in linked allocation.", "gu": "Block size 1 KB છે અને disk-block pointer 4 bytes છે. (a) એક index block અને (b) two-level index સાથે મહત્તમ file size શોધો. Linked allocation માં pointer overhead પણ શોધો."}, "a": {"en": "<p>Pointers per index block = 1024 / 4 = <b>256</b>.</p>\n<p>(a) One index block: 256 data blocks × 1 KB = <b>256 KB</b>.</p>\n<p>(b) Two-level index: 256 × 256 = 65,536 data blocks × 1 KB = <b>64 MB</b>.</p>\n<p>Linked allocation: each 1 KB block stores a 4-byte next pointer → data per block = 1020 bytes; overhead = 4 / 1024 ≈ <b>0.39%</b>.</p>", "gu": "<p>Index block દીઠ pointers = 1024 / 4 = <b>256</b>.</p>\n<p>(a) એક index block: 256 data blocks × 1 KB = <b>256 KB</b>.</p>\n<p>(b) Two-level index: 256 × 256 = 65,536 data blocks × 1 KB = <b>64 MB</b>.</p>\n<p>Linked allocation: દરેક 1 KB block માં 4-byte next pointer → block દીઠ data = 1020 bytes; overhead = 4 / 1024 ≈ <b>0.39%</b>.</p>"}}], "equations": [{"title": {"en": "Disk Performance", "gu": "Disk Performance"}, "items": [{"name": {"en": "Disk access time", "gu": "Disk access time"}, "f": "Access time = seek time + rotational latency + transfer time", "terms": {"en": "Seek = move head to the track; latency = wait for the sector", "gu": "Seek = head ને track પર લઈ જવો; latency = sector ની રાહ"}}, {"name": {"en": "Average rotational latency", "gu": "Average rotational latency"}, "f": "Latency = ½ × (60 / rpm) s", "terms": {"en": "e.g. 7200 rpm → 4.17 ms", "gu": "દા.ત. 7200 rpm → 4.17 ms"}}, {"name": {"en": "Transfer time (one sector)", "gu": "Transfer time (એક sector)"}, "f": "Transfer = rotation time / sectors per track", "terms": {"en": "Or bytes ÷ transfer rate", "gu": "અથવા bytes ÷ transfer rate"}}, {"name": {"en": "Disk capacity", "gu": "Disk capacity"}, "f": "Capacity = surfaces × tracks × sectors × bytes per sector", "terms": {"en": "Cylinders = tracks per surface", "gu": "Cylinders = surface દીઠ tracks"}}]}, {"title": {"en": "Disk Scheduling", "gu": "Disk Scheduling"}, "items": [{"name": {"en": "Total head movement", "gu": "કુલ head movement"}, "f": "Total = Σ |next track − current track|", "terms": {"en": "Sum over every move of the head", "gu": "Head ની દરેક move નો સરવાળો"}}, {"name": {"en": "SCAN (moving to 0)", "gu": "SCAN (0 તરફ)"}, "f": "Total = (head − 0) + (largest request − 0)", "terms": {"en": "When requests exist on both sides", "gu": "બંને બાજુ requests હોય ત્યારે"}}, {"name": {"en": "C-SCAN (moving to 0)", "gu": "C-SCAN (0 તરફ)"}, "f": "Total = head + (N − 1) + (N − 1 − smallest request right of head)", "terms": {"en": "N = number of tracks; drop (N − 1) if the jump is not counted", "gu": "N = tracks ની સંખ્યા; jump ન ગણો તો (N − 1) કાઢો"}}]}, {"title": {"en": "Files and Allocation", "gu": "Files અને Allocation"}, "items": [{"name": {"en": "Octal permission", "gu": "Octal permission"}, "f": "digit = 4·r + 2·w + 1·x (for owner, group, others)", "terms": {"en": "rwxr-xr-- = 754", "gu": "rwxr-xr-- = 754"}}, {"name": {"en": "Contiguous: physical block", "gu": "Contiguous: physical block"}, "f": "block = start + logical block number", "terms": {"en": "Direct access in one read", "gu": "એક read માં direct access"}}, {"name": {"en": "Pointers per index block", "gu": "Index block દીઠ pointers"}, "f": "P = block size / pointer size", "terms": {"en": "Max file (1 index block) = P × block size", "gu": "મહત્તમ file (1 index block) = P × block size"}}]}], "viva": [{"title": {"en": "Files", "gu": "Files"}, "items": [{"q": {"en": "What is a file?", "gu": "File શું છે?"}, "a": {"en": "A named collection of related information stored on secondary storage; the smallest unit of logical storage for the user.", "gu": "Secondary storage પર સંગ્રહિત સંબંધિત માહિતીનો નામવાળો સમૂહ; user માટે logical storage નો સૌથી નાનો એકમ."}}, {"q": {"en": "Name any four file attributes.", "gu": "કોઈ પણ ચાર file attributes જણાવો."}, "a": {"en": "Name, type, location, size, protection, time/date and user identification.", "gu": "Name, type, location, size, protection, time/date અને user identification."}}, {"q": {"en": "List the basic file operations.", "gu": "મૂળભૂત file operations જણાવો."}, "a": {"en": "Create, write, read, reposition (seek), delete, truncate; also open and close.", "gu": "Create, write, read, reposition (seek), delete, truncate; ઉપરાંત open અને close."}}, {"q": {"en": "Difference between absolute and relative path?", "gu": "Absolute અને relative path વચ્ચે તફાવત?"}, "a": {"en": "An absolute path starts from the root (/home/ravi/a.c); a relative path starts from the current directory (a.c).", "gu": "Absolute path root થી શરૂ થાય (/home/ravi/a.c); relative path current directory થી શરૂ થાય (a.c)."}}, {"q": {"en": "What does chmod 644 mean?", "gu": "chmod 644 નો અર્થ શું?"}, "a": {"en": "Owner read + write (6), group read (4), others read (4): rw-r--r--.", "gu": "Owner read + write (6), group read (4), others read (4): rw-r--r--."}}, {"q": {"en": "What is an access-control list (ACL)?", "gu": "Access-control list (ACL) શું છે?"}, "a": {"en": "A list attached to a file giving the user names and the access types allowed for each.", "gu": "File સાથે જોડાયેલી યાદી જે દરેક user નું નામ અને તેને મંજૂર access types આપે."}}]}, {"title": {"en": "Directories", "gu": "Directories"}, "items": [{"q": {"en": "What is a directory?", "gu": "Directory શું છે?"}, "a": {"en": "A symbol table that maps file names to their directory entries (location and attributes).", "gu": "File names ને તેમની directory entries (location અને attributes) સાથે map કરતી symbol table."}}, {"q": {"en": "Main problem of a single-level directory?", "gu": "Single-level directory ની મુખ્ય સમસ્યા?"}, "a": {"en": "All files are in one directory, so names must be unique and files cannot be grouped.", "gu": "બધી files એક directory માં હોવાથી names unique જોઈએ અને files group ન થઈ શકે."}}, {"q": {"en": "What are MFD and UFD?", "gu": "MFD અને UFD શું છે?"}, "a": {"en": "In a two-level directory, the master file directory has one entry per user pointing to that user's user file directory.", "gu": "Two-level directory માં master file directory માં દરેક user ની એક entry હોય જે તે user ની user file directory તરફ point કરે."}}, {"q": {"en": "What advantage does an acyclic-graph directory add?", "gu": "Acyclic-graph directory કયો ફાયદો ઉમેરે?"}, "a": {"en": "Sharing: a file or subdirectory can appear in more than one directory (links), without cycles.", "gu": "Sharing: file કે subdirectory એક કરતાં વધુ directories માં (links વડે) દેખાઈ શકે, cycles વગર."}}, {"q": {"en": "Why are cycles a problem in a general graph directory?", "gu": "General graph directory માં cycles શા માટે સમસ્યા છે?"}, "a": {"en": "Searches can loop forever and deleted files may never reach a reference count of zero; garbage collection is needed.", "gu": "Search હંમેશ માટે loop માં ફસાઈ શકે અને deleted files નો reference count ક્યારેય શૂન્ય ન થાય; garbage collection જોઈએ."}}]}, {"title": {"en": "Allocation Methods", "gu": "Allocation Methods"}, "items": [{"q": {"en": "What is contiguous allocation?", "gu": "Contiguous allocation શું છે?"}, "a": {"en": "Each file occupies a set of consecutive blocks; the directory stores start and length.", "gu": "દરેક file સળંગ blocks રોકે છે; directory start અને length રાખે છે."}}, {"q": {"en": "Main drawback of contiguous allocation?", "gu": "Contiguous allocation નો મુખ્ય ગેરફાયદો?"}, "a": {"en": "External fragmentation and difficulty in growing a file.", "gu": "External fragmentation અને file વધારવામાં મુશ્કેલી."}}, {"q": {"en": "How does linked allocation work?", "gu": "Linked allocation કેવી રીતે કામ કરે?"}, "a": {"en": "Each block holds a pointer to the next block; the directory stores the first and last block.", "gu": "દરેક block આગળના block નો pointer રાખે છે; directory પહેલો અને છેલ્લો block રાખે છે."}}, {"q": {"en": "What is FAT?", "gu": "FAT શું છે?"}, "a": {"en": "File Allocation Table: a variation of linked allocation where all next pointers are kept in a table at the start of the disk (MS-DOS, USB drives).", "gu": "File Allocation Table: linked allocation નો પ્રકાર જેમાં બધા next pointers disk ની શરૂઆતમાં એક table માં રાખાય (MS-DOS, USB drives)."}}, {"q": {"en": "What is an index block?", "gu": "Index block શું છે?"}, "a": {"en": "In indexed allocation, a block that holds the addresses of all the data blocks of a file; entry i points to block i.", "gu": "Indexed allocation માં file ના બધા data blocks ના addresses રાખતો block; entry i block i તરફ point કરે."}}]}, {"title": {"en": "Disk Structure and Scheduling", "gu": "Disk Structure અને Scheduling"}, "items": [{"q": {"en": "Define track, sector and cylinder.", "gu": "Track, sector અને cylinder ની વ્યાખ્યા આપો."}, "a": {"en": "Track: a circle on a platter surface; sector: a fixed-size part of a track; cylinder: the set of tracks at one arm position on all surfaces.", "gu": "Track: platter surface પરનું વર્તુળ; sector: track નો fixed-size ભાગ; cylinder: એક arm position પર બધી surfaces ના tracks નો સમૂહ."}}, {"q": {"en": "What is seek time?", "gu": "Seek time શું છે?"}, "a": {"en": "The time for the disk arm to move the head to the required cylinder.", "gu": "Disk arm ને head જરૂરી cylinder પર લઈ જવામાં લાગતો સમય."}}, {"q": {"en": "What is rotational latency?", "gu": "Rotational latency શું છે?"}, "a": {"en": "The time waiting for the required sector to rotate under the head.", "gu": "જરૂરી sector head ની નીચે ફરીને આવે ત્યાં સુધીની રાહનો સમય."}}, {"q": {"en": "Why is SCAN called the elevator algorithm?", "gu": "SCAN ને elevator algorithm શા માટે કહે છે?"}, "a": {"en": "Like a lift, the head moves in one direction serving requests to the end, then reverses.", "gu": "Lift ની જેમ head એક દિશામાં છેડા સુધી requests સંતોષતો જાય, પછી દિશા બદલે."}}, {"q": {"en": "How is C-SCAN different from SCAN?", "gu": "C-SCAN, SCAN થી કેવી રીતે જુદું?"}, "a": {"en": "C-SCAN serves requests in one direction only; at the end it jumps back to the other end without serving, giving more uniform waiting time.", "gu": "C-SCAN requests માત્ર એક દિશામાં સંતોષે; છેડે પહોંચી સંતોષ્યા વગર બીજા છેડે jump કરે, તેથી waiting time વધુ એકસરખો રહે."}}, {"q": {"en": "What is the difference between SCAN and LOOK?", "gu": "SCAN અને LOOK વચ્ચે તફાવત?"}, "a": {"en": "SCAN goes to the end of the disk; LOOK reverses at the last request in that direction.", "gu": "SCAN disk ના છેડા સુધી જાય; LOOK તે દિશાની છેલ્લી request પર દિશા બદલે."}}]}], "exam_questions": [{"q": {"en": "Explain file attributes and file operations.", "gu": "File attributes અને file operations સમજાવો."}, "marks": 4}, {"q": {"en": "Explain different file types with their extensions.", "gu": "જુદા જુદા file types તેમના extensions સાથે સમજાવો."}, "marks": 3}, {"q": {"en": "Explain absolute and relative file paths with an example.", "gu": "Absolute અને relative file paths ઉદાહરણ સાથે સમજાવો."}, "marks": 3}, {"q": {"en": "Explain file security and protection mechanisms.", "gu": "File security અને protection mechanisms સમજાવો."}, "marks": 4}, {"q": {"en": "Explain single-level and two-level directory structures.", "gu": "Single-level અને two-level directory structures સમજાવો."}, "marks": 4}, {"q": {"en": "Explain tree-structured directory with a diagram.", "gu": "Tree-structured directory આકૃતિ સાથે સમજાવો."}, "marks": 4}, {"q": {"en": "Explain acyclic-graph and general graph directory structures.", "gu": "Acyclic-graph અને general graph directory structures સમજાવો."}, "marks": 4}, {"q": {"en": "Explain contiguous, linked and indexed allocation methods.", "gu": "Contiguous, linked અને indexed allocation methods સમજાવો."}, "marks": 7}, {"q": {"en": "Compare contiguous, linked and indexed allocation.", "gu": "Contiguous, linked અને indexed allocation ની સરખામણી કરો."}, "marks": 3}, {"q": {"en": "Explain the physical structure of a disk.", "gu": "Disk નું physical structure સમજાવો."}, "marks": 4}, {"q": {"en": "Define seek time, rotational latency and transfer time.", "gu": "Seek time, rotational latency અને transfer time ની વ્યાખ્યા આપો."}, "marks": 3}, {"q": {"en": "Explain the SCAN disk scheduling algorithm with an example.", "gu": "SCAN disk scheduling algorithm ઉદાહરણ સાથે સમજાવો."}, "marks": 4}, {"q": {"en": "Explain the C-SCAN disk scheduling algorithm with an example.", "gu": "C-SCAN disk scheduling algorithm ઉદાહરણ સાથે સમજાવો."}, "marks": 4}, {"q": {"en": "Disk 0–199; queue 75, 90, 40, 135, 50, 170, 65, 10; head 46 moving left. Find total head movement using SCAN and C-SCAN.", "gu": "Disk 0–199; queue 75, 90, 40, 135, 50, 170, 65, 10; head 46 ડાબી બાજુ. SCAN અને C-SCAN વડે કુલ head movement શોધો."}, "marks": 7}, {"q": {"en": "Differentiate between SCAN and C-SCAN.", "gu": "SCAN અને C-SCA function programs(){
  return `<div class="sec">${head(L('programs'))}` + (U.programs||[]).map((p,i)=>
    `<div class="card"><div class="q hd"><span class="n">${i+1}.</span><span class="t">${t(p.title)}</span>${chev}</div><div class="a pa">${progBody(p)}</div></div>`).join('') + `</div>`;
}
function syntax(key){
  return (U[typeof key==='string'?key:'syntax']||[]).map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><pre class="code sx">${hl(e.f)}</pre></span>${chev}</div>
     <div class="a">${e.terms && t(e.terms) ? fixTables(t(e.terms)) : ''}</div></div>`).join('') + `</div>`).join('');
}
const flowcharts = diagrams;
const algorithms = () => syntax('algorithms');
const ALLV = {notes, programs, diagrams, flowcharts, algorithms, syntax, equations, numericals, viva, exam};
const VIEWS = U.tabs ? Object.fromEntries(U.tabs.map(k=>[k, ALLV[k]])) : U.programs ? (META.code_lang==='python' ? {notes, programs, diagrams, syntax, viva, exam} : {notes, programs, flowcharts, syntax, viva, exam}) : U.numericals ? {notes, diagrams, equations, numericals, viva, exam} : {notes, diagrams, equations, viva, exam};
function render(){
  document.getElementById('title').textContent = `${L('unit')} ${U.unit}: ${t(U.title)}`;
  document.getElementById('sub').textContent = `${t(META.name)} · ${META.code}`;
  document.getElementById('lang').textContent = S.lang==='en' ? 'ગુ' : 'EN';
  document.getElementById('lang').style.display = META.languages.includes('gu') ? '' : 'none';
  document.getElementById('tabs').innerHTML = Object.keys(VIEWS).map(k=>`<button class="tab${S.tab===k?' on':''}" data-tab="${k}">${L(k)}</button>`).join('');
  document.getElementById('view').innerHTML = VIEWS[S.tab]();
  document.querySelectorAll('#view pre.c').forEach(e=>{ e.innerHTML = hl(e.textContent); e.className='code'; });
}
let zoom = 1;
function setZoom(z){ zoom = Math.min(4, Math.max(1, z)); const w=document.getElementById('zw'); w.style.width=(zoom*100)+'%'; document.getElementById('zr').textContent=Math.round(zoom*100)+'%'; }
document.addEventListener('click', e=>{
  const q = e.target.closest('.q'); if (q && q.parentElement.querySelector('.a')) { q.parentElement.classList.toggle('open'); return; }
  const tb = e.target.closest('[data-tab]'); if (tb){ S.tab = tb.dataset.tab; render(); window.scrollTo(0,0); return; }
  if (e.target.closest('#lang')){ S.lang = S.lang==='en'?'gu':'en'; render(); return; }
  const m = e.target.closest('[data-more]');
  document.querySelectorAll('.menu.show').forEach(x=>{ if(!m || x!==m.nextElementSibling) x.classList.remove('show'); });
  if (m){ m.nextElementSibling.classList.toggle('show'); return; }
  const act = e.target.closest('[data-act]');
  if (act){ act.closest('.sec').querySelectorAll('.card').forEach(c=>{ if(c.querySelector('.a')) c.classList.toggle('open', act.dataset.act==='expand'); }); act.parentElement.classList.remove('show'); return; }
  const dg = e.target.closest('[data-dg]');
  if (dg){ const id=dg.dataset.dg; document.getElementById('mt').textContent=t(U.diagrams.find(d=>d.id===id).title); document.getElementById('zw').innerHTML=SVG[id]; setZoom(1); document.getElementById('modal').classList.add('show'); return; }
  if (e.target.closest('#mx')) document.getElementById('modal').classList.remove('show');
  if (e.target.closest('#zi')) setZoom(zoom+0.5);
  if (e.target.closest('#zo')) setZoom(zoom-0.5);
  if (e.target.closest('#zr')) setZoom(1);
});
render();
</script></body></html>
