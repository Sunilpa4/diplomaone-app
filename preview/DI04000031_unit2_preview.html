<script>
const U = {"subject": "DI04000031", "unit": 2, "format": "notes", "title": {"en": "Document Databases: MongoDB"}, "hours": 18, "weightage": 30, "tabs": ["notes", "programs", "diagrams", "syntax", "viva"], "intro_text": {"en": "MongoDB architecture, installation/mongosh, BSON, CRUD and filters, sorting/projection, data modeling, indexes and basic aggregation. Includes 14 real server-executed programs and Practicals 2–3. Replication and sharding are conceptual only; practice tasks are not an official theory paper."}, "notes": [{"title": {"en": "2.1 MongoDB Architecture, Documents, Collections and BSON"}, "items": [{"h": {"en": "MongoDB in the Application Stack and This Unit’s Scope"}, "body": {"en": "\n<p><b>MongoDB</b> is a document database. The <b>mongod</b> server accepts commands, executes queries/updates, manages indexes and stores BSON data. <b>mongosh</b> is a JavaScript-based client shell; an application normally uses an appropriate driver. Compass is an optional graphical client, not a replacement for the database server.</p>\n<p>Basic path: <b>client/driver or mongosh → connection → mongod → collections/indexes/storage → result</b>. A localhost address in these examples is a database connection from the same machine, not a browser API or a publicly hosted service.</p>\n<p><b>Official scope:</b> 18 hours / 30% content weightage; documents, collections, BSON, architecture, installation, mongosh, CRUD, listed filters, sort/limit/projection, embedding/references, basic indexes and $match/$group/$sum/$avg. Replication and sharding are <b>conceptual only</b>.</p>\n<p><b>CO2:</b> apply MongoDB features for effective data modeling and management. Practicals 2 and 3 cover installation/connectivity and CRUD with filters, sorting and projection.</p>\n<p><b>Reference execution:</b> all 14 displayed programs were run using a real authenticated MongoDB 9.0.4 standalone server and mongosh 2.14.0 on Debian 13 x86_64. No database emulator, replica-set configuration, sharded-cluster configuration or external application deployment is claimed.</p>\n"}, "diagram": "ns2_arch"}, {"h": {"en": "Database → Collection → Document"}, "body": {"en": "\n<p>A deployment contains <b>databases</b>; a database groups <b>collections</b>; a collection stores <b>documents</b>. An ordinary collection is loosely comparable to a relational table, but documents can contain nested structures and need not all have identical fields.</p>\n<p>A document is a set of named field/value pairs. Values can include strings, numbers, arrays and embedded documents. The following is <b>mongosh JavaScript/BSON-constructor syntax</b>, not strict JSON:</p>\n<pre class=\"c\">{\n  _id: ObjectId(\"65a1b2c3d4e5f60718293040\"),\n  name: \"Asha\",\n  skills: [\"MongoDB\", \"Python\"],\n  address: {city: \"Surat\"}\n}</pre>\n<ul><li><b>Database:</b> for example, a disposable di04000031_u2_manual learning database.</li>\n<li><b>Collection:</b> students, products or orders.</li>\n<li><b>Document:</b> one bounded student/product/order record.</li>\n<li><b>Field:</b> name, marks or address; <b>dot notation</b> such as \"address.city\" targets a nested field.</li></ul>\n<p><b>Creation:</b> selecting a database does not immediately persist an empty database. Explicit createCollection or a first write creates storage. insertOne/insertMany can create an ordinary collection implicitly.</p>\n<p><b>Flexible schema still needs design:</b> agree on required fields, types, units and bounded arrays; validation can be added. Avoid duplicate field names and surprising type changes. A BSON document has a 16 MiB size limit; it is not an unlimited container for every event in a user’s lifetime.</p>\n"}, "diagram": "ns2_hierarchy"}, {"h": {"en": "BSON Types, _id and ObjectId"}, "body": {"en": "\n<p><b>BSON</b> is a typed binary representation used by MongoDB. It supports types beyond JSON’s basic text representation. The course explicitly includes ObjectId, String, Array and Embedded Document; Boolean, numeric and Date examples provide useful context.</p>\n<table><tr><th>Value / constructor</th><th>Meaning / common mistake</th></tr><tr><td>ObjectId(\"65a1b2c3d4e5f60718293040\")</td><td>An ObjectId value, not an ordinary string with the same text.</td></tr><tr><td>\"Asha\"</td><td>String; quote a text ID rather than assuming it equals a numeric or ObjectId ID.</td></tr><tr><td>[\"MongoDB\", \"Python\"]</td><td>Array; an array can contain multiple values.</td></tr><tr><td>{city: \"Surat\"}</td><td>Embedded document, not a foreign-key relationship by itself.</td></tr><tr><td>NumberInt(19), 82.5, true</td><td>Explicit Int32, a fractional number, and a Boolean; numeric precision needs care.</td></tr><tr><td>ISODate(\"2026-01-15T00:00:00Z\")</td><td>A BSON Date via mongosh, not merely an arbitrary date string.</td></tr></table>\n<p><b>_id:</b> the identifier field is unique and immutable within an ordinary collection. It is not restricted to ObjectId; the student demos use small integer IDs deliberately. When _id is omitted, a normal insert receives a generated ObjectId.</p>\n<p><b>Type-sensitive filters:</b> ObjectId(\"65a1…\") and \"65a1…\" are different values. The type example verifies stored types with $type, and shows zero string-ID matches but one ObjectId match. It records a fixed UTC date for reproducible output.</p>\n<p>Use suitable exact numeric representations for real financial quantities, such as integer minor units or a deliberately designed Decimal128 policy; do not assume floating-point arithmetic is exact currency accounting.</p>\n"}, "diagram": "ns2_bson", "programs": ["ns2p02"]}]}, {"title": {"en": "2.2 Installation, mongosh and Safe Lab Setup — Practical 2"}, "items": [{"h": {"en": "Install the Server and mongosh; Verify a Real Connection"}, "body": {"en": "\n<ol><li><b>Check platform:</b> use an OS/architecture supported by the selected MongoDB release. The tested reference uses Debian 13 x86_64 and the official signed MongoDB 9.0 APT repository. Do not copy this repository line onto an unrelated Ubuntu/Debian release.</li>\n<li><b>Install:</b> install MongoDB Community Server and mongosh separately if the chosen installer does not bundle both. Windows uses the official server installer/service plus mongosh as needed; Linux uses the matching vendor repository; follow the vendor guide for macOS. Compass is optional.</li>\n<li><b>Record both versions:</b> a working mongosh executable does not prove mongod is installed, running or reachable.</li></ol>\n<pre class=\"c\"># Operating-system terminal, not inside mongosh:\nmongod --version\nmongosh --version</pre>\n<p><b>Tested versions:</b> server 9.0.4 and shell 2.14.0. These identify the actual reference run, not a promise that these will remain the newest secure production patches.</p>\n<pre class=\"c\"># Debian 13 x86_64 reference only; select your OS guide.\nsudo apt-get install -y gnupg curl\ncurl -fsSL https://pgp.mongodb.com/server-9.asc \\\n  | sudo gpg --dearmor \\\n      -o /usr/share/keyrings/mongodb-server-9.gpg\n# Add the official trixie/mongodb-org/9.0 APT source\n# with signed-by=/usr/share/keyrings/mongodb-server-9.gpg.\n# The exact line is in the linked official Debian guide.\nsudo apt-get update\nsudo apt-get install -y \\\n  mongodb-org-server=9.0.4 mongodb-mongosh=2.14.0</pre>\n<p>Use the linked official guide for the complete repository line and signing-key procedure. On a standard systemd installation, the service is managed with systemctl. The reference sandbox has no normal systemd service, so a process-managed standalone instance was used instead.</p>\n<pre class=\"c\"># Terminal A: private local learning server, not production.\nmkdir -p \"$HOME/mongo-lab-data\"\nmongod --dbpath \"$HOME/mongo-lab-data\" \\\n  --bind_ip 127.0.0.1 --port 27027 --auth\n# Keep this terminal running; stop cleanly after the lab.</pre>\n<p><b>Authentication:</b> for a new private instance with no users, the localhost exception allows initial administrator creation. Connect locally to admin and use an interactive hidden password prompt. This is a <b>bootstrap administrator</b>, not an application identity:</p>\n<pre class=\"c\">// Only on a new private server with no users yet.\n// Connect locally to admin; use the localhost exception.\ndb = db.getSiblingDB(\"admin\");\ndb.createUser({\n  user: \"labBootstrapAdmin\",\n  pwd: passwordPrompt(),\n  roles: [{role: \"root\", db: \"admin\"}]\n});</pre>\n<p>Do not repeat first-user creation on an existing deployment. Follow your lab administrator’s account policy; production applications require least privilege, TLS/network controls and tested backups. The reference harness keeps its credentials outside all lesson files and downloads.</p>\n<pre class=\"c\"># Terminal B: password is prompted, not embedded in a URI.\nmongosh \"mongodb://127.0.0.1:27027/di04000031_u2_manual\" \\\n  --username labBootstrapAdmin \\\n  --authenticationDatabase admin --password</pre>\n<p><b>Verify:</b> select a fresh scratch database, ping, create a collection, insert a message and read it back. A ping alone does not prove authorization to read/write. Program 1 records the actual successful storage round-trip and collection cleanup.</p>\n<p><b>Troubleshoot:</b> command not found → installation/PATH; connection refused → server/port; authentication failure → user/authentication database/password; unauthorized → roles; data-directory error → path/permissions. Do not solve connectivity by exposing an unauthenticated public port.</p>\n"}, "diagram": "ns2_setup", "programs": ["ns2p01"]}, {"h": {"en": "mongosh Context, Interactive Helpers, Cursors and Script Execution"}, "body": {"en": "\n<p><b>Two contexts:</b> commands such as mongod --version belong to the OS terminal. Commands such as db.students.find belong inside mongosh. Interactive helpers like <b>use</b> and <b>show collections</b> are not ordinary JavaScript statements for a .js script.</p>\n<pre class=\"c\">// Inside mongosh: interactive helpers\nuse di04000031_u2_manual\nshow collections\ndb.getName()\ndb.runCommand({ping: 1})\n// In a .js file use JavaScript instead of `use`:\ndb = db.getSiblingDB(\"di04000031_u2_manual\");</pre>\n<p><b>Connection versus current database:</b> getSiblingDB selects another database on the same connection; it does not create a new server. Authentication may use admin even when data operations use a different scratch database.</p>\n<p><b>find:</b> returns a cursor. Interactive display may show only a batch. For a small lab, toArray materializes the results for deterministic JSON printing. Limit real workloads rather than loading an unbounded result into client memory. <b>findOne:</b> returns one document or null.</p>\n<p><b>Scripts:</b> run a .js file using mongosh --file after selecting an authorized disposable database. The practical download includes an isolated runner that supplies a fresh database to each exact displayed script. Seeds are inside each program; examples are independent, not a sequence to paste into one already-populated collection.</p>\n<p>Every displayed script checks the di04000031_u2_ prefix. That guard reduces accidental targeting mistakes; it is not authorization, a substitute for backups, or permission to reset real work merely because its name has that prefix.</p>\n"}}]}, {"title": {"en": "2.3 CRUD, Filters, Sorting, Projections and Data-Type Pitfalls"}, "items": [{"h": {"en": "Create Documents: insertOne, insertMany and Duplicate Keys"}, "body": {"en": "\n<p><b>CRUD Create</b> means inserting documents; it is not limited to creating a database or collection. insertOne inserts one document, while insertMany takes an array of documents. Inspect acknowledged/inserted identifiers rather than assuming the write succeeded.</p>\n<p>An omitted _id is normally generated. An explicitly supplied _id can be an appropriate supported scalar value. The default unique _id index prevents two documents from sharing the same _id in this ordinary lab collection.</p>\n<p><b>Observed example:</b> insert one student, then two more; a duplicate _id:1 attempt is rejected with <b>11000</b> and the collection still has three records. Only the expected duplicate error is caught; another error is rethrown.</p>\n<p>insertMany is not automatically an all-or-nothing multi-document transaction. If a batch fails, examine its error/result and the actual stored state rather than blindly replaying the entire batch. Plan idempotency and uniqueness for repeated imports.</p>\n"}, "diagram": "ns2_crud", "programs": ["ns2p03"]}, {"h": {"en": "Read Documents with Comparison and Logical Filters"}, "body": {"en": "\n<p>A <b>filter</b> is a document describing which records match. An empty filter {} matches all documents, which is useful for a tiny read fixture but dangerous for bulk writes.</p>\n<pre class=\"c\">{marks: {$gt: 80}}\n{marks: {$lt: 70}}\n{city: {$in: [\"Surat\", \"Bharuch\"]}}\n{$and: [{age: {$gt: 18}}, {marks: {$gt: 80}}]}\n{$or: [{city: \"Surat\"}, {marks: {$lt: 60}}]}</pre>\n<table><tr><th>Operator</th><th>Meaning</th><th>Observed student IDs</th></tr><tr><td>$gt:80 on marks</td><td>Strictly greater than 80</td><td>1, 3, 5</td></tr><tr><td>$lt:70 on marks</td><td>Strictly less than 70</td><td>4, 6</td></tr><tr><td>$in on city</td><td>Either Surat or Bharuch</td><td>1, 2, 3, 5</td></tr><tr><td>$and: age &gt;18 and marks &gt;80</td><td>All listed clauses</td><td>1, 5</td></tr><tr><td>$or: Surat or marks &lt;60</td><td>At least one listed clause</td><td>1, 3, 5, 6</td></tr></table>\n<p>Different ordinary field conditions in one filter are implicitly ANDed. For repeated conditions on one field, use one operator object or explicit $and rather than duplicate JavaScript keys that overwrite each other.</p>\n<p><b>Boundary:</b> $gt does not include equality and $lt does not include equality. $gte/$lte include the boundary when required; the catalog later uses $gte:1 for a guarded stock decrement.</p>\n"}, "diagram": "ns2_filters", "programs": ["ns2p04"]}, {"h": {"en": "Sort, Limit and Projection Are Different Controls"}, "body": {"en": "\n<ul><li><b>Filter:</b> which documents?</li><li><b>sort:</b> in what order? 1 is ascending and -1 descending.</li><li><b>limit:</b> how many returned documents?</li><li><b>Projection:</b> which fields? 1 includes and 0 excludes.</li></ul>\n<pre class=\"c\">db.students.find({}, {_id: 0, name: 1, marks: 1})\n  .sort({marks: -1, _id: 1})\n  .limit(3)\n  .toArray();</pre>\n<p><b>Observed top three:</b> Neha 92, Asha 82, Meera 82. The _id tie-breaker makes the equal-mark order deterministic. Without a complete sort, “first three” is not a dependable ranking.</p>\n<p><b>Projection rule:</b> do not mix ordinary inclusion and exclusion fields. The special _id exclusion can accompany an inclusion projection, such as {_id:0,name:1,marks:1}. Exclusion-only projections retain unspecified fields. Projection changes the returned shape, not stored data or field-level authorization.</p>\n<p>The diagram shows logical result shaping, not a fixed physical execution order of the database optimizer. The full program also demonstrates a cursor and a missing findOne result.</p>\n"}, "diagram": "ns2_query", "programs": ["ns2p05"]}, {"h": {"en": "Array Membership, Dot Notation and Whole-Document Equality"}, "body": {"en": "\n<p>{skills:\"MongoDB\"} can match an element inside an array. {skills:{$in:[\"Python\",\"Java\"]}} matches a document with at least one listed value. Two separate membership conditions can require both values to be present.</p>\n<p><b>Nested field:</b> {\"address.pin\":\"395001\"} targets the pin inside the address object. Quote the dotted path. In the seed, this returns student 1.</p>\n<p><b>Whole-object equality:</b> {address:{pin:\"395001\"}} is not the same query. The stored address also has state, so the shorter object is not an exact match and the observed result is empty. Do not use whole-object equality when you intend to filter one nested field.</p>\n<p>For more complex arrays of embedded documents, multiple conditions may accidentally match different elements; $elemMatch is a later refinement when conditions must apply to the same element. This unit’s executable example keeps scalar array membership and one nested object simple.</p>\n"}, "programs": ["ns2p06"]}, {"h": {"en": "Update One/Many with $set and $inc; Read the Result Counts"}, "body": {"en": "\n<pre class=\"c\">db.students.updateOne(\n  {_id: 2},\n  {$set: {city: \"Surat\"}, $inc: {marks: 5}}\n);</pre>\n<p>$set assigns named fields without removing unrelated fields. $inc adds to a numeric field. updateOne changes at most one matched document; updateMany applies the operation to all matches.</p>\n<table><tr><th>Observed case</th><th>matchedCount</th><th>modifiedCount</th><th>Meaning</th></tr><tr><td>Ravi: change city and add 5 marks</td><td>1</td><td>1</td><td>Found and changed</td></tr><tr><td>Add 2 marks to two inactive students</td><td>2</td><td>2</td><td>Both documents changed</td></tr><tr><td>Set Ravi to the already stored 75</td><td>1</td><td>0</td><td>Matched no-op</td></tr><tr><td>Update nonexistent _id:999</td><td>0</td><td>0</td><td>No match; no insert by default</td></tr></table>\n<p><b>Atomicity:</b> a write to one document is atomic. updateMany is not automatically one transaction across all matched documents. Acknowledge that distinction before adapting a classroom update to a payment/inventory workflow.</p>\n<p>Check the intended database, collection and filter. Do not pass an arbitrary unvalidated client object directly as a filter or update definition.</p>\n"}, "diagram": "ns2_update", "programs": ["ns2p07"]}, {"h": {"en": "Upsert Is Explicit; Replacement Removes Omitted Fields"}, "body": {"en": "\n<p><b>upsert:true:</b> insert when no document matches; otherwise update a match. The reference uses _id:7 as a stable unique key: the first operation reports one upserted record, and the second matches it rather than creating another profile.</p>\n<p><b>replaceOne:</b> supplies a replacement document, not a partial patch. Replacing Jai’s profile with name and marks removes the old city field. The existing _id is retained when omitted from the replacement. An attempt to change _id is invalid.</p>\n<p><b>Choose deliberately:</b> use $set/$inc for field-level modifications, replaceOne for an intentional full replacement, and upsert only when creating a missing record is actually desired. Unique indexes still matter when concurrent operations rely on an alternate business key.</p>\n<p>The program prints the retained ID and sorted field names to prove what is stored after replacement.</p>\n"}, "programs": ["ns2p08"]}, {"h": {"en": "Delete Documents Safely; Distinguish deleteMany from drop"}, "body": {"en": "\n<p>deleteOne removes at most one matching document and deleteMany removes all matches. Inspect deletedCount: zero can simply mean the target did not exist.</p>\n<p><b>Observed fixture:</b> two students are inactive. Delete student 6, then the remaining inactive student 4; a missing-ID delete reports zero. IDs 1, 2, 3 and 5 remain.</p>\n<ul><li><b>deleteMany({}):</b> deletes every document in the current collection.</li><li><b>collection.drop():</b> removes that collection and its indexes.</li><li><b>database.dropDatabase():</b> destroys the selected database; the automated harness uses it only for its own freshly captured scratch database.</li></ul>\n<p>Preview the filter, verify the context and have an appropriate recovery plan. A preview count is not a concurrency lock. Never practice destructive commands against real records or use the scratch-name prefix as a substitute for authorization.</p>\n"}, "programs": ["ns2p09"]}, {"h": {"en": "Null versus Missing, Type Mismatch and Rejected Query Shapes"}, "body": {"en": "\n<p><b>Observed records:</b> _id:1 has tag:null; _id:2 has no tag field; _id:3 has a string tag.</p>\n<table><tr><th>Filter</th><th>Observed IDs</th><th>Meaning</th></tr><tr><td>{tag:null}</td><td>1, 2</td><td>Null equality also matches a missing field</td></tr><tr><td>{tag:{$type:10}}</td><td>1</td><td>Explicit BSON null</td></tr><tr><td>{tag:{$exists:false}}</td><td>2</td><td>Field absent</td></tr><tr><td>{_id:\"1\"}</td><td>none</td><td>String does not match numeric ID</td></tr></table>\n<p>The full negative-test example also records server error <b>31254</b> for mixed ordinary projection modes, and a mongosh <b>MongoInvalidArgumentError</b> when updateOne is given a non-operator document. Error identifiers may differ for a different invalid form/version; the lesson explains the operation rather than relying on error text.</p>\n<p><b>Selector-shaped input:</b> a user-supplied object such as {$ne:null} is not a scalar username or ID. Validate expected types/ranges, authorize the operation and construct the allowed filter yourself. The small type check is not a complete secure login/API implementation.</p>\n"}, "programs": ["ns2p14"]}]}, {"title": {"en": "2.4 Data Modeling, Basic Indexes and Aggregation"}, "items": [{"h": {"en": "Embed Bounded Related Data or Reference Shared Entities"}, "body": {"en": "\n<p><b>Embedding:</b> keep a bounded address inside a learner when the address is read with that learner. One document can be retrieved and updated atomically. The model is natural for has-a/contains relationships and data read together.</p>\n<p><b>Referencing:</b> put shared course details in a courses collection and store courseId in each learner. This avoids duplicating a frequently shared course record but requires explicit related-data retrieval and missing-reference handling.</p>\n<table><tr><th>Prefer embedding when…</th><th>Prefer references when…</th></tr><tr><td>The related data is bounded and usually accessed together</td><td>The relationship grows without a sensible bound</td></tr><tr><td>One-document updates suit the consistency boundary</td><td>Many parents share a separately managed entity</td></tr><tr><td>Duplication is limited and acceptable</td><td>Duplication/update coordination would become costly</td></tr></table>\n<p><b>Observed example:</b> the learner’s embedded city is Surat; an explicit second query resolves C1 to MongoDB Basics. A different learner with courseId:UNKNOWN is still inserted; the lookup returns null. There is no automatically enforced relational foreign key.</p>\n<p>Do not embed an unlimited comment/history stream. Do not assume references are automatically joined or that two separate reads/writes form one transaction. $lookup and multi-document transaction configuration are not required implementations here.</p>\n"}, "diagram": "ns2_model", "programs": ["ns2p10"]}, {"h": {"en": "Basic Indexing, Unique Constraints and an Honest Explain Comparison"}, "body": {"en": "\n<p>An <b>index</b> stores ordered field information that can reduce the work needed for a suitable query. An ordinary collection has the unique _id index. createIndex can add a single-field or compound index; getIndexes lists the definitions.</p>\n<p><b>Example index:</b> {city:1,marks:-1} with name city_marks. The query asks for Surat students with marks greater than 80. The reference deliberately forces a natural scan and then the named index with <b>hint</b> so the tiny fixture illustrates a controlled comparison:</p>\n<table><tr><th>Plan deliberately requested</th><th>Returned</th><th>Documents examined</th><th>Index keys examined</th></tr><tr><td>Natural collection scan</td><td>3</td><td>6</td><td>Not used for this comparison</td></tr><tr><td>city_marks index</td><td>3</td><td>3</td><td>3</td></tr></table>\n<p><b>Interpretation:</b> same result, fewer examined documents in this observed run. This is not a guarantee about wall-clock speed or what the optimizer would choose without hints. Execution plans/counters vary with data, query and server version; do not claim that every query always uses every index.</p>\n<p><b>Unique email:</b> a separate {email:1} unique index rejects an identical email with 11000. Plan normalization/collation and missing/null policies if adapting this to users; uniqueness is not validation of a real email address.</p>\n<p><b>Cost:</b> indexes consume storage and must be maintained during writes. Add indexes for real access patterns; too many indexes can hurt write-heavy workloads.</p>\n"}, "diagram": "ns2_index", "programs": ["ns2p11"]}, {"h": {"en": "Aggregation Pipeline: $match → $group → $sum / $avg"}, "body": {"en": "\n<p>An aggregation pipeline passes documents through ordered stages. A stage can filter, reshape or group its input; it need not output one document for each input document.</p>\n<pre class=\"c\">db.orders.aggregate([\n  {$match: {status: \"paid\"}},\n  {$group: {\n    _id: \"$category\",\n    count: {$sum: 1},\n    total: {$sum: \"$amount\"},\n    average: {$avg: \"$amount\"}\n  }},\n  {$sort: {_id: 1}}\n]);</pre>\n<ul><li><b>$match:</b> keep only paid orders, reducing six inputs to five.</li><li><b>$group:</b> group those documents by the category field. \"<b>$category</b>\" is a field path; \"category\" without $ would be a literal string.</li><li><b>$sum:1:</b> count documents in each group.</li><li><b>$sum:\"$amount\":</b> add the numeric amounts.</li><li><b>$avg:\"$amount\":</b> compute a mean of the numeric amounts.</li><li><b>$sort:</b> make the two output rows deterministic; grouping alone does not promise output order.</li></ul>\n<table><tr><th>Category</th><th>Count</th><th>Total</th><th>Average</th></tr><tr><td>book</td><td>3</td><td>600</td><td>200</td></tr><tr><td>tool</td><td>2</td><td>1000</td><td>500</td></tr></table>\n<p>This pipeline is read-only and leaves all six source orders unchanged. Pipelines that explicitly use write stages are a different case. The integer demo amounts avoid an implied claim of exact general floating-point money arithmetic.</p>\n"}, "diagram": "ns2_pipeline", "programs": ["ns2p12"]}, {"h": {"en": "Practical 3 Mini-Catalog: CRUD with a Guarded Stock Decrement"}, "body": {"en": "\n<p>The mini-catalog stores a book with a pages attribute and a sensor with a sample-rate attribute. Both share identifying fields, a category, an integer pricePaise value and stock. The examples demonstrate a plausible document-model choice without building a hosted web service.</p>\n<p><b>Read:</b> filter books, project name/price, sort and limit. <b>Update:</b> filter by the product ID <b>and stock ≥1</b>, then $inc stock by -1 in the same operation.</p>\n<p><b>Observed:</b> starting stock is 2; the first two attempted sales each match one record, the third matches zero, and final stock is 0. A missing-ID delete reports zero.</p>\n<p><b>Guarantee boundary:</b> the conditional update is atomic for that one document. These are sequential reference attempts, not a concurrent stress test. There is no atomic payment-plus-stock workflow or multi-document transaction in this example.</p>\n<p><b>Student extension:</b> add a new catalog type, validate its required fields, query a nested attribute and justify an index. Record actual commands and negative cases; do not claim AI training or remote deployment from a local CRUD demonstration.</p>\n"}, "programs": ["ns2p13"]}]}, {"title": {"en": "2.5 Replication and Sharding — Conceptual Overview Only"}, "items": [{"h": {"en": "Replication: Copies of the Same Dataset"}, "body": {"en": "\n<p>A <b>replica set</b> is a group of mongod instances maintaining copies of the same dataset. In the basic architecture, a primary receives writes and secondaries replicate its changes. An eligible replacement primary can be elected when the current primary is unavailable.</p>\n<ul><li><b>Purpose:</b> redundancy and potential failover/data locality, not splitting the collection into distinct subsets.</li><li><b>Lag:</b> secondaries apply changes asynchronously and can be behind. Read/write settings affect what a successful operation guarantees.</li><li><b>Failure:</b> an election or a partition can interrupt service. Do not promise zero downtime, immediate current secondary reads or a fixed CP/AP brand label for every operation.</li><li><b>Backup:</b> replicated deletion/corruption can propagate; independent backups and tested restores still matter.</li></ul>\n<p><b>Scope/evidence:</b> the syllabus explicitly requires concepts only. The reference programs use a standalone server: no replica set was configured, no election was triggered and no failover test is claimed.</p>\n"}, "diagram": "ns2_replica"}, {"h": {"en": "Sharding: Different Subsets across Shards"}, "body": {"en": "\n<p><b>Sharding</b> distributes a collection’s data across multiple shards to support horizontal growth. A <b>shard key</b> influences data placement and query routing. In the standard self-managed architecture, mongos routes requests using metadata maintained by config servers; each shard is itself deployed as a replica set.</p>\n<ul><li><b>Replication:</b> copies of the same data. <b>Sharding:</b> different subsets distributed across shards. A sharded system can use both.</li><li><b>Key choice matters:</b> an uneven or hotspot-producing key can concentrate work instead of balancing it.</li><li><b>Query routing matters:</b> a suitable key-directed query may target relevant shards; an unrelated query may need broader work.</li><li><b>Cost:</b> more routing, monitoring, security and maintenance complexity. Horizontal scaling is not a promise of linear speedup.</li></ul>\n<p><b>Scope/evidence:</b> explain the diagram and distinguish copies from subsets. No mongos/config-server/shard setup, shard-key experiment or sharding benchmark is required or claimed. A standalone CRUD result cannot establish distributed behaviour.</p>\n"}, "diagram": "ns2_shard"}]}, {"title": {"en": "Practicals 2–3 — Evidence, Journal and Source Checklist"}, "items": [{"h": {"en": "Practical Journal, Acceptance Checks and References"}, "body": {"en": "\n<p><b>Practical 2:</b> install Community Server and mongosh; configure the local environment; record both versions and a successful connection plus authorized write/read evidence. The tested private environment used authentication; no real personal data or public database endpoint was used.</p>\n<p><b>Practical 3:</b> create/use collections and carry out insert/find/update/delete with the listed comparison/logical filters, sorting and projection. Use the six-student fixture and the independent mini-catalog to explain both expected results and negative cases.</p>\n<pre class=\"c\">Aim and practical number\nOS / architecture and installation method\nActual mongod and mongosh versions\nLocal connection, authentication and ping evidence\nScratch database and collection names\nActual input, commands and observed output\nPositive + negative checks\nModel/index decisions and one limitation\nSafe cleanup, conclusion and sources</pre>\n<h4>Acceptance checklist</h4>\n<ul><li>Actual server and shell versions and storage round-trip recorded.</li><li>Correct BSON/ID types, deterministic sort and intended projection.</li><li>All five syllabus operators demonstrated; array/nested filters understood.</li><li>Matched/modified/deleted counts and duplicate/missing/no-op outcomes checked.</li><li>Embedding/reference choice justified; missing reference handled.</li><li>Index comparison explained as forced counters, not a timer claim.</li><li>Aggregation totals/averages verified and source rows preserved.</li><li>Scratch databases cleaned; credentials excluded from notes/downloads.</li><li>Replication/sharding labeled conceptual, not configured.</li></ul>\n<p><b>Assessment:</b> this is a practical-only subject (PA 20 + ESE 30 = 50; 0 theory ESE/PA). The answered practice tasks below prepare the lab/journal/viva and do not invent official theory-paper question marks.</p>\n<h4>References</h4>\n<p>Official syllabus and MongoDB documentation, checked 29 October 2026. Installation instructions are platform/version-specific; the recorded versions identify the reference run.</p>\n<ol><li><a href=\"https://s3-ap-southeast-1.amazonaws.com/gtusitecirculars/Syallbus/DI04000031.pdf\">GTU DI04000031 syllabus (2025-26)</a></li><li><a href=\"https://www.mongodb.com/docs/manual/installation/\">MongoDB Community installation by OS</a></li><li><a href=\"https://www.mongodb.com/docs/manual/administration/install-community-linux/\">Official Linux installation: select Debian / your distribution</a></li><li><a href=\"https://www.mongodb.com/docs/mongodb-shell/install/\">Install mongosh</a></li><li><a href=\"https://www.mongodb.com/docs/manual/core/document/\">MongoDB documents and BSON</a></li><li><a href=\"https://www.mongodb.com/docs/manual/crud/\">MongoDB CRUD</a></li><li><a href=\"https://www.mongodb.com/docs/manual/tutorial/project-fields-from-query-results/\">Projection rules</a></li><li><a href=\"https://www.mongodb.com/docs/manual/data-modeling/best-practices/\">Embedding and references</a></li><li><a href=\"https://www.mongodb.com/docs/manual/indexes/\">Indexes</a></li><li><a href=\"https://www.mongodb.com/docs/manual/core/aggregation-pipeline/\">Aggregation pipelines</a></li><li><a href=\"https://www.mongodb.com/docs/manual/replication/\">Replication concepts</a></li><li><a href=\"https://www.mongodb.com/docs/manual/sharding/\">Sharding concepts</a></li></ol>"}}]}, {"title": {"en": "Answered Practice Tasks — Lab and Viva Preparation, Not a Theory Paper"}, "role": "practice", "items": [{"h": {"en": "Draw the client-to-storage MongoDB architecture. Distinguish mongod, mongosh, a driver and Compass."}, "body": {"en": "<p>Draw application/driver or mongosh → connection → mongod → BSON collections, indexes and storage → result. mongod executes server operations; mongosh is a JavaScript-based client; a driver serves application code; Compass is an optional GUI client.</p><p>Installing mongosh does not establish a running server or data access. The local reference is not a hosted application, replica set or sharded cluster.</p>"}}, {"h": {"en": "Prepare an installation and connectivity procedure for your actual OS without exposing an unauthenticated database."}, "body": {"en": "<p>Identify OS/architecture; select its vendor-supported packages; install Community Server and mongosh; record both versions; start a localhost-bound server with appropriate private access; authenticate; select a disposable database; ping and verify an authorized insert/read round-trip.</p><p>Record actual observations. The reference used Debian 13 x86_64, server 9.0.4 and shell 2.14.0. Do not paste its Debian repository into an unrelated OS, put passwords in the journal or treat ping as proof of write permission.</p>"}}, {"h": {"en": "Explain database, collection, document, BSON and four required document value types. Include a type-mismatch example."}, "body": {"en": "<p>A database groups collections; a collection stores documents of named fields. BSON is typed binary storage. Required examples are ObjectId, String, Array and Embedded Document.</p><p>ObjectId(\"65a1b2c3d4e5f60718293040\") differs from the plain string of that hex value. The fixture finds zero string-ID matches and one ObjectId match. _id can also be another suitable supported type, as in the integer student IDs.</p>"}}, {"h": {"en": "Insert one record and then two records, attempt a duplicate ID, and explain the observed counts."}, "body": {"en": "<p>Use insertOne for _id:1 and insertMany for _id:2 and 3. Inspect acknowledgement and inserted IDs. The second insertMany has two inserted identifiers.</p><p>The attempted duplicate _id:1 is rejected with 11000, so three records remain. Catch only the expected error; do not hide unrelated failures. A batch is not automatically an all-or-nothing transaction.</p>"}}, {"h": {"en": "Using the six students, derive the results for marks >80, marks <70, city in Surat/Bharuch, age >18 AND marks >80, and Surat OR marks <60."}, "body": {"en": "<p>Sorted ID results are [1,3,5], [4,6], [1,2,3,5], [1,5] and [1,3,5,6] respectively. Use $gt, $lt, $in, explicit $and and explicit $or.</p><p>State the strict boundaries. Conditions on different ordinary fields are implicitly ANDed; avoid duplicate JavaScript keys that overwrite earlier conditions.</p>"}}, {"h": {"en": "Return only names and marks for the top three students with deterministic tie handling."}, "body": {"en": "<p>Use find({}, {_id:0,name:1,marks:1}).sort({marks:-1,_id:1}).limit(3).toArray() on the student collection.</p><p>Observed order: Neha 92, Asha 82, Meera 82. _id resolves the tie. Projection shapes the returned fields and does not alter stored data. Do not mix ordinary inclusion/exclusion modes; _id:0 is the allowed special case here.</p>"}}, {"h": {"en": "Compare a MongoDB skill query, a dotted pin query and whole-address equality."}, "body": {"en": "<p>{skills:\"MongoDB\"} matches IDs [1,3]. {\"address.pin\":\"395001\"} matches [1]. {address:{pin:\"395001\"}} matches none because the stored address also has state.</p><p>Array membership can match an element; dot notation targets a nested field. Whole-object equality is not a substitute for querying one nested property.</p>"}}, {"h": {"en": "Apply $set/$inc, update inactive students, repeat a no-op update and update a missing ID. Explain matched/modified counts."}, "body": {"en": "<p>Ravi’s city change plus marks +5 reports 1/1. Adding 2 marks to the two inactive students reports 2/2. Setting Ravi to the already stored 75 reports 1/0; updating _id:999 reports 0/0.</p><p>matchedCount and modifiedCount answer different questions. Single-document updates are atomic, but updateMany is not automatically a transaction over all matched records.</p>"}}, {"h": {"en": "Explain the two upserts for _id:7 and the replacement that removes city."}, "body": {"en": "<p>The first upsert inserts Jai and reports upsertedCount:1; the second matches that same unique _id and updates marks, leaving one profile.</p><p>replaceOne with only name and marks removes city while retaining the existing _id. Use $set for partial updates; request upsert only when creating a missing document is intended.</p>"}}, {"h": {"en": "Delete student 6, then inactive students, and then an absent ID. State the remaining IDs and safety checks."}, "body": {"en": "<p>The operations report deleted counts 1, 1 and 0; IDs [1,2,3,5] remain. Preview the intended filter and confirm the current scratch database/collection.</p><p>deleteMany({}) removes all collection documents; drop removes the collection plus indexes. A preview count is not a lock, and a scratch-name prefix is not authorization or a recovery plan.</p>"}}, {"h": {"en": "For explicit null, a missing tag and a string tag, explain three filters and two rejected command shapes."}, "body": {"en": "<p>{tag:null} returns [1,2]; {tag:{$type:10}} returns [1]; {tag:{$exists:false}} returns [2]. A string \"1\" does not match numeric _id:1.</p><p>The mixed projection is rejected by the server (31254 in this run). updateOne with a non-operator update is rejected by mongosh with MongoInvalidArgumentError. Validate external scalar types and build allowed query shapes rather than accepting arbitrary selector objects.</p>"}}, {"h": {"en": "Choose embedding or references for learner addresses and shared course details, and handle an unknown course ID."}, "body": {"en": "<p>Embed a bounded address when it is read with the learner. Reference a shared course by courseId to avoid copying its separately managed details into every learner.</p><p>Retrieve the course explicitly and handle null. The fixture accepts UNKNOWN because MongoDB does not automatically enforce a relational foreign key. Avoid unbounded embedded histories and do not assume two documents form one atomic transaction.</p>"}}, {"h": {"en": "Explain the city_marks index comparison and unique-email rejection without claiming a universal speedup."}, "body": {"en": "<p>The forced natural scan and forced compound index both return three documents. The scan examines six; the index examines three documents and three keys. Hints control this tiny fixture; no wall-clock multiplier or automatic optimizer choice is claimed.</p><p>A separate unique email index rejects an identical value with 11000. Indexes use storage and write work; real applications still need normalization, validation and a deliberate uniqueness policy.</p>"}}, {"h": {"en": "Compute paid-order count, total and average per category; explain every required aggregation operator."}, "body": {"en": "<p>$match excludes the cancelled order, leaving five. $group uses _id:\"$category\"; $sum:1 counts inputs; $sum:\"$amount\" totals amounts; $avg:\"$amount\" computes the mean.</p><p>book has three paid orders 200+300+100 = 600, average 200. tool has two paid orders 400+600 = 1000, average 500. $sort fixes group output order and the read-only pipeline leaves six source orders unchanged.</p>"}}, {"h": {"en": "Explain the three stock-decrement attempts from starting stock 2. State the atomicity boundary."}, "body": {"en": "<p>Filter {_id:\"B101\",stock:{$gte:1}} and apply {$inc:{stock:-1}} in one updateOne. The first two attempts each match one document, the third matches zero, and final stock is zero.</p><p>The server evaluates the guarded single-document update atomically. These reference attempts are sequential; there is no claimed concurrent stress test, payment-plus-stock transaction, trained model or remote deployment.</p>"}}, {"h": {"en": "Draw a primary and two secondaries. Explain lag, possible election and why copies are not independent backups."}, "body": {"en": "<p>Show the same dataset on all three members. The primary accepts writes and secondaries replicate changes asynchronously; they can lag. An eligible member may become primary when the primary is unavailable, with a possible service interruption.</p><p>Deletion/corruption can replicate, so independent backups and restore testing are still necessary. The diagram is conceptual; this unit did not configure or failover-test a replica set.</p>"}}, {"h": {"en": "Draw a mongos router and two shards. Explain subsets, the shard key and the difference from replication."}, "body": {"en": "<p>Show different data subsets in the two shards, with mongos routing using configuration metadata. A shard key influences placement/routing and each shard in the standard self-managed design is a replica set.</p><p>Sharding distributes different subsets; replication copies the same dataset. Poor keys can create hotspots and unrelated queries may require broad work. No cluster setup or sharding benchmark is claimed.</p>"}}, {"h": {"en": "Prepare an acceptance-test journal for the independent CRUD scripts and mini-catalog."}, "body": {"en": "<p>Record actual versions, authorized connection/storage checks, fresh scratch contexts, input documents and observed output. Include all five listed filters, stable sort/limit/projection, nested/array queries, matched/no-op/missing results, duplicate keys, null/missing/type cases and targeted deletion.</p><p>Explain model/index decisions and aggregation totals, preserve credentials outside submissions and clean only the captured scratch databases. Replication/sharding remain conceptual. These tasks prepare practical PA/ESE and are not an official theory question paper.</p>"}}]}], "programs": [{"id": "ns2p01", "title": {"en": "Verify Connection, Database Selection and Collection Creation"}, "code": {"en": "// Run only in a fresh, disposable lab database.\nif (!db.getName().startsWith(\"di04000031_u2_\")) {\n  throw new Error(\"Select an isolated Unit 2 scratch database\");\n}\nprint(\"Server: \" + db.version());\nprint(\"Ping: \" + db.runCommand({ping: 1}).ok);\nprint(\"Scratch selected: \" + db.getName()\n  .startsWith(\"di04000031_u2_\"));\ndb.createCollection(\"probe\");\nprint(\"Collection exists: \" + db.getCollectionNames()\n  .includes(\"probe\"));\ndb.probe.insertOne({_id: 1, message: \"MongoDB connected\"});\nprint(\"Stored message: \" + db.probe.findOne({_id: 1}).message);\nprint(\"Collection dropped: \" + db.probe.drop());"}, "out": "Server: 9.0.4\nPing: 1\nScratch selected: true\nCollection exists: true\nStored message: MongoDB connected\nCollection dropped: true", "expl": {"en": "<p>Real connectivity and collection operations on MongoDB. Selecting a database is a client-side choice; createCollection/insert materializes storage. The harness supplies a fresh prefix-guarded database and removes only that database afterward. Server and mongosh versions are recorded separately; the shell version is not the server version.</p>"}}, {"id": "ns2p02", "title": {"en": "BSON Types and ObjectId versus String"}, "code": {"en": "// Run only in a fresh, disposable lab database.\nif (!db.getName().startsWith(\"di04000031_u2_\")) {\n  throw new Error(\"Select an isolated Unit 2 scratch database\");\n}\nconst oid = ObjectId(\"65a1b2c3d4e5f60718293040\");\ndb.profiles.insertOne({\n  _id: oid, name: \"Asha\", age: NumberInt(19),\n  skills: [\"MongoDB\", \"Python\"],\n  address: {city: \"Surat\"}, active: true,\n  joined: ISODate(\"2026-01-15T00:00:00Z\"), score: 82.5\n});\nconst types = [\n  [\"_id\", \"objectId\"], [\"name\", \"string\"],\n  [\"age\", \"int\"], [\"skills\", \"array\"],\n  [\"address\", \"object\"], [\"active\", \"bool\"],\n  [\"joined\", \"date\"], [\"score\", \"double\"]\n];\nfor (const [field, kind] of types) {\n  const n = db.profiles.countDocuments({\n    [field]: {$type: kind}\n  });\n  print(field + \" / \" + kind + \": \" + n);\n}\nprint(\"String ID matches: \" + db.profiles.countDocuments({\n  _id: \"65a1b2c3d4e5f60718293040\"\n}));\nprint(\"ObjectId matches: \" + db.profiles.countDocuments({\n  _id: ObjectId(\"65a1b2c3d4e5f60718293040\")\n}));\nprint(\"UTC date: \" + db.profiles.findOne({_id: oid})\n  .joined.toISOString());"}, "out": "_id / objectId: 1\nname / string: 1\nage / int: 1\nskills / array: 1\naddress / object: 1\nactive / bool: 1\njoined / date: 1\nscore / double: 1\nString ID matches: 0\nObjectId matches: 1\nUTC date: 2026-01-15T00:00:00.000Z", "expl": {"en": "<p>The $type filters inspect stored BSON types, not only JavaScript typeof. The same hexadecimal text is not equal to an ObjectId value. ISODate and NumberInt are mongosh constructors; this script is JavaScript for mongosh, not strict JSON. Fixed values make the captured output reproducible.</p>"}}, {"id": "ns2p03", "title": {"en": "Insert One, Insert Many and Reject a Duplicate ID"}, "code": {"en": "// Run only in a fresh, disposable lab database.\nif (!db.getName().startsWith(\"di04000031_u2_\")) {\n  throw new Error(\"Select an isolated Unit 2 scratch database\");\n}\nconst one = db.students.insertOne({\n  _id: 1, name: \"Asha\", marks: 82\n});\nprint(\"insertOne acknowledged: \" + one.acknowledged);\nconst many = db.students.insertMany([\n  {_id: 2, name: \"Ravi\", marks: 70},\n  {_id: 3, name: \"Neha\", marks: 92}\n]);\nprint(\"insertMany count: \" + Object.keys(many.insertedIds)\n  .length);\nlet duplicateRejected = false;\ntry {\n  db.students.insertOne({_id: 1, name: \"Duplicate\"});\n} catch (e) {\n  if (e.code !== 11000) throw e;\n  duplicateRejected = true;\n  print(\"Duplicate ID error: \" + e.code);\n}\nif (!duplicateRejected) throw new Error(\"Expected duplicate ID\");\nprint(\"Stored rows: \" + db.students.countDocuments({}));"}, "out": "insertOne acknowledged: true\ninsertMany count: 2\nDuplicate ID error: 11000\nStored rows: 3", "expl": {"en": "<p>Integer _id values are deliberate for this lab; MongoDB does not require _id to be an ObjectId. An omitted _id normally receives an ObjectId. The default unique _id index rejects the duplicate with server error 11000. An acknowledged write is not a backup or evidence of replication on this standalone server.</p>"}}, {"id": "ns2p04", "title": {"en": "Query Filters: $gt, $lt, $in, $and and $or"}, "code": {"en": "// Run only in a fresh, disposable lab database.\nif (!db.getName().startsWith(\"di04000031_u2_\")) {\n  throw new Error(\"Select an isolated Unit 2 scratch database\");\n}\ndb.students.insertMany([\n  {_id: 1, name: \"Asha\", age: 19, city: \"Surat\",\n   marks: 82, active: true, skills: [\"MongoDB\", \"Python\"],\n   address: {state: \"Gujarat\", pin: \"395001\"}},\n  {_id: 2, name: \"Ravi\", age: 20, city: \"Bharuch\",\n   marks: 70, active: true, skills: [\"Java\"],\n   address: {state: \"Gujarat\", pin: \"392001\"}},\n  {_id: 3, name: \"Neha\", age: 18, city: \"Surat\",\n   marks: 92, active: true, skills: [\"MongoDB\", \"Java\"],\n   address: {state: \"Gujarat\", pin: \"395007\"}},\n  {_id: 4, name: \"Imran\", age: 21, city: \"Vadodara\",\n   marks: 65, active: false, skills: [\"Python\"],\n   address: {state: \"Gujarat\", pin: \"390001\"}},\n  {_id: 5, name: \"Meera\", age: 20, city: \"Surat\",\n   marks: 82, active: true, skills: [\"AI\", \"Python\"],\n   address: {state: \"Gujarat\", pin: \"395009\"}},\n  {_id: 6, name: \"Dev\", age: 19, city: \"Ahmedabad\",\n   marks: 50, active: false, skills: [],\n   address: {state: \"Gujarat\", pin: \"380001\"}}\n]);\nconst ids = q => db.students.find(q, {_id: 1})\n  .sort({_id: 1}).toArray().map(x => x._id);\n\nprint(\"gt80: \" + JSON.stringify(ids({marks: {$gt: 80}})));\nprint(\"lt70: \" + JSON.stringify(ids({marks: {$lt: 70}})));\nprint(\"inCities: \" + JSON.stringify(ids({\n  city: {$in: [\"Surat\", \"Bharuch\"]}\n})));\nprint(\"and: \" + JSON.stringify(ids({$and: [\n  {age: {$gt: 18}}, {marks: {$gt: 80}}\n]})));\nprint(\"or: \" + JSON.stringify(ids({$or: [\n  {city: \"Surat\"}, {marks: {$lt: 60}}\n]})));\nprint(\"implicitAnd: \" + JSON.stringify(ids({\n  city: \"Surat\", marks: {$gt: 80}\n})));"}, "out": "gt80: [1,3,5]\nlt70: [4,6]\ninCities: [1,2,3,5]\nand: [1,5]\nor: [1,3,5,6]\nimplicitAnd: [1,3,5]", "expl": {"en": "<p>Every query runs against the six explicit seed documents. IDs are projected and sorted to make comparisons unambiguous. $gt/$lt are strict comparisons; $in tests membership; $and requires all clauses and $or at least one. Different ordinary fields in the same filter are implicitly ANDed.</p>"}}, {"id": "ns2p05", "title": {"en": "Deterministic Sort, Limit and Projections"}, "code": {"en": "// Run only in a fresh, disposable lab database.\nif (!db.getName().startsWith(\"di04000031_u2_\")) {\n  throw new Error(\"Select an isolated Unit 2 scratch database\");\n}\ndb.students.insertMany([\n  {_id: 1, name: \"Asha\", age: 19, city: \"Surat\",\n   marks: 82, active: true, skills: [\"MongoDB\", \"Python\"],\n   address: {state: \"Gujarat\", pin: \"395001\"}},\n  {_id: 2, name: \"Ravi\", age: 20, city: \"Bharuch\",\n   marks: 70, active: true, skills: [\"Java\"],\n   address: {state: \"Gujarat\", pin: \"392001\"}},\n  {_id: 3, name: \"Neha\", age: 18, city: \"Surat\",\n   marks: 92, active: true, skills: [\"MongoDB\", \"Java\"],\n   address: {state: \"Gujarat\", pin: \"395007\"}},\n  {_id: 4, name: \"Imran\", age: 21, city: \"Vadodara\",\n   marks: 65, active: false, skills: [\"Python\"],\n   address: {state: \"Gujarat\", pin: \"390001\"}},\n  {_id: 5, name: \"Meera\", age: 20, city: \"Surat\",\n   marks: 82, active: true, skills: [\"AI\", \"Python\"],\n   address: {state: \"Gujarat\", pin: \"395009\"}},\n  {_id: 6, name: \"Dev\", age: 19, city: \"Ahmedabad\",\n   marks: 50, active: false, skills: [],\n   address: {state: \"Gujarat\", pin: \"380001\"}}\n]);\n\nconst top = db.students.find({}, {\n  _id: 0, name: 1, marks: 1\n}).sort({marks: -1, _id: 1}).limit(3).toArray();\nprint(\"Top three: \" + JSON.stringify(top));\nconst excluded = db.students.findOne({_id: 2}, {\n  age: 0, active: 0, skills: 0, address: 0\n});\nprint(\"Exclusion: \" + JSON.stringify(excluded));\nprint(\"find returns cursor: \" +\n  (typeof db.students.find({}).toArray === \"function\"));\nprint(\"Missing findOne: \" + JSON.stringify(\n  db.students.findOne({_id: 999})\n));"}, "out": "Top three: [{\"name\":\"Neha\",\"marks\":92},{\"name\":\"Asha\",\"marks\":82},{\"name\":\"Meera\",\"marks\":82}]\nExclusion: {\"_id\":2,\"name\":\"Ravi\",\"city\":\"Bharuch\",\"marks\":70}\nfind returns cursor: true\nMissing findOne: null", "expl": {"en": "<p>marks:-1 sorts descending; _id:1 breaks the 82-mark tie consistently. limit(3) is applied to the sorted query result. The inclusion projection hides _id explicitly; the exclusion projection retains unspecified fields. Do not mix ordinary inclusion and exclusion fields. find returns a cursor; findOne returns one document or null. toArray is suitable for this small fixture, not an unbounded production result.</p>"}}, {"id": "ns2p06", "title": {"en": "Query Array Members and Embedded Fields"}, "code": {"en": "// Run only in a fresh, disposable lab database.\nif (!db.getName().startsWith(\"di04000031_u2_\")) {\n  throw new Error(\"Select an isolated Unit 2 scratch database\");\n}\ndb.students.insertMany([\n  {_id: 1, name: \"Asha\", age: 19, city: \"Surat\",\n   marks: 82, active: true, skills: [\"MongoDB\", \"Python\"],\n   address: {state: \"Gujarat\", pin: \"395001\"}},\n  {_id: 2, name: \"Ravi\", age: 20, city: \"Bharuch\",\n   marks: 70, active: true, skills: [\"Java\"],\n   address: {state: \"Gujarat\", pin: \"392001\"}},\n  {_id: 3, name: \"Neha\", age: 18, city: \"Surat\",\n   marks: 92, active: true, skills: [\"MongoDB\", \"Java\"],\n   address: {state: \"Gujarat\", pin: \"395007\"}},\n  {_id: 4, name: \"Imran\", age: 21, city: \"Vadodara\",\n   marks: 65, active: false, skills: [\"Python\"],\n   address: {state: \"Gujarat\", pin: \"390001\"}},\n  {_id: 5, name: \"Meera\", age: 20, city: \"Surat\",\n   marks: 82, active: true, skills: [\"AI\", \"Python\"],\n   address: {state: \"Gujarat\", pin: \"395009\"}},\n  {_id: 6, name: \"Dev\", age: 19, city: \"Ahmedabad\",\n   marks: 50, active: false, skills: [],\n   address: {state: \"Gujarat\", pin: \"380001\"}}\n]);\nconst ids = q => db.students.find(q, {_id: 1})\n  .sort({_id: 1}).toArray().map(x => x._id);\n\nprint(\"MongoDB skill: \" + JSON.stringify(ids({\n  skills: \"MongoDB\"\n})));\nprint(\"Python or Java: \" + JSON.stringify(ids({\n  skills: {$in: [\"Python\", \"Java\"]}\n})));\nprint(\"Nested pin: \" + JSON.stringify(ids({\n  \"address.pin\": \"395001\"\n})));\nprint(\"Whole-object match: \" + JSON.stringify(ids({\n  address: {pin: \"395001\"}\n})));\nprint(\"Two skills: \" + JSON.stringify(ids({$and: [\n  {skills: \"MongoDB\"}, {skills: \"Python\"}\n]})));"}, "out": "MongoDB skill: [1,3]\nPython or Java: [1,2,3,4,5]\nNested pin: [1]\nWhole-object match: []\nTwo skills: [1]", "expl": {"en": "<p>A scalar equality query can match an element of an array. Quoted dot notation targets a field inside an embedded object. Whole-object equality is different: the seed address also has state, so the shorter object is not an exact match. The two separate skill clauses require both values in the array, not the same single array element.</p>"}}, {"id": "ns2p07", "title": {"en": "Update One/Many, $set/$inc and Result Counts"}, "code": {"en": "// Run only in a fresh, disposable lab database.\nif (!db.getName().startsWith(\"di04000031_u2_\")) {\n  throw new Error(\"Select an isolated Unit 2 scratch database\");\n}\ndb.students.insertMany([\n  {_id: 1, name: \"Asha\", age: 19, city: \"Surat\",\n   marks: 82, active: true, skills: [\"MongoDB\", \"Python\"],\n   address: {state: \"Gujarat\", pin: \"395001\"}},\n  {_id: 2, name: \"Ravi\", age: 20, city: \"Bharuch\",\n   marks: 70, active: true, skills: [\"Java\"],\n   address: {state: \"Gujarat\", pin: \"392001\"}},\n  {_id: 3, name: \"Neha\", age: 18, city: \"Surat\",\n   marks: 92, active: true, skills: [\"MongoDB\", \"Java\"],\n   address: {state: \"Gujarat\", pin: \"395007\"}},\n  {_id: 4, name: \"Imran\", age: 21, city: \"Vadodara\",\n   marks: 65, active: false, skills: [\"Python\"],\n   address: {state: \"Gujarat\", pin: \"390001\"}},\n  {_id: 5, name: \"Meera\", age: 20, city: \"Surat\",\n   marks: 82, active: true, skills: [\"AI\", \"Python\"],\n   address: {state: \"Gujarat\", pin: \"395009\"}},\n  {_id: 6, name: \"Dev\", age: 19, city: \"Ahmedabad\",\n   marks: 50, active: false, skills: [],\n   address: {state: \"Gujarat\", pin: \"380001\"}}\n]);\n\nconst one = db.students.updateOne({_id: 2}, {\n  $set: {city: \"Surat\"}, $inc: {marks: 5}\n});\nprint(\"One: \" + one.matchedCount + \"/\" + one.modifiedCount);\nconst many = db.students.updateMany({active: false}, {\n  $inc: {marks: 2}\n});\nprint(\"Many: \" + many.matchedCount + \"/\" + many.modifiedCount);\nconst noop = db.students.updateOne({_id: 2}, {\n  $set: {marks: 75}\n});\nprint(\"No-op: \" + noop.matchedCount + \"/\" + noop.modifiedCount);\nconst miss = db.students.updateOne({_id: 999}, {\n  $set: {marks: 99}\n});\nprint(\"Missing: \" + miss.matchedCount + \"/\" + miss.modifiedCount);\nprint(\"Ravi: \" + JSON.stringify(db.students.findOne(\n  {_id: 2}, {_id: 0, name: 1, city: 1, marks: 1}\n)));"}, "out": "One: 1/1\nMany: 2/2\nNo-op: 1/0\nMissing: 0/0\nRavi: {\"name\":\"Ravi\",\"city\":\"Surat\",\"marks\":75}", "expl": {"en": "<p>$set changes named fields without replacing the whole document; $inc changes a numeric field. matchedCount and modifiedCount are different: setting 75 when 75 is already stored is a matched no-op. updateMany changes each matched document atomically, but the entire multi-document operation is not automatically one transaction.</p>"}}, {"id": "ns2p08", "title": {"en": "Explicit Upsert versus Whole-Document Replacement"}, "code": {"en": "// Run only in a fresh, disposable lab database.\nif (!db.getName().startsWith(\"di04000031_u2_\")) {\n  throw new Error(\"Select an isolated Unit 2 scratch database\");\n}\nconst first = db.profiles.updateOne({_id: 7}, {\n  $set: {name: \"Jai\", city: \"Surat\", marks: 60}\n}, {upsert: true});\nprint(\"Created by upsert: \" + first.upsertedCount);\nconst second = db.profiles.updateOne({_id: 7}, {\n  $set: {marks: 65}\n}, {upsert: true});\nprint(\"Second matched: \" + second.matchedCount);\nprint(\"Profiles: \" + db.profiles.countDocuments({}));\ndb.profiles.replaceOne({_id: 7}, {\n  name: \"Jai\", marks: 70\n});\nconst replaced = db.profiles.findOne({_id: 7});\nprint(\"ID retained: \" + replaced._id);\nprint(\"City removed: \" + !Object.hasOwn(replaced, \"city\"));\nprint(\"Remaining fields: \" + Object.keys(replaced)\n  .sort().join(\",\"));"}, "out": "Created by upsert: 1\nSecond matched: 1\nProfiles: 1\nID retained: 7\nCity removed: true\nRemaining fields: _id,marks,name", "expl": {"en": "<p>upsert:true inserts if there is no match, otherwise updates a match. A stable unique key is important; upsert is not a substitute for uniqueness constraints. replaceOne removes omitted non-_id fields; the existing _id is retained when it is omitted from the replacement. Prefer $set for a partial change. Never include a different _id in a replacement.</p>"}}, {"id": "ns2p09", "title": {"en": "Targeted Deletes and Missing-Record Results"}, "code": {"en": "// Run only in a fresh, disposable lab database.\nif (!db.getName().startsWith(\"di04000031_u2_\")) {\n  throw new Error(\"Select an isolated Unit 2 scratch database\");\n}\ndb.students.insertMany([\n  {_id: 1, name: \"Asha\", age: 19, city: \"Surat\",\n   marks: 82, active: true, skills: [\"MongoDB\", \"Python\"],\n   address: {state: \"Gujarat\", pin: \"395001\"}},\n  {_id: 2, name: \"Ravi\", age: 20, city: \"Bharuch\",\n   marks: 70, active: true, skills: [\"Java\"],\n   address: {state: \"Gujarat\", pin: \"392001\"}},\n  {_id: 3, name: \"Neha\", age: 18, city: \"Surat\",\n   marks: 92, active: true, skills: [\"MongoDB\", \"Java\"],\n   address: {state: \"Gujarat\", pin: \"395007\"}},\n  {_id: 4, name: \"Imran\", age: 21, city: \"Vadodara\",\n   marks: 65, active: false, skills: [\"Python\"],\n   address: {state: \"Gujarat\", pin: \"390001\"}},\n  {_id: 5, name: \"Meera\", age: 20, city: \"Surat\",\n   marks: 82, active: true, skills: [\"AI\", \"Python\"],\n   address: {state: \"Gujarat\", pin: \"395009\"}},\n  {_id: 6, name: \"Dev\", age: 19, city: \"Ahmedabad\",\n   marks: 50, active: false, skills: [],\n   address: {state: \"Gujarat\", pin: \"380001\"}}\n]);\n\nprint(\"Preview inactive: \" + db.students.countDocuments({\n  active: false\n}));\nprint(\"deleteOne: \" + db.students.deleteOne({_id: 6})\n  .deletedCount);\nprint(\"deleteMany: \" + db.students.deleteMany({active: false})\n  .deletedCount);\nprint(\"Missing delete: \" + db.students.deleteOne({_id: 999})\n  .deletedCount);\nprint(\"Remaining IDs: \" + JSON.stringify(db.students.find(\n  {}, {_id: 1}\n).sort({_id: 1}).toArray().map(x => x._id)));"}, "out": "Preview inactive: 2\ndeleteOne: 1\ndeleteMany: 1\nMissing delete: 0\nRemaining IDs: [1,2,3,5]", "expl": {"en": "<p>Only the selected scratch collection is changed. deletedCount is zero for an absent record. deleteMany({}) would remove every document in that collection, while drop removes the collection and its indexes. Preview a filter and confirm the active database before destructive work. A preview count is not a lock against concurrent changes.</p>"}}, {"id": "ns2p10", "title": {"en": "Embedded Address and Explicit Referenced-Course Lookup"}, "code": {"en": "// Run only in a fresh, disposable lab database.\nif (!db.getName().startsWith(\"di04000031_u2_\")) {\n  throw new Error(\"Select an isolated Unit 2 scratch database\");\n}\ndb.courses.insertOne({_id: \"C1\", title: \"MongoDB Basics\"});\ndb.learners.insertOne({\n  _id: \"L1\", name: \"Asha\",\n  address: {city: \"Surat\", pin: \"395001\"},\n  courseId: \"C1\"\n});\nconst learner = db.learners.findOne({_id: \"L1\"});\nconst course = db.courses.findOne({_id: learner.courseId});\nprint(\"Embedded city: \" + learner.address.city);\nprint(\"Referenced course: \" + course.title);\ndb.learners.insertOne({\n  _id: \"L2\", name: \"Ravi\", courseId: \"UNKNOWN\"\n});\nconst other = db.learners.findOne({_id: \"L2\"});\nconst missing = db.courses.findOne({_id: other.courseId});\nprint(\"Missing reference: \" + (missing === null));\nprint(\"Reference inserted: \" + db.learners.countDocuments({\n  _id: \"L2\"\n}));"}, "out": "Embedded city: Surat\nReferenced course: MongoDB Basics\nMissing reference: true\nReference inserted: 1", "expl": {"en": "<p>The bounded address is embedded because it is read with its learner. Shared course details are referenced by an ID and fetched explicitly. MongoDB does not automatically join these documents or enforce a relational foreign key: the missing course reference is accepted. Application logic must handle absence and define consistency rules. This is not a $lookup or multi-document transaction demo.</p>"}}, {"id": "ns2p11", "title": {"en": "Indexes, Forced Explain Comparison and Unique Email"}, "code": {"en": "// Run only in a fresh, disposable lab database.\nif (!db.getName().startsWith(\"di04000031_u2_\")) {\n  throw new Error(\"Select an isolated Unit 2 scratch database\");\n}\ndb.students.insertMany([\n  {_id: 1, name: \"Asha\", age: 19, city: \"Surat\",\n   marks: 82, active: true, skills: [\"MongoDB\", \"Python\"],\n   address: {state: \"Gujarat\", pin: \"395001\"}},\n  {_id: 2, name: \"Ravi\", age: 20, city: \"Bharuch\",\n   marks: 70, active: true, skills: [\"Java\"],\n   address: {state: \"Gujarat\", pin: \"392001\"}},\n  {_id: 3, name: \"Neha\", age: 18, city: \"Surat\",\n   marks: 92, active: true, skills: [\"MongoDB\", \"Java\"],\n   address: {state: \"Gujarat\", pin: \"395007\"}},\n  {_id: 4, name: \"Imran\", age: 21, city: \"Vadodara\",\n   marks: 65, active: false, skills: [\"Python\"],\n   address: {state: \"Gujarat\", pin: \"390001\"}},\n  {_id: 5, name: \"Meera\", age: 20, city: \"Surat\",\n   marks: 82, active: true, skills: [\"AI\", \"Python\"],\n   address: {state: \"Gujarat\", pin: \"395009\"}},\n  {_id: 6, name: \"Dev\", age: 19, city: \"Ahmedabad\",\n   marks: 50, active: false, skills: [],\n   address: {state: \"Gujarat\", pin: \"380001\"}}\n]);\n\nconst filter = {city: \"Surat\", marks: {$gt: 80}};\nconst scan = db.students.find(filter)\n  .hint({$natural: 1}).explain(\"executionStats\");\ndb.students.createIndex({city: 1, marks: -1}, {\n  name: \"city_marks\"\n});\nconst indexed = db.students.find(filter)\n  .hint(\"city_marks\").explain(\"executionStats\");\nprint(\"Scan returned/examined: \" +\n  scan.executionStats.nReturned + \"/\" +\n  scan.executionStats.totalDocsExamined);\nprint(\"Index returned/examined: \" +\n  indexed.executionStats.nReturned + \"/\" +\n  indexed.executionStats.totalDocsExamined);\nprint(\"Index keys examined: \" +\n  indexed.executionStats.totalKeysExamined);\nprint(\"Indexes: \" + db.students.getIndexes()\n  .map(x => x.name).sort().join(\",\"));\ndb.accounts.createIndex({email: 1}, {unique: true});\ndb.accounts.insertOne({_id: 1, email: \"asha@example.test\"});\nlet rejected = false;\ntry {\n  db.accounts.insertOne({_id: 2, email: \"asha@example.test\"});\n} catch (e) {\n  if (e.code !== 11000) throw e;\n  rejected = true;\n  print(\"Unique email error: \" + e.code);\n}\nif (!rejected) throw new Error(\"Expected duplicate email\");\nprint(\"Accounts: \" + db.accounts.countDocuments({}));"}, "out": "Scan returned/examined: 3/6\nIndex returned/examined: 3/3\nIndex keys examined: 3\nIndexes: _id_,city_marks\nUnique email error: 11000\nAccounts: 1", "expl": {"en": "<p>The two hints deliberately force a natural scan and the named compound index so a six-document lab can compare examined-document counters. This does not claim the optimizer would always choose the index, nor a guaranteed time speedup. The query returns the same three documents. A separate unique index rejects a duplicate email with server error 11000. Indexes cost storage and write work; case normalization/collation policy still needs design.</p>"}}, {"id": "ns2p12", "title": {"en": "Aggregation: $match, $group, $sum and $avg"}, "code": {"en": "// Run only in a fresh, disposable lab database.\nif (!db.getName().startsWith(\"di04000031_u2_\")) {\n  throw new Error(\"Select an isolated Unit 2 scratch database\");\n}\ndb.orders.insertMany([\n  {_id: 1, category: \"book\", status: \"paid\", amount: 200},\n  {_id: 2, category: \"book\", status: \"paid\", amount: 300},\n  {_id: 3, category: \"tool\", status: \"paid\", amount: 400},\n  {_id: 4, category: \"tool\", status: \"cancelled\", amount: 100},\n  {_id: 5, category: \"book\", status: \"paid\", amount: 100},\n  {_id: 6, category: \"tool\", status: \"paid\", amount: 600}\n]);\nconst summary = db.orders.aggregate([\n  {$match: {status: \"paid\"}},\n  {$group: {\n    _id: \"$category\", count: {$sum: 1},\n    total: {$sum: \"$amount\"}, average: {$avg: \"$amount\"}\n  }},\n  {$sort: {_id: 1}}\n]).toArray();\nprint(JSON.stringify(summary));\nprint(\"Source documents unchanged: \" +\n  db.orders.countDocuments({}));"}, "out": "[{\"_id\":\"book\",\"count\":3,\"total\":600,\"average\":200},{\"_id\":\"tool\",\"count\":2,\"total\":1000,\"average\":500}]\nSource documents unchanged: 6", "expl": {"en": "<p>$match keeps five paid orders from six inputs. $group produces two category summaries; $sum:1 counts documents and $sum:\"$amount\" adds their values. $avg computes the group average. \"$category\" is a field path, not a literal category name. $sort makes the output order deterministic. This read-only pipeline does not modify orders; integer demo amounts avoid floating-point currency claims.</p>"}}, {"id": "ns2p13", "title": {"en": "Practical 3 Mini-Catalog with Guarded Stock Update"}, "code": {"en": "// Run only in a fresh, disposable lab database.\nif (!db.getName().startsWith(\"di04000031_u2_\")) {\n  throw new Error(\"Select an isolated Unit 2 scratch database\");\n}\ndb.products.insertMany([\n  {_id: \"B101\", name: \"NoSQL Guide\", category: \"book\",\n   pricePaise: 25000, stock: 2, attributes: {pages: 320}},\n  {_id: \"E101\", name: \"Sensor Node\", category: \"electronics\",\n   pricePaise: 129900, stock: 5,\n   attributes: {sampleRateHz: 10}}\n]);\nprint(\"Books: \" + JSON.stringify(db.products.find(\n  {category: \"book\"}, {_id: 0, name: 1, pricePaise: 1}\n).sort({name: 1, _id: 1}).limit(5).toArray()));\nfor (let attempt = 1; attempt <= 3; attempt++) {\n  const r = db.products.updateOne({\n    _id: \"B101\", stock: {$gte: 1}\n  }, {$inc: {stock: -1}});\n  print(\"Sale \" + attempt + \" matched: \" + r.matchedCount);\n}\nprint(\"Final stock: \" + db.products.findOne({_id: \"B101\"})\n  .stock);\nprint(\"Missing delete: \" + db.products.deleteOne({\n  _id: \"UNKNOWN\"\n}).deletedCount);"}, "out": "Books: [{\"name\":\"NoSQL Guide\",\"pricePaise\":25000}]\nSale 1 matched: 1\nSale 2 matched: 1\nSale 3 matched: 0\nFinal stock: 0\nMissing delete: 0", "expl": {"en": "<p>A small product catalog combines different nested attributes with insert/find/sort/limit/projection/update/delete. Price is stored in integer paise for this lab. The filter and decrement occur in one atomic single-document update; after two successes the third attempt matches nothing, so stock does not go negative. This is not a transaction covering payment plus stock, a concurrency stress test, an AI model or a hosted application.</p>"}}, {"id": "ns2p14", "title": {"en": "Null/Missing, Type Mismatch and Rejected Query Shapes"}, "code": {"en": "// Run only in a fresh, disposable lab database.\nif (!db.getName().startsWith(\"di04000031_u2_\")) {\n  throw new Error(\"Select an isolated Unit 2 scratch database\");\n}\ndb.notes.insertMany([\n  {_id: 1, tag: null}, {_id: 2}, {_id: 3, tag: \"mongodb\"}\n]);\nconst ids = q => db.notes.find(q, {_id: 1})\n  .sort({_id: 1}).toArray().map(x => x._id);\nprint(\"Null equality: \" + JSON.stringify(ids({tag: null})));\nprint(\"Explicit null: \" + JSON.stringify(ids({\n  tag: {$type: 10}\n})));\nprint(\"Missing field: \" + JSON.stringify(ids({\n  tag: {$exists: false}\n})));\nprint(\"String ID matches: \" + JSON.stringify(ids({_id: \"1\"})));\nlet mixedRejected = false;\ntry {\n  db.notes.find({}, {tag: 1, other: 0}).toArray();\n} catch (e) {\n  mixedRejected = true;\n  print(\"Mixed projection rejected: \" + e.code);\n}\nif (!mixedRejected) throw new Error(\"Expected projection error\");\nlet updateRejected = false;\ntry {\n  db.notes.updateOne({_id: 1}, {tag: \"changed\"});\n} catch (e) {\n  updateRejected = true;\n  print(\"Non-operator update rejected: \" + e.name);\n}\nif (!updateRejected) throw new Error(\"Expected update error\");\nconst incoming = {$ne: null};\nprint(\"Selector-shaped input rejected: \" +\n  (typeof incoming !== \"string\"));"}, "out": "Null equality: [1,2]\nExplicit null: [1]\nMissing field: [2]\nString ID matches: []\nMixed projection rejected: 31254\nNon-operator update rejected: MongoInvalidArgumentError\nSelector-shaped input rejected: true", "expl": {"en": "<p>{tag:null} matches explicit null and missing fields; $type:10 selects BSON null and $exists:false selects absence. A string \"1\" does not match numeric _id:1. The server rejects mixed ordinary projection modes; mongosh rejects an update document without atomic operators for updateOne. Validate external scalar types and build an allowlisted filter rather than passing an arbitrary user-supplied selector object. The final check is a type-validation illustration, not a complete login/API implementation.</p>"}}], "diagrams": [{"id": "ns2_arch", "title": {"en": "Client, mongosh, mongod and Storage"}, "file": "diagrams/ns2_arch.svg"}, {"id": "ns2_hierarchy", "title": {"en": "Database, Collection, Document and Field"}, "file": "diagrams/ns2_hierarchy.svg"}, {"id": "ns2_bson", "title": {"en": "BSON Types and Identifier Type Matching"}, "file": "diagrams/ns2_bson.svg"}, {"id": "ns2_setup", "title": {"en": "Installation and Connection Evidence"}, "file": "diagrams/ns2_setup.svg"}, {"id": "ns2_crud", "title": {"en": "The Four CRUD Operations"}, "file": "diagrams/ns2_crud.svg"}, {"id": "ns2_filters", "title": {"en": "Filtering the Six-Student Fixture"}, "file": "diagrams/ns2_filters.svg"}, {"id": "ns2_query", "title": {"en": "Sort, Limit and Projection"}, "file": "diagrams/ns2_query.svg"}, {"id": "ns2_update", "title": {"en": "Matched versus Modified Updates"}, "file": "diagrams/ns2_update.svg"}, {"id": "ns2_model", "title": {"en": "Embedded Data versus References"}, "file": "diagrams/ns2_model.svg"}, {"id": "ns2_index", "title": {"en": "Explain Counters with Forced Plans"}, "file": "diagrams/ns2_index.svg"}, {"id": "ns2_pipeline", "title": {"en": "Aggregation from Six Orders to Two Groups"}, "file": "diagrams/ns2_pipeline.svg"}, {"id": "ns2_replica", "title": {"en": "Replication: Copies of the Same Dataset"}, "file": "diagrams/ns2_replica.svg"}, {"id": "ns2_shard", "title": {"en": "Sharding: Different Subsets and Routing"}, "file": "diagrams/ns2_shard.svg"}], "syntax": [{"title": {"en": "Architecture, Setup and BSON"}, "items": [{"name": {"en": "Server versus shell"}, "f": "mongod = database server\nmongosh = client shell\ndriver = application client library\nCompass = optional graphical client", "terms": {"en": "Record server and shell versions separately. A running client does not prove a reachable, authorized database."}}, {"name": {"en": "Terminal versus mongosh"}, "f": "OS terminal: mongod --version\nOS terminal: mongosh --version\nmongosh: db.runCommand({ping: 1})\nscript: db = db.getSiblingDB(\"scratch_name\")", "terms": {"en": "Interactive use/show helpers are not ordinary JavaScript for a .js file. Select a di04000031_u2_ scratch name for the supplied examples."}}, {"name": {"en": "BSON and identifier type"}, "f": "ObjectId(\"65a1b2c3d4e5f60718293040\")\nNumberInt(19)\nISODate(\"2026-01-15T00:00:00Z\")\n[\"MongoDB\", \"Python\"]\n{city: \"Surat\"}", "terms": {"en": "mongosh constructors are not strict JSON. A string with the same hexadecimal text is not an ObjectId value. _id need not always be an ObjectId."}}, {"name": {"en": "Database and collection creation"}, "f": "use di04000031_u2_manual\ndb.createCollection(\"students\")\n// Or first insert creates an ordinary collection.\ndb.students.insertOne({_id: 1, name: \"Asha\"})", "terms": {"en": "The first line is an interactive helper. Selecting a database alone does not persist an empty database. Run each independent demo in a fresh authorized scratch database."}}]}, {"title": {"en": "Insert and Read"}, "items": [{"name": {"en": "Insert results"}, "f": "insertOne(document)\ninsertMany([document1, document2])\ncheck: acknowledged + inserted IDs\nduplicate unique key -> error 11000", "terms": {"en": "The program inserts one then two students; the duplicate is rejected and three remain. A batch is not automatically a multi-document transaction."}}, {"name": {"en": "Comparison and logical filters"}, "f": "{marks: {$gt: 80}}\n{marks: {$lt: 70}}\n{city: {$in: [\"Surat\", \"Bharuch\"]}}\n{$and: [condition1, condition2]}\n{$or: [condition1, condition2]}", "terms": {"en": "Reference filter shapes: supply concrete condition documents. $gt/$lt exclude equality; ordinary different-field conditions are implicitly ANDed."}}, {"name": {"en": "Sort, limit and projection"}, "f": "db.students.find({}, {_id: 0, name: 1, marks: 1})\n  .sort({marks: -1, _id: 1})\n  .limit(3).toArray()", "terms": {"en": "Descending marks plus an ascending unique tie-breaker gives stable ranking. Projection shapes the returned fields; it is not a write or a permission check."}}, {"name": {"en": "Nested and array queries"}, "f": "{\"address.pin\": \"395001\"}\n{skills: \"MongoDB\"}\n{skills: {$in: [\"Python\", \"Java\"]}}", "terms": {"en": "A scalar array condition can match an array element. Dot notation targets one embedded field; whole-object equality has different semantics."}}]}, {"title": {"en": "Updates, Deletes and Pitfalls"}, "items": [{"name": {"en": "Partial update and counts"}, "f": "updateOne(filter, {$set: {city: \"Surat\"}})\nupdateMany(filter, {$inc: {marks: 2}})\nmatched 1 / modified 0 = possible no-op\nmatched 0 / modified 0 = no match", "terms": {"en": "Reference signatures require a real filter document. One-document atomicity does not make every multi-document operation one transaction."}}, {"name": {"en": "Upsert versus replacement"}, "f": "updateOne(filter, {$set: fields}, {upsert: true})\nreplaceOne(filter, replacementDocument)\nreplacement removes omitted non-_id fields", "terms": {"en": "These are reference signatures, not standalone scripts. Upsert explicitly permits insertion; a stable unique key and correct filter still matter."}}, {"name": {"en": "Deletion scope"}, "f": "deleteOne(filter) -> at most one\ndeleteMany(filter) -> all matches\ndeleteMany({}) -> all collection documents\ncollection.drop() -> collection + indexes", "terms": {"en": "The arrow lines summarize behaviour, not executable JavaScript. Check deletedCount and the active scratch context before destructive work."}}, {"name": {"en": "Null, missing and projection"}, "f": "{tag: null} -> explicit null OR missing\n{tag: {$type: 10}} -> explicit BSON null\n{tag: {$exists: false}} -> field absent\n{_id: 0, name: 1} -> allowed inclusion form", "terms": {"en": "Reference summaries, not standalone programs. Do not mix ordinary included/excluded fields. The null fixture returns IDs [1,2], [1], and [2]."}}]}, {"title": {"en": "Modeling, Indexes, Aggregation and Distribution"}, "items": [{"name": {"en": "Embed or reference"}, "f": "embed: bounded data read together\nreference: shared / independently managed data\nreference lookup can return null\nno automatic relational foreign key", "terms": {"en": "Avoid unbounded embedded histories. Define missing-reference handling and the consistency boundary explicitly."}}, {"name": {"en": "Basic index and explain"}, "f": "db.students.createIndex(\n  {city: 1, marks: -1}, {name: \"city_marks\"}\n)\nfind(filter).hint(\"city_marks\")\n  .explain(\"executionStats\")", "terms": {"en": "Reference query shape: use db.students.find(filter) with a real filter. Hints force the teaching comparison; examined counters are not a guaranteed timing speedup."}}, {"name": {"en": "Aggregation group"}, "f": "{$match: {status: \"paid\"}}\n{$group: {\n  _id: \"$category\", count: {$sum: 1},\n  total: {$sum: \"$amount\"}, avg: {$avg:
