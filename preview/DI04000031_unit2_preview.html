\"$amount\"}\n}}", "terms": {"en": "Individual stage shapes belong in an aggregate([...]) pipeline. $sum:1 counts documents; \"$amount\" is a field path. Sort for deterministic group output."}}, {"name": {"en": "Replication versus sharding"}, "f": "replication: copies of the same dataset\nsharding: different subsets across shards\nmongos: query routing for a sharded cluster\nthis unit: concepts only, no cluster setup", "terms": {"en": "The real examples ran on a standalone server. Replication is not an independent backup; key choice and settings affect distributed behaviour."}}]}], "viva": [{"title": {"en": "Foundations and Practical Setup"}, "items": [{"q": {"en": "What is MongoDB’s main data model?"}, "a": {"en": "Documents grouped in collections, stored as BSON within databases."}}, {"q": {"en": "mongod versus mongosh?"}, "a": {"en": "mongod is the database server; mongosh is a client shell that connects to it. Installing one does not prove the other is working."}}, {"q": {"en": "What does a driver do?"}, "a": {"en": "It lets application code communicate with MongoDB using a supported language API; it is a client, not the storage server."}}, {"q": {"en": "Is Compass required for these programs?"}, "a": {"en": "No. It is an optional graphical client. The reference uses mongosh and a real mongod server."}}, {"q": {"en": "What versions and platform were actually tested?"}, "a": {"en": "MongoDB Community Server 9.0.4 and mongosh 2.14.0 on Debian 13 x86_64, with a private authenticated standalone instance."}}, {"q": {"en": "Does mongosh --version prove database connectivity?"}, "a": {"en": "No. It proves the shell executable is available. Record server connectivity and an authorized write/read round-trip as well."}}, {"q": {"en": "Does a successful ping prove read/write authorization?"}, "a": {"en": "No. A ping is a liveness/connectivity check, not proof of permission to access application data."}}, {"q": {"en": "What is the database/collection/document hierarchy?"}, "a": {"en": "A database groups collections; an ordinary collection stores documents; each document contains named field/value pairs."}}, {"q": {"en": "Does use databaseName immediately persist an empty database?"}, "a": {"en": "No. It selects a client context; createCollection or a first write materializes storage."}}, {"q": {"en": "Why is BSON more than JSON text?"}, "a": {"en": "It is a typed binary representation with additional types such as ObjectId and Date, not just a JSON character string."}}, {"q": {"en": "Must every _id be an ObjectId?"}, "a": {"en": "No. The lab also uses integer and string IDs. In an ordinary collection _id must be unique and is immutable; omitting it normally generates an ObjectId."}}, {"q": {"en": "Why can an ObjectId lookup fail when given matching hex text?"}, "a": {"en": "A plain string containing the hex text is not an ObjectId value. Construct the correct type for the stored identifier."}}]}, {"title": {"en": "Insert, Find and Query Shaping"}, "items": [{"q": {"en": "What does insertOne return that should be checked?"}, "a": {"en": "Acknowledgment and the inserted identifier; do not assume a write succeeded merely because a command was typed."}}, {"q": {"en": "What does duplicate-key error 11000 mean here?"}, "a": {"en": "A unique index, such as _id or the explicit email index, rejected a duplicate value. Catch that expected case and do not swallow unrelated failures."}}, {"q": {"en": "Is insertMany an automatic all-or-nothing transaction?"}, "a": {"en": "No. A batch error can leave some documents inserted. Examine the actual result and stored state before retrying."}}, {"q": {"en": "find versus findOne?"}, "a": {"en": "find returns a cursor over matching documents; findOne returns one document or null. A cursor is not automatically a full array."}}, {"q": {"en": "Why use toArray in these small demos?"}, "a": {"en": "It materializes a small bounded result so JSON output is reproducible. Do not materialize unbounded production results into client memory."}}, {"q": {"en": "What do $gt and $lt mean?"}, "a": {"en": "Strictly greater than and strictly less than; they exclude equality. Use an inclusive comparison when the boundary must match."}}, {"q": {"en": "What does $in test?"}, "a": {"en": "Whether a field value, or an element of an array field, matches at least one value in the supplied list."}}, {"q": {"en": "$and versus $or?"}, "a": {"en": "$and requires all listed conditions; $or requires at least one. Ordinary conditions on different fields are implicitly ANDed."}}, {"q": {"en": "What IDs have marks greater than 80 in the fixture?"}, "a": {"en": "1, 3 and 5: Asha 82, Neha 92 and Meera 82."}}, {"q": {"en": "Why sort by marks:-1 and _id:1?"}, "a": {"en": "Descending marks gives rank, and the unique ascending ID breaks the 82-mark tie deterministically."}}, {"q": {"en": "What does a projection control?"}, "a": {"en": "Which fields are returned. It does not modify stored records or implement field-level authorization."}}, {"q": {"en": "Can inclusion and exclusion be mixed in a basic projection?"}, "a": {"en": "Not for ordinary fields. The special _id exclusion may accompany inclusion, as in {_id:0,name:1}."}}, {"q": {"en": "How is a nested pin queried?"}, "a": {"en": "Use quoted dot notation, for example {\"address.pin\":\"395001\"}, rather than an unintended whole-address equality match."}}, {"q": {"en": "Why is address:{pin:\"395001\"} not equivalent in this fixture?"}, "a": {"en": "The stored object also includes state; the shorter object is not an exact whole-object match, while dot notation targets just pin."}}]}, {"title": {"en": "Update, Delete and Negative Cases"}, "items": [{"q": {"en": "What does $set do?"}, "a": {"en": "Assigns specified field values without replacing the entire document; unrelated fields remain."}}, {"q": {"en": "What does $inc do?"}, "a": {"en": "Increments a numeric field by the supplied amount; -1 can decrement stock in a guarded update."}}, {"q": {"en": "matchedCount versus modifiedCount?"}, "a": {"en": "Matched counts documents satisfying the filter; modified counts documents whose stored values actually changed. A matched no-op can be 1/0."}}, {"q": {"en": "What happens when updateOne matches nothing by default?"}, "a": {"en": "Nothing is updated and no document is inserted. The result reports zero matches/changes unless an explicit upsert is requested."}}, {"q": {"en": "What does upsert:true permit?"}, "a": {"en": "Insert a document if none matches; otherwise update a match. Use a deliberate filter and stable unique business/ID key."}}, {"q": {"en": "Why did replaceOne remove Jai’s city?"}, "a": {"en": "The replacement omitted city, so it was removed. The existing _id was retained because it was omitted rather than changed."}}, {"q": {"en": "Is updateMany automatically atomic across every document?"}, "a": {"en": "No. Each single-document modification is atomic, but the entire multi-document operation is not automatically one transaction."}}, {"q": {"en": "What does deletedCount:0 mean?"}, "a": {"en": "No matching document was deleted; the target may simply have been absent."}}, {"q": {"en": "deleteMany({}) versus collection.drop()?"}, "a": {"en": "The former removes all documents in the selected collection; the latter removes the collection and its indexes."}}, {"q": {"en": "What does {tag:null} match?"}, "a": {"en": "Documents with explicit null and documents where the field is missing. Use $type:10 for BSON null or $exists:false for absence."}}, {"q": {"en": "Why reject an externally supplied selector object?"}, "a": {"en": "An object such as {$ne:null} is not the scalar value expected by a field. Validate types/ranges, authorize the action and build allowed query shapes yourself."}}, {"q": {"en": "Does the stock demo include payment and a concurrency stress test?"}, "a": {"en": "No. It demonstrates sequential guarded single-document updates: two successes, a zero-match third attempt and final stock zero. Payment transactions and concurrent load testing are separate."}}]}, {"title": {"en": "Modeling, Indexes and Aggregation"}, "items": [{"q": {"en": "When is embedding a good starting choice?"}, "a": {"en": "Bounded related data, such as an address, is commonly read with its parent and fits the intended one-document consistency boundary."}}, {"q": {"en": "When are references useful?"}, "a": {"en": "Shared or independently managed entities, high-cardinality relationships and data that should not grow without bounds inside one parent document."}}, {"q": {"en": "Does storing courseId enforce a relational foreign key?"}, "a": {"en": "No. The reference fixture accepts UNKNOWN and the explicit course lookup returns null. The application must handle missing related data."}}, {"q": {"en": "What does an index help with?"}, "a": {"en": "A suitable index can reduce query work and may support ordering; it costs storage and maintenance during writes."}}, {"q": {"en": "What is a compound index?"}, "a": {"en": "An index on multiple fields, such as {city:1,marks:-1}. Field order and actual access patterns matter."}}, {"q": {"en": "Why were hints used for the index demonstration?"}, "a": {"en": "To force a natural scan and a named index on a tiny six-document fixture, making the examined-document comparison controlled rather than claiming the optimizer always chooses one plan."}}, {"q": {"en": "What were the observed examined counters?"}, "a": {"en": "Both plans returned three documents; the forced scan examined six documents, while the forced city_marks index examined three documents and three index keys."}}, {"q": {"en": "Does that prove a guaranteed timing speedup?"}, "a": {"en": "No. Data, query, cache state, plan and version matter. The demo reports work counters, not a promised wall-clock multiplier."}}, {"q": {"en": "What is an aggregation pipeline?"}, "a": {"en": "A sequence of stages that process documents; output from one stage becomes input to the next, and counts/shapes may change."}}, {"q": {"en": "$sum:1 versus $sum:\"$amount\"?"}, "a": {"en": "The first adds one per group input, counting documents; the second adds each input document’s numeric amount field."}}, {"q": {"en": "What are the two paid-order group results?"}, "a": {"en": "book: count 3, total 600, average 200; tool: count 2, total 1000, average 500. One cancelled order is excluded."}}, {"q": {"en": "Does the reference aggregation change its source orders?"}, "a": {"en": "No. The read-only pipeline leaves six source documents unchanged; it has no explicit write stage."}}]}, {"title": {"en": "Distribution Concepts and Practical Evidence"}, "items": [{"q": {"en": "Replication versus sharding?"}, "a": {"en": "Replication maintains copies of the same dataset; sharding distributes different data subsets. A sharded system can use replica sets for its shards."}}, {"q": {"en": "What do primary and secondaries mean in the basic replica-set picture?"}, "a": {"en": "The primary receives writes; secondaries replicate changes and may lag. An eligible member can become primary after an election, which can interrupt service."}}, {"q": {"en": "Why is replication not a replacement for backups?"}, "a": {"en": "Unwanted deletion or corruption can propagate to replicas. Independent backups and tested restoration remain necessary."}}, {"q": {"en": "What do mongos and a shard key do conceptually?"}, "a": {"en": "mongos routes requests in a sharded cluster; a shard key influences placement and routing. Bad key choices can create hotspots or broad queries."}}, {"q": {"en": "Were replica sets, sharding or failover configured/tested in this unit?"}, "a": {"en": "No. The syllabus requests a conceptual overview only, and all real programs ran on a standalone server."}}, {"q": {"en": "What should the Practical 2/3 journal and assessment statement include?"}, "a": {"en": "Actual installation/version/connectivity and CRUD evidence, input/output and negative cases, design reasoning and safe cleanup. This course has practical PA 20 + ESE 30, no theory ESE/PA; revision tasks are not an official theory paper."}}]}], "exam_questions": [], "learning_outcomes": [{"en": "Apply MongoDB features for effective data modeling and management (CO2)."}], "practical_numbers": [2, 3], "content_kind": "real_mongodb_practical", "lesson_count": 20, "practice_task_count": 18, "runtime_evidence": {"server": "MongoDB Community Server", "server_version": "9.0.4", "shell": "mongosh", "shell_version": "2.14.0", "os": "Debian 13 x86_64", "authenticated": true, "mode": "standalone", "public_database_endpoint": false, "replication_configured": false, "sharding_configured": false, "programs_executed": 14, "output_origin": "Captured from exact displayed scripts on real mongod via mongosh"}, "assessment_note": {"en": "Practical PA 20 + practical ESE 30 = 50; theory ESE/PA are 0. No per-question theory marks are assigned."}, "sources": [{"title": "GTU DI04000031 syllabus (2025-26)", "url": "https://s3-ap-southeast-1.amazonaws.com/gtusitecirculars/Syallbus/DI04000031.pdf"}, {"title": "MongoDB Community installation by OS", "url": "https://www.mongodb.com/docs/manual/installation/"}, {"title": "Official Linux installation: select Debian / your distribution", "url": "https://www.mongodb.com/docs/manual/administration/install-community-linux/"}, {"title": "Install mongosh", "url": "https://www.mongodb.com/docs/mongodb-shell/install/"}, {"title": "MongoDB documents and BSON", "url": "https://www.mongodb.com/docs/manual/core/document/"}, {"title": "MongoDB CRUD", "url": "https://www.mongodb.com/docs/manual/crud/"}, {"title": "Projection rules", "url": "https://www.mongodb.com/docs/manual/tutorial/project-fields-from-query-results/"}, {"title": "Embedding and references", "url": "https://www.mongodb.com/docs/manual/data-modeling/best-practices/"}, {"title": "Indexes", "url": "https://www.mongodb.com/docs/manual/indexes/"}, {"title": "Aggregation pipelines", "url": "https://www.mongodb.com/docs/manual/core/aggregation-pipeline/"}, {"title": "Replication concepts", "url": "https://www.mongodb.com/docs/manual/replication/"}, {"title": "Sharding concepts", "url": "https://www.mongodb.com/docs/manual/sharding/"}]};

/><text x=\"34\" y=\"126.2\" font-size=\"12\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">_id</text><text x=\"160\" y=\"126.2\" font-size=\"12\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">ObjectId</text><text x=\"34\" y=\"153.2\" font-size=\"12\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">name</text><text x=\"160\" y=\"153.2\" font-size=\"12\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">String</text><text x=\"34\" y=\"180.2\" font-size=\"12\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">age</text><text x=\"160\" y=\"180.2\" font-size=\"12\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">Int32</text><text x=\"34\" y=\"207.2\" font-size=\"12\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">skills</text><text x=\"160\" y=\"207.2\" font-size=\"12\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">Array</text><text x=\"34\" y=\"234.2\" font-size=\"12\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">address</text><text x=\"160\" y=\"234.2\" font-size=\"12\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">Embedded document</text><text x=\"34\" y=\"261.2\" font-size=\"12\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">active</text><text x=\"160\" y=\"261.2\" font-size=\"12\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">Boolean</text><text x=\"34\" y=\"288.2\" font-size=\"12\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">joined</text><text x=\"160\" y=\"288.2\" font-size=\"12\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">Date</text><text x=\"34\" y=\"315.2\" font-size=\"12\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">score</text><text x=\"160\" y=\"315.2\" font-size=\"12\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">Double</text><rect x=\"18\" y=\"365\" width=\"324\" height=\"65\" rx=\"9\" fill=\"#FFF4DF\" stroke=\"#AA5C00\" stroke-width=\"1.4\"/><text x=\"18 }
const progBody = p => `<div class="pl">${L('code')}</div><pre class="code">${hl(t(p.code))}</pre><div class="pl">${L('output')}</div><pre class="out">${esc(p.out)}</pre>${p.plot?`<div class="pl">${L('plot')}</div>`+dgInline(p.plot).replace('class="dg"','class="dg pg"'):''}${p.expl?`<div class="pl">${L('expl')}</div>${fixTables(t(p.expl))}`:''}`;
const pBox = id => { const p=(U.programs||[]).find(x=>x.id===id); if(!p) return ''; return `<div class="pbox"><div class="et">${L('prog')}: ${t(p.title)}</div>${progBody(p)}</div>`; };
const exBox = id => { const n=(U.numericals||[]).find(x=>x.id===id); if(!n) return ''; return `<div class="ex"><div class="et">${L('ex')}</div><div class="eq2">${t(n.q)}</div>${fixTables(t(n.a))}</div>`; };
function notes(){
  let h = `<div class="intro"><b>${t(U.title)}</b><div>${L('unit')} ${U.unit} · ${U.weightage}% ${L('intro')} · ${U.hours} ${L('hours')}</div><div>${U.intro_text ? t(U.intro_text) : L(U.programs?(META.code_lang==='python'?'intropy':'introc'):'introd')}</div></div>`;
  U.notes.forEach((sec,si)=>{
    h += `<div class="sec">${head(t(sec.title))}`;
    sec.items.forEach((it,i)=>{
      const open = si===0&&i===0 ? ' open' : '';
      if (it.h) {
        h += `<div class="card${it.key?' key':''}${open}"><div class="q hd"><span class="t">${it.key?'⭐ ':''}${t(it.h)}</span>${chev}</div>
        <div class="a rn" style="padding-left:18px">${fixTables(t(it.body)).replace(/margin:0 0 10px -36px/g,'')}${it.diagram?dgInline(it.diagram):''}${(it.examples||[]).map(exBox).join('')}${(it.programs||[]).map(pBox).join('')}</div></div>`;
      } else {
        h += `<div class="card${open}"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(it.q)}</span>${chev}</div>
        <div class="a">${fixTables(t(it.a))}${it.diagram?dgInline(it.diagram):''}</div></div>`;
      }
    });
    h += `</div>`;
  });
  return h;
}
function numericals(){
  return `<div class="sec">${head(L('numericals'))}` + (U.numericals||[]).map((n,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(n.q)}</span>${chev}</div><div class="a">${fixTables(t(n.a))}</div></div>`).join('') + `</div>`;
}
function diagrams(){
  return `<div class="sec">${head(L((U.tabs ? U.tabs.includes('flowcharts')&&!U.tabs.includes('diagrams') : U.programs&&META.code_lang!=='python')?'flowcharts':'diagrams'),false)}<div style="height:10px"></div>` + U.diagrams.map((d,i)=>
    `<div class="dcard" data-dg="${d.id}"><div class="h">${i+1}. ${t(d.title)}</div>${SVG[d.id]}</div>`).join('') + `</div>`;
}
function equations(){
  return U.equations.map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><span class="fbox">${e.f}</span></span>${chev}</div>
     <div class="a"><p>${t(e.terms)}</p></div></div>`).join('') + `</div>`).join('');
}
function viva(){
  return U.viva.map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((v,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(v.q)}</span>${chev}</div><div class="a"><p>${t(v.a)}</p></div></div>`).join('') + `</div>`).join('');
}
function exam(){
  return `<div class="sec">${head(L('examhead'),false)}` + U.exam_questions.map((x,i)=>
    `<div class="card"><div class="q" style="cursor:default"><span class="n">${i+1}.</span><span class="t">${t(x.q)}</span><span class="mk">${x.marks} ${L('marks')}</span></div></div>`).join('') + `</div>`;
}
function programs(){
  return `<div class="sec">${head(L('programs'))}` + (U.programs||[]).map((p,i)=>
    `<div class="card"><div class="q hd"><span class="n">${i+1}.</span><span class="t">${t(p.title)}</span>${chev}</div><div class="a pa">${progBody(p)}</div></div>`).join('') + `</div>`;
}
function syntax(key){
  return (U[typeof key==='string'?key:'syntax']||[]).map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><pre class="code sx">${hl(e.f)}</pre></span>${chev}</div>
     <div class="a">${e.terms && t(e.terms) ? fixTables(t(e.terms)) : ''}</div></div>`).join('') + `</div>`).join('');
}
const flowcharts = diagrams;
const algorithms = () => syntax('algorithms');
const ALLV = {notes, programs, diagrams, flowcharts, algorithms, syntax, equations, numericals, viva, exam};
const VIEWS = U.tabs ? Object.fromEntries(U.tabs.map(k=>[k, ALLV[k]])) : U.programs ? (META.code_lang==='python' ? {notes, programs, diagrams, syntax, viva, exam} : {notes, programs, flowcharts, syntax, viva, exam}) : U.numericals ? {notes, diagrams, equations, numericals, viva, exam} : {notes, diagrams, equations, viva, exam};
function render(){
  document.getElementById('title').textContent = `${L('unit')} ${U.unit}: ${t(U.title)}`;
  document.getElementById('sub').textContent = `${t(META.name)} · ${META.code}`;
  document.getElementById('lang').textContent = S.lang==='en' ? 'ગુ' : 'EN';
  document.getElementById('lang').style.display = META.languages.includes('gu') ? '' : 'none';
  document.getElementById('tabs').innerHTML = Object.keys(VIEWS).map(k=>`<button class="tab${S.tab===k?' on':''}" data-tab="${k}">${L(k)}</button>`).join('');
  document.getElementById('view').innerHTML = VIEWS[S.tab]();
  document.querySelectorAll('#view pre.c').forEach(e=>{ e.innerHTML = hl(e.textContent); e.className='code'; });
}
let zoom = 1;
function setZoom(z){ zoom = Math.min(4, Math.max(1, z)); const w=document.getElementById('zw'); w.style.width=(zoom*100)+'%'; document.getElementById('zr').textContent=Math.round(zoom*100)+'%'; }
document.addEventListener('click', e=>{
  const q = e.target.closest('.q'); if (q && q.parentElement.querySelector('.a')) { q.parentElement.classList.toggle('open'); return; }
  const tb = e.target.closest('[data-tab]'); if (tb){ S.tab = tb.dataset.tab; render(); window.scrollTo(0,0); return; }
  if (e.target.closest('#lang')){ S.lang = S.lang==='en'?'gu':'en'; render(); return; }
  const m = e.target.closest('[data-more]');
  document.querySelectorAll('.menu.show').forEach(x=>{ if(!m || x!==m.nextElementSibling) x.classList.remove('show'); });
  if (m){ m.nextElementSibling.classList.toggle('show'); return; }
  const act = e.target.closest('[data-act]');
  if (act){ act.closest('.sec').querySelectorAll('.card').forEach(c=>{ if(c.querySelector('.a')) c.classList.toggle('open', act.dataset.act==='expand'); }); act.parentElement.classList.remove('show'); return; }
  const dg = e.target.closest('[data-dg]');
  if (dg){ const id=dg.dataset.dg; document.getElementById('mt').textContent=t(U.diagrams.find(d=>d.id===id).title); document.getElementById('zw').innerHTML=SVG[id]; setZoom(1); document.getElementById('modal').classList.add('show'); return; }
  if (e.target.closest('#mx')) document.getElementById('modal').classList.remove('show');
  if (e.target.closest('#zi')) setZoom(zoom+0.5);
  if (e.target.closest('#zo')) setZoom(zoom-0.5);
  if (e.target.closest('#zr')) setZoom(1);
});
render();
</script></body></html>
