<script>
const U = {"subject": "DI01000021", "unit": 2, "format": "notes", "title": {"en": "Trigonometry"}, "hours": 12, "weightage": 20, "official": true, "languages": ["en"], "tabs": ["notes", "diagrams", "equations", "numericals", "viva", "exam"], "intro_text": {"en": "Unit 2 of Mathematics-I: angles in degrees and radians with arc length, sector area and angular speed; the six trigonometric functions and the ASTC signs; allied angles; compound angles sin(A ± B), cos(A ± B) and tan(A ± B); multiple and submultiple (double, half and triple) angles; the graphs of sine and cosine with amplitude, period and phase; the sum and factor formulae in both directions; and inverse trigonometric functions with their principal ranges. Twenty-six fully solved numericals, every one linked to a card."}, "notes": [{"title": {"en": "1. Angles and their Measurement"}, "items": [{"h": {"en": "1.1 Degree and radian measure"}, "body": {"en": "<h4>Definition</h4><p>An angle is the amount of rotation from an initial arm to a terminal arm. The two <b>units of angles</b> are the <b>degree</b> (one full turn = 360°) and the <b>radian</b> (one full turn = 2π); the same rotation gives the same angle in either unit.</p><h4>The conversion</h4><p><b>π radians = 180°</b>, so <b>radians = degrees × π/180</b> and <b>degrees = radians × 180/π</b>. One radian is about 57.3°.</p><h4>Angles you should know instantly</h4><table><tr><th>Degrees</th><th>0°</th><th>30°</th><th>45°</th><th>60°</th><th>90°</th><th>180°</th><th>360°</th></tr><tr><td>Radians</td><td>0</td><td>π/6</td><td>π/4</td><td>π/3</td><td>π/2</td><td>π</td><td>2π</td></tr></table><h4>Why radians</h4><p>A radian is defined by arc length: 1 radian subtends an arc equal to the radius. That is why arc length, sector area and angular speed formulas only work when θ is in radians - and why calculus in later semesters uses radians only.</p>"}, "diagram": "t1_deg_rad", "examples": ["t1n1"], "syllabus_item": "2.1"}, {"h": {"en": "1.2 Arc length and area of a sector"}, "body": {"en": "<h4>Formulae</h4><p>For a circle of radius r and an angle θ <b>in radians</b>:</p><p><b>arc length s = rθ</b> and <b>sector area A = ½ r²θ</b>.</p><h4>Derivation</h4><p>A full turn is 2π radians and its arc is the circumference 2πr. So a fraction θ/2π of the circle has arc (θ/2π)(2πr) = rθ. The full area is πr², so the same fraction gives (θ/2π)(πr²) = ½r²θ. Both formulas are proportions - nothing new is memorised.</p><h4>Common mistake / conditions</h4><p>Substituting degrees directly gives nonsense: for θ = 60° and r = 7, rθ = 420, which is far larger than the whole circumference. Convert to π/3 first, then s = 7π/3 ≈ 7.33 cm.</p>"}, "examples": ["t1n2"], "syllabus_item": "2.1"}, {"h": {"en": "1.3 Angular speed and linear speed"}, "body": {"en": "<h4>Definition</h4><p><b>Angular speed</b> ω is the angle swept per second (rad/s); <b>linear speed</b> v is the distance travelled per second along the circle. They are linked by <b>v = rω</b>.</p><h4>Conversions</h4><ul><li>1 revolution = 2π radians, so rpm × 2π/60 gives rad/s.</li><li>1 rad/s at radius r gives v = r m/s with r in metres.</li><li>Frequency f (revolutions per second) gives ω = 2πf.</li></ul><h4>Worked example</h4><p>A wheel of radius 30 cm turns at 300 rpm. ω = 300 × 2π/60 = 10π ≈ 31.42 rad/s, so v = 0.30 × 31.42 ≈ <b>9.42 m/s</b>. Doubling the radius doubles the rim speed at the same rpm - the reason a larger wheel covers more ground per turn.</p>"}, "examples": ["t1n3"], "syllabus_item": "2.1"}]}, {"title": {"en": "2. Trigonometric Functions"}, "items": [{"h": {"en": "2.1 The six ratios, from triangle to unit circle"}, "body": {"en": "<h4>Definition</h4><p>In a right triangle, for an acute angle θ: sin θ = opposite/hypotenuse, cos θ = adjacent/hypotenuse, tan θ = opposite/adjacent, with cosec, sec and cot as their reciprocals.</p><h4>The unit-circle definition</h4><p>Take a point P(x, y) on the circle of radius 1 at angle θ from the positive x-axis. Then <b>cos θ = x</b>, <b>sin θ = y</b> and tan θ = y/x. This extends the ratios to every angle, including obtuse, negative and reflex angles, because x and y carry signs.</p><h4>Signs are automatic here</h4><p>A point in the second quadrant has x &lt; 0, so cos θ &lt; 0 there while sin θ &gt; 0. You do not need a rule to remember - just picture the point.</p>"}, "diagram": "t2_quadrants", "examples": ["t1n4"], "syllabus_item": "2.2"}, {"h": {"en": "2.2 Signs in the four quadrants"}, "body": {"en": "<h4>Definition</h4><p>The <b>ASTC rule</b> (All, Sin, Tan, Cos) says which functions are positive in each quadrant, counting anticlockwise from the positive x-axis.</p><table><tr><th>Quadrant</th><th>Angle range</th><th>Positive functions</th><th>Memory line</th></tr><tr><td>I</td><td>0° to 90°</td><td>all six</td><td>All</td></tr><tr><td>II</td><td>90° to 180°</td><td>sin and cosec</td><td>Silver</td></tr><tr><td>III</td><td>180° to 270°</td><td>tan and cot</td><td>Tea</td></tr><tr><td>IV</td><td>270° to 360°</td><td>cos and sec</td><td>Cups</td></tr></table><h4>Reading it from the circle</h4><p>In Q II the x-coordinate is negative and y positive, so only sin (= y) is positive. In Q III both are negative, so their ratio tan is positive. In Q IV x is positive, so cos is positive.</p><h4>Common mistake / conditions</h4><p>tan θ is undefined at 90° and 270° (the point has x = 0, so y/x divides by zero), and cot θ, cosec θ, sec θ are undefined wherever their own denominators vanish. State the excluded angles when the question asks for the domain.</p>"}, "diagram": "t2_quadrants", "examples": ["t1n4"], "syllabus_item": "2.2"}, {"h": {"en": "2.3 The standard-angle table"}, "body": {"en": "<h4>Definition</h4><p>Five angles carry almost every numerical in this unit. Learn the table and you can evaluate any allied angle without a calculator.</p><table><tr><th>θ</th><th>0°</th><th>30°</th><th>45°</th><th>60°</th><th>90°</th></tr><tr><td>sin θ</td><td>0</td><td>1/2</td><td>1/√2</td><td>√3/2</td><td>1</td></tr><tr><td>cos θ</td><td>1</td><td>√3/2</td><td>1/√2</td><td>1/2</td><td>0</td></tr><tr><td>tan θ</td><td>0</td><td>1/√3</td><td>1</td><td>√3</td><td>not defined</td></tr></table><h4>Pattern worth noticing</h4><p>sin runs 0, 1/2, 1/√2, √3/2, 1 - the values are √0/2, √1/2, √2/2, √3/2, √4/2. cos is the same list reversed, which is why sin 30° = cos 60°.</p><h4>Conditions</h4><p>tan 90° is undefined, not infinite; write \"not defined\" in an exam. The table is for exact values - use decimals only when a question asks for them.</p>"}, "examples": ["t1n5"], "syllabus_item": "2.2"}, {"h": {"en": "2.4 The three fundamental identities"}, "body": {"en": "<h4>Identities</h4><p><b>sin²θ + cos²θ = 1</b>,  <b>1 + tan²θ = sec²θ</b>,  <b>1 + cot²θ = cosec²θ</b>.</p><h4>Where the first one comes from</h4><p>On the unit circle P(x, y) has x² + y² = 1 by Pythagoras, and x = cos θ, y = sin θ. Divide that same equation by cos²θ and you get the second identity; divide by sin²θ and you get the third. One equation produces all three.</p><h4>How they are used</h4><p>To turn a sum into a single term: 1 − sin²θ = cos²θ; to simplify a fraction; and to find the third ratio from one given value plus a quadrant. Given sin θ = 3/5 with θ in Q II, cos²θ = 1 − 9/25 = 16/25, so cos θ = −4/5 (negative because the quadrant says so).</p>"}, "examples": ["t1n6"], "syllabus_item": "2.2"}]}, {"title": {"en": "3. Allied Angles"}, "items": [{"h": {"en": "3.1 The allied-angle rules"}, "body": {"en": "<h4>Definition</h4><p>Allied angles are built from θ using 180°, 360° and the negative sign. Two steps always work: decide the <b>sign</b> from the quadrant, then use θ itself as the angle.</p><table><tr><th>Angle</th><th>sin</th><th>cos</th><th>tan</th></tr><tr><td>−θ</td><td>−sin θ</td><td>cos θ</td><td>−tan θ</td></tr><tr><td>90° − θ</td><td>cos θ</td><td>sin θ</td><td>cot θ</td></tr><tr><td>90° + θ</td><td>cos θ</td><td>−sin θ</td><td>−cot θ</td></tr><tr><td>180° − θ</td><td>sin θ</td><td>−cos θ</td><td>−tan θ</td></tr><tr><td>180° + θ</td><td>−sin θ</td><td>−cos θ</td><td>tan θ</td></tr><tr><td>270° − θ</td><td>−cos θ</td><td>−sin θ</td><td>cot θ</td></tr><tr><td>360° − θ</td><td>−sin θ</td><td>cos θ</td><td>−tan θ</td></tr></table><h4>The rule in words</h4><p>For odd multiples of 90° the function changes (sin ↔ cos); for even multiples it stays. The sign comes from the quadrant of the original angle. Example: sin(180° + θ) keeps the name sin, lies in Q III where sin is negative, so the answer is −sin θ.</p>"}, "diagram": "t3_allied", "examples": ["t1n7", "t1n8"], "syllabus_item": "2.3"}, {"h": {"en": "3.2 Evaluating large and negative angles"}, "body": {"en": "<h4>Procedure</h4><ol><li>Reduce the angle into 0°-360° by adding or subtracting 360° (the functions are periodic).</li><li>Use the allied-angle rule to bring it into 0°-90°.</li><li>Substitute the standard value.</li></ol><h4>Worked examples</h4><p>sin 150° = sin(180° − 30°) = sin 30° = <b>1/2</b>. cos 240° = cos(180° + 60°) = −cos 60° = <b>−1/2</b>. tan 315° = tan(360° − 45°) = −tan 45° = <b>−1</b>. sin(−330°) = −sin 330° = −(−1/2) = <b>1/2</b>.</p><h4>Common mistake / conditions</h4><p>Do not drop the sign because the numbers look small: 240° is in Q III, so its cosine must be negative even though cos 60° = 1/2. Write the quadrant in the margin before evaluating.</p>"}, "examples": ["t1n8"], "syllabus_item": "2.3"}]}, {"title": {"en": "4. Compound Angles"}, "items": [{"h": {"en": "4.1 sin(A ± B) and cos(A ± B)"}, "body": {"en": "<h4>Formulae</h4><p><b>sin(A + B) = sin A cos B + cos A sin B</b>,  <b>sin(A − B) = sin A cos B − cos A sin B</b></p><p><b>cos(A + B) = cos A cos B − sin A sin B</b>,  <b>cos(A − B) = cos A cos B + sin A sin B</b></p><h4>How the pattern is remembered</h4><p>sin keeps the signs it is given; cos flips them. In sin the two terms are sine-cosine and cosine-sine; in cos the cosines come first in both terms.</p><h4>Where it is used</h4><p>It turns an unknown angle into two known ones: 75° = 45° + 30° and 15° = 45° − 30°. That is why sin 75° can be written exactly as (√6 + √2)/4 ≈ 0.966 without a calculator.</p>"}, "diagram": "t4_compound", "examples": ["t1n9", "t1n10"], "syllabus_item": "2.3"}, {"h": {"en": "4.2 tan(A ± B)"}, "body": {"en": "<h4>Formula</h4><p><b>tan(A + B) = (tan A + tan B)/(1 − tan A tan B)</b> and <b>tan(A − B) = (tan A − tan B)/(1 + tan A tan B)</b>.</p><h4>Derivation (two lines)</h4><p>Write tan(A + B) = sin(A + B)/cos(A + B), substitute the two formulas above, and divide numerator and denominator by cos A cos B. The result follows.</p><h4>Worked example</h4><p>tan 75° = tan(45° + 30°) = (1 + 1/√3)/(1 − 1/√3) = (√3 + 1)/(√3 − 1) = <b>2 + √3 ≈ 3.732</b> (rationalise by multiplying by (√3 + 1)/(√3 + 1), since (√3 − 1)(√3 + 1) = 2).</p><h4>Conditions</h4><p>The formula fails when a denominator is zero - for example tan(A + B) when A + B = 90°. Check the angle before substituting.</p>"}, "examples": ["t1n11"], "syllabus_item": "2.3"}, {"h": {"en": "4.3 Compound-angle numericals with given ratios"}, "body": {"en": "<h4>Method</h4><ol><li>Draw a right triangle (or use sin² + cos² = 1) to find the missing ratios.</li><li>Fix each sign by the quadrant given in the question.</li><li>Substitute into the compound-angle formula and simplify.</li></ol><h4>Worked example</h4><p>If sin A = 3/5 and cos B = 5/13 with A, B acute, then cos A = 4/5 and sin B = 12/13. So sin(A + B) = (3/5)(5/13) + (4/5)(12/13) = 15/65 + 48/65 = <b>63/65 ≈ 0.969</b>.</p><h4>Why the check matters</h4><p>A and B are acute, so A + B is between 0° and 180°; sin(A + B) must be positive, and 63/65 is. If you get a negative sine, a quadrant sign is wrong.</p>"}, "examples": ["t1n12"], "syllabus_item": "2.3"}, {"h": {"en": "4.4 Heights and distances: the engineering use"}, "body": {"en": "<h4>Definition</h4><p>Surveying, civil and mechanical work all reduce to one right triangle: a horizontal distance d, a vertical height h, and the <b>angle of elevation</b> (looking up) or <b>depression</b> (looking down).</p><h4>The three relations</h4><ul><li>tan θ = h/d - the workhorse, because it links the two distances.</li><li>sin θ = h/L where L is the slant length (a ladder, a cable, a ramp).</li><li>cos θ = d/L - use it when the sloping length is the known quantity.</li></ul><h4>Worked example</h4><p>From 50 m away the top of a tower is seen at 30° above the horizontal: h = 50 tan 30° = 50/√3 ≈ <b>28.87 m</b>. If the angle were 45°, the height would equal the distance - the quickest sanity check in the field.</p><h4>Conditions</h4><p>Both angles are measured from the horizontal, and the instrument height is added to h. Sketch the triangle and mark the right angle before writing any ratio.</p>"}, "examples": ["t1n26"], "syllabus_item": "2.3"}]}, {"title": {"en": "5. Multiple and Submultiple Angles"}, "items": [{"h": {"en": "5.1 Double-angle formulae"}, "body": {"en": "<h4>Formulae</h4><p><b>sin 2A = 2 sin A cos A</b>;  <b>cos 2A = cos²A − sin²A = 2cos²A − 1 = 1 − 2sin²A</b>;</p><p><b>tan 2A = 2 tan A / (1 − tan²A)</b>.</p><h4>Derivation</h4><p>Put B = A in the compound formulas: sin(A + A) = sin A cos A + cos A sin A = 2 sin A cos A, and cos(A + A) = cos²A − sin²A. Replacing sin²A by 1 − cos²A (or the reverse) gives the two other forms of cos 2A - choose the one that matches what the question gives you.</p><h4>Worked example</h4><p>sin A = 3/5 with A acute gives cos A = 4/5, so sin 2A = 2(3/5)(4/5) = <b>24/25</b> and cos 2A = 16/25 − 9/25 = <b>7/25</b>.</p>"}, "diagram": "t5_double", "examples": ["t1n13", "t1n14"], "syllabus_item": "2.4"}, {"h": {"en": "5.2 Submultiple (half-angle) formulae"}, "body": {"en": "<h4>Formulae</h4><p>From cos 2A = 1 − 2sin²A, with 2A replaced by θ: <b>sin(θ/2) = ±√((1 − cos θ)/2)</b>;</p><p><b>cos(θ/2) = ±√((1 + cos θ)/2)</b>;  <b>tan(θ/2) = (1 − cos θ)/sin θ = sin θ/(1 + cos θ)</b>.</p><h4>The sign question</h4><p>The ± is decided by the quadrant of θ/2, not of θ. If θ = 300°, then θ/2 = 150° lies in Q II, where sine is positive and cosine negative - so the sine takes + and the cosine takes −.</p><h4>Worked example</h4><p>sin 15° = √((1 − cos 30°)/2) = √((1 − √3/2)/2) = √(2 − √3)/2 ≈ <b>0.2588</b>, which agrees with sin(45° − 30°) computed by the compound formula.</p>"}, "diagram": "t5_double", "examples": ["t1n15"], "syllabus_item": "2.4"}, {"h": {"en": "5.3 Triple-angle formulae"}, "body": {"en": "<h4>Formulae</h4><p><b>sin 3A = 3 sin A − 4 sin³A</b>;  <b>cos 3A = 4 cos³A − 3 cos A</b>;</p><p><b>tan 3A = (3 tan A − tan³A)/(1 − 3 tan²A)</b>.</p><h4>Derivation</h4><p>Write 3A = 2A + A and apply sin(A + B) with B = 2A, then substitute the double-angle results and replace cos²A by 1 − sin²A. Every multiple-angle formula is built this way.</p><h4>Worked example</h4><p>With sin A = 1/2: sin 3A = 3(1/2) − 4(1/8) = 1.5 − 0.5 = <b>1</b>, and indeed 3A = 90° when A = 30°. The formula is a check on itself.</p>"}, "examples": ["t1n16"], "syllabus_item": "2.4"}]}, {"title": {"en": "6. Graphs and Periodicity"}, "items": [{"h": {"en": "6.1 Graphs of sin x and cos x"}, "body": {"en": "<h4>Shape</h4><p>Both curves oscillate between −1 and 1. sin x starts at 0 and rises; cos x starts at 1 and falls. They are the same wave shifted by 90°: <b>cos x = sin(x + 90°)</b>.</p><h4>Key points of one cycle</h4><table><tr><th>x</th><th>0</th><th>π/2</th><th>π</th><th>3π/2</th><th>2π</th></tr><tr><td>sin x</td><td>0</td><td>1</td><td>0</td><td>−1</td><td>0</td></tr><tr><td>cos x</td><td>1</td><td>0</td><td>−1</td><td>0</td><td>1</td></tr></table><h4>Words used with graphs</h4><ul><li><b>Amplitude</b>: half the distance between maximum and minimum (1 for both curves).</li><li><b>Period</b>: length of one complete cycle (2π for both).</li><li><b>Zeros</b>: where the curve crosses the axis - sin at 0, π, 2π; cos at π/2, 3π/2.</li><li><b>Maximum / minimum</b>: 1 and −1, reached once per cycle.</li></ul><p>Sketching five points and joining them with a smooth wave is enough for an exam answer - a table of values plus the shape earns the marks.</p>"}, "diagram": "t6_sincos", "syllabus_item": "2.5"}, {"h": {"en": "6.2 Periodic functions and the period of sin kx"}, "body": {"en": "<h4>Definition</h4><p>A function is <b>periodic</b> with period T if f(x + T) = f(x) for every x, and T is the smallest such positive number. sin x and cos x have period 2π; tan x has period π.</p><h4>Changing the frequency</h4><table><tr><th>Function</th><th>Amplitude</th><th>Period</th></tr><tr><td>sin x, cos x</td><td>1</td><td>2π</td></tr><tr><td>sin kx, cos kx</td><td>1</td><td>2π/|k|</td></tr><tr><td>tan kx</td><td>none</td><td>π/|k|</td></tr><tr><td>a sin kx</td><td>|a|</td><td>2π/|k|</td></tr></table><h4>Worked examples</h4><p>sin 3x has period 2π/3, so three cycles fit in 0 to 2π. cos(x/2) has period 4π - it is slower, not faster. tan 2x has period π/2. A common error is dividing by k in the wrong direction; test with k = 2: the curve repeats twice as often, so the period must be halved.</p>"}, "diagram": "t6_sincos", "examples": ["t1n17"], "syllabus_item": "2.5"}, {"h": {"en": "6.3 Reading y = a sin(bx + c) + d"}, "body": {"en": "<h4>The four numbers</h4><table><tr><th>Letter</th><th>Name</th><th>What it does</th></tr><tr><td>a</td><td>amplitude</td><td>stretches vertically; range becomes d − |a| to d + |a|</td></tr><tr><td>b</td><td>frequency</td><td>period becomes 2π/|b|</td></tr><tr><td>c</td><td>phase</td><td>shifts left by c/b (right if negative)</td></tr><tr><td>d</td><td>vertical shift</td><td>moves the whole graph up or down</td></tr></table><h4>Worked example</h4><p>y = 3 sin(2x − π/3) + 1: amplitude 3, period π, phase shift π/6 to the right, centre line y = 1, so the range is <b>−2 to 4</b> and the maximum 4 occurs when sin(...) = 1.</p><h4>Conditions</h4><p>The phase shift is c/b only when the bracket is written as b(x + c/b) - factor b out first. Without that step the shift is reported as c, which is the standard mistake.</p>"}, "examples": ["t1n18", "t1n19"], "syllabus_item": "2.5"}]}, {"title": {"en": "7. Sum and Factor Formulae"}, "items": [{"h": {"en": "7.1 Sum and difference into product"}, "body": {"en": "<h4>Formulae</h4><p><b>sin C + sin D = 2 sin((C + D)/2) cos((C − D)/2)</b></p><p><b>sin C − sin D = 2 cos((C + D)/2) sin((C − D)/2)</b></p><p><b>cos C + cos D = 2 cos((C + D)/2) cos((C − D)/2)</b></p><p><b>cos C − cos D = −2 sin((C + D)/2) sin((C − D)/2)</b> - note the leading minus.</p><h4>Derivation</h4><p>Add the two compound formulas sin(A + B) and sin(A − B): the cosine terms cancel and 2 sin A cos B remains. Put A = (C + D)/2 and B = (C − D)/2 and the first formula appears. Subtracting instead of adding gives the second; the cosine pair works the same way.</p><h4>Worked example</h4><p>sin 75° + sin 15° = 2 sin 45° cos 30° = 2 × (√2/2)(√3/2) = <b>√6/2 ≈ 1.225</b>, which matches 0.966 + 0.259 = 1.225 ✓.</p>"}, "diagram": "t7_sumprod", "examples": ["t1n20"], "syllabus_item": "2.6"}, {"h": {"en": "7.2 Product into sum or difference"}, "body": {"en": "<h4>Formulae</h4><p><b>2 sin A cos B = sin(A + B) + sin(A − B)</b></p><p><b>2 cos A sin B = sin(A + B) − sin(A − B)</b></p><p><b>2 cos A cos B = cos(A + B) + cos(A − B)</b></p><p><b>2 sin A sin B = cos(A − B) − cos(A + B)</b></p><h4>How to use them</h4><p>These turn a product (hard to integrate later) into a sum. Choose the pair whose sum and difference are the angles you have: 2 sin 40° cos 20° = sin 60° + sin 20° ≈ 0.866 + 0.342 = <b>1.208</b>.</p><h4>Simplifications worth knowing</h4><p>(sin A + sin 3A)/(cos A + cos 3A) = (2 sin 2A cos A)/(2 cos 2A cos A) = <b>tan 2A</b>. Questions of this type are always solved by converting every sum into a product and cancelling.</p>"}, "diagram": "t7_sumprod", "examples": ["t1n21", "t1n22"], "syllabus_item": "2.6"}]}, {"title": {"en": "8. Inverse Trigonometric Functions"}, "items": [{"h": {"en": "8.1 Definition and principal values"}, "body": {"en": "<h4>Definition</h4><p>sin⁻¹x is the angle in a fixed <b>principal range</b> whose sine is x. The restriction makes the inverse a genuine function, because the original sine repeats.</p><table><tr><th>Function</th><th>Domain</th><th>Principal range</th></tr><tr><td>sin⁻¹x</td><td>−1 ≤ x ≤ 1</td><td>−π/2 to π/2</td></tr><tr><td>cos⁻¹x</td><td>−1 ≤ x ≤ 1</td><td>0 to π</td></tr><tr><td>tan⁻¹x</td><td>all real x</td><td>−π/2 to π/2</td></tr><tr><td>cot⁻¹x</td><td>all real x</td><td>0 to π</td></tr></table><h4>Notation warning</h4><p>sin⁻¹x means arcsin x, not 1/sin x. The reciprocal is cosec x. Write arcsin x if the distinction matters.</p><h4>Reading the ranges</h4><p>cos⁻¹(−1/2) = 2π/3, not −π/3: −π/3 is outside the principal range 0 to π, and the inverse must return a value inside it.</p>"}, "diagram": "t8_inverse", "examples": ["t1n23"], "syllabus_item": "2.7"}, {"h": {"en": "8.2 Compositions and the range trap"}, "body": {"en": "<h4>Definition</h4><p>sin⁻¹(sin x) = x only when x already lies in the principal range. Outside it, reduce the angle first.</p><h4>Worked examples</h4><p>sin⁻¹(sin 5π/6): 5π/6 = 150° is outside −90° to 90°, but sin 150° = sin 30°, so the answer is <b>π/6</b>, not 5π/6. By contrast sin(sin⁻¹ 0.4) = 0.4 always, because 0.4 is in the domain.</p><h4>The complement identity</h4><p><b>sin⁻¹x + cos⁻¹x = π/2</b> for every x in [−1, 1], and <b>tan⁻¹x + cot⁻¹x = π/2</b>. These follow from the cofunction relation sin(π/2 − θ) = cos θ.</p><h4>Common mistake / conditions</h4><p>Do not cancel sin⁻¹ and sin blindly. Ask first: is the angle inside the principal range? If not, use an allied angle to bring it in.</p>"}, "diagram": "t8_inverse", "examples": ["t1n24"], "syllabus_item": "2.7"}, {"h": {"en": "8.3 Sum of two inverse tangents"}, "body": {"en": "<h4>Formula</h4><p><b>tan⁻¹x + tan⁻¹y = tan⁻¹((x + y)/(1 − xy))</b> when xy &lt; 1, and the answer shifts by π when xy &gt; 1 (because the sum passes 90°).</p><h4>Worked example</h4><p>tan⁻¹1 + tan⁻¹2 + tan⁻¹3: first 1 and 2 give (3)/(1 − 2) = −3, an angle in Q II, so the pair sums to π − tan⁻¹3; adding tan⁻¹3 gives <b>π</b>. Numerically 45° + 63.43° + 71.57° = 180° ✓.</p><h4>Why the condition matters</h4><p>With x = y = 2 the fraction is 4/(1 − 4) = −4/3, a negative number, but both angles are positive and their sum is about 126.9°, which is π − tan⁻¹(4/3). Forgetting the π shift is the usual error in this question.</p>"}, "examples": ["t1n25"], "syllabus_item": "2.7"}]}, {"title": {"en": "9. Answered Practice (Unit 2 level, suggested marks)"}, "items": [{"h": {"en": "Practice 1. Convert 210° into radians and 3π/4 radians into degrees."}, "body": {"en": "<h4>Working</h4><ol><li>210 × π/180 = 7π/6</li><li>3π/4 × 180/π = 135°</li></ol><h4>Answer</h4><p><b>7π/6 and 135°.</b> 210° is 30° past 180°, so it must be a little more than π - and 7π/6 ≈ 1.17π ✓.</p>"}}, {"h": {"en": "Practice 2. Find the arc length and sector area for r = 12 cm, θ = 45°."}, "body": {"en": "<h4>Working</h4><ol><li>θ = π/4</li><li>s = 12 × π/4 = 3π ≈ 9.42 cm</li><li>A = ½ × 144 × π/4 = 18π ≈ 56.55 cm²</li></ol><h4>Check</h4><p>The arc is one eighth of the circumference 2π(12) = 75.4 cm, and 75.4/8 = 9.42 ✓.</p>"}}, {"h": {"en": "Practice 3. If cos θ = −5/13 and θ is in the third quadrant, find sin θ and tan θ."}, "body": {"en": "<h4>Working</h4><ol><li>sin²θ = 1 − 25/169 = 144/169</li><li>In Q III sine is negative: sin θ = −12/13</li><li>tan θ = (−12/13)/(−5/13) = 12/5</li></ol><h4>Check</h4><p>25/169 + 144/169 = 1 ✓, and tan is positive in Q III as ASTC predicts ✓.</p>"}}, {"h": {"en": "Practice 4. Evaluate tan 120° and cos 315° without a calculator."}, "body": {"en": "<h4>Working</h4><p>tan 120° = tan(180° − 60°) = −tan 60° = −√3. cos 315° = cos(360° − 45°) = cos 45° = 1/√2 = √2/2.</p><h4>Answer</h4><p><b>−√3 and √2/2.</b> Q II gives tangent a negative sign; Q IV gives cosine a positive sign.</p>"}}, {"h": {"en": "Practice 5. Find cos 105° exactly using a compound angle."}, "body": {"en": "<h4>Working</h4><ol><li>105° = 60° + 45°</li><li>cos(60 + 45) = cos 60 cos 45 − sin 60 sin 45</li><li>= (1/2)(√2/2) − (√3/2)(√2/2) = (√2 − √6)/4</li></ol><h4>Check</h4><p>105° is in Q II, so the cosine must be negative: (√2 − √6)/4 ≈ −0.2588 ✓.</p>"}}, {"h": {"en": "Practice 6. If tan A = 3/4 and A is acute, find sin 2A and cos 2A."}, "body": {"en": "<h4>Working</h4><ol><li>sin A = 3/5, cos A = 4/5 (3-4-5 triangle)</li><li>sin 2A = 2(3/5)(4/5) = 24/25</li><li>cos 2A = 2(16/25) − 1 = 7/25</li></ol><h4>Check</h4><p>(24/25)² + (7/25)² = 1 ✓. A ≈ 36.87°, so 2A ≈ 73.74° is still in Q I and both values are positive.</p>"}}, {"h": {"en": "Practice 7. Find the period and amplitude of y = 5 cos(3x + π/4)."}, "body": {"en": "<h4>Working</h4><p>Amplitude = |5| = 5 and period = 2π/3; the phase shift is π/12 to the left because c/b = (π/4)/3.</p><h4>Answer</h4><p><b>Amplitude 5, period 2π/3.</b> Range is −5 to 5, centre line y = 0.</p>"}}, {"h": {"en": "Practice 8. Express cos 40° − cos 20° as a product."}, "body": {"en": "<h4>Working</h4><ol><li>Use cos C − cos D = −2 sin((C + D)/2) sin((C − D)/2)</li><li>= −2 sin 30° sin 10°</li><li>= −2(1/2) sin 10° = −sin 10°</li></ol><h4>Check</h4><p>Numerically: 0.766 − 0.940 = −0.174, and −sin 10° = −0.1736 ✓. The leading minus in the cosine formula is what makes the answer negative.</p>"}}, {"h": {"en": "Practice 9. Simplify sin 5θ + sin 3θ over cos 5θ + cos 3θ."}, "body": {"en": "<h4>Working</h4><ol><li>Numerator: 2 sin 4θ cos θ</li><li>Denominator: 2 cos 4θ cos θ</li><li>Ratio = tan 4θ</li></ol><h4>Answer</h4><p><b>tan 4θ.</b> The cos θ cancels for every θ where it is not zero, which is why the identity holds wherever the original expression is defined.</p>"}}, {"h": {"en": "Practice 10. Evaluate sin⁻¹(−1/2), cos⁻¹(1/2) and tan⁻¹(−1)."}, "body": {"en": "<h4>Working</h4><p>sin⁻¹(−1/2) = −π/6 (principal range −π/2 to π/2). cos⁻¹(1/2) = π/3. tan⁻¹(−1) = −π/4.</p><h4>Answer</h4><p><b>−π/6, π/3, −π/4.</b> Odd inverse functions keep the sign of the input; the cosine inverse does not, because its range starts at 0.</p>"}}, {"h": {"en": "Practice 11. Find the principal value of cos⁻¹(cos 7π/6)."}, "body": {"en": "<h4>Working</h4><ol><li>cos 7π/6 = cos 210° = −√3/2</li><li>cos⁻¹(−√3/2) = 5π/6</li><li>So the answer is 5π/6, not 7π/6</li></ol><h4>Check</h4><p>cos 5π/6 = −√3/2 ✓ and 5π/6 lies in [0, π] ✓. 7π/6 is outside the principal range, which is exactly why it cannot be the answer.</p>"}}, {"h": {"en": "Practice 12. A ladder makes 60° with the ground and reaches 6 m up a wall. How far is its foot from the wall?"}, "body": {"en": "<h4>Working</h4><ol><li>tan 60° = 6/d</li><li>d = 6/tan 60° = 6/√3</li><li>d = 2√3 ≈ 3.46 m</li></ol><h4>Check</h4><p>The ladder length is 6/sin 60° = 6.93 m, and 3.46² + 6² = 48 = 6.93² ✓.</p>"}}, {"h": {"en": "Practice 13. Solve 2 sin²θ − 1 = 0 for 0° ≤ θ ≤ 360°."}, "body": {"en": "<h4>Working</h4><ol><li>sin²θ = 1/2, so sin θ = ±1/√2</li><li>sin θ = +1/√2 → θ = 45°, 135°</li><li>sin θ = −1/√2 → θ = 225°, 315°</li></ol><h4>Answer</h4><p><b>θ = 45°, 135°, 225°, 315°.</b> Four solutions are expected because sine takes each value twice per full turn.</p>"}}, {"h": {"en": "Practice 14. Find sin 22.5° using a half-angle formula."}, "body": {"en": "<h4>Working</h4><ol><li>22.5° = 45°/2</li><li>sin(θ/2) = √((1 − cos θ)/2) = √((1 − √2/2)/2)</li><li>= √((2 − √2)/4) = √(2 − √2)/2</li></ol><h4>Check</h4><p>√(2 − √2)/2 ≈ 0.3827, which is sin 22.5° as a calculator confirms. The positive root is correct because 22.5° lies in Q I.</p>"}}, {"h": {"en": "Practice 15. Prove that sin 2A/(1 + cos 2A) = tan A."}, "body": {"en": "<h4>Working</h4><p>Left side = 2 sin A cos A / (2cos²A), using sin 2A = 2 sin A cos A and 1 + cos 2A = 2cos²A. Cancel 2 cos A: = sin A/cos A = tan A.</p><h4>Check</h4><p>Test A = 30°: left = sin 60/(1 + cos 60) = 0.866/1.5 = 0.577 and tan 30° = 0.577 ✓. Choosing the form 1 + cos 2A = 2cos²A is what makes the proof work.</p>"}}]}], "diagrams": [{"id": "t1_deg_rad", "title": {"en": "Degrees and radians on one circle"}, "file": "diagrams/t1_deg_rad.svg"}, {"id": "t2_quadrants", "title": {"en": "ASTC: which functions are positive"}, "file": "diagrams/t2_quadrants.svg"}, {"id": "t3_allied", "title": {"en": "Allied angles: sign first, then the value"}, "file": "diagrams/t3_allied.svg"}, {"id": "t4_compound", "title": {"en": "Compound angles: two terms each"}, "file": "diagrams/t4_compound.svg"}, {"id": "t5_double", "title": {"en": "Double angle from one triangle"}, "file": "diagrams/t5_double.svg"}, {"id": "t6_sincos", "title": {"en": "Graphs of sine and cosine"}, "file": "diagrams/t6_sincos.svg"}, {"id": "t7_sumprod", "title": {"en": "Sum and product formulae"}, "file": "diagrams/t7_sumprod.svg"}, {"id": "t8_inverse", "title": {"en": "Principal ranges of the inverses"}, "file": "diagrams/t8_inverse.svg"}], "equations": [{"title": {"en": "Measurement and ratios"}, "items": [{"name": {"en": "Degree to radian"}, "f": "radians = degrees × π/180", "terms": {"en": "π radians = 180°; one radian ≈ 57.3°."}}, {"name": {"en": "Arc and sector"}, "f": "s = rθ,  A = ½r²θ  (θ in radians)", "terms": {"en": "Proportions of the circumference and the circle's area."}}, {"name": {"en": "Linear speed"}, "f": "v = rω", "terms": {"en": "ω in rad/s; rpm × 2π/60 converts to rad/s."}}, {"name": {"en": "Fundamental identity"}, "f": "sin²θ + cos²θ = 1", "terms": {"en": "Dividing it by cos²θ gives 1 + tan²θ = sec²θ; by sin²θ gives the cosec form."}}]}, {"title": {"en": "Compound and multiple angles"}, "items": [{"name": {"en": "Sine of a sum"}, "f": "sin(A ± B) = sin A cos B ± cos A sin B", "terms": {"en": "The sign travels with the bracket in the sine formulas."}}, {"name": {"en": "Cosine of a sum"}, "f": "cos(A ± B) = cos A cos B ∓ sin A sin B", "terms": {"en": "The sign flips in the cosine formulas."}}, {"name": {"en": "Tangent of a sum"}, "f": "tan(A ± B) = (tan A ± tan B)/(1 ∓ tan A tan B)", "terms": {"en": "Fails when the denominator is zero, i.e. at 90°."}}, {"name": {"en": "Double angle"}, "f": "sin 2A = 2 sin A cos A;  cos 2A = 1 − 2sin²A", "terms": {"en": "Three equivalent forms for cos 2A - pick the one that fits the given data."}}, {"name": {"en": "Triple angle"}, "f": "sin 3A = 3 sin A − 4sin³A; cos 3A = 4cos³A − 3 cos A", "terms": {"en": "Built from 2A + A, never memorised blindly."}}]}, {"title": {"en": "Graphs, factors and inverses"}, "items": [{"name": {"en": "Period"}, "f": "sin kx and cos kx: 2π/|k|;  tan kx: π/|k|", "terms": {"en": "Larger k packs more cycles into the same interval."}}, {"name": {"en": "Sinusoid"}, "f": "y = a sin(bx + c) + d  →  amplitude |a|, shift −c/b", "terms": {"en": "Range is d ± |a|; factor b out before reading the shift."}}, {"name": {"en": "Sum to product"}, "f": "sin C + sin D = 2 sin((C+D)/2) cos((C−D)/2)", "terms": {"en": "The cosine version has a minus in front for cos C − cos D."}}, {"name": {"en": "Product to sum"}, "f": "2 sin A cos B = sin(A+B) + sin(A−B)", "terms": {"en": "Turns a product into a sum - the standard first step in simplification."}}, {"name": {"en": "Inverse range"}, "f": "sin⁻¹: [−π/2, π/2];  cos⁻¹: [0, π];  tan⁻¹: (−π/2, π/2)", "terms": {"en": "The principal range is what makes the inverse single-valued."}}]}], "numericals": [{"id": "t1n1", "q": {"en": "Convert 135° into radians and 5π/6 radians into degrees."}, "a": {"en": "<h4>Given and assumptions</h4><p>Use π radians = 180°.</p><h4>Formula</h4><p>radians = degrees × π/180;  degrees = radians × 180/π</p><h4>Step-by-step solution</h4><ol><li>135 × π/180 = 3π/4</li><li>5π/6 × 180/π = 150</li></ol><h4>Interpretation and check</h4><p><b>3π/4 and 150°.</b> Check the first: 135° is three quarters of 180°, so three quarters of π ✓. A radian answer larger than 2π for an angle under 360° is always wrong.</p>"}}, {"id": "t1n2", "q": {"en": "Find the arc length and the sector area for r = 7 cm and θ = 60°."}, "a": {"en": "<h4>Given and assumptions</h4><p>θ must be in radians before either formula is used: 60° = π/3.</p><h4>Formula</h4><p>s = rθ and A = ½r²θ</p><h4>Step-by-step solution</h4><ol><li>θ = π/3 ≈ 1.0472 rad</li><li>s = 7 × 1.0472 = 7.33 cm</li><li>A = ½ × 49 × 1.0472 = 25.66 cm²</li></ol><h4>Interpretation and check</h4><p><b>s ≈ 7.33 cm, A ≈ 25.66 cm².</b> Check the arc: it is one sixth of the circumference 2π(7) = 43.98, and 43.98/6 = 7.33 ✓.</p>"}}, {"id": "t1n3", "q": {"en": "A wheel of radius 30 cm rotates at 300 rpm. Find its angular speed and the linear speed of a point on the rim."}, "a": {"en": "<h4>Given and assumptions</h4><p>300 revolutions per minute; radius 0.30 m.</p><h4>Formula</h4><p>ω = rpm × 2π/60 rad/s;  v = rω</p><h4>Step-by-step solution</h4><ol><li>ω = 300 × 2π/60 = 10π ≈ 31.42 rad/s</li><li>v = 0.30 × 31.42 = 9.42 m/s</li></ol><h4>Interpretation and check</h4><p><b>ω ≈ 31.42 rad/s, v ≈ 9.42 m/s.</b> Sanity: 5 revolutions per second means the rim travels 5 × 2π(0.30) = 9.42 m each second ✓.</p>"}}, {"id": "t1n4", "q": {"en": "If sin θ = 3/5 and θ lies in the second quadrant, find cos θ and tan θ."}, "a": {"en": "<h4>Given and assumptions</h4><p>θ in Q II: sine positive, cosine and tangent negative.</p><h4>Formula</h4><p>sin²θ + cos²θ = 1 and tan θ = sin θ / cos θ</p><h4>Step-by-step solution</h4><ol><li>cos²θ = 1 − 9/25 = 16/25</li><li>cos θ = −4/5 because Q II makes cosine negative</li><li>tan θ = (3/5)/(−4/5) = −3/4</li></ol><h4>Interpretation and check</h4><p><b>cos θ = −4/5, tan θ = −3/4.</b> Check the identity: 9/25 + 16/25 = 1 ✓. The quadrant decides the signs; without it the answer is ambiguous.</p>"}}, {"id": "t1n5", "q": {"en": "Evaluate sin 30° cos 60° + cos 30° sin 60°."}, "a": {"en": "<h4>Given and assumptions</h4><p>This is exactly the expansion of sin(A + B) with A = 30°, B = 60°.</p><h4>Formula</h4><p>sin(A + B) = sin A cos B + cos A sin B</p><h4>Step-by-step solution</h4><ol><li>Recognise the pattern: sin(30° + 60°) = sin 90°</li><li>= 1</li><li>Direct check: (1/2)(1/2) + (√3/2)(√3/2) = 1/4 + 3/4 = 1</li></ol><h4>Interpretation and check</h4><p><b>1.</b> Recognising the pattern is faster and safer than multiplying decimals. Both routes must agree - a mismatch means a wrong standard value.</p>"}}, {"id": "t1n6", "q": {"en": "Evaluate sin²30° + cos²60° + tan²45°."}, "a": {"en": "<h4>Given and assumptions</h4><p>Standard values only; no identity needed, but the first identity can be used as a check.</p><h4>Formula</h4><p>sin 30° = 1/2, cos 60° = 1/2, tan 45° = 1</p><h4>Step-by-step solution</h4><ol><li>(1/2)² = 1/4</li><li>(1/2)² = 1/4</li><li>1² = 1</li><li>1/4 + 1/4 + 1 = 3/2</li></ol><h4>Interpretation and check</h4><p><b>3/2 = 1.5.</b> Notice sin²30° + cos²60° = 1/2 only because both angles give 1/2; in general sin²θ + cos²θ = 1 uses the <i>same</i> angle.</p>"}}, {"id": "t1n7", "q": {"en": "Write sin(180° + θ), cos(180° − θ) and tan(360° − θ) in terms of θ."}, "a": {"en": "<h4>Given and assumptions</h4><p>Use the quadrant sign plus the unchanged function name (even multiple of 90°).</p><h4>Formula</h4><p>Sign from the quadrant; name stays for 180° and 360°</p><h4>Step-by-step solution</h4><ol><li>180° + θ is in Q III, sine negative → sin(180° + θ) = −sin θ</li><li>180° − θ is in Q II, cosine negative → cos(180° − θ) = −cos θ</li><li>360° − θ is in Q IV, tangent negative → tan(360° − θ) = −tan θ</li></ol><h4>Interpretation and check</h4><p><b>−sin θ, −cos θ and −tan θ.</b> Test with θ = 30°: sin 210° = −0.5 ✓, cos 150° = −0.866 ✓, tan 330° = −0.577 ✓.</p>"}}, {"id": "t1n8", "q": {"en": "Evaluate sin 150°, cos 240°, tan 315° and sin(−330°)."}, "a": {"en": "<h4>Given and assumptions</h4><p>Reduce each angle with an allied-angle rule first.</p><h4>Formula</h4><p>sin(180° − θ) = sin θ, cos(180° + θ) = −cos θ, tan(360° − θ) = −tan θ, sin(−θ) = −sin θ</p><h4>Step-by-step solution</h4><ol><li>sin 150° = sin 30° = 1/2</li><li>cos 240° = −cos 60° = −1/2</li><li>tan 315° = −tan 45° = −1</li><li>sin(−330°) = −sin 330° = −(−1/2) = 1/2</li></ol><h4>Interpretation and check</h4><p><b>1/2, −1/2, −1 and 1/2.</b> Each answer matches the ASTC sign of its quadrant: Q II sine positive, Q III cosine negative, Q IV tangent negative, and −330° is coterminal with 30°.</p>"}}, {"id": "t1n9", "q": {"en": "Find sin 75° exactly."}, "a": {"en": "<h4>Given and assumptions</h4><p>75° = 45° + 30°, both standard angles.</p><h4>Formula</h4><p>sin(A + B) = sin A cos B + cos A sin B</p><h4>Step-by-step solution</h4><ol><li>= sin 45 cos 30 + cos 45 sin 30</li><li>= (√2/2)(√3/2) + (√2/2)(1/2)</li><li>= (√6 + √2)/4</li></ol><h4>Interpretation and check</h4><p><b>(√6 + √2)/4 ≈ 0.9659.</b> 75° is close to 90°, so its sine should be close to 1 - and 0.966 is. A calculator gives 0.96593 ✓.</p>"}}, {"id": "t1n10", "q": {"en": "Find cos 15° exactly."}, "a": {"en": "<h4>Given and assumptions</h4><p>15° = 45° − 30°.</p><h4>Formula</h4><p>cos(A − B) = cos A cos B + sin A sin B</p><h4>Step-by-step solution</h4><ol><li>= cos 45 cos 30 + sin 45 sin 30</li><li>= (√2/2)(√3/2) + (√2/2)(1/2)</li><li>= (√6 + √2)/4</li></ol><h4>Interpretation and check</h4><p><b>(√6 + √2)/4 ≈ 0.9659.</b> This is the same value as sin 75°, which is expected because 15° and 75° are complementary: cos 15° = sin 75° ✓.</p>"}}, {"id": "t1n11", "q": {"en": "Find tan 75° in surd form."}, "a": {"en": "<h4>Given and assumptions</h4><p>75° = 45° + 30°.</p><h4>Formula</h4><p>tan(A + B) = (tan A + tan B)/(1 − tan A tan B)</p><h4>Step-by-step solution</h4><ol><li>= (1 + 1/√3)/(1 − 1/√3)</li><li>Multiply top and bottom by √3: (√3 + 1)/(√3 − 1)</li><li>Rationalise: ((√3 + 1)²)/((√3)² − 1²) = (4 + 2√3)/2 = 2 + √3</li></ol><h4>Interpretation and check</h4><p><b>2 + √3 ≈ 3.732.</b> Check: tan 75° must exceed tan 60° = 1.732 ✓, and 2 + 1.732 = 3.732 matches a calculator.</p>"}}, {"id": "t1n12", "q": {"en": "If sin A = 3/5 and cos B = 5/13 with A and B acute, find sin(A + B)."}, "a": {"en": "<h4>Given and assumptions</h4><p>Acute angles, so every ratio is positive.</p><h4>Formula</h4><p>sin(A + B) = sin A cos B + cos A sin B</p><h4>Step-by-step solution</h4><ol><li>cos A = √(1 − 9/25) = 4/5</li><li>sin B = √(1 − 25/169) = 12/13</li><li>sin(A + B) = (3/5)(5/13) + (4/5)(12/13)</li><li>= 15/65 + 48/65 = 63/65</li></ol><h4>Interpretation and check</h4><p><b>63/65 ≈ 0.969.</b> Both angles are acute so A + B &lt; 180° and the sine is positive ✓. The Pythagorean triples 3-4-5 and 5-12-13 make the arithmetic exact.</p>"}}, {"id": "t1n13", "q": {"en": "If sin A = 3/5 with A acute, find sin 2A and cos 2A."}, "a": {"en": "<h4>Given and assumptions</h4><p>cos A = 4/5 from the same triangle.</p><h4>Formula</h4><p>sin 2A = 2 sin A cos A;  cos 2A = 1 − 2 sin²A</p><h4>Step-by-step solution</h4><ol><li>sin 2A = 2(3/5)(4/5) = 24/25</li><li>cos 2A = 1 − 2(9/25) = 7/25</li></ol><h4>Interpretation and check</h4><p><b>24/25 and 7/25.</b> Check with the identity: (24/25)² + (7/25)² = (576 + 49)/625 = 1 ✓. Since A ≈ 36.87°, 2A ≈ 73.74° lies in Q I, so both values must be positive.</p>"}}, {"id": "t1n14", "q": {"en": "Find cos 2A when cos A = 1/2."}, "a": {"en": "<h4>Given and assumptions</h4><p>Choose the form of cos 2A that uses cos A only.</p><h4>Formula</h4><p>cos 2A = 2 cos²A − 1</p><h4>Step-by-step solution</h4><ol><li>= 2(1/4) − 1</li><li>= 1/2 − 1 = −1/2</li></ol><h4>Interpretation and check</h4><p><b>−1/2.</b> A = 60°, so 2A = 120° and cos 120° = −1/2 ✓. Choosing the wrong form (1 − 2sin²A) would need sin A first - extra work, same answer.</p>"}}, {"id": "t1n15", "q": {"en": "Find sin 15° using a half-angle formula."}, "a": {"en": "<h4>Given and assumptions</h4><p>15° = 30°/2, so use θ = 30° with the positive root (15° is in Q I).</p><h4>Formula</h4><p>sin(θ/2) = √((1 − cos θ)/2)</p><h4>Step-by-step solution</h4><ol><li>= √((1 − √3/2)/2)</li><li>= √((2 − √3)/4)</li><li>= √(2 − √3)/2</li></ol><h4>Interpretation and check</h4><p><b>√(2 − √3)/2 ≈ 0.2588.</b> Check against the compound formula: sin(45° − 30°) = (√6 − √2)/4 ≈ 0.2588 ✓. The two surd forms are equal.</p>"}}, {"id": "t1n16", "q": {"en": "Using the triple-angle formula, evaluate sin 3A when sin A = 1/2 and A is acute."}, "a": {"en": "<h4>Given and assumptions</h4><p>A = 30°, so 3A = 90°; the formula must reproduce sin 90° = 1.</p><h4>Formula</h4><p>sin 3A = 3 sin A − 4 sin³A</p><h4>Step-by-step solution</h4><ol><li>= 3(1/2) − 4(1/8)</li><li>= 1.5 − 0.5</li><li>= 1</li></ol><h4>Interpretation and check</h4><p><b>1.</b> The known value of sin 90° confirms the formula. This is a useful exam habit: when a formula can be checked against a standard angle, do it.</p>"}}, {"id": "t1n17", "q": {"en": "Find the period of sin 3x, cos(x/2) and tan 2x."}, "a": {"en": "<h4>Given and assumptions</h4><p>Period of sin kx and cos kx is 2π/|k|; of tan kx it is π/|k|.</p><h4>Formula</h4><p>T = 2π/|k| for sine and cosine, T = π/|k| for tangent</p><h4>Step-by-step solution</h4><ol><li>sin 3x: T = 2π/3</li><li>cos(x/2): k = 1/2, T = 2π/(1/2) = 4π</li><li>tan 2x: T = π/2</li></ol><h4>Interpretation and check</h4><p><b>2π/3, 4π and π/2.</b> Sanity: the larger the k, the faster the oscillation and the smaller the period - sin 3x repeats three times in 2π, so its period is one third of 2π ✓.</p>"}}, {"id": "t1n18", "q": {"en": "For y = 3 sin(2x − π/3) state the amplitude, period, phase shift and range."}, "a": {"en": "<h4>Given and assumptions</h4><p>Compare with y = a sin(bx + c) + d: a = 3, b = 2, c = −π/3, d = 0.</p><h4>Formula</h4><p>amplitude |a|, period 2π/|b|, shift −c/b, range d ± |a|</p><h4>Step-by-step solution</h4><ol><li>Amplitude = 3</li><li>Period = 2π/2 = π</li><li>Shift = π/6 to the right</li><li>Range = −3 to 3</li></ol><h4>Interpretation and check</h4><p><b>3, π, π/6 right, [−3, 3].</b> Check one extreme: the maximum 3 occurs when 2x − π/3 = π/2, that is x = 5π/12, inside the first period ✓.</p>"}}, {"id": "t1n19", "q": {"en": "Find the maximum and minimum of y = 2 + 3 cos x."}, "a": {"en": "<h4>Given and assumptions</h4><p>cos x varies between −1 and 1.</p><h4>Formula</h4><p>y = d + a cos x has range d ± |a|</p><h4>Step-by-step solution</h4><ol><li>Maximum when cos x = 1: y = 2 + 3 = 5</li><li>Minimum when cos x = −1: y = 2 − 3 = −1</li></ol><h4>Interpretation and check</h4><p><b>Maximum 5, minimum −1.</b> The centre line is y = 2 and the amplitude 3, so the range is 2 ± 3 ✓. The maxima occur at x = 0, 2π, … and the minima at x = π, 3π, ….</p>"}}, {"id": "t1n20", "q": {"en": "Express sin 75° + sin 15° as a product and evaluate it."}, "a": {"en": "<h4>Given and assumptions</h4><p>C = 75°, D = 15°, so (C + D)/2 = 45° and (C − D)/2 = 30°.</p><h4>Formula</h4><p>sin C + sin D = 2 sin((C + D)/2) cos((C − D)/2)</p><h4>Step-by-step solution</h4><ol><li>= 2 sin 45° cos 30°</li><li>= 2 × (√2/2) × (√3/2)</li><li>= √6/2</li></ol><h4>Interpretation and check</h4><p><b>√6/2 ≈ 1.2247.</b> Direct check: 0.9659 + 0.2588 = 1.2247 ✓. The product form also shows why the sum exceeds 1 even though each term is below 1.</p>"}}, {"id": "t1n21", "q": {"en": "Convert 2 sin 40° cos 20° into a sum and evaluate it."}, "a": {"en": "<h4>Given and assumptions</h4><p>A = 40°, B = 20° in the product-to-sum formula.</p><h4>Formula</h4><p>2 sin A cos B = sin(A + B) + sin(A − B)</p><h4>Step-by-step solution</h4><ol><li>= sin 60° + sin 20°</li><li>= 0.8660 + 0.3420</li><li>= 1.2080</li></ol><h4>Interpretation and check</h4><p><b>sin 60° + sin 20° ≈ 1.208.</b> Check the product directly: 2(0.6428)(0.9397) = 1.208 ✓.</p>"}}, {"id": "t1n22", "q": {"en": "Simplify (sin A + sin 3A)/(cos A + cos 3A)."}, "a": {"en": "<h4>Given and assumptions</h4><p>Convert both sums to products; the common factor should cancel.</p><h4>Formula</h4><p>sin C + sin D = 2 sin((C + D)/2) cos((C − D)/2); cos C + cos D = 2 cos((C + D)/2) cos((C − D)/2)</p><h4>Step-by-step solution</h4><ol><li>Numerator: 2 sin 2A cos(−A) = 2 sin 2A cos A</li><li>Denominator: 2 cos 2A cos(−A) = 2 cos 2A cos A</li><li>Ratio = tan 2A</li></ol><h4>Interpretation and check</h4><p><b>tan 2A.</b> Check with A = 20°: numerator = sin 20 + sin 60 = 0.342 + 0.866 = 1.208, denominator = cos 20 + cos 60 = 0.940 + 0.500 = 1.440, ratio = 0.839 = tan 40° ✓.</p>"}}, {"id": "t1n23", "q": {"en": "Evaluate sin⁻¹(1/2), cos⁻¹(−1/2) and tan⁻¹(1)."}, "a": {"en": "<h4>Given and assumptions</h4><p>Use the principal ranges: sin⁻¹ in [−π/2, π/2], cos⁻¹ in [0, π], tan⁻¹ in (−π/2, π/2).</p><h4>Formula</h4><p>y = sin⁻¹x ⇔ sin y = x within the principal range</p><h4>Step-by-step solution</h4><ol><li>sin 30° = 1/2 → sin⁻¹(1/2) = π/6</li><li>cos 120° = −1/2 → cos⁻¹(−1/2) = 2π/3</li><li>tan 45° = 1 → tan⁻¹(1) = π/4</li></ol><h4>Interpretation and check</h4><p><b>π/6, 2π/3 and π/4.</b> The trap is cos⁻¹(−1/2): −π/3 has the right cosine but lies outside 0 to π, so it is not the principal value.</p>"}}, {"id": "t1n24", "q": {"en": "Evaluate sin⁻¹(sin 5π/6)."}, "a": {"en": "<h4>Given and assumptions</h4><p>5π/6 = 150° is outside the principal range [−90°, 90°].</p><h4>Formula</h4><p>sin⁻¹(sin x) = x only when x is inside the principal range</p><h4>Step-by-step solution</h4><ol><li>sin 150° = sin 30° = 1/2</li><li>sin⁻¹(1/2) = π/6</li><li>Therefore sin⁻¹(sin 5π/6) = π/6</li></ol><h4>Interpretation and check</h4><p><b>π/6, not 5π/6.</b> Check: sin π/6 = 1/2 = sin 5π/6 ✓, and π/6 is inside the principal range. This question exists to test exactly that restriction.</p>"}}, {"id": "t1n25", "q": {"en": "Show that tan⁻¹1 + tan⁻¹2 + tan⁻¹3 = π."}, "a": {"en": "<h4>Given and assumptions</h4><p>Combine the first two with the addition formula, then add the third.</p><h4>Formula</h4><p>tan⁻¹x + tan⁻¹y = tan⁻¹((x + y)/(1 − xy)) with a π shift when xy > 1</p><h4>Step-by-step solution</h4><ol><li>For 1 and 2: (1 + 2)/(1 − 2) = −3, and xy = 2 > 1, so the sum is π − tan⁻¹3</li><li>Add tan⁻¹3: π − tan⁻¹3 + tan⁻¹3 = π</li></ol><h4>Interpretation and check</h4><p><b>π.</b> Numerically 45° + 63.43° + 71.57° = 180° ✓. Without the π shift the algebra gives tan⁻¹(−3) + tan⁻¹3 = 0, which is clearly wrong for a sum of three positive angles.</p>"}}, {"id": "t1n26", "q": {"en": "The angle of elevation of the top of a tower is 30° from a point 50 m from its base. Find the height of the tower."}, "a": {"en": "<h4>Given and assumptions</h4><p>Right triangle: adjacent = 50 m, angle = 30°, opposite = height h.</p><h4>Formula</h4><p>tan θ = opposite / adjacent</p><h4>Step-by-step solution</h4><ol><li>tan 30° = h/50</li><li>h = 50 × tan 30° = 50/√3</li><li>h = 50√3/3 ≈ 28.87 m</li></ol><h4>Interpretation and check</h4><p><b>h ≈ 28.87 m.</b> Sanity: tan 30° ≈ 0.577, so the height is a little more than half the distance ✓. Rationalise the surd: 50/√3 = 50√3/3.</p>"}}], "viva": [{"title": {"en": "Measurement and functions"}, "items": [{"q": {"en": "How many radians make 180°?"}, "a": {"en": "π radians, so 1 radian ≈ 57.3°."}}, {"q": {"en": "Write the arc-length formula and state the unit of θ."}, "a": {"en": "s = rθ, with θ in radians."}}, {"q": {"en": "Write the sector-area formula."}, "a": {"en": "A = ½r²θ, with θ in radians."}}, {"q": {"en": "How do you convert rpm into rad/s?"}, "a": {"en": "Multiply by 2π/60, because one revolution is 2π radians in 60 seconds."}}, {"q": {"en": "State the ASTC rule."}, "a": {"en": "Quadrant I all positive, II sin positive, III tan positive, IV cos positive."}}, {"q": {"en": "Which functions are positive in the third quadrant?"}, "a": {"en": "tan θ and cot θ only, because both coordinates are negative and their ratio is positive."}}, {"q": {"en": "Give the three fundamental identities."}, "a": {"en": "sin²θ + cos²θ = 1, 1 + tan²θ = sec²θ, 1 + cot²θ = cosec²θ."}}]}, {"title": {"en": "Allied and compound angles"}, "items": [{"q": {"en": "Write sin(180° − θ)."}, "a": {"en": "sin θ: the angle is in Q II where sine is positive, and the name stays."}}, {"q": {"en": "Write cos(180° + θ)."}, "a": {"en": "−cos θ: Q III makes cosine negative."}}, {"q": {"en": "State sin(A + B)."}, "a": {"en": "sin A cos B + cos A sin B."}}, {"q": {"en": "State cos(A − B)."}, "a": {"en": "cos A cos B + sin A sin B - the cosine formula flips the sign."}}, {"q": {"en": "State tan(A + B)."}, "a": {"en": "(tan A + tan B)/(1 − tan A tan B)."}}, {"q": {"en": "Why is sin 75° equal to sin 45° cos 30° + cos 45° sin 30°?"}, "a": {"en": "Because 75° = 45° + 30° and the compound-angle formula expands sin(A + B)."}}]}, {"title": {"en": "Multiple angles, graphs, inverses"}, "items": [{"q": {"en": "State sin 2A."}, "a": {"en": "2 sin A cos A."}}, {"q": {"en": "Give the three forms of cos 2A."}, "a": {"en": "cos²A − sin²A, 2cos²A − 1 and 1 − 2sin²A."}}, {"q": {"en": "State sin 3A."}, "a": {"en": "3 sin A − 4 sin³A."}}, {"q": {"en": "What is the period of sin 3x?"}, "a": {"en": "2π/3, because the frequency is 3."}}, {"q": {"en": "What is the amplitude of y = 3 sin(2x − π/3)?"}, "a": {"en": "3, the magnitude of the coefficient of the sine."}}, {"q": {"en": "Write sin C + sin D as a product."}, "a": {"en": "2 sin((C + D)/2) cos((C − D)/2)."}}, {"q": {"en": "Write 2 sin A cos B as a sum."}, "a": {"en": "sin(A + B) + sin(A − B)."}}, {"q": {"en": "What is the principal range of sin⁻¹?"}, "a": {"en": "−π/2 to π/2, inclusive."}}, {"q": {"en": "What is sin⁻¹x + cos⁻¹x?"}, "a": {"en": "π/2 for every x in [−1, 1]."}}]}], "exam_questions": [{"q": {"en": "Practice: Convert 210° into radians and 3π/4 radians into degrees."}, "marks": 3}, {"q": {"en": "Practice: Find the arc length and sector area for r = 12 cm, θ = 45°."}, "marks": 4}, {"q": {"en": "Practice: If cos θ = −5/13 and θ is in the third quadrant, find sin θ and tan θ."}, "marks": 4}, {"q": {"en": "Practice: Evaluate tan 120° and cos 315° without a calculator."}, "marks": 3}, {"q": {"en": "Practice: Find cos 105° exactly using a compound angle."}, "marks": 4}, {"q": {"en": "Practice: If tan A = 3/4 and A is acute, find sin 2A and cos 2A."}, "marks": 4}, {"q": {"en": "Practice: Find the period and amplitude of y = 5 cos(3x + π/4)."}, "marks": 3}, {"q": {"en": "Practice: Express cos 40° − cos 20° as a product."}, "marks": 4}, {"q": {"en": "Practice: Simplify sin 5θ + sin 3θ over cos 5θ + cos 3θ."}, "marks": 4}, {"q": {"en": "Practice: Evaluate sin⁻¹(−1/2), cos⁻¹(1/2) and tan⁻¹(−1)."}, "marks": 3}, {"q": {"en": "Practice: Find the principal value of cos⁻¹(cos 7π/6)."}, "marks": 4}, {"q": {"en": "Practice: A ladder makes 60° with the ground and reaches 6 m up a wall. How far is its foot from the wall?"}, "marks": 4}, {"q": {"en": "Practice: Solve 2 sin²θ − 1 = 0 for 0° ≤ θ ≤ 360°."}, "marks": 4}, {"q": {"en": "Practice: Find sin 22.5° using a half-angle formula."}, "marks": 4}, {"q": {"en": "Practice: Prove that sin 2A/(1 + cos 2A) = tan A."}, "marks": 4}], "learning_outcomes": [{"en": "CO2: Demonstrate the ability to algebraically analyse basic functions used in trigonometry."}], "course_outcomes": ["CO2"], "practical_numbers": [], "content_kind": "theory", "lesson_count": 24, "answered_practice_count": 15, "assessment_note": {"en": "Official course: theory ESE 70 + PA 30 = 100 marks, 4 credits; this unit carries 20 % weightage and about 14 of the 70 theory marks. Practice-question marks (3/4) are suggested revision sizes, not official GTU allocations or a guaranteed paper pattern. Model answers are in Notes section 7."}, "question_provenance": "Original answered revision questions; not official past papers", "question_marks_are_suggested": true, "sources": [{"title": "GTU DI01000021, Mathematics-I, Branch: All, Semester 1, w.e.f. 2024-25 (uploaded syllabus)", "url": "https://s3-ap-southeast-1.amazonaws.com/gtusitecirculars/Syallbus/DI01000021.pdf"}, {"title": "Khan Academy - trigonometry, unit circle and inverse functions", "url": "https://www.khanacademy.org/math/trigonometry"}, {"title": "GeoGebra - slide A and B to watch sin(A + B) change", "url": "https://www.geogebra.org/m/trigonometry"}, {"title": "OpenStax - Algebra and Trigonometry 2e (free textbook)", "url": "https://openstax.org/details/books/algebra-and-trigonometry-2e"}, {"title": "NCERT - Class 11 Mathematics, chapters 3 and 4", "url": "https://ncert.nic.in/textbook.php"}]};
const SVG = {"t1_deg_rad": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 380\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"380\" fill=\"#ffffff\"/><text x=\"180\" y=\"28.9\" font-size=\"14\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">Degrees and radians on one circle</text><text x=\"180\" y=\"49.7\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">π radians = 180°, one full turn = 2π</text><circle cx=\"150\" cy=\"170\" r=\"78\" fill=\"#FCFCFD\" stroke=\"#333\" stroke-width=\"1.6\"/><path d=\"M58 170 H244\" fill=\"none\" stroke=\"#999\" stroke-width=\"1.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-dasharray=\"4 3\"/><path d=\"M150 78 V262\" fill=\"none\" stroke=\"#999\" stroke-width=\"1.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-dasharray=\"4 3\"/><circle cx=\"228.0\" cy=\"170.0\" r=\"3.4\" fill=\"#7B2CD9\"/><text x=\"254.0\" y=\"177.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"bold\">0°</text><text x=\"202.0\" y=\"177.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1565C0\" font-weight=\"normal\">0</text><circle cx=\"150.0\" cy=\"92.0\" r=\"3.4\" fill=\"#7B2CD9\"/><text x=\"150.0\" y=\"73.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"bold\">90°</text><text x=\"150.0\" y=\"125.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1565C0\" font-weight=\"normal\">π/2</text><circle cx=\"72.0\" cy=\"170.0\" r=\"3.4\" fill=\"#7B2CD9\"/><text x=\"46.0\" y=\"177.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"bold\">180°</text><text x=\"98.0\" y=\"177.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1565C0\" font-weight=\"normal\">π</text><circle cx=\"150.0\" cy=\"248.0\" r=\"3.4\" fill=\"#7B2CD9\"/><text x=\"149.99999999999997\" y=\"281.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"bold\">270°</text><text x=\"150.0\" y=\"229.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1565C0\" font-weight=\"normal\">3π/2</text><path d=\"M150 170 L217.5 131.0\" fill=\"none\" stroke=\"#B66A00\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"200\" y=\"147.8\" font-size=\"11\" text-anchor=\"middle\" fill=\"#B66A00\" font-weight=\"bold\">θ</text><rect x=\"0.0\" y=\"287.0\" width=\"300\" height=\"30\" rx=\"7\" fill=\"#EAF3FD\" stroke=\"#1565C0\" stroke-width=\"1.6\"/><text x=\"150\" y=\"306.1\" font-size=\"11.6\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">radians = degrees × π/180</text><text x=\"180\" y=\"345.6\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">Degrees sit outside the circle, radians inside.</text><text x=\"180\" y=\"361.6\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">1 radian ≈ 57.3°.</text></svg>", "t2_quadrants": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 366\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"366\" fill=\"#ffffff\"/><text x=\"180\" y=\"28.9\" font-size=\"14\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">ASTC: which functions are positive</text><text x=\"180\" y=\"49.7\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">All · Silver · Tea · Cups, anticlockwise</text><circle cx=\"180\" cy=\"168\" r=\"78\" fill=\"#FFFFFF\" stroke=\"#D9D2E6\" stroke-width=\"1.2\"/><path d=\"M86 168 H274\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M180 74 V262\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"210.3\" cy=\"137.7\" r=\"26\" fill=\"#EAF6EC\" stroke=\"#2E7D32\" stroke-width=\"1.3\"/><text x=\"210.3348809129029\" y=\"141.6\" font-size=\"17\" text-anchor=\"middle\" fill=\"#2E7D32\" font-weight=\"bold\">A</text><text x=\"210.3348809129029\" y=\"154.7\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#2E7D32\" font-weight=\"normal\">I</text><circle cx=\"149.7\" cy=\"137.7\" r=\"26\" fill=\"#EAF3FD\" stroke=\"#1565C0\" stroke-width=\"1.3\"/><text x=\"149.6651190870971\" y=\"141.6\" font-size=\"17\" text-anchor=\"middle\" fill=\"#1565C0\" font-weight=\"bold\">S</text><text x=\"149.6651190870971\" y=\"154.7\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#1565C0\" font-weight=\"normal\">II</text><circle cx=\"149.7\" cy=\"198.3\" r=\"26\" fill=\"#FFF4DF\" stroke=\"#B66A00\" stroke-width=\"1.3\"/><text x=\"149.6651190870971\" y=\"202.3\" font-size=\"17\" text-anchor=\"middle\" fill=\"#B66A00\" font-weight=\"bold\">T</text><text x=\"149.6651190870971\" y=\"215.3\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#B66A00\" font-weight=\"normal\">III</text><circle cx=\"210.3\" cy=\"198.3\" r=\"26\" fill=\"#FDECF0\" stroke=\"#BD2543\" stroke-width=\"1.3\"/><text x=\"210.3348809129029\" y=\"202.3\" font-size=\"17\" text-anchor=\"middle\" fill=\"#BD2543\" font-weight=\"bold\">C</text><text x=\"210.3348809129029\" y=\"215.3\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#BD2543\" font-weight=\"normal\">IV</text><text x=\"180\" y=\"289.7\" font-size=\"10.6\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">A all  ·  S sin  ·  T tan  ·  C cos</text><text x=\"180\" y=\"306.3\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">sin, cosec in II · tan, cot in III · cos, sec in IV</text><text x=\"180\" y=\"331.6\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">x negative on the left, y negative below the axis.</text><text x=\"180\" y=\"347.6\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">The ratio of two negatives is positive - that is why tan wins in Q III.</text></svg>", "t3_allied": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 384\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"384\" fill=\"#ffffff\"/><text x=\"180\" y=\"28.9\" font-size=\"14\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">Allied angles: sign first, then value</text><text x=\"180\" y=\"49.7\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">Even multiple of 90° keeps the name</text><rect x=\"16\" y=\"66\" width=\"328\" height=\"44\" rx=\"7\" fill=\"#EAF6EC\" stroke=\"#2E7D32\" stroke-width=\"1.4\"/><text x=\"26\" y=\"90.3\" font-size=\"12.2\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">sin(180° − θ) =  sin θ</text><text x=\"334\" y=\"89.1\" font-size=\"8.8\" text-anchor=\"end\" fill=\"#666\" font-weight=\"normal\">Q II, sine positive</text><rect x=\"16\" y=\"118\" width=\"328\" height=\"44\" rx=\"7\" fill=\"#FDECF0\" stroke=\"#BD2543\" stroke-width=\"1.4\"/><text x=\"26\" y=\"142.3\" font-size=\"12.2\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">cos(180° − θ) = −cos θ</text><text x=\"334\" y=\"141.1\" font-size=\"8.8\" text-anchor=\"end\" fill=\"#666\" font-weight=\"normal\">Q II, cosine negative</text><rect x=\"16\" y=\"170\" width=\"328\" height=\"44\" rx=\"7\" fill=\"#FDECF0\" stroke=\"#BD2543\" stroke-width=\"1.4\"/><text x=\"26\" y=\"194.3\" font-size=\"12.2\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">sin(180° + θ) = −sin θ</text><text x=\"334\" y=\"193.1\" font-size=\"8.8\" text-anchor=\"end\" fill=\"#666\" font-weight=\"normal\">Q III, sine negative</text><rect x=\"16\" y=\"222\" width=\"328\" height=\"44\" rx=\"7\" fill=\"#FDECF0\" stroke=\"#BD2543\" stroke-width=\"1.4\"/><text x=\"26\" y=\"246.3\" font-size=\"12.2\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">tan(360° − θ) = −tan θ</text><text x=\"334\" y=\"245.1\" font-size=\"8.8\" text-anchor=\"end\" fill=\"#666\" font-weight=\"normal\">Q IV, tangent negative</text><rect x=\"16\" y=\"274\" width=\"328\" height=\"44\" rx=\"7\" fill=\"#EAF6EC\" stroke=\"#2E7D32\" stroke-width=\"1.4\"/><text x=\"26\" y=\"298.3\" font-size=\"12.2\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">cos(−θ)      =  cos θ</text><text x=\"334\" y=\"297.1\" font-size=\"8.8\" text-anchor=\"end\" fill=\"#666\" font-weight=\"normal\">cosine is even</text><text x=\"180\" y=\"333.6\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">For 90° and 270° the function also changes: sin ↔ cos.</text><text x=\"180\" y=\"349.6\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">Worked example: sin 150° = sin 30° = 1/2.</text></svg>", "t4_compound": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 358\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"358\" fill=\"#ffffff\"/><text x=\"180\" y=\"28.9\" font-size=\"14\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">Compound angles: two terms each</text><text x=\"180\" y=\"49.7\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">Known angles replace an unknown one</text><rect x=\"30.0\" y=\"55.0\" width=\"300\" height=\"30\" rx=\"7\" fill=\"#F4F4F4\" stroke=\"#999\" stroke-width=\"1.6\"/><text x=\"180\" y=\"74.0\" font-size=\"11.4\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">75°  =  45° + 30°</text><path d=\"M180 85 L180 106\" fill=\"none\" stroke=\"#7B2CD9\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polygon points=\"180.0,106.0 183.5,99.0 176.5,99.0\" fill=\"#7B2CD9\"/><rect x=\"30.0\" y=\"108.0\" width=\"300\" height=\"32\" rx=\"7\" fill=\"#EAF3FD\" stroke=\"#1565C0\" stroke-width=\"1.6\"/><text x=\"180\" y=\"128.3\" font-size=\"12.4\" text-anchor=\"middle\" fill=\"#1565C0\" font-weight=\"bold\">sin(A + B)</text><path d=\"M150 140 L106 164\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polygon points=\"106.0,164.0 113.8,163.7 110.5,157.6\" fill=\"#333\"/><path d=\"M210 140 L254 164\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polygon points=\"254.0,164.0 249.5,157.6 246.2,163.7\" fill=\"#333\"/><rect x=\"21.0\" y=\"166.0\" width=\"150\" height=\"32\" rx=\"7\" fill=\"#EAF6EC\" stroke=\"#2E7D32\" stroke-width=\"1.6\"/><text x=\"96\" y=\"185.9\" font-size=\"11.2\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">sin A cos B</text><text x=\"180\" y=\"191.9\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">+</text><rect x=\"189.0\" y=\"166.0\" width=\"150\" height=\"32\" rx=\"7\" fill=\"#FFF4DF\" stroke=\"#B66A00\" stroke-width=\"1.6\"/><text x=\"264\" y=\"185.9\" font-size=\"11.2\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">cos A sin B</text><rect x=\"30.0\" y=\"217.0\" width=\"300\" height=\"30\" rx=\"7\" fill=\"#FDECF0\" stroke=\"#BD2543\" stroke-width=\"1.6\"/><text x=\"180\" y=\"235.8\" font-size=\"10.8\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">cos(A + B) = cos A cos B − sin A sin B</text><rect x=\"30.0\" y=\"261.0\" width=\"300\" height=\"30\" rx=\"7\" fill=\"#F6F2FB\" stroke=\"#7B2CD9\" stroke-width=\"1.6\"/><text x=\"180\" y=\"279.6\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">tan(A + B) = (tan A + tan B)/(1 − tan A tan B)</text><text x=\"180\" y=\"323.6\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">Sine keeps the sign of the bracket; cosine flips it.</text><text x=\"180\" y=\"339.6\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">Check: sin 75° = (√6 + √2)/4 ≈ 0.966.</text></svg>", "t5_double": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 326\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"326\" fill=\"#ffffff\"/><text x=\"180\" y=\"28.9\" font-size=\"14\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">Double angle from one triangle</text><text x=\"180\" y=\"49.7\" font-size=\ 30\" rx=\"7\" fill=\"#FFF4DF\" stroke=\"#B66A00\" stroke-width=\"1.6\"/><text x=\"254\" y=\"198.2\" font-size=\"12\" text-anchor=\"middle\" fill=\"#B66A00\" font-weight=\"bold\">= 7/25</text><rect x=\"20.0\" y=\"229.0\" width=\"320\" height=\"30\" rx=\"7\" fill=\"#F4F4F4\" stroke=\"#999\" stroke-width=\"1.6\"/><text x=\"180\" y=\"247.7\" font-size=\"10.6\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">check: (24/25)² + (7/25)² = 1</text><text x=\"180\" y=\"291.6\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">Three forms of cos 2A: cos²A − sin²A, 2cos²A − 1, 1 − 2sin²A.</text><text x=\"180\" y=\"307.6\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">Pick the form that uses what the question gives you.</text></svg>", "t6_sincos": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 350\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"350\" fill=\"#ffffff\"/><text x=\"180\" y=\"28.9\" font-size=\"14\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">Graphs of sine and cosine</text><text x=\"180\" y=\"49.7\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">Same wave, shifted by 90°</text><path d=\"M24 198 H340\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polygon points=\"346,198 336,194 336,202\" fill=\"#333\"/><path d=\"M48 134 V240\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"330\" y=\"189.7\" font-size=\"10.5\" text-anchor=\"end\" fill=\"#333\" font-weight=\"normal\">x</text><text x=\"40\" y=\"143.7\" font-size=\"10.5\" text-anchor=\"end\" fill=\"#333\" font-weight=\"normal\">y</text><path d=\"M48 164.0 H328.0\" fill=\"none\" stroke=\"#CFCFCF\" stroke-width=\"0.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-dasharray=\"4 3\"/><path d=\"M48 232.0 H328.0\" fill=\"none\" s const flowcharts = diagrams;
const algorithms = () => syntax('algorithms');
const ALLV = {notes, programs, diagrams, flowcharts, algorithms, syntax, equations, numericals, viva, exam};
const VIEWS = U.tabs ? Object.fromEntries(U.tabs.map(k=>[k, ALLV[k]])) : U.programs ? (META.code_lang==='python' ? {notes, programs, diagrams, syntax, viva, exam} : {notes, programs, flowcharts, syntax, viva, exam}) : U.numericals ? {notes, diagrams, equations, numericals, viva, exam} : {notes, diagrams, equations, viva, exam};
function render(){
  document.getElementById('title').textContent = `${L('unit')} ${U.unit}: ${t(U.title)}`;
  document.getElementById('sub').textContent = `${t(META.name)} · ${META.code}`;
  document.getElementById('lang').textContent = S.lang==='en' ? 'ગુ' : 'EN';
  document.getElementById('lang').style.display = META.languages.includes('gu') ? '' : 'none';
  document.getElementById('tabs').innerHTML = Object.keys(VIEWS).map(k=>`<button class="tab${S.tab===k?' on':''}" data-tab="${k}">${L(k)}</button>`).join('');
  document.getElementById('view').innerHTML = VIEWS[S.tab]();
  document.querySelectorAll('#view pre.c').forEach(e=>{ e.innerHTML = hl(e.textContent); e.className='code'; });
}
let zoom = 1;
function setZoom(z){ zoom = Math.min(4, Math.max(1, z)); const w=document.getElementById('zw'); w.style.width=(zoom*100)+'%'; document.getElementById('zr').textContent=Math.round(zoom*100)+'%'; }
document.addEventListener('click', e=>{
  const q = e.target.closest('.q'); if (q && q.parentElement.querySelector('.a')) { q.parentElement.classList.toggle('open'); return; }
  const tb = e.target.closest('[data-tab]'); if (tb){ S.tab = tb.dataset.tab; render(); window.scrollTo(0,0); return; }
  if (e.target.closest('#lang')){ S.lang = S.lang==='en'?'gu':'en'; render(); return; }
  const m = e.target.closest('[data-more]');
  document.querySelectorAll('.menu.show').forEach(x=>{ if(!m || x!==m.nextElementSibling) x.classList.remove('show'); });
  if (m){ m.nextElementSibling.classList.toggle('show'); return; }
  const act = e.target.closest('[data-act]');
  if (act){ act.closest('.sec').querySelectorAll('.card').forEach(c=>{ if(c.querySelector('.a')) c.classList.toggle('open', act.dataset.act==='expand'); }); act.parentElement.classList.remove('show'); return; }
  const dg = e.target.closest('[data-dg]');
  if (dg){ const id=dg.dataset.dg; document.getElementById('mt').textContent=t(U.diagrams.find(d=>d.id===id).title); document.getElementById('zw').innerHTML=SVG[id]; setZoom(1); document.getElementById('modal').classList.add('show'); return; }
  if (e.target.closest('#mx')) document.getElementById('modal').classList.remove('show');
  if (e.target.closest('#zi')) setZoom(zoom+0.5);
  if (e.target.closest('#zo')) setZoom(zoom-0.5);
  if (e.target.closest('#zr')) setZoom(1);
});
render();
</script></body></html>
