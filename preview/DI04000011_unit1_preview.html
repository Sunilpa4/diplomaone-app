<script>
const U = {"subject": "DI04000011", "unit": 1, "format": "notes", "title": {"en": "Software Process Models"}, "weightage": 26, "hours": 11, "notes": [{"title": {"en": "1.1 Software and Application Domains"}, "items": [{"h": {"en": "Defining Software"}, "body": {"en": "\n<ul><li>Software is far more than code: <b>software = programs + documentation + configuration data + operating procedures</b> - everything needed to install, run and maintain the system.</li>\n<li>Unlike hardware, software is <b>developed or engineered, not manufactured</b> - there is no physical wearing out; it instead degrades through careless changes ('maintenance scars').</li>\n<li>Professionally, software counts as the instructions (programs) that make hardware useful, the <b>data</b> those instructions process, and the <b>documents</b> that describe both operation and use.</li>\n<li>The exam trap: \"software = set of programs\" alone earns half the marks - always add documentation and data.</li></ul>\n"}}, {"h": {"en": "Software Application Domains"}, "body": {"en": "\n<ul><li><b>System software</b>: serves other programs - operating systems, compilers, drivers, network stacks; close to the hardware and performance-critical.</li>\n<li><b>Application software</b>: solves specific business/personal needs - accounting, word processors, attendance registers.</li>\n<li><b>Embedded software</b>: firmware inside devices (ABS brakes, microwave, washing machine) - tiny, real-time and safety-sensitive.</li>\n<li><b>Web applications</b>: browser-facing sites plus cloud backends - continuous deployment, zero install.</li>\n<li><b>Artificial-Intelligence software</b>: systems that predict, recognise or recommend - built around data and models as much as code.</li>\n<li>Domain choice shapes process choice: a firmware bug can crash an anti-lock brake, so embedded work insists on V-model rigour; a web shop can ship daily with agile cadence.</li></ul>\n"}, "diagram": "se1_domains"}, {"h": {"en": "Green Hydrogen Ecosystem Software"}, "body": {"en": "\n<ul><li>Green hydrogen is produced by <b>electrolysis powered with renewable electricity</b> - its ecosystem of plants, pipelines, storage and fuel stations cannot run without software.</li>\n<li><b>Role in production:</b> software supervises electrolysers (temperature, pressure, current density), schedules runs against the solar/wind generation forecast, and logs the energy mix for 'green' certification.</li>\n<li><b>Role in distribution:</b> it optimises logistics of compressed/liquefied hydrogen - tracking tankers and pipelines, monitoring leak sensors, managing storage pressure and station inventory.</li>\n<li>Matching supply to demand (hydrogen made only when the sun shines, delivered when buses roll) is a scheduling-and-control problem - squarely a software-engineering one, and a natural fit for AI-assisted forecasting.</li>\n<li>Syllabus point to remember: hydrogen software blends <b>embedded</b> (plant controllers), <b>system</b>-level SCADA and <b>web/AI</b> dashboards - one project wielding several domains.</li></ul>\n"}}]}, {"title": {"en": "1.2 Software Engineering: Layers and the Generic Process"}, "items": [{"h": {"en": "Software Engineering - A Layered Approach"}, "body": {"en": "\n<ul><li>Definition (IEEE style): <b>software engineering</b> is the application of a systematic, disciplined, quantifiable approach to the development, operation and maintenance of software.</li>\n<li>SE is built on four layers, like a pyramid resting on its tip's support: <b>quality focus</b> (foundation), <b>process</b>, <b>methods</b>, <b>tools</b> (top).</li>\n<li>The <b>process</b> layer defines the framework - activities, milestones, when work products are checked.</li>\n<li><b>Methods</b> supply the how-to of each technical task: requirement analysis techniques, design notations, coding and testing practices.</li>\n<li><b>Tools</b> automate and enforce the methods (IDEs, version control, CI pipelines, case tools).</li></ul>\n"}, "diagram": "se1_layers"}, {"h": {"en": "Generic Process Model: Framework Activities"}, "body": {"en": "\n<ul><li>Whatever model a team selects, five <b>framework activities</b> always appear: <b>communication &rarr; planning &rarr; modeling &rarr; construction &rarr; deployment</b>.</li>\n<li><b>Communication</b>: gather what customers actually need (requirements).</li>\n<li><b>Planning</b>: turn needs into scope, estimates, schedule and risk plans.</li>\n<li><b>Modeling</b>: analysis and design - model logic, data, interfaces before writing code.</li>\n<li><b>Construction</b>: code generation and testing.</li>\n<li><b>Deployment</b>: delivery, training and ongoing support. Then the cycle repeats via feedback.</li>\n<li>Each process model (waterfall, spiral, Scrum...) is simply a different <b>serialisation</b> of these same five.</li></ul>\n"}, "diagram": "se1_framework"}, {"h": {"en": "Umbrella Activities"}, "body": {"en": "\n<ul><li>Umbrella activities run <b>parallel to and across</b> all framework steps - they 'hold the umbrella' over the project:</li>\n<li><b>Project tracking and control</b> - is the schedule honest?</li>\n<li><b>Risk management</b> - what could hurt us, and what is plan B?</li>\n<li><b>Software quality assurance (SQA)</b> - are work products and processes up to standard?</li>\n<li><b>Measurement/metrics</b> - numbers about progress and quality for decisions.</li>\n<li><b>Configuration &amp; change management</b> - one controlled copy of every artifact, every change reviewed.</li>\n<li>Exam phrasing: framework activities advance the SOFTWARE; umbrella activities protect the PROJECT.</li></ul>\n"}}, {"h": {"en": "Problem Statement and Bounded Scope"}, "body": {"en": "\n<ul><li><b>Practical 2:</b> define your project with a tight problem statement before touching models.</li>\n<li>Shape: <b>problem</b> (what hurts), <b>actors</b> (who feels it), <b>goal</b> (what the system will do), <b>scope boundary</b> (what it explicitly will NOT do).</li>\n<li>Example: 'Bus Reservation Mini' - let a student book a seat against posted schedules; NOT payments, NOT GPS tracking, NOT driver payroll.</li>\n<li>A bounded scope lets you pick a sensible process model (Practical 3): tiny, well-understood scope &rarr; waterfall or a single increment; fuzzy scope &rarr; prototype; high risk + big budget &rarr; spiral; customer available weekly &rarr; agile.</li></ul>\n"}}]}, {"title": {"en": "1.3 Traditional Process Models"}, "items": [{"h": {"en": "Waterfall Model"}, "body": {"en": "\n<ul><li>The grandfather model (1970): phases flow strictly downward - <b>requirements &rarr; design &rarr; implementation &rarr; testing &rarr; deployment &rarr; maintenance</b> - each starting only after the previous gate-signs-off.</li>\n<li><b>Strengths</b>: disciplined documents per phase, obvious milestones, suited to fixed, well-understood scope.</li>\n<li><b>Weaknesses</b>: working software appears late; real requirements rarely freeze; a design mistake discovered in testing forces a painful climb back upstream.</li>\n<li><b>Practical 1 board answer</b>: waterfall drawing with its staircase - learn phase names in order plus one strength and one weakness each.</li>\n<li>Pick it for: a college attendance upgrade where every rule is already on paper.</li></ul>\n"}, "diagram": "se1_waterfall"}, {"h": {"en": "Incremental Model"}, "body": {"en": "\n<ul><li>Deliver the product in <b>increments</b>: the core product ships first; each later slice runs its own mini requirements-design-code-test and adds features.</li>\n<li>Customers touch working software EARLY (like agile in spirit) and priorities shift between releases.</li>\n<li>Risk spreads over slices - a slip on increment 3 does not endanger the v1 already live.</li>\n<li>Fits staffing limits too: a small crew can finish slices one at a time.</li>\n<li>Contrast with waterfall: same phases, but repeated per slice and delivering partial products each time.</li></ul>\n"}, "diagram": "se1_incremental"}, {"h": {"en": "Prototyping Model"}, "body": {"en": "\n<ul><li>For customers who \"know it when they see it\": build a <b>quick, cheap mock</b> of key screens/behaviour, let the customer react, refine, repeat - then build the final system.</li>\n<li>Loop: gather rough requirements &rarr; quick design &rarr; build/throwaway prototype &rarr; customer evaluation &rarr; refine requirements &rarr; (repeat until clear) &rarr; full build.</li>\n<li>Flushes out hidden requirements early, when changing them is cheap.</li>\n<li>Two dangers: the customer mistakes the fragile demo for the nearly-finished product, or the rush to re-use the throwaway code drags quick-and-dirty quality into production.</li></ul>\n"}, "diagram": "se1_prototype"}, {"h": {"en": "Spiral Model"}, "body": {"en": "\n<ul><li>Boehm's model (1988): the project sweeps outward in cycles, each loop split into four quadrants - <b>planning, risk analysis, engineering, evaluation</b>.</li>\n<li>It is the first model to put <b>risk front and centre</b>: every round asks \"what could sink us, prove it explicitly\".</li>\n<li>Early loops may produce only a paper spec or prototype; later loops produce increasingly complete versions.</li>\n<li>Strength: ideal for large, expensive, risk-heavy projects. Weakness: heavier overhead - risk analysis needs expertise and each loop costs money; overkill for small classroom projects.</li></ul>\n"}, "diagram": "se1_spiral"}, {"h": {"en": "V-Model (Verification & Validation)"}, "body": {"en": "\n<ul><li>A waterfall bent into a V: every development stage on the left arm pairs with a testing stage on the right arm - requirements &harr; acceptance test, system design &harr; system test, architecture (module design) &harr; integration test; the bottom is coding.</li>\n<li>Test <b>plans</b> are written during the opposing build stage - acceptance test cases come straight out of the requirements document, long before any code exists.</li>\n<li>Verification = \"are we building the product right?\" (reviews, walkthroughs); Validation = \"are we building the right product?\" (tests against user needs).</li>\n<li>Favoured in safety- and audit-heavy domains (medical, aerospace) where each stage must be proven; inherits waterfall's rigidity for changing requirements.</li></ul>\n"}, "diagram": "se1_vmodel"}]}, {"title": {"en": "1.4 The Agile Approach"}, "items": [{"h": {"en": "Agile: Values and Principles"}, "body": {"en": "\n<ul><li>Agile (2001) answered heavyweight plans with four values: <b>working software over comprehensive documentation; responding to change over following a plan; individuals and interactions over processes and tools; customer collaboration over contract negotiation</b>.</li>\n<li>The right-hand items still matter - the left are simply valued MORE.</li>\n<li>Of the twelve principles, the heart three: satisfy the customer through early, <b>continuous delivery</b>; <b>welcome change</b>, even late; deliver working software every few <b>weeks</b>.</li>\n<li>Others to quote: working software is the primary measure of progress; close daily business-developer contact; self-organising teams; regular reflection and tuning.</li>\n<li><b>Practical 3 link:</b> agile is the right model when requirements will evolve and the customer can review a build every sprint.</li></ul>\n"}, "diagram": "se1_agile"}, {"h": {"en": "Scrum Framework"}, "body": {"en": "\n<ul><li>Scrum organises agile work into <b>sprints</b> - fixed 2-4 week timeboxes, each ending with a ship-able product increment.</li>\n<li>Artifacts: <b>product backlog</b> (every feature, prioritised by the Product Owner) &rarr; <b>sprint backlog</b> (committed slice for this sprint) &rarr; <b>increment</b> (potentially deployable outcome).</li>\n<li>Ceremonies: sprint planning, the <b>daily 15-minute stand-up</b> (what done, what next, what blocks), sprint review (demo), retrospective (process tune-up).</li>\n<li>Roles: <b>Product Owner</b> decides WHAT; <b>Developers</b> decide HOW; the <b>Scrum Master</b> clears obstacles and guards the process.</li>\n<li>The iron rule of timeboxing: scope may slip, the deadline does not.</li></ul>\n"}, "diagram": "se1_scrum"}, {"h": {"en": "Extreme Programming (XP)"}, "body": {"en": "\n<ul><li>XP pushes each good engineering practice to its extreme: if reviews help, review continuously - that is <b>pair programming</b> (two at one keyboard, one driving, one navigating).</li>\n<li><b>Test-driven development (TDD)</b>: write the failing test first, then just enough code to pass.</li>\n<li><b>Continuous integration</b>: merge and run the whole test suite several times a day.</li>\n<li><b>Refactoring</b>: improve design continuously in tiny safe steps; <b>small releases</b>: ship thin slices frequently.</li>\n<li><b>Simple design</b>: solve today's need only; plus supporting habits - collective ownership, coding standards, 40-hour sustainable pace, on-site customer.</li>\n<li>XP supplies the engineering <i>discipline</i>; Scrum the project <i>rhythm</i> - real agile teams usually blend both.</li></ul>\n"}, "diagram": "se1_xp"}]}], "syntax": [{"title": {"en": "Process Model Cheat Cards"}, "items": [{"name": {"en": "waterfall in one line"}, "f": "phases flow strictly downward:\nreq -> design -> impl -> test -> maintain\nfrozen scope only; late working software\nfixing upstream = painful", "terms": {"en": "the 1970 doc-first, one-way staircase"}}, {"name": {"en": "incremental in one line"}, "f": "core product ships first (mini-\nwaterfall per slice);\nlater increments add features on top", "terms": {"en": "early feedback without agile ceremonies"}}, {"name": {"en": "prototype in one line"}, "f": "rough req -> quick design -> demo\n-> customer reacts -> refine -> repeat\nthen real build", "terms": {"en": "learn requirements by SHOWING"}}, {"name": {"en": "spiral in one line"}, "f": "repeat quadrants: plan -->\nanalyse RISK --> engineer --> customer\nevaluates --> wider loop", "terms": {"en": "risk-driven cycles for big projects"}}, {"name": {"en": "V-model in one line"}, "f": "left arm builds (req -> design ->\ncode), right arm tests back upward -\neach stage plans its own test early", "terms": {"en": "build-test pairs; audit-friendly"}}]}, {"title": {"en": "Agile Cheat Cards"}, "items": [{"name": {"en": "agile in one line"}, "f": "values: working software > docs;\nchange response > plans; people >\nprocesses; collaboration > contract", "terms": {"en": "the 2001 manifesto - deliver often"}}, {"name": {"en": "scrum in one line"}, "f": "product backlog -> sprint backlog ->\n2-4 week sprint -> ship-able increment\n(+ daily stand-up, review, retro)", "terms": {"en": "timeboxed agile by Scrum Master"}}, {"name": {"en": "XP in one line"}, "f": "pair programming, TDD, continuous\nintegration, refactoring, small\nreleases, simple design", "terms": {"en": "engineering discipline to the max"}}]}], "viva": [{"title": {"en": "Software and SE Foundations"}, "items": [{"q": {"en": "Define software."}, "a": {"en": "Programs + configuration data + documentation + operating procedures - not just code."}}, {"q": {"en": "How is software different from hardware?"}, "a": {"en": "It is engineered/developed, not manufactured; it does not wear out physically, though constant careless changes corrupt it."}}, {"q": {"en": "Name five application domains of software."}, "a": {"en": "System, application, embedded, web application, and AI-based software (green-hydrogen control software is a sixth in your syllabus)."}}, {"q": {"en": "Give an embedded software example."}, "a": {"en": "The ABS firmware in a car - tiny, real-time and safety-critical."}}, {"q": {"en": "What role does software play in green hydrogen production?"}, "a": {"en": "It supervises electrolysers, schedules production against renewable generation forecasts and logs the energy mix for 'green' certification."}}, {"q": {"en": "And in hydrogen distribution?"}, "a": {"en": "Tracking tankers/pipelines, watching leak sensors, managing storage pressure and station inventory - matching supply with demand."}}, {"q": {"en": "Define software engineering."}, "a": {"en": "The systematic, disciplined, quantifiable approach to developing, operating and maintaining software."}}, {"q": {"en": "Name the four SE layers in order."}, "a": {"en": "Quality focus (bedrock), process, methods, tools."}}, {"q": {"en": "Which layer is the foundation and why?"}, "a": {"en": "Quality focus - every other layer exists to protect the quality of the final product."}}, {"q": {"en": "List the five generic framework activities."}, "a": {"en": "Communication, planning, modeling, construction, deployment."}}, {"q": {"en": "What umbrella activities span a project?"}, "a": {"en": "Tracking and control, risk management, SQA, metrics, and configuration/change management."}}]}, {"title": {"en": "Traditional Models"}, "items": [{"q": {"en": "Framework vs umbrella activities?"}, "a": {"en": "Framework steps advance the software forward; umbrella activities protect the whole project while it advances."}}, {"q": {"en": "What is a process model?"}, "a": {"en": "A chosen arrangement/serialisation of the framework activities - how work, reviews and releases flow."}}, {"q": {"en": "Name five traditional process models."}, "a": {"en": "Waterfall, incremental, prototype, spiral and the V-model."}}, {"q": {"en": "Describe the waterfall model in one line."}, "a": {"en": "Phases proceed linearly downward - requirements to design to code to testing to maintenance - with no return path assumed."}}, {"q": {"en": "When does waterfall work best?"}, "a": {"en": "When requirements are stable, complete and well understood from day one."}}, {"q": {"en": "Waterfall's biggest weakness?"}, "a": {"en": "Working software arrives very late; fixing upstream errors mid-way is costly and awkward."}}, {"q": {"en": "What is the incremental model?"}, "a": {"en": "The product is built in slices: the core ships first, and each increment runs its own mini requirement-design-code-test to add features."}}, {"q": {"en": "Why do customers like incremental delivery?"}, "a": {"en": "They use real software early and can re-prioritise later increments based on hands-on feedback."}}, {"q": {"en": "When do you choose the prototyping model?"}, "a": {"en": "When requirements are vague - the customer will 'know it when they see it'; the disposable mock exposes true needs cheaply."}}, {"q": {"en": "What are the risks of prototyping?"}, "a": {"en": "The customer may take the demo for the finished product, or throwaway quality may leak into the final build."}}, {"q": {"en": "Explain the four quadrants of the spiral model."}, "a": {"en": "Planning, risk analysis, engineering, customer evaluation - repeated outward until delivery."}}, {"q": {"en": "Who should use the spiral model?"}, "a": {"en": "Large, expensive, risk-heavy projects; risk expertise is a prerequisite, so it is overkill for small projects."}}, {"q": {"en": "Explain the V-model pairing."}, "a": {"en": "Each build stage on the left (requirements, system design, module design, coding) pairs with a test stage on the right (acceptance, system, integration)."}}, {"q": {"en": "Verification vs validation?"}, "a": {"en": "Verification - building the product RIGHT (reviews against spec); validation - building the RIGHT product (tests against user needs)."}}, {"q": {"en": "Which model writes acceptance tests from requirements, early?"}, "a": {"en": "The V-model - test planning starts opposite the corresponding build phase."}}]}, {"title": {"en": "Agile, Scrum and XP"}, "items": [{"q": {"en": "State the four Agile Manifesto values."}, "a": {"en": "Working software over comprehensive documentation; responding to change over following a plan; individuals and interactions over processes and tools; customer collaboration over contract negotiation."}}, {"q": {"en": "Name three core agile principles."}, "a": {"en": "Early and continuous delivery of working software; welcome changing requirements; deliver working software every few weeks."}}, {"q": {"en": "What is the primary measure of progress in agile?"}, "a": {"en": "Working software."}}, {"q": {"en": "What is a sprint?"}, "a": {"en": "A fixed 2-4 week timebox in Scrum that ends with a potentially ship-able product increment."}}, {"q": {"en": "Name Scrum's three roles."}, "a": {"en": "Product Owner (decides WHAT), Developers (decide HOW), Scrum Master (removes blockers, guards the process)."}}, {"q": {"en": "What happens in a daily stand-up?"}, "a": {"en": "Each member answers: what I did, what I will do, what blocks me - in under 15 minutes, standing."}}, {"q": {"en": "Product backlog vs sprint backlog?"}, "a": {"en": "Product backlog: every desired feature, prioritised; sprint backlog: the committed slice for the current sprint."}}, {"q": {"en": "What if a sprint's scope proves too big?"}, "a": {"en": "Scope drops out of the sprint; the deadline never moves - that is timeboxing."}}, {"q": {"en": "Name four XP practices."}, "a": {"en": "Pair programming, test-driven development, continuous integration, refactoring (also small releases and simple design)."}}, {"q": {"en": "What is pair programming?"}, "a": {"en": "Two programmers at one keyboard - one drives (types), one navigates (reviews, plans), swapping frequently."}}, {"q": {"en": "What is test-driven development?"}, "a": {"en": "Write the failing test first, then write just enough code to pass it; the suite grows with every feature."}}, {"q": {"en": "Why does XP insist on small releases?"}, "a": {"en": "Thin, frequent releases keep the customer steering the product and keep regression risk tiny."}}, {"q": {"en": "Scrum vs XP - one line each."}, "a": {"en": "Scrum supplies project RHYTHM (sprints, roles, ceremonies); XP supplies engineering DISCIPLINE (TDD, pairing, refactoring)."}}, {"q": {"en": "Say a college bus-booking app must evolve weekly with user feedback - which model?"}, "a": {"en": "An agile model - Scrum with short sprints; scope is fluid and stakeholders are available."}}, {"q": {"en": "A missile-control firmware with frozen specs?"}, "a": {"en": "Waterfall or V-model: everything specified upfront, verification-heavy, audits at each phase."}}, {"q": {"en": "Requirements unclear and budget limited?"}, "a": {"en": "Prototyping - a cheap visible mock flushes out true requirements before real investment."}}, {"q": {"en": "(Practical 2) What makes a good problem statement?"}, "a": {"en": "Problem, actors, goal and an explicit boundary of what the system will NOT do - the bounded scope."}}, {"q": {"en": "(Practical 3) Task set for the incremental model?"}, "a": {"en": "Core slice first: minimal req-design-code-test, then repeat per slice; each slice is a deployable increment."}}]}], "exam_questions": [{"q": {"en": "Define software and explain its components. List the application domains of software."}, "marks": 6}, {"q": {"en": "Explain the role of software in green hydrogen production and distribution."}, "marks": 4}, {"q": {"en": "Explain the layered approach of software engineering with a diagram."}, "marks": 4}, {"q": {"en": "What is the generic process model? Explain the five framework activities."}, "marks": 6}, {"q": {"en": "Explain umbrella activities and why they run alongside the framework activities."}, "marks": 4}, {"q": {"en": "Explain the waterfall model with a diagram. State two strengths and two weaknesses."}, "marks": 6}, {"q": {"en": "Explain the incremental process model and how it differs from waterfall."}, "marks": 4}, {"q": {"en": "Explain the prototyping model with its refinement cycle."}, "marks": 4}, {"q": {"en": "Explain the spiral model with its four quadrants. Which projects suit it?"}, "marks": 6}, {"q": {"en": "Draw the V-model and explain how testing pairs with each development stage."}, "marks": 6}, {"q": {"en": "List the four values of the Agile Manifesto and explain any two."}, "marks": 4}, {"q": {"en": "Explain three principles of agile development and their effect on delivery pace."}, "marks": 3}, {"q": {"en": "Explain the Scrum framework: roles, artifacts and ceremonies."}, "marks": 6}, {"q": {"en": "Explain any four Extreme Programming (XP) practices."}, "marks": 4}, {"q": {"en": "For the project in Practical 2/3, justify your choice of process model over two alternatives."}, "marks": 4}], "tabs": ["notes", "diagrams", "syntax", "viva", "exam"], "diagrams": [{"id": "se1_domains", "title": {"en": "Software Application Domains"}, "file": "diagrams/se1_domains.svg"}, {"id": "se1_layers", "title": {"en": "Software Engineering: A Layered Approach"}, "file": "diagrams/se1_layers.svg"}, {"id": "se1_framework", "title": {"en": "Generic Process Model"}, "file": "diagrams/se1_framework.svg"}, {"id": "se1_waterfall", "title": {"en": "Waterfall Model"}, "file": "diagrams/se1_waterfall.svg"}, {"id": "se1_incremental", "title": {"en": "Incremental Model"}, "file": "diagrams/se1_incremental.svg"}, {"id": "se1_prototype", "title": {"en": "Prototyping Model"}, "file": "diagrams/se1_prototype.svg"}, {"id": "se1_spiral", "title": {"en": "Spiral Model"}, "file": "diagrams/se1_spiral.svg"}, {"id": "se1_vmodel", "title": {"en": "V-Model"}, "file": "diagrams/se1_vmodel.svg"}, {"id": "se1_agile", "title": {"en": "Agile Manifesto: The Four Values"}, "file": "diagrams/se1_agile.svg"}, {"id": "se1_scrum", "title": {"en": "Scrum Framework"}, "file": "diagrams/se1_scrum.svg"}, {"id": "se1_xp", "title": {"en": "Extreme Programming (XP)"}, "file": "diagrams/se1_xp.svg"}]};

\"180\" y=\"249.8\" font-size=\"8.0\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">the bedrock - every layer</text><text x=\"180\" y=\"260.8\" font-size=\"8.0\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">serves quality</text><rect x=\"12\" y=\"276\" width=\"336\" height=\"55\" rx=\"7\" fill=\"#E3F0FC\" stroke=\"#1565C0\" stroke-width=\"1.1\"/><text x=\"20\" y=\"294.2\" font-size=\"9.2\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">Read top-down: tools AUTOMATE methods;</text><text x=\"20\" y=\"309.2\" font-size=\"9.2\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">methods support the process; the process</text><text x=\"20\" y=\"324.2\" font-size=\"9.2\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">keeps quality on schedule.</text></svg>", "se1_framework": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 396\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"396\" fill=\"#ffffff\"/><text x=\"180\" y=\"23.1\" font-size=\"14.5\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">Generic Process Model</text><rect x=\"12.0\" y=\"59.0\" width=\"64\" height=\"30\" rx=\"7\" fill=\"#F1E8FC\" stroke=\"#7B2CD9\" stroke-width=\"1.6\"/><text x=\"44\" y=\"76.7\" font-size=\"7.8\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">Communication</text><path d=\"M78 89 L78 89\" fill=\"none\" stroke=\"#666\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polygon points=\"84.0,89.0 77.0,85.5 77.0,92.5\" fill=\"#666\"/><rect x=\"82.0\" y=\"59.0\" width=\"64\" height=\"30\" rx=\"7\" fill=\"#F1E8FC\" stroke=\"#7B2CD9\" stroke-width=\"1.6\"/><text x=\"114\" y=\"76.7\" font-size=\"7.8\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">Planning</text><path d=\"M148 89 L148 89\" fill=\"none\" stroke=\"#666\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polygon points=\"154.0,89.0 147.0,85.5 147.0,9 const KW = new Set('auto break case const continue default do else enum extern for goto if register return signed sizeof static struct switch typedef union unsigned volatile while'.split(' '));
const TY = new Set('int char float double void long short FILE size_t'.split(' '));
const PKW = new Set('False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield'.split(' '));
const PTY = new Set('int float str bool list tuple set dict complex frozenset bytes bytearray range object'.split(' '));
function hlPy(src){
  const re = /(#[^\n]*)|((?:\b[rRbBfFuU]{1,2})?(?:'{3}[\s\S]*?'{3}|"{3}[\s\S]*?"{3}|'(?:\\.|[^'\\\n])*'|"(?:\\.|[^"\\\n])*"))|(^>>>|^\.\.\.(?= ))|([A-Za-z_]\w*)(?=\s*\()|([A-Za-z_]\w*)|(\b(?:0[xXoObB][0-9a-fA-F_]+|\d[\d_]*(?:\.\d+)?(?:[eE][-+]?\d+)?j?)\b)/gm;
  let o='', last=0, m;
  while ((m = re.exec(src))){
    o += esc(src.slice(last, m.index)); last = re.lastIndex;
    const w = esc(m[0]);
    if (m[1]) o += `<span class="cm">${w}</span>`;
    else if (m[2]) o += `<span class="st">${w}</span>`;
    else if (m[3]) o += `<span class="pp">${w}</span>`;
    else if (m[4]) o += PKW.has(m[4]) ? `<span class="kw">${w}</span>` : PTY.has(m[4]) ? `<span class="ty">${w}</span>` : `<span class="fn">${w}</span>`;
    else if (m[5]) o += PKW.has(m[5]) ? `<span class="kw">${w}</span>` : PTY.has(m[5]) ? `<span class="ty">${w}</span>` : w;
    else o += `<span class="nu">${w}</span>`;
  }
  return o + esc(src.slice(last));
}
function hl(src){
  if (META.code_lang === 'python') return hlPy(src);
  const re = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(^[ \t]*#[^\n]*)|([A-Za-z_]\w*)(?=\s*\()|([A-Za-z_]\w*)|(\b\d+(?:\.\d+)?[fFlLuU]*\b)/gm;
  let o='', last=0, m;
  while ((m = re.exec(src))){
    o += esc(src.slice(last, m.index)); last = re.lastIndex;
    const w = esc(m[0]);
    if (m[1]) o += `<span class="cm">${w}</span>`;
    else if (m[2]) o += `<span class="st">${w}</span>`;
    else if (m[3]) o += `<span class="pp">${w}</span>`;
    else if (m[4]) o += KW.has(m[4]) ? `<span class="kw">${w}</span>` : TY.has(m[4]) ? `<span class="ty">${w}</span>` : `<span class="fn">${w}</span>`;
    else if (m[5]) o += KW.has(m[5]) ? `<span class="kw">${w}</span>` : TY.has(m[5]) ? `<span class="ty">${w}</span>` : w;
    else o += `<span class="nu">${w}</span>`;
  }
  return o + esc(src.slice(last));
}
const progBody = p => `<div class="pl">${L('code')}</div><pre class="code">${hl(t(p.code))}</pre><div class="pl">${L('output')}</div><pre class="out">${esc(p.out)}</pre>${p.plot?`<div class="pl">${L('plot')}</div>`+dgInline(p.plot).replace('class="dg"','class="dg pg"'):''}${p.expl?`<div class="pl">${L('expl')}</div>${fixTables(t(p.expl))}`:''}`;
const pBox = id => { const p=(U.programs||[]).find(x=>x.id===id); if(!p) return ''; return `<div class="pbox"><div class="et">${L('prog')}: ${t(p.title)}</div>${progBody(p)}</div>`; };
const exBox = id => { const n=(U.numericals||[]).find(x=>x.id===id); if(!n) return ''; return `<div class="ex"><div class="et">${L('ex')}</div><div class="eq2">${t(n.q)}</div>${fixTables(t(n.a))}</div>`; };
function notes(){
  let h = `<div class="intro"><b>${t(U.title)}</b><div>${L('unit')} ${U.unit} · ${U.weightage}% ${L('intro')} · ${U.hours} ${L('hours')}</div><div>${L(U.programs?(META.code_lang==='python'?'intropy':'introc'):'introd')}</div></div>`;
  U.notes.forEach((sec,si)=>{
    h += `<div class="sec">${head(t(sec.title))}`;
    sec.items.forEach((it,i)=>{
      const open = si===0&&i===0 ? ' open' : '';
      if (it.h) {
        h += `<div class="card${it.key?' key':''}${open}"><div class="q hd"><span class="t">${it.key?'⭐ ':''}${t(it.h)}</span>${chev}</div>
        <div class="a rn" style="padding-left:18px">${fixTables(t(it.body)).replace(/margin:0 0 10px -36px/g,'')}${it.diagram?dgInline(it.diagram):''}${(it.examples||[]).map(exBox).join('')}${(it.programs||[]).map(pBox).join('')}</div></div>`;
      } else {
        h += `<div class="card${open}"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(it.q)}</span>${chev}</div>
        <div class="a">${fixTables(t(it.a))}${it.diagram?dgInline(it.diagram):''}</div></div>`;
      }
    });
    h += `</div>`;
  });
  return h;
}
function numericals(){
  return `<div class="sec">${head(L('numericals'))}` + (U.numericals||[]).map((n,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(n.q)}</span>${chev}</div><div class="a">${fixTables(t(n.a))}</div></div>`).join('') + `</div>`;
}
function diagrams(){
  return `<div class="sec">${head(L(U.programs&&META.code_lang!=='python'?'flowcharts':'diagrams'),false)}<div style="height:10px"></div>` + U.diagrams.map((d,i)=>
    `<div class="dcard" data-dg="${d.id}"><div class="h">${i+1}. ${t(d.title)}</div>${SVG[d.id]}</div>`).join('') + `</div>`;
}
function equations(){
  return U.equations.map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><span class="fbox">${e.f}</span></span>${chev}</div>
     <div class="a"><p>${t(e.terms)}</p></div></div>`).join('') + `</div>`).join('');
}
function viva(){
  return U.viva.map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((v,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(v.q)}</span>${chev}</div><div class="a"><p>${t(v.a)}</p></div></div>`).join('') + `</div>`).join('');
}
function exam(){
  return `<div class="sec">${head(L('examhead'),false)}` + U.exam_questions.map((x,i)=>
    `<div class="card"><div class="q" style="cursor:default"><span class="n">${i+1}.</span><span class="t">${t(x.q)}</span><span class="mk">${x.marks} ${L('marks')}</span></div></div>`).join('') + `</div>`;
}
function programs(){
  return `<div class="sec">${head(L('programs'))}` + (U.programs||[]).map((p,i)=>
    `<div class="card"><div class="q hd"><span class="n">${i+1}.</span><span class="t">${t(p.title)}</span>${chev}</div><div class="a pa">${progBody(p)}</div></div>`).join('') + `</div>`;
}
function syntax(key){
  return (U[typeof key==='string'?key:'syntax']||[]).map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><pre class="code sx">${hl(e.f)}</pre></span>${chev}</div>
     <div class="a">${e.terms && t(e.terms) ? fixTables(t(e.terms)) : ''}</div></div>`).join('') + `</div>`).join('');
}
const flowcharts = diagrams;
const algorithms = () => syntax('algorithms');
const ALLV = {notes, programs, diagrams, flowcharts, algorithms, syntax, equations, numericals, viva, exam};
const VIEWS = U.tabs ? Object.fromEntries(U.tabs.map(k=>[k, ALLV[k]])) : U.programs ? (META.code_lang==='python' ? {notes, programs, diagrams, syntax, viva, exam} : {notes, programs, flowcharts, syntax, viva, exam}) : U.numericals ? {notes, diagrams, equations, numericals, viva, exam} : {notes, diagrams, equations, viva, exam};
function render(){
  document.getElementById('title').textContent = `${L('unit')} ${U.unit}: ${t(U.title)}`;
  document.getElementById('sub').textContent = `${t(META.name)} · ${META.code}`;
  document.getElementById('lang').textContent = S.lang==='en' ? 'ગુ' : 'EN';
  document.getElementById('lang').style.display = META.languages.includes('gu') ? '' : 'none';
  document.getElementById('tabs').innerHTML = Object.keys(VIEWS).map(k=>`<button class="tab${S.tab===k?' on':''}" data-tab="${k}">${L(k)}</button>`).join('');
  document.getElementById('view').innerHTML = VIEWS[S.tab]();
  document.querySelectorAll('#view pre.c').forEach(e=>{ e.innerHTML = hl(e.textContent); e.className='code'; });
}
let zoom = 1;
function setZoom(z){ zoom = Math.min(4, Math.max(1, z)); const w=document.getElementById('zw'); w.style.width=(zoom*100)+'%'; document.getElementById('zr').textContent=Math.round(zoom*100)+'%'; }
document.addEventListener('click', e=>{
  const q = e.target.closest('.q'); if (q && q.parentElement.querySelector('.a')) { q.parentElement.classList.toggle('open'); return; }
  const tb = e.target.closest('[data-tab]'); if (tb){ S.tab = tb.dataset.tab; render(); window.scrollTo(0,0); return; }
  if (e.target.closest('#lang')){ S.lang = S.lang==='en'?'gu':'en'; render(); return; }
  const m = e.target.closest('[data-more]');
  document.querySelectorAll('.menu.show').forEach(x=>{ if(!m || x!==m.nextElementSibling) x.classList.remove('show'); });
  if (m){ m.nextElementSibling.classList.toggle('show'); return; }
  const act = e.target.closest('[data-act]');
  if (act){ act.closest('.sec').querySelectorAll('.card').forEach(c=>{ if(c.querySelector('.a')) c.classList.toggle('open', act.dataset.act==='expand'); }); act.parentElement.classList.remove('show'); return; }
  const dg = e.target.closest('[data-dg]');
  if (dg){ const id=dg.dataset.dg; document.getElementById('mt').textContent=t(U.diagrams.find(d=>d.id===id).title); document.getElementById('zw').innerHTML=SVG[id]; setZoom(1); document.getElementById('modal').classList.add('show'); return; }
  if (e.target.closest('#mx')) document.getElementById('modal').classList.remove('show');
  if (e.target.closest('#zi')) setZoom(zoom+0.5);
  if (e.target.closest('#zo')) setZoom(zoom-0.5);
  if (e.target.closest('#zr')) setZoom(1);
});
render();
</script></body></html>
