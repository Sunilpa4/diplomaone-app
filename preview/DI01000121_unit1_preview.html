<style>
:root{--p:#7B2CD9;--pd:#6420B8;--lav:#EADDF7;--bg:#F3ECFA;--ink:#1d1b20}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#d8cce8;font-family:"Noto Sans Gujarati","Shruti","Nirmala UI",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink)}

.tab.on{color:#fff;border-bottom-color:#fff}
.sec{margin-bottom:14px}
.sh{background:var(--lav);display:flex;align-items:center;justify-content:space-between;padding:16px 14px 16px 18px;font-weight:800;font-size:17px;position:relative}
.more{background:none;border:0;padding:4px 6px;cursor:pointer;border-radius:50%}
.menu{display:none;position:absolute;right:12px;top:48px;background:#fff;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.18);z-index:5;overflow:hidden;min-width:150px}
.menu.show{display:block}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:12px 16px;font-size:14.5px;cursor:pointer}

.card{background:#fff;border-radius:6px;margin:0 0 8px;box-shadow:0 1px 3px rgba(60,20,110,.14)}

.chev{flex:none;transition:transform .2s;margin-top:1px}

.a{display:none;padding:0 16px 18px 52px;font-size:15.5px;line-height:1.65;color:#222}

@keyframes fd{from{opacity:0;transform:translateY(-4px)}to{opacity:1}}

.q .t .nm{display:block}
.mk{flex:none;background:#FFF1D6;color:#9A5B00;border-radius:12px;padding:2px 9px;font-size:12.5px;font-weight:800;margin-top:2px}
.ad{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:56px;background:#fff;border-top:1px solid #e3d8f0;display:flex;align-items:center;justify-content:center;gap:8px;color:#8b8199;font-size:12.5px;z-index:9}

.mh{display:flex;align-items:center;justify-content:space-between;color:#fff;padding:12px 16px;font-weight:700}

.mb{flex:1;overflow:auto;padding:10px}

.mb svg{display:block;width:100%;height:auto}
.zb{display:flex;justify-content:center;gap:14px;padding:12px}
.zb button{background:#fff;border:0;border-radius:22px;padding:8px 20px;font-size:18px;font-weight:800;color:var(--p);cursor:pointer}
.a h4{margin:14px 0 6px;color:var(--pd);font-size:15.5px}

.card.key{border-left:4px solid #2E7D32}

.a.rn .dg,.a.rn .dgc,.a.rn .tw,.a.rn .ex{margin-left:0}
.intro{margin:12px 10px;background:linear-gradient(135deg,#8E3BE8,#5B1BB0);color:#fff;border-radius:14px;padding:14px 16px}
.intro b{font-size:16px}.intro div{font-size:13px;opacity:.9;margin-top:4px}
.chips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.chips span{background:rgba(255,255,255,.18);border-radius:12px;padding:3px 10px;font-size:12px;font-weight:700}
pre.code{background:#1E1530;color:#EDE7F6;border-radius:8px;padding:10px 12px;font:13px/1.55 "JetBrains Mono",Consolas,"DejaVu Sans Mono","Noto Sans Gujarati",monospace;overflow-x:auto;margin:0 0 10px;white-space:pre;tab-size:4}
pre.out{background:#0E1B12;color:#B9F6CA;border-radius:8px;padding:10px 12px;font:13px/1.5 Consolas,"DejaVu Sans Mono",monospace;overflow-x:auto;margin:0 0 10px;white-space:pre}
.kw{color:#C792EA;font-weight:700}.ty{color:#82AAFF}.st{color:#C3E88D}.cm{color:#8E9AAF;font-style:italic}.pp{color:#F78C6C}.nu{color:#F9C46B}.fn{color:#FFCB6B}
.pl{font-size:12px;font-weight:800;color:var(--pd);margin:10px 0 4px;letter-spacing:.4px;text-transform:uppercase}

.a code{background:#F1E9FB;color:#5B1BB0;padding:1px 5px;border-radius:4px;font-family:Consolas,"DejaVu Sans Mono",monospace;font-size:.9em}
.pbox{margin:12px 0 10px;border:1.5px dashed #2E8B7A;background:#F2FBF8;border-radius:10px;padding:10px 12px}
.pbox .et{font-weight:800;color:#1F6E60;font-size:13.5px;margin-bottom:6px}
.sx{margin:6px 0 0;font-size:12.5px;padding:8px 10px}
.a.pa{padding-left:16px}
</style></head>

<script>
const U = {"subject": "DI01000121", "unit": 1, "format": "notes", "title": {"en": "Units and Measurements", "gu": "એકમો અને માપન"}, "hours": 7, "weightage": 17, "official": true, "languages": ["en", "gu"], "tabs": ["notes", "diagrams", "equations", "numericals", "viva", "exam"], "intro_text": {"en": "Unit 1 of Applied Physics: why measurement comes before every engineering decision, fundamental and derived quantities, the CGS, MKS and SI systems with their conversion factors, the vernier caliper and the micrometer screw gauge (principle, construction, reading, zero error, applications), accuracy against precision, the three families of error, absolute, relative and percentage error, error combination, and rounding with significant figures. Seventeen lecture cards, five diagrams, twenty fully solved numericals and fourteen answered practice questions.", "gu": "એપ્લાઇડ ફિઝિક્સનું યુનિટ 1: દરેક ઇજનેરી નિર્ણય પહેલાં માપન કેમ જરૂરી છે, પાયાની અને વ્યુત્પન્ન રાશિઓ, CGS, MKS અને SI પદ્ધતિઓ તથા તેમના રૂપાંતરણ અચળાંક, વર્નિયર કેલિપર અને માઇક્રોમીટર સ્ક્રુ ગેજ (સિદ્ધાંત, રચના, વાંચન, શૂન્ય ભૂલ, ઉપયોગો), ચોકસાઈ સામે પરિશુદ્ધતા, ભૂલોના ત્રણ પ્રકાર, નિરપેક્ષ, સાપેક્ષ અને ટકાવારી ભૂલ, ભૂલોનું સંયોજન અને રાઉન્ડિંગ તથા સાર્થક અંકો. સત્તર પાઠ-કાર્ડ, પાંચ આકૃતિઓ, વીસ પૂરા ઉકેલાયેલા દાખલા અને ચૌદ ઉત્તરસહિત સરાવ પ્રશ્નો."}, "notes": [{"title": {"en": "1. Measurement, Units and Physical Quantities", "gu": "1. માપન, એકમો અને ભૌતિક રાશિઓ"}, "items": [{"h": {"en": "1.1 Why measurement comes before engineering", "gu": "1.1 ઇજનેરી પહેલાં માપન કેમ જરૂરી છે"}, "body": {"en": "<h4>Definition</h4><p><b>Measurement</b> is the comparison of an unknown quantity with a fixed, accepted standard of the same kind. The result is written as a number with a unit.</p><p>A number without a unit is not a measurement: \"25\" means nothing until it is 25 mm or 25 mm².</p><h4>Where a diploma engineer measures</h4><table><tr><th>Situation</th><th>What is measured</th><th>Typical instrument</th></tr><tr><td>Shaft diameter on a lathe</td><td>outside diameter, 0.01 mm</td><td>micrometer screw gauge</td></tr><tr><td>Plate thickness before welding</td><td>thickness, 0.1 mm</td><td>vernier caliper</td></tr><tr><td>Wire used in a winding</td><td>wire diameter, 0.01 mm</td><td>screw gauge</td></tr><tr><td>Tank level in a process plant</td><td>level in metres</td><td>scale or level gauge</td></tr></table><h4>Worked example</h4><p>A drawing asks for a bore of 25.00 mm with a tolerance of ±0.02 mm. The allowed range is 24.98 mm to 25.02 mm, so the instrument chosen must at least read 0.01 mm.</p><h4>Common mistake</h4><p>Writing \"25\" on a job card. The next shift reads 25 cm instead of 25 mm and the part is scrap.</p>", "gu": "<h4>વ્યાખ્યા</h4><p><b>માપન</b> એટલે અજાણી રાશિની સરખામણી તે જ પ્રકારના નિશ્ચિત અને સ્વીકૃત માનક સાથે કરવી. પરિણામ સંખ્યા અને એકમ સાથે લખાય છે.</p><p>એકમ વગરની સંખ્યા માપન નથી: \"25\" ત્યાં સુધી અર્થહીન છે જ્યાં સુધી તે 25 mm કે 25 mm² ન લખાય.</p><h4>ડિપ્લોમા ઇજનેર ક્યાં માપે છે</h4><table><tr><th>પરિસ્થિતિ</th><th>શું માપાય</th><th>સામાન્ય સાધન</th></tr><tr><td>લેથ પર શાફ્ટનો વ્યાસ</td><td>બહારનો વ્યાસ, 0.01 mm</td><td>માઇક્રોમીટર સ્ક્રુ ગેજ</td></tr><tr><td>વેલ્ડિંગ પહેલાં પ્લેટની જાડાઈ</td><td>જાડાઈ, 0.1 mm</td><td>વર્નિયર કેલિપર</td></tr><tr><td>વાઇન્ડિંગમાં વપરાતો તાર</td><td>તારનો વ્યાસ, 0.01 mm</td><td>સ્ક્રુ ગેજ</td></tr><tr><td>પ્રોસેસ પ્લાન્ટમાં ટાંકીનું સ્તર</td><td>સ્તર મીટરમાં</td><td>સ્કેલ કે લેવલ ગેજ</td></tr></table><h4>ઉકેલાયેલ દાખલો</h4><p>ડ્રોઇંગમાં 25.00 mm બોર અને ±0.02 mm ટોલરન્સ માંગ્યું છે. માન્ય મર્યાદા 24.98 mm થી 25.02 mm છે, તેથી પસંદ કરેલ સાધન ઓછામાં ઓછું 0.01 mm વાંચી શકે તેવું હોવું જોઈએ.</p><h4>સામાન્ય ભૂલ</h4><p>જોબ કાર્ડ પર ફક્ત \"25\" લખવું. આગલી શિફ્ટ તેને 25 mm ને બદલે 25 cm વાંચે છે અને પાર્ટ કચરો બને છે.</p>"}, "syllabus_item": "1.1"}, {"h": {"en": "1.2 Fundamental and derived quantities", "gu": "1.2 પાયાની અને વ્યુત્પન્ન રાશિઓ"}, "body": {"en": "<h4>Rule</h4><p><b>Fundamental quantities</b> are independent: they are not defined from any other quantity. <b>Derived quantities</b> are built from the fundamental ones.</p><h4>The seven SI base quantities</h4><table><tr><th>Quantity</th><th>Symbol</th><th>SI unit</th><th>Unit symbol</th></tr><tr><td>length</td><td>L</td><td>metre</td><td>m</td></tr><tr><td>mass</td><td>M</td><td>kilogram</td><td>kg</td></tr><tr><td>time</td><td>T</td><td>second</td><td>s</td></tr><tr><td>electric current</td><td>I</td><td>ampere</td><td>A</td></tr><tr><td>temperature</td><td>K</td><td>kelvin</td><td>K</td></tr><tr><td>amount of substance</td><td>N</td><td>mole</td><td>mol</td></tr><tr><td>luminous intensity</td><td>J</td><td>candela</td><td>cd</td></tr></table><h4>Examples of derived quantities</h4><table><tr><th>Quantity</th><th>Formula</th><th>SI unit</th></tr><tr><td>area</td><td>length × length</td><td>m²</td></tr><tr><td>velocity</td><td>displacement / time</td><td>m/s</td></tr><tr><td>force</td><td>mass × acceleration</td><td>N = kg·m/s²</td></tr><tr><td>pressure</td><td>force / area</td><td>Pa = N/m²</td></tr><tr><td>work</td><td>force × displacement</td><td>J = N·m</td></tr><tr><td>density</td><td>mass / volume</td><td>kg/m³</td></tr></table><h4>Common mistake</h4><p>Calling force a fundamental quantity because it feels basic. It is derived: 1 N = 1 kg·m/s².</p>", "gu": "<h4>નિયમ</h4><p><b>પાયાની રાશિઓ</b> સ્વતંત્ર છે: તે બીજી કોઈ રાશિથી બનતી નથી. <b>વ્યુત્પન્ન રાશિઓ</b> પાયાની રાશિઓમાંથી બને છે.</p><h4>SIની સાત પાયાની રાશિઓ</h4><table><tr><th>રાશિ</th><th>સંજ્ઞા</th><th>SI એકમ</th><th>એકમ સંજ્ઞા</th></tr><tr><td>લંબાઈ</td><td>L</td><td>મીટર</td><td>m</td></tr><tr><td>દ્રવ્યમાન</td><td>M</td><td>કિલોગ્રામ</td><td>kg</td></tr><tr><td>સમય</td><td>T</td><td>સેકન્ડ</td><td>s</td></tr><tr><td>વિદ્યુત પ્રવાહ</td><td>I</td><td>એમ્પિયર</td><td>A</td></tr><tr><td>તાપમાન</td><td>K</td><td>કેલ્વિન</td><td>K</td></tr><tr><td>પદાર્થનો જથ્થો</td><td>N</td><td>મોલ</td><td>mol</td></tr><tr><td>પ્રકાશીય તીવ્રતા</td><td>J</td><td>કેન્ડેલા</td><td>cd</td></tr></table><h4>વ્યુત્પન્ન રાશિઓનાં ઉદાહરણ</h4><table><tr><th>રાશિ</th><th>સૂત્ર</th><th>SI એકમ</th></tr><tr><td>ક્ષેત્રફળ</td><td>લંબાઈ × લંબાઈ</td><td>m²</td></tr><tr><td>વેગ</td><td>સ્થાનાંતર / સમય</td><td>m/s</td></tr><tr><td>બળ</td><td>દ્રવ્યમાન × પ્રવર્ગ</td><td>N = kg·m/s²</td></tr><tr><td>દબાણ</td><td>બળ / ક્ષેત્રફળ</td><td>Pa = N/m²</td></tr><tr><td>કાર્ય</td><td>બળ × સ્થાનાંતર</td><td>J = N·m</td></tr><tr><td>ઘનતા</td><td>દ્રવ્યમાન / ઘનફળ</td><td>kg/m³</td></tr></table><h4>સામાન્ય ભૂલ</h4><p>બળને પાયાની રાશિ કહેવી કારણ કે તે મૂળભૂત લાગે છે. તે વ્યુત્પન્ન છે: 1 N = 1 kg·m/s².</p>"}, "syllabus_item": "1.2"}, {"h": {"en": "1.3 Systems of units: CGS, MKS and SI", "gu": "1.3 એકમ પદ્ધતિઓ: CGS, MKS અને SI"}, "body": {"en": "<h4>Rule</h4><p>A <b>system of units</b> is a complete, agreed set of base units with their multiples and sub-multiples. The three met here are CGS, MKS and SI.</p><table><tr><th>Quantity</th><th>CGS</th><th>MKS</th><th>SI</th></tr><tr><td>length</td><td>centimetre</td><td>metre</td><td>metre</td></tr><tr><td>mass</td><td>gram</td><td>kilogram</td><td>kilogram</td></tr><tr><td>time</td><td>second</td><td>second</td><td>second</td></tr><tr><td>force</td><td>dyne</td><td>newton</td><td>newton</td></tr><tr><td>work</td><td>erg</td><td>joule</td><td>joule</td></tr><tr><td>power</td><td>erg/s</td><td>watt</td><td>watt</td></tr></table><h4>Requirements of a standard unit</h4><ol><li>It must be well defined and unambiguous.</li><li>It must not change with time, place or temperature.</li><li>It must be easily reproducible in a laboratory.</li><li>It must be of a convenient size for daily use.</li><li>It must be internationally accepted.</li></ol><h4>Examples</h4><table><tr><th>Situation</th><th>System normally used</th></tr><tr><td>laboratory experiment on a small wire</td><td>CGS (cm, g, dyne)</td></tr><tr><td>machine-shop drawing</td><td>MKS/SI (mm, kg, N)</td></tr><tr><td>engineering calculation and data sheet</td><td>SI</td></tr></table><h4>Common mistake</h4><p>Mixing systems inside one calculation: 20 cm and 3 m added as 23. Convert first, then calculate.</p>", "gu": "<h4>નિયમ</h4><p><b>એકમ પદ્ધતિ</b> એટલે પાયાના એકમોનો સંપૂર્ણ, સ્વીકૃત સમૂહ અને તેના ગુણક-અપવર્તક. અહીં ત્રણ મળે છે: CGS, MKS અને SI.</p><table><tr><th>રાશિ</th><th>CGS</th><th>MKS</th><th>SI</th></tr><tr><td>લંબાઈ</td><td>સેન્ટિમીટર</td><td>મીટર</td><td>મીટર</td></tr><tr><td>દ્રવ્યમાન</td><td>ગ્રામ</td><td>કિલોગ્રામ</td><td>કિલોગ્રામ</td></tr><tr><td>સમય</td><td>સેકન્ડ</td><td>સેકન્ડ</td><td>સેકન્ડ</td></tr><tr><td>બળ</td><td>ડાઇન</td><td>ન્યૂટન</td><td>ન્યૂટન</td></tr><tr><td>કાર્ય</td><td>અર્ગ</td><td>જૂલ</td><td>જૂલ</td></tr><tr><td>શક્તિ</td><td>અર્ગ/સે</td><td>વોટ</td><td>વોટ</td></tr></table><h4>માનક એકમની શરતો</h4><ol><li>તે સ્પષ્ટ અને એકાર્થી હોવું જોઈએ.</li><li>તે સમય, સ્થળ કે તાપમાન સાથે બદલાવું ન જોઈએ.</li><li>તે પ્રયોગશાળામાં સહેલાઈથી પુનઃઉત્પાદિત થઈ શકે.</li><li>તે રોજિંદા ઉપયોગ માટે અનુકૂળ માપનું હોવું જોઈએ.</li><li>તે આંતરરાષ્ટ્રીય રીતે સ્વીકૃત હોવું જોઈએ.</li></ol><h4>ઉદાહરણો</h4><table><tr><th>પરિસ્થિતિ</th><th>સામાન્ય રીતે વપરાતી પદ્ધતિ</th></tr><tr><td>નાના તાર પર પ્રયોગશાળાનો પ્રયોગ</td><td>CGS (cm, g, ડાઇન)</td></tr><tr><td>મશીન શોપનું ડ્રોઇંગ</td><td>MKS/SI (mm, kg, N)</td></tr><tr><td>ઇજનેરી ગણતરી અને ડેટા શીટ</td><td>SI</td></tr></table><h4>સામાન્ય ભૂલ</h4><p>એક જ ગણતરીમાં પદ્ધતિઓ ભેગી કરવી: 20 cm અને 3 m ને 23 તરીકે જોડવા. પહેલાં રૂપાંતરણ કરો, પછી ગણતરી.</p>"}, "diagram": "u1_units", "syllabus_item": "1.3"}, {"h": {"en": "1.4 Interconversion of units (MKS and CGS)", "gu": "1.4 એકમોનું રૂપાંતરણ (MKS અને CGS)"}, "body": {"en": "<h4>Method</h4><ol><li>Write the quantity as a number multiplied by its unit.</li><li>Replace each unit by its equivalent in the target system.</li><li>Multiply the numbers and simplify the powers of ten.</li></ol><h4>Conversion factors worth memorising</h4><table><tr><th>Quantity</th><th>From</th><th>To</th><th>Factor</th></tr><tr><td>length</td><td>1 m</td><td>cm</td><td>100</td></tr><tr><td>mass</td><td>1 kg</td><td>g</td><td>1000</td></tr><tr><td>force</td><td>1 N</td><td>dyne</td><td>10⁵</td></tr><tr><td>work or energy</td><td>1 J</td><td>erg</td><td>10⁷</td></tr><tr><td>power</td><td>1 W</td><td>erg/s</td><td>10⁷</td></tr><tr><td>pressure</td><td>1 Pa</td><td>dyne/cm²</td><td>10</td></tr><tr><td>density</td><td>1 kg/m³</td><td>g/cm³</td><td>10⁻³</td></tr></table><h4>Worked example</h4><p>Convert 1 N into dyne. 1 N = 1 kg × 1 m/s² = 1000 g × 100 cm/s² = 10⁵ g·cm/s² = 10⁵ dyne.</p><h4>Common mistake</h4><p>Multiplying where you should divide. Going from a big unit to a small unit the number grows; from small to big it shrinks.</p>", "gu": "<h4>રીત</h4><ol><li>રાશિને સંખ્યા × એકમ તરીકે લખો.</li><li>દરેક એકમને લક્ષ્ય પદ્ધતિના સમાન મૂલ્યથી બદલો.</li><li>સંખ્યાઓનો ગુણાકાર કરો અને દશના ઘાતાંક સાદા કરો.</li></ol><h4>યાદ રાખવા જેવા રૂપાંતરણ અચળાંક</h4><table><tr><th>રાશિ</th><th>થી</th><th>સુધી</th><th>અચળાંક</th></tr><tr><td>લંબાઈ</td><td>1 m</td><td>cm</td><td>100</td></tr><tr><td>દ્રવ્યમાન</td><td>1 kg</td><td>g</td><td>1000</td></tr><tr><td>બળ</td><td>1 N</td><td>ડાઇન</td><td>10⁵</td></tr><tr><td>કાર્ય કે ઊર્જા</td><td>1 J</td><td>અર્ગ</td><td>10⁷</td></tr><tr><td>શક્તિ</td><td>1 W</td><td>અર્ગ/સે</td><td>10⁷</td></tr><tr><td>દબાણ</td><td>1 Pa</td><td>ડાઇન/cm²</td><td>10</td></tr><tr><td>ઘનતા</td><td>1 kg/m³</td><td>g/cm³</td><td>10⁻³</td></tr></table><h4>ઉકેલાયેલ દાખલો</h4><p>1 N ને ડાઇનમાં ફેરવો. 1 N = 1 kg × 1 m/s² = 1000 g × 100 cm/s² = 10⁵ g·cm/s² = 10⁵ ડાઇન.</p><h4>સામાન્ય ભૂલ</h4><p>ભાગ આપવાના સ્થાને ગુણાકાર કરવો. મોટા એકમથી નાના એકમમાં જતી વખતે સંખ્યા વધે છે; નાનાથી મોટામાં જતી વખતે ઘટે છે.</p>"}, "syllabus_item": "1.3"}, {"h": {"en": "1.5 Dimensions as a check", "gu": "1.5 પરિમાણનો ઉપયોગ ચકાસણીમાં"}, "body": {"en": "<h4>Rule</h4><p>The <b>dimensional formula</b> of a quantity shows how it is built from L, M, T (and A, K, mol, cd). Both sides of any correct equation must have the same dimensions.</p><table><tr><th>Quantity</th><th>Dimensional formula</th></tr><tr><td>area</td><td>[L²]</td></tr><tr><td>volume</td><td>[L³]</td></tr><tr><td>velocity</td><td>[L T⁻¹]</td></tr><tr><td>acceleration</td><td>[L T⁻²]</td></tr><tr><td>force</td><td>[M L T⁻²]</td></tr><tr><td>pressure or stress</td><td>[M L⁻¹ T⁻²]</td></tr><tr><td>work or energy</td><td>[M L² T⁻²]</td></tr><tr><td>surface tension</td><td>[M T⁻²]</td></tr><tr><td>coefficient of viscosity</td><td>[M L⁻¹ T⁻¹]</td></tr></table><h4>Worked check</h4><p>Check v = u + at. LHS: [L T⁻¹]. RHS: [L T⁻¹] + [L T⁻²][T] = [L T⁻¹] + [L T⁻¹]. Equal, so the equation is dimensionally correct.</p><h4>Common mistake</h4><p>Thinking a dimensional check proves an equation. It only rules out wrong ones; a missing numerical factor (2 in s = ½at²) passes the test.</p>", "gu": "<h4>નિયમ</h4><p>રાશિનું <b>પરિમાણીય સૂત્ર</b> દર્શાવે છે કે તે L, M, T (અને A, K, mol, cd)માંથી કેવી રીતે બને છે. કોઈપણ સાચા સમીકરણની બંને બાજુનાં પરિમાણ સમાન હોવાં જોઈએ.</p><table><tr><th>રાશિ</th><th>પરિમાણીય સૂત્ર</th></tr><tr><td>ક્ષેત્રફળ</td><td>[L²]</td></tr><tr><td>ઘનફળ</td><td>[L³]</td></tr><tr><td>વેગ</td><td>[L T⁻¹]</td></tr><tr><td>પ્રવર્ગ</td><td>[L T⁻²]</td></tr><tr><td>બળ</td><td>[M L T⁻²]</td></tr><tr><td>દબાણ કે પ્રતિબળ</td><td>[M L⁻¹ T⁻²]</td></tr><tr><td>કાર્ય કે ઊર્જા</td><td>[M L² T⁻²]</td></tr><tr><td>પૃષ્ઠતાણ</td><td>[M T⁻²]</td></tr><tr><td>શ્યાનતા ગુણાંક</td><td>[M L⁻¹ T⁻¹]</td></tr></table><h4>ઉકેલાયેલ ચકાસણી</h4><p>v = u + at ચકાસો. ડાબી બાજુ: [L T⁻¹]. જમણી બાજુ: [L T⁻¹] + [L T⁻²][T] = [L T⁻¹] + [L T⁻¹]. સમાન છે, તેથી સમીકરણ પરિમાણીય રીતે સાચું છે.</p><h4>સામાન્ય ભૂલ</h4><p>પરિમાણીય ચકાસણી સમીકરણ સાબિત કરે છે એમ માનવું. તે ફક્ત ખોટાં સમીકરણો કાઢી નાખે છે; ખોવાયેલો આંકડાકીય અવયવ (s = ½at²માં 2) ચકાસણી પાસ કરી જાય છે.</p>"}, "syllabus_item": "1.2"}]}, {"title": {"en": "2. Vernier Calipers and Micrometer Screw Gauge", "gu": "2. વર્નિયર કેલિપર્સ અને માઇક્રોમીટર સ્ક્રુ ગેજ"}, "items": [{"h": {"en": "2.1 Vernier calipers: principle and construction", "gu": "2.1 વર્નિયર કેલિપર્સ: સિદ્ધાંત અને રચના"}, "body": {"en": "<h4>Principle</h4><p>The vernier scale carries <i>n</i> divisions that cover <i>n − 1</i> divisions of the main scale. The difference between one main-scale division and one vernier division is the <b>least count</b>.</p><h4>Formula</h4><p><b>L.C. = 1 M.S.D. − 1 V.S.D. = (1 − (n − 1)/n) M.S.D. = M.S.D./n</b></p><h4>Construction</h4><ul><li>Main scale on a steel rule, graduated in mm.</li><li>Vernier scale on a sliding jaw.</li><li>Fixed jaw and movable jaw for outside measurement.</li><li>Two upper jaws for internal measurement.</li><li>Depth rod attached to the slider.</li></ul><h4>Worked example</h4><p>If 10 V.S.D. equal 9 M.S.D. and 1 M.S.D. = 1 mm, then L.C. = 1/10 mm = 0.1 mm.</p><h4>Common mistake</h4><p>Measuring a cylinder with the jaws pressed on a chamfer. The reading is short by the chamfer width.</p>", "gu": "<h4>સિદ્ધાંત</h4><p>વર્નિયર સ્કેલના <i>n</i> વિભાગો મુખ્ય સ્કેલના <i>n − 1</i> વિભાગોને આવરી લે છે. એક મુખ્ય વિભાગ અને એક વર્નિયર વિભાગના તફાવતને <b>લીસ્ટ કાઉન્ટ</b> કહે છે.</p><h4>સૂત્ર</h4><p><b>L.C. = 1 M.S.D. − 1 V.S.D. = (1 − (n − 1)/n) M.S.D. = M.S.D./n</b></p><h4>રચના</h4><ul><li>સ્ટીલ રૂલ પર મુખ્ય સ્કેલ, mmમાં.</li><li>સરકતા જડબા પર વર્નિયર સ્કેલ.</li><li>બહારના માપ માટે સ્થિર અને ચલ જડબું.</li><li>આંતરિક માપ માટે ઉપરનાં બે જડબાં.</li><li>સ્લાઇડર સાથે જોડાયેલ ઊંડાઈ સળિયો.</li></ul><h4>ઉકેલાયેલ દાખલો</h4><p>જો 10 V.S.D. = 9 M.S.D. અને 1 M.S.D. = 1 mm, તો L.C. = 1/10 mm = 0.1 mm.</p><h4>સામાન્ય ભૂલ</h4><p>શેમ્ફર પર જડબાં દબાવીને સિલિન્ડર માપવો. વાંચન શેમ્ફરની પહોળાઈ જેટલું ઓછું આવે છે.</p>"}, "diagram": "u1_vernier", "syllabus_item": "1.4"}, {"h": {"en": "2.2 Reading a vernier caliper", "gu": "2.2 વર્નિયર કેલિપરનું વાંચન"}, "body": {"en": "<h4>Method</h4><ol><li>Read the main scale just before the vernier zero (M.S.R.).</li><li>Find the vernier division that coincides with a main-scale line (V.C.).</li><li>Add L.C. × V.C. to M.S.R.</li><li>Correct the zero error with its sign.</li></ol><table><tr><th>Reading</th><th>M.S.R.</th><th>V.C.</th><th>L.C.</th><th>Result</th></tr><tr><td>1</td><td>2.3 cm</td><td>6</td><td>0.01 cm</td><td>2.36 cm</td></tr><tr><td>2</td><td>15 mm</td><td>4</td><td>0.1 mm</td><td>15.4 mm</td></tr><tr><td>3</td><td>0.0 mm</td><td>27</td><td>0.02 mm</td><td>0.54 mm</td></tr></table><h4>Zero error</h4><ul><li>Positive zero error: the vernier zero lies to the right of the main zero. <b>Correction = − Z.E.</b></li><li>Negative zero error: the vernier zero lies to the left. <b>Correction = + |Z.E.|</b></li></ul><h4>Worked example</h4><p>Zero error +0.03 cm and observed reading 2.36 cm give a true value of 2.36 − 0.03 = 2.33 cm.</p><h4>Common mistake</h4><p>Adding the zero error instead of subtracting it when it is positive.</p>", "gu": "<h4>રીત</h4><ol><li>વર્નિયરના શૂન્ય પહેલાંનું મુખ્ય સ્કેલ વાંચો (M.S.R.).</li><li>મુખ્ય સ્કેલની કોઈ રેખા સાથે મળતો વર્નિયર વિભાગ શોધો (V.C.).</li><li>M.S.R.માં L.C. × V.C. ઉમેરો.</li><li>શૂન્ય ભૂલને તેના ચિહ્ન સાથે સુધારો.</li></ol><table><tr><th>વાંચન</th><th>M.S.R.</th><th>V.C.</th><th>L.C.</th><th>પરિણામ</th></tr><tr><td>1</td><td>2.3 cm</td><td>6</td><td>0.01 cm</td><td>2.36 cm</td></tr><tr><td>2</td><td>15 mm</td><td>4</td><td>0.1 mm</td><td>15.4 mm</td></tr><tr><td>3</td><td>0.0 mm</td><td>27</td><td>0.02 mm</td><td>0.54 mm</td></tr></table><h4>શૂન્ય ભૂલ</h4><ul><li>ધન શૂન્ય ભૂલ: વર્નિયરનું શૂન્ય મુખ્ય શૂન્યની જમણી બાજુ હોય. <b>સુધારો = − Z.E.</b></li><li>ઋણ શૂન્ય ભૂલ: વર્નિયરનું શૂન્ય ડાબી બાજુ હોય. <b>સુધારો = + |Z.E.|</b></li></ul><h4>ઉકેલાયેલ દાખલો</h4><p>શૂન્ય ભૂલ +0.03 cm અને વાંચન 2.36 cm હોય તો સાચું મૂલ્ય 2.36 − 0.03 = 2.33 cm.</p><h4>સામાન્ય ભૂલ</h4><p>ધન શૂન્ય ભૂલ હોય ત્યારે તેને બાદ કરવાના સ્થાને ઉમેરી દેવી.</p>"}, "syllabus_item": "1.4"}, {"h": {"en": "2.3 Micrometer screw gauge", "gu": "2.3 માઇક્રોમીટર સ્ક્રુ ગેજ"}, "body": {"en": "<h4>Principle</h4><p>A screw advances by one <b>pitch</b> in one full rotation. The circular scale divides that pitch into many parts, so a small rotation gives a very small movement.</p><p><b>L.C. = pitch / number of circular-scale divisions</b></p><h4>Construction</h4><ul><li>U-shaped frame and fixed anvil.</li><li>Spindle turned by a ratchet.</li><li>Sleeve (main) scale in mm and half-mm.</li><li>Thimble with 50 or 100 divisions.</li><li>Ratchet to avoid over-tightening.</li></ul><table><tr><th>Pitch</th><th>Circular divisions</th><th>Least count</th></tr><tr><td>0.5 mm</td><td>50</td><td>0.01 mm</td></tr><tr><td>1.0 mm</td><td>100</td><td>0.01 mm</td></tr><tr><td>0.5 mm</td><td>100</td><td>0.005 mm</td></tr></table><h4>Common mistake</h4><p>Screwing until the ratchet clicks many times. The anvil digs in and the wire reads thin.</p>", "gu": "<h4>સિદ્ધાંત</h4><p>સ્ક્રુ એક પૂર્ણ ભ્રમણમાં એક <b>પિચ</b> જેટલો આગળ વધે છે. વર્તુળાકાર સ્કેલ તે પિચને ઘણા ભાગમાં વહેંચે છે, તેથી થોડું ભ્રમણ ઘણું નાનું સ્થાનાંતર આપે છે.</p><p><b>L.C. = પિચ / વર્તુળાકાર સ્કેલના વિભાગોની સંખ્યા</b></p><h4>રચના</h4><ul><li>U આકારનો ફ્રેમ અને સ્થિર એન્વિલ.</li><li>રેચિટથી ફરતો સ્પિન્ડલ.</li><li>સ્લીવ (મુખ્ય) સ્કેલ mm અને અડધા mmમાં.</li><li>50 કે 100 વિભાગવાળું થિંબલ.</li><li>વધુ કસવાથી બચવા રેચિટ.</li></ul><table><tr><th>પિચ</th><th>વર્તુળાકાર વિભાગ</th><th>લીસ્ટ કાઉન્ટ</th></tr><tr><td>0.5 mm</td><td>50</td><td>0.01 mm</td></tr><tr><td>1.0 mm</td><td>100</td><td>0.01 mm</td></tr><tr><td>0.5 mm</td><td>100</td><td>0.005 mm</td></tr></table><h4>સામાન્ય ભૂલ</h4><p>રેચિટ ઘણી વાર ક્લિક થાય ત્યાં સુધી કસવું. એન્વિલ દબાઈ જાય છે અને તારનું માપ ઓછું આવે છે.</p>"}, "diagram": "u1_micrometer", "syllabus_item": "1.4"}, {"h": {"en": "2.4 Reading a screw gauge and its errors", "gu": "2.4 સ્ક્રુ ગેજનું વાંચન અને તેની ભૂલો"}, "body": {"en": "<h4>Method</h4><ol><li>Read the sleeve scale (S.S.R.).</li><li>Read the thimble division on the reference line (C.S.R.).</li><li>Compute reading = S.S.R. + C.S.R. × L.C.</li><li>Apply the zero-error correction with its sign.</li></ol><h4>Worked example</h4><p>S.S.R. = 4.5 mm, C.S.R. = 32, L.C. = 0.01 mm, so reading = 4.5 + 0.32 = 4.82 mm. With a zero error of +0.02 mm the true diameter is 4.80 mm.</p><h4>Errors of the two instruments</h4><table><tr><th>Error</th><th>Cause</th><th>Cure</th></tr><tr><td>zero error</td><td>jaws or anvil not closing at zero</td><td>measure it and correct every reading</td></tr><tr><td>parallax error</td><td>eye not perpendicular to the scale</td><td>view straight on, use the mirror</td></tr><tr><td>wear of jaws</td><td>old instrument</td><td>calibrate against a slip gauge</td></tr><tr><td>excess pressure</td><td>screw tightened hard</td><td>use the ratchet</td></tr><tr><td>temperature</td><td>job and gauge at different temperatures</td><td>measure at 20 °C</td></tr></table><h4>Common mistake</h4><p>Reading the half-millimetre line as zero when it is visible below the thimble. The answer is then short by exactly 0.5 mm.</p>", "gu": "<h4>રીત</h4><ol><li>સ્લીવ સ્કેલ વાંચો (S.S.R.).</li><li>સંદર્ભ રેખા પરનો થિંબલ વિભાગ વાંચો (C.S.R.).</li><li>વાંચન = S.S.R. + C.S.R. × L.C. ગણો.</li><li>શૂન્ય ભૂલનો સુધારો ચિહ્ન સાથે લાગુ કરો.</li></ol><h4>ઉકેલાયેલ દાખલો</h4><p>S.S.R. = 4.5 mm, C.S.R. = 32, L.C. = 0.01 mm, તેથી વાંચન = 4.5 + 0.32 = 4.82 mm. +0.02 mm શૂન્ય ભૂલ સાથે સાચો વ્યાસ 4.80 mm.</p><h4>બંને સાધનોની ભૂલો</h4><table><tr><th>ભૂલ</th><th>કારણ</th><th>ઉપાય</th></tr><tr><td>શૂન્ય ભૂલ</td><td>જડબાં કે એન્વિલ શૂન્ય પર બંધ ન થાય</td><td>તે માપો અને દરેક વાંચન સુધારો</td></tr><tr><td>પેરાલેક્સ ભૂલ</td><td>આંખ સ્કેલને લંબ ન હોય</td><td>સીધું જુઓ, અરીસાનો ઉપયોગ કરો</td></tr><tr><td>જડબાંનો ઘસારો</td><td>જૂનું સાધન</td><td>સ્લિપ ગેજ સામે કેલિબ્રેટ કરો</td></tr><tr><td>વધુ દબાણ</td><td>સ્ક્રુ કસીને બંધ કરવો</td><td>રેચિટ વાપરો</td></tr><tr><td>તાપમાન</td><td>જોબ અને ગેજ જુદા તાપમાને</td><td>20 °C પર માપો</td></tr></table><h4>સામાન્ય ભૂલ</h4><p>થિંબલ નીચે દેખાતી અડધા મિલીમીટરની રેખાને શૂન્ય ગણવી. પછી જવાબ બરાબર 0.5 mm ઓછો આવે છે.</p>"}, "syllabus_item": "1.4"}]}, {"title": {"en": "3. Accuracy, Precision and Errors", "gu": "3. ચોકસાઈ, પરિશુદ્ધતા અને ભૂલો"}, "items": [{"h": {"en": "3.1 Accuracy and precision", "gu": "3.1 ચોકસાઈ અને પરિશુદ્ધતા"}, "body": {"en": "<h4>Definitions</h4><p><b>Accuracy</b> says how close a measured value is to the true value. <b>Precision</b> says how close repeated measurements are to each other.</p><table><tr><th>Case</th><th>Readings</th><th>True</th><th>Verdict</th></tr><tr><td>A</td><td>9.81, 9.82, 9.80</td><td>9.81</td><td>accurate and precise</td></tr><tr><td>B</td><td>9.79, 9.80, 9.79</td><td>9.81</td><td>precise but not accurate</td></tr><tr><td>C</td><td>9.60, 9.85, 9.95</td><td>9.81</td><td>neither</td></tr></table><h4>Why they differ</h4><ul><li>A wrongly zeroed instrument is precise but inaccurate.</li><li>A careless hand gives scattered readings, so the result is neither.</li><li>Calibration improves accuracy; careful technique improves precision.</li></ul><h4>Example</h4><p>An electronic balance that reads 50.02 g, 50.02 g, 50.02 g for a 49.90 g standard is precise and inaccurate; the zero must be reset.</p><h4>Common mistake</h4><p>Using the two words as synonyms. An exam answer must define both and then compare.</p>", "gu": "<h4>વ્યાખ્યાઓ</h4><p><b>ચોકસાઈ</b> દર્શાવે છે કે માપેલું મૂલ્ય સાચા મૂલ્યની કેટલું નજીક છે. <b>પરિશુદ્ધતા</b> દર્શાવે છે કે વારંવાર લીધેલાં માપન એકબીજાની કેટલાં નજીક છે.</p><table><tr><th>સ્થિતિ</th><th>વાંચન</th><th>સાચું</th><th>નિષ્કર્ષ</th></tr><tr><td>A</td><td>9.81, 9.82, 9.80</td><td>9.81</td><td>ચોકસાઈપૂર્ણ અને પરિશુદ્ધ</td></tr><tr><td>B</td><td>9.79, 9.80, 9.79</td><td>9.81</td><td>પરિશુદ્ધ પણ ચોકસાઈપૂર્ણ નહીં</td></tr><tr><td>C</td><td>9.60, 9.85, 9.95</td><td>9.81</td><td>બંને નહીં</td></tr></table><h4>બંને કેમ જુદા પડે</h4><ul><li>ખોટી રીતે ઝીરો કરેલું સાધન પરિશુદ્ધ હોય પણ ચોકસાઈપૂર્ણ નહીં.</li><li>બેદરકાર હાથ વિખરાયેલાં વાંચન આપે, તેથી પરિણામ બંને રીતે ખોટું.</li><li>કેલિબ્રેશન ચોકસાઈ સુધારે છે; કાળજીપૂર્વકની પદ્ધતિ પરિશુદ્ધતા સુધારે છે.</li></ul><h4>ઉદાહરણ</h4><p>ઇલેક્ટ્રોનિક બેલેન્સ 49.90 g માનક માટે 50.02 g, 50.02 g, 50.02 g વાંચે તો તે પરિશુદ્ધ છે પણ ચોકસાઈપૂર્ણ નથી; શૂન્ય ફરી સેટ કરવું પડશે.</p><h4>સામાન્ય ભૂલ</h4><p>બંને શબ્દોને સમાનાર્થી ગણવા. પરીક્ષાના જવાબમાં બંનેની વ્યાખ્યા આપી પછી સરખામણી કરવી.</p>"}, "diagram": "u1_accuracy", "syllabus_item": "1.5"}, {"h": {"en": "3.2 Types of errors", "gu": "3.2 ભૂલોના પ્રકાર"}, "body": {"en": "<h4>The three types</h4><table><tr><th>Type</th><th>Cause</th><th>Behaviour</th><th>Cure</th></tr><tr><td>systematic</td><td>zero error, wrong scale, wrong formula</td><td>same sign every time</td><td>calibrate, correct the formula</td></tr><tr><td>random</td><td>handling, vibration, changing temperature</td><td>scattered both ways</td><td>repeat and take the mean</td></tr><tr><td>gross</td><td>misreading, wrong unit, wrong entry</td><td>large and obvious</td><td>recheck the reading and the unit</td></tr></table><h4>Examples</h4><ul><li>Systematic: a vernier with +0.03 cm zero error reads every length 0.03 cm long.</li><li>Random: five readings of a wire diameter spread from 0.98 mm to 1.02 mm.</li><li>Gross: a 25 mm reading entered as 2.5 mm on the job card.</li></ul><h4>Common mistake</h4><p>Averaging a systematic error away. Repeating a wrongly zeroed instrument gives the same wrong answer with great confidence.</p>", "gu": "<h4>ત્રણ પ્રકાર</h4><table><tr><th>પ્રકાર</th><th>કારણ</th><th>વર્તન</th><th>ઉપાય</th></tr><tr><td>ક્રમબદ્ધ</td><td>શૂન્ય ભૂલ, ખોટો સ્કેલ, ખોટું સૂત્ર</td><td>દર વખતે એક જ ચિહ્ન</td><td>કેલિબ્રેશન, સૂત્ર સુધારો</td></tr><tr><td>યાદૃચ્છિક</td><td>હેન્ડલિંગ, કંપન, બદલાતું તાપમાન</td><td>બંને બાજુ વિખરાયેલી</td><td>વારંવાર માપી સરેરાશ લો</td></tr><tr><td>ઘોર</td><td>ખોટું વાંચન, ખોટું એકમ, ખોટી નોંધ</td><td>મોટી અને સ્પષ્ટ</td><td>વાંચન અને એકમ ફરી ચકાસો</td></tr></table><h4>ઉદાહરણો</h4><ul><li>ક્રમબદ્ધ: +0.03 cm શૂન્ય ભૂલવાળું વર્નિયર દરેક લંબાઈ 0.03 cm વધુ વાંચે.</li><li>યાદૃચ્છિક: તારના વ્યાસનાં પાંચ વાંચન 0.98 mm થી 1.02 mm સુધી વિખરાયેલાં.</li><li>ઘોર: જોબ કાર્ડ પર 25 mm વાંચન 2.5 mm લખાઈ જવું.</li></ul><h4>સામાન્ય ભૂલ</h4><p>ક્રમબદ્ધ ભૂલને સરેરાશથી દૂર કરવાનો પ્રયત્ન. ખોટી રીતે ઝીરો કરેલું સાધન વારંવાર વાપરવાથી એ જ ખોટો જવાબ આત્મવિશ્વાસ સાથે મળે.</p>"}, "syllabus_item": "1.5"}, {"h": {"en": "3.3 Absolute, relative and percentage error", "gu": "3.3 નિરપેક્ષ, સાપેક્ષ અને ટકાવારી ભૂલ"}, "body": {"en": "<h4>Formulae</h4><table><tr><th>Name</th><th>Formula</th><th>Unit</th></tr><tr><td>absolute error</td><td>Δa = |a<sub>measured</sub> − a<sub>true</sub>|</td><td>same as the quantity</td></tr><tr><td>mean absolute error</td><td>Δa<sub>mean</sub> = (Δa₁ + Δa₂ + …)/n</td><td>same as the quantity</td></tr><tr><td>relative error</td><td>Δa / a</td><td>no unit</td></tr><tr><td>percentage error</td><td>(Δa / a) × 100 %</td><td>%</td></tr></table><h4>Worked example</h4><p>A length measures 24.8 cm against a true value of 25.0 cm. Absolute error = 0.2 cm; relative error = 0.2/25.0 = 0.008; percentage error = 0.8 %.</p><h4>Errors combine, they do not cancel</h4><table><tr><th>Combination</th><th>Rule for maximum error</th></tr><tr><td>sum or difference, Z = A ± B</td><td>ΔZ = ΔA + ΔB</td></tr><tr><td>product or quotient, Z = AB or A/B</td><td>ΔZ/Z = ΔA/A + ΔB/B</td></tr><tr><td>power, Z = Aⁿ</td><td>ΔZ/Z = n (ΔA/A)</td></tr></table><h4>Common mistake</h4><p>Subtracting errors because the quantities are subtracted. A difference of two large numbers has a large relative error.</p>", "gu": "<h4>સૂત્રો</h4><table><tr><th>નામ</th><th>સૂત્ર</th><th>એકમ</th></tr><tr><td>નિરપેક્ષ ભૂલ</td><td>Δa = |a<sub>માપેલ</sub> − a<sub>સાચું</sub>|</td><td>રાશિ જેવું જ</td></tr><tr><td>સરેરાશ નિરપેક્ષ ભૂલ</td><td>Δa<sub>mean</sub> = (Δa₁ + Δa₂ + …)/n</td><td>રાશિ જેવું જ</td></tr><tr><td>સાપેક્ષ ભૂલ</td><td>Δa / a</td><td>એકમ નહીં</td></tr><tr><td>ટકાવારી ભૂલ</td><td>(Δa / a) × 100 %</td><td>%</td></tr></table><h4>ઉકેલાયેલ દાખલો</h4><p>લંબાઈ 24.8 cm મળે છે જ્યારે સાચું મૂલ્ય 25.0 cm છે. નિરપેક્ષ ભૂલ = 0.2 cm; સાપેક્ષ ભૂલ = 0.2/25.0 = 0.008; ટકાવારી ભૂલ = 0.8 %.</p><h4>ભૂલો જોડાય છે, રદ થતી નથી</h4><table><tr><th>સંયોજન</th><th>મહત્તમ ભૂલનો નિયમ</th></tr><tr><td>સરવાળો કે તફાવત, Z = A ± B</td><td>ΔZ = ΔA + ΔB</td></tr><tr><td>ગુણાકાર કે ભાગાકાર, Z = AB કે A/B</td><td>ΔZ/Z = ΔA/A + ΔB/B</td></tr><tr><td>ઘાત, Z = Aⁿ</td><td>ΔZ/Z = n (ΔA/A)</td></tr></table><h4>સામાન્ય ભૂલ</h4><p>રાશિઓ બાદ કરાય છે તેથી ભૂલો પણ બાદ કરવી. બે મોટી સંખ્યાઓના તફાવતમાં સાપેક્ષ ભૂલ મોટી થાય છે.</p>"}, "syllabus_item": "1.5"}, {"h": {"en": "3.4 Rounding off and significant figures", "gu": "3.4 રાઉન્ડિંગ ઓફ અને સાર્થક અંકો"}, "body": {"en": "<h4>Rounding rules</h4><ol><li>If the digit dropped is more than 5, add 1 to the last kept digit.</li><li>If it is less than 5, leave the last kept digit unchanged.</li><li>If it is exactly 5, make the last kept digit even.</li></ol><h4>Significant-figure rules</h4><table><tr><th>Rule</th><th>Example</th></tr><tr><td>all non-zero digits count</td><td>245 has 3</td></tr><tr><td>zeros between non-zero digits count</td><td>2.045 has 4</td></tr><tr><td>leading zeros do not count</td><td>0.0025 has 2</td></tr><tr><td>trailing zeros after a decimal count</td><td>2.500 has 4</td></tr><tr><td>trailing zeros in a whole number are ambiguous</td><td>write 2.5 × 10³</td></tr></table><h4>In calculations</h4><ul><li>Multiplication and division: keep the smallest number of significant figures.</li><li>Addition and subtraction: keep the smallest number of decimal places.</li></ul><h4>Worked example</h4><p>2.5 × 1.25 = 3.125. The inputs have 2 and 3 significant figures, so the answer is 3.1 (2 s.f.). 12.11 + 18.0 + 1.013 = 31.123 becomes 31.1.</p><h4>Common mistake</h4><p>Copying all the digits from a calculator. The extra digits claim an accuracy the instrument never had.</p>", "gu": "<h4>રાઉન્ડિંગના નિયમો</h4><ol><li>કાઢવાનો અંક 5થી મોટો હોય તો રાખેલા છેલ્લા અંકમાં 1 ઉમેરો.</li><li>તે 5થી નાનો હોય તો રાખેલો છેલ્લો અંક જેમ છે તેમ રાખો.</li><li>તે બરાબર 5 હોય તો રાખેલા છેલ્લા અંકને યુગ્મ બનાવો.</li></ol><h4>સાર્થક અંકોના નિયમો</h4><table><tr><th>નિયમ</th><th>ઉદાહરણ</th></tr><tr><td>બધા શૂન્યેતર અંક ગણાય</td><td>245માં 3</td></tr><tr><td>શૂન્યેતર અંકો વચ્ચેના શૂન્ય ગણાય</td><td>2.045માં 4</td></tr><tr><td>શરૂઆતના શૂન્ય ગણાય નહીં</td><td>0.0025માં 2</td></tr><tr><td>દશાંશ પછીના અંતિમ શૂન્ય ગણાય</td><td>2.500માં 4</td></tr><tr><td>પૂર્ણ સંખ્યામાં અંતિમ શૂન્ય અસ્પષ્ટ</td><td>2.5 × 10³ લખો</td></tr></table><h4>ગણતરીમાં</h4><ul><li>ગુણાકાર અને ભાગાકાર: સૌથી ઓછા સાર્થક અંકો રાખો.</li><li>સરવાળો અને તફાવત: સૌથી ઓછા દશાંશ સ્થાન રાખો.</li></ul><h4>ઉકેલાયેલ દાખલો</h4><p>2.5 × 1.25 = 3.125. ઇનપુટમાં 2 અને 3 સાર્થક અંક છે, તેથી જવાબ 3.1 (2 s.f.). 12.11 + 18.0 + 1.013 = 31.123 એટલે 31.1.</p><h4>સામાન્ય ભૂલ</h4><p>કેલ્ક્યુલેટરના બધા અંક ઉતારી લેવા. વધારાના અંક એ ચોકસાઈ દર્શાવે છે જે સાધનમાં કદી હતી જ નહીં.</p>"}, "diagram": "u1_sigfig", "syllabus_item": "1.5"}]}, {"title": {"en": "4. Measurement in the Workshop", "gu": "4. કાર્યશાળામાં માપન"}, "items": [{"h": {"en": "4.1 Choosing the instrument for the tolerance", "gu": "4.1 ટોલરન્સ માટે સાધનની પસંદગી"}, "body": {"en": "<h4>Rule of thumb</h4><p>The least count of the instrument should be about one tenth of the tolerance you have to check.</p><table><tr><th>Tolerance</th><th>Instrument</th><th>Least count</th></tr><tr><td>±0.5 mm</td><td>steel rule</td><td>0.5 mm</td></tr><tr><td>±0.1 mm</td><td>vernier caliper</td><td>0.02 mm</td></tr><tr><td>±0.02 mm</td><td>micrometer screw gauge</td><td>0.01 mm</td></tr><tr><td>±0.005 mm</td><td>dial gauge or air gauge</td><td>0.001 mm</td></tr></table><h4>Example</h4><p>A bearing seat is drawn 40.00 ±0.02 mm. A caliper with 0.02 mm least count can barely decide; a screw gauge with 0.01 mm is the correct choice.</p><h4>Common mistake</h4><p>Rejecting a good part because the instrument was coarse. Decide the instrument before you decide the part.</p>", "gu": "<h4>સામાન્ય નિયમ</h4><p>સાધનનું લીસ્ટ કાઉન્ટ તમારે ચકાસવાના ટોલરન્સના લગભગ દશમા ભાગ જેટલું હોવું જોઈએ.</p><table><tr><th>ટોલરન્સ</th><th>સાધન</th><th>લીસ્ટ કાઉન્ટ</th></tr><tr><td>±0.5 mm</td><td>સ્ટીલ રૂલ</td><td>0.5 mm</td></tr><tr><td>±0.1 mm</td><td>વર્નિયર કેલિપર</td><td>0.02 mm</td></tr><tr><td>±0.02 mm</td><td>માઇક્રોમીટર સ્ક્રુ ગેજ</td><td>0.01 mm</td></tr><tr><td>±0.005 mm</td><td>ડાયલ ગેજ કે એર ગેજ</td><td>0.001 mm</td></tr></table><h4>ઉદાહરણ</h4><p>બેરિંગ સીટ 40.00 ±0.02 mm છે. 0.02 mm લીસ્ટ કાઉન્ટવાળું કેલિપર ભાગ્યે જ નિર્ણય આપી શકે; 0.01 mm વાળું સ્ક્રુ ગેજ યોગ્ય પસંદગી છે.</p><h4>સામાન્ય ભૂલ</h4><p>સાધન જાડું હોવાથી સારો પાર્ટ રિજેક્ટ કરવો. પાર્ટનો નિર્ણય કરતાં પહેલાં સાધન નક્કી કરો.</p>"}, "syllabus_item": "1.4"}, {"h": {"en": "4.2 Recording a measurement correctly", "gu": "4.2 માપનની સાચી નોંધ"}, "body": {"en": "<h4>Three parts of a measurement</h4><table><tr><th>Part</th><th>Example</th><th>Why</th></tr><tr><td>number</td><td>25.04</td><td>carries the value</td></tr><tr><td>unit</td><td>mm</td><td>gives the scale</td></tr><tr><td>uncertainty</td><td>±0.01 mm</td><td>says how far to trust it</td></tr></table><h4>Good and bad entries</h4><table><tr><th>Bad entry</th><th>Problem</th><th>Good entry</th></tr><tr><td>25</td><td>no unit</td><td>25.00 mm</td></tr><tr><td>25.0437</td><td>more digits than the tool can read</td><td>25.04 mm</td></tr><tr><td>about 25</td><td>no value at all</td><td>25.04 ± 0.01 mm</td></tr></table><h4>Example</h4><p>A screw gauge reads 4.82 mm with a least count of 0.01 mm. Write 4.82 ± 0.01 mm, not 4.8 mm and not 4.8200 mm.</p><h4>Common mistake</h4><p>Writing the uncertainty as ±0.01 when the zero error was never measured.</p>", "gu": "<h4>માપનના ત્રણ ભાગ</h4><table><tr><th>ભાગ</th><th>ઉદાહરણ</th><th>કેમ</th></tr><tr><td>સંખ્યા</td><td>25.04</td><td>મૂલ્ય દર્શાવે</td></tr><tr><td>એકમ</td><td>mm</td><td>માપક્રમ આપે</td></tr><tr><td>અનિશ્ચિતતા</td><td>±0.01 mm</td><td>કેટલો ભરોસો કરવો તે કહે</td></tr></table><h4>સારી અને ખરાબ નોંધ</h4><table><tr><th>ખરાબ નોંધ</th><th>સમસ્યા</th><th>સારી નોંધ</th></tr><tr><td>25</td><td>એકમ નહીં</td><td>25.00 mm</td></tr><tr><td>25.0437</td><td>સાધન વાંચી શકે તેનાથી વધુ અંક</td><td>25.04 mm</td></tr><tr><td>લગભગ 25</td><td>કોઈ મૂલ્ય નહીં</td><td>25.04 ± 0.01 mm</td></tr></table><h4>ઉદાહરણ</h4><p>સ્ક્રુ ગેજ 4.82 mm વાંચે છે અને લીસ્ટ કાઉન્ટ 0.01 mm છે. 4.82 ± 0.01 mm લખો, 4.8 mm કે 4.8200 mm નહીં.</p><h4>સામાન્ય ભૂલ</h4><p>શૂન્ય ભૂલ માપી જ ન હોય તોપણ અનિશ્ચિતતા ±0.01 લખવી.</p>"}, "syllabus_item": "1.5"}, {"h": {"en": "4.3 Four errors that ruin a good instrument", "gu": "4.3 સારા સાધનને બગાડતી ચાર ભૂલો"}, "body": {"en": "<h4>The list</h4><table><tr><th>Error</th><th>How it happens</th><th>Cure</th></tr><tr><td>parallax</td><td>eye not square to the scale</td><td>view straight on; use the mirror</td></tr><tr><td>zero error</td><td>jaws do not close at 0.00</td><td>measure and correct it</td></tr><tr><td>temperature</td><td>part measured hot after machining</td><td>cool to 20 °C</td></tr><tr><td>pressure</td><td>jaws or spindle forced</td><td>light touch or ratchet</td></tr></table><h4>Example</h4><p>A 100 mm aluminium part measured at 60 °C reads about 0.13 mm larger than at 20 °C (α ≈ 23 × 10⁻⁶ /°C), which is more than a typical tolerance.</p><h4>Common mistake</h4><p>Blaming the instrument. Nine times out of ten the error is in the hand that holds it.</p>", "gu": "<h4>યાદી</h4><table><tr><th>ભૂલ</th><th>કેવી રીતે થાય</th><th>ઉપાય</th></tr><tr><td>પેરાલેક્સ</td><td>આંખ સ્કેલને લંબ ન હોય</td><td>સીધું જુઓ; અરીસો વાપરો</td></tr><tr><td>શૂન્ય ભૂલ</td><td>જડબાં 0.00 પર બંધ ન થાય</td><td>તે માપો અને સુધારો</td></tr><tr><td>તાપમાન</td><td>મશીનિંગ પછી ગરમ પાર્ટ માપવો</td><td>20 °C સુધી ઠંડું કરો</td></tr><tr><td>દબાણ</td><td>જડબાં કે સ્પિન્ડલ પર જોર</td><td>હળવો સ્પર્શ કે રેચિટ</td></tr></table><h4>ઉદાહરણ</h4><p>100 mm નો એલ્યુમિનિયમ પાર્ટ 60 °C પર માપતાં 20 °C કરતાં લગભગ 0.13 mm મોટો વંચાય છે (α ≈ 23 × 10⁻⁶ /°C), જે સામાન્ય ટોલરન્સ કરતાં વધુ છે.</p><h4>સામાન્ય ભૂલ</h4><p>સાધનને દોષ દેવો. દસમાંથી નવ વાર ભૂલ સાધન પકડનારા હાથમાં હોય છે.</p>"}, "syllabus_item": "1.5"}, {"h": {"en": "4.4 What the exam asks from Unit 1", "gu": "4.4 યુનિટ 1 પરથી પરીક્ષામાં શું પૂછાય"}, "body": {"en": "<h4>Question types</h4><table><tr><th>Question</th><th>What to write</th><th>Marks</th></tr><tr><td>Define fundamental and derived quantities with examples</td><td>definition + table of 4 examples each</td><td>3-4</td></tr><tr><td>Explain vernier calipers</td><td>principle, L.C. formula, construction, one reading</td><td>4-7</td></tr><tr><td>Difference between accuracy and precision</td><td>two definitions + example table</td><td>3-4</td></tr><tr><td>Numerical on error</td><td>formula, substitution, unit, % sign</td><td>3-4</td></tr><tr><td>Convert 1 N into dyne</td><td>full substitution, not just the answer</td><td>2-3</td></tr></table><h4>Time plan for a 7-mark answer</h4><ol><li>Half a page of principle and formula.</li><li>A labelled sketch (caliper or gauge).</li><li>One worked reading with zero-error correction.</li><li>One line of application in the workshop.</li></ol><h4>Common mistake</h4><p>Writing the formula and jumping to the answer. Marks are given for the substitution and the unit.</p>", "gu": "<h4>પ્રશ્નના પ્રકાર</h4><table><tr><th>પ્રશ્ન</th><th>શું લખવું</th><th>માર્ક્સ</th></tr><tr><td>પાયાની અને વ્યુત્પન્ન રાશિઓ ઉદાહરણ સાથે સમજાવો</td><td>વ્યાખ્યા + દરેકના 4 ઉદાહરણનું કોષ્ટક</td><td>3-4</td></tr><tr><td>વર્નિયર કેલિપર્સ સમજાવો</td><td>સિદ્ધાંત, L.C. સૂત્ર, રચના, એક વાંચન</td><td>4-7</td></tr><tr><td>ચોકસાઈ અને પરિશુદ્ધતાનો ભેદ</td><td>બે વ્યાખ્યા + ઉદાહરણ કોષ્ટક</td><td>3-4</td></tr><tr><td>ભૂલ પર દાખલો</td><td>સૂત્ર, આંકડા, એકમ, % ચિહ્ન</td><td>3-4</td></tr><tr><td>1 N ને ડાઇનમાં ફેરવો</td><td>ફક્ત જવાબ નહીં, પૂરું આંકડા મૂકવું</td><td>2-3</td></tr></table><h4>7 માર્કના જવાબનો સમય પ્લાન</h4><ol><li>અડધું પાનું સિદ્ધાંત અને સૂત્ર.</li><li>લેબલવાળું ચિત્ર (કેલિપર કે ગેજ).</li><li>શૂન્ય ભૂલ સુધારા સાથે એક ઉકેલાયેલ વાંચન.</li><li>કાર્યશાળામાં ઉપયોગની એક લાઇન.</li></ol><h4>સામાન્ય ભૂલ</h4><p>સૂત્ર લખીને સીધું જવાબ પર કૂદી જવું. આંકડા મૂકવા અને એકમ માટે માર્ક્સ મળે છે.</p>"}, "syllabus_item": "1.1"}]}, {"title": {"en": "5. Practice Questions with Model Answers", "gu": "5. સરાવ પ્રશ્નો અને આદર્શ જવાબો"}, "items": [{"h": {"en": "Practice 1. Define physical quantity. Distinguish between fundamental and derived quantities with two examples of each.", "gu": "સરાવ 1. ભૌતિક રાશિની વ્યાખ્યા આપો. પાયાની અને વ્યુત્પન્ન રાશિઓ વચ્ચેનો ભેદ દરેકના બે ઉદાહરણ સાથે સમજાવો."}, "body": {"en": "<p>A <b>physical quantity</b> is anything that can be measured and expressed as a number with a unit, for example 25 mm, 2.5 kg or 10 s.</p><p><b>Fundamental quantities</b> are independent: length, mass, time, electric current, temperature, amount of substance and luminous intensity.</p><p><b>Derived quantities</b> are built from fundamental ones: velocity = length/time (m/s) and force = mass × acceleration (N = kg·m/s²).</p>", "gu": "<p><b>ભૌતિક રાશિ</b> એટલે જેને માપી શકાય અને સંખ્યા તથા એકમ સાથે દર્શાવી શકાય, જેમ કે 25 mm, 2.5 kg કે 10 s.</p><p><b>પાયાની રાશિઓ</b> સ્વતંત્ર છે: લંબાઈ, દ્રવ્યમાન, સમય, વિદ્યુત પ્રવાહ, તાપમાન, પદાર્થનો જથ્થો અને પ્રકાશીય તીવ્રતા.</p><p><b>વ્યુત્પન્ન રાશિઓ</b> પાયાની રાશિઓમાંથી બને છે: વેગ = લંબાઈ/સમય (m/s) અને બળ = દ્રવ્યમાન × પ્રવર્ગ (N = kg·m/s²).</p>"}}, {"h": {"en": "Practice 2. Explain the construction and working of a vernier caliper with its least-count formula.", "gu": "સરાવ 2. વર્નિયર કેલિપરની રચના અને કાર્યપદ્ધતિ તેના લીસ્ટ કાઉન્ટ સૂત્ર સાથે સમજાવો."}, "body": {"en": "<p>A vernier caliper has a steel main scale graduated in mm, a sliding vernier scale, two jaws for outside measurement, two for inside measurement and a depth rod.</p><p>Its principle is that <i>n</i> vernier divisions cover <i>n − 1</i> main divisions, so one vernier division is shorter than one main division by M.S.D./n; that difference is the least count, L.C. = 1 M.S.D. − 1 V.S.D. = M.S.D./n.</p><p>Reading = M.S.R. + V.C. × L.C., with the zero error subtracted if it is positive. For example M.S.R. 2.3 cm, V.C. 6 and L.C. 0.01 cm give 2.36 cm.</p>", "gu": "<p>વર્નિયર કેલિપરમાં mmમાં મુખ્ય સ્કેલ, સરકતો વર્નિયર સ્કેલ, બહારના માપ માટે બે જડબાં, આંતરિક માપ માટે બે જડબાં અને ઊંડાઈનો સળિયો હોય છે.</p><p>તેનો સિદ્ધાંત એ છે કે <i>n</i> વર્નિયર વિભાગ <i>n − 1</i> મુખ્ય વિભાગ આવરે છે, તેથી એક વર્નિયર વિભાગ એક મુખ્ય વિભાગ કરતાં M.S.D./n જેટલો નાનો હોય છે; એ તફાવત જ લીસ્ટ કાઉન્ટ છે, L.C. = 1 M.S.D. − 1 V.S.D. = M.S.D./n.</p><p>વાંચન = M.S.R. + V.C. × L.C., શૂન્ય ભૂલ ધન હોય તો બાદ કરવી. દા.ત. M.S.R. 2.3 cm, V.C. 6 અને L.C. 0.01 cm માટે 2.36 cm મળે.</p>"}}, {"h": {"en": "Practice 3. Distinguish between accuracy and precision with an example.", "gu": "સરાવ 3. ચોકસાઈ અને પરિશુદ્ધતા વચ્ચેનો ભેદ ઉદાહરણ સાથે સમજાવો."}, "body": {"en": "<p><b>Accuracy</b> is how close a measurement is to the true value; <b>precision</b> is how close repeated measurements are to each other.</p><p>Example: a balance reads 50.02 g, 50.02 g and 50.02 g for a 49.90 g standard. The readings agree with each other (precise) but miss the true value (inaccurate).</p><p>Calibration improves accuracy; careful technique improves precision. A good measurement needs both.</p>", "gu": "<p><b>ચોકસાઈ</b> એ માપન સાચા મૂલ્યની કેટલું નજીક છે તે દર્શાવે; <b>પરિશુદ્ધતા</b> એ વારંવાર લીધેલાં માપન એકબીજાની કેટલાં નજીક છે તે દર્શાવે.</p><p>ઉદાહરણ: 49.90 g માનક માટે બેલેન્સ 50.02 g, 50.02 g અને 50.02 g વાંચે છે. વાંચન એકબીજા સાથે મળે છે (પરિશુદ્ધ) પણ સાચા મૂલ્યથી દૂર છે (અચોકસ).</p><p>કેલિબ્રેશન ચોકસાઈ સુધારે છે; કાળજીપૂર્વકની પદ્ધતિ પરિશુદ્ધતા સુધારે છે. સારા માપન માટે બંને જરૂરી છે.</p>"}}, {"h": {"en": "Practice 4. Explain absolute, relative and percentage error with a worked example.", "gu": "સરાવ 4. નિરપેક્ષ, સાપેક્ષ અને ટકાવારી ભૂલ ઉકેલાયેલ દાખલા સાથે સમજાવો."}, "body": {"en": "<p>Absolute error Δa = |measured − true| and carries the unit of the quantity. Relative error = Δa/a has no unit; percentage error = (Δa/a) × 100 %.</p><p>Worked example: a length measures 24.8 cm against 25.0 cm. Δa = 0.2 cm, relative error = 0.2/25.0 = 0.008 and percentage error = 0.8 %.</p><p>In a product or quotient the relative errors add: for R = V/I, ΔR/R = ΔV/V + ΔI/I.</p>", "gu": "<p>નિરપેક્ષ ભૂલ Δa = |માપેલ − સાચું| અને તે રાશિનું એકમ ધરાવે. સાપેક્ષ ભૂલ = Δa/a ને એકમ નથી; ટકાવારી ભૂલ = (Δa/a) × 100 %.</p><p>ઉકેલાયેલ દાખલો: લંબાઈ 24.8 cm મળે છે જ્યારે સાચું મૂલ્ય 25.0 cm છે. Δa = 0.2 cm, સાપેક્ષ ભૂલ = 0.2/25.0 = 0.008 અને ટકાવારી ભૂલ = 0.8 %.</p><p>ગુણાકાર કે ભાગાકારમાં સાપેક્ષ ભૂલો ઉમેરાય છે: R = V/I માટે ΔR/R = ΔV/V + ΔI/I.</p>"}}, {"h": {"en": "Practice 5. State the rules for rounding off and for counting significant figures.", "gu": "સરાવ 5. રાઉન્ડિંગ ઓફ અને સાર્થક અંકો ગણવાના નિયમો જણાવો."}, "body": {"en": "<p>Rounding: if the digit dropped is more than 5, increase the last kept digit by 1; if it is less than 5, leave it; if it is exactly 5, make the last kept digit even.</p><p>Significant figures: all non-zero digits count, zeros between them count, leading zeros do not, trailing zeros after a decimal do. So 0.00250 has three and 2.500 has four.</p><p>In calculations, multiplication and division keep the smallest number of significant figures, while addition and subtraction keep the smallest number of decimal places.</p>", "gu": "<p>રાઉન્ડિંગ: કાઢવાનો અંક 5થી મોટો હોય તો છેલ્લા અંકમાં 1 ઉમેરો; 5થી નાનો હોય તો તેમ રાખો; બરાબર 5 હોય તો છેલ્લા અંકને યુગ્મ બનાવો.</p><p>સાર્થક અંકો: બધા શૂન્યેતર અંક ગણાય, વચ્ચેના શૂન્ય ગણાય, શરૂઆતના શૂન્ય ગણાય નહીં, દશાંશ પછીના અંતિમ શૂન્ય ગણાય. તેથી 0.00250માં ત્રણ અને 2.500માં ચાર.</p><p>ગણતરીમાં ગુણાકાર અને ભાગાકારમાં સૌથી ઓછા સાર્થક અંક રાખવા, જ્યારે સરવાળા અને તફાવતમાં સૌથી ઓછા દશાંશ સ્થાન રાખવાં.</p>"}}, {"h": {"en": "Practice 6. Convert 1 N into dyne and 1 J into erg, showing every step.", "gu": "સરાવ 6. 1 N ને ડાઇનમાં અને 1 J ને અર્ગમાં દરેક પગલું દર્શાવીને ફેરવો."}, "body": {"en": "<p>1 N = 1 kg × 1 m/s² = 1000 g × 100 cm/s² = 10⁵ g·cm/s² = 10⁵ dyne.</p><p>1 J = 1 N × 1 m = 10⁵ dyne × 100 cm = 10⁷ dyne·cm = 10⁷ erg.</p><p>The rule is to replace every MKS unit by its CGS equivalent and then multiply the numbers. Because force carries L and M, both factors of 100 and 1000 enter, which is why the answer is 10⁵ and not 10³.</p><p>Write the unit at every step: 1 N = 10⁵ dyne and 1 J = 10⁷ erg are worth memorising, but an exam answer needs the substitution that produces them.</p>", "gu": "<p>1 N = 1 kg × 1 m/s² = 1000 g × 100 cm/s² = 10⁵ g·cm/s² = 10⁵ ડાઇન.</p><p>1 J = 1 N × 1 m = 10⁵ ડાઇન × 100 cm = 10⁷ ડાઇન·cm = 10⁷ અર્ગ.</p><p>નિયમ એ છે કે દરેક MKS એકમને CGS સમાન મૂલ્યથી બદલીને પછી સંખ્યાઓનો ગુણાકાર કરવો. બળમાં L અને M બંને આવે છે, તેથી 100 અને 1000 એમ બંને અવયવ ગણાય, અને તેથી જ જવાબ 10³ નહીં પણ 10⁵ આવે.</p><p>દરેક પગલે એકમ લખો: 1 N = 10⁵ ડાઇન અને 1 J = 10⁷ અર્ગ યાદ રાખવા જેવા છે, પણ પરીક્ષાના જવાબમાં તે ઉત્પન્ન કરતું આંકડા મૂકવાનું જરૂરી છે.</p>"}}, {"h": {"en": "Practice 7. A vernier caliper reads M.S.R. 15 mm, V.C. 4 and has L.C. 0.1 mm. Find the length.", "gu": "સરાવ 7. વર્નિયર કેલિપર M.S.R. 15 mm, V.C. 4 વાંચે છે અને L.C. 0.1 mm છે. લંબાઈ શોધો."}, "body": {"en": "<p>Reading = M.S.R. + V.C. × L.C. = 15 + 4 × 0.1</p><p>= 15 + 0.4 = 15.4 mm</p><p>If the instrument had a zero error of +0.1 mm, the true length would be 15.3 mm.</p><p>The reading is written 15.4 ± 0.1 mm. The uncertainty is the least count, because no reading taken with this instrument can be trusted beyond one tenth of a millimetre.</p>", "gu": "<p>વાંચન = M.S.R. + V.C. × L.C. = 15 + 4 × 0.1</p><p>= 15 + 0.4 = 15.4 mm</p><p>જો સાધનમાં +0.1 mm શૂન્ય ભૂલ હોય તો સાચી લંબાઈ 15.3 mm થાય.</p><p>વાંચન 15.4 ± 0.1 mm લખાય. અનિશ્ચિતતા લીસ્ટ કાઉન્ટ જેટલી છે, કારણ કે આ સાધનથી લીધેલું કોઈ પણ વાંચન એક મિલીમીટરના દશમા ભાગથી વધુ ભરોસાપાત્ર નથી.</p>"}}, {"h": {"en": "Practice 8. A screw gauge has pitch 0.5 mm and 100 divisions. Find its least count and read S.S.R. 3.0 mm with C.S.R. 45.", "gu": "સરાવ 8. સ્ક્રુ ગેજની પિચ 0.5 mm અને 100 વિભાગ છે. લીસ્ટ કાઉન્ટ શોધો અને S.S.R. 3.0 mm તથા C.S.R. 45 વાંચન શોધો."}, "body": {"en": "<p>L.C. = pitch/divisions = 0.5/100 = 0.005 mm</p><p>Reading = 3.0 + 45 × 0.005 = 3.0 + 0.225 = 3.225 mm</p><p>With three decimal places the answer is written 3.225 ± 0.005 mm. Do not round it to 3.23 mm: that would throw away the very resolution the 100-division thimble was bought for.</p><p>A coarser gauge of pitch 0.5 mm and 50 divisions would have given the same reading as 3.21 mm or 3.24 mm, so the choice of instrument decides the answer.</p>", "gu": "<p>L.C. = પિચ/વિભાગ = 0.5/100 = 0.005 mm</p><p>વાંચન = 3.0 + 45 × 0.005 = 3.0 + 0.225 = 3.225 mm</p><p>ત્રણ દશાંશ સ્થાન સાથે જવાબ 3.225 ± 0.005 mm લખાય. તેને 3.23 mm સુધી રાઉન્ડ ન કરો: એમ કરવાથી 100 વિભાગવાળા થિંબલની જે ઝીણવટ માટે ખરીદી કરી હતી તે જ ખોવાઈ જાય.</p><p>0.5 mm પિચ અને 50 વિભાગવાળું જાડું ગેજ એ જ વાંચન 3.21 mm કે 3.24 mm તરીકે આપત, તેથી સાધનની પસંદગી જ જવાબ નક્કી કરે છે.</p>"}}, {"h": {"en": "Practice 9. Explain why the least count of the instrument must suit the tolerance.", "gu": "સરાવ 9. સાધનનું લીસ્ટ કાઉન્ટ ટોલરન્સને અનુરૂપ કેમ હોવું જોઈએ તે સમજાવો."}, "body": {"en": "<p>If the least count is coarser than the tolerance, two different readings can fall inside the same scale division, so a good part may be rejected or a bad one accepted.</p><p>The rule of thumb is that the least count should be about one tenth of the tolerance: for ±0.02 mm use a gauge reading 0.002 mm or better; a 0.01 mm screw gauge is the practical choice.</p><p>Cost is the other side: a 0.001 mm instrument costs several times more, so it is used only where the drawing demands it.</p>", "gu": "<p>જો લીસ્ટ કાઉન્ટ ટોલરન્સ કરતાં જાડું હોય તો બે જુદાં વાંચન એક જ વિભાગમાં આવી શકે, તેથી સારો પાર્ટ રિજેક્ટ થાય કે ખરાબ પાર્ટ પાસ થાય.</p><p>સામાન્ય નિયમ એ છે કે લીસ્ટ કાઉન્ટ ટોલરન્સના લગભગ દશમા ભાગનું હોવું જોઈએ: ±0.02 mm માટે 0.002 mm કે તેથી સારું વાંચતું ગેજ વાપરો; 0.01 mm સ્ક્રુ ગેજ વ્યવહારુ પસંદગી છે.</p><p>બીજી બાજુ ખર્ચ છે: 0.001 mm સાધન ઘણા ગણું મોંઘું છે, તેથી તે ફક્ત ત્યાં વપરાય જ્યાં ડ્રોઇંગ માંગે.</p>"}}, {"h": {"en": "Practice 10. Name four errors that spoil a measurement even when the instrument is good, with one cure each.", "gu": "સરાવ 10. સાધન સારું હોવા છતાં માપન બગાડતી ચાર ભૂલો તેમના એક-એક ઉપાય સાથે જણાવો."}, "body": {"en": "<p><b>Parallax:</b> the eye is not square to the scale, so the pointer appears shifted; cure - view straight on or use the mirror behind the pointer.</p><p><b>Zero error:</b> jaws do not close at 0.00; cure - measure the zero error and correct every reading. <b>Temperature:</b> a hot part is larger; cure - allow it to cool to 20 °C.</p><p><b>Excess pressure:</b> the spindle or jaws are forced and the part reads small; cure - use the ratchet and a light touch.</p>", "gu": "<p><b>પેરાલેક્સ:</b> આંખ સ્કેલને લંબ ન હોવાથી દર્શક સરકેલો દેખાય; ઉપાય - સીધું જુઓ કે દર્શક પાછળનો અરીસો વાપરો.</p><p><b>શૂન્ય ભૂલ:</b> જડબાં 0.00 પર બંધ ન થાય; ઉપાય - શૂન્ય ભૂલ માપી દરેક વાંચન સુધારો. <b>તાપમાન:</b> ગરમ પાર્ટ મોટો હોય; ઉપાય - 20 °C સુધી ઠંડો કરો.</p><p><b>વધુ દબાણ:</b> સ્પિન્ડલ કે જડબાં પર જોર પડે તો માપ ઓછું આવે; ઉપાય - રેચિટ અને હળવો સ્પર્શ વાપરો.</p>"}}, {"h": {"en": "Practice 11. Why is dimensional analysis useful, and what can it not prove?", "gu": "સરાવ 11. પરિમાણીય વિશ્લેષણ કેમ ઉપયોગી છે અને તે શું સાબિત કરી શકતું નથી?"}, "body": {"en": "<p>It is a quick check: both sides of a correct equation must have the same dimensions, so a wrong formula is caught before any numbers are put in.</p><p>It cannot prove an equation, because a missing numerical factor passes the test: s = ut + ½at² and s = ut + at² are both dimensionally correct.</p><p>It also cannot check equations that contain trigonometric, exponential or logarithmic functions, since those quantities are dimensionless.</p>", "gu": "<p>તે ઝડપી ચકાસણી છે: સાચા સમીકરણની બંને બાજુનાં પરિમાણ સમાન હોવાં જોઈએ, તેથી આંકડા મૂકતાં પહેલાં જ ખોટું સૂત્ર પકડાઈ જાય.</p><p>તે સમીકરણ સાબિત કરી શકતું નથી, કારણ કે ખોવાયેલો આંકડાકીય અવયવ ચકાસણી પાસ કરી જાય: s = ut + ½at² અને s = ut + at² બંને પરિમાણીય રીતે સાચાં છે.</p><p>તે ત્રિકોણમિતીય, ઘાતાંકીય કે લઘુગણકીય વિધેયોવાળાં સમીકરણો પણ ચકાસી શકતું નથી, કારણ કે તે રાશિઓ પરિમાણરહિત હોય છે.</p>"}}, {"h": {"en": "Practice 12. A student records a length as 25.0437 mm from a vernier of least count 0.02 mm. Comment.", "gu": "સરાવ 12. વિદ્યાર્થી 0.02 mm લીસ્ટ કાઉન્ટવાળા વર્નિયરથી લંબાઈ 25.0437 mm નોંધે છે. ટીકા કરો."}, "body": {"en": "<p>The recording claims an accuracy of 0.0001 mm, which a 0.02 mm instrument cannot give. The extra digits are not measurements; they are calculator output.</p><p>The correct record is 25.04 ± 0.02 mm, which states the value, the unit and the uncertainty.</p><p>Marks are lost for extra digits in the practical exam, because they show the instrument was not understood.</p>", "gu": "<p>નોંધ 0.0001 mm ની ચોકસાઈ દર્શાવે છે, જે 0.02 mm સાધન આપી શકતું નથી. વધારાના અંક માપન નથી; તે કેલ્ક્યુલેટરનું પરિણામ છે.</p><p>સાચી નોંધ 25.04 ± 0.02 mm છે, જે મૂલ્ય, એકમ અને અનિશ્ચિતતા દર્શાવે છે.</p><p>પ્રેક્ટિકલ પરીક્ષામાં વધારાના અંકો માટે માર્ક્સ જાય છે, કારણ કે તે દર્શાવે છે કે સાધન સમજાયું નથી.</p>"}}, {"h": {"en": "Practice 13. Convert 5 km into cm and 3 hours into seconds, showing the method.", "gu": "સરાવ 13. 5 km ને cm માં અને 3 કલાકને સેકન્ડમાં ફેરવો, રીત દર્શાવો."}, "body": {"en": "<p>5 km = 5 × 1000 m = 5000 m = 5000 × 100 cm = 5 × 10⁵ cm.</p><p>3 h = 3 × 60 min = 180 min = 180 × 60 s = 10 800 s.</p><p>Keep the units with the numbers at every step; that is what stops a factor of 100 or 60 from going missing.</p><p>The same chain works backwards: 5 × 10⁵ cm ÷ 100 gives 5000 m, and ÷ 1000 gives 5 km. A conversion is only finished when the old unit has disappeared.</p>", "gu": "<p>5 km = 5 × 1000 m = 5000 m = 5000 × 100 cm = 5 × 10⁵ cm.</p><p>3 કલાક = 3 × 60 મિનિટ = 180 મિનિટ = 180 × 60 સેકન્ડ = 10 800 સેકન્ડ.</p><p>દરેક પગલે સંખ્યા સાથે એકમ રાખો; તેથી જ 100 કે 60 નો અવયવ ખોવાતો નથી.</p><p>એ જ સાંકળ ઊંધી દિશામાં પણ ચાલે: 5 × 10⁵ cm ÷ 100 એટલે 5000 m, અને ÷ 1000 એટલે 5 km. રૂપાંતરણ ત્યારે જ પૂરું ગણાય જ્યારે જૂનું એકમ રહે જ નહીં.</p>"}}, {"h": {"en": "Practice 14. Define least count and state the least count of the vernier and the screw gauge used in your laboratory.", "gu": "સરાવ 14. લીસ્ટ કાઉન્ટની વ્યાખ્યા આપો અને તમારી પ્રયોગશાળાના વર્નિયર તથા સ્ક્રુ ગેજનું લીસ્ટ કાઉન્ટ જણાવો."}, "body": {"en": "<p>The <b>least count</b> is the smallest measurement an instrument can read. For a vernier it is M.S.D./n, and for a screw gauge it is pitch/divisions.</p><p>The usual laboratory vernier (50 divisions over 49 mm) has L.C. 0.02 mm, and the usual screw gauge (pitch 0.5 mm, 50 divisions) has L.C. 0.01 mm.</p><p>A smaller least count means a finer reading, which is why the gauge is used for wire diameters and the caliper for plate thickness.</p>", "gu": "<p><b>લીસ્ટ કાઉન્ટ</b> એ સાધન વાંચી શકે તેવું સૌથી નાનું માપ છે. વર્નિયર માટે તે M.S.D./n અને સ્ક્રુ ગેજ માટે પિચ/વિભાગ છે.</p><p>સામાન્ય પ્રયોગશાળાના વર્નિયર (49 mm પર 50 વિભાગ)નું L.C. 0.02 mm અને સામાન્ય સ્ક્રુ ગેજ (પિચ 0.5 mm, 50 વિભાગ)નું L.C. 0.01 mm હોય છે.</p><p>નાનું લીસ્ટ કાઉન્ટ એટલે ઝીણું વાંચન, તેથી તારના વ્યાસ માટે ગેજ અને પ્લેટની જાડાઈ માટે કેલિપર વપરાય.</p>"}}]}], "diagrams": [{"id": "u1_units", "title": {"en": "SI base units and what they measure", "gu": "SI પાયાના એકમો અને તે શું માપે છે"}, "file": "diagrams/u1_units.svg", "caption": {"en": "The seven SI base units, with the derived units a diploma engineer uses every day.", "gu": "સાત SI પાયાના એકમો અને દરરોજ વપરાતા વ્યુત્પન્ન એકમો."}}, {"id": "u1_vernier", "title": {"en": "Reading a vernier caliper: 2.36 cm", "gu": "વર્નિયર કેલિપરનું વાંચન: 2.36 cm"}, "file": "diagrams/u1_vernier.svg", "caption": {"en": "A 2.36 cm vernier reading: main scale 2.3 cm plus 6 × 0.01 cm.", "gu": "2.36 cm નું વર્નિયર વાંચન: મુખ્ય સ્કેલ 2.3 cm ઉપર 6 × 0.01 cm."}}, {"id": "u1_micrometer", "title": {"en": "Reading a screw gauge: 4.82 mm", "gu": "સ્ક્રુ ગેજનું વાંચન: 4.82 mm"}, "file": "diagrams/u1_micrometer.svg", "caption": {"en": "A 4.82 mm screw-gauge reading: sleeve 4.5 mm plus 32 × 0.01 mm.", "gu": "4.82 mm નું સ્ક્રુ ગેજ વાંચન: સ્લીવ 4.5 mm ઉપર 32 × 0.01 mm."}}, {"id": "u1_accuracy", "title": {"en": "Accuracy and precision compared", "gu": "ચોકસાઈ અને પરિશુદ્ધતાની સરખામણી"}, "file": "diagrams/u1_accuracy.svg", "caption": {"en": "Four habits of measurement compared with one true value.", "gu": "એક જ સાચા મૂલ્ય સામે માપનની ચાર આદતો."}}, {"id": "u1_sigfig", "title": {"en": "How many digits do you keep?", "gu": "કેટલા અંક રાખવા?"}, "file": "diagrams/u1_sigfig.svg", "caption": {"en": "How many digits to keep in a product and in a sum.", "gu": "ગુણાકાર અને સરવાળામાં કેટલા અંક રાખવા."}}], "equations": [{"title": {"en": "Units and conversion", "gu": "એકમો અને રૂપાંતરણ"}, "items": [{"name": {"en": "Metre into centimetre", "gu": "મીટરથી સેન્ટિમીટર"}, "f": "1 m = 100 cm;  1 kg = 1000 g", "terms": {"en": "Multiply when going to a smaller unit.", "gu": "નાના એકમમાં જતી વખતે ગુણાકાર કરો."}}, {"name": {"en": "Newton into dyne", "gu": "ન્યૂટનથી ડાઇન"}, "f": "1 N = 10⁵ dyne", "terms": {"en": "kg·m/s² into g·cm/s².", "gu": "kg·m/s² થી g·cm/s²."}}, {"name": {"en": "Joule into erg", "gu": "જૂલથી અર્ગ"}, "f": "1 J = 10⁷ erg", "terms": {"en": "N·m into dyne·cm.", "gu": "N·m થી ડાઇન·cm."}}, {"name": {"en": "Watt into erg per second", "gu": "વોટથી અર્ગ પ્રતિ સેકન્ડ"}, "f": "1 W = 10⁷ erg/s", "terms": {"en": "Power keeps the same factor of 10⁷.", "gu": "શક્તિમાં પણ 10⁷ નો જ અવયવ રહે."}}, {"name": {"en": "Pascal into dyne per cm²", "gu": "પાસ્કલથી ડાઇન પ્રતિ cm²"}, "f": "1 Pa = 10 dyne/cm²", "terms": {"en": "Pressure is force divided by area, so both factors count.", "gu": "દબાણ = બળ/ક્ષેત્રફળ, તેથી બંને અવયવ ગણાય."}}, {"name": {"en": "Density", "gu": "ઘનતા"}, "f": "1 g/cm³ = 1000 kg/m³", "terms": {"en": "The most common slip in workshop calculations.", "gu": "કાર્યશાળાની ગણતરીમાં સૌથી સામાન્ય ભૂલ."}}]}, {"title": {"en": "Instruments and errors", "gu": "સાધનો અને ભૂલો"}, "items": [{"name": {"en": "Vernier least count", "gu": "વર્નિયર લીસ્ટ કાઉન્ટ"}, "f": "L.C. = 1 M.S.D. − 1 V.S.D. = M.S.D./n", "terms": {"en": "n vernier divisions cover n − 1 main divisions.", "gu": "n વર્નિયર વિભાગ n − 1 મુખ્ય વિભાગ આવરે છે."}}, {"name": {"en": "Vernier reading", "gu": "વર્નિયર વાંચન"}, "f": "reading = M.S.R. + V.C. × L.C. − zero error", "terms": {"en": "Subtract a positive zero error, add a negative one.", "gu": "ધન શૂન્ય ભૂલ બાદ કરો, ઋણ ઉમેરો."}}, {"name": {"en": "Screw-gauge least count", "gu": "સ્ક્રુ ગેજ લીસ્ટ કાઉન્ટ"}, "f": "L.C. = pitch / circular divisions", "terms": {"en": "0.5 mm pitch over 50 divisions gives 0.01 mm.", "gu": "0.5 mm પિચ 50 વિભાગ પર એટલે 0.01 mm."}}, {"name": {"en": "Screw-gauge reading", "gu": "સ્ક્રુ ગેજ વાંચન"}, "f": "reading = S.S.R. + C.S.R. × L.C. − zero error", "terms": {"en": "Sleeve first, thimble second.", "gu": "પહેલાં સ્લીવ, પછી થિંબલ."}}, {"name": {"en": "Percentage error", "gu": "ટકાવારી ભૂલ"}, "f": "(Δa / a) × 100 %", "terms": {"en": "Δa is the absolute error, taken positive.", "gu": "Δa નિરપેક્ષ ભૂલ છે, હંમેશા ધન."}}, {"name": {"en": "Errors in a product or quotient", "gu": "ગુણાકાર કે ભાગાકારની ભૂલ"}, "f": "ΔZ/Z = ΔA/A + ΔB/B", "terms": {"en": "Relative errors add; they never cancel.", "gu": "સાપેક્ષ ભૂલો ઉમેરાય છે; ક્યારેય રદ થતી નથી."}}, {"name": {"en": "Error in a power", "gu": "ઘાતમાં ભૂલ"}, "f": "Z = Aⁿ → ΔZ/Z = n (ΔA/A)", "terms": {"en": "The power multiplies the relative error.", "gu": "ઘાત સાપેક્ષ ભૂલને ગુણે છે."}}]}], "numericals": [{"id": "u1n01", "unit": 1, "h": {"en": "Convert 1 N into dyne.", "gu": "1 N ને ડાઇનમાં ફેરવો."}, "q": {"en": "Convert 1 newton into the CGS unit of force.", "gu": "1 ન્યૂટનને બળના CGS એકમમાં ફેરવો."}, "a": {"en": "<h4>Given and assumptions</h4><p>Convert 1 newton into the CGS unit of force.</p><h4>Step-by-step solution</h4><p>1 N = 1 kg × 1 m/s²</p><p>= (1000 g) × (100 cm/s²) = 10⁵ g·cm/s²</p><p>g·cm/s² is the dyne, so 1 N = 10⁵ dyne.</p><h4>Answer</h4><p><b>1 N = 10⁵ dyne</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>1 ન્યૂટનને બળના CGS એકમમાં ફેરવો.</p><h4>પગલાવાર ઉકેલ</h4><p>1 N = 1 kg × 1 m/s²</p><p>= (1000 g) × (100 cm/s²) = 10⁵ g·cm/s²</p><p>g·cm/s² એ ડાઇન છે, તેથી 1 N = 10⁵ ડાઇન.</p><h4>જવાબ</h4><p><b>1 N = 10⁵ ડાઇન</b></p>"}, "answer": {"en": "1 N = 10⁵ dyne", "gu": "1 N = 10⁵ ડાઇન"}}, {"id": "u1n02", "unit": 1, "h": {"en": "Convert 1 J into erg.", "gu": "1 J ને અર્ગમાં ફેરવો."}, "q": {"en": "Convert one joule into the CGS unit of work.", "gu": "1 જૂલને કાર્યના CGS એકમમાં ફેરવો."}, "a": {"en": "<h4>Given and assumptions</h4><p>Convert one joule into the CGS unit of work.</p><h4>Step-by-step solution</h4><p>1 J = 1 N × 1 m = 10⁵ dyne × 100 cm</p><p>= 10⁷ dyne·cm = 10⁷ erg</p><h4>Answer</h4><p><b>1 J = 10⁷ erg</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>1 જૂલને કાર્યના CGS એકમમાં ફેરવો.</p><h4>પગલાવાર ઉકેલ</h4><p>1 J = 1 N × 1 m = 10⁵ ડાઇન × 100 cm</p><p>= 10⁷ ડાઇન·cm = 10⁷ અર્ગ</p><h4>જવાબ</h4><p><b>1 J = 10⁷ અર્ગ</b></p>"}, "answer": {"en": "1 J = 10⁷ erg", "gu": "1 J = 10⁷ અર્ગ"}}, {"id": "u1n03", "unit": 1, "h": {"en": "Convert 1 W into erg/s.", "gu": "1 W ને અર્ગ/સેમાં ફેરવો."}, "q": {"en": "Convert one watt into the CGS unit of power.", "gu": "1 વોટને શક્તિના CGS એકમમાં ફેરવો."}, "a": {"en": "<h4>Given and assumptions</h4><p>Convert one watt into the CGS unit of power.</p><h4>Step-by-step solution</h4><p>1 W = 1 J/s = 10⁷ erg / 1 s</p><p>= 10⁷ erg/s</p><h4>Answer</h4><p><b>1 W = 10⁷ erg/s</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>1 વોટને શક્તિના CGS એકમમાં ફેરવો.</p><h4>પગલાવાર ઉકેલ</h4><p>1 W = 1 J/s = 10⁷ અર્ગ / 1 s</p><p>= 10⁷ અર્ગ/સે</p><h4>જવાબ</h4><p><b>1 W = 10⁷ અર્ગ/સે</b></p>"}, "answer": {"en": "1 W = 10⁷ erg/s", "gu": "1 W = 10⁷ અર્ગ/સે"}}, {"id": "u1n04", "unit": 1, "h": {"en": "Convert 2.7 g/cm³ into kg/m³.", "gu": "2.7 g/cm³ ને kg/m³ માં ફેરવો."}, "q": {"en": "The density of aluminium is 2.7 g/cm³. Express it in SI units.", "gu": "એલ્યુમિનિયમની ઘનતા 2.7 g/cm³ છે. તેને SI એકમમાં દર્શાવો."}, "a": {"en": "<h4>Given and assumptions</h4><p>The density of aluminium is 2.7 g/cm³. Express it in SI units.</p><h4>Step-by-step solution</h4><p>1 g/cm³ = 10⁻³ kg / 10⁻⁶ m³ = 10³ kg/m³</p><p>So 2.7 g/cm³ = 2.7 × 10³ = 2700 kg/m³.</p><h4>Answer</h4><p><b>2700 kg/m³</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>એલ્યુમિનિયમની ઘનતા 2.7 g/cm³ છે. તેને SI એકમમાં દર્શાવો.</p><h4>પગલાવાર ઉકેલ</h4><p>1 g/cm³ = 10⁻³ kg / 10⁻⁶ m³ = 10³ kg/m³</p><p>તેથી 2.7 g/cm³ = 2.7 × 10³ = 2700 kg/m³.</p><h4>જવાબ</h4><p><b>2700 kg/m³</b></p>"}, "answer": {"en": "2700 kg/m³", "gu": "2700 kg/m³"}}, {"id": "u1n05", "unit": 1, "h": {"en": "Convert 72 km/h into m/s.", "gu": "72 km/h ને m/s માં ફેરવો."}, "q": {"en": "A truck runs at 72 km/h. What is its speed in SI units?", "gu": "એક ટ્રક 72 km/h ઝડપે દોડે છે. SI એકમમાં તેની ઝડપ કેટલી?"}, "a": {"en": "<h4>Given and assumptions</h4><p>A truck runs at 72 km/h. What is its speed in SI units?</p><h4>Step-by-step solution</h4><p>72 km/h = 72 × (1000 m / 3600 s)</p><p>= 72 × (5/18) = 20 m/s</p><h4>Answer</h4><p><b>20 m/s</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>એક ટ્રક 72 km/h ઝડપે દોડે છે. SI એકમમાં તેની ઝડપ કેટલી?</p><h4>પગલાવાર ઉકેલ</h4><p>72 km/h = 72 × (1000 m / 3600 s)</p><p>= 72 × (5/18) = 20 m/s</p><h4>જવાબ</h4><p><b>20 m/s</b></p>"}, "answer": {"en": "20 m/s", "gu": "20 m/s"}}, {"id": "u1n06", "unit": 1, "h": {"en": "Least count when 10 V.S.D. = 9 M.S.D. (1 M.S.D. = 1 mm).", "gu": "જ્યારે 10 V.S.D. = 9 M.S.D. (1 M.S.D. = 1 mm) ત્યારે લીસ્ટ કાઉન્ટ."}, "q": {"en": "A vernier has 10 divisions covering 9 main-scale divisions of 1 mm each. Find its least count.", "gu": "વર્નિયરના 10 વિભાગ 1 mmના 9 મુખ્ય વિભાગો આવરે છે. તેનું લીસ્ટ કાઉન્ટ શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A vernier has 10 divisions covering 9 main-scale divisions of 1 mm each. Find its least count.</p><h4>Step-by-step solution</h4><p>L.C. = 1 M.S.D. − 1 V.S.D. = 1 mm − 0.9 mm</p><p>= 0.1 mm = 0.01 cm</p><h4>Answer</h4><p><b>L.C. = 0.1 mm</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>વર્નિયરના 10 વિભાગ 1 mmના 9 મુખ્ય વિભાગો આવરે છે. તેનું લીસ્ટ કાઉન્ટ શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>L.C. = 1 M.S.D. − 1 V.S.D. = 1 mm − 0.9 mm</p><p>= 0.1 mm = 0.01 cm</p><h4>જવાબ</h4><p><b>L.C. = 0.1 mm</b></p>"}, "answer": {"en": "L.C. = 0.1 mm", "gu": "L.C. = 0.1 mm"}}, {"id": "u1n07", "unit": 1, "h": {"en": "Least count when 20 V.S.D. = 19 M.S.D.", "gu": "જ્યારે 20 V.S.D. = 19 M.S.D. ત્યારે લીસ્ટ કાઉન્ટ."}, "q": {"en": "A vernier with 20 divisions coincides with 19 mm. Find the least count.", "gu": "20 વિભાગવાળું વર્નિયર 19 mm સાથે મળે છે. લીસ્ટ કાઉન્ટ શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A vernier with 20 divisions coincides with 19 mm. Find the least count.</p><h4>Step-by-step solution</h4><p>1 V.S.D. = 19/20 mm = 0.95 mm</p><p>L.C. = 1 − 0.95 = 0.05 mm</p><h4>Answer</h4><p><b>L.C. = 0.05 mm</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>20 વિભાગવાળું વર્નિયર 19 mm સાથે મળે છે. લીસ્ટ કાઉન્ટ શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>1 V.S.D. = 19/20 mm = 0.95 mm</p><p>L.C. = 1 − 0.95 = 0.05 mm</p><h4>જવાબ</h4><p><b>L.C. = 0.05 mm</b></p>"}, "answer": {"en": "L.C. = 0.05 mm", "gu": "L.C. = 0.05 mm"}}, {"id": "u1n08", "unit": 1, "h": {"en": "Least count when 50 V.S.D. = 49 M.S.D.", "gu": "જ્યારે 50 V.S.D. = 49 M.S.D. ત્યારે લીસ્ટ કાઉન્ટ."}, "q": {"en": "A precision vernier has 50 divisions over 49 mm. Find its least count.", "gu": "ચોકસાઈવાળા વર્નિયરના 50 વિભાગ 49 mm પર છે. લીસ્ટ કાઉન્ટ શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A precision vernier has 50 divisions over 49 mm. Find its least count.</p><h4>Step-by-step solution</h4><p>L.C. = M.S.D./n = 1/50 mm</p><p>= 0.02 mm</p><h4>Answer</h4><p><b>L.C. = 0.02 mm</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>ચોકસાઈવાળા વર્નિયરના 50 વિભાગ 49 mm પર છે. લીસ્ટ કાઉન્ટ શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>L.C. = M.S.D./n = 1/50 mm</p><p>= 0.02 mm</p><h4>જવાબ</h4><p><b>L.C. = 0.02 mm</b></p>"}, "answer": {"en": "L.C. = 0.02 mm", "gu": "L.C. = 0.02 mm"}}, {"id": "u1n09", "unit": 1, "h": {"en": "Vernier reading: M.S.R. 2.3 cm, V.C. 6, L.C. 0.01 cm.", "gu": "વર્નિયર વાંચન: M.S.R. 2.3 cm, V.C. 6, L.C. 0.01 cm."}, "q": {"en": "A vernier caliper shows a main-scale reading of 2.3 cm and the 6th vernier division coincides. The least count is 0.01 cm. Find the length.", "gu": "વર્નિયર કેલિપરમાં મુખ્ય સ્કેલનું વાંચન 2.3 cm છે અને 6ઠ્ઠો વર્નિયર વિભાગ મળે છે. લીસ્ટ કાઉન્ટ 0.01 cm છે. લંબાઈ શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A vernier caliper shows a main-scale reading of 2.3 cm and the 6th vernier division coincides. The least count is 0.01 cm. Find the length.</p><h4>Step-by-step solution</h4><p>Reading = M.S.R. + V.C. × L.C.</p><p>= 2.3 + 6 × 0.01 = 2.3 + 0.06</p><p>= 2.36 cm</p><h4>Answer</h4><p><b>2.36 cm</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>વર્નિયર કેલિપરમાં મુખ્ય સ્કેલનું વાંચન 2.3 cm છે અને 6ઠ્ઠો વર્નિયર વિભાગ મળે છે. લીસ્ટ કાઉન્ટ 0.01 cm છે. લંબાઈ શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>વાંચન = M.S.R. + V.C. × L.C.</p><p>= 2.3 + 6 × 0.01 = 2.3 + 0.06</p><p>= 2.36 cm</p><h4>જવાબ</h4><p><b>2.36 cm</b></p>"}, "answer": {"en": "2.36 cm", "gu": "2.36 cm"}}, {"id": "u1n10", "unit": 1, "h": {"en": "Zero error +0.03 cm, observed 2.36 cm.", "gu": "શૂન્ય ભૂલ +0.03 cm, વાંચન 2.36 cm."}, "q": {"en": "The vernier above has a positive zero error of 0.03 cm. Find the true length.", "gu": "ઉપરના વર્નિયરમાં 0.03 cm ધન શૂન્ય ભૂલ છે. સાચી લંબાઈ શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>The vernier above has a positive zero error of 0.03 cm. Find the true length.</p><h4>Step-by-step solution</h4><p>True value = observed − zero error</p><p>= 2.36 − 0.03 = 2.33 cm</p><h4>Answer</h4><p><b>2.33 cm</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>ઉપરના વર્નિયરમાં 0.03 cm ધન શૂન્ય ભૂલ છે. સાચી લંબાઈ શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>સાચું મૂલ્ય = વાંચન − શૂન્ય ભૂલ</p><p>= 2.36 − 0.03 = 2.33 cm</p><h4>જવાબ</h4><p><b>2.33 cm</b></p>"}, "answer": {"en": "2.33 cm", "gu": "2.33 cm"}}, {"id": "u1n11", "unit": 1, "h": {"en": "Zero error −0.02 cm, observed 5.48 cm.", "gu": "શૂન્ય ભૂલ −0.02 cm, વાંચન 5.48 cm."}, "q": {"en": "A caliper has a negative zero error of 0.02 cm and reads 5.48 cm. Find the true length.", "gu": "કેલિપરમાં 0.02 cm ઋણ શૂન્ય ભૂલ છે અને વાંચન 5.48 cm છે. સાચી લંબાઈ શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A caliper has a negative zero error of 0.02 cm and reads 5.48 cm. Find the true length.</p><h4>Step-by-step solution</h4><p>True value = observed + |zero error|</p><p>= 5.48 + 0.02 = 5.50 cm</p><h4>Answer</h4><p><b>5.50 cm</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>કેલિપરમાં 0.02 cm ઋણ શૂન્ય ભૂલ છે અને વાંચન 5.48 cm છે. સાચી લંબાઈ શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>સાચું મૂલ્ય = વાંચન + |શૂન્ય ભૂલ|</p><p>= 5.48 + 0.02 = 5.50 cm</p><h4>જવાબ</h4><p><b>5.50 cm</b></p>"}, "answer": {"en": "5.50 cm", "gu": "5.50 cm"}}, {"id": "u1n12", "unit": 1, "h": {"en": "Least count of a screw gauge: pitch 0.5 mm, 50 divisions.", "gu": "સ્ક્રુ ગેજનું લીસ્ટ કાઉન્ટ: પિચ 0.5 mm, 50 વિભાગ."}, "q": {"en": "A screw gauge has a pitch of 0.5 mm and 50 circular divisions. Find its least count.", "gu": "સ્ક્રુ ગેજની પિચ 0.5 mm અને 50 વર્તુળાકાર વિભાગ છે. તેનું લીસ્ટ કાઉન્ટ શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A screw gauge has a pitch of 0.5 mm and 50 circular divisions. Find its least count.</p><h4>Step-by-step solution</h4><p>L.C. = pitch / number of divisions</p><p>= 0.5/50 = 0.01 mm</p><h4>Answer</h4><p><b>L.C. = 0.01 mm</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>સ્ક્રુ ગેજની પિચ 0.5 mm અને 50 વર્તુળાકાર વિભાગ છે. તેનું લીસ્ટ કાઉન્ટ શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>L.C. = પિચ / વિભાગોની સંખ્યા</p><p>= 0.5/50 = 0.01 mm</p><h4>જવાબ</h4><p><b>L.C. = 0.01 mm</b></p>"}, "answer": {"en": "L.C. = 0.01 mm", "gu": "L.C. = 0.01 mm"}}, {"id": "u1n13", "unit": 1, "h": {"en": "Screw-gauge reading: S.S.R. 4.5 mm, C.S.R. 32, L.C. 0.01 mm.", "gu": "સ્ક્રુ ગેજ વાંચન: S.S.R. 4.5 mm, C.S.R. 32, L.C. 0.01 mm."}, "q": {"en": "The sleeve reads 4.5 mm and the thimble shows 32 divisions. The least count is 0.01 mm. Find the diameter.", "gu": "સ્લીવ 4.5 mm વાંચે છે અને થિંબલ 32 વિભાગ દર્શાવે છે. લીસ્ટ કાઉન્ટ 0.01 mm છે. વ્યાસ શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>The sleeve reads 4.5 mm and the thimble shows 32 divisions. The least count is 0.01 mm. Find the diameter.</p><h4>Step-by-step solution</h4><p>Reading = S.S.R. + C.S.R. × L.C.</p><p>= 4.5 + 32 × 0.01 = 4.5 + 0.32</p><p>= 4.82 mm</p><h4>Answer</h4><p><b>4.82 mm</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>સ્લીવ 4.5 mm વાંચે છે અને થિંબલ 32 વિભાગ દર્શાવે છે. લીસ્ટ કાઉન્ટ 0.01 mm છે. વ્યાસ શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>વાંચન = S.S.R. + C.S.R. × L.C.</p><p>= 4.5 + 32 × 0.01 = 4.5 + 0.32</p><p>= 4.82 mm</p><h4>જવાબ</h4><p><b>4.82 mm</b></p>"}, "answer": {"en": "4.82 mm", "gu": "4.82 mm"}}, {"id": "u1n14", "unit": 1, "h": {"en": "Zero error +0.02 mm, reading 4.82 mm.", "gu": "શૂન્ય ભૂલ +0.02 mm, વાંચન 4.82 mm."}, "q": {"en": "The gauge above has a zero error of +0.02 mm. Find the true diameter.", "gu": "ઉપરના ગેજમાં +0.02 mm શૂન્ય ભૂલ છે. સાચો વ્યાસ શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>The gauge above has a zero error of +0.02 mm. Find the true diameter.</p><h4>Step-by-step solution</h4><p>True diameter = 4.82 − 0.02</p><p>= 4.80 mm</p><h4>Answer</h4><p><b>4.80 mm</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>ઉપરના ગેજમાં +0.02 mm શૂન્ય ભૂલ છે. સાચો વ્યાસ શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>સાચો વ્યાસ = 4.82 − 0.02</p><p>= 4.80 mm</p><h4>જવાબ</h4><p><b>4.80 mm</b></p>"}, "answer": {"en": "4.80 mm", "gu": "4.80 mm"}}, {"id": "u1n15", "unit": 1, "h": {"en": "Percentage error when 9.80 m/s² is measured against 9.81 m/s².", "gu": "9.81 m/s² સામે 9.80 m/s² માપતાં ટકાવારી ભૂલ."}, "q": {"en": "An experiment gives g = 9.80 m/s². The accepted value is 9.81 m/s². Find the absolute, relative and percentage error.", "gu": "પ્રયોગમાં g = 9.80 m/s² મળે છે. સ્વીકૃત મૂલ્ય 9.81 m/s² છે. નિરપેક્ષ, સાપેક્ષ અને ટકાવારી ભૂલ શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>An experiment gives g = 9.80 m/s². The accepted value is 9.81 m/s². Find the absolute, relative and percentage error.</p><h4>Step-by-step solution</h4><p>Absolute error = |9.80 − 9.81| = 0.01 m/s²</p><p>Relative error = 0.01/9.81 = 1.02 × 10⁻³</p><p>Percentage error = 0.102 % ≈ 0.10 %</p><h4>Answer</h4><p><b>0.01 m/s²; 1.02 × 10⁻³; 0.10 %</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>પ્રયોગમાં g = 9.80 m/s² મળે છે. સ્વીકૃત મૂલ્ય 9.81 m/s² છે. નિરપેક્ષ, સાપેક્ષ અને ટકાવારી ભૂલ શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>નિરપેક્ષ ભૂલ = |9.80 − 9.81| = 0.01 m/s²</p><p>સાપેક્ષ ભૂલ = 0.01/9.81 = 1.02 × 10⁻³</p><p>ટકાવારી ભૂલ = 0.102 % ≈ 0.10 %</p><h4>જવાબ</h4><p><b>0.01 m/s²; 1.02 × 10⁻³; 0.10 %</b></p>"}, "answer": {"en": "0.01 m/s²; 1.02 × 10⁻³; 0.10 %", "gu": "0.01 m/s²; 1.02 × 10⁻³; 0.10 %"}}, {"id": "u1n16", "unit": 1, "h": {"en": "Resistance from V = 100 ± 2 V and I = 5.0 ± 0.1 A.", "gu": "V = 100 ± 2 V અને I = 5.0 ± 0.1 A પરથી અવરોધ."}, "q": {"en": "The voltage across a resistor is 100 ± 2 V and the current is 5.0 ± 0.1 A. Find the resistance with its percentage error.", "gu": "એક રેઝિસ્ટર પરનો વોલ્ટેજ 100 ± 2 V અને પ્રવાહ 5.0 ± 0.1 A છે. અવરોધ અને તેની ટકાવારી ભૂલ શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>The voltage across a resistor is 100 ± 2 V and the current is 5.0 ± 0.1 A. Find the resistance with its percentage error.</p><h4>Step-by-step solution</h4><p>R = V/I = 100/5.0 = 20 Ω</p><p>ΔV/V = 2/100 = 2 %, ΔI/I = 0.1/5.0 = 2 %</p><p>ΔR/R = 2 % + 2 % = 4 %, so ΔR = 0.04 × 20 = 0.8 Ω</p><p>R = 20 ± 0.8 Ω</p><h4>Answer</h4><p><b>20 ± 0.8 Ω (4 %)</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>એક રેઝિસ્ટર પરનો વોલ્ટેજ 100 ± 2 V અને પ્રવાહ 5.0 ± 0.1 A છે. અવરોધ અને તેની ટકાવારી ભૂલ શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>R = V/I = 100/5.0 = 20 Ω</p><p>ΔV/V = 2/100 = 2 %, ΔI/I = 0.1/5.0 = 2 %</p><p>ΔR/R = 2 % + 2 % = 4 %, તેથી ΔR = 0.04 × 20 = 0.8 Ω</p><p>R = 20 ± 0.8 Ω</p><h4>જવાબ</h4><p><b>20 ± 0.8 Ω (4 %)</b></p>"}, "answer": {"en": "20 ± 0.8 Ω (4 %)", "gu": "20 ± 0.8 Ω (4 %)"}}, {"id": "u1n17", "unit": 1, "h": {"en": "Density of a block: m = 250.0 ± 0.5 g, V = 50.0 ± 0.5 cm³.", "gu": "બ્લોકની ઘનતા: m = 250.0 ± 0.5 g, V = 50.0 ± 0.5 cm³."}, "q": {"en": "A metal block has mass 250.0 ± 0.5 g and volume 50.0 ± 0.5 cm³. Find the density and its percentage error.", "gu": "ધાતુના બ્લોકનું દ્રવ્યમાન 250.0 ± 0.5 g અને ઘનફળ 50.0 ± 0.5 cm³ છે. ઘનતા અને તેની ટકાવારી ભૂલ શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A metal block has mass 250.0 ± 0.5 g and volume 50.0 ± 0.5 cm³. Find the density and its percentage error.</p><h4>Step-by-step solution</h4><p>ρ = m/V = 250.0/50.0 = 5.00 g/cm³</p><p>Δm/m = 0.5/250 = 0.2 %, ΔV/V = 0.5/50 = 1.0 %</p><p>Δρ/ρ = 1.2 %, so Δρ = 0.012 × 5.00 = 0.06 g/cm³</p><p>ρ = 5.00 ± 0.06 g/cm³</p><h4>Answer</h4><p><b>5.00 ± 0.06 g/cm³</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>ધાતુના બ્લોકનું દ્રવ્યમાન 250.0 ± 0.5 g અને ઘનફળ 50.0 ± 0.5 cm³ છે. ઘનતા અને તેની ટકાવારી ભૂલ શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>ρ = m/V = 250.0/50.0 = 5.00 g/cm³</p><p>Δm/m = 0.5/250 = 0.2 %, ΔV/V = 0.5/50 = 1.0 %</p><p>Δρ/ρ = 1.2 %, તેથી Δρ = 0.012 × 5.00 = 0.06 g/cm³</p><p>ρ = 5.00 ± 0.06 g/cm³</p><h4>જવાબ</h4><p><b>5.00 ± 0.06 g/cm³</b></p>"}, "answer": {"en": "5.00 ± 0.06 g/cm³", "gu": "5.00 ± 0.06 g/cm³"}}, {"id": "u1n18", "unit": 1, "h": {"en": "Area of a circle with r = 2.0 ± 0.1 cm.", "gu": "r = 2.0 ± 0.1 cm હોય તેવા વર્તુળનું ક્ષેત્રફળ."}, "q": {"en": "The radius of a disc is 2.0 ± 0.1 cm. Find its area with the percentage error.", "gu": "એક ડિસ્કની ત્રિજ્યા 2.0 ± 0.1 cm છે. તેનું ક્ષેત્રફળ ટકાવારી ભૂલ સાથે શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>The radius of a disc is 2.0 ± 0.1 cm. Find its area with the percentage error.</p><h4>Step-by-step solution</h4><p>A = πr² = π(2.0)² = 12.6 cm² (3 s.f.: 12.6)</p><p>Δr/r = 0.1/2.0 = 5 %, and A depends on r²</p><p>ΔA/A = 2 × 5 % = 10 %, so ΔA = 1.26 ≈ 1.3 cm²</p><p>A = 12.6 ± 1.3 cm²</p><h4>Answer</h4><p><b>12.6 ± 1.3 cm² (10 %)</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>એક ડિસ્કની ત્રિજ્યા 2.0 ± 0.1 cm છે. તેનું ક્ષેત્રફળ ટકાવારી ભૂલ સાથે શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>A = πr² = π(2.0)² = 12.6 cm²</p><p>Δr/r = 0.1/2.0 = 5 %, અને A એ r² પર આધારિત છે</p><p>ΔA/A = 2 × 5 % = 10 %, તેથી ΔA = 1.26 ≈ 1.3 cm²</p><p>A = 12.6 ± 1.3 cm²</p><h4>જવાબ</h4><p><b>12.6 ± 1.3 cm² (10 %)</b></p>"}, "answer": {"en": "12.6 ± 1.3 cm² (10 %)", "gu": "12.6 ± 1.3 cm² (10 %)"}}, {"id": "u1n19", "unit": 1, "h": {"en": "Significant figures: 2.5 × 1.25 and 12.11 + 18.0 + 1.013.", "gu": "સાર્થક અંકો: 2.5 × 1.25 અને 12.11 + 18.0 + 1.013."}, "q": {"en": "Work out 2.5 × 1.25 and 12.11 + 18.0 + 1.013, keeping the correct number of significant figures.", "gu": "2.5 × 1.25 અને 12.11 + 18.0 + 1.013 યોગ્ય સાર્થક અંકો રાખીને ગણો."}, "a": {"en": "<h4>Given and assumptions</h4><p>Work out 2.5 × 1.25 and 12.11 + 18.0 + 1.013, keeping the correct number of significant figures.</p><h4>Step-by-step solution</h4><p>2.5 × 1.25 = 3.125. The smallest input has 2 s.f., so the answer is 3.1.</p><p>12.11 + 18.0 + 1.013 = 31.123. The smallest number of decimal places is 1, so the answer is 31.1.</p><h4>Answer</h4><p><b>3.1 and 31.1</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>2.5 × 1.25 અને 12.11 + 18.0 + 1.013 યોગ્ય સાર્થક અંકો રાખીને ગણો.</p><h4>પગલાવાર ઉકેલ</h4><p>2.5 × 1.25 = 3.125. સૌથી ઓછા સાર્થક અંક 2 છે, તેથી જવાબ 3.1.</p><p>12.11 + 18.0 + 1.013 = 31.123. સૌથી ઓછા દશાંશ સ્થાન 1 છે, તેથી જવાબ 31.1.</p><h4>જવાબ</h4><p><b>3.1 અને 31.1</b></p>"}, "answer": {"en": "3.1 and 31.1", "gu": "3.1 અને 31.1"}}, {"id": "u1n20", "unit": 1, "h": {"en": "Volume of a sphere of radius 1.20 cm.", "gu": "1.20 cm ત્રિજ્યાવાળા ગોળાનું ઘનફળ."}, "q": {"en": "Find the volume of a steel ball of radius 1.20 cm, with the correct significant figures.", "gu": "1.20 cm ત્રિજ્યાવાળા સ્ટીલના દડાનું ઘનફળ યોગ્ય સાર્થક અંકો સાથે શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>Find the volume of a steel ball of radius 1.20 cm, with the correct significant figures.</p><h4>Step-by-step solution</h4><p>V = (4/3)πr³ = (4/3)π(1.20)³</p><p>(1.20)³ = 1.728, so V = 4.1888 × 1.728 = 7.2378 cm³</p><p>r has 3 s.f., so V = 7.24 cm³.</p><h4>Answer</h4><p><b>7.24 cm³</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>1.20 cm ત્રિજ્યાવાળા સ્ટીલના દડાનું ઘનફળ યોગ્ય સાર્થક અંકો સાથે શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>V = (4/3)πr³ = (4/3)π(1.20)³</p><p>(1.20)³ = 1.728, તેથી V = 4.1888 × 1.728 = 7.2378 cm³</p><p>rમાં 3 સાર્થક અંક છે, તેથી V = 7.24 cm³.</p><h4>જવાબ</h4><p><b>7.24 cm³</b></p>"}, "answer"
