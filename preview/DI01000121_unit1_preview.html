: {"en": "7.24 cm³", "gu": "7.24 cm³"}}], "viva": [{"title": {"en": "Definitions", "gu": "વ્યાખ્યાઓ"}, "items": [{"q": {"en": "What is a physical quantity?", "gu": "ભૌતિક રાશિ એટલે શું?"}, "a": {"en": "A quantity that can be measured and expressed as a number with a unit, such as length, mass or time.", "gu": "જેને માપી શકાય અને સંખ્યા તથા એકમ સાથે દર્શાવી શકાય તેવી રાશિ, જેમ કે લંબાઈ, દ્રવ્યમાન કે સમય."}}, {"q": {"en": "Name the seven SI base quantities.", "gu": "SIની સાત પાયાની રાશિઓ જણાવો."}, "a": {"en": "Length, mass, time, electric current, temperature, amount of substance and luminous intensity.", "gu": "લંબાઈ, દ્રવ્યમાન, સમય, વિદ્યુત પ્રવાહ, તાપમાન, પદાર્થનો જથ્થો અને પ્રકાશીય તીવ્રતા."}}, {"q": {"en": "Give two derived quantities with their units.", "gu": "બે વ્યુત્પન્ન રાશિઓ તેમના એકમ સાથે જણાવો."}, "a": {"en": "Force (newton = kg·m/s²) and pressure (pascal = N/m²).", "gu": "બળ (ન્યૂટન = kg·m/s²) અને દબાણ (પાસ્કલ = N/m²)."}}, {"q": {"en": "What is the least count of an instrument?", "gu": "સાધનનું લીસ્ટ કાઉન્ટ એટલે શું?"}, "a": {"en": "The smallest measurement the instrument can read reliably.", "gu": "સાધન વિશ્વસનીય રીતે વાંચી શકે તેવું સૌથી નાનું માપ."}}, {"q": {"en": "State the formula for vernier least count.", "gu": "વર્નિયર લીસ્ટ કાઉન્ટનું સૂત્ર જણાવો."}, "a": {"en": "L.C. = 1 M.S.D. − 1 V.S.D., which equals M.S.D./n when n vernier divisions cover n − 1 main divisions. A 50-division vernier on a millimetre scale reads 0.02 mm.", "gu": "L.C. = 1 M.S.D. − 1 V.S.D., જે n વર્નિયર વિભાગ n − 1 મુખ્ય વિભાગ આવરે ત્યારે M.S.D./n થાય. મિલીમીટર સ્કેલ પર 50 વિભાગવાળું વર્નિયર 0.02 mm વાંચે છે."}}, {"q": {"en": "State the formula for screw-gauge least count.", "gu": "સ્ક્રુ ગેજ લીસ્ટ કાઉન્ટનું સૂત્ર જણાવો."}, "a": {"en": "L.C. = pitch / number of circular-scale divisions.", "gu": "L.C. = પિચ / વર્તુળાકાર સ્કેલના વિભાગોની સંખ્યા."}}]}, {"title": {"en": "Accuracy, errors and significant figures", "gu": "ચોકસાઈ, ભૂલો અને સાર્થક અંકો"}, "items": [{"q": {"en": "Difference between accuracy and precision?", "gu": "ચોકસાઈ અને પરિશુદ્ધતામાં શું ફરક?"}, "a": {"en": "Accuracy is closeness to the true value; precision is closeness of repeated readings to one another.", "gu": "ચોકસાઈ સાચા મૂલ્યની નજીકતા છે; પરિશુદ્ધતા વારંવાર લીધેલાં વાંચનની એકબીજાની નજીકતા છે."}}, {"q": {"en": "Name three types of error.", "gu": "ભૂલના ત્રણ પ્રકાર જણાવો."}, "a": {"en": "Systematic, random and gross errors. Systematic errors keep one sign (a zero error), random errors scatter both ways (unsteady hands), and gross errors are plain misreadings or wrong units.", "gu": "ક્રમબદ્ધ, યાદૃચ્છિક અને ઘોર ભૂલો. ક્રમબદ્ધ ભૂલનું ચિહ્ન એક જ રહે (શૂન્ય ભૂલ), યાદૃચ્છિક ભૂલ બંને બાજુ વિખરાય (ઢીલા હાથ) અને ઘોર ભૂલ એટલે સીધું ખોટું વાંચન કે ખોટું એકમ."}}, {"q": {"en": "Give one example of a systematic error and its cure.", "gu": "ક્રમબદ્ધ ભૂલનું એક ઉદાહરણ અને તેનો ઉપાય જણાવો."}, "a": {"en": "A zero error of +0.03 cm in a vernier; the cure is to measure it and subtract it from every reading.", "gu": "વર્નિયરમાં +0.03 cm શૂન્ય ભૂલ; ઉપાય એ છે કે તેને માપી દરેક વાંચનમાંથી બાદ કરવી."}}, {"q": {"en": "Write the formula for percentage error.", "gu": "ટકાવારી ભૂલનું સૂત્ર લખો."}, "a": {"en": "Percentage error = (|measured − true| / true) × 100 %.", "gu": "ટકાવારી ભૂલ = (|માપેલ − સાચું| / સાચું) × 100 %."}}, {"q": {"en": "How many significant figures are in 0.00250 m?", "gu": "0.00250 m માં કેટલા સાર્થક અંક છે?"}, "a": {"en": "Three: 2, 5 and the trailing 0 after the decimal. The leading zeros of 0.00250 do not count, and writing 0.0025 would drop one significant figure.", "gu": "ત્રણ: 2, 5 અને દશાંશ પછીનો અંતિમ 0. 0.00250માં શરૂઆતના શૂન્ય ગણાય નહીં, અને 0.0025 લખવાથી એક સાર્થક અંક ખોવાઈ જાય."}}, {"q": {"en": "Why must a measurement carry a unit?", "gu": "માપન સાથે એકમ કેમ જરૂરી છે?"}, "a": {"en": "Without a unit the number has no meaning: 25 could be 25 mm, 25 cm or 25 µm.", "gu": "એકમ વગર સંખ્યાનો અર્થ નથી: 25 એ 25 mm, 25 cm કે 25 µm હોઈ શકે."}}, {"q": {"en": "What is a zero error, and how is it corrected?", "gu": "શૂન્ય ભૂલ શું છે અને તે કેવી રીતે સુધારાય?"}, "a": {"en": "The reading when the jaws or anvil are closed; subtract it if positive, add it if negative.", "gu": "જડબાં કે એન્વિલ બંધ હોય ત્યારે મળતું વાંચન; ધન હોય તો બાદ કરો, ઋણ હોય તો ઉમેરો."}}]}], "exam_questions": [{"q": {"en": "Practice: Define physical quantity. Distinguish between fundamental and derived quantities with two examples of each.", "gu": "સરાવ: ભૌતિક રાશિની વ્યાખ્યા આપો. પાયાની અને વ્યુત્પન્ન રાશિઓ વચ્ચેનો ભેદ દરેકના બે ઉદાહરણ સાથે સમજાવો."}, "marks": 4}, {"q": {"en": "Practice: Explain the construction and working of a vernier caliper with its least-count formula.", "gu": "સરાવ: વર્નિયર કેલિપરની રચના અને કાર્યપદ્ધતિ તેના લીસ્ટ કાઉન્ટ સૂત્ર સાથે સમજાવો."}, "marks": 5}, {"q": {"en": "Practice: Distinguish between accuracy and precision with an example.", "gu": "સરાવ: ચોકસાઈ અને પરિશુદ્ધતા વચ્ચેનો ભેદ ઉદાહરણ સાથે સમજાવો."}, "marks": 3}, {"q": {"en": "Practice: Explain absolute, relative and percentage error with a worked example.", "gu": "સરાવ: નિરપેક્ષ, સાપેક્ષ અને ટકાવારી ભૂલ ઉકેલાયેલ દાખલા સાથે સમજાવો."}, "marks": 4}, {"q": {"en": "Practice: State the rules for rounding off and for counting significant figures.", "gu": "સરાવ: રાઉન્ડિંગ ઓફ અને સાર્થક અંકો ગણવાના નિયમો જણાવો."}, "marks": 4}, {"q": {"en": "Practice: Convert 1 N into dyne and 1 J into erg, showing every step.", "gu": "સરાવ: 1 N ને ડાઇનમાં અને 1 J ને અર્ગમાં દરેક પગલું દર્શાવીને ફેરવો."}, "marks": 3}, {"q": {"en": "Practice: A vernier caliper reads M.S.R. 15 mm, V.C. 4 and has L.C. 0.1 mm. Find the length.", "gu": "સરાવ: વર્નિયર કેલિપર M.S.R. 15 mm, V.C. 4 વાંચે છે અને L.C. 0.1 mm છે. લંબાઈ શોધો."}, "marks": 3}, {"q": {"en": "Practice: A screw gauge has pitch 0.5 mm and 100 divisions. Find its least count and read S.S.R. 3.0 mm with C.S.R. 45.", "gu": "સરાવ: સ્ક્રુ ગેજની પિચ 0.5 mm અને 100 વિભાગ છે. લીસ્ટ કાઉન્ટ શોધો અને S.S.R. 3.0 mm તથા C.S.R. 45 વાંચન શોધો."}, "marks": 4}, {"q": {"en": "Practice: Explain why the least count of the instrument must suit the tolerance.", "gu": "સરાવ: સાધનનું લીસ્ટ કાઉન્ટ ટોલરન્સને અનુરૂપ કેમ હોવું જોઈએ તે સમજાવો."}, "marks": 3}, {"q": {"en": "Practice: Name four errors that spoil a measurement even when the instrument is good, with one cure each.", "gu": "સરાવ: સાધન સારું હોવા છતાં માપન બગાડતી ચાર ભૂલો તેમના એક-એક ઉપાય સાથે જણાવો."}, "marks": 4}, {"q": {"en": "Practice: Why is dimensional analysis useful, and what can it not prove?", "gu": "સરાવ: પરિમાણીય વિશ્લેષણ કેમ ઉપયોગી છે અને તે શું સાબિત કરી શકતું નથી?"}, "marks": 3}, {"q": {"en": "Practice: A student records a length as 25.0437 mm from a vernier of least count 0.02 mm. Comment.", "gu": "સરાવ: વિદ્યાર્થી 0.02 mm લીસ્ટ કાઉન્ટવાળા વર્નિયરથી લંબાઈ 25.0437 mm નોંધે છે. ટીકા કરો."}, "marks": 3}, {"q": {"en": "Practice: Convert 5 km into cm and 3 hours into seconds, showing the method.", "gu": "સરાવ: 5 km ને cm માં અને 3 કલાકને સેકન્ડમાં ફેરવો, રીત દર્શાવો."}, "marks": 3}, {"q": {"en": "Practice: Define least count and state the least count of the vernier and the screw gauge used in your laboratory.", "gu": "સરાવ: લીસ્ટ કાઉન્ટની વ્યાખ્યા આપો અને તમારી પ્રયોગશાળાના વર્નિયર તથા સ્ક્રુ ગેજનું લીસ્ટ કાઉન્ટ જણાવો."}, "marks": 3}], "learning_outcomes": [{"en": "1.a Explain physical quantities and their units.", "gu": "1.a ભૌતિક રાશિઓ અને તેમના એકમો સમજાવવા."}, {"en": "1.b Convert a unit of a physical quantity from one system to another.", "gu": "1.b ભૌતિક રાશિના એકમનું એક પદ્ધતિથી બીજી પદ્ધતિમાં રૂપાંતરણ કરવું."}, {"en": "1.c Measure the dimensions of an object with the relevant instrument.", "gu": "1.c યોગ્ય સાધનથી પદાર્થનાં પરિમાણ માપવા."}, {"en": "1.d Estimate errors in a measurement.", "gu": "1.d માપનમાં થતી ભૂલોનો અંદાજ કાઢવો."}, {"en": "1.e Apply least count, errors and significant figures to problems.", "gu": "1.e લીસ્ટ કાઉન્ટ, ભૂલો અને સાર્થક અંકોના ઉપયોગથી દાખલા ગણવા."}], "course_outcomes": ["CO1"], "practical_numbers": [1, 2], "content_kind": "theory", "lesson_count": 17, "answered_practice_count": 14, "assessment_note": {"en": "Official course: theory ESE 70 + PA 30 and practical PA 20 + ESE 30 = 150 marks, 4 credits, 45 teaching hours; this unit carries 17 % weightage, 7 of the 45 hours and 12 of the 70 theory marks (the PDF prints weightage only, so the marks are split by weightage). Practice marks 3/4/5 are suggested revision sizes, not GTU allocations. Model answers are in Notes section 5.", "gu": "અધિકૃત કોર્સ: થિયરી ESE 70 + PA 30 અને પ્રેક્ટિકલ PA 20 + ESE 30 = 150 માર્ક્સ, 4 ક્રેડિટ, 45 શિક્ષણ કલાક; આ યુનિટનું વેઇટેજ 17 %, 45માંથી 7 કલાક અને 70 થિયરી માર્ક્સમાંથી 12 માર્ક્સ (PDFમાં ફક્ત વેઇટેજ છે, તેથી માર્ક્સ વેઇટેજ પ્રમાણે વહેંચ્યા છે). સરાવના 3/4/5 માર્ક્સ સૂચિત પુનરાવર્તન માપ છે, GTU ફાળવણી નહીં. આદર્શ જવાબો નોંધ વિભાગ 5માં છે."}, "question_provenance": "Original answered revision questions; not official past papers", "question_marks_are_suggested": true, "sources": [{"title": "GTU DI01000121 Applied Physics syllabus (uploaded PDF, w.e.f. 2024-25)", "url": "https://syllabus.gtu.ac.in/"}, {"title": "NCERT Physics Class XI, Part I - Units and Measurements (chapter 1)", "url": "https://syllabus.gtu.ac.in/"}, {"title": "H. C. Verma - Concepts of Physics, Vol. I, chapter 1 and 2", "url": "https://syllabus.gtu.ac.in/"}, {"title": "C. L. Arora - B.Sc. Practical Physics: vernier calipers and screw gauge", "url": "https://syllabus.gtu.ac.in/"}, {"title": "NIST - SI base units and prefixes (https://www.nist.gov/pml/owm/metric-si/si-units)", "url": "https://www.nist.gov/pml/owm/metric-si/si-units"}]};

const TY = new Set('int char float double void long short FILE size_t'.split(' '));
const PKW = new Set('False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield'.split(' '));
const PTY = new Set('int float str bool list tuple set dict complex frozenset bytes bytearray range object'.split(' '));
function hlPy(src){
  const re = /(#[^\n]*)|((?:\b[rRbBfFuU]{1,2})?(?:'{3}[\s\S]*?'{3}|"{3}[\s\S]*?"{3}|'(?:\\.|[^'\\\n])*'|"(?:\\.|[^"\\\n])*"))|(^>>>|^\.\.\.(?= ))|([A-Za-z_]\w*)(?=\s*\()|([A-Za-z_]\w*)|(\b(?:0[xXoObB][0-9a-fA-F_]+|\d[\d_]*(?:\.\d+)?(?:[eE][-+]?\d+)?j?)\b)/gm;
  let o='', last=0, m;
  while ((m = re.exec(src))){
    o += esc(src.slice(last, m.index)); last = re.lastIndex;
    const w = esc(m[0]);
    if (m[1]) o += `<span class="cm">${w}</span>`;
    else if (m[2]) o += `<span class="st">${w}</span>`;
    else if (m[3]) o += `<span class="pp">${w}</span>`;
    else if (m[4]) o += PKW.has(m[4]) ? `<span class="kw">${w}</span>` : PTY.has(m[4]) ? `<span class="ty">${w}</span>` : `<span class="fn">${w}</span>`;
    else if (m[5]) o += PKW.has(m[5]) ? `<span class="kw">${w}</span>` : PTY.has(m[5]) ? `<span class="ty">${w}</span>` : w;
    else o += `<span class="nu">${w}</span>`;
  }
  return o + esc(src.slice(last));
}
function hl(src){
  if (META.code_lang === 'python') return hlPy(src);
  if (META.code_lang === 'nosql') return esc(src);
  const re = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(^[ \t]*#[^\n]*)|([A-Za-z_]\w*)(?=\s*\()|([A-Za-z_]\w*)|(\b\d+(?:\.\d+)?[fFlLuU]*\b)/gm;
  let o='', last=0, m;
  while ((m = re.exec(src))){
    o += esc(src.slice(last, m.index)); last = re.lastIndex;
    const w = esc(m[0]);
    if (m[1]) o += `<span class="cm">${w}</span>`;
    else if (m[2]) o += `<span class="st">${w}</span>`;
    else if (m[3]) o += `<span class="pp">${w}</span>`;
    else if (m[4]) o += KW.has(m[4]) ? `<span class="kw">${w}</span>` : TY.has(m[4]) ? `<span class="ty">${w}</span>` : `<span class="fn">${w}</span>`;
    else if (m[5]) o += KW.has(m[5]) ? `<span class="kw">${w}</span>` : TY.has(m[5]) ? `<span class="ty">${w}</span>` : w;
    else o += `<span class="nu">${w}</span>`;
  }
  return o + esc(src.slice(last));
}
const progBody = p => p.items
  ? p.items.map(it => fixTables(t(it.body)) + (it.diagram?dgInline(it.diagram):'')).join('')
  : `<div class="pl">${L('code')}</div><pre class="code">${hl(t(p.code))}</pre><div class="pl">${L('output')}</div><pre class="out">${esc(p.out)}</pre>${p.plot?`<div class="pl">${L('plot')}</div>`+dgInline(p.plot).replace('class="dg"','class="dg pg"'):''}${p.expl?`<div class="pl">${L('expl')}</div>${fixTables(t(p.expl))}`:''}`;
const pBox = id => { const p=(U.programs||[]).find(x=>x.id===id); if(!p) return ''; return `<div class="pbox"><div class="et">${L('prog')}: ${t(p.title)}</div>${progBody(p)}</div>`; };
const exBox = id => { const n=(U.numericals||[]).find(x=>x.id===id); if(!n) return ''; return `<div class="ex"><div class="et">${L('ex')}</div><div class="eq2">${t(n.q)}</div>${fixTables(t(n.a))}</div>`; };
function notes(){
  let h = `<div class="intro"><b>${t(U.title)}</b><div>${L('unit')} ${U.unit} · ${U.weightage}% ${L('intro')} · ${U.hours} ${L('hours')}</div><div>${U.intro_text ? t(U.intro_text) : L(U.programs?(META.code_lang==='python'?'intropy':'introc'):'introd')}</div></div>`;
  U.notes.forEach((sec,si)=>{
    h += `<div class="sec">${head(t(sec.title))}`;
    sec.items.forEach((it,i)=>{
      const open = si===0&&i===0 ? ' open' : '';
      if (it.h) {
        h += `<div class="card${it.key?' key':''}${open}"><div class="q hd"><span class="t">${it.key?'⭐ ':''}${t(it.h)}</span>${chev}</div>
        <div class="a rn" style="padding-left:18px">${fixTables(t(it.body)).replace(/margin:0 0 10px -36px/g,'')}${it.diagram?dgInline(it.diagram):''}${(it.examples||[]).map(exBox).join('')}${(it.programs||[]).map(pBox).join('')}</div></div>`;
      } else {
        h += `<div class="card${open}"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(it.q)}</span>${chev}</div>
        <div class="a">${fixTables(t(it.a))}${it.diagram?dgInline(it.diagram):''}</div></div>`;
      }
    });
    h += `</div>`;
  });
  return h;
}
function numericals(){
  return `<div class="sec">${head(L('numericals'))}` + (U.numericals||[]).map((n,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(n.q)}</span>${chev}</div><div class="a">${fixTables(t(n.a))}</div></div>`).join('') + `</div>`;
}
function diagrams(){
  return `<div class="sec">${head(L((U.tabs ? U.tabs.includes('flowcharts')&&!U.tabs.includes('diagrams') : U.programs&&META.code_lang!=='python')?'flowcharts':'diagrams'),false)}<div style="height:10px"></div>` + U.diagrams.map((d,i)=>
    `<div class="dcard" data-dg="${d.id}"><div class="h">${i+1}. ${t(d.title)}</div>${SVG[d.id]}</div>`).join('') + `</div>`;
}
function equations(){
  return U.equations.map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><span class="fbox">${e.f}</span></span>${chev}</div>
     <div class="a"><p>${t(e.terms)}</p></div></div>`).join('') + `</div>`).join('');
}
function viva(){
  // two shapes exist in the corpus: flat [{q,a}] and grouped [{title, items:[{q,a}]}]
  const groups = U.viva.every(v=>v && v.q) ? [{items: U.viva}] : U.viva;
  return groups.map(g=>{
    const items = g.items || [];
    return `<div class="sec">${g.title?head(t(g.title)):''}` + items.map((v,i)=>
      `<div class="card"><div class="q hd"><span class="n">${i+1}.</span><span class="t">${t(v.q)}</span>${chev}</div><div class="a"><p>${t(v.a)}</p></div></div>`).join('') + `</div>`;
  }).join('');
}
function exam(){
  return `<div class="sec">${head(L('examhead'),false)}` + U.exam_questions.map((x,i)=>
    `<div class="card"><div class="q" style="cursor:default"><span class="n">${i+1}.</span><span class="t">${t(x.q)}</span><span class="mk">${x.marks} ${L('marks')}</span></div></div>`).join('') + `</div>`;
}
function programs(){
  return `<div class="sec">${head(L('programs'))}` + (U.programs||[]).map((p,i)=>
    `<div class="card"><div class="q hd"><span class="n">${i+1}.</span><span class="t">${t(p.title)}</span>${chev}</div><div class="a pa">${progBody(p)}</div></div>`).join('') + `</div>`;
}
function syntax(key){
  return (U[typeof key==='string'?key:'syntax']||[]).map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><pre class="code sx">${hl(e.f)}</pre></span>${chev}</div>
     <div class="a">${e.terms && t(e.terms) ? fixTables(t(e.terms)) : ''}</div></div>`).join('') + `</div>`).join('');
}
const flowcharts = diagrams;
const algorithms = () => syntax('algorithms');
const ALLV = {notes, programs, diagrams, flowcharts, algorithms, syntax, equations, numericals, viva, exam};
const VIEWS = U.tabs ? Object.fromEntries(U.tabs.map(k=>[k, ALLV[k]])) : U.programs ? (META.code_lang==='python' ? {notes, programs, diagrams, syntax, viva, exam} : {notes, programs, flowcharts, syntax, viva, exam}) : U.numericals ? {notes, diagrams, equations, numericals, viva, exam} : {notes, diagrams, equations, viva, exam};
function render(){
  document.getElementById('title').textContent = `${L('unit')} ${U.unit}: ${t(U.title)}`;
  document.getElementById('sub').textContent = `${t(META.name)} · ${META.code}`;
  document.getElementById('lang').textContent = S.lang==='en' ? 'ગુ' : 'EN';
  document.getElementById('lang').style.display = META.languages.includes('gu') ? '' : 'none';
  document.getElementById('tabs').innerHTML = Object.keys(VIEWS).map(k=>`<button class="tab${S.tab===k?' on':''}" data-tab="${k}">${L(k)}</button>`).join('');
  document.getElementById('view').innerHTML = VIEWS[S.tab]();
  document.querySelectorAll('#view pre.c').forEach(e=>{ e.innerHTML = hl(e.textContent); e.className='code'; });
}
let zoom = 1;
function setZoom(z){ zoom = Math.min(4, Math.max(1, z)); const w=document.getElementById('zw'); w.style.width=(zoom*100)+'%'; document.getElementById('zr').textContent=Math.round(zoom*100)+'%'; }
document.addEventListener('click', e=>{
  const q = e.target.closest('.q'); if (q && q.parentElement.querySelector('.a')) { q.parentElement.classList.toggle('open'); return; }
  const tb = e.target.closest('[data-tab]'); if (tb){ S.tab = tb.dataset.tab; render(); window.scrollTo(0,0); return; }
  if (e.target.closest('#lang')){ S.lang = S.lang==='en'?'gu':'en'; render(); return; }
  const m = e.target.closest('[data-more]');
  document.querySelectorAll('.menu.show').forEach(x=>{ if(!m || x!==m.nextElementSibling) x.classList.remove('show'); });
  if (m){ m.nextElementSibling.classList.toggle('show'); return; }
  const act = e.target.closest('[data-act]');
  if (act){ act.closest('.sec').querySelectorAll('.card').forEach(c=>{ if(c.querySelector('.a')) c.classList.toggle('open', act.dataset.act==='expand'); }); act.parentElement.classList.remove('show'); return; }
  const dg = e.target.closest('[data-dg]');
  if (dg){ const id=dg.dataset.dg; document.getElementById('mt').textContent=t(U.diagrams.find(d=>d.id===id).title); document.getElementById('zw').innerHTML=SVG[id]; setZoom(1); document.getElementById('modal').classList.add('show'); return; }
  if (e.target.closest('#mx')) document.getElementById('modal').classList.remove('show');
  if (e.target.closest('#zi')) setZoom(zoom+0.5);
  if (e.target.closest('#zo')) setZoom(zoom-0.5);
  if (e.target.closest('#zr')) setZoom(1);
});
render();
</script></body></html>
