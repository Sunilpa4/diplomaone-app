<script>
const U = {"subject": "DI01000151", "unit": 4, "format": "notes", "title": {"en": "Bipolar Junction Transistor", "gu": "Bipolar Junction Transistor (BJT)"}, "weightage": 20, "hours": 6, "notes": [{"title": {"en": "4.1 Transistor – Construction and Types (PNP / NPN)", "gu": "4.1 Transistor – રચના અને પ્રકાર (PNP / NPN)"}, "items": [{"h": {"en": "4.1.1 Introduction to Transistor", "gu": "4.1.1 Transistor નો પરિચય"}, "body": {"en": "<p>A <b>transistor</b> is a three-terminal semiconductor device used for <b>amplification</b> (making a weak signal stronger) and <b>switching</b> (ON/OFF).</p>\n<ul>\n<li>The word <b>transistor</b> comes from <b>\"transfer + resistor\"</b>: it transfers a signal from a low-resistance input circuit to a high-resistance output circuit.</li>\n<li>It was invented in <b>1947</b> at <b>Bell Laboratories</b> (USA) by <b>John Bardeen, Walter Brattain and William Shockley</b>, who received the Nobel Prize in 1956.</li>\n<li>It replaced the bulky <b>vacuum tube (triode)</b> and started the era of modern electronics, ICs and computers.</li>\n</ul>\n<h4>Bipolar Junction Transistor (BJT)</h4>\n<ul>\n<li><b>Bipolar:</b> current is carried by <b>both</b> types of carriers – electrons and holes.</li>\n<li><b>Junction:</b> it has <b>two P-N junctions</b>.</li>\n<li>Three terminals: <b>Emitter (E), Base (B), Collector (C)</b>.</li>\n<li>A BJT is a <b>current-controlled device</b>: a small base current controls a large collector current.</li>\n</ul>\n<h4>Advantages over vacuum tubes</h4>\n<p>Small size, light weight, no heater (instant start), low operating voltage, low power consumption, long life, rugged and cheap.</p>", "gu": "<p><b>Transistor</b> એ ત્રણ terminal વાળું semiconductor device છે, જે <b>Amplification</b> (નબળા signal ને મજબૂત બનાવવું) અને <b>Switching</b> (ON/OFF) માટે વપરાય છે.</p>\n<ul>\n<li><b>Transistor</b> શબ્દ <b>\"transfer + resistor\"</b> પરથી આવ્યો છે: તે signal ને ઓછા resistance વાળા input circuit થી વધુ resistance વાળા output circuit માં transfer કરે છે.</li>\n<li>તેની શોધ <b>1947</b> માં <b>Bell Laboratories</b> (USA) માં <b>John Bardeen, Walter Brattain અને William Shockley</b> એ કરી હતી; તેમને 1956 માં Nobel Prize મળ્યું.</li>\n<li>તેણે મોટી <b>vacuum tube (triode)</b> નું સ્થાન લીધું અને આધુનિક electronics, ICs અને computers ના યુગની શરૂઆત કરી.</li>\n</ul>\n<h4>Bipolar Junction Transistor (BJT)</h4>\n<ul>\n<li><b>Bipolar:</b> current <b>બંને</b> પ્રકારના carriers – electrons અને holes – દ્વારા વહન થાય છે.</li>\n<li><b>Junction:</b> તેમાં <b>બે P-N junctions</b> હોય છે.</li>\n<li>ત્રણ terminals: <b>Emitter (E), Base (B), Collector (C)</b>.</li>\n<li>BJT એ <b>current-controlled device</b> છે: નાનો base current મોટા collector current ને નિયંત્રિત કરે છે.</li>\n</ul>\n<h4>Vacuum tubes કરતાં ફાયદા</h4>\n<p>નાનું કદ, ઓછું વજન, heater નહીં (તરત શરૂ), ઓછો operating voltage, ઓછો power વપરાશ, લાંબું આયુષ્ય, મજબૂત અને સસ્તું.</p>"}}, {"h": {"en": "4.1.2 Construction of Transistor", "gu": "4.1.2 Transistor ની રચના"}, "body": {"en": "<p>A transistor is made by sandwiching a <b>thin layer</b> of one type of semiconductor between two layers of the opposite type. It has <b>three regions</b> and <b>two junctions</b>.</p>\n<table>\n<tr><th>Region</th><th>Doping</th><th>Size</th><th>Function</th></tr>\n<tr><td><b>Emitter (E)</b></td><td>Heavily doped</td><td>Medium</td><td>Emits (supplies) a large number of majority carriers into the base</td></tr>\n<tr><td><b>Base (B)</b></td><td>Lightly doped</td><td>Very thin (≈ 10⁻⁶ m)</td><td>Controls the flow of carriers from emitter to collector</td></tr>\n<tr><td><b>Collector (C)</b></td><td>Moderately doped</td><td>Largest</td><td>Collects carriers; large size to dissipate heat</td></tr>\n</table>\n<h4>Two junctions</h4>\n<ul>\n<li><b>Emitter-Base junction (J<sub>E</sub>)</b> – between emitter and base.</li>\n<li><b>Collector-Base junction (J<sub>C</sub>)</b> – between collector and base.</li>\n</ul>\n<p>So a transistor looks like <b>two diodes connected back to back</b>. But two separate diodes <b>cannot</b> work as a transistor, because the base must be very thin and lightly doped.</p>\n<h4>Why these doping levels and sizes?</h4>\n<ul>\n<li><b>Emitter heavily doped</b> → it can inject a large number of carriers.</li>\n<li><b>Base thin and lightly doped</b> → very few carriers recombine in the base; most (95–99%) pass on to the collector.</li>\n<li><b>Collector largest</b> → most power is dissipated at the collector junction, so a large area is needed to remove heat.</li>\n<li>Emitter and collector are the same type of material but <b>cannot be interchanged</b>, because their doping and size are different.</li>\n</ul>", "gu": "<p>Transistor એક પ્રકારના semiconductor ના <b>પાતળા સ્તર</b> ને વિરુદ્ધ પ્રકારના બે સ્તરો વચ્ચે sandwich કરીને બનાવાય છે. તેમાં <b>ત્રણ regions</b> અને <b>બે junctions</b> હોય છે.</p>\n<table>\n<tr><th>Region</th><th>Doping</th><th>કદ</th><th>કાર્ય</th></tr>\n<tr><td><b>Emitter (E)</b></td><td>વધુ doped</td><td>મધ્યમ</td><td>Base માં મોટી સંખ્યામાં majority carriers મોકલે (emit કરે)</td></tr>\n<tr><td><b>Base (B)</b></td><td>ઓછું doped</td><td>ખૂબ પાતળું (≈ 10⁻⁶ m)</td><td>Emitter થી collector તરફ carriers ના પ્રવાહને નિયંત્રિત કરે</td></tr>\n<tr><td><b>Collector (C)</b></td><td>મધ્યમ doped</td><td>સૌથી મોટું</td><td>Carriers એકત્ર કરે; ઉષ્મા દૂર કરવા મોટું કદ</td></tr>\n</table>\n<h4>બે junctions</h4>\n<ul>\n<li><b>Emitter-Base junction (J<sub>E</sub>)</b> – emitter અને base વચ્ચે.</li>\n<li><b>Collector-Base junction (J<sub>C</sub>)</b> – collector અને base વચ્ચે.</li>\n</ul>\n<p>તેથી transistor <b>પીઠ-પીઠ જોડેલા બે diodes</b> જેવો દેખાય છે. પરંતુ બે અલગ diodes transistor તરીકે કામ <b>કરી શકતા નથી</b>, કારણ કે base ખૂબ પાતળું અને ઓછું doped હોવું જોઈએ.</p>\n<h4>આવું doping અને કદ કેમ?</h4>\n<ul>\n<li><b>Emitter વધુ doped</b> → તે મોટી સંખ્યામાં carriers મોકલી શકે.</li>\n<li><b>Base પાતળું અને ઓછું doped</b> → base માં ખૂબ ઓછા carriers recombine થાય; મોટાભાગના (95–99%) collector સુધી પહોંચે.</li>\n<li><b>Collector સૌથી મોટું</b> → મોટાભાગનો power collector junction પર dissipate થાય છે, તેથી ઉષ્મા દૂર કરવા મોટો વિસ્તાર જોઈએ.</li>\n<li>Emitter અને collector સમાન પ્રકારના material છે પરંતુ doping અને કદ અલગ હોવાથી તેમને <b>અદલાબદલી કરી શકાતા નથી</b>.</li>\n</ul>"}, "diagram": "u4_structure"}, {"h": {"en": "4.1.3 Types: NPN and PNP Transistors", "gu": "4.1.3 પ્રકાર: NPN અને PNP Transistors"}, "body": {"en": "<h4>1. NPN transistor</h4>\n<p>A thin <b>P-type</b> layer (base) is placed between two <b>N-type</b> layers (emitter and collector). Majority carriers are <b>electrons</b>.</p>\n<h4>2. PNP transistor</h4>\n<p>A thin <b>N-type</b> layer (base) is placed between two <b>P-type</b> layers. Majority carriers are <b>holes</b>.</p>\n<h4>Symbols</h4>\n<ul>\n<li>The <b>arrow is always on the emitter</b> and shows the direction of <b>conventional current</b>.</li>\n<li><b>NPN:</b> arrow points <b>outward</b> (Not Pointing iN). Current flows into C and B and out of E.</li>\n<li><b>PNP:</b> arrow points <b>inward</b> (Pointing iN Permanently). Current flows into E and out of B and C.</li>\n<li>In both: <b>I<sub>E</sub> = I<sub>B</sub> + I<sub>C</sub></b>.</li>\n</ul>\n<h4>Comparison of NPN and PNP</h4>\n<table>\n<tr><th>Point</th><th>NPN</th><th>PNP</th></tr>\n<tr><td>Structure</td><td>P-layer between two N-layers</td><td>N-layer between two P-layers</td></tr>\n<tr><td>Majority carriers</td><td>Electrons</td><td>Holes</td></tr>\n<tr><td>Arrow in symbol</td><td>Outward (on emitter)</td><td>Inward (on emitter)</td></tr>\n<tr><td>Biasing (active)</td><td>Collector +ve, emitter −ve</td><td>Collector −ve, emitter +ve</td></tr>\n<tr><td>Speed</td><td>Faster (electron mobility is higher)</td><td>Slower</td></tr>\n<tr><td>Use</td><td>More popular</td><td>Less used; complementary circuits</td></tr>\n<tr><td>Examples</td><td>BC547, 2N2222, 2N3055</td><td>BC557, 2N2907, 2N2955</td></tr>\n</table>\n<p><b>Why is NPN more popular?</b> Electrons have higher mobility than holes, so NPN transistors are faster and give better high-frequency performance; also most circuits use a positive supply.</p>", "gu": "<h4>1. NPN transistor</h4>\n<p>બે <b>N-type</b> સ્તરો (emitter અને collector) વચ્ચે પાતળું <b>P-type</b> સ્તર (base) મૂકાય છે. Majority carriers <b>electrons</b> છે.</p>\n<h4>2. PNP transistor</h4>\n<p>બે <b>P-type</b> સ્તરો વચ્ચે પાતળું <b>N-type</b> સ્તર (base) મૂકાય છે. Majority carriers <b>holes</b> છે.</p>\n<h4>Symbols</h4>\n<ul>\n<li><b>Arrow હંમેશા emitter પર</b> હોય છે અને <b>conventional current</b> ની દિશા બતાવે છે.</li>\n<li><b>NPN:</b> arrow <b>બહાર તરફ</b> (Not Pointing iN). Current C અને B માં અંદર જાય અને E માંથી બહાર આવે.</li>\n<li><b>PNP:</b> arrow <b>અંદર તરફ</b> (Pointing iN Permanently). Current E માં અંદર જાય અને B અને C માંથી બહાર આવે.</li>\n<li>બંનેમાં: <b>I<sub>E</sub> = I<sub>B</sub> + I<sub>C</sub></b>.</li>\n</ul>\n<h4>NPN અને PNP ની સરખામણી</h4>\n<table>\n<tr><th>મુદ્દો</th><th>NPN</th><th>PNP</th></tr>\n<tr><td>રચના</td><td>બે N-સ્તરો વચ્ચે P-સ્તર</td><td>બે P-સ્તરો વચ્ચે N-સ્તર</td></tr>\n<tr><td>Majority carriers</td><td>Electrons</td><td>Holes</td></tr>\n<tr><td>Symbol માં arrow</td><td>બહાર તરફ (emitter પર)</td><td>અંદર તરફ (emitter પર)</td></tr>\n<tr><td>Biasing (active)</td><td>Collector +ve, emitter −ve</td><td>Collector −ve, emitter +ve</td></tr>\n<tr><td>ઝડપ</td><td>વધુ ઝડપી (electron mobility વધુ)</td><td>ધીમું</td></tr>\n<tr><td>ઉપયોગ</td><td>વધુ લોકપ્રિય</td><td>ઓછો; complementary circuits</td></tr>\n<tr><td>ઉદાહરણ</td><td>BC547, 2N2222, 2N3055</td><td>BC557, 2N2907, 2N2955</td></tr>\n</table>\n<p><b>NPN વધુ લોકપ્રિય કેમ?</b> Electrons ની mobility holes કરતાં વધુ છે, તેથી NPN transistors વધુ ઝડપી છે અને high frequency પર વધુ સારું કામ કરે છે; ઉપરાંત મોટાભાગના circuits positive supply વાપરે છે.</p>"}, "diagram": "u4_symbols"}, {"h": {"en": "4.1.4 Transistor Identification and Ratings", "gu": "4.1.4 Transistor ની ઓળખ અને Ratings"}, "body": {"en": "<h4>Packages</h4>\n<ul>\n<li><b>TO-92</b> (small plastic, e.g. BC547, 2N2222A) – low-power signal transistors.</li>\n<li><b>TO-220</b> (with metal tab, e.g. TIP31, TIP122) – medium power; mounted on a heat sink.</li>\n<li><b>TO-3</b> (metal can, e.g. 2N3055) – high power; case is the collector.</li>\n</ul>\n<h4>Pin identification</h4>\n<ul>\n<li><b>BC547/BC557:</b> hold the flat face towards you, leads down → pins are <b>C – B – E</b> from left to right.</li>\n<li>Pin order differs between types, so always check the <b>datasheet</b>.</li>\n<li><b>Multimeter test (diode mode):</b> base-emitter and base-collector junctions each show ≈ 0.6–0.7 V in one direction only. If the red probe on the base gives readings to both other pins → <b>NPN</b>; if the black probe on the base does → <b>PNP</b>. The B-E reading is slightly higher than B-C.</li>\n</ul>\n<h4>Important ratings</h4>\n<table>\n<tr><th>Rating</th><th>Meaning</th><th>BC547 (typical)</th></tr>\n<tr><td>V<sub>CEO</sub></td><td>Max collector-emitter voltage (base open)</td><td>45 V</td></tr>\n<tr><td>I<sub>C(max)</sub></td><td>Max collector current</td><td>100 mA</td></tr>\n<tr><td>P<sub>D</sub></td><td>Max power dissipation = V<sub>CE</sub> × I<sub>C</sub></td><td>500 mW</td></tr>\n<tr><td>h<sub>FE</sub> (β<sub>dc</sub>)</td><td>DC current gain</td><td>110 – 800</td></tr>\n<tr><td>f<sub>T</sub></td><td>Transition frequency (gain = 1)</td><td>300 MHz</td></tr>\n</table>", "gu": "<h4>Packages</h4>\n<ul>\n<li><b>TO-92</b> (નાનું plastic, દા.ત. BC547, 2N2222A) – ઓછા power ના signal transistors.</li>\n<li><b>TO-220</b> (metal tab સાથે, દા.ત. TIP31, TIP122) – મધ્યમ power; heat sink પર લગાવાય.</li>\n<li><b>TO-3</b> (metal can, દા.ત. 2N3055) – વધુ power; case એ collector છે.</li>\n</ul>\n<h4>Pin ની ઓળખ</h4>\n<ul>\n<li><b>BC547/BC557:</b> સપાટ ભાગ તમારી તરફ અને leads નીચે રાખો → ડાબેથી જમણે pins <b>C – B – E</b>.</li>\n<li>જુદા જુદા types માં pin ક્રમ અલગ હોય છે, તેથી હંમેશા <b>datasheet</b> જુઓ.</li>\n<li><b>Multimeter test (diode mode):</b> base-emitter અને base-collector junctions દરેક ફક્ત એક જ દિશામાં ≈ 0.6–0.7 V બતાવે છે. જો base પર red probe રાખતાં બાકીના બંને pins પર reading આવે → <b>NPN</b>; જો black probe base પર રાખતાં આવે → <b>PNP</b>. B-E reading, B-C કરતાં થોડું વધુ હોય છે.</li>\n</ul>\n<h4>મહત્વના Ratings</h4>\n<table>\n<tr><th>Rating</th><th>અર્થ</th><th>BC547 (સામાન્ય)</th></tr>\n<tr><td>V<sub>CEO</sub></td><td>મહત્તમ collector-emitter voltage (base open)</td><td>45 V</td></tr>\n<tr><td>I<sub>C(max)</sub></td><td>મહત્તમ collector current</td><td>100 mA</td></tr>\n<tr><td>P<sub>D</sub></td><td>મહત્તમ power dissipation = V<sub>CE</sub> × I<sub>C</sub></td><td>500 mW</td></tr>\n<tr><td>h<sub>FE</sub> (β<sub>dc</sub>)</td><td>DC current gain</td><td>110 – 800</td></tr>\n<tr><td>f<sub>T</sub></td><td>Transition frequency (gain = 1)</td><td>300 MHz</td></tr>\n</table>"}}, {"h": {"en": "Key Points – 4.1", "gu": "મુખ્ય મુદ્દા – 4.1"}, "body": {"en": "<ul>\n<li>Transistor = <b>transfer + resistor</b>; invented in 1947 at Bell Labs; used for amplification and switching.</li>\n<li>BJT: <b>bipolar</b> (electrons + holes), <b>two junctions</b> (J<sub>E</sub>, J<sub>C</sub>), three terminals E, B, C; current-controlled.</li>\n<li>Emitter: heavily doped; Base: lightly doped and very thin; Collector: moderately doped and largest.</li>\n<li>Emitter and collector cannot be interchanged.</li>\n<li><b>NPN</b>: arrow out, electrons majority; <b>PNP</b>: arrow in, holes majority.</li>\n<li><b>I<sub>E</sub> = I<sub>B</sub> + I<sub>C</sub></b>.</li>\n<li>NPN is more popular (higher electron mobility → faster).</li>\n</ul>", "gu": "<ul>\n<li>Transistor = <b>transfer + resistor</b>; 1947 માં Bell Labs માં શોધ; amplification અને switching માટે વપરાય.</li>\n<li>BJT: <b>bipolar</b> (electrons + holes), <b>બે junctions</b> (J<sub>E</sub>, J<sub>C</sub>), ત્રણ terminals E, B, C; current-controlled.</li>\n<li>Emitter: વધુ doped; Base: ઓછું doped અને ખૂબ પાતળું; Collector: મધ્યમ doped અને સૌથી મોટું.</li>\n<li>Emitter અને collector અદલાબદલી કરી શકાતા નથી.</li>\n<li><b>NPN</b>: arrow બહાર, electrons majority; <b>PNP</b>: arrow અંદર, holes majority.</li>\n<li><b>I<sub>E</sub> = I<sub>B</sub> + I<sub>C</sub></b>.</li>\n<li>NPN વધુ લોકપ્રિય (electron mobility વધુ → વધુ ઝડપી).</li>\n</ul>"}, "key": true}]}, {"title": {"en": "4.2 Working of Transistor", "gu": "4.2 Transistor નું કાર્ય"}, "items": [{"h": {"en": "4.2.1 Biasing of Transistor and Regions of Operation", "gu": "4.2.1 Transistor નું Biasing અને Regions of Operation"}, "body": {"en": "<p>To work as an <b>amplifier</b>, a transistor must be biased so that:</p>\n<ul>\n<li><b>Emitter-base junction (J<sub>E</sub>) → forward biased</b> (low resistance)</li>\n<li><b>Collector-base junction (J<sub>C</sub>) → reverse biased</b> (high resistance)</li>\n</ul>\n<p>Depending on the bias of the two junctions, a transistor has four regions of operation:</p>\n<table>\n<tr><th>Region</th><th>J<sub>E</sub></th><th>J<sub>C</sub></th><th>Behaviour / Use</th></tr>\n<tr><td><b>Active</b></td><td>Forward</td><td>Reverse</td><td>I<sub>C</sub> = β I<sub>B</sub>; used as an <b>amplifier</b></td></tr>\n<tr><td><b>Saturation</b></td><td>Forward</td><td>Forward</td><td>Maximum I<sub>C</sub>, V<sub>CE</sub> ≈ 0.2 V; <b>ON switch</b></td></tr>\n<tr><td><b>Cut-off</b></td><td>Reverse</td><td>Reverse</td><td>I<sub>C</sub> ≈ 0; <b>OFF switch</b></td></tr>\n<tr><td>Inverse active</td><td>Reverse</td><td>Forward</td><td>E and C roles exchanged; very low gain; rarely used</td></tr>\n</table>\n<p>Typical values for a silicon transistor in the active region: <b>V<sub>BE</sub> ≈ 0.7 V</b> (0.3 V for Ge).</p>", "gu": "<p><b>Amplifier</b> તરીકે કામ કરવા transistor ને આ રીતે bias કરવો પડે:</p>\n<ul>\n<li><b>Emitter-base junction (J<sub>E</sub>) → forward biased</b> (ઓછો resistance)</li>\n<li><b>Collector-base junction (J<sub>C</sub>) → reverse biased</b> (વધુ resistance)</li>\n</ul>\n<p>બંને junctions ના bias પ્રમાણે transistor ના ચાર regions of operation છે:</p>\n<table>\n<tr><th>Region</th><th>J<sub>E</sub></th><th>J<sub>C</sub></th><th>વર્તન / ઉપયોગ</th></tr>\n<tr><td><b>Active</b></td><td>Forward</td><td>Reverse</td><td>I<sub>C</sub> = β I<sub>B</sub>; <b>Amplifier</b> તરીકે વપરાય</td></tr>\n<tr><td><b>Saturation</b></td><td>Forward</td><td>Forward</td><td>મહત્તમ I<sub>C</sub>, V<sub>CE</sub> ≈ 0.2 V; <b>ON switch</b></td></tr>\n<tr><td><b>Cut-off</b></td><td>Reverse</td><td>Reverse</td><td>I<sub>C</sub> ≈ 0; <b>OFF switch</b></td></tr>\n<tr><td>Inverse active</td><td>Reverse</td><td>Forward</td><td>E અને C ની ભૂમિકા બદલાય; ખૂબ ઓછો gain; ભાગ્યે જ વપરાય</td></tr>\n</table>\n<p>Active region માં silicon transistor માટે સામાન્ય મૂલ્ય: <b>V<sub>BE</sub> ≈ 0.7 V</b> (Ge માટે 0.3 V).</p>"}}, {"h": {"en": "4.2.2 Working of NPN Transistor", "gu": "4.2.2 NPN Transistor નું કાર્ય"}, "body": {"en": "<p><b>Biasing:</b> V<sub>EE</sub> forward biases J<sub>E</sub> (emitter N to −ve, base P to +ve); V<sub>CC</sub> reverse biases J<sub>C</sub> (collector N to +ve).</p>\n<h4>Working</h4>\n<ol>\n<li>Because J<sub>E</sub> is forward biased, the large number of <b>free electrons</b> in the heavily doped N-type emitter are pushed into the base. This forms the <b>emitter current I<sub>E</sub></b>.</li>\n<li>The base is <b>very thin and lightly doped</b> (few holes). So only a very small number of electrons (about <b>1–5%</b>) recombine with holes in the base. These form the small <b>base current I<sub>B</sub></b>.</li>\n<li>The remaining electrons (about <b>95–99%</b>) diffuse across the thin base and reach the collector-base junction.</li>\n<li>J<sub>C</sub> is reverse biased, so its electric field <b>attracts (sweeps)</b> these electrons into the collector, where they are collected by the positive terminal of V<sub>CC</sub>. This forms the <b>collector current I<sub>C</sub></b>.</li>\n</ol>\n<p>Thus: <b>I<sub>E</sub> = I<sub>B</sub> + I<sub>C</sub></b>, and I<sub>C</sub> is almost equal to I<sub>E</sub>.</p>\n<p>Inside the NPN transistor current is carried mainly by <b>electrons</b>. In the external circuit, conventional current flows <b>into</b> the collector and base and <b>out of</b> the emitter.</p>\n<p><b>Key idea:</b> a small change in base current (or V<sub>BE</sub>) produces a large change in collector current – this is the basis of <b>amplification</b>.</p>", "gu": "<p><b>Biasing:</b> V<sub>EE</sub> એ J<sub>E</sub> ને forward bias કરે છે (emitter N ને −ve, base P ને +ve); V<sub>CC</sub> એ J<sub>C</sub> ને reverse bias કરે છે (collector N ને +ve).</p>\n<h4>કાર્ય</h4>\n<ol>\n<li>J<sub>E</sub> forward biased હોવાથી, વધુ doped N-type emitter ના મોટી સંખ્યાના <b>free electrons</b> base માં ધકેલાય છે. તેનાથી <b>Emitter current I<sub>E</sub></b> બને છે.</li>\n<li>Base <b>ખૂબ પાતળું અને ઓછું doped</b> (ઓછા holes) છે. તેથી ફક્ત ખૂબ ઓછા electrons (આશરે <b>1–5%</b>) base માં holes સાથે recombine થાય છે. તેનાથી નાનો <b>Base current I<sub>B</sub></b> બને છે.</li>\n<li>બાકીના electrons (આશરે <b>95–99%</b>) પાતળા base માંથી diffuse થઈ collector-base junction સુધી પહોંચે છે.</li>\n<li>J<sub>C</sub> reverse biased છે, તેથી તેનું electric field આ electrons ને collector માં <b>ખેંચી લે</b> છે, જ્યાં V<sub>CC</sub> નો positive terminal તેમને એકત્ર કરે છે. તેનાથી <b>Collector current I<sub>C</sub></b> બને છે.</li>\n</ol>\n<p>આમ: <b>I<sub>E</sub> = I<sub>B</sub> + I<sub>C</sub></b>, અને I<sub>C</sub> લગભગ I<sub>E</sub> જેટલો હોય છે.</p>\n<p>NPN transistor ની અંદર current મુખ્યત્વે <b>electrons</b> દ્વારા વહન થાય છે. બાહ્ય circuit માં conventional current collector અને base માં <b>અંદર</b> જાય છે અને emitter માંથી <b>બહાર</b> આવે છે.</p>\n<p><b>મુખ્ય વિચાર:</b> base current (અથવા V<sub>BE</sub>) માં નાનો ફેરફાર collector current માં મોટો ફેરફાર કરે છે – આ જ <b>Amplification</b> નો આધાર છે.</p>"}, "diagram": "u4_npn_working"}, {"h": {"en": "4.2.3 Working of PNP Transistor", "gu": "4.2.3 PNP Transistor નું કાર્ય"}, "body": {"en": "<p><b>Biasing:</b> V<sub>EE</sub> forward biases J<sub>E</sub> (emitter P to +ve, base N to −ve); V<sub>CC</sub> reverse biases J<sub>C</sub> (collector P to −ve). All polarities are <b>opposite</b> to NPN.</p>\n<h4>Working</h4>\n<ol>\n<li>J<sub>E</sub> is forward biased, so a large number of <b>holes</b> from the heavily doped P-type emitter are pushed into the N-type base → <b>emitter current I<sub>E</sub></b>.</li>\n<li>The base is thin and lightly doped (few electrons), so only about <b>1–5%</b> of holes recombine with electrons in the base → small <b>base current I<sub>B</sub></b>.</li>\n<li>The remaining <b>95–99%</b> of holes cross the base and reach J<sub>C</sub>.</li>\n<li>The reverse-biased J<sub>C</sub> (collector connected to −ve) attracts these holes into the collector → <b>collector current I<sub>C</sub></b>.</li>\n</ol>\n<p>Again <b>I<sub>E</sub> = I<sub>B</sub> + I<sub>C</sub></b>. Inside the PNP transistor current is carried mainly by <b>holes</b>; in the external circuit, conventional current flows <b>into</b> the emitter and <b>out of</b> the base and collector.</p>\n<h4>Difference in working (NPN vs PNP)</h4>\n<ul>\n<li>NPN: majority carriers = electrons, collector +ve.</li>\n<li>PNP: majority carriers = holes, collector −ve.</li>\n<li>Both have the same current relations and the same principle of operation.</li>\n</ul>", "gu": "<p><b>Biasing:</b> V<sub>EE</sub> એ J<sub>E</sub> ને forward bias કરે છે (emitter P ને +ve, base N ને −ve); V<sub>CC</sub> એ J<sub>C</sub> ને reverse bias કરે છે (collector P ને −ve). બધી polarities NPN થી <b>વિરુદ્ધ</b> છે.</p>\n<h4>કાર્ય</h4>\n<ol>\n<li>J<sub>E</sub> forward biased છે, તેથી વધુ doped P-type emitter ના મોટી સંખ્યાના <b>holes</b> N-type base માં ધકેલાય છે → <b>Emitter current I<sub>E</sub></b>.</li>\n<li>Base પાતળું અને ઓછું doped (ઓછા electrons) છે, તેથી ફક્ત આશરે <b>1–5%</b> holes base માં electrons સાથે recombine થાય છે → નાનો <b>Base current I<sub>B</sub></b>.</li>\n<li>બાકીના <b>95–99%</b> holes base પાર કરી J<sub>C</sub> સુધી પહોંચે છે.</li>\n<li>Reverse-biased J<sub>C</sub> (collector −ve સાથે) આ holes ને collector માં ખેંચે છે → <b>Collector current I<sub>C</sub></b>.</li>\n</ol>\n<p>ફરીથી <b>I<sub>E</sub> = I<sub>B</sub> + I<sub>C</sub></b>. PNP transistor ની અંદર current મુખ્યત્વે <b>holes</b> દ્વારા વહન થાય છે; બાહ્ય circuit માં conventional current emitter માં <b>અંદર</b> જાય છે અને base અને collector માંથી <b>બહાર</b> આવે છે.</p>\n<h4>કાર્યમાં તફાવત (NPN અને PNP)</h4>\n<ul>\n<li>NPN: majority carriers = electrons, collector +ve.</li>\n<li>PNP: majority carriers = holes, collector −ve.</li>\n<li>બંનેમાં current સંબંધો અને કાર્ય સિદ્ધાંત સમાન છે.</li>\n</ul>"}, "diagram": "u4_pnp_working"}, {"h": {"en": "4.2.4 Transistor Currents and Their Relations", "gu": "4.2.4 Transistor Currents અને તેમના સંબંધો"}, "body": {"en": "<h4>Basic current equation (KCL)</h4>\n<p><b>I<sub>E</sub> = I<sub>B</sub> + I<sub>C</sub></b> &nbsp; (I<sub>B</sub> is very small, so I<sub>C</sub> ≈ I<sub>E</sub>)</p>\n<h4>α (alpha) – common-base DC current gain</h4>\n<p><b>α = I<sub>C</sub> / I<sub>E</sub></b> → always <b>less than 1</b>; typical 0.95 to 0.995.</p>\n<h4>β (beta) – common-emitter DC current gain (h<sub>FE</sub>)</h4>\n<p><b>β = I<sub>C</sub> / I<sub>B</sub></b> → large; typical <b>20 to 500</b>.</p>\n<h4>Relation between α and β</h4>\n<p>Dividing I<sub>E</sub> = I<sub>B</sub> + I<sub>C</sub> by I<sub>C</sub>: &nbsp; 1/α = 1/β + 1</p>\n<p><b>β = α / (1 − α)</b> &nbsp;&nbsp; and &nbsp;&nbsp; <b>α = β / (1 + β)</b></p>\n<p>Example: α = 0.98 → β = 0.98/0.02 = 49. A small change in α causes a large change in β.</p>\n<h4>Leakage currents</h4>\n<ul>\n<li><b>I<sub>CBO</sub></b>: collector-base leakage current with emitter open (due to minority carriers in reverse-biased J<sub>C</sub>). nA for Si, µA for Ge. Doubles every 10 °C.</li>\n<li>In CB: <b>I<sub>C</sub> = α I<sub>E</sub> + I<sub>CBO</sub></b></li>\n<li><b>I<sub>CEO</sub></b>: collector-emitter leakage with base open: <b>I<sub>CEO</sub> = (1 + β) I<sub>CBO</sub></b> (much larger).</li>\n<li>In CE: <b>I<sub>C</sub> = β I<sub>B</sub> + I<sub>CEO</sub></b></li>\n</ul>\n<p>Leakage current increases with temperature and can lead to <b>thermal runaway</b> if the circuit is not stabilised.</p>", "gu": "<h4>મૂળભૂત current સમીકરણ (KCL)</h4>\n<p><b>I<sub>E</sub> = I<sub>B</sub> + I<sub>C</sub></b> &nbsp; (I<sub>B</sub> ખૂબ નાનો છે, તેથી I<sub>C</sub> ≈ I<sub>E</sub>)</p>\n<h4>α (alpha) – common-base DC current gain</h4>\n<p><b>α = I<sub>C</sub> / I<sub>E</sub></b> → હંમેશા <b>1 થી ઓછો</b>; સામાન્ય 0.95 થી 0.995.</p>\n<h4>β (beta) – common-emitter DC current gain (h<sub>FE</sub>)</h4>\n<p><b>β = I<sub>C</sub> / I<sub>B</sub></b> → મોટો; સામાન્ય <b>20 થી 500</b>.</p>\n<h4>α અને β વચ્ચેનો સંબંધ</h4>\n<p>I<sub>E</sub> = I<sub>B</sub> + I<sub>C</sub> ને I<sub>C</sub> વડે ભાગતાં: &nbsp; 1/α = 1/β + 1</p>\n<p><b>β = α / (1 − α)</b> &nbsp;&nbsp; અને &nbsp;&nbsp; <b>α = β / (1 + β)</b></p>\n<p>ઉદાહરણ: α = 0.98 → β = 0.98/0.02 = 49. α માં નાનો ફેરફાર β માં મોટો ફેરફાર કરે છે.</p>\n<h4>Leakage currents</h4>\n<ul>\n<li><b>I<sub>CBO</sub></b>: emitter open હોય ત્યારે collector-base leakage current (reverse-biased J<sub>C</sub> માં minority carriers ને કારણે). Si માટે nA, Ge માટે µA. દર 10 °C એ બમણો.</li>\n<li>CB માં: <b>I<sub>C</sub> = α I<sub>E</sub> + I<sub>CBO</sub></b></li>\n<li><b>I<sub>CEO</sub></b>: base open હોય ત્યારે collector-emitter leakage: <b>I<sub>CEO</sub> = (1 + β) I<sub>CBO</sub></b> (ઘણો મોટો).</li>\n<li>CE માં: <b>I<sub>C</sub> = β I<sub>B</sub> + I<sub>CEO</sub></b></li>\n</ul>\n<p>Leakage current તાપમાન સાથે વધે છે અને circuit stabilise ન હોય તો <b>Thermal runaway</b> થઈ શકે છે.</p>"}, "examples": ["u4n1", "u4n2", "u4n3", "u4n8"]}, {"h": {"en": "Key Points – 4.2", "gu": "મુખ્ય મુદ્દા – 4.2"}, "body": {"en": "<ul>\n<li>Active region (amplifier): <b>J<sub>E</sub> forward, J<sub>C</sub> reverse</b>.</li>\n<li>Saturation: both forward (ON switch); Cut-off: both reverse (OFF switch).</li>\n<li>Emitter injects carriers; only 1–5% recombine in thin base (I<sub>B</sub>); 95–99% reach collector (I<sub>C</sub>).</li>\n<li>NPN: electrons; PNP: holes; supply polarities opposite.</li>\n<li><b>I<sub>E</sub> = I<sub>B</sub> + I<sub>C</sub></b>; <b>α = I<sub>C</sub>/I<sub>E</sub></b> (&lt; 1); <b>β = I<sub>C</sub>/I<sub>B</sub></b> (20–500).</li>\n<li><b>β = α/(1 − α)</b>, <b>α = β/(1 + β)</b>.</li>\n<li><b>I<sub>CEO</sub> = (1 + β) I<sub>CBO</sub></b>; I<sub>C</sub> = β I<sub>B</sub> + I<sub>CEO</sub>.</li>\n</ul>", "gu": "<ul>\n<li>Active region (amplifier): <b>J<sub>E</sub> forward, J<sub>C</sub> reverse</b>.</li>\n<li>Saturation: બંને forward (ON switch); Cut-off: બંને reverse (OFF switch).</li>\n<li>Emitter carriers મોકલે; પાતળા base માં ફક્ત 1–5% recombine (I<sub>B</sub>); 95–99% collector સુધી (I<sub>C</sub>).</li>\n<li>NPN: electrons; PNP: holes; supply polarities વિરુદ્ધ.</li>\n<li><b>I<sub>E</sub> = I<sub>B</sub> + I<sub>C</sub></b>; <b>α = I<sub>C</sub>/I<sub>E</sub></b> (&lt; 1); <b>β = I<sub>C</sub>/I<sub>B</sub></b> (20–500).</li>\n<li><b>β = α/(1 − α)</b>, <b>α = β/(1 + β)</b>.</li>\n<li><b>I<sub>CEO</sub> = (1 + β) I<sub>CBO</sub></b>; I<sub>C</sub> = β I<sub>B</sub> + I<sub>CEO</sub>.</li>\n</ul>"}, "key": true}]}, {"title": {"en": "4.3 Transistor Configurations and Characteristics", "gu": "4.3 Transistor Configurations અને Characteristics"}, "items": [{"h": {"en": "4.3.1 Transistor Configurations – Introduction", "gu": "4.3.1 Transistor Configurations – પરિચય"}, "body": {"en": "<p>A transistor has <b>three terminals</b>, but a circuit needs <b>four terminals</b> – two for input and two for output. So <b>one terminal is made common</b> to both the input and the output circuits.</p>\n<p>Depending on which terminal is common, there are three configurations (connections):</p>\n<table>\n<tr><th>Configuration</th><th>Common terminal</th><th>Input between</th><th>Output between</th></tr>\n<tr><td><b>Common Base (CB)</b></td><td>Base</td><td>Emitter – Base</td><td>Collector – Base</td></tr>\n<tr><td><b>Common Emitter (CE)</b></td><td>Emitter</td><td>Base – Emitter</td><td>Collector – Emitter</td></tr>\n<tr><td><b>Common Collector (CC)</b></td><td>Collector</td><td>Base – Collector</td><td>Emitter – Collector</td></tr>\n</table>\n<p>In every configuration, for amplifier operation, the <b>emitter-base junction is forward biased</b> and the <b>collector-base junction is reverse biased</b>.</p>\n<h4>Characteristics</h4>\n<p>Graphs that show the relation between currents and voltages of a transistor are called <b>characteristics</b>:</p>\n<ul>\n<li><b>Input characteristics:</b> input current vs input voltage, with output voltage constant.</li>\n<li><b>Output characteristics:</b> output current vs output voltage, with input current constant.</li>\n</ul>", "gu": "<p>Transistor માં <b>ત્રણ terminals</b> છે, પરંતુ circuit ને <b>ચાર terminals</b> જોઈએ – બે input માટે અને બે output માટે. તેથી <b>એક terminal ને input અને output બંને circuits માટે common</b> બનાવાય છે.</p>\n<p>કયો terminal common છે તેના આધારે ત્રણ configurations (જોડાણ) છે:</p>\n<table>\n<tr><th>Configuration</th><th>Common terminal</th><th>Input વચ્ચે</th><th>Output વચ્ચે</th></tr>\n<tr><td><b>Common Base (CB)</b></td><td>Base</td><td>Emitter – Base</td><td>Collector – Base</td></tr>\n<tr><td><b>Common Emitter (CE)</b></td><td>Emitter</td><td>Base – Emitter</td><td>Collector – Emitter</td></tr>\n<tr><td><b>Common Collector (CC)</b></td><td>Collector</td><td>Base – Collector</td><td>Emitter – Collector</td></tr>\n</table>\n<p>દરેક configuration માં amplifier કાર્ય માટે <b>emitter-base junction forward biased</b> અને <b>collector-base junction reverse biased</b> હોય છે.</p>\n<h4>Characteristics</h4>\n<p>Transistor ના currents અને voltages વચ્ચેનો સંબંધ બતાવતા આલેખોને <b>Characteristics</b> કહે છે:</p>\n<ul>\n<li><b>Input characteristics:</b> output voltage અચળ રાખી input current વિરુદ્ધ input voltage.</li>\n<li><b>Output characteristics:</b> input current અચળ રાખી output current વિરુદ્ધ output voltage.</li>\n</ul>"}}, {"h": {"en": "4.3.2 Common Base (CB) Configuration", "gu": "4.3.2 Common Base (CB) Configuration"}, "body": {"en": "<p>In CB configuration the <b>base is common</b> to input and output. Input is applied between <b>emitter and base</b>, and output is taken between <b>collector and base</b> (see diagram for NPN).</p>\n<ul>\n<li>V<sub>EE</sub> forward biases the emitter-base junction; V<sub>CC</sub> reverse biases the collector-base junction.</li>\n<li>Input current = <b>I<sub>E</sub></b>; output current = <b>I<sub>C</sub></b>.</li>\n</ul>\n<h4>Current amplification factor (α)</h4>\n<p><b>α = ΔI<sub>C</sub> / ΔI<sub>E</sub></b> (V<sub>CB</sub> constant) → <b>less than 1</b> (0.95–0.995). So CB gives <b>no current gain</b>.</p>\n<h4>Features</h4>\n<ul>\n<li>Current gain: less than 1 (α)</li>\n<li>Voltage gain: high (because output resistance ≫ input resistance)</li>\n<li>Input resistance: very <b>low</b> (≈ 20 – 100 Ω)</li>\n<li>Output resistance: very <b>high</b> (≈ 500 kΩ – 1 MΩ)</li>\n<li>Phase shift between input and output: <b>0°</b> (in phase)</li>\n<li>Application: <b>high-frequency (RF) amplifiers</b>, impedance matching from low to high impedance</li>\n</ul>", "gu": "<p>CB configuration માં <b>base input અને output માટે common</b> છે. Input <b>emitter અને base</b> વચ્ચે લગાવાય છે અને output <b>collector અને base</b> વચ્ચેથી લેવાય છે (NPN માટે આકૃતિ જુઓ).</p>\n<ul>\n<li>V<sub>EE</sub> emitter-base junction ને forward bias કરે; V<sub>CC</sub> collector-base junction ને reverse bias કરે.</li>\n<li>Input current = <b>I<sub>E</sub></b>; output current = <b>I<sub>C</sub></b>.</li>\n</ul>\n<h4>Current amplification factor (α)</h4>\n<p><b>α = ΔI<sub>C</sub> / ΔI<sub>E</sub></b> (V<sub>CB</sub> અચળ) → <b>1 થી ઓછો</b> (0.95–0.995). તેથી CB માં <b>current gain મળતો નથી</b>.</p>\n<h4>લક્ષણો</h4>\n<ul>\n<li>Current gain: 1 થી ઓછો (α)</li>\n<li>Voltage gain: વધુ (કારણ કે output resistance ≫ input resistance)</li>\n<li>Input resistance: ખૂબ <b>ઓછો</b> (≈ 20 – 100 Ω)</li>\n<li>Output resistance: ખૂબ <b>વધુ</b> (≈ 500 kΩ – 1 MΩ)</li>\n<li>Input અને output વચ્ચે phase shift: <b>0°</b> (in phase)</li>\n<li>ઉપયોગ: <b>High-frequency (RF) amplifiers</b>, ઓછા થી વધુ impedance સુધી impedance matching</li>\n</ul>"}, "diagram": "u4_cb"}, {"h": {"en": "4.3.3 CB Characteristics", "gu": "4.3.3 CB Characteristics"}, "body": {"en": "<h4>Input characteristics (I<sub>E</sub> vs V<sub>EB</sub>, V<sub>CB</sub> constant)</h4>\n<ul>\n<li>The curve is like the <b>forward characteristic of a diode</b> (emitter-base junction is forward biased).</li>\n<li>Emitter current is very small until V<sub>EB</sub> reaches the knee voltage (≈ 0.7 V for Si), then it rises rapidly.</li>\n<li>When V<sub>CB</sub> is increased, the curve shifts slightly <b>left</b> (more I<sub>E</sub> for the same V<sub>EB</sub>) due to the <b>Early effect</b> (base-width modulation).</li>\n<li><b>Input resistance r<sub>i</sub> = ΔV<sub>EB</sub> / ΔI<sub>E</sub></b> → very low (tens of ohms).</li>\n</ul>\n<h4>Output characteristics (I<sub>C</sub> vs V<sub>CB</sub>, I<sub>E</sub> constant)</h4>\n<ul>\n<li><b>Active region:</b> I<sub>C</sub> ≈ I<sub>E</sub> and is almost <b>independent of V<sub>CB</sub></b> → the curves are nearly flat (horizontal) lines.</li>\n<li>Even at V<sub>CB</sub> = 0, I<sub>C</sub> flows. To reduce I<sub>C</sub> to zero, the collector-base junction must be slightly forward biased (negative V<sub>CB</sub>) → <b>saturation region</b>.</li>\n<li><b>Cut-off region:</b> below the I<sub>E</sub> = 0 curve; only I<sub>CBO</sub> flows.</li>\n<li><b>Output resistance r<sub>o</sub> = ΔV<sub>CB</sub> / ΔI<sub>C</sub></b> → very high (since the curves are almost flat).</li>\n</ul>", "gu": "<h4>Input characteristics (I<sub>E</sub> વિરુદ્ધ V<sub>EB</sub>, V<sub>CB</sub> અચળ)</h4>\n<ul>\n<li>Curve <b>diode ની forward characteristic</b> જેવો છે (emitter-base junction forward biased છે).</li>\n<li>V<sub>EB</sub> knee voltage (Si માટે ≈ 0.7 V) સુધી પહોંચે ત્યાં સુધી emitter current ખૂબ નાનો રહે છે, પછી ઝડપથી વધે છે.</li>\n<li>V<sub>CB</sub> વધારતાં <b>Early effect</b> (base-width modulation) ને કારણે curve થોડો <b>ડાબી</b> તરફ ખસે છે (સમાન V<sub>EB</sub> માટે વધુ I<sub>E</sub>).</li>\n<li><b>Input resistance r<sub>i</sub> = ΔV<sub>EB</sub> / ΔI<sub>E</sub></b> → ખૂબ ઓછો (દસેક ohms).</li>\n</ul>\n<h4>Output characteristics (I<sub>C</sub> વિરુદ્ધ V<sub>CB</sub>, I<sub>E</sub> અચળ)</h4>\n<ul>\n<li><b>Active region:</b> I<sub>C</sub> ≈ I<sub>E</sub> અને લગભગ <b>V<sub>CB</sub> થી સ્વતંત્ર</b> → curves લગભગ સપાટ (આડી) રેખાઓ છે.</li>\n<li>V<sub>CB</sub> = 0 પર પણ I<sub>C</sub> વહે છે. I<sub>C</sub> ને શૂન્ય કરવા collector-base junction ને થોડો forward bias (negative V<sub>CB</sub>) કરવો પડે → <b>Saturation region</b>.</li>\n<li><b>Cut-off region:</b> I<sub>E</sub> = 0 curve ની નીચે; ફક્ત I<sub>CBO</sub> વહે.</li>\n<li><b>Output resistance r<sub>o</sub> = ΔV<sub>CB</sub> / ΔI<sub>C</sub></b> → ખૂબ વધુ (curves લગભગ સપાટ હોવાથી).</li>\n</ul>"}, "diagram": "u4_cb_char"}, {"h": {"en": "4.3.4 Common Emitter (CE) Configuration", "gu": "4.3.4 Common Emitter (CE) Configuration"}, "body": {"en": "<p>In CE configuration the <b>emitter is common</b> to input and output. Input is applied between <b>base and emitter</b>, and output is taken between <b>collector and emitter</b> (see diagram).</p>\n<ul>\n<li>V<sub>BB</sub> (through R<sub>B</sub>) forward biases the base-emitter junction; V<sub>CC</sub> (through R<sub>C</sub>) keeps the collector-base junction reverse biased (V<sub>CC</sub> &gt; V<sub>BB</sub>).</li>\n<li>Input current = <b>I<sub>B</sub></b>; output current = <b>I<sub>C</sub></b>.</li>\n</ul>\n<h4>Current amplification factor (β)</h4>\n<p><b>β = ΔI<sub>C</sub> / ΔI<sub>B</sub></b> (V<sub>CE</sub> constant) → large (20–500). So CE gives <b>high current gain</b>.</p>\n<h4>Features</h4>\n<ul>\n<li>Current gain: <b>high</b> (β)</li>\n<li>Voltage gain: <b>high</b> (≈ 100–500)</li>\n<li>Power gain: <b>highest</b> of all three</li>\n<li>Input resistance: <b>medium</b> (≈ 1 kΩ)</li>\n<li>Output resistance: <b>medium</b> (≈ 10 – 50 kΩ)</li>\n<li>Phase shift: <b>180°</b> (output is inverted)</li>\n<li>Application: <b>audio amplifiers</b>, voltage amplifiers, <b>switching</b>; the most widely used configuration</li>\n</ul>", "gu": "<p>CE configuration માં <b>emitter input અને output માટે common</b> છે. Input <b>base અને emitter</b> વચ્ચે લગાવાય છે અને output <b>collector અને emitter</b> વચ્ચેથી લેવાય છે (આકૃતિ જુઓ).</p>\n<ul>\n<li>V<sub>BB</sub> (R<sub>B</sub> દ્વારા) base-emitter junction ને forward bias કરે; V<sub>CC</sub> (R<sub>C</sub> દ્વારા) collector-base junction ને reverse biased રાખે (V<sub>CC</sub> &gt; V<sub>BB</sub>).</li>\n<li>Input current = <b>I<sub>B</sub></b>; output current = <b>I<sub>C</sub></b>.</li>\n</ul>\n<h4>Current amplification factor (β)</h4>\n<p><b>β = ΔI<sub>C</sub> / ΔI<sub>B</sub></b> (V<sub>CE</sub> અચળ) → મોટો (20–500). તેથી CE માં <b>વધુ current gain</b> મળે છે.</p>\n<h4>લક્ષણો</h4>\n<ul>\n<li>Current gain: <b>વધુ</b> (β)</li>\n<li>Voltage gain: <b>વધુ</b> (≈ 100–500)</li>\n<li>Power gain: ત્રણેયમાં <b>સૌથી વધુ</b></li>\n<li>Input resistance: <b>મધ્યમ</b> (≈ 1 kΩ)</li>\n<li>Output resistance: <b>મધ્યમ</b> (≈ 10 – 50 kΩ)</li>\n<li>Phase shift: <b>180°</b> (output ઉલટો)</li>\n<li>ઉપયોગ: <b>Audio amplifiers</b>, voltage amplifiers, <b>switching</b>; સૌથી વધુ વપરાતું configuration</li>\n</ul>"}, "diagram": "u4_ce"}, {"h": {"en": "4.3.5 Circuit for CE Characteristics", "gu": "4.3.5 CE Characteristics માટેનો Circuit"}, "body": {"en": "<p>The characteristics of an NPN transistor in CE configuration are obtained with the circuit shown.</p>\n<h4>Components</h4>\n<ul>\n<li><b>V<sub>BB</sub></b> – variable DC supply for the base circuit, with series resistor <b>R<sub>B</sub></b>.</li>\n<li><b>Micro-ammeter (µA)</b> – measures base current I<sub>B</sub>.</li>\n<li><b>Voltmeter</b> across B-E – measures V<sub>BE</sub>.</li>\n<li><b>V<sub>CC</sub></b> – variable DC supply for the collector circuit.</li>\n<li><b>Milli-ammeter (mA)</b> – measures collector current I<sub>C</sub>.</li>\n<li><b>Voltmeter</b> across C-E – measures V<sub>CE</sub>.</li>\n</ul>\n<h4>Procedure</h4>\n<ol>\n<li><b>Input characteristics:</b> keep V<sub>CE</sub> constant (e.g. 1 V). Vary V<sub>BB</sub> in small steps and note V<sub>BE</sub> and I<sub>B</sub>. Repeat for V<sub>CE</sub> = 5 V. Plot I<sub>B</sub> vs V<sub>BE</sub>.</li>\n<li><b>Output characteristics:</b> set I<sub>B</sub> to a fixed value (e.g. 20 µA) using V<sub>BB</sub>. Vary V<sub>CC</sub> and note V<sub>CE</sub> and I<sub>C</sub>. Repeat for I<sub>B</sub> = 40, 60, 80 µA. Plot I<sub>C</sub> vs V<sub>CE</sub>.</li>\n</ol>", "gu": "<p>CE configuration માં NPN transistor ની characteristics આકૃતિમાં બતાવેલ circuit થી મેળવાય છે.</p>\n<h4>ઘટકો</h4>\n<ul>\n<li><b>V<sub>BB</sub></b> – base circuit માટે variable DC supply, series resistor <b>R<sub>B</sub></b> સાથે.</li>\n<li><b>Micro-ammeter (µA)</b> – base current I<sub>B</sub> માપે.</li>\n<li>B-E પર <b>Voltmeter</b> – V<sub>BE</sub> માપે.</li>\n<li><b>V<sub>CC</sub></b> – collector circuit માટે variable DC supply.</li>\n<li><b>Milli-ammeter (mA)</b> – collector current I<sub>C</sub> માપે.</li>\n<li>C-E પર <b>Voltmeter</b> – V<sub>CE</sub> માપે.</li>\n</ul>\n<h4>પદ્ધતિ</h4>\n<ol>\n<li><b>Input characteristics:</b> V<sub>CE</sub> અચળ રાખો (દા.ત. 1 V). V<sub>BB</sub> નાના પગલાંમાં બદલો અને V<sub>BE</sub> અને I<sub>B</sub> નોંધો. V<sub>CE</sub> = 5 V માટે ફરી કરો. I<sub>B</sub> વિરુદ્ધ V<sub>BE</sub> નો આલેખ દોરો.</li>\n<li><b>Output characteristics:</b> V<sub>BB</sub> થી I<sub>B</sub> ને નિશ્ચિત મૂલ્ય (દા.ત. 20 µA) પર રાખો. V<sub>CC</sub> બદલો અને V<sub>CE</sub> અને I<sub>C</sub> નોંધો. I<sub>B</sub> = 40, 60, 80 µA માટે ફરી કરો. I<sub>C</sub> વિરુદ્ધ V<sub>CE</sub> નો આલેખ દોરો.</li>\n</ol>"}, "diagram": "u4_ce_test"}, {"h": {"en": "4.3.6 CE Input Characteristics", "gu": "4.3.6 CE Input Characteristics"}, "body": {"en": "<p><b>Definition:</b> The curve between <b>base current I<sub>B</sub></b> and <b>base-emitter voltage V<sub>BE</sub></b> at constant <b>V<sub>CE</sub></b>.</p>\n<h4>Observations</h4>\n<ol>\n<li>The curve is similar to the <b>forward characteristic of a P-N diode</b>, because the base-emitter junction is forward biased.</li>\n<li>I<sub>B</sub> is almost zero until V<sub>BE</sub> reaches the <b>knee voltage (≈ 0.7 V for Si, 0.3 V for Ge)</b>. After that I<sub>B</sub> rises rapidly.</li>\n<li>I<sub>B</sub> is in <b>micro-amperes (µA)</b>.</li>\n<li>When V<sub>CE</sub> is increased, the curve shifts slightly to the <b>right</b> (less I<sub>B</sub> for the same V<sub>BE</sub>). This is due to the <b>Early effect</b>: higher V<sub>CE</sub> widens the collector-base depletion layer, the effective base width decreases, fewer carriers recombine in the base, so I<sub>B</sub> decreases.</li>\n</ol>\n<h4>Input resistance</h4>\n<p><b>r<sub>i</sub> = ΔV<sub>BE</sub> / ΔI<sub>B</sub></b> (V<sub>CE</sub> constant) → medium, about <b>1 kΩ</b> (higher than CB).</p>", "gu": "<p><b>વ્યાખ્યા:</b> અચળ <b>V<sub>CE</sub></b> પર <b>base current I<sub>B</sub></b> અને <b>base-emitter voltage V<sub>BE</sub></b> વચ્ચેનો curve.</p>\n<h4>અવલોકનો</h4>\n<ol>\n<li>Base-emitter junction forward biased હોવાથી curve <b>P-N diode ની forward characteristic</b> જેવો છે.</li>\n<li>V<sub>BE</sub> એ <b>knee voltage (Si માટે ≈ 0.7 V, Ge માટે 0.3 V)</b> સુધી પહોંચે ત્યાં સુધી I<sub>B</sub> લગભગ શૂન્ય રહે છે. પછી I<sub>B</sub> ઝડપથી વધે છે.</li>\n<li>I<sub>B</sub> <b>micro-amperes (µA)</b> માં હોય છે.</li>\n<li>V<sub>CE</sub> વધારતાં curve થોડો <b>જમણી</b> તરફ ખસે છે (સમાન V<sub>BE</sub> માટે ઓછો I<sub>B</sub>). આ <b>Early effect</b> ને કારણે છે: વધુ V<sub>CE</sub> collector-base depletion layer ને પહોળું કરે છે, અસરકારક base width ઘટે છે, base માં ઓછા carriers recombine થાય છે, તેથી I<sub>B</sub> ઘટે છે.</li>\n</ol>\n<h4>Input resistance</h4>\n<p><b>r<sub>i</sub> = ΔV<sub>BE</sub> / ΔI<sub>B</sub></b> (V<sub>CE</sub> અચળ) → મધ્યમ, આશરે <b>1 kΩ</b> (CB કરતાં વધુ).</p>"}, "diagram": "u4_ce_input"}, {"h": {"en": "4.3.7 CE Output Characteristics and Regions", "gu": "4.3.7 CE Output Characteristics અને Regions"}, "body": {"en": "<p><b>Definition:</b> The curves between <b>collector current I<sub>C</sub></b> and <b>collector-emitter voltage V<sub>CE</sub></b> for different constant values of <b>I<sub>B</sub></b>.</p>\n<h4>Observations</h4>\n<ol>\n<li>For a fixed I<sub>B</sub>, as V<sub>CE</sub> increases from 0, I<sub>C</sub> rises <b>rapidly</b> at first (up to about 0.2–1 V).</li>\n<li>After that, I<sub>C</sub> becomes almost <b>constant</b> and depends mainly on I<sub>B</sub> (I<sub>C</sub> ≈ β I<sub>B</sub>). The curve rises only slightly due to the Early effect.</li>\n<li>Higher I<sub>B</sub> → higher curve. Equal steps of I<sub>B</sub> give nearly equal steps of I<sub>C</sub>.</li>\n</ol>\n<h4>Three regions</h4>\n<table>\n<tr><th>Region</th><th>Where on graph</th><th>Junctions</th><th>Use</th></tr>\n<tr><td><b>Active</b></td><td>Flat middle part of curves</td><td>J<sub>E</sub> FB, J<sub>C</sub> RB</td><td>Amplifier (I<sub>C</sub> = β I<sub>B</sub>)</td></tr>\n<tr><td><b>Saturation</b></td><td>Steep part near the I<sub>C</sub> axis (V<sub>CE</sub> &lt; ≈ 0.2 V)</td><td>Both FB</td><td>ON switch</td></tr>\n<tr><td><b>Cut-off</b></td><td>Below the I<sub>B</sub> = 0 curve</td><td>Both RB</td><td>OFF switch (only I<sub>CEO</sub> flows)</td></tr>\n</table>\n<h4>Parameters</h4>\n<ul>\n<li><b>Output resistance r<sub>o</sub> = ΔV<sub>CE</sub> / ΔI<sub>C</sub></b> (I<sub>B</sub> constant) → medium (10–50 kΩ).</li>\n<li><b>AC current gain β = ΔI<sub>C</sub> / ΔI<sub>B</sub></b> (V<sub>CE</sub> constant) – can be found from two curves.</li>\n</ul>", "gu": "<p><b>વ્યાખ્યા:</b> <b>I<sub>B</sub></b> ના જુદા જુદા અચળ મૂલ્યો માટે <b>collector current I<sub>C</sub></b> અને <b>collector-emitter voltage V<sub>CE</sub></b> વચ્ચેના curves.</p>\n<h4>અવલોકનો</h4>\n<ol>\n<li>નિશ્ચિત I<sub>B</sub> માટે V<sub>CE</sub> ને 0 થી વધારતાં, શરૂઆતમાં (આશરે 0.2–1 V સુધી) I<sub>C</sub> <b>ઝડપથી</b> વધે છે.</li>\n<li>પછી I<sub>C</sub> લગભગ <b>અચળ</b> બને છે અને મુખ્યત્વે I<sub>B</sub> પર આધાર રાખે છે (I<sub>C</sub> ≈ β I<sub>B</sub>). Early effect ને કારણે curve થોડો જ વધે છે.</li>\n<li>વધુ I<sub>B</sub> → ઉંચો curve. I<sub>B</sub> ના સમાન પગલાં I<sub>C</sub> ના લગભગ સમાન પગલાં આપે.</li>\n</ol>\n<h4>ત્રણ regions</h4>\n<table>\n<tr><th>Region</th><th>આલેખ પર ક્યાં</th><th>Junctions</th><th>ઉપયોગ</th></tr>\n<tr><td><b>Active</b></td><td>Curves નો સપાટ મધ્ય ભાગ</td><td>J<sub>E</sub> FB, J<sub>C</sub> RB</td><td>Amplifier (I<sub>C</sub> = β I<sub>B</sub>)</td></tr>\n<tr><td><b>Saturation</b></td><td>I<sub>C</sub> axis નજીકનો ઊભો ભાગ (V<sub>CE</sub> &lt; ≈ 0.2 V)</td><td>બંને FB</td><td>ON switch</td></tr>\n<tr><td><b>Cut-off</b></td><td>I<sub>B</sub> = 0 curve ની નીચે</td><td>બંને RB</td><td>OFF switch (ફક્ત I<sub>CEO</sub> વહે)</td></tr>\n</table>\n<h4>Parameters</h4>\n<ul>\n<li><b>Output resistance r<sub>o</sub> = ΔV<sub>CE</sub> / ΔI<sub>C</sub></b> (I<sub>B</sub> અચળ) → મધ્યમ (10–50 kΩ).</li>\n<li><b>AC current gain β = ΔI<sub>C</sub> / ΔI<sub>B</sub></b> (V<sub>CE</sub> અચળ) – બે curves પરથી શોધી શકાય.</li>\n</ul>"}, "diagram": "u4_ce_output"}, {"h": {"en": "4.3.8 Common Collector (CC) Configuration", "gu": "4.3.8 Common Collector (CC) Configuration"}, "body": {"en": "<p>In CC configuration the <b>collector is common</b> to input and output. Input is applied between <b>base and collector</b>, and output is taken across the emitter resistor, between <b>emitter and collector</b> (see diagram). The collector is common through V<sub>CC</sub> (AC ground).</p>\n<ul>\n<li>Input current = <b>I<sub>B</sub></b>; output current = <b>I<sub>E</sub></b>.</li>\n<li>It is also called an <b>emitter follower</b>, because the output (emitter) voltage follows the input (base) voltage: V<sub>out</sub> ≈ V<sub>in</sub> − 0.7 V.</li>\n</ul>\n<h4>Current amplification factor (γ)</h4>\n<p><b>γ = ΔI<sub>E</sub> / ΔI<sub>B</sub> = 1 + β</b> → highest current gain.</p>\n<h4>Features</h4>\n<ul>\n<li>Current gain: <b>highest</b> (1 + β)</li>\n<li>Voltage gain: <b>less than 1</b> (≈ 1)</li>\n<li>Power gain: low (≈ γ)</li>\n<li>Input resistance: very <b>high</b> (≈ 100 kΩ – 1 MΩ)</li>\n<li>Output resistance: very <b>low</b> (≈ 10 – 100 Ω)</li>\n<li>Phase shift: <b>0°</b></li>\n<li>Application: <b>buffer amplifier</b>, <b>impedance matching</b> (high to low impedance), driving low-impedance loads such as speakers</li>\n</ul>", "gu": "<p>CC configuration માં <b>collector input અને output માટે common</b> છે. Input <b>base અને collector</b> વચ્ચે લગાવાય છે અને output emitter resistor પરથી, <b>emitter અને collector</b> વચ્ચેથી લેવાય છે (આકૃતિ જુઓ). Collector, V<sub>CC</sub> (AC ground) દ્વારા common છે.</p>\n<ul>\n<li>Input current = <b>I<sub>B</sub></b>; output current = <b>I<sub>E</sub></b>.</li>\n<li>તેને <b>Emitter follower</b> પણ કહે છે, કારણ કે output (emitter) voltage input (base) voltage ને અનુસરે છે: V<sub>out</sub> ≈ V<sub>in</sub> − 0.7 V.</li>\n</ul>\n<h4>Current amplification factor (γ)</h4>\n<p><b>γ = ΔI<sub>E</sub> / ΔI<sub>B</sub> = 1 + β</b> → સૌથી વધુ current gain.</p>\n<h4>લક્ષણો</h4>\n<ul>\n<li>Current gain: <b>સૌથી વધુ</b> (1 + β)</li>\n<li>Voltage gain: <b>1 થી ઓછો</b> (≈ 1)</li>\n<li>Power gain: ઓછો (≈ γ)</li>\n<li>Input resistance: ખૂબ <b>વધુ</b> (≈ 100 kΩ – 1 MΩ)</li>\n<li>Output resistance: ખૂબ <b>ઓછો</b> (≈ 10 – 100 Ω)</li>\n<li>Phase shift: <b>0°</b></li>\n<li>ઉપયોગ: <b>Buffer amplifier</b>, <b>Impedance matching</b> (વધુ થી ઓછા impedance સુધી), speakers જેવા ઓછા impedance વાળા loads ચલાવવા</li>\n</ul>"}, "diagram": "u4_cc"}, {"h": {"en": "4.3.9 Comparison of CB, CE and CC Configurations", "gu": "4.3.9 CB, CE અને CC Configurations ની સરખામણી"}, "body": {"en": "<table>\n<tr><th>Parameter</th><th>CB</th><th>CE</th><th>CC</th></tr>\n<tr><td>Common terminal</td><td>Base</td><td>Emitter</td><td>Collector</td></tr>\n<tr><td>Input / Output</td><td>E-B / C-B</td><td>B-E / C-E</td><td>B-C / E-C</td></tr>\n<tr><td>Input current / Output current</td><td>I<sub>E</sub> / I<sub>C</sub></td><td>I<sub>B</sub> / I<sub>C</sub></td><td>I<sub>B</sub> / I<sub>E</sub></td></tr>\n<tr><td>Current gain</td><td>α &lt; 1</td><td>β (high, 20–500)</td><td>γ = 1 + β (highest)</td></tr>\n<tr><td>Voltage gain</td><td>High</td><td>High</td><td>&lt; 1 (≈ 1)</td></tr>\n<tr><td>Power gain</td><td>Medium</td><td>Highest</td><td>Low</td></tr>\n<tr><td>Input resistance</td><td>Very low (20–100 Ω)</td><td>Medium (≈ 1 kΩ)</td><td>Very high (100 kΩ–1 MΩ)</td></tr>\n<tr><td>Output resistance</td><td>Very high (≈ 1 MΩ)</td><td>Medium (10–50 kΩ)</td><td>Very low (10–100 Ω)</td></tr>\n<tr><td>Phase shift</td><td>0°</td><td>180°</td><td>0°</td></tr>\n<tr><td>Applications</td><td>High-frequency (RF) amplifier</td><td>Audio / voltage amplifier, switch</td><td>Buffer, impedance matching</td></tr>\n</table>\n<p><b>Why is CE the most popular?</b> It gives high current gain, high voltage gain and the <b>highest power gain</b>; its input and output resistances are moderate, so stages can be cascaded easily.</p>", "gu": "<table>\n<tr><th>Parameter</th><th>CB</th><th>CE</th><th>CC</th></tr>\n<tr><td>Common terminal</td><td>Base</td><td>Emitter</td><td>Collector</td></tr>\n<tr><td>Input / Output</td><td>E-B / C-B</td><td>B-E / C-E</td><td>B-C / E-C</td></tr>\n<tr><td>Input current / Output current</td><td>I<sub>E</sub> / I<sub>C</sub></td><td>I<sub>B</sub> / I<sub>C</sub></td><td>I<sub>B</sub> / I<sub>E</sub></td></tr>\n<tr><td>Current gain</td><td>α &lt; 1</td><td>β (વધુ, 20–500)</td><td>γ = 1 + β (સૌથી વધુ)</td></tr>\n<tr><td>Voltage gain</td><td>વધુ</td><td>વધુ</td><td>&lt; 1 (≈ 1)</td></tr>\n<tr><td>Power gain</td><td>મધ્યમ</td><td>સૌથી વધુ</td><td>ઓછો</td></tr>\n<tr><td>Input resistance</td><td>ખૂબ ઓછો (20–100 Ω)</td><td>મધ્યમ (≈ 1 kΩ)</td><td>ખૂબ વધુ (100 kΩ–1 MΩ)</td></tr>\n<tr><td>Output resistance</td><td>ખૂબ વધુ (≈ 1 MΩ)</td><td>મધ્યમ (10–50 kΩ)</td><td>ખૂબ ઓછો (10–100 Ω)</td></tr>\n<tr><td>Phase shift</td><td>0°</td><td>180°</td><td>0°</td></tr>\n<tr><td>ઉપયોગો</td><td>High-frequency (RF) amplifier</td><td>Audio / voltage amplifier, switch</td><td>Buffer, impedance matching</td></tr>\n</table>\n<p><b>CE સૌથી લોકપ્રિય કેમ?</b> તે વધુ current gain, વધુ voltage gain અને <b>સૌથી વધુ power gain</b> આપે છે; તેના input અને output resistances મધ્યમ છે, તેથી stages સહેલાઈથી cascade કરી શકાય.</p>"}}, {"h": {"en": "Key Points – 4.3", "gu": "મુખ્ય મુદ્દા – 4.3"}, "body": {"en": "<ul>\n<li>Three configurations: <b>CB, CE, CC</b> – named after the terminal common to input and output.</li>\n<li>CB: α &lt; 1, low r<sub>i</sub>, very high r<sub>o</sub>, 0° phase → RF amplifier.</li>\n<li>CE: β high, highest power gain, 180° phase → most popular (amplifier, switch).</li>\n<li>CC (emitter follower): γ = 1 + β, A<sub>v</sub> ≈ 1, high r<sub>i</sub>, low r<sub>o</sub> → buffer.</li>\n<li>CE input char.: I<sub>B</sub> vs V<sub>BE</sub> (like a diode; knee 0.7 V); shifts right with higher V<sub>CE</sub> (Early effect).</li>\n<li>CE output char.: I<sub>C</sub> vs V<sub>CE</sub> for fixed I<sub>B</sub>; regions – active, saturation, cut-off.</li>\n<li>r<sub>i</sub> = ΔV<sub>BE</sub>/ΔI<sub>B</sub>; r<sub>o</sub> = ΔV<sub>CE</sub>/ΔI<sub>C</sub>.</li>\n</ul>", "gu": "<ul>\n<li>ત્રણ configurations: <b>CB, CE, CC</b> – input અને output માટે common terminal પરથી નામ.</li>\n<li>CB: α &lt; 1, ઓછો r<sub>i</sub>, ખૂબ વધુ r<sub>o</sub>, 0° phase → RF amplifier.</li>\n<li>CE: β વધુ, સૌથી વધુ power gain, 180° phase → સૌથી લોકપ્રિય (amplifier, switch).</li>\n<li>CC (emitter follower): γ = 1 + β, A<sub>v</sub> ≈ 1, વધુ r<sub>i</sub>, ઓછો r<sub>o</sub> → buffer.</li>\n<li>CE input char.: I<sub>B</sub> વિરુદ્ધ V<sub>BE</sub> (diode જેવો; knee 0.7 V); વધુ V<sub>CE</sub> સાથે જમણી તરફ ખસે (Early effect).</li>\n<li>CE output char.: નિશ્ચિત I<sub>B</sub> માટે I<sub>C</sub> વિરુદ્ધ V<sub>CE</sub>; regions – active, saturation, cut-off.</li>\n<li>r<sub>i</sub> = ΔV<sub>BE</sub>/ΔI<sub>B</sub>; r<sub>o</sub> = ΔV<sub>CE</sub>/ΔI<sub>C</sub>.</li>\n</ul>"}, "key": true}]}, {"title": {"en": "4.4 Current Gain and Voltage Gain", "gu": "4.4 Current Gain અને Voltage Gain"}, "items": [{"h": {"en": "4.4.1 Current Gain (α, β, γ) and Their Relations", "gu": "4.4.1 Current Gain (α, β, γ) અને તેમના સંબંધો"}, "body": {"en": "<p><b>Current gain</b> = output current / input current. It has <b>no unit</b>.</p>\n<table>\n<tr><th>Gain</th><th>Configuration</th><th>Formula</th><th>Typical value</th></tr>\n<tr><td><b>α</b> (alpha)</td><td>CB</td><td>α = I<sub>C</sub> / I<sub>E</sub></td><td>0.95 – 0.995 (&lt; 1)</td></tr>\n<tr><td><b>β</b> (beta, h<sub>FE</sub>)</td><td>CE</td><td>β = I<sub>C</sub> / I<sub>B</sub></td><td>20 – 500</td></tr>\n<tr><td><b>γ</b> (gamma)</td><td>CC</td><td>γ = I<sub>E</sub> / I<sub>B</sub></td><td>21 – 501 (= 1 + β)</td></tr>\n</table>\n<p><b>DC gain</b> uses DC values (e.g. β<sub>dc</sub> = h<sub>FE</sub> = I<sub>C</sub>/I<sub>B</sub>); <b>AC gain</b> uses small changes (β<sub>ac</sub> = h<sub>fe</sub> = ΔI<sub>C</sub>/ΔI<sub>B</sub>). In basic problems they are taken as equal.</p>\n<h4>Derivation of relations</h4>\n<p>Start with I<sub>E</sub> = I<sub>B</sub> + I<sub>C</sub>.</p>\n<p><b>(1) β in terms of α:</b> β = I<sub>C</sub>/I<sub>B</sub> = I<sub>C</sub>/(I<sub>E</sub> − I<sub>C</sub>). Divide numerator and denominator by I<sub>E</sub>:</p>\n<p>β = (I<sub>C</sub>/I<sub>E</sub>) / (1 − I<sub>C</sub>/I<sub>E</sub>) → <b>β = α / (1 − α)</b></p>\n<p><b>(2) α in terms of β:</b> α = I<sub>C</sub>/I<sub>E</sub> = I<sub>C</sub>/(I<sub>B</sub> + I<sub>C</sub>). Divide by I<sub>B</sub>:</p>\n<p>α = β / (1 + β) → <b>α = β / (1 + β)</b></p>\n<p><b>(3) γ in terms of β:</b> γ = I<sub>E</sub>/I<sub>B</sub> = (I<sub>B</sub> + I<sub>C</sub>)/I<sub>B</sub> → <b>γ = 1 + β</b></p>\n<p><b>(4) γ in terms of α:</b> γ = 1 + α/(1 − α) → <b>γ = 1 / (1 − α)</b></p>\n<p>As α → 1, β becomes very large: α = 0.99 → β = 99; α = 0.995 → β = 199.</p>", "gu": "<p><b>Current gain</b> = output current / input current. તેનો <b>કોઈ એકમ નથી</b>.</p>\n<table>\n<tr><th>Gain</th><th>Configuration</th><th>સૂત્ર</th><th>સામાન્ય મૂલ્ય</th></tr>\n<tr><td><b>α</b> (alpha)</td><td>CB</td><td>α = I<sub>C</sub> / I<sub>E</sub></td><td>0.95 – 0.995 (&lt; 1)</td></tr>\n<tr><td><b>β</b> (beta, h<sub>FE</sub>)</td><td>CE</td><td>β = I<sub>C</sub> / I<sub>B</sub></td><td>20 – 500</td></tr>\n<tr><td><b>γ</b> (gamma)</td><td>CC</td><td>γ = I<sub>E</sub> / I<sub>B</sub></td><td>21 – 501 (= 1 + β)</td></tr>\n</table>\n<p><b>DC gain</b> માં DC મૂલ્યો વપરાય (દા.ત. β<sub>dc</sub> = h<sub>FE</sub> = I<sub>C</sub>/I<sub>B</sub>); <b>AC gain</b> માં નાના ફેરફારો વપરાય (β<sub>ac</sub> = h<sub>fe</sub> = ΔI<sub>C</sub>/ΔI<sub>B</sub>). સામાન્ય દાખલાઓમાં બંને સમાન લેવાય છે.</p>\n<h4>સંબંધોની સાબિતી (Derivation)</h4>\n<p>I<sub>E</sub> = I<sub>B</sub> + I<sub>C</sub> થી શરૂ કરો.</p>\n<p><b>(1) α ના રૂપમાં β:</b> β = I<sub>C</sub>/I<sub>B</sub> = I<sub>C</sub>/(I<sub>E</sub> − I<sub>C</sub>). અંશ અને છેદ ને I<sub>E</sub> વડે ભાગો:</p>\n<p>β = (I<sub>C</sub>/I<sub>E</sub>) / (1 − I<sub>C</sub>/I<sub>E</sub>) → <b>β = α / (1 − α)</b></p>\n<p><b>(2) β ના રૂપમાં α:</b> α = I<sub>C</sub>/I<sub>E</sub> = I<sub>C</sub>/(I<sub>B</sub> + I<sub>C</sub>). I<sub>B</sub> વડે ભાગો:</p>\n<p>α = β / (1 + β) → <b>α = β / (1 + β)</b></p>\n<p><b>(3) β ના રૂપમાં γ:</b> γ = I<sub>E</sub>/I<sub>B</sub> = (I<sub>B</sub> + I<sub>C</sub>)/I<sub>B</sub> → <b>γ = 1 + β</b></p>\n<p><b>(4) α ના રૂપમાં γ:</b> γ = 1 + α/(1 − α) → <b>γ = 1 / (1 − α)</b></p>\n<p>α → 1 થાય તેમ β ખૂબ મોટો બને: α = 0.99 → β = 99; α = 0.995 → β = 199.</p>"}, "examples": ["u4n6"]}, {"h": {"en": "4.4.2 Voltage Gain and Power Gain", "gu": "4.4.2 Voltage Gain અને Power Gain"}, "body": {"en": "<h4>Voltage gain (A<sub>v</sub>)</h4>\n<p><b>A<sub>v</sub> = output voltage / input voltage = ΔV<sub>out</sub> / ΔV<sub>in</sub></b></p>\n<p>Output voltage = output current × load resistance (R<sub>L</sub>); input voltage = input current × input resistance (r<sub>i</sub>).</p>\n<table>\n<tr><th>Configuration</th><th>Voltage gain</th><th>Remark</th></tr>\n<tr><td>CB</td><td><b>A<sub>v</sub> = α × R<sub>L</sub> / r<sub>i</sub></b></td><td>High, because R<sub>L</sub> ≫ r<sub>i</sub></td></tr>\n<tr><td>CE</td><td><b>A<sub>v</sub> = β × R<sub>L</sub> / r<sub>i</sub></b></td><td>High; output inverted (−)</td></tr>\n<tr><td>CC</td><td><b>A<sub>v</sub> ≈ 1</b> (slightly less)</td><td>Output follows input</td></tr>\n</table>\n<p>Even though α &lt; 1 in CB, voltage gain is high because the output resistance (load) is much larger than the input resistance. That is why the device is called a <b>trans-resistor</b>.</p>\n<h4>Power gain (A<sub>p</sub>)</h4>\n<p><b>A<sub>p</sub> = output power / input power = current gain × voltage gain</b></p>\n<ul>\n<li>CB: A<sub>p</sub> = α × A<sub>v</sub> (medium)</li>\n<li>CE: A<sub>p</sub> = β × A<sub>v</sub> = β² R<sub>L</sub> / r<sub>i</sub> (<b>highest</b>)</li>\n<li>CC: A<sub>p</sub> ≈ γ (low)</li>\n</ul>\n<h4>Gain in decibels</h4>\n<p>Power gain (dB) = 10 log<sub>10</sub> A<sub>p</sub>; voltage gain (dB) = 20 log<sub>10</sub> A<sub>v</sub>.</p>", "gu": "<h4>Voltage gain (A<sub>v</sub>)</h4>\n<p><b>A<sub>v</sub> = output voltage / input voltage = ΔV<sub>out</sub> / ΔV<sub>in</sub></b></p>\n<p>Output voltage = output current × load resistance (R<sub>L</sub>); input voltage = input current × input resistance (r<sub>i</sub>).</p>\n<table>\n<tr><th>Configuration</th><th>Voltage gain</th><th>નોંધ</th></tr>\n<tr><td>CB</td><td><b>A<sub>v</sub> = α × R<sub>L</sub> / r<sub>i</sub></b></td><td>વધુ, કારણ કે R<sub>L</sub> ≫ r<sub>i</sub></td></tr>\n<tr><td>CE</td><td><b>A<sub>v</sub> = β × R<sub>L</sub> / r<sub>i</sub></b></td><td>વધુ; output ઉલટો (−)</td></tr>\n<tr><td>CC</td><td><b>A<sub>v</sub> ≈ 1</b> (થોડો ઓછો)</td><td>Output input ને અનુસરે</td></tr>\n</table>\n<p>CB માં α &lt; 1 હોવા છતાં voltage gain વધુ છે, કારણ કે output resistance (load) input resistance કરતાં ઘણો વધુ છે. તેથી જ device ને <b>trans-resistor</b> કહે છે.</p>\n<h4>Power gain (A<sub>p</sub>)</h4>\n<p><b>A<sub>p</sub> = output power / input power = current gain × voltage gain</b></p>\n<ul>\n<li>CB: A<sub>p</sub> = α × A<sub>v</sub> (મધ્યમ)</li>\n<li>CE: A<sub>p</sub> = β × A<sub>v</sub> = β² R<sub>L</sub> / r<sub>i</sub> (<b>સૌથી વધુ</b>)</li>\n<li>CC: A<sub>p</sub> ≈ γ (ઓછો)</li>\n</ul>\n<h4>Decibels માં gain</h4>\n<p>Power gain (dB) = 10 log<sub>10</sub> A<sub>p</sub>; voltage gain (dB) = 20 log<sub>10</sub> A<sub>v</sub>.</p>"}, "examples": ["u4n4", "u4n5"]}, {"h": {"en": "4.4.3 Comparison of Gains", "gu": "4.4.3 Gains ની સરખામણી"}, "body": {"en": "<table>\n<tr><th>Gain</th><th>CB</th><th>CE</th><th>CC</th></tr>\n<tr><td>Current gain</td><td>α (&lt; 1)</td><td>β (high)</td><td>1 + β (highest)</td></tr>\n<tr><td>Voltage gain</td><td>High (α R<sub>L</sub>/r<sub>i</sub>)</td><td>High (β R<sub>L</sub>/r<sub>i</sub>)</td><td>≈ 1</td></tr>\n<tr><td>Power gain</td><td>Medium</td><td>Highest</td><td>Low</td></tr>\n</table>\n<h4>Remember</h4>\n<ul>\n<li><b>CB</b> → voltage gain only (no current gain).</li>\n<li><b>CC</b> → current gain only (no voltage gain).</li>\n<li><b>CE</b> → both current and voltage gain → maximum power gain.</li>\n</ul>", "gu": "<table>\n<tr><th>Gain</th><th>CB</th><th>CE</th><th>CC</th></tr>\n<tr><td>Current gain</td><td>α (&lt; 1)</td><td>β (વધુ)</td><td>1 + β (સૌથી વધુ)</td></tr>\n<tr><td>Voltage gain</td><td>વધુ (α R<sub>L</sub>/r<sub>i</sub>)</td><td>વધુ (β R<sub>L</sub>/r<sub>i</sub>)</td><td>≈ 1</td></tr>\n<tr><td>Power gain</td><td>મધ્યમ</td><td>સૌથી વધુ</td><td>ઓછો</td></tr>\n</table>\n<h4>યાદ રાખો</h4>\n<ul>\n<li><b>CB</b> → ફક્ત voltage gain (current gain નહીં).</li>\n<li><b>CC</b> → ફક્ત current gain (voltage gain નહીં).</li>\n<li><b>CE</b> → current અને voltage બંને gain → મહત્તમ power gain.</li>\n</ul>"}}, {"h": {"en": "Key Points – 4.4", "gu": "મુખ્ય મુદ્દા – 4.4"}, "body": {"en": "<ul>\n<li><b>α = I<sub>C</sub>/I<sub>E</sub></b>, <b>β = I<sub>C</sub>/I<sub>B</sub></b>, <b>γ = I<sub>E</sub>/I<sub>B</sub></b> (no units).</li>\n<li><b>β = α/(1 − α)</b>, <b>α = β/(1 + β)</b>, <b>γ = 1 + β = 1/(1 − α)</b>.</li>\n<li>Voltage gain: CB = α R<sub>L</sub>/r<sub>i</sub>, CE = β R<sub>L</sub>/r<sub>i</sub>, CC ≈ 1.</li>\n<li>Power gain = current gain × voltage gain; highest in CE.</li>\n<li>dB: A<sub>p</sub>(dB) = 10 log A<sub>p</sub>, A<sub>v</sub>(dB) = 20 log A<sub>v</sub>.</li>\n</ul>", "gu": "<ul>\n<li><b>α = I<sub>C</sub>/I<sub>E</sub></b>, <b>β = I<sub>C</sub>/I<sub>B</sub></b>, <b>γ = I<sub>E</sub>/I<sub>B</sub></b> (એકમ નથી).</li>\n<li><b>β = α/(1 − α)</b>, <b>α = β/(1 + β)</b>, <b>γ = 1 + β = 1/(1 − α)</b>.</li>\n<li>Voltage gain: CB = α R<sub>L</sub>/r<sub>i</sub>, CE = β R<sub>L</sub>/r<sub>i</sub>, CC ≈ 1.</li>\n<li>Power gain = current gain × voltage gain; CE માં સૌથી વધુ.</li>\n<li>dB: A<sub>p</sub>(dB) = 10 log A<sub>p</sub>, A<sub>v</sub>(dB) = 20 log A<sub>v</sub>.</li>\n</ul>"}, "key": true}]}, {"title": {"en": "4.5 Transistor as a Switch", "gu": "4.5 Switch તરીકે Transistor"}, "items": [{"h": {"en": "4.5.1 DC Load Line and Regions for Switching", "gu": "4.5.1 DC Load Line અને Switching માટેના Regions"}, "body": {"en": "<p>In a CE circuit, applying KVL to the collector loop:</p>\n<p><b>V<sub>CE</sub> = V<sub>CC</sub> − I<sub>C</sub> R<sub>C</sub></b></p>\n<p>This is the equation of a straight line called the <b>DC load line</b>. It is drawn on the output characteristics using two points:</p>\n<ul>\n<li><b>Cut-off point</b> (I<sub>C</sub> = 0): V<sub>CE</sub> = V<sub>CC</sub></li>\n<li><b>Saturation point</b> (V<sub>CE</sub> ≈ 0): I<sub>C(sat)</sub> = V<sub>CC</sub> / R<sub>C</sub></li>\n</ul>\n<p>The operating point (Q-point) of the transistor always lies on this load line.</p>\n<h4>Use of the regions</h4>\n<ul>\n<li><b>Amplifier:</b> Q-point in the middle of the load line (<b>active region</b>).</li>\n<li><b>Switch:</b> the transistor is operated only at the two ends of the load line – <b>cut-off (OFF)</b> and <b>saturation (ON)</b>. It moves quickly between them and does not stay in the active region.</li>\n</ul>", "gu": "<p>CE circuit માં collector loop પર KVL લગાવતાં:</p>\n<p><b>V<sub>CE</sub> = V<sub>CC</sub> − I<sub>C</sub> R<sub>C</sub></b></p>\n<p>આ એક સીધી રેખાનું સમીકરણ છે જેને <b>DC load line</b> કહે છે. તે output characteristics પર બે બિંદુઓથી દોરાય છે:</p>\n<ul>\n<li><b>Cut-off બિંદુ</b> (I<sub>C</sub> = 0): V<sub>CE</sub> = V<sub>CC</sub></li>\n<li><b>Saturation બિંદુ</b> (V<sub>CE</sub> ≈ 0): I<sub>C(sat)</sub> = V<sub>CC</sub> / R<sub>C</sub></li>\n</ul>\n<p>Transistor નું operating point (Q-point) હંમેશા આ load line પર જ હોય છે.</p>\n<h4>Regions નો ઉપયોગ</h4>\n<ul>\n<li><b>Amplifier:</b> Q-point load line ના મધ્યમાં (<b>active region</b>).</li>\n<li><b>Switch:</b> transistor ફક્ત load line ના બે છેડે ચલાવાય છે – <b>cut-off (OFF)</b> અને <b>saturation (ON)</b>. તે તેમની વચ્ચે ઝડપથી બદલાય છે અને active region માં રહેતો નથી.</li>\n</ul>"}, "diagram": "u4_load_line", "examples": ["u4n9"]}, {"h": {"en": "4.5.2 Working of Transistor as a Switch", "gu": "4.5.2 Switch તરીકે Transistor નું કાર્ય"}, "body": {"en": "<p><b>Circuit:</b> An NPN transistor in CE configuration. The load (LED, lamp, relay) with R<sub>C</sub> is connected between +V<sub>CC</sub> and the collector; the emitter is grounded; the input V<sub>in</sub> is applied to the base through R<sub>B</sub> (see diagram).</p>\n<h4>1. Switch OFF – Cut-off region (V<sub>in</sub> = 0 / LOW)</h4>\n<ul>\n<li>V<sub>BE</sub> &lt; 0.7 V → both junctions reverse biased.</li>\n<li>I<sub>B</sub> = 0, so I<sub>C</sub> ≈ 0 (only tiny leakage).</li>\n<li>No voltage drop across R<sub>C</sub>, so <b>V<sub>CE</sub> ≈ V<sub>CC</sub></b>.</li>\n<li>The transistor behaves like an <b>open switch</b> between C and E → load (LED) is OFF.</li>\n</ul>\n<h4>2. Switch ON – Saturation region (V<sub>in</sub> = HIGH)</h4>\n<ul>\n<li>Large base current flows, both junctions become forward biased.</li>\n<li>I<sub>C</sub> reaches its maximum: <b>I<sub>C(sat)</sub> = (V<sub>CC</sub> − V<sub>CE(sat)</sub>) / R<sub>C</sub> ≈ V<sub>CC</sub> / R<sub>C</sub></b>.</li>\n<li><b>V<sub>CE(sat)</sub> ≈ 0.2 V</b> (almost zero).</li>\n<li>The transistor behaves like a <b>closed switch</b> → load (LED) is ON.</li>\n</ul>\n<h4>Condition for saturation</h4>\n<p><b>I<sub>B</sub> &gt; I<sub>C(sat)</sub> / β</b>. In practice I<sub>B</sub> is taken 2–10 times this value to make sure the transistor is fully ON (hard saturation).</p>\n<p>Base resistor: <b>R<sub>B</sub> = (V<sub>in</sub> − V<sub>BE</sub>) / I<sub>B</sub></b></p>\n<h4>Transistor switch as an inverter (NOT gate)</h4>\n<p>Input LOW → output (V<sub>CE</sub>) HIGH; input HIGH → output LOW. So the transistor switch acts as a <b>NOT gate</b>.</p>\n<table>\n<tr><th>Point</th><th>OFF (cut-off)</th><th>ON (saturation)</th></tr>\n<tr><td>V<sub>in</sub></td><td>0 (LOW)</td><td>HIGH</td></tr>\n<tr><td>J<sub>E</sub>, J<sub>C</sub></td><td>Both reverse</td><td>Both forward</td></tr>\n<tr><td>I<sub>C</sub></td><td>≈ 0</td><td>I<sub>C(sat)</sub> ≈ V<sub>CC</sub>/R<sub>C</sub></td></tr>\n<tr><td>V<sub>CE</sub></td><td>≈ V<sub>CC</sub></td><td>≈ 0.2 V</td></tr>\n<tr><td>Acts as</td><td>Open switch</td><td>Closed switch</td></tr>\n</table>", "gu": "<p><b>Circuit:</b> CE configuration માં NPN transistor. Load (LED, lamp, relay) R<sub>C</sub> સાથે +V<sub>CC</sub> અને collector વચ્ચે જોડાય છે; emitter ground થાય છે; input V<sub>in</sub> R<sub>B</sub> દ્વારા base પર લગાવાય છે (આકૃતિ જુઓ).</p>\n<h4>1. Switch OFF – Cut-off region (V<sub>in</sub> = 0 / LOW)</h4>\n<ul>\n<li>V<sub>BE</sub> &lt; 0.7 V → બંને junctions reverse biased.</li>\n<li>I<sub>B</sub> = 0, તેથી I<sub>C</sub> ≈ 0 (ફક્ત ખૂબ નાનો leakage).</li>\n<li>R<sub>C</sub> પર કોઈ voltage drop નહીં, તેથી <b>V<sub>CE</sub> ≈ V<sub>CC</sub></b>.</li>\n<li>Transistor C અને E વચ્ચે <b>ખુલ્લા switch</b> જેવું વર્તે છે → load (LED) OFF.</li>\n</ul>\n<h4>2. Switch ON – Saturation region (V<sub>in</sub> = HIGH)</h4>\n<ul>\n<li>મોટો base current વહે છે, બંને junctions forward biased થાય છે.</li>\n<li>I<sub>C</sub> મહત્તમ થાય છે: <b>I<sub>C(sat)</sub> = (V<sub>CC</sub> − V<sub>CE(sat)</sub>) / R<sub>C</sub> ≈ V<sub>CC</sub> / R<sub>C</sub></b>.</li>\n<li><b>V<sub>CE(sat)</sub> ≈ 0.2 V</b> (લગભગ શૂન્ય).</li>\n<li>Transistor <b>બંધ switch</b> જેવું વર્તે છે → load (LED) ON.</li>\n</ul>\n<h4>Saturation માટેની શરત</h4>\n<p><b>I<sub>B</sub> &gt; I<sub>C(sat)</sub> / β</b>. વ્યવહારમાં transistor સંપૂર્ણ ON (hard saturation) થાય તે માટે I<sub>B</sub> આ મૂલ્ય કરતાં 2–10 ગણો લેવાય છે.</p>\n<p>Base resistor: <b>R<sub>B</sub> = (V<sub>in</sub> − V<sub>BE</sub>) / I<sub>B</sub></b></p>\n<h4>Inverter (NOT gate) તરીકે transistor switch</h4>\n<p>Input LOW → output (V<sub>CE</sub>) HIGH; input HIGH → output LOW. તેથી transistor switch <b>NOT gate</b> તરીકે કામ કરે છે.</p>\n<table>\n<tr><th>મુદ્દો</th><th>OFF (cut-off)</th><th>ON (saturation)</th></tr>\n<tr><td>V<sub>in</sub></td><td>0 (LOW)</td><td>HIGH</td></tr>\n<tr><td>J<sub>E</sub>, J<sub>C</sub></td><td>બંને reverse</td><td>બંને forward</td></tr>\n<tr><td>I<sub>C</sub></td><td>≈ 0</td><td>I<sub>C(sat)</sub> ≈ V<sub>CC</sub>/R<sub>C</sub></td></tr>\n<tr><td>V<sub>CE</sub></td><td>≈ V<sub>CC</sub></td><td>≈ 0.2 V</td></tr>\n<tr><td>વર્તન</td><td>ખુલ્લું switch</td><td>બંધ switch</td></tr>\n</table>"}, "diagram": "u4_switch", "examples": ["u4n7"]}, {"h": {"en": "4.5.3 Applications and Advantages of Transistor Switch", "gu": "4.5.3 Transistor Switch ના ઉપયોગો અને ફાયદા"}, "body": {"en": "<h4>Applications</h4>\n<ul>\n<li><b>LED / lamp driver</b> – microcontroller (Arduino) pins give small current; a transistor switches the larger load current.</li>\n<li><b>Relay driver</b> – switches a relay coil to control AC appliances (with a freewheeling diode across the coil).</li>\n<li><b>Motor and buzzer control</b>.</li>\n<li><b>Digital logic circuits</b> – NOT, NAND, NOR gates (TTL logic).</li>\n<li><b>Automatic street light</b> (with LDR), fire/water-level alarms, touch switches.</li>\n<li>Switching power supplies (SMPS), inverters and PWM control.</li>\n</ul>\n<h4>Advantages over a mechanical switch</h4>\n<table>\n<tr><th>Point</th><th>Transistor switch</th><th>Mechanical switch</th></tr>\n<tr><td>Moving parts</td><td>None</td><td>Yes (wear and tear)</td></tr>\n<tr><td>Switching speed</td><td>Very fast (µs – ns)</td><td>Slow (ms)</td></tr>\n<tr><td>Sparking / bouncing</td><td>No</td><td>Yes</td></tr>\n<tr><td>Control</td><td>Electronic (small signal)</td><td>Manual</td></tr>\n<tr><td>Life</td><td>Very long</td><td>Limited</td></tr>\n<tr><td>Size</td><td>Very small</td><td>Larger</td></tr>\n</table>\n<p><b>Limitations:</b> small voltage drop when ON (V<sub>CE(sat)</sub>), small leakage when OFF, limited current/voltage rating; it is used for DC loads (AC loads via relay/TRIAC).</p>", "gu": "<h4>ઉપયોગો</h4>\n<ul>\n<li><b>LED / lamp driver</b> – microcontroller (Arduino) pins નાનો current આપે છે; transistor મોટો load current switch કરે છે.</li>\n<li><b>Relay driver</b> – AC appliances નિયંત્રિત કરવા relay coil ને switch કરે (coil પર freewheeling diode સાથે).</li>\n<li><b>Motor અને buzzer નિયંત્રણ</b>.</li>\n<li><b>Digital logic circuits</b> – NOT, NAND, NOR gates (TTL logic).</li>\n<li><b>Automatic street light</b> (LDR સાથે), fire/water-level alarms, touch switches.</li>\n<li>Switching power supplies (SMPS), inverters અને PWM control.</li>\n</ul>\n<h4>Mechanical switch કરતાં ફાયદા</h4>\n<table>\n<tr><th>મુદ્દો</th><th>Transistor switch</th><th>Mechanical switch</th></tr>\n<tr><td>હલતા ભાગો</td><td>નથી</td><td>છે (ઘસારો)</td></tr>\n<tr><td>Switching ઝડપ</td><td>ખૂબ ઝડપી (µs – ns)</td><td>ધીમું (ms)</td></tr>\n<tr><td>Sparking / bouncing</td><td>નથી</td><td>છે</td></tr>\n<tr><td>નિયંત્રણ</td><td>Electronic (નાનો signal)</td><td>હાથથી</td></tr>\n<tr><td>આયુષ્ય</td><td>ખૂબ લાંબું</td><td>મર્યાદિત</td></tr>\n<tr><td>કદ</td><td>ખૂબ નાનું</td><td>મોટું</td></tr>\n</table>\n<p><b>મર્યાદાઓ:</b> ON હોય ત્યારે નાનો voltage drop (V<sub>CE(sat)</sub>), OFF હોય ત્યારે નાનો leakage, મર્યાદિત current/voltage rating; DC loads માટે વપરાય (AC loads relay/TRIAC દ્વારા).</p>"}}, {"h": {"en": "Key Points – 4.5", "gu": "મુખ્ય મુદ્દા – 4.5"}, "body": {"en": "<ul>\n<li>DC load line: <b>V<sub>CE</sub> = V<sub>CC</sub> − I<sub>C</sub>R<sub>C</sub></b>; end points (V<sub>CC</sub>, 0) and (0, V<sub>CC</sub>/R<sub>C</sub>).</li>\n<li>Amplifier → active region (middle); switch → cut-off and saturation (ends).</li>\n<li><b>OFF:</b> V<sub>in</sub> LOW, I<sub>B</sub> = 0, I<sub>C</sub> ≈ 0, V<sub>CE</sub> ≈ V<sub>CC</sub> → open switch.</li>\n<li><b>ON:</b> V<sub>in</sub> HIGH, I<sub>C</sub> = I<sub>C(sat)</sub>, V<sub>CE</sub> ≈ 0.2 V → closed switch.</li>\n<li>Saturation condition: <b>I<sub>B</sub> &gt; I<sub>C(sat)</sub>/β</b>; R<sub>B</sub> = (V<sub>in</sub> − 0.7)/I<sub>B</sub>.</li>\n<li>Transistor switch = <b>NOT gate</b>; used for LED/relay/motor drivers; faster and longer-lasting than mechanical switches.</li>\n</ul>", "gu": "<ul>\n<li>DC load line: <b>V<sub>CE</sub> = V<sub>CC</sub> − I<sub>C</sub>R<sub>C</sub></b>; છેડાના બિંદુઓ (V<sub>CC</sub>, 0) અને (0, V<sub>CC</sub>/R<sub>C</sub>).</li>\n<li>Amplifier → active region (મધ્ય); switch → cut-off અને saturation (છેડા).</li>\n<li><b>OFF:</b> V<sub>in</sub> LOW, I<sub>B</sub> = 0, I<sub>C</sub> ≈ 0, V<sub>CE</sub> ≈ V<sub>CC</sub> → ખુલ્લું switch.</li>\n<li><b>ON:</b> V<sub>in</sub> HIGH, I<sub>C</sub> = I<sub>C(sat)</sub>, V<sub>CE</sub> ≈ 0.2 V → બંધ switch.</li>\n<li>Saturation શરત: <b>I<sub>B</sub> &gt; I<sub>C(sat)</sub>/β</b>; R<sub>B</sub> = (V<sub>in</sub> − 0.7)/I<sub>B</sub>.</li>\n<li>Transistor switch = <b>NOT gate</b>; LED/relay/motor drivers માટે વપરાય; mechanical switches કરતાં ઝડપી અને લાંબું ટકે.</li>\n</ul>"}, "key": true}]}], "numericals": [{"id": "u4n1", "q": {"en": "In a transistor, I_E = 10 mA and I_C = 9.8 mA. Find I_B, α and β.", "gu": "એક transistor માં I_E = 10 mA અને I_C = 9.8 mA છે. I_B, α અને β શોધો."}, "a": {"en": "<p>I<sub>B</sub> = I<sub>E</sub> − I<sub>C</sub> = 10 − 9.8 = <b>0.2 mA</b></p>\n<p>α = I<sub>C</sub> / I<sub>E</sub> = 9.8 / 10 = <b>0.98</b></p>\n<p>β = I<sub>C</sub> / I<sub>B</sub> = 9.8 / 0.2 = <b>49</b></p>\n<p>Check: β = α/(1 − α) = 0.98/0.02 = 49 ✓</p>", "gu": "<p>I<sub>B</sub> = I<sub>E</sub> − I<sub>C</sub> = 10 − 9.8 = <b>0.2 mA</b></p>\n<p>α = I<sub>C</sub> / I<sub>E</sub> = 9.8 / 10 = <b>0.98</b></p>\n<p>β = I<sub>C</sub> / I<sub>B</sub> = 9.8 / 0.2 = <b>49</b></p>\n<p>ચકાસણી: β = α/(1 − α) = 0.98/0.02 = 49 ✓</p>"}}, {"id": "u4n2", "q": {"en": "A transistor has β = 100 and base current I_B = 40 µA. Find I_C, I_E and α.", "gu": "Transistor માં β = 100 અને base current I_B = 40 µA છે. I_C, I_E અને α શોધો."}, "a": {"en": "<p>I<sub>C</sub> = β I<sub>B</sub> = 100 × 40 µA = 4000 µA = <b>4 mA</b></p>\n<p>I<sub>E</sub> = I<sub>B</sub> + I<sub>C</sub> = 0.04 + 4 = <b>4.04 mA</b></p>\n<p>α = β / (1 + β) = 100 / 101 = <b>0.990</b></p>", "gu": "<p>I<sub>C</sub> = β I<sub>B</sub> = 100 × 40 µA = 4000 µA = <b>4 mA</b></p>\n<p>I<sub>E</sub> = I<sub>B</sub> + I<sub>C</sub> = 0.04 + 4 = <b>4.04 mA</b></p>\n<p>α = β / (1 + β) = 100 / 101 = <b>0.990</b></p>"}}, {"id": "u4n3", "q": {"en": "(a) Find β if α = 0.995. (b) Find α if β = 150.", "gu": "(a) α = 0.995 હોય તો β શોધો. (b) β = 150 હોય તો α શોધો."}, "a": {"en": "<p>(a) β = α / (1 − α) = 0.995 / 0.005 = <b>199</b></p>\n<p>(b) α = β / (1 + β) = 150 / 151 = <b>0.9934</b></p>\n<p><i>A very small change in α (near 1) gives a large change in β.</i></p>", "gu": "<p>(a) β = α / (1 − α) = 0.995 / 0.005 = <b>199</b></p>\n<p>(b) α = β / (1 + β) = 150 / 151 = <b>0.9934</b></p>\n<p><i>α (1 નજીક) માં ખૂબ નાનો ફેરફાર β માં મોટો ફેરફાર કરે છે.</i></p>"}}, {"id": "u4n4", "q": {"en": "A CE amplifier has input resistance r_i = 1 kΩ, load resistance R_L = 2 kΩ and β = 100. Find the voltage gain and power gain (also in dB).", "gu": "CE amplifier માં input resistance r_i = 1 kΩ, load resistance R_L = 2 kΩ અને β = 100 છે. Voltage gain અને power gain (dB માં પણ) શોધો."}, "a": {"en": "<p>A<sub>v</sub> = β × R<sub>L</sub> / r<sub>i</sub> = 100 × 2000 / 1000 = <b>200</b> (output inverted, 180°)</p>\n<p>A<sub>p</sub> = β × A<sub>v</sub> = 100 × 200 = <b>20,000</b></p>\n<p>A<sub>p</sub>(dB) = 10 log<sub>10</sub>(20000) = <b>43 dB</b>; A<sub>v</sub>(dB) = 20 log<sub>10</sub>(200) = <b>46 dB</b></p>", "gu": "<p>A<sub>v</sub> = β × R<sub>L</sub> / r<sub>i</sub> = 100 × 2000 / 1000 = <b>200</b> (output ઉલટો, 180°)</p>\n<p>A<sub>p</sub> = β × A<sub>v</sub> = 100 × 200 = <b>20,000</b></p>\n<p>A<sub>p</sub>(dB) = 10 log<sub>10</sub>(20000) = <b>43 dB</b>; A<sub>v</sub>(dB) = 20 log<sub>10</sub>(200) = <b>46 dB</b></p>"}}, {"id": "u4n5", "q": {"en": "In a CB amplifier, α = 0.98, input resistance = 50 Ω and load resistance = 5 kΩ. Find voltage gain and power gain.", "gu": "CB amplifier માં α = 0.98, input resistance = 50 Ω અને load resistance = 5 kΩ છે. Voltage gain અને power gain શોધો."}, "a": {"en": "<p>A<sub>v</sub> = α × R<sub>L</sub> / r<sub>i</sub> = 0.98 × 5000 / 50 = <b>98</b></p>\n<p>A<sub>p</sub> = α × A<sub>v</sub> = 0.98 × 98 = <b>96.04</b></p>\n<p><i>Current gain &lt; 1, but voltage gain is high because R<sub>L</sub> ≫ r<sub>i</sub>.</i></p>", "gu": "<p>A<sub>v</sub> = α × R<sub>L</sub> / r<sub>i</sub> = 0.98 × 5000 / 50 = <b>98</b></p>\n<p>A<sub>p</sub> = α × A<sub>v</sub> = 0.98 × 98 = <b>96.04</b></p>\n<p><i>Current gain &lt; 1 છે, પરંતુ R<sub>L</sub> ≫ r<sub>i</sub> હોવાથી voltage gain વધુ છે.</i></p>"}}, {"id": "u4n6", "q": {"en": "A transistor has β = 99. Find γ and α. If I_B = 50 µA, find I_E and I_C.", "gu": "Transistor માં β = 99 છે. γ અને α શોધો. જો I_B = 50 µA હોય તો I_E અને I_C શોધો."}, "a": {"en": "<p>γ = 1 + β = <b>100</b>; α = β/(1 + β) = 99/100 = <b>0.99</b></p>\n<p>I<sub>E</sub> = γ I<sub>B</sub> = 100 × 50 µA = <b>5 mA</b></p>\n<p>I<sub>C</sub> = β I<sub>B</sub> = 99 × 50 µA = <b>4.95 mA</b></p>", "gu": "<p>γ = 1 + β = <b>100</b>; α = β/(1 + β) = 99/100 = <b>0.99</b></p>\n<p>I<sub>E</sub> = γ I<sub>B</sub> = 100 × 50 µA = <b>5 mA</b></p>\n<p>I<sub>C</sub> = β I<sub>B</sub> = 99 × 50 µA = <b>4.95 mA</b></p>"}}, {"id": "u4n7", "q": {"en": "Design a transistor switch to glow a red LED (V_F = 2 V, 15 mA) from V_CC = 5 V. The input is 5 V (HIGH), β = 100, V_CE(sat) = 0.2 V, V_BE = 0.7 V. Find R_C and R_B.", "gu": "V_CC = 5 V થી લાલ LED (V_F = 2 V, 15 mA) ચલાવવા transistor switch ડિઝાઇન કરો. Input 5 V (HIGH), β = 100, V_CE(sat) = 0.2 V, V_BE = 0.7 V. R_C અને R_B શોધો."}, "a": {"en": "<p><b>Collector resistor:</b> R<sub>C</sub> = (V<sub>CC</sub> − V<sub>F</sub> − V<sub>CE(sat)</sub>) / I<sub>C</sub> = (5 − 2 − 0.2) / 0.015 = <b>186.7 Ω</b> → use <b>180 Ω</b> (I<sub>C</sub> = 2.8/180 ≈ 15.6 mA).</p>\n<p><b>Minimum base current:</b> I<sub>B(min)</sub> = I<sub>C</sub> / β = 15.6 mA / 100 = 0.156 mA</p>\n<p>For hard saturation take I<sub>B</sub> ≈ 5 × I<sub>B(min)</sub> ≈ 0.78 mA</p>\n<p><b>Base resistor:</b> R<sub>B</sub> = (V<sub>in</sub> − V<sub>BE</sub>) / I<sub>B</sub> = (5 − 0.7) / 0.78 mA ≈ 5.5 kΩ → use <b>4.7 kΩ</b> (I<sub>B</sub> ≈ 0.91 mA, transistor surely saturated).</p>", "gu": "<p><b>Collector resistor:</b> R<sub>C</sub> = (V<sub>CC</sub> − V<sub>F</sub> − V<sub>CE(sat)</sub>) / I<sub>C</sub> = (5 − 2 − 0.2) / 0.015 = <b>186.7 Ω</b> → <b>180 Ω</b> વાપરો (I<sub>C</sub> = 2.8/180 ≈ 15.6 mA).</p>\n<p><b>ન્યૂનતમ base current:</b> I<sub>B(min)</sub> = I<sub>C</sub> / β = 15.6 mA / 100 = 0.156 mA</p>\n<p>Hard saturation માટે I<sub>B</sub> ≈ 5 × I<sub>B(min)</sub> ≈ 0.78 mA લો</p>\n<p><b>Base resistor:</b> R<sub>B</sub> = (V<sub>in</sub> − V<sub>BE</sub>) / I<sub>B</sub> = (5 − 0.7) / 0.78 mA ≈ 5.5 kΩ → <b>4.7 kΩ</b> વાપરો (I<sub>B</sub> ≈ 0.91 mA, transistor ચોક્કસ saturate થાય).</p>"}}, {"id": "u4n8", "q": {"en": "A transistor has I_CBO = 5 µA and β = 100. Find I_CEO. Also find I_C when I_B = 20 µA.", "gu": "Transistor માં I_CBO = 5 µA અને β = 100 છે. I_CEO શોધો. I_B = 20 µA હોય ત્યારે I_C પણ શોધો."}, "a": {"en": "<p>I<sub>CEO</sub> = (1 + β) I<sub>CBO</sub> = 101 × 5 µA = <b>505 µA ≈ 0.505 mA</b></p>\n<p>I<sub>C</sub> = β I<sub>B</sub> + I<sub>
