CEO</sub> = 100 × 20 µA + 0.505 mA = 2 + 0.505 = <b>2.505 mA</b></p>\n<p><i>Leakage in CE is (1 + β) times larger than in CB.</i></p>", "gu": "<p>I<sub>CEO</sub> = (1 + β) I<sub>CBO</sub> = 101 × 5 µA = <b>505 µA ≈ 0.505 mA</b></p>\n<p>I<sub>C</sub> = β I<sub>B</sub> + I<sub>CEO</sub> = 100 × 20 µA + 0.505 mA = 2 + 0.505 = <b>2.505 mA</b></p>\n<p><i>CE માં leakage, CB કરતાં (1 + β) ગણો વધુ હોય છે.</i></p>"}}, {"id": "u4n9", "q": {"en": "In a CE circuit, V_CC = 12 V and R_C = 2 kΩ. Find the end points of the DC load line. If I_B = 30 µA and β = 100, find the Q-point.", "gu": "CE circuit માં V_CC = 12 V અને R_C = 2 kΩ છે. DC load line ના છેડાના બિંદુઓ શોધો. જો I_B = 30 µA અને β = 100 હોય તો Q-point શોધો."}, "a": {"en": "<p><b>Cut-off point:</b> I<sub>C</sub> = 0 → V<sub>CE</sub> = V<sub>CC</sub> = <b>12 V</b></p>\n<p><b>Saturation point:</b> V<sub>CE</sub> = 0 → I<sub>C(sat)</sub> = V<sub>CC</sub> / R<sub>C</sub> = 12 / 2000 = <b>6 mA</b></p>\n<p><b>Q-point:</b> I<sub>C</sub> = β I<sub>B</sub> = 100 × 30 µA = <b>3 mA</b></p>\n<p>V<sub>CE</sub> = V<sub>CC</sub> − I<sub>C</sub> R<sub>C</sub> = 12 − 3 × 2 = <b>6 V</b></p>\n<p>Q-point = (6 V, 3 mA) – exactly in the middle of the load line → good for an amplifier.</p>", "gu": "<p><b>Cut-off બિંદુ:</b> I<sub>C</sub> = 0 → V<sub>CE</sub> = V<sub>CC</sub> = <b>12 V</b></p>\n<p><b>Saturation બિંદુ:</b> V<sub>CE</sub> = 0 → I<sub>C(sat)</sub> = V<sub>CC</sub> / R<sub>C</sub> = 12 / 2000 = <b>6 mA</b></p>\n<p><b>Q-point:</b> I<sub>C</sub> = β I<sub>B</sub> = 100 × 30 µA = <b>3 mA</b></p>\n<p>V<sub>CE</sub> = V<sub>CC</sub> − I<sub>C</sub> R<sub>C</sub> = 12 − 3 × 2 = <b>6 V</b></p>\n<p>Q-point = (6 V, 3 mA) – load line ના બરાબર મધ્યમાં → amplifier માટે યોગ્ય.</p>"}}], "diagrams": [{"id": "u4_structure", "title": {"en": "Construction of NPN and PNP Transistors", "gu": "NPN અને PNP Transistors ની રચના"}, "file": "diagrams/u4_structure.svg"}, {"id": "u4_symbols", "title": {"en": "Transistor Symbols and Current Directions", "gu": "Transistor Symbols અને Current ની દિશા"}, "file": "diagrams/u4_symbols.svg"}, {"id": "u4_npn_working", "title": {"en": "Working of NPN Transistor", "gu": "NPN Transistor નું કાર્ય"}, "file": "diagrams/u4_npn_working.svg"}, {"id": "u4_pnp_working", "title": {"en": "Working of PNP Transistor", "gu": "PNP Transistor નું કાર્ય"}, "file": "diagrams/u4_pnp_working.svg"}, {"id": "u4_cb", "title": {"en": "Common Base (CB) Configuration", "gu": "Common Base (CB) Configuration"}, "file": "diagrams/u4_cb.svg"}, {"id": "u4_cb_char", "title": {"en": "CB Input and Output Characteristics", "gu": "CB Input અને Output Characteristics"}, "file": "diagrams/u4_cb_char.svg"}, {"id": "u4_ce", "title": {"en": "Common Emitter (CE) Configuration", "gu": "Common Emitter (CE) Configuration"}, "file": "diagrams/u4_ce.svg"}, {"id": "u4_ce_test", "title": {"en": "Circuit for CE Characteristics", "gu": "CE Characteristics માટેનો Circuit"}, "file": "diagrams/u4_ce_test.svg"}, {"id": "u4_ce_input", "title": {"en": "CE Input Characteristics", "gu": "CE Input Characteristics"}, "file": "diagrams/u4_ce_input.svg"}, {"id": "u4_ce_output", "title": {"en": "CE Output Characteristics and Regions", "gu": "CE Output Characteristics અને Regions"}, "file": "diagrams/u4_ce_output.svg"}, {"id": "u4_cc", "title": {"en": "Common Collector (CC) Configuration", "gu": "Common Collector (CC) Configuration"}, "file": "diagrams/u4_cc.svg"}, {"id": "u4_load_line", "title": {"en": "DC Load Line and Operating Regions", "gu": "DC Load Line અને Operating Regions"}, "file": "diagrams/u4_load_line.svg"}, {"id": "u4_switch", "title": {"en": "Transistor as a Switch", "gu": "Switch તરીકે Transistor"}, "file": "diagrams/u4_switch.svg"}], "equations": [{"title": {"en": "Transistor Currents", "gu": "Transistor Currents"}, "items": [{"name": {"en": "Current relation (KCL)", "gu": "Current સંબંધ (KCL)"}, "f": "I<sub>E</sub> = I<sub>B</sub> + I<sub>C</sub>", "terms": {"en": "I_B is very small, so I_C ≈ I_E", "gu": "I_B ખૂબ નાનો, તેથી I_C ≈ I_E"}}, {"name": {"en": "CB current gain", "gu": "CB current gain"}, "f": "α = I<sub>C</sub> / I<sub>E</sub>", "terms": {"en": "Always < 1 (0.95 – 0.995)", "gu": "હંમેશા < 1 (0.95 – 0.995)"}}, {"name": {"en": "CE current gain", "gu": "CE current gain"}, "f": "β = I<sub>C</sub> / I<sub>B</sub>  (= h<sub>FE</sub>)", "terms": {"en": "Typical 20 – 500", "gu": "સામાન્ય 20 – 500"}}, {"name": {"en": "CC current gain", "gu": "CC current gain"}, "f": "γ = I<sub>E</sub> / I<sub>B</sub> = 1 + β", "terms": {"en": "Highest current gain", "gu": "સૌથી વધુ current gain"}}, {"name": {"en": "β from α", "gu": "α પરથી β"}, "f": "β = α / (1 − α)", "terms": {"en": "", "gu": ""}}, {"name": {"en": "α from β", "gu": "β પરથી α"}, "f": "α = β / (1 + β)", "terms": {"en": "", "gu": ""}}, {"name": {"en": "γ from α", "gu": "α પરથી γ"}, "f": "γ = 1 / (1 − α)", "terms": {"en": "", "gu": ""}}, {"name": {"en": "Collector current with leakage (CB)", "gu": "Leakage સાથે collector current (CB)"}, "f": "I<sub>C</sub> = α I<sub>E</sub> + I<sub>CBO</sub>", "terms": {"en": "I_CBO = collector-base leakage (emitter open)", "gu": "I_CBO = collector-base leakage (emitter open)"}}, {"name": {"en": "Collector current with leakage (CE)", "gu": "Leakage સાથે collector current (CE)"}, "f": "I<sub>C</sub> = β I<sub>B</sub> + I<sub>CEO</sub>", "terms": {"en": "I_CEO = (1 + β) I_CBO", "gu": "I_CEO = (1 + β) I_CBO"}}]}, {"title": {"en": "Characteristics and Gains", "gu": "Characteristics અને Gains"}, "items": [{"name": {"en": "CE input resistance", "gu": "CE input resistance"}, "f": "r<sub>i</sub> = ΔV<sub>BE</sub> / ΔI<sub>B</sub>  (V<sub>CE</sub> const.)", "terms": {"en": "≈ 1 kΩ", "gu": "≈ 1 kΩ"}}, {"name": {"en": "CE output resistance", "gu": "CE output resistance"}, "f": "r<sub>o</sub> = ΔV<sub>CE</sub> / ΔI<sub>C</sub>  (I<sub>B</sub> const.)", "terms": {"en": "≈ 10 – 50 kΩ", "gu": "≈ 10 – 50 kΩ"}}, {"name": {"en": "CB input / output resistance", "gu": "CB input / output resistance"}, "f": "r<sub>i</sub> = ΔV<sub>EB</sub>/ΔI<sub>E</sub>,  r<sub>o</sub> = ΔV<sub>CB</sub>/ΔI<sub>C</sub>", "terms": {"en": "r_i very low, r_o very high", "gu": "r_i ખૂબ ઓછો, r_o ખૂબ વધુ"}}, {"name": {"en": "AC current gain", "gu": "AC current gain"}, "f": "β<sub>ac</sub> = ΔI<sub>C</sub> / ΔI<sub>B</sub>  (V<sub>CE</sub> const.)", "terms": {"en": "h_fe", "gu": "h_fe"}}, {"name": {"en": "Voltage gain – CB", "gu": "Voltage gain – CB"}, "f": "A<sub>v</sub> = α R<sub>L</sub> / r<sub>i</sub>", "terms": {"en": "", "gu": ""}}, {"name": {"en": "Voltage gain – CE", "gu": "Voltage gain – CE"}, "f": "A<sub>v</sub> = β R<sub>L</sub> / r<sub>i</sub>", "terms": {"en": "Output 180° out of phase", "gu": "Output 180° phase માં ઉલટો"}}, {"name": {"en": "Power gain", "gu": "Power gain"}, "f": "A<sub>p</sub> = A<sub>i</sub> × A<sub>v</sub>", "terms": {"en": "CE: A_p = β² R_L / r_i (highest)", "gu": "CE: A_p = β² R_L / r_i (સૌથી વધુ)"}}, {"name": {"en": "Gain in dB", "gu": "dB માં gain"}, "f": "A<sub>p</sub>(dB) = 10 log A<sub>p</sub>;  A<sub>v</sub>(dB) = 20 log A<sub>v</sub>", "terms": {"en": "", "gu": ""}}]}, {"title": {"en": "Transistor as a Switch", "gu": "Switch તરીકે Transistor"}, "items": [{"name": {"en": "DC load line", "gu": "DC load line"}, "f": "V<sub>CE</sub> = V<sub>CC</sub> − I<sub>C</sub> R<sub>C</sub>", "terms": {"en": "End points: (V_CC, 0) and (0, V_CC/R_C)", "gu": "છેડા: (V_CC, 0) અને (0, V_CC/R_C)"}}, {"name": {"en": "Saturation current", "gu": "Saturation current"}, "f": "I<sub>C(sat)</sub> = (V<sub>CC</sub> − V<sub>CE(sat)</sub>) / R<sub>C</sub> ≈ V<sub>CC</sub> / R<sub>C</sub>", "terms": {"en": "V_CE(sat) ≈ 0.2 V", "gu": "V_CE(sat) ≈ 0.2 V"}}, {"name": {"en": "Condition for saturation", "gu": "Saturation માટેની શરત"}, "f": "I<sub>B</sub> > I<sub>C(sat)</sub> / β", "terms": {"en": "Use 2–10 times for hard saturation", "gu": "Hard saturation માટે 2–10 ગણો લો"}}, {"name": {"en": "Base resistor", "gu": "Base resistor"}, "f": "R<sub>B</sub> = (V<sub>in</sub> − V<sub>BE</sub>) / I<sub>B</sub>", "terms": {"en": "V_BE ≈ 0.7 V (Si)", "gu": "V_BE ≈ 0.7 V (Si)"}}, {"name": {"en": "Power dissipation", "gu": "Power dissipation"}, "f": "P<sub>D</sub> = V<sub>CE</sub> × I<sub>C</sub>", "terms": {"en": "Very small in both ON and OFF states", "gu": "ON અને OFF બંને સ્થિતિમાં ખૂબ ઓછો"}}]}], "viva": [{"title": {"en": "Construction and Working", "gu": "રચના અને કાર્ય"}, "items": [{"q": {"en": "What is a transistor?", "gu": "Transistor એટલે શું?"}, "a": {"en": "A three-terminal semiconductor device used for amplification and switching.", "gu": "Amplification અને switching માટે વપરાતું ત્રણ terminal વાળું semiconductor device."}}, {"q": {"en": "Why is it called 'bipolar'?", "gu": "તેને 'bipolar' કેમ કહે છે?"}, "a": {"en": "Because both electrons and holes take part in conduction.", "gu": "કારણ કે conduction માં electrons અને holes બંને ભાગ લે છે."}}, {"q": {"en": "Name the three terminals of a BJT.", "gu": "BJT ના ત્રણ terminals ના નામ આપો."}, "a": {"en": "Emitter, Base and Collector.", "gu": "Emitter, Base અને Collector."}}, {"q": {"en": "Which region is most heavily doped?", "gu": "કયો region સૌથી વધુ doped છે?"}, "a": {"en": "Emitter.", "gu": "Emitter."}}, {"q": {"en": "Why is the base made thin and lightly doped?", "gu": "Base ને પાતળો અને ઓછો doped કેમ બનાવાય છે?"}, "a": {"en": "So that very few carriers recombine in the base and most reach the collector.", "gu": "જેથી base માં ખૂબ ઓછા carriers recombine થાય અને મોટાભાગના collector સુધી પહોંચે."}}, {"q": {"en": "Why is the collector made largest?", "gu": "Collector ને સૌથી મોટો કેમ બનાવાય છે?"}, "a": {"en": "To dissipate the heat produced at the collector junction.", "gu": "Collector junction પર ઉત્પન્ન થતી ઉષ્મા દૂર કરવા."}}, {"q": {"en": "Can emitter and collector be interchanged?", "gu": "Emitter અને collector અદલાબદલી કરી શકાય?"}, "a": {"en": "No, because their doping levels and sizes are different.", "gu": "ના, કારણ કે તેમના doping અને કદ અલગ છે."}}, {"q": {"en": "How do you identify NPN and PNP from the symbol?", "gu": "Symbol પરથી NPN અને PNP કેવી રીતે ઓળખાય?"}, "a": {"en": "NPN: emitter arrow points outward; PNP: arrow points inward.", "gu": "NPN: emitter arrow બહાર તરફ; PNP: arrow અંદર તરફ."}}, {"q": {"en": "What biasing is needed for the active region?", "gu": "Active region માટે કયું biasing જરૂરી છે?"}, "a": {"en": "Emitter-base junction forward biased and collector-base junction reverse biased.", "gu": "Emitter-base junction forward biased અને collector-base junction reverse biased."}}, {"q": {"en": "What percentage of emitter current reaches the collector?", "gu": "Emitter current ના કેટલા ટકા collector સુધી પહોંચે છે?"}, "a": {"en": "About 95–99%.", "gu": "આશરે 95–99%."}}, {"q": {"en": "Why is NPN preferred over PNP?", "gu": "PNP કરતાં NPN કેમ વધુ પસંદ કરાય છે?"}, "a": {"en": "Electrons have higher mobility than holes, so NPN is faster.", "gu": "Electrons ની mobility holes કરતાં વધુ છે, તેથી NPN વધુ ઝડપી છે."}}, {"q": {"en": "Pin order of BC547 (flat face towards you)?", "gu": "BC547 નો pin ક્રમ (સપાટ ભાગ તમારી તરફ)?"}, "a": {"en": "Collector – Base – Emitter (left to right).", "gu": "Collector – Base – Emitter (ડાબેથી જમણે)."}}]}, {"title": {"en": "Configurations and Gains", "gu": "Configurations અને Gains"}, "items": [{"q": {"en": "Name the three transistor configurations.", "gu": "Transistor ના ત્રણ configurations ના નામ આપો."}, "a": {"en": "Common Base (CB), Common Emitter (CE) and Common Collector (CC).", "gu": "Common Base (CB), Common Emitter (CE) અને Common Collector (CC)."}}, {"q": {"en": "Which configuration is most widely used and why?", "gu": "કયું configuration સૌથી વધુ વપરાય છે અને કેમ?"}, "a": {"en": "CE, because it gives the highest power gain with good current and voltage gain.", "gu": "CE, કારણ કે તે સારા current અને voltage gain સાથે સૌથી વધુ power gain આપે છે."}}, {"q": {"en": "Define α.", "gu": "α ની વ્યાખ્યા આપો."}, "a": {"en": "Ratio of collector current to emitter current (I_C/I_E) in CB.", "gu": "CB માં collector current અને emitter current નો ગુણોત્તર (I_C/I_E)."}}, {"q": {"en": "Define β.", "gu": "β ની વ્યાખ્યા આપો."}, "a": {"en": "Ratio of collector current to base current (I_C/I_B) in CE.", "gu": "CE માં collector current અને base current નો ગુણોત્તર (I_C/I_B)."}}, {"q": {"en": "Relation between α and β?", "gu": "α અને β વચ્ચેનો સંબંધ?"}, "a": {"en": "β = α/(1 − α) and α = β/(1 + β).", "gu": "β = α/(1 − α) અને α = β/(1 + β)."}}, {"q": {"en": "What is γ?", "gu": "γ એટલે શું?"}, "a": {"en": "Current gain of CC configuration: γ = I_E/I_B = 1 + β.", "gu": "CC configuration નો current gain: γ = I_E/I_B = 1 + β."}}, {"q": {"en": "Which configuration has the highest input resistance?", "gu": "કયા configuration માં સૌથી વધુ input resistance છે?"}, "a": {"en": "Common Collector (CC).", "gu": "Common Collector (CC)."}}, {"q": {"en": "Which configuration has phase shift of 180°?", "gu": "કયા configuration માં 180° phase shift છે?"}, "a": {"en": "Common Emitter (CE).", "gu": "Common Emitter (CE)."}}, {"q": {"en": "Why is CC called an emitter follower?", "gu": "CC ને emitter follower કેમ કહે છે?"}, "a": {"en": "Because the emitter (output) voltage follows the base (input) voltage; voltage gain ≈ 1.", "gu": "કારણ કે emitter (output) voltage base (input) voltage ને અનુસરે છે; voltage gain ≈ 1."}}, {"q": {"en": "What is the Early effect?", "gu": "Early effect એટલે શું?"}, "a": {"en": "Reduction of effective base width when collector voltage increases (base-width modulation).", "gu": "Collector voltage વધતાં અસરકારક base width ઘટવું (base-width modulation)."}}, {"q": {"en": "What are the regions on CE output characteristics?", "gu": "CE output characteristics પર કયા regions છે?"}, "a": {"en": "Active, saturation and cut-off regions.", "gu": "Active, saturation અને cut-off regions."}}, {"q": {"en": "What is thermal runaway?", "gu": "Thermal runaway એટલે શું?"}, "a": {"en": "Self-heating cycle: temperature ↑ → leakage ↑ → I_C ↑ → more heat, which can destroy the transistor.", "gu": "સ્વ-ગરમીનું ચક્ર: તાપમાન ↑ → leakage ↑ → I_C ↑ → વધુ ઉષ્મા, જે transistor ને નષ્ટ કરી શકે."}}]}, {"title": {"en": "Transistor as a Switch", "gu": "Switch તરીકે Transistor"}, "items": [{"q": {"en": "In which regions does a transistor work as a switch?", "gu": "Transistor switch તરીકે કયા regions માં કામ કરે છે?"}, "a": {"en": "Cut-off (OFF) and saturation (ON).", "gu": "Cut-off (OFF) અને saturation (ON)."}}, {"q": {"en": "What is V_CE when the transistor switch is ON?", "gu": "Transistor switch ON હોય ત્યારે V_CE કેટલો હોય?"}, "a": {"en": "About 0.2 V (V_CE(sat)).", "gu": "આશરે 0.2 V (V_CE(sat))."}}, {"q": {"en": "What is V_CE when the switch is OFF?", "gu": "Switch OFF હોય ત્યારે V_CE કેટલો હોય?"}, "a": {"en": "Almost equal to V_CC.", "gu": "લગભગ V_CC જેટલો."}}, {"q": {"en": "What is the condition for saturation?", "gu": "Saturation માટેની શરત શું છે?"}, "a": {"en": "I_B > I_C(sat) / β.", "gu": "I_B > I_C(sat) / β."}}, {"q": {"en": "What is a DC load line?", "gu": "DC load line એટલે શું?"}, "a": {"en": "A straight line on output characteristics given by V_CE = V_CC − I_C R_C; the Q-point lies on it.", "gu": "Output characteristics પર V_CE = V_CC − I_C R_C થી મળતી સીધી રેખા; Q-point તેના પર હોય છે."}}, {"q": {"en": "Which logic gate does a transistor switch act as?", "gu": "Transistor switch કયા logic gate તરીકે કામ કરે છે?"}, "a": {"en": "NOT gate (inverter).", "gu": "NOT gate (inverter)."}}, {"q": {"en": "Why is a diode connected across a relay coil?", "gu": "Relay coil પર diode કેમ જોડાય છે?"}, "a": {"en": "To absorb the back EMF and protect the transistor (freewheeling diode).", "gu": "Back EMF શોષી transistor ને રક્ષણ આપવા (freewheeling diode)."}}]}], "exam_questions": [{"q": {"en": "Explain the construction of NPN and PNP transistors with symbols.", "gu": "Symbols સાથે NPN અને PNP transistors ની રચના સમજાવો."}, "marks": 4}, {"q": {"en": "Why is the emitter heavily doped and the base lightly doped and thin?", "gu": "Emitter વધુ doped અને base ઓછો doped અને પાતળો કેમ હોય છે?"}, "marks": 3}, {" const META = {"name": {"en": "Basics of Electronics", "gu": "બેઝિક્સ ઓફ ઇલેક્ટ્રોનિક્સ"}, "code": "DI01000151"};
const S = {lang:'en', tab:'notes'};
const STR = {
 en:{notes:'Notes',diagrams:'Diagrams',equations:'Formulas',viva:'Viva',exam:'Exam Qs',expand:'Expand all',collapse:'Collapse all',
     numericals:'Numericals',ex:'✏️ Solved Example',tapzoom:'Tap diagram to zoom',unit:'Unit',examhead:'Important Exam Questions',
     intro:'weightage',hours:'hours',introd:'Detailed notes as per GTU syllabus with diagrams, formulas, solved numericals and viva.',
     marks:'Marks'},
 gu:{notes:'નોટ્સ',diagrams:'આકૃતિઓ',equations:'સૂત્રો',viva:'વાઈવા',exam:'પરીક્ષા પ્રશ્નો',expand:'બધા ખોલો',collapse:'બધા બંધ કરો',
     numericals:'દાખલા',ex:'✏️ ઉકેલેલો દાખલો',tapzoom:'મોટું જોવા આકૃતિ પર ટેપ કરો',unit:'એકમ',examhead:'મહત્વના પરીક્ષા પ્રશ્નો',
     intro:'વેઇટેજ',hours:'કલાક',introd:'GTU syllabus મુજબ આકૃતિ, સૂત્રો, ઉકેલેલા દાખલા અને viva સાથે વિગતવાર નોટ્સ.',
     marks:'ગુણ'}};
const L = k => STR[S.lang][k];
const t = o => (o && typeof o === 'object') ? (o[S.lang] || o.en) : (o || '');
const chev = '<svg class="chev" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#7B2CD9" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
const dots = '<svg width="22" height="22" viewBox="0 0 24 24" fill="#222"><circle cx="12" cy="5" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="12" cy="19" r="2.2"/></svg>';
const fixTables = h => h.replace(/<table>/g,'<div class="tw"><table>').replace(/<\/table>/g,'</table></div>');
const head = (title, menu=true) => `<div class="sh"><span>${title}</span>${menu?`<button class="more" data-more>${dots}</button><div class="menu"><button data-act="expand">${L('expand')}</button><button data-act="collapse">${L('collapse')}</button></div>`:''}</div>`;
const dgInline = id => `<div class="dg" data-dg="${id}">${SVG[id]}</div><div class="dgc">📐 ${t(U.diagrams.find(d=>d.id===id).title)} · ${L('tapzoom')}</div>`;

const exBox = id => { const n=(U.numericals||[]).find(x=>x.id===id); if(!n) return ''; return `<div class="ex"><div class="et">${L('ex')}</div><div class="eq2">${t(n.q)}</div>${fixTables(t(n.a))}</div>`; };
function notes(){
  let h = `<div class="intro"><b>${t(U.title)}</b><div>${L('unit')} ${U.unit} · ${U.weightage}% ${L('intro')} · ${U.hours} ${L('hours')}</div><div>${L('introd')}</div></div>`;
  U.notes.forEach((sec,si)=>{
    h += `<div class="sec">${head(t(sec.title))}`;
    sec.items.forEach((it,i)=>{
      const open = si===0&&i===0 ? ' open' : '';
      if (it.h) {
        h += `<div class="card${it.key?' key':''}${open}"><div class="q hd"><span class="t">${it.key?'⭐ ':''}${t(it.h)}</span>${chev}</div>
        <div class="a rn" style="padding-left:18px">${fixTables(t(it.body)).replace(/margin:0 0 10px -36px/g,'')}${it.diagram?dgInline(it.diagram):''}${(it.examples||[]).map(exBox).join('')}</div></div>`;
      } else {
        h += `<div class="card${open}"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(it.q)}</span>${chev}</div>
        <div class="a">${fixTables(t(it.a))}${it.diagram?dgInline(it.diagram):''}</div></div>`;
      }
    });
    h += `</div>`;
  });
  return h;
}
function numericals(){
  return `<div class="sec">${head(L('numericals'))}` + (U.numericals||[]).map((n,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(n.q)}</span>${chev}</div><div class="a">${fixTables(t(n.a))}</div></div>`).join('') + `</div>`;
}
function diagrams(){
  return `<div class="sec">${head(L('diagrams'),false)}<div style="height:10px"></div>` + U.diagrams.map((d,i)=>
    `<div class="dcard" data-dg="${d.id}"><div class="h">${i+1}. ${t(d.title)}</div>${SVG[d.id]}</div>`).join('') + `</div>`;
}
function equations(){
  return U.equations.map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><span class="fbox">${e.f}</span></span>${chev}</div>
     <div class="a"><p>${t(e.terms)}</p></div></div>`).join('') + `</div>`).join('');
}
function viva(){
  return U.viva.map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((v,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(v.q)}</span>${chev}</div><div class="a"><p>${t(v.a)}</p></div></div>`).join('') + `</div>`).join('');
}
function exam(){
  return `<div class="sec">${head(L('examhead'),false)}` + U.exam_questions.map((x,i)=>
    `<div class="card"><div class="q" style="cursor:default"><span class="n">${i+1}.</span><span class="t">${t(x.q)}</span><span class="mk">${x.marks} ${L('marks')}</span></div></div>`).join('') + `</div>`;
}
const VIEWS = U.numericals ? {notes, diagrams, equations, numericals, viva, exam} : {notes, diagrams, equations, viva, exam};
function render(){
  document.getElementById('title').textContent = `${L('unit')} ${U.unit}: ${t(U.title)}`;
  document.getElementById('sub').textContent = `${t(META.name)} · ${META.code}`;
  document.getElementById('lang').textContent = S.lang==='en' ? 'ગુ' : 'EN';
  document.getElementById('tabs').innerHTML = Object.keys(VIEWS).map(k=>`<button class="tab${S.tab===k?' on':''}" data-tab="${k}">${L(k)}</button>`).join('');
  document.getElementById('view').innerHTML = VIEWS[S.tab]();
}
let zoom = 1;
function setZoom(z){ zoom = Math.min(4, Math.max(1, z)); const w=document.getElementById('zw'); w.style.width=(zoom*100)+'%'; document.getElementById('zr').textContent=Math.round(zoom*100)+'%'; }
document.addEventListener('click', e=>{
  const q = e.target.closest('.q'); if (q && q.parentElement.querySelector('.a')) { q.parentElement.classList.toggle('open'); return; }
  const tb = e.target.closest('[data-tab]'); if (tb){ S.tab = tb.dataset.tab; render(); window.scrollTo(0,0); return; }
  if (e.target.closest('#lang')){ S.lang = S.lang==='en'?'gu':'en'; render(); return; }
  const m = e.target.closest('[data-more]');
  document.querySelectorAll('.menu.show').forEach(x=>{ if(!m || x!==m.nextElementSibling) x.classList.remove('show'); });
  if (m){ m.nextElementSibling.classList.toggle('show'); return; }
  const act = e.target.closest('[data-act]');
  if (act){ act.closest('.sec').querySelectorAll('.card').forEach(c=>{ if(c.querySelector('.a')) c.classList.toggle('open', act.dataset.act==='expand'); }); act.parentElement.classList.remove('show'); return; }
  const dg = e.target.closest('[data-dg]');
  if (dg){ const id=dg.dataset.dg; document.getElementById('mt').textContent=t(U.diagrams.find(d=>d.id===id).title); document.getElementById('zw').innerHTML=SVG[id]; setZoom(1); document.getElementById('modal').classList.add('show'); return; }
  if (e.target.closest('#mx')) document.getElementById('modal').classList.remove('show');
  if (e.target.closest('#zi')) setZoom(zoom+0.5);
  if (e.target.closest('#zo')) setZoom(zoom-0.5);
  if (e.target.closest('#zr')) setZoom(1);
});
render();
