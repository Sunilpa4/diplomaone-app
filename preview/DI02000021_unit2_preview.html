<style>
:root{--p:#7B2CD9;--pd:#6420B8;--lav:#EADDF7;--bg:#F3ECFA;--ink:#1d1b20}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#d8cce8;font-family:"Noto Sans Gujarati","Shruti","Nirmala UI",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink)}

.bar{position:sticky;top:0;z-index:10;background:var(--p);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2)}

.tab{flex:none;color:rgba(255,255,255,.75);padding:10px 14px 12px;font-size:14.5px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;background:none;border-top:0;border-left:0;border-right:0}
.tab.on{color:#fff;border-bottom-color:#fff}

.sh{background:var(--lav);display:flex;align-items:center;justify-content:space-between;padding:16px 14px 16px 18px;font-weight:800;font-size:17px;position:relative}
.more{background:none;border:0;padding:4px 6px;cursor:pointer;border-radius:50%}
.menu{display:none;position:absolute;right:12px;top:48px;background:#fff;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.18);z-index:5;overflow:hidden;min-width:150px}
.menu.show{display:block}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:12px 16px;font-size:14.5px;cursor:pointer}

.card{background:#fff;border-radius:6px;margin:0 0 8px;box-shadow:0 1px 3px rgba(60,20,110,.14)}
.q{display:flex;gap:10px;align-items:flex-start;padding:16px 14px 16px 18px;color:var(--p);font-size:16.5px;line-height:1.45;cursor:pointer}

@keyframes fd{from{opacity:0;transform:translateY(-4px)}to{opacity:1}}

tr:nth-child(even) td{background:#faf7fe}

pre.code{background:#1E1530;color:#EDE7F6;border-radius:8px;padding:10px 12px;font:13px/1.55 "JetBrains Mono",Consolas,"DejaVu Sans Mono","Noto Sans Gujarati",monospace;overflow-x:auto;margin:0 0 10px;white-space:pre;tab-size:4}
pre.out{background:#0E1B12;color:#B9F6CA;border-radius:8px;padding:10px 12px;font:13px/1.5 Consolas,"DejaVu Sans Mono",monospace;overflow-x:auto;margin:0 0 10px;white-space:pre}
.kw{color:#C792EA;font-weight:700}.ty{color:#82AAFF}.st{color:#C3E88D}.cm{color:#8E9AAF;font-style:italic}.pp{color:#F78C6C}.nu{color:#F9C46B}.fn{color:#FFCB6B}

@media (max-width:480px){pre.code,pre.out{font-size:11.5px;padding:9px 10px}}

.pbox .et{font-weight:800;color:#1F6E60;font-size:13.5px;margin-bottom:6px}
.sx{margin:6px 0 0;font-size:12.5px;padding:8px 10px}
.a.pa{padding-left:16px}

<script>
const U = {"subject": "DI02000021", "unit": 2, "format": "notes", "title": {"en": "Differentiation and its Applications"}, "hours": 11, "weightage": 23, "official": true, "languages": ["en"], "tabs": ["notes", "diagrams", "equations", "numericals", "viva", "exam"], "intro_text": {"en": "Unit 2 of Engineering Mathematics: the derivative as the slope of the tangent and as a limit, the standard derivatives, the sum, product and quotient rules, the chain rule, implicit and parametric curves, logarithmic differentiation, the second derivative, and the applications - velocity, acceleration and maxima or minima. Twenty-four fully solved numericals, each linked to a card."}, "notes": [{"title": {"en": "1. The Derivative from First Principles"}, "items": [{"h": {"en": "1.1 What a derivative is"}, "body": {"en": "<h4>Definition</h4><p>The derivative of y = f(x) at a point is the <b>slope of the tangent</b> to the curve there. It is obtained as the limit of the slope of a chord when one end of the chord slides towards the other:</p><p><b>dy/dx = lim (h → 0) [f(x + h) − f(x)] / h</b></p><h4>The three-step method</h4><ol><li>Write f(x + h) and subtract f(x).</li><li>Divide the difference by h and simplify until the h cancels.</li><li>Put h = 0 in the simplified expression.</li></ol><h4>Worked example</h4><p>For f(x) = x²: [f(x + h) − f(x)]/h = (x² + 2xh + h² − x²)/h = 2x + h, and with h = 0 the answer is <b>2x</b>. At x = 1 the slope is 2, which matches the tangent in the diagram.</p><h4>Reading dy/dx</h4><p>dy/dx is a single symbol for the derivative - not a fraction to be cancelled, and not dy divided by dx at the end of a question.</p>"}, "diagram": "d1_tangent", "examples": ["dd1"], "syllabus_item": "2.1"}, {"h": {"en": "1.2 First principles for roots and other awkward functions"}, "body": {"en": "<h4>The rationalising trick</h4><p>When f(x) contains a square root, multiply the numerator and denominator by the conjugate first; the root disappears from the top and h cancels.</p><h4>Worked example</h4><p>For f(x) = √x: [√(x + h) − √x]/h, multiplied by [√(x + h) + √x]/[√(x + h) + √x], becomes h / {h[√(x + h) + √x]} = 1/[√(x + h) + √x]. With h = 0 this gives <b>1/(2√x)</b>.</p><h4>When to use first principles</h4><ul><li>The syllabus asks for it directly, usually for x², x³, √x or 1/x.</li><li>It proves a standard result once; afterwards you may quote the table.</li><li>It is never the fastest route for a complicated function - use the rules.</li></ul><h4>Common mistake</h4><p>Putting h = 0 too early. If h = 0 is substituted before the h in the denominator is cancelled, every question becomes 0/0 and no answer appears.</p>"}, "examples": ["dd2"], "syllabus_item": "2.1"}, {"h": {"en": "1.3 The standard derivatives you must know"}, "body": {"en": "<h4>Table (learn these)</h4><table><tr><th>y</th><th>dy/dx</th></tr><tr><td>xⁿ</td><td>n xⁿ⁻¹</td></tr><tr><td>constant k</td><td>0</td></tr><tr><td>eˣ</td><td>eˣ</td></tr><tr><td>aˣ</td><td>aˣ log a</td></tr><tr><td>log x</td><td>1/x</td></tr><tr><td>sin x</td><td>cos x</td></tr><tr><td>cos x</td><td>−sin x</td></tr><tr><td>tan x</td><td>sec²x</td></tr></table><h4>Using the table</h4><p>For y = 3x² − 5x + 2 each term is differentiated separately: 6x − 5 + 0. At x = 2 the slope is 12 − 5 = <b>7</b>.</p><h4>Common mistake</h4><p>Differentiating a constant to 1. The derivative of 2 is 0; only x (that is x¹) gives 1.</p>"}, "examples": ["dd3", "dd4"], "syllabus_item": "2.2"}, {"h": {"en": "1.4 Notation, and when a derivative does not exist"}, "body": {"en": "<h4>Four ways to write the same thing</h4><ul><li>f′(x)</li><li>dy/dx</li><li>y′</li><li>D(f(x))</li></ul><h4>A derivative can fail to exist</h4><p>At a sharp corner or a vertical tangent the two one-sided slopes disagree, so the limit of the chord slope has no single value. The function is then not differentiable at that point, even though it may be continuous there.</p><h4>What the sign tells you</h4><table><tr><th>dy/dx</th><th>The curve is</th></tr><tr><td>positive</td><td>rising as x increases</td></tr><tr><td>negative</td><td>falling as x increases</td></tr><tr><td>zero</td><td>flat - a stationary point (Unit 2.8)</td></tr></table><details class=\"self-check\"><summary>Is every continuous function differentiable?</summary><p>No. Continuity is necessary but not sufficient: a corner such as y = |x| at x = 0 is continuous yet has no derivative there.</p></details>"}, "syllabus_item": "2.1"}]}, {"title": {"en": "2. Working Rules: Sum, Product and Division"}, "items": [{"h": {"en": "2.1 Sum and difference"}, "body": {"en": "<h4>Rule</h4><p><b>(u ± v)′ = u′ ± v′</b> - differentiate term by term, keeping the signs.</p><h4>Worked example</h4><p>y = x³ + 2x² − 7x + 1 gives dy/dx = 3x² + 4x − 7. The constant 1 disappears.</p><h4>With other functions</h4><p>y = sin x + cos x gives cos x − sin x; y = 3eˣ − 2 log x gives 3eˣ − 2/x.</p><h4>Common mistake</h4><p>Applying the product rule to a sum. The product rule is for u <i>times</i> v, not u plus v.</p>"}, "diagram": "d2_rules", "examples": ["dd4"], "syllabus_item": "2.2"}, {"h": {"en": "2.2 The product rule"}, "body": {"en": "<h4>Rule</h4><p><b>(uv)′ = u′v + uv′</b> - differentiate the first and keep the second, then keep the first and differentiate the second, and add.</p><h4>Worked example</h4><p>y = x²(3x + 5): u = x², v = 3x + 5, so dy/dx = 2x(3x + 5) + x²(3) = 6x² + 10x + 3x² = <b>9x² + 10x</b>.</p><h4>Second example</h4><p>y = (x + 1)(x² + 3) gives 1·(x² + 3) + (x + 1)(2x) = 3x² + 2x + 3.</p><h4>Common mistake</h4><p>Writing (uv)′ = u′v′. For the example above that would give 2x·3 = 6x instead of 9x² + 10x.</p><details class=\"self-check\"><summary>Can you expand first instead?</summary><p>Yes, when the bracket is easy: x²(3x + 5) = 3x³ + 5x² differentiates to 9x² + 10x as well. Use whichever is quicker, but the product rule is compulsory when the factors are trig, log or exponential.</p></details>"}, "examples": ["dd5", "dd6"], "syllabus_item": "2.2"}, {"h": {"en": "2.3 The quotient rule"}, "body": {"en": "<h4>Rule</h4><p><b>(u/v)′ = (u′v − uv′) / v²</b> - note the minus sign and the order: the derivative of the top comes first.</p><h4>Worked example</h4><p>y = (2x + 1)/(x − 1): u = 2x + 1, v = x − 1, u′ = 2, v′ = 1. Then dy/dx = [2(x − 1) − (2x + 1)(1)]/(x − 1)² = (2x − 2 − 2x − 1)/(x − 1)² = <b>−3/(x − 1)²</b>.</p><h4>Second example</h4><p>y = x/(x² + 1) gives [(1)(x² + 1) − x(2x)]/(x² + 1)² = <b>(1 − x²)/(x² + 1)²</b>.</p><h4>Common mistake</h4><p>Swapping u and v, which flips the sign of the whole answer. Write u above v before you start, and keep the v² denominator until the last line.</p>"}, "examples": ["dd7", "dd8"], "syllabus_item": "2.2"}, {"h": {"en": "2.4 Choosing the rule before you differentiate"}, "body": {"en": "<h4>A five-second check</h4><table><tr><th>The expression is</th><th>Use</th></tr><tr><td>a sum of terms</td><td>term by term</td></tr><tr><td>a product of two functions</td><td>product rule</td></tr><tr><td>one function over another</td><td>quotient rule</td></tr><tr><td>a function of a bracket, root or power</td><td>chain rule (next section)</td></tr><tr><td>x both in the base and in the power</td><td>logarithmic differentiation</td></tr></table><h4>Order of work</h4><ol><li>Name u and v (or u inside the bracket) on paper.</li><li>Write the rule with u′ and v′ in place before substituting anything.</li><li>Simplify only at the end, and cancel common factors.</li></ol><h4>Why the naming helps</h4><p>Most lost marks in this unit are not wrong rules but wrong substitutions: u and v swapped, a missing minus, or a factor dropped in the middle line.</p>"}, "syllabus_item": "2.2"}]}, {"title": {"en": "3. The Chain Rule"}, "items": [{"h": {"en": "3.1 A function of a function"}, "body": {"en": "<h4>Rule</h4><p><b>dy/dx = dy/du × du/dx</b> - differentiate the outside, then multiply by the derivative of the inside.</p><h4>Worked example</h4><p>y = (3x + 2)⁵ with u = 3x + 2: dy/du = 5u⁴ and du/dx = 3, so dy/dx = 5u⁴ × 3 = <b>15(3x + 2)⁴</b>.</p><h4>The quick version</h4><p>For y = [f(x)]ⁿ, dy/dx = n[f(x)]ⁿ⁻¹ × f′(x). For y = (2x − 1)⁷ that gives 7(2x − 1)⁶ × 2 = 14(2x − 1)⁶.</p><h4>Common mistake</h4><p>Forgetting the inside derivative. (3x + 2)⁵ differentiates to 5(3x + 2)⁴ only if the inside were x; with 3x + 2 the factor 3 is compulsory.</p>"}, "diagram": "d3_chain", "examples": ["dd9"], "syllabus_item": "2.3"}, {"h": {"en": "3.2 Chain rule with trigonometric and exponential functions"}, "body": {"en": "<h4>Patterns</h4><ul><li>y = sin(5x) → 5 cos(5x)</li><li>y = cos(3x) → −3 sin(3x)</li><li>y = e^(3x) → 3e^(3x)</li><li>y = e^(x²) → 2x e^(x²)</li></ul><h4>Worked examples</h4><p>y = sin 5x: the outside is sin and the inside is 5x, so dy/dx = cos(5x) × 5 = <b>5 cos 5x</b>.</p><p>y = e^(3x): the derivative of e^u is e^u, so dy/dx = e^(3x) × 3 = <b>3e^(3x)</b>.</p><h4>Common mistake</h4><p>Writing 5 cos x (inside untouched) or cos 5x (factor lost). Both parts must appear: the outer derivative evaluated at the inside, times the inside derivative.</p>"}, "examples": ["dd10", "dd11"], "syllabus_item": "2.3"}, {"h": {"en": "3.3 Chain rule with roots and logarithms"}, "body": {"en": "<h4>Roots are powers</h4><p>Write √(x² + 1) as (x² + 1)^(1/2); then dy/dx = (1/2)(x² + 1)^(−1/2) × 2x = <b>x/√(x² + 1)</b>.</p><h4>Logarithms</h4><p>For y = log[f(x)], dy/dx = f′(x)/f(x). So y = log(sin x) gives cos x / sin x = <b>cot x</b>.</p><h4>Deeper nesting</h4><p>With three layers, multiply three factors. y = sin²(3x) is [sin 3x]², so dy/dx = 2 sin 3x × cos 3x × 3 = 6 sin 3x cos 3x.</p><h4>Common mistake</h4><p>Cancelling the root too early. Keep the fractional power until the last line, then convert back to a root form if the answer looks tidier.</p>"}, "examples": ["dd12", "dd13"], "syllabus_item": "2.3"}, {"h": {"en": "3.4 A checklist for any chain-rule question"}, "body": {"en": "<h4>Four questions, in order</h4><ol><li>What is the outermost operation? (power, sin, log, e)</li><li>What is the whole inside expression? Call it u.</li><li>What is du/dx?</li><li>Multiply and then put u back in terms of x.</li></ol><h4>Speed check</h4><p>y = (5x − 1)⁴ → 20(5x − 1)³; y = √(3x + 4) → 3/(2√(3x + 4)); y = log(2x + 5) → 2/(2x + 5).</p><h4>Where it is used later</h4><p>Every implicit, parametric and logarithmic derivative in this unit ends with a chain rule. Get this section solid and the next four become bookkeeping.</p>"}, "syllabus_item": "2.3"}]}, {"title": {"en": "4. Derivatives of Implicit Functions"}, "items": [{"h": {"en": "4.1 When y is not given as a formula"}, "body": {"en": "<h4>Definition</h4><p>An <b>implicit</b> function is one where x and y are mixed in a single equation, such as x² + y² = 25. y is still a function of x, but it is not isolated.</p><h4>Method</h4><ol><li>Differentiate every term with respect to x.</li><li>Every time you differentiate a y-term, multiply by dy/dx (chain rule).</li><li>Collect the dy/dx terms on one side and factorise.</li><li>Divide to finish.</li></ol><h4>Worked example</h4><p>x² + y² = 25 gives 2x + 2y(dy/dx) = 0, so dy/dx = <b>−x/y</b>. At the point (3, 4) the slope is −3/4.</p><h4>Why the minus appears</h4><p>The dy/dx term arrives with a plus sign; moving it to the other side makes the answer negative - the standard shape for a circle.</p>"}, "examples": ["dd14"], "syllabus_item": "2.4"}, {"h": {"en": "4.2 Products and squares inside an implicit equation"}, "body": {"en": "<h4>Worked example</h4><p>x² + xy + y² = 7. The middle term is a product, so it takes the product rule: 1·y + x·(dy/dx).</p><p>Differentiating: 2x + y + x(dy/dx) + 2y(dy/dx) = 0.</p><p>Factorising: (x + 2y)(dy/dx) = −(2x + y), so dy/dx = <b>−(2x + y)/(x + 2y)</b>.</p><h4>A useful check</h4><p>The formula is symmetric in x and y except for the swap, which is what you expect from a symmetric equation. Symmetry checks catch sign errors.</p><h4>Common mistake</h4><p>Writing the derivative of y² as 2y. It is 2y(dy/dx) - the chain rule never switches off for a y-term.</p>"}, "examples": ["dd15"], "syllabus_item": "2.4"}, {"h": {"en": "4.3 Using an implicit derivative"}, "body": {"en": "<h4>Slope and tangent at a point</h4><p>Differentiate, then substitute the coordinates. For x² + y² = 25 at (3, 4) the slope is −3/4, so the tangent is y − 4 = (−3/4)(x − 3), that is 3x + 4y = 25.</p><h4>Vertical tangents</h4><p>Where the denominator of dy/dx becomes zero the slope is infinite: the tangent is vertical. On 2y = 0, that is at (5, 0) and (−5, 0) for the circle.</p><h4>Why implicit differentiation is needed</h4><p>Many engineering curves - a circle, an ellipse, a level curve of a graph - are given in implicit form. Isolating y would need two branches, and the slope formula would need a case split.</p>"}, "syllabus_item": "2.4"}]}, {"title": {"en": "5. Derivatives of Parametric Functions"}, "items": [{"h": {"en": "5.1 x and y given separately in terms of t"}, "body": {"en": "<h4>Rule</h4><p>When x = f(t) and y = g(t), <b>dy/dx = (dy/dt) ÷ (dx/dt)</b>.</p><h4>Worked example</h4><p>x = at², y = 2at: dx/dt = 2at and dy/dt = 2a, so dy/dx = 2a/(2at) = <b>1/t</b>.</p><h4>Why it works</h4><p>Both x and y depend on t, so the slope is the rate of y per unit of t divided by the rate of x per unit of t. The chain rule in the form dy/dx = (dy/dt)/(dx/dt) says exactly that.</p><h4>Common mistake</h4><p>Inverting the ratio. dy/dx is dy/dt over dx/dt, not the other way round; the wrong way gives 2at/2a = t instead of 1/t.</p>"}, "examples": ["dd16"], "syllabus_item": "2.5"}, {"h": {"en": "5.2 Parametric circles and ellipses"}, "body": {"en": "<h4>Worked example</h4><p>x = a cos θ, y = a sin θ (a circle of radius a): dx/dθ = −a sin θ and dy/dθ = a cos θ, so dy/dx = a cos θ / (−a sin θ) = <b>−cot θ</b>.</p><h4>Checking against the implicit form</h4><p>The same circle is x² + y² = a², whose implicit slope is −x/y = −a cos θ / a sin θ = −cot θ. Both methods agree - a good self-check in an exam.</p><h4>Ellipse</h4><p>For x = a cos θ, y = b sin θ the slope is −(b/a) cot θ, so the ellipse is flatter than the circle in the y-direction.</p><h4>Common mistake</h4><p>Differentiating sin θ to −cos θ. The derivative of sin is +cos; only cos gives −sin.</p>"}, "examples": ["dd17"], "syllabus_item": "2.5"}, {"h": {"en": "5.3 Slopes, tangents and the value of the parameter"}, "body": {"en": "<h4>Finding the point first</h4><p>A parametric question usually gives the value of t or θ. Substitute that value into x and y to get the point, and into dy/dx to get the slope.</p><h4>Example</h4><p>x = t², y = 2t at t = 3: the point is (9, 6) and dy/dx = 1/t = 1/3, so the tangent is 3y = x − 9 + 18, that is x − 3y + 9 = 0.</p><h4>What the parameter means</h4><p>In kinematics t is time, so the parametric curve is the path of a particle and dy/dx is the direction of motion. In geometry t or θ is simply a label that runs along the curve.</p><details class=\"self-check\"><summary>Do you need d²y/dx² here?</summary><p>The syllabus asks only for dy/dx of parametric curves. If asked, differentiate dy/dx with respect to t and divide by dx/dt.</p></details>"}, "syllabus_item": "2.5"}]}, {"title": {"en": "6. Logarithmic Differentiation"}, "items": [{"h": {"en": "6.1 When the power contains x"}, "body": {"en": "<h4>The problem</h4><p>xˣ is neither xⁿ (power fixed) nor aˣ (base fixed), so neither the power rule nor the exponential rule applies. Take logarithms first and the product rule does the work.</p><h4>Method</h4><ol><li>Take log of both sides: log y = x log x.</li><li>Differentiate both sides: (1/y)(dy/dx) = 1·log x + x·(1/x).</li><li>Simplify the right side: 1 + log x.</li><li>Multiply by y: dy/dx = xˣ(1 + log x).</li></ol><h4>Why it is allowed</h4><p>Both sides are positive for x > 0, so the logarithm is defined, and the chain rule gives the (1/y)(dy/dx) factor on the left.</p>"}, "diagram": "d4_logdiff", "examples": ["dd18"], "syllabus_item": "2.6"}, {"h": {"en": "6.2 Products, quotients and powers together"}, "body": {"en": "<h4>The trick in general</h4><p>For y = (1 + x)ˣ: log y = x log(1 + x), so (1/y)(dy/dx) = log(1 + x) + x/(1 + x), giving dy/dx = <b>(1 + x)ˣ[log(1 + x) + x/(1 + x)]</b>.</p><h4>Also useful for long products and quotients</h4><p>For y = x²(x + 1)³/(x − 2)⁴ the product and quotient rules give a very long expression. Taking logs turns it into a sum of three simple derivatives:</p><p>(1/y)(dy/dx) = 2/x + 3/(x + 1) − 4/(x − 2), then multiply by y.</p><h4>Common mistake</h4><p>Writing log(xˣ) = x log x and then forgetting to finish - the answer must be multiplied by y, not left as 1 + log x.</p>"}, "examples": ["dd19"], "syllabus_item": "2.6"}, {"h": {"en": "6.3 Deciding to take the logarithm"}, "body": {"en": "<h4>Take logs when</h4><ul><li>the variable appears in the exponent (xˣ, (sin x)ˣ, x^(1/x));</li><li>the expression is a long product or quotient that would need several rule applications;</li><li>an engineering formula is given as a product of powers, such as y = A x^n e^(−kx).</li></ul><h4>Do not take logs when</h4><p>The base is a constant: aˣ differentiates straight to aˣ log a, and eˣ to eˣ. Logarithms there add work and a stray factor.</p><h4>Worked mini-example</h4><p>y = x^(1/x): log y = (1/x) log x = log x / x, so (1/y)(dy/dx) = (1 − log x)/x², giving dy/dx = x^(1/x)(1 − log x)/x².</p><p>The maximum of x^(1/x) is at x = e, which is exactly where that derivative vanishes - a neat link to the next section.</p>"}, "syllabus_item": "2.6"}]}, {"title": {"en": "7. Successive Differentiation and Applications"}, "items": [{"h": {"en": "7.1 The second derivative"}, "body": {"en": "<h4>Definition</h4><p>Differentiating dy/dx gives the <b>second derivative</b> d²y/dx², written y″ or f″(x). The syllabus asks for the second order; higher orders follow the same idea.</p><h4>Worked examples</h4><p>y = x⁴: y′ = 4x³ and y″ = <b>12x²</b>.</p><p>y = sin 3x: y′ = 3 cos 3x and y″ = −9 sin 3x - each differentiation multiplies by 3 and shifts the function.</p><h4>What the second derivative means</h4><table><tr><th>y″</th><th>The graph is</th></tr><tr><td>positive</td><td>curving upwards (concave up)</td></tr><tr><td>negative</td><td>curving downwards (concave down)</td></tr><tr><td>zero</td><td>possibly a point of inflexion - check the sign change</td></tr></table><h4>Notation trap</h4><p>d²y/dx² is not (dy/dx)². The first is a second derivative; the second is the square of the first.</p>"}, "examples": ["dd20", "dd21"], "syllabus_item": "2.7"}, {"h": {"en": "7.2 Velocity and acceleration"}, "body": {"en": "<h4>Kinematics from calculus</h4><p>If s(t) is the position, then <b>v = ds/dt</b> and <b>a = dv/dt = d²s/dt²</b>.</p><h4>Worked example</h4><p>s = t³ − 6t² + 8t − 4 gives v = 3t² − 12t + 8 and a = 6t − 12. At t = 3: v = 27 − 36 + 8 = <b>−1</b> and a = 18 − 12 = <b>6</b>.</p><h4>Reading the signs</h4><ul><li>v > 0: moving in the positive direction; v &lt; 0: moving backwards.</li><li>v = 0: momentarily at rest - a turning point of the motion.</li><li>a > 0 with v > 0: speeding up; a &lt; 0 with v > 0: slowing down.</li></ul><h4>Units</h4><p>If s is in metres and t in seconds, v is m/s and a is m/s². Keep the units in the final line; examiners give a mark for them.</p>"}, "diagram": "d5_sva", "examples": ["dd22"], "syllabus_item": "2.8"}, {"h": {"en": "7.3 Maxima and minima: the method"}, "body": {"en": "<h4>Steps</h4><ol><li>Find f′(x).</li><li>Solve f′(x) = 0 for the stationary points.</li><li>Find f″(x) and evaluate it at each stationary point.</li><li>f″ &lt; 0 gives a maximum, f″ > 0 gives a minimum, f″ = 0 needs the first-derivative sign test.</li><li>Substitute back into f(x) for the maximum or minimum value.</li></ol><h4>Worked example</h4><p>f(x) = x³ − 3x + 2: f′ = 3x² − 3 = 0 gives x = 1 and x = −1; f″ = 6x, so f″(−1) = −6 (maximum, value 4) and f″(1) = 6 (minimum, value 0).</p><h4>Common mistake</h4><p>Answering with the x-value only. A maximum/minimum question normally asks for both the point and the value of the function there.</p>"}, "diagram": "d6_maxmin", "examples": ["dd23"], "syllabus_item": "2.8"}, {"h": {"en": "7.4 A second maxima and minima example"}, "body": {"en": "<h4>Worked example</h4><p>f(x) = 2x³ − 9x² + 12x: f′ = 6x² − 18x + 12 = 6(x − 1)(x − 2), so the stationary points are x = 1 and x = 2.</p><p>f″ = 12x − 18 gives f″(1) = −6 (maximum, value 5) and f″(2) = 6 (minimum, value 4).</p><h4>Word problems</h4><p>For a rectangle of perimeter 20 cm, let the length be x; then the width is 10 − x and the area A = x(10 − x) = 10x − x². A′ = 10 − 2x = 0 gives x = 5, and A″ = −2 &lt; 0 confirms a maximum of 25 cm² - a square.</p><h4>Reading the answer back</h4><p>Always say what the numbers mean in the words of the question (cm, cm², seconds, rupees). The calculus gives the turning point; the sentence gives the mark.</p>"}, "examples": ["dd24"], "syllabus_item": "2.8"}, {"h": {"en": "7.5 Exam routine for a differentiation question"}, "body": {"en": "<h4>Six lines that earn marks</h4><ol><li>Write the function and name the rule you will use.</li><li>Show u, v (or u inside) explicitly.</li><li>Write the rule with u′, v′ before substituting.</li><li>Simplify once, carefully.</li><li>For applications, state f′(x) = 0 and solve.</li><li>Finish with the second derivative, the sign test and a sentence.</li></ol><h4>Time saving</h4><p>Standard derivatives (sin, cos, eˣ, log, xⁿ) should be quoted, not re-derived. First principles is only used when the question says so.</p><h4>Accuracy habits</h4><p>Keep brackets around negative terms until the last line, and never cancel across a plus sign. Most marks lost in this unit are sign and bracket slips, not method.</p>"}, "syllabus_item": "2.8"}]}, {"title": {"en": "8. Practice Questions with Model Answers"}, "items": [{"h": {"en": "Practice 1. Differentiate f(x) = x² from first principles."}, "body": {"en": "<p>Step 1: f(x + h) − f(x) = (x + h)² − x² = x² + 2xh + h² − x² = 2xh + h².</p><p>Step 2: divide by h, allowed because h ≠ 0, giving 2x + h.</p><p>Step 3: let h → 0, so f′(x) = <b>2x</b>.</p><p>At x = 2 the slope is 4 and at x = −1 it is −2: the tangent falls left of the origin and rises to the right.</p>"}}, {"h": {"en": "Practice 2. Differentiate √x from first principles."}, "body": {"en": "<p>Multiply numerator and denominator by the conjugate √(x + h) + √x.</p><p>The numerator becomes h, so the expression is 1/[√(x + h) + √x], and with h → 0 the derivative is <b>1/(2√x)</b>. At x = 4 the slope is 1/4.</p>"}}, {"h": {"en": "Practice 3. Differentiate y = 4x³ − 6x² + 2x − 5 and find the slope at x = 1."}, "body": {"en": "<p>Differentiate term by term: 12x² − 12x + 2.</p><p>At x = 1 the slope is 12 − 12 + 2 = <b>2</b>. The constant −5 disappears because the derivative of a constant is zero.</p>"}}, {"h": {"en": "Practice 4. Differentiate y = x²(2x − 3) by the product rule."}, "body": {"en": "<p>u = x², v = 2x − 3, so u′ = 2x and v′ = 2.</p><p>(uv)′ = 2x(2x − 3) + x²(2) = 4x² − 6x + 2x² = <b>6x² − 6x</b>.</p><p>Check by expanding: y = 2x³ − 3x² differentiates to 6x² − 6x.</p>"}}, {"h": {"en": "Practice 5. Differentiate y = (3x + 1)/(x + 2) by the quotient rule."}, "body": {"en": "<p>u = 3x + 1, v = x + 2, so u′ = 3 and v′ = 1.</p><p>dy/dx = [3(x + 2) − (3x + 1)]/(x + 2)² = (3x + 6 − 3x − 1)/(x + 2)² = <b>5/(x + 2)²</b>.</p><p>The answer is positive everywhere, so the curve always rises.</p>"}}, {"h": {"en": "Practice 6. Differentiate y = (2x + 5)⁶."}, "body": {"en": "<p>This is a function of a function, so use the chain rule with u = 2x + 5.</p><p>dy/dx = 6(2x + 5)⁵ × 2 = <b>12(2x + 5)⁵</b>.</p><p>The factor 2 is compulsory; forgetting it is the most common error in this type.</p>"}}, {"h": {"en": "Practice 7. Differentiate y = cos 4x and y = e^(5x)."}, "body": {"en": "<p>For y = cos 4x the inside is 4x, so dy/dx = −sin(4x) × 4 = <b>−4 sin 4x</b>.</p><p>For y = e^(5x) the derivative of e^u is e^u, so dy/dx = e^(5x) × 5 = <b>5e^(5x)</b>.</p><p>Notice that each derivative keeps the same function and only the inside factor changes.</p>"}}, {"h": {"en": "Practice 8. Differentiate y = √(3x + 4)."}, "body": {"en": "<p>Write the root as a power, y = (3x + 4)^(1/2), and use the chain rule with u = 3x + 4.</p><p>dy/dx = (1/2)(3x + 4)^(−1/2) × 3, and the negative power puts the root underneath: dy/dx = <b>3/(2√(3x + 4))</b>.</p><p>At x = 0 the slope is 3/(2√4) = 3/4, and the slope falls as x grows because the root in the denominator becomes larger.</p>"}}, {"h": {"en": "Practice 9. Find dy/dx if x² + y² = 36, and the slope at (4, √20)."}, "body": {"en": "<p>Differentiate implicitly: 2x + 2y(dy/dx) = 0, so dy/dx = <b>−x/y</b>.</p><p>At (4, √20) the slope is −4/√20 = −2/√5.</p><p>The tangent there is y − √20 = (−2/√5)(x − 4), which can be left in this form.</p>"}}, {"h": {"en": "Practice 10. Find dy/dx if x² + 4xy + y² = 10."}, "body": {"en": "<p>Differentiate term by term, using the product rule on 4xy: 2x + 4[y + x(dy/dx)] + 2y(dy/dx) = 0.</p><p>Collect the dy/dx terms: (4x + 2y)(dy/dx) = −(2x + 4y).</p><p>So dy/dx = <b>−(x + 2y)/(2x + y)</b> after dividing by 2.</p>"}}, {"h": {"en": "Practice 11. Find dy/dx for x = 3t², y = 6t, and the slope at t = 2."}, "body": {"en": "<p>dx/dt = 6t and dy/dt = 6, so dy/dx = 6/(6t) = <b>1/t</b>.</p><p>At t = 2 the slope is 1/2, and the point is x = 12, y = 12.</p><p>The curve is a parabola and the slope falls as t grows, which matches the shape.</p>"}}, {"h": {"en": "Practice 12. Find dy/dx for x = a sec θ, y = b tan θ."}, "body": {"en": "<p>dx/dθ = a sec θ tan θ and dy/dθ = b sec²θ.</p><p>So dy/dx = b sec²θ /(a sec θ tan θ) = <b>(b/a)(sec θ/tan θ) = (b/a) cosec θ</b>.</p><p>Writing it as (b/a)·(1/sin θ) is the tidiest final form.</p>"}}, {"h": {"en": "Practice 13. Differentiate y = xˣ by taking logarithms."}, "body": {"en": "<p>Take logarithms: log y = x log x.</p><p>Differentiate: (1/y)(dy/dx) = log x + 1, so dy/dx = <b>xˣ(1 + log x)</b>.</p><p>At x = 1 the slope is 1(0 + 1) = 1, and at x = 1/e it is zero, which is the minimum of the curve.</p>"}}, {"h": {"en": "Practice 14. Find the second derivative of y = x⁵ + sin 2x."}, "body": {"en": "<p>y′ = 5x⁴ + 2 cos 2x, using the chain rule on sin 2x.</p><p>Differentiate again: y″ = <b>20x³ − 4 sin 2x</b>.</p><p>Each differentiation of sin 2x brings a factor 2, so cos 2x becomes −4 sin 2x.</p>"}}, {"h": {"en": "Practice 15. A particle moves with s = 2t³ − 9t² + 12t. Find its velocity and acceleration at t = 2 s."}, "body": {"en": "<p>v = ds/dt = 6t² − 18t + 12 and a = dv/dt = 12t − 18.</p><p>At t = 2: v = 24 − 36 + 12 = <b>0 m/s</b> and a = 24 − 18 = <b>6 m/s²</b>.</p><p>A zero velocity means the particle is momentarily at rest, yet it still has acceleration - the turning point of its motion.</p>"}}, {"h": {"en": "Practice 16. Find and classify the stationary points of f(x) = x³ − 6x² + 9x."}, "body": {"en": "<p>f′(x) = 3x² − 12x + 9 = 3(x − 1)(x − 3), so the stationary points are x = 1 and x = 3.</p><p>f″(x) = 6x − 12: f″(1) = −6 &lt; 0 → maximum, f(1) = 4; f″(3) = 6 > 0 → minimum, f(3) = 0.</p><p>The curve rises to 4, falls to 0 and then climbs again.</p>"}}]}], "diagrams": [{"id": "d1_tangent", "title": {"en": "From chord to tangent"}, "file": "diagrams/d1_tangent.svg"}, {"id": "d2_rules", "title": {"en": "The three working rules"}, "file": "diagrams/d2_rules.svg"}, {"id": "d3_chain", "title": {"en": "Chain rule: one link at a time"}, "file": "diagrams/d3_chain.svg"}, {"id": "d4_logdiff", "title": {"en": "Logarithmic differentiation for xˣ"}, "file": "diagrams/d4_logdiff.svg"}, {"id": "d5_sva", "title": {"en": "Position, velocity, acceleration"}, "file": "diagrams/d5_sva.svg"}, {"id": "d6_maxmin", "title": {"en": "Where the curve turns"}, "file": "diagrams/d6_maxmin.svg"}], "equations": [{"title": {"en": "Definition and standard derivatives"}, "items": [{"terms": {"en": "Derivative from first principles"}, "a": {"en": "f′(x) = lim (h→0) [f(x+h) − f(x)]/h"}}, {"terms": {"en": "Power rule"}, "a": {"en": "d(xⁿ)/dx = n xⁿ⁻¹ ;  d(constant)/dx = 0"}}, {"terms": {"en": "Exponential"}, "a": {"en": "d(eˣ)/dx = eˣ ;  d(aˣ)/dx = aˣ log a"}}, {"terms": {"en": "Logarithm"}, "a": {"en": "d(log x)/dx = 1/x"}}, {"terms": {"en": "Sine and cosine"}, "a": {"en": "d(sin x)/dx = cos x ;  d(cos x)/dx = −sin x"}}, {"terms": {"en": "Tangent"}, "a": {"en": "d(tan x)/dx = sec²x"}}]}, {"title": {"en": "Working rules"}, "items": [{"terms": {"en": "Sum and difference"}, "a": {"en": "(u ± v)′ = u′ ± v′"}}, {"terms": {"en": "Product"}, "a": {"en": "(uv)′ = u′v + uv′"}}, {"terms": {"en": "Quotient"}, "a": {"en": "(u/v)′ = (u′v − uv′)/v²"}}, {"terms": {"en": "Chain rule"}, "a": {"en": "dy/dx = dy/du × du/dx"}}, {"terms": {"en": "Power of a function"}, "a": {"en": "d[f(x)]ⁿ/dx = n[f(x)]ⁿ⁻¹ f′(x)"}}, {"terms": {"en": "Logarithm of a function"}, "a": {"en": "d log[f(x)]/dx = f′(x)/f(x)"}}]}, {"title": {"en": "Implicit, parametric and applications"}, "items": [{"terms": {"en": "Implicit differentiation"}, "a": {"en": "differentiate every term by x; each y-term gains a dy/dx factor"}}, {"terms": {"en": "Parametric slope"}, "a": {"en": "dy/dx = (dy/dt)/(dx/dt)"}}, {"terms": {"en": "Logarithmic differentiation"}, "a": {"en": "log y = log f(x); then (1/y)dy/dx = d[log f]/dx"}}, {"terms": {"en": "Second derivative"}, "a": {"en": "y″ = d²y/dx² = d(dy/dx)/dx"}}, {"terms": {"en": "Velocity and acceleration"}, "a": {"en": "v = ds/dt ;  a = dv/dt = d²s/dt²"}}, {"terms": {"en": "Stationary points"}, "a": {"en": "f′(x) = 0 ;  f″ &lt; 0 maximum, f″ > 0 minimum"}}]}], "numericals": [{"id": "dd1", "q": {"en": "Differentiate f(x) = x² from first principles."}, "a": {"en": "<p>Step 1: f(x + h) − f(x) = (x + h)² − x² = 2xh + h².</p><p>Step 2: divide by h → 2x + h.</p><p>Step 3: let h → 0, so f′(x) = <b>2x</b>.</p><p>At x = 1 the slope is 2 and at x = 3 it is 6 - the tangent gets steeper as x grows.</p>"}}, {"id": "dd2", "q": {"en": "Differentiate f(x) = √x from first principles."}, "a": {"en": "<p>Write [√(x + h) − √x]/h and multiply top and bottom by the conjugate √(x + h) + √x.</p><p>The numerator becomes (x + h) − x = h, so the expression is h / {h[√(x + h) + √x]} = 1/[√(x + h) + √x].</p><p>Let h → 0: f′(x) = 1/(√x + √x) = <b>1/(2√x)</b>.</p>"}}, {"id": "dd3", "q": {"en": "Differentiate y = 3x² − 5x + 2 and find the slope at x = 2."}, "a": {"en": "<p>Term by term: d(3x²)/dx = 6x, d(−5x)/dx = −5, d(2)/dx = 0.</p><p>So dy/dx = <b>6x − 5</b>.</p><p>At x = 2 the slope is 12 − 5 = <b>7</b>.</p>"}}, {"id": "dd4", "q": {"en": "Differentiate y = x³ + 2x² − 7x + 1."}, "a": {"en": "<p>Each term is a power of x, so differentiate term by term.</p><p>3x² + 4x − 7 + 0, that is dy/dx = <b>3x² + 4x − 7</b>.</p><p>The constant 1 differentiates to 0, and −7x differentiates to −7.</p>"}}, {"id": "dd5", "q": {"en": "Differentiate y = x²(3x + 5) using the product rule."}, "a": {"en": "<p>Take u = x² and v = 3x + 5, so u′ = 2x and v′ = 3.</p><p>(uv)′ = u′v + uv′ = 2x(3x + 5) + x²(3) = 6x² + 10x + 3x².</p><p>So dy/dx = <b>9x² + 10x</b>.</p><p>Check by expanding first: y = 3x³ + 5x², whose derivative is the same.</p>"}}, {"id": "dd6", "q": {"en": "Differentiate y = (x + 1)(x² + 3)."}, "a": {"en": "<p>u = x + 1, v = x² + 3, so u′ = 1 and v′ = 2x.</p><p>(uv)′ = 1(x² + 3) + (x + 1)(2x) = x² + 3 + 2x² + 2x.</p><p>So dy/dx = <b>3x² + 2x + 3</b>.</p>"}}, {"id": "dd7", "q": {"en": "Differentiate y = (2x + 1)/(x − 1) using the quotient rule."}, "a": {"en": "<p>u = 2x + 1, v = x − 1, so u′ = 2 and v′ = 1.</p><p>(u/v)′ = [2(x − 1) − (2x + 1)(1)]/(x − 1)² = (2x − 2 − 2x − 1)/(x − 1)².</p><p>So dy/dx = <b>−3/(x − 1)²</b>, which is negative for every x ≠ 1.</p>"}}, {"id": "dd8", "q": {"en": "Differentiate y = x/(x² + 1)."}, "a": {"en": "<p>u = x, v = x² + 1, so u′ = 1 and v′ = 2x.</p><p>(u/v)′ = [1(x² + 1) − x(2x)]/(x² + 1)² = (x² + 1 − 2x²)/(x² + 1)².</p><p>So dy/dx = <b>(1 − x²)/(x² + 1)²</b>.</p><p>The slope is zero at x = 1, which is where this curve has its maximum.</p>"}}, {"id": "dd9", "q": {"en": "Differentiate y = (3x + 2)⁵."}, "a": {"en": "<p>This is a function of a function: the outside is a fifth power and the inside is 3x + 2.</p><p>Take u = 3x + 2: dy/du = 5u⁴ and du/dx = 3.</p><p>dy/dx = 5u⁴ × 3 = <b>15(3x + 2)⁴</b>.</p><p>The factor 3 is compulsory - without it the answer would only be right for (x + 2)⁵.</p>"}}, {"id": "dd10", "q": {"en": "Differentiate y = sin 5x."}, "a": {"en": "<p>The outside is sin and the inside is 5x, whose derivative is 5.</p><p>dy/dx = cos(5x) × 5 = <b>5 cos 5x</b>.</p><p>At x = 0 the slope is 5, which is why the graph of sin 5x rises five times as fast as sin x.</p>"}}, {"id": "dd11", "q": {"en": "Differentiate y = e^(3x)."}, "a": {"en": "<p>The derivative of e^u is e^u, so the only extra work is the inside derivative.</p><p>dy/dx = e^(3x) × 3 = <b>3e^(3x)</b>.</p><p>Similarly y = e^(−2x) gives −2e^(−2x): a negative inside derivative makes the function decrease.</p>"}}, {"id": "dd12", "q": {"en": "Differentiate y = √(x² + 1)."}, "a": {"en": "<p>Write the root as a power: y = (x² + 1)^(1/2).</p><p>dy/dx = (1/2)(x² + 1)^(−1/2) × 2x = x(x² + 1)^(−1/2).</p><p>So dy/dx = <b>x/√(x² + 1)</b>.</p><p>At x = 0 the slope is 0, which matches the flat bottom of the curve there.</p>"}}, {"id": "dd13", "q": {"en": "Differentiate y = log(sin x)."}, "a": {"en": "<p>For y = log[f(x)] the derivative is f′(x)/f(x).</p><p>Here f(x) = sin x and f′(x) = cos x, so dy/dx = cos x/sin x.</p><p>That is dy/dx = <b>cot x</b>.</p>"}}, {"id": "dd14", "q": {"en": "Find dy/dx for x² + y² = 25 and hence the slope at (3, 4)."}, "a": {"en": "<p>Differentiate every term with respect to x, remembering that y is a function of x: 2x + 2y(dy/dx) = 0.</p><p>So dy/dx = <b>−x/y</b>.</p><p>At (3, 4): dy/dx = −3/4. The tangent there is y − 4 = (−3/4)(x − 3), that is 3x + 4y = 25.</p>"}}, {"id": "dd15", "q": {"en": "Find dy/dx for x² + xy + y² = 7."}, "a": {"en": "<p>The middle term is a product, so use the product rule on xy: derivative = y + x(dy/dx).</p><p>Differentiating the whole equation: 2x + y + x(dy/dx) + 2y(dy/dx) = 0.</p><p>Factorise: (x + 2y)(dy/dx) = −(2x + y), so dy/dx = <b>−(2x + y)/(x + 2y)</b>.</p>"}}, {"id": "dd16", "q": {"en": "Find dy/dx for the parametric curve x = at², y = 2at."}, "a": {"en": "<p>Differentiate each with respect to t: dx/dt = 2at and dy/dt = 2a.</p><p>dy/dx = (dy/dt)/(dx/dt) = 2a/(2at) = <b>1/t</b>.</p><p>At t = 2 the slope is 1/2, and the point is (4a, 4a).</p>"}}, {"id": "dd17", "q": {"en": "Find dy/dx for x = a cos θ, y = a sin θ."}, "a": {"en": "<p>dx/dθ = −a sin θ and dy/dθ = a cos θ.</p><p>dy/dx = a cos θ /(−a sin θ) = <b>−cot θ</b>.</p><p>This matches the implicit answer for x² + y² = a², where dy/dx = −x/y = −cot θ.</p>"}}, {"id": "dd18", "q": {"en": "Differentiate y = xˣ."}, "a": {"en": "<p>The variable is in both the base and the power, so take logarithms: log y = x log x.</p><p>Differentiate both sides: (1/y)(dy/dx) = 1·log x + x·(1/x) = 1 + log x.</p><p>Multiply by y: dy/dx = <b>xˣ(1 + log x)</b>.</p><p>Note that 1 + log x = 0 at x = 1/e, the minimum of the curve for x > 0.</p>"}}, {"id": "dd19", "q": {"en": "Differentiate y = (1 + x)ˣ."}, "a": {"en": "<p>Take logs: log y = x log(1 + x).</p><p>Differentiate: (1/y)(dy/dx) = log(1 + x) + x/(1 + x).</p><p>So dy/dx = <b>(1 + x)ˣ[log(1 + x) + x/(1 + x)]</b>.</p><p>At x = 0 this gives 1·(0 + 0) = 0, and indeed the curve of (1 + x)ˣ is flat at x = 0.</p>"}}, {"id": "dd20", "q": {"en": "Find the second derivative of y = x⁴."}, "a": {"en": "<p>First derivative: y′ = 4x³.</p><p>Differentiate again: y″ = <b>12x²</b>.</p><p>Since y″ ≥ 0 everywhere, the curve y = x⁴ is concave up on both sides of the origin.</p>"}}, {"id": "dd21", "q": {"en": "Find the second derivative of y = sin 3x."}, "a": {"en": "<p>First derivative: y′ = 3 cos 3x (chain rule brings the factor 3).</p><p>Differentiate again: y″ = 3 × (−3 sin 3x) = <b>−9 sin 3x</b>.</p><p>Each differentiation multiplies by 3, and the function moves sin → cos → −sin.</p>"}}, {"id": "dd22", "q": {"en": "A particle moves with s = t³ − 6t² + 8t − 4 (s in metres, t in seconds). Find the velocity and acceleration at t = 3 s."}, "a": {"en": "<p>v = ds/dt = 3t² − 12t + 8 and a = dv/dt = 6t − 12.</p><p>At t = 3: v = 27 − 36 + 8 = <b>−1 m/s</b> and a = 18 − 12 = <b>6 m/s²</b>.</p><p>The negative velocity means the particle is moving backwards at that instant, while the positive acceleration means the velocity is increasing - it is slowing down.</p>"}}, {"id": "dd23", "q": {"en": "Find the stationary points of f(x) = x³ − 3x + 2 and classify them."}, "a": {"en": "<p>f′(x) = 3x² − 3 = 3(x² − 1), so f′(x) = 0 at x = 1 and x = −1.</p><p>f″(x) = 6x, so f″(−1) = −6 &lt; 0 → <b>maximum at x = −1</b>, and f″(1) = 6 > 0 → <b>minimum at x = 1</b>.</p><p>The values are f(−1) = −1 + 3 + 2 = 4 and f(1) = 1 − 3 + 2 = 0.</p>"}}, {"id": "dd24", "q": {"en": "Find and classify the stationary points of f(x) = 2x³ − 9x² + 12x."}, "a": {"en": "<p>f′(x) = 6x² − 18x + 12 = 6(x − 1)(x − 2), so f′(x) = 0 at x = 1 and x = 2.</p><p>f″(x) = 12x − 18: f″(1) = −6 &lt; 0 → <b>maximum, value f(1) = 5</b>; f″(2) = 6 > 0 → <b>minimum, value f(2) = 4</b>.</p><p>The curve rises to 5, dips to 4 and then climbs again.</p>"}}], "viva": [{"title": {"en": "Meaning of the derivative"}, "items": [{"q": {"en": "What does dy/dx mean geometrically?"}, "a": {"en": "The slope of the tangent to the curve at that point - the rate at which y changes with x."}}, {"q": {"en": "Define the derivative in words."}, "a": {"en": "The limit of [f(x + h) − f(x)]/h as h tends to zero."}}, {"q": {"en": "Why can h not be put equal to zero at the start?"}, "a": {"en": "Because the expression would become 0/0. The h in the denominator must be cancelled first, and only then is h taken to zero."}}, {"q": {"en": "What is the derivative of a constant, and why?"}, "a": {"en": "Zero: a horizontal line has no change, so its slope is 0."}}, {"q": {"en": "Can a continuous function fail to have a derivative?"}, "a": {"en": "Yes. At a sharp corner, such as y = |x| at x = 0, the left and right slopes differ, so no single tangent slope exists."}}]}, {"title": {"en": "Rules"}, "items": [{"q": {"en": "State the product rule."}, "a": {"en": "(uv)′ = u′v + uv′ - differentiate one factor at a time and add."}}, {"q": {"en": "State the quotient rule."}, "a": {"en": "(u/v)′ = (u′v − uv′)/v², with the derivative of the numerator first."}}, {"q": {"en": "Why is (uv)′ not u′v′?"}, "a": {"en": "Because y = x²(3x + 5) would then differentiate to 6x, while the true answer is 9x² + 10x. The rule accounts for both factors changing at once."}}, {"q": {"en": "State the chain rule."}, "a": {"en": "dy/dx = dy/du × du/dx: differentiate the outside, then multiply by the derivative of the inside."}}, {"q": {"en": "Differentiate sin 5x."}, "a": {"en": "5 cos 5x. The inside derivative 5 must be included."}}, {"q": {"en": "Differentiate (3x + 2)⁵."}, "a": {"en": "15(3x + 2)⁴: 5(3x + 2)⁴ from the power and 3 from the inside."}}]}, {"title": {"en": "Implicit, parametric, logarithmic and applications"}, "items": [{"q": {"en": "What is an implicit function?"}, "a": {"en": "One where x and y are mixed in a single equation, such as x² + y² = 25, so y is not written alone."}}, {"q": {"en": "When differentiating an implicit equation, what extra factor appears?"}, "a": {"en": "dy/dx. Every y-term gains one, because y is a function of x (chain rule)."}}, {"q": {"en": "How do you find dy/dx for a parametric curve?"}, "a": {"en": "Differentiate both x and y with respect to the parameter, then divide: dy/dx = (dy/dt)/(dx/dt)."}}, {"q": {"en": "When do you use logarithmic differentiation?"}, "a": {"en": "When the variable appears in the power (xˣ), or when the expression is a long product or quotient."}}, {"q": {"en": "What do velocity and acceleration mean in calculus?"}, "a": {"en": "v = ds/dt (rate of change of position) and a = dv/dt = d²s/dt² (rate of change of velocity)."}}, {"q": {"en": "How do you test whether a stationary point is a maximum or a minimum?"}, "a": {"en": "Use the second derivative: f″ &lt; 0 gives a maximum, f″ > 0 a minimum. If f″ = 0, check the sign of f′ on both sides."}}]}], "exam_questions": [{"q": {"en": "Practice: Differentiate f(x) = x² from first principles."}, "marks": 3}, {"q": {"en": "Practice: Differentiate √x from first principles."}, "marks": 4}, {"q": {"en": "Practice: Differentiate y = 4x³ − 6x² + 2x − 5 and find the slope at x = 1."}, "marks": 3}, {"q": {"en": "Practice: Differentiate y = x²(2x − 3) by the product rule."}, "marks": 3}, {"q": {"en": "Practice: Differentiate y = (3x + 1)/(x + 2) by the quotient rule."}, "marks": 4}, {"q": {"en": "Practice: Differentiate y = (2x + 5)⁶."}, "marks": 3}, {"q": {"en": "Practice: Differentiate y = cos 4x and y = e^(5x)."}, "marks": 3}, {"q": {"en": "Practice: Differentiate y = √(3x + 4)."}, "marks": 3}, {"q": {"en": "Practice: Find dy/dx if x² + y² = 36, and the slope at (4, √20)."}, "marks": 4}, {"q": {"en": "Practice: Find dy/dx if x² + 4xy + y² = 10."}, "marks": 4}, {"q": {"en": "Practice: Find dy/dx for x = 3t², y = 6t, and the slope at t = 2."}, "marks": 3}, {"q": {"en": "Practice: Find dy/dx for x = a sec θ, y = b tan θ."}, "marks": 4}, {"q": {"en": "Practice: Differentiate y = xˣ by taking logarithms."}, "marks": 4}, {"q": {"en": "Practice: Find the second derivative of y = x⁵ + sin 2x."}, "marks": 3}, {"q": {"en": "Practice: A particle moves with s = 2t³ − 9t² + 12t. Find its velocity and acceleration at t = 2 s."}, "marks": 4}, {"q": {"en": "Practice: Find and classify the stationary points of f(x) = x³ − 6x² + 9x."}, "marks": 4}], "learning_outcomes": [{"en": "CO2: Demonstrate the ability to solve engineering related problems based on applications of differentiation."}], "course_outcomes": ["CO2"], "practical_numbers": [], "content_kind": "theory", "lesson_count": 26, "answered_practice_count": 16, "assessment_note": {"en": "Official course: theory ESE 70 + PA 30 = 100 marks, 4 credits, 45 teaching hours; this unit carries 23 % weightage and abou " fill=\"#666\" font-weight=\"normal\">Put u back before you finish.</text><rect x=\"15.0\" y=\"294.0\" width=\"330\" height=\"24\" rx=\"7\" fill=\"#FFF4DF\" stroke=\"#B66A00\" stroke-width=\"1.6\"/><text x=\"180\" y=\"309.6\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">log(sin x) → (1/sin x)·cos x = cot x</text><text x=\"180\" y=\"343.6\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">Differentiate the outside, then multiply by the inside.</text><text x=\"180\" y=\"359.6\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">Each extra layer adds one more factor.</text></svg>", "d4_logdiff": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 368\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"368\" fill=\"#ffffff\"/><text x=\"180\" y=\"28.9\" font-size=\"14\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">Logarithmic differentiation for xˣ</text><text x=\"180\" y=\"49.6\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">a variable in the power needs a logarithm first</text><text x=\"180\" y=\"82.5\" font-size=\"13\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">y = xˣ</text><rect x=\"15.0\" y=\"100.0\" width=\"330\" height=\"24\" rx=\"7\" fill=\"#EAF3FD\" stroke=\"#1565C0\" stroke-width=\"1.6\"/><text x=\"180\" y=\"115.6\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">1. take log of both sides:  log y = x log x</text><rect x=\"15.0\" y=\"138.0\" width=\"330\" height=\"24\" rx=\"7\" fill=\"#EAF3FD\" stroke=\"#1565C0\" stroke-width=\"1.6\"/><text x=\"180\" y=\"153.6\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">2. differentiate:  (1/y)·dy/dx = x·(1/x) + log x·1</text><rect x=\"15.0\" y=\"176.0\" width=\"330\" height=\"24\" rx=\"7\" fill=\"#FFF4DF\" stroke=\"#B66A00\" stroke-width=\"1.6\"/><text x=\"180\" y=\"191.6\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">3. tidy the right side: 1 + log x</text><rect x=\"15.0\" y=\"215.0\" width=\"330\" height=\"26\" rx=\"7\" fill=\"#EAF6EC\" stroke=\"#2E7D32\" stroke-width=\"1.6\"/><text x=\"180\" y=\"231.6\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">dy/dx = y (1 + log x) = xˣ (1 + log x)</text><text x=\"180\" y=\"267.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">Use it when the power also contains x</text><rect x=\"15.0\" y=\"288.0\" width=\"330\" height=\"24\" rx=\"7\" fill=\"#FDECF0\" stroke=\"#BD2543\" stroke-width=\"1.6\"/><text x=\"180\" y=\"303.5\" font-size=\"10.0\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">xˣ is not xⁿ and not aˣ - it needs this method</text><text x=\"180\" y=\"337.6\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">Take the log, differentiate both sides, then multiply by y.</text><text x=\"180\" y=\"353.6\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">The same trick handles (1 + x)ˣ and x^(sin x).</text></svg>", "d5_sva": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 376\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"376\" fill=\"#ffffff\"/><text x=\"180\" y=\"28.9\" font-size=\"14\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">Position, velocity, acceleration</text><text x=\"180\" y=\"49.6\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">s = t³ − 6t² + 8t  gives  v = s′  and  a = v′</text><rect x=\"15.0\" y=\"72.0\" width=\"330\" height=\"28\" rx=\"7\" fill=\"#EAF3FD\" stroke=\"#1565C0\" stroke-width=\"1.6\"/><text x=\"180\" y=\"89.7\" font-size=\"10.6\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">position:  s = t³ − 6t² + 8t</text><path d=\"M180 104 L180 130\" fill=\"none\" stroke=\"#666\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polygon points=\"180.0,130.0 183.5,123.0 176.5,123.0\" fill=\"#666\"/><text x=\"258\" y=\"121.3\" font-size=\"9.4\" text-anchor=\"start\" fill=\"#666\" font-weight=\"normal\">differentiate</text><rect x=\"15.0\" y=\"134.0\" width=\"330\" height=\"28\" rx=\"7\" fill=\"#EAF6EC\" stroke=\"#2E7D32\" stroke-width=\"1.6\"/><text x=\"180\" y=\"151.7\" font-size=\"10.6\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">velocity:  v = ds/dt = 3t² − 12t + 8</text><path d=\"M180 166 L180 192\" fill=\"none\" stroke=\"#666\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polygon points=\"180.0,192.0 183.5,185.0 176.5,185.0\" fill=\"#666\"/><text x=\"258\" y=\"183.3\" font-size=\"9.4\" text-anchor=\"start\" fill=\"#666\" font-weight=\"normal\">differentiate again</text><rect x=\"15.0\" y=\"196.0\" width=\"330\" height=\"28\" rx=\"7\" fill=\"#FFF4DF\" stroke=\"#B66A00\" stroke-width=\"1.6\"/><text x=\"180\" y=\"213.7\" font-size=\"10.6\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">acceleration:  a = dv/dt = 6t − 12</text><rect x=\"12.0\" y=\"249.0\" width=\"336\" height=\"26\" rx=\"7\" fill=\"#EAF3FD\" stroke=\"#1565C0\" stroke-width=\"1.6\"/><text x=\"180\" y=\"265.6\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">at t = 3:  v = 27 − 36 + 8 = −1,  a = 18 − 12 = 6</text><rect x=\"12.0\" y=\"293.0\" width=\"336\" height=\"26\" rx=\"7\" fill=\"#FDECF0\" stroke=\"#BD2543\" stroke-width=\"1.6\"/><text x=\"180\" y=\"309.5\" font-size=\"10.0\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">v = 0 → at rest;  a &lt; 0 → slowing down</text><text x=\"180\" y=\"343.6\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">Differentiate position to get velocity, then again for acceleration.</text><text x=\"180\" y=\"359.6\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">Units: metres, metres      intro:'વેઇટેજ',hours:'કલાક',introd:'GTU syllabus મુજબ આકૃતિ, સૂત્રો, ઉકેલેલા દાખલા અને viva સાથે વિગતવાર નોટ્સ.',
     marks:'ગુણ',programs:'પ્રોગ્રામ્સ',flowcharts:'ફ્લોચાર્ટ',syntax:'સિન્ટેક્સ',algorithms:'અલ્ગોરિધમ',prog:'💻 પ્રોગ્રામ',code:'કોડ',output:'આઉટપુટ',plot:'પ્લોટ (આઉટપુટ)',expl:'સમજૂતી',
     introc:'GTU syllabus મુજબ flowcharts, આઉટપુટ સાથેના ઉકેલેલા C programs, syntax અને viva સાથે વિગતવાર નોટ્સ.'}};
const L = k => STR[S.lang][k];
const t = o => (o && typeof o === 'object') ? (o[S.lang] || o.en) : (o || '');
const chev = '<svg class="chev" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#7B2CD9" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
const dots = '<svg width="22" height="22" viewBox="0 0 24 24" fill="#222"><circle cx="12" cy="5" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="12" cy="19" r="2.2"/></svg>';
const fixTables = h => h.replace(/<table>/g,'<div class="tw"><table>').replace(/<\/table>/g,'</table></div>');
const head = (title, menu=true) => `<div class="sh"><span>${title}</span>${menu?`<button class="more" data-more>${dots}</button><div class="menu"><button data-act="expand">${L('expand')}</button><button data-act="collapse">${L('collapse')}</button></div>`:''}</div>`;
const dgInline = id => `<div class="dg" data-dg="${id}">${SVG[id]}</div><div class="dgc">📐 ${t(U.diagrams.find(d=>d.id===id).title)} · ${L('tapzoom')}</div>`;

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const KW = new Set('auto break case const continue default do else enum extern for goto if register return signed sizeof static struct switch typedef union unsigned volatile while'.split(' '));
const TY = new Set('int char float double void long short FILE size_t'.split(' '));
const PKW = new Set('False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield'.split(' '));
const PTY = new Set('int float str bool list tuple set dict complex frozenset bytes bytearray range object'.split(' '));
function hlPy(src){
  const re = /(#[^\n]*)|((?:\b[rRbBfFuU]{1,2})?(?:'{3}[\s\S]*?'{3}|"{3}[\s\S]*?"{3}|'(?:\\.|[^'\\\n])*'|"(?:\\.|[^"\\\n])*"))|(^>>>|^\.\.\.(?= ))|([A-Za-z_]\w*)(?=\s*\()|([A-Za-z_]\w*)|(\b(?:0[xXoObB][0-9a-fA-F_]+|\d[\d_]*(?:\.\d+)?(?:[eE][-+]?\d+)?j?)\b)/gm;
  let o='', last=0, m;
  while ((m = re.exec(src))){
    o += esc(src.slice(last, m.index)); last = re.lastIndex;
    const w = esc(m[0]);
    if (m[1]) o += `<span class="cm">${w}</span>`;
    else if (m[2]) o += `<span class="st">${w}</span>`;
    else if (m[3]) o += `<span class="pp">${w}</span>`;
    else if (m[4]) o += PKW.has(m[4]) ? `<span class="kw">${w}</span>` : PTY.has(m[4]) ? `<span class="ty">${w}</span>` : `<span class="fn">${w}</span>`;
    else if (m[5]) o += PKW.has(m[5]) ? `<span class="kw">${w}</span>` : PTY.has(m[5]) ? `<span class="ty">${w}</span>` : w;
    else o += `<span class="nu">${w}</span>`;
  }
  return o + esc(src.slice(last));
}
function hl(src){
  if (META.code_lang === 'python') return hlPy(src);
  if (META.code_lang === 'nosql') return esc(src);
  const re = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(^[ \t]*#[^\n]*)|([A-Za-z_]\w*)(?=\s*\()|([A-Za-z_]\w*)|(\b\d+(?:\.\d+)?[fFlLuU]*\b)/gm;
  let o='', last=0, m;
  while ((m = re.exec(src))){
    o += esc(src.slice(last, m.index)); last = re.lastIndex;
    const w = esc(m[0]);
    if (m[1]) o += `<span class="cm">${w}</span>`;
    else if (m[2]) o += `<span class="st">${w}</span>`;
    else if (m[3]) o += `<span class="pp">${w}</span>`;
    else if (m[4]) o += KW.has(m[4]) ? `<span class="kw">${w}</span>` : TY.has(m[4]) ? `<span class="ty">${w}</span>` : `<span class="fn">${w}</span>`;
    else if (m[5]) o += KW.has(m[5]) ? `<span class="kw">${w}</span>` : TY.has(m[5]) ? `<span class="ty">${w}</span>` : w;
    else o += `<span class="nu">${w}</span>`;
  }
  return o + esc(src.slice(last));
}
const progBody = p => p.items
  ? p.items.map(it => fixTables(t(it.body)) + (it.diagram?dgInline(it.diagram):'')).join('')
  : `<div class="pl">${L('code')}</div><pre class="code">${hl(t(p.code))}</pre><div class="pl">${L('output')}</div><pre class="out">${esc(p.out)}</pre>${p.plot?`<div class="pl">${L('plot')}</div>`+dgInline(p.plot).replace('class="dg"','class="dg pg"'):''}${p.expl?`<div class="pl">${L('expl')}</div>${fixTables(t(p.expl))}`:''}`;
const pBox = id => { const p=(U.programs||[]).find(x=>x.id===id); if(!p) return ''; return `<div class="pbox"><div class="et">${L('prog')}: ${t(p.title)}</div>${progBody(p)}</div>`; };
const exBox = id => { const n=(U.numericals||[]).find(x=>x.id===id); if(!n) return ''; return `<div class="ex"><div class="et">${L('ex')}</div><div class="eq2">${t(n.q)}</div>${fixTables(t(n.a))}</div>`; };
function notes(){
  let h = `<div class="intro"><b>${t(U.title)}</b><div>${L('unit')} ${U.unit} · ${U.weightage}% ${L('intro')} · ${U.hours} ${L('hours')}</div><div>${U.intro_text ? t(U.intro_text) : L(U.programs?(META.code_lang==='python'?'intropy':'introc'):'introd')}</div></div>`;
  U.notes.forEach((sec,si)=>{
    h += `<div class="sec">${head(t(sec.title))}`;
    sec.items.forEach((it,i)=>{
      const open = si===0&&i===0 ? ' open' : '';
      if (it.h) {
        h += `<div class="card${it.key?' key':''}${open}"><div class="q hd"><span class="t">${it.key?'⭐ ':''}${t(it.h)}</span>${chev}</div>
        <div class="a rn" style="padding-left:18px">${fixTables(t(it.body)).replace(/margin:0 0 10px -36px/g,'')}${it.diagram?dgInline(it.diagram):''}${(it.examples||[]).map(exBox).join('')}${(it.programs||[]).map(pBox).join('')}</div></div>`;
      } else {
        h += `<div class="card${open}"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(it.q)}</span>${chev}</div>
        <div class="a">${fixTables(t(it.a))}${it.diagram?dgInline(it.diagram):''}</div></div>`;
      }
    });
    h += `</div>`;
  });
  return h;
}
function numericals(){
  return `<div class="sec">${head(L('numericals'))}` + (U.numericals||[]).map((n,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(n.q)}</span>${chev}</div><div class="a">${fixTables(t(n.a))}</div></div>`).join('') + `</div>`;
}
function diagrams(){
  return `<div class="sec">${head(L((U.tabs ? U.tabs.includes('flowcharts')&&!U.tabs.includes('diagrams') : U.programs&&META.code_lang!=='python')?'flowcharts':'diagrams'),false)}<div style="height:10px"></div>` + U.diagrams.map((d,i)=>
    `<div class="dcard" data-dg="${d.id}"><div class="h">${i+1}. ${t(d.title)}</div>${SVG[d.id]}</div>`).join('') + `</div>`;
}
function equations(){
  return U.equations.map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><span class="fbox">${e.f}</span></span>${chev}</div>
     <div class="a"><p>${t(e.terms)}</p></div></div>`).join('') + `</div>`).join('');
}
function viva(){
  // two shapes exist in the corpus: flat [{q,a}] and grouped [{title, items:[{q,a}]}]
  const groups = U.viva.every(v=>v && v.q) ? [{items: U.viva}] : U.viva;
  return groups.map(g=>{
    const items = g.items || [];
    return `<div class="sec">${g.title?head(t(g.title)):''}` + items.map((v,i)=>
      `<div class="card"><div class="q hd"><span class="n">${i+1}.</span><span class="t">${t(v.q)}</span>${chev}</div><div class="a"><p>${t(v.a)}</p></div></div>`).join('') + `</div>`;
  }).join('');
}
function exam(){
  return `<div class="sec">${head(L('examhead'),false)}` + U.exam_questions.map((x,i)=>
    `<div class="card"><div class="q" style="cursor:default"><span class="n">${i+1}.</span><span class="t">${t(x.q)}</span><span class="mk">${x.marks} ${L('marks')}</span></div></div>`).join('') + `</div>`;
}
function programs(){
  return `<div class="sec">${head(L('programs'))}` + (U.programs||[]).map((p,i)=>
    `<div class="card"><div class="q hd"><span class="n">${i+1}.</span><span class="t">${t(p.title)}</span>${chev}</div><div class="a pa">${progBody(p)}</div></div>`).join('') + `</div>`;
}
function syntax(key){
  return (U[typeof key==='string'?key:'syntax']||[]).map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><pre class="code sx">${hl(e.f)}</pre></span>${chev}</div>
     <div class="a">${e.terms && t(e.terms) ? fixTables(t(e.terms)) : ''}</div></div>`).join('') + `</div>`).join('');
}
const flowcharts = diagrams;
const algorithms = () => syntax('algorithms');
const ALLV = {notes, programs, diagrams, flowcharts, algorithms, syntax, equations, numericals, viva, exam};
const VIEWS = U.tabs ? Object.fromEntries(U.tabs.map(k=>[k, ALLV[k]])) : U.programs ? (META.code_lang==='python' ? {notes, programs, diagrams, syntax, viva, exam} : {notes, programs, flowcharts, syntax, viva, exam}) : U.numericals ? {notes, diagrams, equations, numericals, viva, exam} : {notes, diagrams, equations, viva, exam};
function render(){
  document.getElementById('title').textContent = `${L('unit')} ${U.unit}: ${t(U.title)}`;
  document.getElementById('sub').textContent = `${t(META.name)} · ${META.code}`;
  document.getElementById('lang').textContent = S.lang==='en' ? 'ગુ' : 'EN';
  document.getElementById('lang').style.display = META.languages.includes('gu') ? '' : 'none';
  document.getElementById('tabs').innerHTML = Object.keys(VIEWS).map(k=>`<button class="tab${S.tab===k?' on':''}" data-tab="${k}">${L(k)}</button>`).join('');
  document.getElementById('view').innerHTML = VIEWS[S.tab]();
  document.querySelectorAll('#view pre.c').forEach(e=>{ e.innerHTML = hl(e.textContent); e.className='code'; });
}
let zoom = 1;
function setZoom(z){ zoom = Math.min(4, Math.max(1, z)); const w=document.getElementById('zw'); w.style.width=(zoom*100)+'%'; document.getElementById('zr').textContent=Math.round(zoom*100)+'%'; }
document.addEventListener('click', e=>{
  const q = e.target.closest('.q'); if (q && q.parentElement.querySelector('.a')) { q.parentElement.classList.toggle('open'); return; }
  const tb = e.target.closest('[data-tab]'); if (tb){ S.tab = tb.dataset.tab; render(); window.scrollTo(0,0); return; }
  if (e.target.closest('#lang')){ S.lang = S.lang==='en'?'gu':'en'; render(); return; }
  const m = e.target.closest('[data-more]');
  document.querySelectorAll('.menu.show').forEach(x=>{ if(!m || x!==m.nextElementSibling) x.classList.remove('show'); });
  if (m){ m.nextElementSibling.classList.toggle('show'); return; }
  const act = e.target.closest('[data-act]');
  if (act){ act.closest('.sec').querySelectorAll('.card').forEach(c=>{ if(c.querySelector('.a')) c.classList.toggle('open', act.dataset.act==='expand'); }); act.parentElement.classList.remove('show'); return; }
  const dg = e.target.closest('[data-dg]');
  if (dg){ const id=dg.dataset.dg; document.getElementById('mt').textContent=t(U.diagrams.find(d=>d.id===id).title); document.getElementById('zw').innerHTML=SVG[id]; setZoom(1); document.getElementById('modal').classList.add('show'); return; }
  if (e.target.closest('#mx')) document.getElementById('modal').classList.remove('show');
  if (e.target.closest('#zi')) setZoom(zoom+0.5);
  if (e.target.closest('#zo')) setZoom(zoom-0.5);
  if (e.target.closest('#zr')) setZoom(1);
});
render();
</script></body></html>
