<style>

.kw{color:#C792EA;font-weight:700}.ty{color:#82AAFF}.st{color:#C3E88D}.cm{color:#8E9AAF;font-style:italic}.pp{color:#F78C6C}.nu{color:#F9C46B}.fn{color:#FFCB6B}

<script>
const U = {"subject": "DI02000021", "unit": 5, "format": "notes", "title": {"en": "Complex Numbers"}, "hours": 7, "weightage": 17, "official": true, "languages": ["en"], "tabs": ["notes", "diagrams", "equations", "numericals", "viva", "exam"], "intro_text": {"en": "Unit 5 of Engineering Mathematics: the complex number and its Argand diagram, algebra and powers of i, conjugate, modulus and inverse, argument and polar form, De Moivre's theorem with roots, and the square root of a complex number together with the cube roots of unity. Twenty fully solved numericals, each linked to a card."}, "notes": [{"title": {"en": "1. The Complex Number"}, "items": [{"h": {"en": "1.1 Why a new kind of number"}, "body": {"en": "<h4>The problem</h4><p>The equation x² + 1 = 0 has no real solution, because no real number squares to −1. Engineering needs the missing root: a circuit's characteristic equation, a rotation matrix and a differential equation all produce it.</p><h4>The definition</h4><p>Introduce <b>i = √(−1)</b>, so <b>i² = −1</b>. A <b>complex number</b> is z = a + ib, where a and b are real.</p><ul><li>a is the <b>real part</b>, written Re(z)</li><li>b is the <b>imaginary part</b>, written Im(z)</li><li>if b = 0 the number is real; if a = 0 it is purely imaginary</li></ul><h4>Examples</h4><p>3 + 4i has Re = 3 and Im = 4. The number −5i is purely imaginary, and 7 is real. There is no order: 3 + 4i is neither bigger nor smaller than 1 + i.</p><h4>Common mistake</h4><p>Writing Im(3 + 4i) = 4i. The imaginary part is the real number 4; the i is part of the symbol, not of the number b.</p>"}, "syllabus_item": "5.1"}, {"h": {"en": "1.2 Powers of i follow a cycle of four"}, "body": {"en": "<h4>The cycle</h4><table><tr><th>Power</th><th>Value</th></tr><tr><td>i¹</td><td>i</td></tr><tr><td>i²</td><td>−1</td></tr><tr><td>i³</td><td>−i</td></tr><tr><td>i⁴</td><td>1</td></tr></table><p>After four steps the values repeat, so iⁿ depends only on the remainder of n divided by 4.</p><h4>Worked examples</h4><p>i¹⁵: 15 = 4 × 3 + 3, so i¹⁵ = i³ = <b>−i</b>.</p><p>i²²: 22 = 4 × 5 + 2, so i²² = i² = <b>−1</b>.</p><h4>Why it works</h4><p>i⁴ = (i²)² = (−1)² = 1, so every group of four powers multiplies by 1 and can be dropped.</p><h4>Common mistake</h4><p>Dividing by 4 and using the quotient instead of the remainder. It is the remainder that picks the row of the table.</p>"}, "examples": ["cm1"], "syllabus_item": "5.1"}, {"h": {"en": "1.3 The Argand diagram"}, "body": {"en": "<h4>Plotting</h4><p>A complex number a + ib is drawn as the point (a, b): a along the real axis, b along the imaginary axis. The plane is called the <b>Argand diagram</b> or the complex plane.</p><h4>Distance and direction</h4><p>The length of the arrow from the origin is the modulus |z| = √(a² + b²), and the angle it makes with the real axis is the argument θ.</p><h4>Useful pictures</h4><ul><li>The conjugate a − ib is the reflection in the real axis.</li><li>Multiplying by i turns the arrow 90° anticlockwise.</li><li>Adding two numbers completes a parallelogram.</li></ul><h4>Common mistake</h4><p>Plotting a + ib at (b, a). Real part first, imaginary second - exactly like (x, y).</p>"}, "diagram": "n1_argand", "syllabus_item": "5.1"}, {"h": {"en": "1.4 Equality and finding unknowns"}, "body": {"en": "<h4>The rule</h4><p>Two complex numbers are equal only when both parts match: a + ib = c + id means <b>a = c and b = d</b>. One complex equation carries two real equations.</p><h4>Worked example</h4><p>If (x + 2) + (y − 3)i = 5 + 4i, then x + 2 = 5 and y − 3 = 4, so x = 3 and y = 7.</p><h4>With a product</h4><p>For (x + iy)(2 + i) = 7 + 4i, expand to (2x − y) + (x + 2y)i = 7 + 4i, then solve the pair 2x − y = 7, x + 2y = 4.</p><h4>Common mistake</h4><p>Comparing only the real parts and forgetting the imaginary equation - half the information is then unused.</p>"}, "examples": ["cm2"], "syllabus_item": "5.2"}]}, {"title": {"en": "2. Algebra of Complex Numbers"}, "items": [{"h": {"en": "2.1 Addition and subtraction"}, "body": {"en": "<h4>Rule</h4><p>Add (or subtract) the real parts together and the imaginary parts together: (a + ib) ± (c + id) = (a ± c) + i(b ± d).</p><h4>Worked example</h4><p>(5 − 2i) + (−3 + 4i) = (5 − 3) + (−2 + 4)i = <b>2 + 2i</b>.</p><p>Subtraction: (5 − 2i) − (−3 + 4i) = 8 − 6i.</p><h4>Geometric meaning</h4><p>On the Argand diagram the sum is the diagonal of the parallelogram built on the two arrows, exactly like vector addition.</p><h4>Common mistake</h4><p>Adding 3 + 4i and 1 + 2i as 4 + 6i² - the parts combine, they are not multiplied.</p>"}, "examples": ["cm3"], "syllabus_item": "5.2"}, {"h": {"en": "2.2 Multiplication"}, "body": {"en": "<h4>Rule</h4><p>Expand like brackets and then replace i² by −1: (a + ib)(c + id) = (ac − bd) + i(ad + bc).</p><h4>Worked example</h4><p>(3 + 2i)(4 − 5i) = 12 − 15i + 8i − 10i² = 12 − 7i + 10 = <b>22 − 7i</b>.</p><h4>Special products</h4><ul><li>(a + ib)(a − ib) = a² + b², always real and positive</li><li>(1 + i)² = 2i, a result worth remembering for powers</li><li>i(a + ib) = −b + ia, a rotation through 90°</li></ul><h4>Common mistake</h4><p>Leaving the answer as 12 − 7i − 10i². The i² must be replaced by −1 before the answer is in the form a + ib.</p>"}, "examples": ["cm4"], "syllabus_item": "5.2"}, {"h": {"en": "2.3 Division"}, "body": {"en": "<h4>Method</h4><p>Multiply the top and bottom by the <b>conjugate of the denominator</b>. The denominator then becomes real, and the answer splits into real and imaginary parts.</p><h4>Worked example</h4><p>(1 + 2i)/(3 − 4i): multiply by (3 + 4i)/(3 + 4i). The denominator is 3² + 4² = 25, and the numerator is (1 + 2i)(3 + 4i) = −5 + 10i.</p><p>So the answer is (−5 + 10i)/25 = <b>−1/5 + (2/5)i</b>.</p><h4>Why multiply by the conjugate</h4><p>(a + ib)(a − ib) = a² + b² has no i in it, so the denominator clears in one step. This is the same trick that rationalises a surd.</p><h4>Common mistake</h4><p>Multiplying by the denominator itself instead of its conjugate, which leaves the i in place.</p>"}, "examples": ["cm5"], "syllabus_item": "5.2"}, {"h": {"en": "2.4 Working with powers by repeated squaring"}, "body": {"en": "<h4>The trick</h4><p>For small powers, square instead of expanding: (1 + i)² = 2i, so (1 + i)⁴ = (2i)² = −4 and (1 + i)⁶ = (1 + i)⁴(1 + i)² = (−4)(2i) = −8i.</p><h4>Reading off the parts</h4><p>From −8i the real part is <b>0</b> and the imaginary part is <b>−8</b>.</p><h4>When to prefer De Moivre</h4><p>Repeated squaring is quick for powers up to about 8. For larger powers, or when the answer must be a single number, De Moivre's theorem in section 5 is safer.</p><h4>Common mistake</h4><p>Squaring a sum term by term: (1 + i)² is 2i, not 1 + i² = 0.</p>"}, "examples": ["cm20"], "syllabus_item": "5.2"}]}, {"title": {"en": "3. Conjugate, Modulus and Inverse"}, "items": [{"h": {"en": "3.1 The conjugate"}, "body": {"en": "<h4>Definition</h4><p>The <b>conjugate</b> of z = a + ib is z̄ = a − ib: same real part, opposite imaginary part. On the Argand diagram it is the mirror image in the real axis.</p><h4>Properties</h4><ul><li>z + z̄ = 2a, which is twice the real part</li><li>z − z̄ = 2bi, which is twice the imaginary part</li><li>z · z̄ = a² + b², always real and never negative</li><li>the conjugate of a sum is the sum of the conjugates, and the same for a product</li></ul><h4>Worked example</h4><p>For z = 3 − 4i, the conjugate is 3 + 4i, and z z̄ = 9 + 16 = 25.</p><h4>Common mistake</h4><p>Changing the sign of the real part instead of the imaginary part.</p>"}, "examples": ["cm6"], "syllabus_item": "5.3"}, {"h": {"en": "3.2 The modulus"}, "body": {"en": "<h4>Definition</h4><p>The <b>modulus</b> |z| = √(a² + b²) is the distance of the point from the origin, and it is always a non-negative real number.</p><h4>Worked example</h4><p>|3 − 4i| = √(9 + 16) = <b>5</b>. For z = −1 + i√3, |z| = √(1 + 3) = 2.</p><h4>Properties</h4><ul><li>|z₁ z₂| = |z₁| |z₂| and |z₁/z₂| = |z₁|/|z₂|</li><li>|z|² = z z̄ = a² + b²</li><li>|z| = 0 only for z = 0</li></ul><h4>Common mistake</h4><p>Dropping the i before squaring, or forgetting the square root at the end. The answer is a plain number, not a complex one.</p>"}, "examples": ["cm6", "cm7"], "syllabus_item": "5.3"}, {"h": {"en": "3.3 The multiplicative inverse"}, "body": {"en": "<h4>Formula</h4><p><b>z⁻¹ = 1/z = z̄/|z|²</b>. Multiplying z by this gives 1, so it really is the inverse.</p><h4>Worked example</h4><p>For z = 3 − 4i, |z|² = 25 and z̄ = 3 + 4i, so z⁻¹ = (3 + 4i)/25 = <b>3/25 + (4/25)i</b>.</p><h4>Check</h4><p>(3 − 4i)(3 + 4i)/25 = 25/25 = 1, so the answer is right.</p><h4>Common mistake</h4><p>Writing 1/z = 1/a + 1/(ib). The reciprocal of a complex number is not the sum of the reciprocals of its parts.</p>"}, "examples": ["cm5"], "syllabus_item": "5.3"}, {"h": {"en": "3.4 Division seen as multiplication by the inverse"}, "body": {"en": "<h4>Two views of the same step</h4><p>Dividing z₁ by z₂ means multiplying by z₂⁻¹ = z̄₂/|z₂|², which is exactly the 'multiply top and bottom by the conjugate' rule of section 2.</p><h4>Worked example</h4><p>(2 + i)/(1 − i): the conjugate of the bottom is 1 + i and |1 − i|² = 2. The numerator becomes (2 + i)(1 + i) = 1 + 3i, so the answer is (1 + 3i)/2 = <b>1/2 + (3/2)i</b>.</p><h4>Useful consequences</h4><p>|z₁/z₂| = |z₁|/|z₂| and the conjugate of a quotient is the quotient of the conjugates - both follow at once from this view.</p><h4>Common mistake</h4><p>Forgetting to divide the whole numerator by |z₂|² after multiplying.</p>"}, "examples": ["cm5"], "syllabus_item": "5.3"}]}, {"title": {"en": "4. Argument and Polar Form"}, "items": [{"h": {"en": "4.1 The argument and its quadrant"}, "body": {"en": "<h4>Definition</h4><p>The <b>argument</b> θ is the angle the arrow makes with the positive real axis, measured anticlockwise. The principal value lies between −π and π.</p><h4>Finding it</h4><p>Compute α = tan⁻¹|b/a| first, then fix the quadrant: first quadrant θ = α, second θ = π − α, third θ = −(π − α), fourth θ = −α.</p><h4>Worked example</h4><p>For z = −1 + i√3, α = tan⁻¹(√3) = π/3 and the point is in the second quadrant, so θ = π − π/3 = <b>2π/3</b>.</p><h4>Common mistake</h4><p>Taking tan⁻¹(b/a) and stopping there. The calculator only returns values between −π/2 and π/2, so quadrants 2 and 3 always need the correction.</p>"}, "diagram": "n2_arg", "examples": ["cm7"], "syllabus_item": "5.4"}, {"h": {"en": "4.2 Polar form"}, "body": {"en": "<h4>The form</h4><p><b>z = r(cos θ + i sin θ) = r cis θ</b>, where r = |z| and θ = arg z. It is the same number written by length and direction instead of by coordinates.</p><h4>Worked example</h4><p>For z = 1 + i: r = √2 and θ = π/4, so z = <b>√2 cis (π/4)</b>.</p><h4>Converting both ways</h4><ul><li>Cartesian to polar: r = √(a² + b²), θ from the quadrant rule</li><li>Polar to Cartesian: a = r cos θ and b = r sin θ</li></ul><h4>Common mistake</h4><p>Mixing the two forms in one answer, such as √2(cos 45° + i) - either write cos and sin, or write r cis θ.</p>"}, "diagram": "n3_polar", "examples": ["cm8"], "syllabus_item": "5.4"}, {"h": {"en": "4.3 Worked conversions"}, "body": {"en": "<h4>Third quadrant</h4><p>For z = −3 − 3i: r = √(9 + 9) = 3√2 and the point is in the third quadrant, so θ = −(π − π/4) = −3π/4 (the same angle as 5π/4).</p><p>Hence z = <b>3√2 cis (−3π/4)</b>.</p><h4>Back to Cartesian</h4><p>4 cis (π/3) = 4(cos 60° + i sin 60°) = 4(1/2 + i√3/2) = <b>2 + 2√3 i</b>.</p><h4>Choosing the angle</h4><p>Both −3π/4 and 5π/4 describe the same point. The principal value, inside (−π, π], is the one normally marked and the one De Moivre works with most cleanly.</p><h4>Common mistake</h4><p>Using r sin θ for the real part. cos goes with the real axis, sin with the imaginary axis.</p>"}, "examples": ["cm9"], "syllabus_item": "5.4"}, {"h": {"en": "4.4 Multiplication and division in polar form"}, "body": {"en": "<h4>Rules</h4><ul><li>multiply: r₁ cis θ₁ × r₂ cis θ₂ = r₁r₂ cis (θ₁ + θ₂)</li><li>divide: r₁ cis θ₁ ÷ r₂ cis θ₂ = (r₁/r₂) cis (θ₁ − θ₂)</li></ul><p>Multiplying multiplies the lengths and adds the angles; dividing divides the lengths and subtracts the angles.</p><h4>Example</h4><p>(2 cis 30°)(3 cis 50°) = 6 cis 80°, and (6 cis 80°) ÷ (3 cis 50°) = 2 cis 30°, which returns the original number.</p><h4>Why it matters</h4><p>This is the reason phasors work in AC circuits: the product of two phasors is another phasor whose angle is the sum.</p><h4>Common mistake</h4><p>Adding the moduli or multiplying the arguments. It is the other way round.</p>"}, "examples": ["cm8", "cm9"], "syllabus_item": "5.4"}]}, {"title": {"en": "5. De Moivre's Theorem"}, "items": [{"h": {"en": "5.1 The theorem"}, "body": {"en": "<h4>Statement</h4><p><b>(r cis θ)ⁿ = rⁿ cis (nθ)</b> for every integer n. In cosine form, (cos θ + i sin θ)ⁿ = cos nθ + i sin nθ.</p><h4>Reading it</h4><p>Raise the modulus to the power and multiply the argument by the power. That single line replaces pages of binomial expansion.</p><h4>Why it is true</h4><p>Multiplying by r cis θ adds θ to the argument, so repeating the multiplication n times adds θ exactly n times. Induction makes the argument precise.</p><h4>Routine</h4><ol><li>Write z in polar form: find r and θ.</li><li>Apply the theorem: modulus rⁿ, argument nθ.</li><li>Bring nθ back into the principal range and finish in a + ib if asked.</li></ol><h4>Common mistake</h4><p>Raising the angle to the power as well. It is n times θ, not θⁿ.</p>"}, "diagram": "n5_demoivre", "syllabus_item": "5.5"}, {"h": {"en": "5.2 Powers in practice"}, "body": {"en": "<h4>Example 1</h4><p>(1 + i)⁸: r = √2 and θ = π/4, so the answer is (√2)⁸ cis (8 × π/4) = 16 cis 2π = <b>16</b>.</p><h4>Example 2</h4><p>(1 − i√3)⁶: r = 2 and θ = −π/3, so the answer is 2⁶ cis (−2π) = 64 cis 0 = <b>64</b>.</p><h4>Reading the answer</h4><p>When nθ lands on a whole multiple of 2π the answer is real and positive; a half turn makes it real and negative; a quarter turn makes it purely imaginary.</p><h4>Common mistake</h4><p>Adding 2π to the modulus instead of to the argument, or forgetting that a negative angle is allowed.</p>"}, "examples": ["cm10", "cm11"], "syllabus_item": "5.5"}, {"h": {"en": "5.3 Roots of a complex number"}, "body": {"en": "<h4>Formula</h4><p>The n roots of z are <b>r^(1/n) cis ((θ + 2kπ)/n)</b> for k = 0, 1, …, n − 1. They sit on a circle of radius r^(1/n), equally spaced.</p><h4>Worked example</h4><p>The fourth roots of 16 = 16 cis 0 are 2 cis 0, 2 cis (π/2), 2 cis π and 2 cis (3π/2), that is <b>2, 2i, −2, −2i</b>.</p><h4>Why equally spaced</h4><p>Each root is the previous one multiplied by cis (2π/n), so the angle steps by 360°/n - here 90°.</p><h4>Common mistake</h4><p>Giving only the principal root. An n-th root question expects n answers, unless the question says 'principal value'.</p>"}, "examples": ["cm19"], "syllabus_item": "5.5"}, {"h": {"en": "5.4 De Moivre inside an equation"}, "body": {"en": "<h4>Example 1: a power</h4><p>(√3 + i)⁴: r = 2 and θ = π/6, so the answer is 16 cis (2π/3) = 16(−1/2 + i√3/2) = <b>−8 + 8√3 i</b>.</p><h4>Example 2: solving z³ = 8</h4><p>Write 8 = 8 cis 0, then z = 2 cis (2kπ/3) for k = 0, 1, 2, giving <b>2, 2ω, 2ω²</b>.</p><h4>The three roots of any cube</h4><p>The roots of z³ = a³ are a, aω and aω², where ω and ω² are the complex cube roots of unity. Recognising this saves the full calculation.</p><h4>Common mistake</h4><p>Solving z³ = 8 and giving only z = 2. The real cube root is one of three complex roots.</p>"}, "examples": ["cm12"], "syllabus_item": "5.5"}]}, {"title": {"en": "6. Square Roots and the Cube Roots of Unity"}, "items": [{"h": {"en": "6.1 The square-root formula"}, "body": {"en": "<h4>Setting it up</h4><p>Let √(a + ib) = x + iy. Squaring gives x² − y² = a and 2xy = b, and also x² + y² = r = √(a² + b²). Adding and subtracting the first and third give the formula.</p><h4>The formula</h4><p><b>√(a + ib) = ±[√((r + a)/2) + i·sign(b)·√((r − a)/2)]</b>, where r = √(a² + b²) and sign(b) is + for b > 0 and − for b < 0.</p><h4>Worked example</h4><p>For 3 + 4i: r = 5, so the real part is √(8/2) = 2 and the imaginary part is √(2/2) = 1. Hence √(3 + 4i) = <b>±(2 + i)</b>.</p><h4>Check</h4><p>(2 + i)² = 4 + 4i − 1 = 3 + 4i, so the answer is right.</p><h4>Common mistake</h4><p>Reporting only the positive root. Every non-zero complex number has two square roots, opposite in sign.</p>"}, "examples": ["cm13"], "syllabus_item": "5.6"}, {"h": {"en": "6.2 More square roots"}, "body": {"en": "<h4>Example 1</h4><p>For 8 − 6i: r = 10, so the real part is √(18/2) = 3 and, since b < 0, the imaginary part is −√(2/2) = −1. The answer is <b>±(3 − i)</b>.</p><h4>Example 2</h4><p>For −5 + 12i: r = 13, so the real part is √(8/2) = 2 and the imaginary part is √(18/2) = 3. The answer is <b>±(2 + 3i)</b>.</p><h4>A shortcut</h4><p>For a number of the form a + ib with a² + b² a perfect square, the root has integer parts - try small values first, then confirm by squaring.</p><h4>Common mistake</h4><p>Using r = a² + b² without the square root, which doubles every answer.</p>"}, "examples": ["cm14", "cm15"], "syllabus_item": "5.6"}, {"h": {"en": "6.3 The cube roots of unity"}, "body": {"en": "<h4>Solving z³ = 1</h4><p>Write 1 = 1 cis 0. Then z = cis (2kπ/3) for k = 0, 1, 2, giving three roots:</p><ul><li><b>1</b> (k = 0)</li><li><b>ω = −1/2 + i√3/2</b> (k = 1, argument 120°)</li><li><b>ω² = −1/2 − i√3/2</b> (k = 2, argument 240°)</li></ul><h4>The picture</h4><p>All three lie on the unit circle and are 120° apart, with 1 on the real axis. Their sum is zero, which is the symmetry you can see in the diagram.</p><h4>Common mistake</h4><p>Writing ω = 1/2 + i√3/2. The real part is negative: −1/2.</p>"}, "diagram": "n4_unity", "examples": ["cm16"], "syllabus_item": "5.6"}, {"h": {"en": "6.4 Working with ω"}, "body": {"en": "<h4>Three facts</h4><ul><li>ω³ = 1</li><li>1 + ω + ω² = 0, so ω² = −1 − ω</li><li>ω and ω² are conjugates, and each is the square of the other</li></ul><h4>Worked example</h4><p>Simplify (1 + ω − ω²)³. Replace ω² by −1 − ω: 1 + ω − ω² = 1 + ω + 1 + ω = 2(1 + ω) = −2ω².</p><p>Cubing: (−2ω²)³ = −8ω⁶ = <b>−8</b>, because ω⁶ = (ω³)² = 1.</p><h4>Why the sum is zero</h4><p>1 + ω + ω² = (ω³ − 1)/(ω − 1) = 0 for ω ≠ 1, since ω³ = 1.</p><h4>Common mistake</h4><p>Substituting ω = 1 to simplify. ω is a specific complex number, not 1; only ω³ is 1.</p>"}, "examples": ["cm17", "cm18"], "syllabus_item": "5.6"}]}, {"title": {"en": "7. Exam Routine and Common Mistakes"}, "items": [{"h": {"en": "7.1 Five steps for any complex-number question"}, "body": {"en": "<h4>The routine</h4><ol><li>Write the given number in the form asked for - a + ib or r cis θ.</li><li>For a power or a root, convert to polar form first.</li><li>Apply De Moivre, or the conjugate trick for a quotient.</li><li>Return to a + ib and simplify the angle to the principal range.</li><li>State modulus and argument separately if the question asks for them.</li></ol><h4>Marks and layout</h4><p>Most schemes award marks for the polar form, the value of rⁿ and the final angle separately, so show the conversion even if the arithmetic is short.</p><h4>Time saver</h4><p>Learn (1 + i)² = 2i, i³ = −i and the three cube roots of unity by heart; between them they cover a large share of the questions.</p>"}, "syllabus_item": "5.6"}, {"h": {"en": "7.2 Mistakes to avoid, and quick checks"}, "body": {"en": "<h4>Six recurring errors</h4><ol><li>Im(3 + 4i) written as 4i instead of 4.</li><li>Using tan⁻¹(b/a) without the quadrant correction.</li><li>Replacing i² by +1 instead of −1.</li><li>Raising the argument to the power instead of multiplying it.</li><li>Giving one square root or one cube root when two or three exist.</li><li>Writing ω = 1 when simplifying expressions in ω.</li></ol><h4>Quick checks</h4><p>Verify a square root by squaring it, verify a quotient by multiplying back, and verify a power by comparing the modulus (rⁿ) with the size of the answer.</p><details class=\"self-check\"><summary>Why does a complex power sometimes come out real?</summary><p>Because the new argument nθ is a multiple of π, so the sine term vanishes and only the cosine term survives.</p></details>"}, "syllabus_item": "5.6"}]}, {"title": {"en": "8. Practice Questions with Model Answers"}, "items": [{"h": {"en": "Practice 1. Simplify i²¹ + i³⁶."}, "body": {"en": "<p>Reduce each power modulo 4: 21 = 4 × 5 + 1, so i²¹ = i¹ = i.</p><p>36 = 4 × 9, so i³⁶ = (i⁴)⁹ = 1, because any power of i⁴ is 1.</p><p>The sum is i + 1 = 1 + i, which is already in the standard form a + ib with a = 1 and b = 1.</p>"}}, {"h": {"en": "Practice 2. Find x and y if (x − 2) + (y + 5)i = 3 − 2i."}, "body": {"en": "<p>Equate the real parts: x − 2 = 3, so x = 5.</p><p>Equate the imaginary parts: y + 5 = −2, so y = −7.</p><p>Answer: x = 5, y = −7. One complex equation gives two real equations, which is why two unknowns can be found.</p>"}}, {"h": {"en": "Practice 3. For z₁ = 4 − 3i and z₂ = −2 + 5i, find z₁ + z₂ and z₁z₂."}, "body": {"en": "<p>Sum: (4 − 2) + (−3 + 5)i = 2 + 2i.</p><p>Product: (4 − 3i)(−2 + 5i) = −8 + 20i + 6i − 15i² = −8 + 26i + 15.</p><p>So z₁z₂ = 7 + 26i, and both answers are in the standard form a + ib.</p>"}}, {"h": {"en": "Practice 4. Divide (2 + 3i) by (4 − i)."}, "body": {"en": "<p>Multiply top and bottom by the conjugate 4 + i.</p><p>Denominator: (4 − i)(4 + i) = 16 + 1 = 17.</p><p>Numerator: (2 + 3i)(4 + i) = 8 + 2i + 12i + 3i² = 5 + 14i.</p><p>The quotient is (5 + 14i)/17 = 5/17 + (14/17)i.</p>"}}, {"h": {"en": "Practice 5. Find the conjugate and modulus of z = 6 − 8i."}, "body": {"en": "<p>The conjugate flips the imaginary part: z̄ = 6 + 8i.</p><p>The modulus is √(6² + 8²) = √100 = 10.</p><p>Check: z z̄ = 36 + 64 = 100 = |z|², which confirms both numbers.</p>"}}, {"h": {"en": "Practice 6. Express −1 − i in polar form."}, "body": {"en": "<p>Modulus: r = √(1 + 1) = √2.</p><p>The point (−1, −1) is in the third quadrant, and α = tan⁻¹(1) = π/4, so θ = −(π − π/4) = −3π/4.</p><p>Hence −1 − i = √2 cis (−3π/4), equivalently √2 cis (5π/4) with a positive angle.</p>"}}, {"h": {"en": "Practice 7. Express 2 + 2√3 i in polar form."}, "body": {"en": "<p>Modulus: r = √(4 + 12) = 4.</p><p>The point is in the first quadrant and tan θ = 2√3/2 = √3, so θ = π/3.</p><p>Therefore 2 + 2√3 i = 4 cis (π/3), and converting back gives 4(1/2 + i√3/2) = 2 + 2√3 i, which checks the answer.</p>"}}, {"h": {"en": "Practice 8. Evaluate (1 − i)⁶ using De Moivre's theorem."}, "body": {"en": "<p>Polar form: r = √2 and θ = −π/4, so 1 − i = √2 cis (−π/4).</p><p>De Moivre: (√2)⁶ cis (6 × (−π/4)) = 8 cis (−3π/2).</p><p>cos(−3π/2) = 0 and sin(−3π/2) = 1, so the value is 8i - purely imaginary.</p>"}}, {"h": {"en": "Practice 9. Evaluate (1 + i√3)⁶."}, "body": {"en": "<p>Modulus r = √(1 + 3) = 2 and θ = tan⁻¹(√3) = π/3, so z = 2 cis (π/3).</p><p>Then z⁶ = 2⁶ cis (6 × π/3) = 64 cis 2π.</p><p>A full turn brings the point back to the real axis, so the answer is 64.</p>"}}, {"h": {"en": "Practice 10. Evaluate (1 − i)⁴."}, "body": {"en": "<p>Square first: (1 − i)² = 1 − 2i + i² = −2i.</p><p>Square again: (−2i)² = 4i² = −4.</p><p>So (1 − i)⁴ = −4, a real number, which matches De Moivre with the angle −π making a half turn.</p>"}}, {"h": {"en": "Practice 11. Find the square roots of 8 + 6i."}, "body": {"en": "<p>Here a = 8, b = 6 and r = √(64 + 36) = 10.</p><p>Real part: √((10 + 8)/2) = √9 = 3. Imaginary part: √((10 − 8)/2) = 1, positive since b > 0.</p><p>The roots are ±(3 + i). Check: (3 + i)² = 9 + 6i − 1 = 8 + 6i.</p>"}}, {"h": {"en": "Practice 12. Find the square roots of −15 − 8i."}, "body": {"en": "<p>Here a = −15, b = −8 and r = √(225 + 64) = 17.</p><p>Real part: √((17 − 15)/2) = 1. Imaginary part: −√((17 + 15)/2) = −4, negative because b < 0.</p><p>The roots are ±(1 − 4i). Check: (1 − 4i)² = 1 − 8i + 16i² = −15 − 8i.</p>"}}, {"h": {"en": "Practice 13. Solve z³ = 1 and verify that the three roots add to zero."}, "body": {"en": "<p>Writing 1 = 1 cis 0, the roots are cis (2kπ/3) for k = 0, 1, 2, that is 1, ω = −1/2 + i√3/2 and ω² = −1/2 − i√3/2.</p><p>Sum of the real parts: 1 − 1/2 − 1/2 = 0. Sum of the imaginary parts: √3/2 − √3/2 = 0.</p><p>So 1 + ω + ω² = 0, as expected from (ω³ − 1)/(ω − 1) = 0. Each root also has modulus 1 and they are 120° apart.</p>"}}, {"h": {"en": "Practice 14. Simplify (1 + ω − ω²)³, where ω³ = 1 and 1 + ω + ω² = 0."}, "body": {"en": "<p>Use ω² = −1 − ω: then 1 + ω − ω² = 1 + ω + 1 + ω = 2(1 + ω).</p><p>But 1 + ω = −ω², so the bracket equals −2ω².</p><p>Cubing: (−2ω²)³ = −8ω⁶ = −8(ω³)² = −8, because ω³ = 1.</p>"}}, {"h": {"en": "Practice 15. Find all cube roots of 27."}, "body": {"en": "<p>Write 27 = 27 cis 0, so the cube roots are 3 cis (2kπ/3) for k = 0, 1, 2.</p><p>That gives 3, 3ω and 3ω², with ω = −1/2 + i√3/2.</p><p>Explicitly: 3, −3/2 + (3√3/2)i and −3/2 − (3√3/2)i. Each has modulus 3 and they are 120° apart; cubing any of them returns 27.</p>"}}]}], "diagrams": [{"id": "n1_argand", "title": {"en": "The Argand diagram"}, "file": "diagrams/n1_argand.svg"}, {"id": "n2_arg", "title": {"en": "The argument depends on the quadrant"}, "file": "diagrams/n2_arg.svg"}, {"id": "n3_polar", "title": {"en": "Polar form: multiply or rotate"}, "file": "diagrams/n3_polar.svg"}, {"id": "n4_unity", "title": {"en": "The three cube roots of unity"}, "file": "diagrams/n4_unity.svg"}, {"id": "n5_demoivre", "title": {"en": "De Moivre in four lines"}, "file": "diagrams/n5_demoivre.svg"}], "equations": [{"title": {"en": "Definitions and algebra"}, "items": [{"terms": {"en": "Imaginary unit"}, "a": {"en": "i = √(−1),  i² = −1"}}, {"terms": {"en": "Complex number"}, "a": {"en": "z = a + ib,  a = Re z,  b = Im z"}}, {"terms": {"en": "Equality"}, "a": {"en": "a + ib = c + id  ⇔  a = c and b = d"}}, {"terms": {"en": "Addition"}, "a": {"en": "(a + ib) ± (c + id) = (a ± c) + i(b ± d)"}}, {"terms": {"en": "Multiplication"}, "a": {"en": "(a + ib)(c + id) = (ac − bd) + i(ad + bc)"}}, {"terms": {"en": "Powers of i"}, "a": {"en": "i¹ = i, i² = −1, i³ = −i, i⁴ = 1, repeating"}}]}, {"title": {"en": "Conjugate, modulus, polar form"}, "items": [{"terms": {"en": "Conjugate"}, "a": {"en": "z̄ = a − ib ;  z z̄ = a² + b²"}}, {"terms": {"en": "Modulus"}, "a": {"en": "|z| = √(a² + b²) ;  |z₁z₂| = |z₁||z₂|"}}, {"terms": {"en": "Inverse"}, "a": {"en": "z⁻¹ = z̄/|z|²"}}, {"terms": {"en": "Polar form"}, "a": {"en": "z = r(cos θ + i sin θ) = r cis θ"}}, {"terms": {"en": "Argument"}, "a": {"en": "θ = tan⁻¹(b/a) adjusted for the quadrant, −π < θ ≤ π"}}, {"terms": {"en": "Product and quotient"}, "a": {"en": "r₁r₂ cis (θ₁ + θ₂) ;  (r₁/r₂) cis (θ₁ − θ₂)"}}]}, {"title": {"en": "De Moivre and roots"}, "items": [{"terms": {"en": "De Moivre"}, "a": {"en": "(r cis θ)ⁿ = rⁿ cis (nθ)"}}, {"terms": {"en": "n-th roots"}, "a": {"en": "r^(1/n) cis ((θ + 2kπ)/n),  k = 0, 1, …, n − 1"}}, {"terms": {"en": "Square root"}, "a": {"en": "√(a + ib) = ±[√((r + a)/2) + i·sign(b)√((r − a)/2)]"}}, {"terms": {"en": "Cube roots of unity"}, "a": {"en": "1, ω = −1/2 + i√3/2, ω² = −1/2 − i√3/2"}}, {"terms": {"en": "Properties of ω"}, "a": {"en": "ω³ = 1 and 1 + ω + ω² = 0"}}, {"terms": {"en": "Roots of z³ = a³"}, "a": {"en": "a, aω, aω²"}}]}], "numericals": [{"id": "cm1", "q": {"en": "Simplify i¹⁵."}, "a": {"en": "<p>Write the exponent as 4 × 3 + 3, so i¹⁵ = (i⁴)³ · i³.</p><p>Since i⁴ = 1 and i³ = −i, the value is 1 × (−i) = −i.</p><p>The powers of i repeat every four, so only the remainder on division by 4 matters.</p>"}}, {"id": "cm2", "q": {"en": "Find x and y if (x + 2) + (y − 3)i = 5 + 4i."}, "a": {"en": "<p>Equate the real parts: x + 2 = 5, so x = 3.</p><p>Equate the imaginary parts: y − 3 = 4, so y = 7.</p><p>Two complex numbers are equal only when both parts agree, which is why one equation gives two real conditions.</p>"}}, {"id": "cm3", "q": {"en": "Add and subtract 5 − 2i and −3 + 4i."}, "a": {"en": "<p>Add the real parts and the imaginary parts separately: (5 − 3) + (−2 + 4)i = 2 + 2i.</p><p>Subtract: (5 + 3) + (−2 − 4)i = 8 − 6i.</p><p>On the Argand diagram the sum is the diagonal of the parallelogram on the two arrows.</p>"}}, {"id": "cm4", "q": {"en": "Multiply (3 + 2i)(4 − 5i)."}, "a": {"en": "<p>Expand: 12 − 15i + 8i − 10i².</p><p>Use i² = −1, so −10i² = +10: the expression becomes 12 − 7i + 10.</p><p>The answer is 22 − 7i, with real part 22 and imaginary part −7.</p>"}}, {"id": "cm5", "q": {"en": "Divide (1 + 2i) by (3 − 4i)."}, "a": {"en": "<p>Multiply top and bottom by the conjugate 3 + 4i.</p><p>Denominator: (3 − 4i)(3 + 4i) = 9 + 16 = 25. Numerator: (1 + 2i)(3 + 4i) = 3 + 4i + 6i + 8i² = −5 + 10i.</p><p>So the quotient is (−5 + 10i)/25 = −1/5 + (2/5)i.</p>"}}, {"id": "cm6", "q": {"en": "Find the conjugate and the modulus of z = 3 − 4i."}, "a": {"en": "<p>The conjugate keeps the real part and flips the imaginary part: z̄ = 3 + 4i.</p><p>The modulus is the distance from the origin: |z| = √(3² + (−4)²) = √25 = 5.</p><p>Check with the product: z z̄ = 9 + 16 = 25 = |z|², as the theory requires.</p>"}}, {"id": "cm7", "q": {"en": "Find the modulus and argument of z = −1 + i√3."}, "a": {"en": "<p>Modulus: |z| = √(1 + 3) = 2.</p><p>The point (−1, √3) lies in the second quadrant, and α = tan⁻¹(√3) = π/3.</p><p>For the second quadrant θ = π − α = π − π/3 = 2π/3.</p><p>So z = 2 cis (2π/3).</p>"}}, {"id": "cm8", "q": {"en": "Express 1 + i in polar form."}, "a": {"en": "<p>Modulus: r = √(1 + 1) = √2.</p><p>The point (1, 1) is in the first quadrant, so θ = tan⁻¹(1) = π/4.</p><p>Hence 1 + i = √2 (cos π/4 + i sin π/4) = √2 cis (π/4).</p>"}}, {"id": "cm9", "q": {"en": "Express −3 − 3i in polar form."}, "a": {"en": "<p>Modulus: r = √(9 + 9) = √18 = 3√2.</p><p>The point is in the third quadrant and α = tan⁻¹(1) = π/4, so θ = −(π − π/4) = −3π/4.</p><p>Hence z = 3√2 cis (−3π/4), the same angle as 5π/4 if a positive argument is preferred.</p>"}}, {"id": "cm10", "q": {"en": "Evaluate (1 + i)⁸ using De Moivre's theorem."}, "a": {"en": "<p>Polar form: 1 + i = √2 cis (π/4).</p><p>De Moivre: (√2 cis π/4)⁸ = (√2)⁸ cis (8 × π/4) = 16 cis 2π.</p><p>Since cos 2π = 1 and sin 2π = 0, the answer is 16.</p>"}}, {"id": "cm11", "q": {"en": "Evaluate (1 − i√3)⁶."}, "a": {"en": "<p>Modulus √(1 + 3) = 2, and the fourth-quadrant angle is θ = −π/3, so z = 2 cis (−π/3).</p><p>De Moivre gives 2⁶ cis (−6π/3) = 64 cis (−2π).</p><p>A full turn gives cos(−2π) = 1 and sin(−2π) = 0, so the answer is 64.</p>"}}, {"id": "cm12", "q": {"en": "Evaluate (√3 + i)⁴."}, "a": {"en": "<p>Modulus √(3 + 1) = 2 and θ = tan⁻¹(1/√3) = π/6, so z = 2 cis (π/6).</p><p>Then z⁴ = 16 cis (4π/6) = 16 cis (2π/3).</p><p>Now cos 2π/3 = −1/2 and sin 2π/3 = √3/2, so the answer is −8 + 8√3 i.</p>"}}, {"id": "cm13", "q": {"en": "Find the square roots of 3 + 4i."}, "a": {"en": "<p>Here a = 3, b = 4, r = √(9 + 16) = 5.</p><p>Real part: √((r + a)/2) = √(8/2) = 2. Imaginary part: √((r − a)/2) = √(2/2) = 1, positive because b > 0.</p><p>So √(3 + 4i) = ±(2 + i). Check: (2 + i)² = 4 + 4i − 1 = 3 + 4i.</p>"}}, {"id": "cm14", "q": {"en": "Find the square roots of 8 − 6i."}, "a": {"en": "<p>a = 8, b = −6, so r = √(64 + 36) = 10.</p><p>Real part: √((10 + 8)/2) = √9 = 3. Since b < 0 the imaginary part is negative: −√((10 − 8)/2) = −1.</p><p>The roots are ±(3 − i). Check: (3 − i)² = 9 − 6i − 1 = 8 − 6i.</p>"}}, {"id": "cm15", "q": {"en": "Find the square roots of −5 + 12i."}, "a": {"en": "<p>a = −5, b = 12, so r = √(25 + 144) = 13.</p><p>Real part: √((13 − 5)/2) = √4 = 2. Imaginary part: √((13 + 5)/2) = √9 = 3, positive because b > 0.</p><p>The roots are ±(2 + 3i). Check: (2 + 3i)² = 4 + 12i − 9 = −5 + 12i.</p>"}}, {"id": "cm16", "q": {"en": "Solve z³ = 1 and write all three roots."}, "a": {"en": "<p>Write 1 = 1 cis 0. By De Moivre the roots are z = cis (2kπ/3) for k = 0, 1, 2.</p><p>k = 0 gives 1; k = 1 gives cis (2π/3) = −1/2 + i√3/2 = ω; k = 2 gives cis (4π/3) = −1/2 − i√3/2 = ω².</p><p>All three lie on the unit circle at 120° intervals, and their sum is 1 + ω + ω² = 0.</p>"}}, {"id": "cm17", "q": {"en": "Simplify (1 + ω²)³, where ω is a complex cube root of unity."}, "a": {"en": "<p>From 1 + ω + ω² = 0 we get ω² = −1 − ω, so 1 + ω² = −ω.</p><p>Cubing: (−ω)³ = −ω³.</p><p>Since ω³ = 1, the value is −1.</p>"}}, {"id": "cm18", "q": {"en": "Simplify (1 + ω − ω²)³."}, "a": {"en": "<p>Replace ω² by −1 − ω: 1 + ω − ω² = 1 + ω + 1 + ω = 2 + 2ω = 2(1 + ω).</p><p>But 1 + ω = −ω², so the bracket is −2ω².</p><p>Cubing: (−2ω²)³ = −8ω⁶, and ω⁶ = (ω³)² = 1, so the value is −8.</p>"}}, {"id": "cm19", "q": {"en": "Find all fourth roots of 16."}, "a": {"en": "<p>Write 16 = 16 cis 0, then the roots are 16^(1/4) cis (2kπ/4) = 2 cis (kπ/2) for k = 0, 1, 2, 3.</p><p>k = 0 gives 2, k = 1 gives 2i, k = 2 gives −2 and k = 3 gives −2i.</p><p>They lie on the circle of radius 2 at 90° intervals, so each is the previous one multiplied by i.</p>"}}, {"id": "cm20", "q": {"en": "Find the real and imaginary parts of (1 + i)⁶."}, "a": {"en": "<p>Use (1 + i)² = 2i, so (1 + i)⁶ = (2i)³ = 8i³.</p><p>Since i³ = −i, the value is −8i.</p><p>Therefore the real part is 0 and the imaginary part is −8: the number is purely imaginary.</p>"}}], "viva": [{"title": {"en": "Basics"}, "items": [{"q": {"en": "What is a complex number?"}, "a": {"en": "A number of the form a + ib with a and b real; a is the real part and b the imaginary part."}}, {"q": {"en": "Why do we need complex numbers?"}, "a": {"en": "Because equations such as x² + 1 = 0 have no real root, and rotations, AC circuits and vibrations are described most simply with them."}}, {"q": {"en": "What is the value of i²?"}, "a": {"en": "−1, since i = √(−1)."}}, {"q": {"en": "What is the imaginary part of 3 + 4i?"}, "a": {"en": "4 - the imaginary part is the real coefficient b, not 4i."}}, {"q": {"en": "How many complex roots does z³ = 1 have?"}, "a": {"en": "Three: 1, ω and ω², all on the unit circle 120° apart."}}, {"q": {"en": "Can two complex numbers be compared as larger or smaller?"}, "a": {"en": "No - the complex numbers have no order, although their moduli can be compared."}}]}, {"title": {"en": "Conjugate, modulus, polar form"}, "items": [{"q": {"en": "Define the conjugate of z = a + ib."}, "a": {"en": "z̄ = a − ib, the reflection of z in the real axis."}}, {"q": {"en": "What is z z̄?"}, "a": {"en": "a² + b² = |z|², a non-negative real number."}}, {"q": {"en": "Define the modulus and give its geometric meaning."}, "a": {"en": "|z| = √(a² + b²), the distance of the point (a, b) from the origin."}}, {"q": {"en": "Write the inverse of z in terms of the conjugate."}, "a": {"en": "z⁻¹ = z̄/|z|², valid for every z ≠ 0."}}, {"q": {"en": "How is division of complex numbers performed?"}, "a": {"en": "Multiply the numerator and denominator by the conjugate of the denominator, so the denominator becomes real."}}, {"q": {"en": "How do you find the argument of a complex number?"}, "a": {"en": "Take α = tan⁻¹|b/a| and then adjust for the quadrant: θ = α, π − α, −(π − α) or −α."}}]}, {"title": {"en": "De Moivre and roots"}, "items": [{"q": {"en": "State De Moivre's theorem."}, "a": {"en": "(r cis θ)ⁿ = rⁿ cis (nθ) for any integer n."}}, {"q": {"en": "How do you multiply two numbers in polar form?"}, "a": {"en": "Multiply the moduli and add the arguments: r₁r₂ cis (θ₁ + θ₂)."}}, {"q": {"en": "How many n-th roots does a non-zero complex number have?"}, "a": {"en": "Exactly n, equally spaced on a circle of radius r^(1/n)."}}, {"q": {"en": "What are the cube roots of unity?"}, "a": {"en": "1, ω = −1/2 + i√3/2 and ω² = −1/2 − i√3/2."}}, {"q": {"en": "Why is 1 + ω + ω² = 0?"}, "a": {"en": "Because ω³ = 1 and ω ≠ 1, so 1 + ω + ω² = (ω³ − 1)/(ω − 1) = 0."}}, {"q": {"en": "How do you find the square root of a + ib?"}, "a": {"en": "Let it be x + iy; use x² − y² = a, 2xy = b and x² + y² = r to obtain x = √((r + a)/2) and y = ±√((r − a)/2)."}}]}], "exam_questions": [{"q": {"en": "Practice: Simplify i²¹ + i³⁶."}, "marks": 3}, {"q": {"en": "Practice: Find x and y if (x − 2) + (y + 5)i = 3 − 2i."}, "marks": 3}, {"q": {"en": "Practice: For z₁ = 4 − 3i and z₂ = −2 + 5i, find z₁ + z₂ and z₁z₂."}, "marks": 4}, {"q": {"en": "Practice: Divide (2 + 3i) by (4 − i)."}, "marks": 4}, {"q": {"en": "Practice: Find the conjugate and modulus of z = 6 − 8i."}, "marks": 3}, {"q": {"en": "Practice: Express −1 − i in polar form."}, "marks": 4}, {"q": {"en": "Practice: Express 2 + 2√3 i in polar form."}, "marks": 4}, {"q": {"en": "Practice: Evaluate (1 − i)⁶ using De Moivre's theorem."}, "marks": 4}, {"q": {"en": "Practice: Evaluate (1 + i√3)⁶."}, "marks": 4}, {"q": {"en": "Practice: Evaluate (1 − i)⁴."}, "marks": 3}, {"q": {"en": "Practice: Find the square roots of 8 + 6i."}, "marks": 4}, {"q": {"en": "Practice: Find the square roots of −15 − 8i."}, "marks": 4}, {"q": {"en": "Practice: Solve z³ = 1 and verify that the three roots add to zero."}, "marks": 4}, {"q": {"en": "Practice: Simplify (1 + ω − ω²)³, where ω³ = 1 and 1 + ω + ω² = 0."}, "marks": 4}, {"q": {"en": "Practice: Find all cube roots of 27."}, "marks": 4}], "learning_outcomes": [{"en": "CO5: Represent complex numbers algebraically and geometrically for solving engineering related problems."}], "course_outcomes": ["CO5"], "practical_numbers": [], "content_kind": "theory", "lesson_count": 26, "answered_practice_count": 15, "assessment_note": {"en": "Official course: theory ESE 70 + PA 30 = 100 marks, 4 credits, 45 teaching hours; this unit carries 20 % weightage and about 14 of the 70 theory marks. Practice-question marks (3/4) are suggested revision sizes, not official GTU allocations or a guaranteed paper pattern. Model answers are in Notes section 8."}, "question_provenance": "Original answered revision questions; not official past papers", "question_marks_are_suggested": true, "sources": [{"title": "GTU DI02000021, Engineering Mathematics, Semester 2, BSC (uploaded syllabus)", "url": "https://syllabus.gtu.ac.in/"}, {"title": "Khan Academy - complex numbers: algebra, polar form and De Moivre", "url": "https://www.khanacademy.org/math/precalculus/x9e81a4f98389efdf:complex"}, {"title": "OpenStax - Algebra and Trigonometry, chapter 10 (Complex Numbers in Polar Form)", "url": "https://openstax.org/details/books/algebra-and-trigonometry"}, {"title": "GeoGebra - Argand diagram with modulus and argument", "url": "https://www.geogebra.org/m/k3xVjKzT"}, {"title": "B. S. Grewal - Elementary Engineering Mathematics (Khanna Publishers)", "url": "https://www.khannapublishers.in/"}]};
const SVG = {"n1_argand": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 386\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"386\" fill=\"#ffffff\"/><text x=\"180\" y=\"28.9\" font-size=\"14\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">The Argand diagram</text><text x=\"180\" y=\"49.6\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">a + ib is the point (a, b)</text><path d=\"M40 250 H330\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M150 260 V100\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"324\" y=\"245.4\" font-size=\"9.6\" text-anchor=\"end\" fill=\"#333\" font-weight=\"normal\">real</text><text x=\"158\" y=\"111.4\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#333\" font-weight=\"normal\">imaginary</text><path d=\"M150 250 L210.0 170.0\" fill=\"none\" stroke=\"#1565C0\" stroke-width=\"2.0\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M150 250 L210.0 250 M210.0 250 L210.0 170.0\" fill=\"none\" stroke=\"#1565C0\" stroke-width=\"1.0\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-dasharray=\"3 3\"/><circle cx=\"210.0\" cy=\"170.0\" r=\"3.6\" fill=\"#1565C0\"/><text x=\"218\" y=\"167.3\" font-size=\"9.4\" text-anchor=\"start\" fill=\"#1565C0\" font-weight=\"normal\">3 + 4i</text><path d=\"M150 250 L110.0 210.0\" fill=\"none\" stroke=\"#2E7D32\" stroke-width=\"2.0\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M150 250 L110.0 250 M110.0 250 L110.0 210.0\" fill=\"none\" stroke=\"#2E7D32\" stroke-width=\"1.0\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-dasharray=\"3 3\"/><circle cx=\"110.0\" cy=\"210.0\" r=\"3.6\" fill=\"#2E7D32\"/><text x=\"101\" y=\"215.3\" font-size=\"9.4\" text-anchor=\"end\" fill=\"#2E7D32\" font-weight=\"normal\">−2 + 2i</text><text x=\"172\" y=\"181.3\" f }
function diagrams(){
  return `<div class="sec">${head(L((U.tabs ? U.tabs.includes('flowcharts')&&!U.tabs.includes('diagrams') : U.programs&&META.code_lang!=='python')?'flowcharts':'diagrams'),false)}<div style="height:10px"></div>` + U.diagrams.map((d,i)=>
    `<div class="dcard" data-dg="${d.id}"><div class="h">${i+1}. ${t(d.title)}</div>${SVG[d.id]}</div>`).join('') + `</div>`;
}
function equations(){
  return U.equations.map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><span class="fbox">${e.f}</span></span>${chev}</div>
     <div class="a"><p>${t(e.terms)}</p></div></div>`).join('') + `</div>`).join('');
}
function viva(){
  // two shapes exist in the corpus: flat [{q,a}] and grouped [{title, items:[{q,a}]}]
  const groups = U.viva.every(v=>v && v.q) ? [{items: U.viva}] : U.viva;
  return groups.map(g=>{
    const items = g.items || [];
    return `<div class="sec">${g.title?head(t(g.title)):''}` + items.map((v,i)=>
      `<div class="card"><div class="q hd"><span class="n">${i+1}.</span><span class="t">${t(v.q)}</span>${chev}</div><div class="a"><p>${t(v.a)}</p></div></div>`).join('') + `</div>`;
  }).join('');
}
function exam(){
  return `<div class="sec">${head(L('examhead'),false)}` + U.exam_questions.map((x,i)=>
    `<div class="card"><div class="q" style="cursor:default"><span class="n">${i+1}.</span><span class="t">${t(x.q)}</span><span class="mk">${x.marks} ${L('marks')}</span></div></div>`).join('') + `</div>`;
}
function programs(){
  return `<div class="sec">${head(L('programs'))}` + (U.programs||[]).map((p,i)=>
    `<div class="card"><div class="q hd"><span class="n">${i+1}.</span><span class="t">${t(p.title)}</span>${chev}</div><div class="a pa">${progBody(p)}</div></div>`).join('') + `</div>`;
}
function syntax(key){
  return (U[typeof key==='string'?key:'syntax']||[]).map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><pre class="code sx">${hl(e.f)}</pre></span>${chev}</div>
     <div class="a">${e.terms && t(e.terms) ? fixTables(t(e.terms)) : ''}</div></div>`).join('') + `</div>`).join('');
}
const flowcharts = diagrams;
const algorithms = () => syntax('algorithms');
const ALLV = {notes, programs, diagrams, flowcharts, algorithms, syntax, equations, numericals, viva, exam};
const VIEWS = U.tabs ? Object.fromEntries(U.tabs.map(k=>[k, ALLV[k]])) : U.programs ? (META.code_lang==='python' ? {notes, programs, diagrams, syntax, viva, exam} : {notes, programs, flowcharts, syntax, viva, exam}) : U.numericals ? {notes, diagrams, equations, numericals, viva, exam} : {notes, diagrams, equations, viva, exam};
function render(){
  document.getElementById('title').textContent = `${L('unit')} ${U.unit}: ${t(U.title)}`;
  document.getElementById('sub').textContent = `${t(META.name)} · ${META.code}`;
  document.getElementById('lang').textContent = S.lang==='en' ? 'ગુ' : 'EN';
  document.getElementById('lang').style.display = META.languages.includes('gu') ? '' : 'none';
  document.getElementById('tabs').innerHTML = Object.keys(VIEWS).map(k=>`<button class="tab${S.tab===k?' on':''}" data-tab="${k}">${L(k)}</button>`).join('');
  document.getElementById('view').innerHTML = VIEWS[S.tab]();
  document.querySelectorAll('#view pre.c').forEach(e=>{ e.innerHTML = hl(e.textContent); e.className='code'; });
}
let zoom = 1;
function setZoom(z){ zoom = Math.min(4, Math.max(1, z)); const w=document.getElementById('zw'); w.style.width=(zoom*100)+'%'; document.getElementById('zr').textContent=Math.round(zoom*100)+'%'; }
document.addEventListener('click', e=>{
  const q = e.target.closest('.q'); if (q && q.parentElement.querySelector('.a')) { q.parentElement.classList.toggle('open'); return; }
  const tb = e.target.closest('[data-tab]'); if (tb){ S.tab = tb.dataset.tab; render(); window.scrollTo(0,0); return; }
  if (e.target.closest('#lang')){ S.lang = S.lang==='en'?'gu':'en'; render(); return; }
  const m = e.target.closest('[data-more]');
  document.querySelectorAll('.menu.show').forEach(x=>{ if(!m || x!==m.nextElementSibling) x.classList.remove('show'); });
  if (m){ m.nextElementSibling.classList.toggle('show'); return; }
  const act = e.target.closest('[data-act]');
  if (act){ act.closest('.sec').querySelectorAll('.card').forEach(c=>{ if(c.querySelector('.a')) c.classList.toggle('open', act.dataset.act==='expand'); }); act.parentElement.classList.remove('show'); return; }
  const dg = e.target.closest('[data-dg]');
  if (dg){ const id=dg.dataset.dg; document.getElementById('mt').textContent=t(U.diagrams.find(d=>d.id===id).title); document.getElementById('zw').innerHTML=SVG[id]; setZoom(1); document.getElementById('modal').classList.add('show'); return; }
  if (e.target.closest('#mx')) document.getElementById('modal').classList.remove('show');
  if (e.target.closest('#zi')) setZoom(zoom+0.5);
  if (e.target.closest('#zo')) setZoom(zoom-0.5);
  if (e.target.closest('#zr')) setZoom(1);
});
render();
</script></body></html>
