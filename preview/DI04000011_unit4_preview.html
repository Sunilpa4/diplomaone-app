.kw{color:#C792EA;font-weight:700}.ty{color:#82AAFF}.st{color:#C3E88D}.cm{color:#8E9AAF;font-style:italic}.pp{color:#F78C6C}.nu{color:#F9C46B}.fn{color:#FFCB6B}

<script>
const U = {"subject": "DI04000011", "unit": 4, "format": "notes", "title": {"en": "Coding and Testing"}, "weightage": 20, "hours": 8, "notes": [{"title": {"en": "4.1 Coding: Standards, Reviews and Documentation"}, "items": [{"h": {"en": "Coding Standards and Guidelines"}, "body": {"en": "\n<ul><li>The coding phase translates the detailed design into source code a machine can run - and humans can still <b>read, debug and modify</b> for years.</li>\n<li><b>Coding standards</b> are mandatory rules a team imposes: naming conventions (camelCase for methods, ALL_CAPS for constants), a fixed indentation/layout style, rules for comment density, allowed error-handling style, limits on global variables and <b>no GOTOs</b>.</li>\n<li><b>Coding guidelines</b> are softer advice: write code for the reader first; keep functions small; avoid obscure tricks; check return values; keep side-effects out of expressions.</li>\n<li><b>Why they matter</b>: code is read 10x more often than it is written. Uniform style means any team member can maintain any module, reviews go faster, and common bug classes (dangling pointers, unchecked inputs) are designed out.</li>\n<li>Tool support: linters and IDE formatters enforce standards automatically - the rule is debated once, then never again.</li></ul>\n"}, "diagram": "se4_standards"}, {"h": {"en": "Code Review: Walkthrough and Inspection"}, "body": {"en": "\n<ul><li><b>Static verification</b>: humans examine a work product (code, design, SRS) <b>before it runs</b>. Eyeballs find defects testing can only reach much later - and for about 1/100th of the repair cost.</li>\n<li><b>Code walkthrough</b>: informal. The author walks the team through the code line by line, narrating intent; members raise questions and spot issues. Author leads, preparation is light, output is discussion and comments.</li>\n<li><b>Code inspection</b>: formal (Fagan). Defined roles - moderator, author, readers, recorder - each member prepares with <b>checklists</b> (uninitialised variables? array bounds? null handling?), the meeting logs every defect, and fixes are verified later. Goal: <b>find defects now</b>, not share knowledge.</li>\n<li>Difference table (exam favourite): walkthrough = author-led, informal, little preparation, knowledge sharing; inspection = moderator-led, highly formal, checklist preparation, defect log.</li>\n<li>Reviews apply to every phase product - SRS review and design review catch errors where they are cheapest.</li></ul>\n"}, "diagram": "se4_review"}, {"h": {"en": "Internal and External Documentation"}, "body": {"en": "\n<ul><li><b>Internal documentation</b> lives inside the code: header comments per class and module (purpose, author, date, change log), comments explaining <i>why</i> (the <i>what</i> is the code's job), meaningful identifiers, and doc-strings that tools turn into API docs.</li>\n<li><b>External documentation</b> lives beside the code: user manual, installation guide, SRS and design documents, API reference, maintenance manual.</li>\n<li>Audience split: internal serves the <b>next developer</b> (future you), external serves <b>users, testers and reviewers</b>.</li>\n<li>Documentation is a <b>deliverable, not an afterthought</b>: an undocumented program is unmaintainable no matter how clever, and untestable by anyone but its author.</li>\n<li>Rule of thumb: comment the intent (\"retry once because the bus API drops connections\"), not the mechanics (\"increment i by 1\").</li></ul>\n"}, "diagram": "se4_docs"}]}, {"title": {"en": "4.2 Testing Fundamentals"}, "items": [{"h": {"en": "Why Test, V&V, and the Psychology of Testing"}, "body": {"en": "\n<ul><li><b>Objective of testing</b> (Myers): testing is the process of executing a program <b>with the intent of finding errors</b>. A successful test is one that <b>finds a fault</b> - not one that passes.</li>\n<li>Testing shows the <b>presence</b> of bugs, never their absence (Dijkstra) - so we test as thoroughly as budget allows, prioritising risky areas.</li>\n<li>Vocabulary: <b>error</b> = human mistake; <b>fault/defect/bug</b> = the flaw written into the software; <b>failure</b> = observed wrong behaviour at run time.</li>\n<li><b>Verification</b>: are we building the product right? (reviews, walkthroughs - checks against the previous phase's spec). <b>Validation</b>: are we building the right product? (testing against requirements - does it satisfy the customer?).</li>\n<li>Psychology: developers should not be the sole judges of their own code - independent testers adopt a defect-hunting mindset the author cannot.</li></ul>\n"}}, {"h": {"en": "Levels of Testing: Unit, Integration, System, Acceptance"}, "body": {"en": "\n<ul><li><b>Unit testing</b>: each module/function in isolation. Done by the developer, white-box flavoured, cheapest place to catch faults. Frameworks: JUnit for Java.</li>\n<li><b>Integration testing</b>: modules wired together - tests the <b>interfaces</b>. Incremental strategies (top-down with stubs, bottom-up with drivers) beat big-bang because a failure points at a small set of suspects.</li>\n<li><b>System testing</b>: the whole built product against the SRS - functionality plus performance, security, recovery, load. Black-box; the test team owns it.</li>\n<li><b>Acceptance testing</b>: the customer's verdict - is this the right product? Alpha and beta are its two classic forms (next section).</li>\n<li>Read the pyramid bottom-up: cheap and narrow below, realistic and costly above; faults found late cost orders of magnitude more to repair.</li></ul>\n"}, "diagram": "se4_levels"}]}, {"title": {"en": "4.3 Black-Box Testing"}, "items": [{"h": {"en": "Black-Box Techniques (Specification-Based)"}, "body": {"en": "\n<ul><li>Test from the <b>specification only</b> - the code is an opaque box. We feed inputs, observe outputs, and compare against what the SRS promises.</li>\n<li><b>Equivalence class partitioning</b>: divide the input domain into classes assumed to behave alike; one representative per class stands for a thousand inputs. Example age validation 5-60: classes = {below 5}, {5..60}, {above 60} - test 3, 25, 70.</li>\n<li><b>Boundary Value Analysis (BVA)</b>: bugs breed at edges, so test <b>on and just beside</b> every boundary: for 5-60 test 4, 5, 6 and 59, 60, 61. BVA extends (not replaces) equivalence classes.</li>\n<li><b>Cause-effect graphing</b>: map logical combinations of input causes to output effects (a decision table) - generates tests for complex ruled logic like booking eligibility.</li>\n<li><b>Error guessing</b>: experience-led attacks - empty fields, duplicate booking, past dates, overflow inputs. No method, often gold.</li>\n<li>Detection and repair strategy: isolate the failing class, reproduce with the smallest input, then widen coverage around the fix.</li></ul>\n"}, "diagram": "se4_blackbox"}]}, {"title": {"en": "4.4 White-Box Testing"}, "items": [{"h": {"en": "White-Box Test Case Design (Structure-Based)"}, "body": {"en": "\n<ul><li>The box is transparent: testers see the code and design inputs that <b>exercise its structures</b> - statements, branches, loops.</li>\n<li><b>Statement coverage</b>: every statement executes at least once. Weakest useful criterion - a never-taken branch can hide a crash.</li>\n<li><b>Branch (decision) coverage</b>: every if takes both the TRUE and FALSE side at least once. For <code>if (x &gt; 0)</code>, tests x=3 and x=-7 give 100% branch coverage.</li>\n<li><b>Condition coverage</b> refines further for compound decisions (a &amp;&amp; b): each atomic condition true and false.</li>\n<li><b>Path coverage</b>: every route from entry to exit executes; bounded with <b>basis path testing</b> - count independent paths via cyclomatic complexity V(G) = edges - nodes + 2P, then design one test per basis path. Loops are exercised zero, once, and many times.</li>\n<li>Relation to black-box: <b>complements, never replaces</b>. Black-box finds missing functionality; white-box finds hidden faulty code. Real test plans mix both.</li></ul>\n"}, "diagram": "se4_whitebox"}]}, {"title": {"en": "4.5 Alpha, Beta and Designing Test Cases"}, "items": [{"h": {"en": "Alpha and Beta Testing"}, "body": {"en": "\n<ul><li>Both are <b>acceptance testing</b>: real usage decides whether the product is releasable.</li>\n<li><b>Alpha</b>: performed <b>in-house</b> at the developer's site, by internal staff or friendly users, with developers watching. Controlled environment, late development/fix stage; goal is to catch crashes and glaring defects before outsiders see them.</li>\n<li><b>Beta</b>: performed <b>in the wild</b> at selected client sites, by real users with real data on real hardware - developers are absent. Uncontrolled environment; goal is feedback on usability, configuration surprises and defects only the wild can produce.</li>\n<li>Order: alpha first (lab), then beta (limited clients), then release candidate, then release.</li>\n<li>Exam contrast: alpha = developer's site, controlled, internal users; beta = customer's site, uncontrolled, real users.</li></ul>\n"}, "diagram": "se4_ab"}, {"h": {"en": "Designing Test Cases (Practical 15)"}, "body": {"en": "\n<ul><li>A <b>test case</b> is a documented experiment: unique <b>id</b>, module, title, preconditions, numbered steps, <b>test data</b>, <b>expected result</b>, actual result, and pass/fail status.</li>\n<li>The expected result is written <b>before</b> execution - from the SRS, not from what the program happens to do. A test without expectations is a demo, not a test.</li>\n<li>Design habit: for every module write <b>positive</b> cases (does it do what it should) and <b>negative</b> cases (does it refuse what it must), then add boundary cases from BVA.</li>\n<li>Example for a bus-booking seat module: TC-07 'no double-booking' - precondition seat 12A already booked; steps: login as user2, book 12A; expected: error message, seat allocation unchanged.</li>\n<li>Test design techniques feed in from both worlds: black-box classes and boundaries derive cases from the spec; white-box coverage adds cases from the code structure. Record everything - a test suite is a project asset for every future regression.</li></ul>\n"}, "diagram": "se4_testcase"}]}], "syntax": [{"title": {"en": "Coding cards"}, "items": [{"name": {"en": "standards vs guidelines"}, "f": "STANDARDS = mandatory rules\nnaming indentation comments\nno GOTOs, few globals\nGUIDELINES = softer advice\ncode for the reader first", "terms": {"en": "rules enforced, advice earned"}}, {"name": {"en": "review pairing"}, "f": "walkthrough : author led\n  informal, share knowledge\ninspection  : moderator led\n  checklist, defect log,\n  formal roles", "terms": {"en": "chat vs audit"}}, {"name": {"en": "docs split"}, "f": "INTERNAL  inside the code\n  headers comments doc-strings\nEXTERNAL  beside the code\n  manual guide SRS API ref", "terms": {"en": "for developers vs users"}}]}, {"title": {"en": "Testing cards"}, "items": [{"name": {"en": "v and v"}, "f": "VERIFICATION build it RIGHT\n  reviews against the spec\nVALIDATION  build the RIGHT\n  testing against needs", "terms": {"en": "process vs product"}}, {"name": {"en": "levels ladder"}, "f": "unit        one module\nintegration interfaces\nsystem      whole vs SRS\nacceptance  customer yes", "terms": {"en": "alpha + beta live on top"}}, {"name": {"en": "black-box box"}, "f": "equivalence classes\nboundary values 4 5 6 | 59 60 61\ncause-effect graphs\nerror guessing", "terms": {"en": "spec only, no code peeking"}}, {"name": {"en": "white-box box"}, "f": "statement every line once\nbranch    both if sides\ncondition each atom T/F\npath      basis set, V(G)", "terms": {"en": "structure LED, coverage %"}}, {"name": {"en": "test case rows"}, "f": "id module title\nprecondition steps data\nEXPECTED  (before run)\nactual status pass/fail", "terms": {"en": "no expectation = demo"}}]}], "viva": [{"title": {"en": "Coding, Standards and Review"}, "items": [{"q": {"en": "What is the coding phase?"}, "a": {"en": "Translating the detailed design into executable source code - while keeping it readable and maintainable for the humans who come after."}}, {"q": {"en": "What is a coding standard?"}, "a": {"en": "A mandatory team rule for writing code: naming conventions, indentation, comment density, error-handling style, banned constructs like GOTO."}}, {"q": {"en": "How do guidelines differ from standards?"}, "a": {"en": "Standards are enforced rules; guidelines are advisory wisdom - style you follow for readability but no tool will block you for breaking."}}, {"q": {"en": "Name four things coding standards typically police."}, "a": {"en": "Naming conventions, indentation/layout, comment density, limits on globals and GOTOs (plus function-size caps)."}}, {"q": {"en": "Why do teams invest in standards?"}, "a": {"en": "Uniform style means anyone can maintain any module, reviews run faster, and whole bug classes are prevented at the keyboard."}}, {"q": {"en": "What is a code walkthrough?"}, "a": {"en": "An informal, author-led review: the author narrates the code line by line and peers ask questions - mainly knowledge sharing."}}, {"q": {"en": "What is a code inspection?"}, "a": {"en": "A formal review (Fagan): moderator, readers and recorder prepare with checklists, log every defect, and verify fixes afterwards."}}, {"q": {"en": "Walkthrough vs inspection in one line each."}, "a": {"en": "Walkthrough = informal chat led by the author; inspection = formal audit led by a moderator with checklists and a defect log."}}, {"q": {"en": "Why is review cheaper than testing for many defects?"}, "a": {"en": "A fault caught in review costs about one unit to fix; the same fault in live use costs around a hundred - and reviews need no execution setup."}}, {"q": {"en": "What is internal documentation?"}, "a": {"en": "Documentation inside the source: module headers, why-comments, meaningful names, doc-strings - serving the next developer."}}, {"q": {"en": "What is external documentation?"}, "a": {"en": "Documents beside the code: user manual, installation guide, SRS, design docs, API reference - serving users, testers and reviewers."}}]}, {"title": {"en": "Testing Fundamentals and Levels"}, "items": [{"q": {"en": "What is the objective of testing?"}, "a": {"en": "To execute a program with the intent of FINDING errors - a successful test reveals a fault, it does not prove correctness."}}, {"q": {"en": "Error vs fault vs failure."}, "a": {"en": "Error = human mistake; fault = the defect written into the software; failure = the wrong behaviour actually observed at run time."}}, {"q": {"en": "Define verification and validation."}, "a": {"en": "Verification: building the product RIGHT (checked against specs, e.g. reviews). Validation: building the RIGHT product (checked against real needs, e.g. testing)."}}, {"q": {"en": "Why can testing never prove a program correct?"}, "a": {"en": "It can only show the presence of bugs, never their absence - the input space is effectively infinite (Dijkstra)."}}, {"q": {"en": "Why should developers not test their own code alone?"}, "a": {"en": "Authors carry blind spots and a defending mindset; independent testers hunt defects impartially."}}, {"q": {"en": "List the four levels of testing in order."}, "a": {"en": "Unit (module alone), integration (interfaces between modules), system (whole product vs SRS), acceptance (customer verdict: alpha/beta)."}}, {"q": {"en": "Which level is cheapest for fixing defects and why?"}, "a": {"en": "Unit testing - the module is isolated, the author is present, and the change has no ripple effects yet."}}]}, {"title": {"en": "Black-Box and White-Box"}, "items": [{"q": {"en": "What does integration testing target?"}, "a": {"en": "Interfaces between modules - parameter mismatch, protocol confusion, shared data assumptions."}}, {"q": {"en": "What is black-box testing?"}, "a": {"en": "Designing tests from the specification alone - inputs in, outputs compared - with no knowledge of the internal code."}}, {"q": {"en": "Explain equivalence class partitioning."}, "a": {"en": "Partition inputs into classes expected to behave identically; one test per class stands for the whole class."}}, {"q": {"en": "Give the equivalence classes for age valid 5-60."}, "a": {"en": "Below 5 (invalid), 5-60 (valid), above 60 (invalid) - e.g. test 3, 25, 70."}}, {"q": {"en": "What is Boundary Value Analysis?"}, "a": {"en": "Test values on and immediately beside every boundary - for 5-60: 4, 5, 6 and 59, 60, 61 - because errors cluster at edges."}}, {"q": {"en": "Why does BVA beat random testing at edges?"}, "a": {"en": "Off-by-one and comparison-slip faults live exactly at boundaries; random inputs rarely land there."}}, {"q": {"en": "What is cause-effect graphing?"}, "a": {"en": "Map logical combinations of input causes to output effects as a graph/decision table, then derive a test per rule combination."}}, {"q": {"en": "What is error guessing?"}, "a": {"en": "Experience-based attack cases - empty input, duplicates, overflow, past dates - no formal method, often very effective."}}, {"q": {"en": "What is white-box testing?"}, "a": {"en": "Designing tests with knowledge of the code's internal structure, aiming to execute statements, branches and paths."}}, {"q": {"en": "Define statement coverage."}, "a": {"en": "Every executable statement runs at least once - the weakest meaningful coverage criterion."}}, {"q": {"en": "Define branch coverage."}, "a": {"en": "Every decision takes both its true and false outcomes at least once."}}, {"q": {"en": "What tests give 100% branch coverage on if (x > 0)?"}, "a": {"en": "One x above zero and one at-or-below zero, e.g. x=3 and x=-7."}}, {"q": {"en": "What is basis path testing?"}, "a": {"en": "Derive V(G) = edges - nodes + 2P independent paths from the control-flow graph and write one test per basis path."}}, {"q": {"en": "Black-box vs white-box - one contrast each."}, "a": {"en": "Black-box: spec-driven, finds missing functionality, tester needs no code. White-box: structure-driven, finds faulty hidden code, needs source access."}}, {"q": {"en": "Can white-box replace black-box?"}, "a": {"en": "Never - code can do everything it does correctly and STILL miss a required feature; only spec-based tests catch absence."}}]}, {"title": {"en": "Alpha-Beta and Test Cases"}, "items": [{"q": {"en": "What is alpha testing?"}, "a": {"en": "Acceptance testing in-house at the developer's site by internal/friendly users, controlled environment, developers watching."}}, {"q": {"en": "What is beta testing?"}, "a": {"en": "Acceptance testing at selected real client sites by real users with real data - uncontrolled environment, developers absent."}}, {"q": {"en": "Alpha vs beta ordering and goal."}, "a": {"en": "Alpha first in the lab to remove crashes; beta next in the wild for usability and environment surprises; then release candidate."}}, {"q": {"en": "What is a test case?"}, "a": {"en": "A documented experiment: id, module, title, preconditions, steps, test data, expected result, actual result, pass/fail."}}, {"q": {"en": "Why must the expected result be written before execution?"}, "a": {"en": "It must come from the SRS - otherwise testers just record whatever the buggy program does and call it correct."}}, {"q": {"en": "Positive vs negative test cases."}, "a": {"en": "Positive: system does what it should with valid input. Negative: system safely refuses invalid input or states."}}, {"q": {"en": "What is regression testing?"}, "a": {"en": "Re-running the existing suite after any change to prove no old functionality broke - a test suite is a permanent asset."}}, {"q": {"en": "What goes into a good test case title?"}, "a": {"en": "The exact behaviour under judgement, e.g. 'no double-booking of a seat' - searchable, specific, traceable to the SRS."}}, {"q": {"en": "How do you pick test data for a module?"}, "a": {"en": "One representative per equivalence class, every boundary value, plus guilty-past cases from error guessing."}}]}], "exam_questions": [{"q": {"en": "Explain the need for coding standards and list four rules a standard typically enforces."}, "marks": 4}, {"q": {"en": "Distinguish coding standards from coding guidelines with two examples of each."}, "marks": 3}, {"q": {"en": "Compare code walkthrough and code inspection in a four-point table."}, "marks": 4}, {"q": {"en": "Explain the roles and checklist-based process of a formal code inspection."}, "marks": 4}, {"q": {"en": "Distinguish internal from external documentation with examples of each."}, "marks": 4}, {"q": {"en": "'Testing can show the presence of bugs, never their absence.' Discuss testing objectives and psychology."}, "marks": 6}, {"q": {"en": "Distinguish error, fault and failure; and verification from validation."}, "marks": 4}, {"q": {"en": "Explain the four levels of testing with one activity and owner for each."}, "marks": 6}, {"q": {"en": "Explain equivalence class partitioning and Boundary Value Analysis with the age(5-60) example."}, "marks": 6}, {"q": {"en": "Explain cause-effect graphing and error guessing as black-box techniques."}, "marks": 4}, {"q": {"en": "Explain statement, branch and path coverage. Show the tests achieving 100% branch coverage for if (x > 0)."}, "marks": 6}, {"q": {"en": "What is basis path testing? Explain cyclomatic complexity V(G) = E - N + 2P."}, "marks": 4}, {"q": {"en": "Compare black-box and white-box testing; explain why both are needed in a real plan."}, "marks": 4}, {"q": {"en": "Compare alpha and beta testing (site, users, environment, goal, order)."}, "marks": 4}, {"q": {"en": "Design a complete test case (all fields) for 'a seat cannot be booked twice' in a bus-booking app. (Practical 15)"}, "marks": 6}], "tabs": ["notes", "diagrams", "syntax", "viva", "exam"], "diagrams": [{"id": "se4_standards", "title": {"en": "Coding Standards: What They Police"}, "file": "diagrams/se4_standards.svg"}, {"id": "se4_review", "title": {"en": "Walkthrough vs Inspection"}, "file": "diagrams/se4_review.svg"}, {"id": "se4_docs", "title": {"en": "Internal vs External Documentation"}, "file": "diagrams/se4_docs.svg"}, {"id": "se4_levels", "title": {"en": "Levels of Testing"}, "file": "diagrams/se4_levels.svg"}, {"id": "se4_blackbox", "title": {"en": "Black-Box Testing: Inputs Only"}, "file": "diagrams/se4_blackbox.svg"}, {"id": "se4_whitebox", "title": {"en": "White-Box Testing: Cover the Code"}, "file": "diagrams/se4_whitebox.svg"}, {"id": "se4_ab", "title": {"en": "Alpha and Beta Testing"}, "file": "diagrams/se4_ab.svg"}, {"id": "se4_testcase", "title": {"en": "Test Case Template (Practical 15)"}, "file": "diagrams/se4_testcase.svg"}]};

=\"9.2\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">One team's style = one team's mind: any</text><text x=\"20\" y=\"199.2\" font-size=\"9.2\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">developer can read (and safely repair)</text><text x=\"20\" y=\"214.2\" font-size=\"9.2\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">any module. Standards make that true.</text></svg>", "se4_review": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 282\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"282\" fill=\"#ffffff\"/><text x=\"180\" y=\"23.1\" font-size=\"14.5\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">Walkthrough vs Inspection</text><rect x=\"12\" y=\"44\" width=\"86\" height=\"19\" rx=\"0\" fill=\"#7B2CD9\" stroke=\"#C9B3EC\" stroke-width=\"1\"/><text x=\"55.0\" y=\"56.3\" font-size=\"8.0\" text-anchor=\"middle\" fill=\"#fff\" font-weight=\"bold\">point</text><rect x=\"98\" y=\"44\" width=\"126\" height=\"19\" rx=\"0\" fill=\"#7B2CD9\" stroke=\"#C9B3EC\" stroke-width=\"1\"/><text x=\"161.0\" y=\"56.3\" font-size=\"8.0\" text-anchor=\"middle\" fill=\"#fff\" font-weight=\"bold\">walkthrough</text><rect x=\"224\" y=\"44\" width=\"124\" height=\"19\" rx=\"0\" fill=\"#7B2CD9\" stroke=\"#C9B3EC\" stroke-width=\"1\"/><text x=\"286.0\" y=\"56.3\" font-size=\"8.0\" text-anchor=\"middle\" fill=\"#fff\" font-weight=\"bold\">inspection</text><rect x=\"12\" y=\"63\" width=\"86\" height=\"19\" rx=\"0\" fill=\"#fff\" stroke=\"#C9B3EC\" stroke-width=\"1\"/><text x=\"55.0\" y=\"75.3\" font-size=\"8.0\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">author's role</text><rect x=\"98\" y=\"63\" width=\"126\" height=\"19\" rx=\"0\" fill=\"#fff\" stroke=\"#C9B3EC\" stroke-width=\"1\"/><text x=\"161.0\" y=\"75.3\" font-size=\"8.0\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">leads the walk</text><rect x=\"224\" y=\"63\" width=\"124\" height=\"19\" rx=\"0\" fill=\"  text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">share knowledge</text><rect x=\"224\" y=\"120\" width=\"124\" height=\"19\" rx=\"0\" fill=\"#fff\" stroke=\"#C9B3EC\" stroke-width=\"1\"/><text x=\"286.0\" y=\"132.3\" font-size=\"8.0\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">find defects NOW</text><rect x=\"12\" y=\"139\" width=\"86\" height=\"19\" rx=\"0\" fill=\"#fff\" stroke=\"#C9B3EC\" stroke-width=\"1\"/><text x=\"55.0\" y=\"151.3\" font-size=\"8.0\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">output</text><rect x=\"98\" y=\"139\" width=\"126\" height=\"19\" rx=\"0\" fill=\"#fff\" stroke=\"#C9B3EC\" stroke-width=\"1\"/><text x=\"161.0\" y=\"151.3\" font-size=\"8.0\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">comments</text><rect x=\"224\" y=\"139\" width=\"124\" height=\"19\" rx=\"0\" fill=\"#fff\" stroke=\"#C9B3EC\" stroke-width=\"1\"/><text x=\"286.0\" y=\"151.3\" font-size=\"8.0\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">defect log for fix</text><rect x=\"12\" y=\"168\" width=\"336\" height=\"40\" rx=\"7\" fill=\"#F1E8FC\" stroke=\"#7B2CD9\" stroke-width=\"1.2\"/><text x=\"180\" y=\"187.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">review beats testing at cost:</text><text x=\"180\" y=\"200.9\" font-size=\"8.2\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">a requirement caught in review costs ~1; in live use, ~100.</text><rect x=\"12\" y=\"222\" width=\"336\" height=\"40\" rx=\"7\" fill=\"#E3F0FC\" stroke=\"#1565C0\" stroke-width=\"1.1\"/><text x=\"20\" y=\"240.2\" font-size=\"9.2\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">Both happen BEFORE code runs: static</text><text x=\"20\" y=\"255.2\" font-size=\"9.2\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">verification, eyeballs on work products.</text></svg>", "se4_docs": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 244\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"244\" fill=\"#ffffff\"/><text x=\"180\" y=\"23.1\" font-size=\"14.5\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">Internal vs External Documentation</text><rect x=\"12\" y=\"46\" width=\"160\" height=\"116\" rx=\"8\" fill=\"#E3F0FC\" stroke=\"#1565C0\" stroke-width=\"1.3\"/><text x=\"92\" y=\"67.4\" font-size=\"9.6\" text-anchor=\"middle\" fill=\"#1565C0\" font-weight=\"bold\">INTERNAL</text><text font-family=\"DejaVu Sans Mono, Consolas, monospace\" x=\"22\" y=\"82.8\" font-size=\"8.0\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">lives INSIDE the code:</text><text font-family=\"DejaVu Sans Mono, Consolas, monospace\" x=\"22\" y=\"96.8\" font-size=\"8.0\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">// comments</text><text font-family=\"DejaVu Sans Mono, Consolas, monospace\" x=\"22\" y=\"110.8\" font-size=\"8.0\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">doc-strings</text><text font-family=\"DejaVu Sans Mono, Consolas, monospace\" x=\"22\" y=\"124.8\" font-size=\"8.0\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">meaningful names</text><text font-family=\"DejaVu Sans Mono, Consolas, monospace\" x=\"22\" y=\"138.8\" font-size=\"8.0\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">class + module headers</text><rect x=\"188\" y=\"46\" width=\"160\" height=\"116\" rx=\"8\" fill=\"#E3F5E6\" stroke=\"#2E7D32\" stroke-width=\"1.3\"/><text x=\"268\" y=\"67.4\" font-size=\"9.6\" text-anchor=\"middle\" fill=\"#2E7D32\" font-weight=\"bold\">EXTERNAL</text><text font-family=\"DejaVu Sans Mono, Consolas, monospace\" x=\"198\" y=\"82.8\" font-size=\"8.0\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">lives BESIDE the code:</text><text font-family=\"DejaVu Sans Mono, Consolas, monospace\" x=\"198\" y=\"96.8\" font-size=\"8.0\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">user manual</text><text font-f const dots = '<svg width="22" height="22" viewBox="0 0 24 24" fill="#222"><circle cx="12" cy="5" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="12" cy="19" r="2.2"/></svg>';
const fixTables = h => h.replace(/<table>/g,'<div class="tw"><table>').replace(/<\/table>/g,'</table></div>');
const head = (title, menu=true) => `<div class="sh"><span>${title}</span>${menu?`<button class="more" data-more>${dots}</button><div class="menu"><button data-act="expand">${L('expand')}</button><button data-act="collapse">${L('collapse')}</button></div>`:''}</div>`;
const dgInline = id => `<div class="dg" data-dg="${id}">${SVG[id]}</div><div class="dgc">📐 ${t(U.diagrams.find(d=>d.id===id).title)} · ${L('tapzoom')}</div>`;

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const KW = new Set('auto break case const continue default do else enum extern for goto if register return signed sizeof static struct switch typedef union unsigned volatile while'.split(' '));
const TY = new Set('int char float double void long short FILE size_t'.split(' '));
const PKW = new Set('False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield'.split(' '));
const PTY = new Set('int float str bool list tuple set dict complex frozenset bytes bytearray range object'.split(' '));
function hlPy(src){
  const re = /(#[^\n]*)|((?:\b[rRbBfFuU]{1,2})?(?:'{3}[\s\S]*?'{3}|"{3}[\s\S]*?"{3}|'(?:\\.|[^'\\\n])*'|"(?:\\.|[^"\\\n])*"))|(^>>>|^\.\.\.(?= ))|([A-Za-z_]\w*)(?=\s*\()|([A-Za-z_]\w*)|(\b(?:0[xXoObB][0-9a-fA-F_]+|\d[\d_]*(?:\.\d+)?(?:[eE][-+]?\d+)?j?)\b)/gm;
  let o='', last=0, m;
  while ((m = re.exec(src))){
    o += esc(src.slice(last, m.index)); last = re.lastIndex;
    const w = esc(m[0]);
    if (m[1]) o += `<span class="cm">${w}</span>`;
    else if (m[2]) o += `<span class="st">${w}</span>`;
    else if (m[3]) o += `<span class="pp">${w}</span>`;
    else if (m[4]) o += PKW.has(m[4]) ? `<span class="kw">${w}</span>` : PTY.has(m[4]) ? `<span class="ty">${w}</span>` : `<span class="fn">${w}</span>`;
    else if (m[5]) o += PKW.has(m[5]) ? `<span class="kw">${w}</span>` : PTY.has(m[5]) ? `<span class="ty">${w}</span>` : w;
    else o += `<span class="nu">${w}</span>`;
  }
  return o + esc(src.slice(last));
}
function hl(src){
  if (META.code_lang === 'python') return hlPy(src);
  const re = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(^[ \t]*#[^\n]*)|([A-Za-z_]\w*)(?=\s*\()|([A-Za-z_]\w*)|(\b\d+(?:\.\d+)?[fFlLuU]*\b)/gm;
  let o='', last=0, m;
  while ((m = re.exec(src))){
    o += esc(src.slice(last, m.index)); last = re.lastIndex;
    const w = esc(m[0]);
    if (m[1]) o += `<span class="cm">${w}</span>`;
    else if (m[2]) o += `<span class="st">${w}</span>`;
    else if (m[3]) o += `<span class="pp">${w}</span>`;
    else if (m[4]) o += KW.has(m[4]) ? `<span class="kw">${w}</span>` : TY.has(m[4]) ? `<span class="ty">${w}</span>` : `<span class="fn">${w}</span>`;
    else if (m[5]) o += KW.has(m[5]) ? `<span class="kw">${w}</span>` : TY.has(m[5]) ? `<span class="ty">${w}</span>` : w;
    else o += `<span class="nu">${w}</span>`;
  }
  return o + esc(src.slice(last));
}
const progBody = p => `<div class="pl">${L('code')}</div><pre class="code">${hl(t(p.code))}</pre><div class="pl">${L('output')}</div><pre class="out">${esc(p.out)}</pre>${p.plot?`<div class="pl">${L('plot')}</div>`+dgInline(p.plot).replace('class="dg"','class="dg pg"'):''}${p.expl?`<div class="pl">${L('expl')}</div>${fixTables(t(p.expl))}`:''}`;
const pBox = id => { const p=(U.programs||[]).find(x=>x.id===id); if(!p) return ''; return `<div class="pbox"><div class="et">${L('prog')}: ${t(p.title)}</div>${progBody(p)}</div>`; };
const exBox = id => { const n=(U.numericals||[]).find(x=>x.id===id); if(!n) return ''; return `<div class="ex"><div class="et">${L('ex')}</div><div class="eq2">${t(n.q)}</div>${fixTables(t(n.a))}</div>`; };
function notes(){
  let h = `<div class="intro"><b>${t(U.title)}</b><div>${L('unit')} ${U.unit} · ${U.weightage}% ${L('intro')} · ${U.hours} ${L('hours')}</div><div>${L(U.programs?(META.code_lang==='python'?'intropy':'introc'):'introd')}</div></div>`;
  U.notes.forEach((sec,si)=>{
    h += `<div class="sec">${head(t(sec.title))}`;
    sec.items.forEach((it,i)=>{
      const open = si===0&&i===0 ? ' open' : '';
      if (it.h) {
        h += `<div class="card${it.key?' key':''}${open}"><div class="q hd"><span class="t">${it.key?'⭐ ':''}${t(it.h)}</span>${chev}</div>
        <div class="a rn" style="padding-left:18px">${fixTables(t(it.body)).replace(/margin:0 0 10px -36px/g,'')}${it.diagram?dgInline(it.diagram):''}${(it.examples||[]).map(exBox).join('')}${(it.programs||[]).map(pBox).join('')}</div></div>`;
      } else {
        h += `<div class="card${open}"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(it.q)}</span>${chev}</div>
        <div class="a">${fixTables(t(it.a))}${it.diagram?dgInline(it.diagram):''}</div></div>`;
      }
    });
    h += `</div>`;
  });
  return h;
}
function numericals(){
  return `<div class="sec">${head(L('numericals'))}` + (U.numericals||[]).map((n,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(n.q)}</span>${chev}</div><div class="a">${fixTables(t(n.a))}</div></div>`).join('') + `</div>`;
}
function diagrams(){
  return `<div class="sec">${head(L(U.programs&&META.code_lang!=='python'?'flowcharts':'diagrams'),false)}<div style="height:10px"></div>` + U.diagrams.map((d,i)=>
    `<div class="dcard" data-dg="${d.id}"><div class="h">${i+1}. ${t(d.title)}</div>${SVG[d.id]}</div>`).join('') + `</div>`;
}
function equations(){
  return U.equations.map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><span class="fbox">${e.f}</span></span>${chev}</div>
     <div class="a"><p>${t(e.terms)}</p></div></div>`).join('') + `</div>`).join('');
}
function viva(){
  return U.viva.map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((v,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(v.q)}</span>${chev}</div><div class="a"><p>${t(v.a)}</p></div></div>`).join('') + `</div>`).join('');
}
function exam(){
  return `<div class="sec">${head(L('examhead'),false)}` + U.exam_questions.map((x,i)=>
    `<div class="card"><div class="q" style="cursor:default"><span class="n">${i+1}.</span><span class="t">${t(x.q)}</span><span class="mk">${x.marks} ${L('marks')}</span></div></div>`).join('') + `</div>`;
}
function programs(){
  return `<div class="sec">${head(L('programs'))}` + (U.programs||[]).map((p,i)=>
    `<div class="card"><div class="q hd"><span class="n">${i+1}.</span><span class="t">${t(p.title)}</span>${chev}</div><div class="a pa">${progBody(p)}</div></div>`).join('') + `</div>`;
}
function syntax(key){
  return (U[typeof key==='string'?key:'syntax']||[]).map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><pre class="code sx">${hl(e.f)}</pre></span>${chev}</div>
     <div class="a">${e.terms && t(e.terms) ? fixTables(t(e.terms)) : ''}</div></div>`).join('') + `</div>`).join('');
}
const flowcharts = diagrams;
const algorithms = () => syntax('algorithms');
const ALLV = {notes, programs, diagrams, flowcharts, algorithms, syntax, equations, numericals, viva, exam};
const VIEWS = U.tabs ? Object.fromEntries(U.tabs.map(k=>[k, ALLV[k]])) : U.programs ? (META.code_lang==='python' ? {notes, programs, diagrams, syntax, viva, exam} : {notes, programs, flowcharts, syntax, viva, exam}) : U.numericals ? {notes, diagrams, equations, numericals, viva, exam} : {notes, diagrams, equations, viva, exam};
function render(){
  document.getElementById('title').textContent = `${L('unit')} ${U.unit}: ${t(U.title)}`;
  document.getElementById('sub').textContent = `${t(META.name)} · ${META.code}`;
  document.getElementById('lang').textContent = S.lang==='en' ? 'ગુ' : 'EN';
  document.getElementById('lang').style.display = META.languages.includes('gu') ? '' : 'none';
  document.getElementById('tabs').innerHTML = Object.keys(VIEWS).map(k=>`<button class="tab${S.tab===k?' on':''}" data-tab="${k}">${L(k)}</button>`).join('');
  document.getElementById('view').innerHTML = VIEWS[S.tab]();
  document.querySelectorAll('#view pre.c').forEach(e=>{ e.innerHTML = hl(e.textContent); e.className='code'; });
}
let zoom = 1;
function setZoom(z){ zoom = Math.min(4, Math.max(1, z)); const w=document.getElementById('zw'); w.style.width=(zoom*100)+'%'; document.getElementById('zr').textContent=Math.round(zoom*100)+'%'; }
document.addEventListener('click', e=>{
  const q = e.target.closest('.q'); if (q && q.parentElement.querySelector('.a')) { q.parentElement.classList.toggle('open'); return; }
  const tb = e.target.closest('[data-tab]'); if (tb){ S.tab = tb.dataset.tab; render(); window.scrollTo(0,0); return; }
  if (e.target.closest('#lang')){ S.lang = S.lang==='en'?'gu':'en'; render(); return; }
  const m = e.target.closest('[data-more]');
  document.querySelectorAll('.menu.show').forEach(x=>{ if(!m || x!==m.nextElementSibling) x.classList.remove('show'); });
  if (m){ m.nextElementSibling.classList.toggle('show'); return; }
  const act = e.target.closest('[data-act]');
  if (act){ act.closest('.sec').querySelectorAll('.card').forEach(c=>{ if(c.querySelector('.a')) c.classList.toggle('open', act.dataset.act==='expand'); }); act.parentElement.classList.remove('show'); return; }
  const dg = e.target.closest('[data-dg]');
  if (dg){ const id=dg.dataset.dg; document.getElementById('mt').textContent=t(U.diagrams.find(d=>d.id===id).title); document.getElementById('zw').innerHTML=SVG[id]; setZoom(1); document.getElementById('modal').classList.add('show'); return; }
  if (e.target.closest('#mx')) document.getElementById('modal').classList.remove('show');
  if (e.target.closest('#zi')) setZoom(zoom+0.5);
  if (e.target.closest('#zo')) setZoom(zoom-0.5);
  if (e.target.closest('#zr')) setZoom(1);
});
render();
</script></body></html>
