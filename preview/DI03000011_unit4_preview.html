-bit code into 2ⁿ outputs, with only one active.", "gu": "n-bit code ને 2ⁿ outputs માં ફેરવતો circuit, જેમાં એક જ active."}}, {"q": {"en": "Why is a decoder called a minterm generator?", "gu": "Decoder ને minterm generator કેમ કહે છે?"}, "a": {"en": "Each of its outputs is one minterm of the inputs.", "gu": "તેનો દરેક output inputs નો એક minterm છે."}}, {"q": {"en": "What is a multiplexer?", "gu": "Multiplexer શું છે?"}, "a": {"en": "A data selector: it sends one of many inputs to a single output using select lines.", "gu": "Data selector: select lines વડે ઘણા inputs માંથી એકને એક output પર મોકલે."}}, {"q": {"en": "How many select lines does a 4:1 MUX have?", "gu": "4:1 MUX માં કેટલી select lines હોય?"}, "a": {"en": "Two.", "gu": "બે."}}, {"q": {"en": "What is a demultiplexer?", "gu": "Demultiplexer શું છે?"}, "a": {"en": "A data distributor: it sends one input to one of many outputs.", "gu": "Data distributor: એક input ને ઘણા outputs માંથી એક પર મોકલે."}}, {"q": {"en": "How can a DEMUX be used as a decoder?", "gu": "DEMUX ને decoder તરીકે કેવી રીતે વપરાય?"}, "a": {"en": "Keep the data input at 1 and use the select lines as decoder inputs.", "gu": "Data input ને 1 રાખી select lines ને decoder inputs તરીકે વાપરો."}}, {"q": {"en": "Give one application each of MUX and DEMUX.", "gu": "MUX અને DEMUX નો એક-એક ઉપયોગ આપો."}, "a": {"en": "MUX: parallel-to-serial conversion; DEMUX: serial-to-parallel conversion.", "gu": "MUX: parallel-to-serial conversion; DEMUX: serial-to-parallel conversion."}}, {"q": {"en": "Name ICs for a 4:1 MUX and a 2:4 decoder.", "gu": "4:1 MUX અને 2:4 decoder ના ICs જણાવો."}, "a": {"en": "74153 (dual 4:1 MUX); 74139 (dual 2:4 decoder).", "gu": "74153 (dual 4:1 MUX); 74139 (dual 2:4 decoder)."}}]}], "exam_questions": [{"q": {"en": "Define combinational circuit. Give its block diagram and examples.", "gu": "Combinational circuit ની વ્યાખ્યા આપો. તેનો block diagram અને ઉદાહરણો આપો."}, "marks": 3}, {"q": {"en": "Explain the design procedure of combinational circuits.", "gu": "Combinational circuits ની design procedure સમજાવો."}, "marks": 3}, {"q": {"en": "Explain the half adder with block diagram, truth table and logic diagram.", "gu": "Block diagram, truth table અને logic diagram સાથે half adder સમજાવો."}, "marks": 4}, {"q": {"en": "Design a full adder using a truth table and K-maps; draw its logic diagram.", "gu": "Truth table અને K-maps વડે full adder design કરો; તેનો logic diagram દોરો."}, "marks": 7}, {"q": {"en": "Implement a full adder using two half adders.", "gu": "બે half adders વડે full adder બનાવો."}, "marks": 4}, {"q": {"en": "Explain the half subtractor with truth table and logic diagram.", "gu": "Truth table અને logic diagram સાથે half subtractor સમજાવો."}, "marks": 4}, {"q": {"en": "Design a full subtractor and draw its logic diagram.", "gu": "Full subtractor design કરી તેનો logic diagram દોરો."}, "marks": 7}, {"q": {"en": "Compare half adder and full adder.", "gu": "Half adder અને full adder ની સરખામણી કરો."}, "marks": 3}, {"q": {"en": "Implement a half adder using NAND gates only.", "gu": "માત્ર NAND gates વડે half adder બનાવો."}, "marks": 4}, {"q": {"en": "Explain the 4-to-2 encoder with block diagram and truth table.", "gu": "Block diagram અને truth table સાથે 4-to-2 encoder સમજાવો."}, "marks": 3}, {"q": {"en": "Explain the 2-to-4 decoder with block diagram, truth table and logic diagram.", "gu": "Block diagram, truth table અને logic diagram સાથે 2-to-4 decoder સમજાવો."}, "marks": 4}, {"q": {"en": "What is a multiplexer? Explain the 4-to-1 MUX with block diagram, truth table and logic diagram.", "gu": "Multiplexer શું છે? Block diagram, truth table અને logic diagram સાથે 4-to-1 MUX સમજાવો."}, "marks": 7}, {"q": {"en": "Explain the 1-to-4 demultiplexer with block diagram, truth table and logic diagram.", "gu": "Block diagram, truth table અને logic diagram સાથે 1-to-4 demultiplexer સમજાવો."}, "marks": 4}, {"q": {"en": "Differentiate between multiplexer and demultiplexer.", "gu": "Multiplexer અને demultiplexer વચ્ચે તફાવત આપો."}, "marks": 3}, {"q": {"en": "Differentiate between encoder and decoder.", "gu": "Encoder અને decoder વચ્ચે તફાવત આપો."}, "marks": 3}, {"q": {"en": "Implement F(A, B, C) = Σm(1, 3, 5, 6) using a 4-to-1 multiplexer.", "gu": "4-to-1 multiplexer વડે F(A, B, C) = Σm(1, 3, 5, 6) બનાવો."}, "marks": 4}], "tabs": ["notes", "diagrams", "equations", "numericals", "viva", "exam"], "diagrams": [{"id": "de4_comb", "title": {"en": "Combinational Circuit: Block Diagram and Types", "gu": "Combinational Circuit: Block Diagram અને પ્રકારો"}, "file": "diagrams/de4_comb.svg"}, {"id": "de4_design", "title": {"en": "Design Procedure", "gu": "Design Procedure"}, "file": "diagrams/de4_design.svg"}, {"id": "de4_ha", "title": {"en": "Half Adder: Block Diagram and Truth Table", "gu": "Half Adder: Block Diagram અને Truth Table"}, "file": "diagrams/de4_ha.svg"}, {"id": "de4_ha_logic", "title": {"en": "Half Adder: Logic Diagram", "gu": "Half Adder: Logic Diagram"}, "file": "diagrams/de4_ha_logic.svg"}, {"id": "de4_fa", "title": {"en": "Full Adder: Block Diagram and Truth Table", "gu": "Full Adder: Block Diagram અને Truth Table"}, "file": "diagrams/de4_fa.svg"}, {"id": "de4_fa_kmap", "title": {"en": "Full Adder: K-maps", "gu": "Full Adder: K-maps"}, "file": "diagrams/de4_fa_kmap.svg"}, {"id": "de4_fa_logic", "title": {"en": "Full Adder: Logic Diagram", "gu": "Full Adder: Logic Diagram"}, "file": "diagrams/de4_fa_logic.svg"}, {"id": "de4_fa_2ha", "title": {"en": "Full Adder using Two Half Adders", "gu": "બે Half Adders વડે Full Adder"}, "file": "diagrams/de4_fa_2ha.svg"}, {"id": "de4_hs", "title": {"en": "Half Subtractor", "gu": "Half Subtractor"}, "file": "diagrams/de4_hs.svg"}, {"id": "de4_fs", "title": {"en": "Full Subtractor: Block Diagram and Truth Table", "gu": "Full Subtractor: Block Diagram અને Truth Table"}, "file": "diagrams/de4_fs.svg"}, {"id": "de4_fs_logic", "title": {"en": "Full Subtractor: K-map and Logic Diagram", "gu": "Full Subtractor: K-map અને Logic Diagram"}, "file": "diagrams/de4_fs_logic.svg"}, {"id": "de4_enc", "title": {"en": "4-to-2 Encoder", "gu": "4-to-2 Encoder"}, "file": "diagrams/de4_enc.svg"}, {"id": "de4_dec", "title": {"en": "2-to-4 Decoder", "gu": "2-to-4 Decoder"}, "file": "diagrams/de4_dec.svg"}, {"id": "de4_mux", "title": {"en": "4-to-1 Multiplexer: Block Diagram", "gu": "4-to-1 Multiplexer: Block Diagram"}, "file": "diagrams/de4_mux.svg"}, {"id": "de4_mux_logic", "title": {"en": "4-to-1 Multiplexer: Logic Diagram", "gu": "4-to-1 Multiplexer: Logic Diagram"}, "file": "diagrams/de4_mux_logic.svg"}, {"id": "de4_demux", "title": {"en": "1-to-4 Demultiplexer: Block Diagram", "gu": "1-to-4 Demultiplexer: Block Diagram"}, "file": "diagrams/de4_demux.svg"}, {"id": "de4_demux_logic", "title": {"en": "1-to-4 Demultiplexer: Logic Diagram", "gu": "1-to-4 Demultiplexer: Logic Diagram"}, "file": "diagrams/de4_demux_logic.svg"}, {"id": "de4_compare", "title": {"en": "Data Transmission Circuits at a Glance", "gu": "Data Transmission Circuits એક નજરે"}, "file": "diagrams/de4_compare.svg"}]};

    else if (m[4]) o += PKW.has(m[4]) ? `<span class="kw">${w}</span>` : PTY.has(m[4]) ? `<span class="ty">${w}</span>` : `<span class="fn">${w}</span>`;
    else if (m[5]) o += PKW.has(m[5]) ? `<span class="kw">${w}</span>` : PTY.has(m[5]) ? `<span class="ty">${w}</span>` : w;
    else o += `<span class="nu">${w}</span>`;
  }
  return o + esc(src.slice(last));
}
function hl(src){
  if (META.code_lang === 'python') return hlPy(src);
  const re = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(^[ \t]*#[^\n]*)|([A-Za-z_]\w*)(?=\s*\()|([A-Za-z_]\w*)|(\b\d+(?:\.\d+)?[fFlLuU]*\b)/gm;
  let o='', last=0, m;
  while ((m = re.exec(src))){
    o += esc(src.slice(last, m.index)); last = re.lastIndex;
    const w = esc(m[0]);
    if (m[1]) o += `<span class="cm">${w}</span>`;
    else if (m[2]) o += `<span class="st">${w}</span>`;
    else if (m[3]) o += `<span class="pp">${w}</span>`;
    else if (m[4]) o += KW.has(m[4]) ? `<span class="kw">${w}</span>` : TY.has(m[4]) ? `<span class="ty">${w}</span>` : `<span class="fn">${w}</span>`;
    else if (m[5]) o += KW.has(m[5]) ? `<span class="kw">${w}</span>` : TY.has(m[5]) ? `<span class="ty">${w}</span>` : w;
    else o += `<span class="nu">${w}</span>`;
  }
  return o + esc(src.slice(last));
}
const progBody = p => `<div class="pl">${L('code')}</div><pre class="code">${hl(t(p.code))}</pre><div class="pl">${L('output')}</div><pre class="out">${esc(p.out)}</pre>${p.plot?`<div class="pl">${L('plot')}</div>`+dgInline(p.plot).replace('class="dg"','class="dg pg"'):''}${p.expl?`<div class="pl">${L('expl')}</div>${fixTables(t(p.expl))}`:''}`;
const pBox = id => { const p=(U.programs||[]).find(x=>x.id===id); if(!p) return ''; return `<div class="pbox"><div class="et">${L('prog')}: ${t(p.title)}</div>${progBody(p)}</div>`; };
const exBox = id => { const n=(U.numericals||[]).find(x=>x.id===id); if(!n) return ''; return `<div class="ex"><div class="et">${L('ex')}</div><div class="eq2">${t(n.q)}</div>${fixTables(t(n.a))}</div>`; };
function notes(){
  let h = `<div class="intro"><b>${t(U.title)}</b><div>${L('unit')} ${U.unit} · ${U.weightage}% ${L('intro')} · ${U.hours} ${L('hours')}</div><div>${L(U.programs?(META.code_lang==='python'?'intropy':'introc'):'introd')}</div></div>`;
  U.notes.forEach((sec,si)=>{
    h += `<div class="sec">${head(t(sec.title))}`;
    sec.items.forEach((it,i)=>{
      const open = si===0&&i===0 ? ' open' : '';
      if (it.h) {
        h += `<div class="card${it.key?' key':''}${open}"><div class="q hd"><span class="t">${it.key?'⭐ ':''}${t(it.h)}</span>${chev}</div>
        <div class="a rn" style="padding-left:18px">${fixTables(t(it.body)).replace(/margin:0 0 10px -36px/g,'')}${it.diagram?dgInline(it.diagram):''}${(it.examples||[]).map(exBox).join('')}${(it.programs||[]).map(pBox).join('')}</div></div>`;
      } else {
        h += `<div class="card${open}"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(it.q)}</span>${chev}</div>
        <div class="a">${fixTables(t(it.a))}${it.diagram?dgInline(it.diagram):''}</div></div>`;
      }
    });
    h += `</div>`;
  });
  return h;
}
function numericals(){
  return `<div class="sec">${head(L('numericals'))}` + (U.numericals||[]).map((n,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(n.q)}</span>${chev}</div><div class="a">${fixTables(t(n.a))}</div></div>`).join('') + `</div>`;
}
function diagrams(){
  return `<div class="sec">${head(L(U.programs&&META.code_lang!=='python'?'flowcharts':'diagrams'),false)}<div style="height:10px"></div>` + U.diagrams.map((d,i)=>
    `<div class="dcard" data-dg="${d.id}"><div class="h">${i+1}. ${t(d.title)}</div>${SVG[d.id]}</div>`).join('') + `</div>`;
}
function equations(){
  return U.equations.map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><span class="fbox">${e.f}</span></span>${chev}</div>
     <div class="a"><p>${t(e.terms)}</p></div></div>`).join('') + `</div>`).join('');
}
function viva(){
  return U.viva.map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((v,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(v.q)}</span>${chev}</div><div class="a"><p>${t(v.a)}</p></div></div>`).join('') + `</div>`).join('');
}
function exam(){
  return `<div class="sec">${head(L('examhead'),false)}` + U.exam_questions.map((x,i)=>
    `<div class="card"><div class="q" style="cursor:default"><span class="n">${i+1}.</span><span class="t">${t(x.q)}</span><span class="mk">${x.marks} ${L('marks')}</span></div></div>`).join('') + `</div>`;
}
function programs(){
  return `<div class="sec">${head(L('programs'))}` + (U.programs||[]).map((p,i)=>
    `<div class="card"><div class="q hd"><span class="n">${i+1}.</span><span class="t">${t(p.title)}</span>${chev}</div><div class="a pa">${progBody(p)}</div></div>`).join('') + `</div>`;
}
function syntax(key){
  return (U[typeof key==='string'?key:'syntax']||[]).map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><pre class="code sx">${hl(e.f)}</pre></span>${chev}</div>
     <div class="a">${e.terms && t(e.terms) ? fixTables(t(e.terms)) : ''}</div></div>`).join('') + `</div>`).join('');
}
const flowcharts = diagrams;
const algorithms = () => syntax('algorithms');
const ALLV = {notes, programs, diagrams, flowcharts, algorithms, syntax, equations, numericals, viva, exam};
const VIEWS = U.tabs ? Object.fromEntries(U.tabs.map(k=>[k, ALLV[k]])) : U.programs ? (META.code_lang==='python' ? {notes, programs, diagrams, syntax, viva, exam} : {notes, programs, flowcharts, syntax, viva, exam}) : U.numericals ? {notes, diagrams, equations, numericals, viva, exam} : {notes, diagrams, equations, viva, exam};
function render(){
  document.getElementById('title').textContent = `${L('unit')} ${U.unit}: ${t(U.title)}`;
  document.getElementById('sub').textContent = `${t(META.name)} · ${META.code}`;
  document.getElementById('lang').textContent = S.lang==='en' ? 'ગુ' : 'EN';
  document.getElementById('lang').style.display = META.languages.includes('gu') ? '' : 'none';
  document.getElementById('tabs').innerHTML = Object.keys(VIEWS).map(k=>`<button class="tab${S.tab===k?' on':''}" data-tab="${k}">${L(k)}</button>`).join('');
  document.getElementById('view').innerHTML = VIEWS[S.tab]();
  document.querySelectorAll('#view pre.c').forEach(e=>{ e.innerHTML = hl(e.textContent); e.className='code'; });
}
let zoom = 1;
function setZoom(z){ zoom = Math.min(4, Math.max(1, z)); const w=document.getElementById('zw'); w.style.width=(zoom*100)+'%'; document.getElementById('zr').textContent=Math.round(zoom*100)+'%'; }
document.addEventListener('click', e=>{
  const q = e.target.closest('.q'); if (q && q.parentElement.querySelector('.a')) { q.parentElement.classList.toggle('open'); return; }
  const tb = e.target.closest('[data-tab]'); if (tb){ S.tab = tb.dataset.tab; render(); window.scrollTo(0,0); return; }
  if (e.target.closest('#lang')){ S.lang = S.lang==='en'?'gu':'en'; render(); return; }
  const m = e.target.closest('[data-more]');
  document.querySelectorAll('.menu.show').forEach(x=>{ if(!m || x!==m.nextElementSibling) x.classList.remove('show'); });
  if (m){ m.nextElementSibling.classList.toggle('show'); return; }
  const act = e.target.closest('[data-act]');
  if (act){ act.closest('.sec').querySelectorAll('.card').forEach(c=>{ if(c.querySelector('.a')) c.classList.toggle('open', act.dataset.act==='expand'); }); act.parentElement.classList.remove('show'); return; }
  const dg = e.target.closest('[data-dg]');
  if (dg){ const id=dg.dataset.dg; document.getElementById('mt').textContent=t(U.diagrams.find(d=>d.id===id).title); document.getElementById('zw').innerHTML=SVG[id]; setZoom(1); document.getElementById('modal').classList.add('show'); return; }
  if (e.target.closest('#mx')) document.getElementById('modal').classList.remove('show');
  if (e.target.closest('#zi')) setZoom(zoom+0.5);
  if (e.target.closest('#zo')) setZoom(zoom-0.5);
  if (e.target.closest('#zr')) setZoom(1);
});
render();
</script></body></html>
