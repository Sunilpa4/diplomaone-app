>f</sub> + R<sub>L</sub>)] × 100%</b></p>\n<h4>5. Peak Inverse Voltage (PIV)</h4>\n<p>The maximum reverse voltage that appears across a diode when it is <b>not conducting</b>. The diode's PIV rating must be <b>greater</b> than this value.</p>\n<h4>6. Ripple frequency</h4>\n<p>Frequency of the pulsating output (50 Hz for HWR, 100 Hz for FWR with 50 Hz mains).</p>\n<h4>7. Transformer Utilisation Factor (TUF)</h4>\n<p>TUF = DC power delivered to the load / AC VA rating of transformer secondary. Higher TUF means the transformer is used better.</p>\n<h4>8. Form factor and peak factor</h4>\n<p>Form factor = V<sub>rms</sub> / V<sub>dc</sub>; peak factor = V<sub>m</sub> / V<sub>rms</sub>.</p>", "gu": "<p>V<sub>m</sub> = secondary નો peak voltage, I<sub>m</sub> = peak load current = V<sub>m</sub> / (r<sub>f</sub> + R<sub>L</sub>), જ્યાં r<sub>f</sub> = diode નો forward resistance.</p>\n<h4>1. Average (DC) મૂલ્ય – V<sub>dc</sub>, I<sub>dc</sub></h4>\n<p>એક cycle દરમિયાન pulsating output નું સરેરાશ મૂલ્ય. DC voltmeter આ જ મૂલ્ય બતાવે છે.</p>\n<h4>2. RMS મૂલ્ય – V<sub>rms</sub>, I<sub>rms</sub></h4>\n<p>Output નું અસરકારક મૂલ્ય, જેમાં DC અને AC બંને ઘટકો સામેલ છે.</p>\n<h4>3. Ripple factor (r અથવા γ)</h4>\n<p>Output ના AC ઘટક (ripple) ના RMS મૂલ્ય અને DC મૂલ્યનો ગુણોત્તર. તે DC કેટલું શુદ્ધ છે તે બતાવે છે. <b>જેટલું ઓછું એટલું સારું</b>.</p>\n<p><b>r = V<sub>ac(rms)</sub> / V<sub>dc</sub> = √[(I<sub>rms</sub> / I<sub>dc</sub>)² − 1]</b></p>\n<h4>4. Rectification efficiency (η)</h4>\n<p>DC output power અને AC input power નો ગુણોત્તર. <b>જેટલું વધુ એટલું સારું</b>.</p>\n<p><b>η = P<sub>dc</sub> / P<sub>ac</sub> = I<sub>dc</sub>² R<sub>L</sub> / [I<sub>rms</sub>² (r<sub>f</sub> + R<sub>L</sub>)] × 100%</b></p>\n<h4>5. Peak Inverse Voltage (PIV)</h4>\n<p>Diode <b>conduction ન કરતો હોય</b> ત્યારે તેના પર આવતો મહત્તમ reverse voltage. Diode નું PIV rating આ મૂલ્ય કરતાં <b>વધુ</b> હોવું જોઈએ.</p>\n<h4>6. Ripple frequency</h4>\n<p>Pulsating output ની frequency (50 Hz mains માટે HWR માં 50 Hz, FWR માં 100 Hz).</p>\n<h4>7. Transformer Utilisation Factor (TUF)</h4>\n<p>TUF = load ને મળતો DC power / transformer secondary નું AC VA rating. વધુ TUF એટલે transformer નો વધુ સારો ઉપયોગ.</p>\n<h4>8. Form factor અને peak factor</h4>\n<p>Form factor = V<sub>rms</sub> / V<sub>dc</sub>; peak factor = V<sub>m</sub> / V<sub>rms</sub>.</p>"}, "examples": ["u3n9"]}, {"h": {"en": "3.6.4 Half-Wave Rectifier", "gu": "3.6.4 Half-Wave Rectifier"}, "body": {"en": "<h4>Circuit</h4>\n<p>It consists of a <b>step-down transformer</b>, <b>one diode D</b> and a <b>load resistor R<sub>L</sub></b> connected in series across the secondary (see diagram).</p>\n<h4>Working</h4>\n<ul>\n<li><b>Positive half-cycle:</b> The top of the secondary is positive, so the diode is <b>forward biased</b> (ON). Current flows through R<sub>L</sub> and the output follows the input half-cycle.</li>\n<li><b>Negative half-cycle:</b> The top of the secondary is negative, so the diode is <b>reverse biased</b> (OFF). No current flows; output = 0.</li>\n<li>Thus only <b>one half</b> of each AC cycle appears across the load → <b>pulsating DC</b> in one direction.</li>\n</ul>\n<h4>Formulas</h4>\n<table>\n<tr><th>Parameter</th><th>Value</th></tr>\n<tr><td>I<sub>dc</sub> (average)</td><td>I<sub>m</sub> / π = 0.318 I<sub>m</sub></td></tr>\n<tr><td>V<sub>dc</sub></td><td>V<sub>m</sub> / π = 0.318 V<sub>m</sub> (ideal diode, r<sub>f</sub> = 0)</td></tr>\n<tr><td>I<sub>rms</sub></td><td>I<sub>m</sub> / 2</td></tr>\n<tr><td>V<sub>rms</sub></td><td>V<sub>m</sub> / 2</td></tr>\n<tr><td>Ripple factor</td><td><b>1.21</b> (121%)</td></tr>\n<tr><td>Max. efficiency</td><td><b>40.6%</b></td></tr>\n<tr><td>PIV</td><td><b>V<sub>m</sub></b></td></tr>\n<tr><td>Output (ripple) frequency</td><td><b>f</b> (50 Hz)</td></tr>\n<tr><td>TUF</td><td>0.287</td></tr>\n<tr><td>Form factor</td><td>1.57</td></tr>\n</table>\n<h4>Advantages</h4>\n<ul><li>Simple, only one diode, low cost.</li><li>No centre-tapped transformer needed.</li></ul>\n<h4>Disadvantages</h4>\n<ul>\n<li>Very high ripple (1.21) → difficult to filter.</li>\n<li>Low efficiency (40.6%) and low DC output (0.318 V<sub>m</sub>).</li>\n<li>Low TUF; DC current through the secondary may saturate the transformer core.</li>\n</ul>\n<p><b>Applications:</b> low-power, low-cost circuits such as battery chargers for small devices, signal detection.</p>", "gu": "<h4>Circuit</h4>\n<p>તેમાં <b>step-down transformer</b>, <b>એક diode D</b> અને secondary પર series માં જોડેલ <b>load resistor R<sub>L</sub></b> હોય છે (આકૃતિ જુઓ).</p>\n<h4>કાર્ય</h4>\n<ul>\n<li><b>Positive half-cycle:</b> Secondary નો ઉપરનો છેડો positive છે, તેથી diode <b>forward biased</b> (ON) થાય છે. R<sub>L</sub> માંથી current વહે છે અને output input half-cycle ને અનુસરે છે.</li>\n<li><b>Negative half-cycle:</b> Secondary નો ઉપરનો છેડો negative છે, તેથી diode <b>reverse biased</b> (OFF) થાય છે. Current વહેતો નથી; output = 0.</li>\n<li>આમ દરેક AC cycle નો ફક્ત <b>અડધો ભાગ</b> load પર આવે છે → એક જ દિશામાં <b>pulsating DC</b>.</li>\n</ul>\n<h4>સૂત્રો</h4>\n<table>\n<tr><th>Parameter</th><th>મૂલ્ય</th></tr>\n<tr><td>I<sub>dc</sub> (average)</td><td>I<sub>m</sub> / π = 0.318 I<sub>m</sub></td></tr>\n<tr><td>V<sub>dc</sub></td><td>V<sub>m</sub> / π = 0.318 V<sub>m</sub> (ideal diode, r<sub>f</sub> = 0)</td></tr>\n<tr><td>I<sub>rms</sub></td><td>I<sub>m</sub> / 2</td></tr>\n<tr><td>V<sub>rms</sub></td><td>V<sub>m</sub> / 2</td></tr>\n<tr><td>Ripple factor</td><td><b>1.21</b> (121%)</td></tr>\n<tr><td>મહત્તમ efficiency</td><td><b>40.6%</b></td></tr>\n<tr><td>PIV</td><td><b>V<sub>m</sub></b></td></tr>\n<tr><td>Output (ripple) frequency</td><td><b>f</b> (50 Hz)</td></tr>\n<tr><td>TUF</td><td>0.287</td></tr>\n<tr><td>Form factor</td><td>1.57</td></tr>\n</table>\n<h4>ફાયદા</h4>\n<ul><li>સરળ, ફક્ત એક diode, ઓછી કિંમત.</li><li>Centre-tapped transformer ની જરૂર નથી.</li></ul>\n<h4>ગેરફાયદા</h4>\n<ul>\n<li>ખૂબ વધુ ripple (1.21) → filter કરવું મુશ્કેલ.</li>\n<li>ઓછી efficiency (40.6%) અને ઓછો DC output (0.318 V<sub>m</sub>).</li>\n<li>ઓછું TUF; secondary માંથી DC current વહેવાથી transformer core saturate થઈ શકે.</li>\n</ul>\n<p><b>ઉપયોગો:</b> ઓછા power, ઓછી કિંમતના circuits જેમ કે નાના devices ના battery chargers, signal detection.</p>"}, "diagram": "u3_hwr", "examples": ["u3n6"]}, {"h": {"en": "3.6.5 Centre-Tapped Full-Wave Rectifier", "gu": "3.6.5 Centre-Tapped Full-Wave Rectifier"}, "body": {"en": "<h4>Circuit</h4>\n<p>It uses a <b>centre-tapped transformer</b> and <b>two diodes D1 and D2</b>. The anodes of D1 and D2 are connected to the two ends of the secondary; their cathodes are joined together and connected to one end of R<sub>L</sub>. The other end of R<sub>L</sub> goes to the <b>centre tap (CT)</b> (see diagram).</p>\n<p>The centre tap divides the secondary into two equal halves; each half gives a peak voltage V<sub>m</sub>.</p>\n<h4>Working</h4>\n<ul>\n<li><b>Positive half-cycle:</b> The top end is positive w.r.t. CT → <b>D1 forward biased (ON)</b>, D2 reverse biased (OFF). Current: top end → D1 → R<sub>L</sub> → CT.</li>\n<li><b>Negative half-cycle:</b> The bottom end is positive w.r.t. CT → <b>D2 ON</b>, D1 OFF. Current: bottom end → D2 → R<sub>L</sub> → CT.</li>\n<li>In both half-cycles, current flows through R<sub>L</sub> in the <b>same direction</b> → full-wave pulsating DC.</li>\n</ul>\n<h4>Formulas</h4>\n<table>\n<tr><th>Parameter</th><th>Value</th></tr>\n<tr><td>I<sub>dc</sub></td><td>2I<sub>m</sub> / π = 0.636 I<sub>m</sub></td></tr>\n<tr><td>V<sub>dc</sub></td><td>2V<sub>m</sub> / π = 0.636 V<sub>m</sub></td></tr>\n<tr><td>I<sub>rms</sub></td><td>I<sub>m</sub> / √2</td></tr>\n<tr><td>V<sub>rms</sub></td><td>V<sub>m</sub> / √2</td></tr>\n<tr><td>Ripple factor</td><td><b>0.482</b> (48.2%)</td></tr>\n<tr><td>Max. efficiency</td><td><b>81.2%</b></td></tr>\n<tr><td>PIV</td><td><b>2V<sub>m</sub></b> (V<sub>m</sub> = peak of each half)</td></tr>\n<tr><td>Output (ripple) frequency</td><td><b>2f</b> (100 Hz)</td></tr>\n<tr><td>TUF</td><td>0.693</td></tr>\n<tr><td>Form factor</td><td>1.11</td></tr>\n</table>\n<p><b>Why is PIV = 2V<sub>m</sub>?</b> When D1 conducts (drop ≈ 0), the cathode of D2 is at +V<sub>m</sub> and its anode is at −V<sub>m</sub>, so D2 sees 2V<sub>m</sub> in reverse.</p>\n<h4>Advantages</h4>\n<ul><li>Ripple factor and efficiency are much better than HWR.</li><li>DC output is double that of HWR.</li><li>Only two diodes; no DC saturation of the core.</li></ul>\n<h4>Disadvantages</h4>\n<ul><li>Needs a <b>centre-tapped transformer</b> – bulky and costly.</li><li>Each half of the secondary is used only for half the time.</li><li>Diodes must have a high PIV rating (2V<sub>m</sub>).</li></ul>", "gu": "<h4>Circuit</h4>\n<p>તે <b>centre-tapped transformer</b> અને <b>બે diodes D1 અને D2</b> વાપરે છે. D1 અને D2 ના anodes secondary ના બે છેડા સાથે જોડાય છે; તેમના cathodes ભેગા કરી R<sub>L</sub> ના એક છેડે જોડાય છે. R<sub>L</sub> નો બીજો છેડો <b>centre tap (CT)</b> સાથે જોડાય છે (આકૃતિ જુઓ).</p>\n<p>Centre tap secondary ને બે સમાન ભાગમાં વહેંચે છે; દરેક ભાગ peak voltage V<sub>m</sub> આપે છે.</p>\n<h4>કાર્ય</h4>\n<ul>\n<li><b>Positive half-cycle:</b> ઉપરનો છેડો CT ની સાપેક્ષે positive → <b>D1 forward biased (ON)</b>, D2 reverse biased (OFF). Current: ઉપરનો છેડો → D1 → R<sub>L</sub> → CT.</li>\n<li><b>Negative half-cycle:</b> નીચેનો છેડો CT ની સાપેક્ષે positive → <b>D2 ON</b>, D1 OFF. Current: નીચેનો છેડો → D2 → R<sub>L</sub> → CT.</li>\n<li>બંને half-cycles માં R<sub>L</sub> માંથી current <b>એક જ દિશામાં</b> વહે છે → full-wave pulsating DC.</li>\n</ul>\n<h4>સૂત્રો</h4>\n<table>\n<tr><th>Parameter</th><th>મૂલ્ય</th></tr>\n<tr><td>I<sub>dc</sub></td><td>2I<sub>m</sub> / π = 0.636 I<sub>m</sub></td></tr>\n<tr><td>V<sub>dc</sub></td><td>2V<sub>m</sub> / π = 0.636 V<sub>m</sub></td></tr>\n<tr><td>I<sub>rms</sub></td><td>I<sub>m</sub> / √2</td></tr>\n<tr><td>V<sub>rms</sub></td><td>V<sub>m</sub> / √2</td></tr>\n<tr><td>Ripple factor</td><td><b>0.482</b> (48.2%)</td></tr>\n<tr><td>મહત્તમ efficiency</td><td><b>81.2%</b></td></tr>\n<tr><td>PIV</td><td><b>2V<sub>m</sub></b> (V<sub>m</sub> = દરેક અડધા ભાગનો peak)</td></tr>\n<tr><td>Output (ripple) frequency</td><td><b>2f</b> (100 Hz)</td></tr>\n<tr><td>TUF</td><td>0.693</td></tr>\n<tr><td>Form factor</td><td>1.11</td></tr>\n</table>\n<p><b>PIV = 2V<sub>m</sub> કેમ?</b> જ્યારે D1 conduction કરે (drop ≈ 0), ત્યારે D2 નો cathode +V<sub>m</sub> પર અને anode −V<sub>m</sub> પર હોય છે, તેથી D2 પર reverse માં 2V<sub>m</sub> આવે છે.</p>\n<h4>ફાયદા</h4>\n<ul><li>Ripple factor અને efficiency HWR કરતાં ઘણા સારા.</li><li>DC output HWR કરતાં બમણો.</li><li>ફક્ત બે diodes; core નું DC saturation નહીં.</li></ul>\n<h4>ગેરફાયદા</h4>\n<ul><li><b>Centre-tapped transformer</b> જરૂરી – મોટું અને મોંઘું.</li><li>Secondary નો દરેક અડધો ભાગ ફક્ત અડધો સમય વપરાય.</li><li>Diodes નું PIV rating વધુ (2V<sub>m</sub>) હોવું જોઈએ.</li></ul>"}, "diagram": "u3_fwr_ct", "examples": ["u3n7"]}, {"h": {"en": "3.6.6 Full-Wave Bridge Rectifier", "gu": "3.6.6 Full-Wave Bridge Rectifier"}, "body": {"en": "<h4>Circuit</h4>\n<p>Four diodes <b>D1, D2, D3, D4</b> are connected in the form of a <b>bridge</b>. The AC secondary is connected across one diagonal, and the load R<sub>L</sub> across the other diagonal. <b>No centre tap</b> is needed (see diagram).</p>\n<h4>Working</h4>\n<ul>\n<li><b>Positive half-cycle:</b> The top of the secondary is positive → <b>D1 and D4 are forward biased</b> (ON); D2 and D3 are OFF. Current: top → D1 → R<sub>L</sub> (+ to −) → D4 → bottom.</li>\n<li><b>Negative half-cycle:</b> The bottom of the secondary is positive → <b>D2 and D3 are ON</b>; D1 and D4 are OFF. Current: bottom → D2 → R<sub>L</sub> (+ to −) → D3 → top.</li>\n<li>In both half-cycles, current through R<sub>L</sub> flows in the <b>same direction</b> → full-wave output.</li>\n<li>In each half-cycle <b>two diodes conduct in series</b>, so the total drop is 2 × 0.7 = 1.4 V.</li>\n</ul>\n<h4>Formulas</h4>\n<p>V<sub>dc</sub> = 2V<sub>m</sub>/π, I<sub>dc</sub> = 2I<sub>m</sub>/π, I<sub>rms</sub> = I<sub>m</sub>/√2, ripple factor = <b>0.482</b>, efficiency = <b>81.2%</b>, output frequency = <b>2f</b> (same as centre-tap).</p>\n<p><b>PIV = V<sub>m</sub></b> (each reverse-biased diode sees only V<sub>m</sub>), <b>TUF = 0.812</b>.</p>\n<p>Practical: V<sub>dc</sub> = 2(V<sub>m</sub> − 1.4)/π for Si diodes.</p>\n<h4>Advantages</h4>\n<ul>\n<li><b>No centre-tapped transformer</b> needed → smaller and cheaper transformer.</li>\n<li>PIV is only <b>V<sub>m</sub></b> (half that of centre-tap).</li>\n<li>Highest TUF (0.812); output voltage double that of centre-tap for the same transformer.</li>\n<li>Readily available as a single package (bridge IC, e.g. W10M, KBPC).</li>\n</ul>\n<h4>Disadvantages</h4>\n<ul>\n<li>Needs <b>four diodes</b>.</li>\n<li>Two diodes conduct at a time → <b>1.4 V drop</b>, so not good for very low voltage supplies.</li>\n</ul>\n<p><b>Applications:</b> most DC power supplies, mobile chargers, adapters, battery chargers, SMPS input stage.</p>", "gu": "<h4>Circuit</h4>\n<p>ચાર diodes <b>D1, D2, D3, D4</b> ને <b>Bridge</b> સ્વરૂપમાં જોડાય છે. AC secondary એક diagonal પર અને load R<sub>L</sub> બીજા diagonal પર જોડાય છે. <b>Centre tap ની જરૂર નથી</b> (આકૃતિ જુઓ).</p>\n<h4>કાર્ય</h4>\n<ul>\n<li><b>Positive half-cycle:</b> Secondary નો ઉપરનો છેડો positive → <b>D1 અને D4 forward biased</b> (ON); D2 અને D3 OFF. Current: ઉપર → D1 → R<sub>L</sub> (+ થી −) → D4 → નીચે.</li>\n<li><b>Negative half-cycle:</b> Secondary નો નીચેનો છેડો positive → <b>D2 અને D3 ON</b>; D1 અને D4 OFF. Current: નીચે → D2 → R<sub>L</sub> (+ થી −) → D3 → ઉપર.</li>\n<li>બંને half-cycles માં R<sub>L</sub> માંથી current <b>એક જ દિશામાં</b> વહે છે → full-wave output.</li>\n<li>દરેક half-cycle માં <b>બે diodes series માં conduction</b> કરે છે, તેથી કુલ drop 2 × 0.7 = 1.4 V.</li>\n</ul>\n<h4>સૂત્રો</h4>\n<p>V<sub>dc</sub> = 2V<sub>m</sub>/π, I<sub>dc</sub> = 2I<sub>m</sub>/π, I<sub>rms</sub> = I<sub>m</sub>/√2, ripple factor = <b>0.482</b>, efficiency = <b>81.2%</b>, output frequency = <b>2f</b> (centre-tap જેવું જ).</p>\n<p><b>PIV = V<sub>m</sub></b> (દરેક reverse-biased diode પર ફક્ત V<sub>m</sub>), <b>TUF = 0.812</b>.</p>\n<p>વ્યવહારમાં: Si diodes માટે V<sub>dc</sub> = 2(V<sub>m</sub> − 1.4)/π.</p>\n<h4>ફાયદા</h4>\n<ul>\n<li><b>Centre-tapped transformer ની જરૂર નથી</b> → નાનું અને સસ્તું transformer.</li>\n<li>PIV ફક્ત <b>V<sub>m</sub></b> (centre-tap કરતાં અડધો).</li>\n<li>સૌથી વધુ TUF (0.812); સમાન transformer માટે output voltage centre-tap કરતાં બમણો.</li>\n<li>એક જ package (bridge IC, દા.ત. W10M, KBPC) તરીકે સહેલાઈથી મળે.</li>\n</ul>\n<h4>ગેરફાયદા</h4>\n<ul>\n<li><b>ચાર diodes</b> જરૂરી.</li>\n<li>એક સાથે બે diodes conduction કરે → <b>1.4 V drop</b>, તેથી ખૂબ ઓછા voltage ના supply માટે યોગ્ય નથી.</li>\n</ul>\n<p><b>ઉપયોગો:</b> મોટાભાગના DC power supplies, mobile chargers, adapters, battery chargers, SMPS નો input stage.</p>"}, "diagram": "u3_bridge", "examples": ["u3n8"]}, {"h": {"en": "3.6.7 Comparison of Rectifiers", "gu": "3.6.7 Rectifiers ની સરખામણી"}, "body": {"en": "<table>\n<tr><th>Parameter</th><th>Half-wave</th><th>Centre-tap FW</th><th>Bridge FW</th></tr>\n<tr><td>No. of diodes</td><td>1</td><td>2</td><td>4</td></tr>\n<tr><td>Transformer</td><td>Ordinary (optional)</td><td>Centre-tapped</td><td>Ordinary (optional)</td></tr>\n<tr><td>V<sub>dc</sub></td><td>V<sub>m</sub>/π = 0.318 V<sub>m</sub></td><td>2V<sub>m</sub>/π = 0.636 V<sub>m</sub></td><td>2V<sub>m</sub>/π = 0.636 V<sub>m</sub></td></tr>\n<tr><td>I<sub>rms</sub></td><td>I<sub>m</sub>/2</td><td>I<sub>m</sub>/√2</td><td>I<sub>m</sub>/√2</td></tr>\n<tr><td>Ripple factor</td><td>1.21</td><td>0.482</td><td>0.482</td></tr>\n<tr><td>Max. efficiency</td><td>40.6%</td><td>81.2%</td><td>81.2%</td></tr>\n<tr><td>PIV of diode</td><td>V<sub>m</sub></td><td>2V<sub>m</sub></td><td>V<sub>m</sub></td></tr>\n<tr><td>Output frequency</td><td>f (50 Hz)</td><td>2f (100 Hz)</td><td>2f (100 Hz)</td></tr>\n<tr><td>TUF</td><td>0.287</td><td>0.693</td><td>0.812</td></tr>\n<tr><td>Diodes conducting per half-cycle</td><td>1 (only in +ve half)</td><td>1</td><td>2</td></tr>\n<tr><td>Cost / size</td><td>Lowest</td><td>Highest (CT transformer)</td><td>Medium</td></tr>\n</table>\n<p><b>Conclusion:</b> The bridge rectifier is the most widely used because it needs no centre tap, has low PIV and the highest TUF.</p>", "gu": "<table>\n<tr><th>Parameter</th><th>Half-wave</th><th>Centre-tap FW</th><th>Bridge FW</th></tr>\n<tr><td>Diodes ની સંખ્યા</td><td>1</td><td>2</td><td>4</td></tr>\n<tr><td>Transformer</td><td>સામાન્ય (વૈકલ્પિક)</td><td>Centre-tapped</td><td>સામાન્ય (વૈકલ્પિક)</td></tr>\n<tr><td>V<sub>dc</sub></td><td>V<sub>m</sub>/π = 0.318 V<sub>m</sub></td><td>2V<sub>m</sub>/π = 0.636 V<sub>m</sub></td><td>2V<sub>m</sub>/π = 0.636 V<sub>m</sub></td></tr>\n<tr><td>I<sub>rms</sub></td><td>I<sub>m</sub>/2</td><td>I<sub>m</sub>/√2</td><td>I<sub>m</sub>/√2</td></tr>\n<tr><td>Ripple factor</td><td>1.21</td><td>0.482</td><td>0.482</td></tr>\n<tr><td>મહત્તમ efficiency</td><td>40.6%</td><td>81.2%</td><td>81.2%</td></tr>\n<tr><td>Diode નો PIV</td><td>V<sub>m</sub></td><td>2V<sub>m</sub></td><td>V<sub>m</sub></td></tr>\n<tr><td>Output frequency</td><td>f (50 Hz)</td><td>2f (100 Hz)</td><td>2f (100 Hz)</td></tr>\n<tr><td>TUF</td><td>0.287</td><td>0.693</td><td>0.812</td></tr>\n<tr><td>દરેક half-cycle માં conduction કરતા diodes</td><td>1 (ફક્ત +ve half માં)</td><td>1</td><td>2</td></tr>\n<tr><td>કિંમત / કદ</td><td>સૌથી ઓછું</td><td>સૌથી વધુ (CT transformer)</td><td>મધ્યમ</td></tr>\n</table>\n<p><b>નિષ્કર્ષ:</b> Bridge rectifier સૌથી વધુ વપરાય છે કારણ કે તેમાં centre tap ની જરૂર નથી, PIV ઓછો છે અને TUF સૌથી વધુ છે.</p>"}}, {"h": {"en": "Key Points – 3.6", "gu": "મુખ્ય મુદ્દા – 3.6"}, "body": {"en": "<ul>\n<li><b>Rectifier</b> converts AC → pulsating DC using the unidirectional property of diodes.</li>\n<li>DC power supply: Transformer → Rectifier → Filter → Regulator.</li>\n<li><b>HWR:</b> 1 diode, V<sub>dc</sub> = V<sub>m</sub>/π, r = 1.21, η = 40.6%, PIV = V<sub>m</sub>, f<sub>out</sub> = f.</li>\n<li><b>Centre-tap FWR:</b> 2 diodes + CT transformer, V<sub>dc</sub> = 2V<sub>m</sub>/π, r = 0.482, η = 81.2%, PIV = 2V<sub>m</sub>, f<sub>out</sub> = 2f.</li>\n<li><b>Bridge:</b> 4 diodes, no CT, same V<sub>dc</sub>, r, η as CT; PIV = V<sub>m</sub>; TUF 0.812; 1.4 V drop.</li>\n<li>Ripple factor r = √[(I<sub>rms</sub>/I<sub>dc</sub>)² − 1]; lower is better.</li>\n<li>Efficiency η = P<sub>dc</sub>/P<sub>ac</sub>; higher is better.</li>\n</ul>", "gu": "<ul>\n<li><b>Rectifier</b> diodes ના unidirectional ગુણધર્મથી AC → pulsating DC માં ફેરવે.</li>\n<li>DC power supply: Transformer → Rectifier → Filter → Regulator.</li>\n<li><b>HWR:</b> 1 diode, V<sub>dc</sub> = V<sub>m</sub>/π, r = 1.21, η = 40.6%, PIV = V<sub>m</sub>, f<sub>out</sub> = f.</li>\n<li><b>Centre-tap FWR:</b> 2 diodes + CT transformer, V<sub>dc</sub> = 2V<sub>m</sub>/π, r = 0.482, η = 81.2%, PIV = 2V<sub>m</sub>, f<sub>out</sub> = 2f.</li>\n<li><b>Bridge:</b> 4 diodes, CT નહીં, V<sub>dc</sub>, r, η CT જેવા જ; PIV = V<sub>m</sub>; TUF 0.812; 1.4 V drop.</li>\n<li>Ripple factor r = √[(I<sub>rms</sub>/I<sub>dc</sub>)² − 1]; જેટલું ઓછું એટલું સારું.</li>\n<li>Efficiency η = P<sub>dc</sub>/P<sub>ac</sub>; જેટલું વધુ એટલું સારું.</li>\n</ul>"}, "key": true}]}], "numericals": [{"id": "u3n1", "q": {"en": "A silicon diode has V_F = 0.70 V at I_F = 10 mA and V_F = 0.72 V at I_F = 20 mA. Find (i) static resistance at 10 mA and (ii) dynamic resistance.", "gu": "Silicon diode માં I_F = 10 mA પર V_F = 0.70 V અને I_F = 20 mA પર V_F = 0.72 V છે. (i) 10 mA પર static resistance અને (ii) dynamic resistance શોધો."}, "a": {"en": "<p>(i) Static resistance: R<sub>DC</sub> = V<sub>F</sub> / I<sub>F</sub> = 0.70 / (10 × 10⁻³) = <b>70 Ω</b></p>\n<p>(ii) Dynamic resistance: r<sub>d</sub> = ΔV / ΔI = (0.72 − 0.70) / (20 − 10) × 10⁻³ = 0.02 / 0.01 = <b>2 Ω</b></p>\n<p><i>Dynamic resistance is much smaller than static resistance above the knee.</i></p>", "gu": "<p>(i) Static resistance: R<sub>DC</sub> = V<sub>F</sub> / I<sub>F</sub> = 0.70 / (10 × 10⁻³) = <b>70 Ω</b></p>\n<p>(ii) Dynamic resistance: r<sub>d</sub> = ΔV / ΔI = (0.72 − 0.70) / (20 − 10) × 10⁻³ = 0.02 / 0.01 = <b>2 Ω</b></p>\n<p><i>Knee થી ઉપર dynamic resistance, static resistance કરતાં ઘણો ઓછો હોય છે.</i></p>"}}, {"id": "u3n2", "q": {"en": "A red LED (V_F = 2 V, I_F = 15 mA) is to be operated from a 5 V supply. Find the series resistance and its power rating.", "gu": "લાલ LED (V_F = 2 V, I_F = 15 mA) ને 5 V supply થી ચલાવવો છે. Series resistance અને તેનું power rating શોધો."}, "a": {"en": "<p>R = (V<sub>S</sub> − V<sub>F</sub>) / I<sub>F</sub> = (5 − 2) / (15 × 10⁻³) = 3 / 0.015 = <b>200 Ω</b></p>\n<p>Nearest standard value: <b>220 Ω</b> (gives I = 3/220 ≈ 13.6 mA, safe).</p>\n<p>Power in resistor: P = I²R = (0.015)² × 200 = <b>45 mW</b> → a <b>¼ W</b> resistor is sufficient.</p>", "gu": "<p>R = (V<sub>S</sub> − V<sub>F</sub>) / I<sub>F</sub> = (5 − 2) / (15 × 10⁻³) = 3 / 0.015 = <b>200 Ω</b></p>\n<p>નજીકનું standard મૂલ્ય: <b>220 Ω</b> (I = 3/220 ≈ 13.6 mA, સુરક્ષિત).</p>\n<p>Resistor માં power: P = I²R = (0.015)² × 200 = <b>45 mW</b> → <b>¼ W</b> resistor પૂરતો છે.</p>"}}, {"id": "u3n3", "q": {"en": "In a Zener regulator, V_in = 15 V, V_Z = 10 V, R_S = 250 Ω and R_L = 1 kΩ. Find (i) load current (ii) current through R_S (iii) Zener current (iv) power dissipated in the Zener.", "gu": "Zener regulator માં V_in = 15 V, V_Z = 10 V, R_S = 250 Ω અને R_L = 1 kΩ છે. (i) Load current (ii) R_S માંથી current (iii) Zener current (iv) Zener માં power dissipation શોધો."}, "a": {"en": "<p>V<sub>out</sub> = V<sub>Z</sub> = 10 V</p>\n<p>(i) I<sub>L</sub> = V<sub>Z</sub> / R<sub>L</sub> = 10 / 1000 = <b>10 mA</b></p>\n<p>(ii) I = (V<sub>in</sub> − V<sub>Z</sub>) / R<sub>S</sub> = (15 − 10) / 250 = <b>20 mA</b></p>\n<p>(iii) I<sub>Z</sub> = I − I<sub>L</sub> = 20 − 10 = <b>10 mA</b></p>\n<p>(iv) P<sub>Z</sub> = V<sub>Z</sub> × I<sub>Z</sub> = 10 × 10 × 10⁻³ = <b>100 mW</b></p>", "gu": "<p>V<sub>out</sub> = V<sub>Z</sub> = 10 V</p>\n<p>(i) I<sub>L</sub> = V<sub>Z</sub> / R<sub>L</sub> = 10 / 1000 = <b>10 mA</b></p>\n<p>(ii) I = (V<sub>in</sub> − V<sub>Z</sub>) / R<sub>S</sub> = (15 − 10) / 250 = <b>20 mA</b></p>\n<p>(iii) I<sub>Z</sub> = I − I<sub>L</sub> = 20 − 10 = <b>10 mA</b></p>\n<p>(iv) P<sub>Z</sub> = V<sub>Z</sub> × I<sub>Z</sub> = 10 × 10 × 10⁻³ = <b>100 mW</b></p>"}}, {"id": "u3n4", "q": {"en": "Design a Zener regulator to give 5.1 V output from a 12 V supply. Load current = 20 mA and minimum Zener current = 5 mA. Find R_S.", "gu": "12 V supply માંથી 5.1 V output આપવા Zener regulator ડિઝાઇન કરો. Load current = 20 mA અને ન્યૂનતમ Zener current = 5 mA. R_S શોધો."}, "a": {"en": "<p>R<sub>S</sub> = (V<sub>in</sub> − V<sub>Z</sub>) / (I<sub>Z</sub> + I<sub>L</sub>) = (12 − 5.1) / (5 + 20) × 10⁻³</p>\n<p>= 6.9 / 0.025 = <b>276 Ω</b> → use standard <b>270 Ω</b>.</p>\n<p>Check with 270 Ω: I = 6.9 / 270 = 25.6 mA → I<sub>Z</sub> = 25.6 − 20 = 5.6 mA (&gt; 5 mA ✓).</p>\n<p>Power in R<sub>S</sub> = (6.9)² / 270 ≈ 0.18 W → use a <b>½ W</b> resistor.</p>", "gu": "<p>R<sub>S</sub> = (V<sub>in</sub> − V<sub>Z</sub>) / (I<sub>Z</sub> + I<sub>L</sub>) = (12 − 5.1) / (5 + 20) × 10⁻³</p>\n<p>= 6.9 / 0.025 = <b>276 Ω</b> → standard <b>270 Ω</b> વાપરો.</p>\n<p>270 Ω સાથે ચકાસણી: I = 6.9 / 270 = 25.6 mA → I<sub>Z</sub> = 25.6 − 20 = 5.6 mA (&gt; 5 mA ✓).</p>\n<p>R<sub>S</sub> માં power = (6.9)² / 270 ≈ 0.18 W → <b>½ W</b> resistor વાપરો.</p>"}}, {"id": "u3n5", "q": {"en": "A 6.2 V Zener diode has a power rating of 0.5 W. Find the maximum Zener current.", "gu": "6.2 V Zener diode નું power rating 0.5 W છે. મહત્તમ Zener current શોધો."}, "a": {"en": "<p>P<sub>Z</sub> = V<sub>Z</sub> × I<sub>Z(max)</sub></p>\n<p>I<sub>Z(max)</sub> = P<sub>Z</sub> / V<sub>Z</sub> = 0.5 / 6.2 = <b>80.6 mA</b></p>", "gu": "<p>P<sub>Z</sub> = V<sub>Z</sub> × I<sub>Z(max)</sub></p>\n<p>I<sub>Z(max)</sub> = P<sub>Z</sub> / V<sub>Z</sub> = 0.5 / 6.2 = <b>80.6 mA</b></p>"}}, {"id": "u3n6", "q": {"en": "A half-wave rectifier is fed from 230 V, 50 Hz mains through a 10:1 step-down transformer. R_L = 1 kΩ. Assuming an ideal diode, find V_m, V_dc, I_dc, V_rms, PIV and output frequency.", "gu": "Half-wave rectifier ને 230 V, 50 Hz mains થી 10:1 step-down transformer દ્વારા supply મળે છે. R_L = 1 kΩ. Ideal diode માની V_m, V_dc, I_dc, V_rms, PIV અને output frequency શોધો."}, "a": {"en": "<p>Secondary RMS voltage V<sub>s</sub> = 230 / 10 = 23 V</p>\n<p>V<sub>m</sub> = √2 × 23 = <b>32.53 V</b></p>\n<p>V<sub>dc</sub> = V<sub>m</sub> / π = 32.53 / 3.1416 = <b>10.35 V</b></p>\n<p>I<sub>dc</sub> = V<sub>dc</sub> / R<sub>L</sub> = 10.35 / 1000 = <b>10.35 mA</b></p>\n<p>V<sub>rms</sub> = V<sub>m</sub> / 2 = <b>16.26 V</b></p>\n<p>PIV = V<sub>m</sub> = <b>32.53 V</b></p>\n<p>Output frequency = input frequency = <b>50 Hz</b></p>", "gu": "<p>Secondary RMS voltage V<sub>s</sub> = 230 / 10 = 23 V</p>\n<p>V<sub>m</sub> = √2 × 23 = <b>32.53 V</b></p>\n<p>V<sub>dc</sub> = V<sub>m</sub> / π = 32.53 / 3.1416 = <b>10.35 V</b></p>\n<p>I<sub>dc</sub> = V<sub>dc</sub> / R<sub>L</sub> = 10.35 / 1000 = <b>10.35 mA</b></p>\n<p>V<sub>rms</sub> = V<sub>m</sub> / 2 = <b>16.26 V</b></p>\n<p>PIV = V<sub>m</sub> = <b>32.53 V</b></p>\n<p>Output frequency = input frequency = <b>50 Hz</b></p>"}}, {"id": "u3n7", "q": {"en": "A centre-tapped full-wave rectifier uses a 12-0-12 V (RMS) transformer and R_L = 500 Ω. Assuming ideal diodes, find V_dc, I_dc, PIV and ripple frequency (mains 50 Hz).", "gu": "Centre-tapped full-wave rectifier માં 12-0-12 V (RMS) transformer અને R_L = 500 Ω છે. Ideal diodes માની V_dc, I_dc, PIV અને ripple frequency શોધો (mains 50 Hz)."}, "a": {"en": "<p>Each half of the secondary = 12 V RMS → V<sub>m</sub> = √2 × 12 = <b>16.97 V</b></p>\n<p>V<sub>dc</sub> = 2V<sub>m</sub> / π = 2 × 16.97 / 3.1416 = <b>10.80 V</b></p>\n<p>I<sub>dc</sub> = 10.80 / 500 = <b>21.6 mA</b></p>\n<p>PIV = 2V<sub>m</sub> = <b>33.94 V</b></p>\n<p>Ripple frequency = 2f = <b>100 Hz</b></p>", "gu": "<p>Secondary નો દરેક અડધો ભાગ = 12 V RMS → V<sub>m</sub> = √2 × 12 = <b>16.97 V</b></p>\n<p>V<sub>dc</sub> = 2V<sub>m</sub> / π = 2 × 16.97 / 3.1416 = <b>10.80 V</b></p>\n<p>I<sub>dc</sub> = 10.80 / 500 = <b>21.6 mA</b></p>\n<p>PIV = 2V<sub>m</sub> = <b>33.94 V</b></p>\n<p>Ripple frequency = 2f = <b>100 Hz</b></p>"}}, {"id": "u3n8", "q": {"en": "A bridge rectifier is supplied with 12 V RMS from a transformer secondary. R_L = 1 kΩ. Find V_dc (i) with ideal diodes and (ii) with silicon diodes (0.7 V each). Also find PIV.", "gu": "Bridge rectifier ને transformer secondary થી 12 V RMS મળે છે. R_L = 1 kΩ. (i) Ideal diodes સાથે અને (ii) silicon diodes (દરેક 0.7 V) સાથે V_dc શોધો. PIV પણ શોધો."}, "a": {"en": "<p>V<sub>m</sub> = √2 × 12 = 16.97 V</p>\n<p>(i) Ideal: V<sub>dc</sub> = 2V<sub>m</sub>/π = 0.636 × 16.97 = <b>10.80 V</b>, I<sub>dc</sub> = <b>10.8 mA</b></p>\n<p>(ii) Two diodes conduct in series → drop = 1.4 V</p>\n<p>V<sub>m(out)</sub> = 16.97 − 1.4 = 15.57 V → V<sub>dc</sub> = 0.636 × 15.57 = <b>9.91 V</b></p>\n<p>PIV = V<sub>m</sub> ≈ <b>16.97 V</b> (practically V<sub>m</sub> − 0.7 ≈ 16.27 V)</p>", "gu": "<p>V<sub>m</sub> = √2 × 12 = 16.97 V</p>\n<p>(i) Ideal: V<sub>dc</sub> = 2V<sub>m</sub>/π = 0.636 × 16.97 = <b>10.80 V</b>, I<sub>dc</sub> = <b>10.8 mA</b></p>\n<p>(ii) બે diodes series માં conduction કરે → drop = 1.4 V</p>\n<p>V<sub>m(out)</sub> = 16.97 − 1.4 = 15.57 V → V<sub>dc</sub> = 0.636 × 15.57 = <b>9.91 V</b></p>\n<p>PIV = V<sub>m</sub> ≈ <b>16.97 V</b> (વ્યવહારમાં V<sub>m</sub> − 0.7 ≈ 16.27 V)</p>"}}, {"id": "u3n9", "q": {"en": "In a half-wave rectifier the peak load current is 50 mA. Find I_dc, I_rms and the ripple factor.", "gu": "Half-wave rectifier માં peak load current 50 mA છે. I_dc, I_rms અને ripple factor શોધો."}, "a": {"en": "<p>I<sub>dc</sub> = I<sub>m</sub> / π = 50 / 3.1416 = <b>15.92 mA</b></p>\n<p>I<sub>rms</sub> = I<sub>m</sub> / 2 = <b>25 mA</b></p>\n<p>r = √[(I<sub>rms</sub> / I<sub>dc</sub>)² − 1] = √[(25 / 15.92)² − 1] = √(2.467 − 1) = √1.467 = <b>1.21</b></p>\n<p><i>This confirms the standard HWR ripple factor of 1.21.</i></p>", "gu": "<p>I<sub>dc</sub> = I<sub>m</sub> / π = 50 / 3.1416 = <b>15.92 mA</b></p>\n<p>I<sub>rms</sub> = I<sub>m</sub> / 2 = <b>25 mA</b></p>\n<p>r = √[(I<sub>rms</sub> / I<sub>dc</sub>)² − 1] = √[(25 / 15.92)² − 1] = √(2.467 − 1) = √1.467 = <b>1.21</b></p>\n<p><i>આ HWR ના standard ripple factor 1.21 ને ચકાસે છે.</i></p>"}}], "diagrams": [{"id": "u3_pn_junction", "title": {"en": "P-N Junction and Depletion Layer", "gu": "P-N Junction અને Depletion Layer"}, "file": "diagrams/u3_pn_junction.svg"}, {"id": "u3_diode_symbol", "title": {"en": "P-N Junction Diode Symbol", "gu": "P-N Junction Diode નો Symbol"}, "file": "diagrams/u3_diode_symbol.svg"}, {"id": "u3_forward_bias", "title": {"en": "Forward Biased P-N Junction", "gu": "Forward Biased P-N Junction"}, "file": "diagrams/u3_forward_bias.svg"}, {"id": "u3_reverse_bias", "title": {"en": "Reverse Biased P-N Junction", "gu": "Reverse Biased P-N Junction"}, "file": "diagrams/u3_reverse_bias.svg"}, {"id": "u3_vi_circuit", "title": {"en": "Circuit for Diode V-I Characteristics", "gu": "Diode V-I Characteristics માટેનો Circuit"}, "file": "diagrams/u3_vi_circuit.svg"}, {"id": "u3_vi_char", "title": {"en": "V-I Characteristics of P-N Diode", "gu": "P-N Diode ની V-I Characteristics"}, "file": "diagrams/u3_vi_char.svg"}, {"id": "u3_zener_char", "title": {"en": "Zener Diode V-I Characteristics", "gu": "Zener Diode ની V-I Characteristics"}, "file": "diagrams/u3_zener_char.svg"}, {"id": "u3_zener_regulator", "title": {"en": "Zener Diode as Voltage Regulator", "gu": "Voltage Regulator તરીકે Zener Diode"}, "file": "diagrams/u3_zener_regulator.svg"}, {"id": "u3_varactor", "title": {"en": "Varactor Diode – Symbol and C-V Curve", "gu": "Varactor Diode – Symbol અને C-V Curve"}, "file": "diagrams/u3_varactor.svg"}, {"id": "u3_photodiode", "title": {"en": "Photodiode – Symbol and Characteristics", "gu": "Photodiode – Symbol અને Characteristics"}, "file": "diagrams/u3_photodiode.svg"}, {"id": "u3_led", "title": {"en": "Light Emitting Diode (LED)", "gu": "Light Emitting Diode (LED)"}, "file": "diagrams/u3_led.svg"}, {"id": "u3_multicolour_led", "title": {"en": "Multicolour LEDs (Bi-colour and RGB)", "gu": "Multicolour LEDs (Bi-colour અને RGB)"}, "file": "diagrams/u3_multicolour_led.svg"}, {"id": "u3_hwr", "title": {"en": "Half-Wave Rectifier with Waveforms", "gu": "Waveforms સાથે Half-Wave Rectifier"}, "file": "diagrams/u3_hwr.svg"}, {"id": "u3_fwr_ct", "title": {"en": "Centre-Tap Full-Wave Rectifier with Waveforms", "gu": "Waveforms સાથે Centre-Tap Full-Wave Rectifier"}, "file": "diagrams/u3_fwr_ct.svg"}, {"id": "u3_bridge", "title": {"en": "Full-Wave Bridge Rectifier with Waveforms", "gu": "Waveforms સાથે Full-Wave Bridge Rectifier"}, "file": "diagrams/u3_bridge.svg"}], "equations": [{"title": {"en": "P-N Junction Diode", "gu": "P-N Junction Diode"}, "items": [{"name": {"en": "Barrier potential / knee voltage", "gu": "Barrier potential / knee voltage"}, "f": "V<sub>K</sub> ≈ 0.7 V (Si), 0.3 V (Ge)", "terms": {"en": "Decreases ≈ 2 mV per °C rise", "gu": "દર °C વધારે ≈ 2 mV ઘટે"}}, {"name": {"en": "Diode current equation", "gu": "Diode current equation"}, "f": "I = I₀ (e<sup>V/ηV<sub>T</sub></sup> − 1)", "terms": {"en": "I₀ = reverse saturation current, V_T ≈ 26 mV at 300 K, η = 1 (Ge), 2 (Si)", "gu": "I₀ = reverse saturation current, 300 K પર V_T ≈ 26 mV, η = 1 (Ge), 2 (Si)"}}, {"name": {"en": "Static (DC) resistance", "gu": "Static (DC) resistance"}, "f": "R<sub>DC</sub> = V<sub>F</sub> / I<sub>F</sub>", "terms": {"en": "At an operating point", "gu": "કોઈ operating point પર"}}, {"name": {"en": "Dynamic (AC) resistance", "gu": "Dynamic (AC) resistance"}, "f": "r<sub>d</sub> = ΔV<sub>F</sub> / ΔI<sub>F</sub> ≈ 26 mV / I<sub>F</sub>", "terms": {"en": "Above the knee; few ohms", "gu": "Knee થી ઉપર; થોડા ohms"}}, {"name": {"en": "Diode power dissipation", "gu": "Diode power dissipation"}, "f": "P<sub>D</sub> = V<sub>F</sub> × I<sub>F</sub>", "terms": {"en": "Must be below rated value", "gu": "Rated મૂલ્ય કરતાં ઓછું હોવું જોઈએ"}}]}, {"title": {"en": "Zener and Special Diodes", "gu": "Zener અને Special Diodes"}, "items": [{"name": {"en": "Zener power rating", "gu": "Zener power rating"}, "f": "P<sub>Z</sub> = V<sub>Z</sub> × I<sub>Z(max)</sub>", "terms": {"en": "Gives maximum safe Zener current", "gu": "મહત્તમ સુરક્ષિત Zener current આપે"}}, {"name": {"en": "Regulator currents", "gu": "Regulator currents"}, "f": "I = I<sub>Z</sub> + I<sub>L</sub>", "terms": {"en": "I = current through R_S, I_L = V_Z / R_L", "gu": "I = R_S માંથી current, I_L = V_Z / R_L"}}, {"name": {"en": "Series current", "gu": "Series current"}, "f": "I = (V<sub>in</sub> − V<sub>Z</sub>) / R<sub>S</sub>", "terms": {"en": "Output V_out = V_Z", "gu": "Output V_out = V_Z"}}, {"name": {"en": "Series resistor design", "gu": "Series resistor design"}, "f": "R<sub>S</sub> = (V<sub>in</sub> − V<sub>Z</sub>) / (I<sub>Z</sub> + I<sub>L</sub>)", "terms": {"en": "Keep I_Z between I_Z(min) and I_Z(max)", "gu": "I_Z ને I_Z(min) અને I_Z(max) વચ્ચે રાખો"}}, {"name": {"en": "Zener resistance", "gu": "Zener resistance"}, "f": "r<sub>Z</sub> = ΔV<sub>Z</sub> / ΔI<sub>Z</sub>", "terms": {"en": "Very small (ideal = 0)", "gu": "ખૂબ ઓછો (ideal = 0)"}}, {"name": {"en": "Varactor capacitance", "gu": "Varactor capacitance"}, "f": "C<sub>T</sub> = εA / W,  C<sub>T</sub> ∝ 1 / √V<sub>R</sub>", "terms": {"en": "W = depletion width, increases with V_R", "gu": "W = depletion width, V_R સાથે વધે"}}, {"name": {"en": "LED series resistor", "gu": "LED series resistor"}, "f": "R = (V<sub>S</sub> − V<sub>F</sub>) / I<sub>F</sub>", "terms": {"en": "V_F = 1.8–3.3 V, I_F = 10–20 mA", "gu": "V_F = 1.8–3.3 V, I_F = 10–20 mA"}}]}, {"title": {"en": "Rectifiers", "gu": "Rectifiers"}, "items": [{"name": {"en": "Peak voltage from RMS", "gu": "RMS થી Peak voltage"}, "f": "V<sub>m</sub> = √2 × V<sub>rms</sub>", "terms": {"en": "Secondary peak voltage", "gu": "Secondary નો peak voltage"}}, {"name": {"en": "Peak load current", "gu": "Peak load current"}, "f": "I<sub>m</sub> = V<sub>m</sub> / (r<sub>f</sub> + R<sub>L</sub>)", "terms": {"en": "r_f = diode forward resistance", "gu": "r_f = diode forward resistance"}}, {"name": {"en": "Ripple factor (general)", "gu": "Ripple factor (સામાન્ય)"}, "f": "r = √[(I<sub>rms</sub> / I<sub>dc</sub>)² − 1]", "terms": {"en": "Lower is better", "gu": "જેટલું ઓછું એટલું સારું"}}, {"name": {"en": "Efficiency (general)", "gu": "Efficiency (સામાન્ય)"}, "f": "η = P<sub>dc</sub> / P<sub>ac</sub> = I<sub>dc</sub>²R<sub>L</sub> / I<sub>rms</sub>²(r<sub>f</sub> + R<sub>L</sub>)", "terms": {"en": "Higher is better", "gu": "જેટલું વધુ એટલું સારું"}}, {"name": {"en": "Half-wave: DC values", "gu": "Half-wave: DC મૂલ્યો"}, "f": "V<sub>dc</sub> = V<sub>m</sub>/π,  I<sub>dc</sub> = I<sub>m</sub>/π", "terms": {"en": "0.318 × peak", "gu": "0.318 × peak"}}, {"name": {"en": "Half-wave: RMS and figures", "gu": "Half-wave: RMS અને આંકડા"}, "f": "I<sub>rms</sub> = I<sub>m</sub>/2;  r = 1.21;  η = 40.6%;  PIV = V<sub>m</sub>", "terms": {"en": "Output frequency = f; TUF = 0.287", "gu": "Output frequency = f; TUF = 0.287"}}, {"name": {"en": "Full-wave: DC values", "gu": "Full-wave: DC મૂલ્યો"}, "f": "V<sub>dc</sub> = 2V<sub>m</sub>/π,  I<sub>dc</sub> = 2I<sub>m</sub>/π", "terms": {"en": "0.636 × peak (CT and bridge)", "gu": "0.636 × peak (CT અને bridge)"}}, {"name": {"en": "Full-wave: RMS and figures", "gu": "Full-wave: RMS અને આંકડા"}, "f": "I<sub>rms</sub> = I<sub>m</sub>/√2;  r = 0.482;  η = 81.2%", "terms": {"en": "Output frequency = 2f", "gu": "Output frequency = 2f"}}, {"name": {"en": "PIV: centre-tap vs bridge", "gu": "PIV: centre-tap અને bridge"}, "f": "PIV<sub>CT</sub> = 2V<sub>m</sub>,  PIV<sub>bridge</sub> = V<sub>m</sub>", "terms": {"en": "TUF: CT 0.693, bridge 0.812", "gu": "TUF: CT 0.693, bridge 0.812"}}, {"name": {"en": "Bridge with Si diodes", "gu": "Si diodes સાથે bridge"}, "f": "V<sub>dc</sub> = 2(V<sub>m</sub> − 1.4)/π", "terms": {"en": "Two diodes conduct in series", "gu": "બે diodes series માં conduction કરે"}}]}], "viva": [{"title": {"en": "P-N Junction and Biasing", "gu": "P-N Junction અને Biasing"}, "items": [{"q": {"en": "What is a P-N junction?", "gu": "P-N junction એટલે શું?"}, "a": {"en": "The boundary formed when P-type and N-type semiconductors are joined in a single crystal.", "gu": "એક જ crystal માં P-type અને N-type semiconductor જોડાય ત્યારે બનતી સીમા."}}, {"q": {"en": "What is depletion layer?", "gu": "Depletion layer એટલે શું?"}, "a": {"en": "The region near the junction that has no free charge carriers, only immobile ions.", "gu": "Junction નજીકનો વિસ્તાર જેમાં free charge carriers નથી, ફક્ત immobile ions છે."}}, {"q": {"en": "What is the barrier potential of Si and Ge?", "gu": "Si અને Ge નો barrier potential કેટલો છે?"}, "a": {"en": "Si ≈ 0.7 V and Ge ≈ 0.3 V.", "gu": "Si ≈ 0.7 V અને Ge ≈ 0.3 V."}}, {"q": {"en": "What is knee voltage?", "gu": "Knee voltage એટલે શું?"}, "a": {"en": "The forward voltage at which diode current starts increasing rapidly.", "gu": "જે forward voltage પર diode current ઝડપથી વધવા લાગે."}}, {"q": {"en": "What is biasing?", "gu": "Biasing એટલે શું?"}, "a": {"en": "Applying an external DC voltage to set the operating condition of a device.", "gu": "Device ની કાર્ય સ્થિતિ નક્કી કરવા બાહ્ય DC voltage લગાવવો."}}, {"q": {"en": "What happens to the depletion layer in forward bias?", "gu": "Forward bias માં depletion layer નું શું થાય?"}, "a": {"en": "It becomes narrow.", "gu": "તે સાંકડું થાય છે."}}, {"q": {"en": "What happens to the depletion layer in reverse bias?", "gu": "Reverse bias માં depletion layer નું શું થાય?"}, "a": {"en": "It becomes wide.", "gu": "તે પહોળું થાય છે."}}, {"q": {"en": "Why does a small current flow in reverse bias?", "gu": "Reverse bias માં નાનો current કેમ વહે છે?"}, "a": {"en": "Due to thermally generated minority carriers (reverse saturation current).", "gu": "ઉષ્માથી બનેલા minority carriers ને કારણે (reverse saturation current)."}}, {"q": {"en": "How is the cathode of a diode identified?", "gu": "Diode નો cathode કેવી રીતે ઓળખાય?"}, "a": {"en": "By the silver/white band printed on the body.", "gu": "Body પર છાપેલા silver/સફેદ band થી."}}, {"q": {"en": "What is PIV?", "gu": "PIV એટલે શું?"}, "a": {"en": "Peak Inverse Voltage – the maximum reverse voltage a diode can withstand without breakdown.", "gu": "Peak Inverse Voltage – breakdown વિના diode સહન કરી શકે તેવો મહત્તમ reverse voltage."}}, {"q": {"en": "What is the effect of temperature on reverse saturation current?", "gu": "Reverse saturation current પર તાપમાનની અસર શું છે?"}, "a": {"en": "It approximately doubles for every 10 °C rise.", "gu": "દર 10 °C વધારે તે લગભગ બમણો થાય છે."}}]}, {"title": {"en": "Zener and Special Diodes", "gu": "Zener અને Special Diodes"}, "items": [{"q": {"en": "What is a Zener diode?", "gu": "Zener diode એટલે શું?"}, "a": {"en": "A heavily doped Si diode designed to operate in reverse breakdown, keeping voltage constant.", "gu": "Reverse breakdown માં કામ કરી voltage અચળ રાખવા બનાવેલો વધુ doped Si diode."}}, {"q": {"en": "In which bias is a Zener used as a regulator?", "gu": "Regulator તરીકે Zener કયા bias માં વપરાય?"}, "a": {"en": "Reverse bias.", "gu": "Reverse bias."}}, {"q": {"en": "Difference between Zener and avalanche breakdown?", "gu": "Zener અને avalanche breakdown વચ્ચે તફાવત?"}, "a": {"en": "Zener: heavy doping, below 5 V, field breaks bonds. Avalanche: light doping, above 6 V, collision (impact ionisation).", "gu": "Zener: વધુ doping, 5 V થી નીચે, field bonds તોડે. Avalanche: ઓછું doping, 6 V થી ઉપર, અથડામણ (impact ionisation)."}}, {"q": {"en": "Why is a series resistor used with a Zener?", "gu": "Zener સાથે series resistor કેમ વપરાય?"}, "a": {"en": "To limit the current below I_Z(max) and to drop the extra voltage.", "gu": "Current ને I_Z(max) થી નીચે રાખવા અને વધારાનો voltage drop કરવા."}}, {"q": {"en": "What is a varactor diode?", "gu": "Varactor diode એટલે શું?"}, "a": {"en": "A reverse-biased diode used as a voltage-controlled variable capacitor.", "gu": "Voltage-controlled variable capacitor તરીકે વપરાતો reverse-biased diode."}}, {"q": {"en": "What happens to varactor capacitance when reverse voltage increases?", "gu": "Reverse voltage વધે ત્યારે varactor capacitance નું શું થાય?"}, "a": {"en": "It decreases, because the depletion width increases.", "gu": "તે ઘટે છે, કારણ કે depletion width વધે છે."}}, {"q": {"en": "In which bias is a photodiode operated?", "gu": "Photodiode કયા bias માં ચલાવાય?"}, "a": {"en": "Reverse bias.", "gu": "Reverse bias."}}, {"q": {"en": "What is dark current?", "gu": "Dark current એટલે શું?"}, "a": {"en": "The small reverse current of a photodiode when no light falls on it.", "gu": "Photodiode પર પ્રકાશ ન પડે ત્યારે વહેતો નાનો reverse current."}}, {"q": {"en": "Why is Si not used for LEDs?", "gu": "LED માટે Si કેમ વપરાતું નથી?"}, "a": {"en": "Si has an indirect band gap; energy is released mostly as heat, not light.", "gu": "Si માં indirect band gap છે; ઊર્જા મુખ્યત્વે પ્રકાશ નહીં પરંતુ ઉષ્મા તરીકે છૂટે છે."}}, {"q": {"en": "Which material gives a blue LED?", "gu": "વાદળી LED કયા material થી બને?"}, "a": {"en": "InGaN (Indium Gallium Nitride).", "gu": "InGaN (Indium Gallium Nitride)."}}, {"q": {"en": "How do you identify the anode of an LED?", "gu": "LED નો anode કેવી રીતે ઓળખાય?"}, "a": {"en": "The longer leg is the anode; the flat edge marks the cathode.", "gu": "લાંબો પગ anode છે; સપાટ ધાર cathode દર્શાવે છે."}}, {"q": {"en": "How many leads does an RGB LED have?", "gu": "RGB LED માં કેટલા leads હોય?"}, "a": {"en": "Four – R, G, B and one common (anode or cathode).", "gu": "ચાર – R, G, B અને એક common (anode અથવા cathode)."}}]}, {"title": {"en": "Rectifiers", "gu": "Rectifiers"}, "items": [{"q": {"en": "What is a rectifier?", "gu": "Rectifier એટલે શું?"}, "a": {"en": "A circuit that converts AC into pulsating DC.", "gu": "AC ને pulsating DC માં ફેરવતો circuit."}}, {"q": {"en": "What is ripple factor?", "gu": "Ripple factor એટલે શું?"}, "a": {"en": "Ratio of RMS value of AC component to DC value of the output.", "gu": "Output ના AC ઘટકના RMS મૂલ્ય અને DC મૂલ્યનો ગુણોત્તર."}}, {"q": {"en": "Ripple factor of half-wave and full-wave rectifiers?", "gu": "Half-wave અને full-wave rectifier નો ripple factor?"}, "a": {"en": "HWR = 1.21, FWR = 0.482.", "gu": "HWR = 1.21, FWR = 0.482."}}, {"q": {"en": "Maximum efficiency of HWR and FWR?", "gu": "HWR અને FWR ની મહત્તમ efficiency?"}, "a": {"en": "HWR = 40.6%, FWR = 81.2%.", "gu": "HWR = 40.6%, FWR = 81.2%."}}, {"q": {"en": "PIV of a centre-tap rectifier diode?", "gu": "Centre-tap rectifier ના diode નો PIV?"}, "a": {"en": "2V_m.", "gu": "2V_m."}}, {"q": {"en": "PIV of a bridge rectifier diode?", "gu": "Bridge rectifier ના diode નો PIV?"}, "a": {"en": "V_m.", "gu": "V_m."}}, {"q": {"en": "Output frequency of a full-wave rectifier with 50 Hz input?", "gu": "50 Hz input સાથે full-wave rectifier ની output frequency?"}, "a": {"en": "100 Hz.", "gu": "100 Hz."}}, {"q": {"en": "Why is the bridge rectifier most popular?", "gu": "Bridge rectifier સૌથી લોકપ્રિય કેમ છે?"}, "a": {"en": "No centre tap needed, low PIV (V_m), highest TUF (0.812).", "gu": "Centre tap જરૂરી નથી, ઓછો PIV (V_m), સૌથી વધુ TUF (0.812)."}}, {"q": {"en": "How many diodes conduct at a time in a bridge rectifier?", "gu": "Bridge rectifier માં એક સમયે કેટલા diodes conduction કરે?"}, "a": {"en": "Two (in series).", "gu": "બે (series માં)."}}, {"q": {"en": "What is the purpose of a filter after a rectifier?", "gu": "Rectifier પછી filter નો હેતુ શું છે?"}, "a": {"en": "To remove ripples and make the DC smooth.", "gu": "Ripples દૂર કરી DC ને સરળ બનાવવું."}}]}], "exam_questions": [{"q": {"en": "Explain the formation of depletion layer in a P-N junction.", "gu": "P-N junction માં depletion layer ની રચના સમજાવો."}, "marks": 3}, {"q": {"en": "Define: (i) Barrier potential (ii) Knee voltage (iii) PIV.", "gu": "વ્યાખ્યા આપો: (i) Barrier potential (ii) Knee voltage (iii) PIV."}, "marks": ain centre-tapped full-wave rectifier with circuit diagram and waveforms.", "gu": "Circuit diagram અને waveforms સાથે centre-tapped full-wave rectifier સમજાવો."}, "marks": 4}, {"q": {"en": "Explain full-wave bridge rectifier with circuit diagram and waveforms. State its advantages.", "gu": "Circuit diagram અને waveforms સાથે full-wave bridge rectifier સમજાવો. તેના ફાયદા લખો."}, "marks": 7}, {"q": {"en": "Compare half-wave, centre-tap and bridge rectifiers.", "gu": "Half-wave, centre-tap અને bridge rectifiers ની સરખામણી કરો."}, "marks": 4}, {"q": {"en": "Explain Zener diode with its V-I characteristics and use as a voltage regulator.", "gu": "V-I characteristics અને voltage regulator તરીકે ઉપયોગ સાથે Zener diode સમજાવો."}, "marks": 7}]};

const META = {"name": {"en": "Basics of Electronics", "gu": "બેઝિક્સ ઓફ ઇલેક્ટ્રોનિક્સ"}, "code": "DI01000151"};
const S = {lang:'en', tab:'notes'};
const STR = {
 en:{notes:'Notes',diagrams:'Diagrams',equations:'Formulas',viva:'Viva',exam:'Exam Qs',expand:'Expand all',collapse:'Collapse all',
     numericals:'Numericals',ex:'✏️ Solved Example',tapzoom:'Tap diagram to zoom',unit:'Unit',examhead:'Important Exam Questions',
     intro:'weightage',hours:'hours',introd:'Detailed notes as per GTU syllabus with diagrams, formulas, solved numericals and viva.',
     marks:'Marks'},
 gu:{notes:'નોટ્સ',diagrams:'આકૃતિઓ',equations:'સૂત્રો',viva:'વાઈવા',exam:'પરીક્ષા પ્રશ્નો',expand:'બધા ખોલો',collapse:'બધા બંધ કરો',
     numericals:'દાખલા',ex:'✏️ ઉકેલેલો દાખલો',tapzoom:'મોટું જોવા આકૃતિ પર ટેપ કરો',unit:'એકમ',examhead:'મહત્વના પરીક્ષા પ્રશ્નો',
     intro:'વેઇટેજ',hours:'કલાક',introd:'GTU syllabus મુજબ આકૃતિ, સૂત્રો, ઉકેલેલા દાખલા અને viva સાથે વિગતવાર નોટ્સ.',
     marks:'ગુણ'}};
const L = k => STR[S.lang][k];
const t = o => (o && typeof o === 'object') ? (o[S.lang] || o.en) : (o || '');
const chev = '<svg class="chev" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#7B2CD9" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
const dots = '<svg width="22" height="22" viewBox="0 0 24 24" fill="#222"><circle cx="12" cy="5" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="12" cy="19" r="2.2"/></svg>';
const fixTables = h => h.replace(/<table>/g,'<div class="tw"><table>').replace(/<\/table>/g,'</table></div>');
const head = (title, menu=true) => `<div class="sh"><span>${title}</span>${menu?`<button class="more" data-more>${dots}</button><div class="menu"><button data-act="expand">${L('expand')}</button><button data-act="collapse">${L('collapse')}</button></div>`:''}</div>`;
const dgInline = id => `<div class="dg" data-dg="${id}">${SVG[id]}</div><div class="dgc">📐 ${t(U.diagrams.find(d=>d.id===id).title)} · ${L('tapzoom')}</div>`;

const exBox = id => { const n=(U.numericals||[]).find(x=>x.id===id); if(!n) return ''; return `<div class="ex"><div class="et">${L('ex')}</div><div class="eq2">${t(n.q)}</div>${fixTables(t(n.a))}</div>`; };
function notes(){
  let h = `<div class="intro"><b>${t(U.title)}</b><div>${L('unit')} ${U.unit} · ${U.weightage}% ${L('intro')} · ${U.hours} ${L('hours')}</div><div>${L('introd')}</div></div>`;
  U.notes.forEach((sec,si)=>{
    h += `<div class="sec">${head(t(sec.title))}`;
    sec.items.forEach((it,i)=>{
      const open = si===0&&i===0 ? ' open' : '';
      if (it.h) {
        h += `<div class="card${it.key?' key':''}${open}"><div class="q hd"><span class="t">${it.key?'⭐ ':''}${t(it.h)}</span>${chev}</div>
        <div class="a rn" style="padding-left:18px">${fixTables(t(it.body)).replace(/margin:0 0 10px -36px/g,'')}${it.diagram?dgInline(it.diagram):''}${(it.examples||[]).map(exBox).join('')}</div></div>`;
      } else {
        h += `<div class="card${open}"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(it.q)}</span>${chev}</div>
        <div class="a">${fixTables(t(it.a))}${it.diagram?dgInline(it.diagram):''}</div></div>`;
      }
    });
    h += `</div>`;
  });
  return h;
}
function numericals(){
  return `<div class="sec">${head(L('numericals'))}` + (U.numericals||[]).map((n,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(n.q)}</span>${chev}</div><div class="a">${fixTables(t(n.a))}</div></div>`).join('') + `</div>`;
}
function diagrams(){
  return `<div class="sec">${head(L('diagrams'),false)}<div style="height:10px"></div>` + U.diagrams.map((d,i)=>
    `<div class="dcard" data-dg="${d.id}"><div class="h">${i+1}. ${t(d.title)}</div>${SVG[d.id]}</div>`).join('') + `</div>`;
}
function equations(){
  return U.equations.map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><span class="fbox">${e.f}</span></span>${chev}</div>
     <div class="a"><p>${t(e.terms)}</p></div></div>`).join('') + `</div>`).join('');
}
function viva(){
  return U.viva.map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((v,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(v.q)}</span>${chev}</div><div class="a"><p>${t(v.a)}</p></div></div>`).join('') + `</div>`).join('');
}
function exam(){
  return `<div class="sec">${head(L('examhead'),false)}` + U.exam_questions.map((x,i)=>
    `<div class="card"><div class="q" style="cursor:default"><span class="n">${i+1}.</span><span class="t">${t(x.q)}</span><span class="mk">${x.marks} ${L('marks')}</span></div></div>`).join('') + `</div>`;
}
const VIEWS = U.numericals ? {notes, diagrams, equations, numericals, viva, exam} : {notes, diagrams, equations, viva, exam};
function render(){
  document.getElementById('title').textContent = `${L('unit')} ${U.unit}: ${t(U.title)}`;
  document.getElementById('sub').textContent = `${t(META.name)} · ${META.code}`;
  document.getElementById('lang').textContent = S.lang==='en' ? 'ગુ' : 'EN';
  document.getElementById('tabs').innerHTML = Object.keys(VIEWS).map(k=>`<button class="tab${S.tab===k?' on':''}" data-tab="${k}">${L(k)}</button>`).join('');
  document.getElementById('view').innerHTML = VIEWS[S.tab]();
}
let zoom = 1;
function setZoom(z){ zoom = Math.min(4, Math.max(1, z)); const w=document.getElementById('zw'); w.style.width=(zoom*100)+'%'; document.getElementById('zr').textContent=Math.round(zoom*100)+'%'; }
document.addEventListener('click', e=>{
  const q = e.target.closest('.q'); if (q && q.parentElement.querySelector('.a')) { q.parentElement.classList.toggle('open'); return; }
  const tb = e.target.closest('[data-tab]'); if (tb){ S.tab = tb.dataset.tab; render(); window.scrollTo(0,0); return; }
  if (e.target.closest('#lang')){ S.lang = S.lang==='en'?'gu':'en'; render(); return; }
  const m = e.target.closest('[data-more]');
  document.querySelectorAll('.menu.show').forEach(x=>{ if(!m || x!==m.nextElementSibling) x.classList.remove('show'); });
  if (m){ m.nextElementSibling.classList.toggle('show'); return; }
  const act = e.target.closest('[data-act]');
  if (act){ act.closest('.sec').querySelectorAll('.card').forEach(c=>{ if(c.querySelector('.a')) c.classList.toggle('open', act.dataset.act==='expand'); }); act.parentElement.classList.remove('show'); return; }
  const dg = e.target.closest('[data-dg]');
  if (dg){ const id=dg.dataset.dg; document.getElementById('mt').textContent=t(U.diagrams.find(d=>d.id===id).title); document.getElementById('zw').innerHTML=SVG[id]; setZoom(1); document.getElementById('modal').classList.add('show'); return; }
  if (e.target.closest('#mx')) document.getElementById('modal').classList.remove('show');
  if (e.target.closest('#zi')) setZoom(zoom+0.5);
  if (e.target.closest('#zo')) setZoom(zoom-0.5);
  if (e.target.closest('#zr')) setZoom(1);
});
render();
</script></body></html>
