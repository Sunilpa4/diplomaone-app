<script>
const U = {"subject": "DI01000151", "unit": 3, "format": "notes", "title": {"en": "Diodes and Rectifiers", "gu": "Diodes અને Rectifiers"}, "weightage": 30, "hours": 8, "notes": [{"title": {"en": "3.1 P-N Junction", "gu": "3.1 P-N Junction"}, "items": [{"h": {"en": "3.1.1 Formation of P-N Junction", "gu": "3.1.1 P-N Junction ની રચના"}, "body": {"en": "<p>When a <b>P-type</b> semiconductor and an <b>N-type</b> semiconductor are joined in a <b>single crystal</b>, the boundary between them is called a <b>P-N junction</b>. A P-N junction with two metal leads is called a <b>P-N junction diode</b>.</p>\n<p><i>Note:</i> Simply pressing two separate pieces together does not make a junction. It is made in one crystal by processes such as <b>alloying, diffusion</b> or <b>epitaxial growth</b>.</p>\n<h4>What happens at the junction (unbiased)</h4>\n<ol>\n<li>P-side has a large number of <b>holes</b> (majority) and N-side has a large number of <b>free electrons</b> (majority).</li>\n<li>Because of the difference in concentration, <b>diffusion</b> takes place: free electrons move from N-side to P-side, and holes move from P-side to N-side.</li>\n<li>Electrons crossing to the P-side <b>recombine</b> with holes near the junction, and holes crossing to the N-side recombine with electrons.</li>\n<li>After recombination, <b>immobile ions</b> are left near the junction: <b>negative acceptor ions</b> on the P-side and <b>positive donor ions</b> on the N-side.</li>\n<li>These ions produce an <b>electric field</b> (N → P) which opposes further diffusion. Very soon an <b>equilibrium</b> is reached and diffusion stops.</li>\n</ol>\n<p>The region near the junction that now has only immobile ions and <b>no free charge carriers</b> is called the <b>depletion layer</b> (see diagram).</p>", "gu": "<p>જ્યારે <b>P-type</b> અને <b>N-type</b> semiconductor ને <b>એક જ crystal</b> માં જોડવામાં આવે ત્યારે તેમની વચ્ચેની સીમાને <b>P-N junction</b> કહે છે. બે metal leads વાળા P-N junction ને <b>P-N junction diode</b> કહે છે.</p>\n<p><i>નોંધ:</i> બે અલગ ટુકડા ફક્ત દબાવીને જોડવાથી junction બનતું નથી. તે એક જ crystal માં <b>alloying, diffusion</b> અથવા <b>epitaxial growth</b> જેવી પ્રક્રિયાથી બને છે.</p>\n<h4>Junction પર શું થાય છે (unbiased)</h4>\n<ol>\n<li>P-side માં ઘણા <b>holes</b> (majority) અને N-side માં ઘણા <b>free electrons</b> (majority) હોય છે.</li>\n<li>Concentration ના તફાવતને કારણે <b>Diffusion</b> થાય છે: free electrons N-side થી P-side તરફ અને holes P-side થી N-side તરફ જાય છે.</li>\n<li>P-side માં ગયેલા electrons junction નજીક holes સાથે <b>Recombine</b> થાય છે, અને N-side માં ગયેલા holes electrons સાથે recombine થાય છે.</li>\n<li>Recombination પછી junction નજીક <b>Immobile ions</b> (સ્થિર આયન) રહી જાય છે: P-side પર <b>negative acceptor ions</b> અને N-side પર <b>positive donor ions</b>.</li>\n<li>આ ions એક <b>Electric field</b> (N → P) બનાવે છે જે વધુ diffusion નો વિરોધ કરે છે. થોડા સમયમાં <b>Equilibrium</b> (સંતુલન) આવે છે અને diffusion અટકી જાય છે.</li>\n</ol>\n<p>Junction નજીકનો જે વિસ્તાર ફક્ત immobile ions ધરાવે છે અને જેમાં <b>કોઈ free charge carriers નથી</b>, તેને <b>Depletion layer</b> કહે છે (આકૃતિ જુઓ).</p>"}, "diagram": "u3_pn_junction"}, {"h": {"en": "3.1.2 Depletion Layer", "gu": "3.1.2 Depletion Layer"}, "body": {"en": "<p><b>Definition:</b> The thin region on both sides of a P-N junction which is <b>depleted (emptied) of free charge carriers</b> and contains only immobile ions is called the <b>depletion layer</b> (also called <b>depletion region, space-charge region</b> or <b>transition region</b>).</p>\n<h4>Properties of depletion layer</h4>\n<ul>\n<li>It contains <b>no free electrons and no holes</b>, only fixed (immobile) positive and negative ions.</li>\n<li>Because there are no carriers, it behaves like an <b>insulator</b> (very high resistance).</li>\n<li>Its width is very small, about <b>0.5 µm to 1 µm</b> (1 µm = 10⁻⁶ m) in an unbiased diode.</li>\n<li>It extends <b>more into the lightly doped side</b> and less into the heavily doped side, because equal amounts of charge must be uncovered on both sides.</li>\n<li>Width <b>decreases</b> with forward bias and <b>increases</b> with reverse bias.</li>\n<li>The two layers of opposite charge act like the plates of a capacitor → <b>junction (transition) capacitance</b>. This is used in the varactor diode.</li>\n</ul>\n<h4>Factors affecting width</h4>\n<table>\n<tr><th>Factor</th><th>Effect on width</th></tr>\n<tr><td>Higher doping</td><td>Width decreases</td></tr>\n<tr><td>Forward bias</td><td>Width decreases</td></tr>\n<tr><td>Reverse bias</td><td>Width increases</td></tr>\n</table>", "gu": "<p><b>વ્યાખ્યા:</b> P-N junction ની બંને બાજુનો પાતળો વિસ્તાર, જે <b>free charge carriers થી ખાલી (depleted)</b> હોય છે અને જેમાં ફક્ત immobile ions હોય છે, તેને <b>Depletion layer</b> કહે છે (તેને <b>depletion region, space-charge region</b> અથવા <b>transition region</b> પણ કહે છે).</p>\n<h4>Depletion layer ના ગુણધર્મો</h4>\n<ul>\n<li>તેમાં <b>કોઈ free electrons કે holes નથી</b>, ફક્ત સ્થિર (immobile) positive અને negative ions છે.</li>\n<li>Carriers ન હોવાથી તે <b>Insulator</b> (ખૂબ વધુ resistance) જેવું વર્તે છે.</li>\n<li>Unbiased diode માં તેની પહોળાઈ ખૂબ ઓછી, આશરે <b>0.5 µm થી 1 µm</b> (1 µm = 10⁻⁶ m) હોય છે.</li>\n<li>તે <b>ઓછા doped બાજુમાં વધુ</b> અને વધુ doped બાજુમાં ઓછું ફેલાય છે, કારણ કે બંને બાજુ સમાન charge ખુલ્લો થવો જોઈએ.</li>\n<li>Forward bias થી પહોળાઈ <b>ઘટે</b> છે અને reverse bias થી <b>વધે</b> છે.</li>\n<li>વિરુદ્ધ charge ના બે સ્તર capacitor ની plates જેવું કામ કરે છે → <b>Junction (transition) capacitance</b>. Varactor diode માં તેનો ઉપયોગ થાય છે.</li>\n</ul>\n<h4>પહોળાઈ પર અસર કરતા પરિબળો</h4>\n<table>\n<tr><th>પરિબળ</th><th>પહોળાઈ પર અસર</th></tr>\n<tr><td>વધુ Doping</td><td>પહોળાઈ ઘટે</td></tr>\n<tr><td>Forward bias</td><td>પહોળાઈ ઘટે</td></tr>\n<tr><td>Reverse bias</td><td>પહોળાઈ વધે</td></tr>\n</table>"}}, {"h": {"en": "3.1.3 Barrier Potential and Knee Voltage", "gu": "3.1.3 Barrier Potential અને Knee Voltage"}, "body": {"en": "<h4>Barrier potential (V₀)</h4>\n<p>The immobile ions in the depletion layer create a <b>potential difference across the junction</b>. This potential acts as a <b>barrier</b> which stops further movement of majority carriers. It is called the <b>barrier potential</b> or <b>junction potential</b> or <b>potential barrier</b>.</p>\n<ul>\n<li>Silicon (Si): <b>V₀ ≈ 0.7 V</b></li>\n<li>Germanium (Ge): <b>V₀ ≈ 0.3 V</b></li>\n</ul>\n<p>The barrier potential cannot be measured with a voltmeter, because contact potentials at the metal leads cancel it.</p>\n<h4>Factors affecting barrier potential</h4>\n<ul>\n<li><b>Material:</b> Si has a higher value than Ge (larger energy gap).</li>\n<li><b>Doping:</b> Higher doping → slightly higher barrier potential.</li>\n<li><b>Temperature:</b> Barrier potential <b>decreases by about 2 mV for every 1 °C rise</b> in temperature.</li>\n</ul>\n<h4>Knee voltage (cut-in voltage, V<sub>K</sub>)</h4>\n<p><b>Definition:</b> The forward voltage at which the current through the diode starts to <b>increase rapidly</b> is called the <b>knee voltage</b> or <b>cut-in voltage</b> or <b>threshold voltage</b>.</p>\n<ul>\n<li>Below the knee voltage, the barrier is not fully overcome and only a very small current flows.</li>\n<li>Above the knee voltage, current rises sharply (the curve bends like a knee).</li>\n<li>Knee voltage is approximately equal to the barrier potential: <b>Si ≈ 0.7 V, Ge ≈ 0.3 V</b>.</li>\n</ul>", "gu": "<h4>Barrier potential (V₀)</h4>\n<p>Depletion layer માંના immobile ions <b>junction પર potential difference</b> બનાવે છે. આ potential એક <b>અવરોધ (barrier)</b> તરીકે કામ કરે છે જે majority carriers ની વધુ ગતિ અટકાવે છે. તેને <b>Barrier potential</b>, <b>junction potential</b> અથવા <b>potential barrier</b> કહે છે.</p>\n<ul>\n<li>Silicon (Si): <b>V₀ ≈ 0.7 V</b></li>\n<li>Germanium (Ge): <b>V₀ ≈ 0.3 V</b></li>\n</ul>\n<p>Barrier potential voltmeter થી માપી શકાતો નથી, કારણ કે metal leads પરના contact potentials તેને રદ કરે છે.</p>\n<h4>Barrier potential પર અસર કરતા પરિબળો</h4>\n<ul>\n<li><b>Material:</b> Si નું મૂલ્ય Ge કરતાં વધુ છે (વધુ energy gap).</li>\n<li><b>Doping:</b> વધુ doping → થોડો વધુ barrier potential.</li>\n<li><b>તાપમાન:</b> તાપમાનમાં <b>દર 1 °C વધારે barrier potential આશરે 2 mV ઘટે</b> છે.</li>\n</ul>\n<h4>Knee voltage (cut-in voltage, V<sub>K</sub>)</h4>\n<p><b>વ્યાખ્યા:</b> જે forward voltage પર diode માંથી current <b>ઝડપથી વધવા</b> લાગે છે, તેને <b>Knee voltage</b>, <b>cut-in voltage</b> અથવા <b>threshold voltage</b> કહે છે.</p>\n<ul>\n<li>Knee voltage થી નીચે barrier સંપૂર્ણ પાર થતો નથી અને ફક્ત ખૂબ ઓછો current વહે છે.</li>\n<li>Knee voltage થી ઉપર current ઝડપથી વધે છે (curve ઘૂંટણ (knee) જેવો વળે છે).</li>\n<li>Knee voltage લગભગ barrier potential જેટલો હોય છે: <b>Si ≈ 0.7 V, Ge ≈ 0.3 V</b>.</li>\n</ul>"}}, {"h": {"en": "3.1.4 Diode Symbol, Identification and Ratings", "gu": "3.1.4 Diode Symbol, ઓળખ અને Ratings"}, "body": {"en": "<h4>Symbol</h4>\n<ul>\n<li>The <b>arrow (triangle)</b> represents the <b>P-side = Anode (A)</b>.</li>\n<li>The <b>bar (line)</b> represents the <b>N-side = Cathode (K)</b>.</li>\n<li>The arrow shows the direction of <b>conventional current</b> in forward bias (A → K).</li>\n</ul>\n<h4>Identification of terminals</h4>\n<ul>\n<li>A <b>silver/white band</b> printed on the diode body marks the <b>cathode</b>.</li>\n<li>With a <b>multimeter</b> in diode-test mode: if the meter shows about 0.5–0.7 V, the red probe is on the anode. In the reverse direction it shows \"OL\" (open).</li>\n</ul>\n<h4>Important ratings (specifications)</h4>\n<table>\n<tr><th>Rating</th><th>Meaning</th></tr>\n<tr><td>Maximum forward current (I<sub>F(max)</sub>)</td><td>Highest forward current the diode can carry without damage</td></tr>\n<tr><td>Peak Inverse Voltage (PIV)</td><td>Maximum reverse voltage that can be applied without breakdown</td></tr>\n<tr><td>Forward voltage drop (V<sub>F</sub>)</td><td>Voltage across the diode when conducting (Si ≈ 0.7 V)</td></tr>\n<tr><td>Reverse saturation current (I<sub>0</sub>)</td><td>Small current in reverse bias (nA for Si, µA for Ge)</td></tr>\n<tr><td>Maximum power dissipation (P<sub>D</sub>)</td><td>P<sub>D</sub> = V<sub>F</sub> × I<sub>F</sub></td></tr>\n</table>\n<p><b>Example:</b> 1N4007 → I<sub>F(max)</sub> = 1 A, PIV = 1000 V. (1N4001 = 50 V, 1N4004 = 400 V.) 1N4148 is a small-signal switching diode.</p>", "gu": "<h4>Symbol</h4>\n<ul>\n<li><b>Arrow (ત્રિકોણ)</b> એ <b>P-side = Anode (A)</b> દર્શાવે છે.</li>\n<li><b>Bar (રેખા)</b> એ <b>N-side = Cathode (K)</b> દર્શાવે છે.</li>\n<li>Arrow forward bias માં <b>conventional current</b> ની દિશા (A → K) બતાવે છે.</li>\n</ul>\n<h4>Terminals ની ઓળખ</h4>\n<ul>\n<li>Diode ના body પર છાપેલો <b>silver/સફેદ band</b> <b>Cathode</b> દર્શાવે છે.</li>\n<li><b>Multimeter</b> ના diode-test mode માં: જો meter આશરે 0.5–0.7 V બતાવે તો red probe anode પર છે. ઉલટી દિશામાં તે \"OL\" (open) બતાવે છે.</li>\n</ul>\n<h4>મહત્વના Ratings (specifications)</h4>\n<table>\n<tr><th>Rating</th><th>અર્થ</th></tr>\n<tr><td>Maximum forward current (I<sub>F(max)</sub>)</td><td>નુકસાન વિના diode વહન કરી શકે તેટલો મહત્તમ forward current</td></tr>\n<tr><td>Peak Inverse Voltage (PIV)</td><td>Breakdown વિના લગાવી શકાય તેટલો મહત્તમ reverse voltage</td></tr>\n<tr><td>Forward voltage drop (V<sub>F</sub>)</td><td>Conduction વખતે diode પરનો voltage (Si ≈ 0.7 V)</td></tr>\n<tr><td>Reverse saturation current (I<sub>0</sub>)</td><td>Reverse bias માં નાનો current (Si માટે nA, Ge માટે µA)</td></tr>\n<tr><td>Maximum power dissipation (P<sub>D</sub>)</td><td>P<sub>D</sub> = V<sub>F</sub> × I<sub>F</sub></td></tr>\n</table>\n<p><b>ઉદાહરણ:</b> 1N4007 → I<sub>F(max)</sub> = 1 A, PIV = 1000 V. (1N4001 = 50 V, 1N4004 = 400 V.) 1N4148 એ small-signal switching diode છે.</p>"}, "diagram": "u3_diode_symbol"}, {"h": {"en": "Key Points – 3.1", "gu": "મુખ્ય મુદ્દા – 3.1"}, "body": {"en": "<ul>\n<li>P-type + N-type in one crystal → <b>P-N junction</b>; with leads → <b>diode</b>.</li>\n<li>Diffusion + recombination → immobile ions → <b>depletion layer</b> (no free carriers, ~1 µm).</li>\n<li>Depletion layer extends more into the <b>lightly doped</b> side.</li>\n<li><b>Barrier potential:</b> Si 0.7 V, Ge 0.3 V; decreases ≈ 2 mV/°C.</li>\n<li><b>Knee voltage</b> = forward voltage at which current rises sharply (≈ barrier potential).</li>\n<li>Symbol: arrow = Anode (P), bar = Cathode (N); band on body = cathode.</li>\n<li>Main ratings: I<sub>F(max)</sub>, PIV, V<sub>F</sub>, I<sub>0</sub>, P<sub>D</sub>.</li>\n</ul>", "gu": "<ul>\n<li>એક crystal માં P-type + N-type → <b>P-N junction</b>; leads સાથે → <b>Diode</b>.</li>\n<li>Diffusion + recombination → immobile ions → <b>Depletion layer</b> (free carriers નથી, ~1 µm).</li>\n<li>Depletion layer <b>ઓછા doped</b> બાજુમાં વધુ ફેલાય છે.</li>\n<li><b>Barrier potential:</b> Si 0.7 V, Ge 0.3 V; ≈ 2 mV/°C ઘટે.</li>\n<li><b>Knee voltage</b> = જે forward voltage પર current ઝડપથી વધે (≈ barrier potential).</li>\n<li>Symbol: arrow = Anode (P), bar = Cathode (N); body પરનો band = cathode.</li>\n<li>મુખ્ય ratings: I<sub>F(max)</sub>, PIV, V<sub>F</sub>, I<sub>0</sub>, P<sub>D</sub>.</li>\n</ul>"}, "key": true}]}, {"title": {"en": "3.2 Biasing of P-N Junction Diode", "gu": "3.2 P-N Junction Diode નું Biasing"}, "items": [{"h": {"en": "3.2.1 What is Biasing?", "gu": "3.2.1 Biasing એટલે શું?"}, "body": {"en": "<p><b>Biasing</b> means applying an external <b>DC voltage</b> across the terminals of a diode (or any electronic device) to set its operating condition.</p>\n<p>A P-N junction diode can be biased in two ways:</p>\n<ol>\n<li><b>Forward bias:</b> P-side (anode) connected to the <b>positive</b> terminal and N-side (cathode) to the <b>negative</b> terminal of the battery.</li>\n<li><b>Reverse bias:</b> P-side connected to the <b>negative</b> terminal and N-side to the <b>positive</b> terminal.</li>\n</ol>\n<p>A resistor <b>R</b> is always connected in series to <b>limit the current</b>, otherwise a large forward current may damage the diode.</p>", "gu": "<p><b>Biasing</b> એટલે diode (અથવા કોઈપણ electronic device) ના terminals પર તેની કાર્ય સ્થિતિ નક્કી કરવા બાહ્ય <b>DC voltage</b> લગાવવો.</p>\n<p>P-N junction diode ને બે રીતે bias કરી શકાય:</p>\n<ol>\n<li><b>Forward bias:</b> P-side (anode) battery ના <b>positive</b> terminal સાથે અને N-side (cathode) <b>negative</b> terminal સાથે જોડાય.</li>\n<li><b>Reverse bias:</b> P-side <b>negative</b> terminal સાથે અને N-side <b>positive</b> terminal સાથે જોડાય.</li>\n</ol>\n<p><b>Current મર્યાદિત</b> કરવા હંમેશા series માં resistor <b>R</b> જોડાય છે, નહીં તો વધુ forward current diode ને નુકસાન કરી શકે.</p>"}}, {"h": {"en": "3.2.2 Forward Bias", "gu": "3.2.2 Forward Bias"}, "body": {"en": "<p><b>Connection:</b> Positive terminal of battery → P-side; negative terminal → N-side.</p>\n<h4>Working</h4>\n<ol>\n<li>The positive terminal <b>repels holes</b> in the P-region towards the junction, and the negative terminal <b>repels electrons</b> in the N-region towards the junction.</li>\n<li>The applied voltage <b>opposes the barrier potential</b>, so the <b>depletion layer becomes narrow</b>.</li>\n<li>When the applied voltage becomes more than the barrier potential (0.7 V for Si), the barrier is overcome.</li>\n<li>Electrons cross from N to P and holes from P to N, and they recombine. The battery keeps supplying electrons, so a <b>large current (mA)</b> flows continuously.</li>\n<li>The current is due to <b>majority carriers</b>.</li>\n</ol>\n<h4>Result</h4>\n<ul>\n<li>Depletion layer: <b>narrow</b></li>\n<li>Junction resistance: <b>very low</b> (a few ohms)</li>\n<li>Current: <b>large</b>, in <b>mA</b> (increases rapidly after knee voltage)</li>\n<li>Diode acts like a <b>closed (ON) switch</b></li>\n</ul>", "gu": "<p><b>જોડાણ:</b> Battery નો positive terminal → P-side; negative terminal → N-side.</p>\n<h4>કાર્ય</h4>\n<ol>\n<li>Positive terminal P-region ના <b>holes ને junction તરફ ધકેલે</b> છે અને negative terminal N-region ના <b>electrons ને junction તરફ ધકેલે</b> છે.</li>\n<li>લગાવેલો voltage <b>barrier potential નો વિરોધ</b> કરે છે, તેથી <b>depletion layer સાંકડું</b> થાય છે.</li>\n<li>જ્યારે લગાવેલો voltage barrier potential (Si માટે 0.7 V) કરતાં વધે ત્યારે barrier પાર થઈ જાય છે.</li>\n<li>Electrons N થી P અને holes P થી N તરફ જાય છે અને recombine થાય છે. Battery સતત electrons પૂરા પાડે છે, તેથી સતત <b>મોટો current (mA)</b> વહે છે.</li>\n<li>આ current <b>Majority carriers</b> ને કારણે છે.</li>\n</ol>\n<h4>પરિણામ</h4>\n<ul>\n<li>Depletion layer: <b>સાંકડું</b></li>\n<li>Junction resistance: <b>ખૂબ ઓછો</b> (થોડા ohms)</li>\n<li>Current: <b>મોટો</b>, <b>mA</b> માં (knee voltage પછી ઝડપથી વધે)</li>\n<li>Diode <b>બંધ (ON) switch</b> જેવું વર્તે છે</li>\n</ul>"}, "diagram": "u3_forward_bias"}, {"h": {"en": "3.2.3 Reverse Bias", "gu": "3.2.3 Reverse Bias"}, "body": {"en": "<p><b>Connection:</b> Negative terminal of battery → P-side; positive terminal → N-side.</p>\n<h4>Working</h4>\n<ol>\n<li>The negative terminal <b>attracts holes</b> of the P-region away from the junction, and the positive terminal <b>attracts electrons</b> of the N-region away from the junction.</li>\n<li>More immobile ions are uncovered, so the <b>depletion layer becomes wider</b> and the barrier increases.</li>\n<li>Majority carriers cannot cross the junction, so practically <b>no majority current</b> flows.</li>\n<li>However, the <b>minority carriers</b> (electrons in P, holes in N), produced by heat, are pushed across the junction by the applied voltage. This produces a very small current called the <b>reverse saturation current (I₀)</b> or <b>leakage current</b>.</li>\n</ol>\n<h4>Result</h4>\n<ul>\n<li>Depletion layer: <b>wide</b></li>\n<li>Junction resistance: <b>very high</b> (MΩ)</li>\n<li>Current: <b>very small</b> → <b>nA for Si</b>, <b>µA for Ge</b></li>\n<li>I₀ depends on <b>temperature</b>, not on applied voltage (it roughly <b>doubles for every 10 °C rise</b>).</li>\n<li>Diode acts like an <b>open (OFF) switch</b></li>\n</ul>\n<p>If the reverse voltage is increased too much, the diode reaches <b>breakdown</b> and the reverse current increases suddenly (see 3.3.3).</p>", "gu": "<p><b>જોડાણ:</b> Battery નો negative terminal → P-side; positive terminal → N-side.</p>\n<h4>કાર્ય</h4>\n<ol>\n<li>Negative terminal P-region ના <b>holes ને junction થી દૂર ખેંચે</b> છે અને positive terminal N-region ના <b>electrons ને junction થી દૂર ખેંચે</b> છે.</li>\n<li>વધુ immobile ions ખુલ્લા થાય છે, તેથી <b>depletion layer પહોળું</b> થાય છે અને barrier વધે છે.</li>\n<li>Majority carriers junction પાર કરી શકતા નથી, તેથી વ્યવહારમાં <b>કોઈ majority current</b> વહેતો નથી.</li>\n<li>પરંતુ ઉષ્માથી બનેલા <b>Minority carriers</b> (P માં electrons, N માં holes) લગાવેલા voltage થી junction પાર ધકેલાય છે. તેથી ખૂબ નાનો current વહે છે જેને <b>Reverse saturation current (I₀)</b> અથવા <b>leakage current</b> કહે છે.</li>\n</ol>\n<h4>પરિણામ</h4>\n<ul>\n<li>Depletion layer: <b>પહોળું</b></li>\n<li>Junction resistance: <b>ખૂબ વધુ</b> (MΩ)</li>\n<li>Current: <b>ખૂબ નાનો</b> → <b>Si માટે nA</b>, <b>Ge માટે µA</b></li>\n<li>I₀ લગાવેલા voltage પર નહીં પરંતુ <b>તાપમાન</b> પર આધાર રાખે છે (તે લગભગ <b>દર 10 °C વધારે બમણો</b> થાય છે).</li>\n<li>Diode <b>ખુલ્લા (OFF) switch</b> જેવું વર્તે છે</li>\n</ul>\n<p>જો reverse voltage ખૂબ વધારવામાં આવે તો diode <b>Breakdown</b> માં જાય છે અને reverse current અચાનક વધે છે (3.3.3 જુઓ).</p>"}, "diagram": "u3_reverse_bias"}, {"h": {"en": "3.2.4 Comparison: Forward Bias vs Reverse Bias", "gu": "3.2.4 સરખામણી: Forward Bias અને Reverse Bias"}, "body": {"en": "<table>\n<tr><th>Point</th><th>Forward Bias</th><th>Reverse Bias</th></tr>\n<tr><td>Connection</td><td>P → +ve, N → −ve</td><td>P → −ve, N → +ve</td></tr>\n<tr><td>Depletion layer</td><td>Becomes narrow</td><td>Becomes wide</td></tr>\n<tr><td>Potential barrier</td><td>Reduced</td><td>Increased</td></tr>\n<tr><td>Resistance</td><td>Very low (few Ω)</td><td>Very high (MΩ)</td></tr>\n<tr><td>Current</td><td>Large (mA)</td><td>Very small (nA/µA)</td></tr>\n<tr><td>Current due to</td><td>Majority carriers</td><td>Minority carriers</td></tr>\n<tr><td>Voltage across diode</td><td>Small (≈ 0.7 V Si)</td><td>Almost full supply voltage</td></tr>\n<tr><td>Diode acts as</td><td>Closed (ON) switch</td><td>Open (OFF) switch</td></tr>\n</table>\n<p>This property of conducting in one direction only is called <b>unidirectional conduction</b>, and it is the basis of <b>rectification</b>.</p>", "gu": "<table>\n<tr><th>મુદ્દો</th><th>Forward Bias</th><th>Reverse Bias</th></tr>\n<tr><td>જોડાણ</td><td>P → +ve, N → −ve</td><td>P → −ve, N → +ve</td></tr>\n<tr><td>Depletion layer</td><td>સાંકડું થાય</td><td>પહોળું થાય</td></tr>\n<tr><td>Potential barrier</td><td>ઘટે</td><td>વધે</td></tr>\n<tr><td>Resistance</td><td>ખૂબ ઓછો (થોડા Ω)</td><td>ખૂબ વધુ (MΩ)</td></tr>\n<tr><td>Current</td><td>મોટો (mA)</td><td>ખૂબ નાનો (nA/µA)</td></tr>\n<tr><td>Current નું કારણ</td><td>Majority carriers</td><td>Minority carriers</td></tr>\n<tr><td>Diode પરનો voltage</td><td>ઓછો (Si ≈ 0.7 V)</td><td>લગભગ સંપૂર્ણ supply voltage</td></tr>\n<tr><td>Diode નું વર્તન</td><td>બંધ (ON) switch</td><td>ખુલ્લું (OFF) switch</td></tr>\n</table>\n<p>ફક્ત એક જ દિશામાં conduction કરવાના આ ગુણધર્મને <b>Unidirectional conduction</b> કહે છે, અને તે <b>Rectification</b> નો આધાર છે.</p>"}}, {"h": {"en": "Key Points – 3.2", "gu": "મુખ્ય મુદ્દા – 3.2"}, "body": {"en": "<ul>\n<li><b>Biasing</b> = applying external DC voltage to a device.</li>\n<li><b>Forward bias:</b> P to +ve → narrow depletion layer → large current (mA) by majority carriers → ON switch.</li>\n<li><b>Reverse bias:</b> P to −ve → wide depletion layer → tiny current I₀ (nA/µA) by minority carriers → OFF switch.</li>\n<li>Diode conducts only after V > knee voltage (0.7 V Si / 0.3 V Ge).</li>\n<li>I₀ depends on temperature (doubles per 10 °C), not on reverse voltage.</li>\n<li>Diode conducts in one direction only → used for <b>rectification</b>.</li>\n</ul>", "gu": "<ul>\n<li><b>Biasing</b> = device પર બાહ્ય DC voltage લગાવવો.</li>\n<li><b>Forward bias:</b> P ને +ve → સાંકડું depletion layer → majority carriers થી મોટો current (mA) → ON switch.</li>\n<li><b>Reverse bias:</b> P ને −ve → પહોળું depletion layer → minority carriers થી નાનો current I₀ (nA/µA) → OFF switch.</li>\n<li>Diode ફક્ત V > knee voltage (Si 0.7 V / Ge 0.3 V) પછી જ conduction કરે.</li>\n<li>I₀ reverse voltage પર નહીં, તાપમાન પર આધાર રાખે (દર 10 °C એ બમણો).</li>\n<li>Diode ફક્ત એક દિશામાં conduction કરે → <b>Rectification</b> માટે વપરાય.</li>\n</ul>"}, "key": true}]}, {"title": {"en": "3.3 V-I Characteristics of P-N Junction Diode", "gu": "3.3 P-N Junction Diode ની V-I Characteristics"}, "items": [{"h": {"en": "3.3.1 Circuit for V-I Characteristics", "gu": "3.3.1 V-I Characteristics માટેનો Circuit"}, "body": {"en": "<p>The graph of <b>diode current (I)</b> against <b>diode voltage (V)</b> is called the <b>V-I characteristic</b> of the diode.</p>\n<h4>Circuit components</h4>\n<ul>\n<li><b>Variable DC power supply</b> (0–30 V) – to change the applied voltage</li>\n<li><b>Current-limiting resistor R</b> – protects the diode</li>\n<li><b>Milliammeter (mA)</b> in series – measures forward current</li>\n<li><b>Voltmeter (V)</b> in parallel with the diode – measures diode voltage</li>\n</ul>\n<h4>Procedure</h4>\n<ol>\n<li>Connect the circuit in <b>forward bias</b> as shown in the diagram.</li>\n<li>Increase the supply voltage in small steps (0.1 V) and note V<sub>F</sub> and I<sub>F</sub> each time.</li>\n<li>For <b>reverse characteristics</b>, reverse the supply polarity, replace the mA meter with a <b>µA meter</b>, and increase the voltage in steps of 1–2 V. Note V<sub>R</sub> and I<sub>R</sub>.</li>\n<li>Plot V on the X-axis and I on the Y-axis (forward in the first quadrant, reverse in the third quadrant).</li>\n</ol>\n<p><b>Precaution:</b> Do not exceed I<sub>F(max)</sub> in forward bias or PIV in reverse bias.</p>", "gu": "<p><b>Diode current (I)</b> વિરુદ્ધ <b>diode voltage (V)</b> ના આલેખને diode ની <b>V-I characteristic</b> કહે છે.</p>\n<h4>Circuit ના ઘટકો</h4>\n<ul>\n<li><b>Variable DC power supply</b> (0–30 V) – લગાવેલો voltage બદલવા</li>\n<li><b>Current-limiting resistor R</b> – diode ને રક્ષણ આપે</li>\n<li>Series માં <b>Milliammeter (mA)</b> – forward current માપે</li>\n<li>Diode ની parallel માં <b>Voltmeter (V)</b> – diode voltage માપે</li>\n</ul>\n<h4>પદ્ધતિ</h4>\n<ol>\n<li>આકૃતિ પ્રમાણે circuit ને <b>forward bias</b> માં જોડો.</li>\n<li>Supply voltage નાના પગલાં (0.1 V) માં વધારો અને દર વખતે V<sub>F</sub> અને I<sub>F</sub> નોંધો.</li>\n<li><b>Reverse characteristics</b> માટે supply polarity ઉલટાવો, mA meter ની જગ્યાએ <b>µA meter</b> મૂકો અને voltage 1–2 V ના પગલામાં વધારો. V<sub>R</sub> અને I<sub>R</sub> નોંધો.</li>\n<li>X-axis પર V અને Y-axis પર I લઈ આલેખ દોરો (forward પ્રથમ ચરણમાં, reverse ત્રીજા ચરણમાં).</li>\n</ol>\n<p><b>સાવચેતી:</b> Forward bias માં I<sub>F(max)</sub> અને reverse bias માં PIV થી વધુ ન જવું.</p>"}, "diagram": "u3_vi_circuit"}, {"h": {"en": "3.3.2 Forward Characteristics", "gu": "3.3.2 Forward Characteristics"}, "body": {"en": "<p>The forward characteristic is drawn in the <b>first quadrant</b> (see diagram).</p>\n<ol>\n<li><b>Region 0 to V<sub>K</sub>:</b> When the forward voltage is less than the knee voltage, the potential barrier is not overcome. Current is <b>very small</b> (almost zero).</li>\n<li><b>At V<sub>K</sub> (knee):</b> At about <b>0.7 V (Si)</b> or <b>0.3 V (Ge)</b> the barrier is overcome and current begins to rise sharply. The curve bends like a knee.</li>\n<li><b>Above V<sub>K</sub>:</b> Current increases <b>rapidly (exponentially)</b> for a very small increase in voltage. The diode offers very low resistance. The curve is almost a straight, steep line.</li>\n</ol>\n<p>If the forward current exceeds I<sub>F(max)</sub>, the diode overheats and gets damaged. So a series resistor is always used.</p>\n<p><b>Diode current equation (Shockley):</b> I = I₀ (e<sup>V/ηV<sub>T</sub></sup> − 1), where V<sub>T</sub> ≈ 26 mV at room temperature, η = 1 (Ge) or 2 (Si).</p>", "gu": "<p>Forward characteristic <b>પ્રથમ ચરણ (first quadrant)</b> માં દોરાય છે (આકૃતિ જુઓ).</p>\n<ol>\n<li><b>વિસ્તાર 0 થી V<sub>K</sub>:</b> જ્યારે forward voltage, knee voltage કરતાં ઓછો હોય ત્યારે potential barrier પાર થતો નથી. Current <b>ખૂબ નાનો</b> (લગભગ શૂન્ય) હોય છે.</li>\n<li><b>V<sub>K</sub> (knee) પર:</b> આશરે <b>0.7 V (Si)</b> અથવા <b>0.3 V (Ge)</b> પર barrier પાર થાય છે અને current ઝડપથી વધવા લાગે છે. Curve ઘૂંટણ જેવો વળે છે.</li>\n<li><b>V<sub>K</sub> થી ઉપર:</b> Voltage માં ખૂબ નાના વધારા સાથે current <b>ઝડપથી (exponentially)</b> વધે છે. Diode ખૂબ ઓછો resistance આપે છે. Curve લગભગ સીધી, ઊભી રેખા બને છે.</li>\n</ol>\n<p>જો forward current I<sub>F(max)</sub> થી વધે તો diode વધુ ગરમ થઈ નુકસાન પામે છે. તેથી હંમેશા series resistor વપરાય છે.</p>\n<p><b>Diode current equation (Shockley):</b> I = I₀ (e<sup>V/ηV<sub>T</sub></sup> − 1), જ્યાં room temperature પર V<sub>T</sub> ≈ 26 mV, η = 1 (Ge) અથવા 2 (Si).</p>"}, "diagram": "u3_vi_char"}, {"h": {"en": "3.3.3 Reverse Characteristics and Breakdown", "gu": "3.3.3 Reverse Characteristics અને Breakdown"}, "body": {"en": "<p>The reverse characteristic is drawn in the <b>third quadrant</b>.</p>\n<ol>\n<li><b>Before breakdown:</b> A very small, almost constant <b>reverse saturation current I₀</b> flows (nA for Si, µA for Ge). It does not depend on reverse voltage. The diode offers very high resistance.</li>\n<li><b>At breakdown voltage (V<sub>BR</sub>):</b> When reverse voltage reaches V<sub>BR</sub>, the reverse current <b>increases suddenly and sharply</b>. This is called <b>reverse breakdown</b>.</li>\n<li>An ordinary diode is usually <b>damaged</b> at breakdown due to excessive heat, so it is always operated below V<sub>BR</sub> (i.e., below its PIV rating).</li>\n</ol>\n<h4>Types of breakdown</h4>\n<ul>\n<li><b>Avalanche breakdown:</b> In lightly doped diodes at high reverse voltage. Minority carriers gain high energy and knock out more electrons from covalent bonds (impact ionisation), creating a chain reaction.</li>\n<li><b>Zener breakdown:</b> In heavily doped diodes at low reverse voltage (below ≈ 5 V). The strong electric field directly breaks covalent bonds. (Explained in 3.4.)</li>\n</ul>\n<p><i>Note:</i> Different scales are used for forward (mA, fractions of a volt) and reverse (µA, tens of volts) axes.</p>", "gu": "<p>Reverse characteristic <b>ત્રીજા ચરણ (third quadrant)</b> માં દોરાય છે.</p>\n<ol>\n<li><b>Breakdown પહેલાં:</b> ખૂબ નાનો, લગભગ અચળ <b>Reverse saturation current I₀</b> વહે છે (Si માટે nA, Ge માટે µA). તે reverse voltage પર આધાર રાખતો નથી. Diode ખૂબ વધુ resistance આપે છે.</li>\n<li><b>Breakdown voltage (V<sub>BR</sub>) પર:</b> જ્યારે reverse voltage V<sub>BR</sub> સુધી પહોંચે ત્યારે reverse current <b>અચાનક અને ઝડપથી વધે</b> છે. તેને <b>Reverse breakdown</b> કહે છે.</li>\n<li>સામાન્ય diode વધુ ગરમીને કારણે breakdown પર સામાન્ય રીતે <b>નુકસાન પામે</b> છે, તેથી તેને હંમેશા V<sub>BR</sub> થી નીચે (એટલે કે PIV rating થી નીચે) ચલાવાય છે.</li>\n</ol>\n<h4>Breakdown ના પ્રકાર</h4>\n<ul>\n<li><b>Avalanche breakdown:</b> ઓછા doped diodes માં વધુ reverse voltage પર. Minority carriers વધુ ઊર્જા મેળવી covalent bonds માંથી વધુ electrons છૂટા પાડે છે (impact ionisation), જેથી શૃંખલા પ્રક્રિયા (chain reaction) થાય છે.</li>\n<li><b>Zener breakdown:</b> વધુ doped diodes માં ઓછા reverse voltage (≈ 5 V થી નીચે) પર. તીવ્ર electric field સીધા covalent bonds તોડે છે. (3.4 માં સમજાવેલ છે.)</li>\n</ul>\n<p><i>નોંધ:</i> Forward (mA, volt નો અપૂર્ણાંક) અને reverse (µA, દસેક volts) axes માટે અલગ scale વપરાય છે.</p>"}}, {"h": {"en": "3.3.4 Diode Resistance, Ideal and Practical Diode", "gu": "3.3.4 Diode Resistance, Ideal અને Practical Diode"}, "body": {"en": "<h4>1. Static (DC) resistance</h4>\n<p>The ratio of DC voltage across the diode to the DC current through it at a point on the characteristic:</p>\n<p><b>R<sub>DC</sub> = V<sub>F</sub> / I<sub>F</sub></b></p>\n<h4>2. Dynamic (AC) resistance</h4>\n<p>The ratio of a small change in voltage to the corresponding small change in current:</p>\n<p><b>r<sub>d</sub> = ΔV<sub>F</sub> / ΔI<sub>F</sub></b></p>\n<p>Above the knee, r<sub>d</sub> is very small (a few ohms). At room temperature, approximately r<sub>d</sub> ≈ 26 mV / I<sub>F</sub>.</p>\n<h4>3. Reverse resistance</h4>\n<p>R<sub>R</sub> = V<sub>R</sub> / I<sub>R</sub> → very high (MΩ).</p>\n<h4>Ideal vs practical diode</h4>\n<table>\n<tr><th>Point</th><th>Ideal diode</th><th>Practical diode</th></tr>\n<tr><td>Forward resistance</td><td>Zero</td><td>Small (few Ω)</td></tr>\n<tr><td>Forward voltage drop</td><td>Zero</td><td>0.7 V (Si), 0.3 V (Ge)</td></tr>\n<tr><td>Reverse resistance</td><td>Infinite</td><td>Very high (MΩ)</td></tr>\n<tr><td>Reverse current</td><td>Zero</td><td>Small I₀ (nA/µA)</td></tr>\n<tr><td>Behaviour</td><td>Perfect switch</td><td>Nearly a switch</td></tr>\n</table>", "gu": "<h4>1. Static (DC) resistance</h4>\n<p>Characteristic ના કોઈ બિંદુ પર diode પરના DC voltage અને તેમાંથી વહેતા DC current નો ગુણોત્તર:</p>\n<p><b>R<sub>DC</sub> = V<sub>F</sub> / I<sub>F</sub></b></p>\n<h4>2. Dynamic (AC) resistance</h4>\n<p>Voltage માં નાના ફેરફાર અને તેને અનુરૂપ current ના નાના ફેરફારનો ગુણોત્તર:</p>\n<p><b>r<sub>d</sub> = ΔV<sub>F</sub> / ΔI<sub>F</sub></b></p>\n<p>Knee થી ઉપર r<sub>d</sub> ખૂબ ઓછો (થોડા ohms) હોય છે. Room temperature પર આશરે r<sub>d</sub> ≈ 26 mV / I<sub>F</sub>.</p>\n<h4>3. Reverse resistance</h4>\n<p>R<sub>R</sub> = V<sub>R</sub> / I<sub>R</sub> → ખૂબ વધુ (MΩ).</p>\n<h4>Ideal અને practical diode</h4>\n<table>\n<tr><th>મુદ્દો</th><th>Ideal diode</th><th>Practical diode</th></tr>\n<tr><td>Forward resistance</td><td>શૂન્ય</td><td>ઓછો (થોડા Ω)</td></tr>\n<tr><td>Forward voltage drop</td><td>શૂન્ય</td><td>0.7 V (Si), 0.3 V (Ge)</td></tr>\n<tr><td>Reverse resistance</td><td>અનંત</td><td>ખૂબ વધુ (MΩ)</td></tr>\n<tr><td>Reverse current</td><td>શૂન્ય</td><td>નાનો I₀ (nA/µA)</td></tr>\n<tr><td>વર્તન</td><td>સંપૂર્ણ switch</td><td>લગભગ switch</td></tr>\n</table>"}, "examples": ["u3n1"]}, {"h": {"en": "3.3.5 Applications of P-N Junction Diode", "gu": "3.3.5 P-N Junction Diode ના ઉપયોગો"}, "body": {"en": "<ul>\n<li><b>Rectifiers</b> – convert AC to DC in power supplies and chargers (3.6).</li>\n<li><b>Switching circuits</b> – diode as an electronic ON/OFF switch (1N4148).</li>\n<li><b>Clipper circuits</b> – remove (clip) part of a waveform above or below a level.</li>\n<li><b>Clamper circuits</b> – shift the DC level of a waveform.</li>\n<li><b>Reverse-polarity protection</b> – prevents damage if the battery is connected the wrong way.</li>\n<li><b>Freewheeling (flyback) diode</b> – across relay coils and motors to absorb back EMF.</li>\n<li><b>Voltage multipliers</b> – doubler, tripler circuits.</li>\n<li><b>Detector/demodulator</b> in radio receivers.</li>\n<li><b>Logic gates</b> – diode AND / OR gates.</li>\n</ul>", "gu": "<ul>\n<li><b>Rectifiers</b> – power supply અને chargers માં AC ને DC માં ફેરવે (3.6).</li>\n<li><b>Switching circuits</b> – electronic ON/OFF switch તરીકે diode (1N4148).</li>\n<li><b>Clipper circuits</b> – waveform નો કોઈ સ્તરથી ઉપર કે નીચેનો ભાગ કાપે (clip).</li>\n<li><b>Clamper circuits</b> – waveform નું DC level ખસેડે.</li>\n<li><b>Reverse-polarity protection</b> – battery ઉલટી જોડાય તો નુકસાન અટકાવે.</li>\n<li><b>Freewheeling (flyback) diode</b> – relay coils અને motors પર back EMF શોષવા.</li>\n<li><b>Voltage multipliers</b> – doubler, tripler circuits.</li>\n<li>Radio receivers માં <b>Detector/demodulator</b>.</li>\n<li><b>Logic gates</b> – diode AND / OR gates.</li>\n</ul>"}}, {"h": {"en": "Key Points – 3.3", "gu": "મુખ્ય મુદ્દા – 3.3"}, "body": {"en": "<ul>\n<li>V-I characteristic = graph of diode current vs diode voltage.</li>\n<li>Forward: almost zero current up to V<sub>K</sub>, then current rises sharply (mA).</li>\n<li>Reverse: tiny constant I₀ (nA/µA) until <b>breakdown voltage V<sub>BR</sub></b>, then sharp rise.</li>\n<li>Ordinary diode is damaged at breakdown → keep reverse voltage below PIV.</li>\n<li>Static R = V/I; dynamic r<sub>d</sub> = ΔV/ΔI ≈ 26 mV/I<sub>F</sub>.</li>\n<li>Ideal diode: zero forward resistance & drop, infinite reverse resistance.</li>\n<li>Applications: rectifier, switch, clipper, clamper, protection, voltage multiplier.</li>\n</ul>", "gu": "<ul>\n<li>V-I characteristic = diode current વિરુદ્ધ diode voltage નો આલેખ.</li>\n<li>Forward: V<sub>K</sub> સુધી લગભગ શૂન્ય current, પછી current ઝડપથી વધે (mA).</li>\n<li>Reverse: <b>Breakdown voltage V<sub>BR</sub></b> સુધી નાનો અચળ I₀ (nA/µA), પછી ઝડપી વધારો.</li>\n<li>સામાન્ય diode breakdown પર નુકસાન પામે → reverse voltage PIV થી નીચે રાખો.</li>\n<li>Static R = V/I; dynamic r<sub>d</sub> = ΔV/ΔI ≈ 26 mV/I<sub>F</sub>.</li>\n<li>Ideal diode: શૂન્ય forward resistance અને drop, અનંત reverse resistance.</li>\n<li>ઉપયોગો: rectifier, switch, clipper, clamper, protection, voltage multiplier.</li>\n</ul>"}, "key": true}]}, {"title": {"en": "3.4 Zener Diode", "gu": "3.4 Zener Diode"}, "items": [{"h": {"en": "3.4.1 Zener Diode – Definition, Symbol and Construction", "gu": "3.4.1 Zener Diode – વ્યાખ્યા, Symbol અને રચના"}, "body": {"en": "<p><b>Definition:</b> A Zener diode is a <b>heavily doped</b> silicon P-N junction diode that is specially designed to operate in the <b>reverse breakdown region</b> without getting damaged. It keeps the voltage across it almost <b>constant</b> in breakdown.</p>\n<p>It is named after the American scientist <b>Clarence Zener</b>, who explained the Zener breakdown effect.</p>\n<h4>Symbol</h4>\n<p>Like a normal diode symbol, but the cathode bar has <b>bent ends</b> (like the letter \"Z\"). See the symbol in the Zener characteristic diagram.</p>\n<h4>Construction / special features</h4>\n<ul>\n<li>Made of <b>silicon</b> (Si) because of its better temperature stability and higher current capability.</li>\n<li><b>Heavily doped</b> P and N regions → very <b>thin depletion layer</b> → breakdown at a low, sharp and well-defined voltage.</li>\n<li>The breakdown voltage (Zener voltage V<sub>Z</sub>) can be set from about <b>2.4 V to 200 V</b> by controlling the doping.</li>\n<li>Designed with good heat dissipation so that it is <b>not damaged</b> in breakdown, as long as current stays below I<sub>Z(max)</sub>.</li>\n<li>Always used in <b>reverse bias</b> with a <b>series resistor</b>.</li>\n</ul>\n<p><b>Examples:</b> 1N4733 (5.1 V, 1 W), 1N4742 (12 V, 1 W), BZX55C5V1 (5.1 V, 0.5 W).</p>", "gu": "<p><b>વ્યાખ્યા:</b> Zener diode એ <b>વધુ doped (heavily doped)</b> silicon P-N junction diode છે, જે નુકસાન વિના <b>reverse breakdown region</b> માં કાર્ય કરવા ખાસ બનાવેલો છે. Breakdown માં તે પોતાના પરનો voltage લગભગ <b>અચળ (constant)</b> રાખે છે.</p>\n<p>તેનું નામ અમેરિકન વૈજ્ઞાનિક <b>Clarence Zener</b> પરથી પડ્યું છે, જેમણે Zener breakdown અસર સમજાવી હતી.</p>\n<h4>Symbol</h4>\n<p>સામાન્ય diode symbol જેવો, પરંતુ cathode bar ના છેડા <b>વાળેલા</b> હોય છે (\"Z\" અક્ષર જેવા). Zener characteristic આકૃતિમાં symbol જુઓ.</p>\n<h4>રચના / ખાસ લક્ષણો</h4>\n<ul>\n<li>વધુ સારી temperature stability અને વધુ current ક્ષમતાને કારણે <b>Silicon</b> (Si) માંથી બને છે.</li>\n<li><b>વધુ doped</b> P અને N regions → ખૂબ <b>પાતળું depletion layer</b> → ઓછા, તીક્ષ્ણ અને ચોક્કસ voltage પર breakdown.</li>\n<li>Doping નિયંત્રિત કરીને breakdown voltage (Zener voltage V<sub>Z</sub>) આશરે <b>2.4 V થી 200 V</b> સુધી રાખી શકાય.</li>\n<li>સારી heat dissipation સાથે બનાવેલ હોવાથી current I<sub>Z(max)</sub> થી નીચે રહે ત્યાં સુધી breakdown માં <b>નુકસાન પામતો નથી</b>.</li>\n<li>હંમેશા <b>series resistor</b> સાથે <b>reverse bias</b> માં વપરાય છે.</li>\n</ul>\n<p><b>ઉદાહરણ:</b> 1N4733 (5.1 V, 1 W), 1N4742 (12 V, 1 W), BZX55C5V1 (5.1 V, 0.5 W).</p>"}}, {"h": {"en": "3.4.2 Working – Zener and Avalanche Breakdown", "gu": "3.4.2 કાર્ય – Zener અને Avalanche Breakdown"}, "body": {"en": "<h4>In forward bias</h4>\n<p>A Zener diode works like an ordinary silicon diode: it conducts after about <b>0.7 V</b>.</p>\n<h4>In reverse bias</h4>\n<p>A small leakage current flows until the reverse voltage reaches <b>V<sub>Z</sub></b>. At V<sub>Z</sub>, breakdown occurs, the current increases sharply, and the voltage across the diode stays almost constant at V<sub>Z</sub>. Two mechanisms cause breakdown:</p>\n<h4>1. Zener breakdown</h4>\n<ul>\n<li>Occurs in <b>heavily doped</b> diodes with a <b>very thin</b> depletion layer.</li>\n<li>Even a small reverse voltage produces a <b>very strong electric field</b> (about 3 × 10⁷ V/m) across the thin layer.</li>\n<li>This field directly <b>pulls electrons out of covalent bonds</b> (field ionisation), producing many carriers → large current.</li>\n<li>Occurs at <b>low voltages (below ≈ 5 V)</b>; V<sub>Z</sub> decreases with temperature (<b>negative temperature coefficient</b>).</li>\n</ul>\n<h4>2. Avalanche breakdown</h4>\n<ul>\n<li>Occurs in <b>lightly/moderately doped</b> diodes with a <b>wider</b> depletion layer, at <b>higher voltages (above ≈ 6 V)</b>.</li>\n<li>Minority carriers are accelerated by the field and gain high kinetic energy. They collide with atoms and knock out more electrons (<b>impact ionisation</b>).</li>\n<li>The new carriers also collide and produce more carriers → <b>chain reaction (avalanche)</b> → large current.</li>\n<li>V<sub>Z</sub> increases with temperature (<b>positive temperature coefficient</b>).</li>\n</ul>\n<table>\n<tr><th>Point</th><th>Zener breakdown</th><th>Avalanche breakdown</th></tr>\n<tr><td>Doping</td><td>Heavy</td><td>Light/moderate</td></tr>\n<tr><td>Depletion layer</td><td>Very thin</td><td>Wide</td></tr>\n<tr><td>Voltage</td><td>Low (&lt; 5 V)</td><td>High (&gt; 6 V)</td></tr>\n<tr><td>Mechanism</td><td>Strong field breaks bonds</td><td>Collision (impact ionisation)</td></tr>\n<tr><td>Temperature coefficient</td><td>Negative</td><td>Positive</td></tr>\n<tr><td>Characteristic</td><td>Breakdown is sharp</td><td>Breakdown is sharp; carriers multiply</td></tr>\n</table>\n<p>Between about 5 V and 6 V both effects occur, so the temperature coefficient is nearly <b>zero</b>. A 5.6 V Zener is therefore very stable.</p>", "gu": "<h4>Forward bias માં</h4>\n<p>Zener diode સામાન્ય silicon diode જેવું કામ કરે છે: આશરે <b>0.7 V</b> પછી conduction કરે છે.</p>\n<h4>Reverse bias માં</h4>\n<p>Reverse voltage <b>V<sub>Z</sub></b> સુધી પહોંચે ત્યાં સુધી નાનો leakage current વહે છે. V<sub>Z</sub> પર breakdown થાય છે, current ઝડપથી વધે છે, અને diode પરનો voltage લગભગ V<sub>Z</sub> પર અચળ રહે છે. Breakdown બે રીતે થાય છે:</p>\n<h4>1. Zener breakdown</h4>\n<ul>\n<li><b>વધુ doped</b> diodes માં, જેમાં <b>ખૂબ પાતળું</b> depletion layer હોય છે.</li>\n<li>નાનો reverse voltage પણ પાતળા layer પર <b>ખૂબ તીવ્ર electric field</b> (આશરે 3 × 10⁷ V/m) બનાવે છે.</li>\n<li>આ field સીધા <b>covalent bonds માંથી electrons ખેંચી કાઢે</b> છે (field ionisation), જેથી ઘણા carriers બને → મોટો current.</li>\n<li><b>ઓછા voltage (≈ 5 V થી નીચે)</b> પર થાય છે; તાપમાન વધતાં V<sub>Z</sub> ઘટે (<b>negative temperature coefficient</b>).</li>\n</ul>\n<h4>2. Avalanche breakdown</h4>\n<ul>\n<li><b>ઓછા/મધ્યમ doped</b> diodes માં, જેમાં <b>પહોળું</b> depletion layer હોય, <b>વધુ voltage (≈ 6 V થી ઉપર)</b> પર થાય છે.</li>\n<li>Minority carriers field થી પ્રવેગિત થઈ વધુ ગતિ ઊર્જા મેળવે છે. તેઓ atoms સાથે અથડાઈ વધુ electrons છૂટા પાડે છે (<b>impact ionisation</b>).</li>\n<li>નવા carriers પણ અથડાઈ વધુ carriers બનાવે છે → <b>શૃંખલા પ્રક્રિયા (avalanche)</b> → મોટો current.</li>\n<li>તાપમાન વધતાં V<sub>Z</sub> વધે (<b>positive temperature coefficient</b>).</li>\n</ul>\n<table>\n<tr><th>મુદ્દો</th><th>Zener breakdown</th><th>Avalanche breakdown</th></tr>\n<tr><td>Doping</td><td>વધુ</td><td>ઓછું/મધ્યમ</td></tr>\n<tr><td>Depletion layer</td><td>ખૂબ પાતળું</td><td>પહોળું</td></tr>\n<tr><td>Voltage</td><td>ઓછો (&lt; 5 V)</td><td>વધુ (&gt; 6 V)</td></tr>\n<tr><td>પ્રક્રિયા</td><td>તીવ્ર field bonds તોડે</td><td>અથડામણ (impact ionisation)</td></tr>\n<tr><td>Temperature coefficient</td><td>Negative</td><td>Positive</td></tr>\n<tr><td>Characteristic</td><td>Breakdown તીક્ષ્ણ</td><td>Breakdown તીક્ષ્ણ; carriers ગુણાકારમાં વધે</td></tr>\n</table>\n<p>આશરે 5 V અને 6 V વચ્ચે બંને અસરો થાય છે, તેથી temperature coefficient લગભગ <b>શૂન્ય</b> હોય છે. તેથી 5.6 V Zener ખૂબ સ્થિર હોય છે.</p>"}}, {"h": {"en": "3.4.3 V-I Characteristics of Zener Diode", "gu": "3.4.3 Zener Diode ની V-I Characteristics"}, "body": {"en": "<h4>Forward characteristics</h4>\n<p>Same as an ordinary Si diode: current rises sharply after the knee voltage of about <b>0.7 V</b>.</p>\n<h4>Reverse characteristics</h4>\n<ol>\n<li>From 0 to V<sub>Z</sub>, only a very small <b>reverse leakage current</b> flows.</li>\n<li>At <b>V<sub>Z</sub></b> (Zener voltage), breakdown occurs and current increases suddenly. The curve becomes almost <b>vertical</b>.</li>\n<li>In this breakdown region, the current can change from <b>I<sub>Z(min)</sub></b> to <b>I<sub>Z(max)</sub></b> while the voltage stays almost constant at V<sub>Z</sub>. <b>This is the property used for voltage regulation.</b></li>\n</ol>\n<h4>Important Zener parameters</h4>\n<table>\n<tr><th>Parameter</th><th>Meaning</th></tr>\n<tr><td>Zener voltage V<sub>Z</sub></td><td>Reverse voltage at which breakdown occurs and voltage remains constant</td></tr>\n<tr><td>Minimum Zener current I<sub>Z(min)</sub> (I<sub>ZK</sub>)</td><td>Minimum current needed to stay in breakdown (knee current); below it, regulation is lost</td></tr>\n<tr><td>Maximum Zener current I<sub>Z(max)</sub> (I<sub>ZM</sub>)</td><td>Maximum current without damage</td></tr>\n<tr><td>Power rating P<sub>Z</sub></td><td>Maximum power dissipation: <b>P<sub>Z</sub> = V<sub>Z</sub> × I<sub>Z(max)</sub></b></td></tr>\n<tr><td>Zener resistance r<sub>Z</sub></td><td>r<sub>Z</sub> = ΔV<sub>Z</sub> / ΔI<sub>Z</sub>, very small (a few ohms); ideal = 0</td></tr>\n<tr><td>Tolerance</td><td>Allowed variation in V<sub>Z</sub> (±5%, ±10%)</td></tr>\n</table>", "gu": "<h4>Forward characteristics</h4>\n<p>સામાન્ય Si diode જેવી જ: આશરે <b>0.7 V</b> ના knee voltage પછી current ઝડપથી વધે છે.</p>\n<h4>Reverse characteristics</h4>\n<ol>\n<li>0 થી V<sub>Z</sub> સુધી ફક્ત ખૂબ નાનો <b>reverse leakage current</b> વહે છે.</li>\n<li><b>V<sub>Z</sub></b> (Zener voltage) પર breakdown થાય છે અને current અચાનક વધે છે. Curve લગભગ <b>ઊભો (vertical)</b> બને છે.</li>\n<li>આ breakdown region માં current <b>I<sub>Z(min)</sub></b> થી <b>I<sub>Z(max)</sub></b> સુધી બદલાય છતાં voltage લગભગ V<sub>Z</sub> પર અચળ રહે છે. <b>Voltage regulation માટે આ જ ગુણધર્મ વપરાય છે.</b></li>\n</ol>\n<h4>મહત્વના Zener parameters</h4>\n<table>\n<tr><th>Parameter</th><th>અર્થ</th></tr>\n<tr><td>Zener voltage V<sub>Z</sub></td><td>જે reverse voltage પર breakdown થાય અને voltage અચળ રહે</td></tr>\n<tr><td>Minimum Zener current I<sub>Z(min)</sub> (I<sub>ZK</sub>)</td><td>Breakdown માં રહેવા જરૂરી ન્યૂનતમ current (knee current); તેનાથી નીચે regulation ગુમાવાય</td></tr>\n<tr><td>Maximum Zener current I<sub>Z(max)</sub> (I<sub>ZM</sub>)</td><td>નુકસાન વિનાનો મહત્તમ current</td></tr>\n<tr><td>Power rating P<sub>Z</sub></td><td>મહત્તમ power dissipation: <b>P<sub>Z</sub> = V<sub>Z</sub> × I<sub>Z(max)</sub></b></td></tr>\n<tr><td>Zener resistance r<sub>Z</sub></td><td>r<sub>Z</sub> = ΔV<sub>Z</sub> / ΔI<sub>Z</sub>, ખૂબ ઓછો (થોડા ohms); ideal = 0</td></tr>\n<tr><td>Tolerance</td><td>V<sub>Z</sub> માં માન્ય ફેરફાર (±5%, ±10%)</td></tr>\n</table>"}, "diagram": "u3_zener_char", "examples": ["u3n5"]}, {"h": {"en": "3.4.4 Zener Diode as Voltage Regulator", "gu": "3.4.4 Voltage Regulator તરીકે Zener Diode"}, "body": {"en": "<p>A <b>voltage regulator</b> keeps the output (load) voltage <b>constant</b> even when the input voltage or the load current changes.</p>\n<h4>Circuit</h4>\n<ul>\n<li>A series resistor <b>R<sub>S</sub></b> is connected between the unregulated input V<sub>in</sub> and the Zener.</li>\n<li>The Zener diode is connected in <b>reverse bias</b>, in <b>parallel (shunt)</b> with the load R<sub>L</sub>.</li>\n<li>Output voltage V<sub>out</sub> = V<sub>Z</sub> (condition: V<sub>in</sub> &gt; V<sub>Z</sub>).</li>\n</ul>\n<h4>Equations</h4>\n<p><b>I = (V<sub>in</sub> − V<sub>Z</sub>) / R<sub>S</sub></b>, &nbsp; <b>I<sub>L</sub> = V<sub>Z</sub> / R<sub>L</sub></b>, &nbsp; <b>I = I<sub>Z</sub> + I<sub>L</sub></b></p>\n<h4>Working</h4>\n<p><b>Case 1 – Input voltage changes (line regulation):</b></p>\n<ul>\n<li>If V<sub>in</sub> <b>increases</b>, the total current I increases. The Zener absorbs the extra current (I<sub>Z</sub> increases), so the extra voltage drops across R<sub>S</sub>. V<sub>out</sub> stays at V<sub>Z</sub>.</li>\n<li>If V<sub>in</sub> <b>decreases</b>, I<sub>Z</sub> decreases, but V<sub>out</sub> still remains at V<sub>Z</sub> (as long as I<sub>Z</sub> &gt; I<sub>Z(min)</sub>).</li>\n</ul>\n<p><b>Case 2 – Load current changes (load regulation):</b></p>\n<ul>\n<li>If I<sub>L</sub> <b>increases</b> (R<sub>L</sub> decreases), I<sub>Z</sub> decreases by the same amount. Total I stays the same, so the drop across R<sub>S</sub> and V<sub>out</sub> stay constant.</li>\n<li>If I<sub>L</sub> <b>decreases</b>, I<sub>Z</sub> increases by the same amount, and V<sub>out</sub> stays constant.</li>\n</ul>\n<p>Thus the Zener acts like an automatic <b>\"current adjuster\"</b>, keeping V<sub>out</sub> = V<sub>Z</sub>.</p>\n<h4>Design of series resistance</h4>\n<p><b>R<sub>S</sub> = (V<sub>in</sub> − V<sub>Z</sub>) / (I<sub>Z</sub> + I<sub>L</sub>)</b></p>\n<p><b>Limitations:</b> low efficiency (power wasted in R<sub>S</sub> and Zener), suitable only for small load currents.</p>", "gu": "<p><b>Voltage regulator</b> એ input voltage અથવા load current બદલાય તો પણ output (load) voltage ને <b>અચળ</b> રાખે છે.</p>\n<h4>Circuit</h4>\n<ul>\n<li>Unregulated input V<sub>in</sub> અને Zener વચ્ચે series resistor <b>R<sub>S</sub></b> જોડાય છે.</li>\n<li>Zener diode ને <b>reverse bias</b> માં, load R<sub>L</sub> ની <b>parallel (shunt)</b> માં જોડાય છે.</li>\n<li>Output voltage V<sub>out</sub> = V<sub>Z</sub> (શરત: V<sub>in</sub> &gt; V<sub>Z</sub>).</li>\n</ul>\n<h4>સમીકરણો</h4>\n<p><b>I = (V<sub>in</sub> − V<sub>Z</sub>) / R<sub>S</sub></b>, &nbsp; <b>I<sub>L</sub> = V<sub>Z</sub> / R<sub>L</sub></b>, &nbsp; <b>I = I<sub>Z</sub> + I<sub>L</sub></b></p>\n<h4>કાર્ય</h4>\n<p><b>Case 1 – Input voltage બદલાય (line regulation):</b></p>\n<ul>\n<li>જો V<sub>in</sub> <b>વધે</b>, તો કુલ current I વધે છે. Zener વધારાનો current શોષી લે છે (I<sub>Z</sub> વધે), તેથી વધારાનો voltage R<sub>S</sub> પર drop થાય છે. V<sub>out</sub> = V<sub>Z</sub> જ રહે છે.</li>\n<li>જો V<sub>in</sub> <b>ઘટે</b>, તો I<sub>Z</sub> ઘટે છે, પરંતુ V<sub>out</sub> હજી V<sub>Z</sub> જ રહે છે (જ્યાં સુધી I<sub>Z</sub> &gt; I<sub>Z(min)</sub>).</li>\n</ul>\n<p><b>Case 2 – Load current બદલાય (load regulation):</b></p>\n<ul>\n<li>જો I<sub>L</sub> <b>વધે</b> (R<sub>L</sub> ઘટે), તો I<sub>Z</sub> તેટલો જ ઘટે છે. કુલ I એ જ રહે છે, તેથી R<sub>S</sub> પરનો drop અને V<sub>out</sub> અચળ રહે છે.</li>\n<li>જો I<sub>L</sub> <b>ઘટે</b>, તો I<sub>Z</sub> તેટલો જ વધે છે અને V<sub>out</sub> અચળ રહે છે.</li>\n</ul>\n<p>આમ Zener સ્વયંસંચાલિત <b>\"current adjuster\"</b> જેવું કામ કરી V<sub>out</sub> = V<sub>Z</sub> રાખે છે.</p>\n<h4>Series resistance ની ડિઝાઇન</h4>\n<p><b>R<sub>S</sub> = (V<sub>in</sub> − V<sub>Z</sub>) / (I<sub>Z</sub> + I<sub>L</sub>)</b></p>\n<p><b>મર્યાદાઓ:</b> ઓછી efficiency (R<sub>S</sub> અને Zener માં power વેડફાય), ફક્ત નાના load current માટે યોગ્ય.</p>"}, "diagram": "u3_zener_regulator", "examples": ["u3n3", "u3n4"]}, {"h": {"en": "3.4.5 Applications of Zener Diode; P-N Diode vs Zener Diode", "gu": "3.4.5 Zener Diode ના ઉપયોગો; P-N Diode અને Zener Diode"}, "body": {"en": "<h4>Applications</h4>\n<ul>\n<li><b>Voltage regulator</b> in small DC power supplies.</li>\n<li><b>Reference voltage source</b> in ADCs, comparators and power supplies.</li>\n<li><b>Over-voltage protection</b> – conducts and protects the circuit when voltage exceeds V<sub>Z</sub>.</li>\n<li><b>Wave shaping / clipping</b> circuits.</li>\n<li><b>Meter protection</b> in multimeters.</li>\n<li>Voltage shifting (level shifter) circuits.</li>\n</ul>\n<h4>Comparison</h4>\n<table>\n<tr><th>Point</th><th>P-N junction diode</th><th>Zener diode</th></tr>\n<tr><td>Doping</td><td>Normal (light)</td><td>Heavy</td></tr>\n<tr><td>Depletion layer</td><td>Wider</td><td>Very thin</td></tr>\n<tr><td>Normal operation</td><td>Forward bias</td><td>Reverse bias (breakdown)</td></tr>\n<tr><td>Breakdown</td><td>Damages the diode</td><td>Normal working region; not damaged</td></tr>\n<tr><td>Breakdown voltage</td><td>High (50–1000 V)</td><td>Low and sharp (2.4–200 V)</td></tr>\n<tr><td>Symbol</td><td>Straight bar</td><td>Bent (\"Z\") bar</td></tr>\n<tr><td>Main use</td><td>Rectifier, switch</td><td>Voltage regulator, reference</td></tr>\n</table>", "gu": "<h4>ઉપયોગો</h4>\n<ul>\n<li>નાના DC power supply માં <b>Voltage regulator</b>.</li>\n<li>ADC, comparator અને power supply માં <b>Reference voltage source</b>.</li>\n<li><b>Over-voltage protection</b> – voltage V<sub>Z</sub> થી વધે ત્યારે conduction કરી circuit ને રક્ષણ આપે.</li>\n<li><b>Wave shaping / clipping</b> circuits.</li>\n<li>Multimeter માં <b>Meter protection</b>.</li>\n<li>Voltage shifting (level shifter) circuits.</li>\n</ul>\n<h4>સરખામણી</h4>\n<table>\n<tr><th>મુદ્દો</th><th>P-N junction diode</th><th>Zener diode</th></tr>\n<tr><td>Doping</td><td>સામાન્ય (ઓછું)</td><td>વધુ</td></tr>\n<tr><td>Depletion layer</td><td>વધુ પહોળું</td><td>ખૂબ પાતળું</td></tr>\n<tr><td>સામાન્ય કાર્ય</td><td>Forward bias</td><td>Reverse bias (breakdown)</td></tr>\n<tr><td>Breakdown</td><td>Diode ને નુકસાન કરે</td><td>સામાન્ય કાર્ય region; નુકસાન નહીં</td></tr>\n<tr><td>Breakdown voltage</td><td>વધુ (50–1000 V)</td><td>ઓછો અને તીક્ષ્ણ (2.4–200 V)</td></tr>\n<tr><td>Symbol</td><td>સીધો bar</td><td>વાળેલો (\"Z\") bar</td></tr>\n<tr><td>મુખ્ય ઉપયોગ</td><td>Rectifier, switch</td><td>Voltage regulator, reference</td></tr>\n</table>"}}, {"h": {"en": "Key Points – 3.4", "gu": "મુખ્ય મુદ્દા – 3.4"}, "body": {"en": "<ul>\n<li>Zener = <b>heavily doped Si diode</b> designed to work in <b>reverse breakdown</b> without damage.</li>\n<li>Zener breakdown (&lt; 5 V, field ionisation, −ve temp. coeff.) and Avalanche breakdown (&gt; 6 V, impact ionisation, +ve temp. coeff.).</li>\n<li>In breakdown, V<sub>Z</sub> remains constant while I<sub>Z</sub> varies from I<sub>Z(min)</sub> to I<sub>Z(max)</sub>.</li>\n<li><b>P<sub>Z</sub> = V<sub>Z</sub> × I<sub>Z(max)</sub></b>.</li>\n<li>Regulator: R<sub>S</sub> in series, Zener in shunt with load, reverse biased; <b>I = I<sub>Z</sub> + I<sub>L</sub></b>, <b>R<sub>S</sub> = (V<sub>in</sub> − V<sub>Z</sub>)/(I<sub>Z</sub> + I<sub>L</sub>)</b>.</li>\n<li>Uses: voltage regulator, reference, over-voltage protection, clipping.</li>\n</ul>", "gu": "<ul>\n<li>Zener = નુકસાન વિના <b>reverse breakdown</b> માં કામ કરવા બનાવેલો <b>વધુ doped Si diode</b>.</li>\n<li>Zener breakdown (&lt; 5 V, field ionisation, −ve temp. coeff.) અને Avalanche breakdown (&gt; 6 V, impact ionisation, +ve temp. coeff.).</li>\n<li>Breakdown માં I<sub>Z</sub> એ I<sub>Z(min)</sub> થી I<sub>Z(max)</sub> સુધી બદલાય છતાં V<sub>Z</sub> અચળ રહે.</li>\n<li><b>P<sub>Z</sub> = V<sub>Z</sub> × I<sub>Z(max)</sub></b>.</li>\n<li>Regulator: R<sub>S</sub> series માં, Zener load ની shunt માં, reverse bias; <b>I = I<sub>Z</sub> + I<sub>L</sub></b>, <b>R<sub>S</sub> = (V<sub>in</sub> − V<sub>Z</sub>)/(I<sub>Z</sub> + I<sub>L</sub>)</b>.</li>\n<li>ઉપયોગો: voltage regulator, reference, over-voltage protection, clipping.</li>\n</ul>"}, "key": true}]}, {"title": {"en": "3.5 Special Purpose Diodes", "gu": "3.5 Special Purpose Diodes"}, "items": [{"h": {"en": "3.5.1 Varactor Diode (Varicap)", "gu": "3.5.1 Varactor Diode (Varicap)"}, "body": {"en": "<p><b>Definition:</b> A varactor diode is a specially designed P-N junction diode whose <b>junction capacitance changes with the applied reverse voltage</b>. It works as a <b>voltage-controlled variable capacitor</b>. Other names: <b>varicap, tuning diode, voltage-variable capacitor (VVC)</b>.</p>\n<h4>Symbol</h4>\n<p>A diode symbol with a <b>capacitor symbol</b> (two parallel plates) at the cathode side.</p>\n<h4>Construction</h4>\n<ul>\n<li>P-N junction made of <b>silicon</b> (or GaAs) with a specially controlled doping profile so the capacitance changes widely with voltage.</li>\n<li>The P and N regions act as the <b>two plates</b>, and the depletion layer acts as the <b>dielectric</b>.</li>\n</ul>\n<h4>Working (always in reverse bias)</h4>\n<ul>\n<li>Junction (transition) capacitance: <b>C<sub>T</sub> = ε A / W</b>, where A = junction area and W = depletion layer width.</li>\n<li>When <b>reverse voltage increases</b>, depletion width W <b>increases</b> → plates move further apart → <b>capacitance decreases</b>.</li>\n<li>When reverse voltage decreases, W decreases → capacitance increases.</li>\n<li>For an abrupt junction: <b>C<sub>T</sub> ∝ 1 / √V<sub>R</sub></b> (more exactly 1/√(V₀ + V<sub>R</sub>)).</li>\n<li>Typical range: a few pF to about 100 pF.</li>\n</ul>\n<h4>Characteristics</h4>\n<p>A graph of C<sub>T</sub> against V<sub>R</sub>: capacitance is high at low reverse voltage and falls as the reverse voltage increases (see diagram).</p>\n<h4>Applications</h4>\n<ul>\n<li><b>Electronic tuning</b> in radio and TV receivers (replacing the gang capacitor).</li>\n<li><b>Voltage-controlled oscillators (VCO)</b> and PLL circuits.</li>\n<li><b>Automatic frequency control (AFC)</b>.</li>\n<li><b>FM modulators</b>, frequency multipliers, parametric amplifiers.</li>\n</ul>", "gu": "<p><b>વ્યાખ્યા:</b> Varactor diode એ ખાસ બનાવેલો P-N junction diode છે જેની <b>junction capacitance લગાવેલા reverse voltage સાથે બદલાય</b> છે. તે <b>voltage-controlled variable capacitor</b> તરીકે કામ કરે છે. બીજા નામ: <b>varicap, tuning diode, voltage-variable capacitor (VVC)</b>.</p>\n<h4>Symbol</h4>\n<p>Cathode બાજુએ <b>capacitor symbol</b> (બે સમાંતર plates) સાથેનો diode symbol.</p>\n<h4>રચના</h4>\n<ul>\n<li><b>Silicon</b> (અથવા GaAs) નું P-N junction, ખાસ નિયંત્રિત doping સાથે જેથી voltage સાથે capacitance વધુ બદલાય.</li>\n<li>P અને N regions <b>બે plates</b> તરીકે અને depletion layer <b>Dielectric</b> તરીકે કામ કરે છે.</li>\n</ul>\n<h4>કાર્ય (હંમેશા reverse bias માં)</h4>\n<ul>\n<li>Junction (transition) capacitance: <b>C<sub>T</sub> = ε A / W</b>, જ્યાં A = junction area અને W = depletion layer ની પહોળાઈ.</li>\n<li>જ્યારે <b>reverse voltage વધે</b>, ત્યારે depletion width W <b>વધે</b> → plates વચ્ચેનું અંતર વધે → <b>capacitance ઘટે</b>.</li>\n<li>Reverse voltage ઘટે ત્યારે W ઘટે → capacitance વધે.</li>\n<li>Abrupt junction માટે: <b>C<sub>T</sub> ∝ 1 / √V<sub>R</sub></b> (વધુ ચોક્કસ રીતે 1/√(V₀ + V<sub>R</sub>)).</li>\n<li>સામાન્ય range: થોડા pF થી આશરે 100 pF.</li>\n</ul>\n<h4>Characteristics</h4>\n<p>C<sub>T</sub> વિરુદ્ધ V<sub>R</sub> નો આલેખ: ઓછા reverse voltage પર capacitance વધુ અને reverse voltage વધતાં ઘટે છે (આકૃતિ જુઓ).</p>\n<h4>ઉપયોગો</h4>\n<ul>\n<li>Radio અને TV receivers માં <b>Electronic tuning</b> (gang capacitor ની જગ્યાએ).</li>\n<li><b>Voltage-controlled oscillators (VCO)</b> અને PLL circuits.</li>\n<li><b>Automatic frequency control (AFC)</b>.</li>\n<li><b>FM modulators</b>, frequency multipliers, parametric amplifiers.</li>\n</ul>"}, "diagram": "u3_varactor"}, {"h": {"en": "3.5.2 Photodiode", "gu": "3.5.2 Photodiode"}, "body": {"en": "<p><b>Definition:</b> A photodiode is a P-N junction diode that is operated in <b>reverse bias</b> and whose <b>reverse current increases with the intensity of light</b> falling on the junction. It converts <b>light energy into electrical current</b>.</p>\n<h4>Symbol</h4>\n<p>A diode symbol with <b>two arrows pointing towards</b> the diode (light coming in).</p>\n<h4>Construction</h4>\n<ul>\n<li>P-N junction made of <b>silicon</b> (also Ge, InGaAs) enclosed in a plastic or metal case.</li>\n<li>A <b>transparent window or lens</b> allows light to fall exactly on the junction.</li>\n<li>The rest of the body is covered (painted black) so light reaches only the junction.</li>\n</ul>\n<h4>Working</h4>\n<ol>\n<li>The photodiode is <b>reverse biased</b>, so only a very small <b>dark current</b> (minority carrier current) flows when there is no light.</li>\n<li>When light (photons) with enough energy falls on the junction, it breaks covalent bonds and generates <b>electron-hole pairs</b>.</li>\n<li>These extra minority carriers are swept across the junction by the reverse voltage, so the <b>reverse current increases</b>.</li>\n<li>Greater light intensity → more electron-hole pairs → <b>larger reverse current</b>. The current is almost proportional to the light intensity.</li>\n</ol>\n<h4>Characteristics</h4>\n<p>Graph of reverse current I<sub>R</sub> against reverse voltage V<sub>R</sub> for different light intensities (L1 &lt; L2 &lt; L3). The current is almost independent of voltage and depends mainly on light intensity (see diagram).</p>\n<h4>Applications</h4>\n<ul>\n<li>Light detectors, <b>automatic street-light</b> controls and light meters.</li>\n<li><b>Optical fibre communication</b> receivers.</li>\n<li><b>TV remote-control receivers</b>, smoke detectors, barcode scanners.</li>\n<li>Object counters, burglar alarms, CD/DVD players.</li>\n</ul>", "gu": "<p><b>વ્યાખ્યા:</b> Photodiode એ <b>reverse bias</b> માં ચલાવાતો P-N junction diode છે, જેનો <b>reverse current junction પર પડતા પ્રકાશની તીવ્રતા સાથે વધે</b> છે. તે <b>પ્રકાશ ઊર્જાને વિદ્યુત current</b> માં ફેરવે છે.</p>\n<h4>Symbol</h4>\n<p>Diode તરફ <b>અંદર આવતા બે arrows</b> (પ્રકાશ અંદર આવે છે) સાથેનો diode symbol.</p>\n<h4>રચના</h4>\n<ul>\n<li><b>Silicon</b> (Ge, InGaAs પણ) નું P-N junction, plastic અથવા metal case માં બંધ.</li>\n<li><b>પારદર્શક window અથવા lens</b> થી પ્રકાશ બરાબર junction પર પડે છે.</li>\n<li>બાકીનો body ઢાંકેલો (કાળો રંગ) હોય છે જેથી પ્રકાશ ફક્ત junction સુધી પહોંચે.</li>\n</ul>\n<h4>કાર્ય</h4>\n<ol>\n<li>Photodiode <b>reverse biased</b> હોય છે, તેથી પ્રકાશ ન હોય ત્યારે ફક્ત ખૂબ નાનો <b>Dark current</b> (minority carrier current) વહે છે.</li>\n<li>જ્યારે પૂરતી ઊર્જાવાળો પ્રકાશ (photons) junction પર પડે, ત્યારે તે covalent bonds તોડી <b>electron-hole pairs</b> બનાવે છે.</li>\n<li>આ વધારાના minority carriers reverse voltage થી junction પાર ધકેલાય છે, તેથી <b>reverse current વધે</b> છે.</li>\n<li>વધુ પ્રકાશની તીવ્રતા → વધુ electron-hole pairs → <b>વધુ reverse current</b>. Current લગભગ પ્રકાશની તીવ્રતાના સમપ્રમાણમાં હોય છે.</li>\n</ol>\n<h4>Characteristics</h4>\n<p>જુદી જુદી પ્રકાશ તીવ્રતા (L1 &lt; L2 &lt; L3) માટે reverse current I<sub>R</sub> વિરુદ્ધ reverse voltage V<sub>R</sub> નો આલેખ. Current લગભગ voltage થી સ્વતંત્ર છે અને મુખ્યત્વે પ્રકાશની તીવ્રતા પર આધાર રાખે છે (આકૃતિ જુઓ).</p>\n<h4>ઉપયોગો</h4>\n<ul>\n<li>Light detectors, <b>automatic street-light</b> નિયંત્રણ અને light meters.</li>\n<li><b>Optical fibre communication</b> receivers.</li>\n<li><b>TV remote-control receivers</b>, smoke detectors, barcode scanners.</li>\n<li>Object counters, burglar alarms, CD/DVD players.</li>\n</ul>"}, "diagram": "u3_photodiode"}, {"h": {"en": "3.5.3 Light Emitting Diode (LED)", "gu": "3.5.3 Light Emitting Diode (LED)"}, "body": {"en": "<p><b>Definition:</b> An LED is a P-N junction diode that <b>emits light when it is forward biased</b>. It converts <b>electrical energy into light energy</b> (electroluminescence).</p>\n<h4>Symbol</h4>\n<p>A diode symbol with <b>two arrows pointing away</b> from the diode (light going out).</p>\n<h4>Construction</h4>\n<ul>\n<li>Made from <b>compound semiconductors</b> (not Si or Ge) such as GaAs, GaAsP, GaP, InGaN.</li>\n<li>The P-N junction is placed in a <b>transparent epoxy dome</b> which acts as a lens.</li>\n<li>A <b>reflector cup</b> directs the light upward.</li>\n<li><b>Anode = longer leg</b>; cathode = shorter leg and <b>flat edge</b> on the body.</li>\n</ul>\n<h4>Working</h4>\n<ol>\n<li>When forward biased, electrons from the N-side and holes from the P-side move towards the junction.</li>\n<li>At the junction, free electrons (conduction band) <b>recombine</b> with holes (valence band).</li>\n<li>During recombination the electron falls to a lower energy level and releases the energy difference as a <b>photon (light)</b>.</li>\n<li>The <b>colour (wavelength)</b> of light depends on the <b>energy gap</b> of the material: λ = hc / E<sub>g</sub>.</li>\n</ol>\n<p><i>Why not Si/Ge?</i> In Si and Ge the energy is released mainly as <b>heat</b> (indirect band gap), not light.</p>\n<h4>Materials and colours</h4>\n<table>\n<tr><th>Material</th><th>Colour</th><th>Typical V<sub>F</sub></th></tr>\n<tr><td>GaAs (Gallium Arsenide)</td><td>Infrared (invisible)</td><td>≈ 1.2 V</td></tr>\n<tr><td>GaAsP (Gallium Arsenide Phosphide)</td><td>Red, orange, yellow</td><td>1.8 – 2.1 V</td></tr>\n<tr><td>GaP (Gallium Phosphide)</td><td>Green (also red)</td><td>≈ 2.2 V</td></tr>\n<tr><td>InGaN (Indium Gallium Nitride)</td><td>Blue, green, white (with phosphor)</td><td>3.0 – 3.3 V</td></tr>\n</table>\n<h4>Characteristics</h4>\n<ul>\n<li>Forward voltage <b>1.8 V to 3.3 V</b> (higher than Si diode), current typically <b>10–20 mA</b>.</li>\n<li>Light output (intensity) is almost <b>proportional to forward current</b>.</li>\n<li>Low reverse breakdown voltage (about <b>5 V</b>) → never apply large reverse voltage.</li>\n<li>A <b>series resistor</b> is required: <b>R = (V<sub>S</sub> − V<sub>F</sub>) / I<sub>F</sub></b>.</li>\n</ul>\n<h4>Advantages</h4>\n<p>Low power, long life (≈ 50,000 hours), small size, fast switching, rugged, available in many colours, no warm-up time.</p>\n<h4>Applications</h4>\n<p>Indicator lamps, <b>7-segment displays</b>, LED TV backlight and screens, traffic signals, LED bulbs and lighting, <b>IR remote controls</b> (IR LED), optocouplers, optical fibre transmitters.</p>", "gu": "<p><b>વ્યાખ્યા:</b> LED એ P-N junction diode છે જે <b>forward bias થતાં પ્રકાશ ઉત્સર્જિત</b> કરે છે. તે <b>વિદ્યુત ઊર્જાને પ્રકાશ ઊર્જા</b> માં ફેરવે છે (electroluminescence).</p>\n<h4>Symbol</h4>\n<p>Diode થી <b>બહાર જતા બે arrows</b> (પ્રકાશ બહાર જાય છે) સાથેનો diode symbol.</p>\n<h4>રચના</h4>\n<ul>\n<li>Si કે Ge નહીં પરંતુ GaAs, GaAsP, GaP, InGaN જેવા <b>Compound semiconductors</b> માંથી બને છે.</li>\n<li>P-N junction ને <b>પારદર્શક epoxy dome</b> માં મૂકાય છે, જે lens તરીકે કામ કરે છે.</li>\n<li><b>Reflector cup</b> પ્રકાશને ઉપર તરફ મોકલે છે.</li>\n<li><b>Anode = લાંબો પગ</b>; cathode = ટૂંકો પગ અને body પર <b>સપાટ ધાર (flat edge)</b>.</li>\n</ul>\n<h4>કાર્ય</h4>\n<ol>\n<li>Forward bias થતાં N-side ના electrons અને P-side ના holes junction તરફ જાય છે.</li>\n<li>Junction પર free electrons (conduction band) holes (valence band) સાથે <b>Recombine</b> થાય છે.</li>\n<li>Recombination વખતે electron નીચા energy level માં આવે છે અને ઊર્જાનો તફાવત <b>Photon (પ્રકાશ)</b> તરીકે છોડે છે.</li>\n<li>પ્રકાશનો <b>રંગ (wavelength)</b> material ના <b>energy gap</b> પર આધાર રાખે છે: λ = hc / E<sub>g</sub>.</li>\n</ol>\n<p><i>Si/Ge કેમ નહીં?</i> Si અને Ge માં ઊર્જા મુખ્યત્વે પ્રકાશ નહીં પરંતુ <b>ઉષ્મા</b> તરીકે છૂટે છે (indirect band gap).</p>\n<h4>Materials અને રંગો</h4>\n<table>\n<tr><th>Material</th><th>રંગ</th><th>સામાન્ય V<sub>F</sub></th></tr>\n<tr><td>GaAs (Gallium Arsenide)</td><td>Infrared (અદ્રશ્ય)</td><td>≈ 1.2 V</td></tr>\n<tr><td>GaAsP (Gallium Arsenide Phosphide)</td><td>લાલ, નારંગી, પીળો</td><td>1.8 – 2.1 V</td></tr>\n<tr><td>GaP (Gallium Phosphide)</td><td>લીલો (લાલ પણ)</td><td>≈ 2.2 V</td></tr>\n<tr><td>InGaN (Indium Gallium Nitride)</td><td>વાદળી, લીલો, સફેદ (phosphor સાથે)</td><td>3.0 – 3.3 V</td></tr>\n</table>\n<h4>Characteristics</h4>\n<ul>\n<li>Forward voltage <b>1.8 V થી 3.3 V</b> (Si diode કરતાં વધુ), current સામાન્ય રીતે <b>10–20 mA</b>.</li>\n<li>પ્રકાશ (intensity) લગભગ <b>forward current ના સમપ્રમાણમાં</b> હોય છે.</li>\n<li>ઓછો reverse breakdown voltage (આશરે <b>5 V</b>) → ક્યારેય વધુ reverse voltage ન લગાવો.</li>\n<li><b>Series resistor</b> જરૂરી છે: <b>R = (V<sub>S</sub> − V<sub>F</sub>) / I<sub>F</sub></b>.</li>\n</ul>\n<h4>ફાયદા</h4>\n<p>ઓછો power, લાંબું આયુષ્ય (≈ 50,000 કલાક), નાનું કદ, ઝડપી switching, મજબૂત, ઘણા રંગોમાં ઉપલબ્ધ, warm-up સમય નહીં.</p>\n<h4>ઉપયોગો</h4>\n<p>Indicator lamps, <b>7-segment displays</b>, LED TV backlight અને screens, traffic signals, LED bulbs અને lighting, <b>IR remote controls</b> (IR LED), optocouplers, optical fibre transmitters.</p>"}, "diagram": "u3_led", "examples": ["u3n2"]}, {"h": {"en": "3.5.4 Multicolour LED", "gu": "3.5.4 Multicolour LED"}, "body": {"en": "<p><b>Definition:</b> A multicolour LED contains <b>two or more LED chips of different colours in a single package</b>. By controlling which chip is ON (and its current), different colours can be obtained.</p>\n<h4>1. Bi-colour LED (2 leads)</h4>\n<ul>\n<li>Two LEDs (usually <b>red and green</b>) connected in <b>inverse parallel (anti-parallel)</b> – anode of one to the cathode of the other.</li>\n<li>Current A → B: the red LED glows. Current B → A: the green LED glows.</li>\n<li>If the polarity is switched quickly (AC), both appear ON → <b>yellow/orange</b>.</li>\n<li>Used for polarity indication, charging/charged status.</li>\n</ul>\n<h4>2. Tri-colour LED (3 leads)</h4>\n<ul>\n<li>Red and green chips with a <b>common cathode</b> (or common anode) and two separate leads.</li>\n<li>Red alone, green alone, or both ON together → <b>third colour (yellow/amber)</b>.</li>\n</ul>\n<h4>3. RGB LED (4 leads)</h4>\n<ul>\n<li>Three chips: <b>Red, Green and Blue</b> with one common lead – <b>common cathode</b> (common −, longest leg) or <b>common anode</b>.</li>\n<li>Primary colour mixing: R + G = Yellow, R + B = Magenta, G + B = Cyan, <b>R + G + B = White</b>.</li>\n<li>By varying the current (brightness) of each chip using <b>PWM</b>, <b>millions of colours</b> can be produced.</li>\n</ul>\n<h4>Applications</h4>\n<p>Status indicators (battery charging red → green), decorative and mood lighting, RGB strips, full-colour LED displays and video walls, gaming keyboards, stage lighting.</p>", "gu": "<p><b>વ્યાખ્યા:</b> Multicolour LED માં <b>એક જ package માં જુદા જુદા રંગના બે કે વધુ LED chips</b> હોય છે. કયો chip ON છે (અને તેનો current) નિયંત્રિત કરીને જુદા જુદા રંગ મેળવી શકાય છે.</p>\n<h4>1. Bi-colour LED (2 leads)</h4>\n<ul>\n<li>બે LEDs (સામાન્ય રીતે <b>લાલ અને લીલો</b>) <b>inverse parallel (anti-parallel)</b> માં જોડેલા – એકનો anode બીજાના cathode સાથે.</li>\n<li>Current A → B: લાલ LED ચમકે. Current B → A: લીલો LED ચમકે.</li>\n<li>Polarity ઝડપથી બદલાય (AC) તો બંને ON દેખાય → <b>પીળો/નારંગી</b>.</li>\n<li>Polarity indication, charging/charged status માટે વપરાય.</li>\n</ul>\n<h4>2. Tri-colour LED (3 leads)</h4>\n<ul>\n<li>લાલ અને લીલા chips, <b>common cathode</b> (અથવા common anode) અને બે અલગ leads સાથે.</li>\n<li>ફક્ત લાલ, ફક્ત લીલો, અથવા બંને એકસાથે ON → <b>ત્રીજો રંગ (પીળો/amber)</b>.</li>\n</ul>\n<h4>3. RGB LED (4 leads)</h4>\n<ul>\n<li>ત્રણ chips: <b>Red, Green અને Blue</b>, એક common lead સાથે – <b>common cathode</b> (common −, સૌથી લાંબો પગ) અથવા <b>common anode</b>.</li>\n<li>પ્રાથમિક રંગોનું મિશ્રણ: R + G = પીળો (Yellow), R + B = Magenta, G + B = Cyan, <b>R + G + B = સફેદ (White)</b>.</li>\n<li><b>PWM</b> થી દરેક chip નો current (તેજ) બદલીને <b>લાખો રંગો</b> મેળવી શકાય.</li>\n</ul>\n<h4>ઉપયોગો</h4>\n<p>Status indicators (battery charging લાલ → લીલો), શણગાર અને mood lighting, RGB strips, full-colour LED displays અને video walls, gaming keyboards, stage lighting.</p>"}, "diagram": "u3_multicolour_led"}, {"h": {"en": "3.5.5 Comparison of Special Diodes", "gu": "3.5.5 Special Diodes ની સરખામણી"}, "body": {"en": "<table>\n<tr><th>Point</th><th>Zener</th><th>Varactor</th><th>Photodiode</th><th>LED</th></tr>\n<tr><td>Bias</td><td>Reverse (breakdown)</td><td>Reverse</td><td>Reverse</td><td>Forward</td></tr>\n<tr><td>Principle</td><td>Constant V<sub>Z</sub> in breakdown</td><td>C<sub>T</sub> changes with V<sub>R</sub></td><td>Light → current</td><td>Current → light</td></tr>\n<tr><td>Energy conversion</td><td>—</td><td>—</td><td>Light → electrical</td><td>Electrical → light</td></tr>\n<tr><td>Material</td><td>Si (heavily doped)</td><td>Si, GaAs</td><td>Si, Ge, InGaAs</td><td>GaAs, GaAsP, GaP, InGaN</td></tr>\n<tr><td>Symbol feature</td><td>Bent \"Z\" bar</td><td>Capacitor plates</td><td>Arrows inward</td><td>Arrows outward</td></tr>\n<tr><td>Main use</td><td>Voltage regulator</td><td>Electronic tuning, VCO</td><td>Light detector, receiver</td><td>Indicator, display, lighting</td></tr>\n</table>", "gu": "<table>\n<tr><th>મુદ્દો</th><th>Zener</th><th>Varactor</th><th>Photodiode</th><th>LED</th></tr>\n<tr><td>Bias</td><td>Reverse (breakdown)</td><td>Reverse</td><td>Reverse</td><td>Forward</td></tr>\n<tr><td>સિદ્ધાંત</td><td>Breakdown માં અચળ V<sub>Z</sub></td><td>V<sub>R</sub> સાથે C<sub>T</sub> બદલાય</td><td>પ્રકાશ → current</td><td>Current → પ્રકાશ</td></tr>\n<tr><td>ઊર્જા રૂપાંતર</td><td>—</td><td>—</td><td>પ્રકાશ → વિદ્યુત</td><td>વિદ્યુત → પ્રકાશ</td></tr>\n<tr><td>Material</td><td>Si (વધુ doped)</td><td>Si, GaAs</td><td>Si, Ge, InGaAs</td><td>GaAs, GaAsP, GaP, InGaN</td></tr>\n<tr><td>Symbol લક્ષણ</td><td>વાળેલો \"Z\" bar</td><td>Capacitor plates</td><td>અંદર તરફ arrows</td><td>બહાર તરફ arrows</td></tr>\n<tr><td>મુખ્ય ઉપયોગ</td><td>Voltage regulator</td><td>Electronic tuning, VCO</td><td>Light detector, receiver</td><td>Indicator, display, lighting</td></tr>\n</table>"}}, {"h": {"en": "Key Points – 3.5", "gu": "મુખ્ય મુદ્દા – 3.5"}, "body": {"en": "<ul>\n<li><b>Varactor:</b> reverse biased; C<sub>T</sub> = εA/W; V<sub>R</sub> ↑ → W ↑ → C ↓; used for electronic tuning, VCO, AFC.</li>\n<li><b>Photodiode:</b> reverse biased; light → electron-hole pairs → reverse current ∝ light intensity; dark current when no light.</li>\n<li><b>LED:</b> forward biased; recombination releases photons; colour depends on energy gap; V<sub>F</sub> 1.8–3.3 V, I<sub>F</sub> 10–20 mA; series R = (V<sub>S</sub> − V<sub>F</sub>)/I<sub>F</sub>.</li>\n<li>LED materials: GaAs (IR), GaAsP (red/yellow), GaP (green), InGaN (blue/white).</li>\n<li><b>Multicolour LED:</b> bi-colour (2 leads, anti-parallel), tri-colour (3 leads), RGB (4 leads, common anode/cathode).</li>\n<li>Photodiode symbol arrows point <b>in</b>; LED arrows point <b>out</b>.</li>\n</ul>", "gu": "<ul>\n<li><b>Varactor:</b> reverse biased; C<sub>T</sub> = εA/W; V<sub>R</sub> ↑ → W ↑ → C ↓; electronic tuning, VCO, AFC માં વપરાય.</li>\n<li><b>Photodiode:</b> reverse biased; પ્રકાશ → electron-hole pairs → reverse current ∝ પ્રકાશની તીવ્રતા; પ્રકાશ ન હોય ત્યારે dark current.</li>\n<li><b>LED:</b> forward biased; recombination થી photons છૂટે; રંગ energy gap પર આધાર રાખે; V<sub>F</sub> 1.8–3.3 V, I<sub>F</sub> 10–20 mA; series R = (V<sub>S</sub> − V<sub>F</sub>)/I<sub>F</sub>.</li>\n<li>LED materials: GaAs (IR), GaAsP (લાલ/પીળો), GaP (લીલો), InGaN (વાદળી/સફેદ).</li>\n<li><b>Multicolour LED:</b> bi-colour (2 leads, anti-parallel), tri-colour (3 leads), RGB (4 leads, common anode/cathode).</li>\n<li>Photodiode symbol ના arrows <b>અંદર</b>; LED ના arrows <b>બહાર</b>.</li>\n</ul>"}, "key": true}]}, {"title": {"en": "3.6 Rectifiers", "gu": "3.6 Rectifiers"}, "items": [{"h": {"en": "3.6.1 Need of Rectifier and Definition", "gu": "3.6.1 Rectifier ની જરૂરિયાત અને વ્યાખ્યા"}, "body": {"en": "<h4>Need</h4>\n<ul>\n<li>The electricity supplied to homes is <b>AC</b> (230 V, 50 Hz in India).</li>\n<li>Almost all electronic circuits – mobiles, computers, TVs, amplifiers, ICs – need a <b>steady DC</b> supply of low voltage (5 V, 9 V, 12 V…).</li>\n<li>Batteries are costly and need replacement, so DC is obtained from the AC mains using a <b>DC power supply</b>.</li>\n<li>The heart of a DC power supply is the <b>rectifier</b>.</li>\n</ul>\n<h4>Definition</h4>\n<p>A <b>rectifier</b> is a circuit that converts <b>alternating current (AC) into pulsating direct current (DC)</b>. The process is called <b>rectification</b>. It uses the <b>unidirectional</b> property of the diode (conducts only in forward bias).</p>\n<h4>Blocks of a regulated DC power supply</h4>\n<p>AC mains → <b>Step-down transformer</b> → <b>Rectifier</b> → <b>Filter</b> → <b>Regulator</b> → DC output</p>\n<ul>\n<li><b>Transformer:</b> reduces 230 V AC to the required low AC voltage.</li>\n<li><b>Rectifier:</b> converts AC to pulsating DC.</li>\n<li><b>Filter (capacitor):</b> removes ripples (AC component) and smooths the DC.</li>\n<li><b>Regulator (Zener / IC 78xx):</b> keeps output DC constant.</li>\n</ul>", "gu": "<h4>જરૂરિયાત</h4>\n<ul>\n<li>ઘરોમાં મળતી વીજળી <b>AC</b> છે (ભારતમાં 230 V, 50 Hz).</li>\n<li>લગભગ બધા electronic circuits – mobiles, computers, TVs, amplifiers, ICs – ને ઓછા voltage (5 V, 9 V, 12 V…) ના <b>સ્થિર DC</b> supply ની જરૂર પડે છે.</li>\n<li>Batteries મોંઘી છે અને બદલવી પડે છે, તેથી <b>DC power supply</b> દ્વારા AC mains માંથી DC મેળવાય છે.</li>\n<li>DC power supply નું હૃદય <b>Rectifier</b> છે.</li>\n</ul>\n<h4>વ્યાખ્યા</h4>\n<p><b>Rectifier</b> એ એવો circuit છે જે <b>alternating current (AC) ને pulsating direct current (DC)</b> માં ફેરવે છે. આ પ્રક્રિયાને <b>Rectification</b> કહે છે. તે diode ના <b>Unidirectional</b> ગુણધર્મ (ફક્ત forward bias માં conduction) નો ઉપયોગ કરે છે.</p>\n<h4>Regulated DC power supply ના blocks</h4>\n<p>AC mains → <b>Step-down transformer</b> → <b>Rectifier</b> → <b>Filter</b> → <b>Regulator</b> → DC output</p>\n<ul>\n<li><b>Transformer:</b> 230 V AC ને જરૂરી ઓછા AC voltage માં ઘટાડે.</li>\n<li><b>Rectifier:</b> AC ને pulsating DC માં ફેરવે.</li>\n<li><b>Filter (capacitor):</b> ripples (AC ઘટક) દૂર કરી DC ને સરળ (smooth) બનાવે.</li>\n<li><b>Regulator (Zener / IC 78xx):</b> output DC ને અચળ રાખે.</li>\n</ul>"}}, {"h": {"en": "3.6.2 Types of Rectifiers", "gu": "3.6.2 Rectifiers ના પ્રકાર"}, "body": {"en": "<ol>\n<li><b>Half-wave rectifier (HWR):</b> uses <b>one diode</b>; conducts only during one half-cycle (positive) of AC input.</li>\n<li><b>Full-wave rectifier (FWR):</b> conducts during <b>both half-cycles</b>. Two types:\n<ul>\n<li><b>Centre-tapped full-wave rectifier</b> – uses <b>two diodes</b> and a <b>centre-tapped transformer</b>.</li>\n<li><b>Bridge rectifier</b> – uses <b>four diodes</b> in a bridge; no centre tap needed.</li>\n</ul></li>\n</ol>\n<p>Rectifiers can also be classified by phase (single-phase / three-phase) and by control (uncontrolled using diodes / controlled using SCRs). In this syllabus we study <b>single-phase uncontrolled</b> rectifiers.</p>", "gu": "<ol>\n<li><b>Half-wave rectifier (HWR):</b> <b>એક diode</b> વાપરે છે; AC input ના ફક્ત એક half-cycle (positive) દરમિયાન conduction કરે.</li>\n<li><b>Full-wave rectifier (FWR):</b> <b>બંને half-cycles</b> દરમિયાન conduction કરે. બે પ્રકાર:\n<ul>\n<li><b>Centre-tapped full-wave rectifier</b> – <b>બે diodes</b> અને <b>centre-tapped transformer</b> વાપરે.</li>\n<li><b>Bridge rectifier</b> – bridge માં <b>ચાર diodes</b> વાપરે; centre tap ની જરૂર નથી.</li>\n</ul></li>\n</ol>\n<p>Rectifiers ને phase (single-phase / three-phase) અને control (diodes વાળા uncontrolled / SCRs વાળા controlled) પ્રમાણે પણ વર્ગીકૃત કરી શકાય. આ syllabus માં આપણે <b>single-phase uncontrolled</b> rectifiers ભણીએ છીએ.</p>"}}, {"h": {"en": "3.6.3 Performance Parameters of Rectifiers", "gu": "3.6.3 Rectifiers ના Performance Parameters"}, "body": {"en": "<p>V<sub>m</sub> = peak secondary voltage, I<sub>m</sub> = peak load current = V<sub>m</sub> / (r<sub>f</sub> + R<sub>L</sub>), where r<sub>f</sub> = diode forward resistance.</p>\n<h4>1. Average (DC) value – V<sub>dc</sub>, I<sub>dc</sub></h4>\n<p>The average value of the pulsating output over one cycle. This is what a DC voltmeter reads.</p>\n<h4>2. RMS value – V<sub>rms</sub>, I<sub>rms</sub></h4>\n<p>Effective value of the output, which includes both DC and AC components.</p>\n<h4>3. Ripple factor (r or γ)</h4>\n<p>The ratio of the RMS value of the AC component (ripple) to the DC value of the output. It shows how pure the DC is. <b>Smaller is better</b>.</p>\n<p><b>r = V<sub>ac(rms)</sub> / V<sub>dc</sub> = √[(I<sub>rms</sub> / I<sub>dc</sub>)² − 1]</b></p>\n<h4>4. Rectification efficiency (η)</h4>\n<p>The ratio of DC output power to AC input power. <b>Higher is better</b>.</p>\n<p><b>η = P<sub>dc</sub> / P<sub>ac</sub> = I<sub>dc</sub>² R<sub>L</sub> / [I<sub>rms</sub>² (r<sub
