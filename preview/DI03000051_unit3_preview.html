<script>
const U = {"subject": "DI03000051", "unit": 3, "format": "notes", "title": {"en": "Transmission Media and Network Devices", "gu": "Transmission Media અને Network Devices"}, "weightage": 22, "hours": 10, "notes": [{"title": {"en": "3.1 Guided Media", "gu": "3.1 Guided Media"}, "items": [{"h": {"en": "3.1.1 Transmission Media and Classification", "gu": "3.1.1 Transmission Media અને વર્ગીકરણ"}, "body": {"en": "<p>A <b>transmission medium</b> is the <b>physical path</b> between the sender and the receiver through which signals travel. It is located below the physical layer and is controlled by it (sometimes called layer 0).</p>\n<h4>Classification</h4>\n<ul>\n<li><b>Guided (wired / bounded) media:</b> provide a conduit from one device to another; the signal is directed and contained by the physical limits of the medium. Examples: <b>twisted pair cable</b>, <b>coaxial cable</b> (both carry electric current, copper) and <b>fiber optic cable</b> (carries light).</li>\n<li><b>Unguided (wireless / unbounded) media:</b> transport electromagnetic waves <b>without a physical conductor</b>; signals are broadcast through free space (air, vacuum, water). Examples: <b>radio waves, microwaves, infrared</b>; satellite communication uses microwaves.</li>\n</ul>\n<h4>Factors for selecting a medium</h4>\n<p>Bandwidth / data rate required, distance (attenuation), cost, ease of installation, noise immunity, security, and the environment (indoor / outdoor).</p>\n<p><b>Transmission impairments:</b> <b>attenuation</b> (loss of signal strength with distance), <b>distortion</b> (change of signal shape) and <b>noise</b> (unwanted signals: thermal, crosstalk, EMI).</p>", "gu": "<p><b>Transmission medium</b> એ sender અને receiver વચ્ચેનો <b>physical માર્ગ</b> છે જેમાંથી signals પસાર થાય છે. તે physical layer ની નીચે આવેલું છે અને તેના દ્વારા નિયંત્રિત થાય છે (ક્યારેક layer 0 કહેવાય).</p>\n<h4>વર્ગીકરણ</h4>\n<ul>\n<li><b>Guided (wired / bounded) media:</b> એક device થી બીજા device સુધી માર્ગ આપે; signal medium ની physical મર્યાદામાં દિશાબદ્ધ અને સમાયેલો રહે. ઉદાહરણો: <b>twisted pair cable</b>, <b>coaxial cable</b> (બંને electric current વહન કરે, copper) અને <b>fiber optic cable</b> (પ્રકાશ વહન કરે).</li>\n<li><b>Unguided (wireless / unbounded) media:</b> <b>physical conductor વગર</b> electromagnetic waves લઈ જાય; signals મુક્ત અવકાશ (હવા, vacuum, પાણી) માં broadcast થાય. ઉદાહરણો: <b>radio waves, microwaves, infrared</b>; satellite communication microwaves વાપરે.</li>\n</ul>\n<h4>Medium પસંદ કરવાનાં પરિબળો</h4>\n<p>જરૂરી bandwidth / data rate, અંતર (attenuation), ખર્ચ, installation ની સરળતા, noise immunity, security, અને વાતાવરણ (indoor / outdoor).</p>\n<p><b>Transmission impairments:</b> <b>attenuation</b> (અંતર સાથે signal ની તાકાત ઘટવી), <b>distortion</b> (signal નો આકાર બદલાવો) અને <b>noise</b> (અનિચ્છનીય signals: thermal, crosstalk, EMI).</p>"}, "diagram": "cn3_class"}, {"h": {"en": "3.1.2 Twisted Pair Cable: UTP and STP", "gu": "3.1.2 Twisted Pair Cable: UTP અને STP"}, "body": {"en": "<p>A twisted pair consists of <b>two insulated copper conductors twisted together</b>. One wire carries the signal and the other is the ground reference. <b>Twisting</b> makes both wires equally affected by external noise, so the receiver (which uses the difference) cancels the noise; it also reduces <b>crosstalk</b> between pairs. A LAN cable has <b>4 pairs (8 wires)</b> with colour codes orange, green, blue and brown.</p>\n<h4>Types</h4>\n<ul><li><b>UTP (Unshielded Twisted Pair):</b> no metal shield; most common LAN cable.</li><li><b>STP (Shielded Twisted Pair):</b> each pair and/or the whole cable is covered with metal foil or braided mesh, which reduces electromagnetic interference (EMI) and crosstalk.</li></ul>\n<table><tr><th>UTP</th><th>STP</th></tr><tr><td>Unshielded Twisted Pair</td><td>Shielded Twisted Pair</td></tr><tr><td>No metal shield</td><td>Metal foil / braided shield around pairs</td></tr><tr><td>Cheaper, lighter, flexible, easy to install</td><td>Costly, heavier, bulky, harder to install</td></tr><tr><td>More affected by noise and crosstalk</td><td>Better protection from EMI and crosstalk</td></tr><tr><td>Used in LANs, telephone lines</td><td>Used in noisy industrial areas, data centres</td></tr><tr><td>Connector RJ-45 / RJ-11</td><td>Shielded RJ-45; shield must be grounded</td></tr></table>\n<h4>Categories (EIA/TIA)</h4>\n<table><tr><th>Category</th><th>Max data rate</th><th>Use</th></tr><tr><td>Cat 3</td><td>10 Mbps</td><td>Telephone, old 10BaseT LAN</td></tr><tr><td>Cat 5</td><td>100 Mbps</td><td>Fast Ethernet</td></tr><tr><td>Cat 5e</td><td>1 Gbps</td><td>Gigabit Ethernet (most common)</td></tr><tr><td>Cat 6</td><td>1-10 Gbps (10 G up to 55 m)</td><td>Gigabit / 10G LAN</td></tr><tr><td>Cat 6a</td><td>10 Gbps (100 m)</td><td>Data centres</td></tr><tr><td>Cat 7 / 8</td><td>10-40 Gbps</td><td>Shielded, data centres</td></tr></table>\n<h4>Connectors</h4>\n<p><b>RJ-45</b> (8 pins, LAN cables), <b>RJ-11</b> (4/6 pins, telephone).</p>\n<h4>Applications</h4>\n<p>Ethernet LANs (10BaseT, 100BaseTX, 1000BaseT), telephone lines, DSL broadband, CCTV (with baluns).</p>\n<h4>Advantages</h4><ul><li>Cheapest and most widely available medium.</li><li>Light, thin and flexible; easy to install and terminate.</li><li>Supports high data rates (1-10 Gbps) over short distances.</li><li>Twisting reduces noise and crosstalk.</li></ul><h4>Disadvantages</h4><ul><li>Short distance: about 100 m per segment, then a repeater / switch is needed.</li><li>Susceptible to EMI and noise (UTP); attenuation is high.</li><li>Lower bandwidth than coaxial and fiber.</li><li>Easy to tap, so less secure.</li></ul>", "gu": "<p>Twisted pair માં <b>એકબીજા સાથે વળેલા બે insulated copper conductors</b> હોય છે. એક wire signal લઈ જાય અને બીજો ground reference છે. <b>Twisting</b> થી બંને wires પર બહારના noise ની સરખી અસર થાય, તેથી receiver (જે તફાવત વાપરે છે) noise રદ કરે; તે pairs વચ્ચેનું <b>crosstalk</b> પણ ઘટાડે. LAN cable માં orange, green, blue અને brown colour codes સાથે <b>4 pairs (8 wires)</b> હોય છે.</p>\n<h4>પ્રકારો</h4>\n<ul><li><b>UTP (Unshielded Twisted Pair):</b> metal shield નથી; સૌથી સામાન્ય LAN cable.</li><li><b>STP (Shielded Twisted Pair):</b> દરેક pair અને/અથવા આખો cable metal foil કે braided mesh થી ઢંકાયેલો, જે electromagnetic interference (EMI) અને crosstalk ઘટાડે.</li></ul>\n<table><tr><th>UTP</th><th>STP</th></tr><tr><td>Unshielded Twisted Pair</td><td>Shielded Twisted Pair</td></tr><tr><td>Metal shield નથી</td><td>Pairs ફરતે metal foil / braided shield</td></tr><tr><td>સસ્તું, હલકું, flexible, install કરવું સહેલું</td><td>ખર્ચાળ, ભારે, જાડું, install કરવું મુશ્કેલ</td></tr><tr><td>Noise અને crosstalk ની વધુ અસર</td><td>EMI અને crosstalk થી વધુ રક્ષણ</td></tr><tr><td>LANs, telephone lines માં વપરાય</td><td>Noisy industrial વિસ્તારો, data centres માં વપરાય</td></tr><tr><td>Connector RJ-45 / RJ-11</td><td>Shielded RJ-45; shield ground કરવું જરૂરી</td></tr></table>\n<h4>Categories (EIA/TIA)</h4>\n<table><tr><th>Category</th><th>મહત્તમ data rate</th><th>ઉપયોગ</th></tr><tr><td>Cat 3</td><td>10 Mbps</td><td>Telephone, જૂનું 10BaseT LAN</td></tr><tr><td>Cat 5</td><td>100 Mbps</td><td>Fast Ethernet</td></tr><tr><td>Cat 5e</td><td>1 Gbps</td><td>Gigabit Ethernet (સૌથી સામાન્ય)</td></tr><tr><td>Cat 6</td><td>1-10 Gbps (10 G 55 m સુધી)</td><td>Gigabit / 10G LAN</td></tr><tr><td>Cat 6a</td><td>10 Gbps (100 m)</td><td>Data centres</td></tr><tr><td>Cat 7 / 8</td><td>10-40 Gbps</td><td>Shielded, data centres</td></tr></table>\n<h4>Connectors</h4>\n<p><b>RJ-45</b> (8 pins, LAN cables), <b>RJ-11</b> (4/6 pins, telephone).</p>\n<h4>ઉપયોગો</h4>\n<p>Ethernet LANs (10BaseT, 100BaseTX, 1000BaseT), telephone lines, DSL broadband, CCTV (baluns સાથે).</p>\n<h4>ફાયદા</h4><ul><li>સૌથી સસ્તું અને વ્યાપક રીતે ઉપલબ્ધ medium.</li><li>હલકું, પાતળું અને flexible; install અને terminate કરવું સહેલું.</li><li>ટૂંકા અંતર માટે વધુ data rates (1-10 Gbps) support કરે.</li><li>Twisting noise અને crosstalk ઘટાડે.</li></ul><h4>ગેરફાયદા</h4><ul><li>ટૂંકું અંતર: segment દીઠ લગભગ 100 m, પછી repeater / switch જોઈએ.</li><li>EMI અને noise ની અસર (UTP); attenuation વધુ.</li><li>Coaxial અને fiber કરતાં ઓછી bandwidth.</li><li>Tap કરવું સહેલું, તેથી ઓછું secure.</li></ul>"}, "diagram": "cn3_tp"}, {"h": {"en": "3.1.3 Straight and Cross UTP Cable (Practical 3)", "gu": "3.1.3 Straight અને Cross UTP Cable (Practical 3)"}, "body": {"en": "<p>UTP cables are terminated with <b>RJ-45</b> connectors according to the EIA/TIA <b>T568A</b> or <b>T568B</b> colour standards. Hold the connector with the clip facing down and the pins towards you: pin 1 is on the left.</p>\n<table><tr><th>Pin</th><th>T568A</th><th>T568B</th></tr><tr><td>1</td><td>White-green</td><td>White-orange</td></tr><tr><td>2</td><td>Green</td><td>Orange</td></tr><tr><td>3</td><td>White-orange</td><td>White-green</td></tr><tr><td>4</td><td>Blue</td><td>Blue</td></tr><tr><td>5</td><td>White-blue</td><td>White-blue</td></tr><tr><td>6</td><td>Orange</td><td>Green</td></tr><tr><td>7</td><td>White-brown</td><td>White-brown</td></tr><tr><td>8</td><td>Brown</td><td>Brown</td></tr></table>\n<h4>Types of cable</h4>\n<ul>\n<li><b>Straight-through cable:</b> the <b>same standard at both ends</b> (B-B or A-A). Pin 1 connects to pin 1, and so on. Used to connect <b>different devices</b>: PC to switch / hub, switch to router.</li>\n<li><b>Crossover cable:</b> <b>T568A at one end and T568B at the other</b>. Pins 1-3 and 2-6 are swapped so that the transmit pair of one device reaches the receive pair of the other. Used to connect <b>similar devices</b>: PC to PC, switch to switch, router to router (modern ports with <b>Auto-MDIX</b> work with either cable).</li>\n<li><b>Rollover (console) cable:</b> pin order fully reversed (1-8, 2-7 …); connects a PC to the console port of a router / switch.</li>\n</ul>\n<h4>Procedure</h4>\n<ol><li>Tools: Cat5e / Cat6 cable, RJ-45 connectors, <b>crimping tool</b>, wire stripper, <b>LAN cable tester</b>.</li><li>Strip about 2-3 cm of the outer jacket without cutting the wires.</li><li>Untwist the pairs and arrange the 8 wires in the T568B (or T568A) order; straighten and cut them evenly to about 1.5 cm.</li><li>Insert the wires fully into the RJ-45 connector (clip down) so that every wire touches the end; the jacket should go inside the connector.</li><li>Crimp firmly with the crimping tool.</li><li>Repeat at the other end: same standard for straight, the other standard for cross.</li><li>Test with the LAN tester: for straight, LEDs 1-8 light in the same order on both units; for cross, 1→3, 2→6, 3→1, 6→2.</li></ol>", "gu": "<p>UTP cables EIA/TIA <b>T568A</b> કે <b>T568B</b> colour standards મુજબ <b>RJ-45</b> connectors વડે terminate થાય છે. Connector ને clip નીચે અને pins તમારી તરફ રાખી પકડો: pin 1 ડાબી બાજુ છે.</p>\n<table><tr><th>Pin</th><th>T568A</th><th>T568B</th></tr><tr><td>1</td><td>White-green</td><td>White-orange</td></tr><tr><td>2</td><td>Green</td><td>Orange</td></tr><tr><td>3</td><td>White-orange</td><td>White-green</td></tr><tr><td>4</td><td>Blue</td><td>Blue</td></tr><tr><td>5</td><td>White-blue</td><td>White-blue</td></tr><tr><td>6</td><td>Orange</td><td>Green</td></tr><tr><td>7</td><td>White-brown</td><td>White-brown</td></tr><tr><td>8</td><td>Brown</td><td>Brown</td></tr></table>\n<h4>Cable ના પ્રકારો</h4>\n<ul>\n<li><b>Straight-through cable:</b> <b>બંને છેડે સરખું standard</b> (B-B અથવા A-A). Pin 1 pin 1 સાથે, વગેરે. <b>જુદા devices</b> જોડવા વપરાય: PC થી switch / hub, switch થી router.</li>\n<li><b>Crossover cable:</b> <b>એક છેડે T568A અને બીજા છેડે T568B</b>. Pins 1-3 અને 2-6 અદલાબદલી થાય જેથી એક device ની transmit pair બીજાની receive pair સુધી પહોંચે. <b>સરખા devices</b> જોડવા વપરાય: PC થી PC, switch થી switch, router થી router (<b>Auto-MDIX</b> વાળા આધુનિક ports કોઈ પણ cable સાથે કામ કરે).</li>\n<li><b>Rollover (console) cable:</b> pin ક્રમ સંપૂર્ણ ઊલટો (1-8, 2-7 …); PC ને router / switch ના console port સાથે જોડે.</li>\n</ul>\n<h4>પદ્ધતિ</h4>\n<ol><li>સાધનો: Cat5e / Cat6 cable, RJ-45 connectors, <b>crimping tool</b>, wire stripper, <b>LAN cable tester</b>.</li><li>Wires કાપ્યા વગર બહારનું jacket લગભગ 2-3 cm છોલો.</li><li>Pairs ખોલી 8 wires ને T568B (કે T568A) ક્રમમાં ગોઠવો; સીધા કરી લગભગ 1.5 cm સરખા કાપો.</li><li>Wires ને RJ-45 connector (clip નીચે) માં પૂરા દાખલ કરો જેથી દરેક wire છેડાને અડે; jacket connector ની અંદર જવું જોઈએ.</li><li>Crimping tool થી મજબૂત crimp કરો.</li><li>બીજા છેડે પુનરાવર્તન કરો: straight માટે સરખું standard, cross માટે બીજું standard.</li><li>LAN tester થી test કરો: straight માટે બંને units પર LEDs 1-8 સરખા ક્રમમાં ઝબકે; cross માટે 1→3, 2→6, 3→1, 6→2.</li></ol>"}, "diagram": "cn3_rj45"}, {"h": {"en": "3.1.4 Coaxial Cable", "gu": "3.1.4 Coaxial Cable"}, "body": {"en": "<p>Coaxial cable (coax) carries signals of higher frequency than twisted pair. It has a <b>central copper conductor</b> enclosed in an <b>insulating sheath (dielectric)</b>, which is encased in an <b>outer conductor of metal foil / braid</b> (acting as a shield and as the second conductor), all covered by a <b>protective plastic jacket</b>. Both conductors share the same axis, hence \"co-axial\".</p>\n<h4>Standards (Radio Government ratings)</h4>\n<ul><li><b>RG-59</b> (75 Ω): cable TV, CCTV.</li><li><b>RG-58</b> (50 Ω): thin Ethernet (10Base2, 185 m).</li><li><b>RG-11</b> (50 Ω): thick Ethernet (10Base5, 500 m).</li><li>RG-6: satellite / cable TV and broadband.</li></ul>\n<h4>Connectors</h4>\n<ul><li><b>BNC connector</b> (Bayonet Neill-Concelman): connects the end of the cable to a device (TV, NIC).</li><li><b>BNC T-connector:</b> used in Ethernet bus networks to branch out to a computer.</li><li><b>BNC terminator:</b> at the ends of the bus to prevent signal reflection.</li><li><b>F-type connector:</b> cable TV and set-top boxes.</li></ul>\n<h4>Applications</h4>\n<p>Cable TV distribution, CCTV cameras, old Ethernet LANs (bus topology), long-distance telephone trunks, cable broadband Internet (DOCSIS), connecting antennas to radios.</p>\n<h4>Advantages</h4><ul><li>Higher bandwidth and longer distance than twisted pair.</li><li>Better shielding: less affected by noise and interference.</li><li>Durable; supports many TV channels (broadband).</li><li>Cheaper than fiber.</li></ul><h4>Disadvantages</h4><ul><li>Thicker, heavier and less flexible than twisted pair; harder to install.</li><li>A fault in a bus-type coaxial cable can bring down the whole network.</li><li>Costlier than twisted pair; replaced by UTP and fiber in LANs.</li></ul>", "gu": "<p>Coaxial cable (coax) twisted pair કરતાં વધુ frequency ના signals વહન કરે છે. તેમાં <b>વચ્ચે copper conductor</b> હોય છે જે <b>insulating sheath (dielectric)</b> થી ઢંકાયેલો હોય, તે <b>metal foil / braid ના બહારના conductor</b> (shield અને બીજા conductor તરીકે કામ કરે) માં બંધ હોય, અને બધું <b>રક્ષણાત્મક plastic jacket</b> થી ઢંકાયેલું હોય. બંને conductors ની ધરી (axis) એક જ છે, તેથી \"co-axial\".</p>\n<h4>Standards (Radio Government ratings)</h4>\n<ul><li><b>RG-59</b> (75 Ω): cable TV, CCTV.</li><li><b>RG-58</b> (50 Ω): thin Ethernet (10Base2, 185 m).</li><li><b>RG-11</b> (50 Ω): thick Ethernet (10Base5, 500 m).</li><li>RG-6: satellite / cable TV અને broadband.</li></ul>\n<h4>Connectors</h4>\n<ul><li><b>BNC connector</b> (Bayonet Neill-Concelman): cable ના છેડાને device (TV, NIC) સાથે જોડે.</li><li><b>BNC T-connector:</b> Ethernet bus networks માં computer સુધી શાખા કાઢવા.</li><li><b>BNC terminator:</b> signal reflection અટકાવવા bus ના છેડે.</li><li><b>F-type connector:</b> cable TV અને set-top boxes.</li></ul>\n<h4>ઉપયોગો</h4>\n<p>Cable TV distribution, CCTV cameras, જૂના Ethernet LANs (bus topology), લાંબા અંતરની telephone trunks, cable broadband Internet (DOCSIS), antennas ને radios સાથે જોડવા.</p>\n<h4>ફાયદા</h4><ul><li>Twisted pair કરતાં વધુ bandwidth અને લાંબું અંતર.</li><li>સારું shielding: noise અને interference ની ઓછી અસર.</li><li>ટકાઉ; ઘણી TV channels (broadband) support કરે.</li><li>Fiber કરતાં સસ્તું.</li></ul><h4>ગેરફાયદા</h4><ul><li>Twisted pair કરતાં જાડું, ભારે અને ઓછું flexible; install કરવું મુશ્કેલ.</li><li>Bus-type coaxial cable માં fault આખું network બંધ કરી શકે.</li><li>Twisted pair કરતાં મોંઘું; LANs માં UTP અને fiber એ સ્થાન લીધું.</li></ul>"}, "diagram": "cn3_coax"}, {"h": {"en": "3.1.5 Fiber Optic Cable", "gu": "3.1.5 Fiber Optic Cable"}, "body": {"en": "<p>A fiber optic cable is made of <b>glass or plastic</b> and transmits signals in the form of <b>light</b>. It consists of a <b>core</b> (thin glass with higher refractive index n1), surrounded by <b>cladding</b> (glass with lower refractive index n2), a <b>buffer coating</b> (plastic, protects from moisture) and an outer <b>jacket</b> (with strength members such as Kevlar).</p>\n<h4>Principle: total internal reflection</h4>\n<p>When light travels from a denser medium (core) to a less dense medium (cladding) and the angle of incidence is <b>greater than the critical angle</b>, the light is reflected completely back into the core. So light travels along the fiber by repeated reflection, even around gentle bends. Critical angle: sin θc = n2 / n1. A <b>LED or laser</b> converts electrical signals to light at the sender; a <b>photodiode</b> converts light back at the receiver.</p>\n<h4>Propagation modes</h4>\n<ul>\n<li><b>Multimode step-index:</b> core density is uniform and changes abruptly at the cladding; many beams take different paths, so pulses spread (modal dispersion). Short distances.</li>\n<li><b>Multimode graded-index:</b> refractive index is highest at the centre and decreases gradually towards the edge; beams curve, reducing distortion.</li>\n<li><b>Single mode:</b> very thin core (8-10 µm) and a laser source; light travels almost straight in one path; least distortion, highest bandwidth and longest distance.</li>\n</ul>\n<table><tr><th>Point</th><th>Single mode</th><th>Multimode</th></tr><tr><td>Core diameter</td><td>8-10 µm (very thin)</td><td>50 or 62.5 µm</td></tr><tr><td>Light source</td><td>Laser</td><td>LED / laser</td></tr><tr><td>Paths of light</td><td>One</td><td>Many (step / graded index)</td></tr><tr><td>Distance</td><td>Up to 40-100 km</td><td>Up to about 2 km</td></tr><tr><td>Bandwidth</td><td>Very high</td><td>Lower (modal dispersion)</td></tr><tr><td>Cost</td><td>Cable cheaper, equipment costly</td><td>Equipment cheaper</td></tr><tr><td>Use</td><td>Telecom, Internet backbone, MAN / WAN</td><td>LAN, campus, data centre</td></tr></table>\n<h4>Connectors</h4>\n<p><b>SC</b> (subscriber channel, push-pull), <b>ST</b> (straight tip, bayonet), <b>LC</b> (small form factor), <b>MT-RJ</b> (duplex, same size as RJ-45).</p>\n<h4>Applications</h4>\n<p>Internet backbone and undersea cables, FTTH broadband (JioFiber, Airtel Xstream), LAN backbones between buildings, cable TV trunks, medical endoscopy, military networks.</p>\n<h4>Advantages</h4><ul><li>Very high bandwidth (Tbps possible) and data rate.</li><li>Very low attenuation: long distance (up to 100 km) without repeaters.</li><li>Immune to electromagnetic interference and lightning; no crosstalk.</li><li>Very secure: difficult to tap without detection.</li><li>Thin and light; glass does not corrode.</li></ul><h4>Disadvantages</h4><ul><li>Expensive cable, connectors and equipment (lasers, optical transceivers).</li><li>Installation and splicing need skill and special tools.</li><li>Fragile: glass breaks if bent too sharply.</li><li>Light travels in one direction: two fibers are needed for two-way communication.</li></ul>", "gu": "<p>Fiber optic cable <b>glass કે plastic</b> નો બનેલો છે અને signals ને <b>પ્રકાશ</b> સ્વરૂપે મોકલે છે. તેમાં <b>core</b> (વધુ refractive index n1 વાળો પાતળો glass), તેની ફરતે <b>cladding</b> (ઓછા refractive index n2 વાળો glass), <b>buffer coating</b> (plastic, ભેજથી રક્ષણ) અને બહાર <b>jacket</b> (Kevlar જેવા strength members સાથે) હોય છે.</p>\n<h4>સિદ્ધાંત: total internal reflection</h4>\n<p>પ્રકાશ ઘટ્ટ માધ્યમ (core) થી ઓછા ઘટ્ટ માધ્યમ (cladding) માં જાય અને આપાત કોણ <b>critical angle કરતાં મોટો</b> હોય ત્યારે પ્રકાશ સંપૂર્ણ રીતે core માં પાછો પરાવર્તિત થાય. તેથી પ્રકાશ વારંવાર પરાવર્તન દ્વારા fiber માં આગળ જાય, હળવા વળાંકોમાં પણ. Critical angle: sin θc = n2 / n1. Sender પર <b>LED કે laser</b> electrical signals ને પ્રકાશમાં ફેરવે; receiver પર <b>photodiode</b> પ્રકાશને પાછો ફેરવે.</p>\n<h4>Propagation modes</h4>\n<ul>\n<li><b>Multimode step-index:</b> core ની ઘનતા એકસરખી અને cladding પાસે અચાનક બદલાય; ઘણાં કિરણો જુદા માર્ગ લે, તેથી pulses ફેલાય (modal dispersion). ટૂંકાં અંતર.</li>\n<li><b>Multimode graded-index:</b> refractive index કેન્દ્રમાં સૌથી વધુ અને ધાર તરફ ધીમે ધીમે ઘટે; કિરણો વળે, distortion ઘટે.</li>\n<li><b>Single mode:</b> ખૂબ પાતળો core (8-10 µm) અને laser source; પ્રકાશ લગભગ સીધો એક માર્ગે જાય; સૌથી ઓછું distortion, સૌથી વધુ bandwidth અને સૌથી લાંબું અંતર.</li>\n</ul>\n<table><tr><th>મુદ્દો</th><th>Single mode</th><th>Multimode</th></tr><tr><td>Core diameter</td><td>8-10 µm (ખૂબ પાતળો)</td><td>50 અથવા 62.5 µm</td></tr><tr><td>Light source</td><td>Laser</td><td>LED / laser</td></tr><tr><td>પ્રકાશના માર્ગો</td><td>એક</td><td>ઘણા (step / graded index)</td></tr><tr><td>અંતર</td><td>40-100 km સુધી</td><td>લગભગ 2 km સુધી</td></tr><tr><td>Bandwidth</td><td>ખૂબ વધુ</td><td>ઓછી (modal dispersion)</td></tr><tr><td>ખર્ચ</td><td>Cable સસ્તો, equipment મોંઘું</td><td>Equipment સસ્તું</td></tr><tr><td>ઉપયોગ</td><td>Telecom, Internet backbone, MAN / WAN</td><td>LAN, campus, data centre</td></tr></table>\n<h4>Connectors</h4>\n<p><b>SC</b> (subscriber channel, push-pull), <b>ST</b> (straight tip, bayonet), <b>LC</b> (small form factor), <b>MT-RJ</b> (duplex, RJ-45 જેટલું).</p>\n<h4>ઉપયોગો</h4>\n<p>Internet backbone અને દરિયાઈ cables, FTTH broadband (JioFiber, Airtel Xstream), buildings વચ્ચે LAN backbones, cable TV trunks, medical endoscopy, military networks.</p>\n<h4>ફાયદા</h4><ul><li>ખૂબ વધુ bandwidth (Tbps શક્ય) અને data rate.</li><li>ખૂબ ઓછું attenuation: repeaters વગર લાંબું અંતર (100 km સુધી).</li><li>Electromagnetic interference અને વીજળીથી મુક્ત; crosstalk નહીં.</li><li>ખૂબ secure: પકડાયા વગર tap કરવું મુશ્કેલ.</li><li>પાતળું અને હલકું; glass કાટ લાગતો નથી.</li></ul><h4>ગેરફાયદા</h4><ul><li>મોંઘા cable, connectors અને equipment (lasers, optical transceivers).</li><li>Installation અને splicing માટે કુશળતા અને ખાસ સાધનો જોઈએ.</li><li>નાજુક: વધુ વાળવાથી glass તૂટે.</li><li>પ્રકાશ એક દિશામાં જાય: two-way communication માટે બે fibers જોઈએ.</li></ul>"}, "diagram": "cn3_fiber", "examples": ["cn3n4"]}, {"h": {"en": "3.1.6 Fiber Modes and Comparison of Guided Media", "gu": "3.1.6 Fiber Modes અને Guided Media ની સરખામણી"}, "body": {"en": "<p>The three guided media differ in signal type, bandwidth, distance and cost. Fiber is used where very high speed or long distance is needed; twisted pair is used for the last connection to computers; coaxial is now mostly used for cable TV.</p>\n<table><tr><th>Point</th><th>Twisted pair</th><th>Coaxial</th><th>Fiber optic</th></tr><tr><td>Signal</td><td>Electrical</td><td>Electrical</td><td>Light</td></tr><tr><td>Bandwidth</td><td>Low-medium</td><td>Medium-high</td><td>Very high</td></tr><tr><td>Distance without repeater</td><td>100 m</td><td>185-500 m</td><td>2-100 km</td></tr><tr><td>Noise immunity</td><td>Low (UTP)</td><td>Good</td><td>Complete (no EMI)</td></tr><tr><td>Cost</td><td>Lowest</td><td>Medium</td><td>Highest</td></tr><tr><td>Installation</td><td>Easiest</td><td>Moderate</td><td>Difficult, skilled</td></tr><tr><td>Security</td><td>Easy to tap</td><td>Moderate</td><td>Very hard to tap</td></tr><tr><td>Connector</td><td>RJ-45, RJ-11</td><td>BNC, F-type</td><td>SC, ST, LC</td></tr></table>\n<p><b>Propagation speed</b> in copper and fiber is about 2 × 10⁸ m/s (two-thirds of the speed of light), so a signal needs about 5 µs per km.</p>", "gu": "<p>ત્રણ guided media signal ના પ્રકાર, bandwidth, અંતર અને ખર્ચમાં જુદા પડે છે. ખૂબ વધુ speed કે લાંબું અંતર જોઈએ ત્યાં fiber; computers સુધીના છેલ્લા જોડાણ માટે twisted pair; coaxial હવે મોટે ભાગે cable TV માટે વપરાય છે.</p>\n<table><tr><th>મુદ્દો</th><th>Twisted pair</th><th>Coaxial</th><th>Fiber optic</th></tr><tr><td>Signal</td><td>Electrical</td><td>Electrical</td><td>પ્રકાશ</td></tr><tr><td>Bandwidth</td><td>ઓછી-મધ્યમ</td><td>મધ્યમ-વધુ</td><td>ખૂબ વધુ</td></tr><tr><td>Repeater વગર અંતર</td><td>100 m</td><td>185-500 m</td><td>2-100 km</td></tr><tr><td>Noise સામે રક્ષણ</td><td>ઓછું (UTP)</td><td>સારું</td><td>સંપૂર્ણ (EMI નહીં)</td></tr><tr><td>ખર્ચ</td><td>સૌથી ઓછો</td><td>મધ્યમ</td><td>સૌથી વધુ</td></tr><tr><td>Installation</td><td>સૌથી સહેલું</td><td>મધ્યમ</td><td>મુશ્કેલ, કુશળ</td></tr><tr><td>Security</td><td>Tap કરવું સહેલું</td><td>મધ્યમ</td><td>Tap કરવું ખૂબ મુશ્કેલ</td></tr><tr><td>Connector</td><td>RJ-45, RJ-11</td><td>BNC, F-type</td><td>SC, ST, LC</td></tr></table>\n<p>Copper અને fiber માં <b>propagation speed</b> લગભગ 2 × 10⁸ m/s (પ્રકાશની ઝડપનો બે-તૃતીયાંશ) છે, તેથી signal ને km દીઠ લગભગ 5 µs લાગે.</p>"}, "diagram": "cn3_fiber_modes", "examples": ["cn3n5"]}]}, {"title": {"en": "3.2 Unguided Media", "gu": "3.2 Unguided Media"}, "items": [{"h": {"en": "3.2.1 Unguided Media and Propagation Methods", "gu": "3.2.1 Unguided Media અને Propagation Methods"}, "body": {"en": "<p><b>Unguided media</b> (wireless communication) transport electromagnetic waves without using a physical conductor. Signals are broadcast through free space and are available to anyone who has a device capable of receiving them. An <b>antenna</b> converts electrical signals to electromagnetic waves at the sender and back at the receiver.</p>\n<p>Unguided signals can travel from the source to the destination in three ways:</p>\n<ol>\n<li><b>Ground propagation:</b> radio waves travel through the lowest part of the atmosphere, <b>hugging the earth</b>. These low-frequency signals emanate in all directions from the antenna and follow the curvature of the planet. Distance depends on the amount of power: more power, greater distance.</li>\n<li><b>Sky propagation:</b> higher-frequency radio waves radiate upward into the <b>ionosphere</b> (the layer of the atmosphere where particles exist as ions), where they are <b>reflected back to earth</b>. This allows greater distances with lower output power.</li>\n<li><b>Line-of-sight propagation:</b> very high-frequency signals are transmitted in <b>straight lines</b> directly from antenna to antenna. Antennas must be directional, facing each other, and either tall enough or close enough together not to be affected by the curvature of the earth.</li>\n</ol>\n<table><tr><th>Method</th><th>Frequency</th><th>How it travels</th><th>Examples</th></tr><tr><td>Ground</td><td>Below 2 MHz</td><td>Low-frequency waves hug the earth's surface; distance depends on power</td><td>AM radio, navigation, submarine communication</td></tr><tr><td>Sky</td><td>2-30 MHz</td><td>Waves go up and are reflected back by the ionosphere; very long distance with low power</td><td>Short-wave radio, amateur (ham) radio, international broadcast</td></tr><tr><td>Line-of-sight</td><td>Above 30 MHz</td><td>Straight line from antenna to antenna; antennas must face each other, be tall or close</td><td>FM, TV, microwave links, mobile, satellite</td></tr></table>", "gu": "<p><b>Unguided media</b> (wireless communication) physical conductor વાપર્યા વગર electromagnetic waves લઈ જાય છે. Signals મુક્ત અવકાશમાં broadcast થાય અને તે મેળવી શકે તેવું device ધરાવતા કોઈ પણને ઉપલબ્ધ હોય છે. <b>Antenna</b> sender પર electrical signals ને electromagnetic waves માં અને receiver પર પાછા ફેરવે છે.</p>\n<p>Unguided signals source થી destination સુધી ત્રણ રીતે જઈ શકે:</p>\n<ol>\n<li><b>Ground propagation:</b> radio waves વાતાવરણના સૌથી નીચેના ભાગમાં <b>પૃથ્વીને વળગીને</b> જાય છે. આ ઓછી frequency ના signals antenna થી બધી દિશામાં ફેલાય અને પૃથ્વીના વળાંકને અનુસરે. અંતર power પર આધારિત: વધુ power, વધુ અંતર.</li>\n<li><b>Sky propagation:</b> વધુ frequency ના radio waves ઉપર <b>ionosphere</b> (વાતાવરણનું સ્તર જ્યાં કણો ions તરીકે હોય) માં જાય, જ્યાં તે <b>પૃથ્વી પર પાછા પરાવર્તિત</b> થાય. તેથી ઓછા output power સાથે વધુ અંતર મળે.</li>\n<li><b>Line-of-sight propagation:</b> ખૂબ વધુ frequency ના signals antenna થી antenna સુધી <b>સીધી રેખામાં</b> મોકલાય. Antennas directional, સામસામે, અને પૃથ્વીના વળાંકની અસર ન થાય તેટલા ઊંચા કે નજીક હોવા જોઈએ.</li>\n</ol>\n<table><tr><th>પદ્ધતિ</th><th>Frequency</th><th>કેવી રીતે જાય</th><th>ઉદાહરણો</th></tr><tr><td>Ground</td><td>2 MHz થી ઓછી</td><td>ઓછી frequency ના તરંગો પૃથ્વીની સપાટીને અનુસરે; અંતર power પર આધારિત</td><td>AM radio, navigation, submarine communication</td></tr><tr><td>Sky</td><td>2-30 MHz</td><td>તરંગો ઉપર જઈ ionosphere થી પાછા પરાવર્તિત થાય; ઓછા power સાથે ખૂબ લાંબું અંતર</td><td>Short-wave radio, amateur (ham) radio, international broadcast</td></tr><tr><td>Line-of-sight</td><td>30 MHz થી વધુ</td><td>Antenna થી antenna સીધી રેખામાં; antennas સામસામે, ઊંચા કે નજીક હોવા જોઈએ</td><td>FM, TV, microwave links, mobile, satellite</td></tr></table>"}, "diagram": "cn3_prop"}, {"h": {"en": "3.2.2 Electromagnetic Spectrum", "gu": "3.2.2 Electromagnetic Spectrum"}, "body": {"en": "<p>The <b>electromagnetic spectrum</b> is the complete range of electromagnetic waves arranged by frequency (or wavelength): radio waves, microwaves, infrared, visible light, ultraviolet, X-rays and gamma rays. Frequency and wavelength are related by <b>λ = c / f</b>, where c = 3 × 10⁸ m/s.</p>\n<p>The part from <b>3 kHz to 900 THz</b> is used for wireless communication. It is divided into <b>bands</b>, regulated by authorities (ITU internationally, DoT / TRAI in India); most bands need a licence, while the <b>ISM bands</b> (2.4 GHz, 5 GHz) are free for Wi-Fi, Bluetooth and microwave ovens.</p>\n<table><tr><th>Band</th><th>Range</th><th>Propagation</th><th>Application</th></tr><tr><td>VLF / LF</td><td>3-300 kHz</td><td>Ground</td><td>Navigation, AM long-wave</td></tr><tr><td>MF</td><td>300 kHz-3 MHz</td><td>Sky</td><td>AM radio</td></tr><tr><td>HF</td><td>3-30 MHz</td><td>Sky</td><td>Short-wave, ham radio, aircraft</td></tr><tr><td>VHF</td><td>30-300 MHz</td><td>Sky / line-of-sight</td><td>FM radio, VHF TV</td></tr><tr><td>UHF</td><td>300 MHz-3 GHz</td><td>Line-of-sight</td><td>UHF TV, mobile phones, Wi-Fi 2.4 GHz</td></tr><tr><td>SHF</td><td>3-30 GHz</td><td>Line-of-sight</td><td>Satellite, terrestrial microwave, Wi-Fi 5 GHz</td></tr><tr><td>EHF</td><td>30-300 GHz</td><td>Line-of-sight</td><td>Radar, 5G mmWave, satellite</td></tr></table>\n<p>Higher frequency means higher bandwidth (more data) but shorter range, more line-of-sight dependence and more attenuation by rain and walls. Ultraviolet, X-rays and gamma rays are not used for communication because they are harmful and difficult to generate and modulate.</p>", "gu": "<p><b>Electromagnetic spectrum</b> એ frequency (કે wavelength) પ્રમાણે ગોઠવેલા electromagnetic waves ની સંપૂર્ણ range છે: radio waves, microwaves, infrared, visible light, ultraviolet, X-rays અને gamma rays. Frequency અને wavelength <b>λ = c / f</b> થી સંબંધિત છે, જ્યાં c = 3 × 10⁸ m/s.</p>\n<p><b>3 kHz થી 900 THz</b> સુધીનો ભાગ wireless communication માટે વપરાય છે. તે <b>bands</b> માં વહેંચાયેલો છે, જે સત્તાવાળાઓ (આંતરરાષ્ટ્રીય ITU, ભારતમાં DoT / TRAI) નિયંત્રિત કરે; મોટા ભાગના bands ને licence જોઈએ, જ્યારે <b>ISM bands</b> (2.4 GHz, 5 GHz) Wi-Fi, Bluetooth અને microwave ovens માટે મફત છે.</p>\n<table><tr><th>Band</th><th>Range</th><th>Propagation</th><th>ઉપયોગ</th></tr><tr><td>VLF / LF</td><td>3-300 kHz</td><td>Ground</td><td>Navigation, AM long-wave</td></tr><tr><td>MF</td><td>300 kHz-3 MHz</td><td>Sky</td><td>AM radio</td></tr><tr><td>HF</td><td>3-30 MHz</td><td>Sky</td><td>Short-wave, ham radio, aircraft</td></tr><tr><td>VHF</td><td>30-300 MHz</td><td>Sky / line-of-sight</td><td>FM radio, VHF TV</td></tr><tr><td>UHF</td><td>300 MHz-3 GHz</td><td>Line-of-sight</td><td>UHF TV, mobile phones, Wi-Fi 2.4 GHz</td></tr><tr><td>SHF</td><td>3-30 GHz</td><td>Line-of-sight</td><td>Satellite, terrestrial microwave, Wi-Fi 5 GHz</td></tr><tr><td>EHF</td><td>30-300 GHz</td><td>Line-of-sight</td><td>Radar, 5G mmWave, satellite</td></tr></table>\n<p>વધુ frequency એટલે વધુ bandwidth (વધુ data) પણ ઓછી range, line-of-sight પર વધુ આધાર અને વરસાદ અને દીવાલોથી વધુ attenuation. Ultraviolet, X-rays અને gamma rays હાનિકારક અને બનાવવા તથા modulate કરવા મુશ્કેલ હોવાથી communication માટે વપરાતા નથી.</p>"}, "diagram": "cn3_spectrum", "examples": ["cn3n3"]}, {"h": {"en": "3.2.3 Radio Transmission", "gu": "3.2.3 Radio Transmission"}, "body": {"en": "<p><b>Radio waves</b> are electromagnetic waves in the range <b>3 kHz to 1 GHz</b>. They are mostly <b>omnidirectional</b>: an antenna transmits in all directions, so the sending and receiving antennas do not have to be aligned. Radio waves, especially low and medium frequencies, can travel long distances (sky propagation) and <b>penetrate walls</b>.</p>\n<ul><li><b>Antennas:</b> omnidirectional (simple wire / rod antennas).</li><li><b>Problem:</b> waves sent by one antenna can be received by any antenna, so signals using the same frequency interfere; the spectrum must be licensed.</li></ul>\n<h4>Applications</h4>\n<p>Multicasting / broadcasting where there is one sender and many receivers: <b>AM and FM radio</b>, television, cordless phones, paging, walkie-talkies, maritime radio. Wi-Fi and Bluetooth (2.4 GHz) also use radio waves.</p>\n<h4>Advantages</h4><ul><li>Omnidirectional: no need to align antennas; good for broadcasting.</li><li>Penetrates walls; works indoors.</li><li>Travels long distances; mobility for users.</li></ul><h4>Disadvantages</h4><ul><li>Low bandwidth compared to microwave.</li><li>Interference: all users of the same frequency interfere; needs government licence.</li><li>Less secure: anyone in range can receive the signal.</li></ul>", "gu": "<p><b>Radio waves</b> એ <b>3 kHz થી 1 GHz</b> ની range ના electromagnetic waves છે. તે મોટે ભાગે <b>omnidirectional</b> છે: antenna બધી દિશામાં મોકલે, તેથી sending અને receiving antennas ગોઠવવાની જરૂર નથી. Radio waves, ખાસ કરીને ઓછી અને મધ્યમ frequency, લાંબું અંતર (sky propagation) કાપી શકે અને <b>દીવાલોમાંથી પસાર</b> થઈ શકે.</p>\n<ul><li><b>Antennas:</b> omnidirectional (સરળ wire / rod antennas).</li><li><b>સમસ્યા:</b> એક antenna એ મોકલેલા તરંગો કોઈ પણ antenna મેળવી શકે, તેથી સરખી frequency વાપરતા signals દખલ કરે; spectrum licensed હોવું જોઈએ.</li></ul>\n<h4>ઉપયોગો</h4>\n<p>એક sender અને ઘણા receivers હોય ત્યાં multicasting / broadcasting: <b>AM અને FM radio</b>, television, cordless phones, paging, walkie-talkies, maritime radio. Wi-Fi અને Bluetooth (2.4 GHz) પણ radio waves વાપરે.</p>\n<h4>ફાયદા</h4><ul><li>Omnidirectional: antennas ગોઠવવાની જરૂર નહીં; broadcasting માટે સારું.</li><li>દીવાલોમાંથી પસાર થાય; indoor કામ કરે.</li><li>લાંબું અંતર કાપે; users માટે mobility.</li></ul><h4>ગેરફાયદા</h4><ul><li>Microwave ની સરખામણીમાં ઓછી bandwidth.</li><li>Interference: સરખી frequency ના બધા users દખલ કરે; સરકારી licence જોઈએ.</li><li>ઓછું secure: range માં કોઈ પણ signal મેળવી શકે.</li></ul>"}}, {"h": {"en": "3.2.4 Microwave Transmission", "gu": "3.2.4 Microwave Transmission"}, "body": {"en": "<p><b>Microwaves</b> are electromagnetic waves with frequencies between <b>1 and 300 GHz</b>. They are <b>unidirectional</b>: the sending and receiving antennas must be <b>aligned (line of sight)</b>. Microwaves at very high frequencies cannot penetrate walls.</p>\n<h4>Terrestrial microwave</h4>\n<p>Uses <b>parabolic dish antennas</b> (or horn antennas) mounted on tall towers. Because of the earth's curvature, towers are placed about <b>40-50 km apart</b> with <b>repeaters</b> that receive, amplify and retransmit the signal. Higher towers give a longer distance: d ≈ 4.12 (√h1 + √h2) km, with antenna heights h in metres.</p>\n<h4>Applications</h4>\n<p>Unicast (one-to-one) communication: <b>mobile phone networks</b> (backhaul links between towers), long-distance telephone, TV studio-to-transmitter links, wireless LANs and point-to-point links between buildings, <b>satellite</b> communication, radar.</p>\n<h4>Advantages</h4><ul><li>High bandwidth and data rate.</li><li>No cables or right-of-way needed; cheaper than laying cable over long distances.</li><li>Easy to install towers; quick setup over rivers, hills.</li></ul><h4>Disadvantages</h4><ul><li>Line of sight required: towers must be tall and aligned; repeaters every ~50 km.</li><li>Affected by rain, fog and storms (attenuation at high frequency).</li><li>Cannot pass through walls or buildings; licence needed.</li></ul>", "gu": "<p><b>Microwaves</b> એ <b>1 થી 300 GHz</b> frequency વાળા electromagnetic waves છે. તે <b>unidirectional</b> છે: sending અને receiving antennas <b>ગોઠવાયેલા (line of sight)</b> હોવા જોઈએ. ખૂબ વધુ frequency ના microwaves દીવાલોમાંથી પસાર ન થઈ શકે.</p>\n<h4>Terrestrial microwave</h4>\n<p>ઊંચા towers પર લગાવેલા <b>parabolic dish antennas</b> (કે horn antennas) વાપરે. પૃથ્વીના વળાંકને કારણે towers લગભગ <b>40-50 km ના અંતરે</b> મુકાય, signal મેળવી, amplify કરી ફરી મોકલતા <b>repeaters</b> સાથે. વધુ ઊંચા towers વધુ અંતર આપે: d ≈ 4.12 (√h1 + √h2) km, antenna ની ઊંચાઈ h metres માં.</p>\n<h4>ઉપયોગો</h4>\n<p>Unicast (એક-થી-એક) communication: <b>mobile phone networks</b> (towers વચ્ચે backhaul links), લાંબા અંતરના telephone, TV studio-to-transmitter links, wireless LANs અને buildings વચ્ચે point-to-point links, <b>satellite</b> communication, radar.</p>\n<h4>ફાયદા</h4><ul><li>વધુ bandwidth અને data rate.</li><li>Cables કે right-of-way ની જરૂર નહીં; લાંબા અંતરે cable નાખવા કરતાં સસ્તું.</li><li>Towers install કરવા સહેલા; નદી, ટેકરીઓ પર ઝડપી setup.</li></ul><h4>ગેરફાયદા</h4><ul><li>Line of sight જરૂરી: towers ઊંચા અને ગોઠવાયેલા; દર ~50 km એ repeaters.</li><li>વરસાદ, ધુમ્મસ અને તોફાનની અસર (વધુ frequency પર attenuation).</li><li>દીવાલો કે buildings માંથી પસાર ન થાય; licence જોઈએ.</li></ul>"}, "diagram": "cn3_microwave", "examples": ["cn3n2"]}, {"h": {"en": "3.2.5 Infrared Transmission", "gu": "3.2.5 Infrared Transmission"}, "body": {"en": "<p><b>Infrared waves</b> have frequencies from <b>300 GHz to 400 THz</b> (wavelengths from 1 mm to 770 nm). They are used for <b>short-range</b> communication in a closed area using <b>line-of-sight</b> propagation. An infrared <b>LED</b> sends the signal and a <b>photodiode</b> receives it.</p>\n<ul><li>Infrared waves <b>cannot penetrate walls</b>; this prevents interference between one system and another (a remote in one room does not affect a TV in the next room).</li><li>They cannot be used outside a building because the sun's rays contain infrared waves that interfere.</li><li>The <b>IrDA</b> (Infrared Data Association) standard defines data rates of 115 kbps to 4 Mbps.</li></ul>\n<h4>Applications</h4>\n<p>TV / AC <b>remote controls</b>, wireless keyboards and mice (older), IrDA data transfer between laptops / phones, infrared sensors, night-vision cameras, short-range indoor communication.</p>\n<h4>Advantages</h4><ul><li>Cannot pass walls, so no interference between rooms and better security.</li><li>No licence needed; cheap LEDs and sensors.</li><li>Low power; simple devices.</li></ul><h4>Disadvantages</h4><ul><li>Very short range (a few metres) and line of sight needed.</li><li>Cannot be used outdoors in sunlight (sun's infrared interferes).</li><li>Low data rate; obstacles block the signal.</li></ul>\n<h4>Comparison of unguided media</h4>\n<table><tr><th>Point</th><th>Radio</th><th>Microwave</th><th>Infrared</th></tr><tr><td>Frequency</td><td>3 kHz-1 GHz</td><td>1-300 GHz</td><td>300 GHz-400 THz</td></tr><tr><td>Direction</td><td>Omnidirectional</td><td>Unidirectional</td><td>Line of sight, short</td></tr><tr><td>Walls</td><td>Penetrates</td><td>Blocked (high GHz)</td><td>Cannot pass</td></tr><tr><td>Distance</td><td>Long</td><td>~50 km per hop</td><td>A few metres</td></tr><tr><td>Antenna</td><td>Simple (omni)</td><td>Dish / horn</td><td>LED + photodiode</td></tr><tr><td>Example</td><td>FM, AM, Wi-Fi</td><td>Towers, satellite</td><td>TV remote</td></tr></table>", "gu": "<p><b>Infrared waves</b> ની frequency <b>300 GHz થી 400 THz</b> (wavelength 1 mm થી 770 nm) છે. તે <b>line-of-sight</b> propagation વાપરીને બંધ વિસ્તારમાં <b>ટૂંકા અંતરના</b> communication માટે વપરાય છે. Infrared <b>LED</b> signal મોકલે અને <b>photodiode</b> તે મેળવે.</p>\n<ul><li>Infrared waves <b>દીવાલોમાંથી પસાર થઈ શકતા નથી</b>; તે એક system અને બીજી વચ્ચે interference અટકાવે (એક રૂમનું remote બાજુના રૂમના TV ને અસર ન કરે).</li><li>Building ની બહાર વાપરી શકાતા નથી કારણ કે સૂર્યના કિરણોમાં infrared waves હોય છે જે દખલ કરે.</li><li><b>IrDA</b> (Infrared Data Association) standard 115 kbps થી 4 Mbps ના data rates નક્કી કરે.</li></ul>\n<h4>ઉપયોગો</h4>\n<p>TV / AC <b>remote controls</b>, wireless keyboards અને mice (જૂના), laptops / phones વચ્ચે IrDA data transfer, infrared sensors, night-vision cameras, ટૂંકા અંતરનું indoor communication.</p>\n<h4>ફાયદા</h4><ul><li>દીવાલોમાંથી પસાર ન થાય, તેથી રૂમો વચ્ચે interference નહીં અને વધુ security.</li><li>Licence ની જરૂર નહીં; સસ્તા LEDs અને sensors.</li><li>ઓછો power; સરળ devices.</li></ul><h4>ગેરફાયદા</h4><ul><li>ખૂબ ટૂંકી range (થોડા metres) અને line of sight જરૂરી.</li><li>સૂર્યપ્રકાશમાં બહાર ન વાપરી શકાય (સૂર્યનો infrared દખલ કરે).</li><li>ઓછો data rate; અવરોધો signal અટકાવે.</li></ul>\n<h4>Unguided media ની સરખામણી</h4>\n<table><tr><th>મુદ્દો</th><th>Radio</th><th>Microwave</th><th>Infrared</th></tr><tr><td>Frequency</td><td>3 kHz-1 GHz</td><td>1-300 GHz</td><td>300 GHz-400 THz</td></tr><tr><td>દિશા</td><td>Omnidirectional</td><td>Unidirectional</td><td>Line of sight, ટૂંકું</td></tr><tr><td>દીવાલો</td><td>પસાર થાય</td><td>અટકે (વધુ GHz)</td><td>પસાર ન થાય</td></tr><tr><td>અંતર</td><td>લાંબું</td><td>Hop દીઠ ~50 km</td><td>થોડા metres</td></tr><tr><td>Antenna</td><td>સરળ (omni)</td><td>Dish / horn</td><td>LED + photodiode</td></tr><tr><td>ઉદાહરણ</td><td>FM, AM, Wi-Fi</td><td>Towers, satellite</td><td>TV remote</td></tr></table>"}}, {"h": {"en": "3.2.6 Satellite Transmission", "gu": "3.2.6 Satellite Transmission"}, "body": {"en": "<p>A <b>communication satellite</b> is a microwave relay station placed in space. An earth station sends a signal to the satellite on the <b>uplink</b> frequency; the satellite's <b>transponder</b> receives it, amplifies it, changes the frequency, and broadcasts it back on the <b>downlink</b> frequency to earth stations over a large area (the <b>footprint</b>). Different up / down frequencies prevent interference (e.g. C band: 6 GHz up / 4 GHz down; Ku band: 14 / 12 GHz).</p>\n<p>It works like line-of-sight microwave with a very tall \"tower\", overcoming the earth's curvature.</p>\n<h4>Types of orbit</h4>\n<table><tr><th>Orbit</th><th>Height</th><th>Satellites needed</th><th>Example</th></tr><tr><td>GEO (geostationary)</td><td>35,786 km</td><td>3 cover the earth</td><td>DTH TV, VSAT, weather (INSAT, GSAT)</td></tr><tr><td>MEO (medium earth)</td><td>5,000-15,000 km</td><td>24-30</td><td>GPS, NavIC navigation</td></tr><tr><td>LEO (low earth)</td><td>500-2,000 km</td><td>Hundreds / thousands</td><td>Starlink, OneWeb Internet, Iridium phones</td></tr></table>\n<p>A <b>geostationary</b> satellite revolves at the same speed as the earth's rotation (24 hours), so it appears fixed in the sky and ground antennas do not need to track it. Three GEO satellites 120° apart can cover the whole earth except the poles.</p>\n<h4>Applications</h4>\n<p>DTH television (Tata Play, DD Free Dish), VSAT networks for banks and ATMs, GPS / NavIC navigation, weather forecasting, Internet in remote areas (Starlink), ship and aircraft communication, disaster management.</p>\n<h4>Advantages</h4><ul><li>Covers a very large area (one GEO satellite covers about one-third of the earth).</li><li>Reaches remote, hilly areas, ships and aircraft where cables are not possible.</li><li>Broadcast: one signal to millions of receivers (DTH TV); cost does not depend on distance.</li></ul><h4>Disadvantages</h4><ul><li>Very high launch and maintenance cost.</li><li>Long propagation delay (about 0.24 s one way for GEO) is noticeable in voice calls.</li><li>Affected by heavy rain; limited lifetime (10-15 years); security issues as anyone can receive.</li></ul>", "gu": "<p><b>Communication satellite</b> એ અવકાશમાં મુકાયેલું microwave relay station છે. Earth station satellite ને <b>uplink</b> frequency પર signal મોકલે; satellite નું <b>transponder</b> તે મેળવી, amplify કરી, frequency બદલી, મોટા વિસ્તાર (<b>footprint</b>) ના earth stations ને <b>downlink</b> frequency પર પાછું broadcast કરે. જુદી up / down frequencies interference અટકાવે (દા.ત. C band: 6 GHz up / 4 GHz down; Ku band: 14 / 12 GHz).</p>\n<p>તે ખૂબ ઊંચા \"tower\" વાળા line-of-sight microwave જેવું કામ કરે, પૃથ્વીના વળાંકની મર્યાદા દૂર કરે.</p>\n<h4>Orbit ના પ્રકારો</h4>\n<table><tr><th>Orbit</th><th>ઊંચાઈ</th><th>જરૂરી satellites</th><th>ઉદાહરણ</th></tr><tr><td>GEO (geostationary)</td><td>35,786 km</td><td>3 પૃથ્વીને આવરે</td><td>DTH TV, VSAT, weather (INSAT, GSAT)</td></tr><tr><td>MEO (medium earth)</td><td>5,000-15,000 km</td><td>24-30</td><td>GPS, NavIC navigation</td></tr><tr><td>LEO (low earth)</td><td>500-2,000 km</td><td>સેંકડો / હજારો</td><td>Starlink, OneWeb Internet, Iridium phones</td></tr></table>\n<p><b>Geostationary</b> satellite પૃથ્વીના પરિભ્રમણ જેટલી જ ઝડપે (24 કલાક) ફરે, તેથી આકાશમાં સ્થિર દેખાય અને જમીન પરના antennas ને તેનો પીછો કરવો પડતો નથી. 120° ના અંતરે ત્રણ GEO satellites ધ્રુવો સિવાય આખી પૃથ્વી આવરી શકે.</p>\n<h4>ઉપયોગો</h4>\n<p>DTH television (Tata Play, DD Free Dish), banks અને ATMs માટે VSAT networks, GPS / NavIC navigation, હવામાન આગાહી, દૂરના વિસ્તારોમાં Internet (Starlink), જહાજ અને વિમાન communication, આપત્તિ વ્યવસ્થાપન.</p>\n<h4>ફાયદા</h4><ul><li>ખૂબ મોટો વિસ્તાર આવરે (એક GEO satellite પૃથ્વીનો લગભગ ત્રીજો ભાગ આવરે).</li><li>જ્યાં cables શક્ય નથી તેવા દૂરના, પહાડી વિસ્તારો, જહાજો અને વિમાનો સુધી પહોંચે.</li><li>Broadcast: એક signal લાખો receivers ને (DTH TV); ખર્ચ અંતર પર આધારિત નથી.</li></ul><h4>ગેરફાયદા</h4><ul><li>ખૂબ વધુ launch અને maintenance ખર્ચ.</li><li>લાંબો propagation delay (GEO માટે એક તરફ લગભગ 0.24 s) voice calls માં જણાય.</li><li>ભારે વરસાદની અસર; મર્યાદિત આયુષ્ય (10-15 વર્ષ); કોઈ પણ મેળવી શકે તેથી security સમસ્યા.</li></ul>"}, "diagram": "cn3_satellite", "examples": ["cn3n1"]}]}, {"title": {"en": "3.3 Network Devices", "gu": "3.3 Network Devices"}, "items": [{"h": {"en": "3.3.1 Repeater", "gu": "3.3.1 Repeater"}, "body": {"en": "<p>A <b>repeater</b> is a <b>physical layer</b> device that receives a signal, and before it becomes too weak or corrupted, <b>regenerates</b> the original bit pattern and sends the refreshed copy onward. It extends the physical length of a LAN (e.g. a UTP segment is limited to 100 m).</p>\n<ul>\n<li>A repeater <b>regenerates</b>, it does not simply amplify: an amplifier boosts noise along with the signal, while a repeater recreates a clean signal.</li>\n<li>It has <b>no filtering</b> capability and does not understand addresses; it forwards every bit.</li>\n<li>It connects two segments of the <b>same</b> network; both segments form one collision domain.</li>\n<li>Placement matters: it must be placed before the signal becomes so weak that bits cannot be recognised.</li>\n</ul>\n<p><b>Examples:</b> Ethernet repeaters, Wi-Fi range extenders, optical repeaters in long fiber links, microwave relay towers.</p>", "gu": "<p><b>Repeater</b> એ <b>physical layer</b> device છે જે signal મેળવે, અને તે ખૂબ નબળું કે બગડેલું થાય તે પહેલાં મૂળ bit pattern <b>ફરી બનાવે (regenerate)</b> અને તાજી copy આગળ મોકલે. તે LAN ની physical લંબાઈ વધારે (દા.ત. UTP segment 100 m સુધી મર્યાદિત).</p>\n<ul>\n<li>Repeater <b>regenerate</b> કરે, ફક્ત amplify નહીં: amplifier signal સાથે noise પણ વધારે, જ્યારે repeater સ્વચ્છ signal ફરી બનાવે.</li>\n<li>તેમાં <b>filtering</b> ક્ષમતા નથી અને addresses સમજતું નથી; દરેક bit forward કરે.</li>\n<li>તે <b>એક જ</b> network ના બે segments જોડે; બંને segments એક collision domain બને.</li>\n<li>સ્થાન મહત્વનું: bits ઓળખી ન શકાય તેટલું signal નબળું થાય તે પહેલાં મૂકવું જોઈએ.</li>\n</ul>\n<p><b>ઉદાહરણો:</b> Ethernet repeaters, Wi-Fi range extenders, લાંબા fiber links માં optical repeaters, microwave relay towers.</p>"}, "diagram": "cn3_repeater"}, {"h": {"en": "3.3.2 Hub (Active and Passive)", "gu": "3.3.2 Hub (Active અને Passive)"}, "body": {"en": "<p>A <b>hub</b> is a central connecting device in a <b>star topology</b> LAN. It works at the <b>physical layer</b>. When a signal arrives at one port, the hub sends it out on <b>all other ports</b> (broadcast), so every connected computer receives it and only the addressed one accepts it.</p>\n<h4>Types of hub</h4>\n<ul>\n<li><b>Passive hub:</b> just a connector; it joins wires from different branches without regenerating the signal. It needs no power. Part of the media.</li>\n<li><b>Active hub:</b> a <b>multiport repeater</b>; it regenerates and amplifies signals before broadcasting. It needs electric power and can extend the distance.</li>\n<li><b>Intelligent (smart) hub:</b> an active hub with management features like monitoring traffic and configuring ports.</li>\n</ul>\n<h4>Limitations</h4>\n<p>All ports share one <b>collision domain</b> and the bandwidth; more computers means more collisions and lower speed. Broadcasting every frame also gives poor security. Hubs have been replaced by switches.</p>", "gu": "<p><b>Hub</b> એ <b>star topology</b> LAN માં મધ્યસ્થ જોડાણ device છે. તે <b>physical layer</b> પર કામ કરે. જ્યારે એક port પર signal આવે, hub તેને <b>બાકીના બધા ports</b> પર મોકલે (broadcast), તેથી દરેક જોડાયેલું computer તે મેળવે અને ફક્ત જેને address કર્યું હોય તે સ્વીકારે.</p>\n<h4>Hub ના પ્રકારો</h4>\n<ul>\n<li><b>Passive hub:</b> ફક્ત connector; signal regenerate કર્યા વગર જુદી શાખાઓના વાયર જોડે. Power ની જરૂર નહીં. Media નો ભાગ.</li>\n<li><b>Active hub:</b> <b>multiport repeater</b>; broadcast કરતાં પહેલાં signals regenerate અને amplify કરે. Electric power જોઈએ અને અંતર વધારી શકે.</li>\n<li><b>Intelligent (smart) hub:</b> traffic monitoring અને ports configure કરવા જેવા management features વાળું active hub.</li>\n</ul>\n<h4>મર્યાદાઓ</h4>\n<p>બધા ports એક <b>collision domain</b> અને bandwidth વહેંચે; વધુ computers એટલે વધુ collisions અને ઓછી ઝડપ. દરેક frame broadcast કરવાથી security પણ નબળી. Hubs ની જગ્યા switches એ લીધી છે.</p>"}, "diagram": "cn3_hub_switch"}, {"h": {"en": "3.3.3 Switch", "gu": "3.3.3 Switch"}, "body": {"en": "<p>A <b>switch</b> is a <b>data link layer</b> (layer 2) device that connects multiple devices in a LAN. It is a <b>multiport bridge</b>. A switch reads the <b>destination MAC address</b> of each frame and forwards the frame <b>only to the port</b> where that device is connected.</p>\n<h4>Working</h4>\n<ol>\n<li><b>Learning:</b> when a frame arrives, the switch records the source MAC address and the incoming port in its <b>MAC address table</b> (CAM table).</li>\n<li><b>Forwarding:</b> if the destination MAC is in the table, the frame goes out only on that port.</li>\n<li><b>Flooding:</b> if the destination is unknown (or a broadcast), the frame is sent out on all ports except the incoming one.</li>\n<li><b>Filtering:</b> if the destination is on the same port as the source, the frame is dropped.</li>\n</ol>\n<p>Each port is a separate <b>collision domain</b> and works in <b>full duplex</b>, giving every device dedicated bandwidth. Switching methods: <b>store-and-forward</b> (checks the whole frame for errors), <b>cut-through</b> (forwards after reading the destination address, faster), <b>fragment-free</b>.</p>\n<h4>Hub vs switch</h4>\n<table><tr><th>Hub</th><th>Switch</th></tr><tr><td>Physical layer (layer 1) device</td><td>Data link layer (layer 2) device</td></tr><tr><td>Works with electrical signals / bits</td><td>Works with frames and MAC addresses</td></tr><tr><td>Broadcasts data to all ports</td><td>Sends data only to the destination port (unicast)</td></tr><tr><td>One collision domain for all ports</td><td>Each port is a separate collision domain</td></tr><tr><td>Half duplex; bandwidth shared</td><td>Full duplex; dedicated bandwidth per port</td></tr><tr><td>No memory / table</td><td>Stores a MAC address table (CAM table)</td></tr><tr><td>Less secure, cheap, now obsolete</td><td>More secure, faster, used in all LANs</td></tr></table>", "gu": "<p><b>Switch</b> એ <b>data link layer</b> (layer 2) device છે જે LAN માં અનેક devices જોડે. તે <b>multiport bridge</b> છે. Switch દરેક frame નું <b>destination MAC address</b> વાંચે અને frame <b>ફક્ત તે port</b> પર forward કરે જ્યાં તે device જોડાયેલું છે.</p>\n<h4>કાર્યપદ્ધતિ</h4>\n<ol>\n<li><b>Learning:</b> frame આવે ત્યારે switch source MAC address અને incoming port તેના <b>MAC address table</b> (CAM table) માં નોંધે.</li>\n<li><b>Forwarding:</b> જો destination MAC table માં હોય, તો frame ફક્ત તે port પર જાય.</li>\n<li><b>Flooding:</b> જો destination અજાણ્યું (કે broadcast) હોય, તો frame incoming સિવાયના બધા ports પર મોકલાય.</li>\n<li><b>Filtering:</b> જો destination અને source એક જ port પર હોય, તો frame drop થાય.</li>\n</ol>\n<p>દરેક port અલગ <b>collision domain</b> છે અને <b>full duplex</b> માં કામ કરે, જેથી દરેક device ને dedicated bandwidth મળે. Switching પદ્ધતિઓ: <b>store-and-forward</b> (આખી frame ની errors તપાસે), <b>cut-through</b> (destination address વાંચીને forward કરે, ઝડપી), <b>fragment-free</b>.</p>\n<h4>Hub vs switch</h4>\n<table><tr><th>Hub</th><th>Switch</th></tr><tr><td>Physical layer (layer 1) device</td><td>Data link layer (layer 2) device</td></tr><tr><td>Electrical signals / bits સાથે કામ કરે</td><td>Frames અને MAC addresses સાથે કામ કરે</td></tr><tr><td>Data બધા ports પર broadcast કરે</td><td>Data ફક્ત destination port પર મોકલે (unicast)</td></tr><tr><td>બધા ports માટે એક collision domain</td><td>દરેક port અલગ collision domain</td></tr><tr><td>Half duplex; bandwidth વહેંચાય</td><td>Full duplex; port દીઠ dedicated bandwidth</td></tr><tr><td>Memory / table નહીં</td><td>MAC address table (CAM table) રાખે</td></tr><tr><td>ઓછું secure, સસ્તું, હવે જૂનું</td><td>વધુ secure, ઝડપી, બધા LANs માં વપરાય</td></tr></table>"}}, {"h": {"en": "3.3.4 Bridge", "gu": "3.3.4 Bridge"}, "body": {"en": "<p>A <b>bridge</b> operates in both the physical and the <b>data link layer</b>. It connects <b>two LAN segments</b> and can <b>filter</b> traffic: it checks the destination MAC address of a frame and decides whether to forward it or drop it.</p>\n<ul>\n<li>A bridge keeps a <b>bridge (forwarding) table</b> that maps MAC addresses to ports.</li>\n<li>If the source and destination are on the same segment, the frame is <b>filtered</b> (not forwarded), which reduces traffic on the other segment.</li>\n<li>It divides a LAN into separate <b>collision domains</b> but keeps one broadcast domain.</li>\n<li>A bridge does not change the frame's physical (MAC) addresses.</li>\n</ul>\n<h4>Types</h4>\n<ul>\n<li><b>Transparent bridge:</b> stations are unaware of the bridge; it builds its table automatically by learning. Uses the Spanning Tree Protocol to prevent loops.</li>\n<li><b>Source routing bridge:</b> the sending station decides the path and puts it in the frame (used in Token Ring).</li>\n<li><b>Translational bridge:</b> connects LANs of different types (e.g. Ethernet and Token Ring).</li>\n</ul>", "gu": "<p><b>Bridge</b> physical અને <b>data link layer</b> બંનેમાં કામ કરે. તે <b>બે LAN segments</b> જોડે અને traffic <b>filter</b> કરી શકે: frame નું destination MAC address તપાસી forward કરવું કે drop કરવું તે નક્કી કરે.</p>\n<ul>\n<li>Bridge MAC addresses ને ports સાથે જોડતું <b>bridge (forwarding) table</b> રાખે.</li>\n<li>જો source અને destination એક જ segment પર હોય, તો frame <b>filter</b> થાય (forward નહીં), જે બીજા segment પરનો traffic ઘટાડે.</li>\n<li>તે LAN ને અલગ <b>collision domains</b> માં વહેંચે પણ એક broadcast domain રાખે.</li>\n<li>Bridge frame ના physical (MAC) addresses બદલતું નથી.</li>\n</ul>\n<h4>પ્રકારો</h4>\n<ul>\n<li><b>Transparent bridge:</b> stations ને bridge ની જાણ નથી; learning દ્વારા આપમેળે table બનાવે. Loops અટકાવવા Spanning Tree Protocol વાપરે.</li>\n<li><b>Source routing bridge:</b> મોકલનાર station path નક્કી કરી frame માં મૂકે (Token Ring માં વપરાય).</li>\n<li><b>Translational bridge:</b> જુદા પ્રકારના LANs જોડે (દા.ત. Ethernet અને Token Ring).</li>\n</ul>"}, "diagram": "cn3_bridge"}, {"h": {"en": "3.3.5 Router", "gu": "3.3.5 Router"}, "body": {"en": "<p>A <b>router</b> is a <b>network layer</b> (layer 3) device that connects <b>two or more different networks</b> (e.g. a LAN to another LAN, or a LAN to the Internet). It forwards packets based on the <b>destination IP address</b> using a <b>routing table</b>.</p>\n<h4>Working</h4>\n<ol>\n<li>A packet arrives at an interface; the router reads the destination IP address.</li>\n<li>It looks up the routing table to find the best matching network and the outgoing interface / next hop.</li>\n<li>It changes the frame's MAC addresses for the next link and forwards the packet. If no route matches, the default route is used or the packet is dropped.</li>\n</ol>\n<ul>\n<li>The routing table can be <b>static</b> (configured manually) or <b>dynamic</b> (learned through routing protocols such as RIP, OSPF, BGP).</li>\n<li>Each router interface has its own IP address and is a separate <b>broadcast domain</b>.</li>\n<li>Home Wi-Fi routers combine a router, switch, access point, DHCP server, NAT and firewall in one box.</li>\n</ul>\n<h4>Advantages</h4><ul><li>Connects different networks and the Internet; chooses the best path.</li><li>Separates broadcast domains, reducing traffic.</li><li>Provides security features: NAT, firewall, access lists.</li></ul><h4>Disadvantages</h4><ul><li>Costlier than switches and hubs.</li><li>Slower: must examine IP headers and look up the routing table.</li><li>Needs configuration by a skilled administrator.</li></ul>\n<h4>Switch vs router</h4>\n<table><tr><th>Switch</th><th>Router</th></tr><tr><td>Layer 2 (data link)</td><td>Layer 3 (network)</td></tr><tr><td>Uses MAC address</td><td>Uses IP address</td></tr><tr><td>Connects devices within one LAN</td><td>Connects different networks (LAN to LAN / WAN / Internet)</td></tr><tr><td>MAC address table</td><td>Routing table</td></tr><tr><td>One broadcast domain</td><td>Each interface is a separate broadcast domain</td></tr><tr><td>Cannot do NAT or choose paths</td><td>Performs NAT, best path selection, firewall / DHCP</td></tr></table>", "gu": "<p><b>Router</b> એ <b>network layer</b> (layer 3) device છે જે <b>બે કે વધુ જુદા networks</b> જોડે (દા.ત. LAN ને બીજા LAN સાથે, કે LAN ને Internet સાથે). તે <b>routing table</b> વાપરી <b>destination IP address</b> ના આધારે packets forward કરે.</p>\n<h4>કાર્યપદ્ધતિ</h4>\n<ol>\n<li>Packet interface પર આવે; router destination IP address વાંચે.</li>\n<li>Best matching network અને outgoing interface / next hop શોધવા routing table જુએ.</li>\n<li>આગળની link માટે frame ના MAC addresses બદલી packet forward કરે. જો કોઈ route ન મળે, તો default route વપરાય કે packet drop થાય.</li>\n</ol>\n<ul>\n<li>Routing table <b>static</b> (હાથથી configure) કે <b>dynamic</b> (RIP, OSPF, BGP જેવા routing protocols દ્વારા શીખેલું) હોઈ શકે.</li>\n<li>દરેક router interface નું પોતાનું IP address છે અને તે અલગ <b>broadcast domain</b> છે.</li>\n<li>ઘરના Wi-Fi routers એક box માં router, switch, access point, DHCP server, NAT અને firewall ભેગા કરે.</li>\n</ul>\n<h4>ફાયદા</h4><ul><li>જુદા networks અને Internet જોડે; best path પસંદ કરે.</li><li>Broadcast domains અલગ કરે, traffic ઘટાડે.</li><li>Security features આપે: NAT, firewall, access lists.</li></ul><h4>ગેરફાયદા</h4><ul><li>Switches અને hubs કરતાં મોંઘું.</li><li>ધીમું: IP headers તપાસી routing table જોવું પડે.</li><li>કુશળ administrator દ્વારા configuration જોઈએ.</li></ul>\n<h4>Switch vs router</h4>\n<table><tr><th>Switch</th><th>Router</th></tr><tr><td>Layer 2 (data link)</td><td>Layer 3 (network)</td></tr><tr><td>MAC address વાપરે</td><td>IP address વાપરે</td></tr><tr><td>એક LAN ની અંદર devices જોડે</td><td>જુદા networks જોડે (LAN થી LAN / WAN / Internet)</td></tr><tr><td>MAC address table</td><td>Routing table</td></tr><tr><td>એક broadcast domain</td><td>દરેક interface અલગ broadcast domain</td></tr><tr><td>NAT કે paths પસંદ ન કરી શકે</td><td>NAT, best path selection, firewall / DHCP કરે</td></tr></table>"}, "diagram": "cn3_router"}, {"h": {"en": "3.3.6 Gateway", "gu": "3.3.6 Gateway"}, "body": {"en": "<p>A <b>gateway</b> is a device (or software on a computer) that connects <b>two networks that use different protocols</b>. It can work at <b>all seven layers</b> of the OSI model, though it usually operates at the upper layers (transport to application). A gateway is also called a <b>protocol converter</b>.</p>\n<ul>\n<li>It receives a message in one format, <b>translates</b> it into the format understood by the other network, and forwards it.</li>\n<li>It can also provide security (filtering) and act as the entry / exit point of a network.</li>\n<li>In TCP/IP terminology, the router that connects a LAN to outside networks is called the <b>default gateway</b>; a PC sends all packets for other networks to it.</li>\n</ul>\n<h4>Examples</h4>\n<ul>\n<li><b>Email gateway:</b> converts between different mail systems.</li>\n<li><b>VoIP gateway:</b> connects the IP phone network to the traditional telephone network.</li>\n<li><b>IoT gateway:</b> converts Zigbee / Bluetooth sensor data to IP for the cloud.</li>\n<li><b>Payment gateway</b>, <b>cloud storage gateway</b>, and the <b>print server</b> that lets network users share a printer.</li>\n</ul>\n<p><b>Router vs gateway:</b> a router connects networks using the <b>same</b> protocol (IP) and selects paths; a gateway connects networks using <b>different</b> protocols and converts between them.</p>", "gu": "<p><b>Gateway</b> એ device (કે computer પરનું software) છે જે <b>જુદા protocols વાપરતા બે networks</b> જોડે. તે OSI model ના <b>બધા સાત layers</b> પર કામ કરી શકે, જોકે સામાન્ય રીતે ઉપરના layers (transport થી application) પર કામ કરે. Gateway ને <b>protocol converter</b> પણ કહે છે.</p>\n<ul>\n<li>તે એક format માં message મેળવે, બીજું network સમજે તે format માં <b>અનુવાદ</b> કરે અને forward કરે.</li>\n<li>તે security (filtering) પણ આપી શકે અને network ના પ્રવેશ / નિકાસ બિંદુ તરીકે કામ કરે.</li>\n<li>TCP/IP પરિભાષામાં, LAN ને બહારના networks સાથે જોડતા router ને <b>default gateway</b> કહે છે; PC બીજા networks માટેના બધા packets તેને મોકલે.</li>\n</ul>\n<h4>ઉદાહરણો</h4>\n<ul>\n<li><b>Email gateway:</b> જુદી mail systems વચ્ચે રૂપાંતર કરે.</li>\n<li><b>VoIP gateway:</b> IP phone network ને પરંપરાગત telephone network સાથે જોડે.</li>\n<li><b>IoT gateway:</b> Zigbee / Bluetooth sensor data ને cloud માટે IP માં ફેરવે.</li>\n<li><b>Payment gateway</b>, <b>cloud storage gateway</b>, અને network users ને printer વહેંચવા દેતું <b>print server</b>.</li>\n</ul>\n<p><b>Router vs gateway:</b> router <b>સરખા</b> protocol (IP) વાપરતા networks જોડે અને paths પસંદ કરે; gateway <b>જુદા</b> protocols વાપરતા networks જોડે અને તેમની વચ્ચે રૂપાંતર કરે.</p>"}}, {"h": {"en": "3.3.7 Wireless Access Point", "gu": "3.3.7 Wireless Access Point"}, "body": {"en": "<p>A <b>wireless access point (AP / WAP)</b> is a <b>data link layer</b> device that allows wireless devices (laptops, phones, tablets) to connect to a <b>wired LAN</b> using Wi-Fi (<b>IEEE 802.11</b>). It is connected to a switch or router by a UTP cable and acts as a bridge between wireless and wired networks.</p>\n<ul>\n<li>It broadcasts a network name called the <b>SSID</b> (Service Set Identifier).</li>\n<li>It uses the 2.4 GHz and 5 GHz bands (6 GHz for Wi-Fi 6E / 7); the typical indoor range is about 30-50 m.</li>\n<li>It provides security through <b>WPA2 / WPA3</b> encryption and password authentication.</li>\n<li>Several APs with the same SSID give coverage across a building or campus; users can roam between them.</li>\n<li>Many APs are powered over the Ethernet cable (<b>PoE</b>).</li>\n</ul>\n<p><b>Modes:</b> root (normal AP), repeater / range extender, bridge (point-to-point link between buildings), client.</p>\n<p><b>AP vs Wi-Fi router:</b> an AP only gives wireless access to an existing network, while a Wi-Fi router also performs routing, NAT and DHCP for Internet sharing.</p>", "gu": "<p><b>Wireless access point (AP / WAP)</b> એ <b>data link layer</b> device છે જે wireless devices (laptops, phones, tablets) ને Wi-Fi (<b>IEEE 802.11</b>) વાપરીને <b>wired LAN</b> સાથે જોડાવા દે. તે UTP cable થી switch કે router સાથે જોડાય અને wireless અને wired networks વચ્ચે bridge તરીકે કામ કરે.</p>\n<ul>\n<li>તે <b>SSID</b> (Service Set Identifier) નામનું network નામ broadcast કરે.</li>\n<li>તે 2.4 GHz અને 5 GHz bands (Wi-Fi 6E / 7 માટે 6 GHz) વાપરે; સામાન્ય indoor range લગભગ 30-50 m.</li>\n<li>તે <b>WPA2 / WPA3</b> encryption અને password authentication દ્વારા security આપે.</li>\n<li>સરખા SSID વાળા અનેક APs building કે campus માં coverage આપે; users તેમની વચ્ચે roam કરી શકે.</li>\n<li>ઘણા APs ને Ethernet cable દ્વારા power મળે (<b>PoE</b>).</li>\n</ul>\n<p><b>Modes:</b> root (સામાન્ય AP), repeater / range extender, bridge (buildings વચ્ચે point-to-point link), client.</p>\n<p><b>AP vs Wi-Fi router:</b> AP ફક્ત હાલના network ને wireless access આપે, જ્યારે Wi-Fi router Internet sharing માટે routing, NAT અને DHCP પણ કરે.</p>"}, "diagram": "cn3_ap"}, {"h": {"en": "3.3.8 Network Interface Card (NIC)", "gu": "3.3.8 Network Interface Card (NIC)"}, "body": {"en": "<p>A <b>Network Interface Card (NIC)</b>, also called a network adapter or LAN card, is the hardware that connects a computer to a network. It works at the <b>physical and data link layers</b>.</p>\n<ul>\n<li>Every NIC has a unique 48-bit <b>MAC (physical) address</b> burned into its ROM by the manufacturer, written as 12 hexadecimal digits, e.g. <b>00:1A:2B:3C:4D:5E</b>. The first 24 bits (OUI) identify the manufacturer.</li>\n<li>It converts data from the computer (parallel) into signals for the cable or radio (serial), and back.</li>\n<li>It frames data, checks errors and controls access to the medium (e.g. CSMA/CD for Ethernet).</li>\n<li>It connects to the motherboard through PCIe or USB; today most NICs are built into the motherboard.</li>\n</ul>\n<h4>Types</h4>\n<ul>\n<li><b>Wired (Ethernet) NIC:</b> RJ-45 port; 100 Mbps / 1 Gbps / 10 Gbps. LEDs show link and activity.</li>\n<li><b>Wireless NIC:</b> Wi-Fi adapter with antenna (internal card or USB dongle).</li>\n<li><b>Fiber NIC:</b> SFP port for fiber in servers.</li>\n</ul>\n<p>The MAC address can be seen with <b>ipconfig /all</b> (Windows) or <b>ip link</b> (Linux).</p>", "gu": "<p><b>Network Interface Card (NIC)</b>, જેને network adapter કે LAN card પણ કહે છે, તે computer ને network સાથે જોડતું hardware છે. તે <b>physical અને data link layers</b> પર કામ કરે.</p>\n<ul>\n<li>દરેક NIC માં manufacturer દ્વારા ROM માં લખેલું અનન્ય 48-bit <b>MAC (physical) address</b> હોય, 12 hexadecimal અંકોમાં લખાય, દા.ત. <b>00:1A:2B:3C:4D:5E</b>. પ્રથમ 24 bits (OUI) manufacturer ઓળખે.</li>\n<li>તે computer ના data (parallel) ને cable કે radio માટેના signals (serial) માં અને પાછા ફેરવે.</li>\n<li>તે data frame કરે, errors તપાસે અને medium નો access નિયંત્રિત કરે (દા.ત. Ethernet માટે CSMA/CD).</li>\n<li>તે PCIe કે USB દ્વારા motherboard સાથે જોડાય; આજે મોટા ભાગના NICs motherboard માં જ હોય.</li>\n</ul>\n<h4>પ્રકારો</h4>\n<ul>\n<li><b>Wired (Ethernet) NIC:</b> RJ-45 port; 100 Mbps / 1 Gbps / 10 Gbps. LEDs link અને activity બતાવે.</li>\n<li><b>Wireless NIC:</b> antenna વાળું Wi-Fi adapter (internal card કે USB dongle).</li>\n<li><b>Fiber NIC:</b> servers માં fiber માટે SFP port.</li>\n</ul>\n<p>MAC address <b>ipconfig /all</b> (Windows) કે <b>ip link</b> (Linux) થી જોઈ શકાય.</p>"}, "diagram": "cn3_nic"}, {"h": {"en": "3.3.9 Layer 2 vs Layer 3 Switch; Devices and OSI Layers", "gu": "3.3.9 Layer 2 vs Layer 3 Switch; Devices અને OSI Layers"}, "body": {"en": "<p>A <b>layer 2 switch</b> forwards frames using MAC addresses only. A <b>layer 3 switch</b> (multilayer switch) combines a switch and a router: it switches frames within a VLAN using MAC addresses and <b>routes packets between VLANs</b> using IP addresses, in hardware, at wire speed.</p>\n<table><tr><th>Layer 2 switch</th><th>Layer 3 switch</th></tr><tr><td>Works at data link layer</td><td>Works at data link + network layer</td></tr><tr><td>Forwards frames using MAC addresses</td><td>Forwards using MAC and routes using IP addresses</td></tr><tr><td>Cannot route between VLANs; needs an external router</td><td>Inter-VLAN routing inside the switch</td></tr><tr><td>One broadcast domain (unless VLANs)</td><td>Breaks broadcast domains</td></tr><tr><td>Cheaper, simple</td><td>Costlier, more features (routing protocols, ACL)</td></tr><tr><td>Used at access layer (connect PCs)</td><td>Used at distribution / core layer of campus networks</td></tr></table>\n<h4>Network devices and OSI layers</h4>\n<p>A device that works at a higher layer can also perform the jobs of the lower layers (a router also regenerates signals and handles frames).</p>\n<table><tr><th>Device</th><th>OSI layer</th><th>Address used</th><th>Domains</th></tr><tr><td>Repeater, Hub</td><td>1 Physical</td><td>None</td><td>1 collision, 1 broadcast</td></tr><tr><td>NIC</td><td>1 + 2</td><td>MAC (burned in)</td><td>-</td></tr><tr><td>Bridge, Switch, AP</td><td>2 Data link</td><td>MAC</td><td>Separate collision, 1 broadcast</td></tr><tr><td>Router, L3 switch</td><td>3 Network</td><td>IP</td><td>Separate collision and broadcast</td></tr><tr><td>Gateway</td><td>4 to 7 (all)</td><td>Protocol conversion</td><td>-</td></tr></table>\n<p><b>Collision domain:</b> the part of a network where two transmissions at the same time collide. <b>Broadcast domain:</b> the part of a network that receives a broadcast frame. Switches and bridges break collision domains; routers break both.</p>", "gu": "<p><b>Layer 2 switch</b> ફક્ત MAC addresses વાપરી frames forward કરે. <b>Layer 3 switch</b> (multilayer switch) switch અને router ભેગા કરે: VLAN ની અંદર MAC addresses વાપરી frames switch કરે અને IP addresses વાપરી <b>VLANs વચ્ચે packets route</b> કરે, hardware માં, wire speed પર.</p>\n<table><tr><th>Layer 2 switch</th><th>Layer 3 switch</th></tr><tr><td>Data link layer પર કામ કરે</td><td>Data link + network layer પર કામ કરે</td></tr><tr><td>MAC addresses વાપરી frames forward કરે</td><td>MAC થી forward અને IP addresses થી route કરે</td></tr><tr><td>VLANs વચ્ચે route ન કરી શકે; બહારનું router જોઈએ</td><td>Switch ની અંદર inter-VLAN routing</td></tr><tr><td>એક broadcast domain (VLANs સિવાય)</td><td>Broadcast domains તોડે</td></tr><tr><td>સસ્તું, સરળ</td><td>મોંઘું, વધુ features (routing protocols, ACL)</td></tr><tr><td>Access layer પર વપરાય (PCs જોડવા)</td><td>Campus networks ના distribution / core layer પર વપરાય</td></tr></table>\n<h4>Network devices અને OSI layers</h4>\n<p>ઉપરના layer પર કામ કરતું device નીચેના layers ના કામ પણ કરી શકે (router signals regenerate પણ કરે અને frames સંભાળે).</p>\n<table><tr><th>Device</th><th>OSI layer</th><th>વપરાતું address</th><th>Domains</th></tr><tr><td>Repeater, Hub</td><td>1 Physical</td><td>કોઈ નહીં</td><td>1 collision, 1 broadcast</td></tr><tr><td>NIC</td><td>1 + 2</td><td>MAC (burned in)</td><td>-</td></tr><tr><td>Bridge, Switch, AP</td><td>2 Data link</td><td>MAC</td><td>અલગ collision, 1 broadcast</td></tr><tr><td>Router, L3 switch</td><td>3 Network</td><td>IP</td><td>અલગ collision અને broadcast</td></tr><tr><td>Gateway</td><td>4 થી 7 (બધા)</td><td>Protocol conversion</td><td>-</td></tr></table>\n<p><b>Collision domain:</b> network નો ભાગ જ્યાં એક સાથે થતા બે transmissions અથડાય. <b>Broadcast domain:</b> network નો ભાગ જે broadcast frame મેળવે. Switches અને bridges collision domains તોડે; routers બંને તોડે.</p>"}, "diagram": "cn3_dev_osi"}]}], "numericals": [{"id": "cn3n1", "q": {"en": "A geostationary satellite is at a height of 35,786 km. Find the propagation delay (a) from earth station to satellite, (b) from one earth station to another through the satellite, and (c) for a reply to come back (round trip). Take c = 3 × 10⁸ m/s and assume the stations are directly below the satellite.", "gu": "Geostationary satellite 35,786 km ઊંચાઈએ છે. Propagation delay શોધો (a) earth station થી satellite, (b) satellite મારફતે એક earth station થી બીજા સુધી, અને (c) જવાબ પાછો આવવા માટે (round trip). c = 3 × 10⁸ m/s લો અને stations satellite ની બરાબર નીચે છે તેમ માનો."}, "a": {"en": "<p>Delay = distance / speed</p><p>(a) Uplink: 35,786,000 m / 3 × 10⁸ = <b>0.1193 s ≈ 119 ms</b></p><p>(b) Up + down = 2 × 0.1193 = <b>0.2386 s ≈ 239 ms</b></p><p>(c) Round trip (question + reply) = 2 × 0.2386 = <b>0.477 s</b>, about half a second, which is why satellite phone calls have a noticeable pause.</p>", "gu": "<p>Delay = અંતર / ઝડપ</p><p>(a) Uplink: 35,786,000 m / 3 × 10⁸ = <b>0.1193 s ≈ 119 ms</b></p><p>(b) Up + down = 2 × 0.1193 = <b>0.2386 s ≈ 239 ms</b></p><p>(c) Round trip (પ્રશ્ન + જવાબ) = 2 × 0.2386 = <b>0.477 s</b>, લગભગ અડધી second, તેથી satellite phone calls માં સ્પષ્ટ વિરામ આવે છે.</p>"}}, {"id": "cn3n2", "q": {"en": "Two microwave antennas are mounted on towers of height 100 m each. Find the maximum line-of-sight distance between them using d = 4.12 (√h1 + √h2) km. How many hops (tower-to-tower links) are needed for a 400 km link?", "gu": "બે microwave antennas દરેક 100 m ઊંચા towers પર લગાવેલા છે. d = 4.12 (√h1 + √h2) km વાપરી તેમની વચ્ચે મહત્તમ line-of-sight અંતર શોધો. 400 km ની link માટે કેટલા hops (tower-to-tower links) જોઈએ?"}, "a": {"en": "<p>d = 4.12 (√100 + √100) = 4.12 (10 + 10) = <b>82.4 km</b></p><p>Hops = 400 / 82.4 = 4.85 → round up = <b>5 hops</b> (4 intermediate repeater towers)</p><p>Doubling the tower height does not double the distance, because d depends on √h.</p>", "gu": "<p>d = 4.12 (√100 + √100) = 4.12 (10 + 10) = <b>82.4 km</b></p><p>Hops = 400 / 82.4 = 4.85 → ઉપર round = <b>5 hops</b> (4 વચ્ચેના repeater towers)</p><p>Tower ની ઊંચાઈ બમણી કરવાથી અંતર બમણું થતું નથી, કારણ કે d √h પર આધારિત છે.</p>"}}, {"id": "cn3n3", "q": {"en": "Find the wavelength of (a) Wi-Fi at 2.4 GHz, (b) FM radio at 100 MHz, (c) a satellite Ku band signal at 12 GHz. Take c = 3 × 10⁸ m/s.", "gu": "તરંગલંબાઈ શોધો (a) 2.4 GHz પર Wi-Fi, (b) 100 MHz પર FM radio, (c) 12 GHz પર satellite Ku band signal. c = 3 × 10⁸ m/s લો."}, "a": {"en": "<p>λ = c / f</p><ul><li>Wi-Fi: λ = 3 × 10⁸ / 2.4 × 10⁹ = <b>0.125 m</b> = 12.5 cm</li><li>FM radio: λ = 3 × 10⁸ / 10⁸ = <b>3 m</b></li><li>Satellite Ku band: λ = 3 × 10⁸ / 1.2 × 10¹⁰ = <b>0.025 m</b> = 2.5 cm</li></ul><p>Higher frequency → shorter wavelength → smaller antenna (antenna size is a fraction of λ).</p>", "gu": "<p>λ = c / f</p><ul><li>Wi-Fi: λ = 3 × 10⁸ / 2.4 × 10⁹ = <b>0.125 m</b> = 12.5 cm</li><li>FM radio: λ = 3 × 10⁸ / 10⁸ = <b>3 m</b></li><li>Satellite Ku band: λ = 3 × 10⁸ / 1.2 × 10¹⁰ = <b>0.025 m</b> = 2.5 cm</li></ul><p>વધુ frequency → ટૂંકી wavelength → નાનું antenna (antenna size λ નો અમુક ભાગ હોય).</p>"}}, {"id": "cn3n4", "q": {"en": "An optical fiber has core refractive index n1 = 1.48 and cladding refractive index n2 = 1.46. Find (a) the critical angle, (b) the numerical aperture and (c) the acceptance angle.", "gu": "Optical fiber ના core નો refractive index n1 = 1.48 અને cladding નો n2 = 1.46 છે. શોધો (a) critical angle, (b) numerical aperture અને (c) acceptance angle."}, "a": {"en": "<p>(a) sin θc = n2 / n1 = 1.46 / 1.48 = 0.9865 → θc = <b>80.57°</b></p><p>(b) NA = √(n1² − n2²) = √(2.1904 − 2.1316) = √0.0588 = <b>0.2425</b></p><p>(c) Acceptance angle θa = sin⁻¹(NA) = <b>14.03°</b></p><p>Light hitting the core-cladding boundary at more than 80.57° (from the normal) is totally internally reflected.</p>", "gu": "<p>(a) sin θc = n2 / n1 = 1.46 / 1.48 = 0.9865 → θc = <b>80.57°</b></p><p>(b) NA = √(n1² − n2²) = √(2.1904 − 2.1316) = √0.0588 = <b>0.2425</b></p><p>(c) Acceptance angle θa = sin⁻¹(NA) = <b>14.03°</b></p><p>Core-cladding સીમા પર 80.57° (normal થી) થી વધુ ખૂણે પડતો પ્રકાશ total internal reflection પામે.</p>"}}, {"id": "cn3n5", "q": {"en": "A 1,500-byte frame is sent on a 1 km cable with propagation speed 2 × 10⁸ m/s at 100 Mbps. Find the propagation delay, the transmission time and the total time for the last bit to arrive.", "gu": "1,500-byte frame 1 km cable પર 2 × 10⁸ m/s propagation speed સાથે 100 Mbps એ મોકલાય છે. Propagation delay, transmission time અને છેલ્લો bit પહોંચવાનો કુલ સમય શોધો."}, "a": {"en": "<p>Propagation delay = distance / speed = 1000 / 2 × 10⁸ = <b>5 µs</b></p><p>Transmission time = frame size / bandwidth = 12,000 bits / 10⁸ = <b>120 µs</b></p><p>Total = 120 + 5 = <b>125 µs</b></p>", "gu": "<p>Propagation delay = અંતર / ઝડપ = 1000 / 2 × 10⁸ = <b>5 µs</b></p><p>Transmission time = frame size / bandwidth = 12,000 bits / 10⁸ = <b>120 µs</b></p><p>કુલ = 120 + 5 = <b>125 µs</b></p>"}}], "equations": [{"title": {"en": "Waves and delay", "gu": "Waves અને delay"}, "items": [{"name": {"en": "Wavelength", "gu": "Wavelength"}, "f": "λ = c / f", "terms": {"en": "c = 3 × 10⁸ m/s in free space; f in Hz", "gu": "Free space માં c = 3 × 10⁸ m/s; f Hz માં"}}, {"name": {"en": "Propagation delay", "gu": "Propagation delay"}, "f": "Tp = distance / propagation speed", "terms": {"en": "≈ 2 × 10⁸ m/s in copper and fiber (5 µs per km)", "gu": "Copper અને fiber માં ≈ 2 × 10⁸ m/s (km દીઠ 5 µs)"}}, {"name": {"en": "Transmission time", "gu": "Transmission time"}, "f": "Tt = message size (bits) / bandwidth (bps)", "terms": {"en": "Total latency = Tt + Tp + queuing + processing", "gu": "કુલ latency = Tt + Tp + queuing + processing"}}, {"name": {"en": "GEO satellite delay", "gu": "GEO satellite delay"}, "f": "Tp = 2 × 35,786 km / c ≈ 0.24 s", "terms": {"en": "Earth to satellite to earth, one way", "gu": "Earth થી satellite થી earth, એક તરફ"}}]}, {"title": {"en": "Microwave and fiber", "gu": "Microwave અને fiber"}, "items": [{"name": {"en": "Line-of-sight distance", "gu": "Line-of-sight અંતર"}, "f": "d = 4.12 (√h1 + √h2) km", "terms": {"en": "h1, h2 = antenna heights in metres", "gu": "h1, h2 = antenna ની ઊંચાઈ metres માં"}}, {"name": {"en": "Critical angle", "gu": "Critical angle"}, "f": "sin θc = n2 / n1", "terms": {"en": "n1 = core, n2 = cladding; n1 > n2", "gu": "n1 = core, n2 = cladding; n1 > n2"}}, {"name": {"en": "Numerical aperture", "gu": "Numerical aperture"}, "f": "NA = √(n1² − n2
