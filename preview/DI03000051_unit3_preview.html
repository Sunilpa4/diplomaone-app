²) = sin θa", "terms": {"en": "θa = acceptance angle", "gu": "θa = acceptance angle"}}]}], "viva": [{"title": {"en": "Guided media", "gu": "Guided media"}, "items": [{"q": {"en": "What is transmission media?", "gu": "Transmission media એટલે શું?"}, "a": {"en": "The physical path between sender and receiver through which signals travel; it is below the physical layer.", "gu": "Sender અને receiver વચ્ચેનો physical માર્ગ જેમાંથી signals જાય; તે physical layer ની નીચે છે."}}, {"q": {"en": "Why are wires twisted in twisted pair cable?", "gu": "Twisted pair cable માં વાયર શા માટે વળેલા હોય?"}, "a": {"en": "Twisting cancels electromagnetic interference and crosstalk because noise affects both wires equally.", "gu": "વળ આપવાથી electromagnetic interference અને crosstalk રદ થાય કારણ કે noise બંને વાયરને સરખી અસર કરે."}}, {"q": {"en": "Difference between UTP and STP?", "gu": "UTP અને STP વચ્ચે તફાવત?"}, "a": {"en": "STP has a metal foil / braid shield around the pairs for better noise protection; UTP has no shield and is cheaper.", "gu": "STP માં વધુ noise રક્ષણ માટે pairs ફરતે metal foil / braid shield હોય; UTP માં shield નથી અને સસ્તું છે."}}, {"q": {"en": "Which connector is used with UTP for LAN?", "gu": "LAN માટે UTP સાથે કયું connector વપરાય?"}, "a": {"en": "RJ-45 (8 pins). RJ-11 is used for telephone lines.", "gu": "RJ-45 (8 pins). Telephone lines માટે RJ-11 વપરાય."}}, {"q": {"en": "When is a cross-over cable used?", "gu": "Cross-over cable ક્યારે વપરાય?"}, "a": {"en": "To connect similar devices directly (PC to PC, switch to switch). One end T568A, other end T568B.", "gu": "સરખા devices સીધા જોડવા (PC થી PC, switch થી switch). એક છેડો T568A, બીજો T568B."}}, {"q": {"en": "Name the layers of a coaxial cable.", "gu": "Coaxial cable ના સ્તરોના નામ આપો."}, "a": {"en": "Central copper conductor, insulator (dielectric), outer metallic braid shield, plastic jacket.", "gu": "મધ્ય copper conductor, insulator (dielectric), બાહ્ય metallic braid shield, plastic jacket."}}, {"q": {"en": "On which principle does optical fiber work?", "gu": "Optical fiber કયા સિદ્ધાંત પર કામ કરે?"}, "a": {"en": "Total internal reflection: the core has a higher refractive index than the cladding.", "gu": "Total internal reflection: core નો refractive index cladding કરતાં વધુ હોય."}}, {"q": {"en": "Single-mode vs multimode fiber?", "gu": "Single-mode vs multimode fiber?"}, "a": {"en": "Single-mode has a very thin core (8-10 µm), one path, laser source, long distance. Multimode has a thicker core, many paths, LED source, shorter distance.", "gu": "Single-mode માં ખૂબ પાતળું core (8-10 µm), એક path, laser source, લાંબું અંતર. Multimode માં જાડું core, ઘણા paths, LED source, ટૂંકું અંતર."}}]}, {"title": {"en": "Unguided media", "gu": "Unguided media"}, "items": [{"q": {"en": "What are the three propagation methods?", "gu": "ત્રણ propagation methods કઈ?"}, "a": {"en": "Ground (below 2 MHz), sky (2-30 MHz, reflected by ionosphere) and line-of-sight (above 30 MHz).", "gu": "Ground (2 MHz થી ઓછી), sky (2-30 MHz, ionosphere થી પરાવર્તિત) અને line-of-sight (30 MHz થી વધુ)."}}, {"q": {"en": "Why are radio waves used for broadcasting?", "gu": "Broadcasting માટે radio waves શા માટે વપરાય?"}, "a": {"en": "They are omnidirectional and penetrate walls, so one antenna reaches many receivers.", "gu": "તે omnidirectional છે અને દીવાલોમાંથી પસાર થાય, તેથી એક antenna ઘણા receivers સુધી પહોંચે."}}, {"q": {"en": "Why are microwave towers tall and placed about 50 km apart?", "gu": "Microwave towers ઊંચા અને લગભગ 50 km ના અંતરે શા માટે?"}, "a": {"en": "Microwaves travel in line of sight; the earth's curvature blocks them, so tall towers and repeaters are needed.", "gu": "Microwaves line of sight માં જાય; પૃથ્વીનો વળાંક અટકાવે, તેથી ઊંચા towers અને repeaters જોઈએ."}}, {"q": {"en": "Why does a TV remote not work from another room?", "gu": "TV remote બીજા રૂમમાંથી કેમ કામ ન કરે?"}, "a": {"en": "It uses infrared, which cannot pass through walls and needs line of sight.", "gu": "તે infrared વાપરે, જે દીવાલોમાંથી પસાર ન થાય અને line of sight જોઈએ."}}, {"q": {"en": "What is a geostationary satellite?", "gu": "Geostationary satellite એટલે શું?"}, "a": {"en": "A satellite at 35,786 km above the equator that rotates with the earth (24 h), so it appears fixed.", "gu": "વિષુવવૃત્ત ઉપર 35,786 km એ પૃથ્વી સાથે (24 h) ફરતો satellite, તેથી સ્થિર દેખાય."}}, {"q": {"en": "What are uplink and downlink?", "gu": "Uplink અને downlink એટલે શું?"}, "a": {"en": "Uplink: earth station to satellite. Downlink: satellite to earth. They use different frequencies (e.g. 6 / 4 GHz).", "gu": "Uplink: earth station થી satellite. Downlink: satellite થી earth. જુદી frequencies વાપરે (દા.ત. 6 / 4 GHz)."}}, {"q": {"en": "What is a transponder?", "gu": "Transponder એટલે શું?"}, "a": {"en": "The satellite unit that receives the uplink signal, amplifies it, shifts the frequency and retransmits it.", "gu": "Satellite નું એકમ જે uplink signal મેળવે, amplify કરે, frequency બદલે અને ફરી મોકલે."}}]}, {"title": {"en": "Network devices", "gu": "Network devices"}, "items": [{"q": {"en": "Difference between a repeater and an amplifier?", "gu": "Repeater અને amplifier વચ્ચે તફાવત?"}, "a": {"en": "An amplifier boosts the signal along with noise; a repeater regenerates the original clean bit pattern.", "gu": "Amplifier signal સાથે noise પણ વધારે; repeater મૂળ સ્વચ્છ bit pattern ફરી બનાવે."}}, {"q": {"en": "Active hub vs passive hub?", "gu": "Active hub vs passive hub?"}, "a": {"en": "An active hub regenerates signals and needs power (multiport repeater); a passive hub only connects wires.", "gu": "Active hub signals regenerate કરે અને power જોઈએ (multiport repeater); passive hub ફક્ત વાયર જોડે."}}, {"q": {"en": "Why is a switch better than a hub?", "gu": "Switch hub કરતાં શા માટે સારું?"}, "a": {"en": "A switch sends frames only to the destination port using the MAC table, giving separate collision domains, full duplex and better security.", "gu": "Switch MAC table વાપરી frames ફક્ત destination port પર મોકલે, જેથી અલગ collision domains, full duplex અને વધુ security મળે."}}, {"q": {"en": "Which address does a bridge use?", "gu": "Bridge કયું address વાપરે?"}, "a": {"en": "The MAC (physical) address, stored in its bridge table.", "gu": "MAC (physical) address, તેના bridge table માં સંગ્રહિત."}}, {"q": {"en": "Which address does a router use?", "gu": "Router કયું address વાપરે?"}, "a": {"en": "The destination IP (logical) address, with a routing table.", "gu": "Routing table સાથે destination IP (logical) address."}}, {"q": {"en": "What is a gateway?", "gu": "Gateway એટલે શું?"}, "a": {"en": "A protocol converter that connects networks using different protocols; it can work at all layers.", "gu": "જુદા protocols વાપરતા networks જોડતું protocol converter; બધા layers પર કામ કરી શકે."}}, {"q": {"en": "What is an SSID?", "gu": "SSID એટલે શું?"}, "a": {"en": "The Service Set Identifier: the Wi-Fi network name broadcast by an access point.", "gu": "Service Set Identifier: access point દ્વારા broadcast થતું Wi-Fi network નામ."}}, {"q": {"en": "How long is a MAC address?", "gu": "MAC address કેટલું લાંબું હોય?"}, "a": {"en": "48 bits, written as 12 hexadecimal digits, e.g. 00:1A:2B:3C:4D:5E.", "gu": "48 bits, 12 hexadecimal અંકોમાં લખાય, દા.ત. 00:1A:2B:3C:4D:5E."}}, {"q": {"en": "What is the advantage of a layer 3 switch?", "gu": "Layer 3 switch નો ફાયદો શું?"}, "a": {"en": "It routes between VLANs inside the switch at hardware speed, without a separate router.", "gu": "તે અલગ router વગર switch ની અંદર hardware speed પર VLANs વચ્ચે route કરે."}}]}], "exam_questions": [{"q": {"en": "Classify transmission media with a diagram.", "gu": "આકૃતિ સાથે transmission media નું વર્ગીકરણ કરો."}, "marks": 3}, {"q": {"en": "Explain twisted pair cable. Differentiate UTP and STP.", "gu": "Twisted pair cable સમજાવો. UTP અને STP નો તફાવત આપો."}, "marks": 4}, {"q": {"en": "Write the colour code for straight-through and cross-over cables. State where each is used.", "gu": "Straight-through અને cross-over cables નો colour code લખો. દરેક ક્યાં વપરાય તે જણાવો."}, "marks": 4}, {"q": {"en": "Explain coaxial cable with its construction, advantages and applications.", "gu": "Coaxial cable ની રચના, ફાયદા અને ઉપયોગો સાથે સમજાવો."}, "marks": 4}, {"q": {"en": "Explain fiber optic cable with a neat diagram. Explain its propagation modes.", "gu": "સ્વચ્છ આકૃતિ સાથે fiber optic cable સમજાવો. તેના propagation modes સમજાવો."}, "marks": 7}, {"q": {"en": "Compare twisted pair, coaxial and fiber optic cable.", "gu": "Twisted pair, coaxial અને fiber optic cable ની સરખામણી કરો."}, "marks": 4}, {"q": {"en": "Explain the propagation methods of unguided media.", "gu": "Unguided media ની propagation methods સમજાવો."}, "marks": 3}, {"q": {"en": "Explain microwave transmission with its advantages and disadvantages.", "gu": "Microwave transmission તેના ફાયદા અને ગેરફાયદા સાથે સમજાવો."}, "marks": 4}, {"q": {"en": "Write a short note on satellite communication.", "gu": "Satellite communication પર ટૂંકનોંધ લખો."}, "marks": 4}, {"q": {"en": "Compare radio waves, microwaves and infrared.", "gu": "Radio waves, microwaves અને infrared ની સરખામણી કરો."}, "marks": 3}, {"q": {"en": "Differentiate hub and switch.", "gu": "Hub અને switch નો તફાવત આપો."}, "marks": 3}, {"q": {"en": "Explain repeater, bridge and router.", "gu": "Repeater, bridge અને router સમજાવો."}, "marks": 7}, {"q": {"en": "What is a gateway? Differentiate router and gateway.", "gu": "Gateway એટલે શું? Router અને gateway નો તફાવત આપો."}, "marks": 3}, {"q": {"en": "Differentiate layer 2 switch and layer 3 switch.", "gu": "Layer 2 switch અને layer 3 switch નો તફાવત આપો."}, "marks": 4}, {"q": {"en": "Explain network devices with respect to OSI layers.", "gu": "OSI layers ના સંદર્ભમાં network devices સમજાવો."}, "marks": 4}, {"q": {"en": "Explain NIC and wireless access point.", "gu": "NIC અને wireless access point સમજાવો."}, "marks": 3}], "tabs": ["notes", "diagrams", "equations", "numericals", "viva", "exam"], "diagrams": [{"id": "cn3_class", "title": {"en": "Classification of Transmission Media", "gu": "Transmission Media નું વર્ગીકરણ"}, "file": "diagrams/cn3_class.svg"}, {"id": "cn3_tp", "title": {"en": "Twisted Pair Cable: UTP and STP", "gu": "Twisted Pair Cable: UTP અને STP"}, "file": "diagrams/cn3_tp.svg"}, {"id": "cn3_rj45", "title": {"en": "RJ-45 Colour Codes (Practical 3)", "gu": "RJ-45 Colour Codes (Practical 3)"}, "file": "diagrams/cn3_rj45.svg"}, {"id": "cn3_coax", "title": {"en": "Coaxial Cable", "gu": "Coaxial Cable"}, "file": "diagrams/cn3_coax.svg"}, {"id": "cn3_fiber", "title": {"en": "Fiber Optic Cable: Structure", "gu": "Fiber Optic Cable: રચના"}, "file": "diagrams/cn3_fiber.svg"}, {"id": "cn3_fiber_modes", "title": {"en": "Fiber Optic Propagation Modes", "gu": "Fiber Optic Propagation Modes"}, "file": "diagrams/cn3_fiber_modes.svg"}, {"id": "cn3_prop", "title": {"en": "Propagation Methods", "gu": "Propagation Methods"}, "file": "diagrams/cn3_prop.svg"}, {"id": "cn3_spectrum", "title": {"en": "Electromagnetic Spectrum", "gu": "Electromagnetic Spectrum"}, "file": "diagrams/cn3_spectrum.svg"}, {"id": "cn3_microwave", "title": {"en": "Terrestrial Microwave Transmission", "gu": "Terrestrial Microwave Transmission"}, "file": "diagrams/cn3_microwave.svg"}, {"id": "cn3_satellite", "title": {"en": "Satellite Transmission", "gu": "Satellite Transmission"}, "file": "diagrams/cn3_satellite.svg"}, {"id": "cn3_repeater", "title": {"en": "Repeater: Regenerates the Signal", "gu": "Repeater: Signal ફરી બનાવે"}, "file": "diagrams/cn3_repeater.svg"}, {"id": "cn3_hub_switch", "title": {"en": "Hub (broadcast) vs Switch (unicast)", "gu": "Hub (broadcast) vs Switch (unicast)"}, "file": "diagrams/cn3_hub_switch.svg"}, {"id": "cn3_bridge", "title": {"en": "Bridge: Connects Two LAN Segments", "gu": "Bridge: બે LAN Segments જોડે"}, "file": "diagrams/cn3_bridge.svg"}, {"id": "cn3_router", "title": {"en": "Router: Connects Different Networks", "gu": "Router: જુદા Networks જોડે"}, "file": "diagrams/cn
