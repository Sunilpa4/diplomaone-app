<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Introduction to Web Development – Unit 1</title>
<style>
:root{--p:#7B2CD9;--pd:#6420B8;--lav:#EADDF7;--bg:#F3ECFA;--ink:#1d1b20}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#d8cce8;font-family:"Noto Sans Gujarati","Shruti","Nirmala UI",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink)}
.phone{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:70px;position:relative}
.bar{position:sticky;top:0;z-index:10;background:var(--p);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.top{display:flex;align-items:center;gap:14px;padding:14px 14px 10px}
.top svg{flex:none}
.ttl{flex:1;min-width:0}
.ttl b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{opacity:.85;font-size:12.5px}
.lang{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:18px;padding:6px 12px;font-weight:700;font-size:14px;cursor:pointer}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;padding:0 6px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;color:rgba(255,255,255,.75);padding:10px 14px 12px;font-size:14.5px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;background:none;border-top:0;border-left:0;border-right:0}
.tab.on{color:#fff;border-bottom-color:#fff}
.sec{margin-bottom:14px}
.sh{background:var(--lav);display:flex;align-items:center;justify-content:space-between;padding:16px 14px 16px 18px;font-weight:800;font-size:17px;position:relative}
.more{background:none;border:0;padding:4px 6px;cursor:pointer;border-radius:50%}
.menu{display:none;position:absolute;right:12px;top:48px;background:#fff;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.18);z-index:5;overflow:hidden;min-width:150px}
.menu.show{display:block}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:12px 16px;font-size:14.5px;cursor:pointer}
.menu button:hover{background:#f4eefc}
.card{background:#fff;border-radius:6px;margin:0 0 8px;box-shadow:0 1px 3px rgba(60,20,110,.14)}
.q{display:flex;gap:10px;align-items:flex-start;padding:16px 14px 16px 18px;color:var(--p);font-size:16.5px;line-height:1.45;cursor:pointer}
.q .n{flex:none;min-width:24px}
.q .t{flex:1}
.q.hd{font-weight:700}
.chev{flex:none;transition:transform .2s;margin-top:1px}
.card.open .chev{transform:rotate(180deg)}
.a{display:none;padding:0 16px 18px 52px;font-size:15.5px;line-height:1.65;color:#222}
.card.open .a{display:block;animation:fd .2s}
@keyframes fd{from{opacity:0;transform:translateY(-4px)}to{opacity:1}}
.a p{margin:0 0 10px}.a ul,.a ol{margin:0 0 10px;padding-left:20px}.a li{margin-bottom:4px}
.a b{color:#111}
.eq{background:#F5EEFD;border-left:4px solid var(--p);padding:8px 12px;border-radius:4px;font-weight:700;font-size:16.5px;color:var(--pd)}
.tw{overflow-x:auto;margin:0 0 10px -36px;padding-left:0}
table{border-collapse:collapse;font-size:13.5px;min-width:100%;line-height:1.4}
th{background:var(--p);color:#fff;text-align:left;padding:7px 8px;font-weight:700}
td{border-bottom:1px solid #eadff6;padding:7px 8px;vertical-align:top}
tr:nth-child(even) td{background:#faf7fe}
.dg{margin:6px 0 4px -36px;border:1px solid #eadff6;border-radius:10px;overflow:hidden;cursor:zoom-in;background:#fff}
.dg svg{display:block;width:100%;height:auto}
.dg.pg{margin-left:0}
.dgc{font-size:12px;color:#7a6f88;text-align:center;margin:-2px 0 10px -36px}
.dcard{background:#fff;border-radius:10px;margin:0 10px 12px;box-shadow:0 1px 3px rgba(60,20,110,.14);overflow:hidden;cursor:zoom-in}
.dcard .h{padding:12px 14px;color:var(--p);font-weight:700;font-size:15.5px;border-bottom:1px solid #f0e8f9}
.dcard svg{display:block;width:100%;height:auto}
.fbox{margin:4px 0 0;background:#F5EEFD;border-radius:6px;padding:9px 12px;font-size:18px;font-weight:700;color:var(--pd);display:inline-block}
.q .t .nm{display:block}
.mk{flex:none;background:#FFF1D6;color:#9A5B00;border-radius:12px;padding:2px 9px;font-size:12.5px;font-weight:800;margin-top:2px}
.ad{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:56px;background:#fff;border-top:1px solid #e3d8f0;display:flex;align-items:center;justify-content:center;gap:8px;color:#8b8199;font-size:12.5px;z-index:9}
.ad i{font-style:normal;background:#f2c94c;color:#5b4300;font-weight:800;font-size:10.5px;padding:1px 5px;border-radius:3px}
.modal{position:fixed;inset:0;background:rgba(20,10,35,.92);z-index:50;display:none;flex-direction:column}
.modal.show{display:flex}
.mh{display:flex;align-items:center;justify-content:space-between;color:#fff;padding:12px 16px;font-weight:700}
.mh button{background:rgba(255,255,255,.15);border:0;color:#fff;font-size:18px;width:38px;height:38px;border-radius:50%;cursor:pointer}
.mb{flex:1;overflow:auto;padding:10px}
.mb .zw{background:#fff;border-radius:8px;margin:auto;transform-origin:top left}
.mb svg{display:block;width:100%;height:auto}
.zb{display:flex;justify-content:center;gap:14px;padding:12px}
.zb button{background:#fff;border:0;border-radius:22px;padding:8px 20px;font-size:18px;font-weight:800;color:var(--p);cursor:pointer}
.a h4{margin:14px 0 6px;color:var(--pd);font-size:15.5px}
.a h4:first-child{margin-top:0}
.card.key{border-left:4px solid #2E7D32}
.card.key .q{color:#1B5E20}
.ex{margin:12px 0 10px -36px;border:1.5px dashed #C9A227;background:#FFFBEF;border-radius:10px;padding:10px 12px}
.ex .et{font-weight:800;color:#9A5B00;font-size:13px;margin-bottom:4px}
.ex .eq2{font-weight:700;margin-bottom:6px}
.ex p{margin:0 0 6px}
.a.rn .dg,.a.rn .dgc,.a.rn .tw,.a.rn .ex{margin-left:0}
.intro{margin:12px 10px;background:linear-gradient(135deg,#8E3BE8,#5B1BB0);color:#fff;border-radius:14px;padding:14px 16px}
.intro b{font-size:16px}.intro div{font-size:13px;opacity:.9;margin-top:4px}
.chips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.chips span{background:rgba(255,255,255,.18);border-radius:12px;padding:3px 10px;font-size:12px;font-weight:700}
pre.code{background:#1E1530;color:#EDE7F6;border-radius:8px;padding:10px 12px;font:13px/1.55 "JetBrains Mono",Consolas,"DejaVu Sans Mono","Noto Sans Gujarati",monospace;overflow-x:auto;margin:0 0 10px;white-space:pre;tab-size:4}
pre.out{background:#0E1B12;color:#B9F6CA;border-radius:8px;padding:10px 12px;font:13px/1.5 Consolas,"DejaVu Sans Mono",monospace;overflow-x:auto;margin:0 0 10px;white-space:pre}
.kw{color:#C792EA;font-weight:700}.ty{color:#82AAFF}.st{color:#C3E88D}.cm{color:#8E9AAF;font-style:italic}.pp{color:#F78C6C}.nu{color:#F9C46B}.fn{color:#FFCB6B}
.pl{font-size:12px;font-weight:800;color:var(--pd);margin:10px 0 4px;letter-spacing:.4px;text-transform:uppercase}
@media (max-width:480px){pre.code,pre.out{font-size:11.5px;padding:9px 10px}}
.a code{background:#F1E9FB;color:#5B1BB0;padding:1px 5px;border-radius:4px;font-family:Consolas,"DejaVu Sans Mono",monospace;font-size:.9em}
.pbox{margin:12px 0 10px;border:1.5px dashed #2E8B7A;background:#F2FBF8;border-radius:10px;padding:10px 12px}
.pbox .et{font-weight:800;color:#1F6E60;font-size:13.5px;margin-bottom:6px}
.sx{margin:6px 0 0;font-size:12.5px;padding:8px 10px}
.a.pa{padding-left:16px}
</style></head>

<script>
const U = {"subject": "DI04007011", "unit": 1, "format": "notes", "title": {"en": "Introduction to PHP"}, "weightage": 20, "hours": 12, "notes": [{"title": {"en": "1.1 PHP and the Web Environment"}, "items": [{"h": {"en": "What is PHP: History and Advantages"}, "body": {"en": "\n<ul><li><b>PHP</b> originally stood for <i>Personal Home Page tools</i> - created by <b>Rasmus Lerdorf in 1994-95</b> to track visitors to his online resume. Today the name is a recursive acronym: <b>PHP: Hypertext Preprocessor</b>.</li>\n<li>It is a <b>server-side scripting language</b> embedded inside HTML: the server executes the PHP code and ships plain HTML to the browser.</li>\n<li><b>Advantages</b>: free and open-source; runs on Windows/Linux/macOS; the classic partner of MySQL; easy to learn (C-like syntax, no compilation step); a gigantic ecosystem - <b>WordPress, Wikipedia, Facebook (historically)</b> - and massive documentation at php.net.</li>\n<li>Interpreted per-request: edit the file, refresh the browser - no build, no deploy ceremony. This is why tutorials (and hostels full of student projects) start with PHP.</li>\n<li>Current lineage: PHP 4 (Zend engine) &rarr; PHP 5 (OOP) &rarr; PHP 7 (2x speed, scalar types) &rarr; PHP 8.x (JIT, modern syntax). Our examples run on PHP 8.</li></ul>\n"}}, {"h": {"en": "The Client-Server Request Cycle"}, "body": {"en": "\n<ul><li><b>Client</b>: the browser - sends an HTTP request for a page, renders the returned HTML. <b>Server</b>: Apache with the PHP engine - executes scripts and answers with generated HTML.</li>\n<li>The browser <b>never sees PHP source</b>; it receives only the echo'ed output. Server-side means logic, passwords and database credentials stay on the server.</li>\n<li>One cycle: URL typed &rarr; request travels &rarr; PHP engine runs the script &rarr; flat HTML returns &rarr; browser renders. Every page view repeats it.</li>\n<li>Dynamic means <i>generated per request</i>: the same seat-status page shows 37 seats now, 2 seats an hour later - one script, infinite HTML pages.</li></ul>\n"}, "diagram": "wd1_client_server"}, {"h": {"en": "The 3-Tier Architecture of a Web Application"}, "body": {"en": "\n<ul><li><i>Presentation tier</i> (browser, HTML/CSS) &rarr; <i>Application tier</i> (Apache + PHP, business logic) &rarr; <i>Data tier</i> (MySQL tables, files).</li>\n<li>On a developer laptop all three tiers live together (XAMPP); in production they may be three different machines - the tiers communicate over HTTP and SQL.</li>\n<li>Layer pay-off: change the database without touching the pages; reskin the pages without touching the logic. Each tier minds its own business.</li>\n<li>PHP sits in the application tier: it receives browser data through forms (Unit 3), remembers users via sessions (Unit 4) and talks to MySQL (Unit 5).</li></ul>\n"}, "diagram": "wd1_3tier"}]}, {"title": {"en": "1.2 Setting Up: XAMPP and the First Page"}, "items": [{"h": {"en": "Installing XAMPP and Running Your First Page (Practicals 1-2)"}, "body": {"en": "\n<ul><li><b>XAMPP</b> = X (any OS) + <b>A</b>pache + <b>M</b>ariaDB/MySQL + <b>P</b>HP + <b>P</b>erl - one installer packs the whole 3-tier lab. Cousins: WAMP (Windows), LAMP (Linux), MAMP (macOS).</li>\n<li>Install flow: download from apachefriends.org &rarr; install &rarr; open the XAMPP control panel &rarr; <b>Start Apache</b> (and MySQL later, Unit 5). Apache must show green before any page works.</li>\n<li>Web root: the folder <code>C:\\xampp\\htdocs</code> (Windows) or <code>/opt/lampp/htdocs</code> (Linux). Save <code>hello.php</code> there and browse <code>http://localhost/hello.php</code>.</li>\n<li>Troubleshooting reflexes: <b>404</b> = the file is not under htdocs (or wrong name); <b>source code visible</b> = saved as .html instead of .php, or Apache off; <b>blank page</b> = PHP error - check the Apache error log.</li>\n<li>The CLI (<code>php file.php</code>) is a second, server-free way to run PHP - every program in this unit is verified with the PHP 8 CLI, exactly as shown.</li></ul>\n"}, "diagram": "wd1_xampp", "programs": ["wd1p1"]}]}, {"title": {"en": "1.3 Embedding, echo/print, and the Type System"}, "items": [{"h": {"en": "Embedding PHP in HTML; echo, print and Comments"}, "body": {"en": "\n<ul><li>PHP code lives inside <code>&lt;?php ... ?&gt;</code> tags, which may appear <b>any number of times, anywhere</b> in an .html skeleton saved as a .php file. The engine replaces each island with the output it generates.</li>\n<li><code>echo</code> writes output - accepts several comma-separated values, no parentheses needed, returns nothing (slightly faster). <code>print</code> outputs one value and returns 1, so it can sit inside an expression (rarely used).</li>\n<li><b>Comments</b>: <code>// line</code>, <code># line</code> and <code>/* block */</code>. Comments never reach the browser - they are for the next reader of the source.</li>\n<li>Every PHP statement ends with a semicolon; missing <code>;</code> is the classic first-parse-error. Short open tag <code>&lt;?= $x ?&gt;</code> is a shortcut for <code>&lt;?php echo $x ?&gt;</code>.</li></ul>\n"}, "diagram": "wd1_embed", "programs": ["wd1p2"]}, {"h": {"en": "Variables, Constants and Data Types"}, "body": {"en": "\n<ul><li>Variables start with <b>$</b> and a letter/underscore: <code>$seatCount = 40;</code>. No type declaration - the value decides the type, and it can change (<b>loose/dynamic typing</b>).</li>\n<li>PHP is <b>case-sensitive for variables</b> (<code>$Seat</code> &ne; <code>$seat</code>) but case-insensitive for keywords and function names.</li>\n<li>Scalars: <b>int, float, string, bool</b>; compound: <b>array, object</b>; plus <b>NULL</b> and <b>resource</b>. Inspect any variable with <code>var_dump($x)</code> (type + value) or query with <code>gettype($x)</code>.</li>\n<li><b>Constants</b>: <code>define(\"GST\", 0.18)</code> or <code>const GST = 0.18;</code> - no $ sign, global by default, immutable.</li>\n<li>Strings in <b>double quotes interpolate variables</b> (<code>\"Fare: Rs $fare\"</code>); single quotes print them literally. Concatenation uses the <b>dot</b> operator: <code>\"Hello \" . $name</code>.</li></ul>\n"}, "diagram": "wd1_datatypes", "programs": ["wd1p3", "wd1p4"]}, {"h": {"en": "Operators and Expressions"}, "body": {"en": "\n<ul><li>Families: <b>arithmetic</b> (+ - * / % **), <b>assignment</b> (= += .=), <b>comparison</b> (== === != &lt;&gt; &lt; &gt; &lt;=&gt;), <b>logical</b> (&amp;&amp; || ! and or), <b>string</b> (. .=), <b>increment</b> (++$i $i--).</li>\n<li><b>Loose vs strict comparison</b>: <code>==</code> juggles types (<code>5 == \"5\"</code> is true); <code>===</code> also demands the same type (<code>5 === \"5\"</code> is false). Form data arrives as strings - always compare with <code>===</code>/casts.</li>\n<li>Spaceship <code>&lt;=&gt;</code> returns -1, 0 or 1 (less, equal, greater) - built for sort callbacks.</li>\n<li>Precedence: ** then * / %, then + -, comparisons last before &amp;&amp;, ||. When in doubt, parenthesise - clarity beats cleverness.</li>\n<li>The dot family matters daily: building HTML strings means <code>$msg .= \"&lt;li&gt;$item&lt;/li&gt;\"</code> style accumulation.</li></ul>\n"}, "diagram": "wd1_operators"}]}, {"title": {"en": "1.4 Conditional Structures"}, "items": [{"h": {"en": "if, if-else and else-if Chains"}, "body": {"en": "\n<ul><li><code>if (cond) { ... }</code> runs the block only when the condition is truthy. Add <code>else { ... }</code> for the alternative, or chain <code>elseif</code> for tested ladders (grade calculators, fare slabs).</li>\n<li>Once one branch matches, the rest are skipped - order the ladder carefully (test the highest slab first).</li>\n<li>Truthy/falsy shorthand: <code>0, \"\", \"0\", NULL, false, []</code> count as false; almost everything else is true. <code>if ($seats)</code> reads as \"if any seats remain\".</li>\n<li>The <b>ternary</b> <code>$label = ($marks &gt;= 40) ? \"Pass\" : \"Fail\";</code> compresses a two-way choice into one expression - ideal inside echo statements.</li>\n<li>Always brace even one-liners in team code: braced blocks survive the next edit.</li></ul>\n"}, "diagram": "wd1_ifelif", "programs": ["wd1p5"]}, {"h": {"en": "switch-case: One Expression, Many Routes"}, "body": {"en": "\n<ul><li><code>switch ($day) { case \"Mon\": ...; break; ... default: ... }</code> compares one expression against many constant values - cleaner than a long elseif ladder when the test is equality.</li>\n<li><b>break</b> ends each case; forget it and execution <i>falls through</i> into the next case (occasionally intentional, usually a bug).</li>\n<li><code>default</code> handles everything unmatched - put it last, like the safety net of an else.</li>\n<li>Use switch for menus, day names, status codes; use if-elseif for ranges (<code>$marks &gt;= 70</code>) and compound conditions.</li></ul>\n"}, "programs": ["wd1p6"]}]}, {"title": {"en": "1.5 Looping Structures"}, "items": [{"h": {"en": "for, while, do-while and foreach"}, "body": {"en": "\n<ul><li><b>for</b> <code>(init; test; step)</code> - the counted loop: multiplication tables, seat numbers 1..40.</li>\n<li><b>while</b> - pre-checked condition loop: runs zero or more times; classic for reading database rows (<code>while ($row = ...)</code>) once Unit 5 begins.</li>\n<li><b>do-while</b> - body first, test after: guaranteed <b>one execution</b>, natural for menu/retry patterns (\"show menu, ask again while the choice is invalid\").</li>\n<li><b>foreach</b> <code>($arr as $v)</code> or <code>($arr as $k =&gt; $v)</code> - PHP's signature loop for arrays; Unit 2 fills it with real data. No off-by-one, no counter boilerplate.</li>\n<li>Pick by intent: known count &rarr; for; unknown count &rarr; while; at-least-once &rarr; do-while; collections &rarr; foreach.</li></ul>\n"}, "diagram": "wd1_loops", "programs": ["wd1p7"]}, {"h": {"en": "break and continue: Steering the Loop"}, "body": {"en": "\n<ul><li><code>break</code> leaves the loop immediately - e.g. stop searching once the seat is found.</li>\n<li><code>continue</code> skips the rest of this lap and jumps to the next iteration - e.g. skip printing taken seats, or skip multiples of 3.</li>\n<li>Both act on the <b>innermost</b> enclosing loop by default; <code>break 2;</code> escapes two levels (rare, use sparingly).</li>\n<li>Wisdom: a well-shaped condition usually beats a forest of flags and breaks; keep loop bodies small enough to read at a glance.</li></ul>\n"}, "programs": ["wd1p8"]}]}], "programs": [{"id": "wd1p1", "title": {"en": "Welcome page: echo, print and comments (Practical 2)"}, "code": {"en": "<?php\n// My first PHP page - Practical 2\n#  hash comments also work\n/* block comments\n   span several lines */\n\necho \"Welcome to Web Development!\\n\";\necho \"Diploma\", \" Sem 4\", \" - Computer\\n\";   // echo takes many values\nprint \"Powered by PHP\\n\";                     // print: one value only\n\n$name = \"Ravi\";          // double quotes interpolate variables\necho \"Hello, $name\\n\";   // Hello, Ravi\necho 'Hello, $name' . \"\\n\";  // single quotes stay literal\n?>"}, "out": "$ php index.php\nWelcome to Web Development!\nDiploma Sem 4 - Computer\nPowered by PHP\nHello, Ravi\nHello, $name", "expl": {"en": "<p><code>echo</code> accepts comma-separated values; <code>print</code> takes one and returns 1. Double-quoted strings <b>interpolate</b> (expand) <code>$variables</code>; single-quoted strings print them literally. Comments after <code>//</code>, <code>#</code> or inside <code>/* */</code> never reach the output.</p>"}}, {"id": "wd1p2", "title": {"en": "Embedding PHP islands inside HTML"}, "code": {"en": "<?php\n$seatsTotal = 40;\n$seatsBooked = 3;\n?>\n<!DOCTYPE html>\n<html>\n<head><title>Bus Booking</title></head>\n<body>\n<h1>Bus Booking - Surat to Ahmedabad</h1>\n<p>Date: <?php echo date(\"d M Y\"); ?></p>\n<?php\n    $seats = $seatsTotal - $seatsBooked;\n    echo \"<p><b>Seats left: $seats</b></p>\";\n?>\n<p>Have a safe journey!</p>\n</body>\n</html>"}, "out": "$ php index.php\n<!DOCTYPE html>\n<html>\n<head><title>Bus Booking</title></head>\n<body>\n<h1>Bus Booking - Surat to Ahmedabad</h1>\n<p>Date: 28 Oct 2026</p>\n<p><b>Seats left: 37</b></p><p>Have a safe journey!</p>\n</body>\n</html>", "expl": {"en": "<p>The <code>&lt;?php ?&gt;</code> islands can appear anywhere in the page. The engine executes each island and replaces it with its output, so the browser receives one flat HTML document. Run this with the CLI and you see the same HTML the browser would (tags are echoed text here).</p>"}}, {"id": "wd1p3", "title": {"en": "Variables, constants and operators (Practical 3)"}, "code": {"en": "<?php\n// Fare calculator - variables, constants, operators\ndefine(\"GST_RATE\", 0.18);        // constant: no $ sign\nconst APP_NAME = \"BusBook\";\n\n$baseFare = 250;                 // int\n$distance = 265;                 // int (kms)\n$perKm = 1.2;                    // float\n\n$fare = $baseFare + $distance * $perKm;   // * and + : int+float -> float\n$tax = $fare * GST_RATE;\n$total = $fare + $tax;\n\necho APP_NAME, \" receipt\\n\";\necho \"Base fare : Rs \", $fare, \"\\n\";\necho \"GST 18%   : Rs \", round($tax, 2), \"\\n\";\necho \"Total     : Rs \", round($total, 2), \"\\n\";\n\n$seats = 40;\n$seats -= 3;                     // compound assignment\n$seats++;                        // increment\necho \"Seats left now: $seats\\n\";\n?>"}, "out": "$ php index.php\nBusBook receipt\nBase fare : Rs 568\nGST 18%   : Rs 102.24\nTotal     : Rs 670.24\nSeats left now: 38", "expl": {"en": "<p>Operators behave as in C/Java: <code>*</code> binds tighter than <code>+</code>; mixed int/float arithmetic promotes to float. Constants need no <code>$</code> and cannot be redefined. Compound assignment (<code>-=</code>) and <code>++</code> update a variable in place.</p>"}}, {"id": "wd1p4", "title": {"en": "Types, var_dump and == vs === (Practical 3)"}, "code": {"en": "<?php\n$age = 18;              // int\n$price = 19.99;         // float\n$name = \"Surat\";        // string\n$isActive = true;       // bool\n$pending = null;        // NULL\n\nvar_dump($age, $price, $name, $isActive, $pending);\n\n$fromForm = \"18\";       // form data always arrives as string\nvar_dump($age == $fromForm);    // loose: true (type juggled)\nvar_dump($age === $fromForm);   // strict: false (types differ)\nvar_dump($age === (int)$fromForm); // after casting: true\n\necho \"2 + 3 = \", 2 + 3, \" but 2 . 3 = \", 2 . 3, \"\\n\";\n?>"}, "out": "$ php index.php\nint(18)\nfloat(19.99)\nstring(5) \"Surat\"\nbool(true)\nNULL\nbool(true)\nbool(false)\nbool(true)\n2 + 3 = 5 but 2 . 3 = 23", "expl": {"en": "<p><code>var_dump()</code> prints type and value - the PHP debugger's first tool. <b>Loose vs strict</b>: <code>==</code> converts types before comparing (dangerous with form input), <code>===</code> requires identical type AND value. Note the two operators: <code>+</code> adds numbers, <code>.</code> glues strings.</p>"}}, {"id": "wd1p5", "title": {"en": "Grade ladder with if - elseif - else (Practical 4)"}, "code": {"en": "<?php\n$marks = 54;\n\nif ($marks >= 70) {\n    $grade = \"Distinction\";\n} elseif ($marks >= 60) {\n    $grade = \"First Class\";\n} elseif ($marks >= 50) {\n    $grade = \"Second Class\";\n} elseif ($marks >= 40) {\n    $grade = \"Pass\";\n} else {\n    $grade = \"Fail\";\n}\n\necho \"Marks: $marks  ->  $grade\\n\";\n\n// ternary: compact two-way choice\n$result = ($marks >= 40) ? \"PASS\" : \"FAIL\";\necho \"Result: $result\\n\";\n\n// truthiness shorthand\n$seatsLeft = 0;\nif ($seatsLeft) {\n    echo \"Seats available\\n\";\n} else {\n    echo \"Housefull!\\n\";   // 0 counts as false\n}\n?>"}, "out": "$ php index.php\nMarks: 54  ->  Second Class\nResult: PASS\nHousefull!", "expl": {"en": "<p>The ladder tests from the top; the first true branch wins and the rest are skipped - so test the highest slabs first (swap 50 and 40 and watch the bug). The ternary folds a two-way choice into one expression. <code>0</code>, <code>\"\"</code>, <code>null</code>, <code>false</code> are falsy - <code>if ($seatsLeft)</code> reads naturally.</p>"}}, {"id": "wd1p6", "title": {"en": "Day planner with switch-case (Practical 4)"}, "code": {"en": "<?php\n$day = \"Wed\";\n\nswitch ($day) {\n    case \"Mon\":\n    case \"Wed\":\n    case \"Fri\":\n        echo \"$day: Theory lectures\\n\";\n        break;\n    case \"Tue\":\n    case \"Thu\":\n        echo \"$day: Lab sessions\\n\";\n        break;\n    case \"Sat\":\n        echo \"$day: Project work\\n\";\n        break;\n    default:\n        echo \"$day: Holiday / unknown day\\n\";\n}\n\n$route = \"SURAT\";\nswitch ($route) {\n    case \"SURAT\":\n        echo \"Boarding point: Adajan\\n\";\n        // break forgotten on purpose is a bug - never do this\n        break;\n    case \"BHARUCH\":\n        echo \"Boarding point: Zadeshwar\\n\";\n        break;\n    default:\n        echo \"Route not served\\n\";\n}\n?>"}, "out": "$ php index.php\nWed: Theory lectures\nBoarding point: Adajan", "expl": {"en": "<p><code>switch</code> tests one expression against constants - ideal for menus, days and status codes. Stacked cases (<code>Mon/Wed/Fri</code>) share one block. Every case needs a <code>break</code>: without it execution falls through into the next case. <code>default</code> is the safety net for unmatched values.</p>"}}, {"id": "wd1p7", "title": {"en": "Four loops doing real work (Practical 5)"}, "code": {"en": "<?php\n// for: counted repetition - table of 7\necho \"Table of 7:\\n\";\nfor ($i = 1; $i <= 5; $i++) {\n    echo \"7 x $i = \" . (7 * $i) . \"\\n\";\n}\n\n// while: keep halving until we reach 1\n$n = 40;\necho \"Halving $n:\";\nwhile ($n > 1) {\n    $n = $n / 2;\n    echo \" -> $n\";\n}\necho \"\\n\";\n\n// do-while: body runs at least once\n$attempt = 5;\ndo {\n    echo \"Attempt $attempt: seat locked, verifying...\\n\";\n    $attempt--;\n} while ($attempt > 3);\n\n// foreach: PHP's array loop (arrays come properly in Unit 2)\n$cities = [\"Surat\", \"Bharuch\", \"Vadodara\", \"Ahmedabad\"];\nforeach ($cities as $stop) {\n    echo \"Stop: $stop\\n\";\n}\n?>"}, "out": "$ php index.php\nTable of 7:\n7 x 1 = 7\n7 x 2 = 14\n7 x 3 = 21\n7 x 4 = 28\n7 x 5 = 35\nHalving 40: -> 20 -> 10 -> 5 -> 2.5 -> 1.25 -> 0.625\nAttempt 5: seat locked, verifying...\nAttempt 4: seat locked, verifying...\nStop: Surat\nStop: Bharuch\nStop: Vadodara\nStop: Ahmedabad", "expl": {"en": "<p>Choose the loop by intent: <b>for</b> when the count is known, <b>while</b> when the end depends on data (it may run zero times), <b>do-while</b> when the body must run at least once, and <b>foreach</b> whenever an array is in hand - no counter, no off-by-one.</p>"}}, {"id": "wd1p8", "title": {"en": "break and continue: fine steering inside loops"}, "code": {"en": "<?php\n// continue: print seats 1..10 but skip booked ones 3 and 7\n$booked = [3, 7];\necho \"Free seats:\";\nfor ($seat = 1; $seat <= 10; $seat++) {\n    if (in_array($seat, $booked)) {\n        continue;                       // skip this lap\n    }\n    echo \" $seat\";\n}\necho \"\\n\";\n\n// break: search route list, stop at first match\n$routes = [\"Surat-Baroda\", \"Surat-Ahmedabad\", \"Navsari-Surat\"];\nforeach ($routes as $r) {\n    if (str_contains($r, \"Navsari\")) {\n        echo \"Found: $r\\n\";\n        break;                          // no need to scan the rest\n    }\n}\n\n// break 2: exit nested loops\nfor ($bus = 1; $bus <= 3; $bus++) {\n    for ($seat = 1; $seat <= 5; $seat++) {\n        if ($bus == 2 && $seat == 3) {\n            echo \"Stopping at bus $bus seat $seat\\n\";\n            break 2;                    // leave BOTH loops\n        }\n        echo \"bus $bus seat $seat\\n\";\n    }\n}\necho \"Done.\\n\";\n?>"}, "out": "$ php index.php\nFree seats: 1 2 4 5 6 8 9 10\nFound: Navsari-Surat\nbus 1 seat 1\nbus 1 seat 2\nbus 1 seat 3\nbus 1 seat 4\nbus 1 seat 5\nbus 2 seat 1\nbus 2 seat 2\nStopping at bus 2 seat 3\nDone.", "expl": {"en": "<p><code>continue</code> skips to the next iteration (free-seat printing); <code>break</code> abandons the loop entirely (stop once found); <code>break 2</code> escapes two nesting levels. Use them as precision tools - if every loop needs three breaks, the condition itself is probably wrong.</p>"}}], "diagrams": [{"id": "wd1_client_server", "title": {"en": "Client-Server: One Request Cycle"}, "file": "diagrams/wd1_client_server.svg"}, {"id": "wd1_3tier", "title": {"en": "3-Tier Architecture of a Web App"}, "file": "diagrams/wd1_3tier.svg"}, {"id": "wd1_xampp", "title": {"en": "XAMPP: The Whole Lab in One Install"}, "file": "diagrams/wd1_xampp.svg"}, {"id": "wd1_embed", "title": {"en": "Embedding PHP Inside HTML"}, "file": "diagrams/wd1_embed.svg"}, {"id": "wd1_datatypes", "title": {"en": "PHP Data Types (Loosely Typed)"}, "file": "diagrams/wd1_datatypes.svg"}, {"id": "wd1_operators", "title": {"en": "PHP Operator Families"}, "file": "diagrams/wd1_operators.svg"}, {"id": "wd1_ifelif", "title": {"en": "if - elseif - else Flow"}, "file": "diagrams/wd1_ifelif.svg"}, {"id": "wd1_loops", "title": {"en": "Four Loops, Four Personalities"}, "file": "diagrams/wd1_loops.svg"}], "syntax": [{"title": {"en": "Page and output cards"}, "items": [{"name": {"en": "php tags"}, "f": "<?php\n  // code islands,\n  // anywhere in the page\n?>\n<?= $x ?>  short echo", "terms": {"en": "save as .php, not .html"}}, {"name": {"en": "echo vs print"}, "f": "echo \"a\", \"b\";   fastest\n                 returns nothing\nprint \"a\";      returns 1\n                 fits expressions", "terms": {"en": "both are constructs, not functions"}}, {"name": {"en": "comments"}, "f": "// line comment\n#  line comment\n/* block\n   comment */", "terms": {"en": "for the reader, never the browser"}}]}, {"title": {"en": "Variable and operator cards"}, "items": [{"name": {"en": "variables + types"}, "f": "$seat = 40;      int\n$fare = 9.5;     float\n$n = \"Surat\";    string\n$ok = true;      bool\nvar_dump($x) -> type+value", "terms": {"en": "value decides the type"}}, {"name": {"en": "constants"}, "f": "define(\"GST\", 0.18);\nconst NAME = \"BusBook\";\nno $ sign, no reassign,\nglobal by default", "terms": {"en": "set once, use forever"}}, {"name": {"en": "== vs ==="}, "f": "5 == \"5\"    true   juggled\n5 === \"5\"   false  strict\nform data arrives as\nstrings -> use === / cast", "terms": {"en": "strict wins every time"}}, {"name": {"en": "string glue"}, "f": "$a . $b       concatenate\n$a .= $b      append in place\n\"Fare: $fare\" interpolates\n'Fare: $fare' stays literal", "terms": {"en": "dots, not pluses, join text"}}]}, {"title": {"en": "Decision and loop cards"}, "items": [{"name": {"en": "if ladder"}, "f": "if ($m >= 70)      {...}\nelseif ($m >= 60)  {...}\nelse               {...}\nfirst TRUE branch wins", "terms": {"en": "order slabs high to low"}}, {"name": {"en": "switch"}, "f": "switch ($day) {\n  case \"Mon\": ...\n             break;\n  default:   ...\n}", "terms": {"en": "equality tests only; break!"}}, {"name": {"en": "four loops"}, "f": "for (known count)\nwhile (pre-checked)\ndo-while (once minimum)\nforeach (arrays)", "terms": {"en": "pick by intent"}}, {"name": {"en": "break / continue"}, "f": "break    leave loop now\ncontinue skip to next lap\nbreak 2  exit two levels", "terms": {"en": "innermost loop by default"}}]}], "viva": [{"title": {"en": "PHP and the Web"}, "items": [{"q": {"en": "What does PHP stand for?"}, "a": {"en": "PHP: Hypertext Preprocessor - a recursive acronym; earlier it meant Personal Home Page tools."}}, {"q": {"en": "Who created PHP and when?"}, "a": {"en": "Rasmus Lerdorf, around 1994-95, to track visitors to his online resume."}}, {"q": {"en": "Is PHP server-side or client-side?"}, "a": {"en": "Server-side - the PHP engine on the server executes it; the browser receives only the generated HTML."}}, {"q": {"en": "List four advantages of PHP."}, "a": {"en": "Free and open-source; cross-platform (Windows/Linux/macOS); easy C-like syntax with no compilation; huge ecosystem (WordPress, phpMyAdmin) and native MySQL support."}}, {"q": {"en": "What is the client-server environment?"}, "a": {"en": "The browser (client) sends HTTP requests; the web server (Apache) processes them - running PHP for dynamic pages - and returns HTML responses."}}, {"q": {"en": "Explain the 3-tier architecture of a web application."}, "a": {"en": "Presentation tier (browser, HTML/CSS), application tier (Apache + PHP logic), data tier (MySQL/files). Requests flow down, responses bubble back."}}, {"q": {"en": "Where do the three tiers live during development?"}, "a": {"en": "All on one machine - XAMPP installs Apache, PHP and MySQL together on the developer's laptop."}}, {"q": {"en": "What does XAMPP stand for?"}, "a": {"en": "X = cross-platform (any OS), Apache, MariaDB/MySQL, PHP, Perl."}}]}, {"title": {"en": "Setup, Syntax and Types"}, "items": [{"q": {"en": "Which folder holds PHP files under XAMPP?"}, "a": {"en": "htdocs (e.g. C:\\xampp\\htdocs); browse them at http://localhost/filename.php."}}, {"q": {"en": "A page shows 404 - likely cause?"}, "a": {"en": "The file is not under htdocs, the name/URL is mistyped, or Apache is not running."}}, {"q": {"en": "How do you embed PHP in an HTML page?"}, "a": {"en": "Wrap code in <?php ... ?> islands anywhere in the page, and save the file with a .php extension."}}, {"q": {"en": "Difference between echo and print?"}, "a": {"en": "echo takes multiple comma-separated values and returns nothing; print takes one value and returns 1, so it can sit in expressions. echo is marginally faster."}}, {"q": {"en": "Which comment styles does PHP support?"}, "a": {"en": "// and # for single lines; /* ... */ for blocks."}}, {"q": {"en": "What rules govern PHP variable names?"}, "a": {"en": "Start with $ then a letter or underscore; case-sensitive; no type declaration needed (loose typing)."}}, {"q": {"en": "List PHP's scalar and compound types."}, "a": {"en": "Scalar: int, float, string, bool. Compound: array, object. Special: NULL and resource."}}, {"q": {"en": "How do you inspect a variable's type and value?"}, "a": {"en": "var_dump($x) shows both; gettype($x) returns the type name."}}, {"q": {"en": "How do you define a constant?"}, "a": {"en": "define(\"GST\", 0.18) or const GST = 0.18; - no $ sign, global, immutable."}}, {"q": {"en": "Double-quoted vs single-quoted strings?"}, "a": {"en": "Double quotes interpolate variables (\"Hi $name\" expands); single quotes treat them literally."}}, {"q": {"en": "Which operator joins two strings?"}, "a": {"en": "The dot: \"Hello \" . $name. .= appends in place."}}]}, {"title": {"en": "Operators and Decisions"}, "items": [{"q": {"en": "Difference between == and ===?"}, "a": {"en": "== compares after type juggling (\"18\" == 18 is true); === also requires the same type. Prefer === with form data."}}, {"q": {"en": "What does the spaceship operator <=> return?"}, "a": {"en": "-1, 0 or 1 for less, equal, greater - made for custom sort comparisons."}}, {"q": {"en": "Structure of an if-elseif-else ladder?"}, "a": {"en": "Conditions tested top-down; the first true branch executes and the rest are skipped; else catches the remainder."}}, {"q": {"en": "Which values are falsy in PHP?"}, "a": {"en": "false, 0, 0.0, \"\" (empty string), \"0\", null, [] (empty array)."}}, {"q": {"en": "When is the ternary operator useful?"}, "a": {"en": "Compact two-way choices inside echo or assignments: ($m >= 40) ? \"Pass\" : \"Fail\"."}}, {"q": {"en": "When would you pick switch over if-elseif?"}, "a": {"en": "When one expression is compared for equality against many constants - day names, menu choices, status codes."}}, {"q": {"en": "What happens if break is omitted in a case?"}, "a": {"en": "Execution falls through into the next case - almost never intended; always end cases with break."}}]}, {"title": {"en": "Loops and Practice"}, "items": [{"q": {"en": "Difference between while and do-while?"}, "a": {"en": "while checks first (may run zero times); do-while runs the body once before checking (minimum one execution)."}}, {"q": {"en": "Which loop is best for arrays?"}, "a": {"en": "foreach - it iterates elements directly: foreach ($arr as $v) or as $k => $v; no counter needed."}}, {"q": {"en": "for vs foreach?"}, "a": {"en": "for needs init/test/step and suits counted ranges; foreach streams array elements with no index bookkeeping."}}, {"q": {"en": "What do break and continue do?"}, "a": {"en": "break exits the loop immediately; continue skips the rest of the current iteration and starts the next."}}, {"q": {"en": "What does break 2 do?"}, "a": {"en": "Exits two levels of nested loops at once."}}, {"q": {"en": "Why is PHP called 'loosely typed'?"}, "a": {"en": "Variables take the type of the value assigned and can change type on reassignment - PHP juggles types automatically in expressions."}}, {"q": {"en": "How do you run a PHP file without a browser?"}, "a": {"en": "With the CLI: php filename.php - useful for logic testing before wiring up forms."}}, {"q": {"en": "What PHP version family do we target?"}, "a": {"en": "PHP 8.x - JIT compiler, modern syntax; all lab programs in these notes were run on PHP 8."}}, {"q": {"en": "What is the URL of a page saved as htdocs/hello.php?"}, "a": {"en": "http://localhost/hello.php - localhost is your own machine, port 80 by default."}}, {"q": {"en": "A .php file shows its source code in the browser - why?"}, "a": {"en": "It was saved as .html (server never invokes PHP), or Apache/PHP handler is off."}}, {"q": {"en": "What is variable interpolation?"}, "a": {"en": "Embedding $variables inside double-quoted strings so their values are substituted - \"Seats: $seats\"."}}, {"q": {"en": "Give three everyday PHP programs from Unit 1."}, "a": {"en": "Welcome page with echo/print; grade ladder with if-elseif; seat-listing loop with continue for booked seats."}}]}], "exam_questions": [{"q": {"en": "Explain the client-server environment and the 3-tier architecture of a web application with a diagram."}, "marks": 4}, {"q": {"en": "Write the history of PHP and any four advantages. Why is it called server-side?"}, "marks": 4}, {"q": {"en": "Describe the steps to install XAMPP and run hello.php on localhost. (Practical 1-2)"}, "marks": 4}, {"q": {"en": "Explain embedding of PHP within HTML with a page that contains two <?php islands."}, "marks": 4}, {"q": {"en": "Write a PHP program for a fare calculator using a constant GST rate, variables and arithmetic operators. (Practical 3)"}, "marks": 6}, {"q": {"en": "Distinguish == and === with var_dump output, explaining why strict comparison matters for form data."}, "marks": 4}, {"q": {"en": "Write a PHP program that prints the grade (Distinction/First/Second/Pass/Fail) for given marks using if-elseif-else. (Practical 4)"}, "marks": 6}, {"q": {"en": "Rewrite a weekday schedule program using switch-case; explain fall-through and the role of break. (Practical 4)"}, "marks": 4}, {"q": {"en": "Write one PHP program demonstrating for, while, do-while and foreach, stating when each loop is preferred. (Practical 5)"}, "marks": 6}, {"q": {"en": "Write a PHP program to print free seats 1-10 skipping booked seats 3 and 7 (continue), then stop a route search at the first 'Navsari' match (break)."}, "marks": 6}, {"q": {"en": "Explain PHP data types with a var_dump table; distinguish variables and constants."}, "marks": 4}, {"q": {"en": "List the operator families of PHP with two examples each, and explain the spaceship operator."}, "marks": 4}]};

    if (m[1]) o += `<span class="cm">${w}</span>`;
    else if (m[2]) o += `<span class="st">${w}</span>`;
    else if (m[3]) o += `<span class="pp">${w}</span>`;
    else if (m[4]) o += PKW.has(m[4]) ? `<span class="kw">${w}</span>` : PTY.has(m[4]) ? `<span class="ty">${w}</span>` : `<span class="fn">${w}</span>`;
    else if (m[5]) o += PKW.has(m[5]) ? `<span class="kw">${w}</span>` : PTY.has(m[5]) ? `<span class="ty">${w}</span>` : w;
    else o += `<span class="nu">${w}</span>`;
  }
  return o + esc(src.slice(last));
}
function hl(src){
  if (META.code_lang === 'python') return hlPy(src);
  const re = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(^[ \t]*#[^\n]*)|([A-Za-z_]\w*)(?=\s*\()|([A-Za-z_]\w*)|(\b\d+(?:\.\d+)?[fFlLuU]*\b)/gm;
  let o='', last=0, m;
  while ((m = re.exec(src))){
    o += esc(src.slice(last, m.index)); last = re.lastIndex;
    const w = esc(m[0]);
    if (m[1]) o += `<span class="cm">${w}</span>`;
    else if (m[2]) o += `<span class="st">${w}</span>`;
    else if (m[3]) o += `<span class="pp">${w}</span>`;
    else if (m[4]) o += KW.has(m[4]) ? `<span class="kw">${w}</span>` : TY.has(m[4]) ? `<span class="ty">${w}</span>` : `<span class="fn">${w}</span>`;
    else if (m[5]) o += KW.has(m[5]) ? `<span class="kw">${w}</span>` : TY.has(m[5]) ? `<span class="ty">${w}</span>` : w;
    else o += `<span class="nu">${w}</span>`;
  }
  return o + esc(src.slice(last));
}
const progBody = p => `<div class="pl">${L('code')}</div><pre class="code">${hl(t(p.code))}</pre><div class="pl">${L('output')}</div><pre class="out">${esc(p.out)}</pre>${p.plot?`<div class="pl">${L('plot')}</div>`+dgInline(p.plot).replace('class="dg"','class="dg pg"'):''}${p.expl?`<div class="pl">${L('expl')}</div>${fixTables(t(p.expl))}`:''}`;
const pBox = id => { const p=(U.programs||[]).find(x=>x.id===id); if(!p) return ''; return `<div class="pbox"><div class="et">${L('prog')}: ${t(p.title)}</div>${progBody(p)}</div>`; };
const exBox = id => { const n=(U.numericals||[]).find(x=>x.id===id); if(!n) return ''; return `<div class="ex"><div class="et">${L('ex')}</div><div class="eq2">${t(n.q)}</div>${fixTables(t(n.a))}</div>`; };
function notes(){
  let h = `<div class="intro"><b>${t(U.title)}</b><div>${L('unit')} ${U.unit} · ${U.weightage}% ${L('intro')} · ${U.hours} ${L('hours')}</div><div>${L(U.programs?(META.code_lang==='python'?'intropy':'introc'):'introd')}</div></div>`;
  U.notes.forEach((sec,si)=>{
    h += `<div class="sec">${head(t(sec.title))}`;
    sec.items.forEach((it,i)=>{
      const open = si===0&&i===0 ? ' open' : '';
      if (it.h) {
        h += `<div class="card${it.key?' key':''}${open}"><div class="q hd"><span class="t">${it.key?'⭐ ':''}${t(it.h)}</span>${chev}</div>
        <div class="a rn" style="padding-left:18px">${fixTables(t(it.body)).replace(/margin:0 0 10px -36px/g,'')}${it.diagram?dgInline(it.diagram):''}${(it.examples||[]).map(exBox).join('')}${(it.programs||[]).map(pBox).join('')}</div></div>`;
      } else {
        h += `<div class="card${open}"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(it.q)}</span>${chev}</div>
        <div class="a">${fixTables(t(it.a))}${it.diagram?dgInline(it.diagram):''}</div></div>`;
      }
    });
    h += `</div>`;
  });
  return h;
}
function numericals(){
  return `<div class="sec">${head(L('numericals'))}` + (U.numericals||[]).map((n,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(n.q)}</span>${chev}</div><div class="a">${fixTables(t(n.a))}</div></div>`).join('') + `</div>`;
}
function diagrams(){
  return `<div class="sec">${head(L(U.programs&&META.code_lang!=='python'?'flowcharts':'diagrams'),false)}<div style="height:10px"></div>` + U.diagrams.map((d,i)=>
    `<div class="dcard" data-dg="${d.id}"><div class="h">${i+1}. ${t(d.title)}</div>${SVG[d.id]}</div>`).join('') + `</div>`;
}
function equations(){
  return U.equations.map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><span class="fbox">${e.f}</span></span>${chev}</div>
     <div class="a"><p>${t(e.terms)}</p></div></div>`).join('') + `</div>`).join('');
}
function viva(){
  return U.viva.map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((v,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(v.q)}</span>${chev}</div><div class="a"><p>${t(v.a)}</p></div></div>`).join('') + `</div>`).join('');
}
function exam(){
  return `<div class="sec">${head(L('examhead'),false)}` + U.exam_questions.map((x,i)=>
    `<div class="card"><div class="q" style="cursor:default"><span class="n">${i+1}.</span><span class="t">${t(x.q)}</span><span class="mk">${x.marks} ${L('marks')}</span></div></div>`).join('') + `</div>`;
}
function programs(){
  return `<div class="sec">${head(L('programs'))}` + (U.programs||[]).map((p,i)=>
    `<div class="card"><div class="q hd"><span class="n">${i+1}.</span><span class="t">${t(p.title)}</span>${chev}</div><div class="a pa">${progBody(p)}</div></div>`).join('') + `</div>`;
}
function syntax(key){
  return (U[typeof key==='string'?key:'syntax']||[]).map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><pre class="code sx">${hl(e.f)}</pre></span>${chev}</div>
     <div class="a">${e.terms && t(e.terms) ? fixTables(t(e.terms)) : ''}</div></div>`).join('') + `</div>`).join('');
}
const flowcharts = diagrams;
const algorithms = () => syntax('algorithms');
const ALLV = {notes, programs, diagrams, flowcharts, algorithms, syntax, equations, numericals, viva, exam};
const VIEWS = U.tabs ? Object.fromEntries(U.tabs.map(k=>[k, ALLV[k]])) : U.programs ? (META.code_lang==='python' ? {notes, programs, diagrams, syntax, viva, exam} : {notes, programs, flowcharts, syntax, viva, exam}) : U.numericals ? {notes, diagrams, equations, numericals, viva, exam} : {notes, diagrams, equations, viva, exam};
function render(){
  document.getElementById('title').textContent = `${L('unit')} ${U.unit}: ${t(U.title)}`;
  document.getElementById('sub').textContent = `${t(META.name)} · ${META.code}`;
  document.getElementById('lang').textContent = S.lang==='en' ? 'ગુ' : 'EN';
  document.getElementById('lang').style.display = META.languages.includes('gu') ? '' : 'none';
  document.getElementById('tabs').innerHTML = Object.keys(VIEWS).map(k=>`<button class="tab${S.tab===k?' on':''}" data-tab="${k}">${L(k)}</button>`).join('');
  document.getElementById('view').innerHTML = VIEWS[S.tab]();
  document.querySelectorAll('#view pre.c').forEach(e=>{ e.innerHTML = hl(e.textContent); e.className='code'; });
}
let zoom = 1;
function setZoom(z){ zoom = Math.min(4, Math.max(1, z)); const w=document.getElementById('zw'); w.style.width=(zoom*100)+'%'; document.getElementById('zr').textContent=Math.round(zoom*100)+'%'; }
document.addEventListener('click', e=>{
  const q = e.target.closest('.q'); if (q && q.parentElement.querySelector('.a')) { q.parentElement.classList.toggle('open'); return; }
  const tb = e.target.closest('[data-tab]'); if (tb){ S.tab = tb.dataset.tab; render(); window.scrollTo(0,0); return; }
  if (e.target.closest('#lang')){ S.lang = S.lang==='en'?'gu':'en'; render(); return; }
  const m = e.target.closest('[data-more]');
  document.querySelectorAll('.menu.show').forEach(x=>{ if(!m || x!==m.nextElementSibling) x.classList.remove('show'); });
  if (m){ m.nextElementSibling.classList.toggle('show'); return; }
  const act = e.target.closest('[data-act]');
  if (act){ act.closest('.sec').querySelectorAll('.card').forEach(c=>{ if(c.querySelector('.a')) c.classList.toggle('open', act.dataset.act==='expand'); }); act.parentElement.classList.remove('show'); return; }
  const dg = e.target.closest('[data-dg]');
  if (dg){ const id=dg.dataset.dg; document.getElementById('mt').textContent=t(U.diagrams.find(d=>d.id===id).title); document.getElementById('zw').innerHTML=SVG[id]; setZoom(1); document.getElementById('modal').classList.add('show'); return; }
  if (e.target.closest('#mx')) document.getElementById('modal').classList.remove('show');
  if (e.target.closest('#zi')) setZoom(zoom+0.5);
  if (e.target.closest('#zo')) setZoom(zoom-0.5);
  if (e.target.closest('#zr')) setZoom(1);
});
render();
</script></body></html>
