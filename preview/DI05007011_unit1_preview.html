<script>
const U = {"subject": "DI05007011", "unit": 1, "format": "notes", "title": {"en": "Core Components of PC/Laptop"}, "hours": 7, "weightage": 16, "tabs": ["notes", "programs", "diagrams", "syntax", "viva", "exam"], "intro_text": {"en": "English-only,diagram-focused Unit 1:computer development/types,PC functional blocks,CPU/board/memory/storage/I/O/power,hardware/software/firmware,BIOS/UEFI/CMOS,laptop components,ports/connectors and dated specifications. Four executed software helpers support worksheets;physical Practicals1/4 are guided only,not fabricated hardware/electrical/BIOS work. Original practice marks are suggested,not official GTU allocations."}, "notes": [{"title": {"en": "1. Computer Systems and Development"}, "items": [{"h": {"en": "1.1 Computer systems,IPO and PC development"}, "body": {"en": "<p>A computer system accepts <b>input</b>, processes instructions/data, retains working/persistent information and produces <b>output</b>. Hardware, software,firmware and the user’s task work together; a system is not only its CPU.</p><ul><li>Personal computers brought programmable computing to individual users. IBM introduced the IBM 5150 Personal Computer in August 1981; it was an influential PC standard, <b>not the first personal computer ever</b>.</li><li>PC development includes more integration, memory/storage capacity, graphical/networked use, portable systems and specialized workloads. Do not assume each new generation is faster for every task merely from clock speed.</li><li>A desktop may use separate display/keyboard/power components; a laptop integrates many into one portable device. Form factor and integration affect servicing and upgrade options.</li><li>This unit identifies roles and interfaces. Detailed 8085 architecture/buses belong to Unit 2; detailed memory/storage to Unit 3; peripheral working principles to Unit 4 and troubleshooting/assembly to Unit 5.</li></ul>"}}, {"h": {"en": "1.2 Types of computers:use,scale and deployment are different axes"}, "body": {"en": "<table><tr><th>Syllabus type</th><th>Idea / example context</th><th>Important distinction</th></tr><tr><td>Microcomputer</td><td>Personal computing built around microprocessor-based processing;desktop/laptop examples.</td><td>A workstation can also be a microcomputer;categories may overlap.</td></tr><tr><td>Minicomputer</td><td>Historical midrange/multiuser computer category.</td><td>Not the same as a modern small-form-factor miniPC or a product named Mac mini.</td></tr><tr><td>Mainframe</td><td>Enterprise multiuser/transaction and reliability-oriented computing.</td><td>Not defined simply as a physically large box or the fastest scientific computer.</td></tr><tr><td>Supercomputer</td><td>Large-scale parallel/high-performance computing for suitable computational workloads.</td><td>Application/workload and architecture matter,not just cabinet size.</td></tr><tr><td>Workstation</td><td>Professional/technical personal system for suitable engineering/creative/scientific work.</td><td>A role/capability category,not automatically a separate size tier.</td></tr><tr><td>Cloud</td><td>Access/deployment model for remotely provided computing resources/services.</td><td>Uses underlying physical hardware;not a single CPU class or a replacement for all local devices.</td></tr><tr><td>Embedded system</td><td>Computing integrated into a device for particular functions.</td><td>May use a microcontroller/SoC and need not look like a desktop or run a general-purpose desktop OS.</td></tr></table><p>Do not arrange every row as one mutually exclusive “smallest to largest” ladder. A cloud-hosted resource can use server-class hardware,and a professional workstation can have a desktop form factor.</p>"}, "diagram": "hw1_types"}]}, {"title": {"en": "2. PC Block Diagram and Core Components"}, "items": [{"h": {"en": "2.1 The PC block diagram"}, "body": {"en": "<p>Read the diagram as <b>functional relationships</b>,not an exact wiring/pinout or a measured board. Input devices supply data/control; CPU executes operations; RAM holds active working state; persistent storage retains programs/files; output devices present results.</p><ul><li>The motherboard/interconnects allow components to communicate;device controllers and firmware/OS software also participate.</li><li>Storage data is typically brought into working memory when used. RAM and a storage drive are different resources.</li><li>Power delivery supports the components,not the logical data path. A CPU alone cannot supply power,display a result or store every persistent file.</li><li>Modern integration varies:memory controllers,graphics or other functions may share a CPU/SoC package. The conceptual blocks need not be separate removable chips.</li></ul>"}, "diagram": "hw1_block"}, {"h": {"en": "2.2 CPU:ALU,Control Unit and internal state"}, "body": {"en": "<p>The <b>central processing unit (CPU)</b> executes instructions. A simplified teaching view includes:</p><table><tr><th>Part</th><th>Role</th></tr><tr><td>Arithmetic Logic Unit (ALU)</td><td>Performs relevant arithmetic and logical operations under the instruction/control design.</td></tr><tr><td>Control Unit (CU)</td><td>Coordinates instruction/control sequencing and signals needed for operations.</td></tr><tr><td>Registers/internal state</td><td>Fast internal storage used while executing instructions;not the same as the installed RAM capacity.</td></tr></table><p>Fetch/decode/execute is a useful simplified cycle,not a complete description of every modern pipeline. A core count,clock number or brand name alone is not a universal performance score. The ALU/CU are functional parts of processing,not parts a student removes from a CPU package.</p>"}, "diagram": "hw1_cpu"}, {"h": {"en": "2.3 Motherboard and component interconnection"}, "body": {"en": "<p>The <b>motherboard / system board</b> is the main circuit board interconnecting/supporting system components. A typical modular desktop may expose a CPU socket,RAM slots,firmware storage,expansion connectors,storage interfaces,power connectors and rear/front-I/O connections.</p><ul><li>Actual layouts differ by model/form factor. Do not identify a connector solely by approximate position in a generic drawing.</li><li>A laptop/compact system may integrate/solder CPU or memory instead of offering ordinary desktop sockets/slots. Do not assume a component is removable or upgradeable.</li><li>A chipset/controller supports relevant I/O/connectivity;historical northbridge/southbridge and bus details are studied in Unit 2. Modern integration does not always follow that old two-chip layout.</li><li>Our labelled board drawing is a schematic role map,not a photograph,service manual or proof that an actual motherboard was handled.</li></ul>"}, "diagram": "hw1_board"}, {"h": {"en": "2.4 RAM,ROM and persistent HDD/SSD storage"}, "body": {"en": "<table><tr><th>Component</th><th>Purpose</th><th>Persistence / common trap</th></tr><tr><td>RAM</td><td>Active program/data workspace.</td><td>Ordinary system RAM is volatile;power-off loses its active contents. More RAM is not more SSD capacity.</td></tr><tr><td>ROM/nonvolatile firmware storage</td><td>Retain suitable low-level code/data.</td><td>ROM is a historical/read-only category;modern firmware often resides in updateable flash. Do not conclude all firmware can never change.</td></tr><tr><td>HDD</td><td>Persistent storage using rotating magnetic media and mechanisms.</td><td>Not the same working resource as RAM;internal mechanisms are not opened in this exercise.</td></tr><tr><td>SSD</td><td>Persistent solid-state storage,commonly flash-based.</td><td>SSDs have different interfaces/form factors;not every SSD is NVMe or an interchangeable module.</td></tr></table><p>SATA and NVMe are not synonyms;M.2 is a form-factor/connector family rather than a guarantee of one protocol. A common M.2 NVMe module plugs into a suitable slot instead of needing a SATA-style data cable. RAID describes a storage arrangement,not an interface. These distinctions are developed further in Units2/3.</p>"}}, {"h": {"en": "2.5 Keyboard,mouse and monitor as system I/O"}, "body": {"en": "<p>A <b>keyboard</b> supplies key events; a <b>mouse/pointing device</b> supplies pointing/button information. The device/controller and OS interpret those inputs;an unresponsive app is not automatically proof of a broken peripheral.</p><p>A <b>monitor/display</b> presents visual output through an appropriate graphics/display path. In common PC terminology,an “LED monitor” is often an <b>LED-backlit LCD</b>,not automatically a direct-emissive LED or OLED panel. LCD/LED construction/operation is studied in Unit 4.</p><ul><li>A desktop may require external keyboard/mouse/display; laptops typically integrate keyboard/pointing/display while also supporting appropriate external devices.</li><li>Check the actual connector,signal support,cable,display input and settings rather than forcing a plug or assuming every similar socket provides video.</li></ul>"}}, {"h": {"en": "2.6 SMPS,laptop adapter/battery and safe power concepts"}, "body": {"en": "<p>A desktop <b>switched-mode power supply (SMPS)</b> converts suitable input power into regulated outputs required by the system. It is not RAM,storage or a data connector. Laptop power commonly involves an appropriate external adapter/charging circuitry and a battery.</p><ul><li>Power ratings,connector compatibility and charging protocols must match the manufacturer’s requirements. A same-shaped plug does not establish electrical compatibility.</li><li>Disconnect appropriate power sources before authorized internal identification;internal batteries require model-specific service instructions. Do not improvise mains/grounding connections.</li><li><b>Never open an SMPS/charger/monitor enclosure or probe mains/internal high-voltage circuitry for this unit.</b> Hazardous stored charge may remain after unplugging;refer such work to qualified service personnel.</li><li>Stop if batteries are swollen,leaking,damaged or hot abnormally;do not bend,puncture,short terminals or continue using a damaged pack.</li><li>No voltage measurement,power-supply repair,battery removal or physical component handling is executed in this sandbox.</li></ul>"}}]}, {"title": {"en": "3. Hardware,Software,Firmware and Startup"}, "items": [{"h": {"en": "3.1 Hardware versus software versus firmware"}, "body": {"en": "<table><tr><th>Term</th><th>Meaning</th><th>Example</th></tr><tr><td>Hardware</td><td>Physical electronic/mechanical components.</td><td>CPU package,RAM module,system board,keyboard,storage drive.</td></tr><tr><td>Software</td><td>Instructions/programs and associated data used by the system.</td><td>OS,drivers,applications.</td></tr><tr><td>Firmware</td><td>Software for low-level device/platform functions,typically stored in nonvolatile memory.</td><td>Platform startup firmware or device-controller firmware.</td></tr></table><p>The flash chip is hardware;the firmware contents are software. Firmware may be updateable through a manufacturer-supported process,but this unit does not flash,reset or modify firmware. A driver generally operates with the OS and is not interchangeable with the device’s firmware.</p>"}, "diagram": "hw1_layers"}, {"h": {"en": "3.2 BIOS and UEFI concepts"}, "body": {"en": "<p><b>Legacy BIOS</b> is rooted in older PC platform-firmware conventions. <b>UEFI</b>(Unified Extensible Firmware Interface) defines interfaces between platform firmware,the OS loader and suitable pre-boot services. It is not simply a prettier BIOS setup screen.</p><ul><li>Firmware initializes relevant platform hardware and participates in transferring control to the OS boot process. Setup menus/features vary by manufacturer and platform.</li><li>UEFI supports different architectures;an example using Apple Silicon/macOS must not be assumed to have the same Windows x86 setup screens or servicing workflow.</li><li>Secure Boot is a related verification feature under platform policy,not proof that all software/firmware is safe. Do not disable it or change TPM/boot/security settings for this identification unit.</li><li>BIOS/UEFI observation is guided/read-only only. No BIOS screen is accessed,firmware version measured,setting changed or update performed here.</li></ul>"}, "diagram": "hw1_firmware"}, {"h": {"en": "3.3 CMOS,RTC battery and nonvolatile settings are not the firmware program"}, "body": {"en": "<p><b>CMOS</b> names a semiconductor technology and,in traditional PC vocabulary,the small battery-backed configuration-memory context. The <b>real-time clock (RTC)</b> and its backup battery are related but are not the BIOS/UEFI program itself.</p><ul><li>Platform firmware code commonly resides in nonvolatile flash. Modern settings may use NVRAM;not every system stores all settings in one classic battery-backed CMOS arrangement.</li><li>The coin-cell/RTC battery is not the laptop’s main operating battery and does not power the full RAM/SSD when a machine is switched off.</li><li>Removing a battery does not universally erase firmware,reset every setting or solve all faults. Procedures differ by model and can affect startup/security state.</li><li>No CMOS clear,jumper/password reset,battery removal or NVRAM/TPM change is assigned/executed. Follow a specific authorized service procedure only when relevant later.</li></ul>"}}]}, {"title": {"en": "4. Laptop Components and External Identification"}, "items": [{"h": {"en": "4.1 Laptop core board,memory,expansion and storage"}, "body": {"en": "<p>A laptop integrates core processing and interfaces into a portable assembly. Identify roles using the exact model/service manual rather than assuming a universal internal layout.</p><table><tr><th>Syllabus component</th><th>Role / variation</th></tr><tr><td>CPU / system board</td><td>Executes/control-supports processing;may be integrated rather than socket-replaceable.</td></tr><tr><td>Memory (RAM)</td><td>Working state;may be slot-based,soldered or unified/integrated. Do not infer upgradeability from the capacity label.</td></tr><tr><td>Expansion slots/interfaces</td><td>Provide supported extra functions where implemented;not every laptop has every desktop expansion option.</td></tr><tr><td>Internal storage</td><td>Persistent HDD/SSD or integrated storage,depending on model.</td></tr><tr><td>Removable-media drive/support</td><td>Optical/removable readers may be absent,external or model-dependent;absence is not automatically a fault.</td></tr><tr><td>Power supply/battery</td><td>Appropriate adapter,charging circuitry and main battery support operation;not interchangeable with the RTC cell.</td></tr></table><p>The supplied Apple profiles illustrate modern integration,not instructions to remove memory or storage modules. No laptop has been opened or serviced here.</p>"}, "diagram": "hw1_laptop"}, {"h": {"en": "4.2 Laptop video,input,cooling,audio,camera and wireless"}, "body": {"en": "<table><tr><th>Component group</th><th>Function / caution</th></tr><tr><td>Video display controller/GPU and display</td><td>Generate/drive visual output;graphics may be integrated,discrete or part of a SoC.</td></tr><tr><td>Input</td><td>Integrated keyboard/touchpad and supported external input interfaces.</td></tr><tr><td>Ports</td><td>External physical connections;their capabilities depend on the actual implementation.</td></tr><tr><td>Cooling:fan/heat sink/thermal path</td><td>Transfers heat;many systems use fans,but some designs are fanless. Do not block vents or assume every model has a replaceable fan.</td></tr><tr><td>Speakers,webcam and microphones</td><td>Audio/video input/output;privacy,drivers and permissions can affect operation.</td></tr><tr><td>Wireless module:Wi-Fi/Bluetooth</td><td>Wireless connectivity through suitable radios/antennas/OS support;may be integrated or separately serviceable.</td></tr></table><p>A webcam not working may involve software permissions,not necessarily a failed physical part. A cooling diagram is a concept illustration,not a thermal measurement or instruction to dismantle a powered device.</p>"}}, {"h": {"en": "4.3 Front/back panels:ports and matching connectors"}, "body": {"en": "<p>A <b>port</b> is the device-side connection point;the <b>connector</b> is the matching cable/device plug arrangement. Desktop front/back and laptop-side positions vary. Use markings and the exact manual;drawn shapes here are simplified recognition aids,not electrical pinouts.</p><table><tr><th>Port/connector</th><th>Typical purpose</th><th>Do not assume</th></tr><tr><td>USB(Type-A/Type-C and other variants)</td><td>Supported peripherals/data and,where implemented,appropriate power/display modes.</td><td>Connector shape alone does not determine USB version,charging or video.</td></tr><tr><td>HDMI</td><td>Supported digital display/audio connection.</td><td>A mechanically fitting cable guarantees every resolution/refresh feature.</td></tr><tr><td>RJ45-style Ethernet(8P8C)</td><td>Common wired Ethernet connection.</td><td>It is a telephone/RJ11 jack or that physical link proves Internet access.</td></tr><tr><td>3.5mm audio jack</td><td>Supported headphones/speakers/microphone or combined analog role.</td><td>Every jack has the same TRS/TRRS/microphone function.</td></tr><tr><td>VGA(DE-15)</td><td>Traditional analog video connection.</td><td>It carries HDMI-style digital audio/video features.</td></tr><tr><td>Thunderbolt</td><td>Supported high-speed data/video/expansion functions under the relevant standard.</td><td>All same-shaped USB-C or Mini DisplayPort sockets are Thunderbolt.</td></tr></table><p>Never force a connector,insert tools into contacts/vents or test an unknown power connection by trial. Inspect external labels/manufacturer documentation before connecting an appropriate device.</p>"}, "diagram": "hw1_ports"}, {"h": {"en": "4.4 USB-C versus USB/Thunderbolt capabilities"}, "body": {"en": "<p><b>USB-C is a connector form</b>. USB data protocols,DisplayPort alternate modes,Power Delivery and Thunderbolt are capability/standard questions that require compatible implementations and cables—not merely that form.</p><ul><li>Thunderbolt 1/2 used a Mini DisplayPort-style connector;Thunderbolt 3/4/5 use USB-C. An identical outline alone is not identification of the protocol.</li><li>Power Delivery is negotiated under compatible source/sink/cable capabilities. Do not infer universal charging wattage or video from a USB-C socket.</li><li>The actual Mac mini reference distinguishes front USB-C/USB 3 data ports from rear Thunderbolt 4(USB-C) ports;the page/support guide directs display connections to appropriate rear Thunderbolt/HDMI ports. Do not combine unlike ports into one guaranteed feature list.</li><li>The software exercise compares explicitly fictional USB-C profiles to show how declared video support can differ. It probes no hardware and performs no PD/cable/Thunderbolt certification.</li><li>Published interface rates are not measured application file-transfer performance;the complete host/cable/device/path and workload matter.</li></ul>"}, "diagram": "hw1_usb", "programs": ["hw1p03"]}]}, {"title": {"en": "5. Dated Specifications and Safe Practical Work"}, "items": [{"h": {"en": "5.1 Prepare a current specification:dated manufacturer-listed examples"}, "body": {"en": "<p>For a “latest” specification exercise,record the <b>exact model/configuration,source and check date</b>. The two profiles below were checked against the first/base columns of official manufacturer pages on <b>29 October 2026</b>. They are dated educational references,not a claim of globally newest hardware,local stock/price,purchasing suitability,upgrade compatibility or measured performance.</p><table><tr><th>Field</th><th>Laptop reference</th><th>Desktop reference</th></tr><tr><td>Selected configuration</td><td>MacBook Air 13-inch M5,first/base column</td><td>Mac mini M6,first/base column—not M5 Pro</td></tr><tr><td>Processor/GPU</td><td>M5: 10-core CPU,8-core integrated GPU</td><td>M6: 12-core CPU,12-core integrated GPU</td></tr><tr><td>Memory/storage</td><td>16GB unified memory;512 GB SSD</td><td>16GB unified memory;256GB SSD</td></tr><tr><td>Display</td><td>13.6-inch LED-backlit IPS,2560×1664</td><td>External display;no built-in panel</td></tr><tr><td>Ports</td><td>2 Thunderbolt 4(USB-C),MagSafe3,3.5mm headphone</td><td>Front: 2 USB-C/USB 3 and 3.5mm;rear: 3 Thunderbolt 4,HDMI,2.5Gb Ethernet</td></tr><tr><td>Connectivity/OS</td><td>Wi-Fi 7,Bluetooth 6;macOS</td><td>Wi-Fi 7,Bluetooth 6,2.5Gb Ethernet;macOS</td></tr></table><p><b>Platform boundary:</b> these are Apple Silicon/macOS examples,not a Windows x86 BIOS/assembly guide. Unified-memory labels do not mean removable DIMMs. Choose your own authorized Windows/Linux/OEM system if that is your class bench,and verify its exact documentation.</p><p>The syllabus’s 13th-generation Core i5/16GB DDR4/512 GB/Windows 11 laptop is an <b>illustrative sample</b>,not automatically the newest configuration in October 2026. Do not mix base and upgraded columns or the largest advertised RAM/storage options into a false single model.</p>"}, "diagram": "hw1_specs"}, {"h": {"en": "5.2 Four tested software helpers and the specification worksheet"}, "body": {"en": "<p>The supporting programs are <b>software-only</b>,not physical practical evidence:</p><ul><li><b>Read-only sandbox inventory:</b> generic OS/kernel architecture,logical CPU count and exposed Linux MemTotal. These do not identify the learner’s physical laptop,installed DIMMs,ports or firmware mode.</li><li><b>Unit arithmetic:</b>16 GiB=17,179,869,184 bytes;512 decimal GB≈476.837 GiB. This is not measured formatted capacity or proof that a real drive lost space.</li><li><b>Connector fixture:</b> same USB-C shape can accompany different declared video support;charging remains unspecified in the fictional rows.</li><li><b>Specification completeness:</b> verify CPU,RAM,storage,GPU,display,ports,connectivity,OS and source/date fields are filled. Completeness is not accuracy,compatibility or benchmark proof.</li></ul><p>Use the CSV specification sheet for your own evidence. Report <b>not observed / unknown</b> rather than guessing. Manufacturer webpages can change;use the recorded date and update/verify sources for new work. No serial numbers,network MACs,hostnames,personal accounts or private records are needed in a shared student report.</p>"}, "programs": ["hw1p01", "hw1p02", "hw1p03", "hw1p04"]}, {"h": {"en": "5.3 Practicals 1 and4:guided physical identification and safe reporting"}, "body": {"en": "<p><b>Practical 1:</b> identify internal desktop components/functions. <b>Practical 4:</b> identify front/back-panel ports/functions. The supplied observation guides/CSV sheets are <b>guided-only</b>;no physical PC/laptop,BIOS screen,electrical output or component insertion/removal was actually inspected/tested here.</p><ul><li>Use an owned/instructor-authorized device,its exact service manual and appropriate trained supervision. Save work,shut down and isolate the specified power sources before authorized internal work. Handle internal batteries only as the model/instructor permits.</li><li>Use an instructor-approved ESD-safe work area/grounding procedure;handle parts by edges and avoid touching contacts. Do not improvise connections to mains earth or powered equipment.</li><li>Do not open the SMPS/charger/monitor case,probe hazardous circuitry,short pins/terminals,clear firmware/passwords or change Secure Boot/TPM settings in this unit. Stop for damaged/swollen batteries or unsafe conditions.</li><li>Classify evidence as manufacturer documentation,read-only software observation or actual supervised physical observation. A sandbox result or schematic is not a substitute relabelled as hands-on work.</li><li><b>Assessment:</b>theory 70+30 and practical 20+30=150. Unit 1 is 7 hours/16% syllabus weight,not guaranteed question marks. The 16 answered questions use visibly suggested 3/4/7-mark revision sizes,not official GTU papers or predictions.</li></ul><p><b>References:</b> <a href=\"https://s3-ap-southeast-1.amazonaws.com/gtusitecirculars/Syallbus/DI05007011.pdf\">GTU DI05007011 syllabus,2026–27</a>, <a href=\"https://www.ibm.com/history/personal-computer\">IBM history:the IBM 5150 PC (August 1981)</a>, <a href=\"https://uefi.org/faq\">UEFI Forum:UEFI and legacy BIOS concepts</a>, <a href=\"https://www.usb.org/usb-charger-pd\">USB-IF:USB Power Delivery and negotiated capability</a>, <a href=\"https://www.intel.com/content/www/us/en/architecture-and-technology/thunderbolt/thunderbolt-4-vs-usb-c.html\">Intel:Thunderbolt 4 versus USB-C (protocol versus shape)</a>, <a href=\"https://support.apple.com/en-us/109523\">Apple:identify ports,including older/newer Thunderbolt connectors</a>, <a href=\"https://www.apple.com/macbook-air/specs/\">Apple MacBook Air technical specifications (dated reference)</a>, <a href=\"https://www.apple.com/mac-mini/specs/\">Apple Mac mini technical specifications (dated reference)</a>, <a href=\"https://www.dell.com/support/kbdoc/en-us/000137973/safety-precautions-when-working-with-electrical-equipment\">Dell:electrical/ESD safety and model-specific service-manual precautions</a>, <a href=\"https://www.dell.com/support/kbdoc/en-us/000124377/how-to-perform-a-bios-or-cmos-reset-and-clear-the-nvram-on-dell-systems\">Dell:BIOS/CMOS/NVRAM background (concepts only;no reset procedure is assigned)</a>. Explanations and schematics are original. Manufacturer pages support stated dated examples,not an endorsement or an assertion that devices were purchased/handled.</p>"}, "diagram": "hw1_safety"}]}, {"title": {"en": "6. Answered Exam-Style Practice — Suggested Marks Only"}, "role": "practice", "items": [{"h": {"en": "Practice 1. Define a computer system and explain input,processing,storage and output."}, "body": {"en": "<p>A computer system accepts input,executes instructions on data,retains working/persistent information and produces output. Keyboard/mouse are input examples;CPU executes operations,RAM holds active workspace,HDD/SSD retain files,and a monitor presents output. Hardware,software,firmware,power and interconnection work together. The functional diagram is not a literal wiring layout and the CPU alone is not the full computer.</p>"}}, {"h": {"en": "Practice 2. Explain PC development and distinguish the seven syllabus computer categories."}, "body": {"en": "<p>The IBM 5150 PC introduced in August 1981 was influential but not the first personal computer. Later systems grew in integration,portability and connectivity. Microcomputer is a personal microprocessor-based category;minicomputer is historical midrange/multiuser;mainframe emphasizes enterprise transactions/reliability;supercomputer targets suitable large-scale parallel computation;workstation is a professional/technical role;cloud is a remote service/deployment model;embedded computing is integrated for particular functions. These are overlapping axes,not one exclusive smallest-to-largest ladder. A modern miniPC is not automatically a historical minicomputer.</p>"}}, {"h": {"en": "Practice 3. Draw a PC block diagram and explain the main components."}, "body": {"en": "<p>Show input→CPU processing with working memory↔persistent storage and output,with motherboard/interconnect and suitable power support. CPU includes simplified ALU/control/register roles;RAM holds active state;nonvolatile firmware/storage retain suitable code/data;controllers support I/O. Label keyboard,mouse,monitor and HDD/SSD as examples. Explain that modern integration varies and blocks may not be separate removable devices. A schematic is not actual board-location or electrical-test evidence.</p>"}}, {"h": {"en": "Practice 4. Differentiate ALU,Control Unit and registers."}, "body": {"en": "<p>ALU performs arithmetic/logical operations;CU coordinates relevant instruction/control sequencing;registers/internal state provide fast working values within processing. Fetch/decode/execute is a simplified teaching model rather than every detail of a modern pipeline. None is a separate replaceable classroom part inside a packaged CPU. Core count,clock and brand alone are not universal performance scores.</p>"}}, {"h": {"en": "Practice 5. Explain the motherboard and why a generic layout cannot establish upgradeability."}, "body": {"en": "<p>The motherboard/system board interconnects/supports CPU,memory,firmware,I/O,storage,power and expansion functions. A modular desktop may have visible sockets/slots;some laptops/compact systems integrate or solder components. Locations and capabilities differ by exact model/form factor. Check the specific service manual and supported parts. A generic drawing or capacity label cannot prove a module is removable/compatible or that an upgrade was performed.</p>"}}, {"h": {"en": "Practice 6. Compare RAM,ROM/firmware storage,HDD and SSD."}, "body": {"en": "<p>Ordinary RAM is volatile active workspace. ROM/nonvolatile firmware storage retains suitable low-level code/data;modern firmware can use updateable flash. HDD stores persistent data with rotating magnetic media;SSD provides persistent solid-state storage with different interfaces/form factors. RAM capacity is not SSD capacity. SATA and NVMe are not synonyms,M.2 is not a guaranteed protocol,and RAID is an arrangement rather than an interface. No physical drive/RAM measurement is claimed by the units exercise.</p>"}}, {"h": {"en": "Practice 7. Differentiate hardware,software and firmware with examples."}, "body": {"en": "<p>Hardware is physical components,such as a flash chip,RAM or system board. Software includes OS/drivers/apps and associated instructions/data. Firmware is software for low-level device/platform functions,typically in nonvolatile memory. A chip is hardware;its firmware contents are software. A driver is not interchangeable with device firmware. Firmware can be updateable,but no flash/reset/change is performed in this introductory unit.</p>"}}, {"h": {"en": "Practice 8. Compare legacy BIOS and UEFI without treating UEFI as just a graphical menu."}, "body": {"en": "<p>Legacy BIOS follows older PC-firmware conventions. UEFI defines standard interfaces/tables/services between platform firmware and OS loaders/pre-boot functions across supported architectures. Implementations initialize relevant hardware and participate in booting;setup screens vary. Secure Boot is a related policy-dependent verification feature,not a guarantee of total safety. The Apple Silicon examples are not a Windows x86 setup guide. No BIOS/UEFI screen,setting update or security bypass is executed here.</p>"}}, {"h": {"en": "Practice 9. Explain CMOS,RTC battery,firmware flash and modern settings storage."}, "body": {"en": "<p>CMOS is a semiconductor term and a traditional PC configuration-memory context. RTC and its backup battery are related to keeping time/configuration in the relevant design,not the BIOS program itself. Firmware code often resides in nonvolatile flash;modern settings may use NVRAM. The RTC coin cell is not the laptop’s operating battery and does not preserve all RAM contents. Battery removal does not universally erase firmware/reset every setting;no clear/jumper/password/TPM operation is assigned.</p>"}}, {"h": {"en": "Practice 10. Identify the core components of a laptop and their model-dependent nature."}, "body": {"en": "<p>Cover CPU/system board,RAM,expansion support,main battery/power circuitry,video controller/GPU/display,internal storage,optional removable drives,input devices,external ports,cooling,speakers/webcam and Wi-Fi/Bluetooth. Some functions are integrated/soldered,an optical drive may be absent and some cooling designs are fanless. Do not infer replacement/upgrade paths from a generic image. Use the exact model/service manual under appropriate authorization/supervision;no physical servicing is claimed.</p>"}}, {"h": {"en": "Practice 11. Explain laptop input/output,wireless,cooling and power precautions."}, "body": {"en": "<p>Keyboard/touchpad provide input;GPU/display and speakers/camera/microphone support I/O;Wi-Fi/Bluetooth provide relevant wireless functions. A failure may involve permissions/drivers,not necessarily broken hardware. Cooling needs suitable airflow/thermal design;do not block vents or insert objects. Use correct manufacturer power requirements and stop for unsafe/swollen batteries. Never open a PSU/charger/monitor enclosure or probe mains/high-voltage circuits for this identification lesson.</p>"}}, {"h": {"en": "Practice 12. Compare USB,HDMI,RJ45-style Ethernet,audio,VGA and Thunderbolt ports."}, "body": {"en": "<p>USB supports implemented peripheral/data/power modes;HDMI supports appropriate digital display/audio;8P8C commonly called RJ45 serves wired Ethernet;3.5mm jacks have model-dependent analog headphone/mic roles;VGA(DE-15) is traditional analog video;Thunderbolt supports defined data/video/expansion capability. Positions and features vary. Verify the matching connector,markings,model and cable;do not force plugs or infer protocol/electrical compatibility solely from outline. Drawn shapes are recognition aids,not pinouts.</p>"}}, {"h": {"en": "Practice 13. Explain why USB-C shape does not guarantee video,charging or Thunderbolt."}, "body": {"en": "<p>USB-C is a connector form,while USB/Thunderbolt/data,alternate display modes and negotiated Power Delivery are capability questions involving host,cable and device. Thunderbolt 1/2 used Mini DisplayPort-style connectors;3/4/5 use USB-C,so shape alone is insufficient. The fictional profile model demonstrates different declared video support with charging unspecified;it performs no port/cable/PD test. Mac mini front USB 3 and rear Thunderbolt 4 descriptions must not be mixed into a universal feature list. Published rates are not measured file-transfer results.</p>"}}, {"h": {"en": "Practice 14. Prepare a defensible current PC/laptop specification sheet."}, "body": {"en": "<p>Record exact model/configuration and CPU,RAM/storage,GPU,display,ports,connectivity,OS,source URL/check date and evidence scope. Use current official model-specific data and appropriate authorized observations,marking unknowns rather than guessing. Do not merge base and upgrade columns. The29Oct2026 MacBook Air M5/Mac mini M6 first/base examples are dated manufacturer-listed Apple Silicon/macOS profiles,not worldwide-newest,Indian stock/price,physical-device,upgrade or benchmark guarantees. The syllabus13th-gen i5 sample is illustrative,not automatically latest.</p>"}}, {"h": {"en": "Practice 15. Compute 16 GiB in bytes and convert 512 decimal GB to GiB."}, "body": {"en": "<p>1 GiB=2^30=1,073,741,824 bytes,so 16 GiB=17,179,869,184 bytes.512 decimal GB=512×10^9 bytes;divide by 2^30 to obtain approximately476.837 GiB. This difference is units,not automatic proof of missing storage;formatted usable capacity also depends on filesystem/reserved areas. The calculation does not measure an installed RAM module/drive or define every manufacturer memory label.</p>"}}, {"h": {"en": "Practice 16. State safe identification and evidence boundaries for Practicals 1 and4."}, "body": {"en": "<p>Use an owned/instructor-authorized system,its service manual and appropriate supervision. Isolate specified power sources before authorized internal work;use approved ESD handling and avoid contacts. Do not open PSU/charger/monitor cases,probe hazardous circuits,short pins,improvise mains grounding,remove unsafe batteries or change/clear firmware/security settings. Record actual component/port observations in the journal. Guided checklists,manufacturer facts,sandbox software reports and diagrams are not falsely relabelled physical practical completion.</p>"}}]}], "programs": [{"id": "hw1p01", "title": {"en": "Actual read-only sandbox inventory — not a physical laptop specification"}, "code": {"en": "import json\nfrom hardware_lab import environment_inventory\n\nprint(json.dumps(environment_inventory(), sort_keys=True, indent=2))\n"}, "expl": {"en": "Actually reads generic OS/kernel architecture, logical CPU count and exposed Linux MemTotal. These are sandbox-reported resources, not proof of physical CPU cores, installed DIMMs, laptop model, battery, ports, BIOS mode or the learner’s computer. No hostname, DMI serial, MAC address, firmware setting or device manipulation is queried."}, "out": "{\n  \"BIOS_UEFI_or_CMOS_probed\": false,\n  \"kernel_MemTotal_bytes\": 2079133696,\n  \"machine\": \"x86_64\",\n  \"physical_components_inspected\": false,\n  \"reported_logical_cpus\": 2,\n  \"scope\": \"Sandbox OS/kernel report, not physical PC/laptop identification\",\n  \"system\": \"Linux\"\n}\n"}, {"id": "hw1p02", "title": {"en": "Computed capacity units: GB is not GiB"}, "code": {"en": "from hardware_lab import decimal_gb_to_gib\n\nprint(\"16_GiB_bytes:\", 16 * 1024 ** 3)\nprint(\"512_decimal_GB_as_GiB:\", round(decimal_gb_to_gib(512), 3))\nprint(\"1_TB_decimal_bytes:\", 10 ** 12)\nprint(\"physical_drive_or_RAM_measured:\", False)\n"}, "expl": {"en": "Real arithmetic converts a declared512-billion-byte capacity to approximately476.837GiB and16GiB to17,179,869,184 bytes. This is a units exercise, not measurement of an installed device or a guarantee of usable formatted capacity. Manufacturer memory labels and filesystem overhead must not be guessed from this calculation."}, "out": "16_GiB_bytes: 17179869184\n512_decimal_GB_as_GiB: 476.837\n1_TB_decimal_bytes: 1000000000000\nphysical_drive_or_RAM_measured: False\n"}, {"id": "hw1p03", "title": {"en": "Declared USB-C profiles: shape does not determine every feature"}, "code": {"en": "from hardware_lab import connector_fixture\n\nprofiles = [\n    {\"name\": \"Fictional A\", \"connector\": \"USB-C\",\n     \"video_documented\": False, \"charging_documented\": None},\n    {\"name\": \"Fictional B\", \"connector\": \"USB-C\",\n     \"video_documented\": True, \"charging_documented\": None}]\nfor field, value in connector_fixture(profiles).items():\n    print(field + \":\", value)\n"}, "expl": {"en": "Executes a logical check on two explicitly fictional specification rows, not a port probe. Both use USB-C while their declared video capability differs and charging is unspecified. This is not USB/Thunderbolt certification, cable testing, actual Power Delivery negotiation or a model-specific inference that an undocumented feature is absent."}, "out": "same_connector: True\nvideo_capability_varies_in_fixture: True\ncharging_unspecified_count: 2\nactual_ports_or_PD_negotiation_tested: False\n"}, {"id": "hw1p04", "title": {"en": "Validate specification-sheet completeness, not hardware compatibility"}, "code": {"en": "import json\nfrom pathlib import Path\nfrom hardware_lab import missing_spec_fields\n\ndata = json.loads((Path(__file__).resolve().parent /\n                   \"reference_specs.json\").read_text())\nfor row in data[\"profiles\"]:\n    print(row[\"id\"] + \"_missing:\", missing_spec_fields(row))\ndraft = {\"model\": \"Unverified student draft\", \"processor\": \"Model only\"}\nprint(\"draft_missing_count:\", len(missing_spec_fields(draft)))\nprint(\"compatibility_or_benchmark_proven:\", False)\n"}, "expl": {"en": "Actually checks the required CPU/memory/storage/GPU/display/ports/connectivity/OS/source/date fields in two dated manufacturer-listed reference profiles and an incomplete draft. Their first/base configurations were separately reviewed against official pages on29Oct2026. A complete row is not proof of physical ownership, worldwide latest status, local stock/price, compatibility, upgradeability or measured performance. The examples are Apple Silicon/macOS, not Windows x86 assembly/BIOS instructions."}, "out": "air_m5_base_missing: []\nmini_m6_base_missing: []\ndraft_missing_count: 9\ncompatibility_or_benchmark_proven: False\n"}], "diagrams": [{"id": "hw1_types", "title": {"en": "Computer Categories Are Different Axes"}, "file": "diagrams/hw1_types.svg"}, {"id": "hw1_block", "title": {"en": "Conceptual PC Functional Blocks"}, "file": "diagrams/hw1_block.svg"}, {"id": "hw1_cpu", "title": {"en": "CPU Functional Roles"}, "file": "diagrams/hw1_cpu.svg"}, {"id": "hw1_board", "title": {"en": "Generic Motherboard Role Map"}, "file": "diagrams/hw1_board.svg"}, {"id": "hw1_layers", "title": {"en": "Hardware,Software and Firmware"}, "file": "diagrams/hw1_layers.svg"}, {"id": "hw1_firmware", "title": {"en": "Firmware,OS and Settings Distinctions"}, "file": "diagrams/hw1_firmware.svg"}, {"id": "hw1_laptop", "title": {"en": "Laptop Groups and Integration"}, "file": "diagrams/hw1_laptop.svg"}, {"id": "hw1_ports", "title": {"en": "External Port Recognition Schematics"}, "file": "diagrams/hw1_ports.svg"}, {"id": "hw1_usb", "title": {"en": "Same Shape,Check Actual Capability"}, "file": "diagrams/hw1_usb.svg"}, {"id": "hw1_specs", "title": {"en": "A Defensible Dated Specification"}, "file": "diagrams/hw1_specs.svg"}, {"id": "hw1_safety", "title": {"en": "Safe Identification and Evidence"}, "file": "diagrams/hw1_safety.svg"}], "syntax": [{"title": {"en": "Hardware Identification Quick Reference"}, "items": [{"name": {"en": "System model"}, "f": "Input -> processing / working state -> output\nPersistent storage retains suitable programs/files", "terms": {"en": "Conceptual functions,not literal wiring or a whole computer contained in one CPU."}}, {"name": {"en": "Types are different axes"}, "f": "Micro / historical mini / mainframe / super\nWorkstation / cloud / embedded", "terms": {"en": "Cloud is deployment/service context;workstation may also be a microcomputer."}}, {"name": {"en": "CPU roles"}, "f": "ALU:arithmetic / logic\nCU:instruction/control sequencing\nRegisters:internal fast state", "terms": {"en": "Simplified architecture,not removable parts or a universal performance ranking."}}, {"name": {"en": "Working versus persistent storage"}, "f": "RAM:ordinary active volatile workspace\nFlash/ROM:nonvolatile low-level code/data\nHDD/SSD:persistent files/programs", "terms": {"en": "Firmware content and the physical storage chip are different concepts."}}, {"name": {"en": "Hardware/software/firmware"}, "f": "Physical parts / programs-data / low-level code", "terms": {"en": "Firmware is software in a hardware storage device;it is not necessarily permanently unchangeable."}}, {"name": {"en": "Firmware concepts"}, "f": "BIOS:legacy PC conventions\nUEFI:firmware/OS interface\nCMOS/RTC:NVRAM/settings/time context varies", "terms": {"en": "No BIOS screen,flash,reset,clear,TPM or security-setting changes performed."}}, {"name": {"en": "Laptop groups"}, "f": "CPU/RAM/board/storage/expansion\nPower/display/input/ports/cooling\nAudio/camera/Wi-Fi/Bluetooth", "terms": {"en": "Check exact integration,removability and optional absent components."}}, {"name": {"en": "External connectors"}, "f": "USB;HDMI;8P8C(RJ45-style Ethernet)\n3.5mm audio;VGA;Thunderbolt", "terms": {"en": "Identify markings/manual,cable and implemented capability. Schematics are not electrical pinouts."}}, {"name": {"en": "Shape versus capability"}, "f": "USB-C shape != every USB/video/PD mode\nThunderbolt 3/4/5 use USB-C\nOlder Thunderbolt 1/2 used MiniDP-style", "terms": {"en": "Do not assume every same-shaped port/cable has identical functions."}}, {"name": {"en": "Common display naming"}, "f": "Many PC LED monitors = LED-backlit LCD", "terms": {"en": "Not every LED-related display is the same technology;peripheral operation is studied in Unit 4."}}, {"name": {"en": "Capacity units"}, "f": "1 GiB=2^30 bytes\n512 GB(decimal)≈476.837 GiB", "terms": {"en": "Exercise only;not a physical measurement or formatted-capacity guarantee."}}, {"name": {"en": "Specification fields"}, "f": "CPU,RAM,storage,GPU,display\nPorts,connectivity,OS,source/date", "terms": {"en": "Exact selected configuration matters;complete fields do not prove compatibility/performance."}}, {"name": {"en": "Reference scope"}, "f": "Official pages checked 29 Oct2026\nApple Silicon/macOS first/base examples", "terms": {"en": "Not a Windows BIOS/assembly guide,worldwide latest assertion or purchase/stock recommendation."}}, {"name": {"en": "Safety / evidence"}, "f": "Authorized device + specific manual + supervision\nPower isolation + approved ESD handling", "terms": {"en": "Never open PSU/charger/monitor housing or probe hazardous power. Physical observations are guided only."}}]}], "viva": [{"title": {"en": "Unit 1 Viva and Short Revision"}, "items": [{"q": {"en": "What is a computer system?"}, "a": {"en": "Cooperating hardware,software/firmware and associated data/power/interconnection that accept input,process/store information and produce output."}}, {"q": {"en": "Was the IBM 5150 the first personal computer ever?"}, "a": {"en": "No. Its August 1981 introduction was influential,but personal computers existed earlier."}}, {"q": {"en": "Is a modern miniPC the same as a historical minicomputer?"}, "a": {"en": "No. Compact form-factor naming is different from the historical midrange/multiuser category."}}, {"q": {"en": "Is cloud computing a single physical CPU size class?"}, "a": {"en": "No. It is an access/service/deployment context using underlying hardware."}}, {"q": {"en": "Can a workstation also be a microcomputer?"}, "a": {"en": "Yes. The categories describe overlapping role/architecture/scale dimensions."}}, {"q": {"en": "What is an embedded system?"}, "a": {"en": "Computing integrated for particular device functions;it need not resemble or run the OS of a desktop."}}, {"q": {"en": "What does the ALU do?"}, "a": {"en": "Relevant arithmetic and logical operations under the instruction/control design."}}, {"q": {"en": "What does the CU do?"}, "a": {"en": "Coordinates relevant instruction/control sequencing and signals."}}, {"q": {"en": "Do more cores or GHz alone prove universally better performance?"}, "a": {"en": "No. Architecture,workload,memory,software and operating/thermal conditions matter."}}, {"q": {"en": "What is the motherboard?"}, "a": {"en": "The main circuit board supporting/interconnecting relevant system components and interfaces."}}, {"q": {"en": "Does every laptop have replaceable CPU/RAM modules?"}, "a": {"en": "No. Integration/soldering/model design varies;check the exact service specification."}}, {"q": {"en": "How does RAM differ from SSD capacity?"}, "a": {"en": "RAM is active working state;SSD is persistent storage. They are different resources."}}, {"q": {"en": "Is firmware the same as the flash chip?"}, "a": {"en": "No. The chip is hardware;firmware is low-level software/content stored in suitable memory."}}, {"q": {"en": "Can modern firmware be updateable?"}, "a": {"en": "Yes,but this unit performs no firmware flash/reset/change."}}, {"q": {"en": "Is UEFI just a graphical BIOS menu?"}, "a": {"en": "No. It specifies interfaces/services between platform firmware and OS/pre-boot components."}}, {"q": {"en": "Does a missing sandbox EFI directory prove the physical machine uses legacy BIOS?"}, "a": {"en": "No. A sandbox exposes only a limited view,and no such inference/probe is used here."}}, {"q": {"en": "Is the RTC coin cell the laptop’s main battery?"}, "a": {"en": "No. Their roles differ,and settings/time behaviour is model-dependent."}}, {"q": {"en": "Does removing a battery universally erase BIOS firmware or reset every setting?"}, "a": {"en": "No. Firmware flash and settings storage differ;no such procedure is assigned here."}}, {"q": {"en": "What may a laptop video controller/GPU do?"}, "a": {"en": "Generate/drive appropriate display output;it may be integrated,discrete or part of a SoC."}}, {"q": {"en": "Must every laptop have an optical drive and fan?"}, "a": {"en": "No. Removable-media and cooling implementations are model-dependent;some are absent/external/fanless."}}, {"q": {"en": "What do Wi-Fi/Bluetooth components provide?"}, "a": {"en": "Supported wireless connectivity through appropriate hardware/antennas/software."}}, {"q": {"en": "What is a common meaning of LED monitor?"}, "a": {"en": "An LED-backlit LCD;not automatically a direct-emissive LED or OLED panel."}}, {"q": {"en": "What is USB-C?"}, "a": {"en": "A connector form;protocol,video and charging capability must be checked separately."}}, {"q": {"en": "Do all Thunderbolt generations use USB-C?"}, "a": {"en": "No. Thunderbolt 1/2 used Mini DisplayPort-style connectors;3/4/5 use USB-C."}}, {"q": {"en": "What does RJ45-style commonly refer to on a PC?"}, "a": {"en": "The8P8C wired Ethernet connection,not a telephone jack."}}, {"q": {"en": "What is VGA?"}, "a": {"en": "A traditional DE-15 analog video interface,not HDMI-style digital audio/video."}}, {"q": {"en": "Does every 3.5mm jack support the same microphone/headphone combination?"}, "a": {"en": "No. Device wiring/role and compatible plugs vary."}}, {"q": {"en": "What is an SMPS?"}, "a": {"en": "A switched-mode power supply providing appropriate regulated power outputs;not a data/storage component."}}, {"q": {"en": "Should a learner open PSU/charger/monitor internals for identification?"}, "a": {"en": "No. Hazardous stored charge/high voltage and other risks require appropriate qualified service."}}, {"q": {"en": "What does 512 decimal GB equal approximately in GiB?"}, "a": {"en": "476.837 GiB by unit conversion,not a measured formatted-capacity result."}}, {"q": {"en": "What do the four software examples actually establish?"}, "a": {"en": "Read-only sandbox reports,capacity arithmetic,declared connector-profile differences and spec-field completeness—not physical practical completion."}}, {"q": {"en": "What is the limit of the dated manufacturer reference examples?"}, "a": {"en": "They are selected official-page base profiles checked 29 Oct2026,not globally newest/local availability,Windows servicing,upgrade or performance proof."}}]}], "exam_questions": [{"q": {"en": "Practice: Define a computer system and explain input,processing,storage and output."}, "marks": 3}, {"q": {"en": "Practice: Explain PC development and distinguish the seven syllabus computer categories."}, "marks": 7}, {"q": {"en": "Practice: Draw a PC block diagram and explain the main components."}, "marks": 7}, {"q": {"en": "Practice: Differentiate ALU,Control Unit and registers."}, "marks": 4}, {"q": {"en": "Practice: Explain the motherboard and why a generic layout cannot establish upgradeability."}, "marks": 4}, {"q": {"en": "Practice: Compare RAM,ROM/firmware storage,HDD and SSD."}, "marks": 4}, {"q": {"en": "Practice: Differentiate hardware,software and firmware with examples."}, "marks": 4}, {"q": {"en": "Practice: Compare legacy BIOS and UEFI without treating UEFI as just a graphical menu."}, "marks": 4}, {"q": {"en": "Practice: Explain CMOS,RTC battery,firmware flash and modern settings storage."}, "marks": 4}, {"q": {"en": "Practice: Identify the core components of a laptop and their model-dependent nature."}, "marks": 7}, {"q": {"en": "Practice: Explain laptop input/output,wireless,cooling and power precautions."}, "marks": 4}, {"q": {"en": "Practice: Compare USB,HDMI,RJ45-style Ethernet,audio,VGA and Thunderbolt ports."}, "marks": 7}, {"q": {"en": "Practice: Explain why USB-C shape does not guarantee video,charging or Thunderbolt."}, "marks": 4}, {"q": {"en": "Practice: Prepare a defensible current PC/laptop specification sheet."}, "marks": 7}, {"q": {"en": "Practice: Compute 16 GiB in bytes and convert 512 decimal GB to GiB."}, "marks": 3}, {"q": {"en": "Practice: State safe identification and evidence boundaries for Practicals 1 and4."}, "marks": 4}], "lesson_count": 18, "answered_practice_count": 16, "learning_outcomes": [{"en": "CO1:Identify and elaborate components of PC/laptop and overall system architecture."}], "practical_numbers": [1, 4], "content_kind": "hardware_theory_with_guided_physical_identification_and_actual_software_support", "assessment_note": {"en": "Official course:theory ESE70+PA30;practical PA20+ESE30=150,4 credits. Unit1 is7h/16%,not guaranteed question marks. Original suggested revisi cal desktop component identification", "4": "Guided-only physical front/back port identification;Windows/macOS/BIOS GUI not executed"}}, "manufacturer_reference_profiles": [{"id": "air_m5_base", "model": "MacBook Air 13-inch, M5, first/base configuration", "kind": "laptop", "processor": "Apple M5; 10-core CPU (4 super + 6 efficiency cores)", "memory": "16GB unified memory (manufacturer label; not a DIMM-upgrade claim)", "storage": "512GB SSD", "gpu": "8-core integrated GPU", "display": "13.6-inch LED-backlit IPS; 2560x1664", "ports": "2 Thunderbolt 4 (USB-C), MagSafe 3, 3.5mm headphone", "connectivity": "Wi-Fi 7 (802.11be); Bluetooth 6", "os": "macOS", "source_url": "https://www.apple.com/macbook-air/specs/", "checked_on": "2026-10-29", "selection_note": "13-inch first/base column only; do not mix 15-inch or upgrade options"}, {"id": "mini_m6_base", "model": "Mac mini, M6, first/base configuration", "kind": "desktop", "processor": "Apple M6; 12-core CPU (2 super + 4 performance + 6 efficiency cores)", "memory": "16GB unified memory (manufacturer label; not a DIMM-upgrade claim)", "storage": "256GB SSD", "gpu": "12-core integrated GPU", "display": "External display required; no built-in panel", "ports": "Front: 2 USB-C USB 3 (up to 10Gb/s), 3.5mm headphone; back: 3 Thunderbolt 4 (USB-C), HDMI, 2.5Gb Ethernet", "connectivity": "Wi-Fi 7 (802.11be); Bluetooth 6; 2.5Gb Ethernet", "os": "macOS", "source_url": "https://www.apple.com/mac-mini/specs/", "checked_on": "2026-10-29", "selection_note": "M6 first/base column only; not the separate M5 Pro configuration"}], "sources": [{"title": "GTU DI05007011 syllabus,2026–27", "url": "https://s3-ap-southeast-1.amazonaws.com/gtusitecirculars/Syallbus/DI05007011.pdf"}, {"title": "IBM history:the IBM 5150 PC (August 1981)", "url": "https://www.ibm.com/history/personal-computer"}, {"title": "UEFI Forum:UEFI and legacy BIOS concepts", "url": "https://uefi.org/faq"}, {"title": "USB-IF:USB Power Delivery and negotiated capability", "url const algorithms = () => syntax('algorithms');
const ALLV = {notes, programs, diagrams, flowcharts, algorithms, syntax, equations, numericals, viva, exam};
const VIEWS = U.tabs ? Object.fromEntries(U.tabs.map(k=>[k, ALLV[k]])) : U.programs ? (META.code_lang==='python' ? {notes, programs, diagrams, syntax, viva, exam} : {notes, programs, flowcharts, syntax, viva, exam}) : U.numericals ? {notes, diagrams, equations, numericals, viva, exam} : {notes, diagrams, equations, viva, exam};
function render(){
  document.getElementById('title').textContent = `${L('unit')} ${U.unit}: ${t(U.title)}`;
  document.getElementById('sub').textContent = `${t(META.name)} · ${META.code}`;
  document.getElementById('lang').textContent = S.lang==='en' ? 'ગુ' : 'EN';
  document.getElementById('lang').style.display = META.languages.includes('gu') ? '' : 'none';
  document.getElementById('tabs').innerHTML = Object.keys(VIEWS).map(k=>`<button class="tab${S.tab===k?' on':''}" data-tab="${k}">${L(k)}</button>`).join('');
  document.getElementById('view').innerHTML = VIEWS[S.tab]();
  document.querySelectorAll('#view pre.c').forEach(e=>{ e.innerHTML = hl(e.textContent); e.className='code'; });
}
let zoom = 1;
function setZoom(z){ zoom = Math.min(4, Math.max(1, z)); const w=document.getElementById('zw'); w.style.width=(zoom*100)+'%'; document.getElementById('zr').textContent=Math.round(zoom*100)+'%'; }
document.addEventListener('click', e=>{
  const q = e.target.closest('.q'); if (q && q.parentElement.querySelector('.a')) { q.parentElement.classList.toggle('open'); return; }
  const tb = e.target.closest('[data-tab]'); if (tb){ S.tab = tb.dataset.tab; render(); window.scrollTo(0,0); return; }
  if (e.target.closest('#lang')){ S.lang = S.lang==='en'?'gu':'en'; render(); return; }
  const m = e.target.closest('[data-more]');
  document.querySelectorAll('.menu.show').forEach(x=>{ if(!m || x!==m.nextElementSibling) x.classList.remove('show'); });
  if (m){ m.nextElementSibling.classList.toggle('show'); return; }
  const act = e.target.closest('[data-act]');
  if (act){ act.closest('.sec').querySelectorAll('.card').forEach(c=>{ if(c.querySelector('.a')) c.classList.toggle('open', act.dataset.act==='expand'); }); act.parentElement.classList.remove('show'); return; }
  const dg = e.target.closest('[data-dg]');
  if (dg){ const id=dg.dataset.dg; document.getElementById('mt').textContent=t(U.diagrams.find(d=>d.id===id).title); document.getElementById('zw').innerHTML=SVG[id]; setZoom(1); document.getElementById('modal').classList.add('show'); return; }
  if (e.target.closest('#mx')) document.getElementById('modal').classList.remove('show');
  if (e.target.closest('#zi')) setZoom(zoom+0.5);
  if (e.target.closest('#zo')) setZoom(zoom-0.5);
  if (e.target.closest('#zr')) setZoom(1);
});
render();
</script></body></html>
