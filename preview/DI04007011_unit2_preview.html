<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Introduction to Web Development – Unit 2</title>
<style>
:root{--p:#7B2CD9;--pd:#6420B8;--lav:#EADDF7;--bg:#F3ECFA;--ink:#1d1b20}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#d8cce8;font-family:"Noto Sans Gujarati","Shruti","Nirmala UI",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink)}
.phone{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:70px;position:relative}
.bar{position:sticky;top:0;z-index:10;background:var(--p);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.top{display:flex;align-items:center;gap:14px;padding:14px 14px 10px}
.top svg{flex:none}
.ttl{flex:1;min-width:0}
.ttl b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{opacity:.85;font-size:12.5px}
.lang{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:18px;padding:6px 12px;font-weight:700;font-size:14px;cursor:pointer}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;padding:0 6px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;color:rgba(255,255,255,.75);padding:10px 14px 12px;font-size:14.5px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;background:none;border-top:0;border-left:0;border-right:0}
.tab.on{color:#fff;border-bottom-color:#fff}
.sec{margin-bottom:14px}
.sh{background:var(--lav);display:flex;align-items:center;justify-content:space-between;padding:16px 14px 16px 18px;font-weight:800;font-size:17px;position:relative}
.more{background:none;border:0;padding:4px 6px;cursor:pointer;border-radius:50%}
.menu{display:none;position:absolute;right:12px;top:48px;background:#fff;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.18);z-index:5;overflow:hidden;min-width:150px}
.menu.show{display:block}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:12px 16px;font-size:14.5px;cursor:pointer}
.menu button:hover{background:#f4eefc}
.card{background:#fff;border-radius:6px;margin:0 0 8px;box-shadow:0 1px 3px rgba(60,20,110,.14)}
.q{display:flex;gap:10px;align-items:flex-start;padding:16px 14px 16px 18px;color:var(--p);font-size:16.5px;line-height:1.45;cursor:pointer}
.q .n{flex:none;min-width:24px}
.q .t{flex:1}
.q.hd{font-weight:700}
.chev{flex:none;transition:transform .2s;margin-top:1px}
.card.open .chev{transform:rotate(180deg)}
.a{display:none;padding:0 16px 18px 52px;font-size:15.5px;line-height:1.65;color:#222}
.card.open .a{display:block;animation:fd .2s}
@keyframes fd{from{opacity:0;transform:translateY(-4px)}to{opacity:1}}
.a p{margin:0 0 10px}.a ul,.a ol{margin:0 0 10px;padding-left:20px}.a li{margin-bottom:4px}
.a b{color:#111}
.eq{background:#F5EEFD;border-left:4px solid var(--p);padding:8px 12px;border-radius:4px;font-weight:700;font-size:16.5px;color:var(--pd)}
.tw{overflow-x:auto;margin:0 0 10px -36px;padding-left:0}
table{border-collapse:collapse;font-size:13.5px;min-width:100%;line-height:1.4}
th{background:var(--p);color:#fff;text-align:left;padding:7px 8px;font-weight:700}
td{border-bottom:1px solid #eadff6;padding:7px 8px;vertical-align:top}
tr:nth-child(even) td{background:#faf7fe}
.dg{margin:6px 0 4px -36px;border:1px solid #eadff6;border-radius:10px;overflow:hidden;cursor:zoom-in;background:#fff}
.dg svg{display:block;width:100%;height:auto}
.dg.pg{margin-left:0}
.dgc{font-size:12px;color:#7a6f88;text-align:center;margin:-2px 0 10px -36px}
.dcard{background:#fff;border-radius:10px;margin:0 10px 12px;box-shadow:0 1px 3px rgba(60,20,110,.14);overflow:hidden;cursor:zoom-in}
.dcard .h{padding:12px 14px;color:var(--p);font-weight:700;font-size:15.5px;border-bottom:1px solid #f0e8f9}
.dcard svg{display:block;width:100%;height:auto}
.fbox{margin:4px 0 0;background:#F5EEFD;border-radius:6px;padding:9px 12px;font-size:18px;font-weight:700;color:var(--pd);display:inline-block}
.q .t .nm{display:block}
.mk{flex:none;background:#FFF1D6;color:#9A5B00;border-radius:12px;padding:2px 9px;font-size:12.5px;font-weight:800;margin-top:2px}
.ad{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:56px;background:#fff;border-top:1px solid #e3d8f0;display:flex;align-items:center;justify-content:center;gap:8px;color:#8b8199;font-size:12.5px;z-index:9}
.ad i{font-style:normal;background:#f2c94c;color:#5b4300;font-weight:800;font-size:10.5px;padding:1px 5px;border-radius:3px}
.modal{position:fixed;inset:0;background:rgba(20,10,35,.92);z-index:50;display:none;flex-direction:column}
.modal.show{display:flex}
.mh{display:flex;align-items:center;justify-content:space-between;color:#fff;padding:12px 16px;font-weight:700}
.mh button{background:rgba(255,255,255,.15);border:0;color:#fff;font-size:18px;width:38px;height:38px;border-radius:50%;cursor:pointer}
.mb{flex:1;overflow:auto;padding:10px}
.mb .zw{background:#fff;border-radius:8px;margin:auto;transform-origin:top left}
.mb svg{display:block;width:100%;height:auto}
.zb{display:flex;justify-content:center;gap:14px;padding:12px}
.zb button{background:#fff;border:0;border-radius:22px;padding:8px 20px;font-size:18px;font-weight:800;color:var(--p);cursor:pointer}
.a h4{margin:14px 0 6px;color:var(--pd);font-size:15.5px}
.a h4:first-child{margin-top:0}
.card.key{border-left:4px solid #2E7D32}
.card.key .q{color:#1B5E20}
.ex{margin:12px 0 10px -36px;border:1.5px dashed #C9A227;background:#FFFBEF;border-radius:10px;padding:10px 12px}
.ex .et{font-weight:800;color:#9A5B00;font-size:13px;margin-bottom:4px}
.ex .eq2{font-weight:700;margin-bottom:6px}
.ex p{margin:0 0 6px}
.a.rn .dg,.a.rn .dgc,.a.rn .tw,.a.rn .ex{margin-left:0}
.intro{margin:12px 10px;background:linear-gradient(135deg,#8E3BE8,#5B1BB0);color:#fff;border-radius:14px;padding:14px 16px}
.intro b{font-size:16px}.intro div{font-size:13px;opacity:.9;margin-top:4px}
.chips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.chips span{background:rgba(255,255,255,.18);border-radius:12px;padding:3px 10px;font-size:12px;font-weight:700}
pre.code{background:#1E1530;color:#EDE7F6;border-radius:8px;padding:10px 12px;font:13px/1.55 "JetBrains Mono",Consolas,"DejaVu Sans Mono","Noto Sans Gujarati",monospace;overflow-x:auto;margin:0 0 10px;white-space:pre;tab-size:4}
pre.out{background:#0E1B12;color:#B9F6CA;border-radius:8px;padding:10px 12px;font:13px/1.5 Consolas,"DejaVu Sans Mono",monospace;overflow-x:auto;margin:0 0 10px;white-space:pre}
.kw{color:#C792EA;font-weight:700}.ty{color:#82AAFF}.st{color:#C3E88D}.cm{color:#8E9AAF;font-style:italic}.pp{color:#F78C6C}.nu{color:#F9C46B}.fn{color:#FFCB6B}
.pl{font-size:12px;font-weight:800;color:var(--pd);margin:10px 0 4px;letter-spacing:.4px;text-transform:uppercase}
@media (max-width:480px){pre.code,pre.out{font-size:11.5px;padding:9px 10px}}
.a code{background:#F1E9FB;color:#5B1BB0;padding:1px 5px;border-radius:4px;font-family:Consolas,"DejaVu Sans Mono",monospace;font-size:.9em}
.pbox{margin:12px 0 10px;border:1.5px dashed #2E8B7A;background:#F2FBF8;border-radius:10px;padding:10px 12px}
.pbox .et{font-weight:800;color:#1F6E60;font-size:13.5px;margin-bottom:6px}
.sx{margin:6px 0 0;font-size:12.5px;padding:8px 10px}
.a.pa{padding-left:16px}
</style></head>

<script>
const U = {"subject": "DI04007011", "unit": 2, "format": "notes", "title": {"en": "PHP Functions, Arrays and Strings"}, "weightage": 20, "hours": 12, "notes": [{"title": {"en": "2.1 User-Defined Functions"}, "items": [{"h": {"en": "Defining and Calling Functions"}, "body": {"en": "\n<ul><li>A function packages a computation: <code>function name($param, ...) { ... return $value; }</code>. Call it by name with arguments: <code>fare(265)</code>.</li>\n<li><b>Parameters</b> are the inputs at the doorway; <b>arguments</b> are the actual values handed in. <code>return</code> sends exactly one value back (return an array to smuggle out several).</li>\n<li>PHP functions are <b>global</b> once defined - callable from anywhere below or above in the file - and names are case-insensitive (<code>FARE()</code> works, but use the declared spelling).</li>\n<li>Discipline: a function <b>computes</b>; it does not echo banners. Output is the caller's choice - this keeps functions reusable across pages.</li>\n<li>Vocabulary: <i>define</i> once, <i>call</i> many times. Total of messy copy-paste &rarr; one tested function.</li></ul>\n"}, "diagram": "wd2_anatomy", "programs": ["wd2p1"]}, {"h": {"en": "Arguments: Defaults, Return Values, By Value vs By Reference"}, "body": {"en": "\n<ul><li><b>Default parameters</b>: <code>function fare($km, $rate = 1.2)</code> - callers may skip trailing parameters; <code>fare(265)</code> uses the default rate, <code>fare(265, 1.5)</code> overrides it. Required parameters come first, optional ones last.</li>\n<li><b>By value</b> (default): PHP hands the function a <i>copy</i> - changing <code>$n</code> inside leaves the caller's variable untouched.</li>\n<li><b>By reference</b>: prefix <code>&</code> - <code>function addTip(&amp;$total)</code> - and the function borrows the caller's actual variable; changes stick. Classic uses: <code>swap($a,$b)</code>, accumulating into a result array.</li>\n<li>Same trick inside the signature and at call time: <code>sort($arr)</code> is built-in by-reference - that is why it changes your array without returning it.</li>\n<li>Rule of thumb: default to by-value; reach for <code>&amp;</code> only when the function's job is to modify its argument.</li></ul>\n"}, "diagram": "wd2_value_ref", "programs": ["wd2p2"]}, {"h": {"en": "Variable Scope: Local, Global and Static"}, "body": {"en": "\n<ul><li><b>Local scope</b>: variables created inside a function live and die with the call - the outside world cannot see <code>$tip</code>, and the function cannot see your <code>$total</code>.</li>\n<li><b>Global scope</b>: script-level variables. Open the window deliberately with <code>global $total;</code> inside the function, or use the super-global array <code>$GLOBALS['total']</code>.</li>\n<li><b>Static locals</b>: <code>static $calls = 0;</code> survives between calls of the same function - a visit counter without globals.</li>\n<li>Good style: pass inputs as parameters, return outputs - treat <code>global</code> as a last resort (hard to test, easy to tangle).</li></ul>\n"}, "diagram": "wd2_scope", "programs": ["wd2p3"]}]}, {"title": {"en": "2.2 Built-in Functions: Math and Date-Time"}, "items": [{"h": {"en": "Mathematical Built-ins"}, "body": {"en": "\n<ul><li>Rounding family: <code>round($x, 2)</code>, <code>floor()</code>, <code>ceil()</code> - money displays always round.</li>\n<li>Magnitudes: <code>abs()</code>, <code>max(...)</code>, <code>min(...)</code>, <code>pow($b, $e)</code>, <code>sqrt()</code>; integer division <code>intdiv(17, 5)</code> &rarr; 3.</li>\n<li>Randomness: <code>rand(1, 6)</code> or <code>random_int(1, 6)</code> for cryptographic-quality picks (OTPs, dice).</li>\n<li>Type shapers: <code>(int)$s</code>, <code>(float)$s</code> casts; checkers <code>is_numeric()</code> (true for \"12.5\") - Unit 3 uses these on every form field.</li>\n<li>All and more live at php.net - knowing they exist beats memorising signatures.</li></ul>\n"}, "programs": ["wd2p4"]}, {"h": {"en": "Date and Time Functions"}, "body": {"en": "\n<ul><li><code>date(\"format\")</code> renders the current moment: <code>d M Y</code> &rarr; 29 Oct 2026; <code>date(\"H:i\")</code> &rarr; 24h time. Format letters: d D m M y Y H h i s a l.</li>\n<li><code>time()</code> returns the Unix timestamp (seconds since 1970) - arithmetic-ready (<code>time() + 86400</code> = tomorrow).</li>\n<li><code>mktime(h, m, s, month, day, year)</code> builds a timestamp; wrap in <code>date()</code> to read it.</li>\n<li><code>strtotime(\"next Monday\")</code> parses English into a timestamp - surprisingly capable for booking deadlines.</li>\n<li>Intervals and differences: <code>date_create()</code>/<code>date_diff()</code> or <code>DateTime::diff</code> give exact day gaps (\"booked 12 days before travel\").</li>\n<li>Set the zone once for India: <code>date_default_timezone_set(\"Asia/Kolkata\")</code>.</li></ul>\n"}, "programs": ["wd2p5"]}]}, {"title": {"en": "2.3 Arrays: Indexed, Associative, Multidimensional"}, "items": [{"h": {"en": "Indexed and Associative Arrays (Practical 7)"}, "body": {"en": "\n<ul><li>One <b>ordered map</b> type serves both habits. <b>Indexed</b>: numeric keys auto-assigned from 0 - <code>$cities = [\"Surat\", \"Vadodara\"];</code>, read with <code>$cities[0]</code>.</li>\n<li><b>Associative</b>: named keys - <code>$fare = [\"SRT\" =&gt; 250, \"AMD\" =&gt; 160];</code>, read with <code>$fare['SRT']</code>. Keys are strings or ints; quotes only around strings.</li>\n<li>Create empty <code>$a = [];</code> and append with <code>$a[] = $v;</code> (indexed) or <code>$a['key'] = $v;</code> (associative). Add, overwrite, delete with <code>unset($a['key'])</code>.</li>\n<li>Arrays are PHP's workhorse: form data (<code>$_POST</code>), database rows and config are all associative arrays.</li></ul>\n"}, "diagram": "wd2_array_types", "programs": ["wd2p6"]}, {"h": {"en": "Multidimensional Arrays (Practical 7)"}, "body": {"en": "\n<ul><li>Arrays inside arrays: a list of students, each <code>[&quot;roll&quot; =&gt; 7, &quot;name&quot; =&gt; &quot;Asha&quot;, &quot;marks&quot; =&gt; [78, 81, 69]]</code> - three dimensions deep.</li>\n<li>Address precisely: <code>$students[2]['marks'][1]</code> reads row 2, sub-array, position 1.</li>\n<li>Nested <code>foreach</code> walks the table naturally - an outer lap per record, an inner lap per field.</li>\n<li>Mental image: rows of a spreadsheet stored in PHP memory; Unit 5 swaps this for real MySQL tables with the same shape.</li></ul>\n"}, "programs": ["wd2p7"]}, {"h": {"en": "Traversing and Processing Array Data (Practical 8)"}, "body": {"en": "\n<ul><li><code>foreach ($a as $v)</code> streams values; <code>foreach ($a as $k =&gt; $v)</code> streams keys too - the idiomatic PHP loop.</li>\n<li>Common processing patterns: <b>sum/count &rarr; average</b>; <b>max/min via comparisons</b>; <b>filter into a new array</b> (only bookings above Rs 200); <b>map</b> (format every row as an HTML <code>&lt;li&gt;</code>).</li>\n<li>The manual gearbox exists too: <code>current()</code>, <code>next()</code>, <code>prev()</code>, <code>end()</code>, <code>reset()</code> move an internal pointer - foreach resets and drives it for you.</li>\n<li>Keep loops readable: give the value variable a real name (<code>$booking</code>, not <code>$x</code>).</li></ul>\n"}, "diagram": "wd2_foreach_map", "programs": ["wd2p8"]}, {"h": {"en": "Array Library Functions (Practical 9)"}, "body": {"en": "\n<ul><li>Measure: <code>count($a)</code>; search: <code>in_array($v, $a)</code>, <code>array_search($v, $a)</code> (returns key), <code>array_key_exists()</code>.</li>\n<li>Order: <code>sort()</code>/<code>rsort()</code> renumber keys (0..n) - fine for lists, <b>fatal for assoc keys</b>; use <code>asort()</code>, <code>arsort()</code> (by value) or <code>ksort()</code>/<code>krsort()</code> (by key) to keep pairs glued.</li>\n<li>Combine and reshape: <code>array_merge()</code>, <code>array_reverse()</code>, <code>array_slice()</code>, <code>array_unique()</code>.</li>\n<li>Stack ends: <code>array_push()</code>/<code>array_pop()</code> (end), <code>array_shift()</code>/<code>array_unshift()</code> (front).</li>\n<li>Bridges: <code>implode(', ', $a)</code> (array &rarr; string), <code>explode(',', $s)</code> (string &rarr; array), <code>list($x, $y) = $pair</code> unpacks; <code>each()</code> is long-deprecated - use foreach.</li></ul>\n"}, "diagram": "wd2_array_funcs", "programs": ["wd2p9"]}]}, {"title": {"en": "2.4 Strings"}, "items": [{"h": {"en": "Quoting Styles: Single, Double, Heredoc, Nowdoc"}, "body": {"en": "\n<ul><li><b>Single quotes</b>: literal text - <code>'$fare'</code> prints a dollar sign, not a value. <b>Double quotes</b>: interpolate variables - <code>\"Fare: $fare\"</code> expands in place.</li>\n<li><b>Heredoc</b>: <code>echo &lt;&lt;&lt;EOT ... EOT;</code> - multi-line block that behaves like double quotes; perfect for HTML receipts with variables.</li>\n<li><b>Nowdoc</b>: <code>&lt;&lt;&lt;'EOT'</code> (quoted marker) - multi-line AND literal; perfect for raw SQL or code samples.</li>\n<li>Escapes inside double quotes: <code>\\n</code> newline, <code>\\t</code> tab, <code>\\$</code> literal dollar, <code>\\\\</code> backslash.</li>\n<li>Before echoing user data into HTML, escape with <code>htmlspecialchars()</code> - the first rule of safe output (Unit 3 drills it).</li></ul>\n"}, "diagram": "wd2_quotes", "programs": ["wd2p10"]}, {"h": {"en": "String Library Functions: Search, Replace, Compare (Practical 10)"}, "body": {"en": "\n<ul><li>Shape: <code>strlen()</code>, <code>strtolower()</code>/<code>strtoupper()</code>, <code>ucfirst()</code>/<code>ucwords()</code>, <code>trim()</code>/<code>ltrim()</code>/<code>rtrim()</code>, <code>substr($s, 0, 3)</code>.</li>\n<li>Find: <code>strpos($hay, $needle)</code> (0-based position or <b>false</b>), <code>strrpos()</code> (last), <code>stristr()</code>/<code>strstr()</code> (rest of string from match), case-insensitive twins carry the <code>i</code>.</li>\n<li>Change: <code>str_replace($find, $with, $s)</code>, <code>substr_replace()</code>, <code>strrev()</code>, <code>str_repeat()</code>, <code>wordwrap()</code>.</li>\n<li>Compare: <code>strcmp()</code>/<code>strcasecmp()</code> return negative/zero/positive - feed <code>usort()</code> callbacks.</li>\n<li>Characters: <code>chr(65)</code> &rarr; \"A\", <code>ord('A')</code> &rarr; 65 for code-point tricks.</li>\n<li><b>Trap</b>: when a needle is NOT found, strpos returns <code>false</code> - but position <code>0</code> is also falsy, so always test with <code>=== false</code>.</li></ul>\n"}, "diagram": "wd2_string_funcs", "programs": ["wd2p11"]}]}], "programs": [{"id": "wd2p1", "title": {"en": "User-defined function: defaults and return (Practical 6)"}, "code": {"en": "<?php\n// One tested function replaces copy-paste fare maths\nfunction fare($km, $rate = 1.2, $minFare = 50) {\n    $total = $km * $rate;\n    return max($total, $minFare);   // never below the minimum fare\n}\n\nfunction receipt($city, $km, $rate = 1.2) {\n    $f = fare($km, $rate);\n    return \"$city: {$km} km, Rs $f\";\n}\n\necho receipt(\"Bharuch\", 60), \"\\n\";      // uses default rate\necho receipt(\"Ahmedabad\", 265), \"\\n\";\necho receipt(\"Gandhinagar\", 265, 1.5), \"\\n\";  // override rate\necho receipt(\"Navsari\", 30), \"\\n\";      // min fare kicks in\n?>"}, "out": "$ php index.php\nBharuch: 60 km, Rs 72\nAhmedabad: 265 km, Rs 318\nGandhinagar: 265 km, Rs 397.5\nNavsari: 30 km, Rs 50", "expl": {"en": "<p><code>fare()</code> has one required parameter (<code>$km</code>) and two with <b>defaults</b> - skip them and the defaults apply. <code>return</code> hands one value back; <code>receipt()</code> shows function-calling-function composition. Note <code>{$km}</code> braced interpolation inside the double-quoted string.</p>"}}, {"id": "wd2p2", "title": {"en": "Passing by value vs by reference (swap demo)"}, "code": {"en": "<?php\nfunction trySwap($a, $b) {          // BY VALUE: gets copies\n    $t = $a; $a = $b; $b = $t;\n}\nfunction swap(&$a, &$b) {           // BY REFERENCE: gets originals\n    $t = $a; $a = $b; $b = $t;\n}\n\n$x = \"Surat\"; $y = \"Mumbai\";\ntrySwap($x, $y);\necho \"after trySwap: $x / $y\\n\";    // unchanged!\n\nswap($x, $y);\necho \"after swap&  : $x / $y\\n\";    // swapped for real\n\n// practical use: accumulate INTO a caller's array\nfunction addBooking(&$list, $seat) {\n    $list[] = $seat;                // appends to caller's array\n}\n$bookings = [\"12A\"];\naddBooking($bookings, \"14C\");\naddBooking($bookings, \"3B\");\necho \"bookings: \", implode(\", \", $bookings), \"\\n\";\n?>"}, "out": "$ php index.php\nafter trySwap: Surat / Mumbai\nafter swap&  : Mumbai / Surat\nbookings: 12A, 14C, 3B", "expl": {"en": "<p><code>trySwap</code> shuffles photocopies - the caller's variables survive untouched. With <code>&amp;$a, &amp;$b</code> the function borrows the originals and the swap is real. The <code>addBooking</code> pattern (array passed by reference) is how helper functions grow a caller's data.</p>"}}, {"id": "wd2p3", "title": {"en": "Scope: local, global and static"}, "code": {"en": "<?php\n$total = 100;                       // GLOBAL scope variable\n\nfunction addTip($tip) {\n    global $total;                  // open the window\n    $total += $tip;\n    $localNote = \"added $tip\";      // LOCAL: dies with the call\n    echo \"  inside: $localNote\\n\";\n}\n\nfunction visitCounter() {\n    static $visits = 0;             // STATIC: survives between calls\n    $visits++;\n    return $visits;\n}\n\naddTip(15);\naddTip(10);\necho \"global total now: $total\\n\";\n\necho \"via \\$GLOBALS: \", $GLOBALS[\"total\"], \"\\n\";\n\necho \"visits: \", visitCounter(), \", \", visitCounter(), \", \", visitCounter(), \"\\n\";\n// echo $localNote;  // would be empty - local scope!\n?>"}, "out": "$ php index.php\n  inside: added 15\n  inside: added 10\nglobal total now: 125\nvia $GLOBALS: 125\nvisits: 1, 2, 3", "expl": {"en": "<p>Three scopes in one program: <code>$localNote</code> vanishes when <code>addTip</code> ends; <code>global $total</code> (or <code>$GLOBALS['total']</code>) lets a function modify a script-level variable; <code>static $visits</code> is a local that <i>remembers</i> across calls - perfect for counters.</p>"}}, {"id": "wd2p4", "title": {"en": "Mathematical built-in functions"}, "code": {"en": "<?php\n$bill = 102.789;\necho \"round : \", round($bill), \" / \", round($bill, 2), \"\\n\";\necho \"floor : \", floor($bill), \"  ceil: \", ceil($bill), \"\\n\";\necho \"abs   : \", abs(-42), \"\\n\";\necho \"max   : \", max(250, 160, 320), \"  min: \", min(250, 160, 320), \"\\n\";\necho \"pow   : \", pow(2, 10), \"  sqrt: \", sqrt(144), \"\\n\";\necho \"intdiv: \", intdiv(17, 5), \"  mod: \", 17 % 5, \"\\n\";\n\necho \"dice  : \", rand(1, 6), \"  otp : \", random_int(1000, 9999), \"\\n\";\n\n// is_numeric checks form strings before calculating\n$raw = \"12.5\";                      // as it would arrive from a form\necho \"is_numeric('12.5'): \", var_export(is_numeric($raw), true), \"\\n\";\nif (is_numeric($raw)) {\n    echo \"per km for 40 km: Rs \", (float)$raw * 40, \"\\n\";\n}\n?>"}, "out": "$ php index.php\nround : 103 / 102.79\nfloor : 102  ceil: 103\nabs   : 42\nmax   : 320  min: 160\npow   : 1024  sqrt: 12\nintdiv: 3  mod: 2\ndice  : 5  otp : 2100\nis_numeric('12.5'): true\nper km for 40 km: Rs 500", "expl": {"en": "<p>PHP's math library covers rounding (<code>round/floor/ceil</code>), magnitudes (<code>abs/max/min/pow/sqrt</code>), integer division (<code>intdiv</code>) and randomness (<code>rand</code>, <code>random_int</code> for OTPs). <code>is_numeric</code> validates string input <i>before</i> you trust it in arithmetic - the Unit 3 habit.</p>"}}, {"id": "wd2p5", "title": {"en": "Date and time functions"}, "code": {"en": "<?php\ndate_default_timezone_set(\"Asia/Kolkata\");\n\necho \"Today       : \", date(\"d M Y\"), \"\\n\";\necho \"Full banner : \", date(\"l, jS F Y\"), \"\\n\";\necho \"Time        : \", date(\"h:i A\"), \"\\n\";\necho \"Timestamp   : \", time(), \" seconds since 1970\\n\";\n\n$travel = mktime(6, 30, 0, 11, 15, 2026);   // bus departs 15 Nov 06:30\necho \"Travel day  : \", date(\"d M Y h:i A\", $travel), \"\\n\";\n\n$days = (int)(($travel - time()) / 86400);\necho \"Days to trip: $days\\n\";\n\necho \"Next Monday : \", date(\"d M\", strtotime(\"next Monday\")), \"\\n\";\necho \"Deadline    : \", date(\"d M Y\", strtotime(\"+7 days\")), \"\\n\";\n\n// date_diff for exact gaps\n$booked = date_create(\"2026-10-01\");\n$trip   = date_create(\"2026-10-29\");\n$gap    = date_diff($booked, $trip);\necho \"Booked \", $gap->days, \" days before travel\\n\";\n?>"}, "out": "$ php index.php\nToday       : 29 Oct 2026\nFull banner : Thursday, 29th October 2026\nTime        : 01:05 AM\nTimestamp   : 1793216144 seconds since 1970\nTravel day  : 15 Nov 2026 06:30 AM\nDays to trip: 17\nNext Monday : 02 Nov\nDeadline    : 05 Nov 2026\nBooked 28 days before travel", "expl": {"en": "<p><code>date()</code> renders any timestamp with format letters; <code>time()</code> is seconds-since-1970 (so <code>+86400</code> = tomorrow); <code>mktime()</code> builds timestamps, <code>strtotime()</code> parses English (\"next Monday\"), and <code>date_diff()</code> measures exact gaps between two dates - the booking-window calculation every ticket site needs.</p>"}}, {"id": "wd2p6", "title": {"en": "Indexed and associative arrays (Practical 7)"}, "code": {"en": "<?php\n// INDEXED array: positions 0, 1, 2 ...\n$cities = [\"Surat\", \"Bharuch\", \"Vadodara\"];\n$cities[] = \"Ahmedabad\";            // append\necho \"First stop: $cities[0]\\n\";\necho \"Stops: \", count($cities), \"\\n\";\nforeach ($cities as $c) echo \"  -> $c\\n\";\n\n// ASSOCIATIVE array: named keys\n$fare = [\"SRT\" => 250, \"BRC\" => 120, \"AMD\" => 160];\n$fare[\"GANDHI\"] = 300;              // add by key\n$fare[\"SRT\"] = 260;                 // overwrite\necho \"Fare to AMD: Rs \", $fare[\"AMD\"], \"\\n\";\nforeach ($fare as $code => $amt) {\n    echo \"  $code : Rs $amt\\n\";\n}\nunset($fare[\"BRC\"]);                // delete a pair\necho \"after unset: \", implode(\", \", array_keys($fare)), \"\\n\";\n?>"}, "out": "$ php index.php\nFirst stop: Surat\nStops: 4\n  -> Surat\n  -> Bharuch\n  -> Vadodara\n  -> Ahmedabad\nFare to AMD: Rs 160\n  SRT : Rs 260\n  BRC : Rs 120\n  AMD : Rs 160\n  GANDHI : Rs 300\nafter unset: SRT, AMD, GANDHI", "expl": {"en": "<p>Indexed arrays order items by position (auto keys from 0, append with <code>$a[]</code>); associative arrays pair <i>named</i> keys with values (<code>$fare['SRT']</code>). Add/overwrite by assigning a key, delete with <code>unset</code>, walk either with <code>foreach</code> - with <code>$k =&gt; $v</code> when keys matter.</p>"}}, {"id": "wd2p7", "title": {"en": "Multidimensional array: students table (Practical 7)"}, "code": {"en": "<?php\n$students = [\n    [\"roll\" => 7,  \"name\" => \"Asha\",  \"marks\" => [\"SE\" => 78, \"Java\" => 81, \"IWD\" => 69]],\n    [\"roll\" => 12, \"name\" => \"Bhuvi\", \"marks\" => [\"SE\" => 91, \"Java\" => 66, \"IWD\" => 72]],\n    [\"roll\" => 19, \"name\" => \"Chirag\",\"marks\" => [\"SE\" => 55, \"Java\" => 74, \"IWD\" => 88]],\n];\n\necho \"Row 2 name      : \", $students[1][\"name\"], \"\\n\";\necho \"Row 3 IWD marks : \", $students[2][\"marks\"][\"IWD\"], \"\\n\\n\";\n\n// nested foreach: whole table, with totals\nforeach ($students as $s) {\n    $sum = 0;\n    foreach ($s[\"marks\"] as $sub => $m) $sum += $m;\n    printf(\"%-8s (roll %2d): total %d / 270\\n\", $s[\"name\"], $s[\"roll\"], $sum);\n}\n?>"}, "out": "$ php index.php\nRow 2 name      : Bhuvi\nRow 3 IWD marks : 88\n\nAsha     (roll  7): total 228 / 270\nBhuvi    (roll 12): total 229 / 270\nChirag   (roll 19): total 217 / 270", "expl": {"en": "<p>Arrays inside arrays model a spreadsheet: each student is an associative record, <code>marks</code> is itself an associative array. Address with chained brackets (<code>$students[2]['marks']['IWD']</code>) and walk with nested <code>foreach</code> - outer lap per student, inner lap per subject. <code>printf</code> keeps columns neat.</p>"}}, {"id": "wd2p8", "title": {"en": "Processing array data: stats and filtering (Practical 8)"}, "code": {"en": "<?php\n$bookings = [250, 160, 320, 480, 120, 260, 310];\n\n$total = 0; $max = $bookings[0]; $min = $bookings[0];\nforeach ($bookings as $amt) {\n    $total += $amt;\n    if ($amt > $max) $max = $amt;\n    if ($amt < $min) $min = $amt;\n}\n$avg = $total / count($bookings);\n\necho \"Bookings  : \", implode(\", \", $bookings), \"\\n\";\nprintf(\"Total Rs %d | avg Rs %.2f | max %d | min %d\\n\", $total, $avg, $max, $min);\n\n// filter: premium bookings only (>= 300)\n$premium = [];\nforeach ($bookings as $amt) {\n    if ($amt >= 300) $premium[] = $amt;\n}\necho \"Premium (>=300): \", implode(\", \", $premium), \"\\n\";\n\n// map: format every amount as an HTML list item\nforeach ($bookings as $amt) {\n    $rows[] = \"<li>Rs $amt</li>\";\n}\necho \"as HTML:\\n\", implode(\"\\n\", $rows), \"\\n\";\n?>"}, "out": "$ php index.php\nBookings  : 250, 160, 320, 480, 120, 260, 310\nTotal Rs 1900 | avg Rs 271.43 | max 480 | min 120\nPremium (>=300): 320, 480, 310\nas HTML:\n<li>Rs 250</li>\n<li>Rs 160</li>\n<li>Rs 320</li>\n<li>Rs 480</li>\n<li>Rs 120</li>\n<li>Rs 260</li>\n<li>Rs 310</li>", "expl": {"en": "<p>The four array-processing archetypes in one file: <b>accumulate</b> (total/average), <b>extremes</b> (max/min via comparisons), <b>filter</b> (premium bookings into a new array) and <b>map</b> (each amount into an HTML <code>&lt;li&gt;</code>). <code>implode</code> flattens arrays back to displayable strings.</p>"}}, {"id": "wd2p9", "title": {"en": "Array function carnival (Practical 9)"}, "code": {"en": "<?php\n$shopping = [\"milk\" => 62, \"bread\" => 45, \"eggs\" => 78, \"tea\" => 140];\n\necho \"count     : \", count($shopping), \"\\n\";\necho \"in_array  : \", var_export(in_array(78, $shopping), true), \"\\n\";\necho \"key exists: \", var_export(array_key_exists(\"bread\", $shopping), true), \"\\n\";\n\n// sort WITHOUT breaking name <-> price pairs\n$cheap = $shopping;\nasort($cheap);\necho \"cheapest first -> \", implode(\", \", array_map(fn($k,$v)=>\"$k:$v\", array_keys($cheap), $cheap)), \"\\n\";\n\n$list = [\"Surat\", \"Vadodara\", \"Ahmedabad\"];\nsort($list);                        // renumbers keys 0..n - fine here\necho \"sorted list : \", implode(\", \", $list), \"\\n\";\n\n$merged = array_merge([\"jam\" => 95], $shopping);\necho \"merged keys : \", implode(\", \", array_keys($merged)), \"\\n\";\necho \"reversed    : \", implode(\", \", array_reverse($list)), \"\\n\";\n\narray_push($list, \"Gandhinagar\");\necho \"pushed/popped: \", array_pop($list), \" popped; now \", count($list), \"\\n\";\n\n// list() unpacks slots; explode/implode bridge strings\nlist($a, $b, $c) = [\"red\", \"green\", \"blue\"];\necho \"list() : $a | $b | $c\\n\";\necho \"explode: \", count(explode(\",\", \"12A,14C,3B\")), \" seat codes\\n\";\n?>"}, "out": "$ php index.php\ncount     : 4\nin_array  : true\nkey exists: true\ncheapest first -> bread:45, milk:62, eggs:78, tea:140\nsorted list : Ahmedabad, Surat, Vadodara\nmerged keys : jam, milk, bread, eggs, tea\nreversed    : Vadodara, Surat, Ahmedabad\npushed/popped: Gandhinagar popped; now 3\nlist() : red | green | blue\nexplode: 3 seat codes", "expl": {"en": "<p>Highlights: <code>asort</code> sorts by value <i>keeping keys glued</i> (<code>sort</code> renumbers and destroys names); <code>array_merge</code> glues arrays; <code>array_push/pop</code> treat the end like a stack; <code>list()</code> unpacks a small array into variables; <code>explode/implode</code> convert CSV text to arrays and back.</p>"}}, {"id": "wd2p10", "title": {"en": "Quoting styles: single, double, heredoc, nowdoc (Practical 10)"}, "code": {"en": "<?php\n$city = \"Surat\";\n$fare = 260;\n\necho 'single : Fare to $city is $fare', \"\\n\";     // literal\necho \"double : Fare to $city is Rs $fare\\n\";      // variables expand\n\n// heredoc - multi-line block WITH interpolation (like double quotes)\necho <<<EOT\n--- RECEIPT ---\nRoute : $city Express\nFare  : Rs {$fare}.00\nThanks for riding with us!\nEOT;\necho \"\\n\";\n\n// nowdoc - multi-line AND literal (like single quotes)\necho <<<'EOT'\nSample code: echo \"Fare: $fare\";   // printed as-is\nUseful for showing code or raw SQL text.\nEOT;\n\necho \"\\nescapes: tab\\\\t works in double quotes only ->\\t<- here\\n\";\necho \"html escape: \", htmlspecialchars(\"<b>bold</b>\"), \"\\n\";\n?>"}, "out": "$ php index.php\nsingle : Fare to $city is $fare\ndouble : Fare to Surat is Rs 260\n--- RECEIPT ---\nRoute : Surat Express\nFare  : Rs 260.00\nThanks for riding with us!\nSample code: echo \"Fare: $fare\";   // printed as-is\nUseful for showing code or raw SQL text.\nescapes: tab\\t works in double quotes only ->\t<- here\nhtml escape: &lt;b&gt;bold&lt;/b&gt;", "expl": {"en": "<p>Four ways to hold text: <i>single</i> quotes print everything literally; <i>double</i> quotes expand <code>$vars</code>; <b>heredoc</b> is a multi-line double-quoted block (markers at line starts); <b>nowdoc</b> (<code>&lt;&lt;&lt;'EOT'</code>) is its literal twin. Escapes like <code>\\t</code>/<code>\\n</code> work only in double-quoted/heredoc text, and <code>htmlspecialchars()</code> neutralises tags before echoing user content.</p>"}}, {"id": "wd2p11", "title": {"en": "String functions: search, replace, compare (Practical 10)"}, "code": {"en": "<?php\n$name = \"  Surat Express  \";\necho \"strlen : \", strlen($name), \"\\n\";                 // includes spaces!\necho \"trim   : '\", trim($name), \"'\\n\";\necho \"case   : \", strtoupper(trim($name)), \" -> \", ucwords(strtolower(trim($name))), \"\\n\";\n\n$s = \"Surat to Ahmedabad\";\necho \"substr : \", substr($s, 0, 5), \" / \", substr($s, -9), \"\\n\";\n\n$pos = strpos($s, \"to\");\necho \"strpos : \", var_export($pos, true), \"\\n\";        // 6\necho \"miss   : \", var_export(strpos($s, \"zzz\"),\n    true), \"  (== false would misfire on position 0)\\n\";\nif (strpos($s, \"Surat\") === false) { echo \"not found\\n\"; } else { echo \"Surat found\\n\"; }\necho \"stristr: \", stristr($s, \"TO\"), \"\\n\";             // case-insensitive, rest-of-string\n\necho \"replace: \", str_replace(\"to\", \"-\", $s), \"\\n\";\necho \"strrev : \", strrev(\"madam\"), \"\\n\";\necho \"repeat : \", str_repeat(\"-\", 20), \"\\n\";\n\necho \"strcmp : \", strcmp(\"apple\", \"apply\"), \"  strcasecmp: \", strcasecmp(\"PHP\", \"php\"), \"\\n\";\necho \"chr/ord: \", chr(65), \" / \", ord(\"A\"), \"\\n\";\n?>"}, "out": "$ php index.php\nstrlen : 17\ntrim   : 'Surat Express'\ncase   : SURAT EXPRESS -> Surat Express\nsubstr : Surat / Ahmedabad\nstrpos : 6\nmiss   : false  (== false would misfire on position 0)\nSurat found\nstristr: to Ahmedabad\nreplace: Surat - Ahmedabad\nstrrev : madam\nrepeat : --------------------\nstrcmp : -20  strcasecmp: 0\nchr/ord: A / 65", "expl": {"en": "<p>The string toolkit: measure (<code>strlen</code>), clean (<code>trim</code>, case fixers), slice (<code>substr</code>, negative length reads from the end), locate (<code>strpos</code> 0-based or <b>false</b>; <code>stristr</code> case-insensitive), mutate (<code>str_replace</code>, <code>strrev</code>, <code>str_repeat</code>), compare (<code>strcmp/strcasecmp</code>) and hop between characters and codes (<code>chr/ord</code>). Golden rule: test <code>strpos(...) === false</code> - never <code>== false</code>.</p>"}}], "diagrams": [{"id": "wd2_anatomy", "title": {"en": "Anatomy of a PHP Function"}, "file": "diagrams/wd2_anatomy.svg"}, {"id": "wd2_value_ref", "title": {"en": "By Value vs By Reference"}, "file": "diagrams/wd2_value_ref.svg"}, {"id": "wd2_scope", "title": {"en": "Variable Scope: Rooms of the Script"}, "file": "diagrams/wd2_scope.svg"}, {"id": "wd2_array_types", "title": {"en": "Three Flavours of PHP Arrays"}, "file": "diagrams/wd2_array_types.svg"}, {"id": "wd2_foreach_map", "title": {"en": "foreach: Streaming an Array"}, "file": "diagrams/wd2_foreach_map.svg"}, {"id": "wd2_array_funcs", "title": {"en": "Array Function Toolbox"}, "file": "diagrams/wd2_array_funcs.svg"}, {"id": "wd2_quotes", "title": {"en": "Four Ways to Write a String"}, "file": "diagrams/wd2_quotes.svg"}, {"id": "wd2_string_funcs", "title": {"en": "String Function Toolbox"}, "file": "diagrams/wd2_string_funcs.svg"}], "syntax": [{"title": {"en": "Function cards"}, "items": [{"name": {"en": "define + call"}, "f": "function fare($km, $rate = 1.2) {\n    return $km * $rate;\n}\necho fare(265);       // 318\necho fare(265, 1.5);  // override", "terms": {"en": "defaults cover skipped args"}}, {"name": {"en": "value vs ref"}, "f": "function f($n)   copy   safe\nfunction f(&$n)  & = caller's box\nswap($a,$b) needs &\nsort($a) is built-in &", "terms": {"en": "default copy; & modifies"}}, {"name": {"en": "scope trio"}, "f": "local   $tip dies with call\nglobal  global $t; / $GLOBALS['t']\nstatic  static $c remembers", "terms": {"en": "pass in, return out"}}]}, {"title": {"en": "Array cards"}, "items": [{"name": {"en": "make + walk"}, "f": "$c = [\"Surat\",\"Bharuch\"];\n$f = [\"SRT\"=>250];\n$c[] = \"AMD\";        append\nforeach ($f as $k=>$v) {...}", "terms": {"en": "positions or named keys"}}, {"name": {"en": "sort family"}, "f": "sort / rsort   renumber keys\nasort / arsort by VALUE keep keys\nksort / krsort by KEY", "terms": {"en": "assoc arrays need asort/ksort"}}, {"name": {"en": "toolbox"}, "f": "count in_array array_merge\narray_reverse array_push/pop\nimplode(\",\",$a) explode(\",\",$s)\nlist($a,$b) = $pair;", "terms": {"en": "measure find glue flip unpack"}}]}, {"title": {"en": "String cards"}, "items": [{"name": {"en": "four quotes"}, "f": "'literal $x'\n\"expands $x\"\n<<<EOT multi-line with vars EOT;\n<<<'EOT' multi-line raw EOT;", "terms": {"en": "heredoc = doubles, nowdoc = singles"}}, {"name": {"en": "shape strings"}, "f": "strlen trim ltrim rtrim\nstrtolower strtoupper ucwords\nsubstr($s, 0, 3)\nsubstr($s, -3) from the end", "terms": {"en": "measure clean slice"}}, {"name": {"en": "find + change"}, "f": "strpos($h, $n) 0-based / false\n=== false is the ONLY safe test\nstr_replace strrev str_repeat\nstrcmp strcasecmp chr ord", "terms": {"en": "0 is position, not 'found nothing'"}}]}], "viva": [{"title": {"en": "Functions and Scope"}, "items": [{"q": {"en": "How do you define and call a PHP function?"}, "a": {"en": "function fare($km) { ... return $v; } defines it globally; call by name with arguments: fare(265)."}}, {"q": {"en": "Parameters vs arguments?"}, "a": {"en": "Parameters are the placeholders in the definition ($km); arguments are the actual values at the call (265)."}}, {"q": {"en": "What does return do?"}, "a": {"en": "Hands exactly one value back to the caller and ends the function; return an array when you need several results."}}, {"q": {"en": "What are default (optional) parameters?"}, "a": {"en": "Parameters with preset values - function f($km, $rate = 1.2); callers may omit them; required params come first."}}, {"q": {"en": "Passing by value vs by reference?"}, "a": {"en": "By value passes a copy (default - caller's variable is safe); &$n passes the original, so the function can modify it (swap, accumulate)."}}, {"q": {"en": "Why does sort($a) change the array without returning?"}, "a": {"en": "sort is a built-in pass-by-reference function - it edits the caller's array directly."}}, {"q": {"en": "What is variable scope?"}, "a": {"en": "Where a variable is visible: function locals die with the call; script-level globals sit outside; neither sees the other by default."}}, {"q": {"en": "How do you access a global inside a function?"}, "a": {"en": "Declare global $total; at the top of the function, or use $GLOBALS['total'] - the super-global array."}}, {"q": {"en": "What is a static local variable?"}, "a": {"en": "static $c = 0; inside a function keeps its value between calls - a private counter."}}, {"q": {"en": "Why prefer parameters over global?"}, "a": {"en": "Globals tangle dependencies and are hard to test; parameters + return keep functions self-contained and reusable."}}]}, {"title": {"en": "Math and Date Built-ins"}, "items": [{"q": {"en": "Name six mathematical built-ins."}, "a": {"en": "round, floor, ceil, abs, max/min, pow, sqrt, intdiv, rand/random_int."}}, {"q": {"en": "round vs floor vs ceil?"}, "a": {"en": "round() nearest (optional decimals); floor() always down; ceil() always up - money displays use round($x, 2)."}}, {"q": {"en": "rand() vs random_int()?"}, "a": {"en": "Both pick integers in a range; random_int is cryptographically secure - use it for OTPs and anything security-related."}}, {"q": {"en": "What does is_numeric(\"12.5\") return?"}, "a": {"en": "true - it validates numeric-looking strings before you calculate with form input."}}, {"q": {"en": "What does date('d M Y') produce?"}, "a": {"en": "e.g. 29 Oct 2026 - date() renders a timestamp using format letters (default: right now)."}}, {"q": {"en": "What is a Unix timestamp?"}, "a": {"en": "Seconds elapsed since 1 Jan 1970 (UTC); time() returns it - arithmetic-ready, e.g. +86400 is tomorrow."}}, {"q": {"en": "mktime vs strtotime?"}, "a": {"en": "mktime(h,m,s,mon,day,year) builds a timestamp from parts; strtotime('next Monday') parses English text into a timestamp."}}, {"q": {"en": "How do you compute days between two dates?"}, "a": {"en": "date_diff(date_create($a), date_create($b))->days - or subtract timestamps and divide by 86400."}}, {"q": {"en": "Why set date_default_timezone_set?"}, "a": {"en": "So date/time functions speak local time - Asia/Kolkata for Indian projects; otherwise they use UTC."}}]}, {"title": {"en": "Arrays"}, "items": [{"q": {"en": "What are the two indexing habits of PHP arrays?"}, "a": {"en": "Indexed arrays have numeric keys from 0; associative arrays map named keys to values - one ordered-map type serves both."}}, {"q": {"en": "How do you append to an array?"}, "a": {"en": "$a[] = $v; for the next numeric slot, or $a['key'] = $v; under a named key; unset($a['key']) deletes."}}, {"q": {"en": "Read $students[2]['marks'][1]?"}, "a": {"en": "Third element (index 2), its 'marks' sub-array, element 1 - chained brackets descend dimensions."}}, {"q": {"en": "Give a real use of a multidimensional array."}, "a": {"en": "A students table: each element is a record [roll, name, marks[subject=>score]] - a spreadsheet in memory."}}, {"q": {"en": "Two forms of foreach?"}, "a": {"en": "foreach ($a as $v) for values; foreach ($a as $k => $v) when keys matter - it resets the array pointer automatically."}}, {"q": {"en": "What do current(), next(), end() do?"}, "a": {"en": "They walk the array's internal pointer manually - foreach drives this pointer for you."}}, {"q": {"en": "sort vs asort - the danger?"}, "a": {"en": "sort renumbers keys 0..n, destroying assoc key names; asort sorts by value keeping key-value pairs intact (ksort by key)."}}, {"q": {"en": "in_array vs array_key_exists?"}, "a": {"en": "in_array($v,$a) searches VALUES; array_key_exists('k',$a) searches KEYS; array_search returns the matching key."}}, {"q": {"en": "array_push/array_pop do what?"}, "a": {"en": "Add/remove at the END - stack behaviour; array_shift/unshift work the front."}}, {"q": {"en": "implode and explode?"}, "a": {"en": "implode(',', $a) joins an array into a string; explode(',', $s) splits a string into an array - the CSV bridge."}}, {"q": {"en": "What does list() do?"}, "a": {"en": "Unpacks array slots into named variables: list($r, $g, $b) = [255, 128, 0];"}}]}, {"title": {"en": "Strings"}, "items": [{"q": {"en": "Difference between single and double quotes?"}, "a": {"en": "Single quotes are literal ('$x' prints $x); double quotes interpolate variables (\"$x\" expands). Which escapes work? \\n \\t \\$ only in double quotes/heredoc."}}, {"q": {"en": "What is heredoc?"}, "a": {"en": "&lt;&lt;&lt;EOT ... EOT; - a multi-line string that expands variables, like double quotes without quote juggling."}}, {"q": {"en": "What is nowdoc?"}, "a": {"en": "&lt;&lt;&lt;'EOT' ... EOT; - heredoc's literal twin: multi-line, no interpolation; ideal for raw code/SQL text."}}, {"q": {"en": "Why htmlspecialchars() before echoing user text?"}, "a": {"en": "It neutralises < > & \" ' into entities so user input cannot inject HTML/JS into your pages."}}, {"q": {"en": "strlen/substr examples?"}, "a": {"en": "strlen('Surat') = 5; substr('Surat', 0, 3) = 'Sur'; substr('Surat', -3) = 'rat' (negative = from the end)."}}, {"q": {"en": "strpos gotcha?"}, "a": {"en": "Returns 0-based position OR false; position 0 is falsy, so test === false or you misread a match at the start."}}, {"q": {"en": "strstr vs stristr?"}, "a": {"en": "Both return the haystack from the first needle onward; stristr ignores case. strpos only returns a position."}}, {"q": {"en": "strcmp return values?"}, "a": {"en": "Negative / zero / positive for less / equal / greater - feeds usort comparison callbacks; strcasecmp ignores case."}}, {"q": {"en": "chr and ord?"}, "a": {"en": "chr(65) -> 'A'; ord('A') -> 65 - convert between characters and ASCII/byte codes."}}, {"q": {"en": "Which Unit 2 functions would power a grade sheet?"}, "a": {"en": "A marks array per student, foreach totals, max/min, asort for rank order, and a function returning the grade ladder from Unit 1."}}]}], "exam_questions": [{"q": {"en": "Explain user-defined functions in PHP: definition, calling, parameters vs arguments, return value - with an example. (Practical 6)"}, "marks": 6}, {"q": {"en": "Explain default parameters. Write fare($km, $rate = 1.2) and show calls that use and override the default."}, "marks": 4}, {"q": {"en": "Distinguish pass-by-value from pass-by-reference. Write swap(&$a, &$b) and prove the difference with output. (Practical 6)"}, "marks": 6}, {"q": {"en": "Explain local, global and static scope with one small program demonstrating all three."}, "marks": 6}, {"q": {"en": "Write a program demonstrating six mathematical built-ins (round, floor, ceil, max, pow, random_int)."}, "marks": 4}, {"q": {"en": "Write a program that prints today's date in two formats, a travel date built with mktime, and the days remaining until the trip."}, "marks": 6}, {"q": {"en": "Create an indexed array of cities and an associative array of code-to-fare pairs; append, update, delete and display both. (Practical 7)"}, "marks": 6}, {"q": {"en": "Build a multidimensional student table (roll, name, marks per subject) and print each student's total with nested foreach. (Practical 7)"}, "marks": 6}, {"q": {"en": "Process a bookings array: total, average, maximum, minimum, and a filtered list of premium bookings (>= 300). (Practical 8)"}, "marks": 6}, {"q": {"en": "Demonstrate count, in_array, asort, ksort, array_merge, array_reverse, array_push/pop and implode on one array. Explain why sort() endangers associative arrays. (Practical 9)"}, "marks": 6}, {"q": {"en": "Compare single quotes, double quotes, heredoc and nowdoc with a receipt-printing example. (Practical 10)"}, "marks": 4}, {"q": {"en": "Write a program demonstrating strlen, trim, strtoupper, ucwords, substr, strpos (with the === false rule), str_replace, strrev, strcmp, chr and ord. (Practical 10)"}, "marks": 6}, {"q": {"en": "A page must display user comments - explain the quoting and escaping choices (double quotes + htmlspecialchars) and show one safe echo."}, "marks": 4}, {"q": {"en": "Write a function gstSlab($amount) returning the GST-inclusive fare, used by three different routes - emphasise why functions beat copy-paste."}, "marks": 4}]};
const SVG = {"wd2_anatomy": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 246\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"246\" fill=\"#ffffff\"/><text x=\"180\" y=\"23.1\" font-size=\"14.5\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">Anatomy of a PHP Function</text><text font-family=\"DejaVu Sans Mono, Consolas, monospace\" x=\"24\" y=\"66.9\" font-size=\"8.2\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">function fare($km, $rate = 1.2) {</text><text font-family=\"DejaVu Sans Mono, Consolas, monospace\" x=\"24\" y=\"81.9\" font-size=\"8.2\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">    $total = 250 + $km * $rate;</text><text font-family=\"DejaVu Sans Mono, Consolas, monospace\" x=\"24\" y=\"96.9\" font-size=\"8.2\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">    return $total;</text><text font-family=\"DejaVu Sans Mono, Consolas, monospace\" x=\"24\" y=\"111.9\" font-size=\"8.2\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">}</text><text font-family=\"DejaVu Sans Mono, Consolas, monospace\" x=\"24\" y=\"126.9\" font-size=\"8.2\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\"></text><text font-family=\"DejaVu Sans Mono, Consolas, monospace\" x=\"24\" y=\"141.9\" font-size=\"8.2\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">echo fare(265);   // 318 + 250 = 568</text><path d=\"M196 61 L230 61\" fill=\"none\" stroke=\"#2E7D32\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polygon points=\"236.0,61.0 229.0,57.5 229.0,64.5\" fill=\"#2E7D32\"/><text x=\"238\" y=\"66.7\" font-size=\"7.8\" text-anchor=\"start\" fill=\"#2E7D32\" font-weight=\"bold\">name + params (in)</text><path d=\"M196 76 L230 76\" fill=\"none\" stroke=\"#E07B00\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polygon points=\"236.0,76.0 229.0,72.5 229.0,79.5\" fill=\"#E07B00\"/><text x=\"238\" y=\"81.7\" font-size=\"7.8\" text-anchor=\"start\" fill=\"#E07B00\" font-weight=\"bold\">default if skipped</text><path d=\"M196 91 L230 91\" fill=\"none\" stroke=\"#1565C0\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polygon points=\"236.0,91.0 229.0,87.5 229.0,94.5\" fill=\"#1565C0\"/><text x=\"238\" y=\"96.7\" font-size=\"7.8\" text-anchor=\"start\" fill=\"#1565C0\" font-weight=\"bold\">return: value back</text><path d=\"M196 151 L230 151\" fill=\"none\" stroke=\"#7B2CD9\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polygon points=\"236.0,151.0 229.0,147.5 229.0,154.5\" fill=\"#7B2CD9\"/><text x=\"238\" y=\"156.7\" font-size=\"7.8\" text-anchor=\"start\" fill=\"#7B2CD9\" font-weight=\"bold\">call: name(args)</text><rect x=\"12\" y=\"178\" width=\"336\" height=\"70\" rx=\"7\" fill=\"#E3F0FC\" stroke=\"#1565C0\" stroke-width=\"1.1\"/><text x=\"20\" y=\"196.2\" font-size=\"9.0\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">params = inputs at the doorway; return =</text><text x=\"20\" y=\"211.2\" font-size=\"9.0\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">exactly one value back; the body never</text><text x=\"20\" y=\"226.2\" font-size=\"9.0\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">echoes - it COMPUTES. Name rule: letter or</text><text x=\"20\" y=\"241.2\" font-size=\"9.0\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">underscore first, no $ on the name.</text></svg>", "wd2_value_ref": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 250\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"250\" fill=\"#ffffff\"/><text x=\"180\" y=\"23.1\" font-size=\"14.5\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">By Value vs By Reference</text><rect x=\"12\" y=\"46\" width=\"158\" height=\"128\" rx=\"8\" fill=\"#E3F0FC\" stroke=\"#1565C0\" stroke-width=\"1.2\"/><text x=\"91\" y=\"67.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#1565C0\" font-weight=\"bold\">BY VALUE (copy)</text><text font-family=\"DejaVu Sans Mono, Consolas, monospace\" x=\"24\" y=\"84.7\" font-size=\"7.6\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">function add($n) {</text><text font-family=\"DejaVu Sans Mono, Consolas, monospace\" x=\"24\" y=\"97.7\" font-size=\"7.6\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">    $n += 10;</text><text font-family=\"DejaVu Sans Mono, Consolas, monospace\" x=\"24\" y=\"110.7\" font-size=\"7.6\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">}</text><text font-family=\"DejaVu Sans Mono, Consolas, monospace\" x=\"24\" y=\"123.7\" font-size=\"7.6\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">$x = 5;</text><text font-family=\"DejaVu Sans Mono, Consolas, monospace\" x=\"24\" y=\"136.7\" font-size=\"7.6\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">add($x);</text><text font-family=\"DejaVu Sans Mono, Consolas, monospace\" x=\"24\" y=\"149.7\" font-size=\"7.6\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">// $x still 5</text><rect x=\"192\" y=\"46\" width=\"158\" height=\"128\" rx=\"8\" fill=\"#FFF1DE\" stroke=\"#E07B00\" stroke-width=\"1.2\"/><text x=\"271\" y=\"67.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#E07B00\" font-weight=\"bold\">BY REFERENCE (&amp;)</text><text font-family=\"DejaVu Sans Mono, Consolas, monospace\" x=\"204\" y=\"84.7\" font-size=\"7.6\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">function add(&amp;$n) {</text><text font-family=\"DejaVu Sans Mono, Consolas, monospace\" x=\"204\" y=\"97.7\" font-size=\"7.6\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">    $n += 10;</text><text font-family=\"DejaVu Sans Mono, Consolas, monospace\" x=\"204\" y=\"110.7\" font-size=\"7.6\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">}</text><text font-family=\"DejaVu Sans Mono, Consolas, monospace\" x=\"204\" y=\"123.7\" font-size=\"7.6\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">$x = 5;</text><text font-family=\"DejaVu Sans Mono, Consolas, monospace\" x=\"204\" y=\"136.7\" font-size=\"7.6\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">add($x);</text><text font-family=\"DejaVu Sans Mono, Consolas, monospace\" x=\"204\" y=\"149.7\" font-size=\"7.6\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">// $x is 15 !</text><rect x=\"12\" y=\"188\" width=\"336\" height=\"70\" rx=\"7\" fill=\"#E3F0FC\" stroke=\"#1565C0\" stroke-width=\"1.1\"/><text x=\"20\" y=\"206.2\" font-size=\"9.2\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">Default: PHP photocopies the argument -</text><text x=\"20\" y=\"221.2\" font-size=\"9.2\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">the original survives the call. With &amp; the</text><text x=\"20\" y=\"236.2\" font-size=\"9.2\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">function borrows the ORIGINAL box itself:</text><text x=\"20\" y=\"251.2\" font-size=\"9.2\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">swap($a,$b) style updates need it.</text></svg>", "wd2_scope": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 246\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"246\" fill=\"#ffffff\"/><text x=\"180\" y=\"23.1\" font-size=\"14.5\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">Variable Scope: Rooms of the Script</text><rect x=\"16\" y=\"48\" width=\"150\" height=\"120\" rx=\"8\" fill=\"#E3F5E6\" stroke=\"#2E7D32\" stroke-width=\"1.2\"/><text x=\"91\" y=\"69.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#2E7D32\" font-weight=\"bold\">INSIDE function</text><text font-family=\"DejaVu Sans Mono, Consolas, monospace\" x=\"28\" y=\"86.7\" font-size=\"7.6\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">function bill() {</text><text font-family=\"DejaVu Sans Mono, Consolas, monospace\" x=\"28\" y=\"9     else if (m[4]) o += KW.has(m[4]) ? `<span class="kw">${w}</span>` : TY.has(m[4]) ? `<span class="ty">${w}</span>` : `<span class="fn">${w}</span>`;
    else if (m[5]) o += KW.has(m[5]) ? `<span class="kw">${w}</span>` : TY.has(m[5]) ? `<span class="ty">${w}</span>` : w;
    else o += `<span class="nu">${w}</span>`;
  }
  return o + esc(src.slice(last));
}
const progBody = p => `<div class="pl">${L('code')}</div><pre class="code">${hl(t(p.code))}</pre><div class="pl">${L('output')}</div><pre class="out">${esc(p.out)}</pre>${p.plot?`<div class="pl">${L('plot')}</div>`+dgInline(p.plot).replace('class="dg"','class="dg pg"'):''}${p.expl?`<div class="pl">${L('expl')}</div>${fixTables(t(p.expl))}`:''}`;
const pBox = id => { const p=(U.programs||[]).find(x=>x.id===id); if(!p) return ''; return `<div class="pbox"><div class="et">${L('prog')}: ${t(p.title)}</div>${progBody(p)}</div>`; };
const exBox = id => { const n=(U.numericals||[]).find(x=>x.id===id); if(!n) return ''; return `<div class="ex"><div class="et">${L('ex')}</div><div class="eq2">${t(n.q)}</div>${fixTables(t(n.a))}</div>`; };
function notes(){
  let h = `<div class="intro"><b>${t(U.title)}</b><div>${L('unit')} ${U.unit} · ${U.weightage}% ${L('intro')} · ${U.hours} ${L('hours')}</div><div>${L(U.programs?(META.code_lang==='python'?'intropy':'introc'):'introd')}</div></div>`;
  U.notes.forEach((sec,si)=>{
    h += `<div class="sec">${head(t(sec.title))}`;
    sec.items.forEach((it,i)=>{
      const open = si===0&&i===0 ? ' open' : '';
      if (it.h) {
        h += `<div class="card${it.key?' key':''}${open}"><div class="q hd"><span class="t">${it.key?'⭐ ':''}${t(it.h)}</span>${chev}</div>
        <div class="a rn" style="padding-left:18px">${fixTables(t(it.body)).replace(/margin:0 0 10px -36px/g,'')}${it.diagram?dgInline(it.diagram):''}${(it.examples||[]).map(exBox).join('')}${(it.programs||[]).map(pBox).join('')}</div></div>`;
      } else {
        h += `<div class="card${open}"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(it.q)}</span>${chev}</div>
        <div class="a">${fixTables(t(it.a))}${it.diagram?dgInline(it.diagram):''}</div></div>`;
      }
    });
    h += `</div>`;
  });
  return h;
}
function numericals(){
  return `<div class="sec">${head(L('numericals'))}` + (U.numericals||[]).map((n,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(n.q)}</span>${chev}</div><div class="a">${fixTables(t(n.a))}</div></div>`).join('') + `</div>`;
}
function diagrams(){
  return `<div class="sec">${head(L(U.programs&&META.code_lang!=='python'?'flowcharts':'diagrams'),false)}<div style="height:10px"></div>` + U.diagrams.map((d,i)=>
    `<div class="dcard" data-dg="${d.id}"><div class="h">${i+1}. ${t(d.title)}</div>${SVG[d.id]}</div>`).join('') + `</div>`;
}
function equations(){
  return U.equations.map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><span class="fbox">${e.f}</span></span>${chev}</div>
     <div class="a"><p>${t(e.terms)}</p></div></div>`).join('') + `</div>`).join('');
}
function viva(){
  return U.viva.map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((v,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(v.q)}</span>${chev}</div><div class="a"><p>${t(v.a)}</p></div></div>`).join('') + `</div>`).join('');
}
function exam(){
  return `<div class="sec">${head(L('examhead'),false)}` + U.exam_questions.map((x,i)=>
    `<div class="card"><div class="q" style="cursor:default"><span class="n">${i+1}.</span><span class="t">${t(x.q)}</span><span class="mk">${x.marks} ${L('marks')}</span></div></div>`).join('') + `</div>`;
}
function programs(){
  return `<div class="sec">${head(L('programs'))}` + (U.programs||[]).map((p,i)=>
    `<div class="card"><div class="q hd"><span class="n">${i+1}.</span><span class="t">${t(p.title)}</span>${chev}</div><div class="a pa">${progBody(p)}</div></div>`).join('') + `</div>`;
}
function syntax(key){
  return (U[typeof key==='string'?key:'syntax']||[]).map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><pre class="code sx">${hl(e.f)}</pre></span>${chev}</div>
     <div class="a">${e.terms && t(e.terms) ? fixTables(t(e.terms)) : ''}</div></div>`).join('') + `</div>`).join('');
}
const flowcharts = diagrams;
const algorithms = () => syntax('algorithms');
const ALLV = {notes, programs, diagrams, flowcharts, algorithms, syntax, equations, numericals, viva, exam};
const VIEWS = U.tabs ? Object.fromEntries(U.tabs.map(k=>[k, ALLV[k]])) : U.programs ? (META.code_lang==='python' ? {notes, programs, diagrams, syntax, viva, exam} : {notes, programs, flowcharts, syntax, viva, exam}) : U.numericals ? {notes, diagrams, equations, numericals, viva, exam} : {notes, diagrams, equations, viva, exam};
function render(){
  document.getElementById('title').textContent = `${L('unit')} ${U.unit}: ${t(U.title)}`;
  document.getElementById('sub').textContent = `${t(META.name)} · ${META.code}`;
  document.getElementById('lang').textContent = S.lang==='en' ? 'ગુ' : 'EN';
  document.getElementById('lang').style.display = META.languages.includes('gu') ? '' : 'none';
  document.getElementById('tabs').innerHTML = Object.keys(VIEWS).map(k=>`<button class="tab${S.tab===k?' on':''}" data-tab="${k}">${L(k)}</button>`).join('');
  document.getElementById('view').innerHTML = VIEWS[S.tab]();
  document.querySelectorAll('#view pre.c').forEach(e=>{ e.innerHTML = hl(e.textContent); e.className='code'; });
}
let zoom = 1;
function setZoom(z){ zoom = Math.min(4, Math.max(1, z)); const w=document.getElementById('zw'); w.style.width=(zoom*100)+'%'; document.getElementById('zr').textContent=Math.round(zoom*100)+'%'; }
document.addEventListener('click', e=>{
  const q = e.target.closest('.q'); if (q && q.parentElement.querySelector('.a')) { q.parentElement.classList.toggle('open'); return; }
  const tb = e.target.closest('[data-tab]'); if (tb){ S.tab = tb.dataset.tab; render(); window.scrollTo(0,0); return; }
  if (e.target.closest('#lang')){ S.lang = S.lang==='en'?'gu':'en'; render(); return; }
  const m = e.target.closest('[data-more]');
  document.querySelectorAll('.menu.show').forEach(x=>{ if(!m || x!==m.nextElementSibling) x.classList.remove('show'); });
  if (m){ m.nextElementSibling.classList.toggle('show'); return; }
  const act = e.target.closest('[data-act]');
  if (act){ act.closest('.sec').querySelectorAll('.card').forEach(c=>{ if(c.querySelector('.a')) c.classList.toggle('open', act.dataset.act==='expand'); }); act.parentElement.classList.remove('show'); return; }
  const dg = e.target.closest('[data-dg]');
  if (dg){ const id=dg.dataset.dg; document.getElementById('mt').textContent=t(U.diagrams.find(d=>d.id===id).title); document.getElementById('zw').innerHTML=SVG[id]; setZoom(1); document.getElementById('modal').classList.add('show'); return; }
  if (e.target.closest('#mx')) document.getElementById('modal').classList.remove('show');
  if (e.target.closest('#zi')) setZoom(zoom+0.5);
  if (e.target.closest('#zo')) setZoom(zoom-0.5);
  if (e.target.closest('#zr')) setZoom(1);
});
render();
</script></body></html>
