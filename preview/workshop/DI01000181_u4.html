const SVG = {"u4_tree": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 348\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"348\" fill=\"#ffffff\"/><text x=\"180.0\" y=\"24.3\" font-size=\"12.2\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"bold\">Classification of non-metallic materials</text><text x=\"180.0\" y=\"40.2\" font-size=\"9.2\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">four families, and what each one is for</text><rect x=\"6.0\" y=\"46.0\" width=\"172.0\" height=\"98.0\" rx=\"6\" fill=\"#EEF4FC\" stroke=\"#9AA3AD\" stroke-width=\"0.9\"/><text x=\"92\" y=\"63.8\" font-size=\"8.0\" text-anchor=\"middle\" fill=\"#1565C0\" font-weight=\"bold\">POLYMERS</text><text x=\"92\" y=\"82.3\" font-size=\"6.5\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"normal\">thermoplastic: PE, PP, PVC, nylon</text><text x=\"92\" y=\"94.3\" font-size=\"6.5\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"normal\">thermoset: epoxy, bakelite, PU</text><text x=\"92\" y=\"106.3\" font-size=\"6.5\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"normal\">elastomer: natural, SBR, NBR</text><text x=\"92\" y=\"132.2\" font-size=\"6.2\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">rubber, seals, tanks</text><rect x=\"182.0\" y=\"46.0\" width=\"172.0\" height=\"98.0\" rx=\"6\" fill=\"#FFF6EC\" stroke=\"#9AA3AD\" stroke-width=\"0.9\"/><text x=\"268\" y=\"63.8\" font-size=\"8.0\" text-anchor=\"middle\" fill=\"#B66A00\" font-weight=\"bold\">CERAMICS</text><text x=\"268\" y=\"82.3\" font-size=\"6.5\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"normal\">traditional: brick, tile, cement</text><text x=\"268\" y=\"94.3\" font-size=\"6.5\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"normal\">advanced: alumina, SiC, Si3N4</text><text x=\"268\" y=\"106.3\" font-size=\"6.5\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"normal\">glass, porcelain, enamel</text><text x=\"268\" y=\"132.2\" font-size=\"6.2\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">bricks, inserts, pots</text><rect x=\"6.0\" y=\"150.0\" width=\"172.0\" height=\"98.0\" rx=\"6\" fill=\"#EAF4F2\" stroke=\"#9AA3AD\" stroke-width=\"0.9\"/><text x=\"92\" y=\"167.8\" font-size=\"8.0\" text-anchor=\"middle\" fill=\"#00695C\" font-weight=\"bold\">COMPOSITES</text><text x=\"92\" y=\"186.3\" font-size=\"6.5\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"normal\">FRP: glass or carbon in epoxy</text><text x=\"92\" y=\"198.3\" font-size=\"6.5\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"normal\">MMC: SiC particles in aluminium</text><text x=\"92\" y=\"210.3\" font-size=\"6.5\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"normal\">plywood, GRP tank, blade</text><text x=\"92\" y=\"236.2\" font-size=\"6.2\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">light panels, blades</text><rect x=\"182.0\" y=\"150.0\" width=\"172.0\" height=\"98.0\" rx=\"6\" fill=\"#EDF6EE\" stroke=\"#9AA3AD\" stroke-width=\"0.9\"/><text x=\"268\" y=\"167.8\" font-size=\"8.0\" text-anchor=\"middle\" fill=\"#2E7D32\" font-weight=\"bold\">NATURAL AND ORGANIC</text><text x=\"268\" y=\"186.3\" font-size=\"6.5\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"normal\">wood, cork, leather, cotton</text><text x=\"268\" y=\"198.3\" font-size=\"6.5\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"normal\">felt, paper, bitumen</text><text x=\"268\" y=\"210.3\" font-size=\"6.5\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"normal\">gaskets, packing, damping</text><text x=\"268\" y=\"236.2\" font-size=\"6.2\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">cheap, quiet, soft</text><rect x=\"6.0\" y=\"258.0\" width=\"348.0\" height=\"58.0\" rx=\"5\" fill=\"#F5EEFD\" stroke=\"#7B2CD9\" stroke-width=\"1\"/><text x=\"180.0\" y=\"272.9\" font-size=\"8.2\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">why a machine needs a non-metal at all</text><text x=\"180.0\" y=\"286.7\" font-size=\"7.6\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"normal\">light and cheap and they do not rust: guards, tanks, handles, seals</text><text x=\"180.0\" y=\"298.2\" font-size=\"7.6\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"normal\">they insulate - a busbar is useless without a porcelain support</text><text x=\"180.0\" y=\"309.7\" font-size=\"7.6\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"normal\">they run quiet: nylon gears, rubber mounts, cork and felt gaskets</text><text x=\"180.0\" y=\"329.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">Metals are strong and stiff; non-metals are light, insulating, quiet and cheap.</text><text x=\"180.0\" y=\"341.5\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">A design that uses only metal is either noisy, heavy or dangerous to touch.</text></svg>", "u4_rubber": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 322\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"322\" fill=\"#ffffff\"/><text x=\"180.0\" y=\"24.3\" font-size=\"12.2\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"bold\">Vulcanisation: what sulphur does to rubber</text><text x=\"180.0\" y=\"40.2\" font-size=\"9.2\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">raw gum against a cured compound</text><path d=\"M44.0 214.0L44.0 60.0\" fill=\"none\" stroke=\"#222222\" stroke-width=\"1.3\" stroke-linecap=\"round\"/><path d=\"M42.2 65.0L44.0 60.0L45.8 65.0Z\" fill=\"#222222\"/><path d=\"M44.0 214.0L318.0 214.0\" fill=\"none\" stroke=\"#222222\" stroke-width=\"1.3\" stroke-linecap=\"round\"/><path d=\"M313.0 212.2L318.0 214.0L313.0 215.8Z\" fill=\"#222222\"/><path d=\"M44.0 214.0L44.0 217.0\" fill=\"none\" stroke=\"#222222\" stroke-width=\"1.0\" stroke-linecap=\"round\"/><text x=\"44\" y=\"229.7\" font-size=\"7.6\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">0</text><path d=\"M120.6 214.0L120.6 217.0\" fill=\"none\" stroke=\"#222222\" stroke-width=\"1.0\" stroke-linecap=\"round\"/><text x=\"120.57142857142857\" y=\"229.7\" font-size=\"7.6\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">200</text><path d=\"M197.1 214.0L197.1 217.0\" fill=\"none\" stroke=\"#222222\" stroke-width=\"1.0\" stroke-linecap=\"round\"/><text x=\"197.14285714285714\" y=\"229.7\" font-size=\"7.6\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">400</text><path d=\"M273.7 214.0L273.7 217.0\" fill=\"none\" stroke=\"#222222\" stroke-width=\"1.0\" stroke-linecap=\"round\"/><text x=\"273.71428571428567\" y=\"229.7\" font-size=\"7.6\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">600</text><path d=\"M41.0 214.0L44.0 214.0\" fill=\"none\" stroke=\"#222222\" stroke-width=\"1.0\" stroke-linecap=\"round\"/><text x=\"39\" y=\"219.3\" font-size=\"7.6\" text-anchor=\"end\" fill=\"#666666\" font-weight=\"normal\">0</text><path d=\"M41.0 154.0L44.0 154.0\" fill=\"none\" stroke=\"#222222\" stroke-width=\"1.0\" stroke-linecap=\"round\"/><text x=\"39\" y=\"159.3\" font-size=\"7.6\" text-anchor=\"end\" fill=\"#666666\" font-weight=\"normal\">10</text><path d=\"M41.0 94.0L44.0 94.0\" fill=\"none\" stroke=\"#222222\" stroke-width=\"1.0\" stroke-linecap=\"round\"/><text x=\"39\" y=\"99.3\" font-size=\"7.6\" text-anchor=\"end\" fill=\"#666666\" font-weight=\"normal\">20</text><text x=\"318\" y=\"240.9\" font-size=\"8.2\" text-anchor=\"end\" fill=\"#222222\" font-weight=\"bold\"></text><text x=\"41\" y=\"54.9\" font-size=\"8.2\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"bold\">stress, MPa</text><text x=\"308\" y=\"208.5\" font-size=\"7.2\" text-anchor=\"end\" fill=\"#222\" font-weight=\"bold\">elongation, %</text><path d=\"M44.0 214.0L82.3 204.4L120.6 194.8L158.9 181.6L197.1 160.0L235.4 121.0L258.4 85.0\" fill=\"none\" stroke=\"#2E7D32\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><path d=\"M44.0 214.0L82.3 208.6L120.6 205.0L158.9 202.0L197.1 199.6L216.3 201.4\" fill=\"none\" stroke=\"#BD2543\" stroke-width=\"2.0\" stroke-linejoin=\"round\" stroke-linecap=\"round\" stroke-dasharray=\"4,3\"/><path d=\"M58.0 72.0L74.0 72.0\" fill=\"none\" stroke=\"#2E7D32\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><text x=\"78\" y=\"76.3\" font-size=\"6.6\" text-anchor=\"start\" fill=\"#2E7D32\" font-weight=\"bold\">vulcanised</text><path d=\"M58.0 84.0L74.0 84.0\" fill=\"none\" stroke=\"#BD2543\" stroke-width=\"2.0\" stroke-linecap=\"round\" stroke-dasharray=\"4,3\"/><text x=\"78\" y=\"88.3\" font-size=\"6.6\" text-anchor=\"start\" fill=\"#BD2543\" font-weight=\"bold\">raw gum</text><rect x=\"6.0\" y=\"232.0\" width=\"348.0\" height=\"58.0\" rx=\"5\" fill=\"#F5EEFD\" stroke=\"#7B2CD9\" stroke-width=\"1\"/><text x=\"180.0\" y=\"246.9\" font-size=\"8.2\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">the crosslink is the whole trick</text><text x=\"180.0\" y=\"260.7\" font-size=\"7.6\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"normal\">1 - 3 % sulphur at 140 - 160 C ties the chains together every few hundred atoms</text><text x=\"180.0\" y=\"272.2\" font-size=\"7.6\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"normal\">cured: 22 MPa and 550 %; raw gum: 2 MPa and 450 % with no elastic return</text><text x=\"180.0\" y=\"283.7\" font-size=\"7.6\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"normal\">Shore A 40 - 90: shoe sole 70, tyre tread 60, hard roller 90, soft gasket 45</text><text x=\"180.0\" y=\"303.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">Rubber is the one material that can be strained 500 % and come back; the</text><text x=\"180.0\" y=\"315.5\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">sulphur bridges stop the chains sliding past each other for good.</text></svg>", "u4_ceramic": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 314\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"314\" fill=\"#ffffff\"/><text x=\"180.0\" y=\"24.3\" font-size=\"12.2\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"bold\">How hot each material family can work</text><text x=\"180.0\" y=\"40.2\" font-size=\"9.2\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">the bond sets the ceiling</text><text x=\"126\" y=\"64.4\" font-size=\"6.8\" text-anchor=\"end\" fill=\"#222\" font-weight=\"normal\">HDPE</text><path d=\"M132.0 54.5L143.0 54.5L143.0 62.5L132.0 62.5Z\" fill=\"#DCEEFB\" stroke=\"#1565C0\" stroke-width=\"0.7\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"148.01176470588234\" y=\"64.2\" font-size=\"6.4\" text-anchor=\"start\" fill=\"#666666\" font-weight=\"normal\">90 C</text><text x=\"126\" y=\"83.4\" font-size=\"6.8\" text-anchor=\"end\" fill=\"#222\" font-weight=\"normal\">natural rubber</text><path d=\"M132.0 73.5L144.2 73.5L144.2 81.5L132.0 81.5Z\" fill=\"#DCEEFB\" stroke=\"#1565C0\" stroke-width=\"0.7\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"149.23529411764707\" y=\"83.2\" font-size=\"6.4\" text-anchor=\"start\" fill=\"#666666\" font-weight=\"normal\">100 C</text><text x=\"126\" y=\"102.4\" font-size=\"6.8\" text-anchor=\"end\" fill=\"#222\" font-weight=\"normal\">epoxy resin</text><path d=\"M132.0 92.5L150.4 92.5L150.4 100.5L132.0 100.5Z\" fill=\"#DCEEFB\" stroke=\"#1565C0\" stroke-width=\"0.7\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"155.35294117647058\" y=\"102.2\" font-size=\"6.4\" text-anchor=\"start\" fill=\"#666666\" font-weight=\"normal\">150 C</text><text x=\"126\" y=\"121.4\" font-size=\"6.8\" text-anchor=\"end\" fill=\"#222\" font-weight=\"normal\">aluminium alloy</text><path d=\"M132.0 111.5L156.5 111.5L156.5 119.5L132.0 119.5Z\" fill=\"#F6E3C5\" stroke=\"#B66A00\" stroke-width=\"0.7\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"161.47058823529412\" y=\"121.2\" font-size=\"6.4\" text-anchor=\"start\" fill=\"#666666\" font-weight=\"normal\">200 C</text><text x=\"126\" y=\"140.4\" font-size=\"6.8\" text-anchor=\"end\" fill=\"#222\" font-weight=\"normal\">plain carbon steel</text><path d=\"M132.0 130.5L193.2 130.5L193.2 138.5L132.0 138.5Z\" fill=\"#F6E3C5\" stroke=\"#B66A00\" stroke-width=\"0.7\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"198.1764705882353\" y=\"140.2\" font-size=\"6.4\" text-anchor=\"start\" fill=\"#666666\" font-weight=\"normal\">500 C</text><text x=\"126\" y=\"159.4\" font-size=\"6.8\" text-anchor=\"end\" fill=\"#222\" font-weight=\"normal\">stainless steel 316</text><path d=\"M132.0 149.5L229.9 149.5L229.9 157.5L132.0 157.5Z\" fill=\"#F6E3C5\" stroke=\"#B66A00\" stroke-width=\"0.7\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"234.88235294117646\" y=\"159.2\" font-size=\"6.4\" text-anchor=\"start\" fill=\"#666666\" font-weight=\"normal\">800 C</text><text x=\"126\" y=\"178.4\" font-size=\"6.8\" text-anchor=\"end\" fill=\"#222\" font-weight=\"normal\">alumina ceramic</text><path d=\"M132.0 168.5L315.5 168.5L315.5 176.5L132.0 176.5Z\" fill=\"#D8EDEA\" stroke=\"#00695C\" stroke-width=\"0.7\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"320.52941176470586\" y=\"178.2\" font-size=\"6.4\" text-anchor=\"start\" fill=\"#666666\" font-weight=\"normal\">1500 C</text><text x=\"126\" y=\"197.4\" font-size=\"6.8\" text-anchor=\"end\" fill=\"#222\" font-weight=\"normal\">silicon carbide</text><path d=\"M132.0 187.5L327.8 187.5L327.8 195.5L132.0 195.5Z\" fill=\"#D8EDEA\" stroke=\"#00695C\" stroke-width=\"0.7\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"332.7647058823529\" y=\"197.2\" font-size=\"6.4\" text-anchor=\"start\" fill=\"#666666\" font-weight=\"normal\">1600 C</text><text x=\"132\" y=\"214.2\" font-size=\"6.4\" text-anchor=\"start\" fill=\"#1565C0\" font-weight=\"bold\">polymer</text><text x=\"184\" y=\"214.2\" font-size=\"6.4\" text-anchor=\"start\" fill=\"#B66A00\" font-weight=\"bold\">metal</text><text x=\"224\" y=\"214.2\" font-size=\"6.4\" text-anchor=\"start\" fill=\"#00695C\" font-weight=\"bold\">ceramic</text><rect x=\"6.0\" y=\"226.0\" width=\"348.0\" height=\"58.0\" rx=\"5\" fill=\"#F5EEFD\" stroke=\"#7B2CD9\" stroke-width=\"1\"/><text x=\"180.0\" y=\"240.9\" font-size=\"8.2\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">why the order never changes</text><text x=\"180.0\" y=\"254.7\" font-size=\"7.6\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"normal\">van der Waals between chains, then metallic, then ionic and covalent: that is the order</text><text x=\"180.0\" y=\"266.2\" font-size=\"7.6\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"normal\">a ceramic is hard because a dislocation cannot move in a rigid ionic lattice</text><text x=\"180.0\" y=\"277.7\" font-size=\"7.6\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"normal\">and it is brittle for that same reason: a crack has nothing to blunt it</text><text x=\"180.0\" y=\"297.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">A polymer above its ceiling softens or creeps, a metal above its ceiling oxidises</text><text x=\"180.0\" y=\"309.5\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">and loses strength, a ceramic keeps its shape until it cracks without warning.</text></svg>", "u4_compare": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 292\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"292\" fill=\"#ffffff\"/><text x=\"180.0\" y=\"24.3\" font-size=\"12.2\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"bold\">Metals, ceramics and polymers side by side</text><text x=\"180.0\" y=\"40.2\" font-size=\"9.2\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">eight properties, one answer for each</t size=\"6.2\" text-anchor=\"start\" fill=\"#222222\" font-weight=\"normal\">10 - 100 MPa</text><path d=\"M8.0 96.0L346.0 96.0\" fill=\"none\" stroke=\"#E3E7EC\" stroke-width=\"0.7\" stroke-linecap=\"round\"/><text x=\"10\" y=\"108.2\" font-size=\"6.4\" text-anchor=\"start\" fill=\"#222\" font-weight=\"bold\">ductility</text><text x=\"88\" y=\"108.2\" font-size=\"6.2\" text-anchor=\"start\" fill=\"#222222\" font-weight=\"normal\">high</text><text x=\"176\" y=\"108.2\" font-size=\"6.2\" text-anchor=\"start\" fill=\"#222222\" font-weight=\"normal\">none, it cracks</text><text x=\"264\" y=\"108.2\" font-size=\"6.2\" text-anchor=\"start\" fill=\"#222222\" font-weight=\"normal\">high, low modulus</text><path d=\"M8.0 111.0L346.0 111.0\" fill=\"none\" stroke=\"#E3E7EC\" stroke-width=\"0.7\" stroke-linecap=\"round\"/><text x=\"10\" y=\"123.2\" font-size=\"6.4\" text-anchor=\"start\" fill=\"#222\" font-weight=\"bold\">ceiling</text><text x=\"88\" y=\"123.2\" font-size=\"6.2\" text-anchor=\"start\" fill=\"#222222\" font-weight=\"normal\">500 - 1500 C</text><text x=\"176\" y=\"123.2\" font-size=\"6.2\" text-anchor=\"start\" fill=\"#222222\" font-weight=\"normal\">1500 - 2000 C</text><text x=\"264\" y=\"123.2\" font-size=\"6.2\" text-anchor=\"start\" fill=\"#222222\" font-weight=\"normal\">100 - 200 C</text><path d=\"M8.0 126.0L346.0 126.0\" fill=\"none\" stroke=\"#E3E7EC\" stroke-width=\"0.7\" stroke-linecap=\"round\"/><text x=\"10\" y=\"138.2\" font-size=\"6.4\" text-anchor=\"start\" fill=\"#222\" font-weight=\"bold\">density</text><text x=\"88\" y=\"138.2\" font-size=\"6.2\" text-anchor=\"start\" fill=\"#222222\" font-weight=\"normal\">2.7 - 8.0</text><text x=\"176\" y=\"138.2\" font-size=\"6.2\" text-anchor=\"start\" fill=\"#222222\" font-weight=\"normal\">2.5 - 4.0</text><text x=\"264\" y=\"138.2\" font-size=\"6.2\" text-anchor=\"start\" fill=\"#222222\" font-weight=\"normal\">0.9 - 1.4</text><path d=\"M8.0 141.0L346.0 141.0\" fill=\"none\" stroke=\"#E3E7EC\" stroke-width=\ ext x=\"180.0\" y=\"230.7\" font-size=\"7.6\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"normal\">a polymer for a cover, a ceramic for a hot face, a metal for a load</text><text x=\"180.0\" y=\"242.2\" font-size=\"7.6\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"normal\">the word for it is a hybrid: a glass tank, a steel frame, nylon bushes</text><text x=\"180.0\" y=\"253.7\" font-size=\"7.6\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"normal\">the property you cannot change by design is the bond - choose the family first</text><text x=\"180.0\" y=\"273.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">Every value in the table follows from the bond, so the table does not have to be</text><text x=\"180.0\" y=\"285.5\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">memorised: derive it. Compare the ceiling, the density and the failure first.</text></svg>", "u4_refract": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 310\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"310\" fill=\"#ffffff\"/><text x=\"180.0\" y=\"24.3\" font-size=\"12.2\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"bold\">A two-layer refractory wall</text><text x=\"180.0\" y=\"40.2\" font-size=\"9.2\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">1200 C outside-in, and where the drop happens</text><path d=\"M40.0 48.0L152.0 48.0L152.0 98.0L40.0 98.0Z\" fill=\"#F6E3C5\" stroke=\"#B66A00\" stroke-width=\"1.0\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><path d=\"M152.0 48.0L232.0 48.0L232.0 98.0L152.0 98.0Z\" fill=\"#DCEEFB\" stroke=\"#1565C0\" stroke-width=\"1.0\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><path d=\"M232.0 48.0L240.0 48.0L240.0 98.0L232.0 98.0Z\" fill=\"#BFC6CE\" stroke=\"#222222\" stroke-width=\"1.0\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"96\" y=\"68.6\" font-size=\"7.4\" text \" y=\"246.2\" font-size=\"7.6\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"normal\">neutral chromite and graphite where the slag swings either way</text><text x=\"180.0\" y=\"257.7\" font-size=\"7.6\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"normal\">an acid brick against a basic slag is eaten in one campaign - match the slag</text><text x=\"180.0\" y=\"269.2\" font-size=\"7.6\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"normal\">the working face must also resist spalling: heat cycles crack a dense brick</text><text x=\"180.0\" y=\"291.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">The firebrick takes 223 C of the drop and the thin insulation layer takes 927 C:</text><text x=\"180.0\" y=\"303.5\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">the cheaper material does the hot work, the thin one does the saving.</text></svg>", "u4_insul": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 310\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"310\" fill=\"#ffffff\"/><text x=\"180.0\" y=\"24.3\" font-size=\"12.2\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"bold\">Dielectric strength and the thickness it needs</text><text x=\"180.0\" y=\"40.2\" font-size=\"9.2\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">breakdown voltage per mm</text><text x=\"98\" y=\"64.4\" font-size=\"6.8\" text-anchor=\"end\" fill=\"#222\" font-weight=\"normal\">air</text><path d=\"M104.0 54.5L127.1 54.5L127.1 62.5L104.0 62.5Z\" fill=\"#E9EDF1\" stroke=\"#666666\" stroke-width=\"0.7\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"132.0769230769231\" y=\"64.2\" font-size=\"6.4\" text-anchor=\"start\" fill=\"#666666\" font-weight=\"normal\">3</text><text x=\"98\" y=\"83.4\" font-size=\"6.8\" text-anchor=\"end\" fill=\"#222\" font-weight=\"normal\">transformer oil</text><path d=\"M104.0 73.5L196.3 73.5L196.3 81.5L
