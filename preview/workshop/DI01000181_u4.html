<script>
const U = {"subject": "DI01000181", "unit": 4, "format": "notes", "title": {"en": "Non Metallic Materials", "gu": "અધાતુઈ સામગ્રી"}, "hours": 8, "weightage": 17, "theory_marks": 12, "official": true, "languages": ["en", "gu"], "tabs": ["notes", "diagrams", "equations", "viva", "exam"], "intro_text": {"en": "Unit 4 of Engineering Materials Science: the materials a machine uses where strength is not the question. It classifies the non-metals by their bond, follows rubber from latex to a vulcanised compound and shows how an elastomer is chosen for a fluid, treats ceramics from the brick in a furnace wall to the silicon nitride rotor of a turbocharger, works a two-layer refractory wall and an insulator thickness, and ends with the grain, bond and grit of an abrasive and the shear of an adhesive joint. Six solved numericals follow in section 4.6.", "gu": "Engineering Materials Science નું Unit 4: જ્યાં તાકાત પ્રશ્ન નથી ત્યાં મશીન જે સામગ્રી વાપરે છે તે. તે non-metals ને તેમના bond પ્રમાણે વર્ગીકૃત કરે, rubber ને latex થી vulcanised compound સુધી લઈ જાય અને પ્રવાહી પ્રમાણે elastomer કેમ પસંદ થાય તે બતાવે, ceramics ને ભઠ્ઠીની ઈંટ થી turbocharger ના silicon nitride rotor સુધી લઈ જાય, બે સ્તરની refractory દીવાલ અને insulator ની જાડાઈ ગણે, અને abrasive ના grain, bond તથી grit અને adhesive જોડાણના shear પર પૂરું કરે. વિભાગ 4.6 માં છ ઉકેલેલા દાખલા છે."}, "notes": [{"title": {"en": "4.1 Non-metallic materials and how they are classified", "gu": "4.1 Non-metallic materials અને તેમનું વર્ગીકરણ"}, "items": [{"h": {"en": "Four families, chosen by bond and not by strength", "gu": "ચાર કુટુંબ, તાકાત થી નહીં પણ bond થી નક્કી"}, "body": {"en": "<p>A non-metallic material is any engineering material that has no free electron sea. That one sentence classifies it: without free electrons there is no metallic bond, so no ductility, no conduction and no weld. The syllabus divides them into four families - <b>polymers</b> (long covalent chains held to each other by weak forces), <b>ceramics</b> (a rigid ionic and covalent network), <b>composites</b> (a stiff fibre carrying the load inside a tough matrix) and <b>natural materials</b> (wood, cork, leather, cotton) which are polymers that grew rather than being made.</p><table><tr><th>family</th><th>bond</th><th>density, g/cm3</th><th>ceiling</th><th>a part it makes</th></tr><tr><td>polymer</td><td>covalent chains, van der Waals between</td><td>0.9 - 1.4</td><td>100 - 200 C</td><td>tank, guard, gear, seal</td></tr><tr><td>ceramic</td><td>ionic and covalent network</td><td>2.5 - 4.0</td><td>1500 - 2000 C</td><td>brick, insulator, insert</td></tr><tr><td>composite</td><td>fibre plus matrix</td><td>1.5 - 2.0</td><td>120 - 180 C</td><td>tank, blade, panel</td></tr><tr><td>natural</td><td>cellulose, protein, cork</td><td>0.2 - 0.9</td><td>under 120 C</td><td>packing, gasket, handle</td></tr></table><div class=\"math\">specific stiffness E/rho, in GPa per g/cm3\nsteel   200/7.85 = 25.5      alumina 300/3.9  = 76.9\nCFRP    150/1.60 = 93.8      oak     11/0.70 = 15.7\nalumina is 3.0 times steel and CFRP is 3.7 times, for the same weight</div><p><b>Why it is true.</b> the bond fixes everything downstream. A covalent chain with weak forces between the chains gives a low modulus and a low melting point; an ionic network with no free electrons gives hardness, insulation and brittleness; a composite reports the volume-weighted average of a stiff fibre and a tough matrix, which is why its stiffness sits between glass and aluminium.</p><p><b>Common mistake.</b> non-metallic does not mean non-metallic element. Silicon and germanium are elements but they are used as ceramics, and diamond is carbon; rubber is carbon and hydrogen, two non-metals, yet it is an engineering solid with a 22 MPa strength.</p><p><b>Check your answer.</b> before choosing a family, ask the ceiling and the joint. A polymer above 150 C creeps, a ceramic cannot be threaded, and a composite cannot be welded - each one changes the design, not just the material line on the drawing.</p>", "gu": "<p>Non-metallic material એટલે એવી કોઈ પણ ઇજનેરી સામગ્રી જેમાં free electrons નો સમુદ્ર નથી. એક જ વાક્ય વર્ગીકરણ કરી દે છે: free electrons ન હોય તો metallic bond નહીં, તેથી ductility નહીં, વાહકતા નહીં અને weld નહીં. Syllabus તેમને ચાર કુટુંબમાં વહેંચે છે - <b>polymers</b> (લાંબી covalent chains જે એકબીજા સાથે નબળા બળથી જોડાયેલી), <b>ceramics</b> (કઠણ ionic અને covalent network), <b>composites</b> (લોડ ઉપાડતો કઠણ fibre, લચીલા matrix માં) અને <b>natural materials</b> (લાકડું, cork, ચામડું, કપાસ) જે બનાવેલા નહીં પણ ઊગેલા polymers છે.</p><table><tr><th>કુટુંબ</th><th>bond</th><th>density, g/cm3</th><th>મર્યાદા</th><th>એનો એક ભાગ</th></tr><tr><td>polymer</td><td>covalent chains, વચ્ચે van der Waals</td><td>0.9 - 1.4</td><td>100 - 200 C</td><td>ટાંકી, guard, ગિયર, seal</td></tr><tr><td>ceramic</td><td>ionic અને covalent network</td><td>2.5 - 4.0</td><td>1500 - 2000 C</td><td>ઈંટ, insulator, insert</td></tr><tr><td>composite</td><td>fibre અને matrix</td><td>1.5 - 2.0</td><td>120 - 180 C</td><td>ટાંકી, blade, panel</td></tr><tr><td>natural</td><td>cellulose, protein, cork (લાકડું, કૉર્ક)</td><td>0.2 - 0.9</td><td>120 C ની નીચે</td><td>packing, gasket, handle (ભરણી)</td></tr></table><div class=\"math\">specific stiffness E/rho, in GPa per g/cm3\nsteel   200/7.85 = 25.5      alumina 300/3.9  = 76.9\nCFRP    150/1.60 = 93.8      oak     11/0.70 = 15.7\nalumina is 3.0 times steel and CFRP is 3.7 times, for the same weight</div><p><b>કેમ સાચું છે.</b> bond જ બાકીનું બધું નક્કી કરે છે. chains વચ્ચે નબળા બળવાળી covalent chain નીચું modulus અને નીચું ગલનબિંદુ આપે; free electrons વગરનું ionic network સખતાઈ, અવાહકતા અને ભંગુરતા આપે; composite કઠણ fibre અને લચીલા matrix ની volume-પ્રમાણે સરેરાશ આપે, તેથી તેની કઠણાઈ glass અને aluminium વચ્ચે બેસે.</p><p><b>સામાન્ય ભૂલ.</b> non-metallic એટલે non-metallic element નહીં. Silicon અને germanium elements છે પણ ceramics તરીકે વપરાય છે, અને diamond carbon છે; rubber carbon અને hydrogen - બે non-metals - છે, તોય 22 MPa તાકાતવાળી ઇજનેરી સામગ્રી છે.</p><p><b>જવાબ ચકાસો.</b> કુટુંબ પસંદ કરતાં પહેલાં ceiling અને જોડાણ પૂછો. 150 C ઉપર polymer creep કરે, ceramic ને thread કરી શકાય નહીં, અને composite weld થાય નહીં - દરેક material line નહીં, design બદલે છે.</p>"}, "diagram": "u4_tree"}]}, {"title": {"en": "4.2 Rubber and elastomers", "gu": "4.2 Rubber અને elastomers"}, "items": [{"h": {"en": "Natural rubber, and what vulcanisation did to it", "gu": "Natural rubber, અને vulcanisation એ શું કર્યું"}, "body": {"en": "<p>Natural rubber is tapped as latex from the <b>Hevea</b> tree and dried into a gum of cis-1,4 polyisoprene chains. Raw gum is sticky, creeps under its own weight and reaches only about 2 MPa, so for fifty years it was a curiosity rather than an engineering material. In 1839 Goodyear heated it with sulphur and got a rubber that stretches 550 % and comes back: <b>vulcanisation</b> ties neighbouring chains together with sulphur bridges, one every hundred to two hundred chain atoms. The chains can still uncoil - that is the softness - but they can no longer slide past each other, and that is the elasticity.</p><div class=\"math\">E = 3G   with G = 1.0 MPa  ->  E = 3.0 MPa  (rubber is nearly incompressible)\nsecant modulus at 100 % strain = 1.6/1.0 = 1.6 MPa\nstrain energy to break ~ 0.5 x 22 x 5.5 = 60 MJ per m3\ncure: 1 - 3 % sulphur at 140 - 160 C for 10 - 30 min, or a peroxide</div><table><tr><th>property</th><th>raw gum</th><th>soft rubber</th><th>ebonite</th></tr><tr><td>sulphur</td><td>0</td><td>1 - 3 %</td><td>30 - 40 %</td></tr><tr><td>tensile</td><td>2 MPa</td><td>22 MPa</td><td>45 MPa</td></tr><tr><td>elongation</td><td>450 %</td><td>550 %</td><td>3 %</td></tr><tr><td>hardness</td><td>Shore A 20</td><td>Shore A 60</td><td>Shore D 75</td></tr><tr><td>recovery</td><td>none</td><td>100 %</td><td>100 %</td></tr></table><p><b>Why it is true.</b> a raw chain slides because van der Waals forces between chains are weak. A sulphur bridge is a covalent bond, so it pins two points of two chains together; the length of chain between two bridges still uncoils, which is why cured rubber is soft, but the network cannot flow, which is why the strain returns.</p><p><b>Common mistake.</b> more sulphur is not better. At 30 - 40 % sulphur the same recipe gives ebonite, a hard brittle plastic used for battery boxes and old telephone handsets, not a seal.</p>", "gu": "<p>Natural rubber Hevea વૃક્ષના latex માંથી નીકળે અને સુકાઈને cis-1,4 polyisoprene chains નું gum બને. કાચું gum ચીકણું હોય, પોતાના વજન નીચે વહી જાય અને ફક્ત 2 MPa સુધી પહોંચે, તેથી પચાસ વર્ષ સુધી તે ઇજનેરી સામગ્રી નહીં પણ કુતૂહલ રહ્યું. 1839 માં Goodyear એ તેને sulphur સાથે ગરમ કરીને એવું rubber મેળવ્યું જે 550 % ખેંચાય અને પાછું આવે: <b>vulcanisation</b> પડોશી chains ને sulphur પુલ થી જોડે, દર સો-બસો chain atoms માં એક. Chains હજી ખૂલી શકે - એ જ નરમાઈ - પણ એકબીજા પર સરકી શકે નહીં, અને એ જ elasticity.</p><div class=\"math\">E = 3G   with G = 1.0 MPa  ->  E = 3.0 MPa  (rubber is nearly incompressible)\nsecant modulus at 100 % strain = 1.6/1.0 = 1.6 MPa\nstrain energy to break ~ 0.5 x 22 x 5.5 = 60 MJ per m3\ncure: 1 - 3 % sulphur at 140 - 160 C for 10 - 30 min, or a peroxide</div><table><tr><th>ગુણધર્મ</th><th>કાચું gum</th><th>નરમ rubber</th><th>ebonite</th></tr><tr><td>sulphur</td><td>0</td><td>1 - 3 %</td><td>30 - 40 %</td></tr><tr><td>tensile</td><td>2 MPa</td><td>22 MPa</td><td>45 MPa</td></tr><tr><td>elongation</td><td>450 %</td><td>550 %</td><td>3 %</td></tr><tr><td>hardness</td><td>Shore A 20</td><td>Shore A 60</td><td>Shore D 75</td></tr><tr><td>પાછું આવવું</td><td>નહીં</td><td>100 %</td><td>100 %</td></tr></table><p><b>કેમ સાચું છે.</b> કાચી chain સરકે છે કારણ કે chains વચ્ચેના van der Waals બળ નબળા છે. Sulphur પુલ covalent bond છે, તેથી બે chains ના બે બિંદુ જકડાઈ જાય; બે પુલ વચ્ચેની chain હજી ખૂલે, તેથી cured rubber નરમ છે, પણ network વહી શકે નહીં, તેથી strain પાછું આવે.</p><p><b>સામાન્ય ભૂલ.</b> વધુ sulphur સારું નથી. 30 - 40 % sulphur પર એ જ recipe ebonite આપે - સખત, ભંગુર plastic જે battery box અને જૂના telephone માટે વપરાય, seal માટે નહીં.</p>"}, "diagram": "u4_rubber"}, {"h": {"en": "Compounding, and choosing an elastomer for the duty", "gu": "Compounding, અને કામ પ્રમાણે elastomer પસંદ કરવો"}, "body": {"en": "<p>A rubber part is never one material. The recipe is written in <b>phr</b> - parts per hundred rubber, by weight - and a typical tyre tread is 100 phr natural or SBR, 50 phr carbon black, 3 phr sulphur, 1 phr accelerator, 2 phr zinc oxide and stearic acid, plus an antioxidant and a softener. The carbon black is what turns a 2 MPa gum into a 22 MPa compound: the particles bond to the chains, carry part of the load and stop a crack from running. The choice of base elastomer, though, is decided by the fluid and the temperature, not by the strength.</p><div class=\"math\">recipe in phr:  100 gum + 50 black + 3 S + 1 accelerator + 2 ZnO = 156 phr\ncarbon black share = 50/156 = 32 % of the compound by weight\ntensile 2 MPa -> 22 MPa; modulus at 100 % strain 1.6 -> 4.5 MPa\nan oil seal swells 50 % in NR, 10 % in SBR and 5 % in NBR</div><table><tr><th>elastomer</th><th>service range</th><th>resists</th><th>fails at</th><th>used for</th></tr><tr><td>NR natural</td><td>-50 to 90 C</td><td>tear, fatigue</td><td>oil, ozone, heat</td><td>tyre, mount, belt</td></tr><tr><td>SBR</td><td>-40 to 100 C</td><td>abrasion</td><td>oil, ozone</td><td>tyre tread, shoe sole</td></tr><tr><td>NBR nitrile</td><td>-30 to 120 C</td><td>mineral oil, fuel</td><td>ozone, ketones</td><td>oil seal, hose, gasket</td></tr><tr><td>CR neoprene</td><td>-40 to 120 C</td><td>weather, flame</td><td>ester oils</td><td>gasket, cable jacket</td></tr><tr><td>EPDM</td><td>-50 to 150 C</td><td>steam, ozone, UV</td><td>mineral oil</td><td>radiator hose, roofing</td></tr><tr><td>silicone</td><td>-60 to 230 C</td><td>heat, cold, ozone</td><td>tear, oil</td><td>oven seal, keypad</td></tr><tr><td>butyl</td><td>-40 to 120 C</td><td>air, water</td><td>heat, oil</td><td>inner tube, liner</td></tr></table><p><b>Why it is true.</b> a seal fails on the fluid long before it fails on the load. Rubber is a polymer network with free volume, so a solvent that wets it diffuses in and swells it; the swelling is a property of the pair, not of the rubber alone, which is why the datasheet prints a volume swell against oil, water and fuel.</p><p><b>Common mistake.</b> a rubber that swells 10 % in service has already failed: a 50 mm O-ring grows to 55 mm, the groove no longer holds it and the joint leaks at the next pressure cycle.</p><p><b>Check your answer.</b> write the duty as four numbers - fluid, temperature, movement and life - and only then read the table. Hardness is the last choice, not the first: a 70 Shore A nitrile and a 70 Shore A silicone behave completely differently in hot oil.</p>", "gu": "<p>Rubber નો ભાગ કદી એક જ સામગ્રીનો નથી. Recipe <b>phr</b> માં લખાય - સો ભાગ rubber દીઠ ભાગ, વજન પ્રમાણે - અને સામાન્ય ટાયર tread એટલે 100 phr natural કે SBR, 50 phr carbon black, 3 phr sulphur, 1 phr accelerator, 2 phr zinc oxide અને stearic acid, સાથે antioxidant અને softener. Carbon black જ 2 MPa ના gum ને 22 MPa નું compound બનાવે: કણ chains સાથે જોડાય, લોડનો ભાગ ઉપાડે અને તિરાડ લાંબી દોડતી અટકાવે. પણ base elastomer ની પસંદગી તાકાત નહીં, પ્રવાહી અને તાપમાન નક્કી કરે છે.</p><div class=\"math\">recipe in phr:  100 gum + 50 black + 3 S + 1 accelerator + 2 ZnO = 156 phr\ncarbon black share = 50/156 = 32 % of the compound by weight\ntensile 2 MPa -> 22 MPa; modulus at 100 % strain 1.6 -> 4.5 MPa\nan oil seal swells 50 % in NR, 10 % in SBR and 5 % in NBR</div><table><tr><th>elastomer</th><th>સેવા મર્યાદા</th><th>શેની સામે ટકે</th><th>શેમાં નિષ્ફળ જાય</th><th>ઉપયોગ</th></tr><tr><td>NR natural</td><td>-50 થી 90 C</td><td>છેકું, fatigue</td><td>તેલ, ozone, ગરમી</td><td>ટાયર, mount, belt</td></tr><tr><td>SBR</td><td>-40 થી 100 C</td><td>ઘસારો</td><td>તેલ, ozone</td><td>ટાયર tread, જૂતાના તળિયા</td></tr><tr><td>NBR nitrile</td><td>-30 થી 120 C</td><td>ખનીજ તેલ, fuel</td><td>ozone, ketone</td><td>તેલ seal, hose, gasket</td></tr><tr><td>CR neoprene</td><td>-40 થી 120 C</td><td>હવામાન, જ્યોત</td><td>ester તેલ</td><td>gasket, cable jacket (ભરણી, આવરણ)</td></tr><tr><td>EPDM</td><td>-50 થી 150 C</td><td>steam, ozone, UV</td><td>ખનીજ તેલ</td><td>radiator hose, છત</td></tr><tr><td>silicone</td><td>-60 થી 230 C</td><td>ગરમી, ઠંડી, ozone</td><td>છેકું, તેલ</td><td>ઓવન seal, keypad</td></tr><tr><td>butyl</td><td>-40 થી 120 C</td><td>હવા, પાણી</td><td>ગરમી, તેલ</td><td>inner tube, liner</td></tr></table><p><b>કેમ સાચું છે.</b> seal લોડ પર નહીં, પ્રવાહી પર પહેલાં નિષ્ફળ જાય. Rubber એ free volume વાળું polymer network છે, તેથી જે દ્રાવક તેને ભીંજવે તે અંદર ફેલાઈને ફુલાવે; ફૂલવું એ rubber નું નહીં, જોડીનું ગુણધર્મ છે, તેથી datasheet તેલ, પાણી અને fuel સામે volume swell આપે છે.</p><p><b>સામાન્ય ભૂલ.</b> સેવામાં 10 % ફૂલી ગયેલું rubber નિષ્ફળ જ ગયું છે: 50 mm O-ring 55 mm થાય, groove તેને પકડી શકે નહીં અને આગલા pressure cycle માં જોડાણ ચૂ થાય.</p><p><b>જવાબ ચકાસો.</b> કામ ચાર આંકડામાં લખો - પ્રવાહી, તાપમાન, હલનચલન અને આયુષ્ય - અને પછી જ કોષ્ટક વાંચો. Hardness પહેલી નહીં, છેલ્લી પસંદગી છે: 70 Shore A nitrile અને 70 Shore A silicone ગરમ તેલમાં સાવ જુદું વર્તન કરે.</p>"}}]}, {"title": {"en": "4.3 Ceramics", "gu": "4.3 Ceramics"}, "items": [{"h": {"en": "Hard, hot and inert - and brittle for the same reason", "gu": "સખત, ગરમ અને નિષ્ક્રિય - અને એ જ કારણે ભંગુર"}, "body": {"en": "<p>A ceramic is an inorganic solid held by ionic or covalent bonds: alumina (Al2O3), zirconia (ZrO2), silicon carbide (SiC), silicon nitride (Si3N4), porcelain, glass and ordinary brick. The bond is strong and directional, which gives a hardness of 1500 HV and a melting point above 2000 C on a material of density 3.9 g/cm3; the same bond has no free electrons, so it insulates and does not corrode. The price is ductility: alumina carries 2000 MPa in compression and only about 300 MPa in bending, and it does not yield before it breaks.</p><div class=\"math\">thermal stress in a fully constrained part:  sigma = E alpha dT\nalumina:  300e9 x 8.0e-6 x 200 = 480 MPa  ->  above its 300 MPa strength, it cracks\nthe safe temperature step alone is 300e6/(300e9 x 8.0e-6) = 125 K\nGriffith: sigma_f = sqrt(2 E gamma / pi a), a 50 um flaw gives 276 MPa\nthe same material with a 200 um flaw: 138 MPa - the flaw size sets the strength</div><table><tr><th>ceramic</th><th>hardness, HV</th><th>flexural, MPa</th><th>max use</th><th>a part it makes</th></tr><tr><td>alumina 96 %</td><td>1200</td><td>300</td><td>1500 C</td><td>spark plug, wear tile</td></tr><tr><td>zirconia</td><td>1300</td><td>900</td><td>1000 C</td><td>die, knife, oxygen sensor</td></tr><tr><td>silicon carbide</td><td>2500</td><td>450</td><td>1600 C</td><td>kiln furniture, seal</td></tr><tr><td>silicon nitride</td><td>1700</td><td>800</td><td>1200 C</td><td>turbo rotor, ball</td></tr><tr><td>porcelain</td><td>600</td><td>70</td><td>1000 C</td><td>insulator, sanitaryware</td></tr></table><p><b>Why it is true.</b> a metal deforms by moving dislocations; in an ionic lattice a dislocation would bring like charges together, so it cannot move, and the only way left to relieve stress is a crack. One sentence gives both halves of the behaviour - hard, and brittle.</p><p><b>Common mistake.</b> do not design a ceramic for tension or shock. The 2000 MPa compressive figure is real and the 300 MPa bending figure is real, and a tile under a column is safe while the same tile dropped on the floor is not.</p>", "gu": "<p>Ceramic એ inorganic ઘન છે જે ionic કે covalent bonds થી બંધાયેલું હોય: alumina (Al2O3), zirconia (ZrO2), silicon carbide (SiC), silicon nitride (Si3N4), porcelain, glass અને સામાન્ય ઈંટ. Bond મજબૂત અને દિશાવાળો છે, તેથી 3.9 g/cm3 ની density પર 1500 HV સખતાઈ અને 2000 C થી ઉપર ગલનબિંદુ મળે; એ જ bond માં free electrons નથી, તેથી તે અવાહક છે અને કાટ ખાતું નથી. કિંમત ductility છે: alumina compression માં 2000 MPa ઉપાડે પણ bending માં ફક્ત 300 MPa, અને તૂટતાં પહેલાં yield થતું નથી.</p><div class=\"math\">thermal stress in a fully constrained part:  sigma = E alpha dT\nalumina:  300e9 x 8.0e-6 x 200 = 480 MPa  ->  above its 300 MPa strength, it cracks\nthe safe temperature step alone is 300e6/(300e9 x 8.0e-6) = 125 K\nGriffith: sigma_f = sqrt(2 E gamma / pi a), a 50 um flaw gives 276 MPa\nthe same material with a 200 um flaw: 138 MPa - the flaw size sets the strength</div><table><tr><th>ceramic</th><th>hardness, HV</th><th>flexural, MPa</th><th>વધુમાં વધુ</th><th>એનો એક ભાગ</th></tr><tr><td>alumina 96 %</td><td>1200</td><td>300</td><td>1500 C</td><td>spark plug, ઘસાતી tile</td></tr><tr><td>zirconia</td><td>1300</td><td>900</td><td>1000 C</td><td>die, ચાકુ, oxygen sensor</td></tr><tr><td>silicon carbide</td><td>2500</td><td>450</td><td>1600 C</td><td>ભઠ્ઠીનું સામાન, seal</td></tr><tr><td>silicon nitride</td><td>1700</td><td>800</td><td>1200 C</td><td>turbo rotor, દડો</td></tr><tr><td>porcelain</td><td>600</td><td>70</td><td>1000 C</td><td>insulator, sanitaryware (બેસિન)</td></tr></table><p><b>કેમ સાચું છે.</b> metal dislocations ખસીને deform થાય; ionic lattice માં dislocation સરખા charge પાસે લાવે, તેથી તે ખસી શકે નહીં, અને stress ઓછો કરવાનો એક જ રસ્તો રહે - તિરાડ. એક જ વાક્ય બંને અડધા ગુણધર્મ આપે - સખત, અને ભંગુર.</p><p><b>સામાન્ય ભૂલ.</b> ceramic ને tension કે ધક્કા માટે design ન કરો. 2000 MPa compression અને 300 MPa bending બંને સાચા છે, અને સ્તંભ નીચેની tile સલામત છે જ્યારે એ જ tile નીચે પડે તો નહીં.</p>"}, "diagram": "u4_compare"}, {"h": {"en": "Traditional and advanced ceramics, and where each one goes", "gu": "Traditional અને advanced ceramics, અને દરેક ક્યાં જાય"}, "body": {"en": "<p>Traditional ceramics are made from clay, feldspar and quartz, shaped wet and fired at 1100 - 1300 C: brick, tile, sanitaryware, porcelain insulators and pottery. Cement and glass belong here too, though one sets by hydration and the other is melted and quenched. <b>Advanced</b> ceramics are chemically pure, sintered from a powder with a controlled grain size, and bought for one property: alumina for wear and insulation, zirconia for toughness by transformation, silicon carbide for thermal shock, silicon nitride for a turbocharger rotor that spins at 100000 rpm.</p><div class=\"math\">expansion misfit when alumina is sealed to steel:\nalpha(steel) 12e-6, alpha(alumina) 8.0e-6  ->  difference 4.0e-6 per K\nover 800 C: 4.0e-6 x 800 = 3.2e-3 strain\non a 40 mm joint that is 3.2e-3 x 40 = 0.13 mm of misfit, so a graded seal is used</div><table><tr><th>ceramic</th><th>what it is</th><th>bought for</th><th>typical part</th></tr><tr><td>fireclay</td><td>clay plus grog</td><td>cheap, casts easily</td><td>furnace lining, brick</td></tr><tr><td>porcelain</td><td>clay, feldspar, quartz</td><td>insulation, hygiene</td><td>insulator, basin, tile</td></tr><tr><td>glass</td><td>fused silica and oxides</td><td>transparency</td><td>window, gauge, bottle</td></tr><tr><td>glass-ceramic</td><td>crystallised glass</td><td>near zero expansion</td><td>cooktop, lab ware</td></tr><tr><td>alumina</td><td>96 or 99.5 % Al2O3</td><td>wear, insulation, 1500 C</td><td>spark plug, seal face</td></tr></table><p><b>Why it is true.</b> porosity is what separates the two families. A traditional body is sintered at a temperature low enough to leave 5 - 15 % open pores, which makes it light and insulating; an advanced body is sintered to under 1 % porosity, which makes it strong and is why it costs a hundred times more per kilogram.</p><p><b>Common mistake.</b> firing is not melting. A brick that has been fired has not been liquid, so it keeps its pores; if you design a 10 % shrinkage allowance as if it were a casting, the part comes out undersize in every direction.</p><p><b>Check your answer.</b> match the expansion before you match the strength. A glass-ceramic cooktop survives a hot pan because its expansion is near zero; ordinary window glass of the same strength cracks on the same pan.</p>", "gu": "<p>Traditional ceramics clay, feldspar અને quartz માંથી બને, ભીનું આકાર પામે અને 1100 - 1300 C પર પાકે: ઈંટ, tile, sanitaryware, porcelain insulators અને માટીકામ. Cement અને glass પણ આમાં આવે, જોકે એક hydration થી જામે અને બીજું ઓગળીને ઠારે. <b>Advanced</b> ceramics રાસાયણિક રીતે શુદ્ધ હોય, નિયંત્રિત grain size ના powder માંથી sinter થાય, અને એક ગુણધર્મ માટે ખરીદાય: alumina wear અને insulation માટે, zirconia transformation થી toughness માટે, silicon carbide thermal shock માટે, silicon nitride 100000 rpm પર ફરતા turbocharger rotor માટે.</p><div class=\"math\">expansion misfit when alumina is sealed to steel:\nalpha(steel) 12e-6, alpha(alumina) 8.0e-6  ->  difference 4.0e-6 per K\nover 800 C: 4.0e-6 x 800 = 3.2e-3 strain\non a 40 mm joint that is 3.2e-3 x 40 = 0.13 mm of misfit, so a graded seal is used</div><table><tr><th>ceramic</th><th>શું છે</th><th>શેના માટે ખરીદાય</th><th>સામાન્ય ભાગ</th></tr><tr><td>fireclay</td><td>clay અને grog</td><td>સસ્તું, સરળ cast</td><td>ભઠ્ઠીનું lining, ઈંટ</td></tr><tr><td>porcelain</td><td>clay, feldspar, quartz (માટી)</td><td>insulation, સ્વચ્છતા</td><td>insulator, basin, tile (બેસિન)</td></tr><tr><td>glass</td><td>fused silica અને oxides</td><td>પારદર્શકતા</td><td>બારી, gauge, બોટલ</td></tr><tr><td>glass-ceramic</td><td>સ્ફટિક થયેલું glass</td><td>લગભગ શૂન્ય expansion</td><td>cooktop, lab નાં વાસણ</td></tr><tr><td>alumina</td><td>96 કે 99.5 % Al2O3</td><td>ઘસારો, insulation, 1500 C</td><td>spark plug, seal ની સપાટી</td></tr></table><p><b>કેમ સાચું છે.</b> બે કુટુંબને porosity જુદા પાડે છે. Traditional body એટલા નીચા તાપમાને sinter થાય કે 5 - 15 % ખુલ્લા છિદ્ર રહી જાય, જે તેને હલકું અને અવાહક બનાવે; advanced body 1 % થી ઓછા porosity સુધી sinter થાય, જે તેને મજબૂત બનાવે અને તેથી કિલો દીઠ સો ગણું મોંઘું પડે.</p><p><b>સામાન્ય ભૂલ.</b> પાકવું એ ઓગળવું નથી. પાકેલી ઈંટ પ્રવાહી થઈ નથી, તેથી છિદ્ર રહે છે; casting ની જેમ 10 % shrinkage allowance માનો તો ભાગ દરેક દિશામાં નાનો નીકળે.</p><p><b>જવાબ ચકાસો.</b> તાકાત પહેલાં expansion મેળવો. Glass-ceramic cooktop ગરમ તવા સહન કરે કારણ કે તેનું expansion લગભગ શૂન્ય છે; એ જ તાકાતનું સામાન્ય window glass એ જ તવા પર તૂટે.</p>"}, "diagram": "u4_ceramic"}]}, {"title": {"en": "4.4 Refractories and insulators", "gu": "4.4 Refractories અને insulators"}, "items": [{"h": {"en": "Refractories: the bricks that hold 1500 C", "gu": "Refractories: 1500 C પકડતી ઈંટો"}, "body": {"en": "<p>A refractory is a ceramic that keeps its shape and its strength in a furnace - above about 1500 C, in contact with slag, flue gas and a heat cycle. Four numbers describe one: its <b>refractoriness</b> (the pyrometric cone equivalent, PCE), its <b>refractoriness under load</b> (RUL, the temperature at which it softens by 0.5 % under 0.2 MPa), its <b>porosity</b> (15 - 25 % in a firebrick) and its resistance to <b>spalling</b>, the cracking that a heat cycle causes. Fireclay is the cheap general brick, silica serves glass tanks, magnesia and dolomite serve steel ladles.</p><div class=\"math\">heat through two layers in series:  q = dT / (L1/k1 + L2/k2)\nR1 = 0.230/1.00 = 0.230      R2 = 0.115/0.12 = 0.958      sum = 1.188 m2 K/W\nq = (1200 - 50)/1.188 = 968 W per m2\ninterface: T = 1200 - 968 x 0.230 = 977 C\nbare firebrick alone: q = 1150/0.230 = 5000 W per m2, so 80 % is saved</div><table><tr><th>refractory</th><th>type</th><th>max use</th><th>used in</th></tr><tr><td>fireclay</td><td>semi-acidic</td><td>1300 - 1500 C</td><td>boiler, kiln, general lining</td></tr><tr><td>silica</td><td>acidic</td><td>1700 C</td><td>glass tank, coke oven</td></tr><tr><td>magnesia</td><td>basic</td><td>2000 C</td><td>steel ladle, cement kiln</td></tr><tr><td>dolomite</td><td>basic</td><td>1900 C</td><td>converter, ladle lining</td></tr><tr><td>chromite</td><td>neutral</td><td>1900 C</td><td>where the slag swings</td></tr><tr><td>graphite</td><td>neutral</td><td>2000 C</td><td>monolithic, tap hole</td></tr><tr><td>ceramic fibre</td><td>insulating</td><td>1260 C</td><td>furnace back-up layer</td></tr></table><p><b>Why it is true.</b> thermal resistances in series add exactly like electrical ones. The same heat has to cross both layers, so the temperature drop divides in proportion to L/k: 0.230 against 0.958 means the thin insulating layer takes 81 % of the drop while the thick firebrick takes 19 %.</p><p><b>Common mistake.</b> matching the slag matters more than the maximum temperature. A silica brick rated 1700 C is eaten through in a few weeks by a basic steel slag, while a magnesia brick rated lower lasts a campaign in the same place.</p>", "gu": "<p>Refractory એ ceramic છે જે ભઠ્ઠીમાં આકાર અને તાકાત જાળવે - લગભગ 1500 C ઉપર, slag, flue gas અને ગરમી-ઠંડીના ચક્રના સંપર્કમાં. ચાર આંકડા તેને વર્ણવે: <b>refractoriness</b> (pyrometric cone equivalent, PCE), <b>refractoriness under load</b> (RUL, 0.2 MPa નીચે 0.5 % નરમ પડે તે તાપમાન), <b>porosity</b> (firebrick માં 15 - 25 %) અને <b>spalling</b> સામે ટકાવારી, એટલે ગરમી-ઠંડીના ચક્રથી પડતી તિરાડ. Fireclay સસ્તી સામાન્ય ઈંટ છે, silica glass tank માટે, magnesia અને dolomite steel ladle માટે.</p><div class=\"math\">heat through two layers in series:  q = dT / (L1/k1 + L2/k2)\nR1 = 0.230/1.00 = 0.230      R2 = 0.115/0.12 = 0.958      sum = 1.188 m2 K/W\nq = (1200 - 50)/1.188 = 968 W per m2\ninterface: T = 1200 - 968 x 0.230 = 977 C\nbare firebrick alone: q = 1150/0.230 = 5000 W per m2, so 80 % is saved</div><table><tr><th>refractory</th><th>પ્રકાર</th><th>વધુમાં વધુ</th><th>ક્યાં વપરાય</th></tr><tr><td>fireclay</td><td>semi-acidic</td><td>1300 - 1500 C</td><td>boiler, ભઠ્ઠી, સામાન્ય lining</td></tr><tr><td>silica</td><td>acidic</td><td>1700 C</td><td>glass tank, coke ભઠ્ઠી</td></tr><tr><td>magnesia</td><td>basic</td><td>2000 C</td><td>steel ladle, cement ભઠ્ઠી</td></tr><tr><td>dolomite</td><td>basic</td><td>1900 C</td><td>converter, ladle નું lining</td></tr><tr><td>chromite</td><td>neutral</td><td>1900 C</td><td>જ્યાં slag બદલાય</td></tr><tr><td>graphite</td><td>neutral</td><td>2000 C</td><td>monolithic, tap hole (છિદ્ર)</td></tr><tr><td>ceramic fibre</td><td>અવાહક</td><td>1260 C</td><td>ભઠ્ઠીનું પાછળનું સ્તર</td></tr></table><p><b>કેમ સાચું છે.</b> series માં thermal resistance બરાબર electrical જેમ જોડાય. એ જ ઉષ્મા બંને સ્તર પાર કરે, તેથી તાપમાનનો ઘટાડો L/k ના પ્રમાણમાં વહેંચાય: 0.230 સામે 0.958 એટલે પાતળું અવાહક સ્તર 78 % ઘટાડો લે જ્યારે જાડી firebrick 19 %.</p><p><b>સામાન્ય ભૂલ.</b> Slag મેળવવો વધુમાં વધુ તાપમાન કરતાં વધુ મહત્વનો છે. 1700 C રેટેડ silica ઈંટ basic steel slag થી થોડા અઠવાડિયામાં ખાઈ જાય, જ્યારે ઓછું રેટેડ magnesia ઈંટ એ જ જગ્યાએ આખું campaign ટકે.</p>"}, "diagram": "u4_refract"}, {"h": {"en": "Insulators: stopping a current and stopping a heat flow are two jobs", "gu": "Insulators: current રોકવો અને ઉષ્મા રોકવી બે જુદાં કામ"}, "body": {"en": "<p>An electrical insulator is judged by its <b>dielectric strength</b>, in kV per mm, and by its resistivity; a thermal insulator is judged by its conductivity, in W/m K, and the two lists hardly overlap. Porcelain, glass, epoxy, bakelite, PTFE and dry transformer oil stop current; glass wool, rock wool, thermocol, ceramic fibre and aerogel stop heat. The best insulator of all is a still gas - air is 0.026 W/m K and 3 kV/mm - which is why foams, wools and aerogels are mostly trapped air.</p><div class=\"math\">insulator thickness for a given withstand voltage:  t = V x SF / E_b\n11 kV busbar, factor of safety 3 -> withstand 33 kV\nporcelain E_b = 15 kV/mm:  t = 33/15 = 2.2 mm, so a 3 mm wall is specified\n3 mm of porcelain breaks down at 3 x 15 = 45 kV, a factor of 4.1 on 11 kV\nheat: q = k A dT/L; 50 mm of glass wool at 0.040 W/m K loses 8.0 W per m2 over 10 K</div><table><tr><th>insulator</th><th>type</th><th>figure</th><th>used for</th></tr><tr><td>porcelain</td><td>electrical</td><td>15 kV/mm</td><td>line insulator, bushing</td></tr><tr><td>epoxy resin</td><td>electrical</td><td>20 kV/mm</td><td>CT, busbar support</td></tr><tr><td>PTFE</td><td>electrical</td><td>24 kV/mm</td><td>terminal, spacer</td></tr><tr><td>transformer oil</td><td>electrical</td><td>12 kV/mm</td><td>cooling and insulation</td></tr><tr><td>glass wool</td><td>thermal</td><td>0.040 W/m K</td><td>furnace, duct, pipe</td></tr><tr><td>aerogel</td><td>thermal</td><td>0.015 W/m K</td><td>thin wall, cryogenic</td></tr><tr><td>ceramic fibre</td><td>thermal</td><td>0.10 W/m K</td><td>furnace lining back-up</td></tr></table><p><b>Why it is true.</b> conduction needs something to carry the energy - electrons, or atoms that pass a vibration along. A still gas has neither, so the trick of every thermal insulator is to divide a solid into fine cells that hold the gas still; the same reason makes a dry, dusty surface a far better insulator than a wet one.</p><p><b>Common mistake.</b> a damp insulator is a conductor. Water on a porcelain surface drops the surface resistivity from about 1e16 to 1e8 ohm and the creepage path flashes over, which is why outdoor insulators have sheds and a long leakage distance.</p><p><b>Check your answer.</b> for an 11 kV support, write three numbers: the withstand voltage, the kV/mm of the material and the thickness. Then check the surface path separately - thickness stops the puncture, distance stops the flashover.</p>", "gu": "<p>Electrical insulator તેની <b>dielectric strength</b>, kV પ્રતિ mm, અને resistivity થી આંકવાય; thermal insulator તેની conductivity, W/m K, થી, અને બંને યાદી ભાગ્યે જ મળે. Porcelain, glass, epoxy, bakelite, PTFE અને સૂકું transformer oil current રોકે; glass wool, rock wool, thermocol, ceramic fibre અને aerogel ઉષ્મા રોકે. સૌથી સારો insulator સ્થિર વાયુ છે - હવા 0.026 W/m K અને 3 kV/mm - તેથી foam, wool અને aerogel માં મોટે ભાગે ફસાયેલી હવા હોય છે.</p><div class=\"math\">insulator thickness for a given withstand voltage:  t = V x SF / E_b\n11 kV busbar, factor of safety 3 -> withstand 33 kV\nporcelain E_b = 15 kV/mm:  t = 33/15 = 2.2 mm, so a 3 mm wall is specified\n3 mm of porcelain breaks down at 3 x 15 = 45 kV, a factor of 4.1 on 11 kV\nheat: q = k A dT/L; 50 mm of glass wool at 0.040 W/m K loses 8.0 W per m2 over 10 K</div><table><tr><th>insulator</th><th>પ્રકાર</th><th>આંકડો</th><th>ઉપયોગ</th></tr><tr><td>porcelain</td><td>વીજ</td><td>15 kV/mm</td><td>લાઇન insulator, bushing</td></tr><tr><td>epoxy resin</td><td>વીજ</td><td>20 kV/mm</td><td>CT, busbar support</td></tr><tr><td>PTFE</td><td>વીજ</td><td>24 kV/mm</td><td>terminal, spacer</td></tr><tr><td>transformer oil</td><td>વીજ</td><td>12 kV/mm</td><td>ઠંડક અને insulation</td></tr><tr><td>glass wool</td><td>ઉષ્મા</td><td>0.040 W/m K</td><td>ભઠ્ઠી, duct, પાઇપ</td></tr><tr><td>aerogel</td><td>ઉષ્મા</td><td>0.015 W/m K</td><td>પાતળી દીવાલ, cryogenic</td></tr><tr><td>ceramic fibre</td><td>ઉષ્મા</td><td>0.10 W/m K</td><td>ભઠ્ઠી lining નું પાછળનું સ્તર</td></tr></table><p><b>કેમ સાચું છે.</b> વહન માટે ઊર્જા ઉપાડનારું કંઈક જોઈએ - electrons, કે કંપન આગળ પસાર કરતા atoms. સ્થિર વાયુમાં બંને નથી, તેથી દરેક thermal insulator ની યુક્તિ એ છે કે ઘનને નાના કોષોમાં વહેંચીને વાયુને સ્થિર રાખવો; એ જ કારણે સૂકી, ધૂળવાળી સપાટી ભીની કરતાં ઘણી સારી અવાહક બને.</p><p><b>સામાન્ય ભૂલ.</b> ભીનું insulator conductor છે. Porcelain ની સપાટી પરનું પાણી surface resistivity 1e16 થી 1e8 ohm સુધી ઘટાડે અને creepage પથ flash over થાય, તેથી બહારના insulator માં છત્રી અને લાંબું leakage અંતર હોય.</p><p><b>જવાબ ચકાસો.</b> 11 kV support માટે ત્રણ આંકડા લખો: withstand વોલ્ટેજ, સામગ્રીનું kV/mm અને જાડાઈ. પછી સપાટીનો રસ્તો અલગ ચકાસો - જાડાઈ puncture રોકે, અંતર flashover રોકે.</p>"}, "diagram": "u4_insul"}]}, {"title": {"en": "4.5 Abrasives and adhesives", "gu": "4.5 Abrasives અને adhesives"}, "items": [{"h": {"en": "Abrasives: the grain, the bond and the grit number", "gu": "Abrasives: grain, bond અને grit number"}, "body": {"en": "<p>An abrasive is a material harder than the work it has to cut. The natural ones are sandstone, emery (60 - 70 % alumina in iron oxide), corundum and diamond; almost everything sold today is synthetic - silicon carbide, made in an electric furnace since 1891, fused alumina, cubic boron nitride since 1957 and synthetic diamond. The grain is held in a <b>bond</b> - vitrified clay for a bench wheel, resinoid for a cut-off disc, rubber and shellac for a polishing wheel, paper or cloth for a coated belt - and it is sized by a <b>grit number</b>: 8 - 24 coarse, 30 - 60 medium, 80 - 180 fine, 220 - 600 for lapping.</p><div class=\"math\">wheel speed:  v = pi D N / 60\nD = 0.250 m, N = 2000 rpm:  v = pi x 0.250 x 2000/60 = 26 m/s\na vitrified wheel is rated 35 m/s, so 26 m/s leaves a margin of 26 %\nthe same wheel at 2800 rpm reaches 36.6 m/s and must not be run</div><table><tr><th>abrasive</th><th>Knoop</th><th>used on</th><th>note</th></tr><tr><td>emery</td><td>1300</td><td>wood, paint</td><td>natural, cheap</td></tr><tr><td>fused alumina</td><td>2100</td><td>steel, general</td><td>the workshop default</td></tr><tr><td>silicon carbide</td><td>2500</td><td>cast iron, carbide, stone</td><td>sharp and friable</td></tr><tr><td>CBN</td><td>4500</td><td>hardened steel, HSS</td><td>no burn, long life</td></tr><tr><td>diamond</td><td>7000</td><td>carbide, ceramic, glass</td><td>last resort, expensive</td></tr></table><p><b>Why it is true.</b> a grinding wheel has to sharpen itself. As the grain dulls the force on it rises until the bond breaks and the worn grain falls out, exposing a new edge - that is <b>self-sharpening</b>, and it is why the bond is chosen to match the work and not the grain.</p><p><b>Common mistake.</b> a glazed wheel is not a dull wheel: the pores have filled with swarf and the grain cannot cut. Dressing with a star dresser opens it again, and it is the operator's job, not a reason to buy a new wheel.</p>", "gu": "<p>Abrasive એટલે કાપવાની સામગ્રી કરતાં સખત પદાર્થ. કુદરતી એટલે પથ્થર, emery (iron oxide માં 60 - 70 % alumina), corundum અને diamond; આજે વેચાતું લગભગ બધું synthetic છે - silicon carbide, 1891 થી electric furnace માં બનતું, fused alumina, 1957 થી cubic boron nitride અને synthetic diamond. Grain <b>bond</b> માં પકડાય છે - bench wheel માટે vitrified માટી, cut-off disc માટે resinoid, polishing wheel માટે rubber અને shellac, coated belt માટે paper કે કપડું - અને તેનું માપ <b>grit number</b> થી થાય: 8 - 24 જાડું, 30 - 60 મધ્યમ, 80 - 180 બારીક, lapping માટે 220 - 600.</p><div class=\"math\">wheel speed:  v = pi D N / 60\nD = 0.250 m, N = 2000 rpm:  v = pi x 0.250 x 2000/60 = 26 m/s\na vitrified wheel is rated 35 m/s, so 26 m/s leaves a margin of 26 %\nthe same wheel at 2800 rpm reaches 36.6 m/s and must not be run</div><table><tr><th>abrasive</th><th>Knoop</th><th>શેના પર</th><th>નોંધ</th></tr><tr><td>emery</td><td>1300</td><td>લાકડું, પેન્ટ</td><td>કુદરતી, સસ્તું</td></tr><tr><td>fused alumina</td><td>2100</td><td>સ્ટીલ, સામાન્ય</td><td>workshop ની પસંદ</td></tr><tr><td>silicon carbide</td><td>2500</td><td>cast iron, carbide, પથ્થર</td><td>તીવ્ર અને ભૂરું</td></tr><tr><td>CBN</td><td>4500</td><td>hardened સ્ટીલ, HSS</td><td>બળતર નહીં, લાંબું આયુષ્ય</td></tr><tr><td>diamond</td><td>7000</td><td>carbide, ceramic, glass (કાચ)</td><td>છેલ્લો ઉપાય, મોંઘું</td></tr></table><p><b>કેમ સાચું છે.</b> grinding wheel ને પોતાની જાતે ધારી રાખવી પડે. Grain થૂંસાતાં તેના પરનું બળ વધે અને bond તૂટે, ઘસાયેલો grain નીકળી જાય અને નવી ધાર આવે - એ <b>self-sharpening</b> છે, અને તેથી bond grain નહીં, કામ પ્રમાણે પસંદ થાય.</p><p><b>સામાન્ય ભૂલ.</b> glazed wheel dull wheel નથી: છિદ્રોમાં swarf ભરાઈ જાય અને grain કાપી શકે નહીં. Star dresser થી dressing કરવાથી ફરી ખૂલે, અને એ operator નું કામ છે, નવું wheel ખરીદવાનું કારણ નહીં.</p>"}, "diagram": "u4_abrasive"}, {"h": {"en": "Adhesives: the joint is the design", "gu": "Adhesives: જોડાણ જ design છે"}, "body": {"en": "<p>An adhesive joins two parts through surface attraction instead of a rivet or a weld. Structural adhesives - epoxy, toughened acrylic, polyurethane - carry real load; cyanoacrylate and hot melt are for small or temporary work; anaerobic grades lock a thread. The glue is only half the joint: the surface must be <b>degreased</b>, <b>abraded</b> to 0.5 - 2 um and often primed, because adhesion happens in the first few molecular layers. A lap joint loaded in <b>shear</b> over the largest area is strong; the same glue in <b>peel</b> is ten times weaker.</p><div class=\"math\">lap shear stress:  tau = P/A\noverlap 25 mm x 40 mm = 1000 mm2, load 5 kN:  tau = 5000/1000 = 5.0 MPa\nepoxy lap shear strength 20 MPa -> factor of safety 20/5 = 4.0\nat a required factor of 3 the joint carries 20/3 x 1000 = 6.67 kN\nthe same 5 kN in peel may need 10 times the area</div><table><tr><th>adhesive</th><th>shear, MPa</th><th>cure</th><th>used for</th></tr><tr><td>epoxy</td><td>20</td><td>24 h, or 30 min at 80 C</td><td>structural, gaps filled</td></tr><tr><td>toughened acrylic</td><td>15</td><td>10 min</td><td>oily steel, fast line</td></tr><tr><td>cyanoacrylate</td><td>12</td><td>10 s</td><td>small plastic parts</td></tr><tr><td>polyurethane</td><td>8</td><td>1 - 24 h</td><td>flexible panel, wood</td></tr><tr><td>PVA</td><td>6</td><td>1 h clamp</td><td>wood, paper</td></tr><tr><td>hot melt</td><td>3</td><td>seconds</td><td>packaging, trim</td></tr><tr><td>anaerobic</td><td>10</td><td>20 min</td><td>thread locking</td></tr></table><p><b>Why it is true.</b> adhesion is surface chemistry, so the joint fails where the chemistry was not done. A greasy surface is not wetted, the glue sits on the oil instead of on the metal, and the joint peels at the interface while the glue itself is still intact.</p><p><b>Common mistake.</b> a thick glue line is a weak joint. The best bond line is 0.1 - 0.2 mm; a 1 mm gap filled with brittle epoxy shrinks on cure, leaves voids and cracks under load, which is why a gap-filling adhesive is a different product.</p><p><b>Check your answer.</b> design the joint before choosing the glue: put the load in shear, give it area, and keep the peel path out of it. A butt joint on a 20 MPa epoxy carries less than a lap joint on a 6 MPa PVA.</p>", "gu": "<p>Adhesive બે ભાગને rivet કે weld નહીં, સપાટીના આકર્ષણ થી જોડે. Structural adhesives - epoxy, toughened acrylic, polyurethane - ખરો લોડ ઉપાડે; cyanoacrylate અને hot melt નાના કે હંગામી કામ માટે; anaerobic grade thread લોક કરે. ગુંદર અડધું જ જોડાણ છે: સપાટી <b>degrease</b> કરવી પડે, 0.5 - 2 um સુધી <b>abrade</b> કરવી પડે અને ઘણી વાર primer લગાવવો પડે, કારણ કે adhesion પહેલા થોડા molecular સ્તરોમાં જ થાય. <b>Shear</b> માં સૌથી મોટા area પર લોડ પડતું lap joint મજબૂત હોય; એ જ ગુંદર <b>peel</b> માં દસ ગણું નબળું.</p><div class=\"math\">lap shear stress:  tau = P/A\noverlap 25 mm x 40 mm = 1000 mm2, load 5 kN:  tau = 5000/1000 = 5.0 MPa\nepoxy lap shear strength 20 MPa -> factor of safety 20/5 = 4.0\nat a required factor of 3 the joint carries 20/3 x 1000 = 6.67 kN\nthe same 5 kN in peel may need 10 times the area</div><table><tr><th>adhesive</th><th>shear, MPa</th><th>cure</th><th>ઉપયોગ</th></tr><tr><td>epoxy</td><td>20</td><td>24 કલાક, કે 80 C પર 30 મિનિટ</td><td>structural, ખાલી જગ્યા ભરે</td></tr><tr><td>toughened acrylic</td><td>15</td><td>10 મિનિટ</td><td>તેલવાળું સ્ટીલ, ઝડપી લાઇન</td></tr><tr><td>cyanoacrylate</td><td>12</td><td>10 સેકન્ડ</td><td>નાના plastic ભાગ</td></tr><tr><td>polyurethane</td><td>8</td><td>1 - 24 કલાક</td><td>લચીલું panel, લાકડું</td></tr><tr><td>PVA</td><td>6</td><td>1 કલાક clamp</td><td>લાકડું, કાગળ</td></tr><tr><td>hot melt</td><td>3</td><td>સેકન્ડો</td><td>packaging, trim</td></tr><tr><td>anaerobic</td><td>10</td><td>20 મિનિટ</td><td>thread લોક</td></tr></table><p><b>કેમ સાચું છે.</b> adhesion સપાટીનું રસાયણ છે, તેથી જ્યાં રસાયણ થયું નથી ત્યાં જોડાણ તૂટે. ચીકણી સપાટી ભીંજાતી નથી, ગુંદર ધાતુ પર નહીં તેલ પર બેસે, અને ગુંદર સાબૂત હોય તોય જોડાણ interface પરથી ઊખડે.</p><p><b>સામાન્ય ભૂલ.</b> જાડી ગુંદરની લાઇન નબળું જોડાણ છે. સૌથી સારી bond line 0.1 - 0.2 mm; ભંગુર epoxy થી ભરેલી 1 mm જગ્યા cure માં સંકોચાય, ખાલી જગ્યા રહે અને લોડ નીચે તૂટે, તેથી gap-filling adhesive અલગ ઉત્પાદન હોય.</p><p><b>જવાબ ચકાસો.</b> ગુંદર પસંદ કરતાં પહેલાં જોડાણ design કરો: લોડ shear માં રાખો, area આપો, અને peel નો રસ્તો દૂર રાખો. 20 MPa epoxy નું butt joint, 6 MPa PVA ના lap joint કરતાં ઓછું ઉપાડે.</p>"}}]}, {"title": {"en": "4.6 Solved Numericals, Step by Step", "gu": "4.6 ઉકેલેલા દાખલા, પગલે પગલે"}, "items": [{"h": {"en": "An alumina spacer that cannot expand", "gu": "ફેલાઈ ન શકતું alumina spacer"}, "body": {"en": "<h4>Question (7 marks)</h4><p>An alumina spacer of E 300 GPa and alpha 8.0e-6 per K is clamped between steel flanges so that it cannot expand. Find the stress in the spacer at a temperature rise of 200 K and of 100 K, compare with its 300 MPa flexural strength, and state two ways to make the joint safe.</p><h4>Step 1 - the constrained stress</h4><div class=\"math\">sigma = E alpha dT = 300e9 x 8.0e-6 x dT = 2.4e6 x dT  Pa\ndT = 200 K:  sigma = 2.4e6 x 200 = 480 MPa\ndT = 100 K:  sigma = 2.4e6 x 100 = 240 MPa</div><h4>Step 2 - compare with the strength</h4><div class=\"math\">flexural strength 300 MPa\n480/300 = 1.60  ->  the spacer is 60 % over its strength and cracks\n240/300 = 0.80  ->  factor of safety 1.25, thin but safe</div><div class=\"eq\">480 MPa at 200 K is a cracked spacer;  240 MPa at 100 K is a marginal one</div><h4>Step 3 - two ways to make the joint safe</h4><div class=\"math\">1. leave a clearance of alpha L dT, or put a compliant gasket in the joint\n2. use fused silica instead: 72e9 x 0.55e-6 x 200 = 7.9 MPa</div><p>A fully constrained ceramic is the worst case in the whole of Unit 4: the metal frame has a higher expansion coefficient and a much higher strength, so it wins the argument and the ceramic breaks. Either let the ceramic move, or soften the load path with a gasket, or choose a ceramic with a lower expansion coefficient - fused silica at 0.55e-6 develops only 7.9 MPa where alumina develops 480 MPa.</p><p><b>Check your answer.</b> Units: E in Pa and alpha in per K give a stress in Pa, so 2.4e6 x 200 = 480e6 Pa = 480 MPa. Check the sign too: on cooling the stress reverses, and a ceramic is just as weak in tension then.</p>", "gu": "<h4>પ્રશ્ન (7 marks)</h4><p>E 300 GPa અને alpha 8.0e-6 પ્રતિ K નું alumina spacer steel flange વચ્ચે એવી રીતે clamp થયું છે કે ફેલાઈ શકે નહીં. 200 K અને 100 K તાપમાન વધારા પર spacer માં stress શોધો, તેની 300 MPa flexural strength સાથે સરખાવો, અને જોડાણ સલામત કરવાની બે રીતો કહો.</p><h4>પગલું 1 - રોકાયેલો stress</h4><div class=\"math\">sigma = E alpha dT = 300e9 x 8.0e-6 x dT = 2.4e6 x dT  Pa\ndT = 200 K:  sigma = 2.4e6 x 200 = 480 MPa\ndT = 100 K:  sigma = 2.4e6 x 100 = 240 MPa</div><h4>પગલું 2 - તાકાત સાથે સરખામણી</h4><div class=\"math\">flexural strength 300 MPa\n480/300 = 1.60  ->  the spacer is 60 % over its strength and cracks\n240/300 = 0.80  ->  factor of safety 1.25, thin but safe</div><div class=\"eq\">480 MPa at 200 K is a cracked spacer;  240 MPa at 100 K is a marginal one</div><h4>પગલું 3 - જોડાણ સલામત કરવાની બે રીતો</h4><div class=\"math\">1. leave a clearance of alpha L dT, or put a compliant gasket in the joint\n2. use fused silica instead: 72e9 x 0.55e-6 x 200 = 7.9 MPa</div><p>આખા Unit 4 માં fully constrained ceramic સૌથી ખરાબ કિસ્સો છે: metal frame નું expansion coefficient વધારે અને તાકાત ઘણી વધારે હોય, તેથી તે જીતે અને ceramic તૂટે. Ceramic ને ખસવા દો, અથવા gasket થી લોડનો રસ્તો નરમ કરો, અથવા ઓછા expansion વાળું ceramic પસંદ કરો - fused silica 0.55e-6 પર ફક્ત 7.9 MPa બનાવે જ્યાં alumina 480 MPa બનાવે.</p><p><b>જવાબ ચકાસો.</b> એકમ: Pa માં E અને પ્રતિ K માં alpha એટલે Pa માં stress, તેથી 2.4e6 x 200 = 480e6 Pa = 480 MPa. ચિહ્ન પણ ચકાસો: ઠંડા પડતાં stress ઊલટો થાય, અને ceramic ત્યારે પણ તેટલું જ નબળું છે.</p>"}}, {"h": {"en": "Thermal shock: alumina against glass", "gu": "Thermal shock: alumina સામે glass"}, "body": {"en": "<h4>Question (6 marks)</h4><p>Compare the thermal shock resistance of alumina (300 MPa, nu 0.22, E 300 GPa, alpha 8.0e-6), soda-lime glass (50 MPa, nu 0.22, E 70 GPa, alpha 9.0e-6) and fused silica (110 MPa, nu 0.17, E 72 GPa, alpha 0.55e-6). Say which one can be quenched in water and why.</p><h4>Step 1 - the parameter R</h4><div class=\"math\">R = sigma_f (1 - nu)/(E alpha),  the temperature step the part survives\nalumina:     300e6 x 0.78/(300e9 x 8.0e-6) = 234e6/2.4e6   =  97 K\nsoda glass:   50e6 x 0.78/(70e9 x 9.0e-6)  = 39e6/0.63e6  =  62 K\nfused silica: 110e6 x 0.83/(72e9 x 0.55e-6) = 91.3e6/39.6e3 = 2305 K</div><h4>Step 2 - what the numbers mean</h4><div class=\"math\">a hot alumina part dropped in water sees about 200 K, so it cracks\na glass part cracks at 62 K, so it cracks in warm water\nsilica at 2305 K survives any quench a workshop can give it</div><div class=\"eq\">alumina 97 K,  soda-lime glass 62 K,  fused silica 2305 K</div><p>Fused silica is 24 times tougher against a quench than alumina, and it gets there not by being strong but by having almost no expansion: alpha 0.55e-6 against 8.0e-6 cancels the strength difference completely. That is why a laboratory crucible is silica and not alumina, and why a glass-ceramic cooktop can take a hot pan while ordinary window glass cannot.</p><p><b>Check your answer.</b> R has the unit of temperature - if your answer comes out in MPa or in kelvin per metre, the bracket was assembled wrongly.</p>", "gu": "<h4>પ્રશ્ન (6 marks)</h4><p>Alumina (300 MPa, nu 0.22, E 300 GPa, alpha 8.0e-6), soda-lime glass (50 MPa, nu 0.22, E 70 GPa, alpha 9.0e-6) અને fused silica (110 MPa, nu 0.17, E 72 GPa, alpha 0.55e-6) ની thermal shock resistance સરખાવો. કોને પાણીમાં ઠારી શકાય અને કેમ તે કહો.</p><h4>પગલું 1 - parameter R</h4><div class=\"math\">R = sigma_f (1 - nu)/(E alpha),  the temperature step the part survives\nalumina:     300e6 x 0.78/(300e9 x 8.0e-6) = 234e6/2.4e6   =  97 K\nsoda glass:   50e6 x 0.78/(70e9 x 9.0e-6)  = 39e6/0.63e6  =  62 K\nfused silica: 110e6 x 0.83/(72e9 x 0.55e-6) = 91.3e6/39.6e3 = 2305 K</div><h4>પગલું 2 - આંકડાનો અર્થ</h4><div class=\"math\">a hot alumina part dropped in water sees about 200 K, so it cracks\na glass part cracks at 62 K, so it cracks in warm water\nsilica at 2305 K survives any quench a workshop can give it</div><div class=\"eq\">alumina 97 K,  soda-lime glass 62 K,  fused silica 2305 K</div><p>Fused silica quench સામે alumina કરતાં 24 ગણું ટકાઉ છે, અને એ તાકાત થી નહીં પણ લગભગ શૂન્ય expansion થી મળે: 0.55e-6 સામે 8.0e-6 તાકાતનો ફરક પૂરો કરી નાખે. તેથી lab ની crucible silica ની હોય, alumina ની નહીં, અને glass-ceramic cooktop ગરમ તવો ઝીલે જ્યારે સામાન્ય window glass નહીં.</p><p><b>જવાબ ચકાસો.</b> R નું એકમ તાપમાન છે - જવાબ MPa કે kelvin પ્રતિ મીટરમાં આવે તો કૌંસ ખોટો ગોઠવાયો છે.</p>"}}, {"h": {"en": "A furnace wall, and what the insulation saves", "gu": "ભઠ્ઠીની દીવાલ, અને insulation શું બચાવે"}, "body": {"en": "<h4>Question (7 marks)</h4><p>A furnace wall is 230 mm of firebrick (k 1.0 W/m K) on the hot side and 115 mm of insulating brick (k 0.12 W/m K) outside it. The hot face is at 1200 C and the cold face at 50 C. Find the heat loss per m2, the interface temperature, and the money saved per m2 in a month if the furnace runs continuously at Rs 8 per kWh.</p><h4>Step 1 - the two resistances</h4><div class=\"math\">R1 = 0.230/1.00 = 0.230 m2 K/W      R2 = 0.115/0.12 = 0.958 m2 K/W\nsum = 1.188 m2 K/W</div><h4>Step 2 - the heat flux and the interface</h4><div class=\"math\">q = (1200 - 50)/1.188 = 968 W per m2\nT(interface) = 1200 - 968 x 0.230 = 1200 - 223 = 977 C\ncheck from the cold side: 50 + 968 x 0.958 = 977 C</div><h4>Step 3 - what the insulation saves</h4><div class=\"math\">bare firebrick: q = 1150/0.230 = 5000 W per m2\nsaving = 5000 - 968 = 4032 W per m2 = 4.03 kW per m2\none month = 720 h: 4.03 x 720 = 2903 kWh;  at Rs 8 = Rs 23,224 per m2</div><div class=\"eq\">968 W per m2,  977 C at the joint,  Rs 23,224 per m2 per month saved</div><p>The insulation is 115 mm thick against 230 mm of firebrick, and it takes 81 % of the temperature drop. That is the point of a two-layer wall: the cheap dense brick is there to resist the slag and the abrasion, and the thin, more expensive insulating layer is there to do the saving.</p><p><b>Check your answer.</b> The flux must be the same through both layers - if your two interface temperatures differ, one of the resistances is wrong.</p>", "gu": "<h4>પ્રશ્ન (7 marks)</h4><p>ભઠ્ઠીની દીવાલ ગરમ બાજુ 230 mm firebrick (k 1.0 W/m K) અને બહાર 115 mm insulating brick (k 0.12 W/m K) ની છે. ગરમ સપાટી 1200 C અને ઠંડી સપાટી 50 C છે. પ્રતિ m2 ઉષ્માનો વ્યય, interface નું તાપમાન, અને ભઠ્ઠી સતત ચાલે તો Rs 8 પ્રતિ kWh પર એક મહિનામાં પ્રતિ m2 કેટલા રૂપિયા બચે તે શોધો.</p><h4>પગલું 1 - બે resistance</h4><div class=\"math\">R1 = 0.230/1.00 = 0.230 m2 K/W      R2 = 0.115/0.12 = 0.958 m2 K/W\nsum = 1.188 m2 K/W</div><h4>પગલું 2 - heat flux અને interface</h4><div class=\"math\">q = (1200 - 50)/1.188 = 968 W per m2\nT(interface) = 1200 - 968 x 0.230 = 1200 - 223 = 977 C\ncheck from the cold side: 50 + 968 x 0.958 = 977 C</div><h4>પગલું 3 - insulation શું બચાવે</h4><div class=\"math\">bare firebrick: q = 1150/0.230 = 5000 W per m2\nsaving = 5000 - 968 = 4032 W per m2 = 4.03 kW per m2\none month = 720 h: 4.03 x 720 = 2903 kWh;  at Rs 8 = Rs 23,224 per m2</div><div class=\"eq\">968 W per m2,  977 C at the joint,  Rs 23,224 per m2 per month saved</div><p>Insulation 230 mm firebrick સામે 115 mm જ જાડું છે, અને તાપમાનનો 81 % ઘટાડો લે છે. બે સ્તરની દીવાલનો આ જ મુદ્દો છે: સસ્તી ગાઢ ઈંટ slag અને ઘસારો ઝીલવા, અને પાતળું મોંઘું અવાહક સ્તર બચત કરવા.</p><p><b>જવાબ ચકાસો.</b> બંને સ્તરમાંથી flux એક જ આવવો જોઈએ - બંને બાજુનું interface તાપમાન જુદું આવે તો એક resistance ખોટો છે.</p>"}}, {"h": {"en": "Porosity and absorption of a firebrick", "gu": "Firebrick નું porosity અને absorption"}, "body": {"en": "<h4>Question (6 marks)</h4><p>A firebrick sample of bulk volume 120 cm3 weighs 320 g dry and 345 g after soaking in water. Find its bulk density, its water absorption, its apparent porosity and its true density, and say what that porosity does to the brick.</p><h4>Step 1 - the water that went in</h4><div class=\"math\">water absorbed = 345 - 320 = 25 g,  so 25 cm3 of open pore</div><h4>Step 2 - the four numbers</h4><div class=\"math\">bulk density   = 320/120 = 2.67 g/cm3\nwater absorption = 25/320 x 100 = 7.8 %\napparent porosity = 25/120 x 100 = 20.8 %\ntrue density    = 320/(120 - 25) = 3.37 g/cm3</div><div class=\"eq\">2.67 g/cm3 bulk,  20.8 % open pore,  7.8 % absorption,  3.37 g/cm3 true</div><p>One brick in five is empty space. That is why a firebrick insulates so well - the pores hold still air at 0.026 W/m K - and it is also why its cold crushing strength is 20 to 60 MPa against 3000 MPa for a dense alumina. Porosity buys insulation and pays for it in strength and in slag penetration, because the same open pores that let water in let slag in as well.</p><p><b>Check your answer.</b> The two porosity routes must agree: 1 - 2.67/3.37 = 20.8 %, the same as 25/120.</p>", "gu": "<h4>પ્રશ્ન (6 marks)</h4><p>120 cm3 bulk volume નો firebrick નમૂનો સૂકો 320 g અને પાણીમાં પલાળ્યા પછી 345 g છે. તેની bulk density, water absorption, apparent porosity અને true density શોધો, અને એ porosity ઈંટ સાથે શું કરે તે કહો.</p><h4>પગલું 1 - અંદર ગયેલું પાણી</h4><div class=\"math\">water absorbed = 345 - 320 = 25 g,  so 25 cm3 of open pore</div><h4>પગલું 2 - ચાર આંકડા</h4><div class=\"math\">bulk density   = 320/120 = 2.67 g/cm3\nwater absorption = 25/320 x 100 = 7.8 %\napparent porosity = 25/120 x 100 = 20.8 %\ntrue density    = 320/(120 - 25) = 3.37 g/cm3</div><div class=\"eq\">2.67 g/cm3 bulk,  20.8 % open pore,  7.8 % absorption,  3.37 g/cm3 true</div><p>ઈંટનો પાંચમો ભાગ ખાલી જગ્યા છે. તેથી જ firebrick એટલી સારી રીતે અવાહક છે - છિદ્રોમાં સ્થિર હવા 0.026 W/m K પર રહે - અને તેથી જ તેની cold crushing strength 20 થી 60 MPa છે જ્યારે ગાઢ alumina ની 3000 MPa. Porosity insulation ખરીદે અને તેની કિંમત તાકાત તથી slag ઘૂસવામાં ચૂકવે, કારણ કે જે છિદ્રોમાં પાણી ગયું તેમાં slag પણ જાય.</p><p><b>જવાબ ચકાસો.</b> Porosity ના બંને રસ્તા મળવા જોઈએ: 1 - 2.67/3.37 = 20.8 %, જે 25/120 જ છે.</p>"}}, {"h": {"en": "An adhesive lap joint, and its factor of safety", "gu": "Adhesive lap joint, અને તેનું factor of safety"}, "body": {"en": "<h4>Question (6 marks)</h4><p>A bracket is glued to a plate with an epoxy whose lap shear strength is 20 MPa. The overlap is 25 mm wide and 40 mm long and the working load is 5 kN. Find the shear stress in the joint, its factor of safety, and the greatest load it may carry at a required factor of safety of 3.</p><h4>Step 1 - the shear stress</h4><div class=\"math\">A = 25 x 40 = 1000 mm2      tau = P/A = 5000/1000 = 5.0 MPa</div><h4>Step 2 - the factor of safety</h4><div class=\"math\">SF = 20/5.0 = 4.0</div><h4>Step 3 - the load allowed at SF 3</h4><div class=\"math\">tau_allow = 20/3 = 6.67 MPa\nP_max = 6.67 x 1000 = 6667 N = 6.67 kN</div><div class=\"eq\">5.0 MPa working,  factor of safety 4.0,  6.67 kN at a factor of 3</div><p>The joint is comfortable in shear, and that is the only reason it works. The same bracket in peel would carry a small fraction of 20 kN, because peel loads one adhesive line at a time instead of the whole area. A designer who wants the strength of the glue has to give it area in shear and keep the prying load out.</p><p><b>Check your answer.</b> Bond line thickness is not in this sum, but it decides the answer in practice: 0.1 - 0.2 mm is right, and a thick brittle line cracks before the sum says it should.</p>", "gu": "<h4>પ્રશ્ન (6 marks)</h4><p>Bracket એક plate પર 20 MPa lap shear strength વાળા epoxy થી ગુંદાય છે. Overlap 25 mm પહોળું અને 40 mm લાંબું છે અને કામનો લોડ 5 kN છે. જોડાણમાં shear stress, તેનું factor of safety, અને 3 નું factor of safety જોઈએ તો વધુમાં વધુ કેટલો લોડ ઉપાડી શકે તે શોધો.</p><h4>પગલું 1 - shear stress</h4><div class=\"math\">A = 25 x 40 = 1000 mm2      tau = P/A = 5000/1000 = 5.0 MPa</div><h4>પગલું 2 - factor of safety</h4><div class=\"math\">SF = 20/5.0 = 4.0</div><h4>પગલું 3 - SF 3 પર માન્ય લોડ</h4><div class=\"math\">tau_allow = 20/3 = 6.67 MPa\nP_max = 6.67 x 1000 = 6667 N = 6.67 kN</div><div class=\"eq\">5.0 MPa working,  factor of safety 4.0,  6.67 kN at a factor of 3</div><p>જોડાણ shear માં આરામદાયક છે, અને એ જ એક કારણે ચાલે છે. એ જ bracket peel માં 20 kN નો થોડો ભાગ જ ઉપાડે, કારણ કે peel આખા area ને બદલે એક વખતે એક adhesive લાઇન પર લોડ નાખે. ગુંદરની તાકાત જોઈએ તો designer એ shear માં area આપવો પડે અને ઉચકવાનો લોડ દૂર રાખવો પડે.</p><p><b>જવાબ ચકાસો.</b> Bond line ની જાડાઈ આ ગણતરીમાં નથી, પણ વ્યવહારમાં જવાબ એ જ નક્કી કરે: 0.1 - 0.2 mm સાચું છે, અને જાડી ભંગુર લાઇન ગણતરી કહે તે પહેલાં તૂટે.</p>"}}, {"h": {"en": "How thick must the insulator be", "gu": "Insulator કેટલું જાડું જોઈએ"}, "body": {"en": "<h4>Question (6 marks)</h4><p>A bakelite support of dielectric strength 18 kV/mm is used on an 11 kV busbar. For a 3 mm sheet, find the breakdown voltage and the factor of safety at 11 kV; then find the least thickness that gives a factor of safety of 3, and say why the surface path is checked separately.</p><h4>Step 1 - the breakdown of the sheet</h4><div class=\"math\">V_break = E_b x d = 18 x 3 = 54 kV</div><h4>Step 2 - the factor of safety on 11 kV</h4><div class=\"math\">SF = 54/11 = 4.9</div><h4>Step 3 - the thickness for a factor of 3</h4><div class=\"math\">required withstand = 3 x 11 = 33 kV\nt = V/E_b = 33/18 = 1.83 mm,  so 2 mm is specified and 3 mm is comfortable</div><div class=\"eq\">54 kV breakdown,  factor 4.9 at 11 kV,  1.83 mm needed for a factor of 3</div><p>Thickness stops a puncture and nothing else. The flashover travels over the surface, so it is stopped by distance - the creepage length - and a wet or dusty surface has a far lower flashover voltage than a clean one. That is why a 3 mm sheet of bakelite on a 11 kV busbar is wrapped in a long ribbed porcelain or epoxy shed rather than left bare.</p><p><b>Check your answer.</b> Keep kV and mm together: 18 kV/mm times 3 mm is 54 kV, and never multiply by a factor of safety twice - once in the thickness and once in the load.</p>", "gu": "<h4>પ્રશ્ન (6 marks)</h4><p>18 kV/mm dielectric strength વાળું bakelite support 11 kV busbar પર વપરાય છે. 3 mm sheet માટે breakdown વોલ્ટેજ અને 11 kV પર factor of safety શોધો; પછી factor of safety 3 આપતી ઓછામાં ઓછી જાડાઈ શોધો, અને સપાટીનો રસ્તો અલગ કેમ ચકાસાય તે કહો.</p><h4>પગલું 1 - sheet નું breakdown</h4><div class=\"math\">V_break = E_b x d = 18 x 3 = 54 kV</div><h4>પગલું 2 - 11 kV પર factor of safety</h4><div class=\"math\">SF = 54/11 = 4.9</div><h4>પગલું 3 - factor 3 માટે જાડાઈ</h4><div class=\"math\">required withstand = 3 x 11 = 33 kV\nt = V/E_b = 33/18 = 1.83 mm,  so 2 mm is specified and 3 mm is comfortable</div><div class=\"eq\">54 kV breakdown,  factor 4.9 at 11 kV,  1.83 mm needed for a factor of 3</div><p>જાડાઈ ફક્ત puncture રોકે. Flashover સપાટી પર થી પસાર થાય, તેથી તે અંતર - creepage લંબાઈ - થી રોકાય, અને ભીની કે ધૂળવાળી સપાટીનું flashover વોલ્ટેજ સાફ કરતાં ઘણું નીચું હોય. તેથી 11 kV busbar પરનું 3 mm bakelite નગ્ન નહીં, લાંબી ribbed porcelain કે epoxy છત્રીમાં લપેટાય.</p><p><b>જવાબ ચકાસો.</b> kV અને mm સાથે રાખો: 18 kV/mm ગુણ્યા 3 mm એટલે 54 kV, અને factor of safety બે વાર ન લગાવો - એક વાર જાડાઈમાં અને ફરી લોડમાં નહીં.</p>"}}]}], "diagrams": [{"id": "u4_tree", "title": {"en": "Classification of non-metallic materials", "gu": "Non-metallic materials નું વર્ગીકરણ"}, "file": "diagrams/u4_tree.svg", "caption": {"en": "Polymers, ceramics, composites and natural materials: four families that a mechanical drawing uses for weight, insulation, quiet running and cost, not for strength.", "gu": "Polymers, ceramics, composites અને natural materials: ચાર કુટુંબ જે ડ્રોઇંગ વજન, અવાહકતા, શાંત ચાલ અને ભાવ માટે વાપરે, તાકાત માટે નહીં."}}, {"id": "u4_rubber", "title": {"en": "Vulcanisation of rubber", "gu": "Rubber નું vulcanisation"}, "file": "diagrams/u4_rubber.svg", "caption": {"en": "Sulphur bridges turn a soft gum that stretches and stays stretched into a rubber that returns; the same 500 % elongation now comes back to zero.", "gu": "Sulphur ના પુલ નરમ gum ને, જે ખેંચાઈને ખેંચાયેલું જ રહે, એવા rubber માં ફેરવે જે પાછું આવે; એ જ 500 % elongation હવે શૂન્ય પર પાછું આવે."}}, {"id": "u4_ceramic", "title": {"en": "Service temperature of each family", "gu": "દરેક કુટુંબ કેટલી ગરમી સુધી ચાલે"}, "file": "diagrams/u4_ceramic.svg", "caption": {"en": "The ceiling on service temperature runs with the bond: van der Waals forces in a polymer, metallic bonds in a metal, ionic and covalent bonds in a ceramic.", "gu": "સેવાનું તાપમાન bond પ્રમાણે ચાલે: polymer માં van der Waals બળ, metal માં metallic bond, ceramic માં ionic અને covalent bond."}}, {"id": "u4_compare", "title": {"en": "Metals, ceramics and polymers compared", "gu": "Metal, ceramic અને polymer ની સરખામણી"}, "file": "diagrams/u4_compare.svg", "caption": {"en": "Bond, strength, ductility, ceiling, density and failure mode - six questions asked of all three families, so a choice is made from properties and not from habit.", "gu": "Bond, તાકાત, ductility, મર્યાદા, density અને તૂટવાની રીત - ત્રણેય કુટુંબને પૂછાતા છ પ્રશ્નો, જેથી પસંદગી ટેવ પ્રમાણે નહીં ગુણધર્મ પ્રમાણે થાય."}}, {"id": "u4_refract", "title": {"en": "A two-layer refractory wall", "gu": "બે સ્તરની refractory દીવાલ"}, "file": "diagrams/u4_refract.svg", "caption": {"en": "1200 C at the hot face and 50 C at the shell, with 977 C at the joint: the firebrick carries most of the temperature drop and the thin insulation layer saves 80 % of the heat.", "gu": "ગરમ સપાટી પર 1200 C અને shell પર 50 C, જોડાણ પર 977 C: મોટો તાપમાન ઘટાડો firebrick લે છે અને પાતળું અવાહક સ્તર 80 % ઉષ્મા બચાવે છે."}}, {"id": "u4_insul", "title": {"en": "Dielectric strength of insulators", "gu": "Insulators ની dielectric strength"}, "file": "diagrams/u4_insul.svg", "caption": {"en": "Dielectric strength decides the thickness: air is 3 kV/mm and PTFE is 24, so the same busbar needs a very different wall around it.", "gu": "જાડાઈ dielectric strength નક્કી કરે: હવા 3 kV/mm અને PTFE 24, તેથી એક જ busbar ને સાવ જુદી દીવાલ જોઈએ."}}, {"id": "u4_abrasive", "title": {"en": "The Mohs ladder and the abrasives", "gu": "Mohs ladder અને abrasives"}, "file": "diagrams/u4_abrasive.svg", "caption": {"en": "Quartz at 7, corundum at 9 and diamond at 10 on the Mohs scale, and the synthetic abrasives placed between them by Knoop hardness.", "gu": "Mohs પર quartz 7, corundum 9 અને diamond 10, અને synthetic abrasives Knoop hardness થી તેમની વચ્ચે ગોઠવાય છે."}}], "equations": [{"title": {"en": "Rubber and elastomers", "gu": "Rubber અને elastomers"}, "items": [{"name": {"en": "Modulus of an elastomer", "gu": "Elastomer નું modulus"}, "f": "E = 3G", "terms": {"en": "Rubber is nearly incompressible, so its tensile modulus is three times the shear modulus: G 1.0 MPa gives E 3.0 MPa.", "gu": "Rubber લગભગ incompressible છે, તેથી tensile modulus shear modulus ના ત્રણ ગણું: G 1.0 MPa એટલે E 3.0 MPa."}}, {"name": {"en": "Stress in a strained rubber", "gu": "ખેંચાયેલા rubber માં stress"}, "f": "sigma = E eps   (secant: sigma/eps at that strain)", "terms": {"en": "Rubber softens as it stretches, so the secant modulus is quoted at 100 % strain rather than at 1 %.", "gu": "Rubber ખેંચાતાં નરમ પડે, તેથી secant modulus 1 % નહીં 100 % strain પર આપાય."}}, {"name": {"en": "Strain energy at break", "gu": "તૂટતી વખતની strain energy"}, "f": "W = 0.5 sigma eps   (area under the curve)", "terms": {"en": "22 MPa at 550 % gives about 60 MJ per m3, which is why a rubber bumper absorbs a blow that would dent steel.", "gu": "550 % પર 22 MPa એટલે લગભગ 60 MJ પ્રતિ m3, તેથી rubber bumper એવો ધક્કો શોષે જે સ્ટીલને ખાડો પાડે."}}]}, {"title": {"en": "Thermal stress in a ceramic", "gu": "Ceramic માં thermal stress"}, "items": [{"name": {"en": "Constrained thermal stress", "gu": "રોકાયેલા ભાગમાં thermal stress"}, "f": "sigma = E alpha dT", "terms": {"en": "A part that cannot expand develops this stress; alumina at 200 K gives 480 MPa against a 300 MPa strength.", "gu": "જે ભાગ ફેલાઈ શકે નહીં તેમાં આ stress બને; 200 K પર alumina 300 MPa તાકાત સામે 480 MPa આપે."}}, {"name": {"en": "Thermal shock parameter", "gu": "Thermal shock ઝીલવાનો આંકડો R"}, "f": "R = sigma_f (1 - nu)/(E alpha)", "terms": {"en": "The temperature step a brittle material survives: 97 K for alumina, 2300 K for fused silica, which is why silica crucibles can be quenched.", "gu": "ભંગુર સામગ્રી જે તાપમાનનો ફટકો ઝીલે: alumina માટે 97 K, fused silica માટે 2300 K, તેથી silica crucible ઠારી શકાય."}}, {"name": {"en": "Griffith strength", "gu": "Griffith તાકાત"}, "f": "sigma_f = sqrt(2 E gamma/(pi a))", "terms": {"en": "Strength falls as the square root of the flaw size: 50 um gives 276 MPa and 200 um gives 138 MPa in the same alumina.", "gu": "તિરાડના માપના વર્ગમૂળ પ્રમાણે તાકાત ઘટે: એ જ alumina માં 50 um એટલે 276 MPa અને 200 um એટલે 138 MPa."}}]}, {"title": {"en": "Heat through a refractory wall", "gu": "Refractory દીવાલમાંથી ઉષ્મા"}, "items": [{"name": {"en": "Heat flux through layers", "gu": "સ્તરોમાંથી heat flux"}, "f": "q = dT/(L1/k1 + L2/k2 + ...)", "terms": {"en": "Steady one-dimensional flow: 1200 C to 50 C across 0.230 m of firebrick and 0.115 m of insulation is 968 W per m2.", "gu": "સ્થિર એક-દિશા પ્રવાહ: 0.230 m firebrick અને 0.115 m insulation પાર 1200 C થી 50 C એટલે 968 W પ્રતિ m2."}}, {"name": {"en": "Thermal resistance", "gu": "Thermal resistance"}, "f": "R = L/k", "terms": {"en": "Adds in series like an electrical resistance: 0.230 and 0.958 m2 K/W here.", "gu": "Electrical resistance ની જેમ series માં જોડાય: અહીં 0.230 અને 0.958 m2 K/W."}}, {"name": {"en": "Temperature at any depth", "gu": "કોઈ પણ ઊંડાણે તાપમાન"}, "f": "T(x) = T_hot - q x/k", "terms": {"en": "Gives the interface temperature: 1200 - 968 x 0.230 = 977 C.", "gu": "Interface નું તાપમાન આપે: 1200 - 968 x 0.230 = 977 C."}}]}, {"title": {"en": "Electrical and thermal insulation", "gu": "વીજ અને ઉષ્મા અવાહકતા"}, "items": [{"name": {"en": "Dielectric strength", "gu": "Dielectric strength"}, "f": "E_b = V_break/d", "terms": {"en": "Breakdown voltage per millimetre: air 3, porcelain 15, PTFE 24 kV/mm.", "gu": "પ્રતિ મિલીમીટર breakdown વોલ્ટેજ: હવા 3, porcelain 15, PTFE 24 kV/mm."}}, {"name": {"en": "Thickness of an insulator", "gu": "Insulator ની જાડાઈ"}, "f": "t = V x SF/E_b", "terms": {"en": "11 kV with a factor of 3 in porcelain: 33/15 = 2.2 mm, so 3 mm is specified.", "gu": "Porcelain માં factor 3 સાથે 11 kV: 33/15 = 2.2 mm, તેથી 3 mm લખાય."}}, {"name": {"en": "Heat through an insulator", "gu": "Insulator માંથી ઉષ્મા"}, "f": "q = k A dT/L", "terms": {"en": "50 mm of glass wool at 0.040 W/m K over 10 K loses 8 W per m2.", "gu": "0.040 W/m K નું 50 mm glass wool 10 K પર 8 W પ્રતિ m2 ગુમાવે."}}]}, {"title": {"en": "Abrasive wheel and adhesive joint", "gu": "Abrasive wheel અને adhesive જોડાણ"}, "items": [{"name": {"en": "Wheel peripheral speed", "gu": "Wheel ની પરિઘ ઝડપ"}, "f": "v = pi D N/60", "terms": {"en": "250 mm at 2000 rpm is 26 m/s; a vitrified wheel is rated 35 m/s.", "gu": "250 mm પર 2000 rpm એટલે 26 m/s; vitrified wheel 35 m/s સુધી રેટેડ છે."}}, {"name": {"en": "Lap shear stress", "gu": "Lap shear stress"}, "f": "tau = P/A", "terms": {"en": "5 kN over 25 x 40 mm is 5 MPa, against 20 MPa for epoxy.", "gu": "25 x 40 mm પર 5 kN એટલે 5 MPa, epoxy ના 20 MPa સામે."}}, {"name": {"en": "Factor of safety of a joint", "gu": "જોડાણનું factor of safety"}, "f": "SF = tau_allowable/tau_working", "terms": {"en": "20/5 = 4 here; a design that asks for 3 carries 6.67 kN instead of 5 kN.", "gu": "અહીં 20/5 = 4; 3 માંગતું design 5 kN ને બદલે 6.67 kN ઉપાડે."}}]}], "viva": [{"title": {"en": "Non-metallic materials", "gu": "અધાતુ સામગ્રી (non-metallic)"}, "items": [{"q": {"en": "What is a non-metallic material?", "gu": "Non-metallic material એટલે શું?"}, "a": {"en": "Any engineering material with no free electron sea. The syllabus groups it into polymers, ceramics, composites and natural materials, and the bond - not the strength - is what separates them.", "gu": "Free electrons નો સમુદ્ર ન હોય તેવી કોઈ પણ ઇજનેરી સામગ્રી. Syllabus તેને polymers, ceramics, composites અને natural materials માં વહેંચે છે, અને તાકાત નહીં, bond તેમને જુદા પાડે છે."}}, {"q": {"en": "Why does a machine need a non-metal at all?", "gu": "મશીનને non-metal ની જરૂર કેમ પડે?"}, "a": {"en": "For weight, insulation, quiet running and corrosion resistance: a guard, a tank liner, a cable insulator, a rubber mount and a cork gasket are all jobs a metal does badly or expensively.", "gu": "વજન, insulation, શાંત ચાલ અને કાટ સામે ટકવા માટે: guard, ટાંકીનું lining, cable insulator, rubber mount અને cork gasket - આ બધું metal મોંઘું કે ખરાબ કરે."}}, {"q": {"en": "What is a composite, and why is it used?", "gu": "Composite એટલે શું, અને કેમ વપરાય?"}, "a": {"en": "A stiff fibre inside a tough matrix - glass or carbon in epoxy, silicon carbide in aluminium. The fibre carries the load and the matrix spreads it, so the stiffness per kilogram is three to four times that of steel.", "gu": "લચીલા matrix માં કઠણ fibre - epoxy માં glass કે carbon, aluminium માં silicon carbide. Fibre લોડ ઉપાડે અને matrix ફેલાવે, તેથી કિલો દીઠ કઠણાઈ સ્ટીલ કરતાં ત્રણ-ચાર ગણી."}}]}, {"title": {"en": "Rubber", "gu": "Rubber"}, "items": [{"q": {"en": "What is vulcanisation and what does it change?", "gu": "Vulcanisation એટલે શું અને શું બદલે?"}, "a": {"en": "Heating rubber with 1 - 3 % sulphur so that sulphur bridges form between chains. The strength rises from 2 to 22 MPa and the strain of 550 % becomes recoverable - the gum becomes an elastic solid.", "gu": "1 - 3 % sulphur સાથે rubber ગરમ કરવું જેથી chains વચ્ચે sulphur પુલ બને. તાકાત 2 થી 22 MPa થાય અને 550 % strain પાછું આવે - gum લચીલો ઘન બને."}}, {"q": {"en": "Why is carbon black added to a rubber compound?", "gu": "Rubber compound માં carbon black કેમ ઉમેરાય?"}, "a": {"en": "It bonds to the chains, carries part of the load and blunts a running crack. 50 phr of black takes the tensile strength from 2 to 22 MPa and the 100 % modulus from 1.6 to 4.5 MPa.", "gu": "તે chains સાથે જોડાય, લોડનો ભાગ ઉપાડે અને દોડતી તિરાડ અટકાવે. 50 phr black tensile strength 2 થી 22 MPa અને 100 % modulus 1.6 થી 4.5 MPa કરે."}}, {"q": {"en": "Why is nitrile rubber used for an oil seal and not natural rubber?", "gu": "તેલના seal માટે natural rubber નહીં, nitrile કેમ?"}, "a": {"en": "Because swell is a property of the rubber-fluid pair: natural rubber takes up 50 % in mineral oil and nitrile only about 5 %. A swollen seal loses its grip in the groove and leaks.", "gu": "કારણ કે ફૂલવું એ rubber અને પ્રવાહીની જોડીનું ગુણધર્મ છે: natural rubber ખનીજ તેલમાં 50 % લે, nitrile ફક્ત 5 %. ફૂલેલો seal groove માં પકડ ગુમાવે અને ચૂ થાય."}}]}, {"title": {"en": "Ceramics and refractories", "gu": "Ceramics અને refractories"}, "items": [{"q": {"en": "Why is a ceramic hard and brittle at the same time?", "gu": "Ceramic સખત અને ભંગુર એક સાથે કેમ?"}, "a": {"en": "Because a dislocation cannot move through a rigid ionic lattice - it would bring like charges together - so the material cannot yield, and the only way to relieve stress is a crack. Hardness and brittleness are the same fact.", "gu": "કારણ કે કઠણ ionic lattice માં dislocation ખસી શકે નહીં - સરખા charge પાસે આવે - તેથી સામગ્રી yield થઈ શકે નહીં, અને stress ઓછો કરવાનો એક જ રસ્તો તિરાડ છે. સખતાઈ અને ભંગુરતા એક જ હકીકત છે."}}, {"q": {"en": "What separates a traditional ceramic from an advanced one?", "gu": "Traditional અને advanced ceramic માં શું ફરક?"}, "a": {"en": "Purity, porosity and price: a traditional body is fired with 5 - 15 % open pores and costs a few rupees a kilogram; an advanced body is sintered below 1 % porosity for one property and costs a hundred times more.", "gu": "શુદ્ધતા, porosity અને ભાવ: traditional body 5 - 15 % ખુલ્લા છિદ્ર સાથે પાકે અને કિલો થોડા રૂપિયા; advanced body એક ગુણધર્મ માટે 1 % થી ઓછા porosity સુધી sinter થાય અને સો ગણું મોંઘું પડે."}}, {"q": {"en": "What is an acidic and a basic refractory, and why match the slag?", "gu": "Acidic અને basic refractory એટલે શું, અને slag કેમ મેળવવો?"}, "a": {"en": "Silica is acidic and magnesia or dolomite is basic; a basic slag dissolves an acid brick. Chromite and graphite are neutral and survive either slag, which is why they are used where the charge changes.", "gu": "Silica acidic છે અને magnesia કે dolomite basic; basic slag acidic ઈંટને ઓગાળે. Chromite અને graphite neutral છે અને બંને slag ઝીલે, તેથી જ્યાં charge બદલાય ત્યાં વપરાય."}}]}, {"title": {"en": "Insulators, abrasives and adhesives", "gu": "Insulators, abrasives અને adhesives"}, "items": [{"q": {"en": "How do you decide the thickness of an insulator?", "gu": "Insulator ની જાડાઈ કેમ નક્કી કરો?"}, "a": {"en": "Divide the withstand voltage by the dielectric strength: t = V x SF/E_b. For 11 kV and a factor of 3 in porcelain, 33/15 gives 2.2 mm, so 3 mm is drawn. The surface leakage path is checked separately.", "gu": "Withstand વોલ્ટેજને dielectric strength થી ભાગો: t = V x SF/E_b. Porcelain માં 11 kV અને factor 3 માટે 33/15 એટલે 2.2 mm, તેથી 3 mm લખાય. સપાટીનો leakage પથ અલગ ચકાસાય."}}, {"q": {"en": "What is self-sharpening of a grinding wheel?", "gu": "Grinding wheel નું self-sharpening એટલે શું?"}, "a": {"en": "As the grain dulls, the cutting force on it rises until the bond breaks and the worn grain falls out, leaving a fresh edge. The bond is therefore chosen for the work: hard bond on soft material, soft bond on hard material.", "gu": "Grain થૂંસાતાં તેના પરનું કાપવાનું બળ વધે, bond તૂટે અને ઘસાયેલો grain નીકળી જાય, નવી ધાર મળે. તેથી bond કામ પ્રમાણે પસંદ થાય: નરમ સામગ્રી પર સખત bond, સખત પર નરમ."}}, {"q": {"en": "Why is a lap joint stronger than a butt joint?", "gu": "Lap joint butt joint કરતાં મજબૂત કેમ?"}, "a": {"en": "Because the load is carried in shear over the overlap area instead of in peel at an edge. A butt joint on a 20 MPa epoxy carries less than a lap joint on a 6 MPa PVA, so the geometry matters more than the glue.", "gu": "કારણ કે લોડ ધાર પર peel માં નહીં, overlap area પર shear માં ઉપડે. 20 MPa epoxy નું butt joint 6 MPa PVA ના lap joint કરતાં ઓછું ઉપાડે, તેથી ગુંદર કરતાં ભૂમિતિ વધુ મહત્વની."}}]}], "exam_questions": [{"q": {"en": "An alumina spacer of E 300 GPa and alpha 8.0e-6 per K is clamped between steel flanges so that it cannot expand. Find the stress in the spacer at a temperature rise of 200 K and of 100 K, compare with its 300 MPa flexural strength, and state two ways to make the joint safe.", "gu": "E 300 GPa અને alpha 8.0e-6 પ્રતિ K નું alumina spacer steel flange વચ્ચે એવી રીતે clamp થયું છે કે ફેલાઈ શકે નહીં. 200 K અને 100 K તાપમાન વધારા પર spacer માં stress શોધો, તેની 300 MPa flexural strength સાથે સરખાવો, અને જોડાણ સલામત કરવાની બે રીતો કહો."}, "marks": 7}, {"q": {"en": "Compare the thermal shock resistance of alumina (300 MPa, nu 0.22, E 300 GPa, alpha 8.0e-6), soda-lime glass (50 MPa, nu 0.22, E 70 GPa, alpha 9.0e-6) and fused silica (110 MPa, nu 0.17, E 72 GPa, alpha 0.55e-6). Say which one can be quenched in water and why.", "gu": "Alumina (300 MPa, nu 0.22, E 300 GPa, alpha 8.0e-6), soda-lime glass (50 MPa, nu 0.22, E 70 GPa, alpha 9.0e-6) અને fused silica (110 MPa, nu 0.17, E 72 GPa, alpha 0.55e-6) ની thermal shock resistance સરખાવો. કોને પાણીમાં ઠારી શકાય અને કેમ તે કહો."}, "marks": 6}, {"q": {"en": "A furnace wall is 230 mm of firebrick (k 1.0 W/m K) on the hot side and 115 mm of insulating brick (k 0.12 W/m K) outside it. The hot face is at 1200 C and the cold face at 50 C. Find the heat loss per m2, the interface temperature, and the money saved per m2 in a month if the furnace runs continuously at Rs 8 per kWh.", "gu": "ભઠ્ઠીની દીવાલ ગરમ બાજુ 230 mm firebrick (k 1.0 W/m K) અને બહાર 115 mm insulating brick (k 0.12 W/m K) ની છે. ગરમ સપાટી 1200 C અને ઠંડી સપાટી 50 C છે. પ્રતિ m2 ઉષ્માનો વ્યય, interface નું તાપમાન, અને ભઠ્ઠી સતત ચાલે તો Rs 8 પ્રતિ kWh પર એક મહિનામાં પ્રતિ m2 કેટલા રૂપિયા બચે તે શોધો."}, "marks": 7}, {"q": {"en": "A firebrick sample of bulk volume 120 cm3 weighs 320 g dry and 345 g after soaking in water. Find its bulk density, its water absorption, its apparent porosity and its true density, and say what that porosity does to the brick.", "gu": "120 cm3 bulk volume નો firebrick નમૂનો સૂકો 320 g અને પાણીમાં પલાળ્યા પછી 345 g છે. તેની bulk density, water absorption, apparent porosity અને true density શોધો, અને એ porosity ઈંટ સાથે શું કરે તે કહો."}, "marks": 6}, {"q": {"en": "A bracket is glued to a plate with an epoxy whose lap shear strength is 20 MPa. The overlap is 25 mm wide and 40 mm long and the working load is 5 kN. Find the shear stress in the joint, its factor of safety, and the greatest load it may carry at a required factor of safety of 3.", "gu": "Bracket એક plate પર 20 MPa lap shear strength વાળા epoxy થી ગુંદાય છે. Overlap 25 mm પહોળું અને 40 mm લાંબું છે અને કામનો લોડ 5 kN છે. જોડાણમાં shear stress, તેનું factor of safety, અને 3 નું factor of safety જોઈએ તો વધુમાં વધુ કેટલો લોડ ઉપાડી શકે તે શોધો."}, "marks": 6}, {"q": {"en": "A bakelite support of dielectric strength 18 kV/mm is used on an 11 kV busbar. For a 3 mm sheet, find the breakdown voltage and the factor of safety at 11 kV; then find the least thickness that gives a factor of safety of 3, and say why the surface path is checked separately.", "gu": "18 kV/mm dielectric strength વાળું bakelite support 11 kV busbar પર વપરાય છે. 3 mm sheet માટે breakdown વોલ્ટેજ અને 11 kV પર factor of safety શોધો; પછી factor of safety 3 આપતી ઓછામાં ઓછી જાડાઈ શોધો, અને સપાટીનો રસ્તો અલગ કેમ ચકાસાય તે કહો."}, "marks": 6}], "learning_outcomes": [{"en": "Understand classification, properties and applications of various non-metallic materials.", "gu": "વિવિધ અધાતુઈ સામગ્રીનું વર્ગીકરણ, ગુણધર્મો અને ઉપયોગ સમજવા."}], "course_outcomes": ["CO4"], "practical_numbers": [6], "content_kind": "theory", "lesson_count": 15, "answered_practice_count": 6, "assessment_note": {"en": "Official course: theory ESE 70 + PA 30 and practical PA 20 + ESE 30 = 150 marks, 4 credits (3 lecture + 2 practical), 45 teaching hours. This unit carries 17 % weightage, 8 of the printed unit hours and 12 of the 70 theory marks, and practical 6 is the non-metallic materials report. The six numericals of section 4.6 are original revision problems with suggested marks, not GTU papers; the electricity tariff used in one of them is an assumption and is stated as one.", "gu": "અધિકૃત course: theory ESE 70 + PA 30 અને practical PA 20 + ESE 30 = 150 marks, 4 credits (3 lecture + 2 practical), 45 teaching hours. આ unit નું weightage 17 %, છપાયેલા unit hours માંથી 8 અને 70 theory marks માંથી 12 છે, અને practical 6 એ non-metallic materials નો રિપોર્ટ છે. વિભાગ 4.6 ના છ દાખલા revision માટેના મૂળ પ્રશ્નો છે, GTU પેપર નહીં; તેમાંની એકમાં વીજળીનો દર ધારેલો છે અને એ સ્પષ્ટ લખેલું છે."}, "question_provenance": "Original solved numericals written for revision; not official past papers", "question_marks_are_suggested": true, "sources": [{"title": "GTU DI01000181 Engineering Materials Science syllabus (uploaded PDF, w.e.f. 2024-25)", "url": "https://syllabus.gtu.ac.in/"}, {"title": "O. P. Khanna - Material Science and Metallurgy, Dhanpat Rai (ceramics, refractories, insulators, abrasives)", "url": "https://www.dhanpatrai.com/"}, {"title": "V. Raghavan - Materials Science and Engineering, Prentice Hall India (ceramics, composites, failure of brittle materials)", "url": "https://www.pearson.com/"}, {"title": "Substech open materials science reference - non-metallic materials, refractories, ceramics", "url": "https://www.substech.com/dokuwiki/doku.php?id=classification_of_materials"}, {"title": "MatWeb material property data - polymer, ceramic and elastomer property tables", "url": "https://www.matweb.com/"}, {"title": "BIS - IS 4854 rubber compounding and IS 1528 refractory test methods", "url": "https://www.bis.gov.in/"}]};
