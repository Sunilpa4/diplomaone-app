<script>
const U = {"subject": "DI01000121", "unit": 5, "format": "notes", "title": {"en": "Waves, Ultrasonic and Semiconductor", "gu": "તરંગો, અલ્ટ્રાસોનિક અને અર્ધવાહક"}, "hours": 10, "weightage": 24, "official": true, "languages": ["en", "gu"], "tabs": ["notes", "diagrams", "equations", "numericals", "viva", "exam"], "intro_text": {"en": "Unit 5 of Applied Physics: wave motion with longitudinal and transverse waves; frequency, time period, amplitude, wavelength and wave velocity; superposition and interference with the conditions for a stationary wave; reverberation, echo, noise and the absorption coefficient; Sabine's formula and the control of reverberation; ultrasonic waves with their properties and applications; conductors, semiconductors and insulators with the energy band gap; and intrinsic and extrinsic semiconductors with doping and the N and P type. Eight lecture cards, six diagrams, twenty fully solved numericals and fourteen answered practice questions.", "gu": "એપ્લાઇડ ફિઝિક્સનું યુનિટ 5: તરંગ ગતિ સાથે સંગત અને અનુપ્રસ્થ તરંગો; આવૃત્તિ, આવર્તકાળ, કંપવિસ્તાર, તરંગલંબાઈ અને તરંગ વેગ; અધ્યારોપણ અને વ્યતીકરણ તથા સ્થિર તરંગની શરતો; પ્રતિધ્વનિ, પડઘો, ઘોંઘાટ અને શોષણ ગુણાંક; સેબાઇનનું સૂત્ર અને પ્રતિધ્વનિનું નિયંત્રણ; અલ્ટ્રાસોનિક તરંગો તેમના ગુણધર્મો અને ઉપયોગો સાથે; વાહક, અર્ધવાહક અને અવાહક તથા ઊર્જા પટ્ટા અંતર; અને આંતરિક તથા બાહ્ય અર્ધવાહક, ડોપિંગ અને N તથા P પ્રકાર. આઠ પાઠ-કાર્ડ, છ આકૃતિઓ, વીસ પૂરા ઉકેલાયેલા દાખલા અને ચૌદ ઉત્તરસહિત સરાવ પ્રશ્નો."}, "notes": [{"title": {"en": "1. Waves and their Parameters", "gu": "1. તરંગો અને તેમના પરિમાણો"}, "items": [{"h": {"en": "1.1 Wave motion, longitudinal and transverse waves", "gu": "1.1 તરંગ ગતિ, સંગત તથા અનુપ્રસ્થ તરંગો"}, "body": {"en": "<h4>Definition</h4><p>A <b>wave</b> is a disturbance that carries energy from one place to another without carrying matter. In <b>mechanical</b> waves the disturbance travels through a medium; in <b>electromagnetic</b> waves it travels as changing fields and needs no medium.</p><h4>Two kinds</h4><table><tr><th>Wave</th><th>Particles move</th><th>Examples</th></tr><tr><td>transverse</td><td>perpendicular to the wave direction</td><td>light, a wave on a string, ripples on water</td></tr><tr><td>longitudinal</td><td>along the wave direction</td><td>sound in air, a compression in a spring</td></tr></table><h4>What travels and what does not</h4><ul><li>Energy travels; the particles only oscillate about a fixed point.</li><li>Sound needs a medium, which is why a bell in a vacuum jar is silent.</li><li>A wave carries momentum and can carry information, which is why every communication system is built on waves.</li></ul><h4>Worked example</h4><p>A sound wave of 340 m/s passing a point makes the air molecules move back and forth by about 10 µm, yet the compression itself travels many metres and reaches your ear.</p><h4>Common mistake</h4><p>Thinking the medium moves with the wave. The medium oscillates in place; only the pattern and the energy move forward.</p>", "gu": "<h4>વ્યાખ્યા</h4><p><b>તરંગ</b> એ એવી વિક્ષોભ છે જે પદાર્થ લઈ જ્યા વગર ઊર્જા એક જગ્યાએથી બીજી જગ્યાએ પહોંચાડે. <b>યાંત્રિક</b> તરંગોમાં વિક્ષોભ માધ્યમમાંથી પસાર થાય; <b>વિદ્યુતચુંબકીય</b> તરંગોમાં તે બદલાતાં ક્ષેત્રો તરીકે ચાલે અને માધ્યમની જરૂર નથી.</p><h4>બે પ્રકાર</h4><table><tr><th>તરંગ</th><th>કણો ખસે</th><th>ઉદાહરણો</th></tr><tr><td>અનુપ્રસ્થ</td><td>તરંગની દિશાને લંબરૂપે</td><td>પ્રકાશ, દોરી પરનું તરંગ, પાણી પરની વમળ</td></tr><tr><td>સંગત</td><td>તરંગની દિશામાં જ</td><td>હવામાં ધ્વનિ, સ્પ્રિંગમાં સંકોચન</td></tr></table><h4>શું ચાલે અને શું નહીં</h4><ul><li>ઊર્જા ચાલે; કણો ફક્ત પોતાના સ્થાનની આસપાસ દોલિત થાય.</li><li>ધ્વનિને માધ્યમ જોઈએ, તેથી શૂન્યાવકાશના પાત્રમાં ઘંટડી મૌન રહે.</li><li>તરંગ વેગમાન અને માહિતી લઈ જાય, તેથી જ દરેક સંદેશાવ્યવહાર તંત્ર તરંગો પર બંધાયું છે.</li></ul><h4>ઉકેલાયેલ દાખલો</h4><p>340 m/s નું ધ્વનિ તરંગ એક બિંદુ પાસેથી પસાર થાય ત્યારે હવાના અણુઓ લગભગ 10 µm આગળ-પાછળ ખસે, પણ સંકોચન પોતે ઘણા મીટર ચાલીને તમારા કાન સુધી પહોંચે.</p><h4>સામાન્ય ભૂલ</h4><p>તરંગ સાથે માધ્યમ પણ ચાલે એમ માનવું. માધ્યમ પોતાની જગ્યાએ દોલિત થાય; ફક્ત આકૃતિ અને ઊર્જા આગળ વધે.</p>"}, "diagram": "u5_wave", "syllabus_item": "5.1"}, {"h": {"en": "1.2 Frequency, time period, amplitude, wavelength and wave velocity", "gu": "1.2 આવૃત્તિ, આવર્તકાળ, કંપવિસ્તાર, તરંગલંબાઈ અને તરંગ વેગ"}, "body": {"en": "<h4>The five quantities</h4><table><tr><th>Quantity</th><th>Meaning</th><th>Unit</th></tr><tr><td>amplitude a</td><td>largest displacement from rest</td><td>m</td></tr><tr><td>wavelength λ</td><td>distance between two crests</td><td>m</td></tr><tr><td>frequency f</td><td>oscillations per second</td><td>Hz</td></tr><tr><td>time period T</td><td>time for one oscillation, T = 1/f</td><td>s</td></tr><tr><td>velocity v</td><td>v = f λ, set by the medium</td><td>m/s</td></tr></table><h4>The one relation to remember</h4><p><b>v = f λ</b>. When sound passes from air into water its speed rises and, because the source fixes f, the wavelength must rise with it.</p><h4>Typical speeds</h4><table><tr><th>Medium</th><th>Speed of sound</th></tr><tr><td>air at 20 °C</td><td>343 m/s</td></tr><tr><td>water</td><td>1480 m/s</td></tr><tr><td>steel</td><td>about 5000 m/s</td></tr><tr><td>light in vacuum</td><td>3 × 10⁸ m/s</td></tr></table><h4>Worked example</h4><p>A tuning fork of 256 Hz in air: λ = v/f = 343/256 = 1.34 m and T = 1/256 = 3.9 ms.</p><h4>Common mistake</h4><p>Believing frequency changes when a wave enters a new medium. The source sets f; the medium sets v; λ adjusts to keep v = f λ.</p>", "gu": "<h4>પાંચ રાશિઓ</h4><table><tr><th>રાશિ</th><th>અર્થ</th><th>એકમ</th></tr><tr><td>કંપવિસ્તાર a</td><td>સ્થાનથી સૌથી વધુ ખસવું</td><td>m</td></tr><tr><td>તરંગલંબાઈ λ</td><td>બે શિખર વચ્ચેનું અંતર</td><td>m</td></tr><tr><td>આવૃત્તિ f</td><td>પ્રતિ સેકન્ડ દોલન</td><td>Hz</td></tr><tr><td>આવર્તકાળ T</td><td>એક દોલનનો સમય, T = 1/f</td><td>s</td></tr><tr><td>વેગ v</td><td>v = f λ, માધ્યમ નક્કી કરે</td><td>m/s</td></tr></table><h4>યાદ રાખવાનો એક સંબંધ</h4><p><b>v = f λ</b>. ધ્વનિ હવામાંથી પાણીમાં જાય ત્યારે તેનો વેગ વધે અને, સ્રોત f નક્કી કરતો હોવાથી, તરંગલંબાઈ પણ વધવી પડે.</p><h4>સામાન્ય વેગ</h4><table><tr><th>માધ્યમ</th><th>ધ્વનિનો વેગ</th></tr><tr><td>20 °C પર હવા</td><td>343 m/s</td></tr><tr><td>પાણી</td><td>1480 m/s</td></tr><tr><td>સ્ટીલ</td><td>લગભગ 5000 m/s</td></tr><tr><td>શૂન્યાવકાશમાં પ્રકાશ</td><td>3 × 10⁸ m/s</td></tr></table><h4>ઉકેલાયેલ દાખલો</h4><p>હવામાં 256 Hz નો સ્વરકાંટો: λ = v/f = 343/256 = 1.34 m અને T = 1/256 = 3.9 ms.</p><h4>સામાન્ય ભૂલ</h4><p>નવા માધ્યમમાં તરંગ જાય ત્યારે આવૃત્તિ બદલાય એમ માનવું. સ્રોત f નક્કી કરે, માધ્યમ v નક્કી કરે, અને v = f λ જળવાય તે માટે λ ગોઠવાય.</p>"}, "diagram": "u5_wave", "syllabus_item": "5.2"}]}, {"title": {"en": "2. Interference, Stationary Waves and Acoustics", "gu": "2. વ્યતીકરણ, સ્થિર તરંગો અને ધ્વનિશાસ્ત્ર"}, "items": [{"h": {"en": "2.1 Superposition, interference and stationary waves", "gu": "2.1 અધ્યારોપણ, વ્યતીકરણ અને સ્થિર તરંગો"}, "body": {"en": "<h4>Principle of superposition</h4><p>When two or more waves meet at a point, the resultant displacement is the vector sum of their displacements. Where they add in phase the result is <b>constructive interference</b>; where they cancel it is <b>destructive interference</b>.</p><h4>Conditions for a steady interference pattern</h4><ol><li>The two sources must be coherent: same frequency and a constant phase difference.</li><li>Their amplitudes should be nearly equal, so that the dark fringes are really dark.</li><li>The sources must be close together and far from the screen, so the fringes are wide enough to see.</li></ol><h4>Stationary waves</h4><p>Two identical waves travelling in opposite directions superpose to give a stationary wave: points of zero amplitude are <b>nodes</b>, points of maximum amplitude are <b>antinodes</b>, and the spacing is λ/2 between nodes.</p><h4>Worked example</h4><p>A string of 0.75 m fixed at both ends vibrates in its fundamental mode with λ = 2L = 1.5 m, so with v = 300 m/s the frequency is f = 300/1.5 = 200 Hz.</p><h4>Common mistake</h4><p>Calling any two overlapping waves an interference pattern. Without coherence there is no fixed pattern, only a moving flicker.</p>", "gu": "<h4>અધ્યારોપણનો સિદ્ધાંત</h4><p>બે કે વધુ તરંગો એક બિંદુએ મળે ત્યારે પરિણામી સ્થાનાંતરણ તેમના સ્થાનાંતરણનો સદિશ સરવાળો હોય. સમાન કળામાં ઉમેરાય તો <b>રચનાત્મક વ્યતીકરણ</b>; રદ થાય તો <b>વિનાશાત્મક વ્યતીકરણ</b>.</p><h4>સ્થિર વ્યતીકરણ આકૃતિની શરતો</h4><ol><li>બે સ્રોત સહસંબંધી હોવા જોઈએ: સમાન આવૃત્તિ અને અચળ કળા તફાવત.</li><li>તેમના કંપવિસ્તાર લગભગ સમાન હોવા જોઈએ જેથી અંધારા પટ્ટા ખરેખર અંધારા દેખાય.</li><li>સ્રોત નજીક અને પડદો દૂર હોવો જોઈએ જેથી પટ્ટા પૂરતા પહોળા દેખાય.</li></ol><h4>સ્થિર તરંગો</h4><p>વિરુદ્ધ દિશામાં ચાલતાં બે સરખાં તરંગો અધ્યારોપિત થઈને સ્થિર તરંગ આપે: શૂન્ય કંપવિસ્તારવાળાં બિંદુ <b>નિસ્પંદ</b>, મહત્તમ કંપવિસ્તારવાળાં બિંદુ <b>પ્રસ્પંદ</b>, અને નિસ્પંદ વચ્ચેનું અંતર λ/2.</p><h4>ઉકેલાયેલ દાખલો</h4><p>બંને છેડેથી બંધ 0.75 m દોરી પાયાની રીતે દોલિત થાય ત્યારે λ = 2L = 1.5 m, તેથી v = 300 m/s સાથે આવૃત્તિ f = 300/1.5 = 200 Hz.</p><h4>સામાન્ય ભૂલ</h4><p>કોઈપણ બે તરંગોના મિલનને વ્યતીકરણ આકૃતિ કહેવું. સહસંબંધ વગર સ્થિર આકૃતિ હોતી નથી, ફક્ત ચલિત ઝબકારો દેખાય.</p>"}, "diagram": "u5_stationary", "syllabus_item": "5.3"}, {"h": {"en": "2.2 Reverberation, echo, noise and the absorption coefficient", "gu": "2.2 પ્રતિધ્વનિ, પડઘો, ઘોંઘાટ અને શોષણ ગુણાંક"}, "body": {"en": "<h4>Definitions</h4><p><b>Reverberation</b> is the persistence of sound in a hall after the source stops, because of repeated reflections. <b>Reverberation time</b> T is the time for the sound level to fall by 60 dB. An <b>echo</b> is a distinct reflected sound heard separately.</p><h4>Absorption coefficient</h4><p>The absorption coefficient α of a surface is the fraction of the incident sound energy it absorbs: α = 0 (perfect reflector) to α = 1 (open window, absorbs everything).</p><table><tr><th>Material</th><th>α at 500 Hz</th></tr><tr><td>open window</td><td>1.00</td></tr><tr><td>plaster on brick</td><td>0.02</td></tr><tr><td>glass</td><td>0.03</td></tr><tr><td>wooden floor</td><td>0.06</td></tr><tr><td>curtain, heavy</td><td>0.50</td></tr><tr><td>acoustic tile</td><td>0.70</td></tr><tr><td>audience, per person</td><td>0.45 m²</td></tr></table><h4>Why it matters</h4><p>Too long a reverberation smears speech, too short a one makes a hall sound dead; about 1 s is right for speech and 2 s for music. Noise is any unwanted sound, and its control is part of the same design.</p><h4>Worked example</h4><p>A clap heard twice with a 0.6 s gap from a wall 102 m away: d = v t/2 = 340 × 0.6/2 = 102 m. For a distinct echo the gap must exceed about 0.1 s, i.e. 17 m.</p><h4>Common mistake</h4><p>Forgetting the factor 2 in an echo calculation. The sound travels to the wall and back, so the distance is v t/2, not v t.</p>", "gu": "<h4>વ્યાખ્યાઓ</h4><p><b>પ્રતિધ્વનિ</b> એ સ્રોત બંધ થયા પછી પણ વારંવાર પરાવર્તનને કારણે ઓરડામાં ધ્વનિ ટકી રહેવો છે. <b>પ્રતિધ્વનિ સમય</b> T એ ધ્વનિનું સ્તર 60 dB ઘટવા માટેનો સમય છે. <b>પડઘો</b> એ અલગ સંભળાતો પરાવર્તિત ધ્વનિ છે.</p><h4>શોષણ ગુણાંક</h4><p>સપાટીનો શોષણ ગુણાંક α એ તેના પર પડતી ધ્વનિ ઊર્જાનો શોષાતો ભાગ છે: α = 0 (પૂર્ણ પરાવર્તક) થી α = 1 (ખુલ્લી બારી, બધું શોષે).</p><table><tr><th>પદાર્થ</th><th>500 Hz પર α</th></tr><tr><td>ખુલ્લી બારી</td><td>1.00</td></tr><tr><td>ઇંટ પર પ્લાસ્ટર</td><td>0.02</td></tr><tr><td>કાચ</td><td>0.03</td></tr><tr><td>લાકડાનું ફર્શ</td><td>0.06</td></tr><tr><td>જાડો પડદો</td><td>0.50</td></tr><tr><td>ધ્વનિ-શોષક ટાઇલ</td><td>0.70</td></tr><tr><td>શ્રોતા, પ્રતિ વ્યક્તિ</td><td>0.45 m²</td></tr></table><h4>કેમ મહત્ત્વનું</h4><p>પ્રતિધ્વનિ બહુ લાંબી હોય તો બોલાયેલું ધૂંધળું થાય, બહુ ટૂંકી હોય તો હોલ મૃત લાગે; બોલાયેલા શબ્દ માટે લગભગ 1 s અને સંગીત માટે 2 s યોગ્ય છે. ઘોંઘાટ એ કોઈપણ અનિચ્છનીય ધ્વનિ છે, અને તેનું નિયંત્રણ એ જ રચનાનો ભાગ છે.</p><h4>ઉકેલાયેલ દાખલો</h4><p>0.6 s ના અંતરે બે વાર સંભળાતો તાળીનો અવાજ 102 m દૂરની દીવાલથી: d = v t/2 = 340 × 0.6/2 = 102 m. અલગ પડઘો સંભળાવા માટે અંતર લગભગ 0.1 s, એટલે 17 m થી વધુ હોવું જોઈએ.</p><h4>સામાન્ય ભૂલ</h4><p>પડઘાની ગણતરીમાં 2 નો અવયવ ભૂલવો. ધ્વનિ દીવાલ સુધી જાય અને પાછો આવે, તેથી અંતર v t/2 છે, v t નહીં.</p>"}, "diagram": "u5_reverb", "syllabus_item": "5.4"}, {"h": {"en": "2.3 Sabine's formula and the control of reverberation", "gu": "2.3 સેબાઇનનું સૂત્ર અને પ્રતિધ્વનિનું નિયંત્રણ"}, "body": {"en": "<h4>The formula</h4><p><b>T = 0.161 V / A</b>, where V is the volume in m³ and A = Σ α S is the total absorption in m² sabine, summed over every surface.</p><h4>How the design uses it</h4><ul><li>Fix the volume from the seating and the ceiling height.</li><li>Choose a target T (about 1 s for speech, 2 s for music).</li><li>Find the absorption A = 0.161 V/T that the room must have.</li><li>Add absorbers — tiles, curtains, carpet, audience — until Σ α S reaches A.</li></ul><h4>Other ways to control it</h4><table><tr><th>Problem</th><th>Remedy</th></tr><tr><td>T too long, speech unclear</td><td>add absorbers and a sound-absorbing ceiling</td></tr><tr><td>T too short, hall sounds dead</td><td>use hard reflective panels and a smaller volume</td></tr><tr><td>echo from a rear wall</td><td>tilt or treat that wall, or move the stage</td></tr><tr><td>noise from outside</td><td>double glazing, seals and a lobby</td></tr></table><h4>Worked example</h4><p>A hall 20 × 15 × 8 m has V = 2400 m³. With A = 240 m² sabine, T = 0.161 × 2400/240 = 1.61 s; to bring it to 1.0 s the room needs A = 386 m², i.e. 146 m² more absorption.</p><h4>Common mistake</h4><p>Adding α values instead of α S products, or forgetting the audience, which is often the largest absorber in a full hall.</p>", "gu": "<h4>સૂત્ર</h4><p><b>T = 0.161 V / A</b>, જ્યાં V ઘનફળ m³ માં અને A = Σ α S એ m² સેબાઇનમાં કુલ શોષણ છે, દરેક સપાટી પરથી સરવાળો.</p><h4>રચના તેનો ઉપયોગ કેવી રીતે કરે</h4><ul><li>બેઠક અને ટોચમર્યાદાની ઊંચાઈ પરથી ઘનફળ નક્કી કરો.</li><li>લક્ષ્ય T પસંદ કરો (બોલાયેલા શબ્દ માટે લગભગ 1 s, સંગીત માટે 2 s).</li><li>ઓરડામાં જરૂરી શોષણ A = 0.161 V/T શોધો.</li><li>શોષક ઉમેરો — ટાઇલ, પડદા, જાજમ, શ્રોતા — જ્યાં સુધી Σ α S એ A સુધી ન પહોંચે.</li></ul><h4>નિયંત્રણની બીજી રીતો</h4><table><tr><th>સમસ્યા</th><th>ઉપાય</th></tr><tr><td>T લાંબી, બોલાયેલું અસ્પષ્ટ</td><td>શોષક અને ધ્વનિ-શોષક ટોચમર્યાદા ઉમેરો</td></tr><tr><td>T ટૂંકી, હોલ મૃત લાગે</td><td>કઠણ પરાવર્તક પેનલ અને નાનું ઘનફળ વાપરો</td></tr><tr><td>પાછળની દીવાલથી પડઘો</td><td>એ દીવાલ નમાવો કે સારવાર આપો, અથવા મંચ ખસેડો</td></tr><tr><td>બહારથી ઘોંઘાટ</td><td>બેવડું કાચ, સીલ અને લોબી</td></tr></table><h4>ઉકેલાયેલ દાખલો</h4><p>20 × 15 × 8 m ના હોલનું V = 2400 m³. A = 240 m² સેબાઇન સાથે T = 0.161 × 2400/240 = 1.61 s; તેને 1.0 s પર લાવવા A = 386 m² જોઈએ, એટલે 146 m² વધુ શોષણ.</p><h4>સામાન્ય ભૂલ</h4><p>α S ગુણાકારને બદલે α નાં મૂલ્યો સરવાળવા, અથવા શ્રોતાઓ ભૂલવા, જે ભરેલા હોલમાં ઘણી વાર સૌથી મોટું શોષક હોય છે.</p>"}, "diagram": "u5_reverb", "syllabus_item": "5.5"}]}, {"title": {"en": "3. Ultrasonic Waves", "gu": "3. અલ્ટ્રાસોનિક તરંગો"}, "items": [{"h": {"en": "3.1 Ultrasonic waves, their properties and applications", "gu": "3.1 અલ્ટ્રાસોનિક તરંગો, તેમના ગુણધર્મો અને ઉપયોગો"}, "body": {"en": "<h4>Definition</h4><p><b>Ultrasonic</b> waves are sound waves above about 20 kHz, the upper limit of human hearing. Infrasonic waves lie below 20 Hz.</p><h4>Properties</h4><ul><li>High frequency means a short wavelength: at 40 kHz in air λ is only 8.6 mm.</li><li>They travel in a narrow beam, so they can be aimed and focused.</li><li>They reflect at a boundary, so an echo gives distance and a picture.</li><li>High energy density produces cavitation, used for cleaning and welding.</li><li>They cause heating, which is used in physiotherapy and in surgery.</li></ul><h4>Production</h4><table><tr><th>Method</th><th>How it works</th><th>Typical use</th></tr><tr><td>piezoelectric</td><td>a quartz plate vibrates when an AC field is applied</td><td>medical probes, SONAR</td></tr><tr><td>magnetostriction</td><td>a nickel rod changes length in a changing magnetic field</td><td>industrial cleaners, welding</td></tr></table><h4>Applications</h4><table><tr><th>Field</th><th>Use</th></tr><tr><td>medical</td><td>sonography, echocardiography, lithotripsy</td></tr><tr><td>engineering</td><td>flaw detection, thickness gauging, ultrasonic welding</td></tr><tr><td>navigation</td><td>SONAR depth sounding and fish finding</td></tr><tr><td>industry</td><td>cleaning of delicate parts, drilling of hard materials</td></tr><tr><td>domestic</td><td>humidifiers, pest repellents, distance sensors</td></tr></table><h4>Common mistake</h4><p>Thinking ultrasound is electromagnetic. It is a mechanical sound wave, so it needs a medium and cannot cross a vacuum.</p>", "gu": "<h4>વ્યાખ્યા</h4><p><b>અલ્ટ્રાસોનિક</b> તરંગો લગભગ 20 kHz થી ઉપરનાં ધ્વનિ તરંગો છે, જે માનવ શ્રવણની ઉપલી મર્યાદા છે. ઇન્ફ્રાસોનિક તરંગો 20 Hz થી નીચે હોય.</p><h4>ગુણધર્મો</h4><ul><li>વધુ આવૃત્તિ એટલે ટૂંકી તરંગલંબાઈ: હવામાં 40 kHz પર λ ફક્ત 8.6 mm.</li><li>તેઓ સાંકડા કિરણપુંજમાં ચાલે, તેથી લક્ષ્ય બનાવી શકાય અને કેન્દ્રિત કરી શકાય.</li><li>સીમા પર પરાવર્તિત થાય, તેથી પડઘો અંતર અને ચિત્ર આપે.</li><li>ઊંચી ઊર્જા ઘનતા કેવિટેશન ઉત્પન્ન કરે, જે સફાઈ અને વેલ્ડિંગમાં વપરાય.</li><li>તેઓ ઉષ્મા ઉત્પન્ન કરે, જે ફિઝિયોથેરાપી અને શસ્ત્રક્રિયામાં વપરાય.</li></ul><h4>ઉત્પાદન</h4><table><tr><th>રીત</th><th>કેવી રીતે કામ કરે</th><th>સામાન્ય ઉપયોગ</th></tr><tr><td>પીઝોઇલેક્ટ્રિક</td><td>AC ક્ષેત્ર આપતાં ક્વાર્ટ્ઝ પ્લેટ દોલિત થાય</td><td>મેડિકલ પ્રોબ, સોનાર</td></tr><tr><td>મેગ્નેટોસ્ટ્રિક્શન</td><td>બદલાતા ચુંબકીય ક્ષેત્રમાં નિકલ સળિયાની લંબાઈ બદલાય</td><td>ઔદ્યોગિક ક્લીનર, વેલ્ડિંગ</td></tr></table><h4>ઉપયોગો</h4><table><tr><th>ક્ષેત્ર</th><th>ઉપયોગ</th></tr><tr><td>તબીબી</td><td>સોનોગ્રાફી, ઇકોકાર્ડિયોગ્રાફી, લિથોટ્રિપ્સી</td></tr><tr><td>ઇજનેરી</td><td>ખામી શોધ, જાડાઈ માપન, અલ્ટ્રાસોનિક વેલ્ડિંગ</td></tr><tr><td>નૌકાવિહાર</td><td>સોનાર ઊંડાઈ માપન અને માછલી શોધ</td></tr><tr><td>ઉદ્યોગ</td><td>નાજુક પાર્ટની સફાઈ, કઠણ પદાર્થમાં કંદરો</td></tr><tr><td>ઘરેલું</td><td>હ્યુમિડિફાયર, જીવાત નિવારક, અંતર સેન્સર</td></tr></table><h4>સામાન્ય ભૂલ</h4><p>અલ્ટ્રાસાઉન્ડને વિદ્યુતચુંબકીય માનવું. તે યાંત્રિક ધ્વનિ તરંગ છે, તેથી માધ્યમ જોઈએ અને શૂન્યાવકાશ પાર કરી શકે નહીં.</p>"}, "diagram": "u5_ultrasonic", "syllabus_item": "5.6"}]}, {"title": {"en": "4. Conductors, Semiconductors and Insulators", "gu": "4. વાહક, અર્ધવાહક અને અવાહક"}, "items": [{"h": {"en": "4.1 Energy bands and the band gap", "gu": "4.1 ઊર્જા પટ્ટા અને પટ્ટા અંતર"}, "body": {"en": "<h4>The idea</h4><p>In a solid the allowed electron energies form bands. The highest filled band is the <b>valence band</b> and the next is the <b>conduction band</b>; the energy gap between them is the <b>band gap</b> E<sub>g</sub>.</p><table><tr><th>Class</th><th>Band gap</th><th>Conductivity at 300 K</th><th>Example</th></tr><tr><td>conductor</td><td>no gap, bands overlap</td><td>very high, about 10⁷ S/m</td><td>copper, silver</td></tr><tr><td>semiconductor</td><td>about 0.1 to 3 eV</td><td>moderate, 10⁻⁴ to 10² S/m</td><td>silicon 1.1 eV, germanium 0.7 eV</td></tr><tr><td>insulator</td><td>more than about 3 eV</td><td>almost zero</td><td>glass 8 eV, diamond 5.5 eV</td></tr></table><h4>Why temperature matters</h4><p>A semiconductor has a negative temperature coefficient: heating gives electrons enough energy to cross the gap, so conductivity rises. A metal behaves the opposite way.</p><h4>Worked example</h4><p>The photon energy for a gap of 1.1 eV is E = hc/λ, so λ = 1240/1.1 = 1130 nm — beyond the visible range, which is why silicon is used for infrared detectors.</p><h4>Common mistake</h4><p>Reading the band gap as a barrier electrons cannot cross. At room temperature a small fraction always crosses it, and doping makes it far easier.</p>", "gu": "<h4>ખ્યાલ</h4><p>ઘનમાં ઇલેક્ટ્રોનની મંજૂર ઊર્જા પટ્ટા બનાવે. સૌથી ઊંચો ભરેલો પટ્ટો <b>સંયોજક પટ્ટો</b> અને તેના પછીનો <b>વહન પટ્ટો</b> છે; તેમની વચ્ચેનું ઊર્જા અંતર <b>પટ્ટા અંતર</b> E<sub>g</sub> છે.</p><table><tr><th>વર્ગ</th><th>પટ્ટા અંતર</th><th>300 K પર વાહકતા</th><th>ઉદાહરણ</th></tr><tr><td>વાહક</td><td>અંતર નહીં, પટ્ટા એકબીજામાં</td><td>બહુ ઊંચી, લગભગ 10⁷ S/m</td><td>તાંબું, ચાંદી</td></tr><tr><td>અર્ધવાહક</td><td>લગભગ 0.1 થી 3 eV</td><td>મધ્યમ, 10⁻⁴ થી 10² S/m</td><td>સિલિકોન 1.1 eV, જર્મેનિયમ 0.7 eV</td></tr><tr><td>અવાહક</td><td>લગભગ 3 eV થી વધુ</td><td>લગભગ શૂન્ય</td><td>કાચ 8 eV, હીરો 5.5 eV</td></tr></table><h4>તાપમાન કેમ મહત્ત્વનું</h4><p>અર્ધવાહકનો તાપમાન ગુણાંક ઋણ છે: ગરમી ઇલેક્ટ્રોનને અંતર પાર કરવા પૂરતી ઊર્જા આપે, તેથી વાહકતા વધે. ધાતુ ઊલટું વર્તે.</p><h4>ઉકેલાયેલ દાખલો</h4><p>1.1 eV અંતર માટે ફોટોન ઊર્જા E = hc/λ, તેથી λ = 1240/1.1 = 1130 nm — દૃશ્ય શ્રેણીની બહાર, તેથી જ સિલિકોન ઇન્ફ્રારેડ ડિટેક્ટરમાં વપરાય.</p><h4>સામાન્ય ભૂલ</h4><p>પટ્ટા અંતરને એવો અવરોધ ગણવો જે ઇલેક્ટ્રોન પાર કરી જ ન શકે. ઓરડાના તાપમાને થોડો ભાગ હંમેશા પાર કરે, અને ડોપિંગ તેને ઘણું સહેલું કરે.</p>"}, "diagram": "u5_band", "syllabus_item": "5.7"}, {"h": {"en": "4.2 Intrinsic and extrinsic semiconductors, P and N type", "gu": "4.2 આંતરિક અને બાહ્ય અર્ધવાહક, P અને N પ્રકાર"}, "body": {"en": "<h4>Intrinsic</h4><p>A pure crystal such as silicon has equal numbers of free electrons and holes, so n = p = n<sub>i</sub>, and conduction is by both carriers. Its conductivity is low and rises quickly with temperature.</p><h4>Extrinsic: doping</h4><table><tr><th>Type</th><th>Dopant added</th><th>Majority carrier</th><th>Donor or acceptor level</th></tr><tr><td>N type</td><td>pentavalent: P, As, Sb</td><td>electrons (n > p)</td><td>donor level just below the conduction band</td></tr><tr><td>P type</td><td>trivalent: B, Al, Ga</td><td>holes (p > n)</td><td>acceptor level just above the valence band</td></tr></table><h4>Why the name misleads</h4><p>Both types are electrically neutral: the dopant atom brings its own extra electron or its missing bond, and the crystal as a whole stays uncharged. 'N' and 'P' describe the majority carrier, not a net charge.</p><h4>The p-n junction in one line</h4><p>Join P and N silicon and electrons diffuse across, leaving a depletion layer with a built-in field; that barrier is what makes a diode conduct one way only.</p><h4>Common mistake</h4><p>Saying an N-type crystal is negatively charged because it has electrons. The extra electrons are balanced by the positive donor ions in the lattice.</p>", "gu": "<h4>આંતરિક</h4><p>સિલિકોન જેવા શુદ્ધ સ્ફટિકમાં મુક્ત ઇલેક્ટ્રોન અને છિદ્ર સમાન સંખ્યામાં હોય, તેથી n = p = n<sub>i</sub>, અને વહન બંને વાહકો દ્વારા થાય. તેની વાહકતા ઓછી હોય અને તાપમાન સાથે ઝડપથી વધે.</p><h4>બાહ્ય: ડોપિંગ</h4><table><tr><th>પ્રકાર</th><th>ઉમેરાતી અશુદ્ધિ</th><th>બહુમતી વાહક</th><th>દાતા કે ગ્રાહક સ્તર</th></tr><tr><td>N પ્રકાર</td><td>પંચસંયોજક: P, As, Sb</td><td>ઇલેક્ટ્રોન (n > p)</td><td>વહન પટ્ટાના થોડું નીચે દાતા સ્તર</td></tr><tr><td>P પ્રકાર</td><td>ત્રિસંયોજક: B, Al, Ga</td><td>છિદ્ર (p > n)</td><td>સંયોજક પટ્ટાના થોડું ઉપર ગ્રાહક સ્તર</td></tr></table><h4>નામ કેમ ભ્રામક છે</h4><p>બંને પ્રકાર વિદ્યુતદૃષ્ટિએ તટસ્થ છે: અશુદ્ધિનો અણુ પોતાનો વધારાનો ઇલેક્ટ્રોન કે ખૂટતો બંધ સાથે આવે, અને આખો સ્ફટિક વીજભારરહિત રહે. 'N' અને 'P' બહુમતી વાહક દર્શાવે, ચોખ્ખો વીજભાર નહીં.</p><h4>એક લીટીમાં p-n સંધિ</h4><p>P અને N સિલિકોન જોડો તો ઇલેક્ટ્રોન ફેલાઈને જાય અને વિહીન સ્તર તથા આંતરિક ક્ષેત્ર રહી જાય; એ અવરોધ જ ડાયોડને એક દિશામાં જ વહેવા દે.</p><h4>સામાન્ય ભૂલ</h4><p>N પ્રકારના સ્ફટિકને ઇલેક્ટ્રોન હોવાથી ઋણ ભારિત કહેવું. વધારાના ઇલેક્ટ્રોન સ્ફટિકમાં રહેલા ધન દાતા આયનોથી સંતુલિત હોય છે.</p>"}, "diagram": "u5_doping", "syllabus_item": "5.8"}]}, {"title": {"en": "5. Practice Questions with Model Answers", "gu": "5. સરાવ પ્રશ્નો અને આદર્શ જવાબો"}, "items": [{"h": {"en": "Practice 1. Define a wave and distinguish longitudinal from transverse waves.", "gu": "સરાવ 1. તરંગની વ્યાખ્યા આપો અને સંગત તથા અનુપ્રસ્થ તરંગમાં ભેદ આપો."}, "body": {"en": "<p>A wave is a disturbance that transfers energy and momentum without transferring matter; the medium's particles oscillate about fixed positions and only the pattern moves.</p><p>In a longitudinal wave the particles vibrate along the direction of propagation, forming compressions and rarefactions, as sound does in air.</p><p>In a transverse wave they vibrate perpendicular to it, forming crests and troughs, as on a string or in light; a transverse wave can be polarised, a longitudinal one cannot.</p>", "gu": "<p>તરંગ એ વિક્ષોભ છે જે પદાર્થનું સ્થાનાંતરણ કર્યા વગર ઊર્જા અને વેગમાન પહોંચાડે; માધ્યમના કણો નિશ્ચિત સ્થાનની આસપાસ દોલિત થાય અને ફક્ત આકૃતિ આગળ વધે.</p><p>સંગત તરંગમાં કણો પ્રસરણની દિશામાં જ દોલિત થાય, જેનાથી સંકોચન અને વિસ્તરણ બને, જેમ હવામાં ધ્વનિ.</p><p>અનુપ્રસ્થ તરંગમાં તેઓ તેની લંબરૂપે દોલિત થાય, જેનાથી શિખર અને ગર્ત બને, જેમ દોરી પર કે પ્રકાશમાં; અનુપ્રસ્થ તરંગનું ધ્રુવીકરણ થઈ શકે, સંગતનું નહીં.</p>"}}, {"h": {"en": "Practice 2. Write the relation v = f λ and explain what changes when sound enters water.", "gu": "સરાવ 2. v = f λ સંબંધ લખો અને ધ્વનિ પાણીમાં જાય ત્યારે શું બદલાય તે સમજાવો."}, "body": {"en": "<p>For any wave, velocity equals frequency times wavelength: v = f λ, where f is in hertz and λ in metres.</p><p>The source fixes the frequency, so f does not change at a boundary; the medium fixes the speed, which rises from 343 m/s in air to about 1480 m/s in water.</p><p>The wavelength must therefore rise in the same ratio, from 1.34 m to about 5.8 m for a 256 Hz note, which is why sound bends and spreads differently underwater.</p>", "gu": "<p>કોઈપણ તરંગ માટે વેગ એ આવૃત્તિ ગુણ્યા તરંગલંબાઈ છે: v = f λ, જ્યાં f હર્ટ્ઝમાં અને λ મીટરમાં.</p><p>સ્રોત આવૃત્તિ નક્કી કરે, તેથી સીમા પર f બદલાતી નથી; માધ્યમ વેગ નક્કી કરે, જે હવામાં 343 m/s થી પાણીમાં લગભગ 1480 m/s થાય.</p><p>તેથી તરંગલંબાઈ એ જ પ્રમાણમાં વધવી પડે, 256 Hz સૂર માટે 1.34 m થી લગભગ 5.8 m, અને તેથી જ પાણીમાં ધ્વનિ જુદી રીતે વળે અને ફેલાય.</p>"}}, {"h": {"en": "Practice 3. State the principle of superposition and the conditions for steady interference.", "gu": "સરાવ 3. અધ્યારોપણનો સિદ્ધાંત અને સ્થિર વ્યતીકરણની શરતો જણાવો."}, "body": {"en": "<p>The principle says the resultant displacement at a point is the vector sum of the displacements due to each wave arriving there.</p><p>For a steady pattern the two sources must be coherent — same frequency and a constant phase difference — of nearly equal amplitude, and close together compared with their distance from the screen.</p><p>When the waves travel in opposite directions with equal amplitude the sum is a stationary wave with fixed nodes λ/2 apart, which is how a string or an organ pipe resonates.</p>", "gu": "<p>સિદ્ધાંત કહે છે કે કોઈ બિંદુએ પરિણામી સ્થાનાંતરણ ત્યાં પહોંચતા દરેક તરંગના સ્થાનાંતરણનો સદિશ સરવાળો છે.</p><p>સ્થિર આકૃતિ માટે બે સ્રોત સહસંબંધી હોવા જોઈએ — સમાન આવૃત્તિ અને અચળ કળા તફાવત — લગભગ સમાન કંપવિસ્તારવાળા, અને પડદાથી તેમના અંતરની સરખામણીમાં નજીક.</p><p>તરંગો સમાન કંપવિસ્તાર સાથે વિરુદ્ધ દિશામાં ચાલે ત્યારે સરવાળો સ્થિર તરંગ બને, જેમાં નિસ્પંદ λ/2 અંતરે સ્થિર રહે, અને તેથી જ દોરી કે ઓર્ગન પાઇપ અનુનાદ કરે.</p>"}}, {"h": {"en": "Practice 4. Define reverberation time, echo and absorption coefficient.", "gu": "સરાવ 4. પ્રતિધ્વનિ સમય, પડઘો અને શોષણ ગુણાંકની વ્યાખ્યા આપો."}, "body": {"en": "<p>Reverberation time is the time taken for the sound level in a hall to fall by 60 dB after the source stops; it is the single number that describes how 'live' a room is.</p><p>An echo is a reflected sound heard separately, which needs a delay of at least about 0.1 s, so the reflector must be roughly 17 m away.</p><p>The absorption coefficient α is the fraction of incident sound energy a surface absorbs: 0.02 for plaster, 0.5 for a heavy curtain and 1.00 for an open window.</p>", "gu": "<p>પ્રતિધ્વનિ સમય એ સ્રોત બંધ થયા પછી હોલમાં ધ્વનિનું સ્તર 60 dB ઘટવા લાગતો સમય છે; ઓરડો કેટલો 'જીવંત' છે તે દર્શાવતો એક જ આંકડો તે છે.</p><p>પડઘો એ અલગ સંભળાતો પરાવર્તિત ધ્વનિ છે, જેના માટે ઓછામાં ઓછો લગભગ 0.1 s વિલંબ જોઈએ, તેથી પરાવર્તક લગભગ 17 m દૂર હોવું જોઈએ.</p><p>શોષણ ગુણાંક α એ સપાટી પર પડતી ધ્વનિ ઊર્જાનો શોષાતો ભાગ છે: પ્લાસ્ટર માટે 0.02, જાડા પડદા માટે 0.5 અને ખુલ્લી બારી માટે 1.00.</p>"}}, {"h": {"en": "Practice 5. State Sabine's formula and solve one numerical with it.", "gu": "સરાવ 5. સેબાઇનનું સૂત્ર જણાવો અને તેનો એક દાખલો ઉકેલો."}, "body": {"en": "<p>T = 0.161 V/A, where V is the volume in m³ and A = Σ α S is the total absorption in m² sabine.</p><p>For a hall 20 × 15 × 8 m, V = 2400 m³; with A = 240 m² sabine the time is 0.161 × 2400/240 = 1.61 s.</p><p>To reach 1.0 s the room needs A = 386 m², so 146 m² of extra absorption — about 290 m² of curtain, or 320 seats, which shows why a full hall sounds different from an empty one.</p>", "gu": "<p>T = 0.161 V/A, જ્યાં V ઘનફળ m³ માં અને A = Σ α S કુલ શોષણ m² સેબાઇનમાં.</p><p>20 × 15 × 8 m ના હોલ માટે V = 2400 m³; A = 240 m² સેબાઇન સાથે સમય 0.161 × 2400/240 = 1.61 s.</p><p>1.0 s સુધી પહોંચવા ઓરડાને A = 386 m² જોઈએ, એટલે 146 m² વધુ શોષણ — લગભગ 290 m² પડદો, કે 320 બેઠક, જે દર્શાવે કે ભરેલો હોલ ખાલી કરતાં જુદો કેમ સંભળાય.</p>"}}, {"h": {"en": "Practice 6. How is reverberation controlled in a hall? Give four measures.", "gu": "સરાવ 6. હોલમાં પ્રતિધ્વનિ કેવી રીતે નિયંત્રિત થાય? ચાર ઉપાય આપો."}, "body": {"en": "<p>The first step is to compute T from Sabine's formula and compare it with the target: about 1 s for speech and 2 s for music.</p><p>If T is too long, absorbers are added: acoustic tiles on the ceiling, heavy curtains over glass, carpet on the floor and upholstered seating.</p><p>If T is too short the hall sounds dead, so hard reflective panels are kept and the volume is reduced; a curved rear wall is avoided because it focuses an echo on the stage.</p>", "gu": "<p>પ્રથમ પગલું એ છે કે સેબાઇનના સૂત્રથી T ગણીને લક્ષ્ય સાથે સરખાવવું: બોલાયેલા શબ્દ માટે લગભગ 1 s અને સંગીત માટે 2 s.</p><p>T લાંબી હોય તો શોષક ઉમેરાય: ટોચમર્યાદા પર ધ્વનિ-શોષક ટાઇલ, કાચ પર જાડા પડદા, ફર્શ પર જાજમ અને ગાદીવાળી બેઠક.</p><p>T ટૂંકી હોય તો હોલ મૃત લાગે, તેથી કઠણ પરાવર્તક પેનલ રખાય અને ઘનફળ ઘટાડાય; વળેલી પાછળની દીવાલ ટાળાય કારણ કે તે પડઘાને મંચ પર કેન્દ્રિત કરે.</p>"}}, {"h": {"en": "Practice 7. What is the difference between ultrasonic and infrasonic waves? Give two uses of ultrasound.", "gu": "સરાવ 7. અલ્ટ્રાસોનિક અને ઇન્ફ્રાસોનિક તરંગોમાં શું ફરક છે? અલ્ટ્રાસાઉન્ડના બે ઉપયોગ આપો."}, "body": {"en": "<p>Ultrasonic waves are above about 20 kHz, the upper limit of human hearing; infrasonic waves are below 20 Hz, as produced by earthquakes and large machinery.</p><p>Ultrasound has a short wavelength, travels in a narrow beam and reflects at boundaries, which makes it useful for imaging and for depth measurement.</p><p>Uses: sonography in hospitals and SONAR at sea, and in industry flaw detection in castings and ultrasonic cleaning of jewellery.</p>", "gu": "<p>અલ્ટ્રાસોનિક તરંગો લગભગ 20 kHz થી ઉપર, માનવ શ્રવણની ઉપલી મર્યાદા છે; ઇન્ફ્રાસોનિક તરંગો 20 Hz થી નીચે, જે ભૂકંપ અને મોટા યંત્રો ઉત્પન્ન કરે.</p><p>અલ્ટ્રાસાઉન્ડની તરંગલંબાઈ ટૂંકી હોય, સાંકડા કિરણપુંજમાં ચાલે અને સીમા પર પરાવર્તિત થાય, તેથી તે ચિત્રણ અને ઊંડાઈ માપન માટે ઉપયોગી બને.</p><p>ઉપયોગ: હોસ્પિટલમાં સોનોગ્રાફી અને દરિયામાં સોનાર, તથા ઉદ્યોગમાં કાસ્ટિંગની ખામી શોધ અને દાગીનાની અલ્ટ્રાસોનિક સફાઈ.</p>"}}, {"h": {"en": "Practice 8. Explain conductors, semiconductors and insulators on the basis of the band gap.", "gu": "સરાવ 8. પટ્ટા અંતરના આધારે વાહક, અર્ધવાહક અને અવાહક સમજાવો."}, "body": {"en": "<p>In a solid the electron energies lie in bands: the valence band is the highest filled one and the conduction band is the next, separated by the energy gap.</p><p>A conductor has overlapping bands, so electrons move freely; a semiconductor has a gap of about 0.1 to 3 eV, small enough for thermal energy to lift a few electrons across; an insulator has more than about 3 eV, so almost none cross.</p><p>Silicon (1.1 eV) and germanium (0.7 eV) are the practical semiconductors, and their negative temperature coefficient — conductivity rising with heat — is the opposite of a metal.</p>", "gu": "<p>ઘનમાં ઇલેક્ટ્રોનની ઊર્જા પટ્ટામાં હોય: સંયોજક પટ્ટો સૌથી ઊંચો ભરેલો અને વહન પટ્ટો તેના પછીનો, જે ઊર્જા અંતરથી અલગ હોય.</p><p>વાહકમાં પટ્ટા એકબીજામાં હોય, તેથી ઇલેક્ટ્રોન મુક્ત ફરે; અર્ધવાહકમાં લગભગ 0.1 થી 3 eV નું અંતર હોય, જે થોડા ઇલેક્ટ્રોનને ઉષ્મીય ઊર્જાથી પાર કરાવે; અવાહકમાં લગભગ 3 eV થી વધુ, તેથી લગભગ કોઈ પાર કરતું નથી.</p><p>સિલિકોન (1.1 eV) અને જર્મેનિયમ (0.7 eV) વ્યવહારુ અર્ધવાહક છે, અને તેમનો ઋણ તાપમાન ગુણાંક — ગરમી સાથે વાહકતા વધવી — ધાતુથી ઊલટો છે.</p>"}}, {"h": {"en": "Practice 9. What is doping? Distinguish N-type from P-type material.", "gu": "સરાવ 9. ડોપિંગ શું છે? N પ્રકાર અને P પ્રકારના દ્રવ્યમાં ભેદ આપો."}, "body": {"en": "<p>Doping is the addition of a controlled trace of impurity — typically one atom in a million — to pure silicon so that its conductivity rises by several orders of magnitude.</p><p>Adding a pentavalent atom such as phosphorus gives an N-type crystal, where electrons are the majority carriers and a donor level sits just below the conduction band.</p><p>Adding a trivalent atom such as boron gives a P-type crystal with holes as the majority carrier and an acceptor level just above the valence band. Both remain electrically neutral.</p>", "gu": "<p>ડોપિંગ એ શુદ્ધ સિલિકોનમાં અશુદ્ધિનો નિયંત્રિત થોડો ભાગ — સામાન્ય રીતે દશ લાખમાં એક અણુ — ઉમેરવો છે જેથી તેની વાહકતા ઘણા ક્રમ વધે.</p><p>ફોસ્ફરસ જેવો પંચસંયોજક અણુ ઉમેરતાં N પ્રકારનો સ્ફટિક મળે, જેમાં ઇલેક્ટ્રોન બહુમતી વાહક હોય અને દાતા સ્તર વહન પટ્ટાના થોડું નીચે હોય.</p><p>બોરોન જેવો ત્રિસંયોજક અણુ ઉમેરતાં P પ્રકારનો સ્ફટિક મળે, જેમાં છિદ્ર બહુમતી વાહક હોય અને ગ્રાહક સ્તર સંયોજક પટ્ટાના થોડું ઉપર. બંને વિદ્યુતદૃષ્ટિએ તટસ્થ રહે.</p>"}}, {"h": {"en": "Practice 10. How are ultrasonic waves produced? Explain piezoelectric and magnetostriction methods.", "gu": "સરાવ 10. અલ્ટ્રાસોનિક તરંગો કેવી રીતે ઉત્પન્ન થાય? પીઝોઇલેક્ટ્રિક અને મેગ્નેટોસ્ટ્રિક્શન રીતો સમજાવો."}, "body": {"en": "<p>In the piezoelectric method a quartz or barium titanate plate is cut along a crystal axis and an alternating voltage is applied across it; the plate expands and contracts at the driving frequency.</p><p>In the magnetostriction method a nickel rod is wound with a coil fed from a valve oscillator; the changing magnetic field changes the rod's length, and it vibrates at the driving frequency.</p><p>Both produce a beam of the same frequency as the oscillator, typically 20 kHz to a few MHz, which is why the oscillator frequency must be stable for imaging work.</p>", "gu": "<p>પીઝોઇલેક્ટ્રિક રીતમાં ક્વાર્ટ્ઝ કે બેરિયમ ટાઇટેનેટની પ્લેટ સ્ફટિકની ધરી પર કાપાય અને તેના પર પ્રત્યાવર્તી વોલ્ટેજ આપાય; પ્લેટ ચાલક આવૃત્તિ પર ફેલાય અને સંકોચાય.</p><p>મેગ્નેટોસ્ટ્રિક્શન રીતમાં નિકલના સળિયા પર કોઇલ વીંટાય જે દોલકથી ચાલે; બદલાતું ચુંબકીય ક્ષેત્ર સળિયાની લંબાઈ બદલે, અને તે ચાલક આવૃત્તિ પર દોલિત થાય.</p><p>બંને દોલક જેટલી જ આવૃત્તિનું કિરણ આપે, સામાન્ય રીતે 20 kHz થી થોડા MHz સુધી, અને તેથી જ ચિત્રણના કામ માટે દોલકની આવૃત્તિ સ્થિર હોવી જોઈએ.</p>"}}, {"h": {"en": "Practice 11. A hall of 2400 m³ has a reverberation time of 1.6 s. Find the absorption and the value needed for 1.0 s.", "gu": "સરાવ 11. 2400 m³ ના હોલનો પ્રતિધ્વનિ સમય 1.6 s છે. શોષણ શોધો અને 1.0 s માટે જરૂરી મૂલ્ય."}, "body": {"en": "<p>From Sabine's formula, A = 0.161 V/T = 0.161 × 2400/1.6 = 241 m² sabine.</p><p>For 1.0 s, A = 0.161 × 2400/1.0 = 386 m², so the extra absorption needed is 145 m².</p><p>That could be about 290 m² of heavy curtain at α = 0.5, or simply a full audience of 320, which is why the reverberation of a hall changes when the seats are filled.</p><p>Check the direction: more absorption means a shorter time, so the second answer must be larger than the first and the time must fall — 1.6 s down to 1.0 s, which is what a change from 241 to 386 m² gives.</p>", "gu": "<p>સેબાઇનના સૂત્રથી, A = 0.161 V/T = 0.161 × 2400/1.6 = 241 m² સેબાઇન.</p><p>1.0 s માટે A = 0.161 × 2400/1.0 = 386 m², તેથી વધારાનું શોષણ 145 m² જોઈએ.</p><p>તે α = 0.5 પર લગભગ 290 m² જાડો પડદો હોઈ શકે, કે ફક્ત 320 શ્રોતાઓ, અને તેથી જ હોલ ભરાય ત્યારે પ્રતિધ્વનિ બદલાય.</p><p>દિશા ચકાસો: વધુ શોષણ એટલે ટૂંકો સમય, તેથી બીજો જવાબ પહેલા કરતાં મોટો હોવો જોઈએ અને સમય ઘટવો જોઈએ — 1.6 s થી 1.0 s, જે 241 થી 386 m² ના ફેરફારથી મળે.</p>"}}, {"h": {"en": "Practice 12. Ultrasound of 40 kHz is used in water. Find its wavelength and the depth if the echo returns in 0.4 s.", "gu": "સરાવ 12. પાણીમાં 40 kHz અલ્ટ્રાસાઉન્ડ વપરાય છે. તેની તરંગલંબાઈ અને 0.4 s માં પડઘો આવે તો ઊંડાઈ શોધો."}, "body": {"en": "<p>λ = v/f = 1480/40 000 = 3.7 × 10⁻² m = 3.7 cm.</p><p>The pulse travels down and back, so d = v t/2 = 1480 × 0.4/2 = 296 m.</p><p>The short wavelength is what makes this possible: a 3.7 cm wave resolves objects of a few centimetres, while a 17 m audible wave would give no detail at all.</p><p>Two practical notes: the speed must be the speed in water and not in air, and the echo time must be halved, because the pulse travels to the seabed and back before it is timed.</p>", "gu": "<p>λ = v/f = 1480/40 000 = 3.7 × 10⁻² m = 3.7 cm.</p><p>સ્પંદ નીચે જાય અને પાછું આવે, તેથી d = v t/2 = 1480 × 0.4/2 = 296 m.</p><p>ટૂંકી તરંગલંબાઈ જ આ શક્ય બનાવે: 3.7 cm તરંગ થોડા સેન્ટીમીટરની વસ્તુ અલગ ઓળખે, જ્યારે 17 m નું શ્રાવ્ય તરંગ કોઈ વિગત આપે જ નહીં.</p><p>બે વ્યવહારુ નોંધ: વેગ પાણીમાંનો લેવો જોઈએ, હવામાંનો નહીં, અને પડઘાનો સમય અડધો કરવો જોઈએ, કારણ કે સ્પંદ સમય માપતા પહેલાં દરિયાતળ સુધી જાય અને પાછું આવે.</p>"}}, {"h": {"en": "Practice 13. Silicon has a band gap of 1.1 eV. Find the maximum wavelength that can create an electron–hole pair.", "gu": "સરાવ 13. સિલિકોનનું પટ્ટા અંતર 1.1 eV છે. ઇલેક્ટ્રોન-છિદ્ર જોડ બનાવી શકે તેવી મહત્તમ તરંગલંબાઈ શોધો."}, "body": {"en": "<p>The photon must carry at least E_g, so hc/λ = 1.1 eV.</p><p>Using E(eV) = 1240/λ(nm): λ = 1240/1.1 = 1127 nm.</p><p>That is in the near infrared, beyond human vision, which is why silicon detectors are used for infrared sensing and why the material looks opaque to visible light but transparent to longer wavelengths.</p>", "gu": "<p>ફોટોને ઓછામાં ઓછું E_g જોઈએ, તેથી hc/λ = 1.1 eV.</p><p>E(eV) = 1240/λ(nm) વાપરતાં: λ = 1240/1.1 = 1127 nm.</p><p>તે નજીકના ઇન્ફ્રારેડમાં છે, માનવ દૃષ્ટિથી બહાર, તેથી જ સિલિકોન ડિટેક્ટર ઇન્ફ્રારેડ સંવેદનમાં વપરાય અને તેથી જ તે દૃશ્ય પ્રકાશ માટે અપારદર્શક પણ લાંબી તરંગલંબાઈ માટે પારદર્શક લાગે.</p>"}}, {"h": {"en": "Practice 14. Why is a semiconductor called a material with a negative temperature coefficient?", "gu": "સરાવ 14. અર્ધવાહકને ઋણ તાપમાન ગુણાંકવાળો પદાર્થ કેમ કહેવાય?"}, "body": {"en": "<p>In a semiconductor the number of free carriers is set by how many electrons can cross the band gap, and heating increases that number sharply.</p><p>The rise in carriers outweighs the fall in their mobility, so the resistivity falls and the conductivity rises with temperature — the opposite of a metal.</p><p>This is why a thermistor is made of semiconductor material and why a power device must be kept cool: a hot junction would conduct when it should block.</p>", "gu": "<p>અર્ધવાહકમાં મુક્ત વાહકોની સંખ્યા એના પર આધારિત છે કે કેટલા ઇલેક્ટ્રોન પટ્ટા અંતર પાર કરી શકે, અને ગરમી તે સંખ્યા ઝડપથી વધારે.</p><p>વાહકોનો વધારો તેમની ગતિશીલતાના ઘટાડા કરતાં ભારે પડે, તેથી અવરોધકતા ઘટે અને વાહકતા તાપમાન સાથે વધે — ધાતુથી ઊલટું.</p><p>તેથી જ થર્મિસ્ટર અર્ધવાહક પદાર્થનું બને છે અને પાવર ઉપકરણ ઠંડું રાખવું પડે: ગરમ સંધિ જ્યારે અવરોધ કરવો જોઈએ ત્યારે વહન કરી દે.</p>"}}]}], "diagrams": [{"id": "u5_wave", "title": {"en": "A transverse wave and a longitudinal wave", "gu": "અનુપ્રસ્થ તરંગ અને સંગત તરંગ"}, "file": "diagrams/u5_wave.svg", "caption": {"en": "In a transverse wave the motion is at right angles to the wave; in a longitudinal one it is along the wave.", "gu": "અનુપ્રસ્થ તરંગમાં ગતિ તરંગને લંબરૂપે, સંગત તરંગમાં તરંગની દિશામાં જ હોય."}}, {"id": "u5_stationary", "title": {"en": "Two waves add up to a stationary wave", "gu": "બે તરંગો મળીને સ્થિર તરંગ બનાવે"}, "file": "diagrams/u5_stationary.svg", "caption": {"en": "Nodes never move and antinodes swing the most; both are fixed in space.", "gu": "નિસ્પંદ કદી ખસતાં નથી અને પ્રસ્પંદ સૌથી વધુ દોલિત થાય; બંને અવકાશમાં સ્થિર રહે."}}, {"id": "u5_reverb", "title": {"en": "How the sound level decays in a hall", "gu": "હોલમાં ધ્વનિનું સ્તર કેવી રીતે ઘટે"}, "file": "diagrams/u5_reverb.svg", "caption": {"en": "Reverberation time is the 60 dB drop, which is why it is written T60.", "gu": "પ્રતિધ્વનિ સમય એ 60 dB નો ઘટાડો છે, તેથી જ તેને T60 લખાય."}}, {"id": "u5_ultrasonic", "title": {"en": "Hearing ranges and the SONAR echo", "gu": "શ્રવણ શ્રેણી અને પડઘાથી સોનાર"}, "file": "diagrams/u5_ultrasonic.svg", "caption": {"en": "Ultrasound is still sound: it needs a medium, and the echo gives the distance.", "gu": "અલ્ટ્રાસાઉન્ડ પણ ધ્વનિ જ છે: માધ્યમ જોઈએ, અને પડઘો અંતર આપે."}}, {"id": "u5_band", "title": {"en": "Band gaps of the three classes of solid", "gu": "ત્રણ વર્ગના ઘનનાં પટ્ટા અંતર"}, "file": "diagrams/u5_band.svg", "caption": {"en": "No gap means a conductor, a small gap a semiconductor, a large gap an insulator.", "gu": "અંતર ન હોય તો વાહક, નાનું અંતર અર્ધવાહક, મોટું અંતર અવાહક."}}, {"id": "u5_doping", "title": {"en": "Donor and acceptor levels in doped silicon", "gu": "ડોપ કરેલા સિલિકોનમાં દાતા અને ગ્રાહક સ્તર"}, "file": "diagrams/u5_doping.svg", "caption": {"en": "A donor sits just below the conduction band, an acceptor just above the valence band.", "gu": "દાતા વહન પટ્ટાના થોડું નીચે, ગ્રાહક સંયોજક પટ્ટાના થોડું ઉપર બેસે."}}], "equations": [{"title": {"en": "Wave motion", "gu": "તરંગ ગતિ"}, "items": [{"name": {"en": "Wave velocity", "gu": "તરંગ વેગ"}, "f": "v = f λ", "terms": {"en": "The medium fixes v and the source fixes f, so λ adjusts.", "gu": "માધ્યમ v નક્કી કરે અને સ્રોત f, તેથી λ ગોઠવાય."}}, {"name": {"en": "Time period", "gu": "આવર્તકાળ"}, "f": "T = 1/f", "terms": {"en": "One full oscillation, in seconds.", "gu": "એક પૂરું દોલન, સેકન્ડમાં."}}, {"name": {"en": "Node spacing", "gu": "નિસ્પંદ અંતર"}, "f": "node to node = λ/2, node to antinode = λ/4", "terms": {"en": "Both apply to every stationary wave.", "gu": "બંને દરેક સ્થિર તરંગને લાગુ પડે."}}, {"name": {"en": "Echo distance", "gu": "પડઘાનું અંતર"}, "f": "d = v t / 2", "terms": {"en": "Half the path, because the sound goes and returns.", "gu": "અડધો રસ્તો, કારણ કે ધ્વનિ જાય અને પાછો આવે."}}]}, {"title": {"en": "Acoustics", "gu": "ધ્વનિશાસ્ત્ર"}, "items": [{"name": {"en": "Sabine's formula", "gu": "સેબાઇનનું સૂત્ર"}, "f": "T = 0.161 V / A", "terms": {"en": "V in m³ and A = Σ α S in m² sabine.", "gu": "V m³ માં અને A = Σ α S m² સેબાઇનમાં."}}, {"name": {"en": "Total absorption", "gu": "કુલ શોષણ"}, "f": "A = Σ α S", "terms": {"en": "Sum of coefficient times area for every surface.", "gu": "દરેક સપાટી માટે ગુણાંક ગુણ્યા ક્ષેત્રફળનો સરવાળો."}}, {"name": {"en": "Absorption needed for a target time", "gu": "લક્ષ્ય સમય માટે જરૂરી શોષણ"}, "f": "A = 0.161 V / T", "terms": {"en": "Rearranged Sabine formula, used to size the absorbers.", "gu": "સેબાઇનનું ગોઠવેલું સૂત્ર, શોષકનું માપ નક્કી કરવા વપરાય."}}, {"name": {"en": "Absorption coefficient", "gu": "શોષણ ગુણાંક"}, "f": "α = absorbed energy / incident energy", "terms": {"en": "0 for a perfect reflector, 1 for an open window.", "gu": "પૂર્ણ પરાવર્તક માટે 0, ખુલ્લી બારી માટે 1."}}]}, {"title": {"en": "Ultrasonics and semiconductors", "gu": "અલ્ટ્રાસોનિક્સ અને અર્ધવાહક"}, "items": [{"name": {"en": "Ultrasonic range", "gu": "અલ્ટ્રાસોનિક શ્રેણી"}, "f": "f > 20 kHz", "terms": {"en": "Above human hearing; infrasonic is below 20 Hz.", "gu": "માનવ શ્રવણથી ઉપર; ઇન્ફ્રાસોનિક 20 Hz થી નીચે."}}, {"name": {"en": "SONAR depth", "gu": "સોનાર ઊંડાઈ"}, "f": "d = v t / 2", "terms": {"en": "Same echo geometry, with v = 1500 m/s in water.", "gu": "એ જ પડઘાની ભૂમિતિ, પાણીમાં v = 1500 m/s સાથે."}}, {"name": {"en": "Photon energy and band gap", "gu": "ફોટોન ઊર્જા અને પટ્ટા અંતર"}, "f": "E (eV) = 1240 / λ (nm)", "terms": {"en": "Light frees an electron only if E is at least E_g.", "gu": "પ્રકાશ ઇલેક્ટ્રોન મુક્ત કરે ફક્ત જો E ઓછામાં ઓછું E_g હોય."}}, {"name": {"en": "Mass action law", "gu": "દ્રવ્ય-ક્રિયા નિયમ"}, "f": "n p = nᵢ²", "terms": {"en": "Holds for intrinsic and doped silicon alike.", "gu": "આંતરિક અને ડોપ કરેલા સિલિકોન બંને માટે લાગુ."}}]}], "numericals": [{"id": "u5n01", "unit": 5, "h": {"en": "Wave velocity from frequency and wavelength.", "gu": "આવૃત્તિ અને તરંગલંબાઈ પરથી તરંગ વેગ."}, "q": {"en": "A wave of frequency 500 Hz has a wavelength of 0.68 m. Find its velocity.", "gu": "500 Hz આવૃત્તિવાળા તરંગની તરંગલંબાઈ 0.68 m છે. તેનો વેગ શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A wave of frequency 500 Hz has a wavelength of 0.68 m. Find its velocity.</p><h4>Step-by-step solution</h4><p>v = f λ</p><p>= 500 × 0.68</p><p>= 340 m/s</p><h4>Answer</h4><p><b>340 m/s</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>500 Hz આવૃત્તિવાળા તરંગની તરંગલંબાઈ 0.68 m છે. તેનો વેગ શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>v = f λ</p><p>= 500 × 0.68</p><p>= 340 m/s</p><h4>જવાબ</h4><p><b>340 m/s</b></p>"}, "answer": {"en": "340 m/s", "gu": "340 m/s"}}, {"id": "u5n02", "unit": 5, "h": {"en": "Wavelength of a 256 Hz tuning fork in air.", "gu": "હવામાં 256 Hz ના સ્વરકાંટાની તરંગલંબાઈ."}, "q": {"en": "Find the wavelength and time period of a 256 Hz sound in air at 343 m/s.", "gu": "343 m/s પર હવામાં 256 Hz ધ્વનિની તરંગલંબાઈ અને આવર્તકાળ શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>Find the wavelength and time period of a 256 Hz sound in air at 343 m/s.</p><h4>Step-by-step solution</h4><p>λ = v/f = 343/256</p><p>= 1.34 m</p><p>T = 1/f = 1/256 = 3.9 × 10⁻³ s</p><h4>Answer</h4><p><b>1.34 m and 3.9 ms</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>343 m/s પર હવામાં 256 Hz ધ્વનિની તરંગલંબાઈ અને આવર્તકાળ શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>λ = v/f = 343/256</p><p>= 1.34 m</p><p>T = 1/f = 1/256 = 3.9 × 10⁻³ s</p><h4>જવાબ</h4><p><b>1.34 m અને 3.9 ms</b></p>"}, "answer": {"en": "1.34 m and 3.9 ms", "gu": "1.34 m અને 3.9 ms"}}, {"id": "u5n03", "unit": 5, "h": {"en": "Frequency of a 0.25 m wave in water.", "gu": "પાણીમાં 0.25 m તરંગની આવૃત્તિ."}, "q": {"en": "A wave of wavelength 0.25 m travels in water at 1500 m/s. Find its frequency.", "gu": "0.25 m તરંગલંબાઈનું તરંગ પાણીમાં 1500 m/s પર ચાલે છે. તેની આવૃત્તિ શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A wave of wavelength 0.25 m travels in water at 1500 m/s. Find its frequency.</p><h4>Step-by-step solution</h4><p>f = v/λ</p><p>= 1500/0.25</p><p>= 6000 Hz = 6 kHz</p><h4>Answer</h4><p><b>6 kHz</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>0.25 m તરંગલંબાઈનું તરંગ પાણીમાં 1500 m/s પર ચાલે છે. તેની આવૃત્તિ શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>f = v/λ</p><p>= 1500/0.25</p><p>= 6000 Hz = 6 kHz</p><h4>જવાબ</h4><p><b>6 kHz</b></p>"}, "answer": {"en": "6 kHz", "gu": "6 kHz"}}, {"id": "u5n04", "unit": 5, "h": {"en": "Time period of a 50 Hz supply.", "gu": "50 Hz પુરવઠાનો આવર્તકાળ."}, "q": {"en": "Find the time period of a 50 Hz alternating supply and the number of cycles in 0.1 s.", "gu": "50 Hz પ્રત્યાવર્તી પુરવઠાનો આવર્તકાળ અને 0.1 s માં ચક્રોની સંખ્યા શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>Find the time period of a 50 Hz alternating supply and the number of cycles in 0.1 s.</p><h4>Step-by-step solution</h4><p>T = 1/f = 1/50 = 0.02 s</p><p>Cycles in 0.1 s = 0.1/0.02</p><p>= 5 cycles</p><h4>Answer</h4><p><b>0.02 s and 5 cycles</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>50 Hz પ્રત્યાવર્તી પુરવઠાનો આવર્તકાળ અને 0.1 s માં ચક્રોની સંખ્યા શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>T = 1/f = 1/50 = 0.02 s</p><p>0.1 s માં ચક્ર = 0.1/0.02</p><p>= 5 ચક્ર</p><h4>જવાબ</h4><p><b>0.02 s અને 5 ચક્ર</b></p>"}, "answer": {"en": "0.02 s and 5 cycles", "gu": "0.02 s અને 5 ચક્ર"}}, {"id": "u5n05", "unit": 5, "h": {"en": "Distance to a wall from an echo delay.", "gu": "પડઘાના વિલંબ પરથી દીવાલનું અંતર."}, "q": {"en": "A clap is heard again after 0.6 s from a distant wall. Find the distance (v = 340 m/s).", "gu": "દૂરની દીવાલથી તાળી 0.6 s પછી ફરી સંભળાય છે. અંતર શોધો (v = 340 m/s)."}, "a": {"en": "<h4>Given and assumptions</h4><p>A clap is heard again after 0.6 s from a distant wall. Find the distance (v = 340 m/s).</p><h4>Step-by-step solution</h4><p>The sound travels there and back, so 2d = v t</p><p>d = v t/2 = 340 × 0.6/2</p><p>= 102 m</p><h4>Answer</h4><p><b>102 m</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>દૂરની દીવાલથી તાળી 0.6 s પછી ફરી સંભળાય છે. અંતર શોધો (v = 340 m/s).</p><h4>પગલાવાર ઉકેલ</h4><p>ધ્વનિ જાય અને પાછો આવે, તેથી 2d = v t</p><p>d = v t/2 = 340 × 0.6/2</p><p>= 102 m</p><h4>જવાબ</h4><p><b>102 m</b></p>"}, "answer": {"en": "102 m", "gu": "102 m"}}, {"id": "u5n06", "unit": 5, "h": {"en": "Minimum distance for a distinct echo.", "gu": "અલગ પડઘા માટે લઘુતમ અંતર."}, "q": {"en": "The ear can separate an echo after 0.1 s. Find the minimum distance of the reflector.", "gu": "કાન 0.1 s પછીનો પડઘો અલગ પકડી શકે છે. પરાવર્તકનું લઘુતમ અંતર શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>The ear can separate an echo after 0.1 s. Find the minimum distance of the reflector.</p><h4>Step-by-step solution</h4><p>d = v t/2</p><p>= 340 × 0.1/2</p><p>= 17 m</p><h4>Answer</h4><p><b>17 m</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>કાન 0.1 s પછીનો પડઘો અલગ પકડી શકે છે. પરાવર્તકનું લઘુતમ અંતર શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>d = v t/2</p><p>= 340 × 0.1/2</p><p>= 17 m</p><h4>જવાબ</h4><p><b>17 m</b></p>"}, "answer": {"en": "17 m", "gu": "17 m"}}, {"id": "u5n07", "unit": 5, "h": {"en": "Reverberation time of a hall by Sabine's formula.", "gu": "સેબાઇનના સૂત્રથી હોલનો પ્રતિધ્વનિ સમય."}, "q": {"en": "A hall of volume 2400 m³ has a total absorption of 240 m² sabine. Find its reverberation time.", "gu": "2400 m³ ઘનફળવાળા હોલમાં કુલ શોષણ 240 m² સેબાઇન છે. તેનો પ્રતિધ્વનિ સમય શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A hall of volume 2400 m³ has a total absorption of 240 m² sabine. Find its reverberation time.</p><h4>Step-by-step solution</h4><p>T = 0.161 V/A</p><p>= 0.161 × 2400/240</p><p>= 1.61 s</p><h4>Answer</h4><p><b>1.61 s</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>2400 m³ ઘનફળવાળા હોલમાં કુલ શોષણ 240 m² સેબાઇન છે. તેનો પ્રતિધ્વનિ સમય શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>T = 0.161 V/A</p><p>= 0.161 × 2400/240</p><p>= 1.61 s</p><h4>જવાબ</h4><p><b>1.61 s</b></p>"}, "answer": {"en": "1.61 s", "gu": "1.61 s"}}, {"id": "u5n08", "unit": 5, "h": {"en": "Absorption needed for a reverberation time of 1 s.", "gu": "1 s પ્રતિધ્વનિ સમય માટે જરૂરી શોષણ."}, "q": {"en": "What total absorption brings the same 2400 m³ hall to 1.0 s?", "gu": "એ જ 2400 m³ હોલને 1.0 s પર લાવવા કેટલું કુલ શોષણ જોઈએ?"}, "a": {"en": "<h4>Given and assumptions</h4><p>What total absorption brings the same 2400 m³ hall to 1.0 s?</p><h4>Step-by-step solution</h4><p>A = 0.161 V/T</p><p>= 0.161 × 2400/1.0</p><p>= 386 m² sabine, so 146 m² must be added</p><h4>Answer</h4><p><b>386 m² sabine</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>એ જ 2400 m³ હોલને 1.0 s પર લાવવા કેટલું કુલ શોષણ જોઈએ?</p><h4>પગલાવાર ઉકેલ</h4><p>A = 0.161 V/T</p><p>= 0.161 × 2400/1.0</p><p>= 386 m² સેબાઇન, તેથી 146 m² ઉમેરવું પડે</p><h4>જવાબ</h4><p><b>386 m² સેબાઇન</b></p>"}, "answer": {"en": "386 m² sabine", "gu": "386 m² સેબાઇન"}}, {"id": "u5n09", "unit": 5, "h": {"en": "Average absorption coefficient of a room.", "gu": "ઓરડાનો સરેરાશ શોષણ ગુણાંક."}, "q": {"en": "A room of total surface 500 m² has a total absorption of 75 m² sabine. Find the average absorption coefficient and the reverberation time if V = 1500 m³.", "gu": "500 m² કુલ સપાટીવાળા ઓરડામાં કુલ શોષણ 75 m² સેબાઇન છે. સરેરાશ શોષણ ગુણાંક અને, V = 1500 m³ હોય તો, પ્રતિધ્વનિ સમય શોષો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A room of total surface 500 m² has a total absorption of 75 m² sabine. Find the average absorption coefficient and the reverberation time if V = 1500 m³.</p><h4>Step-by-step solution</h4><p>α = A/S = 75/500 = 0.15</p><p>T = 0.161 × 1500/75</p><p>= 3.22 s</p><h4>Answer</h4><p><b>α = 0.15 and T = 3.22 s</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>500 m² કુલ સપાટીવાળા ઓરડામાં કુલ શોષણ 75 m² સેબાઇન છે. સરેરાશ શોષણ ગુણાંક અને, V = 1500 m³ હોય તો, પ્રતિધ્વનિ સમય શોષો.</p><h4>પગલાવાર ઉકેલ</h4><p>α = A/S = 75/500 = 0.15</p><p>T = 0.161 × 1500/75</p><p>= 3.22 s</p><h4>જવાબ</h4><p><b>α = 0.15 અને T = 3.22 s</b></p>"}, "answer": {"en": "α = 0.15 and T = 3.22 s", "gu": "α = 0.15 અને T = 3.22 s"}}, {"id": "u5n10", "unit": 5, "h": {"en": "Distance between nodes of a stationary wave.", "gu": "સ્થિર તરંગના નિસ્પંદ વચ્ચેનું અંતર."}, "q": {"en": "A stationary wave is formed from waves of wavelength 0.5 m. Find the distance between two consecutive nodes and between a node and the next antinode.", "gu": "0.5 m તરંગલંબાઈવાળા તરંગોથી સ્થિર તરંગ બને છે. બે ક્રમિક નિસ્પંદ વચ્ચેનું અને નિસ્પંદ તથા પ્રસ્પંદ વચ્ચેનું અંતર શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A stationary wave is formed from waves of wavelength 0.5 m. Find the distance between two consecutive nodes and between a node and the next antinode.</p><h4>Step-by-step solution</h4><p>Node to node = λ/2 = 0.25 m</p><p>Node to antinode = λ/4</p><p>= 0.125 m</p><h4>Answer</h4><p><b>0.25 m and 0.125 m</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>0.5 m તરંગલંબાઈવાળા તરંગોથી સ્થિર તરંગ બને છે. બે ક્રમિક નિસ્પંદ વચ્ચેનું અને નિસ્પંદ તથા પ્રસ્પંદ વચ્ચેનું અંતર શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>નિસ્પંદ થી નિસ્પંદ = λ/2 = 0.25 m</p><p>નિસ્પંદ થી પ્રસ્પંદ = λ/4</p><p>= 0.125 m</p><h4>જવાબ</h4><p><b>0.25 m અને 0.125 m</b></p>"}, "answer": {"en": "0.25 m and 0.125 m", "gu": "0.25 m અને 0.125 m"}}, {"id": "u5n11", "unit": 5, "h": {"en": "Fundamental frequency of a stretched string.", "gu": "ખેંચાયેલી દોરીની પાયાની આવૃત્તિ."}, "q": {"en": "A string 0.75 m long fixed at both ends carries a wave at 300 m/s. Find its fundamental frequency.", "gu": "બંને છેડેથી બંધ 0.75 m લાંબી દોરીમાં તરંગનો વેગ 300 m/s છે. તેની પાયાની આવૃત્તિ શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A string 0.75 m long fixed at both ends carries a wave at 300 m/s. Find its fundamental frequency.</p><h4>Step-by-step solution</h4><p>For the fundamental, λ = 2L = 1.5 m</p><p>f = v/λ = 300/1.5</p><p>= 200 Hz</p><h4>Answer</h4><p><b>200 Hz</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>બંને છેડેથી બંધ 0.75 m લાંબી દોરીમાં તરંગનો વેગ 300 m/s છે. તેની પાયાની આવૃત્તિ શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>પાયાની રીત માટે λ = 2L = 1.5 m</p><p>f = v/λ = 300/1.5</p><p>= 200 Hz</p><h4>જવાબ</h4><p><b>200 Hz</b></p>"}, "answer": {"en": "200 Hz", "gu": "200 Hz"}}, {"id": "u5n12", "unit": 5, "h": {"en": "Wavelength of 40 kHz ultrasound in air and in water.", "gu": "હવામાં અને પાણીમાં 40 kHz અલ્ટ્રાસાઉન્ડની તરંગલંબાઈ."}, "q": {"en": "Find the wavelength of 40 kHz ultrasound in air (343 m/s) and in water (1480 m/s).", "gu": "હવામાં (343 m/s) અને પાણીમાં (1480 m/s) 40 kHz અલ્ટ્રાસાઉન્ડની તરંગલંબાઈ શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>Find the wavelength of 40 kHz ultrasound in air (343 m/s) and in water (1480 m/s).</p><h4>Step-by-step solution</h4><p>Air: λ = 343/40 000 = 8.6 × 10⁻³ m</p><p>Water: λ = 1480/40 000</p><p>= 3.7 × 10⁻² m = 3.7 cm</p><h4>Answer</h4><p><b>8.6 mm in air, 3.7 cm in water</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>હવામાં (343 m/s) અને પાણીમાં (1480 m/s) 40 kHz અલ્ટ્રાસાઉન્ડની તરંગલંબાઈ શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>હવા: λ = 343/40 000 = 8.6 × 10⁻³ m</p><p>પાણી: λ = 1480/40 000</p><p>= 3.7 × 10⁻² m = 3.7 cm</p><h4>જવાબ</h4><p><b>હવામાં 8.6 mm, પાણીમાં 3.7 cm</b></p>"}, "answer": {"en": "8.6 mm in air, 3.7 cm in water", "gu": "હવામાં 8.6 mm, પાણીમાં 3.7 cm"}}, {"id": "u5n13", "unit": 5, "h": {"en": "Depth of the sea by SONAR.", "gu": "સોનારથી દરિયાની ઊંડાઈ."}, "q": {"en": "A SONAR pulse returns after 0.8 s in water where sound travels at 1500 m/s. Find the depth.", "gu": "પાણીમાં ધ્વનિ 1500 m/s પર ચાલે ત્યાં સોનારનો સ્પંદ 0.8 s પછી પાછો આવે છે. ઊંડાઈ શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A SONAR pulse returns after 0.8 s in water where sound travels at 1500 m/s. Find the depth.</p><h4>Step-by-step solution</h4><p>2d = v t</p><p>d = 1500 × 0.8/2</p><p>= 600 m</p><h4>Answer</h4><p><b>600 m</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>પાણીમાં ધ્વનિ 1500 m/s પર ચાલે ત્યાં સોનારનો સ્પંદ 0.8 s પછી પાછો આવે છે. ઊંડાઈ શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>2d = v t</p><p>d = 1500 × 0.8/2</p><p>= 600 m</p><h4>જવાબ</h4><p><b>600 m</b></p>"}, "answer": {"en": "600 m", "gu": "600 m"}}, {"id": "u5n14", "unit": 5, "h": {"en": "Wavelength of 1 MHz ultrasound in steel.", "gu": "સ્ટીલમાં 1 MHz અલ્ટ્રાસાઉન્ડની તરંગલંબાઈ."}, "q": {"en": "Steel carries sound at about 5000 m/s. Find the wavelength of 1 MHz ultrasound in it, and say why short wavelengths help flaw detection.", "gu": "સ્ટીલમાં ધ્વનિ લગભગ 5000 m/s પર ચાલે. તેમાં 1 MHz અલ્ટ્રાસાઉન્ડની તરંગલંબાઈ શોધો અને ટૂંકી તરંગલંબાઈ ખામી શોધમાં કેમ મદદ કરે તે કહો."}, "a": {"en": "<h4>Given and assumptions</h4><p>Steel carries sound at about 5000 m/s. Find the wavelength of 1 MHz ultrasound in it, and say why short wavelengths help flaw detection.</p><h4>Step-by-step solution</h4><p>λ = v/f = 5000/10⁶</p><p>= 5 × 10⁻³ m = 5 mm</p><p>A flaw smaller than λ scatters weakly, so a 5 mm wave finds 2 to 3 mm defects</p><h4>Answer</h4><p><b>5 mm</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>સ્ટીલમાં ધ્વનિ લગભગ 5000 m/s પર ચાલે. તેમાં 1 MHz અલ્ટ્રાસાઉન્ડની તરંગલંબાઈ શોધો અને ટૂંકી તરંગલંબાઈ ખામી શોધમાં કેમ મદદ કરે તે કહો.</p><h4>પગલાવાર ઉકેલ</h4><p>λ = v/f = 5000/10⁶</p><p>= 5 × 10⁻³ m = 5 mm</p><p>λ થી નાની ખામી નબળી પ્રકીર્ણ કરે, તેથી 5 mm તરંગ 2 થી 3 mm ખામી શોધે</p><h4>જવાબ</h4><p><b>5 mm</b></p>"}, "answer": {"en": "5 mm", "gu": "5 mm"}}, {"id": "u5n15", "unit": 5, "h": {"en": "Band gap energy from a wavelength.", "gu": "તરંગલંબાઈ પરથી પટ્ટા અંતરની ઊર્જા."}, "q": {"en": "Light of wavelength 1.1 µm is just absorbed by silicon. Find the band gap in eV.", "gu": "1.1 µm તરંગલંબાઈનો પ્રકાશ સિલિકોનમાં લગભગ શોષાય છે. પટ્ટા અંતર eV માં શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>Light of wavelength 1.1 µm is just absorbed by silicon. Find the band gap in eV.</p><h4>Step-by-step solution</h4><p>E = hc/λ = 1240/λ(nm)</p><p>= 1240/1100</p><p>= 1.13 eV</p><h4>Answer</h4><p><b>1.13 eV</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>1.1 µm તરંગલંબાઈનો પ્રકાશ સિલિકોનમાં લગભગ શોષાય છે. પટ્ટા અંતર eV માં શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>E = hc/λ = 1240/λ(nm)</p><p>= 1240/1100</p><p>= 1.13 eV</p><h4>જવાબ</h4><p><b>1.13 eV</b></p>"}, "answer": {"en": "1.13 eV", "gu": "1.13 eV"}}, {"id": "u5n16", "unit": 5, "h": {"en": "Wavelength corresponding to a 0.7 eV gap.", "gu": "0.7 eV અંતરને અનુરૂપ તરંગલંબાઈ."}, "q": {"en": "Germanium has a band gap of 0.7 eV. Find the longest wavelength that can free an electron.", "gu": "જર્મેનિયમનું પટ્ટા અંતર 0.7 eV છે. ઇલેક્ટ્રોન મુક્ત કરી શકે તેવી સૌથી લાંબી તરંગલંબાઈ શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>Germanium has a band gap of 0.7 eV. Find the longest wavelength that can free an electron.</p><h4>Step-by-step solution</h4><p>λ = 1240/E(eV) nm</p><p>= 1240/0.7</p><p>= 1771 nm ≈ 1.77 µm (infrared)</p><h4>Answer</h4><p><b>1.77 µm</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>જર્મેનિયમનું પટ્ટા અંતર 0.7 eV છે. ઇલેક્ટ્રોન મુક્ત કરી શકે તેવી સૌથી લાંબી તરંગલંબાઈ શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>λ = 1240/E(eV) nm</p><p>= 1240/0.7</p><p>= 1771 nm ≈ 1.77 µm (ઇન્ફ્રારેડ)</p><h4>જવાબ</h4><p><b>1.77 µm</b></p>"}, "answer": {"en": "1.77 µm", "gu": "1.77 µm"}}, {"id": "u5n17", "unit": 5, "h": {"en": "Density of donor atoms at 1 ppm doping.", "gu": "1 ppm ડોપિંગ પર દાતા અણુઓની ઘનતા."}, "q": {"en": "Silicon has 5 × 10²⁸ atoms per m³. If it is doped with 1 part per million of phosphorus, find the donor density.", "gu": "સિલિકોનમાં 5 × 10²⁸ અણુ પ્રતિ m³ હોય છે. તેમાં ફોસ્ફરસનો 1 ભાગ પ્રતિ મિલિયન ઉમેરાય તો દાતા ઘનતા શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>Silicon has 5 × 10²⁸ atoms per m³. If it is doped with 1 part per million of phosphorus, find the donor density.</p><h4>Step-by-step solution</h4><p>n = 5 × 10²⁸ × 10⁻⁶</p><p>= 5 × 10²² donors per m³</p><p>That is about eight orders above the intrinsic carrier density at 300 K</p><h4>Answer</h4><p><b>5 × 10²² m⁻³</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>સિલિકોનમાં 5 × 10²⁸ અણુ પ્રતિ m³ હોય છે. તેમાં ફોસ્ફરસનો 1 ભાગ પ્રતિ મિલિયન ઉમેરાય તો દાતા ઘનતા શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>n = 5 × 10²⁸ × 10⁻⁶</p><p>= 5 × 10²² દાતા પ્રતિ m³</p><p>આ 300 K પર આંતરિક વાહક ઘનતાથી લગભગ આઠ ક્રમ ઉપર છે</p><h4>જવાબ</h4><p><b>5 × 10²² m⁻³</b></p>"}, "answer": {"en": "5 × 10²² m⁻³", "gu": "5 × 10²² m⁻³"}}, {"id": "u5n18", "unit": 5, "h": {"en": "Number of holes when n and p are compared.", "gu": "n અને p સરખાવતાં છિદ્રોની સંખ્યા."}, "q": {"en": "In an N-type sample n = 10²² m⁻³. If n p = 2.25 × 10³² m⁻⁶ at 300 K, find p.", "gu": "N પ્રકારના નમૂનામાં n = 10²² m⁻³ છે. 300 K પર n p = 2.25 × 10³² m⁻⁶ હોય તો p શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>In an N-type sample n = 10²² m⁻³. If n p = 2.25 × 10³² m⁻⁶ at 300 K, find p.</p><h4>Step-by-step solution</h4><p>p = nᵢ²/n with nᵢ² = 2.25 × 10³²</p><p>p = 2.25 × 10³²/10²²</p><p>= 2.25 × 10¹⁰ m⁻³, eleven orders smaller</p><h4>Answer</h4><p><b>2.25 × 10¹⁰ m⁻³</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>N પ્રકારના નમૂનામાં n = 10²² m⁻³ છે. 300 K પર n p = 2.25 × 10³² m⁻⁶ હોય તો p શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>p = nᵢ²/n, જ્યાં nᵢ² = 2.25 × 10³²</p><p>p = 2.25 × 10³²/10²²</p><p>= 2.25 × 10¹⁰ m⁻³, અગિયાર ક્રમ નાનું</p><h4>જવાબ</h4><p><b>2.25 × 10¹⁰ m⁻³</b></p>"}, "answer": {"en": "2.25 × 10¹⁰ m⁻³", "gu": "2.25 × 10¹⁰ m⁻³"}}, {"id": "u5n19", "unit": 5, "h": {"en": "Frequency of a stationary wave in a 0.5 m pipe closed at both ends.", "gu": "બંને છેડેથી બંધ 0.5 m નળીમાં સ્થિર તરંગની આવૃત્તિ."}, "q": {"en": "A pipe 0.5 m long closed at both ends has air at 340 m/s. Find the lowest resonant frequency.", "gu": "બંને છેડેથી બંધ 0.5 m નળીમાં હવાનો વેગ 340 m/s છે. સૌથી નીચી અનુનાદ આવૃત્તિ શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A pipe 0.5 m long closed at both ends has air at 340 m/s. Find the lowest resonant frequency.</p><h4>Step-by-step solution</h4><p>Both ends are nodes, so λ/2 = L</p><p>λ = 1.0 m</p><p>f = 340/1.0 = 340 Hz</p><h4>Answer</h4><p><b>340 Hz</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>બંને છેડેથી બંધ 0.5 m નળીમાં હવાનો વેગ 340 m/s છે. સૌથી નીચી અનુનાદ આવૃત્તિ શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>બંને છેડા નિસ્પંદ છે, તેથી λ/2 = L</p><p>λ = 1.0 m</p><p>f = 340/1.0 = 340 Hz</p><h4>જવાબ</h4><p><b>340 Hz</b></p>"}, "answer": {"en": "340 Hz", "gu": "340 Hz"}}, {"id": "u5n20", "unit": 5, "h": {"en": "Energy of a photon of 500 nm light.", "gu": "500 nm પ્રકાશના ફોટોનની ઊર્જા."}, "q": {"en": "Find the energy in eV of a photon of wavelength 500 nm, and compare it with a 1.1 eV gap.", "gu": "500 nm તરંગલંબાઈના ફોટોનની ઊર્જા eV માં શોધો અને 1.1 eV અંતર સાથે સરખાવો."}, "a": {"en": "<h4>Given and assumptions</h4><p>Find the energy in eV of a photon of wavelength 500 nm, and compare it with a 1.1 eV gap.</p><h4>Step-by-step solution</h4><p>E = 1240/500</p><p>= 2.48 eV</p><p>2.48 eV > 1.1 eV, so visible light can free electrons in silicon</p><h4>Answer</h4><p><b>2.48 eV</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>500 nm તરંગલંબાઈના ફોટોનની ઊર્જા eV માં શોધો અને 1.1 eV અંતર સાથે સરખાવો.</p><h4>પગલાવાર ઉકેલ</h4><p>E = 1240/500</p><p>= 2.48 eV</p><p>2.48 eV > 1.1 eV, તેથી દૃશ્ય પ્રકાશ સિલિકોનમાં ઇલેક્ટ્રોન મુક્ત કરી શકે</p><h4>જવાબ</h4><p><b>2.48 eV</b></p>"}, "answer": {"en": "2.48 eV", "gu": "2.48 eV"}}], "viva": [{"title": {"en": "Waves", "gu": "તરંગો"}, "items": [{"q": {"en": "Define a wave and say what travels in it.", "gu": "તરંગની વ્યાખ્યા આપો અને તેમાં શું ચાલે તે કહો."}, "a": {"en": "A wave is a disturbance that carries energy and momentum from one point to another without transporting matter; the particles of the medium only oscillate about their mean positions.", "gu": "તરંગ એ વિક્ષોભ છે જે પદાર્થ લઈ જ્યા વગર ઊર્જા અને વેગમાન એક બિંદુથી બીજા બિંદુ સુધી પહોંચાડે; માધ્યમના કણો ફક્ત પોતાના સ્થાનની આસપાસ દોલિત થાય."}}, {"q": {"en": "Distinguish longitudinal from transverse waves with one example each.", "gu": "સંગત અને અનુપ્રસ્થ તરંગમાં દરેકનું એક ઉદાહરણ આપીને ભેદ બતાવો."}, "a": {"en": "In a longitudinal wave the particles move along the direction of travel, as in sound in air; in a transverse wave they move perpendicular to it, as on a stretched string or in light.", "gu": "સંગત તરંગમાં કણો ગતિની દિશામાં જ ખસે, જેમ હવામાં ધ્વનિ; અનુપ્રસ્થ તરંગમાં તેઓ તેની લંબરૂપે ખસે, જેમ તંગ દોરી પર કે પ્રકાશમાં."}}, {"q": {"en": "What happens to frequency and wavelength when sound enters water?", "gu": "ધ્વનિ પાણીમાં પ્રવેશે ત્યારે આવૃત્તિ અને તરંગલંબાઈનું શું થાય?"}, "a": {"en": "Frequency stays the same because the source fixes it; speed rises from about 343 to 1480 m/s, so the wavelength rises in the same proportion to keep v = f λ.", "gu": "આવૃત્તિ એ જ રહે કારણ કે સ્રોત તે નક્કી કરે; વેગ 343 થી 1480 m/s સુધી વધે, તેથી v = f λ જાળવવા તરંગલંબાઈ એ જ પ્રમાણમાં વધે."}}, {"q": {"en": "Write the relation between wave velocity, frequency and wavelength.", "gu": "તરંગ વેગ, આવૃત્તિ અને તરંગલંબાઈ વચ્ચેનો સંબંધ લખો."}, "a": {"en": "v = f λ; a 256 Hz fork in air has λ = 343/256 = 1.34 m.", "gu": "v = f λ; હવામાં 256 Hz ના સ્વરકાંટા માટે λ = 343/256 = 1.34 m."}}]}, {"title": {"en": "Interference and acoustics", "gu": "વ્યતીકરણ અને ધ્વનિશાસ્ત્ર"}, "items": [{"q": {"en": "State the principle of superposition.", "gu": "અધ્યારોપણનો સિદ્ધાંત જણાવો."}, "a": {"en": "When two or more waves arrive at a point, the resultant displacement is the vector sum of their individual displacements.", "gu": "બે કે વધુ તરંગો એક બિંદુએ પહોંચે ત્યારે પરિણામી સ્થાનાંતરણ તેમના અલગ સ્થાનાંતરણનો સદિશ સરવાળો હોય."}}, {"q": {"en": "Give the conditions for a steady interference pattern.", "gu": "સ્થિર વ્યતીકરણ આકૃતિની શરતો જણાવો."}, "a": {"en": "The sources must be coherent with the same frequency and a constant phase difference, of comparable amplitude, and close together compared with their distance from the screen.", "gu": "સ્રોત સહસંબંધી હોવા જોઈએ, સમાન આવૃત્તિ અને અચળ કળા તફાવત સાથે, લગભગ સમાન કંપવિસ્તારવાળા, અને પડદાથી તેમના અંતરની સરખામણીમાં નજીક હોવા જોઈએ."}}, {"q": {"en": "What are nodes and antinodes?", "gu": "નિસ્પંદ અને પ્રસ્પંદ શું છે?"}, "a": {"en": "Points of zero amplitude in a stationary wave are nodes and points of maximum amplitude are antinodes; they are λ/4 apart, with λ/2 between successive nodes.", "gu": "સ્થિર તરંગમાં શૂન્ય કંપવિસ્તારવાળાં બિંદુ નિસ્પંદ અને મહત્તમ કંપવિસ્તારવાળાં પ્રસ્પંદ છે; તેઓ λ/4 દૂર હોય, અને ક્રમિક નિસ્પંદ વચ્ચે λ/2."}}, {"q": {"en": "Define reverberation time and give a good value for a lecture hall.", "gu": "પ્રતિધ્વનિ સમયની વ્યાખ્યા આપો અને વ્યાખ્યાન હોલ માટે યોગ્ય મૂલ્ય આપો."}, "a": {"en": "It is the time for the sound level to fall by 60 dB after the source stops; about 1 s suits speech, while 2 s suits music.", "gu": "સ્રોત બંધ થયા પછી ધ્વનિનું સ્તર 60 dB ઘટવાનો સમય; બોલાયેલા શબ્દ માટે લગભગ 1 s અને સંગીત માટે 2 s યોગ્ય."}}, {"q": {"en": "What is the absorption coefficient of an open window and why is it 1?", "gu": "ખુલ્લી બારીનો શોષણ ગુણાંક શું છે અને તે 1 કેમ છે?"}, "a": {"en": "Unity, because the window lets all the incident sound energy pass out of the room without reflection, so nothing comes back.", "gu": "એક, કારણ કે બારી પર પડતી બધી ધ્વનિ ઊર્જા પરાવર્તન વગર ઓરડાની બહાર જવા દે, તેથી પાછું કંઈ આવતું નથી."}}, {"q": {"en": "State Sabine's formula and name its symbols.", "gu": "સેબાઇનનું સૂત્ર જણાવો અને સંજ્ઞાઓનાં નામ આપો."}, "a": {"en": "T = 0.161 V/A, with T the reverberation time in seconds, V the volume in m³ and A the total absorption in m² sabine.", "gu": "T = 0.161 V/A, જ્યાં T પ્રતિધ્વનિ સમય સેકન્ડમાં, V ઘનફળ m³ માં અને A કુલ શોષણ m² સેબાઇનમાં."}}]}, {"title": {"en": "Ultrasonics and semiconductors", "gu": "અલ્ટ્રાસોનિક્સ અને અર્ધવાહક"}, "items": [{"q": {"en": "What are ultrasonic waves and how are they produced?", "gu": "અલ્ટ્રાસોનિક તરંગો શું છે અને તે કેવી રીતે ઉત્પન્ન થાય?"}, "a": {"en": "Sound above 20 kHz; they are produced by the piezoelectric effect in quartz or by magnetostriction in nickel, driven by a high-frequency oscillator.", "gu": "20 kHz થી ઉપરનો ધ્વનિ; તે ક્વાર્ટ્ઝમાં પીઝોઇલેક્ટ્રિક અસરથી કે નિકલમાં મેગ્નેટોસ્ટ્રિક્શનથી ઉત્પન્ન થાય, જે ઉચ્ચ-આવૃત્તિના દોલકથી ચાલે."}}, {"q": {"en": "Give three applications of ultrasound in engineering.", "gu": "ઇજનેરીમાં અલ્ટ્રાસાઉન્ડના ત્રણ ઉપયોગો આપો."}, "a": {"en": "Flaw detection in castings and welds, thickness gauging from one side only, and ultrasonic welding or cleaning of delicate parts.", "gu": "કાસ્ટિંગ અને વેલ્ડમાં ખામી શોધ, એક જ બાજુથી જાડાઈ માપન, અને નાજુક પાર્ટનું અલ્ટ્રાસોનિક વેલ્ડિંગ કે સફાઈ."}}, {"q": {"en": "How does a SONAR measure depth?", "gu": "સોનાર ઊંડાઈ કેવી રીતે માપે?"}, "a": {"en": "It sends a pulse, times the echo, and halves the path: d = v t/2, with v about 1500 m/s in sea water.", "gu": "તે સ્પંદ મોકલે, પડઘાનો સમય માપે અને રસ્તાનો અડધો ભાગ લે: d = v t/2, જ્યાં દરિયાના પાણીમાં v લગભગ 1500 m/s."}}, {"q": {"en": "On what basis are solids classed as conductors, semiconductors and insulators?", "gu": "ઘનને વાહક, અર્ધવાહક અને અવાહકમાં કયા આધારે વહેંચાય?"}, "a": {"en": "On the band gap: no gap for a conductor, roughly 0.1 to 3 eV for a semiconductor and more than about 3 eV for an insulator.", "gu": "પટ્ટા અંતર પર: વાહકમાં અંતર નહીં, અર્ધવાહકમાં લગભગ 0.1 થી 3 eV અને અવાહકમાં લગભગ 3 eV થી વધુ."}}, {"q": {"en": "What is doping and why is it done?", "gu": "ડોપિંગ શું છે અને તે કેમ કરાય?"}, "a": {"en": "Adding a controlled trace of a pentavalent or trivalent impurity to pure silicon so that its conductivity rises by several orders of magnitude and can be set to a design value.", "gu": "શુદ્ધ સિલિકોનમાં પંચસંયોજક કે ત્રિસંયોજક અશુદ્ધિનો નિયંત્રિત થોડો ભાગ ઉમેરવો જેથી તેની વાહકતા ઘણા ક્રમ વધે અને રચનાના મૂલ્ય પર ગોઠવી શકાય."}}, {"q": {"en": "In a P-type crystal, what is the majority carrier and is the crystal charged?", "gu": "P પ્રકારના સ્ફટિકમાં બહુમતી વાહક કયો છે અને સ્ફટિક ભારિત છે?"}, "a": {"en": "Holes are the majority carrier, and the crystal is electrically neutral because the acceptor ions balance the extra holes.", "gu": "છિદ્ર બહુમતી વાહક છે, અને સ્ફટિક વિદ્યુતદૃષ્ટિએ તટસ્થ છે કારણ કે ગ્રાહક આયનો વધારાનાં છિદ્રોને સંતુલિત કરે."}}]}], "exam_questions": [{"q": {"en": "Practice: Define a wave and distinguish longitudinal from transverse waves.", "gu": "સરાવ: તરંગની વ્યાખ્યા આપો અને સંગત તથા અનુપ્રસ્થ તરંગમાં ભેદ આપો."}, "marks": 3}, {"q": {"en": "Practice: Write the relation v = f λ and explain what changes when sound enters water.", "gu": "સરાવ: v = f λ સંબંધ લખો અને ધ્વનિ પાણીમાં જાય ત્યારે શું બદલાય તે સમજાવો."}, "marks": 3}, {"q": {"en": "Practice: State the principle of superposition and the conditions for steady interference.", "gu": "સરાવ: અધ્યારોપણનો સિદ્ધાંત અને સ્થિર વ્યતીકરણની શરતો જણાવો."}, "marks": 4}, {"q": {"en": "Practice: Define reverberation time, echo and absorption coefficient.", "gu": "સરાવ: પ્રતિધ્વનિ સમય, પડઘો અને શોષણ ગુણાંકની વ્યાખ્યા આપો."}, "marks": 3}, {"q": {"en": "Practice: State Sabine's formula and solve one numerical with it.", "gu": "સરાવ: સેબાઇનનું સૂત્ર જણાવો અને તેનો એક દાખલો ઉકેલો."}, "marks": 4}, {"q": {"en": "Practice: How is reverberation controlled in a hall? Give four measures.", "gu": "સરાવ: હોલમાં પ્રતિધ્વનિ કેવી રીતે નિયંત્રિત થાય? ચાર ઉપાય આપો."}, "marks": 4}, {"q": {"en": "Practice: What is the difference between ultrasonic and infrasonic waves? Give two uses of ultrasound.", "gu": "સરાવ: અલ્ટ્રાસોનિક અને ઇન્ફ્રાસોનિક તરંગોમાં શું ફરક છે? અલ્ટ્રાસાઉન્ડના બે ઉપયોગ આપો."}, "marks": 3}, {"q": {"en": "Practice: Explain conductors, semiconductors and insulators on the basis of the band gap.", "gu": "સરાવ: પટ્ટા અંતરના આધારે વાહક, અર્ધવાહક અને અવાહક સમજાવો."}, "marks": 4}, {"q": {"en": "Practice: What is doping? Distinguish N-type from P-type material.", "gu": "સરાવ: ડોપિંગ શું છે? N પ્રકાર અને P પ્રકારના દ્રવ્યમાં ભેદ આપો."}, "marks": 4}, {"q": {"en": "Practice: How are ultrasonic waves produced? Explain piezoelectric and magnetostriction methods.", "gu": "સરાવ: અલ્ટ્રાસોનિક તરંગો કેવી રીતે ઉત્પન્ન થાય? પીઝોઇલેક્ટ્રિક અને મેગ્નેટોસ્ટ્રિક્શન રીતો સમજાવો."}, "marks": 4}, {"q": {"en": "Practice: A hall of 2400 m³ has a reverberation time of 1.6 s. Find the absorption and the value needed for 1.0 s.", "gu": "સરાવ: 2400 m³ ના હોલનો પ્રતિધ્વનિ સમય 1.6 s છે. શોષણ શોધો અને 1.0 s માટે જરૂરી મૂલ્ય."}, "marks": 4}, {"q": {"en": "Practice: Ultrasound of 40 kHz is used in water. Find its wavelength and the depth if the echo returns in 0.4 s.", "gu": "સરાવ: પાણીમાં 40 kHz અલ્ટ્રાસાઉન્ડ વપરાય છે. તેની તરંગલંબાઈ અને 0.4 s માં પડઘો આવે તો ઊંડાઈ શોધો."}, "marks": 4}, {"q": {"en": "Practice: Silicon has a band gap of 1.1 eV. Find the maximum wavelength that can create an electron–hole pair.", "gu": "સરાવ: સિલિકોનનું પટ્ટા અંતર 1.1 eV છે. ઇલેક્ટ્રોન-છિદ્ર જોડ બનાવી શકે તેવી મહત્તમ તરંગલંબાઈ શોધો."}, "marks": 3}, {"q": {"en": "Practice: Why is a semiconductor called a material with a negative temperature coefficient?", "gu": "સરાવ: અર્ધવાહકને ઋણ તાપમાન ગુણાંકવાળો પદાર્થ કેમ કહેવાય?"}, "marks": 3}], "learning_outcomes": [{"en": "5.a Explain wave and wave motion with an example.", "gu": "5.a તરંગ અને તરંગ ગતિ ઉદાહરણ સાથે સમજાવવી."}, {"en": "5.b Distinguish between longitudinal and transverse waves.", "gu": "5.b સંગત અને અનુપ્રસ્થ તરંગો વચ્ચેનો ભેદ સમજાવવો."}, {"en": "5.c Explain frequency, periodic time, amplitude, wavelength and wave velocity.", "gu": "5.c આવૃત્તિ, આવર્તકાળ, કંપવિસ્તાર, તરંગલંબાઈ અને તરંગ વેગ સમજાવવા."}, {"en": "5.d Explain superposition and interference.", "gu": "5.d અધ્યારોપણ અને વ્યતિકરણ સમજાવવા."}, {"en": "5.e Explain reverberation, echo, noise and the absorption coefficient.", "gu": "5.e પ્રતિધ્વનિ, પડઘો, ઘોંઘાટ અને શોષણ ગુણાંક સમજાવવા."}, {"en": "5.f Apply Sabine's formula for reverberation time.", "gu": "5.f પ્રતિધ્વનિ સમય માટે સેબાઇનનું સૂત્ર લાગુ કરવું."}, {"en": "5.g Explain ultrasonic waves and their properties.", "gu": "5.g અલ્ટ્રાસોનિક તરંગો અને ગુણધર્મો સમજાવવા."}, {"en": "5.h List engineering and medical applications of ultrasonics.", "gu": "5.h અલ્ટ્રાસોનિકના ઇજનેરી અને તબીબી ઉપયોગો જણાવવા."}, {"en": "5.i Classify conductors, semiconductors and insulators by energy band gap.", "gu": "5.i ઊર્જા પટ્ટી અંતર દ્વારા વાહક, અર્ધવાહક અને અવાહકનું વર્ગીકરણ કરવું."}, {"en": "5.j Apply impurity doping to semiconductors.", "gu": "5.j અર્ધવાહકમાં અશુદ્ધિ ડોપિંગ લાગુ કરવું."}], "course_outcomes": ["CO5"], "practical_numbers": [11, 12], "content_kind": "theory", "lesson_count": 8, "answered_practice_count": 14, "assessment_note": {"en": "Official course: theory ESE 70 + PA 30 and practical PA 20 + ESE 30 = 150 marks, 4 credits, 45 teaching hours; this unit carries 24 % weightage, 10 of the 45 hours and 17 of the 70 theory marks (the PDF prints weightage only, so the marks are split by weightage). Practice marks 3/4/5 are suggested revision sizes, not GTU allocations. Model answers are in Notes section 5.", "gu": "અધિકૃત કોર્સ: થિયરી ESE 70 + PA 30 અને પ્રેક્ટિકલ PA 20 + ESE 30 = 150 માર્ક્સ, 4 ક્રેડિટ, 45 શિક્ષણ કલાક; આ યુનિટનું વેઇટેજ 24 %, 45માંથી 10 કલાક અને 70 થિયરી માર્ક્સમાંથી 17 માર્ક્સ (PDFમાં ફક્ત વેઇટેજ છે, તેથી માર્ક્સ વેઇટેજ પ્રમાણે વહેંચ્યા છે). સરાવના 3/4/5 માર્ક્સ સૂચિત પુનરાવર્તન માપ છે, GTU ફાળવણી નહીં. આદર્શ જવાબો નોંધ વિભાગ 5માં છે."}, "question_provenance": "Original answered revision questions; not official past papers", "question_marks_are_suggested": true, "sources": [{"title": "GTU DI01000121 Applied Physics syllabus (uploaded PDF, w.e.f. 2024-25)", "url": "https://syllabus.gtu.ac.in/"}, {"title": "NCERT Physics Class XI, Part II - Waves, and Class XII - Semiconductor Electronics", "url": "https://syllabus.gtu.ac.in/"}, {"title": "H. C. Verma - Concepts of Physics, Vol. I chapter 15 and Vol. II chapter 45", "url": "https://syllabus.gtu.ac.in/"}, {"title": "M. N. Avadhanulu - A Textbook of Engineering Physics, acoustics and semiconductor chapters", "url": "https://syllabus.gtu.ac.in/"}, {"title": "IS 2526 (acoustics) and manufacturer data for ultrasonic and diode devices", "url": "https://syllabus.gtu.ac.in/"}]};
