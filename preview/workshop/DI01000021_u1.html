<style>

.kw{color:#C792EA;font-weight:700}.ty{color:#82AAFF}.st{color:#C3E88D}.cm{color:#8E9AAF;font-style:italic}.pp{color:#F78C6C}.nu{color:#F9C46B}.fn{color:#FFCB6B}

<script>
const U = {"subject": "DI01000021", "unit": 1, "format": "notes", "title": {"en": "Determinant and Function"}, "hours": 9, "weightage": 23, "official": true, "languages": ["en"], "tabs": ["notes", "diagrams", "equations", "numericals", "viva", "exam"], "intro_text": {"en": "Unit 1 of Mathematics-I: determinants of the second and third order evaluated by minors and cofactors (no properties, exactly as the syllabus asks), their use in Cramer's rule, the area of a triangle and the collinearity test; then the function as a one-output machine with domain, codomain, range, standard graphs, even/odd and piecewise rules; then the logarithm as a function, its domain and graph, the laws of logarithm and their numericals. Twenty-five fully solved numericals, every one linked to a card."}, "notes": [{"title": {"en": "1. Determinant of the Second Order"}, "items": [{"h": {"en": "1.1 What a determinant is"}, "body": {"en": "<h4>Definition</h4><p>A <b>determinant</b> is a single number calculated from a square array of numbers. For a second-order determinant the array has two rows and two columns:</p><p><b>|a b; c d| = ad − bc</b> - the product of the main diagonal minus the product of the other diagonal.</p><h4>Notation that matters</h4><ul><li>Vertical bars mean <i>value</i>: |3 5; 2 4| = 2. Brackets [3 5; 2 4] mean a <i>matrix</i>, which is an array, not a number.</li><li>The determinant of matrix A is written |A| or det(A).</li><li>Read it as <b>[a b; c d]</b> in the same layout as the array: a and d are on the main diagonal (top-left to bottom-right).</li></ul><h4>Worked example</h4><p>|3 5; 2 4| = (3)(4) − (5)(2) = 12 − 10 = <b>2</b>.</p><details class=\"self-check\"><summary>Is |2 4; 1 2| zero?</summary><p>Yes: (2)(2) − (4)(1) = 0. Rows (and columns) are proportional, which is exactly what a zero determinant signals.</p></details>"}, "diagram": "m1_det2", "examples": ["m1n1", "m1n2"], "syllabus_item": "1.1"}, {"h": {"en": "1.2 Second-order determinants with a variable, and what a zero says"}, "body": {"en": "<h4>Definition</h4><p>The entries may be expressions, so the determinant becomes an equation in x. Solve it exactly as a quadratic once the expansion is done.</p><h4>Worked example</h4><p>Find x if |x 2; 3 x| = 10. Expand: x·x − 2·3 = 10 → x² − 6 = 10 → x² = 16 → <b>x = 4 or x = −4</b>.</p><h4>Reading a zero determinant</h4><table><tr><th>Determinant</th><th>Meaning for two equations in x and y</th></tr><tr><td>D ≠ 0</td><td>Unique solution - the two lines cross once</td></tr><tr><td>D = 0 but Dx or Dy ≠ 0</td><td>No solution - the lines are parallel</td></tr><tr><td>D = 0 and Dx = Dy = 0</td><td>Infinitely many solutions - the same line twice</td></tr></table><h4>Common mistake / conditions</h4><p>Do not write x² = 16 and answer x = 4 only. A squared equation has two roots; in a geometry question you may reject the negative one, but you must say so.</p>"}, "examples": ["m1n3"], "syllabus_item": "1.1"}]}, {"title": {"en": "2. Determinant of the Third Order"}, "items": [{"h": {"en": "2.1 Expansion along the first row"}, "body": {"en": "<h4>Definition</h4><p>A third-order determinant is expanded into three second-order determinants, with alternating signs <b>+ − +</b> along the first row:</p><p><b>|a₁ b₁ c₁; a₂ b₂ c₂; a₃ b₃ c₃| = a₁(b₂c₃ − b₃c₂) − b₁(a₂c₃ − a₃c₂) + c₁(a₂b₃ − a₃b₂)</b></p><h4>The three steps</h4><ol><li><b>Cover</b> the row and column of the entry you are multiplying.</li><li><b>Write</b> the 2×2 determinant that is left (this is the <i>minor</i>).</li><li><b>Attach</b> the sign from the pattern + − + / − + − / + − + and add the three terms.</li></ol><h4>Worked example</h4><p>|1 2 3; 4 5 6; 7 8 10| = 1(5×10 − 6×8) − 2(4×10 − 6×7) + 3(4×8 − 5×7) = 1(2) − 2(−2) + 3(−3) = 2 + 4 − 9 = <b>−3</b>.</p><h4>Common mistake / conditions</h4><p>The signs belong to the <i>position</i>, not to the entry. If b₁ is already negative, its term is −(−3)(minor) = +3(minor). Write the sign in brackets before substituting.</p>"}, "diagram": "m1_det3", "examples": ["m1n4", "m1n5"], "syllabus_item": "1.1"}, {"h": {"en": "2.2 Minors and cofactors"}, "body": {"en": "<h4>Definition</h4><p>The <b>minor</b> Mᵢⱼ of an entry is the 2×2 determinant left after deleting row i and column j. The <b>cofactor</b> is the same number with the positional sign:</p><p><b>Cᵢⱼ = (−1)^(i+j) Mᵢⱼ</b></p><h4>The sign board</h4><table><tr><th></th><th>column 1</th><th>column 2</th><th>column 3</th></tr><tr><td>row 1</td><td>+</td><td>−</td><td>+</td></tr><tr><td>row 2</td><td>−</td><td>+</td><td>−</td></tr><tr><td>row 3</td><td>+</td><td>−</td><td>+</td></tr></table><h4>Worked idea</h4><p>For A = [2 3 1; 4 0 5; 1 2 3], the minor of the 4 (row 2, column 1) is |3 1; 2 3| = 9 − 2 = 7, and its cofactor is −7 because position (2, 1) carries a minus.</p><h4>Why both names exist</h4><p>The determinant equals the sum a₁₁C₁₁ + a₁₂C₁₂ + a₁₃C₁₃ along <i>any</i> row or column. Cofactors are also the raw material of the adjoint and the inverse in later semesters.</p>"}, "examples": ["m1n6"], "syllabus_item": "1.1"}, {"h": {"en": "2.3 Choosing the easiest row, and the Sarrus shortcut"}, "body": {"en": "<h4>Definition</h4><p>Because any row or column may be used, choose the one with the most zeros: every zero kills a whole 2×2 determinant and saves arithmetic.</p><h4>Worked example</h4><p>|2 −1 3; 0 4 −2; 5 1 0| - the second row has a zero, but the third column has one too. Expanding along the third column: 3(0×1 − 4×5) − (−2)(2×1 − (−1)×5) + 0 = −60 + 2(7) = <b>−46</b>.</p><h4>Sarrus rule (third order only)</h4><p>Copy the first two columns to the right and add the three down-right diagonals, then subtract the three down-left diagonals. It is a check, not a substitute for the expansion: for the matrix above Sarrus gives 0 + (−10) + 0 − (60 + 0 + 0) = −46 ✓.</p><h4>Conditions</h4><p>Sarrus works only for 3×3. Never try it on a 4×4 - the diagonal trick does not generalise.</p>"}, "diagram": "m1_det3", "examples": ["m1n5"], "syllabus_item": "1.1"}]}, {"title": {"en": "3. Applications of Determinants"}, "items": [{"h": {"en": "3.1 Cramer's rule for two equations"}, "body": {"en": "<h4>Definition</h4><p>For a₁x + b₁y = c₁ and a₂x + b₂y = c₂, build three determinants:</p><p><b>D = |a₁ b₁; a₂ b₂|,  Dx = |c₁ b₁; c₂ b₂|,  Dy = |a₁ c₁; a₂ c₂|</b></p><p>then <b>x = Dx/D</b> and <b>y = Dy/D</b>, provided D ≠ 0.</p><h4>Worked example</h4><p>2x + 3y = 12, x − y = 1. D = (2)(−1) − (3)(1) = −5; Dx = (12)(−1) − (3)(1) = −15; Dy = (2)(1) − (12)(1) = −10. So x = 3, y = 2.</p><h4>Common mistake / conditions</h4><p>The column that is replaced is the one of the variable you are finding: for Dx replace the <b>x-column</b> (the first) by the constants. Swapping the wrong column gives the other variable's value and is the most common error in this question.</p>"}, "diagram": "m1_cramer", "examples": ["m1n7"], "syllabus_item": "1.1"}, {"h": {"en": "3.2 Cramer's rule for three equations"}, "body": {"en": "<h4>Definition</h4><p>Three equations in x, y, z need four determinants: D, Dx, Dy, Dz, each third order. Replace one column of the coefficient determinant by the constants each time.</p><h4>Worked example</h4><p>x + y + z = 6, x − y + z = 2, 2x + y − z = 1. Expanding the coefficient determinant by the first row gives D = 6; then Dx = 6, Dy = 12, Dz = 18, so x = 1, y = 2, z = 3 - which checks in all three equations.</p><h4>Practical advice</h4><p>Cramer is long for 3×3. Use it when the question <i>asks</i> for determinants, and use elimination when it only asks for the solution. Either way the check is the same: substitute all three values into all three equations.</p>"}, "examples": ["m1n8"], "syllabus_item": "1.1"}, {"h": {"en": "3.3 Area of a triangle and the collinearity test"}, "body": {"en": "<h4>Formula</h4><p>For vertices (x₁, y₁), (x₂, y₂), (x₃, y₃):</p><p><b>Area = ½ |x₁(y₂ − y₃) + x₂(y₃ − y₁) + x₃(y₁ − y₂)|</b>, equal to ½ |det| of the 3×3 determinant with a final column of 1s.</p><h4>Worked example</h4><p>(1, 2), (4, 6), (7, 2): ½|1(6 − 2) + 4(2 − 2) + 7(2 − 6)| = ½|4 + 0 − 28| = <b>12 square units</b>.</p><h4>Collinearity</h4><p>If the three points lie on one line the triangle has no area, so the determinant is zero. That single test answers every \"show that the points are collinear\" question - and its converse is a fast check of your own answer.</p>"}, "examples": ["m1n9", "m1n10"], "syllabus_item": "1.1"}]}, {"title": {"en": "4. Function and Simple Examples"}, "items": [{"h": {"en": "4.1 Definition, notation, domain, codomain and range"}, "body": {"en": "<h4>Definition</h4><p>A <b>function</b> f from set A to set B assigns <i>exactly one</i> element of B to every element of A. Written <b>f : A → B, y = f(x)</b>.</p><h4>The four words</h4><table><tr><th>Word</th><th>Meaning</th><th>Example for f(x) = x², A = {−2, −1, 0, 1, 2}</th></tr><tr><td>Domain</td><td>Everything you may put in</td><td>{−2, −1, 0, 1, 2} (or all real x)</td></tr><tr><td>Codomain</td><td>The set you are mapping into</td><td>the real numbers</td></tr><tr><td>Range</td><td>What actually comes out</td><td>{0, 1, 4}</td></tr><tr><td>Image</td><td>Output for one particular input</td><td>f(2) = 4</td></tr></table><h4>One input, one output</h4><p>The rule \"one value in, exactly one value out\" is what makes it a function. y² = x is <i>not</i> a function of x, because x = 4 gives both y = 2 and y = −2. On a graph, a vertical line may meet a function's curve only once.</p>"}, "diagram": "m1_function", "examples": ["m1n11"], "syllabus_item": "1.2"}, {"h": {"en": "4.2 Finding the domain"}, "body": {"en": "<h4>Definition</h4><p>The domain is restricted by two things only at this level: a denominator may not be zero, and an even root may not be negative.</p><h4>Rules</h4><table><tr><th>Function</th><th>Restriction</th><th>Domain</th></tr><tr><td>1/(x − 3)</td><td>x − 3 ≠ 0</td><td>all real x except 3</td></tr><tr><td>√(x − 2)</td><td>x − 2 ≥ 0</td><td>x ≥ 2, that is [2, ∞)</td></tr><tr><td>1/√(x − 2)</td><td>x − 2 > 0</td><td>x > 2</td></tr><tr><td>log x</td><td>x > 0</td><td>(0, ∞)</td></tr><tr><td>polynomial</td><td>none</td><td>all real x</td></tr></table><h4>Common mistake / conditions</h4><p>In 1/√(x − 2) the root already forbids negatives, and the denominator forbids zero, so the endpoint 2 is excluded (<b>&gt;</b>, not ≥). One word changes the whole answer - write the condition before the interval.</p>"}, "examples": ["m1n12"], "syllabus_item": "1.2"}, {"h": {"en": "4.3 Standard functions and their graphs"}, "body": {"en": "<h4>Definition</h4><p>Five shapes cover almost every question in this unit. Knowing the shape lets you read the domain and range straight off the picture.</p><table><tr><th>Function</th><th>Rule</th><th>Shape</th><th>Range (a > 0)</th></tr><tr><td>Constant</td><td>y = c</td><td>horizontal line</td><td>{c}</td></tr><tr><td>Linear</td><td>y = mx + c</td><td>straight line</td><td>all real y</td></tr><tr><td>Quadratic</td><td>y = ax² + bx + c</td><td>parabola</td><td>y ≥ vertex value</td></tr><tr><td>Exponential</td><td>y = aˣ</td><td>always rising, asymptotic to the x-axis</td><td>y > 0</td></tr><tr><td>Logarithmic</td><td>y = logₐ x</td><td>mirror of the exponential</td><td>all real y</td></tr></table><h4>Reading a graph</h4><ol><li>Domain: project the curve onto the x-axis.</li><li>Range: project it onto the y-axis.</li><li>A hole or a vertical asymptote is a value the function never takes - exclude it.</li></ol><h4>Worked example</h4><p>For y = x² − 4x + 7, completing the square gives y = (x − 2)² + 3, so the range is <b>y ≥ 3</b> with the vertex at (2, 3).</p>"}, "diagram": "m1_graphs", "examples": ["m1n13"], "syllabus_item": "1.2"}, {"h": {"en": "4.4 Even, odd and piecewise functions"}, "body": {"en": "<h4>Definition</h4><p>A function is <b>even</b> if f(−x) = f(x) (symmetric about the y-axis) and <b>odd</b> if f(−x) = −f(x) (symmetric about the origin). A <b>piecewise</b> function uses a different rule on different parts of its domain.</p><h4>Test procedure</h4><ol><li>Replace every x by −x.</li><li>Simplify and compare with f(x) and −f(x).</li><li>Equal to f(x): even. Equal to −f(x): odd. Neither: neither - and say so.</li></ol><h4>Worked examples</h4><p>f(x) = x³ − x: f(−x) = −x³ + x = −(x³ − x) → <b>odd</b>. g(x) = x² + 1: g(−x) = x² + 1 = g(x) → <b>even</b>. h(x) = x² + x: h(−x) = x² − x, which is neither → <b>neither</b>.</p><p>For f(x) = x + 1 when x &lt; 0 and f(x) = x² when x ≥ 0: f(−2) = −1 and f(3) = 9. Choose the rule by the input, never by the answer.</p>"}, "examples": ["m1n14", "m1n15"], "syllabus_item": "1.2"}]}, {"title": {"en": "5. Logarithm as a Function"}, "items": [{"h": {"en": "5.1 Definition: the inverse of the exponential"}, "body": {"en": "<h4>Definition</h4><p><b>y = logₐ x  ⇔  aʸ = x</b>, where a &gt; 0, a ≠ 1 and x &gt; 0. The logarithm answers the question \"to what power must the base be raised?\"</p><h4>The two directions</h4><table><tr><th>Logarithm form</th><th>Exponential form</th><th>Read as</th></tr><tr><td>log₂ 32 = 5</td><td>2⁵ = 32</td><td>2 to the power 5 is 32</td></tr><tr><td>log₅ 1 = 0</td><td>5⁰ = 1</td><td>any base to the power 0 is 1</td></tr><tr><td>log₃ (1/27) = −3</td><td>3⁻³ = 1/27</td><td>a negative logarithm means a fraction</td></tr><tr><td>log₁₀ 1000 = 3</td><td>10³ = 1000</td><td>common logarithm</td></tr></table><h4>Two values worth memorising</h4><p><b>logₐ 1 = 0</b> and <b>logₐ a = 1</b>. Both follow from the definition and both are used to simplify answers.</p><h4>Common mistake / conditions</h4><p>The base is written small and low: logₐ x. log 100 with no base means base 10, and ln x means base e ≈ 2.718. Never take the log of a negative number or of zero - the domain is x &gt; 0.</p>"}, "diagram": "m1_exp_log", "examples": ["m1n16", "m1n17"], "syllabus_item": "1.3"}, {"h": {"en": "5.2 Domain, range and the graph"}, "body": {"en": "<h4>Definition</h4><p>Because aˣ is always positive, only positive numbers have logarithms: the <b>domain of logₐ x is (0, ∞)</b>. The output can be any real number, so the <b>range is (−∞, ∞)</b>.</p><h4>The mirror</h4><p>Swap x and y in y = aˣ and you get x = aʸ, that is y = logₐ x. The two graphs are reflections of each other in the line y = x. The exponential has a horizontal asymptote y = 0; the logarithm has a vertical asymptote x = 0 and crosses the x-axis at (1, 0).</p><h4>Shape warnings</h4><ul><li>a &gt; 1: the curve rises slowly; log₁₀ 1000 = 3 while log₁₀ 10 = 1.</li><li>0 &lt; a &lt; 1: the curve falls - a decreasing logarithm.</li><li>The curve never touches x = 0; it dives without reaching it.</li></ul><h4>Application</h4><p>Logarithms turn multiplication into addition, which is why they appear wherever a quantity grows by a fixed <i>factor</i> - sound level, earthquake magnitude, pH, and the number of digits of a large power.</p>"}, "diagram": "m1_exp_log", "examples": ["m1n16"], "syllabus_item": "1.3"}, {"h": {"en": "5.3 Common and natural logarithms"}, "body": {"en": "<h4>Definition</h4><p><b>log x</b> (base 10) is used in engineering data tables; <b>ln x</b> (base e) is used in calculus and in growth/decay formulae. Both obey the same laws - only the base changes.</p><h4>Useful numbers</h4><table><tr><th>Quantity</th><th>Value</th><th>Why it is useful</th></tr><tr><td>log₁₀ 2</td><td>0.3010</td><td>halving and doubling times</td></tr><tr><td>log₁₀ 3</td><td>0.4771</td><td>powers of 3</td></tr><tr><td>log₁₀ e</td><td>0.4343</td><td>convert ln to log</td></tr><tr><td>ln 2</td><td>0.6931</td><td>half-life and doubling time</td></tr><tr><td>ln 10</td><td>2.3026</td><td>convert log to ln</td></tr></table><h4>Converting</h4><p><b>ln x = 2.3026 log x</b> and <b>log x = 0.4343 ln x</b>. The conversion is just the change of base formula with base e, which appears in the next section.</p><h4>Common mistake / conditions</h4><p>log 2 + log 3 = log 6, but log 2 × log 3 is <i>not</i> log 6 - the laws apply to the sum of logs, not to their product. Keep the operation and the law matched.</p>"}, "examples": ["m1n20"], "syllabus_item": "1.3"}]}, {"title": {"en": "6. Laws of Logarithm"}, "items": [{"h": {"en": "6.1 The three main laws"}, "body": {"en": "<h4>Definition</h4><p>For a &gt; 0, a ≠ 1 and positive x, y:</p><table><tr><th>Law</th><th>Statement</th><th>Example</th></tr><tr><td>Product</td><td>logₐ(xy) = logₐ x + logₐ y</td><td>log 6 = log 2 + log 3</td></tr><tr><td>Quotient</td><td>logₐ(x/y) = logₐ x − logₐ y</td><td>log 1.5 = log 3 − log 2</td></tr><tr><td>Power</td><td>logₐ(xⁿ) = n logₐ x</td><td>log 8 = 3 log 2</td></tr></table><h4>Why they hold</h4><p>Write x = aᵐ and y = aⁿ. Then xy = aᵐ⁺ⁿ, so logₐ(xy) = m + n = logₐ x + logₐ y. The laws are consequences of the index laws - not new rules to memorise.</p><h4>Using them in both directions</h4><p><b>Expand:</b> log(3x²/y) = log 3 + 2 log x − log y. <b>Condense:</b> 2 log 3 + log 4 − log 6 = log(9 × 4 / 6) = log 6. Exams ask for both directions, so practise both.</p>"}, "diagram": "m1_loglaws", "examples": ["m1n18", "m1n19"], "syllabus_item": "1.4"}, {"h": {"en": "6.2 Change of base and the derived laws"}, "body": {"en": "<h4>Definition</h4><p><b>logₐ x = log_b x / log_b a</b>. Choosing b = 10 turns any base into a calculator evaluation; choosing b = x gives logₐ x · log_x a = 1.</p><h4>Derived results</h4><table><tr><th>Result</th><th>How it follows</th></tr><tr><td>logₐ(1/x) = −logₐ x</td><td>power law with n = −1</td></tr><tr><td>logₐ b = 1 / log_b a</td><td>change of base, then simplify</td></tr><tr><td>logₐ a = 1 and logₐ 1 = 0</td><td>definition</td></tr><tr><td>a^(logₐ x) = x</td><td>the two operations undo each other</td></tr></table><h4>Worked example</h4><p>log₄ 8 = log 8 / log 4 = 3 log 2 / 2 log 2 = 3/2 = 1.5. The powers of 2 cancel, so no calculator is needed - always look for a common base first.</p><h4>Common mistake / conditions</h4><p>log(x + y) is not log x + log y, and (log x)² is not 2 log x. The laws act on products, quotients and powers - nothing else.</p>"}, "diagram": "m1_loglaws", "examples": ["m1n21", "m1n25"], "syllabus_item": "1.4"}, {"h": {"en": "6.3 Solving equations with logarithms"}, "body": {"en": "<h4>Definition</h4><p>Two moves solve almost everything: convert a log equation to exponential form, or take logs of both sides of an exponential equation.</p><h4>Worked examples</h4><p><b>log₂(x + 3) = 4</b> → x + 3 = 2⁴ = 16 → x = 13. <b>2ˣ = 32</b> → x = log₂ 32 = 5, or take log₁₀ of both sides: x log 2 = log 32 → x = 1.505/0.301 = 5.</p><h4>Check every root</h4><p>A solution that makes any argument zero or negative is rejected: log₂(x − 5) = 2 gives x = 9, which is fine, but a computed x = 3 would be rejected because log₂(3 − 5) does not exist. Write the domain condition first, then solve.</p><h4>Engineering use</h4><p>pH = −log₁₀[H⁺] and sound level L = 10 log₁₀(I/I₀). A pH of 4 means [H⁺] = 10⁻⁴ mol/L; a 20 dB increase is a hundredfold increase in intensity, not double.</p>"}, "examples": ["m1n22", "m1n23", "m1n24"], "syllabus_item": "1.4"}]}, {"title": {"en": "7. Answered Practice (Unit 1 level, suggested marks)"}, "items": [{"h": {"en": "Practice 1. Evaluate |5 −2; 3 4|."}, "body": {"en": "<h4>Working</h4><ol><li>Main diagonal: 5 × 4 = 20</li><li>Other diagonal: (−2) × 3 = −6</li><li>20 − (−6) = 26</li></ol><h4>Answer</h4><p><b>26.</b> Subtracting a negative product adds: keep the sign of b with b when you multiply.</p>"}}, {"h": {"en": "Practice 2. Find x if |x 3; 4 x| = 12."}, "body": {"en": "<h4>Working</h4><ol><li>x² − 12 = 12</li><li>x² = 24</li><li>x = √24 = 2√6 ≈ 4.899 or x = −2√6</li></ol><h4>Answer</h4><p><b>x = ±2√6.</b> Both roots satisfy the determinant; leave the answer in surd form unless decimals are asked for.</p>"}}, {"h": {"en": "Practice 3. Evaluate |3 1 2; 0 4 1; 2 0 5| by expanding along the first column."}, "body": {"en": "<h4>Working</h4><ol><li>3 × (4×5 − 1×0) = 60</li><li>−0 × (…) = 0</li><li>+2 × (1×1 − 2×4) = 2 × (−7) = −14</li><li>60 + 0 − 14 = 46</li></ol><h4>Check</h4><p>Expanding along the first row: 3(20 − 0) − 1(0 − 2) + 2(0 − 8) = 60 + 2 − 16 = 46 ✓ - the value does not depend on the chosen line.</p>"}}, {"h": {"en": "Practice 4. Find the cofactor of the entry 4 in [1 2 3; 4 5 6; 7 8 9]."}, "body": {"en": "<h4>Working</h4><p>Position (2, 1) carries a minus sign. Delete row 2 and column 1: the minor is |2 3; 8 9| = 18 − 24 = −6. Cofactor = −(−6) = 6.</p><h4>Answer</h4><p><b>6.</b> Note the determinant of the whole matrix is 0 (row 3 = 2 × row 2 − row 1), which does not stop a single cofactor from being non-zero.</p>"}}, {"h": {"en": "Practice 5. Solve 3x + 2y = 16, x + y = 6 by Cramer's rule."}, "body": {"en": "<h4>Working</h4><ol><li>D = 3(1) − 2(1) = 1</li><li>Dx = 16(1) − 2(6) = 4 → x = 4</li><li>Dy = 3(6) − 16(1) = 2 → y = 2</li></ol><h4>Check</h4><p>3(4) + 2(2) = 16 ✓ and 4 + 2 = 6 ✓. D = 1 makes the division exact, which is a good sign that the coefficients were copied correctly.</p>"}}, {"h": {"en": "Practice 6. Find the area of the triangle (0, 0), (5, 0), (0, 4)."}, "body": {"en": "<h4>Working</h4><p>Area = ½|0(0 − 4) + 5(4 − 0) + 0(0 − 0)| = ½|20| = 10.</p><h4>Answer</h4><p><b>10 square units</b> - the familiar right triangle with legs 5 and 4, so ½ × 5 × 4 = 10 confirms it.</p>"}}, {"h": {"en": "Practice 7. For f(x) = x² + 2x find f(−3) and f(1/2)."}, "body": {"en": "<h4>Working</h4><ol><li>f(−3) = 9 − 6 = 3</li><li>f(1/2) = 1/4 + 1 = 5/4</li></ol><h4>Answer</h4><p><b>3 and 5/4.</b> Bracket every substituted value, especially a fraction: (1/2)² = 1/4, not 1/2.</p>"}}, {"h": {"en": "Practice 8. Find the domain and range of f(x) = √(4 − x)."}, "body": {"en": "<h4>Working</h4><ol><li>4 − x ≥ 0 → x ≤ 4, so the domain is (−∞, 4]</li><li>A principal square root is never negative and reaches 0 at x = 4</li><li>Range = [0, ∞)</li></ol><h4>Check</h4><p>f(4) = 0 and f(0) = 2: outputs start at 0 and grow without limit as x becomes very negative ✓.</p>"}}, {"h": {"en": "Practice 9. Is f(x) = x⁴ + 2x² even, odd or neither?"}, "body": {"en": "<h4>Working</h4><p>f(−x) = (−x)⁴ + 2(−x)² = x⁴ + 2x² = f(x), so the function is even.</p><h4>Answer</h4><p><b>Even.</b> Every power of x is even, and that is a quick rule: a polynomial with only even powers is even, only odd powers is odd, mixed is neither.</p>"}}, {"h": {"en": "Practice 10. Evaluate log₃ 81 and log₇ (1/49)."}, "body": {"en": "<h4>Working</h4><ol><li>3⁴ = 81 → log₃ 81 = 4</li><li>7⁻² = 1/49 → log₇ (1/49) = −2</li></ol><h4>Answer</h4><p><b>4 and −2.</b> A fraction smaller than 1 always gives a negative log (base > 1).</p>"}}, {"h": {"en": "Practice 11. Expand log(5x³/y²)."}, "body": {"en": "<h4>Working</h4><p>log(5x³) − log(y²) = log 5 + log x³ − log y² = log 5 + 3 log x − 2 log y.</p><h4>Answer</h4><p><b>log 5 + 3 log x − 2 log y.</b> Check by condensing: the terms rebuild log(5x³/y²) exactly.</p>"}}, {"h": {"en": "Practice 12. Simplify log 8 + log 125 − log 10."}, "body": {"en": "<h4>Working</h4><ol><li>log 8 + log 125 = log 1000</li><li>log 1000 − log 10 = log 100</li><li>log 100 = 2</li></ol><h4>Answer</h4><p><b>2.</b> A calculator confirms 0.903 + 2.097 − 1 = 2.000 ✓.</p>"}}, {"h": {"en": "Practice 13. Solve log₂(x − 1) = 3."}, "body": {"en": "<h4>Working</h4><ol><li>Domain first: x − 1 > 0, so x > 1</li><li>Convert to exponential form: x − 1 = 2³ = 8</li><li>x = 9</li></ol><h4>Check</h4><p>log₂(9 − 1) = log₂ 8 = 3 ✓, and 9 satisfies x > 1. The domain condition is not decoration: without it a computed root such as x = 0 would be accepted wrongly.</p>"}}, {"h": {"en": "Practice 14. A sound is 1000 times more intense than the threshold I₀. Find its level in dB."}, "body": {"en": "<h4>Working</h4><ol><li>L = 10 log₁₀(I/I₀)</li><li>= 10 log₁₀ 1000</li><li>= 10 × 3 = 30</li></ol><h4>Answer</h4><p><b>30 dB.</b> Each factor of 10 adds 10 dB, so a 1000-fold intensity is 3 × 10 dB - never 1000 dB.</p>"}}]}], "diagrams": [{"id": "m1_det2", "title": {"en": "A second-order determinant"}, "file": "diagrams/m1_det2.svg"}, {"id": "m1_det3", "title": {"en": "Expanding a third-order determinant"}, "file": "diagrams/m1_det3.svg"}, {"id": "m1_cramer", "title": {"en": "Cramer's rule in four steps"}, "file": "diagrams/m1_cramer.svg"}, {"id": "m1_function", "title": {"en": "A function is a one-output machine"}, "file": "diagrams/m1_function.svg"}, {"id": "m1_graphs", "title": {"en": "Three shapes you must recognise"}, "file": "diagrams/m1_graphs.svg"}, {"id": "m1_exp_log", "title": {"en": "Exponential and logarithm are mirrors"}, "file": "diagrams/m1_exp_log.svg"}, {"id": "m1_loglaws", "title": {"en": "The four logarithm laws"}, "file": "diagrams/m1_loglaws.svg"}], "equations": [{"title": {"en": "Determinants"}, "items": [{"name": {"en": "Second order"}, "f": "|a b; c d| = ad − bc", "terms": {"en": "Main diagonal minus the other diagonal."}}, {"name": {"en": "Third order by row 1"}, "f": "a₁M₁₁ − b₁M₁₂ + c₁M₁₃", "terms": {"en": "Minors are the 2×2 determinants left after deleting a row and a column."}}, {"name": {"en": "Cofactor"}, "f": "Cᵢⱼ = (−1)^(i+j) Mᵢⱼ", "terms": {"en": "Signs follow the + − + board of the position, not the entry."}}, {"name": {"en": "Cramer's rule"}, "f": "x = Dx/D, y = Dy/D (D ≠ 0)", "terms": {"en": "Replace the column of the variable being found by the constants."}}, {"name": {"en": "Area of a triangle"}, "f": "½ |x₁(y₂ − y₃) + x₂(y₃ − y₁) + x₃(y₁ − y₂)|", "terms": {"en": "Area 0 means the three points are collinear."}}]}, {"title": {"en": "Functions"}, "items": [{"name": {"en": "Function notation"}, "f": "y = f(x), f : A → B", "terms": {"en": "One input gives exactly one output; A is the domain, B the codomain."}}, {"name": {"en": "Domain restrictions"}, "f": "denominator ≠ 0, radicand ≥ 0, log argument > 0", "terms": {"en": "These three conditions cover every domain question in this unit."}}, {"name": {"en": "Even and odd"}, "f": "f(−x) = f(x)  or  f(−x) = −f(x)", "terms": {"en": "Even is symmetric about the y-axis, odd about the origin."}}, {"name": {"en": "Vertex form"}, "f": "ax² + bx + c = a(x + b/2a)² + (c − b²/4a)", "terms": {"en": "Reads off the vertex, hence the range of a quadratic."}}]}, {"title": {"en": "Logarithms"}, "items": [{"name": {"en": "Definition"}, "f": "y = logₐ x ⇔ aʸ = x, x > 0, a > 0, a ≠ 1", "terms": {"en": "A logarithm is an exponent: it answers \"what power of a gives x?\"."}}, {"name": {"en": "Product and quotient"}, "f": "logₐ(xy) = logₐ x + logₐ y;  logₐ(x/y) = logₐ x − logₐ y", "terms": {"en": "Multiplication becomes addition; division becomes subtraction."}}, {"name": {"en": "Power law"}, "f": "logₐ(xⁿ) = n logₐ x", "terms": {"en": "Brings the exponent down in front - the workhorse of every log numerical."}}, {"name": {"en": "Change of base"}, "f": "logₐ x = log_b x / log_b a", "terms": {"en": "Use base 10 for a calculator, or the common base of the two numbers."}}, {"name": {"en": "Special values"}, "f": "logₐ 1 = 0, logₐ a = 1, a^(logₐ x) = x", "terms": {"en": "Immediate from the definition; useful for simplifying final answers."}}]}], "numericals": [{"id": "m1n1", "q": {"en": "Evaluate the determinant |3 5; 2 4|."}, "a": {"en": "<h4>Given and assumptions</h4><p>A second-order determinant: rows (3, 5) and (2, 4).</p><h4>Formula</h4><p>|a b; c d| = ad − bc</p><h4>Step-by-step solution</h4><ol><li>Main diagonal: 3 × 4 = 12</li><li>Other diagonal: 5 × 2 = 10</li><li>12 − 10 = 2</li></ol><h4>Interpretation and check</h4><p><b>2.</b> The determinant is a single number, so the answer must not be written as an array. A quick mental check: 12 is bigger than 10, so the sign is positive.</p>"}}, {"id": "m1n2", "q": {"en": "Evaluate |−4 7; 3 −2|."}, "a": {"en": "<h4>Given and assumptions</h4><p>Negative entries - keep each sign with its number.</p><h4>Formula</h4><p>ad − bc</p><h4>Step-by-step solution</h4><ol><li>a = −4, d = −2 → (−4)(−2) = 8</li><li>b = 7, c = 3 → (7)(3) = 21</li><li>8 − 21 = −13</li></ol><h4>Interpretation and check</h4><p><b>−13.</b> Check by expanding along the second row instead: −(3)(7) + (−2)(−4) = −21 + 8 = −13 ✓ - the value is the same whichever row you use.</p>"}}, {"id": "m1n3", "q": {"en": "Find x if |x 2; 3 x| = 10."}, "a": {"en": "<h4>Given and assumptions</h4><p>The entries contain x, so the determinant becomes an equation.</p><h4>Formula</h4><p>|x 2; 3 x| = x·x − 2·3</p><h4>Step-by-step solution</h4><ol><li>x² − 6 = 10</li><li>x² = 16</li><li>x = 4 or x = −4</li></ol><h4>Interpretation and check</h4><p><b>x = ±4.</b> Check both: for x = 4 the determinant is 16 − 6 = 10 ✓; for x = −4 it is also 16 − 6 = 10 ✓. Both roots are valid unless the question names a positive x.</p>"}}, {"id": "m1n4", "q": {"en": "Evaluate |1 2 3; 4 5 6; 7 8 10| by expanding along the first row."}, "a": {"en": "<h4>Given and assumptions</h4><p>Third-order determinant with the sign pattern + − + along row 1.</p><h4>Formula</h4><p>a₁(b₂c₃ − b₃c₂) − b₁(a₂c₃ − a₃c₂) + c₁(a₂b₃ − a₃b₂)</p><h4>Step-by-step solution</h4><ol><li>1 × (5×10 − 6×8) = 1 × 2 = 2</li><li>−2 × (4×10 − 6×7) = −2 × (−2) = +4</li><li>3 × (4×8 − 5×7) = 3 × (−3) = −9</li><li>2 + 4 − 9 = −3</li></ol><h4>Interpretation and check</h4><p><b>−3.</b> Sarrus check: (1·5·10 + 2·6·7 + 3·4·8) − (3·5·7 + 1·6·8 + 2·4·10) = (50 + 84 + 96) − (105 + 48 + 80) = 230 − 233 = −3 ✓.</p>"}}, {"id": "m1n5", "q": {"en": "Evaluate |2 −1 3; 0 4 −2; 5 1 0| using the most convenient line."}, "a": {"en": "<h4>Given and assumptions</h4><p>Two zeros: entry (2, 1) and entry (3, 3).</p><h4>Formula</h4><p>Expand along the third column (entries 3, −2, 0)</p><h4>Step-by-step solution</h4><ol><li>3 × (0×1 − 4×5) = 3 × (−20) = −60</li><li>−(−2) × (2×1 − (−1)×5) = +2 × 7 = +14</li><li>0 × (minor) = 0</li><li>−60 + 14 + 0 = −46</li></ol><h4>Interpretation and check</h4><p><b>−46.</b> The same answer comes from row 2: −0(...) + 4(2×0 − 3×5) − (−2)(2×1 − (−1)5) = −60 + 14 = −46 ✓. Choosing the line with zeros halves the arithmetic.</p>"}}, {"id": "m1n6", "q": {"en": "For A = [2 3 1; 4 0 5; 1 2 3] write the cofactor of each entry and find |A|."}, "a": {"en": "<h4>Given and assumptions</h4><p>Nine minors, each with the positional sign from the + − + board.</p><h4>Formula</h4><p>Cᵢⱼ = (−1)^(i+j) Mᵢⱼ</p><h4>Step-by-step solution</h4><ol><li>C₁₁ = +(0×3 − 5×2) = −10; C₁₂ = −(4×3 − 5×1) = −7; C₁₃ = +(4×2 − 0×1) = 8</li><li>C₂₁ = −(3×3 − 1×2) = −7; C₂₂ = +(2×3 − 1×1) = 5; C₂₃ = −(2×2 − 3×1) = −1</li><li>C₃₁ = +(3×5 − 1×0) = 15; C₃₂ = −(2×5 − 1×4) = −6; C₃₃ = +(2×0 − 3×4) = −12</li><li>|A| = 2(−10) + 3(−7) + 1(8) = −20 − 21 + 8 = −33</li></ol><h4>Interpretation and check</h4><p><b>|A| = −33.</b> Sarrus: (0 + 15 + 8) − (0 + 36 + 20) = 23 − 56 = −33 ✓. Note that the cofactors are <i>not</i> all positive - the board alternates by position.</p>"}}, {"id": "m1n7", "q": {"en": "Solve 2x + 3y = 12 and x − y = 1 by Cramer's rule."}, "a": {"en": "<h4>Given and assumptions</h4><p>Coefficients a₁ = 2, b₁ = 3, c₁ = 12 and a₂ = 1, b₂ = −1, c₂ = 1.</p><h4>Formula</h4><p>D = |a₁ b₁; a₂ b₂|, Dx = |c₁ b₁; c₂ b₂|, Dy = |a₁ c₁; a₂ c₂|, x = Dx/D, y = Dy/D</p><h4>Step-by-step solution</h4><ol><li>D = (2)(−1) − (3)(1) = −5</li><li>Dx = (12)(−1) − (3)(1) = −15, so x = −15/−5 = 3</li><li>Dy = (2)(1) − (12)(1) = −10, so y = −10/−5 = 2</li></ol><h4>Interpretation and check</h4><p><b>x = 3, y = 2.</b> Check in the original equations: 2(3) + 3(2) = 12 ✓ and 3 − 2 = 1 ✓. D ≠ 0, so the system has exactly one solution - consistent with the lines crossing once.</p>"}}, {"id": "m1n8", "q": {"en": "Solve x + y + z = 6, x − y + z = 2, 2x + y − z = 1 by determinants."}, "a": {"en": "<h4>Given and assumptions</h4><p>Coefficient matrix [1 1 1; 1 −1 1; 2 1 −1]; constants (6, 2, 1).</p><h4>Formula</h4><p>D, Dx, Dy, Dz - replace one column of coefficients by the constants each time</p><h4>Step-by-step solution</h4><ol><li>D = 1(1 − 1) − 1(−1 − 2) + 1(1 + 2) = 0 + 3 + 3 = 6</li><li>Dx = 6(1 − 1) − 1(−2 − 1) + 1(2 + 1) = 0 + 3 + 3 = 6 → x = 1</li><li>Dy = 1(−2 − 1) − 6(−1 − 2) + 1(1 − 4) = −3 + 18 − 3 = 12 → y = 2</li><li>Dz = 1(−1 − 2) − 1(1 − 4) + 6(1 + 2) = −3 + 3 + 18 = 18 → z = 3</li></ol><h4>Interpretation and check</h4><p><b>x = 1, y = 2, z = 3.</b> Check all three: 1 + 2 + 3 = 6 ✓; 1 − 2 + 3 = 2 ✓; 2(1) + 2 − 3 = 1 ✓. D = 6 ≠ 0 guarantees a unique solution.</p>"}}, {"id": "m1n9", "q": {"en": "Find the area of the triangle with vertices A(1, 2), B(4, 6), C(7, 2)."}, "a": {"en": "<h4>Given and assumptions</h4><p>Three vertices; the base AC is horizontal at y = 2 from x = 1 to x = 7.</p><h4>Formula</h4><p>Area = ½|x₁(y₂ − y₃) + x₂(y₃ − y₁) + x₃(y₁ − y₂)|</p><h4>Step-by-step solution</h4><ol><li>1(6 − 2) = 4</li><li>4(2 − 2) = 0</li><li>7(2 − 6) = −28</li><li>Area = ½|4 + 0 − 28| = ½ × 24 = 12</li></ol><h4>Interpretation and check</h4><p><b>12 square units.</b> Geometric check: base AC = 7 − 1 = 6 units and the height of B above the base is 6 − 2 = 4 units, so area = ½ × 6 × 4 = 12 ✓.</p>"}}, {"id": "m1n10", "q": {"en": "Show that the points (1, 2), (3, 6) and (5, 10) are collinear."}, "a": {"en": "<h4>Given and assumptions</h4><p>Collinear points enclose no area, so the determinant form must vanish.</p><h4>Formula</h4><p>½|x₁(y₂ − y₃) + x₂(y₃ − y₁) + x₃(y₁ − y₂)| = 0 means collinear</p><h4>Step-by-step solution</h4><ol><li>1(6 − 10) = −4</li><li>3(10 − 2) = 24</li><li>5(2 − 6) = −20</li><li>−4 + 24 − 20 = 0, so the area is 0</li></ol><h4>Interpretation and check</h4><p><b>Collinear.</b> Confirmation by slope: the slope from (1, 2) to (3, 6) is 4/2 = 2 and from (3, 6) to (5, 10) is also 4/2 = 2, so all three lie on y = 2x.</p>"}}, {"id": "m1n11", "q": {"en": "For f(x) = 2x² − 3x + 1 find f(0), f(2) and f(−1)."}, "a": {"en": "<h4>Given and assumptions</h4><p>Substitute each value in brackets and apply BODMAS.</p><h4>Formula</h4><p>Replace x by the given number everywhere</p><h4>Step-by-step solution</h4><ol><li>f(0) = 0 − 0 + 1 = 1</li><li>f(2) = 2(4) − 6 + 1 = 3</li><li>f(−1) = 2(1) + 3 + 1 = 6</li></ol><h4>Interpretation and check</h4><p><b>1, 3 and 6.</b> Check f(2) by factorising the answer: 2x² − 3x + 1 = (2x − 1)(x − 1), so f(2) = (3)(1) = 3 ✓. The bracket rule saves the sign in f(−1).</p>"}}, {"id": "m1n12", "q": {"en": "Find the domain of f(x) = 1/(x − 3) and of g(x) = √(x − 2)."}, "a": {"en": "<h4>Given and assumptions</h4><p>A denominator must not be zero; a square root must not be negative.</p><h4>Formula</h4><p>denominator ≠ 0, radicand ≥ 0</p><h4>Step-by-step solution</h4><ol><li>x − 3 ≠ 0 → x ≠ 3, so the domain of f is all real x except 3</li><li>x − 2 ≥ 0 → x ≥ 2, so the domain of g is [2, ∞)</li></ol><h4>Interpretation and check</h4><p><b>R − {3} and [2, ∞).</b> Test one value outside each answer: f(3) is undefined, and g(1) = √(−1) is not real ✓. Write the domain as a set or an interval, never as a word.</p>"}}, {"id": "m1n13", "q": {"en": "Find the domain and range of f(x) = x² − 4x + 7."}, "a": {"en": "<h4>Given and assumptions</h4><p>A quadratic; complete the square to read the vertex.</p><h4>Formula</h4><p>x² + bx + c = (x + b/2)² + c − b²/4</p><h4>Step-by-step solution</h4><ol><li>x² − 4x + 7 = (x − 2)² + 3</li><li>Domain: every real x, because a polynomial has no restriction</li><li>Range: (x − 2)² ≥ 0, so f(x) ≥ 3</li></ol><h4>Interpretation and check</h4><p><b>Domain R, range [3, ∞), vertex (2, 3).</b> Check f(2) = 4 − 8 + 7 = 3, and f(0) = 7 ≥ 3 ✓. The bracket (x − 2)² can never be negative, which is why 3 is the minimum.</p>"}}, {"id": "m1n14", "q": {"en": "Evaluate the piecewise function f(x) = x + 1 for x &lt; 0 and f(x) = x² for x ≥ 0 at x = −2, 0 and 3."}, "a": {"en": "<h4>Given and assumptions</h4><p>The rule is chosen by the input, and the boundary value x = 0 belongs to the second rule because it is written x ≥ 0.</p><h4>Formula</h4><p>Use the branch whose condition the input satisfies</p><h4>Step-by-step solution</h4><ol><li>x = −2 &lt; 0, so f(−2) = −2 + 1 = −1</li><li>x = 0 ≥ 0, so f(0) = 0² = 0</li><li>x = 3 ≥ 0, so f(3) = 3² = 9</li></ol><h4>Interpretation and check</h4><p><b>−1, 0 and 9.</b> Each output is a single number - if you get two answers for one input, the branches overlap and the relation is not a function at that point.</p>"}}, {"id": "m1n15", "q": {"en": "Test whether f(x) = x³ − x is even, odd or neither; then test g(x) = x² + x."}, "a": {"en": "<h4>Given and assumptions</h4><p>Replace x by −x and compare.</p><h4>Formula</h4><p>Even: f(−x) = f(x); odd: f(−x) = −f(x)</p><h4>Step-by-step solution</h4><ol><li>f(−x) = (−x)³ − (−x) = −x³ + x = −(x³ − x) = −f(x) → odd</li><li>g(−x) = (−x)² + (−x) = x² − x</li><li>x² − x is neither g(x) = x² + x nor −g(x) = −x² − x → neither</li></ol><h4>Interpretation and check</h4><p><b>f is odd, g is neither.</b> Check numerically: f(2) = 6 and f(−2) = −6 (opposite ✓); g(2) = 6 but g(−2) = 2, which is neither 6 nor −6 ✓.</p>"}}, {"id": "m1n16", "q": {"en": "Evaluate log₂ 32, log₃ (1/27), log₁₀ 1000 and log₅ 1."}, "a": {"en": "<h4>Given and assumptions</h4><p>Use the definition: logₐ x is the power that turns a into x.</p><h4>Formula</h4><p>y = logₐ x ⇔ aʸ = x</p><h4>Step-by-step solution</h4><ol><li>2⁵ = 32 → log₂ 32 = 5</li><li>3⁻³ = 1/27 → log₃ (1/27) = −3</li><li>10³ = 1000 → log₁₀ 1000 = 3</li><li>5⁰ = 1 → log₅ 1 = 0</li></ol><h4>Interpretation and check</h4><p><b>5, −3, 3 and 0.</b> Two sanity rules cover all four: logₐ 1 = 0 always, and a logarithm is negative exactly when the argument is below 1 (for base &gt; 1).</p>"}}, {"id": "m1n17", "q": {"en": "Find a if logₐ 8 = 3/2."}, "a": {"en": "<h4>Given and assumptions</h4><p>An unknown base; convert to exponential form.</p><h4>Formula</h4><p>logₐ x = y ⇔ aʸ = x</p><h4>Step-by-step solution</h4><ol><li>a^(3/2) = 8</li><li>Square both sides: a³ = 64</li><li>a = 4</li></ol><h4>Interpretation and check</h4><p><b>a = 4.</b> Check: 4^(3/2) = (√4)³ = 2³ = 8 ✓. The base must be positive and not 1 - 4 satisfies both.</p>"}}, {"id": "m1n18", "q": {"en": "Expand log(3x²/y) using the laws of logarithm."}, "a": {"en": "<h4>Given and assumptions</h4><p>All arguments are positive (x &gt; 0, y &gt; 0), so every law applies.</p><h4>Formula</h4><p>log(xy) = log x + log y; log(x/y) = log x − log y; log xⁿ = n log x</p><h4>Step-by-step solution</h4><ol><li>log(3x²) − log y  (quotient law)</li><li>log 3 + log x² − log y  (product law)</li><li>log 3 + 2 log x − log y  (power law)</li></ol><h4>Interpretation and check</h4><p><b>log 3 + 2 log x − log y.</b> Combine it back: log 3 + log x² − log y = log(3x²/y) ✓. The number of terms in the answer equals the number of factors in the argument.</p>"}}, {"id": "m1n19", "q": {"en": "Write 2 log 3 + log 4 − log 6 as a single logarithm."}, "a": {"en": "<h4>Given and assumptions</h4><p>Condensing is the reverse of the expansion.</p><h4>Formula</h4><p>n log x = log xⁿ, then product and quotient laws</p><h4>Step-by-step solution</h4><ol><li>2 log 3 = log 9</li><li>log 9 + log 4 = log 36</li><li>log 36 − log 6 = log 6</li></ol><h4>Interpretation and check</h4><p><b>log 6.</b> Numerically: 2(0.4771) + 0.6021 − 0.7782 = 0.7781 ≈ log 6 = 0.7782 ✓ (the tiny gap is rounding in the tables).</p>"}}, {"id": "m1n20", "q": {"en": "Given log 2 = 0.3010 and log 3 = 0.4771, find log 72."}, "a": {"en": "<h4>Given and assumptions</h4><p>72 is not in the tables, so break it into primes: 72 = 8 × 9 = 2³ × 3².</p><h4>Formula</h4><p>log(xy) = log x + log y and log xⁿ = n log x</p><h4>Step-by-step solution</h4><ol><li>log 72 = log(2³ × 3²)</li><li>= 3 log 2 + 2 log 3</li><li>= 3(0.3010) + 2(0.4771)</li><li>= 0.9030 + 0.9542 = 1.8572</li></ol><h4>Interpretation and check</h4><p><b>1.8572.</b> Check the size: 72 lies between 10 and 100, so log 72 must lie between 1 and 2 ✓. A result outside that range means a slip in the table values.</p>"}}, {"id": "m1n21", "q": {"en": "Evaluate log₄ 8 without a calculator."}, "a": {"en": "<h4>Given and assumptions</h4><p>Both numbers are powers of 2.</p><h4>Formula</h4><p>logₐ x = log_b x / log_b a</p><h4>Step-by-step solution</h4><ol><li>log₄ 8 = log₂ 8 / log₂ 4</li><li>= 3 / 2</li><li>= 1.5</li></ol><h4>Interpretation and check</h4><p><b>3/2.</b> Check by the definition: 4^(3/2) = (√4)³ = 8 ✓. Choosing the common base 2 made the division exact - always look for a shared base before reaching for a calculator.</p>"}}, {"id": "m1n22", "q": {"en": "Solve 2ˣ = 32 and log₂(x + 3) = 4."}, "a": {"en": "<h4>Given and assumptions</h4><p>One exponential equation and one logarithmic equation, both base 2.</p><h4>Formula</h4><p>Take logarithms of both sides; or convert log form to exponential form</p><h4>Step-by-step solution</h4><ol><li>2ˣ = 32 = 2⁵ → x = 5</li><li>log₂(x + 3) = 4 → x + 3 = 2⁴ = 16</li><li>x = 13</li></ol><h4>Interpretation and check</h4><p><b>x = 5 and x = 13.</b> Check: 2⁵ = 32 ✓ and log₂(13 + 3) = log₂ 16 = 4 ✓. The argument 13 + 3 = 16 is positive, so no rejection is needed.</p>"}}, {"id": "m1n23", "q": {"en": "Find the pH of a solution with hydrogen-ion concentration [H⁺] = 1 × 10⁻⁴ mol/L."}, "a": {"en": "<h4>Given and assumptions</h4><p>pH = −log₁₀[H⁺].</p><h4>Formula</h4><p>pH = −log₁₀[H⁺]</p><h4>Step-by-step solution</h4><ol><li>pH = −log₁₀(10⁻⁴)</li><li>log₁₀(10⁻⁴) = −4</li><li>pH = −(−4) = 4</li></ol><h4>Interpretation and check</h4><p><b>pH = 4</b>, an acidic solution (below 7). A tenfold increase in [H⁺] lowers the pH by exactly 1, because each decade is one unit on a logarithmic scale.</p>"}}, {"id": "m1n24", "q": {"en": "A bacterial culture doubles every 20 minutes. Starting with 1000 bacteria, when will it reach 8000?"}, "a": {"en": "<h4>Given and assumptions</h4><p>Growth by a fixed factor, so the count after t minutes is 1000 × 2^(t/20).</p><h4>Formula</h4><p>1000 × 2^(t/20) = 8000</p><h4>Step-by-step solution</h4><ol><li>2^(t/20) = 8</li><li>2^(t/20) = 2³</li><li>t/20 = 3</li><li>t = 60 minutes = 1 hour</li></ol><h4>Interpretation and check</h4><p><b>60 minutes.</b> Check by counting doublings: 1000 → 2000 (20 min) → 4000 (40 min) → 8000 (60 min) ✓. With logs: t = 20 log₂ 8 = 20 × 3 = 60.</p>"}}, {"id": "m1n25", "q": {"en": "Show that log₂ 8 × log₈ 2 = 1, and state the general result."}, "a": {"en": "<h4>Given and assumptions</h4><p>log₂ 8 = 3 and log₈ 2 is the same question reversed.</p><h4>Formula</h4><p>logₐ b = 1 / log_b a</p><h4>Step-by-step solution</h4><ol><li>log₂ 8 = 3</li><li>log₈ 2 = 1/3, because 8^(1/3) = 2</li><li>Product = 3 × 1/3 = 1</li></ol><h4>Interpretation and check</h4><p><b>1.</b> General rule: logₐ b · log_b a = 1 for any valid bases. It is the change-of-base formula with the two bases swapped, and it turns \"evaluate in another base\" questions into one division.</p>"}}], "viva": [{"title": {"en": "Determinants"}, "items": [{"q": {"en": "What is a determinant?"}, "a": {"en": "A single number calculated from a square array of numbers, written with vertical bars."}}, {"q": {"en": "State the value of a 2×2 determinant."}, "a": {"en": "ad − bc: the product of the main diagonal minus the product of the other diagonal."}}, {"q": {"en": "What is the minor of an entry?"}, "a": {"en": "The determinant left after deleting the row and the column containing that entry."}}, {"q": {"en": "How does a cofactor differ from a minor?"}, "a": {"en": "The cofactor adds the positional sign: Cᵢⱼ = (−1)^(i+j) Mᵢⱼ."}}, {"q": {"en": "Which row should you choose to expand a third-order determinant?"}, "a": {"en": "The one with the most zeros, because each zero removes a whole 2×2 determinant."}}, {"q": {"en": "If D = 0 in Cramer's rule, what can you say?"}, "a": {"en": "Either there is no solution (parallel lines) or there are infinitely many (the same line); Dx and Dy decide which."}}, {"q": {"en": "How do you test whether three points are collinear?"}, "a": {"en": "The area formula must give zero, that is the determinant of the three points is zero."}}]}, {"title": {"en": "Functions"}, "items": [{"q": {"en": "Define a function."}, "a": {"en": "A rule that assigns exactly one element of the codomain to every element of the domain."}}, {"q": {"en": "What is the domain of 1/(x − 3)?"}, "a": {"en": "All real numbers except 3, because the denominator must not be zero."}}, {"q": {"en": "What is the domain of √(x − 2)?"}, "a": {"en": "x ≥ 2, because a square root of a negative number is not real."}}, {"q": {"en": "When is a function even?"}, "a": {"en": "When f(−x) = f(x) for every x in the domain; its graph is symmetric about the y-axis."}}, {"q": {"en": "When is a function odd?"}, "a": {"en": "When f(−x) = −f(x) for every x; its graph is symmetric about the origin."}}, {"q": {"en": "What is the range of a quadratic with a positive leading coefficient?"}, "a": {"en": "From the vertex's y-value upward, y ≥ k, because the parabola opens upward."}}, {"q": {"en": "What does the vertical line test check?"}, "a": {"en": "That no vertical line meets the graph twice, which means each input has only one output."}}]}, {"title": {"en": "Logarithms"}, "items": [{"q": {"en": "Define logₐ x."}, "a": {"en": "The exponent to which a must be raised to get x: y = logₐ x ⇔ aʸ = x."}}, {"q": {"en": "What is the domain of a logarithm?"}, "a": {"en": "x > 0, because no power of a positive base gives zero or a negative number."}}, {"q": {"en": "State the product law."}, "a": {"en": "logₐ(xy) = logₐ x + logₐ y."}}, {"q": {"en": "State the quotient law."}, "a": {"en": "logₐ(x/y) = logₐ x − logₐ y."}}, {"q": {"en": "State the power law."}, "a": {"en": "logₐ(xⁿ) = n logₐ x."}}, {"q": {"en": "How do you change the base of a logarithm?"}, "a": {"en": "logₐ x = log_b x / log_b a, for any valid new base b."}}, {"q": {"en": "What are logₐ 1 and logₐ a?"}, "a": {"en": "logₐ 1 = 0 and logₐ a = 1, for every valid base a."}}, {"q": {"en": "Is log(x + y) equal to log x + log y?"}, "a": {"en": "No. The product law applies to log(xy); a sum inside a logarithm cannot be split."}}, {"q": {"en": "Why is a 20 dB increase a hundredfold, not a doubling?"}, "a": {"en": "Sound level uses 10 log₁₀; +20 dB means the ratio grew by 10² = 100."}}]}], "exam_questions": [{"q": {"en": "Practice: Evaluate |5 −2; 3 4|."}, "marks": 3}, {"q": {"en": "Practice: Find x if |x 3; 4 x| = 12."}, "marks": 4}, {"q": {"en": "Practice: Evaluate |3 1 2; 0 4 1; 2 0 5| by expanding along the first column."}, "marks": 4}, {"q": {"en": "Practice: Find the cofactor of the entry 4 in [1 2 3; 4 5 6; 7 8 9]."}, "marks": 3}, {"q": {"en": "Practice: Solve 3x + 2y = 16, x + y = 6 by Cramer's rule."}, "marks": 4}, {"q": {"en": "Practice: Find the area of the triangle (0, 0), (5, 0), (0, 4)."}, "marks": 3}, {"q": {"en": "Practice: For f(x) = x² + 2x find f(−3) and f(1/2)."}, "marks": 3}, {"q": {"en": "Practice: Find the domain and range of f(x) = √(4 − x)."}, "marks": 4}, {"q": {"en": "Practice: Is f(x) = x⁴ + 2x² even, odd or neither?"}, "marks": 3}, {"q": {"en": "Practice: Evaluate log₃ 81 and log₇ (1/49)."}, "marks": 3}, {"q": {"en": "Practice: Expand log(5x³/y²)."}, "marks": 3}, {"q": {"en": "Practice: Simplify log 8 + log 125 − log 10."}, "marks": 4}, {"q": {"en": "Practice: Solve log₂(x − 1) = 3."}, "marks": 3}, {"q": {"en": "Practice: A sound is 1000 times more intense than the threshold I₀. Find its level in dB."}, "marks": 4}], "learning_outcomes": [{"en": "CO1: Interpret the function graphically, numerically and analytically."}], "course_outcomes": ["CO1"], "practical_numbers": [], "content_kind": "theory", "lesson_count": 18, "answered_practice_count": 14, "assessment_note": {"en": "Official course: theory ESE 70 + PA 30 = 100 marks, 4 credits; this unit carries 23 % weightage and about 16 of the 70 theory marks. Practice-question marks (3/4) are suggested revision sizes, not official GTU allocations or a guaranteed paper pattern. Model answers are in Notes section 7."}, "question_provenance": "Original answered revision questions; not official past papers", "question_marks_are_suggested": true, "sources": [{"title": "GTU DI01000021, Mathematics-I, Branch: All, Semester 1, w.e.f. 2024-25 (uploaded syllabus)", "url": "https://s3-ap-southeast-1.amazonaws.com/gtusitecirculars/Syallbus/DI01000021.pdf"}, {"title": "Khan Academy - determinants and logarithms", "url": "https://www.khanacademy.org/math/algebra2"}, {"title": "GeoGebra - plot y = log x beside y = a^x and slide the base", "url": "https://www.geogebra.org/"}, {"title": "OpenStax - College Algebra 2e, chapters on functions and exponential/logarithmic functions", "url": "https://openstax.org/details/books/college-algebra-2e"}, {"title": "John Bird - Understanding Engineering Mathematics (Routledge)", "url": "https://www.routledge.com/Understanding-Engineering-Mathematics/Bird/p/book/9780415662840"}]};

ke-width=\"1.6\"/><text x=\"180\" y=\"268.0\" font-size=\"11.4\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">+ c₁ × det[a₂ b₂; a₃ b₃]</text><text x=\"180\" y=\"311.6\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">Any row or column gives the same value.</text><text x=\"180\" y=\"327.6\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">Choose the line with the most zeros.</text></svg>", "m1_cramer": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 402\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"402\" fill=\"#ffffff\"/><text x=\"180\" y=\"28.9\" font-size=\"14\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">Cramer's rule in four steps</text><text x=\"180\" y=\"49.7\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">Determinants replace the constants column</text><rect x=\"30.0\" y=\"61.0\" width=\"300\" height=\"34\" rx=\"7\" fill=\"#EAF3FD\" stroke=\"#1565C0\" stroke-width=\"1.6\"/><text x=\"180\" y=\"82.1\" font-size=\"11.6\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">2x + 3y = 12    and    x − y = 1</text><path d=\"M180 95 L180 116\" fill=\"none\" stroke=\"#7B2CD9\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polygon points=\"180.0,116.0 183.5,109.0 176.5,109.0\" fill=\"#7B2CD9\"/><rect x=\"30.0\" y=\"117.0\" width=\"300\" height=\"34\" rx=\"7\" fill=\"#F6F2FB\" stroke=\"#7B2CD9\" stroke-width=\"1.6\"/><text x=\"180\" y=\"138.1\" font-size=\"11.6\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">D = |2 3; 1 −1| = −5</text><path d=\"M180 151 L180 174\" fill=\"none\" stroke=\"#7B2CD9\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polygon points=\"180.0,174.0 183.5,167.0 176.5,167.0\" fill=\"#7B2CD9\"/><polygon points=\"180,178.0 228.0,204 180,230.0 132.0,204\" fill=\"#FFF1DE\" stroke=\"#E07B00\" stroke-width=\"1.8\" \"351.6\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">Domain of log₂ x: x &gt; 0.  Range: every real y.</text><text x=\"180\" y=\"367.6\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">Neither curve ever touches the axis it approaches.</text></svg>", "m1_loglaws": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 378\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"378\" fill=\"#ffffff\"/><text x=\"180\" y=\"28.9\" font-size=\"14\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">The four logarithm laws</text><text x=\"180\" y=\"49.7\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">All four come from the index laws</text><rect x=\"16\" y=\"64\" width=\"328\" height=\"56\" rx=\"8\" fill=\"#EAF6EC\" stroke=\"#2E7D32\" stroke-width=\"1.5\"/><text x=\"30\" y=\"89.7\" font-size=\"10.6\" text-anchor=\"start\" fill=\"#2E7D32\" font-weight=\"bold\">Product</text><text x=\"30\" y=\"110.3\" font-size=\"12.4\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">log(xy) = log x + log y</text><text x=\"330\" y=\"89.4\" font-size=\"9.6\" text-anchor=\"end\" fill=\"#666\" font-weight=\"normal\">log 6 = log 2 + log 3</text><rect x=\"16\" y=\"128\" width=\"328\" height=\"56\" rx=\"8\" fill=\"#EAF3FD\" stroke=\"#1565C0\" stroke-width=\"1.5\"/><text x=\"30\" y=\"153.7\" font-size=\"10.6\" text-anchor=\"start\" fill=\"#1565C0\" font-weight=\"bold\">Quotient</text><text x=\"30\" y=\"174.3\" font-size=\"12.4\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">log(x/y) = log x − log y</text><text x=\"330\" y=\"153.4\" font-size=\"9.6\" text-anchor=\"end\" fill=\"#666\" font-weight=\"normal\">log 1.5 = log 3 − log 2</text><rect x=\"16\" y=\"192\" width=\"328\" height=\"56\" rx=\"8\" fill=\"#FFF4DF\" stroke=\"#B66A00\" stroke-width=\"1.5\"/><text x=\"30\" y=\"217.7\" font-size=\"10.6\" text-anchor=\"start\" fill=\"#B66A00\" font-weight=\"bold\">Power</text><text x=\"30\" y=\"238.3\" font-size=\"12.4\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">log(xⁿ) = n log x</text><text x=\"330\" y=\"217.4\" font-size=\"9.6\" text-anchor=\"end\" fill=\"#666\" font-weight=\"normal\">log 8 = 3 log 2</text><rect x=\"16\" y=\"256\" width=\"328\" height=\"56\" rx=\"8\" fill=\"#FDECF0\" stroke=\"#BD2543\" stroke-width=\"1.5\"/><text x=\"30\" y=\"281.7\" font-size=\"10.6\" text-anchor=\"start\" fill=\"#BD2543\" font-weight=\"bold\">Change of base</text><text x=\"30\" y=\"302.3\" font-size=\"12.4\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">logₐ x = log_b x / log_b a</text><text x=\"330\" y=\"281.4\" font-size=\"9.6\" text-anchor=\"end\" fill=\"#666\" font-weight=\"normal\">log₄ 8 = log₂ 8 / log₂ 4</text><text x=\"180\" y=\"329.6\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">The laws need positive arguments and a base a &gt; 0, a ≠ 1.</text><text x=\"180\" y=\"345.6\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">log(x + y) does not split: only products, quotients and powers do.</text></svg>"};

     marks:'ગુણ',programs:'પ્રોગ્રામ્સ',flowcharts:'ફ્લોચાર્ટ',syntax:'સિન્ટેક્સ',algorithms:'અલ્ગોરિધમ',prog:'💻 પ્રોગ્રામ',code:'કોડ',output:'આઉટપુટ',plot:'પ્લોટ (આઉટપુટ)',expl:'સમજૂતી',
     introc:'GTU syllabus મુજબ flowcharts, આઉટપુટ સાથેના ઉકેલેલા C programs, syntax અને viva સાથે વિગતવાર નોટ્સ.'}};
const L = k => STR[S.lang][k];
const t = o => (o && typeof o === 'object') ? (o[S.lang] || o.en) : (o || '');
const chev = '<svg class="chev" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#7B2CD9" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
const dots = '<svg width="22" height="22" viewBox="0 0 24 24" fill="#222"><circle cx="12" cy="5" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="12" cy="19" r="2.2"/></svg>';
const fixTables = h => h.replace(/<table>/g,'<div class="tw"><table>').replace(/<\/table>/g,'</table></div>');
const head = (title, menu=true) => `<div class="sh"><span>${title}</span>${menu?`<button class="more" data-more>${dots}</button><div class="menu"><button data-act="expand">${L('expand')}</button><button data-act="collapse">${L('collapse')}</button></div>`:''}</div>`;
const dgInline = id => `<div class="dg" data-dg="${id}">${SVG[id]}</div><div class="dgc">📐 ${t(U.diagrams.find(d=>d.id===id).title)} · ${L('tapzoom')}</div>`;

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const KW = new Set('auto break case const continue default do else enum extern for goto if register return signed sizeof static struct switch typedef union unsigned volatile while'.split(' '));
const TY = new Set('int char float double void long short FILE size_t'.split(' '));
const PKW = new Set('False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield'.split(' '));
const PTY = new Set('int float str bool list tuple set dict complex frozenset bytes bytearray range object'.split(' '));
function hlPy(src){
  const re = /(#[^\n]*)|((?:\b[rRbBfFuU]{1,2})?(?:'{3}[\s\S]*?'{3}|"{3}[\s\S]*?"{3}|'(?:\\.|[^'\\\n])*'|"(?:\\.|[^"\\\n])*"))|(^>>>|^\.\.\.(?= ))|([A-Za-z_]\w*)(?=\s*\()|([A-Za-z_]\w*)|(\b(?:0[xXoObB][0-9a-fA-F_]+|\d[\d_]*(?:\.\d+)?(?:[eE][-+]?\d+)?j?)\b)/gm;
  let o='', last=0, m;
  while ((m = re.exec(src))){
    o += esc(src.slice(last, m.index)); last = re.lastIndex;
    const w = esc(m[0]);
    if (m[1]) o += `<span class="cm">${w}</span>`;
    else if (m[2]) o += `<span class="st">${w}</span>`;
    else if (m[3]) o += `<span class="pp">${w}</span>`;
    else if (m[4]) o += PKW.has(m[4]) ? `<span class="kw">${w}</span>` : PTY.has(m[4]) ? `<span class="ty">${w}</span>` : `<span class="fn">${w}</span>`;
    else if (m[5]) o += PKW.has(m[5]) ? `<span class="kw">${w}</span>` : PTY.has(m[5]) ? `<span class="ty">${w}</span>` : w;
    else o += `<span class="nu">${w}</span>`;
  }
  return o + esc(src.slice(last));
}
function hl(src){
  if (META.code_lang === 'python') return hlPy(src);
  if (META.code_lang === 'nosql') return esc(src);
  const re = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(^[ \t]*#[^\n]*)|([A-Za-z_]\w*)(?=\s*\()|([A-Za-z_]\w*)|(\b\d+(?:\.\d+)?[fFlLuU]*\b)/gm;
  let o='', last=0, m;
  while ((m = re.exec(src))){
    o += esc(src.slice(last, m.index)); last = re.lastIndex;
    const w = esc(m[0]);
    if (m[1]) o += `<span class="cm">${w}</span>`;
    else if (m[2]) o += `<span class="st">${w}</span>`;
    else if (m[3]) o += `<span class="pp">${w}</span>`;
    else if (m[4]) o += KW.has(m[4]) ? `<span class="kw">${w}</span>` : TY.has(m[4]) ? `<span class="ty">${w}</span>` : `<span class="fn">${w}</span>`;
    else if (m[5]) o += KW.has(m[5]) ? `<span class="kw">${w}</span>` : TY.has(m[5]) ? `<span class="ty">${w}</span>` : w;
    else o += `<span class="nu">${w}</span>`;
  }
  return o + esc(src.slice(last));
}
const progBody = p => p.items
  ? p.items.map(it => fixTables(t(it.body)) + (it.diagram?dgInline(it.diagram):'')).join('')
  : `<div class="pl">${L('code')}</div><pre class="code">${hl(t(p.code))}</pre><div class="pl">${L('output')}</div><pre class="out">${esc(p.out)}</pre>${p.plot?`<div class="pl">${L('plot')}</div>`+dgInline(p.plot).replace('class="dg"','class="dg pg"'):''}${p.expl?`<div class="pl">${L('expl')}</div>${fixTables(t(p.expl))}`:''}`;
const pBox = id => { const p=(U.programs||[]).find(x=>x.id===id); if(!p) return ''; return `<div class="pbox"><div class="et">${L('prog')}: ${t(p.title)}</div>${progBody(p)}</div>`; };
const exBox = id => { const n=(U.numericals||[]).find(x=>x.id===id); if(!n) return ''; return `<div class="ex"><div class="et">${L('ex')}</div><div class="eq2">${t(n.q)}</div>${fixTables(t(n.a))}</div>`; };
function notes(){
  let h = `<div class="intro"><b>${t(U.title)}</b><div>${L('unit')} ${U.unit} · ${U.weightage}% ${L('intro')} · ${U.hours} ${L('hours')}</div><div>${U.intro_text ? t(U.intro_text) : L(U.programs?(META.code_lang==='python'?'intropy':'introc'):'introd')}</div></div>`;
  U.notes.forEach((sec,si)=>{
    h += `<div class="sec">${head(t(sec.title))}`;
    sec.items.forEach((it,i)=>{
      const open = si===0&&i===0 ? ' open' : '';
      if (it.h) {
        h += `<div class="card${it.key?' key':''}${open}"><div class="q hd"><span class="t">${it.key?'⭐ ':''}${t(it.h)}</span>${chev}</div>
        <div class="a rn" style="padding-left:18px">${fixTables(t(it.body)).replace(/margin:0 0 10px -36px/g,'')}${it.diagram?dgInline(it.diagram):''}${(it.examples||[]).map(exBox).join('')}${(it.programs||[]).map(pBox).join('')}</div></div>`;
      } else {
        h += `<div class="card${open}"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(it.q)}</span>${chev}</div>
        <div class="a">${fixTables(t(it.a))}${it.diagram?dgInline(it.diagram):''}</div></div>`;
      }
    });
    h += `</div>`;
  });
  return h;
}
function numericals(){
  return `<div class="sec">${head(L('numericals'))}` + (U.numericals||[]).map((n,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(n.q)}</span>${chev}</div><div class="a">${fixTables(t(n.a))}</div></div>`).join('') + `</div>`;
}
function diagrams(){
  return `<div class="sec">${head(L((U.tabs ? U.tabs.includes('flowcharts')&&!U.tabs.includes('diagrams') : U.programs&&META.code_lang!=='python')?'flowcharts':'diagrams'),false)}<div style="height:10px"></div>` + U.diagrams.map((d,i)=>
    `<div class="dcard" data-dg="${d.id}"><div class="h">${i+1}. ${t(d.title)}</div>${SVG[d.id]}</div>`).join('') + `</div>`;
}
function equations(){
  return U.equations.map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><span class="fbox">${e.f}</span></span>${chev}</div>
     <div class="a"><p>${t(e.terms)}</p></div></div>`).join('') + `</div>`).join('');
}
function viva(){
  // two shapes exist in the corpus: flat [{q,a}] and grouped [{title, items:[{q,a}]}]
  const groups = U.viva.every(v=>v && v.q) ? [{items: U.viva}] : U.viva;
  return groups.map(g=>{
    const items = g.items || [];
    return `<div class="sec">${g.title?head(t(g.title)):''}` + items.map((v,i)=>
      `<div class="card"><div class="q hd"><span class="n">${i+1}.</span><span class="t">${t(v.q)}</span>${chev}</div><div class="a"><p>${t(v.a)}</p></div></div>`).join('') + `</div>`;
  }).join('');
}
function exam(){
  return `<div class="sec">${head(L('examhead'),false)}` + U.exam_questions.map((x,i)=>
    `<div class="card"><div class="q" style="cursor:default"><span class="n">${i+1}.</span><span class="t">${t(x.q)}</span><span class="mk">${x.marks} ${L('marks')}</span></div></div>`).join('') + `</div>`;
}
function programs(){
  return `<div class="sec">${head(L('programs'))}` + (U.programs||[]).map((p,i)=>
    `<div class="card"><div class="q hd"><span class="n">${i+1}.</span><span class="t">${t(p.title)}</span>${chev}</div><div class="a pa">${progBody(p)}</div></div>`).join('') + `</div>`;
}
function syntax(key){
  return (U[typeof key==='string'?key:'syntax']||[]).map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><pre class="code sx">${hl(e.f)}</pre></span>${chev}</div>
     <div class="a">${e.terms && t(e.terms) ? fixTables(t(e.terms)) : ''}</div></div>`).join('') + `</div>`).join('');
}
const flowcharts = diagrams;
const algorithms = () => syntax('algorithms');
const ALLV = {notes, programs, diagrams, flowcharts, algorithms, syntax, equations, numericals, viva, exam};
const VIEWS = U.tabs ? Object.fromEntries(U.tabs.map(k=>[k, ALLV[k]])) : U.programs ? (META.code_lang==='python' ? {notes, programs, diagrams, syntax, viva, exam} : {notes, programs, flowcharts, syntax, viva, exam}) : U.numericals ? {notes, diagrams, equations, numericals, viva, exam} : {notes, diagrams, equations, viva, exam};
function render(){
  document.getElementById('title').textContent = `${L('unit')} ${U.unit}: ${t(U.title)}`;
  document.getElementById('sub').textContent = `${t(META.name)} · ${META.code}`;
  document.getElementById('lang').textContent = S.lang==='en' ? 'ગુ' : 'EN';
  document.getElementById('lang').style.display = META.languages.includes('gu') ? '' : 'none';
  document.getElementById('tabs').innerHTML = Object.keys(VIEWS).map(k=>`<button class="tab${S.tab===k?' on':''}" data-tab="${k}">${L(k)}</button>`).join('');
  document.getElementById('view').innerHTML = VIEWS[S.tab]();
  document.querySelectorAll('#view pre.c').forEach(e=>{ e.innerHTML = hl(e.textContent); e.className='code'; });
}
let zoom = 1;
function setZoom(z){ zoom = Math.min(4, Math.max(1, z)); const w=document.getElementById('zw'); w.style.width=(zoom*100)+'%'; document.getElementById('zr').textContent=Math.round(zoom*100)+'%'; }
document.addEventListener('click', e=>{
  const q = e.target.closest('.q'); if (q && q.parentElement.querySelector('.a')) { q.parentElement.classList.toggle('open'); return; }
  const tb = e.target.closest('[data-tab]'); if (tb){ S.tab = tb.dataset.tab; render(); window.scrollTo(0,0); return; }
  if (e.target.closest('#lang')){ S.lang = S.lang==='en'?'gu':'en'; render(); return; }
  const m = e.target.closest('[data-more]');
  document.querySelectorAll('.menu.show').forEach(x=>{ if(!m || x!==m.nextElementSibling) x.classList.remove('show'); });
  if (m){ m.nextElementSibling.classList.toggle('show'); return; }
  const act = e.target.closest('[data-act]');
  if (act){ act.closest('.sec').querySelectorAll('.card').forEach(c=>{ if(c.querySelector('.a')) c.classList.toggle('open', act.dataset.act==='expand'); }); act.parentElement.classList.remove('show'); return; }
  const dg = e.target.closest('[data-dg]');
  if (dg){ const id=dg.dataset.dg; document.getElementById('mt').textContent=t(U.diagrams.find(d=>d.id===id).title); document.getElementById('zw').innerHTML=SVG[id]; setZoom(1); document.getElementById('modal').classList.add('show'); return; }
  if (e.target.closest('#mx')) document.getElementById('modal').classList.remove('show');
  if (e.target.closest('#zi')) setZoom(zoom+0.5);
  if (e.target.closest('#zo')) setZoom(zoom-0.5);
  if (e.target.closest('#zr')) setZoom(1);
});
render();
</script>
