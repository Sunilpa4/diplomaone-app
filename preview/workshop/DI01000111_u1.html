<title>Engineering Graphics – Unit 1</title>
<style>
:root{--p:#7B2CD9;--pd:#6420B8;--lav:#EADDF7;--bg:#F3ECFA;--ink:#1d1b20}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#d8cce8;font-family:"Noto Sans Gujarati","Shruti","Nirmala UI",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink)}
.phone{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:70px;position:relative}
.bar{position:sticky;top:0;z-index:10;background:var(--p);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.top{display:flex;align-items:center;gap:14px;padding:14px 14px 10px}
.top svg{flex:none}
.ttl{flex:1;min-width:0}
.ttl b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{opacity:.85;font-size:12.5px}
.lang{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:18px;padding:6px 12px;font-weight:700;font-size:14px;cursor:pointer}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;padding:0 6px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;color:rgba(255,255,255,.75);padding:10px 14px 12px;font-size:14.5px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;background:none;border-top:0;border-left:0;border-right:0}
.tab.on{color:#fff;border-bottom-color:#fff}
.sec{margin-bottom:14px}
.sh{background:var(--lav);display:flex;align-items:center;justify-content:space-between;padding:16px 14px 16px 18px;font-weight:800;font-size:17px;position:relative}
.more{background:none;border:0;padding:4px 6px;cursor:pointer;border-radius:50%}
.menu{display:none;position:absolute;right:12px;top:48px;background:#fff;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.18);z-index:5;overflow:hidden;min-width:150px}
.menu.show{display:block}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:12px 16px;font-size:14.5px;cursor:pointer}
.menu button:hover{background:#f4eefc}
.card{background:#fff;border-radius:6px;margin:0 0 8px;box-shadow:0 1px 3px rgba(60,20,110,.14)}
.q{display:flex;gap:10px;align-items:flex-start;padding:16px 14px 16px 18px;color:var(--p);font-size:16.5px;line-height:1.45;cursor:pointer}
.q .n{flex:none;min-width:24px}
.q .t{flex:1}
.q.hd{font-weight:700}
.chev{flex:none;transition:transform .2s;margin-top:1px}
.card.open .chev{transform:rotate(180deg)}
.a{display:none;padding:0 16px 18px 52px;font-size:15.5px;line-height:1.65;color:#222}
.card.open .a{display:block;animation:fd .2s}
@keyframes fd{from{opacity:0;transform:translateY(-4px)}to{opacity:1}}
.a p{margin:0 0 10px}.a ul,.a ol{margin:0 0 10px;padding-left:20px}.a li{margin-bottom:4px}
.a b{color:#111}
.eq{background:#F5EEFD;border-left:4px solid var(--p);padding:8px 12px;border-radius:4px;font-weight:700;font-size:16.5px;color:var(--pd)}
.math{background:#F5EEFD;border-left:4px solid var(--p);border-radius:6px;padding:10px 14px;margin:6px 0 12px;font-family:var(--mono,ui-monospace,monospace);font-size:15px;line-height:1.6;color:var(--pd);overflow-x:auto;white-space:pre-wrap}
.tw{overflow-x:auto;margin:0 0 10px -36px;padding-left:0}
table{border-collapse:collapse;font-size:13.5px;min-width:100%;line-height:1.4}
th{background:var(--p);color:#fff;text-align:left;padding:7px 8px;font-weight:700}
td{border-bottom:1px solid #eadff6;padding:7px 8px;vertical-align:top}
tr:nth-child(even) td{background:#faf7fe}
.dg{margin:6px 0 4px -36px;border:1px solid #eadff6;border-radius:10px;overflow:hidden;cursor:zoom-in;background:#fff}
.dg svg{display:block;width:100%;height:auto}
.dg.pg{margin-left:0}
.dgc{font-size:12px;color:#7a6f88;text-align:center;margin:-2px 0 10px -36px}
.dcard{background:#fff;border-radius:10px;margin:0 10px 12px;box-shadow:0 1px 3px rgba(60,20,110,.14);overflow:hidden;cursor:zoom-in}
.dcard .h{padding:12px 14px;color:var(--p);font-weight:700;font-size:15.5px;border-bottom:1px solid #f0e8f9}
.dcard svg{display:block;width:100%;height:auto}
.fbox{margin:4px 0 0;background:#F5EEFD;border-radius:6px;padding:9px 12px;font-size:18px;font-weight:700;color:var(--pd);display:inline-block}
.q .t .nm{display:block}
.mk{flex:none;background:#FFF1D6;color:#9A5B00;border-radius:12px;padding:2px 9px;font-size:12.5px;font-weight:800;margin-top:2px}

.mb svg{display:block;width:100%;height:auto}

.a h4{margin:14px 0 6px;color:var(--pd);font-size:15.5px}
.a h4:first-child{margin-top:0}
.card.key{border-left:4px solid #2E7D32}
.card.key .q{color:#1B5E20}

.a.rn .dg,.a.rn .dgc,.a.rn .tw,.a.rn .ex{margin-left:0}
.intro{margin:12px 10px;background:linear-gradient(135deg,#8E3BE8,#5B1BB0);color:#fff;border-radius:14px;padding:14px 16px}

.chips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

.kw{color:#C792EA;font-weight:700}.ty{color:#82AAFF}.st{color:#C3E88D}.cm{color:#8E9AAF;font-style:italic}.pp{color:#F78C6C}.nu{color:#F9C46B}.fn{color:#FFCB6B}

@media (max-width:480px){pre.code,pre.out{font-size:11.5px;padding:9px 10px}}
.a code{background:#F1E9FB;color:#5B1BB0;padding:1px 5px;border-radius:4px;font-family:Consolas,"DejaVu Sans Mono",monospace;font-size:.9em}

.sx{margin:6px 0 0;font-size:12.5px;padding:8px 10px}
.a.pa{padding-left:16px}

<script>
const U = {"subject": "DI01000111", "unit": 1, "format": "notes", "title": {"en": "Introduction to Engineering Graphics"}, "hours": 4, "weightage": 10, "official": true, "languages": ["en"], "tabs": ["notes", "diagrams", "equations", "viva", "exam"], "intro_text": {"en": "Unit 1 of Engineering Graphics: the sheet and the instrument box, the eight line types of BIS SP 46 with their two thicknesses, dimensioning element by element, the representative fraction and the plain scale, and regular polygons by the general method and by the set-square short cuts. Every topic is written as a numbered construction - step 1, step 2, check - with a diagram that shows the construction lines, and seven fully solved drawing problems follow in section 4."}, "notes": [{"title": {"en": "1. The Sheet, the Lines and the Instrument Box"}, "items": [{"h": {"en": "1.1 The drawing sheet, the border and the title block"}, "body": {"en": "<h4>What is on the sheet before any object</h4><p>A drawing is a legal document: the part is made exactly as the sheet says, so the sheet itself follows a standard. BIS SP 46 fixes the paper sizes, the border, the title block and the lettering. The A series halves at every step - A0 is 841 x 1189 mm, A1 is 594 x 841, A2 is 420 x 594, A3 is 297 x 420 and A4 is 210 x 297 - and your practical work is done on A2.</p><h4>Instruments and what each one is for</h4><table><tr><th>Instrument</th><th>Used for</th></tr><tr><td>Drawing board and T-square</td><td>a true horizontal, and the guide for every vertical through a set square</td></tr><tr><td>45 and 30-60 set squares</td><td>15, 30, 45, 60, 75 and 90 degree lines, parallel lines and perpendiculars</td></tr><tr><td>Compass</td><td>circles and arcs, with the needle point exactly at the centre</td></tr><tr><td>Divider</td><td>transferring a length - dividing a line or a circle into equal parts</td></tr><tr><td>Scale (plain and diagonal)</td><td>measuring to 1 mm, and reading a drawing at its reduced size</td></tr><tr><td>Protractor</td><td>any angle that a set square cannot give, such as 72 degrees for a pentagon</td></tr><tr><td>French curve</td><td>smooth curves that are not circular, such as an ellipse or a parabola</td></tr><tr><td>Pencils 2H, H and HB</td><td>2H for construction lines, H for the final outlines, HB for lettering</td></tr></table><h4>Construction, step by step</h4><ol><li>Clean the board and fix the sheet with its top edge parallel to the board edge; test with the T-square before you tape the four corners.</li><li>Draw the border 10 mm inside the trimming edge on three sides and 20 mm on the left, which is the filing margin.</li><li>Draw the title block in the bottom right corner, 65 mm wide and about 30 mm high, and divide it into rows for the name, roll number, class, subject, title, scale, date and sheet number.</li><li>Write the title of the problem in 7 mm capitals inside the block and every other entry in 5 mm letters; lettering is part of the drawing, not a note added later.</li><li>Draw all construction work in 2H thin lines, then ink the final outline in a thick H line, and only then letter the dimensions.</li></ol><p><b>Why it works.</b> The border and the block are always in the same place, so a stranger can pick up the sheet and find out what it is, who drew it and at what scale without asking. The 20 mm margin is punched for filing and never used for a drawing.</p><p><b>Common mistake.</b> Fixing the sheet by eye makes every horizontal slightly tilted, and no T-square can repair that later. Test the top edge first.</p>"}, "diagram": "u1_sheet", "syllabus_item": "1.1"}, {"h": {"en": "1.2 Line types and what each one means"}, "body": {"en": "<h4>The alphabet of the drawing</h4><p>Every line on a drawing has one meaning, and the thickness carries as much information as the shape. BIS SP 46 gives two thicknesses only, in the ratio 2:1 or 3:1 - a thick line of about 0.5 mm and a thin line of about 0.25 mm - and the reader must never have to guess which is which.</p><table><tr><th>Line</th><th>Thickness</th><th>Meaning and use</th></tr><tr><td>Continuous thick</td><td>0.5 mm</td><td>visible outlines and visible edges of the object</td></tr><tr><td>Continuous thin</td><td>0.25 mm</td><td>dimension lines, extension lines, leaders, hatching, short centre lines</td></tr><tr><td>Dashed thin</td><td>0.25 mm</td><td>hidden outlines and hidden edges</td></tr><tr><td>Continuous thin wavy or zig-zag</td><td>0.25 mm</td><td>the limit of a partial view or a broken-out section</td></tr><tr><td>Chain thin</td><td>0.25 mm</td><td>centre lines, pitch circles, the path of a moving part</td></tr><tr><td>Chain thin with thick ends</td><td>0.25 / 0.5 mm</td><td>the cutting plane line of a section</td></tr><tr><td>Chain thick</td><td>0.5 mm</td><td>the surface that has to be heat treated or coated</td></tr><tr><td>Continuous thin, double dash</td><td>0.25 mm</td><td>outline of an adjacent part, or an alternate position</td></tr></table><h4>Construction, step by step</h4><ol><li>Draw every horizontal with the T-square, sliding it along the board with the left hand and keeping the pencil at a steady 60 degrees.</li><li>Draw every vertical and every 15, 30, 45, 60 or 75 degree line with the set square resting on the T-square; never rotate the board.</li><li>Draw a circle with the compass: prick the centre with the needle, set the radius on the scale, and turn the compass by the knurled knob, not by the legs.</li><li>Keep the gap between dashes equal to about four times the dash length, and start and end a hidden line with a dash, never with a gap.</li><li>Let a centre line project 2 to 3 mm beyond the outline on both sides.</li></ol><p><b>Why it works.</b> Hidden edges are dashed, not thin continuous, so that a hole behind a face can be told apart from a groove on the face. A cutting-plane line has thick ends so that the arrows showing the direction of sight cannot be missed.</p><p><b>Check before you ink.</b> Stand back a metre: the thick outline must be clearly heavier than the dimension lines, and no two lines of the same weight should meet at a point where the meaning is unclear.</p>"}, "diagram": "u1_lines", "syllabus_item": "1.2"}]}, {"title": {"en": "2. Dimensioning and the Plane Scale"}, "items": [{"h": {"en": "1.2 Dimensioning: the four parts of one dimension"}, "body": {"en": "<h4>Anatomy of a dimension</h4><p>A dimension has an extension line, a dimension line, two arrowheads and a figure. BIS SP 46 fixes the proportions: the arrowhead is about 3 mm long and 1 mm wide, the figure is 3 mm high and sits 1 mm above an unbroken dimension line, and the extension line starts 2 mm away from the object and runs 3 mm past the dimension line.</p><table><tr><th>Element</th><th>Rule as per BIS SP 46</th></tr><tr><td>Unit</td><td>millimetres, written without the symbol; 60 means 60 mm</td></tr><tr><td>Extension line</td><td>thin, perpendicular to the dimension line, 2 mm clear of the outline and 3 mm beyond the arrow</td></tr><tr><td>Dimension line</td><td>thin, parallel to the edge being measured, with a gap in the middle when the space is too small for the figure</td></tr><tr><td>Figure</td><td>3 mm high, placed above the dimension line and read from the bottom or from the right - the unidirectional system</td></tr><tr><td>Arrowhead</td><td>3:1 long to wide, filled, touching the extension line</td></tr><tr><td>Leader</td><td>thin line with a shoulder, used for a radius, a diameter or a note when the dimension will not fit inside</td></tr><tr><td>Symbols</td><td>Ø for diameter, R for radius, SR for spherical radius, □ for a square face, C or 45 x 5 for a chamfer</td></tr><tr><td>Repetition</td><td>give a size once, and use 4 x Ø 8 for a repeated feature instead of four separate leaders</td></tr></table><h4>Construction, step by step</h4><ol><li>Mark the overall length, the overall breadth and the overall height first; they are what a machinist checks the material against.</li><li>Add the location dimensions that fix every hole, step or slot from one datum face rather than from each other, so errors do not add up.</li><li>Add the size dimensions - the diameter of each hole, the radius of each fillet - each once only.</li><li>Draw the extension lines first, then the dimension lines, then the arrowheads, and write the figures last so that nothing is written twice.</li><li>Take every dimension off the object or the drawing, never off a scaled printout, and check that no dimension is missing and none is repeated.</li></ol><p><b>Why it works.</b> A drawing that is fully dimensioned needs no scale: the reader never measures the print, only reads the numbers. That is why one missing dimension stops production and one repeated dimension invites two different readings.</p><p><b>Common mistake.</b> Dimensioning to a hidden line, or leaving the dimension line inside the object, forces the reader to measure - both are rejected in the exam and in the shop.</p><p><b>Check before you ink.</b> Every feature has a size and a location, nothing is dimensioned twice, and the figures are all readable from the bottom or the right of the sheet.</p>"}, "diagram": "u1_dim", "syllabus_item": "1.2"}, {"h": {"en": "1.2 Plane scale and the representative fraction"}, "body": {"en": "<h4>The one number that makes a drawing readable</h4><p>A drawing is nearly always smaller than the object, so every length is multiplied by the same fraction. The <b>representative fraction</b> is the drawing length divided by the actual length, and it is written under the scale on every sheet:</p><h4>Formulae</h4><ul><li><b>RF = drawing length / actual length</b>, and it is always written as 1 : 50, not as 1/50, so that both terms carry a unit-free ratio.</li><li><b>Length of the scale on paper = RF x maximum distance to be measured.</b></li><li>For RF 1:50 and a maximum distance of 6 m: length = (1/50) x 6 x 1000 = 120 mm.</li><li>A plain scale reads two units - metres and decimetres; a diagonal scale reads three - metres, decimetres and centimetres.</li></ul><h4>Worked example - a plain scale of RF 1:50 to read 6 m and 1 dm</h4><h4>Construction, step by step</h4><ol><li>Convert the maximum distance to the same unit as the drawing: 6 m = 6000 mm.</li><li>Length of scale = 6000 / 50 = 120 mm. Draw a rectangle 120 mm long and 5 mm high and mark its centre line.</li><li>Divide the length into six equal parts of 20 mm each; each part represents 1 m.</li><li>Subdivide the leftmost part into ten equal parts of 2 mm each; each of these represents 1 dm.</li><li>Write 0 at the first division, then 1, 2, 3, 4 and 5 to the right - the metres - and 0.1, 0.2 ... 0.9 to the left of zero, reading outwards, for the decimetres.</li><li>Write the RF as 1:50 and the units as metres and decimetres below the scale.</li></ol><p><b>Why it works.</b> The scale is drawn once and used for every length on the sheet: a distance on the drawing is picked up with the divider, laid on the scale, and read as metres plus decimetres without any arithmetic - which is exactly what a scale is for.</p><p><b>Check before you ink.</b> The whole length must be RF x the largest distance, and the smallest division must equal the smallest distance to be read: 2 mm for 1 dm at 1:50.</p><p><b>Common mistake.</b> Forgetting to convert metres to millimetres makes the scale 1000 times too short; checking that the 6 m scale is 120 mm long catches it at once.</p>"}, "diagram": "u1_scale", "syllabus_item": "1.2"}]}, {"title": {"en": "3. Regular Polygons, Step by Step"}, "items": [{"h": {"en": "1.3 The general method - any polygon in a circle"}, "body": {"en": "<h4>One construction for five sides, seven sides or eleven</h4><p>A regular polygon has every side equal and every angle equal, so all its corners lie on one circle. The general method inscribes a polygon of any number of sides n in a circle of known radius, and the exam accepts it for any polygon because no particular method may be asked.</p><h4>Construction, step by step</h4><ol><li>Draw the circle of radius R about the centre O, and draw the vertical diameter AB with the T-square and set square.</li><li>Divide AB into n equal parts with the divider - for a pentagon, five parts; number the division points 1, 2, 3 ... from A downwards.</li><li>With centre A and radius equal to the diameter AB, draw an arc on each side of AB to cut the horizontal centre line at P and Q.</li><li>From P draw a straight line through the second division point and produce it to cut the circle at C; from Q draw a line through the same second division point to cut the circle at D. C and D are two corners of the polygon.</li><li>Step the chord CD round the circle with the divider - it goes exactly n times - and join the points in order to get the polygon.</li><li>Ink the outline thick, leave the construction thin, and letter the side length.</li></ol><h4>The sizes you can predict before you start</h4><ul><li>Central angle of a regular polygon = 360 / n degrees; for a pentagon, 72 degrees.</li><li>Side of a polygon inscribed in a circle of diameter D: s = D x sin(180 / n).</li><li>Interior angle = (n - 2) x 180 / n; for a pentagon, 108 degrees.</li><li>Circumradius of a pentagon of side s: R = s / (2 sin 36) = 0.8507 s.</li></ul><p><b>Why it works.</b> The two arcs from A and Q deliver the corner D because the chord of a circle is set out by equal angles at the circumference; the construction is a graphical solution of the same trigonometry listed above.</p><p><b>Check before you ink.</b> The last side must close exactly on the first point. If it overlaps by 2 mm, the divider slipped - divide again rather than average the error.</p>"}, "diagram": "u1_poly", "syllabus_item": "1.3"}, {"h": {"en": "1.3 Hexagon and octagon - the fast constructions"}, "body": {"en": "<h4>When n divides 360 or 90, use the set square</h4><p>A hexagon and an octagon can be built far faster than by the general method because 60 and 45 degrees are the angles of the two set squares. Both constructions are shown in the diagram and both are acceptable in the exam.</p><h4>Hexagon in a circle, radius R - across corners given</h4><h4>Construction, step by step</h4><ol><li>Draw the circle of radius R and one horizontal centre line.</li><li>Without changing the compass from R, step round the circle from any point on it: each chord of a circle is equal to R at the centre when the angle is 60 degrees, so the divider goes exactly six times and closes.</li><li>Join the six points; the hexagon is complete.</li><li>For a hexagon given across flats F instead, draw a circle of radius F / 1.732, then draw the six sides at 60 degrees from the flats.</li></ol><h4>Octagon in a square of side a</h4><h4>Construction, step by step</h4><ol><li>Draw the square of side a and both diagonals; their crossing is the centre.</li><li>With the centre as centre and radius equal to half the diagonal, draw the circumscribing circle - it touches the four sides of the square.</li><li>With each corner of the square as centre and radius equal to a / 2, draw an arc cutting the two sides that meet at that corner; repeat at all four corners.</li><li>Join the eight points in order: four on the sides of the square and four on the circle where the diagonals cut it.</li><li>Check that all eight sides measure 0.414 a, which is the side of a regular octagon inscribed in a square of side a.</li></ol><p><b>Why it works.</b> The hexagon works because a chord equal to the radius subtends exactly 60 degrees at the centre, and six 60 degree chords fill the circle. The octagon works because the corner trimmed off is an isosceles right triangle whose legs are a / 2.</p><p><b>Common mistake.</b> Opening the compass while stepping round the hexagon closes the figure on a gap or an overlap; set the radius once, and never change it until the six points are marked.</p>"}, "diagram": "u1_hex", "syllabus_item": "1.3"}]}, {"title": {"en": "4. Solved Drawing Problems, Step by Step"}, "items": [{"h": {"en": "Problem 1. Lay out an A2 drawing sheet, ready to start a problem."}, "body": {"en": "<h4>What the sheet must carry</h4><p>A2 is 420 x 594 mm and is used in the landscape position. The layout is fixed by BIS SP 46, so it is drawn first, in 2H thin lines, and inked only at the end.</p><h4>Construction, step by step</h4><ol><li>Draw the trimming outline 420 x 594 mm and check both diagonals with the scale; a sheet that is not square cannot be corrected later.</li><li>Draw the border 10 mm inside the trimming edge on the top, right and bottom, and 20 mm on the left. The left margin is the filing margin and nothing is drawn in it.</li><li>Draw the title block in the bottom right corner, 65 mm wide and 30 mm high, with its right and bottom edges on the border.</li><li>Divide the block into rows and write: name of the institute, title of the problem, name and roll number of the student, class and division, subject and code, scale, date, and sheet number.</li><li>Write the title in 7 mm capitals and every other entry in 5 mm capitals, using HB pencil and single-stroke letters.</li><li>Leave the space above the title block free for the view that will be drawn, and check that there is room to dimension it.</li></ol><p><b>Answer.</b> A2 landscape, 10 mm border on three sides and 20 mm filing margin on the left, a 65 x 30 mm title block in the bottom right corner, all construction in 2H and all lettering in HB - the sheet is then ready for the first view.</p>"}}, {"h": {"en": "Problem 2. Draw a plain scale of RF 1:50 to read metres and decimetres, long enough for 6 m. Show a distance of 3.7 m on it."}, "body": {"en": "<h4>Given and required</h4><p>RF = 1:50, maximum distance = 6 m, and the scale must read to 1 dm = 0.1 m.</p><h4>Construction, step by step</h4><ol><li>Convert the maximum distance into millimetres: 6 m = 6000 mm.</li><li>Length of scale = RF x maximum distance = (1/50) x 6000 = 120 mm.</li><li>Draw a rectangle 120 mm long and 5 mm high, and a centre line through it.</li><li>Divide the 120 mm into six equal parts of 20 mm; each part is 1 m.</li><li>Divide the leftmost 20 mm part into ten equal parts of 2 mm; each part is 1 dm = 0.1 m.</li><li>Mark 0 at the first division, 1, 2, 3, 4 and 5 to the right for the metres, and 0.1, 0.2 ... 0.9 to the left of zero for the decimetres.</li><li>Write RF = 1:50 and the units - metres and decimetres - below the scale.</li></ol><h4>Showing 3.7 m</h4><p>Set the divider from 0 to 3 on the right (3 m), then add 0.7 m by opening it from the 0.7 mark on the left to the 3 m mark: the total span is 3.7 m. On this scale 3.7 m measures 3.7 x 20 = 74 mm.</p><h4>Check</h4><p>The whole scale must be 120 mm for 6 m, and the smallest division 2 mm for 0.1 m. Both confirm that the RF and the arithmetic are right before any ink is used.</p><p><b>Answer.</b> A 120 mm plain scale, six 20 mm metre divisions, the leftmost split into ten 2 mm decimetre parts, graduated 0 to 5 m to the right of zero and 0.1 to 0.9 m to the left; 3.7 m measures 74 mm on it.</p>"}}, {"h": {"en": "Problem 3. Dimension the stepped plate shown, fully and as per BIS SP 46."}, "body": {"en": "<h4>The plate</h4><p>A plate 100 mm long, 60 mm wide and 20 mm thick has a step 40 mm from the left end, a Ø 20 mm hole whose centre is 25 mm from the left end and 30 mm from the bottom edge, a R 10 mm fillet at the top right corner and a 45 x 5 mm chamfer at the bottom left.</p><h4>Construction, step by step</h4><ol><li>Draw the three overall dimensions first - 100, 60 and 20 - outside the outline, 10 mm away from it, so that every other dimension sits inside them.</li><li>Choose the left face and the bottom face as the datum and give the location of the step and of the hole from those two faces only: 40 for the step, 25 and 30 for the hole centre.</li><li>Give the size of each feature once: Ø 20 with a leader to the circle, R 10 with a leader to the fillet, and 45 x 5 written as a note for the chamfer.</li><li>Draw the extension lines 2 mm clear of the outline and 3 mm past the dimension line, then the thin dimension lines, then filled arrowheads 3 mm long.</li><li>Write each figure 3 mm high, 1 mm above its dimension line, all readable from the bottom or from the right of the sheet.</li><li>Check the list: every feature has a size and a location, no dimension is repeated, and no dimension is attached to a hidden line.</li></ol><h4>What is deliberately not dimensioned</h4><p>The position of the fillet centre is implied by R 10 and the two faces it touches, and the chamfer is fully described by 45 x 5, so neither needs a second figure. Adding them is over-dimensioning, which is an error, not extra care.</p><p><b>Answer.</b> Three overall dimensions 100 x 60 x 20 outside the outline; location dimensions 40, 25 and 30 from the datum faces; sizes Ø 20, R 10 and 45 x 5 led once each; all figures 3 mm high, unidirectional, with 2 mm gaps at the outline.</p>"}}, {"h": {"en": "Problem 4. Construct a regular pentagon of 40 mm side by the general method."}, "body": {"en": "<h4>Before drawing, predict the answer</h4><p>Central angle = 360 / 5 = 72 degrees; interior angle = 108 degrees; circumradius R = 40 / (2 sin 36) = 40 / 1.1756 = 34.03 mm. So the pentagon fits in a circle of radius 34 mm, which is what the construction draws.</p><h4>Construction, step by step</h4><ol><li>Draw a circle of radius 34 mm about the centre O, and the vertical diameter AB.</li><li>Divide AB into five equal parts with the divider, and number the points 1 to 4 from A.</li><li>With centre A and radius equal to the diameter (68 mm), draw an arc on each side of AB to cut the horizontal centre line at P and Q.</li><li>Join P to the second division point and produce it to cut the circle at C; join Q to the same division point and produce it to cut the circle at D.</li><li>Step the chord CD round the circle with the divider; it closes exactly after five steps and gives the vertices C, D, E, F, G.</li><li>Join the five vertices in order in a thick line, and ink the construction in thin lines.</li><li>Measure one side: it must read 40 mm. If it does not, the division of AB was inaccurate, not the stepping.</li></ol><h4>Checking the angle</h4><p>At every corner the interior angle must measure 108 degrees. A quick check with the protractor at C and D is enough to catch a wrong division point.</p><p><b>Answer.</b> A pentagon of 40 mm side inscribed in a circle of radius 34.03 mm, built from the five-part division of the diameter and the two arcs of radius 68 mm from A; every side measures 40 mm and every angle 108 degrees.</p>"}}, {"h": {"en": "Problem 5. Construct a regular hexagon of 60 mm across flats by the set-square method."}, "body": {"en": "<h4>The two sizes of a hexagon</h4><p>Across flats (AF) is the distance between two opposite sides; across corners (AC) is the distance between two opposite corners. For a regular hexagon AF = 1.732 R and AC = 2 R, and the side equals R.</p><h4>Construction, step by step</h4><ol><li>From AF = 60 mm, find the circumradius: R = 60 / 1.732 = 34.64 mm, and the side = 34.64 mm. Across corners = 2 x 34.64 = 69.3 mm.</li><li>Draw the two centre lines crossing at O at 90 degrees, and set out 34.64 mm each way along both, giving the top, bottom, left and right points of the circle.</li><li>Draw the circle of radius 34.64 mm, then the two horizontal flats 30 mm above and below O, each tangent to the circle.</li><li>Place the 30-60 set square on the T-square with its 60 degree edge through the top point, and draw the two sloping sides to meet the flats.</li><li>Turn the set square over and repeat through the bottom point, giving the remaining two sloping sides.</li><li>Measure the two pairs of parallel sides: each flat must be 34.64 mm and the flats 60 mm apart.</li></ol><h4>Why the set square is allowed</h4><p>Every side of a regular hexagon lies at 60 degrees to the next, and 60 degrees is exactly an edge of the 30-60 set square, so the construction needs no compass work after the circle.</p><p><b>Answer.</b> A hexagon with 60 mm between opposite flats, 69.3 mm between opposite corners, six sides of 34.64 mm, drawn with the circle and the 30-60 set square.</p>"}}, {"h": {"en": "Problem 6. Construct a regular octagon inside a square of 60 mm side."}, "body": {"en": "<h4>The number to remember</h4><p>In a square of side a the largest regular octagon has side 0.4142 a. For a = 60 mm the side is 24.85 mm, and the four corner triangles trimmed off are isosceles right triangles with legs 60 - 24.85 = 17.6 mm on each side of the corner, i.e. 60 x 0.293 = 17.6 mm.</p><h4>Construction, step by step</h4><ol><li>Draw the square ABCD of 60 mm side and both diagonals; their crossing is the centre O.</li><li>With centre O and radius 30 mm (half the diagonal is 42.4 mm, but the circle that touches the sides is the easier reference) draw the circle inscribed in the square.</li><li>With each corner as centre and radius 30 mm, draw an arc cutting the two sides that meet at that corner; mark the eight points so produced, two on each side.</li><li>Join the eight points in order: the four mid-side points of the circle and the four points where the diagonals cut the circle.</li><li>Measure a side: it must read 24.85 mm, and 0.4142 x 60 = 24.85 mm confirms it.</li><li>Ink the octagon thick and leave the square and the diagonals thin.</li></ol><h4>Second acceptable method</h4><p>Mark 17.6 mm from each corner along both sides, join the neighbouring marks across the corner, and the eight points are obtained without the circle. Both methods are accepted; the second is faster and the first shows the geometry.</p><p><b>Answer.</b> A regular octagon of 24.85 mm side inside the 60 mm square, with four sides on the square and four sides cutting the corners, each corner trimmed by 17.6 mm.</p>"}}, {"h": {"en": "Problem 7. Draw a regular polygon of seven sides in a circle of 70 mm diameter and state its side."}, "body": {"en": "<h4>Prediction</h4><p>Side s = D sin(180/7) = 70 x sin 25.714 degrees = 70 x 0.4339 = 30.37 mm; central angle = 360/7 = 51.43 degrees; interior angle = (7 - 2) x 180 / 7 = 128.57 degrees.</p><h4>Construction, step by step</h4><ol><li>Draw the circle of radius 35 mm and the vertical diameter AB.</li><li>Divide AB into seven equal parts with the divider and number them from A.</li><li>With centre A and radius 70 mm, cut the horizontal centre line on both sides at P and Q.</li><li>Join P and Q to the second division point and produce them to meet the circle at C and D.</li><li>Step the chord CD round the circle seven times; it must close on the starting point.</li><li>Join the seven vertices; measure a side and compare it with 30.37 mm.</li></ol><p><b>Answer.</b> A heptagon in a 70 mm circle with side 30.37 mm, central angle 51.43 degrees and interior angle 128.57 degrees.</p>"}}]}], "diagrams": [{"id": "u1_sheet", "title": {"en": "The A2 sheet: border, filing margin, title block"}, "file": "diagrams/u1_sheet.svg", "caption": {"en": "Fix the sheet square, draw the border 10 mm in and 20 mm on the left, and put the 65 mm title block in the bottom right corner before any view."}}, {"id": "u1_lines", "title": {"en": "Eight BIS line types and what they mean"}, "file": "diagrams/u1_lines.svg", "caption": {"en": "Two thicknesses only, 0.5 mm and 0.25 mm: the weight of a line tells the reader what the line is."}}, {"id": "u1_dim", "title": {"en": "Anatomy of a dimension on a plate"}, "file": "diagrams/u1_dim.svg", "caption": {"en": "Extension line, dimension line, arrowhead and figure - and the figure is 3 mm high, 1 mm above a thin unbroken line."}}, {"id": "u1_scale", "title": {"en": "Plain scale, RF 1:50, six metres"}, "file": "diagrams/u1_scale.svg", "caption": {"en": "120 mm of paper carries six metres: the leftmost 20 mm is split into ten 2 mm decimetres, so 3.7 m is read without arithmetic."}}, {"id": "u1_poly", "title": {"en": "Pentagon by the general method, 5 steps"}, "file": "diagrams/u1_poly.svg", "caption": {"en": "Divide the vertical diameter into n parts, arc from the top with the diameter, and two rays give the first chord - then step it round the circle."}}, {"id": "u1_hex", "title": {"en": "Hexagon by compass, octagon in a square"}, "file": "diagrams/u1_hex.svg", "caption": {"en": "A chord equal to the radius steps the hexagon in six; in a square, 0.414 of the side is the octagon side."}}], "equations": [{"title": {"en": "Scale"}, "items": [{"name": {"en": "Representative fraction"}, "f": "RF = drawing length / actual length = 1 : n", "terms": {"en": "Written under the scale of every drawing; both lengths in the same unit, so the ratio has no unit."}}, {"name": {"en": "Length of the scale"}, "f": "L = RF x maximum distance to be measured", "terms": {"en": "For RF 1:50 and 6 m, L = (1/50) x 6000 = 120 mm. This is the length drawn on the paper, not the length of the object."}}, {"name": {"en": "Smallest division"}, "f": "smallest division = RF x smallest distance to be read", "terms": {"en": "At 1:50 a decimetre is 100 / 50 = 2 mm on paper, which is the practical limit for a plain scale."}}]}, {"title": {"en": "Regular polygons"}, "items": [{"name": {"en": "Central angle"}, "f": "theta = 360 / n degrees", "terms": {"en": "The angle each side subtends at the centre: 72 degrees for a pentagon, 60 degrees for a hexagon, 45 degrees for an octagon."}}, {"name": {"en": "Side from the diameter"}, "f": "s = D sin(180 / n)", "terms": {"en": "For n = 5 and D = 70 mm, s = 70 sin 36 = 41.15 mm; this is the number the construction must reproduce."}}, {"name": {"en": "Interior angle"}, "f": "angle = (n - 2) x 180 / n", "terms": {"en": "108 degrees for a pentagon, 120 degrees for a hexagon, 135 degrees for an octagon."}}, {"name": {"en": "Pentagon circumradius"}, "f": "R = s / (2 sin 36) = 0.8507 s", "terms": {"en": "A pentagon of 40 mm side needs a circle of radius 34.03 mm."}}, {"name": {"en": "Hexagon, across flats and corners"}, "f": "AF = 1.732 R,  AC = 2 R,  side = R", "terms": {"en": "Across flats is 1.732 times the circumradius; across corners is twice it, and equals twice the side."}}, {"name": {"en": "Octagon in a square"}, "f": "s = 0.4142 a,  corner trim = 0.293 a", "terms": {"en": "Inside a square of side a the largest regular octagon has side 0.4142 a and each corner is trimmed by 0.293 a."}}]}, {"title": {"en": "BIS SP 46 drawing practice"}, "items": [{"name": {"en": "Line thickness"}, "f": "thick : thin = 2 : 1 (0.5 mm : 0.25 mm)", "terms": {"en": "Only two thicknesses on one drawing; visible outlines thick, everything that helps to read them thin."}}, {"name": {"en": "Arrowhead proportion"}, "f": "length : width = 3 : 1", "terms": {"en": "A filled arrowhead about 3 mm long and 1 mm wide, touching the extension line."}}, {"name": {"en": "Dimension figure"}, "f": "height 3 mm, 1 mm above the dimension line", "terms": {"en": "Unidirectional system: every figure readable from the bottom or from the right of the sheet; millimetres, no unit symbol."}}, {"name": {"en": "Extension line clearances"}, "f": "2 mm gap at the object, 3 mm beyond the arrow", "terms": {"en": "The gap keeps the outline clean; the overrun shows where the dimension ends."}}]}], "viva": [{"title": {"en": "Instruments and the sheet"}, "items": [{"q": {"en": "Why is the filing margin 20 mm, not 10 mm?"}, "a": {"en": "Because the sheet is punched and bound on the left edge, and the punched holes would cut into any drawing inside a 10 mm border. The other three sides carry the 10 mm border, the title block sits in the bottom right corner, and the margin is never used for a view or a dimension."}}, {"q": {"en": "What is the difference between 2H, H and HB pencils on a drawing?"}, "a": {"en": "2H is hard and light, so it is used for construction lines that must not print black in a copy; H is used for the final outlines, because it is dark enough to reproduce and still erases cleanly; HB is used for lettering and dimension figures, where a slightly darker and softer line reads better. Using HB for construction makes the sheet dirty and hard to correct."}}, {"q": {"en": "What are the A-series paper sizes and which is used for the practical?"}, "a": {"en": "A0 is 841 x 1189 mm and each size is half the one before: A1 594 x 841, A2 420 x 594, A3 297 x 420, A4 210 x 297. A2 is used for the drawing sheets of this subject, and the problems are first worked in the sketch book."}}, {"q": {"en": "What does the title block contain?"}, "a": {"en": "The name of the institute, the title of the problem, the name and roll number of the student, the class and division, the subject and its code, the scale of the drawing, the date and the sheet number. It is 65 mm wide and sits in the bottom right corner, so a reader knows at once what the sheet is and at what scale."}}]}, {"title": {"en": "Lines and dimensioning"}, "items": [{"q": {"en": "Why are hidden edges drawn dashed thin instead of continuous thin?"}, "a": {"en": "Because a continuous thin line already means a dimension, an extension line or a hatch. If a hidden edge used the same line, the reader could not tell a hole behind a face from a dimension. A dashed thin line is reserved for what is hidden, and the dashes start and end with a dash so that the extent is clear."}}, {"q": {"en": "What is the difference between a centre line and a cutting plane line?"}, "a": {"en": "A centre line is chain thin and runs through the centre of a circle or along the axis of a cylinder, projecting 2 to 3 mm beyond the outline. A cutting plane line is chain thin but thick at its two ends, with arrows showing the direction of sight and letters naming the section, because it tells the reader where the object has been cut."}}, {"q": {"en": "Why is a dimension never placed on a hidden line?"}, "a": {"en": "Because the dimension would be ambiguous - the reader cannot see the edge it refers to - and because the dashes and the arrowheads would overlap and become unreadable. The view is arranged, or a section is taken, so that the edge is visible; only then is it dimensioned."}}, {"q": {"en": "What does Ø 20, R 10, □ 15 and 45 x 5 mean?"}, "a": {"en": "Ø 20 is a diameter of 20 mm, R 10 is a radius of 10 mm, □ 15 is a square face of 15 mm side, and 45 x 5 is a chamfer 45 degrees to the axis and 5 mm long. All are written without a unit symbol, because every dimension on the sheet is in millimetres."}}, {"q": {"en": "What is a datum and why are location dimensions taken from it?"}, "a": {"en": "A datum is the face, edge or axis chosen as the zero for measurements - usually the machined face that will locate the part in the fixture. Taking every location dimension from that one face stops the tolerances of several dimensions adding up, which is what happens when each hole is dimensioned from the previous one."}}]}, {"title": {"en": "Scales and polygons"}, "items": [{"q": {"en": "What is a reducing scale and what is an enlarging scale?"}, "a": {"en": "A reducing scale draws the object smaller than it is, so the RF is less than one - 1:2, 1:50, 1:100 - and it is what every building or machine drawing uses. An enlarging scale draws it bigger, so the RF is more than one - 2:1 or 10:1 - and it is used for a watch part or a printed circuit detail. Full size is 1:1. The RF always starts with 1, so 1:50 and 50:1 are two entirely different drawings."}}, {"q": {"en": "What is the representative fraction?"}, "a": {"en": "The ratio of the drawing length to the actual length, written 1 : 50 and read as one millimetre on the paper for every fifty millimetres of the object. It is the number that makes the whole sheet readable at a glance, and it is written under the scale and in the title block."}}, {"q": {"en": "When do you use a plain scale and when a diagonal scale?"}, "a": {"en": "A plain scale reads two units - metres and decimetres - and is used when the smallest distance can be shown by a 2 mm division. A diagonal scale reads three units, because the diagonal divides a small division into ten more parts by similar triangles, and is used when the third unit would otherwise be smaller than a millimetre on the paper."}}, {"q": {"en": "Why does the hexagon construction work without any arithmetic?"}, "a": {"en": "Because a chord equal to the radius subtends exactly 60 degrees at the centre, so six such chords fill 360 degrees. Setting the compass to R and stepping round the circle therefore marks all six corners exactly, and the chord stepped is also the length of the side."}}, {"q": {"en": "How do you check a polygon before inking it?"}, "a": {"en": "Measure one side against the value from s = D sin(180/n), and check one interior angle against (n - 2) x 180 / n. In the general method the last step must close exactly on the first point; a gap or an overlap means the diameter was divided inaccurately, so the division is repeated rather than the error averaged out."}}]}], "exam_questions": [{"q": {"en": "Draw: Lay out an A2 drawing sheet, ready to start a problem."}, "marks": 4}, {"q": {"en": "Draw: Draw a plain scale of RF 1:50 to read metres and decimetres, long enough for 6 m. Show a distance of 3.7 m on it."}, "marks": 5}, {"q": {"en": "Draw: Dimension the stepped plate shown, fully and as per BIS SP 46."}, "marks": 5}, {"q": {"en": "Draw: Construct a regular pentagon of 40 mm side by the general method."}, "marks": 5}, {"q": {"en": "Draw: Construct a regular hexagon of 60 mm across flats by the set-square method."}, "marks": 4}, {"q": {"en": "Draw: Construct a regular octagon inside a square of 60 mm side."}, "marks": 5}, {"q": {"en": "Draw: Draw a regular polygon of seven sides in a circle of 70 mm diameter and state its side."}, "marks": 3}], "learning_outcomes": [{"en": "Apply the conventions and methods of engineering drawing: instruments, line types, dimensioning, scales and regular polygons."}], "course_outcomes": ["CO1"], "practical_numbers": [1], "content_kind": "theory", "lesson_count": 6, "answered_practice_count": 7, "assessment_note": {"en": "Official course: theory ESE 70 + PA 30 and practical PA 20 + ESE 30 = 150 marks, 3 credits, 30 teaching hours (2 lecture + 2 practical). This unit carries 10 % weightage, 4 of the 30 hours and 7 of the 70 theory marks (the PDF prints weightage only, so the marks are split by weightage). The solved drawing problems in section 4 are revision constructions with suggested marks, not official GTU papers, and the syllabus allows any valid method in the exam."}, "question_provenance": "Original solved drawing problems written for revision; not official past papers", "question_marks_are_suggested": true, "sources": [{"title": "GTU DI01000111 Engineering Graphics syllabus (uploaded PDF, w.e.f. 2024-25)", "url": "https://syllabus.gtu.ac.in/"}, {"title": "BIS SP 46 - Engineering drawing practice for schools and colleges: line types, lettering and dimensioning", "url": "https://www.bis.gov.in/"}, {"title": "N. D. Bhatt - Elementary Engineering Drawing, Charotar Publishing House, Anand (chapters 1-3: instruments, lines, dimensioning, scales and polygons)", "url": "https://www.charotarbookstall.com/"}, {"title": "P. S. Gill - A Text Book of Engineering Drawing, S. K. Kataria & Sons, Delhi (sheet layout, BIS conventions and polygon constructions)", "url": "https://www.skkatariaandsons.com/"}]};

function syntax(key){
  return (U[typeof key==='string'?key:'syntax']||[]).map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><pre class="code sx">${hl(e.f)}</pre></span>${chev}</div>
     <div class="a">${e.terms && t(e.terms) ? fixTables(t(e.terms)) : ''}</div></div>`).join('') + `</div>`).join('');
}
const flowcharts = diagrams;
const algorithms = () => syntax('algorithms');
const ALLV = {notes, programs, diagrams, flowcharts, algorithms, syntax, equations, numericals, viva, exam};
const VIEWS = U.tabs ? Object.fromEntries(U.tabs.map(k=>[k, ALLV[k]])) : U.programs ? (META.code_lang==='python' ? {notes, programs, diagrams, syntax, viva, exam} : {notes, programs, flowcharts, syntax, viva, exam}) : U.numericals ? {notes, diagrams, equations, numericals, viva, exam} : {notes, diagrams, equations, viva, exam};
function render(){
  document.getElementById('title').textContent = `${L('unit')} ${U.unit}: ${t(U.title)}`;
  document.getElementById('sub').textContent = `${t(META.name)} · ${META.code}`;
  document.getElementById('lang').textContent = S.lang==='en' ? 'ગુ' : 'EN';
  document.getElementById('lang').style.display = META.languages.includes('gu') ? '' : 'none';
  document.getElementById('tabs').innerHTML = Object.keys(VIEWS).map(k=>`<button class="tab${S.tab===k?' on':''}" data-tab="${k}">${L(k)}</button>`).join('');
  document.getElementById('view').innerHTML = VIEWS[S.tab]();
  document.querySelectorAll('#view pre.c').forEach(e=>{ e.innerHTML = hl(e.textContent); e.className='code'; });
}
let zoom = 1;
function setZoom(z){ zoom = Math.min(4, Math.max(1, z)); const w=document.getElementById('zw'); w.style.width=(zoom*100)+'%'; document.getElementById('zr').textContent=Math.round(zoom*100)+'%'; }
document.addEventListener('click', e=>{
  const q = e.target.closest('.q'); if (q && q.parentElement.querySelector('.a')) { q.parentElement.classList.toggle('open'); return; }
  const tb = e.target.closest('[data-tab]'); if (tb){ S.tab = tb.dataset.tab; render(); window.scrollTo(0,0); return; }
  if (e.target.closest('#lang')){ S.lang = S.lang==='en'?'gu':'en'; render(); return; }
  const m = e.target.closest('[data-more]');
  document.querySelectorAll('.menu.show').forEach(x=>{ if(!m || x!==m.nextElementSibling) x.classList.remove('show'); });
  if (m){ m.nextElementSibling.classList.toggle('show'); return; }
  const act = e.target.closest('[data-act]');
  if (act){ act.closest('.sec').querySelectorAll('.card').forEach(c=>{ if(c.querySelector('.a')) c.classList.toggle('open', act.dataset.act==='expand'); }); act.parentElement.classList.remove('show'); return; }
  const dg = e.target.closest('[data-dg]');
  if (dg){ const id=dg.dataset.dg; document.getElementById('mt').textContent=t(U.diagrams.find(d=>d.id===id).title); document.getElementById('zw').innerHTML=SVG[id]; setZoom(1); document.getElementById('modal').classList.add('show'); return; }
  if (e.target.closest('#mx')) document.getElementById('modal').classList.remove('show');
  if (e.target.closest('#zi')) setZoom(zoom+0.5);
  if (e.target.closest('#zo')) setZoom(zoom-0.5);
  if (e.target.closest('#zr')) setZoom(1);
});
render();
</script>
