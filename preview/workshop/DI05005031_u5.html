<script>
const U = {"subject": "DI05005031", "unit": 5, "format": "notes", "title": {"en": "Design of Single Ideal Reactor", "gu": "એક આદર્શ રિએક્ટરની ડિઝાઇન"}, "hours": 11, "weightage": 24, "theory_marks": 17, "official": true, "languages": ["en", "gu"], "tabs": ["notes", "diagrams", "equations", "viva", "exam"], "intro_text": {"en": "Unit 5 is where the reactor is sized. One mole balance is written three ways - a batch time, a CSTR volume and a PFR integral - and the rest of the unit turns those three lines into vessels. Constant density makes the rate a function of conversion alone, so every equation can be integrated by hand. The batch, mixed flow and plug flow designs are then worked out, the CSTR rectangle and the PFR area are read off the same graph, and the unit closes on space time, space velocity and holding time, the three numbers that a plant actually quotes. Six solved numericals follow in section 5.6.", "gu": "Unit 5 માં reactor નું માપ નક્કી થાય છે. એક mole balance ત્રણ રીતે લખાય - batch નો સમય, CSTR નું volume અને PFR નું integral - અને બાકીનું આખું unit એ ત્રણ લીટીને પાત્રોમાં ફેરવે. Constant density rate ને ફક્ત conversion નું વિધેય બનાવે, તેથી દરેક equation હાથે integrate થાય. પછી batch, mixed flow અને plug flow ની design ગણાય, CSTR નો લંબચોરસ અને PFR નું ક્ષેત્રફળ એક જ ગ્રાફ પરથી વંચાય, અને unit space time, space velocity તથા holding time પર પૂરું થાય - જે ત્રણ આંકડા plant ખરેખર લખે છે. વિભાગ 5.6 માં છ ઉકેલેલા દાખલા છે."}, "notes": [{"title": {"en": "5.1 The performance equation of a single ideal reactor", "gu": "5.1 એક આદર્શ reactor નું performance equation"}, "items": [{"h": {"en": "One mole balance, three design equations", "gu": "એક mole balance, ત્રણ design equations"}, "body": {"en": "<p>Every design calculation in this subject answers one of two questions: how long must the material stay, or how big must the vessel be? Both come out of a single mole balance on the reactant A, written first as words - in minus out plus generation equals accumulation - and then written for the mixing picture of the reactor.</p><div class=\"math\"> 1. mole balance on A: in - out + generation = accumulation\n 2. batch (no in, no out): NA0 dX/dt = (-rA) V   ->   t = NA0 x integral dX/(-rA V)\n 3. CSTR (steady, perfectly mixed): FA0 - FA - (-rA) V = 0   ->   V = FA0 X / (-rA)\n 4. PFR (steady, plug flow): FA0 dX/dV = -rA   ->   V = FA0 x integral dX/(-rA)\n 5. the balance is the same in all three; only the mixing and the unknown differ</div><div class=\"eq\">batch: t = NA0 x integral dX/(-rA V)   CSTR: V = FA0 X/(-rA)exit   PFR: V = FA0 x integral dX/(-rA)</div><p>The batch asks for a time and gives no flow term at all. The CSTR asks for a volume and answers with one algebraic line, because the contents have a single composition and the balance is written at that composition. The PFR asks for a volume and answers with an integral, because the composition changes continuously from inlet to outlet.</p><p><b>Why it is true.</b> The three equations are the same physics: A is consumed at the local rate -rA and the balance simply asks how long, or how much volume, is needed before the required amount has gone. What changes is whether the material is well mixed (one composition, so one rate), unmixed along the flow (a rate at every point, so an integral) or simply left alone in a vessel (a rate at every instant, so a time).</p><p><b>Check your answer.</b> Check the units of each line before using it: FA0 is kmol/h, -rA is kmol/(m3 h), so FA0 X/(-rA) is in m3. The batch line gives hours only if -rA is per hour.</p><p><b>Common mistake.</b> Mixing the three equations. A very common exam error is to answer a CSTR question with the batch first order time, or to put a square root of a CSTR volume into a PFR duty. Write the balance for the reactor named in the question, not the one you last practised.</p>", "gu": "<p>આ subject ની દરેક design ગણતરી બેમાંથી એક પ્રશ્નનો જવાબ આપે છે: material કેટલો સમય રહેવું જોઈએ, કે પાત્ર કેટલું મોટું જોઈએ? બંને એક જ mole balance માંથી નીકળે છે, જે reactant A પર લખાય - પહેલા શબ્દોમાં: અંદર આવે તે ઓછા બહાર જાય તે વત્તા ઉત્પન્ન થાય તે બરાબર સંચિત થાય તે - અને પછી reactor ની mixing પ્રમાણે લખાય.</p><div class=\"math\"> 1. mole balance on A: in - out + generation = accumulation\n 2. batch (no in, no out): NA0 dX/dt = (-rA) V   ->   t = NA0 x integral dX/(-rA V)\n 3. CSTR (steady, perfectly mixed): FA0 - FA - (-rA) V = 0   ->   V = FA0 X / (-rA)\n 4. PFR (steady, plug flow): FA0 dX/dV = -rA   ->   V = FA0 x integral dX/(-rA)\n 5. the balance is the same in all three; only the mixing and the unknown differ</div><div class=\"eq\">batch: t = NA0 x integral dX/(-rA V)   CSTR: V = FA0 X/(-rA)exit   PFR: V = FA0 x integral dX/(-rA)</div><p>Batch સમય માંગે છે અને flow નો કોઈ ભાગ આપતું નથી. CSTR volume માંગે છે અને એક જ બીજગણિતીય લીટીથી જવાબ આપે, કારણ કે અંદરની રચના એક જ છે અને balance તે જ રચના પર લખાય. PFR volume માંગે છે અને integral થી જવાબ આપે, કારણ કે રચના inlet થી outlet સુધી સતત બદલાય છે.</p><p><b>કેમ સાચું છે.</b> ત્રણેય equations એક જ ભૌતિક વિજ્ઞાન છે: A સ્થાનિક rate -rA પ્રમાણે વપરાય છે અને balance ફક્ત પૂછે છે કે જરૂરી જથ્થો ખતમ થવા કેટલો સમય કે કેટલું volume જોઈએ. ફેર ફક્ત એ છે કે material સરખી રીતે મિક્સ છે (એક રચના, તેથી એક rate), flow સાથે મિક્સ નથી (દરેક બિંદુએ rate, તેથી integral) કે પાત્રમાં એમ જ પડ્યું છે (દરેક ક્ષણે rate, તેથી સમય).</p><p><b>જવાબ ચકાસો.</b> વાપરતા પહેલા દરેક લીટીના એકમ ચકાસો: FA0 kmol/h છે, -rA kmol/(m3 h) છે, તેથી FA0 X/(-rA) m3 માં આવે. Batch ની લીટી કલાક આપે છે જો -rA કલાક દીઠ હોય.</p><p><b>સામાન્ય ભૂલ.</b> ત્રણ equations ભેગી કરી નાખવી. પરીક્ષામાં ખૂબ સામાન્ય ભૂલ છે CSTR ના પ્રશ્નનો જવાબ batch ના first order સમયથી આપવો, કે CSTR ના volume નું વર્ગમૂળ PFR ના કામમાં નાખવું. પ્રશ્નમાં જે reactor કહ્યો છે તેના માટે balance લખો, જે છેલ્લે પ્રેક્ટિસ કર્યો તેના માટે નહીં.</p>"}, "diagram": "u5_perf", "syllabus_item": "5.1"}, {"h": {"en": "Constant density: turning the rate into a function of conversion", "gu": "Constant density: rate ને conversion નું વિધેય બનાવવું"}, "body": {"en": "<p>An equation with two unknowns - concentration and conversion - cannot be integrated. The constant density assumption removes one of them. For a liquid, or for a gas reaction in which the number of moles does not change, the volume flow stays the same through the reactor, so the concentration is a straight line down from the feed value.</p><div class=\"math\"> 1. constant volume: CA = NA/V = NA0(1 - X)/V = CA0 (1 - X)\n 2. nth order: -rA = k CA^n = k CA0^n (1 - X)^n\n 3. first order: -rA = k CA0 (1 - X);  zero order: -rA = k\n 4. second order with CA0 = CB0: -rA = k CA0^2 (1 - X)^2\n 5. so every design equation becomes an integral in X alone, at fixed temperature</div><h4>What is lost if the density changes</h4><div class=\"math\">gas with mole change (Unit 3): CA = CA0 (1 - X)/(1 + eps X)\nso -rA = k CA0 (1 - X)/(1 + eps X)   for first order\nthe design equations still hold, but the integral is no longer elementary</div><table><tr><th>Feed</th><th>v changes?</th><th>Use</th></tr><tr><td>liquid phase</td><td>no</td><td>CA = CA0 (1 - X)</td></tr><tr><td>gas, A -> B</td><td>no</td><td>CA = CA0 (1 - X)</td></tr><tr><td>gas, A -> 2B</td><td>yes, doubles</td><td>CA = CA0(1-X)/(1+eps X), eps = 1</td></tr></table><p><b>Why it is true.</b> Conversion is only a convenient variable if the rate can be written in terms of it. At constant density the proportionality is direct, and that is why every closed form in this subject - exponential decay for first order, straight line for zero order, reciprocal for second order - is written in constant-density form.</p><p><b>Check your answer.</b> At X = 0.5 the first order rate is exactly half the initial rate, and CA is half CA0. If an answer gives a rate that does not fall in step with the concentration, the density assumption has been used on a reaction that does not allow it.</p><p><b>Common mistake.</b> Applying the constant-density form to a gas reaction with a mole change. For A -> 2B the volume flow doubles by full conversion and the true concentration falls faster than (1 - X); the error at X = 0.8 is about 45 % on the rate.</p>", "gu": "<p>બે અજાણ્યાં - concentration અને conversion - વાળું equation integrate થઈ શકે નહીં. Constant density ધારણા તેમાંથી એક કાઢી નાખે છે. પ્રવાહી માટે, કે જે gas પ્રક્રિયામાં moles ની સંખ્યા બદલાતી નથી તે માટે, volume flow reactor માં સરખો રહે છે, તેથી concentration feed ના મૂલ્યથી સીધી લીટીમાં નીચે આવે છે.</p><div class=\"math\"> 1. constant volume: CA = NA/V = NA0(1 - X)/V = CA0 (1 - X)\n 2. nth order: -rA = k CA^n = k CA0^n (1 - X)^n\n 3. first order: -rA = k CA0 (1 - X);  zero order: -rA = k\n 4. second order with CA0 = CB0: -rA = k CA0^2 (1 - X)^2\n 5. so every design equation becomes an integral in X alone, at fixed temperature</div><h4>density બદલાય તો શું ખોવાય</h4><div class=\"math\">gas with mole change (Unit 3): CA = CA0 (1 - X)/(1 + eps X)\nso -rA = k CA0 (1 - X)/(1 + eps X)   for first order\nthe design equations still hold, but the integral is no longer elementary</div><table><tr><th>Feed</th><th>v બદલાય?</th><th>વાપરો</th></tr><tr><td>પ્રવાહી phase</td><td>ના</td><td>CA = CA0 (1 - X)</td></tr><tr><td>gas, A -> B</td><td>ના</td><td>CA = CA0 (1 - X)</td></tr><tr><td>gas, A -> 2B</td><td>હા, બમણું થાય</td><td>CA = CA0(1-X)/(1+eps X), eps = 1</td></tr></table><p><b>કેમ સાચું છે.</b> Rate ને conversion ના પદમાં લખી શકાય તો જ conversion સગવડભરી ચલ બને. Constant density પર સંબંધ સીધો છે, અને તેથી જ આ subject નું દરેક closed form - first order માટે exponential decay, zero order માટે સીધી લીટી, second order માટે વ્યસ્ત - constant-density સ્વરૂપમાં લખાય છે.</p><p><b>જવાબ ચકાસો.</b> X = 0.5 પર first order rate શરૂઆતના rate કરતાં બરાબર અડધો થાય, અને CA એ CA0 નું અડધું થાય. જવાબમાં rate concentration સાથે ડગલે ને પગલે ન ઘટે તો જે પ્રક્રિયા પરવાનગી આપતી નથી તેના પર density ધારણા વપરાઈ છે.</p><p><b>સામાન્ય ભૂલ.</b> Mole change વાળી gas પ્રક્રિયા પર constant-density સ્વરૂપ લગાડવું. A -> 2B માટે પૂર્ણ conversion સુધી volume flow બમણો થાય અને સાચું concentration (1 - X) કરતાં ઝડપથી ઘટે; X = 0.8 પર rate માં લગભગ 45 % જેટલી ભૂલ થાય.</p>"}, "syllabus_item": "5.1"}]}, {"title": {"en": "5.2 The ideal batch reactor", "gu": "5.2 આદર્શ batch reactor"}, "items": [{"h": {"en": "Designing the batch reactor in time", "gu": "Batch reactor ની design સમયમાં"}, "body": {"en": "<p>A batch reactor is designed in time. The vessel is charged, mixed, brought to temperature, held for the reaction time, then emptied and cleaned. The reaction time comes from the integrated design equation; the cycle time - reaction plus filling, heating, emptying and cleaning - decides how many batches a day the vessel can make.</p><div class=\"math\">zero order:  t = X/(k CA0)\nfirst order: t = (1/k) ln[1/(1 - X)]     (independent of CA0)\nsecond order, CA0 = CB0:  t = X/[k CA0 (1 - X)]\ncycle time = t + filling + heating + emptying + cleaning</div><div class=\"eq\">t = (1/k) ln[1/(1 - X)]   cycle = t + turnaround   batches per day = 1440/cycle</div><h4>How many batches, and how much product</h4><div class=\"math\">A charged per batch = CA0 V\nA reacted per batch = CA0 V X\ndaily production = (1440/cycle) x CA0 V X</div><p><b>Why it is true.</b> The reaction time and the cycle time are two different numbers, and only the second one costs money. A batch that takes 150 min to react but 180 min in total turns 5.5 h of vessel time into 5 h of product, which is exactly why plants chase turnaround time as hard as they chase kinetics.</p><p><b>Check your answer.</b> Work backwards from the answer: with k = 0.02 min-1 and 150 min of reaction, exp(-0.02 x 150) = 0.050, so 5 % of A is left and X = 0.95. If the numbers do not return to the conversion you started with, the unit of k is wrong.</p><p><b>Common mistake.</b> Sizing the vessel from the reaction volume alone. A batch vessel is charged to 70-80 % to leave freeboard for foam and for the stirrer, so a 1.0 m3 charge needs about a 1.3 m3 vessel - and the jacket, nozzle and manway have to fit around it.</p>", "gu": "<p>Batch reactor ની design સમયમાં થાય. પાત્ર ભરાય, હલાવાય, temperature પર લાવાય, reaction time સુધી રખાય, પછી ખાલી અને સાફ થાય. Reaction time સંકલિત design equation માંથી આવે; cycle time - reaction વત્તા ભરવું, ગરમ કરવું, ખાલી કરવું અને સાફ કરવું - પાત્ર દિવસમાં કેટલા batch કરી શકે તે નક્કી કરે.</p><div class=\"math\">zero order:  t = X/(k CA0)\nfirst order: t = (1/k) ln[1/(1 - X)]     (independent of CA0)\nsecond order, CA0 = CB0:  t = X/[k CA0 (1 - X)]\ncycle time = t + filling + heating + emptying + cleaning</div><div class=\"eq\">t = (1/k) ln[1/(1 - X)]   cycle = t + turnaround   batches per day = 1440/cycle</div><h4>કેટલા batch, અને કેટલું ઉત્પાદન</h4><div class=\"math\">A charged per batch = CA0 V\nA reacted per batch = CA0 V X\ndaily production = (1440/cycle) x CA0 V X</div><p><b>કેમ સાચું છે.</b> Reaction time અને cycle time બે જુદા આંકડા છે, અને પૈસા ફક્ત બીજા પર ખર્ચાય છે. જે batch ને react થવા 150 min જોઈએ પણ કુલ 180 min લાગે તે 5.5 h vessel time ના 5 h product બનાવે, તેથી જ plants kinetics જેટલી જ મહેનત turnaround time પર કરે છે.</p><p><b>જવાબ ચકાસો.</b> જવાબ પરથી પાછળ જાઓ: k = 0.02 min-1 અને 150 min reaction સાથે exp(-0.02 x 150) = 0.050, તેથી 5 % A બાકી અને X = 0.95. આંકડા શરૂઆતના conversion પર પાછા ન આવે તો k નો એકમ ખોટો છે.</p><p><b>સામાન્ય ભૂલ.</b> ફક્ત reaction volume પરથી પાત્ર માપવું. Batch પાત્ર foam અને stirrer માટે જગ્યા રાખવા 70-80 % સુધી ભરાય છે, તેથી 1.0 m3 ચાર્જ માટે લગભગ 1.3 m3 પાત્ર જોઈએ - અને તેની આસપાસ jacket, nozzle અને manway ગોઠવવા પડે.</p>"}, "diagram": "u5_batch", "syllabus_item": "5.2"}]}, {"title": {"en": "5.3 The steady state mixed flow reactor (CSTR)", "gu": "5.3 સ્થિર સ્થિતિનો mixed flow reactor (CSTR)"}, "items": [{"h": {"en": "The CSTR design equation and its rectangle", "gu": "CSTR નું design equation અને તેનો લંબચોરસ"}, "body": {"en": "<p>In a CSTR the feed and the product leave continuously and the stirrer keeps the contents uniform, so the reactor has one composition - the outlet composition - at every point and at every instant. That single fact collapses the mole balance into one algebraic line, and the line can be read straight off a graph.</p><div class=\"math\"> 1. steady state: in - out - reaction = 0\n 2. FA0 - FA - (-rA) V = 0\n 3. with FA = FA0 (1 - X):  V = FA0 X / (-rA)exit\n 4. divide by the feed rate:  tau = V/v0 = CA0 X / (-rA)exit\n 5. first order:  tau = X/[k (1 - X)]</div><h4>The graphical form</h4><div class=\"math\">plot 1/(-rA) against X:  V/FA0 = X x [1/(-rA) at the exit]\nthat is a rectangle of width X and height 1/(-rA)exit\nfirst order at X = 0.8: height 5, area 4 = k tau</div><div class=\"eq\">V = FA0 X/(-rA)exit   tau = V/v0 = CA0 X/(-rA)exit   first order: k tau = X/(1 - X)</div><p><b>Why it is true.</b> The balance has no accumulation term because the reactor is at steady state, and no integral because there is only one composition to integrate over. What is left is the rate at the outlet multiplied by the volume - the slowest rate in the system held constant over the whole vessel.</p><p><b>Check your answer.</b> Put the answer back through the balance: V = FA0 X/(-rA) = v0 CA0 X/(k CA0 (1-X)) = v0 X/[k(1-X)] = v0 tau. If it does not return v0 tau, the exit rate was taken at the wrong conversion.</p><p><b>Common mistake.</b> Treating a stirred tank as a CSTR because it has a stirrer. A CSTR needs a mixing time much shorter than the space time, a feed that enters below the liquid level and an overflow that does not short-circuit to the inlet - otherwise the real vessel behaves like a poor PFR-CSTR mixture and converts less.</p>", "gu": "<p>CSTR માં feed અને product સતત નીકળે છે અને stirrer અંદરનું સરખું રાખે છે, તેથી reactor ની રચના એક જ - outlet ની રચના - દરેક જગ્યાએ અને દરેક ક્ષણે. એ એક જ વાત mole balance ને એક બીજગણિતીય લીટીમાં લાવે, અને એ લીટી graph પરથી સીધી વંચાય.</p><div class=\"math\"> 1. steady state: in - out - reaction = 0\n 2. FA0 - FA - (-rA) V = 0\n 3. with FA = FA0 (1 - X):  V = FA0 X / (-rA)exit\n 4. divide by the feed rate:  tau = V/v0 = CA0 X / (-rA)exit\n 5. first order:  tau = X/[k (1 - X)]</div><h4>ગ્રાફિકલ સ્વરૂપ</h4><div class=\"math\">plot 1/(-rA) against X:  V/FA0 = X x [1/(-rA) at the exit]\nthat is a rectangle of width X and height 1/(-rA)exit\nfirst order at X = 0.8: height 5, area 4 = k tau</div><div class=\"eq\">V = FA0 X/(-rA)exit   tau = V/v0 = CA0 X/(-rA)exit   first order: k tau = X/(1 - X)</div><p><b>કેમ સાચું છે.</b> Balance માં accumulation નો ભાગ નથી કારણ કે reactor steady state માં છે, અને integral નથી કારણ કે integrate કરવા એક જ રચના છે. જે બાકી રહે તે outlet નો rate ગુણ્યા volume - system નો સૌથી ધીમો rate આખા પાત્ર પર અચળ.</p><p><b>જવાબ ચકાસો.</b> જવાબ balance માં પાછો મૂકો: V = FA0 X/(-rA) = v0 CA0 X/(k CA0 (1-X)) = v0 X/[k(1-X)] = v0 tau. જો v0 tau ન આવે તો exit rate ખોટા conversion પર લેવાયો છે.</p><p><b>સામાન્ય ભૂલ.</b> Stirrer હોય તો પાત્રને CSTR ગણવું. CSTR ને space time કરતાં ઘણો ટૂંકો mixing time, પ્રવાહીની સપાટી નીચે પ્રવેશતો feed અને inlet સુધી ટૂંકો રસ્તો ન કરતો overflow જોઈએ - નહીં તો સાચું પાત્ર નબળા PFR-CSTR મિશ્રણ જેવું વર્તે અને ઓછું convert કરે.</p>"}, "diagram": "u5_cstr", "syllabus_item": "5.3"}, {"h": {"en": "Two CSTRs in series: the staircase", "gu": "Series માં બે CSTR: સીડી આકાર"}, "body": {"en": "<p>A single CSTR has to work at the outlet concentration, which is its own worst handicap. Split the same volume into two tanks in series and the first tank works between the feed and the mid-point composition, so it converts faster; only the last tank pays the full penalty. On the 1/(-rA) plot the train becomes a staircase.</p><div class=\"math\"> 1. tank 1: CA1 = CA0/(1 + k tau1)   ->   1 - X1 = 1/(1 + k tau1)\n 2. tank 2: CA2 = CA1/(1 + k tau2)   ->   1 - X2 = 1/[(1 + k tau1)(1 + k tau2)]\n 3. n equal tanks, tau each:  1 - X = 1/(1 + k tau/n)^n\n 4. as n grows at fixed total volume the train approaches a PFR\n 5. two equal tanks at X = 0.8: 1 + k tau = sqrt(5) = 2.236, k tau = 1.236 each</div><div class=\"eq\">1 - X = 1/(1 + k tau/n)^n   two equal tanks: k tau = (1 - X)^(-1/2) - 1 = 1.236</div><div class=\"math\">one CSTR: k tau = X/(1 - X) = 4.0   ->   V = 115 m3\ntwo CSTRs: 2 x 1.236 = 2.47 in total  ->   V = 71 m3\none PFR: k tau = ln(5) = 1.61        ->   V = 46 m3</div><p><b>Why it is true.</b> Each tank is a fresh CSTR that starts from the composition the previous tank delivered, so the average rate over the train is higher than the rate at the final outlet. The improvement is largest for the first extra tank and falls quickly afterwards, which is why plants stop at two or three.</p><p><b>Check your answer.</b> Multiply the two factors back: (1 + 1.236) squared = 5.0, so 1 - X = 1/5 = 0.2 and X = 0.80 exactly. Any staircase whose rectangle areas do not add up to the same k tau total is drawn wrong.</p><p><b>Common mistake.</b> Splitting the volume evenly when the tanks are not identical, or forgetting that the second tank's feed is already partly converted. Size each tank on its own inlet composition; equal tanks are a convenience, not a rule.</p>", "gu": "<p>એક જ CSTR ને outlet concentration પર કામ કરવું પડે, જે તેની પોતાની સૌથી મોટી મર્યાદા છે. એ જ volume ને series માં બે ટાંકીમાં વહેંચો તો પહેલી ટાંકી feed અને વચ્ચેની રચના વચ્ચે કામ કરે, તેથી ઝડપથી convert કરે; પૂરી સજા ફક્ત છેલ્લી ટાંકી ભોગવે. 1/(-rA) ના ગ્રાફ પર શ્રેણી સીડી બની જાય.</p><div class=\"math\"> 1. tank 1: CA1 = CA0/(1 + k tau1)   ->   1 - X1 = 1/(1 + k tau1)\n 2. tank 2: CA2 = CA1/(1 + k tau2)   ->   1 - X2 = 1/[(1 + k tau1)(1 + k tau2)]\n 3. n equal tanks, tau each:  1 - X = 1/(1 + k tau/n)^n\n 4. as n grows at fixed total volume the train approaches a PFR\n 5. two equal tanks at X = 0.8: 1 + k tau = sqrt(5) = 2.236, k tau = 1.236 each</div><div class=\"eq\">1 - X = 1/(1 + k tau/n)^n   two equal tanks: k tau = (1 - X)^(-1/2) - 1 = 1.236</div><div class=\"math\">one CSTR: k tau = X/(1 - X) = 4.0   ->   V = 115 m3\ntwo CSTRs: 2 x 1.236 = 2.47 in total  ->   V = 71 m3\none PFR: k tau = ln(5) = 1.61        ->   V = 46 m3</div><p><b>કેમ સાચું છે.</b> દરેક ટાંકી નવો CSTR છે જે આગલી ટાંકીએ આપેલી રચનાથી શરૂ થાય, તેથી શ્રેણી પર સરેરાશ rate છેલ્લા outlet ના rate કરતાં ઊંચો રહે. સુધારો પહેલી વધારાની ટાંકી માટે સૌથી મોટો હોય અને પછી ઝડપથી ઘટે, તેથી plants બે કે ત્રણ પર અટકે.</p><p><b>જવાબ ચકાસો.</b> બે અવયવ પાછા ગુણો: (1 + 1.236) નો વર્ગ = 5.0, તેથી 1 - X = 1/5 = 0.2 અને X = 0.80 બરાબર. જે સીડીના લંબચોરસનું ક્ષેત્રફળ કુલ k tau જેટલું ન થાય તે ખોટી દોરાયેલી છે.</p><p><b>સામાન્ય ભૂલ.</b> ટાંકીઓ એકસરખી ન હોય તો પણ volume સરખું વહેંચવું, કે બીજી ટાંકીનો feed અગાઉથી અંશતઃ convert થયેલો છે તે ભૂલવું. દરેક ટાંકી તેના પોતાના inlet composition પર માપો; સરખી ટાંકી સગવડ છે, નિયમ નહીં.</p>"}, "diagram": "u5_series", "syllabus_item": "5.3"}]}, {"title": {"en": "5.4 The steady state plug flow reactor (PFR)", "gu": "5.4 સ્થિર સ્થિતિનો plug flow reactor (PFR)"}, "items": [{"h": {"en": "The PFR design equation and its area", "gu": "PFR નું design equation અને તેનું ક્ષેત્રફળ"}, "body": {"en": "<p>In a PFR the fluid moves as plugs with no mixing along the flow, so the composition changes continuously from the inlet to the outlet. The balance is written on a slice of volume dV and integrated along the tube, which on the 1/(-rA) plot is the area under the curve up to the outlet conversion.</p><div class=\"math\"> 1. slice of volume dV: FA(V) - FA(V + dV) - (-rA) dV = 0\n 2. so dFA/dV = -(-rA), and with FA = FA0 (1 - X):\n 3. FA0 dX/dV = -rA    ->    V = FA0 x integral from 0 to X of dX/(-rA)\n 4. first order:  V = v0 ln[1/(1 - X)]/k, i.e. tau = ln[1/(1 - X)]/k\n 5. second order, CA0 = CB0:  tau = X/[k CA0 (1 - X)]</div><div class=\"math\">plot 1/(-rA) against X:  V/FA0 = area under the curve from 0 to X\nfirst order at X = 0.8: area = ln(5) = 1.61 = k tau\nagainst 4.0 for the CSTR: 2.5 times less volume</div><div class=\"eq\">V = FA0 x integral dX/(-rA)   tau = CA0 x integral dX/(-rA)   first order: k tau = ln[1/(1 - X)]</div><p><b>Why it is true.</b> The reactant spends the whole residence time at a concentration between CA0 and CA0(1 - X), while a CSTR spends it all at CA0(1 - X). For a positive order the average rate is therefore higher in the PFR, and the higher the conversion asked for, the bigger the advantage.</p><p><b>Check your answer.</b> Differentiate the answer to get the balance back: d/dV of [v0 ln(1/(1-X))/k] gives FA0 dX/dV = k CA0 (1- X), which is the rate law. A PFR answer that does not differentiate back to -rA is wrong.</p><p><b>Common mistake.</b> Calling any tube a PFR. Plug flow needs a turbulent or well-distributed velocity profile and enough length for the radial mixing to average out - in practice L/D of the order of 50 or more, or a packed tube. A short wide pipe with a laminar profile has a spread of residence times and converts less than the integral predicts.</p>", "gu": "<p>PFR માં પ્રવાહી plug તરીકે આગળ વધે અને flow સાથે મિક્ષ થતું નથી, તેથી રચના inlet થી outlet સુધી સતત બદલાય. Balance volume ના નાના ટુકડા dV પર લખાય અને નળી પર integrate થાય, જે 1/(-rA) ના ગ્રાફ પર outlet conversion સુધીના વક્ર નીચેનું ક્ષેત્રફળ છે.</p><div class=\"math\"> 1. slice of volume dV: FA(V) - FA(V + dV) - (-rA) dV = 0\n 2. so dFA/dV = -(-rA), and with FA = FA0 (1 - X):\n 3. FA0 dX/dV = -rA    ->    V = FA0 x integral from 0 to X of dX/(-rA)\n 4. first order:  V = v0 ln[1/(1 - X)]/k, i.e. tau = ln[1/(1 - X)]/k\n 5. second order, CA0 = CB0:  tau = X/[k CA0 (1 - X)]</div><div class=\"math\">plot 1/(-rA) against X:  V/FA0 = area under the curve from 0 to X\nfirst order at X = 0.8: area = ln(5) = 1.61 = k tau\nagainst 4.0 for the CSTR: 2.5 times less volume</div><div class=\"eq\">V = FA0 x integral dX/(-rA)   tau = CA0 x integral dX/(-rA)   first order: k tau = ln[1/(1 - X)]</div><p><b>કેમ સાચું છે.</b> Reactant આખો residence time CA0 અને CA0(1 - X) વચ્ચેના concentration પર રહે, જ્યારે CSTR આખો સમય CA0(1 - X) પર રહે. Positive order માટે તેથી PFR માં સરેરાશ rate ઊંચો રહે, અને conversion જેટલું ઊંચું માંગવામાં આવે તેટલો ફાયદો મોટો.</p><p><b>જવાબ ચકાસો.</b> જવાબનું વિકલન કરી balance પાછું મેળવો: [v0 ln(1/(1-X))/k] નું d/dV એટલે FA0 dX/dV = k CA0 (1-X), જે rate law છે. જે PFR જવાબનું વિકલન કરી -rA ન આવે તે ખોટો છે.</p><p><b>સામાન્ય ભૂલ.</b> કોઈપણ નળીને PFR કહેવી. Plug flow માટે turbulent કે સારી રીતે વહેંચાયેલો velocity profile અને radial mixing સરખું થવા પૂરતી લંબાઈ જોઈએ - વ્યવહારમાં L/D લગભગ 50 કે તેથી વધુ, કે packed નળી. ટૂંકી પહોળી નળીમાં laminar profile હોય તો residence time નો ફેલાવો થાય અને integral કહે તેના કરતાં ઓછું convert થાય.</p>"}, "diagram": "u5_pfr", "syllabus_item": "5.4"}, {"h": {"en": "Choosing a reactor: same duty, different volume", "gu": "Reactor પસંદગી: એ જ કામ, જુદું volume"}, "body": {"en": "<p>A design engineer is asked for a conversion, not for a reactor. The same duty can be met by one tank, a train of tanks or one tube, and the volumes differ by a factor of two or three - which is why the choice is made on cost, on the reaction's quirks, and on how the plant is operated, not on the design equation alone.</p><table><tr><th>Reactor</th><th>k tau at 80 %</th><th>Volume</th><th>Choose it when</th></tr><tr><td>one CSTR</td><td>4.00</td><td>115 m3</td><td>solids or gas must be handled, heat removal, easy cleaning</td></tr><tr><td>two CSTRs</td><td>2 x 1.236</td><td>71 m3</td><td>a single tank is too tall, or the duty grows in stages</td></tr><tr><td>one PFR</td><td>1.61</td><td>46 m3</td><td>gas phase, high conversion, high temperature, large scale</td></tr></table><div class=\"math\">first order:  CSTR k tau = X/(1 - X),   PFR k tau = ln[1/(1 - X)]\nX = 0.80: 4.00 against 1.61  ->  ratio 2.5\nX = 0.90: 9.00 against 2.30  ->  ratio 3.9\nX = 0.99: 99.0 against 4.61  ->  ratio 21</div><div class=\"eq\">volume ratio CSTR/PFR = [X/(1 - X)] / ln[1/(1 - X)]</div><p><b>Why it is true.</b> The gap grows with conversion because the CSTR's rate is fixed at the exit, and the exit concentration falls fastest at high conversion while the PFR keeps meeting high concentrations early on. At low conversion both reactors see nearly the feed composition and the volumes are almost equal.</p><p><b>Check your answer.</b> Compare the numbers with the chart: 115, 71 and 46 m3 for the same duty, and 71/46 = 1.5 while 115/46 = 2.5. The chart is plotted from those three numbers, so a bar that does not scale the same way is a plotting error, not a new result.</p><p><b>Common mistake.</b> Choosing the smallest volume and ignoring what the reaction needs. A PFR cannot be emptied to change a deactivated catalyst, cannot take a slurry, and cannot be cleaned in place easily; a CSTR can do all three. Volume is one line of the specification, not the whole of it.</p>", "gu": "<p>Design engineer ને reactor નહીં, conversion માંગવામાં આવે છે. એ જ કામ એક ટાંકી, ટાંકીઓની શ્રેણી કે એક નળીથી થઈ શકે, અને volumes બે-ત્રણ ગણા જુદા પડે - તેથી જ પસંદગી ખર્ચ, પ્રક્રિયાની વિચિત્રતાઓ અને plant કેવી રીતે ચાલે તેના પર થાય, ફક્ત design equation પર નહીં.</p><table><tr><th>Reactor</th><th>80 % પર k tau</th><th>Volume</th><th>ક્યારે લેવો</th></tr><tr><td>એક CSTR</td><td>4.00</td><td>115 m3</td><td>solids કે gas સંભાળવાના હોય, heat કાઢવો હોય, સહેલી સફાઈ</td></tr><tr><td>બે CSTR</td><td>2 x 1.236</td><td>71 m3</td><td>એક ટાંકી બહુ ઊંચી થાય, કે કામ તબક્કે તબક્કે વધે</td></tr><tr><td>એક PFR</td><td>1.61</td><td>46 m3</td><td>gas phase, ઊંચું conversion, ઊંચું temperature, મોટું scale</td></tr></table><div class=\"math\">first order:  CSTR k tau = X/(1 - X),   PFR k tau = ln[1/(1 - X)]\nX = 0.80: 4.00 against 1.61  ->  ratio 2.5\nX = 0.90: 9.00 against 2.30  ->  ratio 3.9\nX = 0.99: 99.0 against 4.61  ->  ratio 21</div><div class=\"eq\">volume ratio CSTR/PFR = [X/(1 - X)] / ln[1/(1 - X)]</div><p><b>કેમ સાચું છે.</b> Conversion સાથે gap વધે કારણ કે CSTR નો rate exit પર અટકે છે, અને ઊંચા conversion પર exit concentration સૌથી ઝડપથી ઘટે જ્યારે PFR શરૂઆતમાં ઊંચા concentration મળે. નીચા conversion પર બંને reactor લગભગ feed રચના જુએ અને volumes લગભગ સરખા થાય.</p><p><b>જવાબ ચકાસો.</b> આંકડાને ચાર્ટ સાથે સરખાવો: એ જ કામ માટે 115, 71 અને 46 m3, અને 71/46 = 1.5 જ્યારે 115/46 = 2.5. ચાર્ટ એ જ ત્રણ આંકડા પરથી દોરાયો છે, તેથી જે બાર એ જ પ્રમાણમાં ન બેસે તે દોરવાની ભૂલ છે, નવો પરિણામ નહીં.</p><p><b>સામાન્ય ભૂલ.</b> સૌથી નાનું volume પસંદ કરી પ્રક્રિયાને શું જોઈએ તે ભૂલવું. PFR ને નિષ્ક્રિય થયેલો catalyst બદલવા ખાલી કરી શકાય નહીં, slurry લઈ શકાય નહીં, અને સહેલાઈથી in place સાફ થઈ શકે નહીં; CSTR ત્રણેય કરી શકે. Volume specification ની એક લીટી છે, આખી નહીં.</p>"}, "diagram": "u5_bars", "syllabus_item": "5.4"}]}, {"title": {"en": "5.5 Space time, space velocity and holding time", "gu": "5.5 Space time, space velocity અને holding time"}, "items": [{"h": {"en": "Space time, space velocity and holding time", "gu": "Space time, space velocity અને holding time"}, "body": {"en": "<p>Three numbers describe how long material stays in a flow reactor, and students mix them up because two of them look like a time. Space time divides the reactor volume by the feed rate measured at the inlet; holding time divides the same volume by the flow actually inside the reactor. Space velocity is simply the reciprocal of space time and is what a plant quotes on its data sheet.</p><div class=\"math\">space time:     tau = V/v0        v0 = feed volume flow at inlet T and P\nspace velocity: SV = 1/tau = v0/V   quoted in h-1\nholding time:   t_bar = V/v        v = actual flow at reactor T and P\nfirst order duty: tau = CA0 X/(-rA)exit  or  tau = X/[k(1 - X)]</div><h4>For a gas, the two are not the same</h4><div class=\"math\">ideal gas: v/v0 = (P0/P)(T/T0)   for the same molar flow\nexample: V = 2 m3, v0 = 0.2 m3/min  ->  tau = 10 min\nat 5 bar and 400 K from 1 bar and 300 K: v = 0.0533 m3/min, t_bar = 37.5 min</div><div class=\"eq\">tau = V/v0   SV = 1/tau = v0/V   t_bar = V/v</div><p><b>Why it is true.</b> Space time is a property of the feed and the vessel only, which is why it is used in design: two reactors of the same space time will give the same conversion at the same kinetics, whatever the temperature and pressure inside. Holding time is a property of the conditions, which is why it is used for safety: a vessel at high pressure holds its inventory much longer than its space time suggests.</p><p><b>Check your answer.</b> Reciprocal check: SV = 1/tau, so tau = 10 min = 1/6 h goes with SV = 6 h-1. If a data sheet quotes both and they are not reciprocals, one of them is on a different basis - usually per mass of catalyst instead of per reactor volume.</p><p><b>Common mistake.</b> Quoting a space velocity without its basis. GHSV in h-1 can mean per volume of reactor, per volume of catalyst or per mass of catalyst, and the numbers differ by the bed voidage and the bulk density - a factor of two is ordinary.</p>", "gu": "<p>Flow reactor માં material કેટલો સમય રહે તે ત્રણ આંકડા કહે છે, અને વિદ્યાર્થીઓ તેમાં ગૂંચવાય છે કારણ કે બે તો સમય જેવા લાગે. Space time reactor ના volume ને inlet પર માપેલા feed rate થી ભાગે; holding time એ જ volume ને reactor ની અંદરના ખરા flow થી ભાગે. Space velocity એ space time નો વ્યસ્ત છે અને plant તેને data sheet પર લખે.</p><div class=\"math\">space time:     tau = V/v0        v0 = feed volume flow at inlet T and P\nspace velocity: SV = 1/tau = v0/V   quoted in h-1\nholding time:   t_bar = V/v        v = actual flow at reactor T and P\nfirst order duty: tau = CA0 X/(-rA)exit  or  tau = X/[k(1 - X)]</div><h4>Gas માટે બંને સરખા નથી</h4><div class=\"math\">ideal gas: v/v0 = (P0/P)(T/T0)   for the same molar flow\nexample: V = 2 m3, v0 = 0.2 m3/min  ->  tau = 10 min\nat 5 bar and 400 K from 1 bar and 300 K: v = 0.0533 m3/min, t_bar = 37.5 min</div><div class=\"eq\">tau = V/v0   SV = 1/tau = v0/V   t_bar = V/v</div><p><b>કેમ સાચું છે.</b> Space time ફક્ત feed અને પાત્રનું લક્ષણ છે, તેથી design માં વપરાય: એ જ space time વાળા બે reactors એ જ kinetics પર એ જ conversion આપે, અંદરનું temperature અને pressure ગમે તે હોય. Holding time શરતોનું લક્ષણ છે, તેથી safety માં વપરાય: ઊંચા pressure વાળું પાત્ર તેના space time કહે તેના કરતાં ઘણો વધુ સમય પોતાનો જથ્થો રાખે.</p><p><b>જવાબ ચકાસો.</b> વ્યસ્ત ચકાસો: SV = 1/tau, તેથી tau = 10 min = 1/6 h સાથે SV = 6 h-1 બને. Data sheet બંને લખે અને તે વ્યસ્ત ન હોય તો એક જુદા આધાર પર છે - સામાન્ય રીતે reactor volume ની જગ્યાએ catalyst ના દળ પર.</p><p><b>સામાન્ય ભૂલ.</b> આધાર વગર space velocity લખવો. h-1 માં GHSV નો અર્થ reactor ના volume દીઠ, catalyst ના volume દીઠ કે catalyst ના દળ દીઠ હોઈ શકે, અને આંકડા bed voidage તથા bulk density જેટલા જુદા પડે - બે ગણો ફેર સામાન્ય છે.</p>"}, "diagram": "u5_space", "syllabus_item": "5.5"}, {"h": {"en": "From the equation to a vessel: the six design steps", "gu": "Equation થી પાત્ર સુધી: design ના છ પગલાં"}, "body": {"en": "<p>A design equation gives a theoretical volume. A vessel has to be built, filled with catalyst, cleaned, inspected and kept away from a runaway, so the calculated volume is only the starting point. The same six steps are used whether the answer is a batch time or a reactor volume.</p><div class=\"math\"> 1. 1. fix the stoichiometry and the rate law, from the laboratory data of Unit 3\n 2. 2. fix the target conversion and the feed rate, from the material balance\n 3. 3. choose the model - batch, CSTR, train of CSTRs or PFR - and take its equation\n 4. 4. calculate the ideal time or volume at the design temperature\n 5. 5. add the margin: freeboard, fouling, catalyst decay, turndown\n 6. 6. check what the equation does not model: heat transfer, pressure drop, mixing</div><table><tr><th>Item</th><th>Typical margin</th><th>Why</th></tr><tr><td>batch freeboard</td><td>20-30 %</td><td>foam, stirrer vortex, thermal expansion</td></tr><tr><td>catalyst decay</td><td>10-30 %</td><td>activity falls before the next shutdown</td></tr><tr><td>fouling and scale</td><td>10-20 %</td><td>heat transfer, not volume, is usually the limit</td></tr><tr><td>turndown</td><td>20 % above minimum</td><td>the plant rarely runs at nameplate</td></tr></table><div class=\"eq\">V_vessel = V_design x (1 + margin)   t_cycle = t_reaction + t_turnaround</div><p><b>Why it is true.</b> The design equation is exact for the model and wrong for the plant, and the two errors are not the same size. Mixing, heat transfer and pressure drop can each cut the achievable conversion by several points, while the margin only adds volume, so the margin is spent where the physics is least certain.</p><p><b>Check your answer.</b> Cross-check the finished size against a known plant: a 46 m3 PFR is a tube of 0.6 m diameter and about 160 m long, or a bundle of 60 tubes of 2.7 m. If the geometry looks impossible, the rate constant or the flow rate is out by a factor of ten.</p><p><b>Common mistake.</b> Sending the ideal volume to the fabricator. The ideal volume is what the kinetics asks for; the vessel also needs a jacket, a distributor, nozzles, a manway and a support, and those take space that the reaction volume cannot use.</p>", "gu": "<p>Design equation સૈદ્ધાંતિક volume આપે. પાત્ર બનાવવું પડે, catalyst ભરવો પડે, સાફ કરવું પડે, તપાસવું પડે અને runaway થી દૂર રાખવું પડે, તેથી ગણેલું volume ફક્ત શરૂઆત છે. જવાબ batch time હોય કે reactor volume, એ જ છ પગલાં વપરાય.</p><div class=\"math\"> 1. 1. fix the stoichiometry and the rate law, from the laboratory data of Unit 3\n 2. 2. fix the target conversion and the feed rate, from the material balance\n 3. 3. choose the model - batch, CSTR, train of CSTRs or PFR - and take its equation\n 4. 4. calculate the ideal time or volume at the design temperature\n 5. 5. add the margin: freeboard, fouling, catalyst decay, turndown\n 6. 6. check what the equation does not model: heat transfer, pressure drop, mixing</div><table><tr><th>બાબત</th><th>સામાન્ય માર્જિન</th><th>કેમ</th></tr><tr><td>batch freeboard</td><td>20-30 %</td><td>foam, stirrer નો ભંગાણ, thermal expansion</td></tr><tr><td>catalyst decay</td><td>10-30 %</td><td>આગલા shutdown પહેલા activity ઘટે</td></tr><tr><td>fouling અને scale</td><td>10-20 %</td><td>મર્યાદા સામાન્ય રીતે heat transfer હોય, volume નહીં</td></tr><tr><td>turndown</td><td>લઘુતમથી 20 % ઉપર</td><td>plant ભાગ્યે જ nameplate પર ચાલે</td></tr></table><div class=\"eq\">V_vessel = V_design x (1 + margin)   t_cycle = t_reaction + t_turnaround</div><p><b>કેમ સાચું છે.</b> Design equation model માટે સાચું છે અને plant માટે ખોટું, અને બંને ભૂલો સરખી નથી. Mixing, heat transfer અને pressure drop દરેક મળીને conversion કેટલાક ટકા ઘટાડી શકે, જ્યારે માર્જિન ફક્ત volume ઉમેરે, તેથી માર્જિન ત્યાં વાપરાય જ્યાં ભૌતિકશાસ્ત્ર સૌથી ઓછું ચોક્કસ છે.</p><p><b>જવાબ ચકાસો.</b> તૈયાર માપ જાણીતા plant સાથે ચકાસો: 46 m3 નો PFR 0.6 m વ્યાસ અને લગભગ 160 m લાંબી નળી છે, કે 2.7 m ની 60 નળીઓનું bundle. ભૂમિતિ અશક્ય લાગે તો rate constant કે flow rate દશ ગણો ખોટો છે.</p><p><b>સામાન્ય ભૂલ.</b> Ideal volume સીધું fabricator ને મોકલવું. Ideal volume kinetics માંગે તે છે; પાત્રને jacket, distributor, nozzles, manway અને support પણ જોઈએ, અને તે જગ્યા reaction volume વાપરી શકતું નથી.</p>"}, "syllabus_item": "5.5"}]}, {"title": {"en": "5.6 Solved Numericals, Step by Step", "gu": "5.6 ઉકેલેલા દાખલા, પગલે પગલે"}, "items": [{"h": {"en": "Batch time, cycle and daily output", "gu": "Batch time, cycle અને રોજનું ઉત્પાદન"}, "body": {"en": "<h4>Question (6 marks)</h4><p>A 1.5 m3 batch reactor is charged with CA0 = 2.0 kmol/m3 of A. The reaction is first order with k = 0.030 min-1 and is run to 90 % conversion. Filling, heating, emptying and cleaning take 25 min. Find the reaction time, the cycle time, the number of batches per day and the daily production of A reacted.</p><h4>Step 1 - reaction time</h4><div class=\"math\">t = (1/k) ln[1/(1 - X)] = (1/0.030) ln(1/0.10)\n  = 33.33 x 2.303 = 76.8 min</div><h4>Step 2 - cycle time</h4><div class=\"math\">cycle = 76.8 + 25 = 101.8 min\nbatches a day = 1440/101.8 = 14.1  ->  14 whole batches</div><h4>Step 3 - daily production</h4><div class=\"math\">A charged = CA0 V = 2.0 x 1.5 = 3.0 kmol\nA reacted per batch = 0.90 x 3.0 = 2.70 kmol\nper day = 14 x 2.70 = 37.8 kmol</div><div class=\"eq\">t = 76.8 min,  cycle = 101.8 min,  14 batches/day,  37.8 kmol of A a day</div><p>Only 75 % of the day is reaction time. Cutting the turnaround from 25 to 10 min would give 16.6 batches, i.e. 18 % more product from the same vessel - which is why turnaround is measured and argued about in every batch plant.</p><p><b>Check your answer.</b> exp(-0.030 x 76.8) = exp(-2.30) = 0.100, so 10 % of A is left.</p><p><b>Common mistake.</b> Rounding the number of batches up. A plant can run 14 batches, not 14.1; rounding up overstates capacity by a few per cent every time.</p>", "gu": "<h4>પ્રશ્ન (6 marks)</h4><p>1.5 m3 ના batch reactor માં CA0 = 2.0 kmol/m3 A ભરાય છે. પ્રક્રિયા first order છે, k = 0.030 min-1, અને 90 % conversion સુધી ચલાવાય છે. ભરવું, ગરમ કરવું, ખાલી કરવું અને સફાઈ 25 min લે છે. Reaction time, cycle time, દિવસના batch અને રોજ પ્રક્રિયા થતા A નું ઉત્પાદન શોધો.</p><h4>પગલું 1 - reaction time</h4><div class=\"math\">t = (1/k) ln[1/(1 - X)] = (1/0.030) ln(1/0.10)\n  = 33.33 x 2.303 = 76.8 min</div><h4>પગલું 2 - cycle time</h4><div class=\"math\">cycle = 76.8 + 25 = 101.8 min\nbatches a day = 1440/101.8 = 14.1  ->  14 whole batches</div><h4>પગલું 3 - રોજનું ઉત્પાદન</h4><div class=\"math\">A charged = CA0 V = 2.0 x 1.5 = 3.0 kmol\nA reacted per batch = 0.90 x 3.0 = 2.70 kmol\nper day = 14 x 2.70 = 37.8 kmol</div><div class=\"eq\">t = 76.8 min,  cycle = 101.8 min,  14 batches/day,  37.8 kmol of A a day</div><p>દિવસના ફક્ત 75 % સમય reaction છે. Turnaround 25 થી 10 min કરવાથી 16.6 batch મળે, એટલે એ જ પાત્રમાંથી 18 % વધુ ઉત્પાદન - તેથી જ દરેક batch plant માં turnaround માપાય અને તેના પર ચર્ચા થાય.</p><p><b>જવાબ ચકાસો.</b> exp(-0.030 x 76.8) = exp(-2.30) = 0.100, તેથી 10 % A બાકી.</p><p><b>સામાન્ય ભૂલ.</b> Batch ની સંખ્યાને ઉપર ગોળ કરવી. Plant 14 batch ચલાવી શકે, 14.1 નહીં; ઉપર ગોળ કરવાથી દર વખતે ક્ષમતા થોડા ટકા વધારે દેખાય.</p>"}}, {"h": {"en": "CSTR volume and space velocity", "gu": "CSTR નું volume અને space velocity"}, "body": {"en": "<h4>Question (7 marks)</h4><p>A first order reaction with k = 0.20 h-1 and CA0 = 1.5 kmol/m3 is to be carried out to 85 % conversion at a feed rate of 4.0 m3/h. Find the space time, the reactor volume, the exit rate of reaction and the space velocity.</p><h4>Step 1 - space time</h4><div class=\"math\">tau = X/[k(1 - X)] = 0.85/(0.20 x 0.15)\n    = 0.85/0.0300 = 28.3 h</div><h4>Step 2 - volume</h4><div class=\"math\">V = v0 tau = 4.0 x 28.3 = 113 m3</div><h4>Step 3 - the exit rate, as a check</h4><div class=\"math\">FA0 = v0 CA0 = 4.0 x 1.5 = 6.0 kmol/h\n-rA,exit = k CA0 (1 - X) = 0.20 x 1.5 x 0.15 = 0.045 kmol/(m3 h)\nV = FA0 X/(-rA) = 6.0 x 0.85/0.045 = 113 m3</div><h4>Step 4 - space velocity</h4><div class=\"math\">SV = 1/tau = 1/28.3 = 0.0353 h-1</div><div class=\"eq\">tau = 28.3 h,  V = 113 m3,  SV = 0.035 h-1</div><p>A space time of 28 h is long, and it is the price of 85 % conversion in one tank. Two equal tanks in series would need 7.9 h each, i.e. about 63 m3 in all, for the same duty.</p><p><b>Check your answer.</b> The two routes to V agree - from tau and from the exit rate - which is the whole point of the rectangle: V/FA0 is both X times the height and the space time times CA0.</p><p><b>Common mistake.</b> Using CA0 instead of CA0(1 - X) in the exit rate. The rate in a CSTR must be taken at the composition that actually leaves the vessel.</p>", "gu": "<h4>પ્રશ્ન (7 marks)</h4><p>k = 0.20 h-1 અને CA0 = 1.5 kmol/m3 વાળી first order પ્રક્રિયા 4.0 m3/h ના feed rate પર 85 % conversion સુધી કરવી છે. Space time, reactor volume, exit પરનો rate of reaction અને space velocity શોધો.</p><h4>પગલું 1 - space time</h4><div class=\"math\">tau = X/[k(1 - X)] = 0.85/(0.20 x 0.15)\n    = 0.85/0.0300 = 28.3 h</div><h4>પગલું 2 - volume</h4><div class=\"math\">V = v0 tau = 4.0 x 28.3 = 113 m3</div><h4>પગલું 3 - exit rate, ચકાસણી તરીકે</h4><div class=\"math\">FA0 = v0 CA0 = 4.0 x 1.5 = 6.0 kmol/h\n-rA,exit = k CA0 (1 - X) = 0.20 x 1.5 x 0.15 = 0.045 kmol/(m3 h)\nV = FA0 X/(-rA) = 6.0 x 0.85/0.045 = 113 m3</div><h4>પગલું 4 - space velocity</h4><div class=\"math\">SV = 1/tau = 1/28.3 = 0.0353 h-1</div><div class=\"eq\">tau = 28.3 h,  V = 113 m3,  SV = 0.035 h-1</div><p>28 h નો space time લાંબો છે, અને એ એક ટાંકીમાં 85 % conversion ની કિંમત છે. Series માં બે સરખી ટાંકીને દરેક 7.9 h જોઈએ, એટલે એ જ કામ માટે કુલ લગભગ 63 m3.</p><p><b>જવાબ ચકાસો.</b> V સુધીના બંને રસ્તા - tau થી અને exit rate થી - સરખા આવે, જે લંબચોરસનો આખો મુદ્દો છે: V/FA0 એ X ગુણ્યા ઊંચાઈ અને space time ગુણ્યા CA0 બંને છે.</p><p><b>સામાન્ય ભૂલ.</b> Exit rate માં CA0(1 - X) ની જગ્યાએ CA0 વાપરવું. CSTR માં rate પાત્રમાંથી ખરેખર નીકળતી રચના પર લેવો પડે.</p>"}}, {"h": {"en": "The same duty in a PFR and in a train of CSTRs", "gu": "એ જ કામ PFR માં અને CSTR ની શ્રેણીમાં"}, "body": {"en": "<h4>Question (8 marks)</h4><p>The duty of the previous problem (k = 0.20 h-1, v0 = 4.0 m3/h, X = 0.85) is to be met with a PFR and, separately, with three equal CSTRs in series. Find both volumes and compare them with the single CSTR.</p><h4>Step 1 - PFR</h4><div class=\"math\">tau = ln[1/(1 - X)]/k = ln(1/0.15)/0.20 = 1.897/0.20 = 9.49 h\nV = 4.0 x 9.49 = 37.9 m3</div><h4>Step 2 - three equal CSTRs</h4><div class=\"math\">1 - X = 1/(1 + k tau/3)^3  ->  1 + k tau/3 = (1/0.15)^(1/3) = 1.882\nk tau total = 3 x 0.882 = 2.646  ->  tau each = 0.882/0.20 = 4.41 h\nV each = 4.0 x 4.41 = 17.6 m3,  total = 52.9 m3</div><h4>Step 3 - comparison</h4><div class=\"math\">one CSTR 113 m3 : three CSTRs 53 m3 : one PFR 37.9 m3\nPFR/CSTR = 37.9/113 = 0.34,  train/CSTR = 53/113 = 0.47</div><div class=\"eq\">PFR 37.9 m3, three CSTRs 52.9 m3, one CSTR 113 m3</div><p>Three tanks recover (113 - 52.9)/(113 - 37.9) = 80 % of the volume saving a PFR would give, at much lower risk: each tank is a standard stirred vessel. This is the usual compromise in a plant that must also handle solids or changing products.</p><p><b>Check your answer.</b> (1 + 0.882) cubed = 6.67 = 1/0.15, so 1 - X = 0.15 and X = 0.85.</p><p><b>Common mistake.</b> Splitting the single-CSTR space time by three. The space time per tank of a train is not one third of the single tank's; it comes from the nth-root relation above.</p>", "gu": "<h4>પ્રશ્ન (8 marks)</h4><p>આગલા દાખલાનું કામ (k = 0.20 h-1, v0 = 4.0 m3/h, X = 0.85) PFR થી અને અલગથી series માં ત્રણ સરખા CSTR થી કરવું છે. બંને volumes શોધો અને એક CSTR સાથે સરખાવો.</p><h4>પગલું 1 - PFR</h4><div class=\"math\">tau = ln[1/(1 - X)]/k = ln(1/0.15)/0.20 = 1.897/0.20 = 9.49 h\nV = 4.0 x 9.49 = 37.9 m3</div><h4>પગલું 2 - ત્રણ સરખા CSTR</h4><div class=\"math\">1 - X = 1/(1 + k tau/3)^3  ->  1 + k tau/3 = (1/0.15)^(1/3) = 1.882\nk tau total = 3 x 0.882 = 2.646  ->  tau each = 0.882/0.20 = 4.41 h\nV each = 4.0 x 4.41 = 17.6 m3,  total = 52.9 m3</div><h4>પગલું 3 - સરખામણી</h4><div class=\"math\">one CSTR 113 m3 : three CSTRs 53 m3 : one PFR 37.9 m3\nPFR/CSTR = 37.9/113 = 0.34,  train/CSTR = 53/113 = 0.47</div><div class=\"eq\">PFR 37.9 m3, three CSTRs 52.9 m3, one CSTR 113 m3</div><p>ત્રણ ટાંકી PFR આપે તે volume બચતના (113 - 52.9)/(113 - 37.9) = 80 % પાછી મેળવે, ઘણા ઓછા જોખમે: દરેક ટાંકી પ્રમાણભૂત હલાવેલું પાત્ર છે. જે plant ને solids કે બદલાતા products સંભાળવા હોય ત્યાં આ સામાન્ય સમાધાન છે.</p><p><b>જવાબ ચકાસો.</b> (1 + 0.882) નો ઘન = 6.67 = 1/0.15, તેથી 1 - X = 0.15 અને X = 0.85.</p><p><b>સામાન્ય ભૂલ.</b> એક CSTR નો space time ત્રણે ભાગવો. શ્રેણીમાં દરેક ટાંકીનો space time એક ટાંકીના ત્રીજા ભાગ જેટલો નથી; તે ઉપરના nth-root સંબંધમાંથી આવે.</p>"}}, {"h": {"en": "Second order reaction: CSTR against PFR", "gu": "Second order પ્રક્રિયા: CSTR સામે PFR"}, "body": {"en": "<h4>Question (7 marks)</h4><p>A + B -> products is second order overall with CA0 = CB0 = 1.2 kmol/m3 and k = 0.020 m3/(kmol min). The feed is 0.5 m3/min and the conversion required is 75 %. Find the volume needed in a CSTR and in a PFR, and the ratio between them.</p><h4>Step 1 - CSTR: rate at the exit</h4><div class=\"math\">-rA = k CA0^2 (1 - X)^2 = 0.020 x 1.44 x (0.25)^2\n    = 0.020 x 1.44 x 0.0625 = 1.80e-3 kmol/(m3 min)</div><h4>Step 2 - CSTR volume</h4><div class=\"math\">V = v0 CA0 X/(-rA) = 0.5 x 1.2 x 0.75/1.80e-3\n  = 0.45/1.80e-3 = 250 m3      (tau = 500 min)</div><h4>Step 3 - PFR volume</h4><div class=\"math\">tau = X/[k CA0 (1 - X)] = 0.75/(0.020 x 1.2 x 0.25)\n    = 0.75/0.0060 = 125 min  ->  V = 0.5 x 125 = 62.5 m3</div><div class=\"eq\">CSTR 250 m3,  PFR 62.5 m3,  ratio 4.0</div><p>For second order with equal feed concentrations the ratio is exactly 1/(1 - X), i.e. 4 at 75 %. That is a neat result worth remembering: for this kinetics the CSTR penalty is simply the reciprocal of the unconverted fraction.</p><p><b>Check your answer.</b> General check for second order: V_CSTR/V_PFR = 1/(1 - X). At 50 % it is 2, at 90 % it is 10 - both are easy to confirm from the two formulas.</p><p><b>Common mistake.</b> Using the first order form of the CSTR equation for second order kinetics. The rate must be written with the squared concentration term before it is put into the balance.</p>", "gu": "<h4>પ્રશ્ન (7 marks)</h4><p>A + B -> products કુલ મળીને second order છે, CA0 = CB0 = 1.2 kmol/m3 અને k = 0.020 m3/(kmol min). Feed 0.5 m3/min છે અને 75 % conversion જોઈએ. CSTR અને PFR માં જરૂરી volume અને તેમનો ગુણોત્તર શોધો.</p><h4>પગલું 1 - CSTR: exit પર rate</h4><div class=\"math\">-rA = k CA0^2 (1 - X)^2 = 0.020 x 1.44 x (0.25)^2\n    = 0.020 x 1.44 x 0.0625 = 1.80e-3 kmol/(m3 min)</div><h4>પગલું 2 - CSTR નું volume</h4><div class=\"math\">V = v0 CA0 X/(-rA) = 0.5 x 1.2 x 0.75/1.80e-3\n  = 0.45/1.80e-3 = 250 m3      (tau = 500 min)</div><h4>પગલું 3 - PFR નું volume</h4><div class=\"math\">tau = X/[k CA0 (1 - X)] = 0.75/(0.020 x 1.2 x 0.25)\n    = 0.75/0.0060 = 125 min  ->  V = 0.5 x 125 = 62.5 m3</div><div class=\"eq\">CSTR 250 m3,  PFR 62.5 m3,  ratio 4.0</div><p>સરખા feed concentrations વાળી second order માટે ગુણોત્તર બરાબર 1/(1 - X) થાય, એટલે 75 % પર 4. આ સરસ પરિણામ યાદ રાખવા જેવું છે: આ kinetics માટે CSTR ની સજા ફક્ત ન વપરાયેલા અંશનો વ્યસ્ત છે.</p><p><b>જવાબ ચકાસો.</b> Second order માટે સામાન્ય ચકાસણી: V_CSTR/V_PFR = 1/(1 - X). 50 % પર 2, 90 % પર 10 - બંને બે સૂત્રોમાંથી સહેલાઈથી ચકાસાય.</p><p><b>સામાન્ય ભૂલ.</b> Second order kinetics માટે CSTR equation નું first order સ્વરૂપ વાપરવું. Rate balance માં મૂકતા પહેલા વર્ગવાળા concentration પદ સાથે લખવો પડે.</p>"}}, {"h": {"en": "Space time, space velocity and holding time", "gu": "Space time, space velocity અને holding time"}, "body": {"en": "<h4>Question (6 marks)</h4><p>A gas phase reaction runs in a 2.4 m3 CSTR. The feed is 0.8 m3/min measured at 2 bar and 350 K; inside the reactor the gas is at 6 bar and 400 K. Find the space time, the space velocity and the holding time, and explain the difference.</p><h4>Step 1 - space time</h4><div class=\"math\">tau = V/v0 = 2.4/0.8 = 3.0 min = 0.050 h</div><h4>Step 2 - space velocity</h4><div class=\"math\">SV = 1/tau = 1/0.050 = 20 h-1</div><h4>Step 3 - the flow inside</h4><div class=\"math\">v = v0 (P0/P)(T/T0) = 0.8 x (2/6) x (400/350)\n  = 0.8 x 0.333 x 1.143 = 0.305 m3/min</div><h4>Step 4 - holding time</h4><div class=\"math\">t_bar = V/v = 2.4/0.305 = 7.9 min</div><div class=\"eq\">tau = 3.0 min,  SV = 20 h-1,  holding time = 7.9 min</div><p>The gas is compressed to three times the feed pressure, so it occupies a third of the volume it did and stays nearly three times as long as the space time says. Space time is the design number; holding time is the number that matters for a side reaction or for a thermal hazard.</p><p><b>Check your answer.</b> Both numbers must satisfy V = tau v0 = t_bar v: 3.0 x 0.8 = 2.4 and 7.9 x 0.305 = 2.4.</p><p><b>Common mistake.</b> Quoting the space velocity as a residence time. 20 h-1 is not 20 hours; it means twenty reactor volumes of feed pass every hour, so the space time is three minutes.</p>", "gu": "<h4>પ્રશ્ન (6 marks)</h4><p>Gas phase પ્રક્રિયા 2.4 m3 ના CSTR માં ચાલે છે. Feed 0.8 m3/min છે, જે 2 bar અને 350 K પર માપેલો છે; reactor ની અંદર gas 6 bar અને 400 K પર છે. Space time, space velocity અને holding time શોધો અને ફરક સમજાવો.</p><h4>પગલું 1 - space time</h4><div class=\"math\">tau = V/v0 = 2.4/0.8 = 3.0 min = 0.050 h</div><h4>પગલું 2 - space velocity</h4><div class=\"math\">SV = 1/tau = 1/0.050 = 20 h-1</div><h4>પગલું 3 - અંદરનો flow</h4><div class=\"math\">v = v0 (P0/P)(T/T0) = 0.8 x (2/6) x (400/350)\n  = 0.8 x 0.333 x 1.143 = 0.305 m3/min</div><h4>પગલું 4 - holding time</h4><div class=\"math\">t_bar = V/v = 2.4/0.305 = 7.9 min</div><div class=\"eq\">tau = 3.0 min,  SV = 20 h-1,  holding time = 7.9 min</div><p>Gas feed pressure કરતાં ત્રણ ગણું દબાય છે, તેથી તે પહેલા કરતાં ત્રીજા ભાગની જગ્યા લે અને space time કહે તેના કરતાં લગભગ ત્રણ ગણો સમય રહે. Space time design નો આંકડો છે; holding time side reaction કે thermal hazard માટે મહત્વનો આંકડો છે.</p><p><b>જવાબ ચકાસો.</b> બંને આંકડાએ V = tau v0 = t_bar v પૂરું કરવું પડે: 3.0 x 0.8 = 2.4 અને 7.9 x 0.305 = 2.4.</p><p><b>સામાન્ય ભૂલ.</b> Space velocity ને residence time ગણવો. 20 h-1 એટલે 20 કલાક નહીં; તેનો અર્થ કલાક દીઠ વીસ reactor volumes feed પસાર થાય, તેથી space time ત્રણ મિનિટ છે.</p>"}}, {"h": {"en": "Choosing the smallest vessel for 90 % conversion", "gu": "90 % conversion માટે સૌથી નાનું પાત્ર પસંદ કરવું"}, "body": {"en": "<h4>Question (7 marks)</h4><p>A first order reaction has k = 0.15 h-1 and the feed rate is 3.0 m3/h. The product must reach 90 % conversion. Compare the volume of one CSTR, two equal CSTRs in series and one PFR, and state which you would recommend and why.</p><h4>Step 1 - one CSTR</h4><div class=\"math\">k tau = X/(1 - X) = 0.90/0.10 = 9.0  ->  tau = 60 h\nV = 3.0 x 60 = 180 m3</div><h4>Step 2 - two equal CSTRs</h4><div class=\"math\">1 + k tau/2 = (1/0.10)^(1/2) = 3.162\nk tau each = 2.162  ->  tau each = 14.4 h\nV each = 3.0 x 14.4 = 43.2 m3,  total = 86.5 m3</div><h4>Step 3 - one PFR</h4><div class=\"math\">k tau = ln(1/0.10) = 2.303  ->  tau = 15.35 h\nV = 3.0 x 15.35 = 46.1 m3</div><div class=\"eq\">CSTR 180 m3,  two CSTRs 86.5 m3,  PFR 46.1 m3</div><p>Recommendation: the PFR if the reaction is clean, single phase and the plant can take a tube; two tanks if solids, cleaning or product changes rule a tube out. One tank alone would be 180 m3 at 90 % - nearly four times the tube - and is only chosen for a small campaign.</p><p><b>Check your answer.</b> Ratios: 180/46.1 = 3.9 and 86.5/46.1 = 1.9, matching the yardsticks of the formula sheet for 90 % conversion.</p><p><b>Common mistake.</b> Recommending the smallest volume without a heat transfer check. A 46 m3 PFR at 90 % of a fast exothermic reaction may be impossible to cool; the tube that wins on volume can lose on temperature control.</p>", "gu": "<h4>પ્રશ્ન (7 marks)</h4><p>First order પ્રક્રિયાનો k = 0.15 h-1 છે અને feed rate 3.0 m3/h છે. Product 90 % conversion સુધી પહોંચવું જોઈએ. એક CSTR, series માં બે સરખા CSTR અને એક PFR ના volume સરખાવો, અને કયો સૂચવશો તે કારણ સાથે કહો.</p><h4>પગલું 1 - એક CSTR</h4><div class=\"math\">k tau = X/(1 - X) = 0.90/0.10 = 9.0  ->  tau = 60 h\nV = 3.0 x 60 = 180 m3</div><h4>પગલું 2 - બે સરખા CSTR</h4><div class=\"math\">1 + k tau/2 = (1/0.10)^(1/2) = 3.162\nk tau each = 2.162  ->  tau each = 14.4 h\nV each = 3.0 x 14.4 = 43.2 m3,  total = 86.5 m3</div><h4>પગલું 3 - એક PFR</h4><div class=\"math\">k tau = ln(1/0.10) = 2.303  ->  tau = 15.35 h\nV = 3.0 x 15.35 = 46.1 m3</div><div class=\"eq\">CSTR 180 m3,  two CSTRs 86.5 m3,  PFR 46.1 m3</div><p>સૂચન: પ્રક્રિયા સ્વચ્છ, single phase અને plant નળી લઈ શકે તો PFR; solids, સફાઈ કે product બદલાવ નળી ન રહેવા દે તો બે ટાંકી. એક ટાંકી 90 % પર 180 m3 થાય - નળી કરતાં લગભગ ચાર ગણી - અને નાના campaign માટે જ પસંદ થાય.</p><p><b>જવાબ ચકાસો.</b> ગુણોત્તર: 180/46.1 = 3.9 અને 86.5/46.1 = 1.9, જે 90 % conversion માટે formula sheet ના માપદંડ સાથે મળે.</p><p><b>સામાન્ય ભૂલ.</b> Heat transfer ચકાસ્યા વગર સૌથી નાનું volume સૂચવવું. ઝડપી exothermic પ્રક્રિયાના 90 % પર 46 m3 નો PFR ઠંડો કરવો અશક્ય હોઈ શકે; volume પર જીતતી નળી temperature control પર હારી શકે.</p>"}}]}], "diagrams": [{"id": "u5_perf", "title": {"en": "One balance, three design equations", "gu": "એક balance, ત્રણ design equations"}, "file": "diagrams/u5_perf.svg", "caption": {"en": "The same mole balance written three ways: for a batch it gives a time, for a CSTR an algebraic volume, for a PFR an integral along the tube.", "gu": "એ જ mole balance ત્રણ રીતે: batch માટે સમય, CSTR માટે બીજગણિતીય volume, PFR માટે નળી પર integral."}}, {"id": "u5_batch", "title": {"en": "Designing a batch reactor", "gu": "Batch reactor ની design"}, "file": "diagrams/u5_batch.svg", "caption": {"en": "The batch reactor is designed in time: the slope of the concentration curve at any instant is the rate, so the steeper the curve the sooner the conversion arrives.", "gu": "Batch reactor સમયમાં design થાય: concentration વક્રનો ઢોળાવ તે ક્ષણનો rate છે, તેથી ઢોળાવ જેટલો તીવ્ર તેટલું conversion ઝડપથી મળે."}}, {"id": "u5_cstr", "title": {"en": "Designing a CSTR: one rectangle", "gu": "CSTR ની design: એક લંબચોરસ"}, "file": "diagrams/u5_cstr.svg", "caption": {"en": "On a plot of 1/(-rA) against X the CSTR is one rectangle: width X, height the rate at the exit, area V/FA0. At 80 % conversion that area is k tau = 4.", "gu": "1/(-rA) સામે X ના ગ્રાફ પર CSTR એક લંબચોરસ છે: પહોળાઈ X, ઊંચાઈ exit નો rate, ક્ષેત્રફળ V/FA0. 80 % conversion પર એ ક્ષેત્રફળ k tau = 4 થાય."}}, {"id": "u5_pfr", "title": {"en": "Designing a PFR: the area", "gu": "PFR ની design: ક્ષેત્રફળ"}, "file": "diagrams/u5_pfr.svg", "caption": {"en": "The PFR is the area under the same curve. At 80 % conversion it is ln 5 = 1.61, so the tube needs 2.5 times less volume than the tank for the same duty.", "gu": "PFR એ એ જ વક્ર નીચેનું ક્ષેત્રફળ છે. 80 % conversion પર તે ln 5 = 1.61 થાય, તેથી એ જ કામ માટે નળીને ટાંકી કરતાં 2.5 ગણું ઓછું volume જોઈએ."}}, {"id": "u5_series", "title": {"en": "Two CSTRs in series", "gu": "Series માં બે CSTR"}, "file": "diagrams/u5_series.svg", "caption": {"en": "Two equal CSTRs in series are two rectangles of k tau = 1.236 each, and together they reach 80 % - the geometry behind the numbers of Unit 4.", "gu": "Series માં બે સરખા CSTR એ દરેક k tau = 1.236 વાળા બે લંબચોરસ છે, અને સાથે મળીને 80 % સુધી પહોંચે - Unit 4 ના આંકડા પાછળની ભૂમિતિ."}}, {"id": "u5_space", "title": {"en": "Space time against holding time", "gu": "Space time સામે holding time"}, "file": "diagrams/u5_space.svg", "caption": {"en": "Space time is fixed by the feed volume flow; holding time is what the fluid really spends inside, and for a gas it moves with temperature and pressure.", "gu": "Space time feed ના volume flow થી નક્કી થાય; holding time એ છે જે પ્રવાહી ખરેખર અંદર ગાળે, અને gas માટે તે temperature તથા pressure સાથે બદલાય."}}, {"id": "u5_bars", "title": {"en": "Volumes for the same duty", "gu": "એ જ કામ માટેના volumes"}, "file": "diagrams/u5_bars.svg", "caption": {"en": "Same duty (80 % of a first order reaction, k = 0.25 h-1, v0 = 7.2 m3/h): one CSTR 115 m3, two CSTRs 71 m3, one PFR 46 m3.", "gu": "એ જ કામ (first order પ્રક્રિયાના 80 %, k = 0.25 h-1, v0 = 7.2 m3/h): એક CSTR 115 m3, બે CSTR 71 m3, એક PFR 46 m3."}}], "equations": [{"title": {"en": "The performance equation", "gu": "Performance equation ના સૂત્રો"}, "items": [{"name": {"en": "Batch", "gu": "Batch"}, "f": "t = NA0 x integral dX/(-rA V)", "terms": {"en": "No flow term: the answer is a time.", "gu": "કોઈ flow ભાગ નહીં: જવાબ સમય છે."}}, {"name": {"en": "CSTR", "gu": "CSTR"}, "f": "V = FA0 X / (-rA)exit", "terms": {"en": "One algebraic line taken at the outlet composition.", "gu": "Outlet રચના પર લેવાયેલી એક બીજગણિતીય લીટી."}}, {"name": {"en": "PFR", "gu": "PFR"}, "f": "V = FA0 x integral dX/(-rA)", "terms": {"en": "An integral along the tube, because the composition keeps changing.", "gu": "નળી પર integral, કારણ કે રચના સતત બદલાય છે."}}]}, {"title": {"en": "Constant density", "gu": "Constant density"}, "items": [{"name": {"en": "Concentration", "gu": "Concentration"}, "f": "CA = CA0 (1 - X)", "terms": {"en": "Holds for liquids and for gases with no mole change.", "gu": "પ્રવાહી માટે અને mole change ન હોય તેવા gases માટે સાચું."}}, {"name": {"en": "nth order rate", "gu": "nth order rate"}, "f": "-rA = k CA0^n (1 - X)^n", "terms": {"en": "Turns the design equation into an integral in X alone.", "gu": "Design equation ને ફક્ત X ના integral માં ફેરવે."}}, {"name": {"en": "Gas with mole change", "gu": "Mole change વાળો gas"}, "f": "CA = CA0 (1 - X)/(1 + eps X)", "terms": {"en": "The expansion factor of Unit 3; the simple closed forms no longer apply.", "gu": "Unit 3 નો expansion factor; સાદાં closed forms હવે લાગુ ન પડે."}}]}, {"title": {"en": "Space time and space velocity", "gu": "Space time અને space velocity"}, "items": [{"name": {"en": "Space time", "gu": "Space time"}, "f": "tau = V/v0 = CA0 X/(-rA)exit", "terms": {"en": "Feed flow measured at the inlet temperature and pressure.", "gu": "Inlet temperature અને pressure પર માપેલો feed flow."}}, {"name": {"en": "Space velocity", "gu": "Space velocity"}, "f": "SV = 1/tau = v0/V", "terms": {"en": "Quoted in h-1; always state the basis - reactor, catalyst volume or mass.", "gu": "h-1 માં લખાય; આધાર હંમેશા જણાવો - reactor, catalyst volume કે દળ."}}, {"name": {"en": "Holding time", "gu": "Holding time"}, "f": "t_bar = V/v", "terms": {"en": "v is the flow at the reactor conditions, so it moves with T and P.", "gu": "v એ reactor ની શરતો પરનો flow છે, તેથી T અને P સાથે બદલાય."}}, {"name": {"en": "Gas correction", "gu": "Gas સુધારો"}, "f": "v/v0 = (P0/P)(T/T0)", "terms": {"en": "Ideal gas, same molar flow: compress the gas and it stays longer.", "gu": "Ideal gas, એ જ molar flow: gas દબાવો તો તે વધુ સમય રહે."}}]}, {"title": {"en": "First order yardsticks", "gu": "First order ના માપદંડ"}, "items": [{"name": {"en": "CSTR", "gu": "CSTR"}, "f": "k tau = X/(1 - X)", "terms": {"en": "4 at 80 %, 9 at 90 %, 19 at 95 %.", "gu": "80 % પર 4, 90 % પર 9, 95 % પર 19."}}, {"name": {"en": "PFR", "gu": "PFR"}, "f": "k tau = ln[1/(1 - X)]", "terms": {"en": "1.61 at 80 %, 2.30 at 90 %, 4.61 at 99 %.", "gu": "80 % પર 1.61, 90 % પર 2.30, 99 % પર 4.61."}}, {"name": {"en": "Volume ratio", "gu": "Volume ગુણોત્તર"}, "f": "V_CSTR/V_PFR = [X/(1 - X)] / ln[1/(1 - X)]", "terms": {"en": "2.5 at 80 %, 3.9 at 90 %, 21 at 99 %.", "gu": "80 % પર 2.5, 90 % પર 3.9, 99 % પર 21."}}]}, {"title": {"en": "Trains and margins", "gu": "શ્રેણી અને માર્જિન"}, "items": [{"name": {"en": "Equal CSTRs in series", "gu": "Series માં સરખા CSTR"}, "f": "1 - X = 1/(1 + k tau/n)^n", "terms": {"en": "The train approaches a PFR as n grows.", "gu": "n વધે તેમ શ્રેણી PFR ની નજીક જાય."}}, {"name": {"en": "Two tanks", "gu": "બે ટાંકી"}, "f": "k tau each = (1 - X)^(-1/2) - 1", "terms": {"en": "1.236 each for 80 %: half the volume of one tank.", "gu": "80 % માટે દરેક 1.236: એક ટાંકી કરતાં અડધું volume."}}, {"name": {"en": "Vessel size", "gu": "પાત્રનું માપ"}, "f": "V_vessel = V_design (1 + margin)", "terms": {"en": "Freeboard, fouling, catalyst decay and turndown.", "gu": "Freeboard, fouling, catalyst decay અને turndown."}}, {"name": {"en": "Batches per day", "gu": "દિવસના batch"}, "f": "N = 1440/(t_reaction + t_turnaround)", "terms": {"en": "Minutes per day divided by the cycle time.", "gu": "દિવસના મિનિટ ભાગ્યા cycle time."}}]}], "viva": [{"title": {"en": "The performance equation", "gu": "Performance equation ના સૂત્રો"}, "items": [{"q": {"en": "How can one mole balance give three different design equations?", "gu": "એક mole balance ત્રણ જુદાં design equations કેવી રીતે આપે?"}, "a": {"en": "Because the balance contains in, out, generation and accumulation, and each reactor model deletes a different one. A batch has no in and no out, so it keeps accumulation and gives a time. A CSTR has accumulation zero and one composition, so it gives an algebraic volume. A PFR has accumulation zero but a composition that changes along the length, so it gives an integral.", "gu": "કારણ કે balance માં અંદર, બહાર, ઉત્પન્ન અને સંચય છે, અને દરેક reactor model જુદો ભાગ કાઢી નાખે. Batch માં અંદર કે બહાર નથી, તેથી સંચય રહે અને સમય મળે. CSTR માં સંચય શૂન્ય અને એક જ રચના, તેથી બીજગણિતીય volume મળે. PFR માં સંચય શૂન્ય પણ રચના લંબાઈ પર બદલાય, તેથી integral મળે."}}, {"q": {"en": "What does the constant density assumption buy us?", "gu": "Constant density ધારણા આપણને શું આપે?"}, "a": {"en": "It removes the volume flow from the problem. With v = v0 the concentration is a straight-line function of conversion, the rate law becomes a function of conversion alone, and every design equation can be integrated by hand into the closed forms used in practice.", "gu": "તે volume flow ને સમસ્યામાંથી કાઢી નાખે. v = v0 સાથે concentration conversion નું સીધી લીટીનું વિધેય બને, rate law ફક્ત conversion નું વિધેય બને, અને દરેક design equation હાથે integrate કરી વ્યવહારમાં વપરાતાં closed forms માં આવે."}}, {"q": {"en": "When is the assumption unsafe?", "gu": "ધારણા ક્યારે ખોટી પડે?"}, "a": {"en": "Whenever the number of moles changes in the gas phase, or the temperature rises enough to change the density of a liquid. A -> 2B at 80 % conversion has a true rate about 45 % lower than the constant-density formula predicts, so the volume is under-designed.", "gu": "જ્યારે gas phase માં moles ની સંખ્યા બદલાય, કે temperature એટલું વધે કે પ્રવાહીની density બદલાય. A -> 2B માટે 80 % conversion પર સાચો rate constant-density સૂત્ર કહે તેના કરતાં લગભગ 45 % નીચો હોય, તેથી volume ઓછું ગણાય."}}]}, {"title": {"en": "Space time and space velocity", "gu": "Space time અને space velocity"}, "items": [{"q": {"en": "What is the difference between space time and holding time?", "gu": "Space time અને holding time માં શું ફરક છે?"}, "a": {"en": "Space time divides the volume by the feed rate at inlet conditions; holding time divides it by the flow actually inside the reactor. For a liquid they are nearly equal; for a gas they can differ by the pressure and temperature ratio, and the vessel then holds its inventory much longer than the space time says.", "gu": "Space time volume ને inlet શરતોના feed rate થી ભાગે; holding time એ જ volume ને reactor ની અંદરના ખરા flow થી ભાગે. પ્રવાહી માટે બંને લગભગ સરખા; gas માટે pressure અને temperature ના ગુણોત્તર જેટલા ફરક પડે, અને પાત્ર પોતાનો જથ્થો space time કહે તેના કરતાં ઘણો વધુ સમય રાખે."}}, {"q": {"en": "Why do plants quote space velocity instead of space time?", "gu": "Plants space time ની જગ્યાએ space velocity કેમ લખે?"}, "a": {"en": "Because productivity is easier to read from it: a higher space velocity means more feed per cubic metre per hour. It also lets a plant compare reactors of very different sizes at a glance, provided the basis is stated.", "gu": "કારણ કે તેમાંથી ઉત્પાદનક્ષમતા સહેલી વંચાય: ઊંચો space velocity એટલે કલાક દીઠ ઘન મીટર પ્રતિ વધુ feed. તેનાથી ખૂબ જુદા માપના reactorsની તુલના એક નજરે થાય, જો આધાર જણાવેલો હોય."}}, {"q": {"en": "A reactor is quoted as 3000 h-1 GHSV. What else must you know?", "gu": "Reactor 3000 h-1 GHSV લખેલો છે. બીજું શું જાણવું પડે?"}, "a": {"en": "The basis - gas volume per reactor volume, per catalyst volume or per catalyst mass - and the conditions of the gas volume. Bed voidage and bulk density alone can shift the number by a factor of two.", "gu": "આધાર - gas volume reactor volume દીઠ, catalyst volume દીઠ કે catalyst દળ દીઠ - અને gas volume ની શરતો. ફક્ત bed voidage અને bulk density આંકડો બે ગણો બદલી શકે."}}]}, {"title": {"en": "Choosing the reactor", "gu": "Reactor પસંદગી"}, "items": [{"q": {"en": "Why does a CSTR need more volume than a PFR?", "gu": "CSTR ને PFR કરતાં વધુ volume કેમ જોઈએ?"}, "a": {"en": "Because a CSTR works at the outlet concentration for the whole of its residence time, and that is the lowest concentration in the system. For a positive order reaction, the lowest concentration means the lowest rate, so more volume is needed to remove the same amount of A.", "gu": "કારણ કે CSTR આખા residence time દરમિયાન outlet concentration પર કામ કરે, અને તે system નું સૌથી નીચું concentration છે. Positive order માટે સૌથી નીચું concentration એટલે સૌથી નીચો rate, તેથી એટલો જ A દૂર કરવા વધુ volume જોઈએ."}}, {"q": {"en": "If the PFR is smaller, why is most of the chemical industry stirred tanks?", "gu": "PFR નાનું હોય તો પણ chemical industry માં ઘણા ટાંકા કેમ?"}, "a": {"en": "Because volume is rarely the deciding cost. A stirred tank handles solids, can be opened and cleaned, can be run batch-wise for many products, removes heat through a jacket and is easy to control at part load. A tube cannot do most of those.", "gu": "કારણ કે volume ભાગ્યે જ નિર્ણાયક ખર્ચ હોય. હલાવેલી ટાંકી solids સંભાળે, ખોલી સાફ થઈ શકે, ઘણા products માટે batch માં ચાલે, jacket થી heat કાઢે અને અડધા load પર સહેલી નિયંત્રિત થાય. નળી એમાંનું ઘણું કરી શકતી નથી."}}, {"q": {"en": "What does a second CSTR in series actually buy?", "gu": "Series માં બીજો CSTR ખરેખર શું આપે?"}, "a": {"en": "It lets the first tank work between the feed and the mid-point composition, so the average rate is higher and the total volume falls - 38 % less steel at 80 % conversion. A third tank buys much less, so trains are usually two or three.", "gu": "તે પહેલી ટાંકીને feed અને વચ્ચેની રચના વચ્ચે કામ કરવા દે, તેથી સરેરાશ rate ઊંચો રહે અને કુલ volume ઘટે - 80 % conversion પર 38 % ઓછું steel. ત્રીજી ટાંકી ઘણું ઓછું આપે, તેથી શ્રેણી સામાન્ય રીતે બે કે ત્રણ હોય."}}]}, {"title": {"en": "Design in practice", "gu": "વ્યવહારમાં design"}, "items": [{"q": {"en": "Why build a vessel larger than the design equation asks for?", "gu": "Design equation માંગે તેના કરતાં મોટું પાત્ર કેમ બનાવવું?"}, "a": {"en": "Freeboard for foam and for the stirrer vortex, space for catalyst decay, allowance for fouling on the heat transfer surface, and turndown so the plant can still make product at part load. The equation models the kinetics; the margin covers everything it does not.", "gu": "Foam અને stirrer ના ભંગાણ માટે freeboard, catalyst decay માટે જગ્યા, heat transfer સપાટી પર fouling માટે છૂટ, અને turndown જેથી plant અડધા load પર પણ product બનાવી શકે. Equation kinetics model કરે; માર્જિન બાકીનું બધું સંભાળે."}}, {"q": {"en": "How would you prove that a reactor is behaving as designed?", "gu": "Reactor design પ્રમાણે વર્તે છે તે કેવી રીતે સાબિત કરશો?"}, "a": {"en": "Three measurements: a tracer test for the residence time distribution, a conversion and temperature profile for the kinetics, and a pressure drop for the bed. If all three agree with the model the design equation was applied correctly; if only the conversion agrees, the model is right for the wrong reason.", "gu": "ત્રણ માપ: residence time distribution માટે tracer test, kinetics માટે conversion અને temperature profile, અને bed માટે pressure drop. ત્રણેય model સાથે મળે તો design equation યોગ્ય રીતે લાગુ થયું; ફક્ત conversion મળે તો model ખોટા કારણથી સાચું છે."}}, {"q": {"en": "Which single number would you change to raise the capacity of an existing CSTR?", "gu": "ચાલુ CSTR ની ક્ષમતા વધારવા કયો એક આંકડો બદલશો?"}, "a": {"en": "The temperature, if the catalyst allows it, because k rises exponentially and the volume is fixed. Everything else - feed rate, conversion or volume - either costs capital or breaks the duty; temperature costs only a little more jacket duty until selectivity or catalyst life becomes the limit.", "gu": "Temperature, જો catalyst પરવાનગી આપે, કારણ કે k ઝડપથી વધે અને volume નિશ્ચિત છે. બાકીનું - feed rate, conversion કે volume - કાં તો ખર્ચ વધારે કાં તો કામ બગડે; temperature ફક્ત થોડું વધુ jacket કામ માંગે, જ્યાં સુધી selectivity કે catalyst આયુ મર્યાદા ન બને."}}]}], "exam_questions": [{"q": {"en": "A 1.5 m3 batch reactor is charged with CA0 = 2.0 kmol/m3 of A. The reaction is first order with k = 0.030 min-1 and is run to 90 % conversion. Filling, heating, emptying and cleaning take 25 min. Find the reaction time, the cycle time, the number of batches per day and the daily production of A reacted.", "gu": "1.5 m3 ના batch reactor માં CA0 = 2.0 kmol/m3 A ભરાય છે. પ્રક્રિયા first order છે, k = 0.030 min-1, અને 90 % conversion સુધી ચલાવાય છે. ભરવું, ગરમ કરવું, ખાલી કરવું અને સફાઈ 25 min લે છે. Reaction time, cycle time, દિવસના batch અને રોજ પ્રક્રિયા થતા A નું ઉત્પાદન શોધો."}, "marks": 6}, {"q": {"en": "A first order reaction with k = 0.20 h-1 and CA0 = 1.5 kmol/m3 is to be carried out to 85 % conversion at a feed rate of 4.0 m3/h. Find the space time, the reactor volume, the exit rate of reaction and the space velocity.", "gu": "k = 0.20 h-1 અને CA0 = 1.5 kmol/m3 વાળી first order પ્રક્રિયા 4.0 m3/h ના feed rate પર 85 % conversion સુધી કરવી છે. Space time, reactor volume, exit પરનો rate of reaction અને space velocity શોધો."}, "marks": 7}, {"q": {"en": "The duty of the previous problem (k = 0.20 h-1, v0 = 4.0 m3/h, X = 0.85) is to be met with a PFR and, separately, with three equal CSTRs in series. Find both volumes and compare them with the single CSTR.", "gu": "આગલા દાખલાનું કામ (k = 0.20 h-1, v0 = 4.0 m3/h, X = 0.85) PFR થી અને અલગથી series માં ત્રણ સરખા CSTR થી કરવું છે. બંને volumes શોધો અને એક CSTR સાથે સરખાવો."}, "marks": 8}, {"q": {"en": "A + B -> products is second order overall with CA0 = CB0 = 1.2 kmol/m3 and k = 0.020 m3/(kmol min). The feed is 0.5 m3/min and the conversion required is 75 %. Find the volume needed in a CSTR and in a PFR, and the ratio between them.", "gu": "A + B -> products કુલ મળીને second order છે, CA0 = CB0 = 1.2 kmol/m3 અને k = 0.020 m3/(kmol min). Feed 0.5 m3/min છે અને 75 % conversion જોઈએ. CSTR અને PFR માં જરૂરી volume અને તેમનો ગુણોત્તર શોધો."}, "marks": 7}, {"q": {"en": "A gas phase reaction runs in a 2.4 m3 CSTR. The feed is 0.8 m3/min measured at 2 bar and 350 K; inside the reactor the gas is at 6 bar and 400 K. Find the space time, the space velocity and the holding time, and explain the difference.", "gu": "Gas phase પ્રક્રિયા 2.4 m3 ના CSTR માં ચાલે છે. Feed 0.8 m3/min છે, જે 2 bar અને 350 K પર માપેલો છે; reactor ની અંદર gas 6 bar અને 400 K પર છે. Space time, space velocity અને holding time શોધો અને ફરક સમજાવો."}, "marks": 6}, {"q": {"en": "A first order reaction has k = 0.15 h-1 and the feed rate is 3.0 m3/h. The product must reach 90 % conversion. Compare the volume of one CSTR, two equal CSTRs in series and one PFR, and state which you would recommend and why.", "gu": "First order પ્રક્રિયાનો k = 0.15 h-1 છે અને feed rate 3.0 m3/h છે. Product 90 % conversion સુધી પહોંચવું જોઈએ. એક CSTR, series માં બે સરખા CSTR અને એક PFR ના volume સરખાવો, અને કયો સૂચવશો તે કારણ સાથે કહો."}, "marks": 7}], "learning_outcomes": [{"en": "Estimate volume, space time and space velocity for ideal reactors.", "gu": "Ideal reactors માટે volume, space time અને space velocity ગણવા."}], "course_outcomes": ["CO5"], "practical_numbers": [12, 13, 14, 15], "content_kind": "theory", "lesson_count": 15, "answered_practice_count": 6, "assessment_note": {"en": "Official course: theory ESE 70 + PA 30 and practical PA 20 + ESE 30 = 150 marks, 4 credits, 45 teaching hours. This unit carries 24 % weightage, 11 of the printed unit hours and 17 of the 70 theory marks, and it is the unit the practicals 12 to 15 are written against - volume, space time and space velocity for one ideal reactor. The numericals of section 5.6 are original revision problems with suggested marks, not GTU papers.", "gu": "અધિકૃત course: theory ESE 70 + PA 30 અને practical PA 20 + ESE 30 = 150 marks, 4 credits, 45 teaching hours. આ unit નું weightage 24 %, છપાયેલા unit hours માંથી 11 અને 70 theory marks માંથી 17 છે, અને practicals 12 થી 15 આ unit પર લખાયેલા છે - એક ideal reactor માટે volume, space time અને space velocity. વિભાગ 5.6 ના દાખલા revision માટેના મૂળ પ્રશ્નો છે, GTU પેપર નહીં."}, "question_provenance": "Original solved numericals written for revision; not official past papers", "question_marks_are_suggested": true, "sources": [{"title": "GTU DI05005031 Chemical Reaction Engineering syllabus (uploaded PDF, w.e.f. 2026-27)", "url": "https://syllabus.gtu.ac.in/"}, {"title": "Octave Levenspiel - Chemical Reaction Engineering, 3rd ed., Wiley (chapter 5: ideal reactors for a single reaction; chapter 6: design for single reactions)", "url": "https://www.wiley.com/"}, {"title": "H. Scott Fogler - Essentials of Chemical Reaction Engineering, 4th ed., Prentice Hall (chapter 4: conversion and reactor sizing; chapter 5: isothermal reactor design)", "url": "https://www.pearson.com/"}, {"title": "P. Trambouze and J.-P. Euzen - Chemical Reactors: From Design to Operation, Editions Technip (space time, space velocity and reactor comparison)", "url": "https://www.editionstechnip.com/"}, {"title": "NPTEL Chemical Reaction Engineering lectures - isothermal reactor design and reactor sizing", "url": "https://nptel.ac.in/"}]};
const SVG = {"u5_perf": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 272\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"272\" fill=\"#ffffff\"/><text x=\"180.0\" y=\"24.3\" font-size=\"12.2\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"bold\">One balance, three design equations</text><text x=\"180.0\" y=\"40.2\" font-size=\"9.2\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">the performance equation of a single reactor</text><rect x=\"6.0\" y=\"48.0\" width=\"348.0\" height=\"106.0\" rx=\"6\" fill=\"#FBFCFD\" stroke=\"#9AA3AD\" stroke-width=\"0.9\"/><text x=\"180\" y=\"66.7\" font-size=\"7.8\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"bold\">mole balance on A:   in - out + generation = accumulation</text><text x=\"16\" y=\"86.9\" font-size=\"8.4\" text-anchor=\"start\" fill=\"#1565C0\" font-weight=\"bold\">BATCH</text><text x=\"68\" y=\"86.6\" font-size=\"7.4\" text-anchor=\"start\" fill=\"#222222\" font-weight=\"normal\">t = NA0 x integral dX/(-rA V)</text><text x=\"342\" y=\"86.5\" font-size=\"7.0\" text-anchor=\"end\" fill=\"#666666\" font-weight=\"normal\">the answer is a time</text><text x=\"16\" y=\"108.9\" font-size=\"8.4\" text-anchor=\"start\" fill=\"#2E7D32\" font-weight=\"bold\">CSTR</text><text x=\"68\" y=\"108.6\" font-size=\"7.4\" text-anchor=\"start\" fill=\"#222222\" font-weight=\"normal\">V = FA0 X / (-rA)exit</text><text x=\"342\" y=\"108.5\" font-size=\"7.0\" text-anchor=\"end\" fill=\"#666666\" font-weight=\"normal\">a volume, no integral</text><text x=\"16\" y=\"130.9\" font-size=\"8.4\" text-anchor=\"start\" fill=\"#B66A00\" font-weight=\"bold\">PFR</text><text x=\"68\" y=\"130.6\" font-size=\"7.4\" text-anchor=\"start\" fill=\"#222222\" font-weight=\"normal\">V = FA0 x integral dX/(-rA)</text><text x=\"342\" y=\"130.4\" font-size=\"7.0\" text-anchor=\"end\" fill=\"#666666\" font-weight=\"normal\">a volume, one integral</text><rect x=\"6.0\" y=\"166.0\" width=\"348.0\" height=\"54.0\" rx=\"5\" fill=\"#F5EEFD\" stroke=\"#7B2CD9\" stroke-width=\"1\"/><text x=\"180.0\" y=\"180.9\" font-size=\"8.2\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">what changes from one equation to the next</text><text x=\"180.0\" y=\"194.7\" font-size=\"7.6\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"normal\">batch: no flow at all, so the balance runs in time</text><text x=\"180.0\" y=\"206.2\" font-size=\"7.6\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"normal\">CSTR: perfectly mixed, so the exit is the inside composition</text><text x=\"180.0\" y=\"217.7\" font-size=\"7.6\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"normal\">PFR: plug flow, so the balance runs along the length</text><text x=\"180.0\" y=\"241.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">Constant density: v = v0, so CA = CA0 (1 - X) and the rate becomes a</text><text x=\"180.0\" y=\"253.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">function of X alone. That is what lets all three equations be</text><text x=\"180.0\" y=\"265.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">integrated by hand instead of solved numerically.</text></svg>", "u5_batch": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 298\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"298\" fill=\"#ffffff\"/><text x=\"180.0\" y=\"24.3\" font-size=\"12.2\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"bold\">Designing a batch reactor</text><text x=\"180.0\" y=\"40.2\" font-size=\"9.2\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">time is the design variable</text><rect x=\"22.0\" y=\"70.0\" width=\"92.0\" height=\"112.0\" rx=\"5\" fill=\"#F7FBFF\" stroke=\"#222222\" stroke-width=\"2.0\"/><rect x=\"22.0\" y=\"104.0\" width=\"92.0\" height=\"78.0\" rx=\"1\" fill=\"#DCEEFB\"/><path d=\"M22.0 104.
