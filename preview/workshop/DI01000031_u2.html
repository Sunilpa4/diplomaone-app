<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Communication Skills in English – Unit 2</title>
<style>
:root{--p:#7B2CD9;--pd:#6420B8;--lav:#EADDF7;--bg:#F3ECFA;--ink:#1d1b20}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#d8cce8;font-family:"Noto Sans Gujarati","Shruti","Nirmala UI",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink)}
.phone{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:70px;position:relative}
.bar{position:sticky;top:0;z-index:10;background:var(--p);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.top{display:flex;align-items:center;gap:14px;padding:14px 14px 10px}
.top svg{flex:none}
.ttl{flex:1;min-width:0}
.ttl b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{opacity:.85;font-size:12.5px}
.lang{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:18px;padding:6px 12px;font-weight:700;font-size:14px;cursor:pointer}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;padding:0 6px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;color:rgba(255,255,255,.75);padding:10px 14px 12px;font-size:14.5px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;background:none;border-top:0;border-left:0;border-right:0}
.tab.on{color:#fff;border-bottom-color:#fff}
.sec{margin-bottom:14px}
.sh{background:var(--lav);display:flex;align-items:center;justify-content:space-between;padding:16px 14px 16px 18px;font-weight:800;font-size:17px;position:relative}
.more{background:none;border:0;padding:4px 6px;cursor:pointer;border-radius:50%}
.menu{display:none;position:absolute;right:12px;top:48px;background:#fff;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.18);z-index:5;overflow:hidden;min-width:150px}
.menu.show{display:block}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:12px 16px;font-size:14.5px;cursor:pointer}
.menu button:hover{background:#f4eefc}
.card{background:#fff;border-radius:6px;margin:0 0 8px;box-shadow:0 1px 3px rgba(60,20,110,.14)}
.q{display:flex;gap:10px;align-items:flex-start;padding:16px 14px 16px 18px;color:var(--p);font-size:16.5px;line-height:1.45;cursor:pointer}
.q .n{flex:none;min-width:24px}
.q .t{flex:1}
.q.hd{font-weight:700}
.chev{flex:none;transition:transform .2s;margin-top:1px}
.card.open .chev{transform:rotate(180deg)}
.a{display:none;padding:0 16px 18px 52px;font-size:15.5px;line-height:1.65;color:#222}
.card.open .a{display:block;animation:fd .2s}
@keyframes fd{from{opacity:0;transform:translateY(-4px)}to{opacity:1}}
.a p{margin:0 0 10px}.a ul,.a ol{margin:0 0 10px;padding-left:20px}.a li{margin-bottom:4px}
.a b{color:#111}
.eq{background:#F5EEFD;border-left:4px solid var(--p);padding:8px 12px;border-radius:4px;font-weight:700;font-size:16.5px;color:var(--pd)}
.math{background:#F5EEFD;border-left:4px solid var(--p);border-radius:6px;padding:10px 14px;margin:6px 0 12px;font-family:var(--mono,ui-monospace,monospace);font-size:15px;line-height:1.6;color:var(--pd);overflow-x:auto;white-space:pre-wrap}
.tw{overflow-x:auto;margin:0 0 10px -36px;padding-left:0}
table{border-collapse:collapse;font-size:13.5px;min-width:100%;line-height:1.4}
th{background:var(--p);color:#fff;text-align:left;padding:7px 8px;font-weight:700}
td{border-bottom:1px solid #eadff6;padding:7px 8px;vertical-align:top}
tr:nth-child(even) td{background:#faf7fe}
.dg{margin:6px 0 4px -36px;border:1px solid #eadff6;border-radius:10px;overflow:hidden;cursor:zoom-in;background:#fff}
.dg svg{display:block;width:100%;height:auto}
.dg.pg{margin-left:0}
.dgc{font-size:12px;color:#7a6f88;text-align:center;margin:-2px 0 10px -36px}
.dcard{background:#fff;border-radius:10px;margin:0 10px 12px;box-shadow:0 1px 3px rgba(60,20,110,.14);overflow:hidden;cursor:zoom-in}
.dcard .h{padding:12px 14px;color:var(--p);font-weight:700;font-size:15.5px;border-bottom:1px solid #f0e8f9}
.dcard svg{display:block;width:100%;height:auto}
.fbox{margin:4px 0 0;background:#F5EEFD;border-radius:6px;padding:9px 12px;font-size:18px;font-weight:700;color:var(--pd);display:inline-block}
.q .t .nm{display:block}
.mk{flex:none;background:#FFF1D6;color:#9A5B00;border-radius:12px;padding:2px 9px;font-size:12.5px;font-weight:800;margin-top:2px}
.ad{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:56px;background:#fff;border-top:1px solid #e3d8f0;display:flex;align-items:center;justify-content:center;gap:8px;color:#8b8199;font-size:12.5px;z-index:9}
.ad i{font-style:normal;background:#f2c94c;color:#5b4300;font-weight:800;font-size:10.5px;padding:1px 5px;border-radius:3px}
.modal{position:fixed;inset:0;background:rgba(20,10,35,.92);z-index:50;display:none;flex-direction:column}
.modal.show{display:flex}
.mh{display:flex;align-items:center;justify-content:space-between;color:#fff;padding:12px 16px;font-weight:700}
.mh button{background:rgba(255,255,255,.15);border:0;color:#fff;font-size:18px;width:38px;height:38px;border-radius:50%;cursor:pointer}
.mb{flex:1;overflow:auto;padding:10px}
.mb .zw{background:#fff;border-radius:8px;margin:auto;transform-origin:top left}
.mb svg{display:block;width:100%;height:auto}
.zb{display:flex;justify-content:center;gap:14px;padding:12px}
.zb button{background:#fff;border:0;border-radius:22px;padding:8px 20px;font-size:18px;font-weight:800;color:var(--p);cursor:pointer}
.a h4{margin:14px 0 6px;color:var(--pd);font-size:15.5px}
.a h4:first-child{margin-top:0}
.card.key{border-left:4px solid #2E7D32}
.card.key .q{color:#1B5E20}
.ex{margin:12px 0 10px -36px;border:1.5px dashed #C9A227;background:#FFFBEF;border-radius:10px;padding:10px 12px}
.ex .et{font-weight:800;color:#9A5B00;font-size:13px;margin-bottom:4px}
.ex .eq2{font-weight:700;margin-bottom:6px}
.ex p{margin:0 0 6px}
.a.rn .dg,.a.rn .dgc,.a.rn .tw,.a.rn .ex{margin-left:0}
.intro{margin:12px 10px;background:linear-gradient(135deg,#8E3BE8,#5B1BB0);color:#fff;border-radius:14px;padding:14px 16px}
.intro b{font-size:16px}.intro div{font-size:13px;opacity:.9;margin-top:4px}
.chips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.chips span{background:rgba(255,255,255,.18);border-radius:12px;padding:3px 10px;font-size:12px;font-weight:700}
pre.code{background:#1E1530;color:#EDE7F6;border-radius:8px;padding:10px 12px;font:13px/1.55 "JetBrains Mono",Consolas,"DejaVu Sans Mono","Noto Sans Gujarati",monospace;overflow-x:auto;margin:0 0 10px;white-space:pre;tab-size:4}
pre.out{background:#0E1B12;color:#B9F6CA;border-radius:8px;padding:10px 12px;font:13px/1.5 Consolas,"DejaVu Sans Mono",monospace;overflow-x:auto;margin:0 0 10px;white-space:pre}
.kw{color:#C792EA;font-weight:700}.ty{color:#82AAFF}.st{color:#C3E88D}.cm{color:#8E9AAF;font-style:italic}.pp{color:#F78C6C}.nu{color:#F9C46B}.fn{color:#FFCB6B}
.pl{font-size:12px;font-weight:800;color:var(--pd);margin:10px 0 4px;letter-spacing:.4px;text-transform:uppercase}
@media (max-width:480px){pre.code,pre.out{font-size:11.5px;padding:9px 10px}}
.a code{background:#F1E9FB;color:#5B1BB0;padding:1px 5px;border-radius:4px;font-family:Consolas,"DejaVu Sans Mono",monospace;font-size:.9em}
.pbox{margin:12px 0 10px;border:1.5px dashed #2E8B7A;background:#F2FBF8;border-radius:10px;padding:10px 12px}
.pbox .et{font-weight:800;color:#1F6E60;font-size:13.5px;margin-bottom:6px}
.sx{margin:6px 0 0;font-size:12.5px;padding:8px 10px}
.a.pa{padding-left:16px}
</style></head>

const U = {"subject": "DI01000031", "unit": 2, "format": "notes", "title": {"en": "Grammar"}, "hours": 10, "weightage": 40, "official": true, "languages": ["en"], "tabs": ["notes", "diagrams", "viva", "exam"], "intro_text": {"en": "Unit 2 of Communication Skills in English: the eight parts of speech, the eight tense forms the syllabus lists (four present, three past, future simple), the eleven modal auxiliaries, subject-verb agreement and the four basic sentence patterns SV, SVO, SVA and SVC. Grammar is taught by example: one rule line, a table of forms, model sentences and the mistake to avoid. Fifteen answered practice questions are in section 6."}, "notes": [{"title": {"en": "1. Parts of Speech"}, "items": [{"h": {"en": "1.1 Noun"}, "body": {"en": "<h4>Rule</h4><p>A <b>noun</b> names a person, place, thing or idea.</p><h4>Five kinds, with examples</h4><table><tr><th>Kind</th><th>What it names</th><th>Examples</th></tr><tr><td>Proper</td><td>one particular name, always with a capital</td><td>Surat, Gujarat, Ashok, TATA, Monday</td></tr><tr><td>Common</td><td>any one of a class</td><td>engineer, motor, workshop, city</td></tr><tr><td>Collective</td><td>a group as one unit</td><td>team, crowd, batch, fleet</td></tr><tr><td>Material</td><td>what a thing is made of</td><td>steel, brass, rubber, cement</td></tr><tr><td>Abstract</td><td>a quality, state or idea</td><td>honesty, safety, patience, speed</td></tr></table><h4>Countable and uncountable</h4><ul><li><b>Countable:</b> one bolt, two bolts, three bolts.</li><li><b>Uncountable:</b> water, oil, information, advice, equipment, furniture - no plural, no <i>a</i>.</li></ul><h4>Examples in sentences</h4><h4>Same noun doing different work</h4><ul><li>The <b>motor</b> is hot. (subject)</li><li>We replaced the <b>motor</b>. (object)</li><li>The <b>motor</b> casing cracked. (modifier)</li><li><b>Ashok</b> works in the <b>tool room</b> at <b>TATA Motors</b>.</li></ul><h4>Common mistake</h4><p>\"Informations\", \"advices\", \"equipments\" and \"furnitures\" do not exist. Say \"a piece of information\", \"two pieces of equipment\".</p>"}, "diagram": "g1_pos", "syllabus_item": "2.1"}, {"h": {"en": "1.2 Verb"}, "body": {"en": "<h4>Rule</h4><p>A <b>verb</b> shows an action (run, weld, check) or a state (be, seem, have, know).</p><h4>Kinds of verb</h4><table><tr><th>Kind</th><th>Work</th><th>Examples</th></tr><tr><td>Main / lexical</td><td>carries the meaning</td><td>weld, replace, measure, fail</td></tr><tr><td>Auxiliary</td><td>helps the main verb</td><td>is, are, was, has, have, do, will, can</td></tr><tr><td>Transitive</td><td>needs an object</td><td>replace <i>the belt</i>, check <i>the oil</i></td></tr><tr><td>Intransitive</td><td>no object needed</td><td>run, arrive, sleep, rise</td></tr><tr><td>Regular</td><td>past in -ed</td><td>check → checked, test → tested</td></tr><tr><td>Irregular</td><td>past changes form</td><td>write → wrote → written, run → ran → run</td></tr></table><h4>Examples</h4><h4>Auxiliary + main verb</h4><ul><li>The pump <b>is running</b>.</li><li>We <b>have replaced</b> the seal.</li><li>The belt <b>was slipping</b>.</li><li>He <b>can weld</b> aluminium.</li></ul><h4>Common mistake</h4><p>Dropping the auxiliary: \"He going to the site\" is wrong; write \"He is going to the site\".</p>"}, "syllabus_item": "2.1"}, {"h": {"en": "1.3 Pronoun"}, "body": {"en": "<h4>Rule</h4><p>A <b>pronoun</b> stands in place of a noun so that the noun is not repeated.</p><h4>Kinds, with examples</h4><table><tr><th>Kind</th><th>Examples</th></tr><tr><td>Personal (subject / object)</td><td>I / me, we / us, he / him, they / them</td></tr><tr><td>Possessive</td><td>my, our, his, their, mine, ours</td></tr><tr><td>Reflexive</td><td>myself, ourselves, himself, themselves</td></tr><tr><td>Demonstrative</td><td>this, that, these, those</td></tr><tr><td>Relative</td><td>who, whom, which, that, whose</td></tr><tr><td>Interrogative</td><td>who? what? which? whose?</td></tr><tr><td>Indefinite</td><td>someone, anything, everybody, none</td></tr></table><h4>Examples</h4><h4>In sentences</h4><ul><li><b>She</b> checked the panel and <b>I</b> recorded the reading.</li><li>The bearing <b>that</b> failed was new.</li><li><b>This</b> is the drawing; <b>those</b> are the spares.</li><li>The fitter repaired it <b>himself</b>.</li></ul><h4>Common mistake</h4><p>\"Myself Raj\" and \"Please contact to myself\" are wrong. Write \"I am Raj\" and \"Please contact me\".</p>"}, "syllabus_item": "2.1"}, {"h": {"en": "1.4 Adjective"}, "body": {"en": "<h4>Rule</h4><p>An <b>adjective</b> describes or limits a noun: a <i>hot</i> motor, <i>three</i> bolts, <i>brass</i> washers.</p><h4>Kinds</h4><table><tr><th>Kind</th><th>Examples</th></tr><tr><td>Quality</td><td>hot, long, careful, worn</td></tr><tr><td>Quantity</td><td>some, enough, little, plenty of</td></tr><tr><td>Number</td><td>three, tenth, several</td></tr><tr><td>Demonstrative</td><td>this panel, those wires</td></tr><tr><td>Possessive</td><td>my tools, their workshop</td></tr></table><h4>Degrees of comparison</h4><table><tr><th>Positive</th><th>Comparative</th><th>Superlative</th></tr><tr><td>long</td><td>longer</td><td>longest</td></tr><tr><td>heavy</td><td>heavier</td><td>heaviest</td></tr><tr><td>good</td><td>better</td><td>best</td></tr><tr><td>bad</td><td>worse</td><td>worst</td></tr><tr><td>careful</td><td>more careful</td><td>most careful</td></tr></table><h4>Order before a noun</h4><p>opinion - size - age - colour - origin - material - noun: <i>a useful small old grey Indian steel box</i>.</p><h4>Examples</h4><h4>Comparison in use</h4><ul><li>This belt is <b>longer</b> than that one.</li><li>Line 2 is the <b>busiest</b> line in the plant.</li><li>Today's reading is <b>better</b> than yesterday's.</li><li>Use the <b>most careful</b> method for the bearing.</li></ul><h4>Common mistake</h4><p>\"More better\", \"most best\" and \"more easier\" double the comparison. Use one form only.</p>"}, "syllabus_item": "2.1"}, {"h": {"en": "1.5 Adverb"}, "body": {"en": "<h4>Rule</h4><p>An <b>adverb</b> describes a verb, an adjective or another adverb: runs <i>smoothly</i>, <i>very</i> hot, <i>quite</i> slowly.</p><h4>Kinds</h4><table><tr><th>Kind</th><th>Question it answers</th><th>Examples</th></tr><tr><td>Manner</td><td>how?</td><td>quickly, carefully, badly, well</td></tr><tr><td>Time</td><td>when?</td><td>now, yesterday, soon, already</td></tr><tr><td>Place</td><td>where?</td><td>here, outside, everywhere</td></tr><tr><td>Frequency</td><td>how often?</td><td>always, often, rarely, never</td></tr><tr><td>Degree</td><td>how much?</td><td>very, too, almost, enough</td></tr></table><h4>How they are formed</h4><ul><li>adjective + -ly: quick → quickly, careful → carefully.</li><li>irregular: good → well, fast → fast, hard → hard, late → late.</li><li>Some words are both: <i>a fast motor</i> (adjective), <i>the motor runs fast</i> (adverb).</li></ul><h4>Examples</h4><h4>Position</h4><ul><li>The pump runs <b>smoothly</b>. (after the verb)</li><li>He <b>carefully</b> measured the bore. (before the verb)</li><li>The line stops <b>twice daily</b>. (frequency at the end)</li><li>The motor is <b>very</b> hot. (degree before an adjective)</li></ul><h4>Common mistake</h4><p>\"He works good\" is wrong because <i>good</i> is an adjective; write \"He works well\".</p>"}, "syllabus_item": "2.1"}, {"h": {"en": "1.6 Preposition"}, "body": {"en": "<h4>Rule</h4><p>A <b>preposition</b> links a noun or pronoun to another word and shows place, time, direction or agent: <i>under</i> the bench, <i>at</i> 9 am, <i>by</i> the fitter.</p><h4>Place and time</h4><table><tr><th>Preposition</th><th>Use</th><th>Example</th></tr><tr><td>at</td><td>a point, an exact time</td><td>at the gate, at 9 am, at night</td></tr><tr><td>on</td><td>a surface, a day or date</td><td>on the bench, on Monday, on 5 March</td></tr><tr><td>in</td><td>an enclosed space, a month or year</td><td>in the panel, in May, in 2026</td></tr><tr><td>under / over</td><td>below / above</td><td>under the bench, over the pipe</td></tr><tr><td>between / among</td><td>two / more than two</td><td>between the two pumps, among the workers</td></tr><tr><td>by</td><td>agent, or not later than</td><td>welded by Ashok, by Friday</td></tr><tr><td>with</td><td>instrument or company</td><td>cut with a hacksaw, with the supervisor</td></tr><tr><td>since / for</td><td>point of time / length of time</td><td>since Monday, for two hours</td></tr></table><h4>Examples</h4><h4>Common pairs</h4><ul><li>The drawing is <b>on</b> the board and the tools are <b>in</b> the box.</li><li>The job must finish <b>by</b> Friday, and it has been open <b>since</b> Monday.</li><li>The fault is <b>between</b> the pump and the tank.</li><li>The report was written <b>by</b> the trainee <b>for</b> the supervisor.</li></ul><h4>Common mistake</h4><p>\"Discuss about the problem\", \"married with her\", \"different than\" - write \"discuss the problem\", \"married to her\", \"different from\".</p>"}, "syllabus_item": "2.1"}, {"h": {"en": "1.7 Conjunction"}, "body": {"en": "<h4>Rule</h4><p>A <b>conjunction</b> joins words, phrases or clauses: belt <i>and</i> pulley, stop <i>because</i> the guard is loose.</p><h4>Three kinds</h4><table><tr><th>Kind</th><th>Work</th><th>Examples</th></tr><tr><td>Coordinating</td><td>joins equals</td><td>and, but, or, so, for, yet, nor</td></tr><tr><td>Subordinating</td><td>joins a dependent clause</td><td>because, although, if, when, while, since, unless, after</td></tr><tr><td>Correlative</td><td>works in pairs</td><td>either ... or, neither ... nor, not only ... but also, both ... and</td></tr></table><h4>Examples</h4><h4>In sentences</h4><ul><li>The belt <b>and</b> the pulley were replaced.</li><li>The line stopped <b>because</b> the coolant ran out.</li><li><b>Although</b> the load was high, the motor stayed cool.</li><li><b>Either</b> the seal <b>or</b> the gland is leaking.</li><li><b>Neither</b> the fitter <b>nor</b> the helper was present.</li><li><b>Not only</b> the bearing <b>but also</b> the shaft was damaged.</li></ul><h4>Common mistake</h4><p>Using two conjunctions for one link: \"Although it was hot, but we finished\" is wrong; keep \"Although it was hot, we finished\".</p>"}, "syllabus_item": "2.1"}, {"h": {"en": "1.8 Interjection"}, "body": {"en": "<h4>Rule</h4><p>An <b>interjection</b> expresses a sudden feeling. It stands apart from the sentence and takes an exclamation mark.</p><h4>Common interjections</h4><table><tr><th>Feeling</th><th>Interjection</th><th>Example</th></tr><tr><td>joy</td><td>hurray!, wow!</td><td>Hurray! The test passed.</td></tr><tr><td>surprise</td><td>oh!, what!</td><td>Oh! The panel is live.</td></tr><tr><td>pain</td><td>ouch!, ah!</td><td>Ouch! That edge is sharp.</td></tr><tr><td>relief</td><td>phew!</td><td>Phew! The leak has stopped.</td></tr><tr><td>sorrow</td><td>alas!</td><td>Alas! The batch is scrap.</td></tr><tr><td>warning</td><td>hush!, look out!</td><td>Look out! The load is slipping.</td></tr></table><h4>Register</h4><p>Interjections belong in speech and informal writing. A technical report says \"The batch was rejected\", not \"Alas! The batch was rejected\".</p><h4>Common mistake</h4><p>Overusing them in written work. One \"oh\" in a report looks careless; use a plain statement instead.</p>"}, "syllabus_item": "2.1"}]}, {"title": {"en": "2. Tenses"}, "items": [{"h": {"en": "2.1 Present simple"}, "body": {"en": "<h4>Form</h4><table><tr><th>Type</th><th>Structure</th><th>Example</th></tr><tr><td>Affirmative</td><td>subject + V1 (V1+s with he/she/it)</td><td>The pump runs.</td></tr><tr><td>Negative</td><td>do / does + not + V1</td><td>The pump does not run.</td></tr><tr><td>Question</td><td>do / does + subject + V1?</td><td>Does the pump run?</td></tr></table><h4>Use</h4><ul><li>Habits and routines: <i>I check the panel every morning.</i></li><li>Facts and laws: <i>Water boils at 100 °C.</i></li><li>Timetables: <i>The shift starts at 7 am.</i></li><li>Instructions: <i>Switch off the mains first.</i></li></ul><h4>Examples</h4><h4>Correct forms</h4><ul><li>The fitter <b>checks</b> the oil level daily.</li><li>The fitters <b>check</b> the oil level daily.</li><li>The motor <b>does not draw</b> more than 6 A.</li><li><b>Do</b> you <b>record</b> the reading in the log book?</li></ul><h4>Common mistake</h4><p>\"He run the machine\" - with he, she or it the verb takes -s: \"he runs\".</p>"}, "syllabus_item": "2.2"}, {"h": {"en": "2.2 Present continuous"}, "body": {"en": "<h4>Form</h4><table><tr><th>Type</th><th>Structure</th><th>Example</th></tr><tr><td>Affirmative</td><td>am / is / are + V-ing</td><td>The line is running.</td></tr><tr><td>Negative</td><td>am / is / are + not + V-ing</td><td>The line is not running.</td></tr><tr><td>Question</td><td>am / is / are + subject + V-ing?</td><td>Is the line running?</td></tr></table><h4>Use</h4><ul><li>Happening now: <i>I am checking the bearing.</i></li><li>Around now, these days: <i>We are using a new coolant.</i></li><li>Fixed near future: <i>We are starting the trial at 4 pm.</i></li><li>Complaints with <i>always</i>: <i>He is always losing the spanner.</i></li></ul><h4>Examples</h4><h4>Now and around now</h4><ul><li>The compressor <b>is making</b> a noise right now.</li><li>Two operators <b>are working</b> on the panel.</li><li>I <b>am not using</b> the crane today.</li><li><b>Are</b> you <b>reading</b> the new drawing?</li></ul><h4>Common mistake</h4><p>Stative verbs take the simple form: \"I am knowing the answer\" is wrong; write \"I know the answer\".</p>"}, "syllabus_item": "2.2"}, {"h": {"en": "2.3 Present perfect"}, "body": {"en": "<h4>Form</h4><table><tr><th>Type</th><th>Structure</th><th>Example</th></tr><tr><td>Affirmative</td><td>have / has + V3</td><td>We have replaced the seal.</td></tr><tr><td>Negative</td><td>have / has + not + V3</td><td>We have not replaced the seal.</td></tr><tr><td>Question</td><td>have / has + subject + V3?</td><td>Have you replaced the seal?</td></tr></table><h4>Use</h4><ul><li>Finished action with a present result: <i>I have finished the job, so the line can start.</i></li><li>Experience with no fixed time: <i>He has worked in three plants.</i></li><li>With <i>just, already, yet, ever, never, since, for</i>.</li></ul><h4>Present perfect or past simple?</h4><table><tr><th>Present perfect</th><th>Past simple</th></tr><tr><td>no time mentioned</td><td>a finished time is named</td></tr><tr><td>I have checked the panel.</td><td>I checked the panel at 9 am.</td></tr><tr><td>He has worked here for 3 years.</td><td>He worked here in 2022.</td></tr></table><h4>Examples</h4><h4>With markers</h4><ul><li>The job <b>has</b> just <b>finished</b>.</li><li>I <b>have</b> not <b>received</b> the drawing yet.</li><li>She <b>has been</b> on this machine <b>since</b> January.</li><li><b>Have</b> you ever <b>welded</b> aluminium?</li></ul><h4>Common mistake</h4><p>\"I have seen him yesterday\" is wrong because <i>yesterday</i> is a finished time; write \"I saw him yesterday\".</p>"}, "syllabus_item": "2.2"}, {"h": {"en": "2.4 Present perfect continuous"}, "body": {"en": "<h4>Form</h4><table><tr><th>Type</th><th>Structure</th><th>Example</th></tr><tr><td>Affirmative</td><td>have / has been + V-ing</td><td>He has been welding for an hour.</td></tr><tr><td>Negative</td><td>have / has not been + V-ing</td><td>He has not been welding.</td></tr><tr><td>Question</td><td>have / has + subject + been + V-ing?</td><td>Has he been welding since 9 am?</td></tr></table><h4>Use</h4><p>An action that started in the past and is <b>still going on</b> now, usually with <i>for</i> (length of time) or <i>since</i> (starting point).</p><h4>Examples</h4><h4>Still happening</h4><ul><li>The pump <b>has been running for</b> three hours.</li><li>I <b>have been looking for</b> that spanner since morning.</li><li>The line <b>has been stopping</b> repeatedly all week.</li><li>How long <b>have</b> you <b>been working</b> on this panel?</li></ul><h4>Present perfect or present perfect continuous?</h4><table><tr><th>Perfect: result</th><th>Perfect continuous: duration</th></tr><tr><td>I have painted the guard.</td><td>I have been painting the guard.</td></tr><tr><td>The job is finished.</td><td>The job is still going on.</td></tr></table><h4>Common mistake</h4><p>Using it for a finished amount: \"I have been finishing three jobs\" is wrong; write \"I have finished three jobs\".</p>"}, "syllabus_item": "2.2"}, {"h": {"en": "2.5 Past simple"}, "body": {"en": "<h4>Form</h4><table><tr><th>Type</th><th>Structure</th><th>Example</th></tr><tr><td>Affirmative</td><td>subject + V2</td><td>The belt broke.</td></tr><tr><td>Negative</td><td>did not + V1</td><td>The belt did not break.</td></tr><tr><td>Question</td><td>did + subject + V1?</td><td>Did the belt break?</td></tr></table><h4>Use</h4><ul><li>A finished action at a finished time: <i>We replaced the belt yesterday.</i></li><li>A series of past events: <i>He opened the panel, tested the relay and closed it.</i></li><li>Past habits: <i>He worked night shift in 2023.</i></li></ul><h4>Markers</h4><p>yesterday, last week, in 2024, two days ago, then, after that, when.</p><h4>Examples</h4><h4>Right and wrong</h4><ul><li>The line <b>stopped</b> at 10:15 am.</li><li>We <b>did not find</b> the cause yesterday.</li><li><b>Did</b> you <b>check</b> the coolant before starting?</li><li>Wrong: \"We have replaced it yesterday.\" Right: \"We replaced it yesterday.\"</li><li>Wrong: \"He did not checked it.\" Right: \"He did not check it.\"</li></ul><h4>Common mistake</h4><p>After <i>did</i> or <i>did not</i> the verb stays in V1 - no -ed, no V2.</p>"}, "syllabus_item": "2.2"}, {"h": {"en": "2.6 Past continuous"}, "body": {"en": "<h4>Form</h4><table><tr><th>Type</th><th>Structure</th><th>Example</th></tr><tr><td>Affirmative</td><td>was / were + V-ing</td><td>The pump was running.</td></tr><tr><td>Negative</td><td>was / were + not + V-ing</td><td>The pump was not running.</td></tr><tr><td>Question</td><td>was / were + subject + V-ing?</td><td>Was the pump running?</td></tr></table><h4>Use</h4><ul><li>An action in progress at a past moment: <i>At 10 am we were testing the motor.</i></li><li>A longer action interrupted by a shorter one: <i>I was checking the panel when the light went off.</i></li><li>Two actions going on together: <i>While he was welding, I was grinding.</i></li></ul><h4>Examples</h4><h4>With when and while</h4><ul><li>The operator <b>was cleaning</b> the guard when the alarm rang.</li><li><b>While</b> we <b>were waiting</b>, the supervisor called.</li><li>They <b>were not working</b> after 6 pm.</li><li><b>Were</b> you <b>testing</b> the relay at that time?</li></ul><h4>Common mistake</h4><p>Using it for a completed single action: \"I was replaced the belt\" is wrong; write \"I replaced the belt\".</p>"}, "syllabus_item": "2.2"}, {"h": {"en": "2.7 Past perfect"}, "body": {"en": "<h4>Form</h4><table><tr><th>Type</th><th>Structure</th><th>Example</th></tr><tr><td>Affirmative</td><td>had + V3</td><td>The belt had broken.</td></tr><tr><td>Negative</td><td>had not + V3</td><td>The belt had not broken.</td></tr><tr><td>Question</td><td>had + subject + V3?</td><td>Had the belt broken?</td></tr></table><h4>Use</h4><p>The <b>earlier</b> of two past actions: both happened in the past, and one happened first.</p><h4>Examples</h4><h4>Which came first?</h4><ul><li>The line was already down when I reached - the belt <b>had broken</b> before 7 am.</li><li>We <b>had</b> already <b>replaced</b> the seal before the inspector arrived.</li><li>He <b>had not</b> <b>checked</b> the torque, so the joint leaked.</li><li><b>Had</b> you <b>read</b> the manual before you opened the panel?</li></ul><h4>Order words</h4><p>before, after, by the time, already, when - these make the order clear: <i>After we had tested the pump, we started the line.</i></p><h4>Common mistake</h4><p>Using the past perfect for a single past action: \"I had gone to the site yesterday\" is unnecessary; write \"I went to the site yesterday\".</p>"}, "syllabus_item": "2.2"}, {"h": {"en": "2.8 Future simple"}, "body": {"en": "<h4>Form</h4><table><tr><th>Type</th><th>Structure</th><th>Example</th></tr><tr><td>Affirmative</td><td>will + V1</td><td>The vendor will deliver on Monday.</td></tr><tr><td>Negative</td><td>will not (won't) + V1</td><td>The vendor will not deliver today.</td></tr><tr><td>Question</td><td>will + subject + V1?</td><td>Will the vendor deliver today?</td></tr></table><h4>Use</h4><ul><li>Prediction: <i>The load will increase in summer.</i></li><li>Promise or offer: <i>I will send the drawing today.</i></li><li>Decision taken now: <i>The seal is leaking - I will replace it.</i></li><li>Polite request: <i>Will you check the panel?</i></li></ul><h4>Examples</h4><h4>Plans and predictions</h4><ul><li>We <b>will start</b> the trial tomorrow at 10 am.</li><li>The bearing <b>will not last</b> at this speed.</li><li><b>Will</b> the spare reach before Friday?</li><li>I <b>will call</b> you after the test.</li></ul><h4>Common mistake</h4><p>After <i>will</i> the verb never takes -s or a past form: \"will comes\", \"will came\" are wrong; write \"will come\". Also \"will can\" is wrong - use \"will be able to\".</p>"}, "diagram": "g2_tenses", "syllabus_item": "2.2"}]}, {"title": {"en": "3. Modal Auxiliaries"}, "items": [{"h": {"en": "3.1 Can and could"}, "body": {"en": "<h4>Rule</h4><p><b>Can</b> and <b>could</b> express ability, permission, request and possibility. They take a bare verb: <i>can weld</i>, not <i>can welds</i>.</p><h4>Uses and examples</h4><table><tr><th>Use</th><th>Example</th></tr><tr><td>Ability, present</td><td>I <b>can</b> weld aluminium.</td></tr><tr><td>Ability, past</td><td>He <b>could</b> weld at sixteen.</td></tr><tr><td>Permission, informal</td><td><b>Can</b> I open the panel?</td></tr><tr><td>Request, polite</td><td><b>Could</b> you send the drawing?</td></tr><tr><td>Possibility</td><td>The seal <b>could</b> leak at high pressure.</td></tr><tr><td>Negative ability</td><td>I <b>cannot</b> lift 50 kg alone.</td></tr></table><h4>Examples in a workshop</h4><h4>One form, four jobs</h4><ul><li>\"<b>Can</b> you read this drawing?\" - ability</li><li>\"<b>Can</b> I use the crane for ten minutes?\" - permission</li><li>\"<b>Could</b> you check the torque once more?\" - polite request</li><li>\"The motor <b>could</b> overheat in this weather.\" - possibility</li></ul><h4>Common mistake</h4><p>\"He cans weld\" and \"He could to weld\" are both wrong. Modals never take -s and never take <i>to</i> (except <i>ought to</i>).</p>"}, "diagram": "g3_modal", "syllabus_item": "2.3"}, {"h": {"en": "3.2 May and might"}, "body": {"en": "<h4>Rule</h4><p><b>May</b> is formal permission and real possibility; <b>might</b> is a weaker possibility.</p><h4>Uses and examples</h4><table><tr><th>Use</th><th>Example</th></tr><tr><td>Formal permission</td><td><b>May</b> I come in, sir?</td></tr><tr><td>Giving permission</td><td>You <b>may</b> start the trial.</td></tr><tr><td>Possibility, strong</td><td>The relay <b>may</b> be faulty.</td></tr><tr><td>Possibility, weak</td><td>The relay <b>might</b> be faulty, but I doubt it.</td></tr><tr><td>Wish</td><td><b>May</b> you succeed in the exam.</td></tr><tr><td>Prohibition</td><td>Visitors <b>may not</b> enter the shop floor.</td></tr></table><h4>Examples</h4><h4>Choosing between them</h4><ul><li>\"<b>May</b> I borrow the torque wrench?\" - formal, to a senior</li><li>\"The pump <b>may</b> need a new seal.\" - likely</li><li>\"The pump <b>might</b> need a new seal.\" - less certain</li><li>\"<b>May</b> I suggest a shorter route for the pipe?\"</li></ul><h4>Common mistake</h4><p>\"May you please send it?\" is not a request in modern English; use \"Could you please send it?\".</p>"}, "syllabus_item": "2.3"}, {"h": {"en": "3.3 Must, should and ought to"}, "body": {"en": "<h4>Rule</h4><ul><li><b>Must</b> - strong obligation, order, or a logical certainty.</li><li><b>Should</b> - advice, expectation, mild obligation.</li><li><b>Ought to</b> - moral duty or advice; the only modal with <i>to</i>.</li></ul><h4>Uses and examples</h4><table><tr><th>Use</th><th>Example</th></tr><tr><td>Strong obligation</td><td>You <b>must</b> wear goggles.</td></tr><tr><td>Rule or law</td><td>Every panel <b>must</b> be earthed.</td></tr><tr><td>Logical certainty</td><td>The tank is empty; it <b>must</b> have leaked.</td></tr><tr><td>Prohibition</td><td>You <b>must not</b> open the panel live.</td></tr><tr><td>Advice</td><td>You <b>should</b> torque the bolts in two stages.</td></tr><tr><td>Expectation</td><td>The vendor <b>should</b> call by noon.</td></tr><tr><td>Duty</td><td>We <b>ought to</b> report the near miss.</td></tr></table><h4>Examples</h4><h4>Same situation, three strengths</h4><ul><li>\"You <b>must</b> isolate the supply.\" - rule</li><li>\"You <b>should</b> isolate the supply.\" - advice</li><li>\"You <b>ought to</b> isolate the supply.\" - duty</li><li>\"You <b>need not</b> isolate it for a visual check.\" - no obligation</li></ul><h4>Common mistake</h4><p><b>Must not</b> is prohibition, <b>need not</b> is no obligation. \"You must not come\" and \"You need not come\" are opposite instructions.</p>"}, "syllabus_item": "2.3"}, {"h": {"en": "3.4 Shall, will and would"}, "body": {"en": "<h4>Rule</h4><ul><li><b>Shall</b> - offers and suggestions with I/we; formal rules.</li><li><b>Will</b> - future, promise, willingness.</li><li><b>Would</b> - polite request, past habit, unreal condition.</li></ul><h4>Uses and examples</h4><table><tr><th>Use</th><th>Example</th></tr><tr><td>Offer</td><td><b>Shall</b> I open the window?</td></tr><tr><td>Suggestion</td><td><b>Shall</b> we start the trial?</td></tr><tr><td>Formal rule</td><td>The contractor <b>shall</b> submit the report weekly.</td></tr><tr><td>Future</td><td>The line <b>will</b> start at 7 am.</td></tr><tr><td>Polite request</td><td><b>Would</b> you check this reading?</td></tr><tr><td>Past habit</td><td>He <b>would</b> arrive at 7 am every day.</td></tr><tr><td>Unreal condition</td><td>If I had the drawing, I <b>would</b> check it.</td></tr></table><h4>Examples</h4><h4>In speech and in writing</h4><ul><li>\"<b>Shall</b> we begin?\" - suggestion in a meeting</li><li>\"The supervisor <b>shall</b> sign the job card.\" - a written rule</li><li>\"I <b>will</b> send it today.\" - promise</li><li>\"<b>Would</b> you mind waiting ten minutes?\" - polite request</li></ul><h4>Common mistake</h4><p>\"I will like a coffee\" is wrong; write \"I would like a coffee\". <i>Would</i> softens a wish.</p>"}, "syllabus_item": "2.3"}, {"h": {"en": "3.5 Need and the full modal table"}, "body": {"en": "<h4>Need as a modal</h4><p><b>Need</b> behaves as a modal in the negative and the question: <i>need not</i>, <i>need I?</i> As a normal verb it takes -s and <i>to</i>: <i>he needs to go</i>.</p><h4>Examples</h4><h4>Need and need not</h4><ul><li>You <b>need not</b> come tomorrow; the job is done.</li><li>The panel <b>need not</b> be opened for a visual check.</li><li><b>Need</b> I sign both copies?</li><li>He <b>needs to</b> submit the report today. (normal verb)</li></ul><h4>All eleven modals by function</h4><table><tr><th>Function</th><th>Modals</th><th>Model sentence</th></tr><tr><td>Ability</td><td>can, could</td><td>She can weld.</td></tr><tr><td>Permission</td><td>may, can, could</td><td>May I enter?</td></tr><tr><td>Possibility</td><td>may, might, could</td><td>It may rain.</td></tr><tr><td>Obligation</td><td>must, should, ought to</td><td>You must report it.</td></tr><tr><td>Advice</td><td>should, ought to</td><td>You should rest.</td></tr><tr><td>Future and offer</td><td>shall, will, would</td><td>Shall I help?</td></tr><tr><td>No obligation</td><td>need not</td><td>You need not wait.</td></tr><tr><td>Prohibition</td><td>must not, may not</td><td>You must not smoke.</td></tr><tr><td>Past habit</td><td>would, used to</td><td>He would arrive at 7.</td></tr></table><h4>Common mistake</h4><p>\"You need not to come\" is wrong: after <i>need not</i> the verb is bare - \"you need not come\".</p>"}, "syllabus_item": "2.3"}]}, {"title": {"en": "4. Subject-Verb Agreement"}, "items": [{"h": {"en": "4.1 The basic rule"}, "body": {"en": "<h4>Rule</h4><p>A singular subject takes a singular verb; a plural subject takes a plural verb. In the present simple the difference is the -s: <i>the motor runs</i>, <i>the motors run</i>.</p><h4>Examples</h4><table><tr><th>Subject</th><th>Verb</th><th>Sentence</th></tr><tr><td>one machine</td><td>is / runs</td><td>The pump <b>is</b> running.</td></tr><tr><td>two machines</td><td>are / run</td><td>The pumps <b>are</b> running.</td></tr><tr><td>he, she, it</td><td>has / does</td><td>It <b>has</b> a new seal.</td></tr><tr><td>I, we, they, you</td><td>have / do</td><td>They <b>have</b> new seals.</td></tr></table><h4>Find the subject first</h4><h4>Words between subject and verb do not change it</h4><ul><li>The <b>box</b> of bolts <b>is</b> heavy. (subject: box)</li><li>The <b>boxes</b> of bolts <b>are</b> heavy. (subject: boxes)</li><li>The <b>reading</b> on both meters <b>was</b> the same.</li><li>The <b>fitters</b> in the second shift <b>work</b> on line 3.</li></ul><h4>Common mistake</h4><p>Matching the verb to the nearest noun instead of the subject: \"The list of items are ready\" is wrong; write \"The list of items is ready\".</p>"}, "diagram": "g4_agreement", "syllabus_item": "2.4"}, {"h": {"en": "4.2 And, or, and words that do not count"}, "body": {"en": "<h4>Rules</h4><table><tr><th>Pattern</th><th>Verb</th><th>Example</th></tr><tr><td>A and B</td><td>plural</td><td>The motor and the pump <b>are</b> new.</td></tr><tr><td>A or B, either ... or, neither ... nor</td><td>nearest subject</td><td>Either the belt or the bearings <b>are</b> worn.</td></tr><tr><td>A with B, as well as, along with, together with</td><td>first subject</td><td>The supervisor, along with two fitters, <b>was</b> present.</td></tr><tr><td>Each / every + singular</td><td>singular</td><td>Each machine <b>has</b> its own meter.</td></tr><tr><td>Two subjects seen as one pair</td><td>singular</td><td>Bread and butter <b>is</b> his breakfast.</td></tr></table><h4>Examples</h4><h4>In sentences</h4><ul><li>The fitter and the helper <b>were</b> on site.</li><li><b>Neither</b> the seal <b>nor</b> the gland <b>was</b> damaged.</li><li><b>Neither</b> the seals <b>nor</b> the gland <b>was</b> damaged.</li><li>The manager, with his team, <b>is</b> visiting the plant.</li></ul><h4>Common mistake</h4><p>\"As well as\" is not <i>and</i>: \"The pump as well as the motor are new\" should be \"is new\".</p>"}, "syllabus_item": "2.4"}, {"h": {"en": "4.3 Collective nouns, uncountables and amounts"}, "body": {"en": "<h4>Collective nouns</h4><p>A group noun takes a singular verb when the group acts as one unit, and a plural verb when the members act separately.</p><h4>Examples</h4><ul><li>The <b>team is</b> ready for the trial. (one unit)</li><li>The <b>team are</b> arguing among themselves. (members)</li><li>The <b>batch has</b> been dispatched.</li><li>The <b>staff is</b> trained in first aid.</li></ul><h4>Uncountables and amounts</h4><table><tr><th>Subject</th><th>Verb</th><th>Example</th></tr><tr><td>uncountable</td><td>singular</td><td>The water <b>is</b> hot.</td></tr><tr><td>a sum of money</td><td>singular</td><td>Fifty rupees <b>is</b> enough.</td></tr><tr><td>a distance or period</td><td>singular</td><td>Ten kilometres <b>is</b> a long walk.</td></tr><tr><td>a pair</td><td>plural</td><td>The scissors <b>are</b> blunt.</td></tr></table><h4>Common mistake</h4><p>\"The equipment are new\" is wrong; <i>equipment</i>, <i>information</i>, <i>advice</i> and <i>furniture</i> are uncountable and take singular verbs.</p>"}, "syllabus_item": "2.4"}, {"h": {"en": "4.4 Indefinite subjects and there is / there are"}, "body": {"en": "<h4>Rules</h4><table><tr><th>Subject</th><th>Verb</th><th>Example</th></tr><tr><td>everyone, everybody, someone, nobody, each, either, neither</td><td>singular</td><td>Everybody <b>is</b> ready.</td></tr><tr><td>none of + plural</td><td>singular or plural</td><td>None of the bolts <b>is</b> loose.</td></tr><tr><td>some / most / half of + plural</td><td>plural</td><td>Most of the fitters <b>are</b> trained.</td></tr><tr><td>some / most / half of + uncountable</td><td>singular</td><td>Most of the oil <b>has</b> leaked.</td></tr><tr><td>there is + singular</td><td>singular</td><td><b>There is</b> one spare left.</td></tr><tr><td>there are + plural</td><td>plural</td><td><b>There are</b> two spares left.</td></tr></table><h4>Examples</h4><h4>Agreement in practice</h4><ul><li><b>Nobody</b> <b>knows</b> the cause yet.</li><li><b>Each of the panels</b> <b>has</b> a label.</li><li><b>None of the readings</b> <b>is</b> outside the limit.</li><li><b>There are</b> three items on the checklist.</li></ul><h4>Common mistake</h4><p>\"Everyone are here\" and \"There is two spares\" are wrong. <i>Everyone</i> is singular; <i>two spares</i> is plural.</p>"}, "syllabus_item": "2.4"}, {"h": {"en": "4.5 Five traps that come up in exams"}, "body": {"en": "<h4>The traps</h4><table><tr><th>Trap</th><th>Right</th><th>Why</th></tr><tr><td>news, mathematics, physics</td><td>The news <b>is</b> good.</td><td>-s but singular</td></tr><tr><td>police, cattle, people</td><td>The police <b>are</b> here.</td><td>always plural</td></tr><tr><td>one of + plural noun</td><td>One of the bolts <b>is</b> missing.</td><td>the subject is <i>one</i></td></tr><tr><td>a number of + plural</td><td>A number of faults <b>were</b> found.</td><td>means <i>many</i></td></tr><tr><td>the number of + plural</td><td>The number of faults <b>was</b> small.</td><td>means <i>the count</i></td></tr><tr><td>percentage or fraction</td><td>Ten per cent of the batch <b>was</b> rejected.</td><td>agrees with the noun after <i>of</i></td></tr></table><h4>Examples</h4><h4>Corrected sentences</h4><ul><li>Wrong: \"The news are bad.\" Right: \"The <b>news is</b> bad.\"</li><li>Wrong: \"One of the pumps are leaking.\" Right: \"One of the pumps <b>is</b> leaking.\"</li><li>Wrong: \"A number of men was present.\" Right: \"A number of men <b>were</b> present.\"</li><li>Wrong: \"Twenty per cent of the oil have leaked.\" Right: \"Twenty per cent of the oil <b>has</b> leaked.\"</li></ul><h4>Common mistake</h4><p>Reading \"one of the pumps\" and matching <i>are</i> to <i>pumps</i>. The subject is <i>one</i>.</p>"}, "syllabus_item": "2.4"}]}, {"title": {"en": "5. Basic Sentence Patterns"}, "items": [{"h": {"en": "5.1 SV: subject + verb"}, "body": {"en": "<h4>Rule</h4><p><b>SV</b> is the shortest complete sentence: a subject and an intransitive verb. Nothing else is needed.</p><h4>Examples</h4><table><tr><th>Subject</th><th>Verb</th><th>Full sentence</th></tr><tr><td>The motor</td><td>failed</td><td>The motor failed.</td></tr><tr><td>The line</td><td>stopped</td><td>The line stopped.</td></tr><tr><td>The pump</td><td>leaked</td><td>The pump leaked.</td></tr><tr><td>The bell</td><td>rang</td><td>The bell rang.</td></tr><tr><td>The operator</td><td>left</td><td>The operator left.</td></tr></table><h4>Longer SV sentences</h4><h4>Still SV, with extra information</h4><ul><li>The motor <b>failed</b> suddenly. (adverb added)</li><li>The line <b>stopped</b> at ten. (time added)</li><li>The pump <b>leaked</b> badly. (adverb added)</li><li>The old motor on line 2 <b>failed</b>. (subject expanded)</li></ul><h4>Common mistake</h4><p>Adding an object to an intransitive verb: \"The motor failed the test\" changes the meaning; if you name what failed, you need a transitive verb (<i>damaged, stopped, broke</i>).</p>"}, "diagram": "g5_patterns", "syllabus_item": "2.5"}, {"h": {"en": "5.2 SVO: subject + verb + object"}, "body": {"en": "<h4>Rule</h4><p><b>SVO</b> uses a transitive verb, and the object answers <i>what?</i> or <i>whom?</i> after the verb.</p><h4>Examples</h4><table><tr><th>Subject</th><th>Verb</th><th>Object</th><th>Sentence</th></tr><tr><td>The fitter</td><td>replaced</td><td>the belt</td><td>The fitter replaced the belt.</td></tr><tr><td>The operator</td><td>checked</td><td>the oil</td><td>The operator checked the oil.</td></tr><tr><td>We</td><td>tested</td><td>the relay</td><td>We tested the relay.</td></tr><tr><td>The company</td><td>ordered</td><td>two pumps</td><td>The company ordered two pumps.</td></tr><tr><td>She</td><td>signed</td><td>the job card</td><td>She signed the job card.</td></tr></table><h4>Find the object</h4><h4>Question test</h4><ul><li>\"The helper cleaned the filter.\" - cleaned <i>what</i>? the filter → SVO</li><li>\"The helper cleaned carefully.\" - cleaned <i>how</i>? → SV (A), no object</li><li>\"We tested the relay at 4 pm.\" - tested <i>what</i>? the relay → SVO</li></ul><h4>Common mistake</h4><p>Putting the object in the wrong place: \"Replaced the fitter the belt\" is wrong; the order is subject, verb, object.</p>"}, "syllabus_item": "2.5"}, {"h": {"en": "5.3 SVA: subject + verb + adverbial"}, "body": {"en": "<h4>Rule</h4><p><b>SVA</b> needs an adverbial - a word or phrase saying where, when or how - because without it the sentence is incomplete.</p><h4>Examples</h4><table><tr><th>Subject</th><th>Verb</th><th>Adverbial</th><th>Sentence</th></tr><tr><td>The pump</td><td>runs</td><td>smoothly</td><td>The pump runs smoothly.</td></tr><tr><td>He</td><td>lives</td><td>in Surat</td><td>He lives in Surat.</td></tr><tr><td>The line</td><td>starts</td><td>at 7 am</td><td>The line starts at 7 am.</td></tr><tr><td>The tools</td><td>are</td><td>on the bench</td><td>The tools are on the bench.</td></tr><tr><td>The meeting</td><td>ended</td><td>at noon</td><td>The meeting ended at noon.</td></tr></table><h4>How to test for SVA</h4><h4>Remove the adverbial and see what happens</h4><ul><li>\"He lives.\" - incomplete, so the adverbial is necessary → SVA</li><li>\"The pump runs.\" - complete, so <i>smoothly</i> is optional → SV</li><li>\"The tools are on the bench.\" - <i>are</i> needs a place → SVA</li><li>\"The line starts at 7 am.\" - when is part of the meaning → SVA</li></ul><h4>Common mistake</h4><p>Calling the adverbial an object. \"He lives in Surat\" has no object; <i>in Surat</i> answers <i>where</i>, not <i>what</i>.</p>"}, "syllabus_item": "2.5"}, {"h": {"en": "5.4 SVC: subject + verb + complement"}, "body": {"en": "<h4>Rule</h4><p><b>SVC</b> uses a linking verb (<i>be, become, seem, look, feel, smell, taste</i>) and a complement that describes the subject. The complement is never an object: it refers to the subject, not to something new.</p><h4>Examples</h4><table><tr><th>Subject</th><th>Verb</th><th>Complement</th><th>Sentence</th></tr><tr><td>The panel</td><td>is</td><td>hot</td><td>The panel is hot.</td></tr><tr><td>The fitter</td><td>became</td><td>a supervisor</td><td>The fitter became a supervisor.</td></tr><tr><td>The bearing</td><td>looks</td><td>worn</td><td>The bearing looks worn.</td></tr><tr><td>The coolant</td><td>smells</td><td>burnt</td><td>The coolant smells burnt.</td></tr><tr><td>The drawing</td><td>seems</td><td>incorrect</td><td>The drawing seems incorrect.</td></tr></table><h4>Object or complement?</h4><h4>Swap test: if the two words can be swapped, it is a complement</h4><ul><li>\"The panel is hot.\" → \"Hot is the panel\" still makes sense → complement, SVC.</li><li>\"The fitter replaced the belt.\" → \"The belt replaced the fitter\" does not → object, SVO.</li><li>\"He became an engineer.\" → \"An engineer became he\" works → SVC.</li><li>\"He checked the relay.\" → no swap → SVO.</li></ul><h4>Common mistake</h4><p>\"The motor is run\" (passive) is not SVC; SVC needs a describing complement: \"The motor is noisy\".</p>"}, "syllabus_item": "2.5"}, {"h": {"en": "5.5 Telling the four apart"}, "body": {"en": "<h4>Four questions</h4><table><tr><th>Question</th><th>Answer</th><th>Pattern</th></tr><tr><td>Is the sentence complete after the verb?</td><td>yes</td><td>SV</td></tr><tr><td>Does <i>what?</i> or <i>whom?</i> give the rest?</td><td>yes</td><td>SVO</td></tr><tr><td>Does the rest answer where, when or how?</td><td>yes</td><td>SVA</td></tr><tr><td>Does the rest describe the subject, after be / become / seem?</td><td>yes</td><td>SVC</td></tr></table><h4>Worked examples: six sentences, sorted</h4><table><tr><th>Sentence</th><th>Pattern</th><th>Why</th></tr><tr><td>The compressor started.</td><td>SV</td><td>complete after the verb</td></tr><tr><td>The operator closed the valve.</td><td>SVO</td><td>closed <i>what</i>?</td></tr><tr><td>The valve is closed.</td><td>SVC</td><td>closed describes the valve</td></tr><tr><td>The gauge reads 4 bar.</td><td>SVO</td><td>reads <i>what</i>?</td></tr><tr><td>The gauge is on the panel.</td><td>SVA</td><td><i>where</i></td></tr><tr><td>The gauge looks faulty.</td><td>SVC</td><td>describes the gauge</td></tr></table><h4>Beyond the syllabus</h4><p>Two more patterns appear in longer sentences: <b>SVOO</b> (<i>The store gave the fitter a new seal</i>) and <b>SVOC</b> (<i>The inspector found the panel hot</i>). The syllabus examines SV, SVO, SVA and SVC.</p><h4>Common mistake</h4><p>Deciding by the last word instead of the question the rest answers. Always ask <i>what?</i> before you call something an object.</p>"}, "syllabus_item": "2.5"}]}, {"title": {"en": "6. Practice Questions with Model Answers"}, "items": [{"h": {"en": "Practice 1. Name the parts of speech of the underlined words: The (a) fitter quickly (b) replaced the brass (c) valve and (d) smiled."}, "body": {"en": "<p>(a) <b>fitter</b> - noun (common noun, doeser of the action).</p><p>(b) <b>quickly</b> - adverb of manner, describing <i>replaced</i>.</p><p>(c) <b>brass</b> - adjective (material adjective describing <i>valve</i>; it can also be a noun). (d) <b>and</b> - conjunction, joining two verb phrases.</p><p>The sentence uses four classes in nine words; label a word by the work it does in that sentence, not by a fixed label.</p>"}}, {"h": {"en": "Practice 2. Rewrite these sentences with the correct present simple form: (a) The pump run daily. (b) He do not check the oil. (c) Does they test the relay?"}, "body": {"en": "<p>(a) The pump <b>runs</b> daily. - the subject is singular, so the verb takes -s.</p><p>(b) He <b>does not check</b> the oil. - with he, she, it use <i>does</i>, and the main verb stays in V1.</p><p>(c) <b>Do</b> they <b>test</b> the relay? - with they use <i>do</i>, and again the main verb stays in V1.</p>"}}, {"h": {"en": "Practice 3. Fill in the correct tense: (a) The line ___ (stop) at 10:15 am yesterday. (b) I ___ (check) the panel when the alarm rang. (c) She ___ (work) here since 2022. (d) We ___ (finish) the job, so the line can start."}, "body": {"en": "<p>(a) <b>stopped</b> - past simple, because <i>yesterday</i> is a finished time.</p><p>(b) <b>was checking</b> - past continuous, an action in progress when a shorter action happened.</p><p>(c) <b>has been working</b> - present perfect continuous with <i>since</i>, for an action that began in the past and is still going on; <b>has worked</b> is also accepted.</p><p>(d) <b>have finished</b> - present perfect, because the result matters now: the line can start.</p>"}}, {"h": {"en": "Practice 4. Correct these sentences: (a) I have seen him yesterday. (b) He did not checked the torque. (c) They are knowing the answer."}, "body": {"en": "<p>(a) I <b>saw</b> him yesterday. - <i>yesterday</i> is a finished time, so the past simple is used, not the present perfect.</p><p>(b) He did not <b>check</b> the torque. - after <i>did not</i> the verb stays in V1.</p><p>(c) They <b>know</b> the answer. - <i>know</i> is a stative verb, so it takes the simple present, not the continuous.</p>"}}, {"h": {"en": "Practice 5. Use the correct modal: (a) ___ you please send the drawing? (polite request) (b) You ___ wear goggles in the shop. (strong obligation) (c) You ___ come tomorrow; the job is done. (no obligation) (d) The relay ___ be faulty, but I am not sure. (weak possibility)"}, "body": {"en": "<p>(a) <b>Could</b> you please send the drawing? - <i>could</i> is the modal used for a polite request.</p><p>(b) You <b>must</b> wear goggles in the shop. - must marks a rule and a strong obligation.</p><p>(c) You <b>need not</b> come tomorrow. - need not means there is no obligation; must not would mean prohibition, which is a different instruction.</p><p>(d) The relay <b>might</b> be faulty. - might expresses a weaker possibility than may.</p>"}}, {"h": {"en": "Practice 6. Explain the difference between must not and need not with one example each."}, "body": {"en": "<p><b>Must not</b> forbids an action: \"You must not open the panel while the supply is on.\" It is a rule with a safety reason.</p><p><b>Need not</b> removes an obligation: \"You need not open the panel for a visual check.\" The action is allowed, simply not necessary.</p><p>The two are opposites in practice: one stops you, the other lets you off.</p>"}}, {"h": {"en": "Practice 7. Correct the subject-verb agreement: (a) The box of bolts are heavy. (b) One of the pumps are leaking. (c) Neither the seal nor the gland were damaged. (d) The news are bad."}, "body": {"en": "<p>(a) The box of bolts <b>is</b> heavy. - the subject is <i>box</i>; <i>of bolts</i> only describes it.</p><p>(b) One of the pumps <b>is</b> leaking. - the subject is <i>one</i>, not <i>pumps</i>.</p><p>(c) Neither the seal nor the gland <b>was</b> damaged. - with neither ... nor the verb agrees with the nearer subject, which is singular here.</p><p>(d) The news <b>is</b> bad. - <i>news</i> ends in -s but is singular.</p>"}}, {"h": {"en": "Practice 8. Give two rules of subject-verb agreement with one example each."}, "body": {"en": "<p>A singular subject takes a singular verb and a plural subject a plural verb: \"The motor runs\" and \"The motors run\".</p><p>Words placed between the subject and the verb do not change the verb: \"The list of items <b>is</b> ready\", where the subject is <i>list</i>.</p><p>Two subjects joined by <i>and</i> take a plural verb: \"The motor and the pump <b>are</b> new\", while <i>along with</i> and <i>as well as</i> do not: \"The supervisor, along with two fitters, <b>was</b> present\".</p>"}}, {"h": {"en": "Practice 9. Identify the pattern of each sentence: (a) The compressor started. (b) The operator closed the valve. (c) The valve is closed. (d) The gauge is on the panel."}, "body": {"en": "<p>(a) <b>SV</b> - the sentence is complete after the intransitive verb <i>started</i>.</p><p>(b) <b>SVO</b> - <i>closed</i> what? the valve; the object is a different thing from the subject.</p><p>(c) <b>SVC</b> - <i>closed</i> describes the valve, and the two can be swapped in meaning, so it is a complement.</p><p>(d) <b>SVA</b> - <i>on the panel</i> answers where, and without it <i>the gauge is</i> is incomplete.</p>"}}, {"h": {"en": "Practice 10. Write one sentence for each pattern SV, SVO, SVA and SVC about a workshop."}, "body": {"en": "<p><b>SV:</b> The drill stopped. - the sentence is complete after the intransitive verb, so nothing else is needed.</p><p><b>SVO:</b> The apprentice cleaned the filter. - <i>cleaned</i> what? the filter, which is the object.</p><p><b>SVA:</b> The compressor is in the corner. - <i>in the corner</i> answers where, and it cannot be left out.</p><p><b>SVC:</b> The bearing feels rough. - <i>rough</i> describes the bearing after the linking verb <i>feels</i>, so it is a complement. Keep each sentence short in the exam, then name the pattern from the question that the rest of the sentence answers.</p>"}}, {"h": {"en": "Practice 11. Change these into the tense asked for: (a) He checks the oil. (past continuous) (b) They replaced the belt. (present perfect) (c) The line stops at 10. (past simple) (d) I write the report. (future simple)"}, "body": {"en": "<p>(a) He <b>was checking</b> the oil.</p><p>(b) They <b>have replaced</b> the belt.</p><p>(c) The line <b>stopped</b> at 10.</p><p>(d) I <b>will write</b> the report. Notice that only the auxiliary and the tense-carrying verb form change; the subject, the object and the rest of the sentence stay exactly as they are.</p><p>Check every answer the same way: name the tense of the original, name the tense asked for, then change only what that tense needs.</p>"}}, {"h": {"en": "Practice 12. Explain the difference between the present perfect and the past simple, with one example each."}, "body": {"en": "<p>The <b>past simple</b> reports a finished action at a finished time: \"We replaced the belt yesterday.\" The time is named or understood.</p><p>The <b>present perfect</b> reports a finished action whose result matters now, with no time named: \"We have replaced the belt, so the line can start.\"</p><p>So \"I have seen him yesterday\" is wrong - the moment you name <i>yesterday</i>, the past simple is needed.</p>"}}, {"h": {"en": "Practice 13. Correct these sentences and name the error: (a) He works good. (b) Myself Raj. (c) Discuss about the problem. (d) Although it was hot, but we finished."}, "body": {"en": "<p>(a) He works <b>well</b>. - an adverb is needed, not the adjective <i>good</i>.</p><p>(b) <b>I am</b> Raj. - <i>myself</i> is reflexive and cannot replace the subject pronoun.</p><p>(c) <b>Discuss</b> the problem. - <i>discuss</i> is transitive and takes no preposition.</p><p>(d) <b>Although</b> it was hot, we finished. - one conjunction per link; <i>although</i> and <i>but</i> together is a double conjunction.</p>"}}, {"h": {"en": "Practice 14. Give one example each of a preposition of place, time and agent."}, "body": {"en": "<p>Place: \"The tools are <b>on</b> the bench.\"</p><p>Time: \"The line starts <b>at</b> 7 am.\"</p><p>Agent: \"The joint was welded <b>by</b> Ashok.\" The agent preposition names who did the action, which is why passive sentences use <i>by</i>.</p><p>Keep the three questions separate in the exam: <i>where</i> gives a preposition of place, <i>when</i> a preposition of time, and <i>by whom</i> the agent.</p>"}}, {"h": {"en": "Practice 15. Join each pair with a suitable conjunction: (a) The belt was loose. The line vibrated. (b) The load was high. The motor stayed cool."}, "body": {"en": "<p>(a) <b>Because</b> the belt was loose, the line vibrated. - subordinating conjunction for cause.</p><p>(b) <b>Although</b> the load was high, the motor stayed cool. - subordinating conjunction for contrast.</p><p>(a) can also be joined with <i>so</i> in the other order: \"The belt was loose, so the line vibrated.\" Both are correct; the choice changes which half is the main clause.</p>"}}]}], "diagrams": [{"id": "g1_pos", "title": {"en": "The eight parts of speech"}, "file": "diagrams/g1_pos.svg"}, {"id": "g2_tenses", "title": {"en": "Tenses on a timeline"}, "file": "diagrams/g2_tenses.svg"}, {"id": "g3_modal", "title": {"en": "Modal auxiliaries by function"}, "file": "diagrams/g3_modal.svg"}, {"id": "g4_agreement", "title": {"en": "Subject-verb agreement rules"}, "file": "diagrams/g4_agreement.svg"}, {"id": "g5_patterns", "title": {"en": "The four sentence patterns"}, "file": "diagrams/g5_patterns.svg"}], "equations": [{"title": {"en": "Tense forms at a glance"}, "items": [{"terms": {"en": "Present simple"}, "a": {"en": "V1 / V1+s - he runs"}}, {"terms": {"en": "Present continuous"}, "a": {"en": "am/is/are + V-ing - he is running"}}, {"terms": {"en": "Present perfect"}, "a": {"en": "have/has + V3 - he has run"}}, {"terms": {"en": "Present perfect continuous"}, "a": {"en": "have/has been + V-ing - he has been running"}}, {"terms": {"en": "Past simple"}, "a": {"en": "V2 - he ran"}}, {"terms": {"en": "Past continuous"}, "a": {"en": "was/were + V-ing - he was running"}}, {"terms": {"en": "Past perfect"}, "a": {"en": "had + V3 - he had run"}}, {"terms": {"en": "Future simple"}, "a": {"en": "will + V1 - he will run"}}]}, {"title": {"en": "Sentence patterns"}, "items": [{"terms": {"en": "SV"}, "a": {"en": "The motor failed."}}, {"terms": {"en": "SVO"}, "a": {"en": "The fitter replaced the belt."}}, {"terms": {"en": "SVA"}, "a": {"en": "The pump runs smoothly."}}, {"terms": {"en": "SVC"}, "a": {"en": "The panel is hot."}}]}], "viva": [{"title": {"en": "Parts of speech and tenses"}, "items": [{"q": {"en": "Name the eight parts of speech."}, "a": {"en": "Noun, verb, pronoun, adjective, adverb, preposition, conjunction and interjection."}}, {"q": {"en": "What is the difference between a common noun and a proper noun? Give an example."}, "a": {"en": "A common noun names any member of a class (city, engineer) and takes no capital; a proper noun names one particular one (Surat, Ashok) and always takes a capital."}}, {"q": {"en": "Give three uncountable nouns used in a workshop."}, "a": {"en": "Water, oil and equipment - they have no plural form, so we say \"two pieces of equipment\"."}}, {"q": {"en": "What is the difference between an adjective and an adverb?"}, "a": {"en": "An adjective describes a noun (a hot motor); an adverb describes a verb, adjective or another adverb (the motor runs smoothly)."}}, {"q": {"en": "Give the three degrees of comparison of \"good\"."}, "a": {"en": "Good, better, best - and never \"more better\"."}}, {"q": {"en": "State the rule for the present simple with he, she and it."}, "a": {"en": "The verb takes -s: he runs, she checks, it leaks."}}, {"q": {"en": "When do we use the present perfect?"}, "a": {"en": "For a finished action with a present result or an experience with no time mentioned: \"I have finished the job, so the line can start.\""}}, {"q": {"en": "What is the difference between past simple and past perfect?"}, "a": {"en": "Past simple reports one past action (\"the belt broke\"); past perfect reports the earlier of two past actions (\"the belt had broken before I arrived\")."}}]}, {"title": {"en": "Modals, agreement and patterns"}, "items": [{"q": {"en": "List the modal auxiliaries in your syllabus."}, "a": {"en": "Can, could, may, might, must, shall, will, should, would, ought to and need."}}, {"q": {"en": "What is the difference between must not and need not?"}, "a": {"en": "Must not is prohibition (\"you must not open the panel live\"); need not means no obligation (\"you need not come tomorrow\")."}}, {"q": {"en": "Give one sentence each with can, could and may."}, "a": {"en": "Ability: \"I can weld aluminium.\" Polite request: \"Could you send the drawing?\" Formal permission: \"May I enter the shop floor?\""}}, {"q": {"en": "State two rules of subject-verb agreement with examples."}, "a": {"en": "A singular subject takes a singular verb (the motor runs) and a plural subject a plural verb (the motors run); and two subjects joined by and take a plural verb (the motor and the pump are new)."}}, {"q": {"en": "Which verb agrees with \"one of the pumps\"?"}, "a": {"en": "A singular verb, because the subject is one: \"one of the pumps is leaking\"."}}, {"q": {"en": "Name the four basic sentence patterns with one example each."}, "a": {"en": "SV - the motor failed; SVO - the fitter replaced the belt; SVA - the pump runs smoothly; SVC - the panel is hot."}}, {"q": {"en": "How do you tell an object from a complement?"}, "a": {"en": "An object answers what or whom and is a different thing from the subject; a complement describes the subject and can be swapped with it in meaning - \"the panel is hot\" / \"hot is the panel\"."}}, {"q": {"en": "What is a transitive verb?"}, "a": {"en": "A verb that needs an object to complete its meaning, such as replace, check or measure: \"replace the belt\"."}}]}], "exam_questions": [{"q": {"en": "Practice: Name the parts of speech of the underlined words: The (a) fitter quickly (b) replaced the brass (c) valve and (d) smiled."}, "marks": 4}, {"q": {"en": "Practice: Rewrite these sentences with the correct present simple form: (a) The pump run daily. (b) He do not check the oil. (c) Does they test the relay?"}, "marks": 3}, {"q": {"en": "Practice: Fill in the correct tense: (a) The line ___ (stop) at 10:15 am yesterday. (b) I ___ (check) the panel when the alarm rang. (c) She ___ (work) here since 2022. (d) We ___ (finish) the job, so the line can start."}, "marks": 4}, {"q": {"en": "Practice: Correct these sentences: (a) I have seen him yesterday. (b) He did not checked the torque. (c) They are knowing the answer."}, "marks": 3}, {"q": {"en": "Practice: Use the correct modal: (a) ___ you please send the drawing? (polite request) (b) You ___ wear goggles in the shop. (strong obligation) (c) You ___ come tomorrow; the job is done. (no obligation) (d) The relay ___ be faulty, but I am not sure. (weak possibility)"}, "marks": 4}, {"q": {"en": "Practice: Explain the difference between must not and need not with one example each."}, "marks": 3}, {"q": {"en": "Practice: Correct the subject-verb agreement: (a) The box of bolts are heavy. (b) One of the pumps are leaking. (c) Neither the seal nor the gland were damaged. (d) The news are bad."}, "marks": 4}, {"q": {"en": "Practice: Give two rules of subject-verb agreement with one example each."}, "marks": 3}, {"q": {"en": "Practice: Identify the pattern of each sentence: (a) The compressor started. (b) The operator closed the valve. (c) The valve is closed. (d) The gauge is on the panel."}, "marks": 4}, {"q": {"en": "Practice: Write one sentence for each pattern SV, SVO, SVA and SVC about a workshop."}, "marks": 4}, {"q": {"en": "Practice: Change these into the tense asked for: (a) He checks the oil. (past continuous) (b) They replaced the belt. (present perfect) (c) The line stops at 10. (past simple) (d) I write the report. (future simple)"}, "marks": 4}, {"q": {"en": "Practice: Explain the difference between the present perfect and the past simple, with one example each."}, "marks": 3}, {"q": {"en": "Practice: Correct these sentences and name the error: (a) He works good. (b) Myself Raj. (c) Discuss about the problem. (d) Although it was hot, but we finished."}, "marks": 4}, {"q": {"en": "Practice: Give one example each of a preposition of place, time and agent."}, "marks": 3}, {"q": {"en": "Practice: Join each pair with a suitable conjunction: (a) The belt was loose. The line vibrated. (b) The load was high. The motor stayed cool."}, "marks": 3}], "learning_outcomes": [{"en": "CO2: Construct grammatically correct sentences."}], "course_outcomes": ["CO2"], "practical_numbers": [], "content_kind": "theory", "lesson_count": 31, "answered_practice_count": 15, "assessment_note": {"en": "Official course: theory ESE 70 + PA 30 and practical PA 20 + ESE 30 = 150 marks, 3 credits, 30 teaching hours; this unit carries 40 % weightage and 28 of the 70 theory marks. Practice-question marks (3/4) are suggested revision sizes, not official GTU allocations. Model answers are in Notes section 7."}, "question_provenance": "Original answered revision questions; not official past papers", "question_marks_are_suggested": true, "sources": [{"title": "GTU DI01000031, Communication Skills in English, Semester 1, HSMC-1 (uploaded syllabus)", "url": "https://syllabus.gtu.ac.in/"}, {"title": "Cambridge Dictionary - grammar reference", "url": "https://dictionary.cambridge.org/grammar/british-grammar/"}, {"title": "British Council LearnEnglish - English grammar", "url": "https://learnenglish.britishcouncil.org/grammar"}, {"title": "N. K. Aggrawal - Essentials of English Grammar and Composition (Goyal Brothers, 2015)", "url": "https://www.goyalpublishers.com/"}, {"title": "W. S. Allen - Living English Structures (Pearson Education India)", "url": "https://www.pearson.com/"}]};
const SVG = {"g1_pos": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 374\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"374\" fill=\"#ffffff\"/><text x=\"180\" y=\"28.9\" font-size=\"14\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">The eight parts of speech</text><text x=\"180\" y=\"49.6\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">word class - one example each</text><rect x=\"12.0\" y=\"59.0\" width=\"336\" height=\"26\" rx=\"7\" fill=\"#EAF3FD\" stroke=\"#1565C0\" stroke-width=\"1.6\"/><text x=\"180\" y=\"75.4\" font-size=\"9.6\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">Noun - names: motor, Surat, honesty</text><rect x=\"12.0\" y=\"93.0\" width=\"336\" height=\"26\" rx=\"7\" fill=\"#EAF3FD\" stroke=\"#1565C0\" stroke-width=\"1.6\"/><text x=\"180\" y=\"109.4\" font-size=\"9.6\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">Pronoun - replaces a noun: it, they, who</text><rect x=\"12.0\" y=\"127.0\" width=\"336\" height=\"26\" rx=\"7\" fill=\"#EAF6EC\" stroke=\"#2E7D32\" stroke-width=\"1.6\"/><text x=\"180\" y=\"143.4\" font-size=\"9.6\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">Verb - action or state: run, is, replace</text><rect x=\"12.0\" y=\"161.0\" width=\"336\" height=\"26\" rx=\"7\" fill=\"#EAF6EC\" stroke=\"#2E7D32\" stroke-width=\"1.6\"/><text x=\"180\" y=\"177.4\" font-size=\"9.6\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">Adjective - describes a noun: hot, three, brass</text><rect x=\"12.0\" y=\"195.0\" width=\"336\" height=\"26\" rx=\"7\" fill=\"#FFF4DF\" stroke=\"#B66A00\" stroke-width=\"1.6\"/><text x=\"180\" y=\"211.4\" font-size=\"9.6\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">Adverb - describes a verb: quickly, daily, very</text><rect x=\"12.0\" y=\"229.0\" width=\"336\" height=\"26\" rx=\"7\" fill=\"#FFF4DF\" stroke=\"#B66A00\" stroke-width=\"1.6\"/><text x=\"180\" y=\"245.4\" font-size=\"9.6\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">Preposition - links to a place or time: under, at, after</text><rect x=\"12.0\" y=\"263.0\" width=\"336\" height=\"26\" rx=\"7\" fill=\"#FDECF0\" stroke=\"#BD2543\" stroke-width=\"1.6\"/><text x=\"180\" y=\"279.4\" font-size=\"9.6\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">Conjunction - joins: and, but, because</text><rect x=\"12.0\" y=\"297.0\" width=\"336\" height=\"26\" rx=\"7\" fill=\"#FDECF0\" stroke=\"#BD2543\" stroke-width=\"1.6\"/><text x=\"180\" y=\"313.4\" font-size=\"9.6\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">Interjection - sudden feeling: oh!, alas!, hurray!</text><text x=\"180\" y=\"353.5\" font-size=\"10.0\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">Same word, different class: \"paint\" is a verb in \"paint the wall\",</text><text x=\"180\" y=\"369.5\" font-size=\"10.0\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">and a noun in \"the paint is wet\".</text></svg>", "g2_tenses": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 330\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"330\" fill=\"#ffffff\"/><text x=\"180\" y=\"28.9\" font-size=\"14\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">Tenses on a timeline</text><text x=\"180\" y=\"49.6\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">what the verb does, and when</text><path d=\"[(24, 74), (336, 74)]\" fill=\"none\" stroke=\"#666\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M316 74 L338 74\" fill=\"none\" stroke=\"#666\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polygon points=\"338.0,74.0 331.0,70.5 331.0,77.5\" fill=\"#666\"/><text x=\"40\" y=\"69.4\" font-size=\"9.6\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">past</text><text x=\"180\" y=\"69.4\" font-size=\"9.6\   return groups.map(g=>{
    const items = g.items || [];
    return `<div class="sec">${g.title?head(t(g.title)):''}` + items.map((v,i)=>
      `<div class="card"><div class="q hd"><span class="n">${i+1}.</span><span class="t">${t(v.q)}</span>${chev}</div><div class="a"><p>${t(v.a)}</p></div></div>`).join('') + `</div>`;
  }).join('');
}
function exam(){
  return `<div class="sec">${head(L('examhead'),false)}` + U.exam_questions.map((x,i)=>
    `<div class="card"><div class="q" style="cursor:default"><span class="n">${i+1}.</span><span class="t">${t(x.q)}</span><span class="mk">${x.marks} ${L('marks')}</span></div></div>`).join('') + `</div>`;
}
function programs(){
  return `<div class="sec">${head(L('programs'))}` + (U.programs||[]).map((p,i)=>
    `<div class="card"><div class="q hd"><span class="n">${i+1}.</span><span class="t">${t(p.title)}</span>${chev}</div><div class="a pa">${progBody(p)}</div></div>`).join('') + `</div>`;
}
function syntax(key){
  return (U[typeof key==='string'?key:'syntax']||[]).map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><pre class="code sx">${hl(e.f)}</pre></span>${chev}</div>
     <div class="a">${e.terms && t(e.terms) ? fixTables(t(e.terms)) : ''}</div></div>`).join('') + `</div>`).join('');
}
const flowcharts = diagrams;
const algorithms = () => syntax('algorithms');
const ALLV = {notes, programs, diagrams, flowcharts, algorithms, syntax, equations, numericals, viva, exam};
const VIEWS = U.tabs ? Object.fromEntries(U.tabs.map(k=>[k, ALLV[k]])) : U.programs ? (META.code_lang==='python' ? {notes, programs, diagrams, syntax, viva, exam} : {notes, programs, flowcharts, syntax, viva, exam}) : U.numericals ? {notes, diagrams, equations, numericals, viva, exam} : {notes, diagrams, equations, viva, exam};
function render(){
  document.getElementById('title').textContent = `${L('unit')} ${U.unit}: ${t(U.title)}`;
  document.getElementById('sub').textContent = `${t(META.name)} · ${META.code}`;
  document.getElementById('lang').textContent = S.lang==='en' ? 'ગુ' : 'EN';
  document.getElementById('lang').style.display = META.languages.includes('gu') ? '' : 'none';
  document.getElementById('tabs').innerHTML = Object.keys(VIEWS).map(k=>`<button class="tab${S.tab===k?' on':''}" data-tab="${k}">${L(k)}</button>`).join('');
  document.getElementById('view').innerHTML = VIEWS[S.tab]();
  document.querySelectorAll('#view pre.c').forEach(e=>{ e.innerHTML = hl(e.textContent); e.className='code'; });
}
let zoom = 1;
function setZoom(z){ zoom = Math.min(4, Math.max(1, z)); const w=document.getElementById('zw'); w.style.width=(zoom*100)+'%'; document.getElementById('zr').textContent=Math.round(zoom*100)+'%'; }
document.addEventListener('click', e=>{
  const q = e.target.closest('.q'); if (q && q.parentElement.querySelector('.a')) { q.parentElement.classList.toggle('open'); return; }
  const tb = e.target.closest('[data-tab]'); if (tb){ S.tab = tb.dataset.tab; render(); window.scrollTo(0,0); return; }
  if (e.target.closest('#lang')){ S.lang = S.lang==='en'?'gu':'en'; render(); return; }
  const m = e.target.closest('[data-more]');
  document.querySelectorAll('.menu.show').forEach(x=>{ if(!m || x!==m.nextElementSibling) x.classList.remove('show'); });
  if (m){ m.nextElementSibling.classList.toggle('show'); return; }
  const act = e.target.closest('[data-act]');
  if (act){ act.closest('.sec').querySelectorAll('.card').forEach(c=>{ if(c.querySelector('.a')) c.classList.toggle('open', act.dataset.act==='expand'); }); act.parentElement.classList.remove('show'); return; }
  const dg = e.target.closest('[data-dg]');
  if (dg){ const id=dg.dataset.dg; document.getElementById('mt').textContent=t(U.diagrams.find(d=>d.id===id).title); document.getElementById('zw').innerHTML=SVG[id]; setZoom(1); document.getElementById('modal').classList.add('show'); return; }
  if (e.target.closest('#mx')) document.getElementById('modal').classList.remove('show');
  if (e.target.closest('#zi')) setZoom(zoom+0.5);
  if (e.target.closest('#zo')) setZoom(zoom-0.5);
  if (e.target.closest('#zr')) setZoom(1);
});
render();
</script>
