<style>
:root{--p:#7B2CD9;--pd:#6420B8;--lav:#EADDF7;--bg:#F3ECFA;--ink:#1d1b20}

body{margin:0;background:#d8cce8;font-family:"Noto Sans Gujarati","Shruti","Nirmala UI",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink)}

.menu{display:none;position:absolute;right:12px;top:48px;background:#fff;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.18);z-index:5;overflow:hidden;min-width:150px}

@keyframes fd{from{opacity:0;transform:translateY(-4px)}to{opacity:1}}

.kw{color:#C792EA;font-weight:700}.ty{color:#82AAFF}.st{color:#C3E88D}.cm{color:#8E9AAF;font-style:italic}.pp{color:#F78C6C}.nu{color:#F9C46B}.fn{color:#FFCB6B}

<script>
const U = {"subject": "DI02000021", "unit": 4, "format": "notes", "title": {"en": "Differential Equations"}, "hours": 7, "weightage": 17, "official": true, "languages": ["en"], "tabs": ["notes", "diagrams", "equations", "numericals", "viva", "exam"], "intro_text": {"en": "Unit 4 of Engineering Mathematics: what a differential equation is, order and degree, general and particular solutions, the variable separable method, and the first-order linear equation solved with an integrating factor - with growth, decay and cooling as the engineering models. Twenty-two fully solved numericals, each linked to a card."}, "notes": [{"title": {"en": "1. What a Differential Equation Is"}, "items": [{"h": {"en": "1.1 An equation with a derivative in it"}, "body": {"en": "<h4>Definition</h4><p>A <b>differential equation</b> (DE) is an equation that contains derivatives of an unknown function. Solving it means finding that function.</p><p>Ordinary examples: dy/dx = 2x, dy/dx + y = eˣ, d²y/dx² + y = 0.</p><h4>Why engineering needs them</h4><p>Almost every law of engineering is written as a rate: cooling is a rate of temperature change, a capacitor charges at a rate set by the current, a falling body accelerates at a rate set by gravity. Solving the DE turns the law into a formula you can evaluate.</p><h4>What a solution looks like</h4><p>A solution is a function y(x) - not a number - that satisfies the equation identically when substituted. For dy/dx = 2x the solution is y = x² + c.</p><h4>Common mistake</h4><p>Treating the derivative as a fraction to be simplified away before separating the variables. dy/dx behaves like a fraction only when the variables are separated.</p>"}, "examples": ["de4"], "syllabus_item": "4.1"}, {"h": {"en": "1.2 Order and degree"}, "body": {"en": "<h4>Order</h4><p>The <b>order</b> is the order of the highest derivative present: dy/dx makes it first order, d²y/dx² makes it second order.</p><h4>Degree</h4><p>The <b>degree</b> is the power of that highest derivative after the equation has been cleared of fractions and radicals in the derivatives.</p><h4>Examples</h4><table><tr><th>Equation</th><th>Order</th><th>Degree</th></tr><tr><td>dy/dx + y = x</td><td>1</td><td>1</td></tr><tr><td>(dy/dx)³ + y = x²</td><td>1</td><td>3</td></tr><tr><td>d²y/dx² + 3(dy/dx)² = x</td><td>2</td><td>1</td></tr><tr><td>d²y/dx² + y² = 0</td><td>2</td><td>1</td></tr></table><h4>Common mistake</h4><p>Reading the degree from the wrong term. In d²y/dx² + 3(dy/dx)² = x the order is 2, so the degree is the power of d²y/dx², which is 1 - the square on dy/dx is irrelevant.</p>"}, "diagram": "d1_order", "examples": ["de1", "de2"], "syllabus_item": "4.1"}, {"h": {"en": "1.3 General and particular solutions"}, "body": {"en": "<h4>General solution</h4><p>Solving a first-order DE produces one arbitrary constant, so the answer is a family of curves: y = c e^(−x) for dy/dx = −y, one curve for every c.</p><h4>Particular solution</h4><p>One extra condition - usually y = y₀ when x = 0 - fixes c and selects a single curve. The condition must match the order: one condition for a first-order DE, two for a second-order one.</p><h4>Singleton and singular solutions</h4><p>A <b>singleton</b> solution has no arbitrary constant at all; a curve that cannot be obtained from the general family is called <b>singular</b>. For this unit only general and particular solutions matter.</p><h4>Common mistake</h4><p>Calling y = c e^(−x) 'the' solution. Without a condition it is the general solution, and the constant must stay.</p>"}, "diagram": "d5_family", "examples": ["de11"], "syllabus_item": "4.1"}, {"h": {"en": "1.4 Verifying a solution"}, "body": {"en": "<h4>The test</h4><p>Substitute y and its derivatives into the equation. If both sides come out equal for every x, the function is a solution - there is nothing else to check.</p><h4>Worked example</h4><p>Does y = e^(2x) solve y′ − 2y = 0? Here y′ = 2e^(2x), so y′ − 2y = 2e^(2x) − 2e^(2x) = 0 for every x. Yes.</p><h4>With two constants</h4><p>y = A cos x + B sin x gives y′ = −A sin x + B cos x and y″ = −y, so y″ + y = 0 for any A and B - that is why the second-order equation has two constants.</p><h4>Why it matters</h4><p>Verification is the fastest way to earn full marks when time is short: it proves an answer without re-deriving it.</p>"}, "examples": ["de5"], "syllabus_item": "4.1"}]}, {"title": {"en": "2. Forming and Classifying Equations"}, "items": [{"h": {"en": "2.1 Forming a DE by eliminating constants"}, "body": {"en": "<h4>Method</h4><ol><li>Write the family with its arbitrary constant(s).</li><li>Differentiate as many times as there are constants.</li><li>Eliminate the constants between the original equation and the derivatives.</li></ol><h4>Worked example</h4><p>From y = cx², differentiation gives y′ = 2cx. Dividing, c = y′/(2x), and substituting back gives y = (y′/(2x))x² = xy′/2, that is <b>x y′ − 2y = 0</b>.</p><h4>One constant, one differentiation</h4><p>From y = a e^(2x) we get y′ = 2a e^(2x) = 2y, so <b>y′ = 2y</b> - the constant has disappeared because it cancels.</p><h4>Common mistake</h4><p>Differentiating twice when there is only one constant. Each constant needs exactly one differentiation.</p>"}, "examples": ["de6", "de7"], "syllabus_item": "4.1"}, {"h": {"en": "2.2 First order and first degree: what this unit solves"}, "body": {"en": "<h4>The shape</h4><p>Every equation in this unit is first order and first degree, so it can be written as <b>dy/dx = f(x, y)</b> or in the differential form M dx + N dy = 0.</p><h4>Two methods only</h4><ul><li>Variable separable: the right side factorises into an x-part times a y-part.</li><li>Linear: the equation is dy/dx + P(x) y = Q(x), with y and dy/dx to the first power.</li></ul><h4>Example of each</h4><p>dy/dx = x²/y is separable. dy/dx + 2y = eˣ is linear. (dy/dx)² = x + y is first order but second degree, so it is outside this syllabus.</p><h4>Common mistake</h4><p>Starting to solve before deciding which of the two shapes the equation has. One look at the form saves the whole attempt.</p>"}, "examples": ["de3"], "syllabus_item": "4.1"}, {"h": {"en": "2.3 Notation you will meet"}, "body": {"en": "<h4>Three ways to write the same thing</h4><table><tr><th>Notation</th><th>Meaning</th></tr><tr><td>dy/dx or y′</td><td>derivative of y with respect to x</td></tr><tr><td>M dx + N dy = 0</td><td>differential form, convenient for separation</td></tr><tr><td>dy/dx + P y = Q</td><td>the linear standard form</td></tr></table><h4>Reading the differential form</h4><p>From (x + 1) dy = y dx you can move straight to dy/y = dx/(x + 1) - no rearrangement needed. That is the value of writing the equation with both differentials.</p><h4>Independent variable</h4><p>In dy/dt the independent variable is t (often time). The method is identical; only the letter changes, so do not panic when a physics question uses t or T.</p><h4>Common mistake</h4><p>Mixing variables mid-solution, e.g. integrating an expression in y with respect to x. Keep one variable per side until the integration is done.</p>"}, "examples": ["de1"], "syllabus_item": "4.1"}, {"h": {"en": "2.4 Turning a word problem into an equation"}, "body": {"en": "<h4>The translation table</h4><table><tr><th>The words</th><th>The mathematics</th></tr><tr><td>rate of change of y</td><td>dy/dt</td></tr><tr><td>proportional to y</td><td>dy/dt = k y</td></tr><tr><td>proportional to the excess over the surroundings</td><td>dT/dt = −k (T − T₀)</td></tr><tr><td>proportional to the amount present</td><td>dy/dt = k y</td></tr><tr><td>initially / at t = 0</td><td>y(0) = the starting value</td></tr></table><h4>Three steps</h4><ol><li>Name the unknown and its rate - the variables and units come from the wording.</li><li>Write the law as an equation with a constant of proportionality k.</li><li>Note the initial condition, then solve and use it to fix c.</li></ol><h4>Common mistake</h4><p>Forgetting that k may be negative. In cooling the temperature falls towards the room, so the sign must make dT/dt negative when T is above the room.</p>"}, "syllabus_item": "4.1"}]}, {"title": {"en": "3. The Variable Separable Method"}, "items": [{"h": {"en": "3.1 The idea: split x from y"}, "body": {"en": "<h4>When it works</h4><p>If the equation can be written as dy/dx = f(x) · g(y), the variables separate: divide by g(y) and multiply by dx to get dy/g(y) = f(x) dx.</p><h4>Worked example</h4><p>dy/dx = x/y gives y dy = x dx. Integrating, y²/2 = x²/2 + c₁, that is <b>y² = x² + c</b> - one constant, absorbed on one side.</p><h4>Why the constant appears only once</h4><p>Each side produces its own constant, but two constants combine into one. Writing c once, on one side, is the accepted form.</p><h4>Common mistake</h4><p>Separating only one term in a sum. dy/dx = x + y does not separate; dy/dx = xy does.</p>"}, "diagram": "d2_separable", "examples": ["de8"], "syllabus_item": "4.2"}, {"h": {"en": "3.2 Worked examples with powers"}, "body": {"en": "<h4>Example 1</h4><p>dy/dx = x²/y: separate to y dy = x² dx, integrate to y²/2 = x³/3 + c, so <b>y² = 2x³/3 + c</b>.</p><h4>Example 2</h4><p>dy/dx = y/x: separate to dy/y = dx/x, integrate to log|y| = log|x| + c = log|x| + log C, so <b>y = Cx</b> - straight lines through the origin.</p><h4>Why log C instead of c</h4><p>Writing the constant as log C lets the logs combine into a single logarithm, which then removes the log altogether. It is a legal step because C is still arbitrary.</p><h4>Common mistake</h4><p>Leaving the answer as log y = log x + c when a clean closed form is asked for. Exponentiate at the end.</p>"}, "examples": ["de9", "de12"], "syllabus_item": "4.2"}, {"h": {"en": "3.3 Exponential and logarithmic forms"}, "body": {"en": "<h4>Example 1</h4><p>dy/dx = 2xy: dy/y = 2x dx, so log|y| = x² + c and <b>y = C e^(x²)</b>.</p><h4>Example 2</h4><p>dy/dx = e^(x+y): the right side is eˣ eʸ, so e^(−y) dy = eˣ dx. Integrating, −e^(−y) = eˣ + c.</p><h4>Reading the result</h4><p>The same idea handles dy/dx = e^(x−y) (write eˣ/eʸ and cross-multiply) and dy/dx = aˣ y, so do not memorise cases - factor, then split.</p><h4>Common mistake</h4><p>Treating e^(x+y) as e^x + e^y. The exponent law is a product, and only a product separates.</p>"}, "examples": ["de13", "de11"], "syllabus_item": "4.2"}, {"h": {"en": "3.4 Trigonometric and rational forms"}, "body": {"en": "<h4>Example 1</h4><p>dy/dx = (1 + y²)/(1 + x²): dy/(1 + y²) = dx/(1 + x²), so <b>tan⁻¹y = tan⁻¹x + c</b>.</p><h4>Example 2</h4><p>dy/dx = x(y² + 1): dy/(1 + y²) = x dx, so tan⁻¹y = x²/2 + c. With y(0) = 1, c = tan⁻¹1 = π/4, giving y = tan(x²/2 + π/4).</p><h4>Recognising the standard integrals</h4><p>These answers use ∫ dy/(1 + y²) = tan⁻¹y and ∫ dy/y = log|y|. Both are standard forms from the integration table, so the separable step usually reduces a DE to a table integral.</p><h4>Common mistake</h4><p>Forgetting the inverse tangent is in radians when a numerical value is substituted.</p>"}, "examples": ["de10", "de15"], "syllabus_item": "4.2"}]}, {"title": {"en": "4. Initial Conditions and Applications"}, "items": [{"h": {"en": "4.1 Fixing the constant with an initial condition"}, "body": {"en": "<h4>Method</h4><ol><li>Solve the DE to get the general solution with c.</li><li>Put x = 0 and y = y₀ (or the given pair) into the general solution.</li><li>Solve for c and write the particular solution.</li></ol><h4>Worked example</h4><p>Solve dy/dx = y cos x with y(0) = 1. Separating: log y = sin x + c, so y = C e^(sin x). At x = 0, 1 = C e⁰ = C, hence <b>y = e^(sin x)</b>.</p><h4>Check</h4><p>Differentiating gives y cos x, and y(0) = e⁰ = 1, so both the DE and the condition hold.</p><h4>Common mistake</h4><p>Substituting the condition before integrating. The constant exists only after the integration step.</p>"}, "examples": ["de14"], "syllabus_item": "4.2"}, {"h": {"en": "4.2 Growth and decay"}, "body": {"en": "<h4>The model</h4><p>When a quantity changes at a rate proportional to itself, dy/dt = k y, the solution is <b>y = y₀ e^(kt)</b>. Positive k is growth, negative k is decay.</p><h4>Doubling time</h4><p>For growth, y = 2y₀ when e^(kt) = 2, that is t = log 2/k. So k = log 2/(doubling time); for a doubling time of 5 hours, k = log 2/5 ≈ 0.1386 per hour.</p><h4>Halving time</h4><p>For decay, e^(kt) = 1/2 gives t = log 2/|k| - the same number, a useful symmetry.</p><h4>Reading the units</h4><p>k carries 'per hour' or 'per second', so kt is dimensionless. If kt were not dimensionless the exponential would be meaningless, which is a quick way to catch a units slip.</p>"}, "examples": ["de16"], "syllabus_item": "4.2"}, {"h": {"en": "4.3 Newton's law of cooling"}, "body": {"en": "<h4>The law</h4><p>The rate of cooling is proportional to the difference between the body and its surroundings: dT/dt = −k (T − T₀), where T₀ is the room temperature.</p><h4>The solution</h4><p>Separating and integrating gives <b>T = T₀ + (T(0) − T₀) e^(−kt)</b>. The temperature starts at T(0) and settles towards T₀ as t grows.</p><h4>Worked example</h4><p>A body at 100 °C cools in a room at 20 °C, and reaches 60 °C after 10 minutes. Then 60 = 20 + 80 e^(−10k), so e^(−10k) = 0.5 and <b>k = log 2/10 ≈ 0.0693 per minute</b>.</p><h4>Common mistake</h4><p>Using T instead of (T − T₀) on the right. The body cools towards the room, not towards zero.</p>"}, "examples": ["de17"], "syllabus_item": "4.2"}]}, {"title": {"en": "5. First-Order Linear Equations"}, "items": [{"h": {"en": "5.1 The standard form"}, "body": {"en": "<h4>Definition</h4><p>A first-order DE is <b>linear</b> when it can be written as <b>dy/dx + P(x) y = Q(x)</b>, where P and Q depend on x only. Both y and dy/dx appear to the first power, and there is no y², no √y and no y·(dy/dx).</p><h4>Getting to the standard form</h4><p>Divide through by the coefficient of dy/dx first. From x dy/dx + 2y = x², division by x gives dy/dx + (2/x) y = x, so P = 2/x and Q = x.</p><h4>Two checks</h4><ul><li>Is y to the power 1 only? If not, the equation is not linear.</li><li>Is Q free of y? If y appears in Q, it is not in standard form yet.</li></ul><h4>Common mistake</h4><p>Reading P as the coefficient of y before dividing by the coefficient of dy/dx. Never skip the division.</p>"}, "syllabus_item": "4.3"}, {"h": {"en": "5.2 The integrating factor"}, "body": {"en": "<h4>Rule</h4><p>Multiply the standard form by <b>IF = e^(∫P dx)</b>. The left side then collapses into d/dx (y · IF), so the equation becomes d/dx (y · IF) = Q · IF.</p><h4>Then integrate</h4><p><b>y · IF = ∫ Q · IF dx + c</b>, and finally y = (∫ Q·IF dx + c)/IF.</p><h4>Why it works</h4><p>d/dx (y e^(∫P dx)) = e^(∫P dx)(dy/dx + P y), which is exactly the left side times the IF. The factor is built to make the product rule run backwards.</p><h4>Common mistake</h4><p>Applying the IF to only one side, or forgetting to divide by the IF at the end. The IF multiplies the whole equation and must be removed before the answer is stated.</p>"}, "diagram": "d3_linear", "syllabus_item": "4.3"}, {"h": {"en": "5.3 First worked examples"}, "body": {"en": "<h4>Example 1</h4><p>dy/dx + 2y = 4. Here P = 2, so IF = e^(2x), and (y e^(2x))′ = 4 e^(2x). Integrating, y e^(2x) = 2 e^(2x) + c, so <b>y = 2 + c e^(−2x)</b>.</p><h4>Example 2</h4><p>dy/dx + y = eˣ. IF = eˣ, so (y eˣ)′ = e^(2x) and y eˣ = e^(2x)/2 + c, giving <b>y = eˣ/2 + c e^(−x)</b>.</p><h4>Reading the answer</h4><p>The term with e^(−x) dies away as x grows; it is the transient part, while 2 or eˣ/2 is the steady part. Engineering answers often split this way.</p><h4>Common mistake</h4><p>Quoting IF = e^(∫P dx) and then never multiplying Q by it. Both sides need the factor.</p>"}, "examples": ["de18", "de19"], "syllabus_item": "4.3"}, {"h": {"en": "5.4 When P is not a constant"}, "body": {"en": "<h4>Worked example</h4><p>Solve x dy/dx + 2y = x². Divide by x: dy/dx + (2/x) y = x, so P = 2/x and ∫P dx = 2 log x = log x². Hence IF = e^(log x²) = x².</p><h4>Finish it</h4><p>(y x²)′ = x² · x = x³, so y x² = x⁴/4 + c and <b>y = x²/4 + c/x²</b>.</p><h4>Two habits that save time</h4><ul><li>Simplify e^(log f) to f at once - do not leave it as an exponential.</li><li>The IF is never unique; the simplest form is the right one.</li></ul><h4>Common mistake</h4><p>Writing IF = e^(2 log x) and leaving it. It is x², and using the simplified form is what makes the integration possible.</p>"}, "examples": ["de20"], "syllabus_item": "4.3"}]}, {"title": {"en": "6. Linear Equations in Other Shapes"}, "items": [{"h": {"en": "6.1 When P is tan x or sec x"}, "body": {"en": "<h4>Worked example</h4><p>Solve dy/dx + y tan x = sec x. Here P = tan x and ∫tan x dx = log|sec x|, so <b>IF = sec x</b>.</p><h4>Finish it</h4><p>(y sec x)′ = sec x · sec x = sec²x, so y sec x = tan x + c and <b>y = sin x + c cos x</b>.</p><h4>The two integrals to remember</h4><p>∫tan x dx = log|sec x| and ∫sec²x dx = tan x. With these, every tangent-type question becomes routine.</p><h4>Common mistake</h4><p>Integrating tan x as log|tan x|. Differentiate log|sec x| to convince yourself: sec x tan x / sec x = tan x.</p>"}, "examples": ["de21"], "syllabus_item": "4.3"}, {"h": {"en": "6.2 Using x as the dependent variable"}, "body": {"en": "<h4>When y cannot be the subject</h4><p>If the equation is linear in x rather than in y, treat x as the unknown: <b>dx/dy + P(y) x = Q(y)</b>. The method is identical, with y as the independent variable.</p><h4>Worked example</h4><p>dx/dy + x = y: P = 1, so IF = eʸ and (x eʸ)′ = y eʸ. Since ∫y eʸ dy = eʸ(y − 1), x eʸ = eʸ(y − 1) + c and <b>x = y − 1 + c e^(−y)</b>.</p><h4>How to spot it</h4><p>The equation is linear in x when x appears only to the first power and dy/dx appears as dx/dy. Rewrite it with dx/dy and check.</p><h4>Common mistake</h4><p>Trying to force such an equation into dy/dx + Py = Q, where it does not fit, instead of swapping the roles.</p>"}, "examples": ["de22"], "syllabus_item": "4.3"}, {"h": {"en": "6.3 Choosing between the two methods"}, "body": {"en": "<h4>Order of checks</h4><ol><li>Can the right side be factorised into (x part) × (y part)? Then separate.</li><li>If not, is the equation linear in y? Then bring it to dy/dx + Py = Q and use the IF.</li><li>If neither holds, it is outside this syllabus - do not invent a method.</li></ol><h4>Examples of the decision</h4><table><tr><th>Equation</th><th>Method</th></tr><tr><td>dy/dx = x y²</td><td>separable</td></tr><tr><td>dy/dx = x + y</td><td>neither (not separable, not linear)</td></tr><tr><td>dy/dx + 2y = eˣ</td><td>linear, IF = e^(2x)</td></tr><tr><td>dy/dx = (x + 1)/y</td><td>separable</td></tr></table><h4>A common confusion</h4><p>dy/dx = xy is separable and also linear, so either method works and both give y = C e^(x²/2). When both apply, choose the easier one.</p><h4>Common mistake</h4><p>Calling dy/dx = x + y separable because it is a sum. A sum does not factor.</p>"}, "diagram": "d4_choice", "syllabus_item": "4.3"}, {"h": {"en": "6.4 Common mistakes in this unit"}, "body": {"en": "<h4>Six errors to avoid</h4><ol><li>Forgetting to divide by the coefficient of dy/dx before reading P.</li><li>Using e^(∫P dx) without simplifying, e.g. leaving e^(2 log x) instead of x².</li><li>Losing the constant c, or adding two of them when one is enough.</li><li>Substituting the initial condition before integrating.</li><li>Writing the IF on one side only.</li><li>Not stating the final answer for y (or x) explicitly.</li></ol><h4>How to self-check</h4><p>Substitute your y back into the original equation and simplify. If the two sides agree identically, the solution is right.</p><h4>Marking pattern</h4><p>Most schemes give marks for the standard form, the IF, the integration and the final answer separately, so show all four lines even if the arithmetic is rushed.</p>"}, "syllabus_item": "4.3"}]}, {"title": {"en": "7. Exam Routine and Checks"}, "items": [{"h": {"en": "7.1 Five lines that earn the method marks"}, "body": {"en": "<h4>For a separable equation</h4><ol><li>Write dy/dx = f(x) g(y) and state that it is separable.</li><li>Separate: dy/g(y) = f(x) dx.</li><li>Integrate both sides and add c.</li><li>Apply the initial condition if one is given.</li><li>State y explicitly and check by differentiating.</li></ol><h4>For a linear equation</h4><ol><li>Bring it to dy/dx + Py = Q and name P and Q.</li><li>Write IF = e^(∫P dx) and simplify it.</li><li>Multiply through and write d/dx (y·IF) = Q·IF.</li><li>Integrate, add c, then divide by the IF.</li></ol><h4>Time and marks</h4><p>The IF and the standard form together usually carry about half the marks, so write them down even if the integration is incomplete.</p>"}, "syllabus_item": "4.3"}, {"h": {"en": "7.2 Checking a solution properly"}, "body": {"en": "<h4>Three-part check</h4><ol><li>Differentiate your answer and substitute into the original equation.</li><li>Check the initial condition, if one was given.</li><li>Check the algebra of the constant - a wrong c passes the first test but fails the second.</li></ol><h4>Example</h4><p>For dy/dx + 2y = 4, the answer y = 2 + c e^(−2x) gives y′ = −2c e^(−2x), so y′ + 2y = −2c e^(−2x) + 4 + 2c e^(−2x) = 4. Correct for every c.</p><h4>Reading an answer graphically</h4><p>A solution curve must have the slope the DE prescribes at every point: on the family y = c e^(−x) the slope is always −y, which matches dy/dx = −y.</p><details class=\"self-check\"><summary>Is a wrong constant c an error if the DE is satisfied?</summary><p>Yes - the DE alone does not fix c, so an initial-condition question is only finished when c is right.</p></details>"}, "syllabus_item": "4.3"}, {"h": {"en": "7.3 Summary of the two methods"}, "body": {"en": "<h4>Side by side</h4><table><tr><th></th><th>Variable separable</th><th>Linear (IF)</th></tr><tr><td>Form</td><td>dy/dx = f(x) g(y)</td><td>dy/dx + P y = Q</td></tr><tr><td>Step</td><td>split and integrate</td><td>multiply by e^(∫P dx)</td></tr><tr><td>Work</td><td>two standard integrals</td><td>one product integration</td></tr><tr><td>Answer</td><td>implicit is often fine</td><td>state y explicitly</td></tr></table><h4>Where each appears</h4><p>Cooling, growth and decay, and many rate laws are separable. Circuits, mixing with a steady inflow and any equation with a free y term are usually linear.</p><h4>What the syllabus asks</h4><p>Only these two methods, first order and first degree. Anything of second degree or second order is outside DI02000021 Unit 4 and should not appear in an answer.</p>"}, "syllabus_item": "4.3"}]}, {"title": {"en": "8. Practice Questions with Model Answers"}, "items": [{"h": {"en": "Practice 1. Find the order and degree of d²y/dx² + 5 dy/dx + 6y = 0."}, "body": {"en": "<p>The highest derivative is d²y/dx², so the order is 2.</p><p>It appears to the first power and the equation has no radicals, so the degree is 1.</p><p>Answer: order 2, degree 1 - a second-order linear equation with constant coefficients.</p>"}}, {"h": {"en": "Practice 2. Find the order and degree of (dy/dx)⁴ + y³ = x."}, "body": {"en": "<p>Only dy/dx appears, so the order is 1.</p><p>It is raised to the fourth power, so the degree is 4.</p><p>Answer: order 1, degree 4. The y³ does not affect the degree, which counts only the derivative.</p>"}}, {"h": {"en": "Practice 3. Verify that y = x² satisfies dy/dx = 2y/x."}, "body": {"en": "<p>Differentiate: dy/dx = 2x.</p><p>Right side: 2y/x = 2x²/x = 2x.</p><p>The two sides are equal for every x ≠ 0, so y = x² is a solution; the general solution of the equation is y = cx².</p>"}}, {"h": {"en": "Practice 4. Form the differential equation from y = c e^(3x)."}, "body": {"en": "<p>One constant means one differentiation: y′ = 3c e^(3x).</p><p>Replace c e^(3x) by y: y′ = 3y.</p><p>The answer is y′ − 3y = 0, a first-order equation with no arbitrary constant left.</p>"}}, {"h": {"en": "Practice 5. Solve dy/dx = x/y given y(0) = 3."}, "body": {"en": "<p>Separate: y dy = x dx, then integrate to y²/2 = x²/2 + c₁, that is y² = x² + c.</p><p>Apply y(0) = 3: 9 = 0 + c, so c = 9.</p><p>The particular solution is y² = x² + 9, or y = √(x² + 9) for the branch through (0, 3).</p>"}}, {"h": {"en": "Practice 6. Solve dy/dx = y/x."}, "body": {"en": "<p>Separate: dy/y = dx/x, then integrate to log|y| = log|x| + c.</p><p>Write c = log C and combine: log|y| = log|Cx|, so y = Cx.</p><p>The solution is the family of straight lines through the origin, confirmed by substituting back: dy/dx = C = y/x.</p>"}}, {"h": {"en": "Practice 7. Solve dy/dx = (1 + y²)/(1 + x²)."}, "body": {"en": "<p>Separate: dy/(1 + y²) = dx/(1 + x²).</p><p>Both sides are standard tangent-inverse integrals, so tan⁻¹y = tan⁻¹x + c.</p><p>The answer may be left in this implicit form, or written as y = tan(tan⁻¹x + c) using the tangent addition formula.</p>"}}, {"h": {"en": "Practice 8. Solve dy/dx = y cos x given y(0) = 2."}, "body": {"en": "<p>Separate: dy/y = cos x dx and integrate: log|y| = sin x + c, so y = C e^(sin x).</p><p>Apply y(0) = 2: 2 = C e⁰, so C = 2.</p><p>The particular solution is y = 2 e^(sin x). Differentiating gives 2 e^(sin x) cos x = y cos x, which matches the equation.</p>"}}, {"h": {"en": "Practice 9. Solve dy/dx + 3y = 6."}, "body": {"en": "<p>The equation is linear with P = 3 and Q = 6, so IF = e^(3x).</p><p>Multiplying: d/dx (y e^(3x)) = 6 e^(3x), so y e^(3x) = 2 e^(3x) + c.</p><p>Divide by the integrating factor: y = 2 + c e^(−3x), the constant term 2 being the steady state.</p>"}}, {"h": {"en": "Practice 10. Solve dy/dx + y/x = x²."}, "body": {"en": "<p>Here P = 1/x, so ∫P dx = log x and IF = x.</p><p>Multiplying: d/dx (y x) = x³, so y x = x⁴/4 + c.</p><p>Divide by x: y = x³/4 + c/x. Substituting back checks both terms.</p>"}}, {"h": {"en": "Practice 11. Solve x dy/dx − y = x³."}, "body": {"en": "<p>Divide by x: dy/dx − (1/x) y = x², so P = −1/x and Q = x².</p><p>∫P dx = −log x, so IF = 1/x.</p><p>Multiplying: d/dx (y/x) = x, hence y/x = x²/2 + c.</p><p>The answer is y = x³/2 + cx.</p>"}}, {"h": {"en": "Practice 12. Solve dy/dx + 2xy = 2x."}, "body": {"en": "<p>P = 2x, so ∫P dx = x² and IF = e^(x²).</p><p>Multiplying: d/dx (y e^(x²)) = 2x e^(x²), which integrates to y e^(x²) = e^(x²) + c.</p><p>Divide by the IF: y = 1 + c e^(−x²). As x grows the second term vanishes, so y tends to 1.</p>"}}, {"h": {"en": "Practice 13. A body at 90 °C is placed in a room at 30 °C and cools to 70 °C in 5 minutes. Find T(t)."}, "body": {"en": "<p>The law dT/dt = −k(T − 30) separates to dT/(T − 30) = −k dt, giving T = 30 + A e^(−kt).</p><p>At t = 0, T = 90, so A = 60 and T = 30 + 60 e^(−kt).</p><p>Use T(5) = 70: 40 = 60 e^(−5k), so e^(−5k) = 2/3 and k = log(1.5)/5 ≈ 0.0811 per minute.</p><p>The temperature is T = 30 + 60 e^(−0.0811 t) °C, tending to the room value 30 °C.</p>"}}, {"h": {"en": "Practice 14. Bacteria in a culture double every 3 hours, starting from 1000. Find N(t) and the count at 9 h."}, "body": {"en": "<p>Growth at a rate proportional to the number gives N = N₀ e^(kt) with N₀ = 1000.</p><p>Doubling in 3 h means e^(3k) = 2, so k = log 2/3 ≈ 0.231.</p><p>Hence N = 1000 e^(0.231 t), or more neatly N = 1000 × 2^(t/3).</p><p>At t = 9 h the count is 1000 × 2³ = 8000, three doublings.</p>"}}, {"h": {"en": "Practice 15. Solve dx/dy + 2x = y, treating x as the unknown."}, "body": {"en": "<p>With y as the independent variable, P = 2 and Q = y, so IF = e^(2y).</p><p>Multiplying: d/dy (x e^(2y)) = y e^(2y).</p><p>Integrating by parts, ∫y e^(2y) dy = e^(2y)(y/2 − 1/4).</p><p>So x e^(2y) = e^(2y)(y/2 − 1/4) + c and x = y/2 − 1/4 + c e^(−2y).</p>"}}]}], "diagrams": [{"id": "d1_order", "title": {"en": "Order and degree of a DE"}, "file": "diagrams/d1_order.svg"}, {"id": "d2_separable", "title": {"en": "Variable separable: split x from y"}, "file": "diagrams/d2_separable.svg"}, {"id": "d3_linear", "title": {"en": "Linear DE and the integrating factor"}, "file": "diagrams/d3_linear.svg"}, {"id": "d4_choice", "title": {"en": "Separable or linear?"}, "file": "diagrams/d4_choice.svg"}, {"id": "d5_family", "title": {"en": "One family, many solutions"}, "file": "diagrams/d5_family.svg"}], "equations": [{"title": {"en": "Definitions"}, "items": [{"terms": {"en": "Order"}, "a": {"en": "the order of the highest derivative in the equation"}}, {"terms": {"en": "Degree"}, "a": {"en": "the power of the highest derivative, after clearing radicals"}}, {"terms": {"en": "General solution"}, "a": {"en": "contains one arbitrary constant for a first-order DE"}}, {"terms": {"en": "Particular solution"}, "a": {"en": "the general solution with c fixed by a condition"}}, {"terms": {"en": "Linear standard form"}, "a": {"en": "dy/dx + P(x) y = Q(x)"}}, {"terms": {"en": "Separable form"}, "a": {"en": "dy/dx = f(x) · g(y)"}}]}, {"title": {"en": "Methods"}, "items": [{"terms": {"en": "Separation"}, "a": {"en": "dy/g(y) = f(x) dx, then integrate both sides"}}, {"terms": {"en": "Integrating factor"}, "a": {"en": "IF = e^(∫P dx)"}}, {"terms": {"en": "After multiplying"}, "a": {"en": "d/dx (y · IF) = Q · IF"}}, {"terms": {"en": "Solution of a linear DE"}, "a": {"en": "y · IF = ∫ Q · IF dx + c"}}, {"terms": {"en": "Linear in x"}, "a": {"en": "dx/dy + P(y) x = Q(y), same IF method"}}, {"terms": {"en": "Log form of the constant"}, "a": {"en": "c = log C, so that logs combine"}}]}, {"title": {"en": "Models and results"}, "items": [{"terms": {"en": "Growth and decay"}, "a": {"en": "dy/dt = k y  →  y = y₀ e^(kt)"}}, {"terms": {"en": "Doubling time"}, "a": {"en": "t = log 2 / k"}}, {"terms": {"en": "Newton's law of cooling"}, "a": {"en": "dT/dt = −k(T − T₀)  →  T = T₀ + (T(0) − T₀) e^(−kt)"}}, {"terms": {"en": "∫ tan x dx"}, "a": {"en": "log|sec x| + c"}}, {"terms": {"en": "∫ sec²x dx"}, "a": {"en": "tan x + c"}}, {"terms": {"en": "∫ dy/(1 + y²)"}, "a": {"en": "tan⁻¹y + c"}}]}], "numericals": [{"id": "de1", "q": {"en": "Find the order and degree of d²y/dx² + 3(dy/dx)² = x."}, "a": {"en": "<p>The highest derivative present is d²y/dx², so the order is 2.</p><p>The degree is the power of that highest derivative once the equation is free of radicals and fractions, which gives degree 1.</p><p>The square on dy/dx is a lower derivative and does not affect the degree.</p>"}}, {"id": "de2", "q": {"en": "Find the order and degree of (dy/dx)³ + y = x²."}, "a": {"en": "<p>Only the first derivative appears, so the order is 1.</p><p>It is raised to the power 3, so the degree is 3.</p><p>Answer: order 1, degree 3.</p>"}}, {"id": "de3", "q": {"en": "Find the order and degree of d³y/dx³ + x(dy/dx)⁵ = 0."}, "a": {"en": "<p>The highest derivative is d³y/dx³, so the order is 3.</p><p>Its power is 1, so the degree is 1 - the fifth power belongs to dy/dx, a lower derivative.</p><p>Answer: order 3, degree 1.</p>"}}, {"id": "de4", "q": {"en": "Show that y = e^(2x) is a solution of dy/dx − 2y = 0."}, "a": {"en": "<p>Differentiate: dy/dx = 2e^(2x).</p><p>Substitute: dy/dx − 2y = 2e^(2x) − 2e^(2x) = 0.</p><p>The equation holds for every x, so y = e^(2x) is a solution. Note the more general solution is y = c e^(2x).</p>"}}, {"id": "de5", "q": {"en": "Show that y = A cos x + B sin x satisfies d²y/dx² + y = 0."}, "a": {"en": "<p>First derivative: y′ = −A sin x + B cos x.</p><p>Second derivative: y″ = −A cos x − B sin x = −y.</p><p>So y″ + y = −y + y = 0 for every x and for every choice of A and B. The two constants match the second order of the equation.</p>"}}, {"id": "de6", "q": {"en": "Form the differential equation from y = cx² by eliminating c."}, "a": {"en": "<p>Differentiate once (one constant, one differentiation): y′ = 2cx.</p><p>Eliminate c: from the original, c = y/x², so y′ = 2(y/x²)x = 2y/x.</p><p>Clearing the fraction gives x y′ − 2y = 0, which contains no c.</p>"}}, {"id": "de7", "q": {"en": "Form the differential equation from y = a e^(2x)."}, "a": {"en": "<p>Differentiate: y′ = 2a e^(2x).</p><p>But a e^(2x) is y itself, so y′ = 2y.</p><p>The constant disappears in the differentiation: the answer is y′ − 2y = 0, a first-order equation as expected from one constant.</p>"}}, {"id": "de8", "q": {"en": "Solve dy/dx = x/y."}, "a": {"en": "<p>The right side is a product of an x-part and a y-part, so the equation is separable.</p><p>Separate: y dy = x dx.</p><p>Integrate: y²/2 = x²/2 + c₁, that is y² = x² + c after multiplying by 2.</p><p>The answer is the family of hyperbolas y² − x² = c.</p>"}}, {"id": "de9", "q": {"en": "Solve dy/dx = x²/y."}, "a": {"en": "<p>Separate: y dy = x² dx.</p><p>Integrate: y²/2 = x³/3 + c₁.</p><p>Multiply by 2: y² = 2x³/3 + c, which is the general solution; y can be made explicit as y = ±√(2x³/3 + c).</p>"}}, {"id": "de10", "q": {"en": "Solve dy/dx = (1 + y²)/(1 + x²)."}, "a": {"en": "<p>Separate: dy/(1 + y²) = dx/(1 + x²).</p><p>Both sides are standard integrals giving tan⁻¹.</p><p>So tan⁻¹y = tan⁻¹x + c, or tan⁻¹y − tan⁻¹x = c. Taking tangents gives y explicitly if needed.</p>"}}, {"id": "de11", "q": {"en": "Solve dy/dx = 2xy."}, "a": {"en": "<p>Separate: dy/y = 2x dx.</p><p>Integrate: log|y| = x² + c.</p><p>Exponentiate: y = C e^(x²), with C = e^c, the general solution - a family of curves with the same bell-shaped slope pattern.</p>"}}, {"id": "de12", "q": {"en": "Solve dy/dx = y/x."}, "a": {"en": "<p>Separate: dy/y = dx/x.</p><p>Integrate: log|y| = log|x| + c.</p><p>Write c = log C and combine the logs: log|y| = log|Cx|, so y = Cx - the straight lines through the origin.</p>"}}, {"id": "de13", "q": {"en": "Solve dy/dx = e^(x+y)."}, "a": {"en": "<p>Write the right side as a product: e^(x+y) = eˣ · eʸ.</p><p>Separate: e^(−y) dy = eˣ dx.</p><p>Integrate: −e^(−y) = eˣ + c.</p><p>Rearrange if an explicit y is wanted: e^(−y) = −eˣ − c, so y = −log(−eˣ − c).</p>"}}, {"id": "de14", "q": {"en": "Solve dy/dx = y cos x given y(0) = 1."}, "a": {"en": "<p>Separate: dy/y = cos x dx.</p><p>Integrate: log|y| = sin x + c, so y = C e^(sin x).</p><p>Apply y(0) = 1: 1 = C e⁰ = C.</p><p>The particular solution is y = e^(sin x), which is positive for every x.</p>"}}, {"id": "de15", "q": {"en": "Solve dy/dx = x(y² + 1) given y(0) = 1."}, "a": {"en": "<p>Separate: dy/(1 + y²) = x dx.</p><p>Integrate: tan⁻¹y = x²/2 + c.</p><p>Apply y(0) = 1: tan⁻¹1 = π/4, so c = π/4.</p><p>The solution is tan⁻¹y = x²/2 + π/4, that is y = tan(x²/2 + π/4).</p>"}}, {"id": "de16", "q": {"en": "A quantity grows at a rate proportional to itself and doubles in 5 hours. Find y(t)."}, "a": {"en": "<p>The model is dy/dt = ky with y(0) = y₀, whose solution is y = y₀ e^(kt).</p><p>Doubling means e^(5k) = 2, so k = log 2/5 ≈ 0.1386 per hour.</p><p>Hence y = y₀ e^(0.1386 t), or equivalently y = y₀ 2^(t/5) - the form many data questions expect.</p>"}}, {"id": "de17", "q": {"en": "A body at 100 °C cools in a room at 20 °C and reaches 60 °C in 10 minutes. Find T(t)."}, "a": {"en": "<p>Newton's law: dT/dt = −k(T − 20), which separates to dT/(T − 20) = −k dt.</p><p>Integrating: log(T − 20) = −kt + c, so T = 20 + A e^(−kt) with A = T(0) − 20 = 80.</p><p>Use T(10) = 60: 40 = 80 e^(−10k), so e^(−10k) = 0.5 and k = log 2/10 ≈ 0.0693 per minute.</p><p>Answer: T = 20 + 80 e^(−0.0693 t) °C, which settles towards the room temperature of 20 °C.</p>"}}, {"id": "de18", "q": {"en": "Solve dy/dx + 2y = 4."}, "a": {"en": "<p>The equation is linear with P = 2 and Q = 4, so the integrating factor is e^(2x).</p><p>Multiplying: d/dx (y e^(2x)) = 4 e^(2x).</p><p>Integrate: y e^(2x) = 2 e^(2x) + c.</p><p>Divide by the IF: y = 2 + c e^(−2x). The constant term 2 is the steady state.</p>"}}, {"id": "de19", "q": {"en": "Solve dy/dx + y = eˣ."}, "a": {"en": "<p>Here P = 1 and Q = eˣ, so IF = e^(∫1 dx) = eˣ.</p><p>Multiplying: d/dx (y eˣ) = eˣ · eˣ = e^(2x).</p><p>Integrate: y eˣ = e^(2x)/2 + c.</p><p>Divide by eˣ: y = eˣ/2 + c e^(−x). The first term is the steady part and the second the transient that dies away.</p>"}}, {"id": "de20", "q": {"en": "Solve x dy/dx + 2y = x²."}, "a": {"en": "<p>Divide by x first: dy/dx + (2/x) y = x, so P = 2/x and Q = x.</p><p>∫P dx = 2 log x = log x², hence IF = x².</p><p>Multiplying: d/dx (y x²) = x³.</p><p>Integrate: y x² = x⁴/4 + c, so y = x²/4 + c/x².</p>"}}, {"id": "de21", "q": {"en": "Solve dy/dx + y tan x = sec x."}, "a": {"en": "<p>P = tan x, and ∫tan x dx = log|sec x|, so IF = sec x.</p><p>Multiplying: d/dx (y sec x) = sec x · sec x = sec²x.</p><p>Integrate: y sec x = tan x + c.</p><p>Divide by sec x, i.e. multiply by cos x: y = sin x + c cos x.</p>"}}, {"id": "de22", "q": {"en": "Solve dx/dy + x = y by treating x as the unknown."}, "a": {"en": "<p>The equation is linear in x with y as the independent variable: P = 1 and Q = y.</p><p>IF = e^(∫1 dy) = eʸ, so d/dy (x eʸ) = y eʸ.</p><p>Integrate by parts: ∫y eʸ dy = eʸ(y − 1).</p><p>So x eʸ = eʸ(y − 1) + c and x = y − 1 + c e^(−y).</p>"}}], "viva": [{"title": {"en": "Definitions"}, "items": [{"q": {"en": "What is a differential equation?"}, "a": {"en": "An equation containing derivatives of an unknown function; solving it gives the function, not a number."}}, {"q": {"en": "How do you find the order of a DE?"}, "a": {"en": "Look at the highest derivative present: dy/dx means first order, d²y/dx² means second order."}}, {"q": {"en": "How do you find the degree?"}, "a": {"en": "Raise the question of the power of the highest derivative after the equation is cleared of fractions and radicals in the derivatives."}}, {"q": {"en": "What is the difference between a general and a particular solution?"}, "a": {"en": "The general solution keeps the arbitrary constant; a particular solution has c fixed by an initial or boundary condition."}}, {"q": {"en": "How many arbitrary constants does a first-order DE have?"}, "a": {"en": "Exactly one, because one integration is performed."}}, {"q": {"en": "When is a first-order DE called linear?"}, "a": {"en": "When it can be written as dy/dx + P(x) y = Q(x), with y and dy/dx only to the first power."}}]}, {"title": {"en": "Methods"}, "items": [{"q": {"en": "When can you use the variable separable method?"}, "a": {"en": "When the right-hand side factorises into a function of x times a function of y."}}, {"q": {"en": "Why is only one constant of integration kept?"}, "a": {"en": "Each side produces a constant, but they combine into a single arbitrary constant."}}, {"q": {"en": "What is an integrating factor?"}, "a": {"en": "e^(∫P dx): multiplying the standard form by it turns the left side into the single derivative d/dx (y · IF)."}}, {"q": {"en": "Why does the integrating factor work?"}, "a": {"en": "Because d/dx(y e^(∫P dx)) = e^(∫P dx)(dy/dx + Py), which is the left side multiplied by the IF - the product rule run backwards."}}, {"q": {"en": "What must be done before reading P and Q?"}, "a": {"en": "Divide the whole equation by the coefficient of dy/dx, so that dy/dx has coefficient 1."}}, {"q": {"en": "How do you solve dx/dy + x = y?"}, "a": {"en": "Treat x as the unknown and y as the independent variable; IF = eʸ, giving x = y − 1 + c e^(−y)."}}]}, {"title": {"en": "Applications and checks"}, "items": [{"q": {"en": "What is the model for growth or decay?"}, "a": {"en": "dy/dt = ky, giving y = y₀ e^(kt); k > 0 grows and k < 0 decays."}}, {"q": {"en": "State Newton's law of cooling."}, "a": {"en": "dT/dt = −k(T − T₀), so the body approaches the surrounding temperature exponentially."}}, {"q": {"en": "How do you find the doubling time?"}, "a": {"en": "Set y = 2y₀ in y = y₀ e^(kt): t = log 2/k."}}, {"q": {"en": "How do you check the solution of a DE?"}, "a": {"en": "Differentiate the answer, substitute into the original equation and confirm both sides agree; then check any initial condition."}}, {"q": {"en": "Give one engineering use of a first-order DE."}, "a": {"en": "An RC circuit charging follows dV/dt + V/(RC) = E/(RC), a linear first-order equation solved with an integrating factor."}}]}], "exam_questions": [{"q": {"en": "Practice: Find the order and degree of d²y/dx² + 5 dy/dx + 6y = 0."}, "marks": 3}, {"q": {"en": "Practice: Find the order and degree of (dy/dx)⁴ + y³ = x."}, "marks": 3}, {"q": {"en": "Practice: Verify that y = x² satisfies dy/dx = 2y/x."}, "marks": 3}, {"q": {"en": "Practice: Form the differential equation from y = c e^(3x)."}, "marks": 3}, {"q": {"en": "Practice: Solve dy/dx = x/y given y(0) = 3."}, "marks": 4}, {"q": {"en": "Practice: Solve dy/dx = y/x."}, "marks": 3}, {"q": {"en": "Practice: Solve dy/dx = (1 + y²)/(1 + x²)."}, "marks": 4}, {"q": {"en": "Practice: Solve dy/dx = y cos x given y(0) = 2."}, "marks": 4}, {"q": {"en": "Practice: Solve dy/dx + 3y = 6."}, "marks": 4}, {"q": {"en": "Practice: Solve dy/dx + y/x = x²."}, "marks": 4}, {"q": {"en": "Practice: Solve x dy/dx − y = x³."}, "marks": 4}, {"q": {"en": "Practice: Solve dy/dx + 2xy = 2x."}, "marks": 4}, {"q": {"en": "Practice: A body at 90 °C is placed in a room at 30 °C and cools to 70 °C in 5 minutes. Find T(t)."}, "marks": 4}, {"q": {"en": "Practice: Bacteria in a culture double every 3 hours, starting from 1000. Find N(t) and the count at 9 h."}, "marks": 4}, {"q": {"en": "Practice: Solve dx/dy + 2x = y, treating x as the unknown."}, "marks": 4}], "learning_outcomes": [{"en": "CO4: Develop the ability to apply differential equations to significant applied problems."}], "course_outcomes": ["CO4"], "practical_numbers": [], "content_kind": "theory", "lesson_count": 26, "answered_practice_count": 15, "assessment_note": {"en": "Official course: theory ESE 70 + PA 30 = 100 marks, 4 credits, 45 teaching hours; this unit carries 20 % weightage and about 14 of the 70 theory marks. Practice-question marks (3/4) are suggested revision sizes, not official GTU allocations or a guaranteed paper pattern. Model answers are in Notes section 8."}, "question_provenance": "Original answered revision questions; not official past papers", "question_marks_are_suggested": true, "sources": [{"title": "GTU DI02000021, Engineering Mathematics, Semester 2, BSC (uploaded syllabus)", "url": "https://syllabus.gtu.ac.in/"}, {"title": "Khan Academy - differential equations: separable and first-order linear", "url": "https://www.khanacademy.org/math/differential-equations"}, {"title": "OpenStax - Calculus Volume 2, chapter 4 (Differential Equations)", "url": "https://openstax.org/details/books/calculus-volume-2"}, {"title": "MIT OCW 18.03 - solving first-order linear equations", "url": "https://ocw.mit.edu/courses/18-03-differential-equations-spring-2010/"}, {"title": "B. S. Grewal - Elementary Engineering Mathematics (Khanna Publishers)", "url": "https://www.khannapublishers.in/"}]};
const SVG = {"d1_order": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 378\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"378\" fill=\"#ffffff\"/><text x=\"180\" y=\"28.9\" font-size=\"14\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">Order and degree of a DE</text><text x=\"180\" y=\"49.6\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">read the equation before you try to solve it</text><text x=\"180\" y=\"82.5\" font-size=\"13\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">d²y/dx²  +  3 (dy/dx)²  =  x</text><rect x=\"20.0\" y=\"100.0\" width=\"320\" height=\"24\" rx=\"7\" fill=\"#EAF3FD\" stroke=\"#1565C0\" stroke-width=\"1.6\"/><text x=\"180\" y=\"115.5\" font-size=\"10.0\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">order = 2 : the highest derivative that appears</text><rect x=\"20.0\" y=\"134.0\" width=\"320\" height=\"24\" rx=\"7\" fill=\"#EAF6EC\" stroke=\"#2E7D32\" stroke-width=\"1.6\"/><text x=\"180\" y=\"149.5\" font-size=\"10.0\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">degree = 1 : the power of that highest derivative</text><rect x=\"20.0\" y=\"168.0\" width=\"320\" height=\"24\" rx=\"7\" fill=\"#FFF4DF\" stroke=\"#B66A00\" stroke-width=\"1.6\"/><text x=\"180\" y=\"183.5\" font-size=\"10.0\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">the (dy/dx)² does not change either of them</text><text x=\"180\" y=\"215.6\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">quick check</text><rect x=\"20.0\" y=\"228.0\" width=\"320\" height=\"24\" rx=\"7\" fill=\"#FDECF0\" stroke=\"#BD2543\" stroke-width=\"1.6\"/><text x=\"180\" y=\"243.4\" font-size=\"9.8\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">dy/dx + y = x    →    order 1, degree 1</text><rect x=\"20.0\" y=\"262.0\" width=\"320\" height=\"24\" rx=\"7\" fill=\"#FDECF0\" stroke=\"#BD2543\" stroke-width=\"1.6\"/><text x=\"180\" y=\"277.4\" font-size=\"9.8\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">(dy/dx)³ + y = x²    →    order 1, degree 3</text><rect x=\"20.0\" y=\"296.0\" width=\"320\" height=\"24\" rx=\"7\" fill=\"#FDECF0\" stroke=\"#BD2543\" stroke-width=\"1.6\"/><text x=\"180\" y=\"311.4\" font-size=\"9.8\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">d²y/dx² + y² = 0    →    order 2, degree 1</text><text x=\"180\" y=\"347.6\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">Order first, then degree.</text><text x=\"180\" y=\"363.6\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">Order counts derivatives; degree counts their powers.</text></svg>", "d2_separable": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 392\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"392\" fill=\"#ffffff\"/><text x=\"180\" y=\"28.9\" font-size=\"14\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">Variable separable: split x from y</text><text x=\"180\" y=\"49.6\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">works when the right side factors</text><rect x=\"15.0\" y=\"69.0\" width=\"330\" height=\"26\" rx=\"7\" fill=\"#EAF3FD\" stroke=\"#1565C0\" stroke-width=\"1.6\"/><text x=\"180\" y=\"85.8\" font-size=\"11.0\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">dy/dx = f(x) · g(y)</text><path d=\"M180 95 L180 117\" fill=\"none\" stroke=\"#666\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polygon points=\"180.0,117.0 183.5,110.0 176.5,110.0\" fill=\"#666\"/><rect x=\"15.0\" y=\"123.0\" width=\"330\" height=\"26\" rx=\"7\" fill=\"#EAF3FD\" stroke=\"#1565C0\" stroke-width=\"1.6\"/><text x=\"180\" y=\"139.6\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">divide by g(y) and multiply by dx</text><path d=\"M180 149 L180 171\" fill=\"none\" st const t = o => (o && typeof o === 'object') ? (o[S.lang] || o.en) : (o || '');
const chev = '<svg class="chev" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#7B2CD9" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
const dots = '<svg width="22" height="22" viewBox="0 0 24 24" fill="#222"><circle cx="12" cy="5" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="12" cy="19" r="2.2"/></svg>';
const fixTables = h => h.replace(/<table>/g,'<div class="tw"><table>').replace(/<\/table>/g,'</table></div>');
const head = (title, menu=true) => `<div class="sh"><span>${title}</span>${menu?`<button class="more" data-more>${dots}</button><div class="menu"><button data-act="expand">${L('expand')}</button><button data-act="collapse">${L('collapse')}</button></div>`:''}</div>`;
const dgInline = id => `<div class="dg" data-dg="${id}">${SVG[id]}</div><div class="dgc">📐 ${t(U.diagrams.find(d=>d.id===id).title)} · ${L('tapzoom')}</div>`;

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const KW = new Set('auto break case const continue default do else enum extern for goto if register return signed sizeof static struct switch typedef union unsigned volatile while'.split(' '));
const TY = new Set('int char float double void long short FILE size_t'.split(' '));
const PKW = new Set('False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield'.split(' '));
const PTY = new Set('int float str bool list tuple set dict complex frozenset bytes bytearray range object'.split(' '));
function hlPy(src){
  const re = /(#[^\n]*)|((?:\b[rRbBfFuU]{1,2})?(?:'{3}[\s\S]*?'{3}|"{3}[\s\S]*?"{3}|'(?:\\.|[^'\\\n])*'|"(?:\\.|[^"\\\n])*"))|(^>>>|^\.\.\.(?= ))|([A-Za-z_]\w*)(?=\s*\()|([A-Za-z_]\w*)|(\b(?:0[xXoObB][0-9a-fA-F_]+|\d[\d_]*(?:\.\d+)?(?:[eE][-+]?\d+)?j?)\b)/gm;
  let o='', last=0, m;
  while ((m = re.exec(src))){
    o += esc(src.slice(last, m.index)); last = re.lastIndex;
    const w = esc(m[0]);
    if (m[1]) o += `<span class="cm">${w}</span>`;
    else if (m[2]) o += `<span class="st">${w}</span>`;
    else if (m[3]) o += `<span class="pp">${w}</span>`;
    else if (m[4]) o += PKW.has(m[4]) ? `<span class="kw">${w}</span>` : PTY.has(m[4]) ? `<span class="ty">${w}</span>` : `<span class="fn">${w}</span>`;
    else if (m[5]) o += PKW.has(m[5]) ? `<span class="kw">${w}</span>` : PTY.has(m[5]) ? `<span class="ty">${w}</span>` : w;
    else o += `<span class="nu">${w}</span>`;
  }
  return o + esc(src.slice(last));
}
function hl(src){
  if (META.code_lang === 'python') return hlPy(src);
  if (META.code_lang === 'nosql') return esc(src);
  const re = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(^[ \t]*#[^\n]*)|([A-Za-z_]\w*)(?=\s*\()|([A-Za-z_]\w*)|(\b\d+(?:\.\d+)?[fFlLuU]*\b)/gm;
  let o='', last=0, m;
  while ((m = re.exec(src))){
    o += esc(src.slice(last, m.index)); last = re.lastIndex;
    const w = esc(m[0]);
    if (m[1]) o += `<span class="cm">${w}</span>`;
    else if (m[2]) o += `<span class="st">${w}</span>`;
    else if (m[3]) o += `<span class="pp">${w}</span>`;
    else if (m[4]) o += KW.has(m[4]) ? `<span class="kw">${w}</span>` : TY.has(m[4]) ? `<span class="ty">${w}</span>` : `<span class="fn">${w}</span>`;
    else if (m[5]) o += KW.has(m[5]) ? `<span class="kw">${w}</span>` : TY.has(m[5]) ? `<span class="ty">${w}</span>` : w;
    else o += `<span class="nu">${w}</span>`;
  }
  return o + esc(src.slice(last));
}
const progBody = p => p.items
  ? p.items.map(it => fixTables(t(it.body)) + (it.diagram?dgInline(it.diagram):'')).join('')
  : `<div class="pl">${L('code')}</div><pre class="code">${hl(t(p.code))}</pre><div class="pl">${L('output')}</div><pre class="out">${esc(p.out)}</pre>${p.plot?`<div class="pl">${L('plot')}</div>`+dgInline(p.plot).replace('class="dg"','class="dg pg"'):''}${p.expl?`<div class="pl">${L('expl')}</div>${fixTables(t(p.expl))}`:''}`;
const pBox = id => { const p=(U.programs||[]).find(x=>x.id===id); if(!p) return ''; return `<div class="pbox"><div class="et">${L('prog')}: ${t(p.title)}</div>${progBody(p)}</div>`; };
const exBox = id => { const n=(U.numericals||[]).find(x=>x.id===id); if(!n) return ''; return `<div class="ex"><div class="et">${L('ex')}</div><div class="eq2">${t(n.q)}</div>${fixTables(t(n.a))}</div>`; };
function notes(){
  let h = `<div class="intro"><b>${t(U.title)}</b><div>${L('unit')} ${U.unit} · ${U.weightage}% ${L('intro')} · ${U.hours} ${L('hours')}</div><div>${U.intro_text ? t(U.intro_text) : L(U.programs?(META.code_lang==='python'?'intropy':'introc'):'introd')}</div></div>`;
  U.notes.forEach((sec,si)=>{
    h += `<div class="sec">${head(t(sec.title))}`;
    sec.items.forEach((it,i)=>{
      const open = si===0&&i===0 ? ' open' : '';
      if (it.h) {
        h += `<div class="card${it.key?' key':''}${open}"><div class="q hd"><span class="t">${it.key?'⭐ ':''}${t(it.h)}</span>${chev}</div>
        <div class="a rn" style="padding-left:18px">${fixTables(t(it.body)).replace(/margin:0 0 10px -36px/g,'')}${it.diagram?dgInline(it.diagram):''}${(it.examples||[]).map(exBox).join('')}${(it.programs||[]).map(pBox).join('')}</div></div>`;
      } else {
        h += `<div class="card${open}"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(it.q)}</span>${chev}</div>
        <div class="a">${fixTables(t(it.a))}${it.diagram?dgInline(it.diagram):''}</div></div>`;
      }
    });
    h += `</div>`;
  });
  return h;
}
function numericals(){
  return `<div class="sec">${head(L('numericals'))}` + (U.numericals||[]).map((n,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(n.q)}</span>${chev}</div><div class="a">${fixTables(t(n.a))}</div></div>`).join('') + `</div>`;
}
function diagrams(){
  return `<div class="sec">${head(L((U.tabs ? U.tabs.includes('flowcharts')&&!U.tabs.includes('diagrams') : U.programs&&META.code_lang!=='python')?'flowcharts':'diagrams'),false)}<div style="height:10px"></div>` + U.diagrams.map((d,i)=>
    `<div class="dcard" data-dg="${d.id}"><div class="h">${i+1}. ${t(d.title)}</div>${SVG[d.id]}</div>`).join('') + `</div>`;
}
function equations(){
  return U.equations.map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><span class="fbox">${e.f}</span></span>${chev}</div>
     <div class="a"><p>${t(e.terms)}</p></div></div>`).join('') + `</div>`).join('');
}
function viva(){
  // two shapes exist in the corpus: flat [{q,a}] and grouped [{title, items:[{q,a}]}]
  const groups = U.viva.every(v=>v && v.q) ? [{items: U.viva}] : U.viva;
  return groups.map(g=>{
    const items = g.items || [];
    return `<div class="sec">${g.title?head(t(g.title)):''}` + items.map((v,i)=>
      `<div class="card"><div class="q hd"><span class="n">${i+1}.</span><span class="t">${t(v.q)}</span>${chev}</div><div class="a"><p>${t(v.a)}</p></div></div>`).join('') + `</div>`;
  }).join('');
}
function exam(){
  return `<div class="sec">${head(L('examhead'),false)}` + U.exam_questions.map((x,i)=>
    `<div class="card"><div class="q" style="cursor:default"><span class="n">${i+1}.</span><span class="t">${t(x.q)}</span><span class="mk">${x.marks} ${L('marks')}</span></div></div>`).join('') + `</div>`;
}
function programs(){
  return `<div class="sec">${head(L('programs'))}` + (U.programs||[]).map((p,i)=>
    `<div class="card"><div class="q hd"><span class="n">${i+1}.</span><span class="t">${t(p.title)}</span>${chev}</div><div class="a pa">${progBody(p)}</div></div>`).join('') + `</div>`;
}
function syntax(key){
  return (U[typeof key==='string'?key:'syntax']||[]).map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><pre class="code sx">${hl(e.f)}</pre></span>${chev}</div>
     <div class="a">${e.terms && t(e.terms) ? fixTables(t(e.terms)) : ''}</div></div>`).join('') + `</div>`).join('');
}
const flowcharts = diagrams;
const algorithms = () => syntax('algorithms');
const ALLV = {notes, programs, diagrams, flowcharts, algorithms, syntax, equations, numericals, viva, exam};
const VIEWS = U.tabs ? Object.fromEntries(U.tabs.map(k=>[k, ALLV[k]])) : U.programs ? (META.code_lang==='python' ? {notes, programs, diagrams, syntax, viva, exam} : {notes, programs, flowcharts, syntax, viva, exam}) : U.numericals ? {notes, diagrams, equations, numericals, viva, exam} : {notes, diagrams, equations, viva, exam};
function render(){
  document.getElementById('title').textContent = `${L('unit')} ${U.unit}: ${t(U.title)}`;
  document.getElementById('sub').textContent = `${t(META.name)} · ${META.code}`;
  document.getElementById('lang').textContent = S.lang==='en' ? 'ગુ' : 'EN';
  document.getElementById('lang').style.display = META.languages.includes('gu') ? '' : 'none';
  document.getElementById('tabs').innerHTML = Object.keys(VIEWS).map(k=>`<button class="tab${S.tab===k?' on':''}" data-tab="${k}">${L(k)}</button>`).join('');
  document.getElementById('view').innerHTML = VIEWS[S.tab]();
  document.querySelectorAll('#view pre.c').forEach(e=>{ e.innerHTML = hl(e.textContent); e.className='code'; });
}
let zoom = 1;
function setZoom(z){ zoom = Math.min(4, Math.max(1, z)); const w=document.getElementById('zw'); w.style.width=(zoom*100)+'%'; document.getElementById('zr').textContent=Math.round(zoom*100)+'%'; }
document.addEventListener('click', e=>{
  const q = e.target.closest('.q'); if (q && q.parentElement.querySelector('.a')) { q.parentElement.classList.toggle('open'); return; }
  const tb = e.target.closest('[data-tab]'); if (tb){ S.tab = tb.dataset.tab; render(); window.scrollTo(0,0); return; }
  if (e.target.closest('#lang')){ S.lang = S.lang==='en'?'gu':'en'; render(); return; }
  const m = e.target.closest('[data-more]');
  document.querySelectorAll('.menu.show').forEach(x=>{ if(!m || x!==m.nextElementSibling) x.classList.remove('show'); });
  if (m){ m.nextElementSibling.classList.toggle('show'); return; }
  const act = e.target.closest('[data-act]');
  if (act){ act.closest('.sec').querySelectorAll('.card').forEach(c=>{ if(c.querySelector('.a')) c.classList.toggle('open', act.dataset.act==='expand'); }); act.parentElement.classList.remove('show'); return; }
  const dg = e.target.closest('[data-dg]');
  if (dg){ const id=dg.dataset.dg; document.getElementById('mt').textContent=t(U.diagrams.find(d=>d.id===id).title); document.getElementById('zw').innerHTML=SVG[id]; setZoom(1); document.getElementById('modal').classList.add('show'); return; }
  if (e.target.closest('#mx')) document.getElementById('modal').classList.remove('show');
  if (e.target.closest('#zi')) setZoom(zoom+0.5);
  if (e.target.closest('#zo')) setZoom(zoom-0.5);
  if (e.target.closest('#zr')) setZoom(1);
});
render();
</script>
