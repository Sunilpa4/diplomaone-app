<script>
const U = {"subject": "DI02000051", "unit": 5, "format": "notes", "title": {"en": "Environmental Policy and Governance", "gu": "પર્યાવરણ નીતિ અને શાસન"}, "hours": 6, "weightage": 20, "official": true, "languages": ["en", "gu"], "tabs": ["notes", "diagrams", "equations", "numericals", "viva", "exam"], "intro_text": {"en": "Unit 5 of Environmental Sustainability: the Indian environmental statutes and the instrument each one uses - the Water Act 1974, the Air Act 1981, the umbrella Environment (Protection) Act 1986 with the EIA process, the Wild Life, Forest Conservation and Biological Diversity Acts, and the National Green Tribunal; the environmental management system of ISO 14001 with its plan-do-check-act cycle and its benefits and limits; sustainable practice in rain water harvesting, green building rating (GRIHA, IGBC, LEED, ECBC), cradle to cradle, life cycle analysis, green labels and the carbon credit market; the 5R ladder from refuse to recycle; and eco tourism with its advantages, disadvantages and carrying capacity. Nine lecture cards, six diagrams, ten fully solved numericals and twelve answered practice questions.", "gu": "પર્યાવરણીય ટકાઉપણાનું યુનિટ 5: ભારતીય પર્યાવરણીય અધિનિયમો અને દરેક વાપરતું સાધન - જળ અધિનિયમ 1974, વાયુ અધિનિયમ 1981, છત્રી પર્યાવરણ (સંરક્ષણ) અધિનિયમ 1986 EIA પ્રક્રિયા સાથે, વન્યજીવ, વન સંરક્ષણ અને જૈવિક વિવિધતા અધિનિયમો, અને રાષ્ટ્રીય લીલું ટ્રિબ્યુનલ; ISO 14001ની પર્યાવરણીય વ્યવસ્થાપન પ્રણાલી તેના આયોજન-અમલ-તપાસ-સુધારો ચક્ર તથા લાભ અને મર્યાદા સાથે; વરસાદી જળ સંગ્રહ, હરિત ઇમારત રેટિંગ (GRIHA, IGBC, LEED, ECBC), ક્રેડલ ટુ ક્રેડલ, જીવનચક્ર આકલન, લીલું લેબલ અને કાર્બન ક્રેડિટ બજારમાં ટકાઉ પદ્ધતિ; નકારવાથી રિસાયકલ સુધીનું 5R સોપાન; અને પર્યાવરણ પર્યટન તેના લાભ, ખામી અને વહન ક્ષમતા સાથે. નવ પાઠ-કાર્ડ, છ આકૃતિઓ, દસ પૂરા ઉકેલાયેલા દાખલા અને બાર ઉત્તરસહિત સરાવ પ્રશ્નો."}, "notes": [{"title": {"en": "1. Environmental Law in India", "gu": "1. ભારતમાં પર્યાવરણીય કાયદો"}, "items": [{"h": {"en": "5.1 The Water Act 1974 and the Air Act 1981", "gu": "5.1 જળ અધિનિયમ 1974 અને વાયુ અધિનિયમ 1981"}, "body": {"en": "<h4>Why these two came first</h4><p>India's first environmental statute after independence was the <b>Water (Prevention and Control of Pollution) Act, 1974</b>, passed because rivers near industrial towns had become open sewers. It created the Central Pollution Control Board and a State Pollution Control Board in every state, and made it illegal to discharge sewage or trade effluent into a stream without the <b>consent</b> of the Board. The <b>Air (Prevention and Control of Pollution) Act, 1981</b> used the same machinery for air, added the power to declare <b>air pollution control areas</b> and set standards for chimneys, industries and, later, vehicles.</p><h4>The consent mechanism</h4><p>A factory that wants to start must apply for <b>Consent to Establish</b> and then <b>Consent to Operate</b>, which states the maximum quantity and quality of effluent or emission allowed, the monitoring it must do and the conditions it must meet. The consent is renewed periodically, can be refused, and can be cancelled if the conditions are broken. This single instrument is the backbone of Indian pollution control, because the Board inspects against a written permission instead of arguing about general duties.</p><h4>Standards and who sets them</h4><table><tr><th>Body</th><th>Role</th><th>Typical output</th></tr><tr><td>CPCB</td><td>national standards, coordination, monitoring</td><td>effluent and emission standards, AQI</td></tr><tr><td>SPCB / PCC</td><td>consent, inspection, prosecution</td><td>consent orders, closure directions</td></tr><tr><td>MoEFCC</td><td>policy, EIA notification, rules under EPA</td><td>EIA categories, waste rules</td></tr><tr><td>NGT</td><td>green tribunal, civil cases on environment</td><td>orders, compensation, restitution</td></tr></table><h4>Worked example</h4><p>A dyeing unit discharges 500 m³ a day with BOD 250 mg/L. Its consent allows 30 mg/L, so the daily load is 500 × 250 / 1,000 = 125 kg of BOD against a permitted 15 kg - an excess of 110 kg a day, which is enough for the Board to direct closure under section 33A of the Water Act.</p><h4>Common mistake</h4><p>Thinking that a consent is a permanent licence. It is a time-bound permission with conditions and a renewal date; operating after expiry is an offence even if the plant is complying with the standards.</p>", "gu": "<h4>આ બે પહેલાં કેમ આવ્યા</h4><p>સ્વતંત્રતા પછીનો ભારતનો પ્રથમ પર્યાવરણીય કાયદો <b>જળ (પ્રદૂષણ નિવારણ અને નિયંત્રણ) અધિનિયમ, 1974</b> હતો, જે એટલા માટે થયો કે ઔદ્યોગિક નગરો પાસેની નદીઓ ખુલ્લી ગટર બની ગઈ હતી. તેણે કેન્દ્રીય પ્રદૂષણ નિયંત્રણ બોર્ડ અને દરેક રાજ્યમાં રાજ્ય પ્રદૂષણ નિયંત્રણ બોર્ડ બનાવ્યા, અને બોર્ડની <b>સંમતિ</b> વગર ગટર કે ઉદ્યોગનું પાણી નદીમાં છોડવું ગેરકાયદે ઠેરવ્યું. <b>વાયુ (પ્રદૂષણ નિવારણ અને નિયંત્રણ) અધિનિયમ, 1981</b>એ એ જ મશીનરી હવા માટે વાપરી, <b>વાયુ પ્રદૂષણ નિયંત્રણ વિસ્તાર</b> જાહેર કરવાની સત્તા ઉમેરી અને ચીમની, ઉદ્યોગો તથા પછીથી વાહનો માટે ધોરણો નક્કી કર્યા.</p><h4>સંમતિની પ્રણાલી</h4><p>શરૂ કરવા માંગતા કારખાનાએ પહેલાં <b>સ્થાપના સંમતિ</b> અને પછી <b>સંચાલન સંમતિ</b> મેળવવી પડે, જેમાં મંજૂર મહત્તમ પ્રવાહ અને ગુણવત્તા, જરૂરી દેખરેખ અને પાળવાની શરતો લખેલી હોય. સંમતિ સમયાંતરે નવીકરણ થાય, નકારી શકાય અને શરતો તૂટે તો રદ થાય. આ એક સાધન ભારતીય પ્રદૂષણ નિયંત્રણનું કરોડરજ્જુ છે, કારણ કે બોર્ડ સામાન્ય ફરજો પર દલીલ કરવાને બદલે લેખિત પરવાનગી સામે તપાસ કરે.</p><h4>ધોરણો અને કોણ નક્કી કરે</h4><table><tr><th>સંસ્થા</th><th>ભૂમિકા</th><th>સામાન્ય પરિણામ</th></tr><tr><td>CPCB</td><td>રાષ્ટ્રીય ધોરણ, સમન્વય, દેખરેખ</td><td>પ્રવાહ અને ઉત્સર્જન ધોરણ, AQI</td></tr><tr><td>SPCB / PCC</td><td>સંમતિ, તપાસ, કાર્યવાહી</td><td>સંમતિ આદેશ, બંધ કરવાની સૂચના</td></tr><tr><td>MoEFCC</td><td>નીતિ, EIA જાહેરનામું, EPA હેઠળ નિયમો</td><td>EIA શ્રેણીઓ, કચરા નિયમો</td></tr><tr><td>NGT</td><td>લીલું ટ્રિબ્યુનલ, પર્યાવરણના દીવાની કેસ</td><td>આદેશ, વળતર, પુનઃસ્થાપન</td></tr></table><h4>ઉકેલાયેલ દાખલો</h4><p>એક રંગાઈ એકમ દિવસે 500 m³ પાણી BOD 250 mg/L સાથે છોડે. તેની સંમતિ 30 mg/L મંજૂર કરે, તેથી દૈનિક ભાર 500 × 250 / 1,000 = 125 કિલો BOD, મંજૂર 15 કિલો સામે - દિવસે 110 કિલો વધારો, જે જળ અધિનિયમની કલમ 33A હેઠળ બોર્ડને એકમ બંધ કરાવવા પૂરતો છે.</p><h4>સામાન્ય ભૂલ</h4><p>સંમતિ કાયમી પરવાનગી છે તેમ માનવું. તે શરતો અને નવીકરણની તારીખ સાથેની સમયબદ્ધ પરવાનગી છે; સ્ટેશન ધોરણ પાળતું હોય તો પણ મુદત પૂરી થયા પછી ચલાવવું ગુનો છે.</p>"}, "diagram": "u5_law", "syllabus_item": "5.1"}, {"h": {"en": "5.1 The Environment (Protection) Act 1986, Wildlife and Forest Conservation Acts", "gu": "5.1 પર્યાવરણ (સંરક્ષણ) અધિનિયમ 1986, વન્યજીવ અને વન સંરક્ષણ અધિનિયમ"}, "body": {"en": "<h4>The umbrella Act</h4><p>The Bhopal gas leak of 1984 showed that separate laws for water and air could not reach a gas that killed thousands in one night, so the <b>Environment (Protection) Act, 1986</b> was passed as an umbrella law. It gives the central government power to set standards for any pollutant, in any medium, to restrict any industry or process, to close a unit, and to make rules without going back to Parliament - which is why almost every modern rule sits under it: the EIA Notification, the municipal, plastic, e-waste, hazardous waste, construction and demolition and battery waste rules, and the coastal regulation zone.</p><h4>The four older laws</h4><table><tr><th>Act</th><th>Year</th><th>What it protects</th><th>Key instrument</th></tr><tr><td>Wild Life (Protection) Act</td><td>1972</td><td>schedule species, national parks, sanctuaries</td><td>protected areas, ban on hunting and trade</td></tr><tr><td>Water Act</td><td>1974</td><td>rivers, streams, wells</td><td>consent to discharge</td></tr><tr><td>Forest (Conservation) Act</td><td>1980</td><td>forest land</td><td>central approval for any diversion</td></tr><tr><td>Air Act</td><td>1981</td><td>ambient air</td><td>standards for chimneys and vehicles</td></tr><tr><td>Biological Diversity Act</td><td>2002</td><td>biodiversity and traditional knowledge</td><td>three-tier boards, access and benefit sharing</td></tr></table><h4>EIA: an instrument, not a formality</h4><p>Under the EIA Notification 2006 a project is placed in category A or B by size and type. Category A needs central clearance after an environmental impact assessment, an environmental management plan and a public hearing; category B is handled by the state. The clearance comes with <b>conditions</b> - a green belt, an effluent plant, a monitoring report every six months - and the project can be stopped if they are not met. The purpose is to find the problem at the drawing stage, when it costs a design change instead of a shutdown.</p>", "gu": "<h4>છત્રી અધિનિયમ</h4><p>1984ના ભોપાલ ગેસ લીકેજે દર્શાવ્યું કે પાણી અને હવા માટેના અલગ કાયદા એક રાતમાં હજારોને મારતા ગેસ સુધી પહોંચી શકતા નથી, તેથી <b>પર્યાવરણ (સંરક્ષણ) અધિનિયમ, 1986</b> છત્રી કાયદા તરીકે થયો. તે કેન્દ્ર સરકારને કોઈ પણ પ્રદૂષક, કોઈ પણ માધ્યમ માટે ધોરણ, કોઈ પણ ઉદ્યોગ કે પ્રક્રિયા પર મર્યાદા, એકમ બંધ કરવાની અને સંસદ પાસે પાછા જવા વગર નિયમ બનાવવાની સત્તા આપે - તેથી જ લગભગ દરેક આધુનિક નિયમ તેની નીચે છે: EIA જાહેરનામું, નગરપાલિકા, પ્લાસ્ટિક, ઇ-કચરો, જોખમી કચરો, બાંધકામ-પાડકચરો અને બેટરી કચરા નિયમો તથા દરિયાકાંઠાનો નિયમન વિસ્તાર.</p><h4>ચાર જૂના કાયદા</h4><table><tr><th>અધિનિયમ</th><th>વર્ષ</th><th>શું બચાવે</th><th>મુખ્ય સાધન</th></tr><tr><td>વન્યજીવ (સંરક્ષણ) અધિનિયમ</td><td>1972</td><td>અનુસૂચિત જાતિઓ, રાષ્ટ્રીય ઉદ્યાન, અભયારણ્ય</td><td>સંરક્ષિત વિસ્તાર, શિકાર અને વ્યાપાર પર પ્રતિબંધ</td></tr><tr><td>જળ અધિનિયમ</td><td>1974</td><td>નદી, ઝરણાં, કૂવા</td><td>છોડવાની સંમતિ</td></tr><tr><td>વન (સંરક્ષણ) અધિનિયમ</td><td>1980</td><td>વન જમીન</td><td>કોઈ પણ ફેરબદલ માટે કેન્દ્રીય મંજૂરી</td></tr><tr><td>વાયુ અધિનિયમ</td><td>1981</td><td>આસપાસની હવા</td><td>ચીમની અને વાહનોના ધોરણો</td></tr><tr><td>જૈવિક વિવિધતા અધિનિયમ</td><td>2002</td><td>જૈવવિવિધતા અને પરંપરાગત જ્ઞાન</td><td>ત્રિસ્તરીય બોર્ડ, પ્રવેશ અને લાભ વહેંચણી</td></tr></table><h4>EIA: ઔપચારિકતા નહીં, સાધન</h4><p>EIA જાહેરનામું 2006 હેઠળ પ્રોજેક્ટ કદ અને પ્રકાર પ્રમાણે A કે B શ્રેણીમાં આવે. A શ્રેણીને પર્યાવરણીય અસર આકલન, પર્યાવરણીય વ્યવસ્થાપન યોજના અને જાહેર સુનાવણી પછી કેન્દ્રીય મંજૂરી જોઈએ; B શ્રેણી રાજ્ય સંભાળે. મંજૂરી <b>શરતો</b> સાથે આવે - લીલો પટ્ટો, પ્રવાહ સારવાર સ્ટેશન, દર છ મહિને દેખરેખ અહેવાલ - અને પાળવામાં ન આવે તો પ્રોજેક્ટ થંભાવાય. હેતુ એ છે કે સમસ્યા ડ્રોઇંગના તબક્કે જ મળે, જ્યારે તેનો ઉકેલ ડિઝાઇન બદલવાનો ખર્ચ લે, બંધ થવાનો નહીં.</p>"}, "syllabus_item": "5.1"}, {"h": {"en": "5.1 The Biological Diversity Act 2002 and environmental governance", "gu": "5.1 જૈવિક વિવિધતા અધિનિયમ 2002 અને પર્યાવરણીય શાસન"}, "body": {"en": "<h4>Three tiers</h4><p>The <b>Biological Diversity Act, 2002</b> answers a different question from the pollution laws: who may use India's plants, animals and traditional knowledge, and who shares the benefit. It sets up the National Biodiversity Authority at Chennai, a State Biodiversity Board in each state and a Biodiversity Management Committee in each local body. A foreign company needs NBA approval before using a bio-resource; an Indian company needs state approval; and the committee prepares a <b>People's Biodiversity Register</b> recording what grows and is used locally, so that a claim of traditional knowledge can be proved.</p><h4>Who does what</h4><table><tr><th>Layer</th><th>Body</th><th>Work</th></tr><tr><td>national</td><td>NBA, Chennai</td><td>foreign access, IPR, benefit sharing</td></tr><tr><td>state</td><td>State Biodiversity Board</td><td>Indian commercial access, conservation plans</td></tr><tr><td>local</td><td>Biodiversity Management Committee</td><td>People's Biodiversity Register, local rules</td></tr><tr><td>judicial</td><td>National Green Tribunal, 2010</td><td>hears environment cases in six months</td></tr></table><h4>The principles behind the law</h4><ul><li><b>precautionary principle</b>: a lack of full proof is not a reason to delay action when the damage may be serious</li><li><b>polluter pays</b>: the cost of cleaning up falls on the one who caused it</li><li><b>sustainable development</b>: the right to develop is balanced against the right of later generations</li><li><b>public trust</b>: the state holds air, water and forest in trust for the people</li></ul><h4>Worked example</h4><p>A company wants to patent a formulation based on neem that a village has used for decades. Under the Act it must apply to the NBA, disclose the source, and share the benefit with the Biodiversity Management Committee; a register entry dated before the application is the proof that the knowledge is not new.</p>", "gu": "<h4>ત્રણ સ્તર</h4><p><b>જૈવિક વિવિધતા અધિનિયમ, 2002</b> પ્રદૂષણ કાયદાઓથી અલગ પ્રશ્નનો જવાબ આપે: ભારતના છોડ, પ્રાણી અને પરંપરાગત જ્ઞાન કોણ વાપરી શકે અને લાભ કોણ વહેંચે. તેણે ચેન્નાઈમાં રાષ્ટ્રીય જૈવવિવિધતા સત્તામંડળ, દરેક રાજ્યમાં રાજ્ય જૈવવિવિધતા બોર્ડ અને દરેક સ્થાનિક સંસ્થામાં જૈવવિવિધતા વ્યવસ્થાપન સમિતિ ઊભી કરી. વિદેશી કંપનીને જૈવ-સ્રોત વાપરતાં પહેલાં NBA મંજૂરી જોઈએ; ભારતીય કંપનીને રાજ્ય મંજૂરી; અને સમિતિ <b>લોક જૈવવિવિધતા રજિસ્ટર</b> તૈયાર કરે જે સ્થાનિક રીતે શું ઊગે અને વપરાય તે નોંધે, જેથી પરંપરાગત જ્ઞાનનો દાવો પુરવાર થઈ શકે.</p><h4>કોણ શું કરે</h4><table><tr><th>સ્તર</th><th>સંસ્થા</th><th>કામ</th></tr><tr><td>રાષ્ટ્રીય</td><td>NBA, ચેન્નાઈ</td><td>વિદેશી પ્રવેશ, બૌદ્ધિક સંપદા, લાભ વહેંચણી</td></tr><tr><td>રાજ્ય</td><td>રાજ્ય જૈવવિવિધતા બોર્ડ</td><td>ભારતીય વ્યાપારી પ્રવેશ, સંરક્ષણ યોજના</td></tr><tr><td>સ્થાનિક</td><td>જૈવવિવિધતા વ્યવસ્થાપન સમિતિ</td><td>લોક જૈવવિવિધતા રજિસ્ટર, સ્થાનિક નિયમો</td></tr><tr><td>ન્યાયિક</td><td>રાષ્ટ્રીય લીલું ટ્રિબ્યુનલ, 2010</td><td>પર્યાવરણના કેસ છ મહિનામાં સાંભળે</td></tr></table><h4>કાયદા પાછળના સિદ્ધાંતો</h4><ul><li><b>સાવચેતીનો સિદ્ધાંત</b>: નુકસાન ગંભીર હોઈ શકે તો પૂરો પુરાવો ન હોવો એ કાર્યવાહી લંબાવવાનું કારણ નથી</li><li><b>પ્રદૂષક ચૂકવે</b>: સફાઈનો ખર્ચ જેને કારણે થયો તેના પર</li><li><b>ટકાઉ વિકાસ</b>: વિકાસનો અધિકાર પછીની પેઢીઓના અધિકાર સામે સંતુલિત</li><li><b>જાહેર ભરોસો</b>: રાજ્ય હવા, પાણી અને વન લોકો માટે ભરોસામાં રાખે</li></ul><h4>ઉકેલાયેલ દાખલો</h4><p>એક કંપની ગામ દાખલાઓથી વાપરતું લીમડા આધારિત બનાવ સ્વત્વપેટંટ કરવા માંગે છે. અધિનિયમ હેઠળ તેણે NBAમાં અરજી કરવી, સ્રોત જાહેર કરવો અને જૈવવિવિધતા વ્યવસ્થાપન સમિતિ સાથે લાભ વહેંચવો પડે; અરજી પહેલાંની રજિસ્ટર નોંધ એ પુરાવો છે કે જ્ઞાન નવું નથી.</p>"}, "syllabus_item": "5.1"}]}, {"title": {"en": "2. Environmental Management Systems", "gu": "2. પર્યાવરણીય વ્યવસ્થાપન પ્રણાલી"}, "items": [{"h": {"en": "5.2 ISO 14000 and the ISO 14001 management system", "gu": "5.2 ISO 14000 અને ISO 14001 વ્યવસ્થાપન પ્રણાલી"}, "body": {"en": "<h4>A family, and one certifiable member</h4><p>The <b>ISO 14000 family</b> is a set of international standards on environmental management. Only <b>ISO 14001</b> states requirements that an organisation can be audited and certified against; the others are guidance - ISO 14004 for implementing the system, ISO 14031 for performance evaluation, ISO 14040 and 14044 for life cycle assessment, and ISO 14064 for greenhouse gas accounting. The family is voluntary: no law requires it, but a buyer, a bank or an export market may.</p><h4>The PDCA engine</h4><p>The system runs on the <b>plan-do-check-act</b> cycle. <b>Plan</b>: find the environmental aspects of every activity - what it takes from the environment and what it puts back - rank them by significance, and set objectives, targets and legal obligations. <b>Do</b>: run the documented procedures, train the staff, control the significant aspects and keep records. <b>Check</b>: monitor, measure, audit internally and record non-conformities. <b>Act</b>: correct the causes, and feed the lessons into the next plan. The slogan of the standard is that the system is not a certificate on the wall but a wheel that keeps turning.</p><h4>From aspect to objective</h4><table><tr><th>Term</th><th>Meaning</th><th>Example in a plating shop</th></tr><tr><td>environmental aspect</td><td>an activity that interacts with the environment</td><td>spent acid bath, water use, diesel</td></tr><tr><td>environmental impact</td><td>the change it causes</td><td>soil contamination, river pollution</td></tr><tr><td>significant aspect</td><td>one that scores high on severity and frequency</td><td>acid bath, because a spill is severe</td></tr><tr><td>objective and target</td><td>what you will achieve and by when</td><td>cut water use 20 % by 2027</td></tr></table><h4>What the organisation gains</h4><ul><li>legal comfort: the register of legal obligations is kept and checked, so a lapse is found before an inspector finds it</li><li>cost: energy, water and material waste are the same things the system watches, so most certified plants save more than the certificate costs</li><li>market: export buyers and global supply chains ask for it, and it is a condition in many tenders</li><li>trust: an independent audit is evidence, while a claim in an advertisement is only a claim</li></ul><h4>Common mistake</h4><p>Buying a certificate and keeping the same papers for the audit. Certification requires records that are current - monitoring data, training, non-conformity closure - and a surveillance audit every year, so a system that exists only on paper is withdrawn.</p>", "gu": "<h4>એક કુટુંબ, અને એક પ્રમાણિત સભ્ય</h4><p><b>ISO 14000 કુટુંબ</b> પર્યાવરણીય વ્યવસ્થાપન પરનાં આંતરરાષ્ટ્રીય ધોરણોનો સમૂહ છે. ફક્ત <b>ISO 14001</b> આવશ્યકતાઓ આપે જેની સામે સંસ્થાની તપાસ અને પ્રમાણીકરણ થઈ શકે; બાકીનાં માર્ગદર્શન છે - અમલ માટે ISO 14004, કાર્યદક્ષતા મૂલ્યાંકન માટે ISO 14031, જીવનચક્ર આકલન માટે ISO 14040 અને 14044, અને હરિતગૃહ વાયુ હિસાબ માટે ISO 14064. કુટુંબ સ્વૈચ્છિક છે: કોઈ કાયદો તેને ફરજિયાત કરતો નથી, પણ ખરીદનાર, બેંક કે નિકાસ બજાર માંગી શકે.</p><h4>PDCA એન્જિન</h4><p>પ્રણાલી <b>આયોજન-અમલ-તપાસ-સુધારો</b> (PDCA) ચક્ર પર ચાલે. <b>આયોજન</b>: દરેક પ્રવૃત્તિના પર્યાવરણીય પાસાં શોધો - તે પર્યાવરણમાંથી શું લે છે અને શું પાછું આપે છે - તેમને મહત્ત્વ પ્રમાણે ગોઠવો અને ઉદ્દેશ, લક્ષ્ય તથા કાનૂની ફરજો નક્કી કરો. <b>અમલ</b>: લેખિત પ્રક્રિયા ચલાવો, કર્મચારીને તાલીમ આપો, મહત્ત્વના પાસાં નિયંત્રિત કરો અને નોંધ રાખો. <b>તપાસ</b>: દેખરેખ, માપન, આંતરિક તપાસ અને બિન-અનુરૂપતા નોંધો. <b>સુધારો</b>: કારણ સુધારો અને પાઠ આગલા આયોજનમાં ઉમેરો. ધોરણનો સાર એ છે કે પ્રણાલી દીવાલ પરનું પ્રમાણપત્ર નહીં, પણ સતત ફરતું ચક્ર છે.</p><h4>પાસાંથી ઉદ્દેશ સુધી</h4><table><tr><th>શબ્દ</th><th>અર્થ</th><th>પ્લેટિંગ કારખાનામાં ઉદાહરણ</th></tr><tr><td>પર્યાવરણીય પાસું</td><td>પર્યાવરણ સાથે સંબંધ ધરાવતી પ્રવૃત્તિ</td><td>વપરાયેલો એસિડ સ્નાન, પાણીનો વપરાશ, ડીઝલ</td></tr><tr><td>પર્યાવરણીય અસર</td><td>તે જે ફેરફાર કરે</td><td>જમીન પ્રદૂષણ, નદી પ્રદૂષણ</td></tr><tr><td>મહત્ત્વનું પાસું</td><td>જે તીવ્રતા અને આવૃત્તિમાં ઊંચું અંક પામે</td><td>એસિડ સ્નાન, કારણ કે ગળતર ગંભીર છે</td></tr><tr><td>ઉદ્દેશ અને લક્ષ્ય</td><td>શું અને ક્યારે પામશો</td><td>2027 સુધીમાં પાણીનો વપરાશ 20 % ઘટાડવો</td></tr></table><h4>સંસ્થાને શું મળે</h4><ul><li>કાનૂની નિરાંત: કાનૂની ફરજોનું રજિસ્ટર રખાય અને તપાસાય, તેથી ભૂલ નિરીક્ષક પહેલાં મળે</li><li>ખર્ચ: ઊર્જા, પાણી અને સામગ્રીનો વ્યય એ જ વસ્તુઓ છે જે પ્રણાલી જુએ, તેથી મોટા ભાગના પ્રમાણિત કારખાનાં પ્રમાણપત્રના ખર્ચ કરતાં વધુ બચાવે</li><li>બજાર: નિકાસ ખરીદનાર અને વૈશ્વિક પુરવઠા શૃંખલા તે માંગે, અને ઘણી નિવિદાઓમાં તે શરત છે</li><li>ભરોસો: સ્વતંત્ર તપાસ પુરાવો છે, જ્યારે જાહેરાતનો દાવો ફક્ત દાવો છે</li></ul><h4>સામાન્ય ભૂલ</h4><p>પ્રમાણપત્ર ખરીદીને તપાસ માટે એ જ જૂના કાગળ રાખવા. પ્રમાણીકરણને વર્તમાન નોંધ જોઈએ - દેખરેખ માહિતી, તાલીમ, બિન-અનુરૂપતાનું નિવારણ - અને દર વર્ષે દેખરેખ તપાસ, તેથી ફક્ત કાગળ પરની પ્રણાલી પાછી ખેંચાય.</p>"}, "diagram": "u5_iso", "syllabus_item": "5.2"}]}, {"title": {"en": "3. Sustainable Practices", "gu": "3. ટકાઉ પદ્ધતિઓ"}, "items": [{"h": {"en": "5.3 Rain water harvesting", "gu": "5.3 વરસાદી જળ સંગ્રહ"}, "body": {"en": "<h4>Two ways to catch the rain</h4><p><b>Surface storage</b> collects roof or ground runoff in a tank, a farm pond or a check dam for direct use. <b>Ground water recharge</b> leads the same water through a filter pit, a recharge trench or a shaft into the aquifer, where it is stored without evaporation and recovered later from a well. A city needs both: it needs water in July and it needs the aquifer full in April. The classic rain water harvesting system has five parts - catchment, gutters and a first-flush pipe, a filter of gravel and sand, a storage tank, and an overflow to a recharge pit.</p><h4>Sizing it</h4><p>The water a roof can give is <b>rainfall × area × runoff coefficient</b>. A flat concrete roof loses about 15 % to evaporation, wetting and the first flush, so the coefficient is 0.85; a sloping tile roof is 0.75. A 200 m² roof in a district with 1,200 mm of rain therefore yields 200 × 1.2 × 0.85 = 204 m³ a year, enough for about 1,100 days of a 180 litre household need. The tank is sized on the longest dry spell rather than on the annual total, because a tank that overflows in August has been sized on the wrong number.</p><h4>Why a city must do it</h4><table><tr><th>Problem</th><th>What harvesting does</th></tr><tr><td>urban flooding</td><td>holds back the first 20-30 mm of a storm, which is the part that floods the roads</td></tr><tr><td>falling water table</td><td>puts clean water back into the same aquifer the borewell draws from</td></tr><tr><td>salt water in coastal towns</td><td>raises the fresh water lens and pushes the sea back</td></tr><tr><td>hard water and iron</td><td>rain water is nearly distilled, so it needs no softening</td></tr><tr><td>energy for pumping</td><td>a shallow, full aquifer needs a smaller pump and less electricity</td></tr></table><h4>Worked example</h4><p>A school has a 600 m² roof and needs 3,000 L a day. Rain of 1,100 mm gives 600 × 1.1 × 0.85 = 561 m³ a year, which is 187 days of that demand; a 50 m³ tank plus a recharge pit covers the rest of the year from the borewell that the pit keeps alive.</p>", "gu": "<h4>વરસાદ પકડવાની બે રીત</h4><p><b>સપાટી સંગ્રહ</b> છત કે જમીનનું વહેતું પાણી ટાંકી, ખેત તળાવ કે બંધમાં એકઠું કરે. <b>ભૂગર્ભજળ ભરાવો</b> એ જ પાણી ગાળણ ખાડો, ભરાવ ખંડ કે કૂવા દ્વારા જળાશયમાં લઈ જાય, જ્યાં બાષ્પીભવન વગર સંગ્રહાય અને પછી કૂવામાંથી નીકળે. શહેરને બંને જોઈએ: જુલાઈમાં પાણી જોઈએ અને એપ્રિલમાં જળાશય ભરેલું જોઈએ. પરંપરાગત છત પ્રણાલીમાં પાંચ ભાગ છે - ગ્રાહક સપાટી, ગટર અને પ્રથમ-વહાવ પાઇપ, કાંકરા-રેતીનું ગાળક, સંગ્રહ ટાંકી અને ભરાવ ખાડા તરફ વહાવ.</p><h4>માપ કેમ નક્કી કરવું</h4><p>છત આપી શકે તે પાણી = <b>વરસાદ × ક્ષેત્રફળ × વહેવાનો અવયવ</b>. સપાટ કોંક્રિટ છત બાષ્પીભવન, ભીનાશ અને પ્રથમ વહાવમાં લગભગ 15 % ગુમાવે, તેથી અવયવ 0.85; ઢાળવાળી નળિયાની છત 0.75. 1,200 mm વરસાદવાળા જિલ્લામાં 200 m² છત વર્ષે 200 × 1.2 × 0.85 = 204 m³ આપે, જે 180 લિટર રોજની જરૂર ધરાવતા કુટુંબને લગભગ 1,100 દિવસ પૂરે. ટાંકી વાર્ષિક કુલ પ્રમાણે નહીં, સૌથી લાંબા સૂકા સમય પ્રમાણે માપાય, કારણ કે ઓગસ્ટમાં પૂર આવતી ટાંકી ખોટા આંકડા પર માપેલી હોય.</p><h4>શહેરે તે કેમ કરવું જોઈએ</h4><table><tr><th>સમસ્યા</th><th>સંગ્રહ શું કરે</th></tr><tr><td>શહેરી પૂર</td><td>વાવાઝોડાના પ્રથમ 20-30 mm રોકે, જે રસ્તા ડુબાડતો ભાગ છે</td></tr><tr><td>ઘટતું જળ સ્તર</td><td>બોરવેલ જે જળાશયમાંથી ખેંચે તે જ જળાશયમાં સ્વચ્છ પાણી પાછું ભરે</td></tr><tr><td>કિનારાનાં નગરોમાં ખારું પાણી</td><td>ગળ્યા પાણીની પટ્ટી ઊંચી કરી દરિયો પાછો ધકેલે</td></tr><tr><td>કઠણ પાણી અને લોહ</td><td>વરસાદી જળ લગભગ નિસ્યંદિત છે, તેથી નરમ કરવાની જરૂર નહીં</td></tr><tr><td>પંપ માટે ઊર્જા</td><td>ઊંડાઈ ઓછી અને ભરેલું જળાશય નાનો પંપ અને ઓછી વીજળી માંગે</td></tr></table><h4>ઉકેલાયેલ દાખલો</h4><p>એક શાળાની 600 m² છત છે અને દિવસે 3,000 લિટર જોઈએ. 1,100 mm વરસાદ 600 × 1.1 × 0.85 = 561 m³ વર્ષે આપે, જે તે માંગના 187 દિવસ છે; 50 m³ ટાંકી અને ભરાવ ખાડો વર્ષના બાકીના દિવસો તે બોરવેલમાંથી પૂરે જેને ખાડો જીવતું રાખે.</p>"}, "diagram": "u5_rwh", "syllabus_item": "5.3"}, {"h": {"en": "5.3 Green buildings and the Indian rating systems", "gu": "5.3 લીલી ઇમારત અને ભારતીય રેટિંગ પ્રણાલી"}, "body": {"en": "<h4>What makes a building green</h4><p>A green building is designed to use less energy and water over its whole life, to use material with less embodied carbon, to keep the occupants healthy and to sit lightly on its site. The measures are ordinary engineering: orientation and shading before air conditioning, insulation and double glazing, a cool or green roof, LED lighting with occupancy sensors, low-flow fixtures, rainwater harvesting and a sewage treatment plant that reuses water for flushing and gardening, and waste segregation during construction.</p><h4>The three Indian labels</h4><table><tr><th>System</th><th>Run by</th><th>Scale</th><th>Note</th></tr><tr><td>GRIHA</td><td>MNRE and TERI</td><td>1 to 5 stars</td><td>Indian climate and materials, strong on passive design</td></tr><tr><td>IGBC</td><td>Confederation of Indian Industry</td><td>certified, silver, gold, platinum</td><td>widest used in India, many building types</td></tr><tr><td>LEED</td><td>US Green Building Council</td><td>40 to 110 points</td><td>international, recognised by global tenants</td></tr><tr><td>ECBC</td><td>Bureau of Energy Efficiency</td><td>code, not a label</td><td>mandatory energy code for commercial buildings</td></tr></table><h4>What the numbers look like</h4><p>A rated building typically cuts energy 30-50 % and water 20-40 % against a conventional one of the same size, at a capital cost 3-8 % higher; the payback comes from the electricity and water bill within five to seven years, and the rent and resale value are higher. The <b>energy performance index</b> (kWh per m² per year) is the number to compare: a conventional Indian office runs at 200-250, a good green one at 90-120 and a super-efficient one below 70.</p>", "gu": "<h4>ઇમારત લીલી કેવી બને</h4><p>લીલી ઇમારત આખા જીવનમાં ઓછી ઊર્જા અને પાણી વાપરવા, ઓછા સન્નિહિત કાર્બનવાળી સામગ્રી વાપરવા, રહેવાસીઓને સ્વસ્થ રાખવા અને સ્થળ પર ઓછો ભાર પાડવા રચાય. પગલાં સામાન્ય એન્જિનિયરિંગ છે: એરકન્ડીશનિંગ પહેલાં દિશા અને છાયો, ઇન્સ્યુલેશન અને બેવડો કાચ, ઠંડી કે લીલી છત, હાજરી સેન્સરવાળી LED લાઇટ, ઓછા પ્રવાહનાં નળ, વરસાદી જળ સંગ્રહ અને ફ્લશિંગ તથા બગીચા માટે પાણી વાપરતો ગટર સારવાર એકમ, તથા બાંધકામ દરમિયાન કચરાનું અલગીકરણ.</p><h4>ત્રણ ભારતીય લેબલ</h4><table><tr><th>પ્રણાલી</th><th>કોણ ચલાવે</th><th>માપદંડ</th><th>નોંધ</th></tr><tr><td>GRIHA</td><td>MNRE અને TERI</td><td>1 થી 5 સ્ટાર</td><td>ભારતીય હવામાન અને સામગ્રી, નિષ્ક્રિય ડિઝાઇન પર ભાર</td></tr><tr><td>IGBC</td><td>ભારતીય ઉદ્યોગ પરિષદ</td><td>પ્રમાણિત, સિલ્વર, ગોલ્ડ, પ્લેટિનમ</td><td>ભારતમાં સૌથી વધુ વપરાય, ઘણા પ્રકારની ઇમારતો</td></tr><tr><td>LEED</td><td>અમેરિકન લીલી ઇમારત પરિષદ</td><td>40 થી 110 પોઇન્ટ</td><td>આંતરરાષ્ટ્રીય, વૈશ્વિક ભાડુઆતો માને</td></tr><tr><td>ECBC</td><td>ઊર્જા દક્ષતા બ્યુરો</td><td>નિયમાવલી, લેબલ નહીં</td><td>વ્યાપારી ઇમારતો માટે ફરજિયાત ઊર્જા નિયમાવલી</td></tr></table><h4>આંકડા કેવા દેખાય</h4><p>રેટેડ ઇમારત સામાન્ય રીતે સમાન કદની પરંપરાગત ઇમારત સામે ઊર્જા 30-50 % અને પાણી 20-40 % ઘટાડે, 3-8 % વધુ મૂડી ખર્ચે; પરતફેળો પાંચથી સાત વર્ષમાં વીજળી-પાણીના બિલમાંથી આવે, અને ભાડું તથા વેચાણ કિંમત વધુ હોય. સરખાવવાનો આંકડો <b>ઊર્જા કાર્યદક્ષતા સૂચકાંક</b> (વર્ષે પ્રતિ m² kWh) છે: સામાન્ય ભારતીય ઓફિસ 200-250, સારી લીલી ઓફિસ 90-120 અને અતિ-કાર્યક્ષમ 70થી નીચે.</p>"}, "syllabus_item": "5.3"}, {"h": {"en": "5.3 Cradle to cradle, life cycle analysis, green labels and carbon credits", "gu": "5.3 ક્રેડલ ટુ ક્રેડલ, જીવનચક્ર આકલન, લીલું લેબલ અને કાર્બન ક્રેડિટ"}, "body": {"en": "<h4>Cradle to cradle</h4><p>The old model is <b>cradle to grave</b>: dig, make, use, throw away. <b>Cradle to cradle</b> designs the product so that at the end of its life every part becomes food for something else - a <b>biological nutrient</b> that returns to the soil, or a <b>technical nutrient</b> that returns to industry at the same quality. A chair with a glued foam seat cannot be taken apart and becomes waste; the same chair with a bolted steel frame and a wool cover becomes a frame and a cover, both reusable.</p><h4>Life cycle analysis</h4><p>A <b>life cycle analysis</b> adds up every input and output from raw material to disposal, in four steps: <b>goal and scope</b> (what is compared and where the boundary is drawn), <b>inventory</b> (the energy, water, emissions and waste per unit of the product), <b>impact assessment</b> (what that inventory means for warming, acidification, water use and toxicity) and <b>interpretation</b>. The boundary decides the answer: a paper cup may look better than a ceramic cup if the ceramic one is used only five times and washed in hot water.</p><h4>Green label and carbon credit</h4><table><tr><th>Instrument</th><th>What it is</th><th>Example</th></tr><tr><td>green label</td><td>a mark awarded to a product that meets a published environmental criterion</td><td>BIS Eco Mark, Energy Star, EPEAT for electronics</td></tr><tr><td>green building label</td><td>a rating for a whole building</td><td>GRIHA 4 star, IGBC gold</td></tr><tr><td>carbon credit</td><td>one tonne of CO₂ avoided, reduction or removed, verified and tradeable</td><td>a cookstove or a wind project earns credits</td></tr><tr><td>carbon tax</td><td>a price on every tonne emitted, paid to the government</td><td>in force in the EU, not in India</td></tr></table><h4>Advantages and disadvantages of carbon credits</h4><ul><li>advantage: money from a rich country or company funds a clean project in a poor one, which is the cheapest abatement first</li><li>advantage: the credit pays for itself from the carbon market instead of a subsidy</li><li>disadvantage: the project may have happened anyway - <b>additionality</b> is hard to prove</li><li>disadvantage: a cheap credit can excuse a rich buyer who goes on emitting instead of cutting</li><li>disadvantage: measurement and verification cost, and credits can be double counted</li></ul><h4>Worked example</h4><p>A 20 MW wind project in Gujarat generates 48 GWh a year and displaces coal power at 0.9 t CO₂ per MWh, so it avoids 48,000 × 0.9 = 43,200 t a year. At four dollars a credit that is about 1.73 lakh dollars - useful, but far less than the electricity revenue, which is why credits complement a viable tariff and cannot replace it.</p>", "gu": "<h4>ક્રેડલ ટુ ક્રેડલ</h4><p>જૂનું નમૂનો <b>ક્રેડલ ટુ ગ્રેવ</b> છે: ખોદો, બનાવો, વાપરો, ફેંકો. <b>ક્રેડલ ટુ ક્રેડલ</b> ઉત્પાદન એવી રીતે રચે કે તેના આયુષ્યના અંતે દરેક ભાગ બીજા કંઈકનો ખોરાક બને - <b>જૈવિક પોષક</b> જે જમીનમાં પાછું જાય, કે <b>ટેકનિકલ પોષક</b> જે એ જ ગુણવત્તાએ ઉદ્યોગમાં પાછું જાય. ગુંદરવાળી ફોમ સીટવાળી ખુરશી છૂટી ન થઈ શકે તેથી કચરો બને; એ જ ખુરશી બોલ્ટવાળી પોલાદ ફ્રેમ અને ઊનના આવરણ સાથે ફ્રેમ અને આવરણ બંને બને, જે ફરી વપરાય.</p><h4>જીવનચક્ર આકલન</h4><p><b>જીવનચક્ર આકલન</b> કાચા માલથી નિકાલ સુધીનું દરેક ઇનપુટ-આઉટપુટ ચાર પગલામાં જોડે: <b>ધ્યેય અને વ્યાપ</b> (શું સરખાય છે અને સીમા ક્યાં દોરાય), <b>યાદી</b> (ઉત્પાદનના એકમ દીઠ ઊર્જા, પાણી, ઉત્સર્જન અને કચરો), <b>અસર આકલન</b> (તે યાદી ગરમી, અમ્લતા, પાણીના વપરાશ અને ઝેર માટે શું અર્થ ધરે) અને <b>અર્થઘટન</b>. સીમા જવાબ નક્કી કરે: કાગળનો કપ માટીના કપ કરતાં સારો લાગે જો માટીનો કપ ફક્ત પાંચ વાર વપરાય અને ગરમ પાણીથી ધોવાય.</p><h4>લીલું લેબલ અને કાર્બન ક્રેડિટ</h4><table><tr><th>સાધન</th><th>શું છે</th><th>ઉદાહરણ</th></tr><tr><td>લીલું લેબલ</td><td>પ્રકાશિત પર્યાવરણીય માપદંડ પૂરો કરતા ઉત્પાદનને અપાતું ચિહ્ન</td><td>BIS ઇકો માર્ક, એનર્જી સ્ટાર, ઇલેક્ટ્રોનિક્સ માટે EPEAT</td></tr><tr><td>લીલી ઇમારત લેબલ</td><td>આખી ઇમારત માટે રેટિંગ</td><td>GRIHA 4 સ્ટાર, IGBC ગોલ્ડ</td></tr><tr><td>કાર્બન ક્રેડિટ</td><td>ટાળેલું, ઘટાડેલું કે દૂર કરેલું એક ટન CO₂, ચકાસાયેલ અને વ્યાપારી</td><td>ચૂલો કે પવન પ્રોજેક્ટ ક્રેડિટ કમાય</td></tr><tr><td>કાર્બન કર</td><td>છોડેલા દરેક ટન પર ભાવ, સરકારને ચૂકવાય</td><td>યુરોપમાં અમલમાં, ભારતમાં નહીં</td></tr></table><h4>કાર્બન ક્રેડિટના લાભ અને ખામી</h4><ul><li>લાભ: શ્રીમંત દેશ કે કંપનીનું નાણું ગરીબ દેશમાં સ્વચ્છ પ્રોજેક્ટ ભંડોળે, જે સૌથી સસ્તો ઘટાડો પહેલાં</li><li>લાભ: ક્રેડિટ સબસિડીને બદલે કાર્બન બજારમાંથી પોતાનો ખર્ચ કાઢે</li><li>ખામી: પ્રોજેક્ટ કોઈ પણ રીતે થાત - <b>અતિરિક્તતા</b> પુરવાર કરવી કઠિન</li><li>ખામી: સસ્તી ક્રેડિટ ઘટાડવાને બદલે છોડતા રહેતા શ્રીમંત ખરીદનારને બહાનું આપે</li><li>ખામી: માપન અને ચકાસણીનો ખર્ચ, અને ક્રેડિટ બે વાર ગણાઈ શકે</li></ul><h4>ઉકેલાયેલ દાખલો</h4><p>ગુજરાતમાં 20 MW પવન પ્રોજેક્ટ વર્ષે 48 GWh બનાવે અને પ્રતિ MWh 0.9 t CO₂ પ્રમાણે કોલસા વીજળી બદલે, તેથી વર્ષે 48,000 × 0.9 = 43,200 t CO₂ ટાળે. પ્રતિ ક્રેડિટ ચાર ડોલરે તે લગભગ 1.73 લાખ ડોલર - ઉપયોગી, પણ વીજળીની આવક કરતાં ઘણું ઓછું, તેથી ક્રેડિટ ટકાઉ ટેરિફને પૂરક છે, તેનો વિકલ્પ નહીં.</p>"}, "diagram": "u5_credits", "syllabus_item": "5.3"}]}, {"title": {"en": "4. The 5R and Eco Tourism", "gu": "4. 5R અને પર્યાવરણ પર્યટન"}, "items": [{"h": {"en": "5.4 The 5R: refuse, reduce, reuse, repurpose, recycle", "gu": "5.4 5R: નકારો, ઘટાડો, ફરી વાપરો, નવો ઉપયોગ કરો, રિસાયકલ કરો"}, "body": {"en": "<h4>Why the order matters</h4><p>The five Rs are a ladder, and the top rung is the one that saves the most. <b>Refuse</b> means not taking what you do not need - the plastic bag, the straw, the extra packaging - so nothing has to be made, carried, cleaned or recycled. <b>Reduce</b> means using less of what you must take. <b>Reuse</b> means using the same object again for the same purpose. <b>Repurpose</b> means giving it a different second life, such as a paint tin that becomes a planter. <b>Recycle</b> is last, because it needs energy, transport and a market, and it loses quality every time.</p><h4>What each rung looks like in practice</h4><table><tr><th>R</th><th>Meaning</th><th>Household example</th><th>Savings</th></tr><tr><td>Refuse</td><td>do not accept it</td><td>cloth bag at the shop, say no to a straw</td><td>no material, no waste, no cost</td></tr><tr><td>Reduce</td><td>use less of it</td><td>bucket bath, half-flush, LED lamp</td><td>water 40 %, power 80 %</td></tr><tr><td>Reuse</td><td>same object, same job</td><td>steel bottle, refilled printer cartridge</td><td>no new manufacture</td></tr><tr><td>Repurpose</td><td>same object, new job</td><td>tyre as a planter, jar as a pen stand</td><td>delays the trip to the bin</td></tr><tr><td>Recycle</td><td>break it down into material</td><td>paper, metal, PET, e-waste to a recycler</td><td>saves ore and energy, loses quality</td></tr></table><h4>Why recycling cannot be the main answer</h4><p>Recycling works only if three things are true at once: the material is clean and single, a local processor exists, and there is a buyer for the output. Mixed, wet and food-soiled waste fails all three, which is why segregation at source is the whole game. A city that collects mixed waste can recycle maybe 10-15 %; the same city with two-bin segregation recycles 50-60 % of the dry fraction and composts the wet half.</p><h4>Worked example</h4><p>A housing society of 200 flats throws 400 kg of waste a day. Refusing and reducing cuts it to 340 kg; segregating 60 % as wet waste gives 204 kg of compost a day, worth about Rs 2,000 a month, and 136 kg of dry waste that a recycler will pay for - the entire waste becomes a resource and the landfill bill disappears.</p>", "gu": "<h4>ક્રમ કેમ મહત્ત્વનો છે</h4><p>પાંચ R એ સોપાન છે અને સૌથી ઉપરનું પગથિયું સૌથી વધુ બચાવે. <b>નકારો</b> એટલે જે જરૂરી નથી તે ન લેવું - પ્લાસ્ટિક થેલી, સ્ટ્રો, વધારાનું પેકિંગ - તેથી કંઈ બનાવવું, લઈ જવું, ધોવું કે રિસાયકલ કરવું ન પડે. <b>ઘટાડો</b> એટલે જે લેવું જ પડે તેનો ઓછો વપરાશ. <b>ફરી વાપરો</b> એટલે એ જ વસ્તુ એ જ કામ માટે ફરી વાપરવી. <b>નવો ઉપયોગ</b> એટલે તેને બીજું જીવન આપવું, જેમ કે રંગની ટિન બગીચાનું કૂંડું બને. <b>રિસાયકલ</b> છેલ્લે, કારણ કે તેને ઊર્જા, વહન અને બજાર જોઈએ, અને દરેક વખતે ગુણવત્તા ઘટે.</p><h4>વ્યવહારમાં દરેક પગથિયું કેવું દેખાય</h4><table><tr><th>R</th><th>અર્થ</th><th>ઘરનું ઉદાહરણ</th><th>બચત</th></tr><tr><td>નકારો</td><td>ન સ્વીકારો</td><td>દુકાને કાપડની થેલી, સ્ટ્રોને ના</td><td>સામગ્રી નહીં, કચરો નહીં, ખર્ચ નહીં</td></tr><tr><td>ઘટાડો</td><td>ઓછું વાપરો</td><td>ડોલથી સ્નાન, અડધું ફ્લશ, LED દીવો</td><td>પાણી 40 %, વીજ 80 %</td></tr><tr><td>ફરી વાપરો</td><td>એ જ વસ્તુ, એ જ કામ</td><td>પોલાદની બોટલ, ફરી ભરેલી પ્રિન્ટર શાહી</td><td>નવું ઉત્પાદન નહીં</td></tr><tr><td>નવો ઉપયોગ</td><td>એ જ વસ્તુ, નવું કામ</td><td>ટાયર કૂંડું, બરણી પેન સ્ટેન્ડ</td><td>કચરાપેટી સુધીની મુસાફરી લંબાવે</td></tr><tr><td>રિસાયકલ</td><td>તેને સામગ્રીમાં તોડો</td><td>કાગળ, ધાતુ, PET, ઇ-કચરો રિસાયકલરને</td><td>ધાતુ અને ઊર્જા બચે, ગુણવત્તા ઘટે</td></tr></table><h4>રિસાયકલ મુખ્ય જવાબ કેમ ન બની શકે</h4><p>રિસાયકલ ત્યારે જ ચાલે જ્યારે ત્રણ વસ્તુ એકસાથે સાચી હોય: સામગ્રી સ્વચ્છ અને એક જ પ્રકારની હોય, સ્થાનિક પ્રોસેસર હોય અને પરિણામનો ખરીદનાર હોય. મિશ્ર, ભીનો અને ખોરાકથી મેલો કચરો ત્રણેયમાં નિષ્ફળ જાય, તેથી સ્રોત પર અલગીકરણ જ આખી રમત છે. મિશ્ર કચરો ઉપાડતું શહેર લગભગ 10-15 % રિસાયકલ કરી શકે; બે-ડબ્બા અલગીકરણવાળું એ જ શહેર સૂકા ભાગનું 50-60 % રિસાયકલ કરે અને ભીનો અડધો ખાતર બનાવે.</p><h4>ઉકેલાયેલ દાખલો</h4><p>200 ફ્લેટની સોસાયટી દિવસે 400 કિલો કચરો ફેંકે. નકારવા અને ઘટાડવાથી તે 340 કિલો થાય; 60 % ભીનો કચરો અલગ કરવાથી દિવસે 204 કિલો ખાતર, મહિને લગભગ રૂ. 2,000નું, અને 136 કિલો સૂકો કચરો જે રિસાયકલર ખરીદે - આખો કચરો સંસાધન બને અને લેન્ડફિલનું બિલ ગાયબ થાય.</p>"}, "diagram": "u5_5r", "syllabus_item": "5.4"}, {"h": {"en": "5.5 Eco tourism: advantages and disadvantages", "gu": "5.5 પર્યાવરણ પર્યટન: લાભ અને ખામી"}, "body": {"en": "<h4>What eco tourism is</h4><p><b>Eco tourism</b> is responsible travel to a natural area that conserves the environment, sustains the local people and includes interpretation and education. Three tests separate it from ordinary tourism: it protects the place it visits, it leaves most of the money with the local community, and it teaches the visitor. A homestay run by a village beside a sanctuary that trains local guides and keeps the trail clean passes all three; a resort that flies in water and drives jeeps through the same sanctuary does not.</p><h4>Advantages</h4><ul><li>conservation pays: a tiger, a reef or a bird that brings visitors is worth more alive than cut</li><li>local jobs: guides, homestays, drivers, cooks and handicraft, which reduce migration</li><li>education: a visitor who sees a mangrove or a coral reef defends it at home</li><li>income for a protected area, which can pay for patrols and fences instead of the forest department alone</li><li>low infrastructure: a trail, a homestay and a guide need less concrete than a theme park</li></ul><h4>Disadvantages</h4><ul><li>greenwashing: the label is used for marketing while the operation is ordinary mass tourism</li><li>carrying capacity: a trail or a reef has a limit, and beyond it the very thing the visitor came to see is damaged</li><li>wildlife disturbance: noise, vehicles, feeding and night lights change animal behaviour and breeding</li><li>leakage: in an enclave resort most of the money leaves the district, so the local community carries the cost and gets little</li><li>waste and water: a hill homestay can generate more plastic and sewage than the village can handle</li></ul><h4>How to keep it honest</h4><table><tr><th>Tool</th><th>How it works</th></tr><tr><td>carrying capacity study</td><td>fix the number of visitors a trail, beach or reef can take per day</td></tr><tr><td>community ownership</td><td>the homestay, the guide cooperative and the gate fee belong to the village</td></tr><tr><td>permits and zoning</td><td>core zone closed, buffer for guided walks only</td></tr><tr><td>certification</td><td>Green Globe, Ecotourism Society or state eco-label audited yearly</td></tr></table><h4>Worked example</h4><p>A 5 km forest trail can carry 20 visitors a kilometre a day without damage, so the ceiling is 100 visitors a day, or 30,000 a year over 300 open days. At a Rs 150 gate fee that is Rs 45 lakh a year, enough for four local guides, a toilet block and maintenance - provided the ceiling is enforced on the busiest weekends.</p>", "gu": "<h4>પર્યાવરણ પર્યટન એટલે શું</h4><p><b>પર્યાવરણ પર્યટન</b> એ કુદરતી વિસ્તારમાં જવાબદાર મુસાફરી છે જે પર્યાવરણ સાચવે, સ્થાનિક લોકોને ટકાવે અને સમજૂતી તથા શિક્ષણ સમાવે. સામાન્ય પર્યટનથી તેને ત્રણ કસોટી અલગ પાડે: તે જે જગ્યાએ જાય તેને બચાવે, નાણાનો મોટો ભાગ સ્થાનિક સમુદાય સાથે રાખે, અને પ્રવાસીને શીખવે. અભયારણ્ય પાસેનું ગામ ચલાવતું હોમસ્ટે જે સ્થાનિક ગાઇડને તાલીમ આપે અને પગપાળા માર્ગ સાફ રાખે તે ત્રણેય પૂરો કરે; પાણી વિમાનમાં લાવતું અને એ જ અભયારણ્યમાં જીપ દોડાવતું રિસોર્ટ નહીં.</p><h4>લાભ</h4><ul><li>સંરક્ષણ ચૂકવાય: પ્રવાસી લાવતો વાઘ, ભરતી કે પક્ષી કાપેલા કરતાં જીવતો વધુ કિંમતી</li><li>સ્થાનિક રોજગાર: ગાઇડ, હોમસ્ટે, ડ્રાઇવર, રસોઇયા અને હસ્તકલા, જે સ્થળાંતર ઘટાડે</li><li>શિક્ષણ: કાંદાનું જંગલ કે ભરતી જોયેલો પ્રવાસી ઘરે તેનો બચાવ કરે</li><li>સંરક્ષિત વિસ્તારને આવક, જે પહેરા અને વાડ માટે ચૂકવે, ફક્ત વન વિભાગ નહીં</li><li>ઓછું માળખું: પગપાળા માર્ગ, હોમસ્ટે અને ગાઇડને થીમ પાર્ક કરતાં ઓછું કોંક્રિટ જોઈએ</li></ul><h4>ખામી</h4><ul><li>લીલું ધોવું: લેબલ માર્કેટિંગ માટે વપરાય જ્યારે કામ સામાન્ય સામૂહિક પર્યટન હોય</li><li>વહન ક્ષમતા: પગપાળા માર્ગ કે ભરતીની મર્યાદા હોય, અને તે પછી પ્રવાસી જે જોવા આવ્યો તે જ વસ્તુ નુકસાન પામે</li><li>વન્યજીવનમાં ખલેલ: ઘોંઘાટ, વાહન, ખોરાક આપવો અને રાત્રિના દીવા પ્રાણીની આદત અને પ્રજનન બદલે</li><li>લીકેજ: બંધિયાર રિસોર્ટમાં મોટું નાણું જિલ્લો છોડી જાય, તેથી સ્થાનિક સમુદાય ખર્ચ ઉઠાવે અને થોડું પામે</li><li>કચરો અને પાણી: ડુંગરાળ હોમસ્ટે ગામ સંભાળી શકે તેનાથી વધુ પ્લાસ્ટિક અને ગટર બનાવે</li></ul><h4>તેને પ્રામાણિક કેમ રાખવું</h4><table><tr><th>સાધન</th><th>કેવી રીતે ચાલે</th></tr><tr><td>વહન ક્ષમતા અભ્યાસ</td><td>પગપાળા માર્ગ, દરિયાકિનારો કે ભરતી રોજ કેટલા પ્રવાસી સહે તે નક્કી કરે</td></tr><tr><td>સમુદાય માલિકી</td><td>હોમસ્ટે, ગાઇડ સહકારી મંડળી અને પ્રવેશ ફી ગામની</td></tr><tr><td>પરવાનગી અને વિભાજન</td><td>મુખ્ય વિસ્તાર બંધ, બફરમાં ફક્ત ગાઇડ સાથે પગપાળા</td></tr><tr><td>પ્રમાણીકરણ</td><td>ગ્રીન ગ્લોબ, ઇકોટૂરિઝમ સોસાયટી કે રાજ્ય ઇકો-લેબલ દર વર્ષે તપાસે</td></tr></table><h4>ઉકેલાયેલ દાખલો</h4><p>5 કિલોમીટરનો વન માર્ગ નુકસાન વગર કિલોમીટર દીઠ રોજ 20 પ્રવાસી સહે, તેથી મર્યાદા દિવસે 100 પ્રવાસી, એટલે 300 ખુલ્લા દિવસમાં વર્ષે 30,000. રૂ. 150 પ્રવેશ ફી પર તે વર્ષે રૂ. 45 લાખ, જે ચાર સ્થાનિક ગાઇડ, શૌચાલય અને જાળવણી માટે પૂરતું - જો સૌથી વ્યસ્ત સપ્તાહાંતે મર્યાદા લાગુ પડે.</p>"}, "diagram": "u5_eco", "syllabus_item": "5.5"}]}, {"title": {"en": "5. Practice Questions with Model Answers", "gu": "5. સરાવ પ્રશ્નો અને આદર્શ જવાબો"}, "items": [{"h": {"en": "Practice 1. Explain the main environmental laws of India and the instrument each one uses.", "gu": "સરાવ 1. ભારતના મુખ્ય પર્યાવરણીય કાયદા અને દરેક વાપરતું સાધન સમજાવો."}, "body": {"en": "<p>Water Act 1974: created the CPCB and SPCBs and made consent to establish and consent to operate compulsory for any discharge; the instrument is a time-bound permission with effluent standards. Air Act 1981: extended the same board machinery to air, allowed air pollution control areas and set emission standards for chimneys and vehicles.</p><p>Environment (Protection) Act 1986: the umbrella that followed Bhopal, covering every pollutant in every medium, and the parent of the EIA Notification and the waste rules; its instrument is a rule-making and standard-setting power plus closure directions. Wild Life (Protection) Act 1972 protects scheduled species and creates national parks and sanctuaries; Forest (Conservation) Act 1980 requires central approval before any forest land is diverted.</p><p>Biological Diversity Act 2002: three-tier governance (NBA, state board, local committee) with access and benefit sharing for bio-resources and traditional knowledge. Add the courts: the National Green Tribunal, 2010, hears environment cases with a six-month target and can award compensation and restitution. The principles behind all of them are precaution, polluter pays, sustainable development and public trust.</p>", "gu": "<p>જળ અધિનિયમ 1974: CPCB અને SPCB બનાવ્યા અને કોઈ પણ પ્રવાહ માટે સ્થાપના તથા સંચાલન સંમતિ ફરજિયાત કરી; સાધન સમયબદ્ધ પરવાનગી છે જેમાં પ્રવાહના ધોરણ હોય. વાયુ અધિનિયમ 1981: એ જ બોર્ડ મશીનરી હવા સુધી લંબાવી, વાયુ પ્રદૂષણ નિયંત્રણ વિસ્તારની મંજૂરી આપી અને ચીમની તથા વાહનો માટે ઉત્સર્જન ધોરણ નક્કી કર્યા.</p><p>પર્યાવરણ (સંરક્ષણ) અધિનિયમ 1986: ભોપાલ પછીનો છત્રી કાયદો, દરેક માધ્યમમાં દરેક પ્રદૂષકને આવરે, અને EIA જાહેરનામા તથા કચરા નિયમોનો પિતા; તેનું સાધન નિયમ અને ધોરણ બનાવવાની સત્તા તથા બંધ કરવાની સૂચના છે. વન્યજીવ (સંરક્ષણ) અધિનિયમ 1972 અનુસૂચિત જાતિઓ બચાવે અને રાષ્ટ્રીય ઉદ્યાન તથા અભયારણ્ય બનાવે; વન (સંરક્ષણ) અધિનિયમ 1980 વન જમીન ફેરવતાં પહેલાં કેન્દ્રીય મંજૂરી માંગે.</p><p>જૈવિક વિવિધતા અધિનિયમ 2002: ત્રિસ્તરીય શાસન (NBA, રાજ્ય બોર્ડ, સ્થાનિક સમિતિ) સાથે જૈવ-સ્રોત અને પરંપરાગત જ્ઞાન માટે પ્રવેશ અને લાભ વહેંચણી. અદાલતો ઉમેરો: રાષ્ટ્રીય લીલું ટ્રિબ્યુનલ, 2010, પર્યાવરણના કેસ છ મહિનાના લક્ષ્યે સાંભળે અને વળતર તથા પુનઃસ્થાપન આપી શકે. બધા પાછળના સિદ્ધાંતો સાવચેતી, પ્રદૂષક ચૂકવે, ટકાઉ વિકાસ અને જાહેર ભરોસો છે.</p>"}}, {"h": {"en": "Practice 2. Describe ISO 14001 with its PDCA cycle and list the benefits of certification.", "gu": "સરાવ 2. ISO 14001 તેના PDCA ચક્ર સાથે વર્ણવો અને પ્રમાણીકરણના લાભ ગણાવો."}, "body": {"en": "<p>Plan: define the scope and policy, identify environmental aspects and impacts, score them for significance, list the legal and other requirements, and set objectives, targets and programmes. Do: assign roles and training, write operational controls for the significant aspects, prepare for emergencies and keep records. Check: monitor and measure the key parameters, calibrate instruments, audit internally and record non-conformities. Act: correct the root cause, update the risk assessment and feed the result into the next plan.</p><p>The written procedure for a significant aspect is the heart of the system: the plating shop writes how an acid bath is filled, used, drained, stored and inspected, who may do it, what happens if it spills, and how the records prove it. That is why an audit can test the system - it looks for the document, the training record and the monitoring data, and asks the operator to explain the procedure.</p><p>Benefits: legal compliance becomes a checked register instead of a hope; energy, water and material waste fall because they are the aspects being watched; export customers, banks and insurers accept the certificate as evidence; and the workforce is trained to notice a leak before it becomes a fine. The limitation is that ISO 14001 certifies the system, not the performance - a certified plant can still be a heavy polluter if its objectives are weak.</p>", "gu": "<p>આયોજન: વ્યાપ અને નીતિ નક્કી કરો, પર્યાવરણીય પાસાં અને અસરો ઓળખો, તેમને મહત્ત્વ માટે અંક આપો, કાનૂની તથા બીજી ફરજોની યાદી બનાવો, અને ઉદ્દેશ, લક્ષ્ય તથા કાર્યક્રમ નક્કી કરો. અમલ: ભૂમિકા અને તાલીમ સોંપો, મહત્ત્વનાં પાસાં માટે સંચાલન નિયંત્રણ લખો, આપાતકાલ માટે તૈયારી કરો અને નોંધ રાખો. તપાસ: મુખ્ય માપદંડોની દેખરેખ અને માપન કરો, સાધનો કેલિબ્રેટ કરો, આંતરિક તપાસ કરો અને બિન-અનુરૂપતા નોંધો. સુધારો: મૂળ કારણ સુધારો, જોખમ આકલન સુધારો અને પરિણામ આગલા આયોજનમાં ઉમેરો.</p><p>મહત્ત્વના પાસાં માટેની લેખિત પ્રક્રિયા પ્રણાલીનું હૃદય છે: પ્લેટિંગ કારખાનું લખે કે એસિડ સ્નાન કેવી રીતે ભરાય, વપરાય, ખાલી થાય, સંગ્રહાય અને તપાસાય, કોણ કરી શકે, ગળે તો શું થાય, અને નોંધ કેવી રીતે પુરાવો આપે. તેથી જ તપાસ પ્રણાલી કસી શકે - તે દસ્તાવેજ, તાલીમ નોંધ અને દેખરેખ માહિતી શોધે, અને ઓપરેટરને પ્રક્રિયા સમજાવવા કહે.</p><p>લાભ: કાનૂની અનુપાલન આશાને બદલે તપાસાયેલું રજિસ્ટર બને; ઊર્જા, પાણી અને સામગ્રીનો વ્યય ઘટે કારણ કે તે જ જોવાતાં પાસાં છે; નિકાસ ખરીદનાર, બેંક અને વીમા કંપની પ્રમાણપત્રને પુરાવા તરીકે સ્વીકારે; અને કર્મચારી ગળતર દંડ બનતાં પહેલાં જોવા તાલીમ પામે. મર્યાદા એ છે કે ISO 14001 પ્રણાલીનું પ્રમાણીકરણ કરે, કાર્યદક્ષતાનું નહીં - ઉદ્દેશ નબળા હોય તો પ્રમાણિત કારખાનું હજી ભારે પ્રદૂષક રહી શકે.</p>"}}, {"h": {"en": "Practice 3. Design a rain water harvesting system for a school and calculate what it saves.", "gu": "સરાવ 3. શાળા માટે વરસાદી જળ સંગ્રહ પ્રણાલી રચો અને તે કેટલું બચાવે તે ગણો."}, "body": {"en": "<p>Catchment: the 800 m² terrace, sloping to four downpipes. Conveyance: 110 mm PVC gutters with a mesh strainer at each outlet, and a first-flush diverter that throws away the first 2 mm of rain, which carries most of the dust and bird droppings. Filtration: a sand and gravel filter with a charcoal layer. Storage: a 40 m³ underground tank of RCC with a mosquito-proof cover. Recharge: an overflow pipe to a 3 m × 3 m recharge pit filled with boulders, gravel and sand, so that surplus goes into the aquifer instead of the drain.</p><p>Calculation: 800 m² at 1,000 mm of rain with a coefficient of 0.85 gives 800 × 1.0 × 0.85 = 680 m³ a year, which is 6,80,000 litres. The school needs 2,000 L a day for drinking, washing and toilets, so the harvest covers 340 days - nearly the whole academic year. At Rs 60 per m³ of tanker water that is Rs 40,800 a year, and the recharge pit also lifts the borewell, so the pump runs for fewer hours.</p><p>Cost and upkeep: about Rs 4-5 lakh for the tank and pit, so the payback is eight to ten years on water alone, and faster once the flooding of the playground and the pump hours are counted. Maintenance is the part that decides whether it works: clean the strainer before the monsoon, remove the first-flush water, desilt the tank every year and keep the pit free of leaves.</p>", "gu": "<p>ગ્રાહક સપાટી: 800 m² ટેરેસ, ચાર ઉતરતી નળીઓ તરફ ઢળતી. વહન: દરેક મુખ પર જાળીવાળા 110 mm PVC ગટર, અને પ્રથમ-વહાવ વાળક જે પ્રથમ 2 mm વરસાદ ફેંકે, જેમાં મોટાભાગની ધૂળ અને પક્ષીના મળ હોય. ગાળણ: કોલસાના સ્તર સાથે રેતી-કાંકરાનું ગાળક. સંગ્રહ: મચ્છર-રક્ષી ઢાંકણવાળી 40 m³ ભૂગર્ભ ટાંકી. ભરાવો: 3 m × 3 m ભરાવ ખાડા તરફ વહાવ પાઇપ, જે પથ્થર, કાંકરા અને રેતીથી ભરેલો, જેથી વધારાનું પાણી ગટરને બદલે જળાશયમાં જાય.</p><p>ગણતરી: 1,000 mm વરસાદમાં 800 m² અને 0.85 અવયવ 800 × 1.0 × 0.85 = 680 m³ વર્ષે, એટલે 6,80,000 લિટર આપે. શાળાને પીવા, ધોવા અને શૌચાલય માટે દિવસે 2,000 લિટર જોઈએ, તેથી સંગ્રહ 340 દિવસ પૂરે - લગભગ આખું શૈક્ષણિક વર્ષ. પ્રતિ m³ ટેન્કર પાણીના રૂ. 60 પ્રમાણે તે વર્ષે રૂ. 40,800, અને ભરાવ ખાડો બોરવેલ પણ ઊંચું કરે, તેથી પંપ ઓછા કલાક ચાલે.</p><p>ખર્ચ અને જાળવણી: ટાંકી અને ખાડા માટે લગભગ રૂ. 4-5 લાખ, તેથી ફક્ત પાણી પર પરતફેળો આઠથી દસ વર્ષ, અને રમતના મેદાનમાં પૂર તથા પંપના કલાક ગણીએ તો વધુ ઝડપી. જાળવણી જ નક્કી કરે કે તે ચાલશે કે નહીં: ચોમાસા પહેલાં જાળી સાફ કરો, પ્રથમ-વહાવ પાણી કાઢો, દર વર્ષે ટાંકીનો કાંપ કાઢો અને ખાડો પાંદડાંથી મુક્ત રાખો.</p>"}}, {"h": {"en": "Practice 4. Compare GRIHA, IGBC and LEED and explain what a rating measures.", "gu": "સરાવ 4. GRIHA, IGBC અને LEEDની સરખામણી કરો અને રેટિંગ શું માપે તે સમજાવો."}, "body": {"en": "<p>GRIHA is India's own system, developed by TERI with MNRE, and awards one to five stars. It is built on the Indian climate, the National Building Code and the Energy Conservation Building Code, and it gives heavy weight to passive design - orientation, shading, daylight, ventilation - and to reducing the life-cycle cost of the building, with points for soil and water conservation.</p><p>IGBC, run by the Confederation of Indian Industry, is the most widely used in India and has separate rating tools for homes, offices, factories, schools, townships and existing buildings; it awards certified, silver, gold and platinum. LEED, from the US Green Building Council, is international and is often required by global tenants and investors; it scores energy, water, materials, indoor quality, location and innovation out of 110 points.</p><p>A rating measures design intent and modelled performance against a checklist, verified by documents and sometimes by an audit. It does not measure how the building is actually run, which is why a rated building can underperform if the operators leave the chillers on and the sensors off. The honest comparison is the measured energy performance index and the water consumption per person over a full year.</p>", "gu": "<p>GRIHA ભારતની પોતાની પ્રણાલી છે, TERI દ્વારા MNRE સાથે વિકસાવેલી, અને એકથી પાંચ સ્ટાર આપે. તે ભારતીય હવામાન, રાષ્ટ્રીય ઇમારત નિયમાવલી અને ઊર્જા સંરક્ષણ ઇમારત નિયમાવલી પર બનેલી છે, અને નિષ્ક્રિય ડિઝાઇન - દિશા, છાયો, દિવસનો પ્રકાશ, હવાડો - તથા ઇમારતનો જીવનચક્ર ખર્ચ ઘટાડવા પર ભાર મૂકે, જમીન અને પાણી સંરક્ષણને પોઇન્ટ આપે.</p><p>IGBC, ભારતીય ઉદ્યોગ પરિષદ દ્વારા ચાલતી, ભારતમાં સૌથી વધુ વપરાય છે અને ઘર, ઓફિસ, કારખાનું, શાળા, ટાઉનશિપ અને જૂની ઇમારતો માટે અલગ રેટિંગ સાધનો ધરાવે; તે પ્રમાણિત, સિલ્વર, ગોલ્ડ અને પ્લેટિનમ આપે. LEED, અમેરિકન લીલી ઇમારત પરિષદની, આંતરરાષ્ટ્રીય છે અને વૈશ્વિક ભાડુઆત તથા રોકાણકાર માંગે છે; તે 110માંથી ઊર્જા, પાણી, સામગ્રી, અંદરની ગુણવત્તા, સ્થાન અને નવીનતાને અંક આપે.</p><p>રેટિંગ ચેકલિસ્ટ સામે ડિઝાઇનનો ઇરાદો અને નમૂનિત કાર્યદક્ષતા માપે, જે દસ્તાવેજોથી અને કેટલીક વાર તપાસથી ચકાસાય. તે માપતું નથી કે ઇમારત ખરેખર કેવી ચાલે છે, તેથી ઓપરેટર ચિલર ચાલુ અને સેન્સર બંધ રાખે તો રેટેડ ઇમારત પણ નબળી પડે. પ્રામાણિક સરખામણી આખા વર્ષનો માપેલો ઊર્જા કાર્યદક્ષતા સૂચકાંક અને વ્યક્તિ દીઠ પાણી વપરાશ છે.</p>"}}, {"h": {"en": "Practice 5. Explain cradle to cradle, life cycle analysis and a green label with one example each.", "gu": "સરાવ 5. ક્રેડલ ટુ ક્રેડલ, જીવનચક્ર આકલન અને લીલું લેબલ દરેકના એક ઉદાહરણ સાથે સમજાવો."}, "body": {"en": "<p>Cradle to cradle is a design philosophy: waste equals food. A PET bottle designed to be chemically recycled back into a food-grade bottle, or a cotton shirt with a removable button and a single-fibre label that can be shredded into new yarn, is cradle to cradle; the same bottle laminated to a foil sleeve is not, because the two materials cannot be separated.</p><p>Life cycle analysis is the accounting behind the claim. For a cotton bag against a plastic bag the functional unit is 'carry 10 kg of shopping once'; the inventory counts the cotton, the dye, the water and energy for growing and sewing, the transport; the impact assessment turns that into water scarcity, global warming and eutrophication; and the interpretation may find that the cotton bag wins only if it is used more than fifty times, which is the number the buyer then has to act on.</p><p>A green label is the summary a shopper can use: the BIS Eco Mark, the BEE star for an appliance, EPEAT for a laptop, FSC for timber, or a GRIHA star for a building. Its value depends on three things - a published criterion, an independent check and a surveillance audit - and without the last two the label is only a logo. The examiner wants the three linked: design, evidence, and the label the market can read.</p>", "gu": "<p>ક્રેડલ ટુ ક્રેડલ રચના દર્શન છે: કચરો એટલે ખોરાક. રાસાયણિક રીતે ફરી ખાદ્ય-દરજ્જાની બોટલ બનતી PET બોટલ, કે છૂટા થઈ શકતા બટન અને એક જ તંતુના લેબલવાળું કપાસનું શર્ટ જે ફરી ધાગો બને, તે ક્રેડલ ટુ ક્રેડલ છે; એ જ બોટલ ફોઇલના આવરણ સાથે લેમિનેટ કરેલી નહીં, કારણ કે બે સામગ્રી છૂટી ન થઈ શકે.</p><p>જીવનચક્ર આકલન દાવા પાછળનો હિસાબ છે. પ્લાસ્ટિક થેલી સામે કપાસની થેલી માટે કાર્યાત્મક એકમ 'એક વાર 10 કિલો સામાન ઉપાડવો' છે; યાદી કપાસ, રંગ, ઉગાડવા અને સીવવાનું પાણી તથા ઊર્જા, અને વહન ગણે; અસર આકલન તેને પાણીની તંગી, વૈશ્વિક ગરમી અને પોષકતત્ત્વ વૃદ્ધિમાં ફેરવે; અને અર્થઘટન કદાચ જણાવે કે કપાસની થેલી પચાસ વારથી વધુ વપરાય તો જ જીતે, જે સંખ્યા પર ખરીદનારે પછી કામ કરવાનું છે.</p><p>લીલું લેબલ એ ખરીદનાર વાપરી શકે તેવો સારાંશ છે: BIS ઇકો માર્ક, સાધન માટે BEE સ્ટાર, લેપટોપ માટે EPEAT, લાકડા માટે FSC, કે ઇમારત માટે GRIHA સ્ટાર. તેની કિંમત ત્રણ વસ્તુ પર છે - પ્રકાશિત માપદંડ, સ્વતંત્ર તપાસ અને દેખરેખ તપાસ - અને છેલ્લી બે વગર લેબલ ફક્ત લોગો છે. પરીક્ષકને ત્રણ જોડેલાં જોઈએ: રચના, પુરાવો અને બજાર વાંચી શકે તેવું લેબલ.</p>"}}, {"h": {"en": "Practice 6. Explain the carbon credit system with its advantages and disadvantages.", "gu": "સરાવ 6. કાર્બન ક્રેડિટ પ્રણાલી તેના લાભ અને ખામી સાથે સમજાવો."}, "body": {"en": "<p>Mechanism: a project that reduces, avoids or removes greenhouse gases beyond what the law requires is measured against a baseline. A verifier approved by a standard body - Gold Standard, Verra, or a government scheme - checks the measurement and issues one credit per tonne of CO₂ equivalent. The credit is sold to a buyer who needs it for compliance or for a voluntary net-zero claim, and retired so that it cannot be used twice.</p><p>Advantages: it finds the cheapest reduction first, wherever it is, which is efficient for the atmosphere; it brings private money to cookstoves, biogas, wind and forest projects in countries that cannot subsidise them; it gives a developing country a route to finance without debt; and it creates a measurable unit that companies can report.</p><p>Disadvantages: additionality, because a profitable wind farm may not need the credit at all; permanence, because a forest that burns releases the carbon back; leakage, because a project may push the damage somewhere else; double counting between registries; verification cost that small projects cannot bear; and the moral hazard that a buyer uses credits to avoid cutting its own emissions. The answer is not to abolish the mechanism but to use it last, with strong rules on additionality, permanence and retirement.</p>", "gu": "<p>પ્રણિયંત્રણ: કાયદો માંગે તેનાથી વધુ હરિતગૃહ વાયુ ઘટાડતો, ટાળતો કે દૂર કરતો પ્રોજેક્ટ આધાર રેખા સામે માપાય. ધોરણ સંસ્થા - ગોલ્ડ સ્ટાન્ડર્ડ, વેરા કે સરકારી યોજના - માન્ય તપાસકર્તા માપન ચકાસે અને પ્રતિ ટન CO₂ સમમૂલ્યે એક ક્રેડિટ આપે. ક્રેડિટ અનુપાલન કે સ્વૈચ્છિક નેટ-ઝીરો દાવા માટે જરૂરી ખરીદનારને વેચાય, અને બે વાર ન વપરાય તેમ રદ થાય.</p><p>લાભ: તે સૌથી સસ્તો ઘટાડો પહેલાં શોધે, જ્યાં પણ હોય, જે વાતાવરણ માટે કાર્યક્ષમ છે; તે ચૂલા, બાયોગેસ, પવન અને વન પ્રોજેક્ટમાં ખાનગી નાણું લાવે તેવા દેશોમાં જે સબસિડી આપી શકતા નથી; તે વિકાસશીલ દેશને દેવા વગર ભંડોળનો રસ્તો આપે; અને તે માપી શકાય તેવો એકમ બનાવે જે કંપની જાહેર કરી શકે.</p><p>ખામી: અતિરિક્તતા, કારણ કે નફાકારક પવન ફાર્મને ક્રેડિટની જરૂર જ ન હોય; ટકાઉપણું, કારણ કે બળેલું વન કાર્બન પાછું છોડે; લીકેજ, કારણ કે પ્રોજેક્ટ નુકસાન બીજે ધકેલે; રજિસ્ટર વચ્ચે બે વાર ગણતરી; નાના પ્રોજેક્ટ પરવડી ન શકે તેવો ચકાસણી ખર્ચ; અને નૈતિક જોખમ કે ખરીદનાર ક્રેડિટ વાપરી પોતાનું ઉત્સર્જન ઘટાડવાનું ટાળે. જવાબ પ્રણાલી નાબૂદ કરવો નહીં, પણ તેને છેલ્લે વાપરવી, અતિરિક્તતા, ટકાઉપણું અને રદ કરવા પર કડક નિયમો સાથે.</p>"}}, {"h": {"en": "Practice 7. A city council asks you to cut its waste. Prepare a 5R plan with numbers.", "gu": "સરાવ 7. એક નગર પરિષદ તમને તેનો કચરો ઘટાડવા કહે છે. આંકડા સાથે 5R યોજના બનાવો."}, "body": {"en": "<p>Baseline: the city generates 300 t a day for 6 lakh people, that is 0.5 kg per person, and spends Rs 1,800 per tonne on collection, transport and landfill, so about Rs 19.7 crore a year. Of the 300 t, roughly 55 % is wet, 30 % dry recyclable and 15 % inert or hazardous.</p><p>Refuse and reduce: ban single-use plastic cutlery and carry bags, and promote cloth bags and refill stations; a 5 % reduction is 15 t a day. Reuse and repurpose: a repair cafe at every ward and a construction-material bank for used bricks, doors and tiles, which keeps the 15 t a day of construction waste out of the bin.</p><p>Recycle and recover: two-bin segregation at source, 165 t of wet waste a day to five decentralised compost yards giving 41 t of compost, and 90 t of dry waste to a materials recovery facility that recovers about 60 t of paper, metal, glass and PET; only the 15 t of inert and hazardous waste goes to a sanitary landfill. The saving is about 250 t a day of transport, roughly Rs 16 crore a year, and the compost and recyclables earn another Rs 3-4 crore - the plan pays for itself in the first two years.</p>", "gu": "<p>આધાર રેખા: શહેર 6 લાખ લોકો માટે દિવસે 300 t કચરો બનાવે, એટલે પ્રતિ વ્યક્તિ 0.5 કિલો, અને ઉપાડ, વહન તથા લેન્ડફિલ પર ટન દીઠ રૂ. 1,800 ખર્ચે, એટલે વર્ષે લગભગ રૂ. 19.7 કરોડ. 300 tમાંથી લગભગ 55 % ભીનો, 30 % સૂકો રિસાયકલ થઈ શકે તેવો અને 15 % નિષ્ક્રિય કે જોખમી છે.</p><p>નકારો અને ઘટાડો: એક વાર વપરાતા પ્લાસ્ટિકના ચમચા અને થેલી પર પ્રતિબંધ, અને કાપડની થેલી તથા ફરી ભરવાના કેન્દ્રને પ્રોત્સાહન; 5 % ઘટાડો એટલે દિવસે 15 t. ફરી વાપરો અને નવો ઉપયોગ: દરેક વોર્ડમાં સમારકામ કેન્દ્ર અને વપરાયેલી ઈંટ, દરવાજા તથા ટાઇલ માટે બાંધકામ સામગ્રી બેંક, જે દિવસે 15 t બાંધકામ કચરો કચરાપેટીમાંથી બહાર રાખે.</p><p>રિસાયકલ અને પુનઃપ્રાપ્તિ: સ્રોત પર બે-ડબ્બા અલગીકરણ, દિવસે 165 t ભીનો કચરો પાંચ વિકેન્દ્રિત ખાતર યાર્ડને જે 41 t ખાતર આપે, અને 90 t સૂકો કચરો સામગ્રી પુનઃપ્રાપ્તિ કેન્દ્રને જે લગભગ 60 t કાગળ, ધાતુ, કાચ અને PET કાઢે; ફક્ત 15 t નિષ્ક્રિય તથા જોખમી કચરો સ્વચ્છ લેન્ડફિલમાં જાય. બચત દિવસે લગભગ 250 t વહન, એટલે વર્ષે લગભગ રૂ. 16 કરોડ, અને ખાતર તથા રિસાયકલ વસ્તુ વધુ રૂ. 3-4 કરોડ કમાય - યોજના પ્રથમ બે વર્ષમાં પોતાનો ખર્ચ કાઢે છે.</p>"}}, {"h": {"en": "Practice 8. Explain eco tourism with five advantages, five disadvantages and one way to regulate it.", "gu": "સરાવ 8. પાંચ લાભ, પાંચ ખામી અને નિયંત્રણની એક રીત સાથે પર્યાવરણ પર્યટન સમજાવો."}, "body": {"en": "<p>Definition and advantages: eco tourism is travel to a natural area that conserves it, benefits the local people and educates the visitor. Advantages - conservation becomes an income (a reef that pays for itself), local jobs in guiding, homestays and crafts, less migration, education that turns a visitor into an advocate, and low infrastructure cost compared with a theme park.</p><p>Disadvantages: greenwashing of ordinary mass tourism, exceeding the carrying capacity of a trail, beach or reef, disturbance of wildlife by noise and vehicles, leakage of revenue to enclave resorts so the community keeps little, and the plastic and sewage that a small village cannot manage. Each has a fix in design, but none fixes itself.</p><p>One regulation that works: a scientifically set daily carrying capacity, enforced by timed entry permits sold by the village committee, with a closed day each week and a fee that is higher at the peak. The number is published, the gate is staffed by local people, and the revenue pays for the guides and the trail's own maintenance - the three tests of eco tourism in a single instrument.</p>", "gu": "<p>વ્યાખ્યા અને લાભ: પર્યાવરણ પર્યટન એ કુદરતી વિસ્તારમાં મુસાફરી છે જે તેને સાચવે, સ્થાનિક લોકોને લાભ આપે અને પ્રવાસીને શીખવે. લાભ - સંરક્ષણ આવક બને (પોતાનો ખર્ચ કાઢતી ભરતી), ગાઇડ, હોમસ્ટે અને હસ્તકલામાં સ્થાનિક રોજગાર, ઓછું સ્થળાંતર, પ્રવાસીને હિમાયતી બનાવતું શિક્ષણ, અને થીમ પાર્ક સામે ઓછો માળખા ખર્ચ.</p><p>ખામી: સામાન્ય સામૂહિક પર્યટનનું લીલું ધોવું, પગપાળા માર્ગ, દરિયાકિનારો કે ભરતીની વહન ક્ષમતા વટાવવી, ઘોંઘાટ અને વાહનથી વન્યજીવનમાં ખલેલ, બંધિયાર રિસોર્ટ તરફ આવકનું લીકેજ જેથી સમુદાય થોડું રાખે, અને નાનું ગામ સંભાળી ન શકે તેવું પ્લાસ્ટિક તથા ગટર. દરેકનો ઉકેલ રચનામાં છે, પણ કોઈ જાતે સુધરતું નથી.</p><p>કામ કરતું એક નિયંત્રણ: વૈજ્ઞાનિક રીતે નક્કી કરેલી દૈનિક વહન ક્ષમતા, જે ગામ સમિતિ વેચતી સમયબદ્ધ પ્રવેશ પરવાનગીથી લાગુ પડે, અઠવાડિયે એક બંધ દિવસ અને ટોચની ઋતુમાં વધુ ફી સાથે. સંખ્યા જાહેર થાય, દરવાજે સ્થાનિક લોકો હોય, અને આવક ગાઇડ તથા માર્ગની જાળવણી ચૂકવે - એક જ સાધનમાં પર્યાવરણ પર્યટનની ત્રણ કસોટી.</p>"}}, {"h": {"en": "Practice 9. Explain the Biological Diversity Act 2002 with an example of benefit sharing.", "gu": "સરાવ 9. જૈવિક વિવિધતા અધિનિયમ 2002 લાભ વહેંચણીના ઉદાહરણ સાથે સમજાવો."}, "body": {"en": "<p>Purpose: India is one of the world's megadiverse countries and its knowledge of plants is traditional and undocumented, so a company could patent a remedy that a village had used for generations. The Act regulates access to biological resources, asks for prior approval, and makes benefit sharing a condition - money, technology, training or a share of the royalty.</p><p>Structure: the NBA at Chennai for foreign access and intellectual property, a State Biodiversity Board for Indian commercial access, and a Biodiversity Management Committee in each local body that prepares the People's Biodiversity Register. The register is the practical weapon: an entry dated years before a patent application is evidence that the knowledge is prior art.</p><p>Example: a company earns Rs 8 crore a year from a herbal formulation, so a 5 % benefit share is Rs 40 lakh a year; twelve villages in the register divide it as Rs 3.33 lakh each, and the committee decides whether to spend it on a water tank, a school bus or a seed bank. The money is small, but it changes the politics: the forest is now an asset that the village is paid to protect.</p>", "gu": "<p>હેતુ: ભારત દુનિયાના અતિ-જૈવવિવિધતાવાળા દેશોમાં છે અને તેનું છોડનું જ્ઞાન પરંપરાગત તથા અલેખિત છે, તેથી કંપની ગામ દાખલાઓથી વાપરતા ઉપચારને સ્વત્વપેટંટ કરી શકે. અધિનિયમ જૈવિક સ્રોતમાં પ્રવેશનું નિયમન કરે, પહેલી મંજૂરી માંગે, અને લાભ વહેંચણી શરત બનાવે - નાણું, ટેક્નોલોજી, તાલીમ કે રોયલ્ટીનો હિસ્સો.</p><p>રચના: વિદેશી પ્રવેશ અને બૌદ્ધિક સંપદા માટે ચેન્નાઈમાં NBA, ભારતીય વ્યાપારી પ્રવેશ માટે રાજ્ય જૈવવિવિધતા બોર્ડ, અને દરેક સ્થાનિક સંસ્થામાં જૈવવિવિધતા વ્યવસ્થાપન સમિતિ જે લોક જૈવવિવિધતા રજિસ્ટર તૈયાર કરે. રજિસ્ટર વ્યવહારનું હથિયાર છે: પેટંટ અરજી પહેલાં વર્ષોની નોંધ એ પુરાવો છે કે જ્ઞાન પહેલેથી અસ્તિત્વમાં છે.</p><p>ઉદાહરણ: કંપની જડીબુટ્ટી બનાવમાંથી વર્ષે રૂ. 8 કરોડ કમાય, તેથી 5 % લાભ હિસ્સો વર્ષે રૂ. 40 લાખ; રજિસ્ટરમાંના બાર ગામ દરેકને રૂ. 3.33 લાખ વહેંચે, અને સમિતિ નક્કી કરે કે પાણીની ટાંકી, શાળા બસ કે બીજ બેંક પર ખર્ચવું. નાણું નાનું છે, પણ રાજકારણ બદલે: વન હવે એવી સંપત્તિ છે જેને બચાવવા ગામને ચૂકવાય છે.</p>"}}, {"h": {"en": "Practice 10. How would you verify that a campus is really sustainable and not only painted green?", "gu": "સરાવ 10. કેમ્પસ ખરેખર ટકાઉ છે કે ફક્ત લીલું રંગાયું છે તે કેવી રીતે ચકાસશો?"}, "body": {"en": "<p>Measure, do not believe the brochure. Take the electricity bill for twelve months and divide by the built-up area to get the energy performance index; take the water bill or the borewell meter reading and divide by the number of users; weigh the waste leaving the gate for a week and check how much is segregated. Put the four numbers on a board next to the green flag.</p><p>Then check the claims one by one. A rainwater tank: is it connected, and is it full in August? A solar roof: what does the inverter log show for the last month, and does it match the meter? A compost yard: is there compost, and who takes it? A green cover claim: count the trees and measure the canopy from a satellite image, not from a planting-day photograph.</p><p>Finally, look at governance: is there a written environmental policy, a committee with students on it, an annual audit published on the website, and a budget line for maintenance? A campus with an ISO 14001 style register and a public annual report is sustainable even if it has no green flag; a campus with a flag and a dry tank is not.</p>", "gu": "<p>માનો નહીં, માપો - બ્રોશર પર ભરોસો ન કરો. બાર મહિનાનું વીજ બિલ લો અને બાંધેલા વિસ્તારથી ભાગો, જેથી ઊર્જા કાર્યદક્ષતા સૂચકાંક મળે; પાણીનું બિલ કે બોરવેલ મીટરનું વાંચન લો અને વપરાશકારોની સંખ્યાથી ભાગો; એક અઠવાડિયું ગેટમાંથી નીકળતો કચરો તોળો અને કેટલો અલગ થયો તે તપાસો. ચાર આંકડા લીલા ધ્વજ પાસેના બોર્ડ પર મૂકો.</p><p>પછી દરેક દાવો એક પછી એક તપાસો. વરસાદી ટાંકી: જોડાયેલી છે, અને ઓગસ્ટમાં ભરેલી છે? સૌર છત: ઇન્વર્ટરનો લોગ છેલ્લા મહિનાનું શું કહે છે અને મીટર સાથે મળે છે? ખાતર યાર્ડ: ખાતર છે, અને કોણ લે છે? લીલા આવરણનો દાવો: વૃક્ષ ગણો અને ઉપગ્રહ ચિત્ર પરથી છત્ર માપો, વાવેતર દિવસના ફોટોગ્રાફ પરથી નહીં.</p><p>છેલ્લે શાસન જુઓ: લેખિત પર્યાવરણીય નીતિ છે, વિદ્યાર્થીઓ સાથેની સમિતિ છે, વેબસાઇટ પર પ્રકાશિત વાર્ષિક તપાસ છે, અને જાળવણી માટે બજેટ લાઇન છે? ISO 14001 જેવું રજિસ્ટર અને જાહેર વાર્ષિક અહેવાલવાળું કેમ્પસ લીલો ધ્વજ ન હોય તો પણ ટકાઉ છે; ધ્વજ અને સૂકી ટાંકીવાળું કેમ્પસ નથી.</p>"}}, {"h": {"en": "Practice 11. Write short notes on the National Green Tribunal and the polluter pays principle.", "gu": "સરાવ 11. રાષ્ટ્રીય લીલું ટ્રિબ્યુનલ અને પ્રદૂષક ચૂકવે સિદ્ધાંત પર ટૂંકી નોંધ લખો."}, "body": {"en": "<p>The National Green Tribunal was set up in 2010 under its own Act as a specialised court for environmental cases, so that a matter does not wait twenty years in a civil court. It has principal benches at Delhi and four zonal benches, hears both original applications and appeals, is not bound by the procedure of the Code of Civil Procedure but follows the principles of natural justice, and is required to dispose of a case within six months. Its orders can award compensation, order restitution of the environment and direct a regulator to act.</p><p>Polluter pays: the cost of preventing, controlling and remedying pollution falls on the person who caused it, and it is read into Indian law through the constitutional right to a clean environment and the Supreme Court's interpretation of Article 21. In practice it means a consent condition that requires an effluent plant, a compensation order after a spill, a clean-up cost recovered from the unit, and a fine that is at least as large as the saving from non-compliance - otherwise pollution is simply cheaper than compliance.</p>", "gu": "<p>રાષ્ટ્રીય લીલું ટ્રિબ્યુનલ 2010માં તેના પોતાના અધિનિયમ હેઠળ પર્યાવરણીય કેસ માટે વિશેષ અદાલત તરીકે ઊભું થયું, જેથી બાબત દીવાની અદાલતમાં વીસ વર્ષ રાહ ન જુએ. તેની મુખ્ય બેન્ચ દિલ્હીમાં અને ચાર ક્ષેત્રીય બેન્ચ છે, મૂળ અરજી અને અપીલ બંને સાંભળે, દીવાની કાર્યવિધિ સંહિતાથી બંધાયેલું નથી પણ કુદરતી ન્યાયના સિદ્ધાંતો પાળે, અને છ મહિનામાં કેસ નિકાલ કરવાનું જરૂરી છે. તેના આદેશ વળતર આપે, પર્યાવરણનું પુનઃસ્થાપન કરાવે અને નિયંત્રકને કામ કરવાનું કહે.</p><p>પ્રદૂષક ચૂકવે: પ્રદૂષણ નિવારવા, નિયંત્રિત કરવા અને સુધારવાનો ખર્ચ જેને કારણે થયો તેના પર પડે, અને તે સ્વચ્છ પર્યાવરણના બંધારણીય અધિકાર તથા અનુચ્છેદ 21ના સર્વોચ્ચ અદાલતના અર્થઘટન દ્વારા ભારતીય કાયદામાં વંચાય છે. વ્યવહારમાં તેનો અર્થ પ્રવાહ સારવાર સ્ટેશન માંગતી સંમતિની શરત, ગળતર પછી વળતરનો આદેશ, એકમ પાસેથી વસૂલાત કરેલો સફાઈ ખર્ચ, અને અનુપાલન ન કરવાની બચત કરતાં ઓછામાં ઓછો એટલો જ મોટો દંડ - નહીં તો પ્રદૂષણ અનુપાલન કરતાં સસ્તું પડે.</p>"}}, {"h": {"en": "Practice 12. What is an environmental management system? Explain its elements with the PDCA cycle and state the limitation of certification.", "gu": "સરાવ 12. પર્યાવરણીય વ્યવસ્થાપન પ્રણાલી શું છે? PDCA ચક્ર સાથે તેનાં અંગો સમજાવો અને પ્રમાણીકરણની મર્યાદા જણાવો."}, "body": {"en": "<p>An environmental management system is the organised way an organisation controls what it does to the environment: a policy, a register of aspects and impacts, a register of legal duties, objectives with targets and programmes, operational controls, monitoring, audit and review. ISO 14001 is the international standard for it, and the standard requires the system to be documented so that an auditor can test it.</p><p>Plan: scope, policy, aspects and impacts scored for significance, legal register, objectives and targets. Do: roles, training, written operational control for each significant aspect, emergency preparedness. Check: monitoring and measurement, calibration, internal audit and non-conformity records. Act: root-cause correction, revised risk assessment, management review and input to the next plan.</p><p>The limitation: the certificate says the system exists and is followed, not that the performance is good. A plant with weak targets can be certified and still be a heavy polluter. That is why the sensible buyer asks for the objectives, the monitoring data and the measured energy and water figures, and treats the certificate as the beginning of the conversation, not the end of it.</p>", "gu": "<p>પર્યાવરણીય વ્યવસ્થાપન પ્રણાલી એ સંસ્થા પર્યાવરણ પર કરતી અસરને નિયંત્રિત કરવાની વ્યવસ્થિત રીત છે: નીતિ, પાસાં અને અસરોનું રજિસ્ટર, કાનૂની ફરજોનું રજિસ્ટર, લક્ષ્ય સાથેના ઉદ્દેશ અને કાર્યક્રમ, સંચાલન નિયંત્રણ, દેખરેખ, તપાસ અને સમીક્ષા. ISO 14001 તેના માટેનું આંતરરાષ્ટ્રીય ધોરણ છે, અને ધોરણ માંગે કે પ્રણાલી લેખિત હોય જેથી તપાસકર્તા તેને કસી શકે.</p><p>આયોજન: વ્યાપ, નીતિ, મહત્ત્વ માટે અંકાયેલાં પાસાં અને અસરો, કાનૂની રજિસ્ટર, ઉદ્દેશ અને લક્ષ્ય. અમલ: ભૂમિકા, તાલીમ, દરેક મહત્ત્વના પાસાં માટે લેખિત સંચાલન નિયંત્રણ, આપાતકાલીન તૈયારી. તપાસ: દેખરેખ અને માપન, કેલિબ્રેશન, આંતરિક તપાસ અને બિન-અનુરૂપતાની નોંધ. સુધારો: મૂળ કારણ સુધારો, સુધારેલું જોખમ આકલન, વ્યવસ્થાપન સમીક્ષા અને આગલા આયોજનમાં ઇનપુટ.</p><p>મર્યાદા: પ્રમાણપત્ર કહે છે કે પ્રણાલી અસ્તિત્વમાં છે અને પાળાય છે, એ નહીં કે કાર્યદક્ષતા સારી છે. નબળા ઉદ્દેશવાળું કારખાનું પ્રમાણિત થઈને પણ ભારે પ્રદૂષક રહી શકે. તેથી જ સમજદાર ખરીદનાર ઉદ્દેશ, દેખરેખ માહિતી અને માપેલા ઊર્જા તથા પાણીના આંકડા માંગે, અને પ્રમાણપત્રને વાતચીતની શરૂઆત ગણે, અંત નહીં.</p>"}}]}], "diagrams": [{"id": "u5_law", "title": {"en": "From an Act of Parliament to a consent order", "gu": "સંસદના અધિનિયમથી સંમતિના આદેશ સુધી"}, "file": "diagrams/u5_law.svg", "caption": {"en": "Parliament sets the duty, the ministry sets the number, the board grants the consent - and the tribunal hears the complaint.", "gu": "સંસદ ફરજ નક્કી કરે, મંત્રાલય આંકડો નક્કી કરે, બોર્ડ સંમતિ આપે - અને ટ્રિબ્યુનલ ફરિયાદ સાંભળે."}}, {"id": "u5_iso", "title": {"en": "ISO 14001 as a plan-do-check-act loop", "gu": "આયોજન-અમલ-તપાસ-સુધારો ચક્ર તરીકે ISO 14001"}, "file": "diagrams/u5_iso.svg", "caption": {"en": "Plan, do, check, act: the certificate says the loop is running, not that the emissions are low.", "gu": "આયોજન, અમલ, તપાસ, સુધારો: પ્રમાણપત્ર કહે કે ચક્ર ચાલે છે, એ નહીં કે ઉત્સર્જન ઓછું છે."}}, {"id": "u5_rwh", "title": {"en": "Rain water harvesting: roof to recharge pit", "gu": "વરસાદી જળ સંગ્રહ: છતથી ભરાવ ખાડા સુધી"}, "file": "diagrams/u5_rwh.svg", "caption": {"en": "Catch it, clean it, store it, and let the surplus recharge the ground instead of the drain.", "gu": "પકડો, સાફ કરો, સંગ્રહો, અને વધારાનું ગટરને બદલે જમીનમાં ભરાવા દો."}}, {"id": "u5_credits", "title": {"en": "From a project to a retired carbon credit", "gu": "પ્રોજેક્ટથી રદ થયેલી કાર્બન ક્રેડિટ સુધી"}, "file": "diagrams/u5_credits.svg", "caption": {"en": "Measure against a baseline, verify, issue, sell, retire - and watch additionality, permanence and leakage.", "gu": "આધાર રેખા સામે માપો, ચકાસો, આપો, વેચો, રદ કરો - અને અતિરિક્તતા, ટકાઉપણું તથા લીકેજ જુઓ."}}, {"id": "u5_5r", "title": {"en": "The 5R ladder, refuse first, recycle last", "gu": "5R સોપાન, પહેલાં નકારો, છેલ્લે રિસાયકલ"}, "file": "diagrams/u5_5r.svg", "caption": {"en": "Every step down the ladder needs more energy and more market; refuse needs neither.", "gu": "સોપાનમાં નીચે દરેક પગથિયાને વધુ ઊર્જા અને વધુ બજાર જોઈએ; નકારવાને કંઈ જ નહીં."}}, {"id": "u5_eco", "title": {"en": "The three tests of eco tourism", "gu": "પર્યાવરણ પર્યટનની ત્રણ કસોટી"}, "file": "diagrams/u5_eco.svg", "caption": {"en": "Conservation, local benefit and education together; a capacity that exists only on paper is not a capacity.", "gu": "સંરક્ષણ, સ્થાનિક લાભ અને શિક્ષણ સાથે; ફક્ત કાગળ પરની ક્ષમતા ક્ષમતા નથી."}}], "equations": [{"title": {"en": "Water and rainwater", "gu": "પાણી અને વરસાદી જળ"}, "items": [{"name": {"en": "Harvestable rain", "gu": "એકઠું થઈ શકે તેવો વરસાદ"}, "f": "V = A × rainfall (m) × runoff coefficient", "terms": {"en": "The coefficient is 0.85 for a concrete roof, 0.75 for tiles and 0.5 for a lawn.", "gu": "અવયવ કોંક્રિટ છત માટે 0.85, નળિયા માટે 0.75 અને ઘાસના મેદાન માટે 0.5 છે."}}, {"name": {"en": "Tank size", "gu": "ટાંકીનું માપ"}, "f": "V_tank = daily demand × days of dry spell covered", "terms": {"en": "Size on the longest rainless spell, not on the annual total.", "gu": "વાર્ષિક કુલ પર નહીં, સૌથી લાંબા વરસાદ વગરના સમય પર માપો."}}, {"name": {"en": "Pollution load", "gu": "પ્રદૂષણ ભાર"}, "f": "load (kg/day) = Q (m³/day) × C (mg/L) / 1,000", "terms": {"en": "Compare the load with the load allowed by the consent, not only the concentration.", "gu": "ફક્ત સાંદ્રતા નહીં, સંમતિએ મંજૂર કરેલા ભાર સાથે ભાર સરખાવો."}}]}, {"title": {"en": "Energy, carbon and buildings", "gu": "ઊર્જા, કાર્બન અને ઇમારત"}, "items": [{"name": {"en": "Energy performance index", "gu": "ઊર્જા કાર્યદક્ષતા સૂચકાંક"}, "f": "EPI = annual kWh / built-up area (m²)", "terms": {"en": "Conventional Indian offices run at 200-250, a green one at 90-120.", "gu": "સામાન્ય ભારતીય ઓફિસ 200-250, લીલી 90-120 ચાલે."}}, {"name": {"en": "CO₂ avoided by a plant", "gu": "સ્ટેશનથી બચતું CO₂"}, "f": "m = E (MWh) × EF (t/MWh)", "terms": {"en": "The Indian grid factor is about 0.71 t per MWh and coal about 0.9.", "gu": "ભારતીય ગ્રિડ અવયવ પ્રતિ MWh લગભગ 0.71 t અને કોલસાનો લગભગ 0.9."}}, {"name": {"en": "Carbon credits", "gu": "કાર્બન ક્રેડિટ"}, "f": "credits = tonnes CO₂ avoided, 1 credit = 1 t", "terms": {"en": "Revenue = credits × price per tonne, after verification and additionality tests.", "gu": "આવક = ક્રેડિટ × પ્રતિ ટન ભાવ, ચકાસણી અને અતિરિક્તતા કસોટી પછી."}}, {"name": {"en": "Significance of an aspect", "gu": "પાસાંનું મહત્ત્વ"}, "f": "score = severity × probability × quantity", "terms": {"en": "Each factor is scored 1 to 5; anything above the threshold gets a written control.", "gu": "દરેક અવયવ 1 થી 5 અંક પામે; મર્યાદાથી ઉપરના દરેકને લેખિત નિયંત્રણ મળે."}}]}, {"title": {"en": "Waste and tourism", "gu": "કચરો અને પર્યટન"}, "items": [{"name": {"en": "Waste per day", "gu": "દૈનિક કચરો"}, "f": "W = population × per capita generation", "terms": {"en": "Indian cities generate 0.3-0.6 kg per person a day.", "gu": "ભારતીય શહેરો દિવસે પ્રતિ વ્યક્તિ 0.3-0.6 કિલો બનાવે."}}, {"name": {"en": "Compost yield", "gu": "ખાતર ઉત્પાદન"}, "f": "compost = wet waste × 0.25", "terms": {"en": "About a quarter of the wet mass remains after aerobic composting.", "gu": "હવાયુક્ત ખાતર બનાવટ પછી ભીના દળનો લગભગ ચોથો ભાગ રહે."}}, {"name": {"en": "Carrying capacity", "gu": "વહન ક્ષમતા"}, "f": "visitors/day = trail length × visitors per km per day", "terms": {"en": "Fixing and enforcing the ceiling is what separates eco tourism from mass tourism.", "gu": "મર્યાદા નક્કી કરી લાગુ કરવી એ જ પર્યાવરણ પર્યટનને સામૂહિક પર્યટનથી અલગ પાડે."}}]}], "numericals": [{"id": "u5n01", "unit": 5, "h": {"en": "Rain water harvestable from a roof.", "gu": "છત પરથી એકઠું કરી શકાય તેવું વરસાદી જળ."}, "q": {"en": "A building has a 400 m² concrete roof in a district with 900 mm of annual rain. The runoff coefficient is 0.85. Find the water harvestable in a year and its value at Rs 60 per m³.", "gu": "એક ઇમારતની 400 m² કોંક્રિટ છત છે અને જિલ્લામાં વર્ષે 900 mm વરસાદ પડે છે. વહેવાનો અવયવ 0.85 છે. વર્ષમાં એકઠું થતું પાણી અને પ્રતિ m³ રૂ. 60 પ્રમાણે તેની કિંમત શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A building has a 400 m² concrete roof in a district with 900 mm of annual rain. The runoff coefficient is 0.85. Find the water harvestable in a year and its value at Rs 60 per m³.</p><h4>Step-by-step solution</h4><p>Rain in metres = 900 / 1,000 = 0.9 m</p><p>Volume = area × rain × coefficient = 400 × 0.9 × 0.85 = 306 m³</p><p>Value = 306 × 60 = Rs 18,360 a year, plus the recharge to the borewell</p><h4>Answer</h4><p><b>306 m³ a year, worth about Rs 18,400</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>એક ઇમારતની 400 m² કોંક્રિટ છત છે અને જિલ્લામાં વર્ષે 900 mm વરસાદ પડે છે. વહેવાનો અવયવ 0.85 છે. વર્ષમાં એકઠું થતું પાણી અને પ્રતિ m³ રૂ. 60 પ્રમાણે તેની કિંમત શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>વરસાદ મીટરમાં = 900 / 1,000 = 0.9 m</p><p>ઘનફળ = ક્ષેત્રફળ × વરસાદ × અવયવ = 400 × 0.9 × 0.85 = 306 m³</p><p>કિંમત = 306 × 60 = વર્ષે રૂ. 18,360, ઉપરાંત બોરવેલમાં ભરાવો</p><h4>જવાબ</h4><p><b>વર્ષે 306 m³, લગભગ રૂ. 18,400નું</b></p>"}, "answer": {"en": "306 m³ a year, worth about Rs 18,400", "gu": "વર્ષે 306 m³, લગભગ રૂ. 18,400નું"}}, {"id": "u5n02", "unit": 5, "h": {"en": "Sizing a storage tank for the dry spell.", "gu": "સૂકા સમય માટે સંગ્રહ ટાંકીનું માપ."}, "q": {"en": "A household needs 500 L a day and the longest rainless spell in the district is 70 days. The tank is to cover half of that spell. Fi
