nd the tank volume and the roof area needed if the seasonal rain is 800 mm with a coefficient of 0.8.", "gu": "ઘરને દિવસે 500 લિટર જોઈએ અને જિલ્લામાં સૌથી લાંબો વરસાદ વગરનો સમય 70 દિવસ છે. ટાંકીએ તે સમયનો અડધો ભાગ પૂરવો છે. ટાંકીનું ઘનફળ અને જરૂરી છતનું ક્ષેત્રફળ શોધો, જો ઋતુનો વરસાદ 800 mm અને અવયવ 0.8 હોય."}, "a": {"en": "<h4>Given and assumptions</h4><p>A household needs 500 L a day and the longest rainless spell in the district is 70 days. The tank is to cover half of that spell. Find the tank volume and the roof area needed if the seasonal rain is 800 mm with a coefficient of 0.8.</p><h4>Step-by-step solution</h4><p>Tank = 500 × 35 = 17,500 L = 17.5 m³</p><p>A 20 m³ tank leaves a margin for a longer spell</p><p>Roof = 17.5 / (0.8 × 0.8) = 27.3 m², so a 30 m² roof fills the tank</p><h4>Answer</h4><p><b>A 20 m³ tank and about 30 m² of roof</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>ઘરને દિવસે 500 લિટર જોઈએ અને જિલ્લામાં સૌથી લાંબો વરસાદ વગરનો સમય 70 દિવસ છે. ટાંકીએ તે સમયનો અડધો ભાગ પૂરવો છે. ટાંકીનું ઘનફળ અને જરૂરી છતનું ક્ષેત્રફળ શોધો, જો ઋતુનો વરસાદ 800 mm અને અવયવ 0.8 હોય.</p><h4>પગલાવાર ઉકેલ</h4><p>ટાંકી = 500 × 35 = 17,500 લિટર = 17.5 m³</p><p>20 m³ ટાંકી લાંબા સમય માટે માર્જિન રાખે</p><p>છત = 17.5 / (0.8 × 0.8) = 27.3 m², તેથી 30 m² છત ટાંકી ભરે</p><h4>જવાબ</h4><p><b>20 m³ ટાંકી અને લગભગ 30 m² છત</b></p>"}, "answer": {"en": "A 20 m³ tank and about 30 m² of roof", "gu": "20 m³ ટાંકી અને લગભગ 30 m² છત"}}, {"id": "u5n03", "unit": 5, "h": {"en": "Pollution load against a consent condition.", "gu": "સંમતિની શરત સામે પ્રદૂષણ ભાર."}, "q": {"en": "An effluent stream is 400 m³ a day with BOD 220 mg/L. The consent allows 30 mg/L. Find the BOD load in kg per day, the permitted load and the excess.", "gu": "એક પ્રવાહ દિવસે 400 m³ છે અને BOD 220 mg/L છે. સંમતિ 30 mg/L મંજૂર કરે છે. દૈનિક BOD ભાર કિલોમાં, મંજૂર ભાર અને વધારો શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>An effluent stream is 400 m³ a day with BOD 220 mg/L. The consent allows 30 mg/L. Find the BOD load in kg per day, the permitted load and the excess.</p><h4>Step-by-step solution</h4><p>Load = flow × concentration = 400 × 220 / 1,000 = 88 kg a day</p><p>Permitted = 400 × 30 / 1,000 = 12 kg a day</p><p>Excess = 88 − 12 = 76 kg a day, 7.3 times the limit</p><p>Section 33A of the Water Act allows the Board to stop the supply of water and power</p><h4>Answer</h4><p><b>88 kg a day against 12 kg permitted, an excess of 76 kg</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>એક પ્રવાહ દિવસે 400 m³ છે અને BOD 220 mg/L છે. સંમતિ 30 mg/L મંજૂર કરે છે. દૈનિક BOD ભાર કિલોમાં, મંજૂર ભાર અને વધારો શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>ભાર = પ્રવાહ × સાંદ્રતા = 400 × 220 / 1,000 = 88 કિલો દિવસે</p><p>મંજૂર = 400 × 30 / 1,000 = 12 કિલો દિવસે</p><p>વધારો = 88 − 12 = 76 કિલો દિવસે, મર્યાદાના 7.3 ગણો</p><p>જળ અધિનિયમની કલમ 33A બોર્ડને પાણી અને વીજળી બંધ કરવાની સત્તા આપે</p><h4>જવાબ</h4><p><b>મંજૂર 12 કિલો સામે દિવસે 88 કિલો, 76 કિલો વધારો</b></p>"}, "answer": {"en": "88 kg a day against 12 kg permitted, an excess of 76 kg", "gu": "મંજૂર 12 કિલો સામે દિવસે 88 કિલો, 76 કિલો વધારો"}}, {"id": "u5n04", "unit": 5, "h": {"en": "Carbon credits earned by a wind project.", "gu": "પવન પ્રોજેક્ટ કમાયેલી કાર્બન ક્રેડિટ."}, "q": {"en": "A 25 MW wind farm runs at a 28 % capacity factor and displaces grid power at 0.82 t CO₂ per MWh. Find its annual energy, the CO₂ avoided and the credit revenue at 5 dollars a tonne.", "gu": "25 MW પવન ફાર્મ 28 % ક્ષમતા અવયવે ચાલે અને પ્રતિ MWh 0.82 t CO₂ વાળી ગ્રિડ વીજળી બદલે. તેની વાર્ષિક ઊર્જા, બચતનું CO₂ અને પ્રતિ ટન 5 ડોલરે ક્રેડિટ આવક શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A 25 MW wind farm runs at a 28 % capacity factor and displaces grid power at 0.82 t CO₂ per MWh. Find its annual energy, the CO₂ avoided and the credit revenue at 5 dollars a tonne.</p><h4>Step-by-step solution</h4><p>Energy = 25 × 8,760 × 0.28 = 61,320 MWh = 61.3 GWh</p><p>CO₂ avoided = 61,320 × 0.82 = 50,282 t a year</p><p>Credits = 50,282, worth 50,282 × 5 = 2.51 lakh dollars</p><h4>Answer</h4><p><b>61.3 GWh, 50,282 t CO₂ avoided, about 2.51 lakh dollars</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>25 MW પવન ફાર્મ 28 % ક્ષમતા અવયવે ચાલે અને પ્રતિ MWh 0.82 t CO₂ વાળી ગ્રિડ વીજળી બદલે. તેની વાર્ષિક ઊર્જા, બચતનું CO₂ અને પ્રતિ ટન 5 ડોલરે ક્રેડિટ આવક શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>ઊર્જા = 25 × 8,760 × 0.28 = 61,320 MWh = 61.3 GWh</p><p>બચતનું CO₂ = 61,320 × 0.82 = 50,282 t વર્ષે</p><p>ક્રેડિટ = 50,282, કિંમત 50,282 × 5 = 2.51 લાખ ડોલર</p><h4>જવાબ</h4><p><b>61.3 GWh, 50,282 t CO₂ બચત, લગભગ 2.51 લાખ ડોલર</b></p>"}, "answer": {"en": "61.3 GWh, 50,282 t CO₂ avoided, about 2.51 lakh dollars", "gu": "61.3 GWh, 50,282 t CO₂ બચત, લગભગ 2.51 લાખ ડોલર"}}, {"id": "u5n05", "unit": 5, "h": {"en": "Energy performance index of a green building.", "gu": "લીલી ઇમારતનો ઊર્જા કાર્યદક્ષતા સૂચકાંક."}, "q": {"en": "An office of 4,000 m² uses 9,60,000 kWh a year. A retrofitted version of the same building uses 5,60,000 kWh. Find the EPI of both and the saving in money and CO₂ at Rs 8 a unit and 0.71 kg CO₂ per kWh.", "gu": "4,000 m²ની ઓફિસ વર્ષે 9,60,000 kWh વાપરે છે. તે જ ઇમારતનું સુધારેલું સ્વરૂપ 5,60,000 kWh વાપરે છે. બંનેનો EPI અને પ્રતિ યુનિટ રૂ. 8 તથા પ્રતિ kWh 0.71 કિલો CO₂ પ્રમાણે નાણા અને CO₂ની બચત શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>An office of 4,000 m² uses 9,60,000 kWh a year. A retrofitted version of the same building uses 5,60,000 kWh. Find the EPI of both and the saving in money and CO₂ at Rs 8 a unit and 0.71 kg CO₂ per kWh.</p><h4>Step-by-step solution</h4><p>EPI before = 9,60,000 / 4,000 = 240 kWh/m²/yr</p><p>EPI after = 5,60,000 / 4,000 = 140 kWh/m²/yr, a cut of 42 %</p><p>Saving = 4,00,000 kWh = Rs 32 lakh a year</p><p>CO₂ avoided = 4,00,000 × 0.71 / 1,000 = 284 t a year</p><h4>Answer</h4><p><b>240 down to 140 kWh/m²/yr; Rs 32 lakh and 284 t CO₂ a year</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>4,000 m²ની ઓફિસ વર્ષે 9,60,000 kWh વાપરે છે. તે જ ઇમારતનું સુધારેલું સ્વરૂપ 5,60,000 kWh વાપરે છે. બંનેનો EPI અને પ્રતિ યુનિટ રૂ. 8 તથા પ્રતિ kWh 0.71 કિલો CO₂ પ્રમાણે નાણા અને CO₂ની બચત શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>પહેલાં EPI = 9,60,000 / 4,000 = 240 kWh/m²/વર્ષ</p><p>પછી EPI = 5,60,000 / 4,000 = 140 kWh/m²/વર્ષ, 42 % ઘટાડો</p><p>બચત = 4,00,000 kWh = વર્ષે રૂ. 32 લાખ</p><p>બચતનું CO₂ = 4,00,000 × 0.71 / 1,000 = 284 t વર્ષે</p><h4>જવાબ</h4><p><b>240 થી 140 kWh/m²/વર્ષ; વર્ષે રૂ. 32 લાખ અને 284 t CO₂</b></p>"}, "answer": {"en": "240 down to 140 kWh/m²/yr; Rs 32 lakh and 284 t CO₂ a year", "gu": "240 થી 140 kWh/m²/વર્ષ; વર્ષે રૂ. 32 લાખ અને 284 t CO₂"}}, {"id": "u5n06", "unit": 5, "h": {"en": "Significance score of an environmental aspect.", "gu": "પર્યાવરણીય પાસાંનો મહત્ત્વ અંક."}, "q": {"en": "An ISO 14001 team scores each aspect as severity × probability × quantity, each on a scale of 1 to 5. Score the spent acid bath (5, 4, 3), the diesel tank (4, 3, 3) and office paper (1, 5, 4), and state which aspects are significant above a threshold of 40.", "gu": "ISO 14001 ટીમ દરેક પાસાંને તીવ્રતા × શક્યતા × માત્રા તરીકે 1 થી 5ના માપે અંક આપે છે. વપરાયેલા એસિડ સ્નાન (5, 4, 3), ડીઝલ ટાંકી (4, 3, 3) અને ઓફિસ કાગળ (1, 5, 4)ને અંક આપો અને 40થી ઉપરની મર્યાદાએ કયાં પાસાં મહત્ત્વનાં છે તે જણાવો."}, "a": {"en": "<h4>Given and assumptions</h4><p>An ISO 14001 team scores each aspect as severity × probability × quantity, each on a scale of 1 to 5. Score the spent acid bath (5, 4, 3), the diesel tank (4, 3, 3) and office paper (1, 5, 4), and state which aspects are significant above a threshold of 40.</p><h4>Step-by-step solution</h4><p>Acid bath = 5 × 4 × 3 = 60</p><p>Diesel tank = 4 × 3 × 3 = 36</p><p>Office paper = 1 × 5 × 4 = 20</p><p>Only the acid bath crosses 40, so it gets the written procedure, the secondary containment and the monthly inspection</p><h4>Answer</h4><p><b>Acid bath 60 is significant; diesel 36 and paper 20 are not</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>ISO 14001 ટીમ દરેક પાસાંને તીવ્રતા × શક્યતા × માત્રા તરીકે 1 થી 5ના માપે અંક આપે છે. વપરાયેલા એસિડ સ્નાન (5, 4, 3), ડીઝલ ટાંકી (4, 3, 3) અને ઓફિસ કાગળ (1, 5, 4)ને અંક આપો અને 40થી ઉપરની મર્યાદાએ કયાં પાસાં મહત્ત્વનાં છે તે જણાવો.</p><h4>પગલાવાર ઉકેલ</h4><p>એસિડ સ્નાન = 5 × 4 × 3 = 60</p><p>ડીઝલ ટાંકી = 4 × 3 × 3 = 36</p><p>ઓફિસ કાગળ = 1 × 5 × 4 = 20</p><p>ફક્ત એસિડ સ્નાન 40 વટાવે, તેથી તેને લેખિત પ્રક્રિયા, બેવડું રોકાણ અને માસિક તપાસ મળે</p><h4>જવાબ</h4><p><b>એસિડ સ્નાન 60 મહત્ત્વનું; ડીઝલ 36 અને કાગળ 20 નહીં</b></p>"}, "answer": {"en": "Acid bath 60 is significant; diesel 36 and paper 20 are not", "gu": "એસિડ સ્નાન 60 મહત્ત્વનું; ડીઝલ 36 અને કાગળ 20 નહીં"}}, {"id": "u5n07", "unit": 5, "h": {"en": "Carrying capacity of an eco tourism trail.", "gu": "પર્યાવરણ પર્યટન માર્ગની વહન ક્ષમતા."}, "q": {"en": "A 6 km trail can take 15 visitors per kilometre a day. It is open 300 days a year and the gate fee is Rs 120. Find the annual visitor ceiling and the revenue, and the revenue if use is held to 70 % of the ceiling.", "gu": "6 કિલોમીટરનો માર્ગ રોજ કિલોમીટર દીઠ 15 પ્રવાસી સહે છે. તે વર્ષે 300 દિવસ ખુલ્લો રહે અને પ્રવેશ ફી રૂ. 120 છે. વાર્ષિક મર્યાદા અને આવક, તથા મર્યાદાના 70 % પર રાખીએ તો આવક શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A 6 km trail can take 15 visitors per kilometre a day. It is open 300 days a year and the gate fee is Rs 120. Find the annual visitor ceiling and the revenue, and the revenue if use is held to 70 % of the ceiling.</p><h4>Step-by-step solution</h4><p>Daily ceiling = 6 × 15 = 90 visitors</p><p>Annual = 90 × 300 = 27,000 visitors</p><p>Revenue at the ceiling = 27,000 × 120 = Rs 32.4 lakh</p><p>At 70 % use = 18,900 visitors and Rs 22.7 lakh, which the trail can carry for decades</p><h4>Answer</h4><p><b>27,000 a year at the ceiling; 18,900 and Rs 22.7 lakh at 70 %</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>6 કિલોમીટરનો માર્ગ રોજ કિલોમીટર દીઠ 15 પ્રવાસી સહે છે. તે વર્ષે 300 દિવસ ખુલ્લો રહે અને પ્રવેશ ફી રૂ. 120 છે. વાર્ષિક મર્યાદા અને આવક, તથા મર્યાદાના 70 % પર રાખીએ તો આવક શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>દૈનિક મર્યાદા = 6 × 15 = 90 પ્રવાસી</p><p>વાર્ષિક = 90 × 300 = 27,000 પ્રવાસી</p><p>મર્યાદાએ આવક = 27,000 × 120 = રૂ. 32.4 લાખ</p><p>70 % વપરાશે = 18,900 પ્રવાસી અને રૂ. 22.7 લાખ, જે માર્ગ દાયકાઓ સુધી સહી શકે</p><h4>જવાબ</h4><p><b>મર્યાદાએ વર્ષે 27,000; 70 % પર 18,900 અને રૂ. 22.7 લાખ</b></p>"}, "answer": {"en": "27,000 a year at the ceiling; 18,900 and Rs 22.7 lakh at 70 %", "gu": "મર્યાદાએ વર્ષે 27,000; 70 % પર 18,900 અને રૂ. 22.7 લાખ"}}, {"id": "u5n08", "unit": 5, "h": {"en": "Waste after segregation in a housing society.", "gu": "સોસાયટીમાં અલગીકરણ પછીનો કચરો."}, "q": {"en": "A society of 240 flats generates 0.5 kg per flat a day. After the 5R programme the quantity falls 15 %, and 60 % of what remains is wet waste that becomes compost at 25 % of its mass. Find the compost per day and the waste that still goes to the landfill.", "gu": "240 ફ્લેટની સોસાયટી ફ્લેટ દીઠ દિવસે 0.5 કિલો કચરો બનાવે. 5R કાર્યક્રમ પછી માત્રા 15 % ઘટે અને બાકીના 60 % ભીનો કચરો ખાતર બને જે તેના દળના 25 % થાય. દૈનિક ખાતર અને લેન્ડફિલ જતો કચરો શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A society of 240 flats generates 0.5 kg per flat a day. After the 5R programme the quantity falls 15 %, and 60 % of what remains is wet waste that becomes compost at 25 % of its mass. Find the compost per day and the waste that still goes to the landfill.</p><h4>Step-by-step solution</h4><p>Waste = 240 × 0.5 = 120 kg a day</p><p>After 5R = 120 × 0.85 = 102 kg</p><p>Wet waste = 0.60 × 102 = 61.2 kg, compost = 0.25 × 61.2 = 15.3 kg</p><p>Landfill = 102 − 61.2 = 40.8 kg, less the dry waste a recycler buys</p><h4>Answer</h4><p><b>15.3 kg of compost and about 41 kg to the landfill, down from 120 kg</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>240 ફ્લેટની સોસાયટી ફ્લેટ દીઠ દિવસે 0.5 કિલો કચરો બનાવે. 5R કાર્યક્રમ પછી માત્રા 15 % ઘટે અને બાકીના 60 % ભીનો કચરો ખાતર બને જે તેના દળના 25 % થાય. દૈનિક ખાતર અને લેન્ડફિલ જતો કચરો શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>કચરો = 240 × 0.5 = 120 કિલો દિવસે</p><p>5R પછી = 120 × 0.85 = 102 કિલો</p><p>ભીનો કચરો = 0.60 × 102 = 61.2 કિલો, ખાતર = 0.25 × 61.2 = 15.3 કિલો</p><p>લેન્ડફિલ = 102 − 61.2 = 40.8 કિલો, જેમાંથી રિસાયકલર ખરીદતો સૂકો કચરો બાદ</p><h4>જવાબ</h4><p><b>15.3 કિલો ખાતર અને લેન્ડફિલે લગભગ 41 કિલો, 120 કિલોમાંથી</b></p>"}, "answer": {"en": "15.3 kg of compost and about 41 kg to the landfill, down from 120 kg", "gu": "15.3 કિલો ખાતર અને લેન્ડફિલે લગભગ 41 કિલો, 120 કિલોમાંથી"}}, {"id": "u5n09", "unit": 5, "h": {"en": "Water saved by low-flow fixtures.", "gu": "ઓછા પ્રવાહનાં નળથી બચતું પાણી."}, "q": {"en": "A hostel of 150 students replaces 10 L per flush cisterns with 5 L dual-flush and 8 L per minute taps with 4 L aerated taps. Each student flushes 4 times and uses the tap for 6 minutes a day. Find the water saved a day and a year.", "gu": "150 વિદ્યાર્થીઓની છાત્રાલય 10 લિટરના ફ્લશને 5 લિટરના બેવડા ફ્લશથી અને 8 લિટર પ્રતિ મિનિટના નળને 4 લિટર હવા-મિશ્રિત નળથી બદલે છે. દરેક વિદ્યાર્થી દિવસે 4 વાર ફ્લશ કરે અને નળ 6 મિનિટ વાપરે. દૈનિક અને વાર્ષિક બચત શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A hostel of 150 students replaces 10 L per flush cisterns with 5 L dual-flush and 8 L per minute taps with 4 L aerated taps. Each student flushes 4 times and uses the tap for 6 minutes a day. Find the water saved a day and a year.</p><h4>Step-by-step solution</h4><p>Flush saving = 4 × (10 − 5) = 20 L per student a day</p><p>Tap saving = 6 × (8 − 4) = 24 L per student a day</p><p>Total = 44 × 150 = 6,600 L a day</p><p>A year = 6,600 × 365 = 24.1 lakh litres, about 2,400 m³</p><h4>Answer</h4><p><b>6,600 L a day and about 2,400 m³ a year</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>150 વિદ્યાર્થીઓની છાત્રાલય 10 લિટરના ફ્લશને 5 લિટરના બેવડા ફ્લશથી અને 8 લિટર પ્રતિ મિનિટના નળને 4 લિટર હવા-મિશ્રિત નળથી બદલે છે. દરેક વિદ્યાર્થી દિવસે 4 વાર ફ્લશ કરે અને નળ 6 મિનિટ વાપરે. દૈનિક અને વાર્ષિક બચત શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>ફ્લશ બચત = 4 × (10 − 5) = 20 લિટર પ્રતિ વિદ્યાર્થી</p><p>નળ બચત = 6 × (8 − 4) = 24 લિટર પ્રતિ વિદ્યાર્થી</p><p>કુલ = 44 × 150 = 6,600 લિટર દિવસે</p><p>વર્ષે = 6,600 × 365 = 24.1 લાખ લિટર, લગભગ 2,400 m³</p><h4>જવાબ</h4><p><b>દિવસે 6,600 લિટર અને વર્ષે લગભગ 2,400 m³</b></p>"}, "answer": {"en": "6,600 L a day and about 2,400 m³ a year", "gu": "દિવસે 6,600 લિટર અને વર્ષે લગભગ 2,400 m³"}}, {"id": "u5n10", "unit": 5, "h": {"en": "Benefit sharing under the Biological Diversity Act.", "gu": "જૈવિક વિવિધતા અધિનિયમ હેઠળ લાભ વહેંચણી."}, "q": {"en": "A company earns Rs 8 crore a year from a herbal formulation based on a village's knowledge. The NBA fixes benefit sharing at 5 % of the ex-factory sale price. Find the annual payment, the share of 12 villages in the register, and the payment if the rate were 2 %.", "gu": "એક કંપની ગામના જ્ઞાન પર આધારિત જડીબુટ્ટી બનાવમાંથી વર્ષે રૂ. 8 કરોડ કમાય છે. NBA લાભ વહેંચણી કારખાના વેચાણ ભાવના 5 % નક્કી કરે છે. વાર્ષિક ચુકવણી, રજિસ્ટરમાંના 12 ગામોનો હિસ્સો અને દર 2 % હોય તો ચુકવણી શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A company earns Rs 8 crore a year from a herbal formulation based on a village's knowledge. The NBA fixes benefit sharing at 5 % of the ex-factory sale price. Find the annual payment, the share of 12 villages in the register, and the payment if the rate were 2 %.</p><h4>Step-by-step solution</h4><p>Payment = 0.05 × 8 crore = Rs 40 lakh a year</p><p>Per village = 40 lakh / 12 = Rs 3.33 lakh a year</p><p>At 2 % = Rs 16 lakh, and per village Rs 1.33 lakh</p><p>The money goes to the Biodiversity Management Committee, which decides how it is used</p><h4>Answer</h4><p><b>Rs 40 lakh a year, Rs 3.33 lakh per village at 5 %</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>એક કંપની ગામના જ્ઞાન પર આધારિત જડીબુટ્ટી બનાવમાંથી વર્ષે રૂ. 8 કરોડ કમાય છે. NBA લાભ વહેંચણી કારખાના વેચાણ ભાવના 5 % નક્કી કરે છે. વાર્ષિક ચુકવણી, રજિસ્ટરમાંના 12 ગામોનો હિસ્સો અને દર 2 % હોય તો ચુકવણી શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>ચુકવણી = 0.05 × 8 કરોડ = વર્ષે રૂ. 40 લાખ</p><p>પ્રતિ ગામ = 40 લાખ / 12 = વર્ષે રૂ. 3.33 લાખ</p><p>2 % પર = રૂ. 16 લાખ, અને પ્રતિ ગામ રૂ. 1.33 લાખ</p><p>નાણું જૈવવિવિધતા વ્યવસ્થાપન સમિતિને જાય, જે તેનો ઉપયોગ નક્કી કરે</p><h4>જવાબ</h4><p><b>વર્ષે રૂ. 40 લાખ, 5 % પર પ્રતિ ગામ રૂ. 3.33 લાખ</b></p>"}, "answer": {"en": "Rs 40 lakh a year, Rs 3.33 lakh per village at 5 %", "gu": "વર્ષે રૂ. 40 લાખ, 5 % પર પ્રતિ ગામ રૂ. 3.33 લાખ"}}], "viva": [{"title": {"en": "Law and management systems", "gu": "કાયદો અને વ્યવસ્થાપન પ્રણાલી"}, "items": [{"q": {"en": "What is the difference between the Water Act and the Environment (Protection) Act?", "gu": "જળ અધિનિયમ અને પર્યાવરણ (સંરક્ષણ) અધિનિયમ વચ્ચે શું ફરક છે?"}, "a": {"en": "The Water Act 1974 deals with one medium, water: it creates the pollution control boards and requires consent to discharge. The Environment (Protection) Act 1986 is an umbrella law that covers every medium and every pollutant, and gives the central government power to set standards, restrict industries and frame rules - which is why the EIA Notification and all the waste rules sit under it. The 1974 Act answered a river problem; the 1986 Act answered Bhopal.", "gu": "જળ અધિનિયમ 1974 એક જ માધ્યમ, પાણી સાથે વ્યવહાર કરે: તે પ્રદૂષણ નિયંત્રણ બોર્ડ બનાવે અને છોડવાની સંમતિ માંગે. પર્યાવરણ (સંરક્ષણ) અધિનિયમ 1986 છત્રી કાયદો છે જે દરેક માધ્યમ અને દરેક પ્રદૂષકને આવરે, અને કેન્દ્ર સરકારને ધોરણ, ઉદ્યોગ પર મર્યાદા અને નિયમ બનાવવાની સત્તા આપે - તેથી જ EIA જાહેરનામું અને બધા કચરા નિયમો તેની નીચે છે. 1974નો અધિનિયમ નદીની સમસ્યાનો જવાબ હતો; 1986નો ભોપાલનો."}}, {"q": {"en": "What is consent to establish and consent to operate?", "gu": "સ્થાપના સંમતિ અને સંચાલન સંમતિ શું છે?"}, "a": {"en": "Two permissions from the State Pollution Control Board. Consent to establish is taken before construction and checks that the site, the process and the planned pollution control are acceptable. Consent to operate is taken before production starts and states the permitted quantity and quality of effluent and emission, the monitoring and the conditions. Both are time-bound and renewable, and operating beyond the conditions or after expiry is an offence under the Water and Air Acts.", "gu": "રાજ્ય પ્રદૂષણ નિયંત્રણ બોર્ડની બે પરવાનગી. સ્થાપના સંમતિ બાંધકામ પહેલાં લેવાય અને સ્થળ, પ્રક્રિયા તથા યોજાયેલું પ્રદૂષણ નિયંત્રણ સ્વીકાર્ય છે કે નહીં તે તપાસે. સંચાલન સંમતિ ઉત્પાદન શરૂ કરતાં પહેલાં લેવાય અને મંજૂર પ્રવાહ તથા ઉત્સર્જનનું પ્રમાણ અને ગુણવત્તા, દેખરેખ અને શરતો જણાવે. બંને સમયબદ્ધ અને નવીકરણપાત્ર છે, અને શરતોથી બહાર કે મુદત પછી ચલાવવું જળ અને વાયુ અધિનિયમો હેઠળ ગુનો છે."}}, {"q": {"en": "Which projects need environmental clearance, and what does it contain?", "gu": "કયા પ્રોજેક્ટને પર્યાવરણીય મંજૂરી જોઈએ અને તેમાં શું હોય?"}, "a": {"en": "Under the EIA Notification 2006, projects are listed in a schedule and placed in category A (central appraisal) or B (state appraisal) by size and type: mining, thermal power, cement, chemicals, ports, highways, airports, large buildings and water projects. The clearance contains the environmental management plan, the conditions - green belt, effluent treatment, air quality monitoring, a six-monthly compliance report - and the period of validity. It can be amended, suspended or revoked.", "gu": "EIA જાહેરનામું 2006 હેઠળ પ્રોજેક્ટ અનુસૂચિમાં હોય અને કદ તથા પ્રકાર પ્રમાણે A શ્રેણી (કેન્દ્રીય આકલન) કે B શ્રેણી (રાજ્ય આકલન)માં આવે: ખાણ, થર્મલ વીજ, સિમેન્ટ, રસાયણ, બંદર, ધોરીમાર્ગ, વિમાનમથક, મોટી ઇમારત અને પાણીના પ્રોજેક્ટ. મંજૂરીમાં પર્યાવરણીય વ્યવસ્થાપન યોજના, શરતો - લીલો પટ્ટો, પ્રવાહ સારવાર, હવાની ગુણવત્તાની દેખરેખ, દર છ મહિને અનુપાલન અહેવાલ - અને માન્યતા સમય હોય. તે સુધારી, સ્થગિત કે રદ કરી શકાય."}}, {"q": {"en": "What does ISO 14001 actually require?", "gu": "ISO 14001 ખરેખર શું માંગે છે?"}, "a": {"en": "A documented environmental management system built on plan-do-check-act: a scope and policy, a register of environmental aspects and impacts with the significant ones identified, a register of legal and other requirements, objectives with targets and programmes, defined roles and training, documented operational control and emergency preparedness, monitoring and measurement, internal audit, management review and corrective action. There is no absolute performance standard - a certified plant is not automatically clean, it has a system that keeps improving.", "gu": "આયોજન-અમલ-તપાસ-સુધારો પર બનેલી લેખિત પર્યાવરણીય વ્યવસ્થાપન પ્રણાલી: વ્યાપ અને નીતિ, પર્યાવરણીય પાસાં અને અસરોનું રજિસ્ટર જેમાં મહત્ત્વનાં ઓળખાય, કાનૂની અને બીજી ફરજોનું રજિસ્ટર, લક્ષ્ય સાથેના ઉદ્દેશ અને કાર્યક્રમ, નક્કી કરેલી ભૂમિકા અને તાલીમ, લેખિત સંચાલન નિયંત્રણ અને આપાતકાલીન તૈયારી, દેખરેખ અને માપન, આંતરિક તપાસ, વ્યવસ્થાપન સમીક્ષા અને સુધારાત્મક કાર્ય. કોઈ નિરપેક્ષ કાર્યદક્ષતા ધોરણ નથી - પ્રમાણિત કારખાનું આપોઆપ સ્વચ્છ નથી, તેની પાસે સતત સુધરતી પ્રણાલી છે."}}, {"q": {"en": "What is the precautionary principle and how does it change a decision?", "gu": "સાવચેતીનો સિદ્ધાંત શું છે અને તે નિર્ણય કેવી રીતે બદલે?"}, "a": {"en": "It says that where there is a threat of serious or irreversible damage, a lack of full scientific certainty is not a reason to postpone a cheap measure that prevents it. It reverses the usual burden: the promoter must show that the risk is acceptable rather than the public proving harm after it has happened. A dyeing unit that wants to discharge into a river must first show the effluent is safe, and a new chemical must be tested before release, not after a fish kill - which is why the principle is written into the Environment (Protection) Act and the EIA process.", "gu": "તે કહે છે કે ગંભીર કે પાછું ન ફરે તેવું નુકસાન થવાની ધમકી હોય ત્યાં પૂરી વૈજ્ઞાનિક ખાતરી ન હોવી એ તેને રોકતા સસ્તા પગલાને મુલતવી રાખવાનું કારણ નથી. તે સામાન્ય ભાર ઊંધો કરે: જાહેર જનતા નુકસાન થયા પછી પુરવાર કરે તેને બદલે પ્રસ્તાવકે જોખમ સ્વીકાર્ય છે તે બતાવવું પડે. નદીમાં છોડવા માંગતા રંગાઇ એકમે પહેલાં પ્રવાહ સુરક્ષિત છે તે બતાવવું પડે, અને નવું રસાયણ માછલી મર્યા પછી નહીં, છોડતાં પહેલાં કસાય - તેથી જ આ સિદ્ધાંત પર્યાવરણ (સંરક્ષણ) અધિનિયમ અને EIA પ્રક્રિયામાં લખાયેલો છે."}}, {"q": {"en": "What is an environmental aspect and what is an environmental impact?", "gu": "પર્યાવરણીય પાસું શું છે અને પર્યાવરણીય અસર શું છે?"}, "a": {"en": "An aspect is the element of an activity, product or service that interacts with the environment - what the plant does. An impact is the resulting change in the environment - what the environment suffers. In a foundry, 'charging the furnace with scrap' and 'pouring molten metal' are aspects; 'dust in the ambient air', 'heat stress for the workers' and 'sand going to landfill' are impacts. One aspect can have several impacts, and the significance score combines severity, likelihood, legal limit and stakeholder concern. The system only works if the two columns are kept apart.", "gu": "પાસું એ પ્રવૃત્તિ, ઉત્પાદન કે સેવાનું પર્યાવરણ સાથે સંબંધ ધરાવતું અંગ છે - કારખાનું શું કરે છે. અસર એ પર્યાવરણમાં થતો પરિણામી ફેરફાર છે - પર્યાવરણને શું સહેવું પડે છે. ફાઉન્ડ્રીમાં 'ભઠ્ઠીમાં ભંગાર ભરવો' અને 'ઓગળેલી ધાતુ રેડવી' પાસાં છે; 'આસપાસની હવામાં ધૂળ', 'કામદારો પર ગરમીનો તણાવ' અને 'રેતી લેન્ડફિલમાં જવી' અસરો છે. એક પાસાની ઘણી અસરો હોઈ શકે, અને મહત્ત્વનો અંક ગંભીરતા, શક્યતા, કાનૂની મર્યાદા અને હિતધારકની ચિંતા જોડે. બે કોલમ અલગ રહે તો જ પ્રણાલી ચાલે."}}, {"q": {"en": "Why did the Bhopal gas tragedy lead to a new law?", "gu": "ભોપાલ ગેસ દુર્ઘટના નવો કાયદો કેમ લાવી?"}, "a": {"en": "On the night of 2-3 December 1984 methyl isocyanate escaped from a pesticide plant in Bhopal and killed several thousand people and injured lakhs. The legal gap it exposed was that the existing laws controlled pollution from a running factory into a river or a chimney, but had no power over a stored chemical, an accident, an emergency plan or the liability of a multinational. Parliament answered with the Environment (Protection) Act 1986, which covers handling of hazardous substances, gives the centre power to set standards and order closure, and was followed by the Public Liability Insurance Act, the hazardous waste rules and the National Green Tribunal. The lesson for an engineer is that the most dangerous part of a plant is often the storage tank, not the chimney.", "gu": "2-3 ડિસેમ્બર 1984ની રાત્રે ભોપાલની જંતનાશક કારખાનામાંથી મિથાઇલ આઇસોસાયનેટ નીકળીને હજારો લોકોને મારી નાખ્યા અને લાખોને ઘાયલ કર્યા. તે જે કાનૂની ખાલી જગ્યા ખોલી તે એ હતી કે હાલના કાયદા ચાલુ કારખાનાના નદી કે ચીમનીમાં પ્રદૂષણને નિયંત્રિત કરતા, પણ સંગ્રહિત રસાયણ, અકસ્માત, આપાતકાલીન યોજના કે બહુરાષ્ટ્રીય કંપનીની જવાબદારી પર સત્તા નહોતી. સંસદે પર્યાવરણ (સંરક્ષણ) અધિનિયમ 1986થી જવાબ આપ્યો, જે જોખમી પદાર્થની સંભાળ આવરે, કેન્દ્રને ધોરણ નક્કી કરવા અને બંધ કરવાની સત્તા આપે, અને પછી જાહેર જવાબદારી વીમા અધિનિયમ, જોખમી કચરા નિયમો અને રાષ્ટ્રીય લીલું ટ્રિબ્યુનલ આવ્યાં. ઇજનેર માટે પાઠ એ છે કે કારખાનાનો સૌથી જોખમી ભાગ ઘણી વાર સંગ્રહ ટાંકી હોય, ચીમની નહીં."}}]}, {"title": {"en": "Green practice, 5R and tourism", "gu": "લીલી પદ્ધતિ, 5R અને પર્યટન"}, "items": [{"q": {"en": "What is cradle to cradle and how is it different from recycling?", "gu": "ક્રેડલ ટુ ક્રેડલ શું છે અને રિસાયકલથી કેવી રીતે જુદું છે?"}, "a": {"en": "Recycling breaks a product down, often into a lower grade, and is done after the product becomes waste. Cradle to cradle designs the product from the start so that it has no waste: every material is either a biological nutrient that safely returns to the soil or a technical nutrient that returns to industry at the same quality, and the product is assembled so that it can be taken apart. It also asks that the energy and water used are renewable and clean, and that the whole supply chain is designed around that loop.", "gu": "રિસાયકલ ઉત્પાદનને તોડે છે, ઘણી વાર નીચી કક્ષામાં, અને તે ઉત્પાદન કચરો બન્યા પછી થાય. ક્રેડલ ટુ ક્રેડલ ઉત્પાદનને શરૂઆતથી એવી રીતે રચે કે તેમાં કચરો જ ન હોય: દરેક સામગ્રી કાં તો જૈવિક પોષક છે જે સુરક્ષિત રીતે જમીનમાં પાછું જાય, કાં તો ટેકનિકલ પોષક જે એ જ ગુણવત્તાએ ઉદ્યોગમાં પાછું જાય, અને ઉત્પાદન એવી રીતે જોડાય કે તે છૂટું થઈ શકે. તે એ પણ માંગે કે વપરાતી ઊર્જા અને પાણી પુનઃપ્રાપ્ય તથા સ્વચ્છ હોય, અને આખી પુરવઠા શૃંખલા તે ચક્ર પર રચાય."}}, {"q": {"en": "What are the four steps of a life cycle analysis?", "gu": "જીવનચક્ર આકલનનાં ચાર પગલાં કયાં છે?"}, "a": {"en": "Goal and scope definition - what is compared, the functional unit and where the boundary is drawn, cradle to gate or cradle to grave. Inventory analysis - the energy, water, raw material, emission and waste per functional unit, collected from the process. Impact assessment - the inventory translated into categories such as global warming, acidification, eutrophication, water scarcity and toxicity, using characterisation factors. Interpretation - the significant findings, the sensitivity and the recommendation, with the assumption that would change the answer stated openly.", "gu": "ધ્યેય અને વ્યાપની વ્યાખ્યા - શું સરખાય છે, કાર્યાત્મક એકમ શું અને સીમા ક્યાં છે, ક્રેડલ ટુ ગેટ કે ક્રેડલ ટુ ગ્રેવ. યાદી વિશ્લેષણ - કાર્યાત્મક એકમ દીઠ ઊર્જા, પાણી, કાચો માલ, ઉત્સર્જન અને કચરો, પ્રક્રિયામાંથી એકઠા કરેલા. અસર આકલન - યાદીને વૈશ્વિક ગરમી, અમ્લતા, પોષકતત્ત્વ વૃદ્ધિ, પાણીની તંગી અને ઝેર જેવી શ્રેણીઓમાં ગુણધર્મ અવયવ વાપરીને ફેરવવી. અર્થઘટન - મહત્ત્વનાં તારણો, સંવેદનશીલતા અને સૂચન, અને જે ધારણા જવાબ બદલી શકે તે ખુલ્લેઆમ જણાવવી."}}, {"q": {"en": "What are the advantages and disadvantages of carbon credits?", "gu": "કાર્બન ક્રેડિટના લાભ અને ખામી શું છે?"}, "a": {"en": "Advantages: they move money from high-emitting buyers to low-cost clean projects, so the cheapest abatement happens first; they create a revenue stream for a project that a local tariff cannot fully fund; and they put a price on carbon without a tax. Disadvantages: additionality is hard to prove, so a credit may pay for something that would have happened anyway; a rich buyer can use a cheap credit to avoid cutting its own emissions; verification costs money; credits can be double counted between two registries; and a project that is destroyed by fire or flood leaves the promised reduction unearned.", "gu": "લાભ: નાણું વધુ છોડતા ખરીદનાર પાસેથી ઓછા ખર્ચવાળા સ્વચ્છ પ્રોજેક્ટ તરફ ખસે, તેથી સૌથી સસ્તો ઘટાડો પહેલાં થાય; સ્થાનિક ટેરિફ પૂરો ભંડોળ ન કરી શકે તેવા પ્રોજેક્ટને આવક મળે; અને કર વગર કાર્બનને ભાવ મળે. ખામી: અતિરિક્તતા પુરવાર કરવી કઠિન છે, તેથી ક્રેડિટ કોઈ પણ રીતે થાત તેવા કામ માટે ચૂકવાઈ શકે; શ્રીમંત ખરીદનાર સસ્તી ક્રેડિટ વાપરીને પોતાનું ઉત્સર્જન ઘટાડવાનું ટાળી શકે; ચકાસણી પૈસા માંગે; બે રજિસ્ટર વચ્ચે ક્રેડિટ બે વાર ગણાઈ શકે; અને આગ કે પૂરથી નષ્ટ થયેલો પ્રોજેક્ટ વચન આપેલો ઘટાડો અધૂરો છોડે."}}, {"q": {"en": "Explain the 5R with one example each.", "gu": "દરેકના એક ઉદાહરણ સાથે 5R સમજાવો."}, "a": {"en": "Refuse: carry a cloth bag so the shop's plastic bag is never made. Reduce: a five-star air conditioner or a bucket bath instead of a shower. Reuse: a steel water bottle refilled for years. Repurpose: a tyre becomes a planter, an ice-cream tub becomes a storage box. Recycle: newspaper, aluminium cans and PET bottles go to a recycler who turns them back into material. The order is a preference order, because the rungs above recycling need no energy, no transport and no market.", "gu": "નકારો: કાપડની થેલી લઈ જાઓ જેથી દુકાનની પ્લાસ્ટિક થેલી બનેજ નહીં. ઘટાડો: પાંચ સ્ટાર એરકન્ડીશનર કે ફુવારાને બદલે ડોલથી સ્નાન. ફરી વાપરો: પોલાદની પાણીની બોટલ વર્ષો સુધી ફરી ભરાય. નવો ઉપયોગ: ટાયર કૂંડું બને, આઇસ્ક્રીમનું ડબ્બો સંગ્રહ પેટી બને. રિસાયકલ: છાપું, એલ્યુમિનિયમનાં ડબ્બા અને PET બોટલ રિસાયકલરને જાય જે તેમને ફરી સામગ્રી બનાવે. ક્રમ પસંદગીનો ક્રમ છે, કારણ કે રિસાયકલની ઉપરનાં પગથિયાંને ઊર્જા, વહન કે બજાર જોઈએ નહીં."}}, {"q": {"en": "What is carrying capacity in eco tourism?", "gu": "પર્યાવરણ પર્યટનમાં વહન ક્ષમતા શું છે?"}, "a": {"en": "The number of visitors a place can absorb per day or per season without damaging what they came to see - the trail, the nesting beach, the coral, the water supply and the local community. It is found by study, not by guess: vegetation loss on the trail, animal flight distance, sewage load, parking and noise. Once the number is set it must be enforced with permits, timed entry, a closed day each week and a fee that rises in the peak, because a capacity that exists only on paper is not a capacity.", "gu": "પ્રવાસીઓ જે જોવા આવ્યા તેને - પગપાળા માર્ગ, ઇંડા મૂકતો દરિયાકિનારો, ભરતી, પાણી પુરવઠો અને સ્થાનિક સમુદાય - નુકસાન પહોંચાડ્યા વગર જગ્યા રોજ કે ઋતુ દીઠ કેટલા પ્રવાસી સહી શકે તે સંખ્યા. તે અભ્યાસથી મળે, અનુમાનથી નહીં: માર્ગ પર વનસ્પતિનું નુકસાન, પ્રાણીનું ભાગી જવાનું અંતર, ગટરનો ભાર, પાર્કિંગ અને ઘોંઘાટ. સંખ્યા નક્કી થાય પછી પરવાનગી, સમયબદ્ધ પ્રવેશ, અઠવાડિયે એક બંધ દિવસ અને ટોચની ઋતુમાં વધતી ફી દ્વારા લાગુ કરવી પડે, કારણ કે ફક્ત કાગળ પરની ક્ષમતા ક્ષમતા નથી."}}, {"q": {"en": "Why is a green building not just a building with solar panels?", "gu": "લીલી ઇમારત ફક્ત સૌર પેનલવાળી ઇમારત કેમ નથી?"}, "a": {"en": "Because most of the saving comes before any equipment is bought. Orientation, shading, insulation, glazing, a cool roof and natural ventilation reduce the cooling load, and an efficient chiller, LED lighting and controls reduce what is left; a solar array sized to a badly designed building must be two or three times larger for the same comfort. A rated building also cuts water use, uses low-carbon material, manages construction waste, and provides daylight and fresh air for the occupants, which is measured in productivity as well as in units.", "gu": "કારણ કે મોટાભાગની બચત કોઈ પણ સાધન ખરીદતાં પહેલાં આવે. દિશા, છાયો, ઇન્સ્યુલેશન, કાચ, ઠંડી છત અને કુદરતી હવાડો ઠંડકનો ભાર ઘટાડે, અને કાર્યક્ષમ ચિલર, LED લાઇટ તથા નિયંત્રણ બાકીનું ઘટાડે; ખરાબ રચાયેલી ઇમારત માટે માપેલી સૌર એરે એ જ આરામ માટે બે-ત્રણ ગણી મોટી જોઈએ. રેટેડ ઇમારત પાણીનો વપરાશ પણ ઘટાડે, ઓછા કાર્બનવાળી સામગ્રી વાપરે, બાંધકામનો કચરો સંભાળે, અને રહેવાસીઓને દિવસનો પ્રકાશ તથા તાજી હવા આપે, જે યુનિટ ઉપરાંત ઉત્પાદકતામાં પણ માપાય."}}, {"q": {"en": "What is a green label and why does it matter to a buyer?", "gu": "લીલું લેબલ શું છે અને ખરીદનાર માટે તે કેમ મહત્ત્વનું છે?"}, "a": {"en": "A green label is a mark awarded by a third party to a product or building that meets a published environmental criterion, such as energy use, water use, recycled content, emissions or recyclability. It matters because it turns a claim into verified information: a buyer cannot measure the embodied carbon of a paint tin or the power draw of a refrigerator, but an auditor can. It also rewards the manufacturer who spends money on the improvement, and it is only as good as the audit behind it - a label with no surveillance is advertising.", "gu": "લીલું લેબલ ત્રીજા પક્ષે પ્રકાશિત પર્યાવરણીય માપદંડ - જેમ કે ઊર્જા વપરાશ, પાણી વપરાશ, રિસાયકલ સામગ્રી, ઉત્સર્જન કે રિસાયકલ થઈ શકે તેવાપણું - પૂરો કરતા ઉત્પાદન કે ઇમારતને આપેલું ચિહ્ન છે. તે મહત્ત્વનું છે કારણ કે દાવાને ચકાસાયેલી માહિતીમાં ફેરવે: ખરીદનાર રંગની ટિનનો સન્નિહિત કાર્બન કે ફ્રિજનો વીજ વપરાશ માપી ન શકે, પણ તપાસકર્તા માપી શકે. તે સુધારા પર પૈસો ખર્ચતા ઉત્પાદકને બક્ષીશ પણ આપે, અને તે પાછળની તપાસ જેટલું જ સારું છે - દેખરેખ વગરનું લેબલ જાહેરાત છે."}}]}], "exam_questions": [{"q": {"en": "Practice: Explain the main environmental laws of India and the instrument each one uses.", "gu": "સરાવ: ભારતના મુખ્ય પર્યાવરણીય કાયદા અને દરેક વાપરતું સાધન સમજાવો."}, "marks": 5}, {"q": {"en": "Practice: Describe ISO 14001 with its PDCA cycle and list the benefits of certification.", "gu": "સરાવ: ISO 14001 તેના PDCA ચક્ર સાથે વર્ણવો અને પ્રમાણીકરણના લાભ ગણાવો."}, "marks": 5}, {"q": {"en": "Practice: Design a rain water harvesting system for a school and calculate what it saves.", "gu": "સરાવ: શાળા માટે વરસાદી જળ સંગ્રહ પ્રણાલી રચો અને તે કેટલું બચાવે તે ગણો."}, "marks": 5}, {"q": {"en": "Practice: Compare GRIHA, IGBC and LEED and explain what a rating measures.", "gu": "સરાવ: GRIHA, IGBC અને LEEDની સરખામણી કરો અને રેટિંગ શું માપે તે સમજાવો."}, "marks": 4}, {"q": {"en": "Practice: Explain cradle to cradle, life cycle analysis and a green label with one example each.", "gu": "સરાવ: ક્રેડલ ટુ ક્રેડલ, જીવનચક્ર આકલન અને લીલું લેબલ દરેકના એક ઉદાહરણ સાથે સમજાવો."}, "marks": 5}, {"q": {"en": "Practice: Explain the carbon credit system with its advantages and disadvantages.", "gu": "સરાવ: કાર્બન ક્રેડિટ પ્રણાલી તેના લાભ અને ખામી સાથે સમજાવો."}, "marks": 5}, {"q": {"en": "Practice: A city council asks you to cut its waste. Prepare a 5R plan with numbers.", "gu": "સરાવ: એક નગર પરિષદ તમને તેનો કચરો ઘટાડવા કહે છે. આંકડા સાથે 5R યોજના બનાવો."}, "marks": 5}, {"q": {"en": "Practice: Explain eco tourism with five advantages, five disadvantages and one way to regulate it.", "gu": "સરાવ: પાંચ લાભ, પાંચ ખામી અને નિયંત્રણની એક રીત સાથે પર્યાવરણ પર્યટન સમજાવો."}, "marks": 5}, {"q": {"en": "Practice: Explain the Biological Diversity Act 2002 with an example of benefit sharing.", "gu": "સરાવ: જૈવિક વિવિધતા અધિનિયમ 2002 લાભ વહેંચણીના ઉદાહરણ સાથે સમજાવો."}, "marks": 4}, {"q": {"en": "Practice: How would you verify that a campus is really sustainable and not only painted green?", "gu": "સરાવ: કેમ્પસ ખરેખર ટકાઉ છે કે ફક્ત લીલું રંગાયું છે તે કેવી રીતે ચકાસશો?"}, "marks": 5}, {"q": {"en": "Practice: Write short notes on the National Green Tribunal and the polluter pays principle.", "gu": "સરાવ: રાષ્ટ્રીય લીલું ટ્રિબ્યુનલ અને પ્રદૂષક ચૂકવે સિદ્ધાંત પર ટૂંકી નોંધ લખો."}, "marks": 4}, {"q": {"en": "Practice: What is an environmental management system? Explain its elements with the PDCA cycle and state the limitation of certification.", "gu": "સરાવ: પર્યાવરણીય વ્યવસ્થાપન પ્રણાલી શું છે? PDCA ચક્ર સાથે તેનાં અંગો સમજાવો અને પ્રમાણીકરણની મર્યાદા જણાવો."}, "marks": 5}], "learning_outcomes": [{"en": "Adopt cleaner technologies in your field in compliance with the environmental policies and standards of India.", "gu": "ભારતની પર્યાવરણ નીતિઓ અને ધોરણોનું પાલન કરી તમારા ક્ષેત્રમાં સ્વચ્છ ટેકનોલોજી અપનાવવી."}], "course_outcomes": ["CO5"], "practical_numbers": [], "content_kind": "theory", "lesson_count": 9, "answered_practice_count": 12, "assessment_note": {"en": "Official course: theory ESE 70 + PA 30 = 100 marks, 2 credits, 30 teaching hours, no practical. This unit carries 20 % weightage, 6 of the 30 hours and 14 of the 70 theory marks (the PDF prints weightage only, so the marks are split by weightage). Practice marks 3/4/5 are suggested revision sizes, not GTU allocations. Model answers are in Notes section 5.", "gu": "અધિકૃત કોર્સ: થિયરી ESE 70 + PA 30 = 100 માર્ક્સ, 2 ક્રેડિટ, 30 શિક્ષણ કલાક, પ્રેક્ટિકલ નથી. આ યુનિટનું વેઇટેજ 20 %, 30માંથી 6 કલાક અને 70 થિયરી માર્ક્સમાંથી 14 માર્ક્સ (PDFમાં ફક્ત વેઇટેજ છે, તેથી માર્ક્સ વેઇટેજ પ્રમાણે વહેંચ્યા છે). સરાવના 3/4/5 માર્ક્સ સૂચિત પુનરાવર્તન માપ છે, GTU ફાળવણી નહીં. આદર્શ જવાબો નોંધ વિભાગ 5માં છે."}, "question_provenance": "Original answered revision questions; not official past papers", "question_marks_are_suggested": true, "sources": [{"title": "GTU DI02000051 Environmental Sustainability syllabus (uploaded PDF, w.e.f. 2024-25)", "url": "https://syllabus.gtu.ac.in/"}, {"title": "MoEFCC - The Air (Prevention and Control of Pollution) Act 1981, Water Act 1974, Environment (Protection) Act 1986 and the EIA Notification 2006", "url": "https://www.envis.nic.in/"}, {"title": "BIS IS/ISO 14001:2015 Environmental management systems - requirements with guidance for use", "url": "https://www.envis.nic.in/"}, {"title": "IGBC Green New Buildings rating system, GRIHA manual (MNRE and TERI) and BEE ECBC 2017", "url": "https://www.envis.nic.in/"}, {"title": "CGWA rainwater harvesting guidelines, CPCB guidelines and the Biological Diversity Act 2002", "url": "https://www.envis.nic.in/"}]};

 stroke=\"#B66A00\" stroke-width=\"1.4\"/><text x=\"24\" y=\"194.0\" font-size=\"8.6\" text-anchor=\"start\" fill=\"#B66A00\" font-weight=\"bold\">4 storage tank</text><text x=\"24\" y=\"206.6\" font-size=\"7.4\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">40 m3 RCC, mosquito-proof cover, overflow pipe</text><path d=\"M180 211L180.0 213.8\" fill=\"none\" stroke=\"#666\" stroke-width=\"1.2\" stroke-linecap=\"round\"/><path d=\"M182.5 212.0L180.0 218.0L177.5 212.0Z\" fill=\"#666\"/><rect x=\"14\" y=\"218\" width=\"332\" height=\"34\" rx=\"6\" fill=\"#FFFFFF\" stroke=\"#7B2CD9\" stroke-width=\"1.4\"/><text x=\"24\" y=\"235.0\" font-size=\"8.6\" text-anchor=\"start\" fill=\"#7B2CD9\" font-weight=\"bold\">5 recharge pit</text><text x=\"24\" y=\"247.6\" font-size=\"7.4\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">3 m x 3 m of boulders, gravel and sand</text><rect x=\"8\" y=\"259\" width=\"344\" height=\"28\" rx=\"6\" fill=\"#EAF6EC\" stroke=\"#2E7D32\" stroke-width=\"1.4\"/><text x=\"180\" y=\"273.9\" font-size=\"8.2\" text-anchor=\"middle\" fill=\"#2E7D32\" font-weight=\"bold\">V = roof area x rain x runoff coefficient</text><text x=\"180\" y=\"284.5\" font-size=\"7.2\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">800 x 1.0 m x 0.85 = 680 m3, about 6,80,000 litres a year</text><text x=\"180\" y=\"306.1\" font-size=\"9.0\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">Store what the school needs, recharge the rest into the aquifer.</text><text x=\"180\" y=\"320.1\" font-size=\"9.0\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">A tank that is not cleaned is a mosquito farm, not a water source.</text></svg>", "u5_credits": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 292\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"292\" fill=\"#ffffff\"/><text x=\"180\" y=\"25.4\" font-size=\"12.6\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">Follow one   return (U[typeof key==='string'?key:'syntax']||[]).map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><pre class="code sx">${hl(e.f)}</pre></span>${chev}</div>
     <div class="a">${e.terms && t(e.terms) ? fixTables(t(e.terms)) : ''}</div></div>`).join('') + `</div>`).join('');
}
const flowcharts = diagrams;
const algorithms = () => syntax('algorithms');
const ALLV = {notes, programs, diagrams, flowcharts, algorithms, syntax, equations, numericals, viva, exam};
const VIEWS = U.tabs ? Object.fromEntries(U.tabs.map(k=>[k, ALLV[k]])) : U.programs ? (META.code_lang==='python' ? {notes, programs, diagrams, syntax, viva, exam} : {notes, programs, flowcharts, syntax, viva, exam}) : U.numericals ? {notes, diagrams, equations, numericals, viva, exam} : {notes, diagrams, equations, viva, exam};
function render(){
  document.getElementById('title').textContent = `${L('unit')} ${U.unit}: ${t(U.title)}`;
  document.getElementById('sub').textContent = `${t(META.name)} · ${META.code}`;
  document.getElementById('lang').textContent = S.lang==='en' ? 'ગુ' : 'EN';
  document.getElementById('lang').style.display = META.languages.includes('gu') ? '' : 'none';
  document.getElementById('tabs').innerHTML = Object.keys(VIEWS).map(k=>`<button class="tab${S.tab===k?' on':''}" data-tab="${k}">${L(k)}</button>`).join('');
  document.getElementById('view').innerHTML = VIEWS[S.tab]();
  document.querySelectorAll('#view pre.c').forEach(e=>{ e.innerHTML = hl(e.textContent); e.className='code'; });
}
let zoom = 1;
function setZoom(z){ zoom = Math.min(4, Math.max(1, z)); const w=document.getElementById('zw'); w.style.width=(zoom*100)+'%'; document.getElementById('zr').textContent=Math.round(zoom*100)+'%'; }
document.addEventListener('click', e=>{
  const q = e.target.closest('.q'); if (q && q.parentElement.querySelector('.a')) { q.parentElement.classList.toggle('open'); return; }
  const tb = e.target.closest('[data-tab]'); if (tb){ S.tab = tb.dataset.tab; render(); window.scrollTo(0,0); return; }
  if (e.target.closest('#lang')){ S.lang = S.lang==='en'?'gu':'en'; render(); return; }
  const m = e.target.closest('[data-more]');
  document.querySelectorAll('.menu.show').forEach(x=>{ if(!m || x!==m.nextElementSibling) x.classList.remove('show'); });
  if (m){ m.nextElementSibling.classList.toggle('show'); return; }
  const act = e.target.closest('[data-act]');
  if (act){ act.closest('.sec').querySelectorAll('.card').forEach(c=>{ if(c.querySelector('.a')) c.classList.toggle('open', act.dataset.act==='expand'); }); act.parentElement.classList.remove('show'); return; }
  const dg = e.target.closest('[data-dg]');
  if (dg){ const id=dg.dataset.dg; document.getElementById('mt').textContent=t(U.diagrams.find(d=>d.id===id).title); document.getElementById('zw').innerHTML=SVG[id]; setZoom(1); document.getElementById('modal').classList.add('show'); return; }
  if (e.target.closest('#mx')) document.getElementById('modal').classList.remove('show');
  if (e.target.closest('#zi')) setZoom(zoom+0.5);
  if (e.target.closest('#zo')) setZoom(zoom-0.5);
  if (e.target.closest('#zr')) setZoom(1);
});
render();
</script>
