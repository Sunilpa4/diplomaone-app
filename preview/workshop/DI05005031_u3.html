r is</text><text x=\"180.0\" y=\"221.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">real; run two of them and let them agree before you trust the number.</text></svg>", "u3_diff": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 292\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"292\" fill=\"#ffffff\"/><text x=\"180.0\" y=\"24.3\" font-size=\"12.2\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"bold\">The differential method: slopes, then a log-log line</text><text x=\"180.0\" y=\"40.2\" font-size=\"9.2\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">each tangent is one rate; the line gives n and k</text><rect x=\"6.0\" y=\"52.0\" width=\"168.0\" height=\"198.0\" rx=\"6\" fill=\"#FBFCFD\" stroke=\"#9AA3AD\" stroke-width=\"0.9\"/><text x=\"90\" y=\"70.8\" font-size=\"8.0\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"bold\">1. draw the C-t curve</text><path d=\"M34.0 196.0L34.0 92.0\" fill=\"none\" stroke=\"#222222\" stroke-width=\"1.3\" stroke-linecap=\"round\"/><path d=\"M32.2 97.0L34.0 92.0L35.8 97.0Z\" fill=\"#222222\"/><path d=\"M34.0 196.0L156.0 196.0\" fill=\"none\" stroke=\"#222222\" stroke-width=\"1.3\" stroke-linecap=\"round\"/><path d=\"M151.0 194.2L156.0 196.0L151.0 197.8Z\" fill=\"#222222\"/><text x=\"156\" y=\"212.1\" font-size=\"8.799999999999999\" text-anchor=\"end\" fill=\"#222222\" font-weight=\"bold\">t</text><text x=\"31\" y=\"87.1\" font-size=\"8.799999999999999\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"bold\">CA</text><path d=\"M34.0 96.0L38.0 103.9L42.0 111.3L46.0 118.0L50.0 124.2L54.0 129.9L58.0 135.1L62.0 140.0L66.0 144.4L70.0 148.5L74.0 152.3L78.0 155.8L82.0 159.0L86.0 161.9L90.0 164.6L94.0 167.1L98.0 169.4L102.0 171.5L106.0 173.5L110.0 175.2L114.0 176.9L118.0 178.4L122.0 179.8L126.0 181.1L130.0 182.3L134.0 183.4L138.0 184.4L142.0 185.3L146.0 186.1L150.0 186.9\" fill=\"none\" stroke=\"#1565C0\" stroke-width=\"2.0\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><path d=\"M63.0 142.3L85.0 162.2\" fill=\"none\" stroke=\"#BD2543\" stroke-width=\"1.9\" stroke-linecap=\"round\"/><circle cx=\"74.0\" cy=\"152.3\" r=\"2.0\" fill=\"#BD2543\"/><circle cx=\"62.0\" cy=\"122.8\" r=\"5.2\" fill=\"#FFFFFF\" stroke=\"#BD2543\" stroke-width=\"1\"/><text x=\"62\" y=\"127.7\" font-size=\"6.6\" text-anchor=\"middle\" fill=\"#BD2543\" font-weight=\"bold\">1</text><path d=\"M101.0 171.6L123.0 180.6\" fill=\"none\" stroke=\"#BD2543\" stroke-width=\"1.9\" stroke-linecap=\"round\"/><circle cx=\"112.0\" cy=\"176.1\" r=\"2.0\" fill=\"#BD2543\"/><circle cx=\"100.0\" cy=\"154.5\" r=\"5.2\" fill=\"#FFFFFF\" stroke=\"#BD2543\" stroke-width=\"1\"/><text x=\"100\" y=\"159.4\" font-size=\"6.6\" text-anchor=\"middle\" fill=\"#BD2543\" font-weight=\"bold\">2</text><text x=\"90\" y=\"238.6\" font-size=\"7.4\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">each red tangent is one rate</text><rect x=\"184.0\" y=\"52.0\" width=\"170.0\" height=\"198.0\" rx=\"6\" fill=\"#FBFCFD\" stroke=\"#9AA3AD\" stroke-width=\"0.9\"/><text x=\"269\" y=\"70.8\" font-size=\"8.0\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"bold\">2. plot ln(-rA) against ln CA</text><path d=\"M216.0 196.0L216.0 92.0\" fill=\"none\" stroke=\"#222222\" stroke-width=\"1.3\" stroke-linecap=\"round\"/><path d=\"M214.2 97.0L216.0 92.0L217.8 97.0Z\" fill=\"#222222\"/><path d=\"M216.0 196.0L338.0 196.0\" fill=\"none\" stroke=\"#222222\" stroke-width=\"1.3\" stroke-linecap=\"round\"/><path d=\"M333.0 194.2L338.0 196.0L333.0 197.8Z\" fill=\"#222222\"/><text x=\"338\" y=\"212.1\" font-size=\"8.799999999999999\" text-anchor=\"end\" fill=\"#222222\" font-weight=\"bold\">ln CA</text><text x=\"213\" y=\"87.1\" font-size=\"8.799999999999999\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"bold\">ln(-rA)</text><path d=\"M219.0 190.0L330.0 125.0\" fill=\"none\" stroke=\"#9AA3AD\" stroke-width=\"0.9\" stroke-linecap=\"round\" stroke-dasharray=\"3,3\"/><path d=\"M219.0 190.0L250.0 172.0L281.0 154.0L312.0 136.0L330.0 125.0\" fill=\"none\" stroke=\"#2E7D32\" stroke-width=\"2.0\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><circle cx=\"228.0\" cy=\"185.0\" r=\"2.2\" fill=\"#BD2543\"/><circle cx=\"272.0\" cy=\"160.0\" r=\"2.2\" fill=\"#BD2543\"/><circle cx=\"316.0\" cy=\"134.0\" r=\"2.2\" fill=\"#BD2543\"/><text x=\"330\" y=\"114.7\" font-size=\"7.6\" text-anchor=\"end\" fill=\"#2E7D32\" font-weight=\"bold\">slope = n</text><text x=\"269\" y=\"238.6\" font-size=\"7.4\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">the intercept is ln k</text><text x=\"180.0\" y=\"271.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">A tangent is a derivative, so read the rate at the mid-point of its interval;</text><text x=\"180.0\" y=\"283.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">a few points on a straight log-log line beat one cleverly drawn tangent.</text></svg>", "u3_integral_test": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 262\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"262\" fill=\"#ffffff\"/><text x=\"180.0\" y=\"24.3\" font-size=\"12.2\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"bold\">The integral method: which plot is straight</text><text x=\"180.0\" y=\"40.2\" font-size=\"9.2\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">guess the order, integrate, then look at the plot</text><rect x=\"6.0\" y=\"52.0\" width=\"348.0\" height=\"50.0\" rx=\"6\" fill=\"#FBFCFD\" stroke=\"#9AA3AD\" stroke-width=\"0.9\"/><text x=\"14\" y=\"74.8\" font-size=\"8.0\" text-anchor=\"start\" fill=\"#222222\" font-weight=\"bold\">Zero:  -rA = k</text><text x=\"14\" y=\"88.5\" font-size=\"7.2\" text-anchor=\"start\" fill=\"#666666\" font-weight=\"normal\">CA0 - CA = k t</text><path d=\"M118.0 60.0L118.0 94.0\" fill=\"none\" stroke=\"#222222\" stroke-width=\"1.0\" stroke-linecap=\"round\"/><path d=\"M118.0 94.0L172.0 94.0\" fill=\"none\" stroke=\"#222222\" stroke-width=\"1.0\" stroke-linecap=\"round\"/><path d=\"M122.0 64.0L124.1 65.1L126.2 66.1L128.3 67.2L130.3 68.3L132.4 69.4L134.5 70.4L136.6 71.5L138.7 72.6L140.8 73.7L142.9 74.7L145.0 75.8L147.0 76.9L149.1 78.0L151.2 79.0L153.3 80.1L155.4 81.2L157.5 82.3L159.6 83.3L161.7 84.4L163.7 85.5L165.8 86.6L167.9 87.6L170.0 88.7\" fill=\"none\" stroke=\"#1565C0\" stroke-width=\"1.8\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"190\" y=\"74.7\" font-size=\"7.6\" text-anchor=\"start\" fill=\"#2E7D32\" font-weight=\"bold\">C against t is a straight line</text><text x=\"190\" y=\"88.7\" font-size=\"7.6\" text-anchor=\"start\" fill=\"#222222\" font-weight=\"normal\">slope = -k</text><rect x=\"6.0\" y=\"110.0\" width=\"348.0\" height=\"50.0\" rx=\"6\" fill=\"#FBFCFD\" stroke=\"#9AA3AD\" stroke-width=\"0.9\"/><text x=\"14\" y=\"132.8\" font-size=\"8.0\" text-anchor=\"start\" fill=\"#222222\" font-weight=\"bold\">First:  -rA = k CA</text><text x=\"14\" y=\"146.5\" font-size=\"7.2\" text-anchor=\"start\" fill=\"#666666\" font-weight=\"normal\">ln(CA0/CA) = k t</text><path d=\"M118.0 118.0L118.0 152.0\" fill=\"none\" stroke=\"#222222\" stroke-width=\"1.0\" stroke-linecap=\"round\"/><path d=\"M118.0 152.0L172.0 152.0\" fill=\"none\" stroke=\"#222222\" stroke-width=\"1.0\" stroke-linecap=\"round\"/><path d=\"M122.0 122.0L124.1 125.1L126.2 127.7L128.3 130.1L130.3 132.1L132.4 134.0L134.5 135.5L136.6 136.9L138.7 138.2L140.8 139.2L142.9 140.2L145.0 141.0L147.0 141.7L149.1 142.4L151.2 142.9L153.3 143.4L155.4 143.9L157.5 144.2L159.6 144.6L161.7 144.9L163.7 145.1L165.8 145.3L167.9 145.5L170.0 145.7\" fill=\"none\" stroke=\"#1565C0\" stroke-width=\"1.8\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"190\" y=\"132.7\" font-size=\"7.6\" text-anchor=\"start\" fill=\"#2E7D32\" font-weight=\"bold\">ln C against t is straight</text><text x=\"190\" y=\"146.7\" font-size=\"7.6\" text-anchor=\"start\" fill=\"#222222\" font-weight=\"normal\">slope = -k</text><rect x=\"6.0\" y=\"168.0\" width=\"348.0\" height=\"50.0\" rx=\"6\" fill=\"#FBFCFD\" stroke=\"#9AA3AD\" stroke-width=\"0.9\"/><text x=\"14\" y=\"190.8\" font-size=\"8.0\" text-anchor=\"start\" fill=\"#222222\" font-weight=\"bold\">Second:  -rA = k CA^2</text><text x=\"14\" y=\"204.5\" font-size=\"7.2\" text-anchor=\"start\" fill=\"#666666\" font-weight=\"normal\">1/CA - 1/CA0 = k t</text><path d=\"M118.0 176.0L118.0 210.0\" fill=\"none\" stroke=\"#222222\" stroke-width=\"1.0\" stroke-linecap=\"round\"/><path d=\"M118.0 210.0L172.0 210.0\" fill=\"none\" stroke=\"#222222\" stroke-width=\"1.0\" stroke-linecap=\"round\"/><path d=\"M122.0 180.0L124.1 185.2L126.2 188.6L128.3 191.0L130.3 192.7L132.4 194.1L134.5 195.2L136.6 196.1L138.7 196.9L140.8 197.5L142.9 198.0L145.0 198.5L147.0 198.9L149.1 199.3L151.2 199.6L153.3 199.9L155.4 200.1L157.5 200.4L159.6 200.6L161.7 200.8L163.7 200.9L165.8 201.1L167.9 201.3L170.0 201.4\" fill=\"none\" stroke=\"#1565C0\" stroke-width=\"1.8\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"190\" y=\"190.7\" font-size=\"7.6\" text-anchor=\"start\" fill=\"#2E7D32\" font-weight=\"bold\">1/C against t is straight</text><text x=\"190\" y=\"204.7\" font-size=\"7.6\" text-anchor=\"start\" fill=\"#222222\" font-weight=\"normal\">slope = k</text><text x=\"180.0\" y=\"233.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">Only one of the three plots can be straight for a given set of data - that plot</text><text x=\"180.0\" y=\"245.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">names the order, and its slope is the rate constant.</text></svg>", "u3_halflife": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 280\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"280\" fill=\"#ffffff\"/><text x=\"180.0\" y=\"24.3\" font-size=\"12.2\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"bold\">Half-life against starting concentration</text><text x=\"180.0\" y=\"40.2\" font-size=\"9.2\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">t1/2 = const x CA0^(1-n), so the slope is 1 - n</text><path d=\"M46.0 178.0L46.0 56.0\" fill=\"none\" stroke=\"#222222\" stroke-width=\"1.3\" stroke-linecap=\"round\"/><path d=\"M44.2 61.0L46.0 56.0L47.8 61.0Z\" fill=\"#222222\"/><path d=\"M46.0 178.0L314.0 178.0\" fill=\"none\" stroke=\"#222222\" stroke-width=\"1.3\" stroke-linecap=\"round\"/><path d=\"M309.0 176.2L314.0 178.0L309.0 179.8Z\" fill=\"#222222\"/><text x=\"314\" y=\"194.1\" font-size=\"8.799999999999999\" text-anchor=\"end\" fill=\"#222222\" font-weight=\"bold\">log CA0</text><text x=\"43\" y=\"51.1\" font-size=\"8.799999999999999\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"bold\">log t1/2</text><path d=\"M76.0 150.2L296.0 71.0\" fill=\"none\" stroke=\"#B66A00\" stroke-width=\"2.0\" stroke-linecap=\"round\"/><path d=\"M76.0 120.0L296.0 120.0\" fill=\"none\" stroke=\"#1565C0\" stroke-width=\"2.0\" stroke-linecap=\"round\"/><path d=\"M76.0 89.8L296.0 169.0\" fill=\"none\" stroke=\"#2E7D32\" stroke-width=\"2.0\" stroke-linecap=\"round\"/><circle cx=\"160.0\" cy=\"120.0\" r=\"2.4\" fill=\"#BD2543\"/><rect x=\"14\" y=\"196\" width=\"332\" height=\"46\" rx=\"5\" fill=\"#FBFCFD\" stroke=\"#9AA3AD\" stroke-width=\"0.9\"/><path d=\"M24.0 205.0L44.0 205.0\" fill=\"none\" stroke=\"#B66A00\" stroke-width=\"2.4\" stroke-linecap=\"round\"/><text x=\"52\" y=\"210.7\" font-size=\"7.6\" text-anchor=\"start\" fill=\"#222222\" font-weight=\"normal\">n = 0: t1/2 doubles when CA0 doubles</text><path d=\"M24.0 217.0L44.0 217.0\" fill=\"none\" stroke=\"#1565C0\" stroke-width=\"2.4\" stroke-linecap=\"round\"/><text x=\"52\" y=\"222.7\" font-size=\"7.6\" text-anchor=\"start\" fill=\"#222222\" font-weight=\"normal\">n = 1: t1/2 does not depend on CA0</text><path d=\"M24.0 229.0L44.0 229.0\" fill=\"none\" stroke=\"#2E7D32\" stroke-width=\"2.4\" stroke-linecap=\"round\"/><text x=\"52\" y=\"234.7\" font-size=\"7.6\" text-anchor=\"start\" fill=\"#222222\" font-weight=\"normal\">n = 2: t1/2 halves when CA0 doubles</text><text x=\"180.0\" y=\"259.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">Plot log t1/2 against log CA0 and measure the slope: 1 - n gives the order without</text><text x=\"180.0\" y=\"271.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">ever integrating the rate law, which is why the method is used on new reactions.</text></svg>", "u3_pressure": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 296\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"296\" fill=\"#ffffff\"/><text x=\"180.0\" y=\"24.3\" font-size=\"12.2\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"bold\">Pressure data turned into concentration</text><text x=\"180.0\" y=\"40.2\" font-size=\"9.2\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">constant volume, gas phase: the gauge measures the total</text><rect x=\"20.0\" y=\"70.0\" width=\"88.0\" height=\"100.0\" rx=\"4\" fill=\"#F7FBFF\" stroke=\"#222222\" stroke-width=\"2.0\"/><rect x=\"22\" y=\"72\" width=\"84\" height=\"96\" rx=\"2\" fill=\"#EAF3FE\"/><circle cx=\"40\" cy=\"96\" r=\"1.7\" fill=\"#1565C0\"/><circle cx=\"66\" cy=\"104\" r=\"1.7\" fill=\"#1565C0\"/><circle cx=\"86\" cy=\"90\" r=\"1.7\" fill=\"#1565C0\"/><circle cx=\"52\" cy=\"120\" r=\"1.7\" fill=\"#1565C0\"/><circle cx=\"78\" cy=\"130\" r=\"1.7\" fill=\"#1565C0\"/><circle cx=\"36\" cy=\"140\" r=\"1.7\" fill=\"#1565C0\"/><circle cx=\"60\" cy=\"152\" r=\"1.7\" fill=\"#1565C0\"/><circle cx=\"88\" cy=\"148\" r=\"1.7\" fill=\"#1565C0\"/><rect x=\"20.0\" y=\"70.0\" width=\"88.0\" height=\"100.0\" rx=\"4\" fill=\"none\" stroke=\"#222222\" stroke-width=\"2.0\"/><circle cx=\"64\" cy=\"60\" r=\"9\" fill=\"#FFFFFF\" stroke=\"#222222\" stroke-width=\"1.6\"/><path d=\"M64.0 60.0L60.0 54.0\" fill=\"none\" stroke=\"#222222\" stroke-width=\"1.2\" stroke-linecap=\"round\"/><path d=\"M64.0 69.0L64.0 70.0\" fill=\"none\" stroke=\"#222222\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><text x=\"78\" y=\"54.6\" font-size=\"7.4\" text-anchor=\"start\" fill=\"#222222\" font-weight=\"bold\">gauge: total p</text><path d=\"M72.0 57.0L78.0 54.0\" fill=\"none\" stroke=\"#9AA3AD\" stroke-width=\"0.8\" stroke-linecap=\"round\" stroke-dasharray=\"2,2\"/><circle cx=\"72.0\" cy=\"57.0\" r=\"1.5\" fill=\"#9AA3AD\"/><text x=\"64\" y=\"186.7\" font-size=\"7.6\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">V and T fixed</text><text x=\"64\" y=\"198.6\" font-size=\"7.4\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">batch, gas phase</text><rect x=\"140\" y=\"56\" width=\"206\" height=\"34\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#BD2543\" stroke-width=\"1.3\"/><text x=\"148\" y=\"72.7\" font-size=\"7.8\" text-anchor=\"start\" fill=\"#BD2543\" font-weight=\"bold\">1. gauge</text><text x=\"148\" y=\"85.6\" font-size=\"7.4\" text-anchor=\"start\" fill=\"#222222\" font-weight=\"normal\">p = pA + pB + pC ...</text><rect x=\"140\" y=\"100\" width=\"206\" height=\"34\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#B66A00\" stroke-width=\"1.3\"/><text x=\"148\" y=\"116.7\" font-size=\"7.8\" text-anchor=\"start\" fill=\"#B66A00\" font-weight=\"bold\">2. stoichiometry</text><text x=\"148\" y=\"129.6\" font-size=\"7.4\" text-anchor=\"start\" fill=\"#222222\" font-weight=\"normal\">pA from the mole change</text><rect x=\"140\" y=\"144\" width=\"206\" height=\"34\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#1565C0\" stroke-width=\"1.3\"/><text x=\"148\" y=\"160.7\" font-size=\"7.8\" text-anchor=\"start\" fill=\"#1565C0\" font-weight=\"bold\">3. gas law</text><text x=\"148\" y=\"173.6\" font-size=\"7.4\" text-anchor=\"start\" fill=\"#222222\" font-weight=\"normal\">CA = pA / (R T)</text><path d=\"M243.0 90.0L243.0 99.0\" fill=\"none\" stroke=\"#666666\" stroke-width=\"1.2\" stroke-linecap=\"round\"/><path d=\"M244.8 94.0L243.0 99.0L241.2 94.0Z\" fill=\"#666666\"/><path d=\"M243.0 134.0L243.0 143.0\" fill=\"none\" stroke=\"#666666\" stroke-width=\"1.2\" stroke-linecap=\"round\"/><path d=\"M244.8 138.0L243.0 143.0L241.2 138.0Z\" fill=\"#666666\"/><rect x=\"14.0\" y=\"210.0\" width=\"332.0\" height=\"40.0\" rx=\"5\" fill=\"#F5EEFD\" stroke=\"#7B2CD9\" stroke-width=\"1\"/><text x=\"180.0\" y=\"224.9\" font-size=\"8.2\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">for  A -&gt; products  with a mole change</text><text x=\"180.0\" y=\"238.7\" font-size=\"7.6\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"normal\">pA = pA0 - (a/dn)(p - p0)   and   CA = CA0 (1 - X)</text><text x=\"180.0\" y=\"271.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">Air, or an inert, changes the total but not the partial pressure of A - subtract it</text><text x=\"180.0\" y=\"283.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">before you divide by RT, or the calculated conversion comes out too high.</text></svg>", "u3_orders": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 238\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"238\" fill=\"#ffffff\"/><text x=\"180.0\" y=\"24.3\" font-size=\"12.2\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"bold\">The integrated laws, order by order</text><text x=\"180.0\" y=\"40.2\" font-size=\"9.2\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">one straight-line variable and one half-life each</text><rect x=\"8\" y=\"48\" width=\"344\" height=\"22\" rx=\"4\" fill=\"#F5EEFD\" stroke=\"#7B2CD9\" stroke-width=\"1.2\"/><text x=\"12\" y=\"64.7\" font-size=\"7.8\" text-anchor=\"start\" fill=\"#7B2CD9\" font-weight=\"bold\">order</text><text x=\"58\" y=\"64.7\" font-size=\"7.8\" text-anchor=\"start\" fill=\"#7B2CD9\" font-weight=\"bold\">the law, from -dCA/dt = k CA^n</text><text x=\"250\" y=\"64.7\" font-size=\"7.8\" text-anchor=\"start\" fill=\"#7B2CD9\" font-weight=\"bold\">half-life</text><rect x=\"8\" y=\"70\" width=\"344\" height=\"30\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#9AA3AD\" stroke-width=\"0.9\"/><text x=\"24\" y=\"92.2\" font-size=\"9.0\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"bold\">0</text><text x=\"58\" y=\"91.7\" font-size=\"7.6\" text-anchor=\"start\" fill=\"#1565C0\" font-weight=\"normal\">CA0 - CA = k t</text><text x=\"250\" y=\"91.5\" font-size=\"7.2\" text-anchor=\"start\" fill=\"#2E7D32\" font-weight=\"normal\">CA0 / (2k)</text><rect x=\"8\" y=\"100\" width=\"344\" height=\"30\" rx=\"4\" fill=\"#FAFAFC\" stroke=\"#9AA3AD\" stroke-width=\"0.9\"/><text x=\"24\" y=\"122.2\" font-size=\"9.0\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"bold\">1</text><text x=\"58\" y=\"121.7\" font-size=\"7.6\" text-anchor=\"start\" fill=\"#1565C0\" font-weight=\"normal\">ln(CA0/CA) = k t</text><text x=\"250\" y=\"121.5\" font-size=\"7.2\" text-anchor=\"start\" fill=\"#2E7D32\" font-weight=\"normal\">0.693 / k</text><rect x=\"8\" y=\"130\" width=\"344\" height=\"30\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#9AA3AD\" stroke-width=\"0.9\"/><text x=\"24\" y=\"152.2\" font-size=\"9.0\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"bold\">2</text><text x=\"58\" y=\"151.7\" font-size=\"7.6\" text-anchor=\"start\" fill=\"#1565C0\" font-weight=\"normal\">1/CA - 1/CA0 = k t</text><text x=\"250\" y=\"151.5\" font-size=\"7.2\" text-anchor=\"start\" fill=\"#2E7D32\" font-weight=\"normal\">1 / (k CA0)</text><rect x=\"8\" y=\"160\" width=\"344\" height=\"30\" rx=\"4\" fill=\"#FAFAFC\" stroke=\"#9AA3AD\" stroke-width=\"0.9\"/><text x=\"24\" y=\"182.2\" font-size=\"9.0\" text-anchor=\"middle\" fill=\"#222222\" font-weight=\"bold\">n</text><text x=\"58\" y=\"181.7\" font-size=\"7.6\" text-anchor=\"start\" fill=\"#1565C0\" font-weight=\"normal\">CA^(1-n) - CA0^(1-n) = (n-1) k t</text><text x=\"238\" y=\"176.4\" font-size=\"7.0\" text-anchor=\"start\" fill=\"#2E7D32\" font-weight=\"normal\">(2^(n-1)-1)</text><text x=\"238\" y=\"187.4\" font-size=\"7.0\" text-anchor=\"start\" fill=\"#2E7D32\" font-weight=\"normal\">/ ((n-1) k CA0^(n-1))</text><text x=\"180.0\" y=\"209.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">k carries the order too: mol m-3 s-1, s-1, m3 mol-1 s-1 ... (mol m-3)^(1-n) s-1;</text><text x=\"180.0\" y=\"221.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#666666\" font-weight=\"normal\">an answer in the wrong unit of k is the fastest way to lose the marks for it.</text></svg>"};
