ી વિવિધતા."}}, {"q": {"en": "Name four ecosystem services with one example each.", "gu": "ચાર પારિતંત્ર સેવાઓ દરેકનું એક ઉદાહરણ આપીને જણાવો."}, "a": {"en": "Provisioning - fish from a lake; regulating - mangroves reducing a storm surge; cultural - a pilgrimage grove; supporting - earthworms building soil fertility.", "gu": "પુરવઠા - તળાવની માછલી; નિયમન - તોફાની મોજાં ઘટાડતાં કાંદલાં; સાંસ્કૃતિક - યાત્રાધામનું વન; આધાર - જમીનની ફળદ્રુપતા બનાવતું અળસિયું."}}, {"q": {"en": "Give the five main threats to biodiversity.", "gu": "જૈવવિવિધતા પરના પાંચ મુખ્ય ભય જણાવો."}, "a": {"en": "Habitat loss and fragmentation, invasive alien species, pollution, over-exploitation of species, and climate change.", "gu": "નિવાસનો નાશ અને વિભાજન, આક્રમક બહારની જાતિઓ, પ્રદૂષણ, જાતિઓનું અતિ-દોહન, અને જળવાયુ પરિવર્તન."}}, {"q": {"en": "Distinguish in-situ and ex-situ conservation.", "gu": "સ્થાનિક અને સ્થાનાંતરિત સંરક્ષણમાં ભેદ આપો."}, "a": {"en": "In-situ conservation protects a species inside its own habitat - national parks, sanctuaries, biosphere reserves and sacred groves. Ex-situ keeps it outside the habitat - zoos, botanical gardens, seed and cryo banks - which preserves genes but not the ecology.", "gu": "સ્થાનિક સંરક્ષણ જાતિને તેના જ નિવાસમાં બચાવે - રાષ્ટ્રીય ઉદ્યાન, અભયારણ્ય, જીવમંડળ અનામત અને પવિત્ર વન. સ્થાનાંતરિત તેને નિવાસ બહાર રાખે - પ્રાણીસંગ્રહાલય, વનસ્પતિ ઉદ્યાન, બીજ અને ક્રાયો બેંક - જે જનીન બચાવે, પણ પરિસ્થિતિ નહીં."}}, {"q": {"en": "Which two Acts of India deal directly with wildlife and forest land?", "gu": "ભારતના કયા બે અધિનિયમ વન્યજીવ અને જંગલની જમીન સાથે સીધા સંબંધિત છે?"}, "a": {"en": "The Wild Life (Protection) Act 1972, which created protected areas and the schedule of species, and the Forest (Conservation) Act 1980, which needs central approval before forest land is used for anything else.", "gu": "વન્યજીવ (સંરક્ષણ) અધિનિયમ 1972, જેણે સંરક્ષિત ક્ષેત્રો અને જાતિઓની યાદી બનાવી, અને વન (સંરક્ષણ) અધિનિયમ 1980, જે જંગલની જમીન બીજા ઉપયોગમાં લેવા પહેલાં કેન્દ્રની મંજૂરી માગે છે."}}]}], "exam_questions": [{"q": {"en": "Practice: Define sustainability, sustainable development and the three pillars it stands on.", "gu": "સરાવ: ટકાઉપણું, ટકાઉ વિકાસ અને તેના ત્રણ સ્તંભોની વ્યાખ્યા આપો."}, "marks": 4}, {"q": {"en": "Practice: Explain the structure and function of an ecosystem with a pond as the example.", "gu": "સરાવ: તળાવના ઉદાહરણ સાથે પારિતંત્રની રચના અને કાર્ય સમજાવો."}, "marks": 4}, {"q": {"en": "Practice: Describe the carbon cycle and explain how human activity has disturbed its balance.", "gu": "સરાવ: કાર્બન ચક્ર વર્ણવો અને માનવ પ્રવૃત્તિએ તેનું સંતુલન કેવી રીતે બગાડ્યું તે સમજાવો."}, "marks": 5}, {"q": {"en": "Practice: Explain the nitrogen cycle with its five steps and one environmental problem it causes.", "gu": "સરાવ: નાઇટ્રોજન ચક્ર તેના પાંચ પગલાં અને તેનાથી થતી એક પર્યાવરણીય સમસ્યા સાથે સમજાવો."}, "marks": 4}, {"q": {"en": "Practice: What is biodiversity? State its levels, its values and the threats it faces.", "gu": "સરાવ: જૈવવિવિધતા એટલે શું? તેનાં સ્તર, મૂલ્ય અને ભય જણાવો."}, "marks": 5}, {"q": {"en": "Practice: Explain the structure of an ecosystem and state why energy flow is one-way.", "gu": "સરાવ: પારિતંત્રની રચના સમજાવો અને ઊર્જા પ્રવાહ એક દિશાનો કેમ છે તે જણાવો."}, "marks": 4}, {"q": {"en": "Practice: Describe the phosphorus cycle and explain why it is called a sedimentary cycle.", "gu": "સરાવ: ફોસ્ફરસ ચક્ર વર્ણવો અને તેને સેડિમેન્ટરી ચક્ર કેમ કહે છે તે સમજાવો."}, "marks": 4}, {"q": {"en": "Practice: Compare the sulphur and phosphorus cycles in a table with four points.", "gu": "સરાવ: ચાર મુદ્દા સાથે કોષ્ટકમાં સલ્ફર અને ફોસ્ફરસ ચક્રની સરખામણી કરો."}, "marks": 3}, {"q": {"en": "Practice: Explain in-situ and ex-situ conservation and give two examples of each.", "gu": "સરાવ: સ્થાનિક અને સ્થાનાંતરિત સંરક્ષણ સમજાવો અને દરેકનાં બે ઉદાહરણ આપો."}, "marks": 4}, {"q": {"en": "Practice: A town of 1 lakh people has a footprint of 2.0 gha per person and a biocapacity of 0.5 gha per person. Find the deficit and suggest two measures.", "gu": "સરાવ: 1 લાખ લોકોના શહેરની માથાદીઠ પગથિયું 2.0 gha અને વહેંચણી ક્ષમતા 0.5 gha છે. ખાદ્યાન્ન શોધો અને બે પગલાં સૂચવો."}, "marks": 4}, {"q": {"en": "Practice: State the ten per cent law. Producers fix 5 × 10⁴ kJ - find the energy at the tertiary consumer level.", "gu": "સરાવ: દસ ટકાનો નિયમ જણાવો. ઉત્પાદક 5 × 10⁴ kJ સ્થિર કરે - તૃતીય ઉપભોક્તા સ્તરે ઊર્જા શોધો."}, "marks": 3}, {"q": {"en": "Practice: Explain why biodiversity loss matters to an engineer, with two examples from construction or manufacturing.", "gu": "સરાવ: જૈવવિવિધતાનો નાશ ઇજનેર માટે કેમ મહત્ત્વનો છે તે બાંધકામ કે ઉત્પાદનનાં બે ઉદાહરણ સાથે સમજાવો."}, "marks": 4}, {"q": {"en": "Practice: What is eutrophication? Trace it from a fertiliser bag to a dead pond in four steps.", "gu": "સરાવ: યુટ્રોફિકેશન એટલે શું? ખાતરની થેલીથી મૃત તળાવ સુધીનો ચાર પગલાંનો માર્ગ દર્શાવો."}, "marks": 4}], "learning_outcomes": [{"en": "Explain the basic principles of environmental sustainability, the working of ecosystems and the value and conservation of biodiversity.", "gu": "પર્યાવરણીય ટકાઉપણાના પાયાના સિદ્ધાંતો, પારિતંત્રનું કાર્ય તથા જૈવવિવિધતાનું મૂલ્ય અને સંરક્ષણ સમજાવવું."}], "course_outcomes": ["CO1"], "practical_numbers": [], "content_kind": "theory", "lesson_count": 10, "answered_practice_count": 13, "assessment_note": {"en": "Official course: theory ESE 70 + PA/CA 30 = 100 marks, 2 credits, 30 teaching hours, no practical and no laboratory requirement (NIL in the PDF). This unit carries 10 % weightage, 4 of the 30 hours and 7 of the 70 theory marks (the PDF prints weightage only, so marks are split by weightage). Practice marks 3/4/5 are suggested revision sizes, not GTU allocations. Model answers are in Notes section 5.", "gu": "અધિકૃત કોર્સ: થિયરી ESE 70 + PA/CA 30 = 100 માર્ક્સ, 2 ક્રેડિટ, 30 શિક્ષણ કલાક, કોઈ પ્રેક્ટિકલ કે લેબોરેટરી જરૂરિયાત નથી (PDFમાં NIL). આ યુનિટનું વેઇટેજ 10 %, 30માંથી 4 કલાક અને 70 થિયરી માર્ક્સમાંથી 7 માર્ક્સ (PDFમાં ફક્ત વેઇટેજ છે, તેથી માર્ક્સ વેઇટેજ પ્રમાણે વહેંચ્યા છે). સરાવના const progBody = p => p.items
  ? p.items.map(it => fixTables(t(it.body)) + (it.diagram?dgInline(it.diagram):'')).join('')
  : `<div class="pl">${L('code')}</div><pre class="code">${hl(t(p.code))}</pre><div class="pl">${L('output')}</div><pre class="out">${esc(p.out)}</pre>${p.plot?`<div class="pl">${L('plot')}</div>`+dgInline(p.plot).replace('class="dg"','class="dg pg"'):''}${p.expl?`<div class="pl">${L('expl')}</div>${fixTables(t(p.expl))}`:''}`;
const pBox = id => { const p=(U.programs||[]).find(x=>x.id===id); if(!p) return ''; return `<div class="pbox"><div class="et">${L('prog')}: ${t(p.title)}</div>${progBody(p)}</div>`; };
const exBox = id => { const n=(U.numericals||[]).find(x=>x.id===id); if(!n) return ''; return `<div class="ex"><div class="et">${L('ex')}</div><div class="eq2">${t(n.q)}</div>${fixTables(t(n.a))}</div>`; };
function notes(){
  let h = `<div class="intro"><b>${t(U.title)}</b><div>${L('unit')} ${U.unit} · ${U.weightage}% ${L('intro')} · ${U.hours} ${L('hours')}</div><div>${U.intro_text ? t(U.intro_text) : L(U.programs?(META.code_lang==='python'?'intropy':'introc'):'introd')}</div></div>`;
  U.notes.forEach((sec,si)=>{
    h += `<div class="sec">${head(t(sec.title))}`;
    sec.items.forEach((it,i)=>{
      const open = si===0&&i===0 ? ' open' : '';
      if (it.h) {
        h += `<div class="card${it.key?' key':''}${open}"><div class="q hd"><span class="t">${it.key?'⭐ ':''}${t(it.h)}</span>${chev}</div>
        <div class="a rn" style="padding-left:18px">${fixTables(t(it.body)).replace(/margin:0 0 10px -36px/g,'')}${it.diagram?dgInline(it.diagram):''}${(it.examples||[]).map(exBox).join('')}${(it.programs||[]).map(pBox).join('')}</div></div>`;
      } else {
        h += `<div class="card${open}"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(it.q)}</span>${chev}</div>
        <div class="a">${fixTables(t(it.a))}${it.diagram?dgInline(it.diagram):''}</div></div>`;
      }
    });
    h += `</div>`;
  });
  return h;
}
function numericals(){
  return `<div class="sec">${head(L('numericals'))}` + (U.numericals||[]).map((n,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(n.q)}</span>${chev}</div><div class="a">${fixTables(t(n.a))}</div></div>`).join('') + `</div>`;
}
function diagrams(){
  return `<div class="sec">${head(L((U.tabs ? U.tabs.includes('flowcharts')&&!U.tabs.includes('diagrams') : U.programs&&META.code_lang!=='python')?'flowcharts':'diagrams'),false)}<div style="height:10px"></div>` + U.diagrams.map((d,i)=>
    `<div class="dcard" data-dg="${d.id}"><div class="h">${i+1}. ${t(d.title)}</div>${SVG[d.id]}</div>`).join('') + `</div>`;
}
function equations(){
  return U.equations.map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><span class="fbox">${e.f}</span></span>${chev}</div>
     <div class="a"><p>${t(e.terms)}</p></div></div>`).join('') + `</div>`).join('');
}
function viva(){
  // two shapes exist in the corpus: flat [{q,a}] and grouped [{title, items:[{q,a}]}]
  const groups = U.viva.every(v=>v && v.q) ? [{items: U.viva}] : U.viva;
  return groups.map(g=>{
    const items = g.items || [];
    return `<div class="sec">${g.title?head(t(g.title)):''}` + items.map((v,i)=>
      `<div class="card"><div class="q hd"><span class="n">${i+1}.</span><span class="t">${t(v.q)}</span>${chev}</div><div class="a"><p>${t(v.a)}</p></div></div>`).join('') + `</div>`;
  }).join('');
}
function exam(){
  return `<div class="sec">${head(L('examhead'),false)}` + U.exam_questions.map((x,i)=>
    `<div class="card"><div class="q" style="cursor:default"><span class="n">${i+1}.</span><span class="t">${t(x.q)}</span><span class="mk">${x.marks} ${L('marks')}</span></div></div>`).join('') + `</div>`;
}
function programs(){
  return `<div class="sec">${head(L('programs'))}` + (U.programs||[]).map((p,i)=>
    `<div class="card"><div class="q hd"><span class="n">${i+1}.</span><span class="t">${t(p.title)}</span>${chev}</div><div class="a pa">${progBody(p)}</div></div>`).join('') + `</div>`;
}
function syntax(key){
  return (U[typeof key==='string'?key:'syntax']||[]).map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><pre class="code sx">${hl(e.f)}</pre></span>${chev}</div>
     <div class="a">${e.terms && t(e.terms) ? fixTables(t(e.terms)) : ''}</div></div>`).join('') + `</div>`).join('');
}
const flowcharts = diagrams;
const algorithms = () => syntax('algorithms');
const ALLV = {notes, programs, diagrams, flowcharts, algorithms, syntax, equations, numericals, viva, exam};
const VIEWS = U.tabs ? Object.fromEntries(U.tabs.map(k=>[k, ALLV[k]])) : U.programs ? (META.code_lang==='python' ? {notes, programs, diagrams, syntax, viva, exam} : {notes, programs, flowcharts, syntax, viva, exam}) : U.numericals ? {notes, diagrams, equations, numericals, viva, exam} : {notes, diagrams, equations, viva, exam};
function render(){
  document.getElementById('title').textContent = `${L('unit')} ${U.unit}: ${t(U.title)}`;
  document.getElementById('sub').textContent = `${t(META.name)} · ${META.code}`;
  document.getElementById('lang').textContent = S.lang==='en' ? 'ગુ' : 'EN';
  document.getElementById('lang').style.display = META.languages.includes('gu') ? '' : 'none';
  document.getElementById('tabs').innerHTML = Object.keys(VIEWS).map(k=>`<button class="tab${S.tab===k?' on':''}" data-tab="${k}">${L(k)}</button>`).join('');
  document.getElementById('view').innerHTML = VIEWS[S.tab]();
  document.querySelectorAll('#view pre.c').forEach(e=>{ e.innerHTML = hl(e.textContent); e.className='code'; });
}
let zoom = 1;
function setZoom(z){ zoom = Math.min(4, Math.max(1, z)); const w=document.getElementById('zw'); w.style.width=(zoom*100)+'%'; document.getElementById('zr').textContent=Math.round(zoom*100)+'%'; }
document.addEventListener('click', e=>{
  const q = e.target.closest('.q'); if (q && q.parentElement.querySelector('.a')) { q.parentElement.classList.toggle('open'); return; }
  const tb = e.target.closest('[data-tab]'); if (tb){ S.tab = tb.dataset.tab; render(); window.scrollTo(0,0); return; }
  if (e.target.closest('#lang')){ S.lang = S.lang==='en'?'gu':'en'; render(); return; }
  const m = e.target.closest('[data-more]');
  document.querySelectorAll('.menu.show').forEach(x=>{ if(!m || x!==m.nextElementSibling) x.classList.remove('show'); });
  if (m){ m.nextElementSibling.classList.toggle('show'); return; }
  const act = e.target.closest('[data-act]');
  if (act){ act.closest('.sec').querySelectorAll('.card').forEach(c=>{ if(c.querySelector('.a')) c.classList.toggle('open', act.dataset.act==='expand'); }); act.parentElement.classList.remove('show'); return; }
  const dg = e.target.closest('[data-dg]');
  if (dg){ const id=dg.dataset.dg; document.getElementById('mt').textContent=t(U.diagrams.find(d=>d.id===id).title); document.getElementById('zw').innerHTML=SVG[id]; setZoom(1); document.getElementById('modal').classList.add('show'); return; }
  if (e.target.closest('#mx')) document.getElementById('modal').classList.remove('show');
  if (e.target.closest('#zi')) setZoom(zoom+0.5);
  if (e.target.closest('#zo')) setZoom(zoom-0.5);
  if (e.target.closest('#zr')) setZoom(1);
});
render();
</script>
