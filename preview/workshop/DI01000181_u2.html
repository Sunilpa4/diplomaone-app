.kw{color:#C792EA;font-weight:700}.ty{color:#82AAFF}.st{color:#C3E88D}.cm{color:#8E9AAF;font-style:italic}.pp{color:#F78C6C}.nu{color:#F9C46B}.fn{color:#FFCB6B}

<script>
const U = {"subject": "DI01000181", "unit": 2, "format": "notes", "title": {"en": "Phase Diagrams", "gu": "ફેઝ ડાયાગ્રામ"}, "hours": 7, "weightage": 20, "theory_marks": 14, "official": true, "languages": ["en", "gu"], "tabs": ["notes", "diagrams", "equations", "viva", "exam"], "intro_text": {"en": "Unit 2 of Engineering Materials Science: what a phase is and how the phase rule counts them, what a cooling curve tells a foundry, how a casting freezes from the mould wall inwards and why that leaves three zones of grains, how a solid solution differs from a compound, and how to read the three diagrams that the rest of the subject stands on - copper-nickel, lead-tin and iron-carbon. The lever rule is worked on every one of them, the eutectoid of steel is computed for three carbon contents, and six solved numericals follow in section 2.7.", "gu": "Engineering Materials Science નું Unit 2: phase એટલે શું અને phase rule તેને કેવી રીતે ગણે, cooling curve ફાઉન્ડ્રીને શું કહે, casting mould ની દીવાલથી અંદર તરફ કેવી રીતે થીજે અને તેથી grains ના ત્રણ zone કેમ રહે, solid solution અને compound માં ફરક શું, અને આખો વિષય જેના પર ઊભો છે તે ત્રણ diagram - copper-nickel, lead-tin અને iron-carbon - કેવી રીતે વાંચવા. Lever rule ત્રણેય પર ગણાયેલો છે, સ્ટીલના eutectoid ની ગણતરી ત્રણ carbon content માટે કરેલી છે, અને પછી વિભાગ 2.7 માં છ ઉકેલેલા દાખલા છે."}, "notes": [{"title": {"en": "2.1 Phase, component and the phase rule", "gu": "2.1 Phase, component અને phase rule"}, "items": [{"h": {"en": "Phase, component and degrees of freedom", "gu": "Phase, component અને degrees of freedom"}, "body": {"en": "<p>A <b>phase</b> is a part of the material that is the same everywhere in it: same crystal structure, same composition, and a boundary you could draw round it. Ice and water in one glass are two phases; a Cu-Ni solid solution is one phase however much nickel it holds. A <b>component</b> is the smallest set of chemical species needed to describe every phase present, and the <b>degrees of freedom</b> tell you how many of the variables (temperature, pressure, composition) you may change without losing a phase.</p><div class=\"math\">Gibbs phase rule:   F = C - P + 2\nevery diagram in this subject is drawn at 1 atmosphere, so the pressure is fixed:\ncondensed phase rule:   F = C - P + 1\n\npure iron, 1450 C (austenite only):        C=1 P=1 -> F = 1-1+1 = 1\npure iron at 1538 C (solid + liquid):      C=1 P=2 -> F = 1-2+1 = 0\nPb-Sn eutectic, 183 C (L + alpha + beta):  C=2 P=3 -> F = 2-3+1 = 0\n40 % Sn at 200 C (alpha + liquid):         C=2 P=2 -> F = 2-2+1 = 1</div><p><b>Why it is true.</b> F = 0 means the point is <b>invariant</b>: the eutectic of lead-tin freezes at one temperature and one composition and you cannot move either without losing a phase. F = 1 means you may pick the temperature and the compositions then follow the two boundaries of the field - which is exactly what a tie line does.</p><table><tr><th>Phase in steel</th><th>Structure</th><th>Carbon it holds</th><th>Nature</th></tr><tr><td>Ferrite, α</td><td>BCC iron</td><td>0.02 % at 727 C</td><td>soft and ductile</td></tr><tr><td>Austenite, γ</td><td>FCC iron</td><td>2.14 % at 1147 C</td><td>ductile, non-magnetic</td></tr><tr><td>Cementite, Fe3C</td><td>orthorhombic compound</td><td>6.67 %</td><td>very hard and brittle</td></tr><tr><td>Pearlite</td><td>lamellae of α + Fe3C</td><td>0.8 %</td><td>the eutectoid mixture</td></tr></table><p><b>Check your answer.</b> Count the phases with a microscope, not with the formula sheet: the formula only counts what is there. Two phases that look alike but have different compositions are still two phases.</p>", "gu": "<p>કોઈ સામગ્રીનો જે ભાગ બધે એકસરખો હોય તે <b>phase</b> છે: એક જ crystal structure, એક જ composition, અને તેની આસપાસ સીમા દોરી શકાય. એક ગ્લાસમાં ice અને water બે phase છે; Cu-Ni solid solution માં nickel ગમે તેટલું હોય તો પણ તે એક જ phase છે. <b>Component</b> એ હાજર બધા phase વર્ણવવા માટે જરૂરી લઘુતમ chemical species છે, અને <b>degrees of freedom</b> કહે છે કે phase ગુમાવ્યા વગર તમે temperature, pressure અને composition માંથી કેટલા બદલી શકો.</p><div class=\"math\">Gibbs phase rule:   F = C - P + 2\nevery diagram in this subject is drawn at 1 atmosphere, so the pressure is fixed:\ncondensed phase rule:   F = C - P + 1\n\npure iron, 1450 C (austenite only):        C=1 P=1 -> F = 1-1+1 = 1\npure iron at 1538 C (solid + liquid):      C=1 P=2 -> F = 1-2+1 = 0\nPb-Sn eutectic, 183 C (L + alpha + beta):  C=2 P=3 -> F = 2-3+1 = 0\n40 % Sn at 200 C (alpha + liquid):         C=2 P=2 -> F = 2-2+1 = 1</div><p><b>કેમ સાચું છે.</b> F = 0 એટલે બિંદુ <b>invariant</b> છે: lead-tin નું eutectic એક જ temperature અને એક જ composition પર થીજે છે, અને phase ગુમાવ્યા વગર એમાંથી એક પણ બદલી શકાતું નથી. F = 1 એટલે તમે temperature પસંદ કરી શકો અને પછી composition field ની બે સીમાં પર ચાલે - tie line બરાબર એ જ કરે છે.</p><table><tr><th>સ્ટીલમાં phase</th><th>રચના</th><th>કાર્બનની માત્રા</th><th>સ્વભાવ</th></tr><tr><td>Ferrite, α</td><td>BCC iron</td><td>727 C પર 0.02 %</td><td>નરમ અને ductile</td></tr><tr><td>Austenite, γ</td><td>FCC iron</td><td>1147 C પર 2.14 %</td><td>ductile, non-magnetic (બિન-ચુંબકીય)</td></tr><tr><td>Cementite, Fe3C</td><td>orthorhombic compound (સંયોજન)</td><td>6.67 %</td><td>ખૂબ સખત અને ભંગુર</td></tr><tr><td>Pearlite</td><td>α + Fe3C ની lamellae</td><td>0.8 %</td><td>eutectoid મિશ્રણ</td></tr></table><p><b>જવાબ ચકાસો.</b> Phase ગણવા માટે સૂત્ર નહીં, microscope જુઓ: સૂત્ર ફક્ત જે હાજર છે તે ગણે છે. બે phase દેખાવમાં સરખા પણ composition જુદું હોય તો પણ તે બે phase જ છે.</p>"}}, {"h": {"en": "Cooling curves: what a foundryman reads off them", "gu": "Cooling curves: ફાઉન્ડ્રીવાળો તેમાંથી શું વાંચે છે"}, "body": {"en": "<p>Pour a metal into a mould, put a thermocouple in it and plot temperature against time. A <b>pure metal</b> cools in a straight line until it reaches its freezing point, then the curve goes flat: the latent heat of fusion is coming out as fast as the mould takes heat away, so the temperature does not fall until every atom has solidified. An <b>alloy</b> freezes over a range - the liquidus where the first solid appears and the solidus where the last liquid goes - so the curve only changes slope, and the slushy band in between is the <b>mushy zone</b>.</p><div class=\"math\">latent heat released in time dt:  dQ = m Lf\nheld flat while the mould removes heat at q W:  t_arrest = m Lf / q\n\nexample: 2 kg of iron, Lf = 247 kJ/kg, mould takes 500 W\nt_arrest = 2 x 247000 / 500 = 988 s = 16.5 min of flat curve\n\nalloy freezing range = T_liquidus - T_solidus\nthe 70/30 alloy of figure: 1500 - 1380 = 120 C of mushy zone</div><p><b>Why it is true.</b> The flat part is the melting point measured from outside; the length of the flat part is the latent heat divided by the rate at which the mould removes heat. That is why a thin casting freezes quickly and a heavy section keeps its heat - and why the heavy section is the one that ends up with shrinkage porosity.</p><p><b>Common mistake.</b> A small dip below the freezing point before the flat part is <b>undercooling</b>, not a lower melting point: the metal has to be pushed below its freezing point before nuclei form, and the temperature then jumps back up as they grow (recalescence). Read the flat part, not the dip.</p>", "gu": "<p>Mould માં ધાતુ રેડો, તેમાં thermocouple નાખો અને time સામે temperature દોરો. <b>Pure metal</b> ગલનબિંદુ સુધી સીધી રેખામાં ઠંડું થાય, પછી રેખા સપાટ થઈ જાય: latent heat of fusion એટલી ઝડપથી બહાર નીકળે છે જેટલી ઝડપથી mould ગરમી લે છે, તેથી બધું ઘન ન થાય ત્યાં સુધી temperature ઘટતું નથી. <b>Alloy</b> એક range માં થીજે છે - liquidus જ્યાં પ્રથમ ઘન દેખાય અને solidus જ્યાં છેલ્લું પ્રવાહી જાય - તેથી રેખા ફક્ત ઢાળ બદલે છે, અને વચ્ચેનો લપટાવાળો પટ્ટો <b>mushy zone</b> છે.</p><div class=\"math\">latent heat released in time dt:  dQ = m Lf\nheld flat while the mould removes heat at q W:  t_arrest = m Lf / q\n\nexample: 2 kg of iron, Lf = 247 kJ/kg, mould takes 500 W\nt_arrest = 2 x 247000 / 500 = 988 s = 16.5 min of flat curve\n\nalloy freezing range = T_liquidus - T_solidus\nthe 70/30 alloy of figure: 1500 - 1380 = 120 C of mushy zone</div><p><b>કેમ સાચું છે.</b> સપાટ ભાગ એ બહારથી માપેલું ગલનબિંદુ છે; સપાટ ભાગની લંબાઈ એ latent heat ભાગ્યા mould ગરમી લે તેવા દર જેટલી છે. તેથી પાતળું casting જલદી થીજે છે અને જાડો ભાગ ગરમી રાખે છે - અને તેથી જ જાડા ભાગમાં shrinkage porosity રહી જાય છે.</p><p><b>સામાન્ય ભૂલ.</b> સપાટ ભાગ પહેલાં ગલનબિંદુથી થોડું નીચે જવું તે <b>undercooling</b> છે, ગલનબિંદુ નીચું થયું નથી: nuclei બનતા પહેલાં ધાતુને તેના ગલનબિંદુથી નીચે ધકેલવી પડે છે, અને પછી nuclei વધતાં temperature પાછું ઉપર કૂદે છે (recalescence). સપાટ ભાગ વાંચો, ખાડો નહીં.</p>"}, "diagram": "u2_coolcurve"}]}, {"title": {"en": "2.2 Solidification, grain structure and grain size", "gu": "2.2 Solidification, grain structure અને grain size"}, "items": [{"h": {"en": "Nucleation, dendrites and the three zones of an ingot", "gu": "Nucleation, dendrites અને ingot ના ત્રણ zone"}, "body": {"en": "<p>Solidification needs somewhere to start. <b>Homogeneous nucleation</b> is a cluster of atoms forming on its own in the melt; it needs a large undercooling because the new surface costs energy. <b>Heterogeneous nucleation</b> uses a ready-made surface - the mould wall, an oxide skin, or a deliberately added particle - and needs only a small undercooling, so it is what actually happens in a foundry. Once a nucleus exists it grows fastest along the directions where it can reject its latent heat, which gives the tree-shaped <b>dendrite</b>; the arms of neighbouring dendrites meet and leave a <b>grain boundary</b>.</p><div class=\"math\">critical radius of a nucleus:  r* = 2 gamma Tm / (L dT)\nenergy barrier:  dG* = 16 pi gamma^3 Tm^2 / (3 L^2 dT^2)\n\niron: gamma = 0.2 J/m2, Tm = 1811 K, L = 1.9e9 J/m3, dT = 100 K\nr* = 2 x 0.2 x 1811 / (1.9e9 x 100) = 3.8e-9 m = 3.8 nm\ndT = 200 K -> r* = 1.9 nm: double the undercooling, half the nucleus</div><table><tr><th>Zone</th><th>Where it freezes</th><th>Grains</th><th>Why</th></tr><tr><td>Chill zone</td><td>against the mould wall</td><td>fine, equiaxed</td><td>wall nucleates many grains at once</td></tr><tr><td>Columnar zone</td><td>next to it, growing inwards</td><td>long, parallel</td><td>heat leaves through the wall, so they grow that way</td></tr><tr><td>Equiaxed centre</td><td>last, in the hot middle</td><td>coarse, random</td><td>slow cooling, few nuclei left</td></tr></table><p><b>Common mistake.</b> The three zones are not always there. A thin section or a well-inoculated alloy may be all equiaxed, and a pure metal poured into a cold metal mould may be almost all columnar. The zones are a description of the heat flow, not a rule.</p>", "gu": "<p>ઘન થવા માટે શરૂઆતનું સ્થળ જોઈએ. <b>Homogeneous nucleation</b> એ પ્રવાહીમાં પોતાની જાતે બનતું atoms નું ટોળું છે; નવી surface ઊર્જા માંગે છે તેથી તેને ઘણું undercooling જોઈએ. <b>Heterogeneous nucleation</b> તૈયાર surface વાપરે છે - mould ની દીવાલ, oxide નો પડ, કે જાણીને ઉમેરેલો કણ - અને થોડું જ undercooling માંગે છે, તેથી ફાઉન્ડ્રીમાં ખરેખર એ જ બને છે. Nucleus બન્યા પછી જ્યાં latent heat સહેલાઈથી નીકળે તે દિશામાં તે સૌથી ઝડપથી વધે છે, જેનાથી ઝાડ જેવું <b>dendrite</b> બને છે; પાડોશી dendrite ના ડાળા મળે ત્યાં <b>grain boundary</b> રહી જાય છે.</p><div class=\"math\">critical radius of a nucleus:  r* = 2 gamma Tm / (L dT)\nenergy barrier:  dG* = 16 pi gamma^3 Tm^2 / (3 L^2 dT^2)\n\niron: gamma = 0.2 J/m2, Tm = 1811 K, L = 1.9e9 J/m3, dT = 100 K\nr* = 2 x 0.2 x 1811 / (1.9e9 x 100) = 3.8e-9 m = 3.8 nm\ndT = 200 K -> r* = 1.9 nm: double the undercooling, half the nucleus</div><table><tr><th>Zone</th><th>ક્યાં થીજે</th><th>Grains</th><th>કેમ</th></tr><tr><td>Chill zone</td><td>mould ની દીવાલ પાસે</td><td>નાના, equiaxed</td><td>દીવાલ એકસાથે ઘણા grains બનાવે</td></tr><tr><td>Columnar zone</td><td>તેની બાજુમાં, અંદર તરફ વધતા</td><td>લાંબા, સમાંતર</td><td>ગરમી દીવાલ તરફ જાય તેથી તે દિશામાં વધે</td></tr><tr><td>Equiaxed centre</td><td>છેલ્લે, ગરમ વચ્ચે</td><td>જાડા, અવ્યવસ્થિત</td><td>ધીમું ઠંડું, ઓછા nuclei બચ્યા</td></tr></table><p><b>સામાન્ય ભૂલ.</b> ત્રણ zone હંમેશા હોતા નથી. પાતળો ભાગ કે સારી રીતે inoculated alloy આખો equiaxed હોઈ શકે, અને ઠંડા metal mould માં રેડેલી શુદ્ધ ધાતુ લગભગ આખી columnar હોઈ શકે. Zone એ ગરમીના પ્રવાહનું વર્ણન છે, નિયમ નહીં.</p>"}, "diagram": "u2_ingot"}, {"h": {"en": "Casting defects that come from solidification", "gu": "Solidification થી થતી casting defects"}, "body": {"en": "<p>Almost every casting defect is a consequence of one fact: the metal shrinks when it freezes, and it freezes from the outside in. The last liquid is trapped somewhere inside, and when it finally freezes there is nothing left to fill the hole it leaves. A <b>shrinkage cavity</b> (pipe) forms where the feeder could not reach, <b>porosity</b> where gas or shrinkage is spread out as small holes, <b>segregation</b> where alloying elements are pushed ahead of the growing dendrites, and <b>hot tears</b> where a contracting skin is pulled apart while it is still weak.</p><div class=\"math\">linear contraction of iron on freezing ~ 1 %, solid contraction to room ~ 1 %\nshrinkage allowance left on a pattern: 10 mm/m for cast iron, 20 mm/m for steel\n\na 1 m cast-iron pattern is made 1.010 m long\nriser volume must feed the shrinkage of the section it feeds</div><ul><li>en</li><li>en</li><li>en</li></ul>", "gu": "<p>લગભગ દરેક casting defect એક જ હકીકતમાંથી આવે છે: ધાતુ થીજતી વખતે સંકોચાય છે, અને બહારથી અંદર તરફ થીજે છે. છેલ્લું પ્રવાહી અંદર ક્યાંક ફસાય છે, અને જ્યારે તે થીજે ત્યારે તે જગ્યા ભરવા માટે કંઈ બચતું નથી. Feeder પહોંચી શકે તેમ ન હોય ત્યાં <b>shrinkage cavity</b> (pipe) બને, gas કે shrinkage નાના છિદ્રો સ્વરૂપે ફેલાય ત્યાં <b>porosity</b>, વધતા dendrites આગળ alloying elements ધકેલાય ત્યાં <b>segregation</b>, અને સંકોચાતી skin હજી નરમ હોય ત્યારે ફાટે તો <b>hot tear</b> બને.</p><div class=\"math\">linear contraction of iron on freezing ~ 1 %, solid contraction to room ~ 1 %\nshrinkage allowance left on a pattern: 10 mm/m for cast iron, 20 mm/m for steel\n\na 1 m cast-iron pattern is made 1.010 m long\nriser volume must feed the shrinkage of the section it feeds</div><ul><li>gu</li><li>gu</li><li>gu</li></ul>"}}, {"h": {"en": "Grain size sets the strength: Hall-Petch", "gu": "Grain size તાકાત નક્કી કરે: Hall-Petch"}, "body": {"en": "<p>A dislocation gliding along its slip plane stops at a grain boundary, because the next grain has its lattice at a different angle. The pile-up of dislocations at the boundary raises the stress there until the neighbouring grain yields too. Make the grains smaller and there are more boundaries, so the pile-ups are shorter and a larger stress is needed to push the slip across: this is the <b>Hall-Petch</b> relation. It is the one strengthening method that also raises toughness, which is why normalising and grain refining are so common.</p><div class=\"math\">sigma_y = sigma_0 + k d^(-1/2)      sigma_0 = 100 MPa, k = 23.4 MPa mm^0.5\n\nd = 0.0625 mm -> d^-1/2 = 4.00 -> sigma_y = 100 + 93.6 = 194 MPa\nd = 0.0156 mm -> d^-1/2 = 8.00 -> sigma_y = 100 + 187.2 = 287 MPa\nhalf the grain size, + 93 MPa on the yield strength</div><div class=\"math\">ASTM grain size number:  n = 2^(N-1) grains per square inch at 100x\nN = 6 -> n = 32 -> d = 25.4/(100 x sqrt(32)) = 0.045 mm\nN = 10 -> n = 512 -> d = 25.4/(100 x sqrt(512)) = 0.011 mm</div><p><b>Check your answer.</b> The relation is a straight line only when plotted against d^(-1/2). Plot against d itself and it curves, which is exactly what a student loses marks for.</p>", "gu": "<p>Slip plane પર સરતું dislocation grain boundary પર અટકે છે, કારણ કે પછીના grain નું lattice જુદા ખૂણે છે. Boundary પર dislocations નું થતું ઢગલો ત્યાં stress વધારે છે જ્યાં સુધી પાડોશી grain પણ yield ન થાય. Grains નાના કરો તો boundaries વધે, ઢગલા ટૂંકા રહે અને slip પસાર કરવા મોટું stress જોઈએ: આ <b>Hall-Petch</b> સંબંધ છે. તાકાત વધારવાની આ એક જ રીત છે જે toughness પણ વધારે છે, તેથી normalising અને grain refining ખૂબ વપરાય છે.</p><div class=\"math\">sigma_y = sigma_0 + k d^(-1/2)      sigma_0 = 100 MPa, k = 23.4 MPa mm^0.5\n\nd = 0.0625 mm -> d^-1/2 = 4.00 -> sigma_y = 100 + 93.6 = 194 MPa\nd = 0.0156 mm -> d^-1/2 = 8.00 -> sigma_y = 100 + 187.2 = 287 MPa\nhalf the grain size, + 93 MPa on the yield strength</div><div class=\"math\">ASTM grain size number:  n = 2^(N-1) grains per square inch at 100x\nN = 6 -> n = 32 -> d = 25.4/(100 x sqrt(32)) = 0.045 mm\nN = 10 -> n = 512 -> d = 25.4/(100 x sqrt(512)) = 0.011 mm</div><p><b>જવાબ ચકાસો.</b> આ સંબંધ સીધી રેખા ત્યારે જ બને જ્યારે d^(-1/2) સામે દોરો. d સામે દોરો તો વળાંક આવે, અને વિદ્યાર્થી ત્યાં જ ગુણ ગુમાવે છે.</p>"}, "diagram": "u2_hallpetch"}]}, {"title": {"en": "2.3 Solid solution, intermediate phase and the Hume-Rothery rules", "gu": "2.3 Solid solution, intermediate phase અને Hume-Rothery rules"}, "items": [{"h": {"en": "Two ways to dissolve one metal in another", "gu": "એક ધાતુ બીજીમાં ઓગળવાની બે રીત"}, "body": {"en": "<p>A <b>solid solution</b> is a single crystal in which one kind of atom has been replaced by another without changing the lattice. If the two atoms are of similar size the substitute atom simply takes the place of the one it replaced: a <b>substitutional</b> solution, as in copper-nickel, brass or stainless steel. If the second atom is much smaller it cannot take a lattice site and instead sits in the gap between the atoms: an <b>interstitial</b> solution, as carbon, nitrogen or hydrogen in iron. Interstitial atoms are few - carbon reaches only 2.14 % in austenite and 0.02 % in ferrite - but they distort the lattice and control the hardness of steel.</p><table><tr><th>Point</th><th>Substitutional</th><th>Interstitial</th></tr><tr><td>The second atom</td><td>replaces a host atom on its site</td><td>sits in a gap between host atoms</td></tr><tr><td>Size of the second atom</td><td>within 15 % of the host</td><td>much smaller, below 0.6 of the host radius</td></tr><tr><td>How much dissolves</td><td>up to 100 % (Cu-Ni)</td><td>a small fraction (max 2.14 % C)</td></tr><tr><td>Effect on properties</td><td>raises strength and hardness steadily</td><td>distorts the lattice, huge effect on hardness</td></tr><tr><td>Example</td><td>brass, bronze, stainless steel</td><td>carbon and nitrogen in steel</td></tr></table><div class=\"math\">Vegard's law:   a(alloy) = x a(A) + (1 - x) a(B)\n\nCu-Ni solid solution, a(Cu) = 0.3615 nm, a(Ni) = 0.3524 nm\n50 % alloy: a = 0.5 x 0.3615 + 0.5 x 0.3524 = 0.3570 nm\nmeasured for 50/50 cupro-nickel: 0.3568 nm - within 0.06 %\n\ninterstitial carbon distorts instead: 0.02 % C in ferrite already changes a by 0.0002 nm</div><p><b>Why it is true.</b> The lattice parameter of a substitutional solution changes almost linearly with composition - Vegard's law - because the two atoms simply share the sites in proportion. That linear change is used to measure how much solute a phase holds, and it is why a copper-nickel alloy has one density you can predict.</p>", "gu": "<p><b>Solid solution</b> એ એક જ crystal છે જેમાં એક જાતના atom ની જગ્યાએ બીજા જાતના atom આવે છે, પણ lattice બદલાતું નથી. બે atoms ના માપ સરખા હોય તો નવો atom પોતાની જગ્યા સંભાળી લે: <b>substitutional</b> solution, જેમ copper-nickel, brass કે stainless steel માં. બીજો atom ઘણો નાનો હોય તો lattice ની જગ્યા લઈ શકે નહીં અને atoms વચ્ચેની ખાલી જગ્યામાં બેસે: <b>interstitial</b> solution, જેમ iron માં carbon, nitrogen કે hydrogen. Interstitial atoms થોડા હોય છે - austenite માં carbon 2.14 % અને ferrite માં 0.02 % સુધી જ - પણ તે lattice ને વાળે છે અને સ્ટીલની hardness નક્કી કરે છે.</p><table><tr><th>મુદ્દો</th><th>Substitutional</th><th>Interstitial</th></tr><tr><td>બીજો atom</td><td>host atom ની જગ્યાએ બેસે</td><td>host atoms વચ્ચેની ખાલી જગ્યામાં બેસે</td></tr><tr><td>બીજા atom નું માપ</td><td>host કરતાં 15 % અંદર</td><td>ઘણો નાનો, host radius ના 0.6 થી નીચે</td></tr><tr><td>કેટલું ઓગળે</td><td>100 % સુધી (Cu-Ni)</td><td>થોડો ભાગ (વધુમાં વધુ 2.14 % C)</td></tr><tr><td>ગુણધર્મો પર અસર</td><td>તાકાત અને hardness સતત વધારે</td><td>lattice વાળે, hardness પર ઘણી અસર</td></tr><tr><td>ઉદાહરણ</td><td>પિત્તળ, bronze, stainless steel</td><td>સ્ટીલમાં carbon અને nitrogen</td></tr></table><div class=\"math\">Vegard's law:   a(alloy) = x a(A) + (1 - x) a(B)\n\nCu-Ni solid solution, a(Cu) = 0.3615 nm, a(Ni) = 0.3524 nm\n50 % alloy: a = 0.5 x 0.3615 + 0.5 x 0.3524 = 0.3570 nm\nmeasured for 50/50 cupro-nickel: 0.3568 nm - within 0.06 %\n\ninterstitial carbon distorts instead: 0.02 % C in ferrite already changes a by 0.0002 nm</div><p><b>કેમ સાચું છે.</b> Substitutional solution નું lattice parameter composition સાથે લગભગ સીધું બદલાય છે - Vegard's law - કારણ કે બે atoms પ્રમાણમાં જગ્યા વહેંચે છે. એ સીધા ફેરફારથી phase માં કેટલું solute છે તે મપાય છે, અને તેથી copper-nickel alloy ની density અગાઉથી ગણી શકાય છે.</p>"}, "diagram": "u2_solution"}, {"h": {"en": "The Hume-Rothery rules, and when a compound forms instead", "gu": "Hume-Rothery rules, અને ત્યારે શું compound બને"}, "body": {"en": "<p>Two metals do not dissolve in each other in every proportion. The four rules below say when a wide substitutional solution is possible; break one of them and the solubility drops, break several and the pair prefers to form a <b>compound</b> with a fixed composition. That compound - CuAl2, Fe3C, Mg2Si - is called an <b>intermediate phase</b>: it has its own lattice, its own melting point, and usually it is hard and brittle.</p><ol><li>en</li><li>en</li><li>en</li><li>en</li><li>en</li></ol><div class=\"math\">Cu-Ni:  r(Cu) = 128 pm, r(Ni) = 125 pm -> difference 2.3 %  (rule 1 passes)\n        both FCC                                     (rule 2 passes)\n        -> complete solubility, no compound\n\nCu-Zn:  r(Cu) = 128 pm, r(Zn) = 134 pm -> 4.7 % (passes), but brass stops\n        at about 39 % Zn and then the beta phase appears\nFe-C:   r(Fe) = 126 pm, r(C) = 77 pm -> carbon is 39% of iron: no substitution\n        carbon is interstitial, and above 6.67 % it is all cementite</div><p><b>Common mistake.</b> Do not say carbon 'dissolves in iron up to 2.14 %' without saying which iron. It is austenite (FCC) that takes 2.14 %; ferrite (BCC) takes only 0.02 %, which is why quenching traps carbon in a distorted lattice and makes martensite.</p>", "gu": "<p>બે ધાતુઓ દરેક પ્રમાણમાં એકબીજામાં ઓગળતી નથી. નીચેના ચાર નિયમો કહે છે કે પહોળું substitutional solution ક્યારે શક્ય છે; એક નિયમ તૂટે તો solubility ઘટે, ઘણા તૂટે તો જોડી નિશ્ચિત composition નું <b>compound</b> બનાવવાનું પસંદ કરે. એ compound - CuAl2, Fe3C, Mg2Si - ને <b>intermediate phase</b> કહે છે: તેનું પોતાનું lattice, પોતાનું ગલનબિંદુ, અને સામાન્ય રીતે તે સખત અને ભંગુર હોય છે.</p><ol><li>gu</li><li>gu</li><li>gu</li><li>gu</li><li>gu</li></ol><div class=\"math\">Cu-Ni:  r(Cu) = 128 pm, r(Ni) = 125 pm -> difference 2.3 %  (rule 1 passes)\n        both FCC                                     (rule 2 passes)\n        -> complete solubility, no compound\n\nCu-Zn:  r(Cu) = 128 pm, r(Zn) = 134 pm -> 4.7 % (passes), but brass stops\n        at about 39 % Zn and then the beta phase appears\nFe-C:   r(Fe) = 126 pm, r(C) = 77 pm -> carbon is 39% of iron: no substitution\n        carbon is interstitial, and above 6.67 % it is all cementite</div><p><b>સામાન્ય ભૂલ.</b> 'Carbon iron માં 2.14 % સુધી ઓગળે' એ કઈ iron તે કહ્યા વગર ન કહો. 2.14 % austenite (FCC) લે છે; ferrite (BCC) ફક્ત 0.02 % લે છે, અને તેથી જ quenching માં carbon વળેલા lattice માં ફસાય અને martensite બને.</p>"}}]}, {"title": {"en": "2.4 Reading a binary phase diagram, and the lever rule", "gu": "2.4 Binary phase diagram વાંચવું, અને lever rule"}, "items": [{"h": {"en": "Copper-nickel: the isomorphous diagram and the lever rule", "gu": "Copper-nickel: isomorphous diagram અને lever rule"}, "body": {"en": "<p>Copper and nickel pass all the Hume-Rothery tests, so their diagram is the simplest one possible: a single liquidus above a single solidus, meeting at the melting points of the two pure metals. Every alloy of the pair begins to freeze at its liquidus, finishes at its solidus, and inside the lens between them two phases - liquid and solid solution - sit side by side. The compositions of those two phases are read at the two ends of a horizontal <b>tie line</b> drawn at the temperature of interest, and how much of each there is comes from the <b>lever rule</b>.</p><div class=\"math\">lever rule on a tie line at T, alloy composition C0:\n\nW(liquid) = (C_s - C0) / (C_s - C_l)      W(solid) = (C0 - C_l) / (C_s - C_l)\nW(liquid) + W(solid) = 1\n\n50 % Ni at 1300 C:  C_l = 40 % Ni,  C_s = 60 % Ni\nW(liquid) = (60 - 50)/(60 - 40) = 10/20 = 0.50\nW(solid)  = (50 - 40)/(60 - 40) = 10/20 = 0.50\nin 2 kg of alloy: 1.00 kg liquid and 1.00 kg solid, of 40 % and 60 % Ni</div><p><b>Why it is true.</b> The lever rule is a balance, not a formula to memorise: the amount of a phase is inversely proportional to its distance from the alloy composition, exactly like a see-saw. The phase whose composition is far from C0 must be present in small amount, which is why the answer for the 50 % alloy comes out equal - it sits exactly in the middle.</p><p><b>Check your answer.</b> A quick check that catches most mistakes: at the liquidus, W(liquid) must be 1; at the solidus it must be 0. Put C0 = C_l and C0 = C_s in your own formula and see.</p>", "gu": "<p>Copper અને nickel બધા Hume-Rothery કસોટી પાસ કરે છે, તેથી તેમનો diagram સૌથી સરળ છે: એક liquidus નીચે એક જ solidus, જે બંને શુદ્ધ ધાતુનાં ગલનબિંદુએ મળે છે. જોડીનું દરેક alloy પોતાના liquidus પર થીજવા લાગે, solidus પર પૂરું થાય, અને વચ્ચેના lens માં liquid અને solid solution - બે phase સાથે રહે છે. એ બે phase નું composition વિચારેલા temperature પર દોરેલી સપાટ <b>tie line</b> ના બે છેડે વંચાય છે, અને દરેક કેટલું છે તે <b>lever rule</b> આપે છે.</p><div class=\"math\">lever rule on a tie line at T, alloy composition C0:\n\nW(liquid) = (C_s - C0) / (C_s - C_l)      W(solid) = (C0 - C_l) / (C_s - C_l)\nW(liquid) + W(solid) = 1\n\n50 % Ni at 1300 C:  C_l = 40 % Ni,  C_s = 60 % Ni\nW(liquid) = (60 - 50)/(60 - 40) = 10/20 = 0.50\nW(solid)  = (50 - 40)/(60 - 40) = 10/20 = 0.50\nin 2 kg of alloy: 1.00 kg liquid and 1.00 kg solid, of 40 % and 60 % Ni</div><p><b>કેમ સાચું છે.</b> Lever rule એ સંતુલન છે, યાદ રાખવાનું સૂત્ર નહીં: phase ની માત્રા alloy ના composition થી તેના અંતરની વ્યસ્ત પ્રમાણમાં હોય છે, જેમ સીસોડિયું. જે phase નું composition C0 થી દૂર હોય તેની માત્રા ઓછી જ હોય, અને તેથી જ 50 % alloy નો જવાબ સરખો આવે - તે બરાબર વચ્ચે બેસે છે.</p><p><b>જવાબ ચકાસો.</b> મોટા ભાગની ભૂલ પકડતી ઝડપી ચકાસણી: liquidus પર W(liquid) = 1 થવું જોઈએ; solidus પર 0. તમારા સૂત્રમાં C0 = C_l અને C0 = C_s મૂકી જુઓ.</p>"}, "diagram": "u2_cuni"}, {"h": {"en": "Lead-tin: the eutectic diagram", "gu": "Lead-tin: eutectic diagram અને તેનાં બિંદુઓ"}, "body": {"en": "<p>Lead and tin fail the size and structure tests, so each dissolves only a little of the other: at 183 C lead takes 19.2 % tin and tin takes 2.5 % lead. The two liquidus branches therefore meet at a single point - the <b>eutectic point</b>, 61.9 % tin and 183 C - where the liquid freezes all at once into the two solid solutions, α and β. An alloy of eutectic composition has no freezing range at all: it is liquid at 184 C and solid at 182 C, which is exactly what a solder or a type metal wants.</p><table><tr><th>Point or line</th><th>Composition</th><th>Temperature</th><th>What happens</th></tr><tr><td>Melting point of Pb</td><td>0 % Sn</td><td>327 C</td><td>pure lead melts</td></tr><tr><td>Melting point of Sn</td><td>100 % Sn</td><td>232 C</td><td>pure tin melts</td></tr><tr><td>Eutectic point</td><td>61.9 % Sn</td><td>183 C</td><td>L -> α + β at one temperature</td></tr><tr><td>Max Sn in α</td><td>19.2 % Sn</td><td>183 C</td><td>the lead-rich solid solution</td></tr><tr><td>Max Pb in β</td><td>97.5 % Sn</td><td>183 C</td><td>the tin-rich solid solution</td></tr></table><div class=\"math\">40 % Sn alloy at 200 C:  C_l = 55 % Sn,  C_alpha = 17 % Sn\nW(liquid) = (40 - 17)/(55 - 17) = 23/38 = 0.60\nW(alpha)  = (55 - 40)/(55 - 17) = 15/38 = 0.40\n\ncool it further to 183 C: the last liquid is 61.9 % Sn\nthe eutectic reaction: L(61.9) -> alpha(19.2) + beta(97.5)   F = 0</div><p><b>Why it is true.</b> Every alloy to the left of the eutectic is <b>hypoeutectic</b> and shows primary α before the eutectic freezes; every alloy to the right is <b>hypereutectic</b> and shows primary β. The eutectic alloy shows only the two-phase mixture, which is why its micrograph looks like a fine striped pattern.</p>", "gu": "<p>Lead અને tin size તથા structure ની કસોટીમાં ઊતરતા નથી, તેથી દરેક થોડું જ બીજાનું ઓગાળે છે: 183 C પર lead 19.2 % tin લે અને tin 2.5 % lead લે. તેથી બંને liquidus શાખા એક જ બિંદુએ મળે - <b>eutectic point</b>, 61.9 % tin અને 183 C - જ્યાં પ્રવાહી એકસાથે બે solid solution α અને β માં થીજે છે. Eutectic composition ના alloy ને freezing range જ નથી: 184 C પર પ્રવાહી અને 182 C પર ઘન, જે solder કે type metal ને બરાબર જોઈએ તેવું છે.</p><table><tr><th>બિંદુ કે રેખા</th><th>Composition</th><th>Temperature</th><th>શું થાય</th></tr><tr><td>Pb નું ગલનબિંદુ</td><td>0 % Sn</td><td>327 C</td><td>શુદ્ધ lead પીગળે</td></tr><tr><td>Sn નું ગલનબિંદુ</td><td>100 % Sn</td><td>232 C</td><td>શુદ્ધ tin પીગળે</td></tr><tr><td>Eutectic point</td><td>61.9 % Sn</td><td>183 C</td><td>L -> α + β એક જ temperature પર</td></tr><tr><td>α માં વધુમાં વધુ Sn</td><td>19.2 % Sn</td><td>183 C</td><td>lead-વધુ solid solution</td></tr><tr><td>β માં વધુમાં વધુ Pb</td><td>97.5 % Sn</td><td>183 C</td><td>tin-વધુ solid solution</td></tr></table><div class=\"math\">40 % Sn alloy at 200 C:  C_l = 55 % Sn,  C_alpha = 17 % Sn\nW(liquid) = (40 - 17)/(55 - 17) = 23/38 = 0.60\nW(alpha)  = (55 - 40)/(55 - 17) = 15/38 = 0.40\n\ncool it further to 183 C: the last liquid is 61.9 % Sn\nthe eutectic reaction: L(61.9) -> alpha(19.2) + beta(97.5)   F = 0</div><p><b>કેમ સાચું છે.</b> Eutectic ની ડાબી બાજુનું દરેક alloy <b>hypoeutectic</b> છે અને eutectic થીજે તે પહેલાં primary α દેખાય; જમણી બાજુનું દરેક <b>hypereutectic</b> છે અને primary β દેખાય. Eutectic alloy માં ફક્ત બે-phase મિશ્રણ દેખાય, તેથી તેનું micrograph નાની પટ્ટીઓ જેવું લાગે.</p>"}, "diagram": "u2_pbsn"}]}, {"title": {"en": "2.5 The iron-iron carbide diagram", "gu": "2.5 Iron-iron carbide diagram અને તેનાં બિંદુઓ"}, "items": [{"h": {"en": "Iron changes its own lattice, and that is the whole subject", "gu": "Iron પોતાનું lattice બદલે છે, અને આખો વિષય એમાં જ છે"}, "body": {"en": "<p>Pure iron is <b>allotropic</b>: between 912 C and 1394 C it is FCC (austenite, γ), below 912 C and above 1394 C it is BCC (ferrite, α, and the high-temperature δ which is also BCC). The FCC lattice has a bigger hole in the middle, so austenite can hold 2.14 % carbon while ferrite holds only 0.02 %. That single fact explains the whole heat treatment of steel: heat it into the austenite range, the carbon dissolves; cool it slowly, the carbon comes back out as cementite; cool it fast, the carbon is trapped.</p><table><tr><th>Point</th><th>C %</th><th>T (C)</th><th>Meaning</th></tr><tr><td>A</td><td>0</td><td>1538</td><td>melting point of pure iron</td></tr><tr><td>N</td><td>0</td><td>1394</td><td>δ -> γ (BCC to FCC)</td></tr><tr><td>G</td><td>0</td><td>912</td><td>γ -> α, the A3 of pure iron</td></tr><tr><td>E</td><td>2.14</td><td>1147</td><td>most carbon austenite can hold</td></tr><tr><td>C</td><td>4.3</td><td>1147</td><td>eutectic: L -> γ + Fe3C (ledeburite)</td></tr><tr><td>S</td><td>0.8</td><td>727</td><td>eutectoid: γ -> α + Fe3C (pearlite)</td></tr><tr><td>P</td><td>0.02</td><td>727</td><td>carbon left in ferrite</td></tr><tr><td>K</td><td>6.67</td><td>727</td><td>cementite, Fe3C</td></tr></table><div class=\"math\">eutectic  (1147 C):  L(4.3 % C)  ->  gamma(2.14 %) + Fe3C(6.67 %)   F = 0\neutectoid (727 C):   gamma(0.8 % C) -> alpha(0.02 %) + Fe3C(6.67 %)  F = 1\n\nsteel:      0.02 to 2.14 % C   (hypoeutectoid below 0.8, hypereutectoid above)\ncast iron:  2.14 to 6.67 % C  (eutectic, so it is cast, not rolled)</div><p><b>Why it is true.</b> The line E-S (the Acm) and the line G-S (the A3) are the two boundaries a heat treater aims at. Heat a 0.4 % steel above A3 and it becomes all austenite; hold it there and the carbon is evenly spread; cool it and whatever you cool it into is the structure you get. Every heat treatment is a choice of temperature on this diagram and a choice of cooling rate off it.</p><p><b>Common mistake.</b> Cementite is not a phase you can see as a metal - it is a compound, Fe3C, 6.67 % carbon, hard and brittle. Pearlite is not a third phase either: it is a two-phase mixture of ferrite and cementite, and it is called a micro-constituent, not a phase.</p>", "gu": "<p>શુદ્ધ iron <b>allotropic</b> છે: 912 C થી 1394 C વચ્ચે તે FCC (austenite, γ) છે, 912 C ની નીચે અને 1394 C ની ઉપર BCC (ferrite, α, અને ઊંચા temperature નું δ જે પણ BCC છે) છે. FCC lattice માં વચ્ચેની ખાલી જગ્યા મોટી હોય છે, તેથી austenite 2.14 % carbon રાખી શકે જ્યારે ferrite ફક્ત 0.02 % રાખે. આ એક જ હકીકત સ્ટીલની આખી heat treatment સમજાવે છે: austenite ના વિસ્તારમાં ગરમ કરો તો carbon ઓગળે; ધીમે ઠંડું કરો તો carbon cementite સ્વરૂપે પાછું નીકળે; ઝડપથી ઠંડું કરો તો carbon ફસાઈ જાય.</p><table><tr><th>બિંદુ</th><th>C %</th><th>T (C)</th><th>અર્થ</th></tr><tr><td>A</td><td>0</td><td>1538</td><td>શુદ્ધ iron નું ગલનબિંદુ</td></tr><tr><td>N</td><td>0</td><td>1394</td><td>δ -> γ (BCC થી FCC)</td></tr><tr><td>G</td><td>0</td><td>912</td><td>γ -> α, શુદ્ધ iron નું A3</td></tr><tr><td>E</td><td>2.14</td><td>1147</td><td>austenite રાખી શકે તેવો વધુમાં વધુ carbon</td></tr><tr><td>C</td><td>4.3</td><td>1147</td><td>eutectic: L -> γ + Fe3C (ledeburite) એટલે પ્રવાહીમાંથી બે ઘન</td></tr><tr><td>S</td><td>0.8</td><td>727</td><td>eutectoid: γ -> α + Fe3C (pearlite) એટલે ઘનમાંથી બે ઘન</td></tr><tr><td>P</td><td>0.02</td><td>727</td><td>ferrite માં બચતો carbon</td></tr><tr><td>K</td><td>6.67</td><td>727</td><td>cementite, Fe3C</td></tr></table><div class=\"math\">eutectic  (1147 C):  L(4.3 % C)  ->  gamma(2.14 %) + Fe3C(6.67 %)   F = 0\neutectoid (727 C):   gamma(0.8 % C) -> alpha(0.02 %) + Fe3C(6.67 %)  F = 1\n\nsteel:      0.02 to 2.14 % C   (hypoeutectoid below 0.8, hypereutectoid above)\ncast iron:  2.14 to 6.67 % C  (eutectic, so it is cast, not rolled)</div><p><b>કેમ સાચું છે.</b> E-S રેખા (Acm) અને G-S રેખા (A3) એ બે સીમા છે જેને heat treater ધ્યાનમાં રાખે. 0.4 % સ્ટીલને A3 ઉપર ગરમ કરો તો આખું austenite થાય; ત્યાં રાખો તો carbon સરખો ફેલાય; ઠંડું કરો તો જેમાં ઠંડું કરો તે structure મળે. દરેક heat treatment એ આ diagram પર temperature ની પસંદગી અને તેની ઉપરથી cooling rate ની પસંદગી છે.</p><p><b>સામાન્ય ભૂલ.</b> Cementite એ ધાતુ તરીકે દેખાતો phase નથી - તે compound Fe3C છે, 6.67 % carbon, સખત અને ભંગુર. Pearlite પણ ત્રીજો phase નથી: તે ferrite અને cementite નું બે-phase મિશ્રણ છે, તેને micro-constituent કહે છે, phase નહીં.</p>"}, "diagram": "u2_fec"}, {"h": {"en": "The three steels across the eutectoid, and what carbon does", "gu": "Eutectoid આસપાસનાં ત્રણ સ્ટીલ, અને carbon શું કરે"}, "body": {"en": "<p>Cool a steel slowly from the austenite range and the microstructure that comes out depends on one number, the carbon content. Below 0.8 % the first thing to form is <b>proeutectoid ferrite</b>, which grows as pale grains, and the remaining austenite then turns into pearlite at 727 C - so the micrograph is ferrite with islands of pearlite. At exactly 0.8 % the whole grain is pearlite. Above 0.8 % the first thing out is <b>proeutectoid cementite</b>, which appears as a bright network on the old austenite grain boundaries, and the rest is pearlite.</p><div class=\"math\">pearlite % = (C - 0.02)/(0.80 - 0.02) x 100      Fe3C % = (C - 0.80)/(6.67 - 0.80) x 100\n\n0.4 % C:  pearlite = 0.38/0.78 = 48.7 %   ferrite = 51.3 %\n0.8 % C:  pearlite = 1.00/0.78 = 100 %\n1.2 % C:  Fe3C = 0.40/5.87 = 6.8 %       pearlite = 93.2 %\n\nin 5 kg of 0.4 % steel: 2.44 kg pearlite and 2.56 kg ferrite</div><table><tr><th>Carbon</th><th>Microstructure</th><th>Strength</th><th>Ductility</th><th>Used for</th></tr><tr><td>0.1 - 0.2 %</td><td>mostly ferrite</td><td>low, ~400 MPa UTS</td><td>very high</td><td>sheet, wire, nails, car body</td></tr><tr><td>0.3 - 0.5 %</td><td>ferrite + pearlite</td><td>medium, ~600 MPa UTS</td><td>good</td><td>shafts, gears, axles, rails</td></tr><tr><td>0.8 %</td><td>all pearlite</td><td>high, ~800 MPa UTS</td><td>low</td><td>springs, piano wire, cutting edges</td></tr><tr><td>1.0 - 1.4 %</td><td>pearlite + Fe3C network</td><td>very high, but brittle</td><td>very low</td><td>files, razors, ball bearings, dies</td></tr></table><p><b>Check your answer.</b> Ask which is stronger and the answer is not simply 'more carbon'. Up to about 0.8 % carbon raises strength; above it the cementite network makes the steel brittle, so toughness falls even though hardness rises.</p>", "gu": "<p>Austenite વિસ્તારથી સ્ટીલને ધીમે ઠંડું કરો તો નીકળતું microstructure એક જ આંકડા પર આધારે છે, carbon content. 0.8 % થી નીચે પહેલું બનતું <b>proeutectoid ferrite</b> છે, જે આછા grains તરીકે વધે, અને બાકીનું austenite પછી 727 C પર pearlite થાય - તેથી micrograph માં ferrite વચ્ચે pearlite ના ટાપુઓ દેખાય. બરાબર 0.8 % પર આખો grain pearlite હોય. 0.8 % થી ઉપર પહેલું નીકળતું <b>proeutectoid cementite</b> છે, જે જૂની austenite grain boundary પર તેજસ્વી જાળી તરીકે દેખાય, અને બાકીનું pearlite.</p><div class=\"math\">pearlite % = (C - 0.02)/(0.80 - 0.02) x 100      Fe3C % = (C - 0.80)/(6.67 - 0.80) x 100\n\n0.4 % C:  pearlite = 0.38/0.78 = 48.7 %   ferrite = 51.3 %\n0.8 % C:  pearlite = 1.00/0.78 = 100 %\n1.2 % C:  Fe3C = 0.40/5.87 = 6.8 %       pearlite = 93.2 %\n\nin 5 kg of 0.4 % steel: 2.44 kg pearlite and 2.56 kg ferrite</div><table><tr><th>Carbon</th><th>Microstructure</th><th>તાકાત</th><th>Ductility</th><th>ક્યાં વપરાય</th></tr><tr><td>0.1 - 0.2 %</td><td>મોટે ભાગે ferrite</td><td>ઓછી, ~400 MPa UTS</td><td>ખૂબ ઊંચી</td><td>પાતળી ચાદર, તાર, ખીલા, car body</td></tr><tr><td>0.3 - 0.5 %</td><td>ferrite + pearlite</td><td>મધ્યમ, ~600 MPa UTS</td><td>સારી</td><td>ધરી, ગિયર, axles, rails</td></tr><tr><td>0.8 %</td><td>આખું pearlite</td><td>ઊંચી, ~800 MPa UTS</td><td>ઓછી</td><td>સ્પ્રિંગ, piano wire, cutting edges</td></tr><tr><td>1.0 - 1.4 %</td><td>pearlite + Fe3C જાળી</td><td>ખૂબ ઊંચી, પણ ભંગુર</td><td>ખૂબ ઓછી</td><td>પાની, razors, ball bearings, dies</td></tr></table><p><b>જવાબ ચકાસો.</b> કયું વધુ મજબૂત છે એ પૂછો તો જવાબ ફક્ત 'વધુ carbon' નથી. લગભગ 0.8 % સુધી carbon તાકાત વધારે; તેનાથી ઉપર cementite ની જાળી સ્ટીલને ભંગુર કરે, તેથી hardness વધે પણ toughness ઘટે.</p>"}, "diagram": "u2_micro"}]}, {"title": {"en": "2.6 The concept of heat treatment", "gu": "2.6 Heat treatment નો ખ્યાલ"}, "items": [{"h": {"en": "Heat treatment: three steps, one purpose", "gu": "Heat treatment: ત્રણ પગલાં, એક હેતુ"}, "body": {"en": "<p><b>Heat treatment</b> is the controlled heating and cooling of a solid metal to change its structure, and through the structure its properties - without changing the shape of the part and without changing its composition. Every treatment has the same three steps: <b>heat</b> to a chosen temperature and hold it until the structure is uniform, then <b>cool</b> at a chosen rate. The temperature decides what structure you start from; the cooling rate decides what structure you finish with.</p><table><tr><th>Treatment</th><th>Heat to</th><th>Cool by</th><th>What it gives</th></tr><tr><td>Full annealing</td><td>30-50 C above A3 (or A1 for hypereutectoid)</td><td>furnace cooling, very slow</td><td>soft, coarse pearlite; easy to machine</td></tr><tr><td>Normalising</td><td>30-50 C above A3</td><td>still air</td><td>finer pearlite, higher strength than annealed</td></tr><tr><td>Hardening</td><td>30-50 C above A3 or Acm</td><td>quench in water, oil or brine</td><td>martensite: hardest, most brittle</td></tr><tr><td>Tempering</td><td>below A1, 150-650 C</td><td>any, then air cool</td><td>toughness back; hardness set by the temperature</td></tr><tr><td>Case hardening</td><td>surface only, with carbon or nitrogen</td><td>quench after diffusing</td><td>hard skin on a tough core</td></tr></table><div class=\"math\">A1 = 727 C for every steel (the eutectoid line)\nA3 falls from 912 C at 0 % C to 727 C at 0.8 % C (hypoeutectoid steels)\nAcm rises from 727 C at 0.8 % C to 1147 C at 2.14 % C (hypereutectoid steels)\n\nso 0.4 % C steel is austenitised at about 800-830 C\nand 1.2 % C steel at about 750-780 C - above A1, below Acm</div><p><b>Why it is true.</b> Hardening is not about the carbon alone: it is about how fast the austenite is cooled. Slow cooling gives the carbon time to diffuse out and form cementite; fast cooling does not, and the carbon is trapped in a strained lattice. That trapped structure, martensite, is hard because the carbon has nowhere to go - and it is brittle for the same reason, which is why it is always tempered.</p><p><b>Check your answer.</b> The three steps answer three different questions: temperature decides which phase you begin with, holding time decides how even it is, cooling rate decides what you end with. An answer that mentions only temperature is half an answer.</p>", "gu": "<p><b>Heat treatment</b> એ ઘન ધાતુને નિયંત્રિત રીતે ગરમ કરીને અને ઠંડી કરીને તેની રચના બદલવી છે, અને રચના દ્વારા તેના ગુણધર્મો - ભાગનો આકાર બદલ્યા વગર અને composition બદલ્યા વગર. દરેક treatment માં એ જ ત્રણ પગલાં છે: પસંદ કરેલા temperature સુધી <b>ગરમ કરો</b> અને રચના સરખી ન થાય ત્યાં સુધી રાખો, પછી પસંદ કરેલા દરથી <b>ઠંડું કરો</b>. Temperature નક્કી કરે કે કઈ રચનાથી શરૂ કરવું; cooling rate નક્કી કરે કે કઈ રચના પર પૂરું કરવું.</p><table><tr><th>Treatment</th><th>કેટલું ગરમ</th><th>કેવી રીતે ઠંડું</th><th>શું મળે</th></tr><tr><td>Full annealing</td><td>A3 થી 30-50 C ઉપર (hypereutectoid માટે A1)</td><td>furnace માં, ખૂબ ધીમે</td><td>નરમ, જાડું pearlite; machining સહેલું</td></tr><tr><td>Normalising</td><td>A3 થી 30-50 C ઉપર</td><td>શાંત હવામાં</td><td>નાનું pearlite, annealed કરતાં વધુ તાકાત</td></tr><tr><td>Hardening</td><td>A3 કે Acm થી 30-50 C ઉપર</td><td>water, oil કે brine માં quench</td><td>martensite: સૌથી સખત, સૌથી ભંગુર</td></tr><tr><td>Tempering</td><td>A1 ની નીચે, 150-650 C</td><td>કોઈ પણ, પછી હવામાં</td><td>toughness પાછી; hardness temperature થી નક્કી</td></tr><tr><td>Case hardening</td><td>ફક્ત ઉપરની સપર, carbon કે nitrogen સાથે</td><td>diffuse કરીને quench</td><td>તough core પર સખત skin</td></tr></table><div class=\"math\">A1 = 727 C for every steel (the eutectoid line)\nA3 falls from 912 C at 0 % C to 727 C at 0.8 % C (hypoeutectoid steels)\nAcm rises from 727 C at 0.8 % C to 1147 C at 2.14 % C (hypereutectoid steels)\n\nso 0.4 % C steel is austenitised at about 800-830 C\nand 1.2 % C steel at about 750-780 C - above A1, below Acm</div><p><b>કેમ સાચું છે.</b> Hardening ફક્ત carbon ની વાત નથી: austenite કેટલી ઝડપથી ઠંડું થાય તેની છે. ધીમે ઠંડું કરો તો carbon ને બહાર નીકળી cementite બનવા સમય મળે; ઝડપથી કરો તો નહીં, અને carbon તણાયેલા lattice માં ફસાય. એ ફસાયેલી રચના, martensite, સખત છે કારણ કે carbon ને જવાની જગ્યા નથી - અને એ જ કારણે ભંગુર પણ છે, તેથી તેને હંમેશા temper કરાય છે.</p><p><b>જવાબ ચકાસો.</b> ત્રણ પગલાં ત્રણ જુદા પ્રશ્નોના જવાબ છે: temperature નક્કી કરે કયા phase થી શરૂ કરવું, holding time નક્કી કરે તે કેટલું સરખું છે, cooling rate નક્કી કરે અંતે શું મળે. ફક્ત temperature લખો તો અડધો જવાબ છે.</p>"}}]}, {"title": {"en": "2.7 Solved Numericals, Step by Step", "gu": "2.7 ઉકેલેલા દાખલા, પગલે પગલે"}, "items": [{"h": {"en": "Phase rule on four points", "gu": "ચાર બિંદુ પર phase rule"}, "body": {"en": "<h4>Question (6 marks)</h4><p>Apply the phase rule at four points and state what the number means: (a) pure iron at 1450 C in the austenite field, (b) pure iron at 1538 C where solid and liquid coexist, (c) the lead-tin eutectic at 183 C, (d) a 40 % tin alloy at 200 C where alpha and liquid coexist.</p><h4>Step 1 - the formula and the components</h4><div class=\"math\">F = C - P + 2, and at the fixed pressure of 1 atm we use F = C - P + 1\npure iron: C = 1     iron-carbon or lead-tin: C = 2</div><h4>Step 2 - one point at a time</h4><div class=\"math\">(a) C=1, P=1 (austenite only)        F = 1-1+1 = 1\n(b) C=1, P=2 (solid + liquid)        F = 1-2+1 = 0\n(c) C=2, P=3 (L + alpha + beta)      F = 2-3+1 = 0\n(d) C=2, P=2 (alpha + liquid)        F = 2-2+1 = 1</div><h4>Step 3 - what the numbers mean</h4><div class=\"math\">F = 1: choose the temperature, the compositions then follow the field boundaries\nF = 0: nothing is free - the point is invariant\nat the melting point of iron the temperature stays at 1538 C until it is all liquid\nat 183 C the lead-tin eutectic freezes completely at that one temperature</div><div class=\"eq\">(a) F = 1,  (b) F = 0 invariant,  (c) F = 0 invariant,  (d) F = 1</div><p>Point (c) is the reason a eutectic alloy freezes at a single temperature: with three phases in a two-component system there is no freedom left, so the temperature cannot fall until one phase disappears. Point (d) is the ordinary two-phase field - you pick the temperature and the tie line then fixes both compositions, which is why the lever rule works there.</p><p><b>Check your answer.</b> If you use F = C - P + 2 without fixing the pressure, every answer here goes up by one. Say which rule you are using - the examiner is looking for that sentence.</p>", "gu": "<h4>પ્રશ્ન (6 marks)</h4><p>ચાર બિંદુ પર phase rule લાગુ કરો અને આંકડાનો અર્થ કહો: (a) austenite વિસ્તારમાં 1450 C પર શુદ્ધ iron, (b) 1538 C પર જ્યાં ઘન અને પ્રવાહી સાથે છે, (c) 183 C પરનું lead-tin eutectic, (d) 200 C પર 40 % tin નું alloy જ્યાં alpha અને પ્રવાહી સાથે છે.</p><h4>પગલું 1 - સૂત્ર અને components</h4><div class=\"math\">F = C - P + 2, and at the fixed pressure of 1 atm we use F = C - P + 1\npure iron: C = 1     iron-carbon or lead-tin: C = 2</div><h4>પગલું 2 - એક એક બિંદુ</h4><div class=\"math\">(a) C=1, P=1 (austenite only)        F = 1-1+1 = 1\n(b) C=1, P=2 (solid + liquid)        F = 1-2+1 = 0\n(c) C=2, P=3 (L + alpha + beta)      F = 2-3+1 = 0\n(d) C=2, P=2 (alpha + liquid)        F = 2-2+1 = 1</div><h4>પગલું 3 - આંકડાનો અર્થ</h4><div class=\"math\">F = 1: choose the temperature, the compositions then follow the field boundaries\nF = 0: nothing is free - the point is invariant\nat the melting point of iron the temperature stays at 1538 C until it is all liquid\nat 183 C the lead-tin eutectic freezes completely at that one temperature</div><div class=\"eq\">(a) F = 1,  (b) F = 0 invariant,  (c) F = 0 invariant,  (d) F = 1</div><p>બિંદુ (c) એ જ કારણ છે કે eutectic alloy એક જ temperature પર થીજે: બે-component system માં ત્રણ phase હોય તો કોઈ સ્વતંત્રતા બચતી નથી, તેથી એક phase જાય નહીં ત્યાં સુધી temperature ઘટી શકે નહીં. બિંદુ (d) સામાન્ય બે-phase field છે - તમે temperature પસંદ કરો અને પછી tie line બંને composition નક્કી કરે, તેથી જ ત્યાં lever rule ચાલે છે.</p><p><b>જવાબ ચકાસો.</b> Pressure નિશ્ચિત કર્યા વગર F = C - P + 2 વાપરો તો અહીંનો દરેક જવાબ એક વધે. તમે કયો નિયમ વાપરો છો તે લખો - પરીક્ષક એ જ વાક્ય શોધે છે.</p>"}}, {"h": {"en": "Lever rule on a lead-tin alloy", "gu": "Lead-tin alloy પર lever rule"}, "body": {"en": "<h4>Question (7 marks)</h4><p>A 40 % tin solder is held at 200 C. Read the compositions of the two phases from the diagram, find the mass of each in 2 kg of alloy, and say what happens to the last liquid when the alloy cools to 183 C.</p><h4>Step 1 - read the tie line</h4><div class=\"math\">at 200 C the tie line runs from C_alpha to C_liquid\nalpha (lead-rich, left end):  C_alpha = 17 % Sn\nliquid (right end):            C_L     = 55 % Sn\nalloy:                         C0      = 40 % Sn</div><h4>Step 2 - the lever rule</h4><div class=\"math\">W_L     = (C0 - C_alpha)/(C_L - C_alpha) = (40 - 17)/(55 - 17) = 23/38 = 0.605\nW_alpha = (C_L - C0)/(C_L - C_alpha)      = (55 - 40)/(55 - 17) = 15/38 = 0.395\ncheck: 0.605 + 0.395 = 1.000</div><h4>Step 3 - the masses in 2 kg</h4><div class=\"math\">m_L     = 0.605 x 2 = 1.21 kg of liquid, 55 % Sn\nm_alpha = 0.395 x 2 = 0.79 kg of alpha, 17 % Sn\nthe liquid is the phase farther from C0, so it is the larger one</div><div class=\"eq\">17 % and 55 % Sn,  60.5 % liquid and 39.5 % alpha,  1.21 kg and 0.79 kg</div><p>As the alloy cools further the liquid follows the liquidus down to the eutectic point: the last drop of liquid is 61.9 % tin and it freezes at 183 C into alpha and beta together. That is why the microstructure of a 40 % solder shows primary alpha with eutectic between the arms.</p><p><b>Common mistake.</b> The lever rule arms are measured from C0, not from zero: taking (40 - 0)/(55 - 17) is the commonest mistake and it gives an answer larger than 1.</p>", "gu": "<h4>પ્રશ્ન (7 marks)</h4><p>40 % tin નું solder 200 C પર રખાય છે. Diagram પરથી બે phase નું composition વાંચો, 2 kg alloy માં દરેકનું દળ શોધો, અને alloy 183 C સુધી ઠંડું થાય ત્યારે છેલ્લા પ્રવાહીનું શું થાય તે કહો.</p><h4>પગલું 1 - tie line વાંચો</h4><div class=\"math\">at 200 C the tie line runs from C_alpha to C_liquid\nalpha (lead-rich, left end):  C_alpha = 17 % Sn\nliquid (right end):            C_L     = 55 % Sn\nalloy:                         C0      = 40 % Sn</div><h4>પગલું 2 - lever rule</h4><div class=\"math\">W_L     = (C0 - C_alpha)/(C_L - C_alpha) = (40 - 17)/(55 - 17) = 23/38 = 0.605\nW_alpha = (C_L - C0)/(C_L - C_alpha)      = (55 - 40)/(55 - 17) = 15/38 = 0.395\ncheck: 0.605 + 0.395 = 1.000</div><h4>પગલું 3 - 2 kg માં દળ</h4><div class=\"math\">m_L     = 0.605 x 2 = 1.21 kg of liquid, 55 % Sn\nm_alpha = 0.395 x 2 = 0.79 kg of alpha, 17 % Sn\nthe liquid is the phase farther from C0, so it is the larger one</div><div class=\"eq\">17 % and 55 % Sn,  60.5 % liquid and 39.5 % alpha,  1.21 kg and 0.79 kg</div><p>Alloy વધુ ઠંડું થાય તો પ્રવાહી liquidus પર ચાલીને eutectic બિંદુ સુધી જાય: છેલ્લું ટીપું 61.9 % tin નું હોય અને 183 C પર alpha તથા beta સાથે થીજે. તેથી જ 40 % solder ના microstructure માં primary alpha વચ્ચે eutectic દેખાય.</p><p><b>સામાન્ય ભૂલ.</b> Lever rule ના arms C0 થી મપાય છે, શૂન્યથી નહીં: (40 - 0)/(55 - 17) લેવી એ સૌથી સામાન્ય ભૂલ છે અને તે 1 થી મોટો જવાબ આપે છે.</p>"}}, {"h": {"en": "Copper-nickel: tie line, fractions and a check at a lower temperature", "gu": "Copper-nickel: tie line, પ્રમાણ અને નીચા temperature પર ચકાસણી"}, "body": {"en": "<h4>Question (7 marks)</h4><p>A 50 % nickel cupro-nickel is at 1300 C. Find the composition of the liquid and of the solid, the mass of each in 3 kg, and show that the same alloy at 1250 C is completely solid.</p><h4>Step 1 - the tie line at 1300 C</h4><div class=\"math\">liquidus at 1300 C:  C_L = 40 % Ni\nsolidus  at 1300 C:  C_s = 60 % Ni\nalloy:               C0  = 50 % Ni</div><h4>Step 2 - the lever rule and the masses</h4><div class=\"math\">W_L = (60 - 50)/(60 - 40) = 0.50\nW_s = (50 - 40)/(60 - 40) = 0.50\nm_L = 1.50 kg,  m_s = 1.50 kg in 3 kg of alloy</div><h4>Step 3 - the check at 1250 C</h4><div class=\"math\">solidus at 50 % Ni: interpolate between (40, 1240) and (60, 1300)\nT_solidus = 1240 + (50 - 40)/(60 - 40) x 60 = 1270 C\n1250 C is below 1270 C, so the alloy has already finished freezing\nW_L = 0 - it is 100 % solid solution, 50 % Ni throughout</div><div class=\"eq\">40 % and 60 % Ni,  half and half (1.5 kg each),  and at 1250 C it is 100 % solid</div><p><b>Why it is true.</b> Both answers come from the same diagram, which is the point of drawing one. The tie line gives the compositions, the lever rule gives the amounts, and the boundary of the field tells you when an answer of zero must be expected.</p><p><b>Check your answer.</b> A single-phase field always answers 100 % of one phase; if your lever rule gives a negative weight, the alloy is not in the two-phase field at all.</p>", "gu": "<h4>પ્રશ્ન (7 marks)</h4><p>50 % nickel નું cupro-nickel 1300 C પર છે. પ્રવાહી અને ઘનનું composition, 3 kg માં દરેકનું દળ શોધો, અને એ જ alloy 1250 C પર સંપૂર્ણ ઘન છે તે દર્શાવો.</p><h4>પગલું 1 - 1300 C પરની tie line</h4><div class=\"math\">liquidus at 1300 C:  C_L = 40 % Ni\nsolidus  at 1300 C:  C_s = 60 % Ni\nalloy:               C0  = 50 % Ni</div><h4>પગલું 2 - lever rule અને દળ</h4><div class=\"math\">W_L = (60 - 50)/(60 - 40) = 0.50\nW_s = (50 - 40)/(60 - 40) = 0.50\nm_L = 1.50 kg,  m_s = 1.50 kg in 3 kg of alloy</div><h4>પગલું 3 - 1250 C પર ચકાસણી</h4><div class=\"math\">solidus at 50 % Ni: interpolate between (40, 1240) and (60, 1300)\nT_solidus = 1240 + (50 - 40)/(60 - 40) x 60 = 1270 C\n1250 C is below 1270 C, so the alloy has already finished freezing\nW_L = 0 - it is 100 % solid solution, 50 % Ni throughout</div><div class=\"eq\">40 % and 60 % Ni,  half and half (1.5 kg each),  and at 1250 C it is 100 % solid</div><p><b>કેમ સાચું છે.</b> બંને જવાબ એક જ diagram પરથી આવે, અને diagram દોરવાનો આ જ ફાયદો છે. Tie line composition આપે, lever rule માત્રા આપે, અને field ની સીમા કહે કે શૂન્ય જવાબ ક્યારે આવવો જોઈએ.</p><p><b>જવાબ ચકાસો.</b> Single-phase field હંમેશા એક phase નું 100 % આપે; તમારો lever rule ઋણ weight આપે તો alloy બે-phase field માં જ નથી.</p>"}}, {"h": {"en": "Pearlite and cementite in two steels", "gu": "બે સ્ટીલમાં pearlite અને cementite"}, "body": {"en": "<h4>Question (8 marks)</h4><p>Using the eutectoid values, find the percentage of pearlite and of proeutectoid ferrite in a 0.4 % carbon steel, and the percentage of cementite in a 1.2 % carbon steel. Give the masses in 5 kg of each and explain the difference in properties.</p><h4>Step 1 - the phase boundaries</h4><div class=\"math\">ferrite at 727 C:      0.02 % C\neutectoid austenite:   0.80 % C\ncementite:             6.67 % C</div><h4>Step 2 - the 0.4 % steel</h4><div class=\"math\">pearlite % = (0.40 - 0.02)/(0.80 - 0.02) x 100 = 0.38/0.78 x 100 = 48.7 %\nproeutectoid ferrite = 100 - 48.7 = 51.3 %\nin 5 kg: pearlite 2.44 kg, ferrite 2.56 kg</div><h4>Step 3 - the 1.2 % steel</h4><div class=\"math\">Fe3C %  = (1.20 - 0.80)/(6.67 - 0.80) x 100 = 0.40/5.87 x 100 = 6.8 %\npearlite = 100 - 6.8 = 93.2 %\nin 5 kg: cementite 0.34 kg, pearlite 4.66 kg</div><div class=\"eq\">0.4 % C: 48.7 % pearlite;  1.2 % C: 6.8 % cementite;  masses 2.44 / 0.34 kg</div><p>The 0.4 % steel is half soft ferrite, so it is tough and is used for shafts and axles. The 1.2 % steel has a cementite network round every grain, so it is much harder and much more brittle - the right choice for a file, the wrong one for a shaft.</p><p><b>Common mistake.</b> Below 0.8 % carbon the formula for cementite gives a negative number - that is the signal that there is no proeutectoid cementite in the steel, not that the formula is wrong.</p>", "gu": "<h4>પ્રશ્ન (8 marks)</h4><p>Eutectoid મૂલ્યો વાપરીને 0.4 % carbon સ્ટીલમાં pearlite અને proeutectoid ferrite ની ટકાવારી, અને 1.2 % carbon સ્ટીલમાં cementite ની ટકાવારી શોધો. દરેકના 5 kg માં દળ આપો અને ગુણધર્મોમાં ફરક સમજાવો.</p><h4>પગલું 1 - phase સીમાઓ</h4><div class=\"math\">ferrite at 727 C:      0.02 % C\neutectoid austenite:   0.80 % C\ncementite:             6.67 % C</div><h4>પગલું 2 - 0.4 % સ્ટીલ</h4><div class=\"math\">pearlite % = (0.40 - 0.02)/(0.80 - 0.02) x 100 = 0.38/0.78 x 100 = 48.7 %\nproeutectoid ferrite = 100 - 48.7 = 51.3 %\nin 5 kg: pearlite 2.44 kg, ferrite 2.56 kg</div><h4>પગલું 3 - 1.2 % સ્ટીલ</h4><div class=\"math\">Fe3C %  = (1.20 - 0.80)/(6.67 - 0.80) x 100 = 0.40/5.87 x 100 = 6.8 %\npearlite = 100 - 6.8 = 93.2 %\nin 5 kg: cementite 0.34 kg, pearlite 4.66 kg</div><div class=\"eq\">0.4 % C: 48.7 % pearlite;  1.2 % C: 6.8 % cementite;  masses 2.44 / 0.34 kg</div><p>0.4 % સ્ટીલ અડધું નરમ ferrite છે, તેથી તે tough છે અને shafts તથા axles માટે વપરાય. 1.2 % સ્ટીલમાં દરેક grain ફરતે cementite ની જાળી હોય છે, તેથી તે ઘણું સખત અને ઘણું ભંગુર છે - file માટે યોગ્ય, shaft માટે ખોટું.</p><p><b>સામાન્ય ભૂલ.</b> 0.8 % થી નીચે carbon હોય તો cementite નું સૂત્ર ઋણ આંકડો આપે - એ સંકેત છે કે સ્ટીલમાં proeutectoid cementite નથી, સૂત્ર ખોટું નથી.</p>"}}, {"h": {"en": "Hall-Petch: two grain sizes and a target strength", "gu": "Hall-Petch: બે grain size અને એક લક્ષ્ય તાકાત"}, "body": {"en": "<h4>Question (6 marks)</h4><p>For a low carbon steel sigma_0 = 100 MPa and k = 23.4 MPa mm^0.5. Find the yield strength for grain sizes of 0.25 mm and 0.04 mm, and the grain size needed for a yield strength of 300 MPa.</p><h4>Step 1 - the relation</h4><div class=\"math\">sigma_y = sigma_0 + k d^(-1/2)\nd must be in mm, otherwise k has a different value</div><h4>Step 2 - the two grain sizes</h4><div class=\"math\">d = 0.25 mm:   d^-1/2 = 1/0.5 = 2.00 -> sigma_y = 100 + 23.4 x 2.00 = 147 MPa\nd = 0.04 mm:   d^-1/2 = 1/0.2 = 5.00 -> sigma_y = 100 + 23.4 x 5.00 = 217 MPa\nthe finer grain is 70 MPa stronger, with the same composition</div><h4>Step 3 - the grain size for 300 MPa</h4><div class=\"math\">300 = 100 + 23.4 d^(-1/2)\nd^(-1/2) = 200/23.4 = 8.547\nd = 1/8.547^2 = 0.0137 mm = 13.7 micrometre</div><div class=\"eq\">147 MPa, 217 MPa, and d = 0.0137 mm for 300 MPa</div><p><b>Why it is true.</b> The 13.7 micrometre grain is fine but not impossible: normalising a 0.2 % steel gives about 20 micrometre and a controlled rolling schedule reaches 10. The limit is that very fine grains coarsen when the steel is welded or held hot.</p><p><b>Check your answer.</b> Put the answers back: 100 + 23.4/0.5 = 147 and 100 + 23.4/0.2 = 217, and for the third 100 + 23.4 x 8.547 = 300. All three close.</p>", "gu": "<h4>પ્રશ્ન (6 marks)</h4><p>ઓછા carbon ના સ્ટીલ માટે sigma_0 = 100 MPa અને k = 23.4 MPa mm^0.5 છે. 0.25 mm અને 0.04 mm grain size માટે yield strength શોધો, અને 300 MPa yield strength માટે જરૂરી grain size શોધો.</p><h4>પગલું 1 - સંબંધ</h4><div class=\"math\">sigma_y = sigma_0 + k d^(-1/2)\nd must be in mm, otherwise k has a different value</div><h4>પગલું 2 - બે grain size</h4><div class=\"math\">d = 0.25 mm:   d^-1/2 = 1/0.5 = 2.00 -> sigma_y = 100 + 23.4 x 2.00 = 147 MPa\nd = 0.04 mm:   d^-1/2 = 1/0.2 = 5.00 -> sigma_y = 100 + 23.4 x 5.00 = 217 MPa\nthe finer grain is 70 MPa stronger, with the same composition</div><h4>પગલું 3 - 300 MPa માટે grain size</h4><div class=\"math\">300 = 100 + 23.4 d^(-1/2)\nd^(-1/2) = 200/23.4 = 8.547\nd = 1/8.547^2 = 0.0137 mm = 13.7 micrometre</div><div class=\"eq\">147 MPa, 217 MPa, and d = 0.0137 mm for 300 MPa</div><p><b>કેમ સાચું છે.</b> 13.7 micrometre નું grain નાનું છે પણ અશક્ય નહીં: 0.2 % સ્ટીલ normalise કરો તો લગભગ 20 micrometre મળે અને નિયંત્રિત rolling થી 10 સુધી પહોંચાય. મર્યાદા એ છે કે ખૂબ નાના grains વેલ્ડિંગ કે ગરમ રાખવાથી જાડા થઈ જાય.</p><p><b>જવાબ ચકાસો.</b> જવાબ પાછા મૂકો: 100 + 23.4/0.5 = 147 અને 100 + 23.4/0.2 = 217, અને ત્રીજા માટે 100 + 23.4 x 8.547 = 300. ત્રણેય મળે છે.</p>"}}, {"h": {"en": "From an ASTM grain size number to a yield strength", "gu": "ASTM grain size number થી yield strength સુધી"}, "body": {"en": "<h4>Question (7 marks)</h4><p>A micrograph of a steel shows ASTM grain size 6, another shows 10. Convert both to a grain diameter in millimetres and then to a yield strength with sigma_0 = 100 MPa and k = 23.4 MPa mm^0.5, and state the percentage gain.</p><h4>Step 1 - the ASTM number to a grain diameter</h4><div class=\"math\">d = 25.4/(100 x sqrt(2^(N-1))) mm\nN = 6:  n = 2^5 = 32,  d = 25.4/(100 x 5.657) = 0.0449 mm\nN = 10: n = 2^9 = 512, d = 25.4/(100 x 22.63) = 0.0112 mm</div><h4>Step 2 - Hall-Petch for each</h4><div class=\"math\">N = 6:  d^-1/2 = 1/sqrt(0.0449) = 4.72 -> sigma_y = 100 + 23.4 x 4.72 = 210 MPa\nN = 10: d^-1/2 = 1/sqrt(0.0112) = 9.45 -> sigma_y = 100 + 23.4 x 9.45 = 321 MPa</div><h4>Step 3 - the gain</h4><div class=\"math\">gain = (321 - 210)/210 x 100 = 52.9 %\nfor four ASTM numbers, about 53 % more yield strength</div><div class=\"eq\">0.045 mm and 0.011 mm;  210 MPa and 321 MPa;  a 53 % gain</div><p>Four ASTM numbers is a factor of four in grain size, which is a factor of two in d^-1/2 - and that is why the gain is not 400 % but 53 %. Hall-Petch is linear in d^-1/2, not in d.</p><p><b>Common mistake.</b> d must be in millimetres for this k. Feed the value in micrometres and the answer comes out about thirty times too large.</p>", "gu": "<h4>પ્રશ્ન (7 marks)</h4><p>એક સ્ટીલના micrograph માં ASTM grain size 6 છે, બીજામાં 10. બંનેને મિલીમીટરમાં grain diameter અને પછી sigma_0 = 100 MPa તથા k = 23.4 MPa mm^0.5 સાથે yield strength માં ફેરવો, અને ટકાવારી વધારો કહો.</p><h4>પગલું 1 - ASTM number થી grain diameter</h4><div class=\"math\">d = 25.4/(100 x sqrt(2^(N-1))) mm\nN = 6:  n = 2^5 = 32,  d = 25.4/(100 x 5.657) = 0.0449 mm\nN = 10: n = 2^9 = 512, d = 25.4/(100 x 22.63) = 0.0112 mm</div><h4>પગલું 2 - દરેક માટે Hall-Petch</h4><div class=\"math\">N = 6:  d^-1/2 = 1/sqrt(0.0449) = 4.72 -> sigma_y = 100 + 23.4 x 4.72 = 210 MPa\nN = 10: d^-1/2 = 1/sqrt(0.0112) = 9.45 -> sigma_y = 100 + 23.4 x 9.45 = 321 MPa</div><h4>પગલું 3 - વધારો</h4><div class=\"math\">gain = (321 - 210)/210 x 100 = 52.9 %\nfor four ASTM numbers, about 53 % more yield strength</div><div class=\"eq\">0.045 mm and 0.011 mm;  210 MPa and 321 MPa;  a 53 % gain</div><p>ચાર ASTM number એ grain size માં ચાર ગણો ફરક છે, જે d^-1/2 માં બે ગણો ફરક છે - અને તેથી જ વધારો 400 % નહીં પણ 53 % છે. Hall-Petch d^-1/2 માં રેખીય છે, d માં નહીં.</p><p><b>સામાન્ય ભૂલ.</b> આ k માટે d મિલીમીટરમાં જ જોઈએ. Micrometre માં મૂકો તો જવાબ લગભગ ત્રીસ ગણો મોટો આવે.</p>"}}]}], "diagrams": [{"id": "u2_coolcurve", "title": {"en": "Cooling curves of a pure metal and an alloy", "gu": "શુદ્ધ ધાતુ અને alloy ની cooling curve"}, "file": "diagrams/u2_coolcurve.svg", "caption": {"en": "A pure metal freezes at one temperature and the curve stays flat while the latent heat comes out; an alloy freezes over a range between its liquidus and solidus, so the curve only changes slope.", "gu": "શુદ્ધ ધાતુ એક જ temperature પર થીજે અને latent heat નીકળે ત્યાં સુધી રેખા સપાટ રહે; alloy liquidus અને solidus વચ્ચેની range માં થીજે તેથી રેખા ફક્ત ઢાળ બદલે."}}, {"id": "u2_ingot", "title": {"en": "Grain structure of a cast ingot", "gu": "Casting ingot નું grain structure"}, "file": "diagrams/u2_ingot.svg", "caption": {"en": "The mould wall chills the metal first, so fine equiaxed grains form there, columnar grains grow inwards along the heat flow, and the hot centre freezes last as coarse equiaxed grains.", "gu": "Mould ની દીવાલ પહેલી ઠંડી થાય તેથી ત્યાં નાના grains બને, ગરમીના પ્રવાહ સાથે અંદર તરફ લાંબા columnar grains વધે, અને ગરમ વચ્ચે છેલ્લે જાડા equiaxed grains થીજે."}}, {"id": "u2_solution", "title": {"en": "Substitutional and interstitial solid solutions", "gu": "Substitutional અને interstitial solid solution"}, "file": "diagrams/u2_solution.svg", "caption": {"en": "A substitutional solution swaps one atom for another of similar size (Cu-Ni); an interstitial solution hides a small atom in the gaps (carbon in iron) - which is why carbon fits in iron only up to 2.14 %.", "gu": "Substitutional solution માં સરખા માપનો atom બીજાની જગ્યાએ બેસે (Cu-Ni); interstitial solution માં નાનો atom ખાલી જગ્યામાં બેસે (iron માં carbon) - તેથી જ carbon iron માં 2.14 % સુધી જ બેસે."}}, {"id": "u2_cuni", "title": {"en": "Copper-nickel: an isomorphous system", "gu": "Copper-nickel: isomorphous system નો diagram"}, "file": "diagrams/u2_cuni.svg", "caption": {"en": "Copper and nickel dissolve in each other in every proportion, so the diagram has no eutectic: one liquidus above one solidus, and a tie line that gives both phases.", "gu": "Copper અને nickel દરેક પ્રમાણમાં એકબીજામાં ઓગળે, તેથી diagram માં eutectic નથી: એક liquidus નીચે એક solidus, અને tie line બંને phase આપે."}}, {"id": "u2_pbsn", "title": {"en": "Lead-tin: a eutectic system", "gu": "Lead-tin: eutectic system નો diagram"}, "file": "diagrams/u2_pbsn.svg", "caption": {"en": "Lead and tin barely dissolve in each other, so the two liquidus branches meet at the eutectic 183 C and 61.9 % tin, where the alloy freezes at a single temperature.", "gu": "Lead અને tin એકબીજામાં થોડા જ ઓગળે, તેથી બંને liquidus શાખા eutectic પર મળે - 183 C અને 61.9 % tin - જ્યાં alloy એક જ temperature પર થીજે."}}, {"id": "u2_fec", "title": {"en": "The iron-iron carbide diagram", "gu": "Iron-iron carbide diagram ના મુખ્ય બિંદુઓ"}, "file": "diagrams/u2_fec.svg", "caption": {"en": "Carbon up to 2.14 % dissolves in austenite; at 0.8 % and 727 C that austenite turns into pearlite, the eutectoid reaction that every heat treatment of steel works around.", "gu": "Austenite માં carbon 2.14 % સુધી ઓગળે; 0.8 % અને 727 C પર એ austenite pearlite બને, અને સ્ટીલની દરેક heat treatment એ જ eutectoid ફરતે ફરે છે."}}, {"id": "u2_micro", "title": {"en": "Microstructures across the eutectoid", "gu": "Eutectoid આસપાસનાં microstructures"}, "file": "diagrams/u2_micro.svg", "caption": {"en": "Below 0.8 % carbon the pearlite sits in a field of ferrite, at 0.8 % it fills the micrograph, and above 0.8 % cementite appears on the grain boundaries as a brittle network.", "gu": "0.8 % થી નીચે pearlite ferrite ના ખેતરમાં દેખાય, બરાબર 0.8 % પર આખું micrograph pearlite હોય, અને 0.8 % થી ઉપર cementite grain boundary પર ભંગુર જાળી બનાવે."}}, {"id": "u2_hallpetch", "title": {"en": "Grain size sets the yield strength", "gu": "Grain size yield strength નક્કી કરે છે"}, "file": "diagrams/u2_hallpetch.svg", "caption": {"en": "Yield strength rises with the square root of the reciprocal grain size: halving the grain size raises the strength by about 40 % for the same steel.", "gu": "Yield strength grain size ના વ્યસ્ત વર્ગમૂળ સાથે વધે: grain size અડધું કરો તો એ જ સ્ટીલની તાકાત લગભગ 40 % વધે."}}], "equations": [{"title": {"en": "Phase rule and the lever rule", "gu": "Phase rule અને lever rule"}, "items": [{"name": {"en": "Gibbs phase rule", "gu": "Gibbs phase rule"}, "f": "F = C - P + 2   (F = C - P + 1 at fixed pressure)", "terms": {"en": "F degrees of freedom, C components, P phases. F = 0 means an invariant point.", "gu": "F degrees of freedom, C components, P phases. F = 0 એટલે invariant બિંદુ."}}, {"name": {"en": "Amount of liquid", "gu": "પ્રવાહીની માત્રા"}, "f": "W_L = (C_s - C0)/(C_s - C_l)", "terms": {"en": "Compositions read at the two ends of the tie line at that temperature.", "gu": "તે temperature પરની tie line ના બે છેડે composition વંચાય છે."}}, {"name": {"en": "Amount of solid", "gu": "ઘનની માત્રા"}, "f": "W_s = (C0 - C_l)/(C_s - C_l)", "terms": {"en": "The phase farther from C0 is present in smaller amount.", "gu": "C0 થી દૂરનો phase ઓછી માત્રામાં હોય છે."}}, {"name": {"en": "Balance check", "gu": "સંતુલન ચકાસણી"}, "f": "W_L + W_s = 1", "terms": {"en": "Use it on every lever-rule answer before writing the final line.", "gu": "દરેક lever-rule જવાબમાં અંતિમ લીટી પહેલાં આ વાપરો."}}]}, {"title": {"en": "Solidification", "gu": "Solidification"}, "items": [{"name": {"en": "Critical nucleus radius", "gu": "Critical nucleus ની ત્રિજ્યા"}, "f": "r* = 2 gamma Tm/(L dT)", "terms": {"en": "gamma surface energy, L latent heat per volume, dT undercooling.", "gu": "gamma surface energy, L volume દીઠ latent heat, dT undercooling."}}, {"name": {"en": "Nucleation barrier", "gu": "Nucleation નો અવરોધ"}, "f": "dG* = 16 pi gamma^3 Tm^2/(3 L^2 dT^2)", "terms": {"en": "Falls as 1/dT^2, so a little more undercooling gives many more nuclei.", "gu": "1/dT^2 જેટલું ઘટે, તેથી થોડું વધુ undercooling ઘણા વધુ nuclei આપે."}}, {"name": {"en": "Length of the thermal arrest", "gu": "Thermal arrest ની લંબાઈ"}, "f": "t_arrest = m Lf/q", "terms": {"en": "m mass of metal, q the rate at which the mould removes heat.", "gu": "m ધાતુનું દળ, q એ mould ગરમી લે તેવો દર."}}, {"name": {"en": "Freezing range", "gu": "Freezing range"}, "f": "range = T_liquidus - T_solidus", "terms": {"en": "The mushy zone where liquid and solid coexist.", "gu": "Mushy zone જ્યાં પ્રવાહી અને ઘન સાથે રહે."}}]}, {"title": {"en": "Grain size and strength", "gu": "Grain size અને તાકાત"}, "items": [{"name": {"en": "Hall-Petch", "gu": "Hall-Petch"}, "f": "sigma_y = sigma_0 + k d^(-1/2)", "terms": {"en": "d in mm gives k in MPa mm^0.5; 100 and 23.4 for the steel of this unit.", "gu": "d mm માં હોય તો k MPa mm^0.5 માં; આ unit ના સ્ટીલ માટે 100 અને 23.4."}}, {"name": {"en": "ASTM grain size number", "gu": "ASTM grain size નો આંકડો"}, "f": "n = 2^(N-1)", "terms": {"en": "n is the number of grains per square inch at 100 magnification.", "gu": "n એ 100 magnification પર પ્રતિ ચોરસ ઇંચ grains ની સંખ્યા છે."}}, {"name": {"en": "ASTM number from a count", "gu": "ગણતરી પરથી ASTM number"}, "f": "N = 1 + 3.32 log10(n_100)", "terms": {"en": "The 3.32 is 1/log10(2); count three fields and average.", "gu": "3.32 એ 1/log10(2) છે; ત્રણ જગ્યાએ ગણીને સરેરાશ લો."}}, {"name": {"en": "Grain diameter", "gu": "Grain diameter"}, "f": "d = 25.4/(100 sqrt(2^(N-1))) mm", "terms": {"en": "N = 6 gives 0.045 mm and N = 10 gives 0.011 mm.", "gu": "N = 6 માટે 0.045 mm અને N = 10 માટે 0.011 mm."}}]}, {"title": {"en": "Iron-carbon fractions", "gu": "Iron-carbon ના પ્રમાણ"}, "items": [{"name": {"en": "Pearlite fraction", "gu": "Pearlite નું પ્રમાણ"}, "f": "pearlite % = (C - 0.02)/(0.80 - 0.02) x 100", "terms": {"en": "Lever rule between the ferrite limit 0.02 and the eutectoid 0.80.", "gu": "Ferrite મર્યાદા 0.02 અને eutectoid 0.80 વચ્ચેનો lever rule."}}, {"name": {"en": "Cementite fraction", "gu": "Cementite નું પ્રમાણ"}, "f": "Fe3C % = (C - 0.80)/(6.67 - 0.80) x 100", "terms": {"en": "Only for hypereutectoid steels; below 0.8 % it gives a negative number.", "gu": "ફક્ત hypereutectoid સ્ટીલ માટે; 0.8 % ની નીચે તે ઋણ આંકડો આપે."}}, {"name": {"en": "The two invariant reactions", "gu": "બે invariant પ્રક્રિયાઓ"}, "f": "eutectic: L(4.3) -> gamma + Fe3C at 1147;  eutectoid: gamma(0.8) -> alpha + Fe3C at 727", "terms": {"en": "The first makes ledeburite in cast iron, the second makes pearlite in steel.", "gu": "પહેલી cast iron માં ledeburite બનાવે, બીજી સ્ટીલમાં pearlite."}}]}, {"title": {"en": "Heat treatment temperatures", "gu": "Heat treatment ના temperature"}, "items": [{"name": {"en": "The eutectoid line", "gu": "Eutectoid રેખા"}, "f": "A1 = 727 C", "terms": {"en": "The same for every steel; nothing transforms below it except tempering.", "gu": "દરેક સ્ટીલ માટે એ જ; તેની નીચે tempering સિવાય કંઈ બદલાતું નથી."}}, {"name": {"en": "A3 for a hypoeutectoid steel", "gu": "Hypoeutectoid સ્ટીલ માટે A3"}, "f": "A3 = 912 - 231 C   (C in % by weight)", "terms": {"en": "An approximation of the G-S line, good to about 10 C up to 0.8 % C.", "gu": "G-S રેખાનો અંદાજ, 0.8 % C સુધી લગભગ 10 C સુધી સાચો."}}, {"name": {"en": "Acm for a hypereutectoid steel", "gu": "Hypereutectoid સ્ટીલ માટે Acm"}, "f": "Acm = 727 + 313 (C - 0.80)", "terms": {"en": "The S-E line; hardening temperature is kept just above A1 for these steels.", "gu": "S-E રેખા; આ સ્ટીલ માટે hardening temperature A1 થી થોડું ઉપર રખાય."}}]}], "viva": [{"title": {"en": "Phases and the phase rule", "gu": "Phase અને phase rule"}, "items": [{"q": {"en": "What is a phase, and how many phases are in a 0.4 % carbon steel at room temperature?", "gu": "Phase એટલે શું, અને room temperature પર 0.4 % carbon સ્ટીલમાં કેટલા phase છે?"}, "a": {"en": "A part of the material with the same structure and composition everywhere. Two: ferrite and cementite, arranged as ferrite grains and pearlite.", "gu": "સામગ્રીનો જે ભાગ બધે એક જ રચના અને composition ધરાવે. બે: ferrite અને cementite, જે ferrite grains અને pearlite સ્વરૂપે ગોઠવાયેલા છે."}}, {"q": {"en": "State the Gibbs phase rule and give one invariant point from this unit.", "gu": "Gibbs phase rule કહો અને આ unit માંથી એક invariant બિંદુ આપો."}, "a": {"en": "F = C - P + 2, and F = C - P + 1 once the pressure is fixed at one atmosphere. The lead-tin eutectic at 183 C and 61.9 % tin has C = 2 P = 3, so F = 0 - an invariant point.", "gu": "F = C - P + 2, અને pressure એક જ atmosphere પર નિશ્ચિત હોય તો F = C - P + 1. 183 C અને 61.9 % tin પરનું lead-tin eutectic માં C = 2, P = 3, તેથી F = 0 - invariant બિંદુ."}}, {"q": {"en": "Why does a pure metal show a flat arrest on its cooling curve but an alloy does not?", "gu": "શુદ્ધ ધાતુની cooling curve સપાટ arrest કેમ દેખાય પણ alloy માં નહીં?"}, "a": {"en": "A pure metal freezes at one temperature, so the latent heat holds the curve flat. An alloy freezes over a range, releasing latent heat gradually, so only the slope changes.", "gu": "શુદ્ધ ધાતુ એક જ temperature પર થીજે તેથી latent heat રેખા સપાટ રાખે. Alloy એક range માં થીજે અને latent heat ધીમે છોડે, તેથી ફક્ત ઢાળ બદલાય."}}]}, {"title": {"en": "Solid solutions and diagrams", "gu": "Solid solution અને diagram"}, "items": [{"q": {"en": "State any three Hume-Rothery rules.", "gu": "Hume-Rothery ના કોઈ પણ ત્રણ નિયમ કહો."}, "a": {"en": "Size difference below 15 %; the same crystal structure; similar valency and electronegativity. Break them and solubility falls or a compound forms.", "gu": "માપનો ફરક 15 % થી ઓછો; એક જ crystal structure; સરખી valency અને electronegativity. તૂટે તો solubility ઘટે કે compound બને."}}, {"q": {"en": "Why is carbon interstitial in iron while nickel is substitutional?", "gu": "Iron માં carbon interstitial અને nickel substitutional કેમ છે?"}, "a": {"en": "Carbon's radius is 77 pm against iron's 126 pm, far too small for a lattice site, so it sits in the gaps. Nickel is 125 pm, almost exactly iron's size.", "gu": "Carbon ની radius 77 pm છે જ્યારે iron ની 126 pm, lattice ની જગ્યા માટે ઘણી નાની, તેથી તે ખાલી જગ્યામાં બેસે. Nickel 125 pm છે, લગભગ iron જેટલી જ."}}, {"q": {"en": "Read out the compositions of the two phases at 1300 C in the Cu-Ni diagram.", "gu": "Cu-Ni diagram માં 1300 C પર બે phase નું composition કહો."}, "a": {"en": "40 % nickel in the liquid and 60 % nickel in the solid, from the two ends of the tie line, and the lever rule then gives half of each for a 50 % alloy.", "gu": "Tie line ના બે છેડે પ્રવાહીમાં 40 % nickel અને ઘનમાં 60 % nickel, અને પછી lever rule 50 % alloy માટે દરેકનો અડધો ભાગ આપે."}}]}, {"title": {"en": "The iron-carbon diagram", "gu": "Iron-carbon diagram"}, "items": [{"q": {"en": "What is the difference between the eutectic and the eutectoid of the Fe-C diagram?", "gu": "Fe-C diagram ના eutectic અને eutectoid માં શું ફરક છે?"}, "a": {"en": "The eutectic at 1147 C and 4.3 % C turns liquid into two solids. The eutectoid at 727 C and 0.8 % C turns one solid (austenite) into two solids (ferrite and cementite).", "gu": "1147 C અને 4.3 % C પરનું eutectic પ્રવાહીને બે ઘનમાં ફેરવે. 727 C અને 0.8 % C પરનું eutectoid એક ઘન (austenite) ને બે ઘન (ferrite અને cementite) માં ફેરવે."}}, {"q": {"en": "Why can austenite hold 2.14 % carbon but ferrite only 0.02 %?", "gu": "Austenite 2.14 % carbon કેમ રાખી શકે પણ ferrite ફક્ત 0.02 %?"}, "a": {"en": "Austenite is FCC and its interstitial hole is larger and there are more of them per cell; ferrite is BCC with a smaller, distorted hole.", "gu": "Austenite FCC છે અને તેની interstitial જગ્યા મોટી તથા cell દીઠ વધુ છે; ferrite BCC છે જેની જગ્યા નાની અને વળેલી છે."}}, {"q": {"en": "What happens to the microstructure of a 1.2 % carbon steel cooled slowly?", "gu": "1.2 % carbon સ્ટીલને ધીમે ઠંડું કરો તો microstructure શું થાય?"}, "a": {"en": "Proeutectoid cementite forms a network on the austenite grain boundaries and the rest becomes pearlite - about 6.8 % cementite and 93 % pearlite.", "gu": "Proeutectoid cementite austenite grain boundary પર જાળી બનાવે અને બાકીનું pearlite થાય - લગભગ 6.8 % cementite અને 93 % pearlite."}}]}, {"title": {"en": "Heat treatment", "gu": "Heat treatment"}, "items": [{"q": {"en": "What are the three steps of any heat treatment?", "gu": "કોઈ પણ heat treatment નાં ત્રણ પગલાં કયાં છે?"}, "a": {"en": "Heat to a chosen temperature above the critical line, hold until the structure is uniform, and cool at a chosen rate.", "gu": "Critical line ઉપર પસંદ કરેલા temperature સુધી ગરમ કરવું, રચના સરખી થાય ત્યાં સુધી રાખવું, અને પસંદ કરેલા દરથી ઠંડું કરવું."}}, {"q": {"en": "What is the difference between annealing and normalising?", "gu": "Annealing અને normalising માં શું ફરક છે?"}, "a": {"en": "The temperature is the same; the cooling is different. Annealing cools in the furnace and gives soft coarse pearlite, normalising cools in air and gives finer, stronger pearlite.", "gu": "Temperature એ જ છે; ઠંડું કરવાની રીત જુદી છે. Annealing furnace માં ઠંડું કરે અને નરમ જાડું pearlite આપે, normalising હવામાં ઠંડું કરે અને નાનું, વધુ મજબૂત pearlite આપે."}}, {"q": {"en": "Why is a hardened steel always tempered?", "gu": "Hardened સ્ટીલને હંમેશા temper કેમ કરાય છે?"}, "a": {"en": "Quenching traps carbon and leaves martensite, which is very hard but brittle. Tempering below A1 relieves the strain and restores toughness at some cost in hardness.", "gu": "Quenching carbon ફસાવે અને martensite રહે, જે ખૂબ સખત પણ ભંગુર છે. A1 ની નીચે tempering તણાવ ઘટાડે અને hardness થોડી ગુમાવીને toughness પાછી આપે."}}]}], "exam_questions": [{"q": {"en": "Apply the phase rule at four points and state what the number means: (a) pure iron at 1450 C in the austenite field, (b) pure iron at 1538 C where solid and liquid coexist, (c) the lead-tin eutectic at 183 C, (d) a 40 % tin alloy at 200 C where alpha and liquid coexist.", "gu": "ચાર બિંદુ પર phase rule લાગુ કરો અને આંકડાનો અર્થ કહો: (a) austenite વિસ્તારમાં 1450 C પર શુદ્ધ iron, (b) 1538 C પર જ્યાં ઘન અને પ્રવાહી સાથે છે, (c) 183 C પરનું lead-tin eutectic, (d) 200 C પર 40 % tin નું alloy જ્યાં alpha અને પ્રવાહી સાથે છે."}, "marks": 6}, {"q": {"en": "A 40 % tin solder is held at 200 C. Read the compositions of the two phases from the diagram, find the mass of each in 2 kg of alloy, and say what happens to the last liquid when the alloy cools to 183 C.", "gu": "40 % tin નું solder 200 C પર રખાય છે. Diagram પરથી બે phase નું composition વાંચો, 2 kg alloy માં દરેકનું દળ શોધો, અને alloy 183 C સુધી ઠંડું થાય ત્યારે છેલ્લા પ્રવાહીનું શું થાય તે કહો."}, "marks": 7}, {"q": {"en": "A 50 % nickel cupro-nickel is at 1300 C. Find the composition of the liquid and of the solid, the mass of each in 3 kg, and show that the same alloy at 1250 C is completely solid.", "gu": "50 % nickel નું cupro-nickel 1300 C પર છે. પ્રવાહી અને ઘનનું composition, 3 kg માં દરેકનું દળ શોધો, અને એ જ alloy 1250 C પર સંપૂર્ણ ઘન છે તે દર્શાવો."}, "marks": 7}, {"q": {"en": "Using the eutectoid values, find the percentage of pearlite and of proeutectoid ferrite in a 0.4 % carbon steel, and the percentage of cementite in a 1.2 % carbon steel. Give the masses in 5 kg of each and explain the difference in properties.", "gu": "Eutectoid મૂલ્યો વાપરીને 0.4 % carbon સ્ટીલમાં pearlite અને proeutectoid ferrite ની ટકાવારી, અને 1.2 % carbon સ્ટીલમાં cementite ની ટકાવારી શોધો. દરેકના 5 kg માં દળ આપો અને ગુણધર્મોમાં ફરક સમજાવો."}, "marks": 8}, {"q": {"en": "For a low carbon steel sigma_0 = 100 MPa and k = 23.4 MPa mm^0.5. Find the yield strength for grain sizes of 0.25 mm and 0.04 mm, and the grain size needed for a yield strength of 300 MPa.", "gu": "ઓછા carbon ના સ્ટીલ માટે sigma_0 = 100 MPa અને k = 23.4 MPa mm^0.5 છે. 0.25 mm અને 0.04 mm grain size માટે yield strength શોધો, અને 300 MPa yield strength માટે જરૂરી grain size શોધો."}, "marks": 6}, {"q": {"en": "A micrograph of a steel shows ASTM grain size 6, another shows 10. Convert both to a grain diameter in millimetres and then to a yield strength with sigma_0 = 100 MPa and k = 23.4 MPa mm^0.5, and state the percentage gain.", "gu": "એક સ્ટીલના micrograph માં ASTM grain size 6 છે, બીજામાં 10. બંનેને મિલીમીટરમાં grain diameter અને પછી sigma_0 = 100 MPa તથા k = 23.4 MPa mm^0.5 સાથે yield strength માં ફેરવો, અને ટકાવારી વધારો કહો."}, "marks": 7}], "learning_outcomes": [{"en": "Explain appropriate heat treatment process for various components.", "gu": "જુદા જુદા components માટે યોગ્ય heat treatment પ્રક્રિયા સમજાવવી."}], "course_outcomes": ["CO2"], "practical_numbers": [2], "content_kind": "theory", "lesson_count": 18, "answered_practice_count": 6, "assessment_note": {"en": "Official course: theory ESE 70 + PA 30 and practical PA 20 + ESE 30 = 150 marks, 4 credits (3 lecture + 2 practical), 45 teaching hours. This unit carries 20 % weightage, 7 of the printed unit hours and 14 of the 70 theory marks - the largest of the six. The six numericals of section 2.7 are original revision problems with suggested marks, not GTU papers.", "gu": "અધિકૃત course: theory ESE 70 + PA 30 અને practical PA 20 + ESE 30 = 150 marks, 4 credits (3 lecture + 2 practical), 45 teaching hours. આ unit નું weightage 20 %, છપાયેલા unit hours માંથી 7 અને 70 theory marks માંથી 14 છે - છમાંથી સૌથી મોટું. વિભાગ 2.7 ના છ દાખલા revision માટેના મૂળ પ્રશ્નો છે, GTU પેપર નહીં."}, "question_provenance": "Original solved numericals written for revision; not official past papers", "question_marks_are_suggested": true, "sources": [{"title": "GTU DI01000181 Engineering Materials Science syllabus (uploaded PDF, w.e.f. 2024-25)", "url": "https://syllabus.gtu.ac.in/"}, {"title": "G. B. S. Narang - Materials Science, Khanna Publishers (phase diagrams, solidification, iron-carbon diagram)", "url": "https://www.khannapublishers.in/"}, {"title": "V. Raghavan - Materials Science and Engineering, Prentice Hall India (phase rule, lever rule, heat treatment)", "url": "https://www.pearson.com/"}, {"title": "Substech open materials science reference - iron-carbon diagram and cooling curves", "url": "https://www.substech.com/dokuwiki/doku.php?id=iron_carbon_phase_diagram"}, {"title": "NPTEL course on phase transformations and heat treatment of steels", "url": "https://nptel.ac.in/courses/113106032"}]};
