<script>
const U = {"subject": "DI01000021", "unit": 3, "format": "notes", "title": {"en": "Vectors"}, "hours": 9, "weightage": 20, "official": true, "languages": ["en"], "tabs": ["notes", "diagrams", "equations", "numericals", "viva", "exam"], "intro_text": {"en": "Unit 3 of Mathematics-I: what a vector is and how it differs from a scalar; magnitude, unit vector and direction cosines; addition by the triangle and parallelogram laws, subtraction and position vectors, and the i j k component form; the scalar product with its properties, the angle between two vectors and projections; the vector product with its determinant form, properties and the area of a parallelogram and a triangle; and the two applications the syllabus names - work done (F · d) and moment of force (r × F). Twenty-six fully solved numericals."}, "notes": [{"title": {"en": "1. Vectors and their Representation"}, "items": [{"h": {"en": "1.1 Scalar or vector: the first question"}, "body": {"en": "<h4>Definition</h4><p>A <b>scalar</b> has size only (mass, time, temperature, work). A <b>vector</b> has size <i>and</i> direction (displacement, velocity, acceleration, force, momentum).</p><h4>Notation</h4><ul><li>A vector is written <b>a</b> (bold) or with an arrow above it; its magnitude is |a| or a.</li><li>Geometrically a vector is a directed line segment: length = magnitude, arrow = direction.</li><li>A vector is unchanged by moving it parallel to itself - only length and direction matter.</li><li>Equal vectors have the same magnitude and direction; they need not start at the same point.</li></ul><h4>Worked example</h4><p>A displacement of 5 m east is a vector; 5 m is its magnitude and east is its direction. Saying \"the car went 60 km\" describes a scalar, while \"60 km north\" describes a vector.</p>"}, "diagram": "v1_vector", "examples": ["v1n1"], "syllabus_item": "3.1"}, {"h": {"en": "1.2 Magnitude, unit vector and direction cosines"}, "body": {"en": "<h4>Definition</h4><p>For a = a₁i + a₂j + a₃k the <b>magnitude</b> is |a| = √(a₁² + a₂² + a₃²) - Pythagoras in three dimensions. The <b>unit vector</b> a-hat = a/|a| has length 1 and points the same way.</p><h4>Direction cosines</h4><p>The angles α, β, γ that a makes with the x, y and z axes have cosines cos α = a₁/|a|, cos β = a₂/|a|, cos γ = a₃/|a|, and <b>cos²α + cos²β + cos²γ = 1</b>.</p><h4>Worked example</h4><p>For a = 2i + 3j − 6k: |a| = √(4 + 9 + 36) = 7, so a-hat = (2i + 3j − 6k)/7 and the direction cosines are 2/7, 3/7, −6/7. Check: (4 + 9 + 36)/49 = 1 ✓.</p><h4>Common mistake / conditions</h4><p>Divide every component by the same magnitude. A unit vector must come out with length 1 - square its components as a check before moving on.</p>"}, "diagram": "v1_vector", "examples": ["v1n1", "v1n2", "v1n3"], "syllabus_item": "3.1"}, {"h": {"en": "1.3 Types of vectors you will meet"}, "body": {"en": "<h4>The vocabulary</h4><table><tr><th>Name</th><th>Meaning</th><th>Example</th></tr><tr><td>Zero (null)</td><td>magnitude 0, no direction</td><td>a − a = 0</td></tr><tr><td>Unit</td><td>magnitude exactly 1</td><td>i, j, k</td></tr><tr><td>Equal</td><td>same magnitude and direction</td><td>AB and CD in a parallelogram</td></tr><tr><td>Negative of a</td><td>same length, opposite direction</td><td>−a</td></tr><tr><td>Collinear</td><td>parallel, so one is a scalar multiple of the other</td><td>2i + 4j and i + 2j</td></tr><tr><td>Coplanar</td><td>all lie in one plane</td><td>any three vectors with zero scalar triple product</td></tr></table><h4>Why the vocabulary matters</h4><p>Two vectors are parallel exactly when their cross product is zero, and perpendicular exactly when their dot product is zero. Those two sentences answer a large share of the paper.</p>"}, "examples": ["v1n4"], "syllabus_item": "3.1"}]}, {"title": {"en": "2. Algebra of Vectors"}, "items": [{"h": {"en": "2.1 Addition: triangle and parallelogram laws"}, "body": {"en": "<h4>Definition</h4><p><b>Triangle law:</b> place the tail of b at the head of a; then a + b runs from the tail of a to the head of b. <b>Parallelogram law:</b> if a and b are adjacent sides, a + b is the diagonal through the common point.</p><h4>Properties</h4><ul><li>Commutative: a + b = b + a.</li><li>Associative: (a + b) + c = a + (b + c).</li><li>Zero vector: a + 0 = a.</li><li>Addition is done component by component in i, j, k form.</li></ul><h4>Worked example</h4><p>a = 2i + 3j − k and b = i − 2j + 4k give a + b = <b>3i + j + 3k</b> and |a + b| = √(9 + 1 + 9) = √19 ≈ 4.36.</p><h4>Common mistake / conditions</h4><p>Magnitudes do not add like numbers: |a + b| = 4.36 while |a| + |b| = 3.74 + 4.58 = 8.32. The triangle inequality only promises |a + b| ≤ |a| + |b|.</p>"}, "diagram": "v2_add", "examples": ["v1n4"], "syllabus_item": "3.1"}, {"h": {"en": "2.2 Subtraction and position vectors"}, "body": {"en": "<h4>Definition</h4><p>a − b = a + (−b): reverse b, then add. In components subtract directly. The vector from point A to point B is <b>AB = OB − OA</b> (head minus tail).</p><h4>Worked examples</h4><p>With the vectors above, a − b = <b>i + 5j − 5k</b>, of magnitude √51 ≈ 7.14.</p><p>For A(1, 2, 3) and B(4, 6, 3): AB = (4 − 1)i + (6 − 2)j + (3 − 3)k = 3i + 4j + 0k, so |AB| = 5 - the distance formula in three dimensions.</p><h4>Common mistake / conditions</h4><p>Subtract in the order head minus tail. AB and BA are negatives of each other; choosing the wrong order flips every sign and usually the final answer's sign too.</p>"}, "diagram": "v2_add", "examples": ["v1n22"], "syllabus_item": "3.1"}, {"h": {"en": "2.3 Components, i j k form and scalar multiplication"}, "body": {"en": "<h4>Definition</h4><p>i, j, k are unit vectors along x, y, z. Any vector is <b>a = a₁i + a₂j + a₃k</b>, where the components are the projections on the three axes.</p><h4>Rules</h4><table><tr><th>Operation</th><th>Rule</th><th>Example</th></tr><tr><td>Scalar multiple</td><td>k(a₁i + a₂j + a₃k) = ka₁i + ka₂j + ka₃k</td><td>3(2i − j) = 6i − 3j</td></tr><tr><td>Addition</td><td>add matching components</td><td>(2i + j) + (i + 4j) = 3i + 5j</td></tr><tr><td>Magnitude</td><td>√(a₁² + a₂² + a₃²)</td><td>|3i + 4j| = 5</td></tr><tr><td>Parallel test</td><td>b = k a for some scalar k</td><td>(2, 4) = 2(1, 2)</td></tr></table><h4>Worked example</h4><p>If a = i − 2j + 3k and b = 2i + j − k, then 2a − 3b = (2 − 6)i + (−4 − 3)j + (6 + 3)k = <b>−4i − 7j + 9k</b>, of magnitude √(16 + 49 + 81) = √146 ≈ 12.08.</p>"}, "examples": ["v1n20", "v1n21"], "syllabus_item": "3.1"}]}, {"title": {"en": "3. Scalar (Dot) Product"}, "items": [{"h": {"en": "3.1 Definition and properties"}, "body": {"en": "<h4>Definition</h4><p><b>a · b = |a||b| cos θ</b>, where θ is the angle between the vectors (0° to 180°). The answer is a <b>scalar</b> - a number, not a vector.</p><h4>In components</h4><p><b>a · b = a₁b₁ + a₂b₂ + a₃b₃</b>. Multiply matching components and add: this is why the dot product is easy in i, j, k form.</p><h4>Properties</h4><ul><li>Commutative: a · b = b · a.</li><li>Distributive: a · (b + c) = a · b + a · c.</li><li>a · a = |a|², so |a| = √(a · a).</li><li>i · i = j · j = k · k = 1 and i · j = j · k = k · i = 0.</li><li>a · b = 0 ⇔ a and b are perpendicular (or one is zero).</li></ul><h4>Worked example</h4><p>(i + 2j + 3k) · (4i − 5j + 6k) = 4 − 10 + 18 = <b>12</b>.</p>"}, "diagram": "v3_dot", "examples": ["v1n6", "v1n8"], "syllabus_item": "3.2"}, {"h": {"en": "3.2 Angle between two vectors"}, "body": {"en": "<h4>Formula</h4><p><b>cos θ = (a · b)/(|a||b|)</b>, so θ = cos⁻¹ of that value. The formula is just the definition rearranged.</p><h4>Procedure</h4><ol><li>Compute a · b in components.</li><li>Compute |a| and |b| separately.</li><li>Divide, then take the inverse cosine - keep the answer in degrees or radians as asked.</li></ol><h4>Worked example</h4><p>a = 2i − j + k and b = i + j + 2k: a · b = 2 − 1 + 2 = 3, |a| = |b| = √6, so cos θ = 3/6 = 1/2 and <b>θ = 60°</b>.</p><h4>Common mistake / conditions</h4><p>If cos θ comes out negative, θ is obtuse - do not \"fix\" the sign. A zero dot product means 90°, and cos⁻¹(1) = 0° means the vectors are parallel in the same direction.</p>"}, "diagram": "v5_angle", "examples": ["v1n5", "v1n7", "v1n23"], "syllabus_item": "3.3"}, {"h": {"en": "3.3 Projection and the perpendicularity condition"}, "body": {"en": "<h4>Definition</h4><p>The <b>scalar projection</b> of a on b is the length of a's shadow along b: <b>(a · b)/|b|</b>. The vector projection is that length times the unit vector b-hat.</p><h4>Geometry</h4><p>In a · b = |a||b| cos θ, the factor |a| cos θ is exactly the projection of a on b. That is why work is F · d: only the component of force along the displacement does work.</p><h4>Worked example</h4><p>Projection of a = 3i + j − 2k on b = i + j + k: a · b = 3 + 1 − 2 = 2 and |b| = √3, so the projection is <b>2/√3 ≈ 1.155</b>.</p><h4>Finding an unknown</h4><p>If 2i + λj + k must be perpendicular to i − 2j + 3k, set the dot product to zero: 2 − 2λ + 3 = 0, so λ = 5/2. One equation, one unknown - always the same pattern.</p>"}, "diagram": "v3_dot", "examples": ["v1n9", "v1n8"], "syllabus_item": "3.2"}]}, {"title": {"en": "4. Vector (Cross) Product"}, "items": [{"h": {"en": "4.1 Definition and the determinant form"}, "body": {"en": "<h4>Definition</h4><p><b>a × b = |a||b| sin θ n-hat</b>, where n-hat is the unit vector perpendicular to both, given by the right-hand rule. The answer is a <b>vector</b>.</p><h4>Determinant form</h4><p><b>a × b = |i j k; a₁ a₂ a₃; b₁ b₂ b₃|</b> = i(a₂b₃ − a₃b₂) − j(a₁b₃ − a₃b₁) + k(a₁b₂ − a₂b₁).</p><h4>Worked example</h4><p>a = 2i + j + 3k, b = i − 2j + k: expanding the determinant gives (1 + 6)i − (2 − 3)j + (−4 − 1)k = <b>7i + j − 5k</b>, of magnitude √75 = 5√3 ≈ 8.66.</p><h4>Common mistake / conditions</h4><p>The middle term carries a minus. Writing +j(...) instead of −j(...) is the single most common error in this question; check by taking a × a, which must be 0.</p>"}, "diagram": "v4_cross", "examples": ["v1n10", "v1n13"], "syllabus_item": "3.2"}, {"h": {"en": "4.2 Properties of the cross product"}, "body": {"en": "<h4>Properties</h4><table><tr><th>Property</th><th>Statement</th><th>Consequence</th></tr><tr><td>Anti-commutative</td><td>a × b = −(b × a)</td><td>order matters - unlike the dot product</td></tr><tr><td>Zero for parallel</td><td>a × a = 0</td><td>parallel vectors give a zero cross product</td></tr><tr><td>Distributive</td><td>a × (b + c) = a × b + a × c</td><td>expand and collect</td></tr><tr><td>Scalar</td><td>(ka) × b = k(a × b)</td><td>pull constants out</td></tr><tr><td>Basis</td><td>i × j = k, j × k = i, k × i = j</td><td>cyclic order, anticlockwise</td></tr></table><h4>Right-hand rule</h4><p>Curl the fingers of the right hand from a to b; the thumb points along a × b. Reversing the order reverses the thumb, which is the anti-commutative property in physical form.</p><h4>Magnitude as an area</h4><p>|a × b| = |a||b| sin θ is the area of the parallelogram with sides a and b, because the height is |b| sin θ. This is the fastest way to compute areas in three dimensions.</p>"}, "diagram": "v4_cross", "examples": ["v1n19"], "syllabus_item": "3.2"}, {"h": {"en": "4.3 Area of a parallelogram and a triangle"}, "body": {"en": "<h4>Formulae</h4><p><b>Parallelogram:</b> area = |a × b| for adjacent sides a and b.</p><p><b>Triangle:</b> area = ½|a × b|, because a triangle is half of the parallelogram.</p><h4>Three vertices</h4><p>With A, B, C given, take a = AB = B − A and b = AC = C − A, then area = ½|a × b|. Starting from one vertex matters - using two different starting points gives the wrong vectors.</p><h4>Worked example</h4><p>A(1, 1, 1), B(2, 3, 4), C(4, 2, 3): AB = i + 2j + 3k, AC = 3i + j + 2k, and AB × AC = i(4 − 3) − j(2 − 9) + k(1 − 6) = i + 7j − 5k. |a × b| = √75 = 5√3, so the area is <b>5√3/2 ≈ 4.33</b> square units.</p><h4>Collinearity</h4><p>Three points are collinear exactly when a × b = 0. That is the 3-D version of the determinant test from Unit 1.</p>"}, "diagram": "v4_cross", "examples": ["v1n11", "v1n12"], "syllabus_item": "3.3"}]}, {"title": {"en": "5. Applications: Work Done and Moment of Force"}, "items": [{"h": {"en": "5.1 Work done by a force"}, "body": {"en": "<h4>Definition</h4><p><b>W = F · d = |F||d| cos θ</b>, where θ is the angle between the force and the displacement. Work is a <b>scalar</b> measured in joules (N·m).</p><h4>Why the dot product</h4><p>Only the component of the force along the motion contributes. If F is perpendicular to d (carrying a bag horizontally), cos 90° = 0 and no work is done - which matches everyday experience and the formula.</p><h4>Worked example</h4><p>F = 3i + 2j − k newton moves an object through d = 2i − j + 3k metre. W = 6 − 2 − 3 = <b>1 J</b>. A small positive value means the force mostly pushes sideways.</p><h4>Conditions</h4><p>Use the displacement, not the distance travelled; and keep the units consistent (N and m give J). A negative dot product means the force opposes the motion.</p>"}, "diagram": "v6_work", "examples": ["v1n14", "v1n15", "v1n24"], "syllabus_item": "3.4"}, {"h": {"en": "5.2 Moment of a force about a point"}, "body": {"en": "<h4>Definition</h4><p><b>M = r × F</b>, where r is the position vector of the point of application measured from the point about which the moment is taken. The moment is a <b>vector</b>, in N·m, and its direction gives the axis of rotation.</p><h4>Magnitude</h4><p>|M| = |r||F| sin θ = F × (perpendicular distance). Both forms appear in exams; the second is faster when the perpendicular distance is given directly.</p><h4>Worked example</h4><p>r = 3i − j + 2k and F = 2i + j − k give M = r × F = |i j k; 3 −1 2; 2 1 −1| = −i + 7j + 5k, of magnitude √75 = 5√3 ≈ <b>8.66 N·m</b>.</p><h4>Common mistake / conditions</h4><p>Take r from the correct point. A moment \"about A\" needs r = position of the force minus position of A, not the position of the force from the origin.</p>"}, "diagram": "v7_moment", "examples": ["v1n16", "v1n17", "v1n18", "v1n25"], "syllabus_item": "3.4"}, {"h": {"en": "5.3 Choosing dot or cross: a decision guide"}, "body": {"en": "<h4>The question behind every problem</h4><table><tr><th>Question wording</th><th>Product</th><th>Because</th></tr><tr><td>\"Find the angle between\"</td><td>dot</td><td>cos θ comes from a · b</td></tr><tr><td>\"Work done by the force\"</td><td>dot</td><td>W = F · d is a scalar</td></tr><tr><td>\"Show the vectors are perpendicular\"</td><td>dot</td><td>a · b = 0</td></tr><tr><td>\"Find the area / a perpendicular vector\"</td><td>cross</td><td>|a × b| is an area</td></tr><tr><td>\"Moment of the force\"</td><td>cross</td><td>M = r × F is a vector</td></tr><tr><td>\"Show the vectors are parallel\"</td><td>cross</td><td>a × b = 0</td></tr></table><h4>Mixed-problem routine</h4><ol><li>Write both vectors in i, j, k form.</li><li>Decide dot or cross from the table above.</li><li>Compute carefully, keeping the minus in the cross product's middle term.</li><li>State units and the geometric meaning of the answer.</li></ol><h4>Check worth doing</h4><p>For any pair, |a × b|² + (a · b)² = |a|²|b|². Testing this on your numbers catches almost every arithmetic slip before it costs marks.</p>"}, "diagram": "v5_angle", "examples": ["v1n26"], "syllabus_item": "3.4"}]}, {"title": {"en": "6. Answered Practice (Unit 3 level, suggested marks)"}, "items": [{"h": {"en": "Practice 1. Find the magnitude and unit vector of a = 6i + 2j − 3k."}, "body": {"en": "<h4>Working</h4><ol><li>|a| = √(36 + 4 + 9) = √49 = 7</li><li>a-hat = (6i + 2j − 3k)/7</li></ol><h4>Answer</h4><p><b>7 and (6i + 2j − 3k)/7.</b> Check the unit vector's length: (36 + 4 + 9)/49 = 1 ✓.</p>"}}, {"h": {"en": "Practice 2. For a = i + j and b = i − j, find a · b and the angle between them."}, "body": {"en": "<h4>Working</h4><ol><li>a · b = 1 − 1 = 0</li><li>|a| = |b| = √2</li><li>cos θ = 0, so θ = 90°</li></ol><h4>Check</h4><p>A zero dot product is the perpendicularity test, so 90° must be the answer - the two vectors are the diagonals of a square.</p>"}}, {"h": {"en": "Practice 3. Find the angle between i + 2j + 2k and 2i + j − 2k."}, "body": {"en": "<h4>Working</h4><ol><li>a · b = 2 + 2 − 4 = 0</li><li>Both magnitudes are 3</li><li>cos θ = 0, so θ = 90°</li></ol><h4>Answer</h4><p><b>90°.</b> Since the dot product vanished, the vectors are perpendicular; there is no need to compute the magnitudes at all, but they confirm the result is not a division by zero.</p>"}}, {"h": {"en": "Practice 4. Find a × b for a = 3i − j + 2k and b = i + 2j − k."}, "body": {"en": "<h4>Working</h4><ol><li>i((−1)(−1) − 2(2)) = i(1 − 4) = −3i</li><li>−j(3(−1) − 2(1)) = −j(−3 − 2) = 5j</li><li>k(3(2) − (−1)(1)) = k(6 + 1) = 7k</li></ol><h4>Answer</h4><p><b>−3i + 5j + 7k.</b> Check with the dot product: (−3)(3) + 5(−1) + 7(2) = 0 ✓ and (−3)(1) + 5(2) + 7(−1) = 0 ✓.</p>"}}, {"h": {"en": "Practice 5. Find the area of the parallelogram with sides i + 2j + 3k and 2i + j + k."}, "body": {"en": "<h4>Working</h4><ol><li>a × b = i(2 − 3) − j(1 − 6) + k(1 − 4) = −i + 5j − 3k</li><li>|a × b| = √(1 + 25 + 9) = √35 ≈ 5.92</li></ol><h4>Answer</h4><p><b>√35 ≈ 5.92 square units.</b> The area must be less than |a||b| = 3.74 × 2.45 = 9.17, and it is ✓.</p>"}}, {"h": {"en": "Practice 6. Find λ so that 3i + λj − 2k is perpendicular to 2i − j + 4k."}, "body": {"en": "<h4>Working</h4><ol><li>Perpendicular means a · b = 0</li><li>3(2) + λ(−1) + (−2)(4) = 0</li><li>6 − λ − 8 = 0</li><li>λ = −2</li></ol><h4>Answer</h4><p><b>λ = −2.</b> Check: 6 + 2 − 8 = 0 ✓. One equation, one unknown - this \"perpendicularity gives the unknown\" pattern is worth recognising instantly.</p>"}}, {"h": {"en": "Practice 7. Find the work done by F = 4i − j + 2k along d = 2i + 3j − k."}, "body": {"en": "<h4>Working</h4><p>W = 8 − 3 − 2 = 3 J.</p><h4>Answer</h4><p><b>3 J.</b> Positive work means the force has a component along the displacement; the j-components partially cancel.</p>"}}, {"h": {"en": "Practice 8. Find the moment of F = 3i + j acting at r = 2i − j about the origin."}, "body": {"en": "<h4>Working</h4><ol><li>M = |i j k; 2 −1 0; 3 1 0|</li><li>= i(0) − j(0) + k(2 + 3) = 5k</li></ol><h4>Answer</h4><p><b>5k N·m, magnitude 5.</b> The moment is about the z-axis because everything lies in the xy-plane; check M · r = 0 ✓.</p>"}}, {"h": {"en": "Practice 9. Find the projection of 2i + 3j − k on i + j + k."}, "body": {"en": "<h4>Working</h4><ol><li>a · b = 2 + 3 − 1 = 4</li><li>|b| = √3</li><li>projection = 4/√3 ≈ 2.31</li></ol><h4>Answer</h4><p><b>4/√3 ≈ 2.31.</b> Rationalised: 4√3/3. The projection is smaller than |a| = √14 ≈ 3.74 ✓.</p>"}}, {"h": {"en": "Practice 10. Show that the points A(1, 2, 3), B(2, 3, 4) and C(3, 4, 5) are collinear."}, "body": {"en": "<h4>Working</h4><ol><li>AB = i + j + k</li><li>AC = 2i + 2j + 2k = 2AB</li><li>Since AC is a scalar multiple of AB, the cross product is zero</li></ol><h4>Answer</h4><p><b>Collinear.</b> The points lie on the line through (1, 2, 3) with direction i + j + k, which is x − 1 = y − 2 = z − 3.</p>"}}, {"h": {"en": "Practice 11. If |a| = 5, |b| = 12 and a · b = 30, find the angle between a and b."}, "body": {"en": "<h4>Working</h4><p>cos θ = 30/(5 × 12) = 0.5, so θ = 60°.</p><h4>Answer</h4><p><b>60°.</b> Check with the cross product: |a × b| = 60 sin 60° = 30√3 ≈ 51.96, and 51.96² + 30² = 3600 = 25 × 144 ✓.</p>"}}, {"h": {"en": "Practice 12. Find a vector of magnitude 6 perpendicular to both i + j and i − j."}, "body": {"en": "<h4>Working</h4><ol><li>(i + j) × (i − j) = i(0) − j(0) + k(−1 − 1) = −2k</li><li>Unit perpendicular = ±k</li><li>Required vector = ±6k</li></ol><h4>Answer</h4><p><b>±6k.</b> Both given vectors lie in the xy-plane, so any perpendicular is along z - the answer must have no i or j component.</p>"}}, {"h": {"en": "Practice 13. Find the moment of F = 2i + 3j + k acting at A(1, 1, 1) about B(0, 1, 1)."}, "body": {"en": "<h4>Working</h4><ol><li>r = OA − OB = i + 0j + 0k</li><li>M = |i j k; 1 0 0; 2 3 1| = i(0) − j(1) + k(3) = −j + 3k</li></ol><h4>Answer</h4><p><b>−j + 3k N·m, magnitude √10 ≈ 3.16.</b> The arm has no y or z component, so only two terms survive - subtract the right point to keep it that way.</p>"}}, {"h": {"en": "Practice 14. Find the area of the triangle with vertices (0, 0, 0), (2, 1, 0) and (1, 3, 4)."}, "body": {"en": "<h4>Working</h4><ol><li>a = 2i + j, b = i + 3j + 4k</li><li>a × b = i(4 − 0) − j(8 − 0) + k(6 − 1) = 4i − 8j + 5k</li><li>|a × b| = √(16 + 64 + 25) = √105</li><li>area = √105/2 ≈ 5.12</li></ol><h4>Answer</h4><p><b>√105/2 ≈ 5.12 square units.</b> Half the parallelogram area is expected, since the triangle is exactly half of it.</p>"}}, {"h": {"en": "Practice 15. A force F = 2i − j + 3k acts at the point P(1, 2, 3). Find its moment about Q(2, 0, 1) and the work done if the point moves from P to Q."}, "body": {"en": "<h4>Working</h4><ol><li>r = OP − OQ = −i + 2j + 2k</li><li>M = |i j k; −1 2 2; 2 −1 3| = i(6 + 2) − j(−3 − 4) + k(1 − 4) = 8i + 7j − 3k</li><li>d = OQ − OP = i − 2j − 2k, so W = 2 − (−2) + (−6) = −2 J</li></ol><h4>Answer</h4><p><b>M = 8i + 7j − 3k (|M| = √122 ≈ 11.05 N·m); W = −2 J.</b> Negative work means the force opposes that displacement - consistent with the moment's large magnitude.</p>"}}]}], "diagrams": [{"id": "v1_vector", "title": {"en": "A vector has length and direction"}, "file": "diagrams/v1_vector.svg"}, {"id": "v2_add", "title": {"en": "Adding vectors: two equivalent laws"}, "file": "diagrams/v2_add.svg"}, {"id": "v3_dot", "title": {"en": "The dot product measures a shadow"}, "file": "diagrams/v3_dot.svg"}, {"id": "v4_cross", "title": {"en": "The cross product gives a perpendicular"}, "file": "diagrams/v4_cross.svg"}, {"id": "v5_angle", "title": {"en": "Angle between two vectors"}, "file": "diagrams/v5_angle.svg"}, {"id": "v6_work", "title": {"en": "Work done: only the along-motion part counts"}, "file": "diagrams/v6_work.svg"}, {"id": "v7_moment", "title": {"en": "Moment of a force about a point"}, "file": "diagrams/v7_moment.svg"}], "equations": [{"title": {"en": "Vector basics"}, "items": [{"name": {"en": "Magnitude"}, "f": "|a| = √(a₁² + a₂² + a₃²)", "terms": {"en": "Pythagoras extended to three dimensions."}}, {"name": {"en": "Unit vector"}, "f": "a-hat = a/|a|", "terms": {"en": "Same direction, length 1; multiply it by any magnitude to scale."}}, {"name": {"en": "Direction cosines"}, "f": "cos²α + cos²β + cos²γ = 1", "terms": {"en": "Each cosine is a component divided by the magnitude."}}, {"name": {"en": "Vector between points"}, "f": "AB = OB − OA", "terms": {"en": "Head minus tail; the order decides every sign."}}]}, {"title": {"en": "Products"}, "items": [{"name": {"en": "Dot product"}, "f": "a · b = a₁b₁ + a₂b₂ + a₃b₃ = |a||b| cos θ", "terms": {"en": "A scalar; zero means perpendicular."}}, {"name": {"en": "Cross product"}, "f": "a × b = |i j k; a₁ a₂ a₃; b₁ b₂ b₃|", "terms": {"en": "A vector; zero means parallel. Keep the minus on the j-term."}}, {"name": {"en": "Angle between vectors"}, "f": "cos θ = (a · b)/(|a||b|)", "terms": {"en": "A negative cosine means an obtuse angle - do not change the sign."}}, {"name": {"en": "Projection"}, "f": "projection of a on b = (a · b)/|b|", "terms": {"en": "The shadow length of a along b."}}, {"name": {"en": "Area"}, "f": "parallelogram |a × b|, triangle ½|a × b|", "terms": {"en": "Adjacent sides from the same vertex."}}]}, {"title": {"en": "Applications"}, "items": [{"name": {"en": "Work done"}, "f": "W = F · d = |F||d| cos θ", "terms": {"en": "Joules; only the along-motion component works."}}, {"name": {"en": "Moment of a force"}, "f": "M = r × F,  |M| = F × perpendicular distance", "terms": {"en": "Newton-metre; r is measured from the point about which the moment is taken."}}, {"name": {"en": "Identity check"}, "f": "|a × b|² + (a · b)² = |a|²|b|²", "terms": {"en": "Fast verification of any dot/cross numerical."}}]}], "numericals": [{"id": "v1n1", "q": {"en": "Find the magnitude of a = 3i − 4j + 12k."}, "a": {"en": "<h4>Given and assumptions</h4><p>Three components, one negative.</p><h4>Formula</h4><p>|a| = √(a₁² + a₂² + a₃²)</p><h4>Step-by-step solution</h4><ol><li>3² = 9, (−4)² = 16, 12² = 144</li><li>Sum = 169</li><li>|a| = √169 = 13</li></ol><h4>Interpretation and check</h4><p><b>13 units.</b> The 3-4-12 triple always gives 13 - worth remembering, like 3-4-5 in two dimensions.</p>"}}, {"id": "v1n2", "q": {"en": "Write the unit vector along a = 2i + 3j − 6k."}, "a": {"en": "<h4>Given and assumptions</h4><p>First find the magnitude, then divide every component by it.</p><h4>Formula</h4><p>a-hat = a/|a|</p><h4>Step-by-step solution</h4><ol><li>|a| = √(4 + 9 + 36) = √49 = 7</li><li>a-hat = (2i + 3j − 6k)/7</li></ol><h4>Interpretation and check</h4><p><b>(2/7)i + (3/7)j − (6/7)k.</b> Check the length: (4 + 9 + 36)/49 = 1 ✓. A unit vector is the fastest way to answer \"find a vector of magnitude 10 in this direction\" - multiply a-hat by 10.</p>"}}, {"id": "v1n3", "q": {"en": "Find the direction cosines of a = i + 2j + 2k."}, "a": {"en": "<h4>Given and assumptions</h4><p>Direction cosines are the components divided by the magnitude.</p><h4>Formula</h4><p>cos α = a₁/|a|, cos β = a₂/|a|, cos γ = a₃/|a|</p><h4>Step-by-step solution</h4><ol><li>|a| = √(1 + 4 + 4) = 3</li><li>cos α = 1/3, cos β = 2/3, cos γ = 2/3</li><li>α ≈ 70.5°, β ≈ 48.2°, γ ≈ 48.2°</li></ol><h4>Interpretation and check</h4><p><b>1/3, 2/3, 2/3.</b> Check the identity: (1 + 4 + 4)/9 = 1 ✓. All three angles are between 0° and 180°, as direction angles must be.</p>"}}, {"id": "v1n4", "q": {"en": "For a = 2i + 3j − k and b = i − 2j + 4k find a + b, a − b and their magnitudes."}, "a": {"en": "<h4>Given and assumptions</h4><p>Add and subtract component by component.</p><h4>Formula</h4><p>(a₁ ± b₁)i + (a₂ ± b₂)j + (a₃ ± b₃)k</p><h4>Step-by-step solution</h4><ol><li>a + b = 3i + j + 3k</li><li>|a + b| = √(9 + 1 + 9) = √19 ≈ 4.36</li><li>a − b = i + 5j − 5k</li><li>|a − b| = √(1 + 25 + 25) = √51 ≈ 7.14</li></ol><h4>Interpretation and check</h4><p><b>√19 ≈ 4.36 and √51 ≈ 7.14.</b> Note that |a| + |b| = 3.74 + 4.58 = 8.32 is larger than both, so the triangle inequality holds but magnitudes do not add directly.</p>"}}, {"id": "v1n5", "q": {"en": "Find the angle between a = 2i − j + k and b = i + j + 2k."}, "a": {"en": "<h4>Given and assumptions</h4><p>Dot product and both magnitudes.</p><h4>Formula</h4><p>cos θ = (a · b)/(|a||b|)</p><h4>Step-by-step solution</h4><ol><li>a · b = 2 − 1 + 2 = 3</li><li>|a| = √6 and |b| = √6</li><li>cos θ = 3/6 = 1/2</li><li>θ = 60°</li></ol><h4>Interpretation and check</h4><p><b>60°.</b> The symmetry (|a| = |b|) is a hint: equal lengths often give a standard angle. A positive cosine confirms the angle is acute.</p>"}}, {"id": "v1n6", "q": {"en": "Find the dot product of p = i + 2j + 3k and q = 4i − 5j + 6k."}, "a": {"en": "<h4>Given and assumptions</h4><p>Multiply matching components and add.</p><h4>Formula</h4><p>p · q = p₁q₁ + p₂q₂ + p₃q₃</p><h4>Step-by-step solution</h4><ol><li>1 × 4 = 4</li><li>2 × (−5) = −10</li><li>3 × 6 = 18</li><li>4 − 10 + 18 = 12</li></ol><h4>Interpretation and check</h4><p><b>12.</b> A positive dot product means the angle between them is acute. Since the vectors are nowhere near parallel (their components differ a lot), a moderate positive value is expected.</p>"}}, {"id": "v1n7", "q": {"en": "Find the angle between 2i + 2j − k and 6i − 3j + 2k."}, "a": {"en": "<h4>Given and assumptions</h4><p>Both magnitudes are Pythagorean, which keeps the arithmetic exact.</p><h4>Formula</h4><p>cos θ = (a · b)/(|a||b|)</p><h4>Step-by-step solution</h4><ol><li>a · b = 12 − 6 − 2 = 4</li><li>|a| = √9 = 3, |b| = √49 = 7</li><li>cos θ = 4/21 ≈ 0.1905</li><li>θ ≈ 79.0°</li></ol><h4>Interpretation and check</h4><p><b>θ ≈ 79°.</b> A small positive cosine means an angle just under 90°, so the vectors are nearly - but not quite - perpendicular. Check with |a × b|: √(441 − 16) = √425 ≈ 20.6, so sin θ = 20.6/21 ≈ 0.98 ✓.</p>"}}, {"id": "v1n8", "q": {"en": "Find λ so that 2i + λj + k is perpendicular to i − 2j + 3k."}, "a": {"en": "<h4>Given and assumptions</h4><p>Perpendicular means the dot product is zero.</p><h4>Formula</h4><p>a · b = 0</p><h4>Step-by-step solution</h4><ol><li>2(1) + λ(−2) + 1(3) = 0</li><li>5 − 2λ = 0</li><li>λ = 5/2</li></ol><h4>Interpretation and check</h4><p><b>λ = 2.5.</b> Check: 2 − 5 + 3 = 0 ✓. This \"find the unknown from perpendicularity\" pattern appears in almost every paper.</p>"}}, {"id": "v1n9", "q": {"en": "Find the projection of a = 3i + j − 2k on b = i + j + k."}, "a": {"en": "<h4>Given and assumptions</h4><p>Projection means the shadow length of a along b.</p><h4>Formula</h4><p>projection = (a · b)/|b|</p><h4>Step-by-step solution</h4><ol><li>a · b = 3 + 1 − 2 = 2</li><li>|b| = √3</li><li>projection = 2/√3 ≈ 1.155</li></ol><h4>Interpretation and check</h4><p><b>2/√3 ≈ 1.15.</b> Rationalising gives 2√3/3. The projection is shorter than |a| = √14 ≈ 3.74, as it must be for any non-zero angle.</p>"}}, {"id": "v1n10", "q": {"en": "Find a × b for a = 2i + j + 3k and b = i − 2j + k."}, "a": {"en": "<h4>Given and assumptions</h4><p>Expand the determinant, keeping the minus on the j-term.</p><h4>Formula</h4><p>a × b = |i j k; 2 1 3; 1 −2 1|</p><h4>Step-by-step solution</h4><ol><li>i(1×1 − 3×(−2)) = i(1 + 6) = 7i</li><li>−j(2×1 − 3×1) = −j(2 − 3) = +j</li><li>k(2×(−2) − 1×1) = k(−4 − 1) = −5k</li><li>a × b = 7i + j − 5k</li></ol><h4>Interpretation and check</h4><p><b>7i + j − 5k.</b> Two checks: dot the answer with a and with b - both must be zero (7(2) + 1(1) − 5(3) = 0 ✓, 7 − 2 − 5 = 0 ✓), which proves it is perpendicular to both.</p>"}}, {"id": "v1n11", "q": {"en": "Find the area of the parallelogram whose adjacent sides are a = 2i + j + 3k and b = i − 2j + k."}, "a": {"en": "<h4>Given and assumptions</h4><p>Adjacent sides - so the cross product gives the area directly.</p><h4>Formula</h4><p>area = |a × b|</p><h4>Step-by-step solution</h4><ol><li>a × b = 7i + j − 5k</li><li>|a × b| = √(49 + 1 + 25) = √75</li><li>= 5√3 ≈ 8.66</li></ol><h4>Interpretation and check</h4><p><b>5√3 ≈ 8.66 square units.</b> A parallelogram area can exceed the product of the side lengths only if the angle is right - here |a||b| = 3.74 × 2.45 = 9.17, slightly more than 8.66, so the angle is not 90° ✓.</p>"}}, {"id": "v1n12", "q": {"en": "Find the area of the triangle with vertices A(1, 1, 1), B(2, 3, 4) and C(4, 2, 3)."}, "a": {"en": "<h4>Given and assumptions</h4><p>Take both vectors from the same vertex A.</p><h4>Formula</h4><p>area = ½|AB × AC|</p><h4>Step-by-step solution</h4><ol><li>AB = i + 2j + 3k and AC = 3i + j + 2k</li><li>AB × AC = i(4 − 3) − j(2 − 9) + k(1 − 6) = i + 7j − 5k</li><li>|AB × AC| = √(1 + 49 + 25) = √75 = 5√3</li><li>area = 5√3/2 ≈ 4.33</li></ol><h4>Interpretation and check</h4><p><b>5√3/2 ≈ 4.33 square units.</b> The triangle is exactly half of the parallelogram on the same two sides - which is where the ½ comes from, not a coincidence.</p>"}}, {"id": "v1n13", "q": {"en": "Find a unit vector perpendicular to both i + j and j + k."}, "a": {"en": "<h4>Given and assumptions</h4><p>A vector perpendicular to both is their cross product.</p><h4>Formula</h4><p>n = ±(a × b)/|a × b|</p><h4>Step-by-step solution</h4><ol><li>a × b = |i j k; 1 1 0; 0 1 1| = i(1 − 0) − j(1 − 0) + k(1 − 0) = i − j + k</li><li>|a × b| = √3</li><li>n = ±(i − j + k)/√3</li></ol><h4>Interpretation and check</h4><p><b>±(i − j + k)/√3.</b> Two answers exist because \"perpendicular to both\" leaves the direction up or down. Check: (1 − 1 + 0)/√3 = 0 and (0 − 1 + 1)/√3 = 0 ✓.</p>"}}, {"id": "v1n14", "q": {"en": "Find the work done by F = 3i + 2j − k when the displacement is d = 2i − j + 3k."}, "a": {"en": "<h4>Given and assumptions</h4><p>Force and displacement in newton and metre.</p><h4>Formula</h4><p>W = F · d</p><h4>Step-by-step solution</h4><ol><li>3(2) = 6</li><li>2(−1) = −2</li><li>(−1)(3) = −3</li><li>W = 6 − 2 − 3 = 1 J</li></ol><h4>Interpretation and check</h4><p><b>1 joule.</b> The small positive value means the force is partly along the motion and partly sideways. If the answer had been negative, the force would be retarding.</p>"}}, {"id": "v1n15", "q": {"en": "A force of 20 N acts at 60° to a displacement of 5 m. Find the work done."}, "a": {"en": "<h4>Given and assumptions</h4><p>Magnitudes and the angle between them.</p><h4>Formula</h4><p>W = |F||d| cos θ</p><h4>Step-by-step solution</h4><ol><li>W = 20 × 5 × cos 60°</li><li>= 100 × 0.5</li><li>= 50 J</li></ol><h4>Interpretation and check</h4><p><b>50 J.</b> At 0° the work would be 100 J and at 90° it would be 0 J; 50 J sits exactly between, as cos 60° = 0.5 predicts.</p>"}}, {"id": "v1n16", "q": {"en": "Find the moment of F = 2i + j − k acting at r = 3i − j + 2k about the origin."}, "a": {"en": "<h4>Given and assumptions</h4><p>Moment about O is M = r × F.</p><h4>Formula</h4><p>M = |i j k; 3 −1 2; 2 1 −1|</p><h4>Step-by-step solution</h4><ol><li>i((−1)(−1) − 2(1)) = i(1 − 2) = −i</li><li>−j(3(−1) − 2(2)) = −j(−3 − 4) = 7j</li><li>k(3(1) − (−1)(2)) = k(3 + 2) = 5k</li><li>M = −i + 7j + 5k</li></ol><h4>Interpretation and check</h4><p><b>−i + 7j + 5k, magnitude √75 = 5√3 ≈ 8.66 N·m.</b> Check M · r = −3 − 7 + 10 = 0 and M · F = −2 + 7 − 5 = 0 ✓ - a moment is perpendicular to both r and F.</p>"}}, {"id": "v1n17", "q": {"en": "Find the moment of F = i + 2j acting at B(3, 4, 0) about the point A(1, 1, 0)."}, "a": {"en": "<h4>Given and assumptions</h4><p>The moment arm is measured from A, so r = OB − OA.</p><h4>Formula</h4><p>M = r × F with r = B − A</p><h4>Step-by-step solution</h4><ol><li>r = (3 − 1)i + (4 − 1)j = 2i + 3j</li><li>M = |i j k; 2 3 0; 1 2 0|</li><li>= i(0) − j(0) + k(4 − 3) = k</li></ol><h4>Interpretation and check</h4><p><b>M = k, magnitude 1 N·m.</b> The moment points along z because both r and F lie in the xy-plane - a rotation about the z-axis. Using OB instead of B − A is the usual error.</p>"}}, {"id": "v1n18", "q": {"en": "A force of 40 N acts at a perpendicular distance of 0.5 m from a hinge. Find the moment."}, "a": {"en": "<h4>Given and assumptions</h4><p>Perpendicular distance given, so the scalar form is fastest.</p><h4>Formula</h4><p>|M| = F × perpendicular distance</p><h4>Step-by-step solution</h4><ol><li>|M| = 40 × 0.5</li><li>= 20</li></ol><h4>Interpretation and check</h4><p><b>20 N·m.</b> Same answer as |r × F| with sin θ = 1. Doubling the distance doubles the moment - the reason a longer spanner loosens a bolt more easily.</p>"}}, {"id": "v1n19", "q": {"en": "If |a + b| = |a − b|, show that a and b are perpendicular."}, "a": {"en": "<h4>Given and assumptions</h4><p>Square both sides instead of working with roots.</p><h4>Formula</h4><p>|a ± b|² = |a|² ± 2a · b + |b|²</p><h4>Step-by-step solution</h4><ol><li>|a|² + 2a · b + |b|² = |a|² − 2a · b + |b|²</li><li>4a · b = 0</li><li>a · b = 0, so a ⊥ b</li></ol><h4>Interpretation and check</h4><p><b>a · b = 0, therefore perpendicular.</b> Geometrically the two diagonals of the parallelogram are equal exactly when it is a rectangle - the same statement in words.</p>"}}, {"id": "v1n20", "q": {"en": "If a = i − 2j + 3k and b = 2i + j − k, find |2a − 3b|."}, "a": {"en": "<h4>Given and assumptions</h4><p>Form the combination first, then take the magnitude.</p><h4>Formula</h4><p>k a scales every component</p><h4>Step-by-step solution</h4><ol><li>2a = 2i − 4j + 6k and 3b = 6i + 3j − 3k</li><li>2a − 3b = −4i − 7j + 9k</li><li>|2a − 3b| = √(16 + 49 + 81) = √146 ≈ 12.08</li></ol><h4>Interpretation and check</h4><p><b>√146 ≈ 12.08.</b> Estimate first: |2a| ≈ 2(3.74) = 7.5 and |3b| ≈ 3(2.45) = 7.3, so the difference lies between 0.2 and 14.8 - and 12.08 does.</p>"}}, {"id": "v1n21", "q": {"en": "Find a vector of magnitude 10 in the direction of 3i + 4j."}, "a": {"en": "<h4>Given and assumptions</h4><p>Find the unit vector, then multiply by the required magnitude.</p><h4>Formula</h4><p>required = magnitude × a-hat</p><h4>Step-by-step solution</h4><ol><li>|a| = 5</li><li>a-hat = (3i + 4j)/5</li><li>10 a-hat = 6i + 8j</li></ol><h4>Interpretation and check</h4><p><b>6i + 8j.</b> Check: √(36 + 64) = 10 ✓. Direction is unchanged because scaling by a positive number does not rotate a vector.</p>"}}, {"id": "v1n22", "q": {"en": "For A(1, 2, 3) and B(3, 4, 5) find AB, |AB| and the midpoint."}, "a": {"en": "<h4>Given and assumptions</h4><p>AB = OB − OA; the midpoint is the average of the coordinates.</p><h4>Formula</h4><p>AB = (x₂ − x₁)i + (y₂ − y₁)j + (z₂ − z₁)k</p><h4>Step-by-step solution</h4><ol><li>AB = 2i + 2j + 2k</li><li>|AB| = √12 = 2√3 ≈ 3.46</li><li>midpoint = (2, 3, 4)</li></ol><h4>Interpretation and check</h4><p><b>2i + 2j + 2k, 2√3 ≈ 3.46, midpoint (2, 3, 4).</b> Check the midpoint is halfway: AM = i + j + k with magnitude √3 = half of 2√3 ✓.</p>"}}, {"id": "v1n23", "q": {"en": "If a · b = 6, |a| = 3 and |b| = 4, find the angle between a and b."}, "a": {"en": "<h4>Given and assumptions</h4><p>All three quantities in the dot-product definition are known except θ.</p><h4>Formula</h4><p>cos θ = (a · b)/(|a||b|)</p><h4>Step-by-step solution</h4><ol><li>cos θ = 6/(3 × 4) = 6/12</li><li>cos θ = 0.5</li><li>θ = 60°</li></ol><h4>Interpretation and check</h4><p><b>60°.</b> Since a · b is positive and smaller than |a||b| = 12, the angle must be between 0° and 90° - 60° fits.</p>"}}, {"id": "v1n24", "q": {"en": "Find the work done by F = i + j + k along the displacement from (1, 2, 3) to (4, 6, 3)."}, "a": {"en": "<h4>Given and assumptions</h4><p>The displacement vector is the difference of the points.</p><h4>Formula</h4><p>W = F · d, with d = B − A</p><h4>Step-by-step solution</h4><ol><li>d = 3i + 4j + 0k</li><li>W = 1(3) + 1(4) + 1(0)</li><li>W = 7 J</li></ol><h4>Interpretation and check</h4><p><b>7 J.</b> The z-component contributes nothing because the displacement has no z-part - only the component of force along the motion does work.</p>"}}, {"id": "v1n25", "q": {"en": "Find the magnitude of the moment of F = i − j + 2k acting at r = 2i + 3j + k."}, "a": {"en": "<h4>Given and assumptions</h4><p>Cross product first, then its magnitude.</p><h4>Formula</h4><p>M = r × F and |M| = √(M₁² + M₂² + M₃²)</p><h4>Step-by-step solution</h4><ol><li>M = i(3×2 − 1×(−1)) − j(2×2 − 1×1) + k(2×(−1) − 3×1)</li><li>= i(6 + 1) − j(4 − 1) + k(−2 − 3) = 7i − 3j − 5k</li><li>|M| = √(49 + 9 + 25) = √83 ≈ 9.11</li></ol><h4>Interpretation and check</h4><p><b>√83 ≈ 9.11 N·m.</b> Check M · r = 14 − 9 − 5 = 0 ✓ and M · F = 7 + 3 − 10 = 0 ✓, so the moment is perpendicular to both vectors as it must be.</p>"}}, {"id": "v1n26", "q": {"en": "For |a| = 3, |b| = 4 and a · b = 6, find |a × b| and verify the identity |a × b|² + (a · b)² = |a|²|b|²."}, "a": {"en": "<h4>Given and assumptions</h4><p>Use the angle from the dot product, then both formulas.</p><h4>Formula</h4><p>|a × b| = |a||b| sin θ and sin²θ = 1 − cos²θ</p><h4>Step-by-step solution</h4><ol><li>cos θ = 6/12 = 0.5, so sin θ = √3/2</li><li>|a × b| = 12 × √3/2 = 6√3 ≈ 10.39</li><li>Check: (6√3)² + 6² = 108 + 36 = 144 = 9 × 16 ✓</li></ol><h4>Interpretation and check</h4><p><b>6√3 ≈ 10.39.</b> The identity holds for every pair of vectors, so it doubles as a check on any dot-and-cross question - compute whichever magnitude is easier and derive the other.</p>"}}], "viva": [{"title": {"en": "Vectors and algebra"}, "items": [{"q": {"en": "What is the difference between a scalar and a vector?"}, "a": {"en": "A scalar has magnitude only; a vector has magnitude and direction."}}, {"q": {"en": "How is the magnitude of a vector found?"}, "a": {"en": "|a| = √(a₁² + a₂² + a₃²), the square root of the sum of squared components."}}, {"q": {"en": "What is a unit vector?"}, "a": {"en": "A vector of length 1 in the direction of a, written a/|a|."}}, {"q": {"en": "State the triangle law of addition."}, "a": {"en": "Place the tail of b on the head of a; a + b joins the free tail to the free head."}}, {"q": {"en": "How do you find the vector AB from two points?"}, "a": {"en": "AB = OB − OA, that is head minus tail."}}, {"q": {"en": "When are two vectors parallel?"}, "a": {"en": "When one is a scalar multiple of the other, equivalently when a × b = 0."}}]}, {"title": {"en": "Dot and cross product"}, "items": [{"q": {"en": "Define the scalar product."}, "a": {"en": "a · b = |a||b| cos θ; in components it is a₁b₁ + a₂b₂ + a₃b₃."}}, {"q": {"en": "What does a · b = 0 mean?"}, "a": {"en": "The vectors are perpendicular (or one of them is the zero vector)."}}, {"q": {"en": "How is the angle between two vectors found?"}, "a": {"en": "cos θ = (a · b)/(|a||b|), then θ = cos⁻¹ of that value."}}, {"q": {"en": "Define the vector product."}, "a": {"en": "a × b = |a||b| sin θ n-hat, a vector perpendicular to both by the right-hand rule."}}, {"q": {"en": "What does a × b = 0 mean?"}, "a": {"en": "The vectors are parallel or antiparallel."}}, {"q": {"en": "Is the cross product commutative?"}, "a": {"en": "No: a × b = −(b × a). Only the dot product is commutative."}}, {"q": {"en": "What does |a × b| represent geometrically?"}, "a": {"en": "The area of the parallelogram with a and b as adjacent sides."}}, {"q": {"en": "State the identity linking dot and cross products."}, "a": {"en": "|a × b|² + (a · b)² = |a|²|b|²."}}]}, {"title": {"en": "Applications"}, "items": [{"q": {"en": "Write the formula for work done."}, "a": {"en": "W = F · d = |F||d| cos θ, measured in joules."}}, {"q": {"en": "Why is no work done when the force is perpendicular to the motion?"}, "a": {"en": "Because cos 90° = 0, so only the along-motion component contributes."}}, {"q": {"en": "Define the moment of a force."}, "a": {"en": "M = r × F, a vector in N·m giving the turning effect about a point."}}, {"q": {"en": "What is the scalar form of the moment?"}, "a": {"en": "|M| = force × perpendicular distance from the pivot."}}, {"q": {"en": "From which point is r measured in M = r × F?"}, "a": {"en": "From the point about which the moment is taken, to the point of application of the force."}}, {"q": {"en": "Which product gives the area of a triangle from two vectors?"}, "a": {"en": "Half the magnitude of their cross product, ½|a × b|."}}, {"q": {"en": "How do you test three points for collinearity in 3-D?"}, "a": {"en": "Take two vectors from one point; the points are collinear when their cross product is zero."}}, {"q": {"en": "Give one practical use of the dot product."}, "a": {"en": "Finding the work done, or the component of a force along a direction."}}]}], "exam_questions": [{"q": {"en": "Practice: Find the magnitude and unit vector of a = 6i + 2j − 3k."}, "marks": 3}, {"q": {"en": "Practice: For a = i + j and b = i − j, find a · b and the angle between them."}, "marks": 4}, {"q": {"en": "Practice: Find the angle between i + 2j + 2k and 2i + j − 2k."}, "marks": 4}, {"q": {"en": "Practice: Find a × b for a = 3i − j + 2k and b = i + 2j − k."}, "marks": 4}, {"q": {"en": "Practice: Find the area of the parallelogram with sides i + 2j + 3k and 2i + j + k."}, "marks": 4}, {"q": {"en": "Practice: Find λ so that 3i + λj − 2k is perpendicular to 2i − j + 4k."}, "marks": 3}, {"q": {"en": "Practice: Find the work done by F = 4i − j + 2k along d = 2i + 3j − k."}, "marks": 3}, {"q": {"en": "Practice: Find the moment of F = 3i + j acting at r = 2i − j about the origin."}, "marks": 4}, {"q": {"en": "Practice: Find the projection of 2i + 3j − k on i + j + k."}, "marks": 4}, {"q": {"en": "Practice: Show that the points A(1, 2, 3), B(2, 3, 4) and C(3, 4, 5) are collinear."}, "marks": 4}, {"q": {"en": "Practice: If |a| = 5, |b| = 12 and a · b = 30, find the angle between a and b."}, "marks": 3}, {"q": {"en": "Practice: Find a vector of magnitude 6 perpendicular to both i + j and i − j."}, "marks": 4}, {"q": {"en": "Practice: Find the moment of F = 2i + 3j + k acting at A(1, 1, 1) about B(0, 1, 1)."}, "marks": 4}, {"q": {"en": "Practice: Find the area of the triangle with vertices (0, 0, 0), (2, 1, 0) and (1, 3, 4)."}, "marks": 4}, {"q": {"en": "Practice: A force F = 2i − j + 3k acts at the point P(1, 2, 3). Find its moment about Q(2, 0, 1) and the work done if the point moves from P to Q."}, "marks": 4}], "learning_outcomes": [{"en": "CO3: Demonstrate the ability to crack engineering related problems based on concepts of vectors."}], "course_outcomes": ["CO3"], "practical_numbers": [], "content_kind": "theory", "lesson_count": 15, "answered_practice_count": 15, "assessment_note": {"en": "Official course: theory ESE 70 + PA 30 = 100 marks, 4 credits; this unit carries 20 % weightage and about 14 of the 70 theory marks. Practice-question marks (3/4) are suggested revision sizes, not official GTU allocations or a guaranteed paper pattern. Model answers are in Notes section 7."}, "question_provenance": "Original answered revision questions; not official past papers", "question_marks_are_suggested": true, "sources": [{"title": "GTU DI01000021, Mathematics-I, Branch: All, Semester 1, w.e.f. 2024-25 (uploaded syllabus)", "url": "https://s3-ap-southeast-1.amazonaws.com/gtusitecirculars/Syallbus/DI01000021.pdf"}, {"title": "Khan Academy - vectors, dot product and cross product", "url": "https://www.khanacademy.org/math/linear-algebra/vectors-and-spaces"}, {"title": "GeoGebra 3D - build two vectors and watch the cross product", "url": "https://www.geogebra.org/3d"}, {"title": "OpenStax - University Physics Volume 1, chapter 2 (vectors) and chapter 10 (torque)", "url": "https://openstax.org/details/books/university-physics-volume-1"}, {"title": "Narayan Shanti, Mittal P.K - A Text Book of Vector Analysis (S. Chand)", "url": "https://www.schandpublishing.com/"}]};

roke=\"#B66A00\" stroke-width=\"1.6\"/><text x=\"180\" y=\"271.6\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">projection of a on b = (a · b)/|b|</text><text x=\"180\" y=\"315.6\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">If θ = 90° the shadow vanishes, so a · b = 0.</text><text x=\"180\" y=\"331.6\" font-size=\"10.2\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">The sign of a · b tells you whether θ is acute or obtuse.</text></svg>", "v4_cross": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 360\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"360\" fill=\"#ffffff\"/><text x=\"180\" y=\"28.9\" font-size=\"14\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">The cross product gives a perpendicular</text><text x=\"180\" y=\"49.7\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">a × b points along n, the right-hand rule</text><path d=\"M120 232 H320\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"322\" y=\"229.4\" font-size=\"9.6\" text-anchor=\"end\" fill=\"#333\" font-weight=\"normal\">x</text><path d=\"M120 232 L40 180\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"179.4\" font-size=\"9.6\" text-anchor=\"end\" fill=\"#333\" font-weight=\"normal\">y</text><path d=\"M120 232 V96\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"130\" y=\"107.4\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#333\" font-weight=\"normal\">z</text><polygon points=\"120,232 250,232 306,148 176,148\" fill=\"#EAF3FD\" stroke=\"#1565C0\" stroke-width=\"1.1\" opacity=\"0.75\"/><path d=\"M120 232 L250 232\" fill=\"none\" stroke=\"#1565C0\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polyg   if (e.target.closest('#zo')) setZoom(zoom-0.5);
  if (e.target.closest('#zr')) setZoom(1);
});
render();
</script>
