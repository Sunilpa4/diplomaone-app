<script>
const U = {"subject": "DI02000051", "unit": 3, "format": "notes", "title": {"en": "Renewable Energy Technologies", "gu": "નવીકરણીય ઊર્જા ટેકનોલોજી"}, "hours": 7, "weightage": 25, "official": true, "languages": ["en", "gu"], "tabs": ["notes", "diagrams", "equations", "numericals", "viva", "exam"], "intro_text": {"en": "Unit 3 of Environmental Sustainability: why renewable energy shrinks the carbon footprint and how it compares with coal and gas; the photovoltaic effect, the I-V curve and the six families of solar cell; the wind resource, the Betz limit, horizontal against vertical axis turbines, the parts of a turbine and the bladeless idea; ethanol, biodiesel, biogas, biomass gasification and algal fuel; and geothermal, ocean and hydrogen energy. Eleven lecture cards, six diagrams, twelve fully solved numericals and twelve answered practice questions.", "gu": "પર્યાવરણીય ટકાઉપણાનું યુનિટ 3: પુનઃપ્રાપ્ય ઊર્જા કાર્બન ફૂટપ્રિન્ટ કેમ ઘટાડે અને તે કોલસા-ગેસ સાથે કેવી રીતે સરખાય; ફોટોવોલ્ટેઇક પ્રભાવ, I-V વણકર અને સૌર સેલનાં છ કુટુંબ; પવન સંસાધન, બેટ્ઝ મર્યાદા, આડી સામે ઊભી અક્ષની ટર્બાઇન, ટર્બાઇનના ભાગો અને બ્લેડ વગરની કલ્પના; ઇથેનોલ, બાયોડીઝલ, બાયોગેસ, બાયોમાસ ગેસિફિકેશન અને શેવાળ ઇંધણ; તથા ભૂતાપ, મહાસાગર અને હાઇડ્રોજન ઊર્જા. અગિયાર પાઠ-કાર્ડ, છ આકૃતિઓ, બાર પૂરા ઉકેલાયેલા દાખલા અને બાર ઉત્તરસહિત સરાવ પ્રશ્નો."}, "notes": [{"title": {"en": "1. Renewable Energy and the Carbon Footprint", "gu": "1. પુનઃપ્રાપ્ય ઊર્જા અને કાર્બન ફૂટપ્રિન્ટ"}, "items": [{"h": {"en": "3.1 Why renewable energy cuts the carbon footprint", "gu": "3.1 પુનઃપ્રાપ્ય ઊર્જા કાર્બન ફૂટપ્રિન્ટ કેમ ઘટાડે"}, "body": {"en": "<h4>The chain that matters</h4><p>About three quarters of the world's greenhouse gas emissions come from burning coal, oil and gas for electricity, heat, transport and industry. A renewable plant does not burn fuel, so it produces no CO₂ while it runs; its emissions are moved to the factory that makes the panels or turbines and to the vehicles that install them. That is why a renewable source is judged by its <b>carbon payback</b>: the years a wind turbine takes to generate the energy that was spent building it - usually six to twelve months for wind and one to two years for solar.</p><h4>What makes it cheap now</h4><p>The cost of solar electricity has fallen by roughly ninety per cent in a decade and on-shore wind by nearly seventy per cent, because module prices dropped, turbines grew taller and financing became cheaper. In India solar and wind now sell power below five rupees a unit, cheaper than a new coal plant, which is why the target of 500 GW of non-fossil capacity by 2030 is being built through auctions rather than subsidy alone.</p><h4>Four benefits, four costs</h4><table><tr><th>Benefit</th><th>Why it matters</th></tr><tr><td>no fuel bill</td><td>the sun and wind are free, so the cost is fixed for 25 years</td></tr><tr><td>energy security</td><td>imported coal and gas can be cut, and the rupee is saved</td></tr><tr><td>local jobs</td><td>installation and maintenance work stays in the district</td></tr><tr><td>clean air too</td><td>no SO₂, NOx or fly ash at the plant</td></tr><tr><td>intermittent output</td><td>no sun at night, no wind on a calm day</td></tr><tr><td>land and roof area</td><td>about 4 acres per MW of solar, more for wind</td></tr><tr><td>storage or backup</td><td>batteries and gas peakers cost extra</td></tr><tr><td>grid work</td><td>lines and substations must be strengthened</td></tr></table><h4>Worked example</h4><p>A 1 MW rooftop plant in Surat runs about 1,450 kWh per kW per year, so it makes 1,450 MWh. At the Indian grid factor of 0.71 t CO₂ per MWh it avoids about 1,030 t of CO₂ a year - the yearly emissions of roughly 500 city cars.</p>", "gu": "<h4>મહત્ત્વની શૃંખલા</h4><p>દુનિયાના લગભગ ત્રણ ચતુર્થાંશ હરિતગૃહ વાયુ ઉત્સર્જન વીજળી, ઉષ્મા, વાહનવ્યવહાર અને ઉદ્યોગ માટે કોલસો, તેલ અને ગેસ બાળવાથી આવે. પુનઃપ્રાપ્ય સ્ટેશન ઇંધણ બાળતું નથી, તેથી ચાલુ હોય ત્યારે CO₂ બનાવતું નથી; તેનું ઉત્સર્જન પેનલ કે ટર્બાઇન બનાવતી ફેક્ટરી અને ગોઠવણી કરતાં વાહનો તરફ ખસે છે. તેથી પુનઃપ્રાપ્ય સ્રોત તેના <b>કાર્બન પરતફેળા</b>થી માપવાય: બાંધવામાં વપરાયેલી ઊર્જા પાછી મેળવવા ટર્બાઇનને લાગતાં વર્ષો - સામાન્ય રીતે પવન માટે છથી બાર મહિના અને સૌર માટે એકથી બે વર્ષ.</p><h4>હવે તે સસ્તું કેમ બન્યું</h4><p>સૌર વીજળીનો ખર્ચ એક દાયકામાં લગભગ નેવું ટકા અને સ્થળ પરના પવનનો લગભગ સિત્તેર ટકા ઘટ્યો, કારણ કે મોડ્યુલના ભાવ ઘટ્યા, ટર્બાઇન ઊંચા થયા અને ધિરાણ સસ્તું થયું. ભારતમાં સૌર અને પવન હવે એક યુનિટ પાંચ રૂપિયાથી ઓછામાં વીજળી વેચે, નવા કોલસા સ્ટેશન કરતાં સસ્તું, તેથી 2030 સુધીમાં 500 GW બિન-અશ્મીય ક્ષમતાનું લક્ષ્ય ફક્ત સબસિડીથી નહીં, હરાજી દ્વારા બની રહ્યું છે.</p><h4>ચાર લાભ, ચાર ખર્ચ</h4><table><tr><th>લાભ</th><th>કેમ મહત્ત્વનું</th></tr><tr><td>ઇંધણનું બિલ નહીં</td><td>સૂર્ય અને પવન મફત છે, તેથી 25 વર્ષ ખર્ચ નિશ્ચિત રહે</td></tr><tr><td>ઊર્જા સુરક્ષા</td><td>આયાત કોલસો અને ગેસ ઘટે, રૂપિયો બચે</td></tr><tr><td>સ્થાનિક રોજગાર</td><td>ગોઠવણી અને જાળવણીનું કામ જિલ્લામાં જ રહે</td></tr><tr><td>સ્વચ્છ હવા પણ</td><td>સ્ટેશન પર SO₂, NOx કે ફ્લાય એશ નહીં</td></tr><tr><td>અનિયમિત ઉત્પાદન</td><td>રાત્રે સૂર્ય નહીં, શાંત દિવસે પવન નહીં</td></tr><tr><td>જમીન અને છતનો વિસ્તાર</td><td>સૌરના 1 MW દીઠ લગભગ 4 એકર, પવન માટે વધુ</td></tr><tr><td>સંગ્રહ કે બેકઅપ</td><td>બેટરી અને ગેસ પીકર વધારાનો ખર્ચ</td></tr><tr><td>ગ્રિડનું કામ</td><td>લાઇન અને સબસ્ટેશન મજબૂત કરવા પડે</td></tr></table><h4>ઉકેલાયેલ દાખલો</h4><p>સુરતમાં 1 MWનું છત પરનું સ્ટેશન દર વર્ષે પ્રતિ kW લગભગ 1,450 kWh બનાવે, એટલે 1,450 MWh. ભારતીય ગ્રિડ અવયવ 0.71 t CO₂ પ્રતિ MWh પ્રમાણે તે વર્ષે લગભગ 1,030 t CO₂ બચાવે - જે લગભગ 500 શહેરી કારના વાર્ષિક ઉત્સર્જન જેટલું છે.</p>"}, "diagram": "u3_mix", "syllabus_item": "3.1"}, {"h": {"en": "3.2 Renewable and non-renewable sources compared", "gu": "3.2 પુનઃપ્રાપ્ય અને બિન-પુનઃપ્રાપ્ય સ્રોતોની સરખામણી"}, "body": {"en": "<h4>The dividing line</h4><p>A <b>non-renewable</b> source holds a fixed stock that was made over millions of years - coal, oil, natural gas and uranium. Every unit burnt reduces the stock, and the fuel must be mined, transported and paid for again and again. A <b>renewable</b> source is a flow that nature refills within a human lifetime - sunlight, wind, falling water, heat from the earth, tides, and biomass grown on land.</p><h4>Side-by-side comparison</h4><table><tr><th>Point</th><th>Renewable</th><th>Non-renewable</th></tr><tr><td>availability</td><td>refilled by nature, never exhausted</td><td>finite stock, 50-150 years at present use</td></tr><tr><td>running cost</td><td>almost zero, no fuel</td><td>fuel is 60-80 % of the cost</td></tr><tr><td>capital cost</td><td>high upfront, then cheap</td><td>lower per MW but fuel keeps adding</td></tr><tr><td>output</td><td>variable, depends on weather</td><td>firm, dispatchable on demand</td></tr><tr><td>capacity factor</td><td>solar 15-22 %, wind 25-35 %</td><td>coal 55-70 %, nuclear above 80 %</td></tr><tr><td>land</td><td>large area per MW, can be dual use</td><td>compact, but mines and ash ponds spread far</td></tr><tr><td>emissions</td><td>none in operation, small life-cycle share</td><td>CO₂, SO₂, NOx, ash, mercury</td></tr><tr><td>waste</td><td>module and blade waste after 25 years</td><td>ash ponds, mine spoils, radioactive spent fuel</td></tr></table><h4>How to compare fairly</h4><p>Never compare a kW with a kW. Compare the <b>levellised cost of energy</b> (LCOE, the total lifetime cost divided by the total lifetime units) and the <b>emissions per kWh</b> over the whole life. On that basis Indian solar is about 2.5-3.5 rupees a unit against 4-6 for new coal, and solar emits 40-50 g CO₂ per kWh against 800-1,000 for coal.</p>", "gu": "<h4>ભેદરેખા</h4><p><b>બિન-પુનઃપ્રાપ્ય</b> સ્રોતમાં કરોડો વર્ષમાં બનેલો નિશ્ચિત સંગ્રહ હોય - કોલસો, તેલ, કુદરતી ગેસ અને યુરેનિયમ. બળે તે દરેક એકમ સંગ્રહ ઘટાડે અને ઇંધણ ખાણમાંથી કાઢી, વહન કરી, વારંવાર ખરીદવું પડે. <b>પુનઃપ્રાપ્ય</b> સ્રોત એ પ્રવાહ છે જે કુદરત માણસના આયુષ્યમાં ફરી ભરે - સૂર્યપ્રકાશ, પવન, પડતું પાણી, પૃથ્વીની ઉષ્મા, ભરતી અને જમીન પર ઉગતું બાયોમાસ.</p><h4>સાથે સરખામણી</h4><table><tr><th>મુદ્દો</th><th>પુનઃપ્રાપ્ય</th><th>બિન-પુનઃપ્રાપ્ય</th></tr><tr><td>ઉપલબ્ધતા</td><td>કુદરત ભરે, કદી ખતમ ન થાય</td><td>મર્યાદિત સંગ્રહ, હાલના વપરાશે 50-150 વર્ષ</td></tr><tr><td>ચાલુ ખર્ચ</td><td>લગભગ શૂન્ય, ઇંધણ નહીં</td><td>ઇંધણ ખર્ચના 60-80 %</td></tr><tr><td>મૂડી ખર્ચ</td><td>શરૂઆતમાં વધુ, પછી સસ્તું</td><td>પ્રતિ MW ઓછું, પણ ઇંધણ ઉમેરાતું રહે</td></tr><tr><td>ઉત્પાદન</td><td>બદલાતું, હવામાન પર આધારિત</td><td>નિશ્ચિત, માંગ પ્રમાણે આપી શકાય</td></tr><tr><td>ક્ષમતા અવયવ</td><td>સૌર 15-22 %, પવન 25-35 %</td><td>કોલસો 55-70 %, ન્યુક્લિયર 80 %થી વધુ</td></tr><tr><td>જમીન</td><td>પ્રતિ MW મોટો વિસ્તાર, બેવડો ઉપયોગ શક્ય</td><td>સંકુચિત, પણ ખાણ અને રાખના તળાવ દૂર સુધી ફેલાય</td></tr><tr><td>ઉત્સર્જન</td><td>ચાલુ સ્થિતિમાં નહીં, જીવનચક્રમાં થોડું</td><td>CO₂, SO₂, NOx, રાખ, પારો</td></tr><tr><td>કચરો</td><td>25 વર્ષ પછી મોડ્યુલ અને બ્લેડનો કચરો</td><td>રાખના તળાવ, ખાણનો કચરો, કિરણોત્સર્ગી વપરાયેલ ઇંધણ</td></tr></table><h4>ન્યાયી સરખામણી કેમ કરવી</h4><p>kW ને kW સાથે કદી સરખાવવું નહીં. <b>સમતુલિત ઊર્જા ખર્ચ</b> (LCOE, આખા જીવનનો કુલ ખર્ચ ભાગ્યા કુલ યુનિટ) અને આખા જીવનના <b>પ્રતિ kWh ઉત્સર્જન</b> સરખાવો. તે આધારે ભારતીય સૌર યુનિટના લગભગ 2.5-3.5 રૂપિયા, નવા કોલસાના 4-6 સામે, અને સૌર પ્રતિ kWh 40-50 g CO₂ છોડે, કોલસાના 800-1,000 સામે.</p>"}, "syllabus_item": "3.2"}]}, {"title": {"en": "2. Solar Photovoltaics", "gu": "2. સૌર ફોટોવોલ્ટેઇક"}, "items": [{"h": {"en": "3.3 The principle of photovoltaic conversion", "gu": "3.3 ફોટોવોલ્ટેઇક રૂપાંતરણનો સિદ્ધાંત"}, "body": {"en": "<h4>The photovoltaic effect</h4><p>A solar cell is a thin sandwich of two differently doped silicon layers. The <b>n-layer</b> has extra electrons, the <b>p-layer</b> has holes, and where they meet a built-in electric field forms across the <b>junction</b>. When a photon with enough energy strikes the silicon it frees an electron; the field pushes that electron one way and leaves a hole the other way, so a current flows when the front and back contacts are joined through a load. Nothing moves mechanically - light goes straight to electricity, which is why a cell has no fuel, no flame and almost no maintenance.</p><h4>Band gap decides the colour</h4><p>Only photons with energy above the <b>band gap</b> can free an electron. Silicon's gap is 1.1 eV, matching red and infrared light, so a silicon cell ignores about half the solar spectrum as heat and gives up part of each photon's energy as heat as well. That double loss is the reason a commercial module reaches only 18-22 % efficiency while the theoretical limit for a single junction, the Shockley-Queisser limit, is about 33 %.</p><h4>Reading the I-V curve</h4><table><tr><th>Term</th><th>Meaning</th></tr><tr><td>Isc, short-circuit current</td><td>current when the terminals are joined; grows with light</td></tr><tr><td>Voc, open-circuit voltage</td><td>voltage with no load; about 0.6-0.7 V per silicon cell</td></tr><tr><td>MPP, maximum power point</td><td>the knee of the curve, where V × I is largest</td></tr><tr><td>fill factor</td><td>MPP power divided by Voc × Isc, typically 0.75-0.82</td></tr><tr><td>efficiency</td><td>MPP power divided by the sunlight falling on the cell</td></tr></table><h4>What steals the output</h4><ul><li>heat: a hot module loses 0.35-0.45 % of its power per degree above 25 °C</li><li>dust and bird droppings: 5-25 % loss without cleaning</li><li>shade on one cell: bypass diodes save the string but the whole module drops</li><li>cable, inverter and mismatch loss: 10-15 % together</li></ul><h4>Common mistake</h4><p>Sizing an inverter for the panel's Voc at 25 °C. In a cold morning the open-circuit voltage of a string rises by about 0.3 % per degree below 25 °C and can exceed the inverter's limit; always size the string on the record low temperature, not on the datasheet value alone.</p>", "gu": "<h4>ફોટોવોલ્ટેઇક પ્રભાવ</h4><p>સૌર સેલ એ બે જુદી રીતે ડોપ કરેલા સિલિકોન સ્તરોની પાતળી સેન્ડવિચ છે. <b>n-સ્તર</b>માં વધારાના ઇલેક્ટ્રોન, <b>p-સ્તર</b>માં કાણાં હોય અને જ્યાં મળે ત્યાં <b>સંધિ</b> પર આંતરિક વિદ્યુતક્ષેત્ર બને. પૂરતી ઊર્જાવાળો ફોટોન સિલિકોન પર પડે ત્યારે ઇલેક્ટ્રોન મુક્ત થાય; ક્ષેત્ર તેને એક તરફ અને કાણું બીજી તરફ ધકેલે, તેથી આગળ-પાછળના સંપર્કો ભાર દ્વારા જોડાય તો પ્રવાહ વહે. યાંત્રિક રીતે કંઈ ફરતું નથી - પ્રકાશ સીધો વીજળી બને, તેથી સેલમાં ઇંધણ નહીં, જ્યોત નહીં અને જાળવણી લગભગ નહીં.</p><h4>બેન્ડ ગેપ રંગ નક્કી કરે</h4><p>ફક્ત <b>બેન્ડ ગેપ</b>થી વધુ ઊર્જાવાળા ફોટોન ઇલેક્ટ્રોન મુક્ત કરી શકે. સિલિકોનનો ગેપ 1.1 eV છે, જે લાલ અને ઇન્ફ્રારેડ પ્રકાશને મળે, તેથી સિલિકોન સેલ સૂર્યના લગભગ અડધા વર્ણપટને ઉષ્મા તરીકે અવગણે અને દરેક ફોટોનની થોડી ઊર્જા પણ ઉષ્મા તરીકે ગુમાવે. આ બેવડી ખોટને કારણે વ્યાવસાયિક મોડ્યુલ ફક્ત 18-22 % કાર્યક્ષમતા પામે, જ્યારે એક સંધિની સૈદ્ધાંતિક મર્યાદા, શોકલી-ક્વાઇસર મર્યાદા, લગભગ 33 % છે.</p><h4>I-V વણકર વાંચવી</h4><table><tr><th>શબ્દ</th><th>અર્થ</th></tr><tr><td>Isc, ટૂંકા પરિપથનો પ્રવાહ</td><td>ટર્મિનલ જોડાય ત્યારે પ્રવાહ; પ્રકાશ સાથે વધે</td></tr><tr><td>Voc, ખુલ્લા પરિપથનો વોલ્ટેજ</td><td>ભાર વગરનો વોલ્ટેજ; સિલિકોન સેલ દીઠ લગભગ 0.6-0.7 V</td></tr><tr><td>MPP, મહત્તમ શક્તિ બિંદુ</td><td>વણકરનું ઘૂંટણ, જ્યાં V × I સૌથી વધુ</td></tr><tr><td>ભરણ અવયવ</td><td>MPP શક્તિ ભાગ્યા Voc × Isc, સામાન્ય રીતે 0.75-0.82</td></tr><tr><td>કાર્યક્ષમતા</td><td>MPP શક્તિ ભાગ્યા સેલ પર પડતો સૂર્યપ્રકાશ</td></tr></table><h4>ઉત્પાદન શું ખાઈ જાય</h4><ul><li>ઉષ્મા: 25 °C થી ઉપર દરેક ડિગ્રીએ મોડ્યુલ તેની શક્તિના 0.35-0.45 % ગુમાવે</li><li>ધૂળ અને પક્ષીના મળ: સફાઈ વગર 5-25 % ખોટ</li><li>એક સેલ પર છાયો: બાયપાસ ડાયોડ શ્રેણી બચાવે પણ આખું મોડ્યુલ નીચે આવે</li><li>કેબલ, ઇન્વર્ટર અને મેળ ન બેસવાની ખોટ: ભેગી 10-15 %</li></ul><h4>સામાન્ય ભૂલ</h4><p>25 °C પરની પેનલની Voc પ્રમાણે ઇન્વર્ટર પસંદ કરવું. ઠંડી સવારે શ્રેણીનો ખુલ્લા પરિપથનો વોલ્ટેજ 25 °C થી નીચે દરેક ડિગ્રીએ લગભગ 0.3 % વધે અને ઇન્વર્ટરની મર્યાદા વટાવી શકે; શ્રેણી હંમેશા નોંધાયેલા ન્યૂનતમ તાપમાન પ્રમાણે નક્કી કરો, ફક્ત ડેટાશીટના આંકડા પ્રમાણે નહીં.</p>"}, "diagram": "u3_pv", "syllabus_item": "3.3"}, {"h": {"en": "3.3 Types of solar cells and how a module is built", "gu": "3.3 સૌર સેલના પ્રકાર અને મોડ્યુલ કેવી રીતે બને"}, "body": {"en": "<h4>The three families</h4><p>Solar cells are grouped by the material that absorbs the light. <b>Crystalline silicon</b>, either monocrystalline or polycrystalline, is more than ninety per cent of the market because it is efficient, stable and now cheap. <b>Thin film</b> cells - cadmium telluride, copper indium gallium selenide and amorphous silicon - use a micrometre of material on glass and win on price per area in very large plants and on flexible or curved roofs. <b>Emerging</b> cells, mainly perovskite and organic, promise higher efficiency at low cost but are still being tested for twenty-five year life.</p><h4>Comparison table</h4><table><tr><th>Type</th><th>Efficiency</th><th>Strength</th><th>Weakness</th></tr><tr><td>monocrystalline silicon</td><td>20-23 %</td><td>best output per square metre, 25 year life</td><td>costliest of the three, needs full sun</td></tr><tr><td>polycrystalline silicon</td><td>15-18 %</td><td>cheapest silicon, simple to make</td><td>more area for the same kW, lower heat tolerance</td></tr><tr><td>CdTe thin film</td><td>16-19 %</td><td>cheap large panels, good in weak light</td><td>cadmium toxicity, tellurium supply</td></tr><tr><td>CIGS thin film</td><td>17-20 %</td><td>flexible, high yield in heat and shade</td><td>indium cost, complex process</td></tr><tr><td>amorphous silicon</td><td>6-9 %</td><td>very cheap, works on curved and dim surfaces</td><td>low output, degrades in the first months</td></tr><tr><td>perovskite / tandem</td><td>25-33 % in the lab</td><td>highest efficiency, printable, cheap material</td><td>moisture and UV instability, lead content</td></tr></table><h4>From cell to array</h4><ol><li>About 60 or 72 cells are soldered in series and laminated under glass, ethylene vinyl acetate and a back sheet to make a <b>module</b>; the series connection adds the voltage, not the current.</li><li>Modules are mounted on a frame at the local latitude tilt, facing south in India, and wired in strings to a <b>combiner box</b>.</li><li>A <b>string inverter</b> or a central inverter converts DC to AC; a transformer steps it up to 11 or 33 kV for the grid.</li><li>Meters, protection and a data logger complete the plant; the performance ratio compares the actual output with the ideal.</li></ol><h4>Worked example</h4><p>A 445 Wp module of 2.1 m² under 1,000 W/m² receives 2,100 W and delivers 445 W, so its efficiency is 445 / 2,100 = 21.2 %. Eighteen such modules make an 8 kW array.</p>", "gu": "<h4>ત્રણ કુટુંબ</h4><p>સૌર સેલ પ્રકાશ શોષતા પદાર્થ પ્રમાણે વહેંચાય. <b>સ્ફટિકીય સિલિકોન</b>, મોનોક્રિસ્ટાલાઇન કે પોલીક્રિસ્ટાલાઇન, બજારના નેવું ટકાથી વધુ છે કારણ કે તે કાર્યક્ષમ, ટકાઉ અને હવે સસ્તું છે. <b>પાતળી ફિલ્મ</b> સેલ - કેડમિયમ ટેલ્યુરાઇડ, કોપર ઇન્ડિયમ ગેલિયમ સેલેનાઇડ અને એમોર્ફસ સિલિકોન - કાચ પર માઇક્રોમીટર જેટલો પદાર્થ વાપરે અને ખૂબ મોટા સ્ટેશન તથા લવચીક કે વળેલી છત પર પ્રતિ વિસ્તાર ભાવમાં જીતે. <b>ઉભરતા</b> સેલ, મુખ્યત્વે પેરોવસ્કાઇટ અને ઓર્ગેનિક, ઓછા ખર્ચે વધુ કાર્યક્ષમતાનું વચન આપે છે પણ પચ્ચીસ વર્ષના આયુષ્ય માટે હજી પરીક્ષણમાં છે.</p><h4>સરખામણી કોષ્ટક</h4><table><tr><th>પ્રકાર</th><th>કાર્યક્ષમતા</th><th>તાકાત</th><th>નબળાઈ</th></tr><tr><td>મોનોક્રિસ્ટાલાઇન સિલિકોન</td><td>20-23 %</td><td>પ્રતિ ચોરસ મીટર શ્રેષ્ઠ ઉત્પાદન, 25 વર્ષ આયુષ્ય</td><td>ત્રણમાં સૌથી મોંઘું, પૂરો તડકો જોઈએ</td></tr><tr><td>પોલીક્રિસ્ટાલાઇન સિલિકોન</td><td>15-18 %</td><td>સૌથી સસ્તું સિલિકોન, બનાવવું સહેલું</td><td>સમાન kW માટે વધુ વિસ્તાર, ઉષ્મા સહન ઓછું</td></tr><tr><td>CdTe પાતળી ફિલ્મ</td><td>16-19 %</td><td>સસ્તી મોટી પેનલ, નબળા પ્રકાશમાં સારું</td><td>કેડમિયમ ઝેરીલાપણું, ટેલ્યુરિયમનો પુરવઠો</td></tr><tr><td>CIGS પાતળી ફિલ્મ</td><td>17-20 %</td><td>લવચીક, ઉષ્મા અને છાયામાં સારું ઉત્પાદન</td><td>ઇન્ડિયમનો ખર્ચ, જટિલ પ્રક્રિયા</td></tr><tr><td>એમોર્ફસ સિલિકોન</td><td>6-9 %</td><td>ખૂબ સસ્તું, વળેલી અને મંદ સપાટી પર ચાલે</td><td>ઓછું ઉત્પાદન, શરૂઆતના મહિનામાં ઘટે</td></tr><tr><td>પેરોવસ્કાઇટ / ટેન્ડમ</td><td>લેબમાં 25-33 %</td><td>સૌથી વધુ કાર્યક્ષમતા, છપાય, સસ્તો પદાર્થ</td><td>ભેજ અને UV અસ્થિરતા, સીસાનું પ્રમાણ</td></tr></table><h4>સેલથી એરે સુધી</h4><ol><li>લગભગ 60 કે 72 સેલ શ્રેણીમાં જોડી, કાચ, એથિલિન વિનાઇલ એસિટેટ અને બેક શીટ નીચે લેમિનેટ કરીને <b>મોડ્યુલ</b> બને; શ્રેણી જોડાણ વોલ્ટેજ ઉમેરે, પ્રવાહ નહીં.</li><li>મોડ્યુલ સ્થાનિક અક્ષાંશ જેટલા ઝુકાવ પર, ભારતમાં દક્ષિણ તરફ મુખ રાખી ફ્રેમ પર ગોઠવાય અને શ્રેણીમાં જોડાઈ <b>કોમ્બાઇનર બોક્સ</b> સુધી જાય.</li><li><b>સ્ટ્રિંગ ઇન્વર્ટર</b> કે કેન્દ્રીય ઇન્વર્ટર DCને AC બનાવે; ટ્રાન્સફોર્મર ગ્રિડ માટે 11 કે 33 kV સુધી વધારે.</li><li>મીટર, રક્ષણ અને ડેટા લોગર સ્ટેશન પૂરું કરે; કાર્યદક્ષતા ગુણોત્તર વાસ્તવિક ઉત્પાદનને આદર્શ સાથે સરખાવે.</li></ol><h4>ઉકેલાયેલ દાખલો</h4><p>2.1 m² નું 445 Wp મોડ્યુલ 1,000 W/m² હેઠળ 2,100 W પામે અને 445 W આપે, તેથી તેની કાર્યક્ષમતા 445 / 2,100 = 21.2 % થાય. આવા અઢાર મોડ્યુલ 8 kWની એરે બનાવે.</p>"}, "diagram": "u3_cells", "syllabus_item": "3.3"}]}, {"title": {"en": "3. Wind Energy", "gu": "3. પવન ઊર્જા"}, "items": [{"h": {"en": "3.4 The wind resource and the power in it", "gu": "3.4 પવન સંસાધન અને તેમાં રહેલી શક્તિ"}, "body": {"en": "<h4>Why wind speed matters so much</h4><p>The power available in moving air goes with the <b>cube</b> of the speed: double the wind and you get eight times the power, so a site with a mean of 7 m/s produces far more than twice the energy of a site with 5 m/s. Wind is also slower and steadier near the ground, which is why towers are now 100-140 m tall and blades 60-80 m long: the swept area grows with the square of the diameter, and every extra metre of rotor radius adds output at no extra fuel cost.</p><h4>The Betz limit</h4><p>A turbine cannot stop the wind completely; if it did, no more air could enter. The German physicist Albert Betz showed in 1919 that the best a rotor can do is extract 16/27, about <b>59.3 %</b>, of the power in the wind. Real machines reach 40-50 % of that ideal as a power coefficient Cp, and the best three-bladed designs touch 0.45-0.50, which is why a Cp of 0.45 is the normal figure in textbook problems.</p><h4>Reading a wind site</h4><table><tr><th>Measure</th><th>What it tells you</th></tr><tr><td>mean wind speed at hub height</td><td>first screen; 6 m/s or more is worth developing</td></tr><tr><td>wind power density, W/m²</td><td>class 1 poor, class 7 excellent</td></tr><tr><td>Weibull shape factor k</td><td>k near 2 means a steady site; a low k brings violent gusts</td></tr><tr><td>turbulence intensity</td><td>high near buildings and forests, shortens gearbox life</td></tr><tr><td>capacity factor</td><td>good Indian sites reach 30-38 %</td></tr></table><h4>Worked example</h4><p>A 120 m rotor at 12 m/s in air of 1.225 kg/m³: swept area = π × 60² = 11,310 m², so the power in the wind is 0.5 × 1.225 × 11,310 × 12³ = 11.9 MW. At Cp = 0.45 and a drive train efficiency of 0.94 the electrical output is 11.9 × 0.45 × 0.94 = 5.05 MW, close to the 5 MW rating of the machine.</p><h4>Common mistake</h4><p>Multiplying the generator rating by 8,760 hours to get annual energy. A 2 MW turbine at a 30 % capacity factor makes about 5.3 GWh a year, not 17.5 GWh.</p>", "gu": "<h4>પવનની ગતિ કેમ આટલી મહત્ત્વની</h4><p>ચાલતી હવામાં ઉપલબ્ધ શક્તિ ગતિના <b>ઘન</b> પ્રમાણમાં હોય: પવન બમણો થાય તો શક્તિ આઠ ગણી, તેથી સરેરાશ 7 m/s વાળું સ્થળ 5 m/s વાળા સ્થળ કરતાં બમણાથી ઘણું વધુ ઉત્પાદન આપે. જમીન પાસે પવન ધીમો અને અનિયમિત હોય, તેથી હવે ટાવર 100-140 m ઊંચા અને બ્લેડ 60-80 m લાંબા બને: ઘેરાયેલો વિસ્તાર વ્યાસના વર્ગ પ્રમાણમાં વધે અને રોટર ત્રિજ્યાનો દરેક વધારાનો મીટર વધારાના ઇંધણ ખર્ચ વગર ઉત્પાદન ઉમેરે.</p><h4>બેટ્ઝ મર્યાદા</h4><p>ટર્બાઇન પવનને પૂરો રોકી શકે નહીં; રોકે તો વધુ હવા અંદર આવી ન શકે. જર્મન ભૌતિકશાસ્ત્રી આલ્બર્ટ બેટ્ઝે 1919માં દર્શાવ્યું કે રોટર વધુમાં વધુ 16/27, લગભગ <b>59.3 %</b>, શક્તિ ખેંચી શકે. વાસ્તવિક મશીન તે આદર્શના 40-50 % સુધી શક્તિ અવયવ Cp તરીકે પહોંચે અને શ્રેષ્ઠ ત્રણ-બ્લેડ રચના 0.45-0.50 સ્પર્શે, તેથી પાઠ્યપુસ્તકના દાખલામાં Cp = 0.45 સામાન્ય આંકડો છે.</p><h4>પવન સ્થળ વાંચવું</h4><table><tr><th>માપ</th><th>તે શું કહે</th></tr><tr><td>હબની ઊંચાઈ પર સરેરાશ પવન ગતિ</td><td>પ્રથમ ગાળણી; 6 m/s કે વધુ વિકાસલાયક</td></tr><tr><td>પવન શક્તિ ઘનતા, W/m²</td><td>વર્ગ 1 નબળું, વર્ગ 7 ઉત્તમ</td></tr><tr><td>વેઇબુલ આકાર અવયવ k</td><td>k લગભગ 2 એટલે સ્થિર સ્થળ; નીચો k હિંસક ઝાપટા લાવે</td></tr><tr><td>અશાંતિ તીવ્રતા</td><td>ઇમારત અને જંગલ પાસે વધુ, ગિયરબોક્સનું આયુષ્ય ઘટાડે</td></tr><tr><td>ક્ષમતા અવયવ</td><td>સારા ભારતીય સ્થળ 30-38 % પામે</td></tr></table><h4>ઉકેલાયેલ દાખલો</h4><p>1.225 kg/m³ હવામાં 12 m/s પર 120 m રોટર: ઘેરાયેલો વિસ્તાર = π × 60² = 11,310 m², તેથી પવનમાં શક્તિ = 0.5 × 1.225 × 11,310 × 12³ = 11.9 MW. Cp = 0.45 અને 0.94 ડ્રાઇવ ટ્રેન કાર્યક્ષમતાએ વીજ ઉત્પાદન 11.9 × 0.45 × 0.94 = 5.05 MW, મશીનના 5 MW રેટિંગની નજીક.</p><h4>સામાન્ય ભૂલ</h4><p>જનરેટર રેટિંગને 8,760 કલાકથી ગુણીને વાર્ષિક ઊર્જા કાઢવી. 30 % ક્ષમતા અવયવે 2 MW ટર્બાઇન વર્ષે લગભગ 5.3 GWh બનાવે, 17.5 GWh નહીં.</p>"}, "diagram": "u3_wind", "syllabus_item": "3.4"}, {"h": {"en": "3.4 HAWT and VAWT, the parts of a turbine, and the bladeless idea", "gu": "3.4 HAWT અને VAWT, ટર્બાઇનના ભાગો અને બ્લેડ વગરની કલ્પના"}, "body": {"en": "<h4>Two axes</h4><p>A <b>horizontal-axis</b> wind turbine (HAWT) has its rotor shaft parallel to the ground and the wind, so it must face the wind - a yaw motor turns the nacelle. It sweeps a large circle, reaches Cp of 0.45-0.50 and dominates utility-scale wind. A <b>vertical-axis</b> turbine (VAWT: Savonius, Darrieus, H-rotor) spins about a vertical shaft whatever direction the wind comes from, needs no yaw and puts the generator at ground level, but its lower half works in disturbed air and drag, so Cp is only 0.15-0.35.</p><h4>HAWT against VAWT</h4><table><tr><th>Point</th><th>HAWT</th><th>VAWT</th></tr><tr><td>axis</td><td>horizontal, rotor faces the wind</td><td>vertical, wind from any side</td></tr><tr><td>efficiency Cp</td><td>0.45-0.50</td><td>0.15-0.35</td></tr><tr><td>size built</td><td>up to 15 MW offshore, 120-260 m rotor</td><td>small, 1-100 kW units</td></tr><tr><td>yaw mechanism</td><td>needed</td><td>not needed</td></tr><tr><td>generator position</td><td>on top, in the nacelle</td><td>at ground level</td></tr><tr><td>tower loads</td><td>high bending moment, heavy foundation</td><td>lower, lighter foundation</td></tr><tr><td>noise and birds</td><td>blade tip noise, bird strike risk</td><td>quieter, safer for birds</td></tr><tr><td>best use</td><td>wind farms, onshore and offshore</td><td>rooftops, streets, pumping, remote sites</td></tr></table><h4>Parts of a HAWT</h4><ol><li>The <b>blades</b> - usually three, aerofoil shaped like an aircraft wing - catch the wind and turn it into torque; pitch motors twist them to control power.</li><li>The <b>hub</b> joins the blades to the low-speed shaft inside the <b>nacelle</b>.</li><li>A <b>gearbox</b> raises the 10-20 rpm of the rotor to about 1,500 rpm for the generator; direct-drive machines use a large slow multi-pole generator instead.</li><li>A <b>yaw drive</b> keeps the rotor facing the wind; <b>anemometer and wind vane</b> on the nacelle tell the controller what to do.</li><li>The <b>tower</b> carries everything to hub height and the <b>foundation</b> holds it against overturning; a <b>transformer</b> at the base steps the voltage up.</li></ol><h4>Bladeless wind turbines</h4><p>A bladeless machine, such as the vortex or the Spanish Vortex Bladeless design, is a tapered mast that <b>vibrates</b> when wind sheds vortices behind it - vortex-induced vibration, the same effect that once destroyed the Tacoma bridge. Magnets and coils at the base turn that sway into electricity. Advantages: no blades, no gearbox, fewer moving parts, very quiet, safe for birds, low maintenance and cheap to make. Drawbacks: efficiency is only a few per cent of the Betz limit, the output is small (a few hundred watts to a few kW), it needs a steady wind and resonance tuning, and it cannot yet compete for grid-scale power.</p>", "gu": "<h4>બે અક્ષ</h4><p><b>આડી અક્ષ</b>ની પવન ટર્બાઇન (HAWT)ની રોટર ધરી જમીન અને પવનને સમાંતર હોય, તેથી તેણે પવન તરફ મુખ રાખવું પડે - યો મોટર નેસેલ ફેરવે. તે મોટું વર્તુળ ઘેરે, Cp 0.45-0.50 પામે અને ઉપયોગિતા-સ્તરના પવન પર રાજ કરે. <b>ઊભી અક્ષ</b>ની ટર્બાઇન (VAWT: સેવોનિયસ, ડેરિયસ, H-રોટર) પવન ગમે તે દિશાથી આવે, ઊભી ધરી પર ફરે, યો ન જોઈએ અને જનરેટર જમીન સ્તરે રાખે, પણ તેનો નીચેનો અડધો ભાગ ખલેલાયેલી હવામાં અને ડ્રેગમાં કામ કરે, તેથી Cp ફક્ત 0.15-0.35.</p><h4>HAWT સામે VAWT</h4><table><tr><th>મુદ્દો</th><th>HAWT</th><th>VAWT</th></tr><tr><td>અક્ષ</td><td>આડી, રોટર પવન તરફ</td><td>ઊભી, કોઈ પણ બાજુથી પવન</td></tr><tr><td>કાર્યક્ષમતા Cp</td><td>0.45-0.50</td><td>0.15-0.35</td></tr><tr><td>બનેલું માપ</td><td>15 MW સુધી દરિયામાં, 120-260 m રોટર</td><td>નાના, 1-100 kW એકમ</td></tr><tr><td>યો પ્રણાલી</td><td>જરૂરી</td><td>જરૂરી નહીં</td></tr><tr><td>જનરેટરનું સ્થાન</td><td>ઉપર, નેસેલમાં</td><td>જમીન સ્તરે</td></tr><tr><td>ટાવર પર ભાર</td><td>મોટો વળાંક ભાર, ભારે પાયો</td><td>ઓછો, હલકો પાયો</td></tr><tr><td>ઘોંઘાટ અને પક્ષી</td><td>બ્લેડની ટોચનો ઘોંઘાટ, પક્ષી અથડાવાનું જોખમ</td><td>શાંત, પક્ષીઓ માટે સુરક્ષિત</td></tr><tr><td>શ્રેષ્ઠ ઉપયોગ</td><td>પવન ફાર્મ, જમીન પર અને દરિયામાં</td><td>છત, શેરી, પાણી ઉપાડ, દૂરનાં સ્થળ</td></tr></table><h4>HAWTના ભાગો</h4><ol><li><b>બ્લેડ</b> - સામાન્ય રીતે ત્રણ, વિમાનના પાંખ જેવા - પવન પકડીને ટોર્ક બનાવે; પિચ મોટર તેમને વાળીને શક્તિ નિયંત્રિત કરે.</li><li><b>હબ</b> બ્લેડને <b>નેસેલ</b>માંની ધીમી ધરી સાથે જોડે.</li><li><b>ગિયરબોક્સ</b> રોટરના 10-20 rpmને જનરેટર માટે લગભગ 1,500 rpm કરે; ડાયરેક્ટ-ડ્રાઇવ મશીન તેના બદલે મોટું ધીમું બહુ-ધ્રુવ જનરેટર વાપરે.</li><li><b>યો ડ્રાઇવ</b> રોટરને પવન તરફ રાખે; નેસેલ પરના <b>એનિમોમીટર અને પવન દિશા</b> નિયંત્રકને શું કરવું તે કહે.</li><li><b>ટાવર</b> બધું હબની ઊંચાઈ સુધી લઈ જાય અને <b>પાયો</b> ઊલટવાથી રક્ષે; પાયા પાસેનું <b>ટ્રાન્સફોર્મર</b> વોલ્ટેજ વધારે.</li></ol><h4>બ્લેડ વગરની પવન ટર્બાઇન</h4><p>બ્લેડ વગરનું મશીન, જેમ કે વોર્ટેક્સ કે સ્પેનિશ Vortex Bladeless રચના, એ પાતળું થતું થાંભલું છે જે પવન તેની પાછળ વમળ છોડે ત્યારે <b>કંપે</b> - વમળ-જનિત કંપન, જે અસરથી એક સમયે ટેકોમા પુલ તૂટ્યો હતો. પાયા પાસેના ચુંબક અને કોઇલ તે ડોલનને વીજળીમાં ફેરવે. લાભ: બ્લેડ નહીં, ગિયરબોક્સ નહીં, ઓછા ફરતા ભાગ, ખૂબ શાંત, પક્ષીઓ માટે સુરક્ષિત, ઓછી જાળવણી અને સસ્તું બનાવવું. ખામી: કાર્યક્ષમતા બેટ્ઝ મર્યાદાના ફક્ત થોડા ટકા, ઉત્પાદન નાનું (થોડા સો વોટથી થોડા kW), સ્થિર પવન અને અનુનાદ ગોઠવણ જોઈએ, અને ગ્રિડ-સ્તરની શક્તિ માટે હજી ટક્કર ન કરી શકે.</p>"}, "syllabus_item": "3.4"}]}, {"title": {"en": "4. Bioenergy", "gu": "4. બાયોએનર્જી"}, "items": [{"h": {"en": "3.5 Biofuels: ethanol and biodiesel", "gu": "3.5 જૈવઇંધણ: ઇથેનોલ અને બાયોડીઝલ"}, "body": {"en": "<h4>What a biofuel is</h4><p>A <b>biofuel</b> is a liquid or gas fuel made from recently living matter - plants, crop residues, animal dung or algae. The carbon it releases when burnt was taken out of the air by the plant while it grew, so in principle the cycle is close to carbon neutral. In practice the balance depends on the crop, the fertiliser, the transport and whether land or food was displaced, which is why the subject is taught with a <b>life-cycle</b> view rather than a single sum.</p><h4>Ethanol</h4><p><b>Ethanol</b> (C₂H₅OH) is made by fermenting sugar with yeast and then distilling it to 99.5 % purity. Sugar cane juice and molasses are the Indian feedstock; maize, wheat and rice straw are used elsewhere, and second-generation plants use crop residue or wood after breaking the cellulose down. In India it is blended with petrol - E10 means 10 % ethanol by volume - because it raises the octane number and cuts both imported oil and CO. Its energy content is about two thirds that of petrol, so a 20 % blend raises fuel use by roughly 5-7 %.</p><h4>Biodiesel and transesterification</h4><p>Vegetable oil is too thick to burn cleanly in a diesel engine, so it is reacted with methanol and a catalyst (sodium hydroxide) to make <b>fatty acid methyl esters</b> - biodiesel - and glycerol as a by-product. One hundred kilograms of oil with about twenty kilograms of methanol gives roughly one hundred kilograms of biodiesel and ten kilograms of glycerol. Feedstocks include used cooking oil, jatropha and karanja seed, palm and cotton-seed oil. Biodiesel has a high cetane number, almost no sulphur and good lubricity, but it gels in cold weather and is slightly more expensive.</p><h4>The three generations</h4><table><tr><th>Generation</th><th>Feedstock</th><th>Examples</th><th>Criticism</th></tr><tr><td>first</td><td>food crops</td><td>sugarcane ethanol, soya and palm biodiesel</td><td>competes with food and land, indirect land-use change</td></tr><tr><td>second</td><td>residue and waste</td><td>rice straw, bagasse, used cooking oil, wood chips</td><td>collection and pre-treatment cost</td></tr><tr><td>third</td><td>algae and microbes</td><td>algal oil, engineered cyanobacteria</td><td>still costly, needs water, light and CO₂</td></tr></table><h4>Common mistake</h4><p>Calling every biofuel carbon neutral. Growing the crop, making the fertiliser, distilling the ethanol and transporting it all emit CO₂; Indian molasses ethanol typically saves 50-70 % against petrol, not 100 %.</p>", "gu": "<h4>જૈવઇંધણ શું છે</h4><p><b>જૈવઇંધણ</b> એ તાજેતરમાં જીવતા દ્રવ્યમાંથી બનેલું પ્રવાહી કે વાયુ ઇંધણ છે - છોડ, પાકનો અવશેષ, પશુનું છાણ કે શેવાળ. બળે ત્યારે છૂટતો કાર્બન છોડે ઉગતી વખતે હવામાંથી લીધેલો હોય, તેથી સિદ્ધાંતમાં ચક્ર લગભગ કાર્બન-તટસ્થ છે. વ્યવહારમાં સંતુલન પાક, ખાતર, વહન અને જમીન કે ખોરાક વિસ્થાપિત થયો કે નહીં તેના પર આધારિત છે, તેથી આ વિષય એક જ સરવાળાને બદલે <b>જીવનચક્ર</b>ની દૃષ્ટિએ ભણાવાય.</p><h4>ઇથેનોલ</h4><p><b>ઇથેનોલ</b> (C₂H₅OH) ખમીર સાથે ખાંડને આથો લાવીને અને પછી 99.5 % શુદ્ધતા સુધી નિસ્યંદન કરીને બને. શેરડીનો રસ અને ગોળ ભારતીય કાચો માલ છે; મકાઈ, ઘઉં અને ડાંગરનું પરાળ બીજે વપરાય અને દ્વિતીય પેઢીના સ્ટેશન સેલ્યુલોઝ તોડીને પાકના અવશેષ કે લાકડું વાપરે. ભારતમાં તે પેટ્રોલમાં ભળે - E10 એટલે કદ પ્રમાણે 10 % ઇથેનોલ - કારણ કે તે ઓક્ટેન વધારે અને આયાત તેલ તથા CO બંને ઘટાડે. તેની ઊર્જા પેટ્રોલના લગભગ બે તૃતીયાંશ હોય, તેથી 20 % મિશ્રણ ઇંધણનો વપરાશ લગભગ 5-7 % વધારે.</p><h4>બાયોડીઝલ અને ટ્રાન્સએસ્ટરીફિકેશન</h4><p>વનસ્પતિ તેલ ડીઝલ એન્જિનમાં સ્વચ્છ બળવા પૂરતું ગાઢ છે, તેથી તેને મિથેનોલ અને ઉત્પ્રેરક (સોડિયમ હાઇડ્રોક્સાઇડ) સાથે પ્રક્રિયા કરાવીને <b>ફેટી એસિડ મિથાઇલ એસ્ટર</b> - બાયોડીઝલ - અને ઉપપેદાશ તરીકે ગ્લિસરોલ બને. લગભગ વીસ કિલો મિથેનોલ સાથે એકસો કિલો તેલ લગભગ એકસો કિલો બાયોડીઝલ અને દસ કિલો ગ્લિસરોલ આપે. કાચા માલમાં વપરાયેલું રાંધણ તેલ, જટ્રોફા અને કરંજના બી, તાડ અને કપાસિયાનું તેલ આવે. બાયોડીઝલનો સિટેન આંકડો ઊંચો, સલ્ફર લગભગ નહીં અને લ્યુબ્રિકેશન સારું, પણ ઠંડામાં થરથરે અને થોડું મોંઘું પડે.</p><h4>ત્રણ પેઢીઓ</h4><table><tr><th>પેઢી</th><th>કાચો માલ</th><th>ઉદાહરણ</th><th>ટીકા</th></tr><tr><td>પ્રથમ</td><td>ખાદ્ય પાક</td><td>શેરડીનો ઇથેનોલ, સોયા અને તાડનું બાયોડીઝલ</td><td>ખોરાક અને જમીન સાથે સ્પર્ધા, પરોક્ષ જમીન ઉપયોગ ફેરફાર</td></tr><tr><td>દ્વિતીય</td><td>અવશેષ અને કચરો</td><td>પરાળ, શેરડીની ચીપ, વપરાયેલ રાંધણ તેલ, લાકડાની ચીપ</td><td>એકઠું કરવા અને પૂર્વ-સારવારનો ખર્ચ</td></tr><tr><td>તૃતીય</td><td>શેવાળ અને સૂક્ષ્મજીવ</td><td>શેવાળનું તેલ, બનાવેલા સાયનોબેક્ટેરિયા</td><td>હજી મોંઘું, પાણી, પ્રકાશ અને CO₂ જોઈએ</td></tr></table><h4>સામાન્ય ભૂલ</h4><p>દરેક જૈવઇંધણને કાર્બન-તટસ્થ કહેવું. પાક ઉગાડવો, ખાતર બનાવવું, ઇથેનોલનું નિસ્યંદન અને વહન બધું CO₂ છોડે; ભારતીય ગોળનો ઇથેનોલ સામાન્ય રીતે પેટ્રોલ સામે 50-70 % બચાવે, 100 % નહીં.</p>"}, "syllabus_item": "3.5"}, {"h": {"en": "3.5 Biomass forms, biogas, gasification and algae", "gu": "3.5 બાયોમાસના સ્વરૂપ, બાયોગેસ, ગેસિફિકેશન અને શેવાળ"}, "body": {"en": "<h4>Three forms of biomass</h4><table><tr><th>Form</th><th>Examples</th><th>How it is used</th></tr><tr><td>solid</td><td>firewood, bagasse, rice husk, sawdust, briquettes</td><td>direct combustion for heat and steam</td></tr><tr><td>liquid</td><td>ethanol, biodiesel, pyrolysis oil</td><td>blended into petrol and diesel, or burnt in engines</td></tr><tr><td>gaseous</td><td>biogas, producer gas, hydrogen from biomass</td><td>cooking, engine fuel, electricity</td></tr></table><h4>Biogas and the anaerobic digester</h4><p>In a sealed <b>digester</b> with no oxygen, bacteria break dung and plant waste into <b>biogas</b> - about 55-65 % methane and 30-40 % carbon dioxide, with traces of hydrogen sulphide - and a nutrient-rich <b>digestate</b> that is a better fertiliser than raw dung. A family-size plant of 2 m³ a day needs about 50 kg of dung and gives enough gas for a family of six to cook twice a day. The methane is the same gas as in natural gas, so it can run an engine or a generator; trapping it also stops a gas twenty-eight times stronger than CO₂ from escaping into the air.</p><h4>Gasification</h4><p><b>Gasification</b> is not burning. Biomass is heated to 700-900 °C with a strictly limited supply of air, so it does not flame but converts into a combustible <b>producer gas</b> of carbon monoxide, hydrogen, methane and nitrogen. That gas burns in a engine or a furnace far more cleanly than raw wood, gives a controllable flame and leaves a char that can go back to the field. The heat needed comes from partial combustion of the biomass itself.</p><h4>Algae biofuels</h4><p>Microalgae grow in ponds or tubes, use sunlight and CO₂, and can double their mass in a day; some strains store 20-50 % of their dry weight as oil. They need no farmland, can be grown on saline water beside a power plant and eat its flue gas. The catch is harvesting and dewatering, which use more energy than the oil returns, so algal fuel is still three to five times the price of diesel and is a research subject rather than a commercial one.</p><h4>Worked example</h4><p>A 25 m³ village digester fed 500 kg of dung a day at 0.04 m³ of gas per kg yields 20 m³ a day. At 6 kWh of heat per m³ that is 120 kWh, enough for about eight households, and the digestate fertilises half a hectare.</p>", "gu": "<h4>બાયોમાસનાં ત્રણ સ્વરૂપ</h4><table><tr><th>સ્વરૂપ</th><th>ઉદાહરણ</th><th>કેવી રીતે વપરાય</th></tr><tr><td>ઘન</td><td>લાકડું, ચીપ, ભૂસું, લાકડાની ધૂળ, બ્રિકેટ</td><td>ઉષ્મા અને વરાળ માટે સીધું દહન</td></tr><tr><td>પ્રવાહી</td><td>ઇથેનોલ, બાયોડીઝલ, પાયરોલિસિસ તેલ</td><td>પેટ્રોલ-ડીઝલમાં મિશ્રણ, કે એન્જિનમાં દહન</td></tr><tr><td>વાયુ</td><td>બાયોગેસ, પ્રોડ્યુસર ગેસ, બાયોમાસમાંથી હાઇડ્રોજન</td><td>રાંધણ, એન્જિન ઇંધણ, વીજળી</td></tr></table><h4>બાયોગેસ અને અવાયુજીવી પાચક</h4><p>ઓક્સિજન વગરના બંધ <b>પાચક</b>માં બેક્ટેરિયા છાણ અને છોડનો કચરો <b>બાયોગેસ</b>માં તોડે - લગભગ 55-65 % મિથેન અને 30-40 % કાર્બન ડાયોક્સાઇડ, થોડું હાઇડ્રોજન સલ્ફાઇડ સાથે - અને પોષકતત્ત્વોથી ભરપૂર <b>પાચિત ખાતર</b> આપે જે કાચા છાણ કરતાં સારું છે. દિવસે 2 m³નું કુટુંબ-કદનું સ્ટેશન લગભગ 50 કિલો છાણ માંગે અને છ વ્યક્તિના કુટુંબને દિવસમાં બે વાર રાંધવા પૂરતો ગેસ આપે. તે મિથેન કુદરતી ગેસનો જ વાયુ છે, તેથી એન્જિન કે જનરેટર ચલાવે; તેને પકડવાથી CO₂ કરતાં અઠ્ઠાવીસ ગણો શક્તિશાળી વાયુ હવામાં જતો પણ અટકે.</p><h4>ગેસિફિકેશન</h4><p><b>ગેસિફિકેશન</b> દહન નથી. બાયોમાસને ખૂબ મર્યાદિત હવા સાથે 700-900 °C સુધી ગરમ કરાય, તેથી તે જ્યોત પકડતું નથી પણ કાર્બન મોનોક્સાઇડ, હાઇડ્રોજન, મિથેન અને નાઇટ્રોજનના બળતા <b>પ્રોડ્યુસર ગેસ</b>માં ફેરવાય. તે ગેસ કાચા લાકડા કરતાં ઘણો સ્વચ્છ બળે, નિયંત્રિત જ્યોત આપે અને બળેલો કોલસો ખેતરમાં પાછો જાય. જરૂરી ઉષ્મા બાયોમાસના આંશિક દહનમાંથી આવે.</p><h4>શેવાળ જૈવઇંધણ</h4><p>સૂક્ષ્મ શેવાળ તળાવ કે નળીમાં ઊગે, સૂર્યપ્રકાશ અને CO₂ વાપરે અને એક દિવસમાં તેનું દળ બમણું કરી શકે; કેટલાક પ્રકાર સૂકા વજનના 20-50 % તેલ તરીકે સંગ્રહે. તેમને ખેતીની જમીન ન જોઈએ, ખારા પાણીમાં વીજ સ્ટેશન પાસે ઊગી તેનો ધુમાડો ખાઈ શકે. મુશ્કેલી એ છે કે વીણવું અને પાણી દૂર કરવું એ તેલ પાછું આપે તેનાથી વધુ ઊર્જા વાપરે, તેથી શેવાળનું ઇંધણ હજી ડીઝલ કરતાં ત્રણથી પાંચ ગણું મોંઘું છે અને વ્યાવસાયિક નહીં, સંશોધનનો વિષય છે.</p><h4>ઉકેલાયેલ દાખલો</h4><p>દિવસે 500 કિલો છાણ ખાતર 25 m³નું ગામનું પાચક, પ્રતિ કિલો 0.04 m³ ગેસ પ્રમાણે દિવસે 20 m³ આપે. પ્રતિ m³ 6 kWh ઉષ્મા પ્રમાણે તે 120 kWh, લગભગ આઠ ઘર માટે પૂરતું, અને પાચિત ખાતર અડધો હેક્ટર ખેતરને ફળદ્રૂપ કરે.</p>"}, "diagram": "u3_bio", "syllabus_item": "3.5"}]}, {"title": {"en": "5. New Energy Sources", "gu": "5. નવા ઊર્જા સ્રોત"}, "items": [{"h": {"en": "3.6 Geothermal energy", "gu": "3.6 ભૂતાપીય ઊર્જા"}, "body": {"en": "<h4>Where the heat comes from</h4><p>The earth's core is about 5,000 °C and heat flows outward continuously from the decay of radioactive isotopes and from the original formation of the planet. The average gradient is 25-30 °C per kilometre, so a 3 km well reaches 80-100 °C even away from volcanoes. Where the crust is thin - faults, hot springs, volcanic belts - the heat is concentrated enough to make steam or hot water at the surface. Unlike solar and wind, a geothermal plant runs day and night, which gives it a capacity factor of 70-90 %.</p><h4>Three ways to use it</h4><table><tr><th>Plant</th><th>How it works</th><th>Best for</th></tr><tr><td>dry steam</td><td>steam straight from the well spins the turbine</td><td>very hot fields, above 240 °C</td></tr><tr><td>flash steam</td><td>hot water at 180-240 °C is allowed to boil in a low-pressure tank</td><td>most fields</td></tr><tr><td>binary cycle</td><td>brine at 100-180 °C heats a second fluid with a low boiling point, which spins the turbine</td><td>medium heat, no emissions to air</td></tr></table><h4>Uses beyond electricity</h4><ul><li>direct heating of buildings and greenhouses through district heating networks</li><li><b>ground source heat pumps</b>: a shallow loop at 15-20 °C heats a building with a coefficient of performance of 3-4, so 1 kWh of electricity moves 3-4 kWh of heat</li><li>hot water for fish farming, drying and industrial processes</li><li>India's potential is modest but real in the Puga valley of Ladakh and parts of the Deccan, and is used mainly for heating</li></ul><h4>Problems</h4><p>Drilling is expensive and a dry well loses the whole investment; the brine carries hydrogen sulphide and dissolved salts that corrode pipes; and over-extraction can cool the field or cause subsidence, so the spent brine is injected back. In some fields the extracted water brings up naturally occurring arsenic or boron.</p>", "gu": "<h4>ઉષ્મા ક્યાંથી આવે</h4><p>પૃથ્વીનો ગર્ભ લગભગ 5,000 °C છે અને કિરણોત્સર્ગી સમસ્થાનિકોના ક્ષય તથા ગ્રહની રચના વખતની ઉષ્મામાંથી સતત બહાર વહે છે. સરેરાશ ઢાળ પ્રતિ કિલોમીટર 25-30 °C છે, તેથી જ્વાળામુખીથી દૂર પણ 3 કિમીની કૂવો 80-100 °C પામે. જ્યાં પોપડો પાતળો હોય - ભ્રંશ, ગરમ ઝરણાં, જ્વાળામુખી પટ્ટા - ત્યાં ઉષ્મા એટલી કેન્દ્રિત થાય કે સપાટી પર વરાળ કે ગરમ પાણી મળે. સૌર અને પવનથી વિપરીત ભૂતાપીય સ્ટેશન દિવસ-રાત ચાલે, તેથી તેનો ક્ષમતા અવયવ 70-90 % થાય.</p><h4>વાપરવાની ત્રણ રીત</h4><table><tr><th>સ્ટેશન</th><th>કેવી રીતે ચાલે</th><th>કોના માટે શ્રેષ્ઠ</th></tr><tr><td>સૂકી વરાળ</td><td>કૂવાની વરાળ સીધી ટર્બાઇન ફેરવે</td><td>ખૂબ ગરમ ક્ષેત્ર, 240 °Cથી ઉપર</td></tr><tr><td>ફ્લેશ વરાળ</td><td>180-240 °Cનું ગરમ પાણી નીચા દબાણની ટાંકીમાં ઉકળવા દેવાય</td><td>મોટા ભાગનાં ક્ષેત્ર</td></tr><tr><td>દ્વિચક્ર</td><td>100-180 °Cનું ખારું પાણી નીચા ઉકળાંકવાળો બીજો પ્રવાહી ગરમ કરે, જે ટર્બાઇન ફેરવે</td><td>મધ્યમ ઉષ્મા, હવામાં ઉત્સર્જન નહીં</td></tr></table><h4>વીજળી ઉપરાંતના ઉપયોગ</h4><ul><li>જિલ્લા ગરમી નેટવર્ક દ્વારા ઇમારત અને કાચઘરની સીધી ગરમી</li><li><b>જમીન સ્રોત ઉષ્મા પંપ</b>: 15-20 °Cનો છીછરો લૂપ 3-4ના કાર્યદક્ષતા ગુણોત્તરે ઇમારત ગરમ કરે, તેથી 1 kWh વીજળી 3-4 kWh ઉષ્મા ખસેડે</li><li>માછલી ઉછેર, સૂકવણી અને ઉદ્યોગની પ્રક્રિયા માટે ગરમ પાણી</li><li>ભારતની ક્ષમતા મર્યાદિત પણ લદ્દાખના પુગા ખીણ અને દક્કનના કેટલાક ભાગમાં વાસ્તવિક છે અને મુખ્યત્વે ગરમી માટે વપરાય</li></ul><h4>સમસ્યાઓ</h4><p>ડ્રિલિંગ મોંઘું છે અને સૂકો કૂવો આખું રોકાણ ગુમાવે; ખારા પાણીમાં હાઇડ્રોજન સલ્ફાઇડ અને ઓગળેલા ક્ષાર પાઇપમાં કાટ લગાડે; અને વધુ પડતું નિષ્કર્ષણ ક્ષેત્ર ઠંડું કરે કે જમીન ધસી જાય, તેથી વપરાયેલું ખારું પાણી પાછું દબાવાય. કેટલાંક ક્ષેત્રોમાં કાઢેલા પાણી સાથે કુદરતી આર્સેનિક કે બોરોન પણ આવે.</p>"}, "diagram": "u3_new", "syllabus_item": "3.6"}, {"h": {"en": "3.6 Ocean energy: tidal, wave and thermal", "gu": "3.6 મહાસાગર ઊર્જા: ભરતી, તરંગ અને ઉષ્મા"}, "body": {"en": "<h4>Three different resources</h4><p>The ocean holds energy in three forms that must not be confused. <b>Tides</b> are the slow rise and fall caused by the gravity of the moon and the sun, so tidal power is as predictable as the calendar. <b>Waves</b> are wind-driven surface motion, strongest in stormy high latitudes. <b>Ocean thermal energy</b> is the temperature difference between warm surface water and cold deep water in the tropics, which can run a heat engine day and night.</p><h4>Tidal energy conversion</h4><p>The classic scheme is a <b>barrage</b>: a dam across an estuary with sluice gates and turbines. Water fills the basin through the gates at high tide, and when the sea falls it is released through the turbines. The energy in one filling is proportional to the basin area and to the <b>square</b> of the tidal range, so doubling the range quadruples the energy; a site needs at least 5 m of range to be worth building. Modern alternatives are <b>tidal stream</b> turbines, which look like wind turbines under water and need no dam, and <b>tidal lagoons</b> with a closed wall.</p><h4>Wave and OTEC</h4><p><b>Wave energy</b> converters are of three kinds: an <b>oscillating water column</b>, where the wave compresses air that drives a Wells turbine; a <b>point absorber</b>, a floating buoy that pumps hydraulic fluid; and an <b>overtopping device</b> that fills a reservoir above sea level. <b>OTEC</b> needs a 20 °C difference, found where surface water is at 25-28 °C and water 1,000 m down is at 4 °C; a closed cycle evaporates ammonia, spins a turbine on the vapour and condenses it in cold deep water. It yields electricity, fresh water and cold water for air conditioning at the same time.</p><h4>Why it is small so far</h4><p>Sea water is corrosive, storm waves destroy structures, the best sites are far from the grid, and every device must be built to survive a fifty-year storm. Tidal range is limited to a few estuaries and barrages alter the ecosystem of the very estuary they use. India's identified potential is about 8,000 MW of tidal and much more of wave and thermal, but only small demonstration units exist in the Gulf of Kutch and the Gulf of Khambhat.</p>", "gu": "<h4>ત્રણ જુદાં સંસાધન</h4><p>મહાસાગરમાં ઊર્જા ત્રણ સ્વરૂપે છે જે ભેગાં ન કરવાં. <b>ભરતી</b> ચંદ્ર અને સૂર્યના ગુરુત્વાકર્ષણથી ધીમે ચઢ-ઊતર છે, તેથી ભરતી ઊર્જા કેલેન્ડર જેટલી અનુમાનિત છે. <b>તરંગો</b> પવનથી ચાલતી સપાટીની હિલચાલ છે, જે તોફાની ઊંચા અક્ષાંશોમાં સૌથી તાકાતવાન હોય. <b>મહાસાગર ઉષ્મા ઊર્જા</b> ઉષ્ણકટિબંધમાં ગરમ સપાટીના પાણી અને ઠંડા ઊંડા પાણી વચ્ચેનો તાપમાન તફાવત છે, જે દિવસ-રાત ઉષ્મા એન્જિન ચલાવી શકે.</p><h4>ભરતી ઊર્જા રૂપાંતરણ</h4><p>પરંપરાગત રચના <b>બેરેજ</b> છે: જળમાર્ગ પર દરવાજા અને ટર્બાઇન સાથેનો બંધ. ઊંચી ભરતી વખતે પાણી દરવાજામાંથી તળાવ ભરે અને દરિયો ઊતરે ત્યારે ટર્બાઇનમાંથી છોડાય. એક ભરણની ઊર્જા તળાવના વિસ્તારના પ્રમાણમાં અને ભરતીના ઊંચાઈ તફાવતના <b>વર્ગ</b> પ્રમાણમાં હોય, તેથી તફાવત બમણો થાય તો ઊર્જા ચાર ગણી; બાંધવા લાયક સ્થળે ઓછામાં ઓછો 5 m તફાવત જોઈએ. હવેની રીતો <b>ભરતી પ્રવાહ</b> ટર્બાઇન છે, જે પાણી નીચે પવન ટર્બાઇન જેવા દેખાય અને બંધ માંગતા નથી, તથા બંધ દીવાલવાળા <b>ભરતી તળાવો</b>.</p><h4>તરંગ અને OTEC</h4><p><b>તરંગ ઊર્જા</b> રૂપાંતરક ત્રણ પ્રકારના હોય: <b>ડોલતો પાણી સ્તંભ</b>, જ્યાં તરંગ હવા દબાવે અને તે વેલ્સ ટર્બાઇન ચલાવે; <b>બિંદુ શોષક</b>, તરતો બોયો જે હાઇડ્રોલિક પ્રવાહી દબાવે; અને <b>ઓવરટોપિંગ</b> સાધન જે સમુદ્ર સપાટીથી ઊંચી ટાંકી ભરે. <b>OTEC</b>ને 20 °C તફાવત જોઈએ, જે ત્યાં મળે જ્યાં સપાટીનું પાણી 25-28 °C અને 1,000 m નીચેનું 4 °C હોય; બંધ ચક્રમાં એમોનિયા બાષ્પિત થાય, વરાળ ટર્બાઇન ફેરવે અને ઠંડા ઊંડા પાણીમાં ઘનીભવે. તે સાથે વીજળી, મીઠું પાણી અને વાતાનુકૂલન માટે ઠંડું પાણી આપે.</p><h4>હજી નાનું કેમ</h4><p>દરિયાનું પાણી કાટ લગાડે, તોફાની તરંગો રચનાઓ તોડે, શ્રેષ્ઠ સ્થળો ગ્રિડથી દૂર છે અને દરેક સાધન પચાસ વર્ષના તોફાન સામે ટકે તેમ બાંધવું પડે. ભરતીનો તફાવત થોડાક જ જળમાર્ગો પૂરતો છે અને બેરેજ જે જળમાર્ગ વાપરે તેની પારિસ્થિતિકી બદલી નાખે. ભારતની ઓળખાયેલી ક્ષમતા લગભગ 8,000 MW ભરતીની અને તરંગ તથા ઉષ્માની વધુ છે, પણ કચ્છના અખાત અને ખંભાતના અખાતમાં ફક્ત નાના પ્રદર્શન એકમ છે.</p>"}, "syllabus_item": "3.6"}, {"h": {"en": "3.6 Hydrogen energy", "gu": "3.6 હાઇડ્રોજન ઊર્જા"}, "body": {"en": "<h4>An energy carrier, not a source</h4><p>Hydrogen does not exist free in nature; it must be made, so it stores and carries energy rather than producing it. That is why it is called an <b>energy carrier</b>. One kilogram carries 33.3 kWh of heat, about three times petrol by mass, and burning it gives only water vapour. It is stored as a compressed gas at 350-700 bar, as a liquid at −253 °C, or inside metal hydrides and liquid organic carriers.</p><h4>The colour code</h4><table><tr><th>Name</th><th>Made from</th><th>CO₂</th></tr><tr><td>grey</td><td>steam reforming of natural gas</td><td>about 10 kg per kg of H₂</td></tr><tr><td>blue</td><td>the same, with carbon capture and storage</td><td>1-2 kg, not zero</td></tr><tr><td>green</td><td>electrolysis of water using renewable electricity</td><td>almost none</td></tr><tr><td>turquoise</td><td>methane pyrolysis, solid carbon as the by-product</td><td>none, carbon is captured solid</td></tr></table><h4>Electrolysis and the fuel cell</h4><p>An <b>electrolyser</b> passes a direct current through water between two electrodes and splits it into hydrogen at the cathode and oxygen at the anode; alkaline, PEM and solid oxide are the three technologies. Modern stacks need 50-55 kWh of electricity per kilogram of hydrogen, which is about 70-75 % efficiency on the higher heating value. A <b>fuel cell</b> reverses the process: hydrogen enters the anode, is split into protons and electrons, the protons cross a membrane and the electrons drive the load, and the only exhaust is water. A PEM fuel cell reaches 50-60 % efficiency, and 80 % if the waste heat is used.</p><h4>Where it will be used first</h4><ul><li>steel and fertiliser plants that today use grey hydrogen from gas</li><li>long-distance trucks, buses and trains where batteries are too heavy</li><li>seasonal storage: hydrogen made in summer sunshine and burnt in winter</li><li>shipping and aviation through ammonia and synthetic fuels</li></ul><h4>The honest limits</h4><p>Round-trip efficiency is poor: 50 kWh of green electricity becomes 1 kg of hydrogen carrying 33 kWh, and a fuel cell gives back only about 17 kWh at the wheels, against 45 kWh for a battery. Hydrogen also leaks easily, embrittles steel and is explosive between 4 and 75 % in air. It makes sense where direct electrification is impossible, not as a general replacement for the grid.</p>", "gu": "<h4>ઊર્જા વાહક, સ્રોત નહીં</h4><p>હાઇડ્રોજન કુદરતમાં મુક્ત મળતું નથી; તેને બનાવવું પડે, તેથી તે ઊર્જા બનાવવાને બદલે સંગ્રહે અને વહન કરે. તેથી તેને <b>ઊર્જા વાહક</b> કહે છે. એક કિલોગ્રામ 33.3 kWh ઉષ્મા ધરે, દળ પ્રમાણે પેટ્રોલ કરતાં લગભગ ત્રણ ગણું, અને બળે ત્યારે ફક્ત પાણીની વરાળ આપે. તે 350-700 bar પર દબાયેલા વાયુ તરીકે, −253 °C પર પ્રવાહી તરીકે, કે ધાતુ હાઇડ્રાઇડ અને પ્રવાહી કાર્બનિક વાહકમાં સંગ્રહાય.</p><h4>રંગ સંકેત</h4><table><tr><th>નામ</th><th>કઈ રીતે બને</th><th>CO₂</th></tr><tr><td>ભૂખરું</td><td>કુદરતી ગેસનું વરાળ સુધારણ</td><td>પ્રતિ કિલો H₂ લગભગ 10 કિલો</td></tr><tr><td>વાદળી</td><td>તે જ, કાર્બન પકડ અને સંગ્રહ સાથે</td><td>1-2 કિલો, શૂન્ય નહીં</td></tr><tr><td>લીલું</td><td>પુનઃપ્રાપ્ય વીજળીથી પાણીનું વિદ્યુતવિભાજન</td><td>લગભગ નહીં</td></tr><tr><td>ફિરોઝી</td><td>મિથેન પાયરોલિસિસ, ઉપપેદાશ ઘન કાર્બન</td><td>નહીં, કાર્બન ઘન સ્વરૂપે પકડાય</td></tr></table><h4>વિદ્યુતવિભાજન અને ઇંધણ કોષ</h4><p><b>વિદ્યુતવિભાજક</b> બે ઇલેક્ટ્રોડ વચ્ચે પાણીમાં એકમાર્ગી પ્રવાહ પસાર કરીને કેથોડ પર હાઇડ્રોજન અને એનોડ પર ઓક્સિજન અલગ કરે; આલ્કલાઇન, PEM અને ઘન ઓક્સાઇડ ત્રણ ટેક્નોલોજી છે. આધુનિક સ્ટેકને પ્રતિ કિલો હાઇડ્રોજન 50-55 kWh વીજળી જોઈએ, જે ઊંચા ઉષ્મા મૂલ્ય પર લગભગ 70-75 % કાર્યક્ષમતા છે. <b>ઇંધણ કોષ</b> પ્રક્રિયા ઊલટાવે: હાઇડ્રોજન એનોડમાં આવે, પ્રોટોન અને ઇલેક્ટ્રોનમાં વિભાજે, પ્રોટોન પડદો ઓળંગે અને ઇલેક્ટ્રોન ભાર ચલાવે, અને એકમાત્ર નિકાસ પાણી છે. PEM ઇંધણ કોષ 50-60 % કાર્યક્ષમતા પામે, અને કચરાની ઉષ્મા વાપરો તો 80 %.</p><h4>પહેલાં ક્યાં વપરાશે</h4><ul><li>પોલાદ અને ખાતર કારખાનાં જે આજે ગેસમાંથી ભૂખરું હાઇડ્રોજન વાપરે</li><li>લાંબા અંતરના ટ્રક, બસ અને ટ્રેન જ્યાં બેટરી ખૂબ ભારે પડે</li><li>મોસમી સંગ્રહ: ઉનાળાના તડકામાં બનેલું હાઇડ્રોજન શિયાળામાં બળે</li><li>એમોનિયા અને કૃત્રિમ ઇંધણ દ્વારા જહાજવાહન અને વિમાનવાહન</li></ul><h4>પ્રામાણિક મર્યાદા</h4><p>આવ-જાવ કાર્યક્ષમતા નબળી છે: 50 kWh લીલી વીજળી 33 kWh ધરતું 1 કિલો હાઇડ્રોજન બને અને ઇંધણ કોષ પૈડાં પર ફક્ત લગભગ 17 kWh પાછું આપે, જ્યારે બેટરી 45 kWh આપે. હાઇડ્રોજન સહેલાઈથી લીક થાય, પોલાદને ભુરભુરું કરે અને હવામાં 4-75 % વચ્ચે વિસ્ફોટક છે. જ્યાં સીધું વીજીકરણ અશક્ય હોય ત્યાં તે અર્થપૂર્ણ છે, ગ્રિડના સામાન્ય વિકલ્પ તરીકે નહીં.</p>"}, "syllabus_item": "3.6"}]}, {"title": {"en": "5. Practice Questions with Model Answers", "gu": "5. સરાવ પ્રશ્નો અને આદર્શ જવાબો"}, "items": [{"h": {"en": "Practice 1. Explain, with figures, how a renewable source reduces the carbon footprint of a campus.", "gu": "સરાવ 1. આંકડા સાથે સમજાવો કે પુનઃપ્રાપ્ય સ્રોત કેમ્પસનું કાર્બન ફૂટપ્રિન્ટ કેવી રીતે ઘટાડે."}, "body": {"en": "<p>Start from the campus electricity bill. Suppose the college uses 4,00,000 kWh a year and the grid factor is 0.71 kg CO₂ per kWh, so the annual emission is 400 × 0.71 = 284 t CO₂. A 200 kWp rooftop plant with 4.6 peak sun hours and a performance ratio of 0.80 makes 200 × 4.6 × 0.80 = 736 kWh a day, about 2,69,000 kWh a year, which is 67 % of the demand.</p><p>The saving is 269 × 0.71 = 191 t CO₂ a year, so the footprint falls from 284 t to 93 t, a cut of 67 %. The plant itself costs about 600 kWh per square metre of module and 1,300 m² of module makes 600 × 1,300 = 7,80,000 kWh of embodied energy, which the array returns in about 2.9 years.</p><p>Add the indirect gains: no SO₂, NOx or fly ash at the point of use, a shaded roof that cuts air-conditioning load by 2-3 °C, and a visible meter that teaches the students. State the limits honestly - the plant gives nothing after sunset, so about a third of the night load still comes from the grid or from a battery.</p>", "gu": "<p>કેમ્પસના વીજળી બિલથી શરૂ કરો. ધારો કે કોલેજ વર્ષે 4,00,000 kWh વાપરે અને ગ્રિડ અવયવ પ્રતિ kWh 0.71 કિલો CO₂ છે, તેથી વાર્ષિક ઉત્સર્જન 400 × 0.71 = 284 t CO₂. 4.6 પીક સન અવર્સ અને 0.80 કાર્યદક્ષતા ગુણોત્તરવાળું 200 kWp છત સ્ટેશન દિવસે 200 × 4.6 × 0.80 = 736 kWh, વર્ષે લગભગ 2,69,000 kWh બનાવે, જે માંગના 67 % છે.</p><p>બચત 269 × 0.71 = 191 t CO₂ વર્ષે, તેથી ફૂટપ્રિન્ટ 284 t થી 93 t થાય, એટલે 67 % ઘટે. સ્ટેશન પોતે પ્રતિ ચોરસ મીટર મોડ્યુલ લગભગ 600 kWh વાપરે અને 1,300 m² મોડ્યુલ 600 × 1,300 = 7,80,000 kWh સન્નિહિત ઊર્જા બનાવે, જે એરે લગભગ 2.9 વર્ષમાં પાછી મેળવે.</p><p>પરોક્ષ લાભ ઉમેરો: વપરાશના સ્થળે SO₂, NOx કે ફ્લાય એશ નહીં, છાયાવાળી છત જે એરકન્ડીશનિંગનો ભાર 2-3 °C ઘટાડે, અને વિદ્યાર્થીઓને શીખવતું દેખાતું મીટર. મર્યાદા પ્રામાણિકપણે જણાવો - સૂર્યાસ્ત પછી સ્ટેશન કંઈ ન આપે, તેથી રાત્રિના ભારનો લગભગ ત્રીજો ભાગ હજી ગ્રિડ કે બેટરીમાંથી આવે.</p>"}}, {"h": {"en": "Practice 2. Compare renewable and non-renewable energy sources on at least six points and conclude.", "gu": "સરાવ 2. ઓછામાં ઓછા છ મુદ્દા પર પુનઃપ્રાપ્ય અને બિન-પુનઃપ્રાપ્ય ઊર્જા સ્રોતોની સરખામણી કરી નિષ્કર્ષ આપો."}, "body": {"en": "<p>Availability: a renewable flow is refilled by nature and never exhausted, while a fossil stock is finite and India imports over 80 % of its crude oil. Running cost: a renewable plant has no fuel bill, whereas fuel is 60-80 % of the cost of a coal unit and is exposed to every price shock. Capital cost: solar and wind need almost all the money upfront, which is why financing cost decides the tariff.</p><p>Output: renewables are variable, with capacity factors of 15-35 %, while coal gives a firm 55-70 % and can be dispatched on demand. Land: solar needs about 4 acres per MW and wind more, while a coal plant is compact but its mines and ash ponds spread across districts. Emissions: renewables emit nothing at the plant and 40-50 g CO₂ per kWh over the whole life, against 800-1,000 for coal.</p><p>Waste and social cost: coal leaves ash ponds that fail in monsoon, mine spoil and mercury, while renewables leave modules and blades to be recycled after 25 years and take far less water. Conclusion: no single plant is best at everything, so the honest comparison is the levellised cost of firm energy and the life-cycle emission. On both, Indian solar and wind now beat new coal, which is why the plan is a mix - renewables for energy, storage and gas for the evening peak, and coal retired gradually rather than switched off overnight.</p>", "gu": "<p>ઉપલબ્ધતા: પુનઃપ્રાપ્ય પ્રવાહ કુદરત ભરે અને કદી ખતમ ન થાય, જ્યારે અશ્મી સંગ્રહ મર્યાદિત છે અને ભારત તેના કાચા તેલના 80 %થી વધુ આયાત કરે. ચાલુ ખર્ચ: પુનઃપ્રાપ્ય સ્ટેશનમાં ઇંધણનું બિલ નહીં, જ્યારે કોલસા એકમના ખર્ચના 60-80 % ઇંધણ છે અને તે દરેક ભાવવધારાનો ભોગ બને. મૂડી ખર્ચ: સૌર અને પવનને લગભગ આખો પૈસો શરૂઆતમાં જોઈએ, તેથી ધિરાણ ખર્ચ ટેરિફ નક્કી કરે.</p><p>ઉત્પાદન: પુનઃપ્રાપ્ય બદલાતાં હોય, ક્ષમતા અવયવ 15-35 %, જ્યારે કોલસો નિશ્ચિત 55-70 % આપે અને માંગ પ્રમાણે આપી શકાય. જમીન: સૌરને પ્રતિ MW લગભગ 4 એકર અને પવનને વધુ જોઈએ, જ્યારે કોલસા સ્ટેશન સંકુચિત છે પણ તેની ખાણ અને રાખના તળાવ જિલ્લાઓમાં ફેલાય. ઉત્સર્જન: પુનઃપ્રાપ્ય સ્ટેશન પર કંઈ છોડતું નથી અને આખા જીવનમાં પ્રતિ kWh 40-50 g CO₂, કોલસાના 800-1,000 સામે.</p><p>કચરો અને સામાજિક ખર્ચ: કોલસો ચોમાસામાં તૂટતાં રાખના તળાવ, ખાણનો કચરો અને પારો છોડે, જ્યારે પુનઃપ્રાપ્ય 25 વર્ષ પછી મોડ્યુલ અને બ્લેડ રિસાયકલ કરવાનાં છોડે અને ઘણું ઓછું પાણી વાપરે. નિષ્કર્ષ: કોઈ એક સ્ટેશન દરેક બાબતમાં શ્રેષ્ઠ નથી, તેથી પ્રામાણિક સરખામણી નિશ્ચિત ઊર્જાના સમતુલિત ખર્ચ અને જીવનચક્ર ઉત્સર્જનની છે. બંનેમાં ભારતીય સૌર અને પવન હવે નવા કોલસાને હરાવે, તેથી યોજના મિશ્રણની છે - ઊર્જા માટે પુનઃપ્રાપ્ય, સાંજના ભાર માટે સંગ્રહ અને ગેસ, અને કોલસો ધીમે ધીમે નિવૃત્ત, રાતોરાત બંધ નહીં.</p>"}}, {"h": {"en": "Practice 3. Describe a solar PV cell with a sketch and explain how a module, a string and an array differ.", "gu": "સરાવ 3. સૌર PV સેલનું રેખાચિત્ર સાથે વર્ણન કરો અને મોડ્યુલ, શ્રેણી તથા એરે કેવી રીતે જુદા પડે તે સમજાવો."}, "body": {"en": "<p>A cell is five layers: a tempered glass cover, an anti-reflective coating, an n-type silicon layer, a p-type silicon layer and a back contact, with a metal grid on the front. The junction between n and p creates a depletion region with a built-in field. Light passing through the glass frees electron-hole pairs in the silicon within a diffusion length of the junction; the field sweeps electrons to the n side and holes to the p side, so the front grid becomes negative and the back contact positive.</p><p>A module seals 60 or 72 such cells in series under glass and laminate, so the voltages add: 72 × 0.62 ≈ 45 V, and a 445 Wp module delivers about 10 A at that voltage. A string joins modules in series to build the DC voltage the inverter wants, say 20 modules at 45 V = 900 V with the same 10 A. An array is the whole set of strings in parallel on one inverter: four strings give 40 A at 900 V, about 36 kW, so power adds in parallel while voltage stays fixed.</p><p>The engineering point is matching: the string Voc at the coldest morning must stay below the inverter maximum, the string Vmp must stay inside the MPPT window on a hot afternoon, and parallel strings must have the same module count, otherwise the weaker string drags the current down.</p>", "gu": "<p>સેલમાં પાંચ સ્તર છે: ટેમ્પર્ડ કાચનું આવરણ, પ્રતિબિંબરોધી પડ, n-પ્રકારનું સિલિકોન સ્તર, p-પ્રકારનું સિલિકોન સ્તર અને પાછળનો સંપર્ક, જેની ઉપર ધાતુની જાળી હોય. n અને p વચ્ચેની સંધિ આંતરિક ક્ષેત્રવાળો ક્ષય વિસ્તાર બનાવે. કાચમાંથી પસાર થતો પ્રકાશ સંધિથી પ્રસરણ લંબાઈમાં સિલિકોનમાં ઇલેક્ટ્રોન-કાણાંની જોડી મુક્ત કરે; ક્ષેત્ર ઇલેક્ટ્રોનને n બાજુ અને કાણાંને p બાજુ ધકેલે, તેથી આગળની જાળી ઋણ અને પાછળનો સંપર્ક ધન બને.</p><p>મોડ્યુલ આવા 60 કે 72 સેલને કાચ અને લેમિનેટ નીચે શ્રેણીમાં સીલ કરે, તેથી વોલ્ટેજ ઉમેરાય: 72 × 0.62 ≈ 45 V, અને 445 Wp મોડ્યુલ તે વોલ્ટેજ પર લગભગ 10 A આપે. શ્રેણી મોડ્યુલને શ્રેણીમાં જોડી ઇન્વર્ટરને જોઈતું DC વોલ્ટેજ બનાવે, જેમ કે 20 મોડ્યુલ 45 V પર = 900 V, પ્રવાહ તે જ 10 A. એરે એ એક ઇન્વર્ટર પર સમાંતર જોડાયેલી આખી શ્રેણીઓ છે: ચાર શ્રેણી 900 V પર 40 A આપે, લગભગ 36 kW, તેથી સમાંતરમાં શક્તિ ઉમેરાય જ્યારે વોલ્ટેજ અચળ રહે.</p><p>એન્જિનિયરિંગ મુદ્દો મેળ બેસાડવાનો છે: સૌથી ઠંડી સવારે શ્રેણીની Voc ઇન્વર્ટરની મહત્તમ મર્યાદાથી નીચે રહેવી જોઈએ, ગરમ બપોરે શ્રેણીની Vmp MPPT વિસ્તારમાં રહેવી જોઈએ, અને સમાંતર શ્રેણીઓમાં મોડ્યુલની સંખ્યા સરખી હોવી જોઈએ, નહીં તો નબળી શ્રેણી પ્રવાહ નીચે ખેંચે.</p>"}}, {"h": {"en": "Practice 4. What are the main types of solar cells? Give efficiency and one use of each.", "gu": "સરાવ 4. સૌર સેલના મુખ્ય પ્રકાર કયા છે? દરેકની કાર્યક્ષમતા અને એક ઉપયોગ આપો."}, "body": {"en": "<p>Monocrystalline silicon: 20-23 %, made from a single crystal ingot, black and uniform; used on city rooftops where roof area is limited. Polycrystalline silicon: 15-18 %, cast from molten silicon with visible grain; used in large ground plants where land is cheap and budget matters. Both dominate the market because they are stable for 25 years.</p><p>Thin film: cadmium telluride at 16-19 %, CIGS at 17-20 % and amorphous silicon at 6-9 %. They use a micrometre of material, perform better in weak light and high temperature, and are used on very large plants, curved roofs, facades and solar pumps. Emerging cells: perovskite and tandem reach 25-33 % in the laboratory but still fail in humidity and ultraviolet light; they are being tested in pilot modules. The choice depends on area, climate and budget, not on efficiency alone.</p>", "gu": "<p>મોનોક્રિસ્ટાલાઇન સિલિકોન: 20-23 %, એક જ સ્ફટિકના ગઠ્ઠામાંથી બને, કાળું અને સરખું; શહેરની છત પર વપરાય જ્યાં છતની જગ્યા મર્યાદિત છે. પોલીક્રિસ્ટાલાઇન સિલિકોન: 15-18 %, ઓગળેલા સિલિકોનમાંથી ઢાળેલું, દેખાતા દાણા સાથે; મોટા જમીન સ્ટેશનમાં વપરાય જ્યાં જમીન સસ્તી છે અને બજેટ મહત્ત્વનું છે. બંને બજાર પર રાજ કરે કારણ કે 25 વર્ષ ટકે છે.</p><p>પાતળી ફિલ્મ: કેડમિયમ ટેલ્યુરાઇડ 16-19 %, CIGS 17-20 % અને એમોર્ફસ સિલિકોન 6-9 %. તે માઇક્રોમીટર જેટલો પદાર્થ વાપરે, નબળા પ્રકાશ અને ઊંચા તાપમાનમાં સારું કામ કરે, અને ખૂબ મોટા સ્ટેશન, વળેલી છત, મોભ અને સૌર પંપ પર વપરાય. ઉભરતા સેલ: પેરોવસ્કાઇટ અને ટેન્ડમ પ્રયોગશાળામાં 25-33 % પામે પણ ભેજ અને પારજાંબલી પ્રકાશમાં હજી નિષ્ફળ જાય; તે પ્રાયોગિક મોડ્યુલમાં પરીક્ષણ પામે છે. પસંદગી જગ્યા, હવામાન અને બજેટ પર આધારિત છે, ફક્ત કાર્યક્ષમતા પર નહીં.</p>"}}, {"h": {"en": "Practice 5. Compare HAWT and VAWT with a neat sketch and state where each is used.", "gu": "સરાવ 5. સ્વચ્છ રેખાચિત્ર સાથે HAWT અને VAWTની સરખામણી કરો અને દરેક ક્યાં વપરાય તે જણાવો."}, "body": {"en": "<p>A HAWT has its rotor shaft horizontal and facing the wind, with two or three long aerofoil blades sweeping a vertical disc. It needs a yaw drive to follow the wind direction, a tower 120 m tall and a heavy foundation, but it reaches a Cp of 0.45-0.50 and is the only design used for utility wind farms on land and offshore, where units of 5-15 MW are normal.</p><p>A VAWT has a vertical shaft with curved or straight blades - Savonius drag type, Darrieus lift type or H-rotor - and accepts wind from any direction without yaw. The generator sits at the ground, the tower sees less bending, it is quiet and safer for birds, but the blades pass through their own wake and Cp falls to 0.15-0.35, so units are small, 1-100 kW.</p><p>So the choice is a compromise between efficiency and convenience: for energy at scale take a HAWT, for a rooftop, a street lamp, a remote water pump or a place where wind shifts constantly take a VAWT. The bladeless vortex machine is a third option, extremely quiet and simple but at only a few per cent efficiency, useful for small sensors rather than for power supply.</p>", "gu": "<p>HAWTની રોટર ધરી આડી અને પવન તરફ હોય છે, બે કે ત્રણ લાંબા પાંખ જેવા બ્લેડ ઊભું વર્તુળ ઘેરે છે. પવનની દિશા પકડવા યો ડ્રાઇવ, 120 m ઊંચો ટાવર અને ભારે પાયો જોઈએ, પણ તે Cp 0.45-0.50 પામે અને જમીન પર તથા દરિયામાં ઉપયોગિતા પવન ફાર્મ માટે એકમાત્ર રચના છે, જ્યાં 5-15 MW એકમ સામાન્ય છે.</p><p>VAWTની ધરી ઊભી અને બ્લેડ વળેલા કે સીધા - સેવોનિયસ ડ્રેગ પ્રકાર, ડેરિયસ લિફ્ટ પ્રકાર કે H-રોટર - હોય છે અને ગમે તે દિશાનો પવન યો વગર સ્વીકારે. જનરેટર જમીન પર બેસે, ટાવર પર વળાંકનો ભાર ઓછો, તે શાંત અને પક્ષીઓ માટે સુરક્ષિત છે, પણ બ્લેડ પોતાના વેકમાંથી પસાર થાય તેથી Cp 0.15-0.35 થાય, એટલે એકમ નાના, 1-100 kW.</p><p>તેથી પસંદગી કાર્યક્ષમતા અને સુવિધા વચ્ચેનો સમજૂતી છે: મોટા પ્રમાણમાં ઊર્જા માટે HAWT લો, છત, શેરી દીવો, દૂરનો પાણી પંપ કે સતત બદલાતો પવન હોય ત્યાં VAWT લો. બ્લેડ વગરનું વમળ મશીન ત્રીજો વિકલ્પ છે, અત્યંત શાંત અને સાદું પણ ફક્ત થોડા ટકા કાર્યક્ષમતા સાથે, નાના સેન્સર માટે ઉપયોગી, વીજ પુરવઠા માટે નહીં.</p>"}}, {"h": {"en": "Practice 6. Describe the parts and operation of a horizontal-axis wind turbine.", "gu": "સરાવ 6. આડી અક્ષની પવન ટર્બાઇનના ભાગો અને કાર્યપદ્ધતિનું વર્ણન કરો."}, "body": {"en": "<p>The rotor is three blades bolted to a hub. Wind flowing over the aerofoil creates lift, just as on an aircraft wing, and the lift component in the plane of rotation produces torque, so the rotor turns at 10-20 rpm. Blade pitch motors can twist each blade about its axis: at low wind they set the best angle for maximum lift, and above the rated wind speed they feather the blade to spill the extra power and protect the gearbox.</p><p>Behind the hub, the low-speed shaft enters the nacelle through the main bearing and turns the gearbox, which raises the speed to about 1,500 rpm for the generator; a direct-drive machine replaces the gearbox with a large multi-pole generator. The nacelle also holds the brake, the yaw drive with its ring gear, the anemometer and wind vane, and a crane hatch. The tower, 100-140 m, carries the nacelle, and the foundation resists the overturning moment.</p><p>Operation is a control loop. Below cut-in, about 3 m/s, the turbine is parked; between cut-in and rated, about 12 m/s, it tracks the maximum Cp by adjusting tip-speed ratio, so power rises with the cube of wind speed; between rated and cut-out, about 25 m/s, pitch control holds the power constant; above cut-out the machine yaws out of the wind and stops for safety.</p>", "gu": "<p>રોટર એ હબ પર બોલ્ટ કરેલા ત્રણ બ્લેડ છે. પાંખ જેવી સપાટી પર વહેતો પવન લિફ્ટ બનાવે, વિમાનની પાંખની જેમ, અને ભ્રમણના સમતલમાં લિફ્ટનો ઘટક ટોર્ક બનાવે, તેથી રોટર 10-20 rpm પર ફરે. બ્લેડ પિચ મોટર દરેક બ્લેડને ધરી પર વાળે: ઓછા પવનમાં મહત્તમ લિફ્ટ માટે શ્રેષ્ઠ ખૂણો રાખે અને રેટેડ ગતિથી ઉપર બ્લેડ વાળીને વધારાની શક્તિ છોડે તથા ગિયરબોક્સ બચાવે.</p><p>હબની પાછળ ધીમી ધરી મુખ્ય બેરિંગમાંથી નેસેલમાં પ્રવેશે અને ગિયરબોક્સ ફેરવે, જે ગતિ જનરેટર માટે લગભગ 1,500 rpm કરે; ડાયરેક્ટ-ડ્રાઇવ મશીન ગિયરબોક્સને બદલે મોટું બહુ-ધ્રુવ જનરેટર વાપરે. નેસેલમાં બ્રેક, રિંગ ગિયર સાથેની યો ડ્રાઇવ, એનિમોમીટર અને પવન દિશા તથા ક્રેન બારણું પણ હોય. 100-140 mનો ટાવર નેસેલ ઉપાડે અને પાયો ઊલટવાના ભાર સામે ટકે.</p><p>કાર્યપદ્ધતિ નિયંત્રણ ચક્ર છે. કટ-ઇન લગભગ 3 m/sથી નીચે ટર્બાઇન ઊભું રહે; કટ-ઇન અને રેટેડ વચ્ચે, લગભગ 12 m/s, ટોચ-ગતિ ગુણોત્તર ગોઠવીને મહત્તમ Cp પકડે, તેથી શક્તિ પવન ગતિના ઘન પ્રમાણમાં વધે; રેટેડ અને કટ-આઉટ વચ્ચે, લગભગ 25 m/s, પિચ નિયંત્રણ શક્તિ અચળ રાખે; કટ-આઉટથી ઉપર મશીન પવનમાંથી બહાર વળીને સુરક્ષા માટે થોભે.</p>"}}, {"h": {"en": "Practice 7. What is a bladeless wind turbine? State its advantages and limitations.", "gu": "સરાવ 7. બ્લેડ વગરની પવન ટર્બાઇન શું છે? તેના લાભ અને મર્યાદા જણાવો."}, "body": {"en": "<p>It is a tapered mast fixed at the base that sways when wind flows past it. The wind sheds vortices alternately from each side - the von Karman vortex street - and the changing pressure pushes the mast back and forth at its natural frequency. This is vortex-induced vibration, the same effect that destroyed the Tacoma Narrows bridge in 1940. Magnets on the mast move past coils at the base and generate electricity, so there is no blade, no gearbox, no yaw and only one moving part.</p><p>Advantages: very few parts, so low manufacturing and maintenance cost; extremely quiet; no blade tips to kill birds or bats; safe to stand beside a road or a house; works in turbulent city wind and starts at low speed. Limitations: efficiency is only a few per cent, a small fraction of the Betz limit, so output per unit is hundreds of watts; it is tuned to one resonance, so it suffers far off that wind speed; a tall slender mast in a storm needs the same care as any other structure; and it cannot yet supply grid power economically.</p>", "gu": "<p>તે પાયા પર જડાયેલો પાતળો થતો થાંભલો છે જે પવન પસાર થાય ત્યારે ડોલે. પવન બંને બાજુથી વારાફરતી વમળ છોડે - ફોન કાર્મન વમળ શ્રેણી - અને બદલાતું દબાણ થાંભલાને તેની કુદરતી આવૃત્તિ પર આગળ-પાછળ ધકેલે. આ વમળ-જનિત કંપન છે, જે અસરથી 1940માં ટેકોમા નેરોઝ પુલ તૂટ્યો. થાંભલા પરના ચુંબક પાયા પાસેની કોઇલ પાસેથી પસાર થઈ વીજળી બનાવે, તેથી બ્લેડ નહીં, ગિયરબોક્સ નહીં, યો નહીં અને ફક્ત એક ફરતો ભાગ.</p><p>લાભ: ખૂબ ઓછા ભાગ, તેથી બનાવવાનો અને જાળવણીનો ખર્ચ ઓછો; અત્યંત શાંત; પક્ષી કે ચામાચીડિયાં મારતી બ્લેડની ટોચ નહીં; રસ્તા કે ઘર પાસે ઊભું કરવું સુરક્ષિત; શહેરના અશાંત પવનમાં ચાલે અને ઓછી ગતિએ શરૂ થાય. મર્યાદા: કાર્યક્ષમતા ફક્ત થોડા ટકા, બેટ્ઝ મર્યાદાનો નાનો અંશ, તેથી પ્રતિ એકમ ઉત્પાદન સેંકડો વોટ; તે એક અનુનાદ પર ગોઠવાયેલું હોય તેથી તે ગતિથી દૂર ખૂબ હાલે; તોફાનમાં ઊંચો પાતળો થાંભલો બીજી કોઈ પણ રચના જેવી કાળજી માંગે; અને તે હજી ગ્રિડ શક્તિ આર્થિક રીતે આપી શકતું નથી.</p>"}}, {"h": {"en": "Practice 8. Explain the production of ethanol and biodiesel in India with the reactions and blends.", "gu": "સરાવ 8. ભારતમાં ઇથેનોલ અને બાયોડીઝલના ઉત્પાદનને પ્રક્રિયા અને મિશ્રણ સાથે સમજાવો."}, "body": {"en": "<p>Ethanol: molasses or cane juice is diluted, yeast is added and fermentation converts sugar to ethanol and CO₂ in 30-48 hours - C₆H₁₂O₆ → 2 C₂H₅OH + 2 CO₂. The broth, at 8-12 % alcohol, is distilled to 95 % and dehydrated with molecular sieves to fuel grade. One tonne of molasses gives about 245 L. India blends E10 and is moving to E20, which needs about 1,000 crore litres a year and is fed by sugarcane, surplus grain and now rice straw.</p><p>Biodiesel: oil or fat is heated with methanol and a base catalyst, usually 6 mol of methanol to 1 mol of triglyceride, for an hour at 60 °C. The triglyceride is broken into three methyl esters - the biodiesel - and glycerol settles out. The glycerol is 10 % by mass and is sold to soap and pharma units; the biodiesel is washed, dried and blended as B5 to B20. Feedstock is used cooking oil from hotels, jatropha and karanja grown on waste land, and cotton-seed oil.</p><p>Two cautions for the exam answer. First, ethanol has about two-thirds the energy of petrol, so a 20 % blend raises fuel consumption slightly, and it is hygroscopic, so storage needs care. Second, the real saving is 50-70 %, not 100 %, because the crop, the fertiliser and the distillation all use energy; and diverting food grain to fuel is a policy question, not only a technical one.</p>", "gu": "<p>ઇથેનોલ: ગોળ કે શેરડીનો રસ મંદ કરાય, ખમીર ઉમેરાય અને આથો 30-48 કલાકમાં ખાંડને ઇથેનોલ અને CO₂માં ફેરવે - C₆H₁₂O₆ → 2 C₂H₅OH + 2 CO₂. 8-12 % દારૂવાળું મિશ્રણ 95 % સુધી નિસ્યંદિત થાય અને મોલેક્યુલર ચાળણીથી પાણી કાઢી ઇંધણ-દરજ્જું બને. એક ટન ગોળ લગભગ 245 L આપે. ભારત E10 ભેળવે છે અને E20 તરફ જાય છે, જેને વર્ષે લગભગ 1,000 કરોડ લિટર જોઈએ અને જે શેરડી, વધારાના અનાજ અને હવે પરાળથી પૂરું પડે છે.</p><p>બાયોડીઝલ: તેલ કે ચરબી મિથેનોલ અને ક્ષારક ઉત્પ્રેરક સાથે, સામાન્ય રીતે 1 મોલ ટ્રાઇગ્લિસરાઇડ માટે 6 મોલ મિથેનોલ, 60 °C પર એક કલાક ગરમ કરાય. ટ્રાઇગ્લિસરાઇડ તૂટીને ત્રણ મિથાઇલ એસ્ટર - બાયોડીઝલ - બને અને ગ્લિસરોલ નીચે બેસે. ગ્લિસરોલ દળ પ્રમાણે 10 % હોય અને સાબુ તથા દવા એકમોને વેચાય; બાયોડીઝલ ધોવાય, સૂકાય અને B5 થી B20 તરીકે ભળે. કાચો માલ હોટેલનું વપરાયેલું રાંધણ તેલ, બંજર જમીન પરનાં જટ્રોફા અને કરંજ તથા કપાસિયાનું તેલ છે.</p><p>પરીક્ષાના જવાબમાં બે ચેતવણી. પ્રથમ, ઇથેનોલની ઊર્જા પેટ્રોલના લગભગ બે તૃતીયાંશ છે, તેથી 20 % મિશ્રણ ઇંધણ વપરાશ થોડો વધારે, અને તે ભેજ શોષે છે, તેથી સંગ્રહમાં કાળજી જોઈએ. બીજું, ખરી બચત 50-70 % છે, 100 % નહીં, કારણ કે પાક, ખાતર અને નિસ્યંદન બધું ઊર્જા વાપરે છે; અને ખાદ્ય અનાજને ઇંધણ તરફ વાળવું ફક્ત ટેકનિકલ નહીં, નીતિનો પ્રશ્ન છે.</p>"}}, {"h": {"en": "Practice 9. Explain biomass gasification with a block diagram and compare it with anaerobic digestion.", "gu": "સરાવ 9. બ્લોક ડાયાગ્રામ સાથે બાયોમાસ ગેસિફિકેશન સમજાવો અને અવાયુજીવી પાચન સાથે સરખાવો."}, "body": {"en": "<p>Gasification takes place in four zones of a downdraft or fluidised bed reactor. In the drying zone moisture leaves at 100-150 °C; in the pyrolysis zone, 300-600 °C with little air, the biomass breaks into char, tar and gas; in the oxidation zone the char burns with the injected air at 900-1,100 °C and supplies all the heat; in the reduction zone CO₂ and water react with hot char to give CO and H₂. The producer gas leaves at 300-500 °C with 18-22 % CO, 15-20 % H₂, 2-4 % CH₄ and the rest nitrogen, and a heating value of 4-6 MJ/m³ - low, but enough for an engine.</p><p>Digestion is a biological route at 35-55 °C with no air at all: hydrolysis, acidogenesis, acetogenesis and methanogenesis take 20-40 days and give biogas of 55-65 % methane with a heating value of 20-25 MJ/m³, plus a wet digestate. So gasification is fast, dry, needs a clean dry fuel and gives a low-grade gas; digestion is slow, wet, tolerates dung and food waste and gives a richer gas. Gasification suits rice husk and wood chips for engines; digestion suits cattle dung and kitchen waste for cooking and small power.</p>", "gu": "<p>ગેસિફિકેશન ડાઉનડ્રાફ્ટ કે ફ્લુઇડાઇઝ્ડ બેડ રિએક્ટરના ચાર વિભાગમાં થાય. સૂકવણી વિભાગમાં 100-150 °C પર ભેજ નીકળે; પાયરોલિસિસ વિભાગમાં, ઓછી હવા સાથે 300-600 °C પર, બાયોમાસ કોલસા, ડામર અને ગેસમાં તૂટે; ઓક્સિડેશન વિભાગમાં દાખલ કરેલી હવા સાથે કોલસો 900-1,100 °C પર બળે અને આખી ઉષ્મા આપે; ક્ષય વિભાગમાં CO₂ અને પાણી ગરમ કોલસા સાથે પ્રક્રિયા કરી CO અને H₂ આપે. પ્રોડ્યુસર ગેસ 300-500 °C પર 18-22 % CO, 15-20 % H₂, 2-4 % CH₄ અને બાકી નાઇટ્રોજન સાથે નીકળે અને તેનું ઉષ્મા મૂલ્ય 4-6 MJ/m³ - ઓછું, પણ એન્જિન માટે પૂરતું.</p><p>પાચન 35-55 °C પર હવા વગરનો જૈવિક માર્ગ છે: જળવિભાજન, એસિડજનન, એસિટોજનન અને મિથેનજનન 20-40 દિવસ લે અને 55-65 % મિથેનવાળો બાયોગેસ, જેનું ઉષ્મા મૂલ્ય 20-25 MJ/m³, તથા ભીનું પાચિત ખાતર આપે. તેથી ગેસિફિકેશન ઝડપી, સૂકું, સ્વચ્છ સૂકું ઇંધણ માંગે અને નીચી કક્ષાનો ગેસ આપે; પાચન ધીમું, ભીનું, છાણ અને રસોડાનો કચરો સહે અને વધુ શક્તિશાળી ગેસ આપે. ગેસિફિકેશન ભૂસું અને લાકડાની ચીપને એન્જિન માટે યોગ્ય છે; પાચન પશુના છાણ અને રસોડાના કચરાને રાંધણ અને નાની વીજળી માટે.</p>"}}, {"h": {"en": "Practice 10. Explain geothermal energy with its three plant types and India's position.", "gu": "સરાવ 10. ભૂતાપીય ઊર્જા તેના ત્રણ સ્ટેશન પ્રકાર અને ભારતની સ્થિતિ સાથે સમજાવો."}, "body": {"en": "<p>Heat comes from the decay of uranium, thorium and potassium in the crust and from the original heat of formation, and flows outward at 60-80 mW/m², giving a gradient of 25-30 °C per kilometre. A well 3 km deep therefore finds water at 80-100 °C almost anywhere, and more in a fault zone. The three plant types are chosen by temperature.</p><p>Dry steam plants use steam straight from the well above 240 °C. Flash plants let water at 180-240 °C boil in a low-pressure vessel and use the steam. Binary plants pass brine at 100-180 °C through a heat exchanger to vaporise a low-boiling fluid such as isobutane, which spins the turbine; they emit nothing to the air and can use moderate heat, which is why they are the most widely built today. A 150 kg/s flow cooled from 160 to 90 °C carries 44 MW of heat and gives about 5 MW of electricity at 12 % efficiency.</p><p>India has no high-temperature field; the Puga valley in Ladakh, Manikaran in Himachal and parts of the Deccan have moderate heat and are used for space heating, bathing and greenhouses. The Geological Survey of India estimates about 10 GW of potential, but drilling cost, corrosion by hydrogen sulphide and the distance from the grid have kept the installed base under 10 MW, mostly demonstration.</p>", "gu": "<p>ઉષ્મા પોપડામાં યુરેનિયમ, થોરિયમ અને પોટેશિયમના ક્ષય તથા રચના વખતની મૂળ ઉષ્મામાંથી આવે અને 60-80 mW/m² દરે બહાર વહે, જે પ્રતિ કિલોમીટર 25-30 °C ઢાળ આપે. તેથી 3 કિમી ઊંડો કૂવો લગભગ દરેક જગ્યાએ 80-100 °Cનું પાણી પામે અને ભ્રંશ વિસ્તારમાં વધુ. ત્રણ સ્ટેશન પ્રકાર તાપમાન પ્રમાણે પસંદ થાય.</p><p>સૂકી વરાળ સ્ટેશન 240 °Cથી ઉપર કૂવાની વરાળ સીધી વાપરે. ફ્લેશ સ્ટેશન 180-240 °Cનું પાણી નીચા દબાણની ટાંકીમાં ઉકાળીને વરાળ વાપરે. દ્વિચક્ર સ્ટેશન 100-180 °Cનું ખારું પાણી ઉષ્મા વિનિમયકમાંથી પસાર કરી નીચા ઉકળાંકવાળો પ્રવાહી, જેમ કે આઇસોબ્યુટેન, બાષ્પિત કરે, જે ટર્બાઇન ફેરવે; તે હવામાં કંઈ છોડતું નથી અને મધ્યમ ઉષ્મા વાપરી શકે, તેથી આજે સૌથી વધુ બનાવાય છે. 160 થી 90 °C સુધી ઠંડું થતું 150 kg/s પ્રવાહ 44 MW ઉષ્મા ધરે અને 12 % કાર્યક્ષમતાએ લગભગ 5 MW વીજળી આપે.</p><p>ભારતમાં ઊંચા તાપમાનનું ક્ષેત્ર નથી; લદ્દાખની પુગા ખીણ, હિમાચલનું મણિકરણ અને દક્કનના કેટલાક ભાગમાં મધ્યમ ઉષ્મા છે, જે જગ્યા ગરમ કરવા, સ્નાન અને કાચઘર માટે વપરાય. ભારતીય ભૂસ્તરીય સર્વેક્ષણ લગભગ 10 GW ક્ષમતા આંકે, પણ ડ્રિલિંગ ખર્ચ, હાઇડ્રોજન સલ્ફાઇડનો કાટ અને ગ્રિડથી અંતરને કારણે સ્થાપિત ક્ષમતા 10 MWથી ઓછી, મોટે ભાગે પ્રદર્શન.</p>"}}, {"h": {"en": "Practice 11. Write short notes on ocean energy and hydrogen as a future fuel.", "gu": "સરાવ 11. મહાસાગર ઊર્જા અને ભવિષ્યના ઇંધણ તરીકે હાઇડ્રોજન પર ટૂંકી નોંધ લખો."}, "body": {"en": "<p>Ocean energy has three branches. Tidal range uses a barrage across an estuary; the energy of one filling is ½AρgR², so the range matters twice as much as the area, and a 2 km² basin with 6 m range stores 362 GJ per filling. Tidal stream uses underwater turbines that look like wind turbines and need no dam. Wave devices convert the heave, surge or pitch of the surface - oscillating water column, point absorber, overtopping. OTEC uses the 20 °C difference between warm surface water and cold water at 1,000 m to run a closed ammonia cycle and gives electricity, fresh water and cooling together.</p><p>Hydrogen is an energy carrier with 33.3 kWh of heat per kilogram, three times petrol by mass, and only water vapour as exhaust. Green hydrogen is made by electrolysis of water with renewable electricity at 50-55 kWh per kilogram, an efficiency of about 70-75 %; a PEM fuel cell returns 50-60 % of that. It will first replace grey hydrogen in refineries, steel and fertiliser, then run long-distance trucks, buses and ships.</p><p>The honest limits: round-trip efficiency of power-to-gas-to-power is only 30-35 %, so hydrogen is the last choice after direct electrification and batteries; storage at 350-700 bar or at −253 °C costs energy; hydrogen embrittles steel and leaks through small gaps; and the flame is almost invisible, so leak detection is a safety issue. Ocean energy has the mirror problem - a huge but dilute resource in a corrosive, stormy environment far from the grid.</p>", "gu": "<p>મહાસાગર ઊર્જાની ત્રણ શાખા છે. ભરતીના તફાવતમાં જળમાર્ગ પર બેરેજ વપરાય; એક ભરણની ઊર્જા ½AρgR² છે, તેથી તફાવત વિસ્તાર કરતાં બમણો મહત્ત્વનો છે, અને 6 m તફાવતવાળું 2 km² તળાવ પ્રતિ ભરણે 362 GJ સંગ્રહે. ભરતી પ્રવાહમાં પવન ટર્બાઇન જેવા પાણી નીચેના ટર્બાઇન વપરાય અને બંધ ન જોઈએ. તરંગ સાધનો સપાટીના ઊંચા-નીચા, આગળ-પાછળ કે ઝુકાવને ફેરવે - ડોલતો પાણી સ્તંભ, બિંદુ શોષક, ઓવરટોપિંગ. OTEC ગરમ સપાટીના પાણી અને 1,000 m નીચેના ઠંડા પાણી વચ્ચેના 20 °C તફાવતથી બંધ એમોનિયા ચક્ર ચલાવે અને સાથે વીજળી, મીઠું પાણી તથા ઠંડક આપે.</p><p>હાઇડ્રોજન ઊર્જા વાહક છે, પ્રતિ કિલો 33.3 kWh ઉષ્મા, દળ પ્રમાણે પેટ્રોલ કરતાં ત્રણ ગણું, અને નિકાસમાં ફક્ત પાણીની વરાળ. લીલું હાઇડ્રોજન પુનઃપ્રાપ્ય વીજળીથી પાણીના વિદ્યુતવિભાજન દ્વારા પ્રતિ કિલો 50-55 kWh વાપરીને બને, લગભગ 70-75 % કાર્યક્ષમતા; PEM ઇંધણ કોષ તેમાંથી 50-60 % પાછું આપે. તે પહેલાં રિફાઇનરી, પોલાદ અને ખાતરમાં ભૂખરા હાઇડ્રોજનને બદલશે, પછી લાંબા અંતરના ટ્રક, બસ અને જહાજ ચલાવશે.</p><p>પ્રામાણિક મર્યાદા: વીજળી-થી-ગેસ-થી-વીજળીની આવ-જાવ કાર્યક્ષમતા ફક્ત 30-35 % છે, તેથી સીધા વીજીકરણ અને બેટરી પછી હાઇડ્રોજન છેલ્લી પસંદગી છે; 350-700 bar પર કે −253 °C પર સંગ્રહ ઊર્જા ખર્ચે; હાઇડ્રોજન પોલાદને ભુરભુરું કરે અને નાના છિદ્રમાંથી લીક થાય; અને તેની જ્યોત લગભગ અદૃશ્ય છે, તેથી લીક શોધ સુરક્ષાનો પ્રશ્ન છે. મહાસાગર ઊર્જાની વિરુદ્ધ સમસ્યા છે - વિશાળ પણ પાતળું સંસાધન, કાટ લગાડતા તોફાની વાતાવરણમાં અને ગ્રિડથી દૂર.</p>"}}, {"h": {"en": "Practice 12. A village of 400 homes needs 250 kWh a day. Design a solar-wind hybrid and justify it.", "gu": "સરાવ 12. 400 ઘરવાળા ગામને દિવસે 250 kWh જોઈએ. સૌર-પવન સંકર પ્રણાલી રચો અને તેનું સમર્થન કરો."}, "body": {"en": "<p>Load: 250 kWh a day is about 91,000 kWh a year, an average of 10.4 kW and a peak of perhaps 40 kW. Solar alone at 4.6 peak sun hours and a performance ratio of 0.80 needs 250 / (4.6 × 0.80) = 68 kWp; but solar makes nothing from 6 p.m. to 6 a.m., when village load is at its evening peak. Wind alone at a 25 % capacity factor needs 250 / (24 × 0.25) = 42 kW, but a calm week would leave the village dark.</p><p>Hybrid design: 45 kWp solar (about 250 m² of roof and shed), a 20 kW wind turbine on a 30 m mast at the pond
