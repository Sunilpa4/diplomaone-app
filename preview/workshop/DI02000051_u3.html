bund, a 100 kWh lithium battery for the evening peak, a 30 kVA inverter and a diesel generator of 40 kVA only for the monsoon emergency. Solar then gives about 45 × 4.6 × 0.8 = 166 kWh a day and wind about 20 × 24 × 0.25 = 120 kWh, so the two together give 286 kWh against a 250 kWh need, a margin of 14 % for bad weather.</p><p>Justification: the two resources are anti-correlated. In Gujarat the monsoon months have cloud and little sun but strong wind, while winter has clear sun and lighter wind, so the hybrid needs a smaller battery than either alone and the battery is cycled less, which doubles its life. Sharing one inverter, one controller and one maintenance team cuts the cost per kWh. The design also matches the load curve - solar carries the day load and pumps water, wind and the battery carry the evening.</p>", "gu": "<p>ભાર: દિવસે 250 kWh એટલે વર્ષે લગભગ 91,000 kWh, સરેરાશ 10.4 kW અને ટોચ લગભગ 40 kW. ફક્ત સૌર, 4.6 પીક સન અવર્સ અને 0.80 કાર્યદક્ષતા ગુણોત્તરે, 250 / (4.6 × 0.80) = 68 kWp માંગે; પણ સૌર સાંજે 6 થી સવારે 6 સુધી કંઈ બનાવતું નથી, જ્યારે ગામનો ભાર સાંજે ટોચે હોય. ફક્ત પવન 25 % ક્ષમતા અવયવે 250 / (24 × 0.25) = 42 kW માંગે, પણ શાંત અઠવાડિયું ગામને અંધારું રાખે.</p><p>સંકર રચના: 45 kWp સૌર (લગભગ 250 m² છત અને શેડ), તળાવના પાળા પર 30 m થાંભલે 20 kW પવન ટર્બાઇન, સાંજની ટોચ માટે 100 kWh લિથિયમ બેટરી, 30 kVA ઇન્વર્ટર અને ફક્ત ચોમાસાની કટોકટી માટે 40 kVA ડીઝલ જનરેટર. પછી સૌર દિવસે લગભગ 45 × 4.6 × 0.8 = 166 kWh અને પવન લગભગ 20 × 24 × 0.25 = 120 kWh આપે, તેથી બંને ભેગા 250 kWhની જરૂર સામે 286 kWh આપે, ખરાબ હવામાન માટે 14 % માર્જિન.</p><p>સમર્થન: બંને સંસાધનો વિરોધી સહસંબંધ ધરાવે. ગુજરાતમાં ચોમાસાના મહિનામાં વાદળ અને ઓછો તડકો પણ તાકાતવાન પવન હોય, જ્યારે શિયાળામાં સ્વચ્છ તડકો અને હળવો પવન, તેથી સંકર પ્રણાલીને એકલા કોઈ પણ કરતાં નાની બેટરી જોઈએ અને બેટરી ઓછી ચક્રાવે, જે તેનું આયુષ્ય બમણું કરે. એક ઇન્વર્ટર, એક નિયંત્રક અને એક જાળવણી ટીમ વહેંચવાથી પ્રતિ kWh ખર્ચ ઘટે. રચના ભાર વણકરને પણ મળે - સૌર દિવસનો ભાર અને પાણી ઉપાડે, પવન અને બેટરી સાંજ સંભાળે.</p>"}}]}], "diagrams": [{"id": "u3_mix", "title": {"en": "The energy mix and what each source costs the air", "gu": "ઊર્જા મિશ્રણ અને દરેક સ્રોત હવાને કેટલું ખર્ચે"}, "file": "diagrams/u3_mix.svg", "caption": {"en": "Solar and wind cost nothing to run and emit nothing at the plant; the small life-cycle share comes from making the panels and turbines.", "gu": "સૌર અને પવન ચલાવવા મફત છે અને સ્ટેશન પર કંઈ છોડતા નથી; થોડો જીવનચક્ર હિસ્સો પેનલ અને ટર્બાઇન બનાવવામાંથી આવે."}}, {"id": "u3_pv", "title": {"en": "How a solar cell turns light into current", "gu": "સૌર સેલ પ્રકાશને પ્રવાહમાં કેવી રીતે ફેરવે"}, "file": "diagrams/u3_pv.svg", "caption": {"en": "Photons free electrons at the junction, the built-in field separates them, and the contacts collect the current; heat and unused photons are the main losses.", "gu": "ફોટોન સંધિ પર ઇલેક્ટ્રોન મુક્ત કરે, આંતરિક ક્ષેત્ર તેમને અલગ કરે અને સંપર્ક પ્રવાહ એકઠો કરે; ઉષ્મા અને ન વપરાયેલા ફોટોન મુખ્ય ખોટ છે."}}, {"id": "u3_cells", "title": {"en": "Efficiency of the solar cell families", "gu": "સૌર સેલ કુટુંબોની કાર્યક્ષમતા"}, "file": "diagrams/u3_cells.svg", "caption": {"en": "Monocrystalline wins on area, thin film wins on price and weak light, perovskite promises more but is not yet proven outdoors.", "gu": "મોનોક્રિસ્ટાલાઇન જગ્યામાં જીતે, પાતળી ફિલ્મ ભાવ અને નબળા પ્રકાશમાં જીતે, પેરોવસ્કાઇટ વધુ વચન આપે પણ બહાર પુરવાર થયું નથી."}}, {"id": "u3_wind", "title": {"en": "Horizontal axis and vertical axis wind turbines", "gu": "આડી અક્ષ અને ઊભી અક્ષની પવન ટર્બાઇન"}, "file": "diagrams/u3_wind.svg", "caption": {"en": "A HAWT sweeps a big disc and reaches Cp 0.45-0.50; a VAWT accepts wind from any side and reaches only 0.15-0.35.", "gu": "HAWT મોટી ડિસ્ક ઘેરે અને Cp 0.45-0.50 પામે; VAWT ગમે તે બાજુથી પવન સ્વીકારે અને ફક્ત 0.15-0.35 પામે."}}, {"id": "u3_bio", "title": {"en": "Routes from biomass to fuel", "gu": "બાયોમાસથી ઇંધણ સુધીના રસ્તા"}, "file": "diagrams/u3_bio.svg", "caption": {"en": "Burn it, digest it, ferment it or gasify it - the route decides whether you get heat, gas, ethanol or producer gas.", "gu": "બાળો, પચાવો, આથો લાવો કે ગેસિફાય કરો - રસ્તો નક્કી કરે કે ઉષ્મા, ગેસ, ઇથેનોલ કે પ્રોડ્યુસર ગેસ મળશે."}}, {"id": "u3_new", "title": {"en": "Geothermal, ocean and hydrogen at a glance", "gu": "ભૂતાપ, મહાસાગર અને હાઇડ્રોજન એક નજરે"}, "file": "diagrams/u3_new.svg", "caption": {"en": "Geothermal gives firm heat, the ocean gives predictable tides and OTEC, hydrogen carries renewable electricity to places a wire cannot reach.", "gu": "ભૂતાપ નિશ્ચિત ઉષ્મા આપે, મહાસાગર અનુમાનિત ભરતી અને OTEC, હાઇડ્રોજન પુનઃપ્રાપ્ય વીજળી તાર પહોંચે નહીં ત્યાં લઈ જાય."}}], "equations": [{"title": {"en": "Solar and wind", "gu": "સૌર અને પવન"}, "items": [{"name": {"en": "Module efficiency", "gu": "મોડ્યુલ કાર્યક્ષમતા"}, "f": "η = P_max / (G × A)", "terms": {"en": "G is the irradiance in W/m² and A the module area in m².", "gu": "G એ W/m²માં ઇરેડિયન્સ અને A એ m²માં મોડ્યુલનો વિસ્તાર છે."}}, {"name": {"en": "Fill factor", "gu": "ભરણ અવયવ"}, "f": "FF = P_max / (V_oc × I_sc)", "terms": {"en": "0.75-0.82 for a healthy silicon module; a drop means a hot spot or a bad contact.", "gu": "સ્વસ્થ સિલિકોન મોડ્યુલ માટે 0.75-0.82; ઘટે તો હોટ સ્પોટ કે ખરાબ સંપર્ક."}}, {"name": {"en": "Daily energy yield", "gu": "દૈનિક ઊર્જા ઉત્પાદન"}, "f": "E = P × PSH × PR", "terms": {"en": "PSH is peak sun hours and PR the performance ratio, about 0.75-0.85.", "gu": "PSH એ પીક સન અવર્સ અને PR કાર્યદક્ષતા ગુણોત્તર, લગભગ 0.75-0.85."}}, {"name": {"en": "Power in the wind", "gu": "પવનમાંની શક્તિ"}, "f": "P = ½ ρ A v³", "terms": {"en": "ρ is air density, about 1.225 kg/m³ at sea level; A is the swept area.", "gu": "ρ હવાની ઘનતા, સમુદ્ર સપાટીએ લગભગ 1.225 kg/m³; A ઘેરાયેલો વિસ્તાર."}}, {"name": {"en": "Betz limit", "gu": "બેટ્ઝ મર્યાદા"}, "f": "P_max = (16/27) × ½ ρ A v³ = 0.593 P_wind", "terms": {"en": "No rotor can extract more than 59.3 % of the power in the wind.", "gu": "કોઈ રોટર પવનમાંની શક્તિના 59.3 %થી વધુ ખેંચી શકે નહીં."}}, {"name": {"en": "Capacity factor", "gu": "ક્ષમતા અવયવ"}, "f": "CF = actual energy / (rating × 8,760 h)", "terms": {"en": "Solar 15-22 %, wind 25-35 %, coal 55-70 %.", "gu": "સૌર 15-22 %, પવન 25-35 %, કોલસો 55-70 %."}}]}, {"title": {"en": "Bioenergy", "gu": "બાયોએનર્જી"}, "items": [{"name": {"en": "Biogas yield", "gu": "બાયોગેસ ઉત્પાદન"}, "f": "V_gas = m_dung × y", "terms": {"en": "y is about 0.04 m³ of biogas per kg of fresh cattle dung.", "gu": "y એ તાજા પશુના છાણના પ્રતિ કિલો લગભગ 0.04 m³ બાયોગેસ છે."}}, {"name": {"en": "Blend ratio", "gu": "મિશ્રણ ગુણોત્તર"}, "f": "V_bio = f × V_total,  V_fossil = (1 − f) V_total", "terms": {"en": "E10 is 10 % ethanol, B20 is 20 % biodiesel, both by volume.", "gu": "E10 એટલે 10 % ઇથેનોલ, B20 એટલે 20 % બાયોડીઝલ, બંને કદ પ્રમાણે."}}, {"name": {"en": "Transesterification", "gu": "ટ્રાન્સએસ્ટરીફિકેશન"}, "f": "triglyceride + 3 CH₃OH → 3 FAME + glycerol", "terms": {"en": "About 100 kg of oil with 20 kg of methanol gives 100 kg of biodiesel and 10 kg of glycerol.", "gu": "લગભગ 100 કિલો તેલ અને 20 કિલો મિથેનોલ 100 કિલો બાયોડીઝલ તથા 10 કિલો ગ્લિસરોલ આપે."}}]}, {"title": {"en": "Geothermal, ocean and hydrogen", "gu": "ભૂતાપ, મહાસાગર અને હાઇડ્રોજન"}, "items": [{"name": {"en": "Geothermal heat", "gu": "ભૂતાપીય ઉષ્મા"}, "f": "Q = ṁ cp ΔT,  P = η Q", "terms": {"en": "ṁ is the brine flow in kg/s and cp about 4.2 kJ/kg·K for water.", "gu": "ṁ એ kg/sમાં ખારા પાણીનો પ્રવાહ અને પાણી માટે cp લગભગ 4.2 kJ/kg·K."}}, {"name": {"en": "Tidal barrage energy", "gu": "ભરતી બેરેજની ઊર્જા"}, "f": "E = ½ A ρ g R²", "terms": {"en": "A is the basin area and R the tidal range; doubling R gives four times the energy.", "gu": "A તળાવનો વિસ્તાર અને R ભરતીનો તફાવત; R બમણો થાય તો ઊર્જા ચાર ગણી."}}, {"name": {"en": "Hydrogen efficiency", "gu": "હાઇડ્રોજન કાર્યક્ષમતા"}, "f": "η = HHV_H₂ / electricity per kg", "terms": {"en": "52 kWh per kg against 39.4 kWh of higher heating value gives 75.7 %.", "gu": "પ્રતિ કિલો 52 kWh સામે 39.4 kWh ઊંચું ઉષ્મા મૂલ્ય 75.7 % આપે."}}, {"name": {"en": "CO₂ avoided", "gu": "બચતનું CO₂"}, "f": "m_CO₂ = E × EF", "terms": {"en": "EF is the grid emission factor, about 0.71 t CO₂ per MWh in India.", "gu": "EF એ ગ્રિડ ઉત્સર્જન અવયવ, ભારતમાં પ્રતિ MWh લગભગ 0.71 t CO₂."}}]}], "numericals": [{"id": "u3n01", "unit": 3, "h": {"en": "Power in the wind and what the turbine keeps.", "gu": "પવનમાંની શક્તિ અને ટર્બાઇન કેટલી રાખે."}, "q": {"en": "A wind turbine has a 100 m rotor and works in 1.225 kg/m³ air at 10 m/s. Find the power in the wind, the Betz limit, and the electrical output for Cp = 0.45 with a drive train efficiency of 0.95.", "gu": "પવન ટર્બાઇનનો રોટર 100 m છે અને 1.225 kg/m³ હવામાં 10 m/s પર ચાલે છે. પવનમાંની શક્તિ, બેટ્ઝ મર્યાદા અને Cp = 0.45 તથા 0.95 ડ્રાઇવ ટ્રેન કાર્યક્ષમતા માટે વીજ ઉત્પાદન શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A wind turbine has a 100 m rotor and works in 1.225 kg/m³ air at 10 m/s. Find the power in the wind, the Betz limit, and the electrical output for Cp = 0.45 with a drive train efficiency of 0.95.</p><h4>Step-by-step solution</h4><p>Swept area A = πD²/4 = π × 100²/4 = 7,854 m²</p><p>P = ½ρAv³ = 0.5 × 1.225 × 7,854 × 10³ = 4,810,575 W ≈ 4.81 MW</p><p>Betz limit = 16/27 = 0.593, so at most 0.593 × 4.81 = 2.85 MW can be extracted</p><p>Electrical output = 4.81 × 0.45 × 0.95 = 2.06 MW</p><h4>Answer</h4><p><b>4.81 MW in the wind, 2.85 MW at Betz, 2.06 MW electrical</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>પવન ટર્બાઇનનો રોટર 100 m છે અને 1.225 kg/m³ હવામાં 10 m/s પર ચાલે છે. પવનમાંની શક્તિ, બેટ્ઝ મર્યાદા અને Cp = 0.45 તથા 0.95 ડ્રાઇવ ટ્રેન કાર્યક્ષમતા માટે વીજ ઉત્પાદન શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>ઘેરાયેલો વિસ્તાર A = πD²/4 = π × 100²/4 = 7,854 m²</p><p>P = ½ρAv³ = 0.5 × 1.225 × 7,854 × 10³ = 4,810,575 W ≈ 4.81 MW</p><p>બેટ્ઝ મર્યાદા = 16/27 = 0.593, તેથી વધુમાં વધુ 0.593 × 4.81 = 2.85 MW ખેંચી શકાય</p><p>વીજ ઉત્પાદન = 4.81 × 0.45 × 0.95 = 2.06 MW</p><h4>જવાબ</h4><p><b>પવનમાં 4.81 MW, બેટ્ઝ પર 2.85 MW, વીજળી 2.06 MW</b></p>"}, "answer": {"en": "4.81 MW in the wind, 2.85 MW at Betz, 2.06 MW electrical", "gu": "પવનમાં 4.81 MW, બેટ્ઝ પર 2.85 MW, વીજળી 2.06 MW"}}, {"id": "u3n02", "unit": 3, "h": {"en": "How close a good turbine comes to the Betz limit.", "gu": "સારી ટર્બાઇન બેટ્ઝ મર્યાદાની કેટલી નજીક આવે."}, "q": {"en": "A turbine extracts 42 % of the power in the wind. Express this as a fraction of the Betz limit of 16/27.", "gu": "ટર્બાઇન પવનમાંની 42 % શક્તિ ખેંચે છે. તેને 16/27ની બેટ્ઝ મર્યાદાના અંશ તરીકે દર્શાવો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A turbine extracts 42 % of the power in the wind. Express this as a fraction of the Betz limit of 16/27.</p><h4>Step-by-step solution</h4><p>Betz limit = 16/27 = 0.5926</p><p>Fraction of the limit = 0.42 / 0.5926 = 0.709</p><p>Losses: tip vortices, wake rotation, blade profile drag and the gearbox</p><h4>Answer</h4><p><b>70.9 % of the Betz limit, so 42 % of the wind power</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>ટર્બાઇન પવનમાંની 42 % શક્તિ ખેંચે છે. તેને 16/27ની બેટ્ઝ મર્યાદાના અંશ તરીકે દર્શાવો.</p><h4>પગલાવાર ઉકેલ</h4><p>બેટ્ઝ મર્યાદા = 16/27 = 0.5926</p><p>મર્યાદાનો અંશ = 0.42 / 0.5926 = 0.709</p><p>ખોટ: ટોચના વમળ, વેક ભ્રમણ, બ્લેડ પ્રોફાઇલ ડ્રેગ અને ગિયરબોક્સ</p><h4>જવાબ</h4><p><b>બેટ્ઝ મર્યાદાના 70.9 %, એટલે પવન શક્તિના 42 %</b></p>"}, "answer": {"en": "70.9 % of the Betz limit, so 42 % of the wind power", "gu": "બેટ્ઝ મર્યાદાના 70.9 %, એટલે પવન શક્તિના 42 %"}}, {"id": "u3n03", "unit": 3, "h": {"en": "Efficiency of one PV module.", "gu": "એક PV મોડ્યુલની કાર્યક્ષમતા."}, "q": {"en": "A 445 Wp module has an area of 2.1 m² and is tested at 1,000 W/m². Find its efficiency and the power a 20-module array gives at that irradiance.", "gu": "445 Wp મોડ્યુલનો વિસ્તાર 2.1 m² છે અને તે 1,000 W/m² પર પરીક્ષણ પામે છે. તેની કાર્યક્ષમતા અને તે ઇરેડિયન્સ પર 20 મોડ્યુલની એરે કેટલી શક્તિ આપે તે શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A 445 Wp module has an area of 2.1 m² and is tested at 1,000 W/m². Find its efficiency and the power a 20-module array gives at that irradiance.</p><h4>Step-by-step solution</h4><p>Input power = 1,000 × 2.1 = 2,100 W</p><p>η = 445 / 2,100 × 100 = 21.2 %</p><p>Array = 20 × 445 = 8,900 W = 8.9 kWp at standard test conditions</p><h4>Answer</h4><p><b>21.2 % efficiency; 8.9 kWp for 20 modules</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>445 Wp મોડ્યુલનો વિસ્તાર 2.1 m² છે અને તે 1,000 W/m² પર પરીક્ષણ પામે છે. તેની કાર્યક્ષમતા અને તે ઇરેડિયન્સ પર 20 મોડ્યુલની એરે કેટલી શક્તિ આપે તે શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>ઇનપુટ શક્તિ = 1,000 × 2.1 = 2,100 W</p><p>η = 445 / 2,100 × 100 = 21.2 %</p><p>એરે = 20 × 445 = 8,900 W = 8.9 kWp પ્રમાણભૂત પરીક્ષણ સ્થિતિમાં</p><h4>જવાબ</h4><p><b>21.2 % કાર્યક્ષમતા; 20 મોડ્યુલ માટે 8.9 kWp</b></p>"}, "answer": {"en": "21.2 % efficiency; 8.9 kWp for 20 modules", "gu": "21.2 % કાર્યક્ષમતા; 20 મોડ્યુલ માટે 8.9 kWp"}}, {"id": "u3n04", "unit": 3, "h": {"en": "Daily and yearly energy from a rooftop plant.", "gu": "છત પરના સ્ટેશનથી દૈનિક અને વાર્ષિક ઊર્જા."}, "q": {"en": "A 5 kWp plant in Gujarat receives 4.6 peak sun hours a day with a performance ratio of 0.80. Find the daily and yearly output and the CO₂ avoided at 0.71 t per MWh.", "gu": "ગુજરાતમાં 5 kWp સ્ટેશનને દિવસે 4.6 પીક સન અવર્સ મળે અને કાર્યદક્ષતા ગુણોત્તર 0.80 છે. દૈનિક અને વાર્ષિક ઉત્પાદન તથા પ્રતિ MWh 0.71 t પ્રમાણે બચતનું CO₂ શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A 5 kWp plant in Gujarat receives 4.6 peak sun hours a day with a performance ratio of 0.80. Find the daily and yearly output and the CO₂ avoided at 0.71 t per MWh.</p><h4>Step-by-step solution</h4><p>Ideal daily energy = 5 × 4.6 = 23 kWh</p><p>Actual = 23 × 0.80 = 18.4 kWh a day</p><p>Yearly = 18.4 × 365 = 6,716 kWh ≈ 6.72 MWh</p><p>CO₂ avoided = 6.716 × 0.71 = 4.77 t a year</p><h4>Answer</h4><p><b>18.4 kWh a day, 6.72 MWh a year, 4.77 t CO₂ avoided</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>ગુજરાતમાં 5 kWp સ્ટેશનને દિવસે 4.6 પીક સન અવર્સ મળે અને કાર્યદક્ષતા ગુણોત્તર 0.80 છે. દૈનિક અને વાર્ષિક ઉત્પાદન તથા પ્રતિ MWh 0.71 t પ્રમાણે બચતનું CO₂ શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>આદર્શ દૈનિક ઊર્જા = 5 × 4.6 = 23 kWh</p><p>વાસ્તવિક = 23 × 0.80 = 18.4 kWh દિવસે</p><p>વાર્ષિક = 18.4 × 365 = 6,716 kWh ≈ 6.72 MWh</p><p>બચતનું CO₂ = 6.716 × 0.71 = 4.77 t વર્ષે</p><h4>જવાબ</h4><p><b>દિવસે 18.4 kWh, વર્ષે 6.72 MWh, 4.77 t CO₂ બચત</b></p>"}, "answer": {"en": "18.4 kWh a day, 6.72 MWh a year, 4.77 t CO₂ avoided", "gu": "દિવસે 18.4 kWh, વર્ષે 6.72 MWh, 4.77 t CO₂ બચત"}}, {"id": "u3n05", "unit": 3, "h": {"en": "Designing the module layout of an array.", "gu": "એરેની મોડ્યુલ ગોઠવણીની રચના."}, "q": {"en": "An inverter needs 5 kWp of modules. Each module is 250 Wp with Voc = 37.6 V and Isc = 8.7 A. The inverter accepts 150-450 V DC and 15 A per string. Find the number of modules and a workable series-parallel layout.", "gu": "ઇન્વર્ટરને 5 kWp મોડ્યુલ જોઈએ. દરેક મોડ્યુલ 250 Wp છે, Voc = 37.6 V અને Isc = 8.7 A. ઇન્વર્ટર 150-450 V DC અને શ્રેણી દીઠ 15 A સ્વીકારે. મોડ્યુલની સંખ્યા અને યોગ્ય શ્રેણી-સમાંતર ગોઠવણી શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>An inverter needs 5 kWp of modules. Each module is 250 Wp with Voc = 37.6 V and Isc = 8.7 A. The inverter accepts 150-450 V DC and 15 A per string. Find the number of modules and a workable series-parallel layout.</p><h4>Step-by-step solution</h4><p>Modules needed = 5,000 / 250 = 20</p><p>Five in series gives 5 × 37.6 = 188 V, inside the window; eight in series would give 301 V but leaves little headroom above 450 V in cold weather</p><p>Strings = 20 / 5 = 4, each carrying 8.7 A, safely below 15 A</p><p>Array current = 4 × 8.7 = 34.8 A into the combiner</p><h4>Answer</h4><p><b>20 modules as 4 strings of 5; 188 V and 34.8 A</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>ઇન્વર્ટરને 5 kWp મોડ્યુલ જોઈએ. દરેક મોડ્યુલ 250 Wp છે, Voc = 37.6 V અને Isc = 8.7 A. ઇન્વર્ટર 150-450 V DC અને શ્રેણી દીઠ 15 A સ્વીકારે. મોડ્યુલની સંખ્યા અને યોગ્ય શ્રેણી-સમાંતર ગોઠવણી શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>જરૂરી મોડ્યુલ = 5,000 / 250 = 20</p><p>પાંચ શ્રેણીમાં 5 × 37.6 = 188 V, મર્યાદામાં; આઠ શ્રેણીમાં 301 V થાય પણ ઠંડીમાં 450 V ઉપર થોડી જ જગ્યા રહે</p><p>શ્રેણી = 20 / 5 = 4, દરેક 8.7 A વહન કરે, 15 Aથી સુરક્ષિત રીતે નીચે</p><p>એરે પ્રવાહ = 4 × 8.7 = 34.8 A કોમ્બાઇનરમાં</p><h4>જવાબ</h4><p><b>20 મોડ્યુલ, 5ના 4 શ્રેણી; 188 V અને 34.8 A</b></p>"}, "answer": {"en": "20 modules as 4 strings of 5; 188 V and 34.8 A", "gu": "20 મોડ્યુલ, 5ના 4 શ્રેણી; 188 V અને 34.8 A"}}, {"id": "u3n06", "unit": 3, "h": {"en": "Sizing a family biogas plant.", "gu": "કુટુંબના બાયોગેસ સ્ટેશનનું માપ."}, "q": {"en": "A family of six needs 0.4 m³ of gas per person a day. Cattle dung yields 0.04 m³ of biogas per kg. Find the daily dung needed and the number of cattle at 10 kg of dung per animal a day.", "gu": "છ વ્યક્તિના કુટુંબને દિવસે પ્રતિ વ્યક્તિ 0.4 m³ ગેસ જોઈએ. પશુનું છાણ પ્રતિ કિલો 0.04 m³ બાયોગેસ આપે. દૈનિક જરૂરી છાણ અને પ્રતિ પશુ દિવસે 10 કિલો છાણ પ્રમાણે પશુઓની સંખ્યા શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A family of six needs 0.4 m³ of gas per person a day. Cattle dung yields 0.04 m³ of biogas per kg. Find the daily dung needed and the number of cattle at 10 kg of dung per animal a day.</p><h4>Step-by-step solution</h4><p>Gas needed = 6 × 0.4 = 2.4 m³ a day</p><p>Dung = 2.4 / 0.04 = 60 kg a day</p><p>Cattle = 60 / 10 = 6 animals</p><p>A 2 m³ Deenbandhu digester is the usual size for this duty</p><h4>Answer</h4><p><b>60 kg of dung from 6 cattle; a 2 m³ digester</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>છ વ્યક્તિના કુટુંબને દિવસે પ્રતિ વ્યક્તિ 0.4 m³ ગેસ જોઈએ. પશુનું છાણ પ્રતિ કિલો 0.04 m³ બાયોગેસ આપે. દૈનિક જરૂરી છાણ અને પ્રતિ પશુ દિવસે 10 કિલો છાણ પ્રમાણે પશુઓની સંખ્યા શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>જરૂરી ગેસ = 6 × 0.4 = 2.4 m³ દિવસે</p><p>છાણ = 2.4 / 0.04 = 60 કિલો દિવસે</p><p>પશુ = 60 / 10 = 6 પશુ</p><p>આ કામ માટે 2 m³નો દીનબંધુ પાચક સામાન્ય માપ છે</p><h4>જવાબ</h4><p><b>6 પશુમાંથી 60 કિલો છાણ; 2 m³ પાચક</b></p>"}, "answer": {"en": "60 kg of dung from 6 cattle; a 2 m³ digester", "gu": "6 પશુમાંથી 60 કિલો છાણ; 2 m³ પાચક"}}, {"id": "u3n07", "unit": 3, "h": {"en": "Biodiesel needed for a B20 blend.", "gu": "B20 મિશ્રણ માટે જરૂરી બાયોડીઝલ."}, "q": {"en": "A depot sells 20,000 L of diesel a month and must supply it as B20, that is 20 % biodiesel by volume. Find the volumes and the mass of biodiesel at a density of 0.88 kg/L.", "gu": "ડેપો મહિને 20,000 L ડીઝલ વેચે અને તેને B20, એટલે કદ પ્રમાણે 20 % બાયોડીઝલ, તરીકે પૂરું પાડવું પડે. કદ અને 0.88 kg/L ઘનતાએ બાયોડીઝલનું દળ શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A depot sells 20,000 L of diesel a month and must supply it as B20, that is 20 % biodiesel by volume. Find the volumes and the mass of biodiesel at a density of 0.88 kg/L.</p><h4>Step-by-step solution</h4><p>Biodiesel = 0.20 × 20,000 = 4,000 L</p><p>Diesel = 20,000 − 4,000 = 16,000 L</p><p>Mass = 4,000 × 0.88 = 3,520 kg of biodiesel a month</p><h4>Answer</h4><p><b>16,000 L diesel + 4,000 L biodiesel = 3,520 kg</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>ડેપો મહિને 20,000 L ડીઝલ વેચે અને તેને B20, એટલે કદ પ્રમાણે 20 % બાયોડીઝલ, તરીકે પૂરું પાડવું પડે. કદ અને 0.88 kg/L ઘનતાએ બાયોડીઝલનું દળ શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>બાયોડીઝલ = 0.20 × 20,000 = 4,000 L</p><p>ડીઝલ = 20,000 − 4,000 = 16,000 L</p><p>દળ = 4,000 × 0.88 = 3,520 કિલો બાયોડીઝલ મહિને</p><h4>જવાબ</h4><p><b>16,000 L ડીઝલ + 4,000 L બાયોડીઝલ = 3,520 કિલો</b></p>"}, "answer": {"en": "16,000 L diesel + 4,000 L biodiesel = 3,520 kg", "gu": "16,000 L ડીઝલ + 4,000 L બાયોડીઝલ = 3,520 કિલો"}}, {"id": "u3n08", "unit": 3, "h": {"en": "Molasses needed for an E10 blend.", "gu": "E10 મિશ્રણ માટે જરૂરી ગોળ."}, "q": {"en": "A fuel station sells 50,000 L of petrol a month as E10. One tonne of molasses gives 245 L of ethanol. Find the ethanol needed and the molasses per month.", "gu": "ઇંધણ સ્ટેશન મહિને 50,000 L પેટ્રોલ E10 તરીકે વેચે. એક ટન ગોળ 245 L ઇથેનોલ આપે. જરૂરી ઇથેનોલ અને મહિને ગોળ શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A fuel station sells 50,000 L of petrol a month as E10. One tonne of molasses gives 245 L of ethanol. Find the ethanol needed and the molasses per month.</p><h4>Step-by-step solution</h4><p>Ethanol = 0.10 × 50,000 = 5,000 L</p><p>Molasses = 5,000 / 245 = 20.4 t a month</p><p>Petrol replaced = 5,000 L a month, about 3,600 kg of CO₂ avoided at 2.3 kg per litre less 30 % fermentation emissions</p><h4>Answer</h4><p><b>5,000 L ethanol from 20.4 t of molasses a month</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>ઇંધણ સ્ટેશન મહિને 50,000 L પેટ્રોલ E10 તરીકે વેચે. એક ટન ગોળ 245 L ઇથેનોલ આપે. જરૂરી ઇથેનોલ અને મહિને ગોળ શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>ઇથેનોલ = 0.10 × 50,000 = 5,000 L</p><p>ગોળ = 5,000 / 245 = 20.4 ટન મહિને</p><p>બદલાયેલો પેટ્રોલ = મહિને 5,000 L, પ્રતિ લિટર 2.3 કિલો અને 30 % આથો ઉત્સર્જન બાદ લગભગ 3,600 કિલો CO₂ બચે</p><h4>જવાબ</h4><p><b>મહિને 20.4 ટન ગોળમાંથી 5,000 L ઇથેનોલ</b></p>"}, "answer": {"en": "5,000 L ethanol from 20.4 t of molasses a month", "gu": "મહિને 20.4 ટન ગોળમાંથી 5,000 L ઇથેનોલ"}}, {"id": "u3n09", "unit": 3, "h": {"en": "Output of a binary geothermal plant.", "gu": "દ્વિચક્ર ભૂતાપીય સ્ટેશનનું ઉત્પાદન."}, "q": {"en": "A binary plant takes 150 kg/s of brine at 160 °C and returns it at 90 °C. The brine has cp = 4.2 kJ/kg·K and the cycle efficiency is 12 %. Find the heat extracted and the electrical output.", "gu": "દ્વિચક્ર સ્ટેશન 160 °C પર 150 kg/s ખારું પાણી લે અને 90 °C પર પાછું આપે. ખારા પાણીનો cp = 4.2 kJ/kg·K અને ચક્ર કાર્યક્ષમતા 12 % છે. ખેંચાયેલી ઉષ્મા અને વીજ ઉત્પાદન શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A binary plant takes 150 kg/s of brine at 160 °C and returns it at 90 °C. The brine has cp = 4.2 kJ/kg·K and the cycle efficiency is 12 %. Find the heat extracted and the electrical output.</p><h4>Step-by-step solution</h4><p>Q = ṁ cp ΔT = 150 × 4.2 × (160 − 90) = 44,100 kW = 44.1 MW thermal</p><p>P = η Q = 0.12 × 44.1 = 5.29 MW electrical</p><p>The plant runs 8,000 h a year, so 42.3 GWh a year</p><h4>Answer</h4><p><b>44.1 MW thermal giving 5.29 MW electrical</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>દ્વિચક્ર સ્ટેશન 160 °C પર 150 kg/s ખારું પાણી લે અને 90 °C પર પાછું આપે. ખારા પાણીનો cp = 4.2 kJ/kg·K અને ચક્ર કાર્યક્ષમતા 12 % છે. ખેંચાયેલી ઉષ્મા અને વીજ ઉત્પાદન શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>Q = ṁ cp ΔT = 150 × 4.2 × (160 − 90) = 44,100 kW = 44.1 MW ઉષ્મા</p><p>P = η Q = 0.12 × 44.1 = 5.29 MW વીજળી</p><p>સ્ટેશન વર્ષે 8,000 કલાક ચાલે, તેથી વર્ષે 42.3 GWh</p><h4>જવાબ</h4><p><b>44.1 MW ઉષ્મા, 5.29 MW વીજળી</b></p>"}, "answer": {"en": "44.1 MW thermal giving 5.29 MW electrical", "gu": "44.1 MW ઉષ્મા, 5.29 MW વીજળી"}}, {"id": "u3n10", "unit": 3, "h": {"en": "Energy from a tidal barrage.", "gu": "ભરતી બેરેજની ઊર્જા."}, "q": {"en": "A barrage encloses a basin of 2 km² where the mean tidal range is 6 m. Sea water is 1,025 kg/m³. Find the energy of one filling and the average power over a day with two emptying cycles.", "gu": "બેરેજ 2 km² તળાવ ઘેરે છે જ્યાં સરેરાશ ભરતીનો તફાવત 6 m છે. દરિયાનું પાણી 1,025 kg/m³ છે. એક ભરણની ઊર્જા અને દિવસમાં બે ખાલી કરવાના ચક્ર સાથે સરેરાશ શક્તિ શોધો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A barrage encloses a basin of 2 km² where the mean tidal range is 6 m. Sea water is 1,025 kg/m³. Find the energy of one filling and the average power over a day with two emptying cycles.</p><h4>Step-by-step solution</h4><p>E = ½ A ρ g R² = 0.5 × 2×10⁶ × 1,025 × 9.81 × 6² = 3.62 × 10¹¹ J</p><p>Each filling holds 362 GJ, and a day has two fill-empty cycles, so 724 GJ a day</p><p>Average power = 7.24 × 10¹¹ J / 86,400 s = 8.38 MW</p><h4>Answer</h4><p><b>362 GJ per filling, 724 GJ a day, 8.38 MW average</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>બેરેજ 2 km² તળાવ ઘેરે છે જ્યાં સરેરાશ ભરતીનો તફાવત 6 m છે. દરિયાનું પાણી 1,025 kg/m³ છે. એક ભરણની ઊર્જા અને દિવસમાં બે ખાલી કરવાના ચક્ર સાથે સરેરાશ શક્તિ શોધો.</p><h4>પગલાવાર ઉકેલ</h4><p>E = ½ A ρ g R² = 0.5 × 2×10⁶ × 1,025 × 9.81 × 6² = 3.62 × 10¹¹ J</p><p>દરેક ભરણમાં 362 GJ અને દિવસમાં બે ભરણ-ખાલી ચક્ર, તેથી દિવસે 724 GJ</p><p>સરેરાશ શક્તિ = 7.24 × 10¹¹ J / 86,400 s = 8.38 MW</p><h4>જવાબ</h4><p><b>દરેક ભરણે 362 GJ, દિવસે 724 GJ, સરેરાશ 8.38 MW</b></p>"}, "answer": {"en": "362 GJ per filling, 724 GJ a day, 8.38 MW average", "gu": "દરેક ભરણે 362 GJ, દિવસે 724 GJ, સરેરાશ 8.38 MW"}}, {"id": "u3n11", "unit": 3, "h": {"en": "Hydrogen from an electrolyser.", "gu": "વિદ્યુતવિભાજકમાંથી હાઇડ્રોજન."}, "q": {"en": "A 10 MW electrolyser uses 52 kWh of electricity per kilogram of hydrogen. Find the hourly production and the efficiency, taking hydrogen's higher heating value as 39.4 kWh/kg.", "gu": "10 MW વિદ્યુતવિભાજક પ્રતિ કિલો હાઇડ્રોજન 52 kWh વીજળી વાપરે છે. કલાક દીઠ ઉત્પાદન અને કાર્યક્ષમતા શોધો; હાઇડ્રોજનનું ઊંચું ઉષ્મા મૂલ્ય 39.4 kWh/kg લો."}, "a": {"en": "<h4>Given and assumptions</h4><p>A 10 MW electrolyser uses 52 kWh of electricity per kilogram of hydrogen. Find the hourly production and the efficiency, taking hydrogen's higher heating value as 39.4 kWh/kg.</p><h4>Step-by-step solution</h4><p>Energy needed for 1 kg = 52 kWh</p><p>Production = 10,000 kW / 52 = 192 kg an hour</p><p>Energy in the gas = 192 × 39.4 = 7,565 kWh, so η = 7,565 / 10,000 = 75.7 %</p><p>If the electricity is renewable, the hydrogen is green hydrogen</p><h4>Answer</h4><p><b>192 kg an hour at 75.7 % efficiency, green hydrogen</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>10 MW વિદ્યુતવિભાજક પ્રતિ કિલો હાઇડ્રોજન 52 kWh વીજળી વાપરે છે. કલાક દીઠ ઉત્પાદન અને કાર્યક્ષમતા શોધો; હાઇડ્રોજનનું ઊંચું ઉષ્મા મૂલ્ય 39.4 kWh/kg લો.</p><h4>પગલાવાર ઉકેલ</h4><p>1 કિલો માટે જરૂરી ઊર્જા = 52 kWh</p><p>ઉત્પાદન = 10,000 kW / 52 = 192 કિલો કલાકે</p><p>ગેસમાંની ઊર્જા = 192 × 39.4 = 7,565 kWh, તેથી η = 7,565 / 10,000 = 75.7 %</p><p>વીજળી પુનઃપ્રાપ્ય હોય તો હાઇડ્રોજન લીલું હાઇડ્રોજન કહેવાય</p><h4>જવાબ</h4><p><b>કલાકે 192 કિલો, 75.7 % કાર્યક્ષમતા, લીલું હાઇડ્રોજન</b></p>"}, "answer": {"en": "192 kg an hour at 75.7 % efficiency, green hydrogen", "gu": "કલાકે 192 કિલો, 75.7 % કાર્યક્ષમતા, લીલું હાઇડ્રોજન"}}, {"id": "u3n12", "unit": 3, "h": {"en": "Carbon payback of a solar module.", "gu": "સૌર મોડ્યુલનો કાર્બન પરતફેળો."}, "q": {"en": "Making a module needs about 600 kWh of energy per square metre, and each square metre makes 210 kWh a year. Find the energy payback time and the carbon payback time if the factory electricity carries 0.71 kg CO₂ per kWh and the module displaces 0.71 kg CO₂ per kWh.", "gu": "એક ચોરસ મીટર મોડ્યુલ બનાવવા લગભગ 600 kWh ઊર્જા જોઈએ અને દરેક ચોરસ મીટર વર્ષે 210 kWh બનાવે. ઊર્જા પરતફેળાનો સમય અને કાર્બન પરતફેળાનો સમય શોધો, જો કારખાનાની વીજળી પ્રતિ kWh 0.71 કિલો CO₂ ધરે અને મોડ્યુલ પ્રતિ kWh 0.71 કિલો CO₂ બદલે."}, "a": {"en": "<h4>Given and assumptions</h4><p>Making a module needs about 600 kWh of energy per square metre, and each square metre makes 210 kWh a year. Find the energy payback time and the carbon payback time if the factory electricity carries 0.71 kg CO₂ per kWh and the module displaces 0.71 kg CO₂ per kWh.</p><h4>Step-by-step solution</h4><p>Energy payback = 600 / 210 = 2.86 years</p><p>Emissions to make it = 600 × 0.71 = 426 kg CO₂ per m²</p><p>Savings = 210 × 0.71 = 149 kg CO₂ a year, so carbon payback = 426 / 149 = 2.86 years</p><p>Over 25 years the module returns about 3,700 kg of CO₂ for every 426 kg it cost</p><h4>Answer</h4><p><b>About 2.9 years for energy and carbon, then 22 years of net saving</b></p>", "gu": "<h4>આપેલી માહિતી</h4><p>એક ચોરસ મીટર મોડ્યુલ બનાવવા લગભગ 600 kWh ઊર્જા જોઈએ અને દરેક ચોરસ મીટર વર્ષે 210 kWh બનાવે. ઊર્જા પરતફેળાનો સમય અને કાર્બન પરતફેળાનો સમય શોધો, જો કારખાનાની વીજળી પ્રતિ kWh 0.71 કિલો CO₂ ધરે અને મોડ્યુલ પ્રતિ kWh 0.71 કિલો CO₂ બદલે.</p><h4>પગલાવાર ઉકેલ</h4><p>ઊર્જા પરતફેળો = 600 / 210 = 2.86 વર્ષ</p><p>બનાવવાનું ઉત્સર્જન = 600 × 0.71 = 426 કિલો CO₂ પ્રતિ m²</p><p>બચત = 210 × 0.71 = 149 કિલો CO₂ વર્ષે, તેથી કાર્બન પરતફેળો = 426 / 149 = 2.86 વર્ષ</p><p>25 વર્ષમાં મોડ્યુલ જે 426 કિલો ખર્ચ્યું તેના બદલે લગભગ 3,700 કિલો CO₂ પાછું આપે</p><h4>જવાબ</h4><p><b>ઊર્જા અને કાર્બન બંને માટે લગભગ 2.9 વર્ષ, પછી 22 વર્ષ ચોખ્ખી બચત</b></p>"}, "answer": {"en": "About 2.9 years for energy and carbon, then 22 years of net saving", "gu": "ઊર્જા અને કાર્બન બંને માટે લગભગ 2.9 વર્ષ, પછી 22 વર્ષ ચોખ્ખી બચત"}}], "viva": [{"title": {"en": "Solar and wind", "gu": "સૌર અને પવન"}, "items": [{"q": {"en": "What is the photovoltaic effect?", "gu": "ફોટોવોલ્ટેઇક પ્રભાવ શું છે?"}, "a": {"en": "When light of sufficient energy strikes a semiconductor junction, photons free electrons and the built-in field separates them, so a voltage appears across the cell and a current flows through an external circuit. The energy of the photon must exceed the band gap, 1.1 eV for silicon.", "gu": "પૂરતી ઊર્જાવાળો પ્રકાશ અર્ધવાહક સંધિ પર પડે ત્યારે ફોટોન ઇલેક્ટ્રોન મુક્ત કરે અને આંતરિક ક્ષેત્ર તેમને અલગ કરે, તેથી સેલ પર વોલ્ટેજ દેખાય અને બહારના પરિપથમાં પ્રવાહ વહે. ફોટોનની ઊર્જા બેન્ડ ગેપ, સિલિકોન માટે 1.1 eV, થી વધુ હોવી જોઈએ."}}, {"q": {"en": "Why is the efficiency of a silicon module only about 20 % when the Shockley-Queisser limit is 33 %?", "gu": "શોકલી-ક્વાઇસર મર્યાદા 33 % હોવા છતાં સિલિકોન મોડ્યુલની કાર્યક્ષમતા ફક્ત 20 % કેમ?"}, "a": {"en": "The theoretical limit assumes one junction, no reflection and perfect contacts. A real module loses light by reflection and shade, loses the low-energy photons below the gap, loses the excess energy of high-energy photons as heat, and pays for resistance in the contacts and the busbars. Temperature adds a further 10-15 % loss on a hot afternoon, and inverter and cable losses about 10 %.", "gu": "સૈદ્ધાંતિક મર્યાદા એક સંધિ, કોઈ પરાવર્તન નહીં અને સંપૂર્ણ સંપર્ક ધારે છે. વાસ્તવિક મોડ્યુલ પરાવર્તન અને છાયાથી પ્રકાશ ગુમાવે, ગેપથી નીચેના ઓછી ઊર્જાવાળા ફોટોન ગુમાવે, ઊંચી ઊર્જાવાળા ફોટોનની વધારાની ઊર્જા ઉષ્મા તરીકે ગુમાવે અને સંપર્ક તથા બસબારના અવરોધનો ભોગ બને. ગરમ બપોરે તાપમાન 10-15 % વધુ ખોટ ઉમેરે અને ઇન્વર્ટર-કેબલની ખોટ લગભગ 10 %."}}, {"q": {"en": "Which is better, a monocrystalline or a polycrystalline module?", "gu": "મોનોક્રિસ્ટાલાઇન કે પોલીક્રિસ્ટાલાઇન મોડ્યુલ કયું સારું?"}, "a": {"en": "Monocrystalline gives 20-23 % against 15-18 %, so it needs 20-25 % less roof area for the same kW and today costs only slightly more. It is the right choice where area is limited, as on a city roof. Polycrystalline is chosen only when the budget per kW is the deciding factor and area is free; on a large ground plant the extra land usually costs more than the saving.", "gu": "મોનોક્રિસ્ટાલાઇન 20-23 % આપે, પોલીક્રિસ્ટાલાઇન 15-18 %, તેથી સમાન kW માટે 20-25 % ઓછી છતની જગ્યા જોઈએ અને આજે ભાવ થોડો જ વધુ છે. જ્યાં જગ્યા મર્યાદિત હોય, જેમ કે શહેરની છત પર, તે યોગ્ય પસંદગી છે. પોલીક્રિસ્ટાલાઇન ત્યારે જ પસંદ કરાય જ્યાં પ્રતિ kW બજેટ નિર્ણાયક હોય અને જમીન મફત હોય; મોટા જમીન સ્ટેશનમાં વધારાની જમીનનો ખર્ચ સામાન્ય રીતે બચત કરતાં વધુ પડે."}}, {"q": {"en": "What is the Betz limit and why does it exist?", "gu": "બેટ્ઝ મર્યાદા શું છે અને તે કેમ અસ્તિત્વમાં છે?"}, "a": {"en": "Betz showed that a rotor can extract at most 16/27, about 59.3 %, of the power in the wind. The wind that leaves the rotor must still be moving, otherwise no more air could enter the disc; the slower it leaves, the more energy is taken but the less mass flows through, and the product is maximum at one third of the approach speed. Real turbines reach 70-80 % of this limit, that is Cp of 0.40-0.50.", "gu": "બેટ્ઝે દર્શાવ્યું કે રોટર પવનમાંની શક્તિના વધુમાં વધુ 16/27, લગભગ 59.3 %, ખેંચી શકે. રોટર છોડીને જતો પવન હજી ચાલતો હોવો જોઈએ, નહીં તો વધુ હવા ડિસ્કમાં આવી ન શકે; જેટલો ધીમો નીકળે તેટલી વધુ ઊર્જા લેવાય પણ ઓછું દળ પસાર થાય, અને ગુણાકાર આવનારી ગતિના એક તૃતીયાંશ પર મહત્તમ થાય. વાસ્તવિક ટર્બાઇન આ મર્યાદાના 70-80 %, એટલે Cp 0.40-0.50, પામે."}}, {"q": {"en": "Why are wind turbines built so tall with such long blades?", "gu": "પવન ટર્બાઇન આટલા ઊંચા અને બ્લેડ આટલા લાંબા કેમ બનાવાય?"}, "a": {"en": "Wind speed rises with height because the ground and buildings slow the air, so a hub at 120 m sees 20-30 % more wind than at 50 m, and power goes with the cube of speed. The swept area goes with the square of the blade length, so doubling the blade gives four times the area and roughly four times the energy from the same wind, while the cost of the tower and blades grows much more slowly.", "gu": "જમીન અને ઇમારતો હવાને ધીમી કરતાં હોવાથી પવનની ગતિ ઊંચાઈ સાથે વધે, તેથી 120 m પરનું હબ 50 m કરતાં 20-30 % વધુ પવન જુએ અને શક્તિ ગતિના ઘન પ્રમાણમાં હોય. ઘેરાયેલો વિસ્તાર બ્લેડની લંબાઈના વર્ગ પ્રમાણમાં હોય, તેથી બ્લેડ બમણી થાય તો વિસ્તાર ચાર ગણો અને સમાન પવનમાંથી લગભગ ચાર ગણી ઊર્જા મળે, જ્યારે ટાવર અને બ્લેડનો ખર્ચ ઘણો ધીમે વધે."}}, {"q": {"en": "What is the difference between kWp and kWh?", "gu": "kWp અને kWh વચ્ચે શું ફરક છે?"}, "a": {"en": "kWp is the peak power a module or plant can deliver at standard test conditions - 1,000 W/m² and 25 °C - so it describes the size of the equipment. kWh is the energy actually delivered over a period, so it describes the work done. A 5 kWp plant that runs 4.6 peak sun hours at a performance ratio of 0.80 gives 5 × 4.6 × 0.80 = 18.4 kWh a day. The ratio of the two is the capacity factor, and it is the number that decides the cost per unit.", "gu": "kWp એ પ્રમાણભૂત પરીક્ષણ સ્થિતિ - 1,000 W/m² અને 25 °C - પર મોડ્યુલ કે સ્ટેશન આપી શકે તેવી ટોચની શક્તિ છે, તેથી તે સાધનનું માપ કહે. kWh એ સમયગાળામાં ખરેખર આપેલી ઊર્જા છે, તેથી તે થયેલું કામ કહે. 5 kWp સ્ટેશન 4.6 પીક સન અવર્સ અને 0.80 કાર્યદક્ષતા ગુણોત્તરે દિવસે 5 × 4.6 × 0.80 = 18.4 kWh આપે. બંનેનો ગુણોત્તર ક્ષમતા અવયવ છે અને તે જ પ્રતિ યુનિટ ખર્ચ નક્કી કરે."}}, {"q": {"en": "Where would you use a VAWT instead of a HAWT?", "gu": "HAWTને બદલે VAWT ક્યાં વાપરશો?"}, "a": {"en": "A VAWT accepts wind from any direction, needs no yaw drive, is quiet and safe for birds, and puts its generator at ground level, so it suits rooftops, street lamps, water pumping in remote fields and places with turbulent, shifting wind. Its low Cp of 0.15-0.35 rules it out for wind farms, where a HAWT with a large swept area and Cp near 0.45 is far cheaper per unit of energy.", "gu": "VAWT ગમે તે દિશાનો પવન સ્વીકારે, યો ડ્રાઇવ ન જોઈએ, શાંત છે અને પક્ષીઓ માટે સુરક્ષિત છે, અને જનરેટર જમીન સ્તરે રાખે, તેથી તે છત, શેરી દીવા, દૂરના ખેતરમાં પાણી ઉપાડવા અને અશાંત બદલાતા પવનવાળાં સ્થળો માટે યોગ્ય છે. તેનો નીચો Cp 0.15-0.35 તેને પવન ફાર્મ માટે અયોગ્ય કરે, જ્યાં મોટા ઘેરાયેલા વિસ્તાર અને 0.45ની નજીક Cp વાળું HAWT પ્રતિ યુનિટ ઊર્જા ઘણું સસ્તું પડે."}}]}, {"title": {"en": "Bioenergy and new sources", "gu": "બાયોએનર્જી અને નવા સ્રોત"}, "items": [{"q": {"en": "What is the difference between gasification and combustion of biomass?", "gu": "બાયોમાસના ગેસિફિકેશન અને દહનમાં શું ફરક છે?"}, "a": {"en": "Combustion supplies enough oxygen for complete burning and gives heat, CO₂ and water. Gasification supplies only 20-30 % of the air needed, so the biomass cannot burn fully; it is cracked at 700-900 °C into producer gas containing CO, H₂, CH₄ and N₂. That gas can be piped, cleaned and burnt in an engine, which gives electricity from biomass with better control and lower tar and smoke than a plain chulha.", "gu": "દહન પૂરતો ઓક્સિજન આપે છે અને ઉષ્મા, CO₂ તથા પાણી આપે. ગેસિફિકેશન જરૂરી હવાના ફક્ત 20-30 % આપે, તેથી બાયોમાસ પૂરેપૂરું બળી શકતું નથી; તે 700-900 °C પર તૂટીને CO, H₂, CH₄ અને N₂ ધરતો પ્રોડ્યુસર ગેસ બને. તે ગેસ પાઇપમાં લઈ જઈ, સાફ કરી એન્જિનમાં બાળી શકાય, જેથી બાયોમાસમાંથી વધુ નિયંત્રણ અને સાદા ચૂલા કરતાં ઓછા ડામર અને ધુમાડા સાથે વીજળી મળે."}}, {"q": {"en": "Why is biogas called a better fuel than dung cake?", "gu": "બાયોગેસ છાણના થાપા કરતાં સારું ઇંધણ કેમ કહેવાય?"}, "a": {"en": "Biogas is 55-65 % methane, so it burns with a clean blue flame, no smoke and high efficiency, and can run an engine. Dung cake burns badly, fills the kitchen with smoke and PM2.5, wastes the nitrogen as ammonia, and destroys the organic matter the soil needs. Digesting the dung first traps the methane that would otherwise escape, gives the gas for cooking, and leaves a digestate that is a better fertiliser than the raw dung, so one input gives fuel, health and soil.", "gu": "બાયોગેસ 55-65 % મિથેન છે, તેથી તે સ્વચ્છ ભૂરી જ્યોતથી બળે, ધુમાડો નહીં અને કાર્યક્ષમતા ઊંચી, અને એન્જિન ચલાવી શકે. છાણનો થાપો ખરાબ બળે, રસોડું ધુમાડા અને PM2.5થી ભરે, નાઇટ્રોજનને એમોનિયા તરીકે વેડફે અને જમીનને જરૂરી કાર્બનિક દ્રવ્ય નષ્ટ કરે. છાણનું પ્રથમ પાચન જે મિથેન હવામાં જતું રહેતું તે પકડે, રાંધવા ગેસ આપે અને કાચા છાણ કરતાં સારું ખાતર આપે, તેથી એક જ ઇનપુટ ઇંધણ, આરોગ્ય અને જમીન ત્રણેય આપે."}}, {"q": {"en": "What is the difference between tidal and wave energy?", "gu": "ભરતી અને તરંગ ઊર્જામાં શું ફરક છે?"}, "a": {"en": "Tides are the slow vertical rise and fall of the sea caused by the gravity of the moon and the sun; their timing is fixed by astronomy, so tidal energy is predictable years in advance but needs a barrage or a strong tidal stream. Waves are wind-driven surface motion, strong and continuous but irregular; wave devices must survive storms and produce intermittent power. Tidal has high capital cost and few sites, wave has many sites but immature technology.", "gu": "ભરતી એ ચંદ્ર અને સૂર્યના ગુરુત્વાકર્ષણથી થતું દરિયાનું ધીમું ઊભું ચઢ-ઊતર છે; તેનો સમય ખગોળશાસ્ત્રથી નિશ્ચિત હોય, તેથી ભરતી ઊર્જા વર્ષો પહેલાં અનુમાનિત છે પણ તેને બેરેજ કે તાકાતવાન ભરતી પ્રવાહ જોઈએ. તરંગો પવનથી ચાલતી સપાટીની હિલચાલ છે, તાકાતવાન અને સતત પણ અનિયમિત; તરંગ સાધનોએ તોફાન સહેવું પડે અને વીજળી અનિયમિત આપે. ભરતીનો મૂડી ખર્ચ ઊંચો અને સ્થળો ઓછાં, તરંગનાં સ્થળો ઘણાં પણ ટેક્નોલોજી અપરિપક્વ."}}, {"q": {"en": "Why is hydrogen called an energy carrier and not an energy source?", "gu": "હાઇડ્રોજનને ઊર્જા સ્રોત નહીં પણ ઊર્જા વાહક કેમ કહેવાય?"}, "a": {"en": "Because it does not occur free in useful quantities on earth; it is locked in water and hydrocarbons and must be made with another source of energy, so it stores and carries energy from where it was produced to where it is used. Burning it or running it through a fuel cell gives back less energy than was spent making and compressing it, exactly like a battery, so it is compared with batteries and transmission lines rather than with coal or the sun.", "gu": "કારણ કે તે પૃથ્વી પર ઉપયોગી પ્રમાણમાં મુક્ત મળતું નથી; તે પાણી અને હાઇડ્રોકાર્બનમાં બંધ છે અને બીજા ઊર્જા સ્રોતથી બનાવવું પડે, તેથી તે ઊર્જા સંગ્રહે અને જ્યાં બન્યું ત્યાંથી જ્યાં વપરાય ત્યાં લઈ જાય. તેને બાળવાથી કે ઇંધણ કોષમાંથી ચલાવવાથી બનાવવા અને દબાવવામાં ખર્ચેલી ઊર્જા કરતાં ઓછી ઊર્જા પાછી મળે, બરાબર બેટરી જેવું, તેથી તેની સરખામણી કોલસા કે સૂર્ય સાથે નહીં, બેટરી અને ટ્રાન્સમિશન લાઇન સાથે થાય."}}, {"q": {"en": "What decides the colour of hydrogen, and why does it matter?", "gu": "હાઇડ્રોજનનો રંગ શું નક્કી કરે અને તે કેમ મહત્ત્વનું છે?"}, "a": {"en": "The colour names the production route, not the gas. Grey comes from steam reforming of natural gas and emits about ten kilograms of CO₂ per kilogram of hydrogen; blue is the same plant with carbon capture, one to two kilograms; green is electrolysis with renewable electricity and almost none; turquoise is methane pyrolysis, which gives solid carbon. It matters because only green and turquoise hydrogen actually cut emissions, and hydrogen is sold on that guarantee.", "gu": "રંગ ગેસ નહીં, ઉત્પાદન માર્ગનું નામ છે. ભૂખરું કુદરતી ગેસના વરાળ સુધારણમાંથી આવે અને પ્રતિ કિલો હાઇડ્રોજન લગભગ દસ કિલો CO₂ છોડે; વાદળી તે જ સ્ટેશન કાર્બન પકડ સાથે, એકથી બે કિલો; લીલું પુનઃપ્રાપ્ય વીજળીથી વિદ્યુતવિભાજન, લગભગ શૂન્ય; ફિરોઝી મિથેન પાયરોલિસિસ, જે ઘન કાર્બન આપે. તે મહત્ત્વનું છે કારણ કે ફક્ત લીલું અને ફિરોઝી હાઇડ્રોજન ખરેખર ઉત્સર્જન ઘટાડે, અને હાઇડ્રોજન તે ખાતરી પર વેચાય."}}, {"q": {"en": "What is the capacity factor and why does it matter more than the rating?", "gu": "ક્ષમતા અવયવ શું છે અને તે રેટિંગ કરતાં વધુ કેમ મહત્ત્વનો છે?"}, "a": {"en": "Capacity factor is the actual energy produced in a year divided by the energy the plant would make running flat out all year. A 2 MW turbine at 32 % makes 5.6 GWh; the same 2 MW at a poor 18 % site makes 3.2 GWh. Since the capital cost is nearly the same, the cost per unit changes by 75 %, so a wind site is judged by its capacity factor and not by the nameplate rating painted on the nacelle.", "gu": "ક્ષમતા અવયવ એ વર્ષમાં ખરેખર ઉત્પાદિત ઊર્જા ભાગ્યા સ્ટેશન આખું વર્ષ પૂરી ક્ષમતાએ ચાલે તો બનતી ઊર્જા છે. 32 % પર 2 MW ટર્બાઇન 5.6 GWh બનાવે; નબળા 18 % સ્થળે તે જ 2 MW 3.2 GWh બનાવે. મૂડી ખર્ચ લગભગ સરખો હોય તેથી પ્રતિ યુનિટ ખર્ચ 75 % બદલાય, તેથી પવન સ્થળ તેના ક્ષમતા અવયવથી માપાય, નેસેલ પર લખેલા રેટિંગથી નહીં."}}, {"q": {"en": "Why can a renewable plant not replace a coal plant unit for unit?", "gu": "પુનઃપ્રાપ્ય સ્ટેશન કોલસા સ્ટેશનને એકના એક બદલી કેમ ન શકે?"}, "a": {"en": "Because its output is not firm. A coal plant can be asked for 500 MW at any hour; a solar plant gives nothing after sunset and a wind plant nothing in a calm spell, and the grid must keep supply and demand equal every second. So a renewable plant is paired with storage, a gas peaker, demand response or a stronger grid, and the comparison is made on firm capacity and on the total system cost, not on the cheapest hour of the day.", "gu": "કારણ કે તેનું ઉત્પાદન નિશ્ચિત નથી. કોલસા સ્ટેશન પાસે ગમે તે કલાકે 500 MW માંગી શકાય; સૌર સ્ટેશન સૂર્યાસ્ત પછી કંઈ ન આપે અને પવન સ્ટેશન શાંત સમયે કંઈ ન આપે, જ્યારે ગ્રિડે દરેક સેકન્ડે પુરવઠો અને માંગ સમાન રાખવાં પડે. તેથી પુનઃપ્રાપ્ય સ્ટેશન સંગ્રહ, ગેસ પીકર, માંગ પ્રતિભાવ કે મજબૂત ગ્રિડ સાથે જોડાય, અને સરખામણી નિશ્ચિત ક્ષમતા તથા કુલ પ્રણાલી ખર્ચ પર થાય, દિવસના સૌથી સસ્તા કલાક પર નહીં."}}]}], "exam_questions": [{"q": {"en": "Practice: Explain, with figures, how a renewable source reduces the carbon footprint of a campus.", "gu": "સરાવ: આંકડા સાથે સમજાવો કે પુનઃપ્રાપ્ય સ્રોત કેમ્પસનું કાર્બન ફૂટપ્રિન્ટ કેવી રીતે ઘટાડે."}, "marks": 5}, {"q": {"en": "Practice: Compare renewable and non-renewable energy sources on at least six points and conclude.", "gu": "સરાવ: ઓછામાં ઓછા છ મુદ્દા પર પુનઃપ્રાપ્ય અને બિન-પુનઃપ્રાપ્ય ઊર્જા સ્રોતોની સરખામણી કરી નિષ્કર્ષ આપો."}, "marks": 5}, {"q": {"en": "Practice: Describe a solar PV cell with a sketch and explain how a module, a string and an array differ.", "gu": "સરાવ: સૌર PV સેલનું રેખાચિત્ર સાથે વર્ણન કરો અને મોડ્યુલ, શ્રેણી તથા એરે કેવી રીતે જુદા પડે તે સમજાવો."}, "marks": 4}, {"q": {"en": "Practice: What are the main types of solar cells? Give efficiency and one use of each.", "gu": "સરાવ: સૌર સેલના મુખ્ય પ્રકાર કયા છે? દરેકની કાર્યક્ષમતા અને એક ઉપયોગ આપો."}, "marks": 4}, {"q": {"en": "Practice: Compare HAWT and VAWT with a neat sketch and state where each is used.", "gu": "સરાવ: સ્વચ્છ રેખાચિત્ર સાથે HAWT અને VAWTની સરખામણી કરો અને દરેક ક્યાં વપરાય તે જણાવો."}, "marks": 5}, {"q": {"en": "Practice: Describe the parts and operation of a horizontal-axis wind turbine.", "gu": "સરાવ: આડી અક્ષની પવન ટર્બાઇનના ભાગો અને કાર્યપદ્ધતિનું વર્ણન કરો."}, "marks": 4}, {"q": {"en": "Practice: What is a bladeless wind turbine? State its advantages and limitations.", "gu": "સરાવ: બ્લેડ વગરની પવન ટર્બાઇન શું છે? તેના લાભ અને મર્યાદા જણાવો."}, "marks": 3}, {"q": {"en": "Practice: Explain the production of ethanol and biodiesel in India with the reactions and blends.", "gu": "સરાવ: ભારતમાં ઇથેનોલ અને બાયોડીઝલના ઉત્પાદનને પ્રક્રિયા અને મિશ્રણ સાથે સમજાવો."}, "marks": 5}, {"q": {"en": "Practice: Explain biomass gasification with a block diagram and compare it with anaerobic digestion.", "gu": "સરાવ: બ્લોક ડાયાગ્રામ સાથે બાયોમાસ ગેસિફિકેશન સમજાવો અને અવાયુજીવી પાચન સાથે સરખાવો."}, "marks": 5}, {"q": {"en": "Practice: Explain geothermal energy with its three plant types and India's position.", "gu": "સરાવ: ભૂતાપીય ઊર્જા તેના ત્રણ સ્ટેશન પ્રકાર અને ભારતની સ્થિતિ સાથે સમજાવો."}, "marks": 4}, {"q": {"en": "Practice: Write short notes on ocean energy and hydrogen as a future fuel.", "gu": "સરાવ: મહાસાગર ઊર્જા અને ભવિષ્યના ઇંધણ તરીકે હાઇડ્રોજન પર ટૂંકી નોંધ લખો."}, "marks": 5}, {"q": {"en": "Practice: A village of 400 homes needs 250 kWh a day. Design a solar-wind hybrid and justify it.", "gu": "સરાવ: 400 ઘરવાળા ગામને દિવસે 250 kWh જોઈએ. સૌર-પવન સંકર પ્રણાલી રચો અને તેનું સમર્થન કરો."}, "marks": 5}], "learning_outcomes": [{"en": "Evaluate renewable energy technologies for a given site or application.", "gu": "આપેલ સ્થળ કે ઉપયોગ માટે નવીકરણીય ઊર્જા ટેકનોલોજીનું મૂલ્યાંકન કરવું."}], "course_outcomes": ["CO3"], "practical_numbers": [], "content_kind": "theory", "lesson_count": 11, "answered_practice_count": 12, "assessment_note": {"en": "Official course: theory ESE 70 + PA 30 = 100 marks, 2 credits, 30 teaching hours, no practical. This unit carries 25 % weightage, 7 of the 30 hours and 18 of the 70 theory marks (the PDF prints weightage only, so the marks are split by weightage). Practice marks 3/4/5 are suggested revision sizes, not GTU allocations. Model answers are in Notes section 5.", "gu": "અધિકૃત કોર્સ: થિયરી ESE 70 + PA 30 = 100 માર્ક્સ, 2 ક્રેડિટ, 30 શિક્ષણ કલાક, પ્રેક્ટિકલ નથી. આ યુનિટનું વેઇટેજ 25 %, 30માંથી 7 કલાક અને 70 થિયરી માર્ક્સમાંથી 18 માર્ક્સ (PDFમાં ફક્ત વેઇટેજ છે, તેથી માર્ક્સ વેઇટેજ પ્રમાણે વહેંચ્યા છે). સરાવના 3/4/5 માર્ક્સ સૂચિત પુનરાવર્તન માપ છે, GTU ફાળવણી નહીં. આદર્શ જવાબો નોંધ વિભાગ 5માં છે."}, "question_provenance": "Original answered revision questions; not official past papers", "question_marks_are_suggested": true, "sources": [{"title": "GTU DI02000051 Environmental Sustainability syllabus (uploaded PDF, w.e.f. 2024-25)", "url": "https://syllabus.gtu.ac.in/"}, {"title": "C. S. Solanki - Renewable Energy Technologies: A Practical Guide for Beginners, PHI Learning", "url": "https://www.envis.nic.in/"}, {"title": "Ministry of New and Renewable Energy (MNRE) annual report and solar, wind and biogas programmes", "url": "https://www.envis.nic.in/"}, {"title": "NISE and NIWE technical notes on solar modules and wind turbine classes", "url": "https://www.envis.nic.in/"}, {"title": "IPCC AR6 WG III chapter on energy systems, and IEA renewable energy market reports", "url": "https://www.envis.nic.in/"}]};

const flowcharts = diagrams;
const algorithms = () => syntax('algorithms');
const ALLV = {notes, programs, diagrams, flowcharts, algorithms, syntax, equations, numericals, viva, exam};
const VIEWS = U.tabs ? Object.fromEntries(U.tabs.map(k=>[k, ALLV[k]])) : U.programs ? (META.code_lang==='python' ? {notes, programs, diagrams, syntax, viva, exam} : {notes, programs, flowcharts, syntax, viva, exam}) : U.numericals ? {notes, diagrams, equations, numericals, viva, exam} : {notes, diagrams, equations, viva, exam};
function render(){
  document.getElementById('title').textContent = `${L('unit')} ${U.unit}: ${t(U.title)}`;
  document.getElementById('sub').textContent = `${t(META.name)} · ${META.code}`;
  document.getElementById('lang').textContent = S.lang==='en' ? 'ગુ' : 'EN';
  document.getElementById('lang').style.display = META.languages.includes('gu') ? '' : 'none';
  document.getElementById('tabs').innerHTML = Object.keys(VIEWS).map(k=>`<button class="tab${S.tab===k?' on':''}" data-tab="${k}">${L(k)}</button>`).join('');
  document.getElementById('view').innerHTML = VIEWS[S.tab]();
  document.querySelectorAll('#view pre.c').forEach(e=>{ e.innerHTML = hl(e.textContent); e.className='code'; });
}
let zoom = 1;
function setZoom(z){ zoom = Math.min(4, Math.max(1, z)); const w=document.getElementById('zw'); w.style.width=(zoom*100)+'%'; document.getElementById('zr').textContent=Math.round(zoom*100)+'%'; }
document.addEventListener('click', e=>{
  const q = e.target.closest('.q'); if (q && q.parentElement.querySelector('.a')) { q.parentElement.classList.toggle('open'); return; }
  const tb = e.target.closest('[data-tab]'); if (tb){ S.tab = tb.dataset.tab; render(); window.scrollTo(0,0); return; }
  if (e.target.closest('#lang')){ S.lang = S.lang==='en'?'gu':'en'; render(); return; }
  const m = e.target.closest('[data-more]');
  document.querySelectorAll('.menu.show').forEach(x=>{ if(!m || x!==m.nextElementSibling) x.classList.remove('show'); });
  if (m){ m.nextElementSibling.classList.toggle('show'); return; }
  const act = e.target.closest('[data-act]');
  if (act){ act.closest('.sec').querySelectorAll('.card').forEach(c=>{ if(c.querySelector('.a')) c.classList.toggle('open', act.dataset.act==='expand'); }); act.parentElement.classList.remove('show'); return; }
  const dg = e.target.closest('[data-dg]');
  if (dg){ const id=dg.dataset.dg; document.getElementById('mt').textContent=t(U.diagrams.find(d=>d.id===id).title); document.getElementById('zw').innerHTML=SVG[id]; setZoom(1); document.getElementById('modal').classList.add('show'); return; }
  if (e.target.closest('#mx')) document.getElementById('modal').classList.remove('show');
  if (e.target.closest('#zi')) setZoom(zoom+0.5);
  if (e.target.closest('#zo')) setZoom(zoom-0.5);
  if (e.target.closest('#zr')) setZoom(1);
});
render();
</script>
