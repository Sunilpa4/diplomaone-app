<script>
const U = {"subject": "DI01000031", "unit": 3, "format": "notes", "title": {"en": "Prose and Poetry"}, "hours": 6, "weightage": 20, "official": true, "languages": ["en"], "tabs": ["notes", "diagrams", "viva", "exam"], "intro_text": {"en": "Unit 3 of Communication Skills in English: Ruskin Bond's short story <i>The Leopard</i>, O. Henry's <i>After Twenty Years</i> and Robert Frost's poem <i>Stopping by Woods on a Snowy Evening</i>. Each text is treated in the same way - author and setting, a stanza-by-stanza or step-by-step summary, characters or voice, themes, devices and the lines worth quoting - and each closes with an answer plan. Fifteen answered questions are in section 4."}, "notes": [{"title": {"en": "1. Prose: The Leopard - Ruskin Bond"}, "items": [{"h": {"en": "1.1 The writer and the story"}, "body": {"en": "<h4>About the writer</h4><p><b>Ruskin Bond</b> (born 1934) is an Indian writer of English who has lived most of his life in the Himalayan foothills, at Dehradun, Shimla and now Landour near Mussoorie. He writes simply, about small towns, children, and the animals and trees around him.</p><table><tr><th>Work</th><th>What to remember</th></tr><tr><td>The Room on the Roof (1956)</td><td>written at seventeen; won the John Llewellyn Rhys Prize</td></tr><tr><td>The Blue Umbrella</td><td>a short novel about a girl and her umbrella</td></tr><tr><td>A Flight of Pigeons</td><td>set in 1857; filmed as Junoon</td></tr><tr><td>The Leopard</td><td>a short story about a leopard, hunters and a broken trust</td></tr><tr><td>Rusty stories</td><td>the boy Rusty, who is close to Bond's own childhood</td></tr></table><h4>The story at a glance</h4><table><tr><th>Point</th><th>Detail</th></tr><tr><td>Form</td><td>short story, first-person narration</td></tr><tr><td>Setting</td><td>a deep ravine with a stream, below a hill station in the Himalayan foothills</td></tr><tr><td>Time</td><td>a few weeks in one season</td></tr><tr><td>Narrator</td><td>a writer who walks the ravine every day</td></tr><tr><td>Main events</td><td>a leopard is met, trusted, hidden, then killed</td></tr><tr><td>Tone</td><td>quiet, observant, sad at the end</td></tr></table><h4>Example of the writing</h4><p>Bond describes the ravine as a place of ferns, bird calls and running water, so that the reader feels the quiet before the hunters bring noise into it.</p><h4>Common mistake</h4><p>Calling the narrator \"the author\" and the story \"a true story\". The narrator speaks in the first person, which is a technique; the events are fiction shaped from the writer's hill life.</p>"}, "syllabus_item": "3.1"}, {"h": {"en": "1.2 The setting and the narrator's walks"}, "body": {"en": "<h4>Summary</h4><p>The narrator lives near a hill station. Below the town a deep ravine runs down to a stream, thick with ferns, moss, and the trees of the lower Himalaya. Most people never go down there; he goes almost every day.</p><p>Because he walks the same path quietly and carries no gun, the animals stop treating him as a danger. Birds go on feeding while he stands a few metres away; deer and a red fox cross his path without alarm.</p><h4>Why the setting matters</h4><ul><li>The ravine is a <b>sanctuary</b>: a small piece of wild land left alone by the town.</li><li>It is <b>below</b> the hill station, so the town's growth presses on it from above.</li><li>Its quiet is the story's most valuable possession, and it is what the ending takes away.</li></ul><h4>Examples from the text</h4><p>The narrator notices small things - the sound of the stream, the call of a bird, the way a deer lifts its head - rather than large events. That habit of noticing is what makes the leopard's trust believable.</p><h4>Common mistake</h4><p>Treating the ravine as scenery only. In this story the place is a character: it shelters the leopard, and its silence at the end reports the loss.</p>"}, "syllabus_item": "3.1"}, {"h": {"en": "1.3 The meeting with the leopard"}, "body": {"en": "<h4>Summary</h4><p>One evening the narrator sees a leopard at the stream. Both freeze. The leopard drinks, looks at him, and goes back into the trees.</p><p>After that the meeting repeats. Over days and weeks the leopard learns that this man does not throw stones, does not shout and does not carry a gun. They begin to share the ravine: the leopard drinks while the narrator sits at a distance, and neither runs.</p><p>The trust is never friendship. He does not feed it or touch it. It is a <b>tolerance</b> - two animals, one of them human, agreeing to leave each other alone.</p><h4>Details that carry the meaning</h4><table><tr><th>Detail</th><th>What it shows</th></tr><tr><td>the leopard drinks without hurry</td><td>it no longer fears him</td></tr><tr><td>the narrator keeps his distance</td><td>his respect for the wild</td></tr><tr><td>he tells nobody at first</td><td>the ravine is a private world</td></tr><tr><td>no gun, no camera, no crowd</td><td>trust needs silence</td></tr></table><h4>Example of the change</h4><p>Early in the story a movement in the grass makes the narrator hold his breath; later the same movement only makes him look up. The change is in him as much as in the leopard.</p><h4>Common mistake</h4><p>Writing that \"the narrator tamed the leopard\". Nothing is tamed: the leopard stays wild, and that is exactly why its death matters.</p>"}, "syllabus_item": "3.1"}, {"h": {"en": "1.4 The hunters arrive"}, "body": {"en": "<h4>Summary</h4><p>Word reaches the town that a leopard has been seen near the village. Hunters - shikaris - come up with guns, looking for a skin. They meet the narrator on the path and ask him whether he has seen the leopard.</p><p>He says he has seen nothing. The lie is a choice: he knows where the leopard drinks and when, and he refuses to sell that knowledge.</p><p>The hunters talk openly about money. A leopard skin, they say, sells in Delhi for more than a thousand rupees. That single figure turns the animal into a price.</p><h4>The moral choice</h4><table><tr><th>Choice open to the narrator</th><th>Consequence</th></tr><tr><td>tell the hunters where it drinks</td><td>quick money, a dead leopard</td></tr><tr><td>say nothing</td><td>buys time, but does not stop the hunt</td></tr><tr><td>report the hunters to the authorities</td><td>would need proof, and he has none</td></tr></table><h4>Examples of the hunters' talk</h4><p>They describe the animal by the money it will bring, not by its size, age or beauty. Their language is a market language; his is a watcher's language.</p><h4>Common mistake</h4><p>Saying the narrator \"saved\" the leopard. His silence delays the hunt; it does not end it. A story about a small good act that is not enough is stronger than a story about a rescue.</p>"}, "diagram": "lit4_conflict", "syllabus_item": "3.1"}, {"h": {"en": "1.5 The kill and the silent forest"}, "body": {"en": "<h4>Summary</h4><p>The hunters find the leopard without his help and shoot it. They take the skin and leave. The ravine, which had been full of small sounds, becomes silent: no bird call, no deer, no fox.</p><p>The narrator walks home through that silence. Bond's closing thought is that it was \"almost as though the birds and animals knew their trust had been violated\".</p><p>The story ends without a speech, a trial or a punishment. The loss is simply there, and the reader is left with it.</p><h4>Why the ending works</h4><ul><li>The silence is <b>evidence</b>: the reader hears the absence.</li><li>The animals' imagined knowledge makes the whole wild world a witness.</li><li>No revenge is shown, so the injustice stays open in the reader's mind.</li></ul><h4>Examples of what has changed</h4><table><tr><th>Before the hunters</th><th>After the hunters</th></tr><tr><td>birds feed close by</td><td>no bird call</td></tr><tr><td>the leopard drinks at the stream</td><td>the stream runs alone</td></tr><tr><td>the ravine is a refuge</td><td>the ravine is a killing ground</td></tr><tr><td>the narrator belongs there</td><td>he walks home as an outsider</td></tr></table><h4>Common mistake</h4><p>Reading the ending as only sad. It is also an accusation: the trust was broken by the people who came for money, and the narrator's silence made him part of the human side of that break.</p>"}, "diagram": "lit1_plot", "syllabus_item": "3.1"}, {"h": {"en": "1.6 Themes"}, "body": {"en": "<h4>The five themes</h4><table><tr><th>Theme</th><th>Where it appears</th></tr><tr><td>Man and nature</td><td>the ravine shared by a man and a leopard</td></tr><tr><td>Trust and betrayal</td><td>the leopard trusts; the hunters kill; the forest falls silent</td></tr><tr><td>Greed and the skin trade</td><td>a skin worth over a thousand rupees in Delhi</td></tr><tr><td>Conservation</td><td>a small wild place pressed by a growing hill station</td></tr><tr><td>The limits of individual goodness</td><td>the narrator's silence is honest but not enough</td></tr></table><h4>How to write about a theme</h4><p>Name the theme, give one moment from the story, and say what the story suggests. For example: <i>The theme of greed appears when the hunters price the leopard at a thousand rupees; Bond suggests that a market value can erase a living creature.</i></p><h4>Examples of theme sentences you can reuse</h4><ul><li>Trust in this story is a habit of not harming, not a promise.</li><li>The forest's silence is Bond's way of showing grief without a funeral.</li><li>The hill station grows, the ravine shrinks, and the leopard has nowhere else to go.</li></ul><h4>Common mistake</h4><p>Writing a paragraph on \"environment\" without once mentioning this story. Every theme answer needs a moment from the text.</p>"}, "syllabus_item": "3.1"}, {"h": {"en": "1.7 Characters"}, "body": {"en": "<h4>The narrator</h4><p>A writer and a walker. Quiet, observant, patient, and physically unarmed. He loves the ravine and is accepted by its animals. His strength is attention; his weakness is that he acts only by silence.</p><h4>The leopard</h4><p>Wild, cautious and, in the end, defenceless. It is not a pet and does not seek the man out; it simply stops fearing him. It stands for the wild itself - beautiful, dangerous to others, and unable to defend itself against a rifle.</p><h4>The hunters</h4><p>Professional, cheerful and commercial. They are not shown as monsters; that is what makes them frightening. They talk about money while the narrator talks about the stream.</p><h4>Character table for revision</h4><table><tr><th>Character</th><th>Three words</th><th>One line of evidence</th></tr><tr><td>Narrator</td><td>quiet, watchful, honest</td><td>he says he has seen nothing</td></tr><tr><td>Leopard</td><td>wild, trusting, doomed</td><td>it drinks while he sits nearby</td></tr><tr><td>Hunters</td><td>businesslike, boastful, greedy</td><td>\"skins sell in Delhi for over a thousand rupees\"</td></tr></table><h4>Common mistake</h4><p>Describing the hunters as \"evil men\". Bond gives them ordinary manners, which makes the point sharper: ordinary people do this for money.</p>"}, "syllabus_item": "3.1"}, {"h": {"en": "1.8 Style, symbols and exam notes"}, "body": {"en": "<h4>Style</h4><ul><li>First-person narration, so the reader sees only what the narrator sees.</li><li>Calm, short sentences; the excitement is in the animal, not the language.</li><li>Sensory description: sound, light, water, leaf-fall.</li><li>Contrast: the quiet ravine against the loud hunters.</li></ul><h4>Symbols</h4><table><tr><th>Symbol</th><th>Meaning</th></tr><tr><td>the ravine and stream</td><td>a last refuge of the wild</td></tr><tr><td>the skin</td><td>the animal turned into money</td></tr><tr><td>silence at the end</td><td>grief, guilt, and a broken contract</td></tr><tr><td>the narrator's silence</td><td>the small, insufficient good act</td></tr></table><h4>Answer plan for \"Describe the theme of the story\"</h4><ol><li>One line naming the theme.</li><li>The ravine and the trust (two or three sentences).</li><li>The hunters and the price of the skin.</li><li>The kill and the silent forest.</li><li>Closing sentence: what Bond wants the reader to feel.</li></ol><h4>Common mistake</h4><p>Retelling the plot and calling it a theme answer. The plot earns marks only when it is used as evidence for an idea.</p>"}, "syllabus_item": "3.1"}]}, {"title": {"en": "2. Short Story: After Twenty Years - O. Henry"}, "items": [{"h": {"en": "2.1 The writer and the setting"}, "body": {"en": "<h4>About the writer</h4><p><b>O. Henry</b> is the pen name of William Sydney Porter (1862-1910), an American short-story writer famous for warm, witty stories with a twist in the last paragraph. His best-known stories are <i>The Gift of the Magi</i>, <i>The Last Leaf</i> and <i>The Cop and the Anthem</i>.</p><h4>The setting</h4><table><tr><th>Point</th><th>Detail</th></tr><tr><td>City</td><td>New York</td></tr><tr><td>Time</td><td>about ten o'clock on a cold, windy night</td></tr><tr><td>Place</td><td>a street where a hardware store now stands; twenty years earlier the restaurant \"Big Joe\" Brady's was there</td></tr><tr><td>Weather</td><td>chilly gusts, few people on the street</td></tr><tr><td>Mood</td><td>quiet, slightly nostalgic, then tense</td></tr></table><h4>Why the setting is chosen</h4><p>The old restaurant is gone and a hardware store has taken its place: the city has changed, and so has everything except the promise. The empty street also lets two men talk without a crowd, which the plot needs.</p><h4>Common mistake</h4><p>Saying the story happens in Chicago. Chicago is where Bob is <i>wanted</i>; the meeting is in New York.</p>"}, "syllabus_item": "3.2"}, {"h": {"en": "2.2 The plot in order"}, "body": {"en": "<h4>Summary</h4><p>A policeman on his beat walks up a quiet New York street at about ten at night. In the doorway of a hardware store stands a man with an unlit cigar.</p><p>The man explains that he is waiting for his dearest friend, Jimmy Wells. Exactly twenty years ago they dined at \"Big Joe\" Brady's restaurant on that spot and promised to meet again there at the same hour on the same date, wherever life had taken them. Bob went West and did well; Jimmy stayed in New York, a steady man.</p><p>The policeman wishes him luck and walks on. Twenty minutes later a tall man in a long overcoat hurries up, greets him as Bob, and the two walk arm in arm.</p><p>Under a bright street light Bob stops. The man beside him is not Jimmy: the nose is wrong. The stranger says he is a plain-clothes officer and that Bob has been under arrest for ten minutes. He hands him a note.</p><h4>The note</h4><p>Jimmy writes that he came to the meeting place on time, and that when Bob struck a match to light his cigar, he saw the face of the man wanted in Chicago. He could not arrest him himself, so he sent another officer.</p><h4>Order of events for an exam answer</h4><ol><li>Policeman on the beat; Bob waiting in the doorway.</li><li>Bob tells the story of the promise made twenty years ago.</li><li>The policeman leaves; Bob waits alone.</li><li>A tall man arrives and greets him as Jimmy.</li><li>Under the light Bob sees the nose and is arrested.</li><li>The note reveals that the first policeman was Jimmy Wells.</li></ol><h4>Common mistake</h4><p>Mixing the order of the two meetings. The policeman comes first; the plain-clothes man comes second; the note explains both.</p>"}, "diagram": "lit2_twenty", "syllabus_item": "3.2"}, {"h": {"en": "2.3 Characters"}, "body": {"en": "<h4>Bob - the man from the West</h4><p>Sentimental, talkative and confident. He has travelled, made money, and wears a watch set with small diamonds. He keeps the appointment exactly, which shows real loyalty - and he is also the man wanted in Chicago, which shows what his success cost.</p><h4>Jimmy Wells - the policeman</h4><p>Steady, dutiful and quietly emotional. He recognises his friend's face by matchlight and still keeps the appointment. He cannot arrest Bob himself, and he cannot let him go, so he sends another officer and leaves a note. He is the story's moral centre.</p><h4>The plain-clothes officer</h4><p>Polite and businesslike. He plays the friend for a block of street so that the arrest can happen quietly, which is a small kindness inside an official duty.</p><h4>Comparison</h4><table><tr><th>Point</th><th>Bob</th><th>Jimmy</th></tr><tr><td>Moved</td><td>West, made money</td><td>stayed in New York</td></tr><tr><td>Temperament</td><td>impulsive, sentimental</td><td>steady, dutiful</td></tr><tr><td>Position now</td><td>wanted criminal</td><td>police officer</td></tr><tr><td>Keeps the promise</td><td>yes</td><td>yes</td></tr><tr><td>Ends the story</td><td>arrested</td><td>writes the note</td></tr></table><h4>Common mistake</h4><p>Calling Jimmy disloyal. He keeps the appointment and refuses to arrest his friend with his own hands - loyalty and duty are both present, which is the point.</p>"}, "syllabus_item": "3.2"}, {"h": {"en": "2.4 The twist ending"}, "body": {"en": "<h4>What the twist is</h4><p>The reader believes that the tall man is Jimmy Wells. He is not: he is a plain-clothes officer, and the real Jimmy was the policeman at the start.</p><h4>How O. Henry prepares it</h4><table><tr><th>Clue</th><th>Where</th><th>What it does</th></tr><tr><td>the policeman's interest in Bob's story</td><td>first meeting</td><td>makes him more than a passing figure</td></tr><tr><td>the match Bob strikes to light his cigar</td><td>first meeting</td><td>gives Jimmy a clear look at his face</td></tr><tr><td>\"I'll be on my way\"</td><td>first meeting</td><td>ends the scene without explanation</td></tr><tr><td>the wrong nose</td><td>second meeting</td><td>the detail that breaks the illusion</td></tr></table><h4>The sentence that turns the story</h4><p>Bob says that twenty years is long enough to change many things, \"but not long enough to change a man's nose from a Roman to a pug\". The officer answers that it sometimes changes \"a good man into a bad one\" - and the arrest follows.</p><h4>Common mistake</h4><p>Calling the ending a trick. Every clue is in plain sight, and the twist makes a moral point: the friend who kept faith is the one who has to act against his friend.</p>"}, "syllabus_item": "3.2"}, {"h": {"en": "2.5 Themes"}, "body": {"en": "<h4>The four themes</h4><table><tr><th>Theme</th><th>Evidence</th></tr><tr><td>Friendship against duty</td><td>Jimmy keeps the appointment but sends an officer to arrest Bob</td></tr><tr><td>Time and change</td><td>twenty years alter a restaurant, a face and a life</td></tr><tr><td>Loyalty</td><td>Bob travels across the country to stand in a doorway at ten at night</td></tr><tr><td>Crime and its cost</td><td>Bob's fortune has made him a wanted man</td></tr></table><h4>Writing about a theme</h4><p>Name the theme, give the moment, and say what O. Henry suggests. Example: <i>The theme of duty appears when Jimmy steps aside and sends another officer; O. Henry suggests that friendship can be honoured even when it cannot be protected.</i></p><h4>Examples of theme sentences</h4><ul><li>Bob's loyalty is real, and so is his crime; the story refuses to make him only a villain.</li><li>Jimmy's note is the most affectionate act in the story and the most official.</li><li>Twenty years change the city faster than it changes the promise.</li></ul><h4>Common mistake</h4><p>Discussing friendship without duty, or duty without friendship. The story is built on both at once.</p>"}, "syllabus_item": "3.2"}, {"h": {"en": "2.6 Title, irony and key lines"}, "body": {"en": "<h4>The title</h4><p>\"After Twenty Years\" measures the whole story: the promise is twenty years old, and the men are measured by what those years made of them. The title carries no hint of the ending, which is why the twist lands.</p><h4>Irony in the story</h4><ul><li>Bob praises Jimmy's steadiness while Jimmy stands in front of him in uniform.</li><li>The friend who arrives is not the friend.</li><li>The reunion Bob waited twenty years for ends in an arrest.</li></ul><h4>Key lines and what they do</h4><table><tr><th>Line (short quote)</th><th>Function</th></tr><tr><td>\"We figured that in twenty years each of us ought to have our destiny worked out\"</td><td>sets up the theme of time</td></tr><tr><td>\"not long enough to change a man's nose from a Roman to a pug\"</td><td>the moment of recognition</td></tr><tr><td>\"It sometimes changes a good man into a bad one\"</td><td>the moral of the twist</td></tr><tr><td>the signed note</td><td>resolves the plot without a scene</td></tr></table><h4>Common mistake</h4><p>Calling the note a letter of betrayal. Jimmy explains, apologises in his way, and signs his name - it is a farewell from a friend as much as a report from an officer.</p>"}, "syllabus_item": "3.2"}, {"h": {"en": "2.7 How to answer questions on the story"}, "body": {"en": "<h4>Question types</h4><table><tr><th>Question</th><th>What to include</th></tr><tr><td>Describe the plot</td><td>six steps in order, ending with the note</td></tr><tr><td>Sketch the character of Jimmy Wells</td><td>steady, dutiful, loyal; two moments</td></tr><tr><td>Why is the ending surprising?</td><td>the tall man is not Jimmy; clues listed</td></tr><tr><td>What is the theme?</td><td>friendship against duty, with evidence</td></tr><tr><td>Justify the title</td><td>twenty years shapes the promise and the men</td></tr></table><h4>Model opening for a plot answer</h4><p>\"O. Henry's <i>After Twenty Years</i> opens on a quiet New York street at ten at night, where a man waits in a doorway for a friend he has not seen for twenty years...\"</p><h4>Model opening for a character answer</h4><p>\"Jimmy Wells is a policeman first and a friend always; the story tests which of the two he will obey, and his answer is the note he leaves behind.\"</p><h4>Common mistake</h4><p>Writing the ending first. Keep the order, and let the reader meet the twist where O. Henry put it.</p>"}, "syllabus_item": "3.2"}]}, {"title": {"en": "3. Poetry: Stopping by Woods on a Snowy Evening - Robert Frost"}, "items": [{"h": {"en": "3.1 The poet and the poem"}, "body": {"en": "<h4>About the poet</h4><p><b>Robert Frost</b> (1874-1963) was an American poet who wrote about rural New England in plain, spoken language. He won the Pulitzer Prize four times. His best-known poems are <i>The Road Not Taken</i>, <i>Mending Wall</i> and <i>Birches</i>.</p><h4>The poem</h4><table><tr><th>Point</th><th>Detail</th></tr><tr><td>Published</td><td>1923, in the collection New Hampshire (written 1922)</td></tr><tr><td>Form</td><td>four quatrains (four-line stanzas)</td></tr><tr><td>Metre</td><td>iambic tetrameter - four beats to a line</td></tr><tr><td>Rhyme</td><td>aaba bbcb ccdc dddd: the third line of each stanza sets up the next stanza's rhyme</td></tr><tr><td>Speaker</td><td>a traveller who has stopped on a road beside woods</td></tr><tr><td>Situation</td><td>snowfall, evening, a horse, a journey not yet finished</td></tr></table><h4>The rhyme scheme in practice</h4><p>Stanza one rhymes <i>know / though / here / snow</i> (aaba). The sound <i>know</i> is picked up by <i>though</i> and <i>snow</i>; the odd line out, <i>here</i>, is answered by <i>queer / near / year</i> in stanza two. In the last stanza all four lines rhyme, and the closing line repeats.</p><h4>Why the form matters</h4><p>The chain rhyme pulls the reader forward, line by line, exactly as the traveller is pulled onward by his promises. The poem never quite stops, until the repeated last line makes it stop.</p><h4>Common mistake</h4><p>Calling the poem a sonnet. It has four quatrains, not fourteen lines.</p>"}, "diagram": "lit3_poem", "syllabus_item": "3.3"}, {"h": {"en": "3.2 Stanza 1: stopping to watch"}, "body": {"en": "<h4>The stanza</h4><p>\"Whose woods these are I think I know. / His house is in the village though; / He will not see me stopping here / To watch his woods fill up with snow.\"</p><h4>Summary</h4><p>The traveller stops on a road beside a wood. He thinks he knows who owns it, and he knows the owner is in the village, so no one will see him stop. That privacy lets him enjoy the sight of snow filling the trees.</p><h4>What the stanza establishes</h4><table><tr><th>Detail</th><th>Effect</th></tr><tr><td>\"I think I know\"</td><td>not quite certain; the speaker is a visitor, not an owner</td></tr><tr><td>\"His house is in the village\"</td><td>the human world is close but absent</td></tr><tr><td>\"He will not see me\"</td><td>a private moment, almost stolen</td></tr><tr><td>\"fill up with snow\"</td><td>slow, silent movement; the woods are becoming another thing</td></tr></table><h4>Example of a good comment</h4><p>The line \"He will not see me stopping here\" makes the reader a companion in a small act of trespass that harms nothing.</p><h4>Common mistake</h4><p>Saying the speaker is trespassing in a serious sense. He is on the road, looking at the woods; the point is that he has permission to look, not to enter.</p>"}, "syllabus_item": "3.3"}, {"h": {"en": "3.3 Stanza 2: the horse's view"}, "body": {"en": "<h4>The stanza</h4><p>\"My little horse must think it queer / To stop without a farmhouse near / Between the woods and frozen lake / The darkest evening of the year.\"</p><h4>Summary</h4><p>The speaker imagines what the horse makes of the stop. There is no farmhouse to explain it: only woods on one side, a frozen lake on the other, and the year's darkest evening.</p><h4>What the stanza adds</h4><ul><li>A second point of view - the horse stands for the practical world that expects the journey to continue.</li><li>A colder, emptier landscape: <i>frozen lake</i>, <i>darkest evening</i>.</li><li>The first hint that the stop is unusual, not simply a rest.</li></ul><h4>Examples of detail you can quote</h4><p>\"The darkest evening of the year\" places the moment at the winter solstice: the longest night, the deepest dark, the point at which a journey feels hardest.</p><h4>Common mistake</h4><p>Reading the horse as a comic detail. It is the poem's voice of ordinary sense - the one that will finally get the traveller home.</p>"}, "syllabus_item": "3.3"}, {"h": {"en": "3.4 Stanza 3: the sound of the snow"}, "body": {"en": "<h4>The stanza</h4><p>\"He gives his harness bells a shake / To ask if there is some mistake. / The only other sound's the sweep / Of easy wind and downy flake.\"</p><h4>Summary</h4><p>The horse shakes its harness bells, as if asking whether they have stopped by mistake. Apart from the bells there is only the soft sweep of wind and falling snow.</p><h4>What the stanza does</h4><table><tr><th>Sound</th><th>Effect</th></tr><tr><td>harness bells</td><td>a small, sharp, human-made sound</td></tr><tr><td>easy wind</td><td>soft, continuous, natural</td></tr><tr><td>downy flake</td><td>snowfall so light it is almost silent</td></tr><tr><td>the contrast of the three</td><td>the silence is not empty; it is full of quiet sound</td></tr></table><h4>Example of a comment</h4><p>Frost makes silence audible: after the bells stop, the reader hears the wind because there is nothing else to hear.</p><h4>Common mistake</h4><p>Calling the poem silent. It is full of quiet sound - that is a different thing, and a better observation.</p>"}, "syllabus_item": "3.3"}, {"h": {"en": "3.5 Stanza 4: the promises"}, "body": {"en": "<h4>The stanza</h4><p>\"The woods are lovely, dark and deep, / But I have promises to keep, / And miles to go before I sleep, / And miles to go before I sleep.\"</p><h4>Summary</h4><p>The speaker admits the woods are beautiful - lovely, dark and deep - and then turns away from them. He has promises to keep and a long way still to travel before he can sleep. The last line repeats, and the poem ends without his moving.</p><h4>Reading the ending</h4><table><tr><th>Reading</th><th>Support</th></tr><tr><td>Duty before beauty</td><td>\"But I have promises to keep\"</td></tr><tr><td>Tiredness</td><td>the repeated line sounds like a sigh</td></tr><tr><td>Resolve</td><td>the repetition is a decision, said twice to be believed</td></tr><tr><td>A hint of death</td><td>\"sleep\" can mean rest, or the long sleep, but the poem does not say so</td></tr></table><h4>Example of a balanced comment</h4><p>The repetition can be heard both ways at once: the traveller is weary enough to want the woods and dutiful enough to leave them. Frost does not choose for the reader.</p><h4>Common mistake</h4><p>Announcing that the poem is \"about death\". It can be read that way, but a good answer gives the literal journey first and the deeper reading second, marked as a reading.</p>"}, "syllabus_item": "3.3"}, {"h": {"en": "3.6 Themes and symbols"}, "body": {"en": "<h4>Themes</h4><table><tr><th>Theme</th><th>Evidence</th></tr><tr><td>The pull of beauty and the pull of duty</td><td>the woods against the promises</td></tr><tr><td>Solitude and privacy</td><td>\"He will not see me stopping here\"</td></tr><tr><td>The journey of life</td><td>\"miles to go before I sleep\"</td></tr><tr><td>Human responsibility</td><td>\"promises to keep\"</td></tr></table><h4>Symbols</h4><table><tr><th>Symbol</th><th>Suggests</th></tr><tr><td>the woods</td><td>beauty, rest, withdrawal, and maybe death</td></tr><tr><td>snow</td><td>silence, purity, cold, change</td></tr><tr><td>the frozen lake</td><td>stillness, a hard season</td></tr><tr><td>the horse</td><td>ordinary life and its duties</td></tr><tr><td>the miles</td><td>the work still to be done</td></tr><tr><td>sleep</td><td>rest, or the end of life</td></tr></table><h4>Example of a theme answer</h4><p>The poem sets two goods against each other - the loveliness of the woods and the claims of a promise - and lets the traveller choose the harder one, without pretending the choice is easy.</p><h4>Common mistake</h4><p>Using a symbol without evidence. Say \"the woods suggest rest, because the traveller longs to stay and must leave\" - symbol plus reason.</p>"}, "syllabus_item": "3.3"}, {"h": {"en": "3.7 Poetic devices"}, "body": {"en": "<h4>Devices with examples from the poem</h4><table><tr><th>Device</th><th>Example</th><th>Effect</th></tr><tr><td>Rhyme (chain rhyme)</td><td>aaba bbcb ccdc dddd</td><td>pulls the reader forward</td></tr><tr><td>Repetition</td><td>\"And miles to go before I sleep\" twice</td><td>weariness and resolve together</td></tr><tr><td>Alliteration</td><td>\"sound's the sweep\", \"downy flake\"</td><td>imitates soft movement and sound</td></tr><tr><td>Personification</td><td>the woods \"fill up with snow\"; the horse \"thinks\" and \"asks\"</td><td>gives the scene a quiet inner life</td></tr><tr><td>Imagery</td><td>\"easy wind and downy flake\"</td><td>appeals to touch and hearing</td></tr><tr><td>Symbolism</td><td>woods, snow, sleep</td><td>carries the deeper meaning</td></tr><tr><td>Contrast</td><td>lovely woods / promises to keep</td><td>creates the poem's tension</td></tr><tr><td>Understatement</td><td>\"But I have promises to keep\"</td><td>the plain word \"but\" carries the whole choice</td></tr></table><h4>How to write a device answer</h4><p>Name the device, quote it, then say what it does. For example: <i>The alliteration in \"sound's the sweep\" slows the line down, so the reader hears the softness of the wind.</i></p><h4>Common mistake</h4><p>Listing ten devices without a single effect. Two devices explained well score more than ten named.</p>"}, "syllabus_item": "3.3"}, {"h": {"en": "3.8 Central idea and exam notes"}, "body": {"en": "<h4>Central idea</h4><p>A traveller stops to watch snow falling in woods he does not own, and then moves on because he has promises to keep. The small event carries a large idea: beauty and rest are real, and so are duty and the journey; a grown life is the balancing of the two.</p><h4>Answer plan for \"Explain the central idea of the poem\"</h4><ol><li>One sentence: what happens in the poem.</li><li>The attraction of the woods (stanza 1-3).</li><li>The pull of the promises (stanza 4).</li><li>The repetition and what it suggests.</li><li>One sentence on why the poem still matters.</li></ol><h4>Questions that are usually asked</h4><table><tr><th>Question</th><th>Short answer</th></tr><tr><td>Why does the speaker stop?</td><td>to watch the woods fill up with snow</td></tr><tr><td>Why does he not stay?</td><td>he has promises to keep and miles to travel</td></tr><tr><td>What does the horse do?</td><td>shakes its harness bells, as if asking why they stopped</td></tr><tr><td>What is the rhyme scheme?</td><td>aaba bbcb ccdc dddd</td></tr><tr><td>Name two devices.</td><td>repetition and alliteration, with examples</td></tr></table><h4>Common mistake</h4><p>Writing a summary and stopping there. The question asks for the idea, so the summary must lead to a statement about duty, beauty or rest.</p>"}, "syllabus_item": "3.3"}]}, {"title": {"en": "4. Practice Questions with Model Answers"}, "items": [{"h": {"en": "Practice 1. Describe the setting of The Leopard and explain why it matters to the story."}, "body": {"en": "<p>The story is set in a deep ravine below a hill station in the Himalayan foothills, a place of ferns, moss, running water and small animals, which almost nobody from the town visits.</p><p>The narrator walks there every day and, because he is quiet and unarmed, the birds and animals come to accept him. That acceptance is what makes the meeting with the leopard possible.</p><p>The ravine therefore works as a refuge: it shelters the leopard and gives the narrator a private world. When the hunters arrive and kill the leopard, the same place falls silent, so the setting carries the loss as well as the beauty.</p>"}}, {"h": {"en": "Practice 2. Summarise the plot of The Leopard in about 150 words."}, "body": {"en": "<p>The narrator lives near a hill station and walks daily in a ravine below it, where the birds and animals grow used to him. One evening he sees a leopard drinking at the stream, and over the following weeks the two learn to share the place without fear or friendship - a tolerance, not a taming.</p><p>Hunters then arrive looking for a leopard, and ask him whether he has seen one. He says he has seen nothing, although he knows exactly where it drinks. They talk of skins selling in Delhi for over a thousand rupees each.</p><p>The hunters eventually find and kill the leopard and take the skin. The narrator walks home through a forest that has gone silent, feeling that the birds and animals know their trust has been violated.</p>"}}, {"h": {"en": "Practice 3. What is the theme of The Leopard? Support your answer with evidence from the story."}, "body": {"en": "<p>The central theme is the conflict between man and nature, and the way trust is betrayed for money.</p><p>The leopard learns not to fear the narrator because he never harms it, and the two share the ravine in silence. When the hunters come, they value the animal only as a skin worth more than a thousand rupees in Delhi - the narrator's silence delays them but cannot stop them.</p><p>Bond closes with a silent forest and the thought that the animals know their trust has been violated, so the theme is carried by the setting as much as by the events.</p>"}}, {"h": {"en": "Practice 4. Sketch the character of the narrator in The Leopard."}, "body": {"en": "<p>He is a writer and a daily walker: quiet, patient and observant, and he carries no gun.</p><p>His love of the ravine is shown in the small things he notices - the stream, a bird call, a deer lifting its head - and in the way the animals accept him.</p><p>His one action is a refusal: asked by the hunters whether he has seen the leopard, he says he has seen nothing. It is honest to the animal and dishonest to the men, and it is not enough. That limitation is what makes him a believable character.</p>"}}, {"h": {"en": "Practice 5. How does the story After Twenty Years end, and why is the ending effective?"}, "body": {"en": "<p>Bob waits in a doorway for Jimmy Wells, the friend he has not seen for twenty years. A policeman on the beat hears his story and moves on; twenty minutes later a tall man greets him as Jimmy and they walk arm in arm.</p><p>Under a street light Bob sees the nose and knows the man is not Jimmy. The stranger is a plain-clothes officer, and Bob has been under arrest for ten minutes. He hands Bob a note.</p><p>In the note Jimmy explains that he came on time, recognised Bob as the man wanted in Chicago when he struck the match, and could not arrest him himself, so he sent another officer. The ending is effective because every clue was in plain sight, and because the friend who kept faith is the one who had to act against his friend.</p>"}}, {"h": {"en": "Practice 6. Compare the characters of Bob and Jimmy Wells."}, "body": {"en": "<p>Bob is impulsive, talkative and sentimental. He has gone West, made money and wears a diamond-set watch, and he keeps the appointment exactly - but he is also the man wanted in Chicago, so his success has a criminal price.</p><p>Jimmy is steady and dutiful. He stayed in New York and became a policeman, and he too keeps the appointment, though for him it means standing in uniform and recognising his friend's face.</p><p>Both men are loyal, and that is the point of the comparison: the same loyalty leads one to a doorway and the other to a note that ends the meeting in an arrest.</p>"}}, {"h": {"en": "Practice 7. What is the theme of After Twenty Years? Give evidence."}, "body": {"en": "<p>The main theme is the conflict between friendship and duty.</p><p>Jimmy Wells keeps the promise made twenty years earlier, which shows his loyalty as a friend. But when the matchlight shows him Bob's face, he knows he is looking at a wanted man, and he sends a plain-clothes officer rather than let him go.</p><p>O. Henry adds a second theme, time and change: the restaurant has become a hardware store, Bob's fortune has made him a criminal, and only the promise has stayed as it was. The note brings both themes together in one short paragraph.</p>"}}, {"h": {"en": "Practice 8. Why is the title After Twenty Years appropriate?"}, "body": {"en": "<p>Every important thing in the story is measured by twenty years: the promise made in the restaurant, the separate lives the two friends have lived, and the changes in the street and in the men.</p><p>The title also carries the story's irony. Bob expects the years to have preserved his friend, and they have - but they have also turned Bob into a man his friend must arrest.</p><p>Without giving the twist away, the title sets the reader thinking about time, which is exactly what the last paragraph turns on.</p>"}}, {"h": {"en": "Practice 9. Summarise the poem Stopping by Woods on a Snowy Evening stanza by stanza."}, "body": {"en": "<p>Stanza 1: the traveller stops beside woods that he thinks he knows; the owner lives in the village and will not see him watching the woods fill up with snow.</p><p>Stanza 2: he imagines that his little horse finds the stop strange, since there is no farmhouse near - only woods, a frozen lake and the darkest evening of the year.</p><p>Stanza 3: the horse shakes its harness bells as if asking whether there is a mistake, and the only other sound is the sweep of easy wind and downy snow.</p><p>Stanza 4: he calls the woods lovely, dark and deep, but says he has promises to keep and miles to go before he sleeps; the last line is repeated, and the poem ends without his moving.</p>"}}, {"h": {"en": "Practice 10. What is the central idea of Stopping by Woods on a Snowy Evening?"}, "body": {"en": "<p>The poem is about the pull of two things at once: the beauty and rest offered by the woods, and the duty that requires the traveller to move on.</p><p>For three stanzas he simply watches - the snow, the dark, the horse's bells - and the poem lets the reader feel how attractive that stillness is.</p><p>Then the word \"But\" turns the poem: he has promises to keep and miles to go before he sleeps. The repeated last line sounds both weary and resolved, so the central idea is not that duty wins easily, but that it wins at a cost.</p>"}}, {"h": {"en": "Practice 11. Name four poetic devices used in the poem with examples."}, "body": {"en": "<p><b>Repetition:</b> \"And miles to go before I sleep\" is repeated, which makes the line sound like a decision said twice.</p><p><b>Alliteration:</b> \"sound's the sweep\" and \"downy flake\" repeat soft consonants, so the line moves slowly, like the snow.</p><p><b>Personification:</b> the horse \"thinks\" and \"asks\", and the woods \"fill up with snow\", which gives the scene an inner life. <b>Symbolism:</b> the woods suggest rest or withdrawal, the miles suggest the work still to be done.</p>"}}, {"h": {"en": "Practice 12. Justify the last stanza as the heart of the poem."}, "body": {"en": "<p>The first three stanzas build an atmosphere: snow, darkness, a frozen lake, a horse's bells and then a deep quiet.</p><p>The last stanza names the choice in four short lines. \"The woods are lovely, dark and deep\" admits the attraction; \"But I have promises to keep\" states the claim that overrides it; the two closing lines measure the distance still to be travelled.</p><p>The rhyme also completes itself here, with all four lines rhyming, so the poem's form settles at the same moment as its meaning.</p>"}}, {"h": {"en": "Practice 13. Compare the treatment of nature in The Leopard and Stopping by Woods on a Snowy Evening."}, "body": {"en": "<p>In Bond's story nature is a shared place: the ravine is home to the narrator, the birds, the deer and the leopard, and the drama is about whether a human being can live there without harming it. The hunters enter that place and destroy it for money.</p><p>In Frost's poem nature is a beauty that asks nothing: the woods belong to somebody else and are simply watched. No one is harmed, and the tension is inside the traveller, between watching and leaving.</p><p>So Bond writes about responsibility towards nature, and Frost about the human cost of leaving it; both make a quiet place the centre of the story.</p>"}}, {"h": {"en": "Practice 14. What moral do you draw from After Twenty Years?"}, "body": {"en": "<p>The story asks whether a person can be both loyal and just, and answers that he can, but only by giving up the pleasure of the meeting.</p><p>Jimmy Wells does not betray his friend and does not break the law: he comes, he recognises, he steps aside and leaves a note that explains everything.</p><p>The moral is that true friendship is not the same as shielding someone from the consequences of his choices - and that the honest course usually costs the person who takes it.</p>"}}, {"h": {"en": "Practice 15. How does Frost create a sense of silence in the poem?"}, "body": {"en": "<p>He does it with sound rather than its absence. The only sounds named are the horse's harness bells and the sweep of easy wind and downy flake, and they are quiet ones.</p><p>The bells come first, sharp and brief, so that the soft wind is heard more clearly afterwards. Words like \"easy\" and \"downy\" slow the line down.</p><p>The final stanza has no sound image at all, only the repeated line, so the silence of the ending is created by the withdrawal of detail.</p>"}}]}], "diagrams": [{"id": "lit1_plot", "title": {"en": "The Leopard: the plot in five steps"}, "file": "diagrams/lit1_plot.svg"}, {"id": "lit2_twenty", "title": {"en": "After Twenty Years: the two meetings"}, "file": "diagrams/lit2_twenty.svg"}, {"id": "lit3_poem", "title": {"en": "The poem: four stanzas, four steps"}, "file": "diagrams/lit3_poem.svg"}, {"id": "lit4_conflict", "title": {"en": "The Leopard: who is against whom"}, "file": "diagrams/lit4_conflict.svg"}], "equations": [{"title": {"en": "The three texts at a glance"}, "items": [{"terms": {"en": "The Leopard - author"}, "a": {"en": "Ruskin Bond, Indian writer of the Himalayan foothills"}}, {"terms": {"en": "The Leopard - one line"}, "a": {"en": "a leopard trusts a daily walker, hunters kill it for its skin, the forest falls silent"}}, {"terms": {"en": "After Twenty Years - author"}, "a": {"en": "O. Henry, American master of the twist ending"}}, {"terms": {"en": "After Twenty Years - one line"}, "a": {"en": "a reunion after twenty years ends in an arrest by a friend's colleague"}}, {"terms": {"en": "Stopping by Woods - poet"}, "a": {"en": "Robert Frost, American poet of rural New England"}}, {"terms": {"en": "Stopping by Woods - one line"}, "a": {"en": "a traveller watches snow in the woods, then leaves for the promises he must keep"}}]}, {"title": {"en": "Poem form"}, "items": [{"terms": {"en": "Stanzas"}, "a": {"en": "four quatrains"}}, {"terms": {"en": "Rhyme scheme"}, "a": {"en": "aaba bbcb ccdc dddd"}}, {"terms": {"en": "Metre"}, "a": {"en": "iambic tetrameter, four beats a line"}}, {"terms": {"en": "Repeated line"}, "a": {"en": "\"And miles to go before I sleep\""}}]}], "viva": [{"title": {"en": "The Leopard"}, "items": [{"q": {"en": "Who wrote The Leopard, and where is it set?"}, "a": {"en": "Ruskin Bond wrote it; it is set in a deep ravine with a stream below a hill station in the Himalayan foothills."}}, {"q": {"en": "Why do the animals of the ravine accept the narrator?"}, "a": {"en": "He walks the same path quietly every day and carries no gun, so the birds and animals stop treating him as a danger."}}, {"q": {"en": "How does the narrator meet the leopard?"}, "a": {"en": "He sees it drinking at the stream one evening; both freeze, and over the following days the meetings repeat until neither runs away."}}, {"q": {"en": "What do the hunters ask him, and what does he answer?"}, "a": {"en": "They ask whether he has seen the leopard; he says he has seen nothing, which protects it for a time."}}, {"q": {"en": "What does the story say about the price of a leopard skin?"}, "a": {"en": "The hunters say that skins sell in Delhi for more than a thousand rupees each, which turns the animal into a market price."}}, {"q": {"en": "How does the story end?"}, "a": {"en": "The hunters kill the leopard and take the skin; the forest falls silent, and the narrator feels that the animals know their trust has been violated."}}, {"q": {"en": "State two themes of The Leopard."}, "a": {"en": "Man against nature, and trust betrayed for money; the story also warns about the shrinking forest as the hill station grows."}}]}, {"title": {"en": "After Twenty Years"}, "items": [{"q": {"en": "Where and when does the story take place?"}, "a": {"en": "On a New York street at about ten at night, where a hardware store now stands where \"Big Joe\" Brady's restaurant used to be."}}, {"q": {"en": "What promise does Bob keep?"}, "a": {"en": "Twenty years ago he and Jimmy Wells agreed to meet at the same spot at the same hour; Bob has come from the West to keep that appointment."}}, {"q": {"en": "Who is the first policeman, and why does it matter?"}, "a": {"en": "He is Jimmy Wells, though the reader does not know it; he recognises Bob in the matchlight and later sends another officer to arrest him."}}, {"q": {"en": "How does Bob discover that the tall man is not Jimmy?"}, "a": {"en": "Under a street light he sees the nose: twenty years may change many things, but not a Roman nose into a pug nose."}}, {"q": {"en": "What does Jimmy's note say?"}, "a": {"en": "That he came on time, recognised Bob as the man wanted in Chicago when he struck the match, could not arrest him himself, and so sent a plain-clothes officer."}}, {"q": {"en": "State the main conflict in the story."}, "a": {"en": "Friendship against duty: Jimmy keeps the appointment as a friend but has to act as a policeman."}}, {"q": {"en": "Why is the title appropriate?"}, "a": {"en": "The whole story is measured by twenty years - the promise, the changes in the city and in the two men, and the arrest that the years have made inevitable."}}]}, {"title": {"en": "Stopping by Woods"}, "items": [{"q": {"en": "Who wrote the poem, and when was it published?"}, "a": {"en": "Robert Frost; it was written in 1922 and published in 1923 in the collection New Hampshire."}}, {"q": {"en": "Why does the traveller stop?"}, "a": {"en": "To watch the woods fill up with snow, in a place where the owner lives in the village and will not see him."}}, {"q": {"en": "What is the rhyme scheme?"}, "a": {"en": "aaba bbcb ccdc dddd - the third line of each stanza sets up the rhyme of the next."}}, {"q": {"en": "What does the horse do, and why?"}, "a": {"en": "It shakes its harness bells as if asking whether there is some mistake, because they have stopped with no farmhouse near."}}, {"q": {"en": "Why does the traveller not stay in the woods?"}, "a": {"en": "He has promises to keep and miles to go before he sleeps, so duty takes him away from the beauty he is watching."}}, {"q": {"en": "Name two poetic devices used in the poem."}, "a": {"en": "Repetition in the closing line, and alliteration in \"sound's the sweep\" and \"downy flake\"."}}]}], "exam_questions": [{"q": {"en": "Practice: Describe the setting of The Leopard and explain why it matters to the story."}, "marks": 4}, {"q": {"en": "Practice: Summarise the plot of The Leopard in about 150 words."}, "marks": 4}, {"q": {"en": "Practice: What is the theme of The Leopard? Support your answer with evidence from the story."}, "marks": 4}, {"q": {"en": "Practice: Sketch the character of the narrator in The Leopard."}, "marks": 3}, {"q": {"en": "Practice: How does the story After Twenty Years end, and why is the ending effective?"}, "marks": 4}, {"q": {"en": "Practice: Compare the characters of Bob and Jimmy Wells."}, "marks": 4}, {"q": {"en": "Practice: What is the theme of After Twenty Years? Give evidence."}, "marks": 4}, {"q": {"en": "Practice: Why is the title After Twenty Years appropriate?"}, "marks": 3}, {"q": {"en": "Practice: Summarise the poem Stopping by Woods on a Snowy Evening stanza by stanza."}, "marks": 5}, {"q": {"en": "Practice: What is the central idea of Stopping by Woods on a Snowy Evening?"}, "marks": 4}, {"q": {"en": "Practice: Name four poetic devices used in the poem with examples."}, "marks": 4}, {"q": {"en": "Practice: Justify the last stanza as the heart of the poem."}, "marks": 4}, {"q": {"en": "Practice: Compare the treatment of nature in The Leopard and Stopping by Woods on a Snowy Evening."}, "marks": 4}, {"q": {"en": "Practice: What moral do you draw from After Twenty Years?"}, "marks": 3}, {"q": {"en": "Practice: How does Frost create a sense of silence in the poem?"}, "marks": 3}], "learning_outcomes": [{"en": "CO3: Develop reading and listening skills in terms of fluency and comprehensibility."}], "course_outcomes": ["CO3"], "practical_numbers": [], "content_kind": "theory", "lesson_count": 23, "answered_practice_count": 15, "assessment_note": {"en": "Official course: theory ESE 70 + PA 30 and practical PA 20 + ESE 30 = 150 marks, 3 credits, 30 teaching hours; this unit carries 20 % weightage and 14 of the 70 theory marks. Practice-question marks (3/4) are suggested revision sizes, not official GTU allocations. Model answers are in Notes section 7."}, "question_provenance": "Original answered revision questions; not official past papers", "question_marks_are_suggested": true, "sources": [{"title": "GTU DI01000031, Communication Skills in English, Semester 1, HSMC-1 (uploaded syllabus)", "url": "https://syllabus.gtu.ac.in/"}, {"title": "Ruskin Bond - The Leopard, in Time Stops at Shamli and Other Stories (Penguin)", "url": "https://www.penguinrandomhouseindia.com/"}, {"title": "O. Henry - After Twenty Years (public domain text, 1906)", "url": "https://www.gutenberg.org/ebooks/1595"}, {"title": "Robert Frost - Stopping by Woods on a Snowy Evening (New Hampshire, 1923)", "url": "https://www.poetryfoundation.org/poems/42891/stopping-by-woods-on-a-snowy-evening"}, {"title": "Poetry Foundation - Robert Frost, biography and works", "url": "https://www.poetryfoundation.org/poets/robert-frost"}]};
const SVG = {"lit1_plot": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 316\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"316\" fill=\"#ffffff\"/><text x=\"180\" y=\"28.9\" font-size=\"14\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">The Leopard: the plot</text><text x=\"180\" y=\"49.6\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">five steps, from trust to betrayal</text><rect x=\"12.0\" y=\"61.0\" width=\"336\" height=\"30\" rx=\"7\" fill=\"#EAF3FD\" stroke=\"#1565C0\" stroke-width=\"1.6\"/><text x=\"180\" y=\"79.3\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">1. The narrator walks the ravine every day</text><rect x=\"12.0\" y=\"103.0\" width=\"336\" height=\"30\" rx=\"7\" fill=\"#EAF6EC\" stroke=\"#2E7D32\" stroke-width=\"1.6\"/><text x=\"180\" y=\"121.3\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">2. He meets a leopard at the stream; neither runs away</text><rect x=\"12.0\" y=\"145.0\" width=\"336\" height=\"30\" rx=\"7\" fill=\"#FFF4DF\" stroke=\"#B66A00\" stroke-width=\"1.6\"/><text x=\"180\" y=\"163.3\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">3. Hunters come and ask where it is; he says he has seen nothing</text><rect x=\"12.0\" y=\"187.0\" width=\"336\" height=\"30\" rx=\"7\" fill=\"#FDECF0\" stroke=\"#BD2543\" stroke-width=\"1.6\"/><text x=\"180\" y=\"205.3\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">4. The leopard is killed and its skin is taken and sold</text><rect x=\"12.0\" y=\"229.0\" width=\"336\" height=\"30\" rx=\"7\" fill=\"#EAF3FD\" stroke=\"#1565C0\" stroke-width=\"1.6\"/><text x=\"180\" y=\"247.3\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">5. He walks home through a silent forest - the trust is broken</text><text x=\"180\" y=\"291.5\" font-size=\"9.9\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">Turning point: the arrival of the shikaris - the narrator has to choose</text><text x=\"180\" y=\"307.5\" font-size=\"9.9\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">between the hunters and the animal that trusted him.</text></svg>", "lit2_twenty": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 392\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"392\" fill=\"#ffffff\"/><text x=\"180\" y=\"28.9\" font-size=\"14\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">After Twenty Years</text><text x=\"180\" y=\"49.6\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">two meetings, twenty years apart</text><rect x=\"12.0\" y=\"61.0\" width=\"336\" height=\"26\" rx=\"7\" fill=\"#EAF3FD\" stroke=\"#1565C0\" stroke-width=\"1.6\"/><text x=\"180\" y=\"77.3\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">Twenty years ago: Bob and Jimmy dine at Big Joe Brady's</text><rect x=\"12.0\" y=\"93.0\" width=\"336\" height=\"26\" rx=\"7\" fill=\"#EAF3FD\" stroke=\"#1565C0\" stroke-width=\"1.6\"/><text x=\"180\" y=\"109.3\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">They promise to meet on the same spot, same date</text><rect x=\"12.0\" y=\"135.0\" width=\"336\" height=\"26\" rx=\"7\" fill=\"#EAF6EC\" stroke=\"#2E7D32\" stroke-width=\"1.6\"/><text x=\"180\" y=\"151.3\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">10 pm tonight: Bob waits in a hardware-store doorway</text><rect x=\"12.0\" y=\"167.0\" width=\"336\" height=\"26\" rx=\"7\" fill=\"#EAF6EC\" stroke=\"#2E7D32\" stroke-width=\"1.6\"/><text x=\"180\" y=\"183.3\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">A policeman on the beat stops; Bob tells his story</text><rect x=\"12.0\" y=\"209.0\" width=\"336\" height=\"26\" rx=\"7\" fill=\"#FFF4DF\" stroke=\"#B66A00\" stroke-width=\"1.6\"/><text x=\"180\" y=\"225.3\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">The policeman moves on - he is Jimmy Wells</text><rect x=\"12.0\" y=\"241.0\" width=\"336\" height=\"26\" rx=\"7\" fill=\"#FFF4DF\" stroke=\"#B66A00\" stroke-width=\"1.6\"/><text x=\"180\" y=\"257.3\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">A tall man arrives, calls him Bob, and they walk</text><rect x=\"12.0\" y=\"283.0\" width=\"336\" height=\"26\" rx=\"7\" fill=\"#FDECF0\" stroke=\"#BD2543\" stroke-width=\"1.6\"/><text x=\"180\" y=\"299.3\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">Under the light Bob sees it is not Jimmy - he is arrested</text><rect x=\"12.0\" y=\"315.0\" width=\"336\" height=\"26\" rx=\"7\" fill=\"#FDECF0\" stroke=\"#BD2543\" stroke-width=\"1.6\"/><text x=\"180\" y=\"331.3\" font-size=\"9.3\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">Note from Jimmy: 'I saw the face of the man wanted in Chicago'</text><text x=\"180\" y=\"371.5\" font-size=\"9.9\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">Jimmy kept the appointment, but sent an officer to arrest him.</text></svg>", "lit3_poem": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 328\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"328\" fill=\"#ffffff\"/><text x=\"180\" y=\"28.9\" font-size=\"14\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">Stopping by Woods</text><text x=\"180\" y=\"49.6\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">four quatrains, one decision</text><rect x=\"12.0\" y=\"64.0\" width=\"336\" height=\"28\" rx=\"7\" fill=\"#EAF3FD\" stroke=\"#1565C0\" stroke-width=\"1.6\"/><text x=\"180\" y=\"81.3\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">1  He stops to watch the woods fill up with snow</text><rect x=\"12.0\" y=\"104.0\" width=\"336\" height=\"28\" rx=\"7\" fill=\"#EAF6EC\" stroke=\"#2E7D32\" stroke-width=\"1.6\"/><text x=\"180\" y=\"121.3\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">2  The horse finds it strange: no farmhouse near</text><rect x=\"12.0\" y=\"144.0\" width=\"336\" height=\"28\" rx=\"7\" fill=\"#FFF4DF\" stroke=\"#B66A00\" stroke-width=\"1.6\"/><text x=\"180\" y=\"161.3\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">3  The horse shakes its bells; the only other sound is the wind</text><rect x=\"12.0\" y=\"184.0\" width=\"336\" height=\"28\" rx=\"7\" fill=\"#FDECF0\" stroke=\"#BD2543\" stroke-width=\"1.6\"/><text x=\"180\" y=\"201.3\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">4  'But I have promises to keep' - he moves on</text><rect x=\"12.0\" y=\"226.0\" width=\"336\" height=\"40\" rx=\"7\" fill=\"#EAF6EC\" stroke=\"#2E7D32\" stroke-width=\"1.6\"/><text x=\"180\" y=\"243.6\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">Rhyme: aaba bbcb ccdc dddd</text><text x=\"180\" y=\"255.1\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">The last two lines repeat</text><text x=\"180\" y=\"303.5\" font-size=\"9.9\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">Movement: attraction of the woods, then the pull of duty.</text><text x=\"180\" y=\"319.5\" font-size=\"9.9\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">The repeated line sounds weary and resolved at once.</text></svg>", "lit4_conflict": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 294\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"294\" fill=\"#ffffff\"/><text x=\"180\" y=\"28.9\" font-size=\"14\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">The Leopard: the conflicts</text><text x=\"180\" y=\"49.6\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">four tensions in one short story</text><rect x=\"12.0\" y=\"63.0\" width=\"336\" height=\"34\" rx=\"7\" fill=\"#EAF3FD\" stroke=\"#1565C0\" stroke-width=\"1.6\"/><text x=\"180\" y=\"83.3\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">Narrator against hunters: he hides the leopard; they hunt it</text><rect x=\"12.0\" y=\"109.0\" width=\"336\" height=\"34\" rx=\"7\" fill=\"#EAF6EC\" stroke=\"#2E7D32\" stroke-width=\"1.6\"/><text x=\"180\" y=\"129.3\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">Man against nature: the hill station grows, the forest shrinks</text><rect x=\"12.0\" y=\"155.0\" width=\"336\" height=\"34\" rx=\"7\" fill=\"#FFF4DF\" stroke=\"#B66A00\" stroke-width=\"1.6\"/><text x=\"180\" y=\"175.3\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">Greed against care: a skin worth over 1,000 rupees in Delhi</text><rect x=\"12.0\" y=\"201.0\" width=\"336\" height=\"34\" rx=\"7\" fill=\"#FDECF0\" stroke=\"#BD2543\" stroke-width=\"1.6\"/><text x=\"180\" y=\"221.3\" font-size=\"9.4\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">Silence against speech: he says nothing; the forest falls silent</text><text x=\"180\" y=\"269.5\" font-size=\"9.9\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">Each conflict ends the same way: the animal loses.</text><text x=\"180\" y=\"285.5\" font-size=\"9.9\" text-anchor=\"middle\" fill=\"#666\" font-weight=\"normal\">The narrator's silence protects the leopard for a while, then fails.</text></svg>"};

const fixTables = h => h.replace(/<table>/g,'<div class="tw"><table>').replace(/<\/table>/g,'</table></div>');

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

const PKW = new Set('False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield'.split(' '));

function hlPy(src){
  const re = /(#[^\n]*)|((?:\b[rRbBfFuU]{1,2})?(?:'{3}[\s\S]*?'{3}|"{3}[\s\S]*?"{3}|'(?:\\.|[^'\\\n])*'|"(?:\\.|[^"\\\n])*"))|(^>>>|^\.\.\.(?= ))|([A-Za-z_]\w*)(?=\s*\()|([A-Za-z_]\w*)|(\b(?:0[xXoObB][0-9a-fA-F_]+|\d[\d_]*(?:\.\d+)?(?:[eE][-+]?\d+)?j?)\b)/gm;
  let o='', last=0, m;
  while ((m = re.exec(src))){
    o += esc(src.slice(last, m.index)); last = re.lastIndex;

    else o += `<span class="nu">${w}</span>`;
  }
  return o + esc(src.slice(last));
}

  const re = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(^[ \t]*#[^\n]*)|([A-Za-z_]\w*)(?=\s*\()|([A-Za-z_]\w*)|(\b\d+(?:\.\d+)?[fFlLuU]*\b)/gm;
  let o='', last=0, m;
  while ((m = re.exec(src))){
    o += esc(src.slice(last, m.index)); last = re.lastIndex;
    const w = esc(m[0]);
    if (m[1]) o += `<span class="cm">${w}</span>`;
    else if (m[2]) o += `<span class="st">${w}</span>`;
    else if (m[3]) o += `<span class="pp">${w}</span>`;

    else o += `<span class="nu">${w}</span>`;
  }
  return o + esc(src.slice(last));
}

function notes(){
