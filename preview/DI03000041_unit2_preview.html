6–18</td><td>P2</td><td>2</td><td>P3, P2</td></tr><tr><td>18–20</td><td>P3</td><td>0</td><td>P2</td></tr><tr><td>20–22</td><td>P2</td><td>0</td><td>—</td></tr></table><p><b>Gantt chart:</b></p><table><tr><td><b>P0</b></td><td><b>P1</b></td><td><b>P2</b></td><td><b>P0</b></td><td><b>P3</b></td><td><b>P1</b></td><td><b>P2</b></td></tr><tr><td>0–2</td><td>2–4</td><td>4–6</td><td>6–8</td><td>8–10</td><td>10–11</td><td>11–13</td></tr></table><table><tr><td><b>P0</b></td><td><b>P3</b></td><td><b>P2</b></td><td><b>P3</b></td><td><b>P2</b></td></tr><tr><td>13–14</td><td>14–16</td><td>16–18</td><td>18–20</td><td>20–22</td></tr></table><table><tr><th>Process</th><th>AT</th><th>BT</th><th>CT</th><th>TAT = CT − AT</th><th>WT = TAT − BT</th></tr><tr><td>P0</td><td>0</td><td>5</td><td>14</td><td>14 − 0 = 14</td><td>14 − 5 = 9</td></tr><tr><td>P1</td><td>1</td><td>3</td><td>11</td><td>11 − 1 = 10</td><td>10 − 3 = 7</td></tr><tr><td>P2</td><td>2</td><td>8</td><td>22</td><td>22 − 2 = 20</td><td>20 − 8 = 12</td></tr><tr><td>P3</td><td>3</td><td>6</td><td>20</td><td>20 − 3 = 17</td><td>17 − 6 = 11</td></tr></table><p><b>Average TAT</b> = (14 + 10 + 20 + 17) / 4 = 61/4 = <b>15.25</b> units</p><p><b>Average WT</b> = (9 + 7 + 12 + 11) / 4 = 39/4 = <b>9.75</b> units</p>", "gu": "<p><b>આપેલ:</b></p><table><tr><th>Process</th><th>Arrival time</th><th>Burst time</th></tr><tr><td>P0</td><td>0</td><td>5</td></tr><tr><td>P1</td><td>1</td><td>3</td></tr><tr><td>P2</td><td>2</td><td>8</td></tr><tr><td>P3</td><td>3</td><td>6</td></tr></table><p><b>નિયમ:</b> દરેક process વધુમાં વધુ એક <b>time quantum</b> ચાલે, પછી ready queue ના છેડે જાય. અહીં વપરાયેલી પ્રથા: quantum પૂરો થાય તે જ ક્ષણે આવતી process, pre-empt થયેલી process <b>પહેલાં</b> queue માં જાય.</p><p><b>Ready-queue trace (q = 2):</b></p><table><tr><th>સમય</th><th>ચાલે</th><th>બાકી</th><th>પછી ready queue</th></tr><tr><td>0–2</td><td>P0</td><td>3</td><td>P1, P2, P0</td></tr><tr><td>2–4</td><td>P1</td><td>1</td><td>P2, P0, P3, P1</td></tr><tr><td>4–6</td><td>P2</td><td>6</td><td>P0, P3, P1, P2</td></tr><tr><td>6–8</td><td>P0</td><td>1</td><td>P3, P1, P2, P0</td></tr><tr><td>8–10</td><td>P3</td><td>4</td><td>P1, P2, P0, P3</td></tr><tr><td>10–11</td><td>P1</td><td>0</td><td>P2, P0, P3</td></tr><tr><td>11–13</td><td>P2</td><td>4</td><td>P0, P3, P2</td></tr><tr><td>13–14</td><td>P0</td><td>0</td><td>P3, P2</td></tr><tr><td>14–16</td><td>P3</td><td>2</td><td>P2, P3</td></tr><tr><td>16–18</td><td>P2</td><td>2</td><td>P3, P2</td></tr><tr><td>18–20</td><td>P3</td><td>0</td><td>P2</td></tr><tr><td>20–22</td><td>P2</td><td>0</td><td>—</td></tr></table><p><b>Gantt chart:</b></p><table><tr><td><b>P0</b></td><td><b>P1</b></td><td><b>P2</b></td><td><b>P0</b></td><td><b>P3</b></td><td><b>P1</b></td><td><b>P2</b></td></tr><tr><td>0–2</td><td>2–4</td><td>4–6</td><td>6–8</td><td>8–10</td><td>10–11</td><td>11–13</td></tr></table><table><tr><td><b>P0</b></td><td><b>P3</b></td><td><b>P2</b></td><td><b>P3</b></td><td><b>P2</b></td></tr><tr><td>13–14</td><td>14–16</td><td>16–18</td><td>18–20</td><td>20–22</td></tr></table><table><tr><th>Process</th><th>AT</th><th>BT</th><th>CT</th><th>TAT = CT − AT</th><th>WT = TAT − BT</th></tr><tr><td>P0</td><td>0</td><td>5</td><td>14</td><td>14 − 0 = 14</td><td>14 − 5 = 9</td></tr><tr><td>P1</td><td>1</td><td>3</td><td>11</td><td>11 − 1 = 10</td><td>10 − 3 = 7</td></tr><tr><td>P2</td><td>2</td><td>8</td><td>22</td><td>22 − 2 = 20</td><td>20 − 8 = 12</td></tr><tr><td>P3</td><td>3</td><td>6</td><td>20</td><td>20 − 3 = 17</td><td>17 − 6 = 11</td></tr></table><p><b>સરેરાશ TAT</b> = (14 + 10 + 20 + 17) / 4 = 61/4 = <b>15.25</b> units</p><p><b>સરેરાશ WT</b> = (9 + 7 + 12 + 11) / 4 = 39/4 = <b>9.75</b> units</p>"}}, {"id": "os2n4", "q": {"en": "(Practical 2b) FCFS: Arrival times 3, 0, 4, 5 and burst times 5, 4, 2, 4 for P0, P1, P2, P3. Draw the Gantt chart and find the average turnaround time and average waiting time.", "gu": "(Practical 2b) FCFS: P0, P1, P2, P3 માટે arrival time 3, 0, 4, 5 અને burst time 5, 4, 2, 4. Gantt chart દોરો અને સરેરાશ turnaround time અને સરેરાશ waiting time શોધો."}, "a": {"en": "<p><b>Given:</b></p><table><tr><th>Process</th><th>Arrival time</th><th>Burst time</th></tr><tr><td>P0</td><td>3</td><td>5</td></tr><tr><td>P1</td><td>0</td><td>4</td></tr><tr><td>P2</td><td>4</td><td>2</td></tr><tr><td>P3</td><td>5</td><td>4</td></tr></table><p><b>Rule:</b> the CPU is given to processes in the order of their <b>arrival</b>; a running process is never pre-empted.</p><p><b>Gantt chart:</b></p><table><tr><td><b>P1</b></td><td><b>P0</b></td><td><b>P2</b></td><td><b>P3</b></td></tr><tr><td>0–4</td><td>4–9</td><td>9–11</td><td>11–15</td></tr></table><p>Order of arrival: P1 (0), P0 (3), P2 (4), P3 (5).</p><table><tr><th>Process</th><th>AT</th><th>BT</th><th>CT</th><th>TAT = CT − AT</th><th>WT = TAT − BT</th></tr><tr><td>P0</td><td>3</td><td>5</td><td>9</td><td>9 − 3 = 6</td><td>6 − 5 = 1</td></tr><tr><td>P1</td><td>0</td><td>4</td><td>4</td><td>4 − 0 = 4</td><td>4 − 4 = 0</td></tr><tr><td>P2</td><td>4</td><td>2</td><td>11</td><td>11 − 4 = 7</td><td>7 − 2 = 5</td></tr><tr><td>P3</td><td>5</td><td>4</td><td>15</td><td>15 − 5 = 10</td><td>10 − 4 = 6</td></tr></table><p><b>Average TAT</b> = (6 + 4 + 7 + 10) / 4 = 27/4 = <b>6.75</b> units</p><p><b>Average WT</b> = (1 + 0 + 5 + 6) / 4 = 12/4 = <b>3</b> units</p>", "gu": "<p><b>આપેલ:</b></p><table><tr><th>Process</th><th>Arrival time</th><th>Burst time</th></tr><tr><td>P0</td><td>3</td><td>5</td></tr><tr><td>P1</td><td>0</td><td>4</td></tr><tr><td>P2</td><td>4</td><td>2</td></tr><tr><td>P3</td><td>5</td><td>4</td></tr></table><p><b>નિયમ:</b> CPU processes ને તેમના <b>arrival</b> ના ક્રમમાં મળે છે; ચાલતી process ને ક્યારેય pre-empt કરાતી નથી.</p><p><b>Gantt chart:</b></p><table><tr><td><b>P1</b></td><td><b>P0</b></td><td><b>P2</b></td><td><b>P3</b></td></tr><tr><td>0–4</td><td>4–9</td><td>9–11</td><td>11–15</td></tr></table><p>Arrival નો ક્રમ: P1 (0), P0 (3), P2 (4), P3 (5).</p><table><tr><th>Process</th><th>AT</th><th>BT</th><th>CT</th><th>TAT = CT − AT</th><th>WT = TAT − BT</th></tr><tr><td>P0</td><td>3</td><td>5</td><td>9</td><td>9 − 3 = 6</td><td>6 − 5 = 1</td></tr><tr><td>P1</td><td>0</td><td>4</td><td>4</td><td>4 − 0 = 4</td><td>4 − 4 = 0</td></tr><tr><td>P2</td><td>4</td><td>2</td><td>11</td><td>11 − 4 = 7</td><td>7 − 2 = 5</td></tr><tr><td>P3</td><td>5</td><td>4</td><td>15</td><td>15 − 5 = 10</td><td>10 − 4 = 6</td></tr></table><p><b>સરેરાશ TAT</b> = (6 + 4 + 7 + 10) / 4 = 27/4 = <b>6.75</b> units</p><p><b>સરેરાશ WT</b> = (1 + 0 + 5 + 6) / 4 = 12/4 = <b>3</b> units</p>"}}, {"id": "os2n5", "q": {"en": "(Practical 2b) SJF (non-preemptive): Arrival times 3, 0, 4, 5 and burst times 5, 4, 2, 4 for P0, P1, P2, P3. Draw the Gantt chart and find the average turnaround time and average waiting time.", "gu": "(Practical 2b) SJF (non-preemptive): P0, P1, P2, P3 માટે arrival time 3, 0, 4, 5 અને burst time 5, 4, 2, 4. Gantt chart દોરો અને સરેરાશ turnaround time અને સરેરાશ waiting time શોધો."}, "a": {"en": "<p><b>Given:</b></p><table><tr><th>Process</th><th>Arrival time</th><th>Burst time</th></tr><tr><td>P0</td><td>3</td><td>5</td></tr><tr><td>P1</td><td>0</td><td>4</td></tr><tr><td>P2</td><td>4</td><td>2</td></tr><tr><td>P3</td><td>5</td><td>4</td></tr></table><p><b>Rule:</b> whenever the CPU becomes free, choose the <b>arrived</b> process with the <b>smallest burst time</b> (tie → FCFS). Non-preemptive: it runs to completion.</p><p><b>Gantt chart:</b></p><table><tr><td><b>P1</b></td><td><b>P2</b></td><td><b>P3</b></td><td><b>P0</b></td></tr><tr><td>0–4</td><td>4–6</td><td>6–10</td><td>10–15</td></tr></table><p>Only P1 is present at 0 → runs 0–4. At 4: P0 (5), P2 (2) → P2 (4–6). At 6: P0 (5), P3 (4) → P3 (6–10), then P0 (10–15).</p><table><tr><th>Process</th><th>AT</th><th>BT</th><th>CT</th><th>TAT = CT − AT</th><th>WT = TAT − BT</th></tr><tr><td>P0</td><td>3</td><td>5</td><td>15</td><td>15 − 3 = 12</td><td>12 − 5 = 7</td></tr><tr><td>P1</td><td>0</td><td>4</td><td>4</td><td>4 − 0 = 4</td><td>4 − 4 = 0</td></tr><tr><td>P2</td><td>4</td><td>2</td><td>6</td><td>6 − 4 = 2</td><td>2 − 2 = 0</td></tr><tr><td>P3</td><td>5</td><td>4</td><td>10</td><td>10 − 5 = 5</td><td>5 − 4 = 1</td></tr></table><p><b>Average TAT</b> = (12 + 4 + 2 + 5) / 4 = 23/4 = <b>5.75</b> units</p><p><b>Average WT</b> = (7 + 0 + 0 + 1) / 4 = 8/4 = <b>2</b> units</p>", "gu": "<p><b>આપેલ:</b></p><table><tr><th>Process</th><th>Arrival time</th><th>Burst time</th></tr><tr><td>P0</td><td>3</td><td>5</td></tr><tr><td>P1</td><td>0</td><td>4</td></tr><tr><td>P2</td><td>4</td><td>2</td></tr><tr><td>P3</td><td>5</td><td>4</td></tr></table><p><b>નિયમ:</b> CPU મુક્ત થાય ત્યારે આવી ગયેલી processes માંથી <b>સૌથી નાના burst time</b> વાળી પસંદ કરો (સરખા હોય તો FCFS). Non-preemptive: તે પૂરી થાય ત્યાં સુધી ચાલે.</p><p><b>Gantt chart:</b></p><table><tr><td><b>P1</b></td><td><b>P2</b></td><td><b>P3</b></td><td><b>P0</b></td></tr><tr><td>0–4</td><td>4–6</td><td>6–10</td><td>10–15</td></tr></table><p>0 પર માત્ર P1 → 0–4 ચાલે. 4 પર: P0 (5), P2 (2) → P2 (4–6). 6 પર: P0 (5), P3 (4) → P3 (6–10), પછી P0 (10–15).</p><table><tr><th>Process</th><th>AT</th><th>BT</th><th>CT</th><th>TAT = CT − AT</th><th>WT = TAT − BT</th></tr><tr><td>P0</td><td>3</td><td>5</td><td>15</td><td>15 − 3 = 12</td><td>12 − 5 = 7</td></tr><tr><td>P1</td><td>0</td><td>4</td><td>4</td><td>4 − 0 = 4</td><td>4 − 4 = 0</td></tr><tr><td>P2</td><td>4</td><td>2</td><td>6</td><td>6 − 4 = 2</td><td>2 − 2 = 0</td></tr><tr><td>P3</td><td>5</td><td>4</td><td>10</td><td>10 − 5 = 5</td><td>5 − 4 = 1</td></tr></table><p><b>સરેરાશ TAT</b> = (12 + 4 + 2 + 5) / 4 = 23/4 = <b>5.75</b> units</p><p><b>સરેરાશ WT</b> = (7 + 0 + 0 + 1) / 4 = 8/4 = <b>2</b> units</p>"}}, {"id": "os2n6", "q": {"en": "(Practical 2b) Round Robin with time quantum 2: Arrival times 3, 0, 4, 5 and burst times 5, 4, 2, 4 for P0, P1, P2, P3. Draw the Gantt chart and find the average turnaround time and average waiting time.", "gu": "(Practical 2b) Time quantum 2 સાથે Round Robin: P0, P1, P2, P3 માટે arrival time 3, 0, 4, 5 અને burst time 5, 4, 2, 4. Gantt chart દોરો અને સરેરાશ turnaround time અને સરેરાશ waiting time શોધો."}, "a": {"en": "<p><b>Given:</b></p><table><tr><th>Process</th><th>Arrival time</th><th>Burst time</th></tr><tr><td>P0</td><td>3</td><td>5</td></tr><tr><td>P1</td><td>0</td><td>4</td></tr><tr><td>P2</td><td>4</td><td>2</td></tr><tr><td>P3</td><td>5</td><td>4</td></tr></table><p><b>Rule:</b> each process runs for at most one <b>time quantum</b>, then goes to the tail of the ready queue. Convention used: a process arriving at the same moment a quantum expires enters the queue <b>before</b> the pre-empted process.</p><p><b>Ready-queue trace (q = 2):</b></p><table><tr><th>Time</th><th>Runs</th><th>Remaining</th><th>Ready queue after</th></tr><tr><td>0–2</td><td>P1</td><td>2</td><td>P1</td></tr><tr><td>2–4</td><td>P1</td><td>0</td><td>P0, P2</td></tr><tr><td>4–6</td><td>P0</td><td>3</td><td>P2, P3, P0</td></tr><tr><td>6–8</td><td>P2</td><td>0</td><td>P3, P0</td></tr><tr><td>8–10</td><td>P3</td><td>2</td><td>P0, P3</td></tr><tr><td>10–12</td><td>P0</td><td>1</td><td>P3, P0</td></tr><tr><td>12–14</td><td>P3</td><td>0</td><td>P0</td></tr><tr><td>14–15</td><td>P0</td><td>0</td><td>—</td></tr></table><p><b>Gantt chart:</b></p><table><tr><td><b>P1</b></td><td><b>P0</b></td><td><b>P2</b></td><td><b>P3</b></td><td><b>P0</b></td><td><b>P3</b></td><td><b>P0</b></td></tr><tr><td>0–4</td><td>4–6</td><td>6–8</td><td>8–10</td><td>10–12</td><td>12–14</td><td>14–15</td></tr></table><p>P1 is alone from 0 to 4, so it gets two quanta one after another.</p><table><tr><th>Process</th><th>AT</th><th>BT</th><th>CT</th><th>TAT = CT − AT</th><th>WT = TAT − BT</th></tr><tr><td>P0</td><td>3</td><td>5</td><td>15</td><td>15 − 3 = 12</td><td>12 − 5 = 7</td></tr><tr><td>P1</td><td>0</td><td>4</td><td>4</td><td>4 − 0 = 4</td><td>4 − 4 = 0</td></tr><tr><td>P2</td><td>4</td><td>2</td><td>8</td><td>8 − 4 = 4</td><td>4 − 2 = 2</td></tr><tr><td>P3</td><td>5</td><td>4</td><td>14</td><td>14 − 5 = 9</td><td>9 − 4 = 5</td></tr></table><p><b>Average TAT</b> = (12 + 4 + 4 + 9) / 4 = 29/4 = <b>7.25</b> units</p><p><b>Average WT</b> = (7 + 0 + 2 + 5) / 4 = 14/4 = <b>3.5</b> units</p>", "gu": "<p><b>આપેલ:</b></p><table><tr><th>Process</th><th>Arrival time</th><th>Burst time</th></tr><tr><td>P0</td><td>3</td><td>5</td></tr><tr><td>P1</td><td>0</td><td>4</td></tr><tr><td>P2</td><td>4</td><td>2</td></tr><tr><td>P3</td><td>5</td><td>4</td></tr></table><p><b>નિયમ:</b> દરેક process વધુમાં વધુ એક <b>time quantum</b> ચાલે, પછી ready queue ના છેડે જાય. અહીં વપરાયેલી પ્રથા: quantum પૂરો થાય તે જ ક્ષણે આવતી process, pre-empt થયેલી process <b>પહેલાં</b> queue માં જાય.</p><p><b>Ready-queue trace (q = 2):</b></p><table><tr><th>સમય</th><th>ચાલે</th><th>બાકી</th><th>પછી ready queue</th></tr><tr><td>0–2</td><td>P1</td><td>2</td><td>P1</td></tr><tr><td>2–4</td><td>P1</td><td>0</td><td>P0, P2</td></tr><tr><td>4–6</td><td>P0</td><td>3</td><td>P2, P3, P0</td></tr><tr><td>6–8</td><td>P2</td><td>0</td><td>P3, P0</td></tr><tr><td>8–10</td><td>P3</td><td>2</td><td>P0, P3</td></tr><tr><td>10–12</td><td>P0</td><td>1</td><td>P3, P0</td></tr><tr><td>12–14</td><td>P3</td><td>0</td><td>P0</td></tr><tr><td>14–15</td><td>P0</td><td>0</td><td>—</td></tr></table><p><b>Gantt chart:</b></p><table><tr><td><b>P1</b></td><td><b>P0</b></td><td><b>P2</b></td><td><b>P3</b></td><td><b>P0</b></td><td><b>P3</b></td><td><b>P0</b></td></tr><tr><td>0–4</td><td>4–6</td><td>6–8</td><td>8–10</td><td>10–12</td><td>12–14</td><td>14–15</td></tr></table><p>0 થી 4 સુધી P1 એકલી છે, તેથી તેને સળંગ બે quantum મળે છે.</p><table><tr><th>Process</th><th>AT</th><th>BT</th><th>CT</th><th>TAT = CT − AT</th><th>WT = TAT − BT</th></tr><tr><td>P0</td><td>3</td><td>5</td><td>15</td><td>15 − 3 = 12</td><td>12 − 5 = 7</td></tr><tr><td>P1</td><td>0</td><td>4</td><td>4</td><td>4 − 0 = 4</td><td>4 − 4 = 0</td></tr><tr><td>P2</td><td>4</td><td>2</td><td>8</td><td>8 − 4 = 4</td><td>4 − 2 = 2</td></tr><tr><td>P3</td><td>5</td><td>4</td><td>14</td><td>14 − 5 = 9</td><td>9 − 4 = 5</td></tr></table><p><b>સરેરાશ TAT</b> = (12 + 4 + 4 + 9) / 4 = 29/4 = <b>7.25</b> units</p><p><b>સરેરાશ WT</b> = (7 + 0 + 2 + 5) / 4 = 14/4 = <b>3.5</b> units</p>"}}, {"id": "os2n7", "q": {"en": "Using non-preemptive priority scheduling, find the average waiting time and turnaround time. All processes arrive at time 0. Burst times: P1 = 10, P2 = 1, P3 = 2, P4 = 1, P5 = 5; priorities 3, 1, 4, 5, 2 (smaller number = higher priority).", "gu": "Non-preemptive priority scheduling વાપરી સરેરાશ waiting time અને turnaround time શોધો. બધી processes 0 પર આવે છે. Burst time: P1 = 10, P2 = 1, P3 = 2, P4 = 1, P5 = 5; priorities 3, 1, 4, 5, 2 (નાની સંખ્યા = ઊંચી priority)."}, "a": {"en": "<p><b>Given:</b></p><table><tr><th>Process</th><th>Arrival time</th><th>Burst time</th><th>Priority</th></tr><tr><td>P1</td><td>0</td><td>10</td><td>3</td></tr><tr><td>P2</td><td>0</td><td>1</td><td>1</td></tr><tr><td>P3</td><td>0</td><td>2</td><td>4</td></tr><tr><td>P4</td><td>0</td><td>1</td><td>5</td></tr><tr><td>P5</td><td>0</td><td>5</td><td>2</td></tr></table><p><b>Rule:</b> when the CPU is free, choose the arrived process with the <b>highest priority</b> (smallest number; tie → FCFS). Non-preemptive.</p><p><b>Gantt chart:</b></p><table><tr><td><b>P2</b></td><td><b>P5</b></td><td><b>P1</b></td><td><b>P3</b></td><td><b>P4</b></td></tr><tr><td>0–1</td><td>1–6</td><td>6–16</td><td>16–18</td><td>18–19</td></tr></table><p>All arrive together, so order by priority: P2 (1), P5 (2), P1 (3), P3 (4), P4 (5).</p><table><tr><th>Process</th><th>AT</th><th>BT</th><th>Priority</th><th>CT</th><th>TAT = CT − AT</th><th>WT = TAT − BT</th></tr><tr><td>P1</td><td>0</td><td>10</td><td>3</td><td>16</td><td>16 − 0 = 16</td><td>16 − 10 = 6</td></tr><tr><td>P2</td><td>0</td><td>1</td><td>1</td><td>1</td><td>1 − 0 = 1</td><td>1 − 1 = 0</td></tr><tr><td>P3</td><td>0</td><td>2</td><td>4</td><td>18</td><td>18 − 0 = 18</td><td>18 − 2 = 16</td></tr><tr><td>P4</td><td>0</td><td>1</td><td>5</td><td>19</td><td>19 − 0 = 19</td><td>19 − 1 = 18</td></tr><tr><td>P5</td><td>0</td><td>5</td><td>2</td><td>6</td><td>6 − 0 = 6</td><td>6 − 5 = 1</td></tr></table><p><b>Average TAT</b> = (16 + 1 + 18 + 19 + 6) / 5 = 60/5 = <b>12</b> units</p><p><b>Average WT</b> = (6 + 0 + 16 + 18 + 1) / 5 = 41/5 = <b>8.2</b> units</p>", "gu": "<p><b>આપેલ:</b></p><table><tr><th>Process</th><th>Arrival time</th><th>Burst time</th><th>Priority</th></tr><tr><td>P1</td><td>0</td><td>10</td><td>3</td></tr><tr><td>P2</td><td>0</td><td>1</td><td>1</td></tr><tr><td>P3</td><td>0</td><td>2</td><td>4</td></tr><tr><td>P4</td><td>0</td><td>1</td><td>5</td></tr><tr><td>P5</td><td>0</td><td>5</td><td>2</td></tr></table><p><b>નિયમ:</b> CPU મુક્ત થાય ત્યારે આવી ગયેલી processes માંથી <b>સૌથી ઊંચી priority</b> (સૌથી નાની સંખ્યા; સરખી હોય તો FCFS) વાળી પસંદ કરો. Non-preemptive.</p><p><b>Gantt chart:</b></p><table><tr><td><b>P2</b></td><td><b>P5</b></td><td><b>P1</b></td><td><b>P3</b></td><td><b>P4</b></td></tr><tr><td>0–1</td><td>1–6</td><td>6–16</td><td>16–18</td><td>18–19</td></tr></table><p>બધી સાથે આવે છે, તેથી priority ક્રમ: P2 (1), P5 (2), P1 (3), P3 (4), P4 (5).</p><table><tr><th>Process</th><th>AT</th><th>BT</th><th>Priority</th><th>CT</th><th>TAT = CT − AT</th><th>WT = TAT − BT</th></tr><tr><td>P1</td><td>0</td><td>10</td><td>3</td><td>16</td><td>16 − 0 = 16</td><td>16 − 10 = 6</td></tr><tr><td>P2</td><td>0</td><td>1</td><td>1</td><td>1</td><td>1 − 0 = 1</td><td>1 − 1 = 0</td></tr><tr><td>P3</td><td>0</td><td>2</td><td>4</td><td>18</td><td>18 − 0 = 18</td><td>18 − 2 = 16</td></tr><tr><td>P4</td><td>0</td><td>1</td><td>5</td><td>19</td><td>19 − 0 = 19</td><td>19 − 1 = 18</td></tr><tr><td>P5</td><td>0</td><td>5</td><td>2</td><td>6</td><td>6 − 0 = 6</td><td>6 − 5 = 1</td></tr></table><p><b>સરેરાશ TAT</b> = (16 + 1 + 18 + 19 + 6) / 5 = 60/5 = <b>12</b> units</p><p><b>સરેરાશ WT</b> = (6 + 0 + 16 + 18 + 1) / 5 = 41/5 = <b>8.2</b> units</p>"}}, {"id": "os2n8", "q": {"en": "Non-preemptive priority scheduling with arrival times: P1 (AT 0, BT 4, priority 3), P2 (1, 3, 1), P3 (2, 2, 4), P4 (3, 5, 2), P5 (4, 1, 1). Smaller number = higher priority. Draw the Gantt chart and find average TAT and WT.", "gu": "Arrival time સાથે non-preemptive priority scheduling: P1 (AT 0, BT 4, priority 3), P2 (1, 3, 1), P3 (2, 2, 4), P4 (3, 5, 2), P5 (4, 1, 1). નાની સંખ્યા = ઊંચી priority. Gantt chart દોરો અને સરેરાશ TAT અને WT શોધો."}, "a": {"en": "<p><b>Given:</b></p><table><tr><th>Process</th><th>Arrival time</th><th>Burst time</th><th>Priority</th></tr><tr><td>P1</td><td>0</td><td>4</td><td>3</td></tr><tr><td>P2</td><td>1</td><td>3</td><td>1</td></tr><tr><td>P3</td><td>2</td><td>2</td><td>4</td></tr><tr><td>P4</td><td>3</td><td>5</td><td>2</td></tr><tr><td>P5</td><td>4</td><td>1</td><td>1</td></tr></table><p><b>Rule:</b> when the CPU is free, choose the arrived process with the <b>highest priority</b> (smallest number; tie → FCFS). Non-preemptive.</p><p><b>Gantt chart:</b></p><table><tr><td><b>P1</b></td><td><b>P2</b></td><td><b>P5</b></td><td><b>P4</b></td><td><b>P3</b></td></tr><tr><td>0–4</td><td>4–7</td><td>7–8</td><td>8–13</td><td>13–15</td></tr></table><p>P1 is alone at 0 and runs 0–4 (no pre-emption). At 4 all others have arrived: P2 and P5 both have priority 1 → tie broken by arrival, so P2 (4–7), then P5 (7–8), P4 (8–13), P3 (13–15).</p><table><tr><th>Process</th><th>AT</th><th>BT</th><th>Priority</th><th>CT</th><th>TAT = CT − AT</th><th>WT = TAT − BT</th></tr><tr><td>P1</td><td>0</td><td>4</td><td>3</td><td>4</td><td>4 − 0 = 4</td><td>4 − 4 = 0</td></tr><tr><td>P2</td><td>1</td><td>3</td><td>1</td><td>7</td><td>7 − 1 = 6</td><td>6 − 3 = 3</td></tr><tr><td>P3</td><td>2</td><td>2</td><td>4</td><td>15</td><td>15 − 2 = 13</td><td>13 − 2 = 11</td></tr><tr><td>P4</td><td>3</td><td>5</td><td>2</td><td>13</td><td>13 − 3 = 10</td><td>10 − 5 = 5</td></tr><tr><td>P5</td><td>4</td><td>1</td><td>1</td><td>8</td><td>8 − 4 = 4</td><td>4 − 1 = 3</td></tr></table><p><b>Average TAT</b> = (4 + 6 + 13 + 10 + 4) / 5 = 37/5 = <b>7.4</b> units</p><p><b>Average WT</b> = (0 + 3 + 11 + 5 + 3) / 5 = 22/5 = <b>4.4</b> units</p>", "gu": "<p><b>આપેલ:</b></p><table><tr><th>Process</th><th>Arrival time</th><th>Burst time</th><th>Priority</th></tr><tr><td>P1</td><td>0</td><td>4</td><td>3</td></tr><tr><td>P2</td><td>1</td><td>3</td><td>1</td></tr><tr><td>P3</td><td>2</td><td>2</td><td>4</td></tr><tr><td>P4</td><td>3</td><td>5</td><td>2</td></tr><tr><td>P5</td><td>4</td><td>1</td><td>1</td></tr></table><p><b>નિયમ:</b> CPU મુક્ત થાય ત્યારે આવી ગયેલી processes માંથી <b>સૌથી ઊંચી priority</b> (સૌથી નાની સંખ્યા; સરખી હોય તો FCFS) વાળી પસંદ કરો. Non-preemptive.</p><p><b>Gantt chart:</b></p><table><tr><td><b>P1</b></td><td><b>P2</b></td><td><b>P5</b></td><td><b>P4</b></td><td><b>P3</b></td></tr><tr><td>0–4</td><td>4–7</td><td>7–8</td><td>8–13</td><td>13–15</td></tr></table><p>0 પર P1 એકલી છે અને 0–4 ચાલે (pre-emption નહીં). 4 પર બાકીની બધી આવી ગઈ: P2 અને P5 બંનેની priority 1 → arrival થી tie તોડો, તેથી P2 (4–7), પછી P5 (7–8), P4 (8–13), P3 (13–15).</p><table><tr><th>Process</th><th>AT</th><th>BT</th><th>Priority</th><th>CT</th><th>TAT = CT − AT</th><th>WT = TAT − BT</th></tr><tr><td>P1</td><td>0</td><td>4</td><td>3</td><td>4</td><td>4 − 0 = 4</td><td>4 − 4 = 0</td></tr><tr><td>P2</td><td>1</td><td>3</td><td>1</td><td>7</td><td>7 − 1 = 6</td><td>6 − 3 = 3</td></tr><tr><td>P3</td><td>2</td><td>2</td><td>4</td><td>15</td><td>15 − 2 = 13</td><td>13 − 2 = 11</td></tr><tr><td>P4</td><td>3</td><td>5</td><td>2</td><td>13</td><td>13 − 3 = 10</td><td>10 − 5 = 5</td></tr><tr><td>P5</td><td>4</td><td>1</td><td>1</td><td>8</td><td>8 − 4 = 4</td><td>4 − 1 = 3</td></tr></table><p><b>સરેરાશ TAT</b> = (4 + 6 + 13 + 10 + 4) / 5 = 37/5 = <b>7.4</b> units</p><p><b>સરેરાશ WT</b> = (0 + 3 + 11 + 5 + 3) / 5 = 22/5 = <b>4.4</b> units</p>"}}, {"id": "os2n9", "q": {"en": "Processes P1, P2, P3 with burst times 24, 3, 3 ms arrive at time 0. Find the average waiting time under FCFS if they arrive in the order (i) P1, P2, P3 (ii) P2, P3, P1. What does this show?", "gu": "Burst time 24, 3, 3 ms વાળી processes P1, P2, P3 સમય 0 પર આવે છે. FCFS માં સરેરાશ waiting time શોધો જો ક્રમ (i) P1, P2, P3 (ii) P2, P3, P1 હોય. આ શું દર્શાવે છે?"}, "a": {"en": "<p><b>(i) Order P1, P2, P3</b></p><table><tr><td><b>P1</b></td><td><b>P2</b></td><td><b>P3</b></td></tr><tr><td>0–24</td><td>24–27</td><td>27–30</td></tr></table><p>WT: P1 = 0, P2 = 24, P3 = 27 → average = (0 + 24 + 27)/3 = <b>17 ms</b></p><p><b>(ii) Order P2, P3, P1</b></p><table><tr><td><b>P2</b></td><td><b>P3</b></td><td><b>P1</b></td></tr><tr><td>0–3</td><td>3–6</td><td>6–30</td></tr></table><p>WT: P2 = 0, P3 = 3, P1 = 6 → average = (0 + 3 + 6)/3 = <b>3 ms</b></p><p><b>Conclusion:</b> FCFS waiting time depends heavily on the order. Short processes stuck behind one long process wait a lot: this is the <b>convoy effect</b>.</p>", "gu": "<p><b>(i) ક્રમ P1, P2, P3</b></p><table><tr><td><b>P1</b></td><td><b>P2</b></td><td><b>P3</b></td></tr><tr><td>0–24</td><td>24–27</td><td>27–30</td></tr></table><p>WT: P1 = 0, P2 = 24, P3 = 27 → સરેરાશ = (0 + 24 + 27)/3 = <b>17 ms</b></p><p><b>(ii) ક્રમ P2, P3, P1</b></p><table><tr><td><b>P2</b></td><td><b>P3</b></td><td><b>P1</b></td></tr><tr><td>0–3</td><td>3–6</td><td>6–30</td></tr></table><p>WT: P2 = 0, P3 = 3, P1 = 6 → સરેરાશ = (0 + 3 + 6)/3 = <b>3 ms</b></p><p><b>નિષ્કર્ષ:</b> FCFS નો waiting time ક્રમ પર ખૂબ આધાર રાખે છે. એક લાંબી process પાછળ ફસાયેલી નાની processes ઘણી રાહ જુએ છે: આને <b>convoy effect</b> કહે છે.</p>"}}, {"id": "os2n10", "q": {"en": "Using preemptive SJF (SRTF), find the average waiting time: P1 (AT 0, BT 8), P2 (1, 4), P3 (2, 9), P4 (3, 5).", "gu": "Preemptive SJF (SRTF) વાપરી સરેરાશ waiting time શોધો: P1 (AT 0, BT 8), P2 (1, 4), P3 (2, 9), P4 (3, 5)."}, "a": {"en": "<p><b>Given:</b></p><table><tr><th>Process</th><th>Arrival time</th><th>Burst time</th></tr><tr><td>P1</td><td>0</td><td>8</td></tr><tr><td>P2</td><td>1</td><td>4</td></tr><tr><td>P3</td><td>2</td><td>9</td></tr><tr><td>P4</td><td>3</td><td>5</td></tr></table><p><b>Rule (SRTF = preemptive SJF):</b> at every arrival, the process with the <b>shortest remaining time</b> gets the CPU; the running process can be pre-empted.</p><p><b>Gantt chart:</b></p><table><tr><td><b>P1</b></td><td><b>P2</b></td><td><b>P4</b></td><td><b>P1</b></td><td><b>P3</b></td></tr><tr><td>0–1</td><td>1–5</td><td>5–10</td><td>10–17</td><td>17–26</td></tr></table><p>At 1, P2 (4) is shorter than P1's remaining 7 → P1 is pre-empted. P2 finishes at 5; then P4 (5) runs 5–10, P1 (7 left) 10–17, P3 17–26.</p><table><tr><th>Process</th><th>AT</th><th>BT</th><th>CT</th><th>TAT = CT − AT</th><th>WT = TAT − BT</th></tr><tr><td>P1</td><td>0</td><td>8</td><td>17</td><td>17 − 0 = 17</td><td>17 − 8 = 9</td></tr><tr><td>P2</td><td>1</td><td>4</td><td>5</td><td>5 − 1 = 4</td><td>4 − 4 = 0</td></tr><tr><td>P3</td><td>2</td><td>9</td><td>26</td><td>26 − 2 = 24</td><td>24 − 9 = 15</td></tr><tr><td>P4</td><td>3</td><td>5</td><td>10</td><td>10 − 3 = 7</td><td>7 − 5 = 2</td></tr></table><p><b>Average TAT</b> = (17 + 4 + 24 + 7) / 4 = 52/4 = <b>13</b> units</p><p><b>Average WT</b> = (9 + 0 + 15 + 2) / 4 = 26/4 = <b>6.5</b> units</p>", "gu": "<p><b>આપેલ:</b></p><table><tr><th>Process</th><th>Arrival time</th><th>Burst time</th></tr><tr><td>P1</td><td>0</td><td>8</td></tr><tr><td>P2</td><td>1</td><td>4</td></tr><tr><td>P3</td><td>2</td><td>9</td></tr><tr><td>P4</td><td>3</td><td>5</td></tr></table><p><b>નિયમ (SRTF = preemptive SJF):</b> દરેક arrival વખતે <b>સૌથી ઓછો remaining time</b> વાળી process ને CPU મળે; ચાલતી process pre-empt થઈ શકે.</p><p><b>Gantt chart:</b></p><table><tr><td><b>P1</b></td><td><b>P2</b></td><td><b>P4</b></td><td><b>P1</b></td><td><b>P3</b></td></tr><tr><td>0–1</td><td>1–5</td><td>5–10</td><td>10–17</td><td>17–26</td></tr></table><p>1 પર P2 (4) એ P1 ના બાકી 7 કરતાં નાનો → P1 pre-empt થાય. P2 5 પર પૂરી; પછી P4 (5) 5–10, P1 (7 બાકી) 10–17, P3 17–26.</p><table><tr><th>Process</th><th>AT</th><th>BT</th><th>CT</th><th>TAT = CT − AT</th><th>WT = TAT − BT</th></tr><tr><td>P1</td><td>0</td><td>8</td><td>17</td><td>17 − 0 = 17</td><td>17 − 8 = 9</td></tr><tr><td>P2</td><td>1</td><td>4</td><td>5</td><td>5 − 1 = 4</td><td>4 − 4 = 0</td></tr><tr><td>P3</td><td>2</td><td>9</td><td>26</td><td>26 − 2 = 24</td><td>24 − 9 = 15</td></tr><tr><td>P4</td><td>3</td><td>5</td><td>10</td><td>10 − 3 = 7</td><td>7 − 5 = 2</td></tr></table><p><b>સરેરાશ TAT</b> = (17 + 4 + 24 + 7) / 4 = 52/4 = <b>13</b> units</p><p><b>સરેરાશ WT</b> = (9 + 0 + 15 + 2) / 4 = 26/4 = <b>6.5</b> units</p>"}}, {"id": "os2n11", "q": {"en": "Round Robin with quantum 4 ms: P1, P2, P3 with burst times 24, 3, 3 ms, all arriving at 0. Find average waiting time and compare it with FCFS.", "gu": "Quantum 4 ms સાથે Round Robin: burst time 24, 3, 3 ms વાળી P1, P2, P3, બધી 0 પર આવે. સરેરાશ waiting time શોધો અને FCFS સાથે સરખાવો."}, "a": {"en": "<p><b>Given:</b></p><table><tr><th>Process</th><th>Arrival time</th><th>Burst time</th></tr><tr><td>P1</td><td>0</td><td>24</td></tr><tr><td>P2</td><td>0</td><td>3</td></tr><tr><td>P3</td><td>0</td><td>3</td></tr></table><p><b>Rule:</b> each process runs for at most one <b>time quantum</b>, then goes to the tail of the ready queue. Convention used: a process arriving at the same moment a quantum expires enters the queue <b>before</b> the pre-empted process.</p><p><b>Ready-queue trace (q = 4):</b></p><table><tr><th>Time</th><th>Runs</th><th>Remaining</th><th>Ready queue after</th></tr><tr><td>0–4</td><td>P1</td><td>20</td><td>P2, P3, P1</td></tr><tr><td>4–7</td><td>P2</td><td>0</td><td>P3, P1</td></tr><tr><td>7–10</td><td>P3</td><td>0</td><td>P1</td></tr><tr><td>10–14</td><td>P1</td><td>16</td><td>P1</td></tr><tr><td>14–18</td><td>P1</td><td>12</td><td>P1</td></tr><tr><td>18–22</td><td>P1</td><td>8</td><td>P1</td></tr><tr><td>22–26</td><td>P1</td><td>4</td><td>P1</td></tr><tr><td>26–30</td><td>P1</td><td>0</td><td>—</td></tr></table><p><b>Gantt chart:</b></p><table><tr><td><b>P1</b></td><td><b>P2</b></td><td><b>P3</b></td><td><b>P1</b></td></tr><tr><td>0–4</td><td>4–7</td><td>7–10</td><td>10–30</td></tr></table><p>P2 and P3 finish within their first quantum; P1 then runs alone in quanta of 4 till 30.</p><table><tr><th>Process</th><th>AT</th><th>BT</th><th>CT</th><th>TAT = CT − AT</th><th>WT = TAT − BT</th></tr><tr><td>P1</td><td>0</td><td>24</td><td>30</td><td>30 − 0 = 30</td><td>30 − 24 = 6</td></tr><tr><td>P2</td><td>0</td><td>3</td><td>7</td><td>7 − 0 = 7</td><td>7 − 3 = 4</td></tr><tr><td>P3</td><td>0</td><td>3</td><td>10</td><td>10 − 0 = 10</td><td>10 − 3 = 7</td></tr></table><p><b>Average TAT</b> = (30 + 7 + 10) / 3 = 47/3 = <b>15.67</b> units</p><p><b>Average WT</b> = (6 + 4 + 7) / 3 = 17/3 = <b>5.67</b> units</p><p>FCFS (order P1, P2, P3) gave average WT = 17 ms; RR gives 5.67 ms because the short jobs need not wait behind P1.</p>", "gu": "<p><b>આપેલ:</b></p><table><tr><th>Process</th><th>Arrival time</th><th>Burst time</th></tr><tr><td>P1</td><td>0</td><td>24</td></tr><tr><td>P2</td><td>0</td><td>3</td></tr><tr><td>P3</td><td>0</td><td>3</td></tr></table><p><b>નિયમ:</b> દરેક process વધુમાં વધુ એક <b>time quantum</b> ચાલે, પછી ready queue ના છેડે જાય. અહીં વપરાયેલી પ્રથા: quantum પૂરો થાય તે જ ક્ષણે આવતી process, pre-empt થયેલી process <b>પહેલાં</b> queue માં જાય.</p><p><b>Ready-queue trace (q = 4):</b></p><table><tr><th>સમય</th><th>ચાલે</th><th>બાકી</th><th>પછી ready queue</th></tr><tr><td>0–4</td><td>P1</td><td>20</td><td>P2, P3, P1</td></tr><tr><td>4–7</td><td>P2</td><td>0</td><td>P3, P1</td></tr><tr><td>7–10</td><td>P3</td><td>0</td><td>P1</td></tr><tr><td>10–14</td><td>P1</td><td>16</td><td>P1</td></tr><tr><td>14–18</td><td>P1</td><td>12</td><td>P1</td></tr><tr><td>18–22</td><td>P1</td><td>8</td><td>P1</td></tr><tr><td>22–26</td><td>P1</td><td>4</td><td>P1</td></tr><tr><td>26–30</td><td>P1</td><td>0</td><td>—</td></tr></table><p><b>Gantt chart:</b></p><table><tr><td><b>P1</b></td><td><b>P2</b></td><td><b>P3</b></td><td><b>P1</b></td></tr><tr><td>0–4</td><td>4–7</td><td>7–10</td><td>10–30</td></tr></table><p>P2 અને P3 પહેલા quantum માં જ પૂરી થાય; પછી P1 એકલી 4 ના quanta માં 30 સુધી ચાલે.</p><table><tr><th>Process</th><th>AT</th><th>BT</th><th>CT</th><th>TAT = CT − AT</th><th>WT = TAT − BT</th></tr><tr><td>P1</td><td>0</td><td>24</td><td>30</td><td>30 − 0 = 30</td><td>30 − 24 = 6</td></tr><tr><td>P2</td><td>0</td><td>3</td><td>7</td><td>7 − 0 = 7</td><td>7 − 3 = 4</td></tr><tr><td>P3</td><td>0</td><td>3</td><td>10</td><td>10 − 0 = 10</td><td>10 − 3 = 7</td></tr></table><p><b>સરેરાશ TAT</b> = (30 + 7 + 10) / 3 = 47/3 = <b>15.67</b> units</p><p><b>સરેરાશ WT</b> = (6 + 4 + 7) / 3 = 17/3 = <b>5.67</b> units</p><p>FCFS (ક્રમ P1, P2, P3) માં સરેરાશ WT = 17 ms હતો; RR માં 5.67 ms, કારણ કે નાના jobs ને P1 પાછળ રાહ જોવી પડતી નથી.</p>"}}, {"id": "os2n12", "q": {"en": "Banker's algorithm: 5 processes P0–P4 and 3 resource types A (10 instances), B (5), C (7). Allocation: P0 (0 1 0), P1 (2 0 0), P2 (3 0 2), P3 (2 1 1), P4 (0 0 2). Max: P0 (7 5 3), P1 (3 2 2), P2 (9 0 2), P3 (2 2 2), P4 (4 3 3). Available = (3 3 2). Find the Need matrix and check whether the system is in a safe state.", "gu": "Banker's algorithm: 5 processes P0–P4 અને 3 resource types A (10 instances), B (5), C (7). Allocation: P0 (0 1 0), P1 (2 0 0), P2 (3 0 2), P3 (2 1 1), P4 (0 0 2). Max: P0 (7 5 3), P1 (3 2 2), P2 (9 0 2), P3 (2 2 2), P4 (4 3 3). Available = (3 3 2). Need matrix શોધો અને system safe state માં છે કે નહીં તે તપાસો."}, "a": {"en": "<p><b>Step 1: Need = Max − Allocation</b></p><table><tr><th>Process</th><th>Allocation<br>A B C</th><th>Max<br>A B C</th><th>Need = Max − Alloc<br>A B C</th></tr><tr><td>P0</td><td>0 1 0</td><td>7 5 3</td><td>7 4 3</td></tr><tr><td>P1</td><td>2 0 0</td><td>3 2 2</td><td>1 2 2</td></tr><tr><td>P2</td><td>3 0 2</td><td>9 0 2</td><td>6 0 0</td></tr><tr><td>P3</td><td>2 1 1</td><td>2 2 2</td><td>0 1 1</td></tr><tr><td>P4</td><td>0 0 2</td><td>4 3 3</td><td>4 3 1</td></tr></table><p><b>Step 2: Safety algorithm.</b> Work = Available = (3, 3, 2). Repeatedly find a process with Need ≤ Work; let it finish and release its allocation.</p><table><tr><th>Step</th><th>Process</th><th>Need ≤ Work?</th><th>Work = Work + Alloc</th></tr><tr><td>1</td><td>P1</td><td>(1, 2, 2) ≤ (3, 3, 2) ✓</td><td>(5, 3, 2)</td></tr><tr><td>2</td><td>P3</td><td>(0, 1, 1) ≤ (5, 3, 2) ✓</td><td>(7, 4, 3)</td></tr><tr><td>3</td><td>P4</td><td>(4, 3, 1) ≤ (7, 4, 3) ✓</td><td>(7, 4, 5)</td></tr><tr><td>4</td><td>P0</td><td>(7, 4, 3) ≤ (7, 4, 5) ✓</td><td>(7, 5, 5)</td></tr><tr><td>5</td><td>P2</td><td>(6, 0, 0) ≤ (7, 5, 5) ✓</td><td>(10, 5, 7)</td></tr></table><p>(P0 was checked first but Need (7, 4, 3) &gt; Work (3, 3, 2), so it had to wait.)</p><p>All processes can finish → the system is in a <b>SAFE state</b>.<br><b>Safe sequence: &lt;P1, P3, P4, P0, P2&gt;</b></p><p>Check: final Work = (10, 5, 7) = total instances ✓</p>", "gu": "<p><b>પગલું 1: Need = Max − Allocation</b></p><table><tr><th>Process</th><th>Allocation<br>A B C</th><th>Max<br>A B C</th><th>Need = Max − Alloc<br>A B C</th></tr><tr><td>P0</td><td>0 1 0</td><td>7 5 3</td><td>7 4 3</td></tr><tr><td>P1</td><td>2 0 0</td><td>3 2 2</td><td>1 2 2</td></tr><tr><td>P2</td><td>3 0 2</td><td>9 0 2</td><td>6 0 0</td></tr><tr><td>P3</td><td>2 1 1</td><td>2 2 2</td><td>0 1 1</td></tr><tr><td>P4</td><td>0 0 2</td><td>4 3 3</td><td>4 3 1</td></tr></table><p><b>પગલું 2: Safety algorithm.</b> Work = Available = (3, 3, 2). વારંવાર Need ≤ Work હોય તેવી process શોધો; તેને પૂરી થવા દો અને તેનું allocation મુક્ત કરો.</p><table><tr><th>પગલું</th><th>Process</th><th>Need ≤ Work?</th><th>Work = Work + Alloc</th></tr><tr><td>1</td><td>P1</td><td>(1, 2, 2) ≤ (3, 3, 2) ✓</td><td>(5, 3, 2)</td></tr><tr><td>2</td><td>P3</td><td>(0, 1, 1) ≤ (5, 3, 2) ✓</td><td>(7, 4, 3)</td></tr><tr><td>3</td><td>P4</td><td>(4, 3, 1) ≤ (7, 4, 3) ✓</td><td>(7, 4, 5)</td></tr><tr><td>4</td><td>P0</td><td>(7, 4, 3) ≤ (7, 4, 5) ✓</td><td>(7, 5, 5)</td></tr><tr><td>5</td><td>P2</td><td>(6, 0, 0) ≤ (7, 5, 5) ✓</td><td>(10, 5, 7)</td></tr></table><p>(P0 પહેલાં તપાસી પણ Need (7, 4, 3) &gt; Work (3, 3, 2), તેથી તેણે રાહ જોવી પડી.)</p><p>બધી processes પૂરી થઈ શકે → system <b>SAFE state</b> માં છે.<br><b>Safe sequence: &lt;P1, P3, P4, P0, P2&gt;</b></p><p>ચકાસણી: અંતિમ Work = (10, 5, 7) = કુલ instances ✓</p>"}}, {"id": "os2n13", "q": {"en": "In the system of the previous question, P1 requests (1, 0, 2). Can the request be granted immediately? Use the resource-request algorithm.", "gu": "આગળના પ્રશ્નની system માં P1 (1, 0, 2) માંગે છે. શું request તરત મંજૂર થઈ શકે? Resource-request algorithm વાપરો."}, "a": {"en": "<p><b>Step 1:</b> Request (1, 0, 2) ≤ Need<sub>P1</sub> (1, 2, 2) ✓ (P1 does not exceed its maximum claim).</p><p><b>Step 2:</b> Request (1, 0, 2) ≤ Available (3, 3, 2) ✓ (resources are free).</p><p><b>Step 3: Pretend to allocate:</b> Available = (3, 3, 2) − (1, 0, 2) = <b>(2, 3, 0)</b>; Allocation<sub>P1</sub> = (3, 0, 2); Need<sub>P1</sub> = (0, 2, 0).</p><p><b>Step 4: Safety check</b> with Work = (2, 3, 0):</p><table><tr><th>Step</th><th>Process</th><th>Need ≤ Work?</th><th>Work = Work + Alloc</th></tr><tr><td>1</td><td>P1</td><td>(0, 2, 0) ≤ (2, 3, 0) ✓</td><td>(5, 3, 2)</td></tr><tr><td>2</td><td>P3</td><td>(0, 1, 1) ≤ (5, 3, 2) ✓</td><td>(7, 4, 3)</td></tr><tr><td>3</td><td>P4</td><td>(4, 3, 1) ≤ (7, 4, 3) ✓</td><td>(7, 4, 5)</td></tr><tr><td>4</td><td>P0</td><td>(7, 4, 3) ≤ (7, 4, 5) ✓</td><td>(7, 5, 5)</td></tr><tr><td>5</td><td>P2</td><td>(6, 0, 0) ≤ (7, 5, 5) ✓</td><td>(10, 5, 7)</td></tr></table><p>A safe sequence &lt;P1, P3, P4, P0, P2&gt; exists, so the new state is safe → <b>the request is granted immediately</b>.</p>", "gu": "<p><b>પગલું 1:</b> Request (1, 0, 2) ≤ Need<sub>P1</sub> (1, 2, 2) ✓ (P1 તેના maximum claim થી વધુ માંગતી નથી).</p><p><b>પગલું 2:</b> Request (1, 0, 2) ≤ Available (3, 3, 2) ✓ (resources મુક્ત છે).</p><p><b>પગલું 3: Allocate કર્યું હોય તેમ માનો:</b> Available = (3, 3, 2) − (1, 0, 2) = <b>(2, 3, 0)</b>; Allocation<sub>P1</sub> = (3, 0, 2); Need<sub>P1</sub> = (0, 2, 0).</p><p><b>પગલું 4: Safety check</b>, Work = (2, 3, 0):</p><table><tr><th>પગલું</th><th>Process</th><th>Need ≤ Work?</th><th>Work = Work + Alloc</th></tr><tr><td>1</td><td>P1</td><td>(0, 2, 0) ≤ (2, 3, 0) ✓</td><td>(5, 3, 2)</td></tr><tr><td>2</td><td>P3</td><td>(0, 1, 1) ≤ (5, 3, 2) ✓</td><td>(7, 4, 3)</td></tr><tr><td>3</td><td>P4</td><td>(4, 3, 1) ≤ (7, 4, 3) ✓</td><td>(7, 4, 5)</td></tr><tr><td>4</td><td>P0</td><td>(7, 4, 3) ≤ (7, 4, 5) ✓</td><td>(7, 5, 5)</td></tr><tr><td>5</td><td>P2</td><td>(6, 0, 0) ≤ (7, 5, 5) ✓</td><td>(10, 5, 7)</td></tr></table><p>Safe sequence &lt;P1, P3, P4, P0, P2&gt; મળે છે, તેથી નવી state safe છે → <b>request તરત મંજૂર થાય છે</b>.</p>"}}, {"id": "os2n14", "q": {"en": "Deadlock detection: 5 processes, resources A (7), B (2), C (6). Available = (0, 0, 0). Allocation and current Request are given in the table. (i) Is the system deadlocked? (ii) What happens if P2 makes one more request for C?", "gu": "Deadlock detection: 5 processes, resources A (7), B (2), C (6). Available = (0, 0, 0). Allocation અને હાલની Request table માં આપેલી છે. (i) System deadlock માં છે? (ii) P2 C નું એક વધુ instance માંગે તો શું થાય?"}, "a": {"en": "<table><tr><th>Process</th><th>Allocation<br>A B C</th><th>Request<br>A B C</th></tr><tr><td>P0</td><td>0 1 0</td><td>0 0 0</td></tr><tr><td>P1</td><td>2 0 0</td><td>2 0 2</td></tr><tr><td>P2</td><td>3 0 3</td><td>0 0 0</td></tr><tr><td>P3</td><td>2 1 1</td><td>1 0 0</td></tr><tr><td>P4</td><td>0 0 2</td><td>0 0 2</td></tr></table><p><b>(i)</b> Work = (0, 0, 0). Find a process whose Request ≤ Work, let it finish and add its allocation to Work:</p><table><tr><th>Step</th><th>Process</th><th>Request ≤ Work?</th><th>Work = Work + Alloc</th></tr><tr><td>1</td><td>P0</td><td>(0, 0, 0) ≤ (0, 0, 0) ✓</td><td>(0, 1, 0)</td></tr><tr><td>2</td><td>P2</td><td>(0, 0, 0) ≤ (0, 1, 0) ✓</td><td>(3, 1, 3)</td></tr><tr><td>3</td><td>P3</td><td>(1, 0, 0) ≤ (3, 1, 3) ✓</td><td>(5, 2, 4)</td></tr><tr><td>4</td><td>P4</td><td>(0, 0, 2) ≤ (5, 2, 4) ✓</td><td>(5, 2, 6)</td></tr><tr><td>5</td><td>P1</td><td>(2, 0, 2) ≤ (5, 2, 6) ✓</td><td>(7, 2, 6)</td></tr></table><p>All processes finish (sequence &lt;P0, P2, P3, P4, P1&gt;) → <b>no deadlock</b>.</p><p><b>(ii)</b> Request<sub>P2</sub> becomes (0, 0, 1). Only P0 can finish (Work becomes (0, 1, 0)). Now no other request ≤ (0, 1, 0).</p><p>→ <b>Deadlock</b> exists; deadlocked processes: <b>P1, P2, P3, P4</b>.</p>", "gu": "<table><tr><th>Process</th><th>Allocation<br>A B C</th><th>Request<br>A B C</th></tr><tr><td>P0</td><td>0 1 0</td><td>0 0 0</td></tr><tr><td>P1</td><td>2 0 0</td><td>2 0 2</td></tr><tr><td>P2</td><td>3 0 3</td><td>0 0 0</td></tr><tr><td>P3</td><td>2 1 1</td><td>1 0 0</td></tr><tr><td>P4</td><td>0 0 2</td><td>0 0 2</td></tr></table><p><b>(i)</b> Work = (0, 0, 0). Request ≤ Work હોય તેવી process શોધો, તેને પૂરી થવા દો અને તેનું allocation Work માં ઉમેરો:</p><table><tr><th>પગલું</th><th>Process</th><th>Request ≤ Work?</th><th>Work = Work + Alloc</th></tr><tr><td>1</td><td>P0</td><td>(0, 0, 0) ≤ (0, 0, 0) ✓</td><td>(0, 1, 0)</td></tr><tr><td>2</td><td>P2</td><td>(0, 0, 0) ≤ (0, 1, 0) ✓</td><td>(3, 1, 3)</td></tr><tr><td>3</td><td>P3</td><td>(1, 0, 0) ≤ (3, 1, 3) ✓</td><td>(5, 2, 4)</td></tr><tr><td>4</td><td>P4</td><td>(0, 0, 2) ≤ (5, 2, 4) ✓</td><td>(5, 2, 6)</td></tr><tr><td>5</td><td>P1</td><td>(2, 0, 2) ≤ (5, 2, 6) ✓</td><td>(7, 2, 6)</td></tr></table><p>બધી processes પૂરી થાય છે (ક્રમ &lt;P0, P2, P3, P4, P1&gt;) → <b>deadlock નથી</b>.</p><p><b>(ii)</b> Request<sub>P2</sub> = (0, 0, 1) બને. માત્ર P0 પૂરી થઈ શકે (Work = (0, 1, 0)). હવે બીજી કોઈ request ≤ (0, 1, 0) નથી.</p><p>→ <b>Deadlock</b> છે; deadlocked processes: <b>P1, P2, P3, P4</b>.</p>"}}], "equations": [{"title": {"en": "CPU Scheduling Formulas", "gu": "CPU Scheduling સૂત્રો"}, "items": [{"name": {"en": "Turnaround time", "gu": "Turnaround time"}, "f": "TAT = CT − AT", "terms": {"en": "CT = completion time, AT = arrival time", "gu": "CT = completion time, AT = arrival time"}}, {"name": {"en": "Waiting time", "gu": "Waiting time"}, "f": "WT = TAT − BT", "terms": {"en": "BT = burst (execution) time", "gu": "BT = burst (execution) time"}}, {"name": {"en": "Response time", "gu": "Response time"}, "f": "RT = (time of first CPU allocation) − AT", "terms": {"en": "Equal to WT for non-preemptive algorithms", "gu": "Non-preemptive algorithms માં WT જેટલો"}}, {"name": {"en": "Average TAT / WT", "gu": "સરેરાશ TAT / WT"}, "f": "Avg = (sum of values of all processes) / n", "terms": {"en": "n = number of processes", "gu": "n = processes ની સંખ્યા"}}, {"name": {"en": "Throughput", "gu": "Throughput"}, "f": "Throughput = n / total time", "terms": {"en": "Processes completed per unit time", "gu": "એકમ સમયમાં પૂરી થતી processes"}}, {"name": {"en": "CPU utilisation", "gu": "CPU utilisation"}, "f": "CPU utilisation = (CPU busy time / total time) × 100%", "terms": {"en": "Idle time lowers utilisation", "gu": "Idle time utilisation ઘટાડે"}}]}, {"title": {"en": "Banker's Algorithm", "gu": "Banker's Algorithm"}, "items": [{"name": {"en": "Need matrix", "gu": "Need matrix"}, "f": "Need[i][j] = Max[i][j] − Allocation[i][j]", "terms": {"en": "Remaining resources process i may still request", "gu": "Process i હજી માંગી શકે તેટલા બાકી resources"}}, {"name": {"en": "Total instances", "gu": "કુલ instances"}, "f": "Total = Available + Σ Allocation", "terms": {"en": "Used to find Available if total is given", "gu": "Total આપ્યું હોય તો Available શોધવા"}}, {"name": {"en": "Safety step", "gu": "Safety step"}, "f": "If Need<sub>i</sub> ≤ Work: Work = Work + Allocation<sub>i</sub>", "terms": {"en": "Start with Work = Available", "gu": "Work = Available થી શરૂ કરો"}}, {"name": {"en": "Request check", "gu": "Request check"}, "f": "Request<sub>i</sub> ≤ Need<sub>i</sub> and Request<sub>i</sub> ≤ Available", "terms": {"en": "Then pretend to allocate and run the safety check", "gu": "પછી allocate કર્યું માની safety check ચલાવો"}}]}], "viva": [{"title": {"en": "Process and Threads", "gu": "Process અને Threads"}, "items": [{"q": {"en": "What is a process?", "gu": "Process શું છે?"}, "a": {"en": "A program in execution; an active entity with a PC, registers, stack, data and heap.", "gu": "Execution માં રહેલો program; PC, registers, stack, data અને heap વાળી active entity."}}, {"q": {"en": "Difference between program and process?", "gu": "Program અને process વચ્ચે તફાવત?"}, "a": {"en": "A program is passive (file on disk); a process is active (program loaded and running).", "gu": "Program passive છે (disk પરની file); process active છે (load થઈને ચાલતો program)."}}, {"q": {"en": "Name the five process states.", "gu": "Process ની પાંચ states જણાવો."}, "a": {"en": "New, Ready, Running, Waiting (blocked) and Terminated.", "gu": "New, Ready, Running, Waiting (blocked) અને Terminated."}}, {"q": {"en": "What is a PCB?", "gu": "PCB શું છે?"}, "a": {"en": "Process Control Block: a data structure that stores all information about a process (PID, state, PC, registers, etc.).", "gu": "Process Control Block: process ની બધી માહિતી (PID, state, PC, registers વગેરે) સંગ્રહતું data structure."}}, {"q": {"en": "Why is a thread called a light-weight process?", "gu": "Thread ને light-weight process કેમ કહે છે?"}, "a": {"en": "It shares code, data and files with other threads, so creating and switching it is cheap.", "gu": "તે code, data અને files બીજા threads સાથે વહેંચે છે, તેથી તેને બનાવવું અને switch કરવું સસ્તું છે."}}]}, {"title": {"en": "CPU Scheduling", "gu": "CPU Scheduling"}, "items": [{"q": {"en": "List the CPU scheduling criteria.", "gu": "CPU scheduling criteria જણાવો."}, "a": {"en": "CPU utilisation, throughput, turnaround time, waiting time and response time.", "gu": "CPU utilisation, throughput, turnaround time, waiting time અને response time."}}, {"q": {"en": "Preemptive vs non-preemptive scheduling?", "gu": "Preemptive vs non-preemptive scheduling?"}, "a": {"en": "Preemptive: the CPU can be taken away from a running process; non-preemptive: the process keeps the CPU until it finishes or blocks.", "gu": "Preemptive: ચાલતી process પાસેથી CPU લઈ શકાય; non-preemptive: process પૂરી થાય કે block થાય ત્યાં સુધી CPU રાખે."}}, {"q": {"en": "What is the convoy effect?", "gu": "Convoy effect શું છે?"}, "a": {"en": "In FCFS, short processes wait behind one long process, increasing average waiting time.", "gu": "FCFS માં નાની processes એક લાંબી process પાછળ રાહ જુએ, જેથી સરેરાશ waiting time વધે."}}, {"q": {"en": "Which algorithm gives the minimum average waiting time?", "gu": "કયો algorithm ઓછામાં ઓછો સરેરાશ waiting time આપે?"}, "a": {"en": "SJF (it is optimal), but the burst time must be known in advance.", "gu": "SJF (તે optimal છે), પણ burst time અગાઉથી જાણવો પડે."}}, {"q": {"en": "What happens if the RR time quantum is very large or very small?", "gu": "RR નો time quantum ખૂબ મોટો કે ખૂબ નાનો હોય તો શું થાય?"}, "a": {"en": "Very large → RR becomes FCFS; very small → too many context switches (overhead).", "gu": "ખૂબ મોટો → RR એ FCFS બને; ખૂબ નાનો → ઘણા context switches (overhead)."}}, {"q": {"en": "What is starvation and how is it solved?", "gu": "Starvation શું છે અને તે કેવી રીતે ઉકેલાય?"}, "a": {"en": "A low-priority process waits indefinitely; solved by aging (gradually raising its priority).", "gu": "Low-priority process અનિશ્ચિત સમય રાહ જુએ; aging (ધીમે ધીમે priority વધારવી) થી ઉકેલાય."}}]}, {"title": {"en": "Schedulers and Context Switch", "gu": "Schedulers અને Context Switch"}, "items": [{"q": {"en": "Which scheduler controls the degree of multiprogramming?", "gu": "Degree of multiprogramming ને કયો scheduler control કરે છે?"}, "a": {"en": "The long-term (job) scheduler.", "gu": "Long-term (job) scheduler."}}, {"q": {"en": "Which scheduler runs most frequently?", "gu": "કયો scheduler સૌથી વધુ વાર ચાલે છે?"}, "a": {"en": "The short-term (CPU) scheduler, every few milliseconds.", "gu": "Short-term (CPU) scheduler, દર થોડી milliseconds એ."}}, {"q": {"en": "What does the medium-term scheduler do?", "gu": "Medium-term scheduler શું કરે છે?"}, "a": {"en": "It swaps processes out of memory to disk and later swaps them back in.", "gu": "તે processes ને memory માંથી disk પર swap out કરે અને પછી પાછી swap in કરે."}}, {"q": {"en": "What is a context switch?", "gu": "Context switch શું છે?"}, "a": {"en": "Saving the state of the current process in its PCB and loading the saved state of the next process.", "gu": "હાલની process ની state તેના PCB માં save કરી બીજી process ની saved state load કરવી."}}, {"q": {"en": "What is a dispatcher?", "gu": "Dispatcher શું છે?"}, "a": {"en": "The module that gives control of the CPU to the process chosen by the short-term scheduler.", "gu": "Short-term scheduler એ પસંદ કરેલી process ને CPU નું control આપતું module."}}]}, {"title": {"en": "Process Synchronization", "gu": "Process Synchronization"}, "items": [{"q": {"en": "What is a race condition?", "gu": "Race condition શું છે?"}, "a": {"en": "When the result of shared-data access depends on the order of execution of processes.", "gu": "જ્યારે shared data ના access નું પરિણામ processes ના execution ક્રમ પર આધાર રાખે."}}, {"q": {"en": "What is a critical section?", "gu": "Critical section શું છે?"}, "a": {"en": "The part of code in which a process accesses shared data.", "gu": "Code નો તે ભાગ જેમાં process shared data access કરે છે."}}, {"q": {"en": "State the three requirements of a critical-section solution.", "gu": "Critical-section solution ની ત્રણ જરૂરિયાતો જણાવો."}, "a": {"en": "Mutual exclusion, progress and bounded waiting.", "gu": "Mutual exclusion, progress અને bounded waiting."}}, {"q": {"en": "What is a semaphore?", "gu": "Semaphore શું છે?"}, "a": {"en": "An integer variable accessed only by the atomic operations wait() (P) and signal() (V).", "gu": "માત્ર atomic operations wait() (P) અને signal() (V) વડે access થતો integer variable."}}]}, {"title": {"en": "Deadlock", "gu": "Deadlock"}, "items": [{"q": {"en": "Define deadlock.", "gu": "Deadlock ની વ્યાખ્યા આપો."}, "a": {"en": "A set of processes each waiting for a resource held by another process of the set, so none can proceed.", "gu": "Processes નો સમૂહ જેમાં દરેક સમૂહની બીજી process પાસેના resource ની રાહ જુએ, તેથી કોઈ આગળ વધી શકે નહીં."}}, {"q": {"en": "State the four necessary conditions for deadlock.", "gu": "Deadlock માટેની ચાર જરૂરી શરતો જણાવો."}, "a": {"en": "Mutual exclusion, hold and wait, no preemption and circular wait.", "gu": "Mutual exclusion, hold and wait, no preemption અને circular wait."}}, {"q": {"en": "What is the ostrich algorithm?", "gu": "Ostrich algorithm શું છે?"}, "a": {"en": "Ignoring the deadlock problem, assuming it is rare (used by Windows and Linux).", "gu": "Deadlock ને દુર્લભ માની તેની અવગણના કરવી (Windows અને Linux વાપરે છે)."}}, {"q": {"en": "Does a cycle in a RAG always mean deadlock?", "gu": "RAG માં cycle હંમેશા deadlock દર્શાવે?"}, "a": {"en": "Only if each resource has a single instance; with multiple instances, deadlock is possible but not certain.", "gu": "માત્ર દરેક resource નું એક instance હોય તો; ઘણા instances હોય તો deadlock શક્ય છે પણ નિશ્ચિત નહીં."}}, {"q": {"en": "Which algorithm is used for deadlock avoidance?", "gu": "Deadlock avoidance માટે કયો algorithm વપરાય?"}, "a": {"en": "Banker's algorithm (Dijkstra), which keeps the system in a safe state.", "gu": "Banker's algorithm (Dijkstra), જે system ને safe state માં રાખે."}}, {"q": {"en": "What is a safe state?", "gu": "Safe state શું છે?"}, "a": {"en": "A state in which there is at least one sequence in which all processes can finish.", "gu": "એવી state જેમાં ઓછામાં ઓછો એક ક્રમ હોય જેમાં બધી processes પૂરી થઈ શકે."}}]}], "exam_questions": [{"q": {"en": "Define process. Differentiate between process and program.", "gu": "Process ની વ્યાખ્યા આપો. Process અને program વચ્ચે તફાવત આપો."}, "marks": 3}, {"q": {"en": "Differentiate between process and thread.", "gu": "Process અને thread વચ્ચે તફાવત આપો."}, "marks": 3}, {"q": {"en": "Draw and explain the process state diagram.", "gu": "Process state diagram દોરો અને સમજાવો."}, "marks": 4}, {"q": {"en": "What is a PCB? Explain its fields with a diagram.", "gu": "PCB શું છે? તેના fields આકૃતિ સાથે સમજાવો."}, "marks": 4}, {"q": {"en": "Explain CPU scheduling criteria.", "gu": "CPU scheduling criteria સમજાવો."}, "marks": 3}, {"q": {"en": "Differentiate between preemptive and non-preemptive scheduling.", "gu": "Preemptive અને non-preemptive scheduling વચ્ચે તફાવત આપો."}, "marks": 3}, {"q": {"en": "Explain FCFS and SJF scheduling with an example. Give their advantages and disadvantages.", "gu": "FCFS અને SJF scheduling ઉદાહરણ સાથે સમજાવો. તેમના ફાયદા અને ગેરફાયદા આપો."}, "marks": 7}, {"q": {"en": "Explain Round Robin scheduling with an example.", "gu": "Round Robin scheduling ઉદાહરણ સાથે સમજાવો."}, "marks": 4}, {"q": {"en": "Solve FCFS, SJF and Round Robin (quantum 2) for P0–P3 with arrival times 0, 1, 2, 3 and burst times 5, 3, 8, 6. Find average TAT and WT.", "gu": "Arrival time 0, 1, 2, 3 અને burst time 5, 3, 8, 6 વાળી P0–P3 માટે FCFS, SJF અને Round Robin (quantum 2) ઉકેલો. સરેરાશ TAT અને WT શોધો."}, "marks": 7}, {"q": {"en": "Explain non-preemptive priority scheduling. What is starvation?", "gu": "Non-preemptive priority scheduling સમજાવો. Starvation શું છે?"}, "marks": 4}, {"q": {"en": "Explain long-term, short-term and medium-term schedulers with a diagram.", "gu": "Long-term, short-term અને medium-term schedulers આકૃતિ સાથે સમજાવો."}, "marks": 7}, {"q": {"en": "What is a context switch? Explain with a diagram.", "gu": "Context switch શું છે? આકૃતિ સાથે સમજાવો."}, "marks": 3}, {"q": {"en": "Explain scheduling queues with a queueing diagram.", "gu": "Queueing diagram સાથે scheduling queues સમજાવો."}, "marks": 4}, {"q": {"en": "Define race condition, critical section and mutual exclusion.", "gu": "Race condition, critical section અને mutual exclusion ની વ્યાખ્યા આપો."}, "marks": 3}, {"q":  fill=\"#1565C0\" font-weight=\"bold\">P2</text><rect x=\"84\" y=\"184\" width=\"150\" height=\"22\" rx=\"0\" fill=\"#E3F0FC\" stroke=\"#D9C8F0\" stroke-width=\"1\"/><text font-family=\"DejaVu Sans Mono, Consolas, monospace\" x=\"159.0\" y=\"198.2\" font-size=\"9.2\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"normal\">counter = reg2</text><rect x=\"234\" y=\"184\" width=\"114\" height=\"22\" rx=\"0\" fill=\"#E3F0FC\" stroke=\"#D9C8F0\" stroke-width=\"1\"/><text font-family=\"DejaVu Sans Mono, Consolas, monospace\" x=\"291.0\" y=\"198.2\" font-size=\"9.2\" text-anchor=\"middle\" fill=\"#222\" font-weight=\"bold\">counter = 4</text><text x=\"180\" y=\"227.7\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#C62828\" font-weight=\"bold\">Final counter = 4, but the correct value is 5!</text><rect x=\"12\" y=\"240\" width=\"336\" height=\"70\" rx=\"7\" fill=\"#E3F0FC\" stroke=\"#1565C0\" stroke-width=\"1.1\"/><text x=\"20\" y=\"258.4\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">Race condition: the result depends on the order in</text><text x=\"20\" y=\"273.4\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">which processes access shared data.</text><text x=\"20\" y=\"288.4\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">Solution: allow only one process at a time in the</text><text x=\"20\" y=\"303.4\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">critical section (mutual exclusion).</text></svg>", "os2_cs": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 340\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"340\" fill=\"#ffffff\"/><text x=\"180\" y=\"23.1\" font-size=\"14.5\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">General Structure of a Process (CS)</text><text font-family=\"DejaVu Sans Mono, Consolas, monospace\" x=\"52\" y=\"53.7\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#222\" font-weight=\"bold\">do {</text><rect x=\"40\" y=\"68\" width=\"280\" height=\"28\" rx=\"4\" fill=\"#FFF1DE\" stroke=\"#E07B00\" stroke-width=\"1.3\"/><text font-family=\"DejaVu Sans Mono, Consolas, monospace\" x=\"52\" y=\"85.7\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#E07B00\" font-weight=\"bold\">    entry section</text><rect x=\"40\" y=\"100\" width=\"280\" height=\"28\" rx=\"4\" fill=\"#FDECEC\" stroke=\"#C62828\" stroke-width=\"1.3\"/><text font-family=\"DejaVu Sans Mono, Consolas, monospace\" x=\"52\" y=\"117.7\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#C62828\" font-weight=\"bold\">        critical section</text><rect x=\"40\" y=\"132\" width=\"280\" height=\"28\" rx=\"4\" fill=\"#E3F5E6\" stroke=\"#2E7D32\" stroke-width=\"1.3\"/><text font-family=\"DejaVu Sans Mono, Consolas, monospace\" x=\"52\" y=\"149.7\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#2E7D32\" font-weight=\"bold\">    exit section</text><rect x=\"40\" y=\"164\" width=\"280\" height=\"28\" rx=\"4\" fill=\"#E3F0FC\" stroke=\"#1565C0\" stroke-width=\"1.3\"/><text font-family=\"DejaVu Sans Mono, Consolas, monospace\" x=\"52\" y=\"181.7\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#1565C0\" font-weight=\"bold\">        remainder section</text><text font-family=\"DejaVu Sans Mono, Consolas, monospace\" x=\"52\" y=\"213.7\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#222\" font-weight=\"bold\">} while (true);</text><rect x=\"12\" y=\"234\" width=\"336\" height=\"96\" rx=\"8\" fill=\"#FBF8FF\" stroke=\"#7B2CD9\" stroke-width=\"1.3\"/><text x=\"180\" y=\"251.7\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">Requirements of a solution</text><text x=\"20\" y=\"269.3\" font-size=\"9.4\" text-anchor=\"start\" fill=\"#222\" font-weight=\"bold\">1. Mutual exclusion</text><text x=\"130\" y=\"269.1\" font-size=\"9\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">only one process in its CS at a time.</text><text x=\"20\" y=\"283.3\" font-size=\"9.4\" text-anchor=\"start\" fill=\"#222\" font-weight=\"bold\">2. Progress</text><text x=\"130\" y=\"283.1\" font-size=\"9\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">if no one is in the CS, a waiting process</text><text x=\"20\" y=\"297.3\" font-size=\"9.4\" text-anchor=\"start\" fill=\"#222\" font-weight=\"bold\"></text><text x=\"130\" y=\"297.1\" font-size=\"9\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">must be allowed to enter without delay.</text><text x=\"20\" y=\"311.3\" font-size=\"9.4\" text-anchor=\"start\" fill=\"#222\" font-weight=\"bold\">3. Bounded waiting</text><text x=\"130\" y=\"311.1\" font-size=\"9\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">a limit on how many times others enter</text><text x=\"20\" y=\"325.3\" font-size=\"9.4\" text-anchor=\"start\" fill=\"#222\" font-weight=\"bold\"></text><text x=\"130\" y=\"325.1\" font-size=\"9\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">before a waiting process gets its turn.</text></svg>", "os2_mutex": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 296\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"296\" fill=\"#ffffff\"/><text x=\"180\" y=\"23.1\" font-size=\"14.5\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">Mutual Exclusion using Critical Regions</text><text x=\"62\" y=\"79.4\" font-size=\"9.6\" text-anchor=\"end\" fill=\"#2E7D32\" font-weight=\"bold\">Process A</text><text x=\"62\" y=\"139.4\" font-size=\"9.6\" text-anchor=\"end\" fill=\"#1565C0\" font-weight=\"bold\">Process B</text><path d=\"M70 76 L330.0 76\" fill=\"none\" stroke=\"#CCC\" stroke-width=\"1.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M70 136 L330.0 136\" fill=\"none\" stroke=\"#CCC\" stroke-width=\"1.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><rect x=\"109.0\" y=\"64\" width=\"104.0\" height=\"24\" rx=\"3\" fill=\"#2E7D32\" stroke=\"#2E7D32\" stroke-wi "1.1\"/><text x=\"20\" y=\"226.4\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">Mutual exclusion: if one process is using a shared</text><text x=\"20\" y=\"241.4\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">variable or file, other processes are kept out.</text><text x=\"20\" y=\"256.4\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">Methods: disabling interrupts, lock variable, strict</text><text x=\"20\" y=\"271.4\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">alternation, Peterson's solution, TSL instruction,</text><text x=\"20\" y=\"286.4\" font-size=\"9.6\" text-anchor=\"start\" fill=\"#222\" font-weight=\"normal\">semaphores and mutex locks.</text></svg>", "os2_deadlock": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 296\" font-family=\"Arial, Helvetica, sans-serif\"><rect width=\"360\" height=\"296\" fill=\"#ffffff\"/><text x=\"180\" y=\"23.1\" font-size=\"14.5\" text-anchor=\"middle\" fill=\"#7B2CD9\" font-weight=\"bold\">Deadlock: Circular Wait</text><circle cx=\"90\" cy=\"80\" r=\"20\" fill=\"#E3F0FC\" stroke=\"#1565C0\" stroke-width=\"1.6\"/><text x=\"90\" y=\"83.4\" font-size=\"9.6\" text-anchor=\"middle\" fill=\"#1565C0\" font-weight=\"bold\">P1</text><circle cx=\"270\" cy=\"180\" r=\"20\" fill=\"#E3F0FC\" stroke=\"#1565C0\" stroke-width=\"1.6\"/><text x=\"270\" y=\"183.4\" font-size=\"9.6\" text-anchor=\"middle\" fill=\"#1565C0\" font-weight=\"bold\">P2</text><rect x=\"247.0\" y=\"65.0\" width=\"46\" height=\"30\" rx=\"3\" fill=\"#FFF1DE\" stroke=\"#E07B00\" stroke-width=\"1.6\"/><circle cx=\"270.0\" cy=\"83\" r=\"2.6\" fill=\"#E07B00\"/><text x=\"297.0\" y=\"83.3\" font-size=\"9.4\" text-anchor=\"start\" fill=\"#E07B00\" font-weight=\"bold\">R1</text><rect x=\"67.0\" y=\"165.0\" width=\"46\" height=\"30\" rx=\"3\" fill=\"#FFF1DE\" stroke=\"#E07B00\" stroke-width=\"1.6\"/><circle cx=\"90.0\" cy=\"183\" r=\"2.6\" function numericals(){
  return `<div class="sec">${head(L('numericals'))}` + (U.numericals||[]).map((n,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(n.q)}</span>${chev}</div><div class="a">${fixTables(t(n.a))}</div></div>`).join('') + `</div>`;
}
function diagrams(){
  return `<div class="sec">${head(L(U.programs&&META.code_lang!=='python'?'flowcharts':'diagrams'),false)}<div style="height:10px"></div>` + U.diagrams.map((d,i)=>
    `<div class="dcard" data-dg="${d.id}"><div class="h">${i+1}. ${t(d.title)}</div>${SVG[d.id]}</div>`).join('') + `</div>`;
}
function equations(){
  return U.equations.map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><span class="fbox">${e.f}</span></span>${chev}</div>
     <div class="a"><p>${t(e.terms)}</p></div></div>`).join('') + `</div>`).join('');
}
function viva(){
  return U.viva.map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((v,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t">${t(v.q)}</span>${chev}</div><div class="a"><p>${t(v.a)}</p></div></div>`).join('') + `</div>`).join('');
}
function exam(){
  return `<div class="sec">${head(L('examhead'),false)}` + U.exam_questions.map((x,i)=>
    `<div class="card"><div class="q" style="cursor:default"><span class="n">${i+1}.</span><span class="t">${t(x.q)}</span><span class="mk">${x.marks} ${L('marks')}</span></div></div>`).join('') + `</div>`;
}
function programs(){
  return `<div class="sec">${head(L('programs'))}` + (U.programs||[]).map((p,i)=>
    `<div class="card"><div class="q hd"><span class="n">${i+1}.</span><span class="t">${t(p.title)}</span>${chev}</div><div class="a pa">${progBody(p)}</div></div>`).join('') + `</div>`;
}
function syntax(key){
  return (U[typeof key==='string'?key:'syntax']||[]).map(g=>`<div class="sec">${head(t(g.title))}` + g.items.map((e,i)=>
    `<div class="card"><div class="q"><span class="n">${i+1}.</span><span class="t"><span class="nm">${t(e.name)}</span><pre class="code sx">${hl(e.f)}</pre></span>${chev}</div>
     <div class="a">${e.terms && t(e.terms) ? fixTables(t(e.terms)) : ''}</div></div>`).join('') + `</div>`).join('');
}
const flowcharts = diagrams;
const algorithms = () => syntax('algorithms');
const ALLV = {notes, programs, diagrams, flowcharts, algorithms, syntax, equations, numericals, viva, exam};
const VIEWS = U.tabs ? Object.fromEntries(U.tabs.map(k=>[k, ALLV[k]])) : U.programs ? (META.code_lang==='python' ? {notes, programs, diagrams, syntax, viva, exam} : {notes, programs, flowcharts, syntax, viva, exam}) : U.numericals ? {notes, diagrams, equations, numericals, viva, exam} : {notes, diagrams, equations, viva, exam};
function render(){
  document.getElementById('title').textContent = `${L('unit')} ${U.unit}: ${t(U.title)}`;
  document.getElementById('sub').textContent = `${t(META.name)} · ${META.code}`;
  document.getElementById('lang').textContent = S.lang==='en' ? 'ગુ' : 'EN';
  document.getElementById('lang').style.display = META.languages.includes('gu') ? '' : 'none';
  document.getElementById('tabs').innerHTML = Object.keys(VIEWS).map(k=>`<button class="tab${S.tab===k?' on':''}" data-tab="${k}">${L(k)}</button>`).join('');
  document.getElementById('view').innerHTML = VIEWS[S.tab]();
  document.querySelectorAll('#view pre.c').forEach(e=>{ e.innerHTML = hl(e.textContent); e.className='code'; });
}
let zoom = 1;
function setZoom(z){ zoom = Math.min(4, Math.max(1, z)); const w=document.getElementById('zw'); w.style.width=(zoom*100)+'%'; document.getElementById('zr').textContent=Math.round(zoom*100)+'%'; }
document.addEventListener('click', e=>{
  const q = e.target.closest('.q'); if (q && q.parentElement.querySelector('.a')) { q.parentElement.classList.toggle('open'); return; }
  const tb = e.target.closest('[data-tab]'); if (tb){ S.tab = tb.dataset.tab; render(); window.scrollTo(0,0); return; }
  if (e.target.closest('#lang')){ S.lang = S.lang==='en'?'gu':'en'; render(); return; }
  const m = e.target.closest('[data-more]');
  document.querySelectorAll('.menu.show').forEach(x=>{ if(!m || x!==m.nextElementSibling) x.classList.remove('show'); });
  if (m){ m.nextElementSibling.classList.toggle('show'); return; }
  const act = e.target.closest('[data-act]');
  if (act){ act.closest('.sec').querySelectorAll('.card').forEach(c=>{ if(c.querySelector('.a')) c.classList.toggle('open', act.dataset.act==='expand'); }); act.parentElement.classList.remove('show'); return; }
  const dg = e.target.closest('[data-dg]');
  if (dg){ const id=dg.dataset.dg; document.getElementById('mt').textContent=t(U.diagrams.find(d=>d.id===id).title); document.getElementById('zw').innerHTML=SVG[id]; setZoom(1); document.getElementById('modal').classList.add('show'); return; }
  if (e.target.closest('#mx')) document.getElementById('modal').classList.remove('show');
  if (e.target.closest('#zi')) setZoom(zoom+0.5);
  if (e.target.closest('#zo')) setZoom(zoom-0.5);
  if (e.target.closest('#zr')) setZoom(1);
});
render();
</script></body></html>
