<script>
const U = {"subject": "DI03000041", "unit": 2, "format": "notes", "title": {"en": "Process Management", "gu": "Process Management"}, "weightage": 31, "hours": 14, "notes": [{"title": {"en": "2.1 Concepts of Process", "gu": "2.1 Process ના Concepts"}, "items": [{"h": {"en": "2.1.1 Process: Overview", "gu": "2.1.1 Process: પરિચય"}, "body": {"en": "<p>A <b>process</b> is a <b>program in execution</b>. A program is a <b>passive</b> entity (an executable file stored on disk); it becomes a process, an <b>active</b> entity, when it is loaded into memory and starts running. One program can create several processes (e.g. opening two windows of the same browser).</p>\n<h4>A process in memory has</h4>\n<ul>\n<li><b>Text section:</b> the program code.</li>\n<li><b>Data section:</b> global and static variables.</li>\n<li><b>Heap:</b> memory allocated dynamically at run time (malloc / new).</li>\n<li><b>Stack:</b> temporary data such as function parameters, return addresses and local variables.</li>\n<li>Plus the current activity: the <b>program counter</b> (PC) and the contents of CPU <b>registers</b>.</li>\n</ul>\n<p>The stack grows downwards and the heap grows upwards into the free space between them.</p>\n<h4>Program vs process</h4>\n<ul>\n<li>Program: passive, stored on disk, exists until deleted, needs no resources.</li>\n<li>Process: active, in main memory, exists only while running, needs CPU, memory, files and I/O.</li>\n</ul>\n<p><b>Operations on processes:</b> creation (e.g. <code>fork()</code> in Unix creates a child process), scheduling, blocking, waking up and termination (<code>exit()</code>).</p>", "gu": "<p><b>Process</b> એટલે <b>execution માં રહેલો program</b>. Program <b>passive</b> entity છે (disk પર store થયેલી executable file); તે memory માં load થઈ ચાલવા લાગે ત્યારે process એટલે કે <b>active</b> entity બને છે. એક program ઘણી processes બનાવી શકે (દા.ત. એક જ browser ની બે windows ખોલવી).</p>\n<h4>Memory માં process પાસે હોય છે</h4>\n<ul>\n<li><b>Text section:</b> program code.</li>\n<li><b>Data section:</b> global અને static variables.</li>\n<li><b>Heap:</b> run time પર dynamically ફાળવાતી memory (malloc / new).</li>\n<li><b>Stack:</b> function parameters, return addresses અને local variables જેવો કામચલાઉ data.</li>\n<li>સાથે હાલની પ્રવૃત્તિ: <b>program counter</b> (PC) અને CPU <b>registers</b> ની કિંમતો.</li>\n</ul>\n<p>Stack નીચે તરફ અને heap ઉપર તરફ, તેમની વચ્ચેની free space માં વધે છે.</p>\n<h4>Program vs process</h4>\n<ul>\n<li>Program: passive, disk પર store, delete ન થાય ત્યાં સુધી રહે, resources ની જરૂર નહીં.</li>\n<li>Process: active, main memory માં, ચાલે ત્યાં સુધી જ રહે, CPU, memory, files અને I/O જોઈએ.</li>\n</ul>\n<p><b>Processes પરના operations:</b> creation (દા.ત. Unix માં <code>fork()</code> child process બનાવે), scheduling, blocking, wake up અને termination (<code>exit()</code>).</p>"}, "diagram": "os2_memory"}, {"h": {"en": "2.1.2 Threads and Process vs Thread", "gu": "2.1.2 Threads અને Process vs Thread"}, "body": {"en": "<p>A <b>thread</b> is a basic unit of CPU utilisation inside a process. It has its own <b>thread ID, program counter, register set and stack</b>, and shares the <b>code section, data section and OS resources</b> (open files, signals) with the other threads of the same process. A traditional process has a single thread; modern processes have many.</p>\n<p><b>Example:</b> in a browser, one thread shows the page, another downloads images, another plays a video.</p>\n<p><b>Benefits:</b> responsiveness, resource sharing, economy (cheaper than processes) and scalability on multi-core CPUs.</p>\n<p><b>Types:</b> user-level threads (managed by a library, fast, kernel unaware) and kernel-level threads (managed by the OS).</p>\n<h4>Process vs thread</h4>\n<table><tr><th>Point</th><th>Process</th><th>Thread</th></tr><tr><td>Meaning</td><td>Program in execution</td><td>Smallest unit of execution inside a process</td></tr><tr><td>Weight</td><td>Heavy-weight</td><td>Light-weight</td></tr><tr><td>Memory</td><td>Own separate address space</td><td>Shares code, data, files of its process</td></tr><tr><td>Creation / switching</td><td>Slow, costly</td><td>Fast, cheap</td></tr><tr><td>Communication</td><td>Needs IPC (OS help)</td><td>Directly through shared memory</td></tr><tr><td>Failure</td><td>One process crash does not affect others</td><td>One thread crash can stop the whole process</td></tr><tr><td>Example</td><td>Two different programs: Word and Chrome</td><td>Typing and spell-check threads in Word</td></tr></table>", "gu": "<p><b>Thread</b> એ process ની અંદર CPU utilisation નો મૂળભૂત એકમ છે. તેને પોતાના <b>thread ID, program counter, register set અને stack</b> હોય છે, અને તે એ જ process ના બીજા threads સાથે <b>code section, data section અને OS resources</b> (open files, signals) વહેંચે છે. પરંપરાગત process માં એક thread હોય; આધુનિક processes માં ઘણા.</p>\n<p><b>ઉદાહરણ:</b> browser માં એક thread page બતાવે, બીજો images download કરે, ત્રીજો video ચલાવે.</p>\n<p><b>ફાયદા:</b> responsiveness, resource sharing, economy (processes કરતાં સસ્તા) અને multi-core CPUs પર scalability.</p>\n<p><b>પ્રકારો:</b> user-level threads (library વડે સંચાલિત, ઝડપી, kernel અજાણ) અને kernel-level threads (OS વડે સંચાલિત).</p>\n<h4>Process vs thread</h4>\n<table><tr><th>મુદ્દો</th><th>Process</th><th>Thread</th></tr><tr><td>અર્થ</td><td>Execution માં રહેલો program</td><td>Process ની અંદર execution નો સૌથી નાનો એકમ</td></tr><tr><td>વજન</td><td>Heavy-weight</td><td>Light-weight</td></tr><tr><td>Memory</td><td>પોતાની અલગ address space</td><td>Process ના code, data, files વહેંચે</td></tr><tr><td>બનાવવું / switching</td><td>ધીમું, મોંઘું</td><td>ઝડપી, સસ્તું</td></tr><tr><td>Communication</td><td>IPC (OS ની મદદ) જોઈએ</td><td>Shared memory દ્વારા સીધું</td></tr><tr><td>Failure</td><td>એક process crash બીજાને અસર ન કરે</td><td>એક thread crash આખી process અટકાવી શકે</td></tr><tr><td>ઉદાહરણ</td><td>બે અલગ programs: Word અને Chrome</td><td>Word માં typing અને spell-check threads</td></tr></table>"}}, {"h": {"en": "2.1.3 Process Life Cycle / Process States", "gu": "2.1.3 Process Life Cycle / Process States"}, "body": {"en": "<p>As a process executes, it changes its <b>state</b>. The state is the current activity of the process. Only <b>one process can be running</b> on one CPU at a time; many may be ready or waiting.</p>\n<h4>Five states</h4>\n<ol>\n<li><b>New:</b> the process is being created (PCB is built, memory allocated).</li>\n<li><b>Ready:</b> loaded in memory and waiting to be assigned the CPU.</li>\n<li><b>Running:</b> its instructions are being executed by the CPU.</li>\n<li><b>Waiting (Blocked):</b> waiting for some event, e.g. I/O completion or a signal.</li>\n<li><b>Terminated (Exit):</b> finished execution; its resources are released.</li>\n</ol>\n<h4>State transitions</h4>\n<ul>\n<li><b>New → Ready (admitted):</b> the long-term scheduler admits the process.</li>\n<li><b>Ready → Running (scheduler dispatch):</b> the short-term scheduler selects it.</li>\n<li><b>Running → Ready (interrupt):</b> time quantum over or a higher-priority process arrives (pre-emption).</li>\n<li><b>Running → Waiting (I/O or event wait):</b> the process requests I/O or waits for an event.</li>\n<li><b>Waiting → Ready (I/O or event completion):</b> the event occurs; the process again waits for the CPU (it never goes directly to running).</li>\n<li><b>Running → Terminated (exit):</b> the process finishes or is killed.</li>\n</ul>\n<p>Some systems add <b>suspended ready</b> and <b>suspended blocked</b> states for processes swapped out to disk (7-state model).</p>", "gu": "<p>Process ચાલે તેમ તેની <b>state</b> બદલાય છે. State એ process ની હાલની પ્રવૃત્તિ છે. એક CPU પર એક સમયે <b>માત્ર એક process running</b> હોઈ શકે; ઘણી ready કે waiting હોઈ શકે.</p>\n<h4>પાંચ states</h4>\n<ol>\n<li><b>New:</b> process બની રહી છે (PCB બને, memory ફાળવાય).</li>\n<li><b>Ready:</b> memory માં load થઈ છે અને CPU મળવાની રાહ જુએ છે.</li>\n<li><b>Running:</b> CPU તેના instructions ચલાવે છે.</li>\n<li><b>Waiting (Blocked):</b> કોઈ event ની રાહ જુએ છે, દા.ત. I/O completion કે signal.</li>\n<li><b>Terminated (Exit):</b> execution પૂરું; તેના resources મુક્ત થાય.</li>\n</ol>\n<h4>State transitions</h4>\n<ul>\n<li><b>New → Ready (admitted):</b> long-term scheduler process ને પ્રવેશ આપે.</li>\n<li><b>Ready → Running (scheduler dispatch):</b> short-term scheduler તેને પસંદ કરે.</li>\n<li><b>Running → Ready (interrupt):</b> time quantum પૂરો થાય કે ઊંચી priority વાળી process આવે (pre-emption).</li>\n<li><b>Running → Waiting (I/O or event wait):</b> process I/O માંગે કે event ની રાહ જુએ.</li>\n<li><b>Waiting → Ready (I/O or event completion):</b> event થાય; process ફરી CPU ની રાહ જુએ (સીધી running માં ક્યારેય ન જાય).</li>\n<li><b>Running → Terminated (exit):</b> process પૂરી થાય કે kill થાય.</li>\n</ul>\n<p>કેટલીક systems disk પર swap out થયેલી processes માટે <b>suspended ready</b> અને <b>suspended blocked</b> states ઉમેરે છે (7-state model).</p>"}, "diagram": "os2_states"}, {"h": {"en": "2.1.4 Process Control Block (PCB)", "gu": "2.1.4 Process Control Block (PCB)"}, "body": {"en": "<p>Each process is represented in the OS by a <b>Process Control Block (PCB)</b>, also called a <b>task control block</b>. It is a data structure in the kernel that stores all the information needed to manage the process. The PCB is created when the process is created and deleted when it terminates.</p>\n<h4>Fields of a PCB</h4>\n<ol>\n<li><b>Pointer:</b> links the PCB into a scheduling queue (ready queue, device queue).</li>\n<li><b>Process state:</b> new, ready, running, waiting or terminated.</li>\n<li><b>Process ID (PID):</b> unique identification number (also parent PID).</li>\n<li><b>Program counter:</b> address of the next instruction to execute.</li>\n<li><b>CPU registers:</b> accumulator, index registers, stack pointer, general-purpose registers; saved on an interrupt so that the process can continue correctly later.</li>\n<li><b>CPU-scheduling information:</b> priority, pointers to scheduling queues, other scheduling parameters.</li>\n<li><b>Memory-management information:</b> base and limit registers, page tables or segment tables.</li>\n<li><b>Accounting information:</b> CPU time used, real time used, time limits, job number.</li>\n<li><b>I/O status information:</b> list of I/O devices allocated, list of open files.</li>\n</ol>\n<p><b>Role in context switch:</b> when the CPU switches from one process to another, the state of the old process is saved in its PCB and the state of the new process is loaded from its PCB.</p>", "gu": "<p>OS માં દરેક process ને <b>Process Control Block (PCB)</b> વડે દર્શાવાય છે, જેને <b>task control block</b> પણ કહે છે. તે kernel માં રહેલું data structure છે જે process ના સંચાલન માટે જરૂરી બધી માહિતી રાખે છે. Process બને ત્યારે PCB બને અને process પૂરી થાય ત્યારે delete થાય.</p>\n<h4>PCB ના fields</h4>\n<ol>\n<li><b>Pointer:</b> PCB ને scheduling queue (ready queue, device queue) માં જોડે છે.</li>\n<li><b>Process state:</b> new, ready, running, waiting અથવા terminated.</li>\n<li><b>Process ID (PID):</b> અનન્ય ઓળખ નંબર (parent PID પણ).</li>\n<li><b>Program counter:</b> ચલાવવાના આગળના instruction નું address.</li>\n<li><b>CPU registers:</b> accumulator, index registers, stack pointer, general-purpose registers; interrupt વખતે save થાય જેથી process પછી બરાબર આગળ ચાલી શકે.</li>\n<li><b>CPU-scheduling information:</b> priority, scheduling queues ના pointers, બીજા scheduling parameters.</li>\n<li><b>Memory-management information:</b> base અને limit registers, page tables અથવા segment tables.</li>\n<li><b>Accounting information:</b> વપરાયેલો CPU time, real time, time limits, job number.</li>\n<li><b>I/O status information:</b> ફાળવેલા I/O devices ની યાદી, open files ની યાદી.</li>\n</ol>\n<p><b>Context switch માં ભૂમિકા:</b> CPU એક process થી બીજી પર જાય ત્યારે જૂની process ની state તેના PCB માં save થાય અને નવી process ની state તેના PCB માંથી load થાય.</p>"}, "diagram": "os2_pcb"}]}, {"title": {"en": "2.2 Process Scheduling", "gu": "2.2 Process Scheduling"}, "items": [{"h": {"en": "2.2.1 CPU Scheduling: Basic Concepts", "gu": "2.2.1 CPU Scheduling: મૂળભૂત Concepts"}, "body": {"en": "<p><b>CPU scheduling</b> is the method of selecting a process from the <b>ready queue</b> and allocating the CPU to it. It is the basis of multiprogramming: by switching the CPU among processes, the OS keeps the CPU busy.</p>\n<ul>\n<li><b>CPU–I/O burst cycle:</b> a process alternates between <b>CPU bursts</b> (computing) and <b>I/O bursts</b> (waiting for I/O). The <b>burst time (BT)</b> is the CPU time a process needs.</li>\n<li><b>CPU scheduler (short-term scheduler):</b> selects the next process from the ready queue.</li>\n<li><b>Dispatcher:</b> gives control of the CPU to the selected process: switches context, switches to user mode and jumps to the proper location. The time it takes is the <b>dispatch latency</b>.</li>\n</ul>\n<h4>When does scheduling happen?</h4>\n<ol>\n<li>A process switches from running to waiting (I/O request).</li>\n<li>A process switches from running to ready (interrupt / time-out).</li>\n<li>A process switches from waiting to ready (I/O completion).</li>\n<li>A process terminates.</li>\n</ol>\n<p>If scheduling happens only in cases 1 and 4, it is <b>non-preemptive</b>; otherwise it is <b>preemptive</b>.</p>\n<h4>Preemptive vs non-preemptive scheduling</h4>\n<table><tr><th>Point</th><th>Preemptive</th><th>Non-preemptive</th></tr><tr><td>CPU taken away?</td><td>Yes, on interrupt / higher priority / time-out</td><td>No, process keeps CPU till it ends or blocks</td></tr><tr><td>Response time</td><td>Good</td><td>Poor for short jobs</td></tr><tr><td>Overhead</td><td>More context switches</td><td>Less</td></tr><tr><td>Starvation</td><td>Possible</td><td>Possible (long job blocks others)</td></tr><tr><td>Examples</td><td>RR, SRTF, preemptive priority</td><td>FCFS, SJF, non-preemptive priority</td></tr></table>", "gu": "<p><b>CPU scheduling</b> એટલે <b>ready queue</b> માંથી process પસંદ કરી તેને CPU આપવાની પદ્ધતિ. તે multiprogramming નો આધાર છે: processes વચ્ચે CPU switch કરી OS CPU ને વ્યસ્ત રાખે છે.</p>\n<ul>\n<li><b>CPU–I/O burst cycle:</b> process <b>CPU bursts</b> (ગણતરી) અને <b>I/O bursts</b> (I/O ની રાહ) વચ્ચે ફરતી રહે છે. <b>Burst time (BT)</b> એ process ને જોઈતો CPU time છે.</li>\n<li><b>CPU scheduler (short-term scheduler):</b> ready queue માંથી આગળની process પસંદ કરે.</li>\n<li><b>Dispatcher:</b> પસંદ કરેલી process ને CPU નું control આપે: context switch કરે, user mode માં જાય અને યોગ્ય સ્થાને jump કરે. તેમાં લાગતો સમય <b>dispatch latency</b> છે.</li>\n</ul>\n<h4>Scheduling ક્યારે થાય?</h4>\n<ol>\n<li>Process running માંથી waiting માં જાય (I/O request).</li>\n<li>Process running માંથી ready માં જાય (interrupt / time-out).</li>\n<li>Process waiting માંથી ready માં જાય (I/O completion).</li>\n<li>Process terminate થાય.</li>\n</ol>\n<p>Scheduling માત્ર 1 અને 4 માં થાય તો તે <b>non-preemptive</b>; નહીં તો <b>preemptive</b>.</p>\n<h4>Preemptive vs non-preemptive scheduling</h4>\n<table><tr><th>મુદ્દો</th><th>Preemptive</th><th>Non-preemptive</th></tr><tr><td>CPU લઈ લેવાય?</td><td>હા, interrupt / ઊંચી priority / time-out પર</td><td>ના, process પૂરી કે block થાય ત્યાં સુધી CPU રાખે</td></tr><tr><td>Response time</td><td>સારો</td><td>નાના jobs માટે ખરાબ</td></tr><tr><td>Overhead</td><td>વધુ context switches</td><td>ઓછો</td></tr><tr><td>Starvation</td><td>શક્ય</td><td>શક્ય (લાંબો job બીજાને રોકે)</td></tr><tr><td>ઉદાહરણ</td><td>RR, SRTF, preemptive priority</td><td>FCFS, SJF, non-preemptive priority</td></tr></table>"}}, {"h": {"en": "2.2.2 Scheduling Criteria", "gu": "2.2.2 Scheduling Criteria"}, "body": {"en": "<p>Scheduling algorithms are compared using the following <b>criteria</b>:</p>\n<ol>\n<li><b>CPU utilisation:</b> keep the CPU as busy as possible (40% light load to 90% heavy load). <i>Maximise.</i></li>\n<li><b>Throughput:</b> number of processes completed per unit time. <i>Maximise.</i></li>\n<li><b>Turnaround time (TAT):</b> total time from submission (arrival) to completion: TAT = CT − AT. It includes waiting in the ready queue, executing and doing I/O. <i>Minimise.</i></li>\n<li><b>Waiting time (WT):</b> total time a process spends waiting in the ready queue: WT = TAT − BT. The scheduling algorithm directly affects only this. <i>Minimise.</i></li>\n<li><b>Response time (RT):</b> time from arrival until the process gets the CPU for the first time (first response). Important for interactive systems. <i>Minimise.</i></li>\n</ol>\n<p>Other goals: <b>fairness</b> (every process gets a fair share, no starvation) and <b>predictability</b>.</p>\n<h4>Terms used in numericals</h4>\n<ul>\n<li><b>AT (arrival time):</b> time when the process enters the ready queue.</li>\n<li><b>BT (burst time):</b> CPU time required.</li>\n<li><b>CT (completion time):</b> time when the process finishes.</li>\n<li><b>Gantt chart:</b> a bar chart showing which process runs in which time interval.</li>\n</ul>", "gu": "<p>Scheduling algorithms ની સરખામણી નીચેના <b>criteria</b> થી થાય છે:</p>\n<ol>\n<li><b>CPU utilisation:</b> CPU ને શક્ય તેટલું વ્યસ્ત રાખવું (ઓછા load માં 40% થી ભારે load માં 90%). <i>વધારવું.</i></li>\n<li><b>Throughput:</b> એકમ સમયમાં પૂરી થતી processes ની સંખ્યા. <i>વધારવું.</i></li>\n<li><b>Turnaround time (TAT):</b> submission (arrival) થી completion સુધીનો કુલ સમય: TAT = CT − AT. તેમાં ready queue માં રાહ, execution અને I/O સમાવિષ્ટ છે. <i>ઘટાડવું.</i></li>\n<li><b>Waiting time (WT):</b> process એ ready queue માં રાહ જોવામાં ગાળેલો કુલ સમય: WT = TAT − BT. Scheduling algorithm સીધી રીતે માત્ર આને અસર કરે છે. <i>ઘટાડવું.</i></li>\n<li><b>Response time (RT):</b> arrival થી process ને પહેલી વાર CPU મળે ત્યાં સુધીનો સમય (પહેલો response). Interactive systems માટે મહત્ત્વનો. <i>ઘટાડવું.</i></li>\n</ol>\n<p>બીજા ધ્યેય: <b>fairness</b> (દરેક process ને યોગ્ય ભાગ, starvation નહીં) અને <b>predictability</b>.</p>\n<h4>Numericals માં વપરાતા શબ્દો</h4>\n<ul>\n<li><b>AT (arrival time):</b> process ready queue માં આવે તે સમય.</li>\n<li><b>BT (burst time):</b> જરૂરી CPU time.</li>\n<li><b>CT (completion time):</b> process પૂરી થાય તે સમય.</li>\n<li><b>Gantt chart:</b> કયા સમય ગાળામાં કઈ process ચાલે છે તે દર્શાવતો bar chart.</li>\n</ul>"}, "diagram": "os2_times"}, {"h": {"en": "2.2.3 First Come First Serve (FCFS)", "gu": "2.2.3 First Come First Serve (FCFS)"}, "body": {"en": "<p><b>FCFS</b> is the simplest scheduling algorithm. The process that <b>requests the CPU first gets it first</b>. It is implemented with a <b>FIFO queue</b>: a new process's PCB is linked at the tail of the ready queue, and the CPU is given to the process at the head.</p>\n<p>FCFS is <b>non-preemptive</b>: once a process gets the CPU, it keeps it until it terminates or requests I/O.</p>\n<h4>Steps to solve</h4>\n<ol>\n<li>Sort the processes by arrival time.</li>\n<li>Run each process completely, one after another (if the CPU is free and no process has arrived, the CPU stays idle).</li>\n<li>Draw the Gantt chart; find CT, then TAT = CT − AT and WT = TAT − BT.</li>\n</ol>\n<h4>Advantages</h4>\n<ul><li>Simple to understand and implement.</li><li>Fair in the order of arrival; no starvation.</li></ul>\n<h4>Disadvantages</h4>\n<ul><li>Average waiting time is often long.</li><li><b>Convoy effect:</b> short processes wait behind one long process, so CPU and I/O devices are poorly used.</li><li>Not suitable for time-sharing systems.</li></ul>", "gu": "<p><b>FCFS</b> સૌથી સરળ scheduling algorithm છે. <b>જે process પહેલા CPU માંગે તેને પહેલા મળે</b>. તે <b>FIFO queue</b> થી અમલ થાય છે: નવી process નું PCB ready queue ના છેડે જોડાય, અને CPU queue ની શરૂઆતની process ને મળે.</p>\n<p>FCFS <b>non-preemptive</b> છે: process ને CPU મળે પછી તે પૂરી થાય કે I/O માંગે ત્યાં સુધી રાખે છે.</p>\n<h4>ઉકેલવાના પગલાં</h4>\n<ol>\n<li>Processes ને arrival time પ્રમાણે ગોઠવો.</li>\n<li>દરેક process ને એક પછી એક સંપૂર્ણ ચલાવો (CPU મુક્ત હોય અને કોઈ process ન આવી હોય તો CPU idle રહે).</li>\n<li>Gantt chart દોરો; CT શોધો, પછી TAT = CT − AT અને WT = TAT − BT.</li>\n</ol>\n<h4>ફાયદા</h4>\n<ul><li>સમજવા અને અમલ કરવા સરળ.</li><li>Arrival ના ક્રમમાં ન્યાયી; starvation નહીં.</li></ul>\n<h4>ગેરફાયદા</h4>\n<ul><li>સરેરાશ waiting time ઘણી વાર લાંબો.</li><li><b>Convoy effect:</b> નાની processes એક લાંબી process પાછળ રાહ જુએ, તેથી CPU અને I/O devices નો ખરાબ ઉપયોગ.</li><li>Time-sharing systems માટે યોગ્ય નથી.</li></ul>"}, "diagram": "os2_fcfs", "examples": ["os2n1", "os2n4", "os2n9"]}, {"h": {"en": "2.2.4 Shortest Job First (SJF)", "gu": "2.2.4 Shortest Job First (SJF)"}, "body": {"en": "<p>In <b>SJF</b>, when the CPU is free it is given to the waiting process with the <b>smallest next CPU burst</b>. If two processes have the same burst, FCFS breaks the tie.</p>\n<h4>Two versions</h4>\n<ul>\n<li><b>Non-preemptive SJF:</b> once a process starts, it runs to completion even if a shorter process arrives.</li>\n<li><b>Preemptive SJF = Shortest Remaining Time First (SRTF):</b> if a newly arrived process has a burst shorter than the <b>remaining</b> time of the running process, the running process is pre-empted.</li>\n</ul>\n<h4>Steps to solve (non-preemptive)</h4>\n<ol>\n<li>At time t, look at all processes that have <b>arrived</b> (AT ≤ t) and are not finished.</li>\n<li>Pick the one with the smallest BT; run it completely; set t = its CT.</li>\n<li>Repeat. If none has arrived, the CPU is idle until the next arrival.</li>\n</ol>\n<h4>Advantages</h4>\n<ul><li>Gives the <b>minimum average waiting time</b> for a given set of processes (provably optimal).</li><li>High throughput.</li></ul>\n<h4>Disadvantages</h4>\n<ul><li>The length of the next CPU burst cannot be known exactly; it must be estimated (e.g. exponential average of previous bursts).</li><li><b>Starvation</b> of long processes if short ones keep arriving.</li></ul>", "gu": "<p><b>SJF</b> માં CPU મુક્ત થાય ત્યારે તે <b>સૌથી નાના next CPU burst</b> વાળી રાહ જોતી process ને મળે છે. બે processes નો burst સરખો હોય તો FCFS થી નક્કી થાય.</p>\n<h4>બે પ્રકાર</h4>\n<ul>\n<li><b>Non-preemptive SJF:</b> process શરૂ થયા પછી નાની process આવે તો પણ પૂરી થાય ત્યાં સુધી ચાલે.</li>\n<li><b>Preemptive SJF = Shortest Remaining Time First (SRTF):</b> નવી આવેલી process નો burst ચાલતી process ના <b>બાકી</b> સમય કરતાં નાનો હોય તો ચાલતી process pre-empt થાય.</li>\n</ul>\n<h4>ઉકેલવાના પગલાં (non-preemptive)</h4>\n<ol>\n<li>સમય t પર, <b>આવી ગયેલી</b> (AT ≤ t) અને પૂરી ન થયેલી બધી processes જુઓ.</li>\n<li>સૌથી નાના BT વાળી પસંદ કરો; સંપૂર્ણ ચલાવો; t = તેનો CT.</li>\n<li>પુનરાવર્તન કરો. કોઈ ન આવી હોય તો આગળના arrival સુધી CPU idle.</li>\n</ol>\n<h4>ફાયદા</h4>\n<ul><li>આપેલી processes માટે <b>ઓછામાં ઓછો સરેરાશ waiting time</b> આપે (optimal સાબિત).</li><li>વધુ throughput.</li></ul>\n<h4>ગેરફાયદા</h4>\n<ul><li>આગળના CPU burst ની લંબાઈ ચોક્કસ જાણી શકાતી નથી; અંદાજ કાઢવો પડે (દા.ત. પાછલા bursts નો exponential average).</li><li>નાની processes આવતી રહે તો લાંબી processes ની <b>starvation</b>.</li></ul>"}, "diagram": "os2_sjf", "examples": ["os2n2", "os2n5", "os2n10"]}, {"h": {"en": "2.2.5 Round Robin (RR)", "gu": "2.2.5 Round Robin (RR)"}, "body": {"en": "<p><b>Round Robin</b> is designed for <b>time-sharing</b> systems. It is like FCFS, but with <b>pre-emption</b>. A small unit of time, the <b>time quantum (time slice) q</b>, usually 10–100 ms, is defined. The ready queue is a <b>circular FIFO queue</b>.</p>\n<h4>Working</h4>\n<ol>\n<li>The scheduler picks the first process from the ready queue and sets a timer for one quantum.</li>\n<li>If the process's remaining burst ≤ q, it finishes and releases the CPU voluntarily.</li>\n<li>Otherwise the timer interrupts after q; the process is pre-empted (context switch) and put at the <b>tail</b> of the ready queue.</li>\n<li>The next process in the queue gets the CPU, and so on.</li>\n</ol>\n<p>With n processes and quantum q, no process waits more than (n − 1) × q time units for its next turn.</p>\n<h4>Choice of time quantum</h4>\n<ul>\n<li><b>Very large q</b> → RR behaves like FCFS.</li>\n<li><b>Very small q</b> → too many context switches; most CPU time is wasted in switching.</li>\n<li>Rule of thumb: about 80% of CPU bursts should be shorter than q.</li>\n</ul>\n<h4>Advantages</h4>\n<ul><li>Fair; every process gets the CPU regularly; <b>no starvation</b>.</li><li>Good response time for interactive users.</li></ul>\n<h4>Disadvantages</h4>\n<ul><li>Context-switch overhead; average waiting time is often high.</li><li>Performance depends heavily on q.</li></ul>", "gu": "<p><b>Round Robin</b> <b>time-sharing</b> systems માટે બનાવાયો છે. તે FCFS જેવો છે, પણ <b>pre-emption</b> સાથે. સમયનો નાનો એકમ, <b>time quantum (time slice) q</b>, સામાન્ય રીતે 10–100 ms, નક્કી થાય છે. Ready queue એક <b>circular FIFO queue</b> છે.</p>\n<h4>કાર્યપદ્ધતિ</h4>\n<ol>\n<li>Scheduler ready queue માંથી પહેલી process પસંદ કરે અને એક quantum નો timer મૂકે.</li>\n<li>Process નો બાકી burst ≤ q હોય તો તે પૂરી થઈ જાતે CPU છોડે.</li>\n<li>નહીં તો q પછી timer interrupt આપે; process pre-empt થાય (context switch) અને ready queue ના <b>છેડે</b> મુકાય.</li>\n<li>Queue ની આગળની process ને CPU મળે, વગેરે.</li>\n</ol>\n<p>n processes અને quantum q હોય તો કોઈ process તેના આગળના વારા માટે (n − 1) × q થી વધુ રાહ જોતી નથી.</p>\n<h4>Time quantum ની પસંદગી</h4>\n<ul>\n<li><b>ખૂબ મોટો q</b> → RR એ FCFS જેવો બને.</li>\n<li><b>ખૂબ નાનો q</b> → ઘણા context switches; મોટા ભાગનો CPU time switching માં વેડફાય.</li>\n<li>સામાન્ય નિયમ: આશરે 80% CPU bursts q કરતાં નાના હોવા જોઈએ.</li>\n</ul>\n<h4>ફાયદા</h4>\n<ul><li>ન્યાયી; દરેક process ને નિયમિત CPU મળે; <b>starvation નહીં</b>.</li><li>Interactive users માટે સારો response time.</li></ul>\n<h4>ગેરફાયદા</h4>\n<ul><li>Context-switch overhead; સરેરાશ waiting time ઘણી વાર વધુ.</li><li>Performance q પર ખૂબ આધાર રાખે.</li></ul>"}, "diagram": "os2_rr", "examples": ["os2n3", "os2n6", "os2n11"]}, {"h": {"en": "2.2.6 Non-Preemptive Priority Scheduling", "gu": "2.2.6 Non-Preemptive Priority Scheduling"}, "body": {"en": "<p>In <b>priority scheduling</b>, a <b>priority number</b> is associated with each process, and the CPU is given to the process with the <b>highest priority</b>. In this syllabus (and most books), a <b>smaller number means higher priority</b> (0 or 1 = highest). Equal priorities are scheduled in FCFS order.</p>\n<p>In the <b>non-preemptive</b> version, if a higher-priority process arrives while another is running, it is simply placed at the head of the ready queue; the running process is <b>not</b> interrupted. (In the preemptive version, the running process would be pre-empted.)</p>\n<p>Priorities can be <b>internal</b> (memory needs, time limits, number of open files) or <b>external</b> (importance of the user, payment, department).</p>\n<p>SJF is a special case of priority scheduling where priority = predicted burst time.</p>\n<h4>Problem: starvation (indefinite blocking)</h4>\n<p>A low-priority process may wait forever if higher-priority processes keep arriving.</p>\n<p><b>Solution: aging</b>: gradually increase the priority of processes that wait for a long time (e.g. raise priority by 1 every 15 minutes), so that eventually they get the CPU.</p>\n<h4>Advantages / disadvantages</h4>\n<ul><li><b>+</b> Important (system or real-time) processes run first.</li><li><b>−</b> Starvation; choosing priorities is difficult.</li></ul>", "gu": "<p><b>Priority scheduling</b> માં દરેક process સાથે <b>priority number</b> જોડાય છે, અને CPU <b>સૌથી ઊંચી priority</b> વાળી process ને મળે છે. આ syllabus (અને મોટા ભાગના પુસ્તકો) માં <b>નાની સંખ્યા એટલે ઊંચી priority</b> (0 કે 1 = સૌથી ઊંચી). સરખી priorities FCFS ક્રમે schedule થાય.</p>\n<p><b>Non-preemptive</b> version માં, બીજી process ચાલતી હોય ત્યારે ઊંચી priority વાળી process આવે તો તે માત્ર ready queue ની શરૂઆતમાં મુકાય; ચાલતી process ને <b>અટકાવાતી નથી</b>. (Preemptive version માં ચાલતી process pre-empt થાય.)</p>\n<p>Priorities <b>internal</b> (memory જરૂરિયાત, time limits, open files ની સંખ્યા) અથવા <b>external</b> (user નું મહત્ત્વ, ચુકવણી, department) હોઈ શકે.</p>\n<p>SJF એ priority scheduling નો ખાસ કિસ્સો છે જ્યાં priority = અંદાજિત burst time.</p>\n<h4>સમસ્યા: starvation (indefinite blocking)</h4>\n<p>ઊંચી priority વાળી processes આવતી રહે તો low-priority process કાયમ રાહ જોઈ શકે.</p>\n<p><b>ઉકેલ: aging</b>: લાંબો સમય રાહ જોતી processes ની priority ધીમે ધીમે વધારવી (દા.ત. દર 15 મિનિટે priority 1 વધારવી), જેથી અંતે તેમને CPU મળે.</p>\n<h4>ફાયદા / ગેરફાયદા</h4>\n<ul><li><b>+</b> મહત્ત્વની (system કે real-time) processes પહેલા ચાલે.</li><li><b>−</b> Starvation; priorities નક્કી કરવી મુશ્કેલ.</li></ul>"}, "diagram": "os2_priority", "examples": ["os2n7", "os2n8"]}, {"h": {"en": "2.2.7 Comparison of Scheduling Algorithms", "gu": "2.2.7 Scheduling Algorithms ની સરખામણી"}, "body": {"en": "<table><tr><th>Algorithm</th><th>Type</th><th>Selection</th><th>Advantage</th><th>Disadvantage</th></tr><tr><td>FCFS</td><td>Non-preemptive</td><td>Earliest arrival</td><td>Simple, fair order</td><td>Convoy effect, high WT</td></tr><tr><td>SJF</td><td>Non-preemptive (SRTF = preemptive)</td><td>Smallest burst</td><td>Minimum average WT (optimal)</td><td>Burst must be known; starvation</td></tr><tr><td>Round Robin</td><td>Preemptive</td><td>Turn by turn, quantum q</td><td>Good response, no starvation</td><td>Context-switch overhead; depends on q</td></tr><tr><td>Priority</td><td>Non-preemptive (or preemptive)</td><td>Highest priority</td><td>Important jobs first</td><td>Starvation (solved by aging)</td></tr></table><h4>Results of Practical 2 (average TAT / WT)</h4><table><tr><th>Practical</th><th>FCFS (TAT / WT)</th><th>SJF (TAT / WT)</th><th>RR q=2 (TAT / WT)</th></tr><tr><td>2(a)</td><td>11.25 / 5.75</td><td>10.75 / 5.25</td><td>15.25 / 9.75</td></tr><tr><td>2(b)</td><td>6.75 / 3</td><td>5.75 / 2</td><td>7.25 / 3.5</td></tr></table><p>SJF gives the lowest averages; RR has the highest averages but the best response time.</p>", "gu": "<table><tr><th>Algorithm</th><th>પ્રકાર</th><th>પસંદગી</th><th>ફાયદો</th><th>ગેરફાયદો</th></tr><tr><td>FCFS</td><td>Non-preemptive</td><td>સૌથી પહેલું arrival</td><td>સરળ, ન્યાયી ક્રમ</td><td>Convoy effect, વધુ WT</td></tr><tr><td>SJF</td><td>Non-preemptive (SRTF = preemptive)</td><td>સૌથી નાનો burst</td><td>ઓછામાં ઓછો સરેરાશ WT (optimal)</td><td>Burst જાણવો પડે; starvation</td></tr><tr><td>Round Robin</td><td>Preemptive</td><td>વારાફરતી, quantum q</td><td>સારો response, starvation નહીં</td><td>Context-switch overhead; q પર આધાર</td></tr><tr><td>Priority</td><td>Non-preemptive (અથવા preemptive)</td><td>સૌથી ઊંચી priority</td><td>મહત્ત્વના jobs પહેલા</td><td>Starvation (aging થી ઉકેલ)</td></tr></table><h4>Practical 2 ના પરિણામ (સરેરાશ TAT / WT)</h4><table><tr><th>Practical</th><th>FCFS (TAT / WT)</th><th>SJF (TAT / WT)</th><th>RR q=2 (TAT / WT)</th></tr><tr><td>2(a)</td><td>11.25 / 5.75</td><td>10.75 / 5.25</td><td>15.25 / 9.75</td></tr><tr><td>2(b)</td><td>6.75 / 3</td><td>5.75 / 2</td><td>7.25 / 3.5</td></tr></table><p>SJF સૌથી ઓછી સરેરાશ આપે છે; RR ની સરેરાશ સૌથી વધુ છે પણ response time સૌથી સારો છે.</p>"}}]}, {"title": {"en": "2.3 Overview of Schedulers", "gu": "2.3 Schedulers નો પરિચય"}, "items": [{"h": {"en": "2.3.1 Types of Schedulers", "gu": "2.3.1 Schedulers ના પ્રકારો"}, "body": {"en": "<p>A <b>scheduler</b> is the part of the OS that selects processes from a queue for the next step. A process migrates among various queues during its life; three schedulers handle this.</p>\n<h4>1. Long-term scheduler (job scheduler)</h4>\n<ul>\n<li>Selects processes from the <b>job pool</b> (programs waiting on disk) and loads them into memory, i.e. into the <b>ready queue</b> (new → ready).</li>\n<li>Controls the <b>degree of multiprogramming</b> (number of processes in memory).</li>\n<li>Runs less frequently (minutes); can take more time to decide.</li>\n<li>Should select a good <b>mix of I/O-bound processes</b> (spend more time in I/O) and <b>CPU-bound processes</b> (spend more time computing), so that both the CPU and devices stay busy.</li>\n<li>Time-sharing systems (Unix, Windows) have almost no long-term scheduler; every new process is put in memory.</li>\n</ul>\n<h4>2. Short-term scheduler (CPU scheduler)</h4>\n<ul>\n<li>Selects one process from the <b>ready queue</b> and allocates the <b>CPU</b> to it (ready → running), with the help of the dispatcher.</li>\n<li>Runs very frequently (at least once every 100 ms), so it must be very <b>fast</b>.</li>\n<li>Uses algorithms such as FCFS, SJF, RR and priority.</li>\n</ul>\n<h4>3. Medium-term scheduler (swapper)</h4>\n<ul>\n<li>Removes (<b>swaps out</b>) a partially executed process from memory to disk, and later brings it back (<b>swaps in</b>) to continue from where it stopped.</li>\n<li>Used when memory is over-committed, or to improve the mix of processes.</li>\n<li><b>Reduces</b> the degree of multiprogramming; part of time-sharing systems.</li>\n</ul>", "gu": "<p><b>Scheduler</b> એ OS નો ભાગ છે જે આગળના પગલા માટે queue માંથી processes પસંદ કરે છે. Process તેના જીવન દરમિયાન જુદી જુદી queues વચ્ચે ફરે છે; ત્રણ schedulers આ સંભાળે છે.</p>\n<h4>1. Long-term scheduler (job scheduler)</h4>\n<ul>\n<li><b>Job pool</b> (disk પર રાહ જોતા programs) માંથી processes પસંદ કરી memory માં, એટલે કે <b>ready queue</b> માં load કરે (new → ready).</li>\n<li><b>Degree of multiprogramming</b> (memory માં processes ની સંખ્યા) ને control કરે.</li>\n<li>ઓછી વાર ચાલે (minutes); નિર્ણય માટે વધુ સમય લઈ શકે.</li>\n<li><b>I/O-bound processes</b> (I/O માં વધુ સમય) અને <b>CPU-bound processes</b> (ગણતરીમાં વધુ સમય) નું સારું <b>મિશ્રણ</b> પસંદ કરવું જોઈએ, જેથી CPU અને devices બંને વ્યસ્ત રહે.</li>\n<li>Time-sharing systems (Unix, Windows) માં long-term scheduler લગભગ નથી; દરેક નવી process memory માં મુકાય છે.</li>\n</ul>\n<h4>2. Short-term scheduler (CPU scheduler)</h4>\n<ul>\n<li><b>Ready queue</b> માંથી એક process પસંદ કરી dispatcher ની મદદથી તેને <b>CPU</b> આપે (ready → running).</li>\n<li>ખૂબ વારંવાર ચાલે (ઓછામાં ઓછું દર 100 ms એ એક વાર), તેથી ખૂબ <b>ઝડપી</b> હોવો જોઈએ.</li>\n<li>FCFS, SJF, RR અને priority જેવા algorithms વાપરે.</li>\n</ul>\n<h4>3. Medium-term scheduler (swapper)</h4>\n<ul>\n<li>અંશતઃ ચાલેલી process ને memory માંથી disk પર કાઢે (<b>swap out</b>), અને પછી જ્યાં અટકી હતી ત્યાંથી આગળ ચલાવવા પાછી લાવે (<b>swap in</b>).</li>\n<li>Memory ઓછી પડે ત્યારે, અથવા processes નું મિશ્રણ સુધારવા વપરાય.</li>\n<li>Degree of multiprogramming <b>ઘટાડે</b>; time-sharing systems નો ભાગ.</li>\n</ul>"}, "diagram": "os2_schedulers"}, {"h": {"en": "2.3.2 Comparison of Schedulers", "gu": "2.3.2 Schedulers ની સરખામણી"}, "body": {"en": "<p>A favourite 3/4-mark question:</p><table><tr><th>Point</th><th>Long-term</th><th>Short-term</th><th>Medium-term</th></tr><tr><td>Also called</td><td>Job scheduler</td><td>CPU scheduler</td><td>Swapper</td></tr><tr><td>Selects from → to</td><td>Job pool (disk) → ready queue</td><td>Ready queue → CPU</td><td>Memory ↔ disk (swap out / in)</td></tr><tr><td>Speed / frequency</td><td>Slowest; runs rarely (minutes)</td><td>Fastest; runs very often (ms)</td><td>In between</td></tr><tr><td>Degree of multiprogramming</td><td>Controls it</td><td>Little control</td><td>Reduces it</td></tr><tr><td>Present in time-sharing OS?</td><td>Minimal or absent</td><td>Yes</td><td>Yes</td></tr><tr><td>Main aim</td><td>Good mix of I/O-bound and CPU-bound jobs</td><td>Choose next process to run</td><td>Free memory; improve the process mix</td></tr></table>", "gu": "<p>ઘણો પૂછાતો 3/4 ગુણનો પ્રશ્ન:</p><table><tr><th>મુદ્દો</th><th>Long-term</th><th>Short-term</th><th>Medium-term</th></tr><tr><td>બીજું નામ</td><td>Job scheduler</td><td>CPU scheduler</td><td>Swapper</td></tr><tr><td>ક્યાંથી → ક્યાં</td><td>Job pool (disk) → ready queue</td><td>Ready queue → CPU</td><td>Memory ↔ disk (swap out / in)</td></tr><tr><td>ઝડપ / આવર્તન</td><td>સૌથી ધીમો; ક્યારેક ચાલે (minutes)</td><td>સૌથી ઝડપી; વારંવાર ચાલે (ms)</td><td>વચ્ચે</td></tr><tr><td>Degree of multiprogramming</td><td>Control કરે</td><td>ઓછું control</td><td>ઘટાડે</td></tr><tr><td>Time-sharing OS માં?</td><td>ઓછો કે નહીં</td><td>હા</td><td>હા</td></tr><tr><td>મુખ્ય હેતુ</td><td>I/O-bound અને CPU-bound jobs નું સારું મિશ્રણ</td><td>આગળ ચલાવવાની process પસંદ કરવી</td><td>Memory મુક્ત કરવી; process mix સુધારવું</td></tr></table>"}}, {"h": {"en": "2.3.3 Scheduling Queues", "gu": "2.3.3 Scheduling Queues"}, "body": {"en": "<p>The OS keeps processes in different <b>queues</b> (linked lists of PCBs) according to their state:</p>\n<ul>\n<li><b>Job queue:</b> all processes in the system.</li>\n<li><b>Ready queue:</b> processes in main memory that are ready and waiting to execute. Its header points to the first and last PCB.</li>\n<li><b>Device (I/O) queues:</b> processes waiting for a particular I/O device; each device has its own queue.</li>\n</ul>\n<h4>Queueing diagram</h4>\n<p>A new process is first put in the ready queue. It waits there until it is selected (dispatched) for execution. While it is running, one of these events may occur:</p>\n<ol>\n<li>It issues an <b>I/O request</b> and is placed in an I/O queue.</li>\n<li>Its <b>time slice expires</b> and it is put back in the ready queue.</li>\n<li>It <b>creates a child process</b> (fork) and waits for the child to finish.</li>\n<li>It <b>waits for an interrupt</b> and is removed from the CPU until the interrupt occurs.</li>\n</ol>\n<p>In each case the process eventually returns to the ready queue. It continues this cycle until it terminates; then it is removed from all queues and its PCB and resources are released.</p>\n<p>In the diagram, rectangles are queues, the circle is the resource that serves the queue (CPU), and arrows show the flow of processes.</p>", "gu": "<p>OS processes ને તેમની state પ્રમાણે જુદી જુદી <b>queues</b> (PCBs ની linked lists) માં રાખે છે:</p>\n<ul>\n<li><b>Job queue:</b> system ની બધી processes.</li>\n<li><b>Ready queue:</b> main memory માં રહેલી, ready અને ચાલવાની રાહ જોતી processes. તેનું header પહેલા અને છેલ્લા PCB તરફ point કરે.</li>\n<li><b>Device (I/O) queues:</b> કોઈ ચોક્કસ I/O device ની રાહ જોતી processes; દરેક device ની પોતાની queue.</li>\n</ul>\n<h4>Queueing diagram</h4>\n<p>નવી process પહેલા ready queue માં મુકાય છે. Execution માટે પસંદ (dispatch) થાય ત્યાં સુધી ત્યાં રાહ જુએ છે. ચાલતી વખતે આમાંથી એક event થઈ શકે:</p>\n<ol>\n<li>તે <b>I/O request</b> આપે અને I/O queue માં મુકાય.</li>\n<li>તેનો <b>time slice પૂરો થાય</b> અને ફરી ready queue માં મુકાય.</li>\n<li>તે <b>child process બનાવે</b> (fork) અને child પૂરી થાય તેની રાહ જુએ.</li>\n<li>તે <b>interrupt ની રાહ જુએ</b> અને interrupt થાય ત્યાં સુધી CPU પરથી દૂર થાય.</li>\n</ol>\n<p>દરેક કિસ્સામાં process અંતે ready queue માં પાછી આવે છે. Terminate થાય ત્યાં સુધી આ ચક્ર ચાલે; પછી તેને બધી queues માંથી દૂર કરાય અને તેનું PCB તથા resources મુક્ત થાય.</p>\n<p>આકૃતિમાં લંબચોરસ queues છે, વર્તુળ queue ને સેવા આપતો resource (CPU) છે, અને તીર processes નો પ્રવાહ દર્શાવે છે.</p>"}, "diagram": "os2_queues"}, {"h": {"en": "2.3.4 Context Switch", "gu": "2.3.4 Context Switch"}, "body": {"en": "<p>The <b>context</b> of a process is its current state, stored in its PCB: CPU register values, program counter, process state and memory-management information.</p>\n<p>A <b>context switch</b> is the task of switching the CPU from one process to another: the kernel <b>saves the context of the old process</b> in its PCB and <b>loads the saved context of the new process</b> scheduled to run.</p>\n<h4>When does it occur?</h4>\n<ul><li>Interrupt (e.g. timer interrupt when the time quantum ends).</li><li>System call / I/O request by the running process.</li><li>A higher-priority process becomes ready (pre-emption).</li></ul>\n<h4>Steps</h4>\n<ol>\n<li>P0 is running; an interrupt or system call occurs.</li>\n<li>The OS saves the state of P0 into PCB0.</li>\n<li>The scheduler selects P1; the OS reloads the state of P1 from PCB1.</li>\n<li>P1 runs while P0 stays idle (ready or waiting).</li>\n<li>Later, on another interrupt, the state of P1 is saved into PCB1 and P0 is reloaded from PCB0.</li>\n</ol>\n<p><b>Context-switch time is pure overhead</b>: the system does no useful work while switching. It typically takes a few microseconds and depends on memory speed, the number of registers and hardware support (some CPUs have multiple register sets). Too many context switches (e.g. a very small RR quantum) reduce performance.</p>", "gu": "<p>Process નો <b>context</b> એટલે તેની હાલની state, જે તેના PCB માં store હોય છે: CPU register values, program counter, process state અને memory-management information.</p>\n<p><b>Context switch</b> એટલે CPU ને એક process થી બીજી process પર switch કરવાનું કામ: kernel <b>જૂની process નો context</b> તેના PCB માં save કરે છે અને ચલાવવા માટે schedule થયેલી <b>નવી process નો saved context load</b> કરે છે.</p>\n<h4>ક્યારે થાય?</h4>\n<ul><li>Interrupt (દા.ત. time quantum પૂરો થાય ત્યારે timer interrupt).</li><li>ચાલતી process નો system call / I/O request.</li><li>ઊંચી priority વાળી process ready થાય (pre-emption).</li></ul>\n<h4>પગલાં</h4>\n<ol>\n<li>P0 ચાલે છે; interrupt કે system call થાય.</li>\n<li>OS P0 ની state PCB0 માં save કરે.</li>\n<li>Scheduler P1 પસંદ કરે; OS PCB1 માંથી P1 ની state reload કરે.</li>\n<li>P1 ચાલે અને P0 idle (ready કે waiting) રહે.</li>\n<li>પછી બીજા interrupt પર P1 ની state PCB1 માં save થાય અને P0 PCB0 માંથી reload થાય.</li>\n</ol>\n<p><b>Context-switch time સંપૂર્ણ overhead છે</b>: switching વખતે system કોઈ ઉપયોગી કામ કરતી નથી. તે સામાન્ય રીતે થોડા microseconds લે છે અને memory ની ઝડપ, registers ની સંખ્યા અને hardware support (કેટલાક CPUs માં ઘણા register sets) પર આધાર રાખે છે. વધુ પડતા context switches (દા.ત. ખૂબ નાનો RR quantum) performance ઘટાડે છે.</p>"}, "diagram": "os2_context"}]}, {"title": {"en": "2.4 Process Synchronization", "gu": "2.4 Process Synchronization"}, "items": [{"h": {"en": "2.4.1 Race Condition", "gu": "2.4.1 Race Condition"}, "body": {"en": "<p><b>Cooperating processes</b> share data (shared memory, files). When several processes <b>access and modify the same shared data concurrently</b>, and the <b>final result depends on the order</b> in which their instructions execute, the situation is called a <b>race condition</b>.</p>\n<h4>Example</h4>\n<p>A shared variable <code>counter = 5</code>. Process P1 (producer) executes <code>counter++</code> and P2 (consumer) executes <code>counter--</code>. In machine language each statement is three instructions:</p>\n<ul>\n<li><code>counter++</code>: reg1 = counter; reg1 = reg1 + 1; counter = reg1</li>\n<li><code>counter--</code>: reg2 = counter; reg2 = reg2 − 1; counter = reg2</li>\n</ul>\n<p>If these instructions interleave as shown in the diagram, the final value is 4 (or 6 with another order), but the correct value is <b>5</b>. The error happens because both processes manipulate <code>counter</code> at the same time.</p>\n<p><b>Solution:</b> ensure that only <b>one process at a time</b> can manipulate the shared variable: this needs <b>process synchronization</b> (critical-section solutions, locks, semaphores).</p>", "gu": "<p><b>Cooperating processes</b> data વહેંચે છે (shared memory, files). જ્યારે ઘણી processes <b>એક જ shared data ને એક સાથે access અને modify કરે</b>, અને <b>અંતિમ પરિણામ તેમના instructions ના execution ક્રમ પર આધાર રાખે</b>, ત્યારે તે પરિસ્થિતિને <b>race condition</b> કહે છે.</p>\n<h4>ઉદાહરણ</h4>\n<p>Shared variable <code>counter = 5</code>. Process P1 (producer) <code>counter++</code> ચલાવે છે અને P2 (consumer) <code>counter--</code>. Machine language માં દરેક statement ત્રણ instructions છે:</p>\n<ul>\n<li><code>counter++</code>: reg1 = counter; reg1 = reg1 + 1; counter = reg1</li>\n<li><code>counter--</code>: reg2 = counter; reg2 = reg2 − 1; counter = reg2</li>\n</ul>\n<p>આ instructions આકૃતિ પ્રમાણે ભળી જાય તો અંતિમ કિંમત 4 (અથવા બીજા ક્રમમાં 6) આવે, પણ સાચી કિંમત <b>5</b> છે. ભૂલ એટલે થાય છે કે બંને processes એક જ સમયે <code>counter</code> બદલે છે.</p>\n<p><b>ઉકેલ:</b> એક સમયે <b>માત્ર એક process</b> shared variable બદલી શકે તેની ખાતરી કરવી: તેના માટે <b>process synchronization</b> (critical-section solutions, locks, semaphores) જોઈએ.</p>"}, "diagram": "os2_race"}, {"h": {"en": "2.4.2 Critical Section", "gu": "2.4.2 Critical Section"}, "body": {"en": "<p>A <b>critical section (CS)</b> is the segment of code in which a process accesses <b>shared resources</b> (common variables, tables, files). The <b>critical-section problem</b> is to design a protocol so that <b>no two processes execute in their critical sections at the same time</b>.</p>\n<h4>Structure of a process</h4>\n<ul>\n<li><b>Entry section:</b> code that requests permission to enter the CS.</li>\n<li><b>Critical section:</b> code that accesses shared data.</li>\n<li><b>Exit section:</b> code that announces leaving the CS.</li>\n<li><b>Remainder section:</b> the rest of the code.</li>\n</ul>\n<h4>Requirements of a solution</h4>\n<ol>\n<li><b>Mutual exclusion:</b> if a process is executing in its CS, no other process can execute in its CS.</li>\n<li><b>Progress:</b> if no process is in the CS and some processes want to enter, only those not in their remainder sections take part in deciding who enters next, and this decision cannot be postponed forever.</li>\n<li><b>Bounded waiting:</b> there is a limit on the number of times other processes may enter their CS after a process has requested entry and before that request is granted (no starvation).</li>\n</ol>\n<p>Also: no assumption may be made about the speed or number of CPUs.</p>", "gu": "<p><b>Critical section (CS)</b> એ code નો એવો ભાગ છે જેમાં process <b>shared resources</b> (સામાન્ય variables, tables, files) access કરે છે. <b>Critical-section problem</b> એટલે એવો protocol બનાવવો કે <b>કોઈ બે processes એક સાથે તેમના critical sections માં ન ચાલે</b>.</p>\n<h4>Process નું structure</h4>\n<ul>\n<li><b>Entry section:</b> CS માં પ્રવેશની પરવાનગી માંગતો code.</li>\n<li><b>Critical section:</b> shared data access કરતો code.</li>\n<li><b>Exit section:</b> CS છોડ્યાની જાહેરાત કરતો code.</li>\n<li><b>Remainder section:</b> બાકીનો code.</li>\n</ul>\n<h4>Solution ની જરૂરિયાતો</h4>\n<ol>\n<li><b>Mutual exclusion:</b> કોઈ process તેના CS માં ચાલતી હોય તો બીજી કોઈ process તેના CS માં ચાલી ન શકે.</li>\n<li><b>Progress:</b> કોઈ process CS માં ન હોય અને કેટલીક પ્રવેશવા માંગતી હોય, તો remainder section માં ન હોય તેવી processes જ આગળ કોણ પ્રવેશે તે નક્કી કરે, અને આ નિર્ણય અનિશ્ચિત સમય સુધી ટાળી ન શકાય.</li>\n<li><b>Bounded waiting:</b> process એ પ્રવેશ માંગ્યા પછી અને મંજૂરી મળે તે પહેલાં બીજી processes કેટલી વાર તેમના CS માં પ્રવેશી શકે તેની મર્યાદા હોય (starvation નહીં).</li>\n</ol>\n<p>વળી: CPUs ની ઝડપ કે સંખ્યા વિશે કોઈ ધારણા ન કરી શકાય.</p>"}, "diagram": "os2_cs"}, {"h": {"en": "2.4.3 Mutual Exclusion", "gu": "2.4.3 Mutual Exclusion"}, "body": {"en": "<p><b>Mutual exclusion</b> means that if one process is using a shared resource (variable, file, printer) inside its critical section, all other processes are <b>excluded</b> from doing the same thing at that time. It is the first and most important requirement for avoiding race conditions.</p>\n<h4>Methods for achieving mutual exclusion</h4>\n<ol>\n<li><b>Disabling interrupts:</b> a process disables interrupts on entering its CS, so no context switch can happen. Simple, but unsafe to give users this power and does not work on multiprocessors.</li>\n<li><b>Lock variable:</b> a shared variable lock = 0 (free) / 1 (busy). A process waits while lock is 1, then sets it to 1. It fails because two processes may read 0 at the same time.</li>\n<li><b>Strict alternation:</b> a variable <code>turn</code> decides whose turn it is. It gives mutual exclusion but violates progress.</li>\n<li><b>Peterson's solution</b> (two processes): uses <code>flag[2]</code> (who wants to enter) and <code>turn</code> (whose turn). It satisfies all three requirements.</li>\n<li><b>Hardware instructions:</b> atomic <b>TSL</b> (test-and-set lock) or <b>swap</b> instructions.</li>\n<li><b>Semaphores</b> (Dijkstra): an integer variable S accessed only through the atomic operations <b>wait(S)</b> (P) and <b>signal(S)</b> (V). A <b>binary semaphore</b> (0/1) is a <b>mutex lock</b>; a <b>counting semaphore</b> controls a resource with many instances.</li>\n</ol>\n<h4>Peterson's solution (process i; the other is j)</h4>\n<pre class=\"c\">do {\n    flag[i] = true;\n    turn = j;\n    while (flag[j] &amp;&amp; turn == j)\n        ;   /* busy wait */\n\n    /* critical section */\n\n    flag[i] = false;\n\n    /* remainder section */\n} while (true);</pre>\n<h4>Semaphore operations</h4>\n<pre class=\"c\">wait(S) {          /* P operation */\n    while (S &lt;= 0)\n        ;          /* busy wait */\n    S--;\n}\nsignal(S) {        /* V operation */\n    S++;\n}\n\n/* use: mutex = 1 */\nwait(mutex);\n    /* critical section */\nsignal(mutex);</pre>\n<p><b>Busy waiting</b> (spinning in a loop) wastes CPU time; practical semaphores block the waiting process in a queue and wake it up on signal().</p>", "gu": "<p><b>Mutual exclusion</b> એટલે કે જો એક process તેના critical section માં shared resource (variable, file, printer) વાપરતી હોય, તો બીજી બધી processes ને તે સમયે તે જ કામ કરતા <b>અટકાવવામાં</b> આવે. Race conditions ટાળવાની તે પહેલી અને સૌથી મહત્ત્વની જરૂરિયાત છે.</p>\n<h4>Mutual exclusion મેળવવાની પદ્ધતિઓ</h4>\n<ol>\n<li><b>Interrupts બંધ કરવા:</b> process CS માં પ્રવેશે ત્યારે interrupts બંધ કરે, તેથી context switch ન થઈ શકે. સરળ, પણ users ને આ સત્તા આપવી જોખમી અને multiprocessors પર કામ ન કરે.</li>\n<li><b>Lock variable:</b> shared variable lock = 0 (મુક્ત) / 1 (વ્યસ્ત). Process lock 1 હોય ત્યાં સુધી રાહ જુએ, પછી તેને 1 કરે. નિષ્ફળ જાય છે કારણ કે બે processes એક સાથે 0 વાંચી શકે.</li>\n<li><b>Strict alternation:</b> variable <code>turn</code> નક્કી કરે કે કોનો વારો છે. Mutual exclusion આપે પણ progress નો ભંગ કરે.</li>\n<li><b>Peterson's solution</b> (બે processes): <code>flag[2]</code> (કોણ પ્રવેશવા માંગે છે) અને <code>turn</code> (કોનો વારો) વાપરે. ત્રણેય જરૂરિયાતો સંતોષે.</li>\n<li><b>Hardware instructions:</b> atomic <b>TSL</b> (test-and-set lock) અથવા <b>swap</b> instructions.</li>\n<li><b>Semaphores</b> (Dijkstra): integer variable S જે માત્ર atomic operations <b>wait(S)</b> (P) અને <b>signal(S)</b> (V) વડે access થાય. <b>Binary semaphore</b> (0/1) એ <b>mutex lock</b> છે; <b>counting semaphore</b> ઘણા instances વાળા resource ને control કરે.</li>\n</ol>\n<h4>Peterson's solution (process i; બીજી j)</h4>\n<pre class=\"c\">do {\n    flag[i] = true;\n    turn = j;\n    while (flag[j] &amp;&amp; turn == j)\n        ;   /* busy wait */\n\n    /* critical section */\n\n    flag[i] = false;\n\n    /* remainder section */\n} while (true);</pre>\n<h4>Semaphore operations</h4>\n<pre class=\"c\">wait(S) {          /* P operation */\n    while (S &lt;= 0)\n        ;          /* busy wait */\n    S--;\n}\nsignal(S) {        /* V operation */\n    S++;\n}\n\n/* use: mutex = 1 */\nwait(mutex);\n    /* critical section */\nsignal(mutex);</pre>\n<p><b>Busy waiting</b> (loop માં ફરતા રહેવું) CPU time વેડફે છે; વ્યવહારુ semaphores રાહ જોતી process ને queue માં block કરે અને signal() પર જગાડે છે.</p>"}, "diagram": "os2_mutex"}]}, {"title": {"en": "2.5 Deadlock", "gu": "2.5 Deadlock"}, "items": [{"h": {"en": "2.5.1 Definition of Deadlock", "gu": "2.5.1 Deadlock ની વ્યાખ્યા"}, "body": {"en": "<p>A process uses a resource in the sequence: <b>request → use → release</b>. Resources can be physical (printer, scanner, memory, CPU) or logical (files, semaphores).</p>\n<p><b>Deadlock:</b> a set of processes is in a deadlock state when <b>every process in the set is waiting for an event (release of a resource) that can be caused only by another process in the set</b>. Since all of them are waiting, none of them ever runs, releases its resources or is woken up: they wait forever.</p>\n<h4>Example</h4>\n<p>P1 holds the printer (R1) and requests the scanner (R2); P2 holds the scanner (R2) and requests the printer (R1). Neither can continue.</p>\n<p><b>Real-life example:</b> four cars at a four-way crossing, each waiting for the car on its right to move; or two cars from opposite sides on a one-lane bridge.</p>\n<p><b>Deadlock vs starvation:</b> in deadlock, processes wait forever for each other (circular); in starvation, a process waits indefinitely because others keep getting the resource, but the system keeps running.</p>", "gu": "<p>Process resource ને આ ક્રમમાં વાપરે છે: <b>request → use → release</b>. Resources physical (printer, scanner, memory, CPU) અથવા logical (files, semaphores) હોઈ શકે.</p>\n<p><b>Deadlock:</b> processes નો સમૂહ deadlock state માં હોય છે જ્યારે <b>સમૂહની દરેક process એવી event (resource ના release) ની રાહ જુએ છે જે માત્ર સમૂહની બીજી process જ કરી શકે</b>. બધી રાહ જોતી હોવાથી કોઈ ક્યારેય ચાલતી નથી, resources છોડતી નથી કે જાગતી નથી: તેઓ કાયમ રાહ જુએ છે.</p>\n<h4>ઉદાહરણ</h4>\n<p>P1 પાસે printer (R1) છે અને તે scanner (R2) માંગે છે; P2 પાસે scanner (R2) છે અને તે printer (R1) માંગે છે. બંનેમાંથી કોઈ આગળ ન વધી શકે.</p>\n<p><b>રોજિંદું ઉદાહરણ:</b> ચાર રસ્તા પર ચાર cars, દરેક તેની જમણી બાજુની car ખસે તેની રાહ જુએ; અથવા એક-lane bridge પર સામસામેથી આવતી બે cars.</p>\n<p><b>Deadlock vs starvation:</b> deadlock માં processes એકબીજાની કાયમ રાહ જુએ (circular); starvation માં બીજાને resource મળતો રહેતો હોવાથી process અનિશ્ચિત રાહ જુએ, પણ system ચાલતી રહે.</p>"}, "diagram": "os2_deadlock"}, {"h": {"en": "2.5.2 Necessary Conditions for Deadlock", "gu": "2.5.2 Deadlock માટેની જરૂરી શરતો"}, "body": {"en": "<p>A deadlock can arise only if <b>all four</b> of the following conditions hold <b>at the same time</b> (Coffman conditions):</p>\n<ol>\n<li><b>Mutual exclusion:</b> at least one resource must be held in a non-sharable mode: only one process can use it at a time (e.g. a printer).</li>\n<li><b>Hold and wait:</b> a process is holding at least one resource and waiting to get additional resources held by other processes.</li>\n<li><b>No preemption:</b> a resource cannot be taken away forcibly; it is released only voluntarily by the process holding it, after finishing its task.</li>\n<li><b>Circular wait:</b> a set {P0, P1, …, Pn} of waiting processes exists such that P0 waits for a resource held by P1, P1 waits for P2, …, and Pn waits for P0.</li>\n</ol>\n<p>If any <b>one</b> of these conditions is prevented, deadlock cannot occur. This idea is the basis of <b>deadlock prevention</b>.</p>", "gu": "<p>Deadlock ત્યારે જ થઈ શકે જ્યારે નીચેની <b>ચારેય</b> શરતો <b>એક સાથે</b> સાચી હોય (Coffman conditions):</p>\n<ol>\n<li><b>Mutual exclusion:</b> ઓછામાં ઓછો એક resource non-sharable mode માં હોવો જોઈએ: એક સમયે માત્ર એક process તેને વાપરી શકે (દા.ત. printer).</li>\n<li><b>Hold and wait:</b> process ઓછામાં ઓછો એક resource પકડી રાખે છે અને બીજી processes પાસેના વધારાના resources મેળવવા રાહ જુએ છે.</li>\n<li><b>No preemption:</b> resource બળજબરીથી લઈ શકાતો નથી; તેને પકડનાર process કામ પૂરું કર્યા પછી જાતે જ છોડે.</li>\n<li><b>Circular wait:</b> રાહ જોતી processes નો સમૂહ {P0, P1, …, Pn} એવો હોય કે P0 એ P1 પાસેના resource ની રાહ જુએ, P1 એ P2 ની, …, અને Pn એ P0 ની.</li>\n</ol>\n<p>આમાંથી કોઈ <b>એક</b> શરત અટકાવી દેવાય તો deadlock થઈ શકે નહીં. આ વિચાર <b>deadlock prevention</b> નો આધાર છે.</p>"}}, {"h": {"en": "2.5.3 Resource Allocation Graph (RAG)", "gu": "2.5.3 Resource Allocation Graph (RAG)"}, "body": {"en": "<p>Deadlocks can be described precisely by a directed graph called the <b>resource allocation graph</b>. It has a set of vertices V and edges E.</p>\n<h4>Vertices</h4>\n<ul>\n<li><b>Process nodes</b> P = {P1, P2, …}: drawn as <b>circles</b>.</li>\n<li><b>Resource nodes</b> R = {R1, R2, …}: drawn as <b>rectangles</b>; each <b>dot</b> inside is one instance of the resource.</li>\n</ul>\n<h4>Edges</h4>\n<ul>\n<li><b>Request edge</b> Pi → Rj: process Pi has requested an instance of Rj and is waiting.</li>\n<li><b>Assignment edge</b> Rj → Pi: an instance of Rj has been allocated to Pi (drawn from a dot).</li>\n</ul>\n<p>When a request is granted, the request edge is changed into an assignment edge; when the process releases the resource, the edge is deleted.</p>\n<h4>Detecting deadlock from a RAG</h4>\n<ol>\n<li>If the graph has <b>no cycle</b> → <b>no deadlock</b>.</li>\n<li>If there is a cycle and <b>each resource has only one instance</b> → <b>deadlock</b> (cycle is necessary and sufficient).</li>\n<li>If there is a cycle and resources have <b>several instances</b> → deadlock <b>may or may not</b> exist (cycle is necessary but not sufficient). In figure (b), P4 can finish and release R2, so P3 gets it and the cycle breaks.</li>\n</ol>", "gu": "<p>Deadlocks ને <b>resource allocation graph</b> નામના directed graph વડે ચોક્કસ રીતે દર્શાવી શકાય. તેમાં vertices V અને edges E હોય છે.</p>\n<h4>Vertices</h4>\n<ul>\n<li><b>Process nodes</b> P = {P1, P2, …}: <b>વર્તુળ</b> તરીકે દોરાય.</li>\n<li><b>Resource nodes</b> R = {R1, R2, …}: <b>લંબચોરસ</b> તરીકે; અંદરનું દરેક <b>ટપકું</b> resource નું એક instance છે.</li>\n</ul>\n<h4>Edges</h4>\n<ul>\n<li><b>Request edge</b> Pi → Rj: process Pi એ Rj નું instance માંગ્યું છે અને રાહ જુએ છે.</li>\n<li><b>Assignment edge</b> Rj → Pi: Rj નું એક instance Pi ને ફાળવાયું છે (ટપકામાંથી દોરાય).</li>\n</ul>\n<p>Request મંજૂર થાય ત્યારે request edge assignment edge માં બદલાય; process resource છોડે ત્યારે edge દૂર થાય.</p>\n<h4>RAG પરથી deadlock શોધવું</h4>\n<ol>\n<li>Graph માં <b>cycle નથી</b> → <b>deadlock નથી</b>.</li>\n<li>Cycle છે અને <b>દરેક resource નું માત્ર એક instance</b> છે → <b>deadlock</b> (cycle જરૂરી અને પૂરતી).</li>\n<li>Cycle છે અને resources ના <b>ઘણા instances</b> છે → deadlock <b>હોઈ શકે કે ન પણ હોય</b> (cycle જરૂરી પણ પૂરતી નહીં). આકૃતિ (b) માં P4 પૂરી થઈ R2 છોડી શકે, તેથી P3 ને તે મળે અને cycle તૂટે.</li>\n</ol>"}, "diagram": "os2_rag"}, {"h": {"en": "2.5.4 Dealing with Deadlock; Ignorance of Deadlock", "gu": "2.5.4 Deadlock સંભાળવું; Deadlock ની અવગણના"}, "body": {"en": "<p>There are four ways of dealing with deadlock:</p>\n<ol>\n<li><b>Ignore the problem</b> (ostrich algorithm): pretend deadlocks never occur.</li>\n<li><b>Detection and recovery:</b> let deadlocks occur, detect them, and take action to recover.</li>\n<li><b>Dynamic avoidance:</b> carefully allocate resources so that the system never enters an unsafe state (Banker's algorithm).</li>\n<li><b>Prevention:</b> structurally make one of the four necessary conditions impossible.</li>\n</ol>\n<h4>Ignorance of deadlock (ostrich algorithm)</h4>\n<p>Like an ostrich that \"sticks its head in the sand\", the OS simply <b>ignores</b> the problem. This is used when:</p>\n<ul>\n<li>deadlocks occur very rarely (e.g. once in years), and</li>\n<li>the cost of prevention, avoidance or detection (performance loss, restrictions) is higher than the cost of an occasional deadlock.</li>\n</ul>\n<p>If a deadlock does happen, the user or administrator <b>restarts</b> the stuck program or the system. <b>Most general-purpose OSs, including Unix, Linux and Windows, use this approach</b>, leaving it to application developers to write deadlock-free programs.</p>\n<p>Disadvantage: when a deadlock happens, work may be lost and the system's performance degrades until a manual restart.</p>", "gu": "<p>Deadlock સંભાળવાની ચાર રીતો છે:</p>\n<ol>\n<li><b>સમસ્યાની અવગણના</b> (ostrich algorithm): deadlocks થતા જ નથી એમ માનવું.</li>\n<li><b>Detection and recovery:</b> deadlocks થવા દેવા, તેમને શોધવા, અને recover થવા પગલાં લેવા.</li>\n<li><b>Dynamic avoidance:</b> resources એવી કાળજીથી ફાળવવા કે system ક્યારેય unsafe state માં ન જાય (Banker's algorithm).</li>\n<li><b>Prevention:</b> ચાર જરૂરી શરતોમાંથી એકને structurally અશક્ય બનાવવી.</li>\n</ol>\n<h4>Deadlock ની અવગણના (ostrich algorithm)</h4>\n<p>\"રેતીમાં માથું છુપાવતા\" શાહમૃગની જેમ OS સમસ્યાની <b>અવગણના</b> કરે છે. આ ત્યારે વપરાય જ્યારે:</p>\n<ul>\n<li>deadlocks ખૂબ ભાગ્યે જ થાય (દા.ત. વર્ષોમાં એક વાર), અને</li>\n<li>prevention, avoidance કે detection નો ખર્ચ (performance ઘટાડો, પ્રતિબંધો) ક્યારેક થતા deadlock ના ખર્ચ કરતાં વધુ હોય.</li>\n</ul>\n<p>Deadlock થાય તો user કે administrator અટકેલા program કે system ને <b>restart</b> કરે. <b>Unix, Linux અને Windows સહિત મોટા ભાગની general-purpose OS આ રીત વાપરે છે</b>, અને deadlock-free programs લખવાનું application developers પર છોડે છે.</p>\n<p>ગેરફાયદો: deadlock થાય ત્યારે કામ ગુમાવાઈ શકે અને manual restart સુધી system નું performance ઘટે.</p>"}}, {"h": {"en": "2.5.5 Deadlock Prevention", "gu": "2.5.5 Deadlock Prevention"}, "body": {"en": "<p><b>Deadlock prevention</b> ensures that <b>at least one of the four necessary conditions can never hold</b>. It restricts how processes can request resources.</p>\n<table><tr><th>Condition</th><th>How to prevent it</th><th>Drawback</th></tr><tr><td>Mutual exclusion</td><td>Make resources sharable (e.g. read-only files, spooling for printer)</td><td>Not possible for printers, tapes etc.</td></tr><tr><td>Hold and wait</td><td>Request all resources before starting, or request only when holding none</td><td>Low resource use; starvation</td></tr><tr><td>No preemption</td><td>If a request cannot be granted, release (pre-empt) all held resources</td><td>Only for resources whose state can be saved (CPU, memory)</td></tr><tr><td>Circular wait</td><td>Number all resource types; request them only in increasing order</td><td>Ordering is inconvenient for programmers</td></tr></table>\n<h4>Circular-wait example</h4>\n<p>Give numbers: tape drive = 1, disk drive = 5, printer = 12. A process holding the disk drive (5) may request the printer (12) but not the tape drive (1). Because every process requests resources in increasing order, a cycle can never form.</p>\n<p><b>Disadvantages of prevention:</b> low device utilisation and reduced system throughput.</p>", "gu": "<p><b>Deadlock prevention</b> એ ખાતરી કરે છે કે <b>ચાર જરૂરી શરતોમાંથી ઓછામાં ઓછી એક ક્યારેય સાચી ન બને</b>. તે processes resources કેવી રીતે માંગી શકે તેના પર પ્રતિબંધ મૂકે છે.</p>\n<table><tr><th>શરત</th><th>કેવી રીતે અટકાવવી</th><th>ખામી</th></tr><tr><td>Mutual exclusion</td><td>Resources ને sharable બનાવો (દા.ત. read-only files, printer માટે spooling)</td><td>Printers, tapes વગેરે માટે શક્ય નથી</td></tr><tr><td>Hold and wait</td><td>શરૂઆત પહેલાં બધા resources માંગો, અથવા કંઈ ન પકડ્યું હોય ત્યારે જ માંગો</td><td>Resources નો ઓછો ઉપયોગ; starvation</td></tr><tr><td>No preemption</td><td>Request મંજૂર ન થાય તો પકડેલા બધા resources છોડી દો (pre-empt)</td><td>માત્ર જેમની state save થઈ શકે તેવા resources (CPU, memory)</td></tr><tr><td>Circular wait</td><td>બધા resource types ને નંબર આપો; માત્ર વધતા ક્રમમાં માંગો</td><td>Programmers માટે ક્રમ અગવડભર્યો</td></tr></table>\n<h4>Circular-wait ઉદાહરણ</h4>\n<p>નંબર આપો: tape drive = 1, disk drive = 5, printer = 12. Disk drive (5) પકડતી process printer (12) માંગી શકે પણ tape drive (1) નહીં. દરેક process વધતા ક્રમમાં resources માંગે છે, તેથી cycle ક્યારેય બની શકતી નથી.</p>\n<p><b>Prevention ના ગેરફાયદા:</b> devices નો ઓછો ઉપયોગ અને system throughput ઘટે.</p>"}}, {"h": {"en": "2.5.6 Deadlock Avoidance: Safe State and Banker's Algorithm", "gu": "2.5.6 Deadlock Avoidance: Safe State અને Banker's Algorithm"}, "body": {"en": "<p><b>Dynamic avoidance</b> requires each process to declare in advance the <b>maximum number</b> of resources of each type it may need. Before granting a request, the OS checks whether the resulting state is <b>safe</b>; if not, the process must wait even if the resources are free.</p>\n<h4>Safe state</h4>\n<p>A state is <b>safe</b> if there exists a <b>safe sequence</b> &lt;P1, P2, …, Pn&gt; in which each process can get its remaining needs from the currently available resources plus the resources held by all earlier processes, and then finish. A safe state has no deadlock. An <b>unsafe</b> state <b>may</b> lead to deadlock; avoidance never enters it.</p>\n<h4>Banker's algorithm (Dijkstra)</h4>\n<p>Named because a bank never lends money in such a way that it cannot satisfy all its customers. Data structures for n processes and m resource types:</p>\n<ul>\n<li><b>Available[m]:</b> free instances of each resource.</li>\n<li><b>Max[n][m]:</b> maximum demand of each process.</li>\n<li><b>Allocation[n][m]:</b> instances currently allocated.</li>\n<li><b>Need[n][m] = Max − Allocation:</b> remaining need.</li>\n</ul>\n<h4>Safety algorithm</h4>\n<ol>\n<li>Work = Available; Finish[i] = false for all i.</li>\n<li>Find i with Finish[i] = false and Need<sub>i</sub> ≤ Work. If none, go to step 4.</li>\n<li>Work = Work + Allocation<sub>i</sub>; Finish[i] = true; go to step 2.</li>\n<li>If Finish[i] is true for all i, the state is safe.</li>\n</ol>\n<h4>Resource-request algorithm</h4>\n<ol>\n<li>If Request<sub>i</sub> &gt; Need<sub>i</sub> → error (exceeds maximum claim).</li>\n<li>If Request<sub>i</sub> &gt; Available → Pi must wait.</li>\n<li>Pretend to allocate: Available −= Request; Allocation<sub>i</sub> += Request; Need<sub>i</sub> −= Request. Run the safety algorithm: safe → grant; unsafe → restore the old state and Pi waits.</li>\n</ol>\n<p><b>Limitations:</b> maximum needs must be known in advance; the number of processes and resources must be fixed; processes may wait even when resources are free.</p>", "gu": "<p><b>Dynamic avoidance</b> માં દરેક process એ અગાઉથી દરેક પ્રકારના resource ની <b>મહત્તમ સંખ્યા</b> જાહેર કરવી પડે. Request મંજૂર કરતા પહેલાં OS તપાસે છે કે પરિણામી state <b>safe</b> છે કે નહીં; ન હોય તો resources મુક્ત હોય તો પણ process એ રાહ જોવી પડે.</p>\n<h4>Safe state</h4>\n<p>State <b>safe</b> છે જો એવો <b>safe sequence</b> &lt;P1, P2, …, Pn&gt; હોય જેમાં દરેક process હાલના available resources અને અગાઉની બધી processes ના resources વડે તેની બાકીની જરૂરિયાત મેળવી પૂરી થઈ શકે. Safe state માં deadlock નથી. <b>Unsafe</b> state deadlock તરફ લઈ જઈ <b>શકે</b>; avoidance તેમાં ક્યારેય જતું નથી.</p>\n<h4>Banker's algorithm (Dijkstra)</h4>\n<p>નામ એટલે કે bank ક્યારેય એવી રીતે પૈસા ઉછીના નથી આપતી કે તે બધા ગ્રાહકોને સંતોષી ન શકે. n processes અને m resource types માટે data structures:</p>\n<ul>\n<li><b>Available[m]:</b> દરેક resource ના મુક્ત instances.</li>\n<li><b>Max[n][m]:</b> દરેક process ની મહત્તમ માંગ.</li>\n<li><b>Allocation[n][m]:</b> હાલ ફાળવેલા instances.</li>\n<li><b>Need[n][m] = Max − Allocation:</b> બાકી જરૂરિયાત.</li>\n</ul>\n<h4>Safety algorithm</h4>\n<ol>\n<li>Work = Available; બધા i માટે Finish[i] = false.</li>\n<li>Finish[i] = false અને Need<sub>i</sub> ≤ Work હોય તેવો i શોધો. ન મળે તો પગલું 4.</li>\n<li>Work = Work + Allocation<sub>i</sub>; Finish[i] = true; પગલું 2 પર જાઓ.</li>\n<li>બધા i માટે Finish[i] true હોય તો state safe છે.</li>\n</ol>\n<h4>Resource-request algorithm</h4>\n<ol>\n<li>Request<sub>i</sub> &gt; Need<sub>i</sub> હોય → error (maximum claim થી વધુ).</li>\n<li>Request<sub>i</sub> &gt; Available હોય → Pi એ રાહ જોવી પડે.</li>\n<li>Allocate કર્યું હોય તેમ માનો: Available −= Request; Allocation<sub>i</sub> += Request; Need<sub>i</sub> −= Request. Safety algorithm ચલાવો: safe → મંજૂર; unsafe → જૂની state પાછી લાવો અને Pi રાહ જુએ.</li>\n</ol>\n<p><b>મર્યાદાઓ:</b> મહત્તમ જરૂરિયાત અગાઉથી જાણવી પડે; processes અને resources ની સંખ્યા નિશ્ચિત હોવી જોઈએ; resources મુક્ત હોય તો પણ processes ને રાહ જોવી પડી શકે.</p>"}, "diagram": "os2_safe", "examples": ["os2n12", "os2n13"]}, {"h": {"en": "2.5.7 Deadlock Detection and Recovery", "gu": "2.5.7 Deadlock Detection and Recovery"}, "body": {"en": "<p>Here the system <b>allows deadlocks to occur</b>, periodically runs a <b>detection algorithm</b>, and then <b>recovers</b>.</p>\n<h4>Detection</h4>\n<ul>\n<li><b>Single instance of each resource:</b> build a <b>wait-for graph</b> from the RAG by removing resource nodes and joining the edges: Pi → Pj means Pi waits for a resource held by Pj. A <b>cycle</b> in the wait-for graph means deadlock.</li>\n<li><b>Several instances:</b> use a Banker-like algorithm with Available, Allocation and <b>Request</b> matrices. Work = Available; a process whose Request ≤ Work is assumed to finish and release its allocation. Processes that can never finish are <b>deadlocked</b>.</li>\n<li><b>When to run it?</b> On every request that cannot be granted (costly), at fixed intervals (e.g. once per hour), or when CPU utilisation drops below e.g. 40%.</li>\n</ul>\n<h4>Recovery</h4>\n<ol>\n<li><b>Process termination:</b>\n<ul><li>abort <b>all</b> deadlocked processes (sure but costly: all partial work is lost), or</li>\n<li>abort <b>one process at a time</b> until the cycle disappears (choose the victim by priority, time used, resources held, etc.).</li></ul></li>\n<li><b>Resource preemption:</b> take resources away from some processes and give them to others:\n<ul><li><b>Selecting a victim:</b> minimum cost.</li><li><b>Rollback:</b> return the victim to a safe earlier state (checkpoint) and restart it from there.</li><li><b>Starvation:</b> make sure the same process is not always the victim (include the number of rollbacks in the cost).</li></ul></li>\n</ol>", "gu": "<p>અહીં system <b>deadlocks થવા દે છે</b>, સમયાંતરે <b>detection algorithm</b> ચલાવે છે, અને પછી <b>recover</b> થાય છે.</p>\n<h4>Detection</h4>\n<ul>\n<li><b>દરેક resource નું એક instance:</b> RAG માંથી resource nodes દૂર કરી edges જોડી <b>wait-for graph</b> બનાવો: Pi → Pj એટલે Pi એ Pj પાસેના resource ની રાહ જુએ છે. Wait-for graph માં <b>cycle</b> એટલે deadlock.</li>\n<li><b>ઘણા instances:</b> Available, Allocation અને <b>Request</b> matrices સાથે Banker જેવો algorithm વાપરો. Work = Available; Request ≤ Work હોય તેવી process પૂરી થઈ તેનું allocation છોડે એમ માનો. ક્યારેય પૂરી ન થઈ શકે તેવી processes <b>deadlocked</b> છે.</li>\n<li><b>ક્યારે ચલાવવો?</b> મંજૂર ન થઈ શકે તેવી દરેક request પર (મોંઘું), નિયમિત અંતરે (દા.ત. કલાકમાં એક વાર), અથવા CPU utilisation દા.ત. 40% થી નીચે જાય ત્યારે.</li>\n</ul>\n<h4>Recovery</h4>\n<ol>\n<li><b>Process termination:</b>\n<ul><li><b>બધી</b> deadlocked processes abort કરવી (ચોક્કસ પણ મોંઘું: બધું અધૂરું કામ ગુમાવાય), અથવા</li>\n<li>cycle દૂર થાય ત્યાં સુધી <b>એક સમયે એક process</b> abort કરવી (priority, વપરાયેલો સમય, પકડેલા resources વગેરે પરથી victim પસંદ કરો).</li></ul></li>\n<li><b>Resource preemption:</b> કેટલીક processes પાસેથી resources લઈ બીજાને આપવા:\n<ul><li><b>Victim પસંદગી:</b> ઓછામાં ઓછો ખર્ચ.</li><li><b>Rollback:</b> victim ને અગાઉની safe state (checkpoint) પર પાછી લાવી ત્યાંથી restart કરવી.</li><li><b>Starvation:</b> એ જ process હંમેશા victim ન બને તેની કાળજી (ખર્ચમાં rollbacks ની સંખ્યા ગણો).</li></ul></li>\n</ol>"}, "diagram": "os2_waitfor", "examples": ["os2n14"]}]}], "numericals": [{"id": "os2n1", "q": {"en": "(Practical 2a) FCFS: Arrival times 0, 1, 2, 3 and burst times 5, 3, 8, 6 for P0, P1, P2, P3. Draw the Gantt chart and find the average turnaround time and average waiting time.", "gu": "(Practical 2a) FCFS: P0, P1, P2, P3 માટે arrival time 0, 1, 2, 3 અને burst time 5, 3, 8, 6. Gantt chart દોરો અને સરેરાશ turnaround time અને સરેરાશ waiting time શોધો."}, "a": {"en": "<p><b>Given:</b></p><table><tr><th>Process</th><th>Arrival time</th><th>Burst time</th></tr><tr><td>P0</td><td>0</td><td>5</td></tr><tr><td>P1</td><td>1</td><td>3</td></tr><tr><td>P2</td><td>2</td><td>8</td></tr><tr><td>P3</td><td>3</td><td>6</td></tr></table><p><b>Rule:</b> the CPU is given to processes in the order of their <b>arrival</b>; a running process is never pre-empted.</p><p><b>Gantt chart:</b></p><table><tr><td><b>P0</b></td><td><b>P1</b></td><td><b>P2</b></td><td><b>P3</b></td></tr><tr><td>0–5</td><td>5–8</td><td>8–16</td><td>16–22</td></tr></table><p>P0 arrives first (0) and runs 0–5; then P1, P2 and P3 in order of arrival.</p><table><tr><th>Process</th><th>AT</th><th>BT</th><th>CT</th><th>TAT = CT − AT</th><th>WT = TAT − BT</th></tr><tr><td>P0</td><td>0</td><td>5</td><td>5</td><td>5 − 0 = 5</td><td>5 − 5 = 0</td></tr><tr><td>P1</td><td>1</td><td>3</td><td>8</td><td>8 − 1 = 7</td><td>7 − 3 = 4</td></tr><tr><td>P2</td><td>2</td><td>8</td><td>16</td><td>16 − 2 = 14</td><td>14 − 8 = 6</td></tr><tr><td>P3</td><td>3</td><td>6</td><td>22</td><td>22 − 3 = 19</td><td>19 − 6 = 13</td></tr></table><p><b>Average TAT</b> = (5 + 7 + 14 + 19) / 4 = 45/4 = <b>11.25</b> units</p><p><b>Average WT</b> = (0 + 4 + 6 + 13) / 4 = 23/4 = <b>5.75</b> units</p>", "gu": "<p><b>આપેલ:</b></p><table><tr><th>Process</th><th>Arrival time</th><th>Burst time</th></tr><tr><td>P0</td><td>0</td><td>5</td></tr><tr><td>P1</td><td>1</td><td>3</td></tr><tr><td>P2</td><td>2</td><td>8</td></tr><tr><td>P3</td><td>3</td><td>6</td></tr></table><p><b>નિયમ:</b> CPU processes ને તેમના <b>arrival</b> ના ક્રમમાં મળે છે; ચાલતી process ને ક્યારેય pre-empt કરાતી નથી.</p><p><b>Gantt chart:</b></p><table><tr><td><b>P0</b></td><td><b>P1</b></td><td><b>P2</b></td><td><b>P3</b></td></tr><tr><td>0–5</td><td>5–8</td><td>8–16</td><td>16–22</td></tr></table><p>P0 પહેલી (0) આવે અને 0–5 ચાલે; પછી arrival ક્રમમાં P1, P2 અને P3.</p><table><tr><th>Process</th><th>AT</th><th>BT</th><th>CT</th><th>TAT = CT − AT</th><th>WT = TAT − BT</th></tr><tr><td>P0</td><td>0</td><td>5</td><td>5</td><td>5 − 0 = 5</td><td>5 − 5 = 0</td></tr><tr><td>P1</td><td>1</td><td>3</td><td>8</td><td>8 − 1 = 7</td><td>7 − 3 = 4</td></tr><tr><td>P2</td><td>2</td><td>8</td><td>16</td><td>16 − 2 = 14</td><td>14 − 8 = 6</td></tr><tr><td>P3</td><td>3</td><td>6</td><td>22</td><td>22 − 3 = 19</td><td>19 − 6 = 13</td></tr></table><p><b>સરેરાશ TAT</b> = (5 + 7 + 14 + 19) / 4 = 45/4 = <b>11.25</b> units</p><p><b>સરેરાશ WT</b> = (0 + 4 + 6 + 13) / 4 = 23/4 = <b>5.75</b> units</p>"}}, {"id": "os2n2", "q": {"en": "(Practical 2a) SJF (non-preemptive): Arrival times 0, 1, 2, 3 and burst times 5, 3, 8, 6 for P0, P1, P2, P3. Draw the Gantt chart and find the average turnaround time and average waiting time.", "gu": "(Practical 2a) SJF (non-preemptive): P0, P1, P2, P3 માટે arrival time 0, 1, 2, 3 અને burst time 5, 3, 8, 6. Gantt chart દોરો અને સરેરાશ turnaround time અને સરેરાશ waiting time શોધો."}, "a": {"en": "<p><b>Given:</b></p><table><tr><th>Process</th><th>Arrival time</th><th>Burst time</th></tr><tr><td>P0</td><td>0</td><td>5</td></tr><tr><td>P1</td><td>1</td><td>3</td></tr><tr><td>P2</td><td>2</td><td>8</td></tr><tr><td>P3</td><td>3</td><td>6</td></tr></table><p><b>Rule:</b> whenever the CPU becomes free, choose the <b>arrived</b> process with the <b>smallest burst time</b> (tie → FCFS). Non-preemptive: it runs to completion.</p><p><b>Gantt chart:</b></p><table><tr><td><b>P0</b></td><td><b>P1</b></td><td><b>P3</b></td><td><b>P2</b></td></tr><tr><td>0–5</td><td>5–8</td><td>8–14</td><td>14–22</td></tr></table><p>At 0 only P0 is present → P0 runs 0–5. At 5, P1 (3), P2 (8), P3 (6) are waiting → shortest P1 (5–8), then P3 (8–14), then P2 (14–22).</p><table><tr><th>Process</th><th>AT</th><th>BT</th><th>CT</th><th>TAT = CT − AT</th><th>WT = TAT − BT</th></tr><tr><td>P0</td><td>0</td><td>5</td><td>5</td><td>5 − 0 = 5</td><td>5 − 5 = 0</td></tr><tr><td>P1</td><td>1</td><td>3</td><td>8</td><td>8 − 1 = 7</td><td>7 − 3 = 4</td></tr><tr><td>P2</td><td>2</td><td>8</td><td>22</td><td>22 − 2 = 20</td><td>20 − 8 = 12</td></tr><tr><td>P3</td><td>3</td><td>6</td><td>14</td><td>14 − 3 = 11</td><td>11 − 6 = 5</td></tr></table><p><b>Average TAT</b> = (5 + 7 + 20 + 11) / 4 = 43/4 = <b>10.75</b> units</p><p><b>Average WT</b> = (0 + 4 + 12 + 5) / 4 = 21/4 = <b>5.25</b> units</p>", "gu": "<p><b>આપેલ:</b></p><table><tr><th>Process</th><th>Arrival time</th><th>Burst time</th></tr><tr><td>P0</td><td>0</td><td>5</td></tr><tr><td>P1</td><td>1</td><td>3</td></tr><tr><td>P2</td><td>2</td><td>8</td></tr><tr><td>P3</td><td>3</td><td>6</td></tr></table><p><b>નિયમ:</b> CPU મુક્ત થાય ત્યારે આવી ગયેલી processes માંથી <b>સૌથી નાના burst time</b> વાળી પસંદ કરો (સરખા હોય તો FCFS). Non-preemptive: તે પૂરી થાય ત્યાં સુધી ચાલે.</p><p><b>Gantt chart:</b></p><table><tr><td><b>P0</b></td><td><b>P1</b></td><td><b>P3</b></td><td><b>P2</b></td></tr><tr><td>0–5</td><td>5–8</td><td>8–14</td><td>14–22</td></tr></table><p>0 પર માત્ર P0 હાજર → P0 0–5 ચાલે. 5 પર P1 (3), P2 (8), P3 (6) રાહ જુએ છે → સૌથી નાનો P1 (5–8), પછી P3 (8–14), પછી P2 (14–22).</p><table><tr><th>Process</th><th>AT</th><th>BT</th><th>CT</th><th>TAT = CT − AT</th><th>WT = TAT − BT</th></tr><tr><td>P0</td><td>0</td><td>5</td><td>5</td><td>5 − 0 = 5</td><td>5 − 5 = 0</td></tr><tr><td>P1</td><td>1</td><td>3</td><td>8</td><td>8 − 1 = 7</td><td>7 − 3 = 4</td></tr><tr><td>P2</td><td>2</td><td>8</td><td>22</td><td>22 − 2 = 20</td><td>20 − 8 = 12</td></tr><tr><td>P3</td><td>3</td><td>6</td><td>14</td><td>14 − 3 = 11</td><td>11 − 6 = 5</td></tr></table><p><b>સરેરાશ TAT</b> = (5 + 7 + 20 + 11) / 4 = 43/4 = <b>10.75</b> units</p><p><b>સરેરાશ WT</b> = (0 + 4 + 12 + 5) / 4 = 21/4 = <b>5.25</b> units</p>"}}, {"id": "os2n3", "q": {"en": "(Practical 2a) Round Robin with time quantum 2: Arrival times 0, 1, 2, 3 and burst times 5, 3, 8, 6 for P0, P1, P2, P3. Draw the Gantt chart and find the average turnaround time and average waiting time.", "gu": "(Practical 2a) Time quantum 2 સાથે Round Robin: P0, P1, P2, P3 માટે arrival time 0, 1, 2, 3 અને burst time 5, 3, 8, 6. Gantt chart દોરો અને સરેરાશ turnaround time અને સરેરાશ waiting time શોધો."}, "a": {"en": "<p><b>Given:</b></p><table><tr><th>Process</th><th>Arrival time</th><th>Burst time</th></tr><tr><td>P0</td><td>0</td><td>5</td></tr><tr><td>P1</td><td>1</td><td>3</td></tr><tr><td>P2</td><td>2</td><td>8</td></tr><tr><td>P3</td><td>3</td><td>6</td></tr></table><p><b>Rule:</b> each process runs for at most one <b>time quantum</b>, then goes to the tail of the ready queue. Convention used: a process arriving at the same moment a quantum expires enters the queue <b>before</b> the pre-empted process.</p><p><b>Ready-queue trace (q = 2):</b></p><table><tr><th>Time</th><th>Runs</th><th>Remaining</th><th>Ready queue after</th></tr><tr><td>0–2</td><td>P0</td><td>3</td><td>P1, P2, P0</td></tr><tr><td>2–4</td><td>P1</td><td>1</td><td>P2, P0, P3, P1</td></tr><tr><td>4–6</td><td>P2</td><td>6</td><td>P0, P3, P1, P2</td></tr><tr><td>6–8</td><td>P0</td><td>1</td><td>P3, P1, P2, P0</td></tr><tr><td>8–10</td><td>P3</td><td>4</td><td>P1, P2, P0, P3</td></tr><tr><td>10–11</td><td>P1</td><td>0</td><td>P2, P0, P3</td></tr><tr><td>11–13</td><td>P2</td><td>4</td><td>P0, P3, P2</td></tr><tr><td>13–14</td><td>P0</td><td>0</td><td>P3, P2</td></tr><tr><td>14–16</td><td>P3</td><td>2</td><td>P2, P3</td></tr><tr><td>1
