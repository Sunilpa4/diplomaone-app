<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-label="Balanced ±500 kV bipole: pole-to-pole voltage matters"><rect width="960" height="430" fill="#fff"/><text x="30" y="38" font-size="23" fill="#352544" text-anchor="start">Balanced ±500 kV bipole: pole-to-pole voltage matters</text><path d="M100 140 L850 140" fill="none" stroke="#d65757" stroke-width="5"/><path d="M100 290 L850 290" fill="none" stroke="#5072bb" stroke-width="5"/><text x="100" y="110" font-size="17" fill="#352544" text-anchor="start">+500 kV pole → 1 kA</text><text x="100" y="330" font-size="17" fill="#352544" text-anchor="start">−500 kV pole ← 1 kA</text><rect x="60" y="175" width="170" height="75" rx="8" fill="#f3edf9" stroke="#9d7ab9" stroke-width="2"/><text x="80" y="219" font-size="17" fill="#352544" text-anchor="start">Terminal A</text><rect x="730" y="175" width="170" height="75" rx="8" fill="#f3edf9" stroke="#9d7ab9" stroke-width="2"/><text x="750" y="219" font-size="17" fill="#352544" text-anchor="start">Terminal B</text><path d="M470 150 L470 280" fill="none" stroke="#7040a0" stroke-width="3"/><text x="490" y="220" font-size="20" fill="#352544" text-anchor="start">Vpp = 1000 kV</text><text x="300" y="367" font-size="17" fill="#352544" text-anchor="start">P = 1000 kV × 1 kA = 1000 MW (ideal)</text><text x="30" y="410" font-size="14" fill="#75647f" text-anchor="start">Conceptual teaching diagram • not a switching order / construction design</text></svg>