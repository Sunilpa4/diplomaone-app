<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-label="PLCC: series trap and safely coupled carrier terminal"><rect width="960" height="410" fill="#fff"/><text x="30" y="38" font-size="23" fill="#352544" text-anchor="start">PLCC: series trap and safely coupled carrier terminal</text><path d="M80 130 L880 130" fill="none" stroke="#7040a0" stroke-width="3"/><rect x="265" y="108" width="110" height="44" rx="8" fill="#f3edf9" stroke="#9d7ab9" stroke-width="2"/><text x="280" y="137" font-size="16" fill="#352544" text-anchor="start">Line trap</text><text x="80" y="95" font-size="17" fill="#352544" text-anchor="start">Power line → low Z at 50 Hz; trap high Z in chosen carrier band</text><path d="M540 130 L540 205" fill="none" stroke="#7040a0" stroke-width="3"/><path d="M510 205 L570 205" fill="none" stroke="#7040a0" stroke-width="3"/><path d="M510 220 L570 220" fill="none" stroke="#7040a0" stroke-width="3"/><path d="M540 220 L540 275" fill="none" stroke="#7040a0" stroke-width="3"/><rect x="460" y="275" width="160" height="60" rx="8" fill="#f3edf9" stroke="#9d7ab9" stroke-width="2"/><text x="480" y="312" font-size="17" fill="#352544" text-anchor="start">LMU / protection</text><path d="M620 305 L680 305" fill="none" stroke="#7040a0" stroke-width="3"/><rect x="680" y="275" width="220" height="60" rx="8" fill="#f3edf9" stroke="#9d7ab9" stroke-width="2"/><text x="700" y="312" font-size="17" fill="#352544" text-anchor="start">Carrier terminal</text><text x="600" y="210" font-size="16" fill="#352544" text-anchor="start">Coupling capacitor / CVT</text><text x="70" y="350" font-size="17" fill="#352544" text-anchor="start">Coupling is shunt; terminal is not directly wired to HV.</text><text x="30" y="390" font-size="14" fill="#75647f" text-anchor="start">Conceptual teaching diagram • not a switching order / construction design</text></svg>