<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-label="Step, touch, transferred and floating potential are different"><rect width="960" height="410" fill="#fff"/><text x="30" y="38" font-size="23" fill="#352544" text-anchor="start">Step, touch, transferred and floating potential are different</text><path d="M40 280 L910 280" fill="none" stroke="#9d784c" stroke-width="5"/><text x="45" y="310" font-size="17" fill="#352544" text-anchor="start">soil surface</text><rect x="300" y="100" width="120" height="180" rx="8" fill="#f3edf9" stroke="#9d7ab9" stroke-width="2"/><text x="310" y="145" font-size="16" fill="#352544" text-anchor="start">earthed</text><text x="310" y="170" font-size="16" fill="#352544" text-anchor="start">structure</text><circle cx="500" cy="175" r="17" fill="white" stroke="#7040a0" stroke-width="3"/><path d="M500 192 L500 235" fill="none" stroke="#7040a0" stroke-width="3"/><path d="M500 205 L420 180" fill="none" stroke="#7040a0" stroke-width="3"/><path d="M500 235 L465 280" fill="none" stroke="#7040a0" stroke-width="3"/><path d="M500 235 L545 280" fill="none" stroke="#7040a0" stroke-width="3"/><path d="M580 280 L660 280" fill="none" stroke="#d44" stroke-width="7"/><text x="580" y="250" font-size="17" fill="#352544" text-anchor="start">STEP</text><text x="440" y="110" font-size="17" fill="#352544" text-anchor="start">TOUCH: hand ↔ standing surface</text><path d="M420 145 L865 145" fill="none" stroke="#d44" stroke-width="3" stroke-dasharray="8 5"/><text x="610" y="130" font-size="17" fill="#352544" text-anchor="start">TRANSFERRED potential</text><text x="50" y="355" font-size="17" fill="#352544" text-anchor="start">Floating metal: no reliable earth reference; may acquire induced/fault voltage.</text><text x="30" y="390" font-size="14" fill="#75647f" text-anchor="start">Conceptual teaching diagram • not a switching order / construction design</text></svg>