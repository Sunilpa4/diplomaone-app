<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-label="Power triangle: correcting displacement power factor"><rect width="960" height="430" fill="#fff"/><text x="30" y="38" font-size="23" fill="#352544" text-anchor="start">Power triangle: correcting displacement power factor</text><path d="M150 310 L650 310" fill="none" stroke="#7040a0" stroke-width="3"/><path d="M650 310 L650 110" fill="none" stroke="#7040a0" stroke-width="3"/><path d="M150 310 L650 110" fill="none" stroke="#7040a0" stroke-width="3"/><path d="M150 310 L650 222" fill="none" stroke="#2a9b82" stroke-width="3"/><path d="M650 222 L650 110" fill="none" stroke="#d65d55" stroke-width="6"/><text x="350" y="345" font-size="20" fill="#352544" text-anchor="start">P unchanged</text><text x="685" y="150" font-size="18" fill="#352544" text-anchor="start">Qc removed</text><text x="685" y="220" font-size="18" fill="#352544" text-anchor="start">Q after</text><text x="335" y="170" font-size="18" fill="#352544" text-anchor="start">S before</text><text x="360" y="277" font-size="18" fill="#352544" text-anchor="start">S after</text><text x="80" y="370" font-size="17" fill="#352544" text-anchor="start">Qc = P(tan φ1 − tan φ2); star C = Qc/(ωVL²), delta C = Qc/(3ωVL²)</text><text x="30" y="410" font-size="14" fill="#75647f" text-anchor="start">Conceptual teaching diagram • not a switching order / construction design</text></svg>