<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-label="GIS device roles are not interchangeable"><rect width="960" height="410" fill="#fff"/><text x="30" y="38" font-size="23" fill="#352544" text-anchor="start">GIS device roles are not interchangeable</text><rect x="60.0" y="100" width="260.0" height="120" rx="8" fill="#f3edf9" stroke="#9d7ab9" stroke-width="2"/><text x="74.0" y="135" font-size="19" fill="#352544" text-anchor="start">Circuit breaker</text><text x="74.0" y="166" font-size="15" fill="#352544" text-anchor="start">interrupt load / faults</text><path d="M320.0 160 L343.0 160" fill="none" stroke="#7040a0" stroke-width="3"/><text x="338.0" y="166" font-size="25" fill="#352544" text-anchor="start">›</text><rect x="350.0" y="100" width="260.0" height="120" rx="8" fill="#f3edf9" stroke="#9d7ab9" stroke-width="2"/><text x="364.0" y="135" font-size="19" fill="#352544" text-anchor="start">Disconnector</text><text x="364.0" y="166" font-size="15" fill="#352544" text-anchor="start">rated isolation</text><path d="M610.0 160 L633.0 160" fill="none" stroke="#7040a0" stroke-width="3"/><text x="628.0" y="166" font-size="25" fill="#352544" text-anchor="start">›</text><rect x="640.0" y="100" width="260.0" height="120" rx="8" fill="#f3edf9" stroke="#9d7ab9" stroke-width="2"/><text x="654.0" y="135" font-size="19" fill="#352544" text-anchor="start">Earth switch</text><text x="654.0" y="166" font-size="15" fill="#352544" text-anchor="start">specified earth duty</text><text x="40" y="275" font-size="17" fill="#352544" text-anchor="start">Three-position: connected / isolated / earthed, mutually interlocked as designed.</text><text x="40" y="303" font-size="17" fill="#352544" text-anchor="start">Viewports show specified parts only; a display is not absence-of-voltage proof.</text><text x="30" y="390" font-size="14" fill="#75647f" text-anchor="start">Functional relationships, not an executable utility operation sequence</text></svg>