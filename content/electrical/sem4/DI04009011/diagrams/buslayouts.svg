<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-label="Three illustrative bus layouts: voltage does not mandate topology"><rect width="960" height="430" fill="#fff"/><text x="30" y="38" font-size="23" fill="#352544" text-anchor="start">Three illustrative bus layouts: voltage does not mandate topology</text><path d="M70 110 L870 110" fill="none" stroke="#7040a0" stroke-width="3"/><text x="80" y="85" font-size="17" fill="#352544" text-anchor="start">66 kV: single bus example</text><path d="M300 110 L300 165" fill="none" stroke="#7040a0" stroke-width="3"/><path d="M620 110 L620 165" fill="none" stroke="#7040a0" stroke-width="3"/><path d="M70 235 L450 235" fill="none" stroke="#7040a0" stroke-width="3"/><rect x="450" y="214" width="55" height="42" rx="8" fill="white" stroke="#9d7ab9" stroke-width="2"/><text x="477" y="242" font-size="16" fill="#352544" text-anchor="middle">CB</text><path d="M505 235 L870 235" fill="none" stroke="#7040a0" stroke-width="3"/><text x="80" y="210" font-size="17" fill="#352544" text-anchor="start">132 kV: sectionalised bus example</text><path d="M70 315 L870 315" fill="none" stroke="#7040a0" stroke-width="3"/><path d="M70 355 L870 355" fill="none" stroke="#7040a0" stroke-width="3"/><text x="80" y="290" font-size="17" fill="#352544" text-anchor="start">220 kV: two selectable buses, not automatically two breakers</text><path d="M450 315 L450 355" fill="none" stroke="#7040a0" stroke-width="3"/><text x="510" y="343" font-size="15" fill="#352544" text-anchor="start">coupler shown conceptually</text><text x="30" y="410" font-size="14" fill="#75647f" text-anchor="start">Conceptual teaching diagram • not a switching order / construction design</text></svg>