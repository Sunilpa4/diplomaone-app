<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-label="Security is a process, not one protocol"><rect width="960" height="410" fill="#fff"/><text x="30" y="38" font-size="23" fill="#352544" text-anchor="start">Security is a process, not one protocol</text><rect x="60.0" y="100" width="260.0" height="120" rx="8" fill="#f3edf9" stroke="#9d7ab9" stroke-width="2"/><text x="74.0" y="135" font-size="19" fill="#352544" text-anchor="start">Least privilege</text><text x="74.0" y="166" font-size="15" fill="#352544" text-anchor="start">roles / secure access</text><path d="M320.0 160 L343.0 160" fill="none" stroke="#7040a0" stroke-width="3"/><text x="338.0" y="166" font-size="25" fill="#352544" text-anchor="start">›</text><rect x="350.0" y="100" width="260.0" height="120" rx="8" fill="#f3edf9" stroke="#9d7ab9" stroke-width="2"/><text x="364.0" y="135" font-size="19" fill="#352544" text-anchor="start">Segmentation</text><text x="364.0" y="166" font-size="15" fill="#352544" text-anchor="start">controlled interfaces</text><path d="M610.0 160 L633.0 160" fill="none" stroke="#7040a0" stroke-width="3"/><text x="628.0" y="166" font-size="25" fill="#352544" text-anchor="start">›</text><rect x="640.0" y="100" width="260.0" height="120" rx="8" fill="#f3edf9" stroke="#9d7ab9" stroke-width="2"/><text x="654.0" y="135" font-size="19" fill="#352544" text-anchor="start">Recoverability</text><text x="654.0" y="166" font-size="15" fill="#352544" text-anchor="start">logs / tested backups</text><text x="40" y="275" font-size="17" fill="#352544" text-anchor="start">Validate process logic and command feedback; encryption alone does not make an unsafe command safe.</text><text x="30" y="390" font-size="14" fill="#75647f" text-anchor="start">Functional relationships, not an executable utility operation sequence</text></svg>