<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img"><title>Internal data map:direct SFRspace differs from indirect RAM</title><rect width="1000" height="700" fill="white"/><g font-family="Arial,sans-serif" fill="#2c2534"><text font-size="24"><tspan x="25" y="40">Internal data map:direct SFR space differs from indirect RAM</tspan></text><rect x="100" y="130" width="800" height="90" rx="9" fill="#f0e5fa" stroke="#792ab1" stroke-width="2"/><text font-size="17"><tspan x="112" y="155">00–1F | 32 bytes | Four register banks</tspan></text><rect x="100" y="245" width="800" height="90" rx="9" fill="#f0e5fa" stroke="#792ab1" stroke-width="2"/><text font-size="17"><tspan x="112" y="270">20–2F | 16 bytes | Bit-addressable RAM</tspan></text><rect x="100" y="360" width="800" height="90" rx="9" fill="#f0e5fa" stroke="#792ab1" stroke-width="2"/><text font-size="17"><tspan x="112" y="385">30–7F | 80 bytes | General RAM / allocated stack</tspan></text><rect x="100" y="475" width="800" height="90" rx="9" fill="#f0e5fa" stroke="#792ab1" stroke-width="2"/><text font-size="17"><tspan x="112" y="500">80–FF direct | SFR space | Not upper RAM on baseline 8051</tspan></text><text font-size="15"><tspan x="25" y="675">Original teaching diagram;approved low-voltage trainers only,not field wiring instructions.</tspan></text></g></svg>