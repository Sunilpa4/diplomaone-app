<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img"><title>L293D:separate logic/motor rails,enable and H-bridge load</title><rect width="1000" height="700" fill="white"/><g font-family="Arial,sans-serif" fill="#2c2534"><text font-size="24"><tspan x="25" y="40">L293D:separate logic/motor rails,enable and H-bridge load</tspan></text><rect x="35" y="195" width="270" height="340" rx="9" fill="#f0e5fa" stroke="#792ab1" stroke-width="2"/><text font-size="17"><tspan x="47" y="220">8051 + approved logic</tspan><tspan x="47" y="242">buffer</tspan></text><rect x="490" y="195" width="255" height="340" rx="9" fill="#f0e5fa" stroke="#792ab1" stroke-width="2"/><text font-size="17"><tspan x="502" y="220">L293D:one H-bridge</tspan></text><text font-size="16"><tspan x="50" y="270">P1.0:directionA</tspan></text><text font-size="16"><tspan x="505" y="270">1A pin2</tspan></text><path d="M305,285 L490,285" fill="none" stroke="#792ab1" stroke-width="2.5"/><polygon points="490,285 480.0,281.0 480.0,289.0" fill="#792ab1"/><text font-size="16"><tspan x="50" y="350">P1.1:directionB</tspan></text><text font-size="16"><tspan x="505" y="350">2A pin7</tspan></text><path d="M305,365 L490,365" fill="none" stroke="#792ab1" stroke-width="2.5"/><polygon points="490,365 480.0,361.0 480.0,369.0" fill="#792ab1"/><text font-size="16"><tspan x="50" y="440">P1.2:gated enable</tspan></text><text font-size="16"><tspan x="505" y="440">1,2EN pin1</tspan></text><path d="M305,455 L490,455" fill="none" stroke="#792ab1" stroke-width="2.5"/><polygon points="490,455 480.0,451.0 480.0,459.0" fill="#792ab1"/><circle cx="865" cy="355" r="46" fill="#f0e5fa" stroke="#792ab1" stroke-width="3"/><text font-size="24"><tspan x="846" y="363">M</tspan></text><path d="M745,300 L865,300" fill="none" stroke="#792ab1" stroke-width="2.5"/><path d="M865,300 L865,309" fill="none" stroke="#792ab1" stroke-width="2.5"/><path d="M745,420 L865,420" fill="none" stroke="#792ab1" stroke-width="2.5"/><path d="M865,401 L865,420" fill="none" stroke="#792ab1" stroke-width="2.5"/><text font-size="15"><tspan x="770" y="280">1Y pin3</tspan></text><text font-size="15"><tspan x="770" y="447">2Y pin6</tspan></text><text font-size="18"><tspan x="45" y="115">VCC1 pin16=5Vlogic;VCC2 pin8=rated motor supply;GND pins4,5,12,13=common ground.</tspan></text><text font-size="18"><tspan x="45" y="570">L293D has internal clamp diodes;600mA/channel rating is subject to thermal/stall limits.</tspan></text><text font-size="18"><tspan x="45" y="610">Disable before reversal;check motor current,driver voltage drop and reset-safe hardware</tspan><tspan x="45" y="633">enable.</tspan></text><text font-size="15"><tspan x="25" y="675">Original teaching diagram;approved low-voltage trainers only,not field wiring instructions.</tspan></text></g></svg>