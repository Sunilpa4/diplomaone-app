<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img"><title>8051 architecture:CPU,memory,peripherals and control</title><rect width="1000" height="700" fill="white"/><g font-family="Arial,sans-serif" fill="#2c2534"><text font-size="24"><tspan x="25" y="40">8051 architecture:CPU,memory,peripherals and control</tspan></text><rect x="370" y="230" width="250" height="150" rx="9" fill="#f0e5fa" stroke="#792ab1" stroke-width="2"/><text font-size="17"><tspan x="382" y="255">8-bit CPU:ALU / A / B /</tspan><tspan x="382" y="277">PSW</tspan></text><rect x="50" y="130" width="260" height="110" rx="9" fill="#f0e5fa" stroke="#792ab1" stroke-width="2"/><text font-size="17"><tspan x="62" y="155">Program Flash / PC</tspan></text><path d="M180,185 L495,305" fill="none" stroke="#792ab1" stroke-width="2.5"/><rect x="700" y="130" width="260" height="110" rx="9" fill="#f0e5fa" stroke="#792ab1" stroke-width="2"/><text font-size="17"><tspan x="712" y="155">RAM / registers / SP</tspan></text><path d="M830,185 L495,305" fill="none" stroke="#792ab1" stroke-width="2.5"/><rect x="50" y="440" width="260" height="110" rx="9" fill="#f0e5fa" stroke="#792ab1" stroke-width="2"/><text font-size="17"><tspan x="62" y="465">Timers / interrupt</tspan><tspan x="62" y="487">controller</tspan></text><path d="M180,495 L495,305" fill="none" stroke="#792ab1" stroke-width="2.5"/><rect x="700" y="440" width="260" height="110" rx="9" fill="#f0e5fa" stroke="#792ab1" stroke-width="2"/><text font-size="17"><tspan x="712" y="465">Ports / UART / DPTR</tspan></text><path d="M830,495 L495,305" fill="none" stroke="#792ab1" stroke-width="2.5"/><text font-size="19"><tspan x="50" y="90">Separate code/data address spaces;classic baseline:4KBprogram,128B RAM.</tspan></text><text font-size="18"><tspan x="50" y="610">Clock/reset provide timing and a defined start;the common bus is a functional abstraction.</tspan></text><text font-size="15"><tspan x="25" y="675">Original teaching diagram;approved low-voltage trainers only,not field wiring instructions.</tspan></text></g></svg>