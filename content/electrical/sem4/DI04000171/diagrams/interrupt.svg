<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img"><title>Five vector entries,six classic request flags</title><rect width="1000" height="470" fill="white"/><g font-family="Arial,sans-serif" fill="#2c2534"><text font-size="24"><tspan x="25" y="40">Five vector entries,six classic request flags</tspan></text><rect x="40" y="150" width="280" height="110" rx="9" fill="#f0e5fa" stroke="#792ab1" stroke-width="2"/><text font-size="17"><tspan x="52" y="175">INT0 / T0 / INT1 / T1</tspan></text><path d="M320,205 L355,205" fill="none" stroke="#792ab1" stroke-width="2.5"/><polygon points="355,205 345.0,201.0 345.0,209.0" fill="#792ab1"/><rect x="360" y="150" width="280" height="110" rx="9" fill="#f0e5fa" stroke="#792ab1" stroke-width="2"/><text font-size="17"><tspan x="372" y="175">RIand TIshare serial vector</tspan></text><path d="M640,205 L675,205" fill="none" stroke="#792ab1" stroke-width="2.5"/><polygon points="675,205 665.0,201.0 665.0,209.0" fill="#792ab1"/><rect x="680" y="150" width="280" height="110" rx="9" fill="#f0e5fa" stroke="#792ab1" stroke-width="2"/><text font-size="17"><tspan x="692" y="175">IE enable + IP priority +</tspan><tspan x="692" y="197">RETI</tspan></text><text font-size="20"><tspan x="50" y="350">Clear the correct request source.Keil interrupt0..4 correspond</tspan><tspan x="50" y="375">to0003H,000BH,0013H,001BH,0023H.Reset0000His not an ordinary interrupt.</tspan></text><text font-size="15"><tspan x="25" y="450">Original teaching diagram;approved low-voltage trainers only,not field wiring instructions.</tspan></text></g></svg>