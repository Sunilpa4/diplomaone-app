<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img"><title>Unipolar stepper:four low-side winding drivers and clamp common</title><rect width="1000" height="700" fill="white"/><g font-family="Arial,sans-serif" fill="#2c2534"><text font-size="24"><tspan x="25" y="40">Unipolar stepper:four low-side winding drivers and clamp common</tspan></text><rect x="35" y="190" width="255" height="340" rx="9" fill="#f0e5fa" stroke="#792ab1" stroke-width="2"/><text font-size="17"><tspan x="47" y="215">8051 + logic buffer</tspan></text><rect x="460" y="190" width="220" height="340" rx="9" fill="#f0e5fa" stroke="#792ab1" stroke-width="2"/><text font-size="17"><tspan x="472" y="215">ULN2003-type driver</tspan></text><text font-size="16"><tspan x="50" y="247">P2.0</tspan></text><text font-size="15"><tspan x="475" y="247">IN1 / OUT1</tspan></text><path d="M290,260 L460,260" fill="none" stroke="#792ab1" stroke-width="2.5"/><polygon points="460,260 450.0,256.0 450.0,264.0" fill="#792ab1"/><path d="M680,260 L760,260" fill="none" stroke="#792ab1" stroke-width="2.5"/><path d="M760,260 q10,-25 20,0 q10,-25 20,0 q10,-25 20,0 q10,-25 20,0" fill="none" stroke="#792ab1" stroke-width="2.5"/><path d="M840,260 L920,260" fill="none" stroke="#792ab1" stroke-width="2.5"/><text font-size="14"><tspan x="785" y="283">W1</tspan></text><text font-size="16"><tspan x="50" y="312">P2.1</tspan></text><text font-size="15"><tspan x="475" y="312">IN2 / OUT2</tspan></text><path d="M290,325 L460,325" fill="none" stroke="#792ab1" stroke-width="2.5"/><polygon points="460,325 450.0,321.0 450.0,329.0" fill="#792ab1"/><path d="M680,325 L760,325" fill="none" stroke="#792ab1" stroke-width="2.5"/><path d="M760,325 q10,-25 20,0 q10,-25 20,0 q10,-25 20,0 q10,-25 20,0" fill="none" stroke="#792ab1" stroke-width="2.5"/><path d="M840,325 L920,325" fill="none" stroke="#792ab1" stroke-width="2.5"/><text font-size="14"><tspan x="785" y="348">W2</tspan></text><text font-size="16"><tspan x="50" y="377">P2.2</tspan></text><text font-size="15"><tspan x="475" y="377">IN3 / OUT3</tspan></text><path d="M290,390 L460,390" fill="none" stroke="#792ab1" stroke-width="2.5"/><polygon points="460,390 450.0,386.0 450.0,394.0" fill="#792ab1"/><path d="M680,390 L760,390" fill="none" stroke="#792ab1" stroke-width="2.5"/><path d="M760,390 q10,-25 20,0 q10,-25 20,0 q10,-25 20,0 q10,-25 20,0" fill="none" stroke="#792ab1" stroke-width="2.5"/><path d="M840,390 L920,390" fill="none" stroke="#792ab1" stroke-width="2.5"/><text font-size="14"><tspan x="785" y="413">W3</tspan></text><text font-size="16"><tspan x="50" y="442">P2.3</tspan></text><text font-size="15"><tspan x="475" y="442">IN4 / OUT4</tspan></text><path d="M290,455 L460,455" fill="none" stroke="#792ab1" stroke-width="2.5"/><polygon points="460,455 450.0,451.0 450.0,459.0" fill="#792ab1"/><path d="M680,455 L760,455" fill="none" stroke="#792ab1" stroke-width="2.5"/><path d="M760,455 q10,-25 20,0 q10,-25 20,0 q10,-25 20,0 q10,-25 20,0" fill="none" stroke="#792ab1" stroke-width="2.5"/><path d="M840,455 L920,455" fill="none" stroke="#792ab1" stroke-width="2.5"/><text font-size="14"><tspan x="785" y="478">W4</tspan></text><path d="M920,150 L920,480" fill="none" stroke="#792ab1" stroke-width="2.5"/><text font-size="17"><tspan x="715" y="130">Rated +Vm / coil common</tspan></text><text font-size="18"><tspan x="40" y="565">Driver COM(clamp common,pin9)→+Vm;emitter GND(pin8)→power/MCU common ground.</tspan></text><text font-size="18"><tspan x="40" y="605">Two-phase sequence03H,06H,0CH,09H;actual winding order and driver ratings must be</tspan><tspan x="40" y="628">verified.</tspan></text><text font-size="15"><tspan x="25" y="675">Original teaching diagram;approved low-voltage trainers only,not field wiring instructions.</tspan></text></g></svg>