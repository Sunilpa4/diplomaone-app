00" width="205" height="90" rx="9" fill="#f0e5fa" stroke="#792ab1" stroke-width="2"/><text font-size="17"><tspan x="782" y="525">UART→MAX232→true</tspan><tspan x="782" y="547">RS-232</tspan></text><path d="M890,430 L650,500" fill="none" stroke="#792ab1" stroke-width="2.5"/><polygon points="650,500 660.72,501.03999999999996 658.48,493.36" fill="#792ab1"/><path d="M920,430 L880,500" fill="none" stroke="#792ab1" stroke-width="2.5"/><polygon points="880,500 888.4343619520662,493.30212433218276 881.4884168150704,489.33301282532807" fill="#792ab1"/><text font-size="20"><tspan x="35" y="115">Educational voltage monitor only:all test channels stay within the MUX/ADC rails.</tspan></text><text font-size="18"><tspan x="35" y="630">No lithium cells,high-voltage pack,balance charging or certified protection is connected</tspan><tspan x="35" y="653">or claimed.</tspan></text><text font-size="15"><tspan x="25" y="675">Original teaching diagram;approved low-voltage trainers only,not field wiring instructions.</tspan></text></g></svg>