<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img"><title>MCUversus MPU:integration and application</title><rect width="1000" height="470" fill="white"/><g font-family="Arial,sans-serif" fill="#2c2534"><text font-size="24"><tspan x="25" y="40">MCU versus MPU:integration and application</tspan></text><rect x="40" y="150" width="280" height="110" rx="9" fill="#f0e5fa" stroke="#792ab1" stroke-width="2"/><text font-size="17"><tspan x="52" y="175">CPU + memory + I/O on MCU</tspan></text><rect x="360" y="150" width="280" height="110" rx="9" fill="#f0e5fa" stroke="#792ab1" stroke-width="2"/><text font-size="17"><tspan x="372" y="175">Embedded control /</tspan><tspan x="372" y="197">dedicated task</tspan></text><rect x="680" y="150" width="280" height="110" rx="9" fill="#f0e5fa" stroke="#792ab1" stroke-width="2"/><text font-size="17"><tspan x="692" y="175">MPU:system-level external</tspan><tspan x="692" y="197">resources</tspan></text><text font-size="20"><tspan x="50" y="350">These are comparison concepts,not literal signal paths.MCU does not mean no</tspan><tspan x="50" y="375">external components;MPU systems can use highly integrated SoCs.</tspan></text><text font-size="15"><tspan x="25" y="450">Original teaching diagram;approved low-voltage trainers only,not field wiring instructions.</tspan></text></g></svg>