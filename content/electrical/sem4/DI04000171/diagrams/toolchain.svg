<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img"><title>Program build and debug workflow</title><rect width="1000" height="470" fill="white"/><g font-family="Arial,sans-serif" fill="#2c2534"><text font-size="24"><tspan x="25" y="40">Program build and debug workflow</tspan></text><rect x="40" y="150" width="280" height="110" rx="9" fill="#f0e5fa" stroke="#792ab1" stroke-width="2"/><text font-size="17"><tspan x="52" y="175">Source C / A51</tspan></text><path d="M320,205 L355,205" fill="none" stroke="#792ab1" stroke-width="2.5"/><polygon points="355,205 345.0,201.0 345.0,209.0" fill="#792ab1"/><rect x="360" y="150" width="280" height="110" rx="9" fill="#f0e5fa" stroke="#792ab1" stroke-width="2"/><text font-size="17"><tspan x="372" y="175">Target compiler / linker →</tspan><tspan x="372" y="197">HEX</tspan></text><path d="M640,205 L675,205" fill="none" stroke="#792ab1" stroke-width="2.5"/><polygon points="675,205 665.0,201.0 665.0,209.0" fill="#792ab1"/><rect x="680" y="150" width="280" height="110" rx="9" fill="#f0e5fa" stroke="#792ab1" stroke-width="2"/><text font-size="17"><tspan x="692" y="175">Simulator / supported</tspan><tspan x="692" y="197">programmer</tspan></text><text font-size="20"><tspan x="50" y="350">Check target,clock and pin map first.Keil C51 sbit/interrupt syntax is vendor-</tspan><tspan x="50" y="375">specific;FlashMagic/JTAGsupport is device-specific,not universal 8051.</tspan></text><text font-size="15"><tspan x="25" y="450">Original teaching diagram;approved low-voltage trainers only,not field wiring instructions.</tspan></text></g></svg>