<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img"><title>LM35positive-temperature path and correctly scaled LCDvalue</title><rect width="1000" height="700" fill="white"/><g font-family="Arial,sans-serif" fill="#2c2534"><text font-size="24"><tspan x="25" y="40">LM35 positive-temperature path and correctly scaled LCD value</tspan></text><rect x="35" y="230" width="235" height="160" rx="9" fill="#f0e5fa" stroke="#792ab1" stroke-width="2"/><text font-size="17"><tspan x="47" y="255">LM35:approved</tspan><tspan x="47" y="277">positive-temperature</tspan><tspan x="47" y="299">connection</tspan></text><rect x="390" y="230" width="245" height="160" rx="9" fill="#f0e5fa" stroke="#792ab1" stroke-width="2"/><text font-size="17"><tspan x="402" y="255">ADC0804:VREF/2=1.28V</tspan></text><rect x="755" y="230" width="210" height="160" rx="9" fill="#f0e5fa" stroke="#792ab1" stroke-width="2"/><text font-size="17"><tspan x="767" y="255">8051→16x2 LCD</tspan></text><path d="M270,310 L390,310" fill="none" stroke="#792ab1" stroke-width="2.5"/><polygon points="390,310 380.0,306.0 380.0,314.0" fill="#792ab1"/><path d="M635,310 L755,310" fill="none" stroke="#792ab1" stroke-width="2.5"/><polygon points="755,310 745.0,306.0 745.0,314.0" fill="#792ab1"/><text font-size="18"><tspan x="40" y="125">LM35 V+=verified5Vsupply;GND=analog ground;package lead order must match its datasheet.</tspan></text><text font-size="17"><tspan x="285" y="210">VOUT=10mV/degC</tspan></text><text font-size="20"><tspan x="45" y="470">At25degC,VOUTnominal=0.250V;ADC span2.56V→10mV/code→code about25.</tspan></text><text font-size="18"><tspan x="45" y="535">P1=ADC data;P2=LCD data;RD=P3.7,WR=P3.6,INTR=P3.2;LCD RS=P3.0,E=P3.1.</tspan></text><text font-size="18"><tspan x="45" y="595">Quantisation,sensor/reference tolerances and noise remain;this is not a calibrated</tspan><tspan x="45" y="618">temperature reading.</tspan></text><text font-size="15"><tspan x="25" y="675">Original teaching diagram;approved low-voltage trainers only,not field wiring instructions.</tspan></text></g></svg>