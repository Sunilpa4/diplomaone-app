<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img"><title>CPUregister roles and sizes</title><rect width="1000" height="470" fill="white"/><g font-family="Arial,sans-serif" fill="#2c2534"><text font-size="24"><tspan x="25" y="40">CPU register roles and sizes</tspan></text><rect x="40" y="150" width="280" height="110" rx="9" fill="#f0e5fa" stroke="#792ab1" stroke-width="2"/><text font-size="17"><tspan x="52" y="175">PC 16-bit:next instruction</tspan></text><rect x="360" y="150" width="280" height="110" rx="9" fill="#f0e5fa" stroke="#792ab1" stroke-width="2"/><text font-size="17"><tspan x="372" y="175">DPTR 16-bit:data/code</tspan><tspan x="372" y="197">address</tspan></text><rect x="680" y="150" width="280" height="110" rx="9" fill="#f0e5fa" stroke="#792ab1" stroke-width="2"/><text font-size="17"><tspan x="692" y="175">SP 8-bit:internal stack</tspan><tspan x="692" y="197">position</tspan></text><text font-size="20"><tspan x="50" y="350">A/B/PSW are8-bit.PC is not a directly addressable SFR.SP resets07H;first pushed</tspan><tspan x="50" y="375">byte uses08H,which overlaps register bank1.</tspan></text><text font-size="15"><tspan x="25" y="450">Original teaching diagram;approved low-voltage trainers only,not field wiring instructions.</tspan></text></g></svg>