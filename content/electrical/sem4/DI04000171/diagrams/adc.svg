<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img"><title>ADC0804connection map:analog/reference,clock,data and handshake</title><rect width="1000" height="700" fill="white"/><g font-family="Arial,sans-serif" fill="#2c2534"><text font-size="24"><tspan x="25" y="40">ADC0804 connection map:analog/reference,clock,data and handshake</tspan></text><rect x="45" y="180" width="300" height="350" rx="9" fill="#f0e5fa" stroke="#792ab1" stroke-width="2"/><text font-size="17"><tspan x="57" y="205">8051:12Tcontroller</tspan></text><rect x="555" y="180" width="390" height="350" rx="9" fill="#f0e5fa" stroke="#792ab1" stroke-width="2"/><text font-size="17"><tspan x="567" y="205">ADC0804,5Vlogic</tspan></text><text font-size="16"><tspan x="62" y="258">P1.0..7=FFH,input</tspan></text><text font-size="16"><tspan x="570" y="258">D0..D7:pins18..11</tspan></text><path d="M555,270 L345,270" fill="none" stroke="#792ab1" stroke-width="2.5"/><polygon points="345,270 355.0,274.0 355.0,266.0" fill="#792ab1"/><text font-size="16"><tspan x="62" y="323">P3.6:WR output</tspan></text><text font-size="16"><tspan x="570" y="323">WR pin3</tspan></text><path d="M345,335 L555,335" fill="none" stroke="#792ab1" stroke-width="2.5"/><polygon points="555,335 545.0,331.0 545.0,339.0" fill="#792ab1"/><text font-size="16"><tspan x="62" y="383">P3.7:RD output</tspan></text><text font-size="16"><tspan x="570" y="383">RD pin2</tspan></text><path d="M345,395 L555,395" fill="none" stroke="#792ab1" stroke-width="2.5"/><polygon points="555,395 545.0,391.0 545.0,399.0" fill="#792ab1"/><text font-size="16"><tspan x="62" y="443">P3.2:INTR input</tspan></text><text font-size="16"><tspan x="570" y="443">INTR pin5</tspan></text><path d="M555,455 L345,455" fill="none" stroke="#792ab1" stroke-width="2.5"/><polygon points="345,455 355.0,459.0 355.0,451.0" fill="#792ab1"/><text font-size="18"><tspan x="50" y="110">VIN+(6):conditioned analog0..2.56V;VIN−(7)=A GND;VREF/2(9)=1.28V.</tspan></text><text font-size="18"><tspan x="50" y="145">VCC(20)=5V;CS(1)=LOW;A GND(8)and D GND(10)join at the approved ground point.</tspan></text><text font-size="18"><tspan x="50" y="575">Clock:connect the specified RC oscillator at CLKIN(4)/CLKR(19),or an approved clock.</tspan></text><text font-size="18"><tspan x="50" y="610">WR start → wait INTR  LOW with timeout → RD  LOW and read → RD  HIGH.P1 must not drive</tspan><tspan x="50" y="633">against ADC.</tspan></text><text font-size="15"><tspan x="25" y="675">Original teaching diagram;approved low-voltage trainers only,not field wiring instructions.</tspan></text></g></svg>