t x="700" y="320" width="250" height="140" rx="9" fill="#f0e5fa" stroke="#792ab1" stroke-width="2"/><text font-size="17"><tspan x="712" y="345">Active-HIGH reset</tspan><tspan x="712" y="367">supervisor with startup</tspan><tspan x="712" y="389">delay</tspan></text><path d="M700,480 L630,480" fill="none" stroke="#792ab1" stroke-width="2.5"/><path d="M700,390 L680,390" fill="none" stroke="#792ab1" stroke-width="2.5"/><path d="M680,390 L680,480" fill="none" stroke="#792ab1" stroke-width="2.5"/><path d="M680,480 L700,480" fill="none" stroke="#792ab1" stroke-width="2.5"/><text font-size="18"><tspan x="55" y="120">Use crystal load capacitors chosen from MCU/crystal specifications;short local wiring.</tspan></text><text font-size="18"><tspan x="55" y="570">Reset:HIGH for &gt;=2machine cycles with oscillator running;at12MHz12T this is &gt;=2us.</tspan></text><text font-size="17"><tspan x="55" y="615">VCC=5Vand local decoupling assumed;use a verified supervisor,not an unqualified RC brownout</tspan><tspan x="55" y="637">claim.</tspan></text><text font-size="15"><tspan x="25" y="675">Original teaching diagram;approved low-voltage trainers only,not field wiring instructions.</tspan></text></g></svg>