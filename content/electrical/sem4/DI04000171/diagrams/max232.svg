<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img"><title>UARTlogic is not RS-232voltage</title><rect width="1000" height="470" fill="white"/><g font-family="Arial,sans-serif" fill="#2c2534"><text font-size="24"><tspan x="25" y="40">UART logic is not RS-232voltage</tspan></text><rect x="40" y="150" width="280" height="110" rx="9" fill="#f0e5fa" stroke="#792ab1" stroke-width="2"/><text font-size="17"><tspan x="52" y="175">8051 TXD/RXDlogic</tspan></text><path d="M320,205 L355,205" fill="none" stroke="#792ab1" stroke-width="2.5"/><polygon points="355,205 345.0,201.0 345.0,209.0" fill="#792ab1"/><rect x="360" y="150" width="280" height="110" rx="9" fill="#f0e5fa" stroke="#792ab1" stroke-width="2"/><text font-size="17"><tspan x="372" y="175">MAX232 transceiver +</tspan><tspan x="372" y="197">specified caps</tspan></text><path d="M640,205 L675,205" fill="none" stroke="#792ab1" stroke-width="2.5"/><polygon points="675,205 665.0,201.0 665.0,209.0" fill="#792ab1"/><rect x="680" y="150" width="280" height="110" rx="9" fill="#f0e5fa" stroke="#792ab1" stroke-width="2"/><text font-size="17"><tspan x="692" y="175">PC true RS-232port</tspan></text><text font-size="20"><tspan x="50" y="350">MAX232 uses a5Vsupply and internal charge pump;external±12Vis not required for a</tspan><tspan x="50" y="375">normal MAX232 circuit.Do not insert RS-232levels into raw TTL/CMOSpins.</tspan></text><text font-size="15"><tspan x="25" y="450">Original teaching diagram;approved low-voltage trainers only,not field wiring instructions.</tspan></text></g></svg>