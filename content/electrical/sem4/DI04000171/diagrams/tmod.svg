<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img"><title>TMODone nibble per timer</title><rect width="1000" height="470" fill="white"/><g font-family="Arial,sans-serif" fill="#2c2534"><text font-size="24"><tspan x="25" y="40">TMOD one nibble per timer</tspan></text><rect x="40" y="150" width="280" height="110" rx="9" fill="#f0e5fa" stroke="#792ab1" stroke-width="2"/><text font-size="17"><tspan x="52" y="175">Timer1:GATE C/T M1 M0</tspan></text><rect x="360" y="150" width="280" height="110" rx="9" fill="#f0e5fa" stroke="#792ab1" stroke-width="2"/><text font-size="17"><tspan x="372" y="175">Timer0:GATE C/T M1 M0</tspan></text><rect x="680" y="150" width="280" height="110" rx="9" fill="#f0e5fa" stroke="#792ab1" stroke-width="2"/><text font-size="17"><tspan x="692" y="175">TCON:TF/TR/edge controls</tspan></text><text font-size="20"><tspan x="50" y="350">Mode0=13bit,Mode1=16-bit,Mode2=8-bit auto-reload,Mode3=special split Timer0;do</tspan><tspan x="50" y="375">not describe Mode3 as ordinary independent16-bit Timer1 operation.</tspan></text><text font-size="15"><tspan x="25" y="450">Original teaching diagram;approved low-voltage trainers only,not field wiring instructions.</tspan></text></g></svg>