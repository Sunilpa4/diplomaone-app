<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img"><title>Synchronisation:incoming source,breaker,instruments and bus</title><rect width="1000" height="650" fill="white"/><g fill="#30253d" font-family="Arial,sans-serif"><text font-size="23"><tspan x="25" y="38">Synchronisation:incoming source,breaker,instruments and bus</tspan></text><rect x="55" y="190" width="240" height="160" rx="9" fill="#f1e8fa" stroke="#7936ae" stroke-width="2"/><text font-size="17"><tspan x="67" y="215">Incoming alternator:V,f</tspan><tspan x="67" y="237">,sequence,angle</tspan></text><rect x="405" y="190" width="210" height="160" rx="9" fill="#f1e8fa" stroke="#7936ae" stroke-width="2"/><text font-size="17"><tspan x="417" y="215">Open breaker + sync-</tspan><tspan x="417" y="237">check protection</tspan></text><rect x="735" y="190" width="220" height="160" rx="9" fill="#f1e8fa" stroke="#7936ae" stroke-width="2"/><text font-size="17"><tspan x="747" y="215">Energised</tspan><tspan x="747" y="237">bus:reference V/f</tspan></text><path d="M295,270 L405,270" fill="none" stroke="#7936ae" stroke-width="2.5"/><path d="M615,270 L735,270" fill="none" stroke="#7936ae" stroke-width="2.5"/><rect x="290" y="440" width="450" height="90" rx="9" fill="#f1e8fa" stroke="#7936ae" stroke-width="2"/><text font-size="17"><tspan x="302" y="465">Rated lamps / synchroscope + verified timing</tspan></text><path d="M280,350 L400,440" fill="none" stroke="#7936ae" stroke-width="2.5" stroke-dasharray="7 5"/><path d="M800,350 L650,440" fill="none" stroke="#7936ae" stroke-width="2.5" stroke-dasharray="7 5"/><text font-size="19"><tspan x="50" y="125">Sequence -&gt; voltage -&gt; frequency -&gt; phase at actual closure;all must be acceptable.</tspan></text><text font-size="18"><tspan x="50" y="585">Qualified panel operation only.No unsupervised grid connection;breaker closure needs</tspan><tspan x="50" y="608">authorised sync-check.</tspan></text><text font-size="14"><tspan x="25" y="630">Original teaching diagram;conceptual only.Qualified-supervised machine laboratory,not home wiring.</tspan></text></g></svg>