<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img"><title>Double-field revolving theory:field directions and slips</title><rect width="1000" height="650" fill="white"/><g fill="#30253d" font-family="Arial,sans-serif"><text font-size="23"><tspan x="25" y="38">Double-field revolving theory:field directions and slips</tspan></text><circle cx="500" cy="325" r="180" fill="white" stroke="#7936ae" stroke-width="2.5"/><path d="M500,325 L675,325" fill="none" stroke="#7936ae" stroke-width="2.5"/><polygon points="675,325 664.0,320.0 664.0,330.0" fill="#7936ae"/><path d="M500,325 L325,325" fill="none" stroke="#7936ae" stroke-width="2.5"/><polygon points="325,325 336.0,330.0 336.0,320.0" fill="#7936ae"/><text font-size="19"><tspan x="570" y="285">Forward Bm/2</tspan></text><text font-size="19"><tspan x="155" y="285">Backward Bm/2</tspan></text><text font-size="20"><tspan x="300" y="120">Pulsating field = two equal counter-rotating fields</tspan></text><text font-size="20"><tspan x="210" y="560">At rest:sf=sb=1,Tf=Tb;net starting torque=0.</tspan></text><text font-size="18"><tspan x="210" y="600">Running forward:sf=s,sb=2-s;backward field remains.</tspan></text><path d="M510,145 A180,180 0 0,1 675,305 M490,505 A180,180 0 0,1 325,345" fill="none" stroke="#7936ae" stroke-width="3"/><text font-size="14"><tspan x="25" y="630">Original teaching diagram;conceptual only.Qualified-supervised machine laboratory,not home wiring.</tspan></text></g></svg>