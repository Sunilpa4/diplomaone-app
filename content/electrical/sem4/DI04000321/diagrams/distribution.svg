<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img"><title>Distributed winding:head-to-tail coil-EMFphasors</title><rect width="1000" height="650" fill="white"/><g fill="#30253d" font-family="Arial,sans-serif"><text font-size="23"><tspan x="25" y="38">Distributed winding:head-to-tail coil-EMFphasors</tspan></text><path d="M130,440 L346.12930278075896,518.6646329649038" fill="none" stroke="#7936ae" stroke-width="2.5"/><polygon points="346.12930278075896,518.6646329649038 337.5027846687423,510.20394828439197 334.08258323548563,519.600874492251" fill="#7936ae"/><text font-size="18"><tspan x="238.06465139037948" y="459.3323164824519">E1</tspan></text><path d="M346.12930278075896,518.6646329649038 L576.129302780759,518.6646329649038" fill="none" stroke="#7936ae" stroke-width="2.5"/><polygon points="576.129302780759,518.6646329649038 565.129302780759,513.6646329649038 565.129302780759,523.6646329649038" fill="#7936ae"/><text font-size="18"><tspan x="461.12930278075896" y="498.66463296490383">E2</tspan></text><path d="M576.129302780759,518.6646329649038 L792.2586055615179,440.0" fill="none" stroke="#7936ae" stroke-width="2.5"/><polygon points="792.2586055615179,440.0 780.2118860162446,439.0637584726528 783.6320874495012,448.4606846805119" fill="#7936ae"/><text font-size="18"><tspan x="684.1939541711384" y="459.3323164824519">E3</tspan></text><path d="M130,440 L792.2586055615179,440.0" fill="none" stroke="#7936ae" stroke-width="2.5"/><polygon points="792.2586055615179,440.0 781.2586055615179,435.0 781.2586055615179,445.0" fill="#7936ae"/><text font-size="21"><tspan x="240" y="190">q equal coil EMFs separated by slot angle beta</tspan></text><text font-size="19"><tspan x="80" y="555">kd=sin(q beta/2)/[q sin(beta/2)];regular integral-slot fundamental grouping.</tspan></text><text font-size="18"><tspan x="80" y="595">q=3,beta=20deg -&gt; kd=0.9598.Vector magnitude is less than arithmetic sum.</tspan></text><text font-size="14"><tspan x="25" y="630">Original teaching diagram;conceptual only.Qualified-supervised machine laboratory,not home wiring.</tspan></text></g></svg>