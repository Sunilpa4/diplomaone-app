<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img"><title>Speed-control classification by what changes</title><rect width="1000" height="650" fill="white"/><g fill="#30253d" font-family="Arial,sans-serif"><text font-size="23"><tspan x="25" y="38">Speed-control classification by what changes</tspan></text><rect x="330" y="100" width="340" height="75" rx="9" fill="#f1e8fa" stroke="#7936ae" stroke-width="2"/><text font-size="17"><tspan x="342" y="125">N=(1-s)120f/P</tspan></text><path d="M500,175 L196.66666666666666,260" fill="none" stroke="#7936ae" stroke-width="2.5"/><rect x="50.0" y="260" width="273.3333333333333" height="140" rx="9" fill="#f1e8fa" stroke="#7936ae" stroke-width="2"/><text font-size="17"><tspan x="62.0" y="285">Change f:VVVF/VFD</tspan></text><path d="M500,175 L490.0,260" fill="none" stroke="#7936ae" stroke-width="2.5"/><rect x="343.3333333333333" y="260" width="273.3333333333333" height="140" rx="9" fill="#f1e8fa" stroke="#7936ae" stroke-width="2"/><text font-size="17"><tspan x="355.3333333333333" y="285">Change P:designed pole-</tspan><tspan x="355.3333333333333" y="307">changing winding</tspan></text><path d="M500,175 L783.3333333333333,260" fill="none" stroke="#7936ae" stroke-width="2.5"/><rect x="636.6666666666666" y="260" width="273.3333333333333" height="140" rx="9" fill="#f1e8fa" stroke="#7936ae" stroke-width="2"/><text font-size="17"><tspan x="648.6666666666666" y="285">Change s:stator voltage or</tspan><tspan x="648.6666666666666" y="307">wound-rotor resistance</tspan></text><text font-size="19"><tspan x="45" y="485">Slip control generally trades efficiency/thermal performance;frequency control also</tspan><tspan x="45" y="509">requires voltage/flux management.</tspan></text><text font-size="14"><tspan x="25" y="630">Original teaching diagram;conceptual only.Qualified-supervised machine laboratory,not home wiring.</tspan></text></g></svg>