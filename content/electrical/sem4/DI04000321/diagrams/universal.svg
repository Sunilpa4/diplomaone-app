<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img"><title>Universal motor:series field/armature and relative reversal</title><rect width="1000" height="650" fill="white"/><g fill="#30253d" font-family="Arial,sans-serif"><text font-size="23"><tspan x="25" y="38">Universal motor:series field/armature and relative reversal</tspan></text><path d="M70,300 L210,300" fill="none" stroke="#7936ae" stroke-width="2.5"/><path d="M210,300 q12,-30 24,0 q12,-30 24,0 q12,-30 24,0 q12,-30 24,0" fill="none" stroke="#7936ae" stroke-width="3"/><path d="M306,300 L450,300" fill="none" stroke="#7936ae" stroke-width="2.5"/><circle cx="525" cy="300" r="75" fill="#f1e8fa" stroke="#7936ae" stroke-width="2.5"/><path d="M600,300 L900,300" fill="none" stroke="#7936ae" stroke-width="2.5"/><text font-size="19"><tspan x="200" y="230">Series field F1/F2</tspan></text><text font-size="18"><tspan x="470" y="310">Armature</tspan></text><text font-size="17"><tspan x="470" y="350">A1/A2</tspan></text><text font-size="19"><tspan x="70" y="400">AC/DC-rated supply</tspan></text><text font-size="20"><tspan x="70" y="480">Reverse field OR armature relative to the other,not both.No casual unloaded high-</tspan><tspan x="70" y="505">speed run.</tspan></text><text font-size="18"><tspan x="70" y="555">Torque direction is retained on ACbecause field flux and armature current reverse together.</tspan></text><text font-size="14"><tspan x="25" y="630">Original teaching diagram;conceptual only.Qualified-supervised machine laboratory,not home wiring.</tspan></text></g></svg>