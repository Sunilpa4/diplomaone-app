<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img"><title>Shaded-pole:shorted copper turn and starting field sweep</title><rect width="1000" height="650" fill="white"/><g fill="#30253d" font-family="Arial,sans-serif"><text font-size="23"><tspan x="25" y="38">Shaded-pole:shorted copper turn and starting field sweep</tspan></text><rect x="150" y="160" width="700" height="140" rx="9" fill="#f1e8fa" stroke="#7936ae" stroke-width="2"/><text font-size="17"><tspan x="162" y="185">Laminated main pole face</tspan></text><rect x="620" y="170" width="170" height="120" fill="#ceaa7a" stroke="#955f24" stroke-width="4"/><text font-size="20"><tspan x="215" y="230">Unshaded part</tspan></text><text font-size="17"><tspan x="625" y="230">Shading loop</tspan></text><path d="M350,320 L720,320" fill="none" stroke="#7936ae" stroke-width="2.5"/><polygon points="720,320 709.0,315.0 709.0,325.0" fill="#7936ae"/><circle cx="500" cy="455" r="100" fill="#f1e8fa" stroke="#7936ae" stroke-width="2.5"/><text font-size="18"><tspan x="443" y="463">Cage rotor</tspan></text><text font-size="18"><tspan x="80" y="585">Flux sweeps unshaded -&gt; shaded;weak starting torque,simple but low-efficiency small-motor</tspan><tspan x="80" y="608">duty.</tspan></text><text font-size="14"><tspan x="25" y="630">Original teaching diagram;conceptual only.Qualified-supervised machine laboratory,not home wiring.</tspan></text></g></svg>