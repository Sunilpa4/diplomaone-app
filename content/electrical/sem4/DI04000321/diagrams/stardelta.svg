<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img"><title>Star-delta functional connections:not a terminal-board layout</title><rect width="1000" height="650" fill="white"/><g fill="#30253d" font-family="Arial,sans-serif"><text font-size="23"><tspan x="25" y="38">Star-delta functional connections:not a terminal-board layout</tspan></text><text font-size="22"><tspan x="130" y="120">STAR:start</tspan></text><path d="M250,220 L250,340" fill="none" stroke="#7936ae" stroke-width="2.5"/><circle cx="250" cy="220" r="7" fill="white" stroke="#7936ae" stroke-width="2.5"/><path d="M105,440 L250,340" fill="none" stroke="#7936ae" stroke-width="2.5"/><circle cx="105" cy="440" r="7" fill="white" stroke="#7936ae" stroke-width="2.5"/><path d="M395,440 L250,340" fill="none" stroke="#7936ae" stroke-width="2.5"/><circle cx="395" cy="440" r="7" fill="white" stroke="#7936ae" stroke-width="2.5"/><circle cx="250" cy="340" r="7" fill="#f1e8fa" stroke="#7936ae" stroke-width="2.5"/><text font-size="18"><tspan x="150" y="510">U2/V2/W2 joined</tspan></text><text font-size="22"><tspan x="620" y="120">DELTA:run</tspan></text><path d="M740,220 L595,440" fill="none" stroke="#7936ae" stroke-width="2.5"/><circle cx="740" cy="220" r="7" fill="white" stroke="#7936ae" stroke-width="2.5"/><path d="M595,440 L885,440" fill="none" stroke="#7936ae" stroke-width="2.5"/><circle cx="595" cy="440" r="7" fill="white" stroke="#7936ae" stroke-width="2.5"/><path d="M885,440 L740,220" fill="none" stroke="#7936ae" stroke-width="2.5"/><circle cx="885" cy="440" r="7" fill="white" stroke="#7936ae" stroke-width="2.5"/><text font-size="18"><tspan x="550" y="510">U1-W2,V1-U2,W1-V2</tspan></text><text font-size="18"><tspan x="45" y="580">Six ends required;delta must be rated at supply voltage.Interlocked Y/Delta contactors must</tspan><tspan x="45" y="603">never overlap.</tspan></text><text font-size="14"><tspan x="25" y="630">Original teaching diagram;conceptual only.Qualified-supervised machine laboratory,not home wiring.</tspan></text></g></svg>