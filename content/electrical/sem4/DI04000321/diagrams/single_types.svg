<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img"><title>Single-phase AC motors:do not misclassify commutator types</title><rect width="1000" height="650" fill="white"/><g fill="#30253d" font-family="Arial,sans-serif"><text font-size="23"><tspan x="25" y="38">Single-phase AC motors:do not misclassify commutator types</tspan></text><rect x="330" y="100" width="340" height="75" rx="9" fill="#f1e8fa" stroke="#7936ae" stroke-width="2"/><text font-size="17"><tspan x="342" y="125">Single-phase supply</tspan></text><path d="M500,175 L196.66666666666666,260" fill="none" stroke="#7936ae" stroke-width="2.5"/><rect x="50.0" y="260" width="273.3333333333333" height="140" rx="9" fill="#f1e8fa" stroke="#7936ae" stroke-width="2"/><text font-size="17"><tspan x="62.0" y="285">Induction:cage rotor +</tspan><tspan x="62.0" y="307">phase-</tspan><tspan x="62.0" y="329">split/capacitor/shading</tspan><tspan x="62.0" y="351">start</tspan></text><path d="M500,175 L490.0,260" fill="none" stroke="#7936ae" stroke-width="2.5"/><rect x="343.3333333333333" y="260" width="273.3333333333333" height="140" rx="9" fill="#f1e8fa" stroke="#7936ae" stroke-width="2"/><text font-size="17"><tspan x="355.3333333333333" y="285">Repulsion:induced wound-</tspan><tspan x="355.3333333333333" y="307">rotor current + shorted</tspan><tspan x="355.3333333333333" y="329">brushes</tspan></text><path d="M500,175 L783.3333333333333,260" fill="none" stroke="#7936ae" stroke-width="2.5"/><rect x="636.6666666666666" y="260" width="273.3333333333333" height="140" rx="9" fill="#f1e8fa" stroke="#7936ae" stroke-width="2"/><text font-size="17"><tspan x="648.6666666666666" y="285">Universal:series</tspan><tspan x="648.6666666666666" y="307">field/armature,AC/DC-rated</tspan><tspan x="648.6666666666666" y="329">commutator</tspan></text><text font-size="19"><tspan x="45" y="485">Reluctance arrangements require the actual saliency/starting design;all are not</tspan><tspan x="45" y="509">ordinary induction motors.</tspan></text><text font-size="14"><tspan x="25" y="630">Original teaching diagram;conceptual only.Qualified-supervised machine laboratory,not home wiring.</tspan></text></g></svg>