<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" role="img"><title>Selection:match the full duty,not only kW</title><rect width="1000" height="550" fill="white"/><g fill="#30253d" font-family="Arial,sans-serif"><text font-size="23"><tspan x="25" y="38">Selection:match the full duty,not only kW</tspan></text><rect x="40" y="180" width="280" height="130" rx="9" fill="#f1e8fa" stroke="#7936ae" stroke-width="2"/><text font-size="17"><tspan x="52" y="205">Load torque / speed /</tspan><tspan x="52" y="227">inertia</tspan></text><path d="M320,245 L355,245" fill="none" stroke="#7936ae" stroke-width="2.5"/><polygon points="355,245 344.0,240.0 344.0,250.0" fill="#7936ae"/><rect x="360" y="180" width="280" height="130" rx="9" fill="#f1e8fa" stroke="#7936ae" stroke-width="2"/><text font-size="17"><tspan x="372" y="205">Starting + thermal +</tspan><tspan x="372" y="227">control capability</tspan></text><path d="M640,245 L675,245" fill="none" stroke="#7936ae" stroke-width="2.5"/><polygon points="675,245 664.0,240.0 664.0,250.0" fill="#7936ae"/><rect x="680" y="180" width="280" height="130" rx="9" fill="#f1e8fa" stroke="#7936ae" stroke-width="2"/><text font-size="17"><tspan x="692" y="205">Rated machine / mounting /</tspan><tspan x="692" y="227">protection</tspan></text><text font-size="19"><tspan x="45" y="410">Check the entire acceleration trajectory and actual load efficiency,then</tspan><tspan x="45" y="434">voltage/frequency/environment.</tspan></text><text font-size="14"><tspan x="25" y="530">Original teaching diagram;conceptual only.Qualified-supervised machine laboratory,not home wiring.</tspan></text></g></svg>