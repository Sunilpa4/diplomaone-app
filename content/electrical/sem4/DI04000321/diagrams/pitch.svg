<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img"><title>Short-pitch winding:side-EMFvector addition</title><rect width="1000" height="650" fill="white"/><g fill="#30253d" font-family="Arial,sans-serif"><text font-size="23"><tspan x="25" y="38">Short-pitch winding:side-EMFvector addition</tspan></text><path d="M150,440 L430,440" fill="none" stroke="#7936ae" stroke-width="2.5"/><polygon points="430,440 419.0,435.0 419.0,445.0" fill="#7936ae"/><path d="M150,440 L392.487,300" fill="none" stroke="#7936ae" stroke-width="2.5"/><polygon points="392.487,300 380.4607207945598,301.1698754090909 385.4607225429982,309.8301284374736" fill="#7936ae"/><path d="M150,440 L672.487,300" fill="none" stroke="#7936ae" stroke-width="2.5"/><polygon points="672.487,300 660.5677205780541,298.0173810094781 663.155911551615,307.6766391323557" fill="#7936ae"/><text font-size="18"><tspan x="380" y="485">One side EMF</tspan></text><text font-size="18"><tspan x="430" y="260">Other side EMF,accounting for coil polarity</tspan></text><text font-size="20"><tspan x="450" y="375">Vector sum</tspan></text><text font-size="21"><tspan x="65" y="120">Coil span=180-epsilon electrical degrees</tspan></text><text font-size="19"><tspan x="65" y="560">Pitch factor kp=cos(epsilon/2);for span150deg,epsilon30deg,kp=0.9659.</tspan></text><text font-size="14"><tspan x="25" y="630">Original teaching diagram;conceptual only.Qualified-supervised machine laboratory,not home wiring.</tspan></text></g></svg>