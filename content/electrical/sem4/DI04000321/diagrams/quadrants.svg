<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img"><title>Four-quadrant signs and energy interpretation</title><rect width="1000" height="650" fill="white"/><g fill="#30253d" font-family="Arial,sans-serif"><text font-size="23"><tspan x="25" y="38">Four-quadrant signs and energy interpretation</tspan></text><path d="M500,480 L500,115" fill="none" stroke="#7936ae" stroke-width="2.5"/><polygon points="500,115 495.0,126.0 505.0,126.0" fill="#7936ae"/><path d="M150,315 L900,315" fill="none" stroke="#7936ae" stroke-width="2.5"/><polygon points="900,315 889.0,310.0 889.0,320.0" fill="#7936ae"/><text font-size="20"><tspan x="520" y="130">+Torque</tspan></text><text font-size="20"><tspan x="790" y="350">+Speed</tspan></text><text font-size="20"><tspan x="560" y="230">Q1:motoring +/+</tspan></text><text font-size="20"><tspan x="155" y="230">Q2:braking -/+</tspan></text><text font-size="20"><tspan x="155" y="425">Q3:motoring -/-</tspan></text><text font-size="20"><tspan x="560" y="425">Q4:braking +/-</tspan></text><text font-size="18"><tspan x="60" y="560">Axes defined as horizontal speed,vertical torque.Pm=T*omega;negative power means mechanical</tspan><tspan x="60" y="583">braking.</tspan></text><text font-size="17"><tspan x="60" y="600">Braking is not automatically mains regeneration;plugging can draw supply power and dissipate</tspan><tspan x="60" y="622">energy.</tspan></text><text font-size="14"><tspan x="25" y="630">Original teaching diagram;conceptual only.Qualified-supervised machine laboratory,not home wiring.</tspan></text></g></svg>