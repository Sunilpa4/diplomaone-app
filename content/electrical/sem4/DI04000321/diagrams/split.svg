<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img"><title>Phase splitting:time-phase difference is not spatial displacement</title><rect width="1000" height="650" fill="white"/><g fill="#30253d" font-family="Arial,sans-serif"><text font-size="23"><tspan x="25" y="38">Phase splitting:time-phase difference is not spatial displacement</tspan></text><path d="M120,430 L450,430" fill="none" stroke="#7936ae" stroke-width="2.5"/><polygon points="450,430 439.0,425.0 439.0,435.0" fill="#7936ae"/><path d="M120,430 L120,130" fill="none" stroke="#7936ae" stroke-width="2.5"/><polygon points="120,130 115.0,141.0 125.0,141.0" fill="#7936ae"/><path d="M120,430 L350,250" fill="none" stroke="#7936ae" stroke-width="2.5"/><polygon points="350,250 338.25590368062603,252.84186587320127 344.4189862972071,260.7169158832771" fill="#7936ae"/><text font-size="18"><tspan x="170" y="470">Main current Im</tspan></text><text font-size="18"><tspan x="160" y="225">Auxiliary current Ia</tspan></text><text font-size="17"><tspan x="205" y="375">phase difference alpha</tspan></text><rect x="570" y="160" width="350" height="230" rx="9" fill="#f1e8fa" stroke="#7936ae" stroke-width="2"/><text font-size="17"><tspan x="582" y="185">Main/auxiliary winding magnetic</tspan><tspan x="582" y="207">axes are also spatially</tspan><tspan x="582" y="229">displaced,commonly90electrical</tspan><tspan x="582" y="251">degrees.</tspan></text><text font-size="20"><tspan x="75" y="550">Starting torque depends on both spatial displacement and current phase</tspan><tspan x="75" y="575">splitting;Tstart ~ Im Ia sin(alpha).</tspan></text><text font-size="14"><tspan x="25" y="630">Original teaching diagram;conceptual only.Qualified-supervised machine laboratory,not home wiring.</tspan></text></g></svg>