<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img"><title>Three-phase rotating field:spatial axes and resultant</title><rect width="1000" height="650" fill="white"/><g fill="#30253d" font-family="Arial,sans-serif"><text font-size="23"><tspan x="25" y="38">Three-phase rotating field:spatial axes and resultant</tspan></text><circle cx="500" cy="330" r="185" fill="white" stroke="#7936ae" stroke-width="2.5"/><path d="M500,330 L645.0,330.0" fill="none" stroke="#7936ae" stroke-width="2.5"/><polygon points="645.0,330.0 634.0,325.0 634.0,335.0" fill="#7936ae"/><text font-size="22"><tspan x="670.0" y="335.0">A</tspan></text><path d="M500,330 L427.5,204.42631645125638" fill="none" stroke="#7936ae" stroke-width="2.5"/><polygon points="427.5,204.42631645125638 428.6698729810778,216.4525958928852 437.3301270189222,211.4525958928852" fill="#7936ae"/><text font-size="22"><tspan x="415.00000000000006" y="187.7756813566454">B</tspan></text><path d="M500,330 L427.49999999999994,455.5736835487436" fill="none" stroke="#7936ae" stroke-width="2.5"/><polygon points="427.49999999999994,455.5736835487436 437.33012701892216,448.54740410711474 428.66987298107773,443.54740410711474" fill="#7936ae"/><text font-size="22"><tspan x="414.99999999999994" y="482.22431864335454">C</tspan></text><path d="M500,330 L630,200" fill="none" stroke="#7936ae" stroke-width="2.5"/><polygon points="630,200 618.6862915010153,204.2426406871193 625.7573593128808,211.31370849898477" fill="#7936ae"/><text font-size="19"><tspan x="655" y="195">Resultant rotates</tspan></text><text font-size="20"><tspan x="150" y="110">Balanced currents +120electrical-degree winding displacement</tspan></text><text font-size="18"><tspan x="145" y="570">Constant fundamental magnitude=1.5Fm;Ns=120f/P.Swap any two phases to reverse sequence.</tspan></text><text font-size="14"><tspan x="25" y="630">Original teaching diagram;conceptual only.Qualified-supervised machine laboratory,not home wiring.</tspan></text></g></sv