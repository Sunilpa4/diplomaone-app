<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img"><title>Reactive compensation reduces Q,not the load real power</title><rect width="1000" height="650" fill="white"/><g fill="#30253d" font-family="Arial,sans-serif"><text font-size="23"><tspan x="25" y="38">Reactive compensation reduces Q,not the load real power</tspan></text><path d="M150,490 L700,490" fill="none" stroke="#7936ae" stroke-width="2.5"/><polygon points="700,490 689.0,485.0 689.0,495.0" fill="#7936ae"/><path d="M700,490 L700,165" fill="none" stroke="#7936ae" stroke-width="2.5"/><path d="M150,490 L700,165" fill="none" stroke="#7936ae" stroke-width="2.5"/><path d="M150,490 L700,345" fill="none" stroke="#7936ae" stroke-width="2.5"/><path d="M735,165 L735,345" fill="none" stroke="#7936ae" stroke-width="2.5"/><polygon points="735,345 740.0,334.0 730.0,334.0" fill="#7936ae"/><text font-size="18"><tspan x="350" y="530">P unchanged except added losses</tspan></text><text font-size="18"><tspan x="745" y="250">Leading Qc</tspan></text><text font-size="18"><tspan x="570" y="140">Initial Qlag</tspan></text><text font-size="18"><tspan x="605" y="385">Target Qlag</tspan></text><text font-size="19"><tspan x="55" y="595">Qc=P(tan(phi1)-tan(phi2));synchronous condenser still draws real loss power.</tspan></text><text font-size="14"><tspan x="25" y="630">Original teaching diagram;conceptual only.Qualified-supervised machine laboratory,not home wiring.</tspan></text></g></svg>