<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img"><title>Induction-motor phasors:reference,voltage drops and lagging current</title><rect width="1000" height="650" fill="white"/><g fill="#30253d" font-family="Arial,sans-serif"><text font-size="23"><tspan x="25" y="38">Induction-motor phasors:reference,voltage drops and lagging current</tspan></text><path d="M100,370 L650,370" fill="none" stroke="#7936ae" stroke-width="2.5"/><polygon points="650,370 639.0,365.0 639.0,375.0" fill="#7936ae"/><path d="M650,370 L710,410" fill="none" stroke="#7936ae" stroke-width="2.5"/><polygon points="710,410 703.6209477434099,399.7380463698333 698.0739457811576,408.0585493132117" fill="#7936ae"/><path d="M710,410 L810,260" fill="none" stroke="#7936ae" stroke-width="2.5"/><polygon points="810,260 799.7380463698332,266.37905225659017 808.0585493132116,271.9260542188424" fill="#7936ae"/><path d="M100,370 L810,260" fill="none" stroke="#7936ae" stroke-width="2.5"/><polygon points="810,260 798.3641724173348,256.7430817531774 799.8952023624223,266.62518412601514" fill="#7936ae"/><text font-size="19"><tspan x="500" y="405">E1</tspan></text><text font-size="20"><tspan x="810" y="240">V1</tspan></text><text font-size="17"><tspan x="615" y="455">R1I1 then jX1I1</tspan></text><path d="M100,370 L325,520" fill="none" stroke="#7936ae" stroke-width="2.5"/><polygon points="325,520 318.62094774340983,509.7380463698332 313.0739457811576,518.0585493132116" fill="#7936ae"/><text font-size="18"><tspan x="280" y="555">I1lagging</tspan></text><text font-size="20"><tspan x="55" y="130">Convention:V1=E1+I1(R1+jX1);I1=I0+I2-referred</tspan></text><text font-size="17"><tspan x="50" y="600">Qualitative phasors,not to scale;current adds vectorially and magnetising current remains at light</tspan><tspan x="50" y="622">load.</tspan></text><text font-size="14"><tspan x="25" y="630">Original teaching diagram;conceptual only.Qualified-supervised machine laboratory,not home wiring.</tspan></text></g></svg>