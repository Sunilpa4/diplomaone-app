<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img"><title>Different torque definitions are not interchangeable</title><rect width="1000" height="650" fill="white"/><g fill="#30253d" font-family="Arial,sans-serif"><text font-size="23"><tspan x="25" y="38">Different torque definitions are not interchangeable</tspan></text><rect x="330" y="100" width="340" height="75" rx="9" fill="#f1e8fa" stroke="#7936ae" stroke-width="2"/><text font-size="17"><tspan x="342" y="125">Synchronous motor torque</tspan></text><path d="M500,175 L196.66666666666666,260" fill="none" stroke="#7936ae" stroke-width="2.5"/><rect x="50.0" y="260" width="273.3333333333333" height="140" rx="9" fill="#f1e8fa" stroke="#7936ae" stroke-width="2"/><text font-size="17"><tspan x="62.0" y="285">Starting:provided by damper</tspan><tspan x="62.0" y="307">/ pony / drive method</tspan></text><path d="M500,175 L490.0,260" fill="none" stroke="#7936ae" stroke-width="2.5"/><rect x="343.3333333333333" y="260" width="273.3333333333333" height="140" rx="9" fill="#f1e8fa" stroke="#7936ae" stroke-width="2"/><text font-size="17"><tspan x="355.3333333333333" y="285">Pull-in:capture under</tspan><tspan x="355.3333333333333" y="307">stated load,inertia and</tspan><tspan x="355.3333333333333" y="329">excitation</tspan></text><path d="M500,175 L783.3333333333333,260" fill="none" stroke="#7936ae" stroke-width="2.5"/><rect x="636.6666666666666" y="260" width="273.3333333333333" height="140" rx="9" fill="#f1e8fa" stroke="#7936ae" stroke-width="2"/><text font-size="17"><tspan x="648.6666666666666" y="285">Pull-out:maximum steady</tspan><tspan x="648.6666666666666" y="307">locked torque before loss</tspan><tspan x="648.6666666666666" y="329">of step</tspan></text><text font-size="19"><tspan x="45" y="485">A flat synchronous speed characteristic is not unlimited torque capability.</tspan></text><text font-size="14"><tspan x="25" y="630">Original teaching diagram;conceptual only.Qualified-supervised machine laboratory,not home wiring.</tspan></text></g></svg>