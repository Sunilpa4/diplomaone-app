font-size="19"><tspan x="50" y="545">Wound rotor terminals permit external resistance;cut out stages as acceleration</tspan><tspan x="50" y="569">proceeds.</tspan></text><text font-size="18"><tspan x="50" y="590">Do not open an energised rotor circuit casually;use the approved starter and guards.</tspan></text><text font-size="14"><tspan x="25" y="630">Original teaching diagram;conceptual only.Qualified-supervised machine laboratory,not home wiring.</tspan></text></g></svg>