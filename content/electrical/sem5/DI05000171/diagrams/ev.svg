<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-label="AC EVSE and DC charger are different interfaces"><rect width="960" height="420" fill="white"/><text x="26" y="35" font-size="22" fill="#392748">AC EVSE and DC charger are different interfaces</text><rect x="50.0" y="100" width="263.3333333333333" height="100" rx="7" fill="#f2e9f9" stroke="#9870b6" stroke-width="2"/><text x="62.0" y="156.0" font-size="17" fill="#392748">AC EVSE</text><text x="62.0" y="172" font-size="15" fill="#392748">protected AC / signalling</text><path d="M313.3333333333333 145 L337.3333333333333 145" fill="none" stroke="#7542a0" stroke-width="3"/><text x="328.3333333333333" y="151" font-size="24" fill="#392748">›</text><rect x="343.3333333333333" y="100" width="263.3333333333333" height="100" rx="7" fill="#f2e9f9" stroke="#9870b6" stroke-width="2"/><text x="355.3333333333333" y="156.0" font-size="17" fill="#392748">On-board charger</text><text x="355.3333333333333" y="172" font-size="15" fill="#392748">AC–DC + isolation</text><path d="M606.6666666666666 145 L630.6666666666666 145" fill="none" stroke="#7542a0" stroke-width="3"/><text x="621.6666666666666" y="151" font-size="24" fill="#392748">›</text><rect x="636.6666666666666" y="100" width="263.3333333333333" height="100" rx="7" fill="#f2e9f9" stroke="#9870b6" stroke-width="2"/><text x="648.6666666666666" y="156.0" font-size="17" fill="#392748">Battery / BMS</text><text x="648.6666666666666" y="172" font-size="15" fill="#392748">charge permission</text><text x="45" y="265" font-size="17" fill="#392748">DC fast charger performs conversion off-board; classroom model is not a traction-battery charger.</text><text x="26" y="402" font-size="13" fill="#392748">Conceptual / ideal classroom diagram • not an approved power construction drawing</text></svg>