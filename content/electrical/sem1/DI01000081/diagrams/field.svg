-size="17">Right-hand grip:thumb=current,fingers=field.For a solenoid,fingers follow</text><text x="30" y="557" font-size="17">conventional winding current,thumb points to N.Anticlockwise end current gives N.</text><text x="25" y="606" font-size="13">Original teaching schematic · illustrative values · not a live-wiring instruction</text></svg>