<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif" fill="#30303b"><rect width="900" height="620" fill="white"/><text x="25" y="35" font-size="22">Lenz law:oppose change,not necessarily the original field</text><rect x="90" y="160" width="270" height="75" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="100" y="186" font-size="18">Increasing linked flux</text><path d="M370 200L480 200" stroke="#2679ad" stroke-width="3" fill="none"/><path d="M468.94726807196537 204.6730201077038L480 200L468.94726807196537 195.3269798922962" stroke="#2679ad" stroke-width="3" fill="none"/><rect x="490" y="160" width="300" height="75" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="500" y="186" font-size="18">Induced emf / current</text><text x="150" y="360" font-size="24">Induced magnetic effect OPPOSES the change</text><text x="130" y="440" font-size="21">It does not always oppose the existing field</text><text x="30" y="535" font-size="17">An emf may exist in an open circuit without circulating current.Energy conservation</text><text x="30" y="557" font-size="17">explains the opposing effect when a circuit is closed.</text><text x="25" y="606" font-size="13">Original teaching schematic · illustrative values · not a live-wiring instruction</text></svg>