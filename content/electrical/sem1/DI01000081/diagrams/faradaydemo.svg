iner only.Change linked flux by moving the</text><text x="30" y="557" font-size="17">magnet;hold it still to distinguish field from flux change.Indicator polarity depends</text><text x="30" y="579" font-size="17">on coil connections and motion direction;do not invent readings.</text><text x="25" y="606" font-size="13">Original teaching schematic · illustrative values · not a live-wiring instruction</text></svg>