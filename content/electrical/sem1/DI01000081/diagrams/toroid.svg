642793458187 169.1152462233667" stroke="#be6633" stroke-width="7" fill="none"/><path d="M518.4736339605838 247.02483582706563L591.7796706442285 225.20469917945445" stroke="#be6633" stroke-width="7" fill="none"/><text x="170" y="480" font-size="22">Closed-path geometry;core material chosen separately</text><text x="30" y="535" font-size="17">Often reduces external leakage versus comparable open geometries,but never guarantees</text><text x="30" y="557" font-size="17">zero leakage.Material,gap,winding and current determine performance.</text><text x="25" y="606" font-size="13">Original teaching schematic · illustrative values · not a live-wiring instruction</text></svg>