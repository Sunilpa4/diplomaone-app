<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif" fill="#30303b"><rect width="900" height="620" fill="white"/><text x="25" y="35" font-size="22">Passive component measurement:meter and isolated DUT</text><rect x="90" y="190" width="260" height="230" fill="#e9e2f1" stroke="#765099" stroke-width="2"/><text x="145" y="245" font-size="24">DMM / LCR</text><rect x="125" y="275" width="190" height="60" fill="#e2f2ee" stroke="#765099" stroke-width="2"/><text x="145" y="315" font-size="18">Selected mode</text><circle cx="350" cy="250" r="5" fill="#be6633" stroke="#765099" stroke-width="3"/><circle cx="350" cy="370" r="5" fill="#765099" stroke="#765099" stroke-width="3"/><rect x="550" y="225" width="180" height="170" fill="#e9e2f1" stroke="#765099" stroke-width="2"/><text x="590" y="285" font-size="26">DUT</text><text x="580" y="330" font-size="22">R / L / C</text><path d="M350 250L450 250" stroke="#be6633" stroke-width="3" fill="none"/><path d="M450 250L450 270" stroke="#be6633" stroke-width="3" fill="none"/><path d="M450 270L550 270" stroke="#be6633" stroke-width="3" fill="none"/><path d="M350 370L450 370" stroke="#765099" stroke-width="3" fill="none"/><path d="M450 370L450 470" stroke="#765099" stroke-width="3" fill="none"/><path d="M450 470L800 470" stroke="#765099" stroke-width="3" fill="none"/><path d="M800 470L800 350" stroke="#765099" stroke-width="3" fill="none"/><path d="M800 350L730 350" stroke="#765099" stroke-width="3" fill="none"/><text x="420" y="140" font-size="21">Isolated,de-energised component</text><text x="30" y="535" font-size="17">Choose the correct resistance,capacitance or LCR function before connecting.Verify no</text><text x="30" y="557" font-size="17">external/residual voltage first;discharge capacitors by the approved method.Record</text><text x="30" y="579" font-size="17">test frequency and equivalent model where relevant.</text><text x="25" y="606" font-size="13">Original teaching schematic · illustrative values · not a live-wiring instruction</text></svg>