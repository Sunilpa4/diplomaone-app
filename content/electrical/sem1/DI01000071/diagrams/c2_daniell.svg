cap="round"/><text x="110" y="245" style="font-size:10.5px;fill:#94a3b8;text-anchor:end;font-weight:700">Zn</text><path d="M 514 150 L 526 150 L 526 340 L 514 340 Z" fill="#fde68a" stroke="#b45309" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><text x="540" y="245" style="font-size:10.5px;fill:#b45309;text-anchor:start;font-weight:700">Cu</text><text x="130" y="358" style="font-size:10px;fill:#475569;text-anchor:middle">zinc rod</text><text x="520" y="358" style="font-size:10px;fill:#475569;text-anchor:middle">copper rod</text><path d="M 130 150 L 130 108 L 352 108" fill="none" stroke="#111827" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><path d="M 352 108 L 520 108 L 520 150" fill="none" stroke="#111827" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><circle cx="352" cy="108" r="20" fill="#ffffff" stroke="#111827" stroke-width="1.8"/><text x="352" y="113" style="font-size:13px;fill:#111827;text-anchor:middle;font-weight:700">V</text><text x="352" y="74" style="font-size:10.5px;fill:#7c3aed;text-anchor:middle;font-weight:700">voltmeter reads 1.10 V</text><line x1="180" y1="92" x2="292" y2="92" stroke="#b91c1c" stroke-width="1.5" stroke-linecap="round"/><path d="M 300 92 L 292 95.6 L 292 88.4 Z" fill="#b91c1c"/><text x="240" y="84" style="font-size:10px;fill:#b91c1c;text-anchor:middle;font-weight:700">e⁻</text><line x1="404" y1="92" x2="512" y2="92" stroke="#b91c1c" stroke-width="1.5" stroke-linecap="round"/><path d="M 520 92 L 512 95.6 L 512 88.4 Z" fill="#b91c1c"/><text x="462" y="84" style="font-size:10px;fill:#b91c1c;text-anchor:middle;font-weight:700">e⁻</text><text x="352" y="152" style="font-size:9.5px;fill:#475569;text-anchor:middle">electron flow in the wire: zinc → copper</text><path d="M 264 292 L 264 238 Q 365 222 466 238 L 466 292" fill="none" stroke="#7c3aed" stroke-width="6" stroke-linecap="round" opacity="0.25"/><path d="M 264 292 L 264 238 Q 365 222 466 238 L 466 292" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round"/><text x="360" y="216" style="font-size:10px;fill:#7c3aed;text-anchor:middle;font-weight:700">salt bridge (KCl)</text><text x="170" y="206" style="font-size:10.5px;fill:#b91c1c;text-anchor:middle;font-weight:700">Anode  (−)  ·  oxidation</text><text x="560" y="206" style="font-size:10.5px;fill:#1d4ed8;text-anchor:middle;font-weight:700">Cathode  (+)  ·  reduction</text><line x1="162" y1="300" x2="195" y2="300" stroke="#b91c1c" stroke-width="1.3" stroke-linecap="round"/><path d="M 202 300 L 195 303.15 L 195 296.85 Z" fill="#b91c1c"/><text x="210" y="304" style="font-size:9.2px;fill:#b91c1c;text-anchor:start;font-weight:700">Zn²⁺</text><line x1="602" y1="300" x2="567" y2="300" stroke="#1d4ed8" stroke-width="1.3" stroke-linecap="round"/><path d="M 560 300 L 567 296.85 L 567 303.15 Z" fill="#1d4ed8"/><text x="612" y="304" style="font-size:9.2px;fill:#1d4ed8;text-anchor:start;font-weight:700">Cu²⁺</text><path d="M 40 404 L 720 404 L 720 506 L 40 506 Z" fill="#faf9ff" stroke="#e6e1f4" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="56" y="428" style="font-size:11px;fill:#b91c1c;text-anchor:start;font-weight:700">At the anode:   Zn(s) → Zn²⁺(aq) + 2e⁻      (oxidation)</text><text x="56" y="450" style="font-size:11px;fill:#1d4ed8;text-anchor:start;font-weight:700">At the cathode: Cu²⁺(aq) + 2e⁻ → Cu(s)      (reduction)</text><text x="56" y="472" style="font-size:11px;fill:#111827;text-anchor:start">Cell reaction:  Zn(s) + Cu²⁺(aq) → Zn²⁺(aq) + Cu(s)      E°cell = 0.34 − (−0.76) = 1.10 V</text><text x="56" y="494" style="font-size:9.8px;fill:#475569;text-anchor:start">Cell notation:  Zn | Zn²⁺ (1 M) ‖ Cu²⁺ (1 M) | Cu        anode on the left, cathode on the right</text></svg>