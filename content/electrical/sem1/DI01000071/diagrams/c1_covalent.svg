<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="100%" style="max-width:760px;height:auto;display:block;margin:0 auto;background:#ffffff" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><text x="380" y="26" style="font-size:13px;fill:#334155;text-anchor:middle;font-weight:700">COVALENT BOND — SHARING OF ELECTRON PAIRS (DOT STRUCTURES)</text><text x="90" y="118" style="font-size:16px;fill:#111827;text-anchor:middle;font-weight:700">H</text><text x="200" y="118" style="font-size:16px;fill:#111827;text-anchor:middle;font-weight:700">H</text><circle cx="140" cy="112" r="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="3.0"/><circle cx="160" cy="112" r="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="3.0"/><text x="145" y="62" style="font-size:10.5px;fill:#1d4ed8;text-anchor:middle;font-weight:700">H₂ — single bond (1 shared pair)</text><text x="145" y="148" style="font-size:9.5px;fill:#475569;text-anchor:middle">both atoms reach a duplet</text><text x="320" y="118" style="font-size:16px;fill:#111827;text-anchor:middle;font-weight:700">O</text><text x="430" y="118" style="font-size:16px;fill:#111827;text-anchor:middle;font-weight:700">O</text><circle cx="362" cy="105" r="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="3.0"/><circle cx="380" cy="105" r="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="3.0"/><circle cx="362" cy="119" r="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="3.0"/><circle cx="380" cy="119" r="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="3.0"/><circle cx="300" cy="105" r="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="3.0"/><circle cx="300" cy="119" r="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="3.0"/><circle cx="450" cy="105" r="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="3.0"/><circle cx="450" cy="119" r="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="3.0"/><text x="375" y="62" style="font-size:10.5px;fill:#1d4ed8;text-anchor:middle;font-weight:700">O₂ — double bond (2 shared pairs)</text><text x="375" y="148" style="font-size:9.5px;fill:#475569;text-anchor:middle">each O also carries 2 lone pairs</text><text x="590" y="118" style="font-size:16px;fill:#111827;text-anchor:middle;font-weight:700">N</text><text x="700" y="118" style="font-size:16px;fill:#111827;text-anchor:middle;font-weight:700">N</text><circle cx="632" cy="102" r="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="3.0"/><circle cx="650" cy="102" r="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="3.0"/><circle cx="632" cy="112" r="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="3.0"/><circle cx="650" cy="112" r="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="3.0"/><circle cx="632" cy="122" r="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="3.0"/><circle cx="650" cy="122" r="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="3.0"/><circle cx="570" cy="106" r="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="3.0"/><circle cx="570" cy="118" r="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="3.0"/><circle cx="720" cy="106" r="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="3.0"/><circle cx="720" cy="118" r="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="3.0"/><text x="645" y="62" style="font-size:10.5px;fill:#1d4ed8;text-anchor:middle;font-weight:700">N₂ — triple bond (3 shared pairs)</text><text x="645" y="148" style="font-size:9.5px;fill:#475569;text-anchor:middle">one lone pair left on each N</text><text x="130" y="196" style="font-size:10.5px;fill:#1d4ed8;text-anchor:middle;font-weight:700">CH₄ — four single bonds</text><text x="130" y="350" style="font-size:9.5px;fill:#475569;text-anchor:middle">tetrahedral, bond angle 109.5°</text><circle cx="130" cy="292" r="20" fill="#f8fafc" stroke="#111827" stroke-width="1.7"/><text x="130" y="298" style="font-size:13px;fill:#111827;text-anchor:middle;font-weight:700">C</text><line x1="130" y1="272" x2="130" y2="238" stroke="#111827" stroke-width="1.8" stroke-linecap="round"/><circle cx="130" cy="226" r="13" fill="#ffffff" stroke="#111827" stroke-width="1.5"/><text x="130" y="231" style="font-size:11.5px;fill:#111827;text-anchor:middle;font-weight:700">H</text><line x1="148.79" y1="298.84" x2="180.74" y2="310.47" stroke="#111827" stroke-width="1.8" stroke-linecap="round"/><circle cx="192.02" cy="314.57" r="13" fill="#ffffff" stroke="#111827" stroke-width="1.5"/><text x="192.02" y="319.57" style="font-size:11.5px;fill:#111827;text-anchor:middle;font-weight:700">H</text><line x1="111.21" y1="285.16" x2="79.26" y2="273.53" stroke="#111827" stroke-width="1.8" stroke-linecap="round"/><circle cx="67.98" cy="269.43" r="13" fill="#ffffff" stroke="#111827" stroke-width="1.5"/><text x="67.98" y="274.43" style="font-size:11.5px;fill:#111827;text-anchor:middle;font-weight:700">H</text><line x1="140" y1="274.68" x2="157" y2="245.23" stroke="#111827" stroke-width="1.8" stroke-linecap="round"/><circle cx="163" cy="234.84" r="13" fill="#ffffff" stroke="#111827" stroke-width="1.5"/><text x="163" y="239.84" style="font-size:11.5px;fill:#111827;text-anchor:middle;font-weight:700">H</text><text x="400" y="200" style="font-size:10.5px;fill:#1d4ed8;text-anchor:middle;font-weight:700">HCl — polar covalent bond</text><text x="352" y="282" style="font-size:16px;fill:#111827;text-anchor:middle;font-weight:700">H</text><line x1="372" y1="276" x2="430" y2="276" stroke="#111827" stroke-width="1.8" stroke-linecap="round"/><text x="446" y="282" style="font-size:16px;fill:#047857;text-anchor:middle;font-weight:700">Cl</text><circle cx="400" cy="276" r="3" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="3.0"/><circle cx="410" cy="276" r="3" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="3.0"/><text x="356" y="252" style="font-size:10px;fill:#b91c1c;text-anchor:middle;font-weight:700">δ+</text><text x="452" y="252" style="font-size:10px;fill:#1d4ed8;text-anchor:middle;font-weight:700">δ−</text><text x="400" y="322" style="font-size:9.5px;fill:#475569;text-anchor:middle">the shared pair lies nearer chlorine</text><text x="620" y="200" style="font-size:10.5px;fill:#1d4ed8;text-anchor:middle;font-weight:700">H₂O — two bonds, two lone pairs</text><line x1="606.07" y1="278.25" x2="562.66" y2="247.85" stroke="#111827" stroke-width="1.8" stroke-linecap="round"/><text x="562.66" y="252.85" style="font-size:12px;fill:#111827;text-anchor:middle;font-weight:700">H</text><line x1="633.93" y1="278.25" x2="677.34" y2="247.85" stroke="#111827" stroke-width="1.8" stroke-linecap="round"/><text x="677.34" y="252.85" style="font-size:12px;fill:#111827;text-anchor:middle;font-weight:700">H</text><circle cx="620" cy="288" r="17" fill="#dcfce7" stroke="#047857" stroke-width="1.7"/><text x="620" y="293" style="font-size:12px;fill:#047857;text-anchor:middle;font-weight:700">O</text><circle cx="612" cy="258" r="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="3.0"/><circle cx="628" cy="258" r="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="3.0"/><text x="620" y="372" style="font-size:9.5px;fill:#475569;text-anchor:middle">bond angle 104.5° — water is polar</text><text x="380" y="406" style="font-size:11.5px;fill:#475569;text-anchor:middle">A covalent bond forms by sharing of electron pairs, so that each atom attains a stable octet (or duplet).</text><text x="380" y="430" style="font-size:11.5px;fill:#475569;text-anchor:middle">Non-polar: H₂, O₂, N₂, CH₄ — equal sharing.   Polar: HCl, H₂O, NH₃ — the pair is pulled towards the more electronegative atom.</text><text x="380" y="452" style="font-size:11.5px;fill:#475569;text-anchor:middle">The bond is directional, which is why every molecule has a definite shape.</text></svg>