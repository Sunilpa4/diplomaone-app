<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="100%" style="max-width:760px;height:auto;display:block;margin:0 auto;background:#ffffff" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><text x="380" y="26" style="font-size:13px;fill:#334155;text-anchor:middle;font-weight:700">FLUID AND BOUNDARY LUBRICATION</text><path d="M 30 44 L 370 44 L 370 396 L 30 396 Z" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="200" y="66" style="font-size:10.6px;fill:#0891b2;text-anchor:middle;font-weight:700">FLUID  ·  thick film</text><path d="M 80 96 L 320 96 L 320 124 L 80 124 Z" fill="#cbd5e1" stroke="#111827" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><path d="M 80 224 L 320 224 L 320 252 L 80 252 Z" fill="#cbd5e1" stroke="#111827" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><path d="M 80 124 L 320 124 L 320 224 L 80 224 Z" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="200" y="178" style="font-size:9.4px;fill:#1d4ed8;text-anchor:middle;font-weight:700">oil film 0.02–0.1 mm</text><text x="200" y="196" style="font-size:8.4px;fill:#475569;text-anchor:middle">no metal-to-metal contact</text><text x="200" y="278" style="font-size:9.0px;fill:#334155;text-anchor:middle">Moving surfaces are separated</text><text x="200" y="296" style="font-size:9.0px;fill:#334155;text-anchor:middle">completely by a continuous</text><text x="200" y="314" style="font-size:9.0px;fill:#334155;text-anchor:middle">film of liquid lubricant.</text><text x="200" y="344" style="font-size:8.6px;fill:#475569;text-anchor:middle">Friction depends only on the</text><text x="200" y="360" style="font-size:8.6px;fill:#475569;text-anchor:middle">viscosity of the oil — Newton’s law.</text><path d="M 390 44 L 730 44 L 730 396 L 390 396 Z" fill="#fdf4ff" stroke="#e9d5ff" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="560" y="66" style="font-size:10.6px;fill:#7c3aed;text-anchor:middle;font-weight:700">BOUNDARY  ·  thin film</text><path d="M 440 120 L 680 120 L 680 148 L 440 148 Z" fill="#cbd5e1" stroke="#111827" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><path d="M 440 160 L 680 160 L 680 188 L 440 188 Z" fill="#cbd5e1" stroke="#111827" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><line x1="440" y1="154" x2="680" y2="154" stroke="#7c3aed" stroke-width="2.2" stroke-linecap="round"/><text x="560" y="112" style="font-size:8.4px;fill:#475569;text-anchor:middle">oil film only a few molecules thick</text><text x="560" y="206" style="font-size:9.0px;fill:#334155;text-anchor:middle">asperities touch — the film is</text><text x="560" y="224" style="font-size:9.0px;fill:#334155;text-anchor:middle">broken at the high spots</text><text x="560" y="252" style="font-size:8.6px;fill:#475569;text-anchor:middle">Used at start-up, at very slow</text><text x="560" y="268" style="font-size:8.6px;fill:#475569;text-anchor:middle">speed, high load or high</text><text x="560" y="284" style="font-size:8.6px;fill:#475569;text-anchor:middle">temperature.</text><text x="560" y="316" style="font-size:8.6px;fill:#334155;text-anchor:middle">Additives (fatty acids, esters) stick</text><text x="560" y="332" style="font-size:8.6px;fill:#334155;text-anchor:middle">to the metal and carry the load.</text><text x="380" y="416" style="font-size:9.0px;fill:#475569;text-anchor:middle">The Stribeck curve: as speed rises the film thickens and boundary gives way to fluid lubrication.</text></svg>