<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="100%" style="max-width:760px;height:auto;display:block;margin:0 auto;background:#ffffff" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><text x="380" y="26" style="font-size:13px;fill:#334155;text-anchor:middle;font-weight:700">MUNICIPAL WATER TREATMENT — FROM RIVER TO TAP</text><path d="M 30 60 L 156 60 L 156 106 L 30 106 Z" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="93" y="83" style="font-size:9.0px;fill:#1d4ed8;text-anchor:middle;font-weight:700">Screening</text><text x="93" y="118" style="font-size:7.4px;fill:#475569;text-anchor:middle">bar screens</text><text x="93" y="131" style="font-size:7.4px;fill:#475569;text-anchor:middle">rags, sticks</text><text x="93" y="144" style="font-size:7.4px;fill:#475569;text-anchor:middle">fish</text><line x1="158" y1="84" x2="166" y2="84" stroke="#94a3b8" stroke-width="1.3" stroke-linecap="round"/><path d="M 172 84 L 166 86.7 L 166 81.3 Z" fill="#94a3b8"/><path d="M 174 60 L 300 60 L 300 106 L 174 106 Z" fill="#f0f9ff" stroke="#cbd5e1" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="237" y="83" style="font-size:9.0px;fill:#0891b2;text-anchor:middle;font-weight:700">Sedimentation</text><text x="237" y="118" style="font-size:7.4px;fill:#475569;text-anchor:middle">2–4 h settling</text><text x="237" y="131" style="font-size:7.4px;fill:#475569;text-anchor:middle">grit and silt</text><line x1="302" y1="84" x2="310" y2="84" stroke="#94a3b8" stroke-width="1.3" stroke-linecap="round"/><path d="M 316 84 L 310 86.7 L 310 81.3 Z" fill="#94a3b8"/><path d="M 318 60 L 444 60 L 444 106 L 318 106 Z" fill="#fef9c3" stroke="#cbd5e1" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="381" y="83" style="font-size:9.0px;fill:#b45309;text-anchor:middle;font-weight:700">Coagulation</text><text x="381" y="118" style="font-size:7.4px;fill:#475569;text-anchor:middle">alum 20–50 ppm</text><text x="381" y="131" style="font-size:7.4px;fill:#475569;text-anchor:middle">floc 30 min</text><line x1="446" y1="84" x2="454" y2="84" stroke="#94a3b8" stroke-width="1.3" stroke-linecap="round"/><path d="M 460 84 L 454 86.7 L 454 81.3 Z" fill="#94a3b8"/><path d="M 462 60 L 588 60 L 588 106 L 462 106 Z" fill="#f5f3ff" stroke="#cbd5e1" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="525" y="83" style="font-size:9.0px;fill:#7c3aed;text-anchor:middle;font-weight:700">Filtration</text><text x="525" y="118" style="font-size:7.4px;fill:#475569;text-anchor:middle">sand filter</text><text x="525" y="131" style="font-size:7.4px;fill:#475569;text-anchor:middle">1.2–1.4 m bed</text><line x1="590" y1="84" x2="598" y2="84" stroke="#94a3b8" stroke-width="1.3" stroke-linecap="round"/><path d="M 604 84 L 598 86.7 L 598 81.3 Z" fill="#94a3b8"/><path d="M 606 60 L 732 60 L 732 106 L 606 106 Z" fill="#f0fdf4" stroke="#cbd5e1" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="669" y="83" style="font-size:9.0px;fill:#047857;text-anchor:middle;font-weight:700">Chlorination</text><text x="669" y="118" style="font-size:7.4px;fill:#475569;text-anchor:middle">0.2–0.5 mg/L</text><text x="669" y="131" style="font-size:7.4px;fill:#475569;text-anchor:middle">30 min contact</text><path d="M 30 178 L 730 178 L 730 182 L 30 182 Z" fill="#e6e1f4" stroke="#e6e1f4" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><path d="M 70 356 L 390 356 L 390 200 L 70 200 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="0" stroke-linejoin="round" stroke-linecap="round"/><line x1="70" y1="356" x2="390" y2="356" stroke="#111827" stroke-width="1.2" stroke-linecap="round"/><line x1="70" y1="356" x2="70" y2="200" stroke="#111827" stroke-width="1.2" stroke-linecap="round"/><text x="230" y="374" style="font-size:8.4px;fill:#475569;text-anchor:middle">chlorine dose →</text><text x="70" y="194" style="font-size:8.0px;fill:#475569;text-anchor:middle">residual Cl₂ ↑</text><line x1="70" y1="340" x2="140" y2="300" stroke="#1d4ed8" stroke-width="1.8" stroke-linecap="round"/><line x1="140" y1="300" x2="200" y2="290" stroke="#1d4ed8" stroke-width="1.8" stroke-linecap="round"/><line x1="200" y1="290" x2="250" y2="292" stroke="#1d4ed8" stroke-width="1.8" stroke-linecap="round"/><line x1="250" y1="292" x2="300" y2="268" stroke="#1d4ed8" stroke-width="1.8" stroke-linecap="round"/><line x1="300" y1="268" x2="352" y2="232" stroke="#1d4ed8" stroke-width="1.8" stroke-linecap="round"/><line x1="352" y1="232" x2="386" y2="214" stroke="#1d4ed8" stroke-width="1.8" stroke-linecap="round"/><text x="250" y="312" style="font-size:8.4px;fill:#b91c1c;text-anchor:middle;font-weight:700">break point</text><text x="480" y="200" style="font-size:9.6px;fill:#334155;text-anchor:start;font-weight:700">Break-point chlorination</text><text x="480" y="224" style="font-size:8.6px;fill:#475569;text-anchor:start">Initial chlorine kills bacteria and oxidises</text><text x="480" y="242" style="font-size:8.6px;fill:#475569;text-anchor:start">organic matter, so the residual falls.</text><text x="480" y="260" style="font-size:8.6px;fill:#475569;text-anchor:start">After the break point every extra mg/L stays</text><text x="480" y="278" style="font-size:8.6px;fill:#475569;text-anchor:start">as free chlorine and protects the water</text><text x="480" y="296" style="font-size:8.6px;fill:#475569;text-anchor:start">right through the distribution mains.</text><text x="480" y="314" style="font-size:8.6px;fill:#475569;text-anchor:start"></text><text x="480" y="332" style="font-size:8.6px;fill:#475569;text-anchor:start">IS 10500 drinking-water limits: pH 6.5–8.5,</text><text x="480" y="350" style="font-size:8.6px;fill:#475569;text-anchor:start">turbidity 1 NTU, TDS 500–2000 mg/L,</text><text x="480" y="368" style="font-size:8.6px;fill:#475569;text-anchor:start">hardness 200–600 mg/L, chloride 250–1000 mg/L.</text></svg>