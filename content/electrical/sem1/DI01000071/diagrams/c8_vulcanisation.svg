<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="100%" style="max-width:760px;height:auto;display:block;margin:0 auto;background:#ffffff" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><text x="380" y="26" style="font-size:13px;fill:#334155;text-anchor:middle;font-weight:700">VULCANISATION OF NATURAL RUBBER</text><path d="M 30 44 L 370 44 L 370 250 L 30 250 Z" fill="#fef2f2" stroke="#fecaca" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="200" y="66" style="font-size:10.6px;fill:#b91c1c;text-anchor:middle;font-weight:700">Before — raw rubber</text><path d="M 60 96 L 100 104 L 140 88 L 180 104 L 220 88 L 260 104 L 300 88 L 340 104" fill="none" stroke="#b91c1c" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round"/><path d="M 60 142 L 100 150 L 140 134 L 180 150 L 220 134 L 260 150 L 300 134 L 340 150" fill="none" stroke="#b91c1c" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round"/><path d="M 60 188 L 100 196 L 140 180 L 180 196 L 220 180 L 260 196 L 300 180 L 340 196" fill="none" stroke="#b91c1c" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round"/><text x="200" y="224" style="font-size:8.6px;fill:#475569;text-anchor:middle">separate, coiled chains — soft, sticky,</text><text x="200" y="240" style="font-size:8.6px;fill:#475569;text-anchor:middle">weak, swells in petrol, hardens in cold</text><path d="M 390 44 L 730 44 L 730 250 L 390 250 Z" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="560" y="66" style="font-size:10.6px;fill:#047857;text-anchor:middle;font-weight:700">After — vulcanised rubber</text><path d="M 430 96 L 470 104 L 510 88 L 550 104 L 590 88 L 630 104 L 670 88 L 710 104" fill="none" stroke="#047857" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round"/><path d="M 430 142 L 470 150 L 510 134 L 550 150 L 590 134 L 630 150 L 670 134 L 710 150" fill="none" stroke="#047857" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round"/><path d="M 430 188 L 470 196 L 510 180 L 550 196 L 590 180 L 630 196 L 670 180 L 710 196" fill="none" stroke="#047857" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round"/><line x1="520" y1="96" x2="520" y2="188" stroke="#b45309" stroke-width="2.6" stroke-linecap="round"/><circle cx="520" cy="96" r="4.5" fill="1.2" stroke="#b45309" stroke-width="#f0fdf4"/><circle cx="520" cy="188" r="4.5" fill="1.2" stroke="#b45309" stroke-width="#f0fdf4"/><line x1="600" y1="96" x2="600" y2="188" stroke="#b45309" stroke-width="2.6" stroke-linecap="round"/><circle cx="600" cy="96" r="4.5" fill="1.2" stroke="#b45309" stroke-width="#f0fdf4"/><circle cx="600" cy="188" r="4.5" fill="1.2" stroke="#b45309" stroke-width="#f0fdf4"/><line x1="680" y1="96" x2="680" y2="188" stroke="#b45309" stroke-width="2.6" stroke-linecap="round"/><circle cx="680" cy="96" r="4.5" fill="1.2" stroke="#b45309" stroke-width="#f0fdf4"/><circle cx="680" cy="188" r="4.5" fill="1.2" stroke="#b45309" stroke-width="#f0fdf4"/><text x="560" y="224" style="font-size:8.6px;fill:#475569;text-anchor:middle">sulphur bridges lock the chains — tough,</text><text x="560" y="240" style="font-size:8.6px;fill:#475569;text-anchor:middle">elastic, insoluble, keeps its strength when hot</text><path d="M 30 262 L 730 262 L 730 398 L 30 398 Z" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="380" y="284" style="font-size:10.2px;fill:#b45309;text-anchor:middle;font-weight:700">The process</text><text x="380" y="308" style="font-size:8.8px;fill:#334155;text-anchor:middle">Raw rubber is masticated with sulphur (2–8 %), an accelerator such as MBT and zinc oxide, and an antioxidant.</text><text x="380" y="330" style="font-size:8.8px;fill:#334155;text-anchor:middle">The compound is shaped, then heated to 140–160 °C for 20–60 minutes (or cured cold with sulphur chloride).</text><text x="380" y="352" style="font-size:8.8px;fill:#334155;text-anchor:middle">Sulphur reacts at the allylic C–H of the isoprene units and forms –S–S– bridges between chains.</text><text x="380" y="374" style="font-size:8.8px;fill:#334155;text-anchor:middle">With little sulphur (1–3 %) the product is soft and highly elastic; with 30–40 % it is ebonite, a hard solid.</text></svg>