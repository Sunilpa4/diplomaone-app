<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="100%" style="max-width:760px;height:auto;display:block;margin:0 auto;background:#ffffff" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><text x="380" y="26" style="font-size:13px;fill:#334155;text-anchor:middle;font-weight:700">WET CORROSION — HYDROGEN EVOLUTION AND OXYGEN ABSORPTION</text><path d="M 30 44 L 370 44 L 370 396 L 30 396 Z" fill="#fff7f7" stroke="#fecaca" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="200" y="68" style="font-size:11.5px;fill:#b91c1c;text-anchor:middle;font-weight:700">A. Hydrogen evolution</text><text x="200" y="88" style="font-size:9.6px;fill:#475569;text-anchor:middle">acidic or oxygen-free solution</text><path d="M 70 190 L 330 190 L 330 370 L 70 370 Z" fill="#e0f2fe" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round"/><line x1="70" y1="190" x2="330" y2="190" stroke="#0891b2" stroke-width="1.5" stroke-linecap="round"/><path d="M 88 120 L 110 120 L 110 330 L 88 330 Z" fill="#cbd5e1" stroke="#111827" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="99" y="348" style="font-size:9.2px;fill:#b91c1c;text-anchor:middle;font-weight:700">anode</text><text x="300" y="348" style="font-size:9.2px;fill:#1d4ed8;text-anchor:middle;font-weight:700">cathode</text><text x="140" y="150" style="font-size:9.6px;fill:#b91c1c;text-anchor:start">Fe → Fe²⁺ + 2e⁻</text><text x="250" y="150" style="font-size:9.6px;fill:#1d4ed8;text-anchor:start">2H⁺ + 2e⁻ → H₂↑</text><circle cx="292" cy="232" r="5" fill="#dcfce7" stroke="#047857" stroke-width="1.2"/><circle cx="300" cy="258" r="5" fill="#dcfce7" stroke="#047857" stroke-width="1.2"/><circle cx="288" cy="282" r="5" fill="#dcfce7" stroke="#047857" stroke-width="1.2"/><circle cx="296" cy="306" r="5" fill="#dcfce7" stroke="#047857" stroke-width="1.2"/><text x="236" y="340" style="font-size:9.2px;fill:#047857;text-anchor:middle">H₂ bubbles</text><line x1="130" y1="176" x2="263" y2="176" stroke="#b91c1c" stroke-width="1.3" stroke-linecap="round"/><path d="M 270 176 L 263 179.15 L 263 172.85 Z" fill="#b91c1c"/><text x="200" y="168" style="font-size:9px;fill:#b91c1c;text-anchor:middle;font-weight:700">e⁻</text><text x="200" y="388" style="font-size:9.6px;fill:#475569;text-anchor:middle">Happens in acids and in unaerated water.</text><path d="M 390 44 L 730 44 L 730 396 L 390 396 Z" fill="#f5f9ff" stroke="#bfdbfe" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="560" y="68" style="font-size:11.5px;fill:#1d4ed8;text-anchor:middle;font-weight:700">B. Oxygen absorption</text><text x="560" y="88" style="font-size:9.6px;fill:#475569;text-anchor:middle">neutral water with dissolved oxygen</text><path d="M 430 190 L 690 190 L 690 370 L 430 370 Z" fill="#dbeafe" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round"/><line x1="430" y1="190" x2="690" y2="190" stroke="#0891b2" stroke-width="1.5" stroke-linecap="round"/><path d="M 448 120 L 470 120 L 470 330 L 448 330 Z" fill="#cbd5e1" stroke="#111827" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="459" y="348" style="font-size:9.2px;fill:#b91c1c;text-anchor:middle;font-weight:700">anode</text><text x="660" y="380" style="font-size:9.2px;fill:#1d4ed8;text-anchor:middle;font-weight:700">cathode</text><text x="500" y="150" style="font-size:9.6px;fill:#b91c1c;text-anchor:start">Fe → Fe²⁺ + 2e⁻</text><text x="596" y="150" style="font-size:9.2px;fill:#1d4ed8;text-anchor:start">O₂ + 2H₂O + 4e⁻ → 4OH⁻</text><line x1="490" y1="176" x2="603" y2="176" stroke="#b91c1c" stroke-width="1.3" stroke-linecap="round"/><path d="M 610 176 L 603 179.15 L 603 172.85 Z" fill="#b91c1c"/><text x="550" y="168" style="font-size:9px;fill:#b91c1c;text-anchor:middle;font-weight:700">e⁻</text><circle cx="600" cy="240" r="5" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><circle cx="630" cy="280" r="5" fill="#fef3c7" 