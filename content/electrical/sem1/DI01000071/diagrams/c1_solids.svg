ill="#b91c1c" stroke="#b91c1c" stroke-width="1.7"/><text x="680" y="262" style="font-size:9.5px;fill:#475569;text-anchor:middle">positive ions in a sea of</text><text x="680" y="277" style="font-size:9.5px;fill:#475569;text-anchor:middle">delocalised electrons</text><text x="380" y="316" style="font-size:12px;fill:#334155;text-anchor:middle;font-weight:700">How the four solids behave</text><text x="150" y="340" style="font-size:10px;fill:#7c3aed;text-anchor:middle;font-weight:700">Solid</text><text x="250" y="340" style="font-size:10px;fill:#7c3aed;text-anchor:middle;font-weight:700">Melting point</text><text x="380" y="340" style="font-size:10px;fill:#7c3aed;text-anchor:middle;font-weight:700">Mechanical</text><text x="540" y="340" style="font-size:10px;fill:#7c3aed;text-anchor:middle;font-weight:700">Electrical</text><text x="680" y="340" style="font-size:10px;fill:#7c3aed;text-anchor:middle;font-weight:700">Examples</text><text x="150" y="360" style="font-size:9.8px;fill:#475569;text-anchor:middle">Ionic</text><text x="250" y="360" style="font-size:9.8px;fill:#475569;text-anchor:middle">high</text><text x="380" y="360" style="font-size:9.8px;fill:#475569;text-anchor:middle">hard, brittle</text><text x="540" y="360" style="font-size:9.8px;fill:#475569;text-anchor:middle">only molten / in solution</text><text x="680" y="360" style="font-size:9.8px;fill:#475569;text-anchor:middle">NaCl</text><text x="150" y="378" style="font-size:9.8px;fill:#475569;text-anchor:middle">Molecular</text><text x="250" y="378" style="font-size:9.8px;fill:#475569;text-anchor:middle">low</text><text x="380" y="378" style="font-size:9.8px;fill:#475569;text-anchor:middle">soft</text><text x="540" y="378" style="font-size:9.8px;fill:#475569;text-anchor:middle">do not conduct</text><text x="680" y="378" style="font-size:9.8px;fill:#475569;text-anchor:middle">I₂, CO₂, ice</text><text x="150" y="396" style="font-size:9.8px;fill:#475569;text-anchor:middle">Network</text><text x="250" y="396" style="font-size:9.8px;fill:#475569;text-anchor:middle">very high</text><text x="380" y="396" style="font-size:9.8px;fill:#475569;text-anchor:middle">very hard</text><text x="540" y="396" style="font-size:9.8px;fill:#475569;text-anchor:middle">do not conduct (except graphite)</text><text x="680" y="396" style="font-size:9.8px;fill:#475569;text-anchor:middle">diamond, quartz</text><text x="150" y="414" style="font-size:9.8px;fill:#475569;text-anchor:middle">Metallic</text><text x="250" y="414" style="font-size:9.8px;fill:#475569;text-anchor:middle">high to very high</text><text x="380" y="414" style="font-size:9.8px;fill:#475569;text-anchor:middle">malleable, ductile</text><text x="540" y="414" style="font-size:9.8px;fill:#475569;text-anchor:middle">conduct well</text><text x="680" y="414" style="font-size:9.8px;fill:#475569;text-anchor:middle">Cu, Fe, Al</text><line x1="60" y1="345" x2="700" y2="345" stroke="#e6e1f4" stroke-width="1.0" stroke-linecap="round"/></svg>