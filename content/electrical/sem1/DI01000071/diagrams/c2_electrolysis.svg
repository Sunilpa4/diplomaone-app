<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="100%" style="max-width:760px;height:auto;display:block;margin:0 auto;background:#ffffff" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><text x="380" y="26" style="font-size:13px;fill:#334155;text-anchor:middle;font-weight:700">ELECTROLYTIC CELL — ELECTROLYSIS, ELECTROPLATING AND ELECTRO-REFINING</text><path d="M 110 180 L 110 350 L 620 350 L 620 180" fill="none" stroke="#111827" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><path d="M 110 300 L 620 300 L 620 350 L 110 350 Z" fill="#dbeafe" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round"/><line x1="110" y1="300" x2="620" y2="300" stroke="#0891b2" stroke-width="1.6" stroke-linecap="round"/><text x="365" y="372" style="font-size:10.5px;fill:#475569;text-anchor:middle">electrolyte: CuSO₄ solution</text><path d="M 213 150 L 227 150 L 227 340 L 213 340 Z" fill="#fde68a" stroke="#b45309" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M 493 150 L 507 150 L 507 340 L 493 340 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><text x="236" y="132" style="font-size:10px;fill:#b45309;text-anchor:start;font-weight:700">anode (+)</text><text x="484" y="132" style="font-size:10px;fill:#1d4ed8;text-anchor:end;font-weight:700">cathode (−)</text><text x="238" y="170" style="font-size:9.2px;fill:#475569;text-anchor:start">pure copper plate</text><text x="482" y="170" style="font-size:9.2px;fill:#475569;text-anchor:end">iron spoon, the article</text><path d="M 220 150 L 220 112 L 330 112" fill="none" stroke="#111827" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><path d="M 374 112 L 500 112 L 500 150" fill="none" stroke="#111827" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><path d="M 330 100 L 374 100 L 374 122 L 330 122 Z" fill="#f8fafc" stroke="#111827" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><line x1="348" y1="94" x2="348" y2="100" stroke="#111827" stroke-width="1.8" stroke-linecap="round"/><line x1="356" y1="90" x2="356" y2="100" stroke="#111827" stroke-width="1.8" stroke-linecap="round"/><text x="352" y="74" style="font-size:10.5px;fill:#7c3aed;text-anchor:middle;font-weight:700">external d.c. supply</text><text x="308" y="104" style="font-size:13px;fill:#b91c1c;text-anchor:middle;font-weight:700">+</text><text x="396" y="104" style="font-size:13px;fill:#1d4ed8;text-anchor:middle;font-weight:700">−</text><text x="238" y="196" style="font-size:10px;fill:#b45309;text-anchor:start;font-weight:700">Cu → Cu²⁺ + 2e⁻</text><text x="482" y="196" style="font-size:10px;fill:#1d4ed8;text-anchor:end;font-weight:700">Cu²⁺ + 2e⁻ → Cu</text><line x1="270" y1="238" x2="444" y2="238" stroke="#1d4ed8" stroke-width="1.5" stroke-linecap="round"/><path d="M 452 238 L 444 241.6 L 444 234.4 Z" fill="#1d4ed8"/><text x="361" y="230" style="font-size:9.5px;fill:#1d4ed8;text-anchor:middle">Cu²⁺ moves to the cathode</text><line x1="452" y1="266" x2="278" y2="266" stroke="#b45309" stroke-width="1.4" stroke-linecap="round"/><path d="M 270 266 L 278 262.4 L 278 269.6 Z" fill="#b45309"/><text x="361" y="284" style="font-size:9.2px;fill:#b45309;text-anchor:middle">SO₄²⁻ stays in the solution</text><path d="M 40 392 L 720 392 L 720 458 L 40 458 Z" fill="#faf9ff" stroke="#e6e1f4" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="56" y="412" style="font-size:9.9px;fill:#475569;text-anchor:start">Electroplating: the article is the cathode, the plating metal is the anode; the anode dissolves and the article gains an even coat.</text><text x="56" y="430" style="font-size:9.9px;fill:#475569;text-anchor:start">Electro-refining: impure copper is the anode, a thin pure copper sheet is the cathode; copper dissolves at the anode and deposits pure.</text><text x="56" y="450" style="font-size:10.5px;fill:#7c3aed;text-anchor:start;font-weight:700">Faraday:   m = Z I t      and      m₁ / m₂ = E₁ / E₂</text></svg>