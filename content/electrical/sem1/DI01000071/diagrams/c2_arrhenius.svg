<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="100%" style="max-width:760px;height:auto;display:block;margin:0 auto;background:#ffffff" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><text x="380" y="26" style="font-size:13px;fill:#334155;text-anchor:middle;font-weight:700">ARRHENIUS THEORY — AN ELECTROLYTE SPLITS INTO FREE IONS IN WATER</text><path d="M 70 118 L 70 266 L 230 266 L 230 118" fill="none" stroke="#111827" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><path d="M 70 118 L 64 114" fill="none" stroke="#111827" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><path d="M 230 118 L 236 114" fill="none" stroke="#111827" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><path d="M 70 174.24 L 230 174.24 L 230 266 L 70 266 Z" fill="#dbeafe" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round"/><line x1="70" y1="174.24" x2="230" y2="174.24" stroke="#0891b2" stroke-width="1.6" stroke-linecap="round"/><circle cx="112" cy="196" r="17" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="1.8"/><text x="112" y="199.68" style="font-size:10.5px;fill:#111827;text-anchor:middle;font-weight:700">Na⁺</text><circle cx="188" cy="216" r="17" fill="#dcfce7" stroke="#047857" stroke-width="1.8"/><text x="188" y="219.68" style="font-size:10.5px;fill:#111827;text-anchor:middle;font-weight:700">Cl⁻</text><circle cx="178" cy="178" r="17" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="1.8"/><text x="178" y="181.68" style="font-size:10.5px;fill:#111827;text-anchor:middle;font-weight:700">Na⁺</text><circle cx="104" cy="238" r="17" fill="#dcfce7" stroke="#047857" stroke-width="1.8"/><text x="104" y="241.68" style="font-size:10.5px;fill:#111827;text-anchor:middle;font-weight:700">Cl⁻</text><text x="150" y="290" style="font-size:10px;fill:#475569;text-anchor:middle">ions move freely in water,</text><text x="150" y="305" style="font-size:10px;fill:#475569;text-anchor:middle">so the solution conducts</text><text x="150" y="100" style="font-size:11px;fill:#334155;text-anchor:middle;font-weight:700">NaCl dissolved in water</text><line x1="285" y1="90" x2="285" y2="330" stroke="#e6e1f4" stroke-width="1.2" stroke-linecap="round"/><text x="300" y="78" style="font-size:11px;fill:#047857;text-anchor:start;font-weight:700">Strong electrolyte — ionises completely,  α ≈ 1</text><text x="300" y="104" style="font-size:12.5px;fill:#111827;text-anchor:start;font-weight:700">HCl  →  H⁺  +  Cl⁻</text><line x1="300" y1="118" x2="621" y2="118" stroke="#047857" stroke-width="1.6" stroke-linecap="round"/><path d="M 630 118 L 621 122.05 L 621 113.95 Z" fill="#047857"/><text x="468" y="134" style="font-size:9.5px;fill:#475569;text-anchor:middle">a one-way arrow: every molecule splits</text><text x="300" y="182" style="font-size:11px;fill:#b91c1c;text-anchor:start;font-weight:700">Weak electrolyte — ionises only partly,  α ≪ 1</text><text x="300" y="208" style="font-size:12.5px;fill:#111827;text-anchor:start;font-weight:700">CH₃COOH  ⇌  CH₃COO⁻  +  H⁺</text><line x1="300" y1="228" x2="388" y2="228" stroke="#b91c1c" stroke-width="1.6" stroke-linecap="round"/><path d="M 396 228 L 388 231.6 L 388 224.4 Z" fill="#b91c1c"/><line x1="450" y1="242" x2="338" y2="242" stroke="#b91c1c" stroke-width="1.6" stroke-linecap="round"/><path d="M 330 242 L 338 238.4 L 338 245.6 Z" fill="#b91c1c"/><text x="468" y="226" style="font-size:9.5px;fill:#b91c1c;text-anchor:start">few molecules ionise</text><text x="468" y="246" style="font-size:9.5px;fill:#475569;text-anchor:start">most stay as molecules</text><rect x="60" y="336" width="494.59" height="57.7" rx="7" fill="#f8fafc" stroke="#9aa7bd" stroke-width="1"/><text x="68" y="354.5" style="font-size:10.5px;fill:#475569;text-anchor:start">Degree of ionisation   α = (molecules ionised ÷ total molecules dissolved)</text><text x="68" y="370" style="font-size:10.5px;fill:#475569;text-anchor:start">Percentage ionisation = α × 100 %   ·   0.1 M acetic acid, α = 0.0134 → 1.34 % ionised</text><text x="68" y="385.5" style="font-size:10.5px;fill:#475569;text-anchor:start">Dilution, temperature and the nature of the solute raise α; a common ion lowers it.</text></svg>