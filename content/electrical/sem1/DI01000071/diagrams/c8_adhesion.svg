<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="100%" style="max-width:760px;height:auto;display:block;margin:0 auto;background:#ffffff" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><text x="380" y="26" style="font-size:13px;fill:#334155;text-anchor:middle;font-weight:700">HOW AN ADHESIVE HOLDS — THE THREE JOINTS THAT MATTER</text><path d="M 30 46 L 254 46 L 254 220 L 30 220 Z" fill="#eff6ff" stroke="#e5e7eb" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/><text x="142" y="68" style="font-size:10.0px;fill:#1d4ed8;text-anchor:middle;font-weight:700">Adhesive joint</text><text x="142" y="192" style="font-size:7.8px;fill:#475569;text-anchor:middle">two parts joined through</text><text x="142" y="208" style="font-size:7.8px;fill:#475569;text-anchor:middle">a thin adhesive layer</text><path d="M 270 46 L 494 46 L 494 220 L 270 220 Z" fill="#f0fdf4" stroke="#e5e7eb" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/><text x="382" y="68" style="font-size:10.0px;fill:#047857;text-anchor:middle;font-weight:700">Mechanical interlock</text><text x="382" y="192" style="font-size:7.8px;fill:#475569;text-anchor:middle">adhesive keyed into the</text><text x="382" y="208" style="font-size:7.8px;fill:#475569;text-anchor:middle">pores and roughness</text><path d="M 510 46 L 734 46 L 734 220 L 510 220 Z" fill="#fdf4ff" stroke="#e5e7eb" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/><text x="622" y="68" style="font-size:10.0px;fill:#7c3aed;text-anchor:middle;font-weight:700">Specific adhesion</text><text x="622" y="192" style="font-size:7.8px;fill:#475569;text-anchor:middle">polar groups of the adhesive</text><text x="622" y="208" style="font-size:7.8px;fill:#475569;text-anchor:middle">bond to the surface</text><path d="M 60 92 L 220 92 L 220 118 L 60 118 Z" fill="#94a3b8" stroke="#111827" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M 60 130 L 220 130 L 220 156 L 60 156 Z" fill="#94a3b8" stroke="#111827" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M 60 118 L 220 118 L 220 130 L 60 130 Z" fill="#fbbf24" stroke="#d97706" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="140" y="178" style="font-size:8.2px;fill:#475569;text-anchor:middle">adhesive layer 0.05–0.3 mm</text><path d="M 300 92 L 460 92 L 460 156 L 300 156 Z" fill="#94a3b8" stroke="#111827" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="380" y="178" style="font-size:8.2px;fill:#475569;text-anchor:middle">rough surface — adhesive fills the pits</text><line x1="316" y1="92" x2="316" y2="112" stroke="#ffffff" stroke-width="2.0" stroke-linecap="round"/><line x1="348" y1="92" x2="348" y2="112" stroke="#ffffff" stroke-width="2.0" stroke-linecap="round"/><line x1="380" y1="92" x2="380" y2="112" stroke="#ffffff" stroke-width="2.0" stroke-linecap="round"/><line x1="412" y1="92" x2="412" y2="112" stroke="#ffffff" stroke-width="2.0" stroke-linecap="round"/><line x1="444" y1="92" x2="444" y2="112" stroke="#ffffff" stroke-width="2.0" stroke-linecap="round"/><path d="M 540 92 L 700 92 L 700 118 L 540 118 Z" fill="#94a3b8" stroke="#111827" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M 540 130 L 700 130 L 700 156 L 540 156 Z" fill="#94a3b8" stroke="#111827" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M 540 118 L 700 118 L 700 130 L 540 130 Z" fill="#e9d5ff" stroke="#7c3aed" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="620" y="178" style="font-size:8.2px;fill:#475569;text-anchor:middle">polar groups —OH, –COOH, –NH₂ bond</text><path d="M 30 236 L 730 236 L 730 388 L 30 388 Z" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="380" y="258" style="font-size:10.0px;fill:#b45309;text-anchor:middle;font-weight:700">A good adhesive must do four jobs</text><text x="380" y="282" style="font-size:8.8px;fill:#334155;text-anchor:middle">Wet the surface — its surface tension must be lower than that of the solid.</text><text x="380" y="304" style="font-size:8.8px;fill:#334155;text-anchor:middle">Set by cooling, by evaporating a solvent, or by a chemical reaction (epoxy, cyanoacrylate).</text><text x="380" y="326" style="font-size:8.8px;fill:#334155;text-anchor:middle">Carry the load in shear, never in peel — a lap joint is strong, a peeling corner is not.</text><text x="380" y="348" style="font-size:8.8px;fill:#334155;text-anchor:middle">Survive the service temperature, water and oil; surface preparation decides most of the strength.</text><text x="380" y="380" style="font-size:8.4px;fill:#475569;text-anchor:middle">Sales figures: a well-made lap joint reaches 15–25 MPa in shear, while the same adhesive peels at 1–2 kN/m.</text></svg>