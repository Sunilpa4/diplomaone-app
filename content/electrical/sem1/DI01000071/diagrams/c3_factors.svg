<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="100%" style="max-width:760px;height:auto;display:block;margin:0 auto;background:#ffffff" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><text x="380" y="26" style="font-size:13px;fill:#334155;text-anchor:middle;font-weight:700">FACTORS THAT DECIDE THE RATE OF CORROSION</text><path d="M 30 50 L 370 50 L 370 158 L 30 158 Z" fill="#fef2f2" stroke="#e5e7eb" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/><text x="44" y="74" style="font-size:9.8px;fill:#b91c1c;text-anchor:start;font-weight:700">Nature of the metal</text><text x="44" y="98" style="font-size:9.0px;fill:#475569;text-anchor:start">Higher oxidation potential = faster attack.</text><text x="44" y="115" style="font-size:9.0px;fill:#475569;text-anchor:start">Li > K > Na > Ca > Mg > Al > Zn > Fe > Ni ></text><text x="44" y="132" style="font-size:9.0px;fill:#475569;text-anchor:start">Cu.</text><path d="M 390 50 L 730 50 L 730 158 L 390 158 Z" fill="#fff7ed" stroke="#e5e7eb" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/><text x="404" y="74" style="font-size:9.8px;fill:#b45309;text-anchor:start;font-weight:700">Surface film (PBR)</text><text x="404" y="98" style="font-size:9.0px;fill:#475569;text-anchor:start">PBR = volume of oxide / volume of metal. PBR</text><text x="404" y="115" style="font-size:9.0px;fill:#475569;text-anchor:start">&lt; 1 porous, 1-1.5 protective, > 1 cracks</text><text x="404" y="132" style="font-size:9.0px;fill:#475569;text-anchor:start">off.</text><path d="M 30 172 L 370 172 L 370 280 L 30 280 Z" fill="#f0f9ff" stroke="#e5e7eb" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/><text x="44" y="196" style="font-size:9.8px;fill:#1d4ed8;text-anchor:start;font-weight:700">Area ratio</text><text x="44" y="220" style="font-size:9.0px;fill:#475569;text-anchor:start">A small anode with a large cathode</text><text x="44" y="237" style="font-size:9.0px;fill:#475569;text-anchor:start">concentrates the attack and eats the anode</text><text x="44" y="254" style="font-size:9.0px;fill:#475569;text-anchor:start">fast.</text><path d="M 390 172 L 730 172 L 730 280 L 390 280 Z" fill="#f5f3ff" stroke="#e5e7eb" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/><text x="404" y="196" style="font-size:9.8px;fill:#7c3aed;text-anchor:start;font-weight:700">Purity of the metal</text><text x="404" y="220" style="font-size:9.0px;fill:#475569;text-anchor:start">Impurities set up tiny galvanic cells at the</text><text x="404" y="237" style="font-size:9.0px;fill:#475569;text-anchor:start">grain boundaries; pure metal corrodes</text><text x="404" y="254" style="font-size:9.0px;fill:#475569;text-anchor:start">slowly.</text><path d="M 30 294 L 370 294 L 370 402 L 30 402 Z" fill="#f0fdf4" stroke="#e5e7eb" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/><text x="44" y="318" style="font-size:9.8px;fill:#047857;text-anchor:start;font-weight:700">Temperature</text><text x="44" y="342" style="font-size:9.0px;fill:#475569;text-anchor:start">Every 10 C rise roughly doubles the rate; a</text><text x="44" y="359" style="font-size:9.0px;fill:#475569;text-anchor:start">hot spot becomes the anode of a</text><text x="44" y="376" style="font-size:9.0px;fill:#475569;text-anchor:start">concentration cell.</text><path d="M 390 294 L 730 294 L 730 402 L 390 402 Z" fill="#ecfeff" stroke="#e5e7eb" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/><text x="404" y="318" style="font-size:9.8px;fill:#0891b2;text-anchor:start;font-weight:700">Humidity and pH</text><text x="404" y="342" style="font-size:9.0px;fill:#475569;text-anchor:start">Above 70 % RH a moisture film forms. Acidic</text><text x="404" y="359" style="font-size:9.0px;fill:#475569;text-anchor:start">pH &lt; 4 and alkaline pH > 10 both attack</text><text x="404" y="376" style="font-size:9.0px;fill:#475569;text-anchor:start">iron.</text></svg>