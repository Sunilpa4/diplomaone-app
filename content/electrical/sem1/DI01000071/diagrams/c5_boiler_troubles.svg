<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="100%" style="max-width:760px;height:auto;display:block;margin:0 auto;background:#ffffff" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><text x="380" y="26" style="font-size:13px;fill:#334155;text-anchor:middle;font-weight:700">BOILER TROUBLES CAUSED BY HARD WATER</text><path d="M 30 50 L 370 50 L 370 158 L 30 158 Z" fill="#fef2f2" stroke="#e5e7eb" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/><text x="44" y="74" style="font-size:9.8px;fill:#b91c1c;text-anchor:start;font-weight:700">Scale and sludge</text><text x="44" y="98" style="font-size:8.6px;fill:#475569;text-anchor:start">CaCO₃, CaSO₄, Mg(OH)₂, silica. Scale sticks to</text><text x="44" y="114" style="font-size:8.6px;fill:#475569;text-anchor:start">the tube and insulates it; the metal overheats</text><text x="44" y="130" style="font-size:8.6px;fill:#475569;text-anchor:start">and bulges or bursts. Sludge is loose and can</text><text x="44" y="146" style="font-size:8.6px;fill:#475569;text-anchor:start">be blown down.</text><path d="M 390 50 L 730 50 L 730 158 L 390 158 Z" fill="#eff6ff" stroke="#e5e7eb" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/><text x="404" y="74" style="font-size:9.8px;fill:#1d4ed8;text-anchor:start;font-weight:700">Priming and foaming</text><text x="404" y="98" style="font-size:8.6px;fill:#475569;text-anchor:start">Priming is the carry-over of boiler water with</text><text x="404" y="114" style="font-size:8.6px;fill:#475569;text-anchor:start">the steam; foaming is a stable froth on the</text><text x="404" y="130" style="font-size:8.6px;fill:#475569;text-anchor:start">surface. Caused by dissolved salts, oil and</text><text x="404" y="146" style="font-size:8.6px;fill:#475569;text-anchor:start">high alkalinity — the steam then carries salts</text><path d="M 30 172 L 370 172 L 370 280 L 30 280 Z" fill="#fff7ed" stroke="#e5e7eb" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/><text x="44" y="196" style="font-size:9.8px;fill:#b45309;text-anchor:start;font-weight:700">Caustic embrittlement</text><text x="44" y="220" style="font-size:8.6px;fill:#475569;text-anchor:start">NaOH concentrates in a rivet seam or a crack</text><text x="44" y="236" style="font-size:8.6px;fill:#475569;text-anchor:start">and attacks the steel along the grain</text><text x="44" y="252" style="font-size:8.6px;fill:#475569;text-anchor:start">boundaries. Hairline cracks appear and the</text><text x="44" y="268" style="font-size:8.6px;fill:#475569;text-anchor:start">shell fails. Prevented by a protective coating</text><path d="M 390 172 L 730 172 L 730 280 L 390 280 Z" fill="#f0fdf4" stroke="#e5e7eb" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/><text x="404" y="196" style="font-size:9.8px;fill:#047857;text-anchor:start;font-weight:700">Corrosion</text><text x="404" y="220" style="font-size:8.6px;fill:#475569;text-anchor:start">Dissolved O₂ and CO₂ at high temperature eat</text><text x="404" y="236" style="font-size:8.6px;fill:#475569;text-anchor:start">the metal — pitting in the economiser drum and</text><text x="404" y="252" style="font-size:8.6px;fill:#475569;text-anchor:start">grooving along the water line. Prevented by</text><text x="404" y="268" style="font-size:8.6px;fill:#475569;text-anchor:start">deaeration, hydrazine, and keeping the pH</text><path d="M 30 300 L 730 300 L 730 404 L 30 404 Z" fill="#faf9ff" stroke="#ddd6fe" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="48" y="320" style="font-size:9.6px;fill:#7c3aed;text-anchor:start;font-weight:700">The treatment</text><text x="48" y="342" style="font-size:8.8px;fill:#475569;text-anchor:start">external: lime-soda · zeolite · ion exchange · RO  ·  internal: blow-down, phosphate conditioning, filtration, deaeration, pH control</text><text x="48" y="364" style="font-size:8.8px;fill:#475569;text-anchor:start">Never let the boiler run on untreated hard water: scale of 1 mm costs about 8 % of the fuel bill.</text><text x="48" y="386" style="font-size:8.8px;fill:#7c3aed;text-anchor:start;font-weight:700">Scale removal is expensive; scale prevention is cheap.</text></svg>