<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="100%" style="max-width:760px;height:auto;display:block;margin:0 auto;background:#ffffff" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><text x="380" y="26" style="font-size:13px;fill:#334155;text-anchor:middle;font-weight:700">BOMB CALORIMETER — DETERMINATION OF CALORIFIC VALUE</text><path d="M 210 70 L 520 70 L 520 360 L 210 360 Z" fill="#eff6ff" stroke="#111827" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="365" y="386" style="font-size:9.2px;fill:#1d4ed8;text-anchor:middle;font-weight:700">stirrer + insulated water jacket (2 kg water)</text><path d="M 280 150 L 450 150 L 450 290 L 280 290 Z" fill="#cbd5e1" stroke="#111827" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><line x1="280" y1="175" x2="450" y2="175" stroke="#111827" stroke-width="1.4" stroke-linecap="round"/><text x="365" y="142" style="font-size:8.4px;fill:#334155;text-anchor:middle">bomb · stainless steel · O₂ at 25–30 atm</text><path d="M 330 265 L 400 265 L 392 285 L 338 285 Z" fill="#fef3c7" stroke="#111827" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="365" y="279" style="font-size:8.4px;fill:#334155;text-anchor:middle">sample</text><line x1="300" y1="240" x2="330" y2="262" stroke="#b91c1c" stroke-width="1.3" stroke-linecap="round"/><text x="300" y="235" style="font-size:8.4px;fill:#b91c1c;text-anchor:end">fuse wire</text><line x1="365" y1="70" x2="365" y2="100" stroke="#111827" stroke-width="1.6" stroke-linecap="round"/><path d="M 350 96 L 380 96 L 380 116 L 350 116 Z" fill="#fff" stroke="#111827" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="365" y="60" style="font-size:8.6px;fill:#334155;text-anchor:middle">thermometer (reads to 0.01 °C)</text><line x1="450" y1="165" x2="560" y2="140" stroke="#111827" stroke-width="1.0" stroke-linecap="round"/><text x="566" y="138" style="font-size:9.0px;fill:#475569;text-anchor:start">O₂ inlet valve</text><line x1="340" y1="275" x2="150" y2="300" stroke="#111827" stroke-width="1.0" stroke-linecap="round"/><text x="146" y="300" style="font-size:9.0px;fill:#475569;text-anchor:end">crucible, 0.5–1 g pellet</text><line x1="430" y1="320" x2="560" y2="330" stroke="#111827" stroke-width="1.0" stroke-linecap="round"/><text x="566" y="332" style="font-size:9.0px;fill:#475569;text-anchor:start">water equivalent: mw + w</text><path d="M 30 392 L 730 392 L 730 442 L 30 442 Z" fill="#fffdf6" stroke="#fde68a" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="380" y="410" style="font-size:9.6px;fill:#b45309;text-anchor:middle;font-weight:700">CV = [(W + w)(t₂ − t₁) − (acid + fuse corrections)] ÷ mass of fuel</text><text x="380" y="430" style="font-size:8.8px;fill:#475569;text-anchor:middle">W = mass of water, w = water equivalent of the calorimeter</text></svg>