<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="100%" style="max-width:760px;height:auto;display:block;margin:0 auto;background:#ffffff" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><text x="380" y="26" style="font-size:13px;fill:#334155;text-anchor:middle;font-weight:700">ADDITION POLYMERISATION OF ETHENE — FREE-RADICAL CHAIN</text><path d="M 30 44 L 730 44 L 730 190 L 30 190 Z" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="380" y="66" style="font-size:10.6px;fill:#0891b2;text-anchor:middle;font-weight:700">1  Initiation</text><text x="200" y="108" style="font-size:11.0px;fill:#334155;text-anchor:middle;font-weight:700">R•  +  CH₂=CH₂</text><line x1="300" y1="102" x2="343" y2="102" stroke="#b91c1c" stroke-width="1.3" stroke-linecap="round"/><path d="M 350 102 L 343 105.15 L 343 98.85 Z" fill="#b91c1c"/><text x="440" y="108" style="font-size:11.0px;fill:#b91c1c;text-anchor:middle;font-weight:700">R–CH₂–CH₂•</text><text x="380" y="146" style="font-size:8.8px;fill:#475569;text-anchor:middle">The peroxide R• opens the double bond and the chain starts; one electron stays unpaired.</text><text x="380" y="168" style="font-size:8.6px;fill:#475569;text-anchor:middle">2 initiator molecules per polymer chain — that decides the chain length.</text><path d="M 30 200 L 730 200 L 730 300 L 30 300 Z" fill="#f7fdf9" stroke="#bbf7d0" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="380" y="222" style="font-size:10.6px;fill:#047857;text-anchor:middle;font-weight:700">2  Propagation  (repeated many times)</text><text x="200" y="260" style="font-size:10.6px;fill:#334155;text-anchor:middle;font-weight:700">R–CH₂–CH₂•  +  CH₂=CH₂</text><line x1="320" y1="254" x2="363" y2="254" stroke="#047857" stroke-width="1.3" stroke-linecap="round"/><path d="M 370 254 L 363 257.15 L 363 250.85 Z" fill="#047857"/><text x="500" y="260" style="font-size:10.6px;fill:#047857;text-anchor:middle;font-weight:700">R–CH₂–CH₂–CH₂–CH₂•</text><text x="380" y="288" style="font-size:8.8px;fill:#475569;text-anchor:middle">Each step lengthens the chain by one C₂H₄ unit at about 10⁴ steps a second — degree of polymerisation n.</text><path d="M 30 310 L 730 310 L 730 400 L 30 400 Z" fill="#fef2f2" stroke="#fecaca" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="380" y="332" style="font-size:10.6px;fill:#b91c1c;text-anchor:middle;font-weight:700">3  Termination</text><text x="250" y="368" style="font-size:10.6px;fill:#334155;text-anchor:middle;font-weight:700">chain•  +  •chain</text><line x1="360" y1="362" x2="403" y2="362" stroke="#b91c1c" stroke-width="1.3" stroke-linecap="round"/><path d="M 410 362 L 403 365.15 L 403 358.85 Z" fill="#b91c1c"/><text x="520" y="368" style="font-size:10.4px;fill:#b91c1c;text-anchor:middle;font-weight:700">chain–chain  (dead polymer)</text><text x="380" y="392" style="font-size:8.6px;fill:#475569;text-anchor:middle">Two radicals join, or one hands its hydrogen to the other and both chains stop growing.</text></svg>