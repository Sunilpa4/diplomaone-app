<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490" width="100%" style="max-width:760px;height:auto;display:block;margin:0 auto;background:#ffffff" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><text x="380" y="26" style="font-size:13px;fill:#334155;text-anchor:middle;font-weight:700">COORDINATE (DATIVE) BOND AND HYDROGEN BOND</text><text x="190" y="58" style="font-size:11px;fill:#1d4ed8;text-anchor:middle;font-weight:700">Coordinate bond — both electrons come from one atom</text><circle cx="110" cy="150" r="17" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="1.7"/><text x="110" y="155" style="font-size:12px;fill:#1d4ed8;text-anchor:middle;font-weight:700">N</text><line x1="110" y1="133" x2="110" y2="98" stroke="#111827" stroke-width="1.6" stroke-linecap="round"/><text x="110" y="93" style="font-size:11px;fill:#111827;text-anchor:middle;font-weight:700">H</text><line x1="124.72" y1="141.5" x2="155.03" y2="124" stroke="#111827" stroke-width="1.6" stroke-linecap="round"/><text x="162.83" y="123.5" style="font-size:11px;fill:#111827;text-anchor:middle;font-weight:700">H</text><line x1="95.28" y1="141.5" x2="64.97" y2="124" stroke="#111827" stroke-width="1.6" stroke-linecap="round"/><text x="57.17" y="123.5" style="font-size:11px;fill:#111827;text-anchor:middle;font-weight:700">H</text><circle cx="140" cy="150" r="2.8" fill="#b91c1c" stroke="#b91c1c" stroke-width="2.8"/><circle cx="148" cy="150" r="2.8" fill="#b91c1c" stroke="#b91c1c" stroke-width="2.8"/><text x="110" y="246" style="font-size:10px;fill:#475569;text-anchor:middle">NH₃ — one lone pair on N</text><line x1="185" y1="150" x2="241" y2="150" stroke="#047857" stroke-width="1.6" stroke-linecap="round"/><path d="M 250 150 L 241 154.05 L 241 145.95 Z" fill="#047857"/><text x="218" y="136" style="font-size:10.5px;fill:#047857;text-anchor:middle;font-weight:700">+ H⁺</text><circle cx="320" cy="150" r="17" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="1.7"/><text x="320" y="155" style="font-size:12px;fill:#1d4ed8;text-anchor:middle;font-weight:700">N</text><line x1="320" y1="133" x2="320" y2="98" stroke="#111827" stroke-width="1.6" stroke-linecap="round"/><text x="320" y="93" style="font-size:11px;fill:#111827;text-anchor:middle;font-weight:700">H</text><line x1="334.72" y1="141.5" x2="365.03" y2="124" stroke="#111827" stroke-width="1.6" stroke-linecap="round"/><text x="372.83" y="123.5" style="font-size:11px;fill:#111827;text-anchor:middle;font-weight:700">H</text><line x1="305.28" y1="141.5" x2="274.97" y2="124" stroke="#111827" stroke-width="1.6" stroke-linecap="round"/><text x="267.17" y="123.5" style="font-size:11px;fill:#111827;text-anchor:middle;font-weight:700">H</text><line x1="320" y1="167" x2="320" y2="202" stroke="#111827" stroke-width="1.6" stroke-linecap="round"/><text x="320" y="215" style="font-size:11px;fill:#111827;text-anchor:middle;font-weight:700">H</text><text x="320" y="246" style="font-size:10px;fill:#475569;text-anchor:middle">NH₄⁺ — four identical N–H bonds</text><line x1="430" y1="100" x2="377.94" y2="107.18" stroke="#b91c1c" stroke-width="1.2" stroke-linecap="round"/><path d="M 372 108 L 377.57 104.51 L 378.31 109.85 Z" fill="#b91c1c"/><text x="436" y="98" style="font-size:9.5px;fill:#b91c1c;text-anchor:start">this bond takes both electrons from N</text><text x="470" y="150" style="font-size:10.5px;fill:#475569;text-anchor:start">Another example:</text><text x="470" y="168" style="font-size:10.5px;fill:#475569;text-anchor:start">H₂O + H⁺ → H₃O⁺</text><text x="470" y="186" style="font-size:10px;fill:#6b7280;text-anchor:start">(hydronium ion)</text><text x="380" y="286" style="font-size:11px;fill:#1d4ed8;text-anchor:middle;font-weight:700">Hydrogen bond — a weak bond between molecules</text><circle cx="150" cy="360" r="16" fill="#dcfce7" stroke="#047857" stroke-width="1.6"/><text x="150" y="365" style="font-size:12px;fill:#047857;text-anchor:middle;font-weight:700">O</text><line x1="137.74" y1="349.72" x2="114.76" y2="330.43" stroke="#111827" stroke-width="1.5" stroke-linecap="round"/><text x="114.76" y="334.43" style="font-size:10.5px;fill:#111827;text-anchor:middle;font-weight:700">H</text><line x1="162.26" y1="349.72" x2="185.24" y2="330.43" stroke="#111827" stroke-width="1.5" stroke-linecap="round"/><text x="185.24" y="334.43" style="font-size:10.5px;fill:#111827;text-anchor:middle;font-weight:700">H</text><text x="150" y="422" style="font-size:10px;fill:#475569;text-anchor:middle">molecule 1</text><circle cx="450" cy="332" r="16" fill="#dcfce7" stroke="#047857" stroke-width="1.6"/><text x="450" y="337" style="font-size:12px;fill:#047857;text-anchor:middle;font-weight:700">O</text><line x1="464.13" y1="324.49" x2="490.62" y2="310.4" stroke="#111827" stroke-width="1.5" stroke-linecap="round"/><text x="490.62" y="314.4" style="font-size:10.5px;fill:#111827;text-anchor:middle;font-weight:700">H</text><line x1="458.48" y1="345.57" x2="474.38" y2="371.01" stroke="#111827" stroke-width="1.5" stroke-linecap="round"/><text x="474.38" y="375.01" style="font-size:10.5px;fill:#111827;text-anchor:middle;font-weight:700">H</text><text x="450" y="394" style="font-size:10px;fill:#475569;text-anchor:middle">molecule 2</text><circle cx="426" cy="327" r="2.8" fill="#b91c1c" stroke="#b91c1c" stroke-width="2.8"/><circle cx="426" cy="337" r="2.8" fill="#b91c1c" stroke="#b91c1c" stroke-width="2.8"/><line x1="196.24" y1="330.43" x2="416" y2="332" stroke="#7c3aed" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 3"/><text x="317.62" y="315.43" style="font-size:9.5px;fill:#7c3aed;text-anchor:middle">hydrogen bond  O–H ⋯ O</text><text x="410" y="366" style="font-size:9px;fill:#6b7280;text-anchor:end">lone pair on O of the next molecule</text><text x="380" y="466" style="font-size:10.5px;fill:#475569;text-anchor:middle">The hydrogen of one molecule is held by a lone pair of the next — about a tenth as strong as a covalent bond.</text><rect x="556" y="348" width="199.65" height="88.7" rx="7" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1"/><text x="564" y="366.5" style="font-size:10.5px;fill:#475569;text-anchor:start">Strength ≈ 10–40 kJ/mol —</text><text x="564" y="382" style="font-size:10.5px;fill:#475569;text-anchor:start">about a tenth of a covalent bond.</text><text x="564" y="397.5" style="font-size:10.5px;fill:#475569;text-anchor:start">Explains the high boiling point,</text><text x="564" y="413" style="font-size:10.5px;fill:#475569;text-anchor:start">the surface tension, and why ice</text><text x="564" y="428.5" style="font-size:10.5px;fill:#475569;text-anchor:start">floats on water.</text></svg>