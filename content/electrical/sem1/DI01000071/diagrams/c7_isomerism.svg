<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="100%" style="max-width:760px;height:auto;display:block;margin:0 auto;background:#ffffff" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><text x="380" y="26" style="font-size:13px;fill:#334155;text-anchor:middle;font-weight:700">ISOMERISM IN ORGANIC COMPOUNDS</text><path d="M 300 44 L 460 44 L 460 76 L 300 76 Z" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="380" y="65" style="font-size:9.0px;fill:#7c3aed;text-anchor:middle;font-weight:700">Same molecular formula, different structure</text><path d="M 60 116 L 300 116 L 300 148 L 60 148 Z" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/><text x="180" y="137" style="font-size:9.6px;fill:#1d4ed8;text-anchor:middle;font-weight:700">Structural isomerism</text><path d="M 460 116 L 700 116 L 700 148 L 460 148 Z" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/><text x="580" y="137" style="font-size:9.6px;fill:#047857;text-anchor:middle;font-weight:700">Stereo isomerism</text><line x1="380" y1="76" x2="380" y2="96" stroke="#111827" stroke-width="1.2" stroke-linecap="round"/><line x1="180" y1="96" x2="580" y2="96" stroke="#111827" stroke-width="1.2" stroke-linecap="round"/><line x1="180" y1="96" x2="180" y2="116" stroke="#111827" stroke-width="1.2" stroke-linecap="round"/><line x1="580" y1="96" x2="580" y2="116" stroke="#111827" stroke-width="1.2" stroke-linecap="round"/><path d="M 60 172 L 300 172 L 300 218 L 60 218 Z" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="70" y="191" style="font-size:9.2px;fill:#1d4ed8;text-anchor:start;font-weight:700">Chain</text><text x="70" y="208" style="font-size:7.8px;fill:#475569;text-anchor:start">C₅H₁₂ is pentane or 2‑methylbutane</text><path d="M 60 228 L 300 228 L 300 274 L 60 274 Z" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="70" y="247" style="font-size:9.2px;fill:#1d4ed8;text-anchor:start;font-weight:700">Position</text><text x="70" y="264" style="font-size:7.8px;fill:#475569;text-anchor:start">C₃H₇Cl is 1‑chloropropane or 2‑chloropropane</text><path d="M 60 284 L 300 284 L 300 330 L 60 330 Z" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="70" y="303" style="font-size:9.2px;fill:#1d4ed8;text-anchor:start;font-weight:700">Functional</text><text x="70" y="320" style="font-size:7.8px;fill:#475569;text-anchor:start">C₂H₆O is ethanol or dimethyl ether</text><path d="M 60 340 L 300 340 L 300 386 L 60 386 Z" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="70" y="359" style="font-size:9.2px;fill:#1d4ed8;text-anchor:start;font-weight:700">Metamerism</text><text x="70" y="376" style="font-size:7.8px;fill:#475569;text-anchor:start">C₄H₁₀O is ethoxyethane or methoxypropane</text><path d="M 460 172 L 700 172 L 700 240 L 460 240 Z" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="470" y="192" style="font-size:9.2px;fill:#047857;text-anchor:start;font-weight:700">Geometrical (cis–trans)</text><text x="470" y="212" style="font-size:7.8px;fill:#475569;text-anchor:start">needs a C=C with two different</text><text x="470" y="228" style="font-size:7.8px;fill:#475569;text-anchor:start">groups on each carbon</text><path d="M 460 250 L 700 250 L 700 318 L 460 318 Z" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="470" y="270" style="font-size:9.2px;fill:#047857;text-anchor:start;font-weight:700">Optical</text><text x="470" y="290" style="font-size:7.8px;fill:#475569;text-anchor:start">a carbon with four different</text><text x="470" y="306" style="font-size:7.8px;fill:#475569;text-anchor:start">groups rotates plane polarised light</text><text x="380" y="400" style="font-size:8.8px;fill:#475569;text-anchor:middle">But‑1‑ene and but‑2‑ene are position isomers; cis‑ and trans‑but‑2‑ene are geometrical isomers of the same position.</text></svg>