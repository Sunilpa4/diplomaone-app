<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="100%" style="max-width:760px;height:auto;display:block;margin:0 auto;background:#ffffff" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><text x="380" y="26" style="font-size:13px;fill:#334155;text-anchor:middle;font-weight:700">HARDNESS OF WATER — TEMPORARY AND PERMANENT</text><path d="M 30 44 L 370 44 L 370 396 L 30 396 Z" fill="#fffdf7" stroke="#fde68a" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="200" y="66" style="font-size:10.6px;fill:#b45309;text-anchor:middle;font-weight:700">TEMPORARY  ·  carbonate</text><text x="200" y="86" style="font-size:8.6px;fill:#475569;text-anchor:middle">removed simply by boiling</text><path d="M 48 108 L 198 108 L 198 148 L 48 148 Z" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="123" y="128" style="font-size:9.6px;fill:#b45309;text-anchor:middle;font-weight:700">Ca(HCO₃)₂</text><text x="212" y="126" style="font-size:8.2px;fill:#475569;text-anchor:start">on boiling</text><text x="212" y="142" style="font-size:8.6px;fill:#334155;text-anchor:start">CaCO₃↓ + H₂O + CO₂</text><path d="M 48 186 L 198 186 L 198 226 L 48 226 Z" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="123" y="206" style="font-size:9.6px;fill:#b45309;text-anchor:middle;font-weight:700">Mg(HCO₃)₂</text><text x="212" y="204" style="font-size:8.2px;fill:#475569;text-anchor:start">on boiling</text><text x="212" y="220" style="font-size:8.6px;fill:#334155;text-anchor:start">MgCO₃↓ + H₂O + CO₂</text><text x="200" y="300" style="font-size:8.8px;fill:#475569;text-anchor:middle">The deposit is a soft sludge that can be blown down.</text><text x="200" y="322" style="font-size:8.8px;fill:#334155;text-anchor:middle;font-weight:700">Carbonate hardness = temporary hardness.</text><text x="200" y="350" style="font-size:8.4px;fill:#475569;text-anchor:middle">Cause: dissolved CO₂ from air and soil</text><text x="200" y="366" style="font-size:8.4px;fill:#475569;text-anchor:middle">attacking limestone beds.</text><path d="M 390 44 L 730 44 L 730 396 L 390 396 Z" fill="#f7fbff" stroke="#bfdbfe" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="560" y="66" style="font-size:10.6px;fill:#1d4ed8;text-anchor:middle;font-weight:700">PERMANENT  ·  non-carbonate</text><text x="560" y="86" style="font-size:8.6px;fill:#475569;text-anchor:middle">not removed by boiling</text><path d="M 408 108 L 538 108 L 538 138 L 408 138 Z" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="473" y="123" style="font-size:9.4px;fill:#1d4ed8;text-anchor:middle;font-weight:700">CaSO₄</text><text x="552" y="128" style="font-size:8.6px;fill:#475569;text-anchor:start">calcium sulphate</text><path d="M 408 148 L 538 148 L 538 178 L 408 178 Z" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="473" y="163" style="font-size:9.4px;fill:#1d4ed8;text-anchor:middle;font-weight:700">MgSO₄</text><text x="552" y="168" style="font-size:8.6px;fill:#475569;text-anchor:start">magnesium sulphate</text><path d="M 408 188 L 538 188 L 538 218 L 408 218 Z" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="473" y="203" style="font-size:9.4px;fill:#1d4ed8;text-anchor:middle;font-weight:700">CaCl₂</text><text x="552" y="208" style="font-size:8.6px;fill:#475569;text-anchor:start">calcium chloride</text><path d="M 408 228 L 538 228 L 538 258 L 408 258 Z" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="473" y="243" style="font-size:9.4px;fill:#1d4ed8;text-anchor:middle;font-weight:700">MgCl₂</text><text x="552" y="248" style="font-size:8.6px;fill:#475569;text-anchor:start">magnesium chloride</text><path d="M 408 268 L 538 268 L 538 298 L 408 298 Z" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="473" y="283" style="font-size:9.4px;fill:#1d4ed8;text-anchor:middle;font-weight:700">Ca(NO₃)₂</text><text x="552" y="288" style="font-size:8.6px;fill:#475569;text-anchor:start">calcium nitrate</text><text x="560" y="330" style="font-size:8.8px;fill:#475569;text-anchor:middle">These stay in solution when the water boils,</text><text x="560" y="346" style="font-size:8.8px;fill:#475569;text-anchor:middle">so the water is still hard afterwards.</text><text x="560" y="372" style="font-size:8.6px;fill:#334155;text-anchor:middle;font-weight:700">Removed only by softening — lime-soda,</text><text x="560" y="386" style="font-size:8.6px;fill:#334155;text-anchor:middle;font-weight:700">zeolite, ion exchange or RO.</text></svg>