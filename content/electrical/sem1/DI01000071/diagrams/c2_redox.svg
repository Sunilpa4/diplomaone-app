<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="100%" style="max-width:760px;height:auto;display:block;margin:0 auto;background:#ffffff" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><text x="380" y="26" style="font-size:13px;fill:#334155;text-anchor:middle;font-weight:700">OXIDATION AND REDUCTION — LOSS AND GAIN OF ELECTRONS</text><path d="M 40 52 L 720 52 L 720 196 L 40 196 Z" fill="#fff5f5" stroke="#fecaca" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="56" y="74" style="font-size:11.5px;fill:#b91c1c;text-anchor:start;font-weight:700">OXIDATION — loss of electrons (LEO)</text><circle cx="140" cy="132" r="22" fill="#ffffff" stroke="#b91c1c" stroke-width="1.8"/><text x="140" y="136.55" style="font-size:13px;fill:#111827;text-anchor:middle;font-weight:700">Zn</text><line x1="176" y1="132" x2="258" y2="132" stroke="#b91c1c" stroke-width="1.8" stroke-linecap="round"/><path d="M 268 132 L 258 136.5 L 258 127.5 Z" fill="#b91c1c"/><text x="222" y="120" style="font-size:10.5px;fill:#b91c1c;text-anchor:middle;font-weight:700">− 2e⁻</text><circle cx="300" cy="132" r="24" fill="#ffffff" stroke="#b91c1c" stroke-width="1.8"/><text x="300" y="136.2" style="font-size:12px;fill:#111827;text-anchor:middle;font-weight:700">Zn²⁺</text><text x="420" y="126" style="font-size:10.5px;fill:#475569;text-anchor:start">zinc is oxidised; it is the reducing agent</text><text x="420" y="144" style="font-size:9.5px;fill:#6b7280;text-anchor:start">(it gives the electrons away and its oxidation number rises 0 → +2)</text><text x="650" y="74" style="font-size:9.5px;fill:#b91c1c;text-anchor:end">anode in a cell</text><path d="M 40 210 L 720 210 L 720 354 L 40 354 Z" fill="#f5f9ff" stroke="#bfdbfe" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="56" y="232" style="font-size:11.5px;fill:#1d4ed8;text-anchor:start;font-weight:700">REDUCTION — gain of electrons (GER)</text><circle cx="140" cy="292" r="24" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.8"/><text x="140" y="296.2" style="font-size:12px;fill:#111827;text-anchor:middle;font-weight:700">Cu²⁺</text><line x1="176" y1="292" x2="258" y2="292" stroke="#1d4ed8" stroke-width="1.8" stroke-linecap="round"/><path d="M 268 292 L 258 296.5 L 258 287.5 Z" fill="#1d4ed8"/><text x="222" y="280" style="font-size:10.5px;fill:#1d4ed8;text-anchor:middle;font-weight:700">+ 2e⁻</text><circle cx="300" cy="292" r="22" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.8"/><text x="300" y="296.55" style="font-size:13px;fill:#111827;text-anchor:middle;font-weight:700">Cu</text><text x="420" y="286" style="font-size:10.5px;fill:#475569;text-anchor:start">copper ion is reduced; Cu²⁺ is the oxidising agent</text><text x="420" y="304" style="font-size:9.5px;fill:#6b7280;text-anchor:start">(it takes the electrons and its oxidation number falls +2 → 0)</text><text x="650" y="232" style="font-size:9.5px;fill:#1d4ed8;text-anchor:end">cathode in a cell</text><text x="380" y="382" style="font-size:10.5px;fill:#475569;text-anchor:middle">Both changes happen in one reaction:  Zn + Cu²⁺ → Zn²⁺ + Cu  —  electrons are neither created nor destroyed.</text></svg>