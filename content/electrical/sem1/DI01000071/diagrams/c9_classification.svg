oke-linecap="round"/><line x1="380" y1="86" x2="380" y2="94" stroke="#111827" stroke-width="1.2" stroke-linecap="round"/><line x1="610" y1="86" x2="610" y2="94" stroke="#111827" stroke-width="1.2" stroke-linecap="round"/><path d="M 30 140 L 250 140 L 250 178 L 30 178 Z" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="140" y="157" style="font-size:8.8px;fill:#334155;text-anchor:middle;font-weight:700">Leclanché dry cell</text><text x="140" y="171" style="font-size:8.0px;fill:#475569;text-anchor:middle">1.5 V, torch, clock</text><path d="M 30 186 L 250 186 L 250 224 L 30 224 Z" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="140" y="203" style="font-size:8.8px;fill:#334155;text-anchor:middle;font-weight:700">Alkaline MnO₂–Zn</text><text x="140" y="217" style="font-size:8.0px;fill:#475569;text-anchor:middle">1.5 V, longer life</text><path d="M 30 232 L 250 232 L 250 270 L 30 270 Z" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="140" y="249" style="font-size:8.8px;fill:#334155;text-anchor:middle;font-weight:700">Mercury / silver oxide</text><text x="140" y="263" style="font-size:8.0px;fill:#475569;text-anchor:middle">1.35 V, watches, hearing aids</text><path d="M 30 278 L 250 278 L 250 316 L 30 316 Z" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="140" y="295" style="font-size:8.8px;fill:#334155;text-anchor:middle;font-weight:700">Lithium Li–MnO₂</text><text x="140" y="309" style="font-size:8.0px;fill:#475569;text-anchor:middle">3.0 V, cameras, pacemakers</text><path d="M 30 324 L 250 324 L 250 362 L 30 362 Z" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="140" y="341" style="font-size:8.8px;fill:#334155;text-anchor:middle;font-weight:700">Zinc–air</text><text x="140" y="355" style="font-size:8.0px;fill:#475569;text-anchor:middle">1.4 V, hearing aids</text><path d="M 270 140 L 490 140 L 490 178 L 270 178 Z" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="380" y="157" style="font-size:8.8px;fill:#334155;text-anchor:middle;font-weight:700">Lead–acid</text><text x="380" y="171" style="font-size:8.0px;fill:#475569;text-anchor:middle">2 V/cell, car, inverter</text><path d="M 270 186 L 490 186 L 490 224 L 270 224 Z" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="380" y="203" style="font-size:8.8px;fill:#334155;text-anchor:middle;font-weight:700">Nickel–cadmium</text><text x="380" y="217" style="font-size:8.0px;fill:#475569;text-anchor:middle">1.2 V, tools, emergency light</text><path d="M 270 232 L 490 232 L 490 270 L 270 270 Z" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="380" y="249" style="font-size:8.8px;fill:#334155;text-anchor:middle;font-weight:700">Nickel–metal hydride</text><text x="380" y="263" style="font-size:8.0px;fill:#475569;text-anchor:middle">1.2 V, hybrid cars</text><path d="M 270 278 L 490 278 L 490 316 L 270 316 Z" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="380" y="295" style="font-size:8.8px;fill:#334155;text-anchor:middle;font-weight:700">Lithium-ion</text><text x="380" y="309" style="font-size:8.0px;fill:#475569;text-anchor:middle">3.6 V, laptop, phone, EV</text><path d="M 270 324 L 490 324 L 490 362 L 270 362 Z" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="380" y="341" style="font-size:8.8px;fill:#334155;text-anchor:middle;font-weight:700">Flow battery</text><text x="380" y="355" style="font-size:8.0px;fill:#475569;text-anchor:middle">grid storage</text><path d="M 510 140 L 730 140 L 730 178 L 510 178 Z" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="620" y="157" style="font-size:8.8px;fill:#334155;text-anchor:middle;font-weight:700">H₂–O₂</text><text x="620" y="171" style="font-size:8.0px;fill:#475569;text-anchor:middle">spacecraft, buses</text><path d="M 510 186 L 730 186 L 730 224 L 510 224 Z" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="620" y="203" style="font-size:8.8px;fill:#334155;text-anchor:middle;font-weight:700">Methanol (DMFC)</text><text x="620" y="217" style="font-size:8.0px;fill:#475569;text-anchor:middle">portable power</text><path d="M 510 232 L 730 232 L 730 270 L 510 270 Z" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="620" y="249" style="font-size:8.8px;fill:#334155;text-anchor:middle;font-weight:700">Solid oxide (SOFC)</text><text x="620" y="263" style="font-size:8.0px;fill:#475569;text-anchor:middle">stationary power</text><path d="M 510 278 L 730 278 L 730 316 L 510 316 Z" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="620" y="295" style="font-size:8.8px;fill:#334155;text-anchor:middle;font-weight:700">Phosphoric acid</text><text x="620" y="309" style="font-size:8.0px;fill:#475569;text-anchor:middle">CHP plants</text><text x="380" y="390" style="font-size:8.4px;fill:#475569;text-anchor:middle">Primary: the reaction is not reversible.  Secondary: it is reversible, so the cell can be charged.  Fuel cell: reactants are fed in and never stored inside.</text></svg>