<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="100%" style="max-width:760px;height:auto;display:block;margin:0 auto;background:#ffffff" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><text x="380" y="26" style="font-size:13px;fill:#334155;text-anchor:middle;font-weight:700">CHOOSING A LUBRICANT FOR THE JOB</text><path d="M 40 56 L 330 56 L 330 96 L 40 96 Z" fill="#eff6ff" stroke="#e5e7eb" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="54" y="81" style="font-size:9.4px;fill:#1d4ed8;text-anchor:start;font-weight:700">Gears and gearboxes</text><path d="M 340 56 L 720 56 L 720 96 L 340 96 Z" fill="#ffffff" stroke="#eef2f7" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="354" y="81" style="font-size:9.0px;fill:#334155;text-anchor:start">EP gear oil with sulphur-phosphorus additive, high viscosity</text><path d="M 40 106 L 330 106 L 330 146 L 40 146 Z" fill="#fef9c3" stroke="#e5e7eb" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="54" y="131" style="font-size:9.4px;fill:#b45309;text-anchor:start;font-weight:700">Cutting tools</text><path d="M 340 106 L 720 106 L 720 146 L 340 146 Z" fill="#ffffff" stroke="#eef2f7" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="354" y="131" style="font-size:9.0px;fill:#334155;text-anchor:start">soluble oil or neat cutting oil — cooling plus lubrication</text><path d="M 40 156 L 330 156 L 330 196 L 40 196 Z" fill="#f0fdf4" stroke="#e5e7eb" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="54" y="181" style="font-size:9.4px;fill:#047857;text-anchor:start;font-weight:700">Steam turbine</text><path d="M 340 156 L 720 156 L 720 196 L 340 196 Z" fill="#ffffff" stroke="#eef2f7" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="354" y="181" style="font-size:9.0px;fill:#334155;text-anchor:start">turbine oil with high VI, rust and oxidation inhibited, 32–68 cSt</text><path d="M 40 206 L 330 206 L 330 246 L 40 246 Z" fill="#f5f3ff" stroke="#e5e7eb" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="54" y="231" style="font-size:9.4px;fill:#7c3aed;text-anchor:start;font-weight:700">Transformer</text><path d="M 340 206 L 720 206 L 720 246 L 340 246 Z" fill="#ffffff" stroke="#eef2f7" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="354" y="231" style="font-size:9.0px;fill:#334155;text-anchor:start">transformer oil — insulating, high dielectric strength, low pour point</text><path d="M 40 256 L 330 256 L 330 296 L 40 296 Z" fill="#fef2f2" stroke="#e5e7eb" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="54" y="281" style="font-size:9.4px;fill:#b91c1c;text-anchor:start;font-weight:700">Roller bearings</text><path d="M 340 256 L 720 256 L 720 296 L 340 296 Z" fill="#ffffff" stroke="#eef2f7" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="354" y="281" style="font-size:9.0px;fill:#334155;text-anchor:start">grease (lithium soap) — stays in place, seals out dirt</text><path d="M 40 306 L 330 306 L 330 346 L 40 346 Z" fill="#ecfeff" stroke="#e5e7eb" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="54" y="331" style="font-size:9.4px;fill:#0891b2;text-anchor:start;font-weight:700">Refrigeration compressor</text><path d="M 340 306 L 720 306 L 720 346 L 340 346 Z" fill="#ffffff" stroke="#eef2f7" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="354" y="331" style="font-size:9.0px;fill:#334155;text-anchor:start">naphthenic oil, wax-free so it does not block the expansion valve</text><text x="380" y="376" style="font-size:9.2px;fill:#475569;text-anchor:middle">Match the oil to the speed, the load and the temperature — not to the colour of the can.</text></svg>