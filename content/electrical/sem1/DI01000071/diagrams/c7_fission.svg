<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="100%" style="max-width:760px;height:auto;display:block;margin:0 auto;background:#ffffff" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><text x="380" y="26" style="font-size:13px;fill:#334155;text-anchor:middle;font-weight:700">BOND FISSION AND THE INTERMEDIATES IT PRODUCES</text><path d="M 30 44 L 370 44 L 370 250 L 30 250 Z" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="200" y="66" style="font-size:10.6px;fill:#1d4ed8;text-anchor:middle;font-weight:700">Homolytic fission</text><text x="200" y="96" style="font-size:11.0px;fill:#334155;text-anchor:middle;font-weight:700">A : B</text><line x1="120" y1="110" x2="94.24" y2="135.76" stroke="#b91c1c" stroke-width="1.3" stroke-linecap="round"/><path d="M 90 140 L 92.33 133.85 L 96.15 137.67 Z" fill="#b91c1c"/><line x1="280" y1="110" x2="305.76" y2="135.76" stroke="#b91c1c" stroke-width="1.3" stroke-linecap="round"/><path d="M 310 140 L 303.85 137.67 L 307.67 133.85 Z" fill="#b91c1c"/><text x="120" y="152" style="font-size:12.0px;fill:#b91c1c;text-anchor:middle;font-weight:700">A•</text><text x="280" y="152" style="font-size:12.0px;fill:#b91c1c;text-anchor:middle;font-weight:700">•B</text><text x="200" y="182" style="font-size:8.8px;fill:#475569;text-anchor:middle">one electron to each fragment</text><text x="200" y="202" style="font-size:8.8px;fill:#475569;text-anchor:middle">needs light or heat, gives free radicals</text><text x="200" y="228" style="font-size:8.6px;fill:#334155;text-anchor:middle">C–C bond in cracking, chlorination of methane</text><path d="M 390 44 L 730 44 L 730 250 L 390 250 Z" fill="#fdf4ff" stroke="#e9d5ff" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="560" y="66" style="font-size:10.6px;fill:#7c3aed;text-anchor:middle;font-weight:700">Heterolytic fission</text><text x="560" y="96" style="font-size:11.0px;fill:#334155;text-anchor:middle;font-weight:700">A : B</text><line x1="480" y1="110" x2="454.24" y2="135.76" stroke="#7c3aed" stroke-width="1.3" stroke-linecap="round"/><path d="M 450 140 L 452.33 133.85 L 456.15 137.67 Z" fill="#7c3aed"/><line x1="640" y1="110" x2="665.76" y2="135.76" stroke="#7c3aed" stroke-width="1.3" stroke-linecap="round"/><path d="M 670 140 L 663.85 137.67 L 667.67 133.85 Z" fill="#7c3aed"/><text x="470" y="152" style="font-size:12.0px;fill:#7c3aed;text-anchor:middle;font-weight:700">A⁺</text><text x="650" y="152" style="font-size:12.0px;fill:#7c3aed;text-anchor:middle;font-weight:700">B⁻</text><text x="560" y="182" style="font-size:8.8px;fill:#475569;text-anchor:middle">both electrons go to one fragment</text><text x="560" y="202" style="font-size:8.8px;fill:#475569;text-anchor:middle">gives ions — the commoner route in solution</text><text x="560" y="228" style="font-size:8.6px;fill:#334155;text-anchor:middle">ionisation of tert-butyl chloride, SN1</text><path d="M 30 262 L 730 262 L 730 400 L 30 400 Z" fill="#f7fdf9" stroke="#bbf7d0" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="380" y="284" style="font-size:10.2px;fill:#047857;text-anchor:middle;font-weight:700">The three intermediates you must be able to draw</text><path d="M 46 296 L 260 296 L 260 388 L 46 388 Z" fill="#ffffff" stroke="#d1fae5" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="153" y="316" style="font-size:9.2px;fill:#047857;text-anchor:middle;font-weight:700">Carbocation  CH₃⁺</text><text x="153" y="340" style="font-size:8.2px;fill:#475569;text-anchor:middle">6 electrons, sp², planar, electron‑deficient</text><text x="153" y="362" style="font-size:7.8px;fill:#334155;text-anchor:middle">3° > 2° > 1° > CH₃⁺ (hyperconjugation + inductive)</text><path d="M 276 296 L 490 296 L 490 388 L 276 388 Z" fill="#ffffff" stroke="#d1fae5" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="383" y="316" style="font-size:9.2px;fill:#047857;text-anchor:middle;font-weight:700">Carbanion  CH₃⁻</text><text x="383" y="340" style="font-size:8.2px;fill:#475569;text-anchor:middle">8 electrons and a lone pair, sp³, pyramidal</text><text x="383" y="362" style="font-size:7.8px;fill:#334155;text-anchor:middle">1° > 2° > 3° (opposite of the carbocation)</text><path d="M 506 296 L 720 296 L 720 388 L 506 388 Z" fill="#ffffff" stroke="#d1fae5" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="613" y="316" style="font-size:9.2px;fill:#047857;text-anchor:middle;font-weight:700">Free radical  CH₃•</text><text x="613" y="340" style="font-size:8.2px;fill:#475569;text-anchor:middle">7 electrons, sp², planar, one odd electron</text><text x="613" y="362" style="font-size:7.8px;fill:#334155;text-anchor:middle">3° > 2° > 1°; used in polymerisation</text></svg>