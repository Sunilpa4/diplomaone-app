<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="100%" style="max-width:760px;height:auto;display:block;margin:0 auto;background:#ffffff" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><text x="380" y="26" style="font-size:13px;fill:#334155;text-anchor:middle;font-weight:700">COAL ANALYSIS — PROXIMATE AND ULTIMATE</text><path d="M 30 44 L 370 44 L 370 396 L 30 396 Z" fill="#f7fbf7" stroke="#bbf7d0" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="200" y="66" style="font-size:11px;fill:#047857;text-anchor:middle;font-weight:700">Proximate analysis</text><text x="200" y="86" style="font-size:8.8px;fill:#475569;text-anchor:middle">what the coal contains as received</text><path d="M 48 106 L 352 106 L 352 162 L 48 162 Z" fill="#ffffff" stroke="#d1fae5" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="60" y="126" style="font-size:9.4px;fill:#334155;text-anchor:start;font-weight:700">Moisture</text><text x="60" y="144" style="font-size:8.8px;fill:#475569;text-anchor:start">110 °C, 1 h</text><text x="60" y="158" style="font-size:8.8px;fill:#475569;text-anchor:start">weight loss</text><path d="M 48 174 L 352 174 L 352 230 L 48 230 Z" fill="#ffffff" stroke="#d1fae5" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="60" y="194" style="font-size:9.4px;fill:#334155;text-anchor:start;font-weight:700">Volatile matter</text><text x="60" y="212" style="font-size:8.8px;fill:#475569;text-anchor:start">950 °C, 7 min, no air</text><text x="60" y="226" style="font-size:8.8px;fill:#475569;text-anchor:start">smoke and tar</text><path d="M 48 242 L 352 242 L 352 298 L 48 298 Z" fill="#ffffff" stroke="#d1fae5" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="60" y="262" style="font-size:9.4px;fill:#334155;text-anchor:start;font-weight:700">Ash</text><text x="60" y="280" style="font-size:8.8px;fill:#475569;text-anchor:start">burn at 800 °C in air</text><text x="60" y="294" style="font-size:8.8px;fill:#475569;text-anchor:start">mineral residue</text><path d="M 48 310 L 352 310 L 352 366 L 48 366 Z" fill="#ffffff" stroke="#d1fae5" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="60" y="330" style="font-size:9.4px;fill:#334155;text-anchor:start;font-weight:700">Fixed carbon</text><text x="60" y="348" style="font-size:8.8px;fill:#475569;text-anchor:start">100 − (M + VM + Ash)</text><text x="60" y="362" style="font-size:8.8px;fill:#475569;text-anchor:start">the burning coke</text><path d="M 390 44 L 730 44 L 730 396 L 390 396 Z" fill="#fbfcff" stroke="#bfdbfe" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="560" y="66" style="font-size:11px;fill:#1d4ed8;text-anchor:middle;font-weight:700">Ultimate analysis</text><text x="560" y="86" style="font-size:8.8px;fill:#475569;text-anchor:middle">the elements, on a mass % basis</text><path d="M 408 106 L 712 106 L 712 144 L 408 144 Z" fill="#ffffff" stroke="#dbeafe" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="420" y="122" style="font-size:9.2px;fill:#334155;text-anchor:start;font-weight:700">Carbon, C</text><text x="420" y="138" style="font-size:8.6px;fill:#475569;text-anchor:start">main source of heat</text><path d="M 408 152 L 712 152 L 712 190 L 408 190 Z" fill="#ffffff" stroke="#dbeafe" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="420" y="168" style="font-size:9.2px;fill:#334155;text-anchor:start;font-weight:700">Hydrogen, H</text><text x="420" y="184" style="font-size:8.6px;fill:#475569;text-anchor:start">highest heat per kg, but it makes water</text><path d="M 408 198 L 712 198 L 712 236 L 408 236 Z" fill="#ffffff" stroke="#dbeafe" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="420" y="214" style="font-size:9.2px;fill:#334155;text-anchor:start;font-weight:700">Sulphur, S</text><text x="420" y="230" style="font-size:8.6px;fill:#475569;text-anchor:start">heat yes, corrosion and SO₂ no</text><path d="M 408 244 L 712 244 L 712 282 L 408 282 Z" fill="#ffffff" stroke="#dbeafe" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="420" y="260" style="font-size:9.2px;fill:#334155;text-anchor:start;font-weight:700">Nitrogen, N</text><text x="420" y="276" style="font-size:8.6px;fill:#475569;text-anchor:start">inert — dilutes the flue gas</text><path d="M 408 290 L 712 290 L 712 328 L 408 328 Z" fill="#ffffff" stroke="#dbeafe" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="420" y="306" style="font-size:9.2px;fill:#334155;text-anchor:start;font-weight:700">Oxygen, O</text><text x="420" y="322" style="font-size:8.6px;fill:#475569;text-anchor:start">already combined, so it reduces the heat</text><path d="M 408 336 L 712 336 L 712 374 L 408 374 Z" fill="#ffffff" stroke="#dbeafe" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="420" y="352" style="font-size:9.2px;fill:#334155;text-anchor:start;font-weight:700">Ash + moisture</text><text x="420" y="368" style="font-size:8.6px;fill:#475569;text-anchor:start">dead weight, lowers the CV</text><text x="380" y="416" style="font-size:9.2px;fill:#475569;text-anchor:middle">Proximate analysis tells you how the coal will burn; ultimate analysis lets you calculate the calorific value by Dulong’s formula.</text></svg>