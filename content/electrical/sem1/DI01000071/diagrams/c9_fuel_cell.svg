<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="100%" style="max-width:760px;height:auto;display:block;margin:0 auto;background:#ffffff" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><text x="380" y="26" style="font-size:13px;fill:#334155;text-anchor:middle;font-weight:700">HYDROGEN–OXYGEN FUEL CELL</text><path d="M 330 70 L 430 70 L 430 340 L 330 340 Z" fill="#fef9c3" stroke="#111827" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="380" y="200" style="font-size:9.0px;fill:#b45309;text-anchor:middle;font-weight:700">porous</text><text x="380" y="218" style="font-size:9.0px;fill:#b45309;text-anchor:middle;font-weight:700">electrolyte</text><text x="380" y="236" style="font-size:8.4px;fill:#475569;text-anchor:middle">KOH / Nafion</text><line x1="332" y1="100" x2="428" y2="100" stroke="#eab308" stroke-width="1.0" stroke-linecap="round"/><line x1="332" y1="150" x2="428" y2="150" stroke="#eab308" stroke-width="1.0" stroke-linecap="round"/><line x1="332" y1="250" x2="428" y2="250" stroke="#eab308" stroke-width="1.0" stroke-linecap="round"/><line x1="332" y1="300" x2="428" y2="300" stroke="#eab308" stroke-width="1.0" stroke-linecap="round"/><path d="M 300 70 L 330 70 L 330 340 L 300 340 Z" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M 430 70 L 460 70 L 460 340 L 430 340 Z" fill="#fecaca" stroke="#b91c1c" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="315" y="58" style="font-size:8.4px;fill:#7c3aed;text-anchor:middle;font-weight:700">anode</text><text x="445" y="58" style="font-size:8.4px;fill:#b91c1c;text-anchor:middle;font-weight:700">cathode</text><line x1="120" y1="120" x2="289" y2="120" stroke="#7c3aed" stroke-width="1.6" stroke-linecap="round"/><path d="M 296 120 L 289 123.15 L 289 116.85 Z" fill="#7c3aed"/><text x="200" y="110" style="font-size:9.0px;fill:#7c3aed;text-anchor:middle;font-weight:700">H₂ in (fuel)</text><line x1="120" y1="300" x2="289" y2="300" stroke="#b91c1c" stroke-width="1.6" stroke-linecap="round"/><path d="M 296 300 L 289 303.15 L 289 296.85 Z" fill="#b91c1c"/><text x="200" y="290" style="font-size:9.0px;fill:#b91c1c;text-anchor:middle;font-weight:700">O₂ / air in</text><line x1="464" y1="210" x2="633" y2="210" stroke="#0284c7" stroke-width="1.6" stroke-linecap="round"/><path d="M 640 210 L 633 213.15 L 633 206.85 Z" fill="#0284c7"/><text x="552" y="200" style="font-size:9.0px;fill:#0284c7;text-anchor:middle;font-weight:700">H₂O + heat out</text><line x1="315" y1="70" x2="315" y2="40" stroke="#111827" stroke-width="1.4" stroke-linecap="round"/><line x1="315" y1="40" x2="445" y2="40" stroke="#111827" stroke-width="1.4" stroke-linecap="round"/><line x1="445" y1="40" x2="445" y2="70" stroke="#111827" stroke-width="1.4" stroke-linecap="round"/><circle cx="380" cy="40" r="8" fill="1.6" stroke="#111827" stroke-width="#ffffff"/><text x="380" y="44" style="font-size:8.0px;fill:#111827;text-anchor:middle">e⁻</text><text x="380" y="22" style="font-size:8.4px;fill:#475569;text-anchor:middle">external circuit — the electrons do the work</text><path d="M 40 356 L 720 356 L 720 412 L 40 412 Z" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="380" y="376" style="font-size:8.6px;fill:#047857;text-anchor:middle;font-weight:700">Anode: 2H₂ → 4H⁺ + 4e⁻      Cathode: O₂ + 4H⁺ + 4e⁻ → 2H₂O      Overall: 2H₂ + O₂ → 2H₂O</text><text x="380" y="398" style="font-size:8.4px;fill:#475569;text-anchor:middle">Efficiency 60–70 % against about 35 % for a diesel engine, and the only product is water — used in spacecraft, buses and backup power.</text></svg>