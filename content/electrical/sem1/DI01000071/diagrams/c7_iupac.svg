<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="100%" style="max-width:760px;height:auto;display:block;margin:0 auto;background:#ffffff" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><text x="380" y="26" style="font-size:13px;fill:#334155;text-anchor:middle;font-weight:700">IUPAC NAMING OF AN ORGANIC COMPOUND — THE ORDER OF STEPS</text><path d="M 40 46 L 720 46 L 720 104 L 40 104 Z" fill="#eff6ff" stroke="#e5e7eb" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/><text x="52" y="70" style="font-size:10.2px;fill:#1d4ed8;text-anchor:start;font-weight:700">1  Longest chain</text><text x="52" y="88" style="font-size:8.8px;fill:#475569;text-anchor:start">find the parent chain and count its carbons</text><text x="380" y="88" style="font-size:8.8px;fill:#334155;text-anchor:start">1 C = meth, 2 = eth, 3 = prop, 4 = but, 5 = pent</text><path d="M 40 114 L 720 114 L 720 172 L 40 172 Z" fill="#f0fdf4" stroke="#e5e7eb" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/><text x="52" y="138" style="font-size:10.2px;fill:#047857;text-anchor:start;font-weight:700">2  Suffix</text><text x="52" y="156" style="font-size:8.8px;fill:#475569;text-anchor:start">the principal group decides the ending</text><text x="380" y="156" style="font-size:8.8px;fill:#334155;text-anchor:start">alkane ‑ane · alkene ‑ene · alcohol ‑ol · acid ‑oic acid</text><path d="M 40 182 L 720 182 L 720 240 L 40 240 Z" fill="#fffbeb" stroke="#e5e7eb" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/><text x="52" y="206" style="font-size:10.2px;fill:#b45309;text-anchor:start;font-weight:700">3  Numbering</text><text x="52" y="224" style="font-size:8.8px;fill:#475569;text-anchor:start">number from the end that gives the lowest locant</text><text x="380" y="224" style="font-size:8.8px;fill:#334155;text-anchor:start">2‑methyl, not 4‑methyl</text><path d="M 40 250 L 720 250 L 720 308 L 40 308 Z" fill="#fdf4ff" stroke="#e5e7eb" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/><text x="52" y="274" style="font-size:10.2px;fill:#7c3aed;text-anchor:start;font-weight:700">4  Prefixes</text><text x="52" y="292" style="font-size:8.8px;fill:#475569;text-anchor:start">substituents in alphabetical order with their positions</text><text x="380" y="292" style="font-size:8.8px;fill:#334155;text-anchor:start">3‑ethyl‑2‑methylhexane</text><path d="M 40 318 L 720 318 L 720 376 L 40 376 Z" fill="#fef2f2" stroke="#e5e7eb" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/><text x="52" y="342" style="font-size:10.2px;fill:#b91c1c;text-anchor:start;font-weight:700">5  Punctuation</text><text x="52" y="360" style="font-size:8.8px;fill:#475569;text-anchor:start">numbers separated by commas, number and word by a hyphen</text><text x="380" y="360" style="font-size:8.8px;fill:#334155;text-anchor:start">2,3‑dimethylbutane</text><path d="M 40 390 L 720 390 L 720 418 L 40 418 Z" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="380" y="410" style="font-size:9.6px;fill:#7c3aed;text-anchor:middle;font-weight:700">Worked name: CH₃‑CH(CH₃)‑CH₂‑CH₂‑OH  →  3‑methylbutan‑1‑ol</text></svg>