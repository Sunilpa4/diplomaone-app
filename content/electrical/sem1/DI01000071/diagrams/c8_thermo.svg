<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="100%" style="max-width:760px;height:auto;display:block;margin:0 auto;background:#ffffff" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><text x="380" y="26" style="font-size:13px;fill:#334155;text-anchor:middle;font-weight:700">THERMOPLASTIC AND THERMOSETTING POLYMERS</text><path d="M 30 46 L 370 46 L 370 200 L 30 200 Z" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="200" y="68" style="font-size:11.0px;fill:#0891b2;text-anchor:middle;font-weight:700">Thermoplastic</text><line x1="70" y1="96" x2="330" y2="96" stroke="#0891b2" stroke-width="2.4" stroke-linecap="round"/><line x1="70" y1="120" x2="330" y2="120" stroke="#0891b2" stroke-width="2.4" stroke-linecap="round"/><line x1="70" y1="144" x2="330" y2="144" stroke="#0891b2" stroke-width="2.4" stroke-linecap="round"/><line x1="70" y1="168" x2="330" y2="168" stroke="#0891b2" stroke-width="2.4" stroke-linecap="round"/><text x="200" y="190" style="font-size:8.4px;fill:#475569;text-anchor:middle">long chains held by weak van der Waals forces</text><path d="M 390 46 L 730 46 L 730 200 L 390 200 Z" fill="#fef2f2" stroke="#fecaca" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="560" y="68" style="font-size:11.0px;fill:#b91c1c;text-anchor:middle;font-weight:700">Thermosetting</text><line x1="430" y1="96" x2="690" y2="96" stroke="#b91c1c" stroke-width="2.4" stroke-linecap="round"/><line x1="430" y1="120" x2="690" y2="120" stroke="#b91c1c" stroke-width="2.4" stroke-linecap="round"/><line x1="430" y1="144" x2="690" y2="144" stroke="#b91c1c" stroke-width="2.4" stroke-linecap="round"/><line x1="430" y1="168" x2="690" y2="168" stroke="#b91c1c" stroke-width="2.4" stroke-linecap="round"/><line x1="450" y1="96" x2="450" y2="168" stroke="#b91c1c" stroke-width="1.6" stroke-linecap="round"/><line x1="518" y1="96" x2="518" y2="168" stroke="#b91c1c" stroke-width="1.6" stroke-linecap="round"/><line x1="586" y1="96" x2="586" y2="168" stroke="#b91c1c" stroke-width="1.6" stroke-linecap="round"/><line x1="654" y1="96" x2="654" y2="168" stroke="#b91c1c" stroke-width="1.6" stroke-linecap="round"/><text x="560" y="190" style="font-size:8.4px;fill:#475569;text-anchor:middle">chains cross-linked into one giant network</text><path d="M 30 216 L 370 216 L 370 292 L 30 292 Z" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="200" y="240" style="font-size:9.0px;fill:#334155;text-anchor:middle">Softens on heating, sets on cooling</text><text x="200" y="260" style="font-size:9.0px;fill:#334155;text-anchor:middle">Can be recycled and reshaped</text><text x="200" y="280" style="font-size:8.8px;fill:#475569;text-anchor:middle">PE, PVC, PP, PS, nylon, PMMA</text><path d="M 390 216 L 730 216 L 730 292 L 390 292 Z" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="560" y="240" style="font-size:8.8px;fill:#334155;text-anchor:middle">Sets hard and cannot be softened again</text><text x="560" y="260" style="font-size:8.8px;fill:#334155;text-anchor:middle">Chars or burns instead of melting</text><text x="560" y="280" style="font-size:8.4px;fill:#475569;text-anchor:middle">bakelite, epoxy, melamine, vulcanised rubber</text><path d="M 30 306 L 730 306 L 730 400 L 30 400 Z" fill="#fbfaff" stroke="#ddd6fe" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="380" y="328" style="font-size:10.0px;fill:#7c3aed;text-anchor:middle;font-weight:700">Examples and why they differ</text><text x="380" y="352" style="font-size:8.8px;fill:#334155;text-anchor:middle">A thermoplastic can be melted because its chains can slide past one another; a thermoset cannot, because the covalent cross-links hold the chains in one network.</text><text x="380" y="380" style="font-size:8.8px;fill:#475569;text-anchor:middle">Practical rule: parts that must be reused or welded → thermoplastic; parts that must hold their shape when hot → thermoset.</text></svg>