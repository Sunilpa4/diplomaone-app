<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif" fill="#30303b"><rect width="900" height="620" fill="white"/><text x="25" y="35" font-size="22">UJT qualitative emitter characteristic:peak and valley</text><path d="M150 450L760 450" stroke="#765099" stroke-width="3" fill="none"/><path d="M150 450L150 90" stroke="#765099" stroke-width="3" fill="none"/><text x="70" y="100" font-size="19">VE</text><text x="760" y="490" font-size="19">IE</text><path d="M150 450L280 160L430 330L710 210" stroke="#2679ad" stroke-width="4" fill="none"/><text x="245" y="135" font-size="22">Peak</text><text x="415" y="370" font-size="22">Valley</text><text x="445" y="135" font-size="21">Negative differential</text><text x="445" y="165" font-size="21">resistance section</text><text x="30" y="525" font-size="15">Between peak and valley,the slope dVE/dIE is negative.The axes are intentionally not</text><text x="30" y="543" font-size="15">calibrated.Actual oscillation depends on charging load line,reset current and the selected device.</text><text x="25" y="606" font-size="13">Original teaching schematic · illustrative values · not a live-wiring instruction</text></svg>