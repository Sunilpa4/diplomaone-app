<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif" fill="#30303b"><rect width="900" height="620" fill="white"/><text x="25" y="35" font-size="22">Seven-segment LED:segment names a through g</text><rect x="350" y="120" width="170" height="20" fill="#d87373" stroke="#765099" stroke-width="2"/><text x="532" y="136.0" font-size="20">a</text><rect x="350" y="290" width="170" height="20" fill="#d87373" stroke="#765099" stroke-width="2"/><text x="532" y="306.0" font-size="20">g</text><rect x="350" y="460" width="170" height="20" fill="#d87373" stroke="#765099" stroke-width="2"/><text x="532" y="476.0" font-size="20">d</text><rect x="320" y="155" width="20" height="115" fill="#d87373" stroke="#765099" stroke-width="2"/><text x="352" y="218.5" font-size="20">f</text><rect x="530" y="155" width="20" height="115" fill="#d87373" stroke="#765099" stroke-width="2"/><text x="562" y="218.5" font-size="20">b</text><rect x="320" y="330" width="20" height="115" fill="#d87373" stroke="#765099" stroke-width="2"/><text x="352" y="393.5" font-size="20">e</text><rect x="530" y="330" width="20" height="115" fill="#d87373" stroke="#765099" stroke-width="2"/><text x="562" y="393.5" font-size="20">c</text><circle cx="610" cy="470" r="12" fill="#d87373" stroke="#765099" stroke-width="3"/><text x="640" y="480" font-size="20">dp</text><text x="80" y="250" font-size="20">Each segment</text><text x="80" y="280" font-size="20">needs limiting R</text><text x="30" y="525" font-size="15">Verify common-anode/common-cathode and pinout from the part data sheet.The display approximates a</text><text x="30" y="543" font-size="15">limited character set;not every letter is unambiguous.Drive every segment within its current rating.</text><text x="25" y="606" font-size="13">Original teaching schematic · illustrative values · not a live-wiring instruction</text></svg>