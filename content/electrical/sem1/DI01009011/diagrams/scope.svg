<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif" fill="#30303b"><rect width="900" height="620" fill="white"/><text x="25" y="35" font-size="22">CRO/DSO:reference connection before measurements</text><rect x="35" y="110" width="235" height="55" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="45" y="136" font-size="18">Earth clip</text><path d="M280 137L310 137" stroke="#2679ad" stroke-width="3" fill="none"/><path d="M298.94726807196537 141.6730201077038L310 137L298.94726807196537 132.3269798922962" stroke="#2679ad" stroke-width="3" fill="none"/><rect x="320" y="110" width="545" height="55" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="330" y="136" font-size="18">Usually bonded to protective earth</text><rect x="35" y="178" width="235" height="55" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="45" y="204" font-size="18">Approved setup</text><path d="M280 205L310 205" stroke="#2679ad" stroke-width="3" fill="none"/><path d="M298.94726807196537 209.6730201077038L310 205L298.94726807196537 200.3269798922962" stroke="#2679ad" stroke-width="3" fill="none"/><rect x="320" y="178" width="545" height="55" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="330" y="204" font-size="18">Isolated low-voltage trainer;known common point</text><rect x="35" y="246" width="235" height="55" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="45" y="272" font-size="18">Probe</text><path d="M280 273L310 273" stroke="#2679ad" stroke-width="3" fill="none"/><path d="M298.94726807196537 277.6730201077038L310 273L298.94726807196537 268.3269798922962" stroke="#2679ad" stroke-width="3" fill="none"/><rect x="320" y="246" width="545" height="55" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="330" y="272" font-size="18">Check attenuation,range and compensation</text><rect x="35" y="314" width="235" height="55" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="45" y="340" font-size="18">Ripple</text><path d="M280 341L310 341" stroke="#2679ad" stroke-width="3" fill="none"/><path d="M298.94726807196537 345.6730201077038L310 341L298.94726807196537 336.3269798922962" stroke="#2679ad" stroke-width="3" fill="none"/><rect x="320" y="314" width="545" height="55" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="330" y="340" font-size="18">State coupling,scale,timebase and measurement</text><text x="30" y="525" font-size="15">Never defeat protective earth or connect ground clips to two different live nodes.A bridge rectifier</text><text x="30" y="543" font-size="15">can make AC and DC reference choices incompatible;use the trainer-approved differential/isolated</text><text x="30" y="561" font-size="15">measurement method.</text><text x="25" y="606" font-size="13">Original teaching schematic · illustrative values · not a live-wiring instruction</text></svg>