<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif" fill="#30303b"><rect width="900" height="620" fill="white"/><text x="25" y="35" font-size="22">Optical fibre:core,cladding and total internal reflection</text><rect x="100" y="165" width="680" height="250" fill="#eee7f3" stroke="#765099" stroke-width="2"/><rect x="110" y="180" width="660" height="220" fill="#e4ecf8" stroke="#765099" stroke-width="2"/><rect x="110" y="240" width="660" height="100" fill="#f0e5d7" stroke="#765099" stroke-width="2"/><path d="M130 290L280 240L580 340L760 280" stroke="#2679ad" stroke-width="4" fill="none"/><text x="365" y="150" font-size="23">Cladding:n2</text><text x="155" y="325" font-size="23">Core:n1</text><text x="350" y="445" font-size="22">n1 &gt; n2;step-index illustration</text><path d="M45 290L120 290" stroke="#be6633" stroke-width="3" fill="none"/><path d="M108.94726807196538 294.6730201077038L120 290L108.94726807196538 285.3269798922962" stroke="#be6633" stroke-width="3" fill="none"/><path d="M270 445L270 415" stroke="#765099" stroke-width="3" fill="none"/><text x="140" y="480" font-size="20">Protective coating</text><text x="30" y="525" font-size="15">Guided rays strike the core-cladding interface above its critical angle,measured from the normal.The</text><text x="30" y="543" font-size="15">drawing is schematic;coating protects the fibre but is not the guiding cladding.Never look into an</text><text x="30" y="561" font-size="15">energised fibre end.</text><text x="25" y="606" font-size="13">Original teaching schematic · illustrative values · not a live-wiring instruction</text></svg>