<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif" fill="#30303b"><rect width="900" height="620" fill="white"/><text x="25" y="35" font-size="22">NPN physical structure:emitter,thin base and collector</text><rect x="160" y="190" width="160" height="160" fill="#deebfa" stroke="#765099" stroke-width="2"/><rect x="320" y="190" width="80" height="160" fill="#f7e1dc" stroke="#765099" stroke-width="2"/><rect x="400" y="190" width="270" height="160" fill="#deebfa" stroke="#765099" stroke-width="2"/><text x="210" y="245" font-size="25">N+</text><text x="340" y="245" font-size="25">P</text><text x="520" y="245" font-size="25">N</text><text x="175" y="395" font-size="22">Emitter</text><text x="305" y="435" font-size="22">Thin base</text><text x="485" y="395" font-size="22">Collector</text><path d="M225 290L580 290" stroke="#2679ad" stroke-width="3" fill="none"/><path d="M568.9472680719654 294.6730201077038L580 290L568.9472680719654 285.3269798922962" stroke="#2679ad" stroke-width="3" fill="none"/><text x="225" y="155" font-size="22">Electron motion in NPN</text><text x="30" y="525" font-size="15">Emitter injects carriers into the thin,lightly doped base.Most reach the reverse-biased collector</text><text x="30" y="543" font-size="15">junction.Conventional current is opposite electron motion.PNP exchanges carrier types and</text><text x="30" y="561" font-size="15">polarities.</text><text x="25" y="606" font-size="13">Original teaching schematic · illustrative values · not a live-wiring instruction</text></svg>