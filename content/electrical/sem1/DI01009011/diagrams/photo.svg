<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif" fill="#30303b"><rect width="900" height="620" fill="white"/><text x="25" y="35" font-size="22">Photoelectric sensing:incident light creates carriers</text><rect x="220" y="170" width="390" height="180" fill="#e9e2f1" stroke="#765099" stroke-width="2"/><path d="M350 260L385 260" stroke="#765099" stroke-width="3" fill="none"/><path d="M385 235L385 285L435 260Z" stroke="#765099" stroke-width="3" fill="none"/><path d="M435 232L435 288" stroke="#765099" stroke-width="3" fill="none"/><path d="M435 260L470 260" stroke="#765099" stroke-width="3" fill="none"/><text x="390" y="220" font-size="18">Photodiode</text><path d="M215 115L335 205" stroke="#be6633" stroke-width="3" fill="none"/><path d="M323.35400239295 202.10677692934226L335 205L328.9616265221946 194.62994475701618" stroke="#be6633" stroke-width="3" fill="none"/><path d="M280 105L375 195" stroke="#be6633" stroke-width="3" fill="none"/><path d="M363.7623950236989 190.79093426083503L375 195L370.1900841610044 184.00615128256808" stroke="#be6633" stroke-width="3" fill="none"/><text x="220" y="420" font-size="23">Light → charge carriers → photocurrent</text><text x="30" y="525" font-size="15">Photodiodes may work with reverse bias or photovoltaic operation,depending on the</text><text x="30" y="543" font-size="15">circuit.Phototransistors add internal current gain,but can be slower and temperature-dependent.Never</text><text x="30" y="561" font-size="15">infer polarity from package shape alone.</text><text x="25" y="606" font-size="13">Original teaching schematic · illustrative values · not a live-wiring instruction</text></svg>