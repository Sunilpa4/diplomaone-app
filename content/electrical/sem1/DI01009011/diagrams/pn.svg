<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif" fill="#30303b"><rect width="900" height="620" fill="white"/><text x="25" y="35" font-size="22">PN junction at equilibrium:fixed ions in depletion layer</text><rect x="140" y="170" width="250" height="210" fill="#fae4df" stroke="#765099" stroke-width="2"/><rect x="390" y="170" width="250" height="210" fill="#e1eef8" stroke="#765099" stroke-width="2"/><rect x="345" y="170" width="90" height="210" fill="#eee" stroke="#765099" stroke-width="2"/><text x="220" y="225" font-size="19">P region</text><text x="480" y="225" font-size="19">N region</text><text x="285" y="420" font-size="19">Depletion region</text><text x="350" y="290" font-size="18">− −</text><text x="394" y="290" font-size="18">+ +</text><path d="M425 330L355 330" stroke="#2679ad" stroke-width="3" fill="none"/><path d="M366.05273192803463 325.3269798922962L355 330L366.05273192803463 334.6730201077038" stroke="#2679ad" stroke-width="3" fill="none"/><text x="260" y="470" font-size="19">Internal field:N → P</text><text x="30" y="525" font-size="15">Near the junction,mobile carriers recombine,leaving fixed acceptor ions on P side and donor ions on</text><text x="30" y="543" font-size="15">N side.The internal field opposes further diffusion;net equilibrium current is zero.</text><text x="25" y="606" font-size="13">Original teaching schematic · illustrative values · not a live-wiring instruction</text></svg>