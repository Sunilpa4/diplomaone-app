<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif" fill="#30303b"><rect width="900" height="620" fill="white"/><text x="25" y="35" font-size="22">UJT:one emitter junction to a resistive N bar</text><rect x="180" y="250" width="520" height="110" fill="#deebf8" stroke="#765099" stroke-width="2"/><rect x="400" y="210" width="90" height="95" fill="#f4dfdb" stroke="#765099" stroke-width="2"/><path d="M180 300L100 300" stroke="#765099" stroke-width="3" fill="none"/><path d="M700 300L790 300" stroke="#765099" stroke-width="3" fill="none"/><path d="M445 210L445 120" stroke="#765099" stroke-width="3" fill="none"/><text x="60" y="305" font-size="24">B1</text><text x="800" y="305" font-size="24">B2</text><text x="460" y="120" font-size="22">E:P region</text><text x="240" y="425" font-size="23">N bar;RB1 to B1,RB2 to B2</text><text x="30" y="525" font-size="15">With E noninjecting,eta=RB1/(RB1+RB2).The internal emitter location sits near eta VBB when B1 is the</text><text x="30" y="543" font-size="15">reference and B2 is positive.Injection reduces RB1 and permits negative differential resistance.</text><text x="25" y="606" font-size="13">Original teaching schematic · illustrative values · not a live-wiring instruction</text></svg>