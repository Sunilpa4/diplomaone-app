<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif" fill="#30303b"><rect width="900" height="620" fill="white"/><text x="25" y="35" font-size="22">SCR simplified PNPN structure:gate adjacent to cathode</text><rect x="200" y="210" width="120" height="180" fill="#f4dfdb" stroke="#765099" stroke-width="2"/><text x="240" y="300" font-size="24">P1</text><rect x="320" y="210" width="120" height="180" fill="#deebf8" stroke="#765099" stroke-width="2"/><text x="360" y="300" font-size="24">N1</text><rect x="440" y="210" width="120" height="180" fill="#f4dfdb" stroke="#765099" stroke-width="2"/><text x="480" y="300" font-size="24">P2</text><rect x="560" y="210" width="120" height="180" fill="#deebf8" stroke="#765099" stroke-width="2"/><text x="600" y="300" font-size="24">N2</text><path d="M130 300L200 300" stroke="#765099" stroke-width="3" fill="none"/><path d="M680 300L760 300" stroke="#765099" stroke-width="3" fill="none"/><path d="M500 390L500 455" stroke="#765099" stroke-width="3" fill="none"/><text x="70" y="305" font-size="24">A</text><text x="775" y="305" font-size="24">K</text><text x="520" y="465" font-size="22">G to P2</text><text x="30" y="525" font-size="15">Anode contacts P1,cathode N2,gate P2.Regenerative action latches conduction after a sufficient</text><text x="30" y="543" font-size="15">trigger and main current.Turn-off of an ordinary SCR is not commanded simply by removing gate</text><text x="30" y="561" font-size="15">current.</text><text x="25" y="606" font-size="13">Original teaching schematic · illustrative values · not a live-wiring instruction</text></svg>