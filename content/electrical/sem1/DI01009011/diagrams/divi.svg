<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif" fill="#30303b"><rect width="900" height="620" fill="white"/><text x="25" y="35" font-size="22">PN diode qualitative I-V:voltage and current signs matter</text><path d="M160 420L760 420" stroke="#765099" stroke-width="3" fill="none"/><path d="M400 480L400 110" stroke="#765099" stroke-width="3" fill="none"/><text x="755" y="460" font-size="19">VD</text><text x="350" y="105" font-size="19">ID</text><path d="M400 420L500 418L550 412Q600 400 620 325Q640 250 650 145" stroke="#2679ad" stroke-width="4" fill="none"/><path d="M400 420L250 425L195 425" stroke="#be6633" stroke-width="4" fill="none"/><text x="500" y="220" font-size="20">Forward rise</text><text x="160" y="315" font-size="19">Small reverse leakage</text><text x="30" y="525" font-size="15">A silicon constant-drop approximation is useful only for a stated current/temperature range;0.7V is</text><text x="30" y="543" font-size="15">not a universal exact turn-on voltage.Reverse breakdown is outside this simplified PN operating</text><text x="30" y="561" font-size="15">plot.</text><text x="25" y="606" font-size="13">Original teaching schematic · illustrative values · not a live-wiring instruction</text></svg>