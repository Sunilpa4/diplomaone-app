<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif" fill="#30303b"><rect width="900" height="620" fill="white"/><text x="25" y="35" font-size="22">CE output characteristics:IC versus VCE at fixed IB</text><path d="M140 450L780 450" stroke="#765099" stroke-width="3" fill="none"/><path d="M140 450L140 100" stroke="#765099" stroke-width="3" fill="none"/><text x="75" y="95" font-size="19">IC</text><text x="760" y="490" font-size="19">VCE</text><path d="M140 450Q165 395 220 385L750 370" stroke="#2679ad" stroke-width="3" fill="none"/><path d="M140 450Q165 330 220 320L750 305" stroke="#2679ad" stroke-width="3" fill="none"/><path d="M140 450Q165 265 220 255L750 240" stroke="#2679ad" stroke-width="3" fill="none"/><path d="M140 450Q165 200 220 190L750 175" stroke="#2679ad" stroke-width="3" fill="none"/><text x="395" y="160" font-size="22">Increasing fixed IB</text><path d="M690 330L690 160" stroke="#2679ad" stroke-width="3" fill="none"/><path d="M694.6730201077038 171.05273192803463L690 160L685.3269798922962 171.05273192803463" stroke="#2679ad" stroke-width="3" fill="none"/><text x="220" y="490" font-size="19">Output family,not a single curve</text><text x="30" y="525" font-size="15">At low VCE the device enters saturation.In forward active,IC depends mainly on IB but also on VCE</text><text x="30" y="543" font-size="15">and temperature.Breakdown limits are outside this simplified sketch.Input characteristic is IB</text><text x="30" y="561" font-size="15">versus VBE at fixed VCE.</text><text x="25" y="606" font-size="13">Original teaching schematic · illustrative values · not a live-wiring instruction</text></svg>