<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif" fill="#30303b"><rect width="900" height="620" fill="white"/><text x="25" y="35" font-size="22">Full-wave centre-tapped rectifier:CT is load return</text><rect x="40" y="110" width="145" height="320" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="50" y="136" font-size="18">Isolated centre-</text><text x="50" y="158" font-size="18">tapped secondary</text><text x="150" y="170" font-size="19">A</text><text x="145" y="270" font-size="19">CT</text><text x="150" y="370" font-size="19">B</text><path d="M185 170L270 170" stroke="#765099" stroke-width="3" fill="none"/><path d="M270 170L305 170" stroke="#765099" stroke-width="3" fill="none"/><path d="M305 145L305 195L355 170Z" stroke="#765099" stroke-width="3" fill="none"/><path d="M355 142L355 198" stroke="#765099" stroke-width="3" fill="none"/><path d="M355 170L390 170" stroke="#765099" stroke-width="3" fill="none"/><text x="310" y="130" font-size="18">D1</text><path d="M390 170L750 170" stroke="#765099" stroke-width="3" fill="none"/><path d="M185 370L270 370" stroke="#765099" stroke-width="3" fill="none"/><path d="M270 370L305 370" stroke="#765099" stroke-width="3" fill="none"/><path d="M305 345L305 395L355 370Z" stroke="#765099" stroke-width="3" fill="none"/><path d="M355 342L355 398" stroke="#765099" stroke-width="3" fill="none"/><path d="M355 370L390 370" stroke="#765099" stroke-width="3" fill="none"/><text x="310" y="330" font-size="18">D2</text><path d="M390 370L750 370" stroke="#765099" stroke-width="3" fill="none"/><path d="M750 170L750 370" stroke="#765099" stroke-width="3" fill="none"/><path d="M185 270L440 270" stroke="#765099" stroke-width="3" fill="none"/><path d="M440 270L475 270" stroke="#765099" stroke-width="3" fill="none"/><rect x="475" y="254" width="85" height="32" fill="#e9e2f1" stroke="#765099" stroke-width="2"/><path d="M560 270L595 270" stroke="#765099" stroke-width="3" fill="none"/><text x="480" y="235" font-size="19">RL</text><path d="M595 270L750 270" stroke="#765099" stroke-width="3" fill="none"/><text x="625" y="235" font-size="25">+</text><text x="400" y="310" font-size="25">−</text><text x="30" y="525" font-size="15">D1 and D2 conduct on alternate half-cycles.Both cathodes meet the positive load terminal.Vm is the</text><text x="30" y="543" font-size="15">peak of ONE half-secondary relative to CT,not the full end-to-end peak.</text><text x="25" y="606" font-size="13">Original teaching schematic · illustrative values · not a live-wiring instruction</text></svg>