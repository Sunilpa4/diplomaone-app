<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 675" font-family="Arial,sans-serif"><rect width="820" height="675" fill="white"/><text x="30" y="35" fill="#552080" font-size="24">Lists:one-based ordered data</text><rect x="55" y="70" width="710" height="76" rx="10" fill="#f0e6fa" stroke="#8248ad"/><text x="75" y="99" font-size="19">Create/reset a list and decide item meaning/validation</text><path d="M410 146v22m-7-8 7 8 7-8" stroke="#8348ad" fill="none" stroke-width="3"/><rect x="55" y="175" width="710" height="76" rx="10" fill="#f0e6fa" stroke="#8248ad"/><text x="75" y="204" font-size="19">Add appends;insert shifts later items;delete shifts indices</text><path d="M410 251v22m-7-8 7 8 7-8" stroke="#8348ad" fill="none" stroke-width="3"/><rect x="55" y="280" width="710" height="76" rx="10" fill="#f0e6fa" stroke="#8248ad"/><text x="75" y="309" font-size="19">Replace changes one value without increasing list length</text><path d="M410 356v22m-7-8 7 8 7-8" stroke="#8348ad" fill="none" stroke-width="3"/><rect x="55" y="385" width="710" height="76" rx="10" fill="#f0e6fa" stroke="#8248ad"/><text x="75" y="414" font-size="19">item i accesses a valid1-based position;length counts items</text><path d="M410 461v22m-7-8 7 8 7-8" stroke="#8348ad" fill="none" stroke-width="3"/><rect x="55" y="490" width="710" height="76" rx="10" fill="#f0e6fa" stroke="#8248ad"/><text x="75" y="519" font-size="19">Search/count/sort must handle empty lists and duplicates</text><text x="30" y="657" font-size="14">Original conceptual teaching diagram;not a screenshot or performed-work claim.</text></svg>