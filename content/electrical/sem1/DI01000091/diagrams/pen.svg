<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 675" font-family="Arial,sans-serif"><rect width="820" height="675" fill="white"/><text x="30" y="35" fill="#552080" font-size="24">Pen extension:drawing state matters</text><rect x="55" y="70" width="710" height="76" rx="10" fill="#f0e6fa" stroke="#8248ad"/><text x="75" y="99" font-size="19">Add Pen extension;erase all removes prior pen/stamps</text><path d="M410 146v22m-7-8 7 8 7-8" stroke="#8348ad" fill="none" stroke-width="3"/><rect x="55" y="175" width="710" height="76" rx="10" fill="#f0e6fa" stroke="#8248ad"/><text x="75" y="204" font-size="19">pen up before repositioning prevents an unwanted joining line</text><path d="M410 251v22m-7-8 7 8 7-8" stroke="#8348ad" fill="none" stroke-width="3"/><rect x="55" y="280" width="710" height="76" rx="10" fill="#f0e6fa" stroke="#8248ad"/><text x="75" y="309" font-size="19">Choose colour,size and initial position/direction</text><path d="M410 356v22m-7-8 7 8 7-8" stroke="#8348ad" fill="none" stroke-width="3"/><rect x="55" y="385" width="710" height="76" rx="10" fill="#f0e6fa" stroke="#8248ad"/><text x="75" y="414" font-size="19">pen down draws as the sprite moves;stamp leaves an image copy</text><path d="M410 461v22m-7-8 7 8 7-8" stroke="#8348ad" fill="none" stroke-width="3"/><rect x="55" y="490" width="710" height="76" rx="10" fill="#f0e6fa" stroke="#8248ad"/><text x="75" y="519" font-size="19">Reset state on green flag;pen marks are not separate sprites</text><text x="30" y="657" font-size="14">Original conceptual teaching diagram;not a screenshot or performed-work claim.</text></svg>