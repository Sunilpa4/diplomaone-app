<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 620" font-family="Arial,sans-serif"><rect width="820" height="620" fill="white"/><text x="25" y="36" font-size="25" fill="#552080">Recognise block shapes before assembling a script</text><path d="M40 115Q95 55 150 115H295V160H125L115 170H95L85 160H40Z" fill="#ffbf00" stroke="#b98200"/><text x="58" y="145" font-size="18">when green flag clicked</text><text x="365" y="140" font-size="21">Hat:starts a script</text><path d="M40 200H85L95 210H115L125 200H295V250H125L115 260H95L85 250H40Z" fill="#4c97ff"/><text x="58" y="235" font-size="20">move10steps</text><text x="365" y="235" font-size="21">Stack:an action</text><rect x="40" y="292" width="255" height="48" rx="24" fill="#ff8c1a"/><text x="63" y="324" font-size="21">(2) + (3)</text><text x="365" y="324" font-size="21">Rounded reporter:a value</text><path d="M65 375H270L295 400L270 425H65L40 400Z" fill="#59c059"/><text x="95" y="407" font-size="19">(score) &gt; (10)</text><text x="365" y="407" font-size="21">Boolean:true / false</text><path d="M40 460H295V495H85V530H295V560H40Z" fill="#ffab19"/><text x="55" y="485" font-size="19">repeat10</text><text x="365" y="495" font-size="21">C-shape:nested body</text><text x="365" y="535" font-size="19">Cap/stop:no next stack block</text><text x="25" y="602" font-size="14">Original conceptual teaching diagram;not a screenshot or performed-work claim.</text></svg>