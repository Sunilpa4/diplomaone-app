l="#382b45"><tspan x="550" y="165.0">A</tspan></text><circle cx="825" cy="180" r="5" fill="#792db0"/><path d="M570,300 L825,300" stroke="#792db0" stroke-width="3" fill="none"/><g transform="translate(697.5 300.0) rotate(0.0)"><rect x="-58" y="-20" width="116" height="40" fill="#efe3fa" stroke="#792db0" stroke-width="3"/><text x="-43" y="7" font-size="17">W2</text></g><text font-size="20" fill="#382b45"><tspan x="550" y="285.0">B</tspan></text><circle cx="825" cy="300" r="5" fill="#792db0"/><path d="M570,420 L825,420" stroke="#792db0" stroke-width="3" fill="none"/><g transform="translate(697.5 420.0) rotate(0.0)"><rect x="-58" y="-20" width="116" height="40" fill="#efe3fa" stroke="#792db0" stroke-width="3"/><text x="-43" y="7" font-size="17">W3</text></g><text font-size="20" fill="#382b45"><tspan x="550" y="405.0">C</tspan></text><circle cx="825" cy="420" r="5" fill="#792db0"/><path d="M825,180 L825,420" stroke="#792db0" stroke-width="3" fill="none"/><path d="M825,300 L890,300" stroke="#792db0" stroke-width="3" fill="none"/><text font-size="20" fill="#382b45"><tspan x="845" y="285.0">N</tspan></text><text font-size="20" fill="#382b45"><tspan x="70" y="95.0">HV: Y</tspan></text><text font-size="20" fill="#382b45"><tspan x="565" y="95.0">LV: Y</tspan></text><text font-size="20" fill="#382b45"><tspan x="55" y="535.0">Each W is one phase winding;magnetic coupling pairs HV/LVphases.</tspan></text><text font-size="18" fill="#382b45"><tspan x="55" y="580.0">Terminal polarity and phase pairing determine clock group,not Y/Δletters alone.</tspan></text><text font-size="15" fill="#382b45"><tspan x="24" y="668.0">Original teaching model;not measured evidence or permission for live wiring.</tspan></text></g></svg>