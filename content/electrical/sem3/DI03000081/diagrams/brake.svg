<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" role="img" aria-label="Brake test:drum,force difference and effective radius"><rect width="1000" height="690" fill="white"/><g font-family="Arial,sans-serif"><text font-size="26" fill="#382b45"><tspan x="24" y="36.0">Brake test:drum,force difference and effective radius</tspan></text><circle cx="500" cy="310" r="120" fill="#efe3fa" stroke="#792db0" stroke-width="4"/><circle cx="500" cy="310" r="20" fill="white" stroke="#792db0"/><path d="M370 490V310A130 130 0 0 1 630 310V490" fill="none" stroke="#bd7e2a" stroke-width="7"/><path d="M370,490 L370,560" stroke="#792db0" stroke-width="3" fill="none"/><path d="M370,560 l-10,-5 l0,10z" fill="#792db0" transform="rotate(90.0 370 560)"/><path d="M630,490 L630,560" stroke="#792db0" stroke-width="3" fill="none"/><path d="M630,560 l-10,-5 l0,10z" fill="#792db0" transform="rotate(90.0 630 560)"/><text font-size="20" fill="#382b45"><tspan x="300" y="590.0">F1</tspan></text><text font-size="20" fill="#382b45"><tspan x="645" y="590.0">F2</tspan></text><path d="M500,310 L620,310" stroke="#792db0" stroke-width="3" fill="none"/><path d="M620,310 l-10,-5 l0,10z" fill="#792db0" transform="rotate(0.0 620 310)"/><text font-size="20" fill="#382b45"><tspan x="550" y="295.0">r effective</tspan></text><text font-size="20" fill="#382b45"><tspan x="100" y="100.0">Guarded drum/strap model;force readings use the trainer calibration.</tspan></text><text font-size="18" fill="#382b45"><tspan x="80" y="625.0">T=(F1−F2)r for N;T=(m1−m2)gr for kg.Pshaft=2πNT/60.</tspan></text><text font-size="15" fill="#382b45"><tspan x="24" y="668.0">Original teaching model;not measured evidence or permission for live wiring.</tspan></text></g></svg>