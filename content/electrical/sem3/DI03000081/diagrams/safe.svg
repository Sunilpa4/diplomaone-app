<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" role="img" aria-label="Machines laboratory safety"><rect width="1000" height="690" fill="white"/><g font-family="Arial,sans-serif"><text font-size="26" fill="#382b45"><tspan x="24" y="36.0">Machines laboratory safety</tspan></text><rect x="55.0" y="210" width="248.33333333333331" height="100" rx="10" fill="#efe3fa" stroke="#8a53af"/><text font-size="18" fill="#382b45"><tspan x="65.0" y="266.0">Isolate / verify dead</tspan></text><path d="M303.3333333333333,260 L338.3333333333333,260" stroke="#792db0" stroke-width="3" fill="none"/><path d="M338.3333333333333,260 l-10,-5 l0,10z" fill="#792db0" transform="rotate(0.0 338.3333333333333 260)"/><rect x="338.3333333333333" y="210" width="248.33333333333331" height="100" rx="10" fill="#efe3fa" stroke="#8a53af"/><text font-size="18" fill="#382b45"><tspan x="348.3333333333333" y="255.0">Ratings / guards /</tspan></text><text font-size="18" fill="#382b45"><tspan x="348.3333333333333" y="277.0">protection</tspan></text><path d="M586.6666666666666,260 L621.6666666666666,260" stroke="#792db0" stroke-width="3" fill="none"/><path d="M621.6666666666666,260 l-10,-5 l0,10z" fill="#792db0" transform="rotate(0.0 621.6666666666666 260)"/><rect x="621.6666666666666" y="210" width="248.33333333333331" height="100" rx="10" fill="#efe3fa" stroke="#8a53af"/><text font-size="18" fill="#382b45"><tspan x="631.6666666666666" y="266.0">Qualified supervision</tspan></text><text font-size="20" fill="#382b45"><tspan x="55" y="420.0">Never open a running shunt field,run a series motor unloaded,or mistake an</tspan><tspan x="55" y="446.0">autotransformer for isolation.</tspan></text><text font-size="15" fill="#382b45"><tspan x="24" y="668.0">Original teaching model;not measured evidence or permission for live wiring.</tspan></text></g></svg>