<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img"><title>Interconnected distribution:multiple sources and coordinated network paths</title><rect width="1000" height="700" fill="white"/><g font-family="Arial,sans-serif" fill="#292331"><text x="25" y="45" font-size="25"><tspan x="25" dy="0">Interconnected distribution:multiple sources and coordinated</tspan><tspan x="25" dy="30">network paths</tspan></text><rect x="45" y="150" width="180" height="90" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="55" y="202.0">Source 1</tspan></text><rect x="45" y="430" width="180" height="90" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="55" y="482.0">Source 2</tspan></text><path d="M225,195 L850,195" fill="none" stroke="#792db0" stroke-width="3"/><path d="M225,475 L850,475" fill="none" stroke="#792db0" stroke-width="3"/><path d="M850,195 L850,475" fill="none" stroke="#792db0" stroke-width="3"/><rect x="800" y="285" width="100" height="95" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="810" y="339.5">Bus tie</tspan></text><path d="M450,195 L450,270" fill="none" stroke="#792db0" stroke-width="3"/><rect x="385" y="270" width="130" height="80" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="395" y="317.0">Load A</tspan></text><path d="M620,475 L620,550" fill="none" stroke="#792db0" stroke-width="3"/><rect x="555" y="550" width="130" height="70" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="565" y="592.0">Load B</tspan></text><text x="65" y="100" font-size="19"><tspan x="65" dy="0">Coordinated sources/network:conceptual single-line,not a source-paralleling</tspan><tspan x="65" dy="24">procedure.</tspan></text><text x="65" y="640" font-size="17"><tspan x="65" dy="0">Protection,fault duty,normal switching state and backfeed control must be studied.</tspan></text><text x="25" y="675" font-size="16"><tspan x="25" dy="0">Original teaching schematic;not a field wiring/clearance or live-work instruction.</tspan></text></g></svg>