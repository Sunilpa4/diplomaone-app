<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img"><title>ACcurrent distribution:skin and proximity effects</title><rect width="1000" height="700" fill="white"/><g font-family="Arial,sans-serif" fill="#292331"><text x="25" y="45" font-size="25"><tspan x="25" dy="0">ACcurrent distribution:skin and proximity effects</tspan></text><circle cx="300" cy="310" r="150" fill="#f7eaff" stroke="#792db0" stroke-width="4"/><circle cx="300" cy="310" r="90" fill="white" stroke="#ccc"/><text x="155" y="520" font-size="20"><tspan x="155" dy="0">Skin:ACcurrent crowds outward</tspan></text><circle cx="650" cy="290" r="80" fill="#efe3fa" stroke="#792db0"/><circle cx="850" cy="290" r="80" fill="#efe3fa" stroke="#792db0"/><text x="560" y="500" font-size="20"><tspan x="560" dy="0">Proximity:nearby fields change</tspan><tspan x="560" dy="25">density</tspan></text><text x="65" y="610" font-size="18"><tspan x="65" dy="0">Qualitative sketches only;distribution depends on frequency,material and conductor</tspan><tspan x="65" dy="23">geometry.</tspan></text><text x="25" y="675" font-size="16"><tspan x="25" dy="0">Original teaching schematic;not a field wiring/clearance or live-work instruction.</tspan></text></g></svg>