<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img"><title>Three-disc string:series capacitances and intermediate-node shunts</title><rect width="1000" height="700" fill="white"/><g font-family="Arial,sans-serif" fill="#292331"><text x="25" y="45" font-size="25"><tspan x="25" dy="0">Three-disc string:series capacitances and intermediate-node shunts</tspan></text><path d="M150,110 L850,110" fill="none" stroke="#792db0" stroke-width="3"/><path d="M850,110 L850,500" fill="none" stroke="#792db0" stroke-width="3"/><path d="M500,110 L500,575" fill="none" stroke="#792db0" stroke-width="3"/><text x="70" y="150" font-size="20"><tspan x="70" dy="0">Earthed tower</tspan></text><rect x="430" y="180" width="140" height="60" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="440" y="217.0">C / V1</tspan></text><rect x="430" y="310" width="140" height="60" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="440" y="347.0">C / V2</tspan></text><rect x="430" y="440" width="140" height="60" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="440" y="477.0">C / V3</tspan></text><path d="M500,270 L700,270" fill="none" stroke="#792db0" stroke-width="3"/><rect x="650" y="242" width="100" height="56" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="18.666666666666668"><tspan x="660" y="276.83333333333337">kC</tspan></text><path d="M750,270 L850,270" fill="none" stroke="#792db0" stroke-width="3"/><circle cx="500" cy="270" r="5" fill="#792db0"/><path d="M500,400 L700,400" fill="none" stroke="#792db0" stroke-width="3"/><rect x="650" y="372" width="100" height="56" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="18.666666666666668"><tspan x="660" y="406.83333333333337">kC</tspan></text><path d="M750,400 L850,400" fill="none" stroke="#792db0" stroke-width="3"/><circle cx="500" cy="400" r="5" fill="#792db0"/><text x="520" y="575" font-size="20"><tspan x="520" dy="0">Line-end potential</tspan></text><text x="55" y="620" font-size="18"><tspan x="55" dy="0">Equal series C;two intermediate junctions have tower shunts kC.Voltage V3is the line-end</tspan><tspan x="55" dy="23">disc drop.</tspan></text><text x="25" y="675" font-size="16"><tspan x="25" dy="0">Original teaching schematic;not a field wiring/clearance or live-work instruction.</tspan></text></g></svg>