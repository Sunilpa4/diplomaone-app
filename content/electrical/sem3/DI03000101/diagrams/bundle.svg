<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img"><title>Bundled phase conductor:spacing is not phase separation</title><rect width="1000" height="700" fill="white"/><g font-family="Arial,sans-serif" fill="#292331"><text x="25" y="45" font-size="25"><tspan x="25" dy="0">Bundled phase conductor:spacing is not phase separation</tspan></text><circle cx="300" cy="220" r="40" fill="#dbc8ed" stroke="#792db0"/><circle cx="600" cy="220" r="40" fill="#dbc8ed" stroke="#792db0"/><circle cx="300" cy="420" r="40" fill="#dbc8ed" stroke="#792db0"/><circle cx="600" cy="420" r="40" fill="#dbc8ed" stroke="#792db0"/><path d="M300,220 L600,220" fill="none" stroke="#792db0" stroke-width="3"/><path d="M600,220 L600,420" fill="none" stroke="#792db0" stroke-width="3"/><path d="M600,420 L300,420" fill="none" stroke="#792db0" stroke-width="3"/><path d="M300,420 L300,220" fill="none" stroke="#792db0" stroke-width="3"/><text x="160" y="120" font-size="20"><tspan x="160" dy="0">Four subconductors of ONEphase;spacers maintain geometry.</tspan></text><text x="90" y="570" font-size="20"><tspan x="90" dy="0">Bundling increases effective radius,reduces inductive reactance and surface</tspan><tspan x="90" dy="25">gradient;usually increases capacitance.</tspan></text><text x="25" y="675" font-size="16"><tspan x="25" dy="0">Original teaching schematic;not a field wiring/clearance or live-work instruction.</tspan></text></g></svg>