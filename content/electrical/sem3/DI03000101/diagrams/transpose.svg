<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img"><title>Transposition:each phase occupies each position for equal length</title><rect width="1000" height="700" fill="white"/><g font-family="Arial,sans-serif" fill="#292331"><text x="25" y="45" font-size="25"><tspan x="25" dy="0">Transposition:each phase occupies each position for equal length</tspan></text><path d="M120,180 L380,300" fill="none" stroke="#792db0" stroke-width="3"/><path d="M380,300 L650,420" fill="none" stroke="#792db0" stroke-width="3"/><path d="M650,420 L900,180" fill="none" stroke="#792db0" stroke-width="3"/><text x="70" y="190" font-size="20"><tspan x="70" dy="0">A</tspan></text><path d="M120,300 L380,420" fill="none" stroke="#792db0" stroke-width="3"/><path d="M380,420 L650,180" fill="none" stroke="#792db0" stroke-width="3"/><path d="M650,180 L900,300" fill="none" stroke="#792db0" stroke-width="3"/><text x="70" y="310" font-size="20"><tspan x="70" dy="0">B</tspan></text><path d="M120,420 L380,180" fill="none" stroke="#792db0" stroke-width="3"/><path d="M380,180 L650,300" fill="none" stroke="#792db0" stroke-width="3"/><path d="M650,300 L900,420" fill="none" stroke="#792db0" stroke-width="3"/><text x="70" y="430" font-size="20"><tspan x="70" dy="0">C</tspan></text><text x="65" y="595" font-size="20"><tspan x="65" dy="0">Crossings are position changes along different towers,not electrical phase-to-</tspan><tspan x="65" dy="25">phase joints.</tspan></text><text x="25" y="675" font-size="16"><tspan x="25" dy="0">Original teaching schematic;not a field wiring/clearance or live-work instruction.</tspan></text></g></svg>