<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img"><title>ACdistributor:section currents and complex voltage drops</title><rect width="1000" height="700" fill="white"/><g font-family="Arial,sans-serif" fill="#292331"><text x="25" y="45" font-size="25"><tspan x="25" dy="0">ACdistributor:section currents and complex voltage drops</tspan></text><path d="M100,210 L900,210" fill="none" stroke="#792db0" stroke-width="3"/><path d="M100,500 L900,500" fill="none" stroke="#792db0" stroke-width="3"/><text x="65" y="120" font-size="20"><tspan x="65" dy="0">Per-phase current model:all phasors use one reference</tspan></text><path d="M350,210 L350,440" fill="none" stroke="#792db0" stroke-width="3"/><rect x="300" y="320" width="100" height="75" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="310" y="364.5">I1</tspan></text><path d="M700,210 L700,440" fill="none" stroke="#792db0" stroke-width="3"/><rect x="650" y="320" width="100" height="75" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="660" y="364.5">I2</tspan></text><rect x="150" y="170" width="140" height="80" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="160" y="217.0">z1</tspan></text><rect x="450" y="170" width="140" height="80" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="460" y="217.0">z2</tspan></text><text x="65" y="610" font-size="18"><tspan x="65" dy="0">Section current is the phasor sum of downstream loads;voltage drops add as complex</tspan><tspan x="65" dy="23">quantities.</tspan></text><text x="25" y="675" font-size="16"><tspan x="25" dy="0">Original teaching schematic;not a field wiring/clearance or live-work instruction.</tspan></text></g></svg>