<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img"><title>Five insulator duties:pin,suspension,strain,shackle and stay</title><rect width="1000" height="700" fill="white"/><g font-family="Arial,sans-serif" fill="#292331"><text x="25" y="45" font-size="25"><tspan x="25" dy="0">Five insulator duties:pin,suspension,strain,shackle and stay</tspan></text><path d="M120,330 L120,450" fill="none" stroke="#792db0" stroke-width="3"/><path d="M75,235 L165,235" fill="none" stroke="#792db0" stroke-width="3"/><rect x="75" y="240" width="90" height="23" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="14"></text><rect x="75" y="272" width="90" height="23" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="14"></text><rect x="75" y="304" width="90" height="23" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="14"></text><text x="55" y="510" font-size="18"><tspan x="55" dy="0">Pin</tspan></text><path d="M320,160 L320,450" fill="none" stroke="#792db0" stroke-width="3"/><rect x="275" y="230" width="90" height="23" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="14"></text><rect x="275" y="262" width="90" height="23" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="14"></text><rect x="275" y="294" width="90" height="23" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="14"></text><rect x="275" y="326" width="90" height="23" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="14"></text><rect x="275" y="358" width="90" height="23" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="14"></text><text x="255" y="510" font-size="18"><tspan x="255" dy="0">Suspension</tspan></text><rect x="440" y="280" width="40" height="75" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"></text><rect x="470" y="280" width="40" height="75" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"></text><rect x="500" y="280" width="40" height="75" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"></text><rect x="530" y="280" width="40" height="75" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"></text><text x="440" y="510" font-size="18"><tspan x="440" dy="0">Strain</tspan></text><rect x="645" y="260" width="75" height="110" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"></text><circle cx="682" cy="315" r="15" fill="white" stroke="#792db0"/><path d="M625,315 L740,315" fill="none" stroke="#792db0" stroke-width="3"/><text x="625" y="510" font-size="18"><tspan x="625" dy="0">Shackle</tspan></text><ellipse cx="860" cy="310" rx="65" ry="90" fill="#efe3fa" stroke="#792db0" stroke-width="3"/><circle cx="840" cy="280" r="13" fill="white" stroke="#792db0"/><circle cx="880" cy="340" r="13" fill="white" stroke="#792db0"/><path d="M790,220 L840,280" fill="none" stroke="#792db0" stroke-width="3"/><path d="M880,340 L930,400" fill="none" stroke="#792db0" stroke-width="3"/><text x="820" y="510" font-size="18"><tspan x="820" dy="0">Stay</tspan></text><text x="65" y="600" font-size="18"><tspan x="65" dy="0">Representative duty/forms,not dimensioned assemblies;metal fittings and dielectric must</tspan><tspan x="65" dy="23">have specified ratings.</tspan></text><text x="25" y="675" font-size="16"><tspan x="25" dy="0">Original teaching schematic;not a field wiring/clearance or live-work instruction.</tspan></text></g></svg>