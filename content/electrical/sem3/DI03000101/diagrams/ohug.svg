<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img"><title>Overhead and underground:engineering trade-offs</title><rect width="1000" height="700" fill="white"/><g font-family="Arial,sans-serif" fill="#292331"><text x="25" y="45" font-size="25"><tspan x="25" dy="0">Overhead and underground:engineering trade-offs</tspan></text><rect x="55" y="230" width="270" height="130" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="65" y="302.0">OH:accessible / exposed</tspan></text><path d="M325,295 L360,295" fill="none" stroke="#792db0" stroke-width="3"/><circle cx="360" cy="295" r="5" fill="#792db0"/><rect x="365" y="230" width="270" height="130" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="375" y="290.0">UG:concealed / costly</tspan><tspan x="375" y="314.0">joints</tspan></text><path d="M635,295 L670,295" fill="none" stroke="#792db0" stroke-width="3"/><circle cx="670" cy="295" r="5" fill="#792db0"/><rect x="675" y="230" width="270" height="130" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="685" y="290.0">Site / thermal /</tspan><tspan x="685" y="314.0">reliability</tspan></text><text x="55" y="500" font-size="21"><tspan x="55" dy="0">Underground is not maintenance-free;overhead is not automatically unsafe if</tspan><tspan x="55" dy="26">designed and operated correctly.</tspan></text><text x="25" y="675" font-size="16"><tspan x="25" dy="0">Original teaching schematic;not a field wiring/clearance or live-work instruction.</tspan></text></g></svg>