<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img"><title>Solid,hollow,stranded and steel-reinforced conductor sections</title><rect width="1000" height="700" fill="white"/><g font-family="Arial,sans-serif" fill="#292331"><text x="25" y="45" font-size="25"><tspan x="25" dy="0">Solid,hollow,stranded and steel-reinforced conductor sections</tspan></text><circle cx="140" cy="300" r="90" fill="#dbc8ed" stroke="#792db0" stroke-width="3"/><text x="70" y="470" font-size="20"><tspan x="70" dy="0">Solid</tspan></text><circle cx="380" cy="300" r="90" fill="#dbc8ed" stroke="#792db0" stroke-width="3"/><text x="310" y="470" font-size="20"><tspan x="310" dy="0">Hollow</tspan></text><circle cx="380" cy="300" r="50" fill="white" stroke="#792db0"/><circle cx="620" cy="300" r="90" fill="#dbc8ed" stroke="#792db0" stroke-width="3"/><text x="550" y="470" font-size="20"><tspan x="550" dy="0">AAC / AAAC</tspan></text><circle cx="675.0" cy="300.0" r="26" fill="#e8dcf0" stroke="#792db0"/><circle cx="647.5" cy="347.6313972081441" r="26" fill="#e8dcf0" stroke="#792db0"/><circle cx="592.5" cy="347.6313972081441" r="26" fill="#e8dcf0" stroke="#792db0"/><circle cx="565.0" cy="300.0" r="26" fill="#e8dcf0" stroke="#792db0"/><circle cx="592.5" cy="252.3686027918559" r="26" fill="#e8dcf0" stroke="#792db0"/><circle cx="647.5" cy="252.3686027918559" r="26" fill="#e8dcf0" stroke="#792db0"/><circle cx="620" cy="300" r="25" fill="#e8dcf0" stroke="#792db0"/><circle cx="850" cy="300" r="90" fill="#dbc8ed" stroke="#792db0" stroke-width="3"/><text x="780" y="470" font-size="20"><tspan x="780" dy="0">ACSR</tspan></text><circle cx="905.0" cy="300.0" r="26" fill="#e8dcf0" stroke="#792db0"/><circle cx="877.5" cy="347.6313972081441" r="26" fill="#e8dcf0" stroke="#792db0"/><circle cx="822.5" cy="347.6313972081441" r="26" fill="#e8dcf0" stroke="#792db0"/><circle cx="795.0" cy="300.0" r="26" fill="#e8dcf0" stroke="#792db0"/><circle cx="822.5" cy="252.3686027918559" r="26" fill="#e8dcf0" stroke="#792db0"/><circle cx="877.5" cy="252.3686027918559" r="26" fill="#e8dcf0" stroke="#792db0"/><circle cx="850" cy="300" r="25" fill="#777" stroke="#792db0"/><text x="65" y="600" font-size="18"><tspan x="65" dy="0">Stranding improves flexibility;ACSRsteel core provides reinforcement.Core/material details</tspan><tspan x="65" dy="23">vary by product.</tspan></text><text x="25" y="675" font-size="16"><tspan x="25" dy="0">Original teaching schematic;not a field wiring/clearance or live-work instruction.</tspan></text></g></svg>