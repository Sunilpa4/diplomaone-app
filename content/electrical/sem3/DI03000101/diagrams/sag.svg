<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img"><title>Sag:equal-height supports and lowest point</title><rect width="1000" height="700" fill="white"/><g font-family="Arial,sans-serif" fill="#292331"><text x="25" y="45" font-size="25"><tspan x="25" dy="0">Sag:equal-height supports and lowest point</tspan></text><path d="M140,180 L860,180" fill="none" stroke="#792db0" stroke-width="3"/><path d="M140,150 L140,540" fill="none" stroke="#792db0" stroke-width="3"/><path d="M860,150 L860,540" fill="none" stroke="#792db0" stroke-width="3"/><path d="M140,180 Q500,580 860,180" fill="none" stroke="#792db0" stroke-width="4"/><path d="M500,180 L500,380" fill="none" stroke="#792db0" stroke-width="3"/><text x="520" y="295" font-size="20"><tspan x="520" dy="0">Sag f</tspan></text><text x="375" y="140" font-size="20"><tspan x="375" dy="0">Span L</tspan></text><text x="70" y="600" font-size="20"><tspan x="70" dy="0">Parabolic small-sag model:uniform resultant load per horizontal metre;H is</tspan><tspan x="70" dy="25">horizontal tension,not end tension.</tspan></text><text x="25" y="675" font-size="16"><tspan x="25" dy="0">Original teaching schematic;not a field wiring/clearance or live-work instruction.</tspan></text></g></svg>