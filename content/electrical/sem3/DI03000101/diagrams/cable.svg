<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img"><title>Underground cable:representative layered cross-section</title><rect width="1000" height="700" fill="white"/><g font-family="Arial,sans-serif" fill="#292331"><text x="25" y="45" font-size="25"><tspan x="25" dy="0">Underground cable:representative layered cross-section</tspan></text><circle cx="350" cy="320" r="185" fill="#48334d" stroke="white"/><circle cx="350" cy="320" r="155" fill="#aaa" stroke="white"/><circle cx="350" cy="320" r="135" fill="#dbc8ed" stroke="white"/><circle cx="350" cy="320" r="95" fill="#eee" stroke="white"/><circle cx="350" cy="320" r="55" fill="#b87c40" stroke="white"/><text x="600" y="180" font-size="20"><tspan x="600" dy="0">Conductor</tspan></text><text x="600" y="250" font-size="20"><tspan x="600" dy="0">Insulation / screens</tspan></text><text x="600" y="320" font-size="20"><tspan x="600" dy="0">Bedding / sheath</tspan></text><text x="600" y="390" font-size="20"><tspan x="600" dy="0">Armour if specified</tspan></text><text x="600" y="460" font-size="20"><tspan x="600" dy="0">Outer protective sheath</tspan></text><text x="55" y="605" font-size="18"><tspan x="55" dy="0">Single-core schematic;actual layers depend on voltage,cable standard,screen/sheath design</tspan><tspan x="55" dy="23">and installation.</tspan></text><text x="25" y="675" font-size="16"><tspan x="25" dy="0">Original teaching schematic;not a field wiring/clearance or live-work instruction.</tspan></text></g></svg>