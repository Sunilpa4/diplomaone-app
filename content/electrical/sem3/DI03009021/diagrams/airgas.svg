<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img"><title>Air and flue-gas circuit:continuous functional route</title><rect width="1000" height="700" fill="white"/><g font-family="Arial,sans-serif" fill="#292331"><text x="25" y="45" font-size="25"><tspan x="25" dy="0">Air and flue-gas circuit:continuous functional route</tspan></text><rect x="55" y="170" width="270" height="100" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="65" y="227.0">Air / FDfan</tspan></text><path d="M325,220 L360,220" fill="none" stroke="#792db0" stroke-width="3"/><polygon points="360,220 349.0,215.0 349.0,225.0" fill="#792db0"/><rect x="365" y="170" width="270" height="100" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="375" y="227.0">Air preheater</tspan></text><path d="M635,220 L670,220" fill="none" stroke="#792db0" stroke-width="3"/><polygon points="670,220 659.0,215.0 659.0,225.0" fill="#792db0"/><rect x="675" y="170" width="270" height="100" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="685" y="227.0">Furnace</tspan></text><rect x="55" y="355" width="270" height="100" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="65" y="412.0">Heat recovery</tspan></text><path d="M325,405 L360,405" fill="none" stroke="#792db0" stroke-width="3"/><polygon points="360,405 349.0,400.0 349.0,410.0" fill="#792db0"/><rect x="365" y="355" width="270" height="100" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="375" y="412.0">Gas cleaning / IDfan</tspan></text><path d="M635,405 L670,405" fill="none" stroke="#792db0" stroke-width="3"/><polygon points="670,405 659.0,400.0 659.0,410.0" fill="#792db0"/><rect x="675" y="355" width="270" height="100" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="685" y="412.0">Chimney</tspan></text><path d="M810,270 L810,310" fill="none" stroke="#792db0" stroke-width="3"/><path d="M810,310 L190,310" fill="none" stroke="#792db0" stroke-width="3"/><path d="M190,310 L190,355" fill="none" stroke="#792db0" stroke-width="3"/><polygon points="190,355 195.0,344.0 185.0,344.0" fill="#792db0"/><text x="55" y="560" font-size="20"><tspan x="55" dy="0">The route continues from furnace to heat recovery on the lower row.</tspan></text><text x="55" y="610" font-size="18"><tspan x="55" dy="0">Heat crosses air-preheater surfaces without intended mixing;cleaning and fan positions vary</tspan><tspan x="55" dy="23">with the engineered design.</tspan></text><text x="25" y="675" font-size="16"><tspan x="25" dy="0">Original teaching schematic;simplified energy-flow diagram,not operating instructions.</tspan></text></g></svg>