<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img"><title>Reactor elements and separate protective functions</title><rect width="1000" height="700" fill="white"/><g font-family="Arial,sans-serif" fill="#292331"><text x="25" y="45" font-size="25"><tspan x="25" dy="0">Reactor elements and separate protective functions</tspan></text><rect x="55" y="155" width="270" height="115" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="65" y="219.5">Fuel + cladding</tspan></text><rect x="365" y="155" width="270" height="115" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="375" y="219.5">Moderator if required</tspan></text><rect x="675" y="155" width="270" height="115" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="685" y="219.5">Core coolant</tspan></text><rect x="55" y="340" width="270" height="115" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="65" y="392.5">Control / shutdown</tspan><tspan x="65" y="416.5">absorbers</tspan></text><rect x="365" y="340" width="270" height="115" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="375" y="404.5">Pressure boundary</tspan></text><rect x="675" y="340" width="270" height="115" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="685" y="404.5">Shielding / containment</tspan></text><text x="55" y="575" font-size="18"><tspan x="55" dy="0">Fuel releases heat;coolant removes it.Control changes reactivity;shielding reduces</tspan><tspan x="55" dy="23">exposure;containment limits releases.Decay heat persists after shutdown.</tspan></text><text x="25" y="675" font-size="16"><tspan x="25" dy="0">Original teaching schematic;simplified energy-flow diagram,not operating instructions.</tspan></text></g></svg>