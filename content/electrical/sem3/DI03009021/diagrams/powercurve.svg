<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img"><title>Wind operating speeds and controlled power curve</title><rect width="1000" height="700" fill="white"/><g font-family="Arial,sans-serif" fill="#292331"><text x="25" y="45" font-size="25"><tspan x="25" dy="0">Wind operating speeds and controlled power curve</tspan></text><path d="M120,540 L890,540" fill="none" stroke="#792db0" stroke-width="3"/><path d="M120,540 L120,140" fill="none" stroke="#792db0" stroke-width="3"/><path d="M120,540 L260,540 L450,235 L720,235 L720,540 L880,540" fill="none" stroke="#792db0" stroke-width="5"/><text x="190" y="580" font-size="18"><tspan x="190" dy="0">Cut-in</tspan></text><text x="420" y="580" font-size="18"><tspan x="420" dy="0">Rated speed</tspan></text><text x="685" y="580" font-size="18"><tspan x="685" dy="0">Cut-out</tspan></text><text x="150" y="180" font-size="20"><tspan x="150" dy="0">Power:illustrative curve,not manufacturer data</tspan></text><text x="260" y="620" font-size="18"><tspan x="260" dy="0">Wind speed →;rated-power region is controlled,not unlimited v³growth.</tspan></text><text x="25" y="675" font-size="16"><tspan x="25" dy="0">Original teaching schematic;simplified energy-flow diagram,not operating instructions.</tspan></text></g></svg>