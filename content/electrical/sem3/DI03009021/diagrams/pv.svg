<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img"><title>PVplant:main electrical path with optional controlled storage branch</title><rect width="1000" height="700" fill="white"/><g font-family="Arial,sans-serif" fill="#292331"><text x="25" y="45" font-size="25"><tspan x="25" dy="0">PVplant:main electrical path with optional controlled storage</tspan><tspan x="25" dy="30">branch</tspan></text><rect x="50" y="170" width="230" height="100" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="60" y="215.0">PVcells / modules /</tspan><tspan x="60" y="239.0">array</tspan></text><rect x="350" y="170" width="230" height="100" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="360" y="215.0">DCcollection /</tspan><tspan x="360" y="239.0">protection</tspan></text><rect x="700" y="170" width="250" height="100" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="710" y="215.0">MPPT / compatible</tspan><tspan x="710" y="239.0">inverter</tspan></text><path d="M280,220 L350,220" fill="none" stroke="#792db0" stroke-width="3"/><polygon points="350,220 339.0,215.0 339.0,225.0" fill="#792db0"/><path d="M580,220 L700,220" fill="none" stroke="#792db0" stroke-width="3"/><polygon points="700,220 689.0,215.0 689.0,225.0" fill="#792db0"/><rect x="710" y="390" width="240" height="100" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="720" y="435.0">ACprotection /</tspan><tspan x="720" y="459.0">metering / load-grid</tspan></text><path d="M825,270 L825,390" fill="none" stroke="#792db0" stroke-width="3"/><polygon points="825,390 830.0,379.0 820.0,379.0" fill="#792db0"/><rect x="350" y="390" width="230" height="100" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="360" y="435.0">Optional battery +</tspan><tspan x="360" y="459.0">controlled interface</tspan></text><path d="M465,270 L465,390" fill="none" stroke="#792db0" stroke-width="3"/><polygon points="465,390 470.0,379.0 460.0,379.0" fill="#792db0"/><path d="M485,390 L485,270" fill="none" stroke="#792db0" stroke-width="3"/><polygon points="485,270 480.0,281.0 490.0,281.0" fill="#792db0"/><text x="55" y="565" font-size="19"><tspan x="55" dy="0">Example of designed DC-coupled storage as a side branch;ordinary grid-tied PVneed not</tspan><tspan x="55" dy="24">have a battery.</tspan></text><text x="55" y="615" font-size="18"><tspan x="55" dy="0">Storage uses a compatible approved controller and protections;it is not a series load after</tspan><tspan x="55" dy="23">the utility grid.</tspan></text><text x="25" y="675" font-size="16"><tspan x="25" dy="0">Original teaching schematic;simplified energy-flow diagram,not operating instructions.</tspan></text></g></svg>