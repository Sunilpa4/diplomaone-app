"55" y="575" font-size="18"><tspan x="55" dy="0">Working-fluid path closes at the boiler.Cooling water separately passes condenser tubes and</tspan><tspan x="55" dy="23">rejects heat to a heat sink;it does not mix with condensate.</tspan></text><text x="25" y="675" font-size="16"><tspan x="25" dy="0">Original teaching schematic;simplified energy-flow diagram,not operating instructions.</tspan></text><path d="M810,270 L810,305" fill="none" stroke="#792db0" stroke-width="3"/><path d="M810,305 L190,305" fill="none" stroke="#792db0" stroke-width="3"/><path d="M190,305 L190,340" fill="none" stroke="#792db0" stroke-width="3"/><polygon points="190,340 195.0,329.0 185.0,329.0" fill="#792db0"/><path d="M810,455 L810,525" fill="none" stroke="#792db0" stroke-width="3"/><path d="M810,525 L25,525" fill="none" stroke="#792db0" stroke-width="3"/><path d="M25,525 L25,115" fill="none" stroke="#792db0" stroke-width="3"/><path d="M25,115 L190,115" fill="none" stroke="#792db0" stroke-width="3"/><path d="M190,115 L190,155" fill="none" stroke="#792db0" stroke-width="3"/><polygon points="190,155 195.0,144.0 185.0,144.0" fill="#792db0"/></g></svg>