<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img"><title>Biogas power:cleaned-gas energy path and separate digestate outlet</title><rect width="1000" height="700" fill="white"/><g font-family="Arial,sans-serif" fill="#292331"><text x="25" y="45" font-size="25"><tspan x="25" dy="0">Biogas power:cleaned-gas energy path and separate digestate outlet</tspan></text><rect x="40" y="180" width="220" height="100" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="50" y="225.0">Prepared organic</tspan><tspan x="50" y="249.0">feed</tspan></text><rect x="370" y="180" width="230" height="100" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="380" y="237.0">Anaerobic digester</tspan></text><rect x="710" y="180" width="240" height="100" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="720" y="225.0">Gas storage /</tspan><tspan x="720" y="249.0">cleaning</tspan></text><path d="M260,230 L370,230" fill="none" stroke="#792db0" stroke-width="3"/><polygon points="370,230 359.0,225.0 359.0,235.0" fill="#792db0"/><path d="M600,230 L710,230" fill="none" stroke="#792db0" stroke-width="3"/><polygon points="710,230 699.0,225.0 699.0,235.0" fill="#792db0"/><rect x="710" y="380" width="240" height="100" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="720" y="425.0">Gas engine /</tspan><tspan x="720" y="449.0">alternator</tspan></text><path d="M830,280 L830,380" fill="none" stroke="#792db0" stroke-width="3"/><polygon points="830,380 835.0,369.0 825.0,369.0" fill="#792db0"/><rect x="370" y="380" width="230" height="100" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="380" y="437.0">Digestate treatment</tspan></text><path d="M485,280 L485,380" fill="none" stroke="#792db0" stroke-width="3"/><polygon points="485,380 490.0,369.0 480.0,369.0" fill="#792db0"/><text x="55" y="565" font-size="19"><tspan x="55" dy="0">Gas and digestate leave by different branches.Output follows the cleaned-gas engine</tspan><tspan x="55" dy="24">path.</tspan></text><text x="55" y="610" font-size="18"><tspan x="55" dy="0">Sealed process,gas cleaning and authorised residue management are essential.No student gas</tspan><tspan x="55" dy="23">production or digester entry.</tspan></text><text x="25" y="675" font-size="16"><tspan x="25" dy="0">Original teaching schematic;simplified energy-flow diagram,not operating instructions.</tspan></text></g></svg>