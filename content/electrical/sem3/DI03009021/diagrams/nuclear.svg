<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img"><title>Indirect-cycle nuclear station:primary,steam and external cooling loops</title><rect width="1000" height="700" fill="white"/><g font-family="Arial,sans-serif" fill="#292331"><text x="25" y="45" font-size="25"><tspan x="25" dy="0">Indirect-cycle nuclear station:primary,steam and external cooling</tspan><tspan x="25" dy="30">loops</tspan></text><rect x="50" y="160" width="270" height="85" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="60" y="209.5">Reactor core</tspan></text><path d="M320,202 L360,202" fill="none" stroke="#792db0" stroke-width="3"/><polygon points="360,202 349.0,197.0 349.0,207.0" fill="#792db0"/><rect x="365" y="160" width="270" height="85" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="375" y="209.5">Primary coolant</tspan></text><path d="M635,202 L675,202" fill="none" stroke="#792db0" stroke-width="3"/><polygon points="675,202 664.0,197.0 664.0,207.0" fill="#792db0"/><rect x="680" y="160" width="270" height="85" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="690" y="209.5">Steam generator primary</tspan></text><path d="M815,245 L815,275 L185,275 L185,245" fill="none" stroke="#792db0" stroke-width="2"/><rect x="50" y="320" width="270" height="85" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="60" y="357.5">Steam generator</tspan><tspan x="60" y="381.5">secondary</tspan></text><path d="M320,362 L360,362" fill="none" stroke="#792db0" stroke-width="3"/><polygon points="360,362 349.0,357.0 349.0,367.0" fill="#792db0"/><rect x="365" y="320" width="270" height="85" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="375" y="369.5">Turbine / generator</tspan></text><path d="M635,362 L675,362" fill="none" stroke="#792db0" stroke-width="3"/><polygon points="675,362 664.0,357.0 664.0,367.0" fill="#792db0"/><rect x="680" y="320" width="270" height="85" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="690" y="369.5">Condenser / feed pump</tspan></text><path d="M815,405 L815,435 L185,435 L185,405" fill="none" stroke="#792db0" stroke-width="2"/><rect x="50" y="480" width="270" height="85" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="60" y="529.5">Condenser cooling tubes</tspan></text><path d="M320,522 L360,522" fill="none" stroke="#792db0" stroke-width="3"/><polygon points="360,522 349.0,517.0 349.0,527.0" fill="#792db0"/><rect x="365" y="480" width="270" height="85" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="375" y="517.5">Circulating cooling</tspan><tspan x="375" y="541.5">water</tspan></text><path d="M635,522 L675,522" fill="none" stroke="#792db0" stroke-width="3"/><polygon points="675,522 664.0,517.0 664.0,527.0" fill="#792db0"/><rect x="680" y="480" width="270" height="85" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="690" y="517.5">Cooling tower / heat</tspan><tspan x="690" y="541.5">sink</tspan></text><path d="M815,565 L815,595 L185,595 L185,565" fill="none" stroke="#792db0" stroke-width="2"/><text x="60" y="115" font-size="19"><tspan x="60" dy="0">Each row is a separate fluid loop;heat crosses exchanger walls,not fluid pipes.</tspan></text><text x="55" y="630" font-size="16"><tspan x="55" dy="0">Indirect cycle only;BWRdiffers.No operating valve sequence is specified.</tspan></text><text x="25" y="675" font-size="16"><tspan x="25" dy="0">Original teaching schematic;simplified energy-flow diagram,not operating instructions.</tspan></text></g></svg>