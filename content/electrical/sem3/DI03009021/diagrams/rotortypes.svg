<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img"><title>HAWTand VAWT:construction and orientation of the rotor shaft</title><rect width="1000" height="700" fill="white"/><g font-family="Arial,sans-serif" fill="#292331"><text x="25" y="45" font-size="25"><tspan x="25" dy="0">HAWTand VAWT:construction and orientation of the rotor shaft</tspan></text><text x="65" y="125" font-size="21"><tspan x="65" dy="0">HAWT:horizontal shaft axis</tspan></text><text x="560" y="125" font-size="21"><tspan x="560" dy="0">VAWT:vertical shaft axis</tspan><tspan x="560" dy="26">(Darrieus)</tspan></text><path d="M180,200 L180,470" fill="none" stroke="#792db0" stroke-width="3"/><path d="M180,335 L420,335" fill="none" stroke="#792db0" stroke-width="3"/><rect x="300" y="290" width="170" height="90" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="310" y="330.0">Nacelle /</tspan><tspan x="310" y="354.0">generator</tspan></text><path d="M380,380 L380,550" fill="none" stroke="#792db0" stroke-width="3"/><text x="50" y="505" font-size="18"><tspan x="50" dy="0">Projected rotor plane</tspan></text><text x="55" y="580" font-size="17"><tspan x="55" dy="0">Blade / hub → horizontal main shaft → generator</tspan></text><ellipse cx="750" cy="330" rx="85" ry="145" fill="none" stroke="#792db0" stroke-width="4"/><path d="M750,165 L750,550" fill="none" stroke="#792db0" stroke-width="3"/><path d="M665,330 L835,330" fill="none" stroke="#792db0" stroke-width="3"/><rect x="690" y="515" width="160" height="65" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="700" y="554.5">Generator</tspan></text><text x="570" y="600" font-size="17"><tspan x="570" dy="0">Curved lift blades / support arms /</tspan><tspan x="570" dy="22">vertical shaft</tspan></text><text x="25" y="675" font-size="16"><tspan x="25" dy="0">Original teaching schematic;simplified energy-flow diagram,not operating instructions.</tspan></text></g></svg>