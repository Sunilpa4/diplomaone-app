<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img"><title>Hydro station:hydraulic structures,runner and electrical equipment</title><rect width="1000" height="700" fill="white"/><g font-family="Arial,sans-serif" fill="#292331"><text x="25" y="45" font-size="25"><tspan x="25" dy="0">Hydro station:hydraulic structures,runner and electrical equipment</tspan></text><rect x="70" y="165" width="210" height="170" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="80" y="257.0">Reservoir / intake</tspan></text><rect x="290" y="165" width="65" height="310" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="300" y="327.0">Dam</tspan></text><path d="M280,275 L470,275" fill="none" stroke="#792db0" stroke-width="3"/><path d="M470,275 L600,430" fill="none" stroke="#792db0" stroke-width="3"/><rect x="555" y="395" width="160" height="90" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="565" y="447.0">Turbine</tspan></text><path d="M715,440 L780,440" fill="none" stroke="#792db0" stroke-width="3"/><rect x="780" y="395" width="160" height="90" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="790" y="447.0">Alternator</tspan></text><path d="M635,485 L635,555" fill="none" stroke="#792db0" stroke-width="3"/><path d="M635,555 L880,555" fill="none" stroke="#792db0" stroke-width="3"/><text x="370" y="245" font-size="19"><tspan x="370" dy="0">Penstock / net head</tspan></text><text x="680" y="590" font-size="19"><tspan x="680" dy="0">Tailrace</tspan></text><text x="55" y="110" font-size="20"><tspan x="55" dy="0">Water path:reservoir → turbine → tailrace;shaft links turbine and alternator.</tspan></text><text x="25" y="675" font-size="16"><tspan x="25" dy="0">Original teaching schematic;simplified energy-flow diagram,not operating instructions.</tspan></text></g></svg>