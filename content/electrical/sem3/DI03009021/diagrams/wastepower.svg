<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img"><title>Waste-to-energy:separate steam,flue-gas and solid-residue routes</title><rect width="1000" height="700" fill="white"/><g font-family="Arial,sans-serif" fill="#292331"><text x="25" y="45" font-size="25"><tspan x="25" dy="0">Waste-to-energy:separate steam,flue-gas and solid-residue routes</tspan></text><rect x="55" y="160" width="250" height="90" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="65" y="200.0">Prepared suitable</tspan><tspan x="65" y="224.0">waste</tspan></text><rect x="390" y="160" width="250" height="90" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="400" y="200.0">Controlled furnace /</tspan><tspan x="400" y="224.0">boiler</tspan></text><rect x="710" y="160" width="240" height="90" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="720" y="200.0">Steam turbine /</tspan><tspan x="720" y="224.0">generator</tspan></text><path d="M305,205 L390,205" fill="none" stroke="#792db0" stroke-width="3"/><polygon points="390,205 379.0,200.0 379.0,210.0" fill="#792db0"/><path d="M640,205 L710,205" fill="none" stroke="#792db0" stroke-width="3"/><polygon points="710,205 699.0,200.0 699.0,210.0" fill="#792db0"/><rect x="360" y="385" width="280" height="90" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="370" y="425.0">Flue-gas cleaning /</tspan><tspan x="370" y="449.0">stack</tspan></text><path d="M500,250 L500,385" fill="none" stroke="#792db0" stroke-width="3"/><polygon points="500,385 505.0,374.0 495.0,374.0" fill="#792db0"/><rect x="55" y="385" width="240" height="90" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="65" y="425.0">Ash / residue</tspan><tspan x="65" y="449.0">management</tspan></text><path d="M430,250 L430,310" fill="none" stroke="#792db0" stroke-width="3"/><path d="M430,310 L175,310" fill="none" stroke="#792db0" stroke-width="3"/><path d="M175,310 L175,385" fill="none" stroke="#792db0" stroke-width="3"/><polygon points="175,385 180.0,374.0 170.0,374.0" fill="#792db0"/><rect x="710" y="385" width="240" height="90" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="720" y="425.0">Condenser / feed</tspan><tspan x="720" y="449.0">return</tspan></text><path d="M830,250 L830,385" fill="none" stroke="#792db0" stroke-width="3"/><polygon points="830,385 835.0,374.0 825.0,374.0" fill="#792db0"/><text x="55" y="565" font-size="20"><tspan x="55" dy="0">Steam cycle,flue-gas treatment and solid residues are distinct paths.</tspan></text><text x="55" y="610" font-size="18"><tspan x="55" dy="0">Feedwater returns from condenser/feed equipment to boiler;there is no condenser-water flow</tspan><tspan x="55" dy="23">through the flue-gas filter.</tspan></text><text x="25" y="675" font-size="16"><tspan x="25" dy="0">Original teaching schematic;simplified energy-flow diagram,not operating instructions.</tspan></text></g></svg>