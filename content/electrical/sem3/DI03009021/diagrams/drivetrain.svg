<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img"><title>Geared versus direct-drive HAWT</title><rect width="1000" height="700" fill="white"/><g font-family="Arial,sans-serif" fill="#292331"><text x="25" y="45" font-size="25"><tspan x="25" dy="0">Geared versus direct-drive HAWT</tspan></text><rect x="55" y="230" width="270" height="130" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="65" y="302.0">Rotor / main bearing</tspan></text><path d="M325,295 L360,295" fill="none" stroke="#792db0" stroke-width="3"/><polygon points="360,295 349.0,290.0 349.0,300.0" fill="#792db0"/><rect x="365" y="230" width="270" height="130" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="375" y="290.0">Gearbox ORlow-speed</tspan><tspan x="375" y="314.0">generator</tspan></text><path d="M635,295 L670,295" fill="none" stroke="#792db0" stroke-width="3"/><polygon points="670,295 659.0,290.0 659.0,300.0" fill="#792db0"/><rect x="675" y="230" width="270" height="130" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="685" y="302.0">Converter / transformer</tspan></text><text x="55" y="500" font-size="21"><tspan x="55" dy="0">Geared:low-speed shaft→gearbox→high-speed generator.Direct drive:rotor→multi-</tspan><tspan x="55" dy="26">pole generator.Main gearbox is omitted,not all bearings or maintenance.</tspan></text><text x="25" y="675" font-size="16"><tspan x="25" dy="0">Original teaching schematic;simplified energy-flow diagram,not operating instructions.</tspan></text></g></svg>