<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img"><title>Hydrogen PEMfuel cell:separate ionic and electronic paths</title><rect width="1000" height="700" fill="white"/><g font-family="Arial,sans-serif" fill="#292331"><text x="25" y="45" font-size="25"><tspan x="25" dy="0">Hydrogen PEMfuel cell:separate ionic and electronic paths</tspan></text><rect x="150" y="190" width="180" height="300" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="160" y="347.0">Anode:hydrogen</tspan></text><rect x="420" y="190" width="160" height="300" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="430" y="335.0">PEM:protons</tspan><tspan x="430" y="359.0">cross</tspan></text><rect x="670" y="190" width="180" height="300" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="680" y="335.0">Cathode:air /</tspan><tspan x="680" y="359.0">oxygen</tspan></text><path d="M330,270 L420,270" fill="none" stroke="#792db0" stroke-width="3"/><path d="M580,270 L670,270" fill="none" stroke="#792db0" stroke-width="3"/><polygon points="670,270 659.0,265.0 659.0,275.0" fill="#792db0"/><path d="M240,190 L240,130 L760,130 L760,190" fill="none" stroke="#792db0" stroke-width="3"/><rect x="420" y="95" width="160" height="65" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="430" y="122.5">External</tspan><tspan x="430" y="146.5">DCload</tspan></text><text x="80" y="555" font-size="20"><tspan x="80" dy="0">Anode:H2→2H⁺+2e⁻;cathode:½O2+2H⁺+2e⁻→H2O</tspan></text><text x="80" y="610" font-size="18"><tspan x="80" dy="0">Electrons use the external load;protons cross the membrane.Reactants remain separately</tspan><tspan x="80" dy="23">supplied.</tspan></text><text x="25" y="675" font-size="16"><tspan x="25" dy="0">Original teaching schematic;simplified energy-flow diagram,not operating instructions.</tspan></text></g></svg>