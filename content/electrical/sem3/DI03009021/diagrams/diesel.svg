<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img"><title>DGset:energy path and essential supporting systems</title><rect width="1000" height="700" fill="white"/><g font-family="Arial,sans-serif" fill="#292331"><text x="25" y="45" font-size="25"><tspan x="25" dy="0">DGset:energy path and essential supporting systems</tspan></text><rect x="55" y="155" width="270" height="115" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="65" y="207.5">Fuel / compression</tspan><tspan x="65" y="231.5">ignition</tspan></text><path d="M325,213 L360,213" fill="none" stroke="#792db0" stroke-width="3"/><polygon points="360,213 349.0,208.0 349.0,218.0" fill="#792db0"/><rect x="365" y="155" width="270" height="115" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="375" y="219.5">Piston / crankshaft</tspan></text><path d="M635,213 L670,213" fill="none" stroke="#792db0" stroke-width="3"/><polygon points="670,213 659.0,208.0 659.0,218.0" fill="#792db0"/><rect x="675" y="155" width="270" height="115" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="685" y="219.5">Alternator</tspan></text><rect x="55" y="340" width="270" height="115" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="65" y="404.5">Cooling / lubrication</tspan></text><rect x="365" y="340" width="270" height="115" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="375" y="392.5">Governor / AVR /</tspan><tspan x="375" y="416.5">protection</tspan></text><rect x="675" y="340" width="270" height="115" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="685" y="392.5">Approved transfer</tspan><tspan x="685" y="416.5">interface</tspan></text><text x="55" y="575" font-size="18"><tspan x="55" dy="0">Top row is energy conversion;bottom row is supporting equipment,NOTan engine process</tspan><tspan x="55" dy="23">sequence.No indoor operation or utility backfeed.</tspan></text><text x="25" y="675" font-size="16"><tspan x="25" dy="0">Original teaching schematic;simplified energy-flow diagram,not operating instructions.</tspan></text></g></svg>