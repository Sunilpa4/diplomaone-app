<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img"><title>Coal station:steam-water loop and turbine-generator shaft</title><rect width="1000" height="700" fill="white"/><g font-family="Arial,sans-serif" fill="#292331"><text x="25" y="45" font-size="25"><tspan x="25" dy="0">Coal station:steam-water loop and turbine-generator shaft</tspan></text><rect x="60" y="180" width="140" height="90" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="70" y="220.0">Prepared</tspan><tspan x="70" y="244.0">coal</tspan></text><rect x="270" y="180" width="180" height="90" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="280" y="220.0">Boiler +</tspan><tspan x="280" y="244.0">superheater</tspan></text><rect x="550" y="180" width="180" height="90" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="560" y="232.0">Steam turbine</tspan></text><rect x="800" y="180" width="160" height="90" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="810" y="232.0">Alternator</tspan></text><rect x="550" y="405" width="180" height="90" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="560" y="457.0">Condenser</tspan></text><rect x="270" y="405" width="180" height="90" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="280" y="445.0">Feed system /</tspan><tspan x="280" y="469.0">pump</tspan></text><path d="M200,225 L270,225" fill="none" stroke="#792db0" stroke-width="3"/><polygon points="270,225 259.0,220.0 259.0,230.0" fill="#792db0"/><path d="M450,225 L550,225" fill="none" stroke="#792db0" stroke-width="3"/><polygon points="550,225 539.0,220.0 539.0,230.0" fill="#792db0"/><path d="M730,225 L800,225" fill="none" stroke="#792db0" stroke-width="3"/><polygon points="800,225 789.0,220.0 789.0,230.0" fill="#792db0"/><path d="M640,270 L640,405" fill="none" stroke="#792db0" stroke-width="3"/><polygon points="640,405 645.0,394.0 635.0,394.0" fill="#792db0"/><path d="M550,450 L450,450" fill="none" stroke="#792db0" stroke-width="3"/><polygon points="450,450 461.0,455.0 461.0,445.0" fill="#792db0"/><path d="M360,405 L360,270" fill="none" stroke="#792db0" stroke-width="3"/><polygon points="360,270 355.0,281.0 365.0,281.0" fill="#792db0"/><text x="455" y="200" font-size="17"><tspan x="455" dy="0">Steam</tspan></text><text x="730" y="160" font-size="17"><tspan x="730" dy="0">Shaft</tspan></text><text x="460" y="485" font-size="17"><tspan x="460" dy="0">Water</tspan></text><text x="55" y="110" font-size="20"><tspan x="55" dy="0">Steam/water recirculates;coal and electrical output are separate paths.</tspan></text><text x="55" y="580" font-size="19"><tspan x="55" dy="0">Condenser rejects heat to a separate cooling-water circuit.Gas cleaning and ash</tspan><tspan x="55" dy="24">handling are separate fuel-side paths.</tspan></text><text x="25" y="675" font-size="16"><tspan x="25" dy="0">Original teaching schematic;simplified energy-flow diagram,not operating instructions.</tspan></text></g></svg>