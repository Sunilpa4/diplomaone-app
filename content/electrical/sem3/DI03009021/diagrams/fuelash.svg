<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img"><title>Fuel and ash circuit:separate bottom-ash and fly-ash branches</title><rect width="1000" height="700" fill="white"/><g font-family="Arial,sans-serif" fill="#292331"><text x="25" y="45" font-size="25"><tspan x="25" dy="0">Fuel and ash circuit:separate bottom-ash and fly-ash branches</tspan></text><rect x="50" y="175" width="230" height="100" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="60" y="220.0">Coal receipt /</tspan><tspan x="60" y="244.0">storage</tspan></text><rect x="365" y="175" width="230" height="100" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="375" y="220.0">Crusher / mill /</tspan><tspan x="375" y="244.0">feeder</tspan></text><rect x="690" y="175" width="250" height="100" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="700" y="232.0">Furnace</tspan></text><path d="M280,225 L365,225" fill="none" stroke="#792db0" stroke-width="3"/><polygon points="365,225 354.0,220.0 354.0,230.0" fill="#792db0"/><path d="M595,225 L690,225" fill="none" stroke="#792db0" stroke-width="3"/><polygon points="690,225 679.0,220.0 679.0,230.0" fill="#792db0"/><path d="M815,275 L815,330" fill="none" stroke="#792db0" stroke-width="3"/><path d="M815,330 L455,330" fill="none" stroke="#792db0" stroke-width="3"/><path d="M455,330 L455,390" fill="none" stroke="#792db0" stroke-width="3"/><polygon points="455,390 460.0,379.0 450.0,379.0" fill="#792db0"/><path d="M815,330 L815,390" fill="none" stroke="#792db0" stroke-width="3"/><polygon points="815,390 820.0,379.0 810.0,379.0" fill="#792db0"/><rect x="340" y="390" width="230" height="100" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="350" y="435.0">Flue gas → fly-ash</tspan><tspan x="350" y="459.0">capture</tspan></text><rect x="700" y="390" width="230" height="100" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="710" y="435.0">Bottom-ash</tspan><tspan x="710" y="459.0">collection</tspan></text><text x="70" y="570" font-size="20"><tspan x="70" dy="0">Two separate residue outlets lead to authorised handling and management.</tspan></text><text x="70" y="615" font-size="18"><tspan x="70" dy="0">Fly ash is entrained in gas;bottom ash is collected from the furnace bottom.Not a serial</tspan><tspan x="70" dy="23">ash-to-gas process.</tspan></text><text x="25" y="675" font-size="16"><tspan x="25" dy="0">Original teaching schematic;simplified energy-flow diagram,not operating instructions.</tspan></text></g></svg>