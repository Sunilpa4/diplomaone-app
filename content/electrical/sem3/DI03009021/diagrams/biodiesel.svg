<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img"><title>Agro-based chemical conversion:biodiesel route</title><rect width="1000" height="700" fill="white"/><g font-family="Arial,sans-serif" fill="#292331"><text x="25" y="45" font-size="25"><tspan x="25" dy="0">Agro-based chemical conversion:biodiesel route</tspan></text><rect x="55" y="155" width="270" height="115" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="65" y="219.5">Oil / fat feedstock</tspan></text><path d="M325,213 L360,213" fill="none" stroke="#792db0" stroke-width="3"/><polygon points="360,213 349.0,208.0 349.0,218.0" fill="#792db0"/><rect x="365" y="155" width="270" height="115" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="375" y="207.5">Pretreatment /</tspan><tspan x="375" y="231.5">conversion</tspan></text><path d="M635,213 L670,213" fill="none" stroke="#792db0" stroke-width="3"/><polygon points="670,213 659.0,208.0 659.0,218.0" fill="#792db0"/><rect x="675" y="155" width="270" height="115" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="685" y="207.5">Separation / quality</tspan><tspan x="685" y="231.5">testing</tspan></text><rect x="55" y="340" width="270" height="115" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="65" y="404.5">Approved fuel storage</tspan></text><path d="M325,398 L360,398" fill="none" stroke="#792db0" stroke-width="3"/><polygon points="360,398 349.0,393.0 349.0,403.0" fill="#792db0"/><rect x="365" y="340" width="270" height="115" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="375" y="404.5">Compatible engine</tspan></text><path d="M635,398 L670,398" fill="none" stroke="#792db0" stroke-width="3"/><polygon points="670,398 659.0,393.0 659.0,403.0" fill="#792db0"/><rect x="675" y="340" width="270" height="115" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="685" y="392.5">Alternator / protected</tspan><tspan x="685" y="416.5">output</tspan></text><text x="55" y="575" font-size="18"><tspan x="55" dy="0">Coproduct/waste treatment is separate.Biodiesel is not raw vegetable oil.No student</tspan><tspan x="55" dy="23">alcohol/catalyst handling or fuel synthesis.</tspan></text><text x="25" y="675" font-size="16"><tspan x="25" dy="0">Original teaching schematic;simplified energy-flow diagram,not operating instructions.</tspan></text><path d="M810,270 L810,305" fill="none" stroke="#792db0" stroke-width="3"/><path d="M810,305 L190,305" fill="none" stroke="#792db0" stroke-width="3"/><path d="M190,305 L190,340" fill="none" stroke="#792db0" stroke-width="3"/><polygon points="190,340 195.0,329.0 185.0,329.0" fill="#792db0"/></g></svg>