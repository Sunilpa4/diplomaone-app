<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img"><title>Factor definitions:keep denominator and period explicit</title><rect width="1000" height="700" fill="white"/><g font-family="Arial,sans-serif" fill="#292331"><text x="25" y="45" font-size="25"><tspan x="25" dy="0">Factor definitions:keep denominator and period explicit</tspan></text><rect x="55" y="230" width="270" height="130" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="65" y="302.0">Demand / connected load</tspan></text><rect x="365" y="230" width="270" height="130" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="375" y="290.0">Energy / (capacity ×</tspan><tspan x="375" y="314.0">time)</tspan></text><rect x="675" y="230" width="270" height="130" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="685" y="290.0">Individual maxima /</tspan><tspan x="685" y="314.0">group max</tspan></text><text x="55" y="500" font-size="21"><tspan x="55" dy="0">LF=Pavg/Pmax;CF=E/(CT);PUF=E/(Cton);UF=Pmax/C.CF=LF×UF.Diversity and</tspan><tspan x="55" dy="26">coincidence are reciprocal for matching inputs.</tspan></text><text x="25" y="675" font-size="16"><tspan x="25" dy="0">Original teaching schematic;simplified energy-flow diagram,not operating instructions.</tspan></text></g></svg>