<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" role="img" aria-label="Two-wattmeter connection:W1on B,W2on R,common Y"><rect width="1000" height="690" fill="white"/><g font-family="Arial,sans-serif"><text font-size="26" fill="#382b45"><tspan x="24" y="36.0">Two-wattmeter connection:W1on B,W2on R,common Y</tspan></text><rect x="825" y="125" width="140" height="420" rx="10" fill="#efe3fa" stroke="#8a53af"/><text font-size="18" fill="#382b45"><tspan x="835" y="330.0">Three-wire</tspan></text><text font-size="18" fill="#382b45"><tspan x="835" y="352.0">load</tspan></text><path d="M90,180 L825,180" stroke="#792db0" stroke-width="3" fill="none"/><text font-size="20" fill="#382b45"><tspan x="60" y="186.0">R</tspan></text><path d="M90,330 L825,330" stroke="#792db0" stroke-width="3" fill="none"/><text font-size="20" fill="#382b45"><tspan x="60" y="336.0">Y</tspan></text><path d="M90,480 L825,480" stroke="#792db0" stroke-width="3" fill="none"/><text font-size="20" fill="#382b45"><tspan x="60" y="486.0">B</tspan></text><rect x="390" y="150" width="140" height="60" rx="10" fill="#efe3fa" stroke="#8a53af"/><text font-size="18" fill="#382b45"><tspan x="400" y="186.0">W2 CC</tspan></text><rect x="390" y="450" width="140" height="60" rx="10" fill="#efe3fa" stroke="#8a53af"/><text font-size="18" fill="#382b45"><tspan x="400" y="486.0">W1 CC</tspan></text><path d="M585,180 L585,330" stroke="#792db0" stroke-width="3" fill="none"/><rect x="540" y="220" width="90" height="70" rx="10" fill="#efe3fa" stroke="#8a53af"/><text font-size="18" fill="#382b45"><tspan x="550" y="261.0">W2 PC</tspan></text><path d="M720,330 L720,480" stroke="#792db0" stroke-width="3" fill="none"/><rect x="675" y="375" width="90" height="70" rx="10" fill="#efe3fa" stroke="#8a53af"/><text font-size="18" fill="#382b45"><tspan x="685" y="416.0">W1 PC</tspan></text><circle cx="585" cy="180" r="5" fill="#792db0"/><circle cx="585" cy="330" r="5" fill="#792db0"/><circle cx="720" cy="330" r="5" fill="#792db0"/><circle cx="720" cy="480" r="5" fill="#792db0"/><text font-size="19" fill="#382b45"><tspan x="65" y="95.0">Declared RYBthree-wire connection;CCseries,PCto common Y;terminal polarity per</tspan><tspan x="65" y="119.7">manual.</tspan></text><text font-size="18" fill="#382b45"><tspan x="65" y="565.0">P=W1+W2for three-wire loads;balanced:W1=VLILcos(30°−φ),W2=VLILcos(30°+φ).</tspan></text><text font-size="18" fill="#382b45"><tspan x="65" y="615.0">Four-wire alternative:three wattmeters,one current/phase-neutral pressure pair per</tspan><tspan x="65" y="638.4">phase.</tspan></text><text font-size="15" fill="#382b45"><tspan x="24" y="668.0">Original teaching model;not measured evidence or permission for live wiring.</tspan></text></g></svg>