<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" role="img" aria-label="Voltmeter multiplier:series voltage sharing"><rect width="1000" height="690" fill="white"/><g font-family="Arial,sans-serif"><text font-size="26" fill="#382b45"><tspan x="24" y="36.0">Voltmeter multiplier:series voltage sharing</tspan></text><path d="M140,250 L500,250" stroke="#792db0" stroke-width="3" fill="none"/><g transform="translate(320.0 250.0) rotate(0.0)"><rect x="-90.0" y="-25" width="180" height="50" fill="#efe3fa" stroke="#792db0"/><text x="0" y="7" font-size="14.999999999999998" text-anchor="middle" transform="rotate(0)">Series multiplier Rs</text></g><path d="M500,250 L680,250" stroke="#792db0" stroke-width="3" fill="none"/><circle cx="750" cy="250" r="70" fill="white" stroke="#792db0" stroke-width="3"/><text font-size="20" fill="#382b45"><tspan x="715.0" y="257.0">Rm / Im</tspan></text><path d="M820,250 L900,250" stroke="#792db0" stroke-width="3" fill="none"/><path d="M900,250 L900,500" stroke="#792db0" stroke-width="3" fill="none"/><path d="M900,500 L140,500" stroke="#792db0" stroke-width="3" fill="none"/><text font-size="20" fill="#382b45"><tspan x="110" y="240.0">+</tspan></text><text font-size="20" fill="#382b45"><tspan x="110" y="510.0">−</tspan></text><text font-size="20" fill="#382b45"><tspan x="65" y="100.0">Complete voltmeter spans the measured voltage;Impasses through Rsand movement.</tspan></text><text font-size="18" fill="#382b45"><tspan x="65" y="620.0">V=Im(Rm+Rs);Rs=V/Im−Rm;input resistance=V/Im.</tspan></text><text font-size="15" fill="#382b45"><tspan x="24" y="668.0">Original teaching model;not measured evidence or permission for live wiring.</tspan></text></g></svg>