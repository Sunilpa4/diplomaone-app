<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" role="img" aria-label="Earth resistance:three separate probes in the soil"><rect width="1000" height="690" fill="white"/><g font-family="Arial,sans-serif"><text font-size="26" fill="#382b45"><tspan x="24" y="36.0">Earth resistance:three separate probes in the soil</tspan></text><rect x="60" y="480" width="880" height="85" fill="#eee1cc" stroke="#b69f7e" stroke-width="2"/><rect x="100" y="180" width="250" height="150" rx="10" fill="#efe3fa" stroke="#8a53af"/><text font-size="18" fill="#382b45"><tspan x="110" y="261.0">Approved earth tester</tspan></text><path d="M150,330 L150,450" stroke="#792db0" stroke-width="3" fill="none"/><path d="M225,330 L500,450" stroke="#792db0" stroke-width="3" fill="none"/><path d="M300,330 L830,450" stroke="#792db0" stroke-width="3" fill="none"/><path d="M150,450 L150,550" stroke="#9c6c24" stroke-width="3" fill="none"/><text font-size="20" fill="#382b45"><tspan x="142" y="590.0">E</tspan></text><path d="M500,450 L500,550" stroke="#9c6c24" stroke-width="3" fill="none"/><text font-size="20" fill="#382b45"><tspan x="492" y="590.0">P</tspan></text><path d="M830,450 L830,550" stroke="#9c6c24" stroke-width="3" fill="none"/><text font-size="20" fill="#382b45"><tspan x="822" y="590.0">C</tspan></text><text font-size="20" fill="#382b45"><tspan x="65" y="100.0">Separate metal probes in soil;the soil band is NOTa connecting wire.</tspan></text><text font-size="18" fill="#382b45"><tspan x="65" y="625.0">Current E–C;potential E–P.Move Pto verify stability;earth isolation requires</tspan><tspan x="65" y="648.4">authorisation.</tspan></text><text font-size="15" fill="#382b45"><tspan x="24" y="668.0">Original teaching model;not measured evidence or permission for live wiring.</tspan></text></g></svg>