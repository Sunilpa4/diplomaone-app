<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" role="img" aria-label="Induction energy meter:disc,flux systems and register"><rect width="1000" height="690" fill="white"/><g font-family="Arial,sans-serif"><text font-size="26" fill="#382b45"><tspan x="24" y="36.0">Induction energy meter:disc,flux systems and register</tspan></text><rect x="150" y="150" width="200" height="100" rx="10" fill="#efe3fa" stroke="#8a53af"/><text font-size="18" fill="#382b45"><tspan x="160" y="206.0">Current magnet</tspan></text><rect x="650" y="150" width="200" height="100" rx="10" fill="#efe3fa" stroke="#8a53af"/><text font-size="18" fill="#382b45"><tspan x="660" y="206.0">Pressure magnet</tspan></text><ellipse cx="500" cy="370" rx="230" ry="85" fill="#e5d8ed" stroke="#792db0" stroke-width="3"/><path d="M500,370 L500,480" stroke="#792db0" stroke-width="3" fill="none"/><path d="M500,480 l-10,-5 l0,10z" fill="#792db0" transform="rotate(90.0 500 480)"/><rect x="390" y="490" width="220" height="60" rx="10" fill="#efe3fa" stroke="#8a53af"/><text font-size="18" fill="#382b45"><tspan x="400" y="526.0">Register  /  pulses</tspan></text><text font-size="20" fill="#382b45"><tspan x="380" y="365.0">Aluminium disc</tspan></text><text font-size="20" fill="#382b45"><tspan x="70" y="430.0">Braking magnet</tspan></text><text font-size="18" fill="#382b45"><tspan x="65" y="615.0">Driving torque ∝ real power;braking torque ∝ speed;N/K gives kWh.</tspan></text><text font-size="15" fill="#382b45"><tspan x="24" y="668.0">Original teaching model;not measured evidence or permission for live wiring.</tspan></text></g></svg>