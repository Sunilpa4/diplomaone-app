<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" role="img" aria-label="CT/PT:independent current and voltage scaling paths"><rect width="1000" height="690" fill="white"/><g font-family="Arial,sans-serif"><text font-size="26" fill="#382b45"><tspan x="24" y="36.0">CT/PT:independent current and voltage scaling paths</tspan></text><rect x="55" y="180" width="260" height="110" rx="10" fill="#efe3fa" stroke="#8a53af"/><text font-size="18" fill="#382b45"><tspan x="65" y="241.0">Primary current Ip</tspan></text><path d="M315,235 L360,235" stroke="#792db0" stroke-width="3" fill="none"/><path d="M360,235 l-10,-5 l0,10z" fill="#792db0" transform="rotate(0.0 360 235)"/><rect x="360" y="180" width="260" height="110" rx="10" fill="#efe3fa" stroke="#8a53af"/><text font-size="18" fill="#382b45"><tspan x="370" y="241.0">CT ratio  /  polarity</tspan></text><path d="M620,235 L665,235" stroke="#792db0" stroke-width="3" fill="none"/><path d="M665,235 l-10,-5 l0,10z" fill="#792db0" transform="rotate(0.0 665 235)"/><rect x="665" y="180" width="280" height="110" rx="10" fill="#efe3fa" stroke="#8a53af"/><text font-size="18" fill="#382b45"><tspan x="675" y="230.0">Secondary Is  /</tspan></text><text font-size="18" fill="#382b45"><tspan x="675" y="252.0">low-Zburden</tspan></text><rect x="55" y="390" width="260" height="110" rx="10" fill="#efe3fa" stroke="#8a53af"/><text font-size="18" fill="#382b45"><tspan x="65" y="451.0">Primary voltage Vp</tspan></text><path d="M315,445 L360,445" stroke="#792db0" stroke-width="3" fill="none"/><path d="M360,445 l-10,-5 l0,10z" fill="#792db0" transform="rotate(0.0 360 445)"/><rect x="360" y="390" width="260" height="110" rx="10" fill="#efe3fa" stroke="#8a53af"/><text font-size="18" fill="#382b45"><tspan x="370" y="451.0">PT ratio  /  polarity</tspan></text><path d="M620,445 L665,445" stroke="#792db0" stroke-width="3" fill="none"/><path d="M665,445 l-10,-5 l0,10z" fill="#792db0" transform="rotate(0.0 665 445)"/><rect x="665" y="390" width="280" height="110" rx="10" fill="#efe3fa" stroke="#8a53af"/><text font-size="18" fill="#382b45"><tspan x="675" y="440.0">Secondary Vs  /</tspan></text><text font-size="18" fill="#382b45"><tspan x="675" y="462.0">high-Zmeter</tspan></text><text font-size="20" fill="#382b45"><tspan x="55" y="115.0">Separate measurement paths:CTand PTare NOTa cascaded series chain.</tspan></text><text font-size="19" fill="#382b45"><tspan x="65" y="600.0">Never open CTsecondary with primary current;never short PTsecondary.</tspan></text><text font-size="17" fill="#382b45"><tspan x="65" y="625.0">Functional paths;actual terminals,burden and earthing follow approved manuals.</tspan></text><text font-size="15" fill="#382b45"><tspan x="24" y="668.0">Original teaching model;not measured evidence or permission for live wiring.</tspan></text></g></svg>