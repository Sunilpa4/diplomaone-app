<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" role="img" aria-label="LVDT:primary,two secondaries and sliding magnetic core"><rect width="1000" height="690" fill="white"/><g font-family="Arial,sans-serif"><text font-size="26" fill="#382b45"><tspan x="24" y="36.0">LVDT:primary,two secondaries and sliding magnetic core</tspan></text><rect x="150" y="165" width="700" height="245" rx="10" fill="#efe3fa" stroke="#8a53af"/><text font-size="18" fill="#382b45"><tspan x="160" y="293.5"></tspan></text><rect x="230" y="130" width="150" height="310" rx="10" fill="#efe3fa" stroke="#8a53af"/><text font-size="18" fill="#382b45"><tspan x="240" y="291.0"></tspan></text><text font-size="17" fill="#382b45"><tspan x="240" y="200.0">Secondary 1</tspan></text><rect x="425" y="130" width="150" height="310" rx="10" fill="#efe3fa" stroke="#8a53af"/><text font-size="18" fill="#382b45"><tspan x="435" y="291.0"></tspan></text><text font-size="17" fill="#382b45"><tspan x="435" y="200.0">ACprimary</tspan></text><rect x="620" y="130" width="150" height="310" rx="10" fill="#efe3fa" stroke="#8a53af"/><text font-size="18" fill="#382b45"><tspan x="630" y="291.0"></tspan></text><text font-size="17" fill="#382b45"><tspan x="630" y="200.0">Secondary 2</tspan></text><rect x="180" y="285" width="640" height="36" rx="12" fill="#b5a7c2" stroke="#6c537b"/><path d="M350,490 L650,490" stroke="#792db0" stroke-width="3" fill="none"/><path d="M650,490 l-10,-5 l0,10z" fill="#792db0" transform="rotate(0.0 650 490)"/><text font-size="20" fill="#382b45"><tspan x="345" y="535.0">Magnetic core motion ±x</tspan></text><text font-size="18" fill="#382b45"><tspan x="70" y="580.0">Eout=E1−E2.Phase gives direction;amplitude follows |x|only near null.</tspan></text><text font-size="18" fill="#382b45"><tspan x="70" y="620.0">DCkit supply powers the oscillator;primary excitation is AC.</tspan></text><text font-size="15" fill="#382b45"><tspan x="24" y="668.0">Original teaching model;not measured evidence or permission for live wiring.</tspan></text></g></svg>