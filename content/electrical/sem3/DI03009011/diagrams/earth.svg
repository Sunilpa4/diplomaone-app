<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img"><title>Earth-resistance test:authorised safe probe arrangement</title><rect width="1000" height="700" fill="white"/><g font-family="Arial,sans-serif" fill="#292331"><text x="25" y="45" font-size="25"><tspan x="25" dy="0">Earth-resistance test:authorised safe probe arrangement</tspan></text><rect x="100" y="170" width="260" height="160" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="110" y="257.0">Earth tester E / P / C</tspan></text><path d="M150,330 L150,450" fill="none" stroke="#792db0" stroke-width="3"/><path d="M230,330 L500,450" fill="none" stroke="#792db0" stroke-width="3"/><path d="M310,330 L830,450" fill="none" stroke="#792db0" stroke-width="3"/><rect x="70" y="480" width="860" height="90" fill="#eadfcb" stroke="#a58b6b"/><path d="M150,450 L150,550" fill="none" stroke="#792db0" stroke-width="3"/><text x="142" y="600" font-size="20"><tspan x="142" dy="0">E</tspan></text><path d="M500,450 L500,550" fill="none" stroke="#792db0" stroke-width="3"/><text x="492" y="600" font-size="20"><tspan x="492" dy="0">P</tspan></text><path d="M830,450 L830,550" fill="none" stroke="#792db0" stroke-width="3"/><text x="822" y="600" font-size="20"><tspan x="822" dy="0">C</tspan></text><text x="60" y="120" font-size="20"><tspan x="60" dy="0">Separate probes in soil:current E–C,potential E–P;soil band is NOTa connecting</tspan><tspan x="60" dy="25">wire.</tspan></text><text x="25" y="675" font-size="16"><tspan x="25" dy="0">Original teaching schematic;not a field wiring/clearance or live-work instruction.</tspan></text></g></svg>