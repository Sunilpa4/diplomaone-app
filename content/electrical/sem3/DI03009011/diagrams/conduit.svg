<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img"><title>Conduit wiring:mechanical pathway and accessible boxes</title><rect width="1000" height="700" fill="white"/><g font-family="Arial,sans-serif" fill="#292331"><text x="25" y="45" font-size="25"><tspan x="25" dy="0">Conduit wiring:mechanical pathway and accessible boxes</tspan></text><rect x="120" y="230" width="710" height="100" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"></text><path d="M150,265 L800,265" fill="none" stroke="#792db0" stroke-width="3"/><path d="M150,300 L800,300" fill="none" stroke="#792db0" stroke-width="3"/><rect x="390" y="210" width="150" height="140" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="400" y="263.0">Accessible</tspan><tspan x="400" y="287.0">pull /</tspan><tspan x="400" y="311.0">junction box</tspan></text><text x="60" y="145" font-size="20"><tspan x="60" dy="0">Conduit / fittings / supports protect conductors;actual routing and fill are</tspan><tspan x="60" dy="25">designed.</tspan></text><text x="60" y="520" font-size="20"><tspan x="60" dy="0">Metallic enclosures/conduit require specified continuity/bonding;conduit is not</tspan><tspan x="60" dy="25">automatically an adequate PEpath.</tspan></text><text x="25" y="675" font-size="16"><tspan x="25" dy="0">Original teaching schematic;not a field wiring/clearance or live-work instruction.</tspan></text></g></svg>