rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="14"><tspan x="550" y="429.5">S</tspan></text><text x="260" y="320" font-size="18"><tspan x="260" dy="0">Room 1</tspan></text><text x="640" y="320" font-size="18"><tspan x="640" dy="0">Room 2</tspan></text><text x="180" y="510" font-size="18"><tspan x="180" dy="0">Socket / dedicated zone</tspan></text><text x="610" y="510" font-size="18"><tspan x="610" dy="0">Entry / DBzone</tspan></text><text x="60" y="590" font-size="18"><tspan x="60" dy="0">L=light,F=fan,S=socket,SB=switchboard.Dashed lines show route concepts,NOTwire-core</tspan><tspan x="60" dy="23">connections.</tspan></text><text x="60" y="635" font-size="17"><tspan x="60" dy="0">Illustrative plan only;actual dimensions,point quantities,circuit IDs and conductor counts need</tspan><tspan x="60" dy="22">a supplied project plan.</tspan></text><text x="25" y="675" font-size="16"><tspan x="25" dy="0">Original teaching schematic;not a field wiring/clearance or live-work instruction.</tspan></text></g></svg>