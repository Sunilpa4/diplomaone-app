<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img"><title>One-way lamp control:Lswitch,Nreturn,separate PE</title><rect width="1000" height="700" fill="white"/><g font-family="Arial,sans-serif" fill="#292331"><text x="25" y="45" font-size="25"><tspan x="25" dy="0">One-way lamp control:Lswitch,Nreturn,separate PE</tspan></text><path d="M90,200 L850,200" fill="none" stroke="#792db0" stroke-width="3"/><path d="M90,460 L850,460" fill="none" stroke="#792db0" stroke-width="3"/><path d="M850,200 L850,460" fill="none" stroke="#792db0" stroke-width="3"/><rect x="300" y="165" width="150" height="70" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="310" y="207.0">Switch S</tspan></text><rect x="780" y="285" width="140" height="85" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="790" y="334.5">Lamp</tspan></text><text x="55" y="205" font-size="20"><tspan x="55" dy="0">L</tspan></text><text x="55" y="465" font-size="20"><tspan x="55" dy="0">N</tspan></text><path d="M90,550 L760,550" fill="none" stroke="#792db0" stroke-width="3"/><text x="55" y="555" font-size="20"><tspan x="55" dy="0">PE</tspan></text><text x="70" y="115" font-size="20"><tspan x="70" dy="0">Functional circuit only:approved isolated low-voltage trainers for student</tspan><tspan x="70" dy="25">demonstrations.</tspan></text><text x="65" y="620" font-size="18"><tspan x="65" dy="0">Switch is in L;Nis not independently fused/switched in a way that leaves live parts</tspan><tspan x="65" dy="23">energised.PEbonds exposed metal.</tspan></text><text x="25" y="675" font-size="16"><tspan x="25" dy="0">Original teaching schematic;not a field wiring/clearance or live-work instruction.</tspan></text></g></svg>