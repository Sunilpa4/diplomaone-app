<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img"><title>Overhead estimate:separate phase/neutral conductors and insulated supports</title><rect width="1000" height="700" fill="white"/><g font-family="Arial,sans-serif" fill="#292331"><text x="25" y="45" font-size="25"><tspan x="25" dy="0">Overhead estimate:separate phase/neutral conductors and insulated</tspan><tspan x="25" dy="30">supports</tspan></text><path d="M180,190 L180,550" stroke="#8b8b8b" stroke-width="8"/><path d="M500,190 L500,550" stroke="#8b8b8b" stroke-width="8"/><path d="M820,190 L820,550" stroke="#8b8b8b" stroke-width="8"/><ellipse cx="180" cy="210" rx="10" ry="18" fill="white" stroke="#b98ad4" stroke-width="2"/><ellipse cx="500" cy="210" rx="10" ry="18" fill="white" stroke="#b98ad4" stroke-width="2"/><ellipse cx="820" cy="210" rx="10" ry="18" fill="white" stroke="#b98ad4" stroke-width="2"/><path d="M120,210 L880,210" fill="none" stroke="#792db0" stroke-width="3"/><text x="35" y="200" font-size="18"><tspan x="35" dy="0">R</tspan></text><ellipse cx="180" cy="260" rx="10" ry="18" fill="white" stroke="#b98ad4" stroke-width="2"/><ellipse cx="500" cy="260" rx="10" ry="18" fill="white" stroke="#b98ad4" stroke-width="2"/><ellipse cx="820" cy="260" rx="10" ry="18" fill="white" stroke="#b98ad4" stroke-width="2"/><path d="M120,260 L880,260" fill="none" stroke="#792db0" stroke-width="3"/><text x="35" y="250" font-size="18"><tspan x="35" dy="0">Y</tspan></text><ellipse cx="180" cy="310" rx="10" ry="18" fill="white" stroke="#b98ad4" stroke-width="2"/><ellipse cx="500" cy="310" rx="10" ry="18" fill="white" stroke="#b98ad4" stroke-width="2"/><ellipse cx="820" cy="310" rx="10" ry="18" fill="white" stroke="#b98ad4" stroke-width="2"/><path d="M120,310 L880,310" fill="none" stroke="#792db0" stroke-width="3"/><text x="35" y="300" font-size="18"><tspan x="35" dy="0">B</tspan></text><ellipse cx="180" cy="360" rx="10" ry="18" fill="white" stroke="#b98ad4" stroke-width="2"/><ellipse cx="500" cy="360" rx="10" ry="18" fill="white" stroke="#b98ad4" stroke-width="2"/><ellipse cx="820" cy="360" rx="10" ry="18" fill="white" stroke="#b98ad4" stroke-width="2"/><path d="M120,360 L880,360" fill="none" stroke="#792db0" stroke-width="3"/><text x="35" y="350" font-size="18"><tspan x="35" dy="0">N if required</tspan></text><text x="65" y="125" font-size="19"><tspan x="65" dy="0">Grey members are structural supports,NOTelectrical interconnections;oval marks</tspan><tspan x="65" dy="24">represent insulation.</tspan></text><text x="65" y="610" font-size="18"><tspan x="65" dy="0">Count route-specific crossarms,insulators,stays,earthing,guarding and erection</tspan><tspan x="65" dy="23">separately.No clearances specified.</tspan></text><text x="25" y="675" font-size="16"><tspan x="25" dy="0">Original teaching schematic;not a field wiring/clearance or live-work instruction.</tspan></text></g></svg>