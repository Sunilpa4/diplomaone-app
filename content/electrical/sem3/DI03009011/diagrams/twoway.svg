<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img"><title>Two-way lamp circuit:commons,travellers and explicit SPDTcontacts</title><rect width="1000" height="700" fill="white"/><g font-family="Arial,sans-serif" fill="#292331"><text x="25" y="45" font-size="25"><tspan x="25" dy="0">Two-way lamp circuit:commons,travellers and explicit SPDTcontacts</tspan></text><rect x="230" y="190" width="220" height="180" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"></text><rect x="580" y="190" width="220" height="180" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"></text><text x="280" y="215" font-size="18"><tspan x="280" dy="0">S1</tspan></text><text x="700" y="215" font-size="18"><tspan x="700" dy="0">S2</tspan></text><path d="M80,280 L265,280" fill="none" stroke="#792db0" stroke-width="3"/><path d="M265,280 L420,240" fill="none" stroke="#792db0" stroke-width="3"/><path d="M420,240 L610,240" fill="none" stroke="#792db0" stroke-width="3"/><path d="M420,330 L610,330" fill="none" stroke="#792db0" stroke-width="3"/><path d="M610,240 L765,280" fill="none" stroke="#792db0" stroke-width="3"/><path d="M765,280 L900,280" fill="none" stroke="#792db0" stroke-width="3"/><path d="M900,280 L900,540" fill="none" stroke="#792db0" stroke-width="3"/><path d="M80,540 L900,540" fill="none" stroke="#792db0" stroke-width="3"/><rect x="830" y="395" width="140" height="80" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="840" y="442.0">Lamp</tspan></text><text x="45" y="280" font-size="20"><tspan x="45" dy="0">L</tspan></text><text x="45" y="540" font-size="20"><tspan x="45" dy="0">N</tspan></text><circle cx="265" cy="280" r="6" fill="white" stroke="#792db0" stroke-width="2"/><circle cx="420" cy="240" r="6" fill="white" stroke="#792db0" stroke-width="2"/><circle cx="420" cy="330" r="6" fill="white" stroke="#792db0" stroke-width="2"/><circle cx="610" cy="240" r="6" fill="white" stroke="#792db0" stroke-width="2"/><circle cx="610" cy="330" r="6" fill="white" stroke="#792db0" stroke-width="2"/><circle cx="765" cy="280" r="6" fill="white" stroke="#792db0" stroke-width="2"/><text x="65" y="125" font-size="20"><tspan x="65" dy="0">Example:both switches select the upper traveller;operating either changes the</tspan><tspan x="65" dy="25">lamp state.</tspan></text><text x="65" y="615" font-size="18"><tspan x="65" dy="0">Functional contacts,not manufacturer numbering;PEis separately continuous and student work</tspan><tspan x="65" dy="23">uses approved trainers.</tspan></text><text x="25" y="675" font-size="16"><tspan x="25" dy="0">Original teaching schematic;not a field wiring/clearance or live-work instruction.</tspan></text></g></svg>