<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img"><title>DOLcontrol:stop/overload chain and correctly placed seal-in contact</title><rect width="1000" height="700" fill="white"/><g font-family="Arial,sans-serif" fill="#292331"><text x="25" y="45" font-size="25"><tspan x="25" dy="0">DOLcontrol:stop/overload chain and correctly placed seal-in contact</tspan></text><path d="M80,160 L80,550" fill="none" stroke="#792db0" stroke-width="3"/><path d="M920,160 L920,550" fill="none" stroke="#792db0" stroke-width="3"/><path d="M80,260 L920,260" fill="none" stroke="#792db0" stroke-width="3"/><rect x="150" y="225" width="120" height="70" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="160" y="267.0">STOP NC</tspan></text><rect x="300" y="225" width="120" height="70" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="310" y="267.0">OLR NC</tspan></text><rect x="500" y="225" width="140" height="70" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="510" y="267.0">START NO</tspan></text><rect x="760" y="220" width="120" height="80" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="770" y="267.0">K coil</tspan></text><path d="M460,260 L460,420" fill="none" stroke="#792db0" stroke-width="3"/><path d="M460,420 L700,420" fill="none" stroke="#792db0" stroke-width="3"/><path d="M700,420 L700,260" fill="none" stroke="#792db0" stroke-width="3"/><rect x="500" y="385" width="140" height="70" rx="8" fill="#efe3fa" stroke="#792db0" stroke-width="2"/><text font-size="19"><tspan x="510" y="427.0">K aux NO</tspan></text><text x="50" y="130" font-size="20"><tspan x="50" dy="0">+24Vapproved isolated control supply</tspan></text><text x="855" y="130" font-size="20"><tspan x="855" dy="0">0V</tspan></text><text x="65" y="600" font-size="18"><tspan x="65" dy="0">Start energises K;auxiliary contact seals around STARTonly.STOP/OLRremain in series;loss</tspan><tspan x="65" dy="23">of supply releases K.</tspan></text><text x="25" y="675" font-size="16"><tspan x="25" dy="0">Original teaching schematic;not a field wiring/clearance or live-work instruction.</tspan></text></g></svg>