<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" font-family="Arial,sans-serif"><rect width="1000" height="650" fill="white"/><text x="25" y="35" font-size="25" fill="#65248f">Power measurement:functional connections and limits</text><rect x="40" y="170" width="260" height="150" rx="8" fill="#f1e7fb" stroke="#7a48a2"/><text x="52" y="251.0" font-size="20" fill="#28202f">Approved AC source</text><rect x="450" y="150" width="430" height="190" rx="8" fill="#f1e7fb" stroke="#7a48a2"/><text x="462" y="251.0" font-size="20" fill="#28202f">Rated load + real-power meter</text><path d="M300 220L450 220" fill="none" stroke="#66358e" stroke-width="3"/><path d="M438.0 215.0L450 220L438.0 225.0" fill="none" stroke="#66358e" stroke-width="3"/><text x="50" y="400" font-size="20" fill="#28202f">Ammeter/current input:series or approved clamp;voltage input:parallel.</text><text x="50" y="450" font-size="20" fill="#28202f">Current coil and voltage coil terminals follow the exact instrument manual.</text><text x="50" y="500" font-size="20" fill="#28202f">For three-wire two-wattmeter measurement:P=W1+W2(signed readings).</text><text x="50" y="550" font-size="20" fill="#28202f">For balanced sinusoidal loads only:Q=√3(W1−W2)under declared connections.</text><text x="25" y="632" font-size="14" fill="#28202f">Original conceptual teaching figure;not measured results or a live wiring authorisation.</text></svg>