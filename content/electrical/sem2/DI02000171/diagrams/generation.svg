<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" font-family="Arial,sans-serif"><rect width="1000" height="650" fill="white"/><text x="25" y="35" font-size="25" fill="#65248f">Principle of sinusoidal EMF generation</text><rect x="60" y="190" width="120" height="160" rx="8" fill="#f1e7fb" stroke="#7a48a2"/><text x="72" y="276.0" font-size="20" fill="#28202f">N</text><rect x="820" y="190" width="120" height="160" rx="8" fill="#f1e7fb" stroke="#7a48a2"/><text x="832" y="276.0" font-size="20" fill="#28202f">S</text><path d="M190 210L800 210" fill="none" stroke="#b7a0c8" stroke-width="3"/><path d="M788.0 205.0L800 210L788.0 215.0" fill="none" stroke="#b7a0c8" stroke-width="3"/><path d="M190 270L800 270" fill="none" stroke="#b7a0c8" stroke-width="3"/><path d="M788.0 265.0L800 270L788.0 275.0" fill="none" stroke="#b7a0c8" stroke-width="3"/><path d="M190 330L800 330" fill="none" stroke="#b7a0c8" stroke-width="3"/><path d="M788.0 325.0L800 330L788.0 335.0" fill="none" stroke="#b7a0c8" stroke-width="3"/><path d="M370 180L570 230L600 370L400 320Z" fill="#f6edff" stroke="#762a9e" stroke-width="4"/><path d="M470 270L660 190" fill="none" stroke="#66358e" stroke-width="3"/><path d="M647.0000904980525 190.04850712500726L660 190L650.8806604986339 199.26486087638793" fill="none" stroke="#66358e" stroke-width="3"/><text x="660" y="180" font-size="20" fill="#28202f">coil normal n</text><text x="370" y="145" font-size="20" fill="#28202f">rotating coil:ω</text><text x="50" y="440" font-size="20" fill="#28202f">Flux linkage=N B A cosθ;emf=−d(flux linkage)/dt=N B A ω sinθ.</text><text x="50" y="485" font-size="20" fill="#28202f">Normal parallel to B:maximum flux,zero emf;quarter turn:maximum emf.</text><text x="50" y="530" font-size="20" fill="#28202f">A rotating-coil AC model uses slip rings/brushes,not a split-ring commutator.</text><text x="25" y="632" font-size="14" fill="#28202f">Original conceptual teaching figure;not measured results or a live wiring authorisation.</text></svg>