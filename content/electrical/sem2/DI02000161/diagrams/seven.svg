<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" font-family="Arial,sans-serif"><rect width="980" height="640" fill="white"/><text x="25" y="32" font-size="23">BCD to seven segment:identify segments before wiring</text><rect x="380" y="100" width="160" height="15" fill="#7637a7"/><text x="552" y="115" font-size="18">a</text><rect x="540" y="115" width="15" height="140" fill="#7637a7"/><text x="567" y="130" font-size="18">b</text><rect x="540" y="275" width="15" height="140" fill="#ddd"/><text x="567" y="290" font-size="18">c</text><rect x="380" y="415" width="160" height="15" fill="#7637a7"/><text x="552" y="430" font-size="18">d</text><rect x="365" y="275" width="15" height="140" fill="#7637a7"/><text x="392" y="290" font-size="18">e</text><rect x="365" y="115" width="15" height="140" fill="#ddd"/><text x="392" y="130" font-size="18">f</text><rect x="380" y="255" width="160" height="15" fill="#7637a7"/><text x="552" y="270" font-size="18">g</text><text x="60" y="490" font-size="18">Example digit2:segments a,b,d,e,g ON;c,f OFF.</text><text x="60" y="530" font-size="18">Common anode uses low-side segment drive;one resistor per segment.</text><text x="25" y="622" font-size="14">Original conceptual diagram;crossed wires join only at dots;not a tested physical circuit.</text></svg>