<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" font-family="Arial,sans-serif"><rect width="980" height="640" fill="white"/><text x="25" y="32" font-size="23">Low-voltage digital logic practical setup</text><rect x="60" y="120" width="280" height="110" rx="6" fill="#f0e6fa" stroke="#7637a7"/><text x="70" y="181.0" font-size="18">Regulated logic supply</text><path d="M340 170H415.0V170H490" fill="none" stroke="#69368a" stroke-width="1.7"/><rect x="490" y="120" width="370" height="110" rx="6" fill="#f0e6fa" stroke="#7637a7"/><text x="500" y="181.0" font-size="18">IC VCC/GND + local decoupling</text><text x="60" y="300" font-size="18">9V battery → appropriate regulator → specified logic supply;NEVER 9V to LS TTL.</text><text x="60" y="350" font-size="18">Input switches need defined HIGH/LOW;output LEDs need current limiting.</text><text x="60" y="400" font-size="18">Check exact suffix/package datasheet;absolute maximum is not operating voltage.</text><text x="25" y="622" font-size="14">Original conceptual diagram;crossed wires join only at dots;not a tested physical circuit.</text></svg>