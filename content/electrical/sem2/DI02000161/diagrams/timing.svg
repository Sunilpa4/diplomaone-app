<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" font-family="Arial,sans-serif"><rect width="980" height="640" fill="white"/><text x="25" y="32" font-size="23">D flip-flop:sample at an edge,not continuously</text><text x="50" y="65" font-size="18">CLK</text><path d="M80 150H200V90H320V150H440V90H560V150H680" stroke="#7637a7" fill="none" stroke-width="3"/><text x="50" y="165" font-size="18">D</text><path d="M80 250H260V200H500V250H680" stroke="#7637a7" fill="none" stroke-width="3"/><text x="50" y="265" font-size="18">Q (rising edge)</text><path d="M80 350H440V300H680" stroke="#7637a7" fill="none" stroke-width="3"/><text x="60" y="470" font-size="18">D=0 at first rising edge;D=1 at second;Q changes only after active edges.</text><text x="60" y="510" font-size="18">Conceptual timing;real propagation delay/setup/hold are not to scale.</text><text x="25" y="622" font-size="14">Original conceptual diagram;crossed wires join only at dots;not a tested physical circuit.</text></svg>