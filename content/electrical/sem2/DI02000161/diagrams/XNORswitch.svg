<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" font-family="Arial,sans-serif"><rect width="980" height="640" fill="white"/><text x="25" y="32" font-size="23">XNOR — equivalent series/parallel contact logic</text><text x="30" y="90" font-size="18">A/B=1actuates its contact.NO closes at1;NC opens at1.</text><text x="30" y="125" font-size="18">Conceptual conduction model:complete path means output1,open means0.</text><path d="M70 230H125.0V230H180" fill="none" stroke="#69368a" stroke-width="1.7"/><rect x="180" y="202" width="170" height="56" rx="6" fill="#f0e6fa" stroke="#7637a7"/><text x="190" y="236.0" font-size="18">A NO</text><path d="M350 230H385.0V230H420" fill="none" stroke="#69368a" stroke-width="1.7"/><rect x="420" y="202" width="170" height="56" rx="6" fill="#f0e6fa" stroke="#7637a7"/><text x="430" y="236.0" font-size="18">B NO</text><path d="M590 230H625.0V230H660" fill="none" stroke="#69368a" stroke-width="1.7"/><path d="M660 230H730.0V230H800" fill="none" stroke="#69368a" stroke-width="1.7"/><path d="M70 355H125.0V355H180" fill="none" stroke="#69368a" stroke-width="1.7"/><rect x="180" y="327" width="170" height="56" rx="6" fill="#f0e6fa" stroke="#7637a7"/><text x="190" y="361.0" font-size="18">A NC</text><path d="M350 355H385.0V355H420" fill="none" stroke="#69368a" stroke-width="1.7"/><rect x="420" y="327" width="170" height="56" rx="6" fill="#f0e6fa" stroke="#7637a7"/><text x="430" y="361.0" font-size="18">B NC</text><path d="M590 355H625.0V355H660" fill="none" stroke="#69368a" stroke-width="1.7"/><path d="M660 355H730.0V355H800" fill="none" stroke="#69368a" stroke-width="1.7"/><path d="M70 230V355M800 230V355" fill="none" stroke="#7637a7" stroke-width="3"/><text x="30" y="470" font-size="18">For NAND/NOR/XOR/XNOR,contact arrangement implements the full function.</text><text x="30" y="515" font-size="18">Equivalent logic only;not a mains circuit or literal transistor-level IC schematic.</text><text x="25" y="622" font-size="14">Original conceptual diagram;crossed wires join only at dots;not a tested physical circuit.</text></svg>