<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7452a4"/></marker></defs><rect width="1100" height="620" fill="#faf7ff"/><text x="30" y="45" fill="#392a4b" font-family="DejaVu Sans,Arial,sans-serif" font-size="27">Evaporation—streams and balance</text><text x="30" y="80" fill="#392a4b" font-family="DejaVu Sans,Arial,sans-serif" font-size="17">Conceptual material-flow schematic • not a construction/control drawing</text><rect x="410" y="220" width="280" height="230" rx="6" fill="#d8eff1" stroke="#7452a4" stroke-width="3"/><path d="M80 310L405 310" fill="none" stroke="#7452a4" stroke-width="3" marker-end="url(#a)"/><text x="100" y="275" fill="#392a4b" font-family="DejaVu Sans,Arial,sans-serif" font-size="21">Feed F,xF</text><path d="M550 220L550 130" fill="none" stroke="#7452a4" stroke-width="3" marker-end="url(#a)"/><text x="640" y="165" fill="#392a4b" font-family="DejaVu Sans,Arial,sans-serif" font-size="21">Solvent vapour V</text><path d="M695 420L990 420" fill="none" stroke="#7452a4" stroke-width="3" marker-end="url(#a)"/><text x="760" y="465" fill="#392a4b" font-family="DejaVu Sans,Arial,sans-serif" font-size="21">Concentrate L,xL</text><text x="50" y="540" fill="#392a4b" font-family="DejaVu Sans,Arial,sans-serif" font-size="23">F=L+V;FxF=LxL for a nonvolatile solute</text><text x="50" y="590" fill="#392a4b" font-family="DejaVu Sans,Arial,sans-serif" font-size="17">Heating utility is outside this process-material balance;no entrainment assumed.</text></svg>