<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7452a4"/></marker></defs><rect width="1100" height="620" fill="#faf7ff"/><text x="30" y="45" fill="#392a4b" font-family="DejaVu Sans,Arial,sans-serif" font-size="27">Liquid–liquid extraction—streams and balance</text><text x="30" y="80" fill="#392a4b" font-family="DejaVu Sans,Arial,sans-serif" font-size="17">Conceptual material-flow schematic • not a construction/control drawing</text><rect x="410" y="220" width="280" height="230" rx="6" fill="#d8eff1" stroke="#7452a4" stroke-width="3"/><path d="M80 280L405 280" fill="none" stroke="#7452a4" stroke-width="3" marker-end="url(#a)"/><text x="100" y="245" fill="#392a4b" font-family="DejaVu Sans,Arial,sans-serif" font-size="21">Feed F,zF</text><path d="M550 130L550 215" fill="none" stroke="#7452a4" stroke-width="3" marker-end="url(#a)"/><text x="640" y="175" fill="#392a4b" font-family="DejaVu Sans,Arial,sans-serif" font-size="21">Solvent S,zS</text><path d="M695 275L990 275" fill="none" stroke="#7452a4" stroke-width="3" marker-end="url(#a)"/><text x="760" y="240" fill="#392a4b" font-family="DejaVu Sans,Arial,sans-serif" font-size="21">Extract E,xE</text><path d="M695 420L990 420" fill="none" stroke="#7452a4" stroke-width="3" marker-end="url(#a)"/><text x="740" y="465" fill="#392a4b" font-family="DejaVu Sans,Arial,sans-serif" font-size="21">Raffinate R,xR</text><text x="50" y="540" fill="#392a4b" font-family="DejaVu Sans,Arial,sans-serif" font-size="23">F+S=E+R;FzF+SzS=ExE+RxR</text><text x="50" y="590" fill="#392a4b" font-family="DejaVu Sans,Arial,sans-serif" font-size="17">Extract and raffinate are liquid phases,not automatically pure components.</text></svg>