<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7452a4"/></marker></defs><rect width="1100" height="620" fill="#faf7ff"/><text x="30" y="45" fill="#392a4b" font-family="DejaVu Sans,Arial,sans-serif" font-size="27">Boyle relation for fixed amount at constant absolute temperature</text><text x="30" y="80" fill="#392a4b" font-family="DejaVu Sans,Arial,sans-serif" font-size="17">Conceptual material-flow schematic • not a construction/control drawing</text><rect x="130" y="180" width="300" height="280" rx="6" fill="#b9e6e7" stroke="#7452a4" stroke-width="3"/><rect x="650" y="320" width="300" height="140" rx="6" fill="#b9e6e7" stroke="#7452a4" stroke-width="3"/><path d="M130 180L430 180" fill="none" stroke="#7452a4" stroke-width="3"/><path d="M650 320L950 320" fill="none" stroke="#7452a4" stroke-width="3"/><text x="190" y="290" fill="#392a4b" font-family="DejaVu Sans,Arial,sans-serif" font-size="21">P1,V1</text><text x="700" y="390" fill="#392a4b" font-family="DejaVu Sans,Arial,sans-serif" font-size="21">P2=2P1</text><text x="700" y="430" fill="#392a4b" font-family="DejaVu Sans,Arial,sans-serif" font-size="21">V2=V1/2</text><path d="M465 330L615 330" fill="none" stroke="#7452a4" stroke-width="3" marker-end="url(#a)"/><text x="50" y="540" fill="#392a4b" font-family="DejaVu Sans,Arial,sans-serif" font-size="23">P1V1=P2V2 at fixed n,T</text><text x="50" y="590" fill="#392a4b" font-family="DejaVu Sans,Arial,sans-serif" font-size="17">Compression picture shows volume change;absolute pressure and Kelvin temperature are required.</text></svg>