<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7452a4"/></marker></defs><rect width="1100" height="620" fill="#faf7ff"/><text x="30" y="45" fill="#392a4b" font-family="DejaVu Sans,Arial,sans-serif" font-size="27">Mixing—streams and balance</text><text x="30" y="80" fill="#392a4b" font-family="DejaVu Sans,Arial,sans-serif" font-size="17">Conceptual material-flow schematic • not a construction/control drawing</text><rect x="410" y="220" width="280" height="230" rx="6" fill="#d8eff1" stroke="#7452a4" stroke-width="3"/><path d="M80 265L405 265" fill="none" stroke="#7452a4" stroke-width="3" marker-end="url(#a)"/><text x="100" y="230" fill="#392a4b" font-family="DejaVu Sans,Arial,sans-serif" font-size="21">F1,x1</text><path d="M80 400L405 400" fill="none" stroke="#7452a4" stroke-width="3" marker-end="url(#a)"/><text x="100" y="440" fill="#392a4b" font-family="DejaVu Sans,Arial,sans-serif" font-size="21">F2,x2</text><path d="M695 330L990 330" fill="none" stroke="#7452a4" stroke-width="3" marker-end="url(#a)"/><text x="820" y="300" fill="#392a4b" font-family="DejaVu Sans,Arial,sans-serif" font-size="21">Product P,xP</text><path d="M550 160L550 360" fill="none" stroke="#7452a4" stroke-width="3"/><path d="M490 350L610 350" fill="none" stroke="#7452a4" stroke-width="3"/><text x="50" y="540" fill="#392a4b" font-family="DejaVu Sans,Arial,sans-serif" font-size="23">F1+F2=P;F1x1+F2x2=PxP</text><text x="50" y="590" fill="#392a4b" font-family="DejaVu Sans,Arial,sans-serif" font-size="17">All x values are consistent mass fractions;liquid volumes need not be additive.</text></svg>