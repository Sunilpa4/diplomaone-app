<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7452a4"/></marker></defs><rect width="1100" height="620" fill="#faf7ff"/><text x="30" y="45" fill="#392a4b" font-family="DejaVu Sans,Arial,sans-serif" font-size="27">Composition basis:20g solute plus80g solvent</text><text x="30" y="80" fill="#392a4b" font-family="DejaVu Sans,Arial,sans-serif" font-size="17">Conceptual material-flow schematic • not a construction/control drawing</text><rect x="180" y="190" width="200" height="240" rx="6" fill="#b9e6e7" stroke="#7452a4" stroke-width="3"/><rect x="380" y="190" width="500" height="240" rx="6" fill="#e6daf3" stroke="#7452a4" stroke-width="3"/><text x="210" y="285" fill="#392a4b" font-family="DejaVu Sans,Arial,sans-serif" font-size="21">Solute20g</text><text x="530" y="285" fill="#392a4b" font-family="DejaVu Sans,Arial,sans-serif" font-size="21">Solvent80g</text><text x="370" y="470" fill="#392a4b" font-family="DejaVu Sans,Arial,sans-serif" font-size="21">Total solution100g</text><text x="50" y="540" fill="#392a4b" font-family="DejaVu Sans,Arial,sans-serif" font-size="23">Mass fraction=20/100=0.20;solute/solvent ratio=20/80=0.25</text><text x="50" y="590" fill="#392a4b" font-family="DejaVu Sans,Arial,sans-serif" font-size="17">Mass fraction and solute/solvent ratio use different denominators.</text></svg>