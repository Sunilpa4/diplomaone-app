<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7452a4"/></marker></defs><style>text{font-family:DejaVu Sans,Arial,sans-serif;font-size:19px;fill:#392a4b}.small{font-size:16px}</style><rect width="1100" height="650" fill="#faf7ff"/><text x="30" y="40" style="font-size:25px">Particle density versus bulk density</text><text x="30" y="75" style="font-size:16px">Conceptual study schematic • not to scale • not an operating/control drawing</text><text x="30" y="630" style="font-size:15px">Follow the numbered parts and Working steps in Notes. Guards/controls are simplified.</text><rect x="130" y="180" width="370" height="350" rx="4" fill="#faf7ff" stroke="#7452a4" stroke-width="3"/><circle cx="180" cy="250" r="38" fill="#b9e6e7" stroke="#7452a4" stroke-width="3"/><circle cx="300" cy="240" r="38" fill="#b9e6e7" stroke="#7452a4" stroke-width="3"/><circle cx="410" cy="260" r="38" fill="#b9e6e7" stroke="#7452a4" stroke-width="3"/><circle cx="240" cy="350" r="38" fill="#b9e6e7" stroke="#7452a4" stroke-width="3"/><circle cx="370" cy="360" r="38" fill="#b9e6e7" stroke="#7452a4" stroke-width="3"/><circle cx="190" cy="440" r="38" fill="#b9e6e7" stroke="#7452a4" stroke-width="3"/><circle cx="440" cy="450" r="38" fill="#b9e6e7" stroke="#7452a4" stroke-width="3"/><path d="M510 185L510 525" fill="none" stroke="#7452a4" stroke-width="3"/><text x="550" y="250" style="font-size:19px">Bulk volume includes voids</text><text x="550" y="320" style="font-size:19px">Particle volume excludes</text><text x="550" y="355" style="font-size:19px">spaces between particles</text><text x="550" y="430" style="font-size:19px">ε=1−ρb/ρp (same basis)</text></svg>