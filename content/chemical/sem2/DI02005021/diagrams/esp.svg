<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7452a4"/></marker></defs><style>text{font-family:DejaVu Sans,Arial,sans-serif;font-size:19px;fill:#392a4b}.small{font-size:16px}</style><rect width="1100" height="650" fill="#faf7ff"/><text x="30" y="40" style="font-size:25px">Electrostatic precipitator: gas–solid</text><text x="30" y="75" style="font-size:16px">Conceptual study schematic • not to scale • not an operating/control drawing</text><text x="30" y="630" style="font-size:15px">Follow the numbered parts and Working steps in Notes. Guards/controls are simplified.</text><path d="M710 110L710 585" fill="none" stroke="#d8cbe8" stroke-width="3"/><text x="735" y="140" style="font-size:17px">1. Gas distributor</text><text x="735" y="213" style="font-size:17px">2. Discharge electrodes</text><text x="735" y="286" style="font-size:17px">3. Collecting plates</text><text x="735" y="359" style="font-size:17px">4. Enclosed high voltage</text><text x="735" y="432" style="font-size:17px">5. Cleaning/dust hopper</text><text x="735" y="505" style="font-size:17px">6. Clean gas</text><rect x="145" y="210" width="430" height="240" rx="4" fill="#faf7ff" stroke="#7452a4" stroke-width="3"/><path d="M220 235L220 430" fill="none" stroke="#7452a4" stroke-width="3"/><path d="M340 235L340 430" fill="none" stroke="#7452a4" stroke-width="3"/><path d="M460 235L460 430" fill="none" stroke="#7452a4" stroke-width="3"/><path d="M280 240L280 425" fill="none" stroke="#7452a4" stroke-width="3"/><text x="275" y="330" style="font-size:20px">−</text><path d="M400 240L400 425" fill="none" stroke="#7452a4" stroke-width="3"/><text x="395" y="330" style="font-size:20px">−</text><path d="M65 300L140 300" fill="none" stroke="#7452a4" stroke-width="3" marker-end="url(#ar)"/><path d="M580 300L665 300" fill="none" stroke="#7452a4" stroke-width="3" marker