<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7452a4"/></marker></defs><style>text{font-family:DejaVu Sans,Arial,sans-serif;font-size:19px;fill:#392a4b}.small{font-size:16px}</style><rect width="1100" height="650" fill="#faf7ff"/><text x="30" y="40" style="font-size:25px">Jaw crusher</text><text x="30" y="75" style="font-size:16px">Conceptual study schematic • not to scale • not an operating/control drawing</text><text x="30" y="630" style="font-size:15px">Follow the numbered parts and Working steps in Notes. Guards/controls are simplified.</text><path d="M710 110L710 585" fill="none" stroke="#d8cbe8" stroke-width="3"/><text x="735" y="140" style="font-size:17px">1. Frame</text><text x="735" y="213" style="font-size:17px">2. Fixed jaw/liner</text><text x="735" y="286" style="font-size:17px">3. Moving jaw</text><text x="735" y="359" style="font-size:17px">4. Eccentric drive</text><text x="735" y="432" style="font-size:17px">5. Toggle/support</text><text x="735" y="505" style="font-size:17px">6. Discharge gap</text><path d="M160 190L210 190L320 505L280 505Z" fill="#b9e6e7" stroke="#7452a4" stroke-width="3"/><path d="M500 190L540 210L400 505L355 505Z" fill="#e6a8bd" stroke="#7452a4" stroke-width="3"/><rect x="120" y="520" width="180" height="30" rx="4" fill="#e6daf3" stroke="#7452a4" stroke-width="3"/><rect x="420" y="520" width="180" height="30" rx="4" fill="#e6daf3" stroke="#7452a4" stroke-width="3"/><path d="M160 190L120 520" fill="none" stroke="#7452a4" stroke-width="3"/><circle cx="550" cy="220" r="40" fill="#b9e6e7" stroke="#7452a4" stroke-width="3"/><path d="M510 220L480 260" fill="none" stroke="#7452a4" stroke-width="3"/><path d="M435 410L590 470" fill="none" stroke="#7452a4" stroke-width="3"/><path d="M590 470L590 520" fill="none" stroke="#7452a4" stroke-width="3"/><path d="M340 140L340 215" fill="none