<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7452a4"/></marker></defs><style>text{font-family:DejaVu Sans,Arial,sans-serif;font-size:19px;fill:#392a4b}.small{font-size:16px}</style><rect width="1100" height="650" fill="#faf7ff"/><text x="30" y="40" style="font-size:25px">Gas–solid cyclone</text><text x="30" y="75" style="font-size:16px">Conceptual study schematic • not to scale • not an operating/control drawing</text><text x="30" y="630" style="font-size:15px">Follow the numbered parts and Working steps in Notes. Guards/controls are simplified.</text><path d="M710 110L710 585" fill="none" stroke="#d8cbe8" stroke-width="3"/><text x="735" y="140" style="font-size:17px">1. Tangential dirty gas</text><text x="735" y="213" style="font-size:17px">2. Cylindrical barrel</text><text x="735" y="286" style="font-size:17px">3. Cone</text><text x="735" y="359" style="font-size:17px">4. Vortex finder/clean gas</text><text x="735" y="432" style="font-size:17px">5. Sealed dust receiver</text><text x="735" y="505" style="font-size:17px">6. Enclosed ducts/support</text><path d="M240 200L520 200L520 370L380 510L240 370Z" fill="#e6daf3" stroke="#7452a4" stroke-width="3"/><rect x="350" y="135" width="60" height="170" rx="4" fill="#faf7ff" stroke="#7452a4" stroke-width="3"/><path d="M80 235L240 235" fill="none" stroke="#7452a4" stroke-width="3" marker-end="url(#ar)"/><path d="M480 250Q550 330 440 400L410 440" fill="none" stroke="#7452a4" stroke-width="3" marker-end="url(#ar)"/><path d="M380 450L380 320" fill="none" stroke="#7452a4" stroke-width="3" marker-end="url(#ar)"/><path d="M380 135L380 95" fill="none" stroke="#7452a4" stroke-width="3" marker-end="url(#ar)"/><rect x="325" y="540" width="110" height="40" rx="4" fill="#ded1b9" stroke="#7452a4" stroke-width="3"/><path d="M380 510L380 540" fill="none" stroke="#7452a4" stroke-