<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7452a4"/></marker></defs><style>text{font-family:DejaVu Sans,Arial,sans-serif;font-size:19px;fill:#392a4b}.small{font-size:16px}</style><rect width="1100" height="650" fill="#faf7ff"/><text x="30" y="40" style="font-size:25px">Pneumatic conveying: enclosed concept</text><text x="30" y="75" style="font-size:16px">Conceptual study schematic • not to scale • not an operating/control drawing</text><text x="30" y="630" style="font-size:15px">Follow the numbered parts and Working steps in Notes. Guards/controls are simplified.</text><path d="M710 110L710 585" fill="none" stroke="#d8cbe8" stroke-width="3"/><text x="735" y="140" style="font-size:17px">1. Gas source</text><text x="735" y="213" style="font-size:17px">2. Controlled feeder</text><text x="735" y="286" style="font-size:17px">3. Pipeline</text><text x="735" y="359" style="font-size:17px">4. Receiver/separator</text><text x="735" y="432" style="font-size:17px">5. Final gas filter</text><text x="735" y="505" style="font-size:17px">6. Solid discharge</text><rect x="90" y="390" width="100" height="85" rx="4" fill="#e6daf3" stroke="#7452a4" stroke-width="3"/><circle cx="140" cy="430" r="30" fill="#b9e6e7" stroke="#7452a4" stroke-width="3"/><path d="M260 150L380 150L340 260L300 260Z" fill="#eee4ce" stroke="#7452a4" stroke-width="3"/><circle cx="320" cy="290" r="30" fill="#b9e6e7" stroke="#7452a4" stroke-width="3"/><path d="M190 430L420 430" fill="none" stroke="#7452a4" stroke-width="3"/><path d="M320 320L320 430" fill="none" stroke="#7452a4" stroke-width="3"/><path d="M420 430L470 430L470 220L520 220" fill="none" stroke="#7452a4" stroke-width="3" marker-end="url(#ar)"/><path d="M525 170L640 170L640 380L580 455L525 380Z" fill="#d8eff1" stroke="#7452a4" stroke-width="3"/><rect x="545" y="100" width="70" height="70" rx=