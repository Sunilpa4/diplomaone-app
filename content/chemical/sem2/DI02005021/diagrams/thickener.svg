<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7452a4"/></marker></defs><style>text{font-family:DejaVu Sans,Arial,sans-serif;font-size:19px;fill:#392a4b}.small{font-size:16px}</style><rect width="1100" height="650" fill="#faf7ff"/><text x="30" y="40" style="font-size:25px">Gravity thickener</text><text x="30" y="75" style="font-size:16px">Conceptual study schematic • not to scale • not an operating/control drawing</text><text x="30" y="630" style="font-size:15px">Follow the numbered parts and Working steps in Notes. Guards/controls are simplified.</text><path d="M710 110L710 585" fill="none" stroke="#d8cbe8" stroke-width="3"/><text x="735" y="140" style="font-size:17px">1. Feedwell/tank</text><text x="735" y="213" style="font-size:17px">2. Overflow weir</text><text x="735" y="286" style="font-size:17px">3. Slow rake</text><text x="735" y="359" style="font-size:17px">4. Solids bed/base</text><text x="735" y="432" style="font-size:17px">5. Underflow</text><text x="735" y="505" style="font-size:17px">6. Drive/torque control</text><path d="M130 230L620 230L620 430L400 520L130 430Z" fill="#d8eff1" stroke="#7452a4" stroke-width="3"/><rect x="315" y="180" width="130" height="130" rx="4" fill="#faf7ff" stroke="#7452a4" stroke-width="3"/><path d="M80 250L315 250" fill="none" stroke="#7452a4" stroke-width="3" marker-end="url(#ar)"/><path d="M340 250L340 290" fill="none" stroke="#7452a4" stroke-width="3" marker-end="url(#ar)"/><path d="M380 150L380 340" fill="none" stroke="#7452a4" stroke-width="3"/><path d="M380 150L465 150" fill="none" stroke="#7452a4" stroke-width="3"/><path d="M130 430L400 520L620 430L620 410L130 410Z" fill="#d7c7ac" stroke="#7452a4" stroke-width="3"/><path d="M380 340L380 475" fill="none" stroke="#7452a4" stroke-width="3"/><path d="M230 450L530 450" fill="none" stroke="#7452a4" stroke-width="3"/><p