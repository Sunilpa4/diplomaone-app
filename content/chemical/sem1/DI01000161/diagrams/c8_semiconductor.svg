<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="100%" style="max-width:760px;height:auto;display:block;margin:0 auto;background:#ffffff" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><text x="380" y="26" style="font-size:13px;fill:#334155;text-anchor:middle;font-weight:700">BAND STRUCTURE OF A SEMICONDUCTOR AND ITS DOPING</text><path d="M 40 250 L 250 250 L 250 274 L 40 274 Z" fill="#bae6fd" stroke="#0ea5e9" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><path d="M 40 154 L 250 154 L 250 178 L 40 178 Z" fill="#f0f9ff" stroke="#0891b2" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="145" y="136" style="font-size:8.2px;fill:#0891b2;text-anchor:middle">conduction band</text><text x="145" y="298" style="font-size:8.2px;fill:#0891b2;text-anchor:middle">valence band</text><text x="145" y="222" style="font-size:8.6px;fill:#334155;text-anchor:middle;font-weight:700">gap 1.1 eV</text><text x="145" y="322" style="font-size:9.0px;fill:#0891b2;text-anchor:middle;font-weight:700">Intrinsic — pure Si</text><text x="145" y="342" style="font-size:7.6px;fill:#475569;text-anchor:middle">1.1 eV gap in pure silicon</text><text x="145" y="358" style="font-size:7.6px;fill:#475569;text-anchor:middle">only a few electron–hole pairs</text><path d="M 280 250 L 490 250 L 490 274 L 280 274 Z" fill="#bae6fd" stroke="#0ea5e9" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><path d="M 280 154 L 490 154 L 490 178 L 280 178 Z" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="385" y="136" style="font-size:8.2px;fill:#1d4ed8;text-anchor:middle">conduction band</text><text x="385" y="298" style="font-size:8.2px;fill:#1d4ed8;text-anchor:middle">valence band</text><text x="385" y="222" style="font-size:8.6px;fill:#334155;text-anchor:middle;font-weight:700">gap 1.1 eV</text><line x1="310" y1="196" x2="460" y2="196" stroke="#b45309" stroke-width="2.0" stroke-linecap="round"/><text x="385" y="322" style="font-size:9.0px;fill:#1d4ed8;text-anchor:middle;font-weight:700">n-type — doped with P or As</text><text x="385" y="342" style="font-size:7.6px;fill:#475569;text-anchor:middle">donor level just below the band</text><text x="385" y="358" style="font-size:7.6px;fill:#475569;text-anchor:middle">extra free electrons carry the current</text><path d="M 520 250 L 730 250 L 730 274 L 520 274 Z" fill="#bae6fd" stroke="#0ea5e9" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><path d="M 520 154 L 730 154 L 730 178 L 520 178 Z" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="625" y="136" style="font-size:8.2px;fill:#b91c1c;text-anchor:middle">conduction band</text><text x="625" y="298" style="font-size:8.2px;fill:#b91c1c;text-anchor:middle">valence band</text><text x="625" y="222" style="font-size:8.6px;fill:#334155;text-anchor:middle;font-weight:700">gap 1.1 eV</text><line x1="550" y1="148" x2="700" y2="148" stroke="#b45309" stroke-width="2.0" stroke-linecap="round"/><text x="625" y="322" style="font-size:9.0px;fill:#b91c1c;text-anchor:middle;font-weight:700">p-type — doped with B or Al</text><text x="625" y="342" style="font-size:7.6px;fill:#475569;text-anchor:middle">acceptor level just above the band</text><text x="625" y="358" style="font-size:7.6px;fill:#475569;text-anchor:middle">holes carry the current</text><text x="380" y="66" style="font-size:9.6px;fill:#334155;text-anchor:middle">Semiconductors conduct only a little — by electrons and by holes</text><text x="380" y="86" style="font-size:8.4px;fill:#475569;text-anchor:middle">Silicon and germanium are group IV; each atom has four valence electrons and shares all four, so the crystal is an insulator at 0 K.</text><path d="M 40 386 L 720 386 L 720 414 L 40 414 Z" fill="#fbfaff" stroke="#ddd6fe" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="380" y="406" style="font-size:8.8px;fill:#7c3aed;text-anchor:middle">Applications: diodes and rectifiers, transistors, LEDs, solar cells, photocells, integrated circuits and thermistors.</text></svg>