<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="100%" style="max-width:760px;height:auto;display:block;margin:0 auto;background:#ffffff" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><text x="380" y="26" style="font-size:13px;fill:#334155;text-anchor:middle;font-weight:700">ZEOLITE (PERMUTIT) SOFTENER AND ITS REGENERATION</text><path d="M 300 70 L 430 70 L 430 330 L 300 330 Z" fill="#f1f5f9" stroke="#111827" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M 306 120 L 424 120 L 424 300 L 306 300 Z" fill="#dcfce7" stroke="#cbd5e1" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="365" y="210" style="font-size:9.6px;fill:#047857;text-anchor:middle;font-weight:700">zeolite bed</text><text x="365" y="228" style="font-size:8.8px;fill:#475569;text-anchor:middle">Na₂O·Al₂O₃·xSiO₂</text><line x1="365" y1="40" x2="365" y2="70" stroke="#111827" stroke-width="2.0" stroke-linecap="round"/><text x="365" y="52" style="font-size:8.6px;fill:#1d4ed8;text-anchor:middle;font-weight:700">hard water in</text><line x1="365" y1="330" x2="365" y2="370" stroke="#111827" stroke-width="2.0" stroke-linecap="round"/><text x="365" y="386" style="font-size:8.6px;fill:#047857;text-anchor:middle;font-weight:700">soft water out</text><line x1="430" y1="200" x2="520" y2="200" stroke="#111827" stroke-width="1.4" stroke-linecap="round"/><line x1="452" y1="200" x2="464" y2="200" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/><path d="M 470 200 L 464 202.7 L 464 197.3 Z" fill="#94a3b8"/><text x="526" y="196" style="font-size:8.8px;fill:#334155;text-anchor:start;font-weight:700">exchange</text><text x="526" y="212" style="font-size:8.4px;fill:#475569;text-anchor:start">Ca²⁺ / Mg²⁺ held,</text><text x="526" y="226" style="font-size:8.4px;fill:#475569;text-anchor:start">Na⁺ released</text><path d="M 30 300 L 270 300 L 270 416 L 30 416 Z" fill="#fff8f1" stroke="#fdba74" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="150" y="320" style="font-size:9.6px;fill:#b45309;text-anchor:middle;font-weight:700">Regeneration</text><text x="150" y="340" style="font-size:8.4px;fill:#475569;text-anchor:middle">10 % NaCl brine, 30–60 min</text><text x="150" y="358" style="font-size:8.6px;fill:#334155;text-anchor:middle">CaZ + 2NaCl → Na₂Z + CaCl₂</text><text x="150" y="376" style="font-size:8.4px;fill:#475569;text-anchor:middle">then rinse with soft water</text><text x="150" y="398" style="font-size:8.4px;fill:#b45309;text-anchor:middle;font-weight:700">the bed is used again — for years</text><path d="M 430 40 L 730 40 L 730 290 L 430 290 Z" fill="#fbfcff" stroke="#e6e1f4" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="448" y="60" style="font-size:9.4px;fill:#334155;text-anchor:start;font-weight:700">Exchange reactions</text><text x="448" y="84" style="font-size:8.6px;fill:#334155;text-anchor:start">Ca(HCO₃)₂ + Na₂Z → CaZ + 2NaHCO₃</text><text x="448" y="101" style="font-size:8.6px;fill:#334155;text-anchor:start">Mg(HCO₃)₂ + Na₂Z → MgZ + 2NaHCO₃</text><text x="448" y="118" style="font-size:8.6px;fill:#334155;text-anchor:start">CaSO₄ + Na₂Z → CaZ + Na₂SO₄</text><text x="448" y="135" style="font-size:8.6px;fill:#334155;text-anchor:start">CaCl₂ + Na₂Z → CaZ + 2NaCl</text><text x="448" y="152" style="font-size:8.6px;fill:#334155;text-anchor:start"></text><text x="448" y="169" style="font-size:8.6px;fill:#475569;text-anchor:start">Result: hardness → 0 ppm,</text><text x="448" y="186" style="font-size:8.6px;fill:#475569;text-anchor:start">but total dissolved solids</text><text x="448" y="203" style="font-size:8.6px;fill:#475569;text-anchor:start">increase slightly (Na salts).</text><text x="448" y="220" style="font-size:8.6px;fill:#475569;text-anchor:start"></text><text x="448" y="237" style="font-size:8.6px;fill:#475569;text-anchor:start">Cannot be used for boiler feed</text><text x="448" y="254" style="font-size:8.6px;fill:#475569;text-anchor:start">at high pressure: NaHCO₃ gives</text><text x="448" y="271" style="font-size:8.6px;fill:#475569;text-anchor:start">CO₂ and caustic in the boiler.</text></svg>