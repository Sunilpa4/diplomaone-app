<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" style="max-width:760px;height:auto;display:block;margin:0 auto;background:#ffffff" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><text x="380" y="26" style="font-size:13px;fill:#334155;text-anchor:middle;font-weight:700">STANDARD HYDROGEN ELECTRODE (SHE) — THE ZERO OF THE POTENTIAL SCALE</text><path d="M 110 176 L 110 346 L 320 346 L 320 176" fill="none" stroke="#111827" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><path d="M 110 176 L 104 172" fill="none" stroke="#111827" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><path d="M 320 176 L 326 172" fill="none" stroke="#111827" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><path d="M 110 223.6 L 320 223.6 L 320 346 L 110 346 Z" fill="#dbeafe" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round"/><line x1="110" y1="223.6" x2="320" y2="223.6" stroke="#0891b2" stroke-width="1.6" stroke-linecap="round"/><text x="215" y="366" style="font-size:10.5px;fill:#475569;text-anchor:middle">1 M H⁺ (H₃O⁺) solution</text><path d="M 206 150 L 224 150 L 224 316 L 206 316 Z" fill="#cbd5e1" stroke="#111827" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><text x="240" y="320" style="font-size:9.5px;fill:#475569;text-anchor:start">platinised Pt foil</text><path d="M 150 62 L 150 196" fill="none" stroke="#111827" stroke-width="3.0" stroke-linejoin="round" stroke-linecap="round"/><path d="M 150 196 L 206 250" fill="none" stroke="#111827" stroke-width="3.0" stroke-linejoin="round" stroke-linecap="round"/><text x="150" y="50" style="font-size:10.5px;fill:#047857;text-anchor:middle;font-weight:700">H₂ gas, 1 atm</text><circle cx="196" cy="236" r="4.5" fill="#dcfce7" stroke="#047857" stroke-width="1.2"/><circle cx="188" cy="262" r="4" fill="#dcfce7" stroke="#047857" stroke-width="1.2"/><circle cx="206" cy="288" r="4.5" fill="#dcfce7" stroke="#047857" stroke-width="1.2"/><circle cx="194" cy="300" r="3.6" fill="#dcfce7" stroke="#047857" stroke-width="1.2"/><text x="150" y="300" style="font-size:9.5px;fill:#047857;text-anchor:middle">bubbles of H₂</text><text x="232" y="170" style="font-size:10.5px;fill:#111827;text-anchor:start;font-weight:700">H₂ ⇌ 2H⁺ + 2e⁻</text><path d="M 215 150 L 215 112 L 392 112" fill="none" stroke="#111827" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="300" y="104" style="font-size:10px;fill:#b91c1c;text-anchor:middle;font-weight:700">e⁻</text><path d="M 420 176 L 420 346 L 600 346 L 600 176" fill="none" stroke="#111827" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><path d="M 420 176 L 414 172" fill="none" stroke="#111827" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><path d="M 600 176 L 606 172" fill="none" stroke="#111827" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><path d="M 420 223.6 L 600 223.6 L 600 346 L 420 346 Z" fill="#dbeafe" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round"/><line x1="420" y1="223.6" x2="600" y2="223.6" stroke="#0891b2" stroke-width="1.6" stroke-linecap="round"/><path d="M 464 150 L 476 150 L 476 316 L 464 316 Z" fill="#cbd5e1" stroke="#111827" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><text x="510" y="366" style="font-size:10px;fill:#475569;text-anchor:middle">the half cell being measured</text><text x="510" y="196" style="font-size:12px;fill:#111827;text-anchor:middle;font-weight:700">M | Mⁿ⁺</text><path d="M 470 150 L 470 112 L 392 112" fill="none" stroke="#111827" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><circle cx="392" cy="112" r="18" fill="#ffffff" stroke="#111827" stroke-width="1.8"/><text x="392" y="117" style="font-size:13px;fill:#111827;text-anchor:middle;font-weight:700">V</text><rect x="612" y="170" width="111.67" height="83.7" rx="7" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/><text x="620" y="187.5" style="font-size:9.5px;fill:#475569;text-anchor:start">Standard conditions</text><text x="620" y="202" style="font-size:9.5px;fill:#475569;text-anchor:start">H₂ at 1 atm</text><text x="620" y="216.5" style="font-size:9.5px;fill:#475569;text-anchor:start">[H⁺] = 1 mol/L</text><text x="620" y="231" style="font-size:9.5px;fill:#475569;text-anchor:start">25 °C (298 K)</text><text x="620" y="245.5" style="font-size:9.5px;fill:#475569;text-anchor:start">E° = 0.00 V</text><text x="380" y="412" style="font-size:10.5px;fill:#475569;text-anchor:middle">E°cell = E°cathode − E°anode = E°(right) − E°(left).  When the SHE is on the left, the measured voltage is the E° of the other electrode.</text></svg>