<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="100%" style="max-width:760px;height:auto;display:block;margin:0 auto;background:#ffffff" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><text x="380" y="26" style="font-size:13px;fill:#334155;text-anchor:middle;font-weight:700">VISCOSITY AND THE VISCOSITY INDEX</text><path d="M 30 44 L 370 44 L 370 396 L 30 396 Z" fill="#fbfcff" stroke="#bfdbfe" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="200" y="66" style="font-size:10.4px;fill:#1d4ed8;text-anchor:middle;font-weight:700">What viscosity is</text><path d="M 60 96 L 330 96 L 330 108 L 60 108 Z" fill="#cbd5e1" stroke="#111827" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M 60 150 L 330 150 L 330 162 L 60 162 Z" fill="#cbd5e1" stroke="#111827" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><line x1="196" y1="118" x2="293" y2="118" stroke="#b91c1c" stroke-width="1.4" stroke-linecap="round"/><path d="M 300 118 L 293 121.15 L 293 114.85 Z" fill="#b91c1c"/><text x="180" y="122" style="font-size:8.0px;fill:#b91c1c;text-anchor:middle">force</text><text x="300" y="138" style="font-size:8.0px;fill:#475569;text-anchor:middle">top plate moves</text><text x="196" y="132" style="font-size:8.4px;fill:#1d4ed8;text-anchor:middle">oil film</text><line x1="70" y1="112" x2="82" y2="146" stroke="#93c5fd" stroke-width="1.0" stroke-linecap="round"/><line x1="96" y1="112" x2="108" y2="146" stroke="#93c5fd" stroke-width="1.0" stroke-linecap="round"/><line x1="122" y1="112" x2="134" y2="146" stroke="#93c5fd" stroke-width="1.0" stroke-linecap="round"/><line x1="148" y1="112" x2="160" y2="146" stroke="#93c5fd" stroke-width="1.0" stroke-linecap="round"/><line x1="174" y1="112" x2="186" y2="146" stroke="#93c5fd" stroke-width="1.0" stroke-linecap="round"/><line x1="200" y1="112" x2="212" y2="146" stroke="#93c5fd" stroke-width="1.0" stroke-linecap="round"/><line x1="226" y1="112" x2="238" y2="146" stroke="#93c5fd" stroke-width="1.0" stroke-linecap="round"/><line x1="252" y1="112" x2="264" y2="146" stroke="#93c5fd" stroke-width="1.0" stroke-linecap="round"/><line x1="278" y1="112" x2="290" y2="146" stroke="#93c5fd" stroke-width="1.0" stroke-linecap="round"/><line x1="304" y1="112" x2="316" y2="146" stroke="#93c5fd" stroke-width="1.0" stroke-linecap="round"/><text x="200" y="200" style="font-size:10.4px;fill:#334155;text-anchor:middle;font-weight:700">μ = F / (A × dv/dy)</text><text x="200" y="222" style="font-size:8.4px;fill:#475569;text-anchor:middle">force per unit area ÷ velocity gradient</text><text x="200" y="254" style="font-size:9.2px;fill:#334155;text-anchor:middle">Kinematic viscosity ν = μ ÷ density</text><text x="200" y="274" style="font-size:8.8px;fill:#475569;text-anchor:middle">1 stoke = 1 cm²/s = 100 cSt</text><text x="200" y="306" style="font-size:8.8px;fill:#475569;text-anchor:middle">Units: poise (P) = 0.1 Pa·s</text><text x="200" y="338" style="font-size:9.0px;fill:#334155;text-anchor:middle">Higher viscosity = thicker oil =</text><text x="200" y="356" style="font-size:9.0px;fill:#334155;text-anchor:middle">better load carrying, more drag.</text><path d="M 390 44 L 730 44 L 730 396 L 390 396 Z" fill="#f7fdf9" stroke="#bbf7d0" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="560" y="66" style="font-size:10.4px;fill:#047857;text-anchor:middle;font-weight:700">Viscosity index (VI)</text><line x1="430" y1="320" x2="690" y2="320" stroke="#111827" stroke-width="1.2" stroke-linecap="round"/><line x1="430" y1="320" x2="430" y2="110" stroke="#111827" stroke-width="1.2" stroke-linecap="round"/><text x="560" y="340" style="font-size:8.4px;fill:#475569;text-anchor:middle">temperature →</text><text x="438" y="104" style="font-size:8.0px;fill:#475569;text-anchor:start">viscosity ↑</text><line x1="440" y1="150" x2="680" y2="290" stroke="#b91c1c" stroke-width="2.2" stroke-linecap="round"/><line x1="440" y1="130" x2="680" y2="190" stroke="#047857" stroke-width="2.2" stroke-linecap="round"/><text x="640" y="300" style="font-size:8.4px;fill:#b91c1c;text-anchor:middle;font-weight:700">low VI oil</text><text x="646" y="180" style="font-size:8.4px;fill:#047857;text-anchor:middle;font-weight:700">high VI oil</text><text x="560" y="360" style="font-size:9.2px;fill:#334155;text-anchor:middle">VI = (L − U)/(L − H) × 100</text><text x="560" y="380" style="font-size:8.4px;fill:#475569;text-anchor:middle">high VI = viscosity changes little with temperature</text></svg>