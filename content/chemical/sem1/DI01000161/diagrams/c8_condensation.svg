<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="100%" style="max-width:760px;height:auto;display:block;margin:0 auto;background:#ffffff" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><text x="380" y="26" style="font-size:13px;fill:#334155;text-anchor:middle;font-weight:700">CONDENSATION POLYMERISATION — NYLON 6,6</text><path d="M 40 46 L 350 46 L 350 150 L 40 150 Z" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="195" y="68" style="font-size:9.6px;fill:#1d4ed8;text-anchor:middle;font-weight:700">Monomer A — adipic acid</text><text x="195" y="100" style="font-size:11.0px;fill:#334155;text-anchor:middle;font-weight:700">HOOC–(CH₂)₄–COOH</text><text x="195" y="128" style="font-size:8.6px;fill:#475569;text-anchor:middle">a di-acid, functionality 2</text><path d="M 410 46 L 720 46 L 720 150 L 410 150 Z" fill="#fdf4ff" stroke="#e9d5ff" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="565" y="68" style="font-size:9.4px;fill:#7c3aed;text-anchor:middle;font-weight:700">Monomer B — hexamethylene diamine</text><text x="565" y="100" style="font-size:11.0px;fill:#334155;text-anchor:middle;font-weight:700">H₂N–(CH₂)₆–NH₂</text><text x="565" y="128" style="font-size:8.6px;fill:#475569;text-anchor:middle">a di-amine, functionality 2</text><line x1="380" y1="98" x2="403" y2="98" stroke="#111827" stroke-width="1.4" stroke-linecap="round"/><path d="M 410 98 L 403 101.15 L 403 94.85 Z" fill="#111827"/><path d="M 40 160 L 720 160 L 720 250 L 40 250 Z" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="380" y="182" style="font-size:10.2px;fill:#b45309;text-anchor:middle;font-weight:700">Condensation — a water molecule leaves at every joint</text><text x="380" y="212" style="font-size:9.2px;fill:#334155;text-anchor:middle;font-weight:700">n HOOC–(CH₂)₄–COOH  +  n H₂N–(CH₂)₆–NH₂  →  [–CO–(CH₂)₄–CO–NH–(CH₂)₆–NH–]n  +  2n H₂O</text><text x="380" y="238" style="font-size:8.6px;fill:#475569;text-anchor:middle">280 °C under nitrogen; the amide (peptide) link is the repeating unit.</text><path d="M 40 260 L 720 260 L 720 340 L 40 340 Z" fill="#f7fdf9" stroke="#bbf7d0" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="380" y="282" style="font-size:10.0px;fill:#047857;text-anchor:middle;font-weight:700">The repeating unit — an amide link every six and four carbons</text><text x="380" y="314" style="font-size:11.4px;fill:#334155;text-anchor:middle;font-weight:700">[–NH–(CH₂)₆–NH–CO–(CH₂)₄–CO–]n</text><text x="380" y="334" style="font-size:8.6px;fill:#475569;text-anchor:middle">n is typically 100 to 200; hydrogen bonding between chains gives the strength and the melting point of 265 °C.</text><text x="380" y="372" style="font-size:9.0px;fill:#334155;text-anchor:middle">Condensation needs two different monomers, each with two reactive ends, and it loses a small molecule at every step.</text><text x="380" y="396" style="font-size:8.8px;fill:#475569;text-anchor:middle">Addition needs only one monomer and loses nothing — that is the cleanest way to tell the two apart.</text></svg>