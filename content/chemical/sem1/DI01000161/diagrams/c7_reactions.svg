<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="100%" style="max-width:760px;height:auto;display:block;margin:0 auto;background:#ffffff" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><text x="380" y="26" style="font-size:13px;fill:#334155;text-anchor:middle;font-weight:700">THE THREE MAIN TYPES OF ORGANIC REACTION</text><path d="M 30 46 L 254 46 L 254 300 L 30 300 Z" fill="#eff6ff" stroke="#e5e7eb" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/><text x="142" y="70" style="font-size:11.0px;fill:#1d4ed8;text-anchor:middle;font-weight:700">Substitution</text><text x="142" y="98" style="font-size:8.2px;fill:#334155;text-anchor:middle">one atom or group is</text><text x="142" y="120" style="font-size:8.2px;fill:#334155;text-anchor:middle">replaced by another</text><text x="142" y="142" style="font-size:8.2px;fill:#334155;text-anchor:middle">CH₄ + Cl₂ → CH₃Cl + HCl</text><text x="142" y="164" style="font-size:8.2px;fill:#334155;text-anchor:middle">CH₃CH₂Br + KOH(aq) →</text><text x="142" y="186" style="font-size:8.2px;fill:#334155;text-anchor:middle">CH₃CH₂OH + KBr</text><text x="142" y="208" style="font-size:8.2px;fill:#334155;text-anchor:middle">typical of alkanes and</text><text x="142" y="230" style="font-size:8.2px;fill:#334155;text-anchor:middle">haloalkanes</text><text x="142" y="252" style="font-size:8.2px;fill:#334155;text-anchor:middle">free radical or SN1 / SN2</text><path d="M 270 46 L 494 46 L 494 300 L 270 300 Z" fill="#f0fdf4" stroke="#e5e7eb" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/><text x="382" y="70" style="font-size:11.0px;fill:#047857;text-anchor:middle;font-weight:700">Addition</text><text x="382" y="98" style="font-size:8.2px;fill:#334155;text-anchor:middle">two atoms add across</text><text x="382" y="120" style="font-size:8.2px;fill:#334155;text-anchor:middle">a double bond</text><text x="382" y="142" style="font-size:8.2px;fill:#334155;text-anchor:middle">CH₂=CH₂ + Br₂ →</text><text x="382" y="164" style="font-size:8.2px;fill:#334155;text-anchor:middle">CH₂Br‑CH₂Br</text><text x="382" y="186" style="font-size:8.2px;fill:#334155;text-anchor:middle">CH₂=CH₂ + H₂ → CH₃‑CH₃</text><text x="382" y="208" style="font-size:8.2px;fill:#334155;text-anchor:middle">(Ni, 300 °C)</text><text x="382" y="230" style="font-size:8.2px;fill:#334155;text-anchor:middle">typical of alkenes and</text><text x="382" y="252" style="font-size:8.2px;fill:#334155;text-anchor:middle">alkynes</text><text x="382" y="274" style="font-size:8.2px;fill:#334155;text-anchor:middle">electrophilic addition</text><path d="M 510 46 L 734 46 L 734 300 L 510 300 Z" fill="#fef2f2" stroke="#e5e7eb" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/><text x="622" y="70" style="font-size:11.0px;fill:#b91c1c;text-anchor:middle;font-weight:700">Elimination</text><text x="622" y="98" style="font-size:8.2px;fill:#334155;text-anchor:middle">a small molecule is lost</text><text x="622" y="120" style="font-size:8.2px;fill:#334155;text-anchor:middle">from two adjacent carbons,</text><text x="622" y="142" style="font-size:8.2px;fill:#334155;text-anchor:middle">forming a double bond</text><text x="622" y="164" style="font-size:8.2px;fill:#334155;text-anchor:middle">CH₃CH₂Br + KOH(alc) →</text><text x="622" y="186" style="font-size:8.2px;fill:#334155;text-anchor:middle">CH₂=CH₂ + KBr</text><text x="622" y="208" style="font-size:8.2px;fill:#334155;text-anchor:middle">typical of haloalkanes</text><text x="622" y="230" style="font-size:8.2px;fill:#334155;text-anchor:middle">and alcohols</text><text x="622" y="252" style="font-size:8.2px;fill:#334155;text-anchor:middle">Saytzeff: the more</text><text x="622" y="274" style="font-size:8.2px;fill:#334155;text-anchor:middle">substituted alkene wins</text><path d="M 30 314 L 730 314 L 730 414 L 30 414 Z" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="380" y="336" style="font-size:10.0px;fill:#b45309;text-anchor:middle;font-weight:700">How to spot the type in the question</text><text x="380" y="360" style="font-size:8.8px;fill:#334155;text-anchor:middle">count the formula before and after: same atoms replaced = substitution; atoms added on = addition; atoms lost = elimination</text><text x="380" y="386" style="font-size:8.8px;fill:#475569;text-anchor:middle">In every case, the functional group decides the mechanism — not the size of the molecule.</text></svg>