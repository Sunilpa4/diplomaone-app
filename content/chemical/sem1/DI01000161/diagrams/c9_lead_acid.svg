<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" style="max-width:760px;height:auto;display:block;margin:0 auto;background:#ffffff" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><text x="380" y="26" style="font-size:13px;fill:#334155;text-anchor:middle;font-weight:700">LEAD–ACID STORAGE BATTERY — DISCHARGE AND CHARGE</text><path d="M 40 66 L 330 66 L 330 300 L 40 300 Z" fill="#f1f5f9" stroke="#111827" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M 60 120 L 110 120 L 110 280 L 60 280 Z" fill="#c4b5fd" stroke="#7c3aed" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M 250 120 L 300 120 L 300 280 L 250 280 Z" fill="#d6d3d1" stroke="#b45309" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="85" y="112" style="font-size:8.6px;fill:#7c3aed;text-anchor:middle;font-weight:700">Pb anode</text><text x="275" y="112" style="font-size:8.6px;fill:#b45309;text-anchor:middle;font-weight:700">PbO₂ cathode</text><path d="M 60 300 L 300 300 L 300 296 L 60 296 Z" fill="#bae6fd" stroke="#0ea5e9" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="185" y="292" style="font-size:8.4px;fill:#0369a1;text-anchor:middle">dilute H₂SO₄ (38 %, ρ 1.28 g/cm³)</text><line x1="85" y1="120" x2="85" y2="66" stroke="#111827" stroke-width="1.4" stroke-linecap="round"/><line x1="275" y1="120" x2="275" y2="66" stroke="#111827" stroke-width="1.4" stroke-linecap="round"/><circle cx="85" cy="60" r="4" fill="1.2" stroke="#111827" stroke-width="#ffffff"/><circle cx="275" cy="60" r="4" fill="1.2" stroke="#111827" stroke-width="#ffffff"/><text x="180" y="58" style="font-size:8.8px;fill:#334155;text-anchor:middle;font-weight:700">2 V per cell</text><path d="M 350 66 L 730 66 L 730 300 L 350 300 Z" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="540" y="88" style="font-size:10.0px;fill:#b45309;text-anchor:middle;font-weight:700">Discharge — the battery gives current</text><text x="540" y="116" style="font-size:8.8px;fill:#334155;text-anchor:middle">Anode:  Pb + HSO₄⁻ → PbSO₄ + H⁺ + 2e⁻</text><text x="540" y="140" style="font-size:8.8px;fill:#334155;text-anchor:middle">Cathode:  PbO₂ + HSO₄⁻ + 3H⁺ + 2e⁻ → PbSO₄ + 2H₂O</text><text x="540" y="164" style="font-size:8.8px;fill:#334155;text-anchor:middle;font-weight:700">Overall:  Pb + PbO₂ + 2H₂SO₄ → 2PbSO₄ + 2H₂O</text><text x="540" y="190" style="font-size:8.4px;fill:#475569;text-anchor:middle">Both plates turn to PbSO₄ and the acid is diluted —</text><text x="540" y="206" style="font-size:8.4px;fill:#475569;text-anchor:middle">the relative density falls from 1.28 to about 1.15.</text><text x="540" y="240" style="font-size:9.0px;fill:#334155;text-anchor:middle">Charging reverses every step, and the acid</text><text x="540" y="258" style="font-size:9.0px;fill:#334155;text-anchor:middle">strength returns to 1.28 — that is why the</text><text x="540" y="276" style="font-size:9.0px;fill:#334155;text-anchor:middle">hydrometer reading tells the state of charge.</text><path d="M 40 312 L 730 312 L 730 430 L 40 430 Z" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="380" y="334" style="font-size:10.0px;fill:#047857;text-anchor:middle;font-weight:700">Maintenance that follows from the chemistry</text><text x="200" y="358" style="font-size:8.2px;fill:#334155;text-anchor:middle">Keep the acid level up with distilled water — never acid.</text><text x="560" y="358" style="font-size:8.2px;fill:#334155;text-anchor:middle">Do not leave it discharged: PbSO₄ hardens and will not dissolve again (sulphation).</text><text x="200" y="380" style="font-size:8.2px;fill:#334155;text-anchor:middle">Never short the terminals or draw more than C/10 for long.</text><text x="560" y="380" style="font-size:8.2px;fill:#334155;text-anchor:middle">Charge with the vent caps open, in a ventilated place — H₂ is released.</text><text x="200" y="402" style="font-size:8.2px;fill:#334155;text-anchor:middle">A fully charged cell reads 2.1 V and 1.28 relative density.</text><text x="560" y="402" style="font-size:8.2px;fill:#334155;text-anchor:middle">A six-cell battery gives 12.6 V; 6 × 2 V is the reason it is called a 12 V battery.</text></svg>