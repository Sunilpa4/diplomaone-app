<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="100%" style="max-width:760px;height:auto;display:block;margin:0 auto;background:#ffffff" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><text x="380" y="26" style="font-size:13px;fill:#334155;text-anchor:middle;font-weight:700">PREVENTION — COATINGS, CATHODIC PROTECTION AND DESIGN</text><path d="M 30 44 L 370 44 L 370 300 L 30 300 Z" fill="#f7fbf7" stroke="#bbf7d0" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="200" y="66" style="font-size:11.2px;fill:#047857;text-anchor:middle;font-weight:700">Cathodic protection</text><path d="M 90 120 L 320 120 L 320 260 L 90 260 Z" fill="#dbeafe" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round"/><line x1="90" y1="120" x2="320" y2="120" stroke="#0891b2" stroke-width="1.5" stroke-linecap="round"/><path d="M 140 96 L 176 96 L 176 250 L 140 250 Z" fill="#cbd5e1" stroke="#111827" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="158" y="270" style="font-size:9px;fill:#1d4ed8;text-anchor:middle;font-weight:700">steel pipe (cathode)</text><path d="M 250 96 L 280 96 L 280 250 L 250 250 Z" fill="#fca5a5" stroke="#111827" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="265" y="88" style="font-size:9px;fill:#b91c1c;text-anchor:middle;font-weight:700">Zn / Mg block</text><text x="265" y="270" style="font-size:9px;fill:#b91c1c;text-anchor:middle">sacrificial anode</text><line x1="244" y1="150" x2="190" y2="150" stroke="#b91c1c" stroke-width="1.4" stroke-linecap="round"/><path d="M 182 150 L 190 146.4 L 190 153.6 Z" fill="#b91c1c"/><text x="212" y="142" style="font-size:9.4px;fill:#b91c1c;text-anchor:middle;font-weight:700">e⁻</text><text x="200" y="210" style="font-size:9.4px;fill:#475569;text-anchor:middle">the block corrodes, the pipe stays whole</text><path d="M 390 44 L 730 44 L 730 300 L 390 300 Z" fill="#fbfcff" stroke="#e6e1f4" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="560" y="66" style="font-size:11.2px;fill:#7c3aed;text-anchor:middle;font-weight:700">Protective coatings</text><path d="M 410 90 L 710 90 L 710 120 L 410 120 Z" fill="#e2e8f0" stroke="#e6e1f4" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="420" y="110" style="font-size:9.6px;fill:#334155;text-anchor:start;font-weight:700">Galvanising</text><text x="560" y="110" style="font-size:9.2px;fill:#475569;text-anchor:start">a zinc coat; zinc corrodes first</text><path d="M 410 128 L 710 128 L 710 158 L 410 158 Z" fill="#f8fafc" stroke="#e6e1f4" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="420" y="148" style="font-size:9.6px;fill:#334155;text-anchor:start;font-weight:700">Tinning</text><text x="560" y="148" style="font-size:9.2px;fill:#475569;text-anchor:start">a tin coat on steel — food cans</text><path d="M 410 166 L 710 166 L 710 196 L 410 196 Z" fill="#fef3c7" stroke="#e6e1f4" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="420" y="186" style="font-size:9.6px;fill:#334155;text-anchor:start;font-weight:700">Paint, varnish, enamel</text><text x="560" y="186" style="font-size:9.2px;fill:#475569;text-anchor:start">a barrier against air and water</text><path d="M 410 204 L 710 204 L 710 234 L 410 234 Z" fill="#dbeafe" stroke="#e6e1f4" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="420" y="224" style="font-size:9.6px;fill:#334155;text-anchor:start;font-weight:700">Electroplating</text><text x="560" y="224" style="font-size:9.2px;fill:#475569;text-anchor:start">Ni, Cr, Zn coats for wear and looks</text><path d="M 410 242 L 710 242 L 710 272 L 410 272 Z" fill="#dcfce7" stroke="#e6e1f4" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="420" y="262" style="font-size:9.6px;fill:#334155;text-anchor:start;font-weight:700">Metal spraying</text><text x="560" y="262" style="font-size:9.2px;fill:#475569;text-anchor:start">molten zinc or Al spray</text><path d="M 30 316 L 730 316 L 730 404 L 30 404 Z" fill="#faf9ff" stroke="#ddd6fe" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="46" y="338" style="font-size:10px;fill:#7c3aed;text-anchor:start;font-weight:700">Also:</text><text x="96" y="338" style="font-size:9.2px;fill:#475569;text-anchor:start">stainless steel or alloy instead of plain steel  ·  smooth, drainable design with no crevices  ·  remove dissolved O2 and CO2</text><text x="96" y="360" style="font-size:9.2px;fill:#475569;text-anchor:start">add inhibitors (chromate, phosphate)  ·  keep the pH above 9 for steel in water  ·  never pair a small anode with a large cathode</text><text x="96" y="382" style="font-size:9.2px;fill:#475569;text-anchor:start">coat the cathode, not the anode  ·  anodic protection for passivable metals  ·  never bolt a small steel part to a large copper one</text></svg>