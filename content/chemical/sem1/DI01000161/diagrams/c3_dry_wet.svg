<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="100%" style="max-width:760px;height:auto;display:block;margin:0 auto;background:#ffffff" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><text x="380" y="26" style="font-size:13px;fill:#334155;text-anchor:middle;font-weight:700">CORROSION — DRY (CHEMICAL) AND WET (ELECTROCHEMICAL)</text><path d="M 30 44 L 370 44 L 370 394 L 30 394 Z" fill="#fffdf7" stroke="#fde68a" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="200" y="66" style="font-size:11.5px;fill:#b45309;text-anchor:middle;font-weight:700">DRY  ·  chemical corrosion</text><path d="M 70 120 L 330 120 L 330 168 L 70 168 Z" fill="#e2e8f0" stroke="#111827" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><text x="200" y="152" style="font-size:10px;fill:#334155;text-anchor:middle">metal surface</text><circle cx="90" cy="108" r="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.3"/><circle cx="124" cy="100" r="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.3"/><circle cx="158" cy="108" r="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.3"/><circle cx="192" cy="100" r="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.3"/><circle cx="226" cy="108" r="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.3"/><circle cx="260" cy="100" r="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.3"/><circle cx="294" cy="108" r="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.3"/><circle cx="328" cy="100" r="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.3"/><text x="200" y="92" style="font-size:9.6px;fill:#475569;text-anchor:middle">O₂, SO₂, Cl₂ in dry air</text><path d="M 70 120 L 330 120 L 330 128 L 70 128 Z" fill="#fde68a" stroke="#111827" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="340" y="138" style="font-size:9.4px;fill:#b45309;text-anchor:start">oxide film</text><text x="200" y="196" style="font-size:9.8px;fill:#475569;text-anchor:middle">No moisture, no current — the metal reacts</text><text x="200" y="212" style="font-size:9.8px;fill:#475569;text-anchor:middle">directly with the gas and a film forms.</text><text x="200" y="240" style="font-size:9.6px;fill:#475569;text-anchor:middle">Examples: rusting in hot dry air,</text><text x="200" y="256" style="font-size:9.6px;fill:#475569;text-anchor:middle">tarnishing of silver by H₂S,</text><text x="200" y="272" style="font-size:9.6px;fill:#475569;text-anchor:middle">oxidation of copper to a black film.</text><rect x="58" y="296" width="260.12" height="54.4" rx="7" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/><text x="66" y="313.4" style="font-size:9.4px;fill:#475569;text-anchor:start">If the film is porous (PBR &lt; 1) it lets</text><text x="66" y="327.8" style="font-size:9.4px;fill:#475569;text-anchor:start">oxygen through and the attack continues;</text><text x="66" y="342.2" style="font-size:9.4px;fill:#475569;text-anchor:start">if it is tight (PBR 1–1.5) it protects the metal.</text><path d="M 390 44 L 730 44 L 730 394 L 390 394 Z" fill="#f7fbff" stroke="#bfdbfe" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="560" y="66" style="font-size:11.5px;fill:#1d4ed8;text-anchor:middle;font-weight:700">WET  ·  electrochemical corrosion</text><path d="M 430 120 L 690 120 L 690 168 L 430 168 Z" fill="#e2e8f0" stroke="#111827" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M 430 176 L 690 176 L 690 380 L 430 380 Z" fill="#dbeafe" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round"/><line x1="430" y1="176" x2="690" y2="176" stroke="#0891b2" stroke-width="1.5" stroke-linecap="round"/><text x="560" y="196" style="font-size:9.4px;fill:#0891b2;text-anchor:middle">moist air / conducting solution (electrolyte)</text><text x="482" y="112" style="font-size:9.4px;fill:#b91c1c;text-anchor:middle;font-weight:700">anodic area</text><text x="636" y="112" style="font-size:9.4px;fill:#1d4ed8;text-anchor:middle;font-weight:700">cathodic area</text><text x="482" y="158" style="font-size:8.8px;fill:#b91c1c;text-anchor:middle">Fe → Fe²⁺ + 2e⁻</text><line x1="520" y1="137" x2="593" y2="137" stroke="#b91c1c" stroke-width="1.3" stroke-linecap="round"/><path d="M 600 137 L 593 140.15 L 593 133.85 Z" fill="#b91c1c"/><text x="560" y="130" style="font-size:9px;fill:#b91c1c;text-anchor:middle;font-weight:700">e⁻</text><text x="686" y="158" style="font-size:8.2px;fill:#1d4ed8;text-anchor:end">O₂ + 2H₂O + 4e⁻ → 4OH⁻</text><circle cx="470" cy="250" r="5" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><circle cx="520" cy="290" r="5" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><circle cx="600" cy="250" r="5" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><circle cx="650" cy="300" r="5" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="560" y="340" style="font-size:9.4px;fill:#b45309;text-anchor:middle">rust Fe₂O₃·xH₂O forms near the cathodic area</text><text x="560" y="360" style="font-size:9.4px;fill:#b91c1c;text-anchor:middle">the metal dissolves at the anodic area</text><text x="560" y="216" style="font-size:9.6px;fill:#475569;text-anchor:middle">two different areas of the same metal act as</text><text x="560" y="234" style="font-size:9.6px;fill:#475569;text-anchor:middle">anode and cathode — a tiny cell on the surface</text></svg>