<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="100%" style="max-width:760px;height:auto;display:block;margin:0 auto;background:#ffffff" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><text x="380" y="26" style="font-size:13px;fill:#334155;text-anchor:middle;font-weight:700">IONIC (ELECTROVALENT) BOND — ONE ELECTRON CHANGES HANDS, Na → Na⁺ + e⁻</text><circle cx="112" cy="150" r="30" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="1.8"/><text x="112" y="156" style="font-size:15px;fill:#1d4ed8;text-anchor:middle;font-weight:700">Na</text><circle cx="112" cy="98" r="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="3.0"/><circle cx="112" cy="150" r="52" fill="none" stroke="#6b7280" stroke-width="0"/><text x="112" y="232" style="font-size:10.5px;fill:#475569;text-anchor:middle">Na — 2, 8, 1</text><text x="112" y="258" style="font-size:9.5px;fill:#6b7280;text-anchor:middle">one electron alone in the third shell</text><line x1="190" y1="138" x2="235" y2="138" stroke="#047857" stroke-width="1.8" stroke-linecap="round"/><path d="M 244 138 L 235 142.05 L 235 133.95 Z" fill="#047857"/><text x="217" y="122" style="font-size:11px;fill:#047857;text-anchor:middle;font-weight:700">1 e⁻</text><text x="217" y="160" style="font-size:9.5px;fill:#047857;text-anchor:middle">transfer</text><circle cx="320" cy="150" r="30" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="1.8"/><text x="320" y="156" style="font-size:15px;fill:#1d4ed8;text-anchor:middle;font-weight:700">Na</text><text x="382" y="128" style="font-size:14px;fill:#b91c1c;text-anchor:middle;font-weight:700">+</text><circle cx="320" cy="98" r="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="3.0"/><circle cx="356.77" cy="113.23" r="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="3.0"/><circle cx="372" cy="150" r="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="3.0"/><circle cx="356.77" cy="186.77" r="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="3.0"/><circle cx="320" cy="202" r="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="3.0"/><circle cx="283.23" cy="186.77" r="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="3.0"/><circle cx="268" cy="150" r="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="3.0"/><circle cx="283.23" cy="113.23" r="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="3.0"/><circle cx="320" cy="150" r="52" fill="none" stroke="#6b7280" stroke-width="0"/><text x="320" y="232" style="font-size:10.5px;fill:#475569;text-anchor:middle">Na⁺ — 2, 8</text><line x1="400" y1="150" x2="443" y2="150" stroke="#047857" stroke-width="1.8" stroke-linecap="round"/><path d="M 452 150 L 443 154.05 L 443 145.95 Z" fill="#047857"/><text x="426" y="136" style="font-size:11px;fill:#047857;text-anchor:middle;font-weight:700">e⁻</text><circle cx="540" cy="150" r="30" fill="#dcfce7" stroke="#047857" stroke-width="1.8"/><text x="540" y="156" style="font-size:15px;fill:#047857;text-anchor:middle;font-weight:700">Cl</text><text x="602" y="128" style="font-size:14px;fill:#b91c1c;text-anchor:middle;font-weight:700">−</text><circle cx="540" cy="98" r="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="3.0"/><circle cx="576.77" cy="113.23" r="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="3.0"/><circle cx="592" cy="150" r="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="3.0"/><circle cx="576.77" cy="186.77" r="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="3.0"/><circle cx="540" cy="202" r="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="3.0"/><circle cx="503.23" cy="186.77" r="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="3.0"/><circle cx="488" cy="150" r="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="3.0"/><circle cx="503.23" cy="113.23" r="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="3.0"/><circle cx="540" cy="150" r="52" fill="none" stroke="#6b7280" stroke-width="0"/><text x="540" y="232" style="font-size:10.5px;fill:#475569;text-anchor:middle">Cl⁻ — 2, 8, 8</text><path d="M 602 96 L 610 96 L 610 204 L 602 204" fill="none" stroke="#047857" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="614" y="92" style="font-size:11px;fill:#b91c1c;text-anchor:start;font-weight:700"></text><text x="614" y="132" style="font-size:10.5px;fill:#047857;text-anchor:start">octet</text><text x="614" y="148" style="font-size:10.5px;fill:#047857;text-anchor:start">complete</text><text x="380" y="288" style="font-size:11px;fill:#475569;text-anchor:middle">Sodium gives up its single outer electron; chlorine accepts it, so both ions gain a noble-gas arrangement.</text><text x="380" y="308" style="font-size:11px;fill:#475569;text-anchor:middle">Opposite charges then hold the two ions together — that attraction is the ionic bond.</text><text x="380" y="336" style="font-size:12px;fill:#334155;text-anchor:middle;font-weight:700">Characteristics of an ionic bond</text><text x="60" y="360" style="font-size:10.5px;fill:#475569;text-anchor:start">•  Formed between a metal of low ionisation energy and a non-metal of high electron affinity.</text><text x="60" y="377" style="font-size:10.5px;fill:#475569;text-anchor:start">•  Electrostatic attraction between the ions; no shared pair, so the bond is non-directional.</text><text x="60" y="394" style="font-size:10.5px;fill:#475569;text-anchor:start">•  High melting and boiling point, hard and brittle crystals.</text><text x="60" y="411" style="font-size:10.5px;fill:#475569;text-anchor:start">•  Conducts electricity when molten or in solution, not in the solid state.</text><text x="60" y="428" style="font-size:10.5px;fill:#475569;text-anchor:start">•  Soluble in water, where the polar water molecules pull the ions apart.</text></svg>