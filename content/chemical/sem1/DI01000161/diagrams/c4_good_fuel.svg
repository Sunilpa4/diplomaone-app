<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="100%" style="max-width:760px;height:auto;display:block;margin:0 auto;background:#ffffff" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><text x="380" y="26" style="font-size:13px;fill:#334155;text-anchor:middle;font-weight:700">WHAT MAKES A GOOD FUEL — AND HOW THE THREE TYPES COMPARE</text><path d="M 30 48 L 370 48 L 370 110 L 30 110 Z" fill="#fef2f2" stroke="#e5e7eb" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/><text x="44" y="72" style="font-size:9.6px;fill:#b91c1c;text-anchor:start;font-weight:700">High calorific value</text><text x="44" y="92" style="font-size:8.8px;fill:#475569;text-anchor:start">more heat per kg and per rupee</text><path d="M 390 48 L 730 48 L 730 110 L 390 110 Z" fill="#fff7ed" stroke="#e5e7eb" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/><text x="404" y="72" style="font-size:9.6px;fill:#b45309;text-anchor:start;font-weight:700">Low ignition temperature</text><text x="404" y="92" style="font-size:8.8px;fill:#475569;text-anchor:start">starts easily, but not by itself in storage</text><path d="M 30 122 L 370 122 L 370 184 L 30 184 Z" fill="#f0f9ff" stroke="#e5e7eb" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/><text x="44" y="146" style="font-size:9.6px;fill:#1d4ed8;text-anchor:start;font-weight:700">Controlled, complete burning</text><text x="44" y="166" style="font-size:8.8px;fill:#475569;text-anchor:start">little smoke, no CO, no soot</text><path d="M 390 122 L 730 122 L 730 184 L 390 184 Z" fill="#f5f3ff" stroke="#e5e7eb" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/><text x="404" y="146" style="font-size:9.6px;fill:#7c3aed;text-anchor:start;font-weight:700">Low moisture and ash</text><text x="404" y="166" style="font-size:8.8px;fill:#475569;text-anchor:start">no dead weight, no clinker</text><path d="M 30 196 L 370 196 L 370 258 L 30 258 Z" fill="#f0fdf4" stroke="#e5e7eb" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/><text x="44" y="220" style="font-size:9.6px;fill:#047857;text-anchor:start;font-weight:700">No harmful products</text><text x="44" y="240" style="font-size:8.8px;fill:#475569;text-anchor:start">no SO₂, no lead, no grit</text><path d="M 390 196 L 730 196 L 730 258 L 390 258 Z" fill="#ecfeff" stroke="#e5e7eb" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/><text x="404" y="220" style="font-size:9.6px;fill:#0891b2;text-anchor:start;font-weight:700">Cheap, safe, easy to store</text><text x="404" y="240" style="font-size:8.8px;fill:#475569;text-anchor:start">available everywhere, no explosion risk</text><path d="M 30 282 L 730 282 L 730 404 L 30 404 Z" fill="#fbfcff" stroke="#e6e1f4" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="380" y="300" style="font-size:10px;fill:#334155;text-anchor:middle;font-weight:700">Solid vs liquid vs gas</text><path d="M 48 312 L 260 312 L 260 390 L 48 390 Z" fill="#fffbeb" stroke="#e5e7eb" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="154" y="332" style="font-size:9.2px;fill:#334155;text-anchor:middle;font-weight:700">Solid (coal, wood)</text><text x="154" y="352" style="font-size:8.4px;fill:#475569;text-anchor:middle">cheap, easy to store</text><text x="154" y="368" style="font-size:8.4px;fill:#475569;text-anchor:middle">high ash, slow, smoky</text><path d="M 276 312 L 488 312 L 488 390 L 276 390 Z" fill="#f0f7ff" stroke="#e5e7eb" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="382" y="332" style="font-size:9.2px;fill:#334155;text-anchor:middle;font-weight:700">Liquid (petrol, diesel)</text><text x="382" y="352" style="font-size:8.4px;fill:#475569;text-anchor:middle">high CV, clean, easy to pump</text><text x="382" y="368" style="font-size:8.4px;fill:#475569;text-anchor:middle">costly, fire risk</text><path d="M 504 312 L 716 312 L 716 390 L 504 390 Z" fill="#f0fdf4" stroke="#e5e7eb" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="610" y="332" style="font-size:9.2px;fill:#334155;text-anchor:middle;font-weight:700">Gas (LPG, CNG, biogas)</text><text x="610" y="352" style="font-size:8.4px;fill:#475569;text-anchor:middle">cleanest, no ash, exact control</text><text x="610" y="368" style="font-size:8.4px;fill:#475569;text-anchor:middle">needs a gas-tight line</text></svg>