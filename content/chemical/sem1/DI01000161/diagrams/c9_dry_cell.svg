<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="100%" style="max-width:760px;height:auto;display:block;margin:0 auto;background:#ffffff" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><text x="380" y="26" style="font-size:13px;fill:#334155;text-anchor:middle;font-weight:700">LECLANCHÉ DRY CELL — CONSTRUCTION AND REACTIONS</text><path d="M 190 60 L 330 60 L 330 350 L 190 350 Z" fill="#f8fafc" stroke="#111827" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M 200 78 L 320 78 L 320 340 L 200 340 Z" fill="#fef3c7" stroke="#cbd5e1" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><path d="M 250 74 L 270 74 L 270 250 L 250 250 Z" fill="#334155" stroke="#111827" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M 240 48 L 280 48 L 280 74 L 240 74 Z" fill="#94a3b8" stroke="#111827" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="260" y="40" style="font-size:8.4px;fill:#334155;text-anchor:middle">brass cap (+)</text><line x1="332" y1="88" x2="360" y2="88" stroke="#94a3b8" stroke-width="1.0" stroke-linecap="round"/><text x="368" y="92" style="font-size:8.6px;fill:#334155;text-anchor:start">zinc can — the negative electrode (anode)</text><line x1="332" y1="150" x2="360" y2="150" stroke="#94a3b8" stroke-width="1.0" stroke-linecap="round"/><text x="368" y="154" style="font-size:8.6px;fill:#334155;text-anchor:start">MnO₂ + graphite powder + NH₄Cl paste</text><line x1="332" y1="215" x2="360" y2="215" stroke="#94a3b8" stroke-width="1.0" stroke-linecap="round"/><text x="368" y="219" style="font-size:8.6px;fill:#334155;text-anchor:start">carbon rod — the positive electrode (cathode)</text><line x1="332" y1="275" x2="360" y2="275" stroke="#94a3b8" stroke-width="1.0" stroke-linecap="round"/><text x="368" y="279" style="font-size:8.6px;fill:#334155;text-anchor:start">paper separator soaked in NH₄Cl and ZnCl₂</text><line x1="332" y1="330" x2="360" y2="330" stroke="#94a3b8" stroke-width="1.0" stroke-linecap="round"/><text x="368" y="334" style="font-size:8.6px;fill:#334155;text-anchor:start">sealing wax, then a bitumen seal</text><path d="M 20 366 L 740 366 L 740 418 L 20 418 Z" fill="#f3efff" stroke="#e0d8f5" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="380" y="386" style="font-size:8.8px;fill:#7c3aed;text-anchor:middle;font-weight:700">Anode:  Zn → Zn²⁺ + 2e⁻      Cathode:  2MnO₂ + 2NH₄⁺ + 2e⁻ → Mn₂O₃ + 2NH₃ + H₂O</text><text x="380" y="408" style="font-size:8.4px;fill:#475569;text-anchor:middle">Cell: Zn + 2MnO₂ + 2NH₄Cl → ZnCl₂ + Mn₂O₃ + 2NH₃ + H₂O   ·   1.5 V, not rechargeable</text></svg>