<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" style="max-width:760px;height:auto;display:block;margin:0 auto;background:#ffffff" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><text x="380" y="26" style="font-size:13px;fill:#334155;text-anchor:middle;font-weight:700">HOMOLOGOUS SERIES — CnH2n+2 FOR THE ALKANES</text><path d="M 60 50 L 700 50 L 700 78 L 60 78 Z" fill="#f3efff" stroke="#e0d8f5" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="120" y="70" style="font-size:9.2px;fill:#7c3aed;text-anchor:middle;font-weight:700">Name</text><text x="260" y="70" style="font-size:9.2px;fill:#7c3aed;text-anchor:middle;font-weight:700">Formula</text><text x="400" y="70" style="font-size:9.2px;fill:#7c3aed;text-anchor:middle;font-weight:700">n</text><text x="510" y="70" style="font-size:9.2px;fill:#7c3aed;text-anchor:middle;font-weight:700">Molar mass</text><text x="630" y="70" style="font-size:9.2px;fill:#7c3aed;text-anchor:middle;font-weight:700">b.p. / °C</text><path d="M 60 78 L 700 78 L 700 112 L 60 112 Z" fill="#ffffff" stroke="#f0edf9" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/><text x="120" y="100" style="font-size:9.2px;fill:#334155;text-anchor:middle">Methane</text><text x="260" y="100" style="font-size:9.2px;fill:#334155;text-anchor:middle">CH₄</text><text x="400" y="100" style="font-size:9.2px;fill:#334155;text-anchor:middle">1</text><text x="510" y="100" style="font-size:9.2px;fill:#334155;text-anchor:middle">16</text><text x="630" y="100" style="font-size:9.2px;fill:#334155;text-anchor:middle">−162</text><path d="M 60 112 L 700 112 L 700 146 L 60 146 Z" fill="#faf9ff" stroke="#f0edf9" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/><text x="120" y="134" style="font-size:9.2px;fill:#334155;text-anchor:middle">Ethane</text><text x="260" y="134" style="font-size:9.2px;fill:#334155;text-anchor:middle">C₂H₆</text><text x="400" y="134" style="font-size:9.2px;fill:#334155;text-anchor:middle">2</text><text x="510" y="134" style="font-size:9.2px;fill:#334155;text-anchor:middle">30</text><text x="630" y="134" style="font-size:9.2px;fill:#334155;text-anchor:middle">−89</text><path d="M 60 146 L 700 146 L 700 180 L 60 180 Z" fill="#ffffff" stroke="#f0edf9" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/><text x="120" y="168" style="font-size:9.2px;fill:#334155;text-anchor:middle">Propane</text><text x="260" y="168" style="font-size:9.2px;fill:#334155;text-anchor:middle">C₃H₈</text><text x="400" y="168" style="font-size:9.2px;fill:#334155;text-anchor:middle">3</text><text x="510" y="168" style="font-size:9.2px;fill:#334155;text-anchor:middle">44</text><text x="630" y="168" style="font-size:9.2px;fill:#334155;text-anchor:middle">−42</text><path d="M 60 180 L 700 180 L 700 214 L 60 214 Z" fill="#faf9ff" stroke="#f0edf9" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/><text x="120" y="202" style="font-size:9.2px;fill:#334155;text-anchor:middle">Butane</text><text x="260" y="202" style="font-size:9.2px;fill:#334155;text-anchor:middle">C₄H₁₀</text><text x="400" y="202" style="font-size:9.2px;fill:#334155;text-anchor:middle">4</text><text x="510" y="202" style="font-size:9.2px;fill:#334155;text-anchor:middle">58</text><text x="630" y="202" style="font-size:9.2px;fill:#334155;text-anchor:middle">−1</text><path d="M 60 214 L 700 214 L 700 248 L 60 248 Z" fill="#ffffff" stroke="#f0edf9" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/><text x="120" y="236" style="font-size:9.2px;fill:#334155;text-anchor:middle">Pentane</text><text x="260" y="236" style="font-size:9.2px;fill:#334155;text-anchor:middle">C₅H₁₂</text><text x="400" y="236" style="font-size:9.2px;fill:#334155;text-anchor:middle">5</text><text x="510" y="236" style="font-size:9.2px;fill:#334155;text-anchor:middle">72</text><text x="630" y="236" style="font-size:9.2px;fill:#334155;text-anchor:middle">36</text><text x="380" y="272" style="font-size:9.2px;fill:#334155;text-anchor:middle">Each member differs from the next by one CH₂ group and 14 u — that is the definition of a homologous series.</text><text x="380" y="300" style="font-size:8.8px;fill:#475569;text-anchor:middle">Physical properties change in a smooth, regular way along the series; chemical properties stay the same because the functional group is the same.</text><text x="380" y="336" style="font-size:8.8px;fill:#475569;text-anchor:middle">Boiling point rises with molar mass because the van der Waals forces between the molecules grow.</text></svg>