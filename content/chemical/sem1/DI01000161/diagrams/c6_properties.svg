<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="100%" style="max-width:760px;height:auto;display:block;margin:0 auto;background:#ffffff" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><text x="380" y="26" style="font-size:13px;fill:#334155;text-anchor:middle;font-weight:700">PHYSICAL AND CHEMICAL PROPERTIES OF A LUBRICATING OIL</text><path d="M 30 50 L 370 50 L 370 158 L 30 158 Z" fill="#eff6ff" stroke="#e5e7eb" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/><text x="44" y="74" style="font-size:9.8px;fill:#1d4ed8;text-anchor:start;font-weight:700">Viscosity and VI</text><text x="44" y="98" style="font-size:8.6px;fill:#475569;text-anchor:start">resistance to flow and how little it changes</text><text x="44" y="114" style="font-size:8.6px;fill:#475569;text-anchor:start">with temperature</text><path d="M 390 50 L 730 50 L 730 158 L 390 158 Z" fill="#fff7ed" stroke="#e5e7eb" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/><text x="404" y="74" style="font-size:9.8px;fill:#b45309;text-anchor:start;font-weight:700">Flash and fire point</text><text x="404" y="98" style="font-size:8.6px;fill:#475569;text-anchor:start">temperature at which the vapour flashes /</text><text x="404" y="114" style="font-size:8.6px;fill:#475569;text-anchor:start">burns continuously — a safety and quality</text><text x="404" y="130" style="font-size:8.6px;fill:#475569;text-anchor:start">check</text><path d="M 30 172 L 370 172 L 370 280 L 30 280 Z" fill="#e0f2fe" stroke="#e5e7eb" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/><text x="44" y="196" style="font-size:9.8px;fill:#0891b2;text-anchor:start;font-weight:700">Cloud and pour point</text><text x="44" y="220" style="font-size:8.6px;fill:#475569;text-anchor:start">temperature at which wax clouds appear / the</text><text x="44" y="236" style="font-size:8.6px;fill:#475569;text-anchor:start">oil stops flowing — the cold-weather limit</text><path d="M 390 172 L 730 172 L 730 280 L 390 280 Z" fill="#f5f3ff" stroke="#e5e7eb" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/><text x="404" y="196" style="font-size:9.8px;fill:#7c3aed;text-anchor:start;font-weight:700">Oiliness</text><text x="404" y="220" style="font-size:8.6px;fill:#475569;text-anchor:start">the ability to stick to the metal under load,</text><text x="404" y="236" style="font-size:8.6px;fill:#475569;text-anchor:start">a boundary property</text><path d="M 30 294 L 370 294 L 370 402 L 30 402 Z" fill="#fef2f2" stroke="#e5e7eb" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/><text x="44" y="318" style="font-size:9.8px;fill:#b91c1c;text-anchor:start;font-weight:700">Saponification number</text><text x="44" y="342" style="font-size:8.6px;fill:#475569;text-anchor:start">mg of KOH needed to saponify 1 g of oil —</text><text x="44" y="358" style="font-size:8.6px;fill:#475569;text-anchor:start">vegetable oils are high, mineral oils almost</text><text x="44" y="374" style="font-size:8.6px;fill:#475569;text-anchor:start">zero</text><path d="M 390 294 L 730 294 L 730 402 L 390 402 Z" fill="#f0fdf4" stroke="#e5e7eb" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/><text x="404" y="318" style="font-size:9.8px;fill:#047857;text-anchor:start;font-weight:700">Neutralisation number</text><text x="404" y="342" style="font-size:8.6px;fill:#475569;text-anchor:start">mg of KOH needed to neutralise the free acid</text><text x="404" y="358" style="font-size:8.6px;fill:#475569;text-anchor:start">in 1 g of oil — high value means oxidised,</text><text x="404" y="374" style="font-size:8.6px;fill:#475569;text-anchor:start">corrosive oil</text><text x="380" y="420" style="font-size:9.0px;fill:#475569;text-anchor:middle">Rule of thumb: choose the lowest viscosity that still carries the load — a thicker oil than needed only wastes power.</text></svg>