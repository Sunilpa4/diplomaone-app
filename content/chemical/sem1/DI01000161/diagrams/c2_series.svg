<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 452" width="100%" style="max-width:760px;height:auto;display:block;margin:0 auto;background:#ffffff" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><text x="380" y="26" style="font-size:13px;fill:#334155;text-anchor:middle;font-weight:700">ELECTROCHEMICAL SERIES — STANDARD REDUCTION POTENTIALS AT 25 °C</text><path d="M 200 66 L 700 66 L 700 86 L 200 86 Z" fill="#f3efff" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round"/><text x="250" y="80" style="font-size:10px;fill:#7c3aed;text-anchor:middle;font-weight:700">Metal</text><text x="400" y="80" style="font-size:10px;fill:#7c3aed;text-anchor:middle;font-weight:700">Half reaction (written as reduction)</text><text x="560" y="80" style="font-size:10px;fill:#7c3aed;text-anchor:middle;font-weight:700">E° (volt)</text><text x="250" y="96" style="font-size:11px;fill:#b91c1c;text-anchor:middle;font-weight:700">Li</text><text x="400" y="96" style="font-size:10.8px;fill:#111827;text-anchor:middle">Li⁺ + e⁻ → Li</text><text x="560" y="96" style="font-size:10.8px;fill:#111827;text-anchor:middle;font-weight:700">−3.05</text><line x1="210" y1="105" x2="690" y2="105" stroke="#f0edf9" stroke-width="1.0" stroke-linecap="round"/><text x="250" y="122" style="font-size:11px;fill:#b91c1c;text-anchor:middle;font-weight:700">K</text><text x="400" y="122" style="font-size:10.8px;fill:#111827;text-anchor:middle">K⁺ + e⁻ → K</text><text x="560" y="122" style="font-size:10.8px;fill:#111827;text-anchor:middle;font-weight:700">−2.93</text><line x1="210" y1="131" x2="690" y2="131" stroke="#f0edf9" stroke-width="1.0" stroke-linecap="round"/><text x="250" y="148" style="font-size:11px;fill:#b91c1c;text-anchor:middle;font-weight:700">Ca</text><text x="400" y="148" style="font-size:10.8px;fill:#111827;text-anchor:middle">Ca²⁺ + 2e⁻ → Ca</text><text x="560" y="148" style="font-size:10.8px;fill:#111827;text-anchor:middle;font-weight:700">−2.87</text><line x1="210" y1="157" x2="690" y2="157" stroke="#f0edf9" stroke-width="1.0" stroke-linecap="round"/><text x="250" y="174" style="font-size:11px;fill:#b91c1c;text-anchor:middle;font-weight:700">Na</text><text x="400" y="174" style="font-size:10.8px;fill:#111827;text-anchor:middle">Na⁺ + e⁻ → Na</text><text x="560" y="174" style="font-size:10.8px;fill:#111827;text-anchor:middle;font-weight:700">−2.71</text><line x1="210" y1="183" x2="690" y2="183" stroke="#f0edf9" stroke-width="1.0" stroke-linecap="round"/><text x="250" y="200" style="font-size:11px;fill:#b91c1c;text-anchor:middle;font-weight:700">Mg</text><text x="400" y="200" style="font-size:10.8px;fill:#111827;text-anchor:middle">Mg²⁺ + 2e⁻ → Mg</text><text x="560" y="200" style="font-size:10.8px;fill:#111827;text-anchor:middle;font-weight:700">−2.37</text><line x1="210" y1="209" x2="690" y2="209" stroke="#f0edf9" stroke-width="1.0" stroke-linecap="round"/><text x="250" y="226" style="font-size:11px;fill:#b91c1c;text-anchor:middle;font-weight:700">Al</text><text x="400" y="226" style="font-size:10.8px;fill:#111827;text-anchor:middle">Al³⁺ + 3e⁻ → Al</text><text x="560" y="226" style="font-size:10.8px;fill:#111827;text-anchor:middle;font-weight:700">−1.66</text><line x1="210" y1="235" x2="690" y2="235" stroke="#f0edf9" stroke-width="1.0" stroke-linecap="round"/><text x="250" y="252" style="font-size:11px;fill:#1d4ed8;text-anchor:middle;font-weight:700">Zn</text><text x="400" y="252" style="font-size:10.8px;fill:#111827;text-anchor:middle">Zn²⁺ + 2e⁻ → Zn</text><text x="560" y="252" style="font-size:10.8px;fill:#111827;text-anchor:middle;font-weight:700">−0.76</text><line x1="210" y1="261" x2="690" y2="261" stroke="#f0edf9" stroke-width="1.0" stroke-linecap="round"/><text x="250" y="278" style="font-size:11px;fill:#1d4ed8;text-anchor:middle;font-weight:700">Fe</text><text x="400" y="278" style="font-size:10.8px;fill:#111827;text-anchor:middle">Fe²⁺ + 2e⁻ → Fe</text><text x="560" y="278" style="font-size:10.8px;fill:#111827;text-anchor:middle;font-weight:700">−0.44</text><line x1="210" y1="287" x2="690" y2="287" stroke="#f0edf9" stroke-width="1.0" stroke-linecap="round"/><text x="250" y="304" style="font-size:11px;fill:#047857;text-anchor:middle;font-weight:700">H₂</text><text x="400" y="304" style="font-size:10.8px;fill:#111827;text-anchor:middle">2H⁺ + 2e⁻ → H₂</text><text x="560" y="304" style="font-size:10.8px;fill:#111827;text-anchor:middle;font-weight:700">0.00</text><line x1="210" y1="313" x2="690" y2="313" stroke="#f0edf9" stroke-width="1.0" stroke-linecap="round"/><text x="250" y="330" style="font-size:11px;fill:#1d4ed8;text-anchor:middle;font-weight:700">Cu</text><text x="400" y="330" style="font-size:10.8px;fill:#111827;text-anchor:middle">Cu²⁺ + 2e⁻ → Cu</text><text x="560" y="330" style="font-size:10.8px;fill:#111827;text-anchor:middle;font-weight:700">+0.34</text><line x1="210" y1="339" x2="690" y2="339" stroke="#f0edf9" stroke-width="1.0" stroke-linecap="round"/><text x="250" y="356" style="font-size:11px;fill:#1d4ed8;text-anchor:middle;font-weight:700">Ag</text><text x="400" y="356" style="font-size:10.8px;fill:#111827;text-anchor:middle">Ag⁺ + e⁻ → Ag</text><text x="560" y="356" style="font-size:10.8px;fill:#111827;text-anchor:middle;font-weight:700">+0.80</text><line x1="210" y1="365" x2="690" y2="365" stroke="#f0edf9" stroke-width="1.0" stroke-linecap="round"/><text x="250" y="382" style="font-size:11px;fill:#1d4ed8;text-anchor:middle;font-weight:700">Au</text><text x="400" y="382" style="font-size:10.8px;fill:#111827;text-anchor:middle">Au³⁺ + 3e⁻ → Au</text><text x="560" y="382" style="font-size:10.8px;fill:#111827;text-anchor:middle;font-weight:700">+1.50</text><line x1="210" y1="391" x2="690" y2="391" stroke="#f0edf9" stroke-width="1.0" stroke-linecap="round"/><line x1="210" y1="313" x2="690" y2="313" stroke="#7c3aed" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 3"/><text x="700" y="307" style="font-size:9px;fill:#7c3aed;text-anchor:end">reference level (SHE)</text><text x="34" y="96" style="font-size:9.8px;fill:#b91c1c;text-anchor:start;font-weight:700">more reactive</text><text x="34" y="112" style="font-size:9.2px;fill:#475569;text-anchor:start">gives up electrons</text><text x="34" y="127" style="font-size:9.2px;fill:#b91c1c;text-anchor:start">easily — reducing agent</text><text x="34" y="360" style="font-size:9.8px;fill:#1d4ed8;text-anchor:start;font-weight:700">more noble</text><text x="34" y="376" style="font-size:9.2px;fill:#475569;text-anchor:start">ions take electrons</text><text x="34" y="391" style="font-size:9.2px;fill:#1d4ed8;text-anchor:start">easily — oxidising agent</text><path d="M 40 414 L 720 414 L 720 446 L 40 446 Z" fill="#faf9ff" stroke="#e6e1f4" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="56" y="434" style="font-size:10.2px;fill:#475569;text-anchor:start">A cell works only when E°cell = E°cathode − E°anode is positive;  a metal higher in the series displaces one lower down from its salt.</text></svg>