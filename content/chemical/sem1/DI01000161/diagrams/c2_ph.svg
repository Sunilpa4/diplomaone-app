roke="#ffffff" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="337.33" y="201" style="font-size:11px;fill:#334155;text-anchor:middle;font-weight:700">6</text><path d="M 358.67 150 L 401.33 150 L 401.33 180 L 358.67 180 Z" fill="#15803d" stroke="#ffffff" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="380" y="201" style="font-size:11px;fill:#ffffff;text-anchor:middle;font-weight:700">7</text><path d="M 401.33 150 L 444 150 L 444 180 L 401.33 180 Z" fill="#0f766e" stroke="#ffffff" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="422.67" y="201" style="font-size:11px;fill:#334155;text-anchor:middle;font-weight:700">8</text><path d="M 444 150 L 486.67 150 L 486.67 180 L 444 180 Z" fill="#0e7490" stroke="#ffffff" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="465.33" y="201" style="font-size:11px;fill:#334155;text-anchor:middle;font-weight:700">9</text><path d="M 486.67 150 L 529.33 150 L 529.33 180 L 486.67 180 Z" fill="#0369a1" stroke="#ffffff" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="508" y="201" style="font-size:11px;fill:#334155;text-anchor:middle;font-weight:700">10</text><path d="M 529.33 150 L 572 150 L 572 180 L 529.33 180 Z" fill="#1d4ed8" stroke="#ffffff" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="550.67" y="201" style="font-size:11px;fill:#334155;text-anchor:middle;font-weight:700">11</text><path d="M 572 150 L 614.67 150 L 614.67 180 L 572 180 Z" fill="#4338ca" stroke="#ffffff" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="593.33" y="201" style="font-size:11px;fill:#334155;text-anchor:middle;font-weight:700">12</text><path d="M 614.67 150 L 657.33 150 L 657.33 180 L 614.67 180 Z" fill="#5b21b6" stroke="#ffffff" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="636" y="201" style="font-size:11px;fill:#334155;text-anchor:middle;font-weight:700">13</text><path d="M 657.33 150 L 700 150 L 700 180 L 657.33 180 Z" fill="#6d28d9" stroke="#ffffff" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="678.67" y="201" style="font-size:11px;fill:#334155;text-anchor:middle;font-weight:700">14</text><line x1="60" y1="126" x2="354.4" y2="126" stroke="#b91c1c" stroke-width="1.4" stroke-linecap="round"/><line x1="60" y1="118" x2="60" y2="132" stroke="#b91c1c" stroke-width="1.4" stroke-linecap="round"/><line x1="354.4" y1="118" x2="354.4" y2="132" stroke="#b91c1c" stroke-width="1.4" stroke-linecap="round"/><text x="207.2" y="112" style="font-size:10.5px;fill:#b91c1c;text-anchor:middle;font-weight:700">ACIDIC   [H⁺] > [OH⁻]</text><text x="380" y="112" style="font-size:10.5px;fill:#15803d;text-anchor:middle;font-weight:700">NEUTRAL</text><line x1="439.73" y1="126" x2="700" y2="126" stroke="#1d4ed8" stroke-width="1.4" stroke-linecap="round"/><line x1="439.73" y1="118" x2="439.73" y2="132" stroke="#1d4ed8" stroke-width="1.4" stroke-linecap="round"/><line x1="700" y1="118" x2="700" y2="132" stroke="#1d4ed8" stroke-width="1.4" stroke-linecap="round"/><text x="569.87" y="112" style="font-size:10.5px;fill:#1d4ed8;text-anchor:middle;font-weight:700">BASIC   [OH⁻] > [H⁺]</text><line x1="102.67" y1="185" x2="102.67" y2="197" stroke="#111827" stroke-width="1.1" stroke-linecap="round"/><text x="102.67" y="214" style="font-size:9.2px;fill:#475569;text-anchor:middle">0.1 M HCl</text><line x1="158.13" y1="185" x2="158.13" y2="197" stroke="#111827" stroke-width="1.1" stroke-linecap="round"/><text x="158.13" y="233" style="font-size:9.2px;fill:#475569;text-anchor:middle">lemon juice</text><line x1="358.67" y1="185" x2="358.67" y2="197" stroke="#111827" stroke-width="1.1" stroke-linecap="round"/><text x="358.67" y="214" style="font-size:9.2px;fill:#475569;text-anchor:middle">pure water</text><line x1="486.67" y1="185" x2="486.67" y2="197" stroke="#111827" stroke-width="1.1" stroke-linecap="round"/><text x="486.67" y="233" style="font-size:9.2px;fill:#475569;text-anchor:middle">soap solution</text><line x1="614.67" y1="185" x2="614.67" y2="197" stroke="#111827" stroke-width="1.1" stroke-linecap="round"/><text x="614.67" y="214" style="font-size:9.2px;fill:#475569;text-anchor:middle">0.1 M NaOH</text><text x="60" y="288" style="font-size:14px;fill:#7c3aed;text-anchor:start;font-weight:700">pH = −log[H⁺]</text><text x="60" y="314" style="font-size:14px;fill:#7c3aed;text-anchor:start;font-weight:700">pOH = −log[OH⁻]</text><text x="60" y="340" style="font-size:14px;fill:#7c3aed;text-anchor:start;font-weight:700">pH + pOH = 14  (at 25 °C)</text><text x="60" y="366" style="font-size:12px;fill:#475569;text-anchor:start">[H⁺] × [OH⁻] = 10⁻¹⁴</text><rect x="330" y="262" width="322.07" height="73.2" rx="7" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1"/><text x="338" y="280.5" style="font-size:10.5px;fill:#475569;text-anchor:start">0.01 M HCl  →  [H⁺] = 10⁻²  →  pH = 2</text><text x="338" y="296" style="font-size:10.5px;fill:#475569;text-anchor:start">0.001 M NaOH  →  [OH⁻] = 10⁻³  →  pOH = 3, pH = 11</text><text x="338" y="311.5" style="font-size:10.5px;fill:#475569;text-anchor:start">0.005 M H₂SO₄  →  [H⁺] = 2 × 0.005 = 10⁻²  →  pH = 2</text><text x="338" y="327" style="font-size:10.5px;fill:#475569;text-anchor:start">One pH unit = ten times the hydrogen-ion concentration.</text></svg>