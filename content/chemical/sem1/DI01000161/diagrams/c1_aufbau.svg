<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="100%" style="max-width:760px;height:auto;display:block;margin:0 auto;background:#ffffff" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><text x="380" y="26" style="font-size:13px;fill:#334155;text-anchor:middle;font-weight:700">ORDER OF FILLING — AUFBAU, PAULI AND HUND’S RULE</text><rect x="90" y="120" width="52" height="26" rx="5" fill="#f8fafc" stroke="#111827" stroke-width="1.4"/><text x="116" y="137" style="font-size:11.5px;fill:#111827;text-anchor:middle;font-weight:700">1s</text><rect x="108" y="166" width="52" height="26" rx="5" fill="#f8fafc" stroke="#111827" stroke-width="1.4"/><text x="134" y="183" style="font-size:11.5px;fill:#111827;text-anchor:middle;font-weight:700">2s</text><rect x="176" y="166" width="52" height="26" rx="5" fill="#f8fafc" stroke="#111827" stroke-width="1.4"/><text x="202" y="183" style="font-size:11.5px;fill:#111827;text-anchor:middle;font-weight:700">2p</text><rect x="126" y="212" width="52" height="26" rx="5" fill="#f8fafc" stroke="#111827" stroke-width="1.4"/><text x="152" y="229" style="font-size:11.5px;fill:#111827;text-anchor:middle;font-weight:700">3s</text><rect x="194" y="212" width="52" height="26" rx="5" fill="#f8fafc" stroke="#111827" stroke-width="1.4"/><text x="220" y="229" style="font-size:11.5px;fill:#111827;text-anchor:middle;font-weight:700">3p</text><rect x="262" y="212" width="52" height="26" rx="5" fill="#f8fafc" stroke="#111827" stroke-width="1.4"/><text x="288" y="229" style="font-size:11.5px;fill:#111827;text-anchor:middle;font-weight:700">3d</text><rect x="144" y="258" width="52" height="26" rx="5" fill="#f8fafc" stroke="#111827" stroke-width="1.4"/><text x="170" y="275" style="font-size:11.5px;fill:#111827;text-anchor:middle;font-weight:700">4s</text><rect x="212" y="258" width="52" height="26" rx="5" fill="#f8fafc" stroke="#111827" stroke-width="1.4"/><text x="238" y="275" style="font-size:11.5px;fill:#111827;text-anchor:middle;font-weight:700">4p</text><text x="76" y="108" style="font-size:10px;fill:#475569;text-anchor:middle">energy</text><circle cx="86" cy="116" r="9" fill="#ffffff" stroke="#047857" stroke-width="1.4"/><text x="86" y="120" style="font-size:9.5px;fill:#047857;text-anchor:middle;font-weight:700">1</text><circle cx="104" cy="162" r="9" fill="#ffffff" stroke="#047857" stroke-width="1.4"/><text x="104" y="166" style="font-size:9.5px;fill:#047857;text-anchor:middle;font-weight:700">2</text><circle cx="172" cy="162" r="9" fill="#ffffff" stroke="#047857" stroke-width="1.4"/><text x="172" y="166" style="font-size:9.5px;fill:#047857;text-anchor:middle;font-weight:700">3</text><circle cx="122" cy="208" r="9" fill="#ffffff" stroke="#047857" stroke-width="1.4"/><text x="122" y="212" style="font-size:9.5px;fill:#047857;text-anchor:middle;font-weight:700">4</text><circle cx="190" cy="208" r="9" fill="#ffffff" stroke="#047857" stroke-width="1.4"/><text x="190" y="212" style="font-size:9.5px;fill:#047857;text-anchor:middle;font-weight:700">5</text><circle cx="140" cy="254" r="9" fill="#ffffff" stroke="#047857" stroke-width="1.4"/><text x="140" y="258" style="font-size:9.5px;fill:#047857;text-anchor:middle;font-weight:700">6</text><circle cx="258" cy="208" r="9" fill="#ffffff" stroke="#047857" stroke-width="1.4"/><text x="258" y="212" style="font-size:9.5px;fill:#047857;text-anchor:middle;font-weight:700">7</text><circle cx="208" cy="254" r="9" fill="#ffffff" stroke="#047857" stroke-width="1.4"/><text x="208" y="258" style="font-size:9.5px;fill:#047857;text-anchor:middle;font-weight:700">8</text><text x="380" y="330" style="font-size:11.5px;fill:#047857;text-anchor:middle;font-weight:700">Fill the boxes in the numbered order: 1s → 2s → 2p → 3s → 3p → 4s → 3d → 4p</text><text x="70" y="366" style="font-size:11.5px;fill:#1d4ed8;text-anchor:start;font-weight:700">Pauli’s exclusion principle</text><text x="70" y="384" style="font-size:10.5px;fill:#475569;text-anchor:start">No two electrons in an atom have the same four quantum numbers — an orbital takes two electrons of opposite spin (↑↓).</text><text x="70" y="410" style="font-size:11.5px;fill:#1d4ed8;text-anchor:start;font-weight:700">Hund’s rule of maximum multiplicity</text><text x="70" y="428" style="font-size:10.5px;fill:#475569;text-anchor:start">Degenerate orbitals are filled singly first, all with parallel spin, before any pairing: 2p is  ↑  ↑  ↑  and only then  ↑↓ ↑ ↑.</text><text x="70" y="454" style="font-size:10.5px;fill:#b45309;text-anchor:start">Examples:  K (19) = 1s² 2s² 2p⁶ 3s² 3p⁶ 4s¹    ·    Fe (26) = … 3d⁶ 4s²    ·    Cu (29) = … 3d¹⁰ 4s¹ (extra stability of a full d set)</text></svg>