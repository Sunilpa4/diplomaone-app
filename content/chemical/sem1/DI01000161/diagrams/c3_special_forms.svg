<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="100%" style="max-width:760px;height:auto;display:block;margin:0 auto;background:#ffffff" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><text x="380" y="26" style="font-size:13px;fill:#334155;text-anchor:middle;font-weight:700">GALVANIC, CONCENTRATION CELL, PITTING, WATER-LINE AND CREVICE CORROSION</text><path d="M 30 44 L 360 44 L 360 234 L 30 234 Z" fill="#fffdf7" stroke="#fde68a" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="195" y="66" style="font-size:10.8px;fill:#b45309;text-anchor:middle;font-weight:700">A. Galvanic (bimetallic)</text><path d="M 70 104 L 160 104 L 160 164 L 70 164 Z" fill="#cbd5e1" stroke="#111827" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><path d="M 220 104 L 310 104 L 310 164 L 220 164 Z" fill="#fde68a" stroke="#111827" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="115" y="140" style="font-size:12px;fill:#111827;text-anchor:middle;font-weight:700">Fe</text><text x="265" y="140" style="font-size:12px;fill:#111827;text-anchor:middle;font-weight:700">Cu</text><text x="115" y="184" style="font-size:9px;fill:#b91c1c;text-anchor:middle">anode — corrodes</text><text x="265" y="184" style="font-size:9px;fill:#1d4ed8;text-anchor:middle">cathode — protected</text><text x="195" y="216" style="font-size:9.2px;fill:#475569;text-anchor:middle">two metals in contact, wet joint</text><path d="M 400 44 L 730 44 L 730 234 L 400 234 Z" fill="#f5f9ff" stroke="#bfdbfe" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="565" y="66" style="font-size:10.8px;fill:#1d4ed8;text-anchor:middle;font-weight:700">B. Concentration cell</text><path d="M 430 114 L 700 114 L 700 194 L 430 194 Z" fill="#dbeafe" stroke="#111827" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="490" y="140" style="font-size:9.4px;fill:#475569;text-anchor:middle">dilute<