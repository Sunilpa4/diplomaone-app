<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="100%" style="max-width:760px;height:auto;display:block;margin:0 auto;background:#ffffff" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><text x="380" y="26" style="font-size:13px;fill:#334155;text-anchor:middle;font-weight:700">ORBIT AND ORBITAL — A FIXED PATH AGAINST A REGION OF PROBABILITY</text><circle cx="155" cy="165" r="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/><text x="155" y="169" style="font-size:13px;fill:#b91c1c;text-anchor:middle;font-weight:700">+</text><circle cx="155" cy="165" r="36" fill="none" stroke="#1d4ed8" stroke-width="1.4"/><circle cx="173" cy="133.82" r="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="3.0"/><circle cx="137" cy="196.18" r="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="3.0"/><circle cx="155" cy="165" r="62" fill="none" stroke="#1d4ed8" stroke-width="1.4"/><circle cx="205.79" cy="129.44" r="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="3.0"/><circle cx="190.56" cy="215.79" r="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="3.0"/><circle cx="104.21" cy="200.56" r="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="3.0"/><circle cx="119.44" cy="114.21" r="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="3.0"/><circle cx="155" cy="165" r="88" fill="none" stroke="#1d4ed8" stroke-width="1.4"/><circle cx="241.66" cy="149.72" r="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="3.0"/><text x="155" y="273" style="font-size:11px;fill:#475569;text-anchor:middle">Bohr orbit: a fixed circular path</text><text x="155" y="290" style="font-size:10px;fill:#6b7280;text-anchor:middle">with the electron on it (Niels Bohr, 1913)</text><circle cx="385" cy="150" r="40" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="1.6"/><text x="385" y="212" style="font-size:10.5px;fill:#475569;text-anchor:middle">1s — spherical</text><line x1="478" y1="150" x2="602" y2="150" stroke="#9aa7bd" stroke-width="1.0" stroke-linecap="round" stroke-dasharray="5 4"/><line x1="540" y1="88" x2="540" y2="212" stroke="#9aa7bd" stroke-width="1.0" stroke-linecap="round" stroke-dasharray="5 4"/><text x="540" y="82" style="font-size:10px;fill:#475569;text-anchor:middle">z</text><text x="610" y="154" style="font-size:10px;fill:#475569;text-anchor:middle">x</text><path d="M 540 150 Q 557.25 126.6 540 98 Q 522.75 126.6 540 150 Z" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="1.6" stroke-linejoin="round"/><path d="M 540 150 Q 522.75 173.4 540 202 Q 557.25 173.4 540 150 Z" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="1.6" stroke-linejoin="round"/><text x="540" y="232" style="font-size:10.5px;fill:#475569;text-anchor:middle">2p — dumb-bell, three of them</text><line x1="618" y1="150" x2="742" y2="150" stroke="#9aa7bd" stroke-width="1.0" stroke-linecap="round" stroke-dasharray="5 4"/><line x1="680" y1="88" x2="680" y2="212" stroke="#9aa7bd" stroke-width="1.0" stroke-linecap="round" stroke-dasharray="5 4"/><text x="680" y="82" style="font-size:10px;fill:#475569;text-anchor:middle">z</text><text x="750" y="154" style="font-size:10px;fill:#475569;text-anchor:middle">x</text><path d="M 680 150 Q 702.5 166.1 730 150 Q 702.5 133.9 680 150 Z" fill="#dcfce7" stroke="#047857" stroke-width="1.6" stroke-linejoin="round"/><path d="M 680 150 Q 657.5 133.9 630 150 Q 657.5 166.1 680 150 Z" fill="#dcfce7" stroke="#047857" stroke-width="1.6" stroke-linejoin="round"/><text x="680" y="232" style="font-size:10.5px;fill:#475569;text-anchor:middle">along x, y and z</text><text x="380" y="320" style="font-size:11.5px;fill:#475569;text-anchor:middle">An orbit is a line the electron travels on. An orbital is the region around the nucleus where the electron is most likely to be found.</text><text x="380" y="344" style="font-size:11.5px;fill:#475569;text-anchor:middle">Orbitals are named by a number and a letter: 1s, 2s, 2p, 3d …</text><rect x="60" y="386" width="422.25" height="57.7" rx="7" fill="#f8fafc" stroke="#9aa7bd" stroke-width="1"/><text x="68" y="404.5" style="font-size:10.5px;fill:#475569;text-anchor:start">An orbital holds a maximum of two electrons, and those two</text><text x="68" y="420" style="font-size:10.5px;fill:#475569;text-anchor:start">must have opposite spins (Pauli).</text><text x="68" y="435.5" style="font-size:10.5px;fill:#475569;text-anchor:start">s → 1 orbital (2 e⁻)     p → 3 orbitals (6 e⁻)     d → 5 orbitals (10 e⁻)</text></svg>