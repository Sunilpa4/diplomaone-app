xt><text x="62" y="198" style="font-size:9.0px;fill:#475569;text-anchor:start">wood, coal, peat</text><path d="M 50 224 L 330 224 L 330 270 L 50 270 Z" fill="#f0fdf4" stroke="#e5e7eb" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="62" y="242" style="font-size:9.2px;fill:#047857;text-anchor:start;font-weight:700">liquid</text><text x="62" y="260" style="font-size:9.0px;fill:#475569;text-anchor:start">crude petroleum</text><path d="M 50 286 L 330 286 L 330 332 L 50 332 Z" fill="#f0fdf4" stroke="#e5e7eb" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="62" y="304" style="font-size:9.2px;fill:#047857;text-anchor:start;font-weight:700">gas</text><text x="62" y="322" style="font-size:9.0px;fill:#475569;text-anchor:start">natural gas</text><line x1="570" y1="132" x2="570" y2="148" stroke="#111827" stroke-width="1.1" stroke-linecap="round"/><line x1="570" y1="148" x2="570" y2="162" stroke="#111827" stroke-width="1.1" stroke-linecap="round"/><path d="M 430 162 L 710 162 L 710 208 L 430 208 Z" fill="#faf5ff" stroke="#e5e7eb" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="442" y="180" style="font-size:9.2px;fill:#7c3aed;text-anchor:start;font-weight:700">solid</text><text x="442" y="198" style="font-size:9.0px;fill:#475569;text-anchor:start">coke, charcoal</text><path d="M 430 224 L 710 224 L 710 270 L 430 270 Z" fill="#faf5ff" stroke="#e5e7eb" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="442" y="242" style="font-size:9.2px;fill:#7c3aed;text-anchor:start;font-weight:700">liquid</text><text x="442" y="260" style="font-size:9.0px;fill:#475569;text-anchor:start">petrol, diesel, kerosene</text><path d="M 430 286 L 710 286 L 710 332 L 430 332 Z" fill="#faf5ff" stroke="#e5e7eb" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="442" y="304" style="font-size:9.2px;fill:#7c3aed;text-anchor:start;font-weight:700">gas</text><text x="442" y="322" style="font-size:9.0px;fill:#475569;text-anchor:start">LPG, CNG, producer gas, biogas</text><text x="380" y="400" style="font-size:9.4px;fill:#475569;text-anchor:middle">A fuel is burnt to give heat; a good fuel gives that heat cheaply, cleanly and completely.</text></svg>