amily="Arial,sans-serif" font-size="18" text-anchor="start" fill="#34273d">Actual plant sequencing and barriers depend on raw-water tests; physical clarification alone does not remove all salts.</text><text x="30" y="844" font-family="Arial,sans-serif" font-size="16" text-anchor="start" fill="#665a6f">Original teaching schematic • not to scale • no chemical dose, pressure or operating authorisation supplied</text></svg>