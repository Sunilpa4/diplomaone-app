d0eb" stroke-width="3"/><text x="50" y="750" font-family="Arial,sans-serif" font-size="18" text-anchor="start" fill="#34273d">Phosphate controls suitable in-boiler precipitation under an approved chemistry programme.</text><text x="50" y="775" font-family="Arial,sans-serif" font-size="18" text-anchor="start" fill="#34273d">It does not turn raw hard water into universally acceptable feedwater; no dose or boiler operation is specified.</text><text x="30" y="844" font-family="Arial,sans-serif" font-size="16" text-anchor="start" fill="#665a6f">Original teaching schematic • not to scale • no chemical dose, pressure or operating authorisation supplied</text></svg>