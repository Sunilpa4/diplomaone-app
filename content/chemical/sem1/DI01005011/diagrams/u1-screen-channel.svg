20" text-anchor="middle" fill="white">2</text><text x="442" y="572" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#34273d">Inclined bars / openings</text><circle cx="350" cy="390" r="10" fill="#bca074"/><circle cx="370" cy="415" r="10" fill="#bca074"/><circle cx="390" cy="440" r="10" fill="#bca074"/><circle cx="410" cy="390" r="10" fill="#bca074"/><circle cx="430" cy="415" r="10" fill="#bca074"/><circle cx="150" cy="465" r="18" fill="#7540a0" stroke="white" stroke-width="2"/><text x="150" y="472" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="white">3</text><text x="177" y="472" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#34273d">Retained coarse debris</text><path d="M490,400 L660,175" fill="none" stroke="#90613b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a90613b)"/><rect x="710" y="150" width="190" height="110" rx="3" fill="#f8fcfe" stroke="#665a6f" stroke-width="3"/><text x="730" y="195" font-family="Arial,sans-serif" font-size="19" text-anchor="start" fill="#34273d">Screenings bin</text><circle cx="710" cy="130" r="18" fill="#7540a0" stroke="white" stroke-width="2"/><text x="710" y="137" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="white">5</text><text x="737" y="137" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#34273d">Cleaning / collection</text><rect x="30" y="640" width="1140" height="88" rx="10" fill="#f5f0fa" stroke="#ded0eb" stroke-width="3"/><text x="50" y="670" font-family="Arial,sans-serif" font-size="18" text-anchor="start" fill="#34273d">Openings retain large material; fine colloids, dissolved salts and microbes can pass.</text><text x="50" y="695" font-family="Arial,sans-serif" font-size="18" text-anchor="start" fill="#34273d">Rakes/cleaning equipment need isolation and safe access; this is not a hands-on live-screen instruction.</text><text x="30" y="764" font-family="Arial,sans-serif" font-size="16" text-anchor="start" fill="#665a6f">Original teaching schematic • not to scale • no chemical dose, pressure or operating authorisation supplied</text></svg>