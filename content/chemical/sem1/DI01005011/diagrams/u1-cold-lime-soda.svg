roke="white" stroke-width="2"/><text x="1020" y="607" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="white">7</text><text x="1047" y="607" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#34273d">Softened water</text><path d="M790,545 L790,610 L950,610" fill="none" stroke="#90613b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a90613b)"/><circle cx="665" cy="650" r="18" fill="#7540a0" stroke="white" stroke-width="2"/><text x="665" y="657" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="white">5</text><text x="692" y="657" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#34273d">Sludge: CaCO3 + Mg(OH)2</text><rect x="30" y="690" width="1140" height="88" rx="10" fill="#f5f0fa" stroke="#ded0eb" stroke-width="3"/><text x="50" y="720" font-family="Arial,sans-serif" font-size="18" text-anchor="start" fill="#34273d">Blue: water; orange: reagents; brown: sludge. Cold train operates without a separate feed-heating stage.</text><text x="50" y="745" font-family="Arial,sans-serif" font-size="18" text-anchor="start" fill="#34273d">Reaction makes precipitates; settling and filtration remove them. Product is not automatically DM or potable.</text><text x="30" y="809" font-family="Arial,sans-serif" font-size="16" text-anchor="start" fill="#665a6f">Original teaching schematic • not to scale • no chemical dose, pressure or operating authorisation supplied</text></svg>