#ded0eb" stroke-width="3"/><text x="50" y="715" font-family="Arial,sans-serif" font-size="18" text-anchor="start" fill="#34273d">Delivered UV dose depends on flow, transmittance, shielding, lamp condition and reactor validation.</text><text x="50" y="740" font-family="Arial,sans-serif" font-size="18" text-anchor="start" fill="#34273d">The lamp remains enclosed: no viewing/exposure experiment. UV does not remove salts or provide a lasting residual.</text><text x="30" y="809" font-family="Arial,sans-serif" font-size="16" text-anchor="start" fill="#665a6f">Original teaching schematic • not to scale • no chemical dose, pressure or operating authorisation supplied</text></svg>