="382" font-family="Arial,sans-serif" font-size="23" text-anchor="start" fill="#34273d">generator</text><circle cx="65" cy="280" r="18" fill="#7540a0" stroke="white" stroke-width="2"/><text x="65" y="287" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="white">1</text><text x="92" y="287" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#34273d">Dry gas / oxygen feed</text><path d="M40,205 L40,350 L55,350" fill="none" stroke="#398374" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a398374)"/><rect x="485" y="205" width="315" height="370" rx="3" fill="#f8fcfe" stroke="#665a6f" stroke-width="3"/><rect x="488" y="308.6" width="309" height="263.4" fill="#e1f1f7"/><path d="M490,308.6 L795,308.6" fill="none" stroke="#277fa5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="485" cy="180" r="18" fill="#7540a0" stroke="white" stroke-width="2"/><text x="485" y="187" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="white">2</text><text x="512" y="187" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#34273d">Contact vessel</text><path d="M270,385 L400,385 L400,535 L485,535" fill="none" stroke="#7540a0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a7540a0)"/><path d="M485,535 L765,535" fill="none" stroke="#7540a0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="540" cy="480" r="9" fill="white" stroke="#7540a0" stroke-width="2"/><circle cx="585" cy="435" r="9" fill="white" stroke="#7540a0" stroke-width="2"/><circle cx="635" cy="375" r="9" fill="white" stroke="#7540a0" stroke-width="2"/><circle cx="710" cy="325" r="9" fill="white" stroke="#7540a0" stroke-width="2"/><circle cx="740" cy="460" r="9" fill="white" stroke="#7540a0" stroke-width="2"/><circle cx="675" cy="495" r="9" fill="white" stroke="#7540a0" stroke-width="2"/><circle cx="610" cy="290" r="9" fill="white" stroke="#7540a0" stroke-width="2"/><path d="M340,235 L485,235" fill="none" stroke="#277fa5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a277fa5)"/><text x="300" y="208" font-family="Arial,sans-serif" font-size="19" text-anchor="start" fill="#34273d">Water in</text><path d="M800,505 L1140,505" fill="none" stroke="#277fa5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a277fa5)"/><circle cx="910" cy="555" r="18" fill="#7540a0" stroke="white" stroke-width="2"/><text x="910" y="562" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="white">5</text><text x="937" y="562" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#34273d">Treated outlet</text><path d="M645,205 L645,120 L930,120" fill="none" stroke="#7540a0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a7540a0)"/><rect x="930" y="85" width="230" height="95" rx="6" fill="#e5efdf" stroke="#398374" stroke-width="3"/><text x="949" y="120" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#34273d">Off-gas destruct</text><text x="949" y="150" font-family="Arial,sans-serif" font-size="19" text-anchor="start" fill="#34273d">and safe vent</text><circle cx="850" cy="220" r="18" fill="#7540a0" stroke="white" stroke-width="2"/><text x="850" y="227" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="white">3</text><text x="877" y="227" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#34273d">Off-gas treatment</text><circle cx="485" cy="635" r="18" fill="#7540a0" stroke="white" stroke-width="2"/><text x="485" y="642" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="white">4</text><text x="512" y="642" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#34273d">Diffuser / bubbles upward</text><rect x="30" y="690" width="1140" height="88" rx="10" fill="#f5f0fa" stroke="#ded0eb" stroke-width="3"/><text x="50" y="720" font-family="Arial,sans-serif" font-size="18" text-anchor="start" fill="#34273d">Contact conditions, ozone transfer, by-products and residual/off-gas monitoring require engineered control.</text><text x="50" y="745" font-family="Arial,sans-serif" font-size="18" text-anchor="start" fill="#34273d">Ozone is hazardous to breathe and is generated in controlled equipment; no student ozone experiment is proposed.</text><text x="30" y="814" font-family="Arial,sans-serif" font-size="16" text-anchor="start" fill="#665a6f">Original teaching schematic • not to scale • no chemical dose, pressure or operating authorisation supplied</text></svg>