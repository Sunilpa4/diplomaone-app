<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-label="Two-stage compression with intercooling"><rect width="960" height="400" fill="white"/><text x="25" y="32" font-size="22" fill="#3b2948">Two-stage compression with intercooling</text><rect x="50.0" y="95" width="270.0" height="90" rx="8" fill="#f2e9f9" stroke="#a37cbf" stroke-width="2"/><text x="62.0" y="146.0" font-size="16" fill="#3b2948">Stage1:p1→p2</text><path d="M320.0 140L340.0 140" fill="none" stroke="#8b55ad" stroke-width="3"/><text x="330.0" y="146" font-size="24" fill="#3b2948">›</text><rect x="345.0" y="95" width="270.0" height="90" rx="8" fill="#f2e9f9" stroke="#a37cbf" stroke-width="2"/><text x="357.0" y="146.0" font-size="16" fill="#3b2948">Intercool / drain</text><path d="M615.0 140L635.0 140" fill="none" stroke="#8b55ad" stroke-width="3"/><text x="625.0" y="146" font-size="24" fill="#3b2948">›</text><rect x="640.0" y="95" width="270.0" height="90" rx="8" fill="#f2e9f9" stroke="#a37cbf" stroke-width="2"/><text x="652.0" y="146.0" font-size="16" fill="#3b2948">Stage2:p2→p3</text><text x="40" y="250" font-size="16" fill="#3b2948">Ideal equal-ratio result:p2=√(p1 p3),using absolute pressures.</text><text x="25" y="384" font-size="13" fill="#3b2948">Original teaching schematic • conceptual,not a fabrication / operating instruction</text></svg>