,sans-serif" font-size="20" text-anchor="middle" fill="white">4</text><text x="932" y="197" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#34273d">Outlet weir</text><path d="M360,390 L360,480" fill="none" stroke="#90613b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a90613b)"/><circle cx="360" cy="495" r="5" fill="#90613b"/><path d="M490,390 L490,480" fill="none" stroke="#90613b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a90613b)"/><circle cx="490" cy="495" r="5" fill="#90613b"/><path d="M620,390 L620,480" fill="none" stroke="#90613b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a90613b)"/><circle cx="620" cy="495" r="5" fill="#90613b"/><path d="M750,390 L750,480" fill="none" stroke="#90613b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a90613b)"/><circle cx="750" cy="495" r="5" fill="#90613b"/><path d="M875,390 L875,480" fill="none" stroke="#90613b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a90613b)"/><circle cx="875" cy="495" r="5" fill="#90613b"/><path d="M590,620 L590,665 L960,665" fill="none" stroke="#90613b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a90613b)"/><circle cx="770" cy="620" r="18" fill="#7540a0" stroke="white" stroke-width="2"/><text x="770" y="627" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="white">5</text><text x="797" y="627" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#34273d">Sludge hopper / outlet</text><rect x="30" y="710" width="1140" height="88" rx="10" fill="#f5f0fa" stroke="#ded0eb" stroke-width="3"/><text x="50" y="740" font-family="Arial,sans-serif" font-size="18" text-anchor="start" fill="#34273d">Horizontal water flow and downward particle settling occur together; avoid short-circuiting and sludge buildup.</text><text x="50" y="765" font-family="Arial,sans-serif" font-size="18" text-anchor="start" fill="#34273d">Surface overflow rate Q/A is useful for the relevant settling model; time alone does not guarantee removal.</text><text x="30" y="834" font-family="Arial,sans-serif" font-size="16" text-anchor="start" fill="#665a6f">Original teaching schematic • not to scale • no chemical dose, pressure or operating authorisation supplied</text></svg>