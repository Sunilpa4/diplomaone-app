or="start" fill="#34273d">Cation bed</text><circle cx="680" cy="200" r="18" fill="#7540a0" stroke="white" stroke-width="2"/><text x="680" y="207" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="white">3</text><text x="707" y="207" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#34273d">Degasser</text><circle cx="830" cy="595" r="18" fill="#7540a0" stroke="white" stroke-width="2"/><text x="830" y="602" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="white">4</text><text x="857" y="602" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#34273d">Anion bed</text><path d="M360,525 L440,525 L440,285 L505,285" fill="none" stroke="#277fa5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a277fa5)"/><path d="M665,525 L750,525 L750,285 L815,285" fill="none" stroke="#277fa5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a277fa5)"/><path d="M1030,525 L1170,525" fill="none" stroke="#277fa5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a277fa5)"/><circle cx="1035" cy="590" r="18" fill="#7540a0" stroke="white" stroke-width="2"/><text x="1035" y="597" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="white">5</text><text x="1062" y="597" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#34273d">DM outlet</text><path d="M450,470 L505,470" fill="none" stroke="#398374" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a398374)"/><text x="405" y="450" font-family="Arial,sans-serif" font-size="18" text-anchor="start" fill="#398374">Air</text><path d="M585,230 L585,145" fill="none" stroke="#398374" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a398374)"/><text x="530" y="117" font-family="Arial,sans-serif" font-size="19" text-anchor="start" fill="#398374">CO2 vent</text><text x="130" y="120" font-family="Arial,sans-serif" font-size="19" text-anchor="start" fill="#ba6b12">Acid regeneration</text><path d="M240,140 L240,230" fill="none" stroke="#ba6b12" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 8" marker-end="url(#aba6b12)"/><text x="800" y="120" font-family="Arial,sans-serif" font-size="19" text-anchor="start" fill="#ba6b12">Alkali regeneration</text><path d="M920,140 L920,230" fill="none" stroke="#ba6b12" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 8" marker-end="url(#aba6b12)"/><path d="M245,570 L245,575 L80,575 L80,655" fill="none" stroke="#ba6b12" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 8" marker-end="url(#aba6b12)"/><path d="M920,570 L920,575 L785,575 L785,655" fill="none" stroke="#ba6b12" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 8" marker-end="url(#aba6b12)"/><circle cx="405" cy="672" r="18" fill="#7540a0" stroke="white" stroke-width="2"/><text x="405" y="679" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="white">6</text><text x="432" y="679" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#34273d">Separate regenerant/rinse waste</text><rect x="30" y="710" width="1140" height="88" rx="10" fill="#f5f0fa" stroke="#ded0eb" stroke-width="3"/><text x="50" y="740" font-family="Arial,sans-serif" font-size="18" text-anchor="start" fill="#34273d">Optional degassing removes suitable CO2 load; it is not an ion-exchange replacement. H+ + OH− → H2O.</text><text x="50" y="765" font-family="Arial,sans-serif" font-size="18" text-anchor="start" fill="#34273d">Regeneration paths are separate alternatives to service; qualified acid/alkali handling and full rinse are essential.</text><text x="30" y="834" font-family="Arial,sans-serif" font-size="16" text-anchor="start" fill="#665a6f">Original teaching schematic • not to scale • no chemical dose, pressure or operating authorisation supplied</text></svg>