" font-family="Arial,sans-serif" font-size="19" text-anchor="start" fill="#34273d">supply</text><path d="M175,220 L175,260" fill="none" stroke="#ba6b12" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aba6b12)"/><path d="M215,282 L240,282 L240,350" fill="none" stroke="#ba6b12" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aba6b12)"/><rect x="135" y="260" width="80" height="45" rx="6" fill="#f3e6ce" stroke="#ba6b12" stroke-width="3"/><text x="142" y="290" font-family="Arial,sans-serif" font-size="16" text-anchor="start" fill="#34273d">Metering</text><circle cx="80" cy="100" r="18" fill="#7540a0" stroke="white" stroke-width="2"/><text x="80" y="107" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="white">1</text><text x="107" y="107" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#34273d">Controlled feed</text><rect x="300" y="300" width="650" height="255" rx="3" fill="#f8fcfe" stroke="#665a6f" stroke-width="3"/><rect x="303" y="371.4" width="644" height="180.6" fill="#e1f1f7"/><path d="M305,371.4 L945,371.4" fill="none" stroke="#277fa5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M35,350 L300,350" fill="none" stroke="#277fa5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a277fa5)"/><circle cx="35" cy="400" r="18" fill="#7540a0" stroke="white" stroke-width="2"/><text x="35" y="407" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="white">2</text><text x="62" y="407" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#34273d">Clarified / filtered water</text><path d="M420,300 L420,475" fill="none" stroke="#665a6f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M545,385 L545,555" fill="none" stroke="#665a6f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M670,300 L670,475" fill="none" stroke="#665a6f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M795,385 L795,555" fill="none" stroke="#665a6f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="405" cy="260" r="18" fill="#7540a0" stroke="white" stroke-width="2"/><text x="405" y="267" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="white">3</text><text x="432" y="267" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#34273d">Baffled contact tank</text><path d="M950,425 L1165,425" fill="none" stroke="#277fa5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a277fa5)"/><circle cx="970" cy="610" r="18" fill="#7540a0" stroke="white" stroke-width="2"/><text x="970" y="617" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="white">5</text><text x="997" y="617" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#34273d">Protected storage</text><circle cx="1040" cy="425" r="10" fill="white" stroke="#277fa5" stroke-width="3"/><path d="M1040,425 L1040,310" fill="none" stroke="#398374" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 8" marker-end="url(#a398374)"/><circle cx="960" cy="265" r="18" fill="#7540a0" stroke="white" stroke-width="2"/><text x="960" y="272" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="white">4</text><text x="987" y="272" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#34273d">Residual sampling</text><rect x="30" y="670" width="1140" height="88" rx="10" fill="#f5f0fa" stroke="#ded0eb" stroke-width="3"/><text x="50" y="700" font-family="Arial,sans-serif" font-size="18" text-anchor="start" fill="#34273d">Dose, demand, validated contact conditions and measured residual are different concepts.</text><text x="50" y="725" font-family="Arial,sans-serif" font-size="18" text-anchor="start" fill="#34273d">Disinfectant choice is professionally controlled; never mix bleach with acid/ammonia or make chloramine at home.</text><text x="30" y="794" font-family="Arial,sans-serif" font-size="16" text-anchor="start" fill="#665a6f">Original teaching schematic • not to scale • no chemical dose, pressure or operating authorisation supplied</text></svg>