ily="Arial,sans-serif" font-size="20" text-anchor="middle" fill="white">5</text><text x="862" y="517" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#34273d">Support / underdrain</text><path d="M560,265 L560,310" fill="none" stroke="#277fa5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a277fa5)"/><path d="M560,360 L560,545" fill="none" stroke="#277fa5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a277fa5)"/><path d="M785,590 L1150,590" fill="none" stroke="#277fa5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a277fa5)"/><circle cx="850" cy="635" r="18" fill="#7540a0" stroke="white" stroke-width="2"/><text x="850" y="642" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="white">6</text><text x="877" y="642" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#34273d">Filtered-water outlet</text><rect x="30" y="700" width="1140" height="88" rx="10" fill="#f5f0fa" stroke="#ded0eb" stroke-width="3"/><text x="50" y="730" font-family="Arial,sans-serif" font-size="18" text-anchor="start" fill="#34273d">Low loading and a developed biological surface contribute to treatment; performance is monitored.</text><text x="50" y="755" font-family="Arial,sans-serif" font-size="18" text-anchor="start" fill="#34273d">Surface cleaning/scraping may be used by the specific design; do not copy rapid-filter backwash practice.</text><text x="30" y="824" font-family="Arial,sans-serif" font-size="16" text-anchor="start" fill="#665a6f">Original teaching schematic • not to scale • no chemical dose, pressure or operating authorisation supplied</text></svg>