 cleaning, bed expansion and return-to-service depend on filter design; not a universal valve sequence.</text><text x="30" y="869" font-family="Arial,sans-serif" font-size="16" text-anchor="start" fill="#665a6f">Original teaching schematic • not to scale • no chemical dose, pressure or operating authorisation supplied</text></svg>