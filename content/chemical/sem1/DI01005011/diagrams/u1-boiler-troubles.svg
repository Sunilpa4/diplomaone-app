<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1010" role="img" aria-label="Boiler-water troubles:four distinct mechanisms"><defs><marker id="a277fa5" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#277fa5"/></marker><marker id="a7540a0" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#7540a0"/></marker><marker id="aba6b12" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#ba6b12"/></marker><marker id="a90613b" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#90613b"/></marker><marker id="ac94c46" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#c94c46"/></marker><marker id="a398374" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#398374"/></marker><marker id="a665a6f" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#665a6f"/></marker></defs><rect width="1200" height="1010" fill="white"/><text x="30" y="39" font-family="Arial,sans-serif" font-size="25" text-anchor="start" fill="#34273d">Boiler-water troubles: four distinct mechanisms</text><text x="30" y="69" font-family="Arial,sans-serif" font-size="17" text-anchor="start" fill="#665a6f">Numbered parts match the bilingual explanation. Arrows show conceptual flow, not valve-operation steps.</text><rect x="35" y="110" width="535" height="405" rx="12" fill="#fbf9fd" stroke="#c9b4d9" stroke-width="3"/><circle cx="65" cy="145" r="18" fill="#7540a0" stroke="white" stroke-width="2"/><text x="65" y="152" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="white">1</text><text x="92" y="152" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#34273d">Scale / heat-transfer loss</text><rect x="630" y="110" width="535" height="405" rx="12" fill="#fbf9fd" stroke="#c9b4d9" stroke-width="3"/><circle cx="660" cy="145" r="18" fill="#7540a0" stroke="white" stroke-width="2"/><text x="660" y="152" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="white">2</text><text x="687" y="152" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#34273d">Corrosion / local pitting</text><rect x="35" y="570" width="535" height="405" rx="12" fill="#fbf9fd" stroke="#c9b4d9" stroke-width="3"/><circle cx="65" cy="605" r="18" fill="#7540a0" stroke="white" stroke-width="2"/><text x="65" y="612" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="white">3</text><text x="92" y="612" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#34273d">Priming and foaming</text><rect x="630" y="570" width="535" height="405" rx="12" fill="#fbf9fd" stroke="#c9b4d9" stroke-width="3"/><circle cx="660" cy="605" r="18" fill="#7540a0" stroke="white" stroke-width="2"/><text x="660" y="612" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="white">4</text><text x="687" y="612" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#34273d">Caustic-related stress cracking</text><rect x="95" y="220" width="400" height="125" rx="5" fill="#d9e8ed" stroke="#665a6f" stroke-width="3"/><rect x="110" y="235" width="370" height="95" rx="5" fill="#ead5ac" stroke="#90613b" stroke-width="3"/><rect x="130" y="250" width="330" height="65" rx="3" fill="#dff1f7" stroke="#277fa5" stroke-width="3"/><text x="175" y="289" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#34273d">Water passage</text><path d="M295,400 L295,345" fill="none" stroke="#c94c46" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ac94c46)"/><text x="115" y="455" font-family="Arial,sans-serif" font-size="19" text-anchor="start" fill="#34273d">Adherent scale adds thermal resistance.</text><text x="115" y="485" font-family="Arial,sans-serif" font-size="18" text-anchor="start" fill="#34273d">Metal can overheat at the same duty.</text><rect x="690" y="245" width="410" height="110" rx="3" fill="#e4e3e6" stroke="#665a6f" stroke-width="3"/><path d="M710,245 L740,245 Q755,305 775,245 L850,245 Q870,330 895,245 L1080,245" fill="#cfe6ee" stroke="#277fa5" stroke-width="3"/><text x="710" y="405" font-family="Arial,sans-serif" font-size="19" text-anchor="start" fill="#34273d">Water / gas interaction with metal</text><text x="710" y="455" font-family="Arial,sans-serif" font-size="19" text-anchor="start" fill="#34273d">Pits are local metal loss; control</text><text x="710" y="485" font-family="Arial,sans-serif" font-size="19" text-anchor="start" fill="#34273d">oxygen / chemistry as required.</text><rect x="95" y="675" width="380" height="195" rx="3" fill="#f8fcfe" stroke="#665a6f" stroke-width="3"/><rect x="98" y="729.6" width="374" height="137.4" fill="#e1f1f7"/><path d="M100,729.6 L470,729.6" fill="none" stroke="#277fa5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M475,705 L535,705 L535,650" fill="none" stroke="#277fa5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a277fa5)"/><text x="120" y="650" font-family="Arial,sans-serif" font-size="18" text-anchor="start" fill="#34273d">Water droplets with steam ↑</text><circle cx="125" cy="730" r="13" fill="white" stroke="#277fa5" stroke-width="2"/><circle cx="159" cy="748" r="13" fill="white" stroke="#277fa5" stroke-width="2"/><circle cx="193" cy="730" r="13" fill="white" stroke="#277fa5" stroke-width="2"/><circle cx="227" cy="748" r="13" fill="white" stroke="#277fa5" stroke-width="2"/><circle cx="261" cy="730" r="13" fill="white" stroke="#277fa5" stroke-width="2"/><circle cx="295" cy="748" r="13" fill="white" stroke="#277fa5" stroke-width="2"/><circle cx="329" cy="730" r="13" fill="white" stroke="#277fa5" stroke-width="2"/><circle cx="363" cy="748" r="13" fill="white" stroke="#277fa5" stroke-width="2"/><circle cx="397" cy="730" r="13" fill="white" stroke="#277fa5" stroke-width="2"/><text x="105" y="920" font-family="Arial,sans-serif" font-size="19" text-anchor="start" fill="#34273d">Foam can promote liquid carryover.</text><text x="105" y="950" font-family="Arial,sans-serif" font-size="18" text-anchor="start" fill="#34273d">Control level, load, solids and organics.</text><rect x="700" y="705" width="390" height="125" rx="3" fill="#e6e3e8" stroke="#665a6f" stroke-width="3"/><path d="M900,705 L880,735 L910,760 L888,790 L900,830" fill="none" stroke="#90613b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M680,765 L625,765" fill="none" stroke="#665a6f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a665a6f)"/><path d="M1100,765 L1155,765" fill="none" stroke="#665a6f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a665a6f)"/><text x="725" y="675" font-family="Arial,sans-serif" font-size="19" text-anchor="start" fill="#34273d">Local concentration + stress</text><text x="710" y="920" font-family="Arial,sans-serif" font-size="18" text-anchor="start" fill="#34273d">Cracking requires susceptible conditions;</text><text x="710" y="950" font-family="Arial,sans-serif" font-size="18" text-anchor="start" fill="#34273d">not every alkaline water cracks all steel.</text><text x="30" y="994" font-family="Arial,sans-serif" font-size="16" text-anchor="start" fill="#665a6f">Original teaching schematic • not to scale • no chemical dose, pressure or operating authorisation supplied</text></svg>