<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7452a4"/></marker></defs><rect width="1000" height="560" fill="#faf7ff"/><text x="35" y="40" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#3f3150">Paint system: each layer has a role</text><text x="35" y="73" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#5c5863">Conceptual teaching schematic • not an engineering/operating drawing</text><text x="35" y="548" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#5c5863">Matching explanations are in the Notes. Conceptual and not to scale.</text><rect x="110" y="170" width="500" height="70" fill="#b8e5e8" stroke="#7452a4" stroke-width="3" rx="5"/><text x="645" y="211.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#3f3150">Topcoat: exposure/finish</text><rect x="110" y="240" width="500" height="65" fill="#e9dff6" stroke="#7452a4" stroke-width="3" rx="5"/><text x="645" y="278.5" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#3f3150">Intermediate: barrier/build</text><rect x="110" y="305" width="500" height="50" fill="#e6a7bf" stroke="#7452a4" stroke-width="3" rx="5"/><text x="645" y="336.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#3f3150">Primer: adhesion/protection</text><rect x="110" y="355" width="500" height="100" fill="#d6d8e2" stroke="#7452a4" stroke-width="3" rx="5"/><text x="645" y="411.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#3f3150">Prepared substrate</text><text x="150" y="505" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#3f3150">Selection, surface preparation and complete cure govern performance.</text></svg>