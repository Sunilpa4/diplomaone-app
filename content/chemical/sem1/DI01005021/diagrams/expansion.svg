<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7452a4"/></marker></defs><rect width="1000" height="560" fill="#faf7ff"/><text x="35" y="40" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#3f3150">Free linear thermal expansion</text><text x="35" y="73" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#5c5863">Conceptual teaching schematic • not an engineering/operating drawing</text><text x="35" y="548" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#5c5863">Matching explanations are in the Notes. Conceptual and not to scale.</text><rect x="160" y="175" width="610" height="65" fill="#e9dff6" stroke="#7452a4" stroke-width="3" rx="5"/><rect x="160" y="330" width="700" height="65" fill="#b8e5e8" stroke="#7452a4" stroke-width="3" rx="5"/><text x="160" y="150" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#3f3150">Initial: L0 at T1</text><text x="160" y="305" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#3f3150">Heated: L at T2 &gt; T1</text><path d="M770 245L770 420" fill="none" stroke="#7452a4" stroke-width="3" stroke-dasharray="8 7"/><path d="M860 400L860 450" fill="none" stroke="#7452a4" stroke-width="3" stroke-dasharray="8 7"/><path d="M770 440L860 440" fill="none" stroke="#7452a4" stroke-width="3"/><text x="780" y="478" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#3f3150">ΔL</text><text x="220" y="505" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#3f3150">ΔL ≈ αL0ΔT • free, small expansion</text></svg>