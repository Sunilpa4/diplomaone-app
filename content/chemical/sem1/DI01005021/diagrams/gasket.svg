<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7452a4"/></marker></defs><rect width="1000" height="560" fill="#faf7ff"/><text x="35" y="40" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#3f3150">Gasket between stationary flange faces: section sketch</text><text x="35" y="73" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#5c5863">Conceptual teaching schematic • not an engineering/operating drawing</text><text x="35" y="548" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#5c5863">Matching explanations are in the Notes. Conceptual and not to scale.</text><rect x="260" y="155" width="210" height="250" fill="#d6d8e2" stroke="#7452a4" stroke-width="3" rx="5"/><rect x="500" y="155" width="210" height="250" fill="#d6d8e2" stroke="#7452a4" stroke-width="3" rx="5"/><rect x="470" y="155" width="30" height="65" fill="#e6a7bf" stroke="#7452a4" stroke-width="3" rx="5"/><rect x="470" y="340" width="30" height="65" fill="#e6a7bf" stroke="#7452a4" stroke-width="3" rx="5"/><rect x="200" y="220" width="570" height="120" fill="#b8e5e8" stroke="#7452a4" stroke-width="3" rx="5"/><rect x="195" y="175" width="580" height="20" fill="#d6d8e2" stroke="#7452a4" stroke-width="3" rx="5"/><rect x="195" y="365" width="580" height="20" fill="#d6d8e2" stroke="#7452a4" stroke-width="3" rx="5"/><text x="230" y="125" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#3f3150">1 Flanges</text><text x="525" y="125" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#3f3150">2 Gasket</text><path d="M575 132L490 155" fill="none" stroke="#7452a4" stroke-width="3"/><text x="800" y="190" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#3f3150">3 Bolts</text><text x="805" y="290" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#3f3150">4 Bore</text><path d="M775 285L680 285" fill="none" stroke="#7452a4" stroke-width="3"/><path d="M70 280L185 280" fill="none" stroke="#7452a4" stroke-width="3" marker-end="url(#a)"/><text x="80" y="320" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#3f3150">Fluid</text><text x="120" y="475" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#3f3150">Bolting compresses the seal; contact stress must suit the design.</text></svg>