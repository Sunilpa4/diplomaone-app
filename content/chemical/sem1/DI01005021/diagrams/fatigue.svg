<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7452a4"/></marker></defs><rect width="1000" height="560" fill="#faf7ff"/><text x="35" y="40" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#3f3150">Fatigue: cycles and crack growth</text><text x="35" y="73" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#5c5863">Conceptual teaching schematic • not an engineering/operating drawing</text><text x="35" y="548" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#5c5863">Matching explanations are in the Notes. Conceptual and not to scale.</text><path d="M75 265L470 265" fill="none" stroke="#7452a4" stroke-width="3"/><path d="M80 265Q110 150 140 265T200 265T260 265T320 265T380 265T440 265" fill="none" stroke="#7452a4" stroke-width="4"/><text x="100" y="135" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#3f3150">Repeated stress</text><text x="100" y="390" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#3f3150">Cycles → crack initiation</text><rect x="555" y="185" width="345" height="125" fill="#e9dff6" stroke="#7452a4" stroke-width="3" rx="5"/><path d="M555 240L630 240L655 220L690 240L730 215L770 230" fill="none" stroke="#c94a69" stroke-width="4"/><text x="570" y="350" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#3f3150">Crack growth each cycle</text><text x="120" y="470" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#3f3150">Final fracture when the remaining section can no longer carry the load.</text></svg>