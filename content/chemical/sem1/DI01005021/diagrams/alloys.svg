<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7452a4"/></marker></defs><rect width="1000" height="560" fill="#faf7ff"/><text x="35" y="40" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#3f3150">Alloys: classify first by the principal metal</text><text x="35" y="73" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#5c5863">Conceptual teaching schematic • not an engineering/operating drawing</text><text x="35" y="548" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#5c5863">Matching explanations are in the Notes. Conceptual and not to scale.</text><rect x="370" y="120" width="260" height="60" fill="#e9dff6" stroke="#7452a4" stroke-width="3" rx="5"/><text x="465" y="158" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#3f3150">Alloys</text><path d="M400 180L250 265" fill="none" stroke="#7452a4" stroke-width="3" marker-end="url(#a)"/><path d="M600 180L750 265" fill="none" stroke="#7452a4" stroke-width="3" marker-end="url(#a)"/><rect x="80" y="285" width="360" height="140" fill="#e9dff6" stroke="#7452a4" stroke-width="3" rx="5"/><rect x="560" y="285" width="360" height="140" fill="#e9dff6" stroke="#7452a4" stroke-width="3" rx="5"/><text x="185" y="320" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#3f3150">Ferrous</text><text x="110" y="360" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#3f3150">Iron is the base metal</text><text x="110" y="395" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#3f3150">Steel • cast iron • stainless</text><text x="650" y="320" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#3f3150">Non-ferrous</text><text x="590" y="360" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#3f3150">Another base metal</text><text x="590" y="395" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#3f3150">Brass • bronze • Monel • Al</text><text x="160" y="490" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#3f3150">Structure-based classification is a separate axis; see Notes.</text></svg>