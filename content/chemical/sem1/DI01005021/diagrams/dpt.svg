<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7452a4"/></marker></defs><rect width="1000" height="560" fill="#faf7ff"/><text x="35" y="40" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#3f3150">Visible dye penetrant: surface-connected flaw</text><text x="35" y="73" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#5c5863">Conceptual teaching schematic • not an engineering/operating drawing</text><text x="35" y="548" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#5c5863">Matching explanations are in the Notes. Conceptual and not to scale.</text><text x="45" y="150" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#3f3150">1 Clean/dry</text><rect x="45" y="260" width="200" height="110" fill="#b8e5e8" stroke="#7452a4" stroke-width="3" rx="5"/><path d="M140 260L150 300L143 335" fill="none" stroke="#c94a69" stroke-width="7"/><path d="M250 315L275 315" fill="none" stroke="#7452a4" stroke-width="3" marker-end="url(#a)"/><text x="285" y="150" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#3f3150">2 Penetrant</text><rect x="285" y="260" width="200" height="110" fill="#e6a7bf" stroke="#7452a4" stroke-width="3" rx="5"/><path d="M380 260L390 300L383 335" fill="none" stroke="#c94a69" stroke-width="7"/><path d="M285 249L485 249" fill="none" stroke="#c94a69" stroke-width="3"/><path d="M490 315L515 315" fill="none" stroke="#7452a4" stroke-width="3" marker-end="url(#a)"/><text x="525" y="150" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#3f3150">3 Remove excess</text><rect x="525" y="260" width="200" height="110" fill="#b8e5e8" stroke="#7452a4" stroke-width="3" rx="5"/><path d="M620 260L630 300L623 335" fill="none" stroke="#c94a69" stroke-width="7"/><path d="M730 315L755 315" fill="none" stroke="#7452a4" stroke-width="3" marker-end="url(#a)"/><text x="765" y="150" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#3f3150">4 Developer</text><rect x="765" y="260" width="200" height="110" fill="#f7eecb" stroke="#7452a4" stroke-width="3" rx="5"/><path d="M860 260L870 300L863 335" fill="none" stroke="#c94a69" stroke-width="7"/><rect x="765" y="230" width="200" height="26" fill="#fff4cf" stroke="#7452a4" stroke-width="3" rx="5"/><circle cx="861" cy="236" r="13" fill="#e6a7bf" stroke="#7452a4" stroke-width="2"/><text x="90" y="440" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#3f3150">5 Inspect bleed-out indication → evaluate → record → postclean</text><text x="90" y="485" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#3f3150">Only surface-open flaws in suitable nonporous materials.</text></svg>