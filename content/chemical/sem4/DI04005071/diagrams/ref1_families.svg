<svg xmlns="http://www.w3.org/2000/svg" width="360" height="344" viewBox="0 0 360 344" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="344" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">The four hydrocarbon families in crude</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Same elements — different structures, different products</text><rect x="12" y="46" width="164" height="138" rx="6" fill="#FBFAFF" stroke="#C9BCE0" stroke-width="1.1"/><text x="94" y="62" font-size="9.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Paraffins  CₙH₂ₙ₊₂</text><text x="94" y="174" font-size="7.3" fill="#555555" text-anchor="middle">straight / branched chains — petrol, LPG</text><rect x="184" y="46" width="164" height="138" rx="6" fill="#FBFAFF" stroke="#C9BCE0" stroke-width="1.1"/><text x="266" y="62" font-size="9.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Naphthenes  CₙH₂ₙ</text><text x="266" y="174" font-size="7.3" fill="#555555" text-anchor="middle">saturated rings — stable, in most crudes</text><rect x="12" y="196" width="164" height="138" rx="6" fill="#FBFAFF" stroke="#C9BCE0" stroke-width="1.1"/><text x="94" y="212" font-size="9.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Aromatics</text><text x="94" y="324" font-size="7.3" fill="#555555" text-anchor="middle">benzene rings — high octane, solvents</text><rect x="184" y="196" width="164" height="138" rx="6" fill="#FBFAFF" stroke="#C9BCE0" stroke-width="1.1"/><text x="266" y="212" font-size="9.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Resins &amp; asphaltenes</text><text x="266" y="324" font-size="7.3" fill="#555555" text-anchor="middle">big fused-ring sheets — residue, bitumen</text><line x1="30" y1="120" x2="52" y2="100" stroke="#2F5D8A" stroke-width="2.2"/><line x1="52" y1="100" x2="74" y2="120" stroke="#2F5D8A" stroke-width="2.2"/><line x1="74" y1="120" x2="96" y2="100" stroke="#2F5D8A" stroke-width="2.2"/><line x1="96" y1="100" x2="118" y2="120" stroke="#2F5D8A" stroke-width="2.2"/><line x1="118" y1="120" x2="140" y2="100" stroke="#2F5D8A" stroke-width="2.2"/><line x1="140" y1="100" x2="158" y2="112" stroke="#2F5D8A" stroke-width="2.2"/><text x="30" y="132" font-size="8" fill="#2F5D8A" text-anchor="middle" font-weight="bold">CH₃</text><text x="160" y="124" font-size="8" fill="#2F5D8A" text-anchor="middle" font-weight="bold">CH₃</text><text x="94" y="88" font-size="7.5" fill="#5A5A5A" text-anchor="middle">chain of C–C single bonds</text><polygon points="292.0,93.0 292.0,123.0 266.0,138.0 240.0,123.0 240.0,93.0 266.0,78.0" fill="#EFF6EE" stroke="#2E7D32" stroke-width="1.6"/><text x="266" y="88" font-size="7.5" fill="#5A5A5A" text-anchor="middle">ring</text><text x="266" y="112" font-size="9" fill="#2E7D32" text-anchor="middle" font-weight="bold">C</text><polygon points="120.0,243.0 120.0,273.0 94.0,288.0 68.0,273.0 68.0,243.0 94.0,228.0" fill="#FFF6EC" stroke="#B66A00" stroke-width="1.6"/><circle cx="94" cy="258" r="17" fill="none" stroke="#B66A00" stroke-widt