<svg xmlns="http://www.w3.org/2000/svg" width="360" height="290" viewBox="0 0 360 290" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="290" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Ethylene oxide from ethylene</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 5.3(b): direct oxidation over silver</text><line x1="8" y1="120" x2="64" y2="120" stroke="#1565C0" stroke-width="1.6"/><polygon points="64.0,120.0 56.0,116.4 56.0,123.6" fill="#1565C0"/><text x="2" y="104" font-size="7.5" fill="#1565C0" text-anchor="start" font-weight="bold">ethylene + O₂</text><text x="6" y="136" font-size="7.5" fill="#5A5A5A" text-anchor="start">+ ballast gas</text><rect x="64" y="78" width="74" height="92" rx="2" fill="#FDF6EC" stroke="#B66A00" stroke-width="1.7"/><line x1="76" y1="86" x2="76" y2="162" stroke="#B66A00" stroke-width="1.6"/><line x1="89" y1="86" x2="89" y2="162" stroke="#B66A00" stroke-width="1.6"/><line x1="102" y1="86" x2="102" y2="162" stroke="#B66A00" stroke-width="1.6"/><line x1="115" y1="86" x2="115" y2="162" stroke="#B66A00" stroke-width="1.6"/><line x1="128" y1="86" x2="128" y2="162" stroke="#B66A00" stroke-width="1.6"/><circle cx="60" cy="96" r="2.5" fill="#fff" stroke="#B66A00" stroke-width="0.8"/><text x="101" y="70" font-size="8.5" fill="#B66A00" text-anchor="middle" font-weight="bold">tubular reactor</text><text x="101" y="182" font-size="7.5" fill="#5A5A5A" text-anchor="middle">Ag catalyst tubes, cooled</text><line x1="138" y1="118" x2="148" y2="118" stroke="#B66A00" stroke-width="1.6"/><polygon points="148.0,118.0 140.0,114.4 140.0,121.6" fill="#B66A00"/><path d="M148,78 A25.0,12 0 0 1 198,78 V196 H148 Z" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.6"/><line x1="151" y1="92.0" x2="195" y2="92.0" stroke="#7FA6C9" stroke-width="1.1"/><line x1="151" y1="110.0" x2="195" y2="110.0" stroke="#7FA6C9" stroke-width="1.1"/><line x1="151" y1="128.0" x2="195" y2="128.0" stroke="#7FA6C9" stroke-width="1.1"/><line x1="151" y1="146.0" x2="195" y2="146.0" stroke="#7FA6C9" stroke-width="1.1"/><line x1="151" y1="164.0" x2="195" y2="164.0" stroke="#7FA6C9" stroke-width="1.1"/><line x1="151" y1="182.0" x2="195" y2="182.0" stroke="#7FA6C9" stroke-width="1.1"/><rect x="163.0" y="196" width="20.0" height="7" rx="1" fill="#C9D6E4" stroke="#2F5D8A" stroke-width="1.1"/><text x="173" y="84" font-size="8.5" fill="#2F5D8A" text-anchor="middle" font-weight="bold">absorber</text><text x="173" y="96" font-size="7" fill="#5A5A5A" text-anchor="middle">(water)</text><line x1="173" y1="196" x2="173" y2="222" stroke="#2E7D32" stroke-width="1.6"/><polygon points="173.0,222.0 176.6,214.0 169.4,214.0" fill="#2E7D32"/><path d="M154.0,222 H192.0 A14.0,14.0 0 0 1 192.0,250 H154.0 A14.0,14.0 0 0 1 154.0,222 Z" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.6"/><text x="210" y="232" font-size="8.5" fill="#2E7D32" text-anchor="start" font-weight="bold">EO solution → purification</text><text x="210" y="246" font-size="7.5" fill="#5A5A5A" text-anchor="start">(part → ethylene glycol)</text><line x1="160" y1="66" x2="160" y2="44" stroke="#BD2543" stroke-width="1.6" stroke-dasharray="5,3"/><line x1="160" y1="44" x2="90" y2="44" stroke="#BD2543" stroke-width="1.6" stroke-dasharray="5,3"/><line x1="90" y1="44" x2="90" y2="74" stroke="#BD2543" stroke-width="1.6" stroke-dasharray="5,3"/><polygon points="90.0,74.0 93.6,66.0 86.4,66.0" fill="#BD2543"/><text x="64" y="60" font-size="7.5" fill="#BD2543" text-anchor="start" font-weight="bold">unconverted ethylene recycled</text><rect x="246" y="92" width="100" height="56" rx="5" fill="#FDF1F2" stroke="#BD2543" stroke-width="1.1"/><text x="296" y="106" font-size="8" fill="#BD2543" text-anchor="middle" font-weight="bold">the enemy reaction:</text><text x="296" y="121" font-size="7.0" fill="#BD2543" text-anchor="middle" font-weight="bold">C₂H₄ + 3O₂ → 2CO₂ + 2H₂O</text><text x="296" y="136" font-size="7.3" fill="#5A5A5A" text-anchor="middle">wastes feed, adds heat</text><line x1="198" y1="110" x2="248" y2="110" stroke="#BD2543" stroke-width="1.6" stroke-dasharray="3,3"/><polygon points="248.0,110.0 240.0,106.4 240.0,113.6" fill="#BD2543"/><text x="180" y="282" font-size="8" fill="#666666" text-anchor="middle" font-style="italic">Selectivity is everything: stop at the epoxide, never burn to CO₂</text></svg>