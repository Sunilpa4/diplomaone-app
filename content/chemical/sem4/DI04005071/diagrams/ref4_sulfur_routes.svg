<svg xmlns="http://www.w3.org/2000/svg" width="360" height="330" viewBox="0 0 360 330" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="330" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Removing sulfur: three depths</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 4.1–4.2: choose by how much sulfur must go</text><rect x="12" y="52" width="336" height="76" rx="6" fill="#FBFAFF" stroke="#C9BCE0" stroke-width="1.1"/><path d="M36.0,70 H62.0 A10.0,10.0 0 0 1 62.0,90 H36.0 A10.0,10.0 0 0 1 36.0,70 Z" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.6"/><circle cx="50" cy="108" r="7" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5"/><path d="M45,113 L55,108 L45,103 Z" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="0.9"/><text x="50" y="126" font-size="7.5" fill="#2F5D8A" text-anchor="middle" font-weight="bold">P</text><text x="96" y="74" font-size="10" fill="#B66A00" text-anchor="start" font-weight="bold">Sweetening — Doctor / MEROX</text><text x="96" y="92" font-size="8.3" fill="#272134" text-anchor="start">Mercaptans → disulfides: odour and corrosion cured.</text><text x="96" y="108" font-size="8.3" fill="#555555" text-anchor="start">Sulfur stays in the fuel — cheapest, shallowest.</text><rect x="12" y="136" width="336" height="76" rx="6" fill="#FBFAFF" stroke="#C9BCE0" stroke-width="1.1"/><path d="M38,154 A13.0,12 0 0 1 64,154 V188 H38 Z" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.6"/><line x1="41" y1="168.0" x2="61" y2="168.0" stroke="#7FA6C9" stroke-width="1.1"/><line x1="41" y1="170.0" x2="61" y2="170.0" stroke="#7FA6C9" stroke-width="1.1"/><line x1="41" y1="172.0" x2="61" y2="172.0" stroke="#7FA6C9" stroke-width="1.1"/><line x1="41" y1="174.0" x2="61" y2="174.0" stroke="#7FA6C9" stroke-width="1.1"/><rect x="45.8" y="188" width="10.4" height="7" rx="1" fill="#C9D6E4" stroke="#2F5D8A" stroke-width="1.1"/><text x="96" y="158" font-size="10" fill="#2F5D8A" text-anchor="start" font-weight="bold">Extractive treatment — caustic / SO₂</text><text x="96" y="176" font-size="8.3" fill="#272134" text-anchor="start">Solvent dissolves part of the S compounds + aromatics.</text><text x="96" y="192" font-size="8.3" fill="#555555" text-anchor="start">Deeper; solvent must be recovered and recycled.</text><rect x="12" y="220" width="336" height="76" rx="6" fill="#FBFAFF" stroke="#C9BCE0" stroke-width="1.1"/><path d="M34,236 A17.0,10 0 0 1 68,236 V256 A17.0,10 0 0 1 34,256 Z" fill="#FDF6EC" stroke="#B66A00" stroke-width="1.6"/><rect x="37" y="237.0" width="28" height="18" rx="2" fill="#F6C98B" stroke="#B66A00" stroke-width="1.0"/><text x="51.0" y="249.0" font-size="7.5" fill="#B66A00" text-anchor="middle" font-weight="bold">cat</text><text x="80" y="240" font-size="10" fill="#BD2543" text-anchor="middle" font-weight="bold">H₂</text><text x="96" y="242" font-size="10" fill="#2E7D32" text-anchor="start" font-weight="bold">Catalytic desulfurisation (HDS)</text><text x="96" y="260" font-size="8.3" fill="#272134" text-anchor="start">All sulfur forms → H₂S, then sulfur recovery.</text><text x="96" y="276" font-size="8.3" fill="#555555" text-anchor="start">Deepest — the only route to ultra-low-sulfur fuels.</text><line x1="353" y1="290" x2="353" y2="70" stroke="#BD2543" stroke-width="1.6"/><polygon points="353.0,70.0 349.4,78.0 356.6,78.0" fill="#BD2543"/><text x="338" y="300" font-size="7.5" fill="#BD2543" text-anchor="end" font-weight="bold">cost &amp; depth rise</text></svg>