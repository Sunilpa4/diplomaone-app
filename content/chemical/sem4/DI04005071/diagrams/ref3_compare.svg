<svg xmlns="http://www.w3.org/2000/svg" width="360" height="330" viewBox="0 0 360 330" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="330" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Three ways to crack</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 3.1: thermal vs catalytic compared</text><rect x="12" y="52" width="336" height="76" rx="6" fill="#FBFAFF" stroke="#C9BCE0" stroke-width="1.1"/><rect x="26" y="66" width="44" height="34" rx="2" fill="#FDF1E3" stroke="#B66A00" stroke-width="1.7"/><line x1="32" y1="76" x2="64" y2="76" stroke="#B66A00" stroke-width="2.2"/><line x1="32" y1="84" x2="64" y2="84" stroke="#B66A00" stroke-width="2.2"/><line x1="32" y1="92" x2="64" y2="92" stroke="#B66A00" stroke-width="2.2"/><path d="M35.0,100 L40.0,84 L45.0,100 Z" fill="#F4A259" stroke="#B66A00" stroke-width="0.8"/><rect x="34.0" y="97" width="12" height="4" rx="1" fill="#8A8A8A" stroke="#5A5A5A" stroke-width="0.7"/><path d="M51.0,100 L56.0,84 L61.0,100 Z" fill="#F4A259" stroke="#B66A00" stroke-width="0.8"/><rect x="50.0" y="97" width="12" height="4" rx="1" fill="#8A8A8A" stroke="#5A5A5A" stroke-width="0.7"/><path d="M38.0,108 H62.0 A8.0,8.0 0 0 1 62.0,124 H38.0 A8.0,8.0 0 0 1 38.0,108 Z" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.6"/><text x="96" y="74" font-size="10" fill="#B66A00" text-anchor="start" font-weight="bold">Thermal cracking (visbreaking, coking)</text><text x="96" y="92" font-size="8.3" fill="#272134" text-anchor="start">Heat alone breaks the molecules; carbon rejected as coke.</text><text x="96" y="108" font-size="8.3" fill="#555555" text-anchor="start">Simple and robust — but petrol is olefinic, lower octane.</text><rect x="12" y="136" width="336" height="76" rx="6" fill="#FBFAFF" stroke="#C9BCE0" stroke-width="1.1"/><path d="M30,156 A13.0,10 0 0 1 56,156 V176 A13.0,10 0 0 1 30,176 Z" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.6"/><path d="M60,156 A13.0,10 0 0 1 86,156 V176 A13.0,10 0 0 1 60,176 Z" fill="#FDECEF" stroke="#BD2543" stroke-width="1.6"/><text x="96" y="158" font-size="10" fill="#2F5D8A" text-anchor="start" font-weight="bold">FCC (catalytic, no hydrogen)</text><text x="96" y="176" font-size="8.3" fill="#272134" text-anchor="start">Zeolite catalyst, seconds of contact in a riser.</text><text x="96" y="192" font-size="8.3" fill="#555555" text-anchor="start">Branched high-octane petrol + propylene feedstock.</text><rect x="12" y="220" width="336" height="76" rx="6" fill="#FBFAFF" stroke="#C9BCE0" stroke-width="1.1"/><path d="M34,240 A17.0,10 0 0 1 68,240 V260 A17.0,10 0 0 1 34,260 Z" fill="#FDF6EC" stroke="#B66A00" stroke-width="1.6"/><rect x="37" y="241.0" width="28" height="18" rx="2" fill="#F6C98B" stroke="#B66A00" stroke-width="1.0"/><text x="51.0" y="253.0" font-size="7.5" fill="#B66A00" text-anchor="middle" font-weight="bold">cat</text><text x="78" y="240" font-size="10" fill="#BD2543" text-anchor="middle" font-weight="bold">H₂</text><text x="96" y="242" font-size="10" fill="#2E7D32" text-anchor="start" font-weight="bold">Hydrocracking (catalytic + hydrogen)</text><text x="96" y="260" font-size="8.3" fill="#272134" text-anchor="start">High-pressure H₂ saturates while cracking; S, N removed.</text><text x="96" y="276" font-size="8.3" fill="#555555" text-anchor="start">Clean diesel / kerosene; costly hydrogen, heavy vessels.</text><text x="180" y="322" font-size="8" fill="#666666" text-anchor="middle" font-style="italic">Same aim — smaller molecules — three different selectivities</text></svg>