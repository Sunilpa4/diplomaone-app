<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 672" font-family="Arial, Helvetica, sans-serif"><rect width="960" height="672" fill="#ffffff"/><text x="24.0" y="36.6" font-family="Arial, Helvetica, sans-serif" font-size="19" text-anchor="start" fill="#6420B8" font-weight="bold">What each pollutant does, and at what concentration</text><rect x="30" y="84" width="900" height="34" rx="5" fill="#EADDF7" stroke="none" stroke-width="1.8"/><text x="42.0" y="109.8" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#6420B8" font-weight="bold">POLLUTANT</text><text x="250.0" y="109.8" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#6420B8" font-weight="bold">MEDIUM</text><text x="400.0" y="109.8" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#6420B8" font-weight="bold">EFFECT</text><text x="760.0" y="109.8" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#6420B8" font-weight="bold">TYPICAL LIMIT</text><rect x="30" y="122" width="900" height="50" rx="4" fill="#FFFFFF" stroke="#B9A6CE" stroke-width="1.1"/><rect x="30" y="122" width="5" height="50" rx="2" fill="#C2185B" stroke="none" stroke-width="0"/><text x="46.0" y="148.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#C2185B" font-weight="bold">SO₂</text><text x="250.0" y="147.8" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#222222" font-weight="normal">air</text><text x="400.0" y="147.8" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#222222" font-weight="normal">bronchospasm, acid rain, stone corrosion</text><text x="760.0" y="147.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#6B6275" font-weight="normal">80 μg/m³ annual</text><rect x="30" y="178" width="900" height="50" rx="4" fill="#FFFFFF" stroke="#B9A6CE" stroke-width="1.1"/><rect x="30" y="178" width="5" height="50" rx="2" fill="#E07B00" stroke="none" stroke-width="0"/><text x="46.0" y="204.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#E07B00" font-weight="bold">NOₓ</text><text x="250.0" y="203.8" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#222222" font-weight="normal">air</text><text x="400.0" y="203.8" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#222222" font-weight="normal">photochemical smog, ground-level ozone, acid rain</text><text x="760.0" y="203.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#6B6275" font-weight="normal">40 μg/m³ annual</text><rect x="30" y="234" width="900" height="50" rx="4" fill="#FFFFFF" stroke="#B9A6CE" stroke-width="1.1"/><rect x="30" y="234" width="5" height="50" rx="2" fill="#6420B8" stroke="none" stroke-width="0"/><text x="46.0" y="260.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#6420B8" font-weight="bold">CO</text><text x="250.0" y="259.9" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#222222" font-weight="normal">air</text><text x="400.0" y="259.9" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#222222" font-weight="normal">binds haemoglobin 200× more strongly than O₂</text><text x="760.0" y="259.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#6B6275" font-weight="normal">2 mg/m³ 8-hour</text><rect x="30" y="290" width="900" height="50" rx="4" fill="#FFFFFF" stroke="#B9A6CE" stroke-width="1.1"/><rect x="30" y="290" width="5" height="50" rx="2" fill="#222222" stroke="none" stroke-width="0"/><text x="46.0" y="316.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#222222" font-weight="bold">PM10 / PM2.5</text><text x="250.0" y="315.9" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#222222" font-weight="normal">air</text><text x="400.0" y="315.9" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#222222" font-weight="normal">reaches alveoli, carries metals into blood</text><text x="760.0" y="315.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#6B6275" font-weight="normal">60 / 40 μg/m³</text><rect x="30" y="346" width="900" height="50" rx="4" fill="#FFFFFF" stroke="#B9A6CE" stroke-width="1.1"/><rect x="30" y="346" width="5" height="50" rx="2" fill="#1565C0" stroke="none" stroke-width="0"/><text x="46.0" y="372.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#1565C0" font-weight="bold">BOD load</text><text x="250.0" y="371.9" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#222222" font-weight="normal">water</text><text x="400.0" y="371.9" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#222222" font-weight="normal">oxygen sag, fish kill, foul odour</text><text x="760.0" y="371.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#6B6275" font-weight="normal">30 mg/L inlet</text><rect x="30" y="402" width="900" height="50" rx="4" fill="#FFFFFF" stroke="#B9A6CE" stroke-width="1.1"/><rect x="30" y="402" width="5" height="50" rx="2" fill="#2E7D32" stroke="none" stroke-width="0"/><text x="46.0" y="428.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#2E7D32" font-weight="bold">Heavy metals</text><text x="250.0" y="427.9" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#222222" font-weight="normal">water</text><text x="400.0" y="427.9" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#222222" font-weight="normal">Hg, Pb, Cr accumulate in tissue, neurotoxic</text><text x="760.0" y="427.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#6B6275" font-weight="normal">0.001–0.05 mg/L</text><rect x="30" y="458" width="900" height="50" rx="4" fill="#FFFFFF" stroke="#B9A6CE" stroke-width="1.1"/><rect x="30" y="458" width="5" height="50" rx="2" fill="#6B6275" stroke="none" stroke-width="0"/><text x="46.0" y="484.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#6B6275" font-weight="bold">Noise</text><text x="250.0" y="483.9" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#222222" font-weight="normal">physical</text><text x="400.0" y="483.9" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#222222" font-weight="normal">hearing loss above 85 dB(A) over 8 h</text><text x="760.0" y="483.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#6B6275" font-weight="normal">75 dB(A) zone</text><rect x="0" y="514" width="960" height="34" rx="0" fill="#EADDF7" stroke="none" stroke-width="0"/><text x="18.0" y="536.9" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#6420B8" font-weight="bold">THE CHAIN FROM DOSE TO DAMAGE</text><text x="30.0" y="566.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#6420B8" font-weight="bold">release  →  transport and dilution  →  concentration at the receptor  →  exposure  →  dose  →  response</text><text x="30.0" y="593.9" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#222222" font-weight="normal">Control can be applied at any arrow. The cheapest place is the first one: prevent the release, because dilution is not treatment.</text><text x="24.0" y="632.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#6B6275" font-weight="normal">Limits are indicative NAQ / CPCB values for orientation; always quote the current gazette notification.</text><text x="24.0" y="663.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#6B6275" font-weight="normal">Original teaching schematic • conceptual, not a construction/operating drawing</text></svg>