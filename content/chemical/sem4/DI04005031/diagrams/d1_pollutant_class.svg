<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 680" font-family="Arial, Helvetica, sans-serif"><rect width="980" height="680" fill="#ffffff"/><text x="24.0" y="36.6" font-family="Arial, Helvetica, sans-serif" font-size="19" text-anchor="start" fill="#6420B8" font-weight="bold">Classifying pollutants three ways</text><rect x="390" y="78" width="200" height="46" rx="8" fill="#EADDF7" stroke="#7B2CD9" stroke-width="1.8"/><text x="490.0" y="105.9" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#6420B8" font-weight="bold">POLLUTANT</text><line x1="490" y1="126" x2="187.9275720800535" y2="166.92594184721855" stroke="#B9A6CE" stroke-width="1.6"/><polygon points="180.0,168.0 188.4,170.5 187.4,163.4" fill="#B9A6CE"/><rect x="40" y="170" width="280" height="40" rx="6" fill="#C2185B" stroke="none" stroke-width="1.8"/><text x="180.0" y="194.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" fill="#FFFFFF" font-weight="bold">BY ORIGIN</text><rect x="40" y="220" width="280" height="66" rx="6" fill="#FFFFFF" stroke="#C2185B" stroke-width="1.8"/><text x="54.0" y="248.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#C2185B" font-weight="bold">Primary</text><text x="54.0" y="269.5" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#6B6275" font-weight="normal">released as it is: CO, dust, SO₂</text><rect x="40" y="296" width="280" height="66" rx="6" fill="#FFFFFF" stroke="#C2185B" stroke-width="1.8"/><text x="54.0" y="324.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#C2185B" font-weight="bold">Secondary</text><text x="54.0" y="345.5" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#6B6275" font-weight="normal">formed in air: ozone, PAN, acid mist</text><line x1="490" y1="126" x2="490.0" y2="160.0" stroke="#B9A6CE" stroke-width="1.6"/><polygon points="490.0,168.0 493.6,160.0 486.4,160.0" fill="#B9A6CE"/><rect x="350" y="170" width="280" height="40" rx="6" fill="#1565C0" stroke="none" stroke-width="1.8"/><text x="490.0" y="194.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" fill="#FFFFFF" font-weight="bold">BY NATURE</text><rect x="350" y="220" width="280" height="66" rx="6" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.8"/><text x="364.0" y="248.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#1565C0" font-weight="bold">Physical</text><text x="364.0" y="269.5" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#6B6275" font-weight="normal">heat, noise, radiation, sediment</text><rect x="350" y="296" width="280" height="66" rx="6" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.8"/><text x="364.0" y="324.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#1565C0" font-weight="bold">Chemical</text><text x="364.0" y="345.5" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#6B6275" font-weight="normal">gases, acids, heavy metals, salts</text><rect x="350" y="372" width="280" height="66" rx="6" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.8"/><text x="364.0" y="400.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#1565C0" font-weight="bold">Biological</text><text x="364.0" y="421.5" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#6B6275" font-weight="normal">bacteria, virus, algae</text><line x1="490" y1="126" x2="792.0724279199464" y2="166.92594184721855" stroke="#B9A6CE" stroke-width="1.6"/><polygon points="800.0,168.0 792.6,163.4 791.6,170.5" fill="#B9A6CE"/><rect x="660" y="170" width="280" height="40" rx="6" fill="#2E7D32" stroke="none" stroke-width="1.8"/><text x="800.0" y="194.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" fill="#FFFFFF" font-weight="bold">BY MEDIUM</text><rect x="660" y="220" width="280" height="66" rx="6" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.8"/><text x="674.0" y="248.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#2E7D32" font-weight="bold">Air</text><text x="674.0" y="269.5" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#6B6275" font-weight="normal">gases and particles in the atmosphere</text><rect x="660" y="296" width="280" height="66" rx="6" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.8"/><text x="674.0" y="324.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#2E7D32" font-weight="bold">Water</text><text x="674.0" y="345.5" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#6B6275" font-weight="normal">effluent discharged to a water body</text><rect x="660" y="372" width="280" height="66" rx="6" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.8"/><text x="674.0" y="400.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#2E7D32" font-weight="bold">Land</text><text x="674.0" y="421.5" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#6B6275" font-weight="normal">solid and hazardous waste</text><rect x="0" y="482" width="980" height="34" rx="0" fill="#EADDF7" stroke="none" stroke-width="0"/><text x="18.0" y="504.9" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#6420B8" font-weight="bold">THE THREE QUESTIONS THAT DECIDE THE ANSWERS</text><text x="30.0" y="534.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#222222" font-weight="normal">1.  When was it released — unchanged from the source, or created later by sunlight and chemistry?</text><text x="30.0" y="560.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#222222" font-weight="normal">2.  What is it made of — so which detection method and which control equipment will work?</text><text x="30.0" y="586.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#222222" font-weight="normal">3.  Where did it go — which decides whether the permit is a stack consent, an effluent consent or a landfill licence.</text><text x="24.0" y="634.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#6B6275" font-weight="normal">One pollutant can be all three at once: SO₂ is primary, chemical and air-borne.</text><text x="24.0" y="671.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#6B6275" font-weight="normal">Original teaching schematic • conceptual, not a construction/operating drawing</text></svg>