<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 672" font-family="Arial, Helvetica, sans-serif"><rect width="980" height="672" fill="#ffffff"/><text x="24.0" y="36.6" font-family="Arial, Helvetica, sans-serif" font-size="19" text-anchor="start" fill="#6420B8" font-weight="bold">What a consent to operate actually limits</text><rect x="30" y="84" width="440" height="232" rx="10" fill="#F8FDF9" stroke="#2E7D32" stroke-width="1.8"/><text x="46.0" y="114.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#2E7D32" font-weight="bold">STACK / AMBIENT AIR</text><text x="46.0" y="143.8" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#222222" font-weight="bold">SPM</text><text x="190.0" y="143.8" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#6B6275" font-weight="normal">500 μg/m³ (industrial zone)</text><text x="46.0" y="173.8" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#222222" font-weight="bold">SO₂</text><text x="190.0" y="173.8" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#6B6275" font-weight="normal">120 μg/m³ 24-hour</text><text x="46.0" y="203.8" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#222222" font-weight="bold">NOₓ</text><text x="190.0" y="203.8" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#6B6275" font-weight="normal">120 μg/m³ 24-hour</text><text x="46.0" y="233.8" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#222222" font-weight="bold">CO</text><text x="190.0" y="233.8" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#6B6275" font-weight="normal">2 mg/m³ 8-hour</text><text x="46.0" y="263.9" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#222222" font-weight="bold">Stack height</text><text x="190.0" y="263.9" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#6B6275" font-weight="normal">H = 14 (Q)^0.3 m</text><rect x="500" y="84" width="450" height="232" rx="10" fill="#F5F8FD" stroke="#1565C0" stroke-width="1.8"/><text x="516.0" y="114.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#1565C0" font-weight="bold">EFFLUENT DISCHARGE</text><text x="516.0" y="143.8" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#222222" font-weight="bold">pH</text><text x="700.0" y="143.8" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#6B6275" font-weight="normal">6.5 – 8.5</text><text x="516.0" y="173.8" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#222222" font-weight="bold">BOD₃</text><text x="700.0" y="173.8" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#6B6275" font-weight="normal">30 mg/L (into inland surface water)</text><text x="516.0" y="203.8" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#222222" font-weight="bold">COD</text><text x="700.0" y="203.8" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#6B6275" font-weight="normal">250 mg/L</text><text x="516.0" y="233.8" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#222222" font-weight="bold">Suspended solids</text><text x="700.0" y="233.8" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#6B6275" font-weight="normal">100 mg/L</text><text x="516.0" y="263.9" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#222222" font-weight="bold">Oil and grease</text><text x="700.0" y="263.9" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#6B6275" font-weight="normal">10 mg/L</text><rect x="0" y="322" width="980" height="34" rx="0" fill="#EADDF7" stroke="none" stroke-width="0"/><text x="18.0" y="344.9" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#6420B8" font-weight="bold">WHO SETS AND WHO ENFORCES</text><circle cx="52" cy="368" r="15" fill="#EADDF7" stroke="#7B2CD9" stroke-width="1.6"/><text x="52.0" y="372.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" fill="#6420B8" font-weight="bold">1</text><text x="80.0" y="364.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#6420B8" font-weight="bold">CPCB</text><text x="80.0" y="383.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#222222" font-weight="normal">Central Pollution Control Board — sets national standards, classifies industries red / orange / green / white</text><circle cx="52" cy="420" r="15" fill="#EADDF7" stroke="#7B2CD9" stroke-width="1.6"/><text x="52.0" y="424.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" fill="#6420B8" font-weight="bold">2</text><text x="80.0" y="416.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#6420B8" font-weight="bold">GPCB</text><text x="80.0" y="435.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#222222" font-weight="normal">Gujarat Pollution Control Board — issues the Consent to Establish and the Consent to Operate</text><circle cx="52" cy="472" r="15" fill="#EADDF7" stroke="#7B2CD9" stroke-width="1.6"/><text x="52.0" y="476.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" fill="#6420B8" font-weight="bold">3</text><text x="80.0" y="468.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#6420B8" font-weight="bold">Consent</text><text x="80.0" y="487.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#222222" font-weight="normal">fixes the stack height, the effluent quality and the volume you may discharge</text><circle cx="52" cy="524" r="15" fill="#EADDF7" stroke="#7B2CD9" stroke-width="1.6"/><text x="52.0" y="528.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" fill="#6420B8" font-weight="bold">4</text><text x="80.0" y="520.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#6420B8" font-weight="bold">Monitoring</text><text x="80.0" y="539.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#222222" font-weight="normal">returns, sampling by the board, and closure for non-compliance</text><rect x="0" y="570" width="980" height="34" rx="0" fill="#EADDF7" stroke="none" stroke-width="0"/><text x="18.0" y="592.9" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#6420B8" font-weight="bold">THE FOUR LEGISLATIONS A CHEMICAL ENGINEER MUST KNOW</text><text x="30.0" y="619.9" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#222222" font-weight="normal">Water Act 1974  ·  Air Act 1981  ·  Environment (Protection) Act 1986  ·  Waste Management Rules (solid, hazardous, plastic, e-waste)</text><text x="24.0" y="663.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#6B6275" font-weight="normal">Original teaching schematic • conceptual, not a construction/operating drawing</text></svg>