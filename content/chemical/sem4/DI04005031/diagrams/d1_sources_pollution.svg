<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 650" font-family="Arial, Helvetica, sans-serif"><rect width="980" height="650" fill="#ffffff"/><text x="24.0" y="36.6" font-family="Arial, Helvetica, sans-serif" font-size="19" text-anchor="start" fill="#6420B8" font-weight="bold">Five sources of pollution, and how each one travels</text><rect x="30" y="96" width="160" height="58" rx="8" fill="#FFFFFF" stroke="#C2185B" stroke-width="1.8"/><text x="110.0" y="122.4" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" fill="#C2185B" font-weight="bold">AIR</text><text x="110.0" y="141.3" font-family="Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="middle" fill="#6B6275" font-weight="normal">stack gas, dust, SO₂</text><line x1="110" y1="156" x2="110.0" y2="182.0" stroke="#C2185B" stroke-width="2"/><polygon points="110.0,190.0 113.6,182.0 106.4,182.0" fill="#C2185B"/><rect x="220" y="96" width="160" height="58" rx="8" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.8"/><text x="300.0" y="122.4" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" fill="#1565C0" font-weight="bold">WATER</text><text x="300.0" y="141.3" font-family="Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="middle" fill="#6B6275" font-weight="normal">effluent, sewage</text><line x1="300" y1="156" x2="300.0" y2="182.0" stroke="#1565C0" stroke-width="2"/><polygon points="300.0,190.0 303.6,182.0 296.4,182.0" fill="#1565C0"/><rect x="410" y="96" width="160" height="58" rx="8" fill="#FFFFFF" stroke="#E07B00" stroke-width="1.8"/><text x="490.0" y="122.4" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" fill="#E07B00" font-weight="bold">LAND</text><text x="490.0" y="141.3" font-family="Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="middle" fill="#6B6275" font-weight="normal">dumping, sludge</text><line x1="490" y1="156" x2="490.0" y2="182.0" stroke="#E07B00" stroke-width="2"/><polygon points="490.0,190.0 493.6,182.0 486.4,182.0" fill="#E07B00"/><rect x="600" y="96" width="160" height="58" rx="8" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.8"/><text x="680.0" y="122.4" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">NOISE</text><text x="680.0" y="141.3" font-family="Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="middle" fill="#6B6275" font-weight="normal">machines, traffic</text><line x1="680" y1="156" x2="680.0" y2="182.0" stroke="#2E7D32" stroke-width="2"/><polygon points="680.0,190.0 683.6,182.0 676.4,182.0" fill="#2E7D32"/><rect x="790" y="96" width="160" height="58" rx="8" fill="#FFFFFF" stroke="#6420B8" stroke-width="1.8"/><text x="870.0" y="122.4" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" fill="#6420B8" font-weight="bold">RADIOACTIVE</text><text x="870.0" y="141.3" font-family="Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="middle" fill="#6B6275" font-weight="normal">isotopes, nuclear</text><line x1="870" y1="156" x2="870.0" y2="182.0" stroke="#6420B8" stroke-width="2"/><polygon points="870.0,190.0 873.6,182.0 866.4,182.0" fill="#6420B8"/><rect x="30" y="200" width="920" height="56" rx="10" fill="#F4F1F7" stroke="#B9A6CE" stroke-width="1.8"/><text x="490.0" y="224.4" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" fill="#6420B8" font-weight="bold">RECEIVING ENVIRONMENT  —  air · water · soil</text><text x="490.0" y="243.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#6B6275" font-weight="normal">the pollutant is diluted, transported and sometimes chemically changed on the way</text><line x1="170" y1="256" x2="170.0" y2="292.0" stroke="#6420B8" stroke-width="2.2"/><polygon points="170.0,300.0 173.6,292.0 166.4,292.0" fill="#6420B8"/><line x1="490" y1="256" x2="490.0" y2="292.0" stroke="#6420B8" stroke-width="2.2"/><polygon points="490.0,300.0 493.6,292.0 486.4,292.0" fill="#6420B8"/><line x1="810" y1="256" x2="810.0" y2="292.0" stroke="#6420B8" stroke-width="2.2"/><polygon points="810.0,300.0 813.6,292.0 806.4,292.0" fill="#6420B8"/><rect x="0" y="274" width="980" height="34" rx="0" fill="#EADDF7" stroke="none" stroke-width="0"/><text x="18.0" y="296.9" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#6420B8" font-weight="bold">WHO IS EXPOSED</text><rect x="30" y="310" width="210" height="62" rx="8" fill="#FFFFFF" stroke="#C2185B" stroke-width="1.8"/><text x="135.0" y="337.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#C2185B" font-weight="bold">HUMANS</text><text x="135.0" y="357.3" font-family="Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="middle" fill="#6B6275" font-weight="normal">respiratory and water-borne disease</text><rect x="260" y="310" width="210" height="62" rx="8" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.8"/><text x="365.0" y="337.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#2E7D32" font-weight="bold">PLANTS</text><text x="365.0" y="357.3" font-family="Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="middle" fill="#6B6275" font-weight="normal">leaf damage, lower yield</text><rect x="490" y="310" width="210" height="62" rx="8" fill="#FFFFFF" stroke="#E07B00" stroke-width="1.8"/><text x="595.0" y="337.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#E07B00" font-weight="bold">ANIMALS</text><text x="595.0" y="357.3" font-family="Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="middle" fill="#6B6275" font-weight="normal">bioaccumulation up the food chain</text><rect x="720" y="310" width="210" height="62" rx="8" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.8"/><text x="825.0" y="337.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">MATERIALS</text><text x="825.0" y="357.3" font-family="Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="middle" fill="#6B6275" font-weight="normal">corrosion, soiling, stone decay</text><rect x="0" y="384" width="980" height="34" rx="0" fill="#EADDF7" stroke="none" stroke-width="0"/><text x="18.0" y="406.9" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#6420B8" font-weight="bold">THE FOUR ROUTES INTO THE BODY</text><text x="30.0" y="436.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#C2185B" font-weight="bold">inhalation</text><text x="130.0" y="435.9" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#222222" font-weight="normal">→ lungs, the fastest route: gases and particles below 10 μm reach the alveoli</text><text x="30.0" y="462.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#1565C0" font-weight="bold">ingestion</text><text x="130.0" y="461.9" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#222222" font-weight="normal">→ drinking water, food, and hand-to-mouth dust</text><text x="30.0" y="488.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#E07B00" font-weight="bold">dermal contact</text><text x="130.0" y="487.9" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#222222" font-weight="normal">→ absorption through skin, mainly solvents and pesticides</text><text x="30.0" y="514.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#6420B8" font-weight="bold">radiation</text><text x="130.0" y="513.9" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#222222" font-weight="normal">→ ionising dose from external exposure or inhaled radon</text><rect x="0" y="530" width="980" height="34" rx="0" fill="#EADDF7" stroke="none" stroke-width="0"/><text x="18.0" y="552.9" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#6420B8" font-weight="bold">ONE POLLUTANT, MANY PATHS</text><text x="30.0" y="582.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#222222" font-weight="normal">A pollutant released to air settles on land, is washed into water, enters crops and</text><text x="30.0" y="604.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#222222" font-weight="normal">returns to people — so control belongs at the source, never at the victim.</text><text x="24.0" y="641.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#6B6275" font-weight="normal">Original teaching schematic • conceptual, not a construction/operating drawing</text></svg>