<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><defs><marker id="contact_modes-a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#263247"/></marker></defs><rect width="900" height="600" fill="white"/><text x="22" y="34" font-family="Arial,sans-serif" font-size="21" fill="#263247">Stagewise versus differential continuous contact</text><rect x="55" y="175" width="140" height="100" fill="#eee5f6" stroke="#7134aa" stroke-width="3"/><text x="65" y="231.0" font-family="Arial,sans-serif" font-size="17" fill="#263247">Stage1</text><rect x="245" y="175" width="140" height="100" fill="#eee5f6" stroke="#7134aa" stroke-width="3"/><text x="255" y="231.0" font-family="Arial,sans-serif" font-size="17" fill="#263247">Stage2</text><rect x="435" y="175" width="140" height="100" fill="#eee5f6" stroke="#7134aa" stroke-width="3"/><text x="445" y="231.0" font-family="Arial,sans-serif" font-size="17" fill="#263247">Stage3</text><path d="M195 205L245 205" stroke="#263247" stroke-width="3" fill="none" marker-end="url(#contact_modes-a)"/><path d="M385 205L435 205" stroke="#263247" stroke-width="3" fill="none" marker-end="url(#contact_modes-a)"/><path d="M245 250L195 250" stroke="#263247" stroke-width="3" fill="none" marker-end="url(#contact_modes-a)"/><path d="M435 250L385 250" stroke="#263247" stroke-width="3" fill="none" marker-end="url(#contact_modes-a)"/><text x="55" y="330" font-family="Arial,sans-serif" font-size="18" fill="#263247">Discrete contact / phase separation</text><rect x="670" y="130" width="130" height="280" fill="#dceffd" stroke="#7134aa" stroke-width="3"/><path d="M695 155L695 385" stroke="#288ab1" stroke-width="3" fill="none" marker-end="url(#contact_modes-a)"/><path d="M770 385L770 155" stroke="#d28a31" stroke-width="3" fill="none" marker-end="url(#contact_modes-a)"/><text x="620" y="450" font-family="Arial,sans-serif" font-size="18" fill="#263247">Distributed contact</text><text x="65" y="510" font-family="Arial,sans-serif" font-size="18" fill="#263247">Continuous feed flow is possible in either contacting arrangement.</text><text x="22" y="582" font-family="Arial,sans-serif" font-size="14" fill="#263247">Own labelled educational schematic • not to scale • no measured equilibrium/plant data claimed</text></svg>