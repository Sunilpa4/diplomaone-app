<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><defs><marker id="shanks-a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#263247"/></marker></defs><rect width="900" height="600" fill="white"/><text x="22" y="34" font-family="Arial,sans-serif" font-size="21" fill="#263247">Shanks battery:liquor passes from spent toward fresh solids</text><rect x="130" y="200" width="145" height="220" fill="#ece3d1" stroke="#7134aa" stroke-width="3"/><text x="120" y="175" font-family="Arial,sans-serif" font-size="17" fill="#263247">Nearly spent</text><path d="M140 360L265 360" fill="none" stroke="#288ab1" stroke-width="3"/><path d="M275 275L355 275" stroke="#288ab1" stroke-width="3" fill="none" marker-end="url(#shanks-a)"/><rect x="375" y="200" width="145" height="220" fill="#ece3d1" stroke="#7134aa" stroke-width="3"/><text x="365" y="175" font-family="Arial,sans-serif" font-size="17" fill="#263247">Intermediate</text><path d="M385 360L510 360" fill="none" stroke="#288ab1" stroke-width="3"/><path d="M520 275L600 275" stroke="#288ab1" stroke-width="3" fill="none" marker-end="url(#shanks-a)"/><rect x="620" y="200" width="145" height="220" fill="#ece3d1" stroke="#7134aa" stroke-width="3"/><text x="610" y="175" font-family="Arial,sans-serif" font-size="17" fill="#263247">Fresh charge</text><path d="M630 360L755 360" fill="none" stroke="#288ab1" stroke-width="3"/><path d="M765 275L845 275" stroke="#288ab1" stroke-width="3" fill="none" marker-end="url(#shanks-a)"/><path d="M35 275L130 275" stroke="#288ab1" stroke-width="3" fill="none" marker-end="url(#shanks-a)"/><text x="20" y="240" font-family="Arial,sans-serif" font-size="16" fill="#263247">Fresh wash</text><text x="720" y="330" font-family="Arial,sans-serif" font-size="17" fill="#263247">Rich liquor</text><text x="75" y="485" font-family="Arial,sans-serif" font-size="18" fill="#263247">Valve-switched batch roles;solids do not flow through connecting pipes.</text><text x="75" y="530" font-family="Arial,sans-serif" font-size="18" fill="#263247">Oldest charge is replaced and the sequence advances cyclically.</text><text x="22" y="582" font-family="Arial,sans-serif" font-size="14" fill="#263247">Own labelled educational schematic • not to scale • no measured equilibrium/plant data claimed</text></svg>