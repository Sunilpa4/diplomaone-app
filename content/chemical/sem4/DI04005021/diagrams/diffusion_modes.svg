<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><defs><marker id="diffusion_modes-a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#263247"/></marker></defs><rect width="900" height="600" fill="white"/><text x="22" y="34" font-family="Arial,sans-serif" font-size="21" fill="#263247">Binary diffusion:equimolar counterdiffusion versus stagnant B</text><text x="65" y="115" font-family="Arial,sans-serif" font-size="18" fill="#263247">Equimolar:NA=−NB;NT=0</text><path d="M180 185L710 185" stroke="#7134aa" stroke-width="3" fill="none" marker-end="url(#diffusion_modes-a)"/><text x="115" y="190" font-family="Arial,sans-serif" font-size="18" fill="#263247">A</text><path d="M710 250L180 250" stroke="#288ab1" stroke-width="3" fill="none" marker-end="url(#diffusion_modes-a)"/><text x="735" y="255" font-family="Arial,sans-serif" font-size="18" fill="#263247">B</text><text x="65" y="350" font-family="Arial,sans-serif" font-size="18" fill="#263247">Stagnant B:NB=0;NT=NA,so Stefan bulk flow exists</text><path d="M180 410L710 410" stroke="#7134aa" stroke-width="3" fill="none" marker-end="url(#diffusion_modes-a)"/><text x="115" y="415" font-family="Arial,sans-serif" font-size="18" fill="#263247">A</text><text x="350" y="485" font-family="Arial,sans-serif" font-size="18" fill="#263247">B has zero net stationary-coordinate flux</text><text x="22" y="582" font-family="Arial,sans-serif" font-size="14" fill="#263247">Own labelled educational schematic • not to scale • no measured equilibrium/plant data claimed</text></svg>