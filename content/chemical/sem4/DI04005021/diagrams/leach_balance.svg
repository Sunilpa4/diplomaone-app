<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><defs><marker id="leach_balance-a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#263247"/></marker></defs><rect width="900" height="600" fill="white"/><text x="22" y="34" font-family="Arial,sans-serif" font-size="21" fill="#263247">Single-stage leaching:retained solution is part of wet underflow</text><rect x="300" y="185" width="300" height="180" fill="#eee5f6" stroke="#7134aa" stroke-width="3"/><text x="310" y="281.0" font-family="Arial,sans-serif" font-size="17" fill="#263247">Contact + separation</text><path d="M65 245L300 245" stroke="#263247" stroke-width="3" fill="none" marker-end="url(#leach_balance-a)"/><text x="35" y="205" font-family="Arial,sans-serif" font-size="17" fill="#263247">Solid feed:B,A0,S0</text><path d="M450 90L450 185" stroke="#288ab1" stroke-width="3" fill="none" marker-end="url(#leach_balance-a)"/><text x="490" y="120" font-family="Arial,sans-serif" font-size="17" fill="#263247">Fresh solvent V</text><path d="M600 230L820 230" stroke="#d28a31" stroke-width="3" fill="none" marker-end="url(#leach_balance-a)"/><text x="660" y="195" font-family="Arial,sans-serif" font-size="17" fill="#263247">Overflow E,x</text><path d="M600 330L820 410" stroke="#288ab1" stroke-width="3" fill="none" marker-end="url(#leach_balance-a)"/><text x="620" y="450" font-family="Arial,sans-serif" font-size="17" fill="#263247">Wet underflow:B+U</text><text x="620" y="480" font-family="Arial,sans-serif" font-size="17" fill="#263247">Retained solution U,x</text><text x="90" y="535" font-family="Arial,sans-serif" font-size="17" fill="#263247">Ideal mixed solution:x is equal in overflow and retained liquid.</text><text x="22" y="582" font-family="Arial,sans-serif" font-size="14" fill="#263247">Own labelled educational schematic • not to scale • no measured equilibrium/plant data claimed</text></svg>