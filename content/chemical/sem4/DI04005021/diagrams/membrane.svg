<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><defs><marker id="membrane-a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#263247"/></marker></defs><rect width="900" height="600" fill="white"/><text x="22" y="34" font-family="Arial,sans-serif" font-size="21" fill="#263247">Membrane separation:selective barrier,permeate and retentate</text><rect x="280" y="150" width="330" height="250" fill="#dceffd" stroke="#7134aa" stroke-width="3"/><rect x="450" y="150" width="18" height="250" fill="#e4b276" stroke="#7134aa" stroke-width="3"/><path d="M70 220L280 220" stroke="#263247" stroke-width="3" fill="none" marker-end="url(#membrane-a)"/><text x="75" y="190" font-family="Arial,sans-serif" font-size="18" fill="#263247">Feed</text><path d="M385 400L385 490" stroke="#263247" stroke-width="3" fill="none" marker-end="url(#membrane-a)"/><text x="290" y="520" font-family="Arial,sans-serif" font-size="18" fill="#263247">Retentate</text><path d="M610 270L790 270" stroke="#263247" stroke-width="3" fill="none" marker-end="url(#membrane-a)"/><text x="660" y="240" font-family="Arial,sans-serif" font-size="18" fill="#263247">Permeate</text><text x="490" y="445" font-family="Arial,sans-serif" font-size="18" fill="#263247">Selective membrane</text><path d="M485 420L468 350" fill="none" stroke="#263247" stroke-width="3"/><path d="M355 280L530 280" stroke="#288ab1" stroke-width="3" fill="none" marker-end="url(#membrane-a)"/><text x="60" y="110" font-family="Arial,sans-serif" font-size="18" fill="#263247">Driving force and selectivity depend on membrane process.</text><text x="22" y="582" font-family="Arial,sans-serif" font-size="14" fill="#263247">Own labelled educational schematic • not to scale • no measured equilibrium/plant data claimed</text></svg>