<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><defs><marker id="single_extraction-a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#263247"/></marker></defs><rect width="900" height="600" fill="white"/><text x="22" y="34" font-family="Arial,sans-serif" font-size="21" fill="#263247">Single equilibrium extraction stage:mix,contact and separate</text><rect x="310" y="180" width="280" height="200" fill="#eee5f6" stroke="#7134aa" stroke-width="3"/><text x="320" y="286.0" font-family="Arial,sans-serif" font-size="17" fill="#263247">Mixer + separator</text><path d="M80 210L310 210" stroke="#263247" stroke-width="3" fill="none" marker-end="url(#single_extraction-a)"/><text x="65" y="175" font-family="Arial,sans-serif" font-size="18" fill="#263247">Feed F,wF</text><path d="M450 90L450 180" stroke="#288ab1" stroke-width="3" fill="none" marker-end="url(#single_extraction-a)"/><text x="485" y="125" font-family="Arial,sans-serif" font-size="18" fill="#263247">Solvent S,wS</text><path d="M590 225L790 225" stroke="#d28a31" stroke-width="3" fill="none" marker-end="url(#single_extraction-a)"/><text x="650" y="195" font-family="Arial,sans-serif" font-size="18" fill="#263247">Extract E,wE</text><path d="M590 340L790 340" stroke="#288ab1" stroke-width="3" fill="none" marker-end="url(#single_extraction-a)"/><text x="625" y="380" font-family="Arial,sans-serif" font-size="18" fill="#263247">Raffinate R,wR</text><text x="155" y="470" font-family="Arial,sans-serif" font-size="18" fill="#263247">M=F+S=E+R;component balances and tie-line equilibrium both required.</text><text x="22" y="582" font-family="Arial,sans-serif" font-size="14" fill="#263247">Own labelled educational schematic • not to scale • no measured equilibrium/plant data claimed</text></svg>