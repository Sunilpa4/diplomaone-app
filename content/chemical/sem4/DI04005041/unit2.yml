l="#6420B8" font-weight="bold">Q − W = ΔU + Δ(KE) + Δ(PE)</text><text x="24.0" y="512.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#6B6275" font-weight="normal">ΔU is independent of the path; Q and W are not. Their difference is fixed.</text><text x="24.0" y="531.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#6B6275" font-weight="normal">Original teaching schematic • conceptual, not a construction/operating drawing</text></svg>
