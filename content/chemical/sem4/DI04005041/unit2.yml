    gu: સૂત્રો તથા conversions
programs:
- ref: N1
  title:
    en: Work and heat in a closed cylinder of gas
    gu: Closed cylinder માં gas નું work તથા heat
  format: rich_cards
  items:
  - h:
      en: Work and heat in a closed cylinder of gas
      gu: Closed cylinder માં gas નું work તથા heat
    body:
      en: |-
        <h4>Given</h4><p>0.5 kg of air is heated in a rigid closed vessel from 27 °C to 227 °C. Take c_v = 0.718 kJ/kg·K.</p><h4>Find</h4><p>Work done, heat supplied and change of internal energy.</p><h4>Formula</h4><div class="math" data-tex="W=0" aria-label="W=0">rigid vessel:  W = 0</div><div class="math" data-tex="Q=\Delta U=mc_v\Delta T" aria-label="Q=\Delta U=mc_v\Delta T">Q = ΔU = m c_v ΔT</div><h4>Substitution and calculation</h4><p>ΔT = 227 − 27 = 200 K. ΔU = 0.5 × 0.718 × 200 = 71.8 kJ. Since W = 0, Q = 71.8 kJ.</p><h4>Final answer with units</h4><p>W = 0;  ΔU = 71.8 kJ;  Q = 71.8 kJ (heat supplied to the air).</p><h4>Validity check</h4><p>A rigid vessel cannot change volume, so no displacement work is possible; every joule of heat must appear as internal energy. 0.5 × 0.718 × 200 is the right order for a 200 K rise of half a kilogram of air.</p>
      gu: |-
        <h4>આપેલ</h4><p>0.5 kg હવા દૃઢ closed પાત્રમાં 27 °C થી 227 °C સુધી ગરમ કરાય છે. c_v = 0.718 kJ/kg·K લો.</p><h4>શોધો</h4><p>થયેલું work, અપાયેલી heat તથા internal energy નો ફેરફાર.</p><h4>સૂત્ર</h4><div class="math" data-tex="W=0" aria-label="W=0">rigid vessel:  W = 0</div><div class="math" data-tex="Q=\Delta U=mc_v\Delta T" aria-label="Q=\Delta U=mc_v\Delta T">Q = ΔU = m c_v ΔT</div><h4>Substitution તથા Calculation</h4><p>ΔT = 227 − 27 = 200 K. ΔU = 0.5 × 0.718 × 200 = 71.8 kJ. W = 0 હોવાથી Q = 71.8 kJ.</p><h4>Units સાથે અંતિમ જવાબ</h4><p>W = 0;  ΔU = 71.8 kJ;  Q = 71.8 kJ (હવાને અપાયેલી heat).</p><h4>Validity Check</h4><p>દૃઢ પાત્ર volume બદલી શકતું નથી, તેથી displacement work શક્ય નથી; heat નો દરેક જૂલ internal energy તરીકે જ આવવો જોઈએ. અડધા કિલો હવાના 200 K વધારા માટે 0.5 × 0.718 × 200 સાચો ક્રમ છે.</p>
- ref: N2
  title:
    en: Isothermal expansion of air
    gu: હવાનું isothermal expansion
  format: rich_cards
  items:
  - h:
      en: Isothermal expansion of air
      gu: હવાનું isothermal expansion
    body:
      en: |-
        <h4>Given</h4><p>2 kg of air expands reversibly and isothermally at 400 K from 1.5 bar to 0.5 bar. R = 0.287 kJ/kg·K.</p><h4>Find</h4><p>Work done, heat transferred and change of internal energy.</p><h4>Formula</h4><div class="math" data-tex="W=mRT\ln\frac{P_1}{P_2}" aria-label="W=mRT\ln\frac{P_1}{P_2}">W = m R T ln(P₁/P₂)</div><div class="math" data-tex="\Delta U=0\Rightarrow Q=W" aria-label="\Delta U=0\Rightarrow Q=W">isothermal, ideal gas:  ΔU = 0  ⇒  Q = W</div><h4>Substitution and calculation</h4><p>W = 2 × 0.287 × 400 × ln(1.5/0.5) = 229.6 × ln 3 = 229.6 × 1.0986 = 252.3 kJ.</p><h4>Final answer with units</h4><p>W = 252.3 kJ by the air;  Q = 252.3 kJ absorbed;  ΔU = 0.</p><h4>Validity check</h4><p>Pressure falls by a factor of three, so the volume triples and the work is mRT ln 3. ΔU = 0 is the signature of an isothermal ideal-gas process: the whole heat input leaves as work.</p>
      gu: |-
        <h4>આપેલ</h4><p>2 kg હવા 400 K પર 1.5 bar થી 0.5 bar સુધી reversible તથા isothermal રીતે expand થાય છે. R = 0.287 kJ/kg·K.</p><h4>શોધો</h4><p>થયેલું work, transfer થયેલી heat તથા internal energy નો ફેરફાર.</p><h4>સૂત્ર</h4><div class="math" data-tex="W=mRT\ln\frac{P_1}{P_2}" aria-label="W=mRT\ln\frac{P_1}{P_2}">W = m R T ln(P₁/P₂)</div><div class="math" data-tex="\Delta U=0\Rightarrow Q=W" aria-label="\Delta U=0\Rightarrow Q=W">isothermal, ideal gas:  ΔU = 0  ⇒  Q = W</div><h4>Substitution તથા Calculation</h4><p>W = 2 × 0.287 × 400 × ln(1.5/0.5) = 229.6 × ln 3 = 229.6 × 1.0986 = 252.3 kJ.</p><h4>Units સાથે અંતિમ જવાબ</h4><p>W = 252.3 kJ હવા દ્વારા;  Q = 252.3 kJ લેવાઈ;  ΔU = 0.</p><h4>Validity Check</h4><p>Pressure ત્રણ ગણું ઘટે છે, તેથી volume ત્રણ ગણું થાય અને work mRT ln 3 મળે. ΔU = 0 એ isothermal ideal-gas પ્રક્રિયાની ઓળખ છે: આખી heat work તરીકે નીકળી જાય.</p>
- ref: N3
  title:
    en: Adiabatic compression of air
    gu: હવાનું adiabatic compression
  format: rich_cards
  items:
  - h:
      en: Adiabatic compression of air
      gu: હવાનું adiabatic compression
    body:
      en: |-
        <h4>Given</h4><p>1 kg of air at 300 K and 1 bar is compressed adiabatically and reversibly to 5 bar. γ = 1.4, c_v = 0.718 kJ/kg·K.</p><h4>Find</h4><p>Final temperature, work input and change of internal energy.</p><h4>Formula</h4><div class="math" data-tex="\frac{T_2}{T_1}=\left(\frac{P_2}{P_1}\right)^{\frac{\gamma-1}{\gamma}}" aria-label="\frac{T_2}{T_1}=\left(\frac{P_2}{P_1}\right)^{\frac{\gamma-1}{\gamma}}">T₂/T₁ = (P₂/P₁)^((γ−1)/γ)</div><div class="math" data-tex="Q=0\Rightarrow W=-\Delta U" aria-label="Q=0\Rightarrow W=-\Delta U">Q = 0  ⇒  W = −ΔU = m c_v (T₁ − T₂)</div><h4>Substitution and calculation</h4><p>(γ−1)/γ = 0.4/1.4 = 0.2857. T₂ = 300 × (5)^0.2857 = 300 × 1.584 = 475.1 K. ΔU = 1 × 0.718 × (475.1 − 300) = 125.7 kJ. W = −125.7 kJ, i.e. 125.7 kJ of work is put in.</p><h4>Final answer with units</h4><p>T₂ = 475 K;  work input = 125.7 kJ/kg;  ΔU = +125.7 kJ/kg.</p><h4>Validity check</h4><p>Adiabatic compression always heats the gas: 300 K to 475 K for a fivefold pressure rise is the standard result, and because Q = 0 the work input must equal the internal-energy rise exactly. The negative sign of W follows the convention that work done <i>by</i> the gas is positive.</p>
      gu: |-
        <h4>આપેલ</h4><p>1 bar તથા 300 K પરની 1 kg હવા 5 bar સુધી adiabatic તથા reversible રીતે compress થાય છે. γ = 1.4, c_v = 0.718 kJ/kg·K.</p><h4>શોધો</h4><p>અંતિમ temperature, અપાયેલું work તથા internal energy નો ફેરફાર.</p><h4>સૂત્ર</h4><div class="math" data-tex="\frac{T_2}{T_1}=\left(\frac{P_2}{P_1}\right)^{\frac{\gamma-1}{\gamma}}" aria-label="\frac{T_2}{T_1}=\left(\frac{P_2}{P_1}\right)^{\frac{\gamma-1}{\gamma}}">T₂/T₁ = (P₂/P₁)^((γ−1)/γ)</div><div class="math" data-tex="Q=0\Rightarrow W=-\Delta U" aria-label="Q=0\Rightarrow W=-\Delta U">Q = 0  ⇒  W = −ΔU = m c_v (T₁ − T₂)</div><h4>Substitution તથા Calculation</h4><p>(γ−1)/γ = 0.4/1.4 = 0.2857. T₂ = 300 × (5)^0.2857 = 300 × 1.584 = 475.1 K. ΔU = 1 × 0.718 × (475.1 − 300) = 125.7 kJ. W = −125.7 kJ, એટલે કે 125.7 kJ work અંદર નાખવું પડે.</p><h4>Units સાથે અંતિમ જવાબ</h4><p>T₂ = 475 K;  work input = 125.7 kJ/kg;  ΔU = +125.7 kJ/kg.</p><h4>Validity Check</h4><p>Adiabatic compression હંમેશા gas ને ગરમ કરે: પાંચ ગણા pressure વધારા માટે 300 K થી 475 K પ્રમાણભૂત પરિણામ છે, અને Q = 0 હોવાથી work input બરાબર internal-energy વધારા જેટલું જ હોવું જોઈએ. W નું ઋણ ચિહ્ન એ convention પરથી છે કે gas <i>દ્વારા</i> થયેલું work ધન છે.</p>
- ref: N4
  title:
    en: Steady-flow compressor
    gu: Steady-flow compressor
  format: rich_cards
  items:
  - h:
      en: Steady-flow compressor
      gu: Steady-flow compressor
    body:
      en: |-
        <h4>Given</h4><p>Air enters a compressor at 1 bar, 300 K with negligible velocity and leaves at 6 bar, 480 K. Mass flow 0.05 kg/s. Heat loss from the casing 3 kW. c_p = 1.005 kJ/kg·K.</p><h4>Find</h4><p>Shaft power required, and the error made by neglecting the kinetic energy.</p><h4>Formula</h4><div class="math" data-tex="Q-W_s=\dot m\left[(h_2-h_1)+\tfrac12(c_2^2-c_1^2)\right]" aria-label="Q-W_s=\dot m\left[(h_2-h_1)+\tfrac12(c_2^2-c_1^2)\right]">Q − W_s = m [ (h₂ − h₁) + ½(c₂² − c₁²) ]</div><div class="math" data-tex="\Delta h=c_p(T_2-T_1)" aria-label="\Delta h=c_p(T_2-T_1)">Δh = c_p (T₂ − T₁)</div><h4>Substitution and calculation</h4><p>Δh = 1.005 × (480 − 300) = 180.9 kJ/kg. With Q = −3 kW (heat lost) and KE neglected: −3 − W_s = 0.05 × 180.9 = 9.045 ⇒ W_s = −12.05 kW. The negative sign means 12.05 kW of shaft power must be supplied.</p><h4>Final answer with units</h4><p>Shaft power = 12.05 kW input.  Kinetic energy is negligible only if the exit velocity is small; at 50 m/s it would add ½c² = 1.25 kJ/kg, about 0.7 %.</p><h4>Validity check</h4><p>For 0.05 kg/s and 180 K rise the gas alone needs 9 kW; adding the 3 kW lost as heat gives about 12 kW, which is the right order for a small compressor. Heat loss <i>increases</i> the power needed, as the sign of Q shows.</p>
      gu: |-
        <h4>આપેલ</h4><p>Air compressor માં 1 bar, 300 K પર લગભગ શૂન્ય velocity સાથે આવે છે અને 6 bar, 480 K પર નીકળે છે. Mass flow 0.05 kg/s. Casing થી heat loss 3 kW. c_p = 1.005 kJ/kg·K.</p><h4>શોધો</h4><p>જરૂરી shaft power, તથા kinetic energy નગણ્ય ગણવાથી થતી ભૂલ.</p><h4>સૂત્ર</h4><div class="math" data-tex="Q-W_s=\dot m\left[(h_2-h_1)+\tfrac12(c_2^2-c_1^2)\right]" aria-label="Q-W_s=\dot m\left[(h_2-h_1)+\tfrac12(c_2^2-c_1^2)\right]">Q − W_s = m [ (h₂ − h₁) + ½(c₂² − c₁²) ]</div><div class="math" data-tex="\Delta h=c_p(T_2-T_1)" aria-label="\Delta h=c_p(T_2-T_1)">Δh = c_p (T₂ − T₁)</div><h4>Substitution તથા Calculation</h4><p>Δh = 1.005 × (480 − 300) = 180.9 kJ/kg. Q = −3 kW (heat ગઈ) તથા KE નગણ્ય લેતાં: −3 − W_s = 0.05 × 180.9 = 9.045 ⇒ W_s = −12.05 kW. ઋણ ચિહ્ન એટલે 12.05 kW shaft power આપવું પડે.</p><h4>Units સાથે અંતિમ જવાબ</h4><p>Shaft power = 12.05 kW input. Exit velocity નાની હોય તો જ kinetic energy નગણ્ય; 50 m/s પર તે ½c² = 1.25 kJ/kg ઉમેરે, લગભગ 0.7 %.</p><h4>Validity Check</h4><p>0.05 kg/s તથા 180 K વધારા માટે ફક્ત gas ને 9 kW જોઈએ; ગઈ 3 kW heat ઉમેરતાં લગભગ 12 kW મળે, જે નાના compressor માટે સાચો ક્રમ છે. Heat loss powerની જરૂરિયાત <i>વધારે</i> છે, જે Q નું ચિહ્ન દર્શાવે છે.</p>
- ref: N5
  title:
    en: Heat capacity relation for an ideal gas
    gu: ideal gas માટે heat capacity નો સંબંધ
  format: rich_cards
  items:
  - h:
      en: Heat capacity relation for an ideal gas
      gu: ideal gas માટે heat capacity નો સંબંધ
    body:
      en: |-
        <h4>Given</h4><p>For a certain ideal gas c_p = 1.005 kJ/kg·K and R = 0.287 kJ/kg·K. 2 kg of the gas is heated at constant pressure through 100 K.</p><h4>Find</h4><p>c_v, γ, ΔH, ΔU and the work done.</p><h4>Formula</h4><div class="math" data-tex="c_v=c_p-R" aria-label="c_v=c_p-R">c_v = c_p − R</div><div class="math" data-tex="\gamma=\frac{c_p}{c_v}" aria-label="\gamma=\frac{c_p}{c_v}">γ = c_p / c_v</div><div class="math" data-tex="W=mR\Delta T" aria-label="W=mR\Delta T">ΔH = m c_p ΔT ,  ΔU = m c_v ΔT ,  W = P ΔV = m R ΔT</div><h4>Substitution and calculation</h4><p>c_v = 1.005 − 0.287 = 0.718 kJ/kg·K. γ = 1.005/0.718 = 1.40. ΔH = 2 × 1.005 × 100 = 201.0 kJ. ΔU = 2 × 0.718 × 100 = 143.6 kJ. W = 2 × 0.287 × 100 = 57.4 kJ.</p><h4>Final answer with units</h4><p>c_v = 0.718 kJ/kg·K, γ = 1.40;  ΔH = 201.0 kJ;  ΔU = 143.6 kJ;  W = 57.4 kJ; Q = ΔH = 201.0 kJ.</p><h4>Validity check</h4><p>The two routes must agree: Q = ΔU + W = 143.6 + 57.4 = 201.0 kJ, which equals ΔH. That agreement is the definition H = U + P V showing up numerically, and it is the quickest check in any constant-pressure problem.</p>
      gu: |-
        <h4>આપેલ</h4><p>એક ideal gas માટે c_p = 1.005 kJ/kg·K તથા R = 0.287 kJ/kg·K. 2 kg gas અચળ pressure પર 100 K ગરમ કરાય છે.</p><h4>શોધો</h4><p>c_v, γ, ΔH, ΔU તથા થયેલું work.</p><h4>સૂત્ર</h4><div class="math" data-tex="c_v=c_p-R" aria-label="c_v=c_p-R">c_v = c_p − R</div><div class="math" data-tex="\gamma=\frac{c_p}{c_v}" aria-label="\gamma=\frac{c_p}{c_v}">γ = c_p / c_v</div><div class="math" data-tex="W=mR\Delta T" aria-label="W=mR\Delta T">ΔH = m c_p ΔT ,  ΔU = m c_v ΔT ,  W = P ΔV = m R ΔT</div><h4>Substitution તથા Calculation</h4><p>c_v = 1.005 − 0.287 = 0.718 kJ/kg·K. γ = 1.005/0.718 = 1.40. ΔH = 2 × 1.005 × 100 = 201.0 kJ. ΔU = 2 × 0.718 × 100 = 143.6 kJ. W = 2 × 0.287 × 100 = 57.4 kJ.</p><h4>Units સાથે અંતિમ જવાબ</h4><p>c_v = 0.718 kJ/kg·K, γ = 1.40;  ΔH = 201.0 kJ;  ΔU = 143.6 kJ;  W = 57.4 kJ; Q = ΔH = 201.0 kJ.</p><h4>Validity Check</h4><p>બંને રસ્તા મળવા જોઈએ: Q = ΔU + W = 143.6 + 57.4 = 201.0 kJ, જે ΔH જેટલું છે. આ મેળ એ H = U + P V વ્યાખ્યા આંકડામાં દેખાય તે છે, અને કોઈપણ constant-pressure દાખલામાં સૌથી ઝડપી ચકાસણી છે.</p>
- ref: N6
  title:
    en: 'Nozzle: converting enthalpy into velocity'
    gu: 'Nozzle: enthalpy ને velocity માં ફેરવવી'
  format: rich_cards
  items:
  - h:
      en: 'Nozzle: converting enthalpy into velocity'
      gu: 'Nozzle: enthalpy ને velocity માં ફેરવવી'
    body:
      en: |-
        <h4>Given</h4><p>Steam enters a well-insulated nozzle at 10 bar, 320 °C with velocity 40 m/s and leaves at 3 bar. The inlet enthalpy is 3 082 kJ/kg and the exit enthalpy 2 902 kJ/kg.</p><h4>Find</h4><p>Exit velocity and the mass flow needed for 0.5 kg/s of steam to give a thrust.</p><h4>Formula</h4><div class="math" data-tex="h_1+\tfrac12c_1^2=h_2+\tfrac12c_2^2" aria-label="h_1+\tfrac12c_1^2=h_2+\tfrac12c_2^2">Q = 0, W_s = 0, Δz = 0 ⇒ h₁ + ½c₁² = h₂ + ½c₂²</div><div class="math" data-tex="c_2=\sqrt{2(h_1-h_2)+c_1^2}" aria-label="c_2=\sqrt{2(h_1-h_2)+c_1^2}">c₂ = √(2 (h₁ − h₂) + c₁²)</div><h4>Substitution and calculation</h4><p>h₁ − h₂ = 180 kJ/kg = 180 000 J/kg. Then c₂² = 2 × 180 000 + 40² = 360 000 + 1 600 = 361 600 ⇒ c₂ = 601.3 m/s.</p><h4>Final answer with units</h4><p>c₂ ≈ 601 m/s (the 1 600 term is only 0.4 % of the total, so inlet velocity is usually neglected). For 0.5 kg/s the momentum change is 0.5 × 601 ≈ 300 N of thrust.</p><h4>Validity check</h4><p>Nozzles are adiabatic and do no shaft work, so the whole enthalpy drop becomes kinetic energy — 180 kJ/kg giving about 600 m/s is the standard order for steam. Note the unit conversion: kJ/kg must be multiplied by 1 000 to give m²/s².</p>
      gu: |-
        <h4>આપેલ</h4><p>Steam well-insulated nozzle માં 10 bar, 320 °C પર 40 m/s velocity સાથે આવે છે અને 3 bar પર નીકળે છે. Inlet enthalpy 3 082 kJ/kg તથા exit enthalpy 2 902 kJ/kg.</p><h4>શોધો</h4><p>Exit velocity અને 0.5 kg/s steam માટે જરૂરી mass flow.</p><h4>સૂત્ર</h4><div class="math" data-tex="h_1+\tfrac12c_1^2=h_2+\tfrac12c_2^2" aria-label="h_1+\tfrac12c_1^2=h_2+\tfrac12c_2^2">Q = 0, W_s = 0, Δz = 0 ⇒ h₁ + ½c₁² = h₂ + ½c₂²</div><div class="math" data-tex="c_2=\sqrt{2(h_1-h_2)+c_1^2}" aria-label="c_2=\sqrt{2(h_1-h_2)+c_1^2}">c₂ = √(2 (h₁ − h₂) + c₁²)</div><h4>Substitution તથા Calculation</h4><p>h₁ − h₂ = 180 kJ/kg = 180 000 J/kg. પછી c₂² = 2 × 180 000 + 40² = 360 000 + 1 600 = 361 600 ⇒ c₂ = 601.3 m/s.</p><h4>Units સાથે અંતિમ જવાબ</h4><p>c₂ ≈ 601 m/s (1 600 પદ કુલના ફક્ત 0.4 % છે, તેથી inlet velocity સામાન્ય રીતે નગણ્ય ગણાય). 0.5 kg/s માટે momentum ફેરફાર 0.5 × 601 ≈ 300 N thrust.</p><h4>Validity Check</h4><p>Nozzle adiabatic હોય અને shaft work કરતું નથી, તેથી આખો enthalpy ઘટાડો kinetic energy બને — 180 kJ/kg માટે લગભગ 600 m/s steam માટે પ્રમાણભૂત ક્રમ છે. Unit conversion ધ્યાનમાં રાખો: m²/s² મળે તે માટે kJ/kg ને 1 000 વડે ગુણવું પડે.</p>
syntax:
- title:
    en: First law forms
    gu: પ્રથમ નિયમનાં સ્વરૂપો
  items:
  - title:
      en: Closed system
      gu: Closed system
    f: Q − W = ΔU  (stationary);  Q − W = ΔU + ΔKE + ΔPE  (general)
    terms: Heat in and work out are positive in this course.
  - title:
      en: Steady flow
      gu: Steady flow
    f: q − w_s = (h₂ − h₁) + ½(c₂² − c₁²) + g(z₂ − z₁)
    terms: One inlet, one outlet, properties uniform at each section.
  - title:
      en: Cycle
      gu: Cycle
    f: ∮dU = 0  ⇒  Q_net = W_net
    terms: ΔU of a complete cycle is zero.
- title:
    en: Properties and heat capacity
    gu: Properties તથા heat capacity
  items:
  - title:
      en: Enthalpy
      gu: Enthalpy
    f: H = U + P V;   h = u + P v
    terms: h replaces u in every flow equation, with no flow-work term.
  - title:
      en: Ideal gas
      gu: Ideal gas
    f: ΔU = m c_v ΔT;   ΔH = m c_p ΔT;   c_p − c_v = R;   γ = c_p / c_v
    terms: True for every path when the gas is ideal.
  - title:
      en: Non-flow work
      gu: Non-flow work
    f: 'W = ∫P dV (reversible);  constant P: W = P ΔV;  constant V: W = 0'
    terms: Valid for a reversible path only.
  - title:
      en: Isothermal and adiabatic
      gu: Isothermal તથા adiabatic
    f: 'isothermal: W = mRT ln(V₂/V₁);  adiabatic: T₂/T₁ = (P₂/P₁)^((γ−1)/γ)'
    terms: 'Adiabatic also: P V^γ = constant, T V^(γ−1) = constant.'
