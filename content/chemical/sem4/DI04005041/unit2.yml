viva:
- q:
    en: State the first law of thermodynamics and give its mathematical form for a closed system.
    gu: થર્મોડાયનેમિક્સનો પ્રથમ નિયમ જણાવો અને closed system માટે તેનું ગાણિતિક સ્વરૂપ આપો.
  a:
    en: Energy can neither be created nor destroyed, only converted. For a closed system Q − W = ΔU + Δ(KE) + Δ(PE), and for a closed stationary system Q − W = ΔU.
    gu: ઊર્જા ઉત્પન્ન કે નષ્ટ થઈ શકતી નથી, ફક્ત રૂપાંતરિત થાય. closed system માટે Q − W = ΔU + Δ(KE) + Δ(PE), અને closed સ્થિર system માટે Q − W = ΔU.
- q:
    en: What is internal energy? Why is only its change calculated?
    gu: Internal energy શું છે? તેનો ફક્ત ફેરફાર જ કેમ ગણાય છે?
  a:
    en: Internal energy is the sum of the molecular kinetic and potential energies of the system. Its absolute value depends on an arbitrary reference state, which does not affect any energy balance, so only differences between states are used.
    gu: Internal energy એ system ના molecular kinetic તથા potential energy નો સરવાળો છે. તેની નિરપેક્ષ કિંમત મનસ્વી reference state પર આધાર રાખે, જે કોઈ energy balance ને અસર કરતી નથી, તેથી ફક્ત states વચ્ચેના તફાવત વપરાય છે.
- q:
    en: Define enthalpy and explain why it is used for flow processes.
    gu: Enthalpy ની વ્યાખ્યા આપો અને flow processes માટે તે કેમ વપરાય છે તે સમજાવો.
  a:
    en: H = U + P V. For a flowing fluid the surroundings also do flow work P V to push it across the boundary; grouping that with U gives H, so the steady-flow equation contains h with no separate flow-work term. That is why steam tables give h.
    gu: H = U + P V. વહેતા fluid માટે surroundings તેને boundary પાર ધકેલવા flow work P V પણ કરે છે; તેને U સાથે જૂથ કરવાથી H મળે, તેથી steady-flow equation માં અલગ flow-work પદ વગર h આવે. એટલે જ steam tables h આપે છે.
- q:
    en: Why is c_p greater than c_v for a gas?
    gu: Gas માટે c_p એ c_v કરતાં મોટું કેમ હોય છે?
  a:
    en: At constant volume no work is done, so all the heat raises internal energy. At constant pressure the gas also expands and does work P Δv, so extra heat is needed for the same temperature rise. For an ideal gas c_p − c_v = R.
    gu: અચળ volume પર કોઈ work થતું નથી, તેથી આખી heat internal energy વધારે. અચળ pressure પર gas expand થઈને work P Δv પણ કરે છે, તેથી એટલા જ temperature વધારા માટે વધુ heat જોઈએ. ideal gas માટે c_p − c_v = R.
- q:
    en: Write the steady-flow energy equation and state its assumptions.
    gu: Steady-flow energy equation લખો અને તેની assumptions જણાવો.
  a:
    en: 'q − w_s = (h₂ − h₁) + ½(c₂² − c₁²) + g(z₂ − z₁). Assumptions: steady state, one inlet and one outlet, uniform properties at each section, no reaction, and changes of kinetic and potential energy often neglected.'
    gu: 'q − w_s = (h₂ − h₁) + ½(c₂² − c₁²) + g(z₂ − z₁). Assumptions: steady state, એક inlet તથા એક outlet, દરેક section પર સરખી properties, કોઈ reaction નહીં, અને ઘણી વાર kinetic તથા potential energy ના ફેરફાર નગણ્ય.'
- q:
    en: Distinguish between a non-flow and a flow process with one example each.
    gu: Non-flow તથા flow પ્રક્રિયા વચ્ચે ભેદ આપો, દરેકનું એક ઉદાહરણ આપો.
  a:
    en: In a non-flow process a fixed mass stays in the system and no mass crosses the boundary (gas heated in a closed cylinder, Q − W = ΔU). In a flow process mass enters and leaves continuously (compressor, turbine, nozzle) and the equation uses enthalpy instead of internal energy.
    gu: Non-flow પ્રક્રિયામાં નિશ્ચિત mass system માં રહે છે અને boundary પાર mass જતું નથી (closed cylinder માં ગરમ થતો gas, Q − W = ΔU). Flow પ્રક્રિયામાં mass સતત અંદર આવે તથા બહાર જાય (compressor, turbine, nozzle) અને સમીકરણ internal energy ને બદલે enthalpy વાપરે.
- q:
    en: Show that Q_net = W_net for a cyclic process.
    gu: Cyclic પ્રક્રિયા માટે Q_net = W_net સાબિત કરો.
  a:
    en: 'A cycle returns the system to its initial state, so ΔU = 0. The first law Q − W = ΔU then gives Q_net = W_net: the net heat supplied equals the net work delivered.'
    gu: 'Cycle system ને પ્રારંભિક state પર પાછું લાવે છે, તેથી ΔU = 0. પ્રથમ નિયમ Q − W = ΔU પરથી Q_net = W_net મળે: ચોખ્ખી અપાયેલી heat ચોખ્ખા આપેલા work જેટલી.'
- q:
    en: What is a perpetual-motion machine of the first kind?
    gu: પહેલા પ્રકારની perpetual-motion machine શું છે?
  a:
    en: A machine that would deliver work continuously with no energy input. The first law forbids it because the energy account could never balance.
    gu: એવી machine જે કોઈ ઊર્જા લીધા વગર સતત work આપે. પ્રથમ નિયમ તેને નિષેધે છે કારણ કે ઊર્જાનો હિસાબ કદી બેસી શકે નહીં.
exam_questions:
- q:
    en: State the first law of thermodynamics. Express it for (i) a closed system, (ii) a closed stationary system, (iii) a cyclic process.
    gu: થર્મોડાયનેમિક્સનો પ્રથમ નિયમ જણાવો. તેને (i) closed system, (ii) closed સ્થિર system, (iii) cyclic પ્રક્રિયા માટે લખો.
  marks: 4
- q:
    en: Define internal energy and enthalpy. Derive the relation H = U + P V and explain why enthalpy appears in flow processes.
    gu: Internal energy તથા enthalpy ની વ્યાખ્યા આપો. H = U + P V સંબંધ મેળવો અને flow processes માં enthalpy કેમ આવે તે સમજાવો.
  marks: 4
- q:
    en: Explain why c_p is greater than c_v for a gas. Show that c_p − c_v = R for an ideal gas.
    gu: Gas માટે c_p એ c_v કરતાં મોટું કેમ છે તે સમજાવો. ideal gas માટે c_p − c_v = R દર્શાવો.
  marks: 4
- q:
    en: Derive the steady-flow energy equation for a control volume with one inlet and one outlet, stating all assumptions clearly.
    gu: એક inlet તથા એક outlet વાળા control volume માટે steady-flow energy equation મેળવો અને બધી assumptions સ્પષ્ટ લખો.
  marks: 4
- q:
    en: Distinguish between a non-flow and a flow process. Write the first-law equation for each and give two examples of each.
    gu: Non-flow તથા flow પ્રક્રિયા વચ્ચે ભેદ આપો. દરેકના પ્રથમ નિયમનું સમીકરણ લખો અને દરેકના બે ઉદાહરણ આપો.
  marks: 4
- q:
    en: 0.5 kg of air is heated in a rigid vessel from 27 °C to 227 °C. Calculate W, ΔU and Q. Take c_v = 0.718 kJ/kg·K.
    gu: 0.5 kg હવા દૃઢ પાત્રમાં 27 °C થી 227 °C સુધી ગરમ કરાય છે. W, ΔU તથા Q ગણો. c_v = 0.718 kJ/kg·K લો.
  marks: 4
- q:
    en: 2 kg of air expands isothermally at 400 K from 1.5 bar to 0.5 bar. Find the work done and the heat transferred. R = 0.287 kJ/kg·K.
    gu: 2 kg હવા 400 K પર 1.5 bar થી 0.5 bar સુધી isothermal રીતે expand થાય છે. થયેલું work તથા transfer થયેલી heat શોધો. R = 0.287 kJ/kg·K.
  marks: 4
- q:
    en: 1 kg of air at 300 K is compressed adiabatically and reversibly to 5 bar. Find the final temperature and the work input. Take γ = 1.4, c_v = 0.718 kJ/kg·K.
    gu: 300 K પરની 1 kg હવા 5 bar સુધી adiabatic તથા reversible રીતે compress થાય છે. અંતિમ temperature તથા work input શોધો. γ = 1.4, c_v = 0.718 kJ/kg·K લો.
  marks: 4
- q:
    en: Air enters a compressor at 1 bar, 300 K and leaves at 6 bar, 480 K. Mass flow 0.05 kg/s, heat loss 3 kW, c_p = 1.005 kJ/kg·K. Calculate the shaft power.
    gu: Air compressor માં 1 bar, 300 K પર આવે છે અને 6 bar, 480 K પર નીકળે છે. Mass flow 0.05 kg/s, heat loss 3 kW, c_p = 1.005 kJ/kg·K. Shaft power ગણો.
  marks: 4
- q:
    en: Steam enters an insulated nozzle at 3 082 kJ/kg and leaves at 2 902 kJ/kg. If the inlet velocity is 40 m/s, find the exit velocity.
    gu: Steam insulated nozzle માં 3 082 kJ/kg પર આવે છે અને 2 902 kJ/kg પર નીકળે છે. Inlet velocity 40 m/s હોય તો exit velocity શોધો.
  marks: 4
- q:
    en: For an ideal gas c_p = 1.005 and R = 0.287 kJ/kg·K. Find c_v and γ, and calculate ΔH, ΔU and W when 2 kg is heated at constant pressure through 100 K.
    gu: ideal gas માટે c_p = 1.005 તથા R = 0.287 kJ/kg·K. c_v તથા γ શોધો, અને 2 kg ને અચળ pressure પર 100 K ગરમ કરતાં ΔH, ΔU તથા W ગણો.
  marks: 4
- q:
    en: State the limitations of the first law of thermodynamics and explain why a second law is needed.
    gu: થર્મોડાયનેમિક્સના પ્રથમ નિયમની મર્યાદાઓ જણાવો અને બીજો નિયમ કેમ જરૂરી છે તે સમજાવો.
  marks: 4
