- title:
    en: 2.1  Statement of the first law
    gu: 2.1  પ્રથમ નિયમનું વિધાન
  items:
  - h:
      en: Statement of the first law
      gu: પ્રથમ નિયમનું વિધાન
    body:
      en: |-
        <h4>Definition / principle</h4><p>The <b>first law of thermodynamics</b> states that energy can neither be created nor destroyed, only converted from one form to another. For a closed system that changes from state 1 to state 2, the heat supplied minus the work done equals the change of total energy: <b>Q − W = ΔE</b>.</p><h4>Detailed theory and conditions</h4><p>The law is a statement about the <i>accounting</i>, not about the mechanism. It says the books must balance: whatever crosses the boundary as heat either leaves as work or stays inside as a rise of internal, kinetic and potential energy. It therefore forbids a machine that produces work with no energy input (a perpetual-motion machine of the first kind), and it makes internal energy a property with a definite value at every state.<br><br>For a closed, stationary system the kinetic and potential terms are zero and the law reduces to the form used in almost every numerical: <b>Q − W = ΔU</b>. When an ideal gas is the system, ΔU = m c<sub>v</sub> ΔT, so the temperature change follows from the heat and work alone, whatever the path.</p><h4>Equations and notation</h4><div class="math" data-tex="Q-W=\Delta U+\Delta KE+\Delta PE" aria-label="Q-W=\Delta U+\Delta KE+\Delta PE">Q − W = ΔU + Δ(KE) + Δ(PE)</div><div class="math" data-tex="Q-W=\Delta U" aria-label="Q-W=\Delta U">closed, stationary:  Q − W = ΔU</div><div class="math" data-tex="\delta Q-\delta W=dU" aria-label="\delta Q-\delta W=dU">differential form:  δQ − δW = dU</div><h4>Key points and data</h4><ul><li><b>Sign convention used here:</b> heat added to the system is positive, work done by the system is positive. State the convention before substituting numbers.</li><li><b>Cyclic process:</b> ΔU = 0, so Q<sub>net</sub> = W<sub>net</sub> for the cycle.</li><li><b>Adiabatic:</b> Q = 0, so W = −ΔU: the work comes out of the internal energy.</li><li><b>Perpetual motion of the first kind</b> is a machine giving work without energy input; the first law makes it impossible.</li></ul><h4>Qualification</h4><p>The first law fixes only the <i>difference</i> Q − W, never Q and W separately, and it says nothing about direction. A process in which heat flows from cold to hot would satisfy it, so the second law is still needed before any real cycle can be analysed.</p>
      gu: |-
        <h4>વ્યાખ્યા / સિદ્ધાંત</h4><p><b>થર્મોડાયનેમિક્સનો પ્રથમ નિયમ</b> કહે છે કે ઊર્જા ઉત્પન્ન કે નષ્ટ થઈ શકતી નથી, ફક્ત એક સ્વરૂપમાંથી બીજા સ્વરૂપમાં ફેરવાય છે. state 1 થી state 2 માં જતી closed system માટે, અપાયેલી heat માંથી થયેલું work બાદ કરતાં કુલ ઊર્જાનો ફેરફાર મળે: <b>Q − W = ΔE</b>.</p><h4>વિગતવાર Theory તથા Conditions</h4><p>આ નિયમ <i>હિસાબ</i> વિશે છે, mechanism વિશે નથી. તે કહે છે કે હિસાબ બરાબર બેસવો જોઈએ: boundary પાર heat તરીકે જે જાય તે કાં તો work તરીકે નીકળે, કાં તો અંદર internal, kinetic તથા potential energy ના વધારા તરીકે રહે. તેથી જે machine કોઈ ઊર્જા લીધા વગર work આપે (પહેલા પ્રકારની perpetual-motion machine) તેને તે નિષેધે છે, અને internal energy ને દરેક state પર ચોક્કસ કિંમત ધરાવતી property બનાવે છે.<br><br>closed, સ્થિર system માટે kinetic તથા potential પદ શૂન્ય થાય અને નિયમ લગભગ દરેક દાખલામાં વપરાતા સ્વરૂપમાં આવે: <b>Q − W = ΔU</b>. system ideal gas હોય તો ΔU = m c<sub>v</sub> ΔT, તેથી temperature નો ફેરફાર ફક્ત heat તથા work પરથી મળે, path કોઈ પણ હોય.</p><h4>સમીકરણો તથા Notation</h4><div class="math" data-tex="Q-W=\Delta U+\Delta KE+\Delta PE" aria-label="Q-W=\Delta U+\Delta KE+\Delta PE">Q − W = ΔU + Δ(KE) + Δ(PE)</div><div class="math" data-tex="Q-W=\Delta U" aria-label="Q-W=\Delta U">closed, stationary:  Q − W = ΔU</div><div class="math" data-tex="\delta Q-\delta W=dU" aria-label="\delta Q-\delta W=dU">differential form:  δQ − δW = dU</div><h4>મુખ્ય મુદ્દા તથા data</h4><ul><li><b>Sign convention used here:</b> heat added to the system is positive, work done by the system is positive. State the convention before substituting numbers.</li><li><b>Cyclic process:</b> ΔU = 0, so Q<sub>net</sub> = W<sub>net</sub> for the cycle.</li><li><b>Adiabatic:</b> Q = 0, so W = −ΔU: the work comes out of the internal energy.</li><li><b>Perpetual motion of the first kind</b> is a machine giving work without energy input; the first law makes it impossible.</li></ul><h4>નોંધ</h4><p>પ્રથમ નિયમ ફક્ત <i>તફાવત</i> Q − W નિશ્ચિત કરે છે, Q તથા W અલગ અલગ કદી નહીં, અને દિશા વિશે કંઈ કહેતો નથી. ઠંડા તરફથી ગરમ તરફ heat જાય તેવી પ્રક્રિયા પણ તેને સંતોષે, તેથી કોઈ પણ વાસ્તવિક cycle વિશ્લેષણ કરતાં પહેલાં બીજો નિયમ પણ જરૂરી છે.</p>
    diagram: d2_energy_forms
- title:
    en: 2.2  Internal energy, enthalpy and heat capacity
    gu: 2.2  Internal energy, enthalpy તથા heat capacity
  items:
  - h:
      en: Internal energy, enthalpy and heat capacity
      gu: Internal energy, enthalpy તથા heat capacity
    body:
      en: |-
        <h4>Definition / principle</h4><p><b>Internal energy U</b> is the total energy of the molecules of the system — their translational, rotational and vibrational motion plus the energy stored in molecular bonds. <b>Enthalpy H</b> is the combination <b>H = U + P V</b>. <b>Heat capacity</b> is the heat needed to raise the temperature of the system by one degree: C = δQ/dT, and per unit mass c = C/m.</p><h4>Detailed theory and conditions</h4><p>Enthalpy looks like an arbitrary grouping, but it is the natural property for a flow process. When a fluid is pushed into a control volume, the surroundings do flow work P V on it; adding that to U gives H, and the steady-flow energy equation then contains h instead of u, with no separate flow-work term. That is why steam tables tabulate h and not u for most engineering work.<br><br>Two heat capacities exist because there are two ways to heat a gas. At constant volume the gas cannot expand, so all the heat raises U: c<sub>v</sub> = (∂u/∂T)<sub>v</sub>. At constant pressure the gas also does work P Δv while it expands, so more heat is needed for the same temperature rise: c<sub>p</sub> = (∂h/∂T)<sub>p</sub>. For an ideal gas the difference is exactly the gas constant, c<sub>p</sub> − c<sub>v</sub> = R, and the ratio γ = c<sub>p</sub>/c<sub>v</sub> controls every adiabatic process.</p><h4>Equations and notation</h4><div class="math" data-tex="H=U+PV" aria-label="H=U+PV">H = U + P V</div><div class="math" data-tex="h=u+Pv" aria-label="h=u+Pv">h = u + P v</div><div class="math" data-tex="c_v=\left(\frac{\partial u}{\partial T}\right)_v,\quad c_p=\left(\frac{\partial h}{\partial T}\right)_p" aria-label="c_v=\left(\frac{\partial u}{\partial T}\right)_v,\quad c_p=\left(\frac{\partial h}{\partial T}\right)_p">c_v = (∂u/∂T)_v        c_p = (∂h/∂T)_p</div><div class="math" data-tex="c_p-c_v=R,\quad \gamma=\frac{c_p}{c_v}" aria-label="c_p-c_v=R,\quad \gamma=\frac{c_p}{c_v}">ideal gas:  c_p − c_v = R        γ = c_p / c_v</div><h4>Key points and data</h4><ul><li><b>U is a state function</b>; absolute U is never needed, only ΔU between two states.</li><li><b>Ideal gas:</b> U and H depend on temperature only (Joule's law), so ΔU = m c<sub>v</sub> ΔT and ΔH = m c<sub>p</sub> ΔT for every path.</li><li><b>Typical values:</b> air c<sub>p</sub> = 1.005 kJ/kg·K, c<sub>v</sub> = 0.718, γ = 1.40; water c<sub>p</sub> = 4.187 kJ/kg·K; steam c<sub>p</sub> ≈ 2.1 kJ/kg·K.</li><li><b>Solids and liquids:</b> c<sub>p</sub> ≈ c<sub>v</sub> ≈ c because they hardly expand, and both U and H are nearly functions of T alone.</li></ul><h4>Qualification</h4><p>Heat capacity is not constant. For real gases it rises with temperature, and for water it peaks near 4 °C. Using a single tabulated c over a wide temperature range is an approximation that must be stated, and near a phase change heat capacity has no meaning at all — the latent heat is used instead.</p>
      gu: |-
        <h4>વ્યાખ્યા / સિદ્ધાંત</h4><p><b>Internal energy U</b> એ system ના molecules ની કુલ ઊર્જા છે — તેમની translational, rotational તથા vibrational ગતિ ઉપરાંત molecular bonds માં સંગ્રહાયેલી ઊર્જા. <b>Enthalpy H</b> એ સંયોજન છે <b>H = U + P V</b>. <b>Heat capacity</b> એ system નું temperature એક ડિગ્રી વધારવા જરૂરી heat છે: C = δQ/dT, અને પ્રતિ એકમ દળ c = C/m.</p><h4>વિગતવાર Theory તથા Conditions</h4><p>Enthalpy કોઈ મનસ્વી જૂથ જેવું લાગે, પણ flow process માટે તે સ્વાભાવિક property છે. જ્યારે fluid ને control volume માં ધકેલાય છે ત્યારે surroundings તેના પર flow work P V કરે છે; તેને U માં ઉમેરતાં H મળે, અને પછી steady-flow energy equation માં u ને બદલે h આવે, અલગ flow-work પદ વગર. એટલે જ steam tables મોટાભાગના engineering કામ માટે u નહીં પણ h આપે છે.<br><br>બે heat capacities છે કારણ કે gas ને ગરમ કરવાની બે રીતો છે. અચળ volume પર gas expand થઈ શકતું નથી, તેથી આખી heat U વધારે: c<sub>v</sub> = (∂u/∂T)<sub>v</sub>. અચળ pressure પર gas expand થતાં work P Δv પણ કરે છે, તેથી એટલા જ temperature વધારા માટે વધુ heat જોઈએ: c<sub>p</sub> = (∂h/∂T)<sub>p</sub>. ideal gas માટે તફાવત બરાબર gas constant જેટલો હોય છે, c<sub>p</sub> − c<sub>v</sub> = R, અને ગુણોત્તર γ = c<sub>p</sub>/c<sub>v</sub> દરેક adiabatic પ્રક્રિયાને નિયંત્રિત કરે છે.</p><h4>સમીકરણો તથા Notation</h4><div class="math" data-tex="H=U+PV" aria-label="H=U+PV">H = U + P V</div><div class="math" data-tex="h=u+Pv" aria-label="h=u+Pv">h = u + P v</div><div class="math" data-tex="c_v=\left(\frac{\partial u}{\partial T}\right)_v,\quad c_p=\left(\frac{\partial h}{\partial T}\right)_p" aria-label="c_v=\left(\frac{\partial u}{\partial T}\right)_v,\quad c_p=\left(\frac{\partial h}{\partial T}\right)_p">c_v = (∂u/∂T)_v        c_p = (∂h/∂T)_p</div><div class="math" data-tex="c_p-c_v=R,\quad \gamma=\frac{c_p}{c_v}" aria-label="c_p-c_v=R,\quad \gamma=\frac{c_p}{c_v}">ideal gas:  c_p − c_v = R        γ = c_p / c_v</div><h4>મુખ્ય મુદ્દા તથા data</h4><ul><li><b>U is a state function</b>; absolute U is never needed, only ΔU between two states.</li><li><b>Ideal gas:</b> U and H depend on temperature only (Joule's law), so ΔU = m c<sub>v</sub> ΔT and ΔH = m c<sub>p</sub> ΔT for every path.</li><li><b>Typical values:</b> air c<sub>p</sub> = 1.005 kJ/kg·K, c<sub>v</sub> = 0.718, γ = 1.40; water c<sub>p</sub> = 4.187 kJ/kg·K; steam c<sub>p</sub> ≈ 2.1 kJ/kg·K.</li><li><b>Solids and liquids:</b> c<sub>p</sub> ≈ c<sub>v</sub> ≈ c because they hardly expand, and both U and H are nearly functions of T alone.</li></ul><h4>નોંધ</h4><p>Heat capacity અચળ હોતું નથી. વાસ્તવિક gases માટે તે temperature સાથે વધે છે, અને પાણી માટે 4 °C ની આસપાસ શિખરે છે. મોટા temperature ગાળામાં એક જ tabulated c વાપરવું એ approximation છે જે લખવી જોઈએ, અને phase change ની નજીક heat capacity નો અર્થ જ નથી — ત્યાં latent heat વપરાય છે.</p>
    diagram: d2_heat_capacity
- title:
    en: 2.3  Non-flow processes and the steady-flow equation
    gu: 2.3  Non-flow પ્રક્રિયાઓ તથા steady-flow equation
  items:
  - h:
      en: First law for non-flow processes
      gu: non-flow પ્રક્રિયાઓ માટે પ્રથમ નિયમ
    body:
      en: |-
        <h4>Definition / principle</h4><p>A <b>non-flow process</b> is one in which the same fixed mass stays inside the system — filling, heating, expanding a gas in a cylinder. No mass crosses the boundary, so the energy equation is simply <b>Q − W = ΔU</b>, with W = ∫P dV for a reversible path.</p><h4>Detailed theory and conditions</h4><p>Four reversible non-flow paths cover almost every question, and each has a characteristic P–V signature. In a <b>constant-volume</b> (isochoric) process no work is done at all, so Q = ΔU = m c<sub>v</sub> ΔT. In a <b>constant-pressure</b> (isobaric) process the work is P ΔV and the heat supplied equals the enthalpy change, Q = ΔH = m c<sub>p</sub> ΔT — which is precisely why enthalpy is used for heaters and reactors. In a <b>constant-temperature</b> (isothermal) process of an ideal gas ΔU = 0, so all the heat becomes work. In an <b>adiabatic</b> process Q = 0, so the work comes out of internal energy and the gas cools as it expands.</p><h4>Equations and notation</h4><div class="math" data-tex="W=0,\quad Q=\Delta U=mc_v\Delta T" aria-label="W=0,\quad Q=\Delta U=mc_v\Delta T">constant V:  W = 0 ,  Q = ΔU = m c_v ΔT</div><div class="math" data-tex="W=P\Delta V,\quad Q=\Delta H=mc_p\Delta T" aria-label="W=P\Delta V,\quad Q=\Delta H=mc_p\Delta T">constant P:  W = P ΔV ,  Q = ΔH = m c_p ΔT</div><div class="math" data-tex="\Delta U=0,\quad W=Q=mRT\ln\frac{V_2}{V_1}" aria-label="\Delta U=0,\quad W=Q=mRT\ln\frac{V_2}{V_1}">isothermal, ideal gas:  ΔU = 0 ,  W = Q = m R T ln(V₂/V₁)</div><div class="math" data-tex="Q=0,\quad W=-\Delta U=mc_v(T_1-T_2)" aria-label="Q=0,\quad W=-\Delta U=mc_v(T_1-T_2)">adiabatic, ideal gas:  Q = 0 ,  W = −ΔU = m c_v (T₁ − T₂)</div><h4>Key points and data</h4><ul><li><b>Isochoric:</b> vertical line on a P–V diagram. Used for a closed vessel being heated.</li><li><b>Isobaric:</b> horizontal line. Used for a heater or a piston free to move.</li><li><b>Isothermal:</b> rectangular hyperbola P V = constant. Used for slow heat exchange with a large bath.</li><li><b>Adiabatic:</b> steeper than the isotherm, P V<sup>γ</sup> = constant. Used for a well-insulated compressor or expansion.</li></ul><h4>Qualification</h4><p>The formulas W = P ΔV and W = ∫P dV apply to the <i>reversible</i> path. In a real fast expansion the pressure inside the gas is not uniform and the actual work is less; the work must then be taken from the surroundings side or given directly.</p>
      gu: |-
        <h4>વ્યાખ્યા / સિદ્ધાંત</h4><p><b>Non-flow process</b> એ એવી પ્રક્રિયા છે જેમાં એ જ નિશ્ચિત mass system ની અંદર રહે છે — cylinder માં gas ભરવો, ગરમ કરવો, expand કરવો. boundary પાર કોઈ mass જતું નથી, તેથી energy equation સીધું <b>Q − W = ΔU</b> છે, અને reversible path માટે W = ∫P dV.</p><h4>વિગતવાર Theory તથા Conditions</h4><p>ચાર reversible non-flow રસ્તા લગભગ દરેક પ્રશ્ન આવરી લે છે, અને દરેકની પોતાની P–V ઓળખ છે. <b>અચળ volume</b> (isochoric) પ્રક્રિયામાં કોઈ work થતું નથી, તેથી Q = ΔU = m c<sub>v</sub> ΔT. <b>અચળ pressure</b> (isobaric) પ્રક્રિયામાં work P ΔV થાય અને અપાયેલી heat enthalpy ના ફેરફાર જેટલી હોય, Q = ΔH = m c<sub>p</sub> ΔT — એટલે જ heaters તથા reactors માટે enthalpy વપરાય છે. ideal gas ની <b>અચળ temperature</b> (isothermal) પ્રક્રિયામાં ΔU = 0, તેથી આખી heat work બને છે. <b>Adiabatic</b> પ્રક્રિયામાં Q = 0, તેથી work internal energy માંથી આવે અને expand થતાં gas ઠંડું થાય છે.</p><h4>સમીકરણો તથા Notation</h4><div class="math" data-tex="W=0,\quad Q=\Delta U=mc_v\Delta T" aria-label="W=0,\quad Q=\Delta U=mc_v\Delta T">constant V:  W = 0 ,  Q = ΔU = m c_v ΔT</div><div class="math" data-tex="W=P\Delta V,\quad Q=\Delta H=mc_p\Delta T" aria-label="W=P\Delta V,\quad Q=\Delta H=mc_p\Delta T">constant P:  W = P ΔV ,  Q = ΔH = m c_p ΔT</div><div class="math" data-tex="\Delta U=0,\quad W=Q=mRT\ln\frac{V_2}{V_1}" aria-label="\Delta U=0,\quad W=Q=mRT\ln\frac{V_2}{V_1}">isothermal, ideal gas:  ΔU = 0 ,  W = Q = m R T ln(V₂/V₁)</div><div class="math" data-tex="Q=0,\quad W=-\Delta U=mc_v(T_1-T_2)" aria-label="Q=0,\quad W=-\Delta U=mc_v(T_1-T_2)">adiabatic, ideal gas:  Q = 0 ,  W = −ΔU = m c_v (T₁ − T₂)</div><h4>મુખ્ય મુદ્દા તથા data</h4><ul><li><b>Isochoric:</b> vertical line on a P–V diagram. Used for a closed vessel being heated.</li><li><b>Isobaric:</b> horizontal line. Used for a heater or a piston free to move.</li><li><b>Isothermal:</b> rectangular hyperbola P V = constant. Used for slow heat exchange with a large bath.</li><li><b>Adiabatic:</b> steeper than the isotherm, P V<sup>γ</sup> = constant. Used for a well-insulated compressor or expansion.</li></ul><h4>નોંધ</h4><p>W = P ΔV તથા W = ∫P dV સૂત્રો <i>reversible</i> રસ્તા માટે લાગુ પડે. વાસ્તવિક ઝડપી expansion માં gas ની અંદર pressure સરખું હોતું નથી અને ખરેખર work ઓછું મળે; ત્યારે work surroundings ની બાજુથી કે સીધું આપેલું લેવું પડે.</p>
    diagram: d2_nonflow_paths
  - h:
      en: Steady-flow energy equation
      gu: Steady-flow energy equation નું derivation
    body:
      en: |-
        <h4>Symbols, model and assumptions</h4><p><b>Model:</b> a control volume with one inlet (1) and one outlet (2), working fluid steady, properties uniform across each section. <b>Assumptions:</b> steady state (nothing accumulates), no chemical reaction, negligible change of surface energy, single stream in and out.</p><ol><li><p>Take a control volume between sections 1 and 2. In steady state the mass entering equals the mass leaving, so the same mass m flows in and out.</p><div class="math" data-tex="\dot m_{in}=\dot m_{out}=\dot m" aria-label="\dot m_{in}=\dot m_{out}=\dot m">m_in = m_out = m</div></li><li><p>Write what enters with the fluid: internal energy, the flow work needed to push it in, kinetic energy and potential energy.</p><div class="math" data-tex="=m(u_1+P_1v_1)+\tfrac12mc_1^2+mgz_1" aria-label="=m(u_1+P_1v_1)+\tfrac12mc_1^2+mgz_1">in = m (u₁ + P₁v₁) + ½ m c₁² + m g z₁</div></li><li><p>Group u + P v, which is the definition of enthalpy. This is the step that removes flow work from the equation.</p><div class="math" data-tex="u+Pv=h" aria-label="u+Pv=h">u + P v = h   ⇒   in = m (h₁ + ½c₁² + g z₁)</div></li><li><p>Write what leaves in the same way, at section 2.</p><div class="math" data-tex="=m(h_2+\tfrac12c_2^2+gz_2)" aria-label="=m(h_2+\tfrac12c_2^2+gz_2)">out = m (h₂ + ½c₂² + g z₂)</div></li><li><p>Apply the first law to the control volume: heat in minus work out equals the energy that left minus the energy that entered. In steady state there is no change of stored energy inside, so the accumulation is zero.</p><div class="math" data-tex="Q-W_s=out-in" aria-label="Q-W_s=out-in">Q − W_s = out − in</div></li><li><p>Substitute the two groups and divide by the mass flow, giving the equation in the form used for compressors, turbines and nozzles.</p><div class="math" data-tex="Q-W_s=m\left[(h_2-h_1)+\tfrac12(c_2^2-c_1^2)+g(z_2-z_1)\right]" aria-label="Q-W_s=m\left[(h_2-h_1)+\tfrac12(c_2^2-c_1^2)+g(z_2-z_1)\right]">Q − W_s = m [ (h₂ − h₁) + ½(c₂² − c₁²) + g(z₂ − z₁) ]</div></li></ol><h4>Result</h4><div class="math" data-tex="q-w_s=(h_2-h_1)+\tfrac12(c_2^2-c_1^2)+g(z_2-z_1)" aria-label="q-w_s=(h_2-h_1)+\tfrac12(c_2^2-c_1^2)+g(z_2-z_1)">q − w_s = (h₂ − h₁) + ½(c₂² − c₁²) + g(z₂ − z₁)   (per unit mass)</div>
      gu: |-
        <h4>સંકેતો, Model તથા Assumptions</h4><p><b>Model:</b> એક inlet (1) તથા એક outlet (2) વાળું control volume, working fluid steady, દરેક section પર properties સરખી. <b>Assumptions:</b> steady state (કંઈ સંગ્રહાય નહીં), કોઈ chemical reaction નહીં, surface energy નો ફેરફાર નગણ્ય, એક જ stream અંદર તથા બહાર.</p><ol><li><p>section 1 તથા 2 વચ્ચે control volume લો. Steady state માં અંદર આવતું mass બહાર જતા mass જેટલું હોય, તેથી અંદર તથા બહાર એ જ mass m વહે છે.</p><div class="math" data-tex="\dot m_{in}=\dot m_{out}=\dot m" aria-label="\dot m_{in}=\dot m_{out}=\dot m">m_in = m_out = m</div></li><li><p>fluid સાથે અંદર જે આવે તે લખો: internal energy, તેને અંદર ધકેલવા જરૂરી flow work, kinetic energy તથા potential energy.</p><div class="math" data-tex="=m(u_1+P_1v_1)+\tfrac12mc_1^2+mgz_1" aria-label="=m(u_1+P_1v_1)+\tfrac12mc_1^2+mgz_1">in = m (u₁ + P₁v₁) + ½ m c₁² + m g z₁</div></li><li><p>u + P v ને જૂથ કરો, જે enthalpy ની વ્યાખ્યા છે. આ પગલું જ flow work ને સમીકરણમાંથી દૂર કરે છે.</p><div class="math" data-tex="u+Pv=h" aria-label="u+Pv=h">u + P v = h   ⇒   in = m (h₁ + ½c₁² + g z₁)</div></li><li><p>એ જ રીતે section 2 પર જે બહાર જાય તે લખો.</p><div class="math" data-tex="=m(h_2+\tfrac12c_2^2+gz_2)" aria-label="=m(h_2+\tfrac12c_2^2+gz_2)">out = m (h₂ + ½c₂² + g z₂)</div></li><li><p>control volume પર પ્રથમ નિયમ લાગુ કરો: અંદર આવેલી heat માંથી બહાર ગયેલું work બાદ કરતાં બહાર ગયેલી ઊર્જા ઓછી અંદર આવેલી ઊર્જા બરાબર થાય. Steady state માં અંદર સંગ્રહાયેલી ઊર્જા બદલાતી નથી, તેથી accumulation શૂન્ય છે.</p><div class="math" data-tex="Q-W_s=out-in" aria-label="Q-W_s=out-in">Q − W_s = out − in</div></li><li><p>બંને જૂથ મૂકો અને mass flow વડે ભાગો, જેથી compressor, turbine તથા nozzle માટે વપરાતું સ્વરૂપ મળે.</p><div class="math" data-tex="Q-W_s=m\left[(h_2-h_1)+\tfrac12(c_2^2-c_1^2)+g(z_2-z_1)\right]" aria-label="Q-W_s=m\left[(h_2-h_1)+\tfrac12(c_2^2-c_1^2)+g(z_2-z_1)\right]">Q − W_s = m [ (h₂ − h₁) + ½(c₂² − c₁²) + g(z₂ − z₁) ]</div></li></ol><h4>પરિણામ</h4><div class="math" data-tex="q-w_s=(h_2-h_1)+\tfrac12(c_2^2-c_1^2)+g(z_2-z_1)" aria-label="q-w_s=(h_2-h_1)+\tfrac12(c_2^2-c_1^2)+g(z_2-z_1)">q − w_s = (h₂ − h₁) + ½(c₂² − c₁²) + g(z₂ − z₁)   (per unit mass)</div>
    diagram: d2_steady_flow
- title:
    en: 2.4  Forms of work and the c_p - c_v relation
    gu: 2.4  Work નાં સ્વરૂપો તથા c_p - c_v સંબંધ
  items:
  - h:
      en: 'Forms of work: displacement, flow and shaft'
      gu: 'Work નાં સ્વરૂપો: displacement, flow તથા shaft'
    body:
      en: |-
        <h4>Definition / principle</h4><p>Work is energy in transit across a boundary under the action of a force. Three forms dominate chemical engineering: <b>displacement work</b> W = ∫P dV, done when a boundary moves against pressure; <b>flow work</b> P V, done by the surroundings to push fluid into or out of a control volume; and <b>shaft work</b> W = 2π N T, delivered through a rotating shaft.</p><h4>Detailed theory and conditions</h4><p>The distinction matters because only displacement and shaft work appear as W in the first law; flow work is never written separately — it is absorbed into enthalpy precisely so that the equation stays short. A student who adds a flow-work term to the steady-flow equation is counting the same energy twice.<br><br>Sign follows the boundary, not the machine. Work done <i>by</i> the system on the surroundings is positive here, so an expanding gas does positive work and a compressor that consumes work reports a negative W. In an electrical heater the work is negative and the heat supplied is positive, both crossing the same boundary — which is why the account still balances.</p><h4>Equations and notation</h4><div class="math" data-tex="W=\int P\,dV" aria-label="W=\int P\,dV">displacement:  W = ∫ P dV</div><div class="math" data-tex="W_{flow}=PV" aria-label="W_{flow}=PV">flow work:  W_flow = P V  (absorbed into h)</div><div class="math" data-tex="W_s=2\pi NT" aria-label="W_s=2\pi NT">shaft work:  W_s = 2π N T</div><h4>Key points and data</h4><ul><li><b>Displacement work</b> is the area under the process curve on a P–V diagram.</li><li><b>Flow work</b> P V is not a separate term once enthalpy is used: h = u + P v already contains it.</li><li><b>Shaft work</b> is what a pump, compressor, turbine or stirrer delivers; it is positive when the shaft delivers work to the surroundings.</li><li><b>Electrical and magnetic work</b> also cross the boundary without a moving part and must be counted in W.</li></ul><h4>Qualification</h4><p>The integral ∫P dV gives the work only when the path is reversible, because only then is the pressure inside the gas the same as the pressure at the boundary. For free expansion into vacuum the external pressure is zero, so no work is done even though the gas expands.</p>
      gu: |-
        <h4>વ્યાખ્યા / સિદ્ધાંત</h4><p>Work એ boundary પાર બળની અસર હેઠળ પસાર થતી ઊર્જા છે. Chemical engineering માં ત્રણ સ્વરૂપ પ્રભાવી છે: <b>displacement work</b> W = ∫P dV, જ્યારે boundary pressure સામે ખસે ત્યારે થાય; <b>flow work</b> P V, જે surroundings fluid ને control volume માં કે બહાર ધકેલવા કરે; અને <b>shaft work</b> W = 2π N T, ફરતા shaft દ્વારા મળે.</p><h4>વિગતવાર Theory તથા Conditions</h4><p>આ ભેદ મહત્વનો છે કારણ કે પ્રથમ નિયમમાં W તરીકે ફક્ત displacement તથા shaft work આવે; flow work કદી અલગ લખાતું નથી — તેને enthalpy માં સમાવી લેવાય છે જેથી સમીકરણ ટૂંકું રહે. steady-flow equation માં flow-work પદ ઉમેરનાર વિદ્યાર્થી એ જ ઊર્જા બે વાર ગણે છે.<br><br>ચિહ્ન boundary પરથી આવે, machine પરથી નહીં. અહીં system <i>દ્વારા</i> surroundings પર થયેલું work ધન છે, તેથી expand થતો gas ધન work કરે અને work વાપરતો compressor ઋણ W આપે. Electrical heater માં work ઋણ અને અપાયેલી heat ધન હોય, બંને એ જ boundary પાર જાય — એટલે હિસાબ બેસી જાય છે.</p><h4>સમીકરણો તથા Notation</h4><div class="math" data-tex="W=\int P\,dV" aria-label="W=\int P\,dV">displacement:  W = ∫ P dV</div><div class="math" data-tex="W_{flow}=PV" aria-label="W_{flow}=PV">flow work:  W_flow = P V  (absorbed into h)</div><div class="math" data-tex="W_s=2\pi NT" aria-label="W_s=2\pi NT">shaft work:  W_s = 2π N T</div><h4>મુખ્ય મુદ્દા તથા data</h4><ul><li><b>Displacement work</b> is the area under the process curve on a P–V diagram.</li><li><b>Flow work</b> P V is not a separate term once enthalpy is used: h = u + P v already contains it.</li><li><b>Shaft work</b> is what a pump, compressor, turbine or stirrer delivers; it is positive when the shaft delivers work to the surroundings.</li><li><b>Electrical and magnetic work</b> also cross the boundary without a moving part and must be counted in W.</li></ul><h4>નોંધ</h4><p>∫P dV એ ફક્ત ત્યારે જ work આપે જ્યારે path reversible હોય, કારણ કે ત્યારે જ gas ની અંદરનું pressure boundary પરના pressure જેટલું હોય. શૂન્યાવકાશમાં free expansion માં બહારનું pressure શૂન્ય હોય, તેથી gas expand થાય છતાં કોઈ work થતું નથી.</p>
  - h:
      en: Relation between c_p and c_v for an ideal gas
      gu: ideal gas માટે c_p તથા c_v વચ્ચેનો સંબંધ
    body:
      en: |-
        <h4>Symbols, model and assumptions</h4><p><b>Model:</b> one mole of an ideal gas, P V = R T, heated through the same temperature rise twice — once at constant volume, once at constant pressure. <b>Assumptions:</b> ideal gas, no change of kinetic or potential energy, reversible heating.</p><ol><li><p>Heat one mole at constant volume by dT. No work is done, so all the heat raises internal energy and defines c_v.</p><div class="math" data-tex="\delta Q_v=dU=c_v\,dT" aria-label="\delta Q_v=dU=c_v\,dT">δQ_v = dU = c_v dT</div></li><li><p>Heat one mole at constant pressure by the same dT. Now the gas also does work P dV, so the heat supplied must cover both the internal energy and that work.</p><div class="math" data-tex="\delta Q_p=dU+P\,dV=c_p\,dT" aria-label="\delta Q_p=dU+P\,dV=c_p\,dT">δQ_p = dU + P dV = c_p dT</div></li><li><p>Subtract the constant-volume result from the constant-pressure result.</p><div class="math" data-tex="(c_p-c_v)\,dT=P\,dV" aria-label="(c_p-c_v)\,dT=P\,dV">c_p dT − c_v dT = P dV</div></li><li><p>Differentiate the ideal-gas law P V = R T at constant pressure, so that P dV can be replaced.</p><div class="math" data-tex="P\,dV=R\,dT" aria-label="P\,dV=R\,dT">P dV = R dT   (constant P)</div></li><li><p>Substitute and cancel dT from both sides to obtain Mayer's relation.</p><div class="math" data-tex="c_p-c_v=R" aria-label="c_p-c_v=R">(c_p − c_v) dT = R dT  ⇒  c_p − c_v = R</div></li><li><p>Divide by c_v to get the ratio that controls adiabatic pressure–volume behaviour.</p><div class="math" data-tex="\gamma=\frac{c_p}{c_v}" aria-label="\gamma=\frac{c_p}{c_v}">γ = c_p / c_v  ⇒  c_p = γR/(γ−1),  c_v = R/(γ−1)</div></li></ol><h4>Result</h4><div class="math" data-tex="c_p-c_v=R" aria-label="c_p-c_v=R">c_p − c_v = R        c_v = R/(γ − 1)        c_p = γR/(γ − 1)</div>
      gu: |-
        <h4>સંકેતો, Model તથા Assumptions</h4><p><b>Model:</b> એક mole ideal gas, P V = R T, એ જ temperature વધારા માટે બે વાર ગરમ — એક વાર અચળ volume પર, એક વાર અચળ pressure પર. <b>Assumptions:</b> ideal gas, kinetic કે potential energy નો ફેરફાર નહીં, reversible heating.</p><ol><li><p>એક mole ને અચળ volume પર dT ગરમ કરો. કોઈ work થતું નથી, તેથી આખી heat internal energy વધારે અને c_v વ્યાખ્યાયિત કરે.</p><div class="math" data-tex="\delta Q_v=dU=c_v\,dT" aria-label="\delta Q_v=dU=c_v\,dT">δQ_v = dU = c_v dT</div></li><li><p>એક mole ને અચળ pressure પર એ જ dT ગરમ કરો. હવે gas work P dV પણ કરે છે, તેથી અપાયેલી heat બંને — internal energy તથા એ work — આવરે.</p><div class="math" data-tex="\delta Q_p=dU+P\,dV=c_p\,dT" aria-label="\delta Q_p=dU+P\,dV=c_p\,dT">δQ_p = dU + P dV = c_p dT</div></li><li><p>અચળ pressure ના પરિણામમાંથી અચળ volume નું પરિણામ બાદ કરો.</p><div class="math" data-tex="(c_p-c_v)\,dT=P\,dV" aria-label="(c_p-c_v)\,dT=P\,dV">c_p dT − c_v dT = P dV</div></li><li><p>અચળ pressure પર ideal-gas law P V = R T નું differential લો, જેથી P dV ને બદલી શકાય.</p><div class="math" data-tex="P\,dV=R\,dT" aria-label="P\,dV=R\,dT">P dV = R dT   (constant P)</div></li><li><p>મૂકો અને બંને બાજુથી dT કાપો, જેથી Mayer નો સંબંધ મળે.</p><div class="math" data-tex="c_p-c_v=R" aria-label="c_p-c_v=R">(c_p − c_v) dT = R dT  ⇒  c_p − c_v = R</div></li><li><p>અચળ pressure અને volume વચ્ચેના adiabatic વર્તનને નિયંત્રિત કરતો ગુણોત્તર મેળવવા c_v વડે ભાગો.</p><div class="math" data-tex="\gamma=\frac{c_p}{c_v}" aria-label="\gamma=\frac{c_p}{c_v}">γ = c_p / c_v  ⇒  c_p = γR/(γ−1),  c_v = R/(γ−1)</div></li></ol><h4>પરિણામ</h4><div class="math" data-tex="c_p-c_v=R" aria-label="c_p-c_v=R">c_p − c_v = R        c_v = R/(γ − 1)        c_p = γR/(γ − 1)</div>
