- title:
    en: 4.3  Statements of the second law
    gu: 4.3  દ્વિતીય નિયમનાં વિધાનો
  items:
  - h:
      en: General statements of the second law
      gu: દ્વિતીય નિયમનાં સામાન્ય વિધાનો
    body:
      en: |-
        <h4>Definition / principle</h4><p>The second law has several equivalent statements; all say that a certain kind of process is impossible. <b>Kelvin–Planck:</b> no cyclic device can take heat from a single reservoir and convert it entirely into work. <b>Clausius:</b> no device can transfer heat from a colder body to a hotter body without work input. <b>Entropy:</b> the entropy of an isolated system never decreases.</p><h4>Detailed theory and conditions</h4><p>The statements look different but are logically identical: if you could violate one you could build a machine that violates the other, so accepting one forces you to accept all. A useful way to remember them is by what each forbids — a perpetual motion machine of the <b>second kind</b> for Kelvin–Planck (work from a single reservoir), and self-acting refrigeration for Clausius.<br><br>Note the words 'cyclic device' and 'without work input'. A non-cyclic process can convert heat entirely into work — an isothermal ideal-gas expansion does exactly that — but the gas has expanded and cannot repeat without being compressed, and the compression costs work. The restriction is on a device that returns to its own starting state, which is what an engine must do.</p><h4>Equations and notation</h4><div class="math" data-tex="W=Q_H\ \text{impossible}" aria-label="W=Q_H\ \text{impossible}">Kelvin–Planck:  W = Q_H  with a single reservoir is impossible</div><div class="math" data-tex="Q_C\to Q_H,\ W=0\ \text{impossible}" aria-label="Q_C\to Q_H,\ W=0\ \text{impossible}">Clausius:  Q_C → Q_H  with W = 0 is impossible</div><div class="math" data-tex="\Delta S_{universe}\ge 0" aria-label="\Delta S_{universe}\ge 0">entropy:  ΔS_universe ≥ 0   (= 0 only for a reversible process)</div><h4>Key points and data</h4><ul><li><b>Kelvin–Planck</b> is the statement used for engines: it caps the efficiency.</li><li><b>Clausius</b> is the statement used for refrigerators: it is why a fridge needs a compressor.</li><li><b>Entropy</b> is the statement used for calculations: it gives a number to compare.</li><li>A <b>perpetual motion machine of the second kind</b> would extract work from a single reservoir; it is forbidden even though it would satisfy the first law.</li></ul><h4>Qualification</h4><p>These are statements of experience, not proofs. No exception has ever been found, and statistical mechanics explains why: the reverse of an entropy-increasing process is not impossible but so improbable that it never happens on a human timescale.</p>
      gu: |-
        <h4>વ્યાખ્યા / સિદ્ધાંત</h4><p>દ્વિતીય નિયમનાં અનેક સમાનાર્થી વિધાનો છે; બધાં કહે છે કે અમુક પ્રકારની પ્રક્રિયા અશક્ય છે. <b>Kelvin–Planck:</b> કોઈ ચક્રીય ઉપકરણ એક જ reservoir માંથી heat લઈને તેને પૂરેપૂરી work માં ફેરવી શકે નહીં. <b>Clausius:</b> work input વગર કોઈ ઉપકરણ heat ને ઠંડા શરીરથી ગરમ શરીર તરફ ખસેડી શકે નહીં. <b>Entropy:</b> isolated system ની entropy કદી ઘટતી નથી.</p><h4>વિગતવાર Theory તથા Conditions</h4><p>વિધાનો જુદાં લાગે પણ તાર્કિક રીતે એક જ છે: એકનો ભંગ કરી શકાય તો બીજાનો ભંગ કરતું ઉપકરણ બનાવી શકાય, તેથી એક સ્વીકારતાં બધાં સ્વીકારવાં પડે. યાદ રાખવાની સારી રીત એ છે કે દરેક શું નિષેધે તે જોવું — Kelvin–Planck માટે <b>બીજા પ્રકારની</b> perpetual motion machine (એક જ reservoir માંથી work), અને Clausius માટે જાતે ચાલતું refrigeration.<br><br>'ચક્રીય ઉપકરણ' તથા 'work input વગર' શબ્દો ધ્યાનમાં લો. બિન-ચક્રીય પ્રક્રિયા heat ને પૂરેપૂરી work માં ફેરવી શકે — isothermal ideal-gas expansion બરાબર એ જ કરે — પણ gas expand થઈ ગયો છે અને compress કર્યા વગર ફરી શકે નહીં, અને compression માં work લાગે. પ્રતિબંધ એ ઉપકરણ પર છે જે પોતાની શરૂઆતની state પર પાછું આવે, જે engine માટે જરૂરી છે.</p><h4>સમીકરણો તથા Notation</h4><div class="math" data-tex="W=Q_H\ \text{impossible}" aria-label="W=Q_H\ \text{impossible}">Kelvin–Planck:  W = Q_H  with a single reservoir is impossible</div><div class="math" data-tex="Q_C\to Q_H,\ W=0\ \text{impossible}" aria-label="Q_C\to Q_H,\ W=0\ \text{impossible}">Clausius:  Q_C → Q_H  with W = 0 is impossible</div><div class="math" data-tex="\Delta S_{universe}\ge 0" aria-label="\Delta S_{universe}\ge 0">entropy:  ΔS_universe ≥ 0   (= 0 only for a reversible process)</div><h4>મુખ્ય મુદ્દા તથા data</h4><ul><li><b>Kelvin–Planck</b> is the statement used for engines: it caps the efficiency.</li><li><b>Clausius</b> is the statement used for refrigerators: it is why a fridge needs a compressor.</li><li><b>Entropy</b> is the statement used for calculations: it gives a number to compare.</li><li>A <b>perpetual motion machine of the second kind</b> would extract work from a single reservoir; it is forbidden even though it would satisfy the first law.</li></ul><h4>નોંધ</h4><p>આ અનુભવનાં વિધાનો છે, સાબિતીઓ નહીં. આજ સુધી કોઈ અપવાદ મળ્યો નથી, અને statistical mechanics કારણ આપે છે: entropy વધારતી પ્રક્રિયાનું ઉલટું અશક્ય નથી પણ એટલું અસંભવિત છે કે માનવ સમયમાપક્રમ પર કદી થાય નહીં.</p>
- title:
    en: 4.4  Concept of entropy
    gu: 4.4  entropy નો ખ્યાલ
  items:
  - h:
      en: Concept of entropy
      gu: entropy નો ખ્યાલ
    body:
      en: |-
        <h4>Definition / principle</h4><p><b>Entropy S</b> is a state function defined by the reversible path between two states: <b>dS = δQ<sub>rev</sub>/T</b>. Its unit is kJ/K. Physically it is a measure of how the energy of a system is dispersed, and statistically it is S = k ln Ω, where Ω is the number of microscopic arrangements consistent with the observed state.</p><h4>Detailed theory and conditions</h4><p>Because S is a state function, the change between two states is the same by every path. To calculate it you therefore integrate along a <b>reversible</b> path between the two states even if the real process is violently irreversible — the real path and the reversible path share the same end states, so they share the same ΔS. This single idea is the trick behind every entropy numerical.<br><br>For an isolated system the second law becomes <b>ΔS ≥ 0</b>: entropy is created in every irreversible process and stays constant only in a reversible one. A reversible adiabatic process is therefore <b>isentropic</b> (ΔS = 0), which is why ideal compressors and turbines are analysed as isentropic devices.</p><h4>Equations and notation</h4><div class="math" data-tex="dS=\frac{\delta Q_{rev}}{T}" aria-label="dS=\frac{\delta Q_{rev}}{T}">dS = δQ_rev / T        ΔS = ∫₁² δQ_rev / T</div><div class="math" data-tex="\Delta S=mc_v\ln\frac{T_2}{T_1}+mR\ln\frac{V_2}{V_1}" aria-label="\Delta S=mc_v\ln\frac{T_2}{T_1}+mR\ln\frac{V_2}{V_1}">S₂ − S₁ = m c_v ln(T₂/T₁) + m R ln(V₂/V₁)</div><div class="math" data-tex="\Delta S=mc_p\ln\frac{T_2}{T_1}-mR\ln\frac{P_2}{P_1}" aria-label="\Delta S=mc_p\ln\frac{T_2}{T_1}-mR\ln\frac{P_2}{P_1}">S₂ − S₁ = m c_p ln(T₂/T₁) − m R ln(P₂/P₁)</div><div class="math" data-tex="\Delta S\ge 0" aria-label="\Delta S\ge 0">isolated system:  ΔS ≥ 0        reversible adiabatic:  ΔS = 0</div><h4>Key points and data</h4><ul><li><b>Entropy is extensive:</b> specific entropy s = S/m in kJ/kg·K.</li><li><b>Entropy is not 'disorder' in a vague sense</b> — it counts the number of ways the energy can be arranged. Melting ice increases it because the molecules gain more arrangements.</li><li><b>Reversible adiabatic = isentropic.</b> Irreversible adiabatic still has ΔS > 0.</li><li><b>Heat addition raises entropy; work addition need not.</b> Adiabatic compression raises temperature but not entropy if it is reversible.</li></ul><h4>Qualification</h4><p>Entropy is not conserved and it is not energy. There is no law of conservation of entropy — quite the opposite, it is the one quantity that is systematically created. Writing an 'entropy balance' in the same way as an energy balance is the commonest mistake in this topic.</p>
      gu: |-
        <h4>વ્યાખ્યા / સિદ્ધાંત</h4><p><b>Entropy S</b> એ state function છે જે બે states વચ્ચેના reversible રસ્તા દ્વારા વ્યાખ્યાયિત થાય: <b>dS = δQ<sub>rev</sub>/T</b>. તેનું unit kJ/K છે. ભૌતિક રીતે તે system ની ઊર્જા કેટલી વિખેરાયેલી છે તેનું માપ છે, અને આંકડાકીય રીતે S = k ln Ω, જ્યાં Ω એ દેખાતી state સાથે સુસંગત microscopic ગોઠવણોની સંખ્યા છે.</p><h4>વિગતવાર Theory તથા Conditions</h4><p>S state function હોવાથી બે states વચ્ચેનો ફેરફાર દરેક રસ્તે સરખો હોય. તેથી તેને ગણવા માટે તમે બંને states વચ્ચેના <b>reversible</b> રસ્તે integrate કરો, ભલે વાસ્તવિક પ્રક્રિયા ખૂબ irreversible હોય — વાસ્તવિક તથા reversible રસ્તાના અંતિમ states સરખા હોય, તેથી ΔS પણ સરખું હોય. આ એક વિચાર દરેક entropy દાખલાની ચાવી છે.<br><br>Isolated system માટે દ્વિતીય નિયમ <b>ΔS ≥ 0</b> બને છે: દરેક irreversible પ્રક્રિયામાં entropy ઉત્પન્ન થાય અને ફક્ત reversible પ્રક્રિયામાં અચળ રહે. તેથી reversible adiabatic પ્રક્રિયા <b>isentropic</b> (ΔS = 0) છે, એટલે જ ideal compressor તથા turbine નું વિશ્લેષણ isentropic ઉપકરણ તરીકે થાય.</p><h4>સમીકરણો તથા Notation</h4><div class="math" data-tex="dS=\frac{\delta Q_{rev}}{T}" aria-label="dS=\frac{\delta Q_{rev}}{T}">dS = δQ_rev / T        ΔS = ∫₁² δQ_rev / T</div><div class="math" data-tex="\Delta S=mc_v\ln\frac{T_2}{T_1}+mR\ln\frac{V_2}{V_1}" aria-label="\Delta S=mc_v\ln\frac{T_2}{T_1}+mR\ln\frac{V_2}{V_1}">S₂ − S₁ = m c_v ln(T₂/T₁) + m R ln(V₂/V₁)</div><div class="math" data-tex="\Delta S=mc_p\ln\frac{T_2}{T_1}-mR\ln\frac{P_2}{P_1}" aria-label="\Delta S=mc_p\ln\frac{T_2}{T_1}-mR\ln\frac{P_2}{P_1}">S₂ − S₁ = m c_p ln(T₂/T₁) − m R ln(P₂/P₁)</div><div class="math" data-tex="\Delta S\ge 0" aria-label="\Delta S\ge 0">isolated system:  ΔS ≥ 0        reversible adiabatic:  ΔS = 0</div><h4>મુખ્ય મુદ્દા તથા data</h4><ul><li><b>Entropy is extensive:</b> specific entropy s = S/m in kJ/kg·K.</li><li><b>Entropy is not 'disorder' in a vague sense</b> — it counts the number of ways the energy can be arranged. Melting ice increases it because the molecules gain more arrangements.</li><li><b>Reversible adiabatic = isentropic.</b> Irreversible adiabatic still has ΔS > 0.</li><li><b>Heat addition raises entropy; work addition need not.</b> Adiabatic compression raises temperature but not entropy if it is reversible.</li></ul><h4>નોંધ</h4><p>Entropy સંરક્ષિત નથી અને તે ઊર્જા નથી. Entropy સંરક્ષણનો કોઈ નિયમ નથી — ઊલટું, તે એક જ રાશિ છે જે વ્યવસ્થિત રીતે ઉત્પન્ન થાય છે. ઊર્જા balance ની જેમ 'entropy balance' લખવું એ આ વિષયની સૌથી સામાન્ય ભૂલ છે.</p>
- title:
    en: 4.5  The Carnot principle and thermodynamic scale
    gu: 4.5  Carnot સિદ્ધાંત તથા thermodynamic scale
  items:
  - h:
      en: The Carnot principle
      gu: Carnot નો સિદ્ધાંત
    body:
      en: |-
        <h4>Definition / principle</h4><p>The <b>Carnot cycle</b> consists of four reversible processes: isothermal expansion at T<sub>H</sub>, adiabatic expansion to T<sub>C</sub>, isothermal compression at T<sub>C</sub>, and adiabatic compression back to T<sub>H</sub>. <b>Carnot's principle:</b> no engine operating between the same two reservoirs can be more efficient than a reversible engine, and all reversible engines between the same two reservoirs have the <b>same</b> efficiency, whatever the working substance.</p><h4>Detailed theory and conditions</h4><p>The proof is a proof by contradiction and is worth knowing because it is examinable. Suppose a reversible engine R were less efficient than some other engine E between the same reservoirs. Run E to drive R backwards as a refrigerator. The pair would then take heat from the cold reservoir and deliver it to the hot reservoir with no net work input — a Clausius violation. Therefore R cannot be less efficient than E. Reversing the roles shows E cannot be more efficient either, so all reversible engines are equal and no real engine can beat them.<br><br>The consequence is a temperature scale that does not depend on any substance: T<sub>C</sub>/T<sub>H</sub> = Q<sub>C</sub>/Q<sub>H</sub> for a reversible engine, so η = 1 − T<sub>C</sub>/T<sub>H</sub>. This is the <b>thermodynamic temperature scale</b>, and it agrees with the ideal-gas scale exactly.</p><h4>Equations and notation</h4><div class="math" data-tex="\eta=1-\frac{T_C}{T_H}" aria-label="\eta=1-\frac{T_C}{T_H}">η_Carnot = 1 − T_C / T_H        (absolute temperatures only)</div><div class="math" data-tex="\frac{Q_C}{Q_H}=\frac{T_C}{T_H}" aria-label="\frac{Q_C}{Q_H}=\frac{T_C}{T_H}">reversible engine:  Q_C/Q_H = T_C/T_H</div><div class="math" data-tex="COP_R=\frac{T_C}{T_H-T_C}" aria-label="COP_R=\frac{T_C}{T_H-T_C}">COP_R = T_C/(T_H − T_C)        COP_HP = T_H/(T_H − T_C)</div><h4>Key points and data</h4><ul><li><b>Two temperatures only:</b> η depends on T<sub>H</sub> and T<sub>C</sub>, never on the working substance or on the size of the plant.</li><li><b>Raise T<sub>H</sub> or lower T<sub>C</sub></b> to improve efficiency — that is why power stations superheat steam.</li><li><b>Never reach 100 %:</b> η = 1 would need T<sub>C</sub> = 0 K, which is unattainable.</li><li><b>Carnot COP:</b> a refrigerator working between 300 K and 260 K has COP ≤ 6.5, whatever the refrigerant.</li></ul><h4>Qualification</h4><p>The Carnot cycle cannot be built: it needs isothermal heat transfer at exactly the reservoir temperature (infinitely slow) and adiabatic processes (perfectly insulated). Its value is as a limit and as a comparison, not as a design.</p>
      gu: |-
        <h4>વ્યાખ્યા / સિદ્ધાંત</h4><p><b>Carnot cycle</b> ચાર reversible પ્રક્રિયાઓનો બનેલો છે: T<sub>H</sub> પર isothermal expansion, T<sub>C</sub> સુધી adiabatic expansion, T<sub>C</sub> પર isothermal compression, અને પાછું T<sub>H</sub> સુધી adiabatic compression. <b>Carnot નો સિદ્ધાંત:</b> બે સરખા reservoirs વચ્ચે ચાલતું કોઈ engine reversible engine કરતાં વધુ efficient ન હોઈ શકે, અને સરખા બે reservoirs વચ્ચેના બધા reversible engines ની efficiency <b>સરખી</b> જ હોય, working substance કોઈ પણ હોય.</p><h4>વિગતવાર Theory તથા Conditions</h4><p>સાબિતી વિરોધાભાસ દ્વારા છે અને તે જાણવા જેવી છે કારણ કે પરીક્ષામાં પૂછાય છે. ધારો કે reversible engine R સરખા reservoirs વચ્ચેના બીજા engine E કરતાં ઓછું efficient છે. E ચલાવીને R ને ઉલટું refrigerator તરીકે ચલાવો. પછી આ જોડી કોઈ net work input વગર ઠંડા reservoir માંથી heat લઈને ગરમ reservoir ને આપે — Clausius નો ભંગ. તેથી R એ E કરતાં ઓછું efficient હોઈ શકે નહીં. ભૂમિકા ઉલટાવતાં દેખાય કે E પણ વધુ efficient ન હોઈ શકે, તેથી બધા reversible engines સરખા છે અને કોઈ વાસ્તવિક engine તેમને હરાવી શકે નહીં.<br><br>પરિણામ એ temperature scale છે જે કોઈ પદાર્થ પર આધાર રાખતું નથી: reversible engine માટે T<sub>C</sub>/T<sub>H</sub> = Q<sub>C</sub>/Q<sub>H</sub>, તેથી η = 1 − T<sub>C</sub>/T<sub>H</sub>. આ જ <b>thermodynamic temperature scale</b> છે, અને તે ideal-gas scale સાથે બરાબર મળે છે.</p><h4>સમીકરણો તથા Notation</h4><div class="math" data-tex="\eta=1-\frac{T_C}{T_H}" aria-label="\eta=1-\frac{T_C}{T_H}">η_Carnot = 1 − T_C / T_H        (absolute temperatures only)</div><div class="math" data-tex="\frac{Q_C}{Q_H}=\frac{T_C}{T_H}" aria-label="\frac{Q_C}{Q_H}=\frac{T_C}{T_H}">reversible engine:  Q_C/Q_H = T_C/T_H</div><div class="math" data-tex="COP_R=\frac{T_C}{T_H-T_C}" aria-label="COP_R=\frac{T_C}{T_H-T_C}">COP_R = T_C/(T_H − T_C)        COP_HP = T_H/(T_H − T_C)</div><h4>મુખ્ય મુદ્દા તથા data</h4><ul><li><b>Two temperatures only:</b> η depends on T<sub>H</sub> and T<sub>C</sub>, never on the working substance or on the size of the plant.</li><li><b>Raise T<sub>H</sub> or lower T<sub>C</sub></b> to improve efficiency — that is why power stations superheat steam.</li><li><b>Never reach 100 %:</b> η = 1 would need T<sub>C</sub> = 0 K, which is unattainable.</li><li><b>Carnot COP:</b> a refrigerator working between 300 K and 260 K has COP ≤ 6.5, whatever the refrigerant.</li></ul><h4>નોંધ</h4><p>Carnot cycle બનાવી શકાય નહીં: તેને બરાબર reservoir temperature પર isothermal heat transfer (અનંત ધીમું) તથા adiabatic પ્રક્રિયાઓ (સંપૂર્ણ insulated) જોઈએ. તેનું મૂલ્ય મર્યાદા તથા સરખામણી તરીકે છે, design તરીકે નહીં.</p>
    diagram: d4_carnot_cycle
  - h:
      en: Efficiency of the Carnot cycle with an ideal gas
      gu: ideal gas સાથે Carnot cycle ની efficiency
    body:
      en: |-
        <h4>Symbols, model and assumptions</h4><p><b>Model:</b> one mole of an ideal gas as the working substance, taken round the four reversible steps of the Carnot cycle. <b>Assumptions:</b> ideal gas with constant c<sub>v</sub>, reversible processes throughout, the two reservoirs at T<sub>H</sub> and T<sub>C</sub> constant.</p><ol><li><p>Step 1→2: the gas expands isothermally at T_H, taking in heat Q_H.</p><div class="math" data-tex="Q_H=RT_H\ln\frac{V_2}{V_1}" aria-label="Q_H=RT_H\ln\frac{V_2}{V_1}">Q_H = W₁₂ = R T_H ln(V₂/V₁)</div></li><li><p>Step 2→3: adiabatic expansion to T_C. No heat is exchanged, so Q = 0.</p><div class="math" data-tex="T_HV_2^{\gamma-1}=T_CV_3^{\gamma-1}" aria-label="T_HV_2^{\gamma-1}=T_CV_3^{\gamma-1}">T_H V₂^(γ−1) = T_C V₃^(γ−1)</div></li><li><p>Step 3→4: isothermal compression at T_C, rejecting Q_C.</p><div class="math" data-tex="Q_C=RT_C\ln\frac{V_3}{V_4}" aria-label="Q_C=RT_C\ln\frac{V_3}{V_4}">Q_C = −W₃₄ = R T_C ln(V₃/V₄)</div></li><li><p>Step 4→1: adiabatic compression back to T_H, closing the cycle.</p><div class="math" data-tex="T_CV_4^{\gamma-1}=T_HV_1^{\gamma-1}" aria-label="T_CV_4^{\gamma-1}=T_HV_1^{\gamma-1}">T_C V₄^(γ−1) = T_H V₁^(γ−1)</div></li><li><p>Divide the relation of step 4→1 by that of step 2→3. The temperatures and the power cancel, leaving a ratio of volumes.</p><div class="math" data-tex="\frac{V_2}{V_1}=\frac{V_3}{V_4}" aria-label="\frac{V_2}{V_1}=\frac{V_3}{V_4}">V₂/V₁ = V₃/V₄</div></li><li><p>Use that equality to replace the volume ratio in the two heat expressions, so Q_C/Q_H contains only temperatures.</p><div class="math" data-tex="\frac{Q_C}{Q_H}=\frac{T_C}{T_H}" aria-label="\frac{Q_C}{Q_H}=\frac{T_C}{T_H}">Q_C/Q_H = T_C/T_H</div></li><li><p>Write the efficiency and substitute the heat ratio.</p><div class="math" data-tex="\eta=1-\frac{Q_C}{Q_H}=1-\frac{T_C}{T_H}" aria-label="\eta=1-\frac{Q_C}{Q_H}=1-\frac{T_C}{T_H}">η = 1 − Q_C/Q_H = 1 − T_C/T_H</div></li></ol><h4>Result</h4><div class="math" data-tex="\eta=1-\frac{T_C}{T_H}" aria-label="\eta=1-\frac{T_C}{T_H}">η_Carnot = 1 − T_C/T_H</div>
      gu: |-
        <h4>સંકેતો, Model તથા Assumptions</h4><p><b>Model:</b> working substance તરીકે એક mole ideal gas, Carnot cycle ના ચાર reversible પગલાંમાં ફેરવાય છે. <b>Assumptions:</b> c<sub>v</sub> અચળ હોય તેવો ideal gas, બધી પ્રક્રિયાઓ reversible, બે reservoirs T<sub>H</sub> તથા T<sub>C</sub> પર અચળ.</p><ol><li><p>Step 1→2: gas T_H પર isothermal રીતે expand થાય, Q_H heat લે.</p><div class="math" data-tex="Q_H=RT_H\ln\frac{V_2}{V_1}" aria-label="Q_H=RT_H\ln\frac{V_2}{V_1}">Q_H = W₁₂ = R T_H ln(V₂/V₁)</div></li><li><p>Step 2→3: T_C સુધી adiabatic expansion. કોઈ heat ની આપલે નહીં, તેથી Q = 0.</p><div class="math" data-tex="T_HV_2^{\gamma-1}=T_CV_3^{\gamma-1}" aria-label="T_HV_2^{\gamma-1}=T_CV_3^{\gamma-1}">T_H V₂^(γ−1) = T_C V₃^(γ−1)</div></li><li><p>Step 3→4: T_C પર isothermal compression, Q_C બહાર ફેંકાય.</p><div class="math" data-tex="Q_C=RT_C\ln\frac{V_3}{V_4}" aria-label="Q_C=RT_C\ln\frac{V_3}{V_4}">Q_C = −W₃₄ = R T_C ln(V₃/V₄)</div></li><li><p>Step 4→1: પાછું T_H સુધી adiabatic compression, cycle પૂરો થાય.</p><div class="math" data-tex="T_CV_4^{\gamma-1}=T_HV_1^{\gamma-1}" aria-label="T_CV_4^{\gamma-1}=T_HV_1^{\gamma-1}">T_C V₄^(γ−1) = T_H V₁^(γ−1)</div></li><li><p>Step 4→1 નો સંબંધ step 2→3 વડે ભાગો. Temperature તથા power કપાઈ જાય, ફક્ત volumes નો ગુણોત્તર રહે.</p><div class="math" data-tex="\frac{V_2}{V_1}=\frac{V_3}{V_4}" aria-label="\frac{V_2}{V_1}=\frac{V_3}{V_4}">V₂/V₁ = V₃/V₄</div></li><li><p>એ સમાનતા વાપરીને બંને heat ના સમીકરણમાં volume ગુણોત્તર બદલો, જેથી Q_C/Q_H માં ફક્ત temperatures રહે.</p><div class="math" data-tex="\frac{Q_C}{Q_H}=\frac{T_C}{T_H}" aria-label="\frac{Q_C}{Q_H}=\frac{T_C}{T_H}">Q_C/Q_H = T_C/T_H</div></li><li><p>efficiency લખો અને heat ગુણોત્તર મૂકો.</p><div class="math" data-tex="\eta=1-\frac{Q_C}{Q_H}=1-\frac{T_C}{T_H}" aria-label="\eta=1-\frac{Q_C}{Q_H}=1-\frac{T_C}{T_H}">η = 1 − Q_C/Q_H = 1 − T_C/T_H</div></li></ol><h4>પરિણામ</h4><div class="math" data-tex="\eta=1-\frac{T_C}{T_H}" aria-label="\eta=1-\frac{T_C}{T_H}">η_Carnot = 1 − T_C/T_H</div>
    diagram: d4_ts_diagram
- title:
    en: 4.6  Entropy changes of common processes
    gu: 4.6  સામાન્ય પ્રક્રિયાઓના entropy ફેરફાર
  items:
  - h:
      en: Entropy changes of common processes
      gu: સામાન્ય પ્રક્રિયાઓના entropy ફેરફાર
    body:
      en: |-
        <h4>Definition / principle</h4><p>Because entropy is a state function, the change for any process is found by integrating δQ<sub>rev</sub>/T along a convenient <b>reversible</b> path between the same two end states. Five cases cover the syllabus: phase change, ideal-gas processes, adiabatic mixing, isothermal mixing of ideal gases, and chemical reaction.</p><h4>Detailed theory and conditions</h4><p>Each case has a signature. A <b>phase change</b> at constant temperature gives ΔS = ΔH/T, because the heat is the latent heat and T does not move. A general <b>ideal-gas change</b> of state needs two terms, one for temperature and one for volume (or pressure), because entropy responds to both. <b>Reversible adiabatic</b> processes have ΔS = 0 exactly.<br><br>Mixing is where students lose marks, because the entropy of mixing is not obvious. Bring two different ideal gases together at the same T and P and ΔS = −R Σ nᵢ ln yᵢ, which is always positive: the gases expand into each other's volume and entropy rises even though nothing was heated and no work was done. For a <b>chemical reaction</b> at temperature T, ΔS = ΣS<sub>products</sub> − ΣS<sub>reactants</sub>, using tabulated absolute entropies; unlike enthalpy of formation, these are absolute values on the third-law basis.</p><h4>Equations and notation</h4><div class="math" data-tex="\Delta S=\frac{\Delta H_{phase}}{T}" aria-label="\Delta S=\frac{\Delta H_{phase}}{T}">phase change:  ΔS = ΔH_phase / T</div><div class="math" data-tex="\Delta S=mc_v\ln\frac{T_2}{T_1}+mR\ln\frac{V_2}{V_1}" aria-label="\Delta S=mc_v\ln\frac{T_2}{T_1}+mR\ln\frac{V_2}{V_1}">ideal gas:  ΔS = m c_v ln(T₂/T₁) + m R ln(V₂/V₁)</div><div class="math" data-tex="\Delta S=0" aria-label="\Delta S=0">reversible adiabatic:  ΔS = 0</div><div class="math" data-tex="\Delta S=-R\sum n_i\ln y_i" aria-label="\Delta S=-R\sum n_i\ln y_i">mixing of ideal gases:  ΔS = −R Σ n_i ln y_i  > 0</div><div class="math" data-tex="\Delta S^0=\sum S^0_{prod}-\sum S^0_{reac}" aria-label="\Delta S^0=\sum S^0_{prod}-\sum S^0_{reac}">reaction:  ΔS° = ΣS°(products) − ΣS°(reactants)</div><h4>Key points and data</h4><ul><li><b>Melting 1 kg of ice:</b> ΔH = 334 kJ/kg at 273 K, so ΔS = 334/273 = 1.22 kJ/kg·K.</li><li><b>Boiling 1 kg of water:</b> ΔH = 2 257 kJ/kg at 373 K, so ΔS = 6.05 kJ/kg·K — much larger, because vapour is far more dispersed.</li><li><b>Mixing:</b> always positive for ideal gases; the sign never depends on the gases chosen, only on the mole fractions.</li><li><b>Absolute entropies</b> are tabulated from 0 K, so a reaction entropy is a simple subtraction — no reference state ambiguity.</li></ul><h4>Qualification</h4><p>The formula ΔS = Q/T holds only for an <b>isothermal reversible</b> process. Using the actual (irreversible) heat divided by the temperature gives the entropy transfer to the surroundings, not the entropy change of the system; the difference is the entropy generated.</p>
      gu: |-
        <h4>વ્યાખ્યા / સિદ્ધાંત</h4><p>Entropy state function હોવાથી કોઈપણ પ્રક્રિયાનો ફેરફાર સરખા બે અંતિમ states વચ્ચેના અનુકૂળ <b>reversible</b> રસ્તે δQ<sub>rev</sub>/T ને integrate કરીને મળે. પાંચ કિસ્સા syllabus આવરે છે: phase change, ideal-gas પ્રક્રિયાઓ, adiabatic mixing, ideal gases નું isothermal mixing, અને chemical reaction.</p><h4>વિગતવાર Theory તથા Conditions</h4><p>દરેક કિસ્સાની પોતાની ઓળખ છે. અચળ temperature પર <b>phase change</b> માટે ΔS = ΔH/T, કારણ કે heat એ latent heat છે અને T બદલાતું નથી. સામાન્ય <b>ideal-gas state change</b> માટે બે પદ જોઈએ, એક temperature માટે અને એક volume (કે pressure) માટે, કારણ કે entropy બંને પર પ્રતિક્રિયા આપે. <b>Reversible adiabatic</b> પ્રક્રિયાઓમાં ΔS બરાબર 0.<br><br>Mixing માં વિદ્યાર્થી માર્ક ગુમાવે છે, કારણ કે mixing ની entropy સ્પષ્ટ નથી. સરખા T તથા P પર બે જુદા ideal gases ભેગા કરતાં ΔS = −R Σ nᵢ ln yᵢ, જે હંમેશા ધન હોય: gases એકબીજાના volume માં expand થાય અને ઊર્જા ગરમ કે work થયા વગર પણ entropy વધે. temperature T પર <b>chemical reaction</b> માટે ΔS = ΣS<sub>products</sub> − ΣS<sub>reactants</sub>, tabulated absolute entropies વાપરીને; enthalpy of formation થી વિપરીત આ third-law આધાર પરની નિરપેક્ષ કિંમતો છે.</p><h4>સમીકરણો તથા Notation</h4><div class="math" data-tex="\Delta S=\frac{\Delta H_{phase}}{T}" aria-label="\Delta S=\frac{\Delta H_{phase}}{T}">phase change:  ΔS = ΔH_phase / T</div><div class="math" data-tex="\Delta S=mc_v\ln\frac{T_2}{T_1}+mR\ln\frac{V_2}{V_1}" aria-label="\Delta S=mc_v\ln\frac{T_2}{T_1}+mR\ln\frac{V_2}{V_1}">ideal gas:  ΔS = m c_v ln(T₂/T₁) + m R ln(V₂/V₁)</div><div class="math" data-tex="\Delta S=0" aria-label="\Delta S=0">reversible adiabatic:  ΔS = 0</div><div class="math" data-tex="\Delta S=-R\sum n_i\ln y_i" aria-label="\Delta S=-R\sum n_i\ln y_i">mixing of ideal gases:  ΔS = −R Σ n_i ln y_i  > 0</div><div class="math" data-tex="\Delta S^0=\sum S^0_{prod}-\sum S^0_{reac}" aria-label="\Delta S^0=\sum S^0_{prod}-\sum S^0_{reac}">reaction:  ΔS° = ΣS°(products) − ΣS°(reactants)</div><h4>મુખ્ય મુદ્દા તથા data</h4><ul><li><b>Melting 1 kg of ice:</b> ΔH = 334 kJ/kg at 273 K, so ΔS = 334/273 = 1.22 kJ/kg·K.</li><li><b>Boiling 1 kg of water:</b> ΔH = 2 257 kJ/kg at 373 K, so ΔS = 6.05 kJ/kg·K — much larger, because vapour is far more dispersed.</li><li><b>Mixing:</b> always positive for ideal gases; the sign never depends on the gases chosen, only on the mole fractions.</li><li><b>Absolute entropies</b> are tabulated from 0 K, so a reaction entropy is a simple subtraction — no reference state ambiguity.</li></ul><h4>નોંધ</h4><p>ΔS = Q/T સૂત્ર ફક્ત <b>isothermal reversible</b> પ્રક્રિયા માટે લાગુ પડે. વાસ્તવિક (irreversible) heat ને temperature વડે ભાગવાથી surroundings ને થતું entropy transfer મળે, system નું entropy ફેરફાર નહીં; તફાવત એ ઉત્પન્ન થયેલી entropy છે.</p>
- title:
    en: 4.7  Clausius inequality and the mathematical statement
    gu: 4.7  Clausius inequality તથા ગાણિતિક વિધાન
  items:
  - h:
      en: The Clausius inequality and the mathematical statement
      gu: Clausius inequality તથા ગાણિતિક વિધાન
    body:
      en: |-
        <h4>Definition / principle</h4><p>The <b>Clausius inequality</b> states that for any cycle <b>∮ δQ/T ≤ 0</b>, where T is the temperature of the boundary at which the heat δQ crosses. The equality holds for a reversible cycle and the strict inequality for an irreversible one. It is the mathematical form of the second law.</p><h4>Detailed theory and conditions</h4><p>For a reversible cycle ∮δQ/T = 0, so the integral between two states is independent of the path — which is exactly the statement that S is a state function. Removing the cyclic restriction gives the entropy balance for a closed system: <b>dS = δQ/T + δS<sub>gen</sub></b>, where δS<sub>gen</sub> ≥ 0, with equality only for a reversible process.<br><br>That single line contains everything: for an isolated system Q = 0 so dS = δS<sub>gen</sub> ≥ 0 (entropy never decreases); for a reversible adiabatic process dS = 0 (isentropic); and for any real process the generated entropy is positive, producing the <b>lost work</b> I = T₀ S<sub>gen</sub> that no design can recover.</p><h4>Equations and notation</h4><div class="math" data-tex="\oint\frac{\delta Q}{T}\le 0" aria-label="\oint\frac{\delta Q}{T}\le 0">∮ δQ/T ≤ 0        (= 0 reversible, < 0 irreversible)</div><div class="math" data-tex="dS=\frac{\delta Q}{T}+\delta S_{gen}" aria-label="dS=\frac{\delta Q}{T}+\delta S_{gen}">closed system:  dS = δQ/T + δS_gen ,  δS_gen ≥ 0</div><div class="math" data-tex="\Delta S\ge 0" aria-label="\Delta S\ge 0">isolated system:  ΔS ≥ 0        lost work:  I = T₀ S_gen</div><h4>Key points and data</h4><ul><li><b>Equality test:</b> if a proposed cycle gives ∮δQ/T > 0 it is impossible, whatever the energy balance says.</li><li><b>Entropy generation</b> is the numerical measure of irreversibility; it is never negative.</li><li><b>Lost work</b> I = T₀S<sub>gen</sub> is the work a reversible plant would have produced but a real one cannot.</li><li><b>Isentropic efficiency</b> of a turbine or compressor is the ratio of actual to isentropic work, and is always below one.</li></ul><h4>Qualification</h4><p>The inequality compares temperatures of the <i>boundary where the heat crosses</i>, not the system temperature. For heat supplied from a reservoir at T<sub>H</sub> the term is Q/T<sub>H</sub>; for a real exchanger with a finite approach the boundary temperature differs from the fluid's, and that difference is exactly where entropy is generated.</p>
      gu: |-
        <h4>વ્યાખ્યા / સિદ્ધાંત</h4><p><b>Clausius inequality</b> કહે છે કે કોઈપણ cycle માટે <b>∮ δQ/T ≤ 0</b>, જ્યાં T એ boundary નું temperature છે જ્યાં heat δQ પસાર થાય. સમાનતા reversible cycle માટે અને કડક અસમાનતા irreversible માટે. આ દ્વિતીય નિયમનું ગાણિતિક સ્વરૂપ છે.</p><h4>વિગતવાર Theory તથા Conditions</h4><p>Reversible cycle માટે ∮δQ/T = 0, તેથી બે states વચ્ચેનું integral path પર આધાર રાખતું નથી — જે બરાબર એ વિધાન છે કે S state function છે. ચક્રીય મર્યાદા દૂર કરતાં closed system માટે entropy balance મળે: <b>dS = δQ/T + δS<sub>gen</sub></b>, જ્યાં δS<sub>gen</sub> ≥ 0, અને સમાનતા ફક્ત reversible પ્રક્રિયા માટે.<br><br>એ એક લીટીમાં બધું છે: isolated system માટે Q = 0 તેથી dS = δS<sub>gen</sub> ≥ 0 (entropy કદી ઘટે નહીં); reversible adiabatic પ્રક્રિયા માટે dS = 0 (isentropic); અને કોઈપણ વાસ્તવિક પ્રક્રિયા માટે ઉત્પન્ન થયેલી entropy ધન હોય, જે <b>lost work</b> I = T₀ S<sub>gen</sub> પેદા કરે જે કોઈ design પાછું મેળવી શકે નહીં.</p><h4>સમીકરણો તથા Notation</h4><div class="math" data-tex="\oint\frac{\delta Q}{T}\le 0" aria-label="\oint\frac{\delta Q}{T}\le 0">∮ δQ/T ≤ 0        (= 0 reversible, < 0 irreversible)</div><div class="math" data-tex="dS=\frac{\delta Q}{T}+\delta S_{gen}" aria-label="dS=\frac{\delta Q}{T}+\delta S_{gen}">closed system:  dS = δQ/T + δS_gen ,  δS_gen ≥ 0</div><div class="math" data-tex="\Delta S\ge 0" aria-label="\Delta S\ge 0">isolated system:  ΔS ≥ 0        lost work:  I = T₀ S_gen</div><h4>મુખ્ય મુદ્દા તથા data</h4><ul><li><b>Equality test:</b> if a proposed cycle gives ∮δQ/T > 0 it is impossible, whatever the energy balance says.</li><li><b>Entropy generation</b> is the numerical measure of irreversibility; it is never negative.</li><li><b>Lost work</b> I = T₀S<sub>gen</sub> is the work a reversible plant would have produced but a real one cannot.</li><li><b>Isentropic efficiency</b> of a turbine or compressor is the ratio of actual to isentropic work, and is always below one.</li></ul><h4>નોંધ</h4><p>અસમાનતા <i>heat જ્યાં પસાર થાય તે boundary</i> ના temperatures સરખાવે છે, system ના temperature નહીં. T<sub>H</sub> પરના reservoir થી મળતી heat માટે પદ Q/T<sub>H</sub> છે; મર્યાદિત approach વાળા વાસ્તવિક exchanger માં boundary temperature fluid કરતાં જુદું હોય છે, અને એ જ તફાવતમાં entropy ઉત્પન્ન થાય છે.</p>
    diagram: d4_clausius
- title:
    en: 4.8  The third law of thermodynamics
    gu: 4.8  થર્મોડાયનેમિક્સનો તૃતીય નિયમ
  items:
  - h:
      en: The third law of thermodynamics
      gu: થર્મોડાયનેમિક્સનો તૃતીય નિયમ
    body:
      en: |-
        <h4>Definition / principle</h4><p><b>Third law:</b> the entropy of a perfect crystalline substance is zero at absolute zero, and no finite sequence of processes can cool a system to exactly 0 K in a finite number of steps. It fixes the zero of the entropy scale.</p><h4>Detailed theory and conditions</h4><p>The first two laws only ever needed differences of entropy, so the origin of the scale was arbitrary. The third law supplies that origin, and it is what makes tabulated <b>absolute entropies</b> possible: S° of a compound at 298 K is the integral of c<sub>p</sub>/T from 0 K, with latent heats added at every phase change on the way. Every standard entropy in the tables is built this way.<br><br>The law also explains why absolute zero is unattainable. As T → 0 the heat capacity of every substance falls towards zero, so each successive cooling step removes less and less heat, and the temperature falls in a geometric tail that never reaches zero. Reaching 0 K would require an infinite number of steps, which is the unattainability statement.</p><h4>Equations and notation</h4><div class="math" data-tex="S(0\ \mathrm{K})=0" aria-label="S(0\ \mathrm{K})=0">perfect crystal at 0 K:  S = 0</div><div class="math" data-tex="S^0(T)=\int_0^T\frac{c_p}{T}dT" aria-label="S^0(T)=\int_0^T\frac{c_p}{T}dT">absolute entropy:  S°(T) = ∫₀ᵀ (c_p/T) dT + Σ (ΔH_phase/T_phase)</div><h4>Key points and data</h4><ul><li><b>Why it matters:</b> it turns the entropy tables into absolute numbers and makes ΔS of reaction a plain subtraction.</li><li><b>Residual entropy:</b> a glass or a disordered solid retains entropy at 0 K because it is not a perfect crystal — CO and ice have measurable residual entropy.</li><li><b>Unattainability:</b> laboratories reach nanokelvin but never zero; the third law forbids exact 0 K.</li><li><b>Practical use:</b> cryogenic design relies on the third law to predict how much cooling each stage can deliver.</li></ul><h4>Qualification</h4><p>The third law is a statement about perfect crystals in internal equilibrium. Supercooled liquids and glasses are not in equilibrium, so their entropy at 0 K is not zero and the tables must not be used for them.</p>
      gu: |-
        <h4>વ્યાખ્યા / સિદ્ધાંત</h4><p><b>તૃતીય નિયમ:</b> absolute zero પર સંપೂರ್ಣ સ્ફટિકીય પદાર્થની entropy શૂન્ય હોય છે, અને કોઈ પણ મર્યાદિત પ્રક્રિયાઓની શ્રેણી કોઈ system ને મર્યાદિત પગલાંમાં બરાબર 0 K સુધી ઠંડું કરી શકતી નથી. તે entropy scale નું શૂન્ય નિશ્ચિત કરે છે.</p><h4>વિગતવાર Theory તથા Conditions</h4><p>પહેલા બે નિયમોને ફક્ત entropy ના તફાવતની જરૂર પડતી, તેથી scale નું ઉદ્ગમ મનસ્વી હતું. તૃતીય નિયમ એ ઉદ્ગમ આપે છે, અને એટલે જ tabulated <b>absolute entropies</b> શક્ય બને છે: 298 K પર સંયોજનની S° એ 0 K થી c<sub>p</sub>/T નું integral છે, જેમાં રસ્તામાં દરેક phase change પર latent heats ઉમેરાય. Tables માંની દરેક standard entropy આ રીતે બનેલી છે.<br><br>નિયમ એ પણ સમજાવે છે કે absolute zero કેમ પામી શકાય નહીં. T → 0 થતાં દરેક પદાર્થની heat capacity શૂન્ય તરફ ઘટે, તેથી દરેક આગળના cooling પગલામાં ઓછી ને ઓછી heat નીકળે, અને temperature એ ભૌમિતિક શ્રેણીમાં ઘટે જે કદી શૂન્ય ન પહોંચે. 0 K પર પહોંચવા અનંત પગલાં જોઈએ, જે unattainability વિધાન છે.</p><h4>સમીકરણો તથા Notation</h4><div class="math" data-tex="S(0\ \mathrm{K})=0" aria-label="S(0\ \mathrm{K})=0">perfect crystal at 0 K:  S = 0</div><div class="math" data-tex="S^0(T)=\int_0^T\frac{c_p}{T}dT" aria-label="S^0(T)=\int_0^T\frac{c_p}{T}dT">absolute entropy:  S°(T) = ∫₀ᵀ (c_p/T) dT + Σ (ΔH_phase/T_phase)</div><h4>મુખ્ય મુદ્દા તથા data</h4><ul><li><b>Why it matters:</b> it turns the entropy tables into absolute numbers and makes ΔS of reaction a plain subtraction.</li><li><b>Residual entropy:</b> a glass or a disordered solid retains entropy at 0 K because it is not a perfect crystal — CO and ice have measurable residual entropy.</li><li><b>Unattainability:</b> laboratories reach nanokelvin but never zero; the third law forbids exact 0 K.</li><li><b>Practical use:</b> cryogenic design relies on the third law to predict how much cooling each stage can deliver.</li></ul><h4>નોંધ</h4><p>તૃતીય નિયમ આંતરિક equilibrium માં રહેલા સંપૂર્ણ સ્ફટિકો વિશેનું વિધાન છે. Supercooled liquids તથા glasses equilibrium માં નથી, તેથી 0 K પર તેમની entropy શૂન્ય નથી અને તેમના માટે tables વાપરવી ન જોઈએ.</p>
