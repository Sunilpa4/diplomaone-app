    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="Arial, Helvetica, sans-serif"><rect width="960" height="620" fill="#ffffff"/><text x="24.0" y="36.6" font-family="Arial, Helvetica, sans-serif" font-size="19" text-anchor="start" fill="#6420B8" font-weight="bold">Heat engine, refrigerator and heat pump</text><rect x="24" y="110" width="280" height="400" rx="12" fill="#FFFFFF" stroke="#B9A6CE" stroke-width="1.6"/><text x="164.0" y="140.6" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#2E7D32" font-weight="bold">HEAT ENGINE</text><text x="164.0" y="159.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#6B6275" font-weight="normal">supplies work</text><rect x="64" y="176" width="200" height="42" rx="6" fill="#FDF1F1" stroke="#C2185B" stroke-width="1.8"/><text x="164.0" y="200.8" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#C2185B" font-weight="bold">hot reservoir  T_H</text><rect x="64" y="402" width="200" height="42" rx="6" fill="#EEF5FD" stroke="#1565C0" stroke-width="1.8"/><text x="164.0" y="426.9" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#1565C0" font-weight="bold">cold reservoir  T_C</text><circle cx="164" cy="310" r="44" fill="#EADDF7" stroke="#7B2CD9" stroke-width="2"/><text x="164.0" y="309.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#6420B8" font-weight="bold">device</text><text x="164.0" y="325.3" font-family="Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="middle" fill="#6B6275" font-weight="normal">cyclic</text><rect x="340" y="110" width="280" height="400" rx="12" fill="#FFFFFF" stroke="#B9A6CE" stroke-width="1.6"/><text x="480.0" y="140.6" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#1565C0" font-weight="bold">REFRIGERATOR</text><text x="480.0" y="159.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#6B6275" font-weight="normal">cools a cold space</text><rect x="380" y="176" width="200" height="42" rx="6" fill="#FDF1F1" stroke="#C2185B" stroke-width="1.8"/><text x="480.0" y="200.8" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#C2185B" font-weight="bold">hot reservoir  T_H</text><rect x="380" y="402" width="200" height="42" rx="6" fill="#EEF5FD" stroke="#1565C0" stroke-width="1.8"/><text x="480.0" y="426.9" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#1565C0" font-weight="bold">cold reservoir  T_C</text><circle cx="480" cy="310" r="44" fill="#EADDF7" stroke="#7B2CD9" stroke-width="2"/><text x="480.0" y="309.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#6420B8" font-weight="bold">device</text><text x="480.0" y="325.3" font-family="Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="middle" fill="#6B6275" font-weight="normal">cyclic</text><rect x="656" y="110" width="280" height="400" rx="12" fill="#FFFFFF" stroke="#B9A6CE" stroke-width="1.6"/><text x="796.0" y="140.6" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#C2185B" font-weight="bold">HEAT PUMP</text><text x="796.0" y="159.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#6B6275" font-weight="normal">heats a warm space</text><rect x="696" y="176" width="200" height="42" rx="6" fill="#FDF1F1" stroke="#C2185B" stroke-width="1.8"/><text x="796.0" y="200.8" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#C2185B" font-weight="bold">hot reservoir  T_H</text><rect x="696" y="402" width="200" height="42" rx="6" fill="#EEF5FD" stroke="#1565C0" stroke-width="1.8"/><text x="796.0" y="426.9" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#1565C0" font-weight="bold">cold reservoir  T_C</text><circle cx="796" cy="310" r="44" fill="#EADDF7" stroke="#7B2CD9" stroke-width="2"/><text x="796.0" y="309.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#6420B8" font-weight="bold">device</text><text x="796.0" y="325.3" font-family="Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="middle" fill="#6B6275" font-weight="normal">cyclic</text><line x1="164" y1="220" x2="164.0" y2="254.0" stroke="#C2185B" stroke-width="2.2"/><polygon points="164.0,262.0 167.6,254.0 160.4,254.0" fill="#C2185B"/><text x="176.0" y="247.8" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#C2185B" font-weight="bold">Q_H</text><line x1="208" y1="310" x2="262.0" y2="310.0" stroke="#2E7D32" stroke-width="2.2"/><polygon points="270.0,310.0 262.0,306.4 262.0,313.6" fill="#2E7D32"/><text x="220.0" y="297.9" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#2E7D32" font-weight="bold">W</text><line x1="164" y1="356" x2="164.0" y2="390.0" stroke="#1565C0" stroke-width="2.2"/><polygon points="164.0,398.0 167.6,390.0 160.4,390.0" fill="#1565C0"/><text x="176.0" y="385.9" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#1565C0" font-weight="bold">Q_C</text><line x1="586" y1="310" x2="532.0" y2="310.0" stroke="#2E7D32" stroke-width="2.2"/><polygon points="524.0,310.0 532.0,313.6 532.0,306.4" fill="#2E7D32"/><text x="576.0" y="297.9" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="end" fill="#2E7D32" font-weight="bold">W</text><line x1="480" y1="398" x2="480.0" y2="364.0" stroke="#1565C0" stroke-width="2.2"/><polygon points="480.0,356.0 476.4,364.0 483.6,364.0" fill="#1565C0"/><text x="492.0" y="385.9" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#1565C0" font-weight="bold">Q_C</text><line x1="480" y1="262" x2="480.0" y2="228.0" stroke="#C2185B" stroke-width="2.2"/><polygon points="480.0,220.0 476.4,228.0 483.6,228.0" fill="#C2185B"/><text x="492.0" y="247.8" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#C2185B" font-weight="bold">Q_H</text><line x1="902" y1="310" x2="848.0" y2="310.0" stroke="#2E7D32" stroke-width="2.2"/><polygon points="840.0,310.0 848.0,313.6 848.0,306.4" fill="#2E7D32"/><text x="892.0" y="297.9" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="end" fill="#2E7D32" font-weight="bold">W</text><line x1="796" y1="398" x2="796.0" y2="364.0" stroke="#1565C0" stroke-width="2.2"/><polygon points="796.0,356.0 792.4,364.0 799.6,364.0" fill="#1565C0"/><text x="808.0" y="385.9" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#1565C0" font-weight="bold">Q_C</text><line x1="796" y1="262" x2="796.0" y2="228.0" stroke="#C2185B" stroke-width="2.6"/><polygon points="796.0,220.0 792.4,228.0 799.6,228.0" fill="#C2185B"/><text x="808.0" y="247.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#C2185B" font-weight="bold">Q_H = Q_C + W</text><rect x="0" y="518" width="960" height="34" rx="0" fill="#EADDF7" stroke="none" stroke-width="0"/><text x="18.0" y="540.9" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#6420B8" font-weight="bold">THE ENERGY ACCOUNT OF EACH DEVICE</text><text x="30.0" y="570.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#222222" font-weight="normal">Engine: W = Q_H − Q_C ,  η = W/Q_H.        Refrigerator: COP_R = Q_C/W.        Heat pump: COP_HP = Q_H/W = COP_R + 1.</text><text x="24.0" y="600.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#6B6275" font-weight="normal">All three obey the first law; only the second law says which direction is possible.</text><text x="24.0" y="611.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#6B6275" font-weight="normal">Original teaching schematic • conceptual, not a construction/operating drawing</text></svg>
