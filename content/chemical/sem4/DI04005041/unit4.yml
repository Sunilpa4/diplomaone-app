07840720942" x2="240.72" y2="170.867128304257" stroke="#E07B00" stroke-width="2.6"/><circle cx="240.72" cy="171.15000000000003" r="7" fill="#FFFFFF" stroke="#6420B8" stroke-width="2.2"/><text x="227.7" y="167.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="end" fill="#6420B8" font-weight="bold">1</text><circle cx="302.6" cy="301.16999999999996" r="7" fill="#FFFFFF" stroke="#6420B8" stroke-width="2.2"/><text x="315.6" y="299.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" fill="#6420B8" font-weight="bold">2</text><circle cx="645.8" cy="425.118" r="7" fill="#FFFFFF" stroke="#6420B8" stroke-width="2.2"/><text x="657.8" y="441.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" fill="#6420B8" font-weight="bold">3</text><circle cx="424.28" cy="403.47" r="7" fill="#FFFFFF" stroke="#6420B8" stroke-width="2.2"/><text x="411.3" y="419.8" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="end" fill="#6420B8" font-weight="bold">4</text><text x="261.0" y="156.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#C2185B" font-weight="bold">1→2   isothermal at T_H</text><text x="378.0" y="354.5" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#E07B00" font-weight="bold">2→3   adiabatic</text><text x="482.0" y="409.1" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#1565C0" font-weight="bold">3→4   isothermal at T_C</text><text x="326.0" y="323.3" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="end" fill="#E07B00" font-weight="bold">4→1  adiabatic</text><rect x="0" y="472" width="960" height="34" rx="0" fill="#EADDF7" stroke="none" stroke-width="0"/><text x="18.0" y="494.9" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#6420B8" font-weight="bold">WHY IT IS THE MOST EFFICIENT CYCLE POSSIBLE</text><text x="30.0" y="528.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#222222" font-weight="normal">• Every process is reversible: heat is added and rejected isothermally at the two reservoir temperatures.</text><text x="30.0" y="551.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#222222" font-weight="normal">• No heat crosses a finite temperature difference, so no entropy is generated.</text><text x="30.0" y="574.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#222222" font-weight="normal">• The enclosed area is the net work  W = Q_H − Q_C.</text><text x="30.0" y="597.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#222222" font-weight="normal">• Its efficiency depends only on the two temperatures:   η = 1 − T_C/T_H.</text><text x="24.0" y="651.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#6B6275" font-weight="normal">Original teaching schematic • conceptual, not a construction/operating drawing</text></svg>
- id: d4_ts_diagram
  title:
    en: The same Carnot cycle on a T–S diagram
    gu: T–S diagram પર એ જ Carnot cycle
  file: diagrams/d4_ts_diagram.svg
  svg: |-
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 640" font-family="Arial, Helvetica, sans-serif"><rect width="940" height="640" fill="#ffffff"/><text x="24.0" y="36.6" font-family="Arial, Helvetica, sans-serif" font-size="19" text-anchor="start" fill="#6420B8" font-weight="bold">The same Carnot cycle on a T–S diagram</text><line x1="170" y1="450" x2="662.0" y2="450.0" stroke="#222222" stroke-width="1.6"/><polygon points="670.0,450.0 662.0,446.4 662.0,453.6" fill="#222222"/><line x1="170" y1="450" x2="170.0" y2="128.0" stroke="#222222" stroke-width="1.6"/><polygon points="170.0,120.0 166.4,128.0 173.6,128.0" fill="#222222"/><text x="420.0" y="488.4" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" fill="#222222" font-weight="bold">entropy  S  →</text><text x="98.0" y="289.4" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" fill="#222222" font-weight="bold">temperature  T  →</text><line x1="295.0" y1="450" x2="295.0" y2="456" stroke="#222222" stroke-width="1.2"/><text x="295.0" y="469.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#6B6275" font-weight="normal">0.25</text><line x1="420.0" y1="450" x2="420.0" y2="456" stroke="#222222" stroke-width="1.2"/><text x="420.0" y="469.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#6B6275" font-weight="normal">0.5</text><line x1="545.0" y1="450" x2="545.0" y2="456" stroke="#222222" stroke-width="1.2"/><text x="545.0" y="469.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#6B6275" font-weight="normal">0.75</text><line x1="670.0" y1="450" x2="670.0" y2="456" stroke="#222222" stroke-width="1.2"/><text x="670.0" y="469.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#6B6275" font-weight="normal">1.0</text><line x1="164" y1="318.0" x2="170" y2="318.0" stroke="#222222" stroke-width="1.2"/><text x="158.0" y="321.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="end" fill="#6B6275" font-weight="normal">0.4</text><line x1="164" y1="252.0" x2="170" y2="252.0" stroke="#222222" stroke-width="1.2"/><text x="158.0" y="255.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="end" fill="#6B6275" font-weight="normal">0.6</text><line x1="164" y1="186.0" x2="170" y2="186.0" stroke="#222222" stroke-width="1.2"/><text x="158.0" y="189.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="end" fill="#6B6275" font-weight="normal">0.8</text><line x1="164" y1="120.0" x2="170" y2="120.0" stroke="#222222" stroke-width="1.2"/><text x="158.0" y="123.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="end" fill="#6B6275" font-weight="normal">1.0</text><line x1="270.0" y1="136.5" x2="570.0" y2="136.5" stroke="#C2185B" stroke-width="2.8"/><line x1="570.0" y1="136.5" x2="570.0" y2="301.5" stroke="#E07B00" stroke-width="2.8"/><line x1="570.0" y1="301.5" x2="270.0" y2="301.5" stroke="#1565C0" stroke-width="2.8"/><line x1="270.0" y1="301.5" x2="270.0" y2="136.5" stroke="#E07B00" stroke-width="2.8"/><polygon points="270.0,136.5 570.0,136.5 570.0,301.5 270.0,301.5" fill="#EFE4FB" stroke="none" stroke-width="0"/><circle cx="270.0" cy="136.5" r="7" fill="#FFFFFF" stroke="#6420B8" stroke-width="2.2"/><text x="254.0" y="144.9" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="end" fill="#6420B8" font-weight="bold">1</text><circle cx="570.0" cy="136.5" r="7" fill="#FFFFFF" stroke="#6420B8" stroke-width="2.2"/><text x="584.0" y="144.9" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" fill="#6420B8" font-weight="bold">2</text><circle cx="570.0" cy="301.5" r="7" fill="#FFFFFF" stroke="#6420B8" stroke-width="2.2"/><text x="584.0" y="309.9" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" fill="#6420B8" font-weight="bold">3</text><circle cx="270.0" cy="301.5" r="7" fill="#FFFFFF" stroke="#6420B8" stroke-width="2.2"/><text x="254.0" y="309.9" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="end" fill="#6420B8" font-weight="bold">4</text><text x="420.0" y="124.3" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#C2185B" font-weight="bold">T_H = constant</text><text x="420.0" y="327.4" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#1565C0" font-weight="bold">T_C = constant</text><text x="420.0" y="223.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#6420B8" font-weight="bold">net work = shaded area</text><text x="420.0" y="242.8" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#222222" font-weight="normal">W = (T_H − T_C)(S₂ − S₁)</text><rect x="0" y="468" width="940" height="34" rx="0" fill="#EADDF7" stroke="none" stroke-width="0"/><text x="18.0" y="490.9" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#6420B8" font-weight="bold">THE RECTANGLE IS THE REASON</text><text x="30.0" y="524.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#222222" font-weight="normal">• Heat added at T_H is the area under 1→2:  Q_H = T_H (S₂ − S₁).</text><text x="30.0" y="547.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#222222" font-weight="normal">• Heat rejected at T_C is the area under 3→4:  Q_C = T_C (S₂ − S₁).</text><text x="30.0" y="570.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#222222" font-weight="normal">• Net work is the difference of the two rectangles, hence η = 1 − T_C/T_H.</text><text x="30.0" y="593.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#222222" font-weight="normal">• On this diagram a reversible cycle is a closed loop; the area inside it is the work.</text><text x="24.0" y="631.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#6B6275" font-weight="normal">Original teaching schematic • conceptual, not a construction/operating drawing</text></svg>
- id: d4_clausius
  title:
    en: Entropy generation and the Clausius inequality
    gu: entropy generation તથા Clausius inequality
  file: diagrams/d4_clausius.svg
  svg: |-
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 640" font-family="Arial, Helvetica, sans-serif"><rect width="940" height="640" fill="#ffffff"/><text x="24.0" y="36.6" font-family="Arial, Helvetica, sans-serif" font-size="19" text-anchor="start" fill="#6420B8" font-weight="bold">Entropy generation and the Clausius inequality</text><text x="24.0" y="80.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#6B6275" font-weight="normal">∮ δQ/T ≤ 0 for any cycle:  equality for reversible, less than zero for real cycles</text><rect x="40" y="120" width="400" height="120" rx="10" fill="#F8FDF9" stroke="#2E7D32" stroke-width="1.8"/><text x="60.0" y="152.4" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" fill="#2E7D32" font-weight="bold">REVERSIBLE</text><text x="60.0" y="181.2" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" fill="#6420B8" font-weight="bold">∮ δQ/T = 0</text><text x="60.0" y="207.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#6B6275" font-weight="normal">no entropy is generated inside the system</text><text x="60.0" y="227.8" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#222222" font-weight="normal">S₂ − S₁ = ∫ δQ_rev / T</text><rect x="480" y="120" width="420" height="120" rx="10" fill="#FEF8F8" stroke="#C2185B" stroke-width="1.8"/><text x="500.0" y="152.4" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" fill="#C2185B" font-weight="bold">IRREVERSIBLE (every real cycle)</text><text x="500.0" y="181.2" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" fill="#6420B8" font-weight="bold">∮ δQ/T &lt; 0</text><text x="500.0" y="207.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#6B6275" font-weight="normal">entropy is generated: S_gen &gt; 0</text><text x="500.0" y="227.8" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#222222" font-weight="normal">S₂ − S₁ = ∫ δQ/T + S_gen</text><rect x="0" y="250" width="940" height="34" rx="0" fill="#EADDF7" stroke="none" stroke-width="0"/><text x="18.0" y="272.9" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#6420B8" font-weight="bold">WHERE THE ENTROPY COMES FROM</text><rect x="40" y="290" width="6" height="16" rx="0" fill="#C2185B" stroke="none" stroke-width="0"/><text x="56.0" y="306.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#C2185B" font-weight="bold">friction</text><text x="56.0" y="323.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#6B6275" font-weight="normal">mechanical work turns into heat inside the fluid</text><rect x="500" y="290" width="6" height="16" rx="0" fill="#C2185B" stroke="none" stroke-width="0"/><text x="516.0" y="306.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#C2185B" font-weight="bold">unrestrained expansion</text><text x="516.0" y="323.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#6B6275" font-weight="normal">a gas rushing into vacuum creates entropy</text><rect x="40" y="334" width="6" height="16" rx="0" fill="#C2185B" stroke="none" stroke-width="0"/><text x="56.0" y="350.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#C2185B" font-weight="bold">heat across a finite ΔT</text><text x="56.0" y="367.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#6B6275" font-weight="normal">the classic irreversibility in any exchanger</text><rect x="500" y="334" width="6" height="16" rx="0" fill="#C2185B" stroke="none" stroke-width="0"/><text x="516.0" y="350.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#C2185B" font-weight="bold">mixing of two streams</text><text x="516.0" y="367.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#6B6275" font-weight="normal">different compositions blend irreversibly</text><rect x="40" y="378" width="6" height="16" rx="0" fill="#C2185B" stroke="none" stroke-width="0"/><text x="56.0" y="394.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#C2185B" font-weight="bold">electrical resistance</text><text x="56.0" y="411.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#6B6275" font-weight="normal">all the electrical work becomes heat</text><rect x="500" y="378" width="6" height="16" rx="0" fill="#C2185B" stroke="none" stroke-width="0"/><text x="516.0" y="394.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#C2185B" font-weight="bold">chemical reaction</text><text x="516.0" y="411.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#6B6275" font-weight="normal">reaction at a finite rate always generates entropy</text><rect x="0" y="474" width="940" height="34" rx="0" fill="#EADDF7" stroke="none" stroke-width="0"/><text x="18.0" y="496.9" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#6420B8" font-weight="bold">THE THREE STATEMENTS ARE THE SAME LAW</text><text x="40.0" y="530.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#222222" font-weight="normal">Kelvin–Planck: no engine can convert all the heat from one reservoir into work.</text><text x="40.0" y="554.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#222222" font-weight="normal">Clausius: heat cannot flow by itself from a colder to a hotter body.</text><text x="40.0" y="578.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#6420B8" font-weight="bold">Entropy: the entropy of the universe never decreases.   ΔS_universe ≥ 0</text><text x="24.0" y="631.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#6B6275" font-weight="normal">Original teaching schematic • conceptual, not a construction/operating drawing</text></svg>
viva:
- q:
    en: Why is a second law needed when the first law is already satisfied?
    gu: પ્રથમ નિયમ સંતોષાય તો પણ દ્વિતીય નિયમ કેમ જરૂરી છે?
  a:
    en: The first law is only an energy balance; it fixes Q − W but not the direction. Processes such as heat flowing from cold to hot, or an engine running on one reservoir, satisfy the first law but never occur. The second law supplies direction, the equilibrium condition and the maximum work.
    gu: પ્રથમ નિયમ ફક્ત energy balance છે; તે Q − W નિશ્ચિત કરે પણ દિશા નહીં. ઠંડા થી ગરમ તરફ heat જવી, કે એક જ reservoir પર engine ચાલવું — આવી પ્રક્રિયાઓ પ્રથમ નિયમ સંતોષે પણ કદી થતી નથી. દ્વિતીય નિયમ દિશા, equilibrium ની શરત તથા મહત્તમ work આપે છે.
- q:
    en: State the Kelvin–Planck and Clausius statements and show they are equivalent.
    gu: Kelvin–Planck તથા Clausius વિધાનો જણાવો અને બંને સમાનાર્થી છે તે દર્શાવો.
  a:
    en: 'Kelvin–Planck: no cyclic device can convert all the heat from a single reservoir into work. Clausius: no device can move heat from cold to hot without work input. If one were violated the other could be: a device violating Kelvin–Planck would give free work, which could drive a refrigerator and violate Clausius, and vice versa.'
    gu: 'Kelvin–Planck: કોઈ ચક્રીય ઉપકરણ એક જ reservoir ની આખી heat work માં ફેરવી શકે નહીં. Clausius: work input વગર કોઈ ઉપકરણ heat ને ઠંડા થી ગરમ તરફ ખસેડી શકે નહીં. એકનો ભંગ થાય તો બીજાનો પણ થઈ શકે: Kelvin–Planck નો ભંગ કરતું ઉપકરણ મફત work આપે, જે refrigerator ચલાવીને Clausius નો ભંગ કરે, અને ઊલટું.'
- q:
    en: Define entropy and state why it is a state function.
    gu: entropy ની વ્યાખ્યા આપો અને તે state function કેમ છે તે જણાવો.
  a:
    en: dS = δQ_rev/T. It is a state function because for a reversible cycle ∮δQ/T = 0, so the integral between two states does not depend on the path — which is the defining property of a state function.
    gu: dS = δQ_rev/T. તે state function છે કારણ કે reversible cycle માટે ∮δQ/T = 0, તેથી બે states વચ્ચેનું integral path પર આધાર રાખતું નથી — જે state function ની ઓળખ છે.
- q:
    en: State and prove the Carnot principle.
    gu: Carnot નો સિદ્ધાંત જણાવો અને સાબિત કરો.
  a:
    en: 'No engine between two reservoirs can exceed the efficiency of a reversible engine, and all reversible engines have the same efficiency. Proof by contradiction: if a reversible engine were less efficient, running it backwards with a better engine would move heat from cold to hot with no work input, violating Clausius.'
    gu: 'બે reservoirs વચ્ચેનું કોઈ engine reversible engine ની efficiency કરતાં વધુ ન હોઈ શકે, અને બધા reversible engines ની efficiency સરખી. વિરોધાભાસ દ્વારા સાબિતી: reversible engine ઓછું efficient હોય તો તેને ઉલટું ચલાવીને વધુ સારા engine સાથે કોઈ work input વગર heat ને ઠંડા થી ગરમ તરફ ખસેડી શકાય, જે Clausius નો ભંગ છે.'
- q:
    en: Write the Clausius inequality and explain each of its cases.
    gu: Clausius inequality લખો અને તેના દરેક કિસ્સા સમજાવો.
  a:
    en: ∮δQ/T ≤ 0, with T the boundary temperature. Equality for a reversible cycle, less than zero for an irreversible one. It gives dS = δQ/T + δS_gen with δS_gen ≥ 0, from which ΔS_universe ≥ 0 follows for an isolated system.
    gu: ∮δQ/T ≤ 0, જ્યાં T boundary temperature છે. reversible cycle માટે સમાનતા, irreversible માટે શૂન્યથી ઓછું. તે dS = δQ/T + δS_gen આપે જ્યાં δS_gen ≥ 0, જેમાંથી isolated system માટે ΔS_universe ≥ 0 મળે.
- q:
    en: Calculate the entropy change when two different ideal gases are mixed at the same T and P, and explain the sign.
    gu: સરખા T તથા P પર બે જુદા ideal gases મિશ્ર કરતાં entropy ફેરફાર ગણો અને ચિહ્ન સમજાવો.
  a:
    en: ΔS = −R Σ nᵢ ln yᵢ, which is always positive. Each gas expands into the volume previously occupied by the other at constant temperature, and expansion always increases entropy. The maximum occurs for an equimolar mixture.
    gu: ΔS = −R Σ nᵢ ln yᵢ, જે હંમેશા ધન. દરેક gas અચળ temperature પર બીજાના પહેલાંના volume માં expand થાય, અને expansion હંમેશા entropy વધારે. મહત્તમ સમાન mole મિશ્રણ માટે મળે.
- q:
    en: State the third law and explain what it is used for.
    gu: તૃતીય નિયમ જણાવો અને તે શેના માટે વપરાય તે સમજાવો.
  a:
    en: The entropy of a perfect crystal is zero at 0 K, and absolute zero is unattainable in a finite number of steps. It fixes the zero of the entropy scale, making absolute entropies (and so ΔS of reaction) tabulable.
    gu: 0 K પર સંપૂર્ણ સ્ફટિકની entropy શૂન્ય, અને મર્યાદિત પગલાંમાં absolute zero પામી શકાય નહીં. તે entropy scale નું શૂન્ય નિશ્ચિત કરે, જેથી absolute entropies (અને તેથી reaction નું ΔS) table માં આપી શકાય.
- q:
    en: Why is the Carnot cycle not used in practice?
    gu: Carnot cycle વ્યવહારમાં કેમ વપરાતું નથી?
  a:
    en: It requires isothermal heat transfer at exactly the reservoir temperature, which means infinitely slow processes, and perfectly insulated adiabatic steps. Both are impossible in a real machine, so it serves as an efficiency limit, not a design.
    gu: તેને બરાબર reservoir temperature પર isothermal heat transfer જોઈએ, એટલે અનંત ધીમી પ્રક્રિયાઓ, અને સંપૂર્ણ insulated adiabatic પગલાં. બંને વાસ્તવિક machine માં અશક્ય છે, તેથી તે efficiency મર્યાદા તરીકે કામ લાગે, design તરીકે નહીં.
exam_questions:
- q:
    en: State the limitations of the first law of thermodynamics and explain, with two examples, why the second law is required.
    gu: પ્રથમ નિયમની મર્યાદાઓ જણાવો અને બે ઉદાહરણ સાથે દ્વિતીય નિયમ કેમ જરૂરી છે તે સમજાવો.
