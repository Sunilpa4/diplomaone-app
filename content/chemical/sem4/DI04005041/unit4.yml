- title:
    en: 4.1  Limitations of the first law
    gu: 4.1  પ્રથમ નિયમની મર્યાદાઓ
  items:
  - h:
      en: Limitations of the first law
      gu: પ્રથમ નિયમની મર્યાદાઓ
    body:
      en: |-
        <h4>Definition / principle</h4><p>The first law is an energy <i>balance</i>: it accounts for what goes in and what comes out, but it says nothing about whether a process can actually happen, or in which direction. A process that satisfies Q − W = ΔU may still be impossible — every statement of the second law is a correction to that silence.</p><h4>Detailed theory and conditions</h4><p>Take a cup of hot coffee and a room. The first law is equally happy with the coffee cooling to room temperature or the room spontaneously cooling further while the coffee gets hotter — the energy balances both ways. Only the second law rules the second process out. In the same way the first law permits an engine that takes heat from the sea and converts it entirely into work, and it permits heat to flow from cold to hot without help; neither is observed, and each would give free energy.<br><br>The second law therefore supplies three things the first law cannot: the <b>direction</b> in which a process will go, the <b>condition of equilibrium</b> where it stops, and the <b>maximum</b> work a given change can deliver.</p><h4>Key points and data</h4><ul><li><b>First law permits:</b> coffee heating itself and cooling the room; an engine running on the sea; ice forming in warm water.</li><li><b>Second law rules out:</b> each of those, without an external work input.</li><li><b>First law gives:</b> how much energy is involved. <b>Second law gives:</b> how much of it can become work.</li><li>This is why every real engine's efficiency is measured against the Carnot value, not against 100 %.</li></ul><h4>Qualification</h4><p>The first law is not wrong; it is incomplete. Both laws must be satisfied together, and in practice the first law is used to size equipment while the second law decides whether the scheme is worth building at all.</p>
      gu: |-
        <h4>વ્યાખ્યા / સિદ્ધાંત</h4><p>પ્રથમ નિયમ ઊર્જાનું <i>balance</i> છે: તે અંદર જે આવે અને બહાર જે જાય તેનો હિસાબ રાખે છે, પણ પ્રક્રિયા ખરેખર થઈ શકે કે નહીં, કે કઈ દિશામાં થશે તે કંઈ કહેતો નથી. Q − W = ΔU સંતોષતી પ્રક્રિયા પણ અશક્ય હોઈ શકે — દ્વિતીય નિયમનું દરેક વિધાન એ સ્થિતિનો સુધારો છે.</p><h4>વિગતવાર Theory તથા Conditions</h4><p>ગરમ કોફીનો કપ તથા એક રૂમ લો. કોફી રૂમના temperature સુધી ઠંડી થાય કે રૂમ વધુ ઠંડો થઈને કોફી વધુ ગરમ થાય — પ્રથમ નિયમ બંને સાથે સંતુષ્ટ છે; ઊર્જા બંને રીતે સંતુલિત થાય. ફક્ત દ્વિતીય નિયમ બીજી પ્રક્રિયાને નકારે છે. એ જ રીતે પ્રથમ નિયમ એવા engine ને માન્ય ગણે જે સમુદ્રમાંથી heat લઈ આખું work માં ફેરવે, અને heat ને મદદ વગર ઠંડા થી ગરમ તરફ જવા દે; બંને કદી જોવાયા નથી, અને દરેક મફત ઊર્જા આપે.<br><br>તેથી દ્વિતીય નિયમ ત્રણ વસ્તુ આપે છે જે પ્રથમ નિયમ નથી આપી શકતું: પ્રક્રિયા જે <b>દિશામાં</b> જશે, જ્યાં અટકશે તે <b>equilibrium ની શરત</b>, અને આપેલા ફેરફારથી મળી શકતું <b>મહત્તમ</b> work.</p><h4>મુખ્ય મુદ્દા તથા data</h4><ul><li><b>First law permits:</b> coffee heating itself and cooling the room; an engine running on the sea; ice forming in warm water.</li><li><b>Second law rules out:</b> each of those, without an external work input.</li><li><b>First law gives:</b> how much energy is involved. <b>Second law gives:</b> how much of it can become work.</li><li>This is why every real engine's efficiency is measured against the Carnot value, not against 100 %.</li></ul><h4>નોંધ</h4><p>પ્રથમ નિયમ ખોટો નથી; અપૂર્ણ છે. બંને નિયમો સાથે સંતોષવા પડે, અને વ્યવહારમાં પ્રથમ નિયમ equipment નું size નક્કી કરવા વપરાય જ્યારે દ્વિતીય નિયમ નક્કી કરે કે યોજના બનાવવા જેવી છે કે નહીં.</p>
- title:
    en: 4.2  Heat reservoir, engine, refrigerator and heat pump
    gu: 4.2  Heat reservoir, engine, refrigerator તથા heat pump
  items:
  - h:
      en: Heat reservoir, heat engine, refrigerator and heat pump
      gu: Heat reservoir, heat engine, refrigerator તથા heat pump
    body:
      en: |-
        <h4>Definition / principle</h4><p>A <b>heat reservoir</b> is a body of such large heat capacity that taking heat from it or giving heat to it does not change its temperature. A <b>heat engine</b> is a cyclic device that absorbs Q<sub>H</sub> from a hot reservoir, rejects Q<sub>C</sub> to a cold reservoir and delivers work W = Q<sub>H</sub> − Q<sub>C</sub>. A <b>refrigerator</b> and a <b>heat pump</b> run the same cycle in reverse and consume work to move heat from cold to hot.</p><h4>Detailed theory and conditions</h4><p>Three performance measures follow from the same energy balance, and they are easy to confuse. The engine <b>efficiency</b> is what you get out for what you paid for: η = W/Q<sub>H</sub>. The refrigerator <b>coefficient of performance</b> is what you remove for the work you buy: COP<sub>R</sub> = Q<sub>C</sub>/W. The heat pump COP is what you deliver for the same work: COP<sub>HP</sub> = Q<sub>H</sub>/W, and the two COPs differ by exactly one because Q<sub>H</sub> = Q<sub>C</sub> + W.<br><br>Because a COP can be greater than one (a domestic heat pump delivers 3–4 kW of heat per kW of electricity) it is never called an efficiency. An efficiency above one would be a first-law violation; a COP above one is perfectly normal, because the extra energy comes from the cold reservoir, not from nowhere.</p><h4>Equations and notation</h4><div class="math" data-tex="\eta=\frac{W}{Q_H}" aria-label="\eta=\frac{W}{Q_H}">engine:  W = Q_H − Q_C ,   η = W / Q_H</div><div class="math" data-tex="COP_R=\frac{Q_C}{W}" aria-label="COP_R=\frac{Q_C}{W}">refrigerator:  COP_R = Q_C / W</div><div class="math" data-tex="COP_{HP}=COP_R+1" aria-label="COP_{HP}=COP_R+1">heat pump:  COP_HP = Q_H / W = COP_R + 1</div><div class="math" data-tex="\eta=1-\frac{T_C}{T_H}" aria-label="\eta=1-\frac{T_C}{T_H}">Carnot:  η = 1 − T_C/T_H ;  COP_R = T_C/(T_H − T_C)</div><h4>Key points and data</h4><ul><li><b>Reservoir examples:</b> the atmosphere, a river, a large steam main, a furnace — anything whose temperature does not move.</li><li><b>Engine:</b> steam power plant, petrol engine, gas turbine.</li><li><b>Refrigerator:</b> domestic fridge, air-conditioning, cold store.</li><li><b>Heat pump:</b> the same hardware as a fridge, but the useful output is the heat rejected at the warm side.</li></ul><h4>Qualification</h4><p>A device with η = 100 % would convert all the heat from one reservoir into work. The Kelvin–Planck statement forbids it, so no engine can reach it, and a real engine is always judged by how far below the Carnot value it runs.</p>
      gu: |-
        <h4>વ્યાખ્યા / સિદ્ધાંત</h4><p><b>Heat reservoir</b> એટલી મોટી heat capacity ધરાવતું શરીર છે કે તેમાંથી heat લેવાય કે આપાય તો પણ તેનું temperature બદલાય નહીં. <b>Heat engine</b> એ ચક્રીય ઉપકરણ છે જે ગરમ reservoir માંથી Q<sub>H</sub> લે, ઠંડા reservoir ને Q<sub>C</sub> આપે અને work W = Q<sub>H</sub> − Q<sub>C</sub> આપે. <b>Refrigerator</b> તથા <b>heat pump</b> એ જ cycle ઉલટી દિશામાં ચલાવીને ઠંડા થી ગરમ તરફ heat ખસેડવા work વાપરે છે.</p><h4>વિગતવાર Theory તથા Conditions</h4><p>એક જ energy balance પરથી ત્રણ performance માપ મળે છે, અને તે ભેળવી દેવા સહેલા છે. Engine ની <b>efficiency</b> એટલે જે મળે તે ભાગ્યે જે આપ્યું: η = W/Q<sub>H</sub>. Refrigerator નો <b>coefficient of performance</b> એટલે જે work ખરીદ્યું તેના ભાગ્યે જે heat કાઢી: COP<sub>R</sub> = Q<sub>C</sub>/W. Heat pump નો COP એ જ work માટે જે આપ્યું તે: COP<sub>HP</sub> = Q<sub>H</sub>/W, અને બંને COP માં બરાબર એકનો તફાવત હોય છે કારણ કે Q<sub>H</sub> = Q<sub>C</sub> + W.<br><br>COP એકથી મોટો હોઈ શકે (ઘરેલું heat pump પ્રતિ kW વીજળી 3–4 kW heat આપે) તેથી તેને કદી efficiency નહીં કહેવાય. એકથી મોટી efficiency પ્રથમ નિયમનો ભંગ થાય, પણ એકથી મોટો COP સાવ સામાન્ય છે, કારણ કે વધારાની ઊર્જા ઠંડા reservoir માંથી આવે છે, ક્યાંયથી નહીં.</p><h4>સમીકરણો તથા Notation</h4><div class="math" data-tex="\eta=\frac{W}{Q_H}" aria-label="\eta=\frac{W}{Q_H}">engine:  W = Q_H − Q_C ,   η = W / Q_H</div><div class="math" data-tex="COP_R=\frac{Q_C}{W}" aria-label="COP_R=\frac{Q_C}{W}">refrigerator:  COP_R = Q_C / W</div><div class="math" data-tex="COP_{HP}=COP_R+1" aria-label="COP_{HP}=COP_R+1">heat pump:  COP_HP = Q_H / W = COP_R + 1</div><div class="math" data-tex="\eta=1-\frac{T_C}{T_H}" aria-label="\eta=1-\frac{T_C}{T_H}">Carnot:  η = 1 − T_C/T_H ;  COP_R = T_C/(T_H − T_C)</div><h4>મુખ્ય મુદ્દા તથા data</h4><ul><li><b>Reservoir examples:</b> the atmosphere, a river, a large steam main, a furnace — anything whose temperature does not move.</li><li><b>Engine:</b> steam power plant, petrol engine, gas turbine.</li><li><b>Refrigerator:</b> domestic fridge, air-conditioning, cold store.</li><li><b>Heat pump:</b> the same hardware as a fridge, but the useful output is the heat rejected at the warm side.</li></ul><h4>નોંધ</h4><p>η = 100 % વાળું ઉપકરણ એક જ reservoir ની આખી heat work માં ફેરવે. Kelvin–Planck વિધાન તેને નિષેધે, તેથી કોઈ engine તેને પામી શકે નહીં, અને વાસ્તવિક engine હંમેશા Carnot કિંમતથી કેટલું નીચે છે તેના પરથી મપાય.</p>
