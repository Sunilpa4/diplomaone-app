programs:
- ref: N1
  title:
    en: Carnot efficiency and work output
    gu: Carnot efficiency તથા work output
  format: rich_cards
  items:
  - h:
      en: Carnot efficiency and work output
      gu: Carnot efficiency તથા work output
    body:
      en: |-
        <h4>Given</h4><p>A reversible engine works between a source at 600 K and a sink at 300 K. It receives 2 000 kJ of heat per cycle from the source.</p><h4>Find</h4><p>Carnot efficiency, work output per cycle and heat rejected.</p><h4>Formula</h4><div class="math" data-tex="\eta=1-\frac{T_C}{T_H}" aria-label="\eta=1-\frac{T_C}{T_H}">η = 1 − T_C/T_H</div><div class="math" data-tex="W=\eta Q_H" aria-label="W=\eta Q_H">W = η Q_H        Q_C = Q_H − W</div><h4>Substitution and calculation</h4><p>η = 1 − 300/600 = 0.50. W = 0.50 × 2 000 = 1 000 kJ. Q_C = 2 000 − 1 000 = 1 000 kJ.</p><h4>Final answer with units</h4><p>η = 50 %;  W = 1 000 kJ per cycle;  Q_C = 1 000 kJ rejected to the sink.</p><h4>Validity check</h4><p>A 300 K sink against a 600 K source gives exactly one half — the temperatures differ by a factor of two. The energy balance also checks: 2 000 in, 1 000 out as work, 1 000 out as heat.</p>
      gu: |-
        <h4>આપેલ</h4><p>reversible engine 600 K ના source તથા 300 K ના sink વચ્ચે ચાલે છે. તે દરેક cycle માં source માંથી 2 000 kJ heat લે છે.</p><h4>શોધો</h4><p>Carnot efficiency, દરેક cycle નું work તથા બહાર ફેંકાતી heat.</p><h4>સૂત્ર</h4><div class="math" data-tex="\eta=1-\frac{T_C}{T_H}" aria-label="\eta=1-\frac{T_C}{T_H}">η = 1 − T_C/T_H</div><div class="math" data-tex="W=\eta Q_H" aria-label="W=\eta Q_H">W = η Q_H        Q_C = Q_H − W</div><h4>Substitution તથા Calculation</h4><p>η = 1 − 300/600 = 0.50. W = 0.50 × 2 000 = 1 000 kJ. Q_C = 2 000 − 1 000 = 1 000 kJ.</p><h4>Units સાથે અંતિમ જવાબ</h4><p>η = 50 %;  W = 1 000 kJ પ્રતિ cycle;  Q_C = 1 000 kJ sink ને ફેંકાય.</p><h4>Validity Check</h4><p>600 K source સામે 300 K sink બરાબર અડધું આપે — temperatures બે ગણા છે. Energy balance પણ મળે: 2 000 અંદર, 1 000 work તરીકે બહાર, 1 000 heat તરીકે બહાર.</p>
- ref: N2
  title:
    en: Entropy change of water being heated
    gu: પાણી ગરમ કરવાનો entropy ફેરફાર
  format: rich_cards
  items:
  - h:
      en: Entropy change of water being heated
      gu: પાણી ગરમ કરવાનો entropy ફેરફાર
    body:
      en: |-
        <h4>Given</h4><p>5 kg of water is heated from 20 °C to 80 °C at constant pressure. c_p = 4.187 kJ/kg·K.</p><h4>Find</h4><p>The entropy change of the water.</p><h4>Formula</h4><div class="math" data-tex="\Delta S=mc_p\ln\frac{T_2}{T_1}" aria-label="\Delta S=mc_p\ln\frac{T_2}{T_1}">ΔS = m c_p ln(T₂/T₁)</div><h4>Substitution and calculation</h4><p>T₁ = 293 K, T₂ = 353 K. ΔS = 5 × 4.187 × ln(353/293) = 20.935 × ln 1.2048 = 20.935 × 0.1864 = 3.90 kJ/K.</p><h4>Final answer with units</h4><p>ΔS = 3.90 kJ/K for the water.</p><h4>Validity check</h4><p>Heating always raises entropy, and the logarithmic form is essential — using Q/T with a single average temperature would give a rough answer only. The result is about 1.7 % of the water's own heat capacity per kelvin, which is the right order for a 60 K rise.</p>
      gu: |-
        <h4>આપેલ</h4><p>5 kg પાણી અચળ pressure પર 20 °C થી 80 °C સુધી ગરમ કરાય છે. c_p = 4.187 kJ/kg·K.</p><h4>શોધો</h4><p>પાણીનો entropy ફેરફાર.</p><h4>સૂત્ર</h4><div class="math" data-tex="\Delta S=mc_p\ln\frac{T_2}{T_1}" aria-label="\Delta S=mc_p\ln\frac{T_2}{T_1}">ΔS = m c_p ln(T₂/T₁)</div><h4>Substitution તથા Calculation</h4><p>T₁ = 293 K, T₂ = 353 K. ΔS = 5 × 4.187 × ln(353/293) = 20.935 × ln 1.2048 = 20.935 × 0.1864 = 3.90 kJ/K.</p><h4>Units સાથે અંતિમ જવાબ</h4><p>પાણી માટે ΔS = 3.90 kJ/K.</p><h4>Validity Check</h4><p>ગરમ કરવાથી entropy હંમેશા વધે, અને logarithmic સ્વરૂપ જરૂરી છે — એક સરેરાશ temperature સાથે Q/T વાપરતાં ફક્ત આશરે જવાબ મળે. પરિણામ પાણીની heat capacity ના લગભગ 1.7 % પ્રતિ kelvin છે, જે 60 K વધારા માટે સાચો ક્રમ છે.</p>
- ref: N3
  title:
    en: Entropy change in a phase change
    gu: phase change માં entropy ફેરફાર
  format: rich_cards
  items:
  - h:
      en: Entropy change in a phase change
      gu: phase change માં entropy ફેરફાર
    body:
      en: |-
        <h4>Given</h4><p>2 kg of saturated water at 100 °C is completely evaporated at the same temperature. Latent heat of vaporisation = 2 257 kJ/kg.</p><h4>Find</h4><p>Heat absorbed and the entropy change of the water.</p><h4>Formula</h4><div class="math" data-tex="\Delta S=\frac{mL}{T}" aria-label="\Delta S=\frac{mL}{T}">Q = m L        ΔS = Q/T = m L / T</div><h4>Substitution and calculation</h4><p>T = 373 K. Q = 2 × 2 257 = 4 514 kJ. ΔS = 4 514/373 = 12.10 kJ/K.</p><h4>Final answer with units</h4><p>Q = 4 514 kJ;  ΔS = 12.10 kJ/K (entropy increases on vaporisation).</p><h4>Validity check</h4><p>Vaporisation greatly increases the number of molecular arrangements, so a large positive ΔS is expected — here 6.05 kJ/kg·K, and condensing the same steam would give exactly the negative of this value.</p>
      gu: |-
        <h4>આપેલ</h4><p>100 °C પરનું 2 kg saturated પાણી એ જ temperature પર પૂરેપૂરું બાષ્પીભવન થાય છે. વાષ્પીભવનની latent heat = 2 257 kJ/kg.</p><h4>શોધો</h4><p>લેવાયેલી heat તથા પાણીનો entropy ફેરફાર.</p><h4>સૂત્ર</h4><div class="math" data-tex="\Delta S=\frac{mL}{T}" aria-label="\Delta S=\frac{mL}{T}">Q = m L        ΔS = Q/T = m L / T</div><h4>Substitution તથા Calculation</h4><p>T = 373 K. Q = 2 × 2 257 = 4 514 kJ. ΔS = 4 514/373 = 12.10 kJ/K.</p><h4>Units સાથે અંતિમ જવાબ</h4><p>Q = 4 514 kJ;  ΔS = 12.10 kJ/K (વાષ્પીભવનમાં entropy વધે).</p><h4>Validity Check</h4><p>વાષ્પીભવનથી molecular ગોઠવણો ઘણી વધે, તેથી મોટો ધન ΔS અપેક્ષિત છે — અહીં 6.05 kJ/kg·K, અને એ જ steam condense કરતાં બરાબર આનું ઋણ મળે.</p>
- ref: N4
  title:
    en: Entropy of mixing two ideal gases
    gu: બે ideal gases ના mixing ની entropy
  format: rich_cards
  items:
  - h:
      en: Entropy of mixing two ideal gases
      gu: બે ideal gases ના mixing ની entropy
    body:
      en: |-
        <h4>Given</h4><p>1 kmol of nitrogen and 3 kmol of oxygen are mixed at the same temperature and pressure. R = 8.314 kJ/kmol·K.</p><h4>Find</h4><p>The entropy of mixing.</p><h4>Formula</h4><div class="math" data-tex="\Delta S_{mix}=-R\sum n_i\ln y_i" aria-label="\Delta S_{mix}=-R\sum n_i\ln y_i">ΔS_mix = −R Σ n_i ln y_i</div><h4>Substitution and calculation</h4><p>n_total = 4 kmol; y_N₂ = 0.25, y_O₂ = 0.75. ΔS = −8.314 [1 × ln 0.25 + 3 × ln 0.75] = −8.314 [(−1.3863) + 3(−0.2877)] = −8.314 [−1.3863 − 0.8631] = −8.314 × (−2.2494) = 18.70 kJ/K.</p><h4>Final answer with units</h4><p>ΔS_mix = +18.70 kJ/K — positive, as it must be for spontaneous mixing.</p><h4>Validity check</h4><p>Mixing is irreversible, so entropy must increase. The value is largest for an equimolar mixture and falls to zero when one component dominates — try 0.5/0.5 and you get 23.1 kJ/K, the maximum.</p>
      gu: |-
        <h4>આપેલ</h4><p>1 kmol nitrogen તથા 3 kmol oxygen સરખા temperature તથા pressure પર મિશ્ર કરાય છે. R = 8.314 kJ/kmol·K.</p><h4>શોધો</h4><p>mixing ની entropy.</p><h4>સૂત્ર</h4><div class="math" data-tex="\Delta S_{mix}=-R\sum n_i\ln y_i" aria-label="\Delta S_{mix}=-R\sum n_i\ln y_i">ΔS_mix = −R Σ n_i ln y_i</div><h4>Substitution તથા Calculation</h4><p>n_total = 4 kmol; y_N₂ = 0.25, y_O₂ = 0.75. ΔS = −8.314 [1 × ln 0.25 + 3 × ln 0.75] = −8.314 [(−1.3863) + 3(−0.2877)] = −8.314 [−1.3863 − 0.8631] = −8.314 × (−2.2494) = 18.70 kJ/K.</p><h4>Units સાથે અંતિમ જવાબ</h4><p>ΔS_mix = +18.70 kJ/K — ધન, જે સ્વયંભૂ mixing માટે હોવું જ જોઈએ.</p><h4>Validity Check</h4><p>Mixing irreversible છે, તેથી entropy વધવી જ જોઈએ. સમાન mole હોય ત્યારે કિંમત સૌથી વધુ હોય અને એક component પ્રભાવી થતાં શૂન્ય થાય — 0.5/0.5 લેતાં 23.1 kJ/K મળે, જે મહત્તમ છે.</p>
- ref: N5
  title:
    en: Isentropic efficiency of a turbine
    gu: turbine ની isentropic efficiency
  format: rich_cards
  items:
  - h:
      en: Isentropic efficiency of a turbine
      gu: turbine ની isentropic efficiency
    body:
      en: |-
        <h4>Given</h4><p>Steam enters a turbine at 40 bar, 400 °C (h₁ = 3 214 kJ/kg, s₁ = 6.769 kJ/kg·K) and leaves at 0.1 bar. The isentropic exit enthalpy is 2 216 kJ/kg; the actual exit enthalpy is 2 350 kJ/kg.</p><h4>Find</h4><p>Isentropic work, actual work, isentropic efficiency and the entropy generated.</p><h4>Formula</h4><div class="math" data-tex="w_s=h_1-h_2" aria-label="w_s=h_1-h_2">w_s = h₁ − h₂</div><div class="math" data-tex="\eta_{is}=\frac{h_1-h_2}{h_1-h_{2s}}" aria-label="\eta_{is}=\frac{h_1-h_2}{h_1-h_{2s}}">η_is = (h₁ − h₂)/(h₁ − h₂s)</div><div class="math" data-tex="w_{lost}=T_0(s_2-s_1)" aria-label="w_{lost}=T_0(s_2-s_1)">w_lost = T₀ (s₂ − s₁)</div><h4>Substitution and calculation</h4><p>w_s,ideal = 3 214 − 2 216 = 998 kJ/kg. w_s,actual = 3 214 − 2 350 = 864 kJ/kg. η_is = 864/998 = 0.866 = 86.6 %. The lost work at 300 K surroundings is T₀(s₂ − s₁) = 300 × (6.847 − 6.769) = 23.4 kJ/kg.</p><h4>Final answer with units</h4><p>η_is = 86.6 %;  the turbine loses 134 kJ/kg compared with an ideal one, of which 23.4 kJ/kg is lost work at 300 K.</p><h4>Validity check</h4><p>Isentropic efficiency is always below 100 % and 86.6 % is typical for a large steam turbine. The entropy at exit is higher than at inlet, which is the signature of an irreversible adiabatic expansion.</p>
      gu: |-
        <h4>આપેલ</h4><p>Steam turbine માં 40 bar, 400 °C પર આવે છે (h₁ = 3 214 kJ/kg, s₁ = 6.769 kJ/kg·K) અને 0.1 bar પર નીકળે છે. Isentropic exit enthalpy 2 216 kJ/kg; વાસ્તવિક exit enthalpy 2 350 kJ/kg.</p><h4>શોધો</h4><p>isentropic work, વાસ્તવિક work, isentropic efficiency તથા ઉત્પન્ન થયેલી entropy.</p><h4>સૂત્ર</h4><div class="math" data-tex="w_s=h_1-h_2" aria-label="w_s=h_1-h_2">w_s = h₁ − h₂</div><div class="math" data-tex="\eta_{is}=\frac{h_1-h_2}{h_1-h_{2s}}" aria-label="\eta_{is}=\frac{h_1-h_2}{h_1-h_{2s}}">η_is = (h₁ − h₂)/(h₁ − h₂s)</div><div class="math" data-tex="w_{lost}=T_0(s_2-s_1)" aria-label="w_{lost}=T_0(s_2-s_1)">w_lost = T₀ (s₂ − s₁)</div><h4>Substitution તથા Calculation</h4><p>w_s,ideal = 3 214 − 2 216 = 998 kJ/kg. w_s,actual = 3 214 − 2 350 = 864 kJ/kg. η_is = 864/998 = 0.866 = 86.6 %. 300 K surroundings પર lost work T₀(s₂ − s₁) = 300 × (6.847 − 6.769) = 23.4 kJ/kg.</p><h4>Units સાથે અંતિમ જવાબ</h4><p>η_is = 86.6 %;  turbine ideal કરતાં 134 kJ/kg ગુમાવે, જેમાંથી 300 K પર 23.4 kJ/kg lost work છે.</p><h4>Validity Check</h4><p>Isentropic efficiency હંમેશા 100 % થી નીચે હોય અને મોટા steam turbine માટે 86.6 % સામાન્ય છે. Exit પર entropy inlet કરતાં વધુ છે, જે irreversible adiabatic expansion ની ઓળખ છે.</p>
- ref: N6
  title:
    en: Refrigerator COP and power input
    gu: Refrigerator COP તથા power input
  format: rich_cards
  items:
  - h:
      en: Refrigerator COP and power input
      gu: Refrigerator COP તથા power input
    body:
      en: |-
        <h4>Given</h4><p>A refrigerator maintains a cold space at −15 °C while rejecting heat to surroundings at 30 °C. It must remove 12 kW of heat.</p><h4>Find</h4><p>Maximum possible COP, the minimum power required, and the COP if the actual machine needs 4.5 kW.</p><h4>Formula</h4><div class="math" data-tex="COP=\frac{T_C}{T_H-T_C}" aria-label="COP=\frac{T_C}{T_H-T_C}">COP_Carnot = T_C/(T_H − T_C)</div><div class="math" data-tex="COP=\frac{Q_C}{W}" aria-label="COP=\frac{Q_C}{W}">COP_actual = Q_C / W</div><h4>Substitution and calculation</h4><p>T_C = 258 K, T_H = 303 K. COP_max = 258/(303 − 258) = 258/45 = 5.73. W_min = 12/5.73 = 2.09 kW. Actual: COP = 12/4.5 = 2.67, so the machine is at 2.67/5.73 = 47 % of the reversible limit.</p><h4>Final answer with units</h4><p>COP_max = 5.73;  W_min = 2.09 kW;  actual COP = 2.67 (47 % of the Carnot limit).</p><h4>Validity check</h4><p>A COP above 1 is normal for a refrigerator and violates nothing: the extra heat comes from the cold space. The Carnot COP is very sensitive to the temperature lift — 45 K here — which is why a fridge works harder on a hot day.</p>
      gu: |-
        <h4>આપેલ</h4><p>Refrigerator ઠંડી જગ્યાને −15 °C પર રાખે છે અને 30 °C ના surroundings ને heat ફેંકે છે. તેને 12 kW heat કાઢવી પડે છે.</p><h4>શોધો</h4><p>મહત્તમ શક્ય COP, લઘુત્તમ જરૂરી power, અને વાસ્તવિક machine ને 4.5 kW જોઈએ તો COP.</p><h4>સૂત્ર</h4><div class="math" data-tex="COP=\frac{T_C}{T_H-T_C}" aria-label="COP=\frac{T_C}{T_H-T_C}">COP_Carnot = T_C/(T_H − T_C)</div><div class="math" data-tex="COP=\frac{Q_C}{W}" aria-label="COP=\frac{Q_C}{W}">COP_actual = Q_C / W</div><h4>Substitution તથા Calculation</h4><p>T_C = 258 K, T_H = 303 K. COP_max = 258/(303 − 258) = 258/45 = 5.73. W_min = 12/5.73 = 2.09 kW. વાસ્તવિક: COP = 12/4.5 = 2.67, તેથી machine reversible મર્યાદાના 2.67/5.73 = 47 % પર છે.</p><h4>Units સાથે અંતિમ જવાબ</h4><p>COP_max = 5.73;  W_min = 2.09 kW;  વાસ્તવિક COP = 2.67 (Carnot મર્યાદાના 47 %).</p><h4>Validity Check</h4><p>Refrigerator માટે COP એકથી વધુ હોવો સામાન્ય છે અને કોઈ નિયમનો ભંગ નથી: વધારાની heat ઠંડી જગ્યા માંથી આવે. Carnot COP temperature lift પર ખૂબ સંવેદનશીલ છે — અહીં 45 K — એટલે જ ગરમ દિવસે fridge વધુ મહેનત કરે.</p>
syntax:
- title:
    en: Performance measures
    gu: performance નાં માપ
  items:
  - title:
      en: Heat engine
      gu: Heat engine
    f: 'η = W/Q_H = 1 − Q_C/Q_H;  Carnot: η = 1 − T_C/T_H'
    terms: Efficiency can never reach 1 because T_C = 0 K is unattainable.
  - title:
      en: Refrigerator
      gu: Refrigerator
    f: 'COP_R = Q_C/W;  Carnot: COP_R = T_C/(T_H − T_C)'
    terms: COP may exceed 1 — it is not an efficiency.
  - title:
      en: Heat pump
      gu: Heat pump
    f: COP_HP = Q_H/W = COP_R + 1
    terms: Same cycle as a refrigerator; the useful output is the warm-side heat.
- title:
    en: Entropy changes
    gu: entropy ફેરફારો
  items:
  - title:
      en: Definition
      gu: વ્યાખ્યા
    f: dS = δQ_rev/T;  S₂ − S₁ = ∫₁² δQ_rev/T
    terms: Entropy is a state function; integrate along any reversible path.
  - title:
      en: Ideal gas
      gu: Ideal gas
    f: ΔS = m c_v ln(T₂/T₁) + m R ln(V₂/V₁);  or  m c_p ln(T₂/T₁) − m R ln(P₂/P₁)
    terms: Reversible adiabatic gives ΔS = 0 exactly.
  - title:
      en: Phase change
      gu: Phase change
    f: ΔS = ΔH_phase/T
    terms: Isothermal, so the simple Q/T form applies.
  - title:
      en: Mixing
      gu: Mixing
    f: ΔS_mix = −R Σ nᵢ ln yᵢ  > 0
    terms: Zero for identical gases, maximum for equimolar mixtures.
- title:
    en: Second-law statements
    gu: દ્વિતીય નિયમનાં વિધાનો
  items:
  - title:
      en: Clausius inequality
      gu: Clausius inequality
    f: ∮ δQ/T ≤ 0  (=0 reversible, <0 irreversible)
    terms: T is the boundary temperature where the heat crosses.
  - title:
      en: Entropy balance
      gu: Entropy balance
    f: dS = δQ/T + δS_gen;  δS_gen ≥ 0;  I = T₀ δS_gen
    terms: Lost work I is the work a reversible plant would have produced.
  - title:
      en: Third law
      gu: તૃતીય નિયમ
    f: S = 0 for a perfect crystal at 0 K
    terms: Fixes the zero of the entropy scale; abs0 is unattainable.
