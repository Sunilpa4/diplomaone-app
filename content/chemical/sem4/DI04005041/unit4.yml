    en: Define heat engine, refrigerator and heat pump. Derive the expressions for efficiency and coefficient of performance.
    gu: Heat engine, refrigerator તથા heat pump વ્યાખ્યાયિત કરો. Efficiency તથા coefficient of performance ના સૂત્રો મેળવો.
