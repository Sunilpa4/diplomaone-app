<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 645" font-family="Arial, Helvetica, sans-serif"><rect width="960" height="645" fill="#ffffff"/><text x="24.0" y="36.6" font-family="Arial, Helvetica, sans-serif" font-size="19" text-anchor="start" fill="#6420B8" font-weight="bold">A vapour-compression refrigerator: four components, four state points</text><rect x="248" y="366" width="250" height="132" rx="12" fill="#EAF3FD" stroke="#B9A6CE" stroke-width="1.4"/><rect x="330" y="150" width="190" height="70" rx="8" fill="#EADDF7" stroke="#7B2CD9" stroke-width="1.8"/><text x="425.0" y="189.4" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" fill="#6420B8" font-weight="bold">compressor</text><rect x="590" y="150" width="190" height="70" rx="8" fill="#FCE4EC" stroke="#C2185B" stroke-width="1.8"/><text x="685.0" y="189.4" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" fill="#C2185B" font-weight="bold">condenser</text><rect x="590" y="400" width="190" height="70" rx="8" fill="#EADDF7" stroke="#7B2CD9" stroke-width="1.8"/><text x="685.0" y="439.4" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" fill="#6420B8" font-weight="bold">expansion valve</text><rect x="330" y="400" width="190" height="70" rx="8" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.8"/><text x="425.0" y="439.4" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" fill="#1565C0" font-weight="bold">evaporator</text><line x1="522" y1="185" x2="579.0" y2="185.0" stroke="#C2185B" stroke-width="2.4"/><polygon points="588.0,185.0 579.0,180.9 579.0,189.1" fill="#C2185B"/><line x1="685" y1="222" x2="685.0" y2="389.0" stroke="#E07B00" stroke-width="2.4"/><polygon points="685.0,398.0 689.0,389.0 681.0,389.0" fill="#E07B00"/><line x1="588" y1="435" x2="531.0" y2="435.0" stroke="#E07B00" stroke-width="2.4"/><polygon points="522.0,435.0 531.0,439.1 531.0,430.9" fill="#E07B00"/><line x1="425" y1="398" x2="425.0" y2="231.0" stroke="#1565C0" stroke-width="2.4"/><polygon points="425.0,222.0 420.9,231.0 429.1,231.0" fill="#1565C0"/><circle cx="505" cy="185" r="11" fill="#FFFFFF" stroke="#6420B8" stroke-width="2"/><text x="505.0" y="175.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" fill="#6420B8" font-weight="bold">2</text><circle cx="685" cy="320" r="11" fill="#FFFFFF" stroke="#6420B8" stroke-width="2"/><text x="701.0" y="324.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" fill="#6420B8" font-weight="bold">3</text><circle cx="505" cy="435" r="11" fill="#FFFFFF" stroke="#6420B8" stroke-width="2"/><text x="505.0" y="455.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" fill="#6420B8" font-weight="bold">4</text><circle cx="425" cy="320" r="11" fill="#FFFFFF" stroke="#6420B8" stroke-width="2"/><text x="409.0" y="324.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" fill="#6420B8" font-weight="bold">1</text><text x="555.0" y="211.5" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" fill="#C2185B" font-weight="bold">hot gas</text><text x="700.0" y="271.5" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#E07B00" font-weight="bold">liquid</text><text x="556.0" y="449.0" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" fill="#E07B00" font-weight="bold">wet</text><text x="556.0" y="462.0" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" fill="#E07B00" font-weight="bold">vapour</text><text x="410.0" y="271.5" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="end" fill="#1565C0" font-weight="bold">cold vapour</text><line x1="258" y1="185" x2="320.0" y2="185.0" stroke="#2E7D32" stroke-width="2.6"/><polygon points="328.0,185.0 320.0,181.4 320.0,188.6" fill="#2E7D32"/><text x="252.0" y="189.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="end" fill="#2E7D32" font-weight="bold">W in</text><line x1="685" y1="148" x2="685.0" y2="104.0" stroke="#C2185B" stroke-width="2.6"/><polygon points="685.0,96.0 681.4,104.0 688.6,104.0" fill="#C2185B"/><text x="700.0" y="126.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#C2185B" font-weight="bold">Q_H rejected at T_H</text><text x="373.0" y="494.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" fill="#1565C0" font-weight="bold">COLD SPACE at T_C</text><line x1="373" y1="550" x2="373.0" y2="508.0" stroke="#1565C0" stroke-width="2.4"/><polygon points="373.0,500.0 369.4,508.0 376.6,508.0" fill="#1565C0"/><text x="386.0" y="531.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#1565C0" font-weight="bold">Q_C from the space being cooled</text><rect x="0" y="560" width="960" height="34" rx="0" fill="#EADDF7" stroke="none" stroke-width="0"/><text x="18.0" y="582.9" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#6420B8" font-weight="bold">ENERGY:  Q_H = Q_C + W</text><text x="30.0" y="616.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#222222" font-weight="normal">The same kilogram of refrigerant goes round for ever; work enters only at the compressor and leaves only as heat at the condenser.</text><text x="24.0" y="636.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#6B6275" font-weight="normal">Original teaching schematic • conceptual, not a construction/operating drawing</text></svg>