<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 640" font-family="Arial, Helvetica, sans-serif"><rect width="940" height="640" fill="#ffffff"/><text x="24.0" y="36.6" font-family="Arial, Helvetica, sans-serif" font-size="19" text-anchor="start" fill="#6420B8" font-weight="bold">The same Carnot cycle on a T–S diagram</text><line x1="170" y1="450" x2="662.0" y2="450.0" stroke="#222222" stroke-width="1.6"/><polygon points="670.0,450.0 662.0,446.4 662.0,453.6" fill="#222222"/><line x1="170" y1="450" x2="170.0" y2="128.0" stroke="#222222" stroke-width="1.6"/><polygon points="170.0,120.0 166.4,128.0 173.6,128.0" fill="#222222"/><text x="420.0" y="488.4" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" fill="#222222" font-weight="bold">entropy  S  →</text><text x="98.0" y="289.4" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" fill="#222222" font-weight="bold">temperature  T  →</text><line x1="295.0" y1="450" x2="295.0" y2="456" stroke="#222222" stroke-width="1.2"/><text x="295.0" y="469.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#6B6275" font-weight="normal">0.25</text><line x1="420.0" y1="450" x2="420.0" y2="456" stroke="#222222" stroke-width="1.2"/><text x="420.0" y="469.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#6B6275" font-weight="normal">0.5</text><line x1="545.0" y1="450" x2="545.0" y2="456" stroke="#222222" stroke-width="1.2"/><text x="545.0" y="469.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#6B6275" font-weight="normal">0.75</text><line x1="670.0" y1="450" x2="670.0" y2="456" stroke="#222222" stroke-width="1.2"/><text x="670.0" y="469.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#6B6275" font-weight="normal">1.0</text><line x1="164" y1="318.0" x2="170" y2="318.0" stroke="#222222" stroke-width="1.2"/><text x="158.0" y="321.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="end" fill="#6B6275" font-weight="normal">0.4</text><line x1="164" y1="252.0" x2="170" y2="252.0" stroke="#222222" stroke-width="1.2"/><text x="158.0" y="255.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="end" fill="#6B6275" font-weight="normal">0.6</text><line x1="164" y1="186.0" x2="170" y2="186.0" stroke="#222222" stroke-width="1.2"/><text x="158.0" y="189.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="end" fill="#6B6275" font-weight="normal">0.8</text><line x1="164" y1="120.0" x2="170" y2="120.0" stroke="#222222" stroke-width="1.2"/><text x="158.0" y="123.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="end" fill="#6B6275" font-weight="normal">1.0</text><line x1="270.0" y1="136.5" x2="570.0" y2="136.5" stroke="#C2185B" stroke-width="2.8"/><line x1="570.0" y1="136.5" x2="570.0" y2="301.5" stroke="#E07B00" stroke-width="2.8"/><line x1="570.0" y1="301.5" x2="270.0" y2="301.5" stroke="#1565C0" stroke-width="2.8"/><line x1="270.0" y1="301.5" x2="270.0" y2="136.5" stroke="#E07B00" stroke-width="2.8"/><polygon points="270.0,136.5 570.0,136.5 570.0,301.5 270.0,301.5" fill="#EFE4FB" stroke="none" stroke-width="0"/><circle cx="270.0" cy="136.5" r="7" fill="#FFFFFF" stroke="#6420B8" stroke-width="2.2"/><text x="254.0" y="144.9" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="end" fill="#6420B8" font-weight="bold">1</text><circle cx="570.0" cy="136.5" r="7" fill="#FFFFFF" stroke="#6420B8" stroke-width="2.2"/><text x="584.0" y="144.9" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" fill="#6420B8" font-weight="bold">2</text><circle cx="570.0" cy="301.5" r="7" fill="#FFFFFF" stroke="#6420B8" stroke-width="2.2"/><text x="584.0" y="309.9" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" fill="#6420B8" font-weight="bold">3</text><circle cx="270.0" cy="301.5" r="7" fill="#FFFFFF" stroke="#6420B8" stroke-width="2.2"/><text x="254.0" y="309.9" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="end" fill="#6420B8" font-weight="bold">4</text><text x="420.0" y="124.3" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#C2185B" font-weight="bold">T_H = constant</text><text x="420.0" y="327.4" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#1565C0" font-weight="bold">T_C = constant</text><text x="420.0" y="223.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#6420B8" font-weight="bold">net work = shaded area</text><text x="420.0" y="242.8" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#222222" font-weight="normal">W = (T_H − T_C)(S₂ − S₁)</text><rect x="0" y="468" width="940" height="34" rx="0" fill="#EADDF7" stroke="none" stroke-width="0"/><text x="18.0" y="490.9" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#6420B8" font-weight="bold">THE RECTANGLE IS THE REASON</text><text x="30.0" y="524.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#222222" font-weight="normal">• Heat added at T_H is the area under 1→2:  Q_H = T_H (S₂ − S₁).</text><text x="30.0" y="547.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#222222" font-weight="normal">• Heat rejected at T_C is the area under 3→4:  Q_C = T_C (S₂ − S₁).</text><text x="30.0" y="570.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#222222" font-weight="normal">• Net work is the difference of the two rectangles, hence η = 1 − T_C/T_H.</text><text x="30.0" y="593.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#222222" font-weight="normal">• On this diagram a reversible cycle is a closed loop; the area inside it is the work.</text><text x="24.0" y="631.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#6B6275" font-weight="normal">Original teaching schematic • conceptual, not a construction/operating drawing</text></svg>