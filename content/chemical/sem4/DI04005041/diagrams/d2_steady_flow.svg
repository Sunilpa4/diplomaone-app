<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" font-family="Arial, Helvetica, sans-serif"><rect width="920" height="640" fill="#ffffff"/><text x="24.0" y="36.6" font-family="Arial, Helvetica, sans-serif" font-size="19" text-anchor="start" fill="#6420B8" font-weight="bold">Steady-flow energy equation across a control volume</text><rect x="330" y="150" width="260" height="250" rx="12" fill="#FBFAFE" stroke="#7B2CD9" stroke-width="2.2"/><text x="460.0" y="176.4" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" fill="#6420B8" font-weight="bold">CONTROL VOLUME</text><text x="460.0" y="195.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#6B6275" font-weight="normal">steady: no change with time</text><line x1="460" y1="150" x2="460" y2="330" stroke="#222222" stroke-width="1.8" stroke-dasharray="6 4"/><circle cx="460" cy="150" r="9" fill="#FFFFFF" stroke="#222222" stroke-width="1.8"/><text x="478.0" y="229.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#6B6275" font-weight="normal">shaft</text><line x1="120" y1="210" x2="317.0" y2="210.0" stroke="#6420B8" stroke-width="2.4"/><polygon points="326.0,210.0 317.0,205.9 317.0,214.1" fill="#6420B8"/><text x="150.0" y="196.0" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" text-anchor="start" fill="#2E7D32" font-weight="bold">m_in ,  h_in ,  c_in ,  z_in</text><text x="150.0" y="235.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#6B6275" font-weight="normal">state 1</text><line x1="594" y1="340" x2="791.0" y2="340.0" stroke="#6420B8" stroke-width="2.4"/><polygon points="800.0,340.0 791.0,335.9 791.0,344.1" fill="#6420B8"/><text x="636.0" y="326.0" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" text-anchor="start" fill="#C2185B" font-weight="bold">m_out ,  h_out ,  c_out ,  z_out</text><text x="636.0" y="365.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#6B6275" font-weight="normal">state 2</text><line x1="220" y1="130" x2="318.0" y2="130.0" stroke="#E07B00" stroke-width="2.2"/><polygon points="326.0,130.0 318.0,126.4 318.0,133.6" fill="#E07B00"/><text x="150.0" y="121.8" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#E07B00" font-weight="bold">Q  (+ into the fluid)</text><line x1="460" y1="400" x2="460.0" y2="444.0" stroke="#1565C0" stroke-width="2.2"/><polygon points="460.0,452.0 463.6,444.0 456.4,444.0" fill="#1565C0"/><text x="472.0" y="435.9" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#1565C0" font-weight="bold">W_s  shaft work out</text><rect x="0" y="468" width="920" height="34" rx="0" fill="#EADDF7" stroke="none" stroke-width="0"/><text x="18.0" y="490.9" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#6420B8" font-weight="bold">ENERGY IN = ENERGY OUT  (steady state, no accumulation)</text><text x="30.0" y="524.9" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" text-anchor="start" fill="#6420B8" font-weight="bold">Q − W_s = m [ (h₂ − h₁) + ½(c₂² − c₁²) + g(z₂ − z₁) ]</text><text x="30.0" y="554.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#222222" font-weight="normal">per unit mass:   q − w_s = (h₂ − h₁) + ½(c₂² − c₁²) + g(z₂ − z₁)</text><text x="24.0" y="596.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#6B6275" font-weight="normal">Assumptions: steady flow, uniform properties at each section, no change of potential or kinetic energy neglected, single inlet and single outlet.</text><text x="24.0" y="631.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#6B6275" font-weight="normal">Original teaching schematic • conceptual, not a construction/operating drawing</text></svg>