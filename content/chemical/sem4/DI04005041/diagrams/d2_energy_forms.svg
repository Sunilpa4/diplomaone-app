<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" font-family="Arial, Helvetica, sans-serif"><rect width="920" height="540" fill="#ffffff"/><text x="24.0" y="36.6" font-family="Arial, Helvetica, sans-serif" font-size="19" text-anchor="start" fill="#6420B8" font-weight="bold">The energy account of a closed system</text><text x="24.0" y="78.4" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" fill="#6B6275" font-weight="normal">Total energy E = internal + kinetic + potential + other stored forms</text><rect x="300" y="120" width="320" height="300" rx="12" fill="#FBFAFE" stroke="#7B2CD9" stroke-width="2.2" stroke-dasharray="7 6"/><text x="460.0" y="150.6" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#6420B8" font-weight="bold">SYSTEM</text><text x="460.0" y="171.8" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#6B6275" font-weight="normal">mass m fixed</text><rect x="340" y="196" width="240" height="116" rx="10" fill="#FFFFFF" stroke="#B9A6CE" stroke-width="1.8"/><text x="460.0" y="226.4" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" fill="#6420B8" font-weight="bold">internal energy  U</text><text x="460.0" y="249.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#6B6275" font-weight="normal">sensible + latent + chemical</text><text x="460.0" y="271.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#6B6275" font-weight="normal">+ nuclear + electrical</text><text x="460.0" y="298.2" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" text-anchor="middle" fill="#222222" font-weight="normal">u = U/m   [kJ/kg]</text><rect x="340" y="326" width="116" height="74" rx="8" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.8"/><text x="398.0" y="352.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">kinetic</text><text x="398.0" y="376.2" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" text-anchor="middle" fill="#222222" font-weight="normal">½ m c²</text><text x="398.0" y="393.5" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" fill="#6B6275" font-weight="normal">velocity c</text><rect x="464" y="326" width="116" height="74" rx="8" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.8"/><text x="522.0" y="352.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" fill="#1565C0" font-weight="bold">potential</text><text x="522.0" y="376.2" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" text-anchor="middle" fill="#222222" font-weight="normal">m g z</text><text x="522.0" y="393.5" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" fill="#6B6275" font-weight="normal">height z</text><line x1="150" y1="180" x2="288.0" y2="180.0" stroke="#C2185B" stroke-width="2.2"/><polygon points="296.0,180.0 288.0,176.4 288.0,183.6" fill="#C2185B"/><text x="160.0" y="169.8" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#C2185B" font-weight="bold">Q  heat in (+) / out (−)</text><line x1="296" y1="380" x2="158.0" y2="380.0" stroke="#1565C0" stroke-width="2.2"/><polygon points="150.0,380.0 158.0,383.6 158.0,376.4" fill="#1565C0"/><text x="160.0" y="369.9" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#1565C0" font-weight="bold">W  work out (+) / in (−)</text><rect x="0" y="428" width="920" height="34" rx="0" fill="#EADDF7" stroke="none" stroke-width="0"/><text x="18.0" y="450.9" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#6420B8" font-weight="bold">FIRST LAW FOR A CLOSED SYSTEM BETWEEN TWO STATES</text><text x="30.0" y="487.2" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15" text-anchor="start" fill="#6420B8" font-weight="bold">Q − W = ΔU + Δ(KE) + Δ(PE)</text><text x="24.0" y="512.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#6B6275" font-weight="normal">ΔU is independent of the path; Q and W are not. Their difference is fixed.</text><text x="24.0" y="531.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#6B6275" font-weight="normal">Original teaching schematic • conceptual, not a construction/operating drawing</text></svg>