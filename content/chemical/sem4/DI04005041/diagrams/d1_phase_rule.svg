<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 610" font-family="Arial, Helvetica, sans-serif"><rect width="920" height="610" fill="#ffffff"/><text x="24.0" y="36.6" font-family="Arial, Helvetica, sans-serif" font-size="19" text-anchor="start" fill="#6420B8" font-weight="bold">Gibbs phase rule: degrees of freedom on a P–T diagram</text><line x1="170" y1="460" x2="732.0" y2="460.0" stroke="#222222" stroke-width="1.6"/><polygon points="740.0,460.0 732.0,456.4 732.0,463.6" fill="#222222"/><line x1="170" y1="460" x2="170.0" y2="118.0" stroke="#222222" stroke-width="1.6"/><polygon points="170.0,110.0 166.4,118.0 173.6,118.0" fill="#222222"/><text x="455.0" y="498.4" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" fill="#222222" font-weight="bold">temperature  T  →</text><text x="98.0" y="289.4" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" fill="#222222" font-weight="bold">P  →</text><line x1="312.5" y1="460" x2="312.5" y2="466" stroke="#222222" stroke-width="1.2"/><text x="312.5" y="479.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#6B6275" font-weight="normal">0.25</text><line x1="455.0" y1="460" x2="455.0" y2="466" stroke="#222222" stroke-width="1.2"/><text x="455.0" y="479.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#6B6275" font-weight="normal">0.5</text><line x1="597.5" y1="460" x2="597.5" y2="466" stroke="#222222" stroke-width="1.2"/><text x="597.5" y="479.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#6B6275" font-weight="normal">0.75</text><line x1="740.0" y1="460" x2="740.0" y2="466" stroke="#222222" stroke-width="1.2"/><text x="740.0" y="479.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#6B6275" font-weight="normal">1.0</text><line x1="164" y1="372.5" x2="170" y2="372.5" stroke="#222222" stroke-width="1.2"/><text x="158.0" y="376.2" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="end" fill="#6B6275" font-weight="normal">0.25</text><line x1="164" y1="285.0" x2="170" y2="285.0" stroke="#222222" stroke-width="1.2"/><text x="158.0" y="288.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="end" fill="#6B6275" font-weight="normal">0.5</text><line x1="164" y1="197.5" x2="170" y2="197.5" stroke="#222222" stroke-width="1.2"/><text x="158.0" y="201.2" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="end" fill="#6B6275" font-weight="normal">0.75</text><line x1="164" y1="110.0" x2="170" y2="110.0" stroke="#222222" stroke-width="1.2"/><text x="158.0" y="113.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="end" fill="#6B6275" font-weight="normal">1.0</text><line x1="198.5" y1="397.0" x2="409.4" y2="264.0" stroke="#7B2CD9" stroke-width="2.4"/><line x1="409.4" y1="264.0" x2="432.2" y2="110.0" stroke="#7B2CD9" stroke-width="2.4"/><line x1="409.4" y1="264.0" x2="740.0" y2="201.0" stroke="#7B2CD9" stroke-width="2.4"/><circle cx="409.4" cy="264.0" r="6" fill="#FFFFFF" stroke="#C2185B" stroke-width="2.4"/><text x="397.4" y="256.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="end" fill="#C2185B" font-weight="bold">triple point  3 phases  F = 0</text><text x="210.0" y="424.6" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#6420B8" font-weight="bold">solid</text><text x="690.0" y="444.6" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#6420B8" font-weight="bold">vapour</text><text x="320.0" y="219.6" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#6420B8" font-weight="bold">liquid</text><rect x="0" y="510" width="920" height="34" rx="0" fill="#EADDF7" stroke="none" stroke-width="0"/><text x="18.0" y="532.9" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#6420B8" font-weight="bold">F = C − P + 2     (C = components,  P = phases present)</text><rect x="30" y="546" width="288" height="46" rx="6" fill="#FFFFFF" stroke="#B9A6CE" stroke-width="1.8"/><text x="42.0" y="561.9" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#6420B8" font-weight="bold">single phase region  (P = 1)  →  F = 2</text><text x="42.0" y="581.5" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#6B6275" font-weight="normal">both T and P may be chosen</text><rect x="330" y="546" width="288" height="46" rx="6" fill="#FFFFFF" stroke="#B9A6CE" stroke-width="1.8"/><text x="342.0" y="561.9" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#6420B8" font-weight="bold">on a curve  (P = 2)  →  F = 1</text><text x="342.0" y="581.5" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#6B6275" font-weight="normal">one degree of freedom (e.g. boiling T fixes P)</text><rect x="630" y="546" width="288" height="46" rx="6" fill="#FFFFFF" stroke="#B9A6CE" stroke-width="1.8"/><text x="642.0" y="561.9" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#6420B8" font-weight="bold">at the triple point  (P = 3)  →  F = 0</text><text x="642.0" y="581.5" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#6B6275" font-weight="normal">fixed T and P, no choice</text><text x="24.0" y="601.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#6B6275" font-weight="normal">Original teaching schematic • conceptual, not a construction/operating drawing</text></svg>