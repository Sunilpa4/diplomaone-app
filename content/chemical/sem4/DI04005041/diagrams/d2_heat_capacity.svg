stroke-width="1.2"/><text x="158.0" y="363.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="end" fill="#6B6275" font-weight="normal">0.25</text><line x1="164" y1="280.0" x2="170" y2="280.0" stroke="#222222" stroke-width="1.2"/><text x="158.0" y="283.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="end" fill="#6B6275" font-weight="normal">0.5</text><line x1="164" y1="200.0" x2="170" y2="200.0" stroke="#222222" stroke-width="1.2"/><text x="158.0" y="203.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="end" fill="#6B6275" font-weight="normal">0.75</text><line x1="164" y1="120.0" x2="170" y2="120.0" stroke="#222222" stroke-width="1.2"/><text x="158.0" y="123.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="end" fill="#6B6275" font-weight="normal">1.0</text><line x1="170.0" y1="424.0" x2="690.0" y2="264.0" stroke="#7B2CD9" stroke-width="2.6"/><line x1="170.0" y1="424.0" x2="690.0" y2="184.0" stroke="#1565C0" stroke-width="2.6"/><text x="492.4" y="328.8" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#7B2CD9" font-weight="bold">slope = c_v</text><text x="456.0" y="213.6" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#1565C0" font-weight="bold">slope = c_p</text><rect x="0" y="494" width="900" height="34" rx="0" fill="#EADDF7" stroke="none" stroke-width="0"/><text x="18.0" y="516.9" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#6420B8" font-weight="bold">WHY c_p IS ALWAYS BIGGER THAN c_v FOR A GAS</text><text x="30.0" y="550.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#222222" font-weight="normal">At constant volume all the heat raises the temperature (and pressure).</text><text x="30.0" y="572.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#222222" font-weight="normal">At constant pressure the gas also expands, so part of the heat leaves as work.</text><text x="30.0" y="611.6" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16" text-anchor="start" fill="#6420B8" font-weight="bold">c_p − c_v = R</text><text x="250.0" y="610.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#222222" font-weight="normal">(ideal gas, per mole;   c_p / c_v = γ)</text><text x="24.0" y="651.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#6B6275" font-weight="normal">Original teaching schematic • conceptual, not a construction/operating drawing</text></svg>