<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="Arial, Helvetica, sans-serif"><rect width="960" height="640" fill="#ffffff"/><text x="24.0" y="36.6" font-family="Arial, Helvetica, sans-serif" font-size="19" text-anchor="start" fill="#6420B8" font-weight="bold">Choosing a refrigerant: the five things that decide it</text><rect x="40" y="86" width="880" height="78" rx="10" fill="#FFFFFF" stroke="#B9A6CE" stroke-width="1.4"/><rect x="40" y="86" width="7" height="78" rx="3" fill="#C2185B" stroke="none" stroke-width="0"/><text x="66.0" y="116.5" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#C2185B" font-weight="bold">Pressure range</text><text x="66.0" y="142.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#222222" font-weight="normal">P_H must be modest so the condenser wall stays thin; P_C must stay above atmospheric so air cannot leak in.</text><rect x="40" y="182" width="880" height="78" rx="10" fill="#FFFFFF" stroke="#B9A6CE" stroke-width="1.4"/><rect x="40" y="182" width="7" height="78" rx="3" fill="#2E7D32" stroke="none" stroke-width="0"/><text x="66.0" y="212.6" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#2E7D32" font-weight="bold">Latent heat</text><text x="66.0" y="238.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#222222" font-weight="normal">A high latent heat means a small circulation rate and a small compressor for the same duty.</text><rect x="40" y="278" width="880" height="78" rx="10" fill="#FFFFFF" stroke="#B9A6CE" stroke-width="1.4"/><rect x="40" y="278" width="7" height="78" rx="3" fill="#E07B00" stroke="none" stroke-width="0"/><text x="66.0" y="308.6" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#E07B00" font-weight="bold">Toxicity and flammability</text><text x="66.0" y="334.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#222222" font-weight="normal">Safety class A1 is the goal; ammonia is B2L, hydrocarbons are A3.</text><rect x="40" y="374" width="880" height="78" rx="10" fill="#FFFFFF" stroke="#B9A6CE" stroke-width="1.4"/><rect x="40" y="374" width="7" height="78" rx="3" fill="#1565C0" stroke="none" stroke-width="0"/><text x="66.0" y="404.6" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#1565C0" font-weight="bold">Environmental impact</text><text x="66.0" y="430.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#222222" font-weight="normal">ODP must be zero (Montreal) and GWP low (Kyoto / Kigali).</text><rect x="40" y="470" width="880" height="78" rx="10" fill="#FFFFFF" stroke="#B9A6CE" stroke-width="1.4"/><rect x="40" y="470" width="7" height="78" rx="3" fill="#6420B8" stroke="none" stroke-width="0"/><text x="66.0" y="500.6" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#6420B8" font-weight="bold">Cost and availability</text><text x="66.0" y="526.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#222222" font-weight="normal">Must be cheap, stable, non-corrosive and easy to recover and recycle.</text><rect x="0" y="552" width="960" height="34" rx="0" fill="#EADDF7" stroke="none" stroke-width="0"/><text x="18.0" y="574.9" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#6420B8" font-weight="bold">THE CODING SYSTEM</text><text x="40.0" y="604.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#6420B8" font-weight="bold">R-134a  =  CH₂FCF₃:  R = refrigerant, 1 = 1 C, 3 = 3 F, 4 = 4 H, a = isomer suffix.   R-717 = NH₃.   R-744 = CO₂.</text><text x="24.0" y="631.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#6B6275" font-weight="normal">Original teaching schematic • conceptual, not a construction/operating drawing</text></svg>