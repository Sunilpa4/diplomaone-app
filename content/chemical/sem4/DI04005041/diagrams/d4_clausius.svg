<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 640" font-family="Arial, Helvetica, sans-serif"><rect width="940" height="640" fill="#ffffff"/><text x="24.0" y="36.6" font-family="Arial, Helvetica, sans-serif" font-size="19" text-anchor="start" fill="#6420B8" font-weight="bold">Entropy generation and the Clausius inequality</text><text x="24.0" y="80.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#6B6275" font-weight="normal">∮ δQ/T ≤ 0 for any cycle:  equality for reversible, less than zero for real cycles</text><rect x="40" y="120" width="400" height="120" rx="10" fill="#F8FDF9" stroke="#2E7D32" stroke-width="1.8"/><text x="60.0" y="152.4" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" fill="#2E7D32" font-weight="bold">REVERSIBLE</text><text x="60.0" y="181.2" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" fill="#6420B8" font-weight="bold">∮ δQ/T = 0</text><text x="60.0" y="207.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#6B6275" font-weight="normal">no entropy is generated inside the system</text><text x="60.0" y="227.8" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#222222" font-weight="normal">S₂ − S₁ = ∫ δQ_rev / T</text><rect x="480" y="120" width="420" height="120" rx="10" fill="#FEF8F8" stroke="#C2185B" stroke-width="1.8"/><text x="500.0" y="152.4" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" fill="#C2185B" font-weight="bold">IRREVERSIBLE (every real cycle)</text><text x="500.0" y="181.2" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" fill="#6420B8" font-weight="bold">∮ δQ/T &lt; 0</text><text x="500.0" y="207.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#6B6275" font-weight="normal">entropy is generated: S_gen &gt; 0</text><text x="500.0" y="227.8" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#222222" font-weight="normal">S₂ − S₁ = ∫ δQ/T + S_gen</text><rect x="0" y="250" width="940" height="34" rx="0" fill="#EADDF7" stroke="none" stroke-width="0"/><text x="18.0" y="272.9" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#6420B8" font-weight="bold">WHERE THE ENTROPY COMES FROM</text><rect x="40" y="290" width="6" height="16" rx="0" fill="#C2185B" stroke="none" stroke-width="0"/><text x="56.0" y="306.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#C2185B" font-weight="bold">friction</text><text x="56.0" y="323.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#6B6275" font-weight="normal">mechanical work turns into heat inside the fluid</text><rect x="500" y="290" width="6" height="16" rx="0" fill="#C2185B" stroke="none" stroke-width="0"/><text x="516.0" y="306.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#C2185B" font-weight="bold">unrestrained expansion</text><text x="516.0" y="323.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#6B6275" font-weight="normal">a gas rushing into vacuum creates entropy</text><rect x="40" y="334" width="6" height="16" rx="0" fill="#C2185B" stroke="none" stroke-width="0"/><text x="56.0" y="350.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#C2185B" font-weight="bold">heat across a finite ΔT</text><text x="56.0" y="367.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#6B6275" font-weight="normal">the classic irreversibility in any exchanger</text><rect x="500" y="334" width="6" height="16" rx="0" fill="#C2185B" stroke="none" stroke-width="0"/><text x="516.0" y="350.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#C2185B" font-weight="bold">mixing of two streams</text><text x="516.0" y="367.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#6B6275" font-weight="normal">different compositions blend irreversibly</text><rect x="40" y="378" width="6" height="16" rx="0" fill="#C2185B" stroke="none" stroke-width="0"/><text x="56.0" y="394.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#C2185B" font-weight="bold">electrical resistance</text><text x="56.0" y="411.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#6B6275" font-weight="normal">all the electrical work becomes heat</text><rect x="500" y="378" width="6" height="16" rx="0" fill="#C2185B" stroke="none" stroke-width="0"/><text x="516.0" y="394.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#C2185B" font-weight="bold">chemical reaction</text><text x="516.0" y="411.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#6B6275" font-weight="normal">reaction at a finite rate always generates entropy</text><rect x="0" y="474" width="940" height="34" rx="0" fill="#EADDF7" stroke="none" stroke-width="0"/><text x="18.0" y="496.9" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#6420B8" font-weight="bold">THE THREE STATEMENTS ARE THE SAME LAW</text><text x="40.0" y="530.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#222222" font-weight="normal">Kelvin–Planck: no engine can convert all the heat from one reservoir into work.</text><text x="40.0" y="554.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#222222" font-weight="normal">Clausius: heat cannot flow by itself from a colder to a hotter body.</text><text x="40.0" y="578.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#6420B8" font-weight="bold">Entropy: the entropy of the universe never decreases.   ΔS_universe ≥ 0</text><text x="24.0" y="631.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#6B6275" font-weight="normal">Original teaching schematic • conceptual, not a construction/operating drawing</text></svg>