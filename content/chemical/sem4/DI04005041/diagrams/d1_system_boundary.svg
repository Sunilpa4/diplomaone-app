<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="Arial, Helvetica, sans-serif"><rect width="920" height="560" fill="#ffffff"/><text x="24.0" y="36.6" font-family="Arial, Helvetica, sans-serif" font-size="19" text-anchor="start" fill="#6420B8" font-weight="bold">System, surroundings and the three classes of boundary</text><text x="24.0" y="78.4" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" fill="#6B6275" font-weight="normal">The boundary is drawn where the analysis needs it; everything outside it is the surroundings.</text><rect x="24" y="110" width="276" height="330" rx="10" fill="#FFFFFF" stroke="#B9A6CE" stroke-width="1.6"/><text x="162.0" y="140.6" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#6420B8" font-weight="bold">CLOSED SYSTEM</text><text x="162.0" y="159.8" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#6B6275" font-weight="normal">fixed mass, energy crosses</text><rect x="322" y="110" width="276" height="330" rx="10" fill="#FFFFFF" stroke="#B9A6CE" stroke-width="1.6"/><text x="460.0" y="140.6" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#6420B8" font-weight="bold">OPEN SYSTEM (control volume)</text><text x="460.0" y="159.8" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#6B6275" font-weight="normal">mass and energy cross</text><rect x="620" y="110" width="276" height="330" rx="10" fill="#FFFFFF" stroke="#B9A6CE" stroke-width="1.6"/><text x="758.0" y="140.6" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#6420B8" font-weight="bold">ISOLATED SYSTEM</text><text x="758.0" y="159.8" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#6B6275" font-weight="normal">no mass, no energy crosses</text><rect x="98" y="188" width="128" height="176" rx="6" fill="#FFFFFF" stroke="#7B2CD9" stroke-width="1.8"/><line x1="98" y1="191" x2="226" y2="191" stroke="#B9A6CE" stroke-width="1.2"/><line x1="44" y1="260" x2="84.0" y2="260.0" stroke="#C2185B" stroke-width="2.2"/><polygon points="92.0,260.0 84.0,256.4 84.0,263.6" fill="#C2185B"/><text x="64.0" y="251.8" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#6B6275" font-weight="bold">Q</text><text x="162.0" y="394.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" fill="#222222" font-weight="normal">gas  m = constant</text><text x="162.0" y="413.9" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#6B6275" font-weight="normal">piston or rigid wall</text><rect x="396" y="198" width="128" height="166" rx="6" fill="#FFFFFF" stroke="#7B2CD9" stroke-width="1.8"/><line x1="396" y1="201" x2="524" y2="201" stroke="#B9A6CE" stroke-width="1.2"/><line x1="356" y1="172" x2="356" y2="226" stroke="#6420B8" stroke-width="2.4"/><line x1="356" y1="226" x2="413.0" y2="226.0" stroke="#6420B8" stroke-width="2.4"/><polygon points="422.0,226.0 413.0,221.9 413.0,230.1" fill="#6420B8"/><text x="330.0" y="162.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#6420B8" font-weight="bold">in</text><line x1="504" y1="330" x2="563.0" y2="330.0" stroke="#6420B8" stroke-width="2.4"/><polygon points="572.0,330.0 563.0,325.9 563.0,334.1" fill="#6420B8"/><text x="528.0" y="312.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#6420B8" font-weight="bold">out</text><line x1="382" y1="378" x2="426.0" y2="378.0" stroke="#C2185B" stroke-width="2.0"/><polygon points="434.0,378.0 426.0,374.4 426.0,381.6" fill="#C2185B"/><text x="400.0" y="369.9" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#6B6275" font-weight="bold">Q</text><line x1="536" y1="378" x2="583.1176677309267" y2="405.9215808775861" stroke="#1565C0" stroke-width="2.0"/><polygon points="590.0,410.0 585.0,402.8 581.3,409.0" fill="#1565C0"/><text x="566.0" y="371.9" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#6B6275" font-weight="bold">W</text><text x="460.0" y="415.9" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#6B6275" font-weight="normal">control volume</text><rect x="660" y="172" width="196" height="190" rx="8" fill="#FFFFFF" stroke="#6420B8" stroke-width="2.4" stroke-dasharray="7 6"/><circle cx="758" cy="267" r="46" fill="#EADDF7" stroke="#7B2CD9" stroke-width="2"/><text x="758.0" y="266.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" fill="#6420B8" font-weight="bold">hot body +</text><text x="758.0" y="284.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" fill="#6420B8" font-weight="bold">cold body</text><text x="758.0" y="396.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" fill="#222222" font-weight="normal">no heat, no work, no mass</text><text x="758.0" y="415.9" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#6B6275" font-weight="normal">state may still change inside</text><rect x="0" y="468" width="920" height="34" rx="0" fill="#EADDF7" stroke="none" stroke-width="0"/><text x="18.0" y="490.9" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#6420B8" font-weight="bold">SURROUNDINGS  —  everything not inside the boundary</text><text x="24.0" y="532.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#6B6275" font-weight="normal">Boundary may be real (vessel wall) or imaginary (a section of pipe). It may be fixed or moving (piston face).</text><text x="24.0" y="551.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#6B6275" font-weight="normal">Original teaching schematic • conceptual, not a construction/operating drawing</text></svg>