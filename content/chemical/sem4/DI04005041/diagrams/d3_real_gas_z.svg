"/><line x1="558.25" y1="171.09987170192693" x2="565.0" y2="166.7630550392212" stroke="#7B2CD9" stroke-width="2.6"/><line x1="565.0" y1="166.7630550392212" x2="571.75" y2="162.21652453517368" stroke="#7B2CD9" stroke-width="2.6"/><line x1="571.75" y1="162.21652453517368" x2="578.5" y2="157.45812819707376" stroke="#7B2CD9" stroke-width="2.6"/><line x1="578.5" y1="157.45812819707376" x2="585.25" y2="152.4856927595734" stroke="#7B2CD9" stroke-width="2.6"/><line x1="585.25" y1="152.4856927595734" x2="592.0" y2="147.2970238226165" stroke="#7B2CD9" stroke-width="2.6"/><line x1="592.0" y1="147.2970238226165" x2="598.75" y2="141.8899059862881" stroke="#7B2CD9" stroke-width="2.6"/><line x1="598.75" y1="141.8899059862881" x2="605.5" y2="136.26210298269922" stroke="#7B2CD9" stroke-width="2.6"/><line x1="605.5" y1="136.26210298269922" x2="612.25" y2="130.41135780501696" stroke="#7B2CD9" stroke-width="2.6"/><line x1="612.25" y1="130.41135780501696" x2="619.0" y2="124.33539283374512" stroke="#7B2CD9" stroke-width="2.6"/><line x1="619.0" y1="124.33539283374512" x2="625.75" y2="118.03190996035295" stroke="#7B2CD9" stroke-width="2.6"/><line x1="625.75" y1="118.03190996035295" x2="632.5" y2="111.49859070834754" stroke="#7B2CD9" stroke-width="2.6"/><line x1="632.5" y1="111.49859070834754" x2="639.25" y2="104.7330963518778" stroke="#7B2CD9" stroke-width="2.6"/><line x1="639.25" y1="104.7330963518778" x2="646.0" y2="97.73306803195607" stroke="#7B2CD9" stroke-width="2.6"/><line x1="646.0" y1="97.73306803195607" x2="652.75" y2="90.49612687037796" stroke="#7B2CD9" stroke-width="2.6"/><line x1="652.75" y1="90.49612687037796" x2="659.5" y2="83.01987408141724" stroke="#7B2CD9" stroke-width="2.6"/><line x1="659.5" y1="83.01987408141724" x2="666.25" y2="75.30189108136915" stroke="#7B2CD9" stroke-width="2.6"/><line x1="666.25" y1="75.30189108136915" x2="673.0" y2="67.3397395960132" stroke="#7B2CD9" stroke-width="2.6"/><line x1="673.0" y1="67.3397395960132" x2="679.75" y2="59.13096176606069" stroke="#7B2CD9" stroke-width="2.6"/><line x1="679.75" y1="59.13096176606069" x2="686.5" y2="50.67308025065279" stroke="#7B2CD9" stroke-width="2.6"/><line x1="686.5" y1="50.67308025065279" x2="693.25" y2="41.96359832896803" stroke="#7B2CD9" stroke-width="2.6"/><line x1="693.25" y1="41.96359832896803" x2="700.0" y2="33.0" stroke="#7B2CD9" stroke-width="2.6"/><text x="300.4" y="231.2" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#C2185B" font-weight="bold">attraction dominates</text><text x="300.4" y="239.5" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" fill="#C2185B" font-weight="normal">Z &lt; 1  — volume smaller than ideal</text><text x="602.8" y="55.5" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">repulsion dominates</text><text x="602.8" y="69.7" font-family="Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="middle" fill="#2E7D32" font-weight="normal">Z &gt; 1 — molecular volume matters</text><rect x="0" y="460" width="920" height="34" rx="0" fill="#EADDF7" stroke="none" stroke-width="0"/><text x="18.0" y="482.9" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#6420B8" font-weight="bold">THE TWO COMPETING EFFECTS</text><text x="30.0" y="516.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#222222" font-weight="normal">Attraction between molecules pulls them together, so the measured volume is smaller than the ideal value and Z falls below 1.</text><text x="30.0" y="540.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#222222" font-weight="normal">At high pressure the molecules themselves occupy volume, leaving less free space, so Z rises above 1.</text><text x="30.0" y="570.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#6B6275" font-weight="normal">At very low pressure both effects vanish and Z → 1: the gas behaves ideally.</text><text x="30.0" y="621.2" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15" text-anchor="start" fill="#6420B8" font-weight="bold">Z = P V / R T   =   V_actual / V_ideal</text><text x="24.0" y="651.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#6B6275" font-weight="normal">Original teaching schematic • conceptual, not a construction/operating drawing</text></svg>