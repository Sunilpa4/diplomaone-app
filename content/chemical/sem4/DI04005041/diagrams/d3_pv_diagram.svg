" stroke="#7E57C2" stroke-width="2.4" stroke-dasharray="7 5"/><line x1="285.20000000000005" y1="186.0" x2="332.0" y2="219.00000000000003" stroke="#7E57C2" stroke-width="2.4" stroke-dasharray="7 5"/><line x1="332.0" y1="219.00000000000003" x2="378.8" y2="238.79999999999998" stroke="#7E57C2" stroke-width="2.4" stroke-dasharray="7 5"/><line x1="378.8" y1="238.79999999999998" x2="441.20000000000005" y2="285.0" stroke="#7E57C2" stroke-width="2.4" stroke-dasharray="7 5"/><line x1="441.20000000000005" y1="285.0" x2="534.8" y2="327.9" stroke="#7E57C2" stroke-width="2.4" stroke-dasharray="7 5"/><line x1="534.8" y1="327.9" x2="696.0" y2="370.8" stroke="#7E57C2" stroke-width="2.4" stroke-dasharray="7 5"/><line x1="202.0" y1="100.19999999999999" x2="264.4" y2="129.90000000000003" stroke="#2E7D32" stroke-width="2.2"/><line x1="264.4" y1="129.90000000000003" x2="347.6" y2="169.5" stroke="#2E7D32" stroke-width="2.2"/><line x1="347.6" y1="169.5" x2="451.59999999999997" y2="212.4" stroke="#2E7D32" stroke-width="2.2"/><line x1="451.59999999999997" y1="212.4" x2="576.4" y2="258.6" stroke="#2E7D32" stroke-width="2.2"/><line x1="576.4" y1="258.6" x2="711.6" y2="294.9" stroke="#2E7D32" stroke-width="2.2"/><circle cx="378.8" cy="238.79999999999998" r="6" fill="#FFFFFF" stroke="#C2185B" stroke-width="2.4"/><text x="364.8" y="232.8" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="end" fill="#C2185B" font-weight="bold">critical point C</text><text x="204.6" y="256.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#6420B8" font-weight="bold">liquid</text><text x="399.6" y="345.1" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" fill="#C2185B" font-weight="bold">two-phase</text><text x="399.6" y="352.7" font-family="Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="middle" fill="#C2185B" font-weight="normal">liquid + vapour</text><text x="524.4" y="190.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" fill="#6420B8" font-weight="bold">superheated vapour</text><text x="493.2" y="156.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">supercritical fluid</text><rect x="686" y="130" width="240" height="126" rx="6" fill="#FFFFFF" stroke="#B9A6CE" stroke-width="1.8"/><line x1="700" y1="150" x2="730" y2="150" stroke="#7B2CD9" stroke-width="2.6"/><text x="740.0" y="153.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#222222" font-weight="normal">T₁ &lt; Tc</text><line x1="700" y1="171" x2="730" y2="171" stroke="#1565C0" stroke-width="2.6"/><text x="740.0" y="174.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#222222" font-weight="normal">T₂ &lt; Tc</text><line x1="700" y1="192" x2="730" y2="192" stroke="#7E57C2" stroke-width="2.6"/><text x="740.0" y="195.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#222222" font-weight="normal">T₃ = Tc</text><line x1="700" y1="213" x2="730" y2="213" stroke="#2E7D32" stroke-width="2.6"/><text x="740.0" y="216.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#222222" font-weight="normal">T₄ &gt; Tc</text><line x1="700" y1="234" x2="730" y2="234" stroke="#C2185B" stroke-width="2.6"/><text x="740.0" y="237.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#222222" font-weight="normal">saturation dome</text><rect x="0" y="498" width="960" height="34" rx="0" fill="#EADDF7" stroke="none" stroke-width="0"/><text x="18.0" y="520.9" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#6420B8" font-weight="bold">READING THE DIAGRAM</text><text x="30.0" y="554.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#222222" font-weight="normal">• Below Tc every isotherm has a flat plateau where liquid and vapour coexist.</text><text x="30.0" y="577.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#222222" font-weight="normal">• The plateau shortens as T rises and vanishes at C, where the two phases become identical.</text><text x="30.0" y="600.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#222222" font-weight="normal">• Above Tc no phase change occurs: the substance is a supercritical fluid.</text><text x="30.0" y="623.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#222222" font-weight="normal">• The dashed dome joins the plateau ends — left line saturated liquid, right line saturated vapour.</text><text x="24.0" y="651.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#6B6275" font-weight="normal">Original teaching schematic • conceptual, not a construction/operating drawing</text></svg>