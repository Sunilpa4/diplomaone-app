<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="Arial, Helvetica, sans-serif"><rect width="960" height="660" fill="#ffffff"/><text x="24.0" y="36.6" font-family="Arial, Helvetica, sans-serif" font-size="19" text-anchor="start" fill="#6420B8" font-weight="bold">The reversed Brayton (air) refrigeration cycle</text><text x="24.0" y="78.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#6B6275" font-weight="normal">The same four processes, but the working fluid is air and it never changes phase.</text><rect x="150" y="130" width="200" height="74" rx="8" fill="#EADDF7" stroke="#7B2CD9" stroke-width="1.8"/><text x="250.0" y="171.4" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" fill="#6420B8" font-weight="bold">compressor</text><rect x="610" y="130" width="200" height="74" rx="8" fill="#FCE4EC" stroke="#C2185B" stroke-width="1.8"/><text x="710.0" y="171.4" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" fill="#C2185B" font-weight="bold">aftercooler</text><rect x="610" y="380" width="200" height="74" rx="8" fill="#EADDF7" stroke="#7B2CD9" stroke-width="1.8"/><text x="710.0" y="421.4" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" fill="#6420B8" font-weight="bold">expander / turbine</text><rect x="150" y="380" width="200" height="74" rx="8" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.8"/><text x="250.0" y="421.4" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" fill="#1565C0" font-weight="bold">cold chamber</text><line x1="350" y1="167" x2="600.0" y2="167.0" stroke="#2E7D32" stroke-width="2.2"/><polygon points="608.0,167.0 600.0,163.4 600.0,170.6" fill="#2E7D32"/><text x="479.0" y="153.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">high-pressure hot air</text><line x1="710" y1="204" x2="710.0" y2="370.0" stroke="#C2185B" stroke-width="2.2"/><polygon points="710.0,378.0 713.6,370.0 706.4,370.0" fill="#C2185B"/><text x="722.0" y="294.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#C2185B" font-weight="bold">cooled air, 25–40 °C</text><line x1="608" y1="417" x2="360.0" y2="417.0" stroke="#E07B00" stroke-width="2.2"/><polygon points="352.0,417.0 360.0,420.6 360.0,413.4" fill="#E07B00"/><text x="480.0" y="403.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#E07B00" font-weight="bold">cold air, −40 to −70 °C</text><line x1="250" y1="380" x2="250.0" y2="214.0" stroke="#1565C0" stroke-width="2.2"/><polygon points="250.0,206.0 246.4,214.0 253.6,214.0" fill="#1565C0"/><text x="238.0" y="296.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="end" fill="#1565C0" font-weight="bold">warm air back</text><line x1="710" y1="130" x2="710.0" y2="96.0" stroke="#C2185B" stroke-width="2.4"/><polygon points="710.0,88.0 706.4,96.0 713.6,96.0" fill="#C2185B"/><text x="724.0" y="111.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#C2185B" font-weight="bold">heat to atmosphere</text><line x1="250" y1="454" x2="250.0" y2="488.0" stroke="#1565C0" stroke-width="2.4"/><polygon points="250.0,496.0 253.6,488.0 246.4,488.0" fill="#1565C0"/><text x="250.0" y="531.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#1565C0" font-weight="bold">Q_C from the cold space</text><line x1="96" y1="167" x2="140.0" y2="167.0" stroke="#2E7D32" stroke-width="2.4"/><polygon points="148.0,167.0 140.0,163.4 140.0,170.6" fill="#2E7D32"/><text x="92.0" y="170.8" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="end" fill="#2E7D32" font-weight="bold">W in</text><line x1="812" y1="417" x2="768.0" y2="417.0" stroke="#E07B00" stroke-width="2.4"/><polygon points="760.0,417.0 768.0,420.6 768.0,413.4" fill="#E07B00"/><text x="816.0" y="414.9" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#E07B00" font-weight="bold">W out</text><text x="816.0" y="431.3" font-family="Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="start" fill="#6B6275" font-weight="normal">(recovered)</text><rect x="0" y="562" width="960" height="34" rx="0" fill="#EADDF7" stroke="none" stroke-width="0"/><text x="18.0" y="584.9" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#6420B8" font-weight="bold">WHERE IT IS USED AND WHY IT IS SO SIMPLE</text><text x="30.0" y="618.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#222222" font-weight="normal">No refrigerant, no phase change, so no charging or leak problem — hence aircraft cabin cooling. The price is a low COP at small temperature lifts.</text><text x="24.0" y="651.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#6B6275" font-weight="normal">Original teaching schematic • conceptual, not a construction/operating drawing</text></svg>