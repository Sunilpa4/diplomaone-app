<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="Arial, Helvetica, sans-serif"><rect width="880" height="420" fill="#ffffff"/><text x="24.0" y="36.6" font-family="Arial, Helvetica, sans-serif" font-size="19" text-anchor="start" fill="#6420B8" font-weight="bold">The zeroth law: thermal equilibrium is transitive</text><rect x="60" y="150" width="170" height="120" rx="14" fill="#FFFFFF" stroke="#C2185B" stroke-width="1.8"/><text x="145.0" y="195.1" font-family="Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" fill="#C2185B" font-weight="bold">A</text><text x="145.0" y="224.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#6B6275" font-weight="normal">hot</text><text x="145.0" y="248.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#222222" font-weight="bold">T</text><rect x="350" y="150" width="170" height="120" rx="14" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.8"/><text x="435.0" y="195.1" font-family="Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" fill="#1565C0" font-weight="bold">B</text><text x="435.0" y="224.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#6B6275" font-weight="normal">cold</text><text x="435.0" y="248.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#222222" font-weight="bold">T</text><rect x="640" y="150" width="170" height="120" rx="14" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.8"/><text x="725.0" y="195.1" font-family="Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" fill="#1565C0" font-weight="bold">C</text><text x="725.0" y="224.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#6B6275" font-weight="normal">cold</text><text x="725.0" y="248.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#222222" font-weight="bold">T</text><line x1="232" y1="210" x2="348" y2="210" stroke="#6420B8" stroke-width="2.2"/><text x="290.0" y="199.8" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#6420B8" font-weight="bold">diathermic</text><text x="290.0" y="235.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#6B6275" font-weight="normal">no heat flows</text><line x1="522" y1="210" x2="638" y2="210" stroke="#6420B8" stroke-width="2.2"/><text x="580.0" y="199.8" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#6420B8" font-weight="bold">diathermic</text><text x="580.0" y="235.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#6B6275" font-weight="normal">no heat flows</text><line x1="145" y1="150" x2="145" y2="90" stroke="#2E7D32" stroke-width="2.0"/><line x1="145" y1="90" x2="725" y2="90" stroke="#2E7D32" stroke-width="2.0"/><line x1="725" y1="90" x2="725.0" y2="142.0" stroke="#2E7D32" stroke-width="2.0"/><polygon points="725.0,150.0 728.6,142.0 721.4,142.0" fill="#2E7D32"/><text x="435.0" y="82.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">A and C also in equilibrium — no heat flows if they are joined</text><rect x="0" y="292" width="880" height="34" rx="0" fill="#EADDF7" stroke="none" stroke-width="0"/><text x="18.0" y="314.9" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#6420B8" font-weight="bold">CONSEQUENCE</text><text x="60.0" y="344.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#222222" font-weight="normal">Two bodies in thermal equilibrium with a third are in thermal equilibrium with each other.</text><text x="60.0" y="366.2" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#6420B8" font-weight="bold">Therefore a single property — temperature — can label the state, and a thermometer is possible.</text><text x="24.0" y="411.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#6B6275" font-weight="normal">Original teaching schematic • conceptual, not a construction/operating drawing</text></svg>