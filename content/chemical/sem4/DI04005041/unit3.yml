ans-serif" font-size="11.5" text-anchor="middle" fill="#6420B8" font-weight="bold">superheated vapour</text><text x="493.2" y="156.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">supercritical fluid</text><rect x="686" y="130" width="240" height="126" rx="6" fill="#FFFFFF" stroke="#B9A6CE" stroke-width="1.8"/><line x1="700" y1="150" x2="730" y2="150" stroke="#7B2CD9" stroke-width="2.6"/><text x="740.0" y="153.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#222222" font-weight="normal">T₁ &lt; Tc</text><line x1="700" y1="171" x2="730" y2="171" stroke="#1565C0" stroke-width="2.6"/><text x="740.0" y="174.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#222222" font-weight="normal">T₂ &lt; Tc</text><line x1="700" y1="192" x2="730" y2="192" stroke="#7E57C2" stroke-width="2.6"/><text x="740.0" y="195.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#222222" font-weight="normal">T₃ = Tc</text><line x1="700" y1="213" x2="730" y2="213" stroke="#2E7D32" stroke-width="2.6"/><text x="740.0" y="216.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#222222" font-weight="normal">T₄ &gt; Tc</text><line x1="700" y1="234" x2="730" y2="234" stroke="#C2185B" stroke-width="2.6"/><text x="740.0" y="237.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#222222" font-weight="normal">saturation dome</text><rect x="0" y="498" width="960" height="34" rx="0" fill="#EADDF7" stroke="none" stroke-width="0"/><text x="18.0" y="520.9" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#6420B8" font-weight="bold">READING THE DIAGRAM</text><text x="30.0" y="554.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#222222" font-weight="normal">• Below Tc every isotherm has a flat plateau where liquid and vapour coexist.</text><text x="30.0" y="577.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#222222" font-weight="normal">• The plateau shortens as T rises and vanishes at C, where the two phases become identical.</text><text x="30.0" y="600.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#222222" font-weight="normal">• Above Tc no phase change occurs: the substance is a supercritical fluid.</text><text x="30.0" y="623.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#222222" font-weight="normal">• The dashed dome joins the plateau ends — left line saturated liquid, right line saturated vapour.</text><text x="24.0" y="651.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#6B6275" font-weight="normal">Original teaching schematic • conceptual, not a construction/operating drawing</text></svg>
