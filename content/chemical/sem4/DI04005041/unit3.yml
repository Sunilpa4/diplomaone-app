- title:
    en: 3.2  The P–T diagram, triple and critical points
    gu: 3.2  P–T diagram, triple તથા critical points
  items:
  - h:
      en: The P–T diagram, triple point and critical point
      gu: P–T diagram, triple point તથા critical point
    body:
      en: |-
        <h4>Definition / principle</h4><p>The <b>P–T diagram</b> plots the phase boundaries of a pure substance in the pressure–temperature plane. Three curves meet at the <b>triple point</b>: the <b>sublimation</b> curve (solid–vapour), the <b>fusion</b> curve (solid–liquid) and the <b>vapour-pressure</b> curve (liquid–vapour), which ends at the <b>critical point</b>.</p><h4>Detailed theory and conditions</h4><p>Each curve carries one degree of freedom. On the vapour-pressure curve liquid and vapour coexist, so F = C − P + 2 = 1 − 2 + 2 = 1: a single choice (say the pressure of a boiler) fixes the boiling temperature. At the triple point all three phases coexist, F = 1 − 3 + 2 = 0, so for water it occurs at exactly 0.01 °C and 0.006 11 bar and cannot be shifted.<br><br>The fusion curve of water slopes <b>backwards</b> (negative slope), which is unusual: increasing the pressure on ice lowers its melting point, because ice is less dense than water. That is why a skater's blade melts a thin film under it. For almost every other substance the fusion curve slopes forward. The vapour-pressure curve ends at the critical point; beyond it the liquid and gas are indistinguishable and the term supercritical fluid is used.</p><h4>Equations and notation</h4><div class="math" data-tex="\ln\frac{P_2}{P_1}=-\frac{\Delta H_{vap}}{R}\left(\frac{1}{T_2}-\frac{1}{T_1}\right)" aria-label="\ln\frac{P_2}{P_1}=-\frac{\Delta H_{vap}}{R}\left(\frac{1}{T_2}-\frac{1}{T_1}\right)">Clausius–Clapeyron:  ln(P₂/P₁) = −(ΔH_vap/R)(1/T₂ − 1/T₁)</div><div class="math" data-tex="F=1" aria-label="F=1">on a boundary:  F = C − P + 2 = 1</div><div class="math" data-tex="F=0" aria-label="F=0">at the triple point:  F = 0</div><h4>Key points and data</h4><ul><li><b>Water:</b> triple point 0.01 °C, 0.006 11 bar; critical point 374.15 °C, 221.2 bar.</li><li><b>CO₂:</b> triple point −56.6 °C, 5.18 bar — solid CO₂ (dry ice) sublimes at atmospheric pressure, it never melts.</li><li><b>Clausius–Clapeyron</b> gives the slope of the vapour-pressure curve and is used to estimate boiling points at other pressures.</li><li><b>Supercritical CO₂</b> (above 31 °C, 73.8 bar) is used for decaffeination and dry-cleaning because it is a dense, tunable solvent.</li></ul><h4>Qualification</h4><p>The P–T diagram says nothing about volume or about how much of each phase is present — a point on the vapour-pressure line could be 1 % vapour or 99 % vapour. The P–V diagram or a quality value is needed for that.</p>
      gu: |-
        <h4>વ્યાખ્યા / સિદ્ધાંત</h4><p><b>P–T diagram</b> pure substance ની phase boundaries ને pressure–temperature plane માં દર્શાવે છે. ત્રણ curves <b>triple point</b> પર મળે છે: <b>sublimation</b> curve (solid–vapour), <b>fusion</b> curve (solid–liquid) અને <b>vapour-pressure</b> curve (liquid–vapour), જે <b>critical point</b> પર પૂરી થાય છે.</p><h4>વિગતવાર Theory તથા Conditions</h4><p>દરેક curve એક degree of freedom ધરાવે છે. vapour-pressure curve પર liquid તથા vapour સાથે રહે, તેથી F = C − P + 2 = 1 − 2 + 2 = 1: એક પસંદગી (જેમ કે boiler નું pressure) ઉકળવાનું temperature નિશ્ચિત કરે. triple point પર ત્રણેય phases સાથે રહે, F = 1 − 3 + 2 = 0, તેથી પાણી માટે તે બરાબર 0.01 °C તથા 0.006 11 bar પર થાય અને બદલી શકાય નહીં.<br><br>પાણીની fusion curve <b>પાછળ તરફ</b> ઢળે છે (ઋણ ઢોળાવ), જે અસામાન્ય છે: બરફ પર pressure વધારતાં તેનું melting point ઘટે છે, કારણ કે બરફ પાણી કરતાં ઓછા density નો છે. એટલે જ સ્કેટર ના બ્લેડ નીચે પાતળો પડ ઓગળે છે. લગભગ દરેક બીજા પદાર્થની fusion curve આગળ તરફ ઢળે છે. vapour-pressure curve critical point પર પૂરી થાય; તેની પાર liquid તથા gas અલગ ઓળખી શકાતા નથી અને supercritical fluid શબ્દ વપરાય છે.</p><h4>સમીકરણો તથા Notation</h4><div class="math" data-tex="\ln\frac{P_2}{P_1}=-\frac{\Delta H_{vap}}{R}\left(\frac{1}{T_2}-\frac{1}{T_1}\right)" aria-label="\ln\frac{P_2}{P_1}=-\frac{\Delta H_{vap}}{R}\left(\frac{1}{T_2}-\frac{1}{T_1}\right)">Clausius–Clapeyron:  ln(P₂/P₁) = −(ΔH_vap/R)(1/T₂ − 1/T₁)</div><div class="math" data-tex="F=1" aria-label="F=1">on a boundary:  F = C − P + 2 = 1</div><div class="math" data-tex="F=0" aria-label="F=0">at the triple point:  F = 0</div><h4>મુખ્ય મુદ્દા તથા data</h4><ul><li><b>Water:</b> triple point 0.01 °C, 0.006 11 bar; critical point 374.15 °C, 221.2 bar.</li><li><b>CO₂:</b> triple point −56.6 °C, 5.18 bar — solid CO₂ (dry ice) sublimes at atmospheric pressure, it never melts.</li><li><b>Clausius–Clapeyron</b> gives the slope of the vapour-pressure curve and is used to estimate boiling points at other pressures.</li><li><b>Supercritical CO₂</b> (above 31 °C, 73.8 bar) is used for decaffeination and dry-cleaning because it is a dense, tunable solvent.</li></ul><h4>નોંધ</h4><p>P–T diagram volume વિશે કે દરેક phase કેટલી છે તે વિશે કંઈ કહેતું નથી — vapour-pressure રેખા પરનું બિંદુ 1 % vapour કે 99 % vapour હોઈ શકે. તેના માટે P–V diagram કે quality ની કિંમત જોઈએ.</p>
- title:
    en: 3.3  Ideal gas and the equation of state
    gu: 3.3  Ideal gas તથા equation of state
  items:
  - h:
      en: Ideal gas and the equation of state
      gu: ideal gas તથા equation of state
    body:
      en: |-
        <h4>Definition / principle</h4><p>An <b>ideal gas</b> is a model in which molecules have negligible volume and exert no forces on one another except during elastic collisions. Its equation of state is <b>P V = n R T</b>, and it defines the gas constant R = 8.314 kJ/kmol·K = 0.287 kJ/kg·K for air.</p><h4>Detailed theory and conditions</h4><p>The model is the baseline against which every real fluid is judged, and its consequences are worth memorising because they cover most numericals. Internal energy and enthalpy depend on <b>temperature only</b> (Joule's law), so ΔU = m c<sub>v</sub> ΔT and ΔH = m c<sub>p</sub> ΔT for every path. At constant temperature P V is constant; at constant pressure V/T is constant; at constant volume P/T is constant.<br><br>The model is accurate at low pressure and high temperature, where molecules are far apart and their own volume and attraction hardly matter. It fails badly near the boiling point and near the critical point, which is exactly where real-gas corrections are needed. Always state the assumption 'behaves as an ideal gas' before using P V = n R T on a real substance.</p><h4>Equations and notation</h4><div class="math" data-tex="PV=nRT" aria-label="PV=nRT">P V = n R T        P v = R T        P V = m R T</div><div class="math" data-tex="R=8.314" aria-label="R=8.314">R = 8.314 kJ/kmol·K = 8.314 J/mol·K = 0.083 14 bar·m³/kmol·K</div><div class="math" data-tex="V_m=22.414\ \mathrm{m^3/kmol}" aria-label="V_m=22.414\ \mathrm{m^3/kmol}">at 1 atm, 0 °C:  1 kmol occupies 22.414 m³;  at 1 bar, 0 °C: 22.71 m³</div><h4>Key points and data</h4><ul><li><b>Boyle's law</b> (T, n constant): P V = constant.</li><li><b>Charles's law</b> (P, n constant): V / T = constant.</li><li><b>Gay-Lussac's law</b> (V, n constant): P / T = constant.</li><li><b>Always use absolute pressure and absolute temperature</b> in P V = n R T.</li></ul><h4>Qualification</h4><p>No gas is ideal. Air at 300 K and 1 bar is within about 0.1 % of ideal; steam at 10 bar and 180 °C is not. The error grows with pressure and near saturation, so a result that comes from P V = n R T near the critical point should be checked against the compressibility chart.</p>
      gu: |-
        <h4>વ્યાખ્યા / સિદ્ધાંત</h4><p><b>Ideal gas</b> એ model છે જેમાં molecules નું volume નગણ્ય હોય અને elastic collisions સિવાય એકબીજા પર બળ ન કરે. તેનું equation of state <b>P V = n R T</b> છે, અને gas constant R = 8.314 kJ/kmol·K = હવા માટે 0.287 kJ/kg·K.</p><h4>વિગતવાર Theory તથા Conditions</h4><p>આ model એ દરેક વાસ્તવિક fluid ને માપવાનો પાયો છે, અને તેના પરિણામો મોઢે યાદ રાખવા જેવા છે કારણ કે તે મોટાભાગના દાખલા આવરી લે છે. Internal energy તથા enthalpy ફક્ત <b>temperature</b> પર આધાર રાખે છે (Joule's law), તેથી દરેક path માટે ΔU = m c<sub>v</sub> ΔT અને ΔH = m c<sub>p</sub> ΔT. અચળ temperature પર P V અચળ; અચળ pressure પર V/T અચળ; અચળ volume પર P/T અચળ.<br><br>આ model નીચા pressure તથા ઊંચા temperature પર સચોટ છે, જ્યાં molecules દૂર દૂર હોય અને તેમનું volume તથા attraction ભાગ્યે જ મહત્વનાં રહે. boiling point તથા critical point ની નજીક તે ખૂબ નિષ્ફળ જાય છે, અને ત્યાં જ real-gas corrections જરૂરી થાય. વાસ્તવિક પદાર્થ પર P V = n R T વાપરતાં પહેલાં 'behaves as an ideal gas' assumption હંમેશા લખો.</p><h4>સમીકરણો તથા Notation</h4><div class="math" data-tex="PV=nRT" aria-label="PV=nRT">P V = n R T        P v = R T        P V = m R T</div><div class="math" data-tex="R=8.314" aria-label="R=8.314">R = 8.314 kJ/kmol·K = 8.314 J/mol·K = 0.083 14 bar·m³/kmol·K</div><div class="math" data-tex="V_m=22.414\ \mathrm{m^3/kmol}" aria-label="V_m=22.414\ \mathrm{m^3/kmol}">at 1 atm, 0 °C:  1 kmol occupies 22.414 m³;  at 1 bar, 0 °C: 22.71 m³</div><h4>મુખ્ય મુદ્દા તથા data</h4><ul><li><b>Boyle's law</b> (T, n constant): P V = constant.</li><li><b>Charles's law</b> (P, n constant): V / T = constant.</li><li><b>Gay-Lussac's law</b> (V, n constant): P / T = constant.</li><li><b>Always use absolute pressure and absolute temperature</b> in P V = n R T.</li></ul><h4>નોંધ</h4><p>કોઈ gas ideal નથી. 300 K તથા 1 bar પર હવા લગભગ 0.1 % જ ideal ની નજીક છે; 10 bar તથા 180 °C પર steam નથી. pressure સાથે અને saturation ની નજીક ભૂલ વધે છે, તેથી critical point ની નજીક P V = n R T થી મળેલો જવાબ compressibility chart સાથે ચકાસવો જોઈએ.</p>
- title:
    en: 3.4  Ideal-gas processes and the adiabatic relation
    gu: 3.4  Ideal-gas પ્રક્રિયાઓ તથા adiabatic સંબંધ
  items:
  - h:
      en: 'Ideal-gas processes: constant V, P, T, adiabatic and polytropic'
      gu: 'ideal-gas પ્રક્રિયાઓ: અચળ V, P, T, adiabatic તથા polytropic'
    body:
      en: |-
        <h4>Definition / principle</h4><p>An <b>ideal-gas process</b> is a path on which one relation between P, V and T is maintained. Five are used: constant volume (<b>isochoric</b>), constant pressure (<b>isobaric</b>), constant temperature (<b>isothermal</b>), no heat transfer (<b>adiabatic</b>) and the general <b>polytropic</b> path P V<sup>n</sup> = constant, of which the first four are special cases.</p><h4>Detailed theory and conditions</h4><p>The polytropic relation is the key to the whole topic. Putting n = 0 gives P = constant (isobaric), n = 1 gives P V = constant (isothermal, ideal gas), n = γ gives the adiabatic path and n → ∞ gives V = constant (isochoric). A single formula for the work, W = m R (T₁ − T₂)/(n − 1), therefore covers every case except the isothermal one, where the denominator vanishes and the logarithmic form must be used instead.<br><br>An adiabatic path is always <b>steeper</b> than an isothermal one through the same point, because γ > 1. That is why a gas cools as it expands adiabatically — the work comes out of its internal energy — and why a compressor gets hot. During the suction and discharge strokes of a real compressor the pressure falls and rises at nearly constant volume, which is why the indicator diagram has rounded ends rather than clean verticals.</p><h4>Equations and notation</h4><div class="math" data-tex="PV^n=c" aria-label="PV^n=c">polytropic:  P V^n = c ,   W = m R (T₁ − T₂) / (n − 1)</div><div class="math" data-tex="W=mRT\ln\frac{V_2}{V_1}" aria-label="W=mRT\ln\frac{V_2}{V_1}">isothermal (n = 1):  W = m R T ln(V₂/V₁) = m R T ln(P₁/P₂)</div><div class="math" data-tex="\frac{T_2}{T_1}=\left(\frac{P_2}{P_1}\right)^{\frac{\gamma-1}{\gamma}}" aria-label="\frac{T_2}{T_1}=\left(\frac{P_2}{P_1}\right)^{\frac{\gamma-1}{\gamma}}">adiabatic:  T₂/T₁ = (P₂/P₁)^((γ−1)/γ) = (V₁/V₂)^(γ−1)</div><div class="math" data-tex="Q=mc_v(T_2-T_1)\frac{\gamma-n}{\gamma-1}" aria-label="Q=mc_v(T_2-T_1)\frac{\gamma-n}{\gamma-1}">heat in a polytropic process:  Q = m c_v (T₂ − T₁) (γ − n)/(γ − 1)</div><h4>Key points and data</h4><ul><li><b>n = 0</b> isobaric, <b>n = 1</b> isothermal, <b>n = γ</b> adiabatic, <b>n = ∞</b> isochoric; real compression often has n ≈ 1.2–1.35.</li><li><b>Adiabatic:</b> Q = 0, so W = −ΔU and the gas cools on expansion.</li><li><b>Isothermal:</b> ΔU = 0 for an ideal gas, so W = Q.</li><li><b>Watch the sign:</b> work done by the gas is positive; a compressor that consumes work reports W negative.</li></ul><h4>Qualification</h4><p>The formula W = m R (T₁ − T₂)/(n − 1) fails as n → 1, where it becomes 0/0; use the logarithmic form there. It also assumes constant heat capacity over the temperature range, which is a poor assumption for a wide range and for gases such as CO₂.</p>
      gu: |-
        <h4>વ્યાખ્યા / સિદ્ધાંત</h4><p><b>Ideal-gas process</b> એ એવો રસ્તો છે જેમાં P, V તથા T વચ્ચેનો એક સંબંધ જળવાય. પાંચ વપરાય છે: અચળ volume (<b>isochoric</b>), અચળ pressure (<b>isobaric</b>), અચળ temperature (<b>isothermal</b>), heat transfer વગર (<b>adiabatic</b>) અને સામાન્ય <b>polytropic</b> રસ્તો P V<sup>n</sup> = અચળ, જેમાં પહેલા ચાર તેના ખાસ કિસ્સા છે.</p><h4>વિગતવાર Theory તથા Conditions</h4><p>polytropic સંબંધ આખા વિષયની ચાવી છે. n = 0 મૂકતાં P = અચળ (isobaric), n = 1 મૂકતાં P V = અચળ (isothermal, ideal gas), n = γ મૂકતાં adiabatic રસ્તો અને n → ∞ મૂકતાં V = અચળ (isochoric) મળે. તેથી work માટેનું એક જ સૂત્ર W = m R (T₁ − T₂)/(n − 1) isothermal સિવાય દરેક કિસ્સો આવરી લે છે; ત્યાં denominator શૂન્ય થાય તેથી logarithmic સ્વરૂપ વાપરવું પડે.<br><br>એક જ બિંદુમાંથી પસાર થતો adiabatic રસ્તો isothermal કરતાં હંમેશા <b>ઢોળાવવાળો</b> હોય છે, કારણ કે γ > 1. એટલે જ adiabatic રીતે expand થતાં gas ઠંડું થાય — work તેની internal energy માંથી આવે — અને એટલે જ compressor ગરમ થાય. વાસ્તવિક compressor ના suction તથા discharge stroke દરમિયાન pressure લગભગ અચળ volume પર ઘટે તથા વધે, એટલે indicator diagram ના છેડા ગોળ હોય છે, સીધા ઊભા નહીં.</p><h4>સમીકરણો તથા Notation</h4><div class="math" data-tex="PV^n=c" aria-label="PV^n=c">polytropic:  P V^n = c ,   W = m R (T₁ − T₂) / (n − 1)</div><div class="math" data-tex="W=mRT\ln\frac{V_2}{V_1}" aria-label="W=mRT\ln\frac{V_2}{V_1}">isothermal (n = 1):  W = m R T ln(V₂/V₁) = m R T ln(P₁/P₂)</div><div class="math" data-tex="\frac{T_2}{T_1}=\left(\frac{P_2}{P_1}\right)^{\frac{\gamma-1}{\gamma}}" aria-label="\frac{T_2}{T_1}=\left(\frac{P_2}{P_1}\right)^{\frac{\gamma-1}{\gamma}}">adiabatic:  T₂/T₁ = (P₂/P₁)^((γ−1)/γ) = (V₁/V₂)^(γ−1)</div><div class="math" data-tex="Q=mc_v(T_2-T_1)\frac{\gamma-n}{\gamma-1}" aria-label="Q=mc_v(T_2-T_1)\frac{\gamma-n}{\gamma-1}">heat in a polytropic process:  Q = m c_v (T₂ − T₁) (γ − n)/(γ − 1)</div><h4>મુખ્ય મુદ્દા તથા data</h4><ul><li><b>n = 0</b> isobaric, <b>n = 1</b> isothermal, <b>n = γ</b> adiabatic, <b>n = ∞</b> isochoric; real compression often has n ≈ 1.2–1.35.</li><li><b>Adiabatic:</b> Q = 0, so W = −ΔU and the gas cools on expansion.</li><li><b>Isothermal:</b> ΔU = 0 for an ideal gas, so W = Q.</li><li><b>Watch the sign:</b> work done by the gas is positive; a compressor that consumes work reports W negative.</li></ul><h4>નોંધ</h4><p>W = m R (T₁ − T₂)/(n − 1) સૂત્ર n → 1 આસપાસ નિષ્ફળ જાય છે, ત્યાં 0/0 થાય; તેથી ત્યાં logarithmic સ્વરૂપ વાપરો. તે આખા temperature ગાળામાં c અચળ હોવાનું પણ ધારે છે, જે મોટા ગાળા માટે તથા CO₂ જેવા gases માટે નબળું assumption છે.</p>
    diagram: d3_ideal_processes
  - h:
      en: Adiabatic relation P V^γ = constant
      gu: adiabatic સંબંધ P V^γ = અચળ
    body:
      en: |-
        <h4>Symbols, model and assumptions</h4><p><b>Model:</b> an ideal gas in a perfectly insulated cylinder, compressed reversibly and adiabatically. <b>Assumptions:</b> ideal gas with constant c<sub>v</sub> and c<sub>p</sub>, reversible path, no heat transfer (Q = 0), no change of kinetic or potential energy.</p><ol><li><p>Start from the first law for a closed system and set Q = 0 for an adiabatic path.</p><div class="math" data-tex="-P\,dV=m c_v\,dT" aria-label="-P\,dV=m c_v\,dT">δQ − δW = dU   ⇒   −P dV = m c_v dT</div></li><li><p>Write the ideal-gas law for the same mass and differentiate it at constant mass.</p><div class="math" data-tex="P\,dV+V\,dP=mR\,dT" aria-label="P\,dV+V\,dP=mR\,dT">P V = m R T   ⇒   P dV + V dP = m R dT</div></li><li><p>Eliminate dT between the two equations to get a relation between P and V alone.</p><div class="math" data-tex="P\,dV+V\,dP=-\frac{R}{c_v}P\,dV" aria-label="P\,dV+V\,dP=-\frac{R}{c_v}P\,dV">m R dT = (R/c_v)(−P dV)   ⇒   P dV + V dP = −(R/c_v) P dV</div></li><li><p>Collect the P dV terms. Use R/c_v = γ − 1, which follows from c_p − c_v = R and γ = c_p/c_v.</p><div class="math" data-tex="V\,dP=-\gamma P\,dV" aria-label="V\,dP=-\gamma P\,dV">V dP = −γ P dV</div></li><li><p>Separate the variables so that P is with dP and V is with dV.</p><div class="math" data-tex="\frac{dP}{P}=-\gamma\frac{dV}{V}" aria-label="\frac{dP}{P}=-\gamma\frac{dV}{V}">dP / P = −γ dV / V</div></li><li><p>Integrate between states 1 and 2 with γ constant.</p><div class="math" data-tex="\ln\frac{P_2}{P_1}=-\gamma\ln\frac{V_2}{V_1}" aria-label="\ln\frac{P_2}{P_1}=-\gamma\ln\frac{V_2}{V_1}">ln(P₂/P₁) = −γ ln(V₂/V₁)</div></li><li><p>Take the exponential of both sides and rearrange to the standard form.</p><div class="math" data-tex="PV^\gamma=\text{const}" aria-label="PV^\gamma=\text{const}">P₁ V₁^γ = P₂ V₂^γ  ⇒  P V^γ = constant</div></li></ol><h4>Result</h4><div class="math" data-tex="PV^\gamma=c" aria-label="PV^\gamma=c">P V^γ = c        T V^(γ−1) = c        T / P^((γ−1)/γ) = c</div>
      gu: |-
        <h4>સંકેતો, Model તથા Assumptions</h4><p><b>Model:</b> સંપૂર્ણ insulated cylinder માં ideal gas, reversible તથા adiabatic રીતે compress થાય છે. <b>Assumptions:</b> c<sub>v</sub> તથા c<sub>p</sub> અચળ હોય તેવો ideal gas, reversible path, heat transfer નહીં (Q = 0), kinetic કે potential energy નો ફેરફાર નહીં.</p><ol><li><p>closed system માટે પ્રથમ નિયમ થી શરૂ કરો અને adiabatic રસ્તા માટે Q = 0 મૂકો.</p><div class="math" data-tex="-P\,dV=m c_v\,dT" aria-label="-P\,dV=m c_v\,dT">δQ − δW = dU   ⇒   −P dV = m c_v dT</div></li><li><p>એ જ mass માટે ideal-gas law લખો અને અચળ mass પર તેનું differential લો.</p><div class="math" data-tex="P\,dV+V\,dP=mR\,dT" aria-label="P\,dV+V\,dP=mR\,dT">P V = m R T   ⇒   P dV + V dP = m R dT</div></li><li><p>બંને સમીકરણો વચ્ચે dT દૂર કરો જેથી ફક્ત P તથા V વચ્ચેનો સંબંધ મળે.</p><div class="math" data-tex="P\,dV+V\,dP=-\frac{R}{c_v}P\,dV" aria-label="P\,dV+V\,dP=-\frac{R}{c_v}P\,dV">m R dT = (R/c_v)(−P dV)   ⇒   P dV + V dP = −(R/c_v) P dV</div></li><li><p>P dV ના પદ એકઠાં કરો. R/c_v = γ − 1 વાપરો, જે c_p − c_v = R તથા γ = c_p/c_v પરથી મળે.</p><div class="math" data-tex="V\,dP=-\gamma P\,dV" aria-label="V\,dP=-\gamma P\,dV">V dP = −γ P dV</div></li><li><p>Variables અલગ કરો જેથી P સાથે dP અને V સાથે dV રહે.</p><div class="math" data-tex="\frac{dP}{P}=-\gamma\frac{dV}{V}" aria-label="\frac{dP}{P}=-\gamma\frac{dV}{V}">dP / P = −γ dV / V</div></li><li><p>γ અચળ રાખીને state 1 તથા 2 વચ્ચે integrate કરો.</p><div class="math" data-tex="\ln\frac{P_2}{P_1}=-\gamma\ln\frac{V_2}{V_1}" aria-label="\ln\frac{P_2}{P_1}=-\gamma\ln\frac{V_2}{V_1}">ln(P₂/P₁) = −γ ln(V₂/V₁)</div></li><li><p>બંને બાજુ exponential લો અને પ્રમાણભૂત સ્વરૂપમાં ગોઠવો.</p><div class="math" data-tex="PV^\gamma=\text{const}" aria-label="PV^\gamma=\text{const}">P₁ V₁^γ = P₂ V₂^γ  ⇒  P V^γ = constant</div></li></ol><h4>પરિણામ</h4><div class="math" data-tex="PV^\gamma=c" aria-label="PV^\gamma=c">P V^γ = c        T V^(γ−1) = c        T / P^((γ−1)/γ) = c</div>
