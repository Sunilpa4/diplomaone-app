- title:
    en: 3.1  PVT behaviour and the P–V / P–T diagrams
    gu: 3.1  PVT વર્તન તથા P–V / P–T diagrams
  items:
  - h:
      en: PVT behaviour of a pure fluid
      gu: pure fluid નું PVT વર્તન
    body:
      en: |-
        <h4>Definition / principle</h4><p>The <b>PVT behaviour</b> of a substance is the relationship between its pressure, volume and temperature. For a pure fluid only <b>two</b> of the three are independent (F = 2 for a single phase), so the state is completely fixed by any two of them and the third follows from an equation of state, a table or a diagram.</p><h4>Detailed theory and conditions</h4><p>The complete behaviour is a surface in three dimensions. Engineers never draw that surface; they take two views of it. The <b>P–V diagram</b> (at fixed temperature slices) shows the familiar isotherms with their flat condensation plateaus and the saturation dome. The <b>P–T diagram</b> (projecting the phase boundaries) shows three regions — solid, liquid, vapour — separated by the fusion, sublimation and vapour-pressure curves, meeting at the triple point.<br><br>Each line on a P–T diagram carries a definite meaning. On the vapour-pressure line liquid and vapour coexist, so P = 2 and F = 1: choosing the temperature fixes the pressure. In the region inside one phase F = 2 and both may be chosen. At the triple point F = 0 and nature fixes both. Above the critical point there is no boundary at all, and the substance is called a supercritical fluid.</p><h4>Equations and notation</h4><div class="math" data-tex="PV=ZnRT" aria-label="PV=ZnRT">P V = Z n R T   (Z = 1 for an ideal gas)</div><div class="math" data-tex="\left(\frac{\partial P}{\partial V}\right)_T=0" aria-label="\left(\frac{\partial P}{\partial V}\right)_T=0">critical point:  (∂P/∂V)_T = 0  and  (∂²P/∂V²)_T = 0</div><div class="math" data-tex="P_r=\frac{P}{P_c}" aria-label="P_r=\frac{P}{P_c}">reduced coordinates:  P_r = P/P_c ,  T_r = T/T_c ,  V_r = V/V_c</div><h4>Key points and data</h4><ul><li><b>Triple point of water:</b> 0.01 °C and 0.006 11 bar — ice, water and vapour coexist.</li><li><b>Critical point of water:</b> 374.15 °C and 221.2 bar; above it no amount of pressure will liquefy steam.</li><li><b>Critical point of CO₂:</b> 31.0 °C and 73.8 bar — why CO₂ is a convenient supercritical solvent.</li><li><b>Below the triple point</b> a solid sublimes directly to vapour; that is why ice evaporates in a freezer without melting.</li></ul><h4>Qualification</h4><p>The P–V diagram shows only one temperature at a time; the P–T diagram shows the phase boundaries but no volume. Neither alone is enough — an equation of state or a table gives the third variable, which is why steam tables list v, u, h and s together.</p>
      gu: |-
        <h4>વ્યાખ્યા / સિદ્ધાંત</h4><p><b>PVT વર્તન</b> એ પદાર્થના pressure, volume તથા temperature વચ્ચેનો સંબંધ છે. pure fluid માટે ત્રણમાંથી ફક્ત <b>બે</b> સ્વતંત્ર હોય છે (single phase માટે F = 2), તેથી કોઈપણ બે પરથી state પૂરી રીતે નક્કી થાય અને ત્રીજું equation of state, table કે diagram પરથી મળે.</p><h4>વિગતવાર Theory તથા Conditions</h4><p>સંપૂર્ણ વર્તન ત્રિ-પરિમાણીય surface છે. Engineer તે surface દોરતા નથી; તેના બે દૃશ્ય લે છે. <b>P–V diagram</b> (અચળ temperature ના slice) પરિચિત isotherms, તેમના સપાટ condensation plateau તથા saturation dome દર્શાવે છે. <b>P–T diagram</b> (phase boundaries નું projection) ત્રણ પ્રદેશ — solid, liquid, vapour — દર્શાવે છે, જે fusion, sublimation તથા vapour-pressure curves થી અલગ પડે છે અને triple point પર મળે છે.<br><br>P–T diagram પરની દરેક રેખાનો ચોક્કસ અર્થ છે. vapour-pressure રેખા પર liquid તથા vapour સાથે રહે છે, તેથી P = 2 અને F = 1: temperature પસંદ કરતાં pressure નિશ્ચિત થાય. એક જ phase વાળા પ્રદેશમાં F = 2 અને બંને પસંદ કરી શકાય. triple point પર F = 0 અને પ્રકૃતિ બંને નિશ્ચિત કરે છે. critical point ઉપર કોઈ boundary જ નથી, અને તે પદાર્થને supercritical fluid કહે છે.</p><h4>સમીકરણો તથા Notation</h4><div class="math" data-tex="PV=ZnRT" aria-label="PV=ZnRT">P V = Z n R T   (Z = 1 for an ideal gas)</div><div class="math" data-tex="\left(\frac{\partial P}{\partial V}\right)_T=0" aria-label="\left(\frac{\partial P}{\partial V}\right)_T=0">critical point:  (∂P/∂V)_T = 0  and  (∂²P/∂V²)_T = 0</div><div class="math" data-tex="P_r=\frac{P}{P_c}" aria-label="P_r=\frac{P}{P_c}">reduced coordinates:  P_r = P/P_c ,  T_r = T/T_c ,  V_r = V/V_c</div><h4>મુખ્ય મુદ્દા તથા data</h4><ul><li><b>Triple point of water:</b> 0.01 °C and 0.006 11 bar — ice, water and vapour coexist.</li><li><b>Critical point of water:</b> 374.15 °C and 221.2 bar; above it no amount of pressure will liquefy steam.</li><li><b>Critical point of CO₂:</b> 31.0 °C and 73.8 bar — why CO₂ is a convenient supercritical solvent.</li><li><b>Below the triple point</b> a solid sublimes directly to vapour; that is why ice evaporates in a freezer without melting.</li></ul><h4>નોંધ</h4><p>P–V diagram એક સમયે ફક્ત એક temperature દર્શાવે છે; P–T diagram phase boundaries દર્શાવે છે પણ volume નહીં. એકલું કોઈ પણ પૂરતું નથી — equation of state કે table ત્રીજું variable આપે છે, એટલે જ steam tables v, u, h તથા s સાથે આપે છે.</p>
