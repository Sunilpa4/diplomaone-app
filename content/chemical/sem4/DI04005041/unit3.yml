- ref: N1
  title:
    en: 'Ideal-gas law: volume of a gas at given conditions'
    gu: 'ideal-gas law: આપેલી શરતો પર gas નું volume'
  format: rich_cards
  items:
  - h:
      en: 'Ideal-gas law: volume of a gas at given conditions'
      gu: 'ideal-gas law: આપેલી શરતો પર gas નું volume'
    body:
      en: |-
        <h4>Given</h4><p>3 kmol of an ideal gas is held at 4 bar and 320 K. R = 8.314 kJ/kmol·K.</p><h4>Find</h4><p>The volume occupied by the gas.</p><h4>Formula</h4><div class="math" data-tex="V=\frac{nRT}{P}" aria-label="V=\frac{nRT}{P}">P V = n R T  ⇒  V = n R T / P</div><h4>Substitution and calculation</h4><p>P = 4 bar = 400 kPa. V = 3 × 8.314 × 320 / 400 = 7 981.4 / 400 = 19.95 m³.</p><h4>Final answer with units</h4><p>V = 19.95 m³ ≈ 20 m³.</p><h4>Validity check</h4><p>One kmol at 320 K and 4 bar should occupy about 22.4 × (320/273) × (1/4) ≈ 6.6 m³, so three kmol give about 20 m³ — the answer is the right order.</p>
      gu: |-
        <h4>આપેલ</h4><p>3 kmol ideal gas 4 bar તથા 320 K પર રખાય છે. R = 8.314 kJ/kmol·K.</p><h4>શોધો</h4><p>Gas દ્વારા રોકાયેલું volume.</p><h4>સૂત્ર</h4><div class="math" data-tex="V=\frac{nRT}{P}" aria-label="V=\frac{nRT}{P}">P V = n R T  ⇒  V = n R T / P</div><h4>Substitution તથા Calculation</h4><p>P = 4 bar = 400 kPa. V = 3 × 8.314 × 320 / 400 = 7 981.4 / 400 = 19.95 m³.</p><h4>Units સાથે અંતિમ જવાબ</h4><p>V = 19.95 m³ ≈ 20 m³.</p><h4>Validity Check</h4><p>320 K તથા 4 bar પર એક kmol લગભગ 22.4 × (320/273) × (1/4) ≈ 6.6 m³ રોકે, તેથી ત્રણ kmol લગભગ 20 m³ આપે — જવાબ સાચો ક્રમ છે.</p>
- ref: N2
  title:
    en: Adiabatic compression with the PV^γ relation
    gu: PV^γ સંબંધ સાથે adiabatic compression
  format: rich_cards
  items:
  - h:
      en: Adiabatic compression with the PV^γ relation
      gu: PV^γ સંબંધ સાથે adiabatic compression
    body:
      en: |-
        <h4>Given</h4><p>2 kg of air at 1 bar and 300 K is compressed adiabatically and reversibly to 8 bar. γ = 1.4, R = 0.287 kJ/kg·K, c_v = 0.718 kJ/kg·K.</p><h4>Find</h4><p>Final temperature, work input and heat transfer.</p><h4>Formula</h4><div class="math" data-tex="T_2=T_1\left(\frac{P_2}{P_1}\right)^{\frac{\gamma-1}{\gamma}}" aria-label="T_2=T_1\left(\frac{P_2}{P_1}\right)^{\frac{\gamma-1}{\gamma}}">T₂ = T₁ (P₂/P₁)^((γ−1)/γ)</div><div class="math" data-tex="W=\frac{mR(T_1-T_2)}{\gamma-1}" aria-label="W=\frac{mR(T_1-T_2)}{\gamma-1}">W = m R (T₁ − T₂)/(γ − 1)      Q = 0</div><h4>Substitution and calculation</h4><p>(γ−1)/γ = 0.2857. T₂ = 300 × 8^0.2857 = 300 × 1.811 = 543.3 K. W = 2 × 0.287 × (300 − 543.3)/0.4 = 0.574 × (−243.3)/0.4 = −349.1 kJ. The negative sign means 349.1 kJ of work is supplied.</p><h4>Final answer with units</h4><p>T₂ = 543 K;  W = −349.1 kJ (work input);  Q = 0;  ΔU = +349.1 kJ.</p><h4>Validity check</h4><p>Check with ΔU: m c_v ΔT = 2 × 0.718 × 243.3 = 349.3 kJ, which matches the work within rounding — as it must, because Q = 0 means all the work becomes internal energy.</p>
      gu: |-
        <h4>આપેલ</h4><p>1 bar તથા 300 K પરની 2 kg હવા 8 bar સુધી adiabatic તથા reversible રીતે compress થાય છે. γ = 1.4, R = 0.287 kJ/kg·K, c_v = 0.718 kJ/kg·K.</p><h4>શોધો</h4><p>અંતિમ temperature, work input તથા heat transfer.</p><h4>સૂત્ર</h4><div class="math" data-tex="T_2=T_1\left(\frac{P_2}{P_1}\right)^{\frac{\gamma-1}{\gamma}}" aria-label="T_2=T_1\left(\frac{P_2}{P_1}\right)^{\frac{\gamma-1}{\gamma}}">T₂ = T₁ (P₂/P₁)^((γ−1)/γ)</div><div class="math" data-tex="W=\frac{mR(T_1-T_2)}{\gamma-1}" aria-label="W=\frac{mR(T_1-T_2)}{\gamma-1}">W = m R (T₁ − T₂)/(γ − 1)      Q = 0</div><h4>Substitution તથા Calculation</h4><p>(γ−1)/γ = 0.2857. T₂ = 300 × 8^0.2857 = 300 × 1.811 = 543.3 K. W = 2 × 0.287 × (300 − 543.3)/0.4 = 0.574 × (−243.3)/0.4 = −349.1 kJ. ઋણ ચિહ્ન એટલે 349.1 kJ work આપવું પડે.</p><h4>Units સાથે અંતિમ જવાબ</h4><p>T₂ = 543 K;  W = −349.1 kJ (work input);  Q = 0;  ΔU = +349.1 kJ.</p><h4>Validity Check</h4><p>ΔU થી ચકાસો: m c_v ΔT = 2 × 0.718 × 243.3 = 349.3 kJ, જે round-off ની અંદર work સાથે મળે — એ જરૂરી છે, કારણ કે Q = 0 એટલે આખું work internal energy બને.</p>
- ref: N3
  title:
    en: Compressibility factor and real volume
    gu: compressibility factor તથા વાસ્તવિક volume
  format: rich_cards
  items:
  - h:
      en: Compressibility factor and real volume
      gu: compressibility factor તથા વાસ્તવિક volume
    body:
      en: |-
        <h4>Given</h4><p>Carbon dioxide at 310 K and 70 bar. Tc = 304.2 K, Pc = 73.8 bar. The compressibility chart gives Z ≈ 0.72 at these reduced conditions. R = 0.1889 kJ/kg·K.</p><h4>Find</h4><p>Reduced properties, Z, and the actual specific volume compared with the ideal value.</p><h4>Formula</h4><div class="math" data-tex="T_r=\frac{T}{T_c}" aria-label="T_r=\frac{T}{T_c}">T_r = T / T_c ,   P_r = P / P_c</div><div class="math" data-tex="v=\frac{ZRT}{P}" aria-label="v=\frac{ZRT}{P}">v = Z R T / P</div><h4>Substitution and calculation</h4><p>T_r = 310/304.2 = 1.019;  P_r = 70/73.8 = 0.949. Ideal volume: v_ideal = 0.1889 × 310/7 000 = 8.366 × 10⁻³ m³/kg. Actual: v = 0.72 × 8.366 × 10⁻³ = 6.02 × 10⁻³ m³/kg.</p><h4>Final answer with units</h4><p>T_r = 1.02, P_r = 0.95, Z = 0.72;  v = 6.02 × 10⁻³ m³/kg, about 28 % below the ideal value.</p><h4>Validity check</h4><p>Tr ≈ 1 means the gas is close to its critical temperature, where Z is far from 1; had we used the ideal-gas law the volume would be over-estimated by 39 %. This is why CO₂ near 31 °C is a poor ideal gas but an excellent dense solvent.</p>
      gu: |-
        <h4>આપેલ</h4><p>310 K તથા 70 bar પર carbon dioxide. Tc = 304.2 K, Pc = 73.8 bar. આ reduced શરતો પર compressibility chart Z ≈ 0.72 આપે છે. R = 0.1889 kJ/kg·K.</p><h4>શોધો</h4><p>Reduced properties, Z, તથા વાસ્તવિક specific volume ની ideal કિંમત સાથે સરખામણી.</p><h4>સૂત્ર</h4><div class="math" data-tex="T_r=\frac{T}{T_c}" aria-label="T_r=\frac{T}{T_c}">T_r = T / T_c ,   P_r = P / P_c</div><div class="math" data-tex="v=\frac{ZRT}{P}" aria-label="v=\frac{ZRT}{P}">v = Z R T / P</div><h4>Substitution તથા Calculation</h4><p>T_r = 310/304.2 = 1.019;  P_r = 70/73.8 = 0.949. Ideal volume: v_ideal = 0.1889 × 310/7 000 = 8.366 × 10⁻³ m³/kg. Actual: v = 0.72 × 8.366 × 10⁻³ = 6.02 × 10⁻³ m³/kg.</p><h4>Units સાથે અંતિમ જવાબ</h4><p>T_r = 1.02, P_r = 0.95, Z = 0.72;  v = 6.02 × 10⁻³ m³/kg, ideal કરતાં લગભગ 28 % ઓછું.</p><h4>Validity Check</h4><p>Tr ≈ 1 એટલે gas પોતાના critical temperature ની નજીક છે, જ્યાં Z 1 થી ઘણું દૂર હોય; ideal-gas law વાપર્યું હોત તો volume 39 % વધારે આવત. એટલે જ 31 °C ની નજીક CO₂ નબળો ideal gas છે પણ ઉત્તમ dense solvent છે.</p>
- ref: N4
  title:
    en: Van der Waals equation for one mole
    gu: એક mole માટે Van der Waals equation
  format: rich_cards
  items:
  - h:
      en: Van der Waals equation for one mole
      gu: એક mole માટે Van der Waals equation
    body:
      en: |-
        <h4>Given</h4><p>One mole of a gas occupies 0.5 L at 300 K. For the gas, a = 3.592 bar·L²/mol² and b = 0.042 67 L/mol. R = 0.083 14 bar·L/mol·K.</p><h4>Find</h4><p>The pressure from the ideal-gas law and from the Van der Waals equation.</p><h4>Formula</h4><div class="math" data-tex="P=\frac{RT}{V}" aria-label="P=\frac{RT}{V}">ideal:  P = R T / V</div><div class="math" data-tex="P=\frac{RT}{V-b}-\frac{a}{V^2}" aria-label="P=\frac{RT}{V-b}-\frac{a}{V^2}">Van der Waals:  P = R T/(V − b) − a/V²</div><h4>Substitution and calculation</h4><p>Ideal: P = 0.083 14 × 300/0.5 = 49.88 bar. Van der Waals: V − b = 0.5 − 0.042 67 = 0.457 33 L. R T/(V − b) = 24.942/0.457 33 = 54.54 bar. a/V² = 3.592/0.25 = 14.37 bar. P = 54.54 − 14.37 = 40.17 bar.</p><h4>Final answer with units</h4><p>P_ideal = 49.9 bar;  P_vdW = 40.2 bar — the ideal law over-predicts by about 24 %.</p><h4>Validity check</h4><p>The two corrections pull in opposite directions: the volume correction (V − b) raises the pressure, the attraction term (a/V²) lowers it, and here attraction wins. At this density the gas is far from ideal, which is the expected conclusion for half a litre per mole.</p>
      gu: |-
        <h4>આપેલ</h4><p>એક mole gas 300 K પર 0.5 L રોકે છે. gas માટે a = 3.592 bar·L²/mol² તથા b = 0.042 67 L/mol. R = 0.083 14 bar·L/mol·K.</p><h4>શોધો</h4><p>ideal-gas law તથા Van der Waals equation થી pressure.</p><h4>સૂત્ર</h4><div class="math" data-tex="P=\frac{RT}{V}" aria-label="P=\frac{RT}{V}">ideal:  P = R T / V</div><div class="math" data-tex="P=\frac{RT}{V-b}-\frac{a}{V^2}" aria-label="P=\frac{RT}{V-b}-\frac{a}{V^2}">Van der Waals:  P = R T/(V − b) − a/V²</div><h4>Substitution તથા Calculation</h4><p>Ideal: P = 0.083 14 × 300/0.5 = 49.88 bar. Van der Waals: V − b = 0.5 − 0.042 67 = 0.457 33 L. R T/(V − b) = 24.942/0.457 33 = 54.54 bar. a/V² = 3.592/0.25 = 14.37 bar. P = 54.54 − 14.37 = 40.17 bar.</p><h4>Units સાથે અંતિમ જવાબ</h4><p>P_ideal = 49.9 bar;  P_vdW = 40.2 bar — ideal law લગભગ 24 % વધારે આપે છે.</p><h4>Validity Check</h4><p>બંને corrections વિરુદ્ધ દિશામાં ખેંચે છે: volume correction (V − b) pressure વધારે છે, attraction પદ (a/V²) ઘટાડે છે, અને અહીં attraction જીતે છે. આ density પર gas ideal થી ઘણું દૂર છે, જે પ્રતિ mole અડધા લિટર માટે અપેક્ષિત નિષ્કર્ષ છે.</p>
- ref: N5
  title:
    en: Polytropic compression of air
    gu: હવાનું polytropic compression
  format: rich_cards
  items:
  - h:
      en: Polytropic compression of air
      gu: હવાનું polytropic compression
    body:
      en: |-
        <h4>Given</h4><p>1.5 kg of air is compressed from 1 bar, 290 K to 6 bar according to P V^1.25 = constant. R = 0.287 kJ/kg·K, c_v = 0.718 kJ/kg·K, γ = 1.4.</p><h4>Find</h4><p>Final temperature, work input, heat transfer and the polytropic index check.</p><h4>Formula</h4><div class="math" data-tex="T_2=T_1\left(\frac{P_2}{P_1}\right)^{\frac{n-1}{n}}" aria-label="T_2=T_1\left(\frac{P_2}{P_1}\right)^{\frac{n-1}{n}}">T₂ = T₁ (P₂/P₁)^((n−1)/n)</div><div class="math" data-tex="W=\frac{mR(T_1-T_2)}{n-1}" aria-label="W=\frac{mR(T_1-T_2)}{n-1}">W = m R (T₁ − T₂)/(n − 1)</div><div class="math" data-tex="Q=mc_v(T_2-T_1)\frac{\gamma-n}{\gamma-1}" aria-label="Q=mc_v(T_2-T_1)\frac{\gamma-n}{\gamma-1}">Q = m c_v (T₂ − T₁)(γ − n)/(γ − 1)</div><h4>Substitution and calculation</h4><p>(n−1)/n = 0.25/1.25 = 0.2. T₂ = 290 × 6^0.2 = 290 × 1.431 = 415.0 K. W = 1.5 × 0.287 × (290 − 415)/0.25 = 0.4305 × (−125)/0.25 = −215.3 kJ. Q = 1.5 × 0.718 × 125 × (1.4 − 1.25)/0.4 = 1.077 × 125 × 0.375 = −50.5 kJ.</p><h4>Final answer with units</h4><p>T₂ = 415 K;  work input = 215.3 kJ;  heat rejected ≈ 50.5 kJ. Since 1 < n < γ, the gas is cooled during compression as well as compressed.</p><h4>Validity check</h4><p>Check with the first law: ΔU = m c_v ΔT = 1.5 × 0.718 × 125 = 134.6 kJ. Q − W = −50.5 − (−215.3) = 164.8 kJ, which should equal ΔU. The gap is rounding in c_v; use c_v = R/(γ − 1) = 0.7175 for exact agreement.</p>
      gu: |-
        <h4>આપેલ</h4><p>1.5 kg હવા 1 bar, 290 K થી 6 bar સુધી P V^1.25 = અચળ પ્રમાણે compress થાય છે. R = 0.287 kJ/kg·K, c_v = 0.718 kJ/kg·K, γ = 1.4.</p><h4>શોધો</h4><p>અંતિમ temperature, work input, heat transfer તથા polytropic index ની ચકાસણી.</p><h4>સૂત્ર</h4><div class="math" data-tex="T_2=T_1\left(\frac{P_2}{P_1}\right)^{\frac{n-1}{n}}" aria-label="T_2=T_1\left(\frac{P_2}{P_1}\right)^{\frac{n-1}{n}}">T₂ = T₁ (P₂/P₁)^((n−1)/n)</div><div class="math" data-tex="W=\frac{mR(T_1-T_2)}{n-1}" aria-label="W=\frac{mR(T_1-T_2)}{n-1}">W = m R (T₁ − T₂)/(n − 1)</div><div class="math" data-tex="Q=mc_v(T_2-T_1)\frac{\gamma-n}{\gamma-1}" aria-label="Q=mc_v(T_2-T_1)\frac{\gamma-n}{\gamma-1}">Q = m c_v (T₂ − T₁)(γ − n)/(γ − 1)</div><h4>Substitution તથા Calculation</h4><p>(n−1)/n = 0.25/1.25 = 0.2. T₂ = 290 × 6^0.2 = 290 × 1.431 = 415.0 K. W = 1.5 × 0.287 × (290 − 415)/0.25 = 0.4305 × (−125)/0.25 = −215.3 kJ. Q = 1.5 × 0.718 × 125 × (1.4 − 1.25)/0.4 = 1.077 × 125 × 0.375 = −50.5 kJ.</p><h4>Units સાથે અંતિમ જવાબ</h4><p>T₂ = 415 K;  work input = 215.3 kJ;  heat rejected ≈ 50.5 kJ. 1 < n < γ હોવાથી compress થતાં gas ઠંડું પણ થાય છે.</p><h4>Validity Check</h4><p>પ્રથમ નિયમ થી ચકાસો: ΔU = m c_v ΔT = 1.5 × 0.718 × 125 = 134.6 kJ. Q − W = −50.5 − (−215.3) = 164.8 kJ, જે ΔU જેટલું હોવું જોઈએ. તફાવત c_v માં round-off નો છે; બરાબર મેળ માટે c_v = R/(γ − 1) = 0.7175 વાપરો.</p>
syntax:
- title:
    en: Ideal-gas relations
    gu: ideal-gas સંબંધો
  items:
  - title:
      en: Equation of state
      gu: Equation of state
    f: P V = n R T;  P v = R T;  P V = m R T
    terms: Absolute pressure and absolute temperature only.
  - title:
      en: Gas constant
      gu: Gas constant
    f: R = 8.314 kJ/kmol·K = 0.287 kJ/kg·K (air);  R_u = M R
    terms: Molar and specific forms differ by the molar mass.
  - title:
      en: Standard volume
      gu: Standard volume
    f: 22.414 m³/kmol at 1 atm, 0 °C;  22.71 m³/kmol at 1 bar, 0 °C
    terms: Handy for converting a gas flow to a molar flow.
- title:
    en: Process relations (ideal gas)
    gu: પ્રક્રિયા સંબંધો (ideal gas)
  items:
  - title:
      en: Polytropic
      gu: Polytropic
    f: P V^n = c;  W = mR(T₁ − T₂)/(n − 1);  Q = m c_v (T₂ − T₁)(γ − n)/(γ − 1)
    terms: Covers isobaric, isothermal, adiabatic and isochoric as special cases.
  - title:
      en: Isothermal (n = 1)
      gu: Isothermal (n = 1)
    f: W = Q = m R T ln(V₂/V₁) = m R T ln(P₁/P₂)
    terms: Denominator n − 1 vanishes, so use the logarithmic form.
  - title:
      en: Adiabatic
      gu: Adiabatic
    f: T₂/T₁ = (P₂/P₁)^((γ−1)/γ);  P V^γ = c;  T V^(γ−1) = c
    terms: Q = 0, so W = −ΔU = m c_v (T₁ − T₂).
- title:
    en: Real-gas relations
    gu: વાસ્તવિક-gas સંબંધો
  items:
  - title:
      en: Compressibility factor
      gu: Compressibility factor
    f: Z = P V / n R T;  V = Z n R T / P
    terms: Read Z from the chart using Pr and Tr.
  - title:
      en: Reduced coordinates
      gu: Reduced coordinates
    f: P_r = P/P_c;  T_r = T/T_c;  V_r = V/V_c
    terms: 'Principle of corresponding states: all gases collapse onto one chart.'
  - title:
      en: Van der Waals
      gu: Van der Waals
    f: (P + a/V²)(V − b) = R T;  Tc = 8a/(27Rb);  Pc = a/(27b²)
    terms: Predicts Zc = 3/8 for every gas, so use it qualitatively.
  - title:
      en: Virial
      gu: Virial
    f: Z = 1 + B/V + C/V² + …
    terms: B negative at low T (attraction), positive at high T.
