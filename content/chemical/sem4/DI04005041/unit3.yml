.77" y2="113.38581468750004" stroke="#7E57C2" stroke-width="2.3"/><line x1="683.77" y1="113.38581468750004" x2="690.4" y2="111.14249999999998" stroke="#7E57C2" stroke-width="2.3"/><circle cx="690.4" cy="111.14249999999998" r="3.5" fill="#7E57C2" stroke="#7E57C2" stroke-width="1.0"/><text x="700.4" y="120.8" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#7E57C2" font-weight="bold">T_r = 1.05</text><rect x="0" y="458" width="960" height="34" rx="0" fill="#EADDF7" stroke="none" stroke-width="0"/><text x="18.0" y="480.9" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#6420B8" font-weight="bold">HOW THE CHART IS USED</text><text x="30.0" y="516.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#222222" font-weight="normal">1.  Find the critical constants Tc and Pc of the gas.</text><text x="30.0" y="540.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#222222" font-weight="normal">2.  Reduced values:   P_r = P / P_c    and    T_r = T / T_c.</text><text x="30.0" y="564.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#222222" font-weight="normal">3.  Read Z from the chart at that (P_r , T_r).</text><text x="30.0" y="588.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#222222" font-weight="normal">4.  Then   V = Z R T / P   — the ideal-gas law corrected by one number.</text><text x="30.0" y="627.6" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16" text-anchor="start" fill="#6420B8" font-weight="bold">Z = P V / R T</text><text x="230.0" y="626.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#6B6275" font-weight="normal">Z &lt; 1 attraction dominates,   Z &gt; 1 repulsion dominates</text><text x="24.0" y="671.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#6B6275" font-weight="normal">Original teaching schematic · every gas approaches Z = 1 as P → 0</text></svg>
