- title:
    en: 3.5  Equations of state for real gases
    gu: 3.5  વાસ્તવિક gases માટે equations of state
  items:
  - h:
      en: Equations of state for real gases
      gu: વાસ્તવિક gases માટે equations of state
    body:
      en: |-
        <h4>Definition / principle</h4><p>A <b>real gas</b> deviates from P V = n R T because its molecules have finite volume and attract one another. The deviation is measured by the <b>compressibility factor Z = P V / n R T</b>, which equals 1 for an ideal gas and departs from 1 as pressure rises or as the temperature approaches the critical temperature.</p><h4>Detailed theory and conditions</h4><p>Two corrections explain the shape of the Z curve. At moderate pressure the <b>attraction</b> between molecules pulls them closer than ideal, so the volume is smaller and Z falls below 1. At high pressure the molecules' own <b>volume</b> leaves less free space, so Z rises above 1. At very low pressure both effects vanish and Z → 1, which is why the ideal-gas law works so well near atmospheric conditions.<br><br>Three tools are used in practice. The <b>Van der Waals equation</b> (P + a/V²)(V − b) = R T applies the two corrections explicitly and is the basis of every later cubic equation. The <b>virial equation</b> Z = 1 + B/V + C/V² + … expands Z in powers of volume with experimentally fitted coefficients. The <b>compressibility chart</b> uses the principle of corresponding states: all gases obey nearly the same Z curve when plotted against reduced pressure and temperature, so one chart serves every gas.</p><h4>Equations and notation</h4><div class="math" data-tex="Z=\frac{PV}{nRT}" aria-label="Z=\frac{PV}{nRT}">Z = P V / n R T</div><div class="math" data-tex="\left(P+\frac{a}{V^2}\right)(V-b)=RT" aria-label="\left(P+\frac{a}{V^2}\right)(V-b)=RT">Van der Waals:  (P + a/V²)(V − b) = R T</div><div class="math" data-tex="Z=1+\frac{B}{V}+\frac{C}{V^2}" aria-label="Z=1+\frac{B}{V}+\frac{C}{V^2}">virial:  Z = 1 + B/V + C/V² + …   or   Z = 1 + B′P + C′P² + …</div><div class="math" data-tex="a=\frac{27R^2T_c^2}{64P_c}" aria-label="a=\frac{27R^2T_c^2}{64P_c}">critical constants:  a = 27R²Tc²/(64Pc) ,  b = RTc/(8Pc)</div><h4>Key points and data</h4><ul><li><b>Van der Waals constants:</b> a measures attraction (large for polar gases), b measures molecular volume.</li><li><b>Critical constants from a and b:</b> Tc = 8a/(27Rb), Pc = a/(27b²), Vc = 3b.</li><li><b>Virial:</b> B is the second virial coefficient, negative at low temperature (attraction dominates) and positive at high temperature.</li><li><b>Corresponding states:</b> all gases have Z ≈ 1 when Tr is large, so the chart is used mainly for 0.8 < Tr < 3.</li></ul><h4>Qualification</h4><p>The Van der Waals equation is qualitative, not accurate: it predicts the critical compressibility factor Z<sub>c</sub> = 3/8 = 0.375 for every gas, whereas real gases range from about 0.23 to 0.29. It is used to explain behaviour and to introduce cubic equations, not to size equipment.</p>
      gu: |-
        <h4>વ્યાખ્યા / સિદ્ધાંત</h4><p><b>વાસ્તવિક gas</b> P V = n R T થી વિચલિત થાય છે કારણ કે તેના molecules નું ચોક્કસ volume હોય છે અને એકબીજાને આકર્ષે છે. વિચલન <b>compressibility factor Z = P V / n R T</b> થી મપાય છે, જે ideal gas માટે 1 થાય અને pressure વધતાં કે temperature critical temperature ની નજીક આવતાં 1 થી દૂર જાય.</p><h4>વિગતવાર Theory તથા Conditions</h4><p>Z curve નો આકાર બે corrections સમજાવે છે. મધ્યમ pressure પર molecules વચ્ચેનું <b>attraction</b> તેમને ideal કરતાં નજીક ખેંચે છે, તેથી volume નાનું થાય અને Z 1 થી નીચે જાય. ઊંચા pressure પર molecules નું પોતાનું <b>volume</b> ઓછી ખાલી જગ્યા છોડે છે, તેથી Z 1 થી ઉપર જાય. ખૂબ નીચા pressure પર બંને અસરો જતી રહે અને Z → 1 થાય, એટલે જ atmospheric conditions ની નજીક ideal-gas law ખૂબ સારી કામ કરે છે.<br><br>વ્યવહારમાં ત્રણ સાધનો વપરાય છે. <b>Van der Waals equation</b> (P + a/V²)(V − b) = R T બંને corrections સ્પષ્ટ લાગુ કરે છે અને પછીના દરેક cubic equation નો પાયો છે. <b>virial equation</b> Z = 1 + B/V + C/V² + … Z ને volume ની ઘાતોમાં વિસ્તારે છે અને તેના coefficients પ્રયોગથી મળે છે. <b>compressibility chart</b> corresponding states ના સિદ્ધાંત વાપરે છે: બધા gases reduced pressure તથા temperature સામે દોરતાં લગભગ એ જ Z curve પાળે છે, તેથી એક જ chart દરેક gas માટે કામ લાગે છે.</p><h4>સમીકરણો તથા Notation</h4><div class="math" data-tex="Z=\frac{PV}{nRT}" aria-label="Z=\frac{PV}{nRT}">Z = P V / n R T</div><div class="math" data-tex="\left(P+\frac{a}{V^2}\right)(V-b)=RT" aria-label="\left(P+\frac{a}{V^2}\right)(V-b)=RT">Van der Waals:  (P + a/V²)(V − b) = R T</div><div class="math" data-tex="Z=1+\frac{B}{V}+\frac{C}{V^2}" aria-label="Z=1+\frac{B}{V}+\frac{C}{V^2}">virial:  Z = 1 + B/V + C/V² + …   or   Z = 1 + B′P + C′P² + …</div><div class="math" data-tex="a=\frac{27R^2T_c^2}{64P_c}" aria-label="a=\frac{27R^2T_c^2}{64P_c}">critical constants:  a = 27R²Tc²/(64Pc) ,  b = RTc/(8Pc)</div><h4>મુખ્ય મુદ્દા તથા data</h4><ul><li><b>Van der Waals constants:</b> a measures attraction (large for polar gases), b measures molecular volume.</li><li><b>Critical constants from a and b:</b> Tc = 8a/(27Rb), Pc = a/(27b²), Vc = 3b.</li><li><b>Virial:</b> B is the second virial coefficient, negative at low temperature (attraction dominates) and positive at high temperature.</li><li><b>Corresponding states:</b> all gases have Z ≈ 1 when Tr is large, so the chart is used mainly for 0.8 < Tr < 3.</li></ul><h4>નોંધ</h4><p>Van der Waals equation ગુણાત્મક છે, સચોટ નથી: તે દરેક gas માટે critical compressibility factor Z<sub>c</sub> = 3/8 = 0.375 આપે છે, જ્યારે વાસ્તવિક gases લગભગ 0.23 થી 0.29 સુધી હોય છે. તેનો ઉપયોગ વર્તન સમજાવવા તથા cubic equations નો પરિચય આપવા માટે થાય, equipment નું size નક્કી કરવા માટે નહીં.</p>
    diagram: d3_compressibility
diagrams:
- id: d3_pv_diagram
  title:
    en: The P–V diagram of a pure substance
    gu: pure substance નું P–V diagram
