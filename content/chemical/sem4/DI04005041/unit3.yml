viva:
- q:
    en: Explain PVT behaviour of a pure fluid and state how many properties fix its state.
    gu: pure fluid નું PVT વર્તન સમજાવો અને કેટલી properties તેની state નક્કી કરે તે જણાવો.
  a:
    en: PVT behaviour is the relation between pressure, volume and temperature. For a pure fluid in a single phase only two of the three are independent (F = 2), so fixing any two fixes the third through an equation of state or a table.
    gu: PVT વર્તન એ pressure, volume તથા temperature વચ્ચેનો સંબંધ છે. single phase માં pure fluid માટે ત્રણમાંથી ફક્ત બે સ્વતંત્ર હોય (F = 2), તેથી કોઈપણ બે નિશ્ચિત કરતાં ત્રીજું equation of state કે table દ્વારા નિશ્ચિત થાય.
- q:
    en: Draw and explain the P–V diagram of a pure substance.
    gu: pure substance નું P–V diagram દોરો અને સમજાવો.
  a:
    en: Isotherms below Tc show a flat plateau where liquid and vapour coexist. The plateau shortens as T rises and vanishes at the critical point. Above Tc the isotherm is continuous — no phase change. The dome joins all plateau ends.
    gu: Tc થી નીચે isotherms સપાટ plateau દર્શાવે છે જ્યાં liquid તથા vapour સાથે રહે છે. T વધતાં plateau ટૂંકું થાય અને critical point પર અદૃશ્ય થાય. Tc ઉપર isotherm સતત હોય — phase change નહીં. dome બધા plateau ના છેડા જોડે છે.
- q:
    en: State the ideal-gas law and the conditions under which it applies.
    gu: ideal-gas law જણાવો અને તે કઈ શરતોમાં લાગુ પડે તે જણાવો.
  a:
    en: P V = n R T. It applies at low pressure and high temperature, where molecular volume and intermolecular attraction are negligible. It fails near the critical point and near saturation.
    gu: P V = n R T. તે નીચા pressure તથા ઊંચા temperature પર લાગુ પડે છે, જ્યાં molecular volume તથા intermolecular attraction નગણ્ય હોય. critical point તથા saturation ની નજીક તે નિષ્ફળ જાય.
- q:
    en: What is a polytropic process? What do n = 0, 1, γ and ∞ represent?
    gu: polytropic process શું છે? n = 0, 1, γ તથા ∞ શું દર્શાવે છે?
  a:
    en: A process following P V^n = constant. n = 0 is isobaric, n = 1 is isothermal, n = γ is adiabatic and n → ∞ is isochoric. Real compression usually has n between 1.2 and 1.35.
    gu: P V^n = અચળ પાળતી પ્રક્રિયા. n = 0 isobaric, n = 1 isothermal, n = γ adiabatic અને n → ∞ isochoric. વાસ્તવિક compression માં n સામાન્ય રીતે 1.2 થી 1.35 હોય છે.
- q:
    en: Why is an adiabatic curve steeper than an isothermal curve?
    gu: adiabatic curve isothermal કરતાં ઢોળાવવાળો કેમ હોય છે?
  a:
    en: On an adiabatic path no heat enters, so the work comes out of internal energy and the temperature falls as the gas expands. The isothermal path keeps T constant by taking in heat. Since γ > 1 the adiabatic relation P V^γ = c falls faster than P V = c.
    gu: adiabatic રસ્તા પર કોઈ heat અંદર આવતી નથી, તેથી work internal energy માંથી આવે અને gas expand થતાં temperature ઘટે. isothermal રસ્તો heat લઈને T અચળ રાખે. γ > 1 હોવાથી P V^γ = c એ P V = c કરતાં ઝડપથી ઘટે છે.
- q:
    en: Define compressibility factor Z and explain why it can be less or greater than 1.
    gu: compressibility factor Z ની વ્યાખ્યા આપો અને તે 1 થી ઓછું કે વધુ કેમ હોઈ શકે તે સમજાવો.
  a:
    en: Z = P V / n R T. Below 1 when intermolecular attraction dominates and the volume is smaller than ideal; above 1 when molecular volume dominates at high pressure. Z → 1 as P → 0.
    gu: Z = P V / n R T. intermolecular attraction પ્રભાવી હોય અને volume ideal કરતાં નાનું હોય ત્યારે 1 થી નીચે; ઊંચા pressure પર molecular volume પ્રભાવી હોય ત્યારે 1 થી ઉપર. P → 0 થતાં Z → 1.
- q:
    en: Write the Van der Waals equation and state the meaning of a and b.
    gu: Van der Waals equation લખો અને a તથા b નો અર્થ જણાવો.
  a:
    en: (P + a/V²)(V − b) = R T. The constant a corrects for intermolecular attraction and b for the finite volume occupied by the molecules themselves.
    gu: (P + a/V²)(V − b) = R T. a અચળ intermolecular attraction સુધારે છે અને b molecules દ્વારા રોકાયેલા ચોક્કસ volume માટે.
- q:
    en: What is the principle of corresponding states?
    gu: corresponding states નો સિદ્ધાંત શું છે?
  a:
    en: All gases obey nearly the same compressibility relation when expressed in reduced coordinates Pr = P/Pc and Tr = T/Tc. One generalised chart therefore serves every gas, which is why the compressibility chart is universal.
    gu: બધા gases reduced coordinates Pr = P/Pc તથા Tr = T/Tc માં લખતાં લગભગ એ જ compressibility સંબંધ પાળે છે. તેથી એક generalised chart દરેક gas માટે કામ લાગે, એટલે જ compressibility chart સાર્વત્રિક છે.
