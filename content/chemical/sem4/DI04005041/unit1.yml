-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="end" fill="#C2185B" font-weight="bold">sudden release</text><text x="390.0" y="136.4" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" fill="#7B2CD9" font-weight="bold">reversible isothermal path</text><text x="390.0" y="153.8" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#6B6275" font-weight="normal">P V = constant, drawn through a continuous series of equilibrium states</text><text x="150.0" y="459.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#C2185B" font-weight="normal">irreversible path: pressure is released suddenly, so the intermediate</text><text x="150.0" y="477.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#C2185B" font-weight="normal">states are not equilibrium states and the path cannot be drawn exactly</text><text x="24.0" y="560.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#6B6275" font-weight="normal">Area under the reversible curve is the maximum work the same change can deliver; the irreversible path delivers less.</text><text x="24.0" y="611.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#6B6275" font-weight="normal">Original teaching schematic • conceptual, not a construction/operating drawing</text></svg>
