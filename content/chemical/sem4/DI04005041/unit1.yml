- title:
    en: 1.1  Scope and limitations
    gu: 1.1  ક્ષેત્ર તથા મર્યાદાઓ
  items:
  - h:
      en: Scope and limitations of thermodynamics
      gu: થર્મોડાયનેમિક્સનું ક્ષેત્ર તથા મર્યાદાઓ
    body:
      en: |-
        <h4>Definition / principle</h4><p><b>Thermodynamics</b> is the science of energy: it relates the heat and work exchanged by a system to the changes of its properties, and it decides which changes are possible. In chemical engineering it is the tool that converts a proposed plant into numbers — how much heat a reactor must remove, how much compressor work a gas needs, what the maximum efficiency of a power cycle can be.</p><h4>Detailed theory and conditions</h4><p>The subject rests on three laws, each an experience-based statement that has never been contradicted: the <b>zeroth law</b> makes temperature measurable, the <b>first law</b> is the conservation of energy, and the <b>second law</b> states that entropy is created in every real process, which fixes the direction of change and puts a ceiling on the work any cycle can deliver. A fourth idea, the phase rule, tells how many properties may be fixed independently before the state of a multi-phase system is determined.<br><br>Two features make thermodynamics powerful and, at the same time, limited. It works with <b>state functions only</b> — the answer for a change never depends on the route taken — and it therefore needs no knowledge of the internal mechanism. The price of that generality is that thermodynamics never tells <i>how fast</i> a change will happen.</p><h4>Key points and data</h4><ul><li><b>Process design:</b> energy balances, heat duties of exchangers, compressor and turbine work.</li><li><b>Feasibility:</b> whether a proposed reaction or separation is possible at all, and how far it can go (equilibrium).</li><li><b>Property estimation:</b> PVT behaviour, enthalpy and entropy of steam, refrigerants and mixtures.</li><li><b>Efficiency limits:</b> the best possible performance of a power plant or refrigerator before any machine is designed.</li></ul><h4>Qualification</h4><p><b>What it cannot do:</b> predict rates (that is chemical kinetics and transport phenomena), give a reaction mechanism, or describe the microscopic motion of molecules. It compares only the initial and final states, so two plants with the same energy balance can differ enormously in size and cost.</p>
      gu: |-
        <h4>વ્યાખ્યા / સિદ્ધાંત</h4><p><b>Thermodynamics</b> એ ઊર્જાનું શાસ્ત્ર છે: તે system દ્વારા થતી heat તથા work ને તેના properties ના ફેરફાર સાથે જોડે છે, અને કયા ફેરફારો શક્ય છે તે નક્કી કરે છે. Chemical engineering માં તે પ્રસ્તાવિત plant ને આંકડામાં ફેરવવાનું સાધન છે — reactor એ કેટલી heat કાઢવી પડશે, compressor ને કેટલું work જોઈશે, power cycle ની મહત્તમ efficiency કેટલી થઈ શકે.</p><h4>વિગતવાર Theory તથા Conditions</h4><p>આ વિષય ત્રણ નિયમો પર ઊભો છે, જે દરેક અનુભવ આધારિત વિધાન છે અને આજ સુધી ખોટું પડ્યું નથી: <b>ઝીરોથ નિયમ</b> temperature ને માપી શકાય તેવું બનાવે છે, <b>પ્રથમ નિયમ</b> ઊર્જા સંરક્ષણ છે, અને <b>દ્વિતીય નિયમ</b> કહે છે કે દરેક વાસ્તવિક પ્રક્રિયામાં entropy ઉત્પન્ન થાય છે, જે ફેરફારની દિશા નક્કી કરે છે અને કોઈપણ cycle કેટલું work આપી શકે તેની ઉપરની મર્યાદા મૂકે છે. ચોથો ખ્યાલ, phase rule, કહે છે કે multi-phase system ની state નક્કી થાય તે પહેલાં કેટલા properties સ્વતંત્ર રીતે નિશ્ચિત કરી શકાય.<br><br>બે બાબતો thermodynamics ને શક્તિશાળી અને તે જ સમયે મર્યાદિત બનાવે છે. તે ફક્ત <b>state functions</b> સાથે કામ કરે છે — ફેરફારનો જવાબ ક્યારેય લીધેલા રસ્તા પર આધાર રાખતો નથી — અને તેથી તેને આંતરિક mechanism ની જાણ રાખવાની જરૂર પડતી નથી. આ સામાન્યતાની કિંમત એ છે કે thermodynamics ક્યારેય નથી કહેતું કે ફેરફાર <i>કેટલી ઝડપથી</i> થશે.</p><h4>મુખ્ય મુદ્દા તથા data</h4><ul><li><b>Process design:</b> energy balances, heat duties of exchangers, compressor and turbine work.</li><li><b>Feasibility:</b> whether a proposed reaction or separation is possible at all, and how far it can go (equilibrium).</li><li><b>Property estimation:</b> PVT behaviour, enthalpy and entropy of steam, refrigerants and mixtures.</li><li><b>Efficiency limits:</b> the best possible performance of a power plant or refrigerator before any machine is designed.</li></ul><h4>નોંધ</h4><p><b>તે શું નથી કરી શકતું:</b> rate નું અનુમાન (એ chemical kinetics તથા transport phenomena નું કામ છે), reaction mechanism આપવું, કે molecules ની સૂક્ષ્મ ગતિ વર્ણવવી. તે ફક્ત શરૂઆતની તથા અંતિમ state ની સરખામણી કરે છે, તેથી સરખું energy balance ધરાવતા બે plant નું size તથા ખર્ચ ઘણું જુદું હોઈ શકે.</p>
- title:
    en: 1.2  System, surroundings and boundary
    gu: 1.2  System, surroundings તથા boundary
  items:
  - h:
      en: System, surroundings and boundary
      gu: System, આસપાસ (surroundings) તથા સીમા (boundary)
    body:
      en: |-
        <h4>Definition / principle</h4><p>A <b>system</b> is the definite quantity of matter or the region of space chosen for study. Everything outside it is the <b>surroundings</b> (or environment). The real or imaginary surface that separates the two is the <b>boundary</b>. System, surroundings and boundary together make the <b>universe</b>.</p><h4>Detailed theory and conditions</h4><p>The choice of system is the engineer's decision, and the right choice makes a problem short. A compressor can be studied as the gas alone (closed) or as the fixed volume around the rotor (open); the second choice turns a moving-boundary problem into simple bookkeeping of what enters and leaves. Three classes follow from what the boundary allows to cross: a <b>closed system</b> (control mass) lets energy cross but not mass; an <b>open system</b> (control volume) lets both cross; an <b>isolated system</b> lets neither cross. A boundary that permits heat transfer is <b>diathermic</b>, one that prevents it is <b>adiabatic</b>.</p><h4>Key points and data</h4><ul><li><b>Closed system (control mass):</b> fixed mass, energy may cross. Example: gas in a cylinder with a piston.</li><li><b>Open system (control volume):</b> mass and energy both cross. Example: a compressor, a heat exchanger, a reactor run continuously.</li><li><b>Isolated system:</b> neither mass nor energy crosses. Example: a perfectly insulated closed vessel; the universe itself.</li><li>Homogeneous: properties the same at every point (one phase). Heterogeneous: two or more phases with surfaces between them, so properties jump at the interface.</li><li>State of a system = the set of values its properties have at that instant.</li></ul><h4>Qualification</h4><p>The same piece of equipment gives different energy equations depending on how the system is chosen, but the numerical answer for the gas never changes. If two solutions disagree, the boundary was drawn wrongly — a leak of mass across it, or a work term counted twice.</p>
      gu: |-
        <h4>વ્યાખ્યા / સિદ્ધાંત</h4><p><b>System</b> એ અભ્યાસ માટે પસંદ કરેલો ચોક્કસ પદાર્થનો જથ્થો કે અવકાશનો વિસ્તાર છે. તેની બહારનું બધું <b>surroundings</b> (આસપાસ) છે. બંનેને અલગ કરતી વાસ્તવિક કે કાલ્પનિક સપાટી <b>boundary</b> છે. System, surroundings તથા boundary ભેગા મળીને <b>universe</b> બને છે.</p><h4>વિગતવાર Theory તથા Conditions</h4><p>System ની પસંદગી engineer નો નિર્ણય છે, અને યોગ્ય પસંદગી પ્રશ્નને ટૂંકો કરી દે છે. </p><h4>મુખ્ય મુદ્દા તથા data</h4><ul><li><b>Closed system (control mass):</b> fixed mass, energy may cross. Example: gas in a cylinder with a piston.</li><li><b>Open system (control volume):</b> mass and energy both cross. Example: a compressor, a heat exchanger, a reactor run continuously.</li><li><b>Isolated system:</b> neither mass nor energy crosses. Example: a perfectly insulated closed vessel; the universe itself.</li><li>Homogeneous: properties the same at every point (one phase). Heterogeneous: two or more phases with surfaces between them, so properties jump at the interface.</li><li>State of a system = the set of values its properties have at that instant.</li></ul><h4>નોંધ</h4><p>એક જ equipment માટે system કેવી રીતે પસંદ કરો તેના પર energy equation બદલાય, પણ gas માટેનો આંકડો કદી નથી બદલાતો. બે ઉકેલ મળતા ન હોય તો boundary ખોટી દોરાઈ છે — તેમાંથી mass લીક થાય છે અથવા કોઈ work પદ બે વાર ગણાયું છે.</p>
    diagram: d1_system_boundary
- title:
    en: '1.3  Properties: extensive and intensive'
    gu: '1.3  Properties: extensive તથા intensive'
  items:
  - h:
      en: 'Properties: extensive and intensive'
      gu: 'Properties: extensive તથા intensive'
    body:
      en: |-
        <h4>Definition / principle</h4><p>A <b>property</b> is a measurable characteristic of the state of a system — pressure, temperature, volume, density, enthalpy, viscosity. Properties are classified by how they respond when the system is divided. An <b>extensive</b> property is proportional to mass and adds up on division (m, V, U, H, S). An <b>intensive</b> property is independent of mass and has the same value in every part (P, T, ρ, μ).</p><h4>Detailed theory and conditions</h4><p>Extensive properties always occur in differences or ratios in the laws, which is why a working engineer usually prefers the intensive form. Dividing an extensive property by mass gives a <b>specific</b> property (v = V/m, u = U/m); dividing by moles gives a <b>molar</b> property (Ṽ = V/n, h̄ = H/n). Both are intensive, so the steam tables can be built once and used at any plant size. Two more distinctions matter in this unit: a property must be defined at equilibrium, and the number of independent intensive properties needed to fix the state (<b>degrees of freedom</b>) is two for a pure fluid, which is why every steam-table entry is quoted at P <i>and</i> T, or P and x.</p><h4>Equations and notation</h4><div class="math" data-tex="v=V/m,\quad \rho=m/V" aria-label="v=V/m,\quad \rho=m/V">v = V / m     ρ = m / V = 1 / v</div><div class="math" data-tex="u,h,s,v" aria-label="u,h,s,v">specific:  u, h, s, v      molar:  Ū, H̄, S̄, V̄</div><div class="math" data-tex="\text{extensive}/\text{mass}=\text{specific}" aria-label="\text{extensive}/\text{mass}=\text{specific}">[extensive] / mass = [specific] → intensive</div><h4>Key points and data</h4><ul><li><b>Extensive:</b> mass m, volume V, internal energy U, enthalpy H, entropy S, heat capacity C.</li><li><b>Intensive:</b> pressure P, temperature T, density ρ, viscosity μ, thermal conductivity k, mole fraction x, and every specific or molar property.</li><li><b>Trap in the exam:</b> specific heat capacity c<span style='font-size:70%'>p</span> (J/kg·K) is intensive, heat capacity C<span style='font-size:70%'>p</span> (J/K) is extensive. The capital letter is extensive, the small letter is intensive.</li><li><b>Units carry the answer:</b> if a property is quoted per kg you have a specific value; if it is per mole you have a molar value, and 1 kmol = M kg.</li></ul><h4>Qualification</h4><p>Extensive properties can be added; intensive properties can be averaged only by weight, never arithmetically. The mean temperature of two equal streams at 300 K and 400 K is 350 K, but the mean density of equal volumes is not the arithmetic mean unless the volumes are also equal.</p>
      gu: |-
        <h4>વ્યાખ્યા / સિદ્ધાંત</h4><p><b>Property</b> એ system ની state ની માપી શકાય તેવી લાક્ષણિકતા છે — pressure, temperature, volume, density, enthalpy, viscosity. System ને વિભાજિત કરતાં ગુણધર્મ કેવી રીતે વર્તે તે પ્રમાણે વર્ગીકરણ થાય. <b>Extensive</b> property mass ના પ્રમાણમાં હોય અને વિભાજનથી ઉમેરાય (m, V, U, H, S). <b>Intensive</b> property mass પર આધાર રાખતો નથી અને દરેક ભાગમાં સરખી કિંમત ધરાવે (P, T, ρ, μ).</p><h4>વિગતવાર Theory તથા Conditions</h4><p>Extensive properties હંમેશા નિયમોમાં તફાવત કે ગુણોત્તર રૂપે જ આવે છે, તેથી કાર્યરત engineer સામાન્ય રીતે intensive સ્વરૂપ પસંદ કરે છે. Extensive property ને mass વડે ભાગતાં <b>specific</b> property મળે (v = V/m, u = U/m); moles વડે ભાગતાં <b>molar</b> property મળે (Ṽ = V/n, h̄ = H/n). બંને intensive છે, તેથી steam table એક વાર બનાવી કોઈપણ size ના plant માં વાપરી શકાય. આ યુનિટમાં બીજા બે ભેદ મહત્વના છે: property equilibrium પર જ વ્યાખ્યાયિત થાય, અને state નક્કી કરવા માટે જરૂરી સ્વતંત્ર intensive properties ની સંખ્યા (<b>degrees of freedom</b>) pure fluid માટે બે છે, એટલે જ દરેક steam-table entry P <i>અને</i> T પર, અથવા P અને x પર આપવામાં આવે છે.</p><h4>સમીકરણો તથા Notation</h4><div class="math" data-tex="v=V/m,\quad \rho=m/V" aria-label="v=V/m,\quad \rho=m/V">v = V / m     ρ = m / V = 1 / v</div><div class="math" data-tex="u,h,s,v" aria-label="u,h,s,v">specific:  u, h, s, v      molar:  Ū, H̄, S̄, V̄</div><div class="math" data-tex="\text{extensive}/\text{mass}=\text{specific}" aria-label="\text{extensive}/\text{mass}=\text{specific}">[extensive] / mass = [specific] → intensive</div><h4>મુખ્ય મુદ્દા તથા data</h4><ul><li><b>Extensive:</b> mass m, volume V, internal energy U, enthalpy H, entropy S, heat capacity C.</li><li><b>Intensive:</b> pressure P, temperature T, density ρ, viscosity μ, thermal conductivity k, mole fraction x, and every specific or molar property.</li><li><b>Trap in the exam:</b> specific heat capacity c<span style='font-size:70%'>p</span> (J/kg·K) is intensive, heat capacity C<span style='font-size:70%'>p</span> (J/K) is extensive. The capital letter is extensive, the small letter is intensive.</li><li><b>Units carry the answer:</b> if a property is quoted per kg you have a specific value; if it is per mole you have a molar value, and 1 kmol = M kg.</li></ul><h4>નોંધ</h4><p>Extensive properties ઉમેરી શકાય; intensive properties ફક્ત weight પ્રમાણે સરેરાશ કરી શકાય, કદી સીધી ગણતરીથી નહીં. 300 K તથા 400 K ના બે સરખા stream નું સરેરાશ temperature 350 K છે, પણ સરખા volume ના બે ભાગની સરેરાશ density સીધી ગણતરીની સરેરાશ નથી હોતી.</p>
- title:
    en: 1.4  State function and path function
    gu: 1.4  State તથા path function
  items:
  - h:
      en: State function and path function
      gu: State function તથા path function
    body:
      en: |-
        <h4>Definition / principle</h4><p>A <b>state function</b> (property) depends only on the present state of the system; its change between two states is fixed no matter how the change is made. U, H, S, T, P, V and ρ are state functions, and their differential is <b>exact</b> (∮dU = 0). A <b>path function</b> depends on the route followed; heat Q and work W are path functions and their differential is inexact (δQ, δW).</p><h4>Detailed theory and conditions</h4><p>This single distinction explains the form of the first law. Because U is a state function, dU is exact and can be integrated between two states; Q and W cannot, so the first law is written δQ − δW = dU with the δ reminding us that the two terms must be evaluated along a specified path. In a <b>cycle</b> the system returns to its starting state, so ΔU = 0 while Q and W are generally not zero — indeed the net work of a cycle equals the net heat. A useful corollary: any quantity you can tabulate in a property table must be a state function, and any quantity whose value you can only report together with a description of the process is a path function.</p><h4>Equations and notation</h4><div class="math" data-tex="\int_1^2 dU=U_2-U_1" aria-label="\int_1^2 dU=U_2-U_1">state function:  ∫₁² dU = U₂ − U₁  (exact)</div><div class="math" data-tex="Q,W\ \text{path dependent}" aria-label="Q,W\ \text{path dependent}">path function:  Q and W depend on the route</div><div class="math" data-tex="\oint dU=0\Rightarrow Q_{net}=W_{net}" aria-label="\oint dU=0\Rightarrow Q_{net}=W_{net}">cycle:  ΔU = 0  ⇒  Q_net = W_net</div><h4>Key points and data</h4><ul><li><b>State functions:</b> P, V, T, U, H, S, A, G, and all specific and molar forms.</li><li><b>Path functions:</b> heat Q, work W, and heat-transfer rate Q̇, power Ẇ.</li><li>Two different paths between the same two states give different Q and W, but exactly the same ΔU and ΔH.</li><li>Notation: d for an exact differential (property), δ for an inexact one (path function). Many textbooks simply write dQ and dW, which is loose but common.</li></ul><h4>Qualification</h4><p>Heat and work are not stored in a body: it is meaningless to ask how much heat a gas 'contains'. A gas contains internal energy; heat and work are the two ways that energy crosses the boundary. Marks are lost for writing 'the heat of the gas is 50 kJ' when the correct statement is '50 kJ of heat was supplied to the gas'.</p>
      gu: |-
        <h4>વ્યાખ્યા / સિદ્ધાંત</h4><p><b>State function</b> (property) ફક્ત system ની હાલની state પર આધાર રાખે છે; બે state વચ્ચેનો તેનો ફેરફાર કેવી રીતે થયો તેના પર આધાર રાખતો નથી. U, H, S, T, P, V તથા ρ state functions છે અને તેમનું differential <b>exact</b> છે (∮dU = 0). <b>Path function</b> લીધેલા રસ્તા પર આધાર રાખે છે; heat Q તથા work W path functions છે અને તેમનું differential inexact છે (δQ, δW).</p><h4>વિગતવાર Theory તથા Conditions</h4><p>આ એક ભેદ પ્રથમ નિયમનું સ્વરૂપ સમજાવે છે. U state function હોવાથી dU exact છે અને બે state વચ્ચે integrate કરી શકાય; Q તથા W નહીં, તેથી પ્રથમ નિયમ δQ − δW = dU લખાય છે, જ્યાં δ યાદ કરાવે છે કે બંને પદ નિશ્ચિત path પર જ ગણવા પડે. <b>Cycle</b> માં system પાછું પોતાના પ્રારંભિક state પર આવે છે, તેથી ΔU = 0 જ્યારે Q તથા W સામાન્ય રીતે શૂન્ય હોતા નથી — ખરેખર cycle નું net work net heat જેટલું જ હોય છે. ઉપયોગી પરિણામ: property table માં લખી શકાય તેવી દરેક રાશિ state function હોવી જોઈએ, અને જેની કિંમત ફક્ત process ના વર્ણન સાથે જ કહી શકાય તે path function છે.</p><h4>સમીકરણો તથા Notation</h4><div class="math" data-tex="\int_1^2 dU=U_2-U_1" aria-label="\int_1^2 dU=U_2-U_1">state function:  ∫₁² dU = U₂ − U₁  (exact)</div><div class="math" data-tex="Q,W\ \text{path dependent}" aria-label="Q,W\ \text{path dependent}">path function:  Q and W depend on the route</div><div class="math" data-tex="\oint dU=0\Rightarrow Q_{net}=W_{net}" aria-label="\oint dU=0\Rightarrow Q_{net}=W_{net}">cycle:  ΔU = 0  ⇒  Q_net = W_net</div><h4>મુખ્ય મુદ્દા તથા data</h4><ul><li><b>State functions:</b> P, V, T, U, H, S, A, G, and all specific and molar forms.</li><li><b>Path functions:</b> heat Q, work W, and heat-transfer rate Q̇, power Ẇ.</li><li>Two different paths between the same two states give different Q and W, but exactly the same ΔU and ΔH.</li><li>Notation: d for an exact differential (property), δ for an inexact one (path function). Many textbooks simply write dQ and dW, which is loose but common.</li></ul><h4>નોંધ</h4><p>Heat તથા work શરીરમાં સંગ્રહાયતા નથી: gas માં કેટલી heat 'ભરેલી' છે તેવું પૂછવું અર્થહીન છે. Gas માં internal energy હોય છે; heat તથા work એ boundary પાર ઊર્જા જવાની બે રીતો છે. 'gas ની heat 50 kJ છે' લખવાથી માર્ક કપાય, સાચું વિધાન 'gas ને 50 kJ heat આપી' છે.</p>
- title:
    en: 1.5  Reversible and irreversible processes
    gu: 1.5  Reversible તથા irreversible પ્રક્રિયા
  items:
  - h:
      en: Reversible and irreversible processes
      gu: Reversible તથા irreversible પ્રક્રિયા
    body:
      en: |-
        <h4>Definition / principle</h4><p>A <b>reversible process</b> is an idealised process that proceeds through a continuous series of equilibrium states and can be reversed by an infinitesimal change in the surroundings, leaving no trace on either the system or the surroundings. Every real process is <b>irreversible</b>: it has a definite direction and leaves a permanent change in the universe.</p><h4>Detailed theory and conditions</h4><p>Reversibility is a limit, not an operating condition, and it is the limit that matters: a reversible process delivers the <b>maximum work</b> and needs the <b>minimum work</b> of any process between the same two states, so it supplies the benchmark against which a real machine is judged (its isentropic or second-law efficiency). The causes of irreversibility are always the same short list: friction, unrestrained expansion, heat transfer across a finite temperature difference, mixing of fluids at different compositions, and electrical resistance. A process can be reversible only if it is also quasistatic — slow enough for every intermediate state to be an equilibrium state — but quasistatic alone is not enough, since a slow process with friction is still irreversible.</p><h4>Equations and notation</h4><div class="math" data-tex="W_{rev}=\int P\,dV" aria-label="W_{rev}=\int P\,dV">W_rev = ∫ P dV   (area under the path on a P–V diagram)</div><div class="math" data-tex="|W_{rev}|\ge|W_{irrev}|" aria-label="|W_{rev}|\ge|W_{irrev}|">|W_rev| ≥ |W_irrev|   and   Q_rev ≥ Q_irrev  (for work-producing processes)</div><div class="math" data-tex="\eta_{II}=W_{act}/W_{rev}" aria-label="\eta_{II}=W_{act}/W_{rev}">second-law efficiency  η_II = W_actual / W_rev</div><h4>Key points and data</h4><ul><li><b>Reversible:</b> infinitely slow, no friction, no finite ΔT for heat transfer, no unrestrained expansion, equilibrium at every instant.</li><li><b>Irreversible:</b> finite driving force, friction, mixing, throttling, free expansion, electric heating, chemical reaction at a finite rate.</li><li><b>Quasistatic ≠ reversible:</b> a very slow paddle-wheel stirrer is quasistatic but irreversible.</li><li><b>Free expansion of a gas into vacuum</b> is the standard irreversible process: no work is done, no heat is transferred, and the gas can never return to its original volume by itself.</li></ul><h4>Qualification</h4><p>Work computed as ∫P dV is valid only for a reversible (or quasistatic) path. For an irreversible process the pressure inside the gas is not uniform, so the integral does not represent the work done; the work must then be obtained from the first law with a separately known heat or from the surroundings side of the boundary.</p>
      gu: |-
        <h4>વ્યાખ્યા / સિદ્ધાંત</h4><p><b>Reversible process</b> એ આદર્શ પ્રક્રિયા છે જે સતત equilibrium states ની શ્રેણીમાંથી પસાર થાય છે અને surroundings માં અતિ સૂક્ષ્મ ફેરફારથી ઉલટાવી શકાય છે, જેની કોઈ નિશાની system કે surroundings પર રહેતી નથી. દરેક વાસ્તવિક પ્રક્રિયા <b>irreversible</b> છે: તેની ચોક્કસ દિશા હોય છે અને universe માં કાયમી ફેરફાર છોડે છે.</p><h4>વિગતવાર Theory તથા Conditions</h4><p>Reversibility એ મર્યાદા છે, ઓપરેટિંગ શરત નથી, અને એ જ મર્યાદા મહત્વની છે: reversible process સરખા બે states વચ્ચેની કોઈપણ પ્રક્રિયા કરતાં <b>મહત્તમ work</b> આપે છે અને <b>ઓછામાં ઓછું work</b> માંગે છે, તેથી તે વાસ્તવિક machine ને માપવાનું માપદંડ બને છે (તેની isentropic કે second-law efficiency). Irreversibility ના કારણો હંમેશા એ જ ટૂંકી યાદી છે: friction, અનિયંત્રિત expansion, મર્યાદિત temperature તફાવત પર heat transfer, જુદી composition ના fluids નું mixing, અને electrical resistance. પ્રક્રિયા reversible ત્યારે જ હોઈ શકે જ્યારે તે quasistatic પણ હોય — એટલી ધીમી કે દરેક મધ્યવર્તી state equilibrium state હોય — પણ ફક્ત quasistatic પૂરતું નથી, કારણ કે friction સાથેની ધીમી પ્રક્રિયા પણ irreversible જ રહે છે.</p><h4>સમીકરણો તથા Notation</h4><div class="math" data-tex="W_{rev}=\int P\,dV" aria-label="W_{rev}=\int P\,dV">W_rev = ∫ P dV   (area under the path on a P–V diagram)</div><div class="math" data-tex="|W_{rev}|\ge|W_{irrev}|" aria-label="|W_{rev}|\ge|W_{irrev}|">|W_rev| ≥ |W_irrev|   and   Q_rev ≥ Q_irrev  (for work-producing processes)</div><div class="math" data-tex="\eta_{II}=W_{act}/W_{rev}" aria-label="\eta_{II}=W_{act}/W_{rev}">second-law efficiency  η_II = W_actual / W_rev</div><h4>મુખ્ય મુદ્દા તથા data</h4><ul><li><b>Reversible:</b> infinitely slow, no friction, no finite ΔT for heat transfer, no unrestrained expansion, equilibrium at every instant.</li><li><b>Irreversible:</b> finite driving force, friction, mixing, throttling, free expansion, electric heating, chemical reaction at a finite rate.</li><li><b>Quasistatic ≠ reversible:</b> a very slow paddle-wheel stirrer is quasistatic but irreversible.</li><li><b>Free expansion of a gas into vacuum</b> is the standard irreversible process: no work is done, no heat is transferred, and the gas can never return to its original volume by itself.</li></ul><h4>નોંધ</h4><p>∫P dV તરીકે ગણાતું work ફક્ત reversible (કે quasistatic) path માટે માન્ય છે. Irreversible પ્રક્રિયામાં gas ની અંદર pressure સરખું હોતું નથી, તેથી એ integral work દર્શાવતું નથી; ત્યારે work પ્રથમ નિયમમાંથી, અલગથી જાણીતી heat સાથે, કે boundary ની surroundings બાજુથી મેળવવું પડે.</p>
    diagram: d1_reversible_path
- title:
    en: 1.6  Steady state and equilibrium
    gu: 1.6  Steady state તથા equilibrium
  items:
  - h:
      en: Steady state and equilibrium — four kinds of equilibrium
      gu: Steady state તથા equilibrium — ચાર પ્રકારનું equilibrium
    body:
      en: |-
        <h4>Definition / principle</h4><p>A system is in <b>equilibrium</b> when no <i>net</i> change of any kind takes place with time and no driving force remains inside it. A system is in a <b>steady state</b> when its properties at each point do not change with time, even though matter flows through it and driving forces do remain. Equilibrium is a special, limiting case of steady state; steady state does not require equilibrium.</p><h4>Detailed theory and conditions</h4><p>Four equilibria must all hold before a two-phase system can be called in complete <b>thermodynamic equilibrium</b>. <b>Mechanical:</b> pressure is the same throughout (otherwise the fluid accelerates). <b>Thermal:</b> temperature is the same throughout (otherwise heat flows). <b>Chemical:</b> the chemical potential of every species is the same in every phase (otherwise matter redistributes or reacts). <b>Phase:</b> for each component the fugacity — equivalently the chemical potential — is equal across phases, so no phase grows or shrinks. A reacting gas mixture sitting at uniform P and T but not at reaction equilibrium is therefore not in complete equilibrium, and its state cannot be fixed with two properties alone.</p><h4>Equations and notation</h4><div class="math" data-tex="P_1=P_2,\ T_1=T_2" aria-label="P_1=P_2,\ T_1=T_2">mechanical:  P₁ = P₂   thermal:  T₁ = T₂</div><div class="math" data-tex="\mu_i^{(1)}=\mu_i^{(2)}" aria-label="\mu_i^{(1)}=\mu_i^{(2)}">chemical / phase:  μᵢ(1) = μᵢ(2)  for every component i</div><div class="math" data-tex="dm/dt=0,\ dE/dt=0" aria-label="dm/dt=0,\ dE/dt=0">steady state:  dm/dt = 0  and  dE/dt = 0  at every point</div><h4>Key points and data</h4><ul><li><b>Equilibrium:</b> nothing changes anywhere, no driving force left. Both the mass and the energy inside the control volume are constant.</li><li><b>Steady state:</b> everything is constant in time at each point, but mass and energy are continuously flowing through. Example: a running heat exchanger.</li><li><b>Unsteady (transient) state:</b> properties change with time. Examples: start-up, shutdown, a batch reactor, a vessel being filled.</li><li><b>Thermal equilibrium</b> is what a thermometer measures; <b>mechanical equilibrium</b> is what a pressure gauge measures.</li></ul><h4>Qualification</h4><p>In practice most plant equipment operates at steady state but <i>not</i> at equilibrium — a heat exchanger is in steady state precisely because a temperature difference is maintained across each surface. Only the outlet streams, if they leave an equilibrium stage, can be treated as equilibrium states.</p>
      gu: |-
        <h4>વ્યાખ્યા / સિદ્ધાંત</h4><p>System માં કોઈપણ પ્રકારનો <i>net</i> ફેરફાર સમય સાથે ન થાય અને અંદર કોઈ driving force ન બચે ત્યારે તે <b>equilibrium</b> માં છે. જ્યારે દરેક બિંદુએ properties સમય સાથે ન બદલાય, પણ system માંથી matter વહે છે અને driving forces બાકી રહે છે ત્યારે તે <b>steady state</b> માં છે. Equilibrium એ steady state નો ખાસ, મર્યાદિત કિસ્સો છે; steady state માટે equilibrium જરૂરી નથી.</p><h4>વિગતવાર Theory તથા Conditions</h4><p>બે-તબક્કાની system ને સંપૂર્ણ <b>thermodynamic equilibrium</b> કહેવા માટે ચારેય equilibrium જળવવા જોઈએ. <b>Mechanical:</b> બધે pressure સરખું (નહીં તો fluid ગતિ કરે). <b>Thermal:</b> બધે temperature સરખું (નહીં તો heat વહે). <b>Chemical:</b> દરેક species નું chemical potential દરેક phase માં સરખું (નહીં તો matter ફરી વહેંચાય કે પ્રક્રિયા થાય). <b>Phase:</b> દરેક component માટે fugacity — એટલે કે chemical potential — phases વચ્ચે સરખું, તેથી કોઈ phase વધે કે ઘટે નહીં. સમાન P તથા T પર બેઠેલું પણ reaction equilibrium પર ન હોય તેવું reacting gas mixture સંપૂર્ણ equilibrium માં નથી, અને તેની state ફક્ત બે properties થી નક્કી થઈ શકતી નથી.</p><h4>સમીકરણો તથા Notation</h4><div class="math" data-tex="P_1=P_2,\ T_1=T_2" aria-label="P_1=P_2,\ T_1=T_2">mechanical:  P₁ = P₂   thermal:  T₁ = T₂</div><div class="math" data-tex="\mu_i^{(1)}=\mu_i^{(2)}" aria-label="\mu_i^{(1)}=\mu_i^{(2)}">chemical / phase:  μᵢ(1) = μᵢ(2)  for every component i</div><div class="math" data-tex="dm/dt=0,\ dE/dt=0" aria-label="dm/dt=0,\ dE/dt=0">steady state:  dm/dt = 0  and  dE/dt = 0  at every point</div><h4>મુખ્ય મુદ્દા તથા data</h4><ul><li><b>Equilibrium:</b> nothing changes anywhere, no driving force left. Both the mass and the energy inside the control volume are constant.</li><li><b>Steady state:</b> everything is constant in time at each point, but mass and energy are continuously flowing through. Example: a running heat exchanger.</li><li><b>Unsteady (transient) state:</b> properties change with time. Examples: start-up, shutdown, a batch reactor, a vessel being filled.</li><li><b>Thermal equilibrium</b> is what a thermometer measures; <b>mechanical equilibrium</b> is what a pressure gauge measures.</li></ul><h4>નોંધ</h4><p>વ્યવહારમાં મોટાભાગનાં plant equipment steady state પર ચાલે છે પણ equilibrium પર <i>નહીં</i> — heat exchanger steady state માં છે કારણ કે દરેક સપાટી પર temperature તફાવત જાળવેલો હોય છે. ફક્ત equilibrium stage માંથી નીકળતા outlet streams ને જ equilibrium states ગણી શકાય.</p>
- title:
    en: 1.7  Force, pressure, work, power and energy
    gu: 1.7  Force, pressure, work, power તથા energy
  items:
  - h:
      en: Force, pressure, work, power and energy
      gu: Force, pressure, work, power તથા energy
    body:
      en: |-
        <h4>Definition / principle</h4><p><b>Force</b> is that which changes or tends to change the state of rest or motion of a body, F = m a, measured in newtons (1 N = 1 kg·m/s²). <b>Pressure</b> is the normal force per unit area, P = F/A (N/m² = Pa). <b>Work</b> is energy transferred by a force acting through a displacement, W = ∫F dx. <b>Power</b> is the rate of energy transfer, P = W/t or F·u, in watts (1 W = 1 J/s). <b>Energy</b> is the capacity to produce work.</p><h4>Detailed theory and conditions</h4><p>Two traps decide the marks in this topic. The first is <b>gauge versus absolute pressure</b>: a gauge reads the difference between the inside and outside pressure, so P_abs = P_gauge + P_atm, and only absolute pressure may be used in the gas law. A vacuum gauge reads negative gauge pressure. The second is <b>sign convention</b>: this course uses heat added <i>to</i> the system as positive and work done <i>by</i> the system as positive, so a compressor that receives work has W negative. Many textbooks use the IUPAC convention (work done on the system positive); state which convention you use before substituting numbers.<br><br>Work is a <i>path</i> quantity in general, but two mechanical forms recur so often that they should be known by heart: displacement work of a fluid, W = ∫P dV, and shaft work, W = 2π N T (N in revolutions per second, T in N·m). Electrical work V I t and spring work ½kx² behave in the same bookkeeping way.</p><h4>Equations and notation</h4><div class="math" data-tex="F=ma" aria-label="F=ma">F = m a        [N = kg·m/s²]</div><div class="math" data-tex="P=F/A" aria-label="P=F/A">P = F / A        [Pa = N/m²]</div><div class="math" data-tex="P_{abs}=P_{gauge}+P_{atm}" aria-label="P_{abs}=P_{gauge}+P_{atm}">P_abs = P_gauge + P_atm        P_vac = P_atm − P_abs</div><div class="math" data-tex="W=\int P\,dV,\quad W_{sh}=2\pi NT" aria-label="W=\int P\,dV,\quad W_{sh}=2\pi NT">W = ∫ P dV      W_shaft = 2π N T      Power = W / t</div><h4>Key points and data</h4><ul><li><b>Pressure units:</b> 1 bar = 10⁵ Pa = 100 kPa; 1 atm = 101 325 Pa = 1.013 25 bar; 1 kgf/cm² = 98 066.5 Pa ≈ 0.981 bar; 760 mmHg = 1 atm = 101.325 kPa.</li><li><b>Energy units:</b> 1 kJ = 10³ J; 1 kcal = 4.1868 kJ; 1 kWh = 3.6 MJ; 1 hp = 0.7457 kW; 1 Btu = 1.055 kJ.</li><li><b>Standard atmosphere:</b> P_atm = 1.013 25 bar = 760 mm Hg = 10.33 m of water.</li><li><b>Datum:</b> energy has no absolute zero that we use; only changes are calculated, so a reference state must be declared for every energy balance.</li></ul><h4>Qualification</h4><p>A pressure gauge on a vessel reading 3.5 bar with the barometer at 1.01 bar does not mean the gas is at 3.5 bar absolute — it is at 4.51 bar absolute. Every equation of state, every steam table and every saturation temperature uses absolute pressure.</p>
      gu: |-
        <h4>વ્યાખ્યા / સિદ્ધાંત</h4><p><b>Force</b> એ શરીરની સ્થિર કે ગતિની અવસ્થા બદલે કે બદલવાની પ્રવૃત્તિ કરે તે છે, F = m a, ન્યૂટનમાં (1 N = 1 kg·m/s²). <b>Pressure</b> એ એકમ ક્ષેત્રફળ પરનું લંબ બળ, P = F/A (N/m² = Pa). <b>Work</b> એ બળ દ્વારા સ્થાનાંતર સાથે પસાર થતી ઊર્જા, W = ∫F dx. <b>Power</b> એ ઊર્જા પસાર થવાનો દર, P = W/t કે F·u, વોટમાં (1 W = 1 J/s). <b>Energy</b> એ work કરવાની ક્ષમતા છે.</p><h4>વિગતવાર Theory તથા Conditions</h4><p>આ વિષયમાં બે છટકા માર્ક નક્કી કરે છે. પહેલો <b>gauge તથા absolute pressure</b> નો છે: gauge અંદરના તથા બહારના pressure નો તફાવત વાંચે છે, તેથી P_abs = P_gauge + P_atm, અને gas law માં ફક્ત absolute pressure વાપરી શકાય. Vacuum gauge ઋણ gauge pressure વાંચે છે. બીજો <b>sign convention</b> નો છે: આ અભ્યાસક્રમમાં system <i>ને</i> અપાયેલી heat ધન અને system <i>દ્વારા</i> થયેલું work ધન ગણાય છે, તેથી work મેળવતા compressor નું W ઋણ થાય. ઘણા પુસ્તકો IUPAC convention વાપરે છે (system પર થયેલું work ધન); આંકડા મૂકતાં પહેલાં તમે કઈ convention વાપરો છો તે લખો.<br><br>Work સામાન્ય રીતે <i>path</i> રાશિ છે, પણ બે mechanical સ્વરૂપ એટલા વારંવાર આવે છે કે તે મોઢે યાદ હોવા જોઈએ: fluid નું displacement work, W = ∫P dV, અને shaft work, W = 2π N T (N revolution per second માં, T N·m માં). Electrical work V I t તથા spring work ½kx² પણ એ જ હિસાબમાં આવે છે.</p><h4>સમીકરણો તથા Notation</h4><div class="math" data-tex="F=ma" aria-label="F=ma">F = m a        [N = kg·m/s²]</div><div class="math" data-tex="P=F/A" aria-label="P=F/A">P = F / A        [Pa = N/m²]</div><div class="math" data-tex="P_{abs}=P_{gauge}+P_{atm}" aria-label="P_{abs}=P_{gauge}+P_{atm}">P_abs = P_gauge + P_atm        P_vac = P_atm − P_abs</div><div class="math" data-tex="W=\int P\,dV,\quad W_{sh}=2\pi NT" aria-label="W=\int P\,dV,\quad W_{sh}=2\pi NT">W = ∫ P dV      W_shaft = 2π N T      Power = W / t</div><h4>મુખ્ય મુદ્દા તથા data</h4><ul><li><b>Pressure units:</b> 1 bar = 10⁵ Pa = 100 kPa; 1 atm = 101 325 Pa = 1.013 25 bar; 1 kgf/cm² = 98 066.5 Pa ≈ 0.981 bar; 760 mmHg = 1 atm = 101.325 kPa.</li><li><b>Energy units:</b> 1 kJ = 10³ J; 1 kcal = 4.1868 kJ; 1 kWh = 3.6 MJ; 1 hp = 0.7457 kW; 1 Btu = 1.055 kJ.</li><li><b>Standard atmosphere:</b> P_atm = 1.013 25 bar = 760 mm Hg = 10.33 m of water.</li><li><b>Datum:</b> energy has no absolute zero that we use; only changes are calculated, so a reference state must be declared for every energy balance.</li></ul><h4>નોંધ</h4><p>barometer 1.01 bar હોય ત્યારે vessel પરનો gauge 3.5 bar વાંચે તો gas 3.5 bar absolute પર નથી — તે 4.51 bar absolute પર છે. દરેક equation of state, દરેક steam table તથા દરેક saturation temperature absolute pressure વાપરે છે.</p>
    diagram: d1_energy_bookkeeping
- title:
    en: 1.8  Gibb's phase rule and degrees of freedom
    gu: 1.8  ગિબ્સ phase rule તથા degrees of freedom
  items:
  - h:
      en: Gibb's phase rule and degrees of freedom
      gu: ગિબ્સ phase rule તથા degrees of freedom
    body:
      en: |-
        <h4>Definition / principle</h4><p><b>Gibb's phase rule</b> gives the number of intensive properties that must be fixed independently before the state of a heterogeneous system is fully determined. It is written <b>F = C − P + 2</b> for a system in which only temperature and pressure are imposed from outside, where F is the degrees of freedom, C the number of components and P the number of phases present.</p><h4>Detailed theory and conditions</h4><p>The rule is obtained by counting: a system of C components in P phases has P(C − 1) composition variables (mole fractions in each phase sum to one), plus 2 for T and P, giving C P + 2 unknowns. Equilibrium between phases supplies (P − 1) equalities of chemical potential for each of the C components, i.e. C(P − 1) equations. Subtracting, F = C P + 2 − C(P − 1) = C − P + 2.<br><br>The number 2 is the count of externally imposed intensive variables. When one of them is fixed by the equipment rather than free — in a closed vessel with no pressure control, or during a chemical reaction where the composition is no longer free — the condensed form <b>F = C − P + 1</b> is used. The rule says nothing about how much of each phase is present; that needs material balances as well.</p><h4>Equations and notation</h4><div class="math" data-tex="F=C-P+2" aria-label="F=C-P+2">F = C − P + 2        (full form)</div><div class="math" data-tex="F=C-P+1" aria-label="F=C-P+1">F = C − P + 1        (one variable fixed: condensed form)</div><div class="math" data-tex="F=1-3+2=0" aria-label="F=1-3+2=0">water at the triple point:  C = 1, P = 3  ⇒  F = 0</div><h4>Key points and data</h4><ul><li><b>Water, single phase</b> (steam or liquid): C = 1, P = 1 ⇒ F = 2 (fix T and P).</li><li><b>Water boiling</b> (liquid + vapour): C = 1, P = 2 ⇒ F = 1 (fix T, P comes from the steam table).</li><li><b>Water at the triple point:</b> C = 1, P = 3 ⇒ F = 0 (0.01 °C, 0.006 11 bar — no freedom at all).</li><li><b>Air on a tray</b> (N₂ + O₂ in one gas phase): C = 2, P = 1 ⇒ F = 3.</li><li><b>Number of components</b> C = number of species − number of independent reactions − constraints, not simply the number of chemicals present.</li></ul><h4>Qualification</h4><p>The phase rule is a necessary condition only: it tells how many variables you may choose, not which values are physically reachable. F = 2 for liquid water does not mean water at 25 °C and 500 bar behaves as an ideal liquid, and it says nothing about a metastable system such as supercooled water.</p>
      gu: |-
        <h4>વ્યાખ્યા / સિદ્ધાંત</h4><p><b>ગિબ્સ phase rule</b> કહે છે કે heterogeneous system ની state પૂરી રીતે નક્કી થાય તે પહેલાં કેટલી intensive properties સ્વતંત્ર રીતે નિશ્ચિત કરવી પડે. જ્યાં ફક્ત temperature તથા pressure બહારથી લાદવામાં આવે તેવી system માટે તે <b>F = C − P + 2</b> લખાય છે, જ્યાં F degrees of freedom, C components ની સંખ્યા અને P હાજર phases ની સંખ્યા છે.</p><h4>વિગતવાર Theory તથા Conditions</h4><p>નિયમ ગણતરી દ્વારા મળે છે: P phases માં C components ની system માં P(C − 1) composition variables હોય (દરેક phase માં mole fractions નો સરવાળો એક), તેમાં T તથા P માટે 2 ઉમેરતાં C P + 2 અજાણ્યાં મળે. Phases વચ્ચેનું equilibrium C components માટે (P − 1) chemical potential બરાબરીઓ આપે, એટલે કે C(P − 1) સમીકરણો. બાદ કરતાં F = C P + 2 − C(P − 1) = C − P + 2.<br><br>આંકડો 2 બહારથી લાદવામાં આવતા intensive variables ની ગણતરી છે. જ્યારે તેમાંથી એક equipment દ્વારા નિશ્ચિત થાય, સ્વતંત્ર ન રહે — pressure control વગરના closed vessel માં, કે chemical reaction દરમિયાન જ્યાં composition સ્વતંત્ર નથી — ત્યારે condensed સ્વરૂપ <b>F = C − P + 1</b> વપરાય. નિયમ એ કહેતો નથી કે દરેક phase કેટલી છે; તેના માટે material balances પણ જોઈએ.</p><h4>સમીકરણો તથા Notation</h4><div class="math" data-tex="F=C-P+2" aria-label="F=C-P+2">F = C − P + 2        (full form)</div><div class="math" data-tex="F=C-P+1" aria-label="F=C-P+1">F = C − P + 1        (one variable fixed: condensed form)</div><div class="math" data-tex="F=1-3+2=0" aria-label="F=1-3+2=0">water at the triple point:  C = 1, P = 3  ⇒  F = 0</div><h4>મુખ્ય મુદ્દા તથા data</h4><ul><li><b>Water, single phase</b> (steam or liquid): C = 1, P = 1 ⇒ F = 2 (fix T and P).</li><li><b>Water boiling</b> (liquid + vapour): C = 1, P = 2 ⇒ F = 1 (fix T, P comes from the steam table).</li><li><b>Water at the triple point:</b> C = 1, P = 3 ⇒ F = 0 (0.01 °C, 0.006 11 bar — no freedom at all).</li><li><b>Air on a tray</b> (N₂ + O₂ in one gas phase): C = 2, P = 1 ⇒ F = 3.</li><li><b>Number of components</b> C = number of species − number of independent reactions − constraints, not simply the number of chemicals present.</li></ul><h4>નોંધ</h4><p>Phase rule ફક્ત necessary condition છે: તે કહે છે કે કેટલા variables પસંદ કરી શકાય, પણ કઈ કિંમતો ભૌતિક રીતે શક્ય છે તે નહીં. પ્રવાહી પાણી માટે F = 2 એનો અર્થ એ નથી કે 25 °C તથા 500 bar પર પાણી ideal liquid જેવું વર્તે, અને supercooled water જેવી metastable system વિશે તે કંઈ કહેતું નથી.</p>
    diagram: d1_phase_rule
- title:
    en: 1.9  Zeroth law of thermodynamics
    gu: 1.9  થર્મોડાયનેમિક્સનો ઝીરોથ નિયમ
  items:
  - h:
      en: Zeroth law of thermodynamics
      gu: થર્મોડાયનેમિક્સનો ઝીરોથ નિયમ
    body:
      en: |-
        <h4>Definition / principle</h4><p><b>Zeroth law:</b> if two bodies A and C are each in thermal equilibrium with a third body B, then A and C are in thermal equilibrium with each other. It was stated after the first and second laws had already been numbered, yet it is logically prior to them — hence the name.</p><h4>Detailed theory and conditions</h4><p>The law is the logical foundation of temperature measurement. Because thermal equilibrium is transitive, all bodies in equilibrium with each other share one property; that property is what we call temperature, and the third body B is the thermometer. Every thermometer works by this route: it is placed in contact with the system, it reaches equilibrium, and its own state (the length of the mercury column, the resistance of the wire, the emf of the thermocouple) is read and converted to a number.<br><br>The law also fixes the meaning of the phrase 'same temperature': it does not mean 'looks equally hot' and it does not need any heat to flow. If a thermometer reads the same before and after it is placed in a vessel, that vessel is at the thermometer's temperature, whether any heat was exchanged or not.</p><h4>Equations and notation</h4><div class="math" data-tex="A\sim B,\ B\sim C\Rightarrow A\sim C" aria-label="A\sim B,\ B\sim C\Rightarrow A\sim C">A ~ B  and  B ~ C   ⇒   A ~ C</div><div class="math" data-tex="T_A=T_B=T_C" aria-label="T_A=T_B=T_C">thermal equilibrium ⇔ equal temperature</div><h4>Key points and data</h4><ul><li><b>Significance:</b> it makes temperature a valid, measurable property and licenses the thermometer.</li><li><b>Order of laws:</b> zeroth (temperature exists) → first (energy is conserved) → second (direction of change) → third (entropy of a perfect crystal at 0 K).</li><li><b>Not in the zeroth law:</b> it says nothing about how much heat flows, nor about the time needed to reach equilibrium.</li><li><b>Everyday check:</b> a cold metal spoon and a wooden spoon in the same drawer are at the same temperature, although the metal feels colder because heat leaves your finger faster. Feeling is a rate effect, not a temperature reading.</li></ul><h4>Qualification</h4><p>The law uses diathermic walls (walls that allow heat to pass). If B is separated from A by an adiabatic wall, no equilibrium is established and no conclusion may be drawn — a vacuum flask is not a thermometer.</p>
      gu: |-
        <h4>વ્યાખ્યા / સિદ્ધાંત</h4><p><b>ઝીરોથ નિયમ:</b> બે શરીર A તથા C દરેક જો ત્રીજા શરીર B સાથે thermal equilibrium માં હોય, તો A તથા C એકબીજા સાથે પણ thermal equilibrium માં હોય છે. તે પ્રથમ તથા દ્વિતીય નિયમો ક્રમાંકિત થયા પછી કહેવાયો, છતાં તાર્કિક રીતે તેમની પહેલાં આવે છે — એટલે તેનું નામ.</p><h4>વિગતવાર Theory તથા Conditions</h4><p>આ નિયમ temperature માપનનો તાર્કિક પાયો છે. Thermal equilibrium transitive હોવાથી જે શરીરો એકબીજા સાથે equilibrium માં છે તે બધા એક જ property વહેંચે છે; એ જ property ને આપણે temperature કહીએ છીએ, અને ત્રીજું શરીર B એ thermometer છે. દરેક thermometer આ રીતે કામ કરે છે: તેને system ના સંપર્કમાં મૂકાય, તે equilibrium પર આવે, અને તેની પોતાની state (પારાના સ્તંભની લંબાઈ, તારનો resistance, thermocouple નું emf) વાંચીને આંકડામાં ફેરવાય છે.<br><br>નિયમ 'સરખું temperature' શબ્દનો અર્થ પણ નિશ્ચિત કરે છે: તેનો અર્થ 'સરખું ગરમ લાગે' નથી અને તેને heat વહેવાની જરૂર નથી. Thermometer vessel માં મૂક્યા પહેલાં તથા પછી સરખું વાંચે, તો vessel thermometer ના temperature પર છે, ભલે heat નું આદાનપ્રદાન થયું હોય કે નહીં.</p><h4>સમીકરણો તથા Notation</h4><div class="math" data-tex="A\sim B,\ B\sim C\Rightarrow A\sim C" aria-label="A\sim B,\ B\sim C\Rightarrow A\sim C">A ~ B  and  B ~ C   ⇒   A ~ C</div><div class="math" data-tex="T_A=T_B=T_C" aria-label="T_A=T_B=T_C">thermal equilibrium ⇔ equal temperature</div><h4>મુખ્ય મુદ્દા તથા data</h4><ul><li><b>Significance:</b> it makes temperature a valid, measurable property and licenses the thermometer.</li><li><b>Order of laws:</b> zeroth (temperature exists) → first (energy is conserved) → second (direction of change) → third (entropy of a perfect crystal at 0 K).</li><li><b>Not in the zeroth law:</b> it says nothing about how much heat flows, nor about the time needed to reach equilibrium.</li><li><b>Everyday check:</b> a cold metal spoon and a wooden spoon in the same drawer are at the same temperature, although the metal feels colder because heat leaves your finger faster. Feeling is a rate effect, not a temperature reading.</li></ul><h4>નોંધ</h4><p>નિયમ diathermic દીવાલો (heat પસાર થવા દેતી દીવાલો) માટે છે. જો B ને A થી adiabatic દીવાલ અલગ કરે, તો equilibrium સ્થપાતું નથી અને કોઈ નિષ્કર્ષ નીકળી શકે નહીં — vacuum flask એ thermometer નથી.</p>
    diagram: d1_zeroth_law
- title:
    en: 1.10  Temperature and temperature scales
    gu: 1.10  Temperature તથા temperature scales
  items:
  - h:
      en: Temperature and the four temperature scales
      gu: Temperature તથા ચાર temperature scales
    body:
      en: |-
        <h4>Definition / principle</h4><p><b>Temperature</b> is the property that decides whether two bodies in contact are in thermal equilibrium; it is the potential that drives heat from one body to another. It is an intensive property and has no additive meaning — two litres of water at 50 °C added to two litres at 50 °C gives four litres at 50 °C, not at 100 °C.</p><h4>Detailed theory and conditions</h4><p>Four scales appear in chemical engineering practice. The Celsius and Fahrenheit scales are relative: their zero was fixed on a substance (ice point, salt-ice mixture) and their size was set by the steam point, so both are defined today through the kelvin. The <b>kelvin</b> is the SI unit and is absolute — 0 K is the lowest temperature attainable, and the scale is defined by fixing the Boltzmann constant. The <b>Rankine</b> is the Fahrenheit-sized absolute scale, 1 R = 1 °F interval, and is still used with American data tables.<br><br>Only the absolute scales may be used in the gas law, in the Carnot efficiency and in any equation in which temperature is multiplied or divided. A temperature <i>difference</i> is numerically the same in °C and K, so ΔT(K) = ΔT(°C); the same difference in °F equals 1.8 times the Celsius difference.</p><h4>Equations and notation</h4><div class="math" data-tex="T(K)=t(^\circ C)+273.15" aria-label="T(K)=t(^\circ C)+273.15">T(K) = t(°C) + 273.15        T(R) = t(°F) + 459.67</div><div class="math" data-tex="t(^\circ F)=1.8t(^\circ C)+32" aria-label="t(^\circ F)=1.8t(^\circ C)+32">t(°F) = 1.8 t(°C) + 32        t(°C) = [t(°F) − 32] / 1.8</div><div class="math" data-tex="\Delta T(K)=\Delta T(^\circ C)" aria-label="\Delta T(K)=\Delta T(^\circ C)">ΔT(K) = ΔT(°C)        ΔT(°F) = 1.8 ΔT(°C) = 1.8 ΔT(K)</div><h4>Key points and data</h4><ul><li><b>Absolute zero:</b> 0 K = −273.15 °C = −459.67 °F = 0 R.</li><li><b>Reference points:</b> ice point 0 °C = 273.15 K = 32 °F; steam point 100 °C = 373.15 K = 212 °F at 1 atm.</li><li><b>Body temperature</b> 37 °C = 310.15 K = 98.6 °F; <b>room temperature</b> 25 °C = 298.15 K = 77 °F.</li><li><b>Triple point of water</b> is 273.16 K = 0.01 °C at 0.006 11 bar — the fixed point on which the kelvin is based.</li></ul><h4>Qualification</h4><p>Never write 'K' with a degree sign (°K is obsolete) and never use °C in a ratio. Doubling 20 °C gives 40 °C arithmetic but is physically meaningless; doubling 293 K gives 586 K, which is twice the absolute temperature and therefore twice the pressure of a fixed mass of gas at constant volume.</p>
      gu: |-
        <h4>વ્યાખ્યા / સિદ્ધાંત</h4><p><b>Temperature</b> એ એવી property છે જે નક્કી કરે કે સંપર્કમાં રહેલાં બે શરીર thermal equilibrium માં છે કે નહીં; તે એ potential છે જે એક શરીરથી બીજામાં heat ધકેલે છે. તે intensive property છે અને તેનો સરવાળાનો અર્થ નથી — 50 °C ના બે લિટર પાણીમાં 50 °C ના બે લિટર ઉમેરતાં ચાર લિટર 50 °C મળે, 100 °C નહીં.</p><h4>વિગતવાર Theory તથા Conditions</h4><p>Chemical engineering વ્યવહારમાં ચાર scales આવે છે. Celsius તથા Fahrenheit relative છે: તેમનું શૂન્ય કોઈ પદાર્થ પર નિશ્ચિત થયું (બરફનો બિંદુ, મીઠા-બરફનું મિશ્રણ) અને તેમનું માપ steam point થી નિશ્ચિત થયું, તેથી આજે બંને kelvin દ્વારા વ્યાખ્યાયિત થાય છે. <b>કેલ્વિન</b> SI એકમ છે અને absolute છે — 0 K એ પ્રાપ્ય સૌથી નીચું temperature છે, અને scale Boltzmann constant નિશ્ચિત કરીને વ્યાખ્યાયિત થાય છે. <b>Rankine</b> એ Fahrenheit માપનું absolute scale છે, 1 R = 1 °F નો અંતરાલ, અને અમેરિકન data tables સાથે હજી વપરાય છે.<br><br>Gas law માં, Carnot efficiency માં અને જ્યાં temperature નો ગુણાકાર કે ભાગાકાર થાય તેવા કોઈપણ સમીકરણમાં ફક્ત absolute scales વાપરી શકાય. Temperature નો <i>તફાવત</i> °C તથા K માં આંકડાકીય રીતે સરખો હોય છે, તેથી ΔT(K) = ΔT(°C); એ જ તફાવત °F માં Celsius ના તફાવત કરતાં 1.8 ગણો હોય છે.</p><h4>સમીકરણો તથા Notation</h4><div class="math" data-tex="T(K)=t(^\circ C)+273.15" aria-label="T(K)=t(^\circ C)+273.15">T(K) = t(°C) + 273.15        T(R) = t(°F) + 459.67</div><div class="math" data-tex="t(^\circ F)=1.8t(^\circ C)+32" aria-label="t(^\circ F)=1.8t(^\circ C)+32">t(°F) = 1.8 t(°C) + 32        t(°C) = [t(°F) − 32] / 1.8</div><div class="math" data-tex="\Delta T(K)=\Delta T(^\circ C)" aria-label="\Delta T(K)=\Delta T(^\circ C)">ΔT(K) = ΔT(°C)        ΔT(°F) = 1.8 ΔT(°C) = 1.8 ΔT(K)</div><h4>મુખ્ય મુદ્દા તથા data</h4><ul><li><b>Absolute zero:</b> 0 K = −273.15 °C = −459.67 °F = 0 R.</li><li><b>Reference points:</b> ice point 0 °C = 273.15 K = 32 °F; steam point 100 °C = 373.15 K = 212 °F at 1 atm.</li><li><b>Body temperature</b> 37 °C = 310.15 K = 98.6 °F; <b>room temperature</b> 25 °C = 298.15 K = 77 °F.</li><li><b>Triple point of water</b> is 273.16 K = 0.01 °C at 0.006 11 bar — the fixed point on which the kelvin is based.</li></ul><h4>નોંધ</h4><p>K સાથે ડિગ્રી ચિહ્ન કદી ન લખો (°K બહાર પડી ગયું છે) અને ગુણોત્તરમાં °C કદી ન વાપરો. 20 °C ને બમણું કરવાથી ગણિતમાં 40 °C મળે પણ ભૌતિક રીતે અર્થહીન છે; 293 K ને બમણું કરવાથી 586 K મળે, જે absolute temperature થી બમણું છે અને તેથી અચળ volume પર નિશ્ચિત mass ના gas નું pressure બમણું થાય.</p>
  - h:
      en: The ideal-gas temperature scale
      gu: Ideal-gas temperature scale
    body:
      en: |-
        <h4>Symbols, model and assumptions</h4><p><b>Model:</b> a fixed mass of an ideal gas in a rigid vessel of constant volume V; a second sample at constant pressure. <b>Assumptions:</b> the gas obeys P V = n R T exactly over the range used, the vessel is rigid and the gas has time to reach thermal equilibrium with the bath whose temperature is being defined.</p><ol><li><p>Start from the ideal-gas law for a fixed amount of gas at constant volume. The pressure of a confined gas therefore measures its temperature directly.</p><div class="math" data-tex="PV=nRT\Rightarrow P\propto T" aria-label="PV=nRT\Rightarrow P\propto T">P V = n R T   ⇒   P ∝ T   at constant V and n</div></li><li><p>Choose one reproducible state as the reference and call its temperature the fixed point T_fp; its pressure is P_fp. The reference in use is the triple point of water, T_fp = 273.16 K.</p><div class="math" data-tex="T_{fp}=273.16\ K" aria-label="T_{fp}=273.16\ K">T_fp = 273.16 K   at   P_fp = 0.006 11 bar</div></li><li><p>Write the definition of the scale in the straight-line form: the unknown temperature is proportional to the pressure measured in the gas thermometer.</p><div class="math" data-tex="T=T_{fp}\,\frac{P}{P_{fp}}" aria-label="T=T_{fp}\,\frac{P}{P_{fp}}">T = T_fp (P / P_fp)        at constant V, n</div></li><li><p>Repeat the same definition at constant pressure. Now the volume measures the temperature, which is the form used in a constant-pressure gas thermometer.</p><div class="math" data-tex="T=T_{fp}\,\frac{V}{V_{fp}}" aria-label="T=T_{fp}\,\frac{V}{V_{fp}}">T = T_fp (V / V_fp)        at constant P, n</div></li><li><p>Real gases are not ideal, so each measurement is repeated with a smaller amount of gas and the result is extrapolated to zero pressure. Only in that limit does the scale become independent of the gas used — this is why the scale is called the ideal-gas scale.</p><div class="math" data-tex="T=273.16\times\lim_{P\to 0}\frac{P}{P_{fp}}" aria-label="T=273.16\times\lim_{P\to 0}\frac{P}{P_{fp}}">T = 273.16 × lim(P→0) (P / P_fp)</div></li></ol><h4>Result</h4><div class="math" data-tex="T(K)=273.16\lim_{P\to0}\frac{P}{P_{fp}}" aria-label="T(K)=273.16\lim_{P\to0}\frac{P}{P_{fp}}">T(K) = 273.16 × (P / P_fp)|P→0        and        T(K) = t(°C) + 273.15</div>
      gu: |-
        <h4>સંકેતો, Model તથા Assumptions</h4><p><b>Model:</b> અચળ volume V ના દૃઢ પાત્રમાં નિશ્ચિત mass નો ideal gas; બીજો નમૂનો અચળ pressure પર. <b>Assumptions:</b> જે રેન્જ વપરાય તેમાં gas બરાબર P V = n R T પાળે, પાત્ર દૃઢ છે, અને જે bath નું temperature વ્યાખ્યાયિત કરવું છે તેની સાથે gas thermal equilibrium પર આવવા પૂરતો સમય મળે છે.</p><ol><li><p>અચળ volume પર નિશ્ચિત જથ્થાના gas માટે ideal-gas law થી શરૂ કરો. તેથી બંધ gas નું pressure તેના temperature ને સીધું માપે છે.</p><div class="math" data-tex="PV=nRT\Rightarrow P\propto T" aria-label="PV=nRT\Rightarrow P\propto T">P V = n R T   ⇒   P ∝ T   at constant V and n</div></li><li><p>એક પુનરાવર્તનીય state ને reference તરીકે પસંદ કરો અને તેનું temperature fixed point T_fp કહો; તેનું pressure P_fp. વપરાતો reference પાણીનો triple point છે, T_fp = 273.16 K.</p><div class="math" data-tex="T_{fp}=273.16\ K" aria-label="T_{fp}=273.16\ K">T_fp = 273.16 K   at   P_fp = 0.006 11 bar</div></li><li><p>Scale ની વ્યાખ્યા સીધી રેખાના સ્વરૂપમાં લખો: અજાણ્યું temperature gas thermometer માં મપાયેલા pressure ના પ્રમાણમાં છે.</p><div class="math" data-tex="T=T_{fp}\,\frac{P}{P_{fp}}" aria-label="T=T_{fp}\,\frac{P}{P_{fp}}">T = T_fp (P / P_fp)        at constant V, n</div></li><li><p>અચળ pressure પર એ જ વ્યાખ્યા પુનરાવર્તિત કરો. હવે volume temperature માપે છે, જે constant-pressure gas thermometer માં વપરાતું સ્વરૂપ છે.</p><div class="math" data-tex="T=T_{fp}\,\frac{V}{V_{fp}}" aria-label="T=T_{fp}\,\frac{V}{V_{fp}}">T = T_fp (V / V_fp)        at constant P, n</div></li><li><p>વાસ્તવિક gases ideal નથી, તેથી દરેક માપન gas ની ઓછી માત્રા સાથે પુનરાવર્તિત કરી શૂન્ય pressure સુધી extrapolate કરાય છે. ફક્ત એ જ મર્યાદામાં scale વપરાયેલા gas પર આધાર રાખતું નથી — એટલે જ તેને ideal-gas scale કહે છે.</p><div class="math" data-tex="T=273.16\times\lim_{P\to 0}\frac{P}{P_{fp}}" aria-label="T=273.16\times\lim_{P\to 0}\frac{P}{P_{fp}}">T = 273.16 × lim(P→0) (P / P_fp)</div></li></ol><h4>પરિણામ</h4><div class="math" data-tex="T(K)=273.16\lim_{P\to0}\frac{P}{P_{fp}}" aria-label="T(K)=273.16\lim_{P\to0}\frac{P}{P_{fp}}">T(K) = 273.16 × (P / P_fp)|P→0        and        T(K) = t(°C) + 273.15</div>
