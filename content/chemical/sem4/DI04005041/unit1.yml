th="2.0"/><polygon points="590.0,410.0 585.0,402.8 581.3,409.0" fill="#1565C0"/><text x="566.0" y="371.9" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#6B6275" font-weight="bold">W</text><text x="460.0" y="415.9" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#6B6275" font-weight="normal">control volume</text><rect x="660" y="172" width="196" height="190" rx="8" fill="#FFFFFF" stroke="#6420B8" stroke-width="2.4" stroke-dasharray="7 6"/><circle cx="758" cy="267" r="46" fill="#EADDF7" stroke="#7B2CD9" stroke-width="2"/><text x="758.0" y="266.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" fill="#6420B8" font-weight="bold">hot body +</text><text x="758.0" y="284.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" fill="#6420B8" font-weight="bold">cold body</text><text x="758.0" y="396.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" fill="#222222" font-weight="normal">no heat, no work, no mass</text><text x="758.0" y="415.9" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#6B6275" font-weight="normal">state may still change inside</text><rect x="0" y="468" width="920" height="34" rx="0" fill="#EADDF7" stroke="none" stroke-width="0"/><text x="18.0" y="490.9" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#6420B8" font-weight="bold">SURROUNDINGS  —  everything not inside the boundary</text><text x="24.0" y="532.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" fill="#6B6275" font-weight="normal">Boundary may be real (vessel wall) or imaginary (a section of pipe). It may be fixed or moving (piston face).</text><text x="24.0" y="551.7" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" fill="#6B6275" font-weight="normal">Original teaching schematic • conceptual,