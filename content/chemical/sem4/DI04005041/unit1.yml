viva:
- q:
    en: Define thermodynamics and state its scope in chemical engineering.
    gu: Thermodynamics ની વ્યાખ્યા આપો અને chemical engineering માં તેનું ક્ષેત્ર જણાવો.
  a:
    en: 'Thermodynamics is the science of energy: it relates heat and work to changes of properties and decides which changes are possible. Its scope covers energy balances, heat and work duties, equilibrium limits of reactions and separations, property estimation (PVT, enthalpy, entropy) and the maximum efficiency of power and refrigeration cycles.'
    gu: 'Thermodynamics એ ઊર્જાનું શાસ્ત્ર છે: તે heat તથા work ને properties ના ફેરફાર સાથે જોડે છે અને કયા ફેરફારો શક્ય છે તે નક્કી કરે છે. તેના ક્ષેત્રમાં energy balances, heat તથા work duties, reactions તથા separations ની equilibrium મર્યાદાઓ, properties નું અનુમાન (PVT, enthalpy, entropy) અને power તથા refrigeration cycles ની મહત્તમ efficiency આવે છે.'
- q:
    en: State three limitations of thermodynamics.
    gu: Thermodynamics ની ત્રણ મર્યાદાઓ જણાવો.
  a:
    en: (1) It predicts only the possibility of a change, never its rate — kinetics and transport phenomena are needed for that. (2) It gives no information about the mechanism of a process at the molecular level. (3) It compares only initial and final states, so it cannot distinguish two plants with equal energy balances but very different size, cost or operability.
    gu: (1) તે ફેરફારની શક્યતા જ કહે છે, દર કદી નહીં — તેના માટે kinetics તથા transport phenomena જોઈએ. (2) તે પ્રક્રિયાના આણ્વિક mechanism વિશે કંઈ આપતું નથી. (3) તે ફક્ત શરૂઆતની તથા અંતિમ state ની સરખામણી કરે છે, તેથી સરખા energy balance પણ size, ખર્ચ કે operability માં ઘણા જુદા પડતા બે plant વચ્ચે ભેદ પાડી શકતું નથી.
- q:
    en: Explain the principle of the zeroth law of thermodynamics and its use.
    gu: ઝીરોથ નિયમનો સિદ્ધાંત તથા તેનો ઉપયોગ સમજાવો.
  a:
    en: If A is in thermal equilibrium with B and B with C, then A is in equilibrium with C. It makes thermal equilibrium transitive, so a single property — temperature — can label the state, and the third body B can serve as a thermometer. Without it, temperature could not be defined or measured.
    gu: જો A એ B સાથે અને B એ C સાથે thermal equilibrium માં હોય, તો A એ C સાથે પણ equilibrium માં હોય. તે thermal equilibrium ને transitive બનાવે છે, તેથી એક જ property — temperature — state ને ઓળખી શકે, અને ત્રીજું શરીર B thermometer તરીકે કામ કરી શકે. તેના વગર temperature વ્યાખ્યાયિત કે માપી શકાતું ન હોત.
- q:
    en: Distinguish between a state function and a path function with examples.
    gu: State function તથા path function વચ્ચે ભેદ આપો, ઉદાહરણ સાથે.
  a:
    en: A state function depends only on the present state; its change is the same by every route and ∮dU = 0. U, H, S, T, P, V are state functions. A path function depends on the route; Q and W are path functions, so different routes between the same two states give different values of Q and W while ΔU is fixed.
    gu: State function ફક્ત હાલની state પર આધાર રાખે છે; દરેક રસ્તે તેનો ફેરફાર સરખો હોય અને ∮dU = 0. U, H, S, T, P, V state functions છે. Path function રસ્તા પર આધાર રાખે છે; Q તથા W path functions છે, તેથી સરખી બે states વચ્ચે જુદા રસ્તે Q તથા W જુદા મળે જ્યારે ΔU નિશ્ચિત રહે.
- q:
    en: What is a reversible process? Why is it called a limiting process?
    gu: Reversible process શું છે? તેને મર્યાદિત પ્રક્રિયા કેમ કહે છે?
  a:
    en: A reversible process passes through a continuous series of equilibrium states and can be reversed by an infinitesimal change in the surroundings, leaving no net change in the universe. It is limiting because it requires zero driving force and infinite time, so no real process achieves it; but it gives the maximum work and the minimum work input, which serve as the benchmark for real machines.
    gu: Reversible process સતત equilibrium states ની શ્રેણીમાંથી પસાર થાય છે અને surroundings માં અતિ સૂક્ષ્મ ફેરફારથી ઉલટાવી શકાય છે, જેથી universe માં કોઈ net ફેરફાર રહેતો નથી. તે મર્યાદિત છે કારણ કે તેને શૂન્ય driving force તથા અનંત સમય જોઈએ, તેથી કોઈ વાસ્તવિક પ્રક્રિયા તેને પામતી નથી; પણ તે મહત્તમ work તથા ઓછામાં ઓછું work input આપે છે, જે વાસ્તવિક machine માટે માપદંડ બને છે.
- q:
    en: Differentiate between steady state and equilibrium.
    gu: Steady state તથા equilibrium વચ્ચે ભેદ આપો.
  a:
    en: 'In steady state the properties at each point are constant with time although matter and energy flow through the system and driving forces remain. In equilibrium nothing changes anywhere and no driving force is left. Equilibrium is a special case of steady state: a running heat exchanger is steady but not in equilibrium; a closed, insulated vessel that has settled down is both.'
    gu: 'Steady state માં દરેક બિંદુએ properties સમય સાથે અચળ રહે છે, જોકે matter તથા energy system માંથી વહે છે અને driving forces બાકી રહે છે. Equilibrium માં ક્યાંય કંઈ બદલાતું નથી અને કોઈ driving force બાકી રહેતું નથી. Equilibrium એ steady state નો ખાસ કિસ્સો છે: ચાલતું heat exchanger steady છે પણ equilibrium માં નથી; સ્થિર થયેલું બંધ, insulated પાત્ર બંને છે.'
- q:
    en: State Gibb's phase rule and explain the terms. Apply it to water boiling in a kettle.
    gu: ગિબ્સ phase rule જણાવો, પદો સમજાવો અને ઉકળતા પાણીને લાગુ કરો.
  a:
    en: 'F = C − P + 2, where F is the number of degrees of freedom, C the number of components and P the number of phases. For water boiling in a kettle C = 1 and P = 2, so F = 1: fixing the pressure (atmospheric) fixes the boiling temperature at 100 °C, and no second property may be chosen.'
    gu: 'F = C − P + 2, જ્યાં F degrees of freedom, C components ની સંખ્યા અને P phases ની સંખ્યા છે. કેટલમાં ઉકળતા પાણી માટે C = 1 તથા P = 2, તેથી F = 1: pressure (atmospheric) નિશ્ચિત કરતાં ઉકળવાનું temperature 100 °C પર નિશ્ચિત થાય, અને બીજી કોઈ property પસંદ કરી શકાય નહીં.'
- q:
    en: Define gauge pressure, absolute pressure and vacuum. How are they related?
    gu: Gauge pressure, absolute pressure તથા vacuum ની વ્યાખ્યા આપો. તેમનો સંબંધ જણાવો.
  a:
    en: 'Absolute pressure is measured above perfect vacuum. Gauge pressure is measured above the local atmospheric pressure: P_abs = P_gauge + P_atm. A vacuum gauge reads the shortfall below atmosphere, so P_vac = P_atm − P_abs. Only absolute pressure may be used in the gas law and in property tables.'
    gu: 'Absolute pressure સંપૂર્ણ શૂન્યાવકાશ ઉપરથી મપાય છે. Gauge pressure સ્થાનિક atmospheric pressure ઉપરથી મપાય છે: P_abs = P_gauge + P_atm. Vacuum gauge atmosphere થી ઓછું કેટલું છે તે વાંચે છે, તેથી P_vac = P_atm − P_abs. Gas law તથા property tables માં ફક્ત absolute pressure વાપરી શકાય.'
exam_questions:
- q:
    en: Define system, surroundings and boundary. With a neat sketch, distinguish between closed, open and isolated systems, giving one chemical engineering example of each.
    gu: System, surroundings તથા boundary ની વ્યાખ્યા આપો. સ્વચ્છ આકૃતિ સાથે closed, open તથા isolated system વચ્ચે ભેદ આપો અને દરેકનું એક chemical engineering ઉદાહરણ આપો.
  marks: 4
- q:
    en: 'Explain, with reasoning, the difference between an extensive and an intensive property. Classify: mass, density, enthalpy, temperature, heat capacity, specific heat, viscosity, mole fraction.'
    gu: 'Extensive તથા intensive property વચ્ચેનો ભેદ કારણ સાથે સમજાવો. વર્ગીકૃત કરો: mass, density, enthalpy, temperature, heat capacity, specific heat, viscosity, mole fraction.'
  marks: 4
- q:
    en: What is a state function? Show that U is a state function while Q and W are path functions, using a P–V diagram with two different paths between the same states.
    gu: State function શું છે? P–V diagram પર સરખી બે states વચ્ચેના બે જુદા રસ્તા દર્શાવીને સાબિત કરો કે U state function છે જ્યારે Q તથા W path functions છે.
  marks: 4
- q:
    en: Define a reversible process. State the conditions necessary for a process to be reversible and list the main causes of irreversibility with one example each.
    gu: Reversible process ની વ્યાખ્યા આપો. પ્રક્રિયા reversible થવા માટેની શરતો જણાવો અને irreversibility ના મુખ્ય કારણો દરેકના એક ઉદાહરણ સાથે જણાવો.
  marks: 4
- q:
    en: Distinguish between steady state and equilibrium. Explain thermal, mechanical, chemical and phase equilibrium, and state why a heat exchanger in operation is in steady state but not in equilibrium.
    gu: Steady state તથા equilibrium વચ્ચે ભેદ આપો. Thermal, mechanical, chemical તથા phase equilibrium સમજાવો, અને કાર્યરત heat exchanger steady state માં કેમ છે પણ equilibrium માં નથી તે જણાવો.
  marks: 4
- q:
    en: Derive the relation between absolute, gauge and vacuum pressure. A gauge on a vessel reads 4.2 bar when the barometer reads 1.01 bar; find the absolute pressure.
    gu: Absolute, gauge તથા vacuum pressure વચ્ચેનો સંબંધ મેળવો. barometer 1.01 bar હોય ત્યારે vessel પરનો gauge 4.2 bar વાંચે છે; absolute pressure શોધો.
  marks: 4
- q:
    en: State Gibb's phase rule and derive it by counting variables and equations. Apply it to (i) superheated steam, (ii) water at its triple point, (iii) a two-component gas mixture.
    gu: 'ગિબ્સ phase rule જણાવો અને variables તથા equations ની ગણતરીથી તેને મેળવો. તેને લાગુ કરો: (i) superheated steam, (ii) triple point પરનું પાણી, (iii) બે-component gas mixture.'
  marks: 4
- q:
    en: State and explain the zeroth law of thermodynamics. Show how it leads to the concept of temperature and makes the thermometer possible.
    gu: થર્મોડાયનેમિક્સનો ઝીરોથ નિયમ જણાવો તથા સમજાવો. તે temperature ના ખ્યાલ તરફ કેમ દોરે છે અને thermometer કેમ શક્ય બનાવે છે તે દર્શાવો.
  marks: 4
- q:
    en: Explain the ideal-gas temperature scale. Why is it extrapolated to zero pressure, and why is it independent of the gas used in that limit?
    gu: Ideal-gas temperature scale સમજાવો. તેને શૂન્ય pressure સુધી extrapolate કેમ કરાય છે, અને એ મર્યાદામાં તે વપરાયેલા gas પરથી સ્વતંત્ર કેમ થાય છે?
  marks: 4
- q:
    en: 2 kmol of an ideal gas expands reversibly and isothermally at 400 K from 2 bar to 0.5 bar. Calculate the work done and the heat transferred. Also state the sign convention used.
    gu: 2 kmol ideal gas 400 K પર 2 bar થી 0.5 bar સુધી reversible તથા isothermal રીતે expand થાય છે. થયેલું work તથા transfer થયેલી heat ગણો. વપરાયેલી sign convention પણ જણાવો.
  marks: 4
- q:
    en: A pump lifts 18 m³/h of water through 32 m at 68 % overall efficiency. Calculate the shaft power and the electricity cost for 20 h of operation at ₹ 8.20/kWh.
    gu: Pump 68 % overall efficiency પર 18 m³/h પાણી 32 m ઊંચકે છે. Shaft power તથા ₹ 8.20/kWh દરે 20 કલાક ચલાવવાનો વીજળી ખર્ચ ગણો.
  marks: 4
- q:
    en: Convert 185 °F to °C, K and R. A temperature rise of 25 °C equals how many K, °F and R? State why °C may not be used in the gas law.
    gu: 185 °F ને °C, K તથા R માં ફેરવો. 25 °C નો temperature વધારો કેટલા K, °F તથા R થાય? Gas law માં °C કેમ વાપરી શકાય નહીં તે જણાવો.
  marks: 4
tab_labels:
  programs:
    en: Solved numericals
    gu: ઉકેલેલા દાખલા
  syntax:
    en: Formulae and conversions
    gu: સૂત્રો તથા conversions
programs:
- ref: N1
  title:
    en: Force, weight and pressure on a piston
    gu: Piston પર force, weight તથા pressure
  format: rich_cards
  items:
  - h:
      en: Force, weight and pressure on a piston
      gu: Piston પર force, weight તથા pressure
    body:
      en: |-
        <h4>Given</h4><p>A vertical cylinder of diameter 250 mm is closed by a frictionless piston of mass 40 kg. The barometer reads 101.3 kPa. Take g = 9.81 m/s².</p><h4>Find</h4><p>(a) The gauge pressure of the gas, (b) its absolute pressure in kPa and bar.</p><h4>Formula</h4><div class="math" data-tex="A=\pi D^2/4" aria-label="A=\pi D^2/4">A = πD²/4</div><div class="math" data-tex="P_{gauge}=mg/A" aria-label="P_{gauge}=mg/A">P_gauge = m g / A</div><div class="math" data-tex="P_{abs}=P_{gauge}+P_{atm}" aria-label="P_{abs}=P_{gauge}+P_{atm}">P_abs = P_gauge + P_atm</div><h4>Substitution and calculation</h4><p>A = π(0.250)²/4 = 0.049 09 m². Weight of piston = 40 × 9.81 = 392.4 N. P_gauge = 392.4 / 0.049 09 = 7 994 Pa = 7.99 kPa. P_abs = 7.99 + 101.3 = 109.3 kPa.</p><h4>Final answer with units</h4><p>P_gauge = 7.99 kPa = 0.0799 bar;  P_abs = 109.3 kPa = 1.093 bar.</p><h4>Validity check</h4><p>8 kPa on a 0.049 m² piston corresponds to about 0.8 tonne force per square metre, small compared with atmospheric pressure but enough to lift the piston — the same order as 0.08 atm, as expected for a 40 kg mass on a 25 cm bore.</p>
      gu: |-
        <h4>આપેલ</h4><p>250 mm વ્યાસના ઊભા cylinder ને 40 kg દળનો ઘર્ષણરહિત piston બંધ કરે છે. Barometer 101.3 kPa વાંચે છે. g = 9.81 m/s² લો.</p><h4>શોધો</h4><p>(a) Gas નું gauge pressure, (b) તેનું absolute pressure kPa તથા bar માં.</p><h4>સૂત્ર</h4><div class="math" data-tex="A=\pi D^2/4" aria-label="A=\pi D^2/4">A = πD²/4</div><div class="math" data-tex="P_{gauge}=mg/A" aria-label="P_{gauge}=mg/A">P_gauge = m g / A</div><div class="math" data-tex="P_{abs}=P_{gauge}+P_{atm}" aria-label="P_{abs}=P_{gauge}+P_{atm}">P_abs = P_gauge + P_atm</div><h4>Substitution તથા Calculation</h4><p>A = π(0.250)²/4 = 0.049 09 m². Piston નું weight = 40 × 9.81 = 392.4 N. P_gauge = 392.4 / 0.049 09 = 7 994 Pa = 7.99 kPa. P_abs = 7.99 + 101.3 = 109.3 kPa.</p><h4>Units સાથે અંતિમ જવાબ</h4><p>P_gauge = 7.99 kPa = 0.0799 bar;  P_abs = 109.3 kPa = 1.093 bar.</p><h4>Validity Check</h4><p>0.049 m² piston પર 8 kPa એટલે ચોરસ મીટર દીઠ લગભગ 0.8 tonne force, જે atmospheric pressure ની સરખામણીમાં નાનું છે પણ piston ઊંચકવા પૂરતું છે — 25 cm bore પર 40 kg દળ માટે અપેક્ષિત 0.08 atm જેટલું જ.</p>
- ref: N2
  title:
    en: Work in a reversible expansion of a gas
    gu: Gas ના reversible expansion માં work
  format: rich_cards
  items:
  - h:
      en: Work in a reversible expansion of a gas
      gu: Gas ના reversible expansion માં work
    body:
      en: |-
        <h4>Given</h4><p>2 kmol of an ideal gas expands reversibly and isothermally at 400 K from 2 bar to 0.5 bar. R = 8.314 kJ/kmol·K.</p><h4>Find</h4><p>The work done by the gas and the heat transferred.</p><h4>Formula</h4><div class="math" data-tex="W=nRT\ln\frac{V_2}{V_1}=nRT\ln\frac{P_1}{P_2}" aria-label="W=nRT\ln\frac{V_2}{V_1}=nRT\ln\frac{P_1}{P_2}">W = n R T ln(V₂/V₁) = n R T ln(P₁/P₂)</div><div class="math" data-tex="\Delta U=0\Rightarrow Q=W" aria-label="\Delta U=0\Rightarrow Q=W">isothermal ideal gas:  ΔU = 0  ⇒  Q = W</div><h4>Substitution and calculation</h4><p>W = 2 × 8.314 × 400 × ln(2/0.5) = 6 651.2 × ln 4 = 6 651.2 × 1.3863 = 9 221 kJ.</p><h4>Final answer with units</h4><p>W = 9.22 MJ done by the gas;  Q = 9.22 MJ absorbed from the hot reservoir.</p><h4>Validity check</h4><p>Pressure falls by a factor of four, so V₂ = 4V₁ and the work must be nRT ln 4 ≈ 6.65 MJ × 1.39. The answer is positive because the gas expands, and ΔU = 0 confirms the whole of the heat becomes work — the ideal-gas isothermal case.</p>
      gu: |-
        <h4>આપેલ</h4><p>2 kmol ideal gas 400 K પર 2 bar થી 0.5 bar સુધી reversible તથા isothermal રીતે expand થાય છે. R = 8.314 kJ/kmol·K.</p><h4>શોધો</h4><p>Gas દ્વારા થયેલું work તથા transfer થયેલી heat.</p><h4>સૂત્ર</h4><div class="math" data-tex="W=nRT\ln\frac{V_2}{V_1}=nRT\ln\frac{P_1}{P_2}" aria-label="W=nRT\ln\frac{V_2}{V_1}=nRT\ln\frac{P_1}{P_2}">W = n R T ln(V₂/V₁) = n R T ln(P₁/P₂)</div><div class="math" data-tex="\Delta U=0\Rightarrow Q=W" aria-label="\Delta U=0\Rightarrow Q=W">isothermal ideal gas:  ΔU = 0  ⇒  Q = W</div><h4>Substitution તથા Calculation</h4><p>W = 2 × 8.314 × 400 × ln(2/0.5) = 6 651.2 × ln 4 = 6 651.2 × 1.3863 = 9 221 kJ.</p><h4>Units સાથે અંતિમ જવાબ</h4><p>W = 9.22 MJ gas દ્વારા થયું;  Q = 9.22 MJ ગરમ reservoir માંથી લેવાઈ.</p><h4>Validity Check</h4><p>Pressure ચાર ગણું ઘટે છે, તેથી V₂ = 4V₁ અને work nRT ln 4 ≈ 6.65 MJ × 1.39 જ હોવું જોઈએ. Gas expand થતો હોવાથી જવાબ ધન છે, અને ΔU = 0 સૂચવે છે કે આખી heat work માં ફેરવાઈ — ideal-gas isothermal કિસ્સો.</p>
- ref: N3
  title:
    en: Gauge to absolute pressure and degrees of freedom
    gu: Gauge થી absolute pressure તથા degrees of freedom
  format: rich_cards
  items:
  - h:
      en: Gauge to absolute pressure and degrees of freedom
      gu: Gauge થી absolute pressure તથા degrees of freedom
    body:
      en: |-
        <h4>Given</h4><p>A steam main carries saturated steam. The pressure gauge reads 9.0 bar and the barometer reads 1.013 bar. The steam is wet, with 5 % moisture by mass.</p><h4>Find</h4><p>(a) Absolute pressure, (b) degrees of freedom of the wet steam, (c) the number of independent properties needed to fix its state.</p><h4>Formula</h4><div class="math" data-tex="P_{abs}=P_{gauge}+P_{atm}" aria-label="P_{abs}=P_{gauge}+P_{atm}">P_abs = P_gauge + P_atm</div><div class="math" data-tex="F=C-P+2" aria-label="F=C-P+2">F = C − P + 2</div><h4>Substitution and calculation</h4><p>P_abs = 9.0 + 1.013 = 10.013 bar. Wet steam is water with two phases present: C = 1 (only water), P = 2 (liquid + vapour), so F = 1 − 2 + 2 = 1.</p><h4>Final answer with units</h4><p>P_abs = 10.013 bar ≈ 1.0 MPa. F = 1: fixing the pressure (10.013 bar) fixes the temperature at the saturation value, so only the dryness fraction x = 0.95 is still free.</p><h4>Validity check</h4><p>For saturated steam at 10 bar the saturation temperature is about 179 °C; with F = 1 that temperature is not an independent choice but a consequence of the pressure, which matches the steam table.</p>
      gu: |-
        <h4>આપેલ</h4><p>Steam main માં saturated steam વહે છે. Pressure gauge 9.0 bar વાંચે છે અને barometer 1.013 bar. Steam wet છે, mass પ્રમાણે 5 % moisture ધરાવે છે.</p><h4>શોધો</h4><p>(a) Absolute pressure, (b) wet steam ના degrees of freedom, (c) તેની state નક્કી કરવા જરૂરી સ્વતંત્ર properties ની સંખ્યા.</p><h4>સૂત્ર</h4><div class="math" data-tex="P_{abs}=P_{gauge}+P_{atm}" aria-label="P_{abs}=P_{gauge}+P_{atm}">P_abs = P_gauge + P_atm</div><div class="math" data-tex="F=C-P+2" aria-label="F=C-P+2">F = C − P + 2</div><h4>Substitution તથા Calculation</h4><p>P_abs = 9.0 + 1.013 = 10.013 bar. Wet steam એ બે phases વાળું પાણી છે: C = 1 (ફક્ત પાણી), P = 2 (liquid + vapour), તેથી F = 1 − 2 + 2 = 1.</p><h4>Units સાથે અંતિમ જવાબ</h4><p>P_abs = 10.013 bar ≈ 1.0 MPa. F = 1: pressure (10.013 bar) નિશ્ચિત કરતાં temperature saturation કિંમત પર નિશ્ચિત થાય, તેથી ફક્ત dryness fraction x = 0.95 સ્વતંत्र બાકી રહે.</p><h4>Validity Check</h4><p>10 bar પર saturated steam નું saturation temperature લગભગ 179 °C છે; F = 1 હોવાથી એ temperature સ્વતંત્ર પસંદગી નથી પણ pressure નું પરિણામ છે, જે steam table સાથે મળે છે.</p>
- ref: N4
  title:
    en: Pumping power and energy cost
    gu: Pumping power તથા energy ખર્ચ
  format: rich_cards
  items:
  - h:
      en: Pumping power and energy cost
      gu: Pumping power તથા energy ખર્ચ
    body:
      en: |-
        <h4>Given</h4><p>A pump delivers 18 m³/h of water against a total head of 32 m. Density of water 1 000 kg/m³, g = 9.81 m/s², overall pump efficiency 68 %. Electricity costs ₹ 8.20 per kWh.</p><h4>Find</h4><p>Shaft power required (kW) and the daily electricity cost for 20 h of running.</p><h4>Formula</h4><div class="math" data-tex="Q=18/3600\ m^3/s" aria-label="Q=18/3600\ m^3/s">Q = 18/3600 = 5.0 × 10⁻³ m³/s</div><div class="math" data-tex="P_{hyd}=\rho QgH" aria-label="P_{hyd}=\rho QgH">P_hyd = ρ Q g H</div><div class="math" data-tex="P_{shaft}=P_{hyd}/\eta" aria-label="P_{shaft}=P_{hyd}/\eta">P_shaft = P_hyd / η</div><h4>Substitution and calculation</h4><p>P_hyd = 1 000 × 5.0 × 10⁻³ × 9.81 × 32 = 1 569.6 W = 1.570 kW. P_shaft = 1.570 / 0.68 = 2.309 kW. Energy in 20 h = 2.309 × 20 = 46.18 kWh; cost = 46.18 × 8.20 = ₹ 378.7.</p><h4>Final answer with units</h4><p>Shaft power 2.31 kW; daily energy 46.2 kWh; daily cost ≈ ₹ 379.</p><h4>Validity check</h4><p>A 2.3 kW motor for 18 m³/h at 32 m is plausible (a rule of thumb gives about 0.13 kW per m³/h per 10 m of head at 70 % efficiency: 1.8 × 3.2 × 0.4 ≈ 2.3 kW). The 1.47 factor between hydraulic and shaft power is the efficiency penalty, always greater than one.</p>
      gu: |-
        <h4>આપેલ</h4><p>Pump 32 m total head સામે 18 m³/h પાણી પહોંચાડે છે. પાણીની density 1 000 kg/m³, g = 9.81 m/s², pump ની overall efficiency 68 %. વીજળીનો દર ₹ 8.20 પ્રતિ kWh.</p><h4>શોધો</h4><p>જરૂરી shaft power (kW) તથા 20 કલાક ચલાવવાનો દૈનિક વીજળી ખર્ચ.</p><h4>સૂત્ર</h4><div class="math" data-tex="Q=18/3600\ m^3/s" aria-label="Q=18/3600\ m^3/s">Q = 18/3600 = 5.0 × 10⁻³ m³/s</div><div class="math" data-tex="P_{hyd}=\rho QgH" aria-label="P_{hyd}=\rho QgH">P_hyd = ρ Q g H</div><div class="math" data-tex="P_{shaft}=P_{hyd}/\eta" aria-label="P_{shaft}=P_{hyd}/\eta">P_shaft = P_hyd / η</div><h4>Substitution તથા Calculation</h4><p>P_hyd = 1 000 × 5.0 × 10⁻³ × 9.81 × 32 = 1 569.6 W = 1.570 kW. P_shaft = 1.570 / 0.68 = 2.309 kW. 20 કલાકની energy = 2.309 × 20 = 46.18 kWh; ખર્ચ = 46.18 × 8.20 = ₹ 378.7.</p><h4>Units સાથે અંતિમ જવાબ</h4><p>Shaft power 2.31 kW; દૈનિક energy 46.2 kWh; દૈનિક ખર્ચ ≈ ₹ 379.</p><h4>Validity Check</h4><p>18 m³/h માટે 32 m પર 2.3 kW motor વ્યાજબી છે (70 % efficiency પર પ્રતિ 10 m head તથા પ્રતિ m³/h લગભગ 0.13 kW નો rule of thumb: 1.8 × 3.2 × 0.4 ≈ 2.3 kW). Hydraulic તથા shaft power વચ્ચેનો 1.47 ગુણક efficiency ની ખોટ છે, જે હંમેશા એકથી મોટો હોય છે.</p>
- ref: N5
  title:
    en: Temperature-scale conversion
    gu: Temperature scale રૂપાંતરણ
  format: rich_cards
  items:
  - h:
      en: Temperature-scale conversion
      gu: Temperature scale રૂપાંતરણ
    body:
      en: |-
        <h4>Given</h4><p>A reaction is carried out at 185 °F. The same reaction must be described in a report using °C, K and R.</p><h4>Find</h4><p>The temperature in °C, K and R, and the value of a 25 °C temperature rise in each scale.</p><h4>Formula</h4><div class="math" data-tex="t(^\circ C)=[t(^\circ F)-32]/1.8" aria-label="t(^\circ C)=[t(^\circ F)-32]/1.8">t(°C) = [t(°F) − 32]/1.8</div><div class="math" data-tex="T(K)=t(^\circ C)+273.15" aria-label="T(K)=t(^\circ C)+273.15">T(K) = t(°C) + 273.15</div><div class="math" data-tex="T(R)=t(^\circ F)+459.67" aria-label="T(R)=t(^\circ F)+459.67">T(R) = t(°F) + 459.67</div><h4>Substitution and calculation</h4><p>t = (185 − 32)/1.8 = 153/1.8 = 85.0 °C. T = 85.0 + 273.15 = 358.15 K. T(R) = 185 + 459.67 = 644.67 R. For a rise: ΔT = 25 K = 25 °C = 45 °F = 45 R.</p><h4>Final answer with units</h4><p>85.0 °C = 358.2 K = 644.7 R. A 25 °C rise is 25 K, 45 °F and 45 R.</p><h4>Validity check</h4><p>Cross-check with the Rankine–Kelvin ratio: 644.67/358.15 = 1.800, exactly the ratio of the two absolute scales, so the conversions are consistent.</p>
      gu: |-
        <h4>આપેલ</h4><p>એક reaction 185 °F પર થાય છે. એ જ reaction રિપોર્ટમાં °C, K તથા R માં લખવાની છે.</p><h4>શોધો</h4><p>°C, K તથા R માં temperature, અને 25 °C ના temperature વધારાની કિંમત દરેક scale માં.</p><h4>સૂત્ર</h4><div class="math" data-tex="t(^\circ C)=[t(^\circ F)-32]/1.8" aria-label="t(^\circ C)=[t(^\circ F)-32]/1.8">t(°C) = [t(°F) − 32]/1.8</div><div class="math" data-tex="T(K)=t(^\circ C)+273.15" aria-label="T(K)=t(^\circ C)+273.15">T(K) = t(°C) + 273.15</div><div class="math" data-tex="T(R)=t(^\circ F)+459.67" aria-label="T(R)=t(^\circ F)+459.67">T(R) = t(°F) + 459.67</div><h4>Substitution તથા Calculation</h4><p>t = (185 − 32)/1.8 = 153/1.8 = 85.0 °C. T = 85.0 + 273.15 = 358.15 K. T(R) = 185 + 459.67 = 644.67 R. વધારા માટે: ΔT = 25 K = 25 °C = 45 °F = 45 R.</p><h4>Units સાથે અંતિમ જવાબ</h4><p>85.0 °C = 358.2 K = 644.7 R. 25 °C નો વધારો 25 K, 45 °F તથા 45 R છે.</p><h4>Validity Check</h4><p>Rankine–Kelvin ગુણોત્તરથી ચકાસો: 644.67/358.15 = 1.800, બંને absolute scales નો બરાબર ગુણોત્તર, તેથી રૂપાંતરણ સુસંગત છે.</p>
- ref: N6
  title:
    en: Phase rule for a reacting and a non-reacting system
    gu: Reacting તથા non-reacting system માટે phase rule
  format: rich_cards
  items:
  - h:
      en: Phase rule for a reacting and a non-reacting system
      gu: Reacting તથા non-reacting system માટે phase rule
    body:
      en: |-
        <h4>Given</h4><p>(a) A gas mixture of N₂, H₂ and NH₃ is held at equilibrium in a single gas phase where the reaction N₂ + 3H₂ ⇌ 2NH₃ has come to equilibrium. (b) Ethanol and water form two liquid phases in equilibrium in a closed vessel held at a fixed temperature.</p><h4>Find</h4><p>The degrees of freedom in each case and the number of properties to be specified.</p><h4>Formula</h4><div class="math" data-tex="F=C-P+2" aria-label="F=C-P+2">F = C − P + 2</div><div class="math" data-tex="C=\text{species}-\text{reactions}" aria-label="C=\text{species}-\text{reactions}">C = species − independent reactions</div><h4>Substitution and calculation</h4><p>(a) Species = 3, one independent reaction, so C = 3 − 1 = 2; P = 1 (one gas phase). F = 2 − 1 + 2 = 3. (b) Species = 2, no reaction, C = 2; P = 2 (two liquid phases); but T is fixed by the vessel, so use the condensed form F = C − P + 1 = 2 − 2 + 1 = 1.</p><h4>Final answer with units</h4><p>(a) F = 3: fix T, P and one mole fraction (or the extent of reaction). (b) F = 1: at the fixed temperature only one more variable, e.g. the mole fraction of ethanol in one phase, is free.</p><h4>Validity check</h4><p>Counting rules agree with intuition: an equilibrium gas mixture needs T, P and composition; two immiscible liquids at a fixed temperature have only the tie-line position left, which is exactly the one degree of freedom found.</p>
      gu: |-
        <h4>આપેલ</h4><p>(a) N₂, H₂ તથા NH₃ નું gas mixture single gas phase માં equilibrium પર છે, જ્યાં N₂ + 3H₂ ⇌ 2NH₃ પ્રક્રિયા equilibrium પર આવી છે. (b) Ethanol તથા પાણી closed vessel માં, અચળ temperature પર, બે liquid phases માં equilibrium પર છે.</p><h4>શોધો</h4><p>દરેક કિસ્સામાં degrees of freedom તથા નિશ્ચિત કરવાની properties ની સંખ્યા.</p><h4>સૂત્ર</h4><div class="math" data-tex="F=C-P+2" aria-label="F=C-P+2">F = C − P + 2</div><div class="math" data-tex="C=\text{species}-\text{reactions}" aria-label="C=\text{species}-\text{reactions}">C = species − independent reactions</div><h4>Substitution તથા Calculation</h4><p>(a) Species = 3, એક સ્વતંત્ર reaction, તેથી C = 3 − 1 = 2; P = 1 (એક gas phase). F = 2 − 1 + 2 = 3. (b) Species = 2, કોઈ reaction નહીં, C = 2; P = 2 (બે liquid phases); પણ vessel દ્વારા T નિશ્ચિત છે, તેથી condensed સ્વરૂપ વાપરો: F = C − P + 1 = 2 − 2 + 1 = 1.</p><h4>Units સાથે અંતિમ જવાબ</h4><p>(a) F = 3: T, P તથા એક mole fraction (કે reaction નો extent) નિશ્ચિત કરો. (b) F = 1: નિશ્ચિત temperature પર ફક્ત એક વધુ variable, દા.ત. એક phase માં ethanol નો mole fraction, સ્વતંત્ર છે.</p><h4>Validity Check</h4><p>ગણતરી અને અંતર્જ્ઞાન મળે છે: equilibrium gas mixture ને T, P તથા composition જોઈએ; નિશ્ચિત temperature પર બે અમિશ્ર્ર liquid પાસે ફક્ત tie-line ની સ્થિતિ બાકી રહે, જે મળેલા એક degree of freedom જ છે.</p>
syntax:
- title:
    en: Definitions you must be able to write in one line
    gu: એક લીટીમાં લખવા જરૂરી વ્યાખ્યાઓ
  items:
  - title:
      en: Pressure
      gu: Pressure
    f: P = F/A;  P_abs = P_gauge + P_atm;  P_vac = P_atm − P_abs
    terms: Gauge reads above atmosphere; only absolute pressure enters the gas law.
  - title:
      en: Work and power
      gu: Work તથા power
    f: W = ∫P dV (reversible);  W_shaft = 2πNT;  Power = W/t
    terms: Work is a path function; reversible ∫P dV is the maximum work between two states.
  - title:
      en: Phase rule
      gu: Phase rule
    f: F = C − P + 2;  condensed form F = C − P + 1
    terms: C counts independent components (species − reactions), P counts phases present.
  - title:
      en: Temperature
      gu: Temperature
    f: T(K) = t(°C) + 273.15;  t(°F) = 1.8t(°C) + 32;  T(R) = t(°F) + 459.67
    terms: Use absolute scales in any ratio or product; ΔT(K) = ΔT(°C).
  - title:
      en: Ideal-gas scale
      gu: Ideal-gas scale
    f: T = 273.16 × lim(P→0)(P/P_fp)
    terms: The zero-pressure limit makes the scale independent of the gas used.
- title:
    en: Unit conversions that appear in every numerical
    gu: દરેક દાખલામાં આવતાં unit conversions
  items:
  - title:
      en: Pressure
      gu: Pressure
    f: 1 bar = 100 kPa = 0.1 MPa;  1 atm = 101.325 kPa = 1.01325 bar = 760 mmHg
    terms: Also 1 kgf/cm² = 98.0665 kPa, 1 psi = 6.8948 kPa.
  - title:
      en: Energy
      gu: Energy
    f: 1 kJ = 10³ J;  1 kcal = 4.1868 kJ;  1 kWh = 3.6 MJ;  1 Btu = 1.055 kJ
    terms: 'Power: 1 kW = 1 kJ/s; 1 hp = 0.7457 kW.'
  - title:
      en: Gas constant
      gu: Gas constant
    f: R = 8.314 kJ/kmol·K = 8.314 J/mol·K = 0.08314 bar·m³/kmol·K
    terms: Choose the R whose units cancel the data; never mix kJ with bar·m³.
  - title:
      en: Volume
      gu: Volume
    f: 1 m³ = 1 000 L = 10⁶ cm³;  1 ft³ = 0.02832 m³
    terms: 1 kmol ideal gas at 1 atm, 0 °C = 22.414 m³ (22.71 m³ at 0 °C, 1 bar).
