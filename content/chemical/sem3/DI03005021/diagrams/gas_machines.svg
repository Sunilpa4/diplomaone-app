<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="Gas movers:classify by mechanism and service"><defs><marker id="gas_machines-arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#263247"/></marker></defs><rect width="900" height="470" fill="white"/><text x="24" y="35" font-family="Arial,sans-serif" font-size="23" fill="#682ba2">Gas movers:classify by mechanism and service</text><rect x="80" y="100" width="320" height="90" fill="#ede3f8" stroke="#7134aa" stroke-width="3"/><text x="100" y="150" font-family="Arial,sans-serif" font-size="18" fill="#263247">Rotodynamic:blade energy transfer</text><rect x="490" y="100" width="330" height="90" fill="#ede3f8" stroke="#7134aa" stroke-width="3"/><text x="510" y="150" font-family="Arial,sans-serif" font-size="18" fill="#263247">Positive displacement:trapped gas</text><rect x="80" y="250" width="740" height="120" fill="#dcedfb" stroke="#7134aa" stroke-width="3"/><text x="110" y="295" font-family="Arial,sans-serif" font-size="18" fill="#263247">Fan:small pressure rise • Blower:greater pressure duty</text><text x="110" y="335" font-family="Arial,sans-serif" font-size="18" fill="#263247">Compressor:substantial pressure rise;density change matters</text><text x="135" y="415" font-family="Arial,sans-serif" font-size="18" fill="#263247">Names/limits vary by standard—select the actual machine curve and protection</text><text x="24" y="454" font-family="Arial,sans-serif" font-size="14" fill="#777">Own labelled study schematic • not to scale • not experimental data</text></svg>