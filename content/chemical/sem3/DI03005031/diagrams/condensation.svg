<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-label="Filmwise versus dropwise condensation"><defs><marker id="condensation-arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#273344"/></marker></defs><rect width="900" height="460" fill="white"/><text x="26" y="35" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#6627a3">Filmwise versus dropwise condensation</text><rect x="180" y="100" width="35" height="240" fill="#ece2f7" stroke="#7134aa" stroke-width="3"/><rect x="215" y="100" width="28" height="240" fill="#d7edfb" stroke="#268ab7" stroke-width="3"/><text x="85" y="75" font-family="Arial,sans-serif" font-size="18" fill="#273344">Filmwise:continuous liquid film</text><path d="M270 150L270 300" fill="none" stroke="#268ab7" stroke-width="3" marker-end="url(#condensation-arr)"/><text x="70" y="385" font-family="Arial,sans-serif" font-size="18" fill="#273344">Film adds thermal resistance</text><rect x="590" y="100" width="35" height="240" fill="#ece2f7" stroke="#7134aa" stroke-width="3"/><text x="510" y="75" font-family="Arial,sans-serif" font-size="18" fill="#273344">Dropwise:separate droplets</text><circle cx="638" cy="125" r="10" fill="#d7edfb" stroke="#268ab7" stroke-width="3"/><circle cx="638" cy="175" r="16" fill="#d7edfb" stroke="#268ab7" stroke-width="3"/><circle cx="638" cy="235" r="12" fill="#d7edfb" stroke="#268ab7" stroke-width="3"/><circle cx="638" cy="305" r="20" fill="#d7edfb" stroke="#268ab7" stroke-width="3"/><path d="M700 160L700 310" fill="none" stroke="#268ab7" stroke-width="3" marker-end="url(#condensation-arr)"/><text x="495" y="385" font-family="Arial,sans-serif" font-size="18" fill="#273344">Droplets coalesce and fall away</text><text x="25" y="445" font-family="Arial,sans-serif" font-size="14" fill="#777">Labelled study schematic • not to scale • not measured experimental data</text></svg>