<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430"><defs><marker id="reaction-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#263247"/></marker></defs><rect width="900" height="430" fill="white"/><text x="24" y="36" font-size="23" font-family="Arial,sans-serif" fill="#263247">Reaction:stoichiometry and extent on a stated basis</text><rect x="325" y="145" width="250" height="130" rx="9" fill="#ede3f8" stroke="#7134aa" stroke-width="3"/><text x="340" y="210.0" font-size="19" font-family="Arial,sans-serif" fill="#263247">REACTOR</text><path d="M35 205L325 205" stroke="#263247" stroke-width="3" fill="none" marker-end="url(#reaction-arrow)"/><text x="35" y="175" font-size="18" font-family="Arial,sans-serif" fill="#263247">Reactants + inerts</text><path d="M575 205L850 205" stroke="#263247" stroke-width="3" fill="none" marker-end="url(#reaction-arrow)"/><text x="595" y="155" font-size="18" font-family="Arial,sans-serif" fill="#263247">Outlet mixture:</text><text x="595" y="185" font-size="18" font-family="Arial,sans-serif" fill="#263247">products + unreacted species</text><text x="595" y="245" font-size="18" font-family="Arial,sans-serif" fill="#263247">+ unchanged inerts</text><text x="45" y="365" font-size="17" font-family="Arial,sans-serif" fill="#263247">Mass and atomic balances close;total moles need not be conserved.</text><text x="24" y="412" font-size="14" font-family="Arial,sans-serif" fill="#263247">Own labelled balance diagram • symbol values/basis come from the worked example</text></svg>