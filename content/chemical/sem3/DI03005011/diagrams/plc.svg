385" font-family="Arial,sans-serif" font-size="18" fill="#263247">Typical scan:read inputs →execute logic →update outputs →repeat.</text><text x="110" y="420" font-family="Arial,sans-serif" font-size="18" fill="#263247">Functional architecture,not field wiring or safety certification.</text><text x="22" y="486" font-family="Arial,sans-serif" font-size="14" fill="#263247">Own labelled study schematic • not to scale • no measured/physical results claimed</text></svg>