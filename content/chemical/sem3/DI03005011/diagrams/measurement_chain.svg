<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500"><defs><marker id="measurement_chain-a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#263247"/></marker></defs><rect width="900" height="500" fill="white"/><text x="22" y="34" font-family="Arial,sans-serif" font-size="22" fill="#263247">Basic measurement chain:functions can share one physical device</text><rect x="20" y="170" width="150" height="100" fill="#ede3f8" stroke="#7134aa" stroke-width="3"/><text x="32" y="225.0" font-family="Arial,sans-serif" font-size="17" fill="#263247">Sensor</text><path d="M170 220L195 220" stroke="#263247" stroke-width="3" fill="none" marker-end="url(#measurement_chain-a)"/><rect x="195" y="170" width="150" height="100" fill="#ede3f8" stroke="#7134aa" stroke-width="3"/><text x="207" y="225.0" font-family="Arial,sans-serif" font-size="17" fill="#263247">Transducer</text><path d="M345 220L370 220" stroke="#263247" stroke-width="3" fill="none" marker-end="url(#measurement_chain-a)"/><rect x="370" y="170" width="150" height="100" fill="#ede3f8" stroke="#7134aa" stroke-width="3"/><text x="382" y="225.0" font-family="Arial,sans-serif" font-size="17" fill="#263247">Conditioning</text><path d="M520 220L545 220" stroke="#263247" stroke-width="3" fill="none" marker-end="url(#measurement_chain-a)"/><rect x="545" y="170" width="150" height="100" fill="#ede3f8" stroke="#7134aa" stroke-width="3"/><text x="557" y="225.0" font-family="Arial,sans-serif" font-size="17" fill="#263247">Transmission</text><path d="M695 220L720 220" stroke="#263247" stroke-width="3" fill="none" marker-end="url(#measurement_chain-a)"/><rect x="720" y="170" width="150" height="100" fill="#ede3f8" stroke="#7134aa" stroke-width="3"/><text x="732" y="225.0" font-family="Arial,sans-serif" font-size="17" fill="#263247">Indication</text><text x="35" y="115" font-family="Arial,sans-serif" font-size="18" fill="#263247">Measurand → primary response → converted/conditioned signal → useful reading</text><text x="80" y="340" font-family="Arial,sans-serif" font-size="18" fill="#263247">Power/reference and compensation support the required stages.</text><text x="80" y="385" font-family="Arial,sans-serif" font-size="18" fill="#263247">A controller/final element uses measurement;it is not the sensing element.</text><text x="22" y="486" font-family="Arial,sans-serif" font-size="14" fill="#263247">Own labelled study schematic • not to scale • no measured/physical results claimed</text></svg>