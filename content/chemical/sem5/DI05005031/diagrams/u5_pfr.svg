ill-opacity="0.15"/><rect x="213.0" y="138.6" width="5.9" height="25.4" fill="#1565C0" fill-opacity="0.15"/><rect x="219.3" y="136.5" width="5.9" height="27.5" fill="#1565C0" fill-opacity="0.15"/><rect x="225.6" y="134.0" width="5.9" height="30.0" fill="#1565C0" fill-opacity="0.15"/><rect x="231.9" y="131.0" width="5.9" height="33.0" fill="#1565C0" fill-opacity="0.15"/><rect x="238.2" y="127.3" width="5.9" height="36.7" fill="#1565C0" fill-opacity="0.15"/><rect x="244.5" y="122.7" width="5.9" height="41.3" fill="#1565C0" fill-opacity="0.15"/><text x="70" y="98.6" font-size="7.4" text-anchor="start" fill="#1565C0" font-weight="bold">area = k tau = ln[1/(1 - 0.8)] = 1.61</text><text x="180" y="204.4" font-size="7.0" text-anchor="middle" fill="#222222" font-weight="bold">the same duty in a CSTR: tau = 16 h, 115 m3</text><rect x="6.0" y="212.0" width="348.0" height="54.0" rx="5" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1"/><text x="180.0" y="226.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">why the tube wins for a positive order</text><text x="180.0" y="240.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">the reactant is held at its highest concentration for as long as possible</text><text x="180.0" y="252.2" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">V = 1.61 v0/k = 46 m3, 2.5 times smaller than the CSTR's 115 m3</text><text x="180.0" y="263.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">at 90 % the pair is 2.30 against 9, a factor of 3.9</text><text x="180.0" y="289.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">A pipe is only a PFR while axial dispersion stays small: a laminar</text><text x="180.0" y="301.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">profile or a wide vessel is neither plug flow nor a CSTR, but something between.</text></svg>