2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">the choice between the two</text><text x="180.0" y="304.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">spray tower: liquid is the dispersed phase, good for absorption and fast reactions</text><text x="180.0" y="316.2" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">trickle bed: liquid films over a fixed catalyst, good for slow three-phase reactions</text><text x="180.0" y="335.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">Working: gas rises, liquid falls, and the two meet on drops or on a wetted</text><text x="180.0" y="347.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">catalyst surface; the contact area per unit volume is what decides the size.</text></svg>