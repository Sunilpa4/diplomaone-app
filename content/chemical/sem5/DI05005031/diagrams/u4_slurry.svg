16.2" r="1.15" fill="#222222"/><circle cx="276.3" cy="216.2" r="1.15" fill="#222222"/><circle cx="288.9" cy="216.2" r="1.15" fill="#222222"/><circle cx="301.4" cy="216.2" r="1.15" fill="#222222"/><circle cx="238" cy="128" r="2.2" fill="#B66A00"/><circle cx="258" cy="148" r="2.2" fill="#B66A00"/><circle cx="286" cy="136" r="2.2" fill="#B66A00"/><circle cx="302" cy="158" r="2.2" fill="#B66A00"/><circle cx="246" cy="172" r="2.2" fill="#B66A00"/><circle cx="292" cy="180" r="2.2" fill="#B66A00"/><circle cx="266" cy="116" r="2.2" fill="#B66A00"/><circle cx="310" cy="120" r="2.2" fill="#B66A00"/><path d="M270.0 240.0L270.0 231.0" fill="none" stroke="#222222" stroke-width="1.3" stroke-linecap="round"/><path d="M268.2 236.0L270.0 231.0L271.8 236.0Z" fill="#222222"/><text x="270" y="254.3" font-size="6.6" text-anchor="middle" fill="#222222" font-weight="normal">gas in through the sparger</text><text x="270" y="266.3" font-size="6.6" text-anchor="middle" fill="#7B2CD9" font-weight="normal">catalyst stays suspended</text><rect x="6.0" y="276.0" width="348.0" height="42.0" rx="5" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1"/><text x="180.0" y="290.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">why the three phases are put together</text><text x="180.0" y="304.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">gas dissolves into the liquid, the liquid carries the solid catalyst, the solid</text><text x="180.0" y="316.2" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">does the chemistry: the slowest of the three steps sets the overall rate</text><text x="180.0" y="335.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">Working: gas enters at the bottom, the liquid (or slurry) is continuous, and the</text><text x="180.0" y="347.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">product leaves with the liquid; a settler or filter keeps the catalyst at home.</text></svg>