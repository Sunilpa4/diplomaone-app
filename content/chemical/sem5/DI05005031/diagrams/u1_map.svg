<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 270" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="270" fill="#ffffff"/><text x="180.0" y="24.3" font-size="12.2" text-anchor="middle" fill="#222222" font-weight="bold">Reaction engineering borrows from six sides</text><circle cx="180" cy="132" r="40" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1.8"/><text x="180" y="127.6" font-size="10.4" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Reactor</text><text x="180" y="141.6" font-size="10.4" text-anchor="middle" fill="#7B2CD9" font-weight="bold">design</text><text x="180" y="156.8" font-size="8.0" text-anchor="middle" fill="#666666" font-weight="normal">V, T, X, t</text><rect x="12" y="39" width="104" height="30" rx="6" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.2"/><text x="64" y="53.9" font-size="8.2" text-anchor="middle" fill="#222222" font-weight="bold">Thermodynamics</text><text x="64" y="65.5" font-size="7.0" text-anchor="middle" fill="#666666" font-weight="normal">how far it goes</text><path d="M110.5 64.0L145.1 108.6" fill="none" stroke="#9AA3AD" stroke-width="0.9" stroke-linecap="round"/><rect x="244" y="39" width="104" height="30" rx="6" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.2"/><text x="296" y="53.9" font-size="8.2" text-anchor="middle" fill="#222222" font-weight="bold">Kinetics</text><text x="296" y="65.5" font-size="7.0" text-anchor="middle" fill="#666666" font-weight="normal">how fast it goes</text><path d="M249.5 64.0L214.9 108.6" fill="none" stroke="#9AA3AD" stroke-width="0.9" stroke-linecap="round"/><rect x="6" y="117" width="104" height="30" rx="6" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.2"/><text x="58" y="131.9" font-size="8.2" text-anchor="middle" fill="#222222" font-weight="bold">Fluid mechanics</text><text x="58" y="143.4" font-size="7.0" text-anchor="middle" fill="#666666" font-weight="normal">how it is mixed</text><path d="M114.0 132.0L138.0 132.0" fill="none" stroke="#9AA3AD" stroke-width="0.9" stroke-linecap="round"/><rect x="250" y="117" width="104" height="30" rx="6" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.2"/><text x="302" y="131.9" font-size="8.2" text-anchor="middle" fill="#222222" font-weight="bold">Heat transfer</text><text x="302" y="143.4" font-size="7.0" text-anchor="middle" fill="#666666" font-weight="normal">how T is held</text><path d="M246.0 132.0L222.0 132.0" fill="none" stroke="#9AA3AD" stroke-width="0.9" stroke-linecap="round"/><rect x="12" y="195" width="104" height="30" rx="6" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.2"/><text x="64" y="209.9" font-size="8.2" text-anchor="middle" fill="#222222" font-weight="bold">Mass transfer</text><text x="64" y="221.4" font-size="7.0" text-anchor="middle" fill="#666666" font-weight="normal">how it reaches</text><path d="M110.5 200.0L145.1 155.4" fill="none" stroke="#9AA3AD" stroke-width="0.9" stroke-linecap="round"/><rect x="244" y="195" width="104" height="30" rx="6" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.2"/><text x="296" y="209.9" font-size="8.2" text-anchor="middle" fill="#222222" font-weight="bold">Economics</text><text x="296" y="221.4" font-size="7.0" text-anchor="middle" fill="#666666" font-weight="normal">what it costs</text><path d="M249.5 200.0L214.9 155.4" fill="none" stroke="#9AA3AD" stroke-width="0.9" stroke-linecap="round"/><text x="180.0" y="249.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">The reactor is where the six meet: kinetics fixes the size,</text><text x="180.0" y="261.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">the others decide whether it can be fed, stirred and heated.</text></svg>