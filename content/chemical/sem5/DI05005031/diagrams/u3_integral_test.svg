<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 262" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="262" fill="#ffffff"/><text x="180.0" y="24.3" font-size="12.2" text-anchor="middle" fill="#222222" font-weight="bold">The integral method: which plot is straight</text><text x="180.0" y="40.2" font-size="9.2" text-anchor="middle" fill="#666666" font-weight="normal">guess the order, integrate, then look at the plot</text><rect x="6.0" y="52.0" width="348.0" height="50.0" rx="6" fill="#FBFCFD" stroke="#9AA3AD" stroke-width="0.9"/><text x="14" y="74.8" font-size="8.0" text-anchor="start" fill="#222222" font-weight="bold">Zero:  -rA = k</text><text x="14" y="88.5" font-size="7.2" text-anchor="start" fill="#666666" font-weight="normal">CA0 - CA = k t</text><path d="M118.0 60.0L118.0 94.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><path d="M118.0 94.0L172.0 94.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><path d="M122.0 64.0L124.1 65.1L126.2 66.1L128.3 67.2L130.3 68.3L132.4 69.4L134.5 70.4L136.6 71.5L138.7 72.6L140.8 73.7L142.9 74.7L145.0 75.8L147.0 76.9L149.1 78.0L151.2 79.0L153.3 80.1L155.4 81.2L157.5 82.3L159.6 83.3L161.7 84.4L163.7 85.5L165.8 86.6L167.9 87.6L170.0 88.7" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="190" y="74.7" font-size="7.6" text-anchor="start" fill="#2E7D32" font-weight="bold">C against t is a straight line</text><text x="190" y="88.7" font-size="7.6" text-anchor="start" fill="#222222" font-weight="normal">slope = -k</text><rect x="6.0" y="110.0" width="348.0" height="50.0" rx="6" fill="#FBFCFD" stroke="#9AA3AD" stroke-width="0.9"/><text x="14" y="132.8" font-size="8.0" text-anchor="start" fill="#222222" font-weight="bold">First:  -rA = k CA</text><text x="14" y="146.5" font-size="7.2" text-anchor="start" fill="#666666" font-weight="normal">ln(CA0/CA) = k t</text><path d="M118.0 118.0L118.0 152.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><path d="M118.0 152.0L172.0 152.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><path d="M122.0 122.0L124.1 125.1L126.2 127.7L128.3 130.1L130.3 132.1L132.4 134.0L134.5 135.5L136.6 136.9L138.7 138.2L140.8 139.2L142.9 140.2L145.0 141.0L147.0 141.7L149.1 142.4L151.2 142.9L153.3 143.4L155.4 143.9L157.5 144.2L159.6 144.6L161.7 144.9L163.7 145.1L165.8 145.3L167.9 145.5L170.0 145.7" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="190" y="132.7" font-size="7.6" text-anchor="start" fill="#2E7D32" font-weight="bold">ln C against t is straight</text><text x="190" y="146.7" font-size="7.6" text-anchor="start" fill="#222222" font-weight="normal">slope = -k</text><rect x="6.0" y="168.0" width="348.0" height="50.0" rx="6" fill="#FBFCFD" stroke="#9AA3AD" stroke-width="0.9"/><text x="14" y="190.8" font-size="8.0" text-anchor="start" fill="#222222" font-weight="bold">Second:  -rA = k CA^2</text><text x="14" y="204.5" font-size="7.2" text-anchor="start" fill="#666666" font-weight="normal">1/CA - 1/CA0 = k t</text><path d="M118.0 176.0L118.0 210.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><path d="M118.0 210.0L172.0 210.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><path d="M122.0 180.0L124.1 185.2L126.2 188.6L128.3 191.0L130.3 192.7L132.4 194.1L134.5 195.2L136.6 196.1L138.7 196.9L140.8 197.5L142.9 198.0L145.0 198.5L147.0 198.9L149.1 199.3L151.2 199.6L153.3 199.9L155.4 200.1L157.5 200.4L159.6 200.6L161.7 200.8L163.7 200.9L165.8 201.1L167.9 201.3L170.0 201.4" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="190" y="190.7" font-size="7.6" text-anchor="start" fill="#2E7D32" font-weight="bold">1/C against t is straight</text><text x="190" y="204.7" font-size="7.6" text-anchor="start" fill="#222222" font-weight="normal">slope = k</text><text x="180.0" y="233.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">Only one of the three plots can be straight for a given set of data - that plot</text><text x="180.0" y="245.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">names the order, and its slope is the rate constant.</text></svg>