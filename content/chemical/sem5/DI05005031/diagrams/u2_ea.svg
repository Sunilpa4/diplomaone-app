<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 294" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="294" fill="#ffffff"/><text x="180.0" y="24.3" font-size="12.2" text-anchor="middle" fill="#222222" font-weight="bold">Reading Ea off the line</text><path d="M52.0 208.0L52.0 54.0" fill="none" stroke="#222222" stroke-width="1.3" stroke-linecap="round"/><path d="M50.2 59.0L52.0 54.0L53.8 59.0Z" fill="#222222"/><path d="M52.0 208.0L290.0 208.0" fill="none" stroke="#222222" stroke-width="1.3" stroke-linecap="round"/><path d="M285.0 206.2L290.0 208.0L285.0 209.8Z" fill="#222222"/><path d="M52.0 208.0L52.0 211.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="52.0" y="223.9" font-size="8.2" text-anchor="middle" fill="#666666" font-weight="normal">3.1</text><path d="M168.0 208.0L168.0 211.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="168.0" y="223.9" font-size="8.2" text-anchor="middle" fill="#666666" font-weight="normal">3.3</text><path d="M284.0 208.0L284.0 211.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="284.0" y="223.9" font-size="8.2" text-anchor="middle" fill="#666666" font-weight="normal">3.5</text><text x="290" y="235.1" font-size="8.799999999999999" text-anchor="end" fill="#222222" font-weight="bold">1/T  (K-1)</text><text x="49" y="49.1" font-size="8.799999999999999" text-anchor="middle" fill="#222222" font-weight="bold">ln k</text><path d="M46.0 196.4L290.0 69.6" fill="none" stroke="#BD2543" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><circle cx="52.0" cy="190.4" r="2.6" fill="#BD2543"/><circle cx="168.0" cy="133.0" r="2.6" fill="#BD2543"/><circle cx="284.0" cy="75.6" r="2.6" fill="#BD2543"/><text x="58.0" y="183.9" font-size="7.4" text-anchor="middle" fill="#222222" font-weight="bold">T1</text><text x="168.0" y="126.6" font-size="7.4" text-anchor="middle" fill="#222222" font-weight="bold">T2</text><text x="284.0" y="69.2" font-size="7.4" text-anchor="middle" fill="#222222" font-weight="bold">T3</text><path d="M52.0 75.6L284.0 75.6" fill="none" stroke="#9AA3AD" stroke-width="0.9" stroke-linecap="round" stroke-dasharray="3,3"/><path d="M52.0 190.4L52.0 75.6" fill="none" stroke="#9AA3AD" stroke-width="0.9" stroke-linecap="round" stroke-dasharray="3,3"/><text x="168.0" y="72.2" font-size="7.4" text-anchor="middle" fill="#666666" font-weight="normal">d(1/T)</text><text x="46.0" y="135.6" font-size="7.4" text-anchor="end" fill="#666666" font-weight="normal">d ln k</text><rect x="20.0" y="218.0" width="320.0" height="36.0" rx="5" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1"/><text x="180.0" y="232.8" font-size="8.0" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Ea = -R x slope: three points give three checks</text><text x="180" y="246.6" font-size="7.4" text-anchor="middle" fill="#222222" font-weight="normal">slope = d ln k / d(1/T) = -Ea/R, so Ea = 8.314 x |slope| J/mol</text><text x="180.0" y="273.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">Two points are enough for an exam answer; a line through three</text><text x="180.0" y="285.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">or more is what a report needs, because it shows the scatter.</text></svg>