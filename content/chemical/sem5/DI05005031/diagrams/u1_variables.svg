<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 290" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="290" fill="#ffffff"/><text x="180.0" y="24.3" font-size="12.2" text-anchor="middle" fill="#222222" font-weight="bold">Rate as a function of what you can change</text><circle cx="180" cy="136" r="44" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1.7"/><text x="180" y="129.4" font-size="9.6" text-anchor="middle" fill="#7B2CD9" font-weight="bold">r = f (</text><text x="180" y="143.4" font-size="9.6" text-anchor="middle" fill="#7B2CD9" font-weight="bold">C, T,</text><text x="180" y="157.2" font-size="9.0" text-anchor="middle" fill="#7B2CD9" font-weight="bold">catalyst, ...)</text><rect x="6" y="30" width="108" height="44" rx="6" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.2"/><text x="60" y="46.8" font-size="8.0" text-anchor="middle" fill="#222222" font-weight="bold">Concentration</text><text x="60" y="58.5" font-size="7.2" text-anchor="middle" fill="#1565C0" font-weight="normal">r = k C^n</text><text x="60" y="70.3" font-size="6.6" text-anchor="middle" fill="#666666" font-weight="normal">more collisions</text><path d="M105.9 65.8L144.0 110.8" fill="none" stroke="#9AA3AD" stroke-width="0.9" stroke-linecap="round"/><rect x="246" y="30" width="108" height="44" rx="6" fill="#FFFFFF" stroke="#BD2543" stroke-width="1.2"/><text x="300" y="46.8" font-size="8.0" text-anchor="middle" fill="#222222" font-weight="bold">Temperature</text><text x="300" y="58.5" font-size="7.2" text-anchor="middle" fill="#BD2543" font-weight="normal">k = A e^(-Ea/RT)</text><text x="300" y="70.3" font-size="6.6" text-anchor="middle" fill="#666666" font-weight="normal">about doubles in 10 K</text><path d="M254.1 65.8L216.0 110.8" fill="none" stroke="#9AA3AD" stroke-width="0.9" stroke-linecap="round"/><rect x="8" y="118" width="108" height="44" rx="6" fill="#FFFFFF" stroke="#00695C" stroke-width="1.2"/><text x="62" y="134.8" font-size="8.0" text-anchor="middle" fill="#222222" font-weight="bold">Pressure</text><text x="62" y="146.5" font-size="7.2" text-anchor="middle" fill="#00695C" font-weight="normal">p = C R T</text><text x="62" y="158.3" font-size="6.6" text-anchor="middle" fill="#666666" font-weight="normal">gas volume shrinks</text><path d="M118.0 139.2L136.0 137.5" fill="none" stroke="#9AA3AD" stroke-width="0.9" stroke-linecap="round"/><rect x="244" y="118" width="108" height="44" rx="6" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.2"/><text x="298" y="134.8" font-size="8.0" text-anchor="middle" fill="#222222" font-weight="bold">Catalyst</text><text x="298" y="146.5" font-size="7.2" text-anchor="middle" fill="#2E7D32" font-weight="normal">lowers Ea</text><text x="298" y="158.3" font-size="6.6" text-anchor="middle" fill="#666666" font-weight="normal">new path, same dH</text><path d="M242.0 139.2L224.0 137.5" fill="none" stroke="#9AA3AD" stroke-width="0.9" stroke-linecap="round"/><rect x="18" y="210" width="108" height="44" rx="6" fill="#FFFFFF" stroke="#B66A00" stroke-width="1.2"/><text x="72" y="226.8" font-size="8.0" text-anchor="middle" fill="#222222" font-weight="bold">Surface area</text><text x="72" y="238.5" font-size="7.2" text-anchor="middle" fill="#B66A00" font-weight="normal">area per volume</text><text x="72" y="250.3" font-size="6.6" text-anchor="middle" fill="#666666" font-weight="normal">grinding, packing</text><path d="M113.9 216.1L147.1 165.2" fill="none" stroke="#9AA3AD" stroke-width="0.9" stroke-linecap="round"/><rect x="236" y="210" width="108" height="44" rx="6" fill="#FFFFFF" stroke="#666666" stroke-width="1.2"/><text x="290" y="226.8" font-size="8.0" text-anchor="middle" fill="#222222" font-weight="bold">Solvent, light</text><text x="290" y="238.5" font-size="7.2" text-anchor="middle" fill="#666666" font-weight="normal">changes k</text><text x="290" y="250.3" font-size="6.6" text-anchor="middle" fill="#666666" font-weight="normal">photolysis, polarity</text><path d="M247.8 216.2L213.2 164.9" fill="none" stroke="#9AA3AD" stroke-width="0.9" stroke-linecap="round"/><text x="180.0" y="269.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">Only the first two are knobs the operator turns; the rest are fixed when the reactor</text><text x="180.0" y="281.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">is built, which is why the reactor is chosen after the kinetics is known.</text></svg>