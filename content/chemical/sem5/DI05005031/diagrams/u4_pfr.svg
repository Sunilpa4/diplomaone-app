<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 356" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="356" fill="#ffffff"/><text x="180.0" y="24.3" font-size="12.2" text-anchor="middle" fill="#222222" font-weight="bold">The tubular reactor (plug flow)</text><text x="180.0" y="40.2" font-size="9.2" text-anchor="middle" fill="#666666" font-weight="normal">no back-mixing: composition slides along the tube</text><path d="M44.0 106.0L316.0 106.0" fill="none" stroke="#00695C" stroke-width="1.3" stroke-linecap="round"/><path d="M44.0 168.0L316.0 168.0" fill="none" stroke="#00695C" stroke-width="1.3" stroke-linecap="round"/><path d="M50.0 106.0L50.0 88.0" fill="none" stroke="#00695C" stroke-width="1.3" stroke-linecap="round"/><path d="M50.0 94.0L50.0 86.0" fill="none" stroke="#00695C" stroke-width="1.2" stroke-linecap="round"/><path d="M48.2 91.0L50.0 86.0L51.8 91.0Z" fill="#00695C"/><path d="M310.0 168.0L310.0 186.0" fill="none" stroke="#00695C" stroke-width="1.3" stroke-linecap="round"/><path d="M310.0 180.0L310.0 188.0" fill="none" stroke="#00695C" stroke-width="1.2" stroke-linecap="round"/><path d="M311.8 183.0L310.0 188.0L308.2 183.0Z" fill="#00695C"/><text x="56" y="86.4" font-size="6.8" text-anchor="start" fill="#00695C" font-weight="normal">coolant out</text><text x="304" y="202.4" font-size="6.8" text-anchor="end" fill="#00695C" font-weight="normal">coolant in</text><rect x="44" y="116" width="272" height="42" rx="8" fill="#F7FBFF" stroke="#222222" stroke-width="2.0"/><path d="M8.0 137.0L42.0 137.0" fill="none" stroke="#222222" stroke-width="1.5" stroke-linecap="round"/><path d="M37.0 135.2L42.0 137.0L37.0 138.8Z" fill="#222222"/><path d="M318.0 137.0L348.0 137.0" fill="none" stroke="#222222" stroke-width="1.5" stroke-linecap="round"/><path d="M343.0 135.2L348.0 137.0L343.0 138.8Z" fill="#222222"/><circle cx="62" cy="137" r="8" fill="#D8ECFC" stroke="#1565C0" stroke-width="0.7"/><circle cx="96" cy="137" r="8" fill="#AFD3F5" stroke="#1565C0" stroke-width="0.7"/><circle cx="130" cy="137" r="8" fill="#86B9EC" stroke="#1565C0" stroke-width="0.7"/><circle cx="164" cy="137" r="8" fill="#5F9DDE" stroke="#1565C0" stroke-width="0.7"/><circle cx="198" cy="137" r="8" fill="#3F82C8" stroke="#1565C0" stroke-width="0.7"/><circle cx="232" cy="137" r="8" fill="#2C69AC" stroke="#1565C0" stroke-width="0.7"/><circle cx="266" cy="137" r="8" fill="#1E5290" stroke="#1565C0" stroke-width="0.7"/><circle cx="300" cy="137" r="8" fill="#173F70" stroke="#1565C0" stroke-width="0.7"/><text x="8" y="128.5" font-size="7.2" text-anchor="start" fill="#222222" font-weight="normal">feed</text><text x="348" y="128.5" font-size="7.2" text-anchor="end" fill="#222222" font-weight="normal">product</text><text x="180" y="186.5" font-size="7.2" text-anchor="middle" fill="#222222" font-weight="normal">jacket around the tube</text><text x="180" y="102.4" font-size="6.8" text-anchor="middle" fill="#7B2CD9" font-weight="normal">the plug: one colour deepens as A is used up</text><path d="M60.0 264.0L60.0 206.0" fill="none" stroke="#222222" stroke-width="1.3" stroke-linecap="round"/><path d="M58.2 211.0L60.0 206.0L61.8 211.0Z" fill="#222222"/><path d="M60.0 264.0L298.0 264.0" fill="none" stroke="#222222" stroke-width="1.3" stroke-linecap="round"/><path d="M293.0 262.2L298.0 264.0L293.0 265.8Z" fill="#222222"/><text x="298" y="280.1" font-size="8.799999999999999" text-anchor="end" fill="#222222" font-weight="bold">length z</text><text x="57" y="201.1" font-size="8.799999999999999" text-anchor="middle" fill="#222222" font-weight="bold">CA</text><path d="M60.0 214.0L66.0 216.6L72.0 219.0L78.0 221.3L84.0 223.5L90.0 225.6L96.0 227.5L102.0 229.3L108.0 231.1L114.0 232.7L120.0 234.2L126.0 235.7L132.0 237.0L138.0 238.3L144.0 239.5L150.0 240.7L156.0 241.8L162.0 242.8L168.0 243.8L174.0 244.7L180.0 245.5L186.0 246.4L192.0 247.1L198.0 247.9L204.0 248.5L210.0 249.2L216.0 249.8L222.0 250.4L228.0 250.9L234.0 251.4L240.0 251.9L246.0 252.4L252.0 252.8L258.0 253.2L264.0 253.6L270.0 253.9L276.0 254.3L282.0 254.6L288.0 254.9" fill="none" stroke="#1565C0" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round"/><text x="300" y="234.4" font-size="6.8" text-anchor="end" fill="#666666" font-weight="normal">steep at first,</text><text x="300" y="246.4" font-size="6.8" text-anchor="end" fill="#666666" font-weight="normal">then flat</text><rect x="6.0" y="288.0" width="348.0" height="30.0" rx="5" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1"/><text x="180.0" y="302.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">the model in one line</text><text x="180.0" y="316.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">no mixing along the tube: each slice behaves like a tiny batch reactor</text><text x="180.0" y="335.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">Working: fluid moves as plugs, so every element has the same residence time;</text><text x="180.0" y="347.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">a PFR needs less volume than a CSTR for the same conversion above order zero.</text></svg>