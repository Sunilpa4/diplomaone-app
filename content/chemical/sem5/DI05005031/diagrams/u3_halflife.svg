<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="280" fill="#ffffff"/><text x="180.0" y="24.3" font-size="12.2" text-anchor="middle" fill="#222222" font-weight="bold">Half-life against starting concentration</text><text x="180.0" y="40.2" font-size="9.2" text-anchor="middle" fill="#666666" font-weight="normal">t1/2 = const x CA0^(1-n), so the slope is 1 - n</text><path d="M46.0 178.0L46.0 56.0" fill="none" stroke="#222222" stroke-width="1.3" stroke-linecap="round"/><path d="M44.2 61.0L46.0 56.0L47.8 61.0Z" fill="#222222"/><path d="M46.0 178.0L314.0 178.0" fill="none" stroke="#222222" stroke-width="1.3" stroke-linecap="round"/><path d="M309.0 176.2L314.0 178.0L309.0 179.8Z" fill="#222222"/><text x="314" y="194.1" font-size="8.799999999999999" text-anchor="end" fill="#222222" font-weight="bold">log CA0</text><text x="43" y="51.1" font-size="8.799999999999999" text-anchor="middle" fill="#222222" font-weight="bold">log t1/2</text><path d="M76.0 150.2L296.0 71.0" fill="none" stroke="#B66A00" stroke-width="2.0" stroke-linecap="round"/><path d="M76.0 120.0L296.0 120.0" fill="none" stroke="#1565C0" stroke-width="2.0" stroke-linecap="round"/><path d="M76.0 89.8L296.0 169.0" fill="none" stroke="#2E7D32" stroke-width="2.0" stroke-linecap="round"/><circle cx="160.0" cy="120.0" r="2.4" fill="#BD2543"/><rect x="14" y="196" width="332" height="46" rx="5" fill="#FBFCFD" stroke="#9AA3AD" stroke-width="0.9"/><path d="M24.0 205.0L44.0 205.0" fill="none" stroke="#B66A00" stroke-width="2.4" stroke-linecap="round"/><text x="52" y="210.7" font-size="7.6" text-anchor="start" fill="#222222" font-weight="normal">n = 0: t1/2 doubles when CA0 doubles</text><path d="M24.0 217.0L44.0 217.0" fill="none" stroke="#1565C0" stroke-width="2.4" stroke-linecap="round"/><text x="52" y="222.7" font-size="7.6" text-anchor="start" fill="#222222" font-weight="normal">n = 1: t1/2 does not depend on CA0</text><path d="M24.0 229.0L44.0 229.0" fill="none" stroke="#2E7D32" stroke-width="2.4" stroke-linecap="round"/><text x="52" y="234.7" font-size="7.6" text-anchor="start" fill="#222222" font-weight="normal">n = 2: t1/2 halves when CA0 doubles</text><text x="180.0" y="259.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">Plot log t1/2 against log CA0 and measure the slope: 1 - n gives the order without</text><text x="180.0" y="271.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">ever integrating the rate law, which is why the method is used on new reactions.</text></svg>