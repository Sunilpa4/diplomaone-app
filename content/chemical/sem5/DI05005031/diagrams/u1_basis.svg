<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 284" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="284" fill="#ffffff"/><text x="180.0" y="24.3" font-size="12.2" text-anchor="middle" fill="#222222" font-weight="bold">One rate, four denominators</text><rect x="14" y="54" width="156" height="82" rx="6" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.2"/><text x="92" y="72.9" font-size="8.2" text-anchor="middle" fill="#1565C0" font-weight="bold">Per volume of fluid</text><text x="92" y="93.0" font-size="8.6" text-anchor="middle" fill="#222222" font-weight="bold">-rA = (1/V) dnA/dt</text><text x="92" y="108.8" font-size="8.0" text-anchor="middle" fill="#666666" font-weight="normal">mol / (m3 s)</text><text x="92" y="123.6" font-size="7.4" text-anchor="middle" fill="#666666" font-weight="normal">batch, CSTR, PFR</text><rect x="190" y="54" width="156" height="82" rx="6" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.2"/><text x="268" y="72.9" font-size="8.2" text-anchor="middle" fill="#2E7D32" font-weight="bold">Per mass of catalyst</text><text x="268" y="93.0" font-size="8.6" text-anchor="middle" fill="#222222" font-weight="bold">-rA' = (1/Wc) dnA/dt</text><text x="268" y="108.8" font-size="8.0" text-anchor="middle" fill="#666666" font-weight="normal">mol / (kg s)</text><text x="268" y="123.6" font-size="7.4" text-anchor="middle" fill="#666666" font-weight="normal">fixed bed</text><rect x="14" y="148" width="156" height="82" rx="6" fill="#FFFFFF" stroke="#B66A00" stroke-width="1.2"/><text x="92" y="166.9" font-size="8.2" text-anchor="middle" fill="#B66A00" font-weight="bold">Per area of catalyst</text><text x="92" y="187.0" font-size="8.6" text-anchor="middle" fill="#222222" font-weight="bold">-rA'' = (1/S) dnA/dt</text><text x="92" y="202.8" font-size="8.0" text-anchor="middle" fill="#666666" font-weight="normal">mol / (m2 s)</text><text x="92" y="217.6" font-size="7.4" text-anchor="middle" fill="#666666" font-weight="normal">gas-liquid</text><rect x="190" y="148" width="156" height="82" rx="6" fill="#FFFFFF" stroke="#7B2CD9" stroke-width="1.2"/><text x="268" y="166.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Per mass of solid</text><text x="268" y="187.0" font-size="8.6" text-anchor="middle" fill="#222222" font-weight="bold">-rA''' = (1/m) dnA/dt</text><text x="268" y="202.8" font-size="8.0" text-anchor="middle" fill="#666666" font-weight="normal">mol / (kg s)</text><text x="268" y="217.6" font-size="7.4" text-anchor="middle" fill="#666666" font-weight="normal">fluid-solid</text><text x="180.0" y="251.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">The moles per second are the same in all four; only the</text><text x="180.0" y="263.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">denominator changes, and with it the unit of k.</text></svg>