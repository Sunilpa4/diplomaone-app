<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 236" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="236" fill="#ffffff"/><text x="180.0" y="24.3" font-size="12.2" text-anchor="middle" fill="#222222" font-weight="bold">Three roads from one table of data</text><text x="180.0" y="40.2" font-size="9.2" text-anchor="middle" fill="#666666" font-weight="normal">the same C against t table, three plots</text><rect x="60" y="50" width="240" height="30" rx="6" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1.5"/><text x="180" y="72.0" font-size="8.6" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Batch data: CA measured against t</text><path d="M180.0 80.0L180.0 92.0" fill="none" stroke="#222222" stroke-width="1.3" stroke-linecap="round"/><path d="M60.0 92.0L300.0 92.0" fill="none" stroke="#222222" stroke-width="1.3" stroke-linecap="round"/><path d="M60.0 92.0L60.0 104.0" fill="none" stroke="#222222" stroke-width="1.3" stroke-linecap="round"/><path d="M61.8 99.0L60.0 104.0L58.2 99.0Z" fill="#222222"/><path d="M180.0 92.0L180.0 104.0" fill="none" stroke="#222222" stroke-width="1.3" stroke-linecap="round"/><path d="M181.8 99.0L180.0 104.0L178.2 99.0Z" fill="#222222"/><path d="M300.0 92.0L300.0 104.0" fill="none" stroke="#222222" stroke-width="1.3" stroke-linecap="round"/><path d="M301.8 99.0L300.0 104.0L298.2 99.0Z" fill="#222222"/><rect x="12" y="106" width="96" height="78" rx="5" fill="#FFFFFF" stroke="#BD2543" stroke-width="1.4"/><text x="60" y="124.9" font-size="8.2" text-anchor="middle" fill="#BD2543" font-weight="bold">Differential</text><text x="60" y="138.6" font-size="7.4" text-anchor="middle" fill="#222222" font-weight="normal">tangent slopes</text><text x="60" y="150.6" font-size="7.4" text-anchor="middle" fill="#222222" font-weight="normal">plot ln(-rA)</text><text x="60" y="162.6" font-size="7.4" text-anchor="middle" fill="#222222" font-weight="normal">against ln CA</text><text x="60" y="174.6" font-size="7.4" text-anchor="middle" fill="#222222" font-weight="normal">slope = n</text><rect x="132" y="106" width="96" height="78" rx="5" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.4"/><text x="180" y="124.9" font-size="8.2" text-anchor="middle" fill="#1565C0" font-weight="bold">Integral</text><text x="180" y="138.6" font-size="7.4" text-anchor="middle" fill="#222222" font-weight="normal">guess n</text><text x="180" y="150.6" font-size="7.4" text-anchor="middle" fill="#222222" font-weight="normal">integrate the law</text><text x="180" y="162.6" font-size="7.4" text-anchor="middle" fill="#222222" font-weight="normal">plot the linear form</text><text x="180" y="174.6" font-size="7.4" text-anchor="middle" fill="#222222" font-weight="normal">straight line = n</text><rect x="252" y="106" width="96" height="78" rx="5" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.4"/><text x="300" y="124.9" font-size="8.2" text-anchor="middle" fill="#2E7D32" font-weight="bold">Half-life</text><text x="300" y="138.6" font-size="7.4" text-anchor="middle" fill="#222222" font-weight="normal">t1/2 at several CA0</text><text x="300" y="150.6" font-size="7.4" text-anchor="middle" fill="#222222" font-weight="normal">plot log t1/2</text><text x="300" y="162.6" font-size="7.4" text-anchor="middle" fill="#222222" font-weight="normal">against log CA0</text><text x="300" y="174.6" font-size="7.4" text-anchor="middle" fill="#222222" font-weight="normal">slope = 1 - n</text><text x="180.0" y="209.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">Each route needs the same raw data and gives the same answer if the order is</text><text x="180.0" y="221.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">real; run two of them and let them agree before you trust the number.</text></svg>