ill-opacity="0.14" stroke="#B66A00" stroke-width="1.4"/><text x="70" y="136.6" font-size="7.4" text-anchor="start" fill="#B66A00" font-weight="bold">area = k tau = 4.0</text><text x="70" y="148.4" font-size="6.8" text-anchor="start" fill="#B66A00" font-weight="normal">height 5 at X = 0.8</text><text x="244.8" y="160.4" font-size="6.8" text-anchor="end" fill="#B66A00" font-weight="normal">width 0.8</text><text x="180" y="204.4" font-size="7.0" text-anchor="middle" fill="#222222" font-weight="bold">with k = 0.25 h-1 and v0 = 7.2 m3/h: tau = 16 h, V = 115 m3</text><rect x="6.0" y="212.0" width="348.0" height="54.0" rx="5" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1"/><text x="180.0" y="226.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">read the size straight off the plot</text><text x="180.0" y="240.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">V = FA0 x area = v0 CA0 x 4.0/(k CA0) = 4 v0/k</text><text x="180.0" y="252.2" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">first order: k tau = X/(1 - X) = 4 at 80 %, 9 at 90 %, 19 at 95 %</text><text x="180.0" y="263.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">the tank works at the exit rate - the slowest rate inside it</text><text x="180.0" y="289.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">The cost of a CSTR rises faster than the conversion it buys: doubling the</text><text x="180.0" y="301.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">conversion from 80 to 90 % more than doubles the volume.</text></svg>