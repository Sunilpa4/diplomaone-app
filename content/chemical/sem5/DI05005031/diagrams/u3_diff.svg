<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 292" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="292" fill="#ffffff"/><text x="180.0" y="24.3" font-size="12.2" text-anchor="middle" fill="#222222" font-weight="bold">The differential method: slopes, then a log-log line</text><text x="180.0" y="40.2" font-size="9.2" text-anchor="middle" fill="#666666" font-weight="normal">each tangent is one rate; the line gives n and k</text><rect x="6.0" y="52.0" width="168.0" height="198.0" rx="6" fill="#FBFCFD" stroke="#9AA3AD" stroke-width="0.9"/><text x="90" y="70.8" font-size="8.0" text-anchor="middle" fill="#222222" font-weight="bold">1. draw the C-t curve</text><path d="M34.0 196.0L34.0 92.0" fill="none" stroke="#222222" stroke-width="1.3" stroke-linecap="round"/><path d="M32.2 97.0L34.0 92.0L35.8 97.0Z" fill="#222222"/><path d="M34.0 196.0L156.0 196.0" fill="none" stroke="#222222" stroke-width="1.3" stroke-linecap="round"/><path d="M151.0 194.2L156.0 196.0L151.0 197.8Z" fill="#222222"/><text x="156" y="212.1" font-size="8.799999999999999" text-anchor="end" fill="#222222" font-weight="bold">t</text><text x="31" y="87.1" font-size="8.799999999999999" text-anchor="middle" fill="#222222" font-weight="bold">CA</text><path d="M34.0 96.0L38.0 103.9L42.0 111.3L46.0 118.0L50.0 124.2L54.0 129.9L58.0 135.1L62.0 140.0L66.0 144.4L70.0 148.5L74.0 152.3L78.0 155.8L82.0 159.0L86.0 161.9L90.0 164.6L94.0 167.1L98.0 169.4L102.0 171.5L106.0 173.5L110.0 175.2L114.0 176.9L118.0 178.4L122.0 179.8L126.0 181.1L130.0 182.3L134.0 183.4L138.0 184.4L142.0 185.3L146.0 186.1L150.0 186.9" fill="none" stroke="#1565C0" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round"/><path d="M63.0 142.3L85.0 162.2" fill="none" stroke="#BD2543" stroke-width="1.9" stroke-linecap="round"/><circle cx="74.0" cy="152.3" r="2.0" fill="#BD2543"/><circle cx="62.0" cy="122.8" r="5.2" fill="#FFFFFF" stroke="#BD2543" stroke-width="1"/><text x="62" y="127.7" font-size="6.6" text-anchor="middle" fill="#BD2543" font-weight="bold">1</text><path d="M101.0 171.6L123.0 180.6" fill="none" stroke="#BD2543" stroke-width="1.9" stroke-linecap="round"/><circle cx="112.0" cy="176.1" r="2.0" fill="#BD2543"/><circle cx="100.0" cy="154.5" r="5.2" fill="#FFFFFF" stroke="#BD2543" stroke-width="1"/><text x="100" y="159.4" font-size="6.6" text-anchor="middle" fill="#BD2543" font-weight="bold">2</text><text x="90" y="238.6" font-size="7.4" text-anchor="middle" fill="#666666" font-weight="normal">each red tangent is one rate</text><rect x="184.0" y="52.0" width="170.0" height="198.0" rx="6" fill="#FBFCFD" stroke="#9AA3AD" stroke-width="0.9"/><text x="269" y="70.8" font-size="8.0" text-anchor="middle" fill="#222222" font-weight="bold">2. plot ln(-rA) against ln CA</text><path d="M216.0 196.0L216.0 92.0" fill="none" stroke="#222222" stroke-width="1.3" stroke-linecap="round"/><path d="M214.2 97.0L216.0 92.0L217.8 97.0Z" fill="#222222"/><path d="M216.0 196.0L338.0 196.0" fill="none" stroke="#222222" stroke-width="1.3" stroke-linecap="round"/><path d="M333.0 194.2L338.0 196.0L333.0 197.8Z" fill="#222222"/><text x="338" y="212.1" font-size="8.799999999999999" text-anchor="end" fill="#222222" font-weight="bold">ln CA</text><text x="213" y="87.1" font-size="8.799999999999999" text-anchor="middle" fill="#222222" font-weight="bold">ln(-rA)</text><path d="M219.0 190.0L330.0 125.0" fill="none" stroke="#9AA3AD" stroke-width="0.9" stroke-linecap="round" stroke-dasharray="3,3"/><path d="M219.0 190.0L250.0 172.0L281.0 154.0L312.0 136.0L330.0 125.0" fill="none" stroke="#2E7D32" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round"/><circle cx="228.0" cy="185.0" r="2.2" fill="#BD2543"/><circle cx="272.0" cy="160.0" r="2.2" fill="#BD2543"/><circle cx="316.0" cy="134.0" r="2.2" fill="#BD2543"/><text x="330" y="114.7" font-size="7.6" text-anchor="end" fill="#2E7D32" font-weight="bold">slope = n</text><text x="269" y="238.6" font-size="7.4" text-anchor="middle" fill="#666666" font-weight="normal">the intercept is ln k</text><text x="180.0" y="271.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">A tangent is a derivative, so read the rate at the mid-point of its interval;</text><text x="180.0" y="283.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">a few points on a straight log-log line beat one cleverly drawn tangent.</text></svg>