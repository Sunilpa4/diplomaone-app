<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 314" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="314" fill="#ffffff"/><text x="180.0" y="24.3" font-size="12.2" text-anchor="middle" fill="#222222" font-weight="bold">Space time against holding time</text><text x="180.0" y="40.2" font-size="9.2" text-anchor="middle" fill="#666666" font-weight="normal">one is fixed by the feed, the other by conditions</text><rect x="112.0" y="76.0" width="100.0" height="104.0" rx="6" fill="#F7FBFF" stroke="#222222" stroke-width="2.0"/><rect x="112.0" y="102.0" width="100.0" height="78.0" rx="1" fill="#DCEEFB"/><path d="M112.0 102.0L212.0 102.0" fill="none" stroke="#1565C0" stroke-width="1.3" stroke-linecap="round"/><path d="M8.0 150.0L108.0 150.0" fill="none" stroke="#222222" stroke-width="1.6" stroke-linecap="round"/><path d="M103.0 148.2L108.0 150.0L103.0 151.8Z" fill="#222222"/><text x="8" y="142.4" font-size="6.9" text-anchor="start" fill="#222222" font-weight="normal">feed v0 = 0.2 m3/min</text><text x="8" y="164.4" font-size="6.9" text-anchor="start" fill="#666666" font-weight="normal">1 bar, 300 K</text><path d="M214.0 112.0L268.0 112.0" fill="none" stroke="#222222" stroke-width="1.6" stroke-linecap="round"/><path d="M263.0 110.2L268.0 112.0L263.0 113.8Z" fill="#222222"/><text x="272" y="110.4" font-size="6.9" text-anchor="start" fill="#222222" font-weight="normal">product</text><text x="272" y="122.4" font-size="6.9" text-anchor="start" fill="#666666" font-weight="normal">5 bar, 400 K</text><text x="162" y="98.7" font-size="7.6" text-anchor="middle" fill="#7B2CD9" font-weight="bold">V = 2 m3</text><text x="162" y="190.3" font-size="6.6" text-anchor="middle" fill="#666666" font-weight="normal">the gas is compressed to 5 bar as it enters</text><rect x="6.0" y="200.0" width="170.0" height="76.0" rx="6" fill="#FBFCFD" stroke="#9AA3AD" stroke-width="0.9"/><text x="91" y="218.6" font-size="7.4" text-anchor="middle" fill="#1565C0" font-weight="bold">SPACE TIME</text><text x="91" y="234.4" font-size="7.0" text-anchor="middle" fill="#222222" font-weight="normal">tau = V/v0 = 2/0.2</text><text x="91" y="248.4" font-size="7.0" text-anchor="middle" fill="#222222" font-weight="bold">= 10 min</text><text x="91" y="264.3" font-size="6.6" text-anchor="middle" fill="#666666" font-weight="normal">a property of the feed</text><rect x="184.0" y="200.0" width="170.0" height="76.0" rx="6" fill="#FBFCFD" stroke="#9AA3AD" stroke-width="0.9"/><text x="269" y="218.6" font-size="7.4" text-anchor="middle" fill="#00695C" font-weight="bold">HOLDING TIME</text><text x="269" y="234.4" font-size="6.8" text-anchor="middle" fill="#222222" font-weight="normal">v = 0.2 x (1/5) x (400/300)</text><text x="269" y="248.4" font-size="7.0" text-anchor="middle" fill="#222222" font-weight="bold">t = 2/0.0533 = 37.5 min</text><text x="269" y="264.3" font-size="6.6" text-anchor="middle" fill="#666666" font-weight="normal">a property of the conditions</text><text x="180.0" y="295.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">Space velocity is the reciprocal: SV = v0/V = 1/tau = 0.1 min-1 = 6 h-1.</text><text x="180.0" y="307.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">Doubling the feed halves tau, doubles SV, and lowers the conversion.</text></svg>