F6E3C5" fill-opacity="0.28" stroke="#B66A00" stroke-width="1.3"/><rect x="192.5" y="120.0" width="58.3" height="44.0" fill="#7B2CD9" fill-opacity="0.16" stroke="#7B2CD9" stroke-width="1.3"/><text x="66" y="132.7" font-size="6.8" text-anchor="start" fill="#B66A00" font-weight="normal">tank 1</text><text x="66" y="141.7" font-size="6.8" text-anchor="start" fill="#B66A00" font-weight="normal">k tau = 1.24</text><text x="198.508" y="108.4" font-size="6.8" text-anchor="start" fill="#7B2CD9" font-weight="normal">tank 2</text><text x="198.508" y="117.4" font-size="6.8" text-anchor="start" fill="#7B2CD9" font-weight="normal">k tau = 1.24</text><text x="180" y="204.4" font-size="7.0" text-anchor="middle" fill="#222222" font-weight="bold">4.94 h and 35.6 m3 in each tank: 71 m3 in all</text><rect x="6.0" y="212.0" width="348.0" height="54.0" rx="5" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1"/><text x="180.0" y="226.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">why a train of tanks is common</text><text x="180.0" y="240.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">one CSTR needs k tau = 4.0; two equal tanks need 1.24 each</text><text x="180.0" y="252.2" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">71 m3 instead of 115 m3 - 38 % less steel for the same duty</text><text x="180.0" y="263.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">the gain per tank falls away: three need 0.86 each, four 0.68</text><text x="180.0" y="289.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">In practice the first tank takes most of the conversion and the last polishes</text><text x="180.0" y="301.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">it; both must still mix faster than their own space time.</text></svg>