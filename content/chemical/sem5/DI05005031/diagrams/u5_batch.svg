ecap="round"/><path d="M68.0 174.4L68.0 180.8" fill="none" stroke="#222222" stroke-width="2.0" stroke-linecap="round"/><path d="M68.0 170.0L50.0 170.0" fill="none" stroke="#222222" stroke-width="2.0" stroke-linecap="round"/><path d="M50.0 166.8L50.0 173.2" fill="none" stroke="#222222" stroke-width="2.0" stroke-linecap="round"/><text x="68" y="130.4" font-size="6.8" text-anchor="middle" fill="#7B2CD9" font-weight="normal">charge once,</text><text x="68" y="140.4" font-size="6.8" text-anchor="middle" fill="#7B2CD9" font-weight="normal">no outlet</text><text x="10" y="64.3" font-size="6.6" text-anchor="start" fill="#00695C" font-weight="normal">jacket sets T</text><text x="68" y="196.4" font-size="7.0" text-anchor="middle" fill="#222222" font-weight="normal">batch vessel</text><path d="M160.0 164.0L160.0 74.0" fill="none" stroke="#222222" stroke-width="1.3" stroke-linecap="round"/><path d="M158.2 79.0L160.0 74.0L161.8 79.0Z" fill="#222222"/><path d="M160.0 164.0L322.0 164.0" fill="none" stroke="#222222" stroke-width="1.3" stroke-linecap="round"/><path d="M317.0 162.2L322.0 164.0L317.0 165.8Z" fill="#222222"/><path d="M160.0 164.0L160.0 167.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="160.0" y="179.9" font-size="8.2" text-anchor="middle" fill="#666666" font-weight="normal">0</text><path d="M238.0 164.0L238.0 167.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="238.0" y="179.9" font-size="8.2" text-anchor="middle" fill="#666666" font-weight="normal">75</text><path d="M306.6 164.0L306.6 167.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="306.64" y="179.9" font-size="8.2" text-anchor="middle" fill="#666666" font-weight="normal">150</text><path d="M157.0 159.7L160.0 159.7" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="155" y="165.2" font-size="8.2" text-anchor="end" fill="#666666" font-weight="normal">0</text><path d="M157.0 121.0L160.0 121.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="155" y="126.5" font-size="8.2" text-anchor="end" fill="#666666" font-weight="normal">0.5</text><path d="M157.0 82.3L160.0 82.3" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="155" y="87.8" font-size="8.2" text-anchor="end" fill="#666666" font-weight="normal">1.0</text><text x="322" y="191.1" font-size="8.799999999999999" text-anchor="end" fill="#222222" font-weight="bold">time t</text><text x="157" y="69.1" font-size="8.799999999999999" text-anchor="middle" fill="#222222" font-weight="bold">CA</text><path d="M160.0 82.0L163.9 88.3L167.8 94.1L171.7 99.5L175.6 104.5L179.5 109.0L183.4 113.3L187.3 117.2L191.2 120.8L195.1 124.1L199.0 127.2L202.9 130.0L206.8 132.6L210.7 135.0L214.6 137.2L218.5 139.3L222.4 141.2L226.3 143.0L230.2 144.6L234.1 146.1L238.0 147.4L241.9 148.7L245.8 149.9L249.7 151.0L253.6 152.0L257.5 152.9L261.4 153.8L265.3 154.5L269.2 155.3L273.1 155.9L277.0 156.6L280.9 157.1L284.8 157.7L288.7 158.1L292.6 158.6L296.5 159.0L300.4 159.4L304.3 159.8L308.2 160.1L312.1 160.4L316.0 160.7" fill="none" stroke="#1565C0" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round"/><path d="M173.0 146.8L225.0 107.5" fill="none" stroke="#BD2543" stroke-width="1.3" stroke-linecap="round"/><text x="229.0" y="107.8" font-size="6.6" text-anchor="start" fill="#BD2543" font-weight="normal">tangent</text><text x="229.0" y="117.8" font-size="6.6" text-anchor="start" fill="#BD2543" font-weight="normal">slope = -rA</text><path d="M306.6 78.0L306.6 168.0" fill="none" stroke="#9AA3AD" stroke-width="0.9" stroke-linecap="round" stroke-dasharray="3,3"/><text x="348" y="62.4" font-size="6.8" text-anchor="end" fill="#1565C0" font-weight="normal">X = 0.95 at t = 150 min</text><rect x="6.0" y="204.0" width="348.0" height="54.0" rx="5" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1"/><text x="180.0" y="218.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">the design step, in order</text><text x="180.0" y="232.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">1. isothermal, constant volume: t = (1/k) ln[1/(1 - X)] first order</text><text x="180.0" y="244.2" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">2. add filling, heating, emptying and cleaning to get the cycle time</text><text x="180.0" y="255.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">3. divide the daily duty by one batch to get the number of batches</text><text x="180.0" y="279.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">150 min of reaction with a 30 min turnaround gives 8 batches a day, each</text><text x="180.0" y="291.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">delivering 1.9 kmol from 1 m3: 15.2 kmol a day out of one vessel.</text></svg>