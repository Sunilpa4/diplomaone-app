dth="1"/><text x="180.0" y="204.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">the assumption that makes each model solvable</text><text x="180.0" y="218.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">batch and CSTR: composition is the same at every point (perfect mixing)</text><text x="180.0" y="230.2" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">PFR: no mixing in the flow direction, perfect mixing across the tube</text><text x="180.0" y="253.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">Every design equation of Unit 5 is written for one of these three pictures; the</text><text x="180.0" y="265.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">real reactor is then judged by how far it sits from the picture chosen for it.</text></svg>