<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 238" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="238" fill="#ffffff"/><text x="180.0" y="24.3" font-size="12.2" text-anchor="middle" fill="#222222" font-weight="bold">The integrated laws, order by order</text><text x="180.0" y="40.2" font-size="9.2" text-anchor="middle" fill="#666666" font-weight="normal">one straight-line variable and one half-life each</text><rect x="8" y="48" width="344" height="22" rx="4" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1.2"/><text x="12" y="64.7" font-size="7.8" text-anchor="start" fill="#7B2CD9" font-weight="bold">order</text><text x="58" y="64.7" font-size="7.8" text-anchor="start" fill="#7B2CD9" font-weight="bold">the law, from -dCA/dt = k CA^n</text><text x="250" y="64.7" font-size="7.8" text-anchor="start" fill="#7B2CD9" font-weight="bold">half-life</text><rect x="8" y="70" width="344" height="30" rx="4" fill="#FFFFFF" stroke="#9AA3AD" stroke-width="0.9"/><text x="24" y="92.2" font-size="9.0" text-anchor="middle" fill="#222222" font-weight="bold">0</text><text x="58" y="91.7" font-size="7.6" text-anchor="start" fill="#1565C0" font-weight="normal">CA0 - CA = k t</text><text x="250" y="91.5" font-size="7.2" text-anchor="start" fill="#2E7D32" font-weight="normal">CA0 / (2k)</text><rect x="8" y="100" width="344" height="30" rx="4" fill="#FAFAFC" stroke="#9AA3AD" stroke-width="0.9"/><text x="24" y="122.2" font-size="9.0" text-anchor="middle" fill="#222222" font-weight="bold">1</text><text x="58" y="121.7" font-size="7.6" text-anchor="start" fill="#1565C0" font-weight="normal">ln(CA0/CA) = k t</text><text x="250" y="121.5" font-size="7.2" text-anchor="start" fill="#2E7D32" font-weight="normal">0.693 / k</text><rect x="8" y="130" width="344" height="30" rx="4" fill="#FFFFFF" stroke="#9AA3AD" stroke-width="0.9"/><text x="24" y="152.2" font-size="9.0" text-anchor="middle" fill="#222222" font-weight="bold">2</text><text x="58" y="151.7" font-size="7.6" text-anchor="start" fill="#1565C0" font-weight="normal">1/CA - 1/CA0 = k t</text><text x="250" y="151.5" font-size="7.2" text-anchor="start" fill="#2E7D32" font-weight="normal">1 / (k CA0)</text><rect x="8" y="160" width="344" height="30" rx="4" fill="#FAFAFC" stroke="#9AA3AD" stroke-width="0.9"/><text x="24" y="182.2" font-size="9.0" text-anchor="middle" fill="#222222" font-weight="bold">n</text><text x="58" y="181.7" font-size="7.6" text-anchor="start" fill="#1565C0" font-weight="normal">CA^(1-n) - CA0^(1-n) = (n-1) k t</text><text x="238" y="176.4" font-size="7.0" text-anchor="start" fill="#2E7D32" font-weight="normal">(2^(n-1)-1)</text><text x="238" y="187.4" font-size="7.0" text-anchor="start" fill="#2E7D32" font-weight="normal">/ ((n-1) k CA0^(n-1))</text><text x="180.0" y="209.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">k carries the order too: mol m-3 s-1, s-1, m3 mol-1 s-1 ... (mol m-3)^(1-n) s-1;</text><text x="180.0" y="221.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">an answer in the wrong unit of k is the fastest way to lose the marks for it.</text></svg>