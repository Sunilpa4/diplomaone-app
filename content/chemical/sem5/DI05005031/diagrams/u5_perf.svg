<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 272" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="272" fill="#ffffff"/><text x="180.0" y="24.3" font-size="12.2" text-anchor="middle" fill="#222222" font-weight="bold">One balance, three design equations</text><text x="180.0" y="40.2" font-size="9.2" text-anchor="middle" fill="#666666" font-weight="normal">the performance equation of a single reactor</text><rect x="6.0" y="48.0" width="348.0" height="106.0" rx="6" fill="#FBFCFD" stroke="#9AA3AD" stroke-width="0.9"/><text x="180" y="66.7" font-size="7.8" text-anchor="middle" fill="#222222" font-weight="bold">mole balance on A:   in - out + generation = accumulation</text><text x="16" y="86.9" font-size="8.4" text-anchor="start" fill="#1565C0" font-weight="bold">BATCH</text><text x="68" y="86.6" font-size="7.4" text-anchor="start" fill="#222222" font-weight="normal">t = NA0 x integral dX/(-rA V)</text><text x="342" y="86.5" font-size="7.0" text-anchor="end" fill="#666666" font-weight="normal">the answer is a time</text><text x="16" y="108.9" font-size="8.4" text-anchor="start" fill="#2E7D32" font-weight="bold">CSTR</text><text x="68" y="108.6" font-size="7.4" text-anchor="start" fill="#222222" font-weight="normal">V = FA0 X / (-rA)exit</text><text x="342" y="108.5" font-size="7.0" text-anchor="end" fill="#666666" font-weight="normal">a volume, no integral</text><text x="16" y="130.9" font-size="8.4" text-anchor="start" fill="#B66A00" font-weight="bold">PFR</text><text x="68" y="130.6" font-size="7.4" text-anchor="start" fill="#222222" font-weight="normal">V = FA0 x integral dX/(-rA)</text><text x="342" y="130.4" font-size="7.0" text-anchor="end" fill="#666666" font-weight="normal">a volume, one integral</text><rect x="6.0" y="166.0" width="348.0" height="54.0" rx="5" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1"/><text x="180.0" y="180.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">what changes from one equation to the next</text><text x="180.0" y="194.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">batch: no flow at all, so the balance runs in time</text><text x="180.0" y="206.2" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">CSTR: perfectly mixed, so the exit is the inside composition</text><text x="180.0" y="217.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">PFR: plug flow, so the balance runs along the length</text><text x="180.0" y="241.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">Constant density: v = v0, so CA = CA0 (1 - X) and the rate becomes a</text><text x="180.0" y="253.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">function of X alone. That is what lets all three equations be</text><text x="180.0" y="265.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">integrated by hand instead of solved numerically.</text></svg>