<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 288" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="288" fill="#ffffff"/><text x="180.0" y="24.3" font-size="12.2" text-anchor="middle" fill="#222222" font-weight="bold">H2 + Br2 -&gt; 2 HBr: a chain with three kinds of step</text><rect x="18" y="38" width="150" height="30" rx="5" fill="#FFFFFF" stroke="#BD2543" stroke-width="1.3"/><text x="26" y="52.7" font-size="7.6" text-anchor="start" fill="#BD2543" font-weight="bold">Initiation</text><text x="26" y="64.6" font-size="7.4" text-anchor="start" fill="#222222" font-weight="normal">Br2 -&gt; 2 Br.</text><text x="200" y="56.5" font-size="7.0" text-anchor="start" fill="#666666" font-weight="normal">start the chain</text><rect x="18" y="86" width="150" height="30" rx="5" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.3"/><text x="26" y="100.7" font-size="7.6" text-anchor="start" fill="#1565C0" font-weight="bold">Propagation 1</text><text x="26" y="112.6" font-size="7.4" text-anchor="start" fill="#222222" font-weight="normal">Br. + H2 -&gt; HBr + H.</text><text x="200" y="104.5" font-size="7.0" text-anchor="start" fill="#666666" font-weight="normal">carry it on</text><rect x="18" y="120" width="150" height="30" rx="5" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.3"/><text x="26" y="134.7" font-size="7.6" text-anchor="start" fill="#1565C0" font-weight="bold">Propagation 2</text><text x="26" y="146.6" font-size="7.4" text-anchor="start" fill="#222222" font-weight="normal">H. + Br2 -&gt; HBr + Br.</text><text x="200" y="138.4" font-size="7.0" text-anchor="start" fill="#666666" font-weight="normal">regenerate Br.</text><rect x="18" y="170" width="150" height="30" rx="5" fill="#FFFFFF" stroke="#00695C" stroke-width="1.3"/><text x="26" y="184.7" font-size="7.6" text-anchor="start" fill="#00695C" font-weight="bold">Termination</text><text x="26" y="196.6" font-size="7.4" text-anchor="start" fill="#222222" font-weight="normal">2 Br. -&gt; Br2</text><text x="200" y="188.4" font-size="7.0" text-anchor="start" fill="#666666" font-weight="normal">kill the chain</text><text x="18" y="212.7" font-size="7.6" text-anchor="start" fill="#222222" font-weight="bold">Rate law that comes out of the steady state on [Br.] :</text><text x="180" y="229.0" font-size="8.6" text-anchor="middle" fill="#7B2CD9" font-weight="bold">r = k [H2] [Br2]^1.5 / ([Br2] + k' [HBr])</text><text x="180.0" y="255.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">The equation needs two molecules, so an elementary step would be</text><text x="180.0" y="267.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">second order in all; measured it is 1 in H2 and 1.5 in Br2 - the</text><text x="180.0" y="279.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">chain, not the equation, decides the law.</text></svg>