path d="M196.0 80.0L196.0 210.0" fill="none" stroke="#222222" stroke-width="1.4" stroke-linecap="round"/><path d="M197.8 205.0L196.0 210.0L194.2 205.0Z" fill="#222222"/><text x="12" y="188.5" font-size="7.2" text-anchor="start" fill="#222222" font-weight="normal">feed tank</text><path d="M32.0 154.0L32.0 178.0" fill="none" stroke="#9AA3AD" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="2,2"/><circle cx="32.0" cy="154.0" r="1.5" fill="#9AA3AD"/><path d="M104.0 133.0L104.0 124.0" fill="none" stroke="#9AA3AD" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="2,2"/><circle cx="104.0" cy="133.0" r="1.5" fill="#9AA3AD"/><text x="104" y="122.5" font-size="7.2" text-anchor="middle" fill="#222222" font-weight="normal">control valve</text><path d="M72.0 146.0L72.0 156.0" fill="none" stroke="#9AA3AD" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="2,2"/><circle cx="72.0" cy="146.0" r="1.5" fill="#9AA3AD"/><text x="72" y="168.5" font-size="7.2" text-anchor="middle" fill="#222222" font-weight="normal">pump</text><path d="M196.0 190.0L150.0 190.0" fill="none" stroke="#9AA3AD" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="2,2"/><circle cx="196.0" cy="190.0" r="1.5" fill="#9AA3AD"/><text x="146" y="192.5" font-size="7.2" text-anchor="end" fill="#222222" font-weight="normal">dip tube</text><text x="292" y="152.5" font-size="7.2" text-anchor="start" fill="#00695C" font-weight="normal">jacket:</text><text x="292" y="164.5" font-size="7.2" text-anchor="start" fill="#00695C" font-weight="normal">cooling water</text><path d="M287.0 148.0L290.0 148.0" fill="none" stroke="#9AA3AD" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="2,2"/><circle cx="287.0" cy="148.0" r="1.5" fill="#9AA3AD"/><path d="M252.0 216.0L252.0 186.0" fill="none" stroke="#666666" stroke-width="1.1" stroke-linecap="round"/><path d="M250.6 190.0L252.0 186.0L253.4 190.0Z" fill="#666666"/><text x="252" y="182.3" font-size="6.6" text-anchor="middle" fill="#666666" font-weight="normal">level</text><rect x="6.0" y="258.0" width="348.0" height="42.0" rx="5" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1"/><text x="180.0" y="272.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">why feed one reactant instead of charging both</text><text x="180.0" y="286.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">the fed reactant never builds up, so a fast or exothermic reaction stays tame</text><text x="180.0" y="298.2" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">its low concentration also favours the wanted product over a side reaction</text><text x="180.0" y="319.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">Working: charge A, bring it to temperature, then start the feed and the stirrer</text><text x="180.0" y="331.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">together, hold the feed rate, stop when the dose is in and let the batch finish.</text></svg>