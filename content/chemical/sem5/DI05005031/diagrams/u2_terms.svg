<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 262" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="262" fill="#ffffff"/><text x="180.0" y="24.3" font-size="12.2" text-anchor="middle" fill="#222222" font-weight="bold">The rate law: chemistry x temperature</text><rect x="46" y="50" width="268" height="34" rx="6" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1.5"/><text x="180" y="76.4" font-size="12.6" text-anchor="middle" fill="#7B2CD9" font-weight="bold">-rA = k(T) x f(C)</text><rect x="24" y="104" width="150" height="66" rx="5" fill="#FFFFFF" stroke="#BD2543" stroke-width="1.3"/><text x="99" y="121.9" font-size="8.2" text-anchor="middle" fill="#BD2543" font-weight="bold">k(T): temperature term</text><text x="99" y="142.0" font-size="8.6" text-anchor="middle" fill="#222222" font-weight="bold">k = A exp(-Ea/RT)</text><text x="99" y="157.5" font-size="7.2" text-anchor="middle" fill="#666666" font-weight="normal">one number per T</text><rect x="186" y="104" width="150" height="66" rx="5" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.3"/><text x="261" y="121.9" font-size="8.2" text-anchor="middle" fill="#1565C0" font-weight="bold">f(C): concentration term</text><text x="261" y="142.0" font-size="8.6" text-anchor="middle" fill="#222222" font-weight="bold">f(C) = CA^a CB^b ...</text><text x="261" y="157.5" font-size="7.2" text-anchor="middle" fill="#666666" font-weight="normal">the order lives here</text><path d="M99.0 84.0L99.0 104.0" fill="none" stroke="#9AA3AD" stroke-width="1.0" stroke-linecap="round"/><path d="M261.0 84.0L261.0 104.0" fill="none" stroke="#9AA3AD" stroke-width="1.0" stroke-linecap="round"/><text x="180" y="194.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">measured together at one temperature (Unit 3)</text><text x="180" y="208.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">then k is re-computed for any other T with Arrhenius</text><text x="180" y="223.7" font-size="7.6" text-anchor="middle" fill="#00695C" font-weight="bold">f(C) never changes with temperature</text><text x="180.0" y="241.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">This split is the reason a kineticist reports an order and an activation energy:</text><text x="180.0" y="253.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">those two numbers carry the whole rate law over the whole plant.</text></svg>