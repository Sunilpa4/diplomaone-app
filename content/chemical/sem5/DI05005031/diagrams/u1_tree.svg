<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 252" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="252" fill="#ffffff"/><text x="180.0" y="24.3" font-size="12.2" text-anchor="middle" fill="#222222" font-weight="bold">Six classifications the syllabus asks for</text><rect x="120.0" y="44.0" width="120.0" height="24.0" rx="5" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1.5"/><text x="180.0" y="59.4" font-size="9.600000000000001" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Chemical reactions</text><path d="M180.0 68.0L180.0 78.0" fill="none" stroke="#9AA3AD" stroke-width="1.0" stroke-linecap="round"/><rect x="12" y="88" width="112" height="58" rx="5" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.1"/><rect x="12" y="88" width="112" height="17" rx="5" fill="#EAF2FB"/><text x="68" y="102.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="bold">By phase</text><text x="68" y="120.4" font-size="6.8" text-anchor="middle" fill="#222222" font-weight="normal">homogeneous  -  one phase only</text><text x="68" y="135.4" font-size="6.8" text-anchor="middle" fill="#666666" font-weight="normal">heterogeneous  -  two phases</text><rect x="124" y="88" width="112" height="58" rx="5" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.1"/><rect x="124" y="88" width="112" height="17" rx="5" fill="#EAF2FB"/><text x="180" y="102.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="bold">By catalyst</text><text x="180" y="120.4" font-size="6.8" text-anchor="middle" fill="#222222" font-weight="normal">catalytic  -  a catalyst is used</text><text x="180" y="135.4" font-size="6.8" text-anchor="middle" fill="#666666" font-weight="normal">non-catalytic  -  no catalyst</text><rect x="236" y="88" width="112" height="58" rx="5" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.1"/><rect x="236" y="88" width="112" height="17" rx="5" fill="#EAF2FB"/><text x="292" y="102.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="bold">By direction</text><text x="292" y="120.4" font-size="6.8" text-anchor="middle" fill="#222222" font-weight="normal">reversible  -  runs both ways</text><text x="292" y="135.4" font-size="6.8" text-anchor="middle" fill="#666666" font-weight="normal">irreversible  -  runs one way</text><rect x="12" y="158" width="112" height="58" rx="5" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.1"/><rect x="12" y="158" width="112" height="17" rx="5" fill="#EAF2FB"/><text x="68" y="172.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="bold">By molecularity</text><text x="68" y="190.4" font-size="6.8" text-anchor="middle" fill="#222222" font-weight="normal">unimolecular  -  A -&gt; P</text><text x="68" y="205.4" font-size="6.8" text-anchor="middle" fill="#666666" font-weight="normal">bimolecular  -  A + B -&gt; P</text><rect x="124" y="158" width="112" height="58" rx="5" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.1"/><rect x="124" y="158" width="112" height="17" rx="5" fill="#EAF2FB"/><text x="180" y="172.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="bold">By heat</text><text x="180" y="190.4" font-size="6.8" text-anchor="middle" fill="#222222" font-weight="normal">exothermic  -  gives out heat</text><text x="180" y="205.4" font-size="6.8" text-anchor="middle" fill="#666666" font-weight="normal">endothermic  -  takes in heat</text><rect x="236" y="158" width="112" height="58" rx="5" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.1"/><rect x="236" y="158" width="112" height="17" rx="5" fill="#EAF2FB"/><text x="292" y="172.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="bold">By order</text><text x="292" y="190.4" font-size="6.8" text-anchor="middle" fill="#222222" font-weight="normal">zero, first  -  order n</text><text x="292" y="205.4" font-size="6.8" text-anchor="middle" fill="#666666" font-weight="normal">second, nth  -  from data</text><text x="180.0" y="231.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">Molecularity counts molecules in one step; order is what</text><text x="180.0" y="243.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">the experiment measures - they agree only when elementary.</text></svg>