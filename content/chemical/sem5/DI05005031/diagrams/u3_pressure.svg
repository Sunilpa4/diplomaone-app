<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 296" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="296" fill="#ffffff"/><text x="180.0" y="24.3" font-size="12.2" text-anchor="middle" fill="#222222" font-weight="bold">Pressure data turned into concentration</text><text x="180.0" y="40.2" font-size="9.2" text-anchor="middle" fill="#666666" font-weight="normal">constant volume, gas phase: the gauge measures the total</text><rect x="20.0" y="70.0" width="88.0" height="100.0" rx="4" fill="#F7FBFF" stroke="#222222" stroke-width="2.0"/><rect x="22" y="72" width="84" height="96" rx="2" fill="#EAF3FE"/><circle cx="40" cy="96" r="1.7" fill="#1565C0"/><circle cx="66" cy="104" r="1.7" fill="#1565C0"/><circle cx="86" cy="90" r="1.7" fill="#1565C0"/><circle cx="52" cy="120" r="1.7" fill="#1565C0"/><circle cx="78" cy="130" r="1.7" fill="#1565C0"/><circle cx="36" cy="140" r="1.7" fill="#1565C0"/><circle cx="60" cy="152" r="1.7" fill="#1565C0"/><circle cx="88" cy="148" r="1.7" fill="#1565C0"/><rect x="20.0" y="70.0" width="88.0" height="100.0" rx="4" fill="none" stroke="#222222" stroke-width="2.0"/><circle cx="64" cy="60" r="9" fill="#FFFFFF" stroke="#222222" stroke-width="1.6"/><path d="M64.0 60.0L60.0 54.0" fill="none" stroke="#222222" stroke-width="1.2" stroke-linecap="round"/><path d="M64.0 69.0L64.0 70.0" fill="none" stroke="#222222" stroke-width="1.6" stroke-linecap="round"/><text x="78" y="54.6" font-size="7.4" text-anchor="start" fill="#222222" font-weight="bold">gauge: total p</text><path d="M72.0 57.0L78.0 54.0" fill="none" stroke="#9AA3AD" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="2,2"/><circle cx="72.0" cy="57.0" r="1.5" fill="#9AA3AD"/><text x="64" y="186.7" font-size="7.6" text-anchor="middle" fill="#666666" font-weight="normal">V and T fixed</text><text x="64" y="198.6" font-size="7.4" text-anchor="middle" fill="#666666" font-weight="normal">batch, gas phase</text><rect x="140" y="56" width="206" height="34" rx="5" fill="#FFFFFF" stroke="#BD2543" stroke-width="1.3"/><text x="148" y="72.7" font-size="7.8" text-anchor="start" fill="#BD2543" font-weight="bold">1. gauge</text><text x="148" y="85.6" font-size="7.4" text-anchor="start" fill="#222222" font-weight="normal">p = pA + pB + pC ...</text><rect x="140" y="100" width="206" height="34" rx="5" fill="#FFFFFF" stroke="#B66A00" stroke-width="1.3"/><text x="148" y="116.7" font-size="7.8" text-anchor="start" fill="#B66A00" font-weight="bold">2. stoichiometry</text><text x="148" y="129.6" font-size="7.4" text-anchor="start" fill="#222222" font-weight="normal">pA from the mole change</text><rect x="140" y="144" width="206" height="34" rx="5" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.3"/><text x="148" y="160.7" font-size="7.8" text-anchor="start" fill="#1565C0" font-weight="bold">3. gas law</text><text x="148" y="173.6" font-size="7.4" text-anchor="start" fill="#222222" font-weight="normal">CA = pA / (R T)</text><path d="M243.0 90.0L243.0 99.0" fill="none" stroke="#666666" stroke-width="1.2" stroke-linecap="round"/><path d="M244.8 94.0L243.0 99.0L241.2 94.0Z" fill="#666666"/><path d="M243.0 134.0L243.0 143.0" fill="none" stroke="#666666" stroke-width="1.2" stroke-linecap="round"/><path d="M244.8 138.0L243.0 143.0L241.2 138.0Z" fill="#666666"/><rect x="14.0" y="210.0" width="332.0" height="40.0" rx="5" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1"/><text x="180.0" y="224.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">for  A -&gt; products  with a mole change</text><text x="180.0" y="238.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">pA = pA0 - (a/dn)(p - p0)   and   CA = CA0 (1 - X)</text><text x="180.0" y="271.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">Air, or an inert, changes the total but not the partial pressure of A - subtract it</text><text x="180.0" y="283.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">before you divide by RT, or the calculated conversion comes out too high.</text></svg>