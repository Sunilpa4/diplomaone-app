<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 1060" width="850" height="1060"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#16797e"/></marker><pattern id="cat" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M0 9L9 0" stroke="#8e63aa" stroke-width="2"/></pattern></defs><rect width="850" height="1060" fill="#fbf9fd"/><g font-family="Arial,sans-serif" fill="#35233f"><text x="425" y="40" text-anchor="middle" font-size="25">Radial-flow ammonia converter</text><text x="425" y="71" text-anchor="middle" font-size="17">DI05005051 • 2.3 • Conceptual section—not vessel design</text><rect x="210" y="140" width="350" height="740" rx="125" fill="#f1e7f8" stroke="#743a9d" stroke-width="5"/><rect x="235" y="174" width="300" height="670" rx="95" fill="white" stroke="#b89acc" stroke-dasharray="6 4"/><g stroke="#16797e" stroke-width="4" fill="none"><path d="M385 95V190"/><path d="M385 835V945"/></g><text x="420" y="120" font-size="18">Purified H₂/N₂ feed</text><text x="420" y="935" font-size="18">NH₃-bearing gas</text><text x="420" y="961" font-size="16">to heat recovery/cooling/separation</text><rect x="280" y="290" width="68" height="415" fill="#d9c1eb" stroke="#743a9d" stroke-width="3"/><rect x="422" y="290" width="68" height="415" fill="#d9c1eb" stroke="#743a9d" stroke-width="3"/><rect x="350" y="270" width="70" height="470" fill="#e6f3f3" stroke="#16797e" stroke-dasharray="5 4"/><g stroke="#16797e" stroke-width="3" fill="none"><path d="M385 200H255V520"/><path d="M385 200H515V520"/><path d="M258 340H378"/><path d="M512 340H392"/><path d="M258 450H378"/><path d="M512 450H392"/><path d="M258 560H378"/><path d="M512 560H392"/><path d="M258 670H378"/><path d="M512 670H392"/><path d="M385 330V810"/></g><g font-size="17"><path d="M490 395H590" stroke="#743a9d"/><text x="598" y="390">Catalyst annulus</text><text x="598" y="416">(sectioned)</text><path d="M415 700L595 745" stroke="#743a9d"/