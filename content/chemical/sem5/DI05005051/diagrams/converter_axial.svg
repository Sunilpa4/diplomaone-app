<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 1060" width="850" height="1060"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#16797e"/></marker><pattern id="cat" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M0 9L9 0" stroke="#8e63aa" stroke-width="2"/></pattern></defs><rect width="850" height="1060" fill="#fbf9fd"/><g font-family="Arial,sans-serif" fill="#35233f"><text x="425" y="40" text-anchor="middle" font-size="25">Axial multi-bed ammonia converter</text><text x="425" y="71" text-anchor="middle" font-size="17">DI05005051 • 2.3 • Conceptual section—not vessel design</text><rect x="210" y="140" width="350" height="740" rx="125" fill="#f1e7f8" stroke="#743a9d" stroke-width="5"/><rect x="235" y="174" width="300" height="670" rx="95" fill="white" stroke="#b89acc" stroke-dasharray="6 4"/><g stroke="#16797e" stroke-width="4" fill="none"><path d="M385 95V190"/><path d="M385 835V945"/></g><text x="420" y="120" font-size="18">Purified H₂/N₂ feed</text><text x="420" y="935" font-size="18">NH₃-bearing gas</text><text x="420" y="961" font-size="16">to heat recovery/cooling/separation</text><rect x="270" y="285" width="230" height="95" fill="#d9c1eb" stroke="#743a9d" stroke-width="3"/><text x="385" y="341" text-anchor="middle" font-size="20">Catalyst bed 1</text><path d="M270 388H500" stroke="#743a9d" stroke-width="5"/><rect x="270" y="465" width="230" height="95" fill="#d9c1eb" stroke="#743a9d" stroke-width="3"/><text x="385" y="521" text-anchor="middle" font-size="20">Catalyst bed 2</text><path d="M270 568H500" stroke="#743a9d" stroke-width="5"/><rect x="270" y="645" width="230" height="95" fill="#d9c1eb" stroke="#743a9d" stroke-width="3"/><text x="385" y="701" text-anchor="middle" font-size="20">Catalyst bed 3</text><path d="M270 748H500" stroke="#743a9d" stroke-width="5"/><g stroke="#16797e" stroke-width="4" fill="none"><path d="M385 200V275"/><path d="M385 390V455"/><path d="M385 570V635"/><path d="M385 750V820"/><path d="M690 425H400"/><path d="M690 605H400"/></g><g font-size="17"><text x="575" y="397">Inter-bed cooling /</text><text x="575" y="420">qualified quench</text><path d="M500 750L610 780" stroke="#743a9d"/><text x="615" y="780">Support screens</text></g><g font-size="17"><path d="M545 810L645 850" stroke="#743a9d"/><text x="650" y="850">Pressure shell</text></g><text x="425" y="1000" text-anchor="middle" font-size="17">Heat removal limits temperature rise;clean gas protects catalyst.</text><text x="425" y="1027" text-anchor="middle" font-size="16">Internals and cooling arrangement vary by converter technology.</text></g><polygon points="379,180 391,180 385,191" fill="#16797e"/><polygon points="379,935 391,935 385,946" fill="#16797e"/><polygon points="379,265 391,265 385,276" fill="#16797e"/><polygon points="379,445 391,445 385,456" fill="#16797e"/><polygon points="379,625 391,625 385,636" fill="#16797e"/><polygon points="379,810 391,810 385,821" fill="#16797e"/><polygon points="410,419 410,431 400,425" fill="#16797e"/><polygon points="410,599 410,611 400,605" fill="#16797e"/></svg>