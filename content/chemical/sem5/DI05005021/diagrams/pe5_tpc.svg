<svg xmlns="http://www.w3.org/2000/svg" width="360" height="244" viewBox="0 0 360 244" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="244" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Anatomy of the total product cost</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Cards 5.9-5.10: manufacturing cost plus general expenses</text><rect x="110" y="48" width="140" height="24" rx="5" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.8"/><text x="180" y="64" font-size="8.4" fill="#2F5D8A" text-anchor="middle" font-weight="bold">TOTAL PRODUCT COST</text><line x1="150" y1="72" x2="92" y2="84" stroke="#2F5D8A" stroke-width="1.3"/><line x1="210" y1="72" x2="268" y2="84" stroke="#2F5D8A" stroke-width="1.3"/><rect x="14" y="84" width="156" height="24" rx="5" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.6"/><text x="92" y="100" font-size="8.0" fill="#2F5D8A" text-anchor="middle" font-weight="bold">MANUFACTURING COST</text><rect x="190" y="84" width="156" height="24" rx="5" fill="#FDEBD7" stroke="#B66A00" stroke-width="1.6"/><text x="268" y="100" font-size="8.0" fill="#B66A00" text-anchor="middle" font-weight="bold">GENERAL EXPENSES</text><text x="20" y="122" font-size="6.6" fill="#2F5D8A" text-anchor="start" font-weight="bold">DIRECT production costs:</text><text x="20" y="134.5" font-size="6.6" fill="#272134" text-anchor="start">•  raw materials (largest item)</text><text x="20" y="147.0" font-size="6.6" fill="#272134" text-anchor="start">•  labour + supervision</text><text x="20" y="159.5" font-size="6.6" fill="#272134" text-anchor="start">•  utilities: steam, power, water</text><text x="20" y="172.0" font-size="6.6" fill="#272134" text-anchor="start">•  maintenance, supplies, laboratory</text><text x="20" y="184.5" font-size="6.6" fill="#2F5D8A" text-anchor="start" font-weight="bold">FIXED charges:</text><text x="20" y="197.0" font-size="6.6" fill="#272134" text-anchor="start">•  depreciation, local taxes, insurance</text><text x="20" y="209.5" font-size="6.6" fill="#2F5D8A" text-anchor="start" font-weight="bold">PLANT OVERHEAD:</text><text x="20" y="222.0" font-size="6.6" fill="#272134" text-anchor="start">•  medical, safety, stores, canteen</text><text x="196" y="122" font-size="6.6" fill="#272134" text-anchor="start">•  administration salaries</text><text x="196" y="134.5" font-size="6.6" fill="#272134" text-anchor="start">•  office, legal, auditing</text><text x="196" y="147.0" font-size="6.6" fill="#B66A00" text-anchor="start" font-weight="bold">distribution and selling:</text><text x="196" y="159.5" font-size="6.6" fill="#272134" text-anchor="start">•  packing, freight, sales office</text><text x="196" y="172.0" font-size="6.6" fill="#272134" text-anchor="start">•  research and development</text><text x="196" y="184.5" font-size="6.6" fill="#272134" text-anchor="start">•  financing (interest) where charged</text><text x="180" y="236" font-size="6.8" fill="#555555" text-anchor="middle">TPC / annual production = cost of production per tonne - compared with selling price (Card 5.10).</text></svg>