<svg xmlns="http://www.w3.org/2000/svg" width="360" height="262" viewBox="0 0 360 262" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="262" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Choosing where the plant will live</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 4.3: primary factors shortlist the region; specific factors settle the site</text><rect x="10" y="50" width="164" height="168" rx="5" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.5"/><text x="92" y="66" font-size="8.6" fill="#2F5D8A" text-anchor="middle" font-weight="bold">PRIMARY FACTORS</text><text x="92" y="78" font-size="6.6" fill="#555555" text-anchor="middle">(decide the REGION)</text><text x="20" y="94" font-size="7.0" fill="#272134" text-anchor="start">•  raw material source</text><text x="20" y="109" font-size="7.0" fill="#272134" text-anchor="start">•  market / customers</text><text x="20" y="124" font-size="7.0" fill="#272134" text-anchor="start">•  transport: rail, road, port</text><text x="20" y="139" font-size="7.0" fill="#272134" text-anchor="start">•  power and fuel supply</text><text x="20" y="154" font-size="7.0" fill="#272134" text-anchor="start">•  water - quantity &amp; quality</text><text x="20" y="169" font-size="7.0" fill="#272134" text-anchor="start">•  labour supply and skill</text><text x="20" y="184" font-size="7.0" fill="#272134" text-anchor="start">•  climate (flood, corrosion)</text><text x="92" y="208" font-size="6.6" fill="#2F5D8A" text-anchor="middle" font-weight="bold">weight lost in making -></text><text x="92" y="219" font-size="1" fill="#272134" text-anchor="middle"></text><rect x="186" y="50" width="164" height="168" rx="5" fill="#FDEBD7" stroke="#B66A00" stroke-width="1.5"/><text x="268" y="66" font-size="8.6" fill="#B66A00" text-anchor="middle" font-weight="bold">SPECIFIC FACTORS</text><text x="268" y="78" font-size="6.6" fill="#555555" text-anchor="middle">(decide the exact SITE)</text><text x="196" y="94" font-size="7.0" fill="#272134" text-anchor="start">•  land cost and topography</text><text x="196" y="109" font-size="7.0" fill="#272134" text-anchor="start">•  soil bearing, drainage</text><text x="196" y="124" font-size="7.0" fill="#272134" text-anchor="start">•  waste disposal facility</text><text x="196" y="139" font-size="7.0" fill="#272134" text-anchor="start">•  taxes and incentives</text><text x="196" y="154" font-size="7.0" fill="#272134" text-anchor="start">•  community attitude</text><text x="196" y="169" font-size="7.0" fill="#272134" text-anchor="start">•  housing, schools, hospital</text><text x="196" y="184" font-size="7.0" fill="#272134" text-anchor="start">•  room for expansion</text><text x="268" y="208" font-size="6.6" fill="#B66A00" text-anchor="middle" font-weight="bold">weight gained -> near market</text><rect x="10" y="226" width="340" height="30" rx="4" fill="#FFFFFF" stroke="#272134" stroke-width="1.2"/><text x="180" y="238" font-size="6.8" fill="#272134" text-anchor="middle">Method: shortlist by PRIMARY factors, cost the finalists (freight in + freight out),</text><text x="180" y="250" font-size="6.8" fill="#272134" text-anchor="middle">then let SPECIFIC factors - and a site visit - make the final choice. (Numerical 4.1)</text></svg>