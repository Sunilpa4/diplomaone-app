<svg xmlns="http://www.w3.org/2000/svg" width="360" height="246" viewBox="0 0 360 246" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="246" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Pipe wall thickness and insulation</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 3.6: pressure fixes t, corrosion adds c - then pick the schedule</text><circle cx="120" cy="136" r="58" fill="#FDF6EC" stroke="#B66A00" stroke-width="2"/><circle cx="120" cy="136" r="42" fill="#FFFFFF" stroke="#B66A00" stroke-width="1.6"/><ellipse cx="120" cy="136" rx="74" ry="74" fill="none" stroke="#2F5D8A" stroke-width="1.4"/><text x="120" y="132" font-size="7.5" fill="#2F5D8A" text-anchor="middle" font-weight="bold">fluid</text><text x="120" y="144" font-size="6.4" fill="#555555" text-anchor="middle">passage (ID)</text><line x1="62" y1="62" x2="178" y2="62" stroke="#272134" stroke-width="1.1"/><line x1="62" y1="70" x2="62" y2="56" stroke="#272134" stroke-width="1.0"/><line x1="178" y1="70" x2="178" y2="56" stroke="#272134" stroke-width="1.0"/><text x="120" y="54" font-size="7.5" fill="#272134" text-anchor="middle" font-weight="bold">OD</text><line x1="154" y1="100" x2="196" y2="66" stroke="#999999" stroke-width="0.8"/><circle cx="154" cy="100" r="1.6" fill="#999999"/><text x="200" y="62" font-size="7.6" fill="#B66A00" text-anchor="start" font-weight="bold">wall thickness t</text><line x1="166" y1="162" x2="196" y2="104" stroke="#999999" stroke-width="0.8"/><circle cx="166" cy="162" r="1.6" fill="#999999"/><text x="200" y="100" font-size="7.6" fill="#B66A00" text-anchor="start">corrosion allowance c</text><text x="200" y="112" font-size="6.4" fill="#555555" text-anchor="start">added inside t</text><line x1="188" y1="120" x2="196" y2="148" stroke="#999999" stroke-width="0.8"/><circle cx="188" cy="120" r="1.6" fill="#999999"/><text x="200" y="144" font-size="7.6" fill="#2F5D8A" text-anchor="start" font-weight="bold">insulation layer</text><text x="200" y="156" font-size="6.4" fill="#555555" text-anchor="start">(blue circle, outside wall)</text><rect x="196" y="176" width="154" height="62" rx="4" fill="#FFFFFF" stroke="#272134" stroke-width="1.3"/><text x="273" y="190" font-size="8.6" fill="#272134" text-anchor="middle" font-weight="bold">t  =  P D / (2 S E)  +  c</text><text x="273" y="204" font-size="6.2" fill="#555555" text-anchor="middle">P design pressure, D pipe OD</text><text x="273" y="215" font-size="6.2" fill="#555555" text-anchor="middle">S allowable stress, E weld efficiency</text><text x="273" y="228" font-size="6.6" fill="#B66A00" text-anchor="middle" font-weight="bold">then choose next standard SCHEDULE</text><text x="16" y="224" font-size="7.2" fill="#272134" text-anchor="start" font-weight="bold">Strength is bought by the schedule:</text><text x="16" y="237" font-size="7.0" fill="#555555" text-anchor="start">thicker wall = higher pressure rating.</text></svg>