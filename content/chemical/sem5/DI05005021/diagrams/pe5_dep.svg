<svg xmlns="http://www.w3.org/2000/svg" width="360" height="256" viewBox="0 0 360 256" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="256" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Book value paths of the depreciation methods</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 5.8: same start (V0) and end (Vs) - different yearly charges</text><line x1="44" y1="180" x2="330" y2="180" stroke="#272134" stroke-width="1.3"/><line x1="44" y1="180" x2="44" y2="54" stroke="#272134" stroke-width="1.3"/><text x="330" y="194" font-size="7" fill="#272134" text-anchor="end">years -></text><text x="56" y="56" font-size="8" fill="#5A5A5A" text-anchor="start">book value</text><line x1="44" y1="168" x2="330" y2="168" stroke="#AAAAAA" stroke-width="1.0" stroke-dasharray="4 3"/><text x="326" y="164" font-size="6.4" fill="#888888" text-anchor="end">salvage value Vs</text><line x1="44" y1="64" x2="300" y2="168" stroke="#2F5D8A" stroke-width="2.6"/><text x="120" y="96" font-size="7.2" fill="#2F5D8A" text-anchor="middle" font-weight="bold">straight line</text><path d="M44 64 C 90 108, 130 140, 190 158 C 230 168, 270 170, 310 171" fill="none" stroke="#B66A00" stroke-width="2.4"/><text x="120" y="138" font-size="7.2" fill="#B66A00" text-anchor="middle" font-weight="bold">declining balance</text><path d="M44 64 C 90 100, 150 138, 210 158 C 245 166, 280 168, 300 168" fill="none" stroke="#BD2543" stroke-width="2.0"/><text x="196" y="128" font-size="7.2" fill="#BD2543" text-anchor="middle" font-weight="bold">sum-of-years-digits</text><path d="M44 64 C 120 78, 200 104, 250 138 C 275 154, 292 164, 300 168" fill="none" stroke="#2E7D32" stroke-width="2.0"/><text x="196" y="88" font-size="7.2" fill="#2E7D32" text-anchor="middle" font-weight="bold">sinking fund (with interest)</text><text x="44" y="50" font-size="1" fill="#272134" text-anchor="middle"></text><text x="52" y="60" font-size="7" fill="#272134" text-anchor="start">V0</text><rect x="44" y="204" width="286" height="44" rx="4" fill="#FFFFFF" stroke="#272134" stroke-width="1.2"/><text x="52" y="218" font-size="6.8" fill="#272134" text-anchor="start">Fast methods (DB, SYD) write off more in early years - tax relief sooner.</text><text x="52" y="231" font-size="6.8" fill="#272134" text-anchor="start">Sinking fund writes off least early: deposits earn interest toward replacement.</text><text x="52" y="244" font-size="6.8" fill="#272134" text-anchor="start">All must land on Vs at the end of life n - they differ only in the path.</text></svg>