<svg xmlns="http://www.w3.org/2000/svg" width="360" height="236" viewBox="0 0 360 236" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="236" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Updating and scaling equipment costs</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Cards 5.5-5.6: indices move cost in time; 0.6 rule in size</text><rect x="10" y="50" width="164" height="140" rx="4" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.4"/><text x="92" y="64" font-size="7.6" fill="#2F5D8A" text-anchor="middle" font-weight="bold">COST INDEX vs YEAR</text><line x1="34" y1="168" x2="160" y2="168" stroke="#272134" stroke-width="1.1"/><line x1="34" y1="168" x2="34" y2="84" stroke="#272134" stroke-width="1.1"/><path d="M38 158 L70 146 L100 132 L130 116 L156 96" fill="none" stroke="#B66A00" stroke-width="2.2"/><circle cx="38" cy="158" r="2.6" fill="#B66A00" stroke="#FFFFFF" stroke-width="1.1"/><circle cx="70" cy="146" r="2.6" fill="#B66A00" stroke="#FFFFFF" stroke-width="1.1"/><circle cx="100" cy="132" r="2.6" fill="#B66A00" stroke="#FFFFFF" stroke-width="1.1"/><circle cx="130" cy="116" r="2.6" fill="#B66A00" stroke="#FFFFFF" stroke-width="1.1"/><circle cx="156" cy="96" r="2.6" fill="#B66A00" stroke="#FFFFFF" stroke-width="1.1"/><text x="38" y="180" font-size="6.2" fill="#555555" text-anchor="middle">2015</text><text x="156" y="180" font-size="6.2" fill="#555555" text-anchor="middle">2025</text><text x="92" y="88" font-size="1" fill="#272134" text-anchor="middle"></text><text x="100" y="104" font-size="6.4" fill="#272134" text-anchor="middle">same equipment,</text><text x="100" y="114" font-size="6.4" fill="#272134" text-anchor="middle">dearer every year</text><text x="92" y="202" font-size="6.4" fill="#272134" text-anchor="middle" font-weight="bold">cost at year B = cost at year A</text><text x="92" y="213" font-size="6.4" fill="#272134" text-anchor="middle">x (index B / index A)</text><rect x="186" y="50" width="164" height="140" rx="4" fill="#FFFFFF" stroke="#B66A00" stroke-width="1.4"/><text x="268" y="64" font-size="7.2" fill="#B66A00" text-anchor="middle" font-weight="bold">COST vs CAPACITY (six-tenths)</text><line x1="210" y1="168" x2="336" y2="168" stroke="#272134" stroke-width="1.1"/><line x1="210" y1="168" x2="210" y2="84" stroke="#272134" stroke-width="1.1"/><path d="M214 160 C 250 140, 300 118, 332 104" fill="none" stroke="#2F5D8A" stroke-width="2.2"/><path d="M214 160 L332 92" fill="none" stroke="#BBBBBB" stroke-width="1.2" stroke-dasharray="4 3"/><text x="310" y="88" font-size="6.2" fill="#888888" text-anchor="middle">linear</text><text x="268" y="180" font-size="6.2" fill="#555555" text-anchor="middle">capacity -></text><text x="216" y="92" font-size="6.2" fill="#555555" text-anchor="start">cost</text><text x="268" y="202" font-size="6.4" fill="#272134" text-anchor="middle" font-weight="bold">cost2 = cost1 x (capacity2/capacity1)^0.6</text><text x="268" y="213" font-size="6.4" fill="#272134" text-anchor="middle">doubling capacity adds ~52 % cost</text><text x="180" y="228" font-size="7.0" fill="#555555" text-anchor="middle">Two corrections never to forget: WHEN (index) and HOW BIG (0.6 power).</text></svg>