<svg xmlns="http://www.w3.org/2000/svg" width="360" height="253.5" viewBox="0 0 360 253.5" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="253.5" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">What the owner must find money for</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Cards 5.1-5.3: total capital investment = fixed capital + working capital</text><rect x="110" y="48" width="140" height="26" rx="5" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.8"/><text x="180" y="65" font-size="8.4" fill="#2F5D8A" text-anchor="middle" font-weight="bold">TOTAL CAPITAL INVESTMENT</text><line x1="150" y1="74" x2="92" y2="88" stroke="#2F5D8A" stroke-width="1.3"/><line x1="210" y1="74" x2="268" y2="88" stroke="#2F5D8A" stroke-width="1.3"/><rect x="14" y="88" width="156" height="26" rx="5" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.6"/><text x="92" y="105" font-size="8.2" fill="#2F5D8A" text-anchor="middle" font-weight="bold">FIXED CAPITAL (FCI)</text><text x="20" y="128" font-size="6.6" fill="#2F5D8A" text-anchor="start" font-weight="bold">DIRECT costs:</text><text x="20" y="140.5" font-size="6.6" fill="#272134" text-anchor="start">•  equipment purchased + delivered</text><text x="20" y="153.0" font-size="6.6" fill="#272134" text-anchor="start">•  installation, piping, instruments</text><text x="20" y="165.5" font-size="6.6" fill="#272134" text-anchor="start">•  electrical, buildings, yard, land</text><text x="20" y="178.0" font-size="6.6" fill="#2F5D8A" text-anchor="start" font-weight="bold">INDIRECT costs:</text><text x="20" y="190.5" font-size="6.6" fill="#272134" text-anchor="start">•  engineering and supervision</text><text x="20" y="203.0" font-size="6.6" fill="#272134" text-anchor="start">•  construction and contractor fee</text><text x="20" y="215.5" font-size="6.6" fill="#272134" text-anchor="start">•  contingency (unknowns, strikes...)</text><rect x="190" y="88" width="156" height="26" rx="5" fill="#FDEBD7" stroke="#B66A00" stroke-width="1.6"/><text x="268" y="105" font-size="8.2" fill="#B66A00" text-anchor="middle" font-weight="bold">WORKING CAPITAL (WC)</text><text x="196" y="128" font-size="6.6" fill="#272134" text-anchor="start">•  raw material in store (weeks)</text><text x="196" y="140.5" font-size="6.6" fill="#272134" text-anchor="start">•  material in process</text><text x="196" y="153.0" font-size="6.6" fill="#272134" text-anchor="start">•  finished product in stock</text><text x="196" y="165.5" font-size="6.6" fill="#272134" text-anchor="start">•  accounts receivable (credit given)</text><text x="196" y="178.0" font-size="6.6" fill="#272134" text-anchor="start">•  cash in hand for wages, bills</text><text x="196" y="190.5" font-size="6.6" fill="#272134" text-anchor="start">•  minus: accounts payable</text><text x="196" y="203.0" font-size="6.6" fill="#272134" text-anchor="start">•  (credit received from suppliers)</text><rect x="14" y="219.5" width="332" height="26" rx="4" fill="#FFF8E1" stroke="#B66A00" stroke-width="1.2"/><text x="180" y="235.5" font-size="6.8" fill="#B66A00" text-anchor="middle" font-weight="bold">FCI is spent once, before start-up. WC keeps revolving - it is recovered at plant end.</text></svg>