<svg xmlns="http://www.w3.org/2000/svg" width="360" height="262" viewBox="0 0 360 262" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="262" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">The break-even chart</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Cards 5.13-5.14: where the sales line crosses the total cost line, profit begins</text><line x1="46" y1="190" x2="336" y2="190" stroke="#272134" stroke-width="1.3"/><line x1="46" y1="190" x2="46" y2="52" stroke="#272134" stroke-width="1.3"/><text x="336" y="204" font-size="7" fill="#272134" text-anchor="end">production / sales volume -></text><text x="40" y="56" font-size="7" fill="#272134" text-anchor="end">rupees</text><line x1="46" y1="150" x2="330" y2="150" stroke="#888888" stroke-width="1.6"/><text x="326" y="144" font-size="6.8" fill="#666666" text-anchor="end">fixed cost</text><line x1="46" y1="150" x2="320" y2="66" stroke="#B66A00" stroke-width="2.6"/><text x="322" y="60" font-size="7.2" fill="#B66A00" text-anchor="end" font-weight="bold">total cost</text><line x1="46" y1="190" x2="330" y2="54" stroke="#2F5D8A" stroke-width="2.6"/><text x="332" y="74" font-size="7.2" fill="#2F5D8A" text-anchor="end" font-weight="bold">sales income</text><circle cx="186" cy="112" r="4.5" fill="#BD2543" stroke="#FFFFFF" stroke-width="1.8"/><line x1="186" y1="112" x2="186" y2="190" stroke="#BD2543" stroke-width="1.2" stroke-dasharray="4 3"/><text x="186" y="204" font-size="7.6" fill="#BD2543" text-anchor="middle" font-weight="bold">BEP</text><text x="186" y="100" font-size="7.6" fill="#BD2543" text-anchor="middle" font-weight="bold">break-even point</text><text x="96" y="120" font-size="8" fill="#B66A00" text-anchor="middle" font-weight="bold">LOSS</text><text x="96" y="132" font-size="6.4" fill="#B66A00" text-anchor="middle">zone</text><text x="288" y="120" font-size="8" fill="#2F5D8A" text-anchor="middle" font-weight="bold">PROFIT</text><text x="288" y="132" font-size="6.4" fill="#2F5D8A" text-anchor="middle">zone</text><rect x="46" y="216" width="290" height="40" rx="4" fill="#FFFFFF" stroke="#272134" stroke-width="1.2"/><text x="54" y="230" font-size="6.8" fill="#272134" text-anchor="start">Below BEP: sales do not cover total cost. Above BEP: every tonne</text><text x="54" y="243" font-size="6.8" fill="#272134" text-anchor="start">adds (price - variable cost) to profit. BEP also quoted as % of plant capacity.</text></svg>