<svg xmlns="http://www.w3.org/2000/svg" width="360" height="266" viewBox="0 0 360 266" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="266" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Specification sheet: 1-2 shell-and-tube exchanger</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 3.3 and Tutorial 5: duty, size, material and code on one page</text><rect x="10" y="48" width="340" height="196" rx="4" fill="#FFFFFF" stroke="#272134" stroke-width="1.6"/><rect x="10" y="48" width="340" height="22" rx="4" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="0"/><text x="180" y="63" font-size="8.6" fill="#2F5D8A" text-anchor="middle" font-weight="bold">SPECIFICATION SHEET - SHELL AND TUBE HEAT EXCHANGER  E-101</text><line x1="10" y1="70" x2="350" y2="70" stroke="#CCCCCC" stroke-width="0.7"/><text x="16" y="84" font-size="6.8" fill="#2F5D8A" text-anchor="start" font-weight="bold">Duty / service</text><text x="118" y="84" font-size="6.8" fill="#272134" text-anchor="start">Cool 2,000 kg/h oil, 120 -> 60 °C with cooling water 30 -> 45 °C</text><line x1="10" y1="91.5" x2="350" y2="91.5" stroke="#CCCCCC" stroke-width="0.7"/><text x="16" y="105.5" font-size="6.8" fill="#2F5D8A" text-anchor="start" font-weight="bold">Heat load</text><text x="118" y="105.5" font-size="6.8" fill="#272134" text-anchor="start">Q = 2.52 x 10^5 kJ/h  (70 kW)</text><line x1="10" y1="113.0" x2="350" y2="113.0" stroke="#CCCCCC" stroke-width="0.7"/><text x="16" y="127.0" font-size="6.8" fill="#2F5D8A" text-anchor="start" font-weight="bold">Type / arrangement</text><text x="118" y="127.0" font-size="6.8" fill="#272134" text-anchor="start">1 shell pass - 2 tube passes (1-2), horizontal, floating head</text><line x1="10" y1="134.5" x2="350" y2="134.5" stroke="#CCCCCC" stroke-width="0.7"/><text x="16" y="148.5" font-size="6.8" fill="#2F5D8A" text-anchor="start" font-weight="bold">Area required</text><text x="118" y="148.5" font-size="6.8" fill="#272134" text-anchor="start">A = Q/(U x dT) = 5.3 m2 -> provide 6.5 m2 (20 % margin)</text><line x1="10" y1="156.0" x2="350" y2="156.0" stroke="#CCCCCC" stroke-width="0.7"/><text x="16" y="170.0" font-size="6.8" fill="#2F5D8A" text-anchor="start" font-weight="bold">Tubes</text><text x="118" y="170.0" font-size="6.8" fill="#272134" text-anchor="start">19 mm OD x 2 mm wall x 3 m, SS-316, pitch 25 mm</text><line x1="10" y1="177.5" x2="350" y2="177.5" stroke="#CCCCCC" stroke-width="0.7"/><text x="16" y="191.5" font-size="6.8" fill="#2F5D8A" text-anchor="start" font-weight="bold">Shell / MOC</text><text x="118" y="191.5" font-size="6.8" fill="#272134" text-anchor="start">273 mm ID, carbon steel; tubes &amp; tubesheet SS-316 (corrosive oil)</text><line x1="10" y1="199.0" x2="350" y2="199.0" stroke="#CCCCCC" stroke-width="0.7"/><text x="16" y="213.0" font-size="6.8" fill="#2F5D8A" text-anchor="start" font-weight="bold">Design conditions</text><text x="118" y="213.0" font-size="6.8" fill="#272134" text-anchor="start">Shell side 10 bar / 180 degC;  tube side 6 bar / 90 degC</text><line x1="10" y1="220.5" x2="350" y2="220.5" stroke="#CCCCCC" stroke-width="0.7"/><text x="16" y="234.5" font-size="6.8" fill="#2F5D8A" text-anchor="start" font-weight="bold">Nozzles / codes</text><text x="118" y="234.5" font-size="6.8" fill="#272134" text-anchor="start">N1/N2 shell, N3/N4 tubes; code IS 4503 / TEMA</text><line x1="10" y1="242.0" x2="350" y2="242.0" stroke="#CCCCCC" stroke-width="0.7"/><text x="180" y="258" font-size="6.8" fill="#B66A00" text-anchor="middle" font-weight="bold">Vendor must meet every line, or take written exception to it.</text></svg>