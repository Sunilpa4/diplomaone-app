87" font-size="6.4" fill="#555555" text-anchor="middle">target rate &amp; quality</text><line x1="122" y1="71" x2="180" y2="138" stroke="#9FB6CC" stroke-width="1.1"/><rect x="238" y="50" width="108" height="42" rx="5" fill="#FFFFFF" stroke="#272134" stroke-width="1.3"/><text x="292" y="65" font-size="8.2" fill="#272134" text-anchor="middle" font-weight="bold">Process design</text><text x="292" y="77" font-size="6.4" fill="#555555" text-anchor="middle">flowsheet, balances,</text><text x="292" y="87" font-size="6.4" fill="#555555" text-anchor="middle">equipment sizing</text><line x1="238" y1="71" x2="180" y2="138" stroke="#9FB6CC" stroke-width="1.1"/><rect x="14" y="118" width="108" height="42" rx="5" fill="#FFFFFF" stroke="#272134" stroke-width="1.3"/><text x="68" y="133" font-size="8.2" fill="#272134" text-anchor="middle" font-weight="bold">Project work</text><text x="68" y="145" font-size="6.4" fill="#555555" text-anchor="middle">costing, erection,</text><text x="68" y="155" font-size="6.4" fill="#555555" text-anchor="middle">commissioning</text><line x1="122" y1="139" x2="180" y2="138" stroke="#9FB6CC" stroke-width="1.1"/><rect x="238" y="118" width="108" height="42" rx="5" fill="#FFFFFF" stroke="#272134" stroke-width="1.3"/><text x="292" y="133" font-size="8.2" fill="#272134" text-anchor="middle" font-weight="bold">Quality control</text><text x="292" y="145" font-size="6.4" fill="#555555" text-anchor="middle">specifications,</text><text x="292" y="155" font-size="6.4" fill="#555555" text-anchor="middle">testing, standards</text><line x1="238" y1="139" x2="180" y2="138" stroke="#9FB6CC" stroke-width="1.1"/><rect x="14" y="186" width="108" height="42" rx="5" fill="#FFFFFF" stroke="#272134" stroke-width="1.3"/><text x="68" y="201" font-size="8.2" fill="#272134" text-anchor="middle" font-weight="bold">Safety &amp; HSE</text><text x="68" y="213" font-size="6.4" fill="#555555" text-anchor="middle">hazard studies,</text><text x="68" y="223" font-size="6.4" fill="#555555" text-anchor="middle">pollution control</text><line x1="122" y1="207" x2="180" y2="138" stroke="#9FB6CC" stroke-width="1.1"/><rect x="238" y="186" width="108" height="42" rx="5" fill="#FFFFFF" stroke="#272134" stroke-width="1.3"/><text x="292" y="201" font-size="8.2" fill="#272134" text-anchor="middle" font-weight="bold">Techno-sales</text><text x="292" y="213" font-size="6.4" fill="#555555" text-anchor="middle">marketing, service,</text><text x="292" y="223" font-size="6.4" fill="#555555" text-anchor="middle">new applications</text><line x1="238" y1="207" x2="180" y2="138" stroke="#9FB6CC" stroke-width="1.1"/><text x="180" y="246" font-size="7.2" fill="#555555" text-anchor="middle">One degree, many chairs: the same economics and design logic is used in every role.</text></svg>