<svg xmlns="http://www.w3.org/2000/svg" width="360" height="266" viewBox="0 0 360 266" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="266" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Criteria of a good design</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 1.6: the design must pass all eight tests together</text><rect x="10" y="50" width="340" height="21" rx="4" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.1"/><text x="20" y="64" font-size="8.2" fill="#2F5D8A" text-anchor="start" font-weight="bold">1. Safe</text><text x="118" y="64" font-size="7.0" fill="#272134" text-anchor="start">no hazard to people, plant or public at any stage</text><rect x="10" y="75" width="340" height="21" rx="4" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.1"/><text x="20" y="89" font-size="8.2" fill="#2F5D8A" text-anchor="start" font-weight="bold">2. Operable</text><text x="118" y="89" font-size="7.0" fill="#272134" text-anchor="start">easy to start, control and shut down; forgiving of small upsets</text><rect x="10" y="100" width="340" height="21" rx="4" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.1"/><text x="20" y="114" font-size="8.2" fill="#2F5D8A" text-anchor="start" font-weight="bold">3. Reliable</text><text x="118" y="114" font-size="7.0" fill="#272134" text-anchor="start">planned stream days achieved, planned maintenance only</text><rect x="10" y="125" width="340" height="21" rx="4" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.1"/><text x="20" y="139" font-size="8.2" fill="#2F5D8A" text-anchor="start" font-weight="bold">4. Economical</text><text x="118" y="139" font-size="7.0" fill="#272134" text-anchor="start">lowest total cost over plant life - not just lowest first cost</text><rect x="10" y="150" width="340" height="21" rx="4" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.1"/><text x="20" y="164" font-size="8.2" fill="#2F5D8A" text-anchor="start" font-weight="bold">5. Flexible</text><text x="118" y="164" font-size="7.0" fill="#272134" text-anchor="start">accepts feed and market changes within a sensible range</text><rect x="10" y="175" width="340" height="21" rx="4" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.1"/><text x="20" y="189" font-size="8.2" fill="#2F5D8A" text-anchor="start" font-weight="bold">6. Legal</text><text x="118" y="189" font-size="7.0" fill="#272134" text-anchor="start">meets factory, pollution, labour and product-quality law</text><rect x="10" y="200" width="340" height="21" rx="4" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.1"/><text x="20" y="214" font-size="8.2" fill="#2F5D8A" text-anchor="start" font-weight="bold">7. Expandable</text><text x="118" y="214" font-size="7.0" fill="#272134" text-anchor="start">space and tie-ins kept for future capacity increase</text><rect x="10" y="225" width="340" height="21" rx="4" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.1"/><text x="20" y="239" font-size="8.2" fill="#2F5D8A" text-anchor="start" font-weight="bold">8. Maintainable</text><text x="118" y="239" font-size="7.0" fill="#272134" text-anchor="start">equipment accessible, standard spares, isolation possible</text><text x="180" y="258" font-size="7.2" fill="#B66A00" text-anchor="middle" font-weight="bold">A design that fails any one test is not a good design, however cheap it looks.</text></svg>