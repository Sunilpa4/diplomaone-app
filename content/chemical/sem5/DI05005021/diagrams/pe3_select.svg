<svg xmlns="http://www.w3.org/2000/svg" width="360" height="272" viewBox="0 0 360 272" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="272" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Selecting equipment by function</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 3.5: first choose the family by function, then the type by duty</text><rect x="10" y="48" width="340" height="38" rx="4" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.4"/><rect x="10" y="48" width="96" height="38" rx="4" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="0"/><text x="58" y="65" font-size="7.4" fill="#2F5D8A" text-anchor="middle" font-weight="bold">SIZE</text><text x="58" y="77" font-size="7.4" fill="#2F5D8A" text-anchor="middle" font-weight="bold">REDUCTION</text><text x="114" y="60" font-size="6.6" fill="#272134" text-anchor="start">•  jaw / gyratory crusher: coarse, hard ore</text><text x="114" y="69.5" font-size="6.6" fill="#272134" text-anchor="start">•  roll crusher, hammer mill: medium</text><text x="114" y="79.0" font-size="6.6" fill="#272134" text-anchor="start">•  ball mill, attrition mill: fine grinding</text><rect x="10" y="90" width="340" height="38" rx="4" fill="#FFFFFF" stroke="#B66A00" stroke-width="1.4"/><rect x="10" y="90" width="96" height="38" rx="4" fill="#FFFFFF" stroke="#B66A00" stroke-width="0"/><text x="58" y="107" font-size="7.4" fill="#B66A00" text-anchor="middle" font-weight="bold">HEAT</text><text x="58" y="119" font-size="7.4" fill="#B66A00" text-anchor="middle" font-weight="bold">TRANSFER</text><text x="114" y="102" font-size="6.6" fill="#272134" text-anchor="start">•  shell &amp; tube: high P and T, general duty</text><text x="114" y="111.5" font-size="6.6" fill="#272134" text-anchor="start">•  plate: compact, close approach, clean fluids</text><text x="114" y="121.0" font-size="6.6" fill="#272134" text-anchor="start">•  double pipe: small duty; air cooler: no water</text><rect x="10" y="132" width="340" height="38" rx="4" fill="#FFFFFF" stroke="#272134" stroke-width="1.4"/><rect x="10" y="132" width="96" height="38" rx="4" fill="#FFFFFF" stroke="#272134" stroke-width="0"/><text x="58" y="149" font-size="7.4" fill="#272134" text-anchor="middle" font-weight="bold">MATERIAL</text><text x="58" y="161" font-size="7.4" fill="#272134" text-anchor="middle" font-weight="bold">HANDLING</text><text x="114" y="144" font-size="6.6" fill="#272134" text-anchor="start">•  solids: belt, screw, bucket, pneumatic</text><text x="114" y="153.5" font-size="6.6" fill="#272134" text-anchor="start">•  liquids: piping and pumps (below)</text><text x="114" y="163.0" font-size="6.6" fill="#272134" text-anchor="start">•  gases: fans, blowers, compressors</text><rect x="10" y="174" width="340" height="38" rx="4" fill="#FFFFFF" stroke="#BD2543" stroke-width="1.4"/><rect x="10" y="174" width="96" height="38" rx="4" fill="#FFFFFF" stroke="#BD2543" stroke-width="0"/><text x="58" y="191" font-size="7.4" fill="#BD2543" text-anchor="middle" font-weight="bold">MASS</text><text x="58" y="203" font-size="7.4" fill="#BD2543" text-anchor="middle" font-weight="bold">TRANSFER</text><text x="114" y="186" font-size="6.6" fill="#272134" text-anchor="start">•  tray column: many stages, large rates</text><text x="114" y="195.5" font-size="6.6" fill="#272134" text-anchor="start">•  packed column: vacuum, low pressure drop</text><text x="114" y="205.0" font-size="6.6" fill="#272134" text-anchor="start">•  spray / agitated: scrubbing, reactions</text><rect x="10" y="216" width="340" height="38" rx="4" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.4"/><rect x="10" y="216" width="96" height="38" rx="4" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="0"/><text x="58" y="233" font-size="7.4" fill="#2F5D8A" text-anchor="middle" font-weight="bold">PUMPS</text><text x="58" y="245" font-size="7.4" fill="#2F5D8A" text-anchor="middle" font-weight="bold"></text><text x="114" y="228" font-size="6.6" fill="#272134" text-anchor="start">•  centrifugal: large flow, low head, thin liquids</text><text x="114" y="237.5" font-size="6.6" fill="#272134" text-anchor="start">•  reciprocating: high head, metering duty</text><text x="114" y="247.0" font-size="6.6" fill="#272134" text-anchor="start">•  gear / screw: viscous liquids, steady dosing</text><text x="180" y="264" font-size="7.0" fill="#555555" text-anchor="middle">Within each family, duty (rate, P, T, property of the stream) picks the type.</text></svg>