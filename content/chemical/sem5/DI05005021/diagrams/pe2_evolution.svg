<svg xmlns="http://www.w3.org/2000/svg" width="360" height="242" viewBox="0 0 360 242" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="242" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Process evolution: laboratory to commercial plant</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 2.2: four stages, each proving something the previous one could not</text><rect x="8" y="56" width="82" height="76" rx="5" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5"/><text x="49" y="70" font-size="6.6" fill="#2F5D8A" text-anchor="middle" font-weight="bold">1. LABORATORY</text><line x1="14" y1="76" x2="84" y2="76" stroke="#2F5D8A" stroke-width="0.8"/><text x="49" y="88" font-size="6.0" fill="#272134" text-anchor="middle">grams; bench scale</text><text x="49" y="104" font-size="6.0" fill="#555555" text-anchor="middle">prove the chemistry:</text><text x="49" y="114" font-size="6.0" fill="#555555" text-anchor="middle">yield, kinetics, materials</text><rect x="94" y="56" width="82" height="76" rx="5" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5"/><text x="135" y="70" font-size="6.6" fill="#2F5D8A" text-anchor="middle" font-weight="bold">2. PILOT PLANT</text><line x1="100" y1="76" x2="170" y2="76" stroke="#2F5D8A" stroke-width="0.8"/><text x="135" y="88" font-size="6.0" fill="#272134" text-anchor="middle">kg/day; mini-plant</text><text x="135" y="104" font-size="6.0" fill="#555555" text-anchor="middle">prove the process:</text><text x="135" y="114" font-size="6.0" fill="#555555" text-anchor="middle">recycle, control, fouling</text><rect x="180" y="56" width="82" height="76" rx="5" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5"/><text x="221" y="70" font-size="6.6" fill="#2F5D8A" text-anchor="middle" font-weight="bold">3. SEMI-COMM.</text><line x1="186" y1="76" x2="256" y2="76" stroke="#2F5D8A" stroke-width="0.8"/><text x="221" y="88" font-size="6.0" fill="#272134" text-anchor="middle">t/day; demo plant</text><text x="221" y="104" font-size="6.0" fill="#555555" text-anchor="middle">prove the market &amp;</text><text x="221" y="114" font-size="6.0" fill="#555555" text-anchor="middle">operation: cost, quality</text><rect x="266" y="56" width="82" height="76" rx="5" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5"/><text x="307" y="70" font-size="6.6" fill="#2F5D8A" text-anchor="middle" font-weight="bold">4. COMMERCIAL</text><line x1="272" y1="76" x2="342" y2="76" stroke="#2F5D8A" stroke-width="0.8"/><text x="307" y="88" font-size="6.0" fill="#272134" text-anchor="middle">full rate; the real plant</text><text x="307" y="104" font-size="6.0" fill="#555555" text-anchor="middle">earn: design output,</text><text x="307" y="114" font-size="6.0" fill="#555555" text-anchor="middle">guaranteed performance</text><line x1="90" y1="94" x2="94" y2="94" stroke="#272134" stroke-width="1.6"/><polygon points="94.0,94.0 86.0,90.4 86.0,97.6" fill="#272134"/><line x1="176" y1="94" x2="180" y2="94" stroke="#272134" stroke-width="1.6"/><polygon points="180.0,94.0 172.0,90.4 172.0,97.6" fill="#272134"/><line x1="262" y1="94" x2="266" y2="94" stroke="#272134" stroke-width="1.6"/><polygon points="266.0,94.0 258.0,90.4 258.0,97.6" fill="#272134"/><text x="14" y="152" font-size="7.2" fill="#272134" text-anchor="start" font-weight="bold">Money at risk grows:</text><rect x="14" y="158" width="330" height="12" rx="3" fill="#FCE4EC" stroke="#BD2543" stroke-width="1.1"/><rect x="14" y="158" width="60" height="12" rx="3" fill="#F8BBD0" stroke="#BD2543" stroke-width="0"/><rect x="74" y="158" width="90" height="12" rx="0" fill="#F48FB1" stroke="#BD2543" stroke-width="0"/><rect x="164" y="158" width="180" height="12" rx="3" fill="#E57393" stroke="#BD2543" stroke-width="0"/><text x="180" y="167.5" font-size="6.4" fill="#272134" text-anchor="middle">each stage is roughly 10 - 100 x the scale (and cost) of the previous one</text><rect x="8" y="182" width="344" height="38" rx="5" fill="#FFF8E1" stroke="#B66A00" stroke-width="1.2"/><text x="180" y="197" font-size="8.2" fill="#B66A00" text-anchor="middle" font-weight="bold">Why not jump straight from laboratory to commercial?</text><text x="180" y="211" font-size="6.8" fill="#272134" text-anchor="middle">scale-up hides problems that only a pilot plant reveals cheaply.</text><text x="180" y="234" font-size="7.0" fill="#555555" text-anchor="middle">Skipping stages saves months and can cost the whole plant.</text></svg>