<svg xmlns="http://www.w3.org/2000/svg" width="360" height="246" viewBox="0 0 360 246" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="246" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Continuous versus batch processing</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 2.5: one steady stream versus repeated charge-react-discharge cycles</text><line x1="34" y1="150" x2="34" y2="56" stroke="#272134" stroke-width="1.4"/><line x1="34" y1="150" x2="340" y2="150" stroke="#272134" stroke-width="1.4"/><text x="26" y="60" font-size="7" fill="#272134" text-anchor="end">output</text><text x="336" y="164" font-size="7" fill="#272134" text-anchor="end">time -></text><line x1="34" y1="78" x2="330" y2="78" stroke="#2F5D8A" stroke-width="3"/><text x="180" y="70" font-size="7.6" fill="#2F5D8A" text-anchor="middle" font-weight="bold">CONTINUOUS: steady rate, day and night</text><path d="M40 138 L40 96 L112 96 L112 138 L112 96 L184 96 L184 138 L184 96 L256 96 L256 138 L256 96 L328 96 L328 138" fill="none" stroke="#B66A00" stroke-width="2.4"/><text x="110" y="130" font-size="6.6" fill="#B66A00" text-anchor="middle" font-weight="bold">batch 1</text><text x="184" y="130" font-size="6.6" fill="#B66A00" text-anchor="middle" font-weight="bold">batch 2</text><text x="256" y="130" font-size="6.6" fill="#B66A00" text-anchor="middle" font-weight="bold">batch 3</text><text x="180" y="146" font-size="1" fill="#272134" text-anchor="middle"></text><text x="292" y="88" font-size="6.4" fill="#B66A00" text-anchor="middle" font-weight="bold">each hump = one batch cycle</text><rect x="8" y="176" width="168" height="62" rx="5" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.3"/><text x="92" y="191" font-size="7.8" fill="#2F5D8A" text-anchor="middle" font-weight="bold">CONTINUOUS suits:</text><text x="18" y="205" font-size="6.8" fill="#272134" text-anchor="start">• large tonnage, one product</text><text x="18" y="217" font-size="6.8" fill="#272134" text-anchor="start">• steady quality, low labour/unit</text><text x="18" y="229" font-size="6.8" fill="#272134" text-anchor="start">• e.g. ammonia, refining, cement</text><rect x="184" y="176" width="168" height="62" rx="5" fill="#FDEBD7" stroke="#B66A00" stroke-width="1.3"/><text x="268" y="191" font-size="7.8" fill="#B66A00" text-anchor="middle" font-weight="bold">BATCH suits:</text><text x="194" y="205" font-size="6.8" fill="#272134" text-anchor="start">• small lots, many products/grades</text><text x="194" y="217" font-size="6.8" fill="#272134" text-anchor="start">• frequent changeover, pharma/dyes</text><text x="194" y="229" font-size="6.8" fill="#272134" text-anchor="start">• flexible, but idle time between lots</text></svg>