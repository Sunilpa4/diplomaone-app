<svg xmlns="http://www.w3.org/2000/svg" width="360" height="240" viewBox="0 0 360 240" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="240" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">The four families of plant design factors</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 2.3: technical, economic, legal, and safety &amp; sanitation factors</text><rect x="8" y="50" width="168" height="80" rx="5" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.5"/><text x="92" y="66" font-size="8.4" fill="#2F5D8A" text-anchor="middle" font-weight="bold">TECHNICAL</text><text x="20" y="82" font-size="6.8" fill="#272134" text-anchor="start">•  proven process &amp; data</text><text x="20" y="94.5" font-size="6.8" fill="#272134" text-anchor="start">•  raw material quality</text><text x="20" y="107.0" font-size="6.8" fill="#272134" text-anchor="start">•  equipment availability</text><text x="20" y="119.5" font-size="6.8" fill="#272134" text-anchor="start">•  scale-up and utilities</text><rect x="184" y="50" width="168" height="80" rx="5" fill="#FFFFFF" stroke="#272134" stroke-width="1.5"/><text x="268" y="66" font-size="8.4" fill="#272134" text-anchor="middle" font-weight="bold">ECONOMIC</text><text x="196" y="82" font-size="6.8" fill="#272134" text-anchor="start">•  market size and price</text><text x="196" y="94.5" font-size="6.8" fill="#272134" text-anchor="start">•  capital and operating cost</text><text x="196" y="107.0" font-size="6.8" fill="#272134" text-anchor="start">•  return on investment</text><text x="196" y="119.5" font-size="6.8" fill="#272134" text-anchor="start">•  risk and competition</text><rect x="8" y="138" width="168" height="80" rx="5" fill="#FFFFFF" stroke="#272134" stroke-width="1.5"/><text x="92" y="154" font-size="8.4" fill="#272134" text-anchor="middle" font-weight="bold">LEGAL</text><text x="20" y="170" font-size="6.8" fill="#272134" text-anchor="start">•  factory and labour law</text><text x="20" y="182.5" font-size="6.8" fill="#272134" text-anchor="start">•  pollution control acts</text><text x="20" y="195.0" font-size="6.8" fill="#272134" text-anchor="start">•  product standards / patents</text><text x="20" y="207.5" font-size="6.8" fill="#272134" text-anchor="start">•  licences and clearances</text><rect x="184" y="138" width="168" height="80" rx="5" fill="#FDEBD7" stroke="#B66A00" stroke-width="1.5"/><text x="268" y="154" font-size="8.4" fill="#B66A00" text-anchor="middle" font-weight="bold">SAFETY &amp; SANITATION</text><text x="196" y="170" font-size="6.8" fill="#272134" text-anchor="start">•  hazards: fire, toxicity</text><text x="196" y="182.5" font-size="6.8" fill="#272134" text-anchor="start">•  relief and containment</text><text x="196" y="195.0" font-size="6.8" fill="#272134" text-anchor="start">•  plant hygiene, drainage</text><text x="196" y="207.5" font-size="6.8" fill="#272134" text-anchor="start">•  worker health facilities</text><text x="180" y="232" font-size="7.2" fill="#555555" text-anchor="middle">A project proceeds only when all four families of factors say yes at the same time.</text></svg>