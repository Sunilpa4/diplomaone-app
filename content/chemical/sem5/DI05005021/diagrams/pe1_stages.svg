F" stroke-width="1.2"/><text x="285" y="128" font-size="8" fill="#FFFFFF" text-anchor="middle" font-weight="bold">5</text><text x="298" y="129" font-size="7.1" fill="#272134" text-anchor="start" font-weight="bold">Layout &amp;</text><text x="298" y="143" font-size="6.3" fill="#555555" text-anchor="start">location</text><rect x="184" y="112" width="80" height="44" rx="5" fill="#FDEBD7" stroke="#B66A00" stroke-width="1.5"/><circle cx="197" cy="125" r="8" fill="#B66A00" stroke="#FFFFFF" stroke-width="1.2"/><text x="197" y="128" font-size="8" fill="#FFFFFF" text-anchor="middle" font-weight="bold">6</text><text x="210" y="129" font-size="7.1" fill="#272134" text-anchor="start" font-weight="bold">Economics</text><text x="210" y="143" font-size="6.3" fill="#555555" text-anchor="start">cost &amp; profit</text><rect x="96" y="112" width="80" height="44" rx="5" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5"/><circle cx="109" cy="125" r="8" fill="#2F5D8A" stroke="#FFFFFF" stroke-width="1.2"/><text x="109" y="128" font-size="8" fill="#FFFFFF" text-anchor="middle" font-weight="bold">7</text><text x="122" y="129" font-size="7.1" fill="#272134" text-anchor="start" font-weight="bold">Construction</text><text x="122" y="143" font-size="6.3" fill="#555555" text-anchor="start">&amp; erection</text><rect x="8" y="112" width="80" height="44" rx="5" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/><circle cx="21" cy="125" r="8" fill="#2E7D32" stroke="#FFFFFF" stroke-width="1.2"/><text x="21" y="128" font-size="8" fill="#FFFFFF" text-anchor="middle" font-weight="bold">8</text><text x="34" y="129" font-size="7.1" fill="#272134" text-anchor="start" font-weight="bold">Commercial</text><text x="34" y="143" font-size="6.3" fill="#555555" text-anchor="start">production</text><line x1="264" y1="134" x2="256" y2="134" stroke="#272134" stroke-width="1.6"/><polygon points="256.0,134.0 264.0,137.6 264.0,130.4" fill="#272134"/><line x1="176" y1="134" x2="168" y2="134" stroke="#272134" stroke-width="1.6"/><polygon points="168.0,134.0 176.0,137.6 176.0,130.4" fill="#272134"/><line x1="88" y1="134" x2="80" y2="134" stroke="#272134" stroke-width="1.6"/><polygon points="80.0,134.0 88.0,137.6 88.0,130.4" fill="#272134"/><rect x="8" y="172" width="344" height="40" rx="5" fill="#FFF8E1" stroke="#B66A00" stroke-width="1.3"/><text x="180" y="188" font-size="8.5" fill="#B66A00" text-anchor="middle" font-weight="bold">Economics is checked at EVERY stage:</text><text x="180" y="202" font-size="7.2" fill="#272134" text-anchor="middle">estimate cost and return, then decide - continue, revise or drop the project.</text><line x1="180" y1="172" x2="220" y2="158" stroke="#B66A00" stroke-width="1.2" stroke-dasharray="4 3"/><polygon points="220.0,158.0 211.3,157.2 213.6,164.0" fill="#B66A00"/><text x="180" y="228" font-size="7.2" fill="#555555" text-anchor="middle">A design is finished only when the plant can be built, operated safely and run at a profit.</text></svg>