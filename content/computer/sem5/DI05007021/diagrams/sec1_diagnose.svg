<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 530" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="530" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Diagnose one layer at a time</text><text x="180" y="51.7" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal">Only your own system or an authorized lab</text><rect x="18" y="80" width="324" height="64" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="107.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">1. Local setup</text><text x="180" y="128.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Loopback address and interface</text><path d="M180 144 L180 171" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,171.0 183.5,164.0 176.5,164.0" fill="#7B2CD9"/><rect x="18" y="171" width="324" height="64" rx="8" fill="#F2EBFA" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="198.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">2. Name resolution</text><text x="180" y="219.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">localhost through the OS resolver</text><path d="M180 235 L180 262" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,262.0 183.5,255.0 176.5,255.0" fill="#7B2CD9"/><rect x="18" y="262" width="324" height="64" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="289.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">3. Path and permissions</text><text x="180" y="310.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Route decision; interpret denied ping honestly</text><path d="M180 326 L180 353" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,353.0 183.5,346.0 176.5,346.0" fill="#7B2CD9"/><rect x="18" y="353" width="324" height="64" rx="8" fill="#F2EBFA" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="380.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">4. Service and policy</text><text x="180" y="401.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Owned listening socket; permitted operation</text><text x="180" y="466.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Loopback success does not prove Internet access.</text><text x="180" y="483.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">A failed ping alone does not prove DoS.</text><text x="180" y="500.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">A working service is not automatically secure.</text></svg>