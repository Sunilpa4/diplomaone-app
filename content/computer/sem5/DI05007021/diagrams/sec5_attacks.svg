<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 490" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="490" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Do not infer an attack from one symptom</text><rect x="18" y="76" width="324" height="76" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="103.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">DoS / DDoS</text><text x="180" y="124.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Malicious availability disruption / distributed</text><rect x="18" y="181" width="324" height="76" rx="8" fill="#F2EBFA" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="208.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">MITM / on-path interference</text><text x="180" y="229.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Unauthorized interposition in communication</text><rect x="18" y="286" width="324" height="76" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="313.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">IP spoofing / ARP spoofing</text><text x="180" y="334.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Source-IP claim / local address mapping</text><text x="180" y="422.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">No floods, poisoned caches or forged packets.</text><text x="180" y="439.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Rate/ARP exercises are only logical fixtures.</text><text x="180" y="456.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">The TLS identity check uses owned loopback.</text></svg>