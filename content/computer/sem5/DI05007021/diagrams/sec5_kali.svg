<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 496" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="496" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Three evidence stages in Kali study</text><rect x="18" y="76" width="324" height="75" rx="8" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="103.2" font-size="12" text-anchor="middle" fill="#2E7D32" font-weight="bold">1. Signed manifest under a pinned key</text><text x="180" y="124.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">ACTUAL GPG check of frozen2026.3 metadata</text><path d="M180 151 L180 185" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,185.0 183.5,178.0 176.5,178.0" fill="#7B2CD9"/><rect x="18" y="185" width="324" height="75" rx="8" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="212.2" font-size="12" text-anchor="middle" fill="#B66A00" font-weight="bold">2. Hash and compare actual ISO bytes</text><text x="180" y="233.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">NOT DONE: no image bytes downloaded</text><path d="M180 260 L180 294" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,294.0 183.5,287.0 176.5,287.0" fill="#7B2CD9"/><rect x="18" y="294" width="324" height="75" rx="8" fill="#F2EBFA" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="321.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">3. Install/boot/study an isolated VM</text><text x="180" y="342.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">GUIDED ONLY: no Kali OS is booted</text><text x="180" y="428.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Metadata authenticity is not missing-image integrity.</text><text x="180" y="445.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">No ISO/VM, offensive toolkit or secret key shipped.</text><text x="180" y="462.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Check current authentic versions/keys for new use.</text></svg>