<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 488" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="488" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">A valid path is not revocation status</text><rect x="18" y="73" width="324" height="70" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="100.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">Before local revocation</text><text x="180" y="121.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Supplied leaf CRL check succeeds</text><rect x="18" y="174" width="324" height="70" rx="8" fill="#F2EBFA" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="201.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Revoke leaf and issue a new CRL</text><text x="180" y="222.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Actual CA database/status update</text><path d="M180 143 L180 174" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,174.0 183.5,167.0 176.5,167.0" fill="#7B2CD9"/><path d="M180 244 L180 270 L90 270 L90 309" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="90.0,309.0 93.5,302.0 86.5,302.0" fill="#2E7D32"/><path d="M180 270 L270 270 L270 309" fill="none" stroke="#BD2543" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="270.0,309.0 273.5,302.0 266.5,302.0" fill="#BD2543"/><rect x="18.0" y="309.0" width="144" height="86" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="90" y="342.9" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">Path only:</text><text x="90" y="355.9" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">still valid</text><text x="90" y="368.9" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">(no CRL check)</text><rect x="198.0" y="309.0" width="144" height="86" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="270" y="343.0" font-size="10.8" text-anchor="middle" fill="#222" font-weight="normal">Supplied CRL:</text><text x="270" y="355.8" font-size="10.8" text-anchor="middle" fill="#222" font-weight="normal">revoked rejected</text><text x="270" y="368.6" font-size="10.8" text-anchor="middle" fill="#222" font-weight="normal">(error23)</text><text x="180" y="441.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">This demo checks only the leaf’s local CRL.</text><text x="180" y="458.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">No all-chain revocation, OCSP or live download.</text></svg>