<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 573" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="573" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">DES f: 32 bits in, 32 bits out</text><rect x="18" y="65" width="324" height="64" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="92.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">Expansion E: 32 -&gt; 48</text><text x="180" y="113.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Expand the previous right half</text><path d="M180 129 L180 151" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,151.0 183.5,144.0 176.5,144.0" fill="#7B2CD9"/><rect x="18" y="151" width="324" height="64" rx="8" fill="#F2EBFA" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="178.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">XOR with K_i: 48 bits</text><text x="180" y="199.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Round-key mixing</text><path d="M180 215 L180 237" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,237.0 183.5,230.0 176.5,230.0" fill="#7B2CD9"/><rect x="18" y="237" width="324" height="64" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="264.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">Eight S-boxes: 8 x (6 -&gt; 4)</text><text x="180" y="285.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Combined output: 32 bits</text><path d="M180 301 L180 323" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,323.0 183.5,316.0 176.5,316.0" fill="#7B2CD9"/><rect x="18" y="323" width="324" height="64" rx="8" fill="#F2EBFA" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="350.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Permutation P: 32 -&gt; 32</text><text x="180" y="371.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Feed the Feistel XOR with the left half</text><rect x="18.0" y="426.0" width="324" height="70" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="458.4" font-size="10.8" text-anchor="middle" fill="#222" font-weight="normal">Key: 64 representation bits -&gt; PC-1: 56</text><text x="180" y="471.2" font-size="10.8" text-anchor="middle" fill="#222" font-weight="normal">28+28 rotations -&gt; PC-2: 48 per round</text><text x="180" y="529.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">The extra eight key bits are parity, not strength.</text><text x="180" y="546.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">S-box row: outer bits; column: inner four bits.</text></svg>