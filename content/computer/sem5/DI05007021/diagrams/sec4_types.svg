<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 543" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="543" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Five firewall types: different context</text><rect x="18" y="65" width="324" height="65" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="92.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">Packet filtering</text><text x="180" y="113.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Relevant packet headers and rules</text><rect x="18" y="145" width="324" height="65" rx="8" fill="#F2EBFA" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="172.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Stateful inspection</text><text x="180" y="193.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Tracked session/flow context</text><rect x="18" y="225" width="324" height="65" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="252.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">Application-level gateway</text><text x="180" y="273.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Supported application semantics</text><rect x="18" y="305" width="324" height="65" rx="8" fill="#F2EBFA" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="332.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Circuit-level gateway</text><text x="180" y="353.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Session establishment and byte relay</text><rect x="18" y="385" width="324" height="65" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="412.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">Next-generation firewall</text><text x="180" y="433.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Additional application/context/protection</text><text x="180" y="499.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Products/configuration may combine capabilities.</text><text x="180" y="516.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">No type guarantees complete prevention/visibility.</text></svg>