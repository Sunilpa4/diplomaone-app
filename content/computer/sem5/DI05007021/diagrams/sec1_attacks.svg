<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 443" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="443" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Attacks: observe or interfere?</text><rect x="18.0" y="57.0" width="324" height="112" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="103.5" font-size="11.6" text-anchor="middle" fill="#222" font-weight="normal">PASSIVE</text><text x="180" y="117.1" font-size="11.6" text-anchor="middle" fill="#222" font-weight="normal">Observe without changing data/system</text><text x="180" y="130.7" font-size="11.6" text-anchor="middle" fill="#222" font-weight="normal">Message contents; traffic analysis</text><rect x="18.0" y="205.0" width="324" height="146" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="268.7" font-size="11.2" text-anchor="middle" fill="#222" font-weight="normal">ACTIVE</text><text x="180" y="281.9" font-size="11.2" text-anchor="middle" fill="#222" font-weight="normal">Alter, impersonate, replay or disrupt</text><text x="180" y="295.1" font-size="11.2" text-anchor="middle" fill="#222" font-weight="normal">Masquerade; replay; modification; DoS</text><text x="180" y="397.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Passive does not mean harmless.</text><text x="180" y="414.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Encrypted content can still expose traffic patterns.</text></svg>