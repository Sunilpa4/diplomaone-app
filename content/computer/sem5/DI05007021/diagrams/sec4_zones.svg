<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="470" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Zones are roles, not automatic trust</text><rect x="18" y="72" width="324" height="70" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="99.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">Outside / Internet</text><text x="180" y="120.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Treat untrusted communication appropriately</text><rect x="18" y="184" width="324" height="70" rx="8" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="211.2" font-size="12" text-anchor="middle" fill="#B66A00" font-weight="bold">DMZ</text><text x="180" y="232.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Separately controlled exposed services</text><rect x="18" y="296" width="324" height="70" rx="8" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="323.2" font-size="12" text-anchor="middle" fill="#2E7D32" font-weight="bold">Inside / Intranet</text><text x="180" y="344.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Internal is not automatically safe</text><path d="M180 142 L180 184" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,184.0 183.5,177.0 176.5,177.0" fill="#7B2CD9"/><path d="M180 254 L180 296" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,296.0 183.5,289.0 176.5,289.0" fill="#7B2CD9"/><text x="180" y="423.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Define, enforce and verify boundary policy.</text><text x="180" y="440.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Private addressing is not authentication.</text></svg>