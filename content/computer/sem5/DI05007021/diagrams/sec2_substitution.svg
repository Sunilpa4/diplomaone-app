<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 505" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="505" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Do not mix up these classifications</text><rect x="18" y="64" width="324" height="68" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="91.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">Monoalphabetic</text><text x="180" y="112.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Fixed symbol mapping: Caesar/permutation</text><rect x="18" y="152" width="324" height="68" rx="8" fill="#F2EBFA" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="179.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Polyalphabetic</text><text x="180" y="200.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Mapping varies by position: Vigenere</text><rect x="18" y="240" width="324" height="68" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="267.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">Polygraphic</text><text x="180" y="288.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Pairs/blocks: Playfair and Hill</text><rect x="18" y="328" width="324" height="68" rx="8" fill="#F2EBFA" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="355.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Transposition</text><text x="180" y="376.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Reorders positions: rail fence</text><text x="180" y="462.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">These classical methods are teaching examples.</text><text x="180" y="479.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">They are not modern protection for real secrets.</text></svg>