<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 542" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="542" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Services: what protection is supplied?</text><rect x="18" y="63" width="324" height="65" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="90.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">Confidentiality</text><text x="180" y="111.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Restrict unauthorized disclosure</text><rect x="18" y="143" width="324" height="65" rx="8" fill="#F2EBFA" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="170.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Integrity</text><text x="180" y="191.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Protect against improper change/destruction</text><rect x="18" y="223" width="324" height="65" rx="8" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="250.2" font-size="12" text-anchor="middle" fill="#2E7D32" font-weight="bold">Authentication</text><text x="180" y="271.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Establish a claimed identity or data origin</text><rect x="18" y="303" width="324" height="65" rx="8" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="330.2" font-size="12" text-anchor="middle" fill="#B66A00" font-weight="bold">Access control</text><text x="180" y="351.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Prevent unauthorized use/operations</text><rect x="18" y="383" width="324" height="65" rx="8" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="180" y="410.2" font-size="12" text-anchor="middle" fill="#BD2543" font-weight="bold">Non-repudiation</text><text x="180" y="431.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Evidence against false denial</text><text x="180" y="499.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Mechanisms are the means of supplying services.</text><text x="180" y="516.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Availability remains an essential security goal.</text></svg>