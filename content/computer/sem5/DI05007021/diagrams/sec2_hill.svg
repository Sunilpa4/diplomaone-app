<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 493" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="493" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Hill: multiply COLUMN vectors</text><text x="180" y="51.7" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal">K = [[3,3],[2,5]], A=0</text><rect x="18" y="78" width="324" height="72" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="105.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">HE -&gt; [7,4]^T</text><text x="180" y="126.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Use two-letter blocks</text><path d="M180 150 L180 182" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,182.0 183.5,175.0 176.5,175.0" fill="#7B2CD9"/><rect x="18" y="182" width="324" height="72" rx="8" fill="#F2EBFA" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="209.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">K * P = [33,34]^T</text><text x="180" y="230.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">[3*7+3*4, 2*7+5*4]</text><path d="M180 254 L180 286" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,286.0 183.5,279.0 176.5,279.0" fill="#7B2CD9"/><rect x="18" y="286" width="324" height="72" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="313.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">mod26 -&gt; [7,8]^T -&gt; HI</text><text x="180" y="334.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">LP similarly becomes AT; HELP -&gt; HIAT</text><text x="180" y="427.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">det(K)=9; gcd(9,26)=1.</text><text x="180" y="444.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">K^-1 = [[15,17],[20,9]] mod26.</text><text x="180" y="461.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">A nonzero determinant alone is not enough.</text></svg>