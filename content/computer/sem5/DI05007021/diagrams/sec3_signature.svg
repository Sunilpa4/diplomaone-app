<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 487" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="487" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Sign and verify, not private encryption</text><rect x="18" y="68" width="324" height="64" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="95.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">Message + private signing key</text><text x="180" y="116.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">RSA-PSS/SHA-256 in the actual example</text><path d="M180 132 L180 156" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,156.0 183.5,149.0 176.5,149.0" fill="#7B2CD9"/><rect x="18" y="156" width="324" height="64" rx="8" fill="#F2EBFA" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="183.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Message and signature</text><text x="180" y="204.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">The message is not thereby confidential</text><path d="M180 220 L180 244" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,244.0 183.5,237.0 176.5,237.0" fill="#7B2CD9"/><rect x="18" y="244" width="324" height="64" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="271.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">Authentic public verification key</text><text x="180" y="292.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Check the exact message and scheme</text><rect x="18.0" y="345.0" width="144" height="56" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="90" y="370.2" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">Original:</text><text x="90" y="384.2" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">valid</text><rect x="198.0" y="345.0" width="144" height="56" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="270" y="370.4" font-size="10.5" text-anchor="middle" fill="#222" font-weight="normal">Modified / wrong key:</text><text x="270" y="382.9" font-size="10.5" text-anchor="middle" fill="#222" font-weight="normal">invalid</text><path d="M180 308 L180 328 L90 328 L90 345" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="90.0,345.0 93.5,338.0 86.5,338.0" fill="#2E7D32"/><path d="M180 328 L270 328 L270 345" fill="none" stroke="#BD2543" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="270.0,345.0 273.5,338.0 266.5,338.0" fill="#BD2543"/><text x="180" y="443.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Validity depends on trust and key control.</text><text x="180" y="460.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Not an automatic human, truth or legal proof.</text></svg>