<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 490" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="490" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Obtaining a certificate: roles</text><rect x="18" y="72" width="324" height="60" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="99.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">Generate/protect the key locally</text><text x="180" y="120.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Keep private material; create a signed CSR</text><path d="M180 132 L180 155" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,155.0 183.5,148.0 176.5,148.0" fill="#7B2CD9"/><rect x="18" y="155" width="324" height="60" rx="8" fill="#F2EBFA" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="182.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">RA / CA identity and policy checks</text><text x="180" y="203.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">CSR signature alone is not identity vetting</text><path d="M180 215 L180 238" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,238.0 183.5,231.0 176.5,231.0" fill="#7B2CD9"/><rect x="18" y="238" width="324" height="60" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="265.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">CA certificate issuance</text><text x="180" y="286.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Approve attributes and sign under policy</text><path d="M180 298 L180 321" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,321.0 183.5,314.0 176.5,314.0" fill="#7B2CD9"/><rect x="18" y="321" width="324" height="60" rx="8" fill="#F2EBFA" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="348.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Application installation / lifecycle</text><text x="180" y="369.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Check chain, protect key, renew/revoke</text><text x="180" y="448.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Real identity vetting is NOT performed here.</text><text x="180" y="465.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Only disposable local issuing steps are run.</text></svg>