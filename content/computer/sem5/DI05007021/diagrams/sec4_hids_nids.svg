<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 503" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="503" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Complementary views, not all-seeing tools</text><rect x="18.0" y="70.5" width="324" height="145" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="127.6" font-size="10.8" text-anchor="middle" fill="#222" font-weight="normal">HIDS: selected host context</text><text x="180" y="140.4" font-size="10.8" text-anchor="middle" fill="#222" font-weight="normal">Files / logs / processes</text><text x="180" y="153.2" font-size="10.8" text-anchor="middle" fill="#222" font-weight="normal">Needs agent access, trusted baseline and upkeep</text><text x="180" y="166.0" font-size="10.8" text-anchor="middle" fill="#222" font-weight="normal">A compromised host may tamper with evidence</text><rect x="18.0" y="257.5" width="324" height="145" rx="7" fill="#F2EBFA" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="314.6" font-size="10.8" text-anchor="middle" fill="#222" font-weight="normal">NIDS: monitored network paths</text><text x="180" y="327.4" font-size="10.8" text-anchor="middle" fill="#222" font-weight="normal">Packets / flows at appropriate sensors</text><text x="180" y="340.2" font-size="10.8" text-anchor="middle" fill="#222" font-weight="normal">Placement, encryption and packet loss matter</text><text x="180" y="353.0" font-size="10.8" text-anchor="middle" fill="#222" font-weight="normal">Off-path traffic is not automatically visible</text><text x="180" y="457.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">False positives and false negatives both matter.</text><text x="180" y="474.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">The six-case metrics are not a product benchmark.</text></svg>