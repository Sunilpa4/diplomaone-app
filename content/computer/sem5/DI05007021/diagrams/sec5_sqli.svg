<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 464" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="464" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Keep SQL structure separate from values</text><rect x="18" y="68" width="324" height="70" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="95.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">Application-owned query structure</text><text x="180" y="116.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">SELECT ... WHERE code = ?</text><rect x="18" y="168" width="324" height="70" rx="8" fill="#F2EBFA" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="195.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Bind the input value through the API</text><text x="180" y="216.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Do not concatenate untrusted SQL syntax</text><path d="M180 138 L180 168" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,168.0 183.5,161.0 176.5,161.0" fill="#7B2CD9"/><path d="M180 238 L180 272" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,272.0 183.5,265.0 176.5,265.0" fill="#7B2CD9"/><rect x="18" y="272" width="324" height="72" rx="8" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="299.2" font-size="12" text-anchor="middle" fill="#2E7D32" font-weight="bold">Actual own in-memory SQLite results</text><text x="180" y="320.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Normal C01: 1 row; bound SQL-like input: 0</text><text x="180" y="400.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Both fictional records remain intact.</text><text x="180" y="417.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Binding values is not application authorization.</text><text x="180" y="434.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">No external database/account is attacked.</text></svg>