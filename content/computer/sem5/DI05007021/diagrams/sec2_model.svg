FA" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="348.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Decrypt D_K</text><text x="180" y="369.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Receiver uses the corresponding secret</text><path d="M180 381 L180 404" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,404.0 183.5,397.0 176.5,397.0" fill="#7B2CD9"/><rect x="18" y="404" width="324" height="60" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="431.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">Recovered prepared P</text><text x="180" y="452.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Not automatically original text formatting</text><text x="180" y="509.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Encryption alone does not authenticate.</text></svg>