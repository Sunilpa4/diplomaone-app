<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 527" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="527" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Course categories, not legal findings</text><rect x="18" y="69" width="324" height="70" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="96.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">Identity / information theft</text><text x="180" y="117.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Identity misuse versus unauthorized data theft</text><rect x="18" y="158" width="324" height="70" rx="8" fill="#F2EBFA" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="185.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Unauthorized hacking</text><text x="180" y="206.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Not every authorized security activity</text><rect x="18" y="247" width="324" height="70" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="274.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">Cyberstalking</text><text x="180" y="295.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Protect privacy and seek appropriate support</text><rect x="18" y="336" width="324" height="70" rx="8" fill="#F2EBFA" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="363.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Malware distribution</text><text x="180" y="384.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Do not obtain/run/spread dangerous samples</text><text x="180" y="460.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Preserve appropriate evidence safely.</text><text x="180" y="477.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Use trusted institutional/official channels.</text><text x="180" y="494.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Immediate danger: seek local emergency help.</text></svg>