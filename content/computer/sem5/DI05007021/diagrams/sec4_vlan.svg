<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 505" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="505" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">VLANs: separate L2 broadcast domains</text><rect x="18.0" y="60.0" width="152" height="104" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="94" y="102.8" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">VLAN10</text><text x="94" y="115.8" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">Host A / Host B</text><text x="94" y="128.8" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">Same assigned domain</text><rect x="190.0" y="60.0" width="152" height="104" rx="7" fill="#F2EBFA" stroke="#7B2CD9" stroke-width="1.6"/><text x="266" y="102.8" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">VLAN20</text><text x="266" y="115.8" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">Host C / Host D</text><text x="266" y="128.8" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">Different domain</text><path d="M94 164 L94 203 L180 203 L180 233" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,233.0 183.5,226.0 176.5,226.0" fill="#7B2CD9"/><path d="M266 164 L266 203 L180 203" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,203.0 187.0,206.5 187.0,199.5" fill="#7B2CD9"/><rect x="18" y="233" width="324" height="71" rx="8" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="260.2" font-size="12" text-anchor="middle" fill="#B66A00" font-weight="bold">Trunk: selected VLANs10 and20</text><text x="180" y="281.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Tagging does not route or encrypt</text><rect x="18" y="342" width="324" height="70" rx="8" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="369.2" font-size="12" text-anchor="middle" fill="#2E7D32" font-weight="bold">Cross-VLAN communication</text><text x="180" y="390.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Needs appropriate L3 path and policy</text><text x="180" y="458.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Membership model / tag bytes are not switch proof.</text><text x="180" y="475.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Packet Tracer configuration remains guided only.</text></svg>