<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 651" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="651" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Validation is more than one signature</text><rect x="18" y="72" width="324" height="60" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="99.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">1. Trusted anchor and issuer path</text><text x="180" y="120.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Do not trust an arbitrary downloaded root</text><path d="M180 132 L180 155" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,155.0 183.5,148.0 176.5,148.0" fill="#7B2CD9"/><rect x="18" y="155" width="324" height="60" rx="8" fill="#F2EBFA" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="182.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">2. Signatures and CA constraints</text><text x="180" y="203.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Include applicable critical extensions</text><path d="M180 215 L180 238" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,238.0 183.5,231.0 176.5,231.0" fill="#7B2CD9"/><rect x="18" y="238" width="324" height="60" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="265.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">3. Validity interval</text><text x="180" y="286.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Use the proper evaluation time</text><path d="M180 298 L180 321" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,321.0 183.5,314.0 176.5,314.0" fill="#7B2CD9"/><rect x="18" y="321" width="324" height="60" rx="8" fill="#F2EBFA" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="348.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">4. Intended identity and purpose</text><text x="180" y="369.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">SAN hostname, key usage and EKU</text><path d="M180 381 L180 404" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,404.0 183.5,397.0 176.5,397.0" fill="#7B2CD9"/><rect x="18" y="404" width="324" height="60" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="431.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">5. Required status policy</text><text x="180" y="452.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Use appropriate trusted/fresh status data</text><path d="M180 464 L180 487" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,487.0 183.5,480.0 176.5,480.0" fill="#7B2CD9"/><rect x="18" y="487" width="324" height="60" rx="8" fill="#F2EBFA" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="514.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">6. Application/protocol checks</text><text x="180" y="535.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Offline validation is not a TLS handshake</text><text x="180" y="609.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Do not bypass an error to force acceptance.</text></svg>