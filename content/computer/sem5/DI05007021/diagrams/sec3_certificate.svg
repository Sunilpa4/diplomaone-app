<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 581" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="581" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Certificate: signed PUBLIC-key binding</text><rect x="18" y="66" width="324" height="61" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="93.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">Subject / relevant identity</text><text x="180" y="114.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Example SAN: portal.diploma.test</text><rect x="18" y="141" width="324" height="61" rx="8" fill="#F2EBFA" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="168.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Subject public-key information</text><text x="180" y="189.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Algorithm and public key, NOT private key</text><rect x="18" y="216" width="324" height="61" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="243.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">Issuer / serial</text><text x="180" y="264.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Who issued it; issuer-scoped identifier</text><rect x="18" y="291" width="324" height="61" rx="8" fill="#F2EBFA" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="318.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Validity interval</text><text x="180" y="339.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">notBefore and notAfter</text><rect x="18" y="366" width="324" height="61" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="393.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">Constraints / usage / EKU</text><text x="180" y="414.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">CA status and intended operations</text><rect x="18" y="441" width="324" height="61" rx="8" fill="#F2EBFA" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="468.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Issuer signature</text><text x="180" y="489.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Verify under the appropriate issuer key</text><text x="180" y="550.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Reading fields alone is not full validation.</text></svg>