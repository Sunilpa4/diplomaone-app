<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 520" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="520" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">A valid identity is not every permission</text><rect x="18.0" y="65.0" width="324" height="66" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="95.2" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">AUTHENTICATION</text><text x="180" y="109.2" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">Verify the claimed identity</text><path d="M180 131 L180 188" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,188.0 183.5,181.0 176.5,181.0" fill="#7B2CD9"/><rect x="44" y="145" width="272" height="27" fill="white"/><text x="180" y="163.6" font-size="10.2" text-anchor="middle" fill="#555" font-weight="normal">Continue only after identity verification</text><rect x="18.0" y="188.0" width="324" height="68" rx="7" fill="#F2EBFA" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="219.3" font-size="11.3" text-anchor="middle" fill="#222" font-weight="normal">AUTHORIZATION</text><text x="180" y="232.6" font-size="11.3" text-anchor="middle" fill="#222" font-weight="normal">Check this subject, operation and resource</text><path d="M180 256 L180 291" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,291.0 183.5,284.0 176.5,284.0" fill="#7B2CD9"/><polygon points="180,291.0 246.0,322 180,353.0 114.0,322" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.8"/><text x="180" y="326.2" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">Allowed?</text><path d="M114 322 L90 322 L90 384" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="90.0,384.0 93.5,377.0 86.5,377.0" fill="#2E7D32"/><text x="82" y="353.7" font-size="10.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">Yes</text><path d="M246 322 L270 322 L270 384" fill="none" stroke="#BD2543" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="270.0,384.0 273.5,377.0 266.5,377.0" fill="#BD2543"/><text x="283" y="353.7" font-size="10.5" text-anchor="middle" fill="#C62828" font-weight="bold">No</text><rect x="18.0" y="384.0" width="144" height="54" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="90" y="415.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">Enforce: allow</text><rect x="198.0" y="384.0" width="144" height="54" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="270" y="415.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">Enforce: deny</text><text x="180" y="476.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Failed identity verification is rejected earlier.</text><text x="180" y="493.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Least privilege limits the allowed operations.</text></svg>