<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 485" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="485" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Policy model: first match, then default</text><rect x="18" y="72" width="324" height="65" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="99.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">Packet/flow attributes</text><text x="180" y="120.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Addresses, protocol, ports and direction</text><path d="M180 137 L180 175" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,175.0 183.5,168.0 176.5,168.0" fill="#7B2CD9"/><rect x="18" y="175" width="324" height="65" rx="8" fill="#F2EBFA" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="202.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Evaluate ordered rules</text><text x="180" y="223.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">First matching action in THIS model</text><path d="M180 240 L180 274 L90 274 L90 314" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="90.0,314.0 93.5,307.0 86.5,307.0" fill="#2E7D32"/><path d="M180 274 L270 274 L270 314" fill="none" stroke="#BD2543" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="270.0,314.0 273.5,307.0 266.5,307.0" fill="#BD2543"/><rect x="18.0" y="314.0" width="144" height="72" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="90" y="347.3" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">Matching allow:</text><text x="90" y="360.8" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">permitted</text><rect x="198.0" y="314.0" width="144" height="72" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="270" y="347.3" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">Deny / no match:</text><text x="270" y="360.8" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">rejected</text><text x="180" y="437.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">A broad earlier allow can shadow a later deny.</text><text x="180" y="454.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">No kernel or router rules are configured.</text></svg>