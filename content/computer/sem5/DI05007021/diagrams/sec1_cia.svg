<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 404" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="404" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">CIA: three core security goals</text><text x="180" y="51.7" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal">Example asset: a college result portal</text><rect x="18" y="76" width="324" height="70" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="103.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">CONFIDENTIALITY</text><text x="180" y="124.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Authorized access and disclosure</text><rect x="18" y="164" width="324" height="70" rx="8" fill="#F2EBFA" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="191.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">INTEGRITY</text><text x="180" y="212.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">No improper change or destruction</text><rect x="18" y="252" width="324" height="70" rx="8" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="279.2" font-size="12" text-anchor="middle" fill="#2E7D32" font-weight="bold">AVAILABILITY</text><text x="180" y="300.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Timely, reliable access and use</text><text x="180" y="362.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">One event can harm more than one goal.</text><text x="180" y="379.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">No single mechanism guarantees all three.</text></svg>