<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 456" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="456" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">LSB illustration: synthetic RGB bytes</text><rect x="18" y="64" width="324" height="68" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="91.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">Carrier byte: 120</text><text x="180" y="112.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">01111000 (last bit 0)</text><path d="M180 132 L180 167" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,167.0 183.5,160.0 176.5,160.0" fill="#7B2CD9"/><rect x="18" y="167" width="324" height="68" rx="8" fill="#F2EBFA" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="194.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Embed the teaching bit 1</text><text x="180" y="215.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">01111001 -&gt; 121 (change of 1)</text><rect x="18" y="268" width="324" height="71" rx="8" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="295.2" font-size="12" text-anchor="middle" fill="#2E7D32" font-weight="bold">8x8 RGB -&gt; 192 channel bytes</text><text x="180" y="316.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Header 16 bits + GTU 24 bits = 40 bits</text><text x="180" y="390.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Actual extraction recovers the public text GTU.</text><text x="180" y="407.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Raw byte fixture, not a PNG/JPEG editor.</text><text x="180" y="424.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Not encryption, authentication or invisibility proof.</text></svg>