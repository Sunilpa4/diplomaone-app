<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 510" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="510" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Pervasive security mechanisms (X.800)</text><rect x="18" y="62" width="324" height="64" rx="8" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="89.2" font-size="12" text-anchor="middle" fill="#2E7D32" font-weight="bold">Trusted functionality</text><text x="180" y="110.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Trustworthy security-critical functions</text><rect x="18" y="140" width="324" height="64" rx="8" fill="#F2EBFA" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="167.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Security labels</text><text x="180" y="188.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Policy-interpreted security attributes</text><rect x="18" y="218" width="324" height="64" rx="8" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="245.2" font-size="12" text-anchor="middle" fill="#2E7D32" font-weight="bold">Event detection</text><text x="180" y="266.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Recognize security-relevant events</text><rect x="18" y="296" width="324" height="64" rx="8" fill="#F2EBFA" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="323.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Security audit trail</text><text x="180" y="344.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Protected records for examination</text><rect x="18" y="374" width="324" height="64" rx="8" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="401.2" font-size="12" text-anchor="middle" fill="#2E7D32" font-weight="bold">Security recovery</text><text x="180" y="422.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Restore an acceptable secure state</text><text x="180" y="464.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Support is not confined to one particular service.</text><text x="180" y="481.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Labels and editable logs alone do not enforce security.</text></svg>