<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 510" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="510" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Vigenere: add repeated-key shifts</text><text x="180" y="51.7" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal">A=0, B=1, ..., Z=25</text><rect x="18" y="76" width="324" height="76" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="103.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">Plaintext</text><text x="180" y="124.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal"></text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="132.2" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">A T T A C K A T D A W N</text><rect x="18" y="176" width="324" height="76" rx="8" fill="#F2EBFA" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="203.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Repeated key</text><text x="180" y="224.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal"></text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="232.2" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">L E M O N L E M O N L E</text><rect x="18" y="276" width="324" height="76" rx="8" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="303.2" font-size="12" text-anchor="middle" fill="#2E7D32" font-weight="bold">Ciphertext</text><text x="180" y="324.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal"></text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="332.2" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">L X F O P V E F R N H R</text><rect x="18.0" y="376.0" width="324" height="54" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="407.2" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">C_i = (P_i + K_i) mod26</text><text x="180" y="468.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Subtract key shifts to decrypt.</text><text x="180" y="485.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Repeating LEMON is not a one-time pad.</text></svg>