<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 513" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="513" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Logical example: explicit narrow flows</text><text x="180" y="51.7" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal">Python policy model, not a configured firewall</text><rect x="18" y="77" width="324" height="68" rx="8" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="104.2" font-size="12" text-anchor="middle" fill="#2E7D32" font-weight="bold">Outside -&gt; designated DMZ web</text><text x="180" y="125.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">TCP80 allowed in this teaching policy</text><rect x="18" y="165" width="324" height="68" rx="8" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="180" y="192.2" font-size="12" text-anchor="middle" fill="#BD2543" font-weight="bold">Outside -&gt; internal assets</text><text x="180" y="213.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Default deny</text><rect x="18" y="253" width="324" height="68" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="280.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">DMZ app -&gt; one approved DB</text><text x="180" y="301.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Only exact host/service dependency allowed</text><rect x="18" y="341" width="324" height="68" rx="8" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="180" y="368.2" font-size="12" text-anchor="middle" fill="#BD2543" font-weight="bold">DMZ app -&gt; other inside host</text><text x="180" y="389.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Denied; no blanket internal trust</text><text x="180" y="469.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">No packets are sent to the documentation addresses.</text><text x="180" y="486.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">The Packet Tracer guides use a separate lab plan.</text></svg>