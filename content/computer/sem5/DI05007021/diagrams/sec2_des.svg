<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 560" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="560" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">DES: historical 64-bit block cipher</text><text x="180" y="51.7" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal">Withdrawn: do not deploy for real protection</text><rect x="18" y="72" width="324" height="60" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="99.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">Initial permutation IP</text><text x="180" y="120.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Input block: 64 bits</text><path d="M180 132 L180 155" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,155.0 183.5,148.0 176.5,148.0" fill="#7B2CD9"/><rect x="18" y="155" width="324" height="60" rx="8" fill="#F2EBFA" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="182.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Split L0 / R0</text><text x="180" y="203.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">32 bits in each half</text><path d="M180 215 L180 238" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,238.0 183.5,231.0 176.5,231.0" fill="#7B2CD9"/><rect x="18" y="238" width="324" height="60" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="265.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">16 Feistel rounds</text><text x="180" y="286.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Sixteen 48-bit subkeys from 56 key bits</text><path d="M180 298 L180 321" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,321.0 183.5,314.0 176.5,314.0" fill="#7B2CD9"/><rect x="18" y="321" width="324" height="60" rx="8" fill="#F2EBFA" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="348.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Final swap: R16 || L16</text><text x="180" y="369.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Combine into 64 bits</text><path d="M180 381 L180 404" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,404.0 183.5,397.0 176.5,397.0" fill="#7B2CD9"/><rect x="18" y="404" width="324" height="60" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="431.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">Inverse IP</text><text x="180" y="452.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Output ciphertext: 64 bits</text><text x="180" y="519.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Decrypt by reversing the round-key order.</text></svg>