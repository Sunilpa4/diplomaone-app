<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="480" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">OTP: conditions, not just key length</text><rect x="18" y="65" width="324" height="68" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="92.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">Independent + uniformly random</text><text x="180" y="113.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Secret pad material, not a repeated phrase</text><rect x="18" y="150" width="324" height="68" rx="8" fill="#F2EBFA" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="177.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Pad at least as long as the message</text><text x="180" y="198.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Use each pad portion only once</text><rect x="18" y="235" width="324" height="68" rx="8" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="262.2" font-size="12" text-anchor="middle" fill="#2E7D32" font-weight="bold">HELLO + XMCKL -&gt; EQNVZ</text><text x="180" y="283.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Public fixed arithmetic example only</text><rect x="18.0" y="330.0" width="324" height="70" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="362.2" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">Reused XOR pad:</text><text x="180" y="376.2" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">C1 XOR C2 = P1 XOR P2</text><text x="180" y="436.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">The public sample does not prove perfect secrecy.</text><text x="180" y="453.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Ideal confidentiality still does not authenticate.</text></svg>