<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 500" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="500" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Same USB-C shape:check the function</text><rect x="150" y="74" width="61" height="26" rx="12" fill="#E9EDF2" stroke="#35465C" stroke-width="2"/><rect x="159" y="83" width="43" height="8" rx="4" fill="#62778B"/><rect x="18" y="135" width="324" height="70" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="162.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">Connector form</text><text x="180" y="183.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Not a protocol / speed / charging guarantee</text><rect x="18" y="236" width="324" height="70" rx="8" fill="#F2EBFA" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="263.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Actual implementation and cable</text><text x="180" y="284.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">USB data,video modes,PD and/or Thunderbolt</text><rect x="18" y="337" width="324" height="70" rx="8" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="364.2" font-size="12" text-anchor="middle" fill="#2E7D32" font-weight="bold">Verify model-specific documentation</text><text x="180" y="385.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Mac mini front USB3 differs from rear TB4</text><text x="180" y="455.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">No hardware probe or PD negotiation is performed.</text><text x="180" y="472.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Published rates are not measured file-transfer speed.</text></svg>