<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 661" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="661" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Categories overlap; not one size ladder</text><rect x="18" y="63" width="324" height="58" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="90.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">Microcomputer</text><text x="180" y="111.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Personal desktop/laptop context</text><rect x="18" y="134" width="324" height="58" rx="8" fill="#F2EBFA" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="161.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Minicomputer</text><text x="180" y="182.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Historical midrange/multiuser category</text><rect x="18" y="205" width="324" height="58" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="232.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">Mainframe</text><text x="180" y="253.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Enterprise transaction/reliability workloads</text><rect x="18" y="276" width="324" height="58" rx="8" fill="#F2EBFA" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="303.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Supercomputer</text><text x="180" y="324.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Suitable large-scale parallel computation</text><rect x="18" y="347" width="324" height="58" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="374.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">Workstation</text><text x="180" y="395.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Professional/technical personal-use role</text><rect x="18" y="418" width="324" height="58" rx="8" fill="#F2EBFA" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="445.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Cloud</text><text x="180" y="466.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Remote access/service/deployment model</text><rect x="18" y="489" width="324" height="58" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="516.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">Embedded</text><text x="180" y="537.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Computing integrated for a device function</text><text x="180" y="631.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">A modern miniPC is not a historical minicomputer.</text></svg>