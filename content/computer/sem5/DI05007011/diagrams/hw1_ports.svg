<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 685" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="685" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Port shapes: recognition only</text><text x="180" y="51.7" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal">Simplified schematics,not exact electrical pinouts</text><rect x="37" y="79" width="61" height="26" rx="0" fill="#E9EDF2" stroke="#35465C" stroke-width="2"/><rect x="44" y="87" width="47" height="9" fill="#62778B"/><text x="126" y="90.9" font-size="11.2" text-anchor="start" fill="#7B2CD9" font-weight="bold">USB-A</text><text x="126" y="112.4" font-size="9.7" text-anchor="start" fill="#222" font-weight="normal">Check implemented USB capabilities</text><rect x="37" y="155" width="61" height="26" rx="12" fill="#E9EDF2" stroke="#35465C" stroke-width="2"/><rect x="46" y="164" width="43" height="8" rx="4" fill="#62778B"/><text x="126" y="166.9" font-size="11.2" text-anchor="start" fill="#7B2CD9" font-weight="bold">USB-C</text><text x="126" y="188.4" font-size="9.7" text-anchor="start" fill="#222" font-weight="normal">Oval shape;features need documentation</text><path d="M37 231 L98 231 L88 257 L47 257 Z" fill="#E9EDF2" stroke="#35465C" stroke-width="2"/><text x="126" y="242.9" font-size="11.2" text-anchor="start" fill="#7B2CD9" font-weight="bold">HDMI</text><text x="126" y="264.4" font-size="9.7" text-anchor="start" fill="#222" font-weight="normal">Digital display/audio where supported</text><path d="M37 307 H98 V331 H80 V338 H55 V331 H37 Z" fill="#E9EDF2" stroke="#35465C" stroke-width="2"/><rect x="46" y="311" width="3" height="9" fill="#BB8B31"/><rect x="52" y="311" width="3" height="9" fill="#BB8B31"/><rect x="58" y="311" width="3" height="9" fill="#BB8B31"/><rect x="64" y="311" width="3" height="9" fill="#BB8B31"/><rect x="70" y="311" width="3" height="9" fill="#BB8B31"/><rect x="76" y="311" width="3" height="9" fill="#BB8B31"/><rect x="82" y="311" width="3" height="9" fill="#BB8B31"/><rect x="88" y="311" width="3" height="9" fill="#BB8B31"/><text x="126" y="318.9" font-size="11.2" text-anchor="start" fill="#7B2CD9" font-weight="bold">8P8C Ethernet / RJ45-style</text><text x="126" y="340.4" font-size="9.7" text-anchor="start" fill="#222" font-weight="normal">Not a telephone/RJ11 jack</text><circle cx="67" cy="396" r="15" fill="#E9EDF2" stroke="#35465C" stroke-width="2"/><circle cx="67" cy="396" r="6" fill="#35465C"/><text x="126" y="394.9" font-size="11.2" text-anchor="start" fill="#7B2CD9" font-weight="bold">3.5mm analog audio</text><text x="126" y="416.4" font-size="9.7" text-anchor="start" fill="#222" font-weight="normal">Headphone/mic roles vary</text><path d="M37 459 H98 L92 488 H43 Z" fill="#E9EDF2" stroke="#35465C" stroke-width="2"/><circle cx="48.0" cy="466" r="1.7" fill="#35465C"/><circle cx="57.5" cy="466" r="1.7" fill="#35465C"/><circle cx="67.0" cy="466" r="1.7" fill="#35465C"/><circle cx="76.5" cy="466" r="1.7" fill="#35465C"/><circle cx="86.0" cy="466" r="1.7" fill="#35465C"/><circle cx="48.0" cy="473" r="1.7" fill="#35465C"/><circle cx="57.5" cy="473" r="1.7" fill="#35465C"/><circle cx="67.0" cy="473" r="1.7" fill="#35465C"/><circle cx="76.5" cy="473" r="1.7" fill="#35465C"/><circle cx="86.0" cy="473" r="1.7" fill="#35465C"/><circle cx="48.0" cy="480" r="1.7" fill="#35465C"/><circle cx="57.5" cy="480" r="1.7" fill="#35465C"/><circle cx="67.0" cy="480" r="1.7" fill="#35465C"/><circle cx="76.5" cy="480" r="1.7" fill="#35465C"/><circle cx="86.0" cy="480" r="1.7" fill="#35465C"/><text x="126" y="470.9" font-size="11.2" text-anchor="start" fill="#7B2CD9" font-weight="bold">VGA (DE-15)</text><text x="126" y="492.4" font-size="9.7" text-anchor="start" fill="#222" font-weight="normal">Traditional analog video</text><rect x="37" y="535" width="61" height="26" rx="12" fill="#E9EDF2" stroke="#35465C" stroke-width="2"/><rect x="46" y="544" width="43" height="8" rx="4" fill="#62778B"/><text x="126" y="546.9" font-size="11.2" text-anchor="start" fill="#7B2CD9" font-weight="bold">Thunderbolt3/4/5 shape</text><text x="126" y="568.4" font-size="9.7" text-anchor="start" fill="#222" font-weight="normal">Same USB-C outline;check marks/manual</text><text x="180" y="641.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Older Thunderbolt1/2 used MiniDP-style connectors.</text><text x="180" y="658.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Position/appearance alone does not prove capability.</text></svg>