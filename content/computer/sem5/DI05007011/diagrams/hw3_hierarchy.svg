<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" font-family="sans-serif"><rect width="400" height="500" fill="white"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#7B2CD9"/></marker></defs><text x="200" y="27" text-anchor="middle" font-size="14" fill="#6421b0">Memory hierarchy (typical tendencies)</text><rect x="20" y="48" width="360" height="60" rx="8" fill="#f3ecfa" stroke="#7b2cd9"/><text x="200" y="72" text-anchor="middle" font-size="12">CPU registers</text><text x="200" y="90" text-anchor="middle" font-size="12">Smallest / fastest working state</text><path d="M200,108 v22" stroke="#7b2cd9" marker-end="url(#a)"/><rect x="20" y="134" width="360" height="60" rx="8" fill="#f3ecfa" stroke="#7b2cd9"/><text x="200" y="158" text-anchor="middle" font-size="12">L1 -&gt; L2 -&gt; L3 cache</text><text x="200" y="176" text-anchor="middle" font-size="12">Selected copies; locality</text><path d="M200,194 v22" stroke="#7b2cd9" marker-end="url(#a)"/><rect x="20" y="220" width="360" height="60" rx="8" fill="#f3ecfa" stroke="#7b2cd9"/><text x="200" y="244" text-anchor="middle" font-size="12">Main RAM (DRAM)</text><text x="200" y="262" text-anchor="middle" font-size="12">Active program/data workspace</text><path d="M200,280 v22" stroke="#7b2cd9" marker-end="url(#a)"/><rect x="20" y="306" width="360" height="60" rx="8" fill="#f3ecfa" stroke="#7b2cd9"/><text x="200" y="330" text-anchor="middle" font-size="12">SSD / HDD</text><text x="200" y="348" text-anchor="middle" font-size="12">Persistent bulk storage</text><path d="M200,366 v22" stroke="#7b2cd9" marker-end="url(#a)"/><rect x="20" y="392" width="360" height="60" rx="8" fill="#f3ecfa" stroke="#7b2cd9"/><text x="200" y="416" text-anchor="middle" font-size="12">Going down: capacity often increases</text><text x="200" y="434" text-anchor="middle" font-size="12">Latency and cost trade-offs vary</text></svg>