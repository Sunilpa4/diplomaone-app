<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" font-family="sans-serif"><rect width="400" height="500" fill="white"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#7B2CD9"/></marker></defs><text x="200" y="27" text-anchor="middle" font-size="14" fill="#6421b0">Supervised assembly checklist</text><rect x="20" y="48" width="360" height="60" rx="8" fill="#f3ecfa" stroke="#7b2cd9"/><text x="200" y="72" text-anchor="middle" font-size="12">Manuals / compatibility / ESD</text><text x="200" y="90" text-anchor="middle" font-size="12">Data and authorisation first</text><path d="M200,108 v22" stroke="#7b2cd9" marker-end="url(#a)"/><rect x="20" y="134" width="360" height="60" rx="8" fill="#f3ecfa" stroke="#7b2cd9"/><text x="200" y="158" text-anchor="middle" font-size="12">Correct standoffs / CPU / RAM / cooler</text><text x="200" y="176" text-anchor="middle" font-size="12">Exact installation order varies</text><path d="M200,194 v22" stroke="#7b2cd9" marker-end="url(#a)"/><rect x="20" y="220" width="360" height="60" rx="8" fill="#f3ecfa" stroke="#7b2cd9"/><text x="200" y="244" text-anchor="middle" font-size="12">Board / storage / cards / cables</text><text x="200" y="262" text-anchor="middle" font-size="12">No forced or mismatched connectors</text><path d="M200,280 v22" stroke="#7b2cd9" marker-end="url(#a)"/><rect x="20" y="306" width="360" height="60" rx="8" fill="#f3ecfa" stroke="#7b2cd9"/><text x="200" y="330" text-anchor="middle" font-size="12">Final inspection -&gt; controlled first start</text><text x="200" y="348" text-anchor="middle" font-size="12">POST, cooling and device detection</text><path d="M200,366 v22" stroke="#7b2cd9" marker-end="url(#a)"/><rect x="20" y="392" width="360" height="60" rx="8" fill="#f3ecfa" stroke="#7b2cd9"/><text x="200" y="416" text-anchor="middle" font-size="12">Verify real workload / document</text><text x="200" y="434" text-anchor="middle" font-size="12">No fabricated practical evidence</text></svg>