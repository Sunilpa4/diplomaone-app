<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 460" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="460" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Physical carrier is not its program</text><rect x="18" y="76" width="324" height="75" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="103.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">HARDWARE</text><text x="180" y="124.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Physical chip / board / device</text><rect x="18" y="181" width="324" height="75" rx="8" fill="#F2EBFA" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="208.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">FIRMWARE</text><text x="180" y="229.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Low-level software in suitable storage</text><rect x="18" y="286" width="324" height="75" rx="8" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="313.2" font-size="12" text-anchor="middle" fill="#2E7D32" font-weight="bold">SOFTWARE</text><text x="180" y="334.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">OS / drivers / applications and data</text><text x="180" y="414.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">The flash chip is hardware;its contents are code.</text><text x="180" y="431.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Firmware can be updateable;no flashing is done.</text></svg>