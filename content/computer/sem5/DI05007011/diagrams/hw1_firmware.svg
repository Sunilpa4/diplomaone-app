<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 492" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="492" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Startup interface is not settings storage</text><rect x="18" y="68" width="324" height="60" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="95.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">Platform firmware initialization</text><text x="180" y="116.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Applicable hardware / platform state</text><path d="M180 128 L180 151" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,151.0 183.5,144.0 176.5,144.0" fill="#7B2CD9"/><rect x="18" y="151" width="324" height="60" rx="8" fill="#F2EBFA" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="178.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Legacy BIOS OR UEFI boot interfaces</text><text x="180" y="199.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Alternative paths,not two required stages</text><path d="M180 211 L180 234" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,234.0 183.5,227.0 176.5,227.0" fill="#7B2CD9"/><rect x="18" y="234" width="324" height="60" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="261.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">OS loader and operating system</text><text x="180" y="282.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Drivers/apps then use supported hardware</text><rect x="18" y="330" width="324" height="70" rx="8" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="357.2" font-size="12" text-anchor="middle" fill="#B66A00" font-weight="bold">SEPARATE: CMOS / RTC / NVRAM</text><text x="180" y="378.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Settings/time context,not an after-OS boot step</text><text x="180" y="448.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">RTC cell is not the laptop operating battery.</text><text x="180" y="465.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">No BIOS,CMOS,TPM or security-setting changes.</text></svg>