<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="340" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Dynamic Method Dispatch</text><rect x="10.0" y="68.0" width="100" height="40" rx="7" fill="#FFF6D6" stroke="#E07B00" stroke-width="1.6"/><text x="60" y="91.3" font-size="9.5" text-anchor="middle" fill="#222" font-weight="normal">Shape sh;</text><text x="60" y="126.9" font-size="8.2" text-anchor="middle" fill="#666" font-weight="normal">parent reference</text><rect x="202.0" y="51.0" width="96" height="30" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.6"/><text x="250" y="69.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">new Circle()</text><rect x="202.0" y="113.0" width="96" height="30" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="250" y="131.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">new Square()</text><path d="M112 82 L200 81" fill="none" stroke="#2E7D32" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="200,81 190,76 190,86" fill="#2E7D32"/><path d="M112 108 L200 143" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="200,143 190,140 192,150" fill="#1565C0"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="189.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">Shape sh;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="204.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">sh = new Circle();      sh.area();</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="219.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">   -&gt; Circle.area()</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="234.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal"></text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="249.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">sh = new Square();      sh.area();</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="264.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">   -&gt; Square.area()</text><rect x="12" y="290" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="308.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">Which area() runs depends on the OBJECT</text><text x="20" y="323.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">behind the reference - chosen at run time.</text><text x="20" y="338.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">This is run-time polymorphism.</text></svg>