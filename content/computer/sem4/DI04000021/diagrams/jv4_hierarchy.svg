<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 380" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="380" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Exception Hierarchy (simplified)</text><rect x="140" y="46" width="80" height="22" rx="6" fill="#E0F2F1" stroke="#666" stroke-width="1.1"/><text x="180.0" y="63.0" font-size="8.6" text-anchor="middle" fill="#666" font-weight="bold">Throwable</text><rect x="30" y="86" width="60" height="22" rx="6" fill="#FDECEC" stroke="#C62828" stroke-width="1.1"/><text x="60.0" y="103.0" font-size="8.6" text-anchor="middle" fill="#C62828" font-weight="bold">Error</text><rect x="224" y="86" width="106" height="22" rx="6" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="277.0" y="103.0" font-size="8.6" text-anchor="middle" fill="#1565C0" font-weight="bold">Exception</text><path d="M60 79 L60 82" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="60,78 56,86 64,86" fill="#666"/><path d="M277 79 L277 82" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="277,78 273,86 281,86" fill="#666"/><rect x="158" y="126" width="172" height="22" rx="6" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.1"/><text x="244.0" y="143.0" font-size="8.6" text-anchor="middle" fill="#E07B00" font-weight="bold">RuntimeException</text><path d="M244 108 L244 122" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="244,118 240,126 248,126" fill="#666"/><text x="60" y="78.7" font-size="7.6" text-anchor="middle" fill="#C62828" font-weight="normal">serious - not caught</text><rect x="158" y="158" width="172" height="20" rx="5" fill="#FFF6D6" stroke="#E07B00" stroke-width="1"/><text x="244" y="174.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="normal">ArithmeticException</text><rect x="158" y="182" width="172" height="20" rx="5" fill="#FFF6D6" stroke="#E07B00" stroke-width="1"/><text x="244" y="198.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="normal">NullPointerException</text><rect x="158" y="206" width="172" height="20" rx="5" fill="#FFF6D6" stroke="#E07B00" stroke-width="1"/><text x="244" y="222.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="normal">ArrayIndexOutOfBounds</text><rect x="158" y="230" width="172" height="20" rx="5" fill="#FFF6D6" stroke="#E07B00" stroke-width="1"/><text x="244" y="246.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="normal">NumberFormatException</text><rect x="158" y="254" width="172" height="20" rx="5" fill="#FFF6D6" stroke="#E07B00" stroke-width="1"/><text x="244" y="270.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="normal">IllegalArgument...</text><rect x="12" y="300" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="318.1" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">RuntimeException children = UNCHECKED:</text><text x="20" y="333.1" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">javac does not force you to catch them.</text><text x="20" y="348.1" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">Other Exception children = CHECKED:</text><text x="20" y="363.1" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">javac forces try-catch or throws.</text></svg>