<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 322" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="322" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Abstract Class vs Interface</text><rect x="8" y="40" width="80" height="22" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="48.0" y="53.9" font-size="8.4" text-anchor="middle" fill="#fff" font-weight="bold">Point</text><rect x="88" y="40" width="126" height="22" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="151.0" y="53.9" font-size="8.4" text-anchor="middle" fill="#fff" font-weight="bold">Abstract class</text><rect x="214" y="40" width="128" height="22" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="278.0" y="53.9" font-size="8.4" text-anchor="middle" fill="#fff" font-weight="bold">Interface</text><rect x="8" y="62" width="80" height="22" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="48.0" y="75.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">Methods</text><rect x="88" y="62" width="126" height="22" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="151.0" y="75.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">abstract + ready</text><rect x="214" y="62" width="128" height="22" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="278.0" y="75.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">abstract (default ok)</text><rect x="8" y="84" width="80" height="22" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="48.0" y="97.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">Fields</text><rect x="88" y="84" width="126" height="22" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="151.0" y="97.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">any</text><rect x="214" y="84" width="128" height="22" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="278.0" y="97.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">constants only</text><rect x="8" y="106" width="80" height="22" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="48.0" y="119.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">Constructor</text><rect x="88" y="106" width="126" height="22" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="151.0" y="119.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">yes</text><rect x="214" y="106" width="128" height="22" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="278.0" y="119.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">no</text><rect x="8" y="128" width="80" height="22" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="48.0" y="141.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">Extend/use</text><rect x="88" y="128" width="126" height="22" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="151.0" y="141.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">extends 1 class</text><rect x="214" y="128" width="128" height="22" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="278.0" y="141.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">implements many</text><rect x="8" y="150" width="80" height="22" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="48.0" y="163.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">new?</text><rect x="88" y="150" width="126" height="22" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="151.0" y="163.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">never</text><rect x="214" y="150" width="128" height="22" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="278.0" y="163.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">never</text><rect x="10" y="186" width="160" height="66" rx="7" fill="#FDECEC" stroke="#C62828" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="204.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">abstract class Shape {</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="217.4" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">  abstract double</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="229.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">    area();  // no body</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="242.4" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">  void displayType(){}</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="254.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">}</text><rect x="190" y="186" width="160" height="66" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="200" y="204.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">interface Drawable {</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="200" y="217.4" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">  void draw();</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="200" y="229.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">  int UNIT = 20;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="200" y="242.4" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">  // constant</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="200" y="254.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">}</text><rect x="12" y="274" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="292.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">Contract: "every shape computes area"</text><text x="20" y="307.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">- the child MUST implement it, else the</text><text x="20" y="322.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">child itself has to be abstract.</text></svg>