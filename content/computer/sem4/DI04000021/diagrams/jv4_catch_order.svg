<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 286" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="286" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Multiple catch: First Match Wins</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="47.0" font-size="8.6" text-anchor="start" fill="#222" font-weight="normal">try { ... }</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="62.0" font-size="8.6" text-anchor="start" fill="#222" font-weight="normal">} catch (NullPointerException e) {</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="77.0" font-size="8.6" text-anchor="start" fill="#222" font-weight="normal">} catch (RuntimeException e) {</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="92.0" font-size="8.6" text-anchor="start" fill="#222" font-weight="normal">} catch (Exception e) {</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="107.0" font-size="8.6" text-anchor="start" fill="#222" font-weight="normal">}</text><path d="M222 59 L244 59" fill="none" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><polygon points="244,59 238,56 238,62" fill="#666"/><text x="250" y="64.9" font-size="8.2" text-anchor="middle" fill="#2E7D32" font-weight="normal">is it a NPE? -&gt; yes, RUN</text><path d="M222 74 L244 74" fill="none" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><polygon points="244,74 238,71 238,77" fill="#666"/><text x="250" y="79.9" font-size="8.2" text-anchor="middle" fill="#E07B00" font-weight="normal">else: RuntimeException?</text><path d="M222 89 L244 89" fill="none" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><polygon points="244,89 238,86 238,92" fill="#666"/><text x="250" y="94.9" font-size="8.2" text-anchor="middle" fill="#666" font-weight="normal">else: any Exception</text><text x="180" y="125.2" font-size="9.0" text-anchor="middle" fill="#7B2CD9" font-weight="bold">matching walk is TOP to BOTTOM</text><rect x="12" y="134" width="336" height="66" rx="7" fill="#FDECEC" stroke="#C62828" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="154.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">} catch (Exception e) {  // too early!</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="168.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">} catch (NullPointerException e) {</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="182.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">  // javac ERROR: already caught</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="196.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">}</text><rect x="12" y="220" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="238.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">A parent catch placed first swallows all;</text><text x="20" y="253.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">javac rejects the unreachable children.</text><text x="20" y="268.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">Order: most specific ... most general.</text></svg>