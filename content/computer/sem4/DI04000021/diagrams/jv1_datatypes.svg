<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 282" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="282" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Primitive Data Types of Java (8)</text><rect x="10" y="40" width="70" height="21" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="45.0" y="53.5" font-size="8.6" text-anchor="middle" fill="#fff" font-weight="bold">Type</text><rect x="80" y="40" width="52" height="21" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="106.0" y="53.5" font-size="8.6" text-anchor="middle" fill="#fff" font-weight="bold">Size</text><rect x="132" y="40" width="222" height="21" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="243.0" y="53.5" font-size="8.6" text-anchor="middle" fill="#fff" font-weight="bold">Example</text><rect x="10" y="61" width="70" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="45.0" y="74.5" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">byte</text><rect x="80" y="61" width="52" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="106.0" y="74.5" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">1 B</text><rect x="132" y="61" width="222" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="243.0" y="74.5" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">byte r = 7;</text><rect x="10" y="82" width="70" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="45.0" y="95.5" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">short</text><rect x="80" y="82" width="52" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="106.0" y="95.5" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">2 B</text><rect x="132" y="82" width="222" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="243.0" y="95.5" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">short s = 400;</text><rect x="10" y="103" width="70" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="45.0" y="116.5" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">int</text><rect x="80" y="103" width="52" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="106.0" y="116.5" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">4 B</text><rect x="132" y="103" width="222" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="243.0" y="116.5" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">int m = 452;</text><rect x="10" y="124" width="70" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="45.0" y="137.5" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">long</text><rect x="80" y="124" width="52" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="106.0" y="137.5" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">8 B</text><rect x="132" y="124" width="222" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="243.0" y="137.5" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">long p = 9876543210L;</text><rect x="10" y="145" width="70" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="45.0" y="158.5" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">float</text><rect x="80" y="145" width="52" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="106.0" y="158.5" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">4 B</text><rect x="132" y="145" width="222" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="243.0" y="158.5" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">float per = 78.5f;</text><rect x="10" y="166" width="70" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="45.0" y="179.5" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">double</text><rect x="80" y="166" width="52" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="106.0" y="179.5" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">8 B</text><rect x="132" y="166" width="222" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="243.0" y="179.5" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">double cg = 8.25;</text><rect x="10" y="187" width="70" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="45.0" y="200.5" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">char</text><rect x="80" y="187" width="52" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="106.0" y="200.5" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">2 B</text><rect x="132" y="187" width="222" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="243.0" y="200.5" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">char c = 'A';</text><rect x="10" y="208" width="70" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="45.0" y="221.5" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">boolean</text><rect x="80" y="208" width="52" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="106.0" y="221.5" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">~1 bit</text><rect x="132" y="208" width="222" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="243.0" y="221.5" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">boolean ok = true;</text><rect x="12" y="224" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="242.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">Suffixes: 9876543210L for long, 78.5f for float.</text><text x="20" y="257.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">A plain decimal like 8.25 is double.</text><text x="20" y="272.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">Strings are NOT primitive: String is a class.</text></svg>