<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 414" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="414" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Control Flow: Selection and Loops</text><text x="180" y="59.7" font-size="10.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Loops</text><rect x="16" y="66" width="86" height="21" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="59.0" y="79.5" font-size="8.6" text-anchor="middle" fill="#fff" font-weight="bold">Loop</text><rect x="102" y="66" width="100" height="21" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="152.0" y="79.5" font-size="8.6" text-anchor="middle" fill="#fff" font-weight="bold">Test</text><rect x="202" y="66" width="148" height="21" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="276.0" y="79.5" font-size="8.6" text-anchor="middle" fill="#fff" font-weight="bold">Use when</text><rect x="16" y="87" width="86" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="59.0" y="100.5" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">for</text><rect x="102" y="87" width="100" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="152.0" y="100.5" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">before body</text><rect x="202" y="87" width="148" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="276.0" y="100.5" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">count is known</text><rect x="16" y="108" width="86" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="59.0" y="121.5" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">while</text><rect x="102" y="108" width="100" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="152.0" y="121.5" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">before body</text><rect x="202" y="108" width="148" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="276.0" y="121.5" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">count unknown</text><rect x="16" y="129" width="86" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="59.0" y="142.5" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">do-while</text><rect x="102" y="129" width="100" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="152.0" y="142.5" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">after body</text><rect x="202" y="129" width="148" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="276.0" y="142.5" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">run at least once</text><text x="180" y="179.7" font-size="10.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Selection statements</text><rect x="16" y="186" width="140" height="21" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="86.0" y="199.5" font-size="8.6" text-anchor="middle" fill="#fff" font-weight="bold">Selection</text><rect x="156" y="186" width="194" height="21" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="253.0" y="199.5" font-size="8.6" text-anchor="middle" fill="#fff" font-weight="bold">Form</text><rect x="16" y="207" width="140" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="86.0" y="220.5" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">if</text><rect x="156" y="207" width="194" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="253.0" y="220.5" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">one condition, one block</text><rect x="16" y="228" width="140" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="86.0" y="241.5" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">if-else</text><rect x="156" y="228" width="194" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="253.0" y="241.5" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">two paths</text><rect x="16" y="249" width="140" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="86.0" y="262.5" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">if-else-if ladder</text><rect x="156" y="249" width="194" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="253.0" y="262.5" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">many ranges, first true</text><rect x="16" y="270" width="140" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="86.0" y="283.5" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">switch-case</text><rect x="156" y="270" width="194" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="253.0" y="283.5" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">many equal values + break</text><text x="180" y="311.7" font-size="10.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Jump statements</text><rect x="20" y="318" width="150" height="44" rx="7" fill="#FDECEC" stroke="#C62828" stroke-width="1.2"/><text x="95" y="339.5" font-size="10" text-anchor="middle" fill="#C62828" font-weight="bold">break</text><text x="95" y="354.8" font-size="8" text-anchor="middle" fill="#666" font-weight="normal">leave loop/switch now</text><rect x="190" y="318" width="150" height="44" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><text x="265" y="339.5" font-size="10" text-anchor="middle" fill="#1565C0" font-weight="bold">continue</text><text x="265" y="354.8" font-size="8" text-anchor="middle" fill="#666" font-weight="normal">skip to next round</text><rect x="12" y="370" width="336" height="40" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="388.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">break without label exits only the</text><text x="20" y="403.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">innermost loop or switch.</text></svg>