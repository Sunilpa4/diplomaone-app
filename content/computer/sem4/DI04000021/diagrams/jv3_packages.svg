<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 336" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="336" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Packages and import</text><rect x="10" y="44" width="150" height="130" rx="7" fill="#FFF6D6" stroke="#E07B00" stroke-width="1.3"/><text x="85" y="65.2" font-size="9.2" text-anchor="middle" fill="#E07B00" font-weight="bold">folder = package</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="80.8" font-size="8" text-anchor="start" fill="#222" font-weight="normal">college/</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="94.8" font-size="8" text-anchor="start" fill="#222" font-weight="normal">  Student.java</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="108.8" font-size="8" text-anchor="start" fill="#222" font-weight="normal">    package college;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="122.8" font-size="8" text-anchor="start" fill="#222" font-weight="normal">  Main.java</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="136.8" font-size="8" text-anchor="start" fill="#222" font-weight="normal">    import college.Student;</text><rect x="190" y="44" width="160" height="130" rx="7" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.3"/><text x="270" y="65.2" font-size="9.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">built-in packages</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="204" y="80.8" font-size="8" text-anchor="start" fill="#222" font-weight="normal">java.lang (auto)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="204" y="94.8" font-size="8" text-anchor="start" fill="#222" font-weight="normal">  String, Math</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="204" y="108.8" font-size="8" text-anchor="start" fill="#222" font-weight="normal">java.util</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="204" y="122.8" font-size="8" text-anchor="start" fill="#222" font-weight="normal">  Scanner, ArrayList</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="204" y="136.8" font-size="8" text-anchor="start" fill="#222" font-weight="normal">java.io, java.time</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="206.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">import java.util.Date;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="221.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">import java.util.*;  // wildcard</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="236.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">// full name works without import:</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="251.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">java.util.Date d = new java.util.Date();</text><rect x="12" y="288" width="336" height="40" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="306.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">Cross-package use needs public members</text><text x="20" y="321.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">(or protected for subclasses.)</text></svg>