<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 284" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="284" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Control Flow: try / catch / finally</text><text x="80" y="57.3" font-size="9.4" text-anchor="middle" fill="#2E7D32" font-weight="bold">no exception</text><text x="280" y="57.3" font-size="9.4" text-anchor="middle" fill="#C62828" font-weight="bold">exception thrown</text><rect x="20" y="66" width="120" height="22" rx="6" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.1"/><text x="80" y="83.0" font-size="8.6" text-anchor="middle" fill="#2E7D32" font-weight="bold">try block</text><rect x="20" y="100" width="120" height="22" rx="6" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.1"/><text x="80" y="117.0" font-size="8.6" text-anchor="middle" fill="#2E7D32" font-weight="bold">skip catch</text><rect x="20" y="134" width="120" height="22" rx="6" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.1"/><text x="80" y="151.0" font-size="8.6" text-anchor="middle" fill="#2E7D32" font-weight="bold">finally</text><rect x="20" y="168" width="120" height="22" rx="6" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.1"/><text x="80" y="185.0" font-size="8.6" text-anchor="middle" fill="#2E7D32" font-weight="bold">rest of main</text><rect x="220" y="66" width="120" height="22" rx="6" fill="#FDECEC" stroke="#C62828" stroke-width="1.1"/><text x="280" y="83.0" font-size="8.6" text-anchor="middle" fill="#C62828" font-weight="bold">try (stops mid-way)</text><rect x="220" y="100" width="120" height="22" rx="6" fill="#FDECEC" stroke="#C62828" stroke-width="1.1"/><text x="280" y="117.0" font-size="8.6" text-anchor="middle" fill="#C62828" font-weight="bold">catch block</text><rect x="220" y="134" width="120" height="22" rx="6" fill="#FDECEC" stroke="#C62828" stroke-width="1.1"/><text x="280" y="151.0" font-size="8.6" text-anchor="middle" fill="#C62828" font-weight="bold">finally</text><rect x="220" y="168" width="120" height="22" rx="6" fill="#FDECEC" stroke="#C62828" stroke-width="1.1"/><text x="280" y="185.0" font-size="8.6" text-anchor="middle" fill="#C62828" font-weight="bold">rest of main</text><path d="M80 88 L80 100" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="80,96 77,104 83,104" fill="#666"/><path d="M80 122 L80 134" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="80,130 77,138 83,138" fill="#666"/><path d="M80 156 L80 168" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="80,164 77,172 83,172" fill="#666"/><path d="M280 88 L280 100" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="280,96 277,104 283,104" fill="#666"/><path d="M280 122 L280 134" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="280,130 277,138 283,138" fill="#666"/><path d="M280 156 L280 168" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="280,164 277,172 283,172" fill="#666"/><rect x="12" y="214" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="232.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">finally runs on BOTH paths - it is the</text><text x="20" y="247.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">guaranteed cleanup point (also runs</text><text x="20" y="262.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">even if nothing catches the error).</text></svg>