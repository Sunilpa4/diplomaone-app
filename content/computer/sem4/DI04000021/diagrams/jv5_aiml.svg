<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 344" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="344" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">AI, ML, DL - How They Nest</text><rect x="20" y="48" width="320" height="110" rx="9" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.4"/><text x="180" y="69.3" font-size="9.4" text-anchor="middle" fill="#1565C0" font-weight="bold">ARTIFICIAL INTELLIGENCE</text><text x="180" y="82.7" font-size="7.6" text-anchor="middle" fill="#666" font-weight="normal">machines doing tasks that need human-like smarts</text><rect x="44" y="90" width="272" height="60" rx="8" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.4"/><text x="180" y="109.2" font-size="9.2" text-anchor="middle" fill="#2E7D32" font-weight="bold">MACHINE LEARNING</text><text x="180" y="122.6" font-size="7.4" text-anchor="middle" fill="#666" font-weight="normal">rules learned from DATA, not hand-written ifs</text><rect x="100" y="126" width="160" height="26" rx="7" fill="#FFF6D6" stroke="#E07B00" stroke-width="1.3"/><text x="180" y="145.9" font-size="8.2" text-anchor="middle" fill="#E07B00" font-weight="bold">DEEP LEARNING (neural nets)</text><rect x="12" y="172" width="110" height="20" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="67.0" y="184.9" font-size="8.3" text-anchor="middle" fill="#fff" font-weight="bold">style</text><rect x="122" y="172" width="226" height="20" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="235.0" y="184.9" font-size="8.3" text-anchor="middle" fill="#fff" font-weight="bold">example in this subject</text><rect x="12" y="192" width="110" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="67.0" y="204.9" font-size="8.3" text-anchor="middle" fill="#222" font-weight="normal">classic AI</text><rect x="122" y="192" width="226" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="235.0" y="204.9" font-size="8.3" text-anchor="middle" fill="#222" font-weight="normal">rules: if mark &lt; 33 -&gt; fail</text><rect x="12" y="212" width="110" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="67.0" y="224.9" font-size="8.3" text-anchor="middle" fill="#222" font-weight="normal">ML</text><rect x="122" y="212" width="226" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="235.0" y="224.9" font-size="8.3" text-anchor="middle" fill="#222" font-weight="normal">k-NN: learn from 5 students (jv5_13)</text><rect x="12" y="232" width="110" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="67.0" y="244.9" font-size="8.3" text-anchor="middle" fill="#222" font-weight="normal">result use</text><rect x="122" y="232" width="226" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="235.0" y="244.9" font-size="8.3" text-anchor="middle" fill="#222" font-weight="normal">predict pass/fail from new data</text><rect x="12" y="266" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="284.1" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">Definition for the exam: AI = goal</text><text x="20" y="299.1" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">(behave intelligently); ML = the approach</text><text x="20" y="314.1" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">(learn the behaviour from examples);</text><text x="20" y="329.1" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">DL = ML with layered neural networks.</text></svg>