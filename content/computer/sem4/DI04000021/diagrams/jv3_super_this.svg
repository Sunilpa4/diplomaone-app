<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 322" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="322" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">this vs super</text><rect x="10" y="40" width="165" height="118" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.3"/><text x="92" y="61.3" font-size="9.5" text-anchor="middle" fill="#1565C0" font-weight="bold">this - the same class</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="74.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">this.title = t;   // field</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="88.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">this(t);          // own ctor</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="102.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">return this;      // me</text><text x="92" y="148.7" font-size="7.6" text-anchor="middle" fill="#333" font-weight="normal">refers to the CURRENT object</text><rect x="185" y="40" width="165" height="118" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.3"/><text x="268" y="61.3" font-size="9.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">super - the parent</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="195" y="74.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">super("circle"); // ctor</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="195" y="88.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">super.info();    // method</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="195" y="102.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">super.name; // field</text><text x="268" y="148.7" font-size="7.6" text-anchor="middle" fill="#333" font-weight="normal">refers to the PARENT part</text><rect x="10" y="170" width="340" height="84" rx="6" fill="#fff" stroke="#999" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="189.0" font-size="8.6" text-anchor="start" fill="#222" font-weight="normal">class Circle extends Shape {</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="203.0" font-size="8.6" text-anchor="start" fill="#222" font-weight="normal">  Circle(double r) {</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="217.0" font-size="8.6" text-anchor="start" fill="#222" font-weight="normal">    super("circle");   // first!</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="231.0" font-size="8.6" text-anchor="start" fill="#222" font-weight="normal">    this.r = r;          // field</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="245.0" font-size="8.6" text-anchor="start" fill="#222" font-weight="normal">  }</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="259.0" font-size="8.6" text-anchor="start" fill="#222" font-weight="normal">}</text><rect x="12" y="272" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="290.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">Both "call constructors" go first in a</text><text x="20" y="305.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">constructor; you may use only one of</text><text x="20" y="320.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">this() or super() in each constructor.</text></svg>