<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 384" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="384" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Java Version Highlights (7 onwards)</text><path d="M28 48 L28 288" fill="none" stroke="#666" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="12" y="48" width="32" height="18" rx="5" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="28" y="63.0" font-size="8.6" text-anchor="middle" fill="#1565C0" font-weight="bold">7</text><text x="54" y="62.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">try-with-res., strings in switch, diamond, multi-catch</text><rect x="12" y="72" width="32" height="18" rx="5" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="28" y="87.0" font-size="8.6" text-anchor="middle" fill="#1565C0" font-weight="bold">8</text><text x="54" y="86.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">lambda, Stream API, java.time, default methods</text><rect x="12" y="96" width="32" height="18" rx="5" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="28" y="111.0" font-size="8.6" text-anchor="middle" fill="#1565C0" font-weight="bold">9</text><text x="54" y="110.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">modules (JPMS), jshell</text><rect x="12" y="120" width="32" height="18" rx="5" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="28" y="135.0" font-size="8.6" text-anchor="middle" fill="#1565C0" font-weight="bold">10</text><text x="54" y="134.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">var - local type inference</text><rect x="12" y="144" width="32" height="18" rx="5" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.1"/><text x="28" y="159.0" font-size="8.6" text-anchor="middle" fill="#2E7D32" font-weight="bold">11</text><text x="54" y="158.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">LTS, var in lambda, new HttpClient</text><rect x="12" y="168" width="32" height="18" rx="5" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="28" y="183.0" font-size="8.6" text-anchor="middle" fill="#1565C0" font-weight="bold">14</text><text x="54" y="182.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">switch expressions (arrow -&gt;)</text><rect x="12" y="192" width="32" height="18" rx="5" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="28" y="207.0" font-size="8.6" text-anchor="middle" fill="#1565C0" font-weight="bold">15</text><text x="54" y="206.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">text blocks  """ ... """</text><rect x="12" y="216" width="32" height="18" rx="5" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="28" y="231.0" font-size="8.6" text-anchor="middle" fill="#1565C0" font-weight="bold">16</text><text x="54" y="230.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">records, pattern-matching instanceof</text><rect x="12" y="240" width="32" height="18" rx="5" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.1"/><text x="28" y="255.0" font-size="8.6" text-anchor="middle" fill="#2E7D32" font-weight="bold">17</text><text x="54" y="254.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">LTS, sealed classes</text><rect x="12" y="264" width="32" height="18" rx="5" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.1"/><text x="28" y="279.0" font-size="8.6" text-anchor="middle" fill="#2E7D32" font-weight="bold">21</text><text x="54" y="278.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">LTS, virtual threads, pattern matching++</text><rect x="12" y="300" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="318.1" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">LTS = Long-Term Support (11, 17, 21):</text><text x="20" y="333.1" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">the versions industries standardise on.</text><text x="20" y="348.1" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">This course runs and tests Java 8+</text><text x="20" y="363.1" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">features; 14+ syntax is study-exhibit.</text></svg>