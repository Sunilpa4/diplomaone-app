<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 356" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="356" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Stream Pipeline: filter, map, collect</text><rect x="8" y="52" width="62" height="34" rx="6" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><text x="39.0" y="69.2" font-size="9.0" text-anchor="middle" fill="#1565C0" font-weight="bold">source</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="39.0" y="81.4" font-size="6.8" text-anchor="middle" fill="#222" font-weight="normal">list.stream()</text><path d="M72 69 L70 69" fill="none" stroke="#666" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="76.0,69.0 69.0,65.5 69.0,72.5" fill="#666"/><rect x="78" y="52" width="62" height="34" rx="6" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.2"/><text x="109.0" y="69.2" font-size="9.0" text-anchor="middle" fill="#E07B00" font-weight="bold">filter</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="109.0" y="81.4" font-size="6.8" text-anchor="middle" fill="#222" font-weight="normal">m &gt;= 50</text><path d="M142 69 L140 69" fill="none" stroke="#666" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="146.0,69.0 139.0,65.5 139.0,72.5" fill="#666"/><rect x="148" y="52" width="62" height="34" rx="6" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.2"/><text x="179.0" y="69.2" font-size="9.0" text-anchor="middle" fill="#E07B00" font-weight="bold">sorted</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="179.0" y="81.4" font-size="6.8" text-anchor="middle" fill="#222" font-weight="normal">ascending</text><path d="M212 69 L210 69" fill="none" stroke="#666" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="216.0,69.0 209.0,65.5 209.0,72.5" fill="#666"/><rect x="218" y="52" width="62" height="34" rx="6" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.2"/><text x="249.0" y="69.2" font-size="9.0" text-anchor="middle" fill="#E07B00" font-weight="bold">map</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="249.0" y="81.4" font-size="6.8" text-anchor="middle" fill="#222" font-weight="normal">m -&gt; text</text><path d="M282 69 L280 69" fill="none" stroke="#666" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="286.0,69.0 279.0,65.5 279.0,72.5" fill="#666"/><rect x="288" y="52" width="62" height="34" rx="6" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="319.0" y="69.2" font-size="9.0" text-anchor="middle" fill="#2E7D32" font-weight="bold">collect</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="319.0" y="81.4" font-size="6.8" text-anchor="middle" fill="#222" font-weight="normal">to a new List</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="121.0" font-size="8.6" text-anchor="middle" fill="#666" font-weight="normal">marks: 88 45 72 95 61 50</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="143.0" font-size="8.6" text-anchor="middle" fill="#E07B00" font-weight="normal">after filter: 88 72 95 61 50</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="165.0" font-size="8.6" text-anchor="middle" fill="#E07B00" font-weight="normal">after sorted: 50 61 72 88 95</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="187.0" font-size="8.6" text-anchor="middle" fill="#2E7D32" font-weight="normal">after map: pass:50 ... pass:95</text><rect x="12" y="208" width="120" height="19" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="72.0" y="220.4" font-size="8.2" text-anchor="middle" fill="#fff" font-weight="bold">kind</text><rect x="132" y="208" width="216" height="19" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="240.0" y="220.4" font-size="8.2" text-anchor="middle" fill="#fff" font-weight="bold">intermediate vs terminal</text><rect x="12" y="227" width="120" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="72.0" y="239.4" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">intermediate</text><rect x="132" y="227" width="216" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="240.0" y="239.4" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">filter, map, sorted - LAZY</text><rect x="12" y="246" width="120" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="72.0" y="258.4" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">terminal</text><rect x="132" y="246" width="216" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="240.0" y="258.4" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">forEach, count, collect - GO</text><rect x="12" y="265" width="120" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="72.0" y="277.4" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">source list</text><rect x="132" y="265" width="216" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="240.0" y="277.4" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">never mutated</text><rect x="12" y="292" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="310.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">Nothing moves until the terminal step;</text><text x="20" y="325.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">a used stream cannot be re-used -</text><text x="20" y="340.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">open a fresh .stream() instead.</text></svg>