<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="330" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">ArrayList vs HashSet</text><rect x="8" y="40" width="96" height="20" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="56.0" y="52.9" font-size="8.4" text-anchor="middle" fill="#fff" font-weight="bold">aspect</text><rect x="104" y="40" width="118" height="20" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="163.0" y="52.9" font-size="8.4" text-anchor="middle" fill="#fff" font-weight="bold">ArrayList</text><rect x="222" y="40" width="118" height="20" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="281.0" y="52.9" font-size="8.4" text-anchor="middle" fill="#fff" font-weight="bold">HashSet</text><rect x="8" y="60" width="96" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="56.0" y="72.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">interface</text><rect x="104" y="60" width="118" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="163.0" y="72.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">List</text><rect x="222" y="60" width="118" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="281.0" y="72.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">Set</text><rect x="8" y="80" width="96" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="56.0" y="92.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">duplicates</text><rect x="104" y="80" width="118" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="163.0" y="92.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">allowed</text><rect x="222" y="80" width="118" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="281.0" y="92.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">rejected</text><rect x="8" y="100" width="96" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="56.0" y="112.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">order kept?</text><rect x="104" y="100" width="118" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="163.0" y="112.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">insertion order</text><rect x="222" y="100" width="118" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="281.0" y="112.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">no guarantee</text><rect x="8" y="120" width="96" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="56.0" y="132.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">position</text><rect x="104" y="120" width="118" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="163.0" y="132.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">get(i), set(i)</text><rect x="222" y="120" width="118" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="281.0" y="132.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">no index</text><rect x="8" y="140" width="96" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="56.0" y="152.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">best for</text><rect x="104" y="140" width="118" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="163.0" y="152.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">ordered records</text><rect x="222" y="140" width="118" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="281.0" y="152.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">unique members</text><rect x="8" y="160" width="96" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="56.0" y="172.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">search</text><rect x="104" y="160" width="118" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="163.0" y="172.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">scan (slow)</text><rect x="222" y="160" width="118" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="281.0" y="172.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">hash (fast)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="215.0" font-size="8.6" text-anchor="start" fill="#222" font-weight="normal">list: [tea, tea, milk]</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="230.0" font-size="8.6" text-anchor="start" fill="#222" font-weight="normal">set:  [tea, milk]</text><rect x="12" y="262" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="280.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">Both are created with new, filled with</text><text x="20" y="295.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">add(), walked with for-each - pick by</text><text x="20" y="310.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">duplicates + order, not by syntax.</text></svg>