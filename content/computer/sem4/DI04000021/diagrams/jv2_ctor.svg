<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 412" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="412" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Constructors</text><rect x="8" y="42" width="90" height="22" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="53.0" y="55.9" font-size="8.2" text-anchor="middle" fill="#fff" font-weight="bold">Type</text><rect x="98" y="42" width="130" height="22" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="163.0" y="55.9" font-size="8.2" text-anchor="middle" fill="#fff" font-weight="bold">Called by</text><rect x="228" y="42" width="126" height="22" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="291.0" y="55.9" font-size="8.2" text-anchor="middle" fill="#fff" font-weight="bold">Purpose</text><rect x="8" y="64" width="90" height="22" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="53.0" y="77.9" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">default</text><rect x="98" y="64" width="130" height="22" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="163.0" y="77.9" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">new Book()</text><rect x="228" y="64" width="126" height="22" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="291.0" y="77.9" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">fixed initial values</text><rect x="8" y="86" width="90" height="22" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="53.0" y="99.9" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">parameterized</text><rect x="98" y="86" width="130" height="22" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="163.0" y="99.9" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">new Book("Java", 299)</text><rect x="228" y="86" width="126" height="22" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="291.0" y="99.9" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">values from caller</text><rect x="8" y="108" width="90" height="22" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="53.0" y="121.9" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">overloaded</text><rect x="98" y="108" width="130" height="22" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="163.0" y="121.9" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">any of the above</text><rect x="228" y="108" width="126" height="22" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="291.0" y="121.9" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">many ways to create</text><rect x="10" y="136" width="340" height="78" rx="6" fill="#fff" stroke="#999" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="155.2" font-size="9" text-anchor="start" fill="#222" font-weight="normal">Book() { title = "Java"; }</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="170.2" font-size="9" text-anchor="start" fill="#222" font-weight="normal">Book(String t, double p) {</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="185.2" font-size="9" text-anchor="start" fill="#222" font-weight="normal">  title = t;  price = p;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="200.2" font-size="9" text-anchor="start" fill="#222" font-weight="normal">}</text><rect x="12" y="226" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="244.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">Same name as class, no return type;</text><text x="20" y="259.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">runs automatically right after new;</text><text x="20" y="274.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">not inherited by subclasses.</text><text x="180" y="293.5" font-size="10" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Constructor vs method</text><rect x="30" y="300" width="150" height="20" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="105.0" y="313.0" font-size="8.6" text-anchor="middle" fill="#fff" font-weight="bold">Constructor</text><rect x="180" y="300" width="150" height="20" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="255.0" y="313.0" font-size="8.6" text-anchor="middle" fill="#fff" font-weight="bold">Method</text><rect x="30" y="320" width="150" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="105.0" y="333.0" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">class name</text><rect x="180" y="320" width="150" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="255.0" y="333.0" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">any name</text><rect x="30" y="340" width="150" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="105.0" y="353.0" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">no return type</text><rect x="180" y="340" width="150" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="255.0" y="353.0" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">must declare one</text><rect x="30" y="360" width="150" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="105.0" y="373.0" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">runs at new</text><rect x="180" y="360" width="150" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="255.0" y="373.0" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">runs when called</text><rect x="30" y="380" width="150" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="105.0" y="393.0" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">not inherited</text><rect x="180" y="380" width="150" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="255.0" y="393.0" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">can be inherited</text></svg>