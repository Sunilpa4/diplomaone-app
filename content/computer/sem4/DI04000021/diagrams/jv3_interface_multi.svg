<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 350" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="350" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Multiple Inheritance via Interfaces</text><rect x="10.0" y="51.0" width="100" height="30" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.6"/><text x="60" y="69.0" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">interface</text><text x="60" y="107.3" font-size="9.4" text-anchor="middle" fill="#2E7D32" font-weight="bold">Printable</text><rect x="232.0" y="51.0" width="120" height="30" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.6"/><text x="292" y="69.0" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">interface</text><text x="292" y="107.3" font-size="9.4" text-anchor="middle" fill="#2E7D32" font-weight="bold">Showable</text><rect x="120.0" y="151.0" width="120" height="34" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="171.3" font-size="9.5" text-anchor="middle" fill="#222" font-weight="normal">class Report</text><path d="M70 98 L126 168" fill="none" stroke="#2E7D32" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 3"/><path d="M282 98 L234 168" fill="none" stroke="#2E7D32" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 3"/><text x="104" y="140.9" font-size="8.2" text-anchor="middle" fill="#666" font-weight="normal">implements</text><text x="248" y="140.9" font-size="8.2" text-anchor="end" fill="#666" font-weight="normal">implements</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="213.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">class Report implements</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="228.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">    Printable, Showable {</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="243.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">  public void print() { }</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="258.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">  public void show() { }</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="273.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">}</text><rect x="12" y="300" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="318.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">No clash: interface methods carry no body</text><text x="20" y="333.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">and no state - the single child body of</text><text x="20" y="348.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">Report satisfies both contracts.</text></svg>