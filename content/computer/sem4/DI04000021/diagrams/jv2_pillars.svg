<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 398" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="398" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Four Principles of OOP</text><rect x="10" y="130" width="160" height="84" rx="8" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.4"/><text x="90" y="153.7" font-size="10.5" text-anchor="middle" fill="#1565C0" font-weight="bold">Abstraction</text><text x="90" y="169.0" font-size="8.6" text-anchor="middle" fill="#333" font-weight="normal">shows only what is</text><text x="90" y="182.0" font-size="8.6" text-anchor="middle" fill="#333" font-weight="normal">needed, hides the</text><text x="90" y="195.0" font-size="8.6" text-anchor="middle" fill="#333" font-weight="normal">working inside</text><rect x="190" y="130" width="160" height="84" rx="8" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.4"/><text x="270" y="153.7" font-size="10.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">Encapsulation</text><text x="270" y="169.0" font-size="8.6" text-anchor="middle" fill="#333" font-weight="normal">data + methods in</text><text x="270" y="182.0" font-size="8.6" text-anchor="middle" fill="#333" font-weight="normal">one safe box (private</text><text x="270" y="195.0" font-size="8.6" text-anchor="middle" fill="#333" font-weight="normal">fields)</text><rect x="10" y="230" width="160" height="84" rx="8" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.4"/><text x="90" y="253.7" font-size="10.5" text-anchor="middle" fill="#E07B00" font-weight="bold">Inheritance</text><text x="90" y="269.0" font-size="8.6" text-anchor="middle" fill="#333" font-weight="normal">a class reuses its</text><text x="90" y="282.0" font-size="8.6" text-anchor="middle" fill="#333" font-weight="normal">parent class</text><text x="90" y="295.0" font-size="8.6" text-anchor="middle" fill="#333" font-weight="normal">(extends)</text><rect x="190" y="230" width="160" height="84" rx="8" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.4"/><text x="270" y="253.7" font-size="10.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Polymorphism</text><text x="270" y="269.0" font-size="8.6" text-anchor="middle" fill="#333" font-weight="normal">same name, many</text><text x="270" y="282.0" font-size="8.6" text-anchor="middle" fill="#333" font-weight="normal">behaviours</text><text x="270" y="295.0" font-size="8.6" text-anchor="middle" fill="#333" font-weight="normal">(overloading)</text><rect x="12" y="348" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="366.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">ATM screen = abstraction; capsule = encapsulation;</text><text x="20" y="381.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">child + parent classes = inheritance;</text><text x="20" y="396.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">area() of many shapes = polymorphism.</text></svg>