<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 326" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="326" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">try-with-resources vs try-finally (Java 7)</text><text x="100" y="59.2" font-size="9.2" text-anchor="middle" fill="#C62828" font-weight="bold">the old (Unit 4) way</text><text x="268" y="59.2" font-size="9.2" text-anchor="middle" fill="#2E7D32" font-weight="bold">try-with-resources</text><rect x="10" y="64" width="156" height="118" rx="7" fill="#FDECEC" stroke="#C62828" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="18" y="82.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">Scanner sc = new</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="18" y="95.3" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">  Scanner(src);</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="18" y="107.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">try {</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="18" y="120.3" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">  use(sc);</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="18" y="132.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">} finally {</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="18" y="145.3" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">  if (sc != null)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="18" y="157.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">    sc.close();</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="18" y="170.3" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">}</text><rect x="194" y="64" width="156" height="118" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="202" y="82.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">try (Scanner sc =</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="202" y="95.3" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">  new Scanner(src)) {</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="202" y="107.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">  use(sc);</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="202" y="120.3" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">}</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="202" y="132.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">// close() happens</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="202" y="145.3" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">// automatically</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="202" y="157.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">// on every path</text><rect x="12" y="196" width="140" height="19" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="82.0" y="208.4" font-size="8.2" text-anchor="middle" fill="#fff" font-weight="bold">aspect</text><rect x="152" y="196" width="196" height="19" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="250.0" y="208.4" font-size="8.2" text-anchor="middle" fill="#fff" font-weight="bold">finally vs try-with-resources</text><rect x="12" y="215" width="140" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="82.0" y="227.4" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">close written by</text><rect x="152" y="215" width="196" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="250.0" y="227.4" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">you vs the JVM</text><rect x="12" y="234" width="140" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="82.0" y="246.4" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">exception-safe?</text><rect x="152" y="234" width="196" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="250.0" y="246.4" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">only if careful vs always</text><rect x="12" y="262" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="280.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">Works with anything implementing</text><text x="20" y="295.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">AutoCloseable (files, sockets, DB).</text><text x="20" y="310.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">Multiple resources: try (A a; B b)</text></svg>