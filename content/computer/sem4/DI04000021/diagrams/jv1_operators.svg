<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 336" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="336" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Operators in Java</text><rect x="6" y="38" width="86" height="21" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="49.0" y="51.4" font-size="8.4" text-anchor="middle" fill="#fff" font-weight="bold">Group</text><rect x="92" y="38" width="108" height="21" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="146.0" y="51.4" font-size="8.4" text-anchor="middle" fill="#fff" font-weight="bold">Symbols</text><rect x="200" y="38" width="148" height="21" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="274.0" y="51.4" font-size="8.4" text-anchor="middle" fill="#fff" font-weight="bold">Example</text><rect x="6" y="59" width="86" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="49.0" y="72.4" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">Arithmetic</text><rect x="92" y="59" width="108" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="146.0" y="72.4" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">+ - * / %</text><rect x="200" y="59" width="148" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="274.0" y="72.4" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">sum = a + b;</text><rect x="6" y="80" width="86" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="49.0" y="93.4" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">Relational</text><rect x="92" y="80" width="108" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="146.0" y="93.4" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">&lt; &gt; &lt;= &gt;= == !=</text><rect x="200" y="80" width="148" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="274.0" y="93.4" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">a &gt; b -&gt; true</text><rect x="6" y="101" width="86" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="49.0" y="114.4" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">Logical</text><rect x="92" y="101" width="108" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="146.0" y="114.4" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">&amp;&amp; || !</text><rect x="200" y="101" width="148" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="274.0" y="114.4" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">(a&gt;5) &amp;&amp; (b&lt;5)</text><rect x="6" y="122" width="86" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="49.0" y="135.4" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">Assignment</text><rect x="92" y="122" width="108" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="146.0" y="135.4" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">= += -= *= /= %=</text><rect x="200" y="122" width="148" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="274.0" y="135.4" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">sum += m;</text><rect x="6" y="143" width="86" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="49.0" y="156.4" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">Conditional</text><rect x="92" y="143" width="108" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="146.0" y="156.4" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">? :</text><rect x="200" y="143" width="148" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="274.0" y="156.4" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">max = a&gt;b ? a : b;</text><rect x="6" y="164" width="86" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="49.0" y="177.4" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">Inc / Dec</text><rect x="92" y="164" width="108" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="146.0" y="177.4" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">++ --</text><rect x="200" y="164" width="148" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="274.0" y="177.4" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">i++  ++i</text><rect x="6" y="185" width="86" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="49.0" y="198.4" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">Bitwise</text><rect x="92" y="185" width="108" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="146.0" y="198.4" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">&amp; | ^ &lt;&lt; &gt;&gt;</text><rect x="200" y="185" width="148" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="274.0" y="198.4" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">a &amp; b</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="16" y="225.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">int c = a++;  // c=10, then a=11</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="16" y="240.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">int d = ++a;  // a=12, then d=12</text><rect x="12" y="260" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="278.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">Postfix uses the old value, prefix the new.</text><text x="20" y="293.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">== compares values; use equals() for String.</text><text x="20" y="308.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">% gives the remainder (17 % 5 = 2).</text></svg>