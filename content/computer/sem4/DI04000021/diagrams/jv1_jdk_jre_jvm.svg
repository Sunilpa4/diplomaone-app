<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 344" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="344" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">JDK, JRE and JVM</text><rect x="20" y="40" width="320" height="250" rx="10" fill="#FFF6D6" stroke="#E07B00" stroke-width="1.5"/><text x="180" y="66.0" font-size="11.5" text-anchor="middle" fill="#E07B00" font-weight="bold">JDK = Java Development Kit</text><text x="180" y="81.0" font-size="8.5" text-anchor="middle" fill="#666" font-weight="normal">(for the programmer: write + compile)</text><rect x="40" y="90" width="280" height="190" rx="9" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.5"/><text x="180" y="115.7" font-size="10.5" text-anchor="middle" fill="#1565C0" font-weight="bold">JRE = Java Runtime Environment</text><text x="180" y="131.0" font-size="8.5" text-anchor="middle" fill="#666" font-weight="normal">(tools ready to RUN a program)</text><rect x="60" y="140" width="240" height="130" rx="8" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.5"/><text x="180" y="165.7" font-size="10.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">JVM = Java Virtual Machine</text><text x="180" y="181.0" font-size="8.5" text-anchor="middle" fill="#666" font-weight="normal">(executes the byte code)</text><rect x="70" y="190" width="60" height="20" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="100.0" y="203.0" font-size="8.5" text-anchor="middle" fill="#fff" font-weight="bold">JDK</text><rect x="130" y="190" width="172" height="20" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="216.0" y="203.0" font-size="8.5" text-anchor="middle" fill="#fff" font-weight="bold">javac, java, debugger + JRE</text><rect x="70" y="210" width="60" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="100.0" y="223.0" font-size="8.5" text-anchor="middle" fill="#222" font-weight="normal">JRE</text><rect x="130" y="210" width="172" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="216.0" y="223.0" font-size="8.5" text-anchor="middle" fill="#222" font-weight="normal">class libraries + JVM</text><rect x="70" y="230" width="60" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="100.0" y="243.0" font-size="8.5" text-anchor="middle" fill="#222" font-weight="normal">JVM</text><rect x="130" y="230" width="172" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="216.0" y="243.0" font-size="8.5" text-anchor="middle" fill="#222" font-weight="normal">byte code -&gt; machine code</text><rect x="12" y="300" width="336" height="40" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="318.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">Install only the JDK - it already</text><text x="20" y="333.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">contains the JRE and the JVM.</text></svg>