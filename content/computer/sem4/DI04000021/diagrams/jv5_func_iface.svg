<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 376" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="376" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Ready-made Functional Interfaces</text><text x="12" y="53.2" font-size="9.2" text-anchor="start" fill="#7B2CD9" font-weight="bold">the ONE abstract method rule:</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="64.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">interface Runnable {  void run(); }</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="79.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">interface Speaker {  void speak(); }</text><rect x="12" y="108" width="100" height="19" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="62.0" y="120.4" font-size="8.2" text-anchor="middle" fill="#fff" font-weight="bold">interface</text><rect x="112" y="108" width="96" height="19" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="160.0" y="120.4" font-size="8.2" text-anchor="middle" fill="#fff" font-weight="bold">method</text><rect x="208" y="108" width="128" height="19" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="272.0" y="120.4" font-size="8.2" text-anchor="middle" fill="#fff" font-weight="bold">used by / coined</text><rect x="12" y="127" width="100" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="62.0" y="139.4" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">Runnable</text><rect x="112" y="127" width="96" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="160.0" y="139.4" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">run()</text><rect x="208" y="127" width="128" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="272.0" y="139.4" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">threads, tasks</text><rect x="12" y="146" width="100" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="62.0" y="158.4" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">Supplier&lt;T&gt;</text><rect x="112" y="146" width="96" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="160.0" y="158.4" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">T get()</text><rect x="208" y="146" width="128" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="272.0" y="158.4" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">value on demand</text><rect x="12" y="165" width="100" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="62.0" y="177.4" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">Consumer&lt;T&gt;</text><rect x="112" y="165" width="96" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="160.0" y="177.4" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">accept(t)</text><rect x="208" y="165" width="128" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="272.0" y="177.4" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">forEach</text><rect x="12" y="184" width="100" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="62.0" y="196.4" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">Predicate&lt;T&gt;</text><rect x="112" y="184" width="96" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="160.0" y="196.4" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">test(t)</text><rect x="208" y="184" width="128" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="272.0" y="196.4" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">filter</text><rect x="12" y="203" width="100" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="62.0" y="215.4" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">Function&lt;T,R&gt;</text><rect x="112" y="203" width="96" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="160.0" y="215.4" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">apply(t)</text><rect x="208" y="203" width="128" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="272.0" y="215.4" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">map</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="234.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">@FunctionalInterface</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="248.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">interface Calc {</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="262.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">  int op(int x, int y);</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="276.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">}   // compile-checked</text><rect x="12" y="306" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="324.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">@FunctionalInterface asks javac to reject</text><text x="20" y="339.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">interfaces that accidentally grow a second</text><text x="20" y="354.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">abstract method - keeps lambdas legal.</text></svg>