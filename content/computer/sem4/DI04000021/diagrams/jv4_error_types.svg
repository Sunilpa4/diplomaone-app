<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 316" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="316" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Three Kinds of Errors</text><rect x="12" y="48" width="108" height="30" rx="7" fill="#FDECEC" stroke="#C62828" stroke-width="1.2"/><text x="66" y="70.3" font-size="9.4" text-anchor="middle" fill="#C62828" font-weight="bold">compile-time</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="132" y="64.0" font-size="8.6" text-anchor="start" fill="#222" font-weight="normal">int n = "ten";  // javac stops</text><rect x="12" y="90" width="108" height="30" rx="7" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.2"/><text x="66" y="112.3" font-size="9.4" text-anchor="middle" fill="#E07B00" font-weight="bold">runtime</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="132" y="106.0" font-size="8.6" text-anchor="start" fill="#222" font-weight="normal">int x = 5 / 0;  // exception!</text><rect x="12" y="132" width="108" height="30" rx="7" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.2"/><text x="66" y="154.3" font-size="9.4" text-anchor="middle" fill="#7B2CD9" font-weight="bold">logical</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="132" y="148.0" font-size="8.6" text-anchor="start" fill="#222" font-weight="normal">avg = a + b / 2;  // wrong!</text><text x="12" y="191.2" font-size="9.2" text-anchor="start" fill="#666" font-weight="bold">when it appears</text><rect x="12" y="198" width="96" height="20" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="60.0" y="210.9" font-size="8.4" text-anchor="middle" fill="#fff" font-weight="bold">compile-time</text><rect x="108" y="198" width="236" height="20" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="226.0" y="210.9" font-size="8.4" text-anchor="middle" fill="#fff" font-weight="bold">before the program runs</text><rect x="12" y="218" width="96" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="60.0" y="230.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">runtime</text><rect x="108" y="218" width="236" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="226.0" y="230.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">crashes while running</text><rect x="12" y="238" width="96" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="60.0" y="250.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">logical</text><rect x="108" y="238" width="236" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="226.0" y="250.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">runs - wrong output</text><rect x="12" y="266" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="284.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">Only runtime errors become EXCEPTIONS</text><text x="20" y="299.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">objects the JVM throws and programs</text><text x="20" y="314.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">can catch and recover from.</text></svg>