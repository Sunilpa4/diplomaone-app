<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="340" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Write Once, Run Anywhere (byte code)</text><rect x="10" y="48" width="100" height="44" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.3"/><text x="60" y="69.3" font-size="9.5" text-anchor="middle" fill="#1565C0" font-weight="bold">Main.java</text><text x="60" y="82.7" font-size="7.8" text-anchor="middle" fill="#666" font-weight="normal">source code</text><path d="M112 70 L142 70" fill="none" stroke="#666" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="148.0,70.0 141.0,66.5 141.0,73.5" fill="#666"/><text x="130" y="65.0" font-size="8.5" text-anchor="middle" fill="#666" font-weight="bold">javac</text><rect x="150" y="48" width="110" height="44" rx="7" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.3"/><text x="205" y="69.3" font-size="9.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Main.class</text><text x="205" y="82.7" font-size="7.8" text-anchor="middle" fill="#666" font-weight="normal">byte code</text><path d="M262 70 L294 70" fill="none" stroke="#666" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="300.0,70.0 293.0,66.5 293.0,73.5" fill="#666"/><rect x="296" y="48" width="54" height="44" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.3"/><text x="323" y="73.5" font-size="10" text-anchor="middle" fill="#2E7D32" font-weight="bold">JVM</text><rect x="60" y="110" width="70" height="20" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="95.0" y="123.0" font-size="8.5" text-anchor="middle" fill="#fff" font-weight="bold">OS</text><rect x="130" y="110" width="222" height="20" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="241.0" y="123.0" font-size="8.5" text-anchor="middle" fill="#fff" font-weight="bold">its own JVM runs the same .class</text><rect x="60" y="130" width="70" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="95.0" y="143.0" font-size="8.5" text-anchor="middle" fill="#222" font-weight="normal">Windows</text><rect x="130" y="130" width="222" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="241.0" y="143.0" font-size="8.5" text-anchor="middle" fill="#222" font-weight="normal">Windows JVM</text><rect x="60" y="150" width="70" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="95.0" y="163.0" font-size="8.5" text-anchor="middle" fill="#222" font-weight="normal">Linux</text><rect x="130" y="150" width="222" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="241.0" y="163.0" font-size="8.5" text-anchor="middle" fill="#222" font-weight="normal">Linux JVM</text><rect x="60" y="170" width="70" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="95.0" y="183.0" font-size="8.5" text-anchor="middle" fill="#222" font-weight="normal">Mac</text><rect x="130" y="170" width="222" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="241.0" y="183.0" font-size="8.5" text-anchor="middle" fill="#222" font-weight="normal">Mac JVM</text><rect x="10" y="218" width="340" height="56" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="20" y="239.2" font-size="9.2" text-anchor="start" fill="#2E7D32" font-weight="bold">The byte code is platform independent:</text><text x="20" y="255.2" font-size="9.2" text-anchor="start" fill="#333" font-weight="normal">compile once anywhere, run on every OS.</text><text x="20" y="269.2" font-size="9.2" text-anchor="start" fill="#333" font-weight="normal">Only the JVM is different for each OS.</text><rect x="12" y="296" width="336" height="40" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="314.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">C/C++ compile to machine code for one OS;</text><text x="20" y="329.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">Java compiles to byte code for all OSes.</text></svg>