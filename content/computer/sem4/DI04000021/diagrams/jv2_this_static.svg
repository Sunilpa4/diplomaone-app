<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 314" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="314" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">this and static</text><rect x="10" y="40" width="160" height="108" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.3"/><text x="90" y="61.9" font-size="11" text-anchor="middle" fill="#1565C0" font-weight="bold">this</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="77.0" font-size="8.6" text-anchor="start" fill="#222" font-weight="normal">Book(String t) {</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="90.0" font-size="8.6" text-anchor="start" fill="#222" font-weight="normal">  this.t = t;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="103.0" font-size="8.6" text-anchor="start" fill="#222" font-weight="normal">}</text><text x="20" y="120.7" font-size="7.8" text-anchor="start" fill="#333" font-weight="normal">this.field reads the object;</text><text x="20" y="132.7" font-size="7.8" text-anchor="start" fill="#333" font-weight="normal">plain name reads the parameter.</text><text x="20" y="145.7" font-size="7.8" text-anchor="start" fill="#1565C0" font-weight="normal">this(args) -&gt; another constructor</text><rect x="190" y="40" width="160" height="108" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.3"/><text x="270" y="61.9" font-size="11" text-anchor="middle" fill="#2E7D32" font-weight="bold">static</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="200" y="77.0" font-size="8.6" text-anchor="start" fill="#222" font-weight="normal">static int total;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="200" y="90.0" font-size="8.6" text-anchor="start" fill="#222" font-weight="normal">static void show()</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="200" y="103.0" font-size="8.6" text-anchor="start" fill="#222" font-weight="normal">{ }</text><text x="200" y="120.7" font-size="7.8" text-anchor="start" fill="#333" font-weight="normal">one shared copy;</text><text x="200" y="132.7" font-size="7.8" text-anchor="start" fill="#333" font-weight="normal">call via class name;</text><text x="200" y="145.7" font-size="7.8" text-anchor="start" fill="#2E7D32" font-weight="normal">loaded before main()</text><rect x="10" y="162" width="340" height="92" rx="7" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.2"/><text x="180" y="183.3" font-size="9.4" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Memory picture of a static variable</text><rect x="30" y="190" width="90" height="26" rx="6" fill="#fff" stroke="#7B2CD9" stroke-width="1"/><text x="75" y="210.2" font-size="9" text-anchor="middle" fill="#7B2CD9" font-weight="normal">total = 3</text><rect x="140" y="190" width="56" height="26" rx="6" fill="#fff" stroke="#2E7D32" stroke-width="1"/><text x="168" y="209.8" font-size="8" text-anchor="middle" fill="#333" font-weight="normal">c1.id=1</text><path d="M122 203 L132 203" fill="none" stroke="#666" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="138.0,203.0 131.0,199.5 131.0,206.5" fill="#666"/><rect x="205" y="190" width="56" height="26" rx="6" fill="#fff" stroke="#2E7D32" stroke-width="1"/><text x="233" y="209.8" font-size="8" text-anchor="middle" fill="#333" font-weight="normal">c2.id=2</text><path d="M122 203 L197 203" fill="none" stroke="#666" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="203.0,203.0 196.0,199.5 196.0,206.5" fill="#666"/><rect x="270" y="190" width="56" height="26" rx="6" fill="#fff" stroke="#2E7D32" stroke-width="1"/><text x="298" y="209.8" font-size="8" text-anchor="middle" fill="#333" font-weight="normal">c3.id=3</text><path d="M122 203 L262 203" fill="none" stroke="#666" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="268.0,203.0 261.0,199.5 261.0,206.5" fill="#666"/><text x="180" y="236.9" font-size="8.2" text-anchor="middle" fill="#666" font-weight="normal">all objects share the single total</text><rect x="12" y="268" width="336" height="40" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="286.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">static methods can touch only static</text><text x="20" y="301.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">members - no this inside them.</text></svg>