<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="340" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Collections Framework: Overview</text><rect x="128" y="46" width="104" height="22" rx="6" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.1"/><text x="180.0" y="63.0" font-size="8.6" text-anchor="middle" fill="#2E7D32" font-weight="bold">&lt;&lt;Collection&gt;&gt;</text><text x="180" y="44.7" font-size="7.8" text-anchor="middle" fill="#666" font-weight="normal">interface</text><rect x="36" y="90" width="90" height="22" rx="6" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.1"/><text x="81.0" y="107.0" font-size="8.6" text-anchor="middle" fill="#2E7D32" font-weight="bold">&lt;&lt;List&gt;&gt;</text><rect x="234" y="90" width="90" height="22" rx="6" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.1"/><text x="279.0" y="107.0" font-size="8.6" text-anchor="middle" fill="#2E7D32" font-weight="bold">&lt;&lt;Set&gt;&gt;</text><path d="M81 75 L81 86" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="81,82 77,90 85,90" fill="#666"/><path d="M279 75 L279 86" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="279,82 275,90 283,90" fill="#666"/><rect x="36" y="132" width="90" height="22" rx="6" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="81.0" y="149.0" font-size="8.6" text-anchor="middle" fill="#1565C0" font-weight="bold">ArrayList</text><rect x="234" y="132" width="90" height="22" rx="6" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="279.0" y="149.0" font-size="8.6" text-anchor="middle" fill="#1565C0" font-weight="bold">HashSet</text><path d="M81 112 L81 128" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="81,124 77,132 85,132" fill="#666"/><path d="M279 112 L279 128" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="279,124 275,132 283,132" fill="#666"/><text x="81" y="178.8" font-size="8.0" text-anchor="middle" fill="#1565C0" font-weight="normal">ordered, duplicates OK</text><text x="279" y="178.8" font-size="8.0" text-anchor="middle" fill="#1565C0" font-weight="normal">unique, no fixed order</text><rect x="12" y="190" width="96" height="20" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="60.0" y="202.9" font-size="8.4" text-anchor="middle" fill="#fff" font-weight="bold">ArrayList</text><rect x="108" y="190" width="240" height="20" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="228.0" y="202.9" font-size="8.4" text-anchor="middle" fill="#fff" font-weight="bold">get(i), add, remove, search</text><rect x="12" y="210" width="96" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="60.0" y="222.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">HashSet</text><rect x="108" y="210" width="240" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="228.0" y="222.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">unique members, fast contains</text><rect x="12" y="250" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="268.1" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">Also in the family: Map (key -&gt; value),</text><text x="20" y="283.1" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">Queue, LinkedList, TreeSet ... Same</text><text x="20" y="298.1" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">ideas: interfaces on top, ready-made</text><text x="20" y="313.1" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">classes below, for-each works on all.</text></svg>