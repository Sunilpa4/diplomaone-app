<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="330" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Java's Role in AI + Its Libraries</text><text x="12" y="55.3" font-size="9.4" text-anchor="start" fill="#7B2CD9" font-weight="bold">where Java fits:</text><rect x="12" y="60" width="120" height="20" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="72.0" y="72.9" font-size="8.2" text-anchor="middle" fill="#fff" font-weight="bold">strength</text><rect x="132" y="60" width="216" height="20" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="240.0" y="72.9" font-size="8.2" text-anchor="middle" fill="#fff" font-weight="bold">why it matters</text><rect x="12" y="80" width="120" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="72.0" y="92.9" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">enterprise apps</text><rect x="132" y="80" width="216" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="240.0" y="92.9" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">most company backends are Java</text><rect x="12" y="100" width="120" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="72.0" y="112.9" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">data handling</text><rect x="132" y="100" width="216" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="240.0" y="112.9" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">strong collections, streams, JDBC</text><rect x="12" y="120" width="120" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="72.0" y="132.9" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">API integration</text><rect x="132" y="120" width="216" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="240.0" y="132.9" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">call AI services from Java apps</text><text x="12" y="143.3" font-size="9.4" text-anchor="start" fill="#7B2CD9" font-weight="bold">libraries to know by name:</text><rect x="12" y="150" width="160" height="80" rx="7" fill="#FFF6D6" stroke="#E07B00" stroke-width="1.2"/><text x="92" y="171.2" font-size="9.2" text-anchor="middle" fill="#E07B00" font-weight="bold">Deeplearning4j</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="184.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">deep learning IN Java</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="197.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">neural nets on GPUs</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="210.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">JVM ecosystem native</text><rect x="188" y="150" width="160" height="80" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="268" y="171.2" font-size="9.2" text-anchor="middle" fill="#2E7D32" font-weight="bold">TensorFlow Java</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="200" y="184.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">runs PRE-TRAINED</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="200" y="197.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">TF models from</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="200" y="210.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">inside Java code</text><rect x="12" y="250" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="268.1" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">Pattern in industry: Python often TRAINS,</text><text x="20" y="283.1" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">Java DEPLOYS at scale - a Java service</text><text x="20" y="298.1" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">loads the model and answers requests.</text><text x="20" y="313.1" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">jv5_13 shows the idea in 30 lines.</text></svg>