<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 380" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="380" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Structure of a Java Program</text><rect x="10" y="40" width="340" height="176" rx="6" fill="#fff" stroke="#999" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="59.1" font-size="9" text-anchor="start" fill="#222" font-weight="normal">// File: Main.java</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="75.2" font-size="9" text-anchor="start" fill="#222" font-weight="normal">class Main {</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="91.2" font-size="9" text-anchor="start" fill="#222" font-weight="normal">  public static void main(String[] a) {</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="107.2" font-size="9" text-anchor="start" fill="#222" font-weight="normal">    System.out.println("Hello");</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="123.2" font-size="9" text-anchor="start" fill="#222" font-weight="normal">  }</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="139.2" font-size="9" text-anchor="start" fill="#222" font-weight="normal">}</text><circle cx="352" cy="77" r="4" fill="#1565C0"/><circle cx="352" cy="109" r="4" fill="#2E7D32"/><circle cx="352" cy="125" r="4" fill="#E07B00"/><circle cx="352" cy="56" r="4" fill="#1565C0"/><circle cx="20" cy="228" r="4" fill="#1565C0"/><text x="32" y="235.2" font-size="9" text-anchor="start" fill="#333" font-weight="normal">class: container of the whole program</text><circle cx="20" cy="252" r="4" fill="#2E7D32"/><text x="32" y="259.1" font-size="9" text-anchor="start" fill="#333" font-weight="normal">main(): starting point (public static void)</text><circle cx="20" cy="276" r="4" fill="#E07B00"/><text x="32" y="283.1" font-size="9" text-anchor="start" fill="#333" font-weight="normal">every statement ends with ;</text><text x="20" y="309.0" font-size="8.6" text-anchor="start" fill="#666" font-weight="normal">public: visible everywhere   static: no object needed</text><text x="20" y="323.0" font-size="8.6" text-anchor="start" fill="#666" font-weight="normal">void: returns nothing   String[] a: command-line args</text><rect x="12" y="332" width="336" height="40" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="350.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">Java is case sensitive: Main != main.</text><text x="20" y="365.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">Save as Main.java for class Main.</text></svg>