<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 314" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="314" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">throw vs throws</text><rect x="12" y="46" width="160" height="120" rx="7" fill="#FDECEC" stroke="#C62828" stroke-width="1.2"/><text x="92" y="67.5" font-size="10" text-anchor="middle" fill="#C62828" font-weight="bold">throw</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="82.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">// inside the body:</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="96.4" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">throw new</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="109.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">  IllegalArgument</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="123.4" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">    Exception("bad");</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="136.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">// does the raising</text><rect x="188" y="46" width="160" height="120" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><text x="268" y="67.5" font-size="10" text-anchor="middle" fill="#1565C0" font-weight="bold">throws</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="200" y="82.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">// in the header:</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="200" y="96.4" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">void f(int x)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="200" y="109.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">  throws Exception {</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="200" y="123.4" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">  ...</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="200" y="136.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">// does the warning</text><rect x="12" y="174" width="86" height="20" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="55.0" y="186.9" font-size="8.4" text-anchor="middle" fill="#fff" font-weight="bold">throw</text><rect x="98" y="174" width="230" height="20" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="213.0" y="186.9" font-size="8.4" text-anchor="middle" fill="#fff" font-weight="bold">raises one exception object</text><rect x="12" y="194" width="86" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="55.0" y="206.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">throws</text><rect x="98" y="194" width="230" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="213.0" y="206.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">may list several, separated by ,</text><rect x="12" y="222" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="240.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">throw = an ACTION (statement in the body)</text><text x="20" y="255.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">throws = a PROMISE (clause in the header)</text><text x="20" y="270.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">A checked exception in throws forces every</text><text x="20" y="285.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">caller to catch it or re-declare it.</text></svg>