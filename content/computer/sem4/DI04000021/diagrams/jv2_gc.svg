<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 296" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="296" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Garbage Collection and finalize()</text><rect x="10" y="46" width="340" height="120" rx="8" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.2"/><text x="180" y="67.5" font-size="10" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Heap memory</text><rect x="24" y="76" width="74" height="30" rx="6" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="61" y="98.0" font-size="8.6" text-anchor="middle" fill="#2E7D32" font-weight="normal">pen (used)</text><rect x="112" y="76" width="74" height="30" rx="6" fill="#FDECEC" stroke="#C62828" stroke-width="1.2"/><text x="149" y="98.0" font-size="8.6" text-anchor="middle" fill="#C62828" font-weight="normal">book (lost)</text><rect x="24" y="118" width="120" height="30" rx="6" fill="#FDECEC" stroke="#C62828" stroke-width="1.2"/><text x="84" y="140.0" font-size="8.6" text-anchor="middle" fill="#C62828" font-weight="normal">bag (ref = null)</text><rect x="196" y="76" width="140" height="70" rx="6" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="266" y="95.3" font-size="9.4" text-anchor="middle" fill="#2E7D32" font-weight="bold">Garbage Collector</text><text x="266" y="110.9" font-size="8.4" text-anchor="middle" fill="#333" font-weight="normal">removes objects</text><text x="266" y="124.9" font-size="8.4" text-anchor="middle" fill="#333" font-weight="normal">with no reference</text><text x="266" y="139.9" font-size="8.4" text-anchor="middle" fill="#C62828" font-weight="normal">finalize() runs first</text><path d="M160 111 L188 111" fill="none" stroke="#666" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="194.0,111.0 187.0,107.5 187.0,114.5" fill="#666"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="207.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">it = null;        // object loses its ref</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="222.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">System.gc();      // request collection</text><rect x="12" y="246" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="264.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">GC runs when IT decides - never trust</text><text x="20" y="279.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">timing; finalize() is a last clean-up</text><text x="20" y="294.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">chance, deprecated in modern Java.</text></svg>