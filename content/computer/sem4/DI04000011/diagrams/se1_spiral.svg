<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 356" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="356" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Spiral Model: Risk-first Cycles</text><circle cx="180" cy="158" r="30" fill="none" stroke="#1565C0" stroke-width="1.6"/><circle cx="180" cy="158" r="58" fill="none" stroke="#2E7D32" stroke-width="1.6"/><circle cx="180" cy="158" r="86" fill="none" stroke="#E07B00" stroke-width="1.6"/><circle cx="180" cy="158" r="114" fill="none" stroke="#C62828" stroke-width="1.6"/><text x="180" y="63.1" font-size="9.0" text-anchor="middle" fill="#1565C0" font-weight="bold">Planning</text><text x="268" y="161.2" font-size="9.0" text-anchor="middle" fill="#C62828" font-weight="bold">Risk analysis</text><text x="180" y="283.1" font-size="9.0" text-anchor="middle" fill="#2E7D32" font-weight="bold">Engineering</text><text x="92" y="161.2" font-size="9.0" text-anchor="middle" fill="#E07B00" font-weight="bold">Evaluation</text><text x="180" y="165.0" font-size="8.6" text-anchor="middle" fill="#666" font-weight="bold">start</text><path d="M180 158 L180 132" fill="none" stroke="#222" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180,132 176,140 184,140" fill="#222"/><rect x="12" y="292" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="310.1" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">Each loop = one phase: plan it, analyse</text><text x="20" y="325.1" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">RISKS, build a bit, review with the</text><text x="20" y="340.1" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">customer, loop again. Big projects love</text><text x="20" y="355.1" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">it; small ones find it heavy.</text></svg>