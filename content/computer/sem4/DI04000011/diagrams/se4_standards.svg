<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 226" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="226" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Coding Standards: What They Police</text><rect x="12" y="46" width="164" height="28" rx="6" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.1"/><text x="94" y="66.9" font-size="8.2" text-anchor="middle" fill="#2E7D32" font-weight="bold">naming rules</text><rect x="186" y="46" width="164" height="28" rx="6" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.1"/><text x="268" y="66.9" font-size="8.2" text-anchor="middle" fill="#2E7D32" font-weight="bold">indentation + layout</text><rect x="12" y="82" width="164" height="28" rx="6" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.1"/><text x="94" y="102.9" font-size="8.2" text-anchor="middle" fill="#2E7D32" font-weight="bold">comment density</text><rect x="186" y="82" width="164" height="28" rx="6" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.1"/><text x="268" y="102.9" font-size="8.2" text-anchor="middle" fill="#2E7D32" font-weight="bold">error handling style</text><rect x="12" y="118" width="164" height="28" rx="6" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.1"/><text x="94" y="138.9" font-size="8.2" text-anchor="middle" fill="#2E7D32" font-weight="bold">no GOTOs/globals</text><rect x="186" y="118" width="164" height="28" rx="6" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.1"/><text x="268" y="138.9" font-size="8.2" text-anchor="middle" fill="#2E7D32" font-weight="bold">function size limits</text><rect x="12" y="166" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="184.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">One team's style = one team's mind: any</text><text x="20" y="199.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">developer can read (and safely repair)</text><text x="20" y="214.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">any module. Standards make that true.</text></svg>