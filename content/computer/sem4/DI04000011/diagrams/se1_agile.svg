<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 306" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="306" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Agile Manifesto: The Four Values</text><rect x="12" y="48" width="158" height="32" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="91" y="70.7" font-size="7.8" text-anchor="middle" fill="#2E7D32" font-weight="bold">working SOFTWARE</text><rect x="190" y="48" width="158" height="32" rx="7" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.2"/><text x="269" y="70.6" font-size="7.4" text-anchor="middle" fill="#7B2CD9" font-weight="normal">over full documentation</text><text x="180" y="71.8" font-size="11" text-anchor="middle" fill="#666" font-weight="bold">&gt;</text><rect x="12" y="88" width="158" height="32" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="91" y="110.7" font-size="7.8" text-anchor="middle" fill="#2E7D32" font-weight="bold">responding to CHANGE</text><rect x="190" y="88" width="158" height="32" rx="7" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.2"/><text x="269" y="110.6" font-size="7.4" text-anchor="middle" fill="#7B2CD9" font-weight="normal">over following the plan</text><text x="180" y="111.8" font-size="11" text-anchor="middle" fill="#666" font-weight="bold">&gt;</text><rect x="12" y="128" width="158" height="32" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="91" y="150.7" font-size="7.8" text-anchor="middle" fill="#2E7D32" font-weight="bold">INDIVIDUALS + interactions</text><rect x="190" y="128" width="158" height="32" rx="7" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.2"/><text x="269" y="150.6" font-size="7.4" text-anchor="middle" fill="#7B2CD9" font-weight="normal">over processes and tools</text><text x="180" y="151.8" font-size="11" text-anchor="middle" fill="#666" font-weight="bold">&gt;</text><rect x="12" y="168" width="158" height="32" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="91" y="190.7" font-size="7.8" text-anchor="middle" fill="#2E7D32" font-weight="bold">CUSTOMER collaboration</text><rect x="190" y="168" width="158" height="32" rx="7" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.2"/><text x="269" y="190.6" font-size="7.4" text-anchor="middle" fill="#7B2CD9" font-weight="normal">over contract negotiation</text><text x="180" y="191.8" font-size="11" text-anchor="middle" fill="#666" font-weight="bold">&gt;</text><text x="180" y="226.9" font-size="8.2" text-anchor="middle" fill="#666" font-weight="normal">the right sides are still valued - the left more</text><rect x="12" y="240" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="258.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">12 principles behind it - the heart three:</text><text x="20" y="273.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">satisfy the customer with EARLY, continuous</text><text x="20" y="288.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">delivery; welcome change; deliver working</text><text x="20" y="303.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">software every few WEEKS.</text></svg>