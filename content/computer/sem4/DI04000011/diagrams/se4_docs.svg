<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 244" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="244" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Internal vs External Documentation</text><rect x="12" y="46" width="160" height="116" rx="8" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.3"/><text x="92" y="67.4" font-size="9.6" text-anchor="middle" fill="#1565C0" font-weight="bold">INTERNAL</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="82.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">lives INSIDE the code:</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="96.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">// comments</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="110.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">doc-strings</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="124.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">meaningful names</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="138.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">class + module headers</text><rect x="188" y="46" width="160" height="116" rx="8" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.3"/><text x="268" y="67.4" font-size="9.6" text-anchor="middle" fill="#2E7D32" font-weight="bold">EXTERNAL</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="198" y="82.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">lives BESIDE the code:</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="198" y="96.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">user manual</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="198" y="110.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">install guide</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="198" y="124.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">SRS + design docs</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="198" y="138.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">API reference</text><rect x="12" y="180" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="198.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">Internal serves the next developer;</text><text x="20" y="213.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">external serves users and reviewers.</text><text x="20" y="228.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">Both are DELIVERABLES, not extras.</text></svg>