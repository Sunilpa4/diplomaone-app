<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 332" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="332" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Risk Management Cycle</text><rect x="130.0" y="39.0" width="100" height="30" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="180.0" y="56.9" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">identify risks</text><rect x="246.0" y="135.0" width="100" height="30" rx="7" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.6"/><text x="296.0" y="152.9" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">assess P x I</text><rect x="130.0" y="231.0" width="100" height="30" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.6"/><text x="180.0" y="248.9" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">plan mitigation</text><rect x="14.0" y="135.0" width="100" height="30" rx="7" fill="#FDECEC" stroke="#C62828" stroke-width="1.6"/><text x="64.0" y="152.9" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">monitor weekly</text><path d="M268 100 A140 104 0 0 1 240 210" fill="none" stroke="#666" stroke-width="1.4"/><polygon points="240,210 236,202 246,204" fill="#666"/><path d="M120 232 A140 104 0 0 1 92 128" fill="none" stroke="#666" stroke-width="1.4"/><polygon points="92,128 100,136 88,136" fill="#666"/><rect x="12" y="272" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="290.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">One pass per week keeps risks current;</text><text x="20" y="305.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">the register holds: risk, P, I, R = P x I,</text><text x="20" y="320.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">owner, mitigation, trigger date.</text></svg>