<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 326" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="326" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">White-Box Testing: Cover the Code</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="53.0" font-size="8.6" text-anchor="start" fill="#222" font-weight="normal">if (x &gt; 0) {        // branch point</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="68.0" font-size="8.6" text-anchor="start" fill="#222" font-weight="normal">  y = f(x);  // path A</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="83.0" font-size="8.6" text-anchor="start" fill="#222" font-weight="normal">} else {</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="98.0" font-size="8.6" text-anchor="start" fill="#222" font-weight="normal">  y = g(x);  // path B</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="113.0" font-size="8.6" text-anchor="start" fill="#222" font-weight="normal">}              // then common z(y)</text><rect x="12" y="140" width="92" height="19" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="58.0" y="152.4" font-size="8.2" text-anchor="middle" fill="#fff" font-weight="bold">coverage</text><rect x="104" y="140" width="244" height="19" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="226.0" y="152.4" font-size="8.2" text-anchor="middle" fill="#fff" font-weight="bold">meaning</text><rect x="12" y="159" width="92" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="58.0" y="171.4" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">statement</text><rect x="104" y="159" width="244" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="226.0" y="171.4" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">every line ran at least once</text><rect x="12" y="178" width="92" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="58.0" y="190.4" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">branch</text><rect x="104" y="178" width="244" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="226.0" y="190.4" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">every if took BOTH sides</text><rect x="12" y="197" width="92" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="58.0" y="209.4" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">path</text><rect x="104" y="197" width="244" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="226.0" y="209.4" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">every route through ran</text><text x="180" y="228.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="normal">example: tests x=3 and x=-7 -&gt; 100% branch here</text><rect x="12" y="240" width="336" height="85" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="258.1" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">Our eyes are INSIDE the box: pick inputs</text><text x="20" y="273.1" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">that exercise structures (loops, edges) -</text><text x="20" y="288.1" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">complements black-box, never replaces it.</text><text x="20" y="303.1" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">Basis path / cyclomatic complexity counts</text><text x="20" y="318.1" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">independent routes.</text></svg>