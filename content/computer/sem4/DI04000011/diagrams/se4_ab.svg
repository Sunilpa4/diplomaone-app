<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 238" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="238" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Alpha and Beta Testing</text><rect x="12" y="48" width="160" height="104" rx="8" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.3"/><text x="92" y="69.5" font-size="10" text-anchor="middle" fill="#1565C0" font-weight="bold">ALPHA</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="84.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">done IN-HOUSE at the</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="98.3" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">developer's site</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="111.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">friendly users inside</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="125.3" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">the org watch crashes</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="138.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">late in development</text><rect x="188" y="48" width="160" height="104" rx="8" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.3"/><text x="268" y="69.5" font-size="10" text-anchor="middle" fill="#2E7D32" font-weight="bold">BETA</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="198" y="84.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">done in the WILD at</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="198" y="98.3" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">real client sites</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="198" y="111.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">real users, real data,</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="198" y="125.3" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">uncontrolled env</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="198" y="138.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">feeds final fixes</text><rect x="12" y="170" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="188.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">Order: alpha first in the lab, then beta</text><text x="20" y="203.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">at selected customers - then release</text><text x="20" y="218.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">candidate, then the real release.</text></svg>