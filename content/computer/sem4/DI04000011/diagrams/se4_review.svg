"19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="286.0" y="94.3" font-size="8.0" text-anchor="middle" fill="#222" font-weight="normal">highly formal</text><rect x="12" y="101" width="86" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="55.0" y="113.3" font-size="8.0" text-anchor="middle" fill="#222" font-weight="normal">prepared?</text><rect x="98" y="101" width="126" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="161.0" y="113.3" font-size="8.0" text-anchor="middle" fill="#222" font-weight="normal">little</text><rect x="224" y="101" width="124" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="286.0" y="113.3" font-size="8.0" text-anchor="middle" fill="#222" font-weight="normal">checklists, roles</text><rect x="12" y="120" width="86" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="55.0" y="132.3" font-size="8.0" text-anchor="middle" fill="#222" font-weight="normal">goal</text><rect x="98" y="120" width="126" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="161.0" y="132.3" font-size="8.0" text-anchor="middle" fill="#222" font-weight="normal">share knowledge</text><rect x="224" y="120" width="124" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="286.0" y="132.3" font-size="8.0" text-anchor="middle" fill="#222" font-weight="normal">find defects NOW</text><rect x="12" y="139" width="86" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="55.0" y="151.3" font-size="8.0" text-anchor="middle" fill="#222" font-weight="normal">output</text><rect x="98" y="139" width="126" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="161.0" y="151.3" font-size="8.0" text-anchor="middle" fill="#222" font-weight="normal">comments</text><rect x="224" y="139" width="124" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="286.0" y="151.3" font-size="8.0" text-anchor="middle" fill="#222" font-weight="normal">defect log for fix</text><rect x="12" y="168" width="336" height="40" rx="7" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.2"/><text x="180" y="187.0" font-size="8.6" text-anchor="middle" fill="#7B2CD9" font-weight="bold">review beats testing at cost:</text><text x="180" y="200.9" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">a requirement caught in review costs ~1; in live use, ~100.</text><rect x="12" y="222" width="336" height="40" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="240.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">Both happen BEFORE code runs: static</text><text x="20" y="255.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">verification, eyeballs on work products.</text></svg>