<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 276" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="276" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Scrum Framework</text><rect x="16.0" y="49.0" width="96" height="34" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="64" y="69.2" font-size="9.0" text-anchor="middle" fill="#222" font-weight="normal">product</text><text x="64" y="96.7" font-size="7.6" text-anchor="middle" fill="#666" font-weight="normal">backlog</text><rect x="138.0" y="49.0" width="96" height="34" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.6"/><text x="186" y="69.2" font-size="9.0" text-anchor="middle" fill="#222" font-weight="normal">sprint</text><text x="186" y="96.7" font-size="7.6" text-anchor="middle" fill="#666" font-weight="normal">backlog</text><rect x="252.0" y="49.0" width="96" height="34" rx="7" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.6"/><text x="300" y="69.2" font-size="9.0" text-anchor="middle" fill="#222" font-weight="normal">sprint</text><text x="300" y="96.7" font-size="7.6" text-anchor="middle" fill="#666" font-weight="normal">2-4 weeks</text><rect x="252.0" y="161.0" width="96" height="34" rx="7" fill="#FDECEC" stroke="#C62828" stroke-width="1.6"/><text x="300" y="181.2" font-size="9.0" text-anchor="middle" fill="#222" font-weight="normal">ship-able</text><text x="300" y="208.7" font-size="7.6" text-anchor="middle" fill="#666" font-weight="normal">increment</text><path d="M112 66 L132 66" fill="none" stroke="#666" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="138.0,66.0 131.0,62.5 131.0,69.5" fill="#666"/><path d="M234 66 L246 66" fill="none" stroke="#666" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="252.0,66.0 245.0,62.5 245.0,69.5" fill="#666"/><path d="M300 83 L300 161" fill="none" stroke="#666" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><polygon points="300,161 296,153 304,153" fill="#666"/><path d="M252 178 L64 178 L64 83" fill="none" stroke="#666" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 3"/><polygon points="64,83 60,91 68,91" fill="#666"/><text x="150" y="174.7" font-size="7.6" text-anchor="middle" fill="#666" font-weight="normal">review + retrospective feed the backlog</text><rect x="226" y="108" width="148" height="40" rx="7" fill="#FFF6D6" stroke="#E07B00" stroke-width="1.2"/><text x="300" y="126.7" font-size="7.8" text-anchor="middle" fill="#E07B00" font-weight="bold">inside a sprint:</text><text x="300" y="140.7" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">daily 15-min stand-up</text><rect x="12" y="210" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="228.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">Roles: Product Owner (what), Scrum Master</text><text x="20" y="243.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">(clears obstacles), Developers (how).</text><text x="20" y="258.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">A sprint is timeboxed - scope slips,</text><text x="20" y="273.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">the deadline does not.</text></svg>