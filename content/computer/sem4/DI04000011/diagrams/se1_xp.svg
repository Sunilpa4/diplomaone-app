t x="15.809002353436256" y="200.00000000000003" width="124" height="26" rx="6" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.1"/><text x="77.80900235343626" y="219.9" font-size="8.2" text-anchor="middle" fill="#2E7D32" font-weight="bold">small releases</text><path d="M145.35898384862247 180.0 L138.43078061834694 203.00000000000003" fill="none" stroke="#666" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><rect x="15.809002353436242" y="93.99999999999999" width="124" height="26" rx="6" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.1"/><text x="77.80900235343624" y="113.9" font-size="8.2" text-anchor="middle" fill="#2E7D32" font-weight="bold">simple design</text><path d="M145.35898384862247 140.0 L138.43078061834694 116.99999999999999" fill="none" stroke="#666" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><rect x="12" y="306" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="324.1" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">XP pushes good practice to '11':</text><text x="20" y="339.1" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">if tests help, write them FIRST; if reviews</text><text x="20" y="354.1" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">help, review constantly (pair programming);</text><text x="20" y="369.1" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">if design matters, improve it daily (refactor).</text></svg>