<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="340" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Sprint Burndown Chart (Agile, Practical 14)</text><text x="32" y="54.7" font-size="7.8" text-anchor="start" fill="#666" font-weight="normal">work left</text><text x="180" y="264.7" font-size="7.8" text-anchor="middle" fill="#666" font-weight="normal">days of sprint</text><path d="M56 60 L56 240 M56 240 L316 240" fill="none" stroke="#222" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="52" y="68.5" font-size="7" text-anchor="end" fill="#666" font-weight="normal">40</text><text x="52" y="152.4" font-size="7" text-anchor="end" fill="#666" font-weight="normal">20</text><text x="52" y="240.4" font-size="7" text-anchor="end" fill="#666" font-weight="normal">0</text><path d="M56 64 L316 240" fill="none" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 3"/><text x="302" y="228.6" font-size="7.4" text-anchor="end" fill="#666" font-weight="normal">ideal</text><path d="M56 64 L110 96 L164 88 L218 150 L272 170 L316 208" fill="none" stroke="#C62828" stroke-width="2"/><text x="306" y="202.6" font-size="7.4" text-anchor="start" fill="#C62828" font-weight="normal">actual</text><rect x="12" y="274" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="292.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">Each day the team plots remaining effort;</text><text x="20" y="307.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">above the dashed ideal = behind schedule;</text><text x="20" y="322.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">below = ahead. Reality of one look.</text></svg>