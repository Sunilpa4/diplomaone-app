<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 246" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="246" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Functional vs Non-Functional Requirements</text><rect x="12" y="46" width="160" height="122" rx="8" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.3"/><text x="92" y="67.3" font-size="9.4" text-anchor="middle" fill="#2E7D32" font-weight="bold">FUNCTIONAL</text><text x="92" y="80.7" font-size="7.8" text-anchor="middle" fill="#666" font-weight="normal">what the system DOES</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="96.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">- student books a seat</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="110.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">- system issues a receipt</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="124.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">- admin adds a route</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="138.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">- search by date</text><rect x="188" y="46" width="160" height="122" rx="8" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.3"/><text x="268" y="67.3" font-size="9.4" text-anchor="middle" fill="#1565C0" font-weight="bold">NON-FUNCTIONAL</text><text x="268" y="80.7" font-size="7.8" text-anchor="middle" fill="#666" font-weight="normal">constraints &amp; qualities</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="198" y="96.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">- reply within 2 seconds</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="198" y="110.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">- 1000 users together</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="198" y="124.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">- encrypted passwords</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="198" y="138.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">- works on Android 10+</text><rect x="12" y="186" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="204.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">Test: functional requirements appear as</text><text x="20" y="219.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">VERBS of the system; non-functionals</text><text x="20" y="234.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">measure HOW WELL it performs them.</text></svg>