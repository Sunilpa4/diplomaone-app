<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="300" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">DFD Levels: Food Ordering System</text><text x="60" y="53.2" font-size="9.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">context level</text><rect x="12" y="58" width="76" height="30" rx="2" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><text x="50" y="79.7" font-size="7.8" text-anchor="middle" fill="#1565C0" font-weight="normal">customer</text><circle cx="196" cy="73" r="24" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.4"/><text x="196" y="78.9" font-size="8.4" text-anchor="middle" fill="#2E7D32" font-weight="bold">OrderFood</text><rect x="296" y="58" width="60" height="30" rx="2" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><text x="326" y="79.7" font-size="7.8" text-anchor="middle" fill="#1565C0" font-weight="normal">payment</text><path d="M88 73 L170 73" fill="none" stroke="#666" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><polygon points="170,73 162,69 162,77" fill="#666"/><text x="129" y="70.5" font-size="7.2" text-anchor="middle" fill="#666" font-weight="normal">order details</text><path d="M220 73 L294 73" fill="none" stroke="#666" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><polygon points="294,73 286,69 286,77" fill="#666"/><text x="257" y="70.5" font-size="7.2" text-anchor="middle" fill="#666" font-weight="normal">bill</text><text x="14" y="133.2" font-size="9.2" text-anchor="start" fill="#7B2CD9" font-weight="bold">level 1: blow up the one bubble</text><circle cx="48" cy="176" r="26" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.4"/><text x="48" y="173.4" font-size="7.0" text-anchor="middle" fill="#E07B00" font-weight="bold">1.</text><text x="48" y="185.4" font-size="7.0" text-anchor="middle" fill="#E07B00" font-weight="bold">browse menu</text><path d="M74 176 L98 176" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="98,176 92,172 92,180" fill="#666"/><circle cx="136" cy="176" r="26" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.4"/><text x="136" y="173.4" font-size="7.0" text-anchor="middle" fill="#E07B00" font-weight="bold">2.</text><text x="136" y="185.4" font-size="7.0" text-anchor="middle" fill="#E07B00" font-weight="bold">place order</text><path d="M162 176 L186 176" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="186,176 180,172 180,180" fill="#666"/><circle cx="224" cy="176" r="26" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.4"/><text x="224" y="173.4" font-size="7.0" text-anchor="middle" fill="#E07B00" font-weight="bold">3.</text><text x="224" y="185.4" font-size="7.0" text-anchor="middle" fill="#E07B00" font-weight="bold">pay</text><path d="M250 176 L274 176" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="274,176 268,172 268,180" fill="#666"/><circle cx="312" cy="176" r="26" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.4"/><text x="312" y="173.4" font-size="7.0" text-anchor="middle" fill="#E07B00" font-weight="bold">4.</text><text x="312" y="185.4" font-size="7.0" text-anchor="middle" fill="#E07B00" font-weight="bold">notify kitchen</text><path d="M12 158 L60 158" fill="none" stroke="#666" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="" fill="none" stroke="#666" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M34 202 L326 202" fill="none" stroke="#C62828" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M34 212 L326 212" fill="none" stroke="#C62828" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="180" y="231.7" font-size="7.6" text-anchor="middle" fill="#C62828" font-weight="normal">order store (data store under the pipeline)</text><rect x="12" y="240" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="258.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">Numbers stay consistent: bubble 2 splits</text><text x="20" y="273.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">into 2.1/2.2... on level 2. Balancing =</text><text x="20" y="288.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">flows in/out match between levels.</text></svg>