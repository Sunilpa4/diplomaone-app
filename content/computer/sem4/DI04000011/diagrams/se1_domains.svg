<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 298" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="298" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Software Application Domains</text><rect x="12" y="46" width="160" height="56" rx="8" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.3"/><text x="92" y="67.4" font-size="9.6" text-anchor="middle" fill="#1565C0" font-weight="bold">System</text><text x="92" y="82.8" font-size="8.0" text-anchor="middle" fill="#666" font-weight="normal">OS, compilers,</text><text x="92" y="94.8" font-size="8.0" text-anchor="middle" fill="#666" font-weight="normal">drivers</text><rect x="188" y="46" width="160" height="56" rx="8" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.3"/><text x="268" y="67.4" font-size="9.6" text-anchor="middle" fill="#2E7D32" font-weight="bold">Application</text><text x="268" y="82.8" font-size="8.0" text-anchor="middle" fill="#666" font-weight="normal">accounts, ERP,</text><text x="268" y="94.8" font-size="8.0" text-anchor="middle" fill="#666" font-weight="normal">word tools</text><rect x="12" y="110" width="160" height="56" rx="8" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.3"/><text x="92" y="131.4" font-size="9.6" text-anchor="middle" fill="#E07B00" font-weight="bold">Embedded</text><text x="92" y="146.8" font-size="8.0" text-anchor="middle" fill="#666" font-weight="normal">firmware in devices:</text><text x="92" y="158.8" font-size="8.0" text-anchor="middle" fill="#666" font-weight="normal">ABS, microwaves</text><rect x="188" y="110" width="160" height="56" rx="8" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.3"/><text x="268" y="131.4" font-size="9.6" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Web</text><text x="268" y="146.8" font-size="8.0" text-anchor="middle" fill="#666" font-weight="normal">sites + web apps,</text><text x="268" y="158.8" font-size="8.0" text-anchor="middle" fill="#666" font-weight="normal">cloud backends</text><rect x="12" y="174" width="160" height="56" rx="8" fill="#FDECEC" stroke="#C62828" stroke-width="1.3"/><text x="92" y="195.4" font-size="9.6" text-anchor="middle" fill="#C62828" font-weight="bold">AI based</text><text x="92" y="210.8" font-size="8.0" text-anchor="middle" fill="#666" font-weight="normal">predict, recognise,</text><text x="92" y="222.8" font-size="8.0" text-anchor="middle" fill="#666" font-weight="normal">recommend</text><rect x="188" y="174" width="160" height="56" rx="8" fill="#E0F2F1" stroke="#00796B" stroke-width="1.3"/><text x="268" y="195.4" font-size="9.6" text-anchor="middle" fill="#00796B" font-weight="bold">Green Hydrogen</text><text x="268" y="210.8" font-size="8.0" text-anchor="middle" fill="#666" font-weight="normal">production + supply</text><text x="268" y="222.8" font-size="8.0" text-anchor="middle" fill="#666" font-weight="normal">control software</text><rect x="12" y="248" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="266.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">Same discipline, very different stakes:</text><text x="20" y="281.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">an embedded crash could brake a car, a</text><text x="20" y="296.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">web bug costs a shopping cart.</text></svg>