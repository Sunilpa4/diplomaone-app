<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 312" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="312" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Levels of Testing</text><rect x="120.0" y="192" width="120" height="38" rx="6" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="180" y="210.2" font-size="9.0" text-anchor="middle" fill="#2E7D32" font-weight="bold">unit</text><text x="180" y="223.7" font-size="7.6" text-anchor="middle" fill="#666" font-weight="normal">each function/method alone</text><rect x="99.0" y="146" width="162" height="38" rx="6" fill="#E0F2F1" stroke="#00796B" stroke-width="1.2"/><text x="180" y="164.2" font-size="9.0" text-anchor="middle" fill="#00796B" font-weight="bold">integration</text><text x="180" y="177.7" font-size="7.6" text-anchor="middle" fill="#666" font-weight="normal">modules wired together</text><rect x="78.0" y="100" width="204" height="38" rx="6" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.2"/><text x="180" y="118.2" font-size="9.0" text-anchor="middle" fill="#E07B00" font-weight="bold">system</text><text x="180" y="131.7" font-size="7.6" text-anchor="middle" fill="#666" font-weight="normal">whole built product</text><rect x="57.0" y="54" width="246" height="38" rx="6" fill="#FDECEC" stroke="#C62828" stroke-width="1.2"/><text x="180" y="72.2" font-size="9.0" text-anchor="middle" fill="#C62828" font-weight="bold">acceptance</text><text x="180" y="85.7" font-size="7.6" text-anchor="middle" fill="#666" font-weight="normal">customer says yes</text><text x="316" y="54.6" font-size="7.4" text-anchor="end" fill="#666" font-weight="normal">broader up</text><path d="M322 200 L322 52" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="322,52 318,60 326,60" fill="#666"/><rect x="12" y="242" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="260.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">Bottom layers are cheap and narrow; top</text><text x="20" y="275.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">layers are realistic and costly. Alpha/</text><text x="20" y="290.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">beta live near acceptance level.</text></svg>