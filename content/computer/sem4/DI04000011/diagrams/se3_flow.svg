<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="340" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Flow Chart: Building the Schedule</text><rect x="70.0" y="46.0" width="220" height="28" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="63.0" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">list all tasks (WBS)</text><rect x="70.0" y="94.0" width="220" height="28" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="111.0" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">estimate each task</text><rect x="70.0" y="142.0" width="220" height="28" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="159.0" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">find dependencies</text><rect x="70.0" y="190.0" width="220" height="28" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="207.0" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">draw Gantt / burndown</text><rect x="70.0" y="238.0" width="220" height="28" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="255.0" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">track weekly; re-plan</text><path d="M180 74 L180 94" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180,94 176,87 184,87" fill="#666"/><path d="M180 122 L180 142" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180,142 176,135 184,135" fill="#666"/><path d="M180 170 L180 190" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180,190 176,183 184,183" fill="#666"/><path d="M180 218 L180 238" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180,238 176,231 184,231" fill="#666"/><path d="M290 252 L330 252 L330 60 L290 60" fill="none" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 3"/><path d="M290 60 L290 60" fill="none" stroke="#666" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><polygon points="290,60 284,68 296,68" fill="#666"/><text x="330" y="162.7" font-size="7.6" text-anchor="middle" fill="#666" font-weight="normal">loop back</text><rect x="12" y="278" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="296.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">Tracking never ends: every status note</text><text x="20" y="311.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">feeds the plan again. A schedule is a</text><text x="20" y="326.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">prediction ONE ITERATION away from wrong.</text></svg>