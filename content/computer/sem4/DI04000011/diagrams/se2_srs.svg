<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 324" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="324" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">SRS: Structure and Qualities</text><rect x="12" y="44" width="158" height="168" rx="8" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.3"/><text x="91" y="65.2" font-size="9.0" text-anchor="middle" fill="#7B2CD9" font-weight="bold">SRS skeleton</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="80.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">1. Introduction</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="94.3" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">   purpose, scope</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="107.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">2. Overall description</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="121.3" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">   users, constraints</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="134.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">3. Specific requirements</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="148.3" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">   functional +</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="161.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">   non-functional</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="175.3" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">4. Appendices</text><rect x="188" y="44" width="160" height="168" rx="8" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.3"/><text x="268" y="65.2" font-size="9.0" text-anchor="middle" fill="#2E7D32" font-weight="bold">a GOOD SRS is...</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="198" y="80.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">correct</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="198" y="95.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">unambiguous</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="198" y="110.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">complete</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="198" y="125.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">consistent</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="198" y="140.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">ranked (must/nice)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="198" y="155.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">verifiable</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="198" y="170.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">modifiable</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="198" y="185.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">traceable</text><rect x="12" y="230" width="336" height="85" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="248.2" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">'Unambiguous' is tested in exams: every</text><text x="20" y="263.1" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">sentence must have ONE meaning, else two</text><text x="20" y="278.1" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">developers build two different systems.</text><text x="20" y="293.1" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">Customer req = plain words of the client;</text><text x="20" y="308.1" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">functional req = testable system action.</text></svg>