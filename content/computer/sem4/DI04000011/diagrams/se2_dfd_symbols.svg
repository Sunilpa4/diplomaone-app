<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="340" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">DFD Symbols (Yourdon-DeMarco)</text><circle cx="66" cy="64" r="16" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.4"/><rect x="22" y="110" width="88" height="28" rx="2" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><path d="M26 178 L110 178" fill="none" stroke="#C62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M26 190 L110 190" fill="none" stroke="#C62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M26 244 L100 244" fill="none" stroke="#666" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="100,244 92,240 92,248" fill="#666"/><text x="126" y="70.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="bold">process</text><text x="232" y="69.8" font-size="8.0" text-anchor="start" fill="#666" font-weight="normal">action/work on data</text><text x="126" y="130.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="bold">external entity</text><text x="232" y="129.8" font-size="8.0" text-anchor="start" fill="#666" font-weight="normal">outside person/system</text><text x="126" y="190.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="bold">data store</text><text x="232" y="189.8" font-size="8.0" text-anchor="start" fill="#666" font-weight="normal">kept data (file/db)</text><text x="126" y="250.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="bold">data flow</text><text x="232" y="249.8" font-size="8.0" text-anchor="start" fill="#666" font-weight="normal">arrow with a label</text><rect x="12" y="276" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="294.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">Rule: data flows through processes; never</text><text x="20" y="309.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">entity-to-entity directly; every store is</text><text x="20" y="324.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">written/read only via a process bubble.</text></svg>