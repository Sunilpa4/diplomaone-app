<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 294" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="294" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Component Diagram: Food App Backend</text><rect x="14" y="52" width="150" height="150" rx="6" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><text x="89" y="71.1" font-size="8.8" text-anchor="middle" fill="#1565C0" font-weight="bold">OrderService</text><text x="141" y="60.3" font-size="6.6" text-anchor="middle" fill="#666" font-weight="normal">«component»</text><rect x="24" y="82" width="86" height="20" rx="2" fill="white" stroke="#1565C0" stroke-width="1.1"/><text x="67" y="98.5" font-size="7.2" text-anchor="middle" fill="#1565C0" font-weight="normal">order API</text><rect x="24" y="110" width="86" height="20" rx="2" fill="white" stroke="#1565C0" stroke-width="1.1"/><text x="67" y="126.5" font-size="7.2" text-anchor="middle" fill="#1565C0" font-weight="normal">menu cache</text><rect x="24" y="138" width="86" height="20" rx="2" fill="white" stroke="#1565C0" stroke-width="1.1"/><text x="67" y="154.5" font-size="7.2" text-anchor="middle" fill="#1565C0" font-weight="normal">DB writer</text><rect x="200" y="52" width="148" height="92" rx="6" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="274" y="71.1" font-size="8.8" text-anchor="middle" fill="#2E7D32" font-weight="bold">PaymentGateway</text><text x="322" y="60.3" font-size="6.6" text-anchor="middle" fill="#666" font-weight="normal">«component»</text><rect x="212" y="82" width="96" height="20" rx="2" fill="white" stroke="#2E7D32" stroke-width="1.1"/><text x="260" y="98.5" font-size="7.2" text-anchor="middle" fill="#2E7D32" font-weight="normal">charge card</text><rect x="200" y="158" width="148" height="44" rx="6" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.2"/><text x="274" y="177.1" font-size="8.8" text-anchor="middle" fill="#E07B00" font-weight="bold">Notifier</text><text x="322" y="166.3" font-size="6.6" text-anchor="middle" fill="#666" font-weight="normal">«component»</text><circle cx="166" cy="92" r="5" fill="none" stroke="#666" stroke-width="1.4"/><path d="M164 92 L200 92" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M164 180 L200 180" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M196 186 a6 6 0 0 1 0 -12" fill="none" stroke="#666" stroke-width="1.4"/><rect x="12" y="224" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="242.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">Box = a replaceable unit with its own</text><text x="20" y="257.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">interfaces. Lollipop = PROVIDED interface</text><text x="20" y="272.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">(order API); socket = REQUIRED one -</text><text x="20" y="287.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">components snap together via contracts.</text></svg>