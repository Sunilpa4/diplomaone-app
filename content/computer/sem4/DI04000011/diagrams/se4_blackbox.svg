<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 316" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="316" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Black-Box Testing: Inputs Only</text><rect x="22.0" y="59.0" width="96" height="30" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="70" y="77.0" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">test inputs</text><path d="M120 89 L126 89" fill="none" stroke="#666" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="132.0,89.0 125.0,85.5 125.0,92.5" fill="#666"/><rect x="136" y="62" width="96" height="54" rx="6" fill="#EEE" stroke="#666" stroke-width="1.4"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="184" y="92.7" font-size="7.8" text-anchor="middle" fill="#666" font-weight="bold">SYSTEM (opaque)</text><path d="M234 89 L262 89" fill="none" stroke="#666" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="268.0,89.0 261.0,85.5 261.0,92.5" fill="#666"/><rect x="244.0" y="59.0" width="108" height="30" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.6"/><text x="298" y="76.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">compare output</text><text x="180" y="150.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">no source code is read</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="166.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">techniques:</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="179.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">equivalence classes:  ages 5..60</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="192.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">  -&gt; test 10, 45 (valid) + -3, 90 (invalid)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="205.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">boundary values:   5, 60, 4, 61</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="218.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">cause-effect + error guessing</text><rect x="12" y="252" width="336" height="40" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="270.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">One class stands for a thousand inputs;</text><text x="20" y="285.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">boundaries are where bugs breed.</text></svg>