<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 316" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="316" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">V-Model: Every Build Step Pairs a Test</text><rect x="20" y="46" width="104" height="26" rx="6" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><text x="72.0" y="65.9" font-size="8.4" text-anchor="middle" fill="#1565C0" font-weight="bold">requirements</text><path d="M124 66 L154 90" fill="none" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="154,90 148,85 154,82" fill="#666"/><rect x="50" y="94" width="104" height="26" rx="6" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><text x="102.0" y="113.9" font-size="8.4" text-anchor="middle" fill="#1565C0" font-weight="bold">system design</text><path d="M154 114 L184 138" fill="none" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="184,138 178,133 184,130" fill="#666"/><rect x="80" y="142" width="104" height="26" rx="6" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><text x="132.0" y="161.9" font-size="8.4" text-anchor="middle" fill="#1565C0" font-weight="bold">module design</text><path d="M184 162 L214 186" fill="none" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="214,186 208,181 214,178" fill="#666"/><rect x="110" y="190" width="104" height="26" rx="6" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><text x="162.0" y="209.9" font-size="8.4" text-anchor="middle" fill="#1565C0" font-weight="bold">CODING</text><rect x="272" y="46" width="104" height="26" rx="6" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="324" y="65.9" font-size="8.4" text-anchor="middle" fill="#2E7D32" font-weight="bold">acceptance test</text><rect x="242" y="94" width="104" height="26" rx="6" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="294" y="113.9" font-size="8.4" text-anchor="middle" fill="#2E7D32" font-weight="bold">system test</text><rect x="212" y="142" width="104" height="26" rx="6" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="264" y="161.9" font-size="8.4" text-anchor="middle" fill="#2E7D32" font-weight="bold">integration test</text><path d="M124 60 L272 60" fill="none" stroke="#C62828" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 3"/><path d="M154 108 L242 108" fill="none" stroke="#C62828" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 3"/><path d="M184 156 L212 156" fill="none" stroke="#C62828" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 3"/><text x="180" y="238.9" font-size="8.2" text-anchor="middle" fill="#C62828" font-weight="normal">each left step writes its test PLAN</text><rect x="12" y="250" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="268.1" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">Testing is PLANNED opposite its build</text><text x="20" y="283.1" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">stage: acceptance test cases are written</text><text x="20" y="298.1" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">from requirements, long before code.</text><text x="20" y="313.1" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">Favoured where verification is audited.</text></svg>