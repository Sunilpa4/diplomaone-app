<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 326" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="326" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Software Engineering: A Layered Approach</text><rect x="24" y="46" width="312" height="48" rx="8" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.3"/><text x="180" y="67.5" font-size="10" text-anchor="middle" fill="#1565C0" font-weight="bold">TOOLS</text><text x="180" y="81.8" font-size="8.0" text-anchor="middle" fill="#666" font-weight="normal">editors, IDEs, testing</text><text x="180" y="92.8" font-size="8.0" text-anchor="middle" fill="#666" font-weight="normal">frameworks, CI pipelines</text><rect x="24" y="102" width="312" height="48" rx="8" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.3"/><text x="180" y="123.5" font-size="10" text-anchor="middle" fill="#2E7D32" font-weight="bold">METHODS</text><text x="180" y="137.8" font-size="8.0" text-anchor="middle" fill="#666" font-weight="normal">how-to: analysis, design,</text><text x="180" y="148.8" font-size="8.0" text-anchor="middle" fill="#666" font-weight="normal">coding + testing practices</text><rect x="24" y="158" width="312" height="48" rx="8" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.3"/><text x="180" y="179.5" font-size="10" text-anchor="middle" fill="#E07B00" font-weight="bold">PROCESS</text><text x="180" y="193.8" font-size="8.0" text-anchor="middle" fill="#666" font-weight="normal">the scaffold: activities,</text><text x="180" y="204.8" font-size="8.0" text-anchor="middle" fill="#666" font-weight="normal">milestones, quality gates</text><rect x="24" y="214" width="312" height="48" rx="8" fill="#FDECEC" stroke="#C62828" stroke-width="1.3"/><text x="180" y="235.5" font-size="10" text-anchor="middle" fill="#C62828" font-weight="bold">QUALITY FOCUS</text><text x="180" y="249.8" font-size="8.0" text-anchor="middle" fill="#666" font-weight="normal">the bedrock - every layer</text><text x="180" y="260.8" font-size="8.0" text-anchor="middle" fill="#666" font-weight="normal">serves quality</text><rect x="12" y="276" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="294.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">Read top-down: tools AUTOMATE methods;</text><text x="20" y="309.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">methods support the process; the process</text><text x="20" y="324.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">keeps quality on schedule.</text></svg>