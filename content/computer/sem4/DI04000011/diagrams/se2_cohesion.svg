<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 312" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="312" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Cohesion: Best to Worst</text><rect x="60" y="44" width="236" height="24" rx="6" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.1"/><text x="178.0" y="61.8" font-size="8.0" text-anchor="middle" fill="#2E7D32" font-weight="bold">functional  -  one clear job: addMarks()</text><text x="52" y="62.0" font-size="8.6" text-anchor="end" fill="#2E7D32" font-weight="bold">7</text><rect x="60" y="74" width="236" height="24" rx="6" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.1"/><text x="178.0" y="91.8" font-size="8.0" text-anchor="middle" fill="#2E7D32" font-weight="bold">sequential  -  output feeds next step</text><text x="52" y="92.0" font-size="8.6" text-anchor="end" fill="#2E7D32" font-weight="bold">6</text><rect x="60" y="104" width="236" height="24" rx="6" fill="#E0F2F1" stroke="#00796B" stroke-width="1.1"/><text x="178.0" y="121.8" font-size="8.0" text-anchor="middle" fill="#00796B" font-weight="bold">communicational  -  same data, few jobs</text><text x="52" y="122.0" font-size="8.6" text-anchor="end" fill="#00796B" font-weight="bold">5</text><rect x="60" y="134" width="236" height="24" rx="6" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.1"/><text x="178.0" y="151.8" font-size="8.0" text-anchor="middle" fill="#E07B00" font-weight="bold">procedural  -  a fixed sequence of steps</text><text x="52" y="152.0" font-size="8.6" text-anchor="end" fill="#E07B00" font-weight="bold">4</text><rect x="60" y="164" width="236" height="24" rx="6" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.1"/><text x="178.0" y="181.8" font-size="8.0" text-anchor="middle" fill="#E07B00" font-weight="bold">temporal  -  things done 'at the same time'</text><text x="52" y="182.0" font-size="8.6" text-anchor="end" fill="#E07B00" font-weight="bold">3</text><rect x="60" y="194" width="236" height="24" rx="6" fill="#FDECEC" stroke="#C62828" stroke-width="1.1"/><text x="178.0" y="211.8" font-size="8.0" text-anchor="middle" fill="#C62828" font-weight="bold">logical  -  'all the print functions'</text><text x="52" y="212.0" font-size="8.6" text-anchor="end" fill="#C62828" font-weight="bold">2</text><rect x="60" y="224" width="236" height="24" rx="6" fill="#FDECEC" stroke="#C62828" stroke-width="1.1"/><text x="178.0" y="241.8" font-size="8.0" text-anchor="middle" fill="#C62828" font-weight="bold">coincidental  -  laundry basket module</text><text x="52" y="242.0" font-size="8.6" text-anchor="end" fill="#C62828" font-weight="bold">1</text><text x="56" y="40.7" font-size="7.8" text-anchor="start" fill="#2E7D32" font-weight="normal">best</text><text x="56" y="250.7" font-size="7.8" text-anchor="start" fill="#C62828" font-weight="normal">worst</text><path d="M36 56 L36 232" fill="none" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="36,232 32,224 40,224" fill="#666"/><rect x="12" y="262" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="280.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">Cohesion = how strongly items INSIDE one</text><text x="20" y="295.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">module belong together. Aim functional;</text><text x="20" y="310.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">split anything coincidental.</text></svg>