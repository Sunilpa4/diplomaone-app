<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 236" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="236" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Client-Server: One Request Cycle</text><rect x="12" y="50" width="96" height="56" rx="8" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><text x="60" y="75.3" font-size="9.5" text-anchor="middle" fill="#1565C0" font-weight="bold">CLIENT</text><text x="60" y="88.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">browser</text><text x="60" y="100.7" font-size="7.6" text-anchor="middle" fill="#666" font-weight="normal">(Chrome...)</text><rect x="252" y="50" width="96" height="56" rx="8" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="300" y="69.3" font-size="9.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">SERVER</text><text x="300" y="82.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">Apache + PHP</text><text x="300" y="94.7" font-size="7.6" text-anchor="middle" fill="#666" font-weight="normal">runs the script</text><path d="M112 62 L242 62" fill="none" stroke="#222" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="248.0,62.0 241.0,58.5 241.0,65.5" fill="#222"/><text x="180" y="56.7" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">1. HTTP request: hello.php</text><text x="180" y="130.7" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">3. pure HTML comes back</text><path d="M248 140 L118 140" fill="none" stroke="#222" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="112.0,140.0 119.0,143.5 119.0,136.5" fill="#222"/><rect x="132" y="116" width="96" height="34" rx="7" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.2"/><text x="180" y="132.9" font-size="8.2" text-anchor="middle" fill="#E07B00" font-weight="bold">2. PHP engine</text><text x="180" y="144.7" font-size="7.6" text-anchor="middle" fill="#222" font-weight="normal">executes &lt;?php ?&gt;</text><path d="M300 106 L300 116" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="300.0,116.0 303.5,109.0 296.5,109.0" fill="#222"/><path d="M156 150 L156 150" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="156.0,150.0 149.0,146.5 149.0,153.5" fill="#222"/><rect x="12" y="176" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="194.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">The browser NEVER sees PHP source -</text><text x="20" y="209.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">only the HTML it echoes. Server-side</text><text x="20" y="224.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">means the logic (and secrets) stay home.</text></svg>