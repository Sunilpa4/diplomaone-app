<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 262" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="262" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">GET vs POST</text><rect x="12" y="46" width="158" height="120" rx="8" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><text x="91" y="66.5" font-size="10" text-anchor="middle" fill="#1565C0" font-weight="bold">GET</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="82.7" font-size="7.6" text-anchor="start" fill="#222" font-weight="normal">data in the URL</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="95.7" font-size="7.6" text-anchor="start" fill="#222" font-weight="normal">?city=Surat&amp;seats=2</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="108.7" font-size="7.6" text-anchor="start" fill="#222" font-weight="normal">bookmarkable</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="121.7" font-size="7.6" text-anchor="start" fill="#222" font-weight="normal">limited (~2KB)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="134.7" font-size="7.6" text-anchor="start" fill="#222" font-weight="normal">for SEARCHES</text><rect x="192" y="46" width="158" height="120" rx="8" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="271" y="66.5" font-size="10" text-anchor="middle" fill="#2E7D32" font-weight="bold">POST</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="204" y="82.7" font-size="7.6" text-anchor="start" fill="#222" font-weight="normal">data in the BODY</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="204" y="95.7" font-size="7.6" text-anchor="start" fill="#222" font-weight="normal">invisible in URL</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="204" y="108.7" font-size="7.6" text-anchor="start" fill="#222" font-weight="normal">no size limit</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="204" y="121.7" font-size="7.6" text-anchor="start" fill="#222" font-weight="normal">files need POST</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="204" y="134.7" font-size="7.6" text-anchor="start" fill="#222" font-weight="normal">for CHANGES</text><rect x="12" y="180" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="198.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">Rule of thumb: GET reads the world</text><text x="20" y="213.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">(search, filter); POST changes it</text><text x="20" y="228.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">(register, book, upload). Never put</text><text x="20" y="243.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">passwords in a GET URL.</text></svg>