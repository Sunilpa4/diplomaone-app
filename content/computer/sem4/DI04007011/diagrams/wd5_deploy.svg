<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 490" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="490" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Inventory Hosting: A Separate Checklist</text><rect x="12" y="44" width="336" height="35" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="24" y="56.9" font-size="8.3" text-anchor="start" fill="#1565C0" font-weight="bold">1  LOCAL PROOF</text><text x="24" y="71.5" font-size="7.2" text-anchor="start" fill="#222" font-weight="normal">CRUD, login/logout, CSRF, oversell and bad-input tests</text><path d="M180 79 L180 91" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,91.0 183.5,84.0 176.5,84.0" fill="#222"/><rect x="12" y="91" width="336" height="35" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="24" y="103.9" font-size="8.3" text-anchor="start" fill="#1565C0" font-weight="bold">2  BACKUP + EXPORT</text><text x="24" y="118.5" font-size="7.2" text-anchor="start" fill="#222" font-weight="normal">Export schema/data; keep a restorable local copy</text><path d="M180 126 L180 138" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,138.0 183.5,131.0 176.5,131.0" fill="#222"/><rect x="12" y="138" width="336" height="35" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="24" y="150.9" font-size="8.3" text-anchor="start" fill="#1565C0" font-weight="bold">3  HOST CAPABILITY</text><text x="24" y="165.5" font-size="7.2" text-anchor="start" fill="#222" font-weight="normal">Supported PHP + MySQLi/mysqlnd + MySQL-compatible DB</text><path d="M180 173 L180 185" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,185.0 183.5,178.0 176.5,178.0" fill="#222"/><rect x="12" y="185" width="336" height="35" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="24" y="197.9" font-size="8.3" text-anchor="start" fill="#1565C0" font-weight="bold">4  SECRETS + PRIVILEGES</text><text x="24" y="212.5" font-size="7.2" text-anchor="start" fill="#222" font-weight="normal">Unique DB account, ADMIN_HASH, no secrets in public files</text><path d="M180 220 L180 232" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,232.0 183.5,225.0 176.5,225.0" fill="#222"/><rect x="12" y="232" width="336" height="35" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.1"/><text x="24" y="244.9" font-size="8.3" text-anchor="start" fill="#2E7D32" font-weight="bold">5  DEPLOY + IMPORT</text><text x="24" y="259.5" font-size="7.2" text-anchor="start" fill="#222" font-weight="normal">Upload PHP files; import SQL into the selected database</text><path d="M180 267 L180 279" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,279.0 183.5,272.0 176.5,272.0" fill="#222"/><rect x="12" y="279" width="336" height="35" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.1"/><text x="24" y="291.9" font-size="8.3" text-anchor="start" fill="#2E7D32" font-weight="bold">6  HTTPS + SAFE ERRORS</text><text x="24" y="306.5" font-size="7.2" text-anchor="start" fill="#222" font-weight="normal">Secure session cookie; log details, hide debug output</text><path d="M180 314 L180 326" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,326.0 183.5,319.0 176.5,319.0" fill="#222"/><rect x="12" y="326" width="336" height="35" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.1"/><text x="24" y="338.9" font-size="8.3" text-anchor="start" fill="#2E7D32" font-weight="bold">7  REMOTE SMOKE TEST</text><text x="24" y="353.5" font-size="7.2" text-anchor="start" fill="#222" font-weight="normal">Guest blocked; CRUD/stock work; logout revokes access</text><path d="M180 361 L180 373" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,373.0 183.5,366.0 176.5,366.0" fill="#222"/><rect x="12" y="373" width="336" height="35" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.1"/><text x="24" y="385.9" font-size="8.3" text-anchor="start" fill="#2E7D32" font-weight="bold">8  OPERATE SAFELY</text><text x="24" y="400.5" font-size="7.2" text-anchor="start" fill="#222" font-weight="normal">Backups, updates, least privilege and access monitoring</text><rect x="12" y="434" width="336" height="40" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="452.1" font-size="8.9" text-anchor="start" fill="#222" font-weight="normal">The reference is locally execution-tested. This</text><text x="20" y="467.1" font-size="8.9" text-anchor="start" fill="#222" font-weight="normal">checklist is not a claim of external deployment.</text></svg>