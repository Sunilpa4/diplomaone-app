<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 342" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="342" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">From Browser Form to Stored Rows</text><rect x="12" y="46" width="336" height="48" rx="8" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.3"/><text x="180" y="64.3" font-size="9.3" text-anchor="middle" fill="#1565C0" font-weight="bold">BROWSER / PRESENTATION</text><text x="180" y="83.0" font-size="8.5" text-anchor="middle" fill="#222" font-weight="normal">HTML forms, links, rendered responses</text><rect x="12" y="118" width="336" height="48" rx="8" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.3"/><text x="180" y="136.3" font-size="9.3" text-anchor="middle" fill="#7B2CD9" font-weight="bold">PHP + MySQLi / APPLICATION</text><text x="180" y="155.0" font-size="8.5" text-anchor="middle" fill="#222" font-weight="normal">validate -&gt; prepare -&gt; bind -&gt; execute</text><rect x="12" y="190" width="336" height="48" rx="8" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.3"/><text x="180" y="208.3" font-size="9.3" text-anchor="middle" fill="#2E7D32" font-weight="bold">MySQL-COMPATIBLE SERVER / DATA</text><text x="180" y="227.0" font-size="8.5" text-anchor="middle" fill="#222" font-weight="normal">tables, keys, constraints, transactions</text><path d="M170 94 L170 118" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="170.0,118.0 173.5,111.0 166.5,111.0" fill="#1565C0"/><path d="M190 118 L190 94" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="190.0,94.0 186.5,101.0 193.5,101.0" fill="#2E7D32"/><path d="M170 166 L170 190" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="170.0,190.0 173.5,183.0 166.5,183.0" fill="#7B2CD9"/><path d="M190 190 L190 166" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="190.0,166.0 186.5,173.0 193.5,173.0" fill="#2E7D32"/><rect x="12" y="258" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="276.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">MySQLi is PHP's client API, not a database.</text><text x="20" y="291.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">phpMyAdmin is a web administration UI.</text><text x="20" y="306.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">The lesson runs real MySQLi against MariaDB,</text><text x="20" y="321.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">a MySQL-compatible server, not a SQL emulator.</text></svg>