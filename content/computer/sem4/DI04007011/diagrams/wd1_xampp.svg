<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 246" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="246" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">XAMPP: The Whole Lab in One Install</text><rect x="18" y="50" width="58" height="40" rx="8" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.2"/><text x="47" y="70.5" font-size="13" text-anchor="middle" fill="#7B2CD9" font-weight="bold">X</text><text x="47" y="83.7" font-size="7.6" text-anchor="middle" fill="#222" font-weight="normal">any OS</text><rect x="84" y="50" width="58" height="40" rx="8" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.2"/><text x="113" y="70.5" font-size="13" text-anchor="middle" fill="#7B2CD9" font-weight="bold">A</text><text x="113" y="83.7" font-size="7.6" text-anchor="middle" fill="#222" font-weight="normal">Apache</text><rect x="150" y="50" width="58" height="40" rx="8" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.2"/><text x="179" y="70.5" font-size="13" text-anchor="middle" fill="#7B2CD9" font-weight="bold">M</text><text x="179" y="83.7" font-size="7.6" text-anchor="middle" fill="#222" font-weight="normal">MariaDB</text><rect x="216" y="50" width="58" height="40" rx="8" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.2"/><text x="245" y="70.5" font-size="13" text-anchor="middle" fill="#7B2CD9" font-weight="bold">P</text><text x="245" y="83.7" font-size="7.6" text-anchor="middle" fill="#222" font-weight="normal">PHP</text><rect x="282" y="50" width="58" height="40" rx="8" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.2"/><text x="311" y="70.5" font-size="13" text-anchor="middle" fill="#7B2CD9" font-weight="bold">P</text><text x="311" y="83.7" font-size="7.6" text-anchor="middle" fill="#222" font-weight="normal">Perl</text><text x="16" y="119.0" font-size="8.6" text-anchor="start" fill="#222" font-weight="normal">1. install XAMPP (apachefriends.org)</text><text x="16" y="137.0" font-size="8.6" text-anchor="start" fill="#222" font-weight="normal">2. control panel  -&gt;  Start Apache</text><text x="16" y="155.0" font-size="8.6" text-anchor="start" fill="#222" font-weight="normal">3. save hello.php in htdocs/</text><text x="16" y="173.0" font-size="8.6" text-anchor="start" fill="#222" font-weight="normal">4. browse http://localhost/hello.php</text><rect x="12" y="188" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="206.2" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">Nothing goes live until Apache is green;</text><text x="20" y="221.2" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">404? file not under htdocs. Blank page?</text><text x="20" y="236.2" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">check PHP tags, then Apache error log.</text></svg>