<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 336" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="336" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">The Self-Processing Page Pattern</text><rect x="121.0" y="31.0" width="118" height="26" rx="13.0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.8"/><text x="180" y="48.2" font-size="12" text-anchor="middle" fill="#1B5E20" font-weight="bold">request arrives</text><path d="M180 57 L180 72" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,72.0 183.5,65.0 176.5,65.0" fill="#222"/><polygon points="180,80.0 235.0,102 180,124.0 125.0,102" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.8"/><text x="180" y="105.8" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">method POST?</text><rect x="6.0" y="143.0" width="100" height="30" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="56" y="161.0" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">show the form</text><path d="M125 102 L66 143" fill="none" stroke="#222" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><polygon points="66.0,143.0 67.0,149.6 71.9,146.2" fill="#222"/><text x="84" y="122.6" font-size="7.4" text-anchor="middle" fill="#1565C0" font-weight="normal">no / GET</text><rect x="248.0" y="143.0" width="104" height="30" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.6"/><text x="300" y="160.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">validate + process</text><path d="M235 102 L290 143" fill="none" stroke="#222" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><polygon points="290.0,143.0 284.1,146.2 289.0,149.6" fill="#222"/><text x="270" y="122.6" font-size="7.4" text-anchor="middle" fill="#2E7D32" font-weight="normal">yes</text><path d="M300 173 L300 200" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="300.0,200.0 303.5,193.0 296.5,193.0" fill="#222"/><rect x="248.0" y="202.0" width="104" height="28" rx="7" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.6"/><text x="300" y="218.8" font-size="8.0" text-anchor="middle" fill="#222" font-weight="normal">errors? show with data</text><path d="M56 173 L56 240" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="56.0,240.0 59.5,233.0 52.5,233.0" fill="#222"/><path d="M56 240 L180 240" fill="none" stroke="#222" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M300 230 L300 240" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="300.0,240.0 303.5,233.0 296.5,233.0" fill="#222"/><path d="M300 240 L180 240" fill="none" stroke="#222" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="105.0" y="245.0" width="150" height="26" rx="13.0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.8"/><text x="180" y="262.2" font-size="12" text-anchor="middle" fill="#1B5E20" font-weight="bold">one page.php does both</text><path d="M180 240 L180 245" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,245.0 183.5,238.0 176.5,238.0" fill="#222"/><rect x="12" y="282" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="300.1" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">if ($_SERVER['REQUEST_METHOD'] === 'POST')</text><text x="20" y="315.1" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">handle + validate; else render the form.</text><text x="20" y="330.1" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">Actionless: form posts back to itself.</text></svg>