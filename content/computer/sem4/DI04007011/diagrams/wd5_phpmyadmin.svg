<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="420" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">phpMyAdmin: Practical 19 Workflow</text><rect x="12" y="44" width="336" height="38" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><text x="24" y="58.9" font-size="8.4" text-anchor="start" fill="#1565C0" font-weight="bold">1  START SERVICES</text><text x="24" y="73.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">Local Apache/PHP + MySQL/MariaDB</text><path d="M180 82 L180 94" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,94.0 183.5,87.0 176.5,87.0" fill="#222"/><rect x="12" y="94" width="336" height="38" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><text x="24" y="108.9" font-size="8.4" text-anchor="start" fill="#1565C0" font-weight="bold">2  OPEN ADMIN UI</text><text x="24" y="123.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">localhost/phpmyadmin; sign in appropriately</text><path d="M180 132 L180 144" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,144.0 183.5,137.0 176.5,137.0" fill="#222"/><rect x="12" y="144" width="336" height="38" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="24" y="158.9" font-size="8.4" text-anchor="start" fill="#2E7D32" font-weight="bold">3  CREATE / SELECT DATABASE</text><text x="24" y="173.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">Choose utf8mb4; select it before SQL</text><path d="M180 182 L180 194" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,194.0 183.5,187.0 176.5,187.0" fill="#222"/><rect x="12" y="194" width="336" height="38" rx="7" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.2"/><text x="24" y="208.9" font-size="8.4" text-anchor="start" fill="#7B2CD9" font-weight="bold">4  SQL TAB</text><text x="24" y="223.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">CREATE / ALTER / INSERT / SELECT / UPDATE</text><path d="M180 232 L180 244" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,244.0 183.5,237.0 176.5,237.0" fill="#222"/><rect x="12" y="244" width="336" height="38" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="24" y="258.9" font-size="8.4" text-anchor="start" fill="#2E7D32" font-weight="bold">5  INSPECT RESULTS</text><text x="24" y="273.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">Structure = columns; Browse = stored rows</text><path d="M180 282 L180 294" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,294.0 183.5,287.0 176.5,287.0" fill="#222"/><rect x="12" y="294" width="336" height="38" rx="7" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.2"/><text x="24" y="308.9" font-size="8.4" text-anchor="start" fill="#E07B00" font-weight="bold">6  EXPORT BEFORE DESTRUCTIVE WORK</text><text x="24" y="323.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">Back up first; DROP only the scratch schema</text><rect x="12" y="350" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="368.1" font-size="8.9" text-anchor="start" fill="#222" font-weight="normal">SQL executes on the database server; the GUI</text><text x="20" y="383.1" font-size="8.9" text-anchor="start" fill="#222" font-weight="normal">helps manage it. Screens differ by version.</text><text x="20" y="398.1" font-size="8.9" text-anchor="start" fill="#222" font-weight="normal">Never expose a root/blank-password admin UI.</text></svg>