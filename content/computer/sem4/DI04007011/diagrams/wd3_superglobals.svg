<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 322" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="322" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">The Superglobals Map</text><rect x="12" y="46" width="104" height="24" rx="6" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="64" y="64.9" font-size="8.4" text-anchor="middle" fill="#2E7D32" font-weight="bold">$_GET</text><text x="126" y="64.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">URL query string data</text><rect x="12" y="76" width="104" height="24" rx="6" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="64" y="94.9" font-size="8.4" text-anchor="middle" fill="#2E7D32" font-weight="bold">$_POST</text><text x="126" y="94.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">form body data</text><rect x="12" y="106" width="104" height="24" rx="6" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="64" y="124.9" font-size="8.4" text-anchor="middle" fill="#1565C0" font-weight="bold">$_REQUEST</text><text x="126" y="124.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">GET + POST (+cookie)</text><rect x="12" y="136" width="104" height="24" rx="6" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="64" y="154.9" font-size="8.4" text-anchor="middle" fill="#E07B00" font-weight="bold">$_FILES</text><text x="126" y="154.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">uploaded file records</text><rect x="12" y="166" width="104" height="24" rx="6" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="64" y="184.9" font-size="8.4" text-anchor="middle" fill="#1565C0" font-weight="bold">$_SERVER</text><text x="126" y="184.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">method, paths, headers</text><rect x="12" y="196" width="104" height="24" rx="6" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="64" y="214.9" font-size="8.4" text-anchor="middle" fill="#7B2CD9" font-weight="bold">$_ENV</text><text x="126" y="214.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">environment variables</text><rect x="12" y="226" width="104" height="24" rx="6" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="64" y="244.9" font-size="8.4" text-anchor="middle" fill="#7B2CD9" font-weight="bold">$GLOBALS</text><text x="126" y="244.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">every global variable</text><rect x="12" y="262" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="280.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">Available in every scope - no global</text><text x="20" y="295.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">keyword needed. $_SESSION / $_COOKIE</text><text x="20" y="310.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">join the family in Unit 4.</text></svg>