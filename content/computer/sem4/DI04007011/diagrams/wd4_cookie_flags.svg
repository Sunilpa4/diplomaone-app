<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 336" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="336" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Cookie Options and Safe Defaults</text><rect x="12" y="44" width="76" height="25" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="50.0" y="59.2" font-size="7.8" text-anchor="middle" fill="#fff" font-weight="bold">option</text><rect x="88" y="44" width="260" height="25" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="218.0" y="59.2" font-size="7.8" text-anchor="middle" fill="#fff" font-weight="bold">meaning</text><rect x="12" y="69" width="76" height="25" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="50.0" y="84.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">expires</text><rect x="88" y="69" width="260" height="25" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="218.0" y="84.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">Timestamp; 0 = browser-session cookie</text><rect x="12" y="94" width="76" height="25" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="50.0" y="109.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">path</text><rect x="88" y="94" width="260" height="25" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="218.0" y="109.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">"/" makes it available across the site</text><rect x="12" y="119" width="76" height="25" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="50.0" y="134.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">domain</text><rect x="88" y="119" width="260" height="25" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="218.0" y="134.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">Omit for a host-only cookie</text><rect x="12" y="144" width="76" height="25" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="50.0" y="159.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">secure</text><rect x="88" y="144" width="260" height="25" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="218.0" y="159.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">Send only over HTTPS</text><rect x="12" y="169" width="76" height="25" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="50.0" y="184.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">httponly</text><rect x="88" y="169" width="260" height="25" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="218.0" y="184.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">Hide cookie from JavaScript access</text><rect x="12" y="194" width="76" height="25" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="50.0" y="209.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">samesite</text><rect x="88" y="194" width="260" height="25" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="218.0" y="209.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">Lax/Strict/None control cross-site sending</text><rect x="12" y="236" width="336" height="85" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="254.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">Production: HTTPS + Secure + HttpOnly + Lax.</text><text x="20" y="269.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">SameSite=None also requires Secure.</text><text x="20" y="284.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">Local HTTP demo: Secure must not be required.</text><text x="20" y="299.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">Cookies are editable: validate incoming values.</text><text x="20" y="314.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">Never store passwords or trust a role cookie.</text></svg>