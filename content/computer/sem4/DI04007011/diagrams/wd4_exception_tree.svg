<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 376" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="376" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Modern PHP: The Throwable Family</text><rect x="107.0" y="40.0" width="146" height="32" rx="7" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="59.3" font-size="9.5" text-anchor="middle" fill="#222" font-weight="normal">Throwable (interface)</text><path d="M180 72 L180 94 L84 94 L84 116" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="84.0,116.0 87.5,109.0 80.5,109.0" fill="#1565C0"/><path d="M180 94 L276 94 L276 116" fill="none" stroke="#C62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="276.0,116.0 279.5,109.0 272.5,109.0" fill="#C62828"/><rect x="14.0" y="116.0" width="140" height="32" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="84" y="135.5" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">Exception</text><rect x="206.0" y="116.0" width="140" height="32" rx="7" fill="#FDECEC" stroke="#C62828" stroke-width="1.6"/><text x="276" y="135.5" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">Error</text><path d="M84 148 L84 166" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="84.0,166.0 87.5,159.0 80.5,159.0" fill="#1565C0"/><path d="M276 148 L276 166" fill="none" stroke="#C62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="276.0,166.0 279.5,159.0 272.5,159.0" fill="#C62828"/><rect x="12" y="166" width="146" height="104" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="187.6" font-size="7.3" text-anchor="start" fill="#222" font-weight="normal">InvalidArgumentException</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="207.6" font-size="7.3" text-anchor="start" fill="#222" font-weight="normal">RuntimeException</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="227.6" font-size="7.3" text-anchor="start" fill="#222" font-weight="normal">  -&gt; your custom</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="247.6" font-size="7.3" text-anchor="start" fill="#222" font-weight="normal">     subclasses</text><rect x="202" y="166" width="146" height="104" rx="7" fill="#FDECEC" stroke="#C62828" stroke-width="1.1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="214" y="192.6" font-size="7.4" text-anchor="start" fill="#222" font-weight="normal">TypeError</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="214" y="214.6" font-size="7.4" text-anchor="start" fill="#222" font-weight="normal">DivisionByZeroError</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="214" y="236.6" font-size="7.4" text-anchor="start" fill="#222" font-weight="normal">... engine errors</text><rect x="12" y="290" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="308.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">catch (Exception $e) does NOT catch Error.</text><text x="20" y="323.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">catch (Throwable $t) can catch both families.</text><text x="20" y="338.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">Ordinary warnings/notices are not automatically</text><text x="20" y="353.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">exceptions. Prefer specific expected catches.</text></svg>