<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 296" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="296" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">foreach: Streaming an Array</text><rect x="20" y="54" width="130" height="96" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="85" y="72.9" font-size="8.4" text-anchor="middle" fill="#2E7D32" font-weight="bold">$fare map</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="32" y="88.7" font-size="7.8" text-anchor="start" fill="#222" font-weight="normal">"SRT" =&gt; 250</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="32" y="102.7" font-size="7.8" text-anchor="start" fill="#222" font-weight="normal">"BRC" =&gt; 120</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="32" y="116.7" font-size="7.8" text-anchor="start" fill="#222" font-weight="normal">"AMD" =&gt; 160</text><rect x="196" y="54" width="144" height="96" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><text x="268" y="72.9" font-size="8.4" text-anchor="middle" fill="#1565C0" font-weight="bold">each lap gives</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="206" y="88.7" font-size="7.8" text-anchor="start" fill="#222" font-weight="normal">foreach ($fare as</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="206" y="102.7" font-size="7.8" text-anchor="start" fill="#222" font-weight="normal">     $city =&gt; $amt) {</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="206" y="116.7" font-size="7.8" text-anchor="start" fill="#222" font-weight="normal">  echo "$city: $amt";</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="206" y="130.7" font-size="7.8" text-anchor="start" fill="#222" font-weight="normal">}</text><path d="M150 102 L190 102" fill="none" stroke="#222" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="196.0,102.0 189.0,98.5 189.0,105.5" fill="#222"/><text x="173" y="98.8" font-size="8.0" text-anchor="middle" fill="#666" font-weight="normal">as</text><rect x="20" y="162" width="320" height="40" rx="7" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.2"/><text x="180" y="180.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">output: SRT: 250 / BRC: 120 / AMD: 160</text><text x="180" y="195.7" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">key AND value per lap - no counter needed</text><rect x="12" y="214" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="232.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">foreach ($a as $v)         values only</text><text x="20" y="247.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">foreach ($a as $k =&gt; $v)  keys too.</text><text x="20" y="262.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">The array pointer crew (current, next,</text><text x="20" y="277.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">end...) is the manual gearbox.</text></svg>