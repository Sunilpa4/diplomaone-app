<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 364" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="364" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">A Cookie Takes Two Requests</text><rect x="14" y="48" width="112" height="28" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><text x="70" y="65.5" font-size="10" text-anchor="middle" fill="#1565C0" font-weight="bold">BROWSER</text><rect x="234" y="48" width="112" height="28" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="290" y="65.5" font-size="10" text-anchor="middle" fill="#2E7D32" font-weight="bold">PHP SERVER</text><path d="M70 78 V272" fill="none" stroke="#bbb" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><path d="M290 78 V272" fill="none" stroke="#bbb" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><path d="M70 105 L290 105" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="290.0,105.0 283.0,101.5 283.0,108.5" fill="#1565C0"/><text x="180" y="94.9" font-size="8.2" text-anchor="middle" fill="#1565C0" font-weight="normal">1. Request: no city cookie yet</text><path d="M290 145 L70 145" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="70.0,145.0 77.0,148.5 77.0,141.5" fill="#2E7D32"/><text x="180" y="134.8" font-size="8.0" text-anchor="middle" fill="#2E7D32" font-weight="normal">2. Response: Set-Cookie: city=Surat</text><rect x="14" y="162" width="112" height="32" rx="6" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.1"/><text x="70" y="175.8" font-size="8.1" text-anchor="middle" fill="#222" font-weight="normal">browser saves</text><text x="70" y="187.8" font-size="8.1" text-anchor="middle" fill="#222" font-weight="normal">city = Surat</text><path d="M70 223 L290 223" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="290.0,223.0 283.0,219.5 283.0,226.5" fill="#1565C0"/><text x="180" y="212.8" font-size="8.1" text-anchor="middle" fill="#1565C0" font-weight="normal">3. Next request: Cookie: city=Surat</text><rect x="224" y="240" width="126" height="36" rx="6" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="234" y="253.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">$_COOKIE["city"]</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="234" y="266.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">is now "Surat"</text><rect x="12" y="294" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="312.2" font-size="9.1" text-anchor="start" fill="#222" font-weight="normal">setcookie() queues a RESPONSE header.</text><text x="20" y="327.2" font-size="9.1" text-anchor="start" fill="#222" font-weight="normal">It does not change the incoming $_COOKIE.</text><text x="20" y="342.2" font-size="9.1" text-anchor="start" fill="#222" font-weight="normal">Read the new value on the NEXT request.</text></svg>