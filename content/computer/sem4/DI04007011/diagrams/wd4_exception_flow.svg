<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 456" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="456" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Exception Flow: Success and Failure</text><rect x="109.0" y="43.0" width="142" height="30" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="61.5" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">enter try</text><path d="M180 73 L180 100" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,100.0 183.5,93.0 176.5,93.0" fill="#222"/><polygon points="180,100.0 243.0,124 180,148.0 117.0,124" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.8"/><text x="180" y="127.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">exception thrown?</text><path d="M117 124 L70 124 L70 186" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="70.0,186.0 73.5,179.0 66.5,179.0" fill="#1565C0"/><text x="84" y="115.0" font-size="8.5" text-anchor="middle" fill="#1565C0" font-weight="normal">no</text><path d="M243 124 L290 124 L290 186" fill="none" stroke="#E07B00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="290.0,186.0 293.5,179.0 286.5,179.0" fill="#E07B00"/><text x="277" y="115.0" font-size="8.5" text-anchor="middle" fill="#E07B00" font-weight="normal">yes</text><rect x="14.0" y="186.0" width="112" height="36" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="70" y="207.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">rest of try runs</text><rect x="234.0" y="186.0" width="112" height="36" rx="7" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.6"/><text x="290" y="207.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">matching catch</text><text x="290" y="238.7" font-size="7.6" text-anchor="middle" fill="#E07B00" font-weight="normal">remaining try is skipped</text><path d="M70 222 L70 264 L180 264 L180 280" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,280.0 183.5,273.0 176.5,273.0" fill="#2E7D32"/><path d="M290 250 L290 264 L180 264" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,264.0 187.0,267.5 187.0,260.5" fill="#2E7D32"/><rect x="106.0" y="280.0" width="148" height="32" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="299.4" font-size="9.6" text-anchor="middle" fill="#222" font-weight="normal">finally: cleanup</text><path d="M180 312 L180 334" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,334.0 183.5,327.0 176.5,327.0" fill="#222"/><rect x="72.0" y="335.0" width="216" height="30" rx="15.0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.8"/><text x="180" y="353.1" font-size="8.9" text-anchor="middle" fill="#1B5E20" font-weight="bold">continue after handled result</text><rect x="12" y="386" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="404.1" font-size="8.9" text-anchor="start" fill="#222" font-weight="normal">No matching catch? finally runs, then the</text><text x="20" y="419.1" font-size="8.9" text-anchor="start" fill="#222" font-weight="normal">exception propagates to the caller.</text><text x="20" y="434.1" font-size="8.9" text-anchor="start" fill="#222" font-weight="normal">exit()/process termination can skip finally.</text></svg>