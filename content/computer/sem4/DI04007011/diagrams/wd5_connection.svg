<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 430" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="430" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">A MySQLi Connection's Working Life</text><rect x="12" y="44" width="336" height="36" rx="7" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.1"/><text x="24" y="57.9" font-size="8.3" text-anchor="start" fill="#E07B00" font-weight="bold">1  REPORT STRICT ERRORS</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="72.7" font-size="7.7" text-anchor="start" fill="#222" font-weight="normal">mysqli_report(MYSQLI_REPORT_ERROR | MYSQLI_REPORT_STRICT)</text><path d="M180 80 L180 92" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,92.0 183.5,85.0 176.5,85.0" fill="#222"/><rect x="12" y="92" width="336" height="36" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="24" y="105.9" font-size="8.3" text-anchor="start" fill="#1565C0" font-weight="bold">2  CONNECT + SELECT DATABASE</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="120.7" font-size="7.7" text-anchor="start" fill="#222" font-weight="normal">new mysqli(host, user, password, database)</text><path d="M180 128 L180 140" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,140.0 183.5,133.0 176.5,133.0" fill="#222"/><rect x="12" y="140" width="336" height="36" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="24" y="153.9" font-size="8.3" text-anchor="start" fill="#1565C0" font-weight="bold">3  SET THE CONNECTION CHARSET</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="168.7" font-size="7.7" text-anchor="start" fill="#222" font-weight="normal">set_charset("utf8mb4")</text><path d="M180 176 L180 188" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,188.0 183.5,181.0 176.5,181.0" fill="#222"/><rect x="12" y="188" width="336" height="36" rx="7" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.1"/><text x="24" y="201.9" font-size="8.3" text-anchor="start" fill="#7B2CD9" font-weight="bold">4  EXECUTE SQL</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="216.7" font-size="7.7" text-anchor="start" fill="#222" font-weight="normal">constant query OR prepared values</text><path d="M180 224 L180 236" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,236.0 183.5,229.0 176.5,229.0" fill="#222"/><rect x="12" y="236" width="336" height="36" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.1"/><text x="24" y="249.9" font-size="8.3" text-anchor="start" fill="#2E7D32" font-weight="bold">5  READ RESULT / CHECK WRITE</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="264.7" font-size="7.7" text-anchor="start" fill="#222" font-weight="normal">fetch_assoc / num_rows / affected_rows</text><path d="M180 272 L180 284" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,284.0 183.5,277.0 176.5,277.0" fill="#222"/><rect x="12" y="284" width="336" height="36" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.1"/><text x="24" y="297.9" font-size="8.3" text-anchor="start" fill="#2E7D32" font-weight="bold">6  RELEASE RESOURCES</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="312.7" font-size="7.7" text-anchor="start" fill="#222" font-weight="normal">free result -&gt; close statement / connection</text><rect x="12" y="346" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="364.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">Any database operation can fail. Catch known</text><text x="20" y="379.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">mysqli_sql_exception cases, log details safely,</text><text x="20" y="394.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">and show generic failures to public visitors.</text><text x="20" y="409.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">Do not publish connection passwords in a repo.</text></svg>