<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 296" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="296" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Reading and Writing Text Files</text><rect x="12" y="44" width="60" height="19" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="42.0" y="56.2" font-size="7.8" text-anchor="middle" fill="#fff" font-weight="bold">mode</text><rect x="72" y="44" width="138" height="19" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="141.0" y="56.2" font-size="7.8" text-anchor="middle" fill="#fff" font-weight="bold">works</text><rect x="210" y="44" width="138" height="19" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="279.0" y="56.2" font-size="7.8" text-anchor="middle" fill="#fff" font-weight="bold">watch out</text><rect x="12" y="63" width="60" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="42.0" y="75.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">"r"</text><rect x="72" y="63" width="138" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="141.0" y="75.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">read only</text><rect x="210" y="63" width="138" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="279.0" y="75.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">file must exist</text><rect x="12" y="82" width="60" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="42.0" y="94.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">"w"</text><rect x="72" y="82" width="138" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="141.0" y="94.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">write, TRUNCATES</text><rect x="210" y="82" width="138" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="279.0" y="94.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">old content lost</text><rect x="12" y="101" width="60" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="42.0" y="113.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">"a"</text><rect x="72" y="101" width="138" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="141.0" y="113.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">append at end</text><rect x="210" y="101" width="138" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="279.0" y="113.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">creates if missing</text><rect x="12" y="120" width="60" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="42.0" y="132.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">"w+"</text><rect x="72" y="120" width="138" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="141.0" y="132.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">read + write</text><rect x="210" y="120" width="138" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="279.0" y="132.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">truncates first!</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="16" y="142.7" font-size="7.8" text-anchor="start" fill="#222" font-weight="normal">$h = fopen("feedback.txt", "a");</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="16" y="156.7" font-size="7.8" text-anchor="start" fill="#222" font-weight="normal">fwrite($h, $line . "\n");</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="16" y="170.7" font-size="7.8" text-anchor="start" fill="#222" font-weight="normal">fclose($h);   // always close</text><rect x="12" y="196" width="336" height="30" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="180" y="212.9" font-size="8.2" text-anchor="middle" fill="#2E7D32" font-weight="bold">shortcuts:  file_put_contents(file, text, FILE_APPEND)</text><text x="180" y="225.8" font-size="8.0" text-anchor="middle" fill="#222" font-weight="normal">file_get_contents(file)  - one-call read</text><rect x="12" y="240" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="258.1" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">fopen/fwrite/fclose = the explicit trio;</text><text x="20" y="273.1" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">file_* = the one-liners. Check fopen</text><text x="20" y="288.1" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">returned false before writing.</text></svg>