<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 258" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="258" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Validation Pipeline</text><rect x="10" y="54" width="78" height="66" rx="7" fill="#FDECEC" stroke="#C62828" stroke-width="1.2"/><text x="49" y="74.9" font-size="8.4" text-anchor="middle" fill="#C62828" font-weight="bold">1 RAW</text><text x="49" y="92.5" font-size="7.0" text-anchor="middle" fill="#222" font-weight="normal">untrusted</text><text x="49" y="104.5" font-size="7.0" text-anchor="middle" fill="#222" font-weight="normal">as typed</text><rect x="98" y="54" width="78" height="66" rx="7" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.2"/><text x="137" y="74.9" font-size="8.4" text-anchor="middle" fill="#E07B00" font-weight="bold">2 CLEAN</text><text x="137" y="92.5" font-size="7.0" text-anchor="middle" fill="#222" font-weight="normal">trim+</text><text x="137" y="104.5" font-size="7.0" text-anchor="middle" fill="#222" font-weight="normal">stripslashes</text><rect x="186" y="54" width="78" height="66" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><text x="225" y="74.9" font-size="8.4" text-anchor="middle" fill="#1565C0" font-weight="bold">3 CHECK</text><text x="225" y="92.5" font-size="7.0" text-anchor="middle" fill="#222" font-weight="normal">empty / numeric</text><text x="225" y="104.5" font-size="7.0" text-anchor="middle" fill="#222" font-weight="normal">/ strlen / filter</text><rect x="274" y="54" width="78" height="66" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="313" y="74.9" font-size="8.4" text-anchor="middle" fill="#2E7D32" font-weight="bold">4 ESCAPE</text><text x="313" y="92.5" font-size="7.0" text-anchor="middle" fill="#222" font-weight="normal">htmlspecial-</text><text x="313" y="104.5" font-size="7.0" text-anchor="middle" fill="#222" font-weight="normal">chars() on echo</text><path d="M88 86 L92 86" fill="none" stroke="#666" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="98.0,86.0 91.0,82.5 91.0,89.5" fill="#666"/><path d="M176 86 L180 86" fill="none" stroke="#666" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="186.0,86.0 179.0,82.5 179.0,89.5" fill="#666"/><path d="M264 86 L268 86" fill="none" stroke="#666" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="274.0,86.0 267.0,82.5 267.0,89.5" fill="#666"/><rect x="12" y="140" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="158.2" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">Never trust the browser: every field gets</text><text x="20" y="173.2" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">isset() + empty() first, then type rules.</text><text x="20" y="188.2" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">SERVER checks even when HTML has required/</text><text x="20" y="203.2" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">maxlength - those are only hints.</text><rect x="12" y="210" width="336" height="34" rx="7" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.2"/><text x="180" y="226.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">remember: validation guards input, escaping guards output</text><text x="180" y="240.7" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">two different jobs at two different ends</text></svg>