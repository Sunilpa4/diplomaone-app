<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 246" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="246" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Variable Scope: Rooms of the Script</text><rect x="16" y="48" width="150" height="120" rx="8" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="91" y="69.0" font-size="8.6" text-anchor="middle" fill="#2E7D32" font-weight="bold">INSIDE function</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="28" y="86.7" font-size="7.6" text-anchor="start" fill="#222" font-weight="normal">function bill() {</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="28" y="99.7" font-size="7.6" text-anchor="start" fill="#222" font-weight="normal">  $tip = 5;   // local</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="28" y="112.7" font-size="7.6" text-anchor="start" fill="#222" font-weight="normal">  // $total ? no</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="28" y="125.7" font-size="7.6" text-anchor="start" fill="#222" font-weight="normal">  global $total;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="28" y="138.7" font-size="7.6" text-anchor="start" fill="#222" font-weight="normal">  $total += $tip;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="28" y="151.7" font-size="7.6" text-anchor="start" fill="#222" font-weight="normal">}</text><rect x="194" y="48" width="150" height="120" rx="8" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><text x="269" y="69.0" font-size="8.6" text-anchor="middle" fill="#1565C0" font-weight="bold">OUTSIDE (global)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="206" y="86.7" font-size="7.6" text-anchor="start" fill="#222" font-weight="normal">$total = 100;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="206" y="99.7" font-size="7.6" text-anchor="start" fill="#222" font-weight="normal">bill();</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="206" y="112.7" font-size="7.6" text-anchor="start" fill="#222" font-weight="normal">echo $total;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="206" y="125.7" font-size="7.6" text-anchor="start" fill="#222" font-weight="normal">// 105 - changed!</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="206" y="138.7" font-size="7.6" text-anchor="start" fill="#222" font-weight="normal">// $tip ? gone</text><path d="M166 128 L188 128" fill="none" stroke="#666" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="194.0,128.0 187.0,124.5 187.0,131.5" fill="#666"/><text x="180" y="118.7" font-size="7.8" text-anchor="middle" fill="#666" font-weight="bold">global</text><rect x="12" y="182" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="200.2" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">Local vars are born and die with the call.</text><text x="20" y="215.2" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">global $x; (or $GLOBALS['x']) opens the</text><text x="20" y="230.2" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">window. static $c remembers values</text><text x="20" y="245.2" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">between calls of the same function.</text></svg>