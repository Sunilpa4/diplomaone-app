<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 348" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="348" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Session ID Travels; Session Data Stays</text><rect x="12" y="48" width="120" height="136" rx="8" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><text x="72" y="69.5" font-size="10" text-anchor="middle" fill="#1565C0" font-weight="bold">BROWSER</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="93.7" font-size="7.8" text-anchor="start" fill="#222" font-weight="normal">Cookie:</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="105.7" font-size="7.8" text-anchor="start" fill="#222" font-weight="normal">PHPSESSID=</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="117.7" font-size="7.8" text-anchor="start" fill="#222" font-weight="normal">random-ID</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="129.7" font-size="7.8" text-anchor="start" fill="#222" font-weight="normal"></text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="141.7" font-size="7.8" text-anchor="start" fill="#222" font-weight="normal">No cart or user</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="153.7" font-size="7.8" text-anchor="start" fill="#222" font-weight="normal">data in this</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="165.7" font-size="7.8" text-anchor="start" fill="#222" font-weight="normal">cookie</text><rect x="210" y="48" width="138" height="136" rx="8" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="279" y="69.5" font-size="10" text-anchor="middle" fill="#2E7D32" font-weight="bold">SERVER STORE</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="220" y="93.7" font-size="7.8" text-anchor="start" fill="#222" font-weight="normal">random-ID =&gt;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="220" y="105.7" font-size="7.8" text-anchor="start" fill="#222" font-weight="normal">user: "Ravi"</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="220" y="117.7" font-size="7.8" text-anchor="start" fill="#222" font-weight="normal">seats: 1</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="220" y="129.7" font-size="7.8" text-anchor="start" fill="#222" font-weight="normal">visits: 2</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="220" y="141.7" font-size="7.8" text-anchor="start" fill="#222" font-weight="normal"></text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="220" y="153.7" font-size="7.8" text-anchor="start" fill="#222" font-weight="normal">file / database</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="220" y="165.7" font-size="7.8" text-anchor="start" fill="#222" font-weight="normal">or other store</text><path d="M132 110 L210 110" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="210.0,110.0 203.0,106.5 203.0,113.5" fill="#1565C0"/><text x="171" y="98.8" font-size="8.0" text-anchor="middle" fill="#1565C0" font-weight="normal">ID only</text><path d="M210 152 L132 152" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="132.0,152.0 139.0,155.5 139.0,148.5" fill="#2E7D32"/><text x="171" y="170.7" font-size="7.8" text-anchor="middle" fill="#2E7D32" font-weight="normal">new ID*</text><rect x="12" y="204" width="336" height="42" rx="7" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="218.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">session_start();    // create OR resume</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="233.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">$_SESSION["seats"] = 1;</text><rect x="12" y="264" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="282.1" font-size="8.9" text-anchor="start" fill="#222" font-weight="normal">Every participating page starts/resumes first.</text><text x="20" y="297.1" font-size="8.9" text-anchor="start" fill="#222" font-weight="normal">The same browser cookie selects the same data.</text><text x="20" y="312.1" font-size="8.9" text-anchor="start" fill="#222" font-weight="normal">*Set-Cookie is needed for a new/rotated ID,</text><text x="20" y="327.1" font-size="8.9" text-anchor="start" fill="#222" font-weight="normal">not necessarily on every response.</text></svg>