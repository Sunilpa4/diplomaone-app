<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="250" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Four Ways to Write a String</text><rect x="12" y="46" width="162" height="54" rx="8" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="93" y="64.9" font-size="8.4" text-anchor="middle" fill="#2E7D32" font-weight="bold">SINGLE QUOTES</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="93" y="79.8" font-size="8.0" text-anchor="middle" fill="#666" font-weight="normal">'Fare: $fare'</text><text x="93" y="93.7" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">literal - no expansion</text><rect x="186" y="46" width="162" height="54" rx="8" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><text x="267" y="64.9" font-size="8.4" text-anchor="middle" fill="#1565C0" font-weight="bold">DOUBLE QUOTES</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="267" y="79.8" font-size="8.0" text-anchor="middle" fill="#666" font-weight="normal">"Fare: $fare"</text><text x="267" y="93.7" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">variables expand in place</text><rect x="12" y="110" width="162" height="54" rx="8" fill="#E0F2F1" stroke="#00796B" stroke-width="1.2"/><text x="93" y="128.9" font-size="8.4" text-anchor="middle" fill="#00796B" font-weight="bold">HEREDOC  &lt;&lt;&lt;EOT</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="93" y="143.8" font-size="8.0" text-anchor="middle" fill="#666" font-weight="normal">multi-line, expands vars</text><text x="93" y="157.7" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">echo &lt;&lt;&lt;EOT ... EOT;</text><rect x="186" y="110" width="162" height="54" rx="8" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.2"/><text x="267" y="128.9" font-size="8.4" text-anchor="middle" fill="#E07B00" font-weight="bold">NOWDOC &lt;&lt;&lt;'EOT'</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="267" y="143.8" font-size="8.0" text-anchor="middle" fill="#666" font-weight="normal">multi-line, stays literal</text><text x="267" y="157.7" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">raw HTML / SQL blocks</text><rect x="12" y="182" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="200.2" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">heredoc = double quotes without quotes;</text><text x="20" y="215.2" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">nowdoc = single quotes without quotes.</text><text x="20" y="230.2" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">Escaping: \n newline, \$ literal dollar,</text><text x="20" y="245.2" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">htmlspecialchars() before echoing</text></svg>