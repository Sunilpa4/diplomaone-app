<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 272" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="272" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Four Loops, Four Personalities</text><rect x="12" y="48" width="162" height="56" rx="8" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="93" y="68.3" font-size="9.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">for</text><text x="93" y="81.7" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">known count</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="93" y="96.6" font-size="7.4" text-anchor="middle" fill="#666" font-weight="normal">for ($i=1; $i&lt;=5; $i++)</text><rect x="186" y="48" width="162" height="56" rx="8" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><text x="267" y="68.3" font-size="9.5" text-anchor="middle" fill="#1565C0" font-weight="bold">while</text><text x="267" y="81.7" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">pre-checked</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="267" y="96.6" font-size="7.4" text-anchor="middle" fill="#666" font-weight="normal">while ($row = fetch())</text><rect x="12" y="114" width="162" height="56" rx="8" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><text x="93" y="134.3" font-size="9.5" text-anchor="middle" fill="#1565C0" font-weight="bold">do-while</text><text x="93" y="147.7" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">runs once MINIMUM</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="93" y="162.6" font-size="7.4" text-anchor="middle" fill="#666" font-weight="normal">do {...} while ($more);</text><rect x="186" y="114" width="162" height="56" rx="8" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="267" y="134.3" font-size="9.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">foreach</text><text x="267" y="147.7" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">arrays (unit 2)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="267" y="162.6" font-size="7.4" text-anchor="middle" fill="#666" font-weight="normal">foreach ($a as $v)</text><rect x="12" y="188" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="206.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">break = exit the loop now;</text><text x="20" y="221.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">continue = skip to next lap.</text><text x="20" y="236.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">foreach is PHP's star player - forms,</text><text x="20" y="251.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">rows, arrays all stream through it.</text></svg>