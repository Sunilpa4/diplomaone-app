<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="420" fill="#ffffff"/><text x="180" y="22.7" font-size="13.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Login to Logout: The Session Gate</text><rect x="12" y="44" width="336" height="38" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><text x="24" y="59.0" font-size="8.5" text-anchor="start" fill="#1565C0" font-weight="bold">1  GUEST ASKS FOR DASHBOARD</text><text x="24" y="73.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">No session user -&gt; redirect to login</text><path d="M180 82 L180 94" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,94.0 183.5,87.0 176.5,87.0" fill="#222"/><rect x="12" y="94" width="336" height="38" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><text x="24" y="109.0" font-size="8.5" text-anchor="start" fill="#1565C0" font-weight="bold">2  LOGIN FORM POSTS CREDENTIALS</text><text x="24" y="123.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">Check CSRF + username + password_verify()</text><path d="M180 132 L180 144" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,144.0 183.5,137.0 176.5,137.0" fill="#222"/><rect x="12" y="144" width="336" height="38" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="24" y="159.0" font-size="8.5" text-anchor="start" fill="#2E7D32" font-weight="bold">3  SUCCESS: ROTATE THE SESSION ID</text><text x="24" y="173.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">session_regenerate_id(true); save session user</text><path d="M180 182 L180 194" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,194.0 183.5,187.0 176.5,187.0" fill="#222"/><rect x="12" y="194" width="336" height="38" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="24" y="209.0" font-size="8.5" text-anchor="start" fill="#2E7D32" font-weight="bold">4  DASHBOARD GUARD PASSES</text><text x="24" y="223.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">Read server-side user; escape it before HTML</text><path d="M180 232 L180 244" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,244.0 183.5,237.0 176.5,237.0" fill="#222"/><rect x="12" y="244" width="336" height="38" rx="7" fill="#FDECEC" stroke="#C62828" stroke-width="1.2"/><text x="24" y="259.0" font-size="8.5" text-anchor="start" fill="#C62828" font-weight="bold">5  LOGOUT: VALID-TOKEN POST</text><text x="24" y="273.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">Clear variables + expire cookie + destroy</text><path d="M180 282 L180 294" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,294.0 183.5,287.0 176.5,287.0" fill="#222"/><rect x="12" y="294" width="336" height="38" rx="7" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.2"/><text x="24" y="309.0" font-size="8.5" text-anchor="start" fill="#E07B00" font-weight="bold">6  DASHBOARD GUARD FAILS AGAIN</text><text x="24" y="323.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">Direct URL access redirects back to login</text><rect x="12" y="350" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="368.1" font-size="8.9" text-anchor="start" fill="#222" font-weight="normal">Check authentication on EVERY protected page.</text><text x="20" y="383.1" font-size="8.9" text-anchor="start" fill="#222" font-weight="normal">Hiding a link is not protection. Wrong password</text><text x="20" y="398.1" font-size="8.9" text-anchor="start" fill="#222" font-weight="normal">must never create an authenticated session.</text></svg>