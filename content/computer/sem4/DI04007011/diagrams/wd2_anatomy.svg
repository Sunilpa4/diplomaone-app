<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 246" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="246" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Anatomy of a PHP Function</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="66.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">function fare($km, $rate = 1.2) {</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="81.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">    $total = 250 + $km * $rate;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="96.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">    return $total;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="111.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">}</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="126.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal"></text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="141.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">echo fare(265);   // 318 + 250 = 568</text><path d="M196 61 L230 61" fill="none" stroke="#2E7D32" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="236.0,61.0 229.0,57.5 229.0,64.5" fill="#2E7D32"/><text x="238" y="66.7" font-size="7.8" text-anchor="start" fill="#2E7D32" font-weight="bold">name + params (in)</text><path d="M196 76 L230 76" fill="none" stroke="#E07B00" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="236.0,76.0 229.0,72.5 229.0,79.5" fill="#E07B00"/><text x="238" y="81.7" font-size="7.8" text-anchor="start" fill="#E07B00" font-weight="bold">default if skipped</text><path d="M196 91 L230 91" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="236.0,91.0 229.0,87.5 229.0,94.5" fill="#1565C0"/><text x="238" y="96.7" font-size="7.8" text-anchor="start" fill="#1565C0" font-weight="bold">return: value back</text><path d="M196 151 L230 151" fill="none" stroke="#7B2CD9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="236.0,151.0 229.0,147.5 229.0,154.5" fill="#7B2CD9"/><text x="238" y="156.7" font-size="7.8" text-anchor="start" fill="#7B2CD9" font-weight="bold">call: name(args)</text><rect x="12" y="178" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="196.2" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">params = inputs at the doorway; return =</text><text x="20" y="211.2" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">exactly one value back; the body never</text><text x="20" y="226.2" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">echoes - it COMPUTES. Name rule: letter or</text><text x="20" y="241.2" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">underscore first, no $ on the name.</text></svg>