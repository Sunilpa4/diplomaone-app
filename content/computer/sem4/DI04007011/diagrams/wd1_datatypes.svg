<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 268" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="268" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">PHP Data Types (Loosely Typed)</text><rect x="12" y="44" width="96" height="19" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="60.0" y="56.2" font-size="7.8" text-anchor="middle" fill="#fff" font-weight="bold">type</text><rect x="108" y="44" width="110" height="19" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="163.0" y="56.2" font-size="7.8" text-anchor="middle" fill="#fff" font-weight="bold">example</text><rect x="218" y="44" width="130" height="19" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="283.0" y="56.2" font-size="7.8" text-anchor="middle" fill="#fff" font-weight="bold">notes</text><rect x="12" y="63" width="96" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="60.0" y="75.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">int</text><rect x="108" y="63" width="110" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="163.0" y="75.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">42, -7</text><rect x="218" y="63" width="130" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="283.0" y="75.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">whole numbers</text><rect x="12" y="82" width="96" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="60.0" y="94.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">float</text><rect x="108" y="82" width="110" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="163.0" y="94.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">3.14, 2e3</text><rect x="218" y="82" width="130" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="283.0" y="94.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">aka double</text><rect x="12" y="101" width="96" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="60.0" y="113.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">string</text><rect x="108" y="101" width="110" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="163.0" y="113.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">"hi", 'yo'</text><rect x="218" y="101" width="130" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="283.0" y="113.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">quotes both work</text><rect x="12" y="120" width="96" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="60.0" y="132.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">bool</text><rect x="108" y="120" width="110" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="163.0" y="132.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">true, false</text><rect x="218" y="120" width="130" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="283.0" y="132.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">logic values</text><rect x="12" y="139" width="96" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="60.0" y="151.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">NULL</text><rect x="108" y="139" width="110" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="163.0" y="151.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">no value yet</text><rect x="218" y="139" width="130" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="283.0" y="151.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">case-insensitive</text><rect x="12" y="158" width="96" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="60.0" y="170.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">array</text><rect x="108" y="158" width="110" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="163.0" y="170.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">[1,2,3]</text><rect x="218" y="158" width="130" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="283.0" y="170.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">unit 2 in depth</text><rect x="12" y="177" width="96" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="60.0" y="189.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">object</text><rect x="108" y="177" width="110" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="163.0" y="189.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">new Class()</text><rect x="218" y="177" width="130" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="283.0" y="189.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">unit 5 (MVC)</text><rect x="12" y="208" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="226.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">No declaration of types: $x = 5; makes an</text><text x="20" y="241.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">int, $x = "five"; turns it into a string.</text><text x="20" y="256.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">var_dump($x) reveals type AND value.</text></svg>