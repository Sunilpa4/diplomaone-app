<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 286" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="286" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">mail(): Anatomy of Sending</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="60.7" font-size="7.8" text-anchor="start" fill="#222" font-weight="normal">mail($to, $subject, $body, $headers);</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="74.7" font-size="7.8" text-anchor="start" fill="#222" font-weight="normal"></text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="88.7" font-size="7.8" text-anchor="start" fill="#222" font-weight="normal">$to      = "user@gmail.com";</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="102.7" font-size="7.8" text-anchor="start" fill="#222" font-weight="normal">$subject = "Welcome to BusBook";</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="116.7" font-size="7.8" text-anchor="start" fill="#222" font-weight="normal">$body    = plain text  or  HTML;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="130.7" font-size="7.8" text-anchor="start" fill="#222" font-weight="normal">$headers = "From: admin@busbook.in\r\n" .</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="144.7" font-size="7.8" text-anchor="start" fill="#222" font-weight="normal">           "Content-Type: text/html";</text><rect x="12" y="168" width="106" height="18" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="65.0" y="179.7" font-size="7.6" text-anchor="middle" fill="#fff" font-weight="bold">plain text</text><rect x="118" y="168" width="108" height="18" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="172.0" y="179.7" font-size="7.6" text-anchor="middle" fill="#fff" font-weight="bold">HTML email</text><rect x="226" y="168" width="122" height="18" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="287.0" y="179.7" font-size="7.6" text-anchor="middle" fill="#fff" font-weight="bold">attachment</text><rect x="12" y="186" width="106" height="18" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="65.0" y="197.7" font-size="7.6" text-anchor="middle" fill="#222" font-weight="normal">bare body</text><rect x="118" y="186" width="108" height="18" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="172.0" y="197.7" font-size="7.6" text-anchor="middle" fill="#222" font-weight="normal">add header:</text><rect x="226" y="186" width="122" height="18" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="287.0" y="197.7" font-size="7.6" text-anchor="middle" fill="#222" font-weight="normal">MIME multipart</text><rect x="12" y="204" width="106" height="18" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="65.0" y="215.7" font-size="7.6" text-anchor="middle" fill="#222" font-weight="normal">default type</text><rect x="118" y="204" width="108" height="18" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="172.0" y="215.7" font-size="7.6" text-anchor="middle" fill="#222" font-weight="normal">text/html</text><rect x="226" y="204" width="122" height="18" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="287.0" y="215.7" font-size="7.6" text-anchor="middle" fill="#222" font-weight="normal">base64 chunks</text><rect x="12" y="232" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="250.2" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">XAMPP on localhost: mail() needs an SMTP</text><text x="20" y="265.1" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">setup (or it returns false). Compose and</text><text x="20" y="280.1" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">verify the message first; wire SMTP later.</text></svg>