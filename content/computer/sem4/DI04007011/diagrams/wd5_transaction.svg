<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 398" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="398" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Transaction: All Writes or No Writes</text><rect x="90.0" y="43.0" width="180" height="30" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="61.4" font-size="9.7" text-anchor="middle" fill="#222" font-weight="normal">begin_transaction()</text><path d="M180 73 L180 98" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,98.0 183.5,91.0 176.5,91.0" fill="#222"/><rect x="51.0" y="98.0" width="258" height="44" rx="7" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="117.7" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">decrement stock if enough</text><text x="180" y="128.7" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">+ insert movement record</text><path d="M180 142 L180 166" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,166.0 183.5,159.0 176.5,159.0" fill="#222"/><polygon points="180,166.0 257.0,190 180,214.0 103.0,190" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.8"/><text x="180" y="193.0" font-size="8.7" text-anchor="middle" fill="#222" font-weight="normal">all checks/writes OK?</text><path d="M103 190 L80 190 L80 252" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="80.0,252.0 83.5,245.0 76.5,245.0" fill="#2E7D32"/><path d="M257 190 L280 190 L280 252" fill="none" stroke="#C62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="280.0,252.0 283.5,245.0 276.5,245.0" fill="#C62828"/><text x="76" y="179.9" font-size="8.4" text-anchor="middle" fill="#2E7D32" font-weight="normal">yes</text><text x="283" y="179.8" font-size="8.0" text-anchor="middle" fill="#C62828" font-weight="normal">no / throw</text><rect x="11.0" y="252.0" width="138" height="36" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.6"/><text x="80" y="273.0" font-size="8.7" text-anchor="middle" fill="#222" font-weight="normal">commit: keep both</text><rect x="211.0" y="252.0" width="138" height="36" rx="7" fill="#FDECEC" stroke="#C62828" stroke-width="1.6"/><text x="280" y="273.0" font-size="8.7" text-anchor="middle" fill="#222" font-weight="normal">rollback: undo both</text><rect x="12" y="314" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="332.0" font-size="8.7" text-anchor="start" fill="#222" font-weight="normal">InnoDB is required for these transactional writes.</text><text x="20" y="347.0" font-size="8.7" text-anchor="start" fill="#222" font-weight="normal">5 - 2 succeeds; selling 9 of the remaining 3 fails.</text><text x="20" y="362.0" font-size="8.7" text-anchor="start" fill="#222" font-weight="normal">Final qty = 3, successful movements = 1.</text><text x="20" y="377.0" font-size="8.7" text-anchor="start" fill="#222" font-weight="normal">CREATE/ALTER/DROP can cause implicit commits.</text></svg>