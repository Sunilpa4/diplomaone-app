<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="240" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Three Flavours of PHP Arrays</text><rect x="12" y="46" width="108" height="120" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="66" y="65.0" font-size="8.6" text-anchor="middle" fill="#2E7D32" font-weight="bold">INDEXED</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="80.6" font-size="7.4" text-anchor="start" fill="#222" font-weight="normal">$c = ["Surat",</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="92.6" font-size="7.4" text-anchor="start" fill="#222" font-weight="normal">        "Bharuch"];</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="104.6" font-size="7.4" text-anchor="start" fill="#222" font-weight="normal">// keys are</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="116.6" font-size="7.4" text-anchor="start" fill="#222" font-weight="normal">// 0, 1 auto</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="128.6" font-size="7.4" text-anchor="start" fill="#222" font-weight="normal">echo $c[0];</text><rect x="126" y="46" width="108" height="120" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><text x="180" y="64.9" font-size="8.2" text-anchor="middle" fill="#1565C0" font-weight="bold">ASSOCIATIVE</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="136" y="80.6" font-size="7.4" text-anchor="start" fill="#222" font-weight="normal">$f = ["SRT"=&gt;250,</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="136" y="92.6" font-size="7.4" text-anchor="start" fill="#222" font-weight="normal">      "BRC"=&gt;120];</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="136" y="104.6" font-size="7.4" text-anchor="start" fill="#222" font-weight="normal">// named keys</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="136" y="116.6" font-size="7.4" text-anchor="start" fill="#222" font-weight="normal">echo $f['SRT'];</text><rect x="240" y="46" width="108" height="120" rx="7" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.2"/><text x="294" y="65.0" font-size="8.6" text-anchor="middle" fill="#E07B00" font-weight="bold">MULTI-DIM</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="250" y="80.6" font-size="7.4" text-anchor="start" fill="#222" font-weight="normal">$bus = [</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="250" y="92.6" font-size="7.4" text-anchor="start" fill="#222" font-weight="normal">  ["id"=&gt;7,</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="250" y="104.6" font-size="7.4" text-anchor="start" fill="#222" font-weight="normal">   "seats"=&gt;40],</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="250" y="116.6" font-size="7.4" text-anchor="start" fill="#222" font-weight="normal"> ];</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="250" y="128.6" font-size="7.4" text-anchor="start" fill="#222" font-weight="normal">echo $bus[0]</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="250" y="140.6" font-size="7.4" text-anchor="start" fill="#222" font-weight="normal">     ["seats"];</text><rect x="12" y="180" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="198.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">One array type, three habits: numeric</text><text x="20" y="213.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">positions, named keys, or arrays-in-arrays.</text><text x="20" y="228.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">count($a) measures any of them.</text></svg>