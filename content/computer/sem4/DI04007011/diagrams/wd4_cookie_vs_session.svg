<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 362" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="362" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Cookies vs Sessions</text><rect x="12" y="44" width="78" height="25" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="51.0" y="59.1" font-size="7.4" text-anchor="middle" fill="#fff" font-weight="bold">feature</text><rect x="90" y="44" width="129" height="25" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="154.5" y="59.1" font-size="7.4" text-anchor="middle" fill="#fff" font-weight="bold">cookie value</text><rect x="219" y="44" width="129" height="25" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="283.5" y="59.1" font-size="7.4" text-anchor="middle" fill="#fff" font-weight="bold">session data</text><rect x="12" y="69" width="78" height="25" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="51.0" y="84.1" font-size="7.4" text-anchor="middle" fill="#222" font-weight="normal">stored at</text><rect x="90" y="69" width="129" height="25" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="154.5" y="84.1" font-size="7.4" text-anchor="middle" fill="#222" font-weight="normal">browser</text><rect x="219" y="69" width="129" height="25" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="283.5" y="84.1" font-size="7.4" text-anchor="middle" fill="#222" font-weight="normal">server</text><rect x="12" y="94" width="78" height="25" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="51.0" y="109.1" font-size="7.4" text-anchor="middle" fill="#222" font-weight="normal">request sends</text><rect x="90" y="94" width="129" height="25" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="154.5" y="109.1" font-size="7.4" text-anchor="middle" fill="#222" font-weight="normal">the value</text><rect x="219" y="94" width="129" height="25" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="283.5" y="109.1" font-size="7.4" text-anchor="middle" fill="#222" font-weight="normal">usually just an ID</text><rect x="12" y="119" width="78" height="25" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="51.0" y="134.1" font-size="7.4" text-anchor="middle" fill="#222" font-weight="normal">capacity</text><rect x="90" y="119" width="129" height="25" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="154.5" y="134.1" font-size="7.4" text-anchor="middle" fill="#222" font-weight="normal">small (~4 KB each)</text><rect x="219" y="119" width="129" height="25" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="283.5" y="134.1" font-size="7.4" text-anchor="middle" fill="#222" font-weight="normal">server limits apply</text><rect x="12" y="144" width="78" height="25" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="51.0" y="159.1" font-size="7.4" text-anchor="middle" fill="#222" font-weight="normal">lifetime</text><rect x="90" y="144" width="129" height="25" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="154.5" y="159.1" font-size="7.4" text-anchor="middle" fill="#222" font-weight="normal">expiry/browser policy</text><rect x="219" y="144" width="129" height="25" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="283.5" y="159.1" font-size="7.4" text-anchor="middle" fill="#222" font-weight="normal">server expiry policy</text><rect x="12" y="169" width="78" height="25" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="51.0" y="184.1" font-size="7.4" text-anchor="middle" fill="#222" font-weight="normal">control</text><rect x="90" y="169" width="129" height="25" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="154.5" y="184.1" font-size="7.4" text-anchor="middle" fill="#222" font-weight="normal">client can edit it</text><rect x="219" y="169" width="129" height="25" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="283.5" y="184.1" font-size="7.4" text-anchor="middle" fill="#222" font-weight="normal">app controls values</text><rect x="12" y="194" width="78" height="25" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="51.0" y="209.1" font-size="7.4" text-anchor="middle" fill="#222" font-weight="normal">risk</text><rect x="90" y="194" width="129" height="25" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="154.5" y="209.1" font-size="7.4" text-anchor="middle" fill="#222" font-weight="normal">tampered value</text><rect x="219" y="194" width="129" height="25" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="283.5" y="209.1" font-size="7.4" text-anchor="middle" fill="#222" font-weight="normal">stolen session ID</text><rect x="12" y="219" width="78" height="25" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="51.0" y="234.1" font-size="7.4" text-anchor="middle" fill="#222" font-weight="normal">good for</text><rect x="90" y="219" width="129" height="25" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="154.5" y="234.1" font-size="7.4" text-anchor="middle" fill="#222" font-weight="normal">theme / language</text><rect x="219" y="219" width="129" height="25" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="283.5" y="234.1" font-size="7.4" text-anchor="middle" fill="#222" font-weight="normal">login / cart / flash</text><rect x="12" y="262" width="336" height="85" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="280.1" font-size="8.9" text-anchor="start" fill="#222" font-weight="normal">Sessions often USE a cookie to carry the ID.</text><text x="20" y="295.1" font-size="8.9" text-anchor="start" fill="#222" font-weight="normal">They are not independent alternatives at the</text><text x="20" y="310.1" font-size="8.9" text-anchor="start" fill="#222" font-weight="normal">transport layer. Protect the ID with HTTPS,</text><text x="20" y="325.1" font-size="8.9" text-anchor="start" fill="#222" font-weight="normal">HttpOnly and regeneration after login.</text><text x="20" y="340.1" font-size="8.9" text-anchor="start" fill="#222" font-weight="normal">Browser-close is not a reliable logout policy.</text></svg>