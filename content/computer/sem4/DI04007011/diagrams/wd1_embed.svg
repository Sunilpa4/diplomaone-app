<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 284" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="284" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Embedding PHP Inside HTML</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="60.7" font-size="7.8" text-anchor="start" fill="#222" font-weight="normal">&lt;h1&gt;Bus Booking&lt;/h1&gt;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="73.7" font-size="7.8" text-anchor="start" fill="#222" font-weight="normal">&lt;p&gt;Today: &lt;?php echo date('d M'); ?&gt;&lt;/p&gt;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="86.7" font-size="7.8" text-anchor="start" fill="#222" font-weight="normal">&lt;?php</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="99.7" font-size="7.8" text-anchor="start" fill="#222" font-weight="normal">  $seats = 40 - 3;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="112.7" font-size="7.8" text-anchor="start" fill="#222" font-weight="normal">  echo "&lt;b&gt;Seats left: $seats&lt;/b&gt;";</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="125.7" font-size="7.8" text-anchor="start" fill="#222" font-weight="normal">?&gt;</text><text x="14" y="50.9" font-size="8.2" text-anchor="start" fill="#7B2CD9" font-weight="bold">page.php  (what you write)</text><path d="M250 92 L330 92" fill="none" stroke="#222" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="336.0,92.0 329.0,88.5 329.0,95.5" fill="#222"/><rect x="24" y="150" width="312" height="62" rx="8" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="180" y="168.9" font-size="8.4" text-anchor="middle" fill="#2E7D32" font-weight="bold">BROWSER RECEIVES (pure HTML)</text><text x="180" y="184.9" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">Bus Booking (as h1)   |   Today: 29 Oct</text><text x="180" y="200.9" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">Seats left: 37 (bold)</text><rect x="12" y="224" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="242.2" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">&lt;?php ... ?&gt; islands can appear anywhere;</text><text x="20" y="257.1" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">the engine replaces each with its output,</text><text x="20" y="272.1" font-size="9.0" text-anchor="start" fill="#222" font-weight="normal">then ships one flat HTML document.</text></svg>