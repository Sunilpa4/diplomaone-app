<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 358" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="358" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Cookie Lifecycle: Same Name and Path</text><rect x="12" y="44" width="336" height="46" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><text x="22" y="59.8" font-size="8.1" text-anchor="start" fill="#1565C0" font-weight="bold">CREATE</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="105" y="59.6" font-size="7.4" text-anchor="start" fill="#222" font-weight="normal">setcookie("city", "Surat", options)</text><text x="22" y="78.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">Browser saves it after the response</text><path d="M180 90 L180 104" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,104.0 183.5,97.0 176.5,97.0" fill="#222"/><rect x="12" y="104" width="336" height="46" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="22" y="119.8" font-size="8.1" text-anchor="start" fill="#2E7D32" font-weight="bold">READ</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="105" y="119.6" font-size="7.4" text-anchor="start" fill="#222" font-weight="normal">$_COOKIE["city"] ?? "default"</text><text x="22" y="138.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">Incoming request values are client-controlled</text><path d="M180 150 L180 164" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,164.0 183.5,157.0 176.5,157.0" fill="#222"/><rect x="12" y="164" width="336" height="46" rx="7" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.2"/><text x="22" y="179.8" font-size="8.1" text-anchor="start" fill="#E07B00" font-weight="bold">UPDATE</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="105" y="179.6" font-size="7.4" text-anchor="start" fill="#222" font-weight="normal">setcookie("city", "Vadodara", options)</text><text x="22" y="198.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">Same name/domain/path replaces the value</text><path d="M180 210 L180 224" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,224.0 183.5,217.0 176.5,217.0" fill="#222"/><rect x="12" y="224" width="336" height="46" rx="7" fill="#FDECEC" stroke="#C62828" stroke-width="1.2"/><text x="22" y="239.8" font-size="8.1" text-anchor="start" fill="#C62828" font-weight="bold">DELETE</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="105" y="239.6" font-size="7.4" text-anchor="start" fill="#222" font-weight="normal">expires =&gt; time() - 3600</text><text x="22" y="258.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">Expire the matching name/domain/path cookie</text><rect x="12" y="290" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="308.1" font-size="8.9" text-anchor="start" fill="#222" font-weight="normal">Deletion is also a response: the browser stops</text><text x="20" y="323.1" font-size="8.9" text-anchor="start" fill="#222" font-weight="normal">sending the cookie on the next request.</text><text x="20" y="338.1" font-size="8.9" text-anchor="start" fill="#222" font-weight="normal">unset($_COOKIE[...]) alone is NOT deletion.</text></svg>