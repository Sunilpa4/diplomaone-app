<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 362" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="362" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">CRUD: HTTP Action, SQL and Evidence</text><rect x="12" y="44" width="54" height="29" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="39.0" y="61.0" font-size="7.2" text-anchor="middle" fill="#fff" font-weight="bold">action</text><rect x="66" y="44" width="44" height="29" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="88.0" y="61.0" font-size="7.2" text-anchor="middle" fill="#fff" font-weight="bold">HTTP</text><rect x="110" y="44" width="142" height="29" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="181.0" y="61.0" font-size="7.2" text-anchor="middle" fill="#fff" font-weight="bold">SQL</text><rect x="252" y="44" width="96" height="29" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="300.0" y="61.0" font-size="7.2" text-anchor="middle" fill="#fff" font-weight="bold">evidence</text><rect x="12" y="73" width="54" height="29" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="39.0" y="90.0" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">Create</text><rect x="66" y="73" width="44" height="29" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="88.0" y="90.0" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">POST</text><rect x="110" y="73" width="142" height="29" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="181.0" y="90.0" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">INSERT ... VALUES (?,?)</text><rect x="252" y="73" width="96" height="29" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="300.0" y="90.0" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">insert_id</text><rect x="12" y="102" width="54" height="29" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="39.0" y="119.0" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">Read</text><rect x="66" y="102" width="44" height="29" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="88.0" y="119.0" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">GET</text><rect x="110" y="102" width="142" height="29" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="181.0" y="119.0" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">SELECT ... WHERE id=?</text><rect x="252" y="102" width="96" height="29" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="300.0" y="119.0" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">result rows</text><rect x="12" y="131" width="54" height="29" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="39.0" y="148.0" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">Update</text><rect x="66" y="131" width="44" height="29" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="88.0" y="148.0" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">POST</text><rect x="110" y="131" width="142" height="29" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="181.0" y="148.0" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">UPDATE ... WHERE id=?</text><rect x="252" y="131" width="96" height="29" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="300.0" y="148.0" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">affected_rows</text><rect x="12" y="160" width="54" height="29" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="39.0" y="177.0" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">Delete</text><rect x="66" y="160" width="44" height="29" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="88.0" y="177.0" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">POST</text><rect x="110" y="160" width="142" height="29" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="181.0" y="177.0" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">DELETE ... WHERE id=?</text><rect x="252" y="160" width="96" height="29" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="300.0" y="177.0" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">affected_rows</text><rect x="12" y="218" width="72" height="40" rx="6" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="48" y="240.8" font-size="7.9" text-anchor="middle" fill="#1565C0" font-weight="bold">FORM</text><path d="M84 238 L100 238" fill="none" stroke="#666" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="100.0,238.0 93.0,234.5 93.0,241.5" fill="#666"/><rect x="100" y="218" width="72" height="40" rx="6" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.1"/><text x="136" y="240.8" font-size="7.9" text-anchor="middle" fill="#E07B00" font-weight="bold">CHECK</text><path d="M172 238 L188 238" fill="none" stroke="#666" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="188.0,238.0 181.0,234.5 181.0,241.5" fill="#666"/><rect x="188" y="218" width="72" height="40" rx="6" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.1"/><text x="224" y="240.8" font-size="7.9" text-anchor="middle" fill="#7B2CD9" font-weight="bold">PREPARE</text><path d="M260 238 L276 238" fill="none" stroke="#666" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="276.0,238.0 269.0,234.5 269.0,241.5" fill="#666"/><rect x="276" y="218" width="72" height="40" rx="6" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.1"/><text x="312" y="240.8" font-size="7.9" text-anchor="middle" fill="#2E7D32" font-weight="bold">303 -&gt; GET</text><rect x="12" y="278" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="296.0" font-size="8.7" text-anchor="start" fill="#222" font-weight="normal">Validate values + ID, check CSRF and authorisation.</text><text x="20" y="311.0" font-size="8.7" text-anchor="start" fill="#222" font-weight="normal">No WHERE in UPDATE/DELETE can change every row.</text><text x="20" y="326.0" font-size="8.7" text-anchor="start" fill="#222" font-weight="normal">A GET link must not delete records.</text><text x="20" y="341.0" font-size="8.7" text-anchor="start" fill="#222" font-weight="normal">UPDATE affected_rows=0 can also mean unchanged.</text></svg>