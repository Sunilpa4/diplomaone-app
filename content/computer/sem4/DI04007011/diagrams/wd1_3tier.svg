" font-weight="normal">MySQL tables, files</text><rect x="30" y="240" width="300" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="38" y="258.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">request flows DOWN the tiers;</text><text x="38" y="273.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">response bubbles back UP.</text><text x="38" y="288.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">Development: one laptop hosts all three.</text></svg>