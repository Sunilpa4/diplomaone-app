<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 366" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="366" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">SQL Injection: Code vs Literal Data</text><rect x="12" y="44" width="336" height="100" rx="8" fill="#FDECEC" stroke="#C62828" stroke-width="1.2"/><text x="24" y="63.0" font-size="8.5" text-anchor="start" fill="#C62828" font-weight="bold">UNSAFE CONCATENATION - isolated anti-example</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="86.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">input: missing' OR '1'='1</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="104.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">WHERE name='$input'</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="122.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">SQL syntax changes -&gt; all 3 seed rows</text><rect x="12" y="162" width="336" height="100" rx="8" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="24" y="181.2" font-size="9.0" text-anchor="start" fill="#2E7D32" font-weight="bold">PREPARED SQL + SEPARATE VALUE</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="204.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">WHERE name=?</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="222.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">bind the entire input as ONE value</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="240.8" font-size="8.0" text-anchor="start" fill="#222" font-weight="normal">No exact name match -&gt; 0 rows</text><rect x="12" y="282" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="300.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">A real name like O'Neil works without SQL surgery.</text><text x="20" y="315.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">Do not try to fix injection with HTML escaping.</text><text x="20" y="330.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">Prepared values + allowlisted identifiers +</text><text x="20" y="345.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">least-privilege accounts are complementary.</text></svg>