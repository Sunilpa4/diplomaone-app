<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 366" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="366" fill="#ffffff"/><text x="180" y="22.7" font-size="13.3" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Prepared Statements Keep Values Separate</text><rect x="12" y="44" width="336" height="44" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="59.7" font-size="7.8" text-anchor="start" fill="#222" font-weight="normal">INSERT INTO students(name,marks)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="74.7" font-size="7.8" text-anchor="start" fill="#222" font-weight="normal">VALUES (?, ?)   // placeholders are NOT quoted</text><rect x="12" y="104" width="336" height="42" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="119.8" font-size="7.9" text-anchor="start" fill="#222" font-weight="normal">$name = "O'Neil";   $marks = 88;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="134.8" font-size="7.9" text-anchor="start" fill="#222" font-weight="normal">bind_param("si", $name, $marks);</text><path d="M180 88 L180 104" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,104.0 183.5,97.0 176.5,97.0" fill="#7B2CD9"/><path d="M180 146 L180 164" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,164.0 183.5,157.0 176.5,157.0" fill="#7B2CD9"/><rect x="75.0" y="164.0" width="210" height="32" rx="7" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="183.3" font-size="9.3" text-anchor="middle" fill="#222" font-weight="normal">prepare -&gt; bind -&gt; execute</text><path d="M180 196 L180 218" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,218.0 183.5,211.0 176.5,211.0" fill="#7B2CD9"/><rect x="12" y="218" width="336" height="44" rx="7" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.2"/><text x="180" y="234.0" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">SELECT: get_result -&gt; fetch rows</text><text x="180" y="251.0" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">WRITE: affected_rows / insert_id</text><rect x="12" y="282" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="300.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">Types: i integer, d double, s string, b blob.</text><text x="20" y="315.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">Variables bind by reference; change values and</text><text x="20" y="330.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">execute again. Count/type order must match ?.</text><text x="20" y="345.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">? is for values, not table/column names.</text></svg>