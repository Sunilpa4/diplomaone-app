<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="250" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">By Value vs By Reference</text><rect x="12" y="46" width="158" height="128" rx="8" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><text x="91" y="67.0" font-size="8.6" text-anchor="middle" fill="#1565C0" font-weight="bold">BY VALUE (copy)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="84.7" font-size="7.6" text-anchor="start" fill="#222" font-weight="normal">function add($n) {</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="97.7" font-size="7.6" text-anchor="start" fill="#222" font-weight="normal">    $n += 10;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="110.7" font-size="7.6" text-anchor="start" fill="#222" font-weight="normal">}</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="123.7" font-size="7.6" text-anchor="start" fill="#222" font-weight="normal">$x = 5;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="136.7" font-size="7.6" text-anchor="start" fill="#222" font-weight="normal">add($x);</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="149.7" font-size="7.6" text-anchor="start" fill="#222" font-weight="normal">// $x still 5</text><rect x="192" y="46" width="158" height="128" rx="8" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.2"/><text x="271" y="67.0" font-size="8.6" text-anchor="middle" fill="#E07B00" font-weight="bold">BY REFERENCE (&amp;)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="204" y="84.7" font-size="7.6" text-anchor="start" fill="#222" font-weight="normal">function add(&amp;$n) {</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="204" y="97.7" font-size="7.6" text-anchor="start" fill="#222" font-weight="normal">    $n += 10;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="204" y="110.7" font-size="7.6" text-anchor="start" fill="#222" font-weight="normal">}</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="204" y="123.7" font-size="7.6" text-anchor="start" fill="#222" font-weight="normal">$x = 5;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="204" y="136.7" font-size="7.6" text-anchor="start" fill="#222" font-weight="normal">add($x);</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="204" y="149.7" font-size="7.6" text-anchor="start" fill="#222" font-weight="normal">// $x is 15 !</text><rect x="12" y="188" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="206.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">Default: PHP photocopies the argument -</text><text x="20" y="221.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">the original survives the call. With &amp; the</text><text x="20" y="236.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">function borrows the ORIGINAL box itself:</text><text x="20" y="251.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">swap($a,$b) style updates need it.</text></svg>