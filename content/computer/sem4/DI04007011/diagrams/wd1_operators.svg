<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 296" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="296" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">PHP Operator Families</text><rect x="12" y="44" width="92" height="19" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="58.0" y="56.2" font-size="7.8" text-anchor="middle" fill="#fff" font-weight="bold">family</text><rect x="104" y="44" width="132" height="19" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="170.0" y="56.2" font-size="7.8" text-anchor="middle" fill="#fff" font-weight="bold">symbols</text><rect x="236" y="44" width="112" height="19" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="292.0" y="56.2" font-size="7.8" text-anchor="middle" fill="#fff" font-weight="bold">use</text><rect x="12" y="63" width="92" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="58.0" y="75.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">arithmetic</text><rect x="104" y="63" width="132" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="170.0" y="75.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">+ - * / % **</text><rect x="236" y="63" width="112" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="292.0" y="75.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">math on numbers</text><rect x="12" y="82" width="92" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="58.0" y="94.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">assignment</text><rect x="104" y="82" width="132" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="170.0" y="94.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">= += .= </text><rect x="236" y="82" width="112" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="292.0" y="94.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">store into vars</text><rect x="12" y="101" width="92" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="58.0" y="113.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">comparison</text><rect x="104" y="101" width="132" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="170.0" y="113.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">== === != &lt; &gt;  &lt;=&gt;</text><rect x="236" y="101" width="112" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="292.0" y="113.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">test values</text><rect x="12" y="120" width="92" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="58.0" y="132.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">logical</text><rect x="104" y="120" width="132" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="170.0" y="132.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">&amp;&amp; || ! and or</text><rect x="236" y="120" width="112" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="292.0" y="132.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">combine tests</text><rect x="12" y="139" width="92" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="58.0" y="151.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">string</text><rect x="104" y="139" width="132" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="170.0" y="151.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">.  .=</text><rect x="236" y="139" width="112" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="292.0" y="151.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">glue text</text><rect x="12" y="158" width="92" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="58.0" y="170.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">incr/decr</text><rect x="104" y="158" width="132" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="170.0" y="170.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">++$i  $i--</text><rect x="236" y="158" width="112" height="19" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="292.0" y="170.2" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">loop counters</text><rect x="12" y="188" width="336" height="36" rx="7" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.2"/><text x="180" y="205.9" font-size="8.2" text-anchor="middle" fill="#E07B00" font-weight="bold">== loose (5 == "5" is true)   === strict (also types)</text><text x="180" y="218.7" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">always prefer === in form checks</text><rect x="12" y="236" width="336" height="40" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="254.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">Spaceship &lt;=&gt; returns -1, 0 or 1 - the</text><text x="20" y="269.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">heart of custom sorting callbacks.</text></svg>