<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 468" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="468" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">The same properties, both ways</text><text x="180" y="49.7" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal">Elasticity is a benefit and a cost risk</text><rect x="20.0" y="64.0" width="150" height="48" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="95" y="91.8" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">ADVANTAGES</text><rect x="190.0" y="64.0" width="150" height="48" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="265" y="91.8" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">DISADVANTAGES</text><rect x="20.0" y="133.0" width="150" height="42" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="95" y="157.6" font-size="10.4" text-anchor="middle" fill="#222" font-weight="normal">No capital spend</text><rect x="190.0" y="133.0" width="150" height="42" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="265" y="157.6" font-size="10.4" text-anchor="middle" fill="#222" font-weight="normal">Recurring bill</text><rect x="20.0" y="185.0" width="150" height="42" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="95" y="209.6" font-size="10.4" text-anchor="middle" fill="#222" font-weight="normal">Elastic capacity</text><rect x="190.0" y="185.0" width="150" height="42" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="265" y="209.6" font-size="10.4" text-anchor="middle" fill="#222" font-weight="normal">Link dependency</text><rect x="20.0" y="237.0" width="150" height="42" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="95" y="261.6" font-size="10.4" text-anchor="middle" fill="#222" font-weight="normal">Global regions</text><rect x="190.0" y="237.0" width="150" height="42" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="265" y="261.6" font-size="10.4" text-anchor="middle" fill="#222" font-weight="normal">Egress charges</text><rect x="20.0" y="289.0" width="150" height="42" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="95" y="313.6" font-size="10.4" text-anchor="middle" fill="#222" font-weight="normal">Managed services</text><rect x="190.0" y="289.0" width="150" height="42" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="265" y="313.6" font-size="10.4" text-anchor="middle" fill="#222" font-weight="normal">Vendor lock-in</text><rect x="20.0" y="341.0" width="150" height="42" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="95" y="365.6" font-size="10.4" text-anchor="middle" fill="#222" font-weight="normal">Fast experiments</text><rect x="190.0" y="341.0" width="150" height="42" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="265" y="365.6" font-size="10.4" text-anchor="middle" fill="#222" font-weight="normal">Limited control</text><text x="180" y="423.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Choose by workload: spiky and new → cloud;</text><text x="180" y="439.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">stable, local, real-time → owned hardware.</text></svg>