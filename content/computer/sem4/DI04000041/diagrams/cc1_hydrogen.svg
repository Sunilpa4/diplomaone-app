<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 510" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="510" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">From stack sensor to dashboard</text><text x="180" y="49.7" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal">Safety control stays local; analytics moves up</text><rect x="18.0" y="66.0" width="324" height="56" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="91.3" font-size="11.2" text-anchor="middle" fill="#222" font-weight="normal">1. Sensors and gateway</text><text x="180" y="104.5" font-size="11.2" text-anchor="middle" fill="#222" font-weight="normal">Current, temperature, pressure, purity</text><rect x="18.0" y="146.0" width="324" height="56" rx="7" fill="#F2EBFA" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="171.3" font-size="11.2" text-anchor="middle" fill="#222" font-weight="normal">2. Cloud ingest endpoint</text><text x="180" y="184.5" font-size="11.2" text-anchor="middle" fill="#222" font-weight="normal">Fixed interval, authenticated upload</text><rect x="18.0" y="226.0" width="324" height="56" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="251.3" font-size="11.2" text-anchor="middle" fill="#222" font-weight="normal">3. Store</text><text x="180" y="264.5" font-size="11.2" text-anchor="middle" fill="#222" font-weight="normal">Raw object storage + time-series index</text><rect x="18.0" y="306.0" width="324" height="56" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="331.3" font-size="11.2" text-anchor="middle" fill="#222" font-weight="normal">4. Analyse and predict</text><text x="180" y="344.5" font-size="11.2" text-anchor="middle" fill="#222" font-weight="normal">Drift, efficiency, maintenance model</text><rect x="18.0" y="386.0" width="324" height="56" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="411.3" font-size="11.2" text-anchor="middle" fill="#222" font-weight="normal">5. Dashboards</text><text x="180" y="424.5" font-size="11.2" text-anchor="middle" fill="#222" font-weight="normal">Plant, fleet and savings on a phone</text><path d="M180 124 L180 141" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,141.0 183.5,134.0 176.5,134.0" fill="#7B2CD9"/><path d="M180 204 L180 221" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,221.0 183.5,214.0 176.5,214.0" fill="#7B2CD9"/><path d="M180 284 L180 301" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,301.0 183.5,294.0 176.5,294.0" fill="#7B2CD9"/><path d="M180 364 L180 381" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,381.0 183.5,374.0 176.5,374.0" fill="#7B2CD9"/><text x="180" y="477.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">A trip loop cannot wait for a round trip.</text><text x="180" y="493.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Region choice is a legal decision, not only latency.</text></svg>