<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 508" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="508" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Six ideas that carry the model</text><text x="180" y="49.7" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal">Remove one and the economics collapses</text><rect x="18" y="66" width="324" height="58" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="92.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">1. Resource pooling</text><text x="180" y="108.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">One hardware pool serves many customers</text><rect x="18" y="134" width="324" height="58" rx="8" fill="#F2EBFA" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="160.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">2. Virtualization</text><text x="180" y="176.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">A hypervisor slices host into isolated VMs</text><rect x="18" y="202" width="324" height="58" rx="8" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="228.2" font-size="12" text-anchor="middle" fill="#2E7D32" font-weight="bold">3. Elasticity</text><text x="180" y="244.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Capacity follows load, up and down</text><rect x="18" y="270" width="324" height="58" rx="8" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="296.2" font-size="12" text-anchor="middle" fill="#B66A00" font-weight="bold">4. Self-service</text><text x="180" y="312.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Portal or API provisions, not a ticket</text><rect x="18" y="338" width="324" height="58" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="364.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">5. Measured service</text><text x="180" y="380.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Usage metered, reported and billed</text><rect x="18" y="406" width="324" height="58" rx="8" fill="#F2EBFA" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="432.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">6. Automation</text><text x="180" y="448.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Templates and infrastructure as code</text><text x="180" y="485.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">These are mechanisms; the characteristics are their outcome.</text></svg>