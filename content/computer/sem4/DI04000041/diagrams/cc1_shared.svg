<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 466" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="466" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Two halves of one contract</text><text x="180" y="49.7" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal">The certificate covers only the left half</text><rect x="20.0" y="68.0" width="150" height="56" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="95" y="93.4" font-size="10.6" text-anchor="middle" fill="#222" font-weight="normal">PROVIDER</text><text x="95" y="106.0" font-size="10.6" text-anchor="middle" fill="#222" font-weight="normal">secures the cloud OF</text><rect x="190.0" y="68.0" width="150" height="56" rx="7" fill="#F2EBFA" stroke="#7B2CD9" stroke-width="1.6"/><text x="265" y="93.4" font-size="10.6" text-anchor="middle" fill="#222" font-weight="normal">CUSTOMER</text><text x="265" y="106.0" font-size="10.6" text-anchor="middle" fill="#222" font-weight="normal">secures what is IN</text><rect x="20.0" y="143.0" width="150" height="46" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="95" y="169.6" font-size="10.2" text-anchor="middle" fill="#222" font-weight="normal">Facility and power</text><rect x="190.0" y="143.0" width="150" height="46" rx="7" fill="#F2EBFA" stroke="#7B2CD9" stroke-width="1.6"/><text x="265" y="169.6" font-size="10.2" text-anchor="middle" fill="#222" font-weight="normal">Guest OS patches</text><rect x="20.0" y="199.0" width="150" height="46" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="95" y="225.6" font-size="10.2" text-anchor="middle" fill="#222" font-weight="normal">Servers and disks</text><rect x="190.0" y="199.0" width="150" height="46" rx="7" fill="#F2EBFA" stroke="#7B2CD9" stroke-width="1.6"/><text x="265" y="225.6" font-size="10.2" text-anchor="middle" fill="#222" font-weight="normal">Identities and keys</text><rect x="20.0" y="255.0" width="150" height="46" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="95" y="281.6" font-size="10.2" text-anchor="middle" fill="#222" font-weight="normal">Network fabric</text><rect x="190.0" y="255.0" width="150" height="46" rx="7" fill="#F2EBFA" stroke="#7B2CD9" stroke-width="1.6"/><text x="265" y="281.6" font-size="10.2" text-anchor="middle" fill="#222" font-weight="normal">Data and backups</text><rect x="20.0" y="311.0" width="150" height="46" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="95" y="337.6" font-size="10.2" text-anchor="middle" fill="#222" font-weight="normal">Hypervisor isolation</text><rect x="190.0" y="311.0" width="150" height="46" rx="7" fill="#F2EBFA" stroke="#7B2CD9" stroke-width="1.6"/><text x="265" y="337.6" font-size="10.2" text-anchor="middle" fill="#222" font-weight="normal">App configuration</text><rect x="18" y="382" width="324" height="42" rx="8" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="406.8" font-size="10.8" text-anchor="middle" fill="#B66A00" font-weight="bold">Most incidents land on the right-hand side</text><text x="180" y="441.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">A public bucket is the customer's failure, not the provider's.</text></svg>