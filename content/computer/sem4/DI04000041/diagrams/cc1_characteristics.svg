<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 524" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="524" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">A service needs all five</text><text x="180" y="49.7" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal">Four out of five is hosting, not cloud</text><rect x="18" y="66" width="324" height="72" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="99.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">On-demand self-service</text><text x="180" y="115.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Provisioned without talking to a human</text><rect x="18" y="150" width="324" height="72" rx="8" fill="#F2EBFA" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="183.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Broad network access</text><text x="180" y="199.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Standard clients: phone, laptop, lab PC</text><rect x="18" y="234" width="324" height="72" rx="8" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="267.2" font-size="12" text-anchor="middle" fill="#2E7D32" font-weight="bold">Resource pooling</text><text x="180" y="283.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Shared pool, physical location hidden</text><rect x="18" y="318" width="324" height="72" rx="8" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="351.2" font-size="12" text-anchor="middle" fill="#B66A00" font-weight="bold">Rapid elasticity</text><text x="180" y="367.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Scales out for a spike, then releases</text><rect x="18" y="402" width="324" height="72" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="435.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">Measured service</text><text x="180" y="451.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Metered in vCPU-hours, GB-months, egress</text><text x="180" y="499.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Elastic is not unlimited: quota and budget bound it.</text></svg>