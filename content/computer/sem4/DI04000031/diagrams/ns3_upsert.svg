<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 494" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="494" fill="#ffffff"/><text x="180" y="27.2" font-size="15" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Normal writes are upserts</text><text x="180" y="48.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">Same complete key means the same logical row</text><rect x="18" y="67" width="324" height="157" rx="9" fill="#EAF3FE" stroke="#1565C0" stroke-width="1.4"/><text x="180" y="97.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">INSERT using existing learner_id = 1</text><text x="180" y="127.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">name: Asha -&gt; Asha Patel</text><text x="180" y="152.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">Existing city Surat and marks 82 remain.</text><text x="180" y="177.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">Only supplied regular values are written.</text><rect x="18" y="248" width="324" height="157" rx="9" fill="#EDF7EE" stroke="#2E7D32" stroke-width="1.4"/><text x="180" y="278.2" font-size="12" text-anchor="middle" fill="#2E7D32" font-weight="bold">UPDATE missing learner_id = 99</text><text x="180" y="307.9" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">Creates a row: name Jai, marks 68</text><text x="180" y="332.9" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">city is null in this new row.</text><text x="180" y="357.9" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">Normal UPDATE does not require prior existence.</text><text x="180" y="440.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">No normal duplicate-key error for this INSERT.</text><text x="180" y="456.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">No MongoDB-style matched/modified count.</text><text x="180" y="472.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">Conditional writes have separate semantics/costs.</text></svg>