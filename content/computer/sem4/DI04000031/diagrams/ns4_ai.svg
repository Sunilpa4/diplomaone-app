<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 492" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="492" fill="#ffffff"/><text x="180" y="27.2" font-size="15" text-anchor="middle" fill="#7B2CD9" font-weight="bold">A graph query is not trained AI</text><text x="180" y="48.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">Algorithm families are examples, not implementations</text><rect x="18.0" y="60.0" width="324" height="46" rx="7" fill="#EAF3FE" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="86.9" font-size="11.2" text-anchor="middle" fill="#222" font-weight="normal">Synthetic entities + meaningful relationships</text><path d="M180 106 L180 132" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,132.0 183.5,125.0 176.5,125.0" fill="#7B2CD9"/><rect x="18.0" y="132.0" width="324" height="46" rx="7" fill="#F3ECFB" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="158.9" font-size="11.2" text-anchor="middle" fill="#222" font-weight="normal">Basic MATCH / WHERE / RETURN patterns</text><path d="M180 178 L180 204" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,204.0 183.5,197.0 176.5,197.0" fill="#7B2CD9"/><rect x="18.0" y="204.0" width="324" height="46" rx="7" fill="#EDF7EE" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="230.9" font-size="11.2" text-anchor="middle" fill="#222" font-weight="normal">Traceable candidates or simple input features</text><path d="M180 250 L180 285" fill="none" stroke="#AA5C00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,285.0 183.5,278.0 176.5,278.0" fill="#AA5C00"/><rect x="18" y="285" width="324" height="107" rx="9" fill="#FFF4DF" stroke="#AA5C00" stroke-width="1.4"/><text x="180" y="313.7" font-size="10.6" text-anchor="middle" fill="#222" font-weight="normal">Separate optional work — NOT executed here:</text><text x="180" y="336.7" font-size="10.6" text-anchor="middle" fill="#222" font-weight="normal">GDS algorithms / model training / ranking</text><text x="180" y="359.7" font-size="10.6" text-anchor="middle" fill="#222" font-weight="normal">Evaluation, eligibility, monitoring and governance</text><text x="180" y="382.7" font-size="10.6" text-anchor="middle" fill="#222" font-weight="normal">No accuracy or throughput numbers are claimed.</text><text x="180" y="433.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">Connection examples do not prove a company deployment.</text><text x="180" y="449.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">A community is not automatically a fraud ring.</text><text x="180" y="465.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">Keep provenance, privacy and human oversight.</text></svg>