<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 432" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="432" fill="#ffffff"/><text x="180" y="27.2" font-size="15" text-anchor="middle" fill="#7B2CD9" font-weight="bold">A small Redis transaction</text><text x="180" y="48.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">No other client interleaves during EXEC execution</text><rect x="18.0" y="64.0" width="324" height="48" rx="7" fill="#EAF3FE" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="92.2" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">MULTI -&gt; begin queue</text><path d="M180 112 L180 142" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,142.0 183.5,135.0 176.5,135.0" fill="#7B2CD9"/><rect x="18.0" y="142.0" width="324" height="48" rx="7" fill="#F3ECFB" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="170.2" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">Commands -&gt; QUEUED</text><path d="M180 190 L180 220" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,220.0 183.5,213.0 176.5,213.0" fill="#7B2CD9"/><rect x="18.0" y="220.0" width="324" height="48" rx="7" fill="#EDF7EE" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="248.2" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">EXEC -&gt; ordered command replies</text><rect x="18" y="303" width="324" height="101" rx="9" fill="#FFF4DF" stroke="#AA5C00" stroke-width="1.4"/><text x="180" y="332.0" font-size="11.3" text-anchor="middle" fill="#222" font-weight="normal">DISCARD cancels before execution.</text><text x="180" y="356.0" font-size="11.3" text-anchor="middle" fill="#222" font-weight="normal">Runtime errors do NOT cause rollback.</text><text x="180" y="380.0" font-size="11.3" text-anchor="middle" fill="#222" font-weight="normal">Later queued commands can still succeed.</text></svg>