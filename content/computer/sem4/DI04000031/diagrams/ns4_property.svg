x="18" y="306" width="324" height="95" rx="9" fill="#F3ECFB" stroke="#7B2CD9" stroke-width="1.4"/><text x="180" y="334.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">RELATIONSHIP type: exactly one, KNOWS</text><text x="180" y="358.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">Stored direction: Asha -&gt; Ravi</text><text x="180" y="382.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">RELATIONSHIP property: since = 2024</text><text x="180" y="442.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">Each relationship has source and target endpoints.</text><text x="180" y="458.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">The endpoints may even be the same node.</text><text x="180" y="474.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">Use business identity rules, not internal IDs.</text></svg>