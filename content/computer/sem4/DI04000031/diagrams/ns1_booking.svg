<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 501" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="501" fill="#ffffff"/><text x="180" y="27.2" font-size="15" text-anchor="middle" fill="#7B2CD9" font-weight="bold">One last seat, two offices</text><text x="180" y="48.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">Analogy only — not a theorem proof</text><rect x="19.0" y="64.5" width="144" height="59" rx="7" fill="#EAF3FE" stroke="#1565C0" stroke-width="1.6"/><text x="91" y="91.3" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">Surat</text><text x="91" y="104.8" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">local view: 1 seat</text><rect x="197.0" y="64.5" width="144" height="59" rx="7" fill="#EAF3FE" stroke="#1565C0" stroke-width="1.6"/><text x="269" y="91.3" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">Bharuch</text><text x="269" y="104.8" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">local view: 1 seat</text><path d="M164 94 H178 M186 94 H196" fill="none" stroke="#B3261E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M176 84 L186 104 M186 84 L176 104" fill="none" stroke="#B3261E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="180" y="144.8" font-size="11" text-anchor="middle" fill="#B3261E" font-weight="bold">Communication link fails</text><rect x="18" y="166" width="324" height="126" rx="9" fill="#EDF7EE" stroke="#2E7D32" stroke-width="1.4"/><text x="34" y="192.2" font-size="12" text-anchor="start" fill="#2E7D32" font-weight="bold">CONSISTENCY FIRST (CP-style)</text><text x="34" y="216.0" font-size="11.5" text-anchor="start" fill="#222" font-weight="normal">Confirm only if the authoritative history</text><text x="34" y="234.0" font-size="11.5" text-anchor="start" fill="#222" font-weight="normal">can be maintained. An isolated office</text><text x="34" y="252.0" font-size="11.5" text-anchor="start" fill="#222" font-weight="normal">defers a booking it cannot safely verify.</text><text x="34" y="270.0" font-size="11.5" text-anchor="start" fill="#222" font-weight="normal">Some operations lose availability.</text><rect x="18" y="309" width="324" height="126" rx="9" fill="#FFF4DF" stroke="#AA5C00" stroke-width="1.4"/><text x="34" y="335.2" font-size="12" text-anchor="start" fill="#AA5C00" font-weight="bold">AVAILABILITY FIRST (AP-style)</text><text x="34" y="359.0" font-size="11.5" text-anchor="start" fill="#222" font-weight="normal">Both sides may act on a local seat count.</text><text x="34" y="377.0" font-size="11.5" text-anchor="start" fill="#222" font-weight="normal">Two confirmations can claim one seat.</text><text x="34" y="395.0" font-size="11.5" text-anchor="start" fill="#222" font-weight="normal">Reconcile later; earlier answers were</text><text x="34" y="413.0" font-size="11.5" text-anchor="start" fill="#222" font-weight="normal">not one consistent booking history.</text><text x="180" y="466.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">A stale recommendation is less harmful than</text><text x="180" y="482.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">conflicting confirmations of a scarce seat.</text></svg>