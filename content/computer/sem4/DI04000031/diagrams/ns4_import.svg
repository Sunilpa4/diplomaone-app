<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 497" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="497" fill="#ffffff"/><text x="180" y="27.2" font-size="15" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Import, then verify every element</text><text x="180" y="48.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">Program 15: actual JSON parameters + UNWIND</text><rect x="18.0" y="62.0" width="324" height="48" rx="7" fill="#EAF3FE" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="89.8" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">graph_fixture.json: people + friendships</text><path d="M180 110 L180 141" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,141.0 183.5,134.0 176.5,134.0" fill="#7B2CD9"/><rect x="18.0" y="141.0" width="324" height="48" rx="7" fill="#F3ECFB" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="168.8" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">Official driver sends arrays as parameters</text><path d="M180 189 L180 220" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,220.0 183.5,213.0 176.5,213.0" fill="#7B2CD9"/><rect x="18.0" y="220.0" width="324" height="48" rx="7" fill="#EDF7EE" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="247.8" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">UNWIND creates 6 people and 6 KNOWS edges</text><path d="M180 268 L180 304" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,304.0 183.5,297.0 176.5,297.0" fill="#2E7D32"/><rect x="18" y="304" width="324" height="119" rx="9" fill="#FFF4DF" stroke="#AA5C00" stroke-width="1.4"/><text x="180" y="331.9" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">Read-back verification, not just input length:</text><text x="180" y="355.9" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">Every person ID / name / city / age</text><text x="180" y="379.9" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">Every relationship source / target / since</text><text x="180" y="403.9" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">Counters are actual server summary values.</text><text x="180" y="459.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">Only the social arrays are imported in this program.</text><text x="180" y="475.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">Synthetic snapshot: no live ingestion or training.</text></svg>