<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 489" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="489" fill="#ffffff"/><text x="180" y="27.2" font-size="15" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Keys decide the layout</text><text x="180" y="48.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">Short names device/day/ts used in this figure</text><rect x="18" y="68" width="324" height="155" rx="9" fill="#EAF3FE" stroke="#1565C0" stroke-width="1.4"/><text x="180" y="97.0" font-size="11.5" text-anchor="middle" fill="#1565C0" font-weight="bold">PRIMARY KEY (device, day, ts)</text><path d="M34 107 H326" fill="none" stroke="#1565C0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="180" y="136.2" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">Partition key: device</text><text x="180" y="160.2" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">Clustering: day, then ts</text><text x="180" y="203.8" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">S01 across days: same partition</text><rect x="18" y="248" width="324" height="155" rx="9" fill="#EDF7EE" stroke="#2E7D32" stroke-width="1.4"/><text x="180" y="277.0" font-size="11.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">PRIMARY KEY ((device, day), ts)</text><path d="M34 287 H326" fill="none" stroke="#2E7D32" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="180" y="316.2" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">Partition key: device + day</text><text x="180" y="340.2" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">Clustering: ts</text><text x="180" y="383.9" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">S01 on a new day: another partition</text><text x="180" y="436.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">Full schema uses device_id, day, reading_at.</text><text x="180" y="452.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">The complete primary key identifies a row.</text><text x="180" y="468.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">Bucketing must fit the actual rate and size.</text></svg>