<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 512" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="512" fill="#ffffff"/><text x="180" y="27.2" font-size="15" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Read-only health awareness</text><text x="180" y="48.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">nodetool status uses management/JMX, not CQL</text><rect x="18.0" y="65.0" width="324" height="46" rx="7" fill="#EDF7EE" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="92.2" font-size="12" text-anchor="middle" fill="#2E7D32" font-weight="bold">Observed reference: one local UN node</text><rect x="18" y="160" width="152" height="147" rx="9" fill="#EAF3FE" stroke="#1565C0" stroke-width="1.4"/><rect x="190" y="160" width="152" height="147" rx="9" fill="#F3ECFB" stroke="#7B2CD9" stroke-width="1.4"/><text x="94" y="190.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="normal">STATUS</text><text x="94" y="221.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="normal">U = Up</text><text x="94" y="252.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="normal">D = Down</text><text x="266" y="186.0" font-size="11.5" text-anchor="middle" fill="#7B2CD9" font-weight="normal">STATE</text><text x="266" y="210.0" font-size="11.5" text-anchor="middle" fill="#7B2CD9" font-weight="normal">N = Normal</text><text x="266" y="234.0" font-size="11.5" text-anchor="middle" fill="#7B2CD9" font-weight="normal">J = Joining</text><text x="266" y="258.0" font-size="11.5" text-anchor="middle" fill="#7B2CD9" font-weight="normal">L = Leaving</text><text x="266" y="282.0" font-size="11.5" text-anchor="middle" fill="#7B2CD9" font-weight="normal">M = Moving</text><rect x="18" y="337" width="324" height="102" rx="9" fill="#FFF4DF" stroke="#AA5C00" stroke-width="1.4"/><text x="180" y="364.9" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">UN is a useful observation, not a full guarantee.</text><text x="180" y="386.9" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">Check authorized application reads/writes too.</text><text x="180" y="408.9" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">Keep CQL, internode and JMX access private.</text><text x="180" y="430.9" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">No repair/decommission/failure-injection lab.</text><text x="180" y="473.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">Load, node UUID and ownership vary.</text><text x="180" y="489.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">No replicated-cluster availability proof is claimed.</text></svg>