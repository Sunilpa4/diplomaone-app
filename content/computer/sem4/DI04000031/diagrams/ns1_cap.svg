<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 468" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="468" fill="#ffffff"/><text x="180" y="27.2" font-size="15" text-anchor="middle" fill="#7B2CD9" font-weight="bold">CAP: basic guarantees</text><text x="180" y="48.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">Consider affected operations during a partition</text><rect x="18" y="66" width="324" height="91" rx="9" fill="#EAF3FE" stroke="#1565C0" stroke-width="1.4"/><text x="37" y="98.0" font-size="23" text-anchor="middle" fill="#1565C0" font-weight="bold">C</text><text x="63" y="92.2" font-size="12" text-anchor="start" fill="#1565C0" font-weight="bold">Consistency</text><text x="63" y="112.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">One current logical copy</text><text x="63" y="128.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">Read after completed write:</text><text x="63" y="144.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">not the older value</text><rect x="18" y="170" width="324" height="91" rx="9" fill="#EDF7EE" stroke="#2E7D32" stroke-width="1.4"/><text x="37" y="202.1" font-size="23" text-anchor="middle" fill="#2E7D32" font-weight="bold">A</text><text x="63" y="196.2" font-size="12" text-anchor="start" fill="#2E7D32" font-weight="bold">Availability</text><text x="63" y="216.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">Valid operations eventually complete</text><text x="63" y="232.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">at non-failed nodes</text><text x="63" y="248.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">A refusal/error alone is not enough</text><rect x="18" y="274" width="324" height="91" rx="9" fill="#FFF4DF" stroke="#AA5C00" stroke-width="1.4"/><text x="37" y="306.1" font-size="23" text-anchor="middle" fill="#AA5C00" font-weight="bold">P</text><text x="63" y="300.2" font-size="12" text-anchor="start" fill="#AA5C00" font-weight="bold">Partition tolerance</text><text x="63" y="320.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">Account for communication failure</text><text x="63" y="336.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">between node groups</text><text x="63" y="352.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">Nodes can still be running</text><rect x="18.0" y="379.0" width="324" height="48" rx="7" fill="#F3ECFB" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="407.0" font-size="11.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Partition: cannot guarantee both C and A</text><text x="180" y="448.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">Healthy communication can support both C and A.</text></svg>