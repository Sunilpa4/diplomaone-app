<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 445" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="445" fill="#ffffff"/><text x="180" y="27.2" font-size="15" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Scaling and data placement</text><text x="180" y="48.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">Different purposes; a system may combine them</text><rect x="18" y="65" width="324" height="99" rx="9" fill="#EAF3FE" stroke="#1565C0" stroke-width="1.4"/><text x="34" y="89.0" font-size="11.5" text-anchor="start" fill="#1565C0" font-weight="bold">SCALE UP: more resources on one server</text><rect x="41.5" y="102.0" width="109" height="34" rx="7" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.6"/><text x="96" y="122.8" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">One server</text><path d="M152 119 L193 119" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="193.0,119.0 186.0,115.5 186.0,122.5" fill="#1565C0"/><rect x="195.0" y="96.5" width="136" height="45" rx="7" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.6"/><text x="263" y="122.8" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">Bigger server</text><rect x="18" y="181" width="324" height="99" rx="9" fill="#F3ECFB" stroke="#7B2CD9" stroke-width="1.4"/><text x="34" y="205.0" font-size="11.5" text-anchor="start" fill="#7B2CD9" font-weight="bold">SCALE OUT: add nodes / distribute work</text><rect x="30.5" y="218.5" width="91" height="41" rx="7" fill="#FFFFFF" stroke="#7B2CD9" stroke-width="1.6"/><text x="76" y="242.8" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">Subset A</text><rect x="134.5" y="218.5" width="91" height="41" rx="7" fill="#FFFFFF" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="242.8" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">Subset B</text><rect x="238.5" y="218.5" width="91" height="41" rx="7" fill="#FFFFFF" stroke="#7B2CD9" stroke-width="1.6"/><text x="284" y="242.8" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">Subset C</text><rect x="18" y="297" width="324" height="99" rx="9" fill="#EDF7EE" stroke="#2E7D32" stroke-width="1.4"/><text x="34" y="321.0" font-size="11.5" text-anchor="start" fill="#2E7D32" font-weight="bold">REPLICATE: copies of the same data</text><rect x="36.0" y="336.0" width="126" height="40" rx="7" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.6"/><text x="99" y="360.2" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">A + B + C</text><path d="M163 356 L195 356" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="195.0,356.0 188.0,352.5 188.0,359.5" fill="#2E7D32"/><rect x="200.0" y="336.0" width="126" height="40" rx="7" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.6"/><text x="263" y="360.2" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">A + B + C</text><text x="180" y="424.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">Data partitioning is not a network partition.</text></svg>