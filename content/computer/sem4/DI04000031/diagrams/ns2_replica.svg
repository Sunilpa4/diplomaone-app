<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 469" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="469" fill="#ffffff"/><text x="180" y="27.2" font-size="15" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Replication = same dataset</text><text x="180" y="48.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">Conceptual only — not configured in this unit</text><rect x="18.0" y="65.0" width="324" height="46" rx="7" fill="#EAF3FE" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="92.2" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">Client writes to the primary</text><path d="M180 111 L180 145" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,145.0 183.5,138.0 176.5,138.0" fill="#7B2CD9"/><rect x="86.0" y="145.0" width="188" height="68" rx="7" fill="#F3ECFB" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="176.2" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">Primary</text><text x="180" y="190.2" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">Data A + B + C</text><path d="M130 213 L88 249" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="88.0,249.0 95.6,247.1 91.0,241.8" fill="#7B2CD9"/><path d="M230 213 L272 249" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="272.0,249.0 269.0,241.8 264.4,247.1" fill="#7B2CD9"/><text x="180" y="242.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">asynchronous updates</text><rect x="18.0" y="249.0" width="146" height="70" rx="7" fill="#EDF7EE" stroke="#2E7D32" stroke-width="1.6"/><text x="91" y="281.3" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">Secondary 1</text><text x="91" y="294.8" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">Data A + B + C</text><rect x="196.0" y="249.0" width="146" height="70" rx="7" fill="#EDF7EE" stroke="#2E7D32" stroke-width="1.6"/><text x="269" y="281.3" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">Secondary 2</text><text x="269" y="294.8" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">Data A + B + C</text><rect x="18" y="345" width="324" height="74" rx="9" fill="#FFF4DF" stroke="#AA5C00" stroke-width="1.4"/><text x="180" y="370.9" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">An eligible member may become the new primary.</text><text x="180" y="389.9" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">Elections can interrupt service; lag can exist.</text><text x="180" y="408.9" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">Replication is not an independent backup.</text><text x="180" y="448.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">No replica-set setup or failover test is claimed.</text></svg>