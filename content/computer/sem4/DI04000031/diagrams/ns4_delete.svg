<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 485" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="485" fill="#ffffff"/><text x="180" y="27.2" font-size="15" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Deletion has a graph scope</text><text x="180" y="48.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">Preview the match; use only owned disposable data</text><rect x="18" y="70" width="324" height="88" rx="9" fill="#FDECEA" stroke="#B3261E" stroke-width="1.4"/><text x="180" y="98.2" font-size="12" text-anchor="middle" fill="#B3261E" font-weight="bold">DELETE connected node</text><text x="180" y="130.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Rejected while incident relationships remain</text><rect x="18" y="184" width="324" height="88" rx="9" fill="#EAF3FE" stroke="#1565C0" stroke-width="1.4"/><text x="180" y="212.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">DELETE the selected relationship</text><text x="180" y="244.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Both endpoint nodes remain</text><rect x="18" y="298" width="324" height="88" rx="9" fill="#FFF4DF" stroke="#AA5C00" stroke-width="1.4"/><text x="180" y="326.2" font-size="12" text-anchor="middle" fill="#AA5C00" font-weight="bold">DETACH DELETE selected node</text><text x="180" y="358.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Node + ALL incident relationships removed</text><text x="180" y="427.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">Other endpoints are not automatically deleted.</text><text x="180" y="443.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">SET/REMOVE can change properties/labels instead.</text><text x="180" y="459.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">No whole-database wipe or physical-erasure claim.</text></svg>