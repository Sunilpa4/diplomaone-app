<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 474" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="474" fill="#ffffff"/><text x="180" y="27.2" font-size="15" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Logical result shaping</text><text x="180" y="48.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">Not a fixed physical optimizer execution order</text><rect x="18.0" y="61.0" width="324" height="44" rx="7" fill="#EAF3FE" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="87.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">find({}) -&gt; six matched students</text><path d="M180 105 L180 129" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,129.0 183.5,122.0 176.5,122.0" fill="#7B2CD9"/><rect x="18.0" y="129.0" width="324" height="44" rx="7" fill="#F3ECFB" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="155.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">sort: marks descending, _id ascending</text><path d="M180 173 L180 197" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,197.0 183.5,190.0 176.5,190.0" fill="#7B2CD9"/><rect x="18.0" y="197.0" width="324" height="44" rx="7" fill="#EAF3FE" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="223.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">limit(3) -&gt; first three in that order</text><path d="M180 241 L180 265" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,265.0 183.5,258.0 176.5,258.0" fill="#7B2CD9"/><rect x="18.0" y="265.0" width="324" height="44" rx="7" fill="#F3ECFB" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="291.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">projection -&gt; name + marks; hide _id</text><rect x="18" y="339" width="324" height="85" rx="9" fill="#EDF7EE" stroke="#2E7D32" stroke-width="1.4"/><text x="180" y="364.2" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">Neha 92</text><text x="180" y="387.2" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">Asha 82</text><text x="180" y="410.2" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">Meera 82</text><text x="180" y="453.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">The _id tie-breaker fixes the 82-mark ordering.</text></svg>