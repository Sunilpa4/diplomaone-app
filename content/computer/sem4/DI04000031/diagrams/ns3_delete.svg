<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 482" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="482" fill="#ffffff"/><text x="180" y="27.2" font-size="15" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Deletion scope follows the key</text><text x="180" y="48.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">Use the disposable lab, never system data</text><rect x="18" y="67" width="324" height="95" rx="9" fill="#EAF3FE" stroke="#1565C0" stroke-width="1.4"/><text x="180" y="95.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">CELL: DELETE city</text><text x="180" y="121.8" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">Asha still has name and marks 82.</text><text x="180" y="142.8" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">Only the selected city value is removed.</text><rect x="18" y="183" width="324" height="95" rx="9" fill="#F3ECFB" stroke="#7B2CD9" stroke-width="1.4"/><text x="180" y="211.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">ROW: full row identity</text><text x="180" y="237.8" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">learner_id 2 -&gt; no returned row</text><text x="180" y="258.9" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">device + day + time -&gt; one sensor reading</text><rect x="18" y="299" width="324" height="95" rx="9" fill="#FFF4DF" stroke="#AA5C00" stroke-width="1.4"/><text x="180" y="327.2" font-size="12" text-anchor="middle" fill="#AA5C00" font-weight="bold">PARTITION: device + day</text><text x="180" y="353.9" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">S02 / 29 Oct -&gt; all its readings removed</text><text x="180" y="374.9" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">Missing time is deliberate partition scope.</text><text x="180" y="429.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">Logical deletion uses tombstones.</text><text x="180" y="445.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">No immediate physical-erasure proof or undo.</text><text x="180" y="461.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">Cleanup targets only the newly owned keyspace.</text></svg>