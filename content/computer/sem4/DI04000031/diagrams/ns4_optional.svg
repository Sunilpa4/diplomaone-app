<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 493" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="493" fill="#ffffff"/><text x="180" y="27.2" font-size="15" text-anchor="middle" fill="#7B2CD9" font-weight="bold">OPTIONAL MATCH keeps a row</text><text x="180" y="48.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">Six people; only Asha has an outgoing MENTORS link</text><circle cx="76" cy="115" r="35" fill="#EAF3FE" stroke="#1565C0" stroke-width="1.6"/><text x="76" y="110.7" font-size="10.5" text-anchor="middle" fill="#1565C0" font-weight="bold">P01</text><text x="76" y="128.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">Asha</text><circle cx="284" cy="115" r="35" fill="#EDF7EE" stroke="#2E7D32" stroke-width="1.6"/><text x="284" y="110.7" font-size="10.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">P02</text><text x="284" y="128.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">Ravi</text><path d="M111.0 115.0 L249.0 115.0" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="249.0,115.0 242.0,111.5 242.0,118.5" fill="#7B2CD9"/><text x="180" y="90.0" font-size="11.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">MENTORS</text><rect x="18" y="183" width="324" height="137" rx="9" fill="#F3ECFB" stroke="#7B2CD9" stroke-width="1.4"/><text x="180" y="213.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">Person row | optional mentee</text><text x="180" y="240.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">P01 | Ravi</text><text x="180" y="267.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">P02–P06 | null</text><text x="180" y="294.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">Unmatched people are still returned.</text><rect x="18" y="349" width="152" height="69" rx="9" fill="#EAF3FE" stroke="#1565C0" stroke-width="1.4"/><rect x="190" y="349" width="152" height="69" rx="9" fill="#EDF7EE" stroke="#2E7D32" stroke-width="1.4"/><text x="94" y="373.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="normal">count(*)</text><text x="94" y="399.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="normal">6 rows</text><text x="266" y="373.0" font-size="11.5" text-anchor="middle" fill="#2E7D32" font-weight="normal">count(mentee)</text><text x="266" y="399.0" font-size="11.5" text-anchor="middle" fill="#2E7D32" font-weight="normal">1 non-null value</text><text x="180" y="453.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">A later non-null WHERE deliberately removes null rows.</text><text x="180" y="469.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">An absent relationship is not a proven real-world fact.</text></svg>