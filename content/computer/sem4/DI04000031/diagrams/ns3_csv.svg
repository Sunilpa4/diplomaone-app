<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 502" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="502" fill="#ffffff"/><text x="180" y="27.2" font-size="15" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Import full keys, not just rows</text><text x="180" y="48.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">Practical 6: actual cqlsh COPY FROM</text><rect x="18.0" y="63.0" width="324" height="46" rx="7" fill="#EAF3FE" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="89.8" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">sensors.csv: eight synthetic records</text><path d="M180 109 L180 141" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,141.0 183.5,134.0 176.5,134.0" fill="#7B2CD9"/><rect x="18.0" y="141.0" width="324" height="46" rx="7" fill="#F3ECFB" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="167.8" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">Map columns + HEADER + explicit time format</text><path d="M180 187 L180 219" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,219.0 183.5,212.0 176.5,212.0" fill="#7B2CD9"/><rect x="18.0" y="219.0" width="324" height="46" rx="7" fill="#EDF7EE" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="245.8" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">cqlsh COPY FROM: eight rows processed</text><path d="M180 265 L180 301" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,301.0 183.5,294.0 176.5,294.0" fill="#2E7D32"/><rect x="18" y="301" width="324" height="115" rx="9" fill="#FFF4DF" stroke="#AA5C00" stroke-width="1.4"/><text x="180" y="328.9" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">Verify with real server reads:</text><text x="180" y="351.9" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">8 stored rows / 4 logical device-day keys</text><text x="180" y="374.9" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">Correct UTC times, including 09:02 -&gt; 32.0</text><text x="180" y="397.9" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">Repeated full keys can collapse into upserts.</text><text x="180" y="448.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">DATETIMEFORMAT uses %z for the UTC Z suffix.</text><text x="180" y="464.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">A processed-row message alone is not enough.</text><text x="180" y="480.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">Fixed snapshot, not live ingestion or a benchmark.</text></svg>