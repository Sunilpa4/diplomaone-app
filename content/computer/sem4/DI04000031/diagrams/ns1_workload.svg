<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="420" fill="#ffffff"/><text x="180" y="27.2" font-size="15" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Match the workload</text><text x="180" y="48.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">NoSQL is an option, not a universal upgrade</text><rect x="18.0" y="65.0" width="324" height="52" rx="7" fill="#EAF3FE" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="95.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">Shape + reads/writes + guarantees</text><path d="M180 117 L180 137 L94 137 L94 155" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="94.0,155.0 97.5,148.0 90.5,148.0" fill="#1565C0"/><path d="M180 137 L266 137 L266 155" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="266.0,155.0 269.5,148.0 262.5,148.0" fill="#7B2CD9"/><rect x="18" y="155" width="152" height="139" rx="9" fill="#EDF7EE" stroke="#2E7D32" stroke-width="1.4"/><rect x="190" y="155" width="152" height="139" rx="9" fill="#F3ECFB" stroke="#7B2CD9" stroke-width="1.4"/><text x="94" y="182.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">Relational</text><text x="94" y="204.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">Tables and relations</text><text x="94" y="226.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">SQL, constraints</text><text x="94" y="248.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">Transactions</text><text x="94" y="270.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">Often a strong default</text><text x="266" y="182.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">NoSQL models</text><text x="266" y="204.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">Documents or keys</text><text x="266" y="226.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">Wide-column or graph</text><text x="266" y="248.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">Match access patterns</text><text x="266" y="270.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">Check actual guarantees</text><path d="M94 294 L94 316 L180 316 L180 334" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,334.0 183.5,327.0 176.5,327.0" fill="#2E7D32"/><path d="M266 294 L266 316 L180 316" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,316.0 187.0,319.5 187.0,312.5" fill="#7B2CD9"/><rect x="18.0" y="334.0" width="324" height="46" rx="7" fill="#FFF4DF" stroke="#AA5C00" stroke-width="1.6"/><text x="180" y="361.0" font-size="11.5" text-anchor="middle" fill="#AA5C00" font-weight="bold">Simplest suitable design + a trade-off</text><text x="180" y="402.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">Measure actual behaviour; do not promise a speedup.</text></svg>