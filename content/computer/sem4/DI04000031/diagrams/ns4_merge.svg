<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 526" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="526" fill="#ffffff"/><text x="180" y="27.2" font-size="15" text-anchor="middle" fill="#7B2CD9" font-weight="bold">CREATE, MATCH and MERGE</text><text x="180" y="48.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">Identity comes from a deliberate pattern/constraint</text><rect x="18" y="69" width="324" height="79" rx="9" fill="#EAF3FE" stroke="#1565C0" stroke-width="1.4"/><text x="180" y="96.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">CREATE</text><text x="180" y="126.8" font-size="10.8" text-anchor="middle" fill="#222" font-weight="normal">New element; can duplicate without a rule</text><rect x="18" y="171" width="324" height="79" rx="9" fill="#F3ECFB" stroke="#7B2CD9" stroke-width="1.4"/><text x="180" y="198.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">MATCH</text><text x="180" y="228.8" font-size="10.8" text-anchor="middle" fill="#222" font-weight="normal">Bind existing; missing match creates nothing</text><rect x="18" y="273" width="324" height="79" rx="9" fill="#EDF7EE" stroke="#2E7D32" stroke-width="1.4"/><text x="180" y="300.2" font-size="12" text-anchor="middle" fill="#2E7D32" font-weight="bold">MERGE P09: first execution</text><text x="180" y="330.8" font-size="10.8" text-anchor="middle" fill="#222" font-weight="normal">Not found -&gt; create Jai, visits 1</text><rect x="18" y="375" width="324" height="79" rx="9" fill="#FFF4DF" stroke="#AA5C00" stroke-width="1.4"/><text x="180" y="402.2" font-size="12" text-anchor="middle" fill="#AA5C00" font-weight="bold">MERGE P09: second execution</text><text x="180" y="432.8" font-size="10.8" text-anchor="middle" fill="#222" font-weight="normal">Found -&gt; ON MATCH sets visits 2</text><text x="180" y="487.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">MERGE matches the whole specified pattern.</text><text x="180" y="503.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">A changing name is a poor identity component.</text></svg>