<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 431" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="431" fill="#ffffff"/><text x="180" y="27.2" font-size="15" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Embed or reference?</text><text x="180" y="48.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">Decide from access, size and ownership</text><rect x="18" y="65" width="324" height="132" rx="9" fill="#EAF3FE" stroke="#1565C0" stroke-width="1.4"/><text x="34" y="92.0" font-size="11.5" text-anchor="start" fill="#1565C0" font-weight="bold">EMBED: bounded address with the learner</text><text x="34" y="120.0" font-size="11.5" text-anchor="start" fill="#222" font-weight="normal">Learner L1</text><text x="34" y="140.0" font-size="11.5" text-anchor="start" fill="#222" font-weight="normal">  name: Asha</text><text x="34" y="160.0" font-size="11.5" text-anchor="start" fill="#222" font-weight="normal">  address: {city: Surat, pin: 395001}</text><text x="34" y="180.0" font-size="11.5" text-anchor="start" fill="#222" font-weight="normal">Read the bounded record together.</text><rect x="18" y="220" width="324" height="143" rx="9" fill="#EDF7EE" stroke="#2E7D32" stroke-width="1.4"/><text x="34" y="248.0" font-size="11.5" text-anchor="start" fill="#2E7D32" font-weight="bold">REFERENCE: a separately managed course</text><rect x="30.5" y="265.5" width="127" height="57" rx="7" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.6"/><text x="94" y="291.4" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">Learner L1</text><text x="94" y="304.4" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">courseId: C1</text><path d="M158 294 L202 294" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="202.0,294.0 195.0,290.5 195.0,297.5" fill="#2E7D32"/><rect x="208.5" y="265.5" width="127" height="57" rx="7" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.6"/><text x="272" y="291.4" font-size="10.5" text-anchor="middle" fill="#222" font-weight="normal">Course C1</text><text x="272" y="303.9" font-size="10.5" text-anchor="middle" fill="#222" font-weight="normal">MongoDB Basics</text><text x="180" y="347.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="normal">Explicit lookup; a missing reference is possible.</text><text x="180" y="395.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">No automatic relational foreign-key enforcement.</text><text x="180" y="411.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">Avoid unbounded embedded event/comment histories.</text></svg>