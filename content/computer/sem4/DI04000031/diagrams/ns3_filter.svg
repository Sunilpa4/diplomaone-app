<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 486" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="486" fill="#ffffff"/><text x="180" y="27.2" font-size="15" text-anchor="middle" fill="#7B2CD9" font-weight="bold">A filter is an access decision</text><text x="180" y="48.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">Tiny output does not prove tiny query work</text><rect x="18" y="67" width="324" height="112" rx="9" fill="#FDECEA" stroke="#B3261E" stroke-width="1.4"/><text x="180" y="96.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">Unindexed temperature_c &gt; 30</text><text x="180" y="118.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">No designed partition-key access</text><text x="180" y="140.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">Adding LIMIT 1 does not legalize it.</text><text x="180" y="162.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">Observed server response: InvalidRequest</text><rect x="18" y="207" width="324" height="112" rx="9" fill="#FFF4DF" stroke="#AA5C00" stroke-width="1.4"/><text x="180" y="237.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">Teaching-only bounded filter</text><text x="180" y="259.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">Select S01 + 29 Oct: three known rows.</text><text x="180" y="281.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">ALLOW FILTERING permits residual scanning.</text><text x="180" y="303.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">Returns 32.0 and 31.0 in this fixture.</text><rect x="18" y="347" width="324" height="85" rx="9" fill="#EDF7EE" stroke="#2E7D32" stroke-width="1.4"/><text x="180" y="376.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">For a real repeated access requirement:</text><text x="180" y="398.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">design a query-shaped table or choose</text><text x="180" y="420.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">a suitable index deliberately.</text><text x="180" y="464.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">ALLOW FILTERING is not an index or speed promise.</text></svg>