<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 522" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="522" fill="#ffffff"/><text x="180" y="27.2" font-size="15" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Shared device: investigate, not accuse</text><text x="180" y="48.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">All account/device records are synthetic</text><circle cx="62" cy="110" r="28" fill="#EAF3FE" stroke="#1565C0" stroke-width="1.6"/><text x="62" y="114.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">A01</text><path d="M81.55 130.05 L154.87 205.23" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="154.9,205.2 152.5,197.8 147.5,202.7" fill="#7B2CD9"/><circle cx="180" cy="110" r="28" fill="#EAF3FE" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="114.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">A02</text><path d="M180.0 138.0 L180.0 195.0" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,195.0 183.5,188.0 176.5,188.0" fill="#7B2CD9"/><circle cx="298" cy="110" r="28" fill="#EAF3FE" stroke="#1565C0" stroke-width="1.6"/><text x="298" y="114.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">A04</text><path d="M278.45 130.05 L205.13 205.23" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="205.1,205.2 212.5,202.7 207.5,197.8" fill="#7B2CD9"/><circle cx="180" cy="231" r="36" fill="#EDF7EE" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="226.7" font-size="10.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">D01</text><text x="180" y="244.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">device</text><text x="180" y="68.7" font-size="10.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">All three arrows: USES_DEVICE</text><rect x="18" y="290" width="324" height="83" rx="9" fill="#FFF4DF" stroke="#AA5C00" stroke-width="1.4"/><text x="180" y="316.9" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">Three distinct unordered review pairs:</text><text x="180" y="339.9" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">A01–A02 | A01–A04 | A02–A04</text><text x="180" y="362.9" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">Exclude self and symmetric duplicates.</text><rect x="18.0" y="388.5" width="324" height="45" rx="7" fill="#EAF3FE" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="414.8" font-size="10.8" text-anchor="middle" fill="#222" font-weight="normal">A03 -&gt; D02 alone: contributes no shared pair</text><text x="180" y="465.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">Families/public computers can legitimately share devices.</text><text x="180" y="481.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">A shared device is NOT a fraud verdict.</text><text x="180" y="497.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">Context, consent, false positives and review matter.</text></svg>