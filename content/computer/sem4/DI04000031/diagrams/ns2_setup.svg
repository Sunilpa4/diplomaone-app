<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 467" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="467" fill="#ffffff"/><text x="180" y="27.2" font-size="15" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Install, connect, verify</text><text x="180" y="48.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">Practical 2: collect actual evidence</text><rect x="18.0" y="60.0" width="324" height="44" rx="7" fill="#EAF3FE" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="86.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">Select a supported OS + architecture</text><path d="M180 103 L180 129" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,129.0 183.5,122.0 176.5,122.0" fill="#7B2CD9"/><rect x="18.0" y="129.0" width="324" height="44" rx="7" fill="#F3ECFB" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="155.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">Install Community Server and mongosh</text><path d="M180 172 L180 198" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,198.0 183.5,191.0 176.5,191.0" fill="#7B2CD9"/><rect x="18.0" y="198.0" width="324" height="44" rx="7" fill="#EAF3FE" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="224.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">Start a private server; configure access</text><path d="M180 241 L180 267" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,267.0 183.5,260.0 176.5,260.0" fill="#7B2CD9"/><rect x="18.0" y="267.0" width="324" height="44" rx="7" fill="#F3ECFB" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="293.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">Connect, ping, create, write and read</text><path d="M180 3