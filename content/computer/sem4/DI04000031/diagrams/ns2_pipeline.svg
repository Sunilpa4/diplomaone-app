<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 447" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="447" fill="#ffffff"/><text x="180" y="27.2" font-size="15" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Aggregation pipeline</text><text x="180" y="48.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">The input and output counts can differ</text><rect x="18.0" y="59.0" width="324" height="46" rx="7" fill="#EAF3FE" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="86.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">Six order documents</text><path d="M180 105 L180 130" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,130.0 183.5,123.0 176.5,123.0" fill="#7B2CD9"/><rect x="18.0" y="130.0" width="324" height="46" rx="7" fill="#F3ECFB" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="157.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">$match status:paid -&gt; five documents</text><path d="M180 176 L180 201" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,201.0 183.5,194.0 176.5,194.0" fill="#7B2CD9"/><rect x="18.0" y="201.0" width="324" height="46" rx="7" fill="#EDF7EE" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="228.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">$group by $category -&gt; two summaries</text><rect x="18" y="278" width="324" height="101" rx="9" fill="#FFF4DF" stroke="#AA5C00" stroke-width="1.4"/><text x="34" y="303.5" font-size="10" text-anchor="start" fill="#AA5C00" font-weight="bold">CATEGORY</text><text x="137" y="303.5" font-size="10" text-anchor="start" fill="#AA5C00" font-weight="bold">COUNT</text><text x="202" y="303.5" font-size="10" text-anchor="start" fill="#AA5C00" font-weight="bold">TOTAL</text><text x="279" y="303.5" font-size="10" text-anchor="start" fill="#AA5C00" font-weight="bold">AVG</text><path d="M34 311 H326" fill="none" stroke="#AA5C00" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="34" y="337.2" font-size="12" text-anchor="start" fill="#222" font-weight="normal">book</text><text x="137" y="337.2" font-size="12" text-anchor="start" fill="#222" font-weight="normal">3</text><text x="202" y="337.2" font-size="12" text-anchor="start" fill="#222" font-weight="normal">600</text><text x="279" y="337.2" font-size="12" text-anchor="start" fill="#222" font-weight="normal">200</text><text x="34" y="365.2" font-size="12" text-anchor="start" fill="#222" font-weight="normal">tool</text><text x="137" y="365.2" font-size="12" text-anchor="start" fill="#222" font-weight="normal">2</text><text x="202" y="365.2" font-size="12" text-anchor="start" fill="#222" font-weight="normal">1000</text><text x="279" y="365.2" font-size="12" text-anchor="start" fill="#222" font-weight="normal">500</text><text x="180" y="408.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">$sum:1 counts; $sum:$amount adds values.</text><text x="180" y="424.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">$avg computes the mean; source orders remain six.</text></svg>