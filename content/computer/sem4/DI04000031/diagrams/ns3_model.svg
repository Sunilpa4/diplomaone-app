eight="60" rx="7" fill="#EAF3FE" stroke="#1565C0" stroke-width="1.6"/><text x="94" y="264.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">Base corrected</text><text x="94" y="278.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">35.0</text><rect x="190.0" y="237.0" width="152" height="60" rx="7" fill="#FDECEA" stroke="#B3261E" stroke-width="1.6"/><text x="266" y="264.2" font-size="12" text-anchor="middle" fill="#B3261E" font-weight="bold">Copy still old</text><text x="266" y="278.2" font-size="12" text-anchor="middle" fill="#B3261E" font-weight="bold">32.0</text><path d="M266 297 L266 329 L180 329 L180 354" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,354.0 183.5,347.0 176.5,347.0" fill="#7B2CD9"/><rect x="18.0" y="354.0" width="324" height="62" rx="7" fill="#F3ECFB" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="382.3" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">Explicit second write -&gt; copy 35.0</text><text x="180" y="395.8" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">No automatic cross-table correction</text><text x="180" y="450.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">No join/foreign-key/cascade is being enforced.</text><text x="180" y="466.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">The two writes are not one automatic transaction.</text></svg>