<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 510" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="510" fill="#ffffff"/><text x="180" y="27.2" font-size="15" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Cassandra peer architecture</text><text x="180" y="48.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">Multi-node picture is conceptual, not this lab</text><rect x="18.0" y="66.0" width="324" height="44" rx="7" fill="#EAF3FE" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="92.2" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">Client / cqlsh / application driver</text><path d="M180 110 L180 145" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,145.0 183.5,138.0 176.5,138.0" fill="#1565C0"/><rect x="85.0" y="145.0" width="190" height="68" rx="7" fill="#F3ECFB" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="176.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Node A</text><text x="180" y="190.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">coordinates this request</text><path d="M128 213 L86 263" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="86.0,263.0 93.2,259.9 87.8,255.4" fill="#7B2CD9"/><path d="M232 213 L274 263" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="274.0,263.0 272.2,255.4 266.8,259.9" fill="#7B2CD9"/><rect x="19.0" y="263.0" width="144" height="70" rx="7" fill="#EDF7EE" stroke="#2E7D32" stroke-width="1.6"/><text x="91" y="295.3" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">Peer node B</text><text x="91" y="308.8" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">owned data ranges</text><rect x="197.0" y="263.0" width="144" height="70" rx="7" fill="#EDF7EE" stroke="#2E7D32" stroke-width="1.6"/><text x="269" y="295.3" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">Peer node C</text><text x="269" y="308.8" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">owned data ranges</text><path d="M164 302 L194 302" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="194.0,302.0 187.0,298.5 187.0,305.5" fill="#2E7D32"/><rect x="18" y="363" width="324" height="81" rx="9" fill="#FFF4DF" stroke="#AA5C00" stroke-width="1.4"/><text x="180" y="388.9" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">Another peer can coordinate another request.</text><text x="180" y="409.9" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">Replica copies depend on keyspace policy.</text><text x="180" y="430.9" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">There is no mandatory global write-primary.</text><text x="180" y="473.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">Actual reference: one physical node, RF 1.</text><text x="180" y="489.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">No multi-node availability test is claimed.</text></svg>