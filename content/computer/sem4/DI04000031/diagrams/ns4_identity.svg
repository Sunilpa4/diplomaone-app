<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 490" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="490" fill="#ffffff"/><text x="180" y="27.2" font-size="15" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Identity and lab ownership differ</text><text x="180" y="48.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">Only successfully created scope/schema is owned</text><rect x="18" y="68" width="324" height="98" rx="9" fill="#EAF3FE" stroke="#1565C0" stroke-width="1.4"/><text x="180" y="96.8" font-size="10.8" text-anchor="middle" fill="#222" font-weight="normal">BUSINESS uniqueness: person_id</text><text x="180" y="122.8" font-size="10.8" text-anchor="middle" fill="#222" font-weight="normal">Duplicate P01 is rejected; ONLINE backing index.</text><text x="180" y="148.8" font-size="10.8" text-anchor="middle" fill="#222" font-weight="normal">No ID can still be absent: uniqueness != existence.</text><rect x="18" y="193" width="324" height="106" rx="9" fill="#F3ECFB" stroke="#7B2CD9" stroke-width="1.4"/><text x="180" y="220.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">LAB claim: fresh named ownership constraint</text><text x="180" y="243.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">CREATE succeeds -&gt; this runner owns the scope.</text><text x="180" y="266.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Existing/failed claim -&gt; do not remove it.</text><text x="180" y="289.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">A prefix alone is not a security sandbox.</text><rect x="18" y="328" width="324" height="102" rx="9" fill="#EDF7EE" stroke="#2E7D32" stroke-width="1.4"/><text x="180" y="354.8" font-size="10.8" text-anchor="middle" fill="#222" font-weight="normal">One statement: create P98, then duplicate P01</text><text x="180" y="377.8" font-size="10.8" text-anchor="middle" fill="#222" font-weight="normal">Server rejects -&gt; whole statement rolled back.</text><text x="180" y="400.8" font-size="10.8" text-anchor="middle" fill="#222" font-weight="normal">Observed P98 count is 0.</text><text x="180" y="423.8" font-size="10.8" text-anchor="middle" fill="#222" font-weight="normal">Earlier separate statements are not undone.</text><text x="180" y="465.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">No index-speed or multi-statement-atomicity claim.</text></svg>