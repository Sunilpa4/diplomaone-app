<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 450" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="450" fill="#ffffff"/><text x="180" y="27.2" font-size="15" text-anchor="middle" fill="#7B2CD9" font-weight="bold">BSON is typed binary data</text><text x="180" y="48.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">Not just JSON text or JavaScript typeof</text><rect x="18" y="66" width="324" height="277" rx="9" fill="#EAF3FE" stroke="#1565C0" stroke-width="1.4"/><text x="34" y="91.8" font-size="11" text-anchor="start" fill="#1565C0" font-weight="bold">FIELD</text><text x="160" y="91.8" font-size="11" text-anchor="start" fill="#1565C0" font-weight="bold">BSON TYPE</text><path d="M34 102 H326" fill="none" stroke="#1565C0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="34" y="126.2" font-size="12" text-anchor="start" fill="#222" font-weight="normal">_id</text><text x="160" y="126.2" font-size="12" text-anchor="start" fill="#222" font-weight="normal">ObjectId</text><text x="34" y="153.2" font-size="12" text-anchor="start" fill="#222" font-weight="normal">name</text><text x="160" y="153.2" font-size="12" text-anchor="start" fill="#222" font-weight="normal">String</text><text x="34" y="180.2" font-size="12" text-anchor="start" fill="#222" font-weight="normal">age</text><text x="160" y="180.2" font-size="12" text-anchor="start" fill="#222" font-weight="normal">Int32</text><text x="34" y="207.2" font-size="12" text-anchor="start" fill="#222" font-weight="normal">skills</text><text x="160" y="207.2" font-size="12" text-anchor="start" fill="#222" font-weight="normal">Array</text><text x="34" y="234.2" font-size="12" text-anchor="start" fill="#222" font-weight="normal">address</text><text x="160" y="234.2" font-size="12" text-anchor="start" fill="#222" font-weight="normal">Embedded document</text><text x="34" y="261.2" font-size="12" text-anchor="start" fill="#222" font-weight="normal">active</text><text x="160" y="261.2" font-size="12" text-anchor="start" fill="#222" font-weight="normal">Boolean</text><text x="34" y="288.2" font-size="12" text-anchor="start" fill="#222" font-weight="normal">joined</text><text x="160" y="288.2" font-size="12" text-anchor="start" fill="#222" font-weight="normal">Date</text><text x="34" y="315.2" font-size="12" text-anchor="start" fill="#222" font-weight="normal">score</text><text x="160" y="315.2" font-size="12" text-anchor="start" fill="#222" font-weight="normal">Double</text><rect x="18" y="365" width="324" height="65" rx="9" fill="#FFF4DF" stroke="#AA5C00" stroke-width="1.4"/><text x="180" y="391.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">ObjectId(hex) is not the same as a string.</text><text x="180" y="411.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">Use the stored identifier type in a filter.</text></svg>