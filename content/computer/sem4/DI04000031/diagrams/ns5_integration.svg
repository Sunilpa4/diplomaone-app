<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="470" fill="#ffffff"/><text x="180" y="27.2" font-size="15" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Application integration</text><text x="180" y="48.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">Reference: real Python + Redis, fixture source</text><rect x="18.0" y="64.0" width="324" height="48" rx="7" fill="#EAF3FE" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="92.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">Python / web application</text><path d="M180 112 L180 144" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,144.0 183.5,137.0 176.5,137.0" fill="#7B2CD9"/><rect x="18.0" y="144.0" width="324" height="48" rx="7" fill="#F3ECFB" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="172.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">Redis -&gt; cached values / sessions / IDs</text><path d="M180 192 L180 224" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,224.0 183.5,217.0 176.5,217.0" fill="#7B2CD9"/><rect x="18.0" y="224.0" width="324" height="48" rx="7" fill="#EDF7EE" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="252.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">Source database/service on a cache miss</text><rect x="18" y="313" width="324" height="95" rx="9" fill="#FFF4DF" stroke="#AA5C00" stroke-width="1.4"/><text x="180" y="340.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">The executed source is a local dictionary.</text><text x="180" y="364.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">No live multi-database integration or benchmark.</text><text x="180" y="388.7" font-size="10.7" text-anchor="middle" fill="#222" font-weight="normal">Caching recommendation IDs is not AI training.</text><text x="180" y="446.7" font-size="10.5" text-anchor="middle" fill="#625B71" font-weight="normal">Keep Redis private; applications mediate browser access.</text></svg>