<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 286" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="286" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Important String Functions &lt;string.h&gt;</text><rect x="10" y="34" width="165" height="74" rx="8" fill="#FAF7FE" stroke="#C9B3EC" stroke-width="1.2"/><rect x="10" y="34" width="165" height="22" rx="8" fill="#7B2CD9"/><rect x="10" y="46" width="165" height="10" fill="#7B2CD9"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="92" y="48.9" font-size="11" text-anchor="middle" fill="#fff" font-weight="bold">strlen(s)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="92" y="72.3" font-size="9.5" text-anchor="middle" fill="#222" font-weight="normal">strlen("Hello")</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="92" y="87.7" font-size="10.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">→ 5</text><text x="92" y="102.3" font-size="9.5" text-anchor="middle" fill="#555" font-weight="normal">length, without '\0'</text><rect x="185" y="34" width="165" height="74" rx="8" fill="#FAF7FE" stroke="#C9B3EC" stroke-width="1.2"/><rect x="185" y="34" width="165" height="22" rx="8" fill="#7B2CD9"/><rect x="185" y="46" width="165" height="10" fill="#7B2CD9"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="267" y="48.9" font-size="11" text-anchor="middle" fill="#fff" font-weight="bold">strcpy(d, s)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="267" y="72.3" font-size="9.5" text-anchor="middle" fill="#222" font-weight="normal">strcpy(d, "Hi")</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="267" y="87.7" font-size="10.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">→ d = "Hi"</text><text x="267" y="102.3" font-size="9.5" text-anchor="middle" fill="#555" font-weight="normal">copies s into d</text><rect x="10" y="116" width="165" height="74" rx="8" fill="#FAF7FE" stroke="#C9B3EC" stroke-width="1.2"/><rect x="10" y="116" width="165" height="22" rx="8" fill="#7B2CD9"/><rect x="10" y="128" width="165" height="10" fill="#7B2CD9"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="92" y="130.8" font-size="11" text-anchor="middle" fill="#fff" font-weight="bold">strcat(s1, s2)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="92" y="154.3" font-size="9.5" text-anchor="middle" fill="#222" font-weight="normal">s1="GTU ", s2="C"</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="92" y="169.7" font-size="10.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">→ s1 = "GTU C"</text><text x="92" y="184.3" font-size="9.5" text-anchor="middle" fill="#555" font-weight="normal">joins s2 at end of s1</text><rect x="185" y="116" width="165" height="74" rx="8" fill="#FAF7FE" stroke="#C9B3EC" stroke-width="1.2"/><rect x="185" y="116" width="165" height="22" rx="8" fill="#7B2CD9"/><rect x="185" y="128" width="165" height="10" fill="#7B2CD9"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="267" y="130.8" font-size="11" text-anchor="middle" fill="#fff" font-weight="bold">strcmp(s1, s2)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="267" y="154.3" font-size="9.5" text-anchor="middle" fill="#222" font-weight="normal">strcmp("abc","abd")</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="267" y="169.7" font-size="10.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">→ negative</text><text x="267" y="184.3" font-size="9.5" text-anchor="middle" fill="#555" font-weight="normal">0 if equal, &lt;0, &gt;0</text><rect x="10" y="198" width="165" height="74" rx="8" fill="#FAF7FE" stroke="#C9B3EC" stroke-width="1.2"/><rect x="10" y="198" width="165" height="22" rx="8" fill="#7B2CD9"/><rect x="10" y="210" width="165" height="10" fill="#7B2CD9"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="92" y="212.8" font-size="11" text-anchor="middle" fill="#fff" font-weight="bold">strchr(s, ch)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="92" y="236.3" font-size="9.5" text-anchor="middle" fill="#222" font-weight="normal">strchr("hello",'l')</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="92" y="251.7" font-size="10.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">→ "llo"</text><text x="92" y="266.3" font-size="9.5" text-anchor="middle" fill="#555" font-weight="normal">first occurrence of ch</text><rect x="185" y="198" width="165" height="74" rx="8" fill="#FAF7FE" stroke="#C9B3EC" stroke-width="1.2"/><rect x="185" y="198" width="165" height="22" rx="8" fill="#7B2CD9"/><rect x="185" y="210" width="165" height="10" fill="#7B2CD9"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="267" y="212.8" font-size="11" text-anchor="middle" fill="#fff" font-weight="bold">strstr(s1, s2)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="267" y="236.3" font-size="9.5" text-anchor="middle" fill="#222" font-weight="normal">strstr("diploma","lom")</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="267" y="251.7" font-size="10.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">→ "loma"</text><text x="267" y="266.3" font-size="9.5" text-anchor="middle" fill="#555" font-weight="normal">first occurrence of s2</text></svg>