<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 450" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="450" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Flowchart: Reverse of a Number</text><g transform="translate(0,12)"><rect x="132.0" y="24.0" width="96" height="32" rx="16.0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.8"/><text x="180" y="44.2" font-size="12" text-anchor="middle" fill="#1B5E20" font-weight="bold">Start</text><path d="M180 56 L180 75" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,75.0 183.5,68.0 176.5,68.0" fill="#222"/><polygon points="132.0,75.0 246.0,75.0 228.0,109.0 114.0,109.0" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.8"/><text x="180" y="96.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">Read n</text><path d="M180 109 L180 127" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,127.0 183.5,120.0 176.5,120.0" fill="#222"/><rect x="120.0" y="127.0" width="120" height="34" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.8"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="148.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">rev = 0</text><path d="M180 161 L180 179" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,179.0 183.5,172.0 176.5,172.0" fill="#222"/><polygon points="180,179.0 230.0,207 180,235.0 130.0,207" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.8"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="210.8" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">n &gt; 0 ?</text><path d="M180 235 L180 251" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,251.0 183.5,244.0 176.5,244.0" fill="#222"/><text x="200" y="247.7" font-size="10.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">True</text><rect x="110.0" y="251.0" width="140" height="34" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.8"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="272.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">d = n % 10</text><path d="M180 285 L180 299" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,299.0 183.5,292.0 176.5,292.0" fill="#222"/><rect x="105.0" y="299.0" width="150" height="34" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.8"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="320.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">rev = rev*10 + d</text><path d="M180 333 L180 347" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,347.0 183.5,340.0 176.5,340.0" fill="#222"/><rect x="110.0" y="347.0" width="140" height="34" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.8"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="368.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">n = n / 10</text><path d="M180 381 L180 396 L50 396 L50 170 L176 170" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="176.0,170.0 169.0,166.5 169.0,173.5" fill="#222"/><text transform="rotate(-90 40 290)" x="40" y="293.7" font-size="10.5" text-anchor="middle" fill="#666" font-weight="bold">Loop</text><path d="M230 207 L300 207 L300 251" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="300.0,251.0 303.5,244.0 296.5,244.0" fill="#222"/><text x="264" y="201.7" font-size="10.5" text-anchor="middle" fill="#C62828" font-weight="bold">False</text><polygon points="269.0,251.0 349.0,251.0 331.0,285.0 251.0,285.0" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.8"/><text x="300" y="272.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">Print rev</text><path d="M300 285 L300 312" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="300.0,312.0 303.5,305.0 296.5,305.0" fill="#222"/><rect x="262.0" y="312.0" width="76" height="32" rx="16.0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.8"/><text x="300" y="332.2" font-size="12" text-anchor="middle" fill="#1B5E20" font-weight="bold">Stop</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="427.7" font-size="10.5" text-anchor="middle" fill="#444" font-weight="normal">Example: n = 472 → rev = 274</text></g></svg>