<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 382" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="382" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Flowchart: Factorial of N (Loop)</text><rect x="102.0" y="30.0" width="96" height="32" rx="16.0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.8"/><text x="150" y="50.2" font-size="12" text-anchor="middle" fill="#1B5E20" font-weight="bold">Start</text><path d="M150 62 L150 80" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="150.0,80.0 153.5,73.0 146.5,73.0" fill="#222"/><polygon points="97.0,79.0 221.0,79.0 203.0,113.0 79.0,113.0" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.8"/><text x="150" y="100.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">Read N</text><path d="M150 113 L150 130" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="150.0,130.0 153.5,123.0 146.5,123.0" fill="#222"/><rect x="85.0" y="130.0" width="130" height="34" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.8"/><text x="150" y="151.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">F = 1, i = 1</text><path d="M150 164 L150 192" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="150.0,192.0 153.5,185.0 146.5,185.0" fill="#222"/><polygon points="150,193.0 200.0,220 150,247.0 100.0,220" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.8"/><text x="150" y="223.8" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">i &lt;= N ?</text><path d="M150 247 L150 268" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="150.0,268.0 153.5,261.0 146.5,261.0" fill="#222"/><text x="168" y="260.7" font-size="10.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">Yes</text><rect x="85.0" y="268.0" width="130" height="34" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.8"/><text x="150" y="289.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">F = F × i</text><path d="M150 302 L150 320" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="150.0,320.0 153.5,313.0 146.5,313.0" fill="#222"/><rect x="85.0" y="320.0" width="130" height="34" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.8"/><text x="150" y="341.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">i = i + 1</text><path d="M150 354 L150 366 L40 366 L40 178 L150 178" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="150.0,178.0 143.0,174.5 143.0,181.5" fill="#222"/><text transform="rotate(-90 30 272)" x="30" y="275.7" font-size="10.5" text-anchor="middle" fill="#666" font-weight="bold">Loop</text><path d="M200 220 L290 220 L290 268" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="290.0,268.0 293.5,261.0 286.5,261.0" fill="#222"/><text x="250" y="214.7" font-size="10.5" text-anchor="middle" fill="#C62828" font-weight="bold">No</text><polygon points="257.0,268.0 341.0,268.0 323.0,302.0 239.0,302.0" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.8"/><text x="290" y="289.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">Print F</text><path d="M290 302 L290 330" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="290.0,330.0 293.5,323.0 286.5,323.0" fill="#222"/><rect x="250.0" y="330.0" width="80" height="32" rx="16.0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.8"/><text x="290" y="350.2" font-size="12" text-anchor="middle" fill="#1B5E20" font-weight="bold">Stop</text></svg>