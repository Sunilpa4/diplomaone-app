<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="250" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Jumps in Loops: break and continue</text><rect x="10" y="32" width="165" height="172" rx="8" fill="#F7F2FD" stroke="#C9B3EC" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="92" y="52.4" font-size="12.5" text-anchor="middle" fill="#C62828" font-weight="bold">break</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="18.0" y="75.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">while (test) {</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="43.28" y="94.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">....</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="43.28" y="113.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">if (cond)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="68.56" y="132.7" font-size="10.5" text-anchor="start" fill="#C62828" font-weight="bold">break;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="43.28" y="151.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">....</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="18.0" y="170.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">}</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="18.0" y="189.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">next stmt;</text><path d="M110.48 129 L165 129 L165 186 L86.2 186" fill="none" stroke="#C62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="86.2,186.0 93.2,189.5 93.2,182.5" fill="#C62828"/><text x="92" y="225.7" font-size="10.5" text-anchor="middle" fill="#333" font-weight="bold">Exits the loop</text><text x="92" y="240.7" font-size="10.5" text-anchor="middle" fill="#444" font-weight="normal">immediately</text><rect x="185" y="32" width="165" height="172" rx="8" fill="#F7F2FD" stroke="#C9B3EC" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="267" y="52.4" font-size="12.5" text-anchor="middle" fill="#1565C0" font-weight="bold">continue</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="193.0" y="75.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">while (test) {</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="218.28" y="94.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">....</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="218.28" y="113.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">if (cond)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="243.56" y="132.7" font-size="10.5" text-anchor="start" fill="#1565C0" font-weight="bold">continue;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="218.28" y="151.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">....</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="193.0" y="170.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">}</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="193.0" y="189.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">next stmt;</text><path d="M304.44 129 L340 129 L340 72 L286.48 72" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="286.5,72.0 293.5,75.5 293.5,68.5" fill="#1565C0"/><text x="267" y="225.7" font-size="10.5" text-anchor="middle" fill="#333" font-weight="bold">Skips rest of body,</text><text x="267" y="240.7" font-size="10.5" text-anchor="middle" fill="#444" font-weight="normal">next iteration</text></svg>