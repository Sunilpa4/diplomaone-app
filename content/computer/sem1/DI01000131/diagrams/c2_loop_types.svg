<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 350" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="350" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Entry-controlled vs Exit-controlled Loop</text><path d="M180 36 V340" fill="none" stroke="#C9B3EC" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><text x="90" y="48.0" font-size="11.5" text-anchor="middle" fill="#1565C0" font-weight="bold">Entry-controlled</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="90" y="61.7" font-size="10.5" text-anchor="middle" fill="#444" font-weight="normal">(while, for)</text><rect x="30.0" y="71.0" width="120" height="30" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.8"/><text x="90" y="90.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">Initialization</text><path d="M90 101 L90 122" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="90.0,122.0 93.5,115.0 86.5,115.0" fill="#222"/><polygon points="90,122.0 145.0,150 90,178.0 35.0,150" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.8"/><text x="90" y="147.3" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">Test</text><text x="90" y="160.3" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">condition?</text><path d="M90 178 L90 198" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="90.0,198.0 93.5,191.0 86.5,191.0" fill="#222"/><text x="108" y="191.7" font-size="10.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">True</text><rect x="30.0" y="199.0" width="120" height="32" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.8"/><text x="90" y="219.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">Body of loop</text><path d="M90 231 L90 244 L22 244 L22 112 L86 112" fill="none" s