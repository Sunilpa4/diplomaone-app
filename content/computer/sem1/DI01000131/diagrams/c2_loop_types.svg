.3" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">condition?</text><path d="M325 204 L345 204 L345 114 L274 114" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="274.0,114.0 281.0,117.5 281.0,110.5" fill="#222"/><text x="330" y="225.7" font-size="10.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">True</text><path d="M270 232 L270 272" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="270.0,272.0 273.5,265.0 266.5,265.0" fill="#222"/><text x="290" y="255.7" font-size="10.5" text-anchor="middle" fill="#C62828" font-weight="bold">False</text><rect x="210.0" y="273.0" width="120" height="32" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.8"/><text x="270" y="293.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">Next statement</text><text x="90" y="325.7" font-size="10.5" text-anchor="middle" fill="#333" font-weight="bold">Condition tested first</text><text x="90" y="340.7" font-size="10.5" text-anchor="middle" fill="#444" font-weight="normal">Body may run 0 times</text><text x="270" y="325.7" font-size="10.5" text-anchor="middle" fill="#333" font-weight="bold">Condition tested last</text><text x="270" y="340.7" font-size="10.5" text-anchor="middle" fill="#444" font-weight="normal">Body runs at least once</text></svg>