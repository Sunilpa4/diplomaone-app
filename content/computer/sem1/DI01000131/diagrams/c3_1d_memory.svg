<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 254" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="254" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">One-dimensional Array in Memory</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="45.9" font-size="11" text-anchor="middle" fill="#7B2CD9" font-weight="bold">int a[5] = {10, 20, 30, 40, 50};</text><text x="66" y="93.7" font-size="10.5" text-anchor="end" fill="#333" font-weight="bold">Value</text><text x="66" y="129.7" font-size="10.5" text-anchor="end" fill="#333" font-weight="bold">Element</text><text x="66" y="147.7" font-size="10.5" text-anchor="end" fill="#333" font-weight="bold">Address</text><rect x="74" y="70" width="54" height="40" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="101.0" y="94.5" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">10</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="101.0" y="129.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="normal">a[0]</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="101.0" y="147.7" font-size="10.5" text-anchor="middle" fill="#1565C0" font-weight="normal">1000</text><rect x="128" y="70" width="54" height="40" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="155.0" y="94.5" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">20</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="155.0" y="129.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="normal">a[1]</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="155.0" y="147.7" font-size="10.5" text-anchor="middle" fill="#1565C0" font-weight="normal">1004</text><rect x="182" y="70" width="54" height="40" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="209.0" y="94.5" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">30</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="209.0" y="129.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="normal">a[2]</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="209.0" y="147.7" font-size="10.5" text-anchor="middle" fill="#1565C0" font-weight="normal">1008</text><rect x="236" y="70" width="54" height="40" fill="#FFF1C2" stroke="#C99A00" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="263.0" y="94.5" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">40</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="263.0" y="129.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="normal">a[3]</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="263.0" y="147.7" font-size="10.5" text-anchor="middle" fill="#1565C0" font-weight="normal">1012</text><rect x="290" y="70" width="54" height="40" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="317.0" y="94.5" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">50</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="317.0" y="129.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="normal">a[4]</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="317.0" y="147.7" font-size="10.5" text-anchor="middle" fill="#1565C0" font-weight="normal">1016</text><path d="M74 156 V162 H344 V156" fill="none" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="180" y="181.7" font-size="10.5" text-anchor="middle" fill="#444" font-weight="normal">5 elements × 4 bytes = 20 bytes (contiguous)</text><text x="180" y="205.8" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">Address of a[i] = Base + i × size</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="223.7" font-size="10.5" text-anchor="middle" fill="#8D6E00" font-weight="normal">a[3] = 1000 + 3 × 4 = 1012</text><text x="180" y="243.7" font-size="10.5" text-anchor="middle" fill="#444" font-weight="normal">Index starts at 0, last index = size − 1</text></svg>