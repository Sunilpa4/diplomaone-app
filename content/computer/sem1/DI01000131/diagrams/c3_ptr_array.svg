<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 268" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="268" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Pointers and Arrays</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="45.5" font-size="10" text-anchor="middle" fill="#7B2CD9" font-weight="bold">int a[5] = {10, 20, 30, 40, 50};  int *p = a;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="68.0" y="69.8" font-size="11" text-anchor="middle" fill="#C62828" font-weight="bold">p</text><path d="M68.0 72 L68.0 92" fill="none" stroke="#C62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="68.0,92.0 71.5,85.0 64.5,85.0" fill="#C62828"/><rect x="40" y="94" width="56" height="38" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="68.0" y="117.5" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">10</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="68.0" y="149.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="normal">a[0]</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="68.0" y="165.5" font-size="10" text-anchor="middle" fill="#1565C0" font-weight="normal">1000</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="124.0" y="69.8" font-size="11" text-anchor="middle" fill="#C62828" font-weight="bold">p+1</text><path d="M124.0 72 L124.0 92" fill="none" stroke="#C62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="124.0,92.0 127.5,85.0 120.5,85.0" fill="#C62828"/><rect x="96" y="94" width="56" height="38" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="124.0" y="117.5" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">20</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="124.0" y="149.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="normal">a[1]</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="124.0" y="165.5" font-size="10" text-anchor="middle" fill="#1565C0" font-weight="normal">1004</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180.0" y="69.8" font-size="11" text-anchor="middle" fill="#C62828" font-weight="bold">p+2</text><path d="M180.0 72 L180.0 92" fill="none" stroke="#C62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,92.0 183.5,85.0 176.5,85.0" fill="#C62828"/><rect x="152" y="94" width="56" height="38" fill="#FFF1C2" stroke="#C99A00" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180.0" y="117.5" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">30</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180.0" y="149.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="normal">a[2]</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180.0" y="165.5" font-size="10" text-anchor="middle" fill="#1565C0" font-weight="normal">1008</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="236.0" y="69.8" font-size="11" text-anchor="middle" fill="#C62828" font-weight="bold">p+3</text><path d="M236.0 72 L236.0 92" fill="none" stroke="#C62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="236.0,92.0 239.5,85.0 232.5,85.0" fill="#C62828"/><rect x="208" y="94" width="56" height="38" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="236.0" y="117.5" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">40</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="236.0" y="149.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="normal">a[3]</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="236.0" y="165.5" font-size="10" text-anchor="middle" fill="#1565C0" font-weight="normal">1012</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="292.0" y="69.8" font-size="11" text-anchor="middle" fill="#C62828" font-weight="bold">p+4</text><path d="M292.0 72 L292.0 92" fill="none" stroke="#C62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="292.0,92.0 295.5,85.0 288.5,85.0" fill="#C62828"/><rect x="264" y="94" width="56" height="38" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="292.0" y="117.5" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">50</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="292.0" y="149.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="normal">a[4]</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="292.0" y="165.5" font-size="10" text-anchor="middle" fill="#1565C0" font-weight="normal">1016</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="193.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="bold">a  =  &amp;a[0]  =  p  =  1000</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="212.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="bold">a[i]  ≡  *(a + i)  ≡  *(p + i)  ≡  p[i]</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="231.7" font-size="10.5" text-anchor="middle" fill="#8D6E00" font-weight="normal">*(p + 2) = a[2] = 30</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="250.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="normal">p + 1 → 1004 (moves by sizeof(int) = 4)</text></svg>