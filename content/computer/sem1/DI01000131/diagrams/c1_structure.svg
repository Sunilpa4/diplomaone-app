<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 374" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="374" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Basic Structure of a C Program</text><rect x="14.0" y="38.0" width="190" height="34" rx="6" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1.6"/><text x="109" y="59.0" font-size="11.5" text-anchor="middle" fill="#333" font-weight="bold">Documentation Section</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="214" y="58.7" font-size="10.5" text-anchor="start" fill="#444" font-weight="normal">/* comments */</text><rect x="14.0" y="78.0" width="190" height="34" rx="6" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1.6"/><text x="109" y="99.0" font-size="11.5" text-anchor="middle" fill="#333" font-weight="bold">Link Section</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="214" y="98.7" font-size="10.5" text-anchor="start" fill="#444" font-weight="normal">#include &lt;stdio.h&gt;</text><rect x="14.0" y="118.0" width="190" height="34" rx="6" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1.6"/><text x="109" y="139.0" font-size="11.5" text-anchor="middle" fill="#333" font-weight="bold">Definition Section</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="214" y="138.7" font-size="10.5" text-anchor="start" fill="#444" font-weight="normal">#define PI 3.14</text><rect x="14.0" y="158.0" width="190" height="34" rx="6" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1.6"/><text x="109" y="179.0" font-size="11.5" text-anchor="middle" fill="#333" font-weight="bold">Global Declaration Section</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="214" y="178.7" font-size="10.5" text-anchor="start" fill="#444" font-weight="normal">int count;</text><rect x="14" y="198" width="190" height="104" rx="6" fill="#EADDF7" stroke="#7B2CD9" stroke-width="1.6"/><text x="109" y="216.0" font-size="11.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">main() Function Section</text><text x="109" y="234.2" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">{</text><rect x="29.0" y="237.0" width="160" height="24" rx="7" fill="#fff" stroke="#9C6ADE" stroke-width="1.6"/><text x="109" y="252.8" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">Declaration part</text><rect x="29.0" y="265.0" width="160" height="24" rx="7" fill="#fff" stroke="#9C6ADE" stroke-width="1.6"/><text x="109" y="280.9" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">Executable part</text><text x="109" y="299.2" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">}</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="214" y="252.7" font-size="10.5" text-anchor="start" fill="#444" font-weight="normal">int a, b;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="214" y="280.7" font-size="10.5" text-anchor="start" fill="#444" font-weight="normal">printf("...");</text><rect x="14.0" y="308.0" width="190" height="34" rx="6" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1.6"/><text x="109" y="329.0" font-size="11.5" text-anchor="middle" fill="#333" font-weight="bold">Subprogram Section</text><text x="214" y="328.7" font-size="10.5" text-anchor="start" fill="#444" font-weight="normal">user-defined functions</text><text x="180" y="363.7" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal">Only main() is compulsory; other sections are optional.</text></svg>