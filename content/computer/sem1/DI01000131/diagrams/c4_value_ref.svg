<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 336" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="336" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Call by Value vs Call by Reference</text><rect x="8" y="32" width="344" height="132" rx="8" fill="#F7F2FD" stroke="#C9B3EC" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="52.0" font-size="11.5" text-anchor="middle" fill="#1565C0" font-weight="bold">Call by Value:  swap(a, b);</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="80" y="71.7" font-size="10.5" text-anchor="middle" fill="#555" font-weight="bold">main()</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="275" y="71.7" font-size="10.5" text-anchor="middle" fill="#555" font-weight="bold">swap(int x, int y)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="52" y="87.8" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">a</text><rect x="28" y="90" width="48" height="30" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="52.0" y="109.2" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">10</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="110" y="87.8" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">b</text><rect x="86" y="90" width="48" height="30" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="110.0" y="109.2" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">20</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="246" y="87.8" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">x</text><rect x="218" y="90" width="56" height="30" fill="#FFF1C2" stroke="#C99A00" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="246.0" y="108.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="bold">10 → 20</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="306" y="87.8" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">y</text><rect x="278" y="90" width="56" height="30" fill="#FFF1C2" stroke="#C99A00" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="306.0" y="108.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="bold">20 → 10</text><path d="M134 105 H214" fill="none" stroke="#666" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><polygon points="216.0,105.0 210.0,102.0 210.0,108.0" fill="#666"/><text x="175" y="101.5" font-size="10" text-anchor="middle" fill="#666" font-weight="bold">copies</text><text x="180" y="143.7" font-size="10.5" text-anchor="middle" fill="#333" font-weight="normal">Only the copies x, y are swapped.</text><text x="180" y="158.7" font-size="10.5" text-anchor="middle" fill="#C62828" font-weight="bold">a = 10, b = 20 remain unchanged.</text><rect x="8" y="176" width="344" height="150" rx="8" fill="#F7F2FD" stroke="#C9B3EC" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="196.0" font-size="11.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">Call by Reference:  swap(&amp;a, &amp;b);</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="80" y="215.7" font-size="10.5" text-anchor="middle" fill="#555" font-weight="bold">main()</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="275" y="215.7" font-size="10.5" text-anchor="middle" fill="#555" font-weight="bold">swap(int *x, int *y)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="52" y="231.8" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">a</text><rect x="24" y="234" width="56" height="30" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="52.0" y="252.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="bold">10 → 20</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="52" y="280.5" font-size="10" text-anchor="middle" fill="#1565C0" font-weight="normal">1000</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="110" y="231.8" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">b</text><rect x="82" y="234" width="56" height="30" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="110.0" y="252.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="bold">20 → 10</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="110" y="280.5" font-size="10" text-anchor="middle" fill="#1565C0" font-weight="normal">1004</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="246" y="231.8" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">x</text><rect x="222" y="234" width="48" height="30" fill="#FFF1C2" stroke="#C99A00" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="246.0" y="253.2" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">1000</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="306" y="231.8" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">y</text><rect x="282" y="234" width="48" height="30" fill="#FFF1C2" stroke="#C99A00" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="306.0" y="253.2" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">1004</text><path d="M222 256 L190 288 L60 288 L52 265" fill="none" stroke="#C62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="52.0,265.0 51.0,272.8 57.6,270.5" fill="#C62828"/><path d="M306 265 L306 294 L118 294 L110 265" fill="none" stroke="#C62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="110.0,265.0 108.5,272.7 115.2,270.8" fill="#C62828"/><text x="180" y="315.7" font-size="10.5" text-anchor="middle" fill="#333" font-weight="normal">Addresses passed: *x, *y change the original a, b.</text></svg>