<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 262" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="262" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">void Pointer and NULL Pointer</text><path d="M180 34 V258" fill="none" stroke="#C9B3EC" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><text x="90" y="48.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">void pointer</text><rect x="30.0" y="58.0" width="120" height="28" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="90" y="76.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="bold">void *vp;</text><path d="M90 86 L36 128" fill="none" stroke="#1565C0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><polygon points="36.0,130.0 41.3,125.8 35.8,123.3" fill="#1565C0"/><rect x="11" y="132" width="50" height="38" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="36" y="148.3" font-size="9.5" text-anchor="middle" fill="#444" font-weight="normal">int</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="36" y="164.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="bold">10</text><path d="M90 86 L90 128" fill="none" stroke="#1565C0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><polygon points="90.0,130.0 93.0,124.0 87.0,124.0" fill="#1565C0"/><rect x="65" y="132" width="50" height="38" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="90" y="148.3" font-size="9.5" text-anchor="middle" fill="#444" font-weight="normal">float</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="90" y="164.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="bold">2.5</text><path d="M90 86 L144 128" fill="none" stroke="#1565C0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><polygon points="144.0,130.0 144.2,123.3 138.7,125.8" fill="#1565C0"/><rect x="119" y="132" width="50" height="38" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="144" y="148.3" font-size="9.5" text-anchor="middle" fill="#444" font-weight="normal">char</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="144" y="164.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="bold">'A'</text><text x="90" y="197.7" font-size="10.5" text-anchor="middle" fill="#333" font-weight="normal">Generic pointer: can hold</text><text x="90" y="211.7" font-size="10.5" text-anchor="middle" fill="#333" font-weight="normal">address of any type</text><text x="90" y="233.7" font-size="10.5" text-anchor="middle" fill="#444" font-weight="normal">Cast before using *:</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="90" y="249.8" font-size="11" text-anchor="middle" fill="#8D6E00" font-weight="bold">*(int *)vp</text><text x="270" y="48.2" font-size="12" text-anchor="middle" fill="#C62828" font-weight="bold">NULL pointer</text><rect x="195.0" y="58.0" width="150" height="28" rx="7" fill="#FDECEC" stroke="#C62828" stroke-width="1.6"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="270" y="76.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="bold">int *np = NULL;</text><path d="M270 86 L270 124" fill="none" stroke="#C62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="270.0,124.0 273.5,117.0 266.5,117.0" fill="#C62828"/><path d="M250 128 H290" fill="none" stroke="#C62828" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M257 135 H283" fill="none" stroke="#C62828" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M264 142 H276" fill="none" stroke="#C62828" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="270" y="165.7" font-size="10.5" text-anchor="middle" fill="#C62828" font-weight="normal">NULL (address 0)</text><text x="270" y="197.7" font-size="10.5" text-anchor="middle" fill="#333" font-weight="normal">Points to no valid</text><text x="270" y="211.7" font-size="10.5" text-anchor="middle" fill="#333" font-weight="normal">memory location</text><text x="270" y="233.7" font-size="10.5" text-anchor="middle" fill="#444" font-weight="normal">Check before using *:</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="270" y="249.8" font-size="11" text-anchor="middle" fill="#8D6E00" font-weight="bold">if (np != NULL)</text></svg>