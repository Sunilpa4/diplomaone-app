<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="320" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Modular (Top-down) Programming</text><rect x="120.0" y="40.0" width="120" height="32" rx="7" fill="#7B2CD9" stroke="#7B2CD9" stroke-width="1.6"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="60.4" font-size="12.5" text-anchor="middle" fill="#fff" font-weight="bold">main()</text><path d="M180 72 V92" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M62 92 H298" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M62 92 L62 112" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="62.0,112.0 65.5,105.0 58.5,105.0" fill="#222"/><rect x="8.0" y="113.0" width="108" height="30" rx="7" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1.6"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="62" y="131.8" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">read_data()</text><path d="M180 92 L180 112" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,112.0 183.5,105.0 176.5,105.0" fill="#222"/><rect x="126.0" y="113.0" width="108" height="30" rx="7" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1.6"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="131.8" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">calculate()</text><path d="M298 92 L298 112" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="298.0,112.0 301.5,105.0 294.5,105.0" fill="#222"/><rect x="244.0" y="113.0" width="108" height="30" rx="7" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1.6"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="298" y="131.8" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">display()</text><path d="M180 143 V170" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M128 170 H232" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M128 170 L128 188" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="128.0,188.0 131.5,181.0 124.5,181.0" fill="#222"/><rect x="82.0" y="188.0" width="92" height="28" rx="7" fill="#fff" stroke="#9C6ADE" stroke-width="1.6"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="128" y="205.8" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">tax()</text><path d="M232 170 L232 188" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="232.0,188.0 235.5,181.0 228.5,181.0" fill="#222"/><rect x="186.0" y="188.0" width="92" height="28" rx="7" fill="#fff" stroke="#9C6ADE" stroke-width="1.6"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="232" y="205.8" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">grade()</text><text x="22" y="255.7" font-size="10.5" text-anchor="start" fill="#333" font-weight="normal">• Big program divided into small modules (functions)</text><text x="22" y="272.7" font-size="10.5" text-anchor="start" fill="#333" font-weight="normal">• Each function does one well-defined task</text><text x="22" y="289.7" font-size="10.5" text-anchor="start" fill="#333" font-weight="normal">• main() calls functions; functions can call others</text><text x="22" y="306.7" font-size="10.5" text-anchor="start" fill="#333" font-weight="normal">• Easy to write, test, debug and reuse</text></svg>