<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 334" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="334" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Recursion Tree: fib(4)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="43.5" font-size="10" text-anchor="middle" fill="#7B2CD9" font-weight="bold">fib(n) = fib(n-1) + fib(n-2);  fib(0)=0, fib(1)=1</text><path d="M180 78 L104 112" fill="none" stroke="#9C6ADE" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M180 78 L272 112" fill="none" stroke="#9C6ADE" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M104 136 L59 170" fill="none" stroke="#9C6ADE" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M104 136 L150 170" fill="none" stroke="#9C6ADE" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M272 136 L232 170" fill="none" stroke="#9C6ADE" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M272 136 L312 170" fill="none" stroke="#9C6ADE" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M59 194 L30 228" fill="none" stroke="#9C6ADE" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M59 194 L90 228" fill="none" stroke="#9C6ADE" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="153" y="54" width="54" height="24" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180.0" y="69.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="bold">fib(4)</text><text x="211" y="57.3" font-size="9.5" text-anchor="start" fill="#8D6E00" font-weight="bold">=3</text><rect x="77" y="112" width="54" height="24" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="104.0" y="127.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="bold">fib(3)</text><text x="135" y="115.3" font-size="9.5" text-anchor="start" fill="#8D6E00" font-weight="bold">=2</text><rect x="245" y="112" width="54" height="24" fill="#FFF1C2" stroke="#C99A00" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="272.0" y="127.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="bold">fib(2)</text><text x="303" y="115.3" font-size="9.5" text-anchor="start" fill="#8D6E00" font-weight="bold">=1</text><rect x="32" y="170" width="54" height="24" fill="#FFF1C2" stroke="#C99A00" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="59.0" y="185.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="bold">fib(2)</text><text x="90" y="173.3" font-size="9.5" text-anchor="start" fill="#8D6E00" font-weight="bold">=1</text><rect x="123" y="170" width="54" height="24" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="150.0" y="185.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="bold">fib(1)</text><text x="181" y="173.3" font-size="9.5" text-anchor="start" fill="#2E7D32" font-weight="bold">=1</text><rect x="205" y="170" width="54" height="24" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="232.0" y="185.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="bold">fib(1)</text><text x="263" y="173.3" font-size="9.5" text-anchor="start" fill="#2E7D32" font-weight="bold">=1</text><rect x="285" y="170" width="54" height="24" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="312.0" y="185.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="bold">fib(0)</text><text x="343" y="173.3" font-size="9.5" text-anchor="start" fill="#2E7D32" font-weight="bold">=0</text><rect x="3" y="228" width="54" height="24" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="30.0" y="243.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="bold">fib(1)</text><text x="30" y="267.3" font-size="9.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">=1</text><rect x="63" y="228" width="54" height="24" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="90.0" y="243.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="bold">fib(0)</text><text x="90" y="267.3" font-size="9.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">=0</text><rect x="24" y="276" width="14" height="12" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.5"/><text x="44" y="285.5" font-size="10" text-anchor="start" fill="#333" font-weight="normal">base case</text><rect x="124" y="276" width="14" height="12" fill="#FFF1C2" stroke="#C99A00" stroke-width="1.5"/><text x="144" y="285.5" font-size="10" text-anchor="start" fill="#333" font-weight="normal">fib(2) computed twice</text><text x="180" y="309.7" font-size="10.5" text-anchor="middle" fill="#444" font-weight="normal">fib(4) = 3, but 9 calls are made → recursion</text><text x="180" y="324.7" font-size="10.5" text-anchor="middle" fill="#444" font-weight="normal">can repeat work and is slower than a loop.</text></svg>