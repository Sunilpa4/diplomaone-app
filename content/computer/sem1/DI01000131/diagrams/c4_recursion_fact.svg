<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 332" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="332" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Recursion: How fact(4) Works</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="43.7" font-size="10.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">fact(n) = n * fact(n-1),  fact(1) = 1</text><rect x="20" y="56" width="182" height="30" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="111.0" y="74.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="normal">fact(4) = 4 * fact(3)</text><path d="M38 86 L56 108" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="56.0,108.0 54.3,100.4 48.9,104.8" fill="#1565C0"/><text x="24" y="103.3" font-size="9.5" text-anchor="start" fill="#1565C0" font-weight="bold">call</text><path d="M228 123 L254 123 L254 71 L206 71" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="206.0,71.0 213.0,74.5 213.0,67.5" fill="#2E7D32"/><text x="258" y="99.5" font-size="10" text-anchor="start" fill="#2E7D32" font-weight="bold">returns 6</text><rect x="46" y="108" width="182" height="30" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="137.0" y="126.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="normal">fact(3) = 3 * fact(2)</text><path d="M64 138 L82 160" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="82.0,160.0 80.3,152.4 74.9,156.8" fill="#1565C0"/><text x="50" y="155.3" font-size="9.5" text-anchor="start" fill="#1565C0" font-weight="bold">call</text><path d="M254 175 L280 175 L280 123 L232 123" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="232.0,123.0 239.0,126.5 239.0,119.5" fill="#2E7D32"/><text x="284" y="151.5" font-size="10" text-anchor="start" fill="#2E7D32" font-weight="bold">returns 2</text><rect x="72" y="160" width="182" height="30" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="163.0" y="178.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="normal">fact(2) = 2 * fact(1)</text><path d="M90 190 L108 212" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="108.0,212.0 106.3,204.4 100.9,208.8" fill="#1565C0"/><text x="76" y="207.3" font-size="9.5" text-anchor="start" fill="#1565C0" font-weight="bold">call</text><path d="M280 227 L306 227 L306 175 L258 175" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="258.0,175.0 265.0,178.5 265.0,171.5" fill="#2E7D32"/><text x="310" y="203.5" font-size="10" text-anchor="start" fill="#2E7D32" font-weight="bold">returns 1</text><rect x="98" y="212" width="182" height="30" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="189.0" y="230.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="bold">fact(1) = 1</text><text x="180" y="288.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="bold">Result: 4 × 3 × 2 × 1 = 24</text><text x="180" y="307.7" font-size="10.5" text-anchor="middle" fill="#444" font-weight="normal">Calls go down until the base case; then results</text><text x="180" y="322.7" font-size="10.5" text-anchor="middle" fill="#444" font-weight="normal">return upward. Each call waits on the stack.</text></svg>