<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 268" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="268" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">File I/O Functions &lt;stdio.h&gt;</text><rect x="10" y="34" width="340" height="24" fill="#7B2CD9"/><text x="58.0" y="49.7" font-size="10.5" text-anchor="middle" fill="#fff" font-weight="bold">Type</text><text x="167.0" y="49.7" font-size="10.5" text-anchor="middle" fill="#fff" font-weight="bold">Read</text><text x="289.0" y="49.7" font-size="10.5" text-anchor="middle" fill="#fff" font-weight="bold">Write</text><text x="58" y="81.7" font-size="10.5" text-anchor="middle" fill="#333" font-weight="bold">Character</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="167" y="75.5" font-size="10" text-anchor="middle" fill="#2E7D32" font-weight="bold">fgetc(fp)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="167" y="87.5" font-size="10" text-anchor="middle" fill="#2E7D32" font-weight="bold">getc(fp)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="289" y="75.5" font-size="10" text-anchor="middle" fill="#C62828" font-weight="bold">fputc(ch, fp)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="289" y="87.5" font-size="10" text-anchor="middle" fill="#C62828" font-weight="bold">putc(ch, fp)</text><rect x="10" y="98" width="340" height="30" fill="#FAF7FE"/><text x="58" y="116.7" font-size="10.5" text-anchor="middle" fill="#333" font-weight="bold">String</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="167" y="116.5" font-size="10" text-anchor="middle" fill="#2E7D32" font-weight="bold">fgets(s, n, fp)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="289" y="116.5" font-size="10" text-anchor="middle" fill="#C62828" font-weight="bold">fputs(s, fp)</text><text x="58" y="146.7" font-size="10.5" text-anchor="middle" fill="#333" font-weight="bold">Formatted</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="167" y="146.5" font-size="10" text-anchor="middle" fill="#2E7D32" font-weight="bold">fscanf(fp, ...)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="289" y="146.5" font-size="10" text-anchor="middle" fill="#C62828" font-weight="bold">fprintf(fp, ...)</text><rect x="10" y="158" width="340" height="30" fill="#FAF7FE"/><text x="58" y="176.7" font-size="10.5" text-anchor="middle" fill="#333" font-weight="bold">Open / Close</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="167" y="176.5" font-size="10" text-anchor="middle" fill="#2E7D32" font-weight="bold">fopen(name, mode)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="289" y="176.5" font-size="10" text-anchor="middle" fill="#C62828" font-weight="bold">fclose(fp)</text><text x="58" y="206.7" font-size="10.5" text-anchor="middle" fill="#333" font-weight="bold">End of file</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="167" y="206.5" font-size="10" text-anchor="middle" fill="#2E7D32" font-weight="bold">EOF, feof(fp)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="289" y="206.5" font-size="10" text-anchor="middle" fill="#C62828" font-weight="bold">—</text><path d="M10 218 H350" fill="none" stroke="#E0D3F2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="180" y="241.7" font-size="10.5" text-anchor="middle" fill="#444" font-weight="normal">Same as getchar/putchar, gets/puts, scanf/printf</text><text x="180" y="257.7" font-size="10.5" text-anchor="middle" fill="#444" font-weight="normal">but with a FILE pointer.</text></svg>