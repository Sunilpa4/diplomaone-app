<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 294" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="294" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Flow of Control in a Function Call</text><rect x="8" y="44" width="166" height="128" rx="8" fill="#F7F2FD" stroke="#C9B3EC" stroke-width="1.2"/><text x="91" y="61.5" font-size="10" text-anchor="middle" fill="#666" font-weight="bold">calling function</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="16.0" y="81.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">int main(void)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="16.0" y="99.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">{</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="41.28" y="117.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">int s;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="41.28" y="135.7" font-size="10.5" text-anchor="start" fill="#8D6E00" font-weight="bold">s = sum(10, 20);</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="41.28" y="153.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">printf("%d", s);</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="16.0" y="171.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">}</text><rect x="190" y="86" width="162" height="110" rx="8" fill="#F7F2FD" stroke="#C9B3EC" stroke-width="1.2"/><text x="271" y="103.5" font-size="10" text-anchor="middle" fill="#666" font-weight="bold">called function</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="196.0" y="123.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">int sum(int a, int b)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="196.0" y="141.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">{</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="221.28" y="159.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">int c = a + b;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="221.28" y="177.7" font-size="10.5" text-anchor="start" fill="#2E7D32" font-weight="bold">return c;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="196.0" y="195.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">}</text><path d="M146 127 L180 127 L180 116 L193 116" fill="none" stroke="#C62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="193.0,116.0 186.0,112.5 186.0,119.5" fill="#C62828"/><path d="M193 172 L186 172 L186 139 L148 139" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="148.0,139.0 155.0,142.5 155.0,135.5" fill="#2E7D32"/><text x="164" y="116.8" font-size="11" text-anchor="middle" fill="#C62828" font-weight="bold">①</text><text x="166" y="164.8" font-size="11" text-anchor="middle" fill="#2E7D32" font-weight="bold">④</text><text x="16" y="225.8" font-size="11" text-anchor="start" fill="#C62828" font-weight="bold">①</text><text x="34" y="225.7" font-size="10.5" text-anchor="start" fill="#333" font-weight="normal">main() calls sum(10, 20); control jumps to sum</text><text x="16" y="243.8" font-size="11" text-anchor="start" fill="#222" font-weight="bold">②</text><text x="34" y="243.7" font-size="10.5" text-anchor="start" fill="#333" font-weight="normal">values 10, 20 are copied into a, b</text><text x="16" y="261.9" font-size="11" text-anchor="start" fill="#222" font-weight="bold">③</text><text x="34" y="261.7" font-size="10.5" text-anchor="start" fill="#333" font-weight="normal">body of sum executes: c = 30</text><text x="16" y="279.9" font-size="11" text-anchor="start" fill="#2E7D32" font-weight="bold">④</text><text x="34" y="279.7" font-size="10.5" text-anchor="start" fill="#333" font-weight="normal">return c sends 30 back; s = 30; main continues</text></svg>