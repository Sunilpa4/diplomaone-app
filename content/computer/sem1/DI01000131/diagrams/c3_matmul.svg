<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 310" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="310" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Matrix Multiplication (Row × Column)</text><rect x="22" y="52" width="34" height="34" fill="#FFF1C2" stroke="#C99A00" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="39.0" y="73.4" font-size="12.5" text-anchor="middle" fill="#222" font-weight="bold">1</text><rect x="56" y="52" width="34" height="34" fill="#FFF1C2" stroke="#C99A00" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="73.0" y="73.4" font-size="12.5" text-anchor="middle" fill="#222" font-weight="bold">2</text><rect x="22" y="86" width="34" height="34" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="39.0" y="107.4" font-size="12.5" text-anchor="middle" fill="#222" font-weight="bold">3</text><rect x="56" y="86" width="34" height="34" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="73.0" y="107.4" font-size="12.5" text-anchor="middle" fill="#222" font-weight="bold">4</text><text x="110" y="92.3" font-size="18" text-anchor="middle" fill="#222" font-weight="bold">×</text><rect x="128" y="52" width="34" height="34" fill="#FFF1C2" stroke="#C99A00" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="145.0" y="73.4" font-size="12.5" text-anchor="middle" fill="#222" font-weight="bold">5</text><rect x="162" y="52" width="34" height="34" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="179.0" y="73.4" font-size="12.5" text-anchor="middle" fill="#222" font-weight="bold">6</text><rect x="128" y="86" width="34" height="34" fill="#FFF1C2" stroke="#C99A00" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="145.0" y="107.4" font-size="12.5" text-anchor="middle" fill="#222" font-weight="bold">7</text><rect x="162" y="86" width="34" height="34" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="179.0" y="107.4" font-size="12.5" text-anchor="middle" fill="#222" font-weight="bold">8</text><text x="216" y="92.3" font-size="18" text-anchor="middle" fill="#222" font-weight="bold">=</text><rect x="234" y="52" width="34" height="34" fill="#FFF1C2" stroke="#C99A00" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="251.0" y="73.4" font-size="12.5" text-anchor="middle" fill="#222" font-weight="bold">19</text><rect x="268" y="52" width="34" height="34" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="285.0" y="73.4" font-size="12.5" text-anchor="middle" fill="#222" font-weight="bold">22</text><rect x="234" y="86" width="34" height="34" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="251.0" y="107.4" font-size="12.5" text-anchor="middle" fill="#222" font-weight="bold">43</text><rect x="268" y="86" width="34" height="34" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="285.0" y="107.4" font-size="12.5" text-anchor="middle" fill="#222" font-weight="bold">50</text><text x="56" y="139.7" font-size="10.5" text-anchor="middle" fill="#333" font-weight="bold">A (2×2)</text><text x="162" y="139.7" font-size="10.5" text-anchor="middle" fill="#333" font-weight="bold">B (2×2)</text><text x="268" y="139.7" font-size="10.5" text-anchor="middle" fill="#333" font-weight="bold">C (2×2)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="165.8" font-size="11" text-anchor="middle" fill="#8D6E00" font-weight="bold">C[0][0] = 1×5 + 2×7 = 19</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="183.8" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">C[0][1] = 1×6 + 2×8 = 22</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="201.8" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">C[1][0] = 3×5 + 4×7 = 43</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="219.8" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">C[1][1] = 3×6 + 4×8 = 50</text><text x="180" y="247.8" font-size="11" text-anchor="middle" fill="#7B2CD9" font-weight="bold">C[i][j] = Σ A[i][k] × B[k][j]   (k = 0 … n−1)</text><text x="180" y="267.7" font-size="10.5" text-anchor="middle" fill="#444" font-weight="normal">Condition: columns of A = rows of B</text><text x="180" y="283.7" font-size="10.5" text-anchor="middle" fill="#444" font-weight="normal">Order: (m × n) × (n × p) → (m × p)</text><text x="180" y="299.7" font-size="10.5" text-anchor="middle" fill="#444" font-weight="normal">Needs 3 nested loops (i, j, k)</text></svg>