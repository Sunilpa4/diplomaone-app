<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="300" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Reading a String: Different Methods</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="46.0" font-size="11.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">User types:  Ravi Patel ⏎</text><rect x="10" y="62" width="340" height="46" rx="6" fill="#FAF7FE" stroke="#E0D3F2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="18" y="82.7" font-size="10.5" text-anchor="start" fill="#7B2CD9" font-weight="bold">scanf("%s", s);</text><text x="18" y="100.5" font-size="10" text-anchor="start" fill="#555" font-weight="normal">stops at first space</text><rect x="202.0" y="72.0" width="140" height="26" rx="7" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1.6"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="272" y="88.8" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">"Ravi"</text><rect x="10" y="116" width="340" height="46" rx="6" fill="#FAF7FE" stroke="#E0D3F2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="18" y="136.7" font-size="10.5" text-anchor="start" fill="#7B2CD9" font-weight="bold">scanf("%[^\n]", s);</text><text x="18" y="154.5" font-size="10" text-anchor="start" fill="#555" font-weight="normal">reads till newline</text><rect x="202.0" y="126.0" width="140" height="26" rx="7" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1.6"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="272" y="142.8" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">"Ravi Patel"</text><rect x="10" y="170" width="340" height="46" rx="6" fill="#FAF7FE" stroke="#E0D3F2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="18" y="190.7" font-size="10.5" text-anchor="start" fill="#C62828" font-weight="bold">gets(s);</text><text x="18" y="208.5" font-size="10" text-anchor="start" fill="#C62828" font-weight="normal">unsafe – removed in C11</text><rect x="202.0" y="180.0" width="140" height="26" rx="7" fill="#FDECEC" stroke="#C62828" stroke-width="1.6"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="272" y="196.8" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">"Ravi Patel"</text><rect x="10" y="224" width="340" height="46" rx="6" fill="#FAF7FE" stroke="#E0D3F2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="18" y="244.7" font-size="10.5" text-anchor="start" fill="#2E7D32" font-weight="bold">fgets(s, 20, stdin);</text><text x="18" y="262.5" font-size="10" text-anchor="start" fill="#2E7D32" font-weight="normal">safe; keeps the newline</text><rect x="202.0" y="234.0" width="140" height="26" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.6"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="272" y="250.8" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">"Ravi Patel\n"</text><text x="180" y="289.7" font-size="10.5" text-anchor="middle" fill="#333" font-weight="bold">Use fgets() for safe input of a full line.</text></svg>