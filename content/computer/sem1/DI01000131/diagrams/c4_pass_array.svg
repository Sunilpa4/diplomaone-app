<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 307" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="307" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Passing an Array to a Function</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="43.7" font-size="10.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">float avg(int x[], int n);   avg(a, 5);</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="69.7" font-size="10.5" text-anchor="start" fill="#555" font-weight="bold">main():</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="85.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">int a[5]</text><rect x="90" y="64" width="50" height="34" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="115.0" y="85.2" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">10</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="115.0" y="113.5" font-size="10" text-anchor="middle" fill="#444" font-weight="normal">a[0]</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="115.0" y="127.5" font-size="10" text-anchor="middle" fill="#1565C0" font-weight="normal">1000</text><rect x="140" y="64" width="50" height="34" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="165.0" y="85.2" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">20</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="165.0" y="113.5" font-size="10" text-anchor="middle" fill="#444" font-weight="normal">a[1]</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="165.0" y="127.5" font-size="10" text-anchor="middle" fill="#1565C0" font-weight="normal">1004</text><rect x="190" y="64" width="50" height="34" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="215.0" y="85.2" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">30</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="215.0" y="113.5" font-size="10" text-anchor="middle" fill="#444" font-weight="normal">a[2]</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="215.0" y="127.5" font-size="10" text-anchor="middle" fill="#1565C0" font-weight="normal">1008</text><rect x="240" y="64" width="50" height="34" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="265.0" y="85.2" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">40</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="265.0" y="113.5" font-size="10" text-anchor="middle" fill="#444" font-weight="normal">a[3]</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="265.0" y="127.5" font-size="10" text-anchor="middle" fill="#1565C0" font-weight="normal">1012</text><rect x="290" y="64" width="50" height="34" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="315.0" y="85.2" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">50</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="315.0" y="113.5" font-size="10" text-anchor="middle" fill="#444" font-weight="normal">a[4]</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="315.0" y="127.5" font-size="10" text-anchor="middle" fill="#1565C0" font-weight="normal">1016</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="175.7" font-size="10.5" text-anchor="start" fill="#555" font-weight="bold">avg():</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="115" y="161.8" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">x</text><rect x="90" y="164" width="50" height="30" fill="#FFF1C2" stroke="#C99A00" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="115.0" y="183.2" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">1000</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="185" y="161.8" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">n</text><rect x="160" y="164" width="50" height="30" fill="#FFF1C2" stroke="#C99A00" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="185.0" y="183.2" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">5</text><path d="M90 179 L78 179 L78 81 L88 81" fill="none" stroke="#C62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="88.0,81.0 81.0,77.5 81.0,84.5" fill="#C62828"/><text x="230" y="178.7" font-size="10.5" text-anchor="start" fill="#333" font-weight="normal">x holds the</text><text x="230" y="193.7" font-size="10.5" text-anchor="start" fill="#333" font-weight="normal">base address</text><text x="22" y="225.7" font-size="10.5" text-anchor="start" fill="#333" font-weight="normal">• Only the array name is passed (no [ ] in call)</text><text x="22" y="242.7" font-size="10.5" text-anchor="start" fill="#333" font-weight="normal">• Base address is passed → call by reference</text><text x="22" y="259.7" font-size="10.5" text-anchor="start" fill="#333" font-weight="normal">• Changes made in the function affect the original</text><text x="22" y="276.7" font-size="10.5" text-anchor="start" fill="#333" font-weight="normal">• Size must be passed separately (n)</text><text x="22" y="293.7" font-size="10.5" text-anchor="start" fill="#333" font-weight="normal">• 2-D: column size is compulsory: int m[][3]</text></svg>