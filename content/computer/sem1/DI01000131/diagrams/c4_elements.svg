<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 313" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="313" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Elements of a User-defined Function</text><rect x="10" y="34" width="340" height="267" rx="8" fill="#F7F2FD" stroke="#C9B3EC" stroke-width="1.2"/><rect x="16" y="60" width="176" height="17" fill="#E3F0FC"/><rect x="16" y="145" width="176" height="17" fill="#FFF1C2"/><rect x="16" y="230" width="176" height="17" fill="#E3F5E6"/><rect x="16" y="247" width="176" height="17" fill="#E3F5E6"/><rect x="16" y="264" width="176" height="17" fill="#E3F5E6"/><rect x="16" y="281" width="176" height="17" fill="#E3F5E6"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22.0" y="55.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">#include &lt;stdio.h&gt;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22.0" y="72.7" font-size="10.5" text-anchor="start" fill="#1565C0" font-weight="bold">int sum(int, int);</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22.0" y="89.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal"></text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22.0" y="106.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">int main(void)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22.0" y="123.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">{</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="47.28" y="140.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">int s;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="47.28" y="157.7" font-size="10.5" text-anchor="start" fill="#8D6E00" font-weight="bold">s = sum(10, 20);</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="47.28" y="174.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">printf("%d", s);</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="47.28" y="191.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">return 0;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22.0" y="208.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">}</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22.0" y="225.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal"></text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22.0" y="242.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">int sum(int a, int b)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22.0" y="259.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">{</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="47.28" y="276.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">return a + b;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22.0" y="293.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">}</text><path d="M214 69 L196 69" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="196.0,69.0 203.0,72.5 203.0,65.5" fill="#1565C0"/><text x="220" y="69.7" font-size="10.5" text-anchor="start" fill="#1565C0" font-weight="bold">1. Function declaration</text><text x="220" y="83.5" font-size="10" text-anchor="start" fill="#444" font-weight="normal">(prototype)</text><path d="M214 154 L196 154" fill="none" stroke="#8D6E00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="196.0,154.0 203.0,157.5 203.0,150.5" fill="#8D6E00"/><text x="220" y="154.7" font-size="10.5" text-anchor="start" fill="#8D6E00" font-weight="bold">2. Function call</text><text x="220" y="168.5" font-size="10" text-anchor="start" fill="#444" font-weight="normal">(actual arguments)</text><path d="M214 239 L196 239" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="196.0,239.0 203.0,242.5 203.0,235.5" fill="#2E7D32"/><text x="220" y="239.7" font-size="10.5" text-anchor="start" fill="#2E7D32" font-weight="bold">3. Function definition</text><text x="220" y="253.5" font-size="10" text-anchor="start" fill="#444" font-weight="normal">header (parameters)</text><path d="M200 248 H206 V296 H200" fill="none" stroke="#2E7D32" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="212" y="279.5" font-size="10" text-anchor="start" fill="#444" font-weight="normal">function body</text></svg>