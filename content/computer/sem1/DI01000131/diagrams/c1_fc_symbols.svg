<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 402" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="402" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Flowchart Symbols</text><rect x="10" y="32" width="340" height="24" fill="#7B2CD9"/><text x="60" y="48.0" font-size="11.5" text-anchor="middle" fill="#fff" font-weight="bold">Symbol</text><text x="160" y="48.0" font-size="11.5" text-anchor="middle" fill="#fff" font-weight="bold">Name</text><text x="272" y="48.0" font-size="11.5" text-anchor="middle" fill="#fff" font-weight="bold">Use</text><rect x="18.0" y="67.0" width="84" height="26" rx="13.0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.8"/><text x="60" y="83.7" font-size="10.5" text-anchor="middle" fill="#1B5E20" font-weight="bold">Start/Stop</text><text x="160" y="84.0" font-size="11.5" text-anchor="middle" fill="#333" font-weight="bold">Terminal</text><text x="272" y="77.4" font-size="10.5" text-anchor="middle" fill="#444" font-weight="normal">Start or end of</text><text x="272" y="89.9" font-size="10.5" text-anchor="middle" fill="#444" font-weight="normal">the program</text><rect x="10" y="104" width="340" height="48" fill="#FAF7FE"/><polygon points="28.0,115.0 107.0,115.0 92.0,141.0 13.0,141.0" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.8"/><text x="60" y="131.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="normal">Read / Print</text><text x="160" y="132.0" font-size="11.5" text-anchor="middle" fill="#333" font-weight="bold">Input / Output</text><text x="272" y="125.4" font-size="10.5" text-anchor="middle" fill="#444" font-weight="normal">Read input or</text><text x="272" y="137.9" font-size="10.5" text-anchor="middle" fill="#444" font-weight="normal">display output</text><rect x="18.0" y="163.0" width="84" height="26" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.8"/><text x="60" y="179.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="normal">x = a + b</text><text x="160" y="180.0" font-size="11.5" text-anchor="middle" fill="#333" font-weight="bold">Process</text><text x="272" y="173.4" font-size="10.5" text-anchor="middle" fill="#444" font-weight="normal">Calculation /</text><text x="272" y="185.9" font-size="10.5" text-anchor="middle" fill="#444" font-weight="normal">assignment</text><rect x="10" y="200" width="340" height="48" fill="#FAF7FE"/><polygon points="60,206.0 102.0,224 60,242.0 18.0,224" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.8"/><text x="60" y="227.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="normal">a &gt; b ?</text><text x="160" y="228.0" font-size="11.5" text-anchor="middle" fill="#333" font-weight="bold">Decision</text><text x="272" y="221.4" font-size="10.5" text-anchor="middle" fill="#444" font-weight="normal">Condition check,</text><text x="272" y="233.9" font-size="10.5" text-anchor="middle" fill="#444" font-weight="normal">Yes / No branches</text><path d="M28 272 L92 272" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="92.0,272.0 85.0,268.5 85.0,275.5" fill="#222"/><text x="160" y="276.0" font-size="11.5" text-anchor="middle" fill="#333" font-weight="bold">Flow lines</text><text x="272" y="269.4" font-size="10.5" text-anchor="middle" fill="#444" font-weight="normal">Show direction</text><text x="272" y="281.9" font-size="10.5" text-anchor="middle" fill="#444" font-weight="normal">of flow</text><rect x="10" y="296" width="340" height="48" fill="#FAF7FE"/><circle cx="48" cy="320" r="13" fill="#FCE4EC" stroke="#C2185B" stroke-width="1.8"/><text x="48" y="323.9" font-size="11" text-anchor="middle" fill="#C2185B" font-weight="bold">A</text><circle cx="78" cy="320" r="13" fill="#FCE4EC" stroke="#C2185B" stroke-width="1.8"/><text x="78" y="323.9" font-size="11" text-anchor="middle" fill="#C2185B" font-weight="bold">A</text><text x="160" y="324.0" font-size="11.5" text-anchor="middle" fill="#333" font-weight="bold">Connector</text><text x="272" y="317.4" font-size="10.5" text-anchor="middle" fill="#444" font-weight="normal">Join parts of a</text><text x="272" y="329.9" font-size="10.5" text-anchor="middle" fill="#444" font-weight="normal">long flowchart</text><rect x="18.0" y="355.0" width="84" height="26" fill="#FFF8E1" stroke="#8D6E00" stroke-width="1.8"/><path d="M27.0 355.0 V381.0" fill="none" stroke="#8D6E00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M93.0 355.0 V381.0" fill="none" stroke="#8D6E00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="371.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="normal">fact( )</text><text x="160" y="365.3" font-size="11.5" text-anchor="middle" fill="#333" font-weight="bold">Predefined</text><text x="160" y="378.8" font-size="11.5" text-anchor="middle" fill="#333" font-weight="bold">process</text><text x="272" y="365.4" font-size="10.5" text-anchor="middle" fill="#444" font-weight="normal">Function / sub-</text><text x="272" y="377.9" font-size="10.5" text-anchor="middle" fill="#444" font-weight="normal">routine call</text><path d="M10 392 H350" fill="none" stroke="#E0D3F2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></svg>