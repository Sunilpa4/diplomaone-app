<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 350" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="350" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Scope and Lifetime of Variables</text><rect x="10" y="32" width="340" height="306" rx="10" fill="#FAF7FE" stroke="#7B2CD9" stroke-width="1.6"/><text x="20" y="53.7" font-size="10.5" text-anchor="start" fill="#7B2CD9" font-weight="bold">Program file</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="73.8" font-size="11" text-anchor="start" fill="#C62828" font-weight="bold">int g = 10;</text><text x="110" y="73.5" font-size="10" text-anchor="start" fill="#444" font-weight="normal">global: visible in all functions</text><rect x="22" y="84" width="316" height="132" rx="8" fill="#EEF5FD" stroke="#1565C0" stroke-width="1.4"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="32" y="103.7" font-size="10.5" text-anchor="start" fill="#1565C0" font-weight="bold">int main(void) {</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="46" y="123.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">int a = 5;</text><text x="126" y="123.5" font-size="10" text-anchor="start" fill="#444" font-weight="normal">local to main()</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="46" y="141.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">static int c;</text><text x="148" y="141.5" font-size="10" text-anchor="start" fill="#444" font-weight="normal">local, but keeps value</text><rect x="40" y="148" width="284" height="44" rx="6" fill="#E9F6EA" stroke="#2E7D32" stroke-width="1.3"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="50" y="167.7" font-size="10.5" text-anchor="start" fill="#2E7D32" font-weight="bold">{</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="62" y="183.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">int b = 2;</text><text x="142" y="183.5" font-size="10" text-anchor="start" fill="#444" font-weight="normal">block scope: only inside { }</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="32" y="210.7" font-size="10.5" text-anchor="start" fill="#1565C0" font-weight="bold">}</text><rect x="22" y="226" width="316" height="62" rx="8" fill="#FFF8E1" stroke="#C99A00" stroke-width="1.4"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="32" y="245.7" font-size="10.5" text-anchor="start" fill="#8D6E00" font-weight="bold">void fun(void) {</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="46" y="265.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">int a = 7;</text><text x="126" y="265.5" font-size="10" text-anchor="start" fill="#444" font-weight="normal">different a (local to fun)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="46" y="282.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">g++;</text><text x="126" y="282.5" font-size="10" text-anchor="start" fill="#444" font-weight="normal">global g is accessible here</text><text x="180" y="311.7" font-size="10.5" text-anchor="middle" fill="#333" font-weight="bold">Scope = where a variable is visible</text><text x="180" y="328.7" font-size="10.5" text-anchor="middle" fill="#333" font-weight="bold">Lifetime = how long it exists in memory</text></svg>