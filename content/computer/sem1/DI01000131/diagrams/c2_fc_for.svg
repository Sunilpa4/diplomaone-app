<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 338" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="338" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Flowchart of for Loop</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="44.0" font-size="11.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">for (i = 1; i &lt;= n; i++)</text><rect x="65.0" y="60.0" width="170" height="32" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.8"/><text x="150" y="80.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">1. Initialization (i = 1)</text><path d="M150 92 L150 118" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="150.0,118.0 153.5,111.0 146.5,111.0" fill="#222"/><polygon points="150,119.0 206.0,148 150,177.0 94.0,148" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.8"/><text x="150" y="145.3" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">2. Test</text><text x="150" y="158.3" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">i &lt;= n ?</text><path d="M150 177 L150 200" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="150.0,200.0 153.5,193.0 146.5,193.0" fill="#222"/><text x="170" y="192.7" font-size="10.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">True</text><rect x="75.0" y="201.0" width="150" height="32" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.8"/><text x="150" y="221.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">3. Body of loop</text><path d="M150 233 L150 252" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="150.0,252.0 153.5,245.0 146.5,245.0" fill="#222"/><rect x="75.0" y="253.0" width="150" height="32" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.8"/><text x="150" y="273.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">4. Update (i++)</text><path d="M150 285 L150 300 L40 300 L40 106 L146 106" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="146.0,106.0 139.0,102.5 139.0,109.5" fill="#222"/><text transform="rotate(-90 30 210)" x="30" y="213.7" font-size="10.5" text-anchor="middle" fill="#666" font-weight="bold">Loop</text><path d="M206 148 L290 148 L290 186" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="290.0,186.0 293.5,179.0 286.5,179.0" fill="#222"/><text x="250" y="142.7" font-size="10.5" text-anchor="middle" fill="#C62828" font-weight="bold">False</text><rect x="240.0" y="187.0" width="100" height="40" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.8"/><text x="290" y="211.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">Exit loop</text><text x="180" y="327.7" font-size="10.5" text-anchor="middle" fill="#444" font-weight="normal">Initialization runs once; then test → body → update repeats.</text></svg>