ight="bold">D_Z</text><line x1="160" y1="62" x2="182" y2="62" stroke="#2E7D32" stroke-width="1.6"/><polygon points="182.0,62.0 175.0,58.5 175.0,65.5" fill="#2E7D32"/><text x="171" y="79.8" font-size="11" text-anchor="middle" fill="#2E7D32" font-weight="bold">I</text><line x1="205" y1="82" x2="205" y2="104" stroke="#2E7D32" stroke-width="1.6"/><polygon points="205.0,104.0 208.5,97.0 201.5,97.0" fill="#2E7D32"/><text x="212" y="97.8" font-size="11" text-anchor="start" fill="#2E7D32" font-weight="bold">I_Z</text><line x1="280" y1="70" x2="280" y2="92" stroke="#2E7D32" stroke-width="1.6"/><polygon points="280.0,92.0 283.5,85.0 276.5,85.0" fill="#2E7D32"/><text x="287" y="83.8" font-size="11" text-anchor="start" fill="#2E7D32" font-weight="bold">I_L</text><text x="85" y="117.3" font-size="11" text-anchor="middle" fill="#444" font-weight="normal">V_in</text><text x="85" y="130.3" font-size="11" text-anchor="middle" fill="#444" font-weight="normal">(unregulated)</text><text x="30" y="38.5" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">+</text><text x="30" y="212.9" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">−</text><text x="330" y="38.5" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">+</text><text x="330" y="212.9" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">−</text><text x="338" y="117.3" font-size="11" text-anchor="end" fill="#7B2CD9" font-weight="bold">V_out</text><text x="338" y="130.3" font-size="11" text-anchor="end" fill="#7B2CD9" font-weight="bold">= V_Z</text><rect x="10" y="222" width="340" height="30" rx="8" fill="#F7F2FD" stroke="#E0D2F3"/><text x="180" y="241.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">I = I_Z + I_L ,   I = (V_in − V_Z) / R_S</text></svg>