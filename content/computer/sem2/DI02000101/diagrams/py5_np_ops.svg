<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 304" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="304" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Element-wise vs dot vs cross vs matmul</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="47.7" font-size="10.5" text-anchor="start" fill="#7B2CD9" font-weight="bold">u = [1, 2, 3]    v = [4, 5, 6]</text><rect x="8" y="54" width="344" height="20" fill="#F6F0FE"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="67.5" font-size="10" text-anchor="start" fill="#306998" font-weight="bold">u * v</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="112" y="67.3" font-size="9.4" text-anchor="start" fill="#2E7D32" font-weight="normal">[1×4, 2×5, 3×6] = [4 10 18]</text><text x="348" y="67.2" font-size="9" text-anchor="end" fill="#666" font-weight="normal">element-wise</text><rect x="8" y="74" width="344" height="20" fill="#fff"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="87.5" font-size="10" text-anchor="start" fill="#306998" font-weight="bold">np.dot(u, v)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="112" y="87.3" font-size="9.4" text-anchor="start" fill="#2E7D32" font-weight="normal">1×4 + 2×5 + 3×6 = 32</text><text x="348" y="87.2" font-size="9" text-anchor="end" fill="#666" font-weight="normal">scalar</text><rect x="8" y="94" width="344" height="20" fill="#F6F0FE"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="107.5" font-size="10" text-anchor="start" fill="#306998" font-weight="bold">np.cross(u, v)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="112" y="107.3" font-size="9.4" text-anchor="start" fill="#2E7D32" font-weight="normal">[2×6−3×5, 3×4−1×6, 1×5−2×4]</text><text x="348" y="107.2" font-size="9" text-anchor="end" fill="#666" font-weight="normal"></text><rect x="8" y="114" width="344" height="20" fill="#F6F0FE"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="127.5" font-size="10" text-anchor="start" fill="#306998" font-weight="bold"></text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="112" y="127.3" font-size="9.4" text-anchor="start" fill="#2E7D32" font-weight="normal">= [-3 6 -3]</text><text x="348" y="127.2" font-size="9" text-anchor="end" fill="#666" font-weight="normal">⊥ vector</text><text x="180" y="151.8" font-size="11" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Matrix multiplication: np.matmul(A, B) = A @ B</text><rect x="14" y="170" width="30" height="26" rx="0" fill="#FFF6D6" stroke="#B88A00" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="29.0" y="186.8" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">1</text><rect x="44" y="170" width="30" height="26" rx="0" fill="#FFF6D6" stroke="#B88A00" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="59.0" y="186.8" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">2</text><rect x="14" y="196" width="30" height="26" rx="0" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="29.0" y="212.8" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">3</text><rect x="44" y="196" width="30" height="26" rx="0" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="59.0" y="212.8" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">4</text><text x="44" y="239.8" font-size="11" text-anchor="middle" fill="#1565C0" font-weight="bold">A</text><text x="84" y="200.6" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">@</text><rect x="98" y="170" width="30" height="26" rx="0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="113.0" y="186.8" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">5</text><rect x="128" y="170" width="30" height="26" rx="0" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="143.0" y="186.8" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">6</text><rect x="98" y="196" width="30" height="26" rx="0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="113.0" y="212.8" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">7</text><rect x="128" y="196" width="30" height="26" rx="0" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="143.0" y="212.8" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">8</text><text x="128" y="239.8" font-size="11" text-anchor="middle" fill="#1565C0" font-weight="bold">B</text><text x="170" y="200.6" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">=</text><rect x="184" y="170" width="34" height="26" rx="0" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="201.0" y="186.8" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">19</text><rect x="218" y="170" width="34" height="26" rx="0" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="235.0" y="186.8" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">22</text><rect x="184" y="196" width="34" height="26" rx="0" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="201.0" y="212.8" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">43</text><rect x="218" y="196" width="34" height="26" rx="0" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="235.0" y="212.8" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">50</text><text x="286" y="185.2" font-size="9" text-anchor="middle" fill="#E07B00" font-weight="bold">row 0 · col 0</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="286" y="199.2" font-size="9" text-anchor="middle" fill="#E07B00" font-weight="normal">1×5 + 2×7</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="286" y="213.2" font-size="9" text-anchor="middle" fill="#E07B00" font-weight="bold">= 19</text><text x="180" y="259.4" font-size="9.6" text-anchor="middle" fill="#C62828" font-weight="bold">A * B = [[5 12] [21 32]]  (element-wise, NOT matrix)</text><text x="180" y="275.4" font-size="9.6" text-anchor="middle" fill="#444" font-weight="normal">(m × n) @ (n × p) → (m × p); inner sizes must match</text><text x="180" y="291.4" font-size="9.6" text-anchor="middle" fill="#444" font-weight="normal">For 2-D arrays np.dot(A, B) = np.matmul(A, B)</text></svg>