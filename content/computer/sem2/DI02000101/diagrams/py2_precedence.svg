<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 436" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="436" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Operator Precedence (High → Low)</text><rect x="10" y="32" width="340" height="20" fill="#F3ECFD"/><text x="22" y="45.5" font-size="10" text-anchor="start" fill="#7B2CD9" font-weight="bold">1</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="44" y="45.6" font-size="10.2" text-anchor="start" fill="#222" font-weight="bold">( )</text><text x="212" y="45.4" font-size="9.8" text-anchor="start" fill="#444" font-weight="normal">Parentheses</text><rect x="10" y="52" width="340" height="20" fill="#fff"/><text x="22" y="65.5" font-size="10" text-anchor="start" fill="#7B2CD9" font-weight="bold">2</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="44" y="65.6" font-size="10.2" text-anchor="start" fill="#222" font-weight="bold">**</text><text x="212" y="65.4" font-size="9.8" text-anchor="start" fill="#444" font-weight="normal">Exponent (right to left)</text><rect x="10" y="72" width="340" height="20" fill="#F3ECFD"/><text x="22" y="85.5" font-size="10" text-anchor="start" fill="#7B2CD9" font-weight="bold">3</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="44" y="85.6" font-size="10.2" text-anchor="start" fill="#222" font-weight="bold">+x  -x  ~x</text><text x="212" y="85.4" font-size="9.8" text-anchor="start" fill="#444" font-weight="normal">Unary plus, minus, NOT</text><rect x="10" y="92" width="340" height="20" fill="#fff"/><text x="22" y="105.5" font-size="10" text-anchor="start" fill="#7B2CD9" font-weight="bold">4</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="44" y="105.6" font-size="10.2" text-anchor="start" fill="#222" font-weight="bold">*  /  //  %</text><text x="212" y="105.4" font-size="9.8" text-anchor="start" fill="#444" font-weight="normal">Multiplication, division</text><rect x="10" y="112" width="340" height="20" fill="#F3ECFD"/><text x="22" y="125.5" font-size="10" text-anchor="start" fill="#7B2CD9" font-weight="bold">5</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="44" y="125.6" font-size="10.2" text-anchor="start" fill="#222" font-weight="bold">+  -</text><text x="212" y="125.4" font-size="9.8" text-anchor="start" fill="#444" font-weight="normal">Addition, subtraction</text><rect x="10" y="132" width="340" height="20" fill="#fff"/><text x="22" y="145.5" font-size="10" text-anchor="start" fill="#7B2CD9" font-weight="bold">6</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="44" y="145.6" font-size="10.2" text-anchor="start" fill="#222" font-weight="bold">&lt;&lt;  &gt;&gt;</text><text x="212" y="145.4" font-size="9.8" text-anchor="start" fill="#444" font-weight="normal">Bitwise shifts</text><rect x="10" y="152" width="340" height="20" fill="#F3ECFD"/><text x="22" y="165.5" font-size="10" text-anchor="start" fill="#7B2CD9" font-weight="bold">7</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="44" y="165.6" font-size="10.2" text-anchor="start" fill="#222" font-weight="bold">&amp;</text><text x="212" y="165.4" font-size="9.8" text-anchor="start" fill="#444" font-weight="normal">Bitwise AND</text><rect x="10" y="172" width="340" height="20" fill="#fff"/><text x="22" y="185.5" font-size="10" text-anchor="start" fill="#7B2CD9" font-weight="bold">8</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="44" y="185.6" font-size="10.2" text-anchor="start" fill="#222" font-weight="bold">^</text><text x="212" y="185.4" font-size="9.8" text-anchor="start" fill="#444" font-weight="normal">Bitwise XOR</text><rect x="10" y="192" width="340" height="20" fill="#F3ECFD"/><text x="22" y="205.5" font-size="10" text-anchor="start" fill="#7B2CD9" font-weight="bold">9</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="44" y="205.6" font-size="10.2" text-anchor="start" fill="#222" font-weight="bold">|</text><text x="212" y="205.4" font-size="9.8" text-anchor="start" fill="#444" font-weight="normal">Bitwise OR</text><rect x="10" y="212" width="340" height="34" fill="#fff"/><text x="22" y="232.5" font-size="10" text-anchor="start" fill="#7B2CD9" font-weight="bold">10</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="44" y="226.5" font-size="10.2" text-anchor="start" fill="#222" font-weight="bold">==  !=  &gt;  &lt;  &gt;=  &lt;=</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="44" y="238.7" font-size="10.2" text-anchor="start" fill="#222" font-weight="bold">is  is not  in  not in</text><text x="212" y="226.5" font-size="9.8" text-anchor="start" fill="#444" font-weight="normal">Comparison, identity,</text><text x="212" y="238.3" font-size="9.8" text-anchor="start" fill="#444" font-weight="normal">membership</text><rect x="10" y="246" width="340" height="20" fill="#F3ECFD"/><text x="22" y="259.5" font-size="10" text-anchor="start" fill="#7B2CD9" font-weight="bold">11</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="44" y="259.6" font-size="10.2" text-anchor="start" fill="#222" font-weight="bold">not</text><text x="212" y="259.4" font-size="9.8" text-anchor="start" fill="#444" font-weight="normal">Logical NOT</text><rect x="10" y="266" width="340" height="20" fill="#fff"/><text x="22" y="279.5" font-size="10" text-anchor="start" fill="#7B2CD9" font-weight="bold">12</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="44" y="279.6" font-size="10.2" text-anchor="start" fill="#222" font-weight="bold">and</text><text x="212" y="279.4" font-size="9.8" text-anchor="start" fill="#444" font-weight="normal">Logical AND</text><rect x="10" y="286" width="340" height="20" fill="#F3ECFD"/><text x="22" y="299.5" font-size="10" text-anchor="start" fill="#7B2CD9" font-weight="bold">13</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="44" y="299.6" font-size="10.2" text-anchor="start" fill="#222" font-weight="bold">or</text><text x="212" y="299.4" font-size="9.8" text-anchor="start" fill="#444" font-weight="normal">Logical OR</text><rect x="10" y="306" width="340" height="20" fill="#fff"/><text x="22" y="319.5" font-size="10" text-anchor="start" fill="#7B2CD9" font-weight="bold">14</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="44" y="319.6" font-size="10.2" text-anchor="start" fill="#222" font-weight="bold">=  +=  -=  …</text><text x="212" y="319.4" font-size="9.8" text-anchor="start" fill="#444" font-weight="normal">Assignment (lowest)</text><rect x="10" y="32" width="340" height="294" fill="none" stroke="#D9C8F0"/><text x="180" y="345.7" font-size="10.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Examples</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="30" y="363.5" font-size="10" text-anchor="start" fill="#1565C0" font-weight="bold">2 + 3 * 4</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="363.5" font-size="10" text-anchor="start" fill="#2E7D32" font-weight="normal">→ 14</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="30" y="379.5" font-size="10" text-anchor="start" fill="#1565C0" font-weight="bold">(2 + 3) * 4</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="379.5" font-size="10" text-anchor="start" fill="#2E7D32" font-weight="normal">→ 20</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="30" y="395.5" font-size="10" text-anchor="start" fill="#1565C0" font-weight="bold">2 ** 3 ** 2</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="395.5" font-size="10" text-anchor="start" fill="#2E7D32" font-weight="normal">→ 512   (3**2 first)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="30" y="411.5" font-size="10" text-anchor="start" fill="#1565C0" font-weight="bold">10 - 4 - 3</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="411.5" font-size="10" text-anchor="start" fill="#2E7D32" font-weight="normal">→ 3     (left to right)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="30" y="427.5" font-size="10" text-anchor="start" fill="#1565C0" font-weight="bold">not 5 &gt; 3 or 2 &gt; 1</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="427.5" font-size="10" text-anchor="start" fill="#2E7D32" font-weight="normal">→ True</text></svg>