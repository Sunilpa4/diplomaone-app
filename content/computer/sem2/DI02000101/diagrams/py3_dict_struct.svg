<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 341" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="341" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Dictionary: Keys Map to Values</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="43.6" font-size="10.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">d = {"roll": 101, "name": "Amit", "sem": 2}</text><text x="86" y="65.5" font-size="10" text-anchor="middle" fill="#1565C0" font-weight="bold">Keys (unique, immutable)</text><text x="270" y="65.5" font-size="10" text-anchor="middle" fill="#2E7D32" font-weight="bold">Values (any type)</text><rect x="30" y="76" width="100" height="30" rx="15" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="80" y="95.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="bold">"roll"</text><rect x="220" y="76" width="100" height="30" rx="6" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="270" y="95.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="bold">101</text><path d="M130 91 L218 91" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="218.0,91.0 211.0,87.5 211.0,94.5" fill="#7B2CD9"/><rect x="30" y="120" width="100" height="30" rx="15" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="80" y="139.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="bold">"name"</text><rect x="220" y="120" width="100" height="30" rx="6" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="270" y="139.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="bold">"Amit"</text><path d="M130 135 L218 135" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="218.0,135.0 211.0,131.5 211.0,138.5" fill="#7B2CD9"/><rect x="30" y="164" width="100" height="30" rx="15" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="80" y="183.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="bold">"sem"</text><rect x="220" y="164" width="100" height="30" rx="6" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="270" y="183.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="bold">2</text><path d="M130 179 L218 179" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="218.0,179.0 211.0,175.5 211.0,182.5" fill="#7B2CD9"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="18" y="223.6" font-size="10.2" text-anchor="start" fill="#306998" font-weight="bold">d["name"]</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="176" y="223.5" font-size="10" text-anchor="start" fill="#2E7D32" font-weight="normal">→ "Amit"</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="18" y="240.6" font-size="10.2" text-anchor="start" fill="#306998" font-weight="bold">d.get("city")</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="176" y="240.5" font-size="10" text-anchor="start" fill="#2E7D32" font-weight="normal">→ None  (no error)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="18" y="257.6" font-size="10.2" text-anchor="start" fill="#306998" font-weight="bold">d["city"]</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="176" y="257.5" font-size="10" text-anchor="start" fill="#C62828" font-weight="normal">→ KeyError</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="18" y="274.6" font-size="10.2" text-anchor="start" fill="#306998" font-weight="bold">d["sem"] = 3</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="176" y="274.5" font-size="10" text-anchor="start" fill="#2E7D32" font-weight="normal">→ update value</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="18" y="291.6" font-size="10.2" text-anchor="start" fill="#306998" font-weight="bold">d["city"] = "Surat"</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="176" y="291.5" font-size="10" text-anchor="start" fill="#2E7D32" font-weight="normal">→ add new pair</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="18" y="308.6" font-size="10.2" text-anchor="start" fill="#306998" font-weight="bold">del d["roll"]</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="176" y="308.5" font-size="10" text-anchor="start" fill="#2E7D32" font-weight="normal">→ delete pair</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="18" y="325.6" font-size="10.2" text-anchor="start" fill="#306998" font-weight="bold">"roll" in d</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="176" y="325.5" font-size="10" text-anchor="start" fill="#2E7D32" font-weight="normal">→ True  (checks keys)</text></svg>