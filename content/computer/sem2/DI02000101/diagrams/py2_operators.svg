<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="320" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Types of Operators in Python</text><rect x="10" y="36" width="112" height="32" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.5"/><text x="66" y="55.9" font-size="11" text-anchor="middle" fill="#1565C0" font-weight="bold">Arithmetic</text><rect x="128" y="36" width="222" height="32" rx="7" fill="#fff" stroke="#1565C0" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="239" y="55.9" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">+  -  *  /  //  %  **</text><rect x="10" y="74" width="112" height="32" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.5"/><text x="66" y="93.8" font-size="11" text-anchor="middle" fill="#2E7D32" font-weight="bold">Comparison</text><rect x="128" y="74" width="222" height="32" rx="7" fill="#fff" stroke="#2E7D32" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="239" y="93.8" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">==  !=  &gt;  &lt;  &gt;=  &lt;=</text><rect x="10" y="112" width="112" height="32" rx="7" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.5"/><text x="66" y="131.8" font-size="11" text-anchor="middle" fill="#E07B00" font-weight="bold">Logical</text><rect x="128" y="112" width="222" height="32" rx="7" fill="#fff" stroke="#E07B00" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="239" y="131.8" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">and   or   not</text><rect x="10" y="150" width="112" height="32" rx="7" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1.5"/><text x="66" y="169.8" font-size="11" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Assignment</text><rect x="128" y="150" width="222" height="32" rx="