<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 386" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="386" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">read() vs readline() vs readlines()</text><text x="14" y="43.7" font-size="10.5" text-anchor="start" fill="#7B2CD9" font-weight="bold">notes.txt</text><rect x="14" y="48" width="150" height="62" rx="4" fill="#fff" stroke="#999" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="65.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">Python↵</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="83.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">is easy↵</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="101.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="normal">Bye</text><text x="176" y="59.4" font-size="9.6" text-anchor="start" fill="#666" font-weight="normal">↵ = newline character \n</text><text x="176" y="77.4" font-size="9.6" text-anchor="start" fill="#666" font-weight="normal">Each call moves the file</text><text x="176" y="93.4" font-size="9.6" text-anchor="start" fill="#666" font-weight="normal">pointer forward.</text><rect x="8" y="124" width="344" height="34" fill="#F6F0FE"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="137.6" font-size="10.2" text-anchor="start" fill="#306998" font-weight="bold">f.read()</text><text x="346" y="137.2" font-size="9.2" text-anchor="end" fill="#666" font-weight="normal">whole file → one str</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="152.4" font-size="9.8" text-anchor="start" fill="#2E7D32" font-weight="normal">→ 'Python\nis easy\nBye'</text><rect x="8" y="158" width="344" height="34" fill="#fff"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="171.6" font-size="10.2" text-anchor="start" fill="#306998" font-weight="bold">f.read(4)</text><text x="346" y="171.2" font-size="9.2" text-anchor="end" fill="#666" font-weight="normal">first 4 characters</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="186.4" font-size="9.8" text-anchor="start" fill="#2E7D32" font-weight="normal">→ 'Pyth'</text><rect x="8" y="192" width="344" height="34" fill="#F6F0FE"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="205.6" font-size="10.2" text-anchor="start" fill="#306998" font-weight="bold">f.readline()</text><text x="346" y="205.2" font-size="9.2" text-anchor="end" fill="#666" font-weight="normal">one line (with \n)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="220.4" font-size="9.8" text-anchor="start" fill="#2E7D32" font-weight="normal">→ 'Python\n'</text><rect x="8" y="226" width="344" height="34" fill="#fff"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="239.6" font-size="10.2" text-anchor="start" fill="#306998" font-weight="bold">f.readline()  (again)</text><text x="346" y="239.2" font-size="9.2" text-anchor="end" fill="#666" font-weight="normal">next line</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="254.4" font-size="9.8" text-anchor="start" fill="#2E7D32" font-weight="normal">→ 'is easy\n'</text><rect x="8" y="260" width="344" height="34" fill="#F6F0FE"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="273.6" font-size="10.2" text-anchor="start" fill="#306998" font-weight="bold">f.readlines()</text><text x="346" y="273.2" font-size="9.2" text-anchor="end" fill="#666" font-weight="normal">list of all lines</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="288.4" font-size="9.8" text-anchor="start" fill="#2E7D32" font-weight="normal">→ ['Python\n', 'is easy\n', 'Bye']</text><rect x="8" y="294" width="344" height="34" fill="#fff"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="307.6" font-size="10.2" text-anchor="start" fill="#306998" font-weight="bold">for line in f:</text><text x="346" y="307.2" font-size="9.2" text-anchor="end" fill="#666" font-weight="normal">memory-efficient</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="322.4" font-size="9.8" text-anchor="start" fill="#2E7D32" font-weight="normal">→ one line per loop</text><rect x="8" y="328" width="344" height="34" fill="#F6F0FE"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="341.6" font-size="10.2" text-anchor="start" fill="#306998" font-weight="bold">At end of file</text><text x="346" y="341.2" font-size="9.2" text-anchor="end" fill="#666" font-weight="normal">empty string</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="356.4" font-size="9.8" text-anchor="start" fill="#2E7D32" font-weight="normal">→ read() → ''</text><text x="180" y="379.3" font-size="9.4" text-anchor="middle" fill="#444" font-weight="normal">Each call above is on a freshly opened file, except 'again'.</text></svg>