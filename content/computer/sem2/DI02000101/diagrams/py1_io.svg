<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 358" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="358" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Input and Output in Python</text><rect x="15.0" y="35.0" width="90" height="30" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="60" y="53.9" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">Keyboard</text><rect x="125.0" y="35.0" width="150" height="30" rx="7" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1.6"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="200" y="53.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="bold">input("Prompt: ")</text><path d="M105 50 L124 50" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="124.0,50.0 117.0,46.5 117.0,53.5" fill="#1565C0"/><path d="M200 65 L200 88" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="200.0,88.0 203.5,81.0 196.5,81.0" fill="#7B2CD9"/><rect x="125.0" y="89.0" width="150" height="30" rx="7" fill="#FFF6D6" stroke="#B88A00" stroke-width="1.6"/><text x="200" y="107.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="bold">always returns str</text><path d="M200 119 L200 142" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="200.0,142.0 203.5,135.0 196.5,135.0" fill="#7B2CD9"/><rect x="105.0" y="143.0" width="190" height="30" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.6"/><text x="200" y="161.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="bold">int() / float() to convert</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="199.7" font-size="10.5" text-anchor="start" fill="#7B2CD9" font-weight="bold">age = int(input("Age: "))</text><path d="M15 210 H345" fill="none" stroke="#E0D3F2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="231.8" font-size="11" text-anchor="middle" fill="#306998" font-weight="bold">print(*values, sep=' ', end='\n')</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="253.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">print("A", "B", 5)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="250" y="253.4" font-size="9.8" text-anchor="start" fill="#2E7D32" font-weight="bold">A B 5</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="271.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">print("A", "B", sep="-")</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="250" y="271.4" font-size="9.8" text-anchor="start" fill="#2E7D32" font-weight="bold">A-B</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="289.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">print("Hi", end=" ")</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="250" y="289.4" font-size="9.8" text-anchor="start" fill="#2E7D32" font-weight="bold">Hi ␣ (no newline)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="307.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">print(f"Sum = {a+b}")</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="250" y="307.4" font-size="9.8" text-anchor="start" fill="#2E7D32" font-weight="bold">Sum = 30</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="325.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">print("%d %.2f" % (5, 2.5))</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="250" y="325.4" font-size="9.8" text-anchor="start" fill="#2E7D32" font-weight="bold">5 2.50</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="343.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">print("{} {}".format(1, 2))</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="250" y="343.4" font-size="9.8" text-anchor="start" fill="#2E7D32" font-weight="bold">1 2</text></svg>