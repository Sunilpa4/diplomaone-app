<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="340" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Recursion: fact(4)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="41.1" font-size="8.8" text-anchor="middle" fill="#444" font-weight="normal">def fact(n):  if n == 1: return 1;  return n * fact(n-1)</text><rect x="20" y="56" width="170" height="34" rx="6" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="30" y="76.8" font-size="11" text-anchor="start" fill="#222" font-weight="bold">fact(4)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="184" y="76.5" font-size="10" text-anchor="end" fill="#222" font-weight="normal">4 * fact(3)</text><path d="M60 90 L60 106" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="60.0,106.0 63.5,99.0 56.5,99.0" fill="#1565C0"/><text x="70" y="103.1" font-size="8.8" text-anchor="start" fill="#1565C0" font-weight="normal">call</text><rect x="46" y="106" width="170" height="34" rx="6" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="56" y="126.8" font-size="11" text-anchor="start" fill="#222" font-weight="bold">fact(3)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="210" y="126.5" font-size="10" text-anchor="end" fill="#222" font-weight="normal">3 * fact(2)</text><path d="M86 140 L86 156" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="86.0,156.0 89.5,149.0 82.5,149.0" fill="#1565C0"/><text x="96" y="153.1" font-size="8.8" text-anchor="start" fill="#1565C0" font-weight="normal">call</text><rect x="72" y="156" width="170" height="34" rx="6" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="82" y="176.8" font-size="11" text-anchor="start" fill="#222" font-weight="bold">fact(2)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="236" y="176.5" font-size="10" text-anchor="end" fill="#222" font-weight="normal">2 * fact(1)</text><path d="M112 190 L112 206" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="112.0,206.0 115.5,199.0 108.5,199.0" fill="#1565C0"/><text x="122" y="203.1" font-size="8.8" text-anchor="start" fill="#1565C0" font-weight="normal">call</text><rect x="98" y="206" width="170" height="34" rx="6" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="108" y="226.8" font-size="11" text-anchor="start" fill="#222" font-weight="bold">fact(1)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="262" y="226.5" font-size="10" text-anchor="end" fill="#C62828" font-weight="normal">return 1</text><path d="M268 223 L298 223 L298 173 L246 173" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="246.0,173.0 253.0,176.5 253.0,169.5" fill="#2E7D32"/><text x="304" y="201.3" font-size="9.4" text-anchor="start" fill="#2E7D32" font-weight="bold">returns 1</text><path d="M242 173 L272 173 L272 123 L220 123" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="220.0,123.0 227.0,126.5 227.0,119.5" fill="#2E7D32"/><text x="278" y="151.3" font-size="9.4" text-anchor="start" fill="#2E7D32" font-weight="bold">returns 2</text><path d="M216 123 L246 123 L246 73 L194 73" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="194.0,73.0 201.0,76.5 201.0,69.5" fill="#2E7D32"/><text x="252" y="101.3" font-size="9.4" text-anchor="start" fill="#2E7D32" font-weight="bold">returns 6</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="272.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Result: 4 * 3 * 2 * 1 = 24</text><text x="20" y="297.6" font-size="10.2" text-anchor="start" fill="#E07B00" font-weight="bold">Base case:</text><text x="128" y="297.5" font-size="10" text-anchor="start" fill="#222" font-weight="normal">stops the recursion (n == 1)</text><text x="20" y="314.6" font-size="10.2" text-anchor="start" fill="#1565C0" font-weight="bold">Recursive case:</text><text x="128" y="314.5" font-size="10" text-anchor="start" fill="#222" font-weight="normal">calls itself with a smaller n</text><text x="20" y="331.6" font-size="10.2" text-anchor="start" fill="#C62828" font-weight="bold">No base case:</text><text x="128" y="331.5" font-size="10" text-anchor="start" fill="#222" font-weight="normal">RecursionError (max depth ≈ 1000)</text></svg>