<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 346" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="346" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">History of Python</text><path d="M70 48 V288" fill="none" stroke="#C9B3EE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="70" cy="48" r="7" fill="#306998" stroke="#fff" stroke-width="2"/><text x="56" y="51.9" font-size="11" text-anchor="end" fill="#306998" font-weight="bold">1989</text><text x="86" y="45.6" font-size="10.2" text-anchor="start" fill="#222" font-weight="bold">Guido van Rossum starts Python at CWI,</text><text x="86" y="59.5" font-size="10" text-anchor="start" fill="#555" font-weight="normal">Netherlands (Christmas holidays)</text><circle cx="70" cy="88" r="7" fill="#FFD43B" stroke="#fff" stroke-width="2"/><text x="56" y="91.8" font-size="11" text-anchor="end" fill="#306998" font-weight="bold">1991</text><text x="86" y="85.6" font-size="10.2" text-anchor="start" fill="#222" font-weight="bold">Python 0.9.0 released (Feb 1991):</text><text x="86" y="99.5" font-size="10" text-anchor="start" fill="#555" font-weight="normal">functions, exceptions, modules</text><circle cx="70" cy="128" r="7" fill="#306998" stroke="#fff" stroke-width="2"/><text x="56" y="131.8" font-size="11" text-anchor="end" fill="#306998" font-weight="bold">1994</text><text x="86" y="125.6" font-size="10.2" text-anchor="start" fill="#222" font-weight="bold">Python 1.0: lambda, map,</text><text x="86" y="139.5" font-size="10" text-anchor="start" fill="#555" font-weight="normal">filter, reduce</text><circle cx="70" cy="168" r="7" fill="#FFD43B" stroke="#fff" stroke-width="2"/><text x="56" y="171.8" font-size="11" text-anchor="end" fill="#306998" font-weight="bold">2000</text><text x="86" y="165.6" font-size="10.2" text-anchor="start" fill="#222" font-weight="bold">Python 2.0: list comprehensions,</text><text x="86" y="179.5" font-size="10" text-anchor="start" fill="#555" font-weight="normal">garbage collection, Unicode</text><circle cx="70" cy="208" r="7" fill="#306998" stroke="#fff" stroke-width="2"/><text x="56" y="211.8" font-size="11" text-anchor="end" fill="#306998" font-weight="bold">2008</text><text x="86" y="205.6" font-size="10.2" text-anchor="start" fill="#222" font-weight="bold">Python 3.0: cleaner language,</text><text x="86" y="219.5" font-size="10" text-anchor="start" fill="#555" font-weight="normal">not backward compatible with 2.x</text><circle cx="70" cy="248" r="7" fill="#FFD43B" stroke="#fff" stroke-width="2"/><text x="56" y="251.8" font-size="11" text-anchor="end" fill="#306998" font-weight="bold">2020</text><text x="86" y="245.6" font-size="10.2" text-anchor="start" fill="#222" font-weight="bold">Python 2 reaches end of life</text><text x="86" y="259.5" font-size="10" text-anchor="start" fill="#555" font-weight="normal">(1 January 2020)</text><circle cx="70" cy="288" r="7" fill="#306998" stroke="#fff" stroke-width="2"/><text x="56" y="291.9" font-size="11" text-anchor="end" fill="#306998" font-weight="bold">Today</text><text x="86" y="285.6" font-size="10.2" text-anchor="start" fill="#222" font-weight="bold">Python 3.x is used worldwide;</text><text x="86" y="299.5" font-size="10" text-anchor="start" fill="#555" font-weight="normal">managed by the PSF</text><text x="180" y="323.4" font-size="9.6" text-anchor="middle" fill="#555" font-weight="normal">Named after the BBC comedy show "Monty Python's Flying Circus",</text><text x="180" y="337.4" font-size="9.6" text-anchor="middle" fill="#555" font-weight="normal">not after the snake.</text></svg>