<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="340" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Steps of File Handling</text><rect x="62.0" y="34.0" width="96" height="32" rx="16.0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.8"/><text x="110" y="54.2" font-size="12" text-anchor="middle" fill="#1B5E20" font-weight="bold">Start</text><path d="M110 66 L110 82" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="110.0,82.0 113.5,75.0 106.5,75.0" fill="#222"/><rect x="12.0" y="84.0" width="196" height="36" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.8"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="110" y="105.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="normal">f = open("a.txt", "r")</text><text x="110" y="135.4" font-size="9.6" text-anchor="middle" fill="#666" font-weight="normal">1. Open: get a file object</text><path d="M110 138 L110 154" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="110.0,154.0 113.5,147.0 106.5,147.0" fill="#222"/><rect x="12.0" y="158.0" width="196" height="36" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.8"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="110" y="179.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="normal">f.read() / f.write(s)</text><text x="110" y="209.4" font-size="9.6" text-anchor="middle" fill="#666" font-weight="normal">2. Read or write data</text><path d="M110 212 L110 228" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="110.0,228.0 113.5,221.0 106.5,221.0" fill="#222"/><rect x="12.0" y="230.0" width="196" height="36" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.8"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="110" y="251.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="normal">f.close()</text><text x="110" y="281.4" font-size="9.6" text-anchor="middle" fill="#666" font-weight="normal">3. Close: save + free resources</text><path d="M110 284 L110 300" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="110.0,300.0 113.5,293.0 106.5,293.0" fill="#222"/><rect x="62.0" y="300.0" width="96" height="32" rx="16.0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.8"/><text x="110" y="320.2" font-size="12" text-anchor="middle" fill="#1B5E20" font-weight="bold">End</text><rect x="222" y="72" width="130" height="236" rx="8" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.5"/><text x="230" y="95.6" font-size="10.2" text-anchor="start" fill="#2E7D32" font-weight="bold">Better: with</text><text x="230" y="112.6" font-size="10.2" text-anchor="start" fill="#222" font-weight="normal"></text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="230" y="129.4" font-size="9.8" text-anchor="start" fill="#306998" font-weight="normal">with open(</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="230" y="146.4" font-size="9.8" text-anchor="start" fill="#306998" font-weight="normal"> "a.txt") as f:</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="230" y="163.4" font-size="9.8" text-anchor="start" fill="#306998" font-weight="normal">    data = f.read()</text><text x="230" y="180.6" font-size="10.2" text-anchor="start" fill="#222" font-weight="normal"></text><text x="230" y="197.6" font-size="10.2" text-anchor="start" fill="#222" font-weight="normal">File is closed</text><text x="230" y="214.6" font-size="10.2" text-anchor="start" fill="#222" font-weight="normal">automatically,</text><text x="230" y="231.6" font-size="10.2" text-anchor="start" fill="#222" font-weight="normal">even if an error</text><text x="230" y="248.6" font-size="10.2" text-anchor="start" fill="#222" font-weight="normal">occurs.</text><text x="230" y="265.6" font-size="10.2" text-anchor="start" fill="#222" font-weight="normal"></text><text x="230" y="282.6" font-size="10.2" text-anchor="start" fill="#2E7D32" font-weight="bold">No close() needed.</text></svg>