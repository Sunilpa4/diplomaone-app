<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="330" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Flowchart: while Loop</text><rect x="70.0" y="31.0" width="80" height="26" rx="13.0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.8"/><text x="110" y="47.9" font-size="11" text-anchor="middle" fill="#1B5E20" font-weight="bold">Start</text><path d="M110 57 L110 72" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="110.0,72.0 113.5,65.0 106.5,65.0" fill="#222"/><rect x="60.0" y="73.0" width="100" height="30" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.8"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="110" y="91.8" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">i = 1</text><path d="M110 103 L110 122" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="110.0,122.0 113.5,115.0 106.5,115.0" fill="#222"/><polygon points="110,123.0 165.0,150 110,177.0 55.0,150" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.8"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="110" y="153.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="normal">i &lt;= 5 ?</text><path d="M110 177 L110 200" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="110.0,200.0 113.5,193.0 106.5,193.0" fill="#222"/><text x="128" y="191.7" font-size="10.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">True</text><polygon points="72.0,201.0 166.0,201.0 148.0,231.0 54.0,231.0" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.8"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="110" y="219.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="normal">print(i)</text><path d="M110 231 L110 248" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="110.0,248.0 113.5,241.0 106.5,241.0" fill="#222"/><rect x="60.0" y="249.0" width="100" height="30" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.8"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="110" y="267.9" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">i += 1</text><path d="M60 264 H36 V112 H108" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="108.0,112.0 101.0,108.5 101.0,115.5" fill="#222"/><text transform="rotate(-90 28 190)" x="28" y="193.3" font-size="9.5" text-anchor="middle" fill="#777" font-weight="normal">repeat</text><path d="M165 150 L196 150 L196 312 L152 312" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="152.0,312.0 159.0,315.5 159.0,308.5" fill="#222"/><text x="186" y="141.7" font-size="10.5" text-anchor="middle" fill="#C62828" font-weight="bold">False</text><rect x="70.0" y="300.0" width="80" height="24" rx="12.0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.8"/><text x="110" y="315.9" font-size="11" text-anchor="middle" fill="#1B5E20" font-weight="bold">Stop</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="222" y="93.5" font-size="10" text-anchor="start" fill="#7B2CD9" font-weight="normal">i = 1</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="222" y="109.5" font-size="10" text-anchor="start" fill="#7B2CD9" font-weight="normal">while i &lt;= 5:</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="222" y="125.5" font-size="10" text-anchor="start" fill="#7B2CD9" font-weight="normal">    print(i)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="222" y="141.5" font-size="10" text-anchor="start" fill="#7B2CD9" font-weight="normal">    i += 1</text><text x="222" y="157.5" font-size="10" text-anchor="start" fill="#444" font-weight="normal"></text><text x="222" y="173.5" font-size="10" text-anchor="start" fill="#2E7D32" font-weight="bold">Output: 1 2 3 4 5</text><text x="222" y="189.5" font-size="10" text-anchor="start" fill="#444" font-weight="normal"></text><text x="222" y="205.5" font-size="10" text-anchor="start" fill="#444" font-weight="normal">Condition checked</text><text x="222" y="221.5" font-size="10" text-anchor="start" fill="#444" font-weight="normal">BEFORE each pass:</text><text x="222" y="237.5" font-size="10" text-anchor="start" fill="#444" font-weight="normal">may run 0 times.</text><rect x="214" y="78" width="138" height="72" rx="6" fill="none" stroke="#D9C8F0"/></svg>