<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 346" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="346" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Ways to Import</text><rect x="8" y="36" width="344" height="38" fill="#F6F0FE"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="51.7" font-size="10.5" text-anchor="start" fill="#306998" font-weight="bold">import math</text><text x="346" y="51.2" font-size="9.2" text-anchor="end" fill="#666" font-weight="normal">whole module</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="28" y="67.4" font-size="9.8" text-anchor="start" fill="#2E7D32" font-weight="normal">use: math.sqrt(9)</text><rect x="8" y="74" width="344" height="38" fill="#fff"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="89.7" font-size="10.5" text-anchor="start" fill="#306998" font-weight="bold">import math as m</text><text x="346" y="89.2" font-size="9.2" text-anchor="end" fill="#666" font-weight="normal">module with alias</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="28" y="105.4" font-size="9.8" text-anchor="start" fill="#2E7D32" font-weight="normal">use: m.sqrt(9)</text><rect x="8" y="112" width="344" height="38" fill="#F6F0FE"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="127.7" font-size="10.5" text-anchor="start" fill="#306998" font-weight="bold">from math import sqrt</text><text x="346" y="127.2" font-size="9.2" text-anchor="end" fill="#666" font-weight="normal">one name</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="28" y="143.4" font-size="9.8" text-anchor="start" fill="#2E7D32" font-weight="normal">use: sqrt(9)</text><rect x="8" y="150" width="344" height="38" fill="#fff"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="165.7" font-size="10.5" text-anchor="start" fill="#306998" font-weight="bold">from math import sqrt, pi</text><text x="346" y="165.2" font-size="9.2" text-anchor="end" fill="#666" font-weight="normal">listed names</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="28" y="181.4" font-size="9.8" text-anchor="start" fill="#2E7D32" font-weight="normal">use: sqrt(9), pi</text><rect x="8" y="188" width="344" height="38" fill="#F6F0FE"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="203.7" font-size="10.5" text-anchor="start" fill="#306998" font-weight="bold">from math import *</text><text x="346" y="203.2" font-size="9.2" text-anchor="end" fill="#666" font-weight="normal">all public names</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="28" y="219.4" font-size="9.8" text-anchor="start" fill="#2E7D32" font-weight="normal">use: sqrt(9), floor(2.5)</text><rect x="8" y="226" width="344" height="38" fill="#fff"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="241.7" font-size="10.5" text-anchor="start" fill="#306998" font-weight="bold">from math import sqrt as r</text><text x="346" y="241.2" font-size="9.2" text-anchor="end" fill="#666" font-weight="normal">name with alias</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="28" y="257.4" font-size="9.8" text-anchor="start" fill="#2E7D32" font-weight="normal">use: r(9)</text><text x="180" y="285.4" font-size="9.6" text-anchor="middle" fill="#444" font-weight="normal">import X: names need the prefix X. (no name clashes)</text><text x="180" y="301.4" font-size="9.6" text-anchor="middle" fill="#444" font-weight="normal">from X import a: use a directly (shorter code)</text><text x="180" y="317.4" font-size="9.6" text-anchor="middle" fill="#444" font-weight="normal">import *: not recommended, names may overwrite others</text><text x="180" y="333.4" font-size="9.6" text-anchor="middle" fill="#444" font-weight="normal">dir(math) lists all names in a module</text></svg>