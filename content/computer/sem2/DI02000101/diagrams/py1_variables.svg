<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 276" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="276" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Variables are Names that Refer to Objects</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="44.0" font-size="11.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">a = 10    b = a    a = 20</text><text x="60" y="69.7" font-size="10.5" text-anchor="middle" fill="#555" font-weight="bold">Names</text><text x="260" y="69.7" font-size="10.5" text-anchor="middle" fill="#555" font-weight="bold">Objects (in memory)</text><rect x="30" y="84" width="60" height="32" rx="6" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="60" y="104.5" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">a</text><rect x="30" y="144" width="60" height="32" rx="6" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="60" y="164.6" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">b</text><rect x="210" y="80" width="110" height="40" rx="20" fill="#FFF6D6" stroke="#B88A00" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="265" y="98.5" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">20</text><text x="265" y="113.2" font-size="9" text-anchor="middle" fill="#666" font-weight="normal">int  id: 0x…a0</text><rect x="210" y="140" width="110" height="40" rx="20" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="265" y="158.6" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">10</text><text x="265" y="173.2" font-size="9" text-anchor="middle" fill="#666" font-weight="normal">int  id: 0x…48</text><path d="M90 100 L208 100" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="208.0,100.0 201.0,96.5 201.0,103.5" fill="#1565C0"/><path d="M90 160 L208 160" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="208.0,160.0 201.0,156.5 201.0,163.5" fill="#1565C0"/><path d="M90 106 L208 154" fill="none" stroke="#AAA" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><text x="128" y="145.2" font-size="9" text-anchor="middle" fill="#999" font-weight="normal">old link</text><text x="20" y="207.5" font-size="10" text-anchor="start" fill="#222" font-weight="normal">• No declaration: the type comes from the value.</text><text x="20" y="224.5" font-size="10" text-anchor="start" fill="#222" font-weight="normal">• b = a  makes b refer to the SAME object (10).</text><text x="20" y="241.5" font-size="10" text-anchor="start" fill="#222" font-weight="normal">• a = 20  creates a new object; b still refers to 10.</text><text x="20" y="258.5" font-size="10" text-anchor="start" fill="#222" font-weight="normal">• type(a) → &lt;class 'int'&gt;,  id(a) → its address</text></svg>