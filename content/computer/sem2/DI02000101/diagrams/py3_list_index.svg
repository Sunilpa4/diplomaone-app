pace" x="280.0" y="91.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="bold">60</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="18" y="145.7" font-size="10.5" text-anchor="start" fill="#306998" font-weight="bold">a[0]</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="140" y="145.6" font-size="10.2" text-anchor="start" fill="#2E7D32" font-weight="normal">→ 10</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="18" y="162.7" font-size="10.5" text-anchor="start" fill="#306998" font-weight="bold">a[-1]</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="140" y="162.6" font-size="10.2" text-anchor="start" fill="#2E7D32" font-weight="normal">→ 60</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="18" y="179.7" font-size="10.5" text-anchor="start" fill="#306998" font-weight="bold">a[1:4]</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="140" y="179.6" font-size="10.2" text-anchor="start" fill="#2E7D32" font-weight="normal">→ [20, 30, 40]</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="18" y="196.7" font-size="10.5" text-anchor="start" fill="#306998" font-weight="bold">a[:3]</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="140" y="196.6" font-size="10.2" text-anchor="start" fill="#2E7D32" font-weight="normal">→ [10, 20, 30]</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="18" y="213.7" font-size="10.5" text-anchor="start" fill="#306998" font-weight="bold">a[3:]</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="140" y="213.6" font-size="10.2" text-anchor="start" fill="#2E7D32" font-weight="normal">→ [40, 50, 60]</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="18" y="230.7" font-size="10.5" text-anchor="start" fill="#306998" font-weight="bold">a[::2]</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="140" y="230.6" font-size="10.2" text-anchor="start" fill="#2E7D32" font-weight="normal">→ [10, 30, 50]</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="18" y="247.7" font-size="10.5" text-anchor="start" fill="#306998" font-weight="bold">a[::-1]</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="140" y="247.6" font-size="10.2" text-anchor="start" fill="#2E7D32" font-weight="normal">→ [60, 50, 40, 30, 20, 10]</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="18" y="264.7" font-size="10.5" text-anchor="start" fill="#306998" font-weight="bold">a[1] = 25</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="140" y="264.6" font-size="10.2" text-anchor="start" fill="#2E7D32" font-weight="normal">→ [10, 25, 30, …]  (mutable)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="18" y="281.7" font-size="10.5" text-anchor="start" fill="#306998" font-weight="bold">a[1:3] = [7, 8]</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="140" y="281.6" font-size="10.2" text-anchor="start" fill="#2E7D32" font-weight="normal">→ replaces a slice</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="304.5" font-size="10" text-anchor="middle" fill="#C62828" font-weight="normal">a[10] → IndexError: list index out of range</text></svg>