<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 313" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="313" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">List: Indexing and Slicing</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="44.0" font-size="11.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">a = [10, 20, 30, 40, 50, 60]</text><text x="52" y="65.3" font-size="9.5" text-anchor="end" fill="#2E7D32" font-weight="bold">+ve</text><text x="52" y="121.3" font-size="9.5" text-anchor="end" fill="#C62828" font-weight="bold">−ve</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="80.0" y="65.7" font-size="10.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">0</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="80.0" y="121.7" font-size="10.5" text-anchor="middle" fill="#C62828" font-weight="bold">-6</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="120.0" y="65.7" font-size="10.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">1</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="120.0" y="121.7" font-size="10.5" text-anchor="middle" fill="#C62828" font-weight="bold">-5</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="160.0" y="65.7" font-size="10.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">2</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="160.0" y="121.7" font-size="10.5" text-anchor="middle" fill="#C62828" font-weight="bold">-4</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="200.0" y="65.7" font-size="10.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">3</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="200.0" y="121.7" font-size="10.5" text-anchor="middle" fill="#C62828" font-weight="bold">-3</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="240.0" y="65.7