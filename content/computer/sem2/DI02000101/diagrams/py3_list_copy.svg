<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="280" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Aliasing vs Copying a List</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="90" y="46.0" font-size="11.5" text-anchor="middle" fill="#C62828" font-weight="bold">b = a  (alias)</text><rect x="20" y="60" width="40" height="28" rx="6" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="40" y="78.2" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">a</text><rect x="20" y="104" width="40" height="28" rx="6" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="40" y="122.2" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">b</text><rect x="96" y="80" width="72" height="30" rx="6" fill="#FFF6D6" stroke="#B88A00" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="132" y="98.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="bold">[1, 2, 9]</text><path d="M60 74 L94 90" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="94.0,90.0 89.2,83.9 86.2,90.2" fill="#1565C0"/><path d="M60 118 L94 100" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="94.0,100.0 86.2,100.2 89.5,106.4" fill="#1565C0"/><text x="90" y="153.5" font-size="10" text-anchor="middle" fill="#C62828" font-weight="bold">b[2] = 9 changes a too</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="90" y="169.5" font-size="10" text-anchor="middle" fill="#444" font-weight="normal">a is b → True</text><path d="M180 36 V180" fill="none" stroke="#E0D3F2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="270" y="46.0" font-size="11.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">b = a.copy()</text><rect x="196" y="60" width="40" height="28" rx="6" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="216" y="78.2" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">a</text><rect x="196" y="104" width="40" height="28" rx="6" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="216" y="122.2" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">b</text><rect x="270" y="59" width="76" height="30" rx="6" fill="#FFF6D6" stroke="#B88A00" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="308" y="77.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="bold">[1, 2, 3]</text><rect x="270" y="103" width="76" height="30" rx="6" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="308" y="121.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="bold">[1, 2, 9]</text><path d="M236 74 L268 74" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="268.0,74.0 261.0,70.5 261.0,77.5" fill="#1565C0"/><path d="M236 118 L268 118" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="268.0,118.0 261.0,114.5 261.0,121.5" fill="#1565C0"/><text x="270" y="153.5" font-size="10" text-anchor="middle" fill="#2E7D32" font-weight="bold">b[2] = 9: a unchanged</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="270" y="169.5" font-size="10" text-anchor="middle" fill="#444" font-weight="normal">a is b → False</text><text x="20" y="199.6" font-size="10.2" text-anchor="start" fill="#7B2CD9" font-weight="bold">Ways to copy:</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="215.6" font-size="10.2" text-anchor="start" fill="#222" font-weight="normal">b = a.copy()</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="231.6" font-size="10.2" text-anchor="start" fill="#222" font-weight="normal">b = a[:]</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="247.6" font-size="10.2" text-anchor="start" fill="#222" font-weight="normal">b = list(a)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="263.6" font-size="10.2" text-anchor="start" fill="#222" font-weight="normal">import copy; b = copy.deepcopy(a)  (nested)</text></svg>