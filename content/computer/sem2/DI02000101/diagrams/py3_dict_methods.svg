<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 334" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="334" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Dictionary Methods</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="41.9" font-size="11" text-anchor="middle" fill="#7B2CD9" font-weight="bold">d = {"a": 1, "b": 2}</text><rect x="8" y="54" width="344" height="21" fill="#F6F0FE"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="68.1" font-size="10.2" text-anchor="start" fill="#306998" font-weight="bold">d.keys()</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="178" y="67.9" font-size="9.8" text-anchor="start" fill="#2E7D32" font-weight="normal">dict_keys(['a', 'b'])</text><rect x="8" y="75" width="344" height="21" fill="#fff"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="89.1" font-size="10.2" text-anchor="start" fill="#306998" font-weight="bold">d.values()</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="178" y="88.9" font-size="9.8" text-anchor="start" fill="#2E7D32" font-weight="normal">dict_values([1, 2])</text><rect x="8" y="96" width="344" height="21" fill="#F6F0FE"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="110.1" font-size="10.2" text-anchor="start" fill="#306998" font-weight="bold">d.items()</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="178" y="109.9" font-size="9.8" text-anchor="start" fill="#2E7D32" font-weight="normal">[('a', 1), ('b', 2)]</text><rect x="8" y="117" width="344" height="21" fill="#fff"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="131.1" font-size="10.2" text-anchor="start" fill="#306998" font-weight="bold">d.get("c", 0)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="178" y="130.9" font-size="9.8" text-anchor="start" fill="#2E7D32" font-weight="normal">0  (default)</text><rect x="8" y="138" width="344" height="21" fill="#F6F0FE"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="152.1" font-size="10.2" text-anchor="start" fill="#306998" font-weight="bold">d.update({"c": 3})</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="178" y="151.9" font-size="9.8" text-anchor="start" fill="#2E7D32" font-weight="normal">adds / updates pairs</text><rect x="8" y="159" width="344" height="21" fill="#fff"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="173.1" font-size="10.2" text-anchor="start" fill="#306998" font-weight="bold">d.pop("a")</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="178" y="172.9" font-size="9.8" text-anchor="start" fill="#2E7D32" font-weight="normal">removes, returns 1</text><rect x="8" y="180" width="344" height="21" fill="#F6F0FE"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="194.1" font-size="10.2" text-anchor="start" fill="#306998" font-weight="bold">d.popitem()</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="178" y="193.9" font-size="9.8" text-anchor="start" fill="#2E7D32" font-weight="normal">removes last pair</text><rect x="8" y="201" width="344" height="21" fill="#fff"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="215.1" font-size="10.2" text-anchor="start" fill="#306998" font-weight="bold">d.setdefault("z", 9)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="178" y="214.9" font-size="9.8" text-anchor="start" fill="#2E7D32" font-weight="normal">adds z: 9 if missing</text><rect x="8" y="222" width="344" height="21" fill="#F6F0FE"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="236.1" font-size="10.2" text-anchor="start" fill="#306998" font-weight="bold">dict.fromkeys("ab", 0)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="178" y="235.9" font-size="9.8" text-anchor="start" fill="#2E7D32" font-weight="normal">{'a': 0, 'b': 0}</text><rect x="8" y="243" width="344" height="21" fill="#fff"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="257.1" font-size="10.2" text-anchor="start" fill="#306998" font-weight="bold">d.copy()</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="178" y="256.9" font-size="9.8" text-anchor="start" fill="#2E7D32" font-weight="normal">shallow copy</text><rect x="8" y="264" width="344" height="21" fill="#F6F0FE"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="278.1" font-size="10.2" text-anchor="start" fill="#306998" font-weight="bold">d.clear()</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="178" y="277.9" font-size="9.8" text-anchor="start" fill="#2E7D32" font-weight="normal">{}</text><rect x="8" y="285" width="344" height="21" fill="#fff"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="299.1" font-size="10.2" text-anchor="start" fill="#306998" font-weight="bold">len(d)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="178" y="298.9" font-size="9.8" text-anchor="start" fill="#2E7D32" font-weight="normal">2  (number of pairs)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="325.7" font-size="10.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">for k, v in d.items():  print(k, v)</text></svg>