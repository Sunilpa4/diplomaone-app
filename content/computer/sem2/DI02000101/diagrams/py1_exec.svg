<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 372" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="372" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">How a Python Program is Executed</text><rect x="24" y="40" width="150" height="40" rx="8" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.7"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="99" y="64.2" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">hello.py</text><text x="184" y="63.4" font-size="9.8" text-anchor="start" fill="#444" font-weight="normal">Source code (written by you)</text><path d="M99 80 L99 100" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="99.0,100.0 102.5,93.0 95.5,93.0" fill="#222"/><rect x="24" y="100" width="150" height="40" rx="8" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1.7"/><text x="99" y="124.2" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">Python Compiler</text><text x="184" y="123.4" font-size="9.8" text-anchor="start" fill="#444" font-weight="normal">checks syntax, translates</text><path d="M99 140 L99 160" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="99.0,160.0 102.5,153.0 95.5,153.0" fill="#222"/><rect x="24" y="160" width="150" height="40" rx="8" fill="#FFF6D6" stroke="#B88A00" stroke-width="1.7"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="99" y="184.2" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">Byte code (.pyc)</text><text x="184" y="183.4" font-size="9.8" text-anchor="start" fill="#444" font-weight="normal">platform-independent code</text><path d="M99 200 L99 220" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="99.0,220.0 102.5,213.0 95.5,213.0" fill="#222"/><rect x="24" y="220" width="150" height="40" rx="8" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.7"/><text x="99" y="244.2" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">PVM</text><text x="184" y="243.4" font-size="9.8" text-anchor="start" fill="#444" font-weight="normal">Python Virtual Machine</text><path d="M99 260 L99 280" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="99.0,280.0 102.5,273.0 95.5,273.0" fill="#222"/><rect x="24" y="280" width="150" height="40" rx="8" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.7"/><text x="99" y="304.2" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">Output</text><text x="184" y="303.4" font-size="9.8" text-anchor="start" fill="#444" font-weight="normal">result on screen</text><text x="180" y="347.5" font-size="10" text-anchor="middle" fill="#444" font-weight="normal">Steps 2–4 happen automatically when you run:</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="364.0" font-size="11.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">python hello.py</text></svg>