<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 308" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="308" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">String Indexing and Slicing</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="44.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">s = "PYTHON"</text><text x="40" y="63.3" font-size="9.5" text-anchor="end" fill="#2E7D32" font-weight="bold">+ve</text><text x="40" y="123.3" font-size="9.5" text-anchor="end" fill="#C62828" font-weight="bold">−ve</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="70.0" y="63.7" font-size="10.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">0</text><rect x="48" y="70" width="44" height="34" rx="0" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="70.0" y="91.9" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">P</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="70.0" y="123.7" font-size="10.5" text-anchor="middle" fill="#C62828" font-weight="bold">-6</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="114.0" y="63.7" font-size="10.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">1</text><rect x="92" y="70" width="44" height="34" rx="0" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="114.0" y="91.9" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">Y</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="114.0" y="123.7" font-size="10.5" text-anchor="middle" fill="#C62828" font-weight="bold">-5</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="158.0" y="63.7" font-size="10.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">2</text><rect x="136" y="70" width="44" height="34" rx="0" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="158.0" y="91.9" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">T</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="158.0" y="123.7" font-size="10.5" text-anchor="middle" fill="#C62828" font-weight="bold">-4</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="202.0" y="63.7" font-size="10.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">3</text><rect x="180" y="70" width="44" height="34" rx="0" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="202.0" y="91.9" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">H</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="202.0" y="123.7" font-size="10.5" text-anchor="middle" fill="#C62828" font-weight="bold">-3</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="246.0" y="63.7" font-size="10.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">4</text><rect x="224" y="70" width="44" height="34" rx="0" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="246.0" y="91.9" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">O</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="246.0" y="123.7" font-size="10.5" text-anchor="middle" fill="#C62828" font-weight="bold">-2</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="290.0" y="63.7" font-size="10.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">5</text><rect x="268" y="70" width="44" height="34" rx="0" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="290.0" y="91.9" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">N</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="290.0" y="123.7" font-size="10.5" text-anchor="middle" fill="#C62828" font-weight="bold">-1</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="149.7" font-size="10.5" text-anchor="start" fill="#306998" font-weight="bold">s[0]</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="92" y="149.7" font-size="10.5" text-anchor="start" fill="#2E7D32" font-weight="bold">→ 'P'</text><text x="196" y="149.4" font-size="9.8" text-anchor="start" fill="#444" font-weight="normal">first character</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="167.7" font-size="10.5" text-anchor="start" fill="#306998" font-weight="bold">s[-1]</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="92" y="167.7" font-size="10.5" text-anchor="start" fill="#2E7D32" font-weight="bold">→ 'N'</text><text x="196" y="167.4" font-size="9.8" text-anchor="start" fill="#444" font-weight="normal">last character</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="185.7" font-size="10.5" text-anchor="start" fill="#306998" font-weight="bold">s[2:5]</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="92" y="185.7" font-size="10.5" text-anchor="start" fill="#2E7D32" font-weight="bold">→ 'THO'</text><text x="196" y="185.4" font-size="9.8" text-anchor="start" fill="#444" font-weight="normal">index 2 to 4 (end excluded)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="203.7" font-size="10.5" text-anchor="start" fill="#306998" font-weight="bold">s[:3]</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="92" y="203.7" font-size="10.5" text-anchor="start" fill="#2E7D32" font-weight="bold">→ 'PYT'</text><text x="196" y="203.4" font-size="9.8" text-anchor="start" fill="#444" font-weight="normal">from start</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="221.7" font-size="10.5" text-anchor="start" fill="#306998" font-weight="bold">s[3:]</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="92" y="221.7" font-size="10.5" text-anchor="start" fill="#2E7D32" font-weight="bold">→ 'HON'</text><text x="196" y="221.4" font-size="9.8" text-anchor="start" fill="#444" font-weight="normal">till end</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="239.7" font-size="10.5" text-anchor="start" fill="#306998" font-weight="bold">s[::2]</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="92" y="239.7" font-size="10.5" text-anchor="start" fill="#2E7D32" font-weight="bold">→ 'PTO'</text><text x="196" y="239.4" font-size="9.8" text-anchor="start" fill="#444" font-weight="normal">every 2nd character</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="257.7" font-size="10.5" text-anchor="start" fill="#306998" font-weight="bold">s[::-1]</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="92" y="257.7" font-size="10.5" text-anchor="start" fill="#2E7D32" font-weight="bold">→ 'NOHTYP'</text><text x="196" y="257.4" font-size="9.8" text-anchor="start" fill="#444" font-weight="normal">reverse</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="275.7" font-size="10.5" text-anchor="start" fill="#306998" font-weight="bold">len(s)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="92" y="275.7" font-size="10.5" text-anchor="start" fill="#2E7D32" font-weight="bold">→ 6</text><text x="196" y="275.4" font-size="9.8" text-anchor="start" fill="#444" font-weight="normal">number of characters</text><text x="180" y="299.5" font-size="10" text-anchor="middle" fill="#C62828" font-weight="bold">Strings are immutable: s[0] = 'J' gives TypeError.</text></svg>