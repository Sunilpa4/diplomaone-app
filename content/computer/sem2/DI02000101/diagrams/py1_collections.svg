<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="280" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">List vs Tuple vs Set vs Dictionary</text><rect x="6" y="34" width="350" height="24" fill="#7B2CD9"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="39.0" y="49.9" font-size="11" text-anchor="middle" fill="#fff" font-weight="bold"></text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="107.0" y="49.9" font-size="11" text-anchor="middle" fill="#fff" font-weight="bold">list</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="177.0" y="49.9" font-size="11" text-anchor="middle" fill="#fff" font-weight="bold">tuple</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="247.0" y="49.9" font-size="11" text-anchor="middle" fill="#fff" font-weight="bold">set</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="319.0" y="49.9" font-size="11" text-anchor="middle" fill="#fff" font-weight="bold">dict</text><rect x="6" y="58" width="350" height="26" fill="#fff"/><text x="39.0" y="74.4" font-size="9.8" text-anchor="middle" fill="#222" font-weight="bold">Brackets</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="107.0" y="74.5" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">[ ]</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="177.0" y="74.5" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">( )</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="247.0" y="74.5" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">{ }</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="319.0" y="74.5" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">{k: v}</text><rect x="6" y="84" width="350" height="26" fill="#F8F4FD"/><text x="39.0" y="100.4" font-size="9.8" text-anchor="middle" fill="#222" font-weight="bold">Example</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="107.0" y="100.5" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">[1,2,2]</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="177.0" y="100.5" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">(1,2,2)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="247.0" y="100.5" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">{1,2}</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="319.0" y="100.5" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">{'a':1}</text><rect x="6" y="110" width="350" height="26" fill="#fff"/><text x="39.0" y="126.4" font-size="9.8" text-anchor="middle" fill="#222" font-weight="bold">Ordered</text><text x="107.0" y="126.5" font-size="10" text-anchor="middle" fill="#2E7D32" font-weight="normal">Yes</text><text x="177.0" y="126.5" font-size="10" text-anchor="middle" fill="#2E7D32" font-weight="normal">Yes</text><text x="247.0" y="126.5" font-size="10" text-anchor="middle" fill="#C62828" font-weight="normal">No</text><text x="319.0" y="126.5" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">Yes*</text><rect x="6" y="136" width="350" height="26" fill="#F8F4FD"/><text x="39.0" y="152.4" font-size="9.8" text-anchor="middle" fill="#222" font-weight="bold">Mutable</text><text x="107.0" y="152.5" font-size="10" text-anchor="middle" fill="#2E7D32" font-weight="normal">Yes</text><text x="177.0" y="152.5" font-size="10" text-anchor="middle" fill="#C62828" font-weight="normal">No</text><text x="247.0" y="152.5" font-size="10" text-anchor="middle" fill="#2E7D32" font-weight="normal">Yes</text><text x="319.0" y="152.5" font-size="10" text-anchor="middle" fill="#2E7D32" font-weight="normal">Yes</text><rect x="6" y="162" width="350" height="26" fill="#fff"/><text x="39.0" y="178.4" font-size="9.8" text-anchor="middle" fill="#222" font-weight="bold">Duplicates</text><text x="107.0" y="178.5" font-size="10" text-anchor="middle" fill="#2E7D32" font-weight="normal">Allowed</text><text x="177.0" y="178.5" font-size="10" text-anchor="middle" fill="#2E7D32" font-weight="normal">Allowed</text><text x="247.0" y="178.5" font-size="10" text-anchor="middle" fill="#C62828" font-weight="normal">No</text><text x="319.0" y="178.5" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">Keys: No</text><rect x="6" y="188" width="350" height="26" fill="#F8F4FD"/><text x="39.0" y="204.4" font-size="9.8" text-anchor="middle" fill="#222" font-weight="bold">Indexing</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="107.0" y="204.5" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">a[0]</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="177.0" y="204.5" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">t[0]</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="247.0" y="204.5" font-size="10" text-anchor="middle" fill="#C62828" font-weight="normal">No</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="319.0" y="204.5" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">d['a']</text><rect x="6" y="214" width="350" height="26" fill="#fff"/><text x="39.0" y="230.4" font-size="9.8" text-anchor="middle" fill="#222" font-weight="bold">Empty</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="107.0" y="230.5" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">[]</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="177.0" y="230.5" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">()</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="247.0" y="230.5" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">set()</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="319.0" y="230.5" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">{}</text><path d="M6 240 H356" fill="none" stroke="#D9C8F0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="180" y="257.4" font-size="9.6" text-anchor="middle" fill="#555" font-weight="normal">* dict keeps insertion order from Python 3.7.</text><text x="180" y="272.4" font-size="9.6" text-anchor="middle" fill="#C62828" font-weight="bold">{} creates an empty dict, not a set.</text></svg>