<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 298" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="298" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Type Conversion (Type Casting)</text><rect x="10.0" y="33.0" width="160" height="26" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.6"/><text x="90" y="49.9" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">Implicit (automatic)</text><rect x="190.0" y="33.0" width="160" height="26" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="270" y="49.9" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">Explicit (by programmer)</text><rect x="52.0" y="72.0" width="76" height="24" rx="12" fill="#fff" stroke="#2E7D32" stroke-width="1.6"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="90" y="87.8" font-size="11" text-anchor="middle" fill="#2E7D32" font-weight="bold">bool</text><path d="M90 96 L90 106" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="90.0,106.0 93.5,99.0 86.5,99.0" fill="#2E7D32"/><rect x="52.0" y="106.0" width="76" height="24" rx="12" fill="#fff" stroke="#2E7D32" stroke-width="1.6"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="90" y="121.8" font-size="11" text-anchor="middle" fill="#2E7D32" font-weight="bold">int</text><path d="M90 130 L90 140" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="90.0,140.0 93.5,133.0 86.5,133.0" fill="#2E7D32"/><rect x="52.0" y="140.0" width="76" height="24" rx="12" fill="#fff" stroke="#2E7D32" stroke-width="1.6"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="90" y="155.8" font-size="11" text-anchor="middle" fill="#2E7D32" font-weight="bold">float</text><path d="M90 164 L90 174" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="90.0,174.0 93.5,167.0 86.5,167.0" fill="#2E7D32"/><rect x="52.0" y="174.0" width="76" height="24" rx="12" fill="#fff" stroke="#2E7D32" stroke-width="1.6"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="90" y="189.8" font-size="11" text-anchor="middle" fill="#2E7D32" font-weight="bold">complex</text><text x="90" y="217.4" font-size="9.6" text-anchor="middle" fill="#555" font-weight="normal">lower → higher type</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="90" y="233.5" font-size="10" text-anchor="middle" fill="#2E7D32" font-weight="bold">3 + 2.5 → 5.5 (float)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="90" y="249.5" font-size="10" text-anchor="middle" fill="#2E7D32" font-weight="bold">True + 5 → 6 (int)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="196" y="85.5" font-size="10" text-anchor="start" fill="#1565C0" font-weight="bold">int("25")</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="290" y="85.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">→ 25</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="196" y="106.5" font-size="10" text-anchor="start" fill="#1565C0" font-weight="bold">int(9.8)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="290" y="106.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">→ 9</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="196" y="127.5" font-size="10" text-anchor="start" fill="#1565C0" font-weight="bold">float("3.5")</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="290" y="127.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">→ 3.5</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="196" y="148.5" font-size="10" text-anchor="start" fill="#1565C0" font-weight="bold">float(7)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="290" y="148.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">→ 7.0</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="196" y="169.5" font-size="10" text-anchor="start" fill="#1565C0" font-weight="bold">str(100)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="290" y="169.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">→ '100'</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="196" y="190.5" font-size="10" text-anchor="start" fill="#1565C0" font-weight="bold">bool(0)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="290" y="190.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">→ False</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="196" y="211.5" font-size="10" text-anchor="start" fill="#1565C0" font-weight="bold">complex(2, 3)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="290" y="211.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">→ (2+3j)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="196" y="232.5" font-size="10" text-anchor="start" fill="#1565C0" font-weight="bold">list("ab")</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="290" y="232.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">→ ['a','b']</text><path d="M180 64 V250" fill="none" stroke="#E0D3F2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="273.4" font-size="9.8" text-anchor="middle" fill="#C62828" font-weight="normal">int("12.5") → ValueError</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="289.4" font-size="9.8" text-anchor="middle" fill="#C62828" font-weight="normal">int("abc")  → ValueError</text></svg>