<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 290" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="290" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Features of Python</text><circle cx="180" cy="44" r="0" fill="none"/><rect x="12" y="36" width="164" height="42" rx="8" fill="#E3F0FC" stroke="#306998" stroke-width="1.5"/><circle cx="27" cy="57" r="9" fill="#306998"/><text x="27" y="60.5" font-size="10" text-anchor="middle" fill="#fff" font-weight="bold">1</text><text x="42" y="53.8" font-size="10.8" text-anchor="start" fill="#222" font-weight="bold">Simple &amp; easy</text><text x="42" y="68.4" font-size="9.6" text-anchor="start" fill="#555" font-weight="normal">English-like syntax</text><rect x="184" y="36" width="164" height="42" rx="8" fill="#FFF6D6" stroke="#B88A00" stroke-width="1.5"/><circle cx="199" cy="57" r="9" fill="#B88A00"/><text x="199" y="60.5" font-size="10" text-anchor="middle" fill="#fff" font-weight="bold">2</text><text x="214" y="53.8" font-size="10.8" text-anchor="start" fill="#222" font-weight="bold">Interpreted</text><text x="214" y="68.4" font-size="9.6" text-anchor="start" fill="#555" font-weight="normal">executes line by line</text><rect x="12" y="86" width="164" height="42" rx="8" fill="#FFF6D6" stroke="#B88A00" stroke-width="1.5"/><circle cx="27" cy="107" r="9" fill="#B88A00"/><text x="27" y="110.5" font-size="10" text-anchor="middle" fill="#fff" font-weight="bold">3</text><text x="42" y="103.8" font-size="10.8" text-anchor="start" fill="#222" font-weight="bold">Free &amp; open source</text><text x="42" y="118.4" font-size="9.6" text-anchor="start" fill="#555" font-weight="normal">PSF licence</text><rect x="184" y="86" width="164" height="42" rx="8" fill="#E3F0FC" stroke="#306998" stroke-width="1.5"/><circle cx="199" cy="107" r="9" fill="#306998"/><text x="199" y="110.5" font-size="10" text-anchor="middle" fill="#fff" font-weight="bold">4</text><text x="214" y="103.8" font-size="10.8" text-anchor="start" fill="#222" font-weight="bold">High-level</text><text x="214" y="118.4" font-size="9.6" text-anchor="start" fill="#555" font-weight="normal">no memory management</text><rect x="12" y="136" width="164" height="42" rx="8" fill="#E3F0FC" stroke="#306998" stroke-width="1.5"/><circle cx="27" cy="157" r="9" fill="#306998"/><text x="27" y="160.5" font-size="10" text-anchor="middle" fill="#fff" font-weight="bold">5</text><text x="42" y="153.8" font-size="10.8" text-anchor="start" fill="#222" font-weight="bold">Dynamically typed</text><text x="42" y="168.4" font-size="9.6" text-anchor="start" fill="#555" font-weight="normal">no type declaration</text><rect x="184" y="136" width="164" height="42" rx="8" fill="#FFF6D6" stroke="#B88A00" stroke-width="1.5"/><circle cx="199" cy="157" r="9" fill="#B88A00"/><text x="199" y="160.5" font-size="10" text-anchor="middle" fill="#fff" font-weight="bold">6</text><text x="214" y="153.8" font-size="10.8" text-anchor="start" fill="#222" font-weight="bold">Portable</text><text x="214" y="168.4" font-size="9.6" text-anchor="start" fill="#555" font-weight="normal">Windows / Linux / macOS</text><rect x="12" y="186" width="164" height="42" rx="8" fill="#FFF6D6" stroke="#B88A00" stroke-width="1.5"/><circle cx="27" cy="207" r="9" fill="#B88A00"/><text x="27" y="210.5" font-size="10" text-anchor="middle" fill="#fff" font-weight="bold">7</text><text x="42" y="203.8" font-size="10.8" text-anchor="start" fill="#222" font-weight="bold">Object-oriented</text><text x="42" y="218.4" font-size="9.6" text-anchor="start" fill="#555" font-weight="normal">classes and objects</text><rect x="184" y="186" width="164" height="42" rx="8" fill="#E3F0FC" stroke="#306998" stroke-width="1.5"/><circle cx="199" cy="207" r="9" fill="#306998"/><text x="199" y="210.5" font-size="10" text-anchor="middle" fill="#fff" font-weight="bold">8</text><text x="214" y="203.8" font-size="10.8" text-anchor="start" fill="#222" font-weight="bold">Large library</text><text x="214" y="218.4" font-size="9.6" text-anchor="start" fill="#555" font-weight="normal">"batteries included"</text><rect x="12" y="236" width="164" height="42" rx="8" fill="#E3F0FC" stroke="#306998" stroke-width="1.5"/><circle cx="27" cy="257" r="9" fill="#306998"/><text x="27" y="260.5" font-size="10" text-anchor="middle" fill="#fff" font-weight="bold">9</text><text x="42" y="253.8" font-size="10.8" text-anchor="start" fill="#222" font-weight="bold">Extensible</text><text x="42" y="268.4" font-size="9.6" text-anchor="start" fill="#555" font-weight="normal">mix with C, C++, Java</text><rect x="184" y="236" width="164" height="42" rx="8" fill="#FFF6D6" stroke="#B88A00" stroke-width="1.5"/><circle cx="199" cy="257" r="9" fill="#B88A00"/><text x="199" y="260.5" font-size="10" text-anchor="middle" fill="#fff" font-weight="bold">10</text><text x="214" y="253.8" font-size="10.8" text-anchor="start" fill="#222" font-weight="bold">Interactive mode</text><text x="214" y="268.4" font-size="9.6" text-anchor="start" fill="#555" font-weight="normal">&gt;&gt;&gt; prompt (REPL)</text></svg>