<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="330" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Flowchart: for Loop</text><rect x="70.0" y="31.0" width="80" height="26" rx="13.0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.8"/><text x="110" y="47.9" font-size="11" text-anchor="middle" fill="#1B5E20" font-weight="bold">Start</text><path d="M110 57 L110 80" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="110.0,80.0 113.5,73.0 106.5,73.0" fill="#222"/><polygon points="110,82.0 175.0,112 110,142.0 45.0,112" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.8"/><text x="110" y="109.5" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">more items</text><text x="110" y="121.5" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">in sequence?</text><path d="M110 142 L110 166" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="110.0,166.0 113.5,159.0 106.5,159.0" fill="#222"/><text x="128" y="157.7" font-size="10.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">True</text><rect x="45.0" y="167.0" width="130" height="30" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.8"/><text x="110" y="185.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="normal">item = next item</text><path d="M110 197 L110 214" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="110.0,214.0 113.5,207.0 106.5,207.0" fill="#222"/><rect x="45.0" y="215.0" width="130" height="30" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.8"/><text x="110" y="233.8" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">loop body</text><path d="M45 230 H26 V70 H108" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="108.0,70.0 101.0,66.5 101.0,73.5" fill="#222"/><path d="M175 112 L200 112 L200 286 L152 286" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="152.0,286.0 159.0,289.5 159.0,282.5" fill="#222"/><text x="192" y="103.7" font-size="10.5" text-anchor="middle" fill="#C62828" font-weight="bold">False</text><rect x="70.0" y="274.0" width="80" height="24" rx="12.0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.8"/><text x="110" y="289.9" font-size="11" text-anchor="middle" fill="#1B5E20" font-weight="bold">Stop</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="214" y="95.6" font-size="10.2" text-anchor="start" fill="#7B2CD9" font-weight="normal">for ch in "GTU":</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="214" y="111.6" font-size="10.2" text-anchor="start" fill="#7B2CD9" font-weight="normal">    print(ch)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="214" y="127.6" font-size="10.2" text-anchor="start" fill="#2E7D32" font-weight="normal"></text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="214" y="143.6" font-size="10.2" text-anchor="start" fill="#2E7D32" font-weight="bold">Output:</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="214" y="159.6" font-size="10.2" text-anchor="start" fill="#2E7D32" font-weight="bold">G</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="214" y="175.6" font-size="10.2" text-anchor="start" fill="#2E7D32" font-weight="bold">T</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="214" y="191.6" font-size="10.2" text-anchor="start" fill="#2E7D32" font-weight="bold">U</text><text x="180" y="321.4" font-size="9.8" text-anchor="middle" fill="#444" font-weight="normal">Works on any sequence: str, list, tuple, set, dict, range.</text></svg>