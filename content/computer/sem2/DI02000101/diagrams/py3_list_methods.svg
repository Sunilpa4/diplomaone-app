<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 353" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="353" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">List Methods: Before → After</text><text x="180" y="41.7" font-size="10.5" text-anchor="middle" fill="#555" font-weight="normal">Start every row with  a = [3, 1, 2]</text><rect x="8" y="54" width="344" height="21" fill="#F6F0FE"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="68.1" font-size="10.2" text-anchor="start" fill="#306998" font-weight="bold">a.append(5)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="160" y="68.0" font-size="10" text-anchor="start" fill="#2E7D32" font-weight="bold">[3, 1, 2, 5]</text><text x="348" y="67.7" font-size="9" text-anchor="end" fill="#666" font-weight="normal">add at end</text><rect x="8" y="75" width="344" height="21" fill="#fff"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="89.1" font-size="10.2" text-anchor="start" fill="#306998" font-weight="bold">a.insert(1, 9)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="160" y="89.0" font-size="10" text-anchor="start" fill="#2E7D32" font-weight="bold">[3, 9, 1, 2]</text><text x="348" y="88.7" font-size="9" text-anchor="end" fill="#666" font-weight="normal">add at index</text><rect x="8" y="96" width="344" height="21" fill="#F6F0FE"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="110.1" font-size="10.2" text-anchor="start" fill="#306998" font-weight="bold">a.extend([7, 8])</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="160" y="110.0" font-size="10" text-anchor="start" fill="#2E7D32" font-weight="bold">[3, 1, 2, 7, 8]</text><text x="348" y="109.7" font-size="9" text-anchor="end" fill="#666" font-weight="normal">add many</text><rect x="8" y="117" width="344" height="21" fill="#fff"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="131.1" font-size="10.2" text-anchor="start" fill="#306998" font-weight="bold">a.remove(1)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="160" y="131.0" font-size="10" text-anchor="start" fill="#2E7D32" font-weight="bold">[3, 2]</text><text x="348" y="130.7" font-size="9" text-anchor="end" fill="#666" font-weight="normal">delete by value</text><rect x="8" y="138" width="344" height="21" fill="#F6F0FE"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="152.1" font-size="10.2" text-anchor="start" fill="#306998" font-weight="bold">a.pop()</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="160" y="152.0" font-size="10" text-anchor="start" fill="#2E7D32" font-weight="bold">[3, 1]  returns 2</text><text x="348" y="151.7" font-size="9" text-anchor="end" fill="#666" font-weight="normal">delete last</text><rect x="8" y="159" width="344" height="21" fill="#fff"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="173.1" font-size="10.2" text-anchor="start" fill="#306998" font-weight="bold">a.pop(0)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="160" y="173.0" font-size="10" text-anchor="start" fill="#2E7D32" font-weight="bold">[1, 2]  returns 3</text><text x="348" y="172.7" font-size="9" text-anchor="end" fill="#666" font-weight="normal">delete by index</text><rect x="8" y="180" width="344" height="21" fill="#F6F0FE"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="194.1" font-size="10.2" text-anchor="start" fill="#306998" font-weight="bold">del a[1]</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="160" y="194.0" font-size="10" text-anchor="start" fill="#2E7D32" font-weight="bold">[3, 2]</text><text x="348" y="193.7" font-size="9" text-anchor="end" fill="#666" font-weight="normal">statement</text><rect x="8" y="201" width="344" height="21" fill="#fff"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="215.1" font-size="10.2" text-anchor="start" fill="#306998" font-weight="bold">a.sort()</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="160" y="215.0" font-size="10" text-anchor="start" fill="#2E7D32" font-weight="bold">[1, 2, 3]</text><text x="348" y="214.7" font-size="9" text-anchor="end" fill="#666" font-weight="normal">ascending</text><rect x="8" y="222" width="344" height="21" fill="#F6F0FE"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="236.1" font-size="10.2" text-anchor="start" fill="#306998" font-weight="bold">a.sort(reverse=True)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="160" y="236.0" font-size="10" text-anchor="start" fill="#2E7D32" font-weight="bold">[3, 2, 1]</text><text x="348" y="235.7" font-size="9" text-anchor="end" fill="#666" font-weight="normal">descending</text><rect x="8" y="243" width="344" height="21" fill="#fff"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="257.1" font-size="10.2" text-anchor="start" fill="#306998" font-weight="bold">a.reverse()</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="160" y="257.0" font-size="10" text-anchor="start" fill="#2E7D32" font-weight="bold">[2, 1, 3]</text><text x="348" y="256.6" font-size="9" text-anchor="end" fill="#666" font-weight="normal">reverse order</text><rect x="8" y="264" width="344" height="21" fill="#F6F0FE"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="278.1" font-size="10.2" text-anchor="start" fill="#306998" font-weight="bold">a.index(2)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="160" y="278.0" font-size="10" text-anchor="start" fill="#2E7D32" font-weight="bold">2</text><text x="348" y="277.6" font-size="9" text-anchor="end" fill="#666" font-weight="normal">position of 2</text><rect x="8" y="285" width="344" height="21" fill="#fff"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="299.1" font-size="10.2" text-anchor="start" fill="#306998" font-weight="bold">a.count(3)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="160" y="299.0" font-size="10" text-anchor="start" fill="#2E7D32" font-weight="bold">1</text><text x="348" y="298.6" font-size="9" text-anchor="end" fill="#666" font-weight="normal">occurrences</text><rect x="8" y="306" width="344" height="21" fill="#F6F0FE"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="320.1" font-size="10.2" text-anchor="start" fill="#306998" font-weight="bold">a.clear()</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="160" y="320.0" font-size="10" text-anchor="start" fill="#2E7D32" font-weight="bold">[]</text><text x="348" y="319.6" font-size="9" text-anchor="end" fill="#666" font-weight="normal">empty list</text><text x="180" y="344.4" font-size="9.8" text-anchor="middle" fill="#C62828" font-weight="bold">sort(), reverse(), append() … change the list and return None.</text></svg>