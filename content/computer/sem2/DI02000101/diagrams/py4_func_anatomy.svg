<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 376" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="376" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Defining and Calling a Function</text><rect x="30" y="40" width="300" height="92" rx="8" fill="#1E1530" stroke="#1E1530" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="46" y="66.2" font-size="12" text-anchor="start" fill="#FF79C6" font-weight="bold">def</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="78" y="66.2" font-size="12" text-anchor="start" fill="#EDE7F6" font-weight="bold">add(a, b):</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="46" y="85.8" font-size="11" text-anchor="start" fill="#9E9E9E" font-weight="normal">    """Return sum."""</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="46" y="106.2" font-size="12" text-anchor="start" fill="#EDE7F6" font-weight="normal">    s = a + b</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="46" y="126.2" font-size="12" text-anchor="start" fill="#EDE7F6" font-weight="normal">    return s</text><path d="M57 136 V145" fill="none" stroke="#C2185B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="57" y="157.4" font-size="9.6" text-anchor="middle" fill="#C2185B" font-weight="bold">keyword</text><path d="M89 136 V161" fill="none" stroke="#1565C0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="89" y="173.4" font-size="9.6" text-anchor="middle" fill="#1565C0" font-weight="bold">name</text><path d="M122 136 V145" fill="none" stroke="#2E7D32" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="136" y="157.4" font-size="9.6" text-anchor="middle" fill="#2E7D32" font-weight="bold">parameters</text><path d="M147 136 V161" fill="none" stroke="#E07B00" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="161" y="173.4" font-size="9.6" text-anchor="middle" fill="#E07B00" font-weight="bold">colon</text><text x="270" y="85.4" font-size="9.6" text-anchor="middle" fill="#ccc" font-weight="normal">docstring</text><text x="270" y="107.4" font-size="9.6" text-anchor="middle" fill="#ccc" font-weight="normal">body (indented)</text><text x="270" y="127.4" font-size="9.6" text-anchor="middle" fill="#ccc" font-weight="normal">result sent back</text><text x="180" y="202.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Calling the function</text><rect x="60" y="210" width="240" height="34" rx="8" fill="#FFF6D6" stroke="#B88A00" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="231.2" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">total = add(10, 20)</text><text x="150" y="265.5" font-size="10" text-anchor="middle" fill="#2E7D32" font-weight="bold">arguments: a = 10, b = 20</text><text x="30" y="291.5" font-size="10" text-anchor="start" fill="#222" font-weight="normal">1. Control jumps into add() with a = 10, b = 20</text><text x="30" y="308.5" font-size="10" text-anchor="start" fill="#222" font-weight="normal">2. Body runs: s = 30</text><text x="30" y="325.5" font-size="10" text-anchor="start" fill="#222" font-weight="normal">3. return s sends 30 back to the caller</text><text x="30" y="342.5" font-size="10" text-anchor="start" fill="#222" font-weight="normal">4. total = 30; execution continues after the call</text><text x="180" y="367.3" font-size="9.4" text-anchor="middle" fill="#666" font-weight="normal">Parameter = variable in the definition; argument = value in the call.</text></svg>