<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 350" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="350" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Types of Functions in Python</text><rect x="120.0" y="36.0" width="120" height="32" rx="7" fill="#7B2CD9" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="56.5" font-size="13" text-anchor="middle" fill="#fff" font-weight="bold">Functions</text><path d="M180 68 V84 M76 84 H284 M76 84 V96 M284 84 V96" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="8.0" y="97.0" width="136" height="34" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="76" y="118.0" font-size="11.5" text-anchor="middle" fill="#1565C0" font-weight="bold">Built-in Functions</text><rect x="216.0" y="97.0" width="136" height="34" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.6"/><text x="284" y="118.0" font-size="11.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">User-defined</text><text x="14" y="151.5" font-size="10" text-anchor="start" fill="#444" font-weight="normal">Ready-made, part of Python</text><text x="14" y="166.5" font-size="10" text-anchor="start" fill="#444" font-weight="normal">No def needed</text><text x="14" y="181.5" font-size="10" text-anchor="start" fill="#444" font-weight="normal"></text><text x="14" y="196.5" font-size="10" text-anchor="start" fill="#1565C0" font-weight="bold">Type conversion:</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="211.4" font-size="9.8" text-anchor="start" fill="#306998" font-weight="normal"> int() float() str()</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="226.4" font-size="9.8" text-anchor="start" fill="#306998" font-weight="normal"> list() set() dict()</text><text x="14" y="241.5" font-size="10" text-anchor="start" fill="#1565C0" font-weight="bold">Math:</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="256.4" font-size="9.8" text-anchor="start" fill="#306998" font-weight="normal"> abs() round() pow()</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="271.4" font-size="9.8" text-anchor="start" fill="#306998" font-weight="normal"> divmod() sum() max()</text><text x="14" y="286.5" font-size="10" text-anchor="start" fill="#1565C0" font-weight="bold">String methods:</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="301.4" font-size="9.8" text-anchor="start" fill="#306998" font-weight="normal"> upper() find() strip()</text><text x="14" y="316.5" font-size="10" text-anchor="start" fill="#1565C0" font-weight="bold">File:</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="331.4" font-size="9.8" text-anchor="start" fill="#306998" font-weight="normal"> open() read() write()</text><text x="220" y="151.5" font-size="10" text-anchor="start" fill="#444" font-weight="normal">Written by programmer</text><text x="220" y="166.5" font-size="10" text-anchor="start" fill="#444" font-weight="normal">Created with def</text><text x="220" y="181.5" font-size="10" text-anchor="start" fill="#444" font-weight="normal"></text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="220" y="196.4" font-size="9.8" text-anchor="start" fill="#306998" font-weight="normal">def area(r):</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="220" y="211.4" font-size="9.8" text-anchor="start" fill="#306998" font-weight="normal">  return 3.14*r*r</text><text x="220" y="226.5" font-size="10" text-anchor="start" fill="#444" font-weight="normal"></text><text x="220" y="241.5" font-size="10" text-anchor="start" fill="#2E7D32" font-weight="bold">Arguments:</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="220" y="256.4" font-size="9.8" text-anchor="start" fill="#306998" font-weight="normal"> positional</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="220" y="271.4" font-size="9.8" text-anchor="start" fill="#306998" font-weight="normal"> keyword, default</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="220" y="286.4" font-size="9.8" text-anchor="start" fill="#306998" font-weight="normal"> *args, **kwargs</text><text x="220" y="301.5" font-size="10" text-anchor="start" fill="#2E7D32" font-weight="bold">Special kinds:</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="220" y="316.4" font-size="9.8" text-anchor="start" fill="#306998" font-weight="normal"> recursive</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="220" y="331.4" font-size="9.8" text-anchor="start" fill="#306998" font-weight="normal"> lambda</text><path d="M180 100 V340" fill="none" stroke="#E0D3F2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></svg>