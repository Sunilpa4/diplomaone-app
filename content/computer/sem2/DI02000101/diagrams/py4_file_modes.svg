<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 290" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="290" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">File Opening Modes: open(name, mode)</text><rect x="8" y="34" width="344" height="24" fill="#7B2CD9"/><text x="12" y="49.4" font-size="9.8" text-anchor="start" fill="#fff" font-weight="bold">Mode</text><text x="54" y="49.4" font-size="9.8" text-anchor="start" fill="#fff" font-weight="bold">Purpose</text><text x="168" y="49.4" font-size="9.8" text-anchor="start" fill="#fff" font-weight="bold">File missing</text><text x="248" y="49.4" font-size="9.8" text-anchor="start" fill="#fff" font-weight="bold">Pointer</text><text x="300" y="49.4" font-size="9.8" text-anchor="start" fill="#fff" font-weight="bold">Old data</text><rect x="8" y="58" width="344" height="22" fill="#F6F0FE"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="12" y="72.6" font-size="10.2" text-anchor="start" fill="#306998" font-weight="bold">"r"</text><text x="54" y="72.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">Read (default)</text><text x="168" y="72.4" font-size="9.8" text-anchor="start" fill="#C62828" font-weight="bold">Error</text><text x="248" y="72.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">Start</text><text x="300" y="72.4" font-size="9.8" text-anchor="start" fill="#2E7D32" font-weight="bold">Kept</text><rect x="8" y="80" width="344" height="22" fill="#fff"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="12" y="94.6" font-size="10.2" text-anchor="start" fill="#306998" font-weight="bold">"w"</text><text x="54" y="94.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">Write</text><text x="168" y="94.4" font-size="9.8" text-anchor="start" fill="#2E7D32" font-weight="normal">Creates</text><text x="248" y="94.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">Start</text><text x="300" y="94.4" font-size="9.8" text-anchor="start" fill="#C62828" font-weight="bold">Erased</text><rect x="8" y="102" width="344" height="22" fill="#F6F0FE"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="12" y="116.6" font-size="10.2" text-anchor="start" fill="#306998" font-weight="bold">"a"</text><text x="54" y="116.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">Append</text><text x="168" y="116.4" font-size="9.8" text-anchor="start" fill="#2E7D32" font-weight="normal">Creates</text><text x="248" y="116.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">End</text><text x="300" y="116.4" font-size="9.8" text-anchor="start" fill="#2E7D32" font-weight="bold">Kept</text><rect x="8" y="124" width="344" height="22" fill="#fff"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="12" y="138.6" font-size="10.2" text-anchor="start" fill="#306998" font-weight="bold">"x"</text><text x="54" y="138.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">Create only</text><text x="168" y="138.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">Creates*</text><text x="248" y="138.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">Start</text><text x="300" y="138.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="bold">–</text><rect x="8" y="146" width="344" height="22" fill="#F6F0FE"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="12" y="160.6" font-size="10.2" text-anchor="start" fill="#306998" font-weight="bold">"r+"</text><text x="54" y="160.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">Read + write</text><text x="168" y="160.4" font-size="9.8" text-anchor="start" fill="#C62828" font-weight="bold">Error</text><text x="248" y="160.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">Start</text><text x="300" y="160.4" font-size="9.8" text-anchor="start" fill="#2E7D32" font-weight="bold">Kept</text><rect x="8" y="168" width="344" height="22" fill="#fff"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="12" y="182.6" font-size="10.2" text-anchor="start" fill="#306998" font-weight="bold">"w+"</text><text x="54" y="182.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">Write + read</text><text x="168" y="182.4" font-size="9.8" text-anchor="start" fill="#2E7D32" font-weight="normal">Creates</text><text x="248" y="182.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">Start</text><text x="300" y="182.4" font-size="9.8" text-anchor="start" fill="#C62828" font-weight="bold">Erased</text><rect x="8" y="190" width="344" height="22" fill="#F6F0FE"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="12" y="204.6" font-size="10.2" text-anchor="start" fill="#306998" font-weight="bold">"a+"</text><text x="54" y="204.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">Append + read</text><text x="168" y="204.4" font-size="9.8" text-anchor="start" fill="#2E7D32" font-weight="normal">Creates</text><text x="248" y="204.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">End</text><text x="300" y="204.4" font-size="9.8" text-anchor="start" fill="#2E7D32" font-weight="bold">Kept</text><text x="180" y="233.4" font-size="9.8" text-anchor="middle" fill="#444" font-weight="normal">*"x" raises FileExistsError if the file already exists.</text><text x="180" y="248.4" font-size="9.8" text-anchor="middle" fill="#444" font-weight="normal">Add "b" for binary files: "rb", "wb", "ab".</text><text x="180" y="263.4" font-size="9.8" text-anchor="middle" fill="#444" font-weight="normal">Add "t" for text (default): "rt" = "r".</text><text x="180" y="278.4" font-size="9.8" text-anchor="middle" fill="#444" font-weight="normal">Missing file in "r" mode → FileNotFoundError</text></svg>