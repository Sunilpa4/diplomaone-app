<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 316" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="316" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Module: Write Once, Import Anywhere</text><rect x="14" y="40" width="158" height="150" rx="8" fill="#1E1530" stroke="#1E1530" stroke-width="1.5"/><text x="22" y="59.5" font-size="10" text-anchor="start" fill="#FFD54F" font-weight="bold">mymath.py  (module)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="79.4" font-size="9.8" text-anchor="start" fill="#EDE7F6" font-weight="normal">PI = 3.14159</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="94.4" font-size="9.8" text-anchor="start" fill="#EDE7F6" font-weight="normal"></text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="109.4" font-size="9.8" text-anchor="start" fill="#FF79C6" font-weight="normal">def add(a, b):</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="124.4" font-size="9.8" text-anchor="start" fill="#EDE7F6" font-weight="normal">    return a + b</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="139.4" font-size="9.8" text-anchor="start" fill="#EDE7F6" font-weight="normal"></text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="154.4" font-size="9.8" text-anchor="start" fill="#FF79C6" font-weight="normal">def factorial(n):</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="169.4" font-size="9.8" text-anchor="start" fill="#EDE7F6" font-weight="normal">    ...</text><rect x="188" y="40" width="158" height="150" rx="8" fill="#1E1530" stroke="#1E1530" stroke-width="1.5"/><text x="196" y="59.5" font-size="10" text-anchor="start" fill="#FFD54F" font-weight="bold">main.py  (same folder)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="196" y="79.4" font-size="9.8" text-anchor="start" fill="#FF79C6" font-weight="normal">import mymath</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="196" y="94.4" font-size="9.8" text-anchor="start" fill="#EDE7F6" font-weight="normal"></text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="196" y="109.4" font-size="9.8" text-anchor="start" fill="#EDE7F6" font-weight="normal">mymath.add(2, 3)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="196" y="124.4" font-size="9.8" text-anchor="start" fill="#EDE7F6" font-weight="normal">mymath.PI</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="196" y="139.4" font-size="9.8" text-anchor="start" fill="#EDE7F6" font-weight="normal"></text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="196" y="154.4" font-size="9.8" text-anchor="start" fill="#FF79C6" font-weight="normal">from mymath import add</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="196" y="169.4" font-size="9.8" text-anchor="start" fill="#EDE7F6" font-weight="normal">add(2, 3)</text><path d="M172 115 L186 115" fill="none" stroke="#E07B00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="186.0,115.0 179.0,111.5 179.0,118.5" fill="#E07B00"/><text x="180" y="216.0" font-size="11.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Types of modules</text><rect x="14" y="222" width="106" height="46" rx="8" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.5"/><text x="67" y="241.7" font-size="10.5" text-anchor="middle" fill="#1565C0" font-weight="bold">Built-in</text><text x="67" y="259.0" font-size="8.6" text-anchor="middle" fill="#444" font-weight="normal">math, random, os, sys</text><rect x="127" y="222" width="106" height="46" rx="8" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.5"/><text x="180" y="241.7" font-size="10.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">User-defined</text><text x="180" y="259.0" font-size="8.6" text-anchor="middle" fill="#444" font-weight="normal">your own .py files</text><rect x="240" y="222" width="106" height="46" rx="8" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.5"/><text x="293" y="241.7" font-size="10.5" text-anchor="middle" fill="#E07B00" font-weight="bold">Third-party</text><text x="293" y="259.0" font-size="8.6" text-anchor="middle" fill="#444" font-weight="normal">numpy, matplotlib (pip)</text><text x="180" y="293.4" font-size="9.6" text-anchor="middle" fill="#444" font-weight="normal">Module search order: current folder → PYTHONPATH →</text><text x="180" y="308.4" font-size="9.6" text-anchor="middle" fill="#444" font-weight="normal">standard library → site-packages (see sys.path)</text></svg>