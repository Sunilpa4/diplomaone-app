<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 356" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="356" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Identity (is) vs Equality (==)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="43.8" font-size="10.8" text-anchor="middle" fill="#7B2CD9" font-weight="bold">a = [1, 2, 3]   b = a   c = [1, 2, 3]</text><rect x="30" y="64" width="46" height="30" rx="6" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="53" y="83.5" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">a</text><rect x="30" y="106" width="46" height="30" rx="6" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="53" y="125.5" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">b</text><rect x="30" y="164" width="46" height="30" rx="6" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="53" y="183.6" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">c</text><rect x="190" y="82" width="140" height="34" rx="8" fill="#FFF6D6" stroke="#B88A00" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="260" y="103.2" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">[1, 2, 3]</text><text x="260" y="131.3" font-size="9.5" text-anchor="middle" fill="#777" font-weight="normal">object 1</text><rect x="190" y="160" width="140" height="34" rx="8" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="260" y="181.2" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">[1, 2, 3]</text><text x="260" y="209.3" font-size="9.5" text-anchor="middle" fill="#777" font-weight="normal">object 2</text><path d="M76 79 L188 95" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="188.0,95.0 181.6,90.5 180.6,97.5" fill="#1565C0"/><path d="M76 121 L188 105" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="188.0,105.0 180.6,102.5 181.6,109.5" fill="#1565C0"/><path d="M76 179 L188 177" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="188.0,177.0 180.9,173.6 181.1,180.6" fill="#1565C0"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="30" y="235.8" font-size="10.8" text-anchor="start" fill="#306998" font-weight="bold">a == b</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="130" y="235.8" font-size="10.8" text-anchor="start" fill="#2E7D32" font-weight="bold">True</text><text x="190" y="235.5" font-size="10" text-anchor="start" fill="#444" font-weight="normal">same value</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="30" y="253.8" font-size="10.8" text-anchor="start" fill="#306998" font-weight="bold">a is b</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="130" y="253.8" font-size="10.8" text-anchor="start" fill="#2E7D32" font-weight="bold">True</text><text x="190" y="253.5" font-size="10" text-anchor="start" fill="#444" font-weight="normal">same object</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="30" y="271.8" font-size="10.8" text-anchor="start" fill="#306998" font-weight="bold">a == c</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="130" y="271.8" font-size="10.8" text-anchor="start" fill="#2E7D32" font-weight="bold">True</text><text x="190" y="271.5" font-size="10" text-anchor="start" fill="#444" font-weight="normal">same value</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="30" y="289.8" font-size="10.8" text-anchor="start" fill="#306998" font-weight="bold">a is c</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="130" y="289.8" font-size="10.8" text-anchor="start" fill="#C62828" font-weight="bold">False</text><text x="190" y="289.5" font-size="10" text-anchor="start" fill="#444" font-weight="normal">different objects</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="30" y="307.8" font-size="10.8" text-anchor="start" fill="#306998" font-weight="bold">a is not c</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="130" y="307.8" font-size="10.8" text-anchor="start" fill="#2E7D32" font-weight="bold">True</text><text x="190" y="307.5" font-size="10" text-anchor="start" fill="#444" font-weight="normal"></text><text x="180" y="331.5" font-size="10" text-anchor="middle" fill="#7B2CD9" font-weight="bold">== compares values; is compares identity (id).</text><text x="180" y="347.5" font-size="10" text-anchor="middle" fill="#444" font-weight="normal">Use  x is None  to test for None.</text></svg>