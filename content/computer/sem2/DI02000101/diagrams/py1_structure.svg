<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 318" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="318" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Basic Structure of a Python Program</text><rect x="10" y="34" width="340" height="50" rx="6" fill="#FAF7FE" stroke="#8E9AAF" stroke-width="1.5"/><rect x="10" y="34" width="6" height="50" rx="3" fill="#8E9AAF"/><text x="24" y="62.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="bold">1. Documentation</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="160" y="54.6" font-size="10.2" text-anchor="start" fill="#333" font-weight="normal"># Program: Area of circle</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="160" y="69.6" font-size="10.2" text-anchor="start" fill="#333" font-weight="normal"># Author : Ravi</text><rect x="10" y="90" width="340" height="35" rx="6" fill="#FAF7FE" stroke="#306998" stroke-width="1.5"/><rect x="10" y="90" width="6" height="35" rx="3" fill="#306998"/><text x="24" y="111.2" font-size="10.5" text-anchor="start" fill="#222" font-weight="bold">2. Import section</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="160" y="110.6" font-size="10.2" text-anchor="start" fill="#333" font-weight="normal">import math</text><rect x="10" y="131" width="340" height="35" rx="6" fill="#FAF7FE" stroke="#B88A00" stroke-width="1.5"/><rect x="10" y="131" width="6" height="35" rx="3" fill="#B88A00"/><text x="24" y="145.9" font-size="10.5" text-anchor="start" fill="#222" font-weight="bold">3. Global variables /</text><text x="24" y="158.4" font-size="10.5" text-anchor="start" fill="#222" font-weight="bold">    constants</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="160" y="151.6" font-size="10.2" text-anchor="start" fill="#333" font-weight="normal">PI = 3.14159</text><rect x="10" y="172" width="340" height="50" rx="6" fill="#FAF7FE" stroke="#7B2CD9" stroke-width="1.5"/><rect x="10" y="172" width="6" height="50" rx="3" fill="#7B2CD9"/><text x="24" y="200.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="bold">4. Function definitions</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="160" y="192.6" font-size="10.2" text-anchor="start" fill="#333" font-weight="normal">def area(r):</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="160" y="207.6" font-size="10.2" text-anchor="start" fill="#333" font-weight="normal">    return PI * r * r</text><rect x="10" y="228" width="340" height="50" rx="6" fill="#FAF7FE" stroke="#2E7D32" stroke-width="1.5"/><rect x="10" y="228" width="6" height="50" rx="3" fill="#2E7D32"/><text x="24" y="256.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="bold">5. Main program</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="160" y="248.6" font-size="10.2" text-anchor="start" fill="#333" font-weight="normal">r = float(input("r: "))</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="160" y="263.6" font-size="10.2" text-anchor="start" fill="#333" font-weight="normal">print(area(r))</text><text x="180" y="295.5" font-size="10" text-anchor="middle" fill="#444" font-weight="normal">Only the main statements are compulsory;</text><text x="180" y="309.5" font-size="10" text-anchor="middle" fill="#444" font-weight="normal">blocks are marked by indentation, not { }.</text></svg>