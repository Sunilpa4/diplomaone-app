<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 404" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="404" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Scope of Variables: Local and Global</text><rect x="14" y="34" width="332" height="214" rx="10" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.5"/><text x="26" y="55.7" font-size="10.5" text-anchor="start" fill="#1565C0" font-weight="bold">Global scope (whole program)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="26" y="77.8" font-size="11" text-anchor="start" fill="#222" font-weight="bold">x = 10          # global</text><rect x="30" y="88" width="300" height="98" rx="8" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.5"/><text x="40" y="107.5" font-size="10" text-anchor="start" fill="#2E7D32" font-weight="bold">Local scope of show()</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="40" y="127.8" font-size="11" text-anchor="start" fill="#C2185B" font-weight="bold">def show():</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="40" y="145.8" font-size="11" text-anchor="start" fill="#222" font-weight="normal">    y = 5      # local</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="40" y="163.8" font-size="11" text-anchor="start" fill="#222" font-weight="normal">    print(x, y)  # 10 5</text><text x="40" y="179.3" font-size="9.4" text-anchor="start" fill="#666" font-weight="normal">    (can READ global x)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="26" y="209.8" font-size="11" text-anchor="start" fill="#222" font-weight="normal">show()</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="26" y="229.8" font-size="11" text-anchor="start" fill="#C62828" font-weight="bold">print(y)        # NameError</text><text x="26" y="245.3" font-size="9.4" text-anchor="start" fill="#666" font-weight="normal">(local y does not exist outside)</text><text x="180" y="275.7" font-size="10.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">To CHANGE a global inside a function:</text><rect x="60" y="282" width="240" height="76" rx="8" fill="#1E1530" stroke="#1E1530" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="76" y="301.8" font-size="10.8" text-anchor="start" fill="#EDE7F6" font-weight="normal">count = 0</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="76" y="318.8" font-size="10.8" text-anchor="start" fill="#EDE7F6" font-weight="normal">def inc():</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="76" y="335.8" font-size="10.8" text-anchor="start" fill="#FFD54F" font-weight="bold">    global count</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="76" y="352.8" font-size="10.8" text-anchor="start" fill="#EDE7F6" font-weight="normal">    count += 1</text><text x="180" y="379.5" font-size="10" text-anchor="middle" fill="#C62828" font-weight="bold">Without global → UnboundLocalError</text><text x="180" y="395.4" font-size="9.6" text-anchor="middle" fill="#444" font-weight="normal">Name lookup order: Local → Enclosing → Global → Built-in</text></svg>