<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 266" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="266" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">One-Dimensional Array in Memory</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="43.9" font-size="11" text-anchor="middle" fill="#7B2CD9" font-weight="bold">int A[6] = {15, 7, 42, 9, 23, 31};</text><rect x="30" y="62" width="50" height="34" rx="0" fill="#fff" stroke="#7B2CD9" stroke-width="1.4"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="55.0" y="83.5" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">15</text><rect x="80" y="62" width="50" height="34" rx="0" fill="#fff" stroke="#7B2CD9" stroke-width="1.4"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="105.0" y="83.5" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">7</text><rect x="130" y="62" width="50" height="34" rx="0" fill="#FFF6D6" stroke="#7B2CD9" stroke-width="1.4"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="155.0" y="83.5" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">42</text><rect x="180" y="62" width="50" height="34" rx="0" fill="#fff" stroke="#7B2CD9" stroke-width="1.4"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="205.0" y="83.5" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">9</text><rect x="230" y="62" width="50" height="34" rx="0" fill="#fff" stroke="#7B2CD9" stroke-width="1.4"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="255.0" y="83.5" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">23</text><rect x="280" y="62" width="50" height="34" rx="0" fill="#fff" stroke="#7B2CD9" stroke-width="1.4"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="305.0" y="83.5" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">31</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="55" y="57.4" font-size="9.6" text-anchor="middle" fill="#555" font-weight="normal">A[0]</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="55" y="111.5" font-size="10" text-anchor="middle" fill="#1565C0" font-weight="bold">1000</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="105" y="57.4" font-size="9.6" text-anchor="middle" fill="#555" font-weight="normal">A[1]</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="105" y="111.5" font-size="10" text-anchor="middle" fill="#1565C0" font-weight="bold">1004</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="155" y="57.4" font-size="9.6" text-anchor="middle" fill="#555" font-weight="normal">A[2]</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="155" y="111.5" font-size="10" text-anchor="middle" fill="#1565C0" font-weight="bold">1008</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="205" y="57.4" font-size="9.6" text-anchor="middle" fill="#555" font-weight="normal">A[3]</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="205" y="111.5" font-size="10" text-anchor="middle" fill="#1565C0" font-weight="bold">1012</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="255" y="57.4" font-size="9.6" text-anchor="middle" fill="#555" font-weight="normal">A[4]</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="255" y="111.5" font-size="10" text-anchor="middle" fill="#1565C0" font-weight="bold">1016</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="305" y="57.4" font-size="9.6" text-anchor="middle" fill="#555" font-weight="normal">A[5]</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="305" y="111.5" font-size="10" text-anchor="middle" fill="#1565C0" font-weight="bold">1020</text><text x="26" y="111.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal"></text><text x="180" y="129.4" font-size="9.6" text-anchor="middle" fill="#1565C0" font-weight="normal">address (each int = 4 bytes, base = 1000)</text><rect x="16" y="142" width="328" height="76" rx="8" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="164.0" font-size="11.5" text-anchor="middle" fill="#1565C0" font-weight="bold">Address of A[i] = Base + w × (i − LB)</text><text x="180" y="183.4" font-size="9.6" text-anchor="middle" fill="#333" font-weight="normal">w = size of one element, LB = lower bound (0 in C)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="203.8" font-size="11" text-anchor="middle" fill="#2E7D32" font-weight="bold">A[2] → 1000 + 4 × (2 − 0) = 1008</text><text x="180" y="241.5" font-size="10" text-anchor="middle" fill="#444" font-weight="normal">Contiguous memory: any element can be reached</text><text x="180" y="256.5" font-size="10" text-anchor="middle" fill="#444" font-weight="normal">directly by its index (random access, O(1)).</text></svg>