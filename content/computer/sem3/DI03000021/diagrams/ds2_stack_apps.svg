<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="250" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Applications of Stack</text><rect x="12" y="36" width="164" height="44" rx="8" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.5"/><text x="22" y="55.8" font-size="10.8" text-anchor="start" fill="#222" font-weight="bold">Expression conversion</text><text x="22" y="71.4" font-size="9.6" text-anchor="start" fill="#555" font-weight="normal">infix → postfix / prefix</text><rect x="184" y="36" width="164" height="44" rx="8" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.5"/><text x="194" y="55.8" font-size="10.8" text-anchor="start" fill="#222" font-weight="bold">Expression evaluation</text><text x="194" y="71.4" font-size="9.6" text-anchor="start" fill="#555" font-weight="normal">postfix, prefix</text><rect x="12" y="88" width="164" height="44" rx="8" fill="#FFF6D6" stroke="#B88A00" stroke-width="1.5"/><text x="22" y="107.8" font-size="10.8" text-anchor="start" fill="#222" font-weight="bold">Recursion</text><text x="22" y="123.4" font-size="9.6" text-anchor="start" fill="#555" font-weight="normal">function call stack</text><rect x="184" y="88" width="164" height="44" rx="8" fill="#FFF6D6" stroke="#B88A00" stroke-width="1.5"/><text x="194" y="107.8" font-size="10.8" text-anchor="start" fill="#222" font-weight="bold">Parenthesis matching</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="194" y="123.4" font-size="9.6" text-anchor="start" fill="#555" font-weight="normal">( [ { } ] ) balanced?</text><rect x="12" y="140" width="164" height="44" rx="8" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.5"/><text x="22" y="159.8" font-size="10.8" text-anchor="start" fill="#222" font-weight="bold">Reversing</text><text x="22" y="175.4" font-size="9.6" text-anchor="start" fill="#555" font-weight="normal">string, number, list</text><rect x="184" y="140" width="164" height="44" rx="8" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.5"/><text x="194" y="159.8" font-size="10.8" text-anchor="start" fill="#222" font-weight="bold">Undo / Redo</text><text x="194" y="175.4" font-size="9.6" text-anchor="start" fill="#555" font-weight="normal">editors, Ctrl+Z</text><rect x="12" y="192" width="164" height="44" rx="8" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.5"/><text x="22" y="211.8" font-size="10.8" text-anchor="start" fill="#222" font-weight="bold">Browser back</text><text x="22" y="227.4" font-size="9.6" text-anchor="start" fill="#555" font-weight="normal">visited pages</text><rect x="184" y="192" width="164" height="44" rx="8" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.5"/><text x="194" y="211.8" font-size="10.8" text-anchor="start" fill="#222" font-weight="bold">Backtracking</text><text x="194" y="227.4" font-size="9.6" text-anchor="start" fill="#555" font-weight="normal">maze, DFS of graph</text></svg>