"1.5"/><text x="230" y="183.8" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">E</text><text x="300" y="63.3" font-size="9.4" text-anchor="middle" fill="#7B2CD9" font-weight="bold">vertex</text><text x="84" y="143.3" font-size="9.4" text-anchor="middle" fill="#666" font-weight="bold">edge</text><rect x="12" y="212" width="336" height="115" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="230.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">G = (V, E)</text><text x="20" y="245.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">V = {A, B, C, D, E}  (5 vertices)</text><text x="20" y="260.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">E = 7 edges, e.g. (A,B), (B,D)</text><text x="20" y="275.4" font-size="9.8" text-anchor="start" fill="#C62828" font-weight="normal">Path A-B-E-C (red)</text><text x="20" y="290.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">Cycle: B-D-E-B (starts and ends at B)</text><text x="20" y="305.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">Degree(B) = 4, Degree(A) = 2</text><text x="20" y="320.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">Adjacent: A and B (joined by an edge)</text></svg>