<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 372" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="372" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Infix, Prefix and Postfix Notation</text><rect x="10" y="34" width="340" height="46" rx="8" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.5"/><text x="20" y="53.0" font-size="11.5" text-anchor="start" fill="#1565C0" font-weight="bold">Infix</text><text x="20" y="70.5" font-size="10" text-anchor="start" fill="#444" font-weight="normal">operand OP operand</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="338" y="61.9" font-size="14" text-anchor="end" fill="#222" font-weight="bold">A + B</text><rect x="10" y="88" width="340" height="46" rx="8" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.5"/><text x="20" y="107.0" font-size="11.5" text-anchor="start" fill="#E07B00" font-weight="bold">Prefix (Polish)</text><text x="20" y="124.5" font-size="10" text-anchor="start" fill="#444" font-weight="normal">OP operand operand</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="338" y="115.9" font-size="14" text-anchor="end" fill="#222" font-weight="bold">+ A B</text><rect x="10" y="142" width="340" height="46" rx="8" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.5"/><text x="20" y="161.0" font-size="11.5" text-anchor="start" fill="#2E7D32" font-weight="bold">Postfix (Reverse Polish)</text><text x="20" y="178.5" font-size="10" text-anchor="start" fill="#444" font-weight="normal">operand operand OP</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="338" y="169.9" font-size="14" text-anchor="end" fill="#222" font-weight="bold">A B +</text><text x="180" y="207.8" font-size="11" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Operator precedence (high → low)</text><rect x="30" y="218" width="300" height="22" rx="0" fill="#F5EEFD" stroke="#D9C8F0" stroke-width="1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="70" y="233.2" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">^</text><text x="170" y="232.5" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">exponent</text><text x="280" y="232.4" font-size="9.6" text-anchor="middle" fill="#555" font-weight="normal">right to left</text><rect x="30" y="242" width="300" height="22" rx="0" fill="#fff" stroke="#D9C8F0" stroke-width="1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="70" y="257.2" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">* / %</text><text x="170" y="256.5" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">multiply, divide</text><text x="280" y="256.4" font-size="9.6" text-anchor="middle" fill="#555" font-weight="normal">left to right</text><rect x="30" y="266" width="300" height="22" rx="0" fill="#F5EEFD" stroke="#D9C8F0" stroke-width="1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="70" y="281.2" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">+ -</text><text x="170" y="280.5" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">add, subtract</text><text x="280" y="280.4" font-size="9.6" text-anchor="middle" fill="#555" font-weight="normal">left to right</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="309.9" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">Example: (A + B) * C</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="327.7" font-size="10.5" text-anchor="middle" fill="#E07B00" font-weight="bold">Prefix : * + A B C</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="343.7" font-size="10.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">Postfix: A B + C *</text><text x="180" y="363.4" font-size="9.6" text-anchor="middle" fill="#555" font-weight="normal">Prefix and postfix need no brackets</text></svg>