<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 242" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="242" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Evaluating Postfix: 5 3 + 8 2 - *</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="30" y="44.9" font-size="14" text-anchor="middle" fill="#1565C0" font-weight="bold">5</text><rect x="10" y="104" width="40" height="24" rx="0" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="30" y="119.8" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">5</text><rect x="10" y="80" width="40" height="24" rx="0" fill="#fff" stroke="#7B2CD9" stroke-width="1.2"/><rect x="10" y="56" width="40" height="24" rx="0" fill="#fff" stroke="#7B2CD9" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="80" y="44.9" font-size="14" text-anchor="middle" fill="#1565C0" font-weight="bold">3</text><rect x="60" y="104" width="40" height="24" rx="0" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="80" y="119.8" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">5</text><rect x="60" y="80" width="40" height="24" rx="0" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="80" y="95.8" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">3</text><rect x="60" y="56" width="40" height="24" rx="0" fill="#fff" stroke="#7B2CD9" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="130" y="44.9" font-size="14" text-anchor="middle" fill="#C62828" font-weight="bold">+</text><rect x="110" y="104" width="40" height="24" rx="0" fill="#FFF6D6" stroke="#7B2CD9" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="130" y="119.8" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">8</text><rect x="110" y="80" width="40" height="24" rx="0" fill="#fff" stroke="#7B2CD9" stroke-width="1.2"/><rect x="110" y="56" width="40" height="24" rx="0" fill="#fff" stroke="#7B2CD9" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="44.9" font-size="14" text-anchor="middle" fill="#1565C0" font-weight="bold">8</text><rect x="160" y="104" width="40" height="24" rx="0" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="119.8" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">8</text><rect x="160" y="80" width="40" height="24" rx="0" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="95.8" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">8</text><rect x="160" y="56" width="40" height="24" rx="0" fill="#fff" stroke="#7B2CD9" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="230" y="44.9" font-size="14" text-anchor="middle" fill="#1565C0" font-weight="bold">2</text><rect x="210" y="104" width="40" height="24" rx="0" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="230" y="119.8" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">8</text><rect x="210" y="80" width="40" height="24" rx="0" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="230" y="95.8" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">8</text><rect x="210" y="56" width="40" height="24" rx="0" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="230" y="71.8" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">2</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="280" y="44.9" font-size="14" text-anchor="middle" fill="#C62828" font-weight="bold">-</text><rect x="260" y="104" width="40" height="24" rx="0" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="280" y="119.8" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">8</text><rect x="260" y="80" width="40" height="24" rx="0" fill="#FFF6D6" stroke="#7B2CD9" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="280" y="95.8" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">6</text><rect x="260" y="56" width="40" height="24" rx="0" fill="#fff" stroke="#7B2CD9" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="330" y="44.9" font-size="14" text-anchor="middle" fill="#C62828" font-weight="bold">*</text><rect x="310" y="104" width="40" height="24" rx="0" fill="#FFF6D6" stroke="#7B2CD9" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="330" y="119.8" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">48</text><rect x="310" y="80" width="40" height="24" rx="0" fill="#fff" stroke="#7B2CD9" stroke-width="1.2"/><rect x="310" y="56" width="40" height="24" rx="0" fill="#fff" stroke="#7B2CD9" stroke-width="1.2"/><rect x="10" y="138" width="340" height="92" rx="8" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.5"/><text x="20" y="157.7" font-size="10.5" text-anchor="start" fill="#1565C0" font-weight="bold">Rules (scan left to right):</text><text x="20" y="175.5" font-size="10" text-anchor="start" fill="#222" font-weight="normal">1. Operand → PUSH it on the stack</text><text x="20" y="192.5" font-size="10" text-anchor="start" fill="#222" font-weight="normal">2. Operator → POP B, POP A, PUSH (A op B)</text><text x="20" y="209.5" font-size="10" text-anchor="start" fill="#222" font-weight="normal">3. At the end, the single value left = result</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="225.7" font-size="10.5" text-anchor="start" fill="#2E7D32" font-weight="bold">(5 + 3) * (8 − 2) = 8 * 6 = 48</text></svg>