<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="340" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Hash Functions</text><rect x="12" y="36" width="336" height="92" rx="8" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><text x="22" y="57.9" font-size="11" text-anchor="start" fill="#1565C0" font-weight="bold">1. Division method</text><text x="22" y="77.4" font-size="9.6" text-anchor="start" fill="#333" font-weight="normal">h(k) = k mod m   (m: table size, prime)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="30" y="97.5" font-size="10" text-anchor="start" fill="#222" font-weight="bold">k = 1234, m = 97</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="30" y="114.5" font-size="10" text-anchor="start" fill="#222" font-weight="bold">1234 mod 97 = 70</text><rect x="12" y="136" width="336" height="92" rx="8" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="22" y="157.8" font-size="11" text-anchor="start" fill="#2E7D32" font-weight="bold">2. Mid-square method</text><text x="22" y="177.4" font-size="9.6" text-anchor="start" fill="#333" font-weight="normal">square the key, take the middle digits</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="30" y="197.5" font-size="10" text-anchor="start" fill="#222" font-weight="bold">k = 3205, k² = 10272025</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="30" y="214.5" font-size="10" text-anchor="start" fill="#222" font-weight="bold">middle 2 digits = 72  → index 72</text><rect x="12" y="236" width="336" height="92" rx="8" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.2"/><text x="22" y="257.9" font-size="11" text-anchor="start" fill="#E07B00" font-weight="bold">3. Folding method</text><text x="22" y="277.4" font-size="9.6" text-anchor="start" fill="#333" font-weight="normal">split key into parts, add, keep last digits</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="30" y="297.5" font-size="10" text-anchor="start" fill="#222" font-weight="bold">k = 12345678 → 12 + 34 + 56 + 78</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="30" y="314.5" font-size="10" text-anchor="start" fill="#222" font-weight="bold">= 180 → last 2 digits = 80</text></svg>