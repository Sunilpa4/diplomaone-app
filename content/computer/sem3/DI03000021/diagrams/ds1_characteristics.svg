<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 284" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="284" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Characteristics of an Algorithm</text><circle cx="180" cy="150" r="44" fill="#7B2CD9"/><text x="180" y="154.4" font-size="12.5" text-anchor="middle" fill="#fff" font-weight="bold">Algorithm</text><path d="M180.0 106.0 L180.0 72.0" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><rect x="122.0" y="29.0" width="116" height="42" rx="10" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.7"/><text x="180.0" y="47.0" font-size="11.5" text-anchor="middle" fill="#1565C0" font-weight="bold">Input</text><text x="180.0" y="62.4" font-size="9.6" text-anchor="middle" fill="#444" font-weight="normal">zero or more</text><path d="M221.8 136.4 L263.7 125.9" fill="none" stroke="#2E7D32" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><rect x="234.22466892282813" y="98.09830056250526" width="116" height="42" rx="10" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.7"/><text x="292.22466892282813" y="116.1" font-size="11.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">Output</text><text x="292.22466892282813" y="131.5" font-size="9.6" text-anchor="middle" fill="#444" font-weight="normal">at least one</text><path d="M205.9 185.6 L231.7 213.1" fill="none" stroke="#E07B00" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><rect x="191.35865977051185" y="209.90169943749476" width="116" height="42" rx="10" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.7"/><text x="249.35865977051185" y="227.9" font-size="11.5" text-anchor="middle" fill="#E07B00" font-weight="bold">Definiteness</text><text x="249.35865977051185" y="243.3" font-size="9.6" text-anchor="middle" fill="#444" font-weight="normal"