family="DejaVu Sans Mono, Consolas, monospace" x="180" y="247.5" font-size="10" text-anchor="middle" fill="#7B2CD9" font-weight="normal">fib(n) = fib(n−1) + fib(n−2),  fib(0)=0, fib(1)=1</text><text x="180" y="265.4" font-size="9.8" text-anchor="middle" fill="#C62828" font-weight="normal">fib(2) is computed twice: 9 calls for fib(4)</text><text x="180" y="281.4" font-size="9.8" text-anchor="middle" fill="#444" font-weight="bold">Calls grow exponentially → O(2ⁿ) time</text></svg>