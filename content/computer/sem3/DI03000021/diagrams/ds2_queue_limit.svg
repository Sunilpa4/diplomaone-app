<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="280" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Limitation of a Simple Queue</text><text x="12" y="39.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="bold">After 5 inserts and 3 deletes (MAX = 5):</text><rect x="55" y="60" width="50" height="32" rx="0" fill="#fff" stroke="#7B2CD9" stroke-width="1.4"/><rect x="105" y="60" width="50" height="32" rx="0" fill="#fff" stroke="#7B2CD9" stroke-width="1.4"/><rect x="155" y="60" width="50" height="32" rx="0" fill="#fff" stroke="#7B2CD9" stroke-width="1.4"/><rect x="205" y="60" width="50" height="32" rx="0" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.4"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="230.0" y="80.5" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">40</text><rect x="255" y="60" width="50" height="32" rx="0" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.4"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="280.0" y="80.5" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">50</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="80" y="107.4" font-size="9.6" text-anchor="middle" fill="#888" font-weight="normal">0</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="130" y="107.4" font-size="9.6" text-anchor="middle" fill="#888" font-weight="normal">1</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="107.4" font-size="9.6" text-anchor="middle" fill="#888" font-weight="normal">2</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="230" y="107.4" font-size="9.6" text-anchor="middle" fill="#888" font-weight="normal">3</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="280" y="107.4" font-size="9.6" text-anchor="middle" fill="#888" font-weight="normal">4</text><rect x="55" y="60" width="150" height="32" rx="0" fill="none" stroke="#C62828" stroke-width="2"/><text x="130" y="123.5" font-size="10" text-anchor="middle" fill="#C62828" font-weight="bold">free but unusable</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="230" y="55.3" font-size="9.4" text-anchor="middle" fill="#2E7D32" font-weight="bold">FRONT=3</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="280" y="123.3" font-size="9.4" text-anchor="middle" fill="#1565C0" font-weight="bold">REAR=4</text><rect x="12" y="136" width="336" height="70" rx="8" fill="#FDECEC" stroke="#C62828" stroke-width="1.5"/><text x="180" y="157.7" font-size="10.5" text-anchor="middle" fill="#C62828" font-weight="bold">Insert 60 → REAR = MAX − 1 → "Queue Full"</text><text x="180" y="175.5" font-size="10" text-anchor="middle" fill="#444" font-weight="normal">even though 3 places at the front are empty.</text><text x="180" y="195.5" font-size="10" text-anchor="middle" fill="#444" font-weight="normal">Memory is wasted: REAR only moves forward.</text><rect x="12" y="216" width="336" height="52" rx="8" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.5"/><text x="180" y="237.8" font-size="11" text-anchor="middle" fill="#2E7D32" font-weight="bold">Solution: CIRCULAR QUEUE</text><text x="180" y="255.5" font-size="10" text-anchor="middle" fill="#333" font-weight="normal">after the last index, REAR wraps back to 0</text></svg>