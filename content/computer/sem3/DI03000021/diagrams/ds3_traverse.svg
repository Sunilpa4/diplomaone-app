"8.8" text-anchor="start" fill="#222" font-weight="normal">ptr = START; pos = 1;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="204.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">while (ptr != NULL) {</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="217.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal"> if (ptr-&gt;data == x)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="230.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">   return pos;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="243.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal"> ptr = ptr-&gt;next;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="256.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal"> pos++;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="269.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">}</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="282.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">return -1;</text><rect x="184" y="160" width="164" height="114" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="192" y="178.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">/* count nodes */</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="192" y="191.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">ptr = START;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="192" y="204.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">count = 0;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="192" y="217.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">while (ptr != 