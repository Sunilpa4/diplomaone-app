<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 308" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="308" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Pointer: a Variable that Stores an Address</text><rect x="20" y="34" width="320" height="55" rx="7" fill="#FCFAFF" stroke="#D9C8F0" stroke-width="1.1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="28" y="52.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">int x = 10;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="28" y="67.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">int *p;      /* pointer to int */</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="28" y="82.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">p = &amp;x;      /* p gets address of x */</text><rect x="40" y="128" width="86" height="40" rx="6" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="83" y="152.9" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">10</text><text x="83" y="124.2" font-size="12" text-anchor="middle" fill="#2E7D32" font-weight="bold">x</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="83" y="185.2" font-size="9" text-anchor="middle" fill="#888" font-weight="normal">address 1000</text><rect x="226" y="128" width="86" height="40" rx="6" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="269" y="152.9" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">1000</text><text x="269" y="124.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">p</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="269" y="185.2" font-size="9" text-anchor="middle" fill="#888" font-weight="normal">address 2000</text><path d="M224 148 L128 148" fill="none" stroke="#C62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="128.0,148.0 135.0,151.5 135.0,144.5" fill="#C62828"/><text x="176" y="143.3" font-size="9.4" text-anchor="middle" fill="#C62828" font-weight="normal">points to</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="40" y="213.8" font-size="11" text-anchor="start" fill="#7B2CD9" font-weight="bold">&amp;x</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="92" y="213.8" font-size="11" text-anchor="start" fill="#222" font-weight="normal">= 1000</text><text x="168" y="213.4" font-size="9.6" text-anchor="start" fill="#555" font-weight="normal">address of x</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="40" y="232.8" font-size="11" text-anchor="start" fill="#7B2CD9" font-weight="bold">p</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="92" y="232.8" font-size="11" text-anchor="start" fill="#222" font-weight="normal">= 1000</text><text x="168" y="232.4" font-size="9.6" text-anchor="start" fill="#555" font-weight="normal">value of p</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="40" y="251.8" font-size="11" text-anchor="start" fill="#7B2CD9" font-weight="bold">*p</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="92" y="251.8" font-size="11" text-anchor="start" fill="#222" font-weight="normal">= 10</text><text x="168" y="251.4" font-size="9.6" text-anchor="start" fill="#555" font-weight="normal">value at address in p</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="40" y="270.9" font-size="11" text-anchor="start" fill="#7B2CD9" font-weight="bold">&amp;p</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="92" y="270.9" font-size="11" text-anchor="start" fill="#222" font-weight="normal">= 2000</text><text x="168" y="270.4" font-size="9.6" text-anchor="start" fill="#555" font-weight="normal">address of p</text><text x="180" y="299.4" font-size="9.6" text-anchor="middle" fill="#444" font-weight="normal">&amp; = address-of operator,  * = value-at (indirection)</text></svg>