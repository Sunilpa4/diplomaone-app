Mono, Consolas, monospace" x="247" y="115.4" font-size="9.6" text-anchor="middle" fill="#888" font-weight="normal">4</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="293" y="115.4" font-size="9.6" text-anchor="middle" fill="#888" font-weight="normal">5</text><path d="M109 44 L109 63" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="109.0,63.0 112.5,56.0 105.5,56.0" fill="#2E7D32"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="109" y="39.4" font-size="9.6" text-anchor="middle" fill="#2E7D32" font-weight="bold">FRONT=1</text><path d="M201 44 L201 63" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="201.0,63.0 204.5,56.0 197.5,56.0" fill="#1565C0"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="201" y="39.4" font-size="9.6" text-anchor="middle" fill="#1565C0" font-weight="bold">REAR=3</text><text x="20" y="87.4" font-size="9.6" text-anchor="middle" fill="#2E7D32" font-weight="bold">delete</text><path d="M40 92 L14 92" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="14.0,92.0 21.0,95.5 21.0,88.5" fill="#2E7D32"/><text x="342" y="87.4" font-size="9.6" text-anchor="middle" fill="#1565C0" font-weight="bold">insert</text><path d="M318 92 L346 92" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="346.0,92.0 339.0,88.5 339.0,95.5" fill="#1565C0"/><rect x="12" y="128" width="336" height="112" rx="8" fill="#FCFAFF" stroke="#D9C8F0" stroke-width="1"/><text x="22" y="147.7" font-size="10.5" text-anchor="start" fill="#1565C0" font-weight="bold">Insert (enqueue)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="159.3" font-size="9.4" text-anchor="start" fill="#333" font-weight="normal">at REAR:  REAR++, Q[REAR] = item</text><text x="22" y="172.7" font-size="10.5" text-anchor="start" fill="#2E7D32" font-weight="bold">Delete (dequeue)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="184.3" font-size="9.4" text-anchor="start" fill="#333" font-weight="normal">from FRONT: item = Q[FRONT], FRONT++</text><text x="22" y="197.7" font-size="10.5" text-anchor="start" fill="#E07B00" font-weight="bold">Empty</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="209.3" font-size="9.4" text-anchor="start" fill="#333" font-weight="normal">FRONT = -1  or  FRONT &gt; REAR</text><text x="22" y="222.7" font-size="10.5" text-anchor="start" fill="#C62828" font-weight="bold">Full</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="234.3" font-size="9.4" text-anchor="start" fill="#333" font-weight="normal">REAR = MAX - 1</text><text x="180" y="261.5" font-size="10" text-anchor="middle" fill="#444" font-weight="normal">First In, First Out: like a ticket counter line</text></svg>