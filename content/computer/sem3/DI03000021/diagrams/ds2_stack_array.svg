<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 290" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="290" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Stack: Array Representation (LIFO)</text><rect x="60" y="190" width="70" height="30" rx="0" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.4"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="95.0" y="209.2" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">10</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="54" y="208.2" font-size="9" text-anchor="end" fill="#888" font-weight="normal">0</text><rect x="60" y="160" width="70" height="30" rx="0" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.4"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="95.0" y="179.2" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">20</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="54" y="178.2" font-size="9" text-anchor="end" fill="#888" font-weight="normal">1</text><rect x="60" y="130" width="70" height="30" rx="0" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.4"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="95.0" y="149.2" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">30</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="54" y="148.2" font-size="9" text-anchor="end" fill="#888" font-weight="normal">2</text><rect x="60" y="100" width="70" height="30" rx="0" fill="#fff" stroke="#7B2CD9" stroke-width="1.4"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="54" y="118.2" font-size="9" text-anchor="end" fill="#888" font-weight="normal">3</text><rect x="60" y="70" width="70" height="30" rx="0" fill="#fff" stroke="#7B2CD9" stroke-width="1.4"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="54" y="88.2" font-size="9" text-anchor="end" fill="#888" font-weight="normal">4</text><rect x="60" y="40" width="70" height="30" rx="0" fill="#fff" stroke="#7B2CD9" stroke-width="1.4"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="54" y="58.1" font-size="9" text-anchor="end" fill="#888" font-weight="normal">5</text><path d="M156 145.0 L134 145.0" fill="none" stroke="#C62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="134.0,145.0 141.0,148.5 141.0,141.5" fill="#C62828"/><text x="158" y="148.4" font-size="9.6" text-anchor="start" fill="#C62828" font-weight="bold">TOP</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="95" y="239.5" font-size="10" text-anchor="middle" fill="#7B2CD9" font-weight="bold">int stack[MAX];  MAX = 6</text><rect x="190" y="44" width="160" height="168" rx="8" fill="#FCFAFF" stroke="#D9C8F0" stroke-width="1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="200" y="67.8" font-size="11" text-anchor="start" fill="#7B2CD9" font-weight="bold">TOP</text><text x="200" y="81.4" font-size="9.6" text-anchor="start" fill="#444" font-weight="normal">index of the top element</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="200" y="98.8" font-size="11" text-anchor="start" fill="#2E7D32" font-weight="bold">TOP = -1</text><text x="200" y="112.4" font-size="9.6" text-anchor="start" fill="#444" font-weight="normal">stack is EMPTY</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="200" y="129.8" font-size="11" text-anchor="start" fill="#C62828" font-weight="bold">TOP = MAX-1</text><text x="200" y="143.4" font-size="9.6" text-anchor="start" fill="#444" font-weight="normal">stack is FULL</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="200" y="160.8" font-size="11" text-anchor="start" fill="#1565C0" font-weight="bold">PUSH</text><text x="200" y="174.4" font-size="9.6" text-anchor="start" fill="#444" font-weight="normal">TOP++, then store</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="200" y="191.8" font-size="11" text-anchor="start" fill="#E07B00" font-weight="bold">POP</text><text x="200" y="205.4" font-size="9.6" text-anchor="start" fill="#444" font-weight="normal">read, then TOP--</text><text x="180" y="265.5" font-size="10" text-anchor="middle" fill="#444" font-weight="normal">Last In, First Out: 30 was pushed last,</text><text x="180" y="280.5" font-size="10" text-anchor="middle" fill="#444" font-weight="normal">so 30 is the first to be popped.</text></svg>