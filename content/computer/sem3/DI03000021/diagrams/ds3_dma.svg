<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 338" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="338" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Dynamic Memory Allocation (stdlib.h)</text><rect x="12" y="34" width="336" height="28" rx="6" fill="#fff" stroke="#2E7D32" stroke-width="1.3"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="51.9" font-size="11" text-anchor="start" fill="#2E7D32" font-weight="bold">malloc(size)</text><text x="176" y="51.4" font-size="9.8" text-anchor="start" fill="#333" font-weight="normal">one block, garbage values</text><rect x="12" y="68" width="336" height="28" rx="6" fill="#fff" stroke="#1565C0" stroke-width="1.3"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="85.8" font-size="11" text-anchor="start" fill="#1565C0" font-weight="bold">calloc(n, size)</text><text x="176" y="85.4" font-size="9.8" text-anchor="start" fill="#333" font-weight="normal">n blocks, all set to 0</text><rect x="12" y="102" width="336" height="28" rx="6" fill="#fff" stroke="#E07B00" stroke-width="1.3"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="119.8" font-size="11" text-anchor="start" fill="#E07B00" font-weight="bold">realloc(ptr, size)</text><text x="176" y="119.4" font-size="9.8" text-anchor="start" fill="#333" font-weight="normal">resize an old block</text><rect x="12" y="136" width="336" height="28" rx="6" fill="#fff" stroke="#C62828" stroke-width="1.3"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="153.8" font-size="11" text-anchor="start" fill="#C62828" font-weight="bold">free(ptr)</text><text x="176" y="153.4" font-size="9.8" text-anchor="start" fill="#333" font-weight="normal">release the memory</text><rect x="12" y="176" width="336" height="80" rx="7" fill="#FCFAFF" stroke="#D9C8F0" stroke-width="1.1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="194.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">int *a;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="208.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">a = (int *) malloc(5 * sizeof(int));</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="222.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">if (a == NULL)  /* no memory */</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="236.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">...</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="250.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">free(a);</text><text x="60" y="277.4" font-size="9.6" text-anchor="middle" fill="#7B2CD9" font-weight="bold">stack</text><rect x="32" y="282" width="56" height="24" rx="0" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="60" y="297.9" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">a</text><path d="M90 294 L148 294" fill="none" stroke="#C62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="148.0,294.0 141.0,290.5 141.0,297.5" fill="#C62828"/><text x="240" y="277.4" font-size="9.6" text-anchor="middle" fill="#7B2CD9" font-weight="bold">heap: 5 ints (20 bytes)</text><rect x="150" y="282" width="36" height="24" rx="0" fill="#fff" stroke="#7B2CD9" stroke-width="1.4"/><rect x="186" y="282" width="36" height="24" rx="0" fill="#fff" stroke="#7B2CD9" stroke-width="1.4"/><rect x="222" y="282" width="36" height="24" rx="0" fill="#fff" stroke="#7B2CD9" stroke-width="1.4"/><rect x="258" y="282" width="36" height="24" rx="0" fill="#fff" stroke="#7B2CD9" stroke-width="1.4"/><rect x="294" y="282" width="36" height="24" rx="0" fill="#fff" stroke="#7B2CD9" stroke-width="1.4"/><text x="180" y="329.4" font-size="9.6" text-anchor="middle" fill="#444" font-weight="normal">Memory is taken at run time, as much as needed</text></svg>