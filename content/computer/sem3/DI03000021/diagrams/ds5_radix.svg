<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 362" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="362" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Radix Sort (LSD, base 10)</text><text x="14" y="49.5" font-size="10" text-anchor="start" fill="#222" font-weight="bold">Input:</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="70" y="49.6" font-size="10.4" text-anchor="start" fill="#222" font-weight="normal">170 45 75 90 802 24 2 66</text><rect x="12" y="62" width="336" height="66" rx="8" fill="#FCFAFF" stroke="#D9C8F0" stroke-width="1"/><text x="22" y="80.5" font-size="10" text-anchor="start" fill="#7B2CD9" font-weight="bold">Pass 1: units digit</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="99.2" font-size="9" text-anchor="start" fill="#1565C0" font-weight="normal">0:170,90   2:802,2   4:24   5:45,75   6:66</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="119.5" font-size="10" text-anchor="start" fill="#222" font-weight="bold">→ 170 90 802 2 24 45 75 66</text><rect x="12" y="136" width="336" height="66" rx="8" fill="#FCFAFF" stroke="#D9C8F0" stroke-width="1"/><text x="22" y="154.5" font-size="10" text-anchor="start" fill="#7B2CD9" font-weight="bold">Pass 2: tens digit</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="173.2" font-size="9" text-anchor="start" fill="#1565C0" font-weight="normal">0:802,2   2:24   4:45   6:66   7:170,75   9:90</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="193.5" font-size="10" text-anchor="start" fill="#222" font-weight="bold">→ 802 2 24 45 66 170 75 90</text><rect x="12" y="210" width="336" height="66" rx="8" fill="#FCFAFF" stroke="#D9C8F0" stroke-width="1"/><text x="22" y="228.5" font-size="10" text-anchor="start" fill="#7B2CD9" font-weight="bold">Pass 3: hundreds digit</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="247.2" font-size="9" text-anchor="start" fill="#1565C0" font-weight="normal">0:2,24,45,66,75,90   1:170   8:802</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="267.5" font-size="10" text-anchor="start" fill="#222" font-weight="bold">→ 2 24 45 66 75 90 170 802</text><rect x="12" y="284" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="302.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Distribute numbers into buckets 0-9 by one digit,</text><text x="20" y="317.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">collect in order, repeat for the next digit.</text><text x="20" y="332.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Passes = digits in the largest number (802 → 3).</text><text x="20" y="347.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">No comparisons: O(d × n).</text></svg>