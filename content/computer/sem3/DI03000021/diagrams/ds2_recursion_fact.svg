<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 296" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="296" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Recursion: Call Stack for fact(4)</text><rect x="14" y="40" width="150" height="34" rx="6" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="54.9" font-size="11" text-anchor="start" fill="#222" font-weight="bold">fact(4)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="68.3" font-size="9.4" text-anchor="start" fill="#555" font-weight="normal">4 * fact(3)</text><path d="M44 74 L54 84" fill="none" stroke="#E07B00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="54.0,84.0 51.5,76.6 46.6,81.5" fill="#E07B00"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="330" y="60.7" font-size="10.5" text-anchor="end" fill="#2E7D32" font-weight="bold">4 * 6 = 24</text><path d="M250 101 L250 61" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="250.0,61.0 246.5,68.0 253.5,68.0" fill="#2E7D32"/><rect x="32" y="84" width="132" height="34" rx="6" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="40" y="98.8" font-size="11" text-anchor="start" fill="#222" font-weight="bold">fact(3)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="40" y="112.3" font-size="9.4" text-anchor="start" fill="#555" font-weight="normal">3 * fact(2)</text><path d="M62 118 L72 128" fill="none" stroke="#E07B00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="72.0,128.0 69.5,120.6 64.6,125.5" fill="#E07B00"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="330" y="104.7" font-size="10.5" text-anchor="end" fill="#2E7D32" font-weight="bold">3 * 2 = 6</text><path d="M250 145 L250 105" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="250.0,105.0 246.5,112.0 253.5,112.0" fill="#2E7D32"/><rect x="50" y="128" width="114" height="34" rx="6" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="58" y="142.8" font-size="11" text-anchor="start" fill="#222" font-weight="bold">fact(2)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="58" y="156.3" font-size="9.4" text-anchor="start" fill="#555" font-weight="normal">2 * fact(1)</text><path d="M80 162 L90 172" fill="none" stroke="#E07B00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="90.0,172.0 87.5,164.6 82.6,169.5" fill="#E07B00"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="330" y="148.7" font-size="10.5" text-anchor="end" fill="#2E7D32" font-weight="bold">2 * 1 = 2</text><path d="M250 189 L250 149" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="250.0,149.0 246.5,156.0 253.5,156.0" fill="#2E7D32"/><rect x="68" y="172" width="96" height="34" rx="6" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="76" y="186.8" font-size="11" text-anchor="start" fill="#222" font-weight="bold">fact(1)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="76" y="200.3" font-size="9.4" text-anchor="start" fill="#555" font-weight="normal">base case n&lt;=1</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="330" y="192.7" font-size="10.5" text-anchor="end" fill="#2E7D32" font-weight="bold">returns 1</text><text x="82" y="229.4" font-size="9.6" text-anchor="middle" fill="#E07B00" font-weight="bold">winding (calls go down)</text><text x="285" y="229.4" font-size="9.6" text-anchor="middle" fill="#2E7D32" font-weight="bold">unwinding (returns go up)</text><rect x="10" y="238" width="340" height="46" rx="8" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.5"/><text x="180" y="257.5" font-size="10" text-anchor="middle" fill="#1565C0" font-weight="normal">Each call is PUSHED on the system stack;</text><text x="180" y="273.5" font-size="10" text-anchor="middle" fill="#1565C0" font-weight="normal">it is POPPED when the call returns.</text></svg>