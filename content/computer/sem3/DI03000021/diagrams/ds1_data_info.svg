<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 252" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="252" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Data, Processing and Information</text><rect x="10" y="40" width="100" height="120" rx="8" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.5"/><text x="60" y="60.4" font-size="12.5" text-anchor="middle" fill="#1565C0" font-weight="bold">DATA</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="60" y="83.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="normal">Ravi  67</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="60" y="101.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="normal">Meena 82</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="60" y="119.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="normal">Amit  45</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="60" y="137.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="normal">Sara  91</text><rect x="130" y="72" width="100" height="56" rx="8" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.5"/><text x="180" y="95.8" font-size="11" text-anchor="middle" fill="#E07B00" font-weight="bold">PROCESSING</text><text x="180" y="113.4" font-size="9.6" text-anchor="middle" fill="#444" font-weight="normal">sort, average,</text><text x="180" y="125.4" font-size="9.6" text-anchor="middle" fill="#444" font-weight="normal">compare</text><path d="M110 100 L128 100" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="128.0,100.0 121.0,96.5 121.0,103.5" fill="#222"/><path d="M230 100 L248 100" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="248.0,100.0 241.0,96.5 241.0,103.5" fill="#222"/><rect x="250" y="40" width="100" height="120" rx="8" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.5"/><text x="300" y="59.9" font-size="11" text-anchor="middle" fill="#2E7D32" font-weight="bold">INFORMATION</text><text x="300" y="83.4" font-size="9.8" text-anchor="middle" fill="#222" font-weight="normal">Topper: Sara</text><text x="300" y="101.4" font-size="9.8" text-anchor="middle" fill="#222" font-weight="normal">Average: 71.25</text><text x="300" y="119.4" font-size="9.8" text-anchor="middle" fill="#222" font-weight="normal">Passed: 4</text><text x="300" y="137.4" font-size="9.8" text-anchor="middle" fill="#222" font-weight="normal">Highest: 91</text><text x="180" y="185.5" font-size="10" text-anchor="middle" fill="#444" font-weight="normal">Raw facts (data) have no meaning by themselves.</text><text x="180" y="201.5" font-size="10" text-anchor="middle" fill="#444" font-weight="bold">Processed, meaningful data = information.</text><text x="180" y="225.5" font-size="10" text-anchor="middle" fill="#7B2CD9" font-weight="normal">A data structure decides HOW the data is stored</text><text x="180" y="240.5" font-size="10" text-anchor="middle" fill="#7B2CD9" font-weight="normal">so that processing becomes fast and easy.</text></svg>