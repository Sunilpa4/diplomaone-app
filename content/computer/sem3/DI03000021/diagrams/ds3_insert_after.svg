" stroke-linecap="round" stroke-linejoin="round"/><polygon points="217.0,103.0 213.5,110.0 220.5,110.0" fill="#2E7D32"/><path d="M160 80 L172 96" fill="none" stroke="#C62828" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="12" y="168" width="336" height="40" rx="7" fill="#FCFAFF" stroke="#D9C8F0" stroke-width="1.1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="186.4" font-size="9.8" text-anchor="start" fill="#2E7D32" font-weight="normal">new-&gt;next = ptr-&gt;next;  /* 1 */</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="201.4" font-size="9.8" text-anchor="start" fill="#C62828" font-weight="normal">ptr-&gt;next = new;        /* 2 */</text><rect x="12" y="218" width="336" height="85" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="236.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Insert BEFORE node X:</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="251.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">keep two pointers prev and ptr;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="266.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">move till ptr-&gt;data == X,</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="281.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">then insert new after prev</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="296.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">(if X is the first node: insert at beginning)</text></svg>