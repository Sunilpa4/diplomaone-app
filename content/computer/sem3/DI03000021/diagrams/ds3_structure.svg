<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 296" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="296" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Structure and Structure Pointer</text><rect x="12" y="32" width="160" height="122" rx="7" fill="#FCFAFF" stroke="#D9C8F0" stroke-width="1.1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="50.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">struct student {</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="64.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">  int roll;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="78.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">  char name[10];</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="92.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">  float marks;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="106.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">};</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="120.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">struct student s;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="134.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">struct student *ptr;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="148.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">ptr = &amp;s;</text><text x="268" y="39.4" font-size="9.6" text-anchor="middle" fill="#7B2CD9" font-weight="bold">variable s in memory</text><rect x="196" y="44" width="80" height="34" rx="0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.3"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="236" y="64.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="bold">roll</text><text x="282" y="64.1" font-size="8.8" text-anchor="start" fill="#666" font-weight="normal">4 bytes</text><rect x="196" y="78" width="80" height="56" rx="0" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.3"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="236" y="109.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="bold">name</text><text x="282" y="109.1" font-size="8.8" text-anchor="start" fill="#666" font-weight="normal">10 bytes</text><rect x="196" y="134" width="80" height="34" rx="0" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.3"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="236" y="154.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="bold">marks</text><text x="282" y="154.1" font-size="8.8" text-anchor="start" fill="#666" font-weight="normal">4 bytes</text><text x="240" y="185.1" font-size="8.8" text-anchor="middle" fill="#888" font-weight="normal">size ≥ 18 bytes (padding)</text><rect x="12" y="172" width="336" height="92" rx="8" fill="#fff" stroke="#D9C8F0" stroke-width="1"/><text x="180" y="191.6" font-size="10.4" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Accessing members</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="211.8" font-size="11" text-anchor="start" fill="#1565C0" font-weight="bold">s.roll</text><text x="122" y="211.3" font-size="9.4" text-anchor="start" fill="#444" font-weight="normal">dot operator: with a structure variable</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="230.8" font-size="11" text-anchor="start" fill="#1565C0" font-weight="bold">ptr-&gt;roll</text><text x="122" y="230.3" font-size="9.4" text-anchor="start" fill="#444" font-weight="normal">arrow operator: with a pointer</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="249.8" font-size="11" text-anchor="start" fill="#1565C0" font-weight="bold">(*ptr).roll</text><text x="122" y="249.3" font-size="9.4" text-anchor="start" fill="#444" font-weight="normal">same as ptr-&gt;roll</text><text x="180" y="287.4" font-size="9.8" text-anchor="middle" fill="#444" font-weight="normal">A linked-list node is a self-referential structure</text></svg>