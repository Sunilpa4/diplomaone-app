ormal">key smaller → search left half (high = mid-1)</text><text x="20" y="400.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">key larger → search right half (low = mid+1)</text><text x="20" y="415.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Data must be sorted. O(log n): 10 items ≤ 4 steps.</text></svg>