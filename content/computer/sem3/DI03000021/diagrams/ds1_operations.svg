<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 242" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="242" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Operations on Data Structures</text><rect x="12" y="36" width="164" height="48" rx="8" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.5"/><circle cx="29" cy="60" r="10" fill="#1565C0"/><text x="29" y="63.7" font-size="10.5" text-anchor="middle" fill="#fff" font-weight="bold">1</text><text x="46" y="57.0" font-size="11.5" text-anchor="start" fill="#222" font-weight="bold">Traversing</text><text x="46" y="72.4" font-size="9.6" text-anchor="start" fill="#555" font-weight="normal">visit every element once</text><rect x="184" y="36" width="164" height="48" rx="8" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.5"/><circle cx="201" cy="60" r="10" fill="#2E7D32"/><text x="201" y="63.7" font-size="10.5" text-anchor="middle" fill="#fff" font-weight="bold">2</text><text x="218" y="57.0" font-size="11.5" text-anchor="start" fill="#222" font-weight="bold">Searching</text><text x="218" y="72.4" font-size="9.6" text-anchor="start" fill="#555" font-weight="normal">find location of a value</text><rect x="12" y="92" width="164" height="48" rx="8" fill="#FFF6D6" stroke="#B88A00" stroke-width="1.5"/><circle cx="29" cy="116" r="10" fill="#B88A00"/><text x="29" y="119.7" font-size="10.5" text-anchor="middle" fill="#fff" font-weight="bold">3</text><text x="46" y="113.0" font-size="11.5" text-anchor="start" fill="#222" font-weight="bold">Insertion</text><text x="46" y="128.4" font-size="9.6" text-anchor="start" fill="#555" font-weight="normal">add a new element</text><rect x="184" y="92" width="164" height="48" rx="8" fill="#FDECEC" stroke="#C62828" stroke-width="1.5"/><circle cx="201" cy="116" r="10" fill="#C62828"/><text x="201" y="119.7" font-size="10.5" text-anchor="middle" fill="#fff" font-weight="bold">4</text><text x="218" y="113.0" font-size="11.5" text-anchor="start" fill="#222" font-weight="bold">Deletion</text><text x="218" y="128.4" font-size="9.6" text-anchor="start" fill="#555" font-weight="normal">remove an element</text><rect x="12" y="148" width="164" height="48" rx="8" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.5"/><circle cx="29" cy="172" r="10" fill="#E07B00"/><text x="29" y="175.7" font-size="10.5" text-anchor="middle" fill="#fff" font-weight="bold">5</text><text x="46" y="169.0" font-size="11.5" text-anchor="start" fill="#222" font-weight="bold">Sorting</text><text x="46" y="184.4" font-size="9.6" text-anchor="start" fill="#555" font-weight="normal">arrange in an order</text><rect x="184" y="148" width="164" height="48" rx="8" fill="#E0F2F1" stroke="#00796B" stroke-width="1.5"/><circle cx="201" cy="172" r="10" fill="#00796B"/><text x="201" y="175.7" font-size="10.5" text-anchor="middle" fill="#fff" font-weight="bold">6</text><text x="218" y="169.0" font-size="11.5" text-anchor="start" fill="#222" font-weight="bold">Merging</text><text x="218" y="184.4" font-size="9.6" text-anchor="start" fill="#555" font-weight="normal">combine two structures</text><text x="180" y="217.5" font-size="10" text-anchor="middle" fill="#7B2CD9" font-weight="normal">The choice of data structure decides how fast</text><text x="180" y="232.5" font-size="10" text-anchor="middle" fill="#7B2CD9" font-weight="normal">each of these operations can be done.</text></svg>