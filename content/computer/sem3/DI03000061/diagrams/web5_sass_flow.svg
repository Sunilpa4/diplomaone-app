<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 282" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="282" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Sass Customization Workflow</text><rect x="10" y="46" width="160" height="84" rx="7" fill="#FFF6D6" stroke="#333" stroke-width="1.4"/><text x="90" y="65.3" font-size="9.5" text-anchor="middle" fill="#222" font-weight="bold">my-project/</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="80.7" font-size="7.8" text-anchor="start" fill="#222" font-weight="normal">scss/_custom.scss</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="93.7" font-size="7.8" text-anchor="start" fill="#222" font-weight="normal">  $primary: #198754;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="106.7" font-size="7.8" text-anchor="start" fill="#222" font-weight="normal">  $border-radius: 0.75rem;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="119.7" font-size="7.8" text-anchor="start" fill="#222" font-weight="normal">  @import "bootstrap";</text><rect x="200" y="46" width="150" height="52" rx="7" fill="#0D6EFD" stroke="#0D6EFD" stroke-width="0"/><text x="275" y="69.5" font-size="10" text-anchor="middle" fill="#fff" font-weight="bold">dart-sass</text><text x="275" y="82.7" font-size="7.8" text-anchor="middle" fill="#fff" font-weight="normal">compiler (npm build)</text><text x="275" y="94.7" font-size="7.8" text-anchor="middle" fill="#fff" font-weight="normal">scss -&gt; css</text><path d="M172 72 L192 72" fill="none" stroke="#666" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="198.0,72.0 191.0,68.5 191.0,75.5" fill="#666"/><rect x="200" y="112" width="150" height="40" rx="7" fill="#198754" stroke="#198754" stroke-width="0"/><text x="275" y="131.3" font-size="9.5" text-anchor="middle" fill="#fff" font-weight="bold">css/custom.css</text><text x="275" y="144.5" font-size="7.2" text-anchor="middle" fill="#fff" font-weight="normal">Bootstrap with your defaults</text><path d="M275 98 L275 112" fill="none" stroke="#198754" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="275,112 270,104 280,104" fill="#198754"/><rect x="10" y="158" width="340" height="34" rx="7" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="175.0" font-size="8.6" text-anchor="start" fill="#222" font-weight="normal">&lt;link href="css/custom.css" rel="stylesheet"&gt;</text><text x="22" y="188.8" font-size="8" text-anchor="start" fill="#666" font-weight="normal">instead of bootstrap.css</text><text x="180" y="221.2" font-size="9" text-anchor="middle" fill="#666" font-weight="normal">Rebuild whenever variables change.</text><rect x="12" y="232" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="250.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">Dart Sass is the official compiler;</text><text x="20" y="265.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">many editors rebuild on save (VS Code,</text><text x="20" y="280.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">npm scripts). Only the final CSS ships.</text></svg>