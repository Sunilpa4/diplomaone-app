<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 352" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="352" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Offset and Reordering</text><text x="14" y="49.4" font-size="9.8" text-anchor="start" fill="#7B2CD9" font-weight="bold">Offset: col-4 offset-4</text><rect x="14" y="54" width="25" height="10" rx="1" fill="#F4F4F4" stroke="#DDD" stroke-width="0.6"/><rect x="41" y="54" width="25" height="10" rx="1" fill="#F4F4F4" stroke="#DDD" stroke-width="0.6"/><rect x="68" y="54" width="25" height="10" rx="1" fill="#F4F4F4" stroke="#DDD" stroke-width="0.6"/><rect x="95" y="54" width="25" height="10" rx="1" fill="#F4F4F4" stroke="#DDD" stroke-width="0.6"/><rect x="122" y="54" width="25" height="10" rx="1" fill="#F4F4F4" stroke="#DDD" stroke-width="0.6"/><rect x="149" y="54" width="25" height="10" rx="1" fill="#F4F4F4" stroke="#DDD" stroke-width="0.6"/><rect x="176" y="54" width="25" height="10" rx="1" fill="#F4F4F4" stroke="#DDD" stroke-width="0.6"/><rect x="203" y="54" width="25" height="10" rx="1" fill="#F4F4F4" stroke="#DDD" stroke-width="0.6"/><rect x="230" y="54" width="25" height="10" rx="1" fill="#F4F4F4" stroke="#DDD" stroke-width="0.6"/><rect x="257" y="54" width="25" height="10" rx="1" fill="#F4F4F4" stroke="#DDD" stroke-width="0.6"/><rect x="284" y="54" width="25" height="10" rx="1" fill="#F4F4F4" stroke="#DDD" stroke-width="0.6"/><rect x="311" y="54" width="25" height="10" rx="1" fill="#F4F4F4" stroke="#DDD" stroke-width="0.6"/><rect x="14" y="68" width="106" height="26" rx="3" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="68" y="88.2" font-size="9" text-anchor="middle" fill="#7B2CD9" font-weight="normal">col-4</text><rect x="122" y="68" width="106" height="26" rx="3" fill="#fff" stroke="#666" stroke-width="1"/><text x="176" y="88.0" font-size="8.6" text-anchor="middle" fill="#666" font-weight="normal">offset (empty)</text><rect x="230" y="68" width="106" height="26" rx="3" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="284" y="88.2" font-size="9" text-anchor="middle" fill="#7B2CD9" font-weight="normal">col-4</text><rect x="95" y="100" width="160" height="24" rx="3" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="176" y="119.1" font-size="8.8" text-anchor="middle" fill="#2E7D32" font-weight="normal">col-6 offset-3 = centred</text><text x="14" y="153.4" font-size="9.8" text-anchor="start" fill="#7B2CD9" font-weight="bold">Reordering: same HTML, different order</text><rect x="14" y="160" width="120" height="22" rx="3" fill="#fff" stroke="#666" stroke-width="1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="178.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">HTML: A  B  C</text><text x="60" y="203.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="bold">Phone</text><rect x="14" y="208" width="92" height="22" rx="3" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.1"/><text x="60" y="226.1" font-size="8.8" text-anchor="middle" fill="#E07B00" font-weight="normal">C order-first</text><rect x="14" y="234" width="92" height="22" rx="3" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="60" y="252.1" font-size="8.8" text-anchor="middle" fill="#1565C0" font-weight="normal">A</text><rect x="14" y="260" width="92" height="22" rx="3" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.1"/><text x="60" y="278.1" font-size="8.8" text-anchor="middle" fill="#2E7D32" font-weight="normal">B</text><text x="240" y="203.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="bold">Desktop (md and up)</text><rect x="128" y="208" width="70" height="48" rx="3" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="163" y="231.0" font-size="8.6" text-anchor="middle" fill="#1565C0" font-weight="normal">A</text><rect x="202" y="208" width="70" height="48" rx="3" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.1"/><text x="237" y="231.0" font-size="8.6" text-anchor="middle" fill="#E07B00" font-weight="normal">C</text><rect x="276" y="208" width="70" height="48" rx="3" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.1"/><text x="311" y="231.0" font-size="8.6" text-anchor="middle" fill="#2E7D32" font-weight="normal">B</text><text x="311" y="243.0" font-size="8.6" text-anchor="middle" fill="#2E7D32" font-weight="normal">order-md-last</text><rect x="12" y="292" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="310.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">order-0 ... order-5, order-first (-1), order-last (6).</text><text x="20" y="325.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">Lower order comes first. Uses flexbox 'order'.</text><text x="20" y="340.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">BS3: col-md-offset-*, col-md-push-*, col-md-pull-*.</text></svg>