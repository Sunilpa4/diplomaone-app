<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 366" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="366" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">The Viewport Meta Tag</text><text x="90" y="49.4" font-size="9.8" text-anchor="middle" fill="#C62828" font-weight="bold">Without viewport tag</text><rect x="44" y="54" width="92" height="150" rx="10" fill="#fff" stroke="#222" stroke-width="1.6"/><rect x="50" y="66" width="80" height="38" rx="2" fill="#FDECEC" stroke="#C62828" stroke-width="1"/><rect x="52" y="70" width="24" height="30" rx="1" fill="#fff" stroke="#C62828" stroke-width="0.8"/><rect x="78" y="70" width="24" height="30" rx="1" fill="#fff" stroke="#C62828" stroke-width="0.8"/><rect x="104" y="70" width="24" height="30" rx="1" fill="#fff" stroke="#C62828" stroke-width="0.8"/><text x="90" y="122.9" font-size="8.4" text-anchor="middle" fill="#666" font-weight="normal">tiny desktop page,</text><text x="90" y="134.9" font-size="8.4" text-anchor="middle" fill="#666" font-weight="normal">user must zoom</text><text x="90" y="223.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">renders at ~980 px</text><text x="90" y="235.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">and shrinks it</text><text x="270" y="49.4" font-size="9.8" text-anchor="middle" fill="#2E7D32" font-weight="bold">With viewport tag</text><rect x="224" y="54" width="92" height="150" rx="10" fill="#fff" stroke="#222" stroke-width="1.6"/><rect x="232" y="66" width="76" height="28" rx="3" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1"/><text x="270" y="87.2" font-size="9" text-anchor="middle" fill="#2E7D32" font-weight="normal">Column 1</text><rect x="232" y="100" width="76" height="28" rx="3" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1"/><text x="270" y="121.2" font-size="9" text-anchor="middle" fill="#2E7D32" font-weight="normal">Column 2</text><rect x="232" y="134" width="76" height="28" rx="3" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1"/><text x="270" y="155.2" font-size="9" text-anchor="middle" fill="#2E7D32" font-weight="normal">Column 3</text><text x="270" y="223.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">uses real device width,</text><text x="270" y="235.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">columns stack</text><rect x="12" y="244" width="336" height="38" rx="6" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="261.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">&lt;meta name="viewport"</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="274.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">  content="width=device-width, initial-scale=1"&gt;</text><rect x="12" y="292" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="310.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">width=device-width: page width = screen width.</text><text x="20" y="325.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">initial-scale=1: no zoom when the page opens.</text><text x="20" y="340.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">Remove responsiveness: delete this tag, give</text><text x="20" y="355.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">.container a fixed width, use col-4 (no -md).</text></svg>