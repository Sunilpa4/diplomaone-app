<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 370" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="370" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Colour Modes and Themes</text><rect x="10" y="46" width="340" height="34" rx="7" fill="#666" stroke="#666" stroke-width="0"/><text x="180" y="63.0" font-size="8.6" text-anchor="middle" fill="#fff" font-weight="normal">&lt;html data-bs-theme="light"&gt;  ... or on one section</text><text x="180" y="76.8" font-size="8" text-anchor="middle" fill="#fff" font-weight="normal">built-in modes: light, dark</text><rect x="10" y="90" width="160" height="96" rx="7" fill="#fff" stroke="#bbb" stroke-width="1.2"/><text x="90" y="109.3" font-size="9.5" text-anchor="middle" fill="#222" font-weight="bold">light</text><rect x="24" y="114" width="40" height="14" rx="3" fill="#0D6EFD" stroke="#0D6EFD" stroke-width="0"/><text x="44" y="126.2" font-size="6.4" text-anchor="middle" fill="#fff" font-weight="normal">badge</text><rect x="24" y="134" width="50" height="14" rx="3" fill="#fff" stroke="#0D6EFD" stroke-width="1.2"/><text x="49" y="145.4" font-size="6.8" text-anchor="middle" fill="#222" font-weight="normal">card</text><rect x="24" y="154" width="34" height="14" rx="3" fill="#0D6EFD" stroke="#0D6EFD" stroke-width="0"/><text x="41" y="166.4" font-size="6.8" text-anchor="middle" fill="#fff" font-weight="normal">Open</text><rect x="190" y="90" width="160" height="96" rx="7" fill="#212529" stroke="#555" stroke-width="1.2"/><text x="270" y="109.3" font-size="9.5" text-anchor="middle" fill="#fff" font-weight="bold">dark</text><rect x="204" y="114" width="40" height="14" rx="3" fill="#0D6EFD" stroke="#0D6EFD" stroke-width="0"/><text x="224" y="126.2" font-size="6.4" text-anchor="middle" fill="#fff" font-weight="normal">badge</text><rect x="204" y="134" width="50" height="14" rx="3" fill="#2b3035" stroke="#6c757d" stroke-width="1.2"/><text x="229" y="145.4" font-size="6.8" text-anchor="middle" fill="#dee2e6" font-weight="normal">card</text><rect x="204" y="154" width="34" height="14" rx="3" fill="#0D6EFD" stroke="#0D6EFD" stroke-width="0"/><text x="221" y="166.4" font-size="6.8" text-anchor="middle" fill="#fff" font-weight="normal">Open</text><path d="M172 136 L182 136" fill="none" stroke="#666" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="188.0,136.0 181.0,132.5 181.0,139.5" fill="#666"/><rect x="12" y="196" width="336" height="40" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="214.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">One attribute switches every variable:</text><text x="20" y="229.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">bg, text, borders, shadows adapt.</text><rect x="10" y="242" width="108" height="21" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="64.0" y="255.4" font-size="8.4" text-anchor="middle" fill="#fff" font-weight="bold">Custom theme</text><rect x="118" y="242" width="226" height="21" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="231.0" y="255.4" font-size="8.4" text-anchor="middle" fill="#fff" font-weight="bold">approach</text><rect x="10" y="263" width="108" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="64.0" y="276.4" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">CSS-level</text><rect x="118" y="263" width="226" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="231.0" y="276.4" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">[data-bs-theme=x] { --bs-... }</text><rect x="10" y="284" width="108" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="64.0" y="297.4" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">Sass-level</text><rect x="118" y="284" width="226" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="231.0" y="297.4" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">one custom build per theme</text><rect x="10" y="305" width="108" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="64.0" y="318.4" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">Packaged</text><rect x="118" y="305" width="226" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="231.0" y="318.4" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">Bootswatch, Start Bootstrap</text><rect x="12" y="324" width="336" height="40" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="342.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">Rule: always style with semantic classes;</text><text x="20" y="357.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">never hard-code hex colours in markup.</text></svg>