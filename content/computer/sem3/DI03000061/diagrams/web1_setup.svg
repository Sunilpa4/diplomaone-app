<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 412" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="412" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Setting up Bootstrap</text><rect x="12" y="42" width="164" height="158" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.4"/><text x="94" y="61.5" font-size="10" text-anchor="middle" fill="#1565C0" font-weight="bold">Method 1: CDN</text><text x="94" y="79.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">Link files from a Content</text><text x="94" y="91.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">Delivery Network server</text><rect x="20" y="100" width="148" height="52" rx="4" fill="#fff" stroke="#1565C0" stroke-width="1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="25" y="115.7" font-size="7.6" text-anchor="start" fill="#222" font-weight="normal">&lt;link href=</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="25" y="125.7" font-size="7.6" text-anchor="start" fill="#222" font-weight="normal"> "https://cdn.jsdelivr</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="25" y="135.7" font-size="7.6" text-anchor="start" fill="#222" font-weight="normal"> .net/npm/bootstrap@5</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="25" y="145.7" font-size="7.6" text-anchor="start" fill="#222" font-weight="normal"> .3.3/dist/css/..."&gt;</text><text x="94" y="171.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">+ fast, cached, no download</text><text x="94" y="184.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">- needs internet</text><rect x="184" y="42" width="164" height="158" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.4"/><text x="266" y="61.5" font-size="10" text-anchor="middle" fill="#2E7D32" font-weight="bold">Method 2: Local files</text><text x="266" y="79.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">Download from</text><text x="266" y="91.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">getbootstrap.com</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="198" y="110.8" font-size="8" text-anchor="start" fill="#222" font-weight="normal">my_site/</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="198" y="121.8" font-size="8" text-anchor="start" fill="#222" font-weight="normal"> |- index.html</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="198" y="132.8" font-size="8" text-anchor="start" fill="#222" font-weight="normal"> |- css/</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="198" y="143.8" font-size="8" text-anchor="start" fill="#222" font-weight="normal"> |   bootstrap.min.css</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="198" y="154.8" font-size="8" text-anchor="start" fill="#222" font-weight="normal"> |- js/</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="198" y="165.8" font-size="8" text-anchor="start" fill="#222" font-weight="normal">     bootstrap.bundle</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="198" y="176.8" font-size="8" text-anchor="start" fill="#222" font-weight="normal">      .min.js</text><text x="266" y="195.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">+ works offline</text><text x="14" y="225.4" font-size="9.8" text-anchor="start" fill="#7B2CD9" font-weight="bold">Basic template</text><rect x="12" y="230" width="336" height="128" rx="6" fill="#fff" stroke="#666" stroke-width="1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="247.8" font-size="7.9" text-anchor="start" fill="#222" font-weight="normal">&lt;!DOCTYPE html&gt;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="259.2" font-size="7.9" text-anchor="start" fill="#222" font-weight="normal">&lt;html lang="en"&gt;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="270.6" font-size="7.9" text-anchor="start" fill="#222" font-weight="normal">&lt;head&gt;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="282.0" font-size="7.9" text-anchor="start" fill="#222" font-weight="normal"> &lt;meta charset="UTF-8"&gt;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="293.4" font-size="7.9" text-anchor="start" fill="#222" font-weight="normal"> &lt;meta name="viewport" content=</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="304.8" font-size="7.9" text-anchor="start" fill="#222" font-weight="normal">  "width=device-width, initial-scale=1"&gt;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="316.2" font-size="7.9" text-anchor="start" fill="#222" font-weight="normal"> &lt;link rel="stylesheet" href="css/bootstrap.min.css"&gt;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="327.6" font-size="7.9" text-anchor="start" fill="#222" font-weight="normal">&lt;/head&gt;&lt;body&gt; ... content ...</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="339.0" font-size="7.9" text-anchor="start" fill="#222" font-weight="normal"> &lt;script src="js/bootstrap.bundle.min.js"&gt;&lt;/script&gt;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="350.4" font-size="7.9" text-anchor="start" fill="#222" font-weight="normal">&lt;/body&gt;&lt;/html&gt;</text><rect x="12" y="366" width="336" height="40" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="384.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">CSS in &lt;head&gt;; JS just before &lt;/body&gt;.</text><text x="20" y="399.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">bundle.min.js = Bootstrap JS + Popper.</text></svg>