<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 380" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="380" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">History of Bootstrap</text><path d="M58 44 L58 330" fill="none" stroke="#7B2CD9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="58" cy="58" r="6" fill="#7B2CD9"/><text x="14" y="65.6" font-size="10.4" text-anchor="start" fill="#7B2CD9" font-weight="bold">2010</text><text x="74" y="59.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">Mark Otto and Jacob Thornton build</text><text x="74" y="73.2" font-size="9" text-anchor="start" fill="#666" font-weight="normal">"Twitter Blueprint" at Twitter</text><circle cx="58" cy="99" r="6" fill="#7B2CD9"/><text x="14" y="106.6" font-size="10.4" text-anchor="start" fill="#7B2CD9" font-weight="bold">2011</text><text x="74" y="100.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">v1.0 released as open source</text><text x="74" y="114.2" font-size="9" text-anchor="start" fill="#666" font-weight="normal">(19 August 2011)</text><circle cx="58" cy="140" r="6" fill="#7B2CD9"/><text x="14" y="147.6" font-size="10.4" text-anchor="start" fill="#7B2CD9" font-weight="bold">2012</text><text x="74" y="141.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">v2: responsive design added</text><text x="74" y="155.2" font-size="9" text-anchor="start" fill="#666" font-weight="normal">(12-column fluid grid)</text><circle cx="58" cy="181" r="6" fill="#7B2CD9"/><text x="14" y="188.6" font-size="10.4" text-anchor="start" fill="#7B2CD9" font-weight="bold">2013</text><text x="74" y="182.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">v3: mobile-first, flat design,</text><text x="74" y="196.2" font-size="9" text-anchor="start" fill="#666" font-weight="normal">Glyphicons, panels, jumbotron</text><circle cx="58" cy="222" r="6" fill="#7B2CD9"/><text x="14" y="229.6" font-size="10.4" text-anchor="start" fill="#7B2CD9" font-weight="bold">2018</text><text x="74" y="223.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">v4: Flexbox grid, Sass, cards,</text><text x="74" y="237.2" font-size="9" text-anchor="start" fill="#666" font-weight="normal">rem units, xl breakpoint</text><circle cx="58" cy="263" r="6" fill="#E07B00"/><text x="14" y="270.6" font-size="10.4" text-anchor="start" fill="#E07B00" font-weight="bold">2021</text><text x="74" y="264.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">v5: no jQuery, no IE, xxl, RTL,</text><text x="74" y="278.1" font-size="9" text-anchor="start" fill="#666" font-weight="normal">Utility API, Bootstrap Icons</text><circle cx="58" cy="304" r="6" fill="#2E7D32"/><text x="14" y="311.6" font-size="10.4" text-anchor="start" fill="#2E7D32" font-weight="bold">2023</text><text x="74" y="305.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">v5.3: colour modes (dark mode),</text><text x="74" y="319.1" font-size="9" text-anchor="start" fill="#666" font-weight="normal">data-bs-theme attribute</text><rect x="12" y="336" width="336" height="40" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="354.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">Bootstrap = free, open-source front-end framework</text><text x="20" y="369.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">of HTML, CSS and JavaScript (most popular today).</text></svg>