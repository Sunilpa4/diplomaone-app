<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 346" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="346" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">jQuery Selectors</text><rect x="8" y="38" width="78" height="21" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="47.0" y="51.6" font-size="8.8" text-anchor="middle" fill="#fff" font-weight="bold">Selector</text><rect x="86" y="38" width="124" height="21" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="148.0" y="51.6" font-size="8.8" text-anchor="middle" fill="#fff" font-weight="bold">Example</text><rect x="210" y="38" width="142" height="21" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="281.0" y="51.6" font-size="8.8" text-anchor="middle" fill="#fff" font-weight="bold">Selects</text><rect x="8" y="59" width="78" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="47.0" y="72.6" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">Element</text><rect x="86" y="59" width="124" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="148.0" y="72.6" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">$("p")</text><rect x="210" y="59" width="142" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="281.0" y="72.6" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">all &lt;p&gt; elements</text><rect x="8" y="80" width="78" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="47.0" y="93.6" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">#id</text><rect x="86" y="80" width="124" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="148.0" y="93.6" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">$("#name")</text><rect x="210" y="80" width="142" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="281.0" y="93.6" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">element with id=name</text><rect x="8" y="101" width="78" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="47.0" y="114.6" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">.class</text><rect x="86" y="101" width="124" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="148.0" y="114.6" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">$(".note")</text><rect x="210" y="101" width="142" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="281.0" y="114.6" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">all with class=note</text><rect x="8" y="122" width="78" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="47.0" y="135.6" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">Universal</text><rect x="86" y="122" width="124" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="148.0" y="135.6" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">$("*")</text><rect x="210" y="122" width="142" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="281.0" y="135.6" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">every element</text><rect x="8" y="143" width="78" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="47.0" y="156.6" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">Group</text><rect x="86" y="143" width="124" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="148.0" y="156.6" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">$("h1, p")</text><rect x="210" y="143" width="142" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="281.0" y="156.6" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">all &lt;h1&gt; and &lt;p&gt;</text><rect x="8" y="164" width="78" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="47.0" y="177.6" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">Descendant</text><rect x="86" y="164" width="124" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="148.0" y="177.6" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">$("ul li")</text><rect x="210" y="164" width="142" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="281.0" y="177.6" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">&lt;li&gt; inside &lt;ul&gt;</text><rect x="8" y="185" width="78" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="47.0" y="198.6" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">Attribute</text><rect x="86" y="185" width="124" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="148.0" y="198.6" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">$("[href]")</text><rect x="210" y="185" width="142" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="281.0" y="198.6" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">having href</text><rect x="8" y="206" width="78" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="47.0" y="219.6" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">Attr value</text><rect x="86" y="206" width="124" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="148.0" y="219.6" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">$("[type='text']")</text><rect x="210" y="206" width="142" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="281.0" y="219.6" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">type is text</text><rect x="8" y="227" width="78" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="47.0" y="240.6" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">Filter</text><rect x="86" y="227" width="124" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="148.0" y="240.6" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">$("li:first")</text><rect x="210" y="227" width="142" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="281.0" y="240.6" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">first &lt;li&gt;</text><rect x="8" y="248" width="78" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="47.0" y="261.6" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">Filter</text><rect x="86" y="248" width="124" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="148.0" y="261.6" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">$("tr:even")</text><rect x="210" y="248" width="142" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="281.0" y="261.6" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">rows 0, 2, 4 ...</text><rect x="8" y="269" width="78" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="47.0" y="282.6" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">this</text><rect x="86" y="269" width="124" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="148.0" y="282.6" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">$(this)</text><rect x="210" y="269" width="142" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="281.0" y="282.6" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">current element</text><rect x="12" y="300" width="336" height="40" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="318.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">jQuery uses CSS selector syntax, so any CSS</text><text x="20" y="333.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">selector works. Index counting starts at 0.</text></svg>