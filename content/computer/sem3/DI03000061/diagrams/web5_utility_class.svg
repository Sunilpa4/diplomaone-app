<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 368" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="368" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Anatomy of a Spacing Class</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="72.5" font-size="30" text-anchor="middle" fill="#7B2CD9" font-weight="bold">m  t  -  3</text><path d="M120 72 L120 96" fill="none" stroke="#1565C0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M160 72 L160 96" fill="none" stroke="#2E7D32" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M235 72 L235 96" fill="none" stroke="#E07B00" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="113.2" font-size="9" text-anchor="middle" fill="#1565C0" font-weight="bold">property</text><text x="120" y="127.0" font-size="8.6" text-anchor="middle" fill="#666" font-weight="normal">m = margin</text><text x="120" y="140.0" font-size="8.6" text-anchor="middle" fill="#666" font-weight="normal">p = padding</text><text x="160" y="157.2" font-size="9" text-anchor="middle" fill="#2E7D32" font-weight="bold">sides</text><text x="160" y="171.0" font-size="8.6" text-anchor="middle" fill="#666" font-weight="normal">t b s e x y (none = all)</text><text x="235" y="113.2" font-size="9" text-anchor="middle" fill="#E07B00" font-weight="bold">size</text><text x="235" y="127.0" font-size="8.6" text-anchor="middle" fill="#666" font-weight="normal">0 1 2 3 4 5 auto</text><text x="235" y="139.9" font-size="8.2" text-anchor="middle" fill="#666" font-weight="normal">(for margin)</text><rect x="10" y="184" width="120" height="21" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="70.0" y="197.5" font-size="8.6" text-anchor="middle" fill="#fff" font-weight="bold">Examples</text><rect x="130" y="184" width="222" height="21" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="241.0" y="197.5" font-size="8.6" text-anchor="middle" fill="#fff" font-weight="bold">Meaning</text><rect x="10" y="205" width="120" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="70.0" y="218.5" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">mt-3</text><rect x="130" y="205" width="222" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="241.0" y="218.5" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">margin top 1rem</text><rect x="10" y="226" width="120" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="70.0" y="239.5" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">px-2</text><rect x="130" y="226" width="222" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="241.0" y="239.5" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">padding left+right 0.5rem</text><rect x="10" y="247" width="120" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="70.0" y="260.5" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">ms-auto</text><rect x="130" y="247" width="222" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="241.0" y="260.5" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">start margin auto</text><rect x="10" y="268" width="120" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="70.0" y="281.5" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">p-md-4</text><rect x="130" y="268" width="222" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="241.0" y="281.5" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">padding 1.5rem from 768px</text><rect x="12" y="322" width="336" height="40" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="340.1" font-size="9" text-anchor="start" fill="#222" font-weight="normal">Sizes: 1 = 0.25rem, 2 = 0.5, 3 = 1, 4 = 1.5, 5 = 3rem.</text><text x="20" y="355.1" font-size="9" text-anchor="start" fill="#222" font-weight="normal">Bootstrap 4 used l/r; Bootstrap 5 uses s/e (start/end).</text></svg>