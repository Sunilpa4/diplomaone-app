<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 352" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="352" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Types of Bootstrap Components</text><rect x="12" y="42" width="164" height="106" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.4"/><text x="94" y="61.5" font-size="10" text-anchor="middle" fill="#1565C0" font-weight="bold">Navigation</text><text x="94" y="79.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">Navs (tabs, pills)</text><text x="94" y="94.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">Navbar</text><text x="94" y="109.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">Breadcrumb</text><text x="94" y="124.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">Pagination</text><text x="94" y="139.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">Dropdown</text><rect x="184" y="42" width="164" height="106" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.4"/><text x="266" y="61.5" font-size="10" text-anchor="middle" fill="#2E7D32" font-weight="bold">Content boxes</text><text x="266" y="79.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">Card (panel, thumbnail)</text><text x="266" y="94.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">List group</text><text x="266" y="109.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">Media object</text><text x="266" y="124.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">Jumbotron</text><text x="266" y="139.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">Accordion</text><rect x="12" y="158" width="164" height="106" rx="7" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.4"/><text x="94" y="177.5" font-size="10" text-anchor="middle" fill="#E07B00" font-weight="bold">Buttons and forms</text><text x="94" y="195.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">Buttons</text><text x="94" y="210.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">Button group / toolbar</text><text x="94" y="225.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">Input group</text><text x="94" y="240.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">Close button</text><text x="94" y="255.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">Icons</text><rect x="184" y="158" width="164" height="106" rx="7" fill="#E0F2F1" stroke="#00796B" stroke-width="1.4"/><text x="266" y="177.5" font-size="10" text-anchor="middle" fill="#00796B" font-weight="bold">Feedback / status</text><text x="266" y="195.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">Alerts</text><text x="266" y="210.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">Badges (labels)</text><text x="266" y="225.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">Progress bar</text><text x="266" y="240.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">Spinners</text><text x="266" y="255.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">Toasts</text><rect x="12" y="276" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="294.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">Component = ready-made UI part built from HTML</text><text x="20" y="309.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">+ Bootstrap classes (+ JavaScript for interactive</text><text x="20" y="324.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">ones). Advantages: fast, consistent, responsive,</text><text x="20" y="339.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">accessible, easy to customise.</text></svg>