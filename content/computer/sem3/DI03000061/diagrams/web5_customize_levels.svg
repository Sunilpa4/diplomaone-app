<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 370" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="370" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Levels of Bootstrap Customization</text><rect x="14" y="44" width="332" height="46" rx="7" fill="#fff" stroke="#0DCAF0" stroke-width="1.4"/><text x="26" y="62.3" font-size="9.4" text-anchor="start" fill="#0DCAF0" font-weight="bold">1. CSS variables</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="26" y="74.9" font-size="8.2" text-anchor="start" fill="#333" font-weight="normal">:root { --bs-primary: ...; }</text><text x="26" y="86.8" font-size="8" text-anchor="start" fill="#666" font-weight="normal">runtime, no tools</text><rect x="14" y="98" width="332" height="46" rx="7" fill="#fff" stroke="#0D6EFD" stroke-width="1.4"/><text x="26" y="116.3" font-size="9.4" text-anchor="start" fill="#0D6EFD" font-weight="bold">2. Sass variables</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="26" y="128.9" font-size="8.2" text-anchor="start" fill="#333" font-weight="normal">$primary: #198754; (before import)</text><text x="26" y="140.8" font-size="8" text-anchor="start" fill="#666" font-weight="normal">whole library</text><rect x="14" y="152" width="332" height="46" rx="7" fill="#fff" stroke="#00796B" stroke-width="1.4"/><text x="26" y="170.3" font-size="9.4" text-anchor="start" fill="#00796B" font-weight="bold">3. Sass maps + utility API</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="26" y="182.9" font-size="8.2" text-anchor="start" fill="#333" font-weight="normal">map-merge($theme-colors, ...)</text><text x="26" y="194.8" font-size="8" text-anchor="start" fill="#666" font-weight="normal">own colours / utils</text><rect x="14" y="206" width="332" height="46" rx="7" fill="#fff" stroke="#E07B00" stroke-width="1.4"/><text x="26" y="224.3" font-size="9.4" text-anchor="start" fill="#E07B00" font-weight="bold">4. Component variables</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="26" y="236.9" font-size="8.2" text-anchor="start" fill="#333" font-weight="normal">$card-border-radius: 1rem;</text><text x="26" y="248.8" font-size="8" text-anchor="start" fill="#666" font-weight="normal">one component</text><rect x="14" y="260" width="332" height="46" rx="7" fill="#fff" stroke="#198754" stroke-width="1.4"/><text x="26" y="278.3" font-size="9.4" text-anchor="start" fill="#198754" font-weight="bold">5. Themes</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="26" y="290.9" font-size="8.2" text-anchor="start" fill="#333" font-weight="normal">packaged set of 1-4 per theme</text><text x="26" y="302.8" font-size="8" text-anchor="start" fill="#666" font-weight="normal">site identity</text><rect x="12" y="318" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="336.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">Simple -&gt; powerful, top to bottom.</text><text x="20" y="351.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">Bootstrap is !default-driven: your Sass</text><text x="20" y="366.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">values set before import always win.</text></svg>