<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 306" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="306" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Nesting Columns</text><rect x="12" y="40" width="336" height="196" rx="5" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.4"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="58.4" font-size="9.6" text-anchor="start" fill="#E07B00" font-weight="bold">.row</text><rect x="22" y="62" width="214" height="164" rx="4" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.3"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="32" y="80.4" font-size="9.6" text-anchor="start" fill="#7B2CD9" font-weight="bold">.col-8</text><rect x="30" y="86" width="198" height="132" rx="4" fill="#fff" stroke="#E07B00" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="38" y="103.1" font-size="8.8" text-anchor="start" fill="#E07B00" font-weight="normal">nested .row (12 again)</text><rect x="38" y="108" width="88" height="46" rx="3" fill="#E3F0FC" stroke="#1565C0" stroke-width="1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="82" y="138.2" font-size="9" text-anchor="middle" fill="#1565C0" font-weight="normal">col-6</text><rect x="132" y="108" width="88" height="46" rx="3" fill="#E3F0FC" stroke="#1565C0" stroke-width="1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="176" y="138.2" font-size="9" text-anchor="middle" fill="#1565C0" font-weight="normal">col-6</text><rect x="38.0" y="162" width="57" height="46" rx="3" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="66.5" y="192.2" font-size="9" text-anchor="middle" fill="#2E7D32" font-weight="normal">col-4</text><rect x="100.5" y="162" width="57" height="46" rx="3" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="129.0" y="192.2" font-size="9" text-anchor="middle" fill="#2E7D32" font-weight="normal">col-4</text><rect x="163.0" y="162" width="57" height="46" rx="3" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="191.5" y="192.2" font-size="9" text-anchor="middle" fill="#2E7D32" font-weight="normal">col-4</text><rect x="244" y="62" width="94" height="164" rx="4" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.3"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="291" y="151.4" font-size="9.6" text-anchor="middle" fill="#7B2CD9" font-weight="bold">.col-4</text><rect x="12" y="246" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="264.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">A nested .row goes INSIDE a column.</text><text x="20" y="279.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">Its 12 columns divide the parent column's width,</text><text x="20" y="294.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">so inner col-6 = half of col-8 (= 4 of 12 on page).</text></svg>