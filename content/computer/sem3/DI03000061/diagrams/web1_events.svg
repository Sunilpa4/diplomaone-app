<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 404" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="404" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">jQuery Events</text><rect x="12" y="42" width="164" height="104" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.4"/><text x="94" y="61.5" font-size="10" text-anchor="middle" fill="#1565C0" font-weight="bold">Mouse events</text><text x="94" y="76.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">click</text><text x="94" y="88.6" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">dblclick</text><text x="94" y="101.0" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">mouseenter</text><text x="94" y="113.4" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">mouseleave</text><text x="94" y="125.8" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">hover</text><text x="94" y="138.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">mousedown / up</text><rect x="184" y="42" width="164" height="104" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.4"/><text x="266" y="61.5" font-size="10" text-anchor="middle" fill="#2E7D32" font-weight="bold">Keyboard events</text><text x="266" y="76.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">keydown</text><text x="266" y="88.6" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">keyup</text><text x="266" y="101.0" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">keypress</text><text x="266" y="113.4" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">(event.which or</text><text x="266" y="125.8" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">event.key = key)</text><rect x="12" y="156" width="164" height="104" rx="7" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.4"/><text x="94" y="175.5" font-size="10" text-anchor="middle" fill="#E07B00" font-weight="bold">Form events</text><text x="94" y="190.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">focus</text><text x="94" y="202.6" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">blur</text><text x="94" y="215.0" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">change</text><text x="94" y="227.3" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">submit</text><text x="94" y="239.8" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">select / input</text><rect x="184" y="156" width="164" height="104" rx="7" fill="#E0F2F1" stroke="#00796B" stroke-width="1.4"/><text x="266" y="175.5" font-size="10" text-anchor="middle" fill="#00796B" font-weight="bold">Document / window</text><text x="266" y="190.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">ready</text><text x="266" y="202.6" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">load</text><text x="266" y="215.0" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">resize</text><text x="266" y="227.3" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">scroll</text><text x="266" y="239.8" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">unload</text><text x="14" y="283.4" font-size="9.8" text-anchor="start" fill="#7B2CD9" font-weight="bold">Attaching an event handler</text><rect x="14" y="288" width="332" height="60" rx="6" fill="#fff" stroke="#666" stroke-width="1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="306.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">$("#btn").click(function (e) { ... });</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="319.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">$("#btn").on("click", function (e) { ... });</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="332.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">$("ul").on("click", "li", fn); // delegation</text><rect x="12" y="358" width="336" height="40" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="376.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">e = event object: e.type, e.target, e.pageX,</text><text x="20" y="391.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">e.preventDefault() stops the default action.</text></svg>