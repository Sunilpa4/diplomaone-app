<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 378" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="378" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Two Ways to Use a Plug-in</text><rect x="10" y="40" width="340" height="74" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.3"/><text x="20" y="61.5" font-size="10" text-anchor="start" fill="#1565C0" font-weight="bold">1. Data attributes (no JavaScript)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="77.0" font-size="8.6" text-anchor="start" fill="#222" font-weight="normal">&lt;button data-bs-toggle="collapse"</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="90.0" font-size="8.6" text-anchor="start" fill="#222" font-weight="normal">        data-bs-target="#box"&gt;</text><rect x="10" y="124" width="340" height="136" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.3"/><text x="20" y="145.5" font-size="10" text-anchor="start" fill="#2E7D32" font-weight="bold">2. JavaScript API</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="160.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">var c = new bootstrap.Collapse(el, {</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="176.4" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">          toggle: false });   // options</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="191.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">c.show();  c.hide();  c.toggle(); // methods</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="207.4" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">bootstrap.Collapse.getOrCreateInstance(el);</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="222.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">el.addEventListener("shown.bs.collapse",</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="238.4" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">                    fn);           // events</text><text x="180" y="287.5" font-size="10" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Event names: action.bs.plugin</text><path d="M20 318 L340 318" fill="none" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="50" cy="318" r="5" fill="#0D6EFD"/><text x="50" y="309.3" font-size="9.4" text-anchor="middle" fill="#0D6EFD" font-weight="bold">show</text><circle cx="130" cy="318" r="5" fill="#198754"/><text x="130" y="309.3" font-size="9.4" text-anchor="middle" fill="#198754" font-weight="bold">shown</text><circle cx="210" cy="318" r="5" fill="#FFC107"/><text x="210" y="309.3" font-size="9.4" text-anchor="middle" fill="#FFC107" font-weight="bold">hide</text><circle cx="290" cy="318" r="5" fill="#DC3545"/><text x="290" y="309.3" font-size="9.4" text-anchor="middle" fill="#DC3545" font-weight="bold">hidden</text><text x="70" y="338.9" font-size="8.4" text-anchor="middle" fill="#666" font-weight="normal">before</text><text x="150" y="338.9" font-size="8.4" text-anchor="middle" fill="#666" font-weight="normal">after anim.</text><text x="230" y="338.9" font-size="8.4" text-anchor="middle" fill="#666" font-weight="normal">before</text><text x="310" y="338.9" font-size="8.4" text-anchor="middle" fill="#666" font-weight="normal">after anim.</text><rect x="12" y="346" width="336" height="25" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="364.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">e.preventDefault() in show / hide cancels the action.</text></svg>