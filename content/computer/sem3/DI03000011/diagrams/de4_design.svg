<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 414" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="414" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Design Procedure</text><rect x="30.0" y="41.0" width="300" height="30" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="59.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="normal">1. State the problem clearly</text><path d="M180 71 L180 84" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,84.0 183.5,77.0 176.5,77.0" fill="#222"/><rect x="30.0" y="85.0" width="300" height="30" rx="7" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="103.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="normal">2. Find number of inputs and outputs; name them</text><path d="M180 115 L180 128" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,128.0 183.5,121.0 176.5,121.0" fill="#222"/><rect x="30.0" y="129.0" width="300" height="30" rx="7" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="147.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="normal">3. Write the truth table</text><path d="M180 159 L180 172" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,172.0 183.5,165.0 176.5,165.0" fill="#222"/><rect x="30.0" y="173.0" width="300" height="30" rx="7" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="191.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="normal">4. Get the Boolean expression of each output</text><path d="M180 203 L180 216" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,216.0 183.5,209.0 176.5,209.0" fill="#222"/><rect x="30.0" y="217.0" width="300" height="30" rx="7" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="235.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="normal">5. Simplify each expression (K-map / algebra)</text><path d="M180 247 L180 260" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,260.0 183.5,253.0 176.5,253.0" fill="#222"/><rect x="30.0" y="261.0" width="300" height="30" rx="7" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="279.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="normal">6. Draw the logic diagram</text><path d="M180 291 L180 304" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,304.0 183.5,297.0 176.5,297.0" fill="#222"/><rect x="30.0" y="305.0" width="300" height="30" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="323.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="normal">7. Verify (truth table / simulation)</text><rect x="12" y="354" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="372.4" font-size="9.6" text-anchor="start" fill="#7B2CD9" font-weight="normal">Example: Half adder</text><text x="20" y="387.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Inputs: A, B (2)    Outputs: Sum S, Carry C (2)</text><text x="20" y="402.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">S = A ⊕ B,  C = AB  → one XOR + one AND gate</text></svg>