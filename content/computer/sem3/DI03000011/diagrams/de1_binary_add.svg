<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 258" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="258" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Binary Addition</text><rect x="12" y="32" width="160" height="150" rx="8" fill="#FCFAFF" stroke="#D9C8F0" stroke-width="1"/><text x="92" y="51.6" font-size="10.4" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Rules</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="73.8" font-size="11" text-anchor="start" fill="#222" font-weight="normal">0 + 0</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="100" y="73.8" font-size="11" text-anchor="start" fill="#222" font-weight="bold">= 0</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="95.8" font-size="11" text-anchor="start" fill="#222" font-weight="normal">0 + 1</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="100" y="95.8" font-size="11" text-anchor="start" fill="#222" font-weight="bold">= 1</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="117.8" font-size="11" text-anchor="start" fill="#222" font-weight="normal">1 + 0</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="100" y="117.8" font-size="11" text-anchor="start" fill="#222" font-weight="bold">= 1</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="139.8" font-size="11" text-anchor="start" fill="#222" font-weight="normal">1 + 1</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="100" y="139.8" font-size="11" text-anchor="start" fill="#222" font-weight="bold">= 0</text><text x="124" y="140.1" font-size="8.8" text-anchor="start" fill="#C62828" font-weight="normal">carry 1</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="161.8" font-size="11" text-anchor="start" fill="#222" font-weight="normal">1 + 1 + 1</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="100" y="161.8" font-size="11" text-anchor="start" fill="#222" font-weight="bold">= 1</text><text x="124" y="162.1" font-size="8.8" text-anchor="start" fill="#C62828" font-weight="normal">carry 1</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="214" y="63.5" font-size="10" text-anchor="middle" fill="#C62828" font-weight="bold">1</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="230" y="63.5" font-size="10" text-anchor="middle" fill="#C62828" font-weight="bold">1</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="246" y="63.5" font-size="10" text-anchor="middle" fill="#C62828" font-weight="bold">1</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="262" y="63.5" font-size="10" text-anchor="middle" fill="#C62828" font-weight="bold">1</text><text x="310" y="63.1" font-size="9" text-anchor="start" fill="#C62828" font-weight="normal">carry</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="230" y="90.5" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">1</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="246" y="90.5" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">0</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="262" y="90.5" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">1</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="278" y="90.5" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">1</text><text x="310" y="89.2" font-size="9" text-anchor="start" fill="#666" font-weight="normal">(11)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="230" y="116.5" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">1</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="246" y="116.5" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">1</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="262" y="116.5" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">0</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="278" y="116.5" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">1</text><text x="310" y="115.2" font-size="9" text-anchor="start" fill="#666" font-weight="normal">(13)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="214" y="150.6" font-size="13" text-anchor="middle" fill="#2E7D32" font-weight="bold">1</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="230" y="150.6" font-size="13" text-anchor="middle" fill="#2E7D32" font-weight="bold">1</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="246" y="150.6" font-size="13" text-anchor="middle" fill="#2E7D32" font-weight="bold">0</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="262" y="150.6" font-size="13" text-anchor="middle" fill="#2E7D32" font-weight="bold">0</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="278" y="150.6" font-size="13" text-anchor="middle" fill="#2E7D32" font-weight="bold">0</text><text x="310" y="149.2" font-size="9" text-anchor="start" fill="#666" font-weight="normal">(24)</text><text x="202" y="116.5" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">+</text><path d="M200 124 L290 124" fill="none" stroke="#222" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="12" y="196" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="214.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">Add column by column from the right (LSB),</text><text x="20" y="229.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">carrying 1 to the next column when the sum ≥ 2.</text><text x="20" y="244.4" font-size="9.8" text-anchor="start" fill="#2E7D32" font-weight="normal">Check: 11 + 13 = 24 = (11000)₂</text></svg>