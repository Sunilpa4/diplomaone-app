="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">2</text><path d="M52 128 L52 152 L130 152" fill="none" stroke="#7B2CD9" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="90" y="144.2" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">5</text><text x="160" y="143.5" font-size="10" text-anchor="start" fill="#C62828" font-weight="bold">remainder 1</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="40" y="172.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">2</text><path d="M52 156 L52 180 L130 180" fill="none" stroke="#7B2CD9" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="90" y="172.2" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">2</text><text x="160" y="171.5" font-size="10" text-anchor="start" fill="#C62828" font-weight="bold">remainder 0</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="40" y="200.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">2</text><path d="M52 184 L52 208 L130 208" fill="none" stroke="#7B2CD9" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="90" y="200.2" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">1</text><text x="160" y="199.5" font-size="10" text-anchor="start" fill="#C62828" font-weight="bold">remainder 1</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="90" y="228.2" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">0</text><path d="M278 204 L278 50" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="278.0,50.0 274.5,57.0 281.5,57.0" fill="#2E7D32"/><text x="290" y="125.4" font-size="9.6" text-anchor="start" fill="#2E7D32" font-weight="bold">read</text><text x="290" y="139.4" font-size="9.6" text-anchor="start" fill="#2E7D32" font-weight="bold">upward</text><rect x="12" y="240" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="258.4" font-size="9.8" text-anchor="start" fill="#2E7D32" font-weight="normal">(45)₁₀ = (101101)₂</text><text x="20" y="273.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">Divide by the base until the quotient is 0.</text><text x="20" y="288.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">First remainder = LSB, last remainder = MSB.</text><text x="20" y="303.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">Same method: ÷8 for octal, ÷16 for hex.</text></svg>