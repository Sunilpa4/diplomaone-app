.7" font-size="10.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">0</text><rect x="276.0" y="134" width="22" height="18" rx="3" fill="#FDECEC" stroke="#C62828" stroke-width="1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="287.0" y="146.7" font-size="10.5" text-anchor="middle" fill="#C62828" font-weight="bold">1</text><rect x="310.0" y="110" width="22" height="18" rx="3" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="321.0" y="122.7" font-size="10.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">1</text><rect x="310.0" y="134" width="22" height="18" rx="3" fill="#FDECEC" stroke="#C62828" stroke-width="1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="321.0" y="146.7" font-size="10.5" text-anchor="middle" fill="#C62828" font-weight="bold">0</text><rect x="14" y="166" width="160" height="64" rx="8" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.1"/><text x="94" y="185.5" font-size="10" text-anchor="middle" fill="#2E7D32" font-weight="bold">Positive logic</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="94" y="203.4" font-size="9.8" text-anchor="middle" fill="#222" font-weight="normal">HIGH (+5 V) = 1</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="94" y="220.4" font-size="9.8" text-anchor="middle" fill="#222" font-weight="normal">LOW  (0 V)  = 0</text><rect x="186" y="166" width="160" height="64" rx="8" fill="#FDECEC" stroke="#C62828" stroke-width="1.1"/><text x="266" y="185.5" font-size="10" text-anchor="middle" fill="#C62828" font-weight="bold">Negative logic</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="266" y="203.4" font-size="9.8" text-anchor="middle" fill="#222" font-weight="normal">HIGH (+5 V) = 0</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="266" y="220.4" font-size="9.8" text-anchor="middle" fill="#222" font-weight="normal">LOW  (0 V)  = 1</text><rect x="12" y="240" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="258.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">The same voltage waveform gives opposite bits.</text><text x="20" y="273.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">A positive-logic AND gate acts as a</text><text x="20" y="288.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">negative-logic OR gate (and OR ↔ AND).</text></svg>