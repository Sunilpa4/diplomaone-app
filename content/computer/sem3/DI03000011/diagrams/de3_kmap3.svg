222" font-weight="normal">Gray code order 00, 01, 11, 10 (not 00 01 10 11),</text><text x="20" y="250.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">so neighbouring cells differ in only one bit.</text><text x="20" y="265.4" font-size="9.6" text-anchor="start" fill="#C62828" font-weight="normal">Left and right edges are also adjacent (wrap).</text><text x="20" y="280.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Small number in each cell = minterm number.</text></svg>