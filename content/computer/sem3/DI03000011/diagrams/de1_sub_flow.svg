<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 424" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="424" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Subtraction using 2's Complement (A − B)</text><rect x="135.0" y="36.0" width="90" height="28" rx="14.0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.8"/><text x="180" y="54.2" font-size="12" text-anchor="middle" fill="#1B5E20" font-weight="bold">Start</text><path d="M180 64 L180 82" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,82.0 183.5,75.0 176.5,75.0" fill="#222"/><rect x="80.0" y="84.0" width="200" height="32" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.8"/><text x="180" y="104.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">Make A, B equal length</text><path d="M180 116 L180 134" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,134.0 183.5,127.0 176.5,127.0" fill="#222"/><rect x="80.0" y="136.0" width="200" height="32" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.8"/><text x="180" y="156.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">Find 2's complement of B</text><path d="M180 168 L180 186" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,186.0 183.5,179.0 176.5,179.0" fill="#222"/><rect x="80.0" y="188.0" width="200" height="32" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.8"/><text x="180" y="208.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">Add: A + 2's comp of B</text><path d="M180 220 L180 236" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,236.0 183.5,229.0 176.5,229.0" fill="#222"/><polygon points="180,238.0 235.0,266 180,294.0 125.0,266" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.8"/><text x="180" y="269.9" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">Carry?</text><path d="M235 266 L300 266 L300 304" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="300.0,304.0 303.5,297.0 296.5,297.0" fill="#222"/><text x="268" y="261.4" font-size="9.6" text-anchor="middle" fill="#2E7D32" font-weight="bold">Yes</text><path d="M125 266 L60 266 L60 304" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="60.0,304.0 63.5,297.0 56.5,297.0" fill="#222"/><text x="92" y="261.4" font-size="9.6" text-anchor="middle" fill="#C62828" font-weight="bold">No</text><rect x="245.0" y="308.0" width="110" height="44" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.6"/><text x="300" y="334.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal"></text><text x="300" y="325.4" font-size="9.6" text-anchor="middle" fill="#222" font-weight="bold">Discard carry</text><text x="300" y="341.4" font-size="9.6" text-anchor="middle" fill="#2E7D32" font-weight="bold">result +ve</text><rect x="5.0" y="308.0" width="110" height="44" rx="7" fill="#FCE4EC" stroke="#C2185B" stroke-width="1.6"/><text x="60" y="334.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal"></text><text x="60" y="325.4" font-size="9.6" text-anchor="middle" fill="#222" font-weight="bold">Result −ve:</text><text x="60" y="341.4" font-size="9.6" text-anchor="middle" fill="#C62828" font-weight="bold">take 2's comp</text><rect x="12" y="364" width="336" height="55" rx="7" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.1"/><text x="20" y="382.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">1's complement method: if carry, add it back to</text><text x="20" y="397.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">the LSB (end-around carry); if no carry, the</text><text x="20" y="412.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">result is negative: take its 1's complement.</text></svg>