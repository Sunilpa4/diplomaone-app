<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 228" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="228" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Digital System</text><rect x="12.0" y="57.0" width="96" height="46" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="60" y="83.8" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">Input</text><rect x="128.0" y="51.0" width="104" height="58" rx="7" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="83.8" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">Digital</text><text x="180" y="101.4" font-size="9.6" text-anchor="middle" fill="#7B2CD9" font-weight="normal">processing</text><rect x="252.0" y="57.0" width="96" height="46" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.6"/><text x="300" y="83.8" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">Output</text><path d="M108 80 L127 80" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="127.0,80.0 120.0,76.5 120.0,83.5" fill="#222"/><path d="M233 80 L251 80" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="251.0,80.0 244.0,76.5 244.0,83.5" fill="#222"/><text x="60" y="123.1" font-size="8.8" text-anchor="middle" fill="#555" font-weight="normal">keyboard, switch,</text><text x="60" y="135.1" font-size="8.8" text-anchor="middle" fill="#555" font-weight="normal">sensor + ADC</text><text x="180" y="127.1" font-size="8.8" text-anchor="middle" fill="#555" font-weight="normal">gates, flip-flops,</text><text x="180" y="139.1" font-size="8.8" text-anchor="middle" fill="#555" font-weight="normal">processor, memory</text><text x="300" y="123.1" font-size="8.8" text-anchor="middle" fill="#555" font-weight="normal">display, LED,</text><text x="300" y="135.1" font-size="8.8" text-anchor="middle" fill="#555" font-weight="normal">printer, DAC</text><rect x="12" y="152" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="170.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">A digital system processes information in</text><text x="20" y="185.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">binary form (0 and 1) using electronic circuits.</text><text x="20" y="200.4" font-size="9.8" text-anchor="start" fill="#7B2CD9" font-weight="normal">Examples: computer, calculator, mobile phone,</text><text x="20" y="215.4" font-size="9.8" text-anchor="start" fill="#7B2CD9" font-weight="normal">digital watch, digital camera, ATM.</text></svg>