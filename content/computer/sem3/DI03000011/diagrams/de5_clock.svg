<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="330" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Clock Signal and Triggering</text><text x="44" y="94.7" font-size="10.5" text-anchor="end" fill="#222" font-weight="bold">CLK</text><path d="M52 96.5 L340 96.5" fill="none" stroke="#EEE" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M52.0 96.0 L100.0 96.0 L100.0 60.0 L148.0 60.0 L148.0 96.0 L196.0 96.0 L196.0 60.0 L244.0 60.0 L244.0 96.0 L292.0 96.0 L292.0 60.0 L340.0 60.0" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M96.5 72 L100 66 L103.5 72 Z" fill="#2E7D32"/><path d="M100 66 L100 80" fill="none" stroke="#2E7D32" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="96" y="65.2" font-size="9" text-anchor="end" fill="#2E7D32" font-weight="bold">rising (+ve) edge</text><text x="196" y="115.2" font-size="9" text-anchor="middle" fill="#C62828" font-weight="bold">falling (−ve) edge</text><path d="M144.5 94 L148 100 L151.5 94 Z" fill="#C62828"/><text x="124" y="57.0" font-size="8.6" text-anchor="middle" fill="#666" font-weight="normal">HIGH (1)</text><text x="76" y="91.0" font-size="8.6" text-anchor="middle" fill="#666" font-weight="normal">LOW</text><path d="M100 126 L196 126" fill="none" stroke="#1565C0" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M190 122.5 L196 126 L190 129.5 Z" fill="#1565C0"/><path d="M106 122.5 L100 126 L106 129.5 Z" fill="#1565C0"/><text x="148" y="141.3" font-size="9.5" text-anchor="middle" fill="#1565C0" font-weight="bold">Period T,  f = 1/T</text><rect x="12" y="158" width="336" height="30" rx="6" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.1"/><text x="22" y="176.7" font-size="10.5" text-anchor="start" fill="#2E7D32" font-weight="bold">Level triggered</text><text x="338" y="176.5" font-size="10" text-anchor="end" fill="#222" font-weight="normal">acts while CLK = 1</text><rect x="12" y="194" width="336" height="30" rx="6" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="22" y="212.7" font-size="10.5" text-anchor="start" fill="#1565C0" font-weight="bold">Positive edge triggered</text><text x="338" y="212.5" font-size="10" text-anchor="end" fill="#222" font-weight="normal">acts at 0 → 1 change</text><rect x="12" y="230" width="336" height="30" rx="6" fill="#FDECEC" stroke="#C62828" stroke-width="1.1"/><text x="22" y="248.7" font-size="10.5" text-anchor="start" fill="#C62828" font-weight="bold">Negative edge triggered</text><text x="338" y="248.5" font-size="10" text-anchor="end" fill="#222" font-weight="normal">acts at 1 → 0 change</text><rect x="12" y="270" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="288.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Synchronous: all FFs change together with the clock.</text><text x="20" y="303.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Asynchronous: outputs change as soon as inputs</text><text x="20" y="318.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">change (no common clock).</text></svg>