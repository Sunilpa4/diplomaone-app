<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 344" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="344" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Sequential Circuit: Block Diagram</text><rect x="110" y="46" width="140" height="64" rx="8" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.8"/><text x="180" y="76.0" font-size="11.5" text-anchor="middle" fill="#4A148C" font-weight="bold">Combinational</text><text x="180" y="92.0" font-size="11.5" text-anchor="middle" fill="#4A148C" font-weight="bold">Circuit</text><rect x="110" y="160" width="140" height="56" rx="8" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.8"/><text x="180" y="186.0" font-size="11.5" text-anchor="middle" fill="#1565C0" font-weight="bold">Memory Elements</text><text x="180" y="201.5" font-size="10" text-anchor="middle" fill="#1565C0" font-weight="normal">(Flip-flops)</text><path d="M40.0 64.0 L110.0 64.0" fill="none" stroke="#222" stroke-width="1.6" stroke-linejoin="round"/><path d="M104 60.5 L110 64 L104 67.5 Z" fill="#222"/><text x="36" y="71.8" font-size="11" text-anchor="end" fill="#222" font-weight="bold">X1</text><path d="M40.0 92.0 L110.0 92.0" fill="none" stroke="#222" stroke-width="1.6" stroke-linejoin="round"/><path d="M104 88.5 L110 92 L104 95.5 Z" fill="#222"/><text x="36" y="99.8" font-size="11" text-anchor="end" fill="#222" font-weight="bold">Xn</text><path d="M250.0 64.0 L320.0 64.0" fill="none" stroke="#222" stroke-width="1.6" stroke-linejoin="round"/><path d="M314 60.5 L320 64 L314 67.5 Z" fill="#222"/><text x="324" y="71.8" font-size="11" text-anchor="start" fill="#222" font-weight="bold">Z1</text><path d="M250.0 92.0 L320.0 92.0" fill="none" stroke="#222" stroke-width="1.6" stroke-linejoin="round"/><path d="M314 88.5 L320 92 L314 95.5 Z" fill="#222"/><text x="324" y="99.8" font-size="11" text-anchor="start" fill="#222" font-weight="bold">Zm</text><text x="60" y="85.2" font-size="9" text-anchor="middle" fill="#666" font-weight="normal">inputs</text><text x="300" y="85.2" font-size="9" text-anchor="middle" fill="#666" font-weight="normal">outputs</text><path d="M230.0 110.0 L230.0 160.0" fill="none" stroke="#222" stroke-width="1.6" stroke-linejoin="round"/><path d="M226.5 154 L230 160 L233.5 154 Z" fill="#222"/><text x="236" y="143.2" font-size="9" text-anchor="start" fill="#666" font-weight="normal">next state</text><path d="M130.0 160.0 L130.0 110.0" fill="none" stroke="#222" stroke-width="1.6" stroke-linejoin="round"/><path d="M126.5 116 L130 110 L133.5 116 Z" fill="#222"/><text x="124" y="143.2" font-size="9" text-anchor="end" fill="#666" font-weight="normal">present state</text><text x="180" y="143.3" font-size="9.5" text-anchor="middle" fill="#C62828" font-weight="bold">feedback</text><path d="M180.0 246.0 L180.0 216.0" fill="none" stroke="#222" stroke-width="1.6" stroke-linejoin="round"/><path d="M176.5 222 L180 216 L183.5 222 Z" fill="#222"/><text x="180" y="263.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="bold">Clock</text><rect x="12" y="272" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="290.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Output depends on present inputs AND past state.</text><text x="20" y="305.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Memory stores the past state (flip-flops).</text><text x="20" y="320.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Feedback path from memory to the logic.</text><text x="20" y="335.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Examples: registers, counters, memory.</text></svg>