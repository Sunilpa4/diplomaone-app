<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 410" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="410" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Steps of K-map Simplification (SOP)</text><rect x="140.0" y="28.0" width="80" height="24" rx="12.0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.8"/><text x="180" y="43.9" font-size="11" text-anchor="middle" fill="#1B5E20" font-weight="bold">Start</text><path d="M180 52 L180 70" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,70.0 183.5,63.0 176.5,63.0" fill="#222"/><rect x="55.0" y="68.0" width="250" height="40" rx="7" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="92.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal"></text><text x="180" y="86.6" font-size="10.4" text-anchor="middle" fill="#222" font-weight="bold">1. Draw map with 2ⁿ cells</text><text x="180" y="101.2" font-size="9.2" text-anchor="middle" fill="#555" font-weight="normal">(Gray code order)</text><path d="M180 108 L180 126" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,126.0 183.5,119.0 176.5,119.0" fill="#222"/><rect x="55.0" y="124.0" width="250" height="40" rx="7" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="148.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal"></text><text x="180" y="142.6" font-size="10.4" text-anchor="middle" fill="#222" font-weight="bold">2. Write 1 for each minterm, X for</text><text x="180" y="157.2" font-size="9.2" text-anchor="middle" fill="#555" font-weight="normal">don't-cares, 0 elsewhere</text><path d="M180 164 L180 182" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,182.0 183.5,175.0 176.5,175.0" fill="#222"/><rect x="55.0" y="180.0" width="250" height="40" rx="7" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="204.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal"></text><text x="180" y="198.6" font-size="10.4" text-anchor="middle" fill="#222" font-weight="bold">3. Group 1s: octets, then quads,</text><text x="180" y="213.2" font-size="9.2" text-anchor="middle" fill="#555" font-weight="normal">pairs, singles (largest first)</text><path d="M180 220 L180 238" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,238.0 183.5,231.0 176.5,231.0" fill="#222"/><rect x="55.0" y="236.0" width="250" height="40" rx="7" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="260.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal"></text><text x="180" y="254.6" font-size="10.4" text-anchor="middle" fill="#222" font-weight="bold">4. Every 1 covered at least once;</text><text x="180" y="269.2" font-size="9.2" text-anchor="middle" fill="#555" font-weight="normal">use fewest, largest groups</text><path d="M180 276 L180 294" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,294.0 183.5,287.0 176.5,287.0" fill="#222"/><rect x="55.0" y="292.0" width="250" height="40" rx="7" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="316.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal"></text><text x="180" y="310.6" font-size="10.4" text-anchor="middle" fill="#222" font-weight="bold">5. Write the term of each group</text><text x="180" y="325.2" font-size="9.2" text-anchor="middle" fill="#555" font-weight="normal">(keep variables that don't change)</text><path d="M180 332 L180 350" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,350.0 183.5,343.0 176.5,343.0" fill="#222"/><rect x="55.0" y="348.0" width="250" height="40" rx="7" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="372.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal"></text><text x="180" y="366.6" font-size="10.4" text-anchor="middle" fill="#222" font-weight="bold">6. OR all terms: minimal SOP</text><text x="180" y="381.2" font-size="9.2" text-anchor="middle" fill="#555" font-weight="normal">then draw with gates</text></svg>