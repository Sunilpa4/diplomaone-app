<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 228" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="228" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Decimal Fraction to Binary: Multiply by 2</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="40" y="63.2" font-size="12" text-anchor="start" fill="#222" font-weight="bold">0.625 × 2</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="170" y="63.2" font-size="12" text-anchor="start" fill="#222" font-weight="normal">= 1.25</text><rect x="262" y="46" width="34" height="26" rx="4" fill="#FFF6D6" stroke="#E07B00" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="279" y="63.2" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">1</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="40" y="97.2" font-size="12" text-anchor="start" fill="#222" font-weight="bold">0.25 × 2</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="170" y="97.2" font-size="12" text-anchor="start" fill="#222" font-weight="normal">= 0.5</text><rect x="262" y="80" width="34" height="26" rx="4" fill="#FFF6D6" stroke="#E07B00" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="279" y="97.2" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">0</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="40" y="131.2" font-size="12" text-anchor="start" fill="#222" font-weight="bold">0.5 × 2</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="170" y="131.2" font-size="12" text-anchor="start" fill="#222" font-weight="normal">= 1</text><rect x="262" y="114" width="34" height="26" rx="4" fill="#FFF6D6" stroke="#E07B00" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="279" y="131.2" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">1</text><text x="279" y="39.1" font-size="9" text-anchor="middle" fill="#E07B00" font-weight="bold">integer</text><path d="M318 50 L318 138" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="318.0,138.0 321.5,131.0 314.5,131.0" fill="#2E7D32"/><text x="326" y="102.3" font-size="9.4" text-anchor="start" fill="#2E7D32" font-weight="bold">read</text><text x="326" y="115.3" font-size="9.4" text-anchor="start" fill="#2E7D32" font-weight="bold">down</text><rect x="12" y="154" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="172.4" font-size="9.8" text-anchor="start" fill="#2E7D32" font-weight="normal">(0.625)₁₀ = (0.101)₂</text><text x="20" y="187.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">Multiply the fraction by 2; the integer part</text><text x="20" y="202.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">is the next bit. Stop at 0 (or after 4-6 bits).</text><text x="20" y="217.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">0.1 and 0.3 never end: answer is approximate.</text></svg>