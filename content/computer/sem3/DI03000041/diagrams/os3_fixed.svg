<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="420" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Fixed Partitions: Internal Fragmentation</text><defs><pattern id="hx" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#FFF6D6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#E0A800" stroke-width="2"/></pattern></defs><rect x="70" y="36" width="150" height="30" rx="0" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.3"/><text x="145.0" y="54.4" font-size="9.6" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Operating system</text><rect x="70" y="66" width="150" height="32" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="64" y="85.2" font-size="9" text-anchor="end" fill="#666" font-weight="bold">50 KB</text><rect x="70" y="66" width="150" height="14" rx="0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="145.0" y="76.2" font-size="9" text-anchor="middle" fill="#2E7D32" font-weight="bold">J1 = 20 KB</text><rect x="70" y="80" width="150" height="18" fill="url(#hx)" stroke="#E0A800" stroke-width="1.2"/><rect x="111.0" y="82.0" width="68" height="14" rx="3" fill="#fff" opacity="0.9"/><text x="145.0" y="91.9" font-size="8.4" text-anchor="middle" fill="#8A6400" font-weight="bold">30 KB waste</text><text x="226" y="85.1" font-size="8.8" text-anchor="start" fill="#8A6400" font-weight="bold">wasted 30</text><rect x="70" y="98" width="150" height="60" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="64" y="131.2" font-size="9" text-anchor="end" fill="#666" font-weight="bold">300 KB</text><rect x="70" y="98" width="150" height="40.0" rx="0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="145.0" y="121.2" font-size="9" text-anchor="middle" fill="#2E7D32" font-weight="bold">J2 = 200 KB</text><rect x="70" y="138.0" width="150" height="20.0" fill="url(#hx)" stroke="#E0A800" stroke-width="1.2"/><rect x="111.0" y="141.0" width="68" height="14" rx="3" fill="#fff" opacity="0.9"/><text x="145.0" y="150.9" font-size="8.4" text-anchor="middle" fill="#8A6400" font-weight="bold">100 KB waste</text><text x="226" y="131.1" font-size="8.8" text-anchor="start" fill="#8A6400" font-weight="bold">wasted 100</text><rect x="70" y="158" width="150" height="36" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="64" y="179.2" font-size="9" text-anchor="end" fill="#666" font-weight="bold">75 KB</text><rect x="70" y="158" width="150" height="24.0" rx="0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="145.0" y="173.2" font-size="9" text-anchor="middle" fill="#2E7D32" font-weight="bold">J4 = 50 KB</text><text x="226" y="179.1" font-size="8.8" text-anchor="start" fill="#8A6400" font-weight="bold">wasted 25</text><rect x="70" y="194" width="150" height="84" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="64" y="239.2" font-size="9" text-anchor="end" fill="#666" font-weight="bold">700 KB</text><rect x="70" y="194" width="150" height="60.0" rx="0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="145.0" y="227.2" font-size="9" text-anchor="middle" fill="#2E7D32" font-weight="bold">J3 = 500 KB</text><rect x="70" y="254.0" width="150" height="24.0" fill="url(#hx)" stroke="#E0A800" stroke-width="1.2"/><rect x="111.0" y="259.0" width="68" height="14" rx="3" fill="#fff" opacity="0.9"/><text x="145.0" y="268.9" font-size="8.4" text-anchor="middle" fill="#8A6400" font-weight="bold">200 KB waste</text><text x="226" y="239.1" font-size="8.8" text-anchor="start" fill="#8A6400" font-weight="bold">wasted 200</text><rect x="70" y="278" width="150" height="40" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="64" y="301.1" font-size="9" text-anchor="end" fill="#666" font-weight="bold">100 KB</text><text x="145.0" y="301.1" font-size="8.8" text-anchor="middle" fill="#666" font-weight="normal">free (too small for J5)</text><text x="180" y="337.5" font-size="10" text-anchor="middle" fill="#8A6400" font-weight="bold">Total internal fragmentation = 355 KB</text><rect x="12" y="348" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="366.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Memory is divided into fixed partitions at boot time.</text><text x="20" y="381.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Each partition holds exactly one process (MFT).</text><text x="20" y="396.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Space left inside a partition is wasted: internal</text><text x="20" y="411.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">fragmentation. Degree of multiprogramming = partitions.</text></svg>