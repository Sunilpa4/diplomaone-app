<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 316" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="316" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Address Translation in Segmentation</text><rect x="12.0" y="64.0" width="48" height="40" rx="7" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.6"/><text x="36" y="88.0" font-size="11.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">CPU</text><rect x="74" y="70" width="30" height="28" rx="0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.3"/><text x="89" y="87.8" font-size="11" text-anchor="middle" fill="#2E7D32" font-weight="bold">s</text><rect x="104" y="70" width="30" height="28" rx="0" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.3"/><text x="119" y="87.8" font-size="11" text-anchor="middle" fill="#1565C0" font-weight="bold">d</text><rect x="52" y="140" width="120" height="70" rx="0" fill="#fff" stroke="#7B2CD9" stroke-width="1.4"/><text x="141" y="200.9" font-size="8.4" text-anchor="middle" fill="#7B2CD9" font-weight="bold">segment table</text><rect x="52" y="164" width="60" height="22" rx="0" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.2"/><text x="82" y="178.3" font-size="9.4" text-anchor="middle" fill="#7B2CD9" font-weight="bold">base</text><rect x="112" y="164" width="60" height="22" rx="0" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.2"/><text x="142" y="178.3" font-size="9.4" text-anchor="middle" fill="#7B2CD9" font-weight="bold">limit</text><path d="M89 98 L89 162" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="89.0,162.0 92.5,155.0 85.5,155.0" fill="#2E7D32"/><text x="82" y="127.5" font-size="10" text-anchor="end" fill="#2E7D32" font-weight="bold">s</text><polygon points="214,62 246,84 214,106 182,84" fill="#FFF6D6" stroke="#E07B00" stroke-width="1.5"/><text x="214" y="87.0" font-size="8.6" text-anchor="middle" fill="#E07B00" font-weight="bold">d&lt;lim</text><path d="M134 84 L182 84" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="182.0,84.0 175.0,80.5 175.0,87.5" fill="#1565C0"/><path d="M172 175 L214 175 L214 108" fill="none" stroke="#E07B00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="214.0,108.0 210.5,115.0 217.5,115.0" fill="#E07B00"/><text x="220" y="147.0" font-size="8.6" text-anchor="start" fill="#E07B00" font-weight="bold">limit</text><circle cx="290" cy="84" r="12" fill="#fff" stroke="#1565C0" stroke-width="1.5"/><text x="290" y="88.9" font-size="14" text-anchor="middle" fill="#1565C0" font-weight="bold">+</text><path d="M246 84 L278 84" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="278.0,84.0 271.0,80.5 271.0,87.5" fill="#2E7D32"/><text x="262" y="77.7" font-size="10.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">yes</text><path d="M82 186 L82 230 L290 230 L290 96" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="290.0,96.0 286.5,103.0 293.5,103.0" fill="#1565C0"/><text x="250" y="225.0" font-size="8.6" text-anchor="middle" fill="#1565C0" font-weight="bold">base</text><path d="M302 84 L340 84" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="340.0,84.0 333.0,80.5 333.0,87.5" fill="#222"/><text x="340" y="100.9" font-size="8.4" text-anchor="end" fill="#C62828" font-weight="bold">physical</text><path d="M214 62 L214 44 L250 44" fill="none" stroke="#C62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="250.0,44.0 243.0,40.5 243.0,47.5" fill="#C62828"/><text x="204" y="55.7" font-size="10.5" text-anchor="middle" fill="#C62828" font-weight="bold">no</text><rect x="250.0" y="33.0" width="92" height="22" rx="7" fill="#FDECEC" stroke="#C62828" stroke-width="1.6"/><text x="296" y="47.3" font-size="9.4" text-anchor="middle" fill="#C62828" font-weight="bold">trap: error</text><rect x="12" y="244" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="262.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">1. Use s to index the segment table → (base, limit).</text><text x="20" y="277.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">2. If d ≥ limit → trap (addressing error).</text><text x="20" y="292.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">3. Else physical address = base + d.</text><text x="20" y="307.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">E.g. (2, 53): base 4300 → 4300 + 53 = 4353.</text></svg>