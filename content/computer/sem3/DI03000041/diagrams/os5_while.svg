<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 364" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="364" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">while loop</text><rect x="140.0" y="35.0" width="80" height="26" rx="13.0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.8"/><text x="180" y="51.7" font-size="10.5" text-anchor="middle" fill="#1B5E20" font-weight="bold">Start</text><path d="M180 61 L180 78" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,78.0 183.5,71.0 176.5,71.0" fill="#222"/><rect x="130.0" y="78.0" width="100" height="28" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.8"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="95.5" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">i=1</text><path d="M180 106 L180 122" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,122.0 183.5,115.0 176.5,115.0" fill="#222"/><polygon points="180,122.0 247.0,150 180,178.0 113.0,150" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.8"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="153.5" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">[ $i -le 5 ]</text><path d="M180 178 L180 200" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,200.0 183.5,193.0 176.5,193.0" fill="#222"/><text x="188" y="194.7" font-size="10.5" text-anchor="start" fill="#2E7D32" font-weight="bold">true</text><rect x="120.0" y="200.0" width="120" height="28" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.8"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="217.5" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">echo $i</text><path d="M180 228 L180 244" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,244.0 183.5,237.0 176.5,237.0" fill="#222"/><rect x="120.0" y="244.0" width="120" height="28" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.8"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="261.5" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">i=$((i+1))</text><path d="M120 258 L70 258 L70 150 L113 150" fill="none" stroke="#666" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="113.0,150.0 106.0,146.5 106.0,153.5" fill="#666"/><path d="M247 150 L300 150 L300 296 L226 296" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="226.0,296.0 233.0,299.5 233.0,292.5" fill="#222"/><text x="276" y="145.7" font-size="10.5" text-anchor="middle" fill="#C62828" font-weight="bold">false</text><rect x="134.0" y="283.0" width="92" height="26" rx="13.0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.8"/><text x="180" y="299.7" font-size="10.5" text-anchor="middle" fill="#1B5E20" font-weight="bold">done</text><rect x="12" y="318" width="336" height="40" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="336.1" font-size="9" text-anchor="start" fill="#222" font-weight="normal">i=1</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="351.1" font-size="9" text-anchor="start" fill="#222" font-weight="normal">while [ $i -le 5 ]; do echo $i; i=$((i+1)); done</text></svg>