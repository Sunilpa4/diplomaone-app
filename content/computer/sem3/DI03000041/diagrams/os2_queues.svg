<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 334" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="334" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Queueing Diagram of Process Scheduling</text><text x="16" y="35.3" font-size="9.4" text-anchor="start" fill="#1565C0" font-weight="bold">ready queue</text><rect x="30" y="37" width="26" height="26" rx="0" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><rect x="56" y="37" width="26" height="26" rx="0" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><rect x="82" y="37" width="26" height="26" rx="0" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><rect x="108" y="37" width="26" height="26" rx="0" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><rect x="134" y="37" width="26" height="26" rx="0" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><path d="M160 50 L212 50" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="212.0,50.0 205.0,46.5 205.0,53.5" fill="#222"/><circle cx="236" cy="50" r="22" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.8"/><text x="236" y="53.9" font-size="11" text-anchor="middle" fill="#7B2CD9" font-weight="bold">CPU</text><path d="M258 50 L340 50" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="340.0,50.0 333.0,46.5 333.0,53.5" fill="#222"/><text x="318" y="43.1" font-size="9" text-anchor="middle" fill="#C62828" font-weight="bold">exit</text><path d="M290 50 L290 238" fill="none" stroke="#222" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="168.0" y="86.0" width="116" height="28" rx="7" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.6"/><text x="226" y="103.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">I/O request</text><rect x="36.0" y="86.0" width="112" height="28" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.6"/><text x="92" y="103.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">I/O queue → I/O</text><path d="M290 100 L284 100" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="284.0,100.0 291.0,103.5 291.0,96.5" fill="#222"/><path d="M168 100 L148 100" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="148.0,100.0 155.0,103.5 155.0,96.5" fill="#222"/><path d="M36 100 L14 100" fill="none" stroke="#222" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M290 146 L14 146" fill="none" stroke="#222" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="170" y="141.2" font-size="9.2" text-anchor="middle" fill="#1565C0" font-weight="bold">time slice expired</text><rect x="168.0" y="178.0" width="116" height="28" rx="7" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.6"/><text x="226" y="195.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">fork a child</text><rect x="36.0" y="178.0" width="112" height="28" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.6"/><text x="92" y="195.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">child executes</text><path d="M290 192 L284 192" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="284.0,192.0 291.0,195.5 291.0,188.5" fill="#222"/><path d="M168 192 L148 192" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="148.0,192.0 155.0,195.5 155.0,188.5" fill="#222"/><path d="M36 192 L14 192" fill="none" stroke="#222" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="168.0" y="224.0" width="116" height="28" rx="7" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.6"/><text x="226" y="241.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">wait for an interrupt</text><rect x="36.0" y="224.0" width="112" height="28" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.6"/><text x="92" y="241.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">interrupt occurs</text><path d="M290 238 L284 238" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="284.0,238.0 291.0,241.5 291.0,234.5" fill="#222"/><path d="M168 238 L148 238" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="148.0,238.0 155.0,241.5 155.0,234.5" fill="#222"/><path d="M36 238 L14 238" fill="none" stroke="#222" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 238 L14 50" fill="none" stroke="#222" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 50 L30 50" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="30.0,50.0 23.0,46.5 23.0,53.5" fill="#222"/><rect x="12" y="262" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="280.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">New processes enter the job queue and then the ready</text><text x="20" y="295.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">queue. A running process may leave the CPU for I/O,</text><text x="20" y="310.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">time-out, a child or an interrupt, and then comes</text><text x="20" y="325.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">back to the ready queue until it exits.</text></svg>