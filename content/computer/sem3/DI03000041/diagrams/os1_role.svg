<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 368" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="368" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">OS: Interface between User and Hardware</text><circle cx="110" cy="41" r="5" fill="#1565C0"/><path d="M101 57 Q110 42 119 57 Z" fill="#1565C0"/><text x="110" y="73.2" font-size="9" text-anchor="middle" fill="#666" font-weight="normal">User 1</text><circle cx="180" cy="41" r="5" fill="#1565C0"/><path d="M171 57 Q180 42 189 57 Z" fill="#1565C0"/><text x="180" y="73.2" font-size="9" text-anchor="middle" fill="#666" font-weight="normal">User 2</text><circle cx="250" cy="41" r="5" fill="#1565C0"/><path d="M241 57 Q250 42 259 57 Z" fill="#1565C0"/><text x="250" y="73.2" font-size="9" text-anchor="middle" fill="#666" font-weight="normal">User 3</text><path d="M180 76 L180 92" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,92.0 183.5,85.0 176.5,85.0" fill="#222"/><rect x="40" y="94" width="280" height="50" rx="8" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.5"/><text x="180" y="114.0" font-size="11.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">Application Programs</text><text x="180" y="131.3" font-size="9.5" text-anchor="middle" fill="#666" font-weight="normal">browser, compiler, MS Word, games</text><path d="M180 144 L180 160" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,160.0 183.5,153.0 176.5,153.0" fill="#222"/><rect x="40" y="162" width="280" height="54" rx="8" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="2"/><text x="180" y="186.6" font-size="13" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Operating System</text><text x="180" y="205.3" font-size="9.5" text-anchor="middle" fill="#666" font-weight="normal">kernel + system programs</text><path d="M180 216 L180 232" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,232.0 183.5,225.0 176.5,225.0" fill="#222"/><rect x="40" y="234" width="280" height="50" rx="8" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.5"/><text x="180" y="256.0" font-size="11.5" text-anchor="middle" fill="#1565C0" font-weight="bold">Computer Hardware</text><text x="180" y="273.3" font-size="9.5" text-anchor="middle" fill="#666" font-weight="normal">CPU, memory, disk, I/O devices</text><rect x="12" y="296" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="314.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">OS = interface between user and hardware.</text><text x="20" y="329.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">OS = resource manager (CPU, memory, files, I/O).</text><text x="20" y="344.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">OS = control program: runs and controls user programs.</text><text x="20" y="359.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Examples: Windows, Linux, macOS, Android, iOS.</text></svg>