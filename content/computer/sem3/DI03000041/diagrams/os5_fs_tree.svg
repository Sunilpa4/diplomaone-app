<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 332" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="332" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Linux Directory Hierarchy</text><rect x="18" y="40" width="36" height="22" rx="5" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.5"/><text x="36" y="54.9" font-size="11" text-anchor="middle" fill="#7B2CD9" font-weight="bold">/</text><path d="M36 62 L36 303" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M36 78 L64 78" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><rect x="64" y="68" width="52" height="20" rx="4" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.3"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="90" y="81.3" font-size="9.4" text-anchor="middle" fill="#7B2CD9" font-weight="bold">/bin</text><text x="124" y="81.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">essential commands (ls, cp, cat)</text><path d="M36 103 L64 103" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><rect x="64" y="93" width="52" height="20" rx="4" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.3"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="90" y="106.3" font-size="9.4" text-anchor="middle" fill="#7B2CD9" font-weight="bold">/boot</text><text x="124" y="106.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">kernel and boot loader files</text><path d="M36 128 L64 128" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><rect x="64" y="118" width="52" height="20" rx="4" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.3"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="90" y="131.3" font-size="9.4" text-anchor="middle" fill="#7B2CD9" font-weight="bold">/dev</text><text x="124" y="131.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">device files (sda, tty)</text><path d="M36 153 L64 153" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><rect x="64" y="143" width="52" height="20" rx="4" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.3"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="90" y="156.3" font-size="9.4" text-anchor="middle" fill="#7B2CD9" font-weight="bold">/etc</text><text x="124" y="156.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">configuration files (passwd)</text><path d="M36 178 L64 178" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><rect x="64" y="168" width="52" height="20" rx="4" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.3"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="90" y="181.3" font-size="9.4" text-anchor="middle" fill="#7B2CD9" font-weight="bold">/home</text><text x="124" y="181.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">users' home dirs (/home/student)</text><path d="M36 203 L64 203" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><rect x="64" y="193" width="52" height="20" rx="4" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.3"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="90" y="206.3" font-size="9.4" text-anchor="middle" fill="#7B2CD9" font-weight="bold">/lib</text><text x="124" y="206.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">shared libraries</text><path d="M36 228 L64 228" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><rect x="64" y="218" width="52" height="20" rx="4" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.3"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="90" y="231.3" font-size="9.4" text-anchor="middle" fill="#7B2CD9" font-weight="bold">/root</text><text x="124" y="231.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">home of the superuser</text><path d="M36 253 L64 253" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><rect x="64" y="243" width="52" height="20" rx="4" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.3"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="90" y="256.3" font-size="9.4" text-anchor="middle" fill="#7B2CD9" font-weight="bold">/tmp</text><text x="124" y="256.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">temporary files</text><path d="M36 278 L64 278" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><rect x="64" y="268" width="52" height="20" rx="4" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.3"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="90" y="281.3" font-size="9.4" text-anchor="middle" fill="#7B2CD9" font-weight="bold">/usr</text><text x="124" y="281.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">user programs (/usr/bin, /usr/lib)</text><path d="M36 303 L64 303" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><rect x="64" y="293" width="52" height="20" rx="4" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.3"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="90" y="306.3" font-size="9.4" text-anchor="middle" fill="#7B2CD9" font-weight="bold">/var</text><text x="124" y="306.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">variable data (logs, mail)</text></svg>