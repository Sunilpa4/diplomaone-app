<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 372" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="372" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Linux: Layers</text><circle cx="180" cy="150" r="118" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.6"/><circle cx="180" cy="150" r="88" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.6"/><circle cx="180" cy="150" r="58" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.6"/><circle cx="180" cy="150" r="28" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="157.3" font-size="9.4" text-anchor="middle" fill="#1565C0" font-weight="bold">Hardware</text><text x="180" y="113.5" font-size="10" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Kernel</text><text x="180" y="83.5" font-size="10" text-anchor="middle" fill="#E07B00" font-weight="bold">Shell</text><text x="180" y="53.5" font-size="10" text-anchor="middle" fill="#2E7D32" font-weight="bold">Applications</text><rect x="12" y="278" width="336" height="85" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="296.3" font-size="9.4" text-anchor="start" fill="#7B2CD9" font-weight="normal">Linux: free, open-source, Unix-like OS (Linus Torvalds, 1991).</text><text x="20" y="311.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">Monolithic but modular kernel; GPL licence.</text><text x="20" y="326.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">Multi-user, multitasking, secure, portable.</text><text x="20" y="341.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">Distributions: Ubuntu, Fedora, Debian, Mint, RHEL.</text><text x="20" y="356.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">Runs servers, supercomputers, Android phones.</text></svg>