e-width="1.4"/><text x="266" y="55.9" font-size="11" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Multithreaded</text><rect x="194" y="62" width="48" height="24" rx="0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="218" y="77.4" font-size="9.6" text-anchor="middle" fill="#2E7D32" font-weight="bold">code</text><rect x="242" y="62" width="48" height="24" rx="0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="266" y="77.4" font-size="9.6" text-anchor="middle" fill="#2E7D32" font-weight="bold">data</text><rect x="290" y="62" width="48" height="24" rx="0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="314" y="77.4" font-size="9.6" text-anchor="middle" fill="#2E7D32" font-weight="bold">files</text><rect x="194.0" y="92" width="48.0" height="22" rx="0" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="218.0" y="106.0" font-size="8.6" text-anchor="middle" fill="#1565C0" font-weight="bold">regs</text><rect x="194.0" y="114" width="48.0" height="22" rx="0" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="218.0" y="128.0" font-size="8.6" text-anchor="middle" fill="#1565C0" font-weight="bold">stack</text><path d="M218.0 144 Q224.0 150 218.0 156 Q212.0 162 218.0 168 Q224.0 174 218.0 180 Q212.0 186 218.0 192 Q224.0 198 218.0 204 Q212.0 210 218.0 216" fill="none" stroke="#C62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="242.0" y="92" width="48.0" height="22" rx="0" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="266.0" y="106.0" font-size="8.6" text-anchor="middle" fill="#1565C0" font-weight="bold">regs</text><rect x="242.0" y="114" width="48.0" height="22" rx="0" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="266.0" y="128.0" font-size="8.6" text-anchor="middle" fill="#1565C0" font-weight="bold">stack</text><path d="M266.0 144 Q272.0 150 266.0 156 Q260.0 162 266.0 168 Q272.0 174 266.0 180 Q260.0 186 266.0 192 Q272.0 198 266.0 204 Q260.0 210 266.0 216" fill="none" stroke="#C62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="290.0" y="92" width="48.0" height="22" rx="0" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="314.0" y="106.0" font-size="8.6" text-anchor="middle" fill="#1565C0" font-weight="bold">regs</text><rect x="290.0" y="114" width="48.0" height="22" rx="0" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="314.0" y="128.0" font-size="8.6" text-anchor="middle" fill="#1565C0" font-weight="bold">stack</text><path d="M314.0 144 Q320.0 150 314.0 156 Q308.0 162 314.0 168 Q320.0 174 314.0 180 Q308.0 186 314.0 192 Q320.0 198 314.0 204 Q308.0 210 314.0 216" fill="none" stroke="#C62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="266" y="225.3" font-size="9.4" text-anchor="middle" fill="#C62828" font-weight="bold">3 threads</text><rect x="12" y="240" width="336" height="85" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="258.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Thread = light-weight process: a unit of CPU use.</text><text x="20" y="273.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Threads of a process share code, data and files;</text><text x="20" y="288.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">each thread has its own registers, PC and stack.</text><text x="20" y="303.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Benefits: responsiveness, resource sharing, economy,</text><text x="20" y="318.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">use of multi-core CPUs. Example: browser tabs.</text></svg>