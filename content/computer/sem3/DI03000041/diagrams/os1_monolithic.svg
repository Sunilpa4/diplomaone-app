<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 400" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="400" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Monolithic Kernel Structure</text><rect x="10" y="32" width="340" height="62" rx="6" fill="#F7F7F7" stroke="#999" stroke-width="1"/><text x="16" y="47.0" font-size="8.6" text-anchor="start" fill="#999" font-weight="bold">USER MODE</text><rect x="39.0" y="53.0" width="62" height="26" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.6"/><text x="70" y="69.4" font-size="9.8" text-anchor="middle" fill="#2E7D32" font-weight="bold">App 1</text><rect x="113.0" y="53.0" width="62" height="26" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.6"/><text x="144" y="69.4" font-size="9.8" text-anchor="middle" fill="#2E7D32" font-weight="bold">App 2</text><rect x="187.0" y="53.0" width="62" height="26" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.6"/><text x="218" y="69.4" font-size="9.8" text-anchor="middle" fill="#2E7D32" font-weight="bold">Shell</text><rect x="261.0" y="53.0" width="62" height="26" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.6"/><text x="292" y="69.4" font-size="9.8" text-anchor="middle" fill="#2E7D32" font-weight="bold">App 3</text><rect x="30.0" y="100.0" width="300" height="24" rx="7" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.6"/><text x="180" y="115.5" font-size="10" text-anchor="middle" fill="#222" font-weight="bold">System call interface</text><rect x="10" y="132" width="340" height="158" rx="6" fill="#FBF8FF" stroke="#7B2CD9" stroke-width="1"/><text x="16" y="147.0" font-size="8.6" text-anchor="start" fill="#7B2CD9" font-weight="bold">KERNEL MODE</text><rect x="30" y="150" width="300" height="128" rx="8" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="2"/><text x="180" y="169.7" font-size="10.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">One large kernel (single program)</text><rect x="44.0" y="180.0" width="128" height="24" rx="7" fill="#fff" stroke="#C9B3EC" stroke-width="1.6"/><text x="108" y="195.4" font-size="9.6" text-anchor="middle" fill="#222" font-weight="normal">Process mgmt</text><rect x="188.0" y="180.0" width="128" height="24" rx="7" fill="#fff" stroke="#C9B3EC" stroke-width="1.6"/><text x="252" y="195.4" font-size="9.6" text-anchor="middle" fill="#222" font-weight="normal">Memory mgmt</text><rect x="44.0" y="210.0" width="128" height="24" rx="7" fill="#fff" stroke="#C9B3EC" stroke-width="1.6"/><text x="108" y="225.4" font-size="9.6" text-anchor="middle" fill="#222" font-weight="normal">File system</text><rect x="188.0" y="210.0" width="128" height="24" rx="7" fill="#fff" stroke="#C9B3EC" stroke-width="1.6"/><text x="252" y="225.4" font-size="9.6" text-anchor="middle" fill="#222" font-weight="normal">Device drivers</text><rect x="44.0" y="240.0" width="128" height="24" rx="7" fill="#fff" stroke="#C9B3EC" stroke-width="1.6"/><text x="108" y="255.4" font-size="9.6" text-anchor="middle" fill="#222" font-weight="normal">Networking</text><rect x="188.0" y="240.0" width="128" height="24" rx="7" fill="#fff" stroke="#C9B3EC" stroke-width="1.6"/><text x="252" y="255.4" font-size="9.6" text-anchor="middle" fill="#222" font-weight="normal">IPC</text><rect x="30.0" y="293.0" width="300" height="26" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="309.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="bold">Hardware</text><rect x="12" y="328" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="346.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">All OS services run together in kernel space.</text><text x="20" y="361.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">+ Fast (direct function calls), simple design.</text><text x="20" y="376.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">− One bug can crash the whole system; hard to extend.</text><text x="20" y="391.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Examples: MS-DOS, Unix, Linux (modular monolithic).</text></svg>