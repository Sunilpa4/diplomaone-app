<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 374" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="374" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Layered Structure</text><rect x="10.0" y="36.0" width="300" height="28" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.6"/><text x="160" y="53.5" font-size="10" text-anchor="middle" fill="#2E7D32" font-weight="bold">Layer 5: User programs / interface</text><rect x="10.0" y="70.0" width="300" height="28" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="160" y="87.5" font-size="10" text-anchor="middle" fill="#1565C0" font-weight="bold">Layer 4: I/O management</text><rect x="10.0" y="104.0" width="300" height="28" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="160" y="121.5" font-size="10" text-anchor="middle" fill="#1565C0" font-weight="bold">Layer 3: Operator–process communication</text><rect x="10.0" y="138.0" width="300" height="28" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="160" y="155.5" font-size="10" text-anchor="middle" fill="#1565C0" font-weight="bold">Layer 2: Memory management</text><rect x="10.0" y="172.0" width="300" height="28" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="160" y="189.5" font-size="10" text-anchor="middle" fill="#1565C0" font-weight="bold">Layer 1: CPU scheduling</text><rect x="10.0" y="206.0" width="300" height="28" rx="7" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.6"/><text x="160" y="223.5" font-size="10" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Layer 0: Hardware</text><path d="M326 60 L326 214" fill="none" stroke="#C62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="326.0,214.0 329.5,207.0 322.5,207.0" fill="#C62828"/><text x="334" y="143.2" font-size="9" text-anchor="start" fill="#C62828" font-weight="normal">uses</text><text x="334" y="155.2" font-size="9" text-anchor="start" fill="#C62828" font-weight="normal">lower</text><rect x="12" y="250" width="336" height="115" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="268.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">OS is divided into layers; layer 0 = hardware, top</text><text x="20" y="283.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">layer = user interface.</text><text x="20" y="298.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Each layer uses only the services of the layer below</text><text x="20" y="313.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">it and gives services to the layer above.</text><text x="20" y="328.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">+ Easy to build, debug and verify, layer by layer.</text><text x="20" y="343.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">− Hard to define layers; slower (many layers to cross).</text><text x="20" y="358.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Example: THE OS (Dijkstra), Windows NT (partly).</text></svg>