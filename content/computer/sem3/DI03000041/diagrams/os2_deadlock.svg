<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 296" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="296" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Deadlock: Circular Wait</text><circle cx="90" cy="80" r="20" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="90" y="83.4" font-size="9.6" text-anchor="middle" fill="#1565C0" font-weight="bold">P1</text><circle cx="270" cy="180" r="20" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="270" y="183.4" font-size="9.6" text-anchor="middle" fill="#1565C0" font-weight="bold">P2</text><rect x="247.0" y="65.0" width="46" height="30" rx="3" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.6"/><circle cx="270.0" cy="83" r="2.6" fill="#E07B00"/><text x="297.0" y="83.3" font-size="9.4" text-anchor="start" fill="#E07B00" font-weight="bold">R1</text><rect x="67.0" y="165.0" width="46" height="30" rx="3" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.6"/><circle cx="90.0" cy="183" r="2.6" fill="#E07B00"/><text x="63.0" y="183.3" font-size="9.4" text-anchor="end" fill="#E07B00" font-weight="bold">R2</text><path d="M246.0 80.0 L111.0 80.0" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="111.0,80.0 118.0,83.5 118.0,76.5" fill="#2E7D32"/><text x="180" y="73.3" font-size="9.4" text-anchor="middle" fill="#2E7D32" font-weight="bold">R1 held by P1</text><path d="M90.0 101.0 L90.0 164.0" fill="none" stroke="#C62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="90.0,164.0 93.5,157.0 86.5,157.0" fill="#C62828"/><text x="84" y="133.3" font-size="9.4" text-anchor="end" fill="#C62828" font-weight="bold">P1 waits</text><text x="84" y="145.3" font-size="9.4" text-anchor="end" fill="#C62828" font-weight="bold">for R2</text><path d="M114.0 180.0 L249.0 180.0" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="249.0,180.0 242.0,176.5 242.0,183.5" fill="#2E7D32"/><text x="180" y="201.3" font-size="9.4" text-anchor="middle" fill="#2E7D32" font-weight="bold">R2 held by P2</text><path d="M270.0 159.0 L270.0 96.0" fill="none" stroke="#C62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="270.0,96.0 266.5,103.0 273.5,103.0" fill="#C62828"/><text x="276" y="133.3" font-size="9.4" text-anchor="start" fill="#C62828" font-weight="bold">P2 waits</text><text x="276" y="145.3" font-size="9.4" text-anchor="start" fill="#C62828" font-weight="bold">for R1</text><text x="180" y="135.5" font-size="10" text-anchor="middle" fill="#7B2CD9" font-weight="bold">cycle</text><rect x="12" y="224" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="242.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Each process holds one resource and waits for the</text><text x="20" y="257.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">resource held by the other: neither can continue.</text><text x="20" y="272.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Example: two trains on one track, or two cars on a</text><text x="20" y="287.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">one-lane bridge from opposite sides.</text></svg>