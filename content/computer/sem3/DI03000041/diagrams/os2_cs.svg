<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="340" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">General Structure of a Process (CS)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="52" y="53.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="bold">do {</text><rect x="40" y="68" width="280" height="28" rx="4" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.3"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="52" y="85.7" font-size="10.5" text-anchor="start" fill="#E07B00" font-weight="bold">    entry section</text><rect x="40" y="100" width="280" height="28" rx="4" fill="#FDECEC" stroke="#C62828" stroke-width="1.3"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="52" y="117.7" font-size="10.5" text-anchor="start" fill="#C62828" font-weight="bold">        critical section</text><rect x="40" y="132" width="280" height="28" rx="4" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.3"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="52" y="149.7" font-size="10.5" text-anchor="start" fill="#2E7D32" font-weight="bold">    exit section</text><rect x="40" y="164" width="280" height="28" rx="4" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.3"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="52" y="181.7" font-size="10.5" text-anchor="start" fill="#1565C0" font-weight="bold">        remainder section</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="52" y="213.7" font-size="10.5" text-anchor="start" fill="#222" font-weight="bold">} while (true);</text><rect x="12" y="234" width="336" height="96" rx="8" fill="#FBF8FF" stroke="#7B2CD9" stroke-width="1.3"/><text x="180" y="251.7" font-size="10.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Requirements of a solution</text><text x="20" y="269.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="bold">1. Mutual exclusion</text><text x="130" y="269.1" font-size="9" text-anchor="start" fill="#222" font-weight="normal">only one process in its CS at a time.</text><text x="20" y="283.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="bold">2. Progress</text><text x="130" y="283.1" font-size="9" text-anchor="start" fill="#222" font-weight="normal">if no one is in the CS, a waiting process</text><text x="20" y="297.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="bold"></text><text x="130" y="297.1" font-size="9" text-anchor="start" fill="#222" font-weight="normal">must be allowed to enter without delay.</text><text x="20" y="311.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="bold">3. Bounded waiting</text><text x="130" y="311.1" font-size="9" text-anchor="start" fill="#222" font-weight="normal">a limit on how many times others enter</text><text x="20" y="325.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="bold"></text><text x="130" y="325.1" font-size="9" text-anchor="start" fill="#222" font-weight="normal">before a waiting process gets its turn.</text></svg>