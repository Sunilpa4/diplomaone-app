<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 346" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="346" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Process State Diagram (5 States)</text><ellipse cx="52" cy="58" rx="38.0" ry="16.0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.7"/><text x="52" y="61.7" font-size="10.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">New</text><ellipse cx="308" cy="58" rx="46.0" ry="16.0" fill="#FDECEC" stroke="#C62828" stroke-width="1.7"/><text x="308" y="61.5" font-size="10" text-anchor="middle" fill="#C62828" font-weight="bold">Terminated</text><ellipse cx="88" cy="150" rx="40.0" ry="17.0" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.7"/><text x="88" y="153.7" font-size="10.5" text-anchor="middle" fill="#1565C0" font-weight="bold">Ready</text><ellipse cx="272" cy="150" rx="42.0" ry="17.0" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.7"/><text x="272" y="153.7" font-size="10.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Running</text><ellipse cx="180" cy="246" rx="42.0" ry="17.0" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.7"/><text x="180" y="249.7" font-size="10.5" text-anchor="middle" fill="#E07B00" font-weight="bold">Waiting</text><path d="M62 74 L80 133" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="80.0,133.0 81.3,125.3 74.6,127.3" fill="#222"/><text x="40" y="107.2" font-size="9" text-anchor="start" fill="#2E7D32" font-weight="bold">admitted</text><path d="M120 136 Q180 106 236 136" fill="none" stroke="#7B2CD9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><polygon points="236.0,136.0 231.5,129.6 228.2,135.8" fill="#7B2CD9"/><text x="180" y="111.2" font-size="9" text-anchor="middle" fill="#7B2CD9" font-weight="bold">scheduler dispatch</text><path d="M236 164 Q180 194 124 164" fill="none" stroke="#1565C0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><polygon points="124.0,164.0 128.5,170.4 131.8,164.2" fill="#1565C0"/><text x="180" y="193.2" font-size="9" text-anchor="middle" fill="#1565C0" font-weight="bold">interrupt (time up)</text><path d="M284 133 L300 75" fill="none" stroke="#C62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="300.0,75.0 294.8,80.8 301.5,82.7" fill="#C62828"/><text x="300" y="109.2" font-size="9" text-anchor="start" fill="#C62828" font-weight="bold">exit</text><path d="M268 168 L212 232" fill="none" stroke="#E07B00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="212.0,232.0 219.2,229.0 214.0,224.4" fill="#E07B00"/><text x="258" y="219.2" font-size="9" text-anchor="start" fill="#E07B00" font-weight="bold">I/O or event</text><text x="258" y="231.2" font-size="9" text-anchor="start" fill="#E07B00" font-weight="bold">wait</text><path d="M148 232 L94 168" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="94.0,168.0 95.8,175.6 101.2,171.1" fill="#2E7D32"/><text x="18" y="217.2" font-size="9" text-anchor="start" fill="#2E7D32" font-weight="bold">I/O or event</text><text x="18" y="229.2" font-size="9" text-anchor="start" fill="#2E7D32" font-weight="bold">completion</text><rect x="12" y="274" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="292.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">New: being created.  Ready: waiting for the CPU.</text><text x="20" y="307.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Running: instructions are executing.</text><text x="20" y="322.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Waiting: waiting for I/O or an event.</text><text x="20" y="337.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Terminated: finished execution.</text></svg>