<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 338" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="338" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Process in Memory</text><text x="30" y="41.0" font-size="8.6" text-anchor="end" fill="#666" font-weight="normal">max</text><rect x="36" y="40" width="104" height="44" rx="0" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.4"/><text x="88" y="65.7" font-size="10.5" text-anchor="middle" fill="#1565C0" font-weight="bold">Stack</text><text x="152" y="59.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">function calls, local variables,</text><text x="152" y="72.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">return addresses</text><rect x="36" y="84" width="104" height="56" rx="0" fill="#FFFFFF" stroke="#BBB" stroke-width="1.4"/><text x="88" y="115.7" font-size="10.5" text-anchor="middle" fill="#BBB" font-weight="bold">free</text><path d="M88 88 L88 102" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="88.0,102.0 91.5,95.0 84.5,95.0" fill="#1565C0"/><path d="M88 136 L88 122" fill="none" stroke="#E07B00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="88.0,122.0 84.5,129.0 91.5,129.0" fill="#E07B00"/><text x="152" y="115.2" font-size="9.2" text-anchor="start" fill="#666" font-weight="normal">stack and heap grow</text><rect x="36" y="140" width="104" height="40" rx="0" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.4"/><text x="88" y="163.7" font-size="10.5" text-anchor="middle" fill="#E07B00" font-weight="bold">Heap</text><text x="152" y="157.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">memory allocated at run time</text><text x="152" y="170.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">(malloc / new)</text><rect x="36" y="180" width="104" height="36" rx="0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.4"/><text x="88" y="201.7" font-size="10.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">Data</text><text x="152" y="201.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">global and static variables</text><rect x="36" y="216" width="104" height="36" rx="0" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.4"/><text x="88" y="237.7" font-size="10.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Text (code)</text><text x="152" y="237.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">program instructions</text><text x="30" y="255.0" font-size="8.6" text-anchor="end" fill="#666" font-weight="normal">0</text><rect x="12" y="266" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="284.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Program = passive entity (file on disk).</text><text x="20" y="299.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Process = program in execution (active entity).</text><text x="20" y="314.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">A process also has a program counter, registers</text><text x="20" y="329.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">and a PCB kept by the OS.</text></svg>