<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 326" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="326" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Time-Sharing (Multitasking) OS</text><path d="M180 120 L95.1 76.2" fill="none" stroke="#C9B3EC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="61.14718625761431" y="60.15937956643404" width="68" height="32" rx="6" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.3"/><text x="95.14718625761431" y="79.7" font-size="10" text-anchor="middle" fill="#1565C0" font-weight="bold">User 1</text><path d="M180 120 L264.9 76.2" fill="none" stroke="#C9B3EC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="230.8528137423857" y="60.159379566434055" width="68" height="32" rx="6" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.3"/><text x="264.8528137423857" y="79.7" font-size="10" text-anchor="middle" fill="#1565C0" font-weight="bold">User 2</text><path d="M180 120 L264.9 163.8" fill="none" stroke="#C9B3EC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="230.8528137423857" y="147.84062043356596" width="68" height="32" rx="6" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.3"/><text x="264.8528137423857" y="167.3" font-size="10" text-anchor="middle" fill="#1565C0" font-weight="bold">User 3</text><path d="M180 120 L95.1 163.8" fill="none" stroke="#C9B3EC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="61.14718625761431" y="147.84062043356596" width="68" height="32" rx="6" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.3"/><text x="95.14718625761431" y="167.3" font-size="10" text-anchor="middle" fill="#1565C0" font-weight="bold">User 4</text><circle cx="180" cy="120" r="34" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="2"/><text x="180" y="118.0" font-size="11.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">CPU</text><text x="180" y="132.2" font-size="9" text-anchor="middle" fill="#666" font-weight="normal">shared</text><text x="180" y="207.5" font-size="10" text-anchor="middle" fill="#666" font-weight="bold">Time slices (quantum q) given in turn</text><rect x="28" y="214" width="38" height="26" rx="0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="47" y="230.4" font-size="9.6" text-anchor="middle" fill="#2E7D32" font-weight="bold">U1</text><rect x="66" y="214" width="38" height="26" rx="0" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><text x="85" y="230.4" font-size="9.6" text-anchor="middle" fill="#1565C0" font-weight="bold">U2</text><rect x="104" y="214" width="38" height="26" rx="0" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.2"/><text x="123" y="230.4" font-size="9.6" text-anchor="middle" fill="#E07B00" font-weight="bold">U3</text><rect x="142" y="214" width="38" height="26" rx="0" fill="#FDECEC" stroke="#C62828" stroke-width="1.2"/><text x="161" y="230.4" font-size="9.6" text-anchor="middle" fill="#C62828" font-weight="bold">U4</text><rect x="180" y="214" width="38" height="26" rx="0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="199" y="230.4" font-size="9.6" text-anchor="middle" fill="#2E7D32" font-weight="bold">U1</text><rect x="218" y="214" width="38" height="26" rx="0" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><text x="237" y="230.4" font-size="9.6" text-anchor="middle" fill="#1565C0" font-weight="bold">U2</text><rect x="256" y="214" width="38" height="26" rx="0" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.2"/><text x="275" y="230.4" font-size="9.6" text-anchor="middle" fill="#E07B00" font-weight="bold">U3</text><rect x="294" y="214" width="38" height="26" rx="0" fill="#FDECEC" stroke="#C62828" stroke-width="1.2"/><text x="313" y="230.4" font-size="9.6" text-anchor="middle" fill="#C62828" font-weight="bold">U4</text><text x="332" y="231.2" font-size="12" text-anchor="start" fill="#222" font-weight="normal">…</text><rect x="12" y="254" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="272.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">CPU time is divided into small slices (e.g. 10–100 ms).</text><text x="20" y="287.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">The OS switches quickly between users / programs,</text><text x="20" y="302.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">so each user feels the computer is dedicated to him.</text><text x="20" y="317.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Goal: minimum response time. Example: Unix, Linux.</text></svg>