" font-size="10" text-anchor="end" fill="#222" font-weight="bold">J3</text><path d="M168 137 L343.0 137" fill="none" stroke="#EEE" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="168.0" y="64" width="35.0" height="18" rx="3" fill="#7B2CD9" stroke="#7B2CD9" stroke-width="1.2"/><text x="185.5" y="75.9" font-size="8.4" text-anchor="middle" fill="#fff" font-weight="bold">CPU</text><rect x="203.0" y="64" width="52.5" height="18" rx="3" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.2"/><text x="229.25" y="75.9" font-size="8.4" text-anchor="middle" fill="#E07B00" font-weight="bold">I/O</text><rect x="203.0" y="96" width="35.0" height="18" rx="3" fill="#7B2CD9" stroke="#7B2CD9" stroke-width="1.2"/><text x="220.5" y="107.9" font-size="8.4" text-anchor="middle" fill="#fff" font-weight="bold">CPU</text><rect x="238.0" y="96" width="52.5" height="18" rx="3" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.2"/><text x="264.25" y="107.9" font-size="8.4" text-anchor="middle" fill="#E07B00" font-weight="bold">I/O</text><rect x="238.0" y="128" width="35.0" height="18" rx="3" fill="#7B2CD9" stroke="#7B2CD9" stroke-width="1.2"/><text x="255.5" y="139.9" font-size="8.4" text-anchor="middle" fill="#fff" font-weight="bold">CPU</text><rect x="273.0" y="128" width="35.0" height="18" rx="3" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.2"/><text x="290.5" y="139.9" font-size="8.4" text-anchor="middle" fill="#E07B00" font-weight="bold">I/O</text><rect x="273.0" y="64" width="35.0" height="18" rx="3" fill="#7B2CD9" stroke="#7B2CD9" stroke-width="1.2"/><text x="290.5" y="75.9" font-size="8.4" text-anchor="middle" fill="#fff" font-weight="bold">CPU</text><rect x="308.0" y="96" width="35.0" height="18" rx="3" fill="#7B2CD9" stroke="#7B2CD9" stroke-width="1.2"/><text x="325.5" y="107.9" font-size="8.4" text-anchor="middle" fill="#fff" font-weight="bold">CPU</text><path d="M168 160 L343.0 160" fill="none" stroke="#222" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M168.0 160 L168.0 164" fill="none" stroke="#222" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="168.0" y="176.0" font-size="8.6" text-anchor="middle" fill="#666" font-weight="normal">0</text><path d="M203.0 160 L203.0 164" fill="none" stroke="#222" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="203.0" y="176.0" font-size="8.6" text-anchor="middle" fill="#666" font-weight="normal">2</text><path d="M238.0 160 L238.0 164" fill="none" stroke="#222" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="238.0" y="176.0" font-size="8.6" text-anchor="middle" fill="#666" font-weight="normal">4</text><path d="M273.0 160 L273.0 164" fill="none" stroke="#222" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="273.0" y="176.0" font-size="8.6" text-anchor="middle" fill="#666" font-weight="normal">6</text><path d="M308.0 160 L308.0 164" fill="none" stroke="#222" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="308.0" y="176.0" font-size="8.6" text-anchor="middle" fill="#666" font-weight="normal">8</text><path d="M343.0 160 L343.0 164" fill="none" stroke="#222" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="343.0" y="176.0" font-size="8.6" text-anchor="middle" fill="#666" font-weight="normal">10</text><text x="255.5" y="190.2" font-size="9" text-anchor="middle" fill="#2E7D32" font-weight="bold">time →  (CPU is never idle)</text><rect x="12" y="240" width="336" height="85" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="258.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Several jobs are kept in memory at the same time.</text><text x="20" y="273.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">When the running job waits for I/O, the OS switches</text><text x="20" y="288.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">the CPU to another job.</text><text x="20" y="303.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Goal: maximum CPU utilisation. Single CPU, one job</text><text x="20" y="318.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">runs at a time.</text></svg>