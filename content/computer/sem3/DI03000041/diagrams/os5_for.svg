d" stroke-linejoin="round"/><polygon points="116.0,114.0 109.0,110.5 109.0,117.5" fill="#666"/><path d="M244 114 L300 114 L300 262 L226 262" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="226.0,262.0 233.0,265.5 233.0,258.5" fill="#222"/><text x="282" y="109.7" font-size="10.5" text-anchor="middle" fill="#C62828" font-weight="bold">no</text><rect x="134.0" y="249.0" width="92" height="26" rx="13.0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.8"/><text x="180" y="265.7" font-size="10.5" text-anchor="middle" fill="#1B5E20" font-weight="bold">done</text><rect x="12" y="284" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="302.1" font-size="9" text-anchor="start" fill="#222" font-weight="normal">for i in 1 2 3 4 5; do echo $i; done</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="317.1" font-size="9" text-anchor="start" fill="#222" font-weight="normal">for f in *.txt; do wc -l $f; done</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="332.1" font-size="9" text-anchor="start" fill="#222" font-weight="normal">for (( i=1; i&lt;=5; i++ )); do echo $i; done</text></svg>