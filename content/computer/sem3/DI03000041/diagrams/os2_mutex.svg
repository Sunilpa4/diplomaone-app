<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 296" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="296" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Mutual Exclusion using Critical Regions</text><text x="62" y="79.4" font-size="9.6" text-anchor="end" fill="#2E7D32" font-weight="bold">Process A</text><text x="62" y="139.4" font-size="9.6" text-anchor="end" fill="#1565C0" font-weight="bold">Process B</text><path d="M70 76 L330.0 76" fill="none" stroke="#CCC" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M70 136 L330.0 136" fill="none" stroke="#CCC" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="109.0" y="64" width="104.0" height="24" rx="3" fill="#2E7D32" stroke="#2E7D32" stroke-width="1"/><text x="161.0" y="79.2" font-size="9" text-anchor="middle" fill="#fff" font-weight="bold">A in critical region</text><rect x="148.0" y="124" width="65.0" height="24" rx="3" fill="#fff" stroke="#C62828" stroke-width="1.3"/><text x="180.5" y="139.2" font-size="9" text-anchor="middle" fill="#C62828" font-weight="bold">B blocked</text><rect x="213.0" y="124" width="104.0" height="24" rx="3" fill="#1565C0" stroke="#1565C0" stroke-width="1"/><text x="265.0" y="139.0" font-size="8.6" text-anchor="middle" fill="#fff" font-weight="bold">B in critical region</text><path d="M109.0 54 L109.0 166" fill="none" stroke="#7B2CD9" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><text x="109.0" y="179.3" font-size="9.4" text-anchor="middle" fill="#7B2CD9" font-weight="bold">T1</text><path d="M148.0 54 L148.0 166" fill="none" stroke="#7B2CD9" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><text x="148.0" y="179.3" font-size="9.4" text-anchor="middle" fill="#7B2CD9" font-weight="bold">T2</text><path d="M213.0 54 L213.0 166" fill="none" stroke="#7B2CD9" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><text x="213.0" y="179.3" font-size="9.4" text-anchor="middle" fill="#7B2CD9" font-weight="bold">T3</text><path d="M317.0 54 L317.0 166" fill="none" stroke="#7B2CD9" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><text x="317.0" y="179.3" font-size="9.4" text-anchor="middle" fill="#7B2CD9" font-weight="bold">T4</text><text x="200.0" y="199.2" font-size="9" text-anchor="middle" fill="#666" font-weight="normal">time →</text><rect x="12" y="208" width="336" height="85" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="226.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Mutual exclusion: if one process is using a shared</text><text x="20" y="241.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">variable or file, other processes are kept out.</text><text x="20" y="256.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Methods: disabling interrupts, lock variable, strict</text><text x="20" y="271.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">alternation, Peterson's solution, TSL instruction,</text><text x="20" y="286.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">semaphores and mutex locks.</text></svg>