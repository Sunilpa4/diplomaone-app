<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 226" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="226" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Unix File Permissions (rwx)</text><rect x="40" y="46" width="28" height="30" rx="0" fill="#EEE" stroke="#666" stroke-width="1.3"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="54.0" y="66.2" font-size="15" text-anchor="middle" fill="#666" font-weight="bold">-</text><rect x="68" y="46" width="28" height="30" rx="0" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.3"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="82.0" y="66.2" font-size="15" text-anchor="middle" fill="#1565C0" font-weight="bold">r</text><rect x="96" y="46" width="28" height="30" rx="0" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.3"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="110.0" y="66.2" font-size="15" text-anchor="middle" fill="#1565C0" font-weight="bold">w</text><rect x="124" y="46" width="28" height="30" rx="0" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.3"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="138.0" y="66.2" font-size="15" text-anchor="middle" fill="#1565C0" font-weight="bold">x</text><rect x="152" y="46" width="28" height="30" rx="0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.3"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="166.0" y="66.2" font-size="15" text-anchor="middle" fill="#2E7D32" font-weight="bold">r</text><rect x="180" y="46" width="28" height="30" rx="0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.3"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="194.0" y="66.2" font-size="15" text-anchor="middle" fill="#2E7D32" font-weight="bold">-</text><rect x="208" y="46" width="28" height="30" rx="0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.3"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="222.0" y="66.2" font-size="15" text-anchor="middle" fill="#2E7D32" font-weight="bold">x</text><rect x="236" y="46" width="28" height="30" rx="0" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.3"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="250.0" y="66.2" font-size="15" text-anchor="middle" fill="#E07B00" font-weight="bold">r</text><rect x="264" y="46" width="28" height="30" rx="0" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.3"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="278.0" y="66.2" font-size="15" text-anchor="middle" fill="#E07B00" font-weight="bold">-</text><rect x="292" y="46" width="28" height="30" rx="0" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.3"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="306.0" y="66.2" font-size="15" text-anchor="middle" fill="#E07B00" font-weight="bold">-</text><path d="M43 82 L65 82" fill="none" stroke="#666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="54.0" y="99.3" font-size="9.4" text-anchor="middle" fill="#666" font-weight="bold">Type</text><path d="M71 82 L149 82" fill="none" stroke="#1565C0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="110.0" y="99.3" font-size="9.4" text-anchor="middle" fill="#1565C0" font-weight="bold">Owner (u)</text><text x="110.0" y="115.0" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">rwx = 4+2+1 = 7</text><path d="M155 82 L233 82" fill="none" stroke="#2E7D32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="194.0" y="99.3" font-size="9.4" text-anchor="middle" fill="#2E7D32" font-weight="bold">Group (g)</text><text x="194.0" y="115.0" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">r-x = 4+0+1 = 5</text><path d="M239 82 L317 82" fill="none" stroke="#E07B00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="278.0" y="99.3" font-size="9.4" text-anchor="middle" fill="#E07B00" font-weight="bold">Others (o)</text><text x="278.0" y="115.0" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">r-- = 4+0+0 = 4</text><text x="52" y="115.0" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">- / d</text><rect x="95.0" y="127.0" width="170" height="26" rx="7" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.6"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="143.8" font-size="11" text-anchor="middle" fill="#7B2CD9" font-weight="bold">chmod 754 report.txt</text><rect x="12" y="166" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="184.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">r = read (4), w = write (2), x = execute (1).</text><text x="20" y="199.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">Access types: read, write, execute, append, delete, list.</text><text x="20" y="214.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">Other methods: access-control list (ACL), passwords.</text></svg>