<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 292" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="292" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Acyclic-Graph Directory</text><path d="M180 60 L90 90" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M180 60 L270 90" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M90 110 L40 140" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M90 110 L100 140" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M90 110 L180 140" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M270 110 L180 140" fill="none" stroke="#C62828" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><path d="M270 110 L250 140" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M270 110 L312 140" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M312 160 L312 190" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><rect x="160.2" y="40" width="39.6" height="20" rx="5" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.5"/><text x="180" y="53.4" font-size="9.6" text-anchor="middle" fill="#7B2CD9" font-weight="bold">root</text><rect x="70.2" y="90" width="39.6" height="20" rx="5" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.5"/><text x="90" y="103.4" font-size="9.6" text-anchor="middle" fill="#7B2CD9" font-weight="bold">dict</text><rect x="247.0" y="90" width="46.0" height="20" rx="5" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.5"/><text x="270" y="103.4" font-size="9.6" text-anchor="middle" fill="#7B2CD9" font-weight="bold">spell</text><ellipse cx="40" cy="150" rx="19.2" ry="10" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.3"/><text x="40" y="153.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">all</text><ellipse cx="100" cy="150" rx="12.4" ry="10" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.3"/><text x="100" y="153.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">w</text><ellipse cx="180" cy="150" rx="22.6" ry="10" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.3"/><text x="180" y="153.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">list</text><ellipse cx="250" cy="150" rx="26.0" ry="10" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.3"/><text x="250" y="153.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">count</text><rect x="289.0" y="140" width="46.0" height="20" rx="5" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.5"/><text x="312" y="153.4" font-size="9.6" text-anchor="middle" fill="#7B2CD9" font-weight="bold">words</text><ellipse cx="312" cy="200" rx="15.8" ry="10" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.3"/><text x="312" y="203.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">w7</text><text x="206" y="123.0" font-size="8.6" text-anchor="middle" fill="#C62828" font-weight="bold">link</text><text x="180" y="174.9" font-size="8.4" text-anchor="middle" fill="#C62828" font-weight="bold">shared file</text><rect x="12" y="222" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="240.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">A file or subdirectory can be shared: it appears in two</text><text x="20" y="255.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">directories (via a link), but no cycles are allowed.</text><text x="20" y="270.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">Problems: one file has many names (aliasing); deleting</text><text x="20" y="285.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">it may leave dangling links → use a reference count.</text></svg>