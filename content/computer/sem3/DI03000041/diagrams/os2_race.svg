e" fill="#222" font-weight="normal">counter = 6</text><rect x="12" y="184" width="36" height="22" rx="0" fill="#E3F0FC" stroke="#D9C8F0" stroke-width="1"/><text x="30.0" y="198.2" font-size="9.2" text-anchor="middle" fill="#1565C0" font-weight="normal">T5</text><rect x="48" y="184" width="36" height="22" rx="0" fill="#E3F0FC" stroke="#D9C8F0" stroke-width="1"/><text x="66.0" y="198.2" font-size="9.2" text-anchor="middle" fill="#1565C0" font-weight="bold">P2</text><rect x="84" y="184" width="150" height="22" rx="0" fill="#E3F0FC" stroke="#D9C8F0" stroke-width="1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="159.0" y="198.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">counter = reg2</text><rect x="234" y="184" width="114" height="22" rx="0" fill="#E3F0FC" stroke="#D9C8F0" stroke-width="1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="291.0" y="198.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="bold">counter = 4</text><text x="180" y="227.7" font-size="10.5" text-anchor="middle" fill="#C62828" font-weight="bold">Final counter = 4, but the correct value is 5!</text><rect x="12" y="240" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="258.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Race condition: the result depends on the order in</text><text x="20" y="273.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">which processes access shared data.</text><text x="20" y="288.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Solution: allow only one process at a time in the</text><text x="20" y="303.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">critical section (mutual exclusion).</text></svg>