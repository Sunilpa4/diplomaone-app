<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="320" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Internal vs External Fragmentation</text><defs><pattern id="hx" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#FFF6D6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#E0A800" stroke-width="2"/></pattern></defs><text x="90" y="43.9" font-size="11" text-anchor="middle" fill="#8A6400" font-weight="bold">Internal</text><rect x="40" y="52" width="100" height="120" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="36" y="115.1" font-size="8.8" text-anchor="end" fill="#666" font-weight="normal">100 KB</text><rect x="40" y="52" width="100" height="92" rx="0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="90" y="101.2" font-size="9" text-anchor="middle" fill="#2E7D32" font-weight="bold">process 77 KB</text><rect x="40" y="144" width="100" height="28" fill="url(#hx)" stroke="#E0A800" stroke-width="1.2"/><text x="90" y="189.2" font-size="9" text-anchor="middle" fill="#8A6400" font-weight="bold">23 KB wasted inside</text><text x="270" y="43.9" font-size="11" text-anchor="middle" fill="#C62828" font-weight="bold">External</text><rect x="220" y="52" width="100" height="26" rx="0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="270" y="68.1" font-size="8.8" text-anchor="middle" fill="#2E7D32" font-weight="bold">P1</text><rect x="220" y="78" width="100" height="30" rx="0" fill="#FDECEC" stroke="#C62828" stroke-width="1.2"/><text x="270" y="96.1" font-size="8.8" text-anchor="middle" fill="#C62828" font-weight="bold">hole 40 KB</text><rect x="220" y="108" width="100" height="22" rx="0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="270" y="122.1" font-size="8.8" text-anchor="middle" fill="#2E7D32" font-weight="bold">P2</text><rect x="220" y="130" width="100" height="22" rx="0" fill="#FDECEC" stroke="#C62828" stroke-width="1.2"/><text x="270" y="144.1" font-size="8.8" text-anchor="middle" fill="#C62828" font-weight="bold">hole 30 KB</text><rect x="220" y="152" width="100" height="20" rx="0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="270" y="165.1" font-size="8.8" text-anchor="middle" fill="#2E7D32" font-weight="bold">P3</text><rect x="220" y="172" width="100" height="22" rx="0" fill="#FDECEC" stroke="#C62828" stroke-width="1.2"/><text x="270" y="186.1" font-size="8.8" text-anchor="middle" fill="#C62828" font-weight="bold">hole 30 KB</text><text x="270" y="209.2" font-size="9" text-anchor="middle" fill="#C62828" font-weight="bold">100 KB free, but P4 (80 KB)</text><text x="270" y="222.2" font-size="9" text-anchor="middle" fill="#C62828" font-weight="bold">cannot be loaded</text><rect x="12" y="234" width="336" height="85" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="252.4" font-size="9.6" text-anchor="start" fill="#8A6400" font-weight="normal">Internal: wasted space inside an allocated block</text><text x="20" y="267.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">(fixed partitions, paging). Fix: smaller / variable blocks.</text><text x="20" y="282.4" font-size="9.6" text-anchor="start" fill="#C62828" font-weight="normal">External: total free space is enough but split into</text><text x="20" y="297.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">small non-contiguous holes (dynamic partitions).</text><text x="20" y="312.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Fix: compaction, paging or segmentation.</text></svg>