<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="340" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Modes of the vi / vim Editor</text><rect x="120.0" y="43.0" width="120" height="26" rx="7" fill="#272335" stroke="#272335" stroke-width="1.6"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="59.4" font-size="9.6" text-anchor="middle" fill="#fff" font-weight="bold">$ vi notes.txt</text><path d="M180 69 L180 104" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,104.0 183.5,97.0 176.5,97.0" fill="#222"/><rect x="105.0" y="105.0" width="150" height="42" rx="7" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="130.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal"></text><text x="180" y="123.8" font-size="11" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Command mode</text><text x="180" y="137.9" font-size="8.4" text-anchor="middle" fill="#666" font-weight="normal">(default: move, delete, copy)</text><rect x="16.0" y="225.0" width="128" height="42" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.6"/><text x="80" y="250.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal"></text><text x="80" y="243.8" font-size="11" text-anchor="middle" fill="#2E7D32" font-weight="bold">Insert mode</text><text x="80" y="257.9" font-size="8.4" text-anchor="middle" fill="#666" font-weight="normal">(type text)</text><rect x="216.0" y="225.0" width="128" height="42" rx="7" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.6"/><text x="280" y="250.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal"></text><text x="280" y="243.8" font-size="11" text-anchor="middle" fill="#E07B00" font-weight="bold">Last-line (ex)</text><text x="280" y="257.9" font-size="8.4" text-anchor="middle" fill="#666" font-weight="normal">(save, quit, search)</text><path d="M116 147 L66 225" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="66.0,225.0 72.7,221.0 66.8,217.2" fill="#2E7D32"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="62" y="183.3" font-size="9.4" text-anchor="middle" fill="#2E7D32" font-weight="bold">i a o</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="62" y="196.3" font-size="9.4" text-anchor="middle" fill="#2E7D32" font-weight="bold">I A O</text><path d="M96 225 L140 147" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="140.0,147.0 133.5,151.4 139.6,154.8" fill="#7B2CD9"/><text x="136" y="199.4" font-size="9.6" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Esc</text><path d="M220 147 L264 225" fill="none" stroke="#E07B00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="264.0,225.0 263.6,217.2 257.5,220.6" fill="#E07B00"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="226" y="200.2" font-size="12" text-anchor="middle" fill="#E07B00" font-weight="bold">:</text><path d="M294 225 L244 147" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="244.0,147.0 244.8,154.8 250.7,151.0" fill="#7B2CD9"/><text x="304" y="183.3" font-size="9.4" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Enter</text><text x="304" y="196.3" font-size="9.4" text-anchor="middle" fill="#7B2CD9" font-weight="bold">/ Esc</text><rect x="12" y="282" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="300.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">:w save   :q quit   :wq or ZZ save and quit</text><text x="20" y="315.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">:q! quit without saving    /wor