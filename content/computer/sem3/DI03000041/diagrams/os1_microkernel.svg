<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 364" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="364" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Microkernel Structure</text><rect x="10" y="32" width="340" height="96" rx="6" fill="#F7F7F7" stroke="#999" stroke-width="1"/><text x="16" y="47.0" font-size="8.6" text-anchor="start" fill="#999" font-weight="bold">USER MODE</text><rect x="18.0" y="60.0" width="76" height="40" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.6"/><text x="56" y="84.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal"></text><text x="56" y="83.4" font-size="9.6" text-anchor="middle" fill="#2E7D32" font-weight="bold">Application</text><rect x="101.0" y="60.0" width="76" height="40" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="139" y="84.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal"></text><text x="139" y="76.9" font-size="9.6" text-anchor="middle" fill="#1565C0" font-weight="bold">File</text><text x="139" y="89.9" font-size="9.6" text-anchor="middle" fill="#1565C0" font-weight="bold">server</text><rect x="184.0" y="60.0" width="76" height="40" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="222" y="84.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal"></text><text x="222" y="76.9" font-size="9.6" text-anchor="middle" fill="#1565C0" font-weight="bold">Device</text><text x="222" y="89.9" font-size="9.6" text-anchor="middle" fill="#1565C0" font-weight="bold">driver</text><rect x="267.0" y="60.0" width="76" height="40" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="305" y="84.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal"></text><text x="305" y="76.9" font-size="9.6" text-anchor="middle" fill="#1565C0" font-weight="bold">Network</text><text x="305" y="89.9" font-size="9.6" text-anchor="middle" fill="#1565C0" font-weight="bold">server</text><rect x="10" y="136" width="340" height="70" rx="6" fill="#FBF8FF" stroke="#7B2CD9" stroke-width="1"/><text x="16" y="151.0" font-size="8.6" text-anchor="start" fill="#7B2CD9" font-weight="bold">KERNEL MODE</text><rect x="50.0" y="163.0" width="276" height="34" rx="7" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.6"/><text x="188" y="183.4" font-size="9.6" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Microkernel: IPC, basic scheduling, memory</text><path d="M56 100 L56 163" fill="none" stroke="#C62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="56.0,163.0 59.5,156.0 52.5,156.0" fill="#C62828"/><path d="M139 163 L139 100" fill="none" stroke="#C62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="139.0,100.0 135.5,107.0 142.5,107.0" fill="#C62828"/><text x="97" y="119.0" font-size="8.6" text-anchor="middle" fill="#C62828" font-weight="bold">messages</text><rect x="30.0" y="217.0" width="300" height="26" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="233.7" font-size="10.5" text-anchor="middle" fill="#222" font-weight="bold">Hardware</text><rect x="12" y="254" width="336" height="100" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="272.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Only the most basic functions stay in the kernel;</text><text x="20" y="287.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">other services run as user-mode servers.</text><text x="20" y="302.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">They communicate by message passing (IPC).</text><text x="20" y="317.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">+ Reliable, secure, easy to extend and port.</text><text x="20" y="332.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">− Slower due to many messages / mode switches.</text><text x="20" y="347.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Examples: QNX, MINIX 3, L4, Mach (in macOS XNU).</text></svg>