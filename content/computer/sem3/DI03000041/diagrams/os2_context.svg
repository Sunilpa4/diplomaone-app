d="M106 108 L100 108 L100 168 L106 168" fill="none" stroke="#E07B00" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text x="96" y="140.9" font-size="8.4" text-anchor="end" fill="#E07B00" font-weight="bold">overhead</text><rect x="12" y="356" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="374.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Context = CPU registers, PC, state, memory info (PCB).</text><text x="20" y="389.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Context switch: save the context of the old process</text><text x="20" y="404.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">and load the saved context of the new process.</text><text x="20" y="419.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">It is pure overhead: no useful work is done meanwhile.</text></svg>