<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 304" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="304" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Safe, Unsafe and Deadlock States</text><ellipse cx="180" cy="120" rx="160" ry="84" fill="#FAFAFA" stroke="#999" stroke-width="1.4"/><ellipse cx="102" cy="120" rx="74" ry="60" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.6"/><text x="102" y="124.2" font-size="12" text-anchor="middle" fill="#2E7D32" font-weight="bold">Safe</text><ellipse cx="250" cy="120" rx="78" ry="64" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.6"/><text x="250" y="80.0" font-size="11.5" text-anchor="middle" fill="#E07B00" font-weight="bold">Unsafe</text><ellipse cx="256" cy="134" rx="46" ry="30" fill="#FDECEC" stroke="#C62828" stroke-width="1.6"/><text x="256" y="137.7" font-size="10.5" text-anchor="middle" fill="#C62828" font-weight="bold">Deadlock</text><rect x="12" y="216" width="336" height="85" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="234.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Safe state: a safe sequence exists in which every</text><text x="20" y="249.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">process can get its needs and finish: no deadlock.</text><text x="20" y="264.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Unsafe state: may lead to deadlock (not always).</text><text x="20" y="279.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Avoidance (Banker's algorithm) grants a request only</text><text x="20" y="294.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">if the system stays in a safe state.</text></svg>