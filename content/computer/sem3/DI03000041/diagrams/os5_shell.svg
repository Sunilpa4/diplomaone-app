<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 344" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="344" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">How the Shell Executes a Command</text><rect x="78.0" y="37.0" width="236" height="30" rx="7" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.6"/><text x="196" y="55.4" font-size="9.6" text-anchor="middle" fill="#222" font-weight="normal"></text><text x="196" y="55.4" font-size="9.6" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Display prompt  $</text><path d="M196 67.0 L196 81" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="196.0,81.0 199.5,74.0 192.5,74.0" fill="#222"/><rect x="78.0" y="81.0" width="236" height="30" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="196" y="99.4" font-size="9.6" text-anchor="middle" fill="#222" font-weight="normal"></text><text x="196" y="99.4" font-size="9.6" text-anchor="middle" fill="#1565C0" font-weight="bold">Read the command line</text><path d="M196 111.0 L196 123" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="196.0,123.0 199.5,116.0 192.5,116.0" fill="#222"/><rect x="78.0" y="123.0" width="236" height="34" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="196" y="143.4" font-size="9.6" text-anchor="middle" fill="#222" font-weight="normal"></text><text x="196" y="136.3" font-size="9.4" text-anchor="middle" fill="#1565C0" font-weight="bold">Parse: command, options, args;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="196" y="151.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">expand  *  ?  $var</text><path d="M196 157.0 L196 169" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="196.0,169.0 199.5,162.0 192.5,162.0" fill="#222"/><rect x="78.0" y="169.0" width="236" height="30" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="196" y="187.4" font-size="9.6" text-anchor="middle" fill="#222" font-weight="normal"></text><text x="196" y="187.4" font-size="9.6" text-anchor="middle" fill="#1565C0" font-weight="bold">Find command (built-in or PATH)</text><path d="M196 199.0 L196 213" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="196.0,213.0 199.5,206.0 192.5,206.0" fill="#222"/><rect x="78.0" y="213.0" width="236" height="30" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.6"/><text x="196" y="231.4" font-size="9.6" text-anchor="middle" fill="#222" font-weight="normal"></text><text x="196" y="231.4" font-size="9.6" text-anchor="middle" fill="#2E7D32" font-weight="bold">fork() a child, exec() program</text><path d="M196 243.0 L196 257" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="196.0,257.0 199.5,250.0 192.5,250.0" fill="#222"/><rect x="78.0" y="257.0" width="236" height="30" rx="7" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.6"/><text x="196" y="275.4" font-size="9.6" text-anchor="middle" fill="#222" font-weight="normal"></text><text x="196" y="275.4" font-size="9.6" text-anchor="middle" fill="#E07B00" font-weight="bold">Kernel runs it; output shown</text><path d="M78 272 L40 272 L40 52 L78 52" fill="none" stroke="#666" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="78.0,52.0 71.0,48.5 71.0,55.5" fill="#666"/><g transform="rotate(-90 30 162.0)"><text x="30" y="165.0" font-size="8.6" text-anchor="middle" fill="#666" font-weight="bold">shell waits, then repeats</text></g><rect x="12" y="298" width="336" height="40" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="316.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">Format:  command  [options]  [arguments]</text><text x="20" y="331.3" font-size="9.4" text-anchor="start" fill="#1565C0" font-weight="normal">$ ls -l /home      $ wc -l notes.txt</text></svg>