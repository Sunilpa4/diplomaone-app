<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 210" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="210" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Scheduling Times of a Process</text><path d="M30 70 L330 70" fill="none" stroke="#222" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="334.0,70.0 327.0,66.5 327.0,73.5" fill="#222"/><path d="M30 70 L30 74" fill="none" stroke="#222" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="86.0" font-size="8.6" text-anchor="middle" fill="#666" font-weight="normal">0</text><path d="M60 70 L60 74" fill="none" stroke="#222" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="86.0" font-size="8.6" text-anchor="middle" fill="#666" font-weight="normal">1</text><path d="M90 70 L90 74" fill="none" stroke="#222" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="86.0" font-size="8.6" text-anchor="middle" fill="#666" font-weight="normal">2</text><path d="M120 70 L120 74" fill="none" stroke="#222" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="86.0" font-size="8.6" text-anchor="middle" fill="#666" font-weight="normal">3</text><path d="M150 70 L150 74" fill="none" stroke="#222" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="150" y="86.0" font-size="8.6" text-anchor="middle" fill="#666" font-weight="normal">4</text><path d="M180 70 L180 74" fill="none" stroke="#222" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="180" y="86.0" font-size="8.6" text-anchor="middle" fill="#666" font-weight="normal">5</text><path d="M210 70 L210 74" fill="none" stroke="#222" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="210" y="86.0" font-size="8.6" text-anchor="middle" fill="#666" font-weight="normal">6</text><path d="M240 70 L240 74" fill="none" stroke="#222" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="240" y="86.0" font-size="8.6" text-anchor="middle" fill="#666" font-weight="normal">7</text><path d="M270 70 L270 74" fill="none" stroke="#222" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="270" y="86.0" font-size="8.6" text-anchor="middle" fill="#666" font-weight="normal">8</text><path d="M300 70 L300 74" fill="none" stroke="#222" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="300" y="86.0" font-size="8.6" text-anchor="middle" fill="#666" font-weight="normal">9</text><path d="M330 70 L330 74" fill="none" stroke="#222" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="330" y="86.0" font-size="8.6" text-anchor="middle" fill="#666" font-weight="normal">10</text><rect x="90" y="48" width="90" height="18" rx="2" fill="#fff" stroke="#E07B00" stroke-width="1.3"/><text x="135.0" y="60.1" font-size="8.8" text-anchor="middle" fill="#E07B00" font-weight="bold">waiting</text><rect x="180" y="48" width="120" height="18" rx="2" fill="#7B2CD9" stroke="#7B2CD9" stroke-width="1.3"/><text x="240" y="60.1" font-size="8.8" text-anchor="middle" fill="#fff" font-weight="bold">running on CPU</text><path d="M90 36 L90 70" fill="none" stroke="#2E7D32" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 2"/><text x="90" y="33.1" font-size="9" text-anchor="middle" fill="#2E7D32" font-weight="bold">arrival (AT=2)</text><path d="M300 36 L300 70" fill="none" stroke="#C62828" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 2"/><text x="300" y="33.1" font-size="9" text-anchor="middle" fill="#C62828" font-weight="bold">completion (CT=9)</text><path d="M90 98 L180 98" fill="none" stroke="#E07B00" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M90 94 L90 102" fill="none" stroke="#E07B00" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M180 94 L180 102" fill="none" stroke="#E07B00" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="135.0" y="112.2" font-size="9" text-anchor="middle" fill="#E07B00" font-weight="bold">WT = 3</text><path d="M180 98 L300 98" fill="none" stroke="#7B2CD9" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M180 94 L180 102" fill="none" stroke="#7B2CD9" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M300 94 L300 102" fill="none" stroke="#7B2CD9" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="240.0" y="112.2" font-size="9" text-anchor="middle" fill="#7B2CD9" font-weight="bold">BT = 4</text><path d="M90 124 L300 124" fill="none" stroke="#1565C0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M90 120 L90 128" fill="none" stroke="#1565C0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M300 120 L300 128" fill="none" stroke="#1565C0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="195.0" y="138.2" font-size="9" text-anchor="middle" fill="#1565C0" font-weight="bold">TAT = CT − AT = 9 − 2 = 7</text><rect x="12" y="152" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="170.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">TAT (turnaround time) = CT − AT</text><text x="20" y="185.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">WT (waiting time) = TAT − BT = 7 − 4 = 3</text><text x="20" y="200.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">RT (response time) = first CPU start − AT = 5 − 2 = 3</text></svg>