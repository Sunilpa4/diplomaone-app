<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 370" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="370" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Architecture of Unix / Linux</text><circle cx="180" cy="172" r="132" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.6"/><circle cx="180" cy="172" r="98" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.6"/><circle cx="180" cy="172" r="64" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><circle cx="180" cy="172" r="32" fill="#EEE" stroke="#666" stroke-width="1.6"/><text x="180" y="175.5" font-size="10" text-anchor="middle" fill="#222" font-weight="bold">Hardware</text><text x="180" y="127.7" font-size="10.5" text-anchor="middle" fill="#1565C0" font-weight="bold">Kernel</text><text x="180" y="224.9" font-size="8.4" text-anchor="middle" fill="#1565C0" font-weight="normal">system calls</text><text x="180" y="94.7" font-size="10.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">Shell</text><text x="180" y="256.9" font-size="8.4" text-anchor="middle" fill="#2E7D32" font-weight="normal">sh, bash, csh, ksh</text><text x="180" y="61.5" font-size="10" text-anchor="middle" fill="#E07B00" font-weight="bold">Utilities / Applications</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="71.93534860962055" y="214.3" font-size="8.6" text-anchor="middle" fill="#222" font-weight="bold">ls</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="65.28013422012022" y="183.0" font-size="8.6" text-anchor="middle" fill="#222" font-weight="bold">cp</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="67.51302591561236" y="151.1" font-size="8.6" text-anchor="middle" fill="#222" font-weight="bold">grep</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="78.46102682122341" y="121.0" font-size="8.6" text-anchor="middle" fill="#222" font-weight="bold">vi</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="288.0646513903795" y="214.3" font-size="8.6" text-anchor="middle" fill="#222" font-weight="bold">gcc</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="294.7198657798798" y="183.0" font-size="8.6" text-anchor="middle" fill="#222" font-weight="bold">sort</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="292.48697408438767" y="151.1" font-size="8.6" text-anchor="middle" fill="#222" font-weight="bold">who</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="281.5389731787766" y="121.0" font-size="8.6" text-anchor="middle" fill="#222" font-weight="bold">cat</text><text x="180" y="291.1" font-size="9" text-anchor="middle" fill="#E07B00" font-weight="bold">Users</text><rect x="12" y="312" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="330.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">Kernel: core; manages processes, memory, files, devices.</text><text x="20" y="345.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">Shell: command interpreter between user and kernel.</text><text x="20" y="360.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">Utilities: commands and programs used by the users.</text></svg>