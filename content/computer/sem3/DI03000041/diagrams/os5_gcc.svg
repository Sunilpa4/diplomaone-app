<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 386" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="386" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Compiling a C Program with gcc</text><rect x="26.0" y="37.0" width="132" height="30" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="92" y="56.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal"></text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="92" y="49.5" font-size="10" text-anchor="middle" fill="#1565C0" font-weight="bold">hello.c</text><text x="92" y="62.9" font-size="8.4" text-anchor="middle" fill="#666" font-weight="normal">source code</text><path d="M92 67 L92 95" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="92.0,95.0 95.5,88.0 88.5,88.0" fill="#222"/><text x="106" y="84.4" font-size="9.6" text-anchor="start" fill="#7B2CD9" font-weight="bold">Preprocessor</text><text x="194" y="84.0" font-size="8.6" text-anchor="start" fill="#222" font-weight="normal">gcc -E  (#include)</text><rect x="26.0" y="95.0" width="132" height="30" rx="7" fill="#fff" stroke="#666" stroke-width="1.6"/><text x="92" y="114.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal"></text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="92" y="107.5" font-size="10" text-anchor="middle" fill="#666" font-weight="bold">hello.i</text><text x="92" y="120.9" font-size="8.4" text-anchor="middle" fill="#666" font-weight="normal">expanded source</text><path d="M92 125 L92 153" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="92.0,153.0 95.5,146.0 88.5,146.0" fill="#222"/><text x="106" y="142.4" font-size="9.6" text-anchor="start" fill="#7B2CD9" font-weight="bold">Compiler</text><text x="194" y="142.0" font-size="8.6" text-anchor="start" fill="#222" font-weight="normal">gcc -S</text><rect x="26.0" y="153.0" width="132" height="30" rx="7" fill="#fff" stroke="#666" stroke-width="1.6"/><text x="92" y="172.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal"></text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="92" y="165.5" font-size="10" text-anchor="middle" fill="#666" font-weight="bold">hello.s</text><text x="92" y="178.9" font-size="8.4" text-anchor="middle" fill="#666" font-weight="normal">assembly code</text><path d="M92 183 L92 211" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="92.0,211.0 95.5,204.0 88.5,204.0" fill="#222"/><text x="106" y="200.4" font-size="9.6" text-anchor="start" fill="#7B2CD9" font-weight="bold">Assembler</text><text x="194" y="200.0" font-size="8.6" text-anchor="start" fill="#222" font-weight="normal">gcc -c</text><rect x="26.0" y="211.0" width="132" height="30" rx="7" fill="#fff" stroke="#666" stroke-width="1.6"/><text x="92" y="230.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal"></text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="92" y="223.5" font-size="10" text-anchor="middle" fill="#666" font-weight="bold">hello.o</text><text x="92" y="236.9" font-size="8.4" text-anchor="middle" fill="#666" font-weight="normal">object code</text><path d="M92 241 L92 269" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="92.0,269.0 95.5,262.0 88.5,262.0" fill="#222"/><text x="106" y="258.4" font-size="9.6" text-anchor="start" fill="#7B2CD9" font-weight="bold">Linker</text><text x="194" y="258.0" font-size="8.6" text-anchor="start" fill="#222" font-weight="normal">adds libraries (printf)</text><rect x="26.0" y="269.0" width="132" height="30" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.6"/><text x="92" y="288.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal"></text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="92" y="281.5" font-size="10" text-anchor="middle" fill="#2E7D32" font-weight="bold">hello</text><text x="92" y="294.9" font-size="8.4" text-anchor="middle" fill="#666" font-weight="normal">executable</text><rect x="12" y="310" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="328.3" font-size="9.4" text-anchor="start" fill="#1565C0" font-weight="normal">$ gcc hello.c -o hello</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="343.3" font-size="9.4" text-anchor="start" fill="#1565C0" font-weight="normal">$ ./hello</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="358.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">Hello, Linux!</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="373.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">Without -o the executable is named a.out.</text></svg>