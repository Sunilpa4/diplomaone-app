<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 334" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="334" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Swapping of Two Processes</text><rect x="16" y="36" width="140" height="200" rx="6" fill="#FBF8FF" stroke="#7B2CD9" stroke-width="1.4"/><text x="86" y="53.5" font-size="10" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Main memory</text><rect x="26" y="60" width="120" height="40" rx="0" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.3"/><text x="86.0" y="83.4" font-size="9.6" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Operating system</text><rect x="26" y="100" width="120" height="126" rx="0" fill="#fff" stroke="#BBB" stroke-width="1.2"/><text x="86" y="117.1" font-size="8.8" text-anchor="middle" fill="#666" font-weight="normal">user space</text><rect x="46.0" y="136.0" width="80" height="28" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.6"/><text x="86" y="153.7" font-size="10.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">P1</text><text x="86" y="203.0" font-size="8.6" text-anchor="middle" fill="#1565C0" font-weight="normal">(P2 swapped in)</text><ellipse cx="290" cy="80" rx="56" ry="12" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.4"/><rect x="234" y="80" width="112" height="120" rx="0" fill="#FFF1DE" stroke="#E07B00" stroke-width="0"/><path d="M234 80 L234 200 M346 80 L346 200" fill="none" stroke="#E07B00" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="290" cy="200" rx="56" ry="12" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.4"/><text x="290" y="107.5" font-size="10" text-anchor="middle" fill="#E07B00" font-weight="bold">Backing store</text><text x="290" y="121.0" font-size="8.6" text-anchor="middle" fill="#666" font-weight="normal">(fast disk)</text><rect x="260.0" y="134.0" width="60" height="24" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.6"/><text x="290" y="149.5" font-size="10" text-anchor="middle" fill="#2E7D32" font-weight="bold">P1</text><rect x="260.0" y="164.0" width="60" height="24" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="290" y="179.5" font-size="10" text-anchor="middle" fill="#1565C0" font-weight="bold">P2</text><path d="M128 142 L258 142" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="258.0,142.0 251.0,138.5 251.0,145.5" fill="#2E7D32"/><text x="194" y="135.3" font-size="9.4" text-anchor="middle" fill="#2E7D32" font-weight="bold">(1) swap out</text><path d="M258 176 L128 192" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="128.0,192.0 135.4,194.6 134.5,187.7" fill="#1565C0"/><text x="194" y="201.3" font-size="9.4" text-anchor="middle" fill="#1565C0" font-weight="bold">(2) swap in</text><rect x="12" y="248" width="336" height="85" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="266.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">A process can be moved temporarily out of memory to a</text><text x="20" y="281.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">backing store and brought back later to continue.</text><text x="20" y="296.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Roll out, roll in: a low-priority process is swapped</text><text x="20" y="311.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">out so that a high-priority one can run.</text><text x="20" y="326.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Swap time is mainly transfer time (∝ process size).</text></svg>