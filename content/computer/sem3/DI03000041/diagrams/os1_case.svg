<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 356" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="356" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Linux vs Windows vs macOS</text><rect x="90" y="32" width="90" height="24" rx="0" fill="#2E7D32" stroke="#2E7D32" stroke-width="1"/><text x="135.0" y="47.7" font-size="10.5" text-anchor="middle" fill="#fff" font-weight="bold">Linux</text><rect x="180" y="32" width="90" height="24" rx="0" fill="#1565C0" stroke="#1565C0" stroke-width="1"/><text x="225.0" y="47.7" font-size="10.5" text-anchor="middle" fill="#fff" font-weight="bold">Windows</text><rect x="270" y="32" width="90" height="24" rx="0" fill="#555" stroke="#555" stroke-width="1"/><text x="315.0" y="47.7" font-size="10.5" text-anchor="middle" fill="#fff" font-weight="bold">macOS</text><rect x="12" y="56" width="78" height="34" rx="0" fill="#F1E8FC" stroke="#D9C8F0" stroke-width="1"/><text x="18" y="76.2" font-size="9.2" text-anchor="start" fill="#7B2CD9" font-weight="bold">Developer</text><rect x="90" y="56" width="90" height="34" rx="0" fill="#fff" stroke="#D9C8F0" stroke-width="1"/><text x="135.0" y="70.6" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">Linus Torvalds +</text><text x="135.0" y="81.6" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">community</text><rect x="180" y="56" width="90" height="34" rx="0" fill="#fff" stroke="#D9C8F0" stroke-width="1"/><text x="225.0" y="76.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">Microsoft</text><rect x="270" y="56" width="90" height="34" rx="0" fill="#fff" stroke="#D9C8F0" stroke-width="1"/><text x="315.0" y="76.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">Apple</text><rect x="12" y="90" width="78" height="34" rx="0" fill="#F1E8FC" stroke="#D9C8F0" stroke-width="1"/><text x="18" y="110.2" font-size="9.2" text-anchor="start