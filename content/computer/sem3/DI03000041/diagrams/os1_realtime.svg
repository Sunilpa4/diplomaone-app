<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="320" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Real-Time Operating System (RTOS)</text><path d="M30 70 L330 70" fill="none" stroke="#222" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><polygon points="330.0,70.0 323.0,66.5 323.0,73.5" fill="#222"/><text x="336" y="77.5" font-size="10" text-anchor="start" fill="#222" font-weight="normal">t</text><path d="M60 44 L60 70" fill="none" stroke="#C62828" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="41.3" font-size="9.5" text-anchor="middle" fill="#C62828" font-weight="bold">event</text><rect x="84" y="52" width="120" height="18" rx="3" fill="#7B2CD9" stroke="#7B2CD9" stroke-width="1"/><text x="144" y="64.2" font-size="9" text-anchor="middle" fill="#fff" font-weight="bold">task runs</text><path d="M250 40 L250 76" fill="none" stroke="#2E7D32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><text x="250" y="37.3" font-size="9.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">deadline</text><path d="M60 86 L204 86" fill="none" stroke="#1565C0" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="204.0,86.0 198.0,83.0 198.0,89.0" fill="#1565C0"/><text x="132" y="102.2" font-size="9" text-anchor="middle" fill="#1565C0" font-weight="normal">response time</text><text x="180" y="123.4" font-size="9.8" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Result must be correct AND produced before the deadline</text><rect x="12" y="136" width="164" height="150" rx="8" fill="#FDECEC" stroke="#C62828" stroke-width="1.4"/><text x="94.0" y="154.8" font-size="11" text-anchor="middle" fill="#C62828" font-weight="bold">Hard real-time</text><text x="94.0" y="173.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">Deadline must ALWAYS</text><text x="94.0" y="187.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">be met; a miss means</text><text x="94.0" y="201.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">system failure.</text><text x="94.0" y="215.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal"></text><text x="94.0" y="229.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">Airbag, pacemaker,</text><text x="94.0" y="243.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">ABS brakes, missile</text><text x="94.0" y="257.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">and flight control</text><rect x="184" y="136" width="164" height="150" rx="8" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.4"/><text x="266.0" y="154.8" font-size="11" text-anchor="middle" fill="#2E7D32" font-weight="bold">Soft real-time</text><text x="266.0" y="173.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">Occasional deadline</text><text x="266.0" y="187.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">miss is tolerated</text><text x="266.0" y="201.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">(quality drops).</text><text x="266.0" y="215.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal"></text><text x="266.0" y="229.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">Video streaming,</text><text x="266.0" y="243.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">online games,</text><text x="266.0" y="257.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">VoIP, multimedia</text><text x="180" y="309.4" font-size="9.6" text-anchor="middle" fill="#666" font-weight="normal">RTOS examples: VxWorks, QNX, FreeRTOS, RTLinux</text></svg>