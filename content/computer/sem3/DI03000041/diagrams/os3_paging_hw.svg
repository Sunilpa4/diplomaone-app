<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="340" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Address Translation in Paging</text><rect x="12.0" y="50.0" width="48" height="40" rx="7" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.6"/><text x="36" y="74.0" font-size="11.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">CPU</text><rect x="74" y="56" width="30" height="28" rx="0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.3"/><text x="89" y="73.8" font-size="11" text-anchor="middle" fill="#2E7D32" font-weight="bold">p</text><rect x="104" y="56" width="30" height="28" rx="0" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.3"/><text x="119" y="73.8" font-size="11" text-anchor="middle" fill="#1565C0" font-weight="bold">d</text><text x="104" y="49.0" font-size="8.6" text-anchor="middle" fill="#666" font-weight="normal">logical address</text><rect x="150" y="110" width="70" height="124" rx="0" fill="#fff" stroke="#7B2CD9" stroke-width="1.4"/><text x="185" y="249.3" font-size="9.4" text-anchor="middle" fill="#7B2CD9" font-weight="bold">page table</text><rect x="150" y="166" width="70" height="22" rx="0" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.3"/><text x="185" y="180.8" font-size="11" text-anchor="middle" fill="#7B2CD9" font-weight="bold">f</text><path d="M89 84 L89 177 L148 177" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="148.0,177.0 141.0,173.5 141.0,180.5" fill="#2E7D32"/><text x="80" y="139.5" font-size="10" text-anchor="end" fill="#2E7D32" font-weight="bold">p</text><rect x="240" y="56" width="30" height="28" rx="0" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.3"/><text x="255" y="73.8" font-size="11" text-anchor="middle" fill="#7B2CD9" font-weight="bold">f</text><rect x="270" y="56" width="30" height="28" rx="0" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.3"/><text x="285" y="73.8" font-size="11" text-anchor="middle" fill="#1565C0" font-weight="bold">d</text><text x="270" y="49.0" font-size="8.6" text-anchor="middle" fill="#666" font-weight="normal">physical address</text><path d="M134 70 L238 70" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="238.0,70.0 231.0,66.5 231.0,73.5" fill="#1565C0"/><text x="186" y="65.0" font-size="8.6" text-anchor="middle" fill="#1565C0" font-weight="normal">d copied</text><path d="M222 177 L255 177 L255 86" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="255.0,86.0 251.5,93.0 258.5,93.0" fill="#7B2CD9"/><rect x="314.0" y="56.0" width="36" height="148" rx="7" fill="#F7F7F7" stroke="#888" stroke-width="1.6"/><text x="332" y="134.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal"></text><text x="332" y="218.9" font-size="8.4" text-anchor="middle" fill="#666" font-weight="normal">physical</text><text x="332" y="230.9" font-size="8.4" text-anchor="middle" fill="#666" font-weight="normal">memory</text><path d="M300 70 L314 70" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="314.0,70.0 307.0,66.5 307.0,73.5" fill="#222"/><rect x="12" y="266" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="284.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">p = page number = logical address ÷ page size</text><text x="20" y="299.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">d = offset = logical address mod page size</text><text x="20" y="314.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">f = page_table[p]</text><text x="20" y="329.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">physical address = f × page size + d</text></svg>