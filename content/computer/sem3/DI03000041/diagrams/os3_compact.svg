<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 384" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="384" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Compaction</text><text x="90" y="43.7" font-size="10.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Before</text><rect x="40" y="50" width="100" height="30" rx="0" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.3"/><text x="90" y="68.3" font-size="9.4" text-anchor="middle" fill="#7B2CD9" font-weight="bold">OS</text><rect x="40" y="80" width="100" height="40" rx="0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.3"/><text x="90" y="103.3" font-size="9.4" text-anchor="middle" fill="#2E7D32" font-weight="bold">P1</text><rect x="40" y="120" width="100" height="34" rx="0" fill="#FDECEC" stroke="#C62828" stroke-width="1.3"/><text x="90" y="140.3" font-size="9.4" text-anchor="middle" fill="#C62828" font-weight="bold">hole 40</text><rect x="40" y="154" width="100" height="36" rx="0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.3"/><text x="90" y="175.3" font-size="9.4" text-anchor="middle" fill="#2E7D32" font-weight="bold">P2</text><rect x="40" y="190" width="100" height="26" rx="0" fill="#FDECEC" stroke="#C62828" stroke-width="1.3"/><text x="90" y="206.3" font-size="9.4" text-anchor="middle" fill="#C62828" font-weight="bold">hole 30</text><rect x="40" y="216" width="100" height="40" rx="0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.3"/><text x="90" y="239.3" font-size="9.4" text-anchor="middle" fill="#2E7D32" font-weight="bold">P3</text><rect x="40" y="256" width="100" height="26" rx="0" fill="#FDECEC" stroke="#C62828" stroke-width="1.3"/><text x="90" y="272.3" font-size="9.4" text-anchor="middle" fill="#C62828" font-weight="bold">hole 30</text><text x="270" y="43.7" font-size="10.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">After</text><rect x="220" y="50" width="100" height="30" rx="0" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.3"/><text x="270" y="68.3" font-size="9.4" text-anchor="middle" fill="#7B2CD9" font-weight="bold">OS</text><rect x="220" y="80" width="100" height="40" rx="0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.3"/><text x="270" y="103.3" font-size="9.4" text-anchor="middle" fill="#2E7D32" font-weight="bold">P1</text><rect x="220" y="120" width="100" height="36" rx="0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.3"/><text x="270" y="141.3" font-size="9.4" text-anchor="middle" fill="#2E7D32" font-weight="bold">P2</text><rect x="220" y="156" width="100" height="40" rx="0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.3"/><text x="270" y="179.3" font-size="9.4" text-anchor="middle" fill="#2E7D32" font-weight="bold">P3</text><rect x="220" y="196" width="100" height="86" rx="0" fill="#fff" stroke="#2E7D32" stroke-width="1.3"/><text x="270" y="242.3" font-size="9.4" text-anchor="middle" fill="#2E7D32" font-weight="bold">free 100 KB</text><path d="M150 140 L210 140" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="210.0,140.0 203.0,136.5 203.0,143.5" fill="#7B2CD9"/><text x="180" y="131.3" font-size="9.4" text-anchor="middle" fill="#7B2CD9" font-weight="bold">move</text><rect x="12" y="296" width="336" height="85" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="314.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Shuffle memory contents so that all free holes join</text><text x="20" y="329.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">into one large contiguous block.</text><text x="20" y="344.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Possible only if relocation is dynamic (at run time).</text><text x="20" y="359.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Cost: copying memory takes CPU time; the moved</text><text x="20" y="374.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">processes must be stopped during compaction.</text></svg>