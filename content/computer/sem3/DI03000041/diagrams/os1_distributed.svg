<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 342" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="342" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Distributed Operating System</text><ellipse cx="180" cy="150" rx="70" ry="30" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.8"/><text x="180" y="148.5" font-size="10" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Communication</text><text x="180" y="162.5" font-size="10" text-anchor="middle" fill="#7B2CD9" font-weight="bold">network</text><path d="M70 70 L138.2 119.6" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M290 70 L221.8 119.6" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M70 232 L138.2 181.2" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M290 232 L221.8 181.2" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="14" y="44" width="112" height="52" rx="8" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.4"/><text x="70" y="64.7" font-size="10.5" text-anchor="middle" fill="#1565C0" font-weight="bold">Site A</text><text x="70" y="82.0" font-size="8.6" text-anchor="middle" fill="#666" font-weight="normal">CPU + memory + disk</text><rect x="234" y="44" width="112" height="52" rx="8" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.4"/><text x="290" y="64.7" font-size="10.5" text-anchor="middle" fill="#1565C0" font-weight="bold">Site B</text><text x="290" y="82.0" font-size="8.6" text-anchor="middle" fill="#666" font-weight="normal">CPU + memory + disk</text><rect x="14" y="206" width="112" height="52" rx="8" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.4"/><text x="70" y="226.7" font-size="10.5" text-anchor="middle" fill="#1565C0" font-weight="bold">Site C</text><text x="70" y="244.0" font-size="8.6" text-anchor="middle" fill="#666" font-weight="normal">CPU + memory + disk</text><rect x="234" y="206" width="112" height="52" rx="8" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.4"/><text x="290" y="226.7" font-size="10.5" text-anchor="middle" fill="#1565C0" font-weight="bold">Site D</text><text x="290" y="244.0" font-size="8.6" text-anchor="middle" fill="#666" font-weight="normal">CPU + memory + disk</text><rect x="12" y="270" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="288.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Many independent computers connected by a network,</text><text x="20" y="303.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">managed by one OS: the user sees a single system.</text><text x="20" y="318.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Advantages: resource sharing, speed-up (load sharing),</text><text x="20" y="333.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">reliability (one site fails, others work), communication.</text></svg>