<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 344" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="344" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Long, Short and Medium Term Schedulers</text><rect x="14.0" y="47.0" width="96" height="46" rx="7" fill="#F7F7F7" stroke="#888" stroke-width="1.6"/><text x="62" y="74.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal"></text><text x="62" y="66.3" font-size="9.4" text-anchor="middle" fill="#555" font-weight="bold">Job pool</text><text x="62" y="80.3" font-size="9.4" text-anchor="middle" fill="#555" font-weight="bold">(new jobs, disk)</text><rect x="150.0" y="47.0" width="92" height="46" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="196" y="74.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal"></text><text x="196" y="66.3" font-size="9.4" text-anchor="middle" fill="#1565C0" font-weight="bold">Ready queue</text><text x="196" y="80.3" font-size="9.4" text-anchor="middle" fill="#1565C0" font-weight="bold">(memory)</text><circle cx="310" cy="70" r="24" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.8"/><text x="310" y="73.8" font-size="11" text-anchor="middle" fill="#7B2CD9" font-weight="bold">CPU</text><path d="M110 70 L150 70" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="150.0,70.0 143.0,66.5 143.0,73.5" fill="#2E7D32"/><text x="130" y="43.5" font-size="10" text-anchor="middle" fill="#2E7D32" font-weight="bold">LTS</text><path d="M242 70 L286 70" fill="none" stroke="#C62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="286.0,70.0 279.0,66.5 279.0,73.5" fill="#C62828"/><text x="264" y="43.5" font-size="10" text-anchor="middle" fill="#C62828" font-weight="bold">STS</text><path d="M310 94 L310 114" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="310.0,114.0 313.5,107.0 306.5,107.0" fill="#222"/><text x="318" y="113.2" font-size="9" text-anchor="start" fill="#666" font-weight="normal">end</text><rect x="110.0" y="150.0" width="172" height="40" rx="7" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.6"/><text x="196" y="174.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal"></text><text x="196" y="166.2" font-size="9.2" text-anchor="middle" fill="#E07B00" font-weight="bold">Swapped-out (partially</text><text x="196" y="180.2" font-size="9.2" text-anchor="middle" fill="#E07B00" font-weight="bold">executed) processes, disk</text><path d="M180 93 L180 150" fill="none" stroke="#E07B00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,150.0 183.5,143.0 176.5,143.0" fill="#E07B00"/><path d="M212 150 L212 93" fill="none" stroke="#E07B00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="212.0,93.0 208.5,100.0 215.5,100.0" fill="#E07B00"/><text x="176" y="125.1" font-size="8.8" text-anchor="end" fill="#E07B00" font-weight="bold">swap out</text><text x="216" y="125.1" font-size="8.8" text-anchor="start" fill="#E07B00" font-weight="bold">swap in</text><text x="300" y="173.5" font-size="10" text-anchor="middle" fill="#E07B00" font-weight="bold">MTS</text><rect x="12" y="206" width="336" height="40" rx="6" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.3"/><text x="20" y="222.3" font-size="9.4" text-anchor="start" fill="#2E7D32" font-weight="bold">Long-term (job) scheduler: job pool → ready queue.</text><text x="20" y="237.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">Controls the degree of multiprogramming. Slow.</text><rect x="12" y="250" width="336" height="40" rx="6" fill="#FFFFFF" stroke="#C62828" stroke-width="1.3"/><text x="20" y="266.3" font-size="9.4" text-anchor="start" fill="#C62828" font-weight="bold">Short-term (CPU) scheduler: ready queue → CPU.</text><text x="20" y="281.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">Runs very often (every few ms). Fastest.</text><rect x="12" y="294" width="336" height="40" rx="6" fill="#FFFFFF" stroke="#E07B00" stroke-width="1.3"/><text x="20" y="310.3" font-size="9.4" text-anchor="start" fill="#E07B00" font-weight="bold">Medium-term scheduler: swaps processes out/in.</text><text x="20" y="325.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">Reduces the degree of multiprogramming.</text></svg>