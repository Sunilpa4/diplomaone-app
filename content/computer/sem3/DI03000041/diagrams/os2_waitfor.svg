<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 290" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="290" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">RAG and its Wait-for Graph</text><text x="94" y="41.4" font-size="9.6" text-anchor="middle" fill="#7B2CD9" font-weight="bold">(a) Resource allocation graph</text><circle cx="37" cy="70" r="15" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="37" y="73.4" font-size="9.6" text-anchor="middle" fill="#1565C0" font-weight="bold">P1</text><rect x="83.0" y="57.0" width="38" height="26" rx="3" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.6"/><circle cx="102.0" cy="73" r="2.6" fill="#E07B00"/><text x="102" y="53.3" font-size="9.4" text-anchor="middle" fill="#E07B00" font-weight="bold">R1</text><circle cx="162" cy="130" r="15" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="162" y="133.4" font-size="9.6" text-anchor="middle" fill="#1565C0" font-weight="bold">P2</text><rect x="83.0" y="177.0" width="38" height="26" rx="3" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.6"/><circle cx="102.0" cy="193" r="2.6" fill="#E07B00"/><text x="102" y="173.3" font-size="9.4" text-anchor="middle" fill="#E07B00" font-weight="bold">R2</text><circle cx="37" cy="190" r="15" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="37" y="193.4" font-size="9.6" text-anchor="middle" fill="#1565C0" font-weight="bold">P3</text><rect x="18.0" y="117.0" width="38" height="26" rx="3" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.6"/><circle cx="37.0" cy="133" r="2.6" fill="#E07B00"/><text x="60.0" y="133.3" font-size="9.4" text-anchor="start" fill="#E07B00" font-weight="bold">R3</text><path d="M53.0 70.0 L82.0 70.0" fill="none" stroke="#C62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="82.0,70.0 75.0,66.5 75.0,73.5" fill="#C62828"/><path d="M115.7 83.7 L150.7 118.7" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="150.7,118.7 148.2,111.3 143.3,116.2" fill="#2E7D32"/><path d="M150.7 141.3 L115.7 176.3" fill="none" stroke="#C62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="115.7,176.3 123.1,173.8 118.2,168.9" fill="#C62828"/><path d="M82.0 190.0 L53.0 190.0" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="53.0,190.0 60.0,193.5 60.0,186.5" fill="#2E7D32"/><path d="M37.0 174.0 L37.0 144.0" fill="none" stroke="#C62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="37.0,144.0 33.5,151.0 40.5,151.0" fill="#C62828"/><path d="M37.0 116.0 L37.0 86.0" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="37.0,86.0 33.5,93.0 40.5,93.0" fill="#2E7D32"/><text x="272" y="41.4" font-size="9.6" text-anchor="middle" fill="#7B2CD9" font-weight="bold">(b) Wait-for graph</text><circle cx="226" cy="80" r="15" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="226" y="83.4" font-size="9.6" text-anchor="middle" fill="#1565C0" font-weight="bold">P1</text><circle cx="326" cy="130" r="15" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="326" y="133.4" font-size="9.6" text-anchor="middle" fill="#1565C0" font-weight="bold">P2</text><circle cx="226" cy="180" r="15" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="226" y="183.4" font-size="9.6" text-anchor="middle" fill="#1565C0" font-weight="bold">P3</text><path d="M240.3 87.2 L311.7 122.8" fill="none" stroke="#C62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="311.7,122.8 307.0,116.5 303.9,122.8" fill="#C62828"/><path d="M311.7 137.2 L240.3 172.8" fill="none" stroke="#C62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="240.3,172.8 248.1,172.8 245.0,166.5" fill="#C62828"/><path d="M226.0 164.0 L226.0 96.0" fill="none" stroke="#C62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="226.0,96.0 222.5,103.0 229.5,103.0" fill="#C62828"/><path d="M182 130 L200 130" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="200.0,130.0 193.0,126.5 193.0,133.5" fill="#7B2CD9"/><rect x="12" y="218" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="236.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Remove the resource nodes: Pi → Pj means Pi waits</text><text x="20" y="251.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">for a resource held by Pj.</text><text x="20" y="266.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">A cycle in the wait-for graph = deadlock (when each</text><text x="20" y="281.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">resource has a single instance). Here: P1 → P2 → P3 → P1.</text></svg>