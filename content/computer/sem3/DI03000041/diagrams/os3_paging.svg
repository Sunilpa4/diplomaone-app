idth="1.3"/><text x="290" y="158.4" font-size="9.6" text-anchor="middle" fill="#E07B00" font-weight="bold">page 2</text><text x="336" y="158.2" font-size="9" text-anchor="start" fill="#666" font-weight="normal">3</text><rect x="250" y="170" width="80" height="30" rx="0" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.3"/><text x="290" y="188.4" font-size="9.6" text-anchor="middle" fill="#1565C0" font-weight="bold">page 1</text><text x="336" y="188.2" font-size="9" text-anchor="start" fill="#666" font-weight="normal">4</text><rect x="250" y="200" width="80" height="30" rx="0" fill="#fff" stroke="#BBB" stroke-width="1.2"/><text x="336" y="218.2" font-size="9" text-anchor="start" fill="#666" font-weight="normal">5</text><rect x="250" y="230" width="80" height="30" rx="0" fill="#fff" stroke="#BBB" stroke-width="1.2"/><text x="336" y="248.2" font-size="9" text-anchor="start" fill="#666" font-weight="normal">6</text><rect x="250" y="260" width="80" height="30" rx="0" fill="#FDECEC" stroke="#C62828" stroke-width="1.3"/><text x="290" y="278.4" font-size="9.6" text-anchor="middle" fill="#C62828" font-weight="bold">page 3</text><text x="336" y="278.1" font-size="9" text-anchor="start" fill="#666" font-weight="normal">7</text><path d="M178 67 L196 67 L196 95 L248 95" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="248.0,95.0 241.0,91.5 241.0,98.5" fill="#2E7D32"/><path d="M178 101 L208 101 L208 185 L248 185" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="248.0,185.0 241.0,181.5 241.0,188.5" fill="#1565C0"/><path d="M178 135 L220 135 L220 155 L248 155" fill="none" stroke="#E07B00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="248.0,155.0 241.0,151.5 241.0,158.5" fill="#E07B00"/><path d="M178 169 L232 169 L232 275 L248 275" fill="none" stroke="#C62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="ro