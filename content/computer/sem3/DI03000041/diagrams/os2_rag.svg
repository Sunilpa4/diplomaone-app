<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 394" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="394" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Resource Allocation Graph (RAG)</text><circle cx="34" cy="50" r="15" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="34" y="53.4" font-size="9.6" text-anchor="middle" fill="#1565C0" font-weight="bold">Pi</text><text x="56" y="53.1" font-size="9" text-anchor="start" fill="#222" font-weight="normal">process</text><rect x="131.0" y="39.0" width="38" height="26" rx="3" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.6"/><circle cx="145.0" cy="55" r="2.6" fill="#E07B00"/><circle cx="155.0" cy="55" r="2.6" fill="#E07B00"/><text x="150" y="35.3" font-size="9.4" text-anchor="middle" fill="#E07B00" font-weight="bold">Rj</text><text x="174" y="55.1" font-size="9" text-anchor="start" fill="#222" font-weight="normal">resource, 2 instances</text><path d="M25.0 92.0 L99.0 92.0" fill="none" stroke="#C62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="99.0,92.0 92.0,88.5 92.0,95.5" fill="#C62828"/><text x="110" y="95.2" font-size="9" text-anchor="start" fill="#C62828" font-weight="bold">request edge  Pi → Rj</text><path d="M25.0 112.0 L99.0 112.0" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="99.0,112.0 92.0,108.5 92.0,115.5" fill="#2E7D32"/><text x="110" y="115.2" font-size="9" text-anchor="start" fill="#2E7D32" font-weight="bold">assignment edge  Rj → Pi</text><path d="M12 128 L348 128" fill="none" stroke="#DDD" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="94" y="147.4" font-size="9.8" text-anchor="middle" fill="#C62828" font-weight="bold">(a) Cycle → deadlock</text><circle cx="46" cy="190" r="15" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="46" y="193.4" font-size="9.6" text-anchor="middle" fill="#1565C0" font-weight="bold">P1</text><circle cx="146" cy="280" r="15" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="146" y="283.4" font-size="9.6" text-anchor="middle" fill="#1565C0" font-weight="bold">P2</text><rect x="27.0" y="267.0" width="38" height="26" rx="3" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.6"/><circle cx="46.0" cy="283" r="2.6" fill="#E07B00"/><text x="23.0" y="283.3" font-size="9.4" text-anchor="end" fill="#E07B00" font-weight="bold">R1</text><rect x="127.0" y="177.0" width="38" height="26" rx="3" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.6"/><circle cx="146.0" cy="193" r="2.6" fill="#E07B00"/><text x="146" y="173.3" font-size="9.4" text-anchor="middle" fill="#E07B00" font-weight="bold">R2</text><path d="M62.0 190.0 L126.0 190.0" fill="none" stroke="#C62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="126.0,190.0 119.0,186.5 119.0,193.5" fill="#C62828"/><path d="M146.0 204.0 L146.0 264.0" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="146.0,264.0 149.5,257.0 142.5,257.0" fill="#2E7D32"/><path d="M130.0 280.0 L66.0 280.0" fill="none" stroke="#C62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="66.0,280.0 73.0,283.5 73.0,276.5" fill="#C62828"/><path d="M46.0 266.0 L46.0 206.0" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="46.0,206.0 42.5,213.0 49.5,213.0" fill="#2E7D32"/><text x="268" y="147.4" font-size="9.8" text-anchor="middle" fill="#2E7D32" font-weight="bold">(b) Cycle, no deadlock</text><rect x="229.0" y="163.0" width="38" height="26" rx="3" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.6"/><circle cx="243.0" cy="179" r="2.6" fill="#E07B00"/><circle cx="253.0" cy="179" r="2.6" fill="#E07B00"/><text x="248" y="159.3" font-size="9.4" text-anchor="middle" fill="#E07B00" font-weight="bold">R1</text><rect x="229.0" y="281.0" width="38" height="26" rx="3" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.6"/><circle cx="243.0" cy="297" r="2.6" fill="#E07B00"/><circle cx="253.0" cy="297" r="2.6" fill="#E07B00"/><text x="248" y="277.3" font-size="9.4" text-anchor="middle" fill="#E07B00" font-weight="bold">R2</text><circle cx="202" cy="235" r="15" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="202" y="238.4" font-size="9.6" text-anchor="middle" fill="#1565C0" font-weight="bold">P1</text><circle cx="294" cy="235" r="15" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="294" y="238.4" font-size="9.6" text-anchor="middle" fill="#1565C0" font-weight="bold">P3</text><circle cx="332" cy="176" r="15" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="332" y="179.4" font-size="9.6" text-anchor="middle" fill="#1565C0" font-weight="bold">P2</text><circle cx="332" cy="294" r="15" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="332" y="297.4" font-size="9.6" text-anchor="middle" fill="#1565C0" font-weight="bold">P4</text><path d="M211.8 222.4 L237.2 189.8" fill="none" stroke="#C62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="237.2,189.8 230.1,193.2 235.7,197.5" fill="#C62828"/><path d="M258.8 189.8 L284.2 222.4" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="284.2,222.4 282.7,214.7 277.1,219.0" fill="#2E7D32"/><path d="M284.2 247.6 L258.8 280.2" fill="none" stroke="#C62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="258.8,280.2 265.9,276.8 260.3,272.5" fill="#C62828"/><path d="M237.2 280.2 L211.8 247.6" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="211.8,247.6 213.3,255.3 218.9,251.0" fill="#2E7D32"/><path d="M268.0 176.0 L316.0 176.0" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="316.0,176.0 309.0,172.5 309.0,179.5" fill="#2E7D32"/><path d="M268.0 294.0 L316.0 294.0" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="316.0,294.0 309.0,290.5 309.0,297.5" fill="#2E7D32"/><rect x="12" y="322" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="340.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">No cycle → no deadlock.</text><text x="20" y="355.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Cycle + one instance per resource → deadlock.</text><text x="20" y="370.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Cycle + many instances → maybe deadlock: in (b), P4</text><text x="20" y="385.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">can release R2, so P3 gets it and the cycle breaks.</text></svg>