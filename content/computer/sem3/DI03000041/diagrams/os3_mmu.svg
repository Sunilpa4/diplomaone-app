<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="250" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Logical to Physical Address (MMU)</text><rect x="14.0" y="68.0" width="60" height="44" rx="7" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.6"/><text x="44" y="94.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">CPU</text><rect x="118" y="34" width="128" height="104" rx="8" fill="#FBF8FF" stroke="#1565C0" stroke-width="1.4"/><text x="182" y="49.7" font-size="10.5" text-anchor="middle" fill="#1565C0" font-weight="bold">MMU</text><rect x="130.0" y="70.0" width="104" height="24" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="182" y="85.7" font-size="10.5" text-anchor="middle" fill="#1565C0" font-weight="bold">14000</text><text x="182" y="63.9" font-size="8.4" text-anchor="middle" fill="#666" font-weight="normal">relocation register</text><circle cx="182" cy="116" r="12" fill="#fff" stroke="#1565C0" stroke-width="1.5"/><text x="182" y="120.9" font-size="14" text-anchor="middle" fill="#1565C0" font-weight="bold">+</text><path d="M182 94 L182 103" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="182.0,103.0 185.5,96.0 178.5,96.0" fill="#1565C0"/><path d="M74 90 L96 90 L96 116 L170 116" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="170.0,116.0 163.0,112.5 163.0,119.5" fill="#222"/><text x="96" y="135.1" font-size="8.8" text-anchor="middle" fill="#2E7D32" font-weight="bold">logical</text><text x="96" y="147.1" font-size="8.8" text-anchor="middle" fill="#2E7D32" font-weight="bold">address 346</text><rect x="290.0" y="40.0" width="56" height="100" rx="7" fill="#F7F7F7" stroke="#888" stroke-width="1.6"/><text x="318" y="94.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal"></text><text x="318" y="63.4" font-size="9.6" text-anchor="middle" fill="#555" font-weight="bold">Memory</text><path d="M194 116 L290 116" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="290.0,116.0 283.0,112.5 283.0,119.5" fill="#222"/><text x="244" y="133.1" font-size="8.8" text-anchor="middle" fill="#C62828" font-weight="bold">physical</text><text x="244" y="145.1" font-size="8.8" text-anchor="middle" fill="#C62828" font-weight="bold">address 14346</text><rect x="12" y="164" width="336" height="85" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="182.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Logical (virtual) address: generated by the CPU.</text><text x="20" y="197.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Physical address: seen by the memory unit.</text><text x="20" y="212.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">MMU maps logical → physical at run time:</text><text x="20" y="227.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">physical = relocation (base) + logical = 14000 + 346.</text><text x="20" y="242.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">The user program never sees real physical addresses.</text></svg>