<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 384.0" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="384.0" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Dynamic (Variable) Partitions</text><text x="52" y="43.2" font-size="9.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">(a)</text><rect x="14" y="50" width="76" height="31.200000000000003" rx="0" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.2"/><text x="52" y="68.7" font-size="8.8" text-anchor="middle" fill="#7B2CD9" font-weight="bold">OS</text><rect x="14" y="81.2" width="76" height="46.800000000000004" rx="0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="52" y="107.7" font-size="8.8" text-anchor="middle" fill="#2E7D32" font-weight="bold">P1 (60)</text><rect x="14" y="128.0" width="76" height="62.400000000000006" rx="0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="52" y="162.3" font-size="8.8" text-anchor="middle" fill="#2E7D32" font-weight="bold">P2 (80)</text><rect x="14" y="190.4" width="76" height="39.0" rx="0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="52" y="213.0" font-size="8.8" text-anchor="middle" fill="#2E7D32" font-weight="bold">P3 (50)</text><rect x="14" y="229.4" width="76" height="54.6" rx="0" fill="#fff" stroke="#BBB" stroke-width="1.2"/><text x="52" y="259.8" font-size="8.8" text-anchor="middle" fill="#666" font-weight="bold">free 70</text><text x="138" y="43.2" font-size="9.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">(b) P2 ends</text><rect x="100" y="50" width="76" height="31.200000000000003" rx="0" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.2"/><text x="138" y="68.7" font-size="8.8" text-anchor="middle" fill="#7B2CD9" font-weight="bold">OS</text><rect x="100" y="81.2" width="76" height="46.800000000000004" rx="0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="138" y="107.7" font-size="8.8" text-anchor="middle" fill="#2E7D32" font-weight="bold">P1 (60)</text><rect x="100" y="128.0" width="76" height="62.400000000000006" rx="0" fill="#fff" stroke="#BBB" stroke-width="1.2"/><text x="138" y="162.3" font-size="8.8" text-anchor="middle" fill="#666" font-weight="bold">hole 80</text><rect x="100" y="190.4" width="76" height="39.0" rx="0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="138" y="213.0" font-size="8.8" text-anchor="middle" fill="#2E7D32" font-weight="bold">P3 (50)</text><rect x="100" y="229.4" width="76" height="54.6" rx="0" fill="#fff" stroke="#BBB" stroke-width="1.2"/><text x="138" y="259.8" font-size="8.8" text-anchor="middle" fill="#666" font-weight="bold">free 70</text><text x="224" y="43.2" font-size="9.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">(c) P4 = 50</text><rect x="186" y="50" width="76" height="31.200000000000003" rx="0" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.2"/><text x="224" y="68.7" font-size="8.8" text-anchor="middle" fill="#7B2CD9" font-weight="bold">OS</text><rect x="186" y="81.2" width="76" height="46.800000000000004" rx="0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="224" y="107.7" font-size="8.8" text-anchor="middle" fill="#2E7D32" font-weight="bold">P1 (60)</text><rect x="186" y="128.0" width="76" height="39.0" rx="0" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><text x="224" y="150.6" font-size="8.8" text-anchor="middle" fill="#1565C0" font-weight="bold">P4 (50)</text><rect x="186" y="167.0" width="76" height="23.400000000000002" rx="0" fill="#fff" stroke="#BBB" stroke-width="1.2"/><text x="224" y="181.8" font-size="8.8" text-anchor="middle" fill="#666" font-weight="bold">hole 30</text><rect x="186" y="190.4" width="76" height="39.0" rx="0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="224" y="213.0" font-size="8.8" text-anchor="middle" fill="#2E7D32" font-weight="bold">P3 (50)</text><rect x="186" y="229.4" width="76" height="54.6" rx="0" fill="#fff" stroke="#BBB" stroke-width="1.2"/><text x="224" y="259.8" font-size="8.8" text-anchor="middle" fill="#666" font-weight="bold">free 70</text><text x="310" y="43.2" font-size="9.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">(d) P1 ends</text><rect x="272" y="50" width="76" height="31.200000000000003" rx="0" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.2"/><text x="310" y="68.7" font-size="8.8" text-anchor="middle" fill="#7B2CD9" font-weight="bold">OS</text><rect x="272" y="81.2" width="76" height="46.800000000000004" rx="0" fill="#fff" stroke="#BBB" stroke-width="1.2"/><text x="310" y="107.7" font-size="8.8" text-anchor="middle" fill="#666" font-weight="bold">hole 60</text><rect x="272" y="128.0" width="76" height="39.0" rx="0" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><text x="310" y="150.6" font-size="8.8" text-anchor="middle" fill="#1565C0" font-weight="bold">P4 (50)</text><rect x="272" y="167.0" width="76" height="23.400000000000002" rx="0" fill="#fff" stroke="#BBB" stroke-width="1.2"/><text x="310" y="181.8" font-size="8.8" text-anchor="middle" fill="#666" font-weight="bold">hole 30</text><rect x="272" y="190.4" width="76" height="39.0" rx="0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="310" y="213.0" font-size="8.8" text-anchor="middle" fill="#2E7D32" font-weight="bold">P3 (50)</text><rect x="272" y="229.4" width="76" height="54.6" rx="0" fill="#fff" stroke="#BBB" stroke-width="1.2"/><text x="310" y="259.8" font-size="8.8" text-anchor="middle" fill="#666" font-weight="bold">free 70</text><rect x="12" y="298.0" width="336" height="85" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="316.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Partitions are created at run time with exactly the</text><text x="20" y="331.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">size each process needs (MVT): no internal waste.</text><text x="20" y="346.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">As processes leave, holes of various sizes appear</text><text x="20" y="361.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">scattered in memory: external fragmentation.</text><text x="20" y="376.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Here 60 + 30 + 70 = 160 KB is free, but not contiguous.</text></svg>