<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 296" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="296" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Relocation and Protection Hardware</text><rect x="14.0" y="84.0" width="52" height="40" rx="7" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.6"/><text x="40" y="108.0" font-size="11.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">CPU</text><rect x="90.0" y="36.0" width="96" height="24" rx="7" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.6"/><text x="138" y="51.1" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">limit register</text><rect x="196.0" y="36.0" width="108" height="24" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="250" y="51.1" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">relocation register</text><polygon points="138,80 172,104 138,128 104,104" fill="#FFF6D6" stroke="#E07B00" stroke-width="1.5"/><text x="138" y="108.5" font-size="13" text-anchor="middle" fill="#E07B00" font-weight="bold">&lt;</text><path d="M138 60 L138 80" fill="none" stroke="#E07B00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="138.0,80.0 141.5,73.0 134.5,73.0" fill="#E07B00"/><path d="M250 60 L250 92" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="250.0,92.0 253.5,85.0 246.5,85.0" fill="#1565C0"/><circle cx="250" cy="104" r="12" fill="#fff" stroke="#1565C0" stroke-width="1.5"/><text x="250" y="108.9" font-size="14" text-anchor="middle" fill="#1565C0" font-weight="bold">+</text><path d="M66 104 L104 104" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="104.0,104.0 97.0,100.5 97.0,107.5" fill="#222"/><text x="84" y="120.9" font-size="8.4" text-anchor="middle" fill="#2E7D32" font-weight="bold">logical</text><text x="84" y="131.9" font-size="8.4" text-anchor="middle" fill="#2E7D32" font-weight="bold">address</text><path d="M172 104 L238 104" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="238.0,104.0 231.0,100.5 231.0,107.5" fill="#2E7D32"/><text x="204" y="98.7" font-size="10.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">yes</text><path d="M262 104 L300 104" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="300.0,104.0 293.0,100.5 293.0,107.5" fill="#222"/><rect x="302.0" y="69.0" width="48" height="70" rx="7" fill="#F7F7F7" stroke="#888" stroke-width="1.6"/><text x="326" y="107.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">Memory</text><text x="282" y="120.9" font-size="8.4" text-anchor="middle" fill="#C62828" font-weight="bold">physical</text><path d="M138 128 L138 162" fill="none" stroke="#C62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="138.0,162.0 141.5,155.0 134.5,155.0" fill="#C62828"/><text x="148" y="147.7" font-size="10.5" text-anchor="middle" fill="#C62828" font-weight="bold">no</text><rect x="40.0" y="165.0" width="196" height="30" rx="7" fill="#FDECEC" stroke="#C62828" stroke-width="1.6"/><text x="138" y="183.4" font-size="9.6" text-anchor="middle" fill="#C62828" font-weight="bold">trap: addressing error</text><rect x="12" y="210" width="336" height="85" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="228.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Relocation register = smallest physical address of the</text><text x="20" y="243.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">process (base); limit register = size of its range.</text><text x="20" y="258.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Every logical address must be &lt; limit, else the OS is</text><text x="20" y="273.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">trapped. Then physical = logical + relocation value.</text><text x="20" y="288.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">This protects the OS and other processes.</text></svg>