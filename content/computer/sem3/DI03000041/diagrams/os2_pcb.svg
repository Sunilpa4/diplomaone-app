<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 394" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="394" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Process Control Block (PCB)</text><rect x="40" y="36" width="280" height="36" rx="0" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.3"/><text x="180" y="51.7" font-size="10.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Pointer  |  Process state</text><text x="180" y="65.1" font-size="8.8" text-anchor="middle" fill="#666" font-weight="normal">link in a queue; new, ready, running…</text><rect x="40" y="72" width="280" height="36" rx="0" fill="#FBF8FF" stroke="#7B2CD9" stroke-width="1.3"/><text x="180" y="87.7" font-size="10.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Process ID (PID)</text><text x="180" y="101.1" font-size="8.8" text-anchor="middle" fill="#666" font-weight="normal">unique number of the process</text><rect x="40" y="108" width="280" height="36" rx="0" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.3"/><text x="180" y="123.7" font-size="10.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Program counter</text><text x="180" y="137.1" font-size="8.8" text-anchor="middle" fill="#666" font-weight="normal">address of the next instruction</text><rect x="40" y="144" width="280" height="36" rx="0" fill="#FBF8FF" stroke="#7B2CD9" stroke-width="1.3"/><text x="180" y="159.7" font-size="10.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">CPU registers</text><text x="180" y="173.1" font-size="8.8" text-anchor="middle" fill="#666" font-weight="normal">accumulator, index, stack pointer…</text><rect x="40" y="180" width="280" height="36" rx="0" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.3"/><text x="180" y="195.7" font-size="10.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">CPU-scheduling info</text><text x="180" y="209.1" font-size="8.8" text-anchor="middle" fill="#666" font-weight="normal">priority, pointers to queues</text><rect x="40" y="216" width="280" height="36" rx="0" fill="#FBF8FF" stroke="#7B2CD9" stroke-width="1.3"/><text x="180" y="231.7" font-size="10.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Memory-management info</text><text x="180" y="245.1" font-size="8.8" text-anchor="middle" fill="#666" font-weight="normal">base/limit registers, page table</text><rect x="40" y="252" width="280" height="36" rx="0" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.3"/><text x="180" y="267.7" font-size="10.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Accounting info</text><text x="180" y="281.1" font-size="8.8" text-anchor="middle" fill="#666" font-weight="normal">CPU time used, time limits</text><rect x="40" y="288" width="280" height="36" rx="0" fill="#FBF8FF" stroke="#7B2CD9" stroke-width="1.3"/><text x="180" y="303.7" font-size="10.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">I/O status info</text><text x="180" y="317.1" font-size="8.8" text-anchor="middle" fill="#666" font-weight="normal">devices allocated, open files</text><rect x="12" y="336" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="354.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">PCB (task control block) stores all information</text><text x="20" y="369.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">about one process. The OS keeps one PCB per process;</text><text x="20" y="384.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">it is saved and reloaded during a context switch.</text></svg>