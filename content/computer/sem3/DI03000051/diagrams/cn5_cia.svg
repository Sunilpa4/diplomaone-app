<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 328" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="328" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">CIA Triad of Security</text><polygon points="180,56 60,236 300,236" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="2"/><text x="180" y="185.8" font-size="11" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Information</text><text x="180" y="200.8" font-size="11" text-anchor="middle" fill="#7B2CD9" font-weight="bold">security</text><rect x="126" y="40" width="108" height="32" rx="6" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="58.5" font-size="10" text-anchor="middle" fill="#1565C0" font-weight="bold">Confidentiality</text><text x="180" y="69.6" font-size="7.4" text-anchor="middle" fill="#666" font-weight="normal">only authorised can read</text><rect x="6" y="220" width="108" height="32" rx="6" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.6"/><text x="60" y="238.5" font-size="10" text-anchor="middle" fill="#2E7D32" font-weight="bold">Integrity</text><text x="60" y="249.6" font-size="7.4" text-anchor="middle" fill="#666" font-weight="normal">data not altered</text><rect x="246" y="220" width="108" height="32" rx="6" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.6"/><text x="300" y="238.5" font-size="10" text-anchor="middle" fill="#E07B00" font-weight="bold">Availability</text><text x="300" y="249.6" font-size="7.4" text-anchor="middle" fill="#666" font-weight="normal">accessible when needed</text><text x="110" y="142.8" font-size="8" text-anchor="end" fill="#1565C0" font-weight="normal">encryption,</text><text x="110" y="154.8" font-size="8" text-anchor="end" fill="#1565C0" font-weight="normal">access control</text><text x="250" y="142.8" font-size="8" text-anchor="start" fill="#2E7D32" font-weight="normal">hashing,</text><text x="250" y="154.8" font-size="8" text-anchor="start" fill="#2E7D32" font-weight="normal">digital signature</text><text x="300" y="268.7" font-size="7.6" text-anchor="middle" fill="#E07B00" font-weight="normal">backup, redundancy, anti-DoS</text><rect x="12" y="284" width="336" height="40" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="302.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Attacks: disclosure (C), alteration (I), denial (A).</text><text x="20" y="317.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">A secure system must protect all three.</text></svg>