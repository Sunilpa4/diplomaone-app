<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 270" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="270" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Metropolitan Area Network (MAN)</text><circle cx="180" cy="120" r="62" fill="none" stroke="#00796B" stroke-width="2.4"/><text x="180" y="119.3" font-size="9.4" text-anchor="middle" fill="#00796B" font-weight="bold">City backbone</text><text x="180" y="133.0" font-size="8.6" text-anchor="middle" fill="#00796B" font-weight="normal">(fiber ring)</text><circle cx="136.2" cy="76.2" r="6" fill="#E07B00"/><path d="M136.2,76.2 L90.2,62.2" fill="none" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="49.15937956643404" y="51.15937956643404" width="82" height="22" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="90.15937956643404" y="65.2" font-size="8.8" text-anchor="middle" fill="#222" font-weight="bold">College LAN</text><circle cx="223.8" cy="76.2" r="6" fill="#E07B00"/><path d="M223.8,76.2 L269.8,62.2" fill="none" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="228.84062043356596" y="51.159379566434055" width="82" height="22" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="269.84062043356596" y="65.2" font-size="8.8" text-anchor="middle" fill="#222" font-weight="bold">Bank LAN</text><circle cx="223.8" cy="163.8" r="6" fill="#E07B00"/><path d="M223.8,163.8 L269.8,177.8" fill="none" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="228.84062043356596" y="166.84062043356596" width="82" height="22" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="269.84062043356596" y="180.9" font-size="8.8" text-anchor="middle" fill="#222" font-weight="bold">Office LAN</text><circle cx="136.2" cy="163.8" r="6" fill="#E07B00"/><path d="M136.2,163.8 L90.2,177.8" fill="none" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="49.15937956643404" y="166.84062043356596" width="82" height="22" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="90.15937956643404" y="180.9" font-size="8.8" text-anchor="middle" fill="#222" font-weight="bold">Hospital LAN</text><text x="180" y="219.3" font-size="9.4" text-anchor="middle" fill="#666" font-weight="normal">Covers a city: about 5-50 km</text><rect x="12" y="228" width="336" height="40" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="246.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Connects many LANs of one city; owned by a company</text><text x="20" y="261.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">or government. e.g. cable TV network, city Wi-Fi.</text></svg>