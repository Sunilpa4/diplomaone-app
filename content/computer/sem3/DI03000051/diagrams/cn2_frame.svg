<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 234" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="234" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Data Link Layer: Frame Format</text><rect x="25" y="70" width="30" height="34" rx="2" fill="#fff" stroke="#666" stroke-width="1.5"/><text x="40.0" y="94.0" font-size="8.6" text-anchor="middle" fill="#666" font-weight="bold">Flag</text><rect x="55" y="70" width="52" height="34" rx="2" fill="#fff" stroke="#E07B00" stroke-width="1.5"/><text x="81.0" y="94.0" font-size="8.6" text-anchor="middle" fill="#E07B00" font-weight="bold">Dest MAC</text><rect x="107" y="70" width="50" height="34" rx="2" fill="#fff" stroke="#E07B00" stroke-width="1.5"/><text x="132.0" y="94.0" font-size="8.6" text-anchor="middle" fill="#E07B00" font-weight="bold">Src MAC</text><rect x="157" y="70" width="30" height="34" rx="2" fill="#fff" stroke="#E07B00" stroke-width="1.5"/><text x="172.0" y="94.0" font-size="8.6" text-anchor="middle" fill="#E07B00" font-weight="bold">Ctrl</text><rect x="187" y="70" width="84" height="34" rx="2" fill="#fff" stroke="#1565C0" stroke-width="1.5"/><text x="229.0" y="94.0" font-size="8.6" text-anchor="middle" fill="#1565C0" font-weight="bold">Data (packet)</text><rect x="271" y="70" width="34" height="34" rx="2" fill="#fff" stroke="#C62828" stroke-width="1.5"/><text x="288.0" y="94.0" font-size="8.6" text-anchor="middle" fill="#C62828" font-weight="bold">FCS</text><rect x="305" y="70" width="30" height="34" rx="2" fill="#fff" stroke="#666" stroke-width="1.5"/><text x="320.0" y="94.0" font-size="8.6" text-anchor="middle" fill="#666" font-weight="bold">Flag</text><path d="M55,62 L187,62" fill="none" stroke="#E07B00" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="121" y="60.0" font-size="8.6" text-anchor="middle" fill="#E07B00" font-weight="normal">Header (added by DLL)</text><path d="M271,62 L305,62" fill="none" stroke="#C62828" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="288" y="60.0" font-size="8.6" text-anchor="middle" fill="#C62828" font-weight="normal">Trailer</text><text x="180" y="124.9" font-size="8.4" text-anchor="middle" fill="#C62828" font-weight="normal">FCS = Frame Check Sequence (CRC) for error detection</text><text x="180" y="138.9" font-size="8.4" text-anchor="middle" fill="#666" font-weight="normal">MAC example: 3C:52:82:1A:9F:04 (48 bits)</text><rect x="12" y="158" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="176.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Functions: framing, physical (MAC) addressing,</text><text x="20" y="191.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">flow control, error control, access control.</text><text x="20" y="206.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Sublayers: LLC (logical link) and MAC (media access).</text><text x="20" y="221.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Devices: switch, bridge, NIC.</text></svg>