font-size="9" text-anchor="middle" fill="#00796B" font-weight="bold">169.254.0.0/16</text><text x="172" y="153.2" font-size="9" text-anchor="start" fill="#222" font-weight="normal">APIPA / link-local</text><rect x="12" y="160" width="150" height="20" rx="3" fill="#F5F5F5" stroke="#666" stroke-width="1.1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="87" y="177.2" font-size="9" text-anchor="middle" fill="#666" font-weight="bold">0.0.0.0</text><text x="172" y="177.2" font-size="9" text-anchor="start" fill="#222" font-weight="normal">This host / default route</text><rect x="12" y="184" width="150" height="20" rx="3" fill="#FDECEC" stroke="#C62828" stroke-width="1.1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="87" y="201.2" font-size="9" text-anchor="middle" fill="#C62828" font-weight="bold">255.255.255.255</text><text x="172" y="201.2" font-size="9" text-anchor="start" fill="#222" font-weight="normal">Limited broadcast</text><rect x="12" y="208" width="150" height="20" rx="3" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="87" y="225.2" font-size="9" text-anchor="middle" fill="#E07B00" font-weight="bold">224.0.0.0/4</text><text x="172" y="225.2" font-size="9" text-anchor="start" fill="#222" font-weight="normal">Multicast (class D)</text><rect x="12" y="232" width="150" height="20" rx="3" fill="#F5F5F5" stroke="#666" stroke-width="1.1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="87" y="249.2" font-size="9" text-anchor="middle" fill="#666" font-weight="bold">240.0.0.0/4</text><text x="172" y="249.2" font-size="9" text-anchor="start" fill="#222" font-weight="normal">Reserved (class E)</text><rect x="12" y="262" width="336" height="40" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="280.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Private addresses are not routed on the Internet;</text><text x="20" y="295.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">NAT in the router translates them to a public IP.</text></svg>