" stroke="#E07B00" stroke-width="1.2"/><text x="180" y="163.2" font-size="9" text-anchor="middle" fill="#E07B00" font-weight="bold">Bridge table</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="124" y="178.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">MAC of A, B → port 1</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="124" y="194.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">MAC of C, D → port 2</text><rect x="12" y="212" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="230.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">A to B: same side, frame filtered (not forwarded).</text><text x="20" y="245.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">A to C: forwarded to port 2. Layer 2 device; divides</text><text x="20" y="260.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">collision domains, reduces traffic.</text></svg>