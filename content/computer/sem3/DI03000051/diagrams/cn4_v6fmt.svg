<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 272" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="272" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">IPv6 Address: 128 Bits, 8 Groups</text><rect x="12" y="44" width="40" height="22" rx="3" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="32.0" y="61.1" font-size="8.6" text-anchor="middle" fill="#1565C0" font-weight="bold">2001</text><rect x="54" y="44" width="40" height="22" rx="3" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="74.0" y="61.1" font-size="8.6" text-anchor="middle" fill="#1565C0" font-weight="bold">0db8</text><rect x="96" y="44" width="40" height="22" rx="3" fill="#EEEEEE" stroke="#666" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="116.0" y="61.1" font-size="8.6" text-anchor="middle" fill="#666" font-weight="bold">0000</text><rect x="138" y="44" width="40" height="22" rx="3" fill="#EEEEEE" stroke="#666" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="158.0" y="61.1" font-size="8.6" text-anchor="middle" fill="#666" font-weight="bold">0000</text><rect x="180" y="44" width="40" height="22" rx="3" fill="#EEEEEE" stroke="#666" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="200.0" y="61.1" font-size="8.6" text-anchor="middle" fill="#666" font-weight="bold">0000</text><rect x="222" y="44" width="40" height="22" rx="3" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="242.0" y="61.1" font-size="8.6" text-anchor="middle" fill="#1565C0" font-weight="bold">ff00</text><rect x="264" y="44" width="40" height="22" rx="3" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="284.0" y="61.1" font-size="8.6" text-anchor="middle" fill="#1565C0" font-weight="bold">0042</text><rect x="306" y="44" width="40" height="22" rx="3" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="326.0" y="61.1" font-size="8.6" text-anchor="middle" fill="#1565C0" font-weight="bold">8329</text><path d="M12,70 L12,75 L52,75 L52,70" fill="none" stroke="#666" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="32.0" y="89.9" font-size="8.4" text-anchor="middle" fill="#666" font-weight="bold"></text><text x="12" y="89.9" font-size="8.4" text-anchor="start" fill="#666" font-weight="bold">one group = 16 bits = 4 hex digits</text><path d="M12,92 L12,97 L346,97 L346,92" fill="none" stroke="#666" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="179.0" y="111.9" font-size="8.4" text-anchor="middle" fill="#666" font-weight="bold">8 groups x 16 bits = 128 bits, separated by colons</text><text x="180" y="135.2" font-size="9.2" text-anchor="middle" fill="#E07B00" font-weight="bold">Rule 1: drop leading zeros in each group</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="153.5" font-size="10" text-anchor="middle" fill="#222" font-weight="bold">2001:db8:0:0:0:ff00:42:8329</text><text x="180" y="181.2" font-size="9.2" text-anchor="middle" fill="#2E7D32" font-weight="bold">Rule 2: replace ONE run of zero groups with ::</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="199.8" font-size="11" text-anchor="middle" fill="#2E7D32" font-weight="bold">2001:db8::ff00:42:8329</text><rect x="12" y="212" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="230.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Hexadecimal digits 0-9, a-f (not case sensitive).</text><text x="20" y="245.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">:: may be used only once in an address.</text><text x="20" y="260.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Total addresses = 2^128 (about 3.4 x 10^38).</text></svg>