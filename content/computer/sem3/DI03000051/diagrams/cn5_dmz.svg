ed zone).</text><text x="20" y="267.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Internet cannot reach the LAN directly: two layers of</text><text x="20" y="282.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">defence (defence in depth). Default policy: deny all.</text></svg>