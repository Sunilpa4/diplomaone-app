 text-anchor="start" fill="#222" font-weight="normal">Every device has a dedicated link to every other.</text><text x="20" y="245.4" font-size="9.6" text-anchor="start" fill="#7B2CD9" font-weight="normal">Links = n(n-1)/2 = 6x5/2 = 15;  ports/device = n-1 = 5</text><text x="20" y="260.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">+ Robust, private, no traffic problem, easy fault find.</text><text x="20" y="275.4" font-size="9.6" text-anchor="start" fill="#C62828" font-weight="normal">- Very costly: much cable and many ports.</text></svg>