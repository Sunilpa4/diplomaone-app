<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="320" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Satellite Transmission</text><path d="M12,210 Q180,176 348,210 L348,222 L12,222 Z" fill="#C8E6C9" stroke="#2E7D32" stroke-width="1.2"/><rect x="168" y="52" width="24" height="20" rx="3" fill="#ECEFF1" stroke="#666" stroke-width="1.4"/><rect x="132" y="56" width="32" height="12" rx="1" fill="#E3F0FC" stroke="#1565C0" stroke-width="1"/><rect x="196" y="56" width="32" height="12" rx="1" fill="#E3F0FC" stroke="#1565C0" stroke-width="1"/><text x="180" y="47.1" font-size="9" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Satellite (transponder)</text><path d="M48,186 Q60,200 72,186" fill="none" stroke="#00796B" stroke-width="3"/><path d="M60,192 L60,202" fill="none" stroke="#666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="239.0" font-size="8.6" text-anchor="middle" fill="#1565C0" font-weight="bold">Earth station A</text><path d="M288,186 Q300,200 312,186" fill="none" stroke="#00796B" stroke-width="3"/><path d="M300,192 L300,202" fill="none" stroke="#666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="300" y="239.0" font-size="8.6" text-anchor="middle" fill="#1565C0" font-weight="bold">Earth station B</text><path d="M64,182 L166,74" fill="none" stroke="#C62828" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="166.0,74.0 158.6,76.7 163.7,81.5" fill="#C62828"/><path d="M194,74 L296,182" fill="none" stroke="#2E7D32" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="296.0,182.0 293.7,174.5 288.6,179.3" fill="#2E7D32"/><text x="92" y="123.2" font-size="9" text-anchor="middle" fill="#C62828" font-weight="bold">uplink</text><text x="270" y="123.2" font-size="9" text-anchor="middle" fill="#2E7D32" font-weight="bold">downlink</text><text x="180" y="143.0" font-size="8.6" text-anchor="middle" fill="#666" font-weight="normal">GEO: 35,786 km</text><rect x="12" y="246" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="264.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Satellite receives on the uplink frequency, amplifies,</text><text x="20" y="279.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">and retransmits on a different downlink frequency.</text><text x="20" y="294.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Orbits: GEO (TV, VSAT), MEO (GPS), LEO (Starlink).</text><text x="20" y="309.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Uses: DTH TV, GPS, weather, remote Internet.</text></svg>