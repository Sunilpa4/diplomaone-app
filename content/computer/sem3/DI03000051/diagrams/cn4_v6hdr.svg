<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 289" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="289" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">IPv6 Base Header (40 Bytes)</text><text x="20" y="54.6" font-size="7.4" text-anchor="middle" fill="#666" font-weight="normal">0</text><text x="100" y="54.6" font-size="7.4" text-anchor="middle" fill="#666" font-weight="normal">8</text><text x="180" y="54.6" font-size="7.4" text-anchor="middle" fill="#666" font-weight="normal">16</text><text x="260" y="54.6" font-size="7.4" text-anchor="middle" fill="#666" font-weight="normal">24</text><text x="340" y="54.6" font-size="7.4" text-anchor="middle" fill="#666" font-weight="normal">31</text><rect x="20" y="58" width="40" height="26" rx="2" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="40.0" y="76.9" font-size="7.6" text-anchor="middle" fill="#1565C0" font-weight="bold">Ver</text><rect x="60" y="58" width="80" height="26" rx="2" fill="#E0F2F1" stroke="#00796B" stroke-width="1.1"/><text x="100.0" y="77.2" font-size="8.6" text-anchor="middle" fill="#00796B" font-weight="bold">Traffic class</text><rect x="140" y="58" width="200" height="26" rx="2" fill="#E0F2F1" stroke="#00796B" stroke-width="1.1"/><text x="240.0" y="77.2" font-size="8.6" text-anchor="middle" fill="#00796B" font-weight="bold">Flow label (20 bits)</text><rect x="20" y="84" width="160" height="26" rx="2" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.1"/><text x="100.0" y="103.2" font-size="8.6" text-anchor="middle" fill="#E07B00" font-weight="bold">Payload length</text><rect x="180" y="84" width="80" height="26" rx="2" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.1"/><text x="220.0" y="103.2" font-size="8.6" text-anchor="middle" fill="#E07B00" font-weight="bold">Next header</text><rect x="260" y="84" width="80" height="26" rx="2" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.1"/><text x="300.0" y="103.2" font-size="8.6" text-anchor="middle" fill="#E07B00" font-weight="bold">Hop limit</text><rect x="20" y="110" width="320" height="52" rx="2" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.1"/><text x="180.0" y="142.2" font-size="8.6" text-anchor="middle" fill="#2E7D32" font-weight="bold">Source address (128 bits)</text><rect x="20" y="162" width="320" height="52" rx="2" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.1"/><text x="180.0" y="194.2" font-size="8.6" text-anchor="middle" fill="#2E7D32" font-weight="bold">Destination address (128 bits)</text><rect x="12" y="224" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="242.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Fixed 40-byte header; no checksum, no fragmentation</text><text x="20" y="257.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">fields; options go in extension headers (Next header).</text><text x="20" y="272.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Hop limit = TTL; flow label for real-time traffic.</text></svg>