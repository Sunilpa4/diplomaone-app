t-family="DejaVu Sans Mono, Consolas, monospace" x="280" y="73.2" font-size="9" text-anchor="middle" fill="#1565C0" font-weight="normal">1 0 1 1 0 1</text><rect x="12" y="140" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="158.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Physical layer device. Regenerates (not just amplifies)</text><text x="20" y="173.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">the original bit pattern and extends cable length</text><text x="20" y="188.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">(Ethernet UTP: 100 m per segment). No filtering.</text></svg>