<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 290" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="290" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Integrity: Hash Check</text><text x="75" y="53.4" font-size="9.6" text-anchor="middle" fill="#1565C0" font-weight="bold">Sender</text><text x="277" y="53.4" font-size="9.6" text-anchor="middle" fill="#2E7D32" font-weight="bold">Receiver</text><rect x="20" y="60" width="110" height="24" rx="3" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="75.0" y="78.7" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">Pay Rs 100</text><rect x="33.0" y="100.0" width="84" height="24" rx="7" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.6"/><text x="75" y="114.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Hash (SHA-256)</text><path d="M75,84 L75,99" fill="none" stroke="#7B2CD9" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><polygon points="75.0,99.0 78.0,93.0 72.0,93.0" fill="#7B2CD9"/><path d="M75,124 L75,135" fill="none" stroke="#7B2CD9" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><polygon points="75.0,135.0 78.0,129.0 72.0,129.0" fill="#7B2CD9"/><rect x="25" y="136" width="100" height="22" rx="3" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="75.0" y="153.4" font-size="9" text-anchor="middle" fill="#7B2CD9" font-weight="bold">0cfd73...</text><path d="M125,147 L160,147 L160,76" fill="none" stroke="#7B2CD9" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M130,72 L204,72" fill="none" stroke="#1565C0" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="204.0,72.0 198.0,69.0 198.0,75.0" fill="#1565C0"/><text x="167" y="66.7" font-size="7.6" text-anchor="middle" fill="#666" font-weight="normal">message + hash</text><rect x="206" y="60" width="90" height="24" rx="3" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="251.0" y="78.7" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">Pay Rs 100</text><rect x="296" y="60" width="52" height="24" rx="3" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="322.0" y="78.0" font-size="8.4" text-anchor="middle" fill="#7B2CD9" font-weight="bold">0cfd73...</text><rect x="211.0" y="100.0" width="80" height="24" rx="7" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.6"/><text x="251" y="114.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Hash again</text><path d="M251,84 L251,99" fill="none" stroke="#7B2CD9" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><polygon points="251.0,99.0 254.0,93.0 248.0,93.0" fill="#7B2CD9"/><path d="M251,124 L251,135" fill="none" stroke="#7B2CD9" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><polygon points="251.0,135.0 254.0,129.0 248.0,129.0" fill="#7B2CD9"/><rect x="211" y="136" width="80" height="22" rx="3" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.2"/><text x="251.0" y="153.0" font-size="8.4" text-anchor="middle" fill="#7B2CD9" font-weight="normal">new hash</text><path d="M251,158 L251,183" fill="none" stroke="#E07B00" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><polygon points="251.0,183.0 254.0,177.0 248.0,177.0" fill="#E07B00"/><path d="M322,84 L322,183" fill="none" stroke="#7B2CD9" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><polygon points="322.0,183.0 325.0,177.0 319.0,177.0" fill="#7B2CD9"/><text x="326" y="132.6" font-size="7.4" text-anchor="start" fill="#7B2CD9" font-weight="normal">received</text><text x="326" y="142.6" font-size="7.4" text-anchor="start" fill="#7B2CD9" font-weight="normal">hash</text><rect x="225.0" y="183.0" width="110" height="26" rx="7" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.6"/><text x="280" y="199.2" font-size="9" text-anchor="middle" fill="#E07B00" font-weight="bold">Compare</text><text x="280" y="226.8" font-size="8" text-anchor="middle" fill="#2E7D32" font-weight="bold">equal: not changed</text><text x="280" y="238.8" font-size="8" text-anchor="middle" fill="#C62828" font-weight="bold">different: tampered</text><text x="20" y="192.8" font-size="8" text-anchor="start" fill="#666" font-weight="normal">Changing even one character</text><text x="20" y="204.8" font-size="8" text-anchor="start" fill="#666" font-weight="normal">(100 to 900) gives a totally</text><text x="20" y="216.8" font-size="8" text-anchor="start" fill="#666" font-weight="normal">different hash.</text><rect x="12" y="246" width="336" height="40" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="264.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Hash = fixed-size fingerprint of data (MD5, SHA-256).</text><text x="20" y="279.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Digital signature = hash encrypted with sender's private key.</text></svg>