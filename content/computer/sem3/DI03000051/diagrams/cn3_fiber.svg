<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="300" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Fiber Optic Cable: Structure</text><rect x="20" y="58" width="310" height="52" rx="3" fill="#FFB300" stroke="#546E7A" stroke-width="1.2"/><rect x="90" y="64" width="240" height="40" rx="3" fill="#E0E0E0" stroke="#546E7A" stroke-width="1.2"/><rect x="160" y="71" width="170" height="26" rx="3" fill="#B3E5FC" stroke="#546E7A" stroke-width="1.2"/><rect x="240" y="78" width="90" height="12" rx="1" fill="#E1F5FE" stroke="#546E7A" stroke-width="1.2"/><path d="M55,58 L46,48" fill="none" stroke="#666" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="55" cy="58" r="2" fill="#666"/><text x="46" y="47.0" font-size="8.6" text-anchor="middle" fill="#222" font-weight="bold">Jacket</text><path d="M125,64 L125,60" fill="none" stroke="#666" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="125" cy="64" r="2" fill="#666"/><text x="125" y="59.0" font-size="8.6" text-anchor="middle" fill="#222" font-weight="bold">Buffer</text><path d="M200,71 L196,48" fill="none" stroke="#666" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="200" cy="71" r="2" fill="#666"/><text x="196" y="47.0" font-size="8.6" text-anchor="middle" fill="#222" font-weight="bold">Cladding</text><path d="M285,78 L296,60" fill="none" stroke="#666" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="285" cy="78" r="2" fill="#666"/><text x="296" y="59.0" font-size="8.6" text-anchor="middle" fill="#222" font-weight="bold">Core</text><rect x="20" y="136" width="320" height="14" rx="0" fill="#B3E5FC" stroke="#546E7A" stroke-width="1"/><rect x="20" y="200" width="320" height="14" rx="0" fill="#B3E5FC" stroke="#546E7A" stroke-width="1"/><rect x="20" y="150" width="320" height="50" rx="0" fill="#E1F5FE" stroke="#546E7A" stroke-width="1"/><text x="330" y="148.8" font-size="8" text-anchor="end" fill="#666" font-weight="normal">cladding n2</text><text x="330" y="213.8" font-size="8" text-anchor="end" fill="#666" font-weight="normal">cladding n2</text><path d="M20.0,186.0 L66.0,150.0 L112.0,200.0 L158.0,150.0 L204.0,200.0 L250.0,150.0 L296.0,200.0 L340.0,150.0" fill="none" stroke="#C62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="340.0,150.0 332.7,152.9 338.0,157.6" fill="#C62828"/><text x="180" y="233.1" font-size="8.8" text-anchor="middle" fill="#C62828" font-weight="bold">core n1 &gt; cladding n2: total internal reflection</text><rect x="12" y="240" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="258.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Carries data as pulses of light (LED / laser).</text><text x="20" y="273.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Angle &gt; critical angle, so light stays in the core.</text><text x="20" y="288.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Connectors: SC, ST, LC, MT-RJ.</text></svg>