<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 312" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="312" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">IPv6 Global Unicast and Address Types</text><rect x="12" y="44" width="126.0" height="26" rx="2" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><text x="75.0" y="63.9" font-size="8.4" text-anchor="middle" fill="#1565C0" font-weight="bold">Global routing prefix</text><text x="75.0" y="84.8" font-size="8" text-anchor="middle" fill="#1565C0" font-weight="bold">48 bits</text><rect x="138.0" y="44" width="42.0" height="26" rx="2" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.2"/><text x="159.0" y="63.7" font-size="7.8" text-anchor="middle" fill="#E07B00" font-weight="bold">Subnet</text><text x="159.0" y="84.8" font-size="8" text-anchor="middle" fill="#E07B00" font-weight="bold">16 bits</text><rect x="180.0" y="44" width="168.0" height="26" rx="2" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="264.0" y="63.9" font-size="8.4" text-anchor="middle" fill="#2E7D32" font-weight="bold">Interface ID</text><text x="264.0" y="84.8" font-size="8" text-anchor="middle" fill="#2E7D32" font-weight="bold">64 bits</text><text x="180" y="100.9" font-size="8.2" text-anchor="middle" fill="#666" font-weight="normal">network part 64 bits (ISP + site)  |  host part 64 bits</text><rect x="12" y="108" width="130" height="18" rx="3" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="77" y="124.1" font-size="8.8" text-anchor="middle" fill="#1565C0" font-weight="bold">2000::/3</text><text x="152" y="124.2" font-size="9" text-anchor="start" fill="#222" font-weight="normal">Global unicast (public)</text><rect x="12" y="130" width="130" height="18" rx="3" fill="#E0F2F1" stroke="#00796B" stroke-width="1.1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="77" y="146.1" font-size="8.8" text-anchor="middle" fill="#00796B" font-weight="bold">fe80::/10</text><text x="152" y="146.2" font-size="9" text-anchor="start" fill="#222" font-weight="normal">Link-local (auto, one link)</text><rect x="12" y="152" width="130" height="18" rx="3" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="77" y="168.1" font-size="8.8" text-anchor="middle" fill="#2E7D32" font-weight="bold">fc00::/7</text><text x="152" y="168.2" font-size="9" text-anchor="start" fill="#222" font-weight="normal">Unique local (private)</text><rect x="12" y="174" width="130" height="18" rx="3" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="77" y="190.1" font-size="8.8" text-anchor="middle" fill="#E07B00" font-weight="bold">ff00::/8</text><text x="152" y="190.2" font-size="9" text-anchor="start" fill="#222" font-weight="normal">Multicast</text><rect x="12" y="196" width="130" height="18" rx="3" fill="#FDECEC" stroke="#C62828" stroke-width="1.1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="77" y="212.1" font-size="8.8" text-anchor="middle" fill="#C62828" font-weight="bold">::1/128</text><text x="152" y="212.2" font-size="9" text-anchor="start" fill="#222" font-weight="normal">Loopback</text><rect x="12" y="218" width="130" height="18" rx="3" fill="#F5F5F5" stroke="#666" stroke-width="1.1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="77" y="234.1" font-size="8.8" text-anchor="middle" fill="#666" font-weight="bold">::/128</text><text x="152" y="234.2" font-size="9" text-anchor="start" fill="#222" font-weight="normal">Unspecified</text><rect x="12" y="240" width="130" height="18" rx="3" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="77" y="256.1" font-size="8.8" text-anchor="middle" fill="#7B2CD9" font-weight="bold">::ffff:0:0/96</text><text x="152" y="256.1" font-size="9" text-anchor="start" fill="#222" font-weight="normal">IPv4-mapped</text><rect x="12" y="268" width="336" height="40" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="286.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Interface ID can be made from the MAC address (EUI-64)</text><text x="20" y="301.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">or random; documentation prefix is 2001:db8::/32.</text></svg>