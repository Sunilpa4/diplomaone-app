<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 296" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="296" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Addresses Used in TCP/IP</text><rect x="12" y="46" width="336" height="42" rx="6" fill="#FCE4EC" stroke="#C2185B" stroke-width="1.4"/><text x="22" y="66.5" font-size="10" text-anchor="start" fill="#C2185B" font-weight="bold">Specific address</text><text x="338" y="65.9" font-size="8.4" text-anchor="end" fill="#C2185B" font-weight="normal">Application layer</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="82.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">URL, e-mail: www.gtu.ac.in</text><rect x="12" y="96" width="336" height="42" rx="6" fill="#E0F2F1" stroke="#00796B" stroke-width="1.4"/><text x="22" y="116.5" font-size="10" text-anchor="start" fill="#00796B" font-weight="bold">Port address</text><text x="338" y="115.9" font-size="8.4" text-anchor="end" fill="#00796B" font-weight="normal">Transport layer</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="132.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">16-bit: 80 (HTTP), 25 (SMTP)</text><rect x="12" y="146" width="336" height="42" rx="6" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.4"/><text x="22" y="166.5" font-size="10" text-anchor="start" fill="#2E7D32" font-weight="bold">Logical address</text><text x="338" y="165.9" font-size="8.4" text-anchor="end" fill="#2E7D32" font-weight="normal">Internet / Network layer</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="182.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">IPv4 32-bit: 192.168.1.5</text><rect x="12" y="196" width="336" height="42" rx="6" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.4"/><text x="22" y="216.5" font-size="10" text-anchor="start" fill="#E07B00" font-weight="bold">Physical address</text><text x="338" y="215.9" font-size="8.4" text-anchor="end" fill="#E07B00" font-weight="normal">Data link layer</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="232.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">MAC 48-bit: 3C:52:82:1A:9F:04</text><rect x="12" y="252" width="336" height="40" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="270.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">MAC: changes at every hop. IP: same from source to</text><text x="20" y="285.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">destination. Port: identifies the process.</text></svg>