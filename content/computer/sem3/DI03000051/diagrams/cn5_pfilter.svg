<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 308" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="308" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Packet Filter Firewall</text><text x="12" y="53.1" font-size="9" text-anchor="start" fill="#7B2CD9" font-weight="bold">Checks header fields only:</text><rect x="12" y="58" width="52" height="22" rx="3" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><text x="38.0" y="74.8" font-size="8.2" text-anchor="middle" fill="#1565C0" font-weight="bold">Src IP</text><rect x="64" y="58" width="52" height="22" rx="3" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><text x="90.0" y="74.8" font-size="8.2" text-anchor="middle" fill="#1565C0" font-weight="bold">Dst IP</text><rect x="116" y="58" width="52" height="22" rx="3" fill="#E0F2F1" stroke="#00796B" stroke-width="1.2"/><text x="142.0" y="74.8" font-size="8.2" text-anchor="middle" fill="#00796B" font-weight="bold">Protocol</text><rect x="168" y="58" width="52" height="22" rx="3" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="194.0" y="74.8" font-size="8.2" text-anchor="middle" fill="#2E7D32" font-weight="bold">Src port</text><rect x="220" y="58" width="52" height="22" rx="3" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="246.0" y="74.8" font-size="8.2" text-anchor="middle" fill="#2E7D32" font-weight="bold">Dst port</text><rect x="272" y="58" width="76" height="22" rx="3" fill="#F5F5F5" stroke="#666" stroke-width="1.2"/><text x="310.0" y="74.8" font-size="8.2" text-anchor="middle" fill="#666" font-weight="bold">Data</text><text x="320" y="94.6" font-size="7.4" text-anchor="middle" fill="#666" font-weight="normal">not inspected</text><text x="110" y="98.7" font-size="7.6" text-anchor="middle" fill="#666" font-weight="normal">IP header (L3)   |   TCP/UDP header (L4)</text><rect x="12" y="104" width="336" height="20" rx="3" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.1"/><text x="20" y="120.9" font-size="8.4" text-anchor="start" fill="#7B2CD9" font-weight="bold">#</text><text x="52" y="120.9" font-size="8.4" text-anchor="start" fill="#7B2CD9" font-weight="bold">Source</text><text x="138" y="120.9" font-size="8.4" text-anchor="start" fill="#7B2CD9" font-weight="bold">Destination</text><text x="220" y="120.9" font-size="8.4" text-anchor="start" fill="#7B2CD9" font-weight="bold">Dst port</text><text x="300" y="120.9" font-size="8.4" text-anchor="start" fill="#7B2CD9" font-weight="bold">Action</text><rect x="12" y="124" width="336" height="20" rx="0" fill="#FAFAFA" stroke="#DDD" stroke-width="0.6"/><text x="20" y="140.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">1</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="52" y="140.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">any</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="138" y="140.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">192.168.1.10</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="220" y="140.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">80, 443</text><text x="300" y="140.9" font-size="8.2" text-anchor="start" fill="#2E7D32" font-weight="bold">Allow</text><rect x="12" y="144" width="336" height="20" rx="0" fill="#fff" stroke="#DDD" stroke-width="0.6"/><text x="20" y="160.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">2</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="52" y="160.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">any</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="138" y="160.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">192.168.1.11</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="220" y="160.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">25</text><text x="300" y="160.9" font-size="8.2" text-anchor="start" fill="#2E7D32" font-weight="bold">Allow</text><rect x="12" y="164" width="336" height="20" rx="0" fill="#FAFAFA" stroke="#DDD" stroke-width="0.6"/><text x="20" y="180.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">3</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="52" y="180.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">192.168.1.0/24</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="138" y="180.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">any</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="220" y="180.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">any</text><text x="300" y="180.9" font-size="8.2" text-anchor="start" fill="#2E7D32" font-weight="bold">Allow</text><rect x="12" y="184" width="336" height="20" rx="0" fill="#fff" stroke="#DDD" stroke-width="0.6"/><text x="20" y="200.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">4</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="52" y="200.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">any</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="138" y="200.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">any</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="220" y="200.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">23</text><text x="300" y="200.9" font-size="8.2" text-anchor="start" fill="#C62828" font-weight="bold">Deny</text><rect x="12" y="204" width="336" height="20" rx="0" fill="#FAFAFA" stroke="#DDD" stroke-width="0.6"/><text x="20" y="220.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">5</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="52" y="220.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">any</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="138" y="220.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">any</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="220" y="220.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">any</text><text x="300" y="220.9" font-size="8.2" text-anchor="start" fill="#C62828" font-weight="bold">Deny</text><text x="180" y="240.9" font-size="8.2" text-anchor="middle" fill="#666" font-weight="normal">Rules are checked top to bottom; first match wins.</text><rect x="12" y="248" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="266.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Last rule = default deny. Works at network / transport layer.</text><text x="20" y="281.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Fast and cheap (often built into routers) but cannot</text><text x="20" y="296.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">see the content, users or application commands.</text></svg>