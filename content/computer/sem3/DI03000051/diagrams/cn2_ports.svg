<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 266" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="266" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Transport Layer: Process to Process</text><rect x="8" y="50" width="124" height="132" rx="8" fill="#FAFAFA" stroke="#666" stroke-width="1.2"/><text x="70" y="69.5" font-size="10" text-anchor="middle" fill="#1565C0" font-weight="bold">Client</text><text x="70" y="82.9" font-size="8.4" text-anchor="middle" fill="#2E7D32" font-weight="normal">IP 192.168.1.5</text><rect x="18" y="96" width="104" height="32" rx="5" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.2"/><text x="70" y="112.1" font-size="8.8" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Browser</text><text x="70" y="124.9" font-size="8.2" text-anchor="middle" fill="#00796B" font-weight="normal">port 52000</text><rect x="18" y="136" width="104" height="32" rx="5" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.2"/><text x="70" y="152.1" font-size="8.8" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Mail app</text><text x="70" y="164.9" font-size="8.2" text-anchor="middle" fill="#00796B" font-weight="normal">port 52100</text><rect x="228" y="50" width="124" height="132" rx="8" fill="#FAFAFA" stroke="#666" stroke-width="1.2"/><text x="290" y="69.5" font-size="10" text-anchor="middle" fill="#1565C0" font-weight="bold">Server</text><text x="290" y="82.9" font-size="8.4" text-anchor="middle" fill="#2E7D32" font-weight="normal">IP 142.250.1.10</text><rect x="238" y="96" width="104" height="32" rx="5" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.2"/><text x="290" y="112.1" font-size="8.8" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Web server</text><text x="290" y="124.9" font-size="8.2" text-anchor="middle" fill="#00796B" font-weight="normal">port 80 / 443</text><rect x="238" y="136" width="104" height="32" rx="5" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.2"/><text x="290" y="152.1" font-size="8.8" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Mail server</text><text x="290" y="164.9" font-size="8.2" text-anchor="middle" fill="#00796B" font-weight="normal">port 25</text><path d="M124,112 L236,112" fill="none" stroke="#00796B" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="236.0,112.0 230.0,109.0 230.0,115.0" fill="#00796B"/><path d="M124,152 L236,152" fill="none" stroke="#00796B" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="236.0,152.0 230.0,149.0 230.0,155.0" fill="#00796B"/><text x="180" y="108.9" font-size="8.4" text-anchor="middle" fill="#00796B" font-weight="normal">TCP / UDP</text><rect x="12" y="194" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="212.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">IP address delivers to the right host; port number</text><text x="20" y="227.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">delivers to the right process. Functions: segmentation</text><text x="20" y="242.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">and reassembly, connection control, flow and error</text><text x="20" y="257.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">control end to end (TCP reliable, UDP fast).</text></svg>