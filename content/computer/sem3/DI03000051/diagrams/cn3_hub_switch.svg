.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Hub: layer 1, multiport repeater, one collision domain,</text><text x="20" y="261.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">half duplex, shares bandwidth.</text><text x="20" y="276.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Switch: layer 2, learns MAC addresses, full duplex,</text><text x="20" y="291.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">each port its own collision domain.</text></svg>