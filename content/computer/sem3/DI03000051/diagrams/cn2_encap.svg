roke="#2E7D32" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><polygon points="344.0,56.0 341.0,62.0 347.0,62.0" fill="#2E7D32"/><text x="320" y="48.8" font-size="8" text-anchor="middle" fill="#1565C0" font-weight="normal">send</text><text x="346" y="48.8" font-size="8" text-anchor="middle" fill="#2E7D32" font-weight="normal">recv</text><rect x="12" y="250" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="268.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Sender: each layer adds its header (H); data link also</text><text x="20" y="283.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">adds a trailer (T2 = error check). Receiver: each layer</text><text x="20" y="298.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">removes its own header and passes data up.</text></svg>