ze="9.6" text-anchor="start" fill="#222" font-weight="normal">Microwaves: 1-300 GHz, unidirectional (line of sight).</text><text x="20" y="234.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Infrared: 300 GHz-400 THz, short range, no walls.</text><text x="20" y="249.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">λ = c / f   (c = 3 × 10⁸ m/s)</text></svg>