<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 296" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="296" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Network Devices and OSI Layers</text><rect x="12" y="46" width="120" height="38" rx="5" fill="#FCE4EC" stroke="#C2185B" stroke-width="1.4"/><text x="72" y="72.4" font-size="9.6" text-anchor="middle" fill="#C2185B" font-weight="bold">7-4 Upper layers</text><rect x="138" y="46" width="210" height="38" rx="5" fill="#fff" stroke="#C2185B" stroke-width="1.2"/><text x="243" y="72.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">Gateway (protocol converter)</text><rect x="12" y="92" width="120" height="38" rx="5" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.4"/><text x="72" y="118.4" font-size="9.6" text-anchor="middle" fill="#2E7D32" font-weight="bold">3 Network</text><rect x="138" y="92" width="210" height="38" rx="5" fill="#fff" stroke="#2E7D32" stroke-width="1.2"/><text x="243" y="118.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">Router, Layer-3 switch</text><rect x="12" y="138" width="120" height="38" rx="5" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.4"/><text x="72" y="164.4" font-size="9.6" text-anchor="middle" fill="#E07B00" font-weight="bold">2 Data Link</text><rect x="138" y="138" width="210" height="38" rx="5" fill="#fff" stroke="#E07B00" stroke-width="1.2"/><text x="243" y="164.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">Switch, Bridge, NIC, Access point</text><rect x="12" y="184" width="120" height="38" rx="5" fill="#EFEBE9" stroke="#6D4C41" stroke-width="1.4"/><text x="72" y="210.4" font-size="9.6" text-anchor="middle" fill="#6D4C41" font-weight="bold">1 Physical</text><rect x="138" y="184" width="210" height="38" rx="5" fill="#fff" stroke="#6D4C41" stroke-width="1.2"/><text x="243" y="210.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">Hub, Repeater, cables, connectors</text><rect x="12" y="236" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="254.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Higher-layer devices also perform lower-layer jobs</text><text x="20" y="269.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">(a router also works at layers 1 and 2).</text><text x="20" y="284.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Gateway can work at all seven layers.</text></svg>