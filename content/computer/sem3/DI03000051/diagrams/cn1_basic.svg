<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 292" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="292" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Components of Data Communication</text><path d="M76.0,92.0 L284.0,92.0" fill="none" stroke="#00796B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="37" y="81" width="26" height="18" rx="2.5" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.4"/><rect x="40.5" y="84.5" width="19" height="11" rx="1" fill="#fff" stroke="#1565C0" stroke-width="0.7"/><path d="M50,99 L50,103" fill="none" stroke="#1565C0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M43,103.5 L57,103.5" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="297" y="81" width="26" height="18" rx="2.5" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.4"/><rect x="300.5" y="84.5" width="19" height="11" rx="1" fill="#fff" stroke="#2E7D32" stroke-width="0.7"/><path d="M310,99 L310,103" fill="none" stroke="#2E7D32" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M303,103.5 L317,103.5" fill="none" stroke="#2E7D32" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="50" y="121.5" font-size="10" text-anchor="middle" fill="#1565C0" font-weight="bold">Sender</text><text x="310" y="121.5" font-size="10" text-anchor="middle" fill="#2E7D32" font-weight="bold">Receiver</text><rect x="158" y="58" width="44" height="26" rx="3" fill="#FFF8E1" stroke="#E07B00" stroke-width="1.3"/><path d="M158,58 L180,74 L202,58" fill="none" stroke="#E07B00" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="180" y="53.5" font-size="10" text-anchor="middle" fill="#E07B00" font-weight="bold">Message</text><text x="180" y="110.3" font-size="9.4" text-anchor="middle" fill="#00796B" font-weight="bold">Transmission medium</text><path d="M214 71 L262 71" fill="none" stroke="#E07B00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="262.0,71.0 255.0,67.5 255.0,74.5" fill="#E07B00"/><rect x="8" y="130" width="84" height="54" rx="5" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><text x="50" y="147.3" font-size="9.4" text-anchor="middle" fill="#1565C0" font-weight="bold">Protocol</text><text x="50" y="160.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">Rule 1, Rule 2</text><text x="50" y="174.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">... Rule n</text><rect x="268" y="130" width="84" height="54" rx="5" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="310" y="147.3" font-size="9.4" text-anchor="middle" fill="#2E7D32" font-weight="bold">Protocol</text><text x="310" y="160.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">Rule 1, Rule 2</text><text x="310" y="174.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">... Rule n</text><rect x="12" y="202" width="336" height="85" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="220.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">1. Message: data to be sent (text, image, audio, video).</text><text x="20" y="235.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">2. Sender: device that sends the message.</text><text x="20" y="250.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">3. Receiver: device that receives the message.</text><text x="20" y="265.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">4. Medium: physical path (cable, radio waves).</text><text x="20" y="280.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">5. Protocol: rules both sides must follow.</text></svg>