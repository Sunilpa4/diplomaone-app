<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 238" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="238" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Network Layer vs Data Link Layer</text><path d="M54.0,128.0 L118.0,128.0" fill="none" stroke="#666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M154.0,128.0 L208.0,128.0" fill="none" stroke="#666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M244.0,128.0 L306.0,128.0" fill="none" stroke="#666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="23" y="117" width="26" height="18" rx="2.5" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.4"/><rect x="26.5" y="120.5" width="19" height="11" rx="1" fill="#fff" stroke="#1565C0" stroke-width="0.7"/><path d="M36,135 L36,139" fill="none" stroke="#1565C0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M29,139.5 L43,139.5" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="36" y="157.1" font-size="8.8" text-anchor="middle" fill="#1565C0" font-weight="bold">Host A</text><circle cx="136" cy="128" r="15" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.5"/><text x="136" y="135.3" font-size="9.4" text-anchor="middle" fill="#E07B00" font-weight="bold">R1</text><circle cx="226" cy="128" r="15" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.5"/><text x="226" y="135.3" font-size="9.4" text-anchor="middle" fill="#E07B00" font-weight="bold">R2</text><rect x="311" y="117" width="26" height="18" rx="2.5" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.4"/><rect x="314.5" y="120.5" width="19" height="11" rx="1" fill="#fff" stroke="#1565C0" stroke-width="0.7"/><path d="M324,135 L324,139" fill="none" stroke="#1565C0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M317,139.5 L331,139.5" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="324" y="157.1" font-size="8.8" text-anchor="middle" fill="#1565C0" font-weight="bold">Host B</text><path d="M36,72 L324,72" fill="none" stroke="#2E7D32" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="324.0,72.0 318.0,69.0 318.0,75.0" fill="#2E7D32"/><text x="180" y="67.1" font-size="8.8" text-anchor="middle" fill="#2E7D32" font-weight="bold">Network layer: source to destination (IP A to IP B)</text><path d="M40,96 L132,96" fill="none" stroke="#E07B00" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="132.0,96.0 126.0,93.0 126.0,99.0" fill="#E07B00"/><path d="M140,96 L222,96" fill="none" stroke="#E07B00" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="222.0,96.0 216.0,93.0 216.0,99.0" fill="#E07B00"/><path d="M230,96 L320,96" fill="none" stroke="#E07B00" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="320.0,96.0 314.0,93.0 314.0,99.0" fill="#E07B00"/><text x="180" y="185.1" font-size="8.8" text-anchor="middle" fill="#E07B00" font-weight="bold">Data link layer: hop to hop (node to node), MAC</text><text x="86" y="92.8" font-size="8" text-anchor="middle" fill="#E07B00" font-weight="normal">hop 1</text><text x="181" y="92.8" font-size="8" text-anchor="middle" fill="#E07B00" font-weight="normal">hop 2</text><text x="275" y="92.8" font-size="8" text-anchor="middle" fill="#E07B00" font-weight="normal">hop 3</text><rect x="12" y="196" width="336" height="40" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="214.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Network layer: logical (IP) addressing, routing (best</text><text x="20" y="229.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">path), packet forwarding, fragmentation. Device: router.</text></svg>