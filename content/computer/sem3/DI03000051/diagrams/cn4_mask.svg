<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 282" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="282" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Subnet Mask: Network Address (AND)</text><rect x="12" y="50" width="336" height="38" rx="5" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="68.2" font-size="9" text-anchor="start" fill="#1565C0" font-weight="bold">IP address</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="83.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="bold">10.6.24.20</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="155" y="77.0" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">00001010</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="210" y="77.0" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">00000110</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="265" y="77.0" font-size="8.6" text-anchor="middle" fill="#C62828" font-weight="bold">00011000</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="320" y="77.0" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">00010100</text><rect x="12" y="96" width="336" height="38" rx="5" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.1"/><text x="20" y="114.2" font-size="9" text-anchor="start" fill="#E07B00" font-weight="bold">Subnet mask</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="129.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="bold">255.255.240.0</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="155" y="123.0" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">11111111</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="210" y="123.0" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">11111111</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="265" y="123.0" font-size="8.6" text-anchor="middle" fill="#C62828" font-weight="bold">11110000</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="320" y="123.0" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">00000000</text><path d="M12,136 L348,136" fill="none" stroke="#222" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="12" y="142" width="336" height="38" rx="5" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.1"/><text x="20" y="160.2" font-size="9" text-anchor="start" fill="#2E7D32" font-weight="bold">AND = network</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="175.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="bold">10.6.16.0</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="155" y="169.0" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">00001010</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="210" y="169.0" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">00000110</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="265" y="169.0" font-size="8.6" text-anchor="middle" fill="#C62828" font-weight="bold">00010000</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="320" y="169.0" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">00000000</text><text x="180" y="198.9" font-size="8.4" text-anchor="middle" fill="#666" font-weight="normal">IP AND mask, bit by bit (1 AND 1 = 1, else 0)</text><text x="180" y="213.0" font-size="8.6" text-anchor="middle" fill="#C62828" font-weight="bold">octet 3: 24 AND 240 = 16 (00010000)</text><rect x="12" y="222" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="240.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Mask 1-bits mark the network part, 0-bits the host part.</text><text x="20" y="255.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">255.255.240.0 has 20 ones, so it is written /20.</text><text x="20" y="270.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Network address = 10.6.16.0 (class A, but subnetted).</text></svg>