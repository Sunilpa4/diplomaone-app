ble</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="72" y="224.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">192.168.1.0/24</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="288" y="224.9" font-size="8.4" text-anchor="end" fill="#E07B00" font-weight="normal">eth0</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="72" y="239.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">10.0.0.0/8</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="288" y="239.9" font-size="8.4" text-anchor="end" fill="#E07B00" font-weight="normal">eth1</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="72" y="254.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">0.0.0.0/0 (default)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="288" y="254.9" font-size="8.4" text-anchor="end" fill="#E07B00" font-weight="normal">wan0</text><rect x="12" y="276" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="294.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Layer 3 device: reads the destination IP address and</text><text x="20" y="309.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">forwards the packet on the best path. Separates</text><text x="20" y="324.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">broadcast domains; uses NAT, firewall, DHCP.</text></svg>