nt-weight="bold">3 Network</text><rect x="132" y="162" width="216" height="26" rx="4" fill="#fff" stroke="#2E7D32" stroke-width="1.2"/><text x="240" y="182.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="bold">Packet filter</text><rect x="12" y="192" width="112" height="26" rx="4" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.2"/><text x="68" y="212.2" font-size="9" text-anchor="middle" fill="#E07B00" font-weight="bold">2 Data Link</text><rect x="12" y="222" width="112" height="26" rx="4" fill="#EFEBE9" stroke="#6D4C41" stroke-width="1.2"/><text x="68" y="242.2" font-size="9" text-anchor="middle" fill="#6D4C41" font-weight="bold">1 Physical</text><rect x="12" y="256" width="336" height="40" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="274.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">Higher layer = more checking (content, users), more security,</text><text x="20" y="289.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">but slower. NGFW combines all, plus intrusion prevention.</text></svg>