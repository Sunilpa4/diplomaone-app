0" fill="none" stroke="#C62828" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="308.0,100.0 302.0,97.0 302.0,103.0" fill="#C62828"/><text x="110" y="92.9" font-size="8.4" text-anchor="middle" fill="#C62828" font-weight="normal">line of sight</text><text x="250" y="92.9" font-size="8.4" text-anchor="middle" fill="#C62828" font-weight="normal">about 50 km</text><rect x="12" y="200" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="218.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Parabolic dish antennas face each other on tall towers.</text><text x="20" y="233.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Repeaters needed because of earth's curvature.</text><text x="20" y="248.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Uses: mobile towers, TV links, long-distance telephone.</text></svg>