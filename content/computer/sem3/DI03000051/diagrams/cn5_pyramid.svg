l="#666"/><text x="342" y="64.7" font-size="7.6" text-anchor="end" fill="#666" font-weight="normal">skill, money, time</text><text x="342" y="76.7" font-size="7.6" text-anchor="end" fill="#666" font-weight="normal">increase upward</text><rect x="12" y="246" width="336" height="40" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="264.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Lower levels: many attacks, low skill, known tools.</text><text x="20" y="279.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Top: few attackers but very well funded and dangerous.</text></svg>