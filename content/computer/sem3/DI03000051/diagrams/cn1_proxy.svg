t x="12" y="200" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="218.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Intermediary between clients and the Internet.</text><text x="20" y="233.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Cache hit: page served from cache (faster, saves</text><text x="20" y="248.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">bandwidth). Hides client IP; blocks bad sites.</text></svg>