<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 322" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="322" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Classification of Transmission Media</text><rect x="105.0" y="39.0" width="150" height="26" rx="7" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="55.5" font-size="10" text-anchor="middle" fill="#222" font-weight="bold">Transmission media</text><path d="M180,65 L180,80 L92,80 L92,92" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><rect x="22.0" y="92.0" width="140" height="24" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="92" y="107.4" font-size="9.6" text-anchor="middle" fill="#222" font-weight="bold">Guided (wired)</text><path d="M180,65 L180,80 L268,80 L268,92" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><rect x="198.0" y="92.0" width="140" height="24" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.6"/><text x="268" y="107.4" font-size="9.6" text-anchor="middle" fill="#222" font-weight="bold">Unguided (wireless)</text><path d="M26,116 L26,230" fill="none" stroke="#666" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M26,154 L36,154" fill="none" stroke="#666" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><rect x="36" y="140" width="128" height="30" rx="4" fill="#fff" stroke="#1565C0" stroke-width="1.2"/><text x="100" y="156.2" font-size="9" text-anchor="middle" fill="#1565C0" font-weight="bold">Twisted pair</text><text x="100" y="167.7" font-size="7.8" text-anchor="middle" fill="#666" font-weight="normal">UTP, STP</text><path d="M26,192 L36,192" fill="none" stroke="#666" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><rect x="36" y="178" width="128" height="30" rx="4" fill="#fff" stroke="#1565C0" stroke-width="1.2"/><text x="100" y="194.2" font-size="9" text-anchor="middle" fill="#1565C0" font-weight="bold">Coaxial cable</text><text x="100" y="205.7" font-size="7.8" text-anchor="middle" fill="#666" font-weight="normal">RG-59, RG-58</text><path d="M26,230 L36,230" fill="none" stroke="#666" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><rect x="36" y="216" width="128" height="30" rx="4" fill="#fff" stroke="#1565C0" stroke-width="1.2"/><text x="100" y="232.2" font-size="9" text-anchor="middle" fill="#1565C0" font-weight="bold">Fiber optic</text><text x="100" y="243.7" font-size="7.8" text-anchor="middle" fill="#666" font-weight="normal">single / multimode</text><path d="M202,116 L202,230" fill="none" stroke="#666" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M202,154 L212,154" fill="none" stroke="#666" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><rect x="212" y="140" width="128" height="30" rx="4" fill="#fff" stroke="#2E7D32" stroke-width="1.2"/><text x="276" y="156.2" font-size="9" text-anchor="middle" fill="#2E7D32" font-weight="bold">Radio waves</text><text x="276" y="167.7" font-size="7.8" text-anchor="middle" fill="#666" font-weight="normal">3 kHz-1 GHz</text><path d="M202,192 L212,192" fill="none" stroke="#666" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><rect x="212" y="178" width="128" height="30" rx="4" fill="#fff" stroke="#2E7D32" stroke-width="1.2"/><text x="276" y="194.2" font-size="9" text-anchor="middle" fill="#2E7D32" font-weight="bold">Microwaves</text><text x="276" y="205.7" font-size="7.8" text-anchor="middle" fill="#666" font-weight="normal">1-300 GHz</text><path d="M202,230 L212,230" fill="none" stroke="#666" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><rect x="212" y="216" width="128" height="30" rx="4" fill="#fff" stroke="#2E7D32" stroke-width="1.2"/><text x="276" y="232.2" font-size="9" text-anchor="middle" fill="#2E7D32" font-weight="bold">Infrared</text><text x="276" y="243.7" font-size="7.8" text-anchor="middle" fill="#666" font-weight="normal">300 GHz-400 THz</text><rect x="12" y="262" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="280.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Guided: signal travels in a physical path (copper or glass).</text><text x="20" y="295.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Unguided: electromagnetic waves through air / vacuum,</text><text x="20" y="310.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">no physical conductor (also called wireless).</text></svg>