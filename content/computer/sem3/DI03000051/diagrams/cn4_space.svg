<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 296" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="296" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Address Space of Each Class</text><rect x="12.0" y="50" width="168.0" height="30" rx="0" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><text x="96.0" y="67.8" font-size="11" text-anchor="middle" fill="#1565C0" font-weight="bold">A</text><text x="96.0" y="78.7" font-size="7.6" text-anchor="middle" fill="#1565C0" font-weight="normal">50%</text><text x="12.0" y="94.7" font-size="7.6" text-anchor="start" fill="#666" font-weight="normal">0</text><rect x="180.0" y="50" width="84.0" height="30" rx="0" fill="#E0F2F1" stroke="#00796B" stroke-width="1.2"/><text x="222.0" y="67.8" font-size="11" text-anchor="middle" fill="#00796B" font-weight="bold">B</text><text x="222.0" y="78.7" font-size="7.6" text-anchor="middle" fill="#00796B" font-weight="normal">25%</text><text x="180.0" y="94.7" font-size="7.6" text-anchor="middle" fill="#666" font-weight="normal">128</text><rect x="264.0" y="50" width="42.0" height="30" rx="0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="285.0" y="67.8" font-size="11" text-anchor="middle" fill="#2E7D32" font-weight="bold">C</text><text x="285.0" y="78.7" font-size="7.6" text-anchor="middle" fill="#2E7D32" font-weight="normal">12.5%</text><text x="264.0" y="94.7" font-size="7.6" text-anchor="middle" fill="#666" font-weight="normal">192</text><rect x="306.0" y="50" width="21.0" height="30" rx="0" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.2"/><text x="316.5" y="67.8" font-size="11" text-anchor="middle" fill="#E07B00" font-weight="bold">D</text><text x="316.5" y="78.7" font-size="7.6" text-anchor="middle" fill="#E07B00" font-weight="normal"></text><text x="306.0" y="94.7" font-size="7.6" text-anchor="middle" fill="#666" font-weight="normal">224</text><rect x="327.0" y="50" width="21.0" height="30" rx="0" fill="#EEEEEE" stroke="#666" stroke-width="1.2"/><text x="337.5" y="67.8" font-size="11" text-anchor="middle" fill="#666" font-weight="bold">E</text><text x="337.5" y="78.7" font-size="7.6" text-anchor="middle" fill="#666" font-weight="normal"></text><text x="327.0" y="94.7" font-size="7.6" text-anchor="middle" fill="#666" font-weight="normal">240</text><text x="180" y="110.8" font-size="8" text-anchor="middle" fill="#666" font-weight="normal">first-octet value</text><rect x="12" y="118" width="336" height="22" rx="3" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.1"/><text x="20" y="136.0" font-size="8.6" text-anchor="start" fill="#7B2CD9" font-weight="bold">Class</text><text x="58" y="136.0" font-size="8.6" text-anchor="start" fill="#7B2CD9" font-weight="bold">Networks</text><text x="158" y="136.0" font-size="8.6" text-anchor="start" fill="#7B2CD9" font-weight="bold">Hosts / network</text><text x="300" y="136.0" font-size="8.6" text-anchor="start" fill="#7B2CD9" font-weight="bold">Mask</text><rect x="12" y="140" width="336" height="24" rx="0" fill="#fff" stroke="#7B2CD9" stroke-width="0.8"/><text x="20" y="159.5" font-size="10" text-anchor="start" fill="#7B2CD9" font-weight="bold">A</text><text x="58" y="158.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">2^7 = 128 *</text><text x="158" y="158.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">2^24 - 2 = 16,777,214</text><text x="300" y="158.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">/8</text><rect x="12" y="164" width="336" height="24" rx="0" fill="#fff" stroke="#7B2CD9" stroke-width="0.8"/><text x="20" y="183.5" font-size="10" text-anchor="start" fill="#7B2CD9" font-weight="bold">B</text><text x="58" y="182.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">2^14 = 16,384</text><text x="158" y="182.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">2^16 - 2 = 65,534</text><text x="300" y="182.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">/16</text><rect x="12" y="188" width="336" height="24" rx="0" fill="#fff" stroke="#7B2CD9" stroke-width="0.8"/><text x="20" y="207.5" font-size="10" text-anchor="start" fill="#7B2CD9" font-weight="bold">C</text><text x="58" y="206.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">2^21 = 2,097,152</text><text x="158" y="206.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">2^8 - 2 = 254</text><text x="300" y="206.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">/24</text><rect x="12" y="222" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="240.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Hosts = 2^(host bits) - 2: the all-0s host (network</text><text x="20" y="255.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">address) and all-1s host (broadcast) cannot be given</text><text x="20" y="270.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">to a device. Classful addressing wastes many addresses.</text><text x="20" y="285.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">* class A: 0 and 127 are reserved, so 126 usable.</text></svg>