text><rect x="12" y="214" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="232.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Example: Caesar cipher, key = 3 (each letter shifted by 3).</text><text x="20" y="247.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Symmetric: same secret key (AES). Asymmetric: public /</text><text x="20" y="262.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">private key pair (RSA). HTTPS, VPN, Wi-Fi WPA3 use it.</text></svg>