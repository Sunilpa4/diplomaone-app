<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="320" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Virus vs Worm</text><rect x="12" y="40" width="336" height="96" rx="6" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><text x="22" y="59.4" font-size="9.6" text-anchor="start" fill="#1565C0" font-weight="bold">Virus: attaches to a host file</text><rect x="24" y="70" width="84" height="34" rx="3" fill="#fff" stroke="#666" stroke-width="1.2"/><text x="55" y="93.0" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">game.exe</text><rect x="90" y="72" width="16" height="30" rx="2" fill="#FDECEC" stroke="#C62828" stroke-width="1.2"/><text x="98" y="116.6" font-size="7.4" text-anchor="middle" fill="#C62828" font-weight="normal">virus code</text><text x="118" y="86.8" font-size="8" text-anchor="start" fill="#666" font-weight="normal">user runs</text><text x="118" y="98.8" font-size="8" text-anchor="start" fill="#666" font-weight="normal">the file</text><path d="M162,87 L190,87" fill="none" stroke="#C62828" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="190.0,87.0 184.0,84.0 184.0,90.0" fill="#C62828"/><rect x="196" y="70" width="46" height="34" rx="3" fill="#fff" stroke="#666" stroke-width="1.2"/><text x="215" y="92.7" font-size="7.6" text-anchor="middle" fill="#222" font-weight="normal">a.doc</text><rect x="232" y="72" width="8" height="30" rx="1.5" fill="#FDECEC" stroke="#C62828" stroke-width="1"/><rect x="244" y="70" width="46" height="34" rx="3" fill="#fff" stroke="#666" stroke-width="1.2"/><text x="263" y="92.7" font-size="7.6" text-anchor="middle" fill="#222" font-weight="normal">b.exe</text><rect x="280" y="72" width="8" height="30" rx="1.5" fill="#FDECEC" stroke="#C62828" stroke-width="1"/><rect x="292" y="70" width="46" height="34" rx="3" fill="#fff" stroke="#666" stroke-width="1.2"/><text x="311" y="92.7" font-size="7.6" text-anchor="middle" fill="#222" font-weight="normal">c.exe</text><rect x="328" y="72" width="8" height="30" rx="1.5" fill="#FDECEC" stroke="#C62828" stroke-width="1"/><text x="272" y="120.7" font-size="7.8" text-anchor="middle" fill="#C62828" font-weight="normal">infects other files</text><rect x="12" y="146" width="336" height="104" rx="6" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="22" y="165.4" font-size="9.6" text-anchor="start" fill="#2E7D32" font-weight="bold">Worm: standalone, spreads by itself over network</text><path d="M60,206 L114,186" fill="none" stroke="#C62828" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="116.0,186.0 110.5,184.9 111.8,189.7" fill="#C62828"/><path d="M60,206 L114,230" fill="none" stroke="#C62828" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="116.0,230.0 111.8,226.3 110.5,231.1" fill="#C62828"/><path d="M144,186 L204,196" fill="none" stroke="#C62828" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="206.0,196.0 201.8,192.3 200.5,197.1" fill="#C62828"/><path d="M144,230 L204,196" fill="none" stroke="#C62828" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="206.0,196.0 200.5,194.9 201.8,199.7" fill="#C62828"/><path d="M234,196 L290,186" fill="none" stroke="#C62828" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="292.0,186.0 286.5,184.9 287.8,189.7" fill="#C62828"/><path d="M234,196 L290,230" fill="none" stroke="#C62828" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="292.0,230.0 287.8,226.3 286.5,231.1" fill="#C62828"/><rect x="33" y="195" width="26" height="18" rx="2.5" fill="#FDECEC" stroke="#C62828" stroke-width="1.4"/><rect x="36.5" y="198.5" width="19" height="11" rx="1" fill="#fff" stroke="#C62828" stroke-width="0.7"/><path d="M46,213 L46,217