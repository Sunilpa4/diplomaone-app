#C62828" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="293" y="219" width="26" height="18" rx="2.5" fill="#FDECEC" stroke="#C62828" stroke-width="1.4"/><rect x="296.5" y="222.5" width="19" height="11" rx="1" fill="#fff" stroke="#C62828" stroke-width="0.7"/><path d="M306,237 L306,241" fill="none" stroke="#C62828" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M299,241.5 L313,241.5" fill="none" stroke="#C62828" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="46" y="232.6" font-size="7.4" text-anchor="middle" fill="#C62828" font-weight="normal">first victim</text><rect x="12" y="260" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="278.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Virus needs a host program and user action to spread.</text><text x="20" y="293.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Worm copies itself through network flaws automatically,</text><text x="20" y="308.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">eating bandwidth (e.g. WannaCry 2017, ILOVEYOU 2000).</text></svg>