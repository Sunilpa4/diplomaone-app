oup</text><rect x="12" y="188" width="336" height="66" rx="6" fill="#fff" stroke="#2E7D32" stroke-width="1.2"/><text x="22" y="207.5" font-size="10" text-anchor="start" fill="#2E7D32" font-weight="bold">Anycast</text><text x="22" y="219.8" font-size="8" text-anchor="start" fill="#666" font-weight="normal">one to nearest of group</text><rect x="33" y="223" width="26" height="18" rx="2.5" fill="#fff" stroke="#2E7D32" stroke-width="1.4"/><rect x="36.5" y="226.5" width="19" height="11" rx="1" fill="#fff" stroke="#2E7D32" stroke-width="0.7"/><path d="M46,241 L46,245" fill="none" stroke="#2E7D32" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M39,245.5 L53,245.5" fill="none" stroke="#2E7D32" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M64,232 L270,204" fill="none" stroke="#2E7D32" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="270.0,204.0 264.0,201.0 264.0,207.0" fill="#2E7D32"/><rect x="274" y="197" width="30" height="14" rx="3" fill="#2E7D32" stroke="#2E7D32" stroke-width="1"/><text x="289" y="209.7" font-size="7.6" text-anchor="middle" fill="#fff" font-weight="bold">R1</text><rect x="274" y="217" width="30" height="14" rx="3" fill="#fff" stroke="#2E7D32" stroke-width="1"/><text x="289" y="229.7" font-size="7.6" text-anchor="middle" fill="#666" font-weight="bold">R2</text><rect x="274" y="237" width="30" height="14" rx="3" fill="#fff" stroke="#2E7D32" stroke-width="1"/><text x="289" y="249.7" font-size="7.6" text-anchor="middle" fill="#666" font-weight="bold">R3</text><rect x="268" y="192" width="44" height="58" rx="5" fill="none" stroke="#2E7D32" stroke-width="1" stroke-dasharray="3,2"/><text x="330" y="226.7" font-size="7.6" text-anchor="middle" fill="#2E7D32" font-weight="bold">group</text><text x="200" y="250.7" font-size="7.6" text-anchor="middle" fill="#2E7D32" font-weight="normal">R1 is the nearest member</text><rect x="12" y="266" width="336" height="40" rx="7" fill