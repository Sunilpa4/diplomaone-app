<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 296" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="296" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Proxy Firewall (Application Gateway)</text><rect x="27" y="85" width="26" height="18" rx="2.5" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.4"/><rect x="30.5" y="88.5" width="19" height="11" rx="1" fill="#fff" stroke="#1565C0" stroke-width="0.7"/><path d="M40,103 L40,107" fill="none" stroke="#1565C0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M33,107.5 L47,107.5" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="121.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">Client</text><rect x="126" y="60" width="108" height="96" rx="8" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.4"/><text x="180" y="81.5" font-size="10" text-anchor="middle" fill="#E07B00" font-weight="bold">Proxy</text><text x="180" y="98.7" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">checks URL, user,</text><text x="180" y="111.7" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">commands, content</text><text x="180" y="124.7" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">(HTTP, FTP, SMTP)</text><text x="180" y="137.7" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">logs and caches</text><rect x="307" y="82" width="26" height="30" rx="2.5" fill="#E0F2F1" stroke="#00796B" stroke-width="1.4"/><path d="M311,90 L324,90" fill="none" stroke="#00796B" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="328" cy="90" r="1.5" fill="#00796B"/><path d="M311,98 L324,98" fill="none" stroke="#00796B" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="328" cy="98" r="1.5" fill="#00796B"/><path d="M311,106 L324,106" fill="none" stroke="#00796B" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="328" cy="106" r="1.5" fill="#00796B"/><text x="320" y="126.9" font-size="8.4" text-anchor="middle" fill="#00796B" font-weight="bold">Server</text><path d="M58,88 L124,88" fill="none" stroke="#1565C0" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="124.0,88.0 118.0,85.0 118.0,91.0" fill="#1565C0"/><path d="M124,106 L58,106" fill="none" stroke="#1565C0" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="58.0,106.0 64.0,109.0 64.0,103.0" fill="#1565C0"/><path d="M236,88 L302,88" fill="none" stroke="#00796B" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="302.0,88.0 296.0,85.0 296.0,91.0" fill="#00796B"/><path d="M302,106 L236,106" fill="none" stroke="#00796B" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="236.0,106.0 242.0,109.0 242.0,103.0" fill="#00796B"/><text x="91" y="84.7" font-size="7.6" text-anchor="middle" fill="#1565C0" font-weight="bold">conn. 1</text><text x="269" y="84.7" font-size="7.6" text-anchor="middle" fill="#00796B" font-weight="bold">conn. 2</text><text x="180" y="180.9" font-size="8.4" text-anchor="middle" fill="#7B2CD9" font-weight="bold">No direct connection between client and server:</text><text x="180" y="193.9" font-size="8.4" text-anchor="middle" fill="#7B2CD9" font-weight="normal">the server sees only the proxy's address.</text><rect x="30" y="202" width="130" height="22" rx="3" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="95.0" y="219.0" font-size="8.4" text-anchor="middle" fill="#2E7D32" font-weight="normal">GET /notes.html</text><path d="M166,213 L170,218 L179,207" fill="none" stroke="#2E7D32" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="200" y="202" width="130" height="22" rx="3" fill="#FDECEC" stroke="#C62828" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="265.0" y="219.0" font-size="8.4" text-anchor="middle" fill="#C62828" font-weight="normal">GET /virus.exe</text><path d="M336,207 L348,219 M336,219 L348,207" fill="none" stroke="#C62828" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="12" y="236" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="254.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Works at the application layer (layer 7); understands</text><text x="20" y="269.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">the protocol, so it can filter content and authenticate</text><text x="20" y="284.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">users. More secure but slower; one proxy per service.</text></svg>