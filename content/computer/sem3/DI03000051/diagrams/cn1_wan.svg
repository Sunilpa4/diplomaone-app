 y="223.3" font-size="9.4" text-anchor="middle" fill="#1565C0" font-weight="bold">Chennai LAN</text><text x="180" y="73.0" font-size="8.6" text-anchor="middle" fill="#00796B" font-weight="normal">leased line / fiber</text><text x="180" y="229.0" font-size="8.6" text-anchor="middle" fill="#666" font-weight="normal">R = router</text><rect x="150" y="112" width="60" height="24" rx="12" fill="#FFF8E1" stroke="#E07B00" stroke-width="1.2"/><text x="180" y="131.0" font-size="8.6" text-anchor="middle" fill="#E07B00" font-weight="normal">satellite</text><rect x="12" y="238" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="256.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Covers a country / continent (100s-1000s of km).</text><text x="20" y="271.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Uses routers, leased lines, fiber, satellite links.</text><text x="20" y="286.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Lower speed, higher cost and delay than LAN.</text></svg>