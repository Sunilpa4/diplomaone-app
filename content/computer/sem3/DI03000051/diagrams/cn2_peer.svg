</text><rect x="135" y="212" width="90" height="24" rx="4" fill="#EFEBE9" stroke="#6D4C41" stroke-width="1.2"/><text x="180.0" y="231.1" font-size="8.8" text-anchor="middle" fill="#6D4C41" font-weight="bold">1 Physical</text><path d="M105,224.0 L132,224.0" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3,3"/><polygon points="132.0,224.0 126.0,221.0 126.0,227.0" fill="#666"/><polygon points="105.0,224.0 111.0,227.0 111.0,221.0" fill="#666"/><path d="M228,224.0 L255,224.0" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3,3"/><polygon points="255.0,224.0 249.0,221.0 249.0,227.0" fill="#666"/><polygon points="228.0,224.0 234.0,227.0 234.0,221.0" fill="#666"/><text x="57" y="41.4" font-size="9.6" text-anchor="middle" fill="#1565C0" font-weight="bold">Host A</text><text x="303" y="41.4" font-size="9.6" text-anchor="middle" fill="#1565C0" font-weight="bold">Host B</text><text x="180" y="151.4" font-size="9.6" text-anchor="middle" fill="#E07B00" font-weight="bold">Router</text><path d="M57.0,236 L57.0,246 L303.0,246 L303.0,236" fill="none" stroke="#C62828" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="180" y="262.0" font-size="8.6" text-anchor="middle" fill="#C62828" font-weight="normal">physical communication (medium)</text><rect x="12" y="268" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="286.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Dashed: peer-to-peer (logical) communication between</text><text x="20" y="301.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">the same layers using protocols. Data actually flows</text><text x="20" y="316.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">down at A, over the medium, and up at B. A router</text><text x="20" y="331.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">uses only layers 1-3.</text></svg>