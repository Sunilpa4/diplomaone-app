<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 334" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="334" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">SQL Operators</text><rect x="14" y="34" width="160" height="96" rx="8" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.4"/><text x="94.0" y="52.7" font-size="10.5" text-anchor="middle" fill="#1565C0" font-weight="bold">Arithmetic</text><text x="94.0" y="70.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">+   -   *   /</text><text x="94.0" y="83.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">sal * 12</text><text x="94.0" y="96.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">sal + comm</text><text x="94.0" y="109.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">(no % ; use MOD)</text><rect x="186" y="34" width="160" height="96" rx="8" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.4"/><text x="266.0" y="52.7" font-size="10.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">Comparison</text><text x="266.0" y="70.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">=   &lt;&gt;  !=</text><text x="266.0" y="83.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">&gt;   &lt;   &gt;=  &lt;=</text><text x="266.0" y="96.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">sal &gt;= 30000</text><text x="266.0" y="109.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">job &lt;&gt; 'CLERK'</text><rect x="14" y="140" width="160" height="96" rx="8" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.4"/><text x="94.0" y="158.7" font-size="10.5" text-anchor="middle" fill="#E07B00" font-weight="bold">Logical</text><text x="94.0" y="176.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">AND  OR  NOT</text><text x="94.0" y="189.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">TRUE only if both</text><text x="94.0" y="202.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">(AND) / any (OR)</text><text x="94.0" y="215.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">NOT reverses</text><rect x="186" y="140" width="160" height="96" rx="8" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.4"/><text x="266.0" y="158.7" font-size="10.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Special</text><text x="266.0" y="176.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">IN  BETWEEN  LIKE</text><text x="266.0" y="189.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">IS NULL  EXISTS</text><text x="266.0" y="202.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">ANY  ALL</text><text x="266.0" y="215.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">(+ NOT forms)</text><text x="180" y="259.7" font-size="10.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Precedence (high to low)</text><rect x="14" y="264" width="332" height="58" rx="7" fill="#FBF8FF" stroke="#7B2CD9" stroke-width="1.1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="283.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">1. ( )   2. * /   3. + -   4. ||</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="299.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">5. = &lt;&gt; &lt; &gt; &lt;= &gt;= IN LIKE BETWEEN</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="315.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">   IS NULL   6. NOT   7. AND   8. OR</text></svg>