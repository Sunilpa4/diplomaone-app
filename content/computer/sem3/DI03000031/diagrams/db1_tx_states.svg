<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 314" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="314" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">States of a Transaction</text><path d="M92.5 109.1 L131.7 72.9" fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><polygon points="133.5,72.0 125.6,72.0 128.8,78.3" fill="#222"/><text x="96" y="83.0" font-size="8.6" text-anchor="end" fill="#666" font-weight="normal">last statement</text><path d="M211.0 62.0 L263.0 62.0" fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><polygon points="265.0,62.0 258.0,58.5 258.0,65.5" fill="#222"/><text x="238" y="54.9" font-size="8.2" text-anchor="middle" fill="#2E7D32" font-weight="bold">COMMIT</text><path d="M92.5 130.9 L131.7 167.1" fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><polygon points="133.5,168.0 128.8,161.7 125.6,168.0" fill="#222"/><text x="96" y="169.0" font-size="8.6" text-anchor="end" fill="#C62828" font-weight="normal">error</text><path d="M170.0 86.0 L170.0 154.0" fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><polygon points="170.0,156.0 173.5,149.0 166.5,149.0" fill="#222"/><text x="176" y="125.0" font-size="8.6" text-anchor="start" fill="#C62828" font-weight="normal">failure</text><path d="M211.0 178.0 L263.0 178.0" fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><polygon points="265.0,178.0 258.0,174.5 258.0,181.5" fill="#222"/><text x="238" y="194.9" font-size="8.2" text-anchor="middle" fill="#C62828" font-weight="bold">ROLLBACK</text><rect x="16" y="98" width="80" height="44" rx="20" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="56" y="123.4" font-size="9.8" text-anchor="middle" fill="#1565C0" font-weight="bold">Active</text><rect x="130" y="40" width="80" height="44" rx="20" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.6"/><text x="170" y="59.4" font-size="9.8" text-anchor="middle" fill="#E07B00" font-weight="bold">Partially</text><text x="170" y="71.4" font-size="9.8" text-anchor="middle" fill="#E07B00" font-weight="bold">committed</text><rect x="266" y="40" width="80" height="44" rx="20" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.6"/><text x="306" y="65.4" font-size="9.8" text-anchor="middle" fill="#2E7D32" font-weight="bold">Committed</text><rect x="130" y="156" width="80" height="44" rx="20" fill="#FDECEC" stroke="#C62828" stroke-width="1.6"/><text x="170" y="181.4" font-size="9.8" text-anchor="middle" fill="#C62828" font-weight="bold">Failed</text><rect x="266" y="156" width="80" height="44" rx="20" fill="#FDECEC" stroke="#C62828" stroke-width="1.6"/><text x="306" y="181.4" font-size="9.8" text-anchor="middle" fill="#C62828" font-weight="bold">Aborted</text><rect x="12" y="214" width="336" height="100" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="232.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">Active: statements are running.</text><text x="20" y="247.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">Partially committed: last statement done,</text><text x="20" y="262.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal"> changes still in memory.</text><text x="20" y="277.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">Committed: changes saved permanently.</text><text x="20" y="292.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">Failed/Aborted: error, changes undone; the</text><text x="20" y="307.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal"> transaction may be restarted or killed.</text></svg>