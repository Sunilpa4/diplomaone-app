<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 336" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="336" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">ACID Properties of a Transaction</text><text x="180" y="43.5" font-size="10" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Transfer Rs 500 from account A to B</text><rect x="60" y="48" width="240" height="36" rx="6" fill="#FBF8FF" stroke="#7B2CD9" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="64.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">UPDATE A: bal = bal - 500</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="79.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">UPDATE B: bal = bal + 500</text><rect x="14" y="96" width="162" height="72" rx="8" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.5"/><circle cx="34" cy="116" r="12" fill="#1565C0"/><text x="34" y="120.2" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold">A</text><text x="54" y="119.8" font-size="11" text-anchor="start" fill="#1565C0" font-weight="bold">Atomicity</text><text x="95" y="143.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">all or nothing:</text><text x="95" y="156.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">both updates or none</text><rect x="184" y="96" width="162" height="72" rx="8" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.5"/><circle cx="204" cy="116" r="12" fill="#2E7D32"/><text x="204" y="120.2" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold">C</text><text x="224" y="119.8" font-size="11" text-anchor="start" fill="#2E7D32" font-weight="bold">Consistency</text><text x="265" y="143.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">A+B total stays</text><text x="265" y="156.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">the same (valid state)</text><rect x="14" y="178" width="162" height="72" rx="8" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.5"/><circle cx="34" cy="198" r="12" fill="#E07B00"/><text x="34" y="202.2" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold">I</text><text x="54" y="201.8" font-size="11" text-anchor="start" fill="#E07B00" font-weight="bold">Isolation</text><text x="95" y="225.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">others don't see half-</text><text x="95" y="238.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">done work</text><rect x="184" y="178" width="162" height="72" rx="8" fill="#FDECEC" stroke="#C62828" stroke-width="1.5"/><circle cx="204" cy="198" r="12" fill="#C62828"/><text x="204" y="202.2" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold">D</text><text x="224" y="201.8" font-size="11" text-anchor="start" fill="#C62828" font-weight="bold">Durability</text><text x="265" y="225.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">after COMMIT, change</text><text x="265" y="238.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">survives crash</text><rect x="12" y="264" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="282.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">Atomicity: ROLLBACK / recovery manager</text><text x="20" y="297.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">Consistency: constraints + correct program</text><text x="20" y="312.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">Isolation: locking (concurrency control)</text><text x="20" y="327.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">Durability: redo logs, backup</text></svg>