<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 364" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="364" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Types of Triggers</text><rect x="8" y="44" width="96" height="22" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="56.0" y="58.1" font-size="8.8" text-anchor="middle" fill="#fff" font-weight="bold"></text><rect x="104" y="44" width="122" height="22" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="165.0" y="58.1" font-size="8.8" text-anchor="middle" fill="#fff" font-weight="bold">Row level</text><rect x="226" y="44" width="126" height="22" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="289.0" y="58.1" font-size="8.8" text-anchor="middle" fill="#fff" font-weight="bold">Statement level</text><rect x="8" y="66" width="96" height="22" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="56.0" y="80.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">Clause</text><rect x="104" y="66" width="122" height="22" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="165.0" y="80.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">FOR EACH ROW</text><rect x="226" y="66" width="126" height="22" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="289.0" y="80.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">(default)</text><rect x="8" y="88" width="96" height="22" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="56.0" y="102.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">Fires</text><rect x="104" y="88" width="122" height="22" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="165.0" y="102.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">once per row</text><rect x="226" y="88" width="126" height="22" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="289.0" y="102.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">once per statement</text><rect x="8" y="110" width="96" height="22" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="56.0" y="124.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">0 rows changed</text><rect x="104" y="110" width="122" height="22" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="165.0" y="124.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">does not fire</text><rect x="226" y="110" width="126" height="22" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="289.0" y="124.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">still fires once</text><rect x="8" y="132" width="96" height="22" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="56.0" y="146.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">:NEW / :OLD</text><rect x="104" y="132" width="122" height="22" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="165.0" y="146.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">available</text><rect x="226" y="132" width="126" height="22" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="289.0" y="146.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">not available</text><rect x="8" y="154" width="96" height="22" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="56.0" y="168.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">Example</text><rect x="104" y="154" width="122" height="22" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="165.0" y="168.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">audit each change</text><rect x="226" y="154" width="126" height="22" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="289.0" y="168.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">log / time check</text><text x="14" y="199.4" font-size="9.8" text-anchor="start" fill="#7B2CD9" font-weight="bold">Values available in row triggers</text><rect x="8" y="204" width="96" height="21" rx="0" fill="#00796B" stroke="#C9B3EC" stroke-width="1"/><text x="56.0" y="217.6" font-size="8.8" text-anchor="middle" fill="#fff" font-weight="bold">Event</text><rect x="104" y="204" width="122" height="21" rx="0" fill="#00796B" stroke="#C9B3EC" stroke-width="1"/><text x="165.0" y="217.6" font-size="8.8" text-anchor="middle" fill="#fff" font-weight="bold">:OLD</text><rect x="226" y="204" width="126" height="21" rx="0" fill="#00796B" stroke="#C9B3EC" stroke-width="1"/><text x="289.0" y="217.6" font-size="8.8" text-anchor="middle" fill="#fff" font-weight="bold">:NEW</text><rect x="8" y="225" width="96" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="56.0" y="238.6" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">INSERT</text><rect x="104" y="225" width="122" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="165.0" y="238.6" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">NULL</text><rect x="226" y="225" width="126" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="289.0" y="238.6" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">new row</text><rect x="8" y="246" width="96" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="56.0" y="259.6" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">UPDATE</text><rect x="104" y="246" width="122" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="165.0" y="259.6" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">old values</text><rect x="226" y="246" width="126" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="289.0" y="259.6" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">new values</text><rect x="8" y="267" width="96" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="56.0" y="280.6" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">DELETE</text><rect x="104" y="267" width="122" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="165.0" y="280.6" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">deleted row</text><rect x="226" y="267" width="126" height="21" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="289.0" y="280.6" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">NULL</text><rect x="12" y="298" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="316.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">BEFORE: check or change data before it is saved.</text><text x="20" y="331.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">AFTER: audit or copy data after it is saved.</text><text x="20" y="346.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">2 timings x 2 levels x 3 events = 12 basic types.</text></svg>