<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 302" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="302" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Schema, Sub-schema and Instance</text><text x="180" y="45.5" font-size="10" text-anchor="middle" fill="#1565C0" font-weight="bold">Schema (structure, rarely changes)</text><rect x="30" y="50" width="300" height="26" rx="6" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.4"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="66.4" font-size="9.6" text-anchor="middle" fill="#222" font-weight="normal">STUDENT(rollno, name, branch, city, marks)</text><text x="180" y="101.5" font-size="10" text-anchor="middle" fill="#2E7D32" font-weight="bold">Instance (data at one moment, changes often)</text><rect x="30" y="106" width="54" height="20" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="57.0" y="119.2" font-size="9" text-anchor="middle" fill="#fff" font-weight="bold">ROLLNO</text><rect x="84" y="106" width="62" height="20" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="115.0" y="119.2" font-size="9" text-anchor="middle" fill="#fff" font-weight="bold">NAME</text><rect x="146" y="106" width="56" height="20" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="174.0" y="119.2" font-size="9" text-anchor="middle" fill="#fff" font-weight="bold">BRANCH</text><rect x="202" y="106" width="72" height="20" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="238.0" y="119.2" font-size="9" text-anchor="middle" fill="#fff" font-weight="bold">CITY</text><rect x="274" y="106" width="56" height="20" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="302.0" y="119.2" font-size="9" text-anchor="middle" fill="#fff" font-weight="bold">MARKS</text><rect x="30" y="126" width="54" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="57.0" y="139.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">1</text><rect x="84" y="126" width="62" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="115.0" y="139.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">Aarav</text><rect x="146" y="126" width="56" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="174.0" y="139.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">CE</text><rect x="202" y="126" width="72" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="238.0" y="139.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">Surat</text><rect x="274" y="126" width="56" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="302.0" y="139.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">82</text><rect x="30" y="146" width="54" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="57.0" y="159.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">2</text><rect x="84" y="146" width="62" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="115.0" y="159.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">Diya</text><rect x="146" y="146" width="56" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="174.0" y="159.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">IT</text><rect x="202" y="146" width="72" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="238.0" y="159.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">Vadodara</text><rect x="274" y="146" width="56" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="302.0" y="159.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">91</text><text x="180" y="189.5" font-size="10" text-anchor="middle" fill="#E07B00" font-weight="bold">Sub-schema (part of schema seen by a user)</text><rect x="30" y="194" width="300" height="26" rx="6" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.4"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="210.4" font-size="9.6" text-anchor="middle" fill="#222" font-weight="normal">Exam cell view: (rollno, name, marks)</text><rect x="12" y="232" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="250.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Schema = design / blueprint (like a class).</text><text x="20" y="265.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Instance = actual data stored now (like objects).</text><text x="20" y="280.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">Sub-schema = subset of the schema for one user</text><text x="20" y="295.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">group; hides other data (security).</text></svg>