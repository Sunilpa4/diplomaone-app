l="#2E7D32" font-weight="bold">+ DB</text><text x="270" y="225.2" font-size="9" text-anchor="middle" fill="#2E7D32" font-weight="normal">one shared database</text><rect x="12" y="240" width="336" height="85" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="258.4" font-size="9.6" text-anchor="start" fill="#C62828" font-weight="normal"> File system problems:</text><text x="20" y="273.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">  redundancy, inconsistency, difficult access,</text><text x="20" y="288.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">  no security, no concurrent access, no recovery.</text><text x="20" y="303.4" font-size="9.6" text-anchor="start" fill="#2E7D32" font-weight="normal"> DBMS solves them:</text><text x="20" y="318.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">  shared data, integrity, security, backup.</text></svg>