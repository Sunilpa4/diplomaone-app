<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 310" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="310" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">PL/SQL Engine</text><rect x="130" y="42" width="218" height="174" rx="8" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.5"/><text x="239" y="59.5" font-size="10" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Oracle Server</text><rect x="12" y="58" width="100" height="84" rx="6" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.5"/><text x="62" y="74.2" font-size="9" text-anchor="middle" fill="#1565C0" font-weight="bold">PL/SQL block</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="89.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">BEGIN</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="102.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal"> IF ...</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="115.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal"> UPDATE ...</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="20" y="128.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">END;</text><path d="M112 100 L136 100" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="142.0,100.0 135.0,96.5 135.0,103.5" fill="#1565C0"/><path d="M239 142 L239 160" fill="none" stroke="#E07B00" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="239.0,166.0 242.5,159.0 235.5,159.0" fill="#E07B00"/><rect x="142" y="66" width="194" height="76" rx="6" fill="#fff" stroke="#7B2CD9" stroke-width="1.3"/><text x="239" y="82.4" font-size="9.6" text-anchor="middle" fill="#7B2CD9" font-weight="bold">PL/SQL Engine</text><rect x="152" y="88" width="174" height="22" rx="4" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.1"/><text x="239" y="102.0" font-size="8.6" text-anchor="middle" fill="#2E7D32" font-weight="normal">Procedural statement executor</text><text x="239" y="131.0" font-size="8.6" text-anchor="middle" fill="#666" font-weight="normal">IF, LOOP, :=, variables</text><text x="246" y="156.9" font-size="8.4" text-anchor="start" fill="#E07B00" font-weight="normal">SQL statements</text><rect x="142" y="168" width="194" height="40" rx="6" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.3"/><text x="239" y="185.3" font-size="9.4" text-anchor="middle" fill="#E07B00" font-weight="bold">SQL Statement Executor</text><text x="239" y="201.0" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">SELECT, INSERT, UPDATE ...</text><rect x="12" y="228" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="246.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">SQL alone: every statement goes to the server</text><text x="20" y="261.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">separately (many network trips).</text><text x="20" y="276.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">PL/SQL: the whole block is sent at once. Procedural</text><text x="20" y="291.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">parts run in the PL/SQL engine, SQL in the SQL engine.</text></svg>