<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 348" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="348" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Order of Execution of a SELECT</text><rect x="40" y="36" width="280" height="30" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.4"/><circle cx="58" cy="51" r="10" fill="#1565C0"/><text x="58" y="54.5" font-size="10" text-anchor="middle" fill="#fff" font-weight="bold">1</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="76" y="54.7" font-size="10.5" text-anchor="start" fill="#1565C0" font-weight="bold">FROM / JOIN</text><text x="310" y="54.1" font-size="9" text-anchor="end" fill="#222" font-weight="normal">pick tables, join rows</text><path d="M180 66 L180 74" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,74.0 183.5,67.0 176.5,67.0" fill="#222"/><rect x="40" y="74" width="280" height="30" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.4"/><circle cx="58" cy="89" r="10" fill="#1565C0"/><text x="58" y="92.5" font-size="10" text-anchor="middle" fill="#fff" font-weight="bold">2</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="76" y="92.7" font-size="10.5" text-anchor="start" fill="#1565C0" font-weight="bold">WHERE</text><text x="310" y="92.2" font-size="9" text-anchor="end" fill="#222" font-weight="normal">filter rows</text><path d="M180 104 L180 112" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,112.0 183.5,105.0 176.5,105.0" fill="#222"/><rect x="40" y="112" width="280" height="30" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.4"/><circle cx="58" cy="127" r="10" fill="#2E7D32"/><text x="58" y="130.5" font-size="10" text-anchor="middle" fill="#fff" font-weight="bold">3</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="76" y="130.7" font-size="10.5" text-anchor="start" fill="#2E7D32" font-weight="bold">GROUP BY</text><text x="310" y="130.2" font-size="9" text-anchor="end" fill="#222" font-weight="normal">form groups</text><path d="M180 142 L180 150" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,150.0 183.5,143.0 176.5,143.0" fill="#222"/><rect x="40" y="150" width="280" height="30" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.4"/><circle cx="58" cy="165" r="10" fill="#2E7D32"/><text x="58" y="168.5" font-size="10" text-anchor="middle" fill="#fff" font-weight="bold">4</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="76" y="168.7" font-size="10.5" text-anchor="start" fill="#2E7D32" font-weight="bold">HAVING</text><text x="310" y="168.2" font-size="9" text-anchor="end" fill="#222" font-weight="normal">filter groups</text><path d="M180 180 L180 188" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,188.0 183.5,181.0 176.5,181.0" fill="#222"/><rect x="40" y="188" width="280" height="30" rx="7" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.4"/><circle cx="58" cy="203" r="10" fill="#E07B00"/><text x="58" y="206.5" font-size="10" text-anchor="middle" fill="#fff" font-weight="bold">5</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="76" y="206.7" font-size="10.5" text-anchor="start" fill="#E07B00" font-weight="bold">SELECT</text><text x="310" y="206.2" font-size="9" text-anchor="end" fill="#222" font-weight="normal">compute columns, aliases</text><path d="M180 218 L180 226" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,226.0 183.5,219.0 176.5,219.0" fill="#222"/><rect x="40" y="226" width="280" height="30" rx="7" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.4"/><circle cx="58" cy="241" r="10" fill="#E07B00"/><text x="58" y="244.5" font-size="10" text-anchor="middle" fill="#fff" font-weight="bold">6</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="76" y="244.7" font-size="10.5" text-anchor="start" fill="#E07B00" font-weight="bold">DISTINCT</text><text x="310" y="244.2" font-size="9" text-anchor="end" fill="#222" font-weight="normal">remove duplicates</text><path d="M180 256 L180 264" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,264.0 183.5,257.0 176.5,257.0" fill="#222"/><rect x="40" y="264" width="280" height="30" rx="7" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.4"/><circle cx="58" cy="279" r="10" fill="#7B2CD9"/><text x="58" y="282.5" font-size="10" text-anchor="middle" fill="#fff" font-weight="bold">7</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="76" y="282.7" font-size="10.5" text-anchor="start" fill="#7B2CD9" font-weight="bold">ORDER BY</text><text x="310" y="282.1" font-size="9" text-anchor="end" fill="#222" font-weight="normal">sort result (can use alias)</text><rect x="12" y="306" width="336" height="40" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="324.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">A column alias can be used in ORDER BY but not</text><text x="20" y="339.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">in WHERE (WHERE runs before SELECT).</text></svg>