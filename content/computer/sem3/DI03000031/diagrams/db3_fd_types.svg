<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 354" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="354" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Full, Partial and Transitive Dependency</text><text x="14" y="47.6" font-size="10.2" text-anchor="start" fill="#2E7D32" font-weight="bold">1. Full functional dependency</text><text x="30" y="49.4" font-size="9.6" text-anchor="start" fill="#2E7D32" font-weight="bold"></text><rect x="30" y="54" width="40" height="22" rx="0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="50.0" y="68.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="bold">ROLL</text><path d="M38.0 71 L62.0 71" fill="none" stroke="#222" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="70" y="54" width="40" height="22" rx="0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="90.0" y="68.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="bold">CID</text><path d="M81.0 71 L99.0 71" fill="none" stroke="#222" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="110" y="54" width="47.0" height="22" rx="0" fill="#fff" stroke="#2E7D32" stroke-width="1.2"/><text x="133.5" y="68.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">MARKS</text><path d="M50.0 76 L50.0 90 M90.0 76 L90.0 90 M50.0 90 L133.5 90" fill="none" stroke="#2E7D32" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><polygon points="133.5,77.0 130.0,84.0 137.0,84.0" fill="#2E7D32"/><path d="M133.5 90 L133.5 82" fill="none" stroke="#2E7D32" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="222" y="65.2" font-size="9" text-anchor="start" fill="#222" font-weight="normal">MARKS needs the WHOLE</text><text x="222" y="78.2" font-size="9" text-anchor="start" fill="#222" font-weight="normal">key (ROLL + CID)</text><text x="14" y="127.6" font-size="10.2" text-anchor="start" fill="#E07B00" font-weight="bold">2. Partial dependency (violates 2NF)</text><text x="30" y="129.4" font-size="9.6" text-anchor="start" fill="#E07B00" font-weight="bold"></text><rect x="30" y="134" width="40" height="22" rx="0" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.2"/><text x="50.0" y="148.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="bold">ROLL</text><path d="M38.0 151 L62.0 151" fill="none" stroke="#222" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="70" y="134" width="40" height="22" rx="0" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.2"/><text x="90.0" y="148.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="bold">CID</text><path d="M81.0 151 L99.0 151" fill="none" stroke="#222" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="110" y="134" width="40" height="22" rx="0" fill="#fff" stroke="#E07B00" stroke-width="1.2"/><text x="130.0" y="148.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">NAME</text><path d="M50.0 156 L50.0 170 L130.0 170 L130.0 162" fill="none" stroke="#E07B00" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><polygon points="130.0,156.0 126.5,163.0 133.5,163.0" fill="#E07B00"/><text x="222" y="145.2" font-size="9" text-anchor="start" fill="#222" font-weight="normal">NAME depends on ROLL</text><text x="222" y="158.2" font-size="9" text-anchor="start" fill="#222" font-weight="normal">only (part of the key)</text><text x="14" y="207.6" font-size="10.2" text-anchor="start" fill="#C62828" font-weight="bold">3. Transitive dependency (violates 3NF)</text><text x="30" y="209.4" font-size="9.6" text-anchor="start" fill="#C62828" font-weight="bold"></text><rect x="30" y="214" width="47.0" height="22" rx="0" fill="#FDECEC" stroke="#C62828" stroke-width="1.2"/><text x="53.5" y="228.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="bold">EMPNO</text><path d="M38.5 231 L68.5 231" fill="none" stroke="#222" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="77.0" y="214" width="54.0" height="22" rx="0" fill="#fff" stroke="#C62828" stroke-width="1.2"/><text x="104.0" y="228.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">DEPTNO</text><rect x="131.0" y="214" width="47.0" height="22" rx="0" fill="#fff" stroke="#C62828" stroke-width="1.2"/><text x="154.5" y="228.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">DNAME</text><path d="M53.5 236 L53.5 248 L96.0 248 L96.0 242" fill="none" stroke="#C62828" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><polygon points="96.0,236.0 92.5,243.0 99.5,243.0" fill="#C62828"/><path d="M112.0 236 L112.0 260 L154.5 260 L154.5 242" fill="none" stroke="#C62828" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><polygon points="154.5,236.0 151.0,243.0 158.0,243.0" fill="#C62828"/><text x="234" y="225.2" font-size="9" text-anchor="start" fill="#222" font-weight="normal">EMPNO → DEPTNO</text><text x="234" y="238.2" font-size="9" text-anchor="start" fill="#222" font-weight="normal">DEPTNO → DNAME</text><text x="234" y="251.2" font-size="9" text-anchor="start" fill="#222" font-weight="normal">so EMPNO → DNAME</text><text x="234" y="264.1" font-size="9" text-anchor="start" fill="#222" font-weight="normal">through DEPTNO</text><rect x="12" y="282" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="300.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">Partial: non-key attribute depends on PART of a</text><text x="20" y="315.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal"> composite key.</text><text x="20" y="330.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">Transitive: non-key attribute depends on another</text><text x="20" y="345.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal"> non-key attribute.</text></svg>