<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 296" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="296" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Sequence: Automatic Number Generator</text><rect x="14" y="44" width="150" height="72" rx="8" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="89" y="63.3" font-size="9.4" text-anchor="middle" fill="#E07B00" font-weight="bold">SEQUENCE seq_roll</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="89" y="81.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">START WITH 1</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="89" y="95.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">INCREMENT BY 1</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="89" y="109.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">MAXVALUE 999</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="240" y="55.2" font-size="9.2" text-anchor="middle" fill="#E07B00" font-weight="bold">seq_roll.NEXTVAL</text><path d="M166 80 L196 80 L196 73 L218 73" fill="none" stroke="#666" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><polygon points="224.0,73.0 218.0,70.0 218.0,76.0" fill="#666"/><rect x="226" y="64" width="30" height="18" rx="4" fill="#fff" stroke="#E07B00" stroke-width="1.1"/><text x="241" y="76.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="bold">1</text><text x="262" y="76.0" font-size="8.6" text-anchor="start" fill="#666" font-weight="normal">1st call</text><path d="M166 80 L196 80 L196 95 L218 95" fill="none" stroke="#666" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><polygon points="224.0,95.0 218.0,92.0 218.0,98.0" fill="#666"/><rect x="226" y="86" width="30" height="18" rx="4" fill="#fff" stroke="#E07B00" stroke-width="1.1"/><text x="241" y="98.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="bold">2</text><text x="262" y="98.0" font-size="8.6" text-anchor="start" fill="#666" font-weight="normal">2nd call</text><path d="M166 80 L196 80 L196 117 L218 117" fill="none" stroke="#666" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><polygon points="224.0,117.0 218.0,114.0 218.0,120.0" fill="#666"/><rect x="226" y="108" width="30" height="18" rx="4" fill="#fff" stroke="#E07B00" stroke-width="1.1"/><text x="241" y="120.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="bold">3</text><text x="262" y="120.0" font-size="8.6" text-anchor="start" fill="#666" font-weight="normal">3rd call</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="155.0" font-size="8.6" text-anchor="start" fill="#222" font-weight="normal">INSERT INTO student VALUES (seq_roll.NEXTVAL, ...);</text><rect x="14" y="162" width="60" height="20" rx="0" fill="#E07B00" stroke="#C9B3EC" stroke-width="1"/><text x="44.0" y="175.2" font-size="9" text-anchor="middle" fill="#fff" font-weight="bold">ROLL</text><rect x="74" y="162" width="90" height="20" rx="0" fill="#E07B00" stroke="#C9B3EC" stroke-width="1"/><text x="119.0" y="175.2" font-size="9" text-anchor="middle" fill="#fff" font-weight="bold">NAME</text><rect x="14" y="182" width="60" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="44.0" y="195.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">1</text><rect x="74" y="182" width="90" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="119.0" y="195.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">Aarav</text><rect x="14" y="202" width="60" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="44.0" y="215.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">2</text><rect x="74" y="202" width="90" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="119.0" y="215.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">Diya</text><rect x="14" y="222" width="60" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="44.0" y="235.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">3</text><rect x="74" y="222" width="90" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="119.0" y="235.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">Karan</text><text x="180" y="179.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">NEXTVAL: gives the next</text><text x="180" y="194.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">number (and advances).</text><text x="180" y="209.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">CURRVAL: the last number</text><text x="180" y="224.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">given in this session (3).</text><rect x="12" y="252" width="336" height="40" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="270.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">Used for primary keys such as roll no, bill no.</text><text x="20" y="285.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">Numbers are never reused, even after ROLLBACK.</text></svg>