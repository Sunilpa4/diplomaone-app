<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="340" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">PL/SQL Block Structure</text><rect x="14" y="44" width="170" height="56" rx="6" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="62.5" font-size="10" text-anchor="start" fill="#1565C0" font-weight="bold">DECLARE</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="77.9" font-size="8.4" text-anchor="start" fill="#666" font-weight="normal">-- variables, constants,</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="90.9" font-size="8.4" text-anchor="start" fill="#666" font-weight="normal">-- cursors, exceptions</text><text x="194" y="71.3" font-size="9.4" text-anchor="start" fill="#1565C0" font-weight="bold">Declaration section</text><text x="194" y="85.2" font-size="9" text-anchor="start" fill="#666" font-weight="normal">Optional</text><rect x="14" y="106" width="170" height="62" rx="6" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="124.5" font-size="10" text-anchor="start" fill="#2E7D32" font-weight="bold">BEGIN</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="139.9" font-size="8.4" text-anchor="start" fill="#666" font-weight="normal">-- SQL statements and</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="152.9" font-size="8.4" text-anchor="start" fill="#666" font-weight="normal">-- PL/SQL statements</text><text x="194" y="136.3" font-size="9.4" text-anchor="start" fill="#2E7D32" font-weight="bold">Executable section</text><text x="194" y="150.2" font-size="9" text-anchor="start" fill="#C62828" font-weight="normal">Mandatory</text><rect x="14" y="174" width="170" height="56" rx="6" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="192.5" font-size="10" text-anchor="start" fill="#E07B00" font-weight="bold">EXCEPTION</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="207.9" font-size="8.4" text-anchor="start" fill="#666" font-weight="normal">-- error handlers</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="220.9" font-size="8.4" text-anchor="start" fill="#666" font-weight="normal">-- WHEN ... THEN</text><text x="194" y="201.3" font-size="9.4" text-anchor="start" fill="#E07B00" font-weight="bold">Exception section</text><text x="194" y="215.2" font-size="9" text-anchor="start" fill="#666" font-weight="normal">Optional</text><rect x="14" y="236" width="170" height="26" rx="6" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.5"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="254.5" font-size="10" text-anchor="start" fill="#7B2CD9" font-weight="bold">END;</text><text x="194" y="248.3" font-size="9.4" text-anchor="start" fill="#7B2CD9" font-weight="bold">End of block</text><text x="194" y="262.1" font-size="9" text-anchor="start" fill="#C62828" font-weight="normal">Mandatory</text><rect x="12" y="274" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="292.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">Anonymous block: no name, not stored, runs once.</text><text x="20" y="307.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">Named blocks: procedure, function, trigger; they</text><text x="20" y="322.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">are compiled and stored in the database.</text></svg>