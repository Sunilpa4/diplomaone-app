<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 304" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="304" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Loops in PL/SQL</text><rect x="10" y="44" width="108" height="24" rx="5" fill="#1565C0" stroke="#1565C0" stroke-width="1.2"/><text x="64" y="59.4" font-size="9.6" text-anchor="middle" fill="#fff" font-weight="bold">Basic LOOP</text><rect x="10" y="72" width="108" height="96" rx="5" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="18" y="92.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">LOOP</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="18" y="107.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">  i := i + 1;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="18" y="122.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">  EXIT WHEN</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="18" y="137.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">    i &gt; 5;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="18" y="152.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">END LOOP;</text><rect x="126" y="44" width="108" height="24" rx="5" fill="#2E7D32" stroke="#2E7D32" stroke-width="1.2"/><text x="180" y="59.4" font-size="9.6" text-anchor="middle" fill="#fff" font-weight="bold">WHILE LOOP</text><rect x="126" y="72" width="108" height="96" rx="5" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="134" y="92.9" font-size="8.4" text-anchor="start" fill="#222" font-weight="normal">WHILE i &lt;= 5</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="134" y="107.9" font-size="8.4" text-anchor="start" fill="#222" font-wei