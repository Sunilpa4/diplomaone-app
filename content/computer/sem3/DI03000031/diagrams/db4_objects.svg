<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 336" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="336" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Oracle Database Objects</text><rect x="12" y="42" width="336" height="40" rx="8" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.3"/><rect x="18" y="49" width="84" height="26" rx="6" fill="#fff" stroke="#1565C0" stroke-width="1.2"/><text x="60" y="65.5" font-size="10" text-anchor="middle" fill="#1565C0" font-weight="bold">TABLE</text><text x="112" y="60.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">stores data in rows and columns</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="112" y="75.1" font-size="8.8" text-anchor="start" fill="#1565C0" font-weight="normal">CREATE TABLE</text><rect x="12" y="88" width="336" height="40" rx="8" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.3"/><rect x="18" y="95" width="84" height="26" rx="6" fill="#fff" stroke="#2E7D32" stroke-width="1.2"/><text x="60" y="111.5" font-size="10" text-anchor="middle" fill="#2E7D32" font-weight="bold">VIEW</text><text x="112" y="106.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">virtual table: a stored query</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="112" y="121.1" font-size="8.8" text-anchor="start" fill="#2E7D32" font-weight="normal">CREATE VIEW</text><rect x="12" y="134" width="336" height="40" rx="8" fill="#E0F2F1" stroke="#00796B" stroke-width="1.3"/><rect x="18" y="141" width="84" height="26" rx="6" fill="#fff" stroke="#00796B" stroke-width="1.2"/><text x="60" y="157.5" font-size="10" text-anchor="middle" fill="#00796B" font-weight="bold">SYNONYM</text><text x="112" y="152.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">another name (alias) for an object</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="112" y="167.1" font-size="8.8" text-anchor="start" fill="#00796B" font-weight="normal">CREATE SYNONYM</text><rect x="12" y="180" width="336" height="40" rx="8" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.3"/><rect x="18" y="187" width="84" height="26" rx="6" fill="#fff" stroke="#E07B00" stroke-width="1.2"/><text x="60" y="203.5" font-size="10" text-anchor="middle" fill="#E07B00" font-weight="bold">SEQUENCE</text><text x="112" y="198.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">generates unique numbers</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="112" y="213.1" font-size="8.8" text-anchor="start" fill="#E07B00" font-weight="normal">CREATE SEQUENCE</text><rect x="12" y="226" width="336" height="40" rx="8" fill="#FDECEC" stroke="#C62828" stroke-width="1.3"/><rect x="18" y="233" width="84" height="26" rx="6" fill="#fff" stroke="#C62828" stroke-width="1.2"/><text x="60" y="249.5" font-size="10" text-anchor="middle" fill="#C62828" font-weight="bold">INDEX</text><text x="112" y="244.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">speeds up searching of rows</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="112" y="259.1" font-size="8.8" text-anchor="start" fill="#C62828" font-weight="normal">CREATE INDEX</text><rect x="12" y="276" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="294.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">All objects are stored in the data dictionary and</text><text x="20" y="309.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">can be seen with USER_TABLES, USER_VIEWS,</text><text x="20" y="324.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">USER_SYNONYMS, USER_SEQUENCES, USER_INDEXES.</text></svg>