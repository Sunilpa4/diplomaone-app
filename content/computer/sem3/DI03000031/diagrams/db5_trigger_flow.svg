<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 334" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="334" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">How a Trigger Fires</text><rect x="40" y="120" width="280" height="116" rx="6" fill="#fff" stroke="#666" stroke-width="1.1" stroke-dasharray="4 3"/><text x="48" y="135.0" font-size="8.6" text-anchor="start" fill="#666" font-weight="normal">for each affected row</text><path d="M180 69 L180 83" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,83.0 183.5,76.0 176.5,76.0" fill="#222"/><path d="M180 109 L180 137" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,137.0 183.5,130.0 176.5,130.0" fill="#222"/><path d="M180 163 L180 171" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,171.0 183.5,164.0 176.5,164.0" fill="#222"/><path d="M180 197 L180 205" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,205.0 183.5,198.0 176.5,198.0" fill="#222"/><path d="M180 231 L180 245" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,245.0 183.5,238.0 176.5,238.0" fill="#222"/><rect x="30.0" y="43.0" width="300" height="26" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="59.1" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">UPDATE emp SET sal = ... WHERE ...;</text><rect x="50.0" y="83.0" width="260" height="26" rx="7" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.6"/><text x="180" y="99.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">1. BEFORE statement trigger (once)</text><rect x="55.0" y="137.0" width="250" height="26" rx="7" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.6"/><text x="180" y="153.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">2. BEFORE row trigger (:NEW can change)</text><rect x="55.0" y="171.0" width="250" height="26" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="187.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">3. Row is changed in the table</text><rect x="55.0" y="205.0" width="250" height="26" rx="7" fill="#E0F2F1" stroke="#00796B" stroke-width="1.6"/><text x="180" y="221.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">4. AFTER row trigger (e.g. audit)</text><rect x="50.0" y="245.0" width="260" height="26" rx="7" fill="#E0F2F1" stroke="#00796B" stroke-width="1.6"/><text x="180" y="261.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">5. AFTER statement trigger (once)</text><rect x="12" y="282" width="336" height="40" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="300.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">An error in any trigger (RAISE_APPLICATION_ERROR)</text><text x="20" y="315.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">cancels the whole statement.</text></svg>