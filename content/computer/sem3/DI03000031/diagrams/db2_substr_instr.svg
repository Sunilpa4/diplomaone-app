<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 322" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="322" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">String Positions: SUBSTR and INSTR</text><rect x="54" y="46" width="36" height="30" rx="0" fill="#fff" stroke="#7B2CD9" stroke-width="1.4"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="72.0" y="65.5" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">G</text><text x="72.0" y="91.2" font-size="9.2" text-anchor="middle" fill="#1565C0" font-weight="normal">1</text><text x="72.0" y="40.9" font-size="8.4" text-anchor="middle" fill="#666" font-weight="normal">-7</text><rect x="90" y="46" width="36" height="30" rx="0" fill="#fff" stroke="#7B2CD9" stroke-width="1.4"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="108.0" y="65.5" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">U</text><text x="108.0" y="91.2" font-size="9.2" text-anchor="middle" fill="#1565C0" font-weight="normal">2</text><text x="108.0" y="40.9" font-size="8.4" text-anchor="middle" fill="#666" font-weight="normal">-6</text><rect x="126" y="46" width="36" height="30" rx="0" fill="#FFF6D6" stroke="#7B2CD9" stroke-width="1.4"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="144.0" y="65.5" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">J</text><text x="144.0" y="91.2" font-size="9.2" text-anchor="middle" fill="#1565C0" font-weight="normal">3</text><text x="144.0" y="40.9" font-size="8.4" text-anchor="middle" fill="#666" font-weight="normal">-5</text><rect x="162" y="46" width="36" height="30" rx="0" fill="#FFF6D6" stroke="#7B2CD9" stroke-width="1.4"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180.0" y="65.5" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">A</text><text x="180.0" y="91.2" font-size="9.2" text-anchor="middle" fill="#1565C0" font-weight="normal">4</text><text x="180.0" y="40.9" font-size="8.4" text-anchor="middle" fill="#666" font-weight="normal">-4</text><rect x="198" y="46" width="36" height="30" rx="0" fill="#FFF6D6" stroke="#7B2CD9" stroke-width="1.4"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="216.0" y="65.5" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">R</text><text x="216.0" y="91.2" font-size="9.2" text-anchor="middle" fill="#1565C0" font-weight="normal">5</text><text x="216.0" y="40.9" font-size="8.4" text-anchor="middle" fill="#666" font-weight="normal">-3</text><rect x="234" y="46" width="36" height="30" rx="0" fill="#fff" stroke="#7B2CD9" stroke-width="1.4"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="252.0" y="65.5" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">A</text><text x="252.0" y="91.2" font-size="9.2" text-anchor="middle" fill="#1565C0" font-weight="normal">6</text><text x="252.0" y="40.9" font-size="8.4" text-anchor="middle" fill="#666" font-weight="normal">-2</text><rect x="270" y="46" width="36" height="30" rx="0" fill="#fff" stroke="#7B2CD9" stroke-width="1.4"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="288.0" y="65.5" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">T</text><text x="288.0" y="91.2" font-size="9.2" text-anchor="middle" fill="#1565C0" font-weight="normal">7</text><text x="288.0" y="40.9" font-size="8.4" text-anchor="middle" fill="#666" font-weight="normal">-1</text><text x="14" y="91.2" font-size="9" text-anchor="start" fill="#1565C0" font-weight="normal">pos</text><text x="14" y="41.1" font-size="9" text-anchor="start" fill="#666" font-weight="normal">neg</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="111.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">SUBSTR('GUJARAT', 3, 3)</text><text x="240" y="111.4" font-size="9.6" text-anchor="start" fill="#2E7D32" font-weight="bold">→ JAR</text><text x="346" y="110.9" font-size="8.4" text-anchor="end" fill="#666" font-weight="normal">3 from 3rd</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="135.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">SUBSTR('GUJARAT', 4)</text><text x="240" y="135.4" font-size="9.6" text-anchor="start" fill="#2E7D32" font-weight="bold">→ ARAT</text><text x="346" y="134.9" font-size="8.4" text-anchor="end" fill="#666" font-weight="normal">4th to end</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="159.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">SUBSTR('GUJARAT', -3)</text><text x="240" y="159.4" font-size="9.6" text-anchor="start" fill="#2E7D32" font-weight="bold">→ RAT</text><text x="346" y="158.9" font-size="8.4" text-anchor="end" fill="#666" font-weight="normal">last 3 chars</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="183.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">INSTR('GUJARAT', 'A')</text><text x="240" y="183.4" font-size="9.6" text-anchor="start" fill="#2E7D32" font-weight="bold">→ 4</text><text x="346" y="182.9" font-size="8.4" text-anchor="end" fill="#666" font-weight="normal">first A</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="207.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">INSTR('GUJARAT', 'A', 1, 2)</text><text x="240" y="207.4" font-size="9.6" text-anchor="start" fill="#2E7D32" font-weight="bold">→ 6</text><text x="346" y="206.9" font-size="8.4" text-anchor="end" fill="#666" font-weight="normal">2nd A</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="231.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">INSTR('GUJARAT', 'Z')</text><text x="240" y="231.4" font-size="9.6" text-anchor="start" fill="#2E7D32" font-weight="bold">→ 0</text><text x="346" y="230.9" font-size="8.4" text-anchor="end" fill="#666" font-weight="normal">not found</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="255.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">LENGTH('GUJARAT')</text><text x="240" y="255.4" font-size="9.6" text-anchor="start" fill="#2E7D32" font-weight="bold">→ 7</text><text x="346" y="254.9" font-size="8.4" text-anchor="end" fill="#666" font-weight="normal">characters</text><rect x="12" y="280" width="336" height="40" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="298.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">Positions start at 1 (not 0). A negative start</text><text x="20" y="313.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">counts from the right end.</text></svg>