<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="340" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">A View is a Window on a Table</text><text x="14" y="45.5" font-size="10" text-anchor="start" fill="#1565C0" font-weight="bold">EMP (base table)</text><rect x="14" y="50" width="52" height="20" rx="0" fill="#1565C0" stroke="#C9B3EC" stroke-width="1"/><text x="40.0" y="63.1" font-size="9" text-anchor="middle" fill="#fff" font-weight="bold">EMPNO</text><rect x="66" y="50" width="62" height="20" rx="0" fill="#1565C0" stroke="#C9B3EC" stroke-width="1"/><text x="97.0" y="63.1" font-size="9" text-anchor="middle" fill="#fff" font-weight="bold">ENAME</text><rect x="128" y="50" width="54" height="20" rx="0" fill="#1565C0" stroke="#C9B3EC" stroke-width="1"/><text x="155.0" y="63.1" font-size="9" text-anchor="middle" fill="#fff" font-weight="bold">SAL</text><rect x="182" y="50" width="52" height="20" rx="0" fill="#1565C0" stroke="#C9B3EC" stroke-width="1"/><text x="208.0" y="63.1" font-size="9" text-anchor="middle" fill="#fff" font-weight="bold">DEPTNO</text><rect x="14" y="70" width="52" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="40.0" y="83.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">101</text><rect x="66" y="70" width="62" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="97.0" y="83.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">RAJESH</text><rect x="128" y="70" width="54" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="155.0" y="83.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">90000</text><rect x="182" y="70" width="52" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="208.0" y="83.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">10</text><rect x="14" y="90" width="52" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="40.0" y="103.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">102</text><rect x="66" y="90" width="62" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="97.0" y="103.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">AMIT</text><rect x="128" y="90" width="54" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="155.0" y="103.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">60000</text><rect x="182" y="90" width="52" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="208.0" y="103.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">20</text><rect x="14" y="110" width="52" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="40.0" y="123.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">104</text><rect x="66" y="110" width="62" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="97.0" y="123.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">NEHA</text><rect x="128" y="110" width="54" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="155.0" y="123.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">45000</text><rect x="182" y="110" width="52" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="208.0" y="123.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">20</text><rect x="14" y="130" width="52" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="40.0" y="143.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">106</text><rect x="66" y="130" width="62" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="97.0" y="143.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">SUNIL</text><rect x="128" y="130" width="54" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="155.0" y="143.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">30000</text><rect x="182" y="130" width="52" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="208.0" y="143.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">30</text><rect x="14" y="150" width="52" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="40.0" y="163.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">105</text><rect x="66" y="150" width="62" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="97.0" y="163.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">KIRAN</text><rect x="128" y="150" width="54" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="155.0" y="163.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">22000</text><rect x="182" y="150" width="52" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="208.0" y="163.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">20</text><rect x="14" y="90" width="114" height="20" fill="#2E7D32" fill-opacity="0.16" stroke="none"/><rect x="14" y="110" width="114" height="20" fill="#2E7D32" fill-opacity="0.16" stroke="none"/><rect x="14" y="150" width="114" height="20" fill="#2E7D32" fill-opacity="0.16" stroke="none"/><rect x="12" y="48" width="118" height="124" fill="none" stroke="#2E7D32" stroke-width="2" stroke-dasharray="5 3" rx="3"/><text x="296" y="103.1" font-size="8.8" text-anchor="middle" fill="#2E7D32" font-weight="normal">only these</text><text x="296" y="116.1" font-size="8.8" text-anchor="middle" fill="#2E7D32" font-weight="normal">columns + rows</text><text x="296" y="129.1" font-size="8.8" text-anchor="middle" fill="#2E7D32" font-weight="normal">(deptno = 20)</text><path d="M71 172 L71 178" fill="none" stroke="#2E7D32" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><polygon points="71.0,184.0 74.0,178.0 68.0,178.0" fill="#2E7D32"/><rect x="14" y="184" width="332" height="40" rx="6" fill="#fff" stroke="#2E7D32" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="201.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">CREATE VIEW emp20 AS SELECT empno, ename</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="216.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="normal">FROM emp WHERE deptno = 20;</text><text x="14" y="247.5" font-size="10" text-anchor="start" fill="#2E7D32" font-weight="bold">EMP20 (view)</text><rect x="14" y="252" width="60" height="20" rx="0" fill="#2E7D32" stroke="#C9B3EC" stroke-width="1"/><text x="44.0" y="265.1" font-size="9" text-anchor="middle" fill="#fff" font-weight="bold">EMPNO</text><rect x="74" y="252" width="70" height="20" rx="0" fill="#2E7D32" stroke="#C9B3EC" stroke-width="1"/><text x="109.0" y="265.1" font-size="9" text-anchor="middle" fill="#fff" font-weight="bold">ENAME</text><rect x="14" y="272" width="60" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="44.0" y="285.1" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">102</text><rect x="74" y="272" width="70" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="109.0" y="285.1" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">AMIT</text><rect x="14" y="292" width="60" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="44.0" y="305.1" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">104</text><rect x="74" y="292" width="70" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="109.0" y="305.1" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">NEHA</text><rect x="14" y="312" width="60" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="44.0" y="325.1" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">105</text><rect x="74" y="312" width="70" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="109.0" y="325.1" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">KIRAN</text><text x="160" y="269.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">No data is stored in the view;</text><text x="160" y="284.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">only the SELECT is saved.</text><text x="160" y="299.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">Each query on EMP20 reads EMP,</text><text x="160" y="314.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">so it always shows current data.</text></svg>