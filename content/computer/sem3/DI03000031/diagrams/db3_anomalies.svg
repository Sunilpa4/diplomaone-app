fill="#E07B00" font-weight="bold">Insertion anomaly</text><text x="24" y="201.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">A new course C3 cannot be added until a</text><text x="24" y="214.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">student joins it (ROLL would be NULL).</text><rect x="14" y="226" width="332" height="50" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.4"/><text x="24" y="243.6" font-size="10.2" text-anchor="start" fill="#1565C0" font-weight="bold">Update anomaly</text><text x="24" y="259.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">Changing DBMS fees needs 3 updates; missing</text><text x="24" y="272.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">one row makes the data inconsistent.</text><rect x="14" y="284" width="332" height="50" rx="7" fill="#FDECEC" stroke="#C62828" stroke-width="1.4"/><text x="24" y="301.6" font-size="10.2" text-anchor="start" fill="#C62828" font-weight="bold">Deletion anomaly</text><text x="24" y="317.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">Deleting Isha (only Python student) also</text><text x="24" y="330.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">deletes all facts about course C2.</text></svg>