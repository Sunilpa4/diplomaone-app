<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 296" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="296" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Types of Integrity Constraints</text><rect x="95.0" y="27.0" width="170" height="30" rx="7" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="46.0" font-size="11.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Integrity Constraints</text><path d="M180 72 L180 84 L68 84 L68 96" fill="none" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="14" y="96" width="108" height="40" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.5"/><text x="68" y="114.8" font-size="11" text-anchor="middle" fill="#1565C0" font-weight="bold">Domain</text><text x="68" y="130.0" font-size="8.6" text-anchor="middle" fill="#1565C0" font-weight="normal">valid values</text><rect x="18" y="146" width="100" height="21" rx="5" fill="#fff" stroke="#1565C0" stroke-width="1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="68" y="159.7" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">NOT NULL</text><rect x="18" y="172" width="100" height="21" rx="5" fill="#fff" stroke="#1565C0" stroke-width="1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="68" y="185.7" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">CHECK</text><path d="M180 72 L180 84 L181 84 L181 96" fill="none" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="127" y="96" width="108" height="40" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.5"/><text x="181" y="114.8" font-size="11" text-anchor="middle" fill="#2E7D32" font-weight="bold">Entity</text><text x="181" y="130.0" font-size="8.6" text-anchor="middle" fill="#2E7D32" font-weight="normal">unique rows</text><rect x="131" y="146" width="100" height="21" rx="5" fill="#fff" stroke="#2E7D32" stroke-width="1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="181" y="159.7" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">UNIQUE</text><rect x="131" y="172" width="100" height="21" rx="5" fill="#fff" stroke="#2E7D32" stroke-width="1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="181" y="185.7" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">PRIMARY KEY</text><path d="M180 72 L180 84 L294 84 L294 96" fill="none" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="240" y="96" width="108" height="40" rx="7" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.5"/><text x="294" y="114.8" font-size="11" text-anchor="middle" fill="#E07B00" font-weight="bold">Referential</text><text x="294" y="130.0" font-size="8.6" text-anchor="middle" fill="#E07B00" font-weight="normal">valid links</text><rect x="244" y="146" width="100" height="21" rx="5" fill="#fff" stroke="#E07B00" stroke-width="1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="294" y="159.7" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">FOREIGN KEY</text><rect x="244" y="172" width="100" height="21" rx="5" fill="#fff" stroke="#E07B00" stroke-width="1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="294" y="185.7" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">REFERENCES</text><rect x="244" y="198" width="100" height="21" rx="5" fill="#fff" stroke="#E07B00" stroke-width="1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="294" y="211.4" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">ON DELETE CASCADE</text><rect x="12" y="236" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="254.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">Column level: written with the column definition.</text><text x="20" y="269.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">Table level: written after all columns; needed for</text><text x="20" y="284.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">composite keys. Unnamed constraints get SYS_Cnnnnnn.</text></svg>