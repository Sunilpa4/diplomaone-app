<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 362" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="362" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">IF-THEN-ELSIF-ELSE Flow</text><path d="M168 76 L207 76" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="207.0,76.0 200.0,72.5 200.0,79.5" fill="#222"/><text x="187" y="71.7" font-size="10.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">Yes</text><path d="M110 101 L110 125" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="110.0,125.0 113.5,118.0 106.5,118.0" fill="#222"/><text x="124" y="117.7" font-size="10.5" text-anchor="middle" fill="#C62828" font-weight="bold">No</text><path d="M168 150 L207 150" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="207.0,150.0 200.0,146.5 200.0,153.5" fill="#222"/><text x="187" y="145.7" font-size="10.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">Yes</text><path d="M110 175 L110 207" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="110.0,207.0 113.5,200.0 106.5,200.0" fill="#222"/><text x="124" y="195.7" font-size="10.5" text-anchor="middle" fill="#C62828" font-weight="bold">No</text><path d="M317 76 L340 76 L340 284 L234 284" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="228.0,284.0 235.0,287.5 235.0,280.5" fill="#222"/><path d="M317 150 L340 150" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M110 237 L110 284 L132 284" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="132.0,284.0 125.0,280.5 125.0,287.5" fill="#222"/><polygon points="110,51.0 168.0,76 110,101.0 52.0,76" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.8"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="110" y="79.5" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">marks &gt;= 70</text><polygon points="110,125.0 168.0,150 110,175.0 52.0,150" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.8"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="110" y="153.5" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">marks &gt;= 50</text><rect x="207.0" y="61.0" width="110" height="30" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.8"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="262" y="79.5" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">grade := 'A'</text><rect x="207.0" y="135.0" width="110" height="30" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.8"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="262" y="153.5" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">grade := 'B'</text><rect x="55.0" y="207.0" width="110" height="30" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.8"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="110" y="225.5" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">grade := 'C'</text><text x="176" y="225.1" font-size="8.8" text-anchor="start" fill="#666" font-weight="normal">ELSE part</text><rect x="132.0" y="270.0" width="96" height="28" rx="14.0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.8"/><text x="180" y="287.7" font-size="10.5" text-anchor="middle" fill="#1B5E20" font-weight="bold">END IF</text><rect x="12" y="310" width="336" height="40" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="328.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">Only the first TRUE condition runs. ELSE runs when</text><text x="20" y="343.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">no condition is TRUE. Every IF needs END IF;</text></svg>