<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 364" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="364" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Types of Keys</text><ellipse cx="180" cy="130" rx="166" ry="92" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="57.7" font-size="10.5" text-anchor="middle" fill="#1565C0" font-weight="bold">Super keys</text><text x="180" y="71.0" font-size="8.6" text-anchor="middle" fill="#1565C0" font-weight="normal">{ROLL}, {ROLL, NAME}, {EMAIL, CITY} ...</text><ellipse cx="180" cy="144" rx="120" ry="60" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="103.5" font-size="10" text-anchor="middle" fill="#2E7D32" font-weight="bold">Candidate keys (minimal)</text><text x="180" y="117.1" font-size="8.8" text-anchor="middle" fill="#2E7D32" font-weight="normal">{ROLL}, {EMAIL}, {AADHAAR}</text><rect x="84" y="128" width="92" height="46" rx="8" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.6"/><text x="130" y="147.4" font-size="9.6" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Primary key</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="130" y="163.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">ROLL</text><rect x="184" y="128" width="92" height="46" rx="8" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.6"/><text x="230" y="147.3" font-size="9.4" text-anchor="middle" fill="#E07B00" font-weight="bold">Alternate keys</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="230" y="162.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">EMAIL, AADHAAR</text><rect x="12" y="234" width="336" height="130" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="252.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">Super key: any set of attributes that uniquely</text><text x="20" y="267.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal"> identifies a row.</text><text x="20" y="282.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">Candidate key: minimal super key.</text><text x="20" y="297.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">Primary key: candidate key chosen by designer.</text><text x="20" y="312.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">Alternate key: candidate keys not chosen.</text><text x="20" y="327.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">Composite key: key with 2+ attributes.</text><text x="20" y="342.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">Foreign key: refers to the primary key of</text><text x="20" y="357.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal"> another table.</text></svg>