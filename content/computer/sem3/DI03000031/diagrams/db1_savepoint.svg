<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 298" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="298" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">SAVEPOINT and ROLLBACK TO</text><path d="M30 58 L330 58" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="334.0,58.0 326.0,54.0 326.0,62.0" fill="#222"/><text x="330" y="49.1" font-size="9" text-anchor="end" fill="#666" font-weight="normal">time</text><circle cx="50" cy="58" r="6" fill="#1565C0"/><text x="50" y="81.1" font-size="8.8" text-anchor="middle" fill="#1565C0" font-weight="bold">INSERT</text><text x="50" y="93.1" font-size="8.8" text-anchor="middle" fill="#1565C0" font-weight="normal">6</text><circle cx="114" cy="58" r="6" fill="#E07B00"/><text x="114" y="81.1" font-size="8.8" text-anchor="middle" fill="#E07B00" font-weight="bold">SAVEPOINT</text><text x="114" y="93.1" font-size="8.8" text-anchor="middle" fill="#E07B00" font-weight="normal">a</text><circle cx="178" cy="58" r="6" fill="#1565C0"/><text x="178" y="81.1" font-size="8.8" text-anchor="middle" fill="#1565C0" font-weight="bold">UPDATE</text><text x="178" y="93.1" font-size="8.8" text-anchor="middle" fill="#1565C0" font-weight="normal"></text><circle cx="242" cy="58" r="6" fill="#E07B00"/><text x="242" y="81.1" font-size="8.8" text-anchor="middle" fill="#E07B00" font-weight="bold">SAVEPOINT</text><text x="242" y="93.1" font-size="8.8" text-anchor="middle" fill="#E07B00" font-weight="normal">b</text><circle cx="306" cy="58" r="6" fill="#1565C0"/><text x="306" y="81.1" font-size="8.8" text-anchor="middle" fill="#1565C0" font-weight="bold">DELETE</text><text x="306" y="93.1" font-size="8.8" text-anchor="middle" fill="#1565C0" font-weight="normal">5</text><path d="M306 102 Q 270 128 242 102" fill="none" stroke="#C62828" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><polygon points="242.0,100.0 244.5,107.4 249.4,102.5" fill="#C62828"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="274" y="145.2" font-size="9.2" text-anchor="middle" fill="#C62828" font-weight="bold">ROLLBACK TO b</text><text x="274" y="158.1" font-size="8.8" text-anchor="middle" fill="#C62828" font-weight="normal">undoes DELETE only</text><path d="M306 162 Q 200 218 114 104" fill="none" stroke="#E07B00" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><polygon points="114.0,102.0 115.1,109.7 120.9,105.7" fill="#E07B00"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="160" y="201.2" font-size="9.2" text-anchor="middle" fill="#E07B00" font-weight="bold">ROLLBACK TO a</text><text x="160" y="214.1" font-size="8.8" text-anchor="middle" fill="#E07B00" font-weight="normal">undoes UPDATE + DELETE</text><rect x="12" y="226" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="244.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">ROLLBACK (no name): undoes everything since</text><text x="20" y="259.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal"> the last COMMIT; all savepoints are erased.</text><text x="20" y="274.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">COMMIT: makes all changes permanent.</text><text x="20" y="289.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">DDL (CREATE/ALTER/DROP) commits automatically.</text></svg>