<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 350" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="350" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Conversion Functions</text><path d="M150 82 L74 196" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="74.0,196.0 81.8,191.6 75.1,187.1" fill="#1565C0"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="92" y="131.3" font-size="9.4" text-anchor="end" fill="#1565C0" font-weight="bold">TO_NUMBER</text><path d="M92 200 L166 86" fill="none" stroke="#7B2CD9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="166.0,86.0 158.3,90.5 165.0,94.9" fill="#7B2CD9"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="126" y="199.3" font-size="9.4" text-anchor="start" fill="#7B2CD9" font-weight="bold">TO_CHAR</text><path d="M212 82 L290 196" fill="none" stroke="#2E7D32" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="290.0,196.0 288.8,187.1 282.2,191.7" fill="#2E7D32"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="270" y="131.3" font-size="9.4" text-anchor="start" fill="#2E7D32" font-weight="bold">TO_DATE</text><path d="M270 200 L194 86" fill="none" stroke="#7B2CD9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="194.0,86.0 195.1,94.9 201.8,90.4" fill="#7B2CD9"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="234" y="199.3" font-size="9.4" text-anchor="end" fill="#7B2CD9" font-weight="bold">TO_CHAR</text><rect x="130" y="46" width="100" height="36" rx="18" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.8"/><text x="180" y="68.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">CHAR</text><rect x="10" y="202" width="100" height="36" rx="18" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.8"/><text x="60" y="224.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">NUMBER</text><rect x="250" y="202" width="100" height="36" rx="18" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.8"/><text x="300" y="224.2" font-size="12" text-anchor="middle" fill="#2E7D32" font-weight="bold">DATE</text><rect x="12" y="250" width="336" height="100" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="268.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">TO_CHAR(SYSDATE, 'DD/MM/YYYY') → '28/10/2026'</text><text x="20" y="283.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">TO_CHAR(1234.5, '9,999.99') → ' 1,234.50'</text><text x="20" y="298.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">TO_DATE('15-08-2026', 'DD-MM-YYYY') → date</text><text x="20" y="313.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">TO_NUMBER('5000') + 1 → 5001</text><text x="20" y="328.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">Implicit conversion happens automatically, but</text><text x="20" y="343.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">explicit conversion is safer.</text></svg>