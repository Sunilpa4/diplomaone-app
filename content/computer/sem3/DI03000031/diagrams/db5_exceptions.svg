<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 328" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="328" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Types of Exceptions</text><path d="M180 66 L180 78 L64 78 L64 90" fill="none" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="8" y="90" width="112" height="40" rx="6" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.5"/><text x="64" y="108.5" font-size="10" text-anchor="middle" fill="#1565C0" font-weight="bold">Predefined</text><text x="64" y="123.9" font-size="8.4" text-anchor="middle" fill="#1565C0" font-weight="normal">named by Oracle</text><rect x="8" y="138" width="112" height="96" rx="5" fill="#fff" stroke="#1565C0" stroke-width="1.1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="155.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">NO_DATA_FOUND</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="169.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">TOO_MANY_ROWS</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="183.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">ZERO_DIVIDE</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="197.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">DUP_VAL_ON_INDEX</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="211.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">VALUE_ERROR</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="14" y="225.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">INVALID_CURSOR</text><path d="M180 66 L180 78 L180 78 L180 90" fill="none" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="124" y="90" width="112" height="40" rx="6" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.5"/><text x="180" y="108.5" font-size="10" text-anchor="middle" fill="#E07B00" font-weight="bold">Non-predefined</text><text x="180" y="123.9" font-size="8.4" text-anchor="middle" fill="#E07B00" font-weight="normal">Oracle error, no name</text><rect x="124" y="138" width="112" height="96" rx="5" fill="#fff" stroke="#E07B00" stroke-width="1.1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="130" y="155.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">e EXCEPTION;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="130" y="169.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">PRAGMA</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="130" y="183.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">EXCEPTION_INIT</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="130" y="197.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">(e, -2292);</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="130" y="211.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal"></text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="130" y="225.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">gives a name</text><path d="M180 66 L180 78 L296 78 L296 90" fill="none" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="240" y="90" width="112" height="40" rx="6" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.5"/><text x="296" y="108.5" font-size="10" text-anchor="middle" fill="#2E7D32" font-weight="bold">User-defined</text><text x="296" y="123.9" font-size="8.4" text-anchor="middle" fill="#2E7D32" font-weight="normal">declared by you</text><rect x="240" y="138" width="112" height="96" rx="5" fill="#fff" stroke="#2E7D32" stroke-width="1.1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="246" y="155.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">e_low EXCEPTION;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="246" y="169.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal"></text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="246" y="183.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">IF ... THEN</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="246" y="197.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">  RAISE e_low;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="246" y="211.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal">END IF;</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="246" y="225.9" font-size="8.2" text-anchor="start" fill="#222" font-weight="normal"></text><rect x="105.0" y="38.0" width="150" height="28" rx="7" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="55.9" font-size="11" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Exceptions</text><rect x="12" y="246" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="264.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">Error raised: control jumps to EXCEPTION section,</text><text x="20" y="279.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">the matching WHEN handler runs, block ends normally.</text><text x="20" y="294.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">No handler: error passes to the caller (propagation).</text><text x="20" y="309.2" font-size="9.2" text-anchor="start" fill="#222" font-weight="normal">RAISE_APPLICATION_ERROR(-20000..-20999, 'msg').</text></svg>