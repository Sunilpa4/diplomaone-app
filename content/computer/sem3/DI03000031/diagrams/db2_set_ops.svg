<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="340" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Set Operators</text><clipPath id="c9476"><circle cx="108" cy="76" r="26"/></clipPath><circle cx="80" cy="76" r="26" fill="#9C6ADE"/><circle cx="108" cy="76" r="26" fill="#9C6ADE"/><circle cx="80" cy="76" r="26" fill="#9C6ADE" clip-path="url(#c9476)"/><circle cx="80" cy="76" r="26" fill="none" stroke="#222" stroke-width="1.2"/><circle cx="108" cy="76" r="26" fill="none" stroke="#222" stroke-width="1.2"/><text x="68" y="79.2" font-size="9" text-anchor="middle" fill="#222" font-weight="bold">A</text><text x="120" y="79.2" font-size="9" text-anchor="middle" fill="#222" font-weight="bold">B</text><text x="94" y="119.4" font-size="9.8" text-anchor="middle" fill="#7B2CD9" font-weight="bold">UNION</text><text x="94" y="131.9" font-size="8.4" text-anchor="middle" fill="#666" font-weight="normal">A + B, no duplicates</text><clipPath id="c26676"><circle cx="280" cy="76" r="26"/></clipPath><circle cx="252" cy="76" r="26" fill="#9C6ADE"/><circle cx="280" cy="76" r="26" fill="#9C6ADE"/><circle cx="252" cy="76" r="26" fill="#5E2BA8" clip-path="url(#c26676)"/><circle cx="252" cy="76" r="26" fill="none" stroke="#222" stroke-width="1.2"/><circle cx="280" cy="76" r="26" fill="none" stroke="#222" stroke-width="1.2"/><text x="240" y="79.2" font-size="9" text-anchor="middle" fill="#222" font-weight="bold">A</text><text x="292" y="79.2" font-size="9" text-anchor="middle" fill="#222" font-weight="bold">B</text><text x="266" y="119.4" font-size="9.8" text-anchor="middle" fill="#7B2CD9" font-weight="bold">UNION ALL</text><text x="266" y="131.9" font-size="8.4" text-anchor="middle" fill="#666" font-weight="normal">A + B, keeps duplicates</text><clipPath id="c94180"><circle cx="108" cy="180" r="26"/></clipPath><circle cx="80" cy="180" r="26" fill="#fff"/><circle cx="108" cy="180" r="26" fill="#fff"/><circle cx="80" cy="180" r="26" fill="#9C6ADE" clip-path="url(#c94180)"/><circle cx="80" cy="180" r="26" fill="none" stroke="#222" stroke-width="1.2"/><circle cx="108" cy="180" r="26" fill="none" stroke="#222" stroke-width="1.2"/><text x="68" y="183.2" font-size="9" text-anchor="middle" fill="#222" font-weight="bold">A</text><text x="120" y="183.2" font-size="9" text-anchor="middle" fill="#222" font-weight="bold">B</text><text x="94" y="223.4" font-size="9.8" text-anchor="middle" fill="#7B2CD9" font-weight="bold">INTERSECT</text><text x="94" y="235.9" font-size="8.4" text-anchor="middle" fill="#666" font-weight="normal">common to A and B</text><clipPath id="c266180"><circle cx="280" cy="180" r="26"/></clipPath><circle cx="252" cy="180" r="26" fill="#9C6ADE"/><circle cx="280" cy="180" r="26" fill="#fff"/><circle cx="252" cy="180" r="26" fill="#fff" clip-path="url(#c266180)"/><circle cx="252" cy="180" r="26" fill="none" stroke="#222" stroke-width="1.2"/><circle cx="280" cy="180" r="26" fill="none" stroke="#222" stroke-width="1.2"/><text x="240" y="183.2" font-size="9" text-anchor="middle" fill="#222" font-weight="bold">A</text><text x="292" y="183.2" font-size="9" text-anchor="middle" fill="#222" font-weight="bold">B</text><text x="266" y="223.4" font-size="9.8" text-anchor="middle" fill="#7B2CD9" font-weight="bold">MINUS</text><text x="266" y="235.9" font-size="8.4" text-anchor="middle" fill="#666" font-weight="normal">in A but not in B</text><rect x="12" y="252" width="336" height="85" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="270.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">Rules: both queries must have the same number</text><text x="20" y="285.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">of columns with compatible data types.</text><text x="20" y="300.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">Column names come from the first query.</text><text x="20" y="315.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">ORDER BY only once, at the very end.</text><text x="20" y="330.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">UNION, INTERSECT, MINUS sort and remove duplicates.</text></svg>