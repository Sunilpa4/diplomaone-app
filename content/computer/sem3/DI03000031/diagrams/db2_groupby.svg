font-weight="bold">HAVING COUNT(*) &gt; 2</text><text x="246" y="251.2" font-size="9" text-anchor="middle" fill="#C62828" font-weight="normal">keeps only groups 20 and 30</text><rect x="12" y="268" width="336" height="85" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="286.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">WHERE filters ROWS before grouping.</text><text x="20" y="301.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">HAVING filters GROUPS after grouping (can use</text><text x="20" y="316.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal"> aggregate functions).</text><text x="20" y="331.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">Every SELECT column that is not inside an aggregate</text><text x="20" y="346.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal"> must appear in GROUP BY.</text></svg>