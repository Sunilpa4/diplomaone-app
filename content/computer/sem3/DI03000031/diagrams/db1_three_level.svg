<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 400" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="400" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Three-Level (ANSI/SPARC) Architecture</text><g transform="translate(0,16)"><rect x="38.0" y="40.0" width="84" height="28" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.6"/><text x="80" y="57.5" font-size="10" text-anchor="middle" fill="#2E7D32" font-weight="bold">View 1</text><path d="M80 68 L180 104" fill="none" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="138.0" y="40.0" width="84" height="28" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="57.5" font-size="10" text-anchor="middle" fill="#2E7D32" font-weight="bold">View 2</text><path d="M180 68 L180 104" fill="none" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="238.0" y="40.0" width="84" height="28" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.6"/><text x="280" y="57.5" font-size="10" text-anchor="middle" fill="#2E7D32" font-weight="bold">View 3</text><path d="M280 68 L180 104" fill="none" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="14" y="34.4" font-size="9.6" text-anchor="start" fill="#2E7D32" font-weight="bold">External level: user views</text><text x="352" y="90.9" font-size="8.4" text-anchor="end" fill="#666" font-weight="normal">external/conceptual</text><text x="352" y="101.9" font-size="8.4" text-anchor="end" fill="#666" font-weight="normal">mapping</text><rect x="60.0" y="104.0" width="240" height="32" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="123.8" font-size="11" text-anchor="middle" fill="#1565C0" font-weight="bold">Conceptual schema</text><text x="14" y="151.2" font-size="9.2" text-anchor="start" fill="#1565C0" font-weight="normal">Conceptual level: whole DB, tables, relations</text><path d="M180 154 L180 178" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,178.0 183.5,171.0 176.5,171.0" fill="#222"/><text x="352" y="172.9" font-size="8.4" text-anchor="end" fill="#666" font-weight="normal">conceptual/internal mapping</text><rect x="60.0" y="178.0" width="240" height="32" rx="7" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.6"/><text x="180" y="197.8" font-size="11" text-anchor="middle" fill="#E07B00" font-weight="bold">Internal schema</text><text x="14" y="225.2" font-size="9.2" text-anchor="start" fill="#E07B00" font-weight="normal">Internal level: storage, indexes, file layout</text><path d="M180 228 L180 246" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,246.0 183.5,239.0 176.5,239.0" fill="#222"/><ellipse cx="180" cy="252" rx="70" ry="7" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.4"/><rect x="110" y="252" width="140" height="26" rx="0" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="0"/><path d="M110 252 L110 278 M250 252 L250 278" fill="none" stroke="#7B2CD9" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="180" cy="278" rx="70" ry="7" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.4"/><text x="180" y="269.5" font-size="10" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Stored database</text><rect x="12" y="296" width="336" height="85" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="314.4" font-size="9.6" text-anchor="start" fill="#7B2CD9" font-weight="normal">Logical data independence:</text><text x="20" y="329.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal"> change conceptual schema without changing views.</text><text x="20" y="344.4" font-size="9.6" text-anchor="start" fill="#7B2CD9" font-weight="normal">Physical data independence:</text><text x="20" y="359.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal"> change internal schema without changing</text><text x="20" y="374.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal"> the conceptual schema.</text></g></svg>