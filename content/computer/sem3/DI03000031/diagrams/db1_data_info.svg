<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 244" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="244" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Data, Processing and Information</text><rect x="14" y="44" width="98" height="112" rx="8" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.5"/><text x="63" y="64.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">DATA</text><text x="63" y="83.4" font-size="9.6" text-anchor="middle" fill="#222" font-weight="normal">Aarav</text><text x="63" y="97.4" font-size="9.6" text-anchor="middle" fill="#222" font-weight="normal">82</text><text x="63" y="111.4" font-size="9.6" text-anchor="middle" fill="#222" font-weight="normal">Surat</text><text x="63" y="125.4" font-size="9.6" text-anchor="middle" fill="#222" font-weight="normal">CE</text><text x="63" y="149.2" font-size="9" text-anchor="middle" fill="#666" font-weight="normal">raw facts</text><path d="M114 100 L134 100" fill="none" stroke="#222" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="140.0,100.0 133.0,96.5 133.0,103.5" fill="#222"/><rect x="142" y="64" width="76" height="72" rx="8" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.5"/><text x="180" y="91.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">Processing</text><text x="180" y="105.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">sort, sum,</text><text x="180" y="119.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">compare</text><path d="M220 100 L240 100" fill="none" stroke="#222" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="246.0,100.0 239.0,96.5 239.0,103.5" fill="#222"/><rect x="248" y="44" width="98" height="112" rx="8" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.5"/><text x="297" y="63.7" font-size="10.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">INFORMATION</text><text x="297" y="85.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">Aarav of CE</text><text x="297" y="99.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">scored 82,</text><text x="297" y="113.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">rank 2 in</text><text x="297" y="127.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">class</text><text x="297" y="149.2" font-size="9" text-anchor="middle" fill="#666" font-weight="normal">meaningful</text><rect x="12" y="172" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="190.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal"> Data: raw, unorganised facts (no meaning alone).</text><text x="20" y="205.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal"> Information: processed data that is meaningful</text><text x="20" y="220.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">  and useful for decision making.</text><text x="20" y="235.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal"> Information of one step = data for the next step.</text></svg>