<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 292" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="292" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">2NF → 3NF (Transitive Dependency)</text><g transform="translate(0,14)"><text x="14" y="31.4" font-size="9.6" text-anchor="start" fill="#1565C0" font-weight="bold">EMPLOYEE (2NF)</text><text x="14" y="47.4" font-size="9.6" text-anchor="start" fill="#1565C0" font-weight="bold"></text><rect x="14" y="52" width="60" height="22" rx="0" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.2"/><text x="44.0" y="66.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="bold">EMPNO</text><path d="M29.0 69 L59.0 69" fill="none" stroke="#222" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="74" y="52" width="62" height="22" rx="0" fill="#fff" stroke="#1565C0" stroke-width="1.2"/><text x="105.0" y="66.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">ENAME</text><rect x="136" y="52" width="66" height="22" rx="0" fill="#fff" stroke="#1565C0" stroke-width="1.2"/><text x="169.0" y="66.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">DEPTNO</text><rect x="202" y="52" width="66" height="22" rx="0" fill="#fff" stroke="#1565C0" stroke-width="1.2"/><text x="235.0" y="66.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">DNAME</text><rect x="268" y="52" width="54" height="22" rx="0" fill="#fff" stroke="#1565C0" stroke-width="1.2"/><text x="295.0" y="66.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">LOC</text><path d="M44.0 52 L44.0 40 L169.0 40 L169.0 46" fill="none" stroke="#1565C0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><polygon points="169.0,52.0 172.5,45.0 165.5,45.0" fill="#1565C0"/><path d="M105.0 40 L105.0 46" fill="none" stroke="#1565C0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><polygon points="105.0,52.0 108.5,45.0 101.5,45.0" fill="#1565C0"/><path d="M161.0 74 L161.0 86 L235.0 86 L235.0 80" fill="none" stroke="#C62828" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><polygon points="235.0,74.0 231.5,81.0 238.5,81.0" fill="#C62828"/><path d="M177.0 74 L177.0 98 L295.0 98 L295.0 80" fill="none" stroke="#C62828" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><polygon points="295.0,74.0 291.5,81.0 298.5,81.0" fill="#C62828"/><text x="14" y="109.2" font-size="9.2" text-anchor="start" fill="#C62828" font-weight="bold">DEPTNO → DNAME, LOC (non-key → non-key)</text><path d="M150 112 L150 130" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="150.0,130.0 153.5,123.0 146.5,123.0" fill="#222"/><text x="14" y="147.4" font-size="9.6" text-anchor="start" fill="#2E7D32" font-weight="bold">EMP</text><rect x="14" y="152" width="60" height="22" rx="0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="44.0" y="166.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="bold">EMPNO</text><path d="M29.0 169 L59.0 169" fill="none" stroke="#222" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="74" y="152" width="62" height="22" rx="0" fill="#fff" stroke="#2E7D32" stroke-width="1.2"/><text x="105.0" y="166.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">ENAME</text><rect x="136" y="152" width="66" height="22" rx="0" fill="#fff" stroke="#2E7D32" stroke-width="1.2"/><text x="169.0" y="166.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">DEPTNO</text><text x="214" y="147.4" font-size="9.6" text-anchor="start" fill="#2E7D32" font-weight="bold">DEPT</text><rect x="214" y="152" width="52" height="22" rx="0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text x="240.0" y="166.0" font-size="8.6" text-anchor="middle" fill="#222" font-weight="bold">DEPTNO</text><path d="M222.0 169 L258.0 169" fill="none" stroke="#222" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="266" y="152" width="50" height="22" rx="0" fill="#fff" stroke="#2E7D32" stroke-width="1.2"/><text x="291.0" y="166.0" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">DNAME</text><rect x="316" y="152" width="40" height="22" rx="0" fill="#fff" stroke="#2E7D32" stroke-width="1.2"/><text x="336.0" y="166.0" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">LOC</text><text x="150" y="195.2" font-size="9.2" text-anchor="middle" fill="#7B2CD9" font-weight="normal">EMP.DEPTNO is a foreign key → DEPT.DEPTNO</text><rect x="12" y="206" width="336" height="70" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="224.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">EMPNO → DEPTNO → DNAME is transitive.</text><text x="20" y="239.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">Move the dependency DEPTNO → DNAME, LOC to a</text><text x="20" y="254.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">new table DEPT; keep DEPTNO in EMP as a</text><text x="20" y="269.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">foreign key. Department data is now stored once.</text></g></svg>