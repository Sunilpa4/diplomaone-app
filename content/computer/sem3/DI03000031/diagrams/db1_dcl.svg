<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 346" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="346" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Users, Roles and Privileges (DCL)</text><rect x="120.0" y="35.0" width="120" height="30" rx="7" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="53.7" font-size="10.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">DBA / owner</text><path d="M180 65 L180 92" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,92.0 183.5,85.0 176.5,85.0" fill="#222"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="186" y="85.2" font-size="9" text-anchor="start" fill="#2E7D32" font-weight="normal">GRANT SELECT, INSERT</text><rect x="105.0" y="93.0" width="150" height="30" rx="7" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.6"/><text x="180" y="111.7" font-size="10.5" text-anchor="middle" fill="#E07B00" font-weight="bold">ROLE: clerk_role</text><path d="M180 123 L80 150" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="80.0,154.0 86.1,149.1 79.8,146.2" fill="#666"/><rect x="40.0" y="156.0" width="80" height="28" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="80" y="173.4" font-size="9.6" text-anchor="middle" fill="#222" font-weight="normal">user ravi</text><path d="M180 123 L180 150" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,154.0 183.5,147.0 176.5,147.0" fill="#666"/><rect x="140.0" y="156.0" width="80" height="28" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="173.4" font-size="9.6" text-anchor="middle" fill="#222" font-weight="normal">user meena</text><path d="M180 123 L280 150" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="280.0,154.0 280.2,146.2 273.9,149.1" fill="#666"/><rect x="240.0" y="156.0" width="80" height="28" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="280" y="173.4" font-size="9.6" text-anchor="middle" fill="#222" font-weight="normal">user jay</text><text x="180" y="207.2" font-size="9" text-anchor="middle" fill="#666" font-weight="normal">every user of the role gets its privileges</text><rect x="20" y="216" width="156" height="76" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.3"/><text x="98" y="235.5" font-size="10" text-anchor="middle" fill="#2E7D32" font-weight="bold">System privileges</text><text x="98" y="253.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">CREATE SESSION</text><text x="98" y="266.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">CREATE TABLE</text><text x="98" y="279.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">CREATE VIEW</text><rect x="184" y="216" width="156" height="76" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.3"/><text x="262" y="235.5" font-size="10" text-anchor="middle" fill="#1565C0" font-weight="bold">Object privileges</text><text x="262" y="253.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">SELECT, INSERT, UPDATE</text><text x="262" y="266.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">DELETE, ALTER, INDEX</text><text x="262" y="279.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">on a table/view</text><rect x="12" y="302" width="336" height="40" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="320.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">GRANT gives privileges; REVOKE takes them back.</text><text x="20" y="335.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">WITH GRANT OPTION lets the user grant further.</text></svg>