<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 310" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="310" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Procedure vs Function</text><rect x="8" y="44" width="100" height="24" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="58.0" y="59.1" font-size="8.8" text-anchor="middle" fill="#fff" font-weight="bold">Feature</text><rect x="108" y="44" width="124" height="24" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="170.0" y="59.1" font-size="8.8" text-anchor="middle" fill="#fff" font-weight="bold">Procedure</text><rect x="232" y="44" width="120" height="24" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="292.0" y="59.1" font-size="8.8" text-anchor="middle" fill="#fff" font-weight="bold">Function</text><rect x="8" y="68" width="100" height="24" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="58.0" y="83.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">Purpose</text><rect x="108" y="68" width="124" height="24" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="170.0" y="83.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">performs an action</text><rect x="232" y="68" width="120" height="24" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="292.0" y="83.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">computes a value</text><rect x="8" y="92" width="100" height="24" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="58.0" y="107.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">RETURN clause</text><rect x="108" y="92" width="124" height="24" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="170.0" y="107.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">not in header</text><rect x="232" y="92" width="120" height="24" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="292.0" y="107.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">RETURN datatype</text><rect x="8" y="116" width="100" height="24" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="58.0" y="131.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">Returns</text><rect x="108" y="116" width="124" height="24" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="170.0" y="131.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">0 or more via OUT</text><rect x="232" y="116" width="120" height="24" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="292.0" y="131.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">exactly one value</text><rect x="8" y="140" width="100" height="24" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="58.0" y="155.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">Called from</text><rect x="108" y="140" width="124" height="24" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="170.0" y="155.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">EXEC / block</text><rect x="232" y="140" width="120" height="24" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="292.0" y="155.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">expression / SELECT</text><rect x="8" y="164" width="100" height="24" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="58.0" y="179.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">Used in SQL</text><rect x="108" y="164" width="124" height="24" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="170.0" y="179.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">No</text><rect x="232" y="164" width="120" height="24" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="292.0" y="179.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">Yes (if no DML)</text><rect x="8" y="188" width="100" height="24" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="58.0" y="203.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">Keyword</text><rect x="108" y="188" width="124" height="24" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="170.0" y="203.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">PROCEDURE</text><rect x="232" y="188" width="120" height="24" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="292.0" y="203.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">FUNCTION</text><text x="14" y="239.5" font-size="10" text-anchor="start" fill="#7B2CD9" font-weight="bold">Parameter modes</text><rect x="8" y="246" width="112" height="52" rx="6" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.3"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="64" y="263.5" font-size="10" text-anchor="middle" fill="#1565C0" font-weight="bold">IN</text><text x="64" y="279.0" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">caller to procedure</text><text x="64" y="293.0" font-size="8.6" text-anchor="middle" fill="#666" font-weight="normal">read only (default)</text><rect x="124" y="246" width="112" height="52" rx="6" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.3"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="180" y="263.5" font-size="10" text-anchor="middle" fill="#E07B00" font-weight="bold">OUT</text><text x="180" y="279.0" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">procedure to caller</text><text x="180" y="293.0" font-size="8.6" text-anchor="middle" fill="#666" font-weight="normal">write a result</text><rect x="240" y="246" width="112" height="52" rx="6" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.3"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="296" y="263.5" font-size="10" text-anchor="middle" fill="#2E7D32" font-weight="bold">IN OUT</text><text x="296" y="279.0" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">both directions</text><text x="296" y="293.0" font-size="8.6" text-anchor="middle" fill="#666" font-weight="normal">read and write</text></svg>