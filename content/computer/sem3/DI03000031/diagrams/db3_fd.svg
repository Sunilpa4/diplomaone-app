<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 334" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="334" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Functional Dependency X → Y</text><rect x="40" y="46" width="100" height="40" rx="8" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="90" y="64.5" font-size="13" text-anchor="middle" fill="#1565C0" font-weight="bold">X</text><text x="90" y="79.0" font-size="8.6" text-anchor="middle" fill="#1565C0" font-weight="normal">determinant</text><path d="M142 66 L210 66" fill="none" stroke="#222" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="216.0,66.0 209.0,62.5 209.0,69.5" fill="#222"/><text x="179" y="59.0" font-size="8.6" text-anchor="middle" fill="#666" font-weight="normal">determines</text><rect x="218" y="46" width="100" height="40" rx="8" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.6"/><text x="268" y="64.5" font-size="13" text-anchor="middle" fill="#2E7D32" font-weight="bold">Y</text><text x="268" y="79.0" font-size="8.6" text-anchor="middle" fill="#2E7D32" font-weight="normal">dependent</text><text x="180" y="111.3" font-size="9.4" text-anchor="middle" fill="#7B2CD9" font-weight="bold">For each value of X there is exactly ONE value of Y</text><rect x="70" y="122" width="70" height="20" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="105.0" y="135.2" font-size="9.2" text-anchor="middle" fill="#fff" font-weight="bold">ROLLNO</text><rect x="140" y="122" width="80" height="20" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="180.0" y="135.2" font-size="9.2" text-anchor="middle" fill="#fff" font-weight="bold">NAME</text><rect x="220" y="122" width="70" height="20" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="255.0" y="135.2" font-size="9.2" text-anchor="middle" fill="#fff" font-weight="bold">CITY</text><rect x="70" y="142" width="70" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="105.0" y="155.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">1</text><rect x="140" y="142" width="80" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="180.0" y="155.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">Aarav</text><rect x="220" y="142" width="70" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="255.0" y="155.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">Surat</text><rect x="70" y="162" width="70" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="105.0" y="175.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">2</text><rect x="140" y="162" width="80" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="180.0" y="175.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">Diya</text><rect x="220" y="162" width="70" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="255.0" y="175.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">Vadodara</text><rect x="70" y="182" width="70" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="105.0" y="195.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">1</text><rect x="140" y="182" width="80" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="180.0" y="195.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">Aarav</text><rect x="220" y="182" width="70" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="255.0" y="195.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">Surat</text><text x="180" y="217.2" font-size="9.2" text-anchor="middle" fill="#2E7D32" font-weight="normal">ROLLNO → NAME holds (1 always gives Aarav)</text><text x="180" y="233.2" font-size="9.2" text-anchor="middle" fill="#C62828" font-weight="normal">NAME → ROLLNO may fail (two students can be Amit)</text><rect x="12" y="244" width="336" height="85" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="262.3" font-size="9.4" text-anchor="start" fill="#7B2CD9" font-weight="normal">Armstrong's axioms:</text><text x="20" y="277.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">Reflexivity: if Y ⊆ X then X → Y</text><text x="20" y="292.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">Augmentation: if X → Y then XZ → YZ</text><text x="20" y="307.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">Transitivity: if X → Y and Y → Z then X → Z</text><text x="20" y="322.3" font-size="9.4" text-anchor="start" fill="#7B2CD9" font-weight="normal">Closure X+ = all attributes determined by X.</text></svg>