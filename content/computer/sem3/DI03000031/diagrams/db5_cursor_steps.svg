<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 370" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="370" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Explicit Cursor: Four Steps</text><path d="M120 76 L120 92" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="120.0,92.0 123.5,85.0 116.5,85.0" fill="#222"/><path d="M120 122 L120 136" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="120.0,136.0 123.5,129.0 116.5,129.0" fill="#222"/><path d="M120 171 L120 187" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="120.0,187.0 123.5,180.0 116.5,180.0" fill="#222"/><path d="M120 240 L120 265" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="120.0,265.0 123.5,258.0 116.5,258.0" fill="#222"/><text x="134" y="257.7" font-size="10.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">Yes</text><path d="M175 214 L206 214" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="206.0,214.0 199.0,210.5 199.0,217.5" fill="#222"/><text x="190" y="209.7" font-size="10.5" text-anchor="middle" fill="#C62828" font-weight="bold">No</text><path d="M262 199 L262 154 L197 154" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="191.0,154.0 198.0,157.5 198.0,150.5" fill="#222"/><rect x="45.0" y="48.0" width="150" height="28" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.8"/><text x="120" y="65.5" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">1. DECLARE cursor</text><rect x="45.0" y="93.0" width="150" height="28" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.8"/><text x="120" y="110.5" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">2. OPEN cursor</text><polygon points="62.0,138.0 196.0,138.0 178.0,170.0 44.0,170.0" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.8"/><text x="120" y="157.5" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">3. FETCH INTO vars</text><polygon points="120,188.0 175.0,214 120,240.0 65.0,214" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.8"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="120" y="217.4" font-size="9.6" text-anchor="middle" fill="#222" font-weight="normal">%NOTFOUND?</text><rect x="212.0" y="199.0" width="100" height="30" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.8"/><text x="262" y="217.5" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">Process row</text><rect x="45.0" y="266.0" width="150" height="28" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.8"/><text x="120" y="283.5" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">4. CLOSE cursor</text><text x="204" y="65.1" font-size="8.8" text-anchor="start" fill="#666" font-weight="normal">names the query</text><text x="204" y="110.1" font-size="8.8" text-anchor="start" fill="#666" font-weight="normal">runs the query</text><text x="204" y="283.1" font-size="8.8" text-anchor="start" fill="#666" font-weight="normal">frees the memory</text><rect x="12" y="304" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="322.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">Attributes: %ISOPEN, %FOUND, %NOTFOUND, %ROWCOUNT.</text><text x="20" y="337.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">A cursor FOR loop does OPEN, FETCH and CLOSE</text><text x="20" y="352.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">automatically.</text></svg>