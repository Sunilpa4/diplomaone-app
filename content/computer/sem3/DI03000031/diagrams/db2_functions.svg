<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="330" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Types of SQL Functions</text><rect x="105.0" y="32.0" width="150" height="28" rx="7" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="50.0" font-size="11.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">SQL functions</text><path d="M180 60 L180 72 M90 72 L270 72 M90 72 L90 84 M270 72 L270 84" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><rect x="14" y="84" width="152" height="40" rx="8" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.5"/><text x="90" y="102.8" font-size="11" text-anchor="middle" fill="#1565C0" font-weight="bold">Single-row</text><text x="90" y="117.1" font-size="8.8" text-anchor="middle" fill="#1565C0" font-weight="normal">one result per row</text><rect x="194" y="84" width="152" height="40" rx="8" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.5"/><text x="270" y="102.8" font-size="11" text-anchor="middle" fill="#2E7D32" font-weight="bold">Multiple-row</text><text x="270" y="117.1" font-size="8.8" text-anchor="middle" fill="#2E7D32" font-weight="normal">one result per group</text><path d="M22 124 L22 150 L30 150" fill="none" stroke="#1565C0" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><rect x="30" y="134" width="136" height="32" rx="6" fill="#fff" stroke="#1565C0" stroke-width="1.1"/><text x="98" y="148.4" font-size="9.6" text-anchor="middle" fill="#1565C0" font-weight="bold">Character</text><text x="98" y="160.9" font-size="8.2" text-anchor="middle" fill="#666" font-weight="normal">UPPER, SUBSTR, INSTR</text><path d="M22 124 L22 188 L30 188" fill="none" stroke="#1565C0" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><rect x="30" y="172" width="136" height="32" rx="6" fill="#fff" stroke="#1565C0" stroke-width="1.1"/><text x="98" y="186.4" font-size="9.6" text-anchor="middle" fill="#1565C0" font-weight="bold">Numeric</text><text x="98" y="198.9" font-size="8.2" text-anchor="middle" fill="#666" font-weight="normal">ROUND, MOD, POWER</text><path d="M22 124 L22 226 L30 226" fill="none" stroke="#1565C0" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><rect x="30" y="210" width="136" height="32" rx="6" fill="#fff" stroke="#1565C0" stroke-width="1.1"/><text x="98" y="224.4" font-size="9.6" text-anchor="middle" fill="#1565C0" font-weight="bold">Date</text><text x="98" y="236.9" font-size="8.2" text-anchor="middle" fill="#666" font-weight="normal">ADD_MONTHS, LAST_DAY</text><path d="M22 124 L22 264 L30 264" fill="none" stroke="#1565C0" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><rect x="30" y="248" width="136" height="32" rx="6" fill="#fff" stroke="#1565C0" stroke-width="1.1"/><text x="98" y="262.4" font-size="9.6" text-anchor="middle" fill="#1565C0" font-weight="bold">Conversion</text><text x="98" y="274.9" font-size="8.2" text-anchor="middle" fill="#666" font-weight="normal">TO_CHAR, TO_DATE</text><path d="M22 124 L22 302 L30 302" fill="none" stroke="#1565C0" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><rect x="30" y="286" width="136" height="32" rx="6" fill="#fff" stroke="#1565C0" stroke-width="1.1"/><text x="98" y="300.4" font-size="9.6" text-anchor="middle" fill="#1565C0" font-weight="bold">General</text><text x="98" y="312.9" font-size="8.2" text-anchor="middle" fill="#666" font-weight="normal">NVL, DECODE</text><path d="M202 124 L202 150 L210 150" fill="none" stroke="#2E7D32" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><rect x="210" y="134" width="136" height="70" rx="6" fill="#fff" stroke="#2E7D32" stroke-width="1.1"/><text x="278" y="150.4" font-size="9.6" text-anchor="middle" fill="#2E7D32" font-weight="bold">Aggregate</text><text x="278" y="164.9" font-size="