<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="360" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Sub-query and Correlated Sub-query</text><text x="90" y="45.7" font-size="10.5" text-anchor="middle" fill="#1565C0" font-weight="bold">Nested (simple)</text><rect x="14" y="52" width="156" height="40" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.3"/><text x="92" y="69.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">Inner query runs</text><text x="92" y="82.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">ONCE first</text><path d="M92 92 L92 112" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="92.0,112.0 95.5,105.0 88.5,105.0" fill="#222"/><text x="98" y="107.0" font-size="8.6" text-anchor="start" fill="#666" font-weight="normal">result</text><rect x="14" y="112" width="156" height="40" rx="7" fill="#fff" stroke="#1565C0" stroke-width="1.3"/><text x="92" y="129.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">Outer query uses</text><text x="92" y="142.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">the result</text><text x="270" y="45.7" font-size="10.5" text-anchor="middle" fill="#E07B00" font-weight="bold">Correlated</text><rect x="186" y="52" width="150" height="40" rx="7" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.3"/><text x="261" y="69.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">Outer query takes</text><text x="261" y="82.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">a row</text><path d="M261 92 L261 112" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="261.0,112.0 264.5,105.0 257.5,105.0" fill="#222"/><rect x="186" y="112" width="150" height="40" rx="7" fill="#fff" stroke="#E07B00" stroke-width="1.3"/><text x="261" y="129.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">Inner query runs for</text><text x="261" y="142.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">THAT row</text><path d="M336 132 C 352 132, 352 72, 340 72" fill="none" stroke="#E07B00" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><polygon points="338.0,72.0 345.0,75.5 345.0,68.5" fill="#E07B00"/><text x="261" y="169.0" font-size="8.6" text-anchor="middle" fill="#E07B00" font-weight="normal">repeats for every outer row</text><rect x="14" y="180" width="332" height="60" rx="7" fill="#FBF8FF" stroke="#7B2CD9" stroke-width="1.1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="199.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">SELECT ename FROM emp</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="214.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">WHERE sal &gt; (SELECT AVG(sal)</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="229.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">             FROM emp);</text><rect x="14" y="248" width="332" height="60" rx="7" fill="#FFF8EE" stroke="#E07B00" stroke-width="1.1"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="267.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">SELECT ename FROM emp e</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="282.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">WHERE sal &gt; (SELECT AVG(sal) FROM emp</text><text font-family="DejaVu Sans Mono, Consolas, monospace" x="24" y="297.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">     WHERE deptno = e.deptno);</text><rect x="12" y="318" width="336" height="40" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="336.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">Single-row sub-query: use =, &gt;, &lt;  ...</text><text x="20" y="351.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">Multiple-row sub-query: use IN, ANY, ALL, EXISTS</text></svg>