<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 312" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="312" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Simple View vs Complex View</text><rect x="14" y="44" width="128" height="24" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="78.0" y="59.2" font-size="9.2" text-anchor="middle" fill="#fff" font-weight="bold">Feature</text><rect x="142" y="44" width="102" height="24" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="193.0" y="59.2" font-size="9.2" text-anchor="middle" fill="#fff" font-weight="bold">Simple view</text><rect x="244" y="44" width="102" height="24" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="295.0" y="59.2" font-size="9.2" text-anchor="middle" fill="#fff" font-weight="bold">Complex view</text><rect x="14" y="68" width="128" height="24" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="78.0" y="83.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">Base tables</text><rect x="142" y="68" width="102" height="24" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="193.0" y="83.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">One table</text><rect x="244" y="68" width="102" height="24" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="295.0" y="83.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">One or more</text><rect x="14" y="92" width="128" height="24" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="78.0" y="107.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">Functions, GROUP BY</text><rect x="142" y="92" width="102" height="24" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="193.0" y="107.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">No</text><rect x="244" y="92" width="102" height="24" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="295.0" y="107.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">Yes</text><rect x="14" y="116" width="128" height="24" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="78.0" y="131.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">DISTINCT / joins</text><rect x="142" y="116" width="102" height="24" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="193.0" y="131.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">No</text><rect x="244" y="116" width="102" height="24" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="295.0" y="131.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">Yes</text><rect x="14" y="140" width="128" height="24" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="78.0" y="155.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">Expression columns</text><rect x="142" y="140" width="102" height="24" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="193.0" y="155.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">No</text><rect x="244" y="140" width="102" height="24" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="295.0" y="155.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">Yes</text><rect x="14" y="164" width="128" height="24" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="78.0" y="179.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">INSERT/UPDATE/DELETE</text><rect x="142" y="164" width="102" height="24" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="193.0" y="179.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">Allowed</text><rect x="244" y="164" width="102" height="24" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="295.0" y="179.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">Not always</text><rect x="14" y="200" width="332" height="54" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="219.4" font-size="9.6" text-anchor="start" fill="#2E7D32" font-weight="bold">WITH CHECK OPTION</text><text x="22" y="235.2" font-size="9" text-anchor="start" fill="#222" font-weight="normal">DML through the view must give rows that the</text><text x="22" y="248.2" font-size="9" text-anchor="start" fill="#222" font-weight="normal">view can see (else ORA-01402).</text><rect x="14" y="262" width="332" height="40" rx="7" fill="#FDECEC" stroke="#C62828" stroke-width="1.2"/><text font-family="DejaVu Sans Mono, Consolas, monospace" x="22" y="281.4" font-size="9.6" text-anchor="start" fill="#C62828" font-weight="bold">WITH READ ONLY</text><text x="22" y="296.1" font-size="9" text-anchor="start" fill="#222" font-weight="normal">No DML allowed through the view (ORA-42399).</text></svg>