text-anchor="middle" fill="#222" font-weight="normal">5</text><rect x="224" y="112" width="56" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="252.0" y="125.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">YES</text><rect x="280" y="112" width="56" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="308.0" y="125.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal"></text><rect x="24" y="132" width="72" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="60.0" y="145.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">MARKS</text><rect x="96" y="132" width="78" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="135.0" y="145.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">NUMBER</text><rect x="174" y="132" width="50" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="199.0" y="145.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">3</text><rect x="224" y="132" width="56" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="252.0" y="145.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal">YES</text><rect x="280" y="132" width="56" height="20" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="308.0" y="145.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal"></text><rect x="12" y="170" width="336" height="115" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="188.4" font-size="9.6" text-anchor="start" fill="#7B2CD9" font-weight="normal">Metadata = data about data.</text><text x="20" y="203.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">It describes the structure of the data: names,</text><text x="20" y="218.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">types, sizes, constraints, owners, privileges.</text><text x="20" y="233.4" font-size="9.6" text-anchor="start" fill="#7B2CD9" font-weight="normal">Data dictionary (system catalog):</text><text x="20" y="248.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">a set of read-only tables where the DBMS keeps</text><text x="20" y="263.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">all metadata. In Oracle: USER_TABLES,</text><text x="20" y="278.4" font-size="9.6" text-anchor="start" fill="#222" font-weight="normal">USER_TAB_COLUMNS, USER_CONSTRAINTS ...</text></svg>