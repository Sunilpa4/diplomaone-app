<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 378" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="378" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Steps of Normalization</text><rect x="14" y="40" width="250" height="42" rx="8" fill="#F2F2F2" stroke="#777" stroke-width="1.6"/><text x="44" y="65.2" font-size="12" text-anchor="middle" fill="#777" font-weight="bold">UNF</text><text x="78" y="58.1" font-size="9" text-anchor="start" fill="#222" font-weight="normal">Unnormalized: repeating groups,</text><text x="78" y="72.2" font-size="9" text-anchor="start" fill="#222" font-weight="normal">multi-valued cells</text><path d="M164 82 L164 92 L180 92" fill="none" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M186 86 L186 98" fill="none" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="186.0,98.0 189.0,92.0 183.0,92.0" fill="#666"/><text x="194" y="93.9" font-size="8.2" text-anchor="start" fill="#777" font-weight="normal">remove repeating groups</text><rect x="36" y="98" width="250" height="42" rx="8" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.6"/><text x="66" y="123.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">1NF</text><text x="100" y="116.2" font-size="9" text-anchor="start" fill="#222" font-weight="normal">Atomic values, no repeating</text><text x="100" y="130.2" font-size="9" text-anchor="start" fill="#222" font-weight="normal">groups, primary key defined</text><path d="M186 140 L186 150 L202 150" fill="none" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M208 144 L208 156" fill="none" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="208.0,156.0 211.0,150.0 205.0,150.0" fill="#666"/><text x="216" y="151.9" font-size="8.2" text-anchor="start" fill="#1565C0" font-weight="normal">remove partial dependency</text><rect x="58" y="156" width="250" height="42" rx="8" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.6"/><text x="88" y="181.2" font-size="12" text-anchor="middle" fill="#2E7D32" font-weight="bold">2NF</text><text x="122" y="174.2" font-size="9" text-anchor="start" fill="#222" font-weight="normal">1NF + no partial dependency</text><text x="122" y="188.2" font-size="9" text-anchor="start" fill="#222" font-weight="normal">(full dependency on key)</text><path d="M208 198 L208 208 L224 208" fill="none" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M230 202 L230 214" fill="none" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="230.0,214.0 233.0,208.0 227.0,208.0" fill="#666"/><text x="238" y="209.9" font-size="8.2" text-anchor="start" fill="#2E7D32" font-weight="normal">remove transitive dep.</text><rect x="80" y="214" width="250" height="42" rx="8" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.6"/><text x="110" y="239.2" font-size="12" text-anchor="middle" fill="#E07B00" font-weight="bold">3NF</text><text x="144" y="232.2" font-size="9" text-anchor="start" fill="#222" font-weight="normal">2NF + no transitive dependency</text><text x="144" y="246.2" font-size="9" text-anchor="start" fill="#222" font-weight="normal">(non-key depends on key only)</text><path d="M230 256 L230 266 L246 266" fill="none" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M252 260 L252 272" fill="none" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="252.0,272.0 255.0,266.0 249.0,266.0" fill="#666"/><text x="260" y="267.9" font-size="8.2" text-anchor="start" fill="#E07B00" font-weight="normal">determinants = keys</text><rect x="102" y="272" width="250" height="42" rx="8" fill="#F1E8FC" stroke="#7B2CD9" stroke-width="1.6"/><text x="132" y="297.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">BCNF</text><text x="166" y="290.1" font-size="9" text-anchor="start" fill="#222" font-weight="normal">every determinant is a</text><text x="166" y="304.1" font-size="9" text-anchor="start" fill="#222" font-weight="normal">candidate key</text><rect x="12" y="336" width="336" height="40" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="354.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">Each higher normal form also satisfies all the</text><text x="20" y="369.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">lower ones. In practice, 3NF is usually enough.</text></svg>