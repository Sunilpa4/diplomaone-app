<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 312" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="312" fill="#ffffff"/><text x="180" y="23.1" font-size="14.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">LIKE Wildcards: % and _</text><rect x="14" y="34" width="160" height="46" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.4"/><text x="94" y="56.6" font-size="16" text-anchor="middle" fill="#1565C0" font-weight="bold">%</text><text x="94" y="73.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">zero or more characters</text><rect x="186" y="34" width="160" height="46" rx="7" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.4"/><text x="266" y="56.6" font-size="16" text-anchor="middle" fill="#2E7D32" font-weight="bold">_</text><text x="266" y="73.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">exactly one character</text><rect x="14" y="92" width="80" height="22" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="54.0" y="106.2" font-size="9.2" text-anchor="middle" fill="#fff" font-weight="bold">Pattern</text><rect x="94" y="92" width="120" height="22" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="154.0" y="106.2" font-size="9.2" text-anchor="middle" fill="#fff" font-weight="bold">Meaning</text><rect x="214" y="92" width="132" height="22" rx="0" fill="#7B2CD9" stroke="#C9B3EC" stroke-width="1"/><text x="280.0" y="106.2" font-size="9.2" text-anchor="middle" fill="#fff" font-weight="bold">Matches</text><rect x="14" y="114" width="80" height="22" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="54.0" y="128.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">'P%'</text><rect x="94" y="114" width="120" height="22" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="154.0" y="128.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">starts with P</text><rect x="214" y="114" width="132" height="22" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="280.0" y="128.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">PRIYA, POOJA</text><rect x="14" y="136" width="80" height="22" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="54.0" y="150.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">'%A'</text><rect x="94" y="136" width="120" height="22" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="154.0" y="150.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">ends with A</text><rect x="214" y="136" width="132" height="22" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="280.0" y="150.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">PRIYA, NEHA</text><rect x="14" y="158" width="80" height="22" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="54.0" y="172.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">'%IT%'</text><rect x="94" y="158" width="120" height="22" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="154.0" y="172.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">contains IT</text><rect x="214" y="158" width="132" height="22" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="280.0" y="172.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">AMIT</text><rect x="14" y="180" width="80" height="22" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="54.0" y="194.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">'_I%'</text><rect x="94" y="180" width="120" height="22" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="154.0" y="194.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">2nd letter I</text><rect x="214" y="180" width="132" height="22" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="280.0" y="194.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">KIRAN, VIJAY</text><rect x="14" y="202" width="80" height="22" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="54.0" y="216.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">'____'</text><rect x="94" y="202" width="120" height="22" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="154.0" y="216.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">exactly 4 chars</text><rect x="214" y="202" width="132" height="22" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="280.0" y="216.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">AMIT, NEHA</text><rect x="14" y="224" width="80" height="22" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="54.0" y="238.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">'%\_%'</text><rect x="94" y="224" width="120" height="22" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="154.0" y="238.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">has a real _</text><rect x="214" y="224" width="132" height="22" rx="0" fill="#fff" stroke="#C9B3EC" stroke-width="1"/><text x="280.0" y="238.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">ESCAPE '\'</text><rect x="12" y="254" width="336" height="55" rx="7" fill="#E3F0FC" stroke="#1565C0" stroke-width="1.1"/><text x="20" y="272.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">LIKE is case-sensitive in Oracle: 'p%' does not</text><text x="20" y="287.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">match PRIYA. Use UPPER(ename) LIKE 'P%'.</text><text x="20" y="302.3" font-size="9.4" text-anchor="start" fill="#222" font-weight="normal">NOT LIKE returns the rows that do not match.</text></svg>