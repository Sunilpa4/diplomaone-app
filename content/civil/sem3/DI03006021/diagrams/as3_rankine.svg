<svg xmlns="http://www.w3.org/2000/svg" width="360" height="246" viewBox="0 0 360 246" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="246" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Rankine's method - deflection angles</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 3.7: one theodolite, chords and cumulative angles</text><line x1="36" y1="84" x2="200" y2="84" stroke="#B66A00" stroke-width="1.6"/><circle cx="64" cy="84" r="4" fill="#FDEBD7" stroke="#B66A00" stroke-width="1.4"/><text x="64" y="72" font-size="6.8" fill="#B66A00" text-anchor="middle" font-weight="bold">T (tangent point)</text><text x="206" y="78" font-size="6.3" fill="#B66A00" text-anchor="start" font-weight="bold">back tangent</text><path d="M64 84 A150 150 0 0 1 268 168" fill="none" stroke="#2F5D8A" stroke-width="2.0"/><circle cx="150" cy="106" r="3.2" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.2"/><line x1="64" y1="84" x2="150" y2="106" stroke="#5A5A5A" stroke-width="1.0" stroke-dasharray="4 3"/><circle cx="206" cy="130" r="3.2" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.2"/><line x1="64" y1="84" x2="206" y2="130" stroke="#5A5A5A" stroke-width="1.0" stroke-dasharray="4 3"/><circle cx="250" cy="156" r="3.2" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.2"/><line x1="64" y1="84" x2="250" y2="156" stroke="#5A5A5A" stroke-width="1.0" stroke-dasharray="4 3"/><text x="150" y="98" font-size="6.5" fill="#2F5D8A" text-anchor="middle" font-weight="bold">P1</text><text x="206" y="122" font-size="6.5" fill="#2F5D8A" text-anchor="middle" font-weight="bold">P2</text><text x="258" y="148" font-size="6.5" fill="#2F5D8A" text-anchor="start" font-weight="bold">P3</text><path d="M104 84 A40 40 0 0 1 102 94" fill="none" stroke="#7B2CD9" stroke-width="1.3"/><path d="M124 84 A60 60 0 0 1 120 100" fill="none" stroke="#7B2CD9" stroke-width="1.3"/><text x="140" y="174" font-size="6.3" fill="#7B2CD9" text-anchor="start" font-weight="bold">deflection angles from tangent</text><rect x="52" y="196" width="256" height="44" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.1"/><text x="180" y="211" font-size="7.0" fill="#272134" text-anchor="middle">Rankine: theodolite at T, book cumulative deflections,</text><text x="180" y="224" font-size="7.0" fill="#272134" text-anchor="middle">chain each chord - the curve walks itself out.</text><text x="180" y="237" font-size="7.0" fill="#272134" text-anchor="middle">deflection per chord: 1718.9 x chord/R minutes.</text></svg>