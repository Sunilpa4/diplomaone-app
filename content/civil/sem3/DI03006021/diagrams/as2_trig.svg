<svg xmlns="http://www.w3.org/2000/svg" width="360" height="262" viewBox="0 0 360 262" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="262" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Trigonometric heighting - base accessible</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 2.2: h = D tan(a) above the instrument axis</text><line x1="30" y1="196" x2="330" y2="196" stroke="#5A5A5A" stroke-width="1.4"/><rect x="250" y="62" width="34" height="134" rx="3" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.6"/><text x="267" y="54" font-size="6.5" fill="#2F5D8A" text-anchor="middle" font-weight="bold">object (top T)</text><line x1="70" y1="196" x2="82" y2="160" stroke="#5A5A5A" stroke-width="2.0"/><line x1="94" y1="196" x2="82" y2="160" stroke="#5A5A5A" stroke-width="2.0"/><rect x="72" y="150" width="22" height="9" rx="3" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5"/><circle cx="82" cy="154" r="3" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.1"/><text x="60" y="146" font-size="6.5" fill="#2F5D8A" text-anchor="end" font-weight="bold">theodolite</text><line x1="94" y1="154" x2="250" y2="154" stroke="#5A5A5A" stroke-width="1.0" stroke-dasharray="5 4"/><line x1="94" y1="154" x2="252" y2="64" stroke="#B66A00" stroke-width="1.7"/><path d="M120 154 A26 26 0 0 0 118 144" fill="none" stroke="#7B2CD9" stroke-width="1.4"/><text x="126" y="146" font-size="6.3" fill="#7B2CD9" text-anchor="start" font-weight="bold">a (angle of elevation)</text><line x1="82" y1="206" x2="267" y2="206" stroke="#2F5D8A" stroke-width="1.2"/><text x="174" y="218" font-size="6.5" fill="#2F5D8A" text-anchor="middle" font-weight="bold">horizontal distance D (taped / tacheometric)</text><line x1="296" y1="64" x2="296" y2="154" stroke="#BD2543" stroke-width="1.3"/><text x="302" y="106" font-size="6.8" fill="#BD2543" text-anchor="start" font-weight="bold">h = D tan a</text><text x="302" y="150" font-size="6.0" fill="#BD2543" text-anchor="start">+ instrument</text><text x="302" y="160" font-size="6.0" fill="#BD2543" text-anchor="start">height</text><rect x="52" y="226" width="256" height="30" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.1"/><text x="180" y="239" font-size="7.5" fill="#272134" text-anchor="middle">Base accessible: one angle + one distance</text><text x="180" y="250" font-size="7.5" fill="#272134" text-anchor="middle">gives the height - RL of top = RL of station + hi + h.</text></svg>