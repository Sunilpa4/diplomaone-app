<svg xmlns="http://www.w3.org/2000/svg" width="360" height="280" viewBox="0 0 360 280" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="280" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Inclined sight, staff vertical (elevation)</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 2.8: resolve L into D and V with theta</text><line x1="30" y1="208" x2="330" y2="208" stroke="#5A5A5A" stroke-width="1.4"/><line x1="58" y1="208" x2="70" y2="176" stroke="#5A5A5A" stroke-width="2.0"/><line x1="82" y1="208" x2="70" y2="176" stroke="#5A5A5A" stroke-width="2.0"/><rect x="60" y="166" width="22" height="9" rx="3" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5"/><text x="56" y="160" font-size="6.5" fill="#2F5D8A" text-anchor="end" font-weight="bold">instrument</text><rect x="296" y="52" width="10" height="156" rx="3" fill="#FDEBD7" stroke="#B66A00" stroke-width="1.5"/><text x="292" y="44" font-size="6.5" fill="#B66A00" text-anchor="end" font-weight="bold">staff held vertical</text><line x1="82" y1="170" x2="298" y2="76" stroke="#B66A00" stroke-width="1.7"/><line x1="82" y1="170" x2="296" y2="170" stroke="#5A5A5A" stroke-width="1.0" stroke-dasharray="5 4"/><path d="M112 170 A30 30 0 0 0 110 158" fill="none" stroke="#7B2CD9" stroke-width="1.4"/><text x="120" y="164" font-size="6.8" fill="#7B2CD9" text-anchor="start" font-weight="bold">theta</text><text x="176" y="110" font-size="6.3" fill="#B66A00" text-anchor="middle" font-weight="bold">inclined length L = K s cos(theta) + C</text><line x1="312" y1="76" x2="312" y2="170" stroke="#BD2543" stroke-width="1.3"/><text x="196" y="198" font-size="6.8" fill="#BD2543" text-anchor="middle" font-weight="bold">V = L sin(theta)</text><line x1="82" y1="220" x2="296" y2="220" stroke="#2F5D8A" stroke-width="1.2"/><text x="189" y="233" font-size="6.8" fill="#2F5D8A" text-anchor="middle" font-weight="bold">D = L cos(theta) = K s cos^2(theta) + C cos(theta)</text><rect x="52" y="242" width="256" height="32" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.1"/><text x="180" y="255" font-size="7.0" fill="#272134" text-anchor="middle">Vertical staff on inclined sight: intercept foreshortens</text><text x="180" y="268" font-size="7.0" fill="#272134" text-anchor="middle">by cos(theta) - hence cos^2(theta) in D (Card 2.8).</text></svg>