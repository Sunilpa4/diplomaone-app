roke="#B66A00" stroke-width="1.4"/><text x="120" y="78" font-size="6.3" fill="#2F5D8A" text-anchor="start" font-weight="bold">modulated carrier out</text><text x="120" y="146" font-size="6.3" fill="#B66A00" text-anchor="start" font-weight="bold">return shifted by phase difference</text><line x1="80" y1="64" x2="112" y2="64" stroke="#7B2CD9" stroke-width="1.3"/><text x="96" y="58" font-size="6.3" fill="#7B2CD9" text-anchor="middle" font-weight="bold">unit length u = lambda/2</text><rect x="52" y="164" width="256" height="44" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.1"/><text x="180" y="179" font-size="7.0" fill="#272134" text-anchor="middle">D = u x (n + phase fraction) - the instrument counts</text><text x="180" y="192" font-size="7.0" fill="#272134" text-anchor="middle">whole units coarsely, the phase fraction finely.</text><text x="180" y="203" font-size="6.8" fill="#272134" text-anchor="middle">Millimetres from timing light without a stopwatch.</text></svg>