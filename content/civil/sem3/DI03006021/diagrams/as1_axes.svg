<svg xmlns="http://www.w3.org/2000/svg" width="360" height="240" viewBox="0 0 360 240" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="240" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Fundamental axes of a theodolite</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 1.4: vertical axis, trunnion axis, collimation, bubble</text><line x1="110" y1="48" x2="110" y2="168" stroke="#2F5D8A" stroke-width="1.6" stroke-dasharray="6 4"/><text x="117" y="60" font-size="6.8" fill="#2F5D8A" text-anchor="start" font-weight="bold">vertical axis</text><text x="104" y="178" font-size="7.5" fill="#2F5D8A" text-anchor="end" font-weight="bold">V</text><text x="116" y="178" font-size="7.5" fill="#2F5D8A" text-anchor="start" font-weight="bold">V</text><rect x="102" y="108" width="6" height="34" rx="3" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.3"/><rect x="196" y="108" width="6" height="34" rx="3" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.3"/><rect x="96" y="96" width="116" height="12" rx="3" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.6"/><circle cx="108" cy="102" r="15" fill="#FCE4EC" stroke="#BD2543" stroke-width="1.4"/><line x1="84" y1="102" x2="236" y2="102" stroke="#7B2CD9" stroke-width="1.5" stroke-dasharray="6 4"/><text x="240" y="99" font-size="6.8" fill="#7B2CD9" text-anchor="start" font-weight="bold">trunnion axis</text><text x="240" y="110" font-size="6.0" fill="#7B2CD9" text-anchor="start">(horizontal axis)</text><line x1="96" y1="100" x2="232" y2="106" stroke="#B66A00" stroke-width="1.6"/><text x="234" y="122" font-size="6.8" fill="#B66A00" text-anchor="start" font-weight="bold">line of collimation</text><rect x="140" y="82" width="52" height="8" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.3"/><line x1="136" y1="78" x2="196" y2="78" stroke="#2E7D32" stroke-width="1.3"/><text x="166" y="70" font-size="6.8" fill="#2E7D32" text-anchor="middle" font-weight="bold">axis of plate bubble</text><rect x="46" y="190" width="268" height="44" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.1"/><text x="180" y="203" font-size="7.0" fill="#272134" text-anchor="middle">Permanent adjustment: plate-bubble axis perp. vertical axis;</text><text x="180" y="216" font-size="7.0" fill="#272134" text-anchor="middle">collimation perp. trunnion axis; trunnion perp. vertical axis.</text><text x="180" y="229" font-size="7.0" fill="#272134" text-anchor="middle">Then one face-left + face-right mean cancels residual error.</text></svg>