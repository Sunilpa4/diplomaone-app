<svg xmlns="http://www.w3.org/2000/svg" width="360" height="206" viewBox="0 0 360 206" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="206" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Types of horizontal curves</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 3.1: simple, compound, reverse, transition</text><rect x="3" y="48" width="84" height="62" rx="3" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.3"/><path d="M62 96 A34 34 0 0 0 30 78" fill="none" stroke="#2F5D8A" stroke-width="1.8"/><text x="45" y="126" font-size="7.0" fill="#2F5D8A" text-anchor="middle" font-weight="bold">SIMPLE</text><text x="45" y="139" font-size="5.8" fill="#272134" text-anchor="middle">one radius R</text><rect x="93" y="48" width="84" height="62" rx="3" fill="#FFFFFF" stroke="#B66A00" stroke-width="1.3"/><path d="M96 92 A40 40 0 0 1 122 74 A22 22 0 0 1 146 84" fill="none" stroke="#B66A00" stroke-width="1.8"/><text x="135" y="126" font-size="7.0" fill="#B66A00" text-anchor="middle" font-weight="bold">COMPOUND</text><text x="135" y="139" font-size="5.8" fill="#272134" text-anchor="middle">R1 then R2, same side</text><rect x="183" y="48" width="84" height="62" rx="3" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.3"/><path d="M182 78 A26 26 0 0 1 208 92 A26 26 0 0 0 234 80" fill="none" stroke="#2E7D32" stroke-width="1.8"/><text x="225" y="126" font-size="7.0" fill="#2E7D32" text-anchor="middle" font-weight="bold">REVERSE</text><text x="225" y="139" font-size="5.8" fill="#272134" text-anchor="middle">S-bend, radii oppose</text><rect x="273" y="48" width="84" height="62" rx="3" fill="#FFFFFF" stroke="#7B2CD9" stroke-width="1.3"/><path d="M282 96 Q306 78 322 76 A20 20 0 0 0 336 88" fill="none" stroke="#7B2CD9" stroke-width="1.8"/><text x="315" y="126" font-size="7.0" fill="#7B2CD9" text-anchor="middle" font-weight="bold">TRANSITION</text><text x="315" y="139" font-size="5.8" fill="#272134" text-anchor="middle">spiral eases into arc</text><rect x="52" y="156" width="256" height="44" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.1"/><text x="180" y="171" font-size="7.0" fill="#272134" text-anchor="middle">Roads and rails bend in a family: simple for one</text><text x="180" y="184" font-size="7.0" fill="#272134" text-anchor="middle">turn, compound/reverse for constrained ground,</text><text x="180" y="197" font-size="7.0" fill="#272134" text-anchor="middle">transition wherever speed meets curvature.</text></svg>