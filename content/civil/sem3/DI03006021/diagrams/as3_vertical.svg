<svg xmlns="http://www.w3.org/2000/svg" width="360" height="258" viewBox="0 0 360 258" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="258" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Vertical curves - summit and valley</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 3.9: crest for sight distance, sag for headlights</text><line x1="40" y1="108" x2="160" y2="78" stroke="#2F5D8A" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="200" y1="78" x2="320" y2="108" stroke="#2F5D8A" stroke-width="1.2" stroke-dasharray="5 4"/><path d="M60 102 Q180 58 300 102" fill="none" stroke="#B66A00" stroke-width="2.0"/><text x="52" y="66" font-size="7.0" fill="#B66A00" text-anchor="start" font-weight="bold">SUMMIT (crest)</text><text x="64" y="122" font-size="6.3" fill="#2F5D8A" text-anchor="start" font-weight="bold">+g1 up</text><text x="262" y="122" font-size="6.3" fill="#2F5D8A" text-anchor="start" font-weight="bold">-g2 down</text><text x="180" y="52" font-size="6.3" fill="#272134" text-anchor="middle">sight distance rules</text><line x1="40" y1="148" x2="160" y2="178" stroke="#2F5D8A" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="200" y1="178" x2="320" y2="148" stroke="#2F5D8A" stroke-width="1.2" stroke-dasharray="5 4"/><path d="M60 154 Q180 200 300 154" fill="none" stroke="#2E7D32" stroke-width="2.0"/><text x="52" y="140" font-size="7.0" fill="#2E7D32" text-anchor="start" font-weight="bold">VALLEY (sag)</text><text x="180" y="214" font-size="6.3" fill="#272134" text-anchor="middle">headlight distance + comfort rule</text><rect x="52" y="224" width="256" height="30" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.1"/><text x="180" y="237" font-size="7.0" fill="#272134" text-anchor="middle">Vertical curves join gradients smoothly - usually</text><text x="180" y="248" font-size="7.0" fill="#272134" text-anchor="middle">parabolic, set by grade levels along its length.</text></svg>