<svg xmlns="http://www.w3.org/2000/svg" width="360" height="268" viewBox="0 0 360 268" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="268" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Elements of a simple circular curve</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 3.5: PC, PT, PI, T, L, long chord, E, M</text><path d="M108 116 A125 125 0 0 1 252 116" fill="none" stroke="#2F5D8A" stroke-width="2.0"/><line x1="180" y1="218" x2="108" y2="116" stroke="#7B2CD9" stroke-width="1.1" stroke-dasharray="5 4"/><line x1="180" y1="218" x2="252" y2="116" stroke="#7B2CD9" stroke-width="1.1" stroke-dasharray="5 4"/><circle cx="180" cy="218" r="3.5" fill="#F3E5F5" stroke="#7B2CD9" stroke-width="1.2"/><text x="190" y="224" font-size="7.5" fill="#7B2CD9" text-anchor="start" font-weight="bold">O</text><text x="126" y="170" font-size="7.5" fill="#7B2CD9" text-anchor="end" font-weight="bold">R</text><line x1="108" y1="116" x2="180" y2="65" stroke="#B66A00" stroke-width="1.7"/><line x1="252" y1="116" x2="180" y2="65" stroke="#B66A00" stroke-width="1.7"/><circle cx="180" cy="65" r="3.5" fill="#FDEBD7" stroke="#B66A00" stroke-width="1.3"/><text x="190" y="60" font-size="6.5" fill="#B66A00" text-anchor="start" font-weight="bold">I - intersection point (PI)</text><text x="136" y="82" font-size="6.5" fill="#B66A00" text-anchor="end" font-weight="bold">tangent length T</text><line x1="108" y1="116" x2="252" y2="116" stroke="#5A5A5A" stroke-width="1.1" stroke-dasharray="6 4"/><text x="128" y="110" font-size="6.3" fill="#272134" text-anchor="middle" font-weight="bold">long chord</text><line x1="180" y1="116" x2="180" y2="94" stroke="#BD2543" stroke-width="1.6"/><text x="187" y="108" font-size="7.0" fill="#BD2543" text-anchor="start" font-weight="bold">M</text><line x1="180" y1="65" x2="180" y2="93" stroke="#BD2543" stroke-width="1.3" stroke-dasharray="3 3"/><text x="187" y="82" font-size="7.0" fill="#BD2543" text-anchor="start" font-weight="bold">E</text><circle cx="108" cy="116" r="3.5" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.2"/><circle cx="252" cy="116" r="3.5" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.2"/><text x="102" y="112" font-size="6.8" fill="#2F5D8A" text-anchor="end" font-weight="bold">T1 (PC)</text><text x="258" y="112" font-size="6.8" fill="#2F5D8A" text-anchor="start" font-weight="bold">T2 (PT)</text><path d="M152 190 A42 42 0 0 1 208 190" fill="none" stroke="#7B2CD9" stroke-width="1.2"/><text x="222" y="186" font-size="6.2" fill="#7B2CD9" text-anchor="start" font-weight="bold">deflection angle</text><text x="222" y="197" font-size="6.2" fill="#7B2CD9" text-anchor="start" font-weight="bold">(at centre O)</text><text x="96" y="142" font-size="6.5" fill="#2F5D8A" text-anchor="end" font-weight="bold">curve length L</text><rect x="46" y="232" width="268" height="30" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.1"/><text x="180" y="245" font-size="7.0" fill="#272134" text-anchor="middle">Everything hangs on R and the deflection angle:</text><text x="180" y="256" font-size="7.0" fill="#272134" text-anchor="middle">T, L, long chord, E and M are five lookups away.</text></svg>