<svg xmlns="http://www.w3.org/2000/svg" width="360" height="182" viewBox="0 0 360 182" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="182" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Road development in India - timeline</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 1.1: Nagpur to Bharatmala</text><line x1="24" y1="92" x2="336" y2="92" stroke="#5A5A5A" stroke-width="1.2"/><circle cx="30" cy="92" r="5" fill="#FFFFFF" stroke="#B66A00" stroke-width="1.8"/><text x="30" y="76" font-size="6.8" fill="#B66A00" text-anchor="middle" font-weight="bold">ANCIENT</text><text x="30" y="112" font-size="6.2" fill="#272134" text-anchor="middle">Grand Trunk Rd,</text><text x="30" y="123" font-size="6.2" fill="#272134" text-anchor="middle">trade routes</text><circle cx="102" cy="92" r="5" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.8"/><text x="102" y="76" font-size="6.8" fill="#2F5D8A" text-anchor="middle" font-weight="bold">BRITISH ERA</text><text x="102" y="112" font-size="6.2" fill="#272134" text-anchor="middle">PWD (1854), rail-</text><text x="102" y="123" font-size="6.2" fill="#272134" text-anchor="middle">roads as feeders</text><circle cx="174" cy="92" r="5" fill="#FFFFFF" stroke="#BD2543" stroke-width="1.8"/><text x="174" y="76" font-size="6.8" fill="#BD2543" text-anchor="middle" font-weight="bold">NAGPUR PLAN</text><text x="174" y="112" font-size="6.2" fill="#272134" text-anchor="middle">1943: first 20-yr</text><text x="174" y="123" font-size="6.2" fill="#272134" text-anchor="middle">road plan; IRC 1934</text><circle cx="246" cy="92" r="5" fill="#FFFFFF" stroke="#7B2CD9" stroke-width="1.8"/><text x="246" y="76" font-size="6.8" fill="#7B2CD9" text-anchor="middle" font-weight="bold">POST-1947</text><text x="246" y="112" font-size="6.2" fill="#272134" text-anchor="middle">Bombay + Lucknow</text><text x="246" y="123" font-size="6.2" fill="#272134" text-anchor="middle">plans; NHAI, CRRI</text><circle cx="318" cy="92" r="5" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.8"/><text x="318" y="76" font-size="6.8" fill="#2E7D32" text-anchor="middle" font-weight="bold">2000 -> TODAY</text><text x="318" y="112" font-size="6.2" fill="#272134" text-anchor="middle">NHDP, PMGSY,</text><text x="318" y="123" font-size="6.2" fill="#272134" text-anchor="middle">Bharatmala, expressways</text><rect x="52" y="140" width="256" height="34" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.1"/><text x="180" y="153" font-size="7.5" fill="#272134" text-anchor="middle">From bullock tracks to 66+ lakh km of roads:</text><text x="180" y="166" font-size="7.5" fill="#272134" text-anchor="middle">each plan raised the network's ambition.</text></svg>