<svg xmlns="http://www.w3.org/2000/svg" width="360" height="194" viewBox="0 0 360 194" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="194" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Classification of roads in India</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 1.4: NH, SH, MDR, ODR, VR by utility</text><rect x="105" y="44" width="150" height="22" rx="3" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.5"/><text x="180" y="59" font-size="7.5" fill="#2F5D8A" text-anchor="middle" font-weight="bold">ROAD CLASSIFICATION (INDIA)</text><line x1="180" y1="66" x2="180" y2="80" stroke="#5A5A5A" stroke-width="1.0"/><line x1="40" y1="80" x2="320" y2="80" stroke="#5A5A5A" stroke-width="1.0"/><line x1="40" y1="80" x2="40" y2="88" stroke="#5A5A5A" stroke-width="1.0"/><rect x="8" y="88" width="64" height="24" rx="3" fill="#FFFFFF" stroke="#BD2543" stroke-width="1.3"/><text x="40" y="103" font-size="8" fill="#BD2543" text-anchor="middle" font-weight="bold">NH</text><text x="40" y="126" font-size="5.8" fill="#272134" text-anchor="middle">National Highways</text><text x="40" y="137" font-size="5.8" fill="#5A5A5A" text-anchor="middle">Centre / NHAI</text><line x1="110" y1="80" x2="110" y2="88" stroke="#5A5A5A" stroke-width="1.0"/><rect x="78" y="88" width="64" height="24" rx="3" fill="#FFFFFF" stroke="#B66A00" stroke-width="1.3"/><text x="110" y="103" font-size="8" fill="#B66A00" text-anchor="middle" font-weight="bold">SH</text><text x="110" y="126" font-size="5.8" fill="#272134" text-anchor="middle">State Highways</text><text x="110" y="137" font-size="5.8" fill="#5A5A5A" text-anchor="middle">State Govt</text><line x1="180" y1="80" x2="180" y2="88" stroke="#5A5A5A" stroke-width="1.0"/><rect x="148" y="88" width="64" height="24" rx="3" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.3"/><text x="180" y="103" font-size="8" fill="#2F5D8A" text-anchor="middle" font-weight="bold">MDR</text><text x="180" y="126" font-size="5.8" fill="#272134" text-anchor="middle">Major District Roads</text><text x="180" y="137" font-size="5.8" fill="#5A5A5A" text-anchor="middle">State / district</text><line x1="250" y1="80" x2="250" y2="88" stroke="#5A5A5A" stroke-width="1.0"/><rect x="218" y="88" width="64" height="24" rx="3" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.3"/><text x="250" y="103" font-size="8" fill="#2E7D32" text-anchor="middle" font-weight="bold">ODR</text><text x="250" y="126" font-size="5.8" fill="#272134" text-anchor="middle">Other District Roads</text><text x="250" y="137" font-size="5.8" fill="#5A5A5A" text-anchor="middle">District bodies</text><line x1="320" y1="80" x2="320" y2="88" stroke="#5A5A5A" stroke-width="1.0"/><rect x="288" y="88" width="64" height="24" rx="3" fill="#FFFFFF" stroke="#7B2CD9" stroke-width="1.3"/><text x="320" y="103" font-size="8" fill="#7B2CD9" text-anchor="middle" font-weight="bold">VR</text><text x="320" y="126" font-size="5.8" fill="#272134" text-anchor="middle">Village Roads</text><text x="320" y="137" font-size="5.8" fill="#5A5A5A" text-anchor="middle">Panchayat / PMGSY</text><rect x="52" y="152" width="256" height="34" rx="3" fill="#FDEBD7" stroke="#B66A00" stroke-width="1.1"/><text x="180" y="165" font-size="7.5" fill="#272134" text-anchor="middle">Importance falls NH to VR, but traffic logic inverts:</text><text x="180" y="178" font-size="7.5" fill="#272134" text-anchor="middle">NH ~2% of length carries ~40% of traffic (N1.3).</text></svg>