<svg xmlns="http://www.w3.org/2000/svg" width="360" height="212" viewBox="0 0 360 212" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="212" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Flexible versus rigid pavement - structure</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 2.9: how each pavement carries the wheel</text><rect x="28" y="66" width="124" height="20" rx="3" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.2"/><text x="90.0" y="80" font-size="6.5" fill="#2F5D8A" text-anchor="middle" font-weight="bold">surface course</text><rect x="28" y="86" width="124" height="20" rx="3" fill="#FDEBD7" stroke="#B66A00" stroke-width="1.2"/><text x="90.0" y="100" font-size="6.5" fill="#B66A00" text-anchor="middle" font-weight="bold">base course</text><rect x="28" y="106" width="124" height="20" rx="3" fill="#FFF3E0" stroke="#B66A00" stroke-width="1.2"/><text x="90.0" y="120" font-size="6.5" fill="#B66A00" text-anchor="middle" font-weight="bold">sub-base</text><rect x="28" y="126" width="124" height="20" rx="3" fill="#E8EAF6" stroke="#7B2CD9" stroke-width="1.2"/><text x="90.0" y="140" font-size="6.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">subgrade</text><text x="90.0" y="46" font-size="7.5" fill="#2F5D8A" text-anchor="middle" font-weight="bold">FLEXIBLE (bituminous)</text><text x="270.0" y="46" font-size="7.5" fill="#BD2543" text-anchor="middle" font-weight="bold">RIGID (concrete)</text><rect x="208" y="66" width="124" height="26" rx="3" fill="#FCE4EC" stroke="#BD2543" stroke-width="1.4"/><text x="270.0" y="83" font-size="6.5" fill="#BD2543" text-anchor="middle" font-weight="bold">PCC slab</text><rect x="208" y="92" width="124" height="20" rx="3" fill="#FDEBD7" stroke="#B66A00" stroke-width="1.2"/><text x="270.0" y="106" font-size="6.5" fill="#B66A00" text-anchor="middle" font-weight="bold">dry lean concrete base</text><rect x="208" y="112" width="124" height="20" rx="3" fill="#E8EAF6" stroke="#7B2CD9" stroke-width="1.2"/><text x="270.0" y="126" font-size="6.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">subgrade</text><rect x="208" y="132" width="124" height="14" rx="3" fill="#FFFFFF" stroke="#5A5A5A" stroke-width="0.8"/><text x="270.0" y="142" font-size="5.8" fill="#5A5A5A" text-anchor="middle">(granular sub-base below)</text><path d="M90 50 L90 63" fill="none" stroke="#BD2543" stroke-width="1.8" marker-end="url(#ahR)"/><path d="M270 50 L270 63" fill="none" stroke="#BD2543" stroke-width="1.8" marker-end="url(#ahR)"/><rect x="48" y="160" width="264" height="44" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.1"/><text x="180" y="174" font-size="7.3" fill="#272134" text-anchor="middle">Wheel load (red arrows) spreads layer-by-layer in</text><text x="180" y="187" font-size="7.3" fill="#272134" text-anchor="middle">flexible; the rigid slab bridges it by beam action -</text><text x="180" y="200" font-size="7.3" fill="#272134" text-anchor="middle">stiffer, costlier first, cheaper to keep (Card 2.9).</text></svg>