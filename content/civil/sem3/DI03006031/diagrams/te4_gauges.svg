<svg xmlns="http://www.w3.org/2000/svg" width="360" height="236" viewBox="0 0 360 236" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="236" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Railway gauges in India</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 4.5: BG, MG, NG and standard gauge</text><rect x="30" y="58" width="200.0" height="16" rx="3" fill="#FFFFFF" stroke="#BD2543" stroke-width="1.5"/><rect x="30" y="58" width="6" height="16" rx="3" fill="#BD2543" stroke="#BD2543" stroke-width="1.0"/><rect x="224.0" y="58" width="6" height="16" rx="3" fill="#BD2543" stroke="#BD2543" stroke-width="1.0"/><text x="34" y="53" font-size="7" fill="#BD2543" text-anchor="start" font-weight="bold">BROAD GAUGE (BG)</text><text x="238" y="70" font-size="6.2" fill="#272134" text-anchor="start">1676 mm - trunk network</text><rect x="30" y="94" width="119.33174224343675" height="16" rx="3" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5"/><rect x="30" y="94" width="6" height="16" rx="3" fill="#2F5D8A" stroke="#2F5D8A" stroke-width="1.0"/><rect x="143.33174224343674" y="94" width="6" height="16" rx="3" fill="#2F5D8A" stroke="#2F5D8A" stroke-width="1.0"/><text x="34" y="89" font-size="7" fill="#2F5D8A" text-anchor="start" font-weight="bold">METRE GAUGE (MG)</text><text x="238" y="106" font-size="6.2" fill="#272134" text-anchor="start">1000 mm - converting to BG</text><rect x="30" y="130" width="90.9307875894988" height="16" rx="3" fill="#FFFFFF" stroke="#B66A00" stroke-width="1.5"/><rect x="30" y="130" width="6" height="16" rx="3" fill="#B66A00" stroke="#B66A00" stroke-width="1.0"/><rect x="114.9307875894988" y="130" width="6" height="16" rx="3" fill="#B66A00" stroke="#B66A00" stroke-width="1.0"/><text x="34" y="125" font-size="7" fill="#B66A00" text-anchor="start" font-weight="bold">NARROW GAUGE (NG)</text><text x="238" y="142" font-size="6.2" fill="#272134" text-anchor="start">762 / 610 mm - hill lines</text><rect x="30" y="166" width="171.24105011933176" height="16" rx="3" fill="#FFFFFF" stroke="#7B2CD9" stroke-width="1.5"/><rect x="30" y="166" width="6" height="16" rx="3" fill="#7B2CD9" stroke="#7B2CD9" stroke-width="1.0"/><rect x="195.24105011933176" y="166" width="6" height="16" rx="3" fill="#7B2CD9" stroke="#7B2CD9" stroke-width="1.0"/><text x="34" y="161" font-size="7" fill="#7B2CD9" text-anchor="start" font-weight="bold">STANDARD GAUGE (SG)</text><text x="238" y="178" font-size="6.2" fill="#272134" text-anchor="start">1435 mm - metros, bullet train</text><rect x="48" y="196" width="264" height="32" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.1"/><text x="180" y="209" font-size="7.5" fill="#272134" text-anchor="middle">Gauge = clear distance between inner faces</text><text x="180" y="222" font-size="7.5" fill="#272134" text-anchor="middle">of the two rails - wider gauge, heavier trains.</text></svg>