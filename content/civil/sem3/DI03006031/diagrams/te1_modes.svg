<svg xmlns="http://www.w3.org/2000/svg" width="360" height="192" viewBox="0 0 360 192" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="192" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Four modes of transportation</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 1.3: road, rail, water, air compared</text><rect x="110" y="44" width="140" height="22" rx="3" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.5"/><text x="180" y="59" font-size="8.5" fill="#2F5D8A" text-anchor="middle" font-weight="bold">TRANSPORT MODES</text><line x1="180" y1="66" x2="180" y2="80" stroke="#5A5A5A" stroke-width="1.0"/><line x1="48" y1="80" x2="312" y2="80" stroke="#5A5A5A" stroke-width="1.0"/><line x1="48" y1="80" x2="48" y2="88" stroke="#5A5A5A" stroke-width="1.0"/><rect x="8" y="88" width="80" height="24" rx="3" fill="#FFFFFF" stroke="#B66A00" stroke-width="1.3"/><text x="48" y="103" font-size="7.5" fill="#B66A00" text-anchor="middle" font-weight="bold">ROAD</text><text x="48" y="126" font-size="6.3" fill="#272134" text-anchor="middle">door-to-door,</text><text x="48" y="137" font-size="6.3" fill="#272134" text-anchor="middle">any load, short-medium</text><line x1="136" y1="80" x2="136" y2="88" stroke="#5A5A5A" stroke-width="1.0"/><rect x="96" y="88" width="80" height="24" rx="3" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.3"/><text x="136" y="103" font-size="7.5" fill="#2F5D8A" text-anchor="middle" font-weight="bold">RAIL</text><text x="136" y="126" font-size="6.3" fill="#272134" text-anchor="middle">bulk + passengers,</text><text x="136" y="137" font-size="6.3" fill="#272134" text-anchor="middle">medium-long, cheap/t-km</text><line x1="224" y1="80" x2="224" y2="88" stroke="#5A5A5A" stroke-width="1.0"/><rect x="184" y="88" width="80" height="24" rx="3" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.3"/><text x="224" y="103" font-size="7.5" fill="#2E7D32" text-anchor="middle" font-weight="bold">WATER</text><text x="224" y="126" font-size="6.3" fill="#272134" text-anchor="middle">heaviest bulk,</text><text x="224" y="137" font-size="6.3" fill="#272134" text-anchor="middle">cheapest, slowest</text><line x1="312" y1="80" x2="312" y2="88" stroke="#5A5A5A" stroke-width="1.0"/><rect x="272" y="88" width="80" height="24" rx="3" fill="#FFFFFF" stroke="#7B2CD9" stroke-width="1.3"/><text x="312" y="103" font-size="7.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">AIR</text><text x="312" y="126" font-size="6.3" fill="#272134" text-anchor="middle">fastest, costliest,</text><text x="312" y="137" font-size="6.3" fill="#272134" text-anchor="middle">urgent, light, perishable</text><rect x="52" y="152" width="256" height="32" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.1"/><text x="180" y="165" font-size="7.5" fill="#272134" text-anchor="middle">No mode wins everywhere: right mode =</text><text x="180" y="178" font-size="7.5" fill="#272134" text-anchor="middle">distance x load x urgency (N1.1 prices it).</text></svg>