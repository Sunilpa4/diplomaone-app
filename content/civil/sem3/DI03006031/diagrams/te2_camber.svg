<svg xmlns="http://www.w3.org/2000/svg" width="360" height="216" viewBox="0 0 360 216" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="216" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Types of camber</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 2.3: parabolic, straight, composite</text><rect x="18" y="64" width="100" height="56" rx="3" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.2"/><line x1="26" y1="108" x2="110" y2="108" stroke="#5A5A5A" stroke-width="1.4"/><path d="M28 106 Q68 84 108 106" fill="none" stroke="#2F5D8A" stroke-width="2.0"/><line x1="68" y1="84" x2="68" y2="112" stroke="#2F5D8A" stroke-width="0.7" stroke-dasharray="3 3"/><text x="68" y="138" font-size="7" fill="#2F5D8A" text-anchor="middle" font-weight="bold">PARABOLIC</text><text x="68" y="152" font-size="6.2" fill="#272134" text-anchor="middle">smooth crown,</text><text x="68" y="163" font-size="6.2" fill="#272134" text-anchor="middle">heavy rain, flexible pvmt</text><rect x="130" y="64" width="100" height="56" rx="3" fill="#FFFFFF" stroke="#B66A00" stroke-width="1.2"/><line x1="138" y1="108" x2="222" y2="108" stroke="#5A5A5A" stroke-width="1.4"/><path d="M140 106 L180 88 L220 106" fill="none" stroke="#B66A00" stroke-width="2.0"/><line x1="180" y1="84" x2="180" y2="112" stroke="#B66A00" stroke-width="0.7" stroke-dasharray="3 3"/><text x="180" y="138" font-size="7" fill="#B66A00" text-anchor="middle" font-weight="bold">STRAIGHT-LINE</text><text x="180" y="152" font-size="6.2" fill="#272134" text-anchor="middle">two straight slopes,</text><text x="180" y="163" font-size="6.2" fill="#272134" text-anchor="middle">easy to lay, rigid pvmt</text><rect x="242" y="64" width="100" height="56" rx="3" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.2"/><line x1="250" y1="108" x2="334" y2="108" stroke="#5A5A5A" stroke-width="1.4"/><path d="M252 106 Q274 92 292 92 Q310 92 332 106" fill="none" stroke="#2E7D32" stroke-width="2.0"/><line x1="292" y1="84" x2="292" y2="112" stroke="#2E7D32" stroke-width="0.7" stroke-dasharray="3 3"/><text x="292" y="138" font-size="7" fill="#2E7D32" text-anchor="middle" font-weight="bold">COMPOSITE (BARREL)</text><text x="292" y="152" font-size="6.2" fill="#272134" text-anchor="middle">flat centre, steep</text><text x="292" y="163" font-size="6.2" fill="#272134" text-anchor="middle">edges - best of both</text><text x="180" y="52" font-size="6.8" fill="#5A5A5A" text-anchor="middle">camber = cross slope that sheds rain to the edges (1 in 33 to 1 in 60 by surface type)</text><rect x="58" y="178" width="244" height="30" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.1"/><text x="180" y="191" font-size="7.5" fill="#272134" text-anchor="middle">Too flat ponds and strips; too steep pulls</text><text x="180" y="204" font-size="7.5" fill="#272134" text-anchor="middle">vehicles sideways - IRC fixes it per surface.</text></svg>