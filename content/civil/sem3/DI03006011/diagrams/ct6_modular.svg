<svg xmlns="http://www.w3.org/2000/svg" width="360" height="196" viewBox="0 0 360 196" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="196" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Modular / prefabricated construction - flow</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 6.5: build in factory, assemble on site</text><rect x="10" y="84" width="72" height="40" rx="3" fill="#F3E5F5" stroke="#7B2CD9" stroke-width="1.3"/><text x="46" y="100" font-size="6.6" fill="#7B2CD9" text-anchor="middle" font-weight="bold">FACTORY</text><text x="46" y="113" font-size="6.0" fill="#272134" text-anchor="middle">modules built indoors:</text><text x="46" y="138" font-size="6.2" fill="#5A5A5A" text-anchor="middle">structure + services fitted</text><rect x="100" y="84" width="72" height="40" rx="3" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.3"/><text x="136" y="100" font-size="6.6" fill="#2F5D8A" text-anchor="middle" font-weight="bold">TRANSPORT</text><text x="136" y="113" font-size="6.0" fill="#272134" text-anchor="middle">by road on trailers,</text><text x="136" y="138" font-size="6.2" fill="#5A5A5A" text-anchor="middle">90% finished</text><rect x="190" y="84" width="72" height="40" rx="3" fill="#FDEBD7" stroke="#B66A00" stroke-width="1.3"/><text x="226" y="100" font-size="6.6" fill="#B66A00" text-anchor="middle" font-weight="bold">SITE ASSEMBLY</text><text x="226" y="113" font-size="6.0" fill="#272134" text-anchor="middle">crane sets modules;</text><text x="226" y="138" font-size="6.2" fill="#5A5A5A" text-anchor="middle">stacked and locked</text><rect x="280" y="84" width="72" height="40" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.3"/><text x="316" y="100" font-size="6.6" fill="#2E7D32" text-anchor="middle" font-weight="bold">FINISH</text><text x="316" y="113" font-size="6.0" fill="#272134" text-anchor="middle">joints, facade,</text><text x="316" y="138" font-size="6.2" fill="#5A5A5A" text-anchor="middle">testing, handover</text><path d="M84 104 L98 104" fill="none" stroke="#272134" stroke-width="1.6" marker-end="url(#ah)"/><path d="M174 104 L188 104" fill="none" stroke="#272134" stroke-width="1.6" marker-end="url(#ah)"/><path d="M264 104 L278 104" fill="none" stroke="#272134" stroke-width="1.6" marker-end="url(#ah)"/><rect x="200" y="44" width="26" height="16" rx="3" fill="#FDEBD7" stroke="#B66A00" stroke-width="1.2"/><rect x="200" y="62" width="26" height="16" rx="3" fill="#FDEBD7" stroke="#B66A00" stroke-width="1.2"/><line x1="213" y1="44" x2="213" y2="37" stroke="#B66A00" stroke-width="1.3"/><text x="230" y="58" font-size="6.2" fill="#B66A00" text-anchor="start">crane lift</text><rect x="48" y="156" width="264" height="32" rx="3" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.1"/><text x="180" y="169" font-size="7.5" fill="#272134" text-anchor="middle">Factory and foundation run in PARALLEL -</text><text x="180" y="182" font-size="7.5" fill="#272134" text-anchor="middle">that overlap is where the saved months live (N6.2).</text></svg>