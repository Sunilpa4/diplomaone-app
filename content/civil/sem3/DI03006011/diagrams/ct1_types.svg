<svg xmlns="http://www.w3.org/2000/svg" width="360" height="208" viewBox="0 0 360 208" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="208" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Classification of civil engineering structures</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 1.1: classify by use, by material, by structural system</text><rect x="120" y="46" width="120" height="22" rx="3" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.5"/><text x="180" y="61" font-size="9" fill="#2F5D8A" text-anchor="middle" font-weight="bold">CIVIL STRUCTURES</text><line x1="180" y1="68" x2="68" y2="84" stroke="#272134" stroke-width="1.0"/><rect x="28" y="84" width="80" height="18" rx="3" fill="white" stroke="#2E7D32" stroke-width="1.2"/><text x="68" y="96" font-size="7.5" fill="#2E7D32" text-anchor="middle" font-weight="bold">BY USE</text><text x="68" y="116" font-size="7" fill="#272134" text-anchor="middle">residential</text><text x="68" y="129" font-size="7" fill="#272134" text-anchor="middle">industrial</text><text x="68" y="142" font-size="7" fill="#272134" text-anchor="middle">water, transport</text><line x1="180" y1="68" x2="180" y2="84" stroke="#272134" stroke-width="1.0"/><rect x="140" y="84" width="80" height="18" rx="3" fill="white" stroke="#B66A00" stroke-width="1.2"/><text x="180" y="96" font-size="7.5" fill="#B66A00" text-anchor="middle" font-weight="bold">BY MATERIAL</text><text x="180" y="116" font-size="7" fill="#272134" text-anchor="middle">masonry / timber</text><text x="180" y="129" font-size="7" fill="#272134" text-anchor="middle">RCC / steel</text><text x="180" y="142" font-size="7" fill="#272134" text-anchor="middle">composite</text><line x1="180" y1="68" x2="292" y2="84" stroke="#272134" stroke-width="1.0"/><rect x="252" y="84" width="80" height="18" rx="3" fill="white" stroke="#7B2CD9" stroke-width="1.2"/><text x="292" y="96" font-size="7.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">BY SYSTEM</text><text x="292" y="116" font-size="7" fill="#272134" text-anchor="middle">load bearing</text><text x="292" y="129" font-size="7" fill="#272134" text-anchor="middle">framed</text><text x="292" y="142" font-size="7" fill="#272134" text-anchor="middle">shell / truss</text><rect x="52" y="168" width="256" height="34" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.1"/><text x="180" y="182" font-size="7.5" fill="#272134" text-anchor="middle" font-weight="bold">One building answers all three classifications at once -</text><text x="180" y="195" font-size="7.5" fill="#272134" text-anchor="middle">e.g. a framed RCC residential structure.</text></svg>