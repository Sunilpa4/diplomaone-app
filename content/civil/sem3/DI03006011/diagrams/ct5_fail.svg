<svg xmlns="http://www.w3.org/2000/svg" width="360" height="196" viewBox="0 0 360 196" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="196" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Why structures fail - four cause families</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 5.1: design, materials, workmanship, environment</text><rect x="78" y="44" width="204" height="22" rx="3" fill="#FCE4EC" stroke="#BD2543" stroke-width="1.5"/><text x="180" y="59" font-size="7.5" fill="#BD2543" text-anchor="middle" font-weight="bold">STRUCTURE FAILS / DETERIORATES</text><line x1="180" y1="66" x2="180" y2="84" stroke="#5A5A5A" stroke-width="1.0"/><line x1="48" y1="84" x2="312" y2="84" stroke="#5A5A5A" stroke-width="1.0"/><line x1="48" y1="84" x2="48" y2="92" stroke="#5A5A5A" stroke-width="1.0"/><rect x="8" y="92" width="80" height="24" rx="3" fill="#FFFFFF" stroke="#BD2543" stroke-width="1.3"/><text x="48" y="107" font-size="6.3" fill="#BD2543" text-anchor="middle" font-weight="bold">DESIGN</text><text x="48" y="130" font-size="6.5" fill="#272134" text-anchor="middle">under-design,</text><text x="48" y="141" font-size="6.5" fill="#272134" text-anchor="middle">no soil study</text><line x1="134" y1="84" x2="134" y2="92" stroke="#5A5A5A" stroke-width="1.0"/><rect x="94" y="92" width="80" height="24" rx="3" fill="#FFFFFF" stroke="#B66A00" stroke-width="1.3"/><text x="134" y="107" font-size="6.3" fill="#B66A00" text-anchor="middle" font-weight="bold">MATERIALS</text><text x="134" y="130" font-size="6.5" fill="#272134" text-anchor="middle">poor cement,</text><text x="134" y="141" font-size="6.5" fill="#272134" text-anchor="middle">salty water/sand</text><line x1="222" y1="84" x2="222" y2="92" stroke="#5A5A5A" stroke-width="1.0"/><rect x="182" y="92" width="80" height="24" rx="3" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.3"/><text x="222" y="107" font-size="6.3" fill="#2F5D8A" text-anchor="middle" font-weight="bold">WORKMANSHIP</text><text x="222" y="130" font-size="6.5" fill="#272134" text-anchor="middle">bad curing,</text><text x="222" y="141" font-size="6.5" fill="#272134" text-anchor="middle">cover, joints</text><line x1="308" y1="84" x2="308" y2="92" stroke="#5A5A5A" stroke-width="1.0"/><rect x="268" y="92" width="80" height="24" rx="3" fill="#FFFFFF" stroke="#7B2CD9" stroke-width="1.3"/><text x="308" y="107" font-size="6.3" fill="#7B2CD9" text-anchor="middle" font-weight="bold">ENVIRON. + USE</text><text x="308" y="130" font-size="6.5" fill="#272134" text-anchor="middle">damp, overload,</text><text x="308" y="141" font-size="6.5" fill="#272134" text-anchor="middle">no maintenance</text><rect x="52" y="156" width="256" height="32" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.1"/><text x="180" y="169" font-size="7.5" fill="#272134" text-anchor="middle">Most failures are born before occupation -</text><text x="180" y="182" font-size="7.5" fill="#272134" text-anchor="middle">maintenance fights the last two columns daily.</text></svg>