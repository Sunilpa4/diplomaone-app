<svg xmlns="http://www.w3.org/2000/svg" width="360" height="198" viewBox="0 0 360 198" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="198" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Concrete batching plant - flow</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 4.6: weigh, mix, haul, place</text><rect x="8" y="88" width="74" height="38" rx="3" fill="#FDEBD7" stroke="#B66A00" stroke-width="1.3"/><text x="45" y="104" font-size="6.8" fill="#B66A00" text-anchor="middle" font-weight="bold">AGGREGATE BINS</text><text x="45" y="116" font-size="6.2" fill="#272134" text-anchor="middle">graded stockpiles</text><text x="45" y="140" font-size="6.2" fill="#5A5A5A" text-anchor="middle">weighed by gate/belt</text><rect x="98" y="88" width="74" height="38" rx="3" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.3"/><text x="135" y="104" font-size="6.8" fill="#2F5D8A" text-anchor="middle" font-weight="bold">WEIGHING</text><text x="135" y="116" font-size="6.2" fill="#272134" text-anchor="middle">belt weigher +</text><text x="135" y="140" font-size="6.2" fill="#5A5A5A" text-anchor="middle">conveyor to mixer</text><rect x="188" y="88" width="74" height="38" rx="3" fill="#F3E5F5" stroke="#7B2CD9" stroke-width="1.3"/><text x="225" y="104" font-size="6.8" fill="#7B2CD9" text-anchor="middle" font-weight="bold">MIXER</text><text x="225" y="116" font-size="6.2" fill="#272134" text-anchor="middle">pan / twin-shaft;</text><text x="225" y="140" font-size="6.2" fill="#5A5A5A" text-anchor="middle">cement silo + water</text><rect x="278" y="88" width="74" height="38" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.3"/><text x="315" y="104" font-size="6.8" fill="#2E7D32" text-anchor="middle" font-weight="bold">TRANSIT MIXER</text><text x="315" y="116" font-size="6.2" fill="#272134" text-anchor="middle">to site, then pump</text><text x="315" y="140" font-size="6.2" fill="#5A5A5A" text-anchor="middle">or crane skip</text><path d="M84 107 L96 107" fill="none" stroke="#272134" stroke-width="1.6" marker-end="url(#ah)"/><path d="M174 107 L186 107" fill="none" stroke="#272134" stroke-width="1.6" marker-end="url(#ah)"/><path d="M264 107 L276 107" fill="none" stroke="#272134" stroke-width="1.6" marker-end="url(#ah)"/><rect x="204" y="46" width="24" height="26" rx="3" fill="#F3E5F5" stroke="#7B2CD9" stroke-width="1.2"/><path d="M204 72 L216 84 L228 72 Z" fill="#F3E5F5" stroke="#7B2CD9" stroke-width="1.2"/><text x="216" y="40" font-size="6.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">cement silo</text><text x="45" y="78" font-size="6.2" fill="#5A5A5A" text-anchor="middle">20/30/40 mm + sand</text><rect x="58" y="158" width="244" height="32" rx="3" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.1"/><text x="180" y="171" font-size="7.5" fill="#272134" text-anchor="middle">Batching plant = concrete made by weight, not by</text><text x="180" y="184" font-size="7.5" fill="#272134" text-anchor="middle">shovel - the jump from site mixer to RMC quality.</text></svg>