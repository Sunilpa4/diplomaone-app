ries ZERO force</text><rect x="70" y="168" width="220" height="44" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.1"/><text x="180" y="183" font-size="7.0" fill="#272134" text-anchor="middle">Spot zero-force members by eye before</text><text x="180" y="197" font-size="7.0" fill="#272134" text-anchor="middle">calculating - they shrink every joint (N6.1: FE).</text></svg>