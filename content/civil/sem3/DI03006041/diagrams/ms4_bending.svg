<svg xmlns="http://www.w3.org/2000/svg" width="360" height="300" viewBox="0 0 360 300" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="300" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Bending stress distribution</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 4.1: linear from the neutral axis, zero on it</text><path d="M60 78 Q180 108 300 78 L300 96 Q180 126 60 96 Z" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.5"/><path d="M60 87 Q180 117 300 87" fill="none" stroke="#B66A00" stroke-width="1.2" stroke-dasharray="5 4"/><text x="180" y="64" font-size="6.5" fill="#272134" text-anchor="middle" font-weight="bold">sagging beam: fibres stretch below, squeeze above</text><text x="310" y="92" font-size="6.8" fill="#B66A00" text-anchor="start" font-weight="bold">NA</text><rect x="84" y="148" width="40" height="84" rx="3" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5"/><line x1="76" y1="190" x2="132" y2="190" stroke="#B66A00" stroke-width="1.4" stroke-dasharray="5 4"/><path d="M150 148 L196 190 L150 232" fill="none" stroke="#BD2543" stroke-width="1.6"/><line x1="150" y1="148" x2="150" y2="232" stroke="#BD2543" stroke-width="1.0"/><text x="172" y="140" font-size="6.3" fill="#BD2543" text-anchor="middle" font-weight="bold">stress varies</text><text x="172" y="251" font-size="6.3" fill="#BD2543" text-anchor="middle" font-weight="bold">linearly: zero at NA</text><text x="104" y="244" font-size="6.3" fill="#2F5D8A" text-anchor="middle" font-weight="bold">section</text><text x="240" y="182" font-size="6.5" fill="#BD2543" text-anchor="start" font-weight="bold">compression</text><text x="240" y="194" font-size="6.0" fill="#272134" text-anchor="start">(top, sagging)</text><text x="240" y="210" font-size="6.5" fill="#BD2543" text-anchor="start" font-weight="bold">tension (bottom)</text><rect x="52" y="262" width="256" height="32" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.1"/><text x="180" y="275" font-size="7.0" fill="#272134" text-anchor="middle">sigma = M y / I : farthest fibre works hardest -</text><text x="180" y="288" font-size="7.0" fill="#272134" text-anchor="middle">why beams are deep, not wide (Card 4.1).</text></svg>