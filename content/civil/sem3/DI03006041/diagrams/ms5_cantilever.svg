<svg xmlns="http://www.w3.org/2000/svg" width="360" height="200" viewBox="0 0 360 200" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="200" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Cantilever slope and deflection - standard cases</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 5.3: end point load and full UDL (no derivations)</text><path d="M156 44 L156 60" fill="none" stroke="#BD2543" stroke-width="1.7" marker-end="url(#ah)"/><text x="95" y="116" font-size="6.5" fill="#2F5D8A" text-anchor="middle" font-weight="bold">point load P at free end</text><text x="95" y="133" font-size="6.8" fill="#272134" text-anchor="middle" font-weight="bold">slope_max = PL^2/(2EI)</text><text x="95" y="146" font-size="6.8" fill="#272134" text-anchor="middle" font-weight="bold">defl_max = PL^3/(3EI) at tip</text><path d="M232 46 L232 58" fill="none" stroke="#BD2543" stroke-width="1.3" marker-end="url(#ah)"/><path d="M246 46 L246 58" fill="none" stroke="#BD2543" stroke-width="1.3" marker-end="url(#ah)"/><path d="M260 46 L260 58" fill="none" stroke="#BD2543" stroke-width="1.3" marker-end="url(#ah)"/><path d="M274 46 L274 58" fill="none" stroke="#BD2543" stroke-width="1.3" marker-end="url(#ah)"/><path d="M288 46 L288 58" fill="none" stroke="#BD2543" stroke-width="1.3" marker-end="url(#ah)"/><path d="M302 46 L302 58" fill="none" stroke="#BD2543" stroke-width="1.3" marker-end="url(#ah)"/><text x="260" y="116" font-size="6.5" fill="#2F5D8A" text-anchor="middle" font-weight="bold">UDL w over whole span</text><text x="260" y="133" font-size="6.8" fill="#272134" text-anchor="middle" font-weight="bold">slope_max = wL^3/(6EI)</text><text x="260" y="146" font-size="6.8" fill="#272134" text-anchor="middle" font-weight="bold">defl_max = wL^4/(8EI) at tip</text><rect x="52" y="162" width="256" height="32" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.1"/><text x="180" y="175" font-size="7.0" fill="#272134" text-anchor="middle">Cantilever: maxima live at the free end;</text><text x="180" y="188" font-size="7.0" fill="#272134" text-anchor="middle">the wall has zero slope AND zero deflection.</text></svg>