<svg xmlns="http://www.w3.org/2000/svg" width="360" height="218" viewBox="0 0 360 218" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="218" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Parallel axis theorem - which axis?</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 2.2: centroidal MOI plus the transfer term A d^2</text><rect x="120" y="66" width="110" height="84" rx="3" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.6"/><line x1="104" y1="108" x2="246" y2="108" stroke="#B66A00" stroke-width="1.6" stroke-dasharray="6 4"/><text x="252" y="104" font-size="6.5" fill="#B66A00" text-anchor="start" font-weight="bold">centroidal axis X-X</text><line x1="104" y1="150" x2="246" y2="150" stroke="#7B2CD9" stroke-width="1.6"/><text x="252" y="154" font-size="6.5" fill="#7B2CD9" text-anchor="start" font-weight="bold">reference axis (base)</text><line x1="150" y1="108" x2="150" y2="150" stroke="#BD2543" stroke-width="1.4"/><text x="142" y="132" font-size="7.5" fill="#BD2543" text-anchor="end" 