<svg xmlns="http://www.w3.org/2000/svg" width="360" height="200" viewBox="0 0 360 200" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="200" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Thermal stress - restrained and yielding supports</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 1.5: expansion prevented is stress created</text><rect x="48" y="74" width="10" height="44" rx="3" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.5"/><rect x="168" y="74" width="10" height="44" rx="3" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.5"/><rect x="58" y="90" width="110" height="12" rx="3" fill="#FDEBD7" stroke="#B66A00" stroke-width="1.5"/><text x="113" y="66" font-size="6.8" fill="#272134" text-anchor="middle" font-weight="bold">(a) no room to expand</text><path d="M74 96 L64 96" fill="none" stroke="#BD2543" stroke-width="1.6" marker-end="url(#ah)"/><path d="M152 96 L162 96" fill="none" stroke="#BD2543" stroke-width="1.6" marker-end="url(#ah)"/><text x="113" y="132" font-size="6.2" fill="#BD2543" text-anchor="middle" font-weight="bold">heat it: compressive thermal stress</text><rect x="196" y="74" width="10" height="44" rx="3" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.5"/><rect x="316" y="74" width="10" height="44" rx="3" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.5"/><rect x="206" y="90" width="96" height="12" rx="3" fill="#FDEBD7" stroke="#B66A00" stroke-width="1.5"/><line x1="302" y1="84" x2="316" y2="84" stroke="#7B2CD9" stroke-width="1.3"/><text x="309" y="76" font-size="6.3" fill="#7B2CD9" text-anchor="middle" font-weight="bold">gap</text><text x="261" y="64" font-size="6.8" fill="#272134" text-anchor="middle" font-weight="bold">(b) gap allows part expansion</text><text x="261" y="132" font-size="6.2" fill="#272134" text-anchor="middle" font-weight="bold">only the prevented part stresses the bar</text><rect x="56" y="150" width="248" height="44" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.1"/><text x="180" y="165" font-size="7.0" fill="#272134" text-anchor="middle">Free expansion = alpha x deltaT x L ; prevented part</text><text x="180" y="178" font-size="7.0" fill="#272134" text-anchor="middle">becomes strain: stress = E x (prevented/length) (N1.3).</text><text x="180" y="189" font-size="6.8" fill="#272134" text-anchor="middle">Cooling reverses the sign: tension instead.</text></svg>