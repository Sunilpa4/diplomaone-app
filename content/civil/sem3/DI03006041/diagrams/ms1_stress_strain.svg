<svg xmlns="http://www.w3.org/2000/svg" width="360" height="260" viewBox="0 0 360 260" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="260" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Stress-strain curve - mild steel in tension</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 1.1: limit points every viva asks about</text><line x1="56" y1="196" x2="336" y2="196" stroke="#272134" stroke-width="1.5"/><line x1="56" y1="196" x2="56" y2="48" stroke="#272134" stroke-width="1.5"/><text x="20" y="110" font-size="7.5" fill="#272134" text-anchor="middle" font-weight="bold">stress</text><text x="300" y="212" font-size="7.5" fill="#272134" text-anchor="end" font-weight="bold">strain</text><path d="M56 196 L118 108 L140 100 L168 100 L226 66 L262 56 L292 84 L306 108" fill="none" stroke="#B66A00" stroke-width="2.0"/><circle cx="118" cy="108" r="3.2" fill="#FDEBD7" stroke="#B66A00" stroke-width="1.2"/><text x="128" y="104" font-size="6.2" fill="#B66A00" text-anchor="start" font-weight="bold">A proportional limit</text><circle cx="150" cy="100" r="3.2" fill="#FDEBD7" stroke="#B66A00" stroke-width="1.2"/><text x="158" y="92" font-size="6.2" fill="#B66A00" text-anchor="start" font-weight="bold">B yield point</text><circle cx="262" cy="56" r="3.2" fill="#FDEBD7" stroke="#B66A00" stroke-width="1.2"/><text x="258" y="48" font-size="6.2" fill="#B66A00" text-anchor="end" font-weight="bold">C ultimate stress</text><circle cx="306" cy="108" r="3.2" fill="#FDEBD7" stroke="#B66A00" stroke-width="1.2"/><text x="300" y="124" font-size="6.2" fill="#B66A00" text-anchor="start" font-weight="bold">D fracture</text><line x1="56" y1="196" x2="118" y2="108" stroke="#2F5D8A" stroke-width="1.0" stroke-dasharray="4 3"/><text x="76" y="170" font-size="6.3" fill="#2F5D8A" text-anchor="start" font-weight="bold">Hooke's law zone</text><text x="205" y="118" font-size="6.3" fill="#272134" text-anchor="middle">strain hardening</text><text x="272" y="96" font-size="6.3" fill="#272134" text-anchor="middle">necking</text><rect x="56" y="222" width="264" height="32" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.1"/><text x="188" y="235" font-size="7.0" fill="#272134" text-anchor="middle">Mild steel curve: proportional, yields, hardens,</text><text x="188" y="248" font-size="7.0" fill="#272134" text-anchor="middle">necks and breaks - E is the first slope (200 GPa).</text></svg>