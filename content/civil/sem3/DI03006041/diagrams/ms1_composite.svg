<svg xmlns="http://www.w3.org/2000/svg" width="360" height="232" viewBox="0 0 360 232" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="232" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Composite bar - load sharing</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 1.4: equal strain rules the partnership</text><rect x="120" y="52" width="120" height="14" rx="3" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.5"/><rect x="120" y="150" width="120" height="14" rx="3" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.5"/><rect x="158" y="66" width="44" height="84" rx="3" fill="#FCE4EC" stroke="#BD2543" stroke-width="1.5"/><rect x="138" y="66" width="20" height="84" rx="3" fill="#FDEBD7" stroke="#B66A00" stroke-width="1.4"/><rect x="202" y="66" width="20" height="84" rx="3" fill="#FDEBD7" stroke="#B66A00" stroke-width="1.4"/><path d="M180 30 L180 48" fill="none" stroke="#B66A00" stroke-width="2.0" marker-end="url(#ahB)"/><text x="180" y="24" font-size="7.5" fill="#B66A00" text-anchor="middle" font-weight="bold">axial load P</text><text x="180" y="110" font-size="6.3" fill="#BD2543" text-anchor="middle" font-weight="bold">steel core</text><text x="112" y="96" font-size="6.3" fill="#B66A00" text-anchor="end" font-weight="bold">copper</text><text x="112" y="106" font-size="6.3" fill="#B66A00" text-anchor="end" font-weight="bold">tube</text><line x1="222" y1="80" x2="258" y2="72" stroke="#5A5A5A" stroke-width="0.9"/><text x="262" y="70" font-size="6.5" fill="#272134" text-anchor="start">rigid end plates:</text><text x="262" y="82" font-size="6.5" fill="#272134" text-anchor="start">both materials shorten</text><text x="262" y="94" font-size="6.5" fill="#272134" text-anchor="start">by the same amount</text><rect x="56" y="182" width="248" height="44" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.1"/><text x="180" y="197" font-size="7.0" fill="#272134" text-anchor="middle">Same strain, different stress: stiffer material</text><text x="180" y="210" font-size="7.0" fill="#272134" text-anchor="middle">(higher E) carries the bigger share (N1.2).</text><text x="180" y="221" font-size="7.0" fill="#272134" text-anchor="middle" font-weight="bold">P = stress_s x A_s + stress_c x A_c</text></svg>