bold">Le = L</text><path d="M138 56 L138 61 L138 65 L138 70 L138 74 L137 79 L137 84 L137 88 L137 93 L136 97 L136 102 L135 107 L135 111 L134 116 L134 120 L133 125 L132 130 L131 134 L131 139 L130 143 L129 148" fill="none" stroke="#2F5D8A" stroke-width="2.0"/><line x1="138" y1="56" x2="138" y2="148" stroke="#5A5A5A" stroke-width="0.8" stroke-dasharray="4 3"/><rect x="131" y="148" width="14" height="5" rx="3" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.0"/><text x="138" y="50" font-size="5.6" fill="#B66A00" text-anchor="middle" font-weight="bold">free</text><text x="138" y="168" font-size="6.0" fill="#272134" text-anchor="middle" font-weight="bold">fixed-free</text><text x="138" y="180" font-size="6.5" fill="#BD2543" text-anchor="middle" font-weight="bold">Le = 2L</text><path d="M214 56 L214 61 L214 65 L214 70 L214 74 L215 79 L215 84 L215 88 L216 93 L216 97 L216 102 L217 107 L217 111 L218 116 L218 120 L218 125 L219 130 L219 134 L219 139 L219 143 L219 148" fill="none" stroke="#2F5D8A" stroke-width="2.0"/><line x1="214" y1="56" x2="214" y2="148" stroke="#5A5A5A" stroke-width="0.8" stroke-dasharray="4 3"/><rect x="207" y="51" width="14" height="5" rx="3" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.0"/><rect x="207" y="148" width="14" height="5" rx="3" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.0"/><text x="214" y="168" font-size="6.0" fill="#272134" text-anchor="middle" font-weight="bold">both fixed</text><text x="214" y="180" font-size="6.5" fill="#BD2543" text-anchor="middle" font-weight="bold">Le = 0.5L</text><path d="M290 56 L290 61 L290 65 L291 70 L291 74 L291 79 L292 84 L292 88 L292 93 L293 97 L293 102 L293 107 L293 111 L294 116 L294 120 L294 125 L294 130 L294 134 L295 139 L295 143 L295 148" fill="none" stroke="#2F5D8A" stroke-width="2.0"/><line x1="290" y1="56" x2="290" y2="148" stroke="#5A5A5A" stroke-width="0.8" stroke-dasharray="4 3"/><rect x="283" y="148" width="14" height="5" rx="3" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.0"/><circle cx="29