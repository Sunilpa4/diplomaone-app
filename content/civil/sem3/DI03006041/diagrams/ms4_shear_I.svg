ize="6.3" fill="#BD2543" text-anchor="start" font-weight="bold">almost all shear</text><text x="132" y="186" font-size="6.5" fill="#2F5D8A" text-anchor="middle" font-weight="bold">I-section</text><rect x="52" y="204" width="256" height="44" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.1"/><text x="180" y="219" font-size="7.0" fill="#272134" text-anchor="middle">Division of labour: flanges resist bending,</text><text x="180" y="234" font-size="7.0" fill="#272134" text-anchor="middle">web resists shear - each where it is strong.</text><text x="180" y="245" font-size="6.8" fill="#272134" text-anchor="middle">tau_web approx V/(web area) for quick checks (N4.3).</text></svg>