<svg xmlns="http://www.w3.org/2000/svg" width="360" height="226" viewBox="0 0 360 226" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="226" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">The elastic curve - slope and deflection</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 5.1: the two quantities every formula returns</text><line x1="50" y1="76" x2="310" y2="76" stroke="#5A5A5A" stroke-width="1.2" stroke-dasharray="6 4"/><text x="58" y="68" font-size="6.3" fill="#5A5A5A" text-anchor="start">original axis (straight)</text><path d="M50 76 Q180 150 310 76" fill="none" stroke="#2F5D8A" stroke-width="2.2"/><text x="180" y="158" font-size="6.8" fill="#2F5D8A" text-anchor="middle" font-weight="bold">elastic curve (deflected shape)</text><line x1="232" y1="104" x2="292" y2="76" stroke="#B66A00" stroke-width="1.6"/><text x="288" y="68" font-size="6.3" fill="#B66A00" text-anchor="start" font-weight="bold">tangent</text><path d="M262 92 A30 30 0 0 1 258 78" fill="none" stroke="#7B2CD9" stroke-width="1.3"/><text x="246" y="96" font-size="6.3" fill="#7B2CD9" text-anchor="end" font-weight="bold">slope</text><path d="M180 84 L180 128" fill="none" stroke="#BD2543" stroke-width="1.7" marker-end="url(#ah)"/><text x="188" y="122" font-size="6.5" fill="#BD2543" text-anchor="start" font-weight="bold">deflection</text><rect x="52" y="176" width="256" height="44" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.1"/><text x="180" y="191" font-size="7.0" fill="#272134" text-anchor="middle">Slope = angle of the tangent (radians, tiny);</text><text x="180" y="205" font-size="7.0" fill="#272134" text-anchor="middle">deflection = vertical drop of a point (mm).</text><text x="180" y="216" font-size="6.8" fill="#272134" text-anchor="middle">Both are governed by EI - flexural rigidity.</text></svg>