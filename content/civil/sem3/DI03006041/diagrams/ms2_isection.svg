.5" fill="#2F5D8A" text-anchor="end" font-weight="bold">flange</text><text x="196" y="150" font-size="6.5" fill="#2F5D8A" text-anchor="start" font-weight="bold">web</text><rect x="52" y="252" width="256" height="32" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.1"/><text x="180" y="265" font-size="7.0" fill="#272134" text-anchor="middle">Two routes, one answer: 3 rectangles added,</text><text x="180" y="278" font-size="7.0" fill="#272134" text-anchor="middle">or outer rectangle minus two side cuts (N2.2).</text></svg>