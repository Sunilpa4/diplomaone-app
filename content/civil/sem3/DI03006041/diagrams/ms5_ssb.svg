<svg xmlns="http://www.w3.org/2000/svg" width="360" height="200" viewBox="0 0 360 200" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="200" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Simply supported beam - standard cases</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 5.4: central point load and full UDL</text><path d="M95 42 L95 58" fill="none" stroke="#BD2543" stroke-width="1.7" marker-end="url(#ah)"/><text x="95" y="116" font-size="6.5" fill="#2F5D8A" text-anchor="middle" font-weight="bold">central point load P</text><text x="95" y="133" font-size="6.6" fill="#272134" text-anchor="middle" font-weight="bold">slope at supports = PL^2/(16EI)</text><text x="95" y="146" font-size="6.6" fill="#272134" text-anchor="middle" font-weight="bold">defl_max = PL^3/(48EI) centre</text><path d="M208 46 L208 58" fill="none" stroke="#BD2543" stroke-width="1.3" marker-end="url(#ah)"/><path d="M222 46 L222 58" fill="none" stroke="#BD2543" stroke-width="1.3" marker-end="url(#ah)"/><path d="M236 46 L236 58" fill="none" stroke="#BD2543" stroke-width="1.3" marker-end="url(#ah)"/><path d="M250 46 L250 58" fill="none" stroke="#BD2543" stroke-width="1.3" marker-end="url(#ah)"/><path d="M264 46 L264 58" fill="none" stroke="#BD2543" stroke-width="1.3" marker-end="url(#ah)"/><path d="M278 46 L278 58" fill="none" stroke="#BD2543" stroke-width="1.3" marker-end="url(#ah)"/><path d="M292 46 L292 58" fill="none" stroke="#BD2543" stroke-width="1.3" marker-end="url(#ah)"/><path d="M306 46 L306 58" fill="none" stroke="#BD2543" stroke-width="1.3" marker-end="url(#ah)"/><text x="260" y="116" font-size="6.5" fill="#2F5D8A" text-anchor="middle" font-weight="bold">UDL w over whole span</text><text x="260" y="133" font-size="6.6" fill="#272134" text-anchor="middle" font-weight="bold">slope at supports = wL^3/(24EI)</text><text x="260" y="146" font-size="6.6" fill="#272134" text-anchor="middle" font-weight="bold">defl_max = 5wL^4/(384EI) centre</text><rect x="52" y="162" width="256" height="32" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.1"/><text x="180" y="175" font-size="7.0" fill="#272134" text-anchor="middle">Simply supported: deflection max at centre,</text><text x="180" y="188" font-size="7.0" fill="#272134" text-anchor="middle">slope max at the supports (opposite signs).</text></svg>