<svg xmlns="http://www.w3.org/2000/svg" width="360" height="248" viewBox="0 0 360 248" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="248" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Anatomy of a truss</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 6.1: chords, verticals, diagonals, panels - Numerical 6.1/6.2 truss</text><line x1="60" y1="150" x2="130" y2="150" stroke="#2F5D8A" stroke-width="2.2"/><line x1="130" y1="150" x2="200" y2="150" stroke="#2F5D8A" stroke-width="2.2"/><line x1="200" y1="150" x2="270" y2="150" stroke="#2F5D8A" stroke-width="2.2"/><line x1="130" y1="80" x2="200" y2="80" stroke="#2F5D8A" stroke-width="2.2"/><line x1="130" y1="150" x2="130" y2="80" stroke="#2F5D8A" stroke-width="2.2"/><line x1="200" y1="150" x2="200" y2="80" stroke="#2F5D8A" stroke-width="2.2"/><line x1="60" y1="150" x2="130" y2="80" stroke="#2F5D8A" stroke-width="2.2"/><line x1="130" y1="80" x2="200" y2="150" stroke="#2F5D8A" stroke-width="2.2"/><line x1="200" y1="80" x2="270" y2="150" stroke="#2F5D8A" stroke-width="2.2"/><circle cx="60" cy="150" r="3.4" fill="#FFFFFF" stroke="#272134" stroke-width="1.2"/><circle cx="130" cy="150" r="3.4" fill="#FFFFFF" stroke="#272134" stroke-width="1.2"/><circle cx="200" cy="150" r="3.4" fill="#FFFFFF" stroke="#272134" stroke-width="1.2"/><circle cx="270" cy="150" r="3.4" fill="#FFFFFF" stroke="#272134" stroke-width="1.2"/><circle cx="130" cy="80" r="3.4" fill="#FFFFFF" stroke="#272134" stroke-width="1.2"/><circle cx="200" cy="80" r="3.4" fill="#FFFFFF" stroke="#272134" stroke-width="1.2"/><path d="M52 162 L60 154 L68 162 Z" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.0"/><circle cx="270" cy="158" r="4" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.0"/><path d="M130 108 L130 142" fill="none" stroke="#BD2543" stroke-width="1.6" marker-end="url(#ah)"/><path d="M200 108 L200 142" fill="none" stroke="#BD2543" stroke-width="1.6" marker-end="url(#ah)"/><text x="165" y="104" font-size="6.3" fill="#BD2543" text-anchor="middle" font-weight="bold">loads at panel points</text><text x="165" y="66" font-size="6.5" fill="#B66A00" text-anchor="middle" font-weight="bold">top chord (compression)</text><text x="165" y="170" font-size="6.5" fill="#BD2543" text-anchor="middle" font-weight="bold">bottom chord (tension)</text><text x="62" y="118" font-size="6.0" fill="#272134" text-anchor="start">diagonal</text><text x="120" y="118" font-size="6.0" fill="#272134" text-anchor="middle">vertical</text><line x1="60" y1="186" x2="270" y2="186" stroke="#272134" stroke-width="0.9"/><text x="165" y="198" font-size="6.5" fill="#272134" text-anchor="middle" font-weight="bold">span 6 m - 3 panels of 2 m - height 2 m</text><rect x="52" y="210" width="256" height="32" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.1"/><text x="180" y="223" font-size="7.0" fill="#272134" text-anchor="middle">A truss is a beam with the web opened into</text><text x="180" y="236" font-size="7.0" fill="#272134" text-anchor="middle">triangles: chords take bending, web members take shear.</text></svg>