<svg xmlns="http://www.w3.org/2000/svg" width="360" height="200" viewBox="0 0 360 200" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="200" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Standard MOI formulae - the four workhorses</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 2.3: rectangle, circle, triangle, hollow (no derivations)</text><rect x="12" y="48" width="76" height="56" rx="3" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.4"/><rect x="102" y="48" width="76" height="56" rx="3" fill="#FFFFFF" stroke="#B66A00" stroke-width="1.4"/><rect x="192" y="48" width="76" height="56" rx="3" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.4"/><rect x="24" y="62" width="52" height="30" rx="3" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.4"/><line x1="14" y1="77" x2="86" y2="77" stroke="#2F5D8A" stroke-width="1.0" stroke-dasharray="4 3"/><circle cx="140" cy="77" r="16" fill="#FDEBD7" stroke="#B66A00" stroke-width="1.4"/><line x1="120" y1="77" x2="160" y2="77" stroke="#B66A00" stroke-width="1.0" stroke-dasharray="4 3"/><path d="M204 92 L230 60 L256 92 Z" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.4"/><line x1="200" y1="92" x2="260" y2="92" stroke="#2E7D32" stroke-width="1.0" stroke-dasharray="4 3"/><text x="50" y="120" font-size="6.8" fill="#2F5D8A" text-anchor="middle" font-weight="bold">RECTANGLE</text><text x="50" y="133" font-size="6.2" fill="#272134" text-anchor="middle">Ixx = b h^3/12</text><text x="140" y="120" font-size="6.8" fill="#B66A00" text-anchor="middle" font-weight="bold">CIRCLE</text><text x="140" y="133" font-size="6.2" fill="#272134" text-anchor="middle">I = pi D^4/64</text><text x="230" y="120" font-size="6.8" fill="#2E7D32" text-anchor="middle" font-weight="bold">TRIANGLE</text><text x="230" y="133" font-size="6.2" fill="#272134" text-anchor="middle">Icg = b h^3/36</text><rect x="282" y="48" width="66" height="56" rx="3" fill="#FFFFFF" stroke="#7B2CD9" stroke-width="1.4"/><rect x="292" y="60" width="46" height="32" rx="3" fill="#FFFFFF" stroke="#7B2CD9" stroke-width="1.2"/><rect x="302" y="68" width="26" height="16" rx="3" fill="#F3E5F5" stroke="#7B2CD9" stroke-width="1.0"/><text x="315" y="120" font-size="6.8" fill="#7B2CD9" text-anchor="middle" font-weight="bold">HOLLOW</text><text x="315" y="133" font-size="5.8" fill="#272134" text-anchor="middle">(BD^3-bd^3)/12</text><rect x="52" y="150" width="256" height="44" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.1"/><text x="180" y="165" font-size="7.0" fill="#272134" text-anchor="middle">About centroidal axes through the shape's own centre -</text><text x="180" y="179" font-size="7.0" fill="#272134" text-anchor="middle">then parallel-axis theorem takes you anywhere (N2.1).</text><text x="180" y="190" font-size="6.6" fill="#272134" text-anchor="middle">Square: b^4/12 both ways. Semicircle/triangle: see tables.</text></svg>