<svg xmlns="http://www.w3.org/2000/svg" width="360" height="236" viewBox="0 0 360 236" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="236" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Active and passive earth pressure</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 7.4: Rankine states for a retaining wall</text><rect x="96" y="66" width="14" height="96" rx="3" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.5"/><line x1="52" y1="162" x2="250" y2="162" stroke="#5D4037" stroke-width="1.5"/><path d="M110 162 L168 92" fill="none" stroke="#B66A00" stroke-width="1.6" stroke-dasharray="5 3"/><text x="140" y="108" font-size="6.0" fill="#B66A00" text-anchor="start" font-weight="bold">failure wedge</text><path d="M88 100 L60 100" fill="none" stroke="#BD2543" stroke-width="2.0" marker-end="url(#ah)"/><text x="58" y="88" font-size="6.3" fill="#BD2543" text-anchor="end" font-weight="bold">ACTIVE push</text><rect x="176" y="92" width="60" height="30" rx="3" fill="#FFFFFF" stroke="#0277BD" stroke-width="1.3"/><text x="206" y="104" font-size="6.3" fill="#0277BD" text-anchor="middle" font-weight="bold">PASSIVE:</text><text x="206" y="116" font-size="6.0" fill="#272134" text-anchor="middle">wall drives in</text><text x="180" y="186" font-size="7.0" fill="#2F5D8A" text-anchor="middle" font-weight="bold">Ka = (1-sin phi)/(1+sin phi) ; Kp = 1/Ka</text><rect x="52" y="200" width="256" height="30" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.1"/><text x="180" y="219" font-size="7.0" fill="#272134" text-anchor="middle">Active is the load; passive is the resistance (N7.3).</text></svg>