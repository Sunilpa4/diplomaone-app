<svg xmlns="http://www.w3.org/2000/svg" width="360" height="238" viewBox="0 0 360 238" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="238" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Coulomb shear-strength envelope</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 6.2: the line every shear test draws (Numerical 6.1)</text><path d="M52 178 L322 178" fill="none" stroke="#272134" stroke-width="1.1" marker-end="url(#ah)"/><path d="M52 178 L52 46" fill="none" stroke="#272134" stroke-width="1.1" marker-end="url(#ah)"/><text x="320" y="192" font-size="6.3" fill="#272134" text-anchor="end" font-weight="bold">normal stress sigma -></text><text x="46" y="42" font-size="6.3" fill="#272134" text-anchor="end" font-weight="bold">tau_f</text><path d="M52 128 L300 58" fill="none" stroke="#B66A00" stroke-width="2.2"/><line x1="52" y1="128" x2="52" y2="178" stroke="#B66A00" stroke-width="1.2" stroke-dasharray="4 3"/><text x="60" y="122" font-size="6.3" fill="#B66A00" text-anchor="start" font-weight="bold">c (intercept)</text><text x="230" y="92" font-size="6.5" fill="#2F5D8A" text-anchor="middle" font-weight="bold">slope = tan phi</text><text x="150" y="150" font-size="6.8" fill="#2F5D8A" text-anchor="middle" font-weight="bold">failure envelope: tau_f = c + sigma tan phi</text><rect x="60" y="202" width="244" height="30" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.1"/><text x="182" y="221" font-size="6.8" fill="#272134" text-anchor="middle" font-weight="bold">c from particle bonds ; phi from grain friction (Card 6.2).</text></svg>