.9"/><text x="192" y="55" font-size="7" fill="#272134" text-anchor="start">Va</text><line x1="168" y1="91" x2="188" y2="91" stroke="#0277BD" stroke-width="0.9"/><text x="192" y="94" font-size="7" fill="#272134" text-anchor="start">Vw</text><line x1="168" y1="142" x2="188" y2="142" stroke="#5D4037" stroke-width="0.9"/><text x="192" y="145" font-size="7" fill="#272134" text-anchor="start">Vs</text><text x="192" y="76" font-size="6.3" fill="#B66A00" text-anchor="start" font-weight="bold">Vv = voids</text><text x="192" y="164" font-size="6.3" fill="#2F5D8A" text-anchor="start" font-weight="bold">V = total</text><text x="60" y="92" font-size="7" fill="#272134" text-anchor="end" font-weight="bold">Ww</text><text x="60" y="147" font-size="7" fill="#272134" text-anchor="end" font-weight="bold">Ws</text><text x="60" y="64" font-size="6.0" fill="#5A5A5A" text-anchor="end">Wa=0</text><rect x="52" y="190" width="256" height="44" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.1"/><text x="180" y="205" font-size="7.0" fill="#272134" text-anchor="middle">Every property in Unit 2 is a ratio read</text><text x="180" y="219" font-size="7.0" fill="#272134" text-anchor="middle">off this one picture. Air weighs nothing.</text><text x="180" y="230" font-size="6.8" fill="#272134" text-anchor="middle">Weights left, volumes right (convention).</text></svg>