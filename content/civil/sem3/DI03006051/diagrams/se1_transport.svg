<svg xmlns="http://www.w3.org/2000/svg" width="360" height="242" viewBox="0 0 360 242" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="242" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Soils by mode of transportation</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 1.3: CO1 - agent decides deposits (residual soil = no transport)</text><rect x="44" y="56" width="84" height="44" rx="3" fill="#FFFFFF" stroke="#BD2543" stroke-width="1.4"/><text x="86" y="75" font-size="7.2" fill="#BD2543" text-anchor="middle" font-weight="bold">ALLUVIAL</text><text x="86" y="90" font-size="6.5" fill="#272134" text-anchor="middle">by river water</text><rect x="140" y="56" width="84" height="44" rx="3" fill="#FFFFFF" stroke="#F9A825" stroke-width="1.4"/><text x="182" y="75" font-size="7.2" fill="#F9A825" text-anchor="middle" font-weight="bold">AEOLIAN</text><text x="182" y="90" font-size="6.5" fill="#272134" text-anchor="middle">by wind</text><rect x="236" y="56" width="84" height="44" rx="3" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.4"/><text x="278" y="75" font-size="7.2" fill="#2F5D8A" text-anchor="middle" font-weight="bold">GLACIAL</text><text x="278" y="90" font-size="6.5" fill="#272134" text-anchor="middle">by ice</text><rect x="44" y="118" width="84" height="44" rx="3" fill="#FFFFFF" stroke="#0277BD" stroke-width="1.4"/><text x="86" y="137" font-size="7.2" fill="#0277BD" text-anchor="middle" font-weight="bold">MARINE</text><text x="86" y="152" font-size="6.5" fill="#272134" text-anchor="middle">by sea</text><rect x="140" y="118" width="84" height="44" rx="3" fill="#FFFFFF" stroke="#00897B" stroke-width="1.4"/><text x="182" y="137" font-size="7.2" fill="#00897B" text-anchor="middle" font-weight="bold">LACUSTRINE</text><text x="182" y="152" font-size="6.5" fill="#272134" text-anchor="middle">by lake</text><rect x="236" y="118" width="84" height="44" rx="3" fill="#FFFFFF" stroke="#B66A00" stroke-width="1.4"/><text x="278" y="137" font-size="7.2" fill="#B66A00" text-anchor="middle" font-weight="bold">GRAVITY</text><text x="278" y="152" font-size="6.5" fill="#272134" text-anchor="middle">by colluvial</text><rect x="52" y="196" width="256" height="40" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.1"/><text x="180" y="211" font-size="7.0" fill="#272134" text-anchor="middle">Transporting agent writes the soil's character:</text><text x="180" y="225" font-size="7.0" fill="#272134" text-anchor="middle">rounded and sorted (water) vs angular and mixed (gravity).</text></svg>