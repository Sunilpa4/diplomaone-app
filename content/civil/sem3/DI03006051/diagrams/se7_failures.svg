h="84" height="24" rx="3" fill="#FFFFFF" stroke="#E65100" stroke-width="1.3"/><text x="184" y="75" font-size="6.3" fill="#E65100" text-anchor="middle" font-weight="bold">LOCAL shear</text><rect x="168" y="92" width="32" height="8" rx="3" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.0"/><line x1="142" y1="100" x2="226" y2="100" stroke="#5D4037" stroke-width="1.2"/><path d="M200 100 Q184 120 172 100" fill="none" stroke="#E65100" stroke-width="1.4"/><text x="184" y="136" font-size="5.8" fill="#272134" text-anchor="middle">medium: partial slip</text><text x="184" y="147" font-size="5.8" fill="#272134" text-anchor="middle">settlement grows</text><rect x="238" y="60" width="84" height="24" rx="3" fill="#FFFFFF" stroke="#B66A00" stroke-width="1.3"/><text x="280" y="75" font-size="6.3" fill="#B66A00" text-anchor="middle" font-weight="bold">PUNCHING</text><rect x="264" y="92" width="32" height="8" rx="3" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.0"/><line x1="238" y1="100" x2="322" y2="100" stroke="#5D4037" stroke-width="1.2"/><path d="M296 100 Q280 124 268 100" fill="none" stroke="#B66A00" stroke-width="1.4"/><text x="280" y="136" font-size="5.8" fill="#272134" text-anchor="middle">loose/soft: footing</text><text x="280" y="147" font-size="5.8" fill="#272134" text-anchor="middle">sinks, no heave</text><rect x="52" y="168" width="256" height="32" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.1"/><text x="180" y="181" font-size="7.0" fill="#272134" text-anchor="middle">Soil density picks the failure style -</text><text x="180" y="193" font-size="7.0" fill="#272134" text-anchor="middle">watch for it in plate load curves (Card 7.3).</text></svg>