or="start" font-weight="bold">light (standard):</text><text x="216" y="97" font-size="6.0" fill="#272134" text-anchor="start">2.6 kg, 310 mm drop,</text><text x="216" y="108" font-size="6.0" fill="#272134" text-anchor="start">3 layers x 25 blows</text><text x="216" y="126" font-size="6.3" fill="#272134" text-anchor="start" font-weight="bold">heavy (modified):</text><text x="216" y="139" font-size="6.0" fill="#272134" text-anchor="start">4.9 kg, 450 mm drop,</text><text x="216" y="150" font-size="6.0" fill="#272134" text-anchor="start">5 layers x 25 blows</text><rect x="52" y="182" width="256" height="32" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.1"/><text x="180" y="195" font-size="7.0" fill="#272134" text-anchor="middle">Same soil, more energy -> higher MDD, lower OMC.</text><text x="180" y="207" font-size="6.8" fill="#272134" text-anchor="middle">Light for buildings, heavy for highways/airfields.</text></svg>