<svg xmlns="http://www.w3.org/2000/svg" width="360" height="210" viewBox="0 0 360 210" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="210" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">The geological cycle and soil formation</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 1.2: weathering -> transport -> deposition -> soil</text><rect x="56" y="56" width="76" height="30" rx="3" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.4"/><text x="94.0" y="75" font-size="7.5" fill="#272134" text-anchor="middle" font-weight="bold">ROCK</text><rect x="148" y="56" width="76" height="30" rx="3" fill="#FFF3E0" stroke="#E65100" stroke-width="1.4"/><text x="186.0" y="75" font-size="7.5" fill="#272134" text-anchor="middle" font-weight="bold">MAGMA</text><rect x="240" y="56" width="76" height="30" rx="3" fill="#FFF3E0" stroke="#E65100" stroke-width="1.4"/><text x="278.0" y="75" font-size="7.5" fill="#272134" text-anchor="middle" font-weight="bold">LAVA heat</text><rect x="148" y="116" width="76" height="30" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.4"/><text x="186" y="135" font-size="9" fill="#2E7D32" text-anchor="middle" font-weight="bold">SOIL</text><rect x="240" y="116" width="76" height="30" rx="3" fill="#EFEBE9" stroke="#5D4037" stroke-width="1.4"/><text x="278" y="135" font-size="7.0" fill="#272134" text-anchor="middle" font-weight="bold">SEDIMENT</text><path d="M132 71 L146 71" fill="none" stroke="#272134" stroke-width="1.6" marker-end="url(#ah)"/><path d="M224 71 L238 71" fill="none" stroke="#272134" stroke-width="1.6" marker-end="url(#ah)"/><path d="M278 86 L278 114" fill="none" stroke="#272134" stroke-width="1.6" marker-end="url(#ah)"/><path d="M240 131 L226 131" fill="none" stroke="#272134" stroke-width="1.6" marker-end="url(#ah)"/><path d="M186 116 L120 88" fill="none" stroke="#272134" stroke-width="1.6" marker-end="url(#ah)"/><path d="M94 86 L170 112" fill="none" stroke="#5A5A5A" stroke-width="1.2" stroke-dasharray="4 3"/><text x="120" y="48" font-size="6.3" fill="#2F5D8A" text-anchor="middle" font-weight="bold">weathering breaks rock</text><text x="262" y="48" font-size="6.3" fill="#E65100" text-anchor="middle" font-weight="bold">heat + pressure</text><text x="150" y="104" font-size="6.3" fill="#2E7D32" text-anchor="middle" font-weight="bold">erosion + deposition</text><text x="94" y="108" font-size="6.0" fill="#5A5A5A" text-anchor="middle" font-weight="bold">burial + lithification</text><rect x="52" y="164" width="256" height="40" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.1"/><text x="180" y="179" font-size="7.0" fill="#272134" text-anchor="middle">Soil is the top, weathered skin of the</text><text x="180" y="193" font-size="7.0" fill="#272134" text-anchor="middle">geological cycle - rock broken, moved, laid down.</text></svg>