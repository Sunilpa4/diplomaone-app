<svg xmlns="http://www.w3.org/2000/svg" width="360" height="236" viewBox="0 0 360 236" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="236" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Where soil works - and India's deposits</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Cards 1.4-1.5: foundation, construction material, support</text><rect x="52" y="62" width="256" height="36" rx="3" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.3"/><text x="180" y="77" font-size="7.5" fill="#2F5D8A" text-anchor="middle" font-weight="bold">Soil AS foundation</text><text x="180" y="91" font-size="6.5" fill="#272134" text-anchor="middle">every building, bridge, tower stands on it</text><rect x="52" y="106" width="256" height="36" rx="3" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.3"/><text x="180" y="121" font-size="7.5" fill="#2E7D32" text-anchor="middle" font-weight="bold">Soil AS material</text><text x="180" y="135" font-size="6.5" fill="#272134" text-anchor="middle">earthen dams, embankments, road subgrade, bricks</text><rect x="52" y="150" width="256" height="36" rx="3" fill="#FFFFFF" stroke="#E65100" stroke-width="1.3"/><text x="180" y="165" font-size="7.5" fill="#E65100" text-anchor="middle" font-weight="bold">Soil AS support</text><text x="180" y="179" font-size="6.5" fill="#272134" text-anchor="middle">retaining walls, tunnels, buried pipelines</text><text x="180" y="214" font-size="6.5" fill="#272134" text-anchor="middle" font-weight="bold">Deposits of India: alluvial (Indo-Gangetic), black cotton (Deccan),</text><text x="180" y="227" font-size="6.5" fill="#272134" text-anchor="middle" font-weight="bold">laterite (west coast), desert (Thar), marine (coasts).</text></svg>