idth="1.4"/><line x1="206" y1="76" x2="226" y2="76" stroke="#B66A00" stroke-width="1.1"/><text x="202" y="80" font-size="6.0" fill="#B66A00" text-anchor="end" font-weight="bold">h1</text><line x1="206" y1="88" x2="226" y2="88" stroke="#B66A00" stroke-width="1.1"/><text x="202" y="92" font-size="6.0" fill="#B66A00" text-anchor="end" font-weight="bold">h2</text><text x="226" y="50" font-size="6.5" fill="#2F5D8A" text-anchor="middle" font-weight="bold">FALLING head</text><text x="226" y="150" font-size="5.8" fill="#272134" text-anchor="middle">time the fall h1 to h2</text><rect x="52" y="168" width="256" height="44" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.1"/><text x="180" y="183" font-size="7.0" fill="#272134" text-anchor="middle">Sands: constant head (flow is measurable).</text><text x="180" y="197" font-size="7.0" fill="#272134" text-anchor="middle">Clays: falling head (flow is a whisper).</text><text x="180" y="208" font-size="6.8" fill="#272134" text-anchor="middle">Choose by expected k (Card 4.3).</text></svg>