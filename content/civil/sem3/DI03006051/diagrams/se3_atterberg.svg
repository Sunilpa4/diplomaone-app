ll="#FFFFFF" stroke="#FFB74D" stroke-width="1.6"/><text x="188" y="86" font-size="6.0" fill="#272134" text-anchor="middle" font-weight="bold">PLASTIC</text><rect x="222" y="70" width="56" height="24" rx="3" fill="#FFFFFF" stroke="#4FC3F7" stroke-width="1.6"/><text x="250" y="86" font-size="6.0" fill="#272134" text-anchor="middle" font-weight="bold">LIQUID</text><line x1="95" y1="100" x2="95" y2="122" stroke="#B66A00" stroke-width="1.4"/><text x="95" y="134" font-size="5.8" fill="#B66A00" text-anchor="middle" font-weight="bold">SL shrinkage limit</text><line x1="157" y1="100" x2="157" y2="122" stroke="#B66A00" stroke-width="1.4"/><text x="157" y="134" font-size="5.8" fill="#B66A00" text-anchor="middle" font-weight="bold">PL plastic limit</text><line x1="219" y1="100" x2="219" y2="122" stroke="#B66A00" stroke-width="1.4"/><text x="219" y="134" font-size="5.8" fill="#B66A00" text-anchor="middle" font-weight="bold">LL liquid limit</text><text x="188" y="152" font-size="6.8" fill="#2F5D8A" text-anchor="middle" font-weight="bold">plastic range between PL and LL = PI</text><rect x="60" y="168" width="240" height="40" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.1"/><text x="180" y="183" font-size="7.0" fill="#272134" text-anchor="middle">Same clay, four behaviours - only the water</text><text x="180" y="197" font-size="7.0" fill="#272134" text-anchor="middle">changed. Atterberg limits mark the boundaries.</text></svg>