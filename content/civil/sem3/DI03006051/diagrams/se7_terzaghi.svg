#5A5A5A" stroke-width="0.9" stroke-dasharray="4 3"/><line x1="214" y1="74" x2="284" y2="100" stroke="#5A5A5A" stroke-width="0.9" stroke-dasharray="4 3"/><text x="180" y="134" font-size="6.3" fill="#B66A00" text-anchor="middle" font-weight="bold">elastic wedge</text><text x="104" y="126" font-size="6.0" fill="#BD2543" text-anchor="middle" font-weight="bold">log-spiral shear zones</text><text x="258" y="126" font-size="6.0" fill="#272134" text-anchor="middle">passive wedges heave up</text><rect x="52" y="152" width="256" height="44" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.1"/><text x="180" y="167" font-size="7.5" fill="#272134" text-anchor="middle" font-weight="bold">qu = c Nc + q Nq + 0.5 gamma B Ngamma</text><text x="180" y="182" font-size="7.0" fill="#272134" text-anchor="middle">cohesion + surcharge + self-weight terms (N7.1).</text></svg>