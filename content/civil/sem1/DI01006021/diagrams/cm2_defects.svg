<svg xmlns="http://www.w3.org/2000/svg" width="360" height="232" viewBox="0 0 360 232" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="232" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Common defects in timber</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 2.2 (seasoning and defects): what to reject at purchase</text><rect x="8" y="58" width="63" height="116" rx="3" fill="#ffffff" stroke="#8D5A2B" stroke-width="1.3"/><text x="39" y="72" font-size="6.8" fill="#8D5A2B" text-anchor="middle" font-weight="bold">KNOT</text><text x="39" y="148" font-size="6.5" fill="#272134" text-anchor="middle">cut-off branch;</text><text x="39" y="157" font-size="6.5" fill="#272134" text-anchor="middle">weak spot, plane</text><text x="39" y="166" font-size="6.5" fill="#272134" text-anchor="middle">before use</text><rect x="78" y="58" width="63" height="116" rx="3" fill="#ffffff" stroke="#8D5A2B" stroke-width="1.3"/><text x="109" y="72" font-size="6.8" fill="#8D5A2B" text-anchor="middle" font-weight="bold">HEART SHAKE</text><text x="109" y="148" font-size="6.5" fill="#272134" text-anchor="middle">crack from pith</text><text x="109" y="157" font-size="6.5" fill="#272134" text-anchor="middle">outward: centre</text><text x="109" y="166" font-size="6.5" fill="#272134" text-anchor="middle">of log weakened</text><rect x="148" y="58" width="63" height="116" rx="3" fill="#ffffff" stroke="#8D5A2B" stroke-width="1.3"/><text x="179" y="72" font-size="6.8" fill="#8D5A2B" text-anchor="middle" font-weight="bold">STAR SHAKE</text><text x="179" y="148" font-size="6.5" fill="#272134" text-anchor="middle">many radial cracks</text><text x="179" y="157" font-size="6.5" fill="#272134" text-anchor="middle">from outside to</text><text x="179" y="166" font-size="6.5" fill="#272134" text-anchor="middle">centre (star)</text><rect x="218" y="58" width="63" height="116" rx="3" fill="#ffffff" stroke="#8D5A2B" stroke-width="1.3"/><text x="249" y="72" font-size="6.8" fill="#8D5A2B" text-anchor="middle" font-weight="bold">CUP SHAKE</text><text x="249" y="148" font-size="6.5" fill="#272134" text-anchor="middle">curved crack along</text><text x="249" y="157" font-size="6.5" fill="#272134" text-anchor="middle">one annual ring:</text><text x="249" y="166" font-size="6.5" fill="#272134" text-anchor="middle">layers separate</text><rect x="288" y="58" width="63" height="116" rx="3" fill="#ffffff" stroke="#8D5A2B" stroke-width="1.3"/><text x="319" y="72" font-size="6.8" fill="#8D5A2B" text-anchor="middle" font-weight="bold">TWIST / WARP</text><text x="319" y="148" font-size="6.5" fill="#272134" text-anchor="middle">piece bends or</text><text x="319" y="157" font-size="6.5" fill="#272134" text-anchor="middle">twists on drying:</text><text x="319" y="166" font-size="6.5" fill="#272134" text-anchor="middle">bad seasoning</text><circle cx="39" cy="106" r="19" fill="#E9CD9F" stroke="#8D5A2B" stroke-width="1.0"/><circle cx="39" cy="106" r="7" fill="#6D4226" stroke="#8D5A2B" stroke-width="1.2"/><circle cx="109" cy="106" r="19" fill="#E9CD9F" stroke="#8D5A2B" stroke-width="1.0"/><line x1="109" y1="106" x2="96" y2="93" stroke="#5D3A1A" stroke-width="1.6"/><line x1="109" y1="106" x2="122" y2="97" stroke="#5D3A1A" stroke-width="1.4"/><line x1="109" y1="106" x2="107" y2="123" stroke="#5D3A1A" stroke-width="1.2"/><circle cx="179" cy="106" r="19" fill="#E9CD9F" stroke="#8D5A2B" stroke-width="1.0"/><line x1="179" y1="106" x2="166" y2="91" stroke="#5D3A1A" stroke-width="1.2"/><line x1="179" y1="106" x2="193" y2="93" stroke="#5D3A1A" stroke-width="1.2"/><line x1="179" y1="106" x2="164" y2="110" stroke="#5D3A1A" stroke-width="1.2"/><line x1="179" y1="106" x2="195" y2="114" stroke="#5D3A1A" stroke-width="1.2"/><line x1="179" y1="106" x2="181" y2="124" stroke="#5D3A1A" stroke-width="1.2"/><circle cx="249" cy="106" r="19" fill="#E9CD9F" stroke="#8D5A2B" stroke-width="1.0"/><circle cx="249" cy="106" r="12" fill="none" stroke="#A97B4A" stroke-width="0.7"/><path d="M238 99 A12 12 0 0 1 259 115" fill="none" stroke="#5D3A1A" stroke-width="1.8"/><path d="M294 90 L342 83 L346 114 L298 124 Z" fill="#E9CD9F" stroke="#8D5A2B" stroke-width="1.1"/><line x1="297" y1="99" x2="343" y2="92" stroke="#A97B4A" stroke-width="0.7"/><line x1="298" y1="109" x2="344" y2="102" stroke="#A97B4A" stroke-width="0.7"/><rect x="22" y="192" width="316" height="32" rx="3" fill="#FDEBD7" stroke="#B66A00" stroke-width="1.3"/><text x="180" y="205" font-size="8.5" fill="#272134" text-anchor="middle" font-weight="bold">Most defects come from the tree itself (shakes, knots) or from</text><text x="180" y="217" font-size="8.5" fill="#272134" text-anchor="middle">bad seasoning (warp, twist, cracks) - inspect before accepting.</text></svg>