ouses, schools,</text><text x="52" y="158" font-size="7.5" fill="#5A5A5A" text-anchor="middle">hospitals, offices</text><rect x="104" y="58" width="76" height="62" rx="3" fill="#ffffff" stroke="#B66A00" stroke-width="1.4"/><line x1="110" y1="96" x2="174" y2="96" stroke="#B66A00" stroke-width="3.0"/><path d="M118 96 L142 68 L166 96" fill="none" stroke="#B66A00" stroke-width="1.4"/><line x1="142" y1="68" x2="142" y2="96" stroke="#B66A00" stroke-width="1.4"/><line x1="126" y1="96" x2="142" y2="82" stroke="#B66A00" stroke-width="0.8"/><line x1="158" y1="96" x2="142" y2="82" stroke="#B66A00" stroke-width="0.8"/><path d="M110 108 q8-5 16 0 q8 5 16 0 q8-5 16 0 q8 5 16 0" fill="none" stroke="#2F5D8A" stroke-width="1.2"/><text x="142" y="136" font-size="8.5" fill="#B66A00" text-anchor="middle" font-weight="bold">TRANSPORTATION</text><text x="142" y="148" font-size="7.5" fill="#5A5A5A" text-anchor="middle">roads, bridges,</text><text x="142" y="158" font-size="7.5" fill="#5A5A5A" text-anchor="middle">railways, flyovers</text><rect x="194" y="58" width="76" height="62" rx="3" fill="#ffffff" stroke="#2E7D32" stroke-width="1.4"/><rect x="202" y="84" width="26" height="30" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.3"/><rect x="238" y="84" width="26" height="30" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.3"/><line x1="202" y1="92" x2="228" y2="92" stroke="#2E7D32" stroke-width="1.6"/><line x1="238" y1="92" x2="264" y2="92" stroke="#2E7D32" stroke-width="1.6"/><path d="M210 114 q5-6 10 0 q5 6 10 0" fill="none" stroke="#2F5D8A" stroke-width="1.1"/><path d="M242 114 q5-6 10 0 q5 6 10 0" fill="none" stroke="#2F5D8A" stroke-width="1.1"/><text x="232" y="136" font-size="8.5" fill="#2E7D32" text-anchor="middle" font-weight="bold">ENVIRONMENTAL</text><text x="232" y="148" font-size="7.5" fill="#5A5A5A" text-anchor="middle">water supply,</text><text x="232" y="158" font-size="7.5" fill="#5A5A5A" text-anchor="middle">sewage treatment</text><rect x="284" y="58" width="66" height="62" rx="3" fill="#ffffff" stroke="#BD2543" stroke-width="1.4"/><path d="M292 116 L292 74 L306 74 L314 116 Z" fill="#FCE4EC" stroke="#BD2543" stroke-width="1.5"/><path d="M296 88 q4-4 8 0 q4 4 8 0 M296 98 q4-4 8 0 q4 4 8 0" fill="none" stroke="#2F5D8A" stroke-width="1.0"/><path d="M318 116 L346 100 L346 116 Z" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.2"/><text x="317" y="136" font-size="8.5" fill="#BD2543" text-anchor="middle" font-weight="bold">IRRIGATION</text><text x="317" y="148" font-size="7.5" fill="#5A5A5A" text-anchor="middle">dams, canals,</text><text x="317" y="158" font-size="7.5" fill="#5A5A5A" text-anchor="middle">weirs, barrages</text><rect x="52" y="176" width="256" height="34" rx="3" fill="#FFF8E1" stroke="#B66A00" stroke-width="1.3"/><text x="180" y="190" font-size="8.5" fill="#272134" text-anchor="middle" font-weight="bold">Same materials - brick, cement, steel, stone -</text><text x="180" y="202" font-size="8.5" fill="#272134" text-anchor="middle">serve all four fields; only the structure changes.</text></svg>