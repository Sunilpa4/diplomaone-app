<svg xmlns="http://www.w3.org/2000/svg" width="360" height="260" viewBox="0 0 360 260" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="260" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Coarse aggregate classified by size</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 2.6: the 4.75 mm line and the 80/40/20/10 mm sizes in use</text><text x="14" y="62" font-size="8" fill="#5A5A5A" text-anchor="start">mm</text><rect x="14" y="78" width="40" height="40" rx="3" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.4"/><text x="34.0" y="94" font-size="8.5" fill="#2F5D8A" text-anchor="middle" font-weight="bold">SAND</text><text x="34.0" y="108" font-size="7" fill="#272134" text-anchor="middle">up to 4.75</text><rect x="54" y="78" width="58" height="40" rx="3" fill="#E3F2FD" stroke="#2F5D8A" stroke-width="1.4"/><text x="83.0" y="94" font-size="8.5" fill="#2F5D8A" text-anchor="middle" font-weight="bold">10 mm</text><text x="83.0" y="108" font-size="7" fill="#272134" text-anchor="middle">up to 10</text><rect x="112" y="78" width="66" height="40" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.4"/><text x="145.0" y="94" font-size="8.5" fill="#2E7D32" text-anchor="middle" font-weight="bold">20 mm</text><text x="145.0" y="108" font-size="7" fill="#272134" text-anchor="middle">up to 20</text><rect x="178" y="78" width="74" height="40" rx="3" fill="#FFF3E0" stroke="#B66A00" stroke-width="1.4"/><text x="215.0" y="94" font-size="8.5" fill="#B66A00" text-anchor="middle" font-weight="bold">40 mm</text><text x="215.0" y="108" font-size="7" fill="#272134" text-anchor="middle">up to 40</text><rect x="252" y="78" width="82" height="40" rx="3" fill="#FCE4ED" stroke="#AD1457" stroke-width="1.4"/><text x="293.0" y="94" font-size="8.5" fill="#AD1457" text-anchor="middle" font-weight="bold">80 mm</text><text x="293.0" y="108" font-size="7" fill="#272134" text-anchor="middle">up to 80</text><line x1="14" y1="128" x2="342" y2="128" stroke="#5A5A5A" stroke-width="1.0"/><text x="14" y="142" font-size="7.5" fill="#2F5D8A" text-anchor="start">fine aggregate (below 4.75 mm)</text><text x="346" y="142" font-size="7.5" fill="#AD1457" text-anchor="end">coarse aggregate (4.75-80 mm)</text><text x="20" y="162" font-size="8" fill="#272134" text-anchor="start">• 10 mm: thin RCC members, closely spaced bars</text><text x="20" y="175" font-size="8" fill="#272134" text-anchor="start">• 20 mm: normal RCC (slabs, beams, columns) - the standard size</text><text x="20" y="188" font-size="8" fill="#272134" text-anchor="start">• 40 mm: PCC, foundations, road work, large sections</text><text x="20" y="201" font-size="8" fill="#272134" text-anchor="start">• 80 mm: mass concrete - dams, heavy foundations, retaining walls</text><rect x="38" y="220" width="284" height="32" rx="3" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.3"/><text x="180" y="233" font-size="8.5" fill="#272134" text-anchor="middle" font-weight="bold">Rule: biggest size that fits between bars and cover -</text><text x="180" y="245" font-size="8.5" fill="#272134" text-anchor="middle">larger aggregate = less cement paste needed = economical.</text></svg>