<svg xmlns="http://www.w3.org/2000/svg" width="360" height="246" viewBox="0 0 360 246" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="246" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Structure of timber - section of a log</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 2.2: parts seen on the cut face of a tree trunk</text><circle cx="128" cy="128" r="62" fill="#6D4226" stroke="#8D5A2B" stroke-width="1.0"/><circle cx="128" cy="128" r="56" fill="#C89B6A" stroke="#8D5A2B" stroke-width="1.0"/><circle cx="128" cy="128" r="48" fill="#E9CD9F" stroke="#8D5A2B" stroke-width="1.0"/><circle cx="128" cy="128" r="34" fill="#D9AE72" stroke="#8D5A2B" stroke-width="1.0"/><circle cx="128" cy="128" r="10" fill="#B9834E" stroke="#8D5A2B" stroke-width="1.0"/><circle cx="128" cy="128" r="20" fill="none" stroke="#A97B4A" stroke-width="0.6"/><circle cx="128" cy="128" r="26" fill="none" stroke="#A97B4A" stroke-width="0.6"/><circle cx="128" cy="128" r="41" fill="none" stroke="#A97B4A" stroke-width="0.6"/><circle cx="128" cy="128" r="3" fill="#5D3A1A" stroke="#5D3A1A" stroke-width="1.0"/><line x1="128" y1="128" x2="188" y2="78" stroke="#8D5A2B" stroke-width="0.9"/><line x1="128" y1="128" x2="76" y2="92" stroke="#8D5A2B" stroke-width="0.9"/><line x1="128" y1="128" x2="196" y2="172" stroke="#8D5A2B" stroke-width="0.9"/><line x1="128" y1="128" x2="70" y2="168" stroke="#8D5A2B" stroke-width="0.9"/><line x1="176" y1="49" x2="192" y2="49" stroke="#5A5A5A" stroke-width="0.9"/><text x="196" y="52" font-size="8" fill="#272134" text-anchor="start">bark (protective skin)</text><line x1="176" y1="73" x2="192" y2="73" stroke="#5A5A5A" stroke-width="0.9"/><text x="196" y="76" font-size="8" fill="#272134" text-anchor="start">cambium (growth layer)</text><line x1="176" y1="97" x2="192" y2="97" stroke="#5A5A5A" stroke-width="0.9"/><text x="196" y="100" font-size="8" fill="#272134" text-anchor="start">sapwood (young, light)</text><line x1="176" y1="121" x2="192" y2="121" stroke="#5A5A5A" stroke-width="0.9"/><text x="196" y="124" font-size="8" fill="#272134" text-anchor="start">annual rings (1 = 1 year)</text><line x1="176" y1="145" x2="192" y2="145" stroke="#5A5A5A" stroke-width="0.9"/><text x="196" y="148" font-size="8" fill="#272134" text-anchor="start">heartwood (old, strong)</text><line x1="176" y1="169" x2="192" y2="169" stroke="#5A5A5A" stroke-width="0.9"/><text x="196" y="172" font-size="8" fill="#272134" text-anchor="start">medullary rays (food lines)</text><line x1="176" y1="193" x2="192" y2="193" stroke="#5A5A5A" stroke-width="0.9"/><text x="196" y="196" font-size="8" fill="#272134" text-anchor="start">pith (first growth, centre)</text><rect x="36" y="208" width="288" height="30" rx="3" fill="#F3E2C7" stroke="#8D5A2B" stroke-width="1.3"/><text x="180" y="220" font-size="8.5" fill="#272134" text-anchor="middle" font-weight="bold">Heartwood is the working timber: darker, drier, stronger.</text><text x="180" y="231" font-size="8" fill="#272134" text-anchor="middle">Sapwood decays fast and is attacked by insects - avoid for work.</text></svg>