<svg xmlns="http://www.w3.org/2000/svg" width="360" height="296" viewBox="0 0 360 296" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="296" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Geosynthetics at work and the ferrocement idea</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Cards 5.5: special processed materials in section</text><text x="92" y="56" font-size="8.5" fill="#00897B" text-anchor="middle" font-weight="bold">ROAD ON SOFT SOIL (section)</text><rect x="20" y="66" width="144" height="14" rx="3" fill="#EFEBE9" stroke="#5A5A5A" stroke-width="1.0"/><text x="92" y="76" font-size="7" fill="#272134" text-anchor="middle">road crust (aggregate)</text><rect x="20" y="82" width="144" height="7" rx="3" fill="#E0F2F1" stroke="#00897B" stroke-width="1.2"/><text x="92" y="88" font-size="6.5" fill="#00897B" text-anchor="middle" font-weight="bold">GEOTEXTILE</text><rect x="20" y="91" width="144" height="26" rx="3" fill="#D7CCC8" stroke="#5A5A5A" stroke-width="1.0"/><text x="92" y="102" font-size="7" fill="#272134" text-anchor="middle">soft soil (would swallow stone)</text><text x="92" y="112" font-size="6.8" fill="#5A5A5A" text-anchor="middle">without separation</text><text x="92" y="132" font-size="7.3" fill="#272134" text-anchor="middle">fabric separates + filters +</text><text x="92" y="142" font-size="7.3" fill="#272134" text-anchor="middle">reinforces: road lasts longer</text><text x="268" y="56" font-size="8.5" fill="#B66A00" text-anchor="middle" font-weight="bold">FERROCEMENT (thin section)</text><rect x="206" y="66" width="124" height="50" rx="3" fill="#FDEBD7" stroke="#B66A00" stroke-width="1.3"/><line x1="212" y1="70" x2="212" y2="112" stroke="#B66A00" stroke-width="0.5"/><line x1="222" y1="70" x2="222" y2="112" stroke="#B66A00" stroke-width="0.5"/><line x1="232" y1="70" x2="232" y2="112" stroke="#B66A00" stroke-width="0.5"/><line x1="242" y1="70" x2="242" y2="112" stroke="#B66A00" stroke-width="0.5"/><line x1="252" y1="70" x2="252" y2="112" stroke="#B66A00" stroke-width="0.5"/><line x1="262" y1="70" x2="262" y2="112" stroke="#B66A00" stroke-width="0.5"/><line x1="272" y1="70" x2="272" y2="112" stroke="#B66A00" stroke-width="0.5"/><line x1="282" y1="70" x2="282" y2="112" stroke="#B66A00" stroke-width="0.5"/><line x1="292" y1="70" x2="292" y2="112" stroke="#B66A00" stroke-width="0.5"/><line x1="302" y1="70" x2="302" y2="112" stroke="#B66A00" stroke-width="0.5"/><line x1="312" y1="70" x2="312" y2="112" stroke="#B66A00" stroke-width="0.5"/><line x1="322" y1="70" x2="322" y2="112" stroke="#B66A00" stroke-width="0.5"/><line x1="208" y1="76" x2="328" y2="76" stroke="#B66A00" stroke-width="0.9"/><line x1="208" y1="88" x2="328" y2="88" stroke="#B66A00" stroke-width="0.9"/><line x1="208" y1="100" x2="328" y2="100" stroke="#B66A00" stroke-width="0.9"/><text x="268" y="130" font-size="7.3" fill="#272134" text-anchor="middle">layers of fine wire mesh in</text><text x="268" y="140" font-size="7.3" fill="#272134" text-anchor="middle">rich cement mortar (10-30 mm total)</text><text x="268" y="152" font-size="7.3" fill="#272134" text-anchor="middle">water tanks, boats, thin shells, repair jackets</text><text x="20" y="172" font-size="7.6" fill="#00897B" text-anchor="start" font-weight="bold">GEOMEMBRANE</text><text x="20" y="182" font-size="6.9" fill="#272134" text-anchor="start">pond, canal &amp; landfill lining (water barrier)</text><text x="20" y="196" font-size="7.6" fill="#00897B" text-anchor="start" font-weight="bold">GEOGRID</text><text x="20" y="206" font-size="6.9" fill="#272134" text-anchor="start">steep slopes, retaining walls (soil reinforcement)</text><text x="20" y="220" font-size="7.6" fill="#00897B" text-anchor="start" font-weight="bold">GEOCOMPOSITE</text><text x="20" y="230" font-size="6.9" fill="#272134" text-anchor="start">behind walls &amp; under roads (drainage + filter)</text><text x="20" y="244" font-size="7.6" fill="#00897B" text-anchor="start" font-weight="bold">ARTIFICIAL SAND (M-sand)</text><text x="20" y="254" font-size="6.9" fill="#272134" text-anchor="start">crushed-rock sand replacing river sand in concrete &amp; plaster</text><text x="20" y="268" font-size="7.6" fill="#00897B" text-anchor="start" font-weight="bold">ARTIFICIAL TIMBER</text><text x="20" y="278" font-size="6.9" fill="#272134" text-anchor="start">WPC/PVC boards &amp; sections replacing wood doors, frames, furniture</text></svg>