<svg xmlns="http://www.w3.org/2000/svg" width="360" height="222" viewBox="0 0 360 222" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="222" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Broad classification of construction materials</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 1.3: the five classes named in the syllabus</text><rect x="86" y="50" width="188" height="28" rx="3" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.6"/><text x="180" y="68" font-size="9.5" fill="#2F5D8A" text-anchor="middle" font-weight="bold">CONSTRUCTION MATERIALS</text><line x1="180" y1="78" x2="36" y2="96" stroke="#5A5A5A" stroke-width="1.1"/><rect x="8" y="96" width="58" height="66" rx="3" fill="#ffffff" stroke="#2F5D8A" stroke-width="1.3"/><text x="37" y="110" font-size="7.5" fill="#2F5D8A" text-anchor="middle" font-weight="bold">NATURAL</text><text x="37" y="124" font-size="6.8" fill="#272134" text-anchor="middle">stone, timber,</text><text x="37" y="135" font-size="6.8" fill="#272134" text-anchor="middle">lime, sand,</text><text x="37" y="146" font-size="6.8" fill="#272134" text-anchor="middle">aggregates,</text><text x="37" y="157" font-size="6.8" fill="#272134" text-anchor="middle">bitumen</text><line x1="180" y1="78" x2="108" y2="96" stroke="#5A5A5A" stroke-width="1.1"/><rect x="80" y="96" width="58" height="66" rx="3" fill="#ffffff" stroke="#B66A00" stroke-width="1.3"/><text x="109" y="110" font-size="7.5" fill="#B66A00" text-anchor="middle" font-weight="bold">ARTIFICIAL</text><text x="109" y="124" font-size="6.8" fill="#272134" text-anchor="middle">bricks, cement,</text><text x="109" y="135" font-size="6.8" fill="#272134" text-anchor="middle">tiles, glass,</text><text x="109" y="146" font-size="6.8" fill="#272134" text-anchor="middle">plywood, metals</text><line x1="180" y1="78" x2="180" y2="96" stroke="#5A5A5A" stroke-width="1.1"/><rect x="152" y="96" width="58" height="66" rx="3" fill="#ffffff" stroke="#BD2543" stroke-width="1.3"/><text x="181" y="110" font-size="7.5" fill="#BD2543" text-anchor="middle" font-weight="bold">SPECIAL</text><text x="181" y="124" font-size="6.8" fill="#272134" text-anchor="middle">waterproofing,</text><text x="181" y="135" font-size="6.8" fill="#272134" text-anchor="middle">insulation,</text><text x="181" y="146" font-size="6.8" fill="#272134" text-anchor="middle">termite proofing</text><line x1="180" y1="78" x2="252" y2="96" stroke="#5A5A5A" stroke-width="1.1"/><rect x="224" y="96" width="58" height="66" rx="3" fill="#ffffff" stroke="#2E7D32" stroke-width="1.3"/><text x="253" y="110" font-size="7.5" fill="#2E7D32" text-anchor="middle" font-weight="bold">FINISHING</text><text x="253" y="124" font-size="6.8" fill="#272134" text-anchor="middle">paints, POP,</text><text x="253" y="135" font-size="6.8" fill="#272134" text-anchor="middle">distemper,</text><text x="253" y="146" font-size="6.8" fill="#272134" text-anchor="middle">varnish, tiles</text><line x1="180" y1="78" x2="324" y2="96" stroke="#5A5A5A" stroke-width="1.1"/><rect x="296" y="96" width="58" height="66" rx="3" fill="#ffffff" stroke="#00897B" stroke-width="1.3"/><text x="325" y="110" font-size="7.5" fill="#00897B" text-anchor="middle" font-weight="bold">RECYCLED</text><text x="325" y="124" font-size="6.8" fill="#272134" text-anchor="middle">fly ash, slag,</text><text x="325" y="135" font-size="6.8" fill="#272134" text-anchor="middle">marble waste,</text><text x="325" y="146" font-size="6.8" fill="#272134" text-anchor="middle">rice husk, coir</text><rect x="52" y="178" width="256" height="34" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.3"/><text x="180" y="192" font-size="8.5" fill="#272134" text-anchor="middle" font-weight="bold">Units 2-5 follow this same order - natural, artificial,</text><text x="180" y="204" font-size="8.5" fill="#272134" text-anchor="middle">special and processed/finishing materials.</text></svg>