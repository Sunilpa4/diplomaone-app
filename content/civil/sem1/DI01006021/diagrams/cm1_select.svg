<svg xmlns="http://www.w3.org/2000/svg" width="360" height="226" viewBox="0 0 360 226" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="226" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">On what basis is a material selected?</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 1.2: the four selection factors of the syllabus</text><rect x="100" y="52" width="160" height="30" rx="3" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.6"/><text x="180" y="71" font-size="10.5" fill="#2F5D8A" text-anchor="middle" font-weight="bold">MATERIAL SELECTION</text><line x1="180" y1="84" x2="54" y2="100" stroke="#5A5A5A" stroke-width="1.1"/><rect x="14" y="100" width="80" height="64" rx="3" fill="#ffffff" stroke="#2F5D8A" stroke-width="1.4"/><text x="54" y="114" font-size="8" fill="#2F5D8A" text-anchor="middle" font-weight="bold">STRENGTH</text><text x="54" y="128" font-size="7.3" fill="#272134" text-anchor="middle">must carry loads</text><text x="54" y="139" font-size="7.3" fill="#272134" text-anchor="middle">safely: compressive,</text><text x="54" y="150" font-size="7.3" fill="#272134" text-anchor="middle">tensile, shear</text><line x1="180" y1="84" x2="138" y2="100" stroke="#5A5A5A" stroke-width="1.1"/><rect x="98" y="100" width="80" height="64" rx="3" fill="#ffffff" stroke="#2E7D32" stroke-width="1.4"/><text x="138" y="114" font-size="8" fill="#2E7D32" text-anchor="middle" font-weight="bold">DURABILITY</text><text x="138" y="128" font-size="7.3" fill="#272134" text-anchor="middle">must last against</text><text x="138" y="139" font-size="7.3" fill="#272134" text-anchor="middle">weather, water,</text><text x="138" y="150" font-size="7.3" fill="#272134" text-anchor="middle">chemicals, wear</text><line x1="180" y1="84" x2="222" y2="100" stroke="#5A5A5A" stroke-width="1.1"/><rect x="182" y="100" width="80" height="64" rx="3" fill="#ffffff" stroke="#00897B" stroke-width="1.4"/><text x="222" y="114" font-size="8" fill="#00897B" text-anchor="middle" font-weight="bold">ECO-FRIENDLY</text><text x="222" y="128" font-size="7.3" fill="#272134" text-anchor="middle">low pollution,</text><text x="222" y="139" font-size="7.3" fill="#272134" text-anchor="middle">recyclable, local,</text><text x="222" y="150" font-size="7.3" fill="#272134" text-anchor="middle">less energy to make</text><line x1="180" y1="84" x2="306" y2="100" stroke="#5A5A5A" stroke-width="1.1"/><rect x="266" y="100" width="80" height="64" rx="3" fill="#ffffff" stroke="#B66A00" stroke-width="1.4"/><text x="306" y="114" font-size="8" fill="#B66A00" text-anchor="middle" font-weight="bold">ECONOMY</text><text x="306" y="128" font-size="7.3" fill="#272134" text-anchor="middle">lowest total cost:</text><text x="306" y="139" font-size="7.3" fill="#272134" text-anchor="middle">material + transport</text><text x="306" y="150" font-size="7.3" fill="#272134" text-anchor="middle">+ labour + upkeep</text><rect x="38" y="180" width="284" height="36" rx="3" fill="#FDEBD7" stroke="#B66A00" stroke-width="1.3"/><text x="180" y="194" font-size="8.5" fill="#272134" text-anchor="middle" font-weight="bold">No material wins on all four - the engineer balances them</text><text x="180" y="206" font-size="8.5" fill="#272134" text-anchor="middle">for the structure, site and budget in hand.</text></svg>