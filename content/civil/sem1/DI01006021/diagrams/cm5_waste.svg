<svg xmlns="http://www.w3.org/2000/svg" width="360" height="252" viewBox="0 0 360 252" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="252" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Waste into building material - industrial and Agro</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Cards 5.3-5.4: who gives the waste, what it becomes</text><rect x="14" y="56" width="160" height="26" rx="3" fill="#ffffff" stroke="#2F5D8A" stroke-width="1.4"/><text x="94" y="73" font-size="8.5" fill="#2F5D8A" text-anchor="middle" font-weight="bold">INDUSTRIAL WASTE</text><text x="18" y="92" font-size="7.8" fill="#2F5D8A" text-anchor="start" font-weight="bold">fly ash (power plants)</text><text x="18" y="103" font-size="6.9" fill="#272134" text-anchor="start">bricks,</text><text x="18" y="113" font-size="6.9" fill="#272134" text-anchor="start">PPC cement, blocks, road embankment</text><text x="18" y="130" font-size="7.8" fill="#2F5D8A" text-anchor="start" font-weight="bold">blast-furnace slag</text><text x="18" y="141" font-size="6.9" fill="#272134" text-anchor="start">slag cement (PSC),</text><text x="18" y="151" font-size="6.9" fill="#272134" text-anchor="start">blocks, road base, aggregate</text><text x="18" y="168" font-size="7.8" fill="#2F5D8A" text-anchor="start" font-weight="bold">granite / marble waste</text><text x="18" y="179" font-size="6.9" fill="#272134" text-anchor="start">tiles,</text><text x="18" y="189" font-size="6.9" fill="#272134" text-anchor="start">terrazzo, mortar filler, paver &amp; blocks</text><rect x="186" y="56" width="160" height="26" rx="3" fill="#ffffff" stroke="#2E7D32" stroke-width="1.4"/><text x="266" y="73" font-size="8.5" fill="#2E7D32" text-anchor="middle" font-weight="bold">AGRO WASTE</text><text x="190" y="92" font-size="7.8" fill="#2E7D32" text-anchor="start" font-weight="bold">rice husk &amp; husk ash</text><text x="190" y="103" font-size="6.9" fill="#272134" text-anchor="start">ash as pozzolana; boards; silica &amp; fuel for kilns</text><text x="190" y="113" font-size="6.9" fill="#272134" text-anchor="start"></text><text x="190" y="130" font-size="7.8" fill="#2E7D32" text-anchor="start" font-weight="bold">bagasse (sugarcane)</text><text x="190" y="141" font-size="6.9" fill="#272134" text-anchor="start">particle &amp; fibre boards,</text><text x="190" y="151" font-size="6.9" fill="#272134" text-anchor="start">panels, paper</text><text x="190" y="168" font-size="7.8" fill="#2E7D32" text-anchor="start" font-weight="bold">coir (coconut fibre)</text><text x="190" y="179" font-size="6.9" fill="#272134" text-anchor="start">mats,</text><text x="190" y="189" font-size="6.9" fill="#272134" text-anchor="start">ropes, coir geotextiles, boards, mattresses</text><rect x="18" y="212" width="324" height="32" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.3"/><text x="180" y="225" font-size="8.5" fill="#272134" text-anchor="middle" font-weight="bold">One idea: one industry's waste is another's raw material -</text><text x="180" y="237" font-size="8.5" fill="#272134" text-anchor="middle">saving clay, stone and landfill together.</text></svg>