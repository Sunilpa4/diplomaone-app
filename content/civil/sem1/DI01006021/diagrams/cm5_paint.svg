<svg xmlns="http://www.w3.org/2000/svg" width="360" height="236" viewBox="0 0 360 236" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="236" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">The paint system on a wall</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 5.2: layers of one paint job; paints chosen by situation</text><rect x="28" y="62" width="170" height="17" rx="3" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="1.0"/><text x="113" y="74" font-size="7" fill="#272134" text-anchor="middle">2 coats PAINT (colour + protection)</text><rect x="28" y="81" width="170" height="17" rx="3" fill="#ffffff" stroke="#2F5D8A" stroke-width="1.0"/><text x="113" y="93" font-size="7" fill="#272134" text-anchor="middle">1 coat PRIMER (grip + sealing)</text><rect x="28" y="100" width="170" height="17" rx="3" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.0"/><text x="113" y="112" font-size="7" fill="#272134" text-anchor="middle">wall PUTTY (levels the surface)</text><rect x="28" y="119" width="170" height="17" rx="3" fill="#EFEBE9" stroke="#5A5A5A" stroke-width="1.0"/><text x="113" y="131" font-size="7" fill="#272134" text-anchor="middle">PLASTER on masonry</text><text x="113" y="146" font-size="7.3" fill="#5A5A5A" text-anchor="middle">outside → in: every coat has one job</text><text x="210" y="66" font-size="7.8" fill="#6A1B9A" text-anchor="start" font-weight="bold">WHITEWASH</text><text x="210" y="77" font-size="6.9" fill="#272134" text-anchor="start">fresh white, cheap; village sheds, godowns</text><text x="210" y="93" font-size="7.8" fill="#6A1B9A" text-anchor="start" font-weight="bold">CEMENT PAINT</text><text x="210" y="104" font-size="6.9" fill="#272134" text-anchor="start">damp-prone outer walls; matt, cures hard</text><text x="210" y="120" font-size="7.8" fill="#6A1B9A" text-anchor="start" font-weight="bold">DISTEMPER</text><text x="210" y="131" font-size="6.9" fill="#272134" text-anchor="start">dry interiors, ceilings; not washable</text><text x="210" y="147" font-size="7.8" fill="#6A1B9A" text-anchor="start" font-weight="bold">OIL / ENAMEL PAINT</text><text x="210" y="158" font-size="6.9" fill="#272134" text-anchor="start">wood &amp; steel: doors, grills; glossy, washable</text><text x="210" y="174" font-size="7.8" fill="#6A1B9A" text-anchor="start" font-weight="bold">VARNISH</text><text x="210" y="185" font-size="6.9" fill="#272134" text-anchor="start">clear film on wood - shows grain, no colour</text><rect x="28" y="196" width="304" height="32" rx="3" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="1.3"/><text x="180" y="209" font-size="8.5" fill="#272134" text-anchor="middle" font-weight="bold">Paint fails from below: damp wall, skipped primer, dusty putty.</text><text x="180" y="221" font-size="8.5" fill="#272134" text-anchor="middle">Preparation is half the paint job.</text></svg>