<svg xmlns="http://www.w3.org/2000/svg" width="360" height="258" viewBox="0 0 360 258" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="258" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Where waterproofing goes</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 4.1: waterproofing types are chosen by location</text><text x="84" y="54" font-size="8.5" fill="#2F5D8A" text-anchor="middle" font-weight="bold">TERRACE / ROOF (from top)</text><rect x="16" y="60" width="142" height="15" rx="3" fill="#ffffff" stroke="#2F5D8A" stroke-width="0.9"/><text x="87.0" y="71" font-size="7" fill="#272134" text-anchor="middle">tiles / China mosaic</text><rect x="16" y="76" width="142" height="15" rx="3" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="0.9"/><text x="87.0" y="87" font-size="7" fill="#272134" text-anchor="middle">protection screed (to drain)</text><rect x="16" y="92" width="142" height="15" rx="3" fill="#E0F2F1" stroke="#00897B" stroke-width="0.9"/><text x="87.0" y="103" font-size="7" fill="#272134" text-anchor="middle">WATERPROOF MEMBRANE / COAT</text><rect x="16" y="108" width="142" height="15" rx="3" fill="#CFD8DC" stroke="#5A5A5A" stroke-width="0.9"/><text x="87.0" y="119" font-size="7" fill="#272134" text-anchor="middle">RCC slab</text><text x="87" y="138" font-size="7.3" fill="#5A5A5A" text-anchor="middle">membrane protected from sun &amp; feet</text><text x="278" y="54" font-size="8.5" fill="#B66A00" text-anchor="middle" font-weight="bold">BATHROOM / WC (sunken)</text><rect x="202" y="60" width="142" height="15" rx="3" fill="#ffffff" stroke="#B66A00" stroke-width="0.9"/><text x="273.0" y="71" font-size="7" fill="#272134" text-anchor="middle">tiles on sunken slab (slope)</text><rect x="202" y="76" width="142" height="15" rx="3" fill="#FDEBD7" stroke="#B66A00" stroke-width="0.9"/><text x="273.0" y="87" font-size="7" fill="#272134" text-anchor="middle">WATERPROOF COAT + skirting</text><rect x="202" y="92" width="142" height="15" rx="3" fill="#FFE0B2" stroke="#B66A00" stroke-width="0.9"/><text x="273.0" y="103" font-size="7" fill="#272134" text-anchor="middle">filling (lightweight) over coat</text><rect x="202" y="108" width="142" height="15" rx="3" fill="#CFD8DC" stroke="#5A5A5A" stroke-width="0.9"/><text x="273.0" y="119" font-size="7" fill="#272134" text-anchor="middle">RCC sunken slab</text><text x="273" y="138" font-size="7.3" fill="#5A5A5A" text-anchor="middle">coat turns UP the wall 150-300 mm</text><rect x="24" y="156" width="314" height="52" rx="3" fill="#ffffff" stroke="#2F5D8A" stroke-width="1.3"/><text x="181" y="170" font-size="8.5" fill="#2F5D8A" text-anchor="middle" font-weight="bold">BASEMENT / WATER TANK - 'box' waterproofing (tanking)</text><text x="181" y="184" font-size="8" fill="#272134" text-anchor="middle">waterproof layer on the water-facing side, under floor and up walls,</text><text x="181" y="196" font-size="8" fill="#272134" text-anchor="middle">so water pressure presses it TIGHTER instead of peeling it.</text><rect x="30" y="218" width="300" height="32" rx="3" fill="#E0F2F1" stroke="#00897B" stroke-width="1.3"/><text x="180" y="231" font-size="8.5" fill="#272134" text-anchor="middle" font-weight="bold">One rule everywhere: stop water at its entry face,</text><text x="180" y="243" font-size="8.5" fill="#272134" text-anchor="middle">and never trap it inside the structure.</text></svg>