<svg xmlns="http://www.w3.org/2000/svg" width="360" height="234" viewBox="0 0 360 234" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="234" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Pre-cast concrete blocks - hollow, solid, paver</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 3.4: the three block families of the syllabus</text><rect x="16" y="66" width="100" height="56" rx="3" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.6"/><rect x="30" y="78" width="30" height="32" rx="3" fill="#ffffff" stroke="#2F5D8A" stroke-width="1.2"/><rect x="72" y="78" width="30" height="32" rx="3" fill="#ffffff" stroke="#2F5D8A" stroke-width="1.2"/><text x="66" y="140" font-size="8.5" fill="#2F5D8A" text-anchor="middle" font-weight="bold">HOLLOW BLOCK</text><text x="66" y="152" font-size="7.3" fill="#272134" text-anchor="middle">400×200×200 mm class;</text><text x="66" y="162" font-size="7.3" fill="#272134" text-anchor="middle">light, insulating walls</text><rect x="132" y="66" width="100" height="56" rx="3" fill="#B0BEC5" stroke="#2F5D8A" stroke-width="1.6"/><text x="182" y="140" font-size="8.5" fill="#2F5D8A" text-anchor="middle" font-weight="bold">SOLID BLOCK</text><text x="182" y="152" font-size="7.3" fill="#272134" text-anchor="middle">load-bearing walls,</text><text x="182" y="162" font-size="7.3" fill="#272134" text-anchor="middle">foundations, retaining</text><path d="M252 96 l14-12 l14 12 l-6 22 l-16 0 l-6-22 Z" fill="#ffffff" stroke="#B66A00" stroke-width="1.3"/><path d="M282 96 l14-12 l14 12 l-6 22 l-16 0 l-6-22 Z" fill="#FDEBD7" stroke="#B66A00" stroke-width="1.3"/><path d="M312 96 l14-12 l14 12 l-6 22 l-16 0 l-6-22 Z" fill="#ffffff" stroke="#B66A00" stroke-width="1.3"/><circle cx="296" cy="92" r="2.2" fill="#B66A00" stroke="#B66A00" stroke-width="1.0"/><text x="312" y="140" font-size="8.5" fill="#B66A00" text-anchor="middle" font-weight="bold">PAVER BLOCKS</text><text x="312" y="152" font-size="7.3" fill="#272134" text-anchor="middle">interlocking shapes;</text><text x="312" y="162" font-size="7.3" fill="#272134" text-anchor="middle">footpaths, parking, yards</text><rect x="30" y="182" width="300" height="44" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.3"/><text x="180" y="197" font-size="8.5" fill="#272134" text-anchor="middle" font-weight="bold">Precast = cast in factory, cured, brought ready: faster walls,</text><text x="180" y="210" font-size="8.5" fill="#272134" text-anchor="middle">no site moulding or burning; hollow cores cut weight &amp; heat flow.</text></svg>