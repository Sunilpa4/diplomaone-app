<svg xmlns="http://www.w3.org/2000/svg" width="360" height="242" viewBox="0 0 360 242" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="242" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Common building stones and where each is used</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 2.1: stones named with the good-stone requirements</text><rect x="12" y="56" width="108" height="62" rx="3" fill="#ffffff" stroke="#2F5D8A" stroke-width="1.4"/><text x="66" y="72" font-size="8.5" fill="#2F5D8A" text-anchor="middle" font-weight="bold">GRANITE</text><text x="66" y="85" font-size="7" fill="#5A5A5A" text-anchor="middle" font-style="italic">igneous</text><text x="66" y="99" font-size="7.3" fill="#272134" text-anchor="middle">foundations, plinth,</text><text x="66" y="110" font-size="7.3" fill="#272134" text-anchor="middle">steps, bridge piers</text><rect x="126" y="56" width="108" height="62" rx="3" fill="#ffffff" stroke="#B66A00" stroke-width="1.4"/><text x="180" y="72" font-size="8.5" fill="#B66A00" text-anchor="middle" font-weight="bold">BASALT / TRAP</text><text x="180" y="85" font-size="7" fill="#5A5A5A" text-anchor="middle" font-style="italic">igneous</text><text x="180" y="99" font-size="7.3" fill="#272134" text-anchor="middle">road metal, concrete</text><text x="180" y="110" font-size="7.3" fill="#272134" text-anchor="middle">aggregate, rubble work</text><rect x="240" y="56" width="108" height="62" rx="3" fill="#ffffff" stroke="#8D5A2B" stroke-width="1.4"/><text x="294" y="72" font-size="8.5" fill="#8D5A2B" text-anchor="middle" font-weight="bold">SANDSTONE</text><text x="294" y="85" font-size="7" fill="#5A5A5A" text-anchor="middle" font-style="italic">sedimentary</text><text x="294" y="99" font-size="7.3" fill="#272134" text-anchor="middle">ashlar walls, floors,</text><text x="294" y="110" font-size="7.3" fill="#272134" text-anchor="middle">carving (easy to dress)</text><rect x="12" y="128" width="108" height="62" rx="3" fill="#ffffff" stroke="#5A5A5A" stroke-width="1.4"/><text x="66" y="144" font-size="8.5" fill="#5A5A5A" text-anchor="middle" font-weight="bold">LIMESTONE</text><text x="66" y="157" font-size="7" fill="#5A5A5A" text-anchor="middle" font-style="italic">sedimentary</text><text x="66" y="171" font-size="7.3" fill="#272134" text-anchor="middle">floors; raw material</text><text x="66" y="182" font-size="7.3" fill="#272134" text-anchor="middle">for lime and cement</text><rect x="126" y="128" width="108" height="62" rx="3" fill="#ffffff" stroke="#7B1FA2" stroke-width="1.4"/><text x="180" y="144" font-size="8.5" fill="#7B1FA2" text-anchor="middle" font-weight="bold">MARBLE</text><text x="180" y="157" font-size="7" fill="#5A5A5A" text-anchor="middle" font-style="italic">metamorphic</text><text x="180" y="171" font-size="7.3" fill="#272134" text-anchor="middle">flooring, cladding,</text><text x="180" y="182" font-size="7.3" fill="#272134" text-anchor="middle">decorative work</text><rect x="240" y="128" width="108" height="62" rx="3" fill="#ffffff" stroke="#2E7D32" stroke-width="1.4"/><text x="294" y="144" font-size="8.5" fill="#2E7D32" text-anchor="middle" font-weight="bold">SLATE / LATERITE</text><text x="294" y="157" font-size="7" fill="#5A5A5A" text-anchor="middle" font-style="italic">meta. / residual</text><text x="294" y="171" font-size="7.3" fill="#272134" text-anchor="middle">slate: roofing, DPC;</text><text x="294" y="182" font-size="7.3" fill="#272134" text-anchor="middle">laterite: cheap walls</text><rect x="42" y="202" width="276" height="32" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.3"/><text x="180" y="215" font-size="8.5" fill="#272134" text-anchor="middle" font-weight="bold">Good stone in every case: strong, dense, low absorption,</text><text x="180" y="227" font-size="8.5" fill="#272134" text-anchor="middle">free from cracks and soft patches - checked at the quarry.</text></svg>