22" stroke="#5A5A5A" stroke-width="1.2"/><line x1="232" y1="66" x2="244" y2="66" stroke="#5A5A5A" stroke-width="1.2"/><line x1="232" y1="122" x2="244" y2="122" stroke="#5A5A5A" stroke-width="1.2"/><text x="238" y="158" font-size="8.5" fill="#272134" text-anchor="middle">90 mm</text><text x="180" y="54" font-size="9.5" fill="#AD1457" text-anchor="middle" font-weight="bold">MODULAR (STANDARD) BRICK  190 × 90 × 90 mm</text><rect x="18" y="178" width="300" height="58" rx="3" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.3"/><text x="168" y="193" font-size="8.5" fill="#272134" text-anchor="middle" font-weight="bold">+ 10 mm mortar joint → module 200 × 100 × 100 mm</text><text x="168" y="206" font-size="8.5" fill="#272134" text-anchor="middle">1 m³ brickwork ≈ 500 modular bricks - easy estimation!</text><text x="168" y="220" font-size="8" fill="#272134" text-anchor="middle">Traditional brick ≈ 230 × 115 × 75 mm (size varies by region)</text><text x="292" y="96" font-size="7.5" fill="#5A5A5A" text-anchor="start">frog holds</text><text x="292" y="106" font-size="7.5" fill="#5A5A5A" text-anchor="start">mortar key</text></svg>