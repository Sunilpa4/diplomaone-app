<svg xmlns="http://www.w3.org/2000/svg" width="360" height="236" viewBox="0 0 360 236" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="236" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Making bricks - burnt clay and fly ash routes</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Cards 3.1: manufacturing processes of the two bricks</text><rect x="8" y="56" width="82" height="44" rx="3" fill="#ffffff" stroke="#B66A00" stroke-width="1.4"/><text x="49.0" y="72" font-size="8" fill="#B66A00" text-anchor="middle" font-weight="bold">1 PREPARE</text><text x="49.0" y="85" font-size="7.2" fill="#272134" text-anchor="middle">dig, weather, blend,</text><text x="49.0" y="95" font-size="7.2" fill="#272134" text-anchor="middle">add water, pug-mill</text><rect x="98" y="56" width="82" height="44" rx="3" fill="#ffffff" stroke="#2F5D8A" stroke-width="1.4"/><text x="139.0" y="72" font-size="8" fill="#2F5D8A" text-anchor="middle" font-weight="bold">2 MOULD</text><text x="139.0" y="85" font-size="7.2" fill="#272134" text-anchor="middle">hand or machine</text><text x="139.0" y="95" font-size="7.2" fill="#272134" text-anchor="middle">moulding</text><rect x="188" y="56" width="82" height="44" rx="3" fill="#ffffff" stroke="#2E7D32" stroke-width="1.4"/><text x="229.0" y="72" font-size="8" fill="#2E7D32" text-anchor="middle" font-weight="bold">3 DRY</text><text x="229.0" y="85" font-size="7.2" fill="#272134" text-anchor="middle">stack in hacks,</text><text x="229.0" y="95" font-size="7.2" fill="#272134" text-anchor="middle">shade-dry 3-10 days</text><rect x="278" y="56" width="74" height="44" rx="3" fill="#ffffff" stroke="#AD1457" stroke-width="1.4"/><text x="315.0" y="72" font-size="8" fill="#AD1457" text-anchor="middle" font-weight="bold">4 BURN</text><text x="315.0" y="85" font-size="7.2" fill="#272134" text-anchor="middle">clamp or kiln,</text><text x="315.0" y="95" font-size="7.2" fill="#272134" text-anchor="middle">900-1100 °C</text><line x1="90" y1="78" x2="98" y2="78" stroke="#5A5A5A" stroke-width="1.6"/><path d="M94 74 l6 4 l-6 4" fill="none" stroke="#5A5A5A" stroke-width="1.4"/><line x1="180" y1="78" x2="188" y2="78" stroke="#5A5A5A" stroke-width="1.6"/><path d="M184 74 l6 4 l-6 4" fill="none" stroke="#5A5A5A" stroke-width="1.4"/><line x1="270" y1="78" x2="278" y2="78" stroke="#5A5A5A" stroke-width="1.6"/><path d="M274 74 l6 4 l-6 4" fill="none" stroke="#5A5A5A" stroke-width="1.4"/><text x="180" y="122" font-size="8.5" fill="#272134" text-anchor="middle" font-weight="bold">BURNT CLAY BRICK - four stages (quality is made at stages 1 and 4)</text><rect x="8" y="138" width="82" height="44" rx="3" fill="#ffffff" stroke="#00897B" stroke-width="1.4"/><text x="49.0" y="154" font-size="8" fill="#00897B" text-anchor="middle" font-weight="bold">FLY ASH: MIX</text><text x="49.0" y="167" font-size="7.2" fill="#272134" text-anchor="middle">ash + lime + sand</text><text x="49.0" y="177" font-size="7.2" fill="#272134" text-anchor="middle">+ gypsum + water</text><rect x="98" y="138" width="82" height="44" rx="3" fill="#ffffff" stroke="#00897B" stroke-width="1.4"/><text x="139.0" y="154" font-size="8" fill="#00897B" text-anchor="middle" font-weight="bold">PRESS</text><text x="139.0" y="167" font-size="7.2" fill="#272134" text-anchor="middle">machine pressing in</text><text x="139.0" y="177" font-size="7.2" fill="#272134" text-anchor="middle">steel moulds</text><rect x="188" y="138" width="82" height="44" rx="3" fill="#ffffff" stroke="#00897B" stroke-width="1.4"/><text x="229.0" y="154" font-size="8" fill="#00897B" text-anchor="middle" font-weight="bold">CURE</text><text x="229.0" y="167" font-size="7.2" fill="#272134" text-anchor="middle">water cure 14-21 days;</text><text x="229.0" y="177" font-size="7.2" fill="#272134" text-anchor="middle">NO burning, no kiln</text><rect x="278" y="138" width="74" height="44" rx="3" fill="#ffffff" stroke="#00897B" stroke-width="1.4"/><text x="315.0" y="154" font-size="8" fill="#00897B" text-anchor="middle" font-weight="bold">READY</text><text x="315.0" y="167" font-size="7.2" fill="#272134" text-anchor="middle">light, uniform,</text><text x="315.0" y="177" font-size="7.2" fill="#272134" text-anchor="middle">eco-friendly</text><line x1="90" y1="160" x2="98" y2="160" stroke="#5A5A5A" stroke-width="1.6"/><path d="M94 156 l6 4 l-6 4" fill="none" stroke="#5A5A5A" stroke-width="1.4"/><line x1="180" y1="160" x2="188" y2="160" stroke="#5A5A5A" stroke-width="1.6"/><path d="M184 156 l6 4 l-6 4" fill="none" stroke="#5A5A5A" stroke-width="1.4"/><line x1="270" y1="160" x2="278" y2="160" stroke="#5A5A5A" stroke-width="1.6"/><path d="M274 156 l6 4 l-6 4" fill="none" stroke="#5A5A5A" stroke-width="1.4"/><rect x="22" y="196" width="316" height="32" rx="3" fill="#FDEBD7" stroke="#B66A00" stroke-width="1.3"/><text x="180" y="209" font-size="8.5" fill="#272134" text-anchor="middle" font-weight="bold">Clay brick needs burning (fuel + smoke); fly-ash brick only curing -</text><text x="180" y="221" font-size="8.5" fill="#272134" text-anchor="middle">it consumes industrial waste instead of topsoil.</text></svg>