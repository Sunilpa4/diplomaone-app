<svg xmlns="http://www.w3.org/2000/svg" width="360" height="240" viewBox="0 0 360 240" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="240" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Plot, plinth, floor and carpet area - and FSI</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 2.4: the area words of building bye-laws</text><rect x="14" y="54" width="190" height="118" rx="3" fill="#ffffff" stroke="#2F5D8A" stroke-width="1.6"/><text x="109" y="48" font-size="7" fill="#272134" text-anchor="middle"></text><rect x="30" y="70" width="158" height="86" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.4"/><rect x="48" y="86" width="122" height="54" rx="3" fill="#FFF8E1" stroke="#B66A00" stroke-width="1.4"/><text x="109" y="66" font-size="8" fill="#2F5D8A" text-anchor="middle" font-weight="bold">PLOT AREA</text><text x="109" y="82" font-size="7.5" fill="#2E7D32" text-anchor="middle" font-weight="bold">BUILT-UP / PLINTH AREA</text><text x="109" y="112" font-size="8.5" fill="#B66A00" text-anchor="middle" font-weight="bold">CARPET AREA</text><text x="109" y="124" font-size="7" fill="#5A5A5A" text-anchor="middle">(usable floor inside walls)</text><text x="109" y="150" font-size="7.2" fill="#272134" text-anchor="middle">FLOOR AREA = built-up minus walls</text><text x="109" y="186" font-size="7" fill="#5A5A5A" text-anchor="middle">walls, bath, passages eat area - count honestly</text><rect x="220" y="54" width="126" height="118" rx="3" fill="#F3E5F5" stroke="#7B2CD9" stroke-width="1.4"/><text x="283" y="72" font-size="10" fill="#7B2CD9" text-anchor="middle" font-weight="bold">FSI / FAR</text><text x="283" y="90" font-size="8" fill="#272134" text-anchor="middle" font-weight="bold">FSI =</text><text x="283" y="103" font-size="7.5" fill="#272134" text-anchor="middle">total built-up area</text><line x1="238" y1="108" x2="328" y2="108" stroke="#272134" stroke-width="1.0"/><text x="283" y="120" font-size="7.5" fill="#272134" text-anchor="middle">plot area</text><text x="283" y="140" font-size="7.2" fill="#5A5A5A" text-anchor="middle">FSI 1.0 on 200 m2 plot</text><text x="283" y="152" font-size="7.2" fill="#5A5A5A" text-anchor="middle">allows 200 m2 total</text><text x="283" y="164" font-size="7.2" fill="#5A5A5A" text-anchor="middle">built-up, all floors</text><rect x="30" y="196" width="300" height="34" rx="3" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.3"/><text x="180" y="209" font-size="8" fill="#272134" text-anchor="middle" font-weight="bold">Super built-up adds shared areas - the sale number.</text><text x="180" y="221" font-size="8" fill="#272134" text-anchor="middle">Carpet is what the family actually lives on.</text></svg>