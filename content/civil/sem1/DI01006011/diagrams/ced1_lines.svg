<svg xmlns="http://www.w3.org/2000/svg" width="360" height="306" viewBox="0 0 360 306" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="306" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Types of lines - each dash is a word</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 1.4: standard line types of a civil drawing (IS 962 / SP 46 style)</text><line x1="16" y1="54" x2="138" y2="54" stroke="#272134" stroke-width="2.2"/><text x="146" y="57" font-size="7.8" fill="#2F5D8A" text-anchor="start" font-weight="bold">OBJECT / VISIBLE</text><text x="146" y="68" font-size="6.8" fill="#5A5A5A" text-anchor="start">thick solid - outline you can see</text><line x1="16" y1="83" x2="138" y2="83" stroke="#272134" stroke-width="1.5" stroke-dasharray="7 4"/><text x="146" y="86" font-size="7.8" fill="#2F5D8A" text-anchor="start" font-weight="bold">HIDDEN</text><text x="146" y="97" font-size="6.8" fill="#5A5A5A" text-anchor="start">medium dashed - edge hidden behind</text><line x1="16" y1="112" x2="138" y2="112" stroke="#272134" stroke-width="1.0" stroke-dasharray="16 4 4 4"/><text x="146" y="115" font-size="7.8" fill="#2F5D8A" text-anchor="start" font-weight="bold">CENTRE</text><text x="146" y="126" font-size="6.8" fill="#5A5A5A" text-anchor="start">chain: long-short - axes, centre lines</text><line x1="16" y1="141" x2="138" y2="141" stroke="#272134" stroke-width="1.8" stroke-dasharray="16 4 4 4"/><path d="M24 141 l0 -7 M24 141 l0 7" fill="none" stroke="#272134" stroke-width="1.6"/><path d="M130 141 l0 -7 M130 141 l0 7" fill="none" stroke="#272134" stroke-width="1.6"/><text x="146" y="144" font-size="7.8" fill="#2F5D8A" text-anchor="start" font-weight="bold">CUTTING PLANE</text><text x="146" y="155" font-size="6.8" fill="#5A5A5A" text-anchor="start">chain, thick ends - where section is cut</text><line x1="16" y1="170" x2="138" y2="170" stroke="#272134" stroke-width="0.9"/><polygon points="16,170 26,167 26,173" fill="#272134"/><polygon points="138,170 128,167 128,173" fill="#272134"/><text x="77" y="165" font-size="7.5" fill="#272134" text-anchor="middle" font-weight="bold">1200</text><text x="146" y="173" font-size="7.8" fill="#2F5D8A" text-anchor="start" font-weight="bold">DIMENSION</text><text x="146" y="184" font-size="6.8" fill="#5A5A5A" text-anchor="start">thin + arrowheads - carries the size figure</text><line x1="16" y1="199" x2="138" y2="199" stroke="#272134" stroke-width="0.9"/><text x="146" y="202" font-size="7.8" fill="#2F5D8A" text-anchor="start" font-weight="bold">EXTENSION</text><text x="146" y="213" font-size="6.8" fill="#5A5A5A" text-anchor="start">thin solid - projects feature to dimension</text><line x1="16" y1="228" x2="96" y2="228" stroke="#272134" stroke-width="0.9"/><path d="M96 228 L134 216" fill="none" stroke="#272134" stroke-width="0.9" marker-end="url(#ah)"/><text x="146" y="231" font-size="7.8" fill="#2F5D8A" text-anchor="start" font-weight="bold">LEADER / POINTER</text><text x="146" y="242" font-size="6.8" fill="#5A5A5A" text-anchor="start">thin + arrow to part - points to a note</text><line x1="16" y1="257" x2="138" y2="257" stroke="#272134" stroke-width="1.0" stroke-dasharray="18 4 4 4 4 4"/><text x="146" y="260" font-size="7.8" fill="#2F5D8A" text-anchor="start" font-weight="bold">PHANTOM</text><text x="146" y="271" font-size="6.8" fill="#5A5A5A" text-anchor="start">long + 2 short dashes - alternate / adjacent position</text><text x="180" y="290" font-size="8" fill="#272134" text-anchor="middle" font-weight="bold">Line type is meaning: the dash itself carries the message.</text></svg>