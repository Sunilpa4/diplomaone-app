<svg xmlns="http://www.w3.org/2000/svg" width="360" height="258" viewBox="0 0 360 258" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="258" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">From idea to building - types of drawings</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 1.1: the drawing family of one building job</text><rect x="16" y="52" width="205" height="32" rx="3" fill="#ffffff" stroke="#2F5D8A" stroke-width="1.5"/><text x="118" y="66" font-size="8.5" fill="#2F5D8A" text-anchor="middle" font-weight="bold">1. SKETCH / LINE PLAN</text><text x="118" y="77" font-size="7.2" fill="#272134" text-anchor="middle">idea on paper: rooms, sizes, relations</text><path d="M118 84 L118 94" fill="none" stroke="#5A5A5A" stroke-width="1.4" marker-end="url(#ah)"/><rect x="16" y="94" width="205" height="32" rx="3" fill="#ffffff" stroke="#7B2CD9" stroke-width="1.5"/><text x="118" y="108" font-size="8.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">2. PRESENTATION DRAWING</text><text x="118" y="119" font-size="7.2" fill="#272134" text-anchor="middle">client understands: neat plan + 3D view</text><path d="M118 126 L118 136" fill="none" stroke="#5A5A5A" stroke-width="1.4" marker-end="url(#ah)"/><rect x="16" y="136" width="205" height="32" rx="3" fill="#ffffff" stroke="#B66A00" stroke-width="1.5"/><text x="118" y="150" font-size="8.5" fill="#B66A00" text-anchor="middle" font-weight="bold">3. SUBMISSION DRAWING</text><text x="118" y="161" font-size="7.2" fill="#272134" text-anchor="middle">authority approval: site, plan, area, FSI</text><path d="M118 168 L118 178" fill="none" stroke="#5A5A5A" stroke-width="1.4" marker-end="url(#ah)"/><rect x="16" y="178" width="205" height="32" rx="3" fill="#ffffff" stroke="#2E7D32" stroke-width="1.5"/><text x="118" y="192" font-size="8.5" fill="#2E7D32" text-anchor="middle" font-weight="bold">4. WORKING DRAWING</text><text x="118" y="203" font-size="7.2" fill="#272134" text-anchor="middle">site builds from it: full dimensions, sections</text><rect x="238" y="52" width="108" height="62" rx="3" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.3"/><text x="292" y="66" font-size="8" fill="#2F5D8A" text-anchor="middle" font-weight="bold">DETAIL / SHOP</text><text x="292" y="79" font-size="7.2" fill="#272134" text-anchor="middle">one part enlarged:</text><text x="292" y="90" font-size="7.2" fill="#272134" text-anchor="middle">door, stair, footing,</text><text x="292" y="101" font-size="7.2" fill="#272134" text-anchor="middle">reinforcement</text><line x1="221" y1="186" x2="238" y2="92" stroke="#5A5A5A" stroke-width="0.9"/><rect x="238" y="126" width="108" height="62" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.3"/><text x="292" y="140" font-size="8" fill="#2E7D32" text-anchor="middle" font-weight="bold">RECORD DRAWING</text><text x="292" y="153" font-size="7.2" fill="#272134" text-anchor="middle">as-built: what was</text><text x="292" y="164" font-size="7.2" fill="#272134" text-anchor="middle">actually built, for</text><text x="292" y="175" font-size="7.2" fill="#272134" text-anchor="middle">future repair work</text><line x1="221" y1="186" x2="238" y2="156" stroke="#5A5A5A" stroke-width="0.9"/><rect x="16" y="222" width="330" height="28" rx="3" fill="#FDEBD7" stroke="#B66A00" stroke-width="1.3"/><text x="180" y="239" font-size="8" fill="#272134" text-anchor="middle" font-weight="bold">The WORKING drawing must be complete, correct and clear.</text></svg>