<svg xmlns="http://www.w3.org/2000/svg" width="360" height="238" viewBox="0 0 360 238" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="238" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Principles of planning at work</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 2.3: aspect/orientation, grouping/privacy, circulation in one plan</text><rect x="14" y="56" width="120" height="86" rx="3" fill="#ffffff" stroke="#2F5D8A" stroke-width="1.4"/><path d="M22 74 L74 52 L126 74" fill="none" stroke="#B66A00" stroke-width="2.0"/><rect x="60" y="104" width="16" height="38" rx="3" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.1"/><rect x="28" y="88" width="16" height="14" rx="3" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.0"/><rect x="102" y="88" width="16" height="14" rx="3" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.0"/><circle cx="28" cy="56" r="9" fill="#FFF3D6" stroke="#B66A00" stroke-width="1.3"/><path d="M40 62 L54 74 M38 52 L56 64" fill="none" stroke="#B66A00" stroke-width="0.9"/><text x="74" y="154" font-size="8" fill="#2F5D8A" text-anchor="middle" font-weight="bold">ASPECT + ORIENTATION</text><text x="74" y="165" font-size="7" fill="#5A5A5A" text-anchor="middle">rooms placed for sun,</text><text x="74" y="175" font-size="7" fill="#5A5A5A" text-anchor="middle">air and prevailing wind</text><rect x="148" y="56" width="96" height="86" rx="3" fill="#ffffff" stroke="#2E7D32" stroke-width="1.4"/><rect x="156" y="66" width="38" height="28" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.0"/><text x="175" y="83" font-size="7" fill="#2E7D32" text-anchor="middle" font-weight="bold">LIV</text><rect x="198" y="66" width="38" height="28" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.0"/><text x="217" y="83" font-size="7" fill="#2E7D32" text-anchor="middle" font-weight="bold">KIT</text><rect x="156" y="100" width="38" height="28" rx="3" fill="#ffffff" stroke="#2E7D32" stroke-width="1.0"/><text x="175" y="117" font-size="7" fill="#2E7D32" text-anchor="middle" font-weight="bold">BED</text><rect x="198" y="100" width="38" height="28" rx="3" fill="#ffffff" stroke="#2E7D32" stroke-width="1.0"/><text x="217" y="117" font-size="7" fill="#2E7D32" text-anchor="middle" font-weight="bold">BATH</text><text x="196" y="154" font-size="8" fill="#2E7D32" text-anchor="middle" font-weight="bold">GROUPING + PRIVACY</text><text x="196" y="165" font-size="7" fill="#5A5A5A" text-anchor="middle">related rooms together,</text><text x="196" y="175" font-size="7" fill="#5A5A5A" text-anchor="middle">private rooms screened</text><rect x="258" y="56" width="88" height="86" rx="3" fill="#ffffff" stroke="#7B2CD9" stroke-width="1.4"/><path d="M268 130 L268 84 L302 84 L302 66" fill="none" stroke="#7B2CD9" stroke-width="2.0"/><path d="M302 66 l-6 2 l4 6 M268 84 l-2 7 l7 -1" fill="none" stroke="#7B2CD9" stroke-width="1.2"/><rect x="268" y="122" width="20" height="10" rx="3" fill="#F3E5F5" stroke="#7B2CD9" stroke-width="0.9"/><rect x="296" y="76" width="20" height="10" rx="3" fill="#F3E5F5" stroke="#7B2CD9" stroke-width="0.9"/><text x="302" y="154" font-size="8" fill="#7B2CD9" text-anchor="middle" font-weight="bold">CIRCULATION</text><text x="302" y="165" font-size="7" fill="#5A5A5A" text-anchor="middle">short, direct passages;</text><text x="302" y="175" font-size="7" fill="#5A5A5A" text-anchor="middle">no room through room</text><rect x="30" y="192" width="300" height="36" rx="3" fill="#FDEBD7" stroke="#B66A00" stroke-width="1.3"/><text x="180" y="205" font-size="8.5" fill="#272134" text-anchor="middle" font-weight="bold">Plus PROSPECT (look of the house), ELEGANCE, FLEXIBILITY,</text><text x="180" y="217" font-size="8.5" fill="#272134" text-anchor="middle">SANITATION and ECONOMY - ten principles, one good plan.</text></svg>