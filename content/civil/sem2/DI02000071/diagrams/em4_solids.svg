<svg xmlns="http://www.w3.org/2000/svg" width="360" height="200" viewBox="0 0 360 200" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="200" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Centre of gravity of simple solids</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 4.5: cone, hemisphere, cylinder, sphere</text><path d="M52 62 L24 122 L80 122 Z" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.4"/><circle cx="52" cy="107" r="3" fill="#BD2543" stroke="#BD2543" stroke-width="1.0"/><text x="52" y="140" font-size="7.5" fill="#2F5D8A" text-anchor="middle" font-weight="bold">CONE</text><text x="52" y="151" font-size="6.5" fill="#5A5A5A" text-anchor="middle">h/4 from base</text><path d="M118 92 A32 32 0 0 0 182 92 Z" fill="#FDEBD7" stroke="#B66A00" stroke-width="1.4"/><line x1="118" y1="92" x2="182" y2="92" stroke="#B66A00" stroke-width="1.2"/><circle cx="150" cy="104" r="3" fill="#BD2543" stroke="#BD2543" stroke-width="1.0"/><text x="150" y="140" font-size="7.5" fill="#B66A00" text-anchor="middle" font-weight="bold">HEMISPHERE</text><text x="150" y="151" font-size="6.5" fill="#5A5A5A" text-anchor="middle">3r/8 from centre</text><rect x="224" y="66" width="44" height="56" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.4"/><circle cx="246" cy="94" r="3" fill="#BD2543" stroke="#BD2543" stroke-width="1.0"/><text x="246" y="140" font-size="7.5" fill="#2E7D32" text-anchor="middle" font-weight="bold">CYLINDER</text><text x="246" y="151" font-size="6.5" fill="#5A5A5A" text-anchor="middle">h/2 (mid-height)</text><circle cx="316" cy="94" r="28" fill="#F3E5F5" stroke="#7B2CD9" stroke-width="1.4"/><circle cx="316" cy="94" r="3" fill="#BD2543" stroke="#BD2543" stroke-width="1.0"/><text x="316" y="140" font-size="7.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">SPHERE</text><text x="316" y="151" font-size="6.5" fill="#5A5A5A" text-anchor="middle">at its centre</text><rect x="38" y="164" width="284" height="28" rx="3" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.1"/><text x="180" y="177" font-size="8" fill="#272134" text-anchor="middle" font-weight="bold">Solids: first moment of VOLUME replaces area - same recipe.</text><text x="180" y="188" font-size="7.5" fill="#5A5A5A" text-anchor="middle">Cube/cuboid CG sits at the geometric centre.</text></svg>