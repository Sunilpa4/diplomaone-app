<svg xmlns="http://www.w3.org/2000/svg" width="360" height="228" viewBox="0 0 360 228" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="228" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Classification of force systems</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 1.5: by plane, meeting and line of action</text><rect x="8" y="52" width="84" height="96" rx="3" fill="#ffffff" stroke="#2F5D8A" stroke-width="1.3"/><path d="M26 74 L50 90" fill="none" stroke="#2F5D8A" stroke-width="1.4" marker-end="url(#ah)"/><path d="M74 74 L50 90" fill="none" stroke="#2F5D8A" stroke-width="1.4" marker-end="url(#ah)"/><path d="M50 116 L50 90" fill="none" stroke="#2F5D8A" stroke-width="1.4" marker-end="url(#ah)"/><path d="M24 104 L50 90" fill="none" stroke="#2F5D8A" stroke-width="1.4" marker-end="url(#ah)"/><text x="50" y="130" font-size="6.8" fill="#2F5D8A" text-anchor="middle" font-weight="bold">CONCURRENT</text><text x="50" y="141" font-size="5.9" fill="#5A5A5A" text-anchor="middle">all meet at a point</text><rect x="94" y="52" width="84" height="96" rx="3" fill="#ffffff" stroke="#B66A00" stroke-width="1.3"/><path d="M114 112 L114 70" fill="none" stroke="#B66A00" stroke-width="1.4" marker-end="url(#ah)"/><path d="M136 112 L136 70" fill="none" stroke="#B66A00" stroke-width="1.4" marker-end="url(#ah)"/><path d="M158 112 L158 70" fill="none" stroke="#B66A00" stroke-width="1.4" marker-end="url(#ah)"/><text x="136" y="130" font-size="6.8" fill="#B66A00" text-anchor="middle" font-weight="bold">PARALLEL</text><text x="136" y="141" font-size="5.9" fill="#5A5A5A" text-anchor="middle">lines parallel (like/unlike)</text><rect x="180" y="52" width="84" height="96" rx="3" fill="#ffffff" stroke="#2E7D32" stroke-width="1.3"/><path d="M192 110 L216 76" fill="none" stroke="#2E7D32" stroke-width="1.4" marker-end="url(#ah)"/><path d="M252 112 L230 74" fill="none" stroke="#2E7D32" stroke-width="1.4" marker-end="url(#ah)"/><path d="M196 72 L238 92" fill="none" stroke="#2E7D32" stroke-width="1.4" marker-end="url(#ah)"/><text x="222" y="130" font-size="6.8" fill="#2E7D32" text-anchor="middle" font-weight="bold">NON-CONCURRENT</text><text x="222" y="141" font-size="5.9" fill="#5A5A5A" text-anchor="middle">neither meet nor parallel</text><rect x="266" y="52" width="84" height="96" rx="3" fill="#ffffff" stroke="#7B2CD9" stroke-width="1.3"/><line x1="274" y1="90" x2="342" y2="90" stroke="#7B2CD9" stroke-width="1.6"/><path d="M282 90 L304 90" fill="none" stroke="#7B2CD9" stroke-width="2.0" marker-end="url(#ah)"/><path d="M334 90 L314 90" fill="none" stroke="#7B2CD9" stroke-width="2.0" marker-end="url(#ah)"/><text x="308" y="130" font-size="6.8" fill="#7B2CD9" text-anchor="middle" font-weight="bold">COLLINEAR</text><text x="308" y="141" font-size="5.9" fill="#5A5A5A" text-anchor="middle">same line of action</text><rect x="24" y="162" width="312" height="56" rx="3" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.2"/><text x="180" y="176" font-size="8.5" fill="#272134" text-anchor="middle" font-weight="bold">COPLANAR = all forces in one plane (this subject).</text><text x="180" y="189" font-size="7.5" fill="#5A5A5A" text-anchor="middle">Non-coplanar (space) systems belong to later study.</text><text x="180" y="203" font-size="7.5" fill="#272134" text-anchor="middle">Unit 2: concurrent. Unit 3: parallel + non-concurrent.</text></svg>