<svg xmlns="http://www.w3.org/2000/svg" width="360" height="258" viewBox="0 0 360 258" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="258" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Resultant of parallel forces - position</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 3.2: Varignon's theorem puts R in its place</text><path d="M70 62 L70 108" fill="none" stroke="#2F5D8A" stroke-width="2.0" marker-end="url(#ahB)"/><text x="70" y="54" font-size="8" fill="#2F5D8A" text-anchor="middle" font-weight="bold">10 N</text><path d="M150 62 L150 124" fill="none" stroke="#2F5D8A" stroke-width="2.0" marker-end="url(#ahB)"/><text x="150" y="54" font-size="8" fill="#2F5D8A" text-anchor="middle" font-weight="bold">20 N</text><path d="M238 62 L238 140" fill="none" stroke="#2F5D8A" stroke-width="2.0" marker-end="url(#ahB)"/><text x="238" y="54" font-size="8" fill="#2F5D8A" text-anchor="middle" font-weight="bold">30 N</text><line x1="52" y1="168" x2="300" y2="168" stroke="#272134" stroke-width="2.4"/><circle cx="196" cy="168" r="4" fill="#BD2543" stroke="#BD2543" stroke-width="1.1"/><path d="M196 108 L196 164" fill="none" stroke="#BD2543" stroke-width="2.6" marker-end="url(#ahR)"/><text x="196" y="100" font-size="9" fill="#BD2543" text-anchor="middle" font-weight="bold">R = 60 N</text><line x1="70" y1="188" x2="196" y2="188" stroke="#5A5A5A" stroke-width="0.9"/><line x1="70" y1="184" x2="70" y2="192" stroke="#5A5A5A" stroke-width="0.9"/><line x1="196" y1="184" x2="196" y2="192" stroke="#5A5A5A" stroke-width="0.9"/><text x="133" y="182" font-size="7.5" fill="#5A5A5A" text-anchor="middle">x = sum of moments / R</text><path d="M196 168 L282 168" fill="none" stroke="#7B2CD9" stroke-width="1.4" marker-end="url(#ah)"/><text x="282" y="160" font-size="7" fill="#7B2CD9" text-anchor="start">equilibrant</text><text x="180" y="216" font-size="8" fill="#272134" text-anchor="middle" font-weight="bold">Varignon: moment of R about any point = sum of moments of the parts.</text><rect x="52" y="224" width="256" height="26" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.1"/><text x="180" y="240" font-size="8" fill="#272134" text-anchor="middle" font-weight="bold">That one sentence positions every resultant in this unit.</text></svg>