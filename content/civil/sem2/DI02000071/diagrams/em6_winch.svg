<svg xmlns="http://www.w3.org/2000/svg" width="360" height="242" viewBox="0 0 360 242" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="242" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Crab winch and screw jack</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Cards 6.5: gear pairs and the screw - where big velocity ratios come from</text><circle cx="82" cy="128" r="32" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.7"/><circle cx="82" cy="128" r="11" fill="#FFF8E1" stroke="#B66A00" stroke-width="1.5"/><circle cx="82" cy="128" r="3" fill="#272134" stroke="#272134" stroke-width="0.8"/><circle cx="126" cy="105" r="14" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.6"/><circle cx="126" cy="105" r="3" fill="#272134" stroke="#272134" stroke-width="0.8"/><line x1="126" y1="105" x2="158" y2="82" stroke="#272134" stroke-width="2.0"/><circle cx="160" cy="80" r="4" fill="#FDEBD7" stroke="#B66A00" stroke-width="1.2"/><text x="168" y="74" font-size="7.5" fill="#272134" text-anchor="start">handle L</text><text x="82" y="108" font-size="7.5" fill="#2F5D8A" text-anchor="middle" font-weight="bold">spur T1</text><text x="126" y="88" font-size="7.5" fill="#2E7D32" text-anchor="middle" font-weight="bold">pinion T2</text><line x1="93" y1="128" x2="93" y2="168" stroke="#272134" stroke-width="1.3"/><rect x="82" y="168" width="22" height="16" rx="3" fill="#FDEBD7" stroke="#B66A00" stroke-width="1.4"/><text x="93" y="180" font-size="8" fill="#B66A00" text-anchor="middle" font-weight="bold">W</text><text x="88" y="200" font-size="7.5" fill="#2F5D8A" text-anchor="middle" font-weight="bold">CRAB WINCH (single purchase)</text><text x="88" y="214" font-size="9" fill="#272134" text-anchor="middle" font-weight="bold">VR = (L/r) x (T1/T2)</text><rect x="238" y="66" width="52" height="9" rx="3" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.4"/><text x="264" y="73" font-size="7" fill="#2F5D8A" text-anchor="middle" font-weight="bold">load</text><rect x="259" y="75" width="10" height="78" rx="3" fill="#FFF8E1" stroke="#B66A00" stroke-width="1.5"/><line x1="259" y1="82" x2="269" y2="87" stroke="#B66A00" stroke-width="0.8"/><line x1="259" y1="91" x2="269" y2="96" stroke="#B66A00" stroke-width="0.8"/><line x1="259" y1="100" x2="269" y2="105" stroke="#B66A00" stroke-width="0.8"/><line x1="259" y1="109" x2="269" y2="114" stroke="#B66A00" stroke-width="0.8"/><line x1="259" y1="118" x2="269" y2="123" stroke="#B66A00" stroke-width="0.8"/><line x1="259" y1="127" x2="269" y2="132" stroke="#B66A00" stroke-width="0.8"/><line x1="259" y1="136" x2="269" y2="141" stroke="#B66A00" stroke-width="0.8"/><line x1="259" y1="145" x2="269" y2="150" stroke="#B66A00" stroke-width="0.8"/><line x1="216" y1="92" x2="312" y2="92" stroke="#272134" stroke-width="2.2"/><circle cx="216" cy="92" r="4" fill="#FDEBD7" stroke="#B66A00" stroke-width="1.2"/><circle cx="312" cy="92" r="4" fill="#FDEBD7" stroke="#B66A00" stroke-width="1.2"/><text x="264" y="86" font-size="7" fill="#5A5A5A" text-anchor="middle">handle (length L each side)</text><rect x="244" y="153" width="40" height="18" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/><text x="264" y="165" font-size="7.5" fill="#2E7D32" text-anchor="middle" font-weight="bold">nut</text><path d="M286 116 L306 116" fill="none" stroke="#7B2CD9" stroke-width="1.2" marker-end="url(#ah)"/><text x="310" y="119" font-size="7.5" fill="#7B2CD9" text-anchor="start">pitch p</text><text x="264" y="200" font-size="7.5" fill="#2F5D8A" text-anchor="middle" font-weight="bold">SIMPLE SCREW JACK</text><text x="264" y="214" font-size="9" fill="#272134" text-anchor="middle" font-weight="bold">VR = 2 pi L / p</text><text x="180" y="226" font-size="8" fill="#272134" text-anchor="middle" font-weight="bold">Gearing multiplies the wheel-and-axle trick;</text><text x="180" y="239" font-size="8" fill="#272134" text-anchor="middle" font-weight="bold">the screw gives a huge VR and a self-locking lift.</text></svg>