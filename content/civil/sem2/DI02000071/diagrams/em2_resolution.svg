<svg xmlns="http://www.w3.org/2000/svg" width="360" height="252" viewBox="0 0 360 252" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="252" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Resolution of a force</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 2.1: orthogonal components Fx and Fy</text><line x1="40" y1="168" x2="300" y2="168" stroke="#5A5A5A" stroke-width="1.0"/><line x1="92" y1="52" x2="92" y2="190" stroke="#5A5A5A" stroke-width="1.0"/><text x="302" y="182" font-size="9" fill="#5A5A5A" text-anchor="start" font-weight="bold">x</text><text x="84" y="60" font-size="9" fill="#5A5A5A" text-anchor="middle" font-weight="bold">y</text><path d="M92 168 L226 84" fill="none" stroke="#BD2543" stroke-width="2.6" marker-end="url(#ahR)"/><text x="196" y="100" font-size="11" fill="#BD2543" text-anchor="middle" font-weight="bold">F</text><line x1="226" y1="84" x2="226" y2="168" stroke="#2F5D8A" stroke-width="1.4" stroke-dasharray="6 3"/><line x1="92" y1="84" x2="226" y2="84" stroke="#2F5D8A" stroke-width="1.0" stroke-dasharray="6 3"/><path d="M92 168 L226 168" fill="none" stroke="#2F5D8A" stroke-width="2.2" marker-end="url(#ahB)"/><path d="M92 168 L92 84" fill="none" stroke="#B66A00" stroke-width="2.2" marker-end="url(#ahO)"/><text x="165" y="160" font-size="9" fill="#2F5D8A" text-anchor="middle" font-weight="bold">Fx = F cos A</text><text x="126" y="118" font-size="9" fill="#B66A00" text-anchor="start" font-weight="bold">Fy = F sin A</text><path d="M136 168 A44 44 0 0 0 128 142" fill="none" stroke="#272134" stroke-width="1.0"/><text x="144" y="156" font-size="9" fill="#272134" text-anchor="start" font-weight="bold">A</text><rect x="36" y="202" width="288" height="40" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.2"/><text x="180" y="216" font-size="8.5" fill="#272134" text-anchor="middle" font-weight="bold">Resolution splits one force into two perpendicular helpers.</text><text x="180" y="229" font-size="7.5" fill="#5A5A5A" text-anchor="middle">Reverse it (add components) and you rebuild the force - Unit 2's engine.</text></svg>