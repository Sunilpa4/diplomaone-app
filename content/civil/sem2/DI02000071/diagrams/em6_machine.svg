<svg xmlns="http://www.w3.org/2000/svg" width="360" height="240" viewBox="0 0 360 240" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="240" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">A lifting machine - load, effort, MA, VR, efficiency</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 6.1: every machine is judged by these three numbers</text><circle cx="92" cy="116" r="46" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.6"/><circle cx="92" cy="116" r="16" fill="#FFF8E1" stroke="#B66A00" stroke-width="1.5"/><circle cx="92" cy="116" r="3" fill="#272134" stroke="#272134" stroke-width="0.8"/><path d="M52 70 L132 70" fill="none" stroke="#B66A00" stroke-width="2.2" marker-end="url(#ahO)"/><text x="140" y="74" font-size="8" fill="#B66A00" text-anchor="start" font-weight="bold">P (effort)</text><line x1="108" y1="116" x2="108" y2="168" stroke="#272134" stroke-width="1.4"/><rect x="94" y="168" width="28" height="20" rx="3" fill="#FDEBD7" stroke="#B66A00" stroke-width="1.5"/><text x="108" y="182" font-size="9" fill="#B66A00" text-anchor="middle" font-weight="bold">W</text><text x="108" y="202" font-size="7.5" fill="#5A5A5A" text-anchor="middle">load</text><text x="92" y="52" font-size="7.5" fill="#2F5D8A" text-anchor="middle">wheel</text><text x="124" y="108" font-size="7.5" fill="#B66A00" text-anchor="start">axle/drum</text><text x="92" y="58" font-size="7.5" fill="#2F5D8A" text-anchor="middle">effort travels y</text><text x="132" y="172" font-size="7.5" fill="#B66A00" text-anchor="start">load rises x</text><rect x="196" y="66" width="152" height="118" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.2"/><text x="272" y="86" font-size="9" fill="#2E7D32" text-anchor="middle" font-weight="bold">THE THREE NUMBERS</text><text x="272" y="108" font-size="10" fill="#272134" text-anchor="middle" font-weight="bold">MA = W / P</text><text x="272" y="128" font-size="8.5" fill="#272134" text-anchor="middle" font-weight="bold">VR = y / x  (distances)</text><text x="272" y="148" font-size="8.5" fill="#272134" text-anchor="middle" font-weight="bold">efficiency = MA / VR</text><text x="272" y="168" font-size="8" fill="#5A5A5A" text-anchor="middle">ideal: eta = 100%, MA = VR</text><text x="180" y="216" font-size="8" fill="#272134" text-anchor="middle" font-weight="bold">A machine trades distance for force:</text><text x="180" y="229" font-size="8" fill="#272134" text-anchor="middle" font-weight="bold">a small effort pulled far lifts a big load a little.</text></svg>