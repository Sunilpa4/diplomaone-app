<svg xmlns="http://www.w3.org/2000/svg" width="360" height="244" viewBox="0 0 360 244" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="244" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Force - a vector quantity</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 1.3: characteristics of a force and Bow's notation</text><circle cx="70" cy="150" r="4" fill="#272134" stroke="#272134" stroke-width="1.2"/><text x="70" y="168" font-size="7" fill="#5A5A5A" text-anchor="middle">point of</text><text x="70" y="178" font-size="7" fill="#5A5A5A" text-anchor="middle">application</text><line x1="70" y1="150" x2="262" y2="84" stroke="#5A5A5A" stroke-width="1.0" stroke-dasharray="7 4"/><path d="M70 150 L212 104" fill="none" stroke="#BD2543" stroke-width="2.6" marker-end="url(#ahR)"/><text x="140" y="112" font-size="10" fill="#BD2543" text-anchor="middle" font-weight="bold">F = 500 N</text><path d="M120 150 L120 128 M120 128 L206 128" fill="none" stroke="#2F5D8A" stroke-width="0.9"/><path d="M150 136 A34 34 0 0 0 138 122" fill="none" stroke="#2F5D8A" stroke-width="1.0"/><text x="158" y="140" font-size="7.5" fill="#2F5D8A" text-anchor="start" font-weight="bold">angle</text><text x="180" y="62" font-size="8.5" fill="#272134" text-anchor="middle" font-weight="bold">A force is a VECTOR: it needs</text><text x="180" y="74" font-size="8" fill="#5A5A5A" text-anchor="middle">magnitude + direction + point of application</text><rect x="16" y="196" width="108" height="38" rx="3" fill="#ffffff" stroke="#BD2543" stroke-width="1.2"/><text x="70" y="210" font-size="7" fill="#BD2543" text-anchor="middle" font-weight="bold">MAGNITUDE</text><text x="70" y="223" font-size="6.3" fill="#272134" text-anchor="middle">500 N - arrow length to scale</text><rect x="126" y="196" width="108" height="38" rx="3" fill="#ffffff" stroke="#2F5D8A" stroke-width="1.2"/><text x="180" y="210" font-size="7" fill="#2F5D8A" text-anchor="middle" font-weight="bold">DIRECTION</text><text x="180" y="223" font-size="6.3" fill="#272134" text-anchor="middle">angle with a reference line</text><rect x="236" y="196" width="108" height="38" rx="3" fill="#ffffff" stroke="#7B2CD9" stroke-width="1.2"/><text x="290" y="210" font-size="7" fill="#7B2CD9" text-anchor="middle" font-weight="bold">LINE OF ACTION</text><text x="290" y="223" font-size="6.3" fill="#272134" text-anchor="middle">dashed line through the arrow</text><rect x="252" y="104" width="94" height="58" rx="3" fill="#FFF8E1" stroke="#B66A00" stroke-width="1.2"/><text x="299" y="117" font-size="7.5" fill="#B66A00" text-anchor="middle" font-weight="bold">Bow's NOTATION</text><path d="M264 144 L322 126" fill="none" stroke="#B66A00" stroke-width="2.0" marker-end="url(#ahO)"/><text x="262" y="152" font-size="8" fill="#B66A00" text-anchor="middle" font-weight="bold">A</text><text x="328" y="122" font-size="8" fill="#B66A00" text-anchor="middle" font-weight="bold">B</text><text x="299" y="156" font-size="6.3" fill="#5A5A5A" text-anchor="middle">force AB (space letters)</text></svg>