<svg xmlns="http://www.w3.org/2000/svg" width="360" height="248" viewBox="0 0 360 248" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="248" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Law of polygon of forces</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 2.3: many forces at a point, drawn head-to-tail</text><path d="M84 104 L138 78" fill="none" stroke="#2F5D8A" stroke-width="1.8" marker-end="url(#ah)"/><path d="M84 104 L102 52" fill="none" stroke="#B66A00" stroke-width="1.8" marker-end="url(#ah)"/><path d="M84 104 L36 70" fill="none" stroke="#2E7D32" stroke-width="1.8" marker-end="url(#ah)"/><path d="M84 104 L28 130" fill="none" stroke="#7B2CD9" stroke-width="1.8" marker-end="url(#ah)"/><circle cx="84" cy="104" r="3" fill="#272134" stroke="#272134" stroke-width="1.0"/><text x="84" y="178" font-size="7.5" fill="#272134" text-anchor="middle" font-weight="bold">SPACE DIAGRAM</text><text x="84" y="190" font-size="6.8" fill="#5A5A5A" text-anchor="middle">forces at the point</text><path d="M142 104 L176 104" fill="none" stroke="#5A5A5A" stroke-width="1.4" marker-end="url(#ah)"/><path d="M196 156 L238 132" fill="none" stroke="#2F5D8A" stroke-width="2.0" marker-end="url(#ah)"/><path d="M238 132 L262 96" fill="none" stroke="#B66A00" stroke-width="2.0" marker-end="url(#ah)"/><path d="M262 96 L224 66" fill="none" stroke="#2E7D32" stroke-width="2.0" marker-end="url(#ah)"/><path d="M224 66 L206 96" fill="none" stroke="#7B2CD9" stroke-width="2.0" marker-end="url(#ah)"/><path d="M206 96 L196 156" fill="none" stroke="#BD2543" stroke-width="2.4" marker-end="url(#ahR)"/><text x="238" y="178" font-size="7.5" fill="#272134" text-anchor="middle" font-weight="bold">FORCE POLYGON</text><text x="238" y="190" font-size="6.8" fill="#BD2543" text-anchor="middle">red closing side = RESULTANT</text><text x="238" y="201" font-size="6.8" fill="#5A5A5A" text-anchor="middle">(equilibrant closes it to zero)</text><rect x="30" y="212" width="300" height="28" rx="3" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.2"/><text x="180" y="229" font-size="8.5" fill="#272134" text-anchor="middle" font-weight="bold">Polygon closes = equilibrium. Gap = resultant still to be balanced.</text></svg>