<svg xmlns="http://www.w3.org/2000/svg" width="360" height="242" viewBox="0 0 360 242" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="242" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Lami's theorem - three-force equilibrium</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 2.4: each force proportional to the sine of its opposite angle</text><path d="M130 96 L130 168" fill="none" stroke="#272134" stroke-width="2.2" marker-end="url(#ah)"/><text x="142" y="150" font-size="8" fill="#272134" text-anchor="start">W (load)</text><path d="M130 96 L62 52" fill="none" stroke="#2F5D8A" stroke-width="2.0" marker-end="url(#ahB)"/><path d="M130 96 L204 60" fill="none" stroke="#B66A00" stroke-width="2.0" marker-end="url(#ahO)"/><text x="74" y="62" font-size="9" fill="#2F5D8A" text-anchor="middle" font-weight="bold">T1</text><text x="190" y="56" font-size="9" fill="#B66A00" text-anchor="middle" font-weight="bold">T2</text><circle cx="130" cy="96" r="3.5" fill="#272134" stroke="#272134" stroke-width="1.0"/><text x="130" y="190" font-size="7.5" fill="#5A5A5A" text-anchor="middle">three forces at a point, in equilibrium</text><rect x="228" y="66" width="122" height="118" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.2"/><text x="289" y="82" font-size="8.5" fill="#2E7D32" text-anchor="middle" font-weight="bold">Lami's THEOREM</text><text x="289" y="100" font-size="9" fill="#272134" text-anchor="middle" font-weight="bold">P / sin a</text><line x1="252" y1="106" x2="326" y2="106" stroke="#272134" stroke-width="0.8"/><text x="289" y="118" font-size="8" fill="#272134" text-anchor="middle" font-weight="bold">= Q / sin b  = R / sin c</text><text x="289" y="138" font-size="7" fill="#5A5A5A" text-anchor="middle">each force / sine of</text><text x="289" y="149" font-size="7" fill="#5A5A5A" text-anchor="middle">the angle OPPOSITE</text><text x="289" y="160" font-size="7" fill="#5A5A5A" text-anchor="middle">to it (between the</text><text x="289" y="171" font-size="7" fill="#5A5A5A" text-anchor="middle">other two forces)</text><rect x="30" y="206" width="300" height="28" rx="3" fill="#FDEBD7" stroke="#B66A00" stroke-width="1.2"/><text x="180" y="223" font-size="8.5" fill="#272134" text-anchor="middle" font-weight="bold">For THREE concurrent forces in equilibrium only - a scalene shortcut.</text></svg>