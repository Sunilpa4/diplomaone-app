<svg xmlns="http://www.w3.org/2000/svg" width="360" height="210" viewBox="0 0 360 210" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="210" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Centroids of standard plane figures</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 4.4: triangle, semicircle, quarter circle, rectangle</text><path d="M24 118 L84 118 L54 62 Z" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.4"/><circle cx="54" cy="99" r="3" fill="#BD2543" stroke="#BD2543" stroke-width="1.0"/><line x1="24" y1="130" x2="84" y2="130" stroke="#5A5A5A" stroke-width="0.8"/><text x="54" y="126" font-size="7" fill="#2F5D8A" text-anchor="middle" font-weight="bold">h/3</text><text x="54" y="146" font-size="7.5" fill="#2F5D8A" text-anchor="middle" font-weight="bold">TRIANGLE</text><text x="54" y="157" font-size="6.5" fill="#5A5A5A" text-anchor="middle">h/3 from base</text><path d="M106 118 A34 34 0 0 1 174 118 Z" fill="#FDEBD7" stroke="#B66A00" stroke-width="1.4"/><circle cx="140" cy="104" r="3" fill="#BD2543" stroke="#BD2543" stroke-width="1.0"/><text x="140" y="146" font-size="7.5" fill="#B66A00" text-anchor="middle" font-weight="bold">SEMICIRCLE</text><text x="140" y="157" font-size="6.5" fill="#5A5A5A" text-anchor="middle">4r/3pi from centre</text><path d="M208 118 L208 66 A52 52 0 0 1 260 118 Z" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.4"/><circle cx="230" cy="96" r="3" fill="#BD2543" stroke="#BD2543" stroke-width="1.0"/><text x="234" y="146" font-size="7.5" fill="#2E7D32" text-anchor="middle" font-weight="bold">QUARTER CIRCLE</text><text x="234" y="157" font-size="6.5" fill="#5A5A5A" text-anchor="middle">4r/3pi both axes</text><rect x="282" y="76" width="56" height="42" rx="3" fill="#F3E5F5" stroke="#7B2CD9" stroke-width="1.4"/><circle cx="310" cy="97" r="3" fill="#BD2543" stroke="#BD2543" stroke-width="1.0"/><text x="310" y="146" font-size="7.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">RECTANGLE</text><text x="310" y="157" font-size="6.5" fill="#5A5A5A" text-anchor="middle">at diagonals' crossing</text><text x="180" y="64" font-size="8" fill="#5A5A5A" text-anchor="middle">Standard centroids (from the stated base/centre, on the axis of symmetry)</text><rect x="38" y="172" width="284" height="30" rx="3" fill="#FFF8E1" stroke="#B66A00" stroke-width="1.2"/><text x="180" y="185" font-size="8.5" fill="#272134" text-anchor="middle" font-weight="bold">4r/3pi = 0.424 r - the semicircle number to memorise cold.</text><text x="180" y="196" font-size="7.5" fill="#5A5A5A" text-anchor="middle">Axis of symmetry always carries the centroid - half the search done.</text></svg>