<svg xmlns="http://www.w3.org/2000/svg" width="360" height="244" viewBox="0 0 360 244" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="244" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Wheel and axle; differential wheel and axle</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 6.4: one revolution trades pi x D of effort travel for load rise</text><circle cx="78" cy="112" r="44" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.6"/><circle cx="78" cy="112" r="17" fill="#FFF8E1" stroke="#B66A00" stroke-width="1.5"/><circle cx="78" cy="112" r="3" fill="#272134" stroke="#272134" stroke-width="0.8"/><path d="M34 112 L34 158" fill="none" stroke="#B66A00" stroke-width="2.0" marker-end="url(#ahO)"/><text x="30" y="152" font-size="9" fill="#B66A00" text-anchor="end" font-weight="bold">P</text><line x1="95" y1="112" x2="95" y2="156" stroke="#272134" stroke-width="1.3"/><rect x="84" y="156" width="22" height="16" rx="3" fill="#FDEBD7" stroke="#B66A00" stroke-width="1.4"/><text x="95" y="168" font-size="8" fill="#B66A00" text-anchor="middle" font-weight="bold">W</text><text x="78" y="196" font-size="8" fill="#2F5D8A" text-anchor="middle" font-weight="bold">SIMPLE WHEEL AND AXLE</text><text x="78" y="210" font-size="10" fill="#272134" text-anchor="middle" font-weight="bold">VR = D / d</text><text x="52" y="66" font-size="7.5" fill="#2F5D8A" text-anchor="end">wheel D</text><text x="104" y="100" font-size="7.5" fill="#B66A00" text-anchor="start">axle d</text><circle cx="256" cy="112" r="44" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.6"/><circle cx="256" cy="112" r="21" fill="#FFF8E1" stroke="#B66A00" stroke-width="1.5"/><circle cx="256" cy="112" r="14" fill="#FFF3E0" stroke="#7B2CD9" stroke-width="1.3"/><circle cx="256" cy="112" r="3" fill="#272134" stroke="#272134" stroke-width="0.8"/><path d="M212 112 L212 158" fill="none" stroke="#B66A00" stroke-width="2.0" marker-end="url(#ahO)"/><text x="208" y="152" font-size="9" fill="#B66A00" text-anchor="end" font-weight="bold">P</text><line x1="242" y1="130" x2="242" y2="166" stroke="#272134" stroke-width="1.2"/><line x1="270" y1="130" x2="270" y2="166" stroke="#272134" stroke-width="1.2"/><circle cx="256" cy="174" r="10" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.4"/><line x1="256" y1="184" x2="256" y2="192" stroke="#272134" stroke-width="1.3"/><text x="256" y="204" font-size="7.5" fill="#5A5A5A" text-anchor="middle">load W on pulley</text><text x="232" y="122" font-size="8" fill="#B66A00" text-anchor="end" font-weight="bold">d1</text><text x="284" y="138" font-size="8" fill="#7B2CD9" text-anchor="start" font-weight="bold">d2</text><text x="256" y="52" font-size="7.5" fill="#2E7D32" text-anchor="middle">wheel D</text><text x="256" y="224" font-size="7" fill="#272134" text-anchor="middle"></text><rect x="120" y="216" width="220" height="1" rx="3" fill="none" stroke="none" stroke-width="0"/><text x="180" y="222" font-size="8" fill="#272134" text-anchor="middle" font-weight="bold">Differential: rope winds on d1, off d2 -</text><text x="180" y="235" font-size="8" fill="#272134" text-anchor="middle" font-weight="bold">VR = 2D/(d1 - d2) can be huge.</text></svg>