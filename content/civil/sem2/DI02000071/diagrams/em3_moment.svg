<svg xmlns="http://www.w3.org/2000/svg" width="360" height="242" viewBox="0 0 360 242" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="242" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Moment of a force and a couple</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 3.1: turning effect measured about a point</text><circle cx="70" cy="150" r="5" fill="#272134" stroke="#272134" stroke-width="1.2"/><text x="70" y="172" font-size="9" fill="#272134" text-anchor="middle" font-weight="bold">O</text><path d="M70 150 L238 84" fill="none" stroke="#BD2543" stroke-width="2.4" marker-end="url(#ahR)"/><text x="196" y="96" font-size="11" fill="#BD2543" text-anchor="middle" font-weight="bold">F</text><line x1="70" y1="150" x2="196" y2="150" stroke="#2F5D8A" stroke-width="1.1" stroke-dasharray="5 3"/><line x1="196" y1="94" x2="196" y2="150" stroke="#2F5D8A" stroke-width="1.1" stroke-dasharray="5 3"/><text x="133" y="142" font-size="7.5" fill="#2F5D8A" text-anchor="middle" font-weight="bold">perpendicular distance d</text><path d="M96 128 A36 36 0 0 0 108 108" fill="none" stroke="#7B2CD9" stroke-width="1.6" marker-end="url(#ah)"/><text x="92" y="104" font-size="9.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">M = F x d</text><text x="154" y="62" font-size="7.5" fill="#5A5A5A" text-anchor="middle">moment turns about O</text><rect x="252" y="92" width="92" height="78" rx="3" fill="#FDEBD7" stroke="#B66A00" stroke-width="1.1"/><path d="M266 108 L330 108" fill="none" stroke="#B66A00" stroke-width="2.0" marker-end="url(#ahO)"/><path d="M330 154 L266 154" fill="none" stroke="#B66A00" stroke-width="2.0" marker-end="url(#ahO)"/><text x="298" y="132" font-size="8" fill="#B66A00" text-anchor="middle" font-weight="bold">COUPLE</text><text x="298" y="144" font-size="7" fill="#272134" text-anchor="middle">M = F x gap</text><text x="180" y="196" font-size="8" fill="#272134" text-anchor="middle" font-weight="bold">Moment = force x perpendicular distance from the point to the line of action.</text><rect x="48" y="206" width="264" height="28" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.2"/><text x="180" y="223" font-size="8" fill="#272134" text-anchor="middle" font-weight="bold">Sign discipline: pick clockwise + (or CCW +) and never switch mid-problem.</text></svg>