<svg xmlns="http://www.w3.org/2000/svg" width="360" height="196" viewBox="0 0 360 196" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="196" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Temporary adjustments of the theodolite</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 5.4: centre, level, focus - the ritual before any angle</text><rect x="30" y="56" width="92" height="108" rx="3" fill="white" stroke="#2F5D8A" stroke-width="1.1"/><text x="76" y="70" font-size="8" fill="#2F5D8A" text-anchor="middle" font-weight="bold">1. CENTRE</text><rect x="140" y="56" width="92" height="108" rx="3" fill="white" stroke="#2F5D8A" stroke-width="1.1"/><text x="186" y="70" font-size="8" fill="#2F5D8A" text-anchor="middle" font-weight="bold">2. LEVEL</text><rect x="250" y="56" width="92" height="108" rx="3" fill="white" stroke="#2F5D8A" stroke-width="1.1"/><text x="296" y="70" font-size="8" fill="#2F5D8A" text-anchor="middle" font-weight="bold">3. FOCUS</text><line x1="76" y1="82" x2="76" y2="128" stroke="#B66A00" stroke-width="1.3"/><circle cx="76" cy="132" r="3.5" fill="#B66A00" stroke="#272134" stroke-width="0.8"/><line x1="58" y1="148" x2="94" y2="148" stroke="#272134" stroke-width="1.4"/><circle cx="76" cy="148" r="2.5" fill="#BD2543" stroke="#272134" stroke-width="0.8"/><text x="76" y="160" font-size="7" fill="#5A5A5A" text-anchor="middle">bob over peg</text><rect x="158" y="108" width="56" height="10" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.1"/><circle cx="186" cy="113" r="4" fill="white" stroke="#2E7D32" stroke-width="1.1"/><line x1="186" y1="96" x2="186" y2="106" stroke="#2E7D32" stroke-width="1.0"/><text x="186" y="90" font-size="7" fill="#2E7D32" text-anchor="middle" font-weight="bold">bubble centred</text><text x="186" y="136" font-size="7" fill="#5A5A5A" text-anchor="middle">foot screws</text><text x="186" y="148" font-size="7" fill="#5A5A5A" text-anchor="middle">test by turning</text><circle cx="296" cy="108" r="18" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.2"/><line x1="296" y1="92" x2="296" y2="124" stroke="#272134" stroke-width="0.9"/><line x1="280" y1="108" x2="312" y2="108" stroke="#272134" stroke-width="0.9"/><text x="296" y="140" font-size="7" fill="#5A5A5A" text-anchor="middle">sharp hairs,</text><text x="296" y="152" font-size="7" fill="#5A5A5A" text-anchor="middle">no parallax</text><text x="180" y="186" font-size="7.5" fill="#272134" text-anchor="middle" font-weight="bold">At every set-up, in this order - then measure on both faces and average.</text></svg>