<svg xmlns="http://www.w3.org/2000/svg" width="360" height="226" viewBox="0 0 360 226" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="226" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Principles of surveying</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 1.2: control first; locate by two references</text><path d="M60 180 L150 70 L240 180 Z" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.6"/><circle cx="60" cy="180" r="3.5" fill="#BD2543" stroke="#272134" stroke-width="0.8"/><circle cx="150" cy="70" r="3.5" fill="#BD2543" stroke="#272134" stroke-width="0.8"/><circle cx="240" cy="180" r="3.5" fill="#BD2543" stroke="#272134" stroke-width="0.8"/><text x="52" y="196" font-size="9" fill="#BD2543" text-anchor="middle" font-weight="bold">A</text><text x="150" y="60" font-size="9" fill="#BD2543" text-anchor="middle" font-weight="bold">B</text><text x="250" y="196" font-size="9" fill="#BD2543" text-anchor="middle" font-weight="bold">C</text><line x1="150" y1="70" x2="120" y2="180" stroke="#2F5D8A" stroke-width="0.9"/><line x1="150" y1="70" x2="190" y2="150" stroke="#2F5D8A" stroke-width="0.9"/><line x1="120" y1="180" x2="190" y2="150" stroke="#2F5D8A" stroke-width="0.9"/><circle cx="120" cy="180" r="2.5" fill="#B66A00" stroke="#272134" stroke-width="0"/><circle cx="190" cy="150" r="2.5" fill="#B66A00" stroke="#272134" stroke-width="0"/><circle cx="150" cy="130" r="2.5" fill="#B66A00" stroke="#272134" stroke-width="0"/><line x1="150" y1="70" x2="150" y2="130" stroke="#2F5D8A" stroke-width="0.9"/><line x1="120" y1="180" x2="150" y2="130" stroke="#2F5D8A" stroke-width="0.9"/><text x="105" y="140" font-size="7" fill="#B66A00" text-anchor="end">detail</text><text x="150" y="216" font-size="7.5" fill="#5A5A5A" text-anchor="middle">control framework first, detail inside it</text><rect x="256" y="66" width="96" height="118" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.2"/><text x="304" y="82" font-size="8" fill="#2E7D32" text-anchor="middle" font-weight="bold">TWO PRINCIPLES</text><text x="304" y="104" font-size="7.5" fill="#272134" text-anchor="middle" font-weight="bold">1. Whole to part:</text><text x="304" y="117" font-size="7" fill="#272134" text-anchor="middle">errors stay local,</text><text x="304" y="129" font-size="7" fill="#272134" text-anchor="middle">never accumulate</text><text x="304" y="151" font-size="7.5" fill="#272134" text-anchor="middle" font-weight="bold">2. Every new point</text><text x="304" y="164" font-size="7" fill="#272134" text-anchor="middle">fixed from TWO</text><text x="304" y="176" font-size="7" fill="#272134" text-anchor="middle">known points</text></svg>