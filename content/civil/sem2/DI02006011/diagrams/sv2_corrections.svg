<svg xmlns="http://www.w3.org/2000/svg" width="360" height="232" viewBox="0 0 360 232" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="232" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Slope correction in chaining</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 2.2: the map wants horizontal distances only</text><path d="M50 84 L290 170 L50 170 Z" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.4"/><line x1="50" y1="170" x2="300" y2="170" stroke="#272134" stroke-width="1.4"/><text x="150" y="112" font-size="8" fill="#2F5D8A" text-anchor="middle" font-weight="bold">slope length L (measured)</text><text x="150" y="186" font-size="8" fill="#272134" text-anchor="middle" font-weight="bold">horizontal length (wanted)</text><text x="300" y="140" font-size="10" fill="#B66A00" text-anchor="start" font-weight="bold">h</text><rect x="36" y="196" width="300" height="30" rx="3" fill="#FFF8E1" stroke="#B66A00" stroke-width="1.1"/><text x="186" y="208" font-size="7.5" fill="#272134" text-anchor="middle" font-weight="bold">slope correction = -h^2/(2L)  (always subtract; or L(1 - cos theta))</text><text x="186" y="220" font-size="7" fill="#5A5A5A" text-anchor="middle">chain too long -> measure reads small... true = measured x (actual/nominal)</text></svg>