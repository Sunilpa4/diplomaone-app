<svg xmlns="http://www.w3.org/2000/svg" width="360" height="230" viewBox="0 0 360 230" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="230" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Classification of surveying</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 1.2: plane versus geodetic; methods by purpose</text><rect x="130" y="48" width="100" height="24" rx="3" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.6"/><text x="180" y="64" font-size="10" fill="#2F5D8A" text-anchor="middle" font-weight="bold">SURVEYING</text><line x1="155" y1="72" x2="95" y2="92" stroke="#272134" stroke-width="1.2"/><line x1="205" y1="72" x2="265" y2="92" stroke="#272134" stroke-width="1.2"/><rect x="30" y="92" width="130" height="40" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.4"/><text x="95" y="108" font-size="9" fill="#2E7D32" text-anchor="middle" font-weight="bold">PLANE SURVEY</text><text x="95" y="122" font-size="7" fill="#272134" text-anchor="middle">small area: earth taken flat</text><rect x="200" y="92" width="130" height="40" rx="3" fill="#FFF8E1" stroke="#B66A00" stroke-width="1.4"/><text x="265" y="108" font-size="9" fill="#B66A00" text-anchor="middle" font-weight="bold">GEODETIC SURVEY</text><text x="265" y="122" font-size="7" fill="#272134" text-anchor="middle">large area: curvature counted</text><line x1="95" y1="132" x2="95" y2="148" stroke="#272134" stroke-width="1.2"/><rect x="24" y="148" width="292" height="40" rx="3" fill="#F3E5F5" stroke="#7B2CD9" stroke-width="1.2"/><text x="170" y="164" font-size="7.5" fill="#272134" text-anchor="middle">This course (plane methods): chain, compass, plane table,</text><text x="170" y="178" font-size="7.5" fill="#272134" text-anchor="middle">levelling, theodolite</text><text x="180" y="208" font-size="7.5" fill="#5A5A5A" text-anchor="middle">By purpose: land, topographical, cadastral (property), engineering,</text><text x="180" y="220" font-size="7.5" fill="#5A5A5A" text-anchor="middle">hydrographic and control surveys - the job picks the method.</text></svg>