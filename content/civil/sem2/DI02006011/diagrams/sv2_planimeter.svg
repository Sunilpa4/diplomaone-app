<svg xmlns="http://www.w3.org/2000/svg" width="360" height="238" viewBox="0 0 360 238" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="238" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Planimeter - area from a plotted plan</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 2.5: trace the boundary; the wheel integrates it</text><circle cx="96" cy="96" r="7" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.5"/><line x1="96" y1="96" x2="236" y2="130" stroke="#2F5D8A" stroke-width="2.2"/><line x1="236" y1="130" x2="300" y2="84" stroke="#B66A00" stroke-width="2.2"/><circle cx="300" cy="84" r="4" fill="#FDEBD7" stroke="#B66A00" stroke-width="1.2"/><circle cx="236" cy="130" r="3" fill="#272134" stroke="#272134" stroke-width="0.8"/><circle cx="252" cy="122" r="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.4"/><text x="96" y="82" font-size="7.5" fill="#2F5D8A" text-anchor="middle" font-weight="bold">anchor (fixed)</text><text x="306" y="72" font-size="7.5" fill="#B66A00" text-anchor="end" font-weight="bold">tracing point</text><text x="262" y="142" font-size="7.5" fill="#2E7D32" text-anchor="start">measuring wheel + dial</text><path d="M130 160 L300 160 L300 190 L130 190 Z" fill="#FFF8E1" stroke="#BD2543" stroke-width="1.1"/><text x="215" y="179" font-size="7.5" fill="#BD2543" text-anchor="middle">boundary traced clockwise once</text><rect x="52" y="200" width="262" height="34" rx="3" fill="#F3E5F5" stroke="#7B2CD9" stroke-width="1.1"/><text x="183" y="213" font-size="8" fill="#272134" text-anchor="middle" font-weight="bold">Area = M x (FR - IR +/- 10N + C)</text><text x="183" y="226" font-size="7" fill="#5A5A5A" text-anchor="middle">the wheel counts the area as you trace</text></svg>