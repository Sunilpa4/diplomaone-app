<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="220" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Pressure references</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Absolute pressure = atmospheric + gauge</text><line x1="65" y1="175" x2="65" y2="50" stroke="#272134" stroke-width="2"/><line x1="65" y1="175" x2="315" y2="175" stroke="#5A5A5A" stroke-width="1.2"/><line x1="45" y1="125" x2="290" y2="125" stroke="#2F5D8A" stroke-width="1.5" stroke-dasharray="5 3"/><line x1="45" y1="65" x2="290" y2="65" stroke="#B66A00" stroke-width="1.5" stroke-dasharray="5 3"/><line x1="95" y1="175" x2="95" y2="65" stroke="#B66A00" stroke-width="1.6"/><polygon points="95.0,65.0 91.4,73.0 98.6,73.0" fill="#B66A00"/><line x1="140" y1="125" x2="140" y2="65" stroke="#2F5D8A" stroke-width="1.6"/><polygon points="140.0,65.0 136.4,73.0 143.6,73.0" fill="#2F5D8A"/><text x="190" y="68" font-size="10" fill="#B66A00" text-anchor="start" font-weight="bold">measured pressure</text><text x="190" y="128" font-size="10" fill="#2F5D8A" text-anchor="start" font-weight="bold">atmospheric pressure</text><text x="155" y="179" font-size="9" fill="#272134" text-anchor="start" font-weight="bold">absolute zero (vacuum)</text><text x="105" y="105" font-size="9" fill="#B66A00" text-anchor="start" font-weight="bold">absolute</text><text x="150" y="100" font-size="9" fill="#2F5D8A" text-anchor="start" font-weight="bold">gauge</text><text x="180" y="205" font-size="8" fill="#5A5A5A" text-anchor="middle">Shown for pressure above atmosphere</text></svg>