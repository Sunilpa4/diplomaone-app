ater</text><text x="162" y="116" font-size="7" fill="#5A5A5A" text-anchor="middle" font-weight="bold">air</text><text x="243" y="116" font-size="9" fill="#2F5D8A" text-anchor="middle" font-weight="bold">aggregates</text><text x="180" y="187" font-size="8.5" fill="#272134" text-anchor="middle">Absolute volumes sum to 1 m³ (including admixture)</text></svg>