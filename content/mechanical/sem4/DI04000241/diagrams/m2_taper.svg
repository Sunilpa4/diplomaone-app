<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif" fill="#30303b"><rect width="900" height="620" fill="white"/><text x="30" y="35" font-size="22">External taper: large/small diameters and axial taper length</text><path d="M150 200 L700 250 L700 350 L150 400 Z" stroke="#765099" stroke-width="3" fill="#e7f3fb"/><path d="M100 300 L760 300" fill="none" stroke="#888" stroke-width="3"/><path d="M150 455 L700 455" fill="none" stroke="#765099" stroke-width="3"/><text x="390" y="490" font-size="18">Taper length l</text><text x="90" y="305" font-size="18">D</text><text x="725" y="305" font-size="18">d</text><text x="320" y="160" font-size="18">tan(alpha)=(D-d)/(2l)</text><text x="35" y="540" font-size="17">Alpha is the half-angle to the axis; included angle is 2alpha.</text><text x="30" y="603" font-size="12">Original conceptual schematic · not to scale · not an operating/setup instruction</text><path d="M125 200 L125 400" fill="none" stroke="#2679ad" stroke-width="3"/><path d="M120.3269798922962 388.94726807196537 L125 400 L129.6730201077038 388.94726807196537" stroke="#2679ad" stroke-width="3" fill="none"/><path d="M125 400 L125 200" fill="none" stroke="#2679ad" stroke-width="3"/><path d="M129.6730201077038 211.05273192803463 L125 200 L120.3269798922962 211.05273192803463" stroke="#2679ad" stroke-width="3" fill="none"/><path d="M735 250 L735 350" fill="none" stroke="#2679ad" stroke-width="3"/><path d="M730.3269798922962 338.94726807196537 L735 350 L739.6730201077038 338.94726807196537" stroke="#2679ad" stroke-width="3" fill="none"/><path d="M735 350 L735 250" fill="none" stroke="#2679ad" stroke-width="3"/><path d="M739.6730201077038 261.05273192803463 L735 250 L730.3269798922962 261.05273192803463" stroke="#2679ad" stroke-width="3" fill="none"/></svg>