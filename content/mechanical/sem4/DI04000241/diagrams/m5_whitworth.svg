<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif" fill="#30303b"><rect width="900" height="620" fill="white"/><text x="30" y="35" font-size="22">Whitworth-type quick return: offset centres,slot,link and ram</text><circle cx="400" cy="270" r="180" fill="#eee8f2" stroke="#765099" stroke-width="3"/><circle cx="450" cy="270" r="100" fill="none" stroke="#765099" stroke-width="3"/><circle cx="400" cy="270" r="7" fill="white" stroke="#765099" stroke-width="3"/><circle cx="450" cy="270" r="7" fill="white" stroke="#765099" stroke-width="3"/><path d="M400 270 L550 180.73214464321438" fill="none" stroke="#765099" stroke-width="11"/><path d="M450 270 L520 198.5857157145715" fill="none" stroke="#be6633" stroke-width="7"/><circle cx="520" cy="198.5857157145715" r="10" fill="#f5e4d7" stroke="#765099" stroke-width="3"/><path d="M550 180.73214464321438 L690 180" fill="none" stroke="#be6633" stroke-width="6"/><rect x="690" y="150" width="100" height="60" fill="#e9e2f1" stroke="#765099" stroke-width="2"/><text x="645" y="120" font-size="18">Link to ram</text><text x="95" y="465" font-size="18">Q: fixed slotted-member pivot</text><text x="485" y="420" font-size="18">O: fixed input-crank centre</text><text x="530" y="105" font-size="18">Sliding crank pin</text><path d="M550 120 L520 198.5857157145715" fill="none" stroke="#777" stroke-width="1"/><text x="35" y="540" font-size="17">One kinematic pose: uniform input produces nonuniform output. Label actual members,not just</text><text x="35" y="563" font-size="17">the mechanism name.</text><text x="30" y="603" font-size="12">Original conceptual schematic · not to scale · not an operating/setup instruction</text></svg>