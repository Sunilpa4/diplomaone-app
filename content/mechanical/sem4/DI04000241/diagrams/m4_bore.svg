<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif" fill="#30303b"><rect width="900" height="620" fill="white"/><text x="30" y="35" font-size="22">Boring: single-point tool enlarges an existing hole</text><rect x="150" y="210" width="560" height="200" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><rect x="150" y="265" width="560" height="90" fill="white" stroke="#765099" stroke-width="2"/><path d="M90 310 L570 310" fill="none" stroke="#765099" stroke-width="24"/><path d="M570 310 L610 265 L610 310 Z" stroke="#be6633" stroke-width="3" fill="#f5e4d7"/><text x="240" y="160" font-size="18">Existing hole</text><text x="95" y="465" font-size="18">Boring bar: overhang and stiffness matter</text><path d="M240 480 L430 480" fill="none" stroke="#2679ad" stroke-width="3"/><path d="M418.94726807196537 484.6730201077038 L430 480 L418.94726807196537 475.3269798922962" stroke="#2679ad" stroke-width="3" fill="none"/><text x="35" y="540" font-size="17">The machine may rotate the tool or work. Boring is not the same as initially drilling a</text><text x="35" y="563" font-size="17">solid blank.</text><text x="30" y="603" font-size="12">Original conceptual schematic · not to scale · not an operating/setup instruction</text></svg>