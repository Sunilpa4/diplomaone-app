<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif"><rect width="900" height="620" fill="white"/><text x="30" y="32" font-size="21" fill="#765099">Two-stage compressor:intercooling reduces next-stage inlet temperature</text><rect x="45" y="240" width="180" height="80" fill="#e7f3fb" stroke="#777" stroke-width="2"/><text x="57" y="270" font-size="17" fill="#333">LP cylinder</text><line x1="228" y1="280" x2="250" y2="280" stroke="#2679ad" stroke-width="2.5"/><path d="M239.86832906596825,284.28360176539513 L250,280 L239.86832906596825,275.71639823460487" stroke="#2679ad" stroke-width="2" fill="none"/><rect x="255" y="240" width="180" height="80" fill="#e7f3fb" stroke="#777" stroke-width="2"/><text x="267" y="270" font-size="17" fill="#333">Intercooler</text><line x1="438" y1="280" x2="460" y2="280" stroke="#2679ad" stroke-width="2.5"/><path d="M449.8683290659683,284.28360176539513 L460,280 L449.8683290659683,275.71639823460487" stroke="#2679ad" stroke-width="2" fill="none"/><rect x="465" y="240" width="180" height="80" fill="#e7f3fb" stroke="#777" stroke-width="2"/><text x="477" y="270" font-size="17" fill="#333">Moisture removal</text><line x1="648" y1="280" x2="670" y2="280" stroke="#2679ad" stroke-width="2.5"/><path d="M659.8683290659683,284.28360176539513 L670,280 L659.8683290659683,275.71639823460487" stroke="#2679ad" stroke-width="2" fill="none"/><rect x="675" y="240" width="180" height="80" fill="#e7f3fb" stroke="#777" stroke-width="2"/><text x="687" y="270" font-size="17" fill="#333">HP cylinder</text><text x="55" y="430" font-size="17" fill="#333">p1→pi;cool toward T1;then pi→p2;actual pressure losses shift the optimum</text><text x="30" y="603" font-size="12" fill="#777">Original conceptual diagram · not to scale · not an operating or fabrication instruction</text></svg>