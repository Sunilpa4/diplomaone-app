<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif" fill="#30303b"><rect width="900" height="620" fill="white"/><text x="30" y="35" font-size="22">Cotter-slot net sections: the slot removes tensile area</text><circle cx="250" cy="300" r="120" fill="#e7f3fb" stroke="#765099" stroke-width="3"/><rect x="130" y="285" width="240" height="30" fill="white" stroke="#765099" stroke-width="2"/><circle cx="650" cy="300" r="140" fill="#e7f3fb" stroke="#765099" stroke-width="3"/><circle cx="650" cy="300" r="85" fill="white" stroke="#765099" stroke-width="3"/><rect x="510" y="285" width="280" height="30" fill="white" stroke="#765099" stroke-width="2"/><text x="95" y="130" font-size="18">Spigot:pi ds²/4-ds t</text><text x="480" y="130" font-size="18">Socket:pi(D²-ds²)/4-(D-ds)t</text><text x="35" y="540" font-size="17">Projected-slot subtraction is the stated textbook approximation;actual slot corners also</text><text x="35" y="563" font-size="17">concentrate stress.</text><text x="30" y="603" font-size="12">Original conceptual schematic · not to scale · not an operating/setup instruction</text></svg>