<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif" fill="#30303b"><rect width="900" height="620" fill="white"/><text x="30" y="35" font-size="22">Three spring duties:classify by external loading</text><rect x="60" y="225" width="235" height="85" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="70" y="253" font-size="17">Compression</text><rect x="335" y="225" width="235" height="85" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="345" y="253" font-size="17">Extension + hooks</text><rect x="610" y="225" width="235" height="85" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="620" y="253" font-size="17">Torsion + legs</text><text x="75" y="390" font-size="18">Axial shortening</text><text x="345" y="390" font-size="18">Axial stretching</text><text x="625" y="390" font-size="18">Applied end moment</text><text x="35" y="540" font-size="17">Torsion-spring wire mainly bends;do not apply the compression-spring stress/deflection law</text><text x="35" y="563" font-size="17">to every coil.</text><text x="30" y="603" font-size="12">Original conceptual schematic · not to scale · not an operating/setup instruction</text></svg>