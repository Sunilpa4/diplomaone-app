<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif" fill="#30303b"><rect width="900" height="620" fill="white"/><text x="30" y="35" font-size="22">Double-cover butt joint: main plates meet,cover straps bridge</text><rect x="120" y="265" width="320" height="75" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><rect x="450" y="265" width="320" height="75" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><rect x="250" y="220" width="400" height="45" fill="#f5e4d7" stroke="#765099" stroke-width="2"/><rect x="250" y="340" width="400" height="45" fill="#f5e4d7" stroke="#765099" stroke-width="2"/><rect x="320" y="195" width="30" height="215" fill="#e9e2f1" stroke="#765099" stroke-width="2"/><rect x="550" y="195" width="30" height="215" fill="#e9e2f1" stroke="#765099" stroke-width="2"/><text x="330" y="140" font-size="18">Two covers</text><text x="320" y="450" font-size="18">Two shear interfaces per rivet</text><text x="35" y="540" font-size="17">In a butt joint,use rivets on ONE side of the butt for load capacity;do not count both</text><text x="35" y="563" font-size="17">sides in series twice.</text><text x="30" y="603" font-size="12">Original conceptual schematic · not to scale · not an operating/setup instruction</text></svg>