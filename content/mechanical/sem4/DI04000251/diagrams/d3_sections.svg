<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif" fill="#30303b"><rect width="900" height="620" fill="white"/><text x="30" y="35" font-size="22">Section modulus: the bending axis matters</text><rect x="90" y="220" width="140" height="200" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><circle cx="425" cy="320" r="100" fill="#e7f3fb" stroke="#765099" stroke-width="3"/><circle cx="700" cy="320" r="110" fill="#e7f3fb" stroke="#765099" stroke-width="3"/><circle cx="700" cy="320" r="65" fill="white" stroke="#765099" stroke-width="3"/><text x="75" y="150" font-size="18">Z=bh²/6</text><text x="340" y="150" font-size="18">Z=pi d³/32</text><text x="570" y="150" font-size="18">Z=pi(Do⁴-Di⁴)/(32Do)</text><text x="35" y="540" font-size="17">Rectangle h is the dimension in the bending-stress direction;swapping b and h changes the</text><text x="35" y="563" font-size="17">result.</text><text x="30" y="603" font-size="12">Original conceptual schematic · not to scale · not an operating/setup instruction</text></svg>