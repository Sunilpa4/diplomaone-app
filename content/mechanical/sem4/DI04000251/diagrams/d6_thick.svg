<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif" fill="#30303b"><rect width="900" height="620" fill="white"/><text x="30" y="35" font-size="22">Thick cylinder: radial stress varies through the wall</text><circle cx="320" cy="310" r="150" fill="#e7f3fb" stroke="#765099" stroke-width="3"/><circle cx="320" cy="310" r="85" fill="white" stroke="#765099" stroke-width="3"/><path d="M320 310 L390 310" fill="none" stroke="#be6633" stroke-width="3"/><path d="M378.94726807196537 314.6730201077038 L390 310 L378.94726807196537 305.3269798922962" stroke="#be6633" stroke-width="3" fill="none"/><text x="170" y="100" font-size="18">ri / ro;internal pressure pi</text><text x="550" y="205" font-size="18">At ri:sigma r=-pi</text><text x="550" y="285" font-size="18">At ro:sigma r=-po</text><text x="500" y="400" font-size="18">Hoop stress highest inside</text><text x="35" y="540" font-size="17">Use Lamé thick-wall equations and a stated failure criterion,not a thin-shell formula</text><text x="35" y="563" font-size="17">without a geometry check.</text><text x="30" y="603" font-size="12">Original conceptual schematic · not to scale · not an operating/setup instruction</text></svg>