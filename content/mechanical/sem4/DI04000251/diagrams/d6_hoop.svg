<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif" fill="#30303b"><rect width="900" height="620" fill="white"/><text x="30" y="35" font-size="22">Thin closed cylinder: longitudinal cut resists hoop opening</text><rect x="180" y="190" width="540" height="220" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><path d="M180 300 L720 300" fill="none" stroke="#be6633" stroke-width="5"/><path d="M450 190 L450 110" fill="none" stroke="#be6633" stroke-width="3"/><path d="M454.6730201077038 121.05273192803462 L450 110 L445.3269798922962 121.05273192803462" stroke="#be6633" stroke-width="3" fill="none"/><path d="M450 410 L450 485" fill="none" stroke="#be6633" stroke-width="3"/><path d="M445.3269798922962 473.94726807196537 L450 485 L454.6730201077038 473.94726807196537" stroke="#be6633" stroke-width="3" fill="none"/><text x="190" y="145" font-size="18">Pressure resultant=p D L</text><text x="200" y="525" font-size="18">Two wall strips:resisting area=2tL</text><text x="35" y="540" font-size="17">Hoop stress=pD/(2t). A transverse end cut instead gives longitudinal stress=pD/(4t) for</text><text x="35" y="563" font-size="17">closed ends.</text><text x="30" y="603" font-size="12">Original conceptual schematic · not to scale · not an operating/setup instruction</text></svg>