<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif" fill="#30303b"><rect width="900" height="620" fill="white"/><text x="25" y="32" font-size="21">Gear manufacture:do not confuse forming and form cutting</text><rect x="35" y="110" width="235" height="55" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="45" y="136" font-size="17">Blank/preform</text><path d="M275 137L310 137" stroke="#2679ad" stroke-width="3" fill="none"/><path d="M298.94726807196537 141.6730201077038L310 137L298.94726807196537 132.3269798922962" stroke="#2679ad" stroke-width="3" fill="none"/><rect x="320" y="110" width="545" height="55" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="330" y="136" font-size="17">Cast / forge / powder / mould as suitable</text><rect x="35" y="178" width="235" height="55" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="45" y="204" font-size="17">Form cutting</text><path d="M275 205L310 205" stroke="#2679ad" stroke-width="3" fill="none"/><path d="M298.94726807196537 209.6730201077038L310 205L298.94726807196537 200.3269798922962" stroke="#2679ad" stroke-width="3" fill="none"/><rect x="320" y="178" width="545" height="55" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="330" y="204" font-size="17">Form mill copies tooth-space geometry</text><rect x="35" y="246" width="235" height="55" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="45" y="272" font-size="17">Generating</text><path d="M275 273L310 273" stroke="#2679ad" stroke-width="3" fill="none"/><path d="M298.94726807196537 277.6730201077038L310 273L298.94726807196537 268.3269798922962" stroke="#2679ad" stroke-width="3" fill="none"/><rect x="320" y="246" width="545" height="55" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="330" y="272" font-size="17">Hob / pinion-shape envelopes profile</text><rect x="35" y="314" width="235" height="55" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="45" y="340" font-size="17">Finishing</text><path d="M275 341L310 341" stroke="#2679ad" stroke-width="3" fill="none"/><path d="M298.94726807196537 345.6730201077038L310 341L298.94726807196537 336.3269798922962" stroke="#2679ad" stroke-width="3" fill="none"/><rect x="320" y="314" width="545" height="55" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="330" y="340" font-size="17">Shave / grind / hone / lap as suitable</text><text x="30" y="535" font-size="16">Source2.4calls its form-milling example Gear Forming;actual milling removes chips</text><text x="30" y="557" font-size="16">rather than bulk-plastically forming teeth.</text><text x="25" y="605" font-size="12">Original conceptual teaching schematic · not to scale · no operating/setup dimensions</text></svg>