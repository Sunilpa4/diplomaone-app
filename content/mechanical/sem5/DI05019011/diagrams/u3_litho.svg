<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif" fill="#30303b"><rect width="900" height="620" fill="white"/><text x="25" y="32" font-size="21">Lithography:patterned exposure of resist,not substrate cutting</text><rect x="180" y="370" width="540" height="60" fill="#e9e2f1" stroke="#765099" stroke-width="2"/><rect x="180" y="335" width="540" height="30" fill="#f5e4d7" stroke="#765099" stroke-width="2"/><rect x="160" y="200" width="160" height="35" fill="#e9e2f1" stroke="#765099" stroke-width="2"/><rect x="395" y="200" width="130" height="35" fill="#e9e2f1" stroke="#765099" stroke-width="2"/><rect x="610" y="200" width="130" height="35" fill="#e9e2f1" stroke="#765099" stroke-width="2"/><path d="M345 100L345 310" stroke="#be6633" stroke-width="3" fill="none"/><path d="M340.3269798922962 298.94726807196537L345 310L349.6730201077038 298.94726807196537" stroke="#be6633" stroke-width="3" fill="none"/><path d="M565 100L565 310" stroke="#be6633" stroke-width="3" fill="none"/><path d="M560.3269798922962 298.94726807196537L565 310L569.6730201077038 298.94726807196537" stroke="#be6633" stroke-width="3" fill="none"/><text x="80" y="180" font-size="17">Pattern mask</text><text x="80" y="320" font-size="17">Resist</text><text x="80" y="455" font-size="17">Substrate</text><text x="380" y="490" font-size="20">Expose → develop → transfer</text><text x="30" y="535" font-size="16">Positive/negative chemistry changes which regions develop</text><text x="30" y="557" font-size="16">away.Alignment,resolution,resist and cleanliness determine the transferred pattern.No</text><text x="30" y="579" font-size="16">chemical recipe.</text><text x="25" y="605" font-size="12">Original conceptual teaching schematic · not to scale · no operating/setup dimensions</text></svg>