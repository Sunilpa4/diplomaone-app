<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif" fill="#30303b"><rect width="900" height="620" fill="white"/><text x="25" y="32" font-size="21">STL:triangulated boundary approximation</text><path d="M180 430L450 130L750 430Z" stroke="#765099" stroke-width="3" fill="#e7f3fb"/><path d="M180 430L450 300" stroke="#765099" stroke-width="3" fill="none"/><path d="M450 300L450 130" stroke="#765099" stroke-width="3" fill="none"/><path d="M450 300L750 430" stroke="#765099" stroke-width="3" fill="none"/><path d="M180 430L600 390" stroke="#765099" stroke-width="3" fill="none"/><path d="M600 390L450 300" stroke="#765099" stroke-width="3" fill="none"/><text x="55" y="125" font-size="20">Triangular boundary facets</text><text x="115" y="485" font-size="22">STL ≠ exact CAD geometry ≠ sliced toolpath</text><text x="30" y="535" font-size="16">Common STL does not reliably carry engineering units/material semantics.Check</text><text x="30" y="557" font-size="16">watertightness,normal orientation,scale and tessellation error before slicing.</text><text x="25" y="605" font-size="12">Original conceptual teaching schematic · not to scale · no operating/setup dimensions</text></svg>