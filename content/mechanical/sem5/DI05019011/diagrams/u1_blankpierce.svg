<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif" fill="#30303b"><rect width="900" height="620" fill="white"/><text x="25" y="32" font-size="21">Blanking versus piercing:product identity determines size control</text><rect x="70" y="180" width="320" height="80" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><circle cx="230" cy="220" r="45" fill="#f5e4d7" stroke="#765099" stroke-width="3"/><text x="75" y="310" font-size="18">Blanking:cut-out is product</text><rect x="520" y="180" width="320" height="80" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><circle cx="680" cy="220" r="45" fill="white" stroke="#765099" stroke-width="3"/><circle cx="680" cy="390" r="45" fill="#f5e4d7" stroke="#765099" stroke-width="3"/><path d="M680 280L680 335" stroke="#be6633" stroke-width="3" fill="none"/><path d="M675.3269798922962 323.94726807196537L680 335L684.6730201077038 323.94726807196537" stroke="#be6633" stroke-width="3" fill="none"/><text x="520" y="310" font-size="18">Piercing:hole is required</text><text x="610" y="465" font-size="18">Slug is scrap</text><text x="70" y="420" font-size="17">Blank size → die opening</text><text x="520" y="500" font-size="17">Hole size → punch size</text><text x="30" y="535" font-size="16">Per-side clearance c:blanking punch=Dblank−2c;piercing die=Dhole+2c.Cutting load</text><text x="30" y="557" font-size="16">estimate is not a complete press-capacity selection.</text><text x="25" y="605" font-size="12">Original conceptual teaching schematic · not to scale · no operating/setup dimensions</text></svg>