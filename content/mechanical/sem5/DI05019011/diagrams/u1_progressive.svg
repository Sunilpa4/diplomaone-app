<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif" fill="#30303b"><rect width="900" height="620" fill="white"/><text x="25" y="32" font-size="21">Progressive die:multiple stations along one fed strip</text><rect x="90" y="265" width="720" height="100" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><path d="M100 135L795 135" stroke="#be6633" stroke-width="3" fill="none"/><path d="M783.9472680719654 139.6730201077038L795 135L783.9472680719654 130.3269798922962" stroke="#be6633" stroke-width="3" fill="none"/><text x="340" y="110" font-size="20">Fixed-pitch strip feed</text><circle cx="200" cy="315" r="14" fill="white" stroke="#765099" stroke-width="3"/><path d="M200 190L200 250" stroke="#765099" stroke-width="3" fill="none"/><text x="130" y="225" font-size="16">Pierce</text><circle cx="450" cy="315" r="14" fill="white" stroke="#765099" stroke-width="3"/><path d="M450 190L450 250" stroke="#765099" stroke-width="3" fill="none"/><text x="380" y="225" font-size="16">Trim/form if required</text><circle cx="700" cy="315" r="14" fill="white" stroke="#765099" stroke-width="3"/><path d="M700 190L700 250" stroke="#765099" stroke-width="3" fill="none"/><text x="630" y="225" font-size="16">Cutoff/blank</text><circle cx="450" cy="315" r="40" fill="white" stroke="#765099" stroke-width="3"/><circle cx="700" cy="315" r="40" fill="white" stroke="#765099" stroke-width="3"/><text x="100" y="450" font-size="19">Different strip sections occupy stations simultaneously</text><text x="140" y="495" font-size="19">After initial fill:completed part at final station</text><text x="30" y="535" font-size="16">Station operations depend on actual part design;circles indicate illustrative</text><text x="30" y="557" font-size="16">features/web regions,not a finished die layout or an approved feeding procedure.</text><text x="25" y="605" font-size="12">Original conceptual teaching schematic · not to scale · no operating/setup dimensions</text></svg>