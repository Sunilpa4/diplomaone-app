99" stroke-width="2"/><text x="635" y="406" font-size="17">Stn</text><path d="M745 300L655 400" stroke="#2679ad" stroke-width="3" fill="none"/><rect x="795" y="380" width="65" height="50" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="805" y="406" font-size="17">Stn</text><path d="M745 300L825 400" stroke="#2679ad" stroke-width="3" fill="none"/><text x="30" y="535" font-size="16">Each sketch is an alternative layout,not a process sequence.In-</text><text x="30" y="557" font-size="16">line,loop,ladder,network and robot-centred choices depend on routing,reach,traffic and</text><text x="30" y="579" font-size="16">capacity.</text><text x="25" y="605" font-size="12">Original conceptual teaching schematic · not to scale · no operating/setup dimensions</text></svg>