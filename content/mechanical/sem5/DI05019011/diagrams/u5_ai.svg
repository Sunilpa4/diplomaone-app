<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif" fill="#30303b"><rect width="900" height="620" fill="white"/><text x="25" y="32" font-size="21">AI in manufacturing:task,output and validation</text><rect x="35" y="110" width="235" height="55" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="45" y="136" font-size="17">Defect detection</text><path d="M275 137L310 137" stroke="#2679ad" stroke-width="3" fill="none"/><path d="M298.94726807196537 141.6730201077038L310 137L298.94726807196537 132.3269798922962" stroke="#2679ad" stroke-width="3" fill="none"/><rect x="320" y="110" width="545" height="55" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="330" y="136" font-size="17">Images/data → defect score;check errors</text><rect x="35" y="178" width="235" height="55" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="45" y="204" font-size="17">Predictive maintenance</text><path d="M275 205L310 205" stroke="#2679ad" stroke-width="3" fill="none"/><path d="M298.94726807196537 209.6730201077038L310 205L298.94726807196537 200.3269798922962" stroke="#2679ad" stroke-width="3" fill="none"/><rect x="320" y="178" width="545" height="55" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="330" y="204" font-size="17">Condition trends → risk/service estimate</text><rect x="35" y="246" width="235" height="55" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="45" y="272" font-size="17">Optimisation</text><path d="M275 273L310 273" stroke="#2679ad" stroke-width="3" fill="none"/><path d="M298.94726807196537 277.6730201077038L310 273L298.94726807196537 268.3269798922962" stroke="#2679ad" stroke-width="3" fill="none"/><rect x="320" y="246" width="545" height="55" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="330" y="272" font-size="17">Model → constrained setting/schedule advice</text><rect x="35" y="314" width="235" height="55" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="45" y="340" font-size="17">Every task needs</text><path d="M275 341L310 341" stroke="#2679ad" stroke-width="3" fill="none"/><path d="M298.94726807196537 345.6730201077038L310 341L298.94726807196537 336.3269798922962" stroke="#2679ad" stroke-width="3" fill="none"/><rect x="320" y="314" width="545" height="55" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="330" y="340" font-size="17">Data quality / validation / drift / safe fallback</text><text x="30" y="535" font-size="16">AI does not guarantee zero defects or justify overriding interlocks.Human review and</text><text x="30" y="557" font-size="16">domain-valid performance remain essential.</text><text x="25" y="605" font-size="12">Original conceptual teaching schematic · not to scale · no operating/setup dimensions</text></svg>