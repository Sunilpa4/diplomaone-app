<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif" fill="#30303b"><rect width="900" height="620" fill="white"/><text x="30" y="35" font-size="22">MPFI: one port injector per cylinder</text><rect x="60.0" y="245" width="162.5" height="85" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="70.0" y="273" font-size="17">Tank / pump</text><path d="M225.5 285 L244.5 285" fill="none" stroke="#2679ad" stroke-width="3"/><path d="M233.44726807196537 289.6730201077038 L244.5 285 L233.44726807196537 280.3269798922962" stroke="#2679ad" stroke-width="3" fill="none"/><rect x="247.5" y="245" width="162.5" height="85" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="257.5" y="273" font-size="17">Filtered rail</text><path d="M413.0 285 L432.0 285" fill="none" stroke="#2679ad" stroke-width="3"/><path d="M420.94726807196537 289.6730201077038 L432.0 285 L420.94726807196537 280.3269798922962" stroke="#2679ad" stroke-width="3" fill="none"/><rect x="435.0" y="245" width="162.5" height="85" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="445.0" y="273" font-size="17">Port injectors</text><path d="M600.5 285 L619.5 285" fill="none" stroke="#2679ad" stroke-width="3"/><path d="M608.4472680719654 289.6730201077038 L619.5 285 L608.4472680719654 280.3269798922962" stroke="#2679ad" stroke-width="3" fill="none"/><rect x="622.5" y="245" width="162.5" height="85" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="632.5" y="273" font-size="17">Intake valves</text><text x="35" y="540" font-size="17">ECU uses sensor inputs to meter port injection; MPFI is not direct injection</text><text x="35" y="563" font-size="17">into the cylinder.</text><text x="30" y="603" font-size="12">Original conceptual schematic · not to scale · not an operating/setup instruction</text></svg>