<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif" fill="#30303b"><rect width="900" height="620" fill="white"/><text x="30" y="35" font-size="22">PEM electrolyser: powered water splitting, distinct gas outlets</text><rect x="50" y="185" width="210" height="190" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="60" y="213" font-size="17">Anode / oxygen</text><rect x="385" y="155" width="70" height="250" fill="#ded4ec" stroke="#765099" stroke-width="2"/><rect x="580" y="185" width="260" height="190" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="590" y="213" font-size="17">Cathode / hydrogen</text><rect x="330" y="75" width="200" height="60" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="340" y="103" font-size="17">DC source</text><path d="M330 105 L155 105 L155 180 M530 105 L710 105 L710 180" stroke="#be6633" stroke-width="4" fill="none"/><path d="M270 290 L575 290" fill="none" stroke="#2679ad" stroke-width="3"/><path d="M563.9472680719654 294.6730201077038 L575 290 L563.9472680719654 285.3269798922962" stroke="#2679ad" stroke-width="3" fill="none"/><text x="285" y="335" font-size="16">H+ through membrane</text><text x="270" y="455" font-size="18">Water feed / gas separation / cooling</text><text x="90" y="425" font-size="17">O2 out</text><text x="655" y="425" font-size="17">H2 out</text><text x="35" y="540" font-size="17">Anode evolves oxygen; cathode evolves hydrogen. Protons cross the membrane;</text><text x="35" y="563" font-size="17">external electricity drives the process. Alkaline/solid-oxide ion chemistry</text><text x="35" y="586" font-size="17">differs.</text><text x="30" y="603" font-size="12">Original conceptual schematic · not to scale · not an operating/setup instruction</text></svg>