<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif" fill="#30303b"><rect width="900" height="620" fill="white"/><text x="30" y="35" font-size="22">IC engines: classify by ONE stated basis at a time</text><rect x="45" y="120.0" width="220" height="55" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="55" y="148.0" font-size="17">Ignition</text><path d="M270 145.0 L310 145.0" fill="none" stroke="#2679ad" stroke-width="3"/><path d="M298.94726807196537 149.6730201077038 L310 145.0 L298.94726807196537 140.3269798922962" stroke="#2679ad" stroke-width="3" fill="none"/><rect x="320" y="120.0" width="530" height="55" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="330" y="148.0" font-size="17">Spark ignition / compression ignition</text><rect x="45" y="183.33333333333334" width="220" height="55" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="55" y="211.33333333333334" font-size="17">Cycle strokes</text><path d="M270 208.33333333333334 L310 208.33333333333334" fill="none" stroke="#2679ad" stroke-width="3"/><path d="M298.94726807196537 213.00635344103716 L310 208.33333333333334 L298.94726807196537 203.66031322562952" stroke="#2679ad" stroke-width="3" fill="none"/><rect x="320" y="183.33333333333334" width="530" height="55" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="330" y="211.33333333333334" font-size="17">Four-stroke / two-stroke</text><rect x="45" y="246.66666666666669" width="220" height="55" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="55" y="274.6666666666667" font-size="17">Fuel</text><path d="M270 271.6666666666667 L310 271.6666666666667" fill="none" stroke="#2679ad" stroke-width="3"/><path d="M298.94726807196537 276.3396867743705 L310 271.6666666666667 L298.94726807196537 266.9936465589629" stroke="#2679ad" stroke-width="3" fill="none"/><rect x="320" y="246.66666666666669" width="530" height="55" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="330" y="274.6666666666667" font-size="17">Petrol / diesel / gas / dual-fuel</text><rect x="45" y="310.0" width="220" height="55" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="55" y="338.0" font-size="17">Cooling</text><path d="M270 335.0 L310 335.0" fill="none" stroke="#2679ad" stroke-width="3"/><path d="M298.94726807196537 339.6730201077038 L310 335.0 L298.94726807196537 330.3269798922962" stroke="#2679ad" stroke-width="3" fill="none"/><rect x="320" y="310.0" width="530" height="55" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="330" y="338.0" font-size="17">Air / liquid</text><rect x="45" y="373.33333333333337" width="220" height="55" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="55" y="401.33333333333337" font-size="17">Charging</text><path d="M270 398.33333333333337 L310 398.33333333333337" fill="none" stroke="#2679ad" stroke-width="3"/><path d="M298.94726807196537 403.00635344103716 L310 398.33333333333337 L298.94726807196537 393.6603132256296" stroke="#2679ad" stroke-width="3" fill="none"/><rect x="320" y="373.33333333333337" width="530" height="55" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="330" y="401.33333333333337" font-size="17">Naturally aspirated / boosted</text><rect x="45" y="436.6666666666667" width="220" height="55" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="55" y="464.6666666666667" font-size="17">Arrangement</text><path d="M270 461.6666666666667 L310 461.6666666666667" fill="none" stroke="#2679ad" stroke-width="3"/><path d="M298.94726807196537 466.3396867743705 L310 461.6666666666667 L298.94726807196537 456.9936465589629" stroke="#2679ad" stroke-width="3" fill="none"/><rect x="320" y="436.6666666666667" width="530" height="55" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="330" y="464.6666666666667" font-size="17">In-line / V / opposed;other layouts</text><text x="35" y="540" font-size="17">A single engine belongs to several categories at once; these are not</text><text x="35" y="563" font-size="17">successive flow stages.</text><text x="30" y="603" font-size="12">Original conceptual schematic · not to scale · not an operating/setup instruction</text></svg>