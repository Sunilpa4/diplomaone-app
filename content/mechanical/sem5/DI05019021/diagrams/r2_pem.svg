<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif" fill="#30303b"><rect width="900" height="620" fill="white"/><text x="30" y="35" font-size="22">PEM fuel cell: membrane, electrodes and external load</text><rect x="60" y="210" width="210" height="150" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="70" y="238" font-size="17">Anode / H2</text><rect x="390" y="175" width="65" height="235" fill="#ded4ec" stroke="#765099" stroke-width="2"/><rect x="600" y="210" width="235" height="150" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="610" y="238" font-size="17">Cathode / air</text><path d="M280 285 L590 285" fill="none" stroke="#2679ad" stroke-width="3"/><path d="M578.9472680719654 289.6730201077038 L590 285 L578.9472680719654 280.3269798922962" stroke="#2679ad" stroke-width="3" fill="none"/><rect x="335" y="90" width="220" height="65" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="345" y="118" font-size="17">Electrical load</text><path d="M165 205 L165 120 L330 120 M560 120 L710 120 L710 205" stroke="#be6633" stroke-width="5" fill="none"/><path d="M230 120 L320 120" fill="none" stroke="#be6633" stroke-width="3"/><path d="M308.94726807196537 124.6730201077038 L320 120 L308.94726807196537 115.3269798922962" stroke="#be6633" stroke-width="3" fill="none"/><text x="300" y="330" font-size="16">Protons H+ through membrane</text><text x="300" y="465" font-size="17">Electron path:external load</text><text x="610" y="410" font-size="17">Water / heat out</text><text x="35" y="540" font-size="17">Hydrogen oxidation at anode; oxygen reduction at cathode. Electrons use the</text><text x="35" y="563" font-size="17">external load, protons use membrane; gas-diffusion layers and bipolar plates</text><text x="35" y="586" font-size="17">support the stack.</text><text x="30" y="603" font-size="12">Original conceptual schematic · not to scale · not an operating/setup instruction</text></svg>