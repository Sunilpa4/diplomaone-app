<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif" fill="#30303b"><rect width="900" height="620" fill="white"/><text x="30" y="35" font-size="22">Split AC: refrigerant pipes connect indoor and outdoor units</text><rect x="70" y="190" width="240" height="85" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="80" y="218" font-size="17">Indoor coil / fan</text><rect x="570" y="300" width="270" height="110" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="580" y="328" font-size="17">Outdoor compressor /</text><text x="580" y="350" font-size="17">condenser</text><path d="M310 225 L430 225 L430 330 L565 330" stroke="#2679ad" stroke-width="6" fill="none"/><path d="M310 255 L400 255 L400 380 L565 380" stroke="#be6633" stroke-width="6" fill="none"/><text x="335" y="155" font-size="18">Two refrigerant lines</text><text x="85" y="390" font-size="18">Condensate drain separate</text><text x="35" y="540" font-size="17">Outdoor air is not automatically supplied by a standard split system;</text><text x="35" y="563" font-size="17">capacity, ventilation and humidity need separate checks.</text><text x="30" y="603" font-size="12">Original conceptual schematic · not to scale · not an operating/setup instruction</text></svg>