<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif" fill="#30303b"><rect width="900" height="620" fill="white"/><text x="30" y="35" font-size="22">Compressed gas and cryogenic liquid: storage construction differs</text><rect x="70" y="195" width="260" height="225" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><circle cx="200" cy="195" r="130" fill="#e7f3fb" stroke="#765099" stroke-width="3"/><rect x="70" y="195" width="260" height="225" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="105" y="300" font-size="18">Compressed gas</text><path d="M200 65 L200 110" stroke="#765099" stroke-width="5" fill="none"/><text x="55" y="450" font-size="17">Rated pressure vessel</text><rect x="545" y="135" width="270" height="320" fill="#e9e2f1" stroke="#765099" stroke-width="2"/><rect x="580" y="175" width="200" height="240" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><path d="M590 320 L770 320" fill="none" stroke="#2679ad" stroke-width="4"/><text x="600" y="365" font-size="18">Liquid H2</text><path d="M680 175 L680 105 L795 105" stroke="#765099" stroke-width="5" fill="none"/><path d="M760 105 L800 105" fill="none" stroke="#765099" stroke-width="3"/><path d="M788.9472680719654 109.6730201077038 L800 105 L788.9472680719654 100.3269798922962" stroke="#765099" stroke-width="3" fill="none"/><text x="545" y="85" font-size="16">Engineered relief / vent</text><text x="555" y="490" font-size="15">Inner vessel + insulation jacket</text><text x="65" y="490" font-size="15">Approved valves / protection</text><text x="35" y="540" font-size="17">Conceptual containment only, no vessel fabrication dimensions, pressures or</text><text x="35" y="563" font-size="17">transfer steps. Liquid storage needs insulation and boil-off management; both</text><text x="35" y="586" font-size="17">need engineered protection.</text><text x="30" y="603" font-size="12">Original conceptual schematic · not to scale · not an operating/setup instruction</text></svg>