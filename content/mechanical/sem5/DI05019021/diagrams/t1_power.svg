<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif" fill="#30303b"><rect width="900" height="620" fill="white"/><text x="30" y="35" font-size="22">Power accounting: IP divides into BP and FP</text><rect x="70" y="245" width="220" height="85" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="80" y="273" font-size="17">Cylinder IP</text><rect x="550" y="150" width="250" height="85" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="560" y="178" font-size="17">Shaft BP</text><rect x="550" y="350" width="250" height="85" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="560" y="378" font-size="17">Friction FP</text><path d="M295 275 L545 190" fill="none" stroke="#2679ad" stroke-width="3"/><path d="M536.0398325998874 197.98219269135745 L545 190 L533.031316709589 189.13361654342057" stroke="#2679ad" stroke-width="3" fill="none"/><path d="M295 300 L545 390" fill="none" stroke="#be6633" stroke-width="3"/><path d="M533.0177807760434 390.65301031312293 L545 390 L536.1834665482619 381.859438723627" stroke="#be6633" stroke-width="3" fill="none"/><text x="350" y="285" font-size="18">IP = BP + FP</text><text x="350" y="470" font-size="18">Fuel-energy input is a separate rate</text><text x="35" y="540" font-size="17">BP/IP is mechanical efficiency; BP/fuel-energy rate is brake thermal</text><text x="35" y="563" font-size="17">efficiency. Do not connect BP and FP in series.</text><text x="30" y="603" font-size="12">Original conceptual schematic · not to scale · not an operating/setup instruction</text></svg>