" font-size="17">Cross/loop turn the stream; uniflow sweeps predominantly one way; arrangements</text><text x="35" y="586" font-size="17">vary by engine.</text><text x="30" y="603" font-size="12">Original conceptual schematic · not to scale · not an operating/setup instruction</text></svg>