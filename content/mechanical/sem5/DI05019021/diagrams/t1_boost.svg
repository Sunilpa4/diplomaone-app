<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif" fill="#30303b"><rect width="900" height="620" fill="white"/><text x="30" y="35" font-size="22">Turbocharger: exhaust drives turbine; shaft drives intake</text><text x="30" y="60" font-size="22">compressor</text><rect x="80" y="180" width="220" height="85" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="90" y="208" font-size="17">Intake compressor</text><rect x="575" y="180" width="220" height="85" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="585" y="208" font-size="17">Exhaust turbine</text><path d="M305 225 L570 225" fill="none" stroke="#765099" stroke-width="10"/><rect x="325" y="370" width="240" height="85" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="335" y="398" font-size="17">Engine</text><path d="M300 250 L390 365" fill="none" stroke="#2679ad" stroke-width="3"/><path d="M379.50808329423415 359.17593923114885 L390 365 L386.8681367034856 353.4158974326042" stroke="#2679ad" stroke-width="3" fill="none"/><path d="M565 395 L680 270" fill="none" stroke="#be6633" stroke-width="3"/><path d="M675.9556960805575 281.297946973109 L680 270 L669.0776552488659 274.97014940795265" stroke="#be6633" stroke-width="3" fill="none"/><text x="335" y="145" font-size="18">Shared shaft</text><text x="70" y="330" font-size="18">Charge cooler if fitted</text><text x="35" y="540" font-size="17">A supercharger is mechanically driven; turbocharging recovers exhaust energy</text><text x="35" y="563" font-size="17">but adds back-pressure/control constraints.</text><text x="30" y="603" font-size="12">Original conceptual schematic · not to scale · not an operating/setup instruction</text></svg>