<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif" fill="#30303b"><rect width="900" height="620" fill="white"/><text x="30" y="35" font-size="22">Water cooler: potable-water path is separate from refrigerant</text><rect x="60" y="185" width="170" height="85" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="70" y="213" font-size="17">Water in</text><rect x="340" y="185" width="230" height="170" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="350" y="213" font-size="17">Insulated potable tank</text><rect x="680" y="185" width="180" height="85" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="690" y="213" font-size="17">Cool water out</text><path d="M235 230 L335 230" fill="none" stroke="#2679ad" stroke-width="3"/><path d="M323.94726807196537 234.6730201077038 L335 230 L323.94726807196537 225.3269798922962" stroke="#2679ad" stroke-width="3" fill="none"/><path d="M575 230 L675 230" fill="none" stroke="#2679ad" stroke-width="3"/><path d="M663.9472680719654 234.6730201077038 L675 230 L663.9472680719654 225.3269798922962" stroke="#2679ad" stroke-width="3" fill="none"/><rect x="340" y="395" width="230" height="85" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="350" y="423" font-size="17">VCR evaporator / plant</text><path d="M455 360 L455 390" fill="none" stroke="#39836b" stroke-width="3"/><path d="M450.3269798922962 378.94726807196537 L455 390 L459.6730201077038 378.94726807196537" stroke="#39836b" stroke-width="3" fill="none"/><text x="300" y="130" font-size="17">Heat exchanger separation;no fluid mixing</text><text x="35" y="540" font-size="17">Cooling duty includes incoming-water sensible heat and ambient gains.</text><text x="35" y="563" font-size="17">Temperature control and hygiene are separate requirements.</text><text x="30" y="603" font-size="12">Original conceptual schematic · not to scale · not an operating/setup instruction</text></svg>