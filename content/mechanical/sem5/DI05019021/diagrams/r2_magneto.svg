<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif" fill="#30303b"><rect width="900" height="620" fill="white"/><text x="30" y="35" font-size="22">Magneto ignition: rotating magnetic source, coil and timed spark</text><circle cx="210" cy="285" r="90" fill="#e7f3fb" stroke="#765099" stroke-width="3"/><rect x="190" y="205" width="40" height="160" fill="#f5e4d7" stroke="#765099" stroke-width="2"/><text x="200" y="240" font-size="18">N</text><text x="200" y="345" font-size="18">S</text><rect x="360" y="220" width="210" height="115" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="370" y="248" font-size="17">Armature / coil</text><rect x="620" y="220" width="220" height="115" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="630" y="248" font-size="17">Timed switch / plug</text><path d="M305 275 L355 275" fill="none" stroke="#2679ad" stroke-width="3"/><path d="M343.94726807196537 279.6730201077038 L355 275 L343.94726807196537 270.3269798922962" stroke="#2679ad" stroke-width="3" fill="none"/><path d="M575 275 L615 275" fill="none" stroke="#2679ad" stroke-width="3"/><path d="M603.9472680719654 279.6730201077038 L615 275 L603.9472680719654 270.3269798922962" stroke="#2679ad" stroke-width="3" fill="none"/><text x="100" y="430" font-size="18">Engine-driven magnet</text><text x="355" y="430" font-size="17">Changing flux → induced energy</text><text x="35" y="540" font-size="17">Basic energy-path sketch: magnetic rotation supplies ignition energy;</text><text x="35" y="563" font-size="17">switching and appropriate windings create the spark voltage. Different magneto</text><text x="35" y="586" font-size="17">constructions reverse which element rotates.</text><text x="30" y="603" font-size="12">Original conceptual schematic · not to scale · not an operating/setup instruction</text></svg>