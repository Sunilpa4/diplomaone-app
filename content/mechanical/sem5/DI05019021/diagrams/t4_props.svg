<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif" fill="#30303b"><rect width="900" height="620" fill="white"/><text x="30" y="35" font-size="22">Air properties: do not confuse temperature with moisture</text><rect x="45" y="120" width="220" height="55" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="55" y="148" font-size="17">DBT / WBT / DPT</text><path d="M270 145 L310 145" fill="none" stroke="#2679ad" stroke-width="3"/><path d="M298.94726807196537 149.6730201077038 L310 145 L298.94726807196537 140.3269798922962" stroke="#2679ad" stroke-width="3" fill="none"/><rect x="320" y="120" width="530" height="55" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="330" y="148" font-size="17">Dry-bulb / wet-bulb / dew-point temperatures</text><rect x="45" y="187" width="220" height="55" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="55" y="215" font-size="17">Humidity ratio w</text><path d="M270 212 L310 212" fill="none" stroke="#2679ad" stroke-width="3"/><path d="M298.94726807196537 216.6730201077038 L310 212 L298.94726807196537 207.3269798922962" stroke="#2679ad" stroke-width="3" fill="none"/><rect x="320" y="187" width="530" height="55" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="330" y="215" font-size="17">kg water vapour/kg dry air</text><rect x="45" y="254" width="220" height="55" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="55" y="282" font-size="17">Relative humidity</text><path d="M270 279 L310 279" fill="none" stroke="#2679ad" stroke-width="3"/><path d="M298.94726807196537 283.6730201077038 L310 279 L298.94726807196537 274.3269798922962" stroke="#2679ad" stroke-width="3" fill="none"/><rect x="320" y="254" width="530" height="55" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="330" y="282" font-size="17">pv/pws at same DBT</text><rect x="45" y="321" width="220" height="55" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="55" y="349" font-size="17">Enthalpy / volume</text><path d="M270 346 L310 346" fill="none" stroke="#2679ad" stroke-width="3"/><path d="M298.94726807196537 350.6730201077038 L310 346 L298.94726807196537 341.3269798922962" stroke="#2679ad" stroke-width="3" fill="none"/><rect x="320" y="321" width="530" height="55" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="330" y="349" font-size="17">kJ/kg dry air;m³/kg dry air</text><text x="35" y="540" font-size="17">Fix barometric pressure and enough independent properties before locating a</text><text x="35" y="563" font-size="17">moist-air state.</text><text x="30" y="603" font-size="12">Original conceptual schematic · not to scale · not an operating/setup instruction</text></svg>