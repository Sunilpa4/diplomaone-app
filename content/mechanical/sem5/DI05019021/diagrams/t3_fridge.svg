<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif" fill="#30303b"><rect width="900" height="620" fill="white"/><text x="30" y="35" font-size="22">Domestic refrigerator: heat moves from cabinet to room</text><rect x="60" y="130" width="300" height="335" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><rect x="90" y="195" width="240" height="110" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="100" y="223" font-size="17">Evaporator / cold</text><text x="100" y="245" font-size="17">cabinet</text><rect x="570" y="335" width="230" height="85" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="580" y="363" font-size="17">Compressor</text><rect x="570" y="150" width="230" height="85" fill="#e7f3fb" stroke="#765099" stroke-width="2"/><text x="580" y="178" font-size="17">Condenser / room heat</text><path d="M365 235 L565 370" fill="none" stroke="#2679ad" stroke-width="3"/><path d="M553.2245298954005 367.6895230328602 L565 370 L558.4533856976693 359.9430699924619" stroke="#2679ad" stroke-width="3" fill="none"/><path d="M685 330 L685 240" fill="none" stroke="#be6633" stroke-width="3"/><path d="M689.6730201077038 251.05273192803463 L685 240 L680.3269798922962 251.05273192803463" stroke="#be6633" stroke-width="3" fill="none"/><path d="M565 185 L440 185 L440 335 L365 335" stroke="#765099" stroke-width="3" fill="none"/><text x="380" y="375" font-size="16">Capillary / drier</text><path d="M415 335 L365 335" fill="none" stroke="#2679ad" stroke-width="3"/><path d="M376.05273192803463 330.3269798922962 L365 335 L376.05273192803463 339.6730201077038" stroke="#2679ad" stroke-width="3" fill="none"/><text x="70" y="450" font-size="14">Insulated cabinet;separate sealed refrigerant loop</text><text x="35" y="540" font-size="17">Functional layout: condenser rejects cabinet heat plus input work. Cabinet</text><text x="35" y="563" font-size="17">door opening does not cool the room overall.</text><text x="30" y="603" font-size="12">