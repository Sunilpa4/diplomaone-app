<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 510" font-family="Arial,sans-serif"><rect width="800" height="510" fill="#fff"/><text x="400.0" y="27" text-anchor="middle" font-size="19" fill="#7423ba">Gating system: sprue well, runner extension and ingates</text><rect x="90" y="90" width="115" height="35" rx="5" fill="#ffbc8f" stroke="#76519a" stroke-width="2"/><path d="M122,125 L172,125 L163,310 L132,310 Z" fill="none" stroke="#76519a" stroke-width="3"/><rect x="120" y="310" width="65" height="45" rx="5" fill="#ffbc8f" stroke="#76519a" stroke-width="2"/><rect x="150" y="330" width="465" height="25" rx="5" fill="#ffbc8f" stroke="#76519a" stroke-width="2"/><rect x="300" y="220" width="300" height="60" rx="5" fill="#ffbc8f" stroke="#76519a" stroke-width="2"/><rect x="340" y="280" width="30" height="50" rx="5" fill="#ffbc8f" stroke="#76519a" stroke-width="2"/><rect x="470" y="280" width="30" height="50" rx="5" fill="#ffbc8f" stroke="#76519a" stroke-width="2"/><text x="65" y="65" font-size="15">Pouring basin</text><text x="195" y="185" font-size="15">Sprue area As</text><text x="20" y="390" font-size="15">Sprue well</text><line x1="100" y1="365" x2="120" y2="350" stroke="#76519a" stroke-width="4"/><text x="275" y="400" font-size="15">Runner: total area Ar</text><text x="640" y="350" font-size="13">Extension</text><text x="350" y="200" font-size="15">Mould cavity</text><text x="390" y="300" font-size="13">Ingates: total Ag</text><text x="80" y="465" font-size="14">Gating ratio = As : total Ar : total Ag; the choke is the smallest effective flow area</text><text x="400.0" y="498" text-anchor="middle" font-size="12" fill="#665a70">Teaching schematic · not to scale · sectional teaching illustration · not a fabrication drawing</text></svg>