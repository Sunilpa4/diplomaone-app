<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif"><defs><pattern id="wall" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,8 L8,0" stroke="#c0b5c7" stroke-width="1"/></pattern></defs><rect width="900" height="620" fill="white"/><text x="35" y="35" font-size="23" fill="#7423ba">Pressure reference scale: gauge,vacuum and absolute</text><line x1="160" y1="480" x2="160" y2="100" stroke="#665675" stroke-width="4"/><line x1="100" y1="470" x2="750" y2="470" stroke="#999" stroke-width="1" stroke-dasharray="6 4"/><line x1="100" y1="260" x2="750" y2="260" stroke="#999" stroke-width="1" stroke-dasharray="6 4"/><line x1="100" y1="140" x2="750" y2="140" stroke="#999" stroke-width="1" stroke-dasharray="6 4"/><text x="200" y="475" font-size="16" fill="#332c3b">Absolute zero (ideal vacuum)</text><text x="200" y="250" font-size="16" fill="#332c3b">Local atmospheric pressure</text><text x="200" y="130" font-size="16" fill="#332c3b">Example pressure above atmosphere</text><line x1="680" y1="140" x2="680" y2="470" stroke="#777" stroke-width="2"/><path d="M675.6503446588877,460.9955289764732 L680,470 L684.3496553411123,460.9955289764732" stroke="#777" stroke-width="2" fill="none"/><line x1="680" y1="470" x2="680" y2="140" stroke="#777" stroke-width="2"/><path d="M684.3496553411123,149.00447102352678 L680,140 L675.6503446588877,149.00447102352678" stroke="#777" stroke-width="2" fill="none"/><text x="690.0" y="305.0" font-size="15" fill="#332c3b">p abs</text><line x1="530" y1="140" x2="530" y2="260" stroke="#777" stroke-width="2"/><path d="M525.6503446588877,250.99552897647322 L530,260 L534.3496553411123,250.99552897647322" stroke="#777" stroke-width="2" fill="none"/><line x1="530" y1="260" x2="530" y2="140" stroke="#777" stroke-width="2"/><path d="M534.3496553411123,149.00447102352678 L530,140 L525.6503446588877,149.00447102352678" stroke="#777" stroke-width="2" fill="none"/><text x="540.0" y="200.0" font-size="15" fill="#332c3b">p gauge</text><line x1="420" y1="260" x2="420" y2="380" stroke="#777" stroke-width="2"/><path d="M415.6503446588877,370.9955289764732 L420,380 L424.3496553411123,370.9955289764732" stroke="#777" stroke-width="2" fill="none"/><line x1="420" y1="380" x2="420" y2="260" stroke="#777" stroke-width="2"/><path d="M424.3496553411123,269.0044710235268 L420,260 L415.6503446588877,269.0044710235268" stroke="#777" stroke-width="2" fill="none"/><text x="430.0" y="320.0" font-size="15" fill="#332c3b">vacuum</text><text x="120" y="560" font-size="19" fill="#332c3b">pabs = patm + pgauge; positive vacuum reading = patm - pabs</text><text x="35" y="603" font-size="12" fill="#777">Labelled teaching section · not to scale · no unsupervised apparatus operation</text></svg>