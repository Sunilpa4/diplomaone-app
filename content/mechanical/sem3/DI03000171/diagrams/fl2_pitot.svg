<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif"><defs><pattern id="wall" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,8 L8,0" stroke="#c0b5c7" stroke-width="1"/></pattern></defs><rect width="900" height="620" fill="white"/><text x="35" y="35" font-size="23" fill="#7423ba">Pitot-static principle:stagnation port versus static pressure</text><rect x="90" y="220" width="690" height="220" fill="#e8f5fc" stroke="#665675" stroke-width="2"/><path d="M450,90 V305 H360 V330 H475 V90" stroke="#665675" stroke-width="3" fill="white"/><line x1="110" y1="315" x2="320" y2="315" stroke="#247cac" stroke-width="2"/><path d="M310.9955289764732,319.3496553411123 L320,315 L310.9955289764732,310.6503446588877" stroke="#247cac" stroke-width="2" fill="none"/><circle cx="360" cy="317" r="7" fill="#247cac" stroke="#76519a" stroke-width="2"/><line x1="600" y1="220" x2="600" y2="110" stroke="#665675" stroke-width="2"/><text x="85" y="180" font-size="16" fill="#332c3b">Flow V</text><text x="320" y="65" font-size="16" fill="#332c3b">Stagnation line</text><text x="600" y="90" font-size="16" fill="#332c3b">Static tap</text><text x="80" y="515" font-size="17" fill="#332c3b">Aligned stagnation port slows local flow to zero;static tap must not face the jet</text><text x="80" y="555" font-size="17" fill="#332c3b">V=Cv sqrt(2g delta-head);same pressure reference and elevation required</text><text x="35" y="603" font-size="12" fill="#777">Labelled teaching section · not to scale · no unsupervised apparatus operation</text></svg>