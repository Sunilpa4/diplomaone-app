<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif"><defs><pattern id="wall" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,8 L8,0" stroke="#c0b5c7" stroke-width="1"/></pattern></defs><rect width="900" height="620" fill="white"/><text x="35" y="32" font-size="21" fill="#7423ba">Mechanical properties answer different service questions</text><text x="120" y="180" font-size="24" fill="#332c3b">Hardness→local indentation resistance</text><text x="120" y="250" font-size="24" fill="#332c3b">Toughness→energy absorption to fracture</text><text x="120" y="320" font-size="24" fill="#332c3b">Fatigue→repeated/fluctuating loading</text><text x="120" y="390" font-size="24" fill="#332c3b">Creep→time-dependent deformation</text><text x="75" y="550" font-size="18" fill="#332c3b">Temperature,strain rate,material condition and test method affect the answer</text><text x="35" y="603" font-size="12" fill="#777">Labelled teaching section · not to scale · no unsupervised apparatus operation</text></svg>