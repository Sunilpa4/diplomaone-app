<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif"><defs><pattern id="wall" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,8 L8,0" stroke="#c0b5c7" stroke-width="1"/></pattern></defs><rect width="900" height="620" fill="white"/><text x="35" y="32" font-size="21" fill="#7423ba">Hollow circular shaft:nonzero shear stress at the inner radius</text><circle cx="290" cy="310" r="150" fill="#e8f5fc" stroke="#76519a" stroke-width="2"/><circle cx="290" cy="310" r="95" fill="white" stroke="#76519a" stroke-width="2"/><line x1="140" y1="510" x2="440" y2="510" stroke="#777" stroke-width="2"/><path d="M430.9955289764732,514.3496553411123 L440,510 L430.9955289764732,505.6503446588877" stroke="#777" stroke-width="2" fill="none"/><line x1="440" y1="510" x2="140" y2="510" stroke="#777" stroke-width="2"/><path d="M149.00447102352678,505.6503446588877 L140,510 L149.00447102352678,514.3496553411123" stroke="#777" stroke-width="2" fill="none"/><text x="300.0" y="498.0" font-size="15" fill="#332c3b">D</text><line x1="290" y1="310" x2="385" y2="310" stroke="#bc6c35" stroke-width="3"/><text x="315" y="280" font-size="16" fill="#332c3b">d/2</text><text x="530" y="230" font-size="16" fill="#332c3b">J=pi(D⁴−d⁴)/32</text><text x="530" y="320" font-size="16" fill="#332c3b">tau outer=TR/J</text><text x="530" y="390" font-size="16" fill="#332c3b">tau inner=Tr/J</text><text x="75" y="570" font-size="17" fill="#332c3b">No material at the centre;do not draw a solid-shaft stress field inside the hole</text><text x="35" y="603" font-size="12" fill="#777">Labelled teaching section · not to scale · no unsupervised apparatus operation</text></svg>