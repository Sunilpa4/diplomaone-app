<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" font-family="Arial,sans-serif"><rect width="720" height="500" fill="#fff"/><text x="360.0" y="27" text-anchor="middle" font-size="19" fill="#7423ba">Simple and compound gear trains</text><circle cx="120" cy="150" r="40" fill="none" stroke="#76519a" stroke-width="2"/><text x="90" y="150" font-size="13">A 20T</text><circle cx="220" cy="150" r="60" fill="none" stroke="#76519a" stroke-width="2"/><text x="190" y="150" font-size="13">B 30T</text><circle cx="360" cy="150" r="80" fill="none" stroke="#76519a" stroke-width="2"/><text x="330" y="150" font-size="13">C 40T</text><text x="430" y="155" font-size="15">Simple: each shaft has one gear</text><circle cx="120" cy="350" r="40" fill="none" stroke="#76519a" stroke-width="2"/><text x="98" y="345" font-size="13">A20</text><circle cx="240" cy="350" r="80" fill="none" stroke="#76519a" stroke-width="2"/><text x="218" y="370" font-size="13">B40</text><circle cx="240" cy="350" r="40" fill="none" stroke="#76519a" stroke-width="2"/><text x="218" y="345" font-size="13">C20</text><circle cx="360" cy="350" r="80" fill="none" stroke="#76519a" stroke-width="2"/><text x="338" y="345" font-size="13">D40</text><text x="420" y="330" font-size="15">Compound: B and C keyed together</text><text x="430" y="365" font-size="15">NB = NC; stages multiply</text><text x="60" y="460" font-size="15">Circles represent pitch geometry; compound gears are in separate axial planes</text><text x="360.0" y="488" text-anchor="middle" font-size="12" fill="#665a70">Teaching schematic · not to scale · isolation required before touching real equipment</text></svg>