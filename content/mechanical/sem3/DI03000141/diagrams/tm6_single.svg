<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Arial,sans-serif"><rect width="720" height="420" fill="#fff"/><text x="360.0" y="27" text-anchor="middle" font-size="19" fill="#7423ba">One rotating mass balanced in the same plane</text><circle cx="350" cy="205" r="120" fill="none" stroke="#76519a" stroke-width="2"/><line x1="350" y1="205" x2="455" y2="145" stroke="#76519a" stroke-width="4"/><line x1="350" y1="205" x2="245" y2="265" stroke="#76519a" stroke-width="4"/><circle cx="455" cy="145" r="23" fill="#f2e9fb" stroke="#76519a" stroke-width="2"/><circle cx="245" cy="265" r="23" fill="#d6e7f5" stroke="#76519a" stroke-width="2"/><circle cx="350" cy="205" r="6" fill="white" stroke="#76519a" stroke-width="2"/><text x="475" y="140" font-size="15">m at r</text><text x="95" y="300" font-size="15">mb at rb, opposite direction</text><line x1="455" y1="145" x2="520" y2="108" stroke="#2175a5" stroke-width="2"/><path d="M514.3262992836851,116.2346293287365 L520,108 L510.0227643337472,108.67436522749435" fill="none" stroke="#2175a5" stroke-width="2"/><line x1="245" y1="265" x2="180" y2="302" stroke="#2175a5" stroke-width="2"/><path d="M185.67370071631495,293.7653706712635 L180,302 L189.97723566625277,301.3256347725056" fill="none" stroke="#2175a5" stroke-width="2"/><text x="160" y="370" font-size="15">mb rb = m r; both centrifugal forces scale with omega²</text><text x="360.0" y="408" text-anchor="middle" font-size="12" fill="#665a70">Teaching schematic · not to scale · isolation required before touching real equipment</text></svg>