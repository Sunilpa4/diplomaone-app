<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif"><defs><pattern id="wall" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,8 L8,0" stroke="#c0b5c7" stroke-width="1"/></pattern></defs><rect width="900" height="620" fill="white"/><text x="35" y="32" font-size="21" fill="#7423ba">Form tolerances:no datum needed for straightness,flatness or roundness</text><line x1="90" y1="180" x2="370" y2="180" stroke="#398567" stroke-width="2"/><line x1="90" y1="230" x2="370" y2="230" stroke="#398567" stroke-width="2"/><path d="M100,205 Q190,180 270,210 T365,200" stroke="#76519a" stroke-width="3" fill="none"/><text x="100" y="140" font-size="16" fill="#332c3b">Straightness zone</text><rect x="490" y="160" width="270" height="35" fill="none" stroke="#665675" stroke-width="2"/><rect x="490" y="225" width="270" height="35" fill="none" stroke="#665675" stroke-width="2"/><text x="500" y="125" font-size="16" fill="#332c3b">Flatness:two planes</text><circle cx="270" cy="400" r="85" fill="none" stroke="#398567" stroke-width="2"/><circle cx="270" cy="400" r="65" fill="none" stroke="#398567" stroke-width="2"/><path d="M270,325 C380,330 350,485 270,470 C170,490 165,325 270,325" stroke="#76519a" stroke-width="3" fill="none"/><text x="390" y="415" font-size="16" fill="#332c3b">Roundness:two concentric circles</text><text x="65" y="565" font-size="16" fill="#332c3b">Zones are fitted to the extracted feature;indicator variation is not always the form error</text><text x="35" y="603" font-size="12" fill="#777">Labelled teaching section · not to scale · no unsupervised apparatus operation</text></svg>