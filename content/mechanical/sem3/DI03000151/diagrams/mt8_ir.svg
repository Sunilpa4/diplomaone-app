<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif"><defs><pattern id="wall" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,8 L8,0" stroke="#c0b5c7" stroke-width="1"/></pattern></defs><rect width="900" height="620" fill="white"/><text x="35" y="32" font-size="21" fill="#7423ba">Radiation / IR temperature measurement:emissivity and field of view matter</text><rect x="650" y="200" width="100" height="240" fill="#f7e5d8" stroke="#665675" stroke-width="2"/><path d="M300,260 L650,200 M300,350 L650,440" stroke="#bc6c35" stroke-width="2" fill="none"/><rect x="130" y="230" width="170" height="150" fill="#eee8f2" stroke="#665675" stroke-width="2"/><text x="140" y="300" font-size="16" fill="#332c3b">Optics + detector</text><text x="600" y="160" font-size="16" fill="#332c3b">Target surface</text><text x="65" y="485" font-size="17" fill="#332c3b">The target must fill the specified spot;reflections and obstructions bias the result</text><text x="65" y="550" font-size="16" fill="#332c3b">A non-contact temperature is generally a surface radiation inference,not internal temperature</text><text x="35" y="603" font-size="12" fill="#777">Labelled teaching section · not to scale · no unsupervised apparatus operation</text></svg>