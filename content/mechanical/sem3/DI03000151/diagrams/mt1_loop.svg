<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif"><defs><pattern id="wall" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,8 L8,0" stroke="#c0b5c7" stroke-width="1"/></pattern></defs><rect width="900" height="620" fill="white"/><text x="35" y="32" font-size="21" fill="#7423ba">Why metrology?Drawing → manufacturing → measurement → decision</text><rect x="45" y="210" width="170" height="150" fill="#f4eef9" stroke="#665675" stroke-width="2"/><text x="57" y="255" font-size="19" fill="#332c3b">Requirement</text><text x="53" y="310" font-size="13" fill="#332c3b">What must be made?</text><rect x="260" y="210" width="170" height="150" fill="#f4eef9" stroke="#665675" stroke-width="2"/><text x="272" y="255" font-size="19" fill="#332c3b">Make part</text><text x="268" y="310" font-size="13" fill="#332c3b">Process and machine</text><rect x="475" y="210" width="170" height="150" fill="#f4eef9" stroke="#665675" stroke-width="2"/><text x="487" y="255" font-size="19" fill="#332c3b">Measure</text><text x="483" y="310" font-size="13" fill="#332c3b">Method + reference</text><rect x="690" y="210" width="170" height="150" fill="#f4eef9" stroke="#665675" stroke-width="2"/><text x="702" y="255" font-size="19" fill="#332c3b">Decide</text><text x="698" y="310" font-size="13" fill="#332c3b">Evidence + limits</text><line x1="220" y1="285" x2="250" y2="285" stroke="#247cac" stroke-width="2"/><path d="M240.99552897647322,289.3496553411123 L250,285 L240.99552897647322,280.6503446588877" stroke="#247cac" stroke-width="2" fill="none"/><line x1="435" y1="285" x2="465" y2="285" stroke="#247cac" stroke-width="2"/><path d="M455.9955289764732,289.3496553411123 L465,285 L455.9955289764732,280.6503446588877" stroke="#247cac" stroke-width="2" fill="none"/><line x1="650" y1="285" x2="680" y2="285" stroke="#247cac" stroke-width="2"/><path d="M670.9955289764732,289.3496553411123 L680,285 L670.9955289764732,280.6503446588877" stroke="#247cac" stroke-width="2" fill="none"/><text x="65" y="430" font-size="20" fill="#332c3b">A displayed number alone is not a complete measurement result</text><text x="65" y="490" font-size="16" fill="#332c3b">Example:shaft requirement20.000±.020mm;report units,conditions and uncertainty</text><text x="65" y="545" font-size="17" fill="#332c3b">Feedback to the process prevents repeated waste;inspection is not just rejecting parts</text><text x="35" y="603" font-size="12" fill="#777">Labelled teaching section · not to scale · no unsupervised apparatus operation</text></svg>