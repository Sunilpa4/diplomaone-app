<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif"><defs><pattern id="wall" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,8 L8,0" stroke="#c0b5c7" stroke-width="1"/></pattern></defs><rect width="900" height="620" fill="white"/><text x="35" y="32" font-size="21" fill="#7423ba">Smart inspection:data quality before dashboards</text><rect x="40" y="230" width="175" height="140" fill="#e8f5fc" stroke="#665675" stroke-width="2"/><text x="60" y="305" font-size="21" fill="#332c3b">Measure</text><rect x="255" y="230" width="175" height="140" fill="#e8f5fc" stroke="#665675" stroke-width="2"/><text x="275" y="305" font-size="21" fill="#332c3b">Validate</text><rect x="470" y="230" width="175" height="140" fill="#e8f5fc" stroke="#665675" stroke-width="2"/><text x="490" y="305" font-size="21" fill="#332c3b">Connect</text><rect x="685" y="230" width="175" height="140" fill="#e8f5fc" stroke="#665675" stroke-width="2"/><text x="705" y="305" font-size="21" fill="#332c3b">Act</text><line x1="220" y1="300" x2="250" y2="300" stroke="#247cac" stroke-width="2"/><path d="M240.99552897647322,304.3496553411123 L250,300 L240.99552897647322,295.6503446588877" stroke="#247cac" stroke-width="2" fill="none"/><line x1="435" y1="300" x2="465" y2="300" stroke="#247cac" stroke-width="2"/><path d="M455.9955289764732,304.3496553411123 L465,300 L455.9955289764732,295.6503446588877" stroke="#247cac" stroke-width="2" fill="none"/><line x1="650" y1="300" x2="680" y2="300" stroke="#247cac" stroke-width="2"/><path d="M670.9955289764732,304.3496553411123 L680,300 L670.9955289764732,295.6503446588877" stroke="#247cac" stroke-width="2" fill="none"/><text x="65" y="440" font-size="18" fill="#332c3b">Value + unit + time + instrument ID + calibration + uncertainty + part ID</text><text x="65" y="515" font-size="16" fill="#332c3b">IoT transports data;it does not automatically establish accuracy,traceability or conformity</text><text x="35" y="603" font-size="12" fill="#777">Labelled teaching section · not to scale · no unsupervised apparatus operation</text></svg>