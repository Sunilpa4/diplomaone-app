<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif"><defs><pattern id="wall" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,8 L8,0" stroke="#c0b5c7" stroke-width="1"/></pattern></defs><rect width="900" height="620" fill="white"/><text x="35" y="32" font-size="21" fill="#7423ba">Calibration is comparison with evidence;adjustment is a different operation</text><rect x="65" y="230" width="170" height="140" fill="#e8f5fc" stroke="#665675" stroke-width="2"/><text x="77" y="295" font-size="21" fill="#332c3b">Reference</text><rect x="365" y="230" width="170" height="140" fill="#e8f5fc" stroke="#665675" stroke-width="2"/><text x="377" y="295" font-size="21" fill="#332c3b">Instrument</text><rect x="665" y="230" width="170" height="140" fill="#e8f5fc" stroke="#665675" stroke-width="2"/><text x="677" y="295" font-size="21" fill="#332c3b">Record</text><line x1="240" y1="300" x2="355" y2="300" stroke="#247cac" stroke-width="2"/><path d="M345.9955289764732,304.3496553411123 L355,300 L345.9955289764732,295.6503446588877" stroke="#247cac" stroke-width="2" fill="none"/><line x1="540" y1="300" x2="655" y2="300" stroke="#247cac" stroke-width="2"/><path d="M645.9955289764732,304.3496553411123 L655,300 L645.9955289764732,295.6503446588877" stroke="#247cac" stroke-width="2" fill="none"/><text x="80" y="170" font-size="16" fill="#332c3b">Known values + uncertainty</text><text x="355" y="170" font-size="16" fill="#332c3b">Indications at test points</text><text x="655" y="170" font-size="14" fill="#332c3b">Error,correction,uncertainty</text><text x="65" y="455" font-size="20" fill="#332c3b">Error e=I−R;correction c=−e;corrected value=I+c</text><text x="65" y="530" font-size="18" fill="#332c3b">Adjustment changes the instrument;verification checks specified requirements</text><text x="35" y="603" font-size="12" fill="#777">Labelled teaching section · not to scale · no unsupervised apparatus operation</text></svg>