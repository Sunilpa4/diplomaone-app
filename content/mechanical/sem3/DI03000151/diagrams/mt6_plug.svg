<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif"><defs><pattern id="wall" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,8 L8,0" stroke="#c0b5c7" stroke-width="1"/></pattern></defs><rect width="900" height="620" fill="white"/><text x="35" y="32" font-size="21" fill="#7423ba">GO and NO-GO plug gauges:hole limits without a numerical reading</text><rect x="100" y="230" width="230" height="150" fill="#aaa" stroke="#665675" stroke-width="2"/><rect x="170" y="230" width="90" height="150" fill="white" stroke="#665675" stroke-width="2"/><rect x="520" y="260" width="230" height="80" fill="#e8f5fc" stroke="#665675" stroke-width="2"/><text x="110" y="180" font-size="16" fill="#332c3b">Hole section</text><text x="520" y="220" font-size="16" fill="#332c3b">Plug gauge end</text><line x1="495" y1="300" x2="350" y2="300" stroke="#247cac" stroke-width="2"/><path d="M359.0044710235268,295.6503446588877 L350,300 L359.0044710235268,304.3496553411123" stroke="#247cac" stroke-width="2" fill="none"/><text x="65" y="470" font-size="18" fill="#332c3b">Hole GO relates to minimum hole size;NO-GO to maximum hole size</text><text x="65" y="550" font-size="17" fill="#332c3b">Use specified force/engagement rules;never force a gauge to obtain a pass</text><text x="35" y="603" font-size="12" fill="#777">Labelled teaching section · not to scale · no unsupervised apparatus operation</text></svg>