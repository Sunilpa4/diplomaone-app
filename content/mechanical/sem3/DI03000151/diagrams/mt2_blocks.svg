<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif"><defs><pattern id="wall" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,8 L8,0" stroke="#c0b5c7" stroke-width="1"/></pattern></defs><rect width="900" height="620" fill="white"/><text x="35" y="32" font-size="21" fill="#7423ba">Gauge blocks:wrung end faces form a calibrated length stack</text><rect x="190" y="330" width="480" height="65" fill="#e8f5fc" stroke="#665675" stroke-width="2"/><rect x="190" y="280" width="480" height="50" fill="#eee8f2" stroke="#665675" stroke-width="2"/><rect x="190" y="235" width="480" height="45" fill="#f7e5d8" stroke="#665675" stroke-width="2"/><rect x="190" y="200" width="480" height="35" fill="#e8f5fc" stroke="#665675" stroke-width="2"/><text x="700" y="375" font-size="16" fill="#332c3b">10mm</text><text x="700" y="315" font-size="16" fill="#332c3b">3mm</text><text x="700" y="265" font-size="16" fill="#332c3b">1.25mm</text><text x="700" y="225" font-size="16" fill="#332c3b">1.005mm</text><line x1="120" y1="200" x2="120" y2="395" stroke="#777" stroke-width="2"/><path d="M115.6503446588877,385.9955289764732 L120,395 L124.34965534111231,385.9955289764732" stroke="#777" stroke-width="2" fill="none"/><line x1="120" y1="395" x2="120" y2="200" stroke="#777" stroke-width="2"/><path d="M124.34965534111231,209.00447102352678 L120,200 L115.6503446588877,209.00447102352678" stroke="#777" stroke-width="2" fill="none"/><text x="130.0" y="297.5" font-size="15" fill="#332c3b">Total length</text><text x="100" y="490" font-size="20" fill="#332c3b">Nominal example:10+3+1.25+1.005=15.255mm</text><text x="65" y="550" font-size="17" fill="#332c3b">Use clean wringing faces,calibration deviations,temperature and stack uncertainty</text><text x="35" y="603" font-size="12" fill="#777">Labelled teaching section · not to scale · no unsupervised apparatus operation</text></svg>