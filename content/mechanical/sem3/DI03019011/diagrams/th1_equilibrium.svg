<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif"><defs><pattern id="wall" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,8 L8,0" stroke="#c0b5c7" stroke-width="1"/></pattern></defs><rect width="900" height="620" fill="white"/><text x="35" y="35" font-size="23" fill="#7423ba">Thermodynamic equilibrium:all conditions must be satisfied together</text><circle cx="100" cy="150" r="18" fill="#e8f5fc" stroke="#76519a" stroke-width="2"/><text x="140" y="157" font-size="19" fill="#332c3b">Thermal:no temperature-driven transfer</text><circle cx="100" cy="250" r="18" fill="#e8f5fc" stroke="#76519a" stroke-width="2"/><text x="140" y="257" font-size="19" fill="#332c3b">Mechanical:no unbalanced macroscopic forces</text><circle cx="100" cy="350" r="18" fill="#e8f5fc" stroke="#76519a" stroke-width="2"/><text x="140" y="357" font-size="19" fill="#332c3b">Phase:no net phase-change tendency</text><circle cx="100" cy="450" r="18" fill="#e8f5fc" stroke="#76519a" stroke-width="2"/><text x="140" y="457" font-size="19" fill="#332c3b">Chemical:no net reaction/diffusion tendency</text><text x="85" y="550" font-size="16" fill="#332c3b">At equilibrium the relevant macroscopic properties have no spontaneous tendency to change</text><text x="35" y="603" font-size="12" fill="#777">Labelled teaching section · not to scale · no unsupervised apparatus operation</text></svg>