<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif"><defs><pattern id="wall" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,8 L8,0" stroke="#c0b5c7" stroke-width="1"/></pattern></defs><rect width="900" height="620" fill="white"/><text x="35" y="35" font-size="23" fill="#7423ba">Heat and work are energy in transit,not contents stored in a system</text><rect x="320" y="210" width="270" height="220" fill="#e8f5fc" stroke="#665675" stroke-width="2"/><text x="370" y="310" font-size="21" fill="#332c3b">Stored energy E</text><text x="365" y="345" font-size="18" fill="#332c3b">U + KE + PE</text><line x1="100" y1="285" x2="310" y2="285" stroke="#bc6c35" stroke-width="2"/><path d="M300.9955289764732,289.3496553411123 L310,285 L300.9955289764732,280.6503446588877" stroke="#bc6c35" stroke-width="2" fill="none"/><text x="95" y="250" font-size="16" fill="#332c3b">Heat in:+Q</text><line x1="600" y1="285" x2="790" y2="285" stroke="#247cac" stroke-width="2"/><path d="M780.9955289764732,289.3496553411123 L790,285 L780.9955289764732,280.6503446588877" stroke="#247cac" stroke-width="2" fill="none"/><text x="620" y="250" font-size="16" fill="#332c3b">Work out:+W</text><line x1="790" y1="385" x2="600" y2="385" stroke="#247cac" stroke-width="2"/><path d="M609.0044710235268,380.6503446588877 L600,385 L609.0044710235268,389.3496553411123" stroke="#247cac" stroke-width="2" fill="none"/><text x="620" y="420" font-size="16" fill="#332c3b">Work in:negative W</text><text x="75" y="530" font-size="17" fill="#332c3b">Sign convention:heat into system positive;work done BY system positive</text><text x="75" y="565" font-size="17" fill="#332c3b">Heat transfer occurs because of temperature difference;temperature is not heat</text><text x="35" y="603" font-size="12" fill="#777">Labelled teaching section · not to scale · no unsupervised apparatus operation</text></svg>