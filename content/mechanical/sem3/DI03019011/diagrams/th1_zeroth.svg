<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif"><defs><pattern id="wall" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,8 L8,0" stroke="#c0b5c7" stroke-width="1"/></pattern></defs><rect width="900" height="620" fill="white"/><text x="35" y="35" font-size="23" fill="#7423ba">Zeroth law:thermal equilibrium is transitive</text><rect x="100" y="220" width="170" height="150" fill="#e8f5fc" stroke="#665675" stroke-width="2"/><text x="130" y="300" font-size="18" fill="#332c3b">A</text><rect x="380" y="220" width="170" height="150" fill="#e8f5fc" stroke="#665675" stroke-width="2"/><text x="410" y="300" font-size="18" fill="#332c3b">C:thermometer</text><rect x="660" y="220" width="170" height="150" fill="#e8f5fc" stroke="#665675" stroke-width="2"/><text x="690" y="300" font-size="18" fill="#332c3b">B</text><line x1="270" y1="295" x2="380" y2="295" stroke="#bc6c35" stroke-width="4"/><line x1="550" y1="295" x2="660" y2="295" stroke="#bc6c35" stroke-width="4"/><text x="120" y="150" font-size="18" fill="#332c3b">A is in thermal equilibrium with C;B is in thermal equilibrium with C</text><text x="140" y="455" font-size="19" fill="#332c3b">Therefore A and B are in thermal equilibrium with each other</text><text x="85" y="550" font-size="18" fill="#332c3b">The thermometer uses the same temperature property to compare bodies</text><text x="35" y="603" font-size="12" fill="#777">Labelled teaching section · not to scale · no unsupervised apparatus operation</text></svg>