<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif"><defs><pattern id="wall" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,8 L8,0" stroke="#c0b5c7" stroke-width="1"/></pattern></defs><rect width="900" height="620" fill="white"/><text x="35" y="35" font-size="23" fill="#7423ba">Closed,open and isolated systems:what may cross the boundary?</text><rect x="65" y="205" width="200" height="170" fill="#e8f5fc" stroke="#665675" stroke-width="2"/><rect x="350" y="205" width="200" height="170" fill="#e8f5fc" stroke="#665675" stroke-width="2"/><rect x="635" y="205" width="200" height="170" fill="#e8f5fc" stroke="#665675" stroke-width="2"/><text x="70" y="155" font-size="18" fill="#332c3b">CLOSED SYSTEM</text><text x="355" y="155" font-size="18" fill="#332c3b">OPEN SYSTEM</text><text x="640" y="155" font-size="18" fill="#332c3b">ISOLATED</text><text x="92" y="275" font-size="16" fill="#332c3b">Fixed mass</text><text x="370" y="275" font-size="16" fill="#332c3b">Control volume</text><text x="665" y="275" font-size="16" fill="#332c3b">Ideal limit</text><line x1="65" y1="320" x2="20" y2="320" stroke="#bc6c35" stroke-width="2"/><path d="M29.00447102352677,315.6503446588877 L20,320 L29.00447102352677,324.3496553411123" stroke="#bc6c35" stroke-width="2" fill="none"/><text x="70" y="420" font-size="15" fill="#332c3b">Energy may cross</text><line x1="290" y1="320" x2="350" y2="320" stroke="#247cac" stroke-width="2"/><path d="M340.9955289764732,324.3496553411123 L350,320 L340.9955289764732,315.6503446588877" stroke="#247cac" stroke-width="2" fill="none"/><line x1="550" y1="320" x2="610" y2="320" stroke="#247cac" stroke-width="2"/><path d="M600.9955289764732,324.3496553411123 L610,320 L600.9955289764732,315.6503446588877" stroke="#247cac" stroke-width="2" fill="none"/><text x="355" y="420" font-size="15" fill="#332c3b">Mass + energy may cross</text><text x="640" y="420" font-size="15" fill="#332c3b">Neither mass nor energy</text><text x="70" y="520" font-size="17" fill="#332c3b">Closed does NOT mean insulated;isolated means both mass and energy are excluded</text><text x="35" y="603" font-size="12" fill="#777">Labelled teaching section · not to scale · no unsupervised apparatus operation</text></svg>