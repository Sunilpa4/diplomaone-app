<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial,sans-serif"><defs><pattern id="wall" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,8 L8,0" stroke="#c0b5c7" stroke-width="1"/></pattern></defs><rect width="900" height="620" fill="white"/><text x="35" y="35" font-size="23" fill="#7423ba">Temperature scales:use Kelvin for absolute-temperature ratios</text><line x1="180" y1="150" x2="180" y2="440" stroke="#777" stroke-width="5"/><circle cx="180" cy="460" r="22" fill="#e8f5fc" stroke="#76519a" stroke-width="2"/><line x1="145" y1="170" x2="215" y2="170" stroke="#665675" stroke-width="2"/><line x1="145" y1="390" x2="215" y2="390" stroke="#665675" stroke-width="2"/><text x="125" y="110" font-size="19" fill="#332c3b">Celsius</text><text x="132" y="155" font-size="16" fill="#332c3b">100°C</text><text x="132" y="375" font-size="16" fill="#332c3b">0°C</text><line x1="450" y1="150" x2="450" y2="440" stroke="#777" stroke-width="5"/><circle cx="450" cy="460" r="22" fill="#e8f5fc" stroke="#76519a" stroke-width="2"/><line x1="415" y1="170" x2="485" y2="170" stroke="#665675" stroke-width="2"/><line x1="415" y1="390" x2="485" y2="390" stroke="#665675" stroke-width="2"/><text x="395" y="110" font-size="19" fill="#332c3b">Kelvin</text><text x="402" y="155" font-size="16" fill="#332c3b">373.15K</text><text x="402" y="375" font-size="16" fill="#332c3b">273.15K</text><line x1="720" y1="150" x2="720" y2="440" stroke="#777" stroke-width="5"/><circle cx="720" cy="460" r="22" fill="#e8f5fc" stroke="#76519a" stroke-width="2"/><line x1="685" y1="170" x2="755" y2="170" stroke="#665675" stroke-width="2"/><line x1="685" y1="390" x2="755" y2="390" stroke="#665675" stroke-width="2"/><text x="665" y="110" font-size="19" fill="#332c3b">Fahrenheit</text><text x="672" y="155" font-size="16" fill="#332c3b">212°F</text><text x="672" y="375" font-size="16" fill="#332c3b">32°F</text><text x="80" y="530" font-size="18" fill="#332c3b">T(K)=t(°C)+273.15;temperature difference:1K = 1°C interval</text><text x="80" y="565" font-size="16" fill="#332c3b">Water fixed points shown approximately at standard atmospheric pressure</text><text x="35" y="603" font-size="12" fill="#777">Labelled teaching section · not to scale · no unsupervised apparatus operation</text></svg>