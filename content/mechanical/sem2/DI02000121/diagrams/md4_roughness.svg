<svg xmlns="http://www.w3.org/2000/svg" width="360" height="274" viewBox="0 0 360 274" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="274" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Machining / surface-texture symbol</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">The tick that controls how smooth a surface must be finished</text><rect x="40" y="84" width="200" height="34" rx="3" fill="#EFF6FF" stroke="#272134" stroke-width="1.9"/><rect x="240" y="91" width="44" height="20" rx="3" fill="#DBEAFE" stroke="#272134" stroke-width="1.5"/><line x1="28" y1="101" x2="296" y2="101" stroke="#B91C1C" stroke-width="0.8" stroke-dasharray="14,3,3,3"/><path d="M 130 84 L 138 68 L 146 84" fill="none" stroke="#272134" stroke-width="1.8"/><line x1="138" y1="68" x2="138" y2="58" stroke="#272134" stroke-width="1.2"/><line x1="138" y1="58" x2="196" y2="58" stroke="#272134" stroke-width="1.2"/><text x="150" y="54" font-size="8" fill="#272134" text-anchor="start" font-weight="bold">Ra 3.2</text><text x="150" y="130" font-size="6.5" fill="#64748B" text-anchor="start">surface to which symbol applies</text><path d="M 18 200 L 27 184 L 36 200" fill="none" stroke="#272134" stroke-width="1.6"/><text x="27" y="214" font-size="6.0" fill="#272134" text-anchor="middle" font-weight="bold">basic symbol</text><text x="27" y="224" font-size="5.6" fill="#64748B" text-anchor="middle"></text><path d="M 86 200 L 95 184 L 104 200" fill="none" stroke="#272134" stroke-width="1.6"/><line x1="89" y1="190" x2="101" y2="190" stroke="#272134" stroke-width="1.3"/><text x="95" y="214" font-size="6.0" fill="#272134" text-anchor="middle" font-weight="bold">material removal</text><text x="95" y="224" font-size="5.6" fill="#64748B" text-anchor="middle">machining required</text><path d="M 154 200 L 163 184 L 172 200" fill="none" stroke="#272134" stroke-width="1.6"/><circle cx="163" cy="194" r="4.5" fill="none" stroke="#272134" stroke-width="1.2"/><text x="163" y="214" font-size="6.0" fill="#272134" text-anchor="middle" font-weight="bold">removal prohibited</text><text x="163" y="224" font-size="5.6" fill="#64748B" text-anchor="middle">circle in V: no machining</text><rect x="212" y="166" width="140" height="56" rx="3" fill="#F8FAFC" stroke="#272134" stroke-width="1.0"/><text x="282" y="180" font-size="7.5" fill="#272134" text-anchor="middle" font-weight="bold">reading: Ra 3.2</text><text x="282" y="194" font-size="6.3" fill="#64748B" text-anchor="middle">Ra in um (mean roughness)</text><text x="282" y="206" font-size="6.3" fill="#64748B" text-anchor="middle">N6=0.8, N7=1.6, N8=3.2, N9=6.3</text><text x="180" y="250" font-size="7" fill="#64748B" text-anchor="middle">Symbol sits on the surface (or Leader/witness line); the value reads from the same side as dimensions.</text><text x="180" y="264" font-size="7" fill="#64748B" text-anchor="middle">Old drawings show tick marks (one/two/three ticks) - convert: approx. Ra 12.5 / 3.2 / 0.8 um.</text></svg>