<svg xmlns="http://www.w3.org/2000/svg" width="360" height="326" viewBox="0 0 360 326" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="326" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Anatomy of a dimension; text in AutoCAD</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">What DIMSTYLE controls, and DTEXT vs MTEXT</text><rect x="70" y="96" width="170" height="60" rx="3" fill="#EFF6FF" stroke="#272134" stroke-width="1.9"/><line x1="70" y1="182" x2="240" y2="182" stroke="#272134" stroke-width="0.9"/><polygon points="70.0,182.0 75.5,179.6 75.5,184.4" fill="#272134"/><polygon points="240.0,182.0 234.5,184.4 234.5,179.6" fill="#272134"/><line x1="70" y1="156" x2="70" y2="179" stroke="#272134" stroke-width="0.7"/><line x1="240" y1="156" x2="240" y2="179" stroke="#272134" stroke-width="0.7"/><text x="155.0" y="178.5" font-size="7.5" fill="#272134" text-anchor="middle" font-weight="bold">120.00</text><line x1="48" y1="96" x2="48" y2="156" stroke="#272134" stroke-width="0.9"/><polygon points="48.0,96.0 50.4,101.5 45.6,101.5" fill="#272134"/><polygon points="48.0,156.0 45.6,150.5 50.4,150.5" fill="#272134"/><text x="44.0" y="126.0" font-size="7.5" fill="#272134" font-weight="bold" text-anchor="middle" transform="rotate(-90 44.0 126.0)" font-family="inherit">60</text><text x="14" y="76" font-size="6.5" fill="#1D4ED8" text-anchor="start">extension (witness) lines</text><line x1="70" y1="88" x2="70" y2="96" stroke="#1D4ED8" stroke-width="1.0"/><line x1="240" y1="172" x2="240" y2="182" stroke="#1D4ED8" stroke-width="1.0"/><text x="250" y="84" font-size="6.5" fill="#1D4ED8" text-anchor="start">dimension line with arrowheads</text><line x1="244" y1="88" x2="240" y2="120" stroke="#1D4ED8" stroke-width="0.8" stroke-dasharray="3,2"/><text x="250" y="130" font-size="6.5" fill="#1D4ED8" text-anchor="start">text: height 3.5 mm typical,</text><text x="250" y="142" font-size="6.5" fill="#1D4ED8" text-anchor="start">placed above/break in line</text><text x="14" y="210" font-size="8" fill="#272134" text-anchor="start" font-weight="bold">anatomy rules (BIS/ISO):</text><text x="14" y="226" font-size="7" fill="#64748B" text-anchor="start">extension lines start ~1.5 mm clear of the object; dimension lines never cross each other;</text><text x="14" y="239" font-size="7" fill="#64748B" text-anchor="start">smaller dimensions nearer the object; dimensions outside the outline where possible;</text><text x="14" y="252" font-size="7" fill="#64748B" text-anchor="start">arrowheads (closed filled, approx 3 x 1) inside; if no room, arrows outside / dot / oblique tick.</text><rect x="14" y="264" width="160" height="34" rx="3" fill="#FFFFFF" stroke="#272134" stroke-width="1.0"/><text x="20" y="278" font-size="6.8" fill="#272134" text-anchor="start">DTEXT: single-line note</text><text x="20" y="291" font-size="6.3" fill="#64748B" text-anchor="start">(each Enter = new object)</text><rect x="186" y="264" width="160" height="34" rx="3" fill="#FFFFFF" stroke="#272134" stroke-width="1.0"/><text x="192" y="278" font-size="6.8" fill="#272134" text-anchor="start">MTEXT: paragraph text box</text><text x="192" y="291" font-size="6.3" fill="#64748B" text-anchor="start">(wraps, bullets, columns)</text><text x="180" y="316" font-size="7" fill="#272134" text-anchor="middle" font-weight="bold">DIMSTYLE presets all of this once - then every dimension matches.</text></svg>