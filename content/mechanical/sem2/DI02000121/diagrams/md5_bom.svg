" font-size="6.3" fill="#272134" text-anchor="middle" font-weight="bold">QTY</text><line x1="286" y1="58" x2="286" y2="186" stroke="#272134" stroke-width="0.8"/><text x="315.0" y="72" font-size="6.3" fill="#272134" text-anchor="middle" font-weight="bold">REMARKS</text><line x1="344" y1="58" x2="344" y2="186" stroke="#272134" stroke-width="0.8"/><rect x="16" y="78" width="328" height="18" rx="3" fill="#FFFFFF" stroke="#272134" stroke-width="0.9"/><text x="36.0" y="91" font-size="6.8" fill="#272134" text-anchor="middle" font-weight="bold">1</text><text x="120.0" y="91" font-size="6.8" fill="#272134" text-anchor="middle">Flange (left)</text><text x="215.0" y="91" font-size="6.8" fill="#272134" text-anchor="middle">CI</text><text x="266.0" y="91" font-size="6.8" fill="#272134" text-anchor="middle">1</text><text x="315.0" y="91" font-size="6.8" fill="#272134" text-anchor="middle">-</text><rect x="16" y="96" width="328" height="18" rx="3" fill="#FFFFFF" stroke="#272134" stroke-width="0.9"/><text x="36.0" y="109" font-size="6.8" fill="#272134" text-anchor="middle" font-weight="bold">2</text><text x="120.0" y="109" font-size="6.8" fill="#272134" text-anchor="middle">Flange (right)</text><text x="215.0" y="109" font-size="6.8" fill="#272134" text-anchor="middle">CI</text><text x="266.0" y="109" font-size="6.8" fill="#272134" text-anchor="middle">1</text><text x="315.0" y="109" font-size="6.8" fill="#272134" text-anchor="middle">-</text><rect x="16" y="114" width="328" height="18" rx="3" fill="#FFFFFF" stroke="#272134" stroke-width="0.9"/><text x="36.0" y="127" font-size="6.8" fill="#272134" text-anchor="middle" font-weight="bold">3</text><text x="120.0" y="127" font-size="6.8" fill="#272134" text-anchor="middle">Hex bolt M12x90</text><text x="215.0" y="127" font-size="6.8" fill="#272134" text-anchor="middle">MS</text><text x="266.0" y="127" font-size="6.8" fill="#272134" text-anchor="middle">4</text><text x="315.0" y="127" font-size="6.8" fill="#272134" text-anchor="middle">