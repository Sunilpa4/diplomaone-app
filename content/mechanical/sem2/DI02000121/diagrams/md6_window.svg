<svg xmlns="http://www.w3.org/2000/svg" width="360" height="298" viewBox="0 0 360 298" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="298" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">The AutoCAD window</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Title bar, Quick Access, Ribbon, drawing area, command prompt, status bar</text><rect x="14" y="52" width="332" height="218" rx="3" fill="#FFFFFF" stroke="#272134" stroke-width="1.6"/><rect x="14" y="52" width="332" height="18" rx="3" fill="#1E3A8A" stroke="#272134" stroke-width="1.2"/><text x="20" y="65" font-size="7" fill="#FFFFFF" text-anchor="start" font-weight="bold">A  Drawing1.dwg - AutoCAD (title bar)</text><rect x="14" y="70" width="332" height="16" rx="3" fill="#DBEAFE" stroke="#272134" stroke-width="1.0"/><text x="20" y="81" font-size="6.5" fill="#272134" text-anchor="start">Quick Access Toolbar: New  Open  Save  SaveAs  Undo  Redo</text><rect x="14" y="86" width="332" height="30" rx="3" fill="#EFF6FF" stroke="#272134" stroke-width="1.0"/><text x="20" y="97" font-size="6.8" fill="#272134" text-anchor="start" font-weight="bold">Ribbon tabs: Home  Insert  Annotate  Parametric  View  Manage</text><text x="20" y="110" font-size="6.3" fill="#64748B" text-anchor="start">Panels: Draw (Line, Circle, Arc...) | Modify (Move, Copy, Trim...) | Layers | Annotation</text><rect x="14" y="116" width="332" height="96" rx="3" fill="#F8FAFC" stroke="#272134" stroke-width="1.0"/><circle cx="180" cy="164" r="30" fill="none" stroke="#272134" stroke-width="1.6"/><rect x="150" y="148" width="60" height="32" rx="3" fill="none" stroke="#272134" stroke-width="1.2"/><line x1="140" y1="164" x2="220" y2="164" stroke="#B91C1C" stroke-width="0.8" stroke-dasharray="14,3,3,3"/><path d="M 30 196 L 30 180 M 30 196 L 46 196" fill="none" stroke="#B91C1C" stroke-width="1.4"/><text x="52" y="198" font-size="6.3" fill="#B91C1C" text-anchor="start">UCS icon (X-Y origin)</text><text x="330" y="128" font-size="6.8" fill="#272134" text-anchor="end" font-weight="bold">drawing area / viewport</text><rect x="14" y="212" width="332" height="20" rx="3" fill="#FEF3C7" stroke="#272134" stroke-width="1.0"/><text x="20" y="225" font-size="6.8" fill="#272134" text-anchor="start">Command prompt: Type a command: LINE Specify first point:</text><rect x="14" y="232" width="332" height="38" rx="3" fill="#E0E7FF" stroke="#272134" stroke-width="1.0"/><text x="20" y="244" font-size="6.5" fill="#272134" text-anchor="start" font-weight="bold">Status bar: MODEL | GRID | SNAP | ORTHO | POLAR | OSNAP | DYN | LWT | ...</text><text x="20" y="258" font-size="6.3" fill="#64748B" text-anchor="start">Navigation: ViewCube, NavBar, scroll bars; cursor = crosshair in drawing area</text><text x="180" y="288" font-size="7" fill="#64748B" text-anchor="middle">Every AutoCAD session is read in this frame: menus up, drawing in the middle, commands below.</text></svg>