<svg xmlns="http://www.w3.org/2000/svg" width="360" height="226" viewBox="0 0 360 226" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="226" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Hole-basis vs shaft-basis system</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Which member is kept standard decides the system</text><text x="16" y="66" font-size="8.5" fill="#272134" text-anchor="start" font-weight="bold">HOLE-BASIS system (preferred)</text><line x1="16" y1="120" x2="170" y2="120" stroke="#272134" stroke-width="1.2"/><text x="172" y="123" font-size="6.5" fill="#64748B" text-anchor="start">zero line (basic size)</text><rect x="40" y="92" width="90" height="26" rx="3" fill="#DBEAFE" stroke="#272134" stroke-width="1.5"/><text x="85" y="108" font-size="8" fill="#272134" text-anchor="middle" font-weight="bold">HOLE H</text><text x="136" y="104" font-size="6.5" fill="#64748B" text-anchor="start">EI = 0</text><rect x="36" y="132" width="30" height="16" rx="3" fill="#FEF3C7" stroke="#272134" stroke-width="1.2"/><text x="51" y="158" font-size="6.3" fill="#272134" text-anchor="middle">g shaft</text><rect x="86" y="128" width="30" height="16" rx="3" fill="#FDE68A" stroke="#272134" stroke-width="1.2"/><text x="101" y="154" font-size="6.3" fill="#272134" text-anchor="middle">k shaft</text><rect x="128" y="124" width="30" height="16" rx="3" fill="#FCA5A5" stroke="#272134" stroke-width="1.2"/><text x="143" y="150" font-size="6.3" fill="#272134" text-anchor="middle">p shaft</text><text x="93" y="172" font-size="6.8" fill="#64748B" text-anchor="middle">one hole, many shafts - few tools (drills/reamers)</text><text x="196" y="66" font-size="8.5" fill="#272134" text-anchor="start" font-weight="bold">SHAFT-BASIS system</text><line x1="196" y1="120" x2="350" y2="120" stroke="#272134" stroke-width="1.2"/><rect x="226" y="124" width="90" height="26" rx="3" fill="#FEF3C7" stroke="#272134" stroke-width="1.5"/><text x="271" y="140" font-size="8" fill="#272134" text-anchor="middle" font-weight="bold">SHAFT h</text><text x="320" y="140" font-size="6.5" fill="#64748B" text-anchor="start">es = 0</text><rect x="216" y="92" width="30" height="16" rx="3" fill="#DBEAFE" stroke="#272134" stroke-width="1.2"/><text x="231" y="88" font-size="6.3" fill="#272134" text-anchor="middle">G hole</text><rect x="266" y="96" width="30" height="16" rx="3" fill="#BFDBFE" stroke="#272134" stroke-width="1.2"/><text x="281" y="92" font-size="6.3" fill="#272134" text-anchor="middle">K hole</text><rect x="312" y="100" width="30" height="16" rx="3" fill="#93C5FD" stroke="#272134" stroke-width="1.2"/><text x="327" y="96" font-size="6.3" fill="#272134" text-anchor="middle">P hole</text><text x="273" y="172" font-size="6.8" fill="#64748B" text-anchor="middle">one shaft, many holes - for standard shafts/bars</text><text x="180" y="198" font-size="7.5" fill="#272134" text-anchor="middle" font-weight="bold">The BASIS member keeps one deviation zero; fit comes from shifting the other zone.</text><text x="180" y="213" font-size="7" fill="#64748B" text-anchor="middle">Hole-basis dominates: holes need standard tools; shafts are easily turned/ground.</text></svg>