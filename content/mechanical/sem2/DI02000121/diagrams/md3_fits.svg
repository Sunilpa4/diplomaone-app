<svg xmlns="http://www.w3.org/2000/svg" width="360" height="272" viewBox="0 0 360 272" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="272" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">The three types of fit</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Clearance, interference and transition - zone geometry decides</text><rect x="22" y="60" width="96" height="150" rx="3" fill="#FFFFFF" stroke="#272134" stroke-width="1.2"/><line x1="30" y1="150" x2="110" y2="150" stroke="#272134" stroke-width="1.1"/><rect x="52" y="56" width="36" height="26" rx="3" fill="#BFDBFE" stroke="#272134" stroke-width="1.3"/><text x="70" y="72" font-size="6.3" fill="#272134" text-anchor="middle" font-weight="bold">HOLE</text><rect x="52" y="200" width="36" height="26" rx="3" fill="#FDE68A" stroke="#272134" stroke-width="1.3"/><text x="70" y="216" font-size="6.3" fill="#272134" text-anchor="middle" font-weight="bold">SHAFT</text><text x="70" y="228" font-size="7.5" fill="#272134" text-anchor="middle" font-weight="bold">CLEARANCE fit</text><text x="70" y="240" font-size="6.2" fill="#64748B" text-anchor="middle">always a gap: shaft smaller</text><rect x="134" y="60" width="96" height="150" rx="3" fill="#FFFFFF" stroke="#272134" stroke-width="1.2"/><line x1="142" y1="150" x2="222" y2="150" stroke="#272134" stroke-width="1.1"/><rect x="164" y="200" width="36" height="26" rx="3" fill="#BFDBFE" stroke="#272134" stroke-width="1.3"/><text x="182" y="216" font-size="6.3" fill="#272134" text-anchor="middle" font-weight="bold">HOLE</text><rect x="164" y="56" width="36" height="26" rx="3" fill="#FDE68A" stroke="#272134" stroke-width="1.3"/><text x="182" y="72" font-size="6.3" fill="#272134" text-anchor="middle" font-weight="bold">SHAFT</text><text x="182" y="228" font-size="7.5" fill="#272134" text-anchor="middle" font-weight="bold">INTERFERENCE fit</text><text x="182" y="240" font-size="6.2" fill="#64748B" text-anchor="middle">always tight: shaft bigger</text><rect x="246" y="60" width="96" height="150" rx="3" fill="#FFFFFF" stroke="#272134" stroke-width="1.2"/><line x1="254" y1="150" x2="334" y2="150" stroke="#272134" stroke-width="1.1"/><rect x="276" y="104" width="36" height="26" rx="3" fill="#BFDBFE" stroke="#272134" stroke-width="1.3"/><text x="294" y="120" font-size="6.3" fill="#272134" text-anchor="middle" font-weight="bold">HOLE</text><rect x="276" y="128" width="36" height="26" rx="3" fill="#FDE68A" stroke="#272134" stroke-width="1.3"/><text x="294" y="144" font-size="6.3" fill="#272134" text-anchor="middle" font-weight="bold">SHAFT</text><text x="294" y="228" font-size="7.5" fill="#272134" text-anchor="middle" font-weight="bold">TRANSITION fit</text><text x="294" y="240" font-size="6.2" fill="#64748B" text-anchor="middle">gap or tight, by actual sizes</text><text x="180" y="262" font-size="7.5" fill="#64748B" text-anchor="middle">Zero line = basic size; fit character follows the relative zone positions.</text></svg>