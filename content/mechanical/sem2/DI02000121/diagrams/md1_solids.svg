<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="264" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Basic solids of Unit 1</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Prism, pyramid, cylinder and cone — the building blocks of machine parts</text><path d="M 30 174 L 82 174 L 56 124 Z" fill="#EFF6FF" stroke="#272134" stroke-width="1.9"/><path d="M 46 162 L 98 162 L 72 112" fill="none" stroke="#272134" stroke-width="1.3"/><line x1="30" y1="174" x2="46" y2="162" stroke="#272134" stroke-width="1.3"/><line x1="82" y1="174" x2="98" y2="162" stroke="#272134" stroke-width="1.3"/><line x1="56" y1="124" x2="72" y2="112" stroke="#272134" stroke-width="1.3"/><path d="M 82 174 L 98 162 L 72 112 L 56 124 Z" fill="#BFDBFE" stroke="#272134" stroke-width="1.3"/><line x1="64" y1="186" x2="64" y2="106" stroke="#B91C1C" stroke-width="0.8" stroke-dasharray="14,3,3,3"/><text x="64" y="196" font-size="8" fill="#272134" text-anchor="middle" font-weight="bold">TRIANGULAR PRISM</text><text x="64" y="208" font-size="6.5" fill="#64748B" text-anchor="middle">two triangular bases +</text><text x="64" y="218" font-size="6.5" fill="#64748B" text-anchor="middle">rectangular faces</text><path d="M 128 174 L 184 174 L 172 156 L 140 156 Z" fill="#BFDBFE" stroke="#272134" stroke-width="1.4"/><path d="M 156 96 L 128 174 L 140 156 M 156 96 L 184 174" fill="none" stroke="#272134" stroke-width="1.9"/><path d="M 156 96 L 172 156" fill="none" stroke="#272134" stroke-width="1.9"/><line x1="156" y1="86" x2="156" y2="184" stroke="#B91C1C" stroke-width="0.8" stroke-dasharray="14,3,3,3"/><line x1="156" y1="96" x2="122" y2="84" stroke="#272134" stroke-width="0.9"/><polygon points="156.0,96.0 150.5,96.4 152.0,92.2" fill="#272134"/><line x1="122" y1="84" x2="96" y2="84" stroke="#272134" stroke-width="0.9"/><text x="93" y="86.5" font-size="7" fill="#272134" text-anchor="end">apex</text><text x="156" y="196" font-size="8" fill="#272134" text-anchor="middle" font-weight="bold">SQUARE PYRAMID</text><text x="156" y="208" font-size="6.5" fill="#64748B" text-anchor="middle">polygon base + triangular</text><text x="156" y="218" font-size="6.5" fill="#64748B" text-anchor="middle">faces meeting at apex</text><ellipse cx="248" cy="174" rx="26" ry="8.32" fill="#BFDBFE" stroke="#272134" stroke-width="1.4"/><path d="M 222.0 104.0 L 222.0 174.0 A 26.0 8.3 0 0 0 274.0 174.0 L 274.0 104.0" fill="none" stroke="#272134" stroke-width="1.9"/><ellipse cx="248" cy="104" rx="26" ry="8.32" fill="#EFF6FF" stroke="#272134" stroke-width="1.9"/><line x1="216" y1="104" x2="280" y2="104" stroke="#B91C1C" stroke-width="0.8" stroke-dasharray="14,3,3,3"/><text x="248" y="196" font-size="8" fill="#272134" text-anchor="middle" font-weight="bold">CYLINDER</text><text x="248" y="208" font-size="6.5" fill="#64748B" text-anchor="middle">two circular bases +</text><text x="248" y="218" font-size="6.5" fill="#64748B" text-anchor="middle">curved surface</text><ellipse cx="322" cy="174" rx="24" ry="7.68" fill="#BFDBFE" stroke="#272134" stroke-width="1.4"/><path d="M 322.0 98.0 L 298.0 174.0 M 322.0 98.0 L 346.0 174.0" fill="none" stroke="#272134" stroke-width="1.9"/><path d="M 298.0 174.0 A 24.0 7.7 0 0 0 346.0 174.0" fill="none" stroke="#272134" stroke-width="1.9"/><line x1="322" y1="98" x2="300" y2="84" stroke="#272134" stroke-width="0.9"/><polygon points="322.0,98.0 316.6,97.2 319.0,93.4" fill="#272134"/><line x1="300" y1="84" x2="274" y2="84" stroke="#272134" stroke-width="0.9"/><text x="271" y="86.5" font-size="7" fill="#272134" text-anchor="end">apex</text><text x="322" y="196" font-size="8" fill="#272134" text-anchor="middle" font-weight="bold">CONE</text><text x="322" y="208" font-size="6.5" fill="#64748B" text-anchor="middle">circular base +</text><text x="322" y="218" font-size="6.5" fill="#64748B" text-anchor="middle">slant surface</text><text x="180" y="240" font-size="7" fill="#64748B" text-anchor="middle">Generators: lines from apex / along surface. Axis: line joining base centres (or apex to base centre).</text><text x="180" y="254" font-size="7" fill="#64748B" text-anchor="middle">Right solid: axis perpendicular to base. Oblique solid: axis inclined to base.</text></svg>