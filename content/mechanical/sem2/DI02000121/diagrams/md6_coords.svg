<svg xmlns="http://www.w3.org/2000/svg" width="360" height="268" viewBox="0 0 360 268" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="268" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Coordinate systems in AutoCAD</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Absolute, relative (Cartesian) and polar entry - one line drawn three ways</text><line x1="40" y1="220" x2="330" y2="220" stroke="#272134" stroke-width="1.3"/><line x1="40" y1="220" x2="40" y2="60" stroke="#272134" stroke-width="1.3"/><polygon points="330.0,220.0 323.6,222.9 323.6,217.1" fill="#272134"/><polygon points="40.0,60.0 42.9,66.4 37.1,66.4" fill="#272134"/><text x="334" y="224" font-size="8" fill="#272134" text-anchor="start" font-weight="bold">X</text><text x="36" y="52" font-size="8" fill="#272134" text-anchor="middle" font-weight="bold">Y</text><circle cx="40.0" cy="220.0" r="3" fill="#272134" stroke="#272134" stroke-width="1"/><text x="46.0" y="214.0" font-size="7.5" fill="#272134" text-anchor="start" font-weight="bold">P1 (0,0) origin</text><circle cx="106.0" cy="187.0" r="3" fill="#1D4ED8" stroke="#1D4ED8" stroke-width="1"/><text x="112.0" y="181.0" font-size="7.5" fill="#1D4ED8" text-anchor="start" font-weight="bold">P2</text><circle cx="194.0" cy="132.0" r="3" fill="#065F46" stroke="#065F46" stroke-width="1"/><text x="200.0" y="126.0" font-size="7.5" fill="#065F46" text-anchor="start" font-weight="bold">P3</text><line x1="40" y1="220" x2="106" y2="187" stroke="#1D4ED8" stroke-width="1.4"/><line x1="106" y1="187" x2="194" y2="132" stroke="#065F46" stroke-width="1.4"/><text x="120" y="130" font-size="7.5" fill="#1D4ED8" text-anchor="start" font-weight="bold">P1 -> P2: relative @30,15</text><text x="190" y="96" font-size="7" fill="#1D4ED8" text-anchor="start">or absolute 30,15</text><text x="120" y="200" font-size="7.5" fill="#065F46" text-anchor="start" font-weight="bold">P2 -> P3: polar @40&lt;30 (length 40 at 30 deg) - lands at (64.6, 35)</text><text x="180" y="258" font-size="7" fill="#64748B" text-anchor="middle">Cartesian: X,Y horizontal/vertical distances. Polar: length&lt;angle. Prefix @ = relative to last point.</text></svg>