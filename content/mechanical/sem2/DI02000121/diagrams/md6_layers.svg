<svg xmlns="http://www.w3.org/2000/svg" width="360" height="340" viewBox="0 0 360 340" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="340" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Layers, blocks and hatch</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Organising a drawing so it can be edited, reused and plotted selectively</text><path d="M 60 62 L 170 44 L 210 62 L 100 80 Z" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.5"/><text x="224" y="65" font-size="7" fill="#B91C1C" text-anchor="start" font-weight="bold">DIM (dimensions)</text><path d="M 60 92 L 170 74 L 210 92 L 100 110 Z" fill="#FFFFFF" stroke="#92400E" stroke-width="1.5"/><text x="224" y="95" font-size="7" fill="#92400E" text-anchor="start" font-weight="bold">HIDDEN (dashed)</text><path d="M 60 122 L 170 104 L 210 122 L 100 140 Z" fill="#FFFFFF" stroke="#065F46" stroke-width="1.5"/><text x="224" y="125" font-size="7" fill="#065F46" text-anchor="start" font-weight="bold">CENTRE (centre lines)</text><path d="M 60 152 L 170 134 L 210 152 L 100 170 Z" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.5"/><text x="224" y="155" font-size="7" fill="#1D4ED8" text-anchor="start" font-weight="bold">OBJECT (visible)</text><text x="150" y="204" font-size="7" fill="#64748B" text-anchor="middle">object drawn once; each entity lives on a layer -------- stacked view = the drawing</text><rect x="24" y="224" width="320" height="16" rx="3" fill="#DBEAFE" stroke="#272134" stroke-width="1.1"/><text x="59.0" y="236" font-size="6.2" fill="#272134" text-anchor="middle" font-weight="bold">LAYER</text><text x="120.0" y="236" font-size="6.2" fill="#272134" text-anchor="middle" font-weight="bold">STATE</text><text x="172.0" y="236" font-size="6.2" fill="#272134" text-anchor="middle" font-weight="bold">COLOUR</text><text x="240.0" y="236" font-size="6.2" fill="#272134" text-anchor="middle" font-weight="bold">LINETYPE</text><text x="313.0" y="236" font-size="6.2" fill="#272134" text-anchor="middle" font-weight="bold">USE</text><rect x="24" y="240" width="320" height="14" rx="3" fill="#FFFFFF" stroke="#272134" stroke-width="0.8"/><text x="59.0" y="250.5" font-size="6.3" fill="#272134" text-anchor="middle">OBJECT</text><text x="120.0" y="250.5" font-size="6.3" fill="#272134" text-anchor="middle">on</text><text x="172.0" y="250.5" font-size="6.3" fill="#272134" text-anchor="middle">blue</text><text x="240.0" y="250.5" font-size="6.3" fill="#272134" text-anchor="middle">Continuous</text><text x="313.0" y="250.5" font-size="6.3" fill="#272134" text-anchor="middle">plot</text><rect x="24" y="254" width="320" height="14" rx="3" fill="#FFFFFF" stroke="#272134" stroke-width="0.8"/><text x="59.0" y="264.5" font-size="6.3" fill="#272134" text-anchor="middle">CENTRE</text><text x="120.0" y="264.5" font-size="6.3" fill="#272134" text-anchor="middle">on</text><text x="172.0" y="264.5" font-size="6.3" fill="#272134" text-anchor="middle">green</text><text x="240.0" y="264.5" font-size="6.3" fill="#272134" text-anchor="middle">CENTER</text><text x="313.0" y="264.5" font-size="6.3" fill="#272134" text-anchor="middle">plot</text><rect x="24" y="268" width="320" height="14" rx="3" fill="#FFFFFF" stroke="#272134" stroke-width="0.8"/><text x="59.0" y="278.5" font-size="6.3" fill="#272134" text-anchor="middle">HIDDEN</text><text x="120.0" y="278.5" font-size="6.3" fill="#272134" text-anchor="middle">on</text><text x="172.0" y="278.5" font-size="6.3" fill="#272134" text-anchor="middle">brown</text><text x="240.0" y="278.5" font-size="6.3" fill="#272134" text-anchor="middle">HIDDEN</text><text x="313.0" y="278.5" font-size="6.3" fill="#272134" text-anchor="middle">plot</text><rect x="24" y="282" width="320" height="14" rx="3" fill="#FFFFFF" stroke="#272134" stroke-width="0.8"/><text x="59.0" y="292.5" font-size="6.3" fill="#272134" text-anchor="middle">DIM</text><text x="120.0" y="292.5" font-size="6.3" fill="#272134" text-anchor="middle">on</text><text x="172.0" y="292.5" font-size="6.3" fill="#272134" text-anchor="middle">red</text><text x="240.0" y="292.5" font-size="6.3" fill="#272134" text-anchor="middle">Continuous</text><text x="313.0" y="292.5" font-size="6.3" fill="#272134" text-anchor="middle">plot</text><rect x="24" y="296" width="320" height="14" rx="3" fill="#FFFFFF" stroke="#272134" stroke-width="0.8"/><text x="59.0" y="306.5" font-size="6.3" fill="#272134" text-anchor="middle">TITLE</text><text x="120.0" y="306.5" font-size="6.3" fill="#272134" text-anchor="middle">frozen</text><text x="172.0" y="306.5" font-size="6.3" fill="#272134" text-anchor="middle">black</text><text x="240.0" y="306.5" font-size="6.3" fill="#272134" text-anchor="middle">-</text><text x="313.0" y="306.5" font-size="6.3" fill="#272134" text-anchor="middle">no plot</text><text x="14" y="332" font-size="7" fill="#272134" text-anchor="start" font-weight="bold">BLOCK: a named group inserted many times (bolt, title block).</text><text x="14" y="346" font-size="7" fill="#272134" text-anchor="start" font-weight="bold">HATCH: pattern fill of a closed area (used for sections).</text></svg>