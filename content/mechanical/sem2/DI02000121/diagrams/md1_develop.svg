<svg xmlns="http://www.w3.org/2000/svg" width="360" height="285" viewBox="0 0 360 285" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="285" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Development of surfaces</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Unfolding solids into flat patterns for sheet-metal work</text><rect x="20" y="70" width="28" height="28" rx="3" fill="#EFF6FF" stroke="#272134" stroke-width="1.4"/><rect x="48" y="70" width="28" height="28" rx="3" fill="#EFF6FF" stroke="#272134" stroke-width="1.4"/><rect x="76" y="70" width="28" height="28" rx="3" fill="#EFF6FF" stroke="#272134" stroke-width="1.4"/><rect x="104" y="70" width="28" height="28" rx="3" fill="#EFF6FF" stroke="#272134" stroke-width="1.4"/><rect x="48" y="42" width="28" height="28" rx="3" fill="#DBEAFE" stroke="#272134" stroke-width="1.4"/><rect x="48" y="98" width="28" height="28" rx="3" fill="#DBEAFE" stroke="#272134" stroke-width="1.4"/><text x="66" y="140" font-size="7.5" fill="#272134" text-anchor="middle" font-weight="bold">prism/cube net</text><text x="66" y="152" font-size="6.5" fill="#64748B" text-anchor="middle">(parallel-line method)</text><rect x="140" y="56" width="120" height="56" rx="3" fill="#EFF6FF" stroke="#272134" stroke-width="1.4"/><line x1="140" y1="128" x2="260" y2="128" stroke="#272134" stroke-width="0.9"/><polygon points="140.0,128.0 145.5,125.6 145.5,130.4" fill="#272134"/><polygon points="260.0,128.0 254.5,130.4 254.5,125.6" fill="#272134"/><line x1="140" y1="112" x2="140" y2="125" stroke="#272134" stroke-width="0.7"/><line x1="260" y1="112" x2="260" y2="125" stroke="#272134" stroke-width="0.7"/><text x="200.0" y="124.5" font-size="7.5" fill="#272134" text-anchor="middle" font-weight="bold">length = pi x D</text><circle cx="158" cy="140" r="12" fill="#DBEAFE" stroke="#272134" stroke-width="1.2"/><circle cx="242" cy="140" r="12" fill="#DBEAFE" stroke="#272134" stroke-width="1.2"/><text x="200" y="140" font-size="6.5" fill="#64748B" text-anchor="middle">+ 2 bases</text><text x="200" y="168" font-size="7.5" fill="#272134" text-anchor="middle" font-weight="bold">cylinder development</text><text x="200" y="180" font-size="6.5" fill="#64748B" text-anchor="middle">(parallel-line method)</text><path d="M 306.0 130.0 L 284.0 82.9 A 52.0 52.0 0 0 1 328.0 82.9 Z" fill="#EFF6FF" stroke="#272134" stroke-width="1.4"/><text x="356" y="196" font-size="7.5" fill="#272134" text-anchor="end" font-weight="bold">cone development: sector</text><text x="356" y="208" font-size="6.5" fill="#64748B" text-anchor="end">radius = slant height l</text><text x="356" y="219" font-size="6.5" fill="#64748B" text-anchor="end">angle theta = (r/l) x 360 deg</text><text x="356" y="230" font-size="6.5" fill="#64748B" text-anchor="end">(radial-line method)</text><text x="180" y="262" font-size="7.5" fill="#64748B" text-anchor="middle">Development = true-size flat pattern of the surface. Sheet-metal ducts, hoppers,</text><text x="180" y="275" font-size="7.5" fill="#64748B" text-anchor="middle">tanks, chimneys and transition pieces are cut from such patterns, then folded/rolled.</text></svg>