<svg xmlns="http://www.w3.org/2000/svg" width="360" height="318" viewBox="0 0 360 318" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="318" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Line types and title block (SP 46)</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">The standard alphabet of lines every draftsman must use</text><line x1="24" y1="62" x2="120" y2="62" stroke="#272134" stroke-width="2.2"/><text x="132" y="65" font-size="8" fill="#272134" text-anchor="start" font-weight="bold">Visible (object) line</text><text x="132" y="76" font-size="6.8" fill="#64748B" text-anchor="start">thick continuous — outlines and edges</text><line x1="24" y1="86" x2="120" y2="86" stroke="#272134" stroke-width="1.0" stroke-dasharray="5,3"/><text x="132" y="91" font-size="8" fill="#272134" text-anchor="start" font-weight="bold">Hidden line</text><text x="132" y="102" font-size="6.8" fill="#64748B" text-anchor="start">medium dashed — invisible edges</text><line x1="24" y1="110" x2="120" y2="110" stroke="#B91C1C" stroke-width="0.8" stroke-dasharray="14,3,3,3"/><text x="132" y="117" font-size="8" fill="#272134" text-anchor="start" font-weight="bold">Centre line</text><text x="132" y="128" font-size="6.8" fill="#64748B" text-anchor="start">thin long-short dash — axes, symmetry</text><line x1="24" y1="134" x2="120" y2="134" stroke="#272134" stroke-width="1.6" stroke-dasharray="16,4,4,4"/><text x="132" y="143" font-size="8" fill="#272134" text-anchor="start" font-weight="bold">Cutting-plane line</text><text x="132" y="154" font-size="6.8" fill="#64748B" text-anchor="start">thick long-short dash — section planes</text><line x1="24" y1="158" x2="120" y2="158" stroke="#272134" stroke-width="0.9"/><polygon points="24.0,158.0 29.5,155.6 29.5,160.4" fill="#272134"/><polygon points="120.0,158.0 114.5,160.4 114.5,155.6" fill="#272134"/><text x="72.0" y="154.5" font-size="7.5" fill="#272134" text-anchor="middle" font-weight="bold"></text><text x="132" y="169" font-size="8" fill="#272134" text-anchor="start" font-weight="bold">Dimension / extension</text><text x="132" y="180" font-size="6.8" fill="#64748B" text-anchor="start">thin continuous — sizes</text><path d="M 24 182 q 12 -7 24 0 t 24 0 t 24 0 t 24 0" fill="none" stroke="#272134" stroke-width="1.1"/><text x="132" y="195" font-size="8" fill="#272134" text-anchor="start" font-weight="bold">Break line (freehand)</text><text x="132" y="206" font-size="6.8" fill="#64748B" text-anchor="start">thin wavy — partial views/breaks</text><rect x="160" y="216" width="192" height="58" rx="3" fill="#FFFFFF" stroke="#272134" stroke-width="1.6"/><line x1="160" y1="235" x2="352" y2="235" stroke="#272134" stroke-width="1.0"/><line x1="160" y1="254" x2="352" y2="254" stroke="#272134" stroke-width="1.0"/><line x1="256" y1="216" x2="256" y2="274" stroke="#272134" stroke-width="1.0"/><text x="165" y="230" font-size="7" fill="#272134" text-anchor="start" font-weight="bold">TITLE BLOCK (SP 46)</text><text x="261" y="230" font-size="7" fill="#272134" text-anchor="start">scale 1:1</text><text x="165" y="249" font-size="7" fill="#272134" text-anchor="start">name / material</text><text x="261" y="249" font-size="7" fill="#272134" text-anchor="start">sheet A2</text><text x="165" y="268" font-size="7" fill="#272134" text-anchor="start">drawn / checked / dates</text><text x="261" y="268" font-size="7" fill="#272134" text-anchor="start">dwg no.</text><text x="24" y="296" font-size="7" fill="#64748B" text-anchor="start">sheet sizes: A0 841x1189, A1 594x841, A2 420x594, A3 297x420, A4 210x297 mm (trimmed).</text><text x="24" y="308" font-size="7.5" fill="#272134" text-anchor="start" font-weight="bold">Read the line, read the meaning — one line language for all drawings.</text></svg>