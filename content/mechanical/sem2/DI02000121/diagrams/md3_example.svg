<svg xmlns="http://www.w3.org/2000/svg" width="360" height="278" viewBox="0 0 360 278" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="278" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Tolerance-zone diagram of a fit</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Deviations plotted from the zero line - the arithmetic of limits and fits</text><text x="20" y="64" font-size="8.5" fill="#272134" text-anchor="start" font-weight="bold">Worked example: dia. 50 H7/g6 (Numerical 3.1)</text><line x1="48" y1="196.0" x2="322" y2="196.0" stroke="#272134" stroke-width="1.3"/><text x="326" y="192.0" font-size="6.5" fill="#64748B" text-anchor="start">zero line</text><line x1="44" y1="236.0" x2="48" y2="236.0" stroke="#272134" stroke-width="1"/><text x="42" y="239.0" font-size="6.5" fill="#272134" text-anchor="end">-25</text><line x1="44" y1="196.0" x2="48" y2="196.0" stroke="#272134" stroke-width="1"/><text x="42" y="199.0" font-size="6.5" fill="#272134" text-anchor="end">+0</text><line x1="44" y1="156.0" x2="48" y2="156.0" stroke="#272134" stroke-width="1"/><text x="42" y="159.0" font-size="6.5" fill="#272134" text-anchor="end">+25</text><text x="42" y="132.0" font-size="6.5" fill="#64748B" text-anchor="end">um</text><rect x="110" y="156.0" width="64" height="40.0" rx="3" fill="#BFDBFE" stroke="#272134" stroke-width="1.5"/><text x="142" y="179.8" font-size="7" fill="#272134" text-anchor="middle" font-weight="bold">HOLE H7</text><rect x="216" y="210.4" width="64" height="25.599999999999994" rx="3" fill="#FDE68A" stroke="#272134" stroke-width="1.5"/><text x="248" y="226.2" font-size="7" fill="#272134" text-anchor="middle" font-weight="bold">SHAFT g6</text><line x1="174" y1="156.0" x2="216" y2="156.0" stroke="#1D4ED8" stroke-width="0.9" stroke-dasharray="3,2"/><line x1="174" y1="196.0" x2="216" y2="196.0" stroke="#B91C1C" stroke-width="0.9" stroke-dasharray="3,2"/><text x="56" y="92" font-size="7.5" fill="#1D4ED8" text-anchor="start">ES = +25 um, EI = 0</text><text x="56" y="104" font-size="7" fill="#1D4ED8" text-anchor="start">hole: 50.000 - 50.025 mm</text><text x="226" y="92" font-size="7.5" fill="#92400E" text-anchor="start">es = -9 um, ei = -25 um</text><text x="226" y="104" font-size="7" fill="#92400E" text-anchor="start">shaft: 49.975 - 49.991 mm</text><text x="180" y="254" font-size="7.5" fill="#272134" text-anchor="middle" font-weight="bold">max clearance = ES - ei = 50 um ; min clearance = EI - es = 9 um -> CLEARANCE FIT</text><text x="180" y="268" font-size="7" fill="#64748B" text-anchor="middle">Both clearances positive: the shaft always runs free in the hole (journals, sliding parts).</text></svg>