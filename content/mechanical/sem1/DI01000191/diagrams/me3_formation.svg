<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 385" font-family="DejaVu Sans"><rect width="400" height="385" fill="white"/><text x="200" y="25" text-anchor="middle" font-size="14" fill="#7b2cd9">Constant-pressure formation sequence</text><rect x="18" y="45" width="364" height="58" rx="8" fill="#f3ecfa" stroke="#7b2cd9"/><text x="200" y="68" text-anchor="middle" font-size="11">Subcooled liquid -&gt; saturated liquid</text><text x="200" y="86" text-anchor="middle" font-size="11">Temperature rises to Tsat</text><path d="M200,103 v18 m-4,-5 l4,5 l4,-5" fill="none" stroke="#7b2cd9"/><rect x="18" y="125" width="364" height="58" rx="8" fill="#f3ecfa" stroke="#7b2cd9"/><text x="200" y="148" text-anchor="middle" font-size="11">Wet liquid-vapour mixture</text><text x="200" y="166" text-anchor="middle" font-size="11">Boiling at Tsat; vapour fraction rises</text><path d="M200,183 v18 m-4,-5 l4,5 l4,-5" fill="none" stroke="#7b2cd9"/><rect x="18" y="205" width="364" height="58" rx="8" fill="#f3ecfa" stroke="#7b2cd9"/><text x="200" y="228" text-anchor="middle" font-size="11">Dry saturated vapour</text><text x="200" y="246" text-anchor="middle" font-size="11">Liquid fraction reaches zero</text><path d="M200,263 v18 m-4,-5 l4,5 l4,-5" fill="none" stroke="#7b2cd9"/><rect x="18" y="285" width="364" height="58" rx="8" fill="#f3ecfa" stroke="#7b2cd9"/><text x="200" y="308" text-anchor="middle" font-size="11">Superheated vapour</text><text x="200" y="326" text-anchor="middle" font-size="11">Further heat raises temperature</text></svg>