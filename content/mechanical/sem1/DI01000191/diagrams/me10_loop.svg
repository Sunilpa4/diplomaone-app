<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 385" font-family="DejaVu Sans"><rect width="400" height="385" fill="white"/><text x="200" y="25" text-anchor="middle" font-size="13" fill="#7b2cd9">Basic vapour-compression loop</text><rect x="18" y="45" width="364" height="58" rx="8" fill="#f3ecfa" stroke="#7b2cd9"/><text x="200" y="68" text-anchor="middle" font-size="11">Compressor: work in, vapour pressure rises</text><path d="M200,103 v18 m-4,-5 l4,5 l4,-5" fill="none" stroke="#7b2cd9"/><rect x="18" y="125" width="364" height="58" rx="8" fill="#f3ecfa" stroke="#7b2cd9"/><text x="200" y="148" text-anchor="middle" font-size="11">Condenser: heat out, condensation</text><path d="M200,183 v18 m-4,-5 l4,5 l4,-5" fill="none" stroke="#7b2cd9"/><rect x="18" y="205" width="364" height="58" rx="8" fill="#f3ecfa" stroke="#7b2cd9"/><text x="200" y="228" text-anchor="middle" font-size="11">Expansion: pressure drop / throttling</text><path d="M200,263 v18 m-4,-5 l4,5 l4,-5" fill="none" stroke="#7b2cd9"/><rect x="18" y="285" width="364" height="58" rx="8" fill="#f3ecfa" stroke="#7b2cd9"/><text x="200" y="308" text-anchor="middle" font-size="11">Evaporator: heat in, evaporation</text><text x="200" y="325" text-anchor="middle" font-size="11">Return suitable vapour to compressor</text></svg>