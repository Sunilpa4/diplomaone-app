<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 305" font-family="DejaVu Sans"><rect width="400" height="305" fill="white"/><text x="200" y="25" text-anchor="middle" font-size="14" fill="#7b2cd9">Pressure = normal force / area</text><rect x="18" y="45" width="364" height="58" rx="8" fill="#f3ecfa" stroke="#7b2cd9"/><text x="200" y="68" text-anchor="middle" font-size="11">Same force on a larger contact area</text><text x="200" y="86" text-anchor="middle" font-size="11">Lower average pressure</text><path d="M200,103 v18 m-4,-5 l4,5 l4,-5" fill="none" stroke="#7b2cd9"/><rect x="18" y="125" width="364" height="58" rx="8" fill="#f3ecfa" stroke="#7b2cd9"/><text x="200" y="148" text-anchor="middle" font-size="11">Same force on a smaller contact area</text><text x="200" y="166" text-anchor="middle" font-size="11">Higher average pressure</text><path d="M200,183 v18 m-4,-5 l4,5 l4,-5" fill="none" stroke="#7b2cd9"/><rect x="18" y="205" width="364" height="58" rx="8" fill="#f3ecfa" stroke="#7b2cd9"/><text x="200" y="228" text-anchor="middle" font-size="11">100 N / 0.01 m2 = 10 kPa</text><text x="200" y="246" text-anchor="middle" font-size="11">100 N / 0.005 m2 = 20 kPa</text></svg>