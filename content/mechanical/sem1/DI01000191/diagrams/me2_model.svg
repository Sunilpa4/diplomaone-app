<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 305" font-family="DejaVu Sans"><rect width="400" height="305" fill="white"/><text x="200" y="25" text-anchor="middle" font-size="14" fill="#7b2cd9">Ideal-gas model and limits</text><rect x="18" y="45" width="364" height="58" rx="8" fill="#f3ecfa" stroke="#7b2cd9"/><text x="200" y="68" text-anchor="middle" font-size="11">State equation: pV = mRT</text><text x="200" y="86" text-anchor="middle" font-size="11">Use absolute p and Kelvin T</text><path d="M200,103 v18 m-4,-5 l4,5 l4,-5" fill="none" stroke="#7b2cd9"/><rect x="18" y="125" width="364" height="58" rx="8" fill="#f3ecfa" stroke="#7b2cd9"/><text x="200" y="148" text-anchor="middle" font-size="11">Useful for suitable real-gas conditions</text><text x="200" y="166" text-anchor="middle" font-size="11">Low density; away from condensation</text><path d="M200,183 v18 m-4,-5 l4,5 l4,-5" fill="none" stroke="#7b2cd9"/><rect x="18" y="205" width="364" height="58" rx="8" fill="#f3ecfa" stroke="#7b2cd9"/><text x="200" y="228" text-anchor="middle" font-size="11">Not exact for every real fluid</text><text x="200" y="246" text-anchor="middle" font-size="11">Check model assumptions</text></svg>