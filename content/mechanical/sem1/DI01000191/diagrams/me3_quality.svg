<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" font-family="DejaVu Sans"><rect width="400" height="250" fill="white"/><text x="200" y="28" text-anchor="middle" fill="#7b2cd9" font-size="14">Mass fractions: example x = 0.90</text><rect x="30" y="70" width="306" height="55" fill="#8a38df"/><rect x="336" y="70" width="34" height="55" fill="#5aa7dd"/><text x="180" y="103" text-anchor="middle" font-size="13" fill="white">9 kg vapour (90% by mass)</text><path d="M353,125 V147" stroke="#555"/><text x="300" y="168" text-anchor="middle" font-size="11">1 kg liquid (10% by mass)</text><text x="200" y="202" text-anchor="middle" font-size="12">x = mv / (mv + ml); wetness = 1 - x</text><text x="200" y="229" text-anchor="middle" font-size="10">This is a mass bar, NOT phase volumes in a vessel</text></svg>