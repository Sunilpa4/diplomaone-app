<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 305" font-family="DejaVu Sans"><rect width="400" height="305" fill="white"/><text x="200" y="25" text-anchor="middle" font-size="14" fill="#7b2cd9">Steam states at a specified pressure</text><rect x="18" y="45" width="364" height="58" rx="8" fill="#f3ecfa" stroke="#7b2cd9"/><text x="200" y="68" text-anchor="middle" font-size="11">Wet: liquid + vapour</text><text x="200" y="86" text-anchor="middle" font-size="11">T = Tsat; 0 &lt; x &lt; 1</text><path d="M200,103 v18 m-4,-5 l4,5 l4,-5" fill="none" stroke="#7b2cd9"/><rect x="18" y="125" width="364" height="58" rx="8" fill="#f3ecfa" stroke="#7b2cd9"/><text x="200" y="148" text-anchor="middle" font-size="11">Dry saturated: vapour endpoint</text><text x="200" y="166" text-anchor="middle" font-size="11">T = Tsat; x = 1</text><path d="M200,183 v18 m-4,-5 l4,5 l4,-5" fill="none" stroke="#7b2cd9"/><rect x="18" y="205" width="364" height="58" rx="8" fill="#f3ecfa" stroke="#7b2cd9"/><text x="200" y="228" text-anchor="middle" font-size="11">Superheated: single vapour phase</text><text x="200" y="246" text-anchor="middle" font-size="11">T &gt; Tsat; quality x is not assigned</text></svg>