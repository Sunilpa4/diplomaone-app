<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 314" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="314" fill="#ffffff"/><text x="180.0" y="24.3" font-size="12.2" text-anchor="middle" fill="#222222" font-weight="bold">How hot each material family can work</text><text x="180.0" y="40.2" font-size="9.2" text-anchor="middle" fill="#666666" font-weight="normal">the bond sets the ceiling</text><text x="126" y="64.4" font-size="6.8" text-anchor="end" fill="#222" font-weight="normal">HDPE</text><path d="M132.0 54.5L143.0 54.5L143.0 62.5L132.0 62.5Z" fill="#DCEEFB" stroke="#1565C0" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><text x="148.01176470588234" y="64.2" font-size="6.4" text-anchor="start" fill="#666666" font-weight="normal">90 C</text><text x="126" y="83.4" font-size="6.8" text-anchor="end" fill="#222" font-weight="normal">natural rubber</text><path d="M132.0 73.5L144.2 73.5L144.2 81.5L132.0 81.5Z" fill="#DCEEFB" stroke="#1565C0" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><text x="149.23529411764707" y="83.2" font-size="6.4" text-anchor="start" fill="#666666" font-weight="normal">100 C</text><text x="126" y="102.4" font-size="6.8" text-anchor="end" fill="#222" font-weight="normal">epoxy resin</text><path d="M132.0 92.5L150.4 92.5L150.4 100.5L132.0 100.5Z" fill="#DCEEFB" stroke="#1565C0" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><text x="155.35294117647058" y="102.2" font-size="6.4" text-anchor="start" fill="#666666" font-weight="normal">150 C</text><text x="126" y="121.4" font-size="6.8" text-anchor="end" fill="#222" font-weight="normal">aluminium alloy</text><path d="M132.0 111.5L156.5 111.5L156.5 119.5L132.0 119.5Z" fill="#F6E3C5" stroke="#B66A00" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><text x="161.47058823529412" y="121.2" font-size="6.4" text-anchor="start" fill="#666666" font-weight="normal">200 C</text><text x="126" y="140.4" font-size="6.8" text-anchor="end" fill="#222" font-weight="normal">plain carbon steel</text><path d="M132.0 130.5L193.2 130.5L193.2 138.5L132.0 138.5Z" fill="#F6E3C5" stroke="#B66A00" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><text x="198.1764705882353" y="140.2" font-size="6.4" text-anchor="start" fill="#666666" font-weight="normal">500 C</text><text x="126" y="159.4" font-size="6.8" text-anchor="end" fill="#222" font-weight="normal">stainless steel 316</text><path d="M132.0 149.5L229.9 149.5L229.9 157.5L132.0 157.5Z" fill="#F6E3C5" stroke="#B66A00" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><text x="234.88235294117646" y="159.2" font-size="6.4" text-anchor="start" fill="#666666" font-weight="normal">800 C</text><text x="126" y="178.4" font-size="6.8" text-anchor="end" fill="#222" font-weight="normal">alumina ceramic</text><path d="M132.0 168.5L315.5 168.5L315.5 176.5L132.0 176.5Z" fill="#D8EDEA" stroke="#00695C" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><text x="320.52941176470586" y="178.2" font-size="6.4" text-anchor="start" fill="#666666" font-weight="normal">1500 C</text><text x="126" y="197.4" font-size="6.8" text-anchor="end" fill="#222" font-weight="normal">silicon carbide</text><path d="M132.0 187.5L327.8 187.5L327.8 195.5L132.0 195.5Z" fill="#D8EDEA" stroke="#00695C" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><text x="332.7647058823529" y="197.2" font-size="6.4" text-anchor="start" fill="#666666" font-weight="normal">1600 C</text><text x="132" y="214.2" font-size="6.4" text-anchor="start" fill="#1565C0" font-weight="bold">polymer</text><text x="184" y="214.2" font-size="6.4" text-anchor="start" fill="#B66A00" font-weight="bold">metal</text><text x="224" y="214.2" font-size="6.4" text-anchor="start" fill="#00695C" font-weight="bold">ceramic</text><rect x="6.0" y="226.0" width="348.0" height="58.0" rx="5" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1"/><text x="180.0" y="240.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">why the order never changes</text><text x="180.0" y="254.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">van der Waals between chains, then metallic, then ionic and covalent: that is the order</text><text x="180.0" y="266.2" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">a ceramic is hard because a dislocation cannot move in a rigid ionic lattice</text><text x="180.0" y="277.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">and it is brittle for that same reason: a crack has nothing to blunt it</text><text x="180.0" y="297.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">A polymer above its ceiling softens or creeps, a metal above its ceiling oxidises</text><text x="180.0" y="309.5" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">and loses strength, a ceramic keeps its shape until it cracks without warning.</text></svg>