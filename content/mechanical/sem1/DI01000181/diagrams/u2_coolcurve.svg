<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="320" fill="#ffffff"/><text x="180.0" y="24.3" font-size="12.2" text-anchor="middle" fill="#222222" font-weight="bold">Cooling curves: pure metal and alloy</text><text x="180.0" y="40.2" font-size="9.2" text-anchor="middle" fill="#666666" font-weight="normal">temperature against time in a mould</text><path d="M46.0 236.0L46.0 54.0" fill="none" stroke="#222222" stroke-width="1.3" stroke-linecap="round"/><path d="M44.2 59.0L46.0 54.0L47.8 59.0Z" fill="#222222"/><path d="M46.0 236.0L340.0 236.0" fill="none" stroke="#222222" stroke-width="1.3" stroke-linecap="round"/><path d="M335.0 234.2L340.0 236.0L335.0 237.8Z" fill="#222222"/><path d="M46.0 236.0L46.0 239.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="46" y="251.9" font-size="8.2" text-anchor="middle" fill="#666666" font-weight="normal">0</text><path d="M118.0 236.0L118.0 239.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="118.0" y="251.9" font-size="8.2" text-anchor="middle" fill="#666666" font-weight="normal">1</text><path d="M190.0 236.0L190.0 239.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="190.0" y="251.9" font-size="8.2" text-anchor="middle" fill="#666666" font-weight="normal">2</text><path d="M262.0 236.0L262.0 239.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="262.0" y="251.9" font-size="8.2" text-anchor="middle" fill="#666666" font-weight="normal">3</text><path d="M334.0 236.0L334.0 239.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="334" y="251.9" font-size="8.2" text-anchor="middle" fill="#666666" font-weight="normal">4</text><path d="M43.0 236.0L46.0 236.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="41" y="241.5" font-size="8.2" text-anchor="end" fill="#666666" font-weight="normal">1300</text><path d="M43.0 191.5L46.0 191.5" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="41" y="197.0" font-size="8.2" text-anchor="end" fill="#666666" font-weight="normal">1400</text><path d="M43.0 147.0L46.0 147.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="41" y="152.5" font-size="8.2" text-anchor="end" fill="#666666" font-weight="normal">1500</text><path d="M43.0 102.5L46.0 102.5" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="41" y="108.0" font-size="8.2" text-anchor="end" fill="#666666" font-weight="normal">1600</text><path d="M43.0 58.0L46.0 58.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="41" y="63.5" font-size="8.2" text-anchor="end" fill="#666666" font-weight="normal">1700</text><text x="340" y="263.1" font-size="8.799999999999999" text-anchor="end" fill="#222222" font-weight="bold">time</text><text x="43" y="49.1" font-size="8.799999999999999" text-anchor="middle" fill="#222222" font-weight="bold">T (C)</text><path d="M46.0 130.1L132.4 130.1" fill="none" stroke="#9AA3AD" stroke-width="0.9" stroke-linecap="round" stroke-dasharray="3,3"/><path d="M46.0 66.9L120.9 138.1L132.4 130.1L230.3 130.1L334.0 187.1" fill="none" stroke="#1565C0" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"/><path d="M46.0 66.9L132.4 120.3L178.5 147.0L247.6 200.4L334.0 227.1" fill="none" stroke="#B66A00" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5,3"/><circle cx="120.9" cy="138.1" r="2.4" fill="#BD2543"/><text x="124.88" y="150.3" font-size="6.4" text-anchor="start" fill="#BD2543" font-weight="normal">undercooling</text><path d="M118.0 203.0L134.0 203.0" fill="none" stroke="#1565C0" stroke-width="2" stroke-linecap="round"/><text x="138" y="208.3" font-size="6.6" text-anchor="start" fill="#222222" font-weight="normal">pure metal: flat arrest at 1538 C</text><path d="M118.0 219.0L134.0 219.0" fill="none" stroke="#B66A00" stroke-width="2" stroke-linecap="round" stroke-dasharray="5,3"/><text x="138" y="224.3" font-size="6.6" text-anchor="start" fill="#222222" font-weight="normal">alloy: liquidus to solidus, 1500 to 1380 C</text><text x="180.0" y="271.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">A pure metal releases its latent heat at one temperature, so the curve is flat </text><text x="180.0" y="283.5" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">for as long as the metal takes to freeze; an alloy releases it across a range.</text><text x="180.0" y="297.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">Read off the liquidus where the first solid appears and the solidus where the </text><text x="180.0" y="309.5" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">last liquid disappears - the gap between them is the freezing range.</text></svg>