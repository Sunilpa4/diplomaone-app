<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 290" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="290" fill="#ffffff"/><text x="180.0" y="24.3" font-size="12.2" text-anchor="middle" fill="#222222" font-weight="bold">Electroplating: nickel anode, work cathode</text><text x="180.0" y="40.2" font-size="9.2" text-anchor="middle" fill="#666666" font-weight="normal">the metal moves atom by atom</text><path d="M52.0 58.0L308.0 58.0L308.0 176.0L52.0 176.0Z" fill="#F7FBFF" stroke="#222222" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><path d="M55.0 84.0L305.0 84.0L305.0 173.0L55.0 173.0Z" fill="#DCEEFB" stroke="#1565C0" stroke-width="0.0" stroke-linejoin="round" stroke-linecap="round"/><path d="M92.0 76.0L104.0 76.0L104.0 160.0L92.0 160.0Z" fill="#F6E3C5" stroke="#B66A00" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M250.0 76.0L262.0 76.0L262.0 160.0L250.0 160.0Z" fill="#E7EDF3" stroke="#9AA3AD" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M243.0 76.0L250.0 76.0L250.0 160.0L243.0 160.0Z" fill="#D8EEDA" stroke="#2E7D32" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="98" y="56.2" font-size="6.4" text-anchor="middle" fill="#B66A00" font-weight="bold">anode (+)</text><text x="256" y="56.2" font-size="6.4" text-anchor="middle" fill="#222222" font-weight="bold">cathode (-)</text><text x="98" y="170.2" font-size="6.2" text-anchor="middle" fill="#B66A00" font-weight="normal">nickel</text><text x="256" y="170.2" font-size="6.2" text-anchor="middle" fill="#222222" font-weight="normal">work</text><text x="240" y="144.1" font-size="6.0" text-anchor="end" fill="#2E7D32" font-weight="normal">deposit</text><path d="M98.0 76.0L98.0 44.0" fill="none" stroke="#222222" stroke-width="1.3" stroke-linecap="round"/><path d="M256.0 76.0L256.0 44.0" fill="none" stroke="#222222" stroke-width="1.3" stroke-linecap="round"/><path d="M98.0 44.0L166.0 44.0" fill="none" stroke="#222222" stroke-width="1.3" stroke-linecap="round"/><path d="M188.0 44.0L256.0 44.0" fill="none" stroke="#222222" stroke-width="1.3" stroke-linecap="round"/><path d="M170.0 36.0L170.0 52.0" fill="none" stroke="#222222" stroke-width="1.8" stroke-linecap="round"/><path d="M180.0 40.0L180.0 48.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="175" y="57.2" font-size="6.2" text-anchor="middle" fill="#222" font-weight="bold">d.c. supply</text><text x="175" y="98.5" font-size="7.0" text-anchor="middle" fill="#1565C0" font-weight="bold">Ni2+</text><circle cx="128.0" cy="112.0" r="1.6" fill="#1565C0"/><circle cx="140.0" cy="132.0" r="1.6" fill="#1565C0"/><circle cx="132.0" cy="150.0" r="1.6" fill="#1565C0"/><circle cx="158.0" cy="112.0" r="1.6" fill="#1565C0"/><circle cx="168.0" cy="132.0" r="1.6" fill="#1565C0"/><circle cx="162.0" cy="150.0" r="1.6" fill="#1565C0"/><circle cx="188.0" cy="112.0" r="1.6" fill="#1565C0"/><circle cx="196.0" cy="132.0" r="1.6" fill="#1565C0"/><circle cx="192.0" cy="150.0" r="1.6" fill="#1565C0"/><circle cx="218.0" cy="112.0" r="1.6" fill="#1565C0"/><circle cx="224.0" cy="132.0" r="1.6" fill="#1565C0"/><circle cx="222.0" cy="150.0" r="1.6" fill="#1565C0"/><path d="M196.0 120.0L238.0 120.0" fill="none" stroke="#1565C0" stroke-width="1.0" stroke-linecap="round"/><path d="M234.0 118.6L238.0 120.0L234.0 121.4Z" fill="#1565C0"/><text x="175" y="190.2" font-size="6.2" text-anchor="middle" fill="#222222" font-weight="normal">electrolyte: NiSO4 + NiCl2 + boric acid</text><rect x="6.0" y="196.0" width="348.0" height="58.0" rx="5" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1"/><text x="180.0" y="210.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Faraday's law is the whole calculation</text><text x="180.0" y="224.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">1 ampere-hour deposits 1.095 g of nickel: m = M I t /(n F) = 58.7/(2 x 96500)</text><text x="180.0" y="236.2" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">300 A/m2 for 20 min at 95 % efficiency gives 11.7 micron of nickel</text><text x="180.0" y="247.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">throwing power: chromium covers a recess badly, cyanide zinc covers it well</text><text x="180.0" y="271.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">The anode dissolves as the cathode grows, so the bath keeps its metal;</text><text x="180.0" y="283.5" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">only the addition agent decides bright or dull, hard or soft.</text></svg>