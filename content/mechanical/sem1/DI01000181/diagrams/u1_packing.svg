<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="330" fill="#ffffff"/><text x="180.0" y="24.3" font-size="12.2" text-anchor="middle" fill="#222222" font-weight="bold">Packing fraction of the four structures</text><text x="180.0" y="40.2" font-size="9.2" text-anchor="middle" fill="#666666" font-weight="normal">fraction of the cell filled by atoms</text><path d="M62.0 196.0L344.0 196.0" fill="none" stroke="#222222" stroke-width="1.3" stroke-linecap="round"/><path d="M62.0 196.0L62.0 84.0" fill="none" stroke="#222222" stroke-width="1.3" stroke-linecap="round"/><text x="62" y="78.5" font-size="7.2" text-anchor="start" fill="#222" font-weight="bold">APF</text><path d="M57.0 196.0L62.0 196.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="53" y="200.9" font-size="6.6" text-anchor="end" fill="#666666" font-weight="normal">0.0</text><path d="M57.0 146.0L62.0 146.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="53" y="150.9" font-size="6.6" text-anchor="end" fill="#666666" font-weight="normal">0.5</text><path d="M57.0 96.0L62.0 96.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="53" y="100.9" font-size="6.6" text-anchor="end" fill="#666666" font-weight="normal">1.0</text><rect x="80" y="143.6" width="44" height="52.4" rx="2" fill="#666666" fill-opacity="0.28" stroke="#666666" stroke-width="1.3"/><text x="102" y="138.2" font-size="7.4" text-anchor="middle" fill="#666666" font-weight="bold">0.52</text><text x="102" y="211.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="bold">SC</text><text x="102" y="222.1" font-size="5.9" text-anchor="middle" fill="#666666" font-weight="normal">polonium only</text><rect x="146" y="128.0" width="44" height="68.0" rx="2" fill="#1565C0" fill-opacity="0.28" stroke="#1565C0" stroke-width="1.3"/><text x="168" y="122.6" font-size="7.4" text-anchor="middle" fill="#1565C0" font-weight="bold">0.68</text><text x="168" y="211.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="bold">BCC</text><text x="168" y="222.1" font-size="5.9" text-anchor="middle" fill="#666666" font-weight="normal">Fe-alpha, Cr</text><rect x="212" y="121.9" width="44" height="74.1" rx="2" fill="#2E7D32" fill-opacity="0.28" stroke="#2E7D32" stroke-width="1.3"/><text x="234" y="116.5" font-size="7.4" text-anchor="middle" fill="#2E7D32" font-weight="bold">0.74</text><text x="234" y="211.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="bold">FCC</text><text x="234" y="222.1" font-size="5.9" text-anchor="middle" fill="#666666" font-weight="normal">Cu, Al, Ni</text><rect x="278" y="121.9" width="44" height="74.1" rx="2" fill="#B66A00" fill-opacity="0.28" stroke="#B66A00" stroke-width="1.3"/><text x="300" y="116.5" font-size="7.4" text-anchor="middle" fill="#B66A00" font-weight="bold">0.74</text><text x="300" y="211.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="bold">HCP</text><text x="300" y="222.1" font-size="5.9" text-anchor="middle" fill="#666666" font-weight="normal">Mg, Zn, Ti</text><rect x="6.0" y="236.0" width="348.0" height="52.0" rx="5" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1"/><text x="180.0" y="250.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">where the numbers come from</text><text x="180.0" y="264.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">BCC: a = 4R/sqrt(3), n = 2 -&gt; APF = pi sqrt(3)/8 = 0.68</text><text x="180.0" y="276.2" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">FCC: a = 2 sqrt(2) R, n = 4 -&gt; APF = pi/(3 sqrt(2)) = 0.74</text><text x="180.0" y="287.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">HCP: c/a = 1.633, n = 6 -&gt; the same 0.74, the close-packed value</text><text x="180.0" y="311.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">Denser packing means a higher density and less empty space for carbon to sit in -</text><text x="180.0" y="323.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">the reason FCC iron dissolves more carbon than BCC iron.</text></svg>