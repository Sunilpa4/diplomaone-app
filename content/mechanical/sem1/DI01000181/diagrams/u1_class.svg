<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 310" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="310" fill="#ffffff"/><text x="180.0" y="24.3" font-size="12.2" text-anchor="middle" fill="#222222" font-weight="bold">Classification of engineering materials</text><text x="180.0" y="40.2" font-size="9.2" text-anchor="middle" fill="#666666" font-weight="normal">four families, and two modern additions</text><rect x="6.0" y="46.0" width="108.0" height="92.0" rx="6" fill="#FBFCFD" stroke="#9AA3AD" stroke-width="0.9"/><text x="60" y="65.0" font-size="8.6" text-anchor="middle" fill="#1565C0" font-weight="bold">METALS</text><text x="60" y="80.2" font-size="6.2" text-anchor="middle" fill="#666666" font-weight="normal">ferrous: steel,</text><text x="60" y="91.2" font-size="6.2" text-anchor="middle" fill="#666666" font-weight="normal">cast iron</text><text x="60" y="102.2" font-size="6.2" text-anchor="middle" fill="#666666" font-weight="normal">non-ferrous: Cu, Al,</text><text x="60" y="113.2" font-size="6.2" text-anchor="middle" fill="#666666" font-weight="normal">brass, bronze</text><rect x="126.0" y="46.0" width="108.0" height="92.0" rx="6" fill="#FBFCFD" stroke="#9AA3AD" stroke-width="0.9"/><text x="180" y="65.0" font-size="8.6" text-anchor="middle" fill="#B66A00" font-weight="bold">CERAMICS</text><text x="180" y="80.2" font-size="6.2" text-anchor="middle" fill="#666666" font-weight="normal">alumina, silicon</text><text x="180" y="91.2" font-size="6.2" text-anchor="middle" fill="#666666" font-weight="normal">carbide, refractories</text><text x="180" y="102.2" font-size="6.2" text-anchor="middle" fill="#666666" font-weight="normal">glass, cement</text><rect x="246.0" y="46.0" width="108.0" height="92.0" rx="6" fill="#FBFCFD" stroke="#9AA3AD" stroke-width="0.9"/><text x="300" y="65.0" font-size="8.6" text-anchor="middle" fill="#2E7D32" font-weight="bold">POLYMERS</text><text x="300" y="80.2" font-size="6.2" text-anchor="middle" fill="#666666" font-weight="normal">thermoplastic:</text><text x="300" y="91.2" font-size="6.2" text-anchor="middle" fill="#666666" font-weight="normal">PE, PVC, nylon</text><text x="300" y="102.2" font-size="6.2" text-anchor="middle" fill="#666666" font-weight="normal">thermoset:</text><text x="300" y="113.2" font-size="6.2" text-anchor="middle" fill="#666666" font-weight="normal">epoxy, bakelite</text><rect x="66.0" y="148.0" width="228.0" height="56.0" rx="6" fill="#FBFCFD" stroke="#9AA3AD" stroke-width="0.9"/><text x="180" y="167.0" font-size="8.6" text-anchor="middle" fill="#7B2CD9" font-weight="bold">COMPOSITES</text><text x="180" y="182.2" font-size="6.4" text-anchor="middle" fill="#666666" font-weight="normal">fibre + matrix: CFRP, GFRP, MMC, cermet, plywood</text><text x="180" y="196.2" font-size="6.2" text-anchor="middle" fill="#666666" font-weight="normal">the fibre carries the load, the matrix holds and protects it</text><rect x="6.0" y="214.0" width="348.0" height="56.0" rx="5" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1"/><text x="180.0" y="228.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">the two modern additions</text><text x="180.0" y="242.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">semiconductors: silicon, germanium - conductivity between metal and insulator</text><text x="180.0" y="254.2" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">smart materials: shape-memory alloy, piezoelectric, magnetostrictive</text><text x="180.0" y="265.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">a part is chosen from a family by its property, then by cost and process</text><text x="180.0" y="289.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">The same part can be made from four different families: a gear may be steel,</text><text x="180.0" y="301.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">sintered ceramic, nylon or a carbon composite - the duty decides which one.</text></svg>