oke-linecap="round"/><path d="M320.2 115.0L315.6 126.9L298.5 124.3L289.2 115.0L297.8 104.8L313.7 105.5Z" fill="#EEF3F7" stroke="#222222" stroke-width="0.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M348.4 115.0L340.7 124.2L325.5 124.8L314.6 115.0L325.6 105.4L342.1 104.1Z" fill="#F3F6F9" stroke="#222222" stroke-width="0.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="274.0" cy="78.0" r="4.6" fill="#2E3339" stroke="#222222" stroke-width="1.2"/><circle cx="302.0" cy="78.0" r="4.6" fill="#2E3339" stroke="#222222" stroke-width="1.2"/><circle cx="330.0" cy="78.0" r="4.6" fill="#2E3339" stroke="#222222" stroke-width="1.2"/><circle cx="274.0" cy="108.0" r="4.6" fill="#2E3339" stroke="#222222" stroke-width="1.2"/><circle cx="302.0" cy="108.0" r="4.6" fill="#2E3339" stroke="#222222" stroke-width="1.2"/><text x="306" y="139.0" font-size="5.6" text-anchor="middle" fill="#666666" font-weight="normal">nodules of graphite</text><text x="306" y="148.0" font-size="5.6" text-anchor="middle" fill="#666666" font-weight="normal">400 - 600 MPa</text><rect x="6.0" y="158.0" width="348.0" height="68.0" rx="5" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1"/><text x="180.0" y="172.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">how the graphite got that shape</text><text x="180.0" y="186.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">grey: slow cooling in a sand mould lets carbon come out as flakes</text><text x="180.0" y="198.2" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">white: fast cooling or low silicon keeps carbon in cementite - hard, unmachinable</text><text x="180.0" y="209.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">malleable: white iron is annealed, the cementite decomposes into temper carbon</text><text x="180.0" y="221.2" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">ductile: a little magnesium or cerium is added, so the graphite grows as nodules</text><text x="180.0" y="239.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">A flake acts like a crack, so grey iron is weak in tension but excellent in</text><text x="180.0" y="251.5" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">compression and damping - machine beds, housings and manhole covers.</text><text x="180.0" y="267.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">A nodule does not, so ductile iron reaches 600 MPa with 15 % elongation and</text><text x="180.0" y="279.5" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">replaces steel castings: crankshafts, gears, pipe and wagon wheels.</text></svg>