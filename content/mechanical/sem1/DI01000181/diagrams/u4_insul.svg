<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 310" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="310" fill="#ffffff"/><text x="180.0" y="24.3" font-size="12.2" text-anchor="middle" fill="#222222" font-weight="bold">Dielectric strength and the thickness it needs</text><text x="180.0" y="40.2" font-size="9.2" text-anchor="middle" fill="#666666" font-weight="normal">breakdown voltage per mm</text><text x="98" y="64.4" font-size="6.8" text-anchor="end" fill="#222" font-weight="normal">air</text><path d="M104.0 54.5L127.1 54.5L127.1 62.5L104.0 62.5Z" fill="#E9EDF1" stroke="#666666" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><text x="132.0769230769231" y="64.2" font-size="6.4" text-anchor="start" fill="#666666" font-weight="normal">3</text><text x="98" y="83.4" font-size="6.8" text-anchor="end" fill="#222" font-weight="normal">transformer oil</text><path d="M104.0 73.5L196.3 73.5L196.3 81.5L104.0 81.5Z" fill="#DCEEFB" stroke="#1565C0" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><text x="201.30769230769232" y="83.2" font-size="6.4" text-anchor="start" fill="#666666" font-weight="normal">12</text><text x="98" y="102.4" font-size="6.8" text-anchor="end" fill="#222" font-weight="normal">window glass</text><path d="M104.0 92.5L211.7 92.5L211.7 100.5L104.0 100.5Z" fill="#DCEEFB" stroke="#1565C0" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><text x="216.69230769230768" y="102.2" font-size="6.4" text-anchor="start" fill="#666666" font-weight="normal">14</text><text x="98" y="121.4" font-size="6.8" text-anchor="end" fill="#222" font-weight="normal">porcelain</text><path d="M104.0 111.5L219.4 111.5L219.4 119.5L104.0 119.5Z" fill="#D8EDEA" stroke="#00695C" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><text x="224.38461538461536" y="121.2" font-size="6.4" text-anchor="start" fill="#666666" font-weight="normal">15</text><text x="98" y="140.4" font-size="6.8" text-anchor="end" fill="#222" font-weight="normal">bakelite</text><path d="M104.0 130.5L242.5 130.5L242.5 138.5L104.0 138.5Z" fill="#F6E3C5" stroke="#B66A00" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><text x="247.46153846153845" y="140.2" font-size="6.4" text-anchor="start" fill="#666666" font-weight="normal">18</text><text x="98" y="159.4" font-size="6.8" text-anchor="end" fill="#222" font-weight="normal">epoxy resin</text><path d="M104.0 149.5L257.8 149.5L257.8 157.5L104.0 157.5Z" fill="#F6E3C5" stroke="#B66A00" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><text x="262.84615384615387" y="159.2" font-size="6.4" text-anchor="start" fill="#666666" font-weight="normal">20</text><text x="98" y="178.4" font-size="6.8" text-anchor="end" fill="#222" font-weight="normal">PTFE</text><path d="M104.0 168.5L288.6 168.5L288.6 176.5L104.0 176.5Z" fill="#EFE4FB" stroke="#7B2CD9" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><text x="293.61538461538464" y="178.2" font-size="6.4" text-anchor="start" fill="#666666" font-weight="normal">24</text><text x="98" y="197.2" font-size="6.4" text-anchor="end" fill="#666666" font-weight="bold">kV/mm</text><rect x="6.0" y="206.0" width="348.0" height="68.0" rx="5" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1"/><text x="180.0" y="220.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">an insulator is a material, not a gap</text><text x="180.0" y="234.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">an insulator is judged by resistivity above 1e8 ohm m and by this breakdown figure</text><text x="180.0" y="246.2" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">thermal insulation is a different job: glass wool 0.04, aerogel 0.015 W/m K</text><text x="180.0" y="257.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">porcelain outdoor: a long creepage path, and it dries itself when it wets</text><text x="180.0" y="269.2" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">moisture, heat and time all lower the figure, so the test is done in kV/mm</text><text x="180.0" y="291.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">3 mm of bakelite at 18 kV/mm holds 54 kV; an 11 kV busbar with a factor of</text><text x="180.0" y="303.5" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">three needs 33 kV, so 2.75 mm - and 3 mm is what the drawing calls out.</text></svg>