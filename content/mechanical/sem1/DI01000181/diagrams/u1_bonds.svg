<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 344" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="344" fill="#ffffff"/><text x="180.0" y="24.3" font-size="12.2" text-anchor="middle" fill="#222222" font-weight="bold">The five kinds of bond</text><text x="180.0" y="40.2" font-size="9.2" text-anchor="middle" fill="#666666" font-weight="normal">where the electrons go decides everything else</text><rect x="6.0" y="44.0" width="108.0" height="124.0" rx="6" fill="#FBFCFD" stroke="#9AA3AD" stroke-width="0.9"/><text x="60.0" y="61.5" font-size="7.2" text-anchor="middle" fill="#1565C0" font-weight="bold">ELECTROVALENT</text><text x="60.0" y="72.2" font-size="6.2" text-anchor="middle" fill="#666666" font-weight="normal">electron transferred</text><rect x="126.0" y="44.0" width="108.0" height="124.0" rx="6" fill="#FBFCFD" stroke="#9AA3AD" stroke-width="0.9"/><text x="180.0" y="61.5" font-size="7.2" text-anchor="middle" fill="#2E7D32" font-weight="bold">COVALENT</text><text x="180.0" y="72.2" font-size="6.2" text-anchor="middle" fill="#666666" font-weight="normal">electrons shared</text><rect x="246.0" y="44.0" width="108.0" height="124.0" rx="6" fill="#FBFCFD" stroke="#9AA3AD" stroke-width="0.9"/><text x="300.0" y="61.5" font-size="7.2" text-anchor="middle" fill="#B66A00" font-weight="bold">COORDINATE</text><text x="300.0" y="72.2" font-size="6.2" text-anchor="middle" fill="#666666" font-weight="normal">one atom donates both</text><circle cx="38.0" cy="92.0" r="10.0" fill="#FFF2E0" stroke="#222222" stroke-width="1.2"/><text x="38" y="99.3" font-size="10.5" text-anchor="middle" fill="#222222" font-weight="bold">Na</text><circle cx="84.0" cy="92.0" r="12.0" fill="#E8F1FE" stroke="#222222" stroke-width="1.2"/><text x="84" y="100.7" font-size="12.600000000000001" text-anchor="middle" fill="#222222" font-weight="bold">Cl</text><circle cx="62.0" cy="106.0" r="2.4" fill="#BD2543"/><path d="M56.0 106.0L74.0 106.0" fill="none" stroke="#BD2543" stroke-width="1.1" stroke-linecap="round"/><path d="M70.0 104.6L74.0 106.0L70.0 107.4Z" fill="#BD2543"/><text x="38" y="118.3" font-size="6.6" text-anchor="middle" fill="#BD2543" font-weight="normal">Na+</text><text x="84" y="120.3" font-size="6.6" text-anchor="middle" fill="#1565C0" font-weight="normal">Cl-</text><text x="60" y="144.1" font-size="6.0" text-anchor="middle" fill="#666666" font-weight="normal">ions held by attraction</text><text x="60" y="154.1" font-size="6.0" text-anchor="middle" fill="#666666" font-weight="normal">hard, brittle, soluble</text><circle cx="152.0" cy="92.0" r="11.0" fill="#EAF6EC" stroke="#222222" stroke-width="1.2"/><circle cx="188.0" cy="92.0" r="11.0" fill="#EAF6EC" stroke="#222222" stroke-width="1.2"/><circle cx="166.0" cy="88.0" r="2.2" fill="#2E7D32"/><circle cx="174.0" cy="96.0" r="2.2" fill="#2E7D32"/><text x="170" y="118.1" font-size="6.0" text-anchor="middle" fill="#666666" font-weight="normal">H - H, C - C, Si - O</text><text x="170" y="144.1" font-size="6.0" text-anchor="middle" fill="#666666" font-weight="normal">strong, directional,</text><text x="170" y="154.1" font-size="6.0" text-anchor="middle" fill="#666666" font-weight="normal">hard, high melting</text><circle cx="272.0" cy="92.0" r="11.0" fill="#FFF3E3" stroke="#222222" stroke-width="1.2"/><text x="272" y="100.0" font-size="11.55" text-anchor="middle" fill="#222222" font-weight="bold">N</text><circle cx="308.0" cy="92.0" r="11.0" fill="#FFF3E3" stroke="#222222" stroke-width="1.2"/><text x="308" y="100.0" font-size="11.55" text-anchor="middle" fill="#222222" font-weight="bold">B</text><circle cx="284.0" cy="88.0" r="2.2" fill="#B66A00"/><circle cx="284.0" cy="96.0" r="2.2" fill="#B66A00"/><path d="M288.0 92.0L297.0 92.0" fill="none" stroke="#B66A00" stroke-width="1.1" stroke-linecap="round"/><path d="M293.0 90.6L297.0 92.0L293.0 93.4Z" fill="#B66A00"/><text x="290" y="118.1" font-size="6.0" text-anchor="middle" fill="#666666" font-weight="normal">NH3 -&gt; BF3</text><text x="290" y="144.1" font-size="6.0" text-anchor="middle" fill="#666666" font-weight="normal">both electrons from</text><text x="290" y="154.1" font-size="6.0" text-anchor="middle" fill="#666666" font-weight="normal">the same atom</text><rect x="66.0" y="176.0" width="108.0" height="124.0" rx="6" fill="none" stroke="#9AA3AD" stroke-width="0.9"/><text x="120" y="193.5" font-size="7.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">HYDROGEN</text><text x="120" y="204.2" font-size="6.2" text-anchor="middle" fill="#666666" font-weight="normal">a bridge between molecules</text><circle cx="96.0" cy="226.0" r="9.0" fill="#EDE7FB" stroke="#222222" stroke-width="1.2"/><text x="96" y="232.5" font-size="9.450000000000001" text-anchor="middle" fill="#222222" font-weight="bold">O</text><circle cx="84.0" cy="212.0" r="5.0" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/><text x="84" y="215.6" font-size="5.25" text-anchor="middle" fill="#222222" font-weight="bold">H</text><circle cx="108.0" cy="212.0" r="5.0" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/><text x="108" y="215.6" font-size="5.25" text-anchor="middle" fill="#222222" font-weight="bold">H</text><circle cx="150.0" cy="226.0" r="9.0" fill="#EDE7FB" stroke="#222222" stroke-width="1.2"/><text x="150" y="232.5" font-size="9.450000000000001" text-anchor="middle" fill="#222222" font-weight="bold">O</text><circle cx="138.0" cy="212.0" r="5.0" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/><text x="138" y="215.6" font-size="5.25" text-anchor="middle" fill="#222222" font-weight="bold">H</text><circle cx="162.0" cy="212.0" r="5.0" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/><text x="162" y="215.6" font-size="5.25" text-anchor="middle" fill="#222222" font-weight="bold">H</text><path d="M105.0 226.0L141.0 226.0" fill="none" stroke="#7B2CD9" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2,2"/><text x="120" y="250.2" font-size="6.4" text-anchor="middle" fill="#7B2CD9" font-weight="normal">O - H ... O</text><text x="120" y="266.1" font-size="6.0" text-anchor="middle" fill="#666666" font-weight="normal">weak, 20 kJ/mol</text><text x="120" y="277.1" font-size="6.0" text-anchor="middle" fill="#666666" font-weight="normal">ice, water, DNA</text><rect x="192.0" y="176.0" width="108.0" height="124.0" rx="6" fill="none" stroke="#9AA3AD" stroke-width="0.9"/><text x="246" y="193.5" font-size="7.2" text-anchor="middle" fill="#00695C" font-weight="bold">METALLIC</text><text x="246" y="204.2" font-size="6.2" text-anchor="middle" fill="#666666" font-weight="normal">electrons pooled</text><rect x="204" y="212" width="84" height="52" rx="4" fill="#E6F2F1" stroke="#00695C" stroke-width="1"/><circle cx="218.0" cy="226.0" r="6.0" fill="#D6EAE8" stroke="#00695C" stroke-width="1.2"/><text x="218" y="230.3" font-size="6.0" text-anchor="middle" fill="#00695C" font-weight="bold">+</text><circle cx="218.0" cy="248.0" r="6.0" fill="#D6EAE8" stroke="#00695C" stroke-width="1.2"/><text x="218" y="252.3" font-size="6.0" text-anchor="middle" fill="#00695C" font-weight="bold">+</text><circle cx="236.0" cy="226.0" r="6.0" fill="#D6EAE8" stroke="#00695C" stroke-width="1.2"/><text x="236" y="230.3" font-size="6.0" text-anchor="middle" fill="#00695C" font-weight="bold">+</text><circle cx="236.0" cy="248.0" r="6.0" fill="#D6EAE8" stroke="#00695C" stroke-width="1.2"/><text x="236" y="252.3" font-size="6.0" text-anchor="middle" fill="#00695C" font-weight="bold">+</text><circle cx="254.0" cy="226.0" r="6.0" fill="#D6EAE8" stroke="#00695C" stroke-width="1.2"/><text x="254" y="230.3" font-size="6.0" text-anchor="middle" fill="#00695C" font-weight="bold">+</text><circle cx="254.0" cy="248.0" r="6.0" fill="#D6EAE8" stroke="#00695C" stroke-width="1.2"/><text x="254" y="252.3" font-size="6.0" text-anchor="middle" fill="#00695C" font-weight="bold">+</text><circle cx="272.0" cy="226.0" r="6.0" fill="#D6EAE8" stroke="#00695C" stroke-width="1.2"/><text x="272" y="230.3" font-size="6.0" text-anchor="middle" fill="#00695C" font-weight="bold">+</text><circle cx="272.0" cy="248.0" r="6.0" fill="#D6EAE8" stroke="#00695C" stroke-width="1.2"/><text x="272" y="252.3" font-size="6.0" text-anchor="middle" fill="#00695C" font-weight="bold">+</text><circle cx="209.0" cy="216.0" r="1.7" fill="#1565C0"/><circle cx="232.0" cy="233.0" r="1.7" fill="#1565C0"/><circle cx="255.0" cy="250.0" r="1.7" fill="#1565C0"/><circle cx="278.0" cy="223.0" r="1.7" fill="#1565C0"/><circle cx="225.0" cy="240.0" r="1.7" fill="#1565C0"/><circle cx="248.0" cy="257.0" r="1.7" fill="#1565C0"/><circle cx="271.0" cy="230.0" r="1.7" fill="#1565C0"/><circle cx="218.0" cy="247.0" r="1.7" fill="#1565C0"/><circle cx="241.0" cy="220.0" r="1.7" fill="#1565C0"/><circle cx="264.0" cy="237.0" r="1.7" fill="#1565C0"/><circle cx="211.0" cy="254.0" r="1.7" fill="#1565C0"/><circle cx="234.0" cy="227.0" r="1.7" fill="#1565C0"/><circle cx="257.0" cy="244.0" r="1.7" fill="#1565C0"/><circle cx="280.0" cy="217.0" r="1.7" fill="#1565C0"/><text x="246" y="278.1" font-size="6.0" text-anchor="middle" fill="#666666" font-weight="normal">free electrons give</text><text x="246" y="289.1" font-size="6.0" text-anchor="middle" fill="#666666" font-weight="normal">conduction and ductility</text><text x="180.0" y="323.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">Read the group in one line: transferred gives brittle salts, shared gives hard</text><text x="180.0" y="335.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">solids, pooled gives workable metals, and hydrogen gives low melting points.</text></svg>