<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 256" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="256" fill="#ffffff"/><text x="180.0" y="24.3" font-size="12.2" text-anchor="middle" fill="#222222" font-weight="bold">A paint system in section, on a blasted steel plate</text><text x="180.0" y="40.2" font-size="9.2" text-anchor="middle" fill="#666666" font-weight="normal">four coats, each with a job</text><rect x="46.0" y="52.0" width="190.0" height="16.0" fill="#DCEEFB" stroke="#1565C0" stroke-width="1.1"/><text x="141.0" y="64.6" font-size="6.4" text-anchor="middle" fill="#1565C0" font-weight="normal">topcoat: colour and weather, 40 um</text><rect x="46.0" y="68.0" width="190.0" height="22.0" fill="#E8F3E9" stroke="#2E7D32" stroke-width="1.1"/><text x="141.0" y="83.6" font-size="6.4" text-anchor="middle" fill="#2E7D32" font-weight="normal">intermediate: build and barrier, 100 um</text><rect x="46.0" y="90.0" width="190.0" height="20.0" fill="#F6E3C5" stroke="#B66A00" stroke-width="1.1"/><text x="141.0" y="104.6" font-size="6.4" text-anchor="middle" fill="#B66A00" font-weight="normal">zinc-rich primer: adhesion and protection, 75 um</text><rect x="46.0" y="110.0" width="190.0" height="46.0" fill="#E7EDF3" stroke="#9AA3AD" stroke-width="1.1"/><text x="141.0" y="137.6" font-size="6.4" text-anchor="middle" fill="#9AA3AD" font-weight="normal">steel, blast cleaned to Sa 2 1/2</text><path d="M236.0 60.0L244.0 60.0" fill="none" stroke="#9AA3AD" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="2,2"/><circle cx="236.0" cy="60.0" r="1.5" fill="#9AA3AD"/><text x="248" y="65.2" font-size="6.2" text-anchor="start" fill="#1565C0" font-weight="normal">UV, rain</text><path d="M236.0 92.0L244.0 92.0" fill="none" stroke="#9AA3AD" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="2,2"/><circle cx="236.0" cy="92.0" r="1.5" fill="#9AA3AD"/><text x="248" y="97.2" font-size="6.2" text-anchor="start" fill="#2E7D32" font-weight="normal">oxygen and water</text><path d="M236.0 118.0L244.0 118.0" fill="none" stroke="#9AA3AD" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="2,2"/><circle cx="236.0" cy="118.0" r="1.5" fill="#9AA3AD"/><text x="248" y="123.2" font-size="6.2" text-anchor="start" fill="#B66A00" font-weight="normal">rust if it gets in</text><text x="248" y="150.2" font-size="6.4" text-anchor="start" fill="#222" font-weight="bold">215 um total</text><rect x="6.0" y="164.0" width="348.0" height="58.0" rx="5" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1"/><text x="180.0" y="178.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">the specification, written in three numbers</text><text x="180.0" y="192.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">blast to Sa 2 1/2 with a 50 - 75 um profile: that profile is what the paint grips</text><text x="180.0" y="204.2" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">wet film = dry film x 100/% solids: 75 um dry at 60 % solids is 125 um wet</text><text x="180.0" y="215.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">120 m2 at 75 um with 60 % solids needs 15 litres, and 17.3 with a 15 % loss</text><text x="180.0" y="239.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">Paint is a system of coats, each with its own job, and 80 % of the failures are</text><text x="180.0" y="251.5" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">preparation failures: the film let go of the steel, it did not wear out.</text></svg>