<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 372" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="372" fill="#ffffff"/><text x="180.0" y="24.3" font-size="12.2" text-anchor="middle" fill="#222222" font-weight="bold">Copper and its alloys</text><text x="180.0" y="40.2" font-size="9.2" text-anchor="middle" fill="#666666" font-weight="normal">strength bought with conductivity</text><text x="6" y="68.5" font-size="7.0" text-anchor="start" fill="#222" font-weight="bold">copper 99.9 %</text><text x="6" y="76.0" font-size="5.6" text-anchor="start" fill="#666666" font-weight="normal">Cu</text><path d="M112.0 55.0L185.3 55.0L185.3 67.0L112.0 67.0Z" fill="#F7C88A" stroke="#B66A00" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/><text x="189.33333333333331" y="67.2" font-size="6.4" text-anchor="start" fill="#222222" font-weight="normal">220 MPa</text><text x="352" y="67.2" font-size="6.2" text-anchor="end" fill="#1565C0" font-weight="normal">100 % IACS</text><text x="6" y="102.5" font-size="7.0" text-anchor="start" fill="#222" font-weight="bold">brass 70/30</text><text x="6" y="110.0" font-size="5.6" text-anchor="start" fill="#666666" font-weight="normal">Cu 70, Zn 30</text><path d="M112.0 89.0L228.7 89.0L228.7 101.0L112.0 101.0Z" fill="#F7C88A" stroke="#B66A00" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/><text x="232.66666666666669" y="101.2" font-size="6.4" text-anchor="start" fill="#222222" font-weight="normal">350 MPa</text><text x="352" y="101.2" font-size="6.2" text-anchor="end" fill="#1565C0" font-weight="normal">28 % IACS</text><text x="6" y="136.4" font-size="7.0" text-anchor="start" fill="#222" font-weight="bold">brass 60/40</text><text x="6" y="144.0" font-size="5.6" text-anchor="start" fill="#666666" font-weight="normal">Cu 60, Zn 40</text><path d="M112.0 123.0L252.0 123.0L252.0 135.0L112.0 135.0Z" fill="#F7C88A" stroke="#B66A00" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/><text x="256.0" y="135.2" font-size="6.4" text-anchor="start" fill="#222222" font-weight="normal">420 MPa</text><text x="352" y="135.2" font-size="6.2" text-anchor="end" fill="#1565C0" font-weight="normal">26 % IACS</text><text x="6" y="170.4" font-size="7.0" text-anchor="start" fill="#222" font-weight="bold">bronze</text><text x="6" y="178.0" font-size="5.6" text-anchor="start" fill="#666666" font-weight="normal">Cu 90, Sn 10</text><path d="M112.0 157.0L218.7 157.0L218.7 169.0L112.0 169.0Z" fill="#F7C88A" stroke="#B66A00" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/><text x="222.66666666666669" y="169.2" font-size="6.4" text-anchor="start" fill="#222222" font-weight="normal">320 MPa</text><text x="352" y="169.2" font-size="6.2" text-anchor="end" fill="#1565C0" font-weight="normal">13 % IACS</text><text x="6" y="204.4" font-size="7.0" text-anchor="start" fill="#222" font-weight="bold">gunmetal</text><text x="6" y="212.0" font-size="5.6" text-anchor="start" fill="#666666" font-weight="normal">Cu 88, Sn 10, Zn 2</text><path d="M112.0 191.0L205.3 191.0L205.3 203.0L112.0 203.0Z" fill="#F7C88A" stroke="#B66A00" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/><text x="209.33333333333331" y="203.2" font-size="6.4" text-anchor="start" fill="#222222" font-weight="normal">280 MPa</text><text x="352" y="203.2" font-size="6.2" text-anchor="end" fill="#1565C0" font-weight="normal">12 % IACS</text><path d="M6.0 232.0L352.0 232.0" fill="none" stroke="#9AA3AD" stroke-width="0.8" stroke-linecap="round"/><text x="6" y="246.2" font-size="6.2" text-anchor="start" fill="#666666" font-weight="normal">bar length = tensile strength;  the figure on the right is electrical</text><text x="6" y="256.2" font-size="6.2" text-anchor="start" fill="#666666" font-weight="normal">conductivity as % of the international annealed copper standard.</text><rect x="6.0" y="260.0" width="348.0" height="68.0" rx="5" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1"/><text x="180.0" y="274.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">which one to pick</text><text x="180.0" y="288.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">copper: busbars, windings, electrodes - conductivity first, strength second</text><text x="180.0" y="300.2" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">brass 70/30: deep drawing, cartridge cases, radiator fins - ductile and pretty</text><text x="180.0" y="311.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">brass 60/40: hot stamping, screws, free-cutting rod on a capstan lathe</text><text x="180.0" y="323.2" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">bronze and gunmetal: bearings, worm wheels, pump bodies, bells - wear and sea water</text><text x="180.0" y="339.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">Adding zinc raises strength but destroys conductivity, because the dissolved</text><text x="180.0" y="351.5" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">atoms scatter the free electrons; that trade-off decides every copper-alloy choice.</text></svg>