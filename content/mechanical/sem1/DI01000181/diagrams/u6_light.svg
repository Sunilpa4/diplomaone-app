<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 282" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="282" fill="#ffffff"/><text x="180.0" y="24.3" font-size="12.2" text-anchor="middle" fill="#222222" font-weight="bold">Specific strength: the fair comparison</text><text x="180.0" y="40.2" font-size="9.2" text-anchor="middle" fill="#666666" font-weight="normal">UTS divided by density, in kN m per kg</text><text x="120" y="64.2" font-size="6.4" text-anchor="end" fill="#222" font-weight="normal">mild steel</text><path d="M126.0 54.5L136.7 54.5L136.7 62.5L126.0 62.5Z" fill="#E9EDF1" stroke="#666666" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><text x="141.68" y="64.2" font-size="6.2" text-anchor="start" fill="#666666" font-weight="normal">57</text><text x="166.68" y="64.0" font-size="5.8" text-anchor="start" fill="#9AA3AD" font-weight="normal">rho 7.85</text><text x="120" y="84.2" font-size="6.4" text-anchor="end" fill="#222" font-weight="normal">aluminium 6061-T6</text><path d="M126.0 74.5L147.5 74.5L147.5 82.5L126.0 82.5Z" fill="#DCEEFB" stroke="#1565C0" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><text x="152.54736842105262" y="84.2" font-size="6.2" text-anchor="start" fill="#666666" font-weight="normal">115</text><text x="177.54736842105262" y="84.0" font-size="5.8" text-anchor="start" fill="#9AA3AD" font-weight="normal">rho 2.7</text><text x="120" y="104.2" font-size="6.4" text-anchor="end" fill="#222" font-weight="normal">magnesium AZ91</text><path d="M126.0 94.5L147.5 94.5L147.5 102.5L126.0 102.5Z" fill="#D8EDEA" stroke="#00695C" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><text x="152.54736842105262" y="104.2" font-size="6.2" text-anchor="start" fill="#666666" font-weight="normal">115</text><text x="177.54736842105262" y="104.0" font-size="5.8" text-anchor="start" fill="#9AA3AD" font-weight="normal">rho 1.74</text><text x="120" y="124.2" font-size="6.4" text-anchor="end" fill="#222" font-weight="normal">GFRP laminate</text><path d="M126.0 114.5L155.6 114.5L155.6 122.5L126.0 122.5Z" fill="#F6E3C5" stroke="#B66A00" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><text x="160.6042105263158" y="124.2" font-size="6.2" text-anchor="start" fill="#666666" font-weight="normal">158</text><text x="185.6042105263158" y="124.0" font-size="5.8" text-anchor="start" fill="#9AA3AD" font-weight="normal">rho 1.9</text><text x="120" y="144.2" font-size="6.4" text-anchor="end" fill="#222" font-weight="normal">titanium 6Al-4V</text><path d="M126.0 134.5L174.7 134.5L174.7 142.5L126.0 142.5Z" fill="#EFE4FB" stroke="#7B2CD9" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><text x="179.7157894736842" y="144.2" font-size="6.2" text-anchor="start" fill="#666666" font-weight="normal">260</text><text x="204.7157894736842" y="144.0" font-size="5.8" text-anchor="start" fill="#9AA3AD" font-weight="normal">rho 4.43</text><text x="120" y="164.2" font-size="6.4" text-anchor="end" fill="#222" font-weight="normal">CFRP laminate</text><path d="M126.0 154.5L301.8 154.5L301.8 162.5L126.0 162.5Z" fill="#F7DDE3" stroke="#BD2543" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><text x="306.75157894736844" y="164.2" font-size="6.2" text-anchor="start" fill="#666666" font-weight="normal">938</text><text x="331.75157894736844" y="164.0" font-size="5.8" text-anchor="start" fill="#9AA3AD" font-weight="normal">rho 1.6</text><rect x="6.0" y="190.0" width="348.0" height="58.0" rx="5" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1"/><text x="180.0" y="204.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">the same number, two engineering meanings</text><text x="180.0" y="218.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">lightweighting: 100 kg off a car is 0.4 kWh per 100 km less to move</text><text x="180.0" y="230.2" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">green: half the material is half the embodied energy and half the fuel</text><text x="180.0" y="241.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">but stiffness, not strength, decides a panel: CFRP needs a thicker section</text><text x="180.0" y="265.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">A moving part is judged by specific strength and a static part by stiffness, which</text><text x="180.0" y="277.5" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">is why the same two materials win in two different places on the same car.</text></svg>