<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 284" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="284" fill="#ffffff"/><text x="180.0" y="24.3" font-size="12.2" text-anchor="middle" fill="#222222" font-weight="bold">Mechanical finishing, and the roughness you buy</text><text x="180.0" y="40.2" font-size="9.2" text-anchor="middle" fill="#666666" font-weight="normal">each step roughly halves the roughness</text><text x="88" y="64.4" font-size="6.8" text-anchor="end" fill="#222" font-weight="normal">drilling</text><path d="M96.0 54.0L119.9 54.0L119.9 63.0L96.0 63.0Z" fill="#E9EDF1" stroke="#666666" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><text x="124.85469755445132" y="64.2" font-size="6.2" text-anchor="start" fill="#666666" font-weight="normal">6.3 um</text><text x="88" y="84.4" font-size="6.8" text-anchor="end" fill="#222" font-weight="normal">turning</text><path d="M96.0 74.0L143.4 74.0L143.4 83.0L96.0 83.0Z" fill="#DCEEFB" stroke="#1565C0" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><text x="148.4385257266603" y="84.2" font-size="6.2" text-anchor="start" fill="#666666" font-weight="normal">3.2 um</text><text x="88" y="104.4" font-size="6.8" text-anchor="end" fill="#222" font-weight="normal">milling</text><path d="M96.0 94.0L167.6 94.0L167.6 103.0L96.0 103.0Z" fill="#DCEEFB" stroke="#1565C0" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><text x="172.57063732038728" y="104.2" font-size="6.2" text-anchor="start" fill="#666666" font-weight="normal">1.6 um</text><text x="88" y="124.4" font-size="6.8" text-anchor="end" fill="#222" font-weight="normal">grinding</text><path d="M96.0 114.0L191.7 114.0L191.7 123.0L96.0 123.0Z" fill="#D8EDEA" stroke="#00695C" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><text x="196.7027489141143" y="124.2" font-size="6.2" text-anchor="start" fill="#666666" font-weight="normal">0.8 um</text><text x="88" y="144.4" font-size="6.8" text-anchor="end" fill="#222" font-weight="normal">honing</text><path d="M96.0 134.0L240.0 134.0L240.0 143.0L96.0 143.0Z" fill="#F6E3C5" stroke="#B66A00" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><text x="244.96697210156825" y="144.2" font-size="6.2" text-anchor="start" fill="#666666" font-weight="normal">0.2 um</text><text x="88" y="164.4" font-size="6.8" text-anchor="end" fill="#222" font-weight="normal">lapping</text><path d="M96.0 154.0L288.2 154.0L288.2 163.0L96.0 163.0Z" fill="#EFE4FB" stroke="#7B2CD9" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><text x="293.23119528902225" y="164.2" font-size="6.2" text-anchor="start" fill="#666666" font-weight="normal">0.05 um</text><text x="96" y="182.2" font-size="6.2" text-anchor="start" fill="#666666" font-weight="normal">longer bar = finer finish, log scale</text><rect x="6.0" y="190.0" width="348.0" height="58.0" rx="5" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1"/><text x="180.0" y="204.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">clean first, finish second - and never the other way round</text><text x="180.0" y="218.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">degrease with alkali or solvent, pickle to descale, then blast or brush</text><text x="180.0" y="230.2" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">blast profile 50 - 75 um is what a paint keys into; a polished face has nothing</text><text x="180.0" y="241.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">pickling too long on a hardened part puts hydrogen in: bake it at 200 C</text><text x="180.0" y="265.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">A coating cannot hide a scratch and a plating copies the profile it grows on, so</text><text x="180.0" y="277.5" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">the roughness is chosen before the coating, not after it.</text></svg>