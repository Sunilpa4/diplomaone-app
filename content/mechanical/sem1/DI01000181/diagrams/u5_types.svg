<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 308" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="308" fill="#ffffff"/><text x="180.0" y="24.3" font-size="12.2" text-anchor="middle" fill="#222222" font-weight="bold">Six ways a surface corrodes</text><text x="180.0" y="40.2" font-size="9.2" text-anchor="middle" fill="#666666" font-weight="normal">the shape of the damage names the mechanism, and so does the defence</text><rect x="6.0" y="46.0" width="172.0" height="72.0" rx="6" fill="#FBFCFD" stroke="#9AA3AD" stroke-width="0.9"/><text x="92" y="61.5" font-size="7.0" text-anchor="middle" fill="#666666" font-weight="bold">UNIFORM</text><path d="M20.0 72.0L164.0 72.0L164.0 84.0L20.0 84.0Z" fill="#E7EDF3" stroke="#9AA3AD" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round"/><path d="M20.0 78.0L164.0 78.0" fill="none" stroke="#666666" stroke-width="2.0" stroke-linecap="round" stroke-dasharray="3,2"/><text x="92" y="98.1" font-size="6.0" text-anchor="middle" fill="#222222" font-weight="normal">even loss over the whole area</text><text x="92" y="110.1" font-size="6.0" text-anchor="middle" fill="#2E7D32" font-weight="normal">allow a corrosion allowance</text><rect x="182.0" y="46.0" width="172.0" height="72.0" rx="6" fill="#FBFCFD" stroke="#9AA3AD" stroke-width="0.9"/><text x="268" y="61.5" font-size="7.0" text-anchor="middle" fill="#1565C0" font-weight="bold">GALVANIC</text><path d="M196.0 72.0L340.0 72.0L340.0 84.0L196.0 84.0Z" fill="#E7EDF3" stroke="#9AA3AD" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round"/><path d="M268.0 72.0L268.0 84.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><path d="M198.0 72.0L244.0 72.0L256.0 77.0L244.0 84.0L198.0 84.0Z" fill="#F7DDE3" stroke="#1565C0" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="222" y="82.4" font-size="5.6" text-anchor="middle" fill="#1565C0" font-weight="normal">eaten</text><text x="268" y="98.1" font-size="6.0" text-anchor="middle" fill="#222222" font-weight="normal">two metals joined, the less noble goes</text><text x="268" y="110.1" font-size="6.0" text-anchor="middle" fill="#2E7D32" font-weight="normal">insulate the joint, coat both</text><rect x="6.0" y="124.0" width="172.0" height="72.0" rx="6" fill="#FBFCFD" stroke="#9AA3AD" stroke-width="0.9"/><text x="92" y="139.4" font-size="7.0" text-anchor="middle" fill="#BD2543" font-weight="bold">PITTING</text><path d="M20.0 150.0L164.0 150.0L164.0 162.0L20.0 162.0Z" fill="#E7EDF3" stroke="#9AA3AD" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round"/><path d="M30.0 150.0L36.0 160.0L42.0 150.0Z" fill="#F7DDE3" stroke="#BD2543" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><path d="M62.0 150.0L68.0 160.0L74.0 150.0Z" fill="#F7DDE3" stroke="#BD2543" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><path d="M94.0 150.0L100.0 160.0L106.0 150.0Z" fill="#F7DDE3" stroke="#BD2543" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><path d="M126.0 150.0L132.0 160.0L138.0 150.0Z" fill="#F7DDE3" stroke="#BD2543" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="92" y="176.1" font-size="6.0" text-anchor="middle" fill="#222222" font-weight="normal">chloride breaks a passive film</text><text x="92" y="188.1" font-size="6.0" text-anchor="middle" fill="#2E7D32" font-weight="normal">higher Mo grade, keep it clean</text><rect x="182.0" y="124.0" width="172.0" height="72.0" rx="6" fill="#FBFCFD" stroke="#9AA3AD" stroke-width="0.9"/><text x="268" y="139.4" font-size="7.0" text-anchor="middle" fill="#B66A00" font-weight="bold">CREVICE</text><path d="M196.0 150.0L340.0 150.0L340.0 162.0L196.0 162.0Z" fill="#E7EDF3" stroke="#9AA3AD" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round"/><path d="M222.0 142.0L302.0 142.0L302.0 150.0L222.0 150.0Z" fill="#E9EDF1" stroke="#666666" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><path d="M234.0 150.0L290.0 150.0L290.0 158.0L234.0 158.0Z" fill="#F6E3C5" stroke="#B66A00" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="268" y="176.1" font-size="6.0" text-anchor="middle" fill="#222222" font-weight="normal">stagnant liquid under a gasket</text><text x="268" y="188.1" font-size="6.0" text-anchor="middle" fill="#2E7D32" font-weight="normal">weld instead of lap, seal the gap</text><rect x="6.0" y="202.0" width="172.0" height="72.0" rx="6" fill="#FBFCFD" stroke="#9AA3AD" stroke-width="0.9"/><text x="92" y="217.4" font-size="7.0" text-anchor="middle" fill="#7B2CD9" font-weight="bold">STRESS CRACKING</text><path d="M20.0 228.0L164.0 228.0L164.0 240.0L20.0 240.0Z" fill="#E7EDF3" stroke="#9AA3AD" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round"/><path d="M80.0 228.0L84.0 232.0L78.0 236.0L86.0 240.0" fill="none" stroke="#7B2CD9" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M36.0 222.0L66.0 222.0" fill="none" stroke="#7B2CD9" stroke-width="1.0" stroke-linecap="round"/><path d="M62.0 220.6L66.0 222.0L62.0 223.4Z" fill="#7B2CD9"/><path d="M126.0 222.0L96.0 222.0" fill="none" stroke="#7B2CD9" stroke-width="1.0" stroke-linecap="round"/><path d="M100.0 223.4L96.0 222.0L100.0 220.6Z" fill="#7B2CD9"/><text x="92" y="254.1" font-size="6.0" text-anchor="middle" fill="#222222" font-weight="normal">tensile stress plus chloride</text><text x="92" y="266.1" font-size="6.0" text-anchor="middle" fill="#2E7D32" font-weight="normal">stress relieve, lower the load</text><rect x="182.0" y="202.0" width="172.0" height="72.0" rx="6" fill="#FBFCFD" stroke="#9AA3AD" stroke-width="0.9"/><text x="268" y="217.4" font-size="7.0" text-anchor="middle" fill="#00695C" font-weight="bold">EROSION</text><path d="M196.0 228.0L340.0 228.0L340.0 240.0L196.0 240.0Z" fill="#E7EDF3" stroke="#9AA3AD" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round"/><path d="M216.0 228.0L228.0 232.0L240.0 228.0" fill="none" stroke="#00695C" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><path d="M240.0 228.0L252.0 232.0L264.0 228.0" fill="none" stroke="#00695C" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><path d="M264.0 228.0L276.0 232.0L288.0 228.0" fill="none" stroke="#00695C" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><path d="M288.0 228.0L300.0 232.0L312.0 228.0" fill="none" stroke="#00695C" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><path d="M312.0 228.0L324.0 232.0L336.0 228.0" fill="none" stroke="#00695C" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="268" y="254.1" font-size="6.0" text-anchor="middle" fill="#222222" font-weight="normal">fast wet flow scours the film</text><text x="268" y="266.1" font-size="6.0" text-anchor="middle" fill="#2E7D32" font-weight="normal">change the geometry, hard facing</text><text x="180.0" y="291.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">Uniform loss can be paid for with thickness; the other five cannot, so they</text><text x="180.0" y="303.5" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">have to be designed out rather than allowed for.</text></svg>