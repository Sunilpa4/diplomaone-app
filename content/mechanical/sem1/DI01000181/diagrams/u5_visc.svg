<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 308" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="308" fill="#ffffff"/><text x="180.0" y="24.3" font-size="12.2" text-anchor="middle" fill="#222222" font-weight="bold">Viscosity against temperature, and what VI means</text><text x="180.0" y="40.2" font-size="9.2" text-anchor="middle" fill="#666666" font-weight="normal">the same 10 cSt at 100 C, and a different oil at 30 C</text><path d="M46.0 194.0L46.0 58.0" fill="none" stroke="#222222" stroke-width="1.3" stroke-linecap="round"/><path d="M44.2 63.0L46.0 58.0L47.8 63.0Z" fill="#222222"/><path d="M46.0 194.0L302.0 194.0" fill="none" stroke="#222222" stroke-width="1.3" stroke-linecap="round"/><path d="M297.0 192.2L302.0 194.0L297.0 195.8Z" fill="#222222"/><path d="M46.0 194.0L46.0 197.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="46" y="209.6" font-size="7.4" text-anchor="middle" fill="#666666" font-weight="normal">30</text><path d="M129.3 194.0L129.3 197.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="129.33333333333331" y="209.6" font-size="7.4" text-anchor="middle" fill="#666666" font-weight="normal">60</text><path d="M212.7 194.0L212.7 197.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="212.66666666666666" y="209.6" font-size="7.4" text-anchor="middle" fill="#666666" font-weight="normal">90</text><path d="M296.0 194.0L296.0 197.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="296.0" y="209.6" font-size="7.4" text-anchor="middle" fill="#666666" font-weight="normal">120</text><path d="M43.0 194.0L46.0 194.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="41" y="199.2" font-size="7.4" text-anchor="end" fill="#666666" font-weight="normal">0</text><path d="M43.0 155.2L46.0 155.2" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="41" y="160.4" font-size="7.4" text-anchor="end" fill="#666666" font-weight="normal">100</text><path d="M43.0 116.4L46.0 116.4" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="41" y="121.5" font-size="7.4" text-anchor="end" fill="#666666" font-weight="normal">200</text><path d="M43.0 77.5L46.0 77.5" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="41" y="82.7" font-size="7.4" text-anchor="end" fill="#666666" font-weight="normal">300</text><text x="302" y="220.8" font-size="8.0" text-anchor="end" fill="#222222" font-weight="bold"></text><text x="43" y="52.8" font-size="8.0" text-anchor="middle" fill="#222222" font-weight="bold">cSt</text><text x="300" y="220.4" font-size="6.8" text-anchor="end" fill="#222" font-weight="bold">temperature, C</text><path d="M46.0 70.8L59.9 110.6L73.8 135.8L87.7 152.1L101.6 163.1L115.4 170.7L129.3 176.0L143.2 179.9L157.1 182.7L171.0 184.9L184.9 186.5L198.8 187.7L212.7 188.7L226.6 189.5L240.4 190.1L254.3 190.6L268.2 191.0L282.1 191.4L296.0 191.7" fill="none" stroke="#BD2543" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><text x="90.44444444444444" y="152.1" font-size="6.8" text-anchor="start" fill="#BD2543" font-weight="bold">VI 70</text><path d="M46.0 151.2L59.9 160.7L73.8 167.6L87.7 172.8L101.6 176.7L115.4 179.7L129.3 182.1L143.2 183.9L157.1 185.4L171.0 186.6L184.9 187.6L198.8 188.4L212.7 189.1L226.6 189.6L240.4 190.1L254.3 190.5L268.2 190.9L282.1 191.2L296.0 191.4" fill="none" stroke="#2E7D32" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><text x="90.44444444444444" y="172.3" font-size="6.8" text-anchor="start" fill="#2E7D32" font-weight="bold">VI 150</text><path d="M46.0 190.1L296.0 190.1" fill="none" stroke="#9AA3AD" stroke-width="0.9" stroke-linecap="round" stroke-dasharray="3,3"/><text x="201.55555555555557" y="99.2" font-size="6.4" text-anchor="middle" fill="#666666" font-weight="normal">both oils: 10 cSt at 100 C</text><circle cx="240.4" cy="190.1" r="2.2" fill="#222222"/><text x="48.77777777777778" y="67.5" font-size="6.2" text-anchor="start" fill="#BD2543" font-weight="normal">316 cSt at 30 C</text><text x="48.77777777777778" y="147.5" font-size="6.2" text-anchor="start" fill="#2E7D32" font-weight="normal">110 cSt</text><rect x="6.0" y="216.0" width="348.0" height="58.0" rx="5" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1"/><text x="180.0" y="230.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">the three numbers on an oil drum that matter first</text><text x="180.0" y="244.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">ISO VG is the nominal viscosity at 40 C: VG 68 runs 61.2 to 74.8 cSt, a spread of 10 %</text><text x="180.0" y="256.2" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">VI says how little it thins when hot: 70 is a plain mineral oil, 150 a good multigrade</text><text x="180.0" y="267.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">pour point is the cold limit, flash point the fire limit: -9 C and 200 C for VG 68</text><text x="180.0" y="291.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">An oil is chosen for its viscosity at the running temperature, not at the drum, so a</text><text x="180.0" y="303.5" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">high-VI oil is worth its price on a machine that starts cold and runs hot.</text></svg>