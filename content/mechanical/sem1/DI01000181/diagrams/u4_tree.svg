<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 348" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="348" fill="#ffffff"/><text x="180.0" y="24.3" font-size="12.2" text-anchor="middle" fill="#222222" font-weight="bold">Classification of non-metallic materials</text><text x="180.0" y="40.2" font-size="9.2" text-anchor="middle" fill="#666666" font-weight="normal">four families, and what each one is for</text><rect x="6.0" y="46.0" width="172.0" height="98.0" rx="6" fill="#EEF4FC" stroke="#9AA3AD" stroke-width="0.9"/><text x="92" y="63.8" font-size="8.0" text-anchor="middle" fill="#1565C0" font-weight="bold">POLYMERS</text><text x="92" y="82.3" font-size="6.5" text-anchor="middle" fill="#222222" font-weight="normal">thermoplastic: PE, PP, PVC, nylon</text><text x="92" y="94.3" font-size="6.5" text-anchor="middle" fill="#222222" font-weight="normal">thermoset: epoxy, bakelite, PU</text><text x="92" y="106.3" font-size="6.5" text-anchor="middle" fill="#222222" font-weight="normal">elastomer: natural, SBR, NBR</text><text x="92" y="132.2" font-size="6.2" text-anchor="middle" fill="#666666" font-weight="normal">rubber, seals, tanks</text><rect x="182.0" y="46.0" width="172.0" height="98.0" rx="6" fill="#FFF6EC" stroke="#9AA3AD" stroke-width="0.9"/><text x="268" y="63.8" font-size="8.0" text-anchor="middle" fill="#B66A00" font-weight="bold">CERAMICS</text><text x="268" y="82.3" font-size="6.5" text-anchor="middle" fill="#222222" font-weight="normal">traditional: brick, tile, cement</text><text x="268" y="94.3" font-size="6.5" text-anchor="middle" fill="#222222" font-weight="normal">advanced: alumina, SiC, Si3N4</text><text x="268" y="106.3" font-size="6.5" text-anchor="middle" fill="#222222" font-weight="normal">glass, porcelain, enamel</text><text x="268" y="132.2" font-size="6.2" text-anchor="middle" fill="#666666" font-weight="normal">bricks, inserts, pots</text><rect x="6.0" y="150.0" width="172.0" height="98.0" rx="6" fill="#EAF4F2" stroke="#9AA3AD" stroke-width="0.9"/><text x="92" y="167.8" font-size="8.0" text-anchor="middle" fill="#00695C" font-weight="bold">COMPOSITES</text><text x="92" y="186.3" font-size="6.5" text-anchor="middle" fill="#222222" font-weight="normal">FRP: glass or carbon in epoxy</text><text x="92" y="198.3" font-size="6.5" text-anchor="middle" fill="#222222" font-weight="normal">MMC: SiC particles in aluminium</text><text x="92" y="210.3" font-size="6.5" text-anchor="middle" fill="#222222" font-weight="normal">plywood, GRP tank, blade</text><text x="92" y="236.2" font-size="6.2" text-anchor="middle" fill="#666666" font-weight="normal">light panels, blades</text><rect x="182.0" y="150.0" width="172.0" height="98.0" rx="6" fill="#EDF6EE" stroke="#9AA3AD" stroke-width="0.9"/><text x="268" y="167.8" font-size="8.0" text-anchor="middle" fill="#2E7D32" font-weight="bold">NATURAL AND ORGANIC</text><text x="268" y="186.3" font-size="6.5" text-anchor="middle" fill="#222222" font-weight="normal">wood, cork, leather, cotton</text><text x="268" y="198.3" font-size="6.5" text-anchor="middle" fill="#222222" font-weight="normal">felt, paper, bitumen</text><text x="268" y="210.3" font-size="6.5" text-anchor="middle" fill="#222222" font-weight="normal">gaskets, packing, damping</text><text x="268" y="236.2" font-size="6.2" text-anchor="middle" fill="#666666" font-weight="normal">cheap, quiet, soft</text><rect x="6.0" y="258.0" width="348.0" height="58.0" rx="5" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1"/><text x="180.0" y="272.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">why a machine needs a non-metal at all</text><text x="180.0" y="286.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">light and cheap and they do not rust: guards, tanks, handles, seals</text><text x="180.0" y="298.2" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">they insulate - a busbar is useless without a porcelain support</text><text x="180.0" y="309.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">they run quiet: nylon gears, rubber mounts, cork and felt gaskets</text><text x="180.0" y="329.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">Metals are strong and stiff; non-metals are light, insulating, quiet and cheap.</text><text x="180.0" y="341.5" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">A design that uses only metal is either noisy, heavy or dangerous to touch.</text></svg>