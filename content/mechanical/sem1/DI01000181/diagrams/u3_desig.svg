<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 302" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="302" fill="#ffffff"/><text x="180.0" y="24.3" font-size="12.2" text-anchor="middle" fill="#222222" font-weight="bold">Steels a workshop actually orders</text><text x="180.0" y="40.2" font-size="9.2" text-anchor="middle" fill="#666666" font-weight="normal">Indian designation, carbon and use</text><path d="M6.0 48.0L174.0 48.0L174.0 73.0L6.0 73.0Z" fill="#FBFCFD" stroke="#9AA3AD" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/><text x="12" y="60.5" font-size="7.0" text-anchor="start" fill="#222" font-weight="bold">C10 / EN32</text><text x="12" y="70.1" font-size="6.0" text-anchor="start" fill="#666666" font-weight="normal">0.10 % C   sheet, wire, nails</text><path d="M182.0 48.0L350.0 48.0L350.0 73.0L182.0 73.0Z" fill="#FBFCFD" stroke="#9AA3AD" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/><text x="188" y="60.5" font-size="7.0" text-anchor="start" fill="#222" font-weight="bold">C20 / EN3B</text><text x="188" y="70.1" font-size="6.0" text-anchor="start" fill="#666666" font-weight="normal">0.20 % C   shafts, studs</text><path d="M6.0 78.0L174.0 78.0L174.0 103.0L6.0 103.0Z" fill="#F4F7FA" stroke="#9AA3AD" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/><text x="12" y="90.5" font-size="7.0" text-anchor="start" fill="#222" font-weight="bold">C40 / EN8</text><text x="12" y="100.1" font-size="6.0" text-anchor="start" fill="#666666" font-weight="normal">0.40 % C   axles, gears</text><path d="M182.0 78.0L350.0 78.0L350.0 103.0L182.0 103.0Z" fill="#F4F7FA" stroke="#9AA3AD" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/><text x="188" y="90.5" font-size="7.0" text-anchor="start" fill="#222" font-weight="bold">C45 / EN9</text><text x="188" y="100.1" font-size="6.0" text-anchor="start" fill="#666666" font-weight="normal">0.45 % C   shafts, keys</text><path d="M6.0 108.0L174.0 108.0L174.0 133.0L6.0 133.0Z" fill="#FBFCFD" stroke="#9AA3AD" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/><text x="12" y="120.5" font-size="7.0" text-anchor="start" fill="#222" font-weight="bold">C60 / EN42</text><text x="12" y="130.1" font-size="6.0" text-anchor="start" fill="#666666" font-weight="normal">0.60 % C   springs, clips</text><path d="M182.0 108.0L350.0 108.0L350.0 133.0L182.0 133.0Z" fill="#FBFCFD" stroke="#9AA3AD" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/><text x="188" y="120.5" font-size="7.0" text-anchor="start" fill="#222" font-weight="bold">C80 / EN43</text><text x="188" y="130.1" font-size="6.0" text-anchor="start" fill="#666666" font-weight="normal">0.80 % C   springs, wire rope</text><path d="M6.0 138.0L174.0 138.0L174.0 163.0L6.0 163.0Z" fill="#F4F7FA" stroke="#9AA3AD" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/><text x="12" y="150.4" font-size="7.0" text-anchor="start" fill="#222" font-weight="bold">EN19 (Cr-Mo)</text><text x="12" y="160.1" font-size="6.0" text-anchor="start" fill="#666666" font-weight="normal">0.40 % C   gears, crank</text><path d="M182.0 138.0L350.0 138.0L350.0 163.0L182.0 163.0Z" fill="#F4F7FA" stroke="#9AA3AD" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/><text x="188" y="150.4" font-size="7.0" text-anchor="start" fill="#222" font-weight="bold">EN31 (1 % C, Cr)</text><text x="188" y="160.1" font-size="6.0" text-anchor="start" fill="#666666" font-weight="normal">1.00 % C   ball bearings</text><path d="M6.0 168.0L174.0 168.0L174.0 193.0L6.0 193.0Z" fill="#FBFCFD" stroke="#9AA3AD" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/><text x="12" y="180.4" font-size="7.0" text-anchor="start" fill="#222" font-weight="bold">SS 304 (18/8)</text><text x="12" y="190.1" font-size="6.0" text-anchor="start" fill="#666666" font-weight="normal">0.08 % C   food, kitchen</text><path d="M182.0 168.0L350.0 168.0L350.0 193.0L182.0 193.0Z" fill="#FBFCFD" stroke="#9AA3AD" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/><text x="188" y="180.4" font-size="7.0" text-anchor="start" fill="#222" font-weight="bold">SS 316 (16/10/2 Mo)</text><text x="188" y="190.1" font-size="6.0" text-anchor="start" fill="#666666" font-weight="normal">0.08 % C   sea water, plant</text><rect x="6.0" y="206.0" width="348.0" height="58.0" rx="5" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1"/><text x="180.0" y="220.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">reading the designation</text><text x="180.0" y="234.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">C 45 = plain carbon steel with 0.45 % carbon, EN9 is the old BS name for the same</text><text x="180.0" y="246.2" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">EN19 = 0.4 % C with chromium and molybdenum: through-hardenable, tough core</text><text x="180.0" y="257.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">SS 304 = 18 % Cr, 8 % Ni, 0.08 % C: austenitic, non-magnetic, weldable</text><text x="180.0" y="279.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">The letter gives the family and the number gives the carbon in hundredths of a</text><text x="180.0" y="291.5" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">per cent; everything after that is the alloying element that does the special work.</text></svg>