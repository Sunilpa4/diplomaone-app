<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 316" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="316" fill="#ffffff"/><text x="180.0" y="24.3" font-size="12.2" text-anchor="middle" fill="#222222" font-weight="bold">Bond strength decides the melting point</text><text x="180.0" y="40.2" font-size="9.2" text-anchor="middle" fill="#666666" font-weight="normal">bond energy in kJ per mole</text><path d="M66.0 196.0L344.0 196.0" fill="none" stroke="#222222" stroke-width="1.3" stroke-linecap="round"/><path d="M66.0 196.0L66.0 88.0" fill="none" stroke="#222222" stroke-width="1.3" stroke-linecap="round"/><text x="66" y="80.5" font-size="7.2" text-anchor="start" fill="#222" font-weight="bold">kJ/mol</text><path d="M61.0 196.0L66.0 196.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="57" y="200.8" font-size="6.4" text-anchor="end" fill="#666666" font-weight="normal">0</text><path d="M61.0 166.6L66.0 166.6" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="57" y="171.4" font-size="6.4" text-anchor="end" fill="#666666" font-weight="normal">250</text><path d="M61.0 137.2L66.0 137.2" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="57" y="142.0" font-size="6.4" text-anchor="end" fill="#666666" font-weight="normal">500</text><path d="M61.0 107.8L66.0 107.8" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="57" y="112.6" font-size="6.4" text-anchor="end" fill="#666666" font-weight="normal">750</text><rect x="86" y="193.6" width="40" height="2.4" rx="2" fill="#7B2CD9" fill-opacity="0.28" stroke="#7B2CD9" stroke-width="1.3"/><text x="106" y="183.2" font-size="7.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">20</text><text x="106" y="191.7" font-size="5.8" text-anchor="middle" fill="#666666" font-weight="normal">0 C ice</text><text x="106" y="210.3" font-size="6.6" text-anchor="middle" fill="#222222" font-weight="normal">H-bond</text><rect x="148" y="155.1" width="40" height="40.9" rx="2" fill="#2E7D32" fill-opacity="0.28" stroke="#2E7D32" stroke-width="1.3"/><text x="168" y="144.6" font-size="7.2" text-anchor="middle" fill="#2E7D32" font-weight="bold">348</text><text x="168" y="153.1" font-size="5.8" text-anchor="middle" fill="#666666" font-weight="normal">3650 C</text><text x="168" y="210.3" font-size="6.6" text-anchor="middle" fill="#222222" font-weight="normal">C - C</text><rect x="210" y="147.2" width="40" height="48.8" rx="2" fill="#1565C0" fill-opacity="0.28" stroke="#1565C0" stroke-width="1.3"/><text x="230" y="136.7" font-size="7.2" text-anchor="middle" fill="#1565C0" font-weight="bold">415</text><text x="230" y="145.2" font-size="5.8" text-anchor="middle" fill="#666666" font-weight="normal">1538 C</text><text x="230" y="210.3" font-size="6.6" text-anchor="middle" fill="#222222" font-weight="normal">Fe - Fe</text><rect x="272" y="103.4" width="40" height="92.6" rx="2" fill="#B66A00" fill-opacity="0.28" stroke="#B66A00" stroke-width="1.3"/><text x="292" y="92.9" font-size="7.2" text-anchor="middle" fill="#B66A00" font-weight="bold">787</text><text x="292" y="101.4" font-size="5.8" text-anchor="middle" fill="#666666" font-weight="normal">801 C</text><text x="292" y="210.3" font-size="6.6" text-anchor="middle" fill="#222222" font-weight="normal">NaCl</text><rect x="6.0" y="220.0" width="348.0" height="52.0" rx="5" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1"/><text x="180.0" y="234.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">the rule in one line</text><text x="180.0" y="248.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">melting point rises with bond energy: 20, 348, 415, 787 kJ/mol</text><text x="180.0" y="260.2" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">ice melts at 0 C, iron at 1538 C, rock salt at 801 C</text><text x="180.0" y="271.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">but a strong ionic bond gives no impact resistance: salt is brittle</text><text x="180.0" y="295.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">The C - C bar belongs to graphite, which sublimes near 3650 C rather than</text><text x="180.0" y="307.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">melting. Compare like with like: bond energy is only one consequence.</text></svg>