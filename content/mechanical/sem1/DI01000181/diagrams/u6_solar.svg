<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 288" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="288" fill="#ffffff"/><text x="180.0" y="24.3" font-size="12.2" text-anchor="middle" fill="#222222" font-weight="bold">From 1000 W/m2 of sunlight to 1.28 kWh a day</text><text x="180.0" y="40.2" font-size="9.2" text-anchor="middle" fill="#666666" font-weight="normal">the losses at each step</text><text x="142" y="64.2" font-size="6.2" text-anchor="end" fill="#222" font-weight="normal">sunlight on the panel</text><path d="M150.0 53.0L300.0 53.0L300.0 64.0L150.0 64.0Z" fill="#E9EDF1" stroke="#666666" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/><text x="306.0" y="64.2" font-size="6.2" text-anchor="start" fill="#666666" font-weight="normal">1000 W/m2</text><text x="142" y="88.2" font-size="6.2" text-anchor="end" fill="#222" font-weight="normal">after reflection and heat</text><path d="M150.0 77.0L277.5 77.0L277.5 88.0L150.0 88.0Z" fill="#DCEEFB" stroke="#1565C0" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/><text x="283.5" y="88.2" font-size="6.2" text-anchor="start" fill="#1565C0" font-weight="normal">850 W/m2</text><text x="142" y="112.2" font-size="6.2" text-anchor="end" fill="#222" font-weight="normal">converted by the cells at 20 %</text><path d="M150.0 101.0L180.0 101.0L180.0 112.0L150.0 112.0Z" fill="#D8EDEA" stroke="#00695C" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/><text x="186.0" y="112.2" font-size="6.2" text-anchor="start" fill="#00695C" font-weight="normal">200 W/m2</text><text x="142" y="136.2" font-size="6.2" text-anchor="end" fill="#222" font-weight="normal">after inverter and wiring</text><path d="M150.0 125.0L175.5 125.0L175.5 136.0L150.0 136.0Z" fill="#D8EEDA" stroke="#2E7D32" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/><text x="181.5" y="136.2" font-size="6.2" text-anchor="start" fill="#2E7D32" font-weight="normal">170 W/m2</text><text x="150" y="160.3" font-size="6.6" text-anchor="start" fill="#222" font-weight="bold">2 m2 panel at 200 W/m2 = 400 W peak</text><text x="150" y="172.2" font-size="6.2" text-anchor="start" fill="#666666" font-weight="normal">4 peak sun hours at 0.8 performance ratio</text><text x="150" y="184.2" font-size="6.4" text-anchor="start" fill="#2E7D32" font-weight="bold">= 400 x 4 x 0.8 = 1280 Wh = 1.28 kWh per day</text><rect x="6.0" y="196.0" width="348.0" height="58.0" rx="5" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1"/><text x="180.0" y="210.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">the materials behind the number</text><text x="180.0" y="224.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">mono silicon 20 - 22 %, poly 16 - 18 %, CdTe and CIGS 16 - 18 % of module area</text><text x="180.0" y="236.2" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">a module is glass, EVA, cells, backsheet and an aluminium frame: 70 % is not cell</text><text x="180.0" y="247.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">energy payback 1 to 3 years against 25: nine tenths of its output is carbon free</text><text x="180.0" y="271.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">Efficiency is a material property, so the panel is chosen for the area it can use:</text><text x="180.0" y="283.5" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">a roof short of area buys mono silicon, a field buys whatever is cheapest per kWh.</text></svg>