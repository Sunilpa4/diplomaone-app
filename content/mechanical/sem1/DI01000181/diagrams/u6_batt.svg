<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 264" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="264" fill="#ffffff"/><text x="180.0" y="24.3" font-size="12.2" text-anchor="middle" fill="#222222" font-weight="bold">The five materials in one lithium-ion cell</text><text x="180.0" y="40.2" font-size="9.2" text-anchor="middle" fill="#666666" font-weight="normal">each layer has one job</text><rect x="40.0" y="56.0" width="190.0" height="10.0" fill="#E9EDF1" stroke="#9AA3AD" stroke-width="1.1"/><rect x="40.0" y="66.0" width="190.0" height="20.0" fill="#EFE4FB" stroke="#7B2CD9" stroke-width="1.1"/><text x="135.0" y="80.4" font-size="5.8" text-anchor="middle" fill="#7B2CD9" font-weight="normal">cathode: NMC or LFP, 60 um</text><rect x="40.0" y="86.0" width="190.0" height="14.0" fill="#FFF6EC" stroke="#B66A00" stroke-width="1.1"/><text x="135.0" y="97.4" font-size="5.8" text-anchor="middle" fill="#B66A00" font-weight="normal">separator plus electrolyte, 20 um</text><rect x="40.0" y="100.0" width="190.0" height="18.0" fill="#D8EEDA" stroke="#2E7D32" stroke-width="1.1"/><text x="135.0" y="113.4" font-size="5.8" text-anchor="middle" fill="#2E7D32" font-weight="normal">anode: graphite, 50 um</text><rect x="40.0" y="118.0" width="190.0" height="10.0" fill="#E9EDF1" stroke="#9AA3AD" stroke-width="1.1"/><text x="40" y="50.3" font-size="6.6" text-anchor="start" fill="#222" font-weight="bold">a single cell, 3.7 V</text><path d="M232.0 61.0L240.0 61.0" fill="none" stroke="#9AA3AD" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="2,2"/><circle cx="232.0" cy="61.0" r="1.5" fill="#9AA3AD"/><text x="244" y="65.1" font-size="6.0" text-anchor="start" fill="#666666" font-weight="normal">aluminium foil, 15 um</text><path d="M232.0 123.0L240.0 123.0" fill="none" stroke="#9AA3AD" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="2,2"/><circle cx="232.0" cy="123.0" r="1.5" fill="#9AA3AD"/><text x="244" y="127.1" font-size="6.0" text-anchor="start" fill="#666666" font-weight="normal">copper foil, 10 um</text><path d="M232.0 76.0L240.0 76.0" fill="none" stroke="#9AA3AD" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="2,2"/><circle cx="232.0" cy="76.0" r="1.5" fill="#9AA3AD"/><text x="244" y="81.1" font-size="6.0" text-anchor="start" fill="#7B2CD9" font-weight="normal">holds the lithium</text><path d="M232.0 93.0L240.0 93.0" fill="none" stroke="#9AA3AD" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="2,2"/><circle cx="232.0" cy="93.0" r="1.5" fill="#9AA3AD"/><text x="244" y="98.1" font-size="6.0" text-anchor="start" fill="#B66A00" font-weight="normal">keeps the plates apart</text><rect x="6.0" y="146.0" width="348.0" height="74.0" rx="5" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1"/><text x="180.0" y="160.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">the four numbers of a cell, and what they mean for the car</text><text x="180.0" y="174.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">cell 3.7 V and 50 Ah: energy 185 Wh, and a 96 cell pack is 355 V and 17.8 kWh</text><text x="180.0" y="186.2" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">specific energy: LFP 140, NMC 220 Wh/kg of cell; the pack is 30 % less</text><text x="180.0" y="197.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">life is counted in cycles: 1500 to 3000 for a car, 5000 for a stationary pack</text><text x="180.0" y="209.2" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">at end of life the metals are worth recovering: Li, Ni, Co and the copper</text><text x="180.0" y="245.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">A battery is the only part of a machine whose material is chosen for its chemistry</text><text x="180.0" y="257.5" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">rather than its strength, and the only one whose second life is a problem.</text></svg>