<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 310" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="310" fill="#ffffff"/><text x="180.0" y="24.3" font-size="12.2" text-anchor="middle" fill="#222222" font-weight="bold">The Mohs ladder, and which rung cuts what</text><text x="180.0" y="40.2" font-size="9.2" text-anchor="middle" fill="#666666" font-weight="normal">an abrasive must be harder than the work</text><path d="M26.0 96.0L332.0 96.0" fill="none" stroke="#222222" stroke-width="1.6" stroke-linecap="round"/><path d="M26.0 91.0L26.0 101.0" fill="none" stroke="#222222" stroke-width="1.4" stroke-linecap="round"/><text x="26.0" y="117.5" font-size="7.2" text-anchor="middle" fill="#666666" font-weight="bold">1</text><text x="26.0" y="129.1" font-size="6.0" text-anchor="middle" fill="#666666" font-weight="normal">talc</text><path d="M60.0 91.0L60.0 101.0" fill="none" stroke="#222222" stroke-width="1.4" stroke-linecap="round"/><text x="60.0" y="117.5" font-size="7.2" text-anchor="middle" fill="#666666" font-weight="bold">2</text><text x="60.0" y="140.1" font-size="6.0" text-anchor="middle" fill="#666666" font-weight="normal">gypsum</text><path d="M94.0 91.0L94.0 101.0" fill="none" stroke="#222222" stroke-width="1.4" stroke-linecap="round"/><text x="94.0" y="117.5" font-size="7.2" text-anchor="middle" fill="#666666" font-weight="bold">3</text><text x="94.0" y="129.1" font-size="6.0" text-anchor="middle" fill="#666666" font-weight="normal">calcite</text><path d="M128.0 91.0L128.0 101.0" fill="none" stroke="#222222" stroke-width="1.4" stroke-linecap="round"/><text x="128.0" y="117.5" font-size="7.2" text-anchor="middle" fill="#666666" font-weight="bold">4</text><text x="128.0" y="140.1" font-size="6.0" text-anchor="middle" fill="#666666" font-weight="normal">fluorite</text><path d="M162.0 91.0L162.0 101.0" fill="none" stroke="#222222" stroke-width="1.4" stroke-linecap="round"/><text x="162.0" y="117.5" font-size="7.2" text-anchor="middle" fill="#666666" font-weight="bold">5</text><text x="162.0" y="129.1" font-size="6.0" text-anchor="middle" fill="#666666" font-weight="normal">apatite</text><path d="M196.0 91.0L196.0 101.0" fill="none" stroke="#222222" stroke-width="1.4" stroke-linecap="round"/><text x="196.0" y="117.5" font-size="7.2" text-anchor="middle" fill="#666666" font-weight="bold">6</text><text x="196.0" y="140.1" font-size="6.0" text-anchor="middle" fill="#666666" font-weight="normal">feldspar</text><path d="M230.0 91.0L230.0 101.0" fill="none" stroke="#222222" stroke-width="1.4" stroke-linecap="round"/><text x="230.0" y="117.5" font-size="7.2" text-anchor="middle" fill="#BD2543" font-weight="bold">7</text><text x="230.0" y="129.1" font-size="6.0" text-anchor="middle" fill="#BD2543" font-weight="normal">quartz</text><path d="M264.0 91.0L264.0 101.0" fill="none" stroke="#222222" stroke-width="1.4" stroke-linecap="round"/><text x="264.0" y="117.5" font-size="7.2" text-anchor="middle" fill="#666666" font-weight="bold">8</text><text x="264.0" y="140.1" font-size="6.0" text-anchor="middle" fill="#666666" font-weight="normal">topaz</text><path d="M298.0 91.0L298.0 101.0" fill="none" stroke="#222222" stroke-width="1.4" stroke-linecap="round"/><text x="298.0" y="117.5" font-size="7.2" text-anchor="middle" fill="#BD2543" font-weight="bold">9</text><text x="298.0" y="129.1" font-size="6.0" text-anchor="middle" fill="#BD2543" font-weight="normal">corundum</text><path d="M332.0 91.0L332.0 101.0" fill="none" stroke="#222222" stroke-width="1.4" stroke-linecap="round"/><text x="332.0" y="117.5" font-size="7.2" text-anchor="middle" fill="#BD2543" font-weight="bold">10</text><text x="332.0" y="140.1" font-size="6.0" text-anchor="middle" fill="#BD2543" font-weight="normal">diamond</text><path d="M230.0 69.0L230.0 89.0" fill="none" stroke="#BD2543" stroke-width="1.0" stroke-linecap="round"/><path d="M231.4 85.0L230.0 89.0L228.6 85.0Z" fill="#BD2543"/><text x="230" y="66.4" font-size="6.8" text-anchor="middle" fill="#BD2543" font-weight="bold">7 quartz</text><path d="M297.0 51.0L297.0 89.0" fill="none" stroke="#BD2543" stroke-width="1.0" stroke-linecap="round"/><path d="M298.4 85.0L297.0 89.0L295.6 85.0Z" fill="#BD2543"/><text x="297" y="48.4" font-size="6.8" text-anchor="middle" fill="#BD2543" font-weight="bold">9 corundum</text><path d="M330.0 69.0L330.0 89.0" fill="none" stroke="#BD2543" stroke-width="1.0" stroke-linecap="round"/><path d="M331.4 85.0L330.0 89.0L328.6 85.0Z" fill="#BD2543"/><text x="356" y="66.4" font-size="6.8" text-anchor="end" fill="#BD2543" font-weight="bold">10 diamond</text><rect x="6.0" y="152.0" width="348.0" height="58.0" rx="5" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1"/><text x="180.0" y="166.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">the four abrasives a workshop actually buys</text><text x="180.0" y="180.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">natural: sandstone, emery (60 % alumina), corundum, diamond</text><text x="180.0" y="192.2" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">synthetic: silicon carbide Knoop 2500, alumina 2100, CBN 4500, diamond 7000</text><text x="180.0" y="203.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">bond: vitrified for a bench wheel, resinoid for a cut-off, paper for finishing</text><rect x="6.0" y="216.0" width="348.0" height="58.0" rx="5" fill="#EAF4F2" stroke="#00695C" stroke-width="1"/><text x="180.0" y="230.9" font-size="8.2" text-anchor="middle" fill="#00695C" font-weight="bold">grit number runs the other way from the grain</text><text x="180.0" y="244.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">coarse 8 - 24 for snagging castings; medium 30 - 60 for a general bench wheel</text><text x="180.0" y="256.2" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">fine 80 - 180 for a cutting edge; 220 - 600 for lapping and a mirror finish</text><text x="180.0" y="267.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">a harder wheel is used on soft work, a softer wheel on hard work - never the reverse</text><text x="180.0" y="291.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">Abrasive, bond and grit are three separate choices: the grit cuts, the bond lets</text><text x="180.0" y="303.5" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">the dull grain fall out, and the abrasive decides what it can possibly cut.</text></svg>