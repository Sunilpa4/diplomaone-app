22" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><path d="M160.6 108.0L156.8 112.7L149.2 112.7L145.4 108.0L149.2 103.3L156.8 103.3Z" fill="#F1F5FA" stroke="#222222" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><path d="M112.6 126.0L108.8 130.7L101.2 130.7L97.4 126.0L101.2 121.3L108.8 121.3Z" fill="#F1F5FA" stroke="#222222" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><path d="M128.6 126.0L124.8 130.7L117.2 130.7L113.4 126.0L117.2 121.3L124.8 121.3Z" fill="#F1F5FA" stroke="#222222" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><path d="M144.6 126.0L140.8 130.7L133.2 130.7L129.4 126.0L133.2 121.3L140.8 121.3Z" fill="#F1F5FA" stroke="#222222" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><path d="M160.6 126.0L156.8 130.7L149.2 130.7L145.4 126.0L149.2 121.3L156.8 121.3Z" fill="#F1F5FA" stroke="#222222" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><path d="M120.6 144.0L116.8 148.7L109.2 148.7L105.4 144.0L109.2 139.3L116.8 139.3Z" fill="#F1F5FA" stroke="#222222" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><path d="M136.6 144.0L132.8 148.7L125.2 148.7L121.4 144.0L125.2 139.3L132.8 139.3Z" fill="#F1F5FA" stroke="#222222" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><path d="M152.6 144.0L148.8 148.7L141.2 148.7L137.4 144.0L141.2 139.3L148.8 139.3Z" fill="#F1F5FA" stroke="#222222" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><path d="M120.6 162.0L116.8 166.7L109.2 166.7L105.4 162.0L109.2 157.3L116.8 157.3Z" fill="#F1F5FA" stroke="#222222" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><path d="M136.6 162.0L132.8 166.7L125.2 166.7L121.4 162.0L125.2 157.3L132.8 157.3Z" fill="#F1F5FA" stroke="#222222" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><path d="M152.6 162.0L148.8 166.7L141.2 166.7L137.4 162.0L141.2 157.3L148.8 157.3Z" fill="#F1F5FA" stroke="#222222" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><path d="M128.6 180.0L124.8 184.7L117.2 184.7L113.4 180.0L117.2 175.3L124.8 175.3Z" fill="#F1F5FA" stroke="#222222" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><path d="M144.6 180.0L140.8 184.7L133.2 184.7L129.4 180.0L133.2 175.3L140.8 175.3Z" fill="#F1F5FA" stroke="#222222" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><path d="M60.0 52.0L66.0 56.0L90.0 214.0L84.0 218.0Z" fill="#EDEDED" stroke="#222222" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M198.0 52.0L192.0 56.0L168.0 214.0L174.0 218.0Z" fill="#EDEDED" stroke="#222222" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M78.0 105.0L206.0 92.0" fill="none" stroke="#666666" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="2,2"/><circle cx="78.0" cy="105.0" r="1.5" fill="#666666"/><text x="210" y="90.3" font-size="6.6" text-anchor="start" fill="#222" font-weight="normal">chill zone: fine</text><text x="210" y="100.3" font-size="6.6" text-anchor="start" fill="#666666" font-weight="normal">equiaxed grains</text><path d="M84.0 138.0L206.0 132.0" fill="none" stroke="#666666" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="2,2"/><circle cx="84.0" cy="138.0" r="1.5" fill="#666666"/><text x="210" y="130.3" font-size="6.6" text-anchor="start" fill="#222" font-weight="normal">columnar grains:</text><text x="210" y="140.3" font-size="6.6" text-anchor="start" fill="#666666" font-weight="normal">long, inward,</text><text x="210" y="150.3" font-size="6.6" text-anchor="start" fill="#666666" font-weight="normal">along heat flow</text><path d="M130.0 168.0L206.0 170.0" fill="none" stroke="#666666" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="2,2"/><circle cx="130.0" cy="168.0" r="1.5" fill="#666666"/><text x="210" y="168.3" font-size="6.6" text-anchor="start" fill="#222" font-weight="normal">equiaxed centre:</text><text x="210" y="178.3" font-size="6.6" text-anchor="start" fill="#666666" font-weight="normal">coarse, last to freeze</text><text x="129" y="232.2" font-size="6.4" text-anchor="middle" fill="#666666" font-weight="normal">mould wall cools the metal first</text><rect x="6.0" y="224.0" width="348.0" height="58.0" rx="5" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1"/><text x="180.0" y="238.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">solidification starts at a nucleus</text><text x="180.0" y="252.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">homogeneous: atoms of the melt cluster on their own - needs large undercooling</text><text x="180.0" y="264.2" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">heterogeneous: the mould wall or an oxide particle does the job - needs little</text><text x="180.0" y="275.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">a grain refiner (Ti, B in aluminium) adds such nuclei and makes many small grains</text><text x="180.0" y="295.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">Small grains raise the yield strength (Hall-Petch) and spread the shrinkage</text><text x="180.0" y="307.5" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">porosity, so a refiner is added to almost every casting alloy.</text></svg>