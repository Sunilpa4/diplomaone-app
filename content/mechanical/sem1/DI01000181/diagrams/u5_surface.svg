<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 286" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="286" fill="#ffffff"/><text x="180.0" y="24.3" font-size="12.2" text-anchor="middle" fill="#222222" font-weight="bold">The surface is a different material</text><text x="180.0" y="40.2" font-size="9.2" text-anchor="middle" fill="#666666" font-weight="normal">the top micrometres decide the life</text><path d="M40.0 52.0L230.0 52.0L230.0 62.0L40.0 62.0Z" fill="#F6E3C5" stroke="#B66A00" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/><path d="M40.0 62.0L230.0 62.0L230.0 92.0L40.0 92.0Z" fill="#DCEEFB" stroke="#1565C0" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/><path d="M40.0 92.0L230.0 92.0L230.0 150.0L40.0 150.0Z" fill="#E7EDF3" stroke="#9AA3AD" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/><text x="135" y="82.2" font-size="6.4" text-anchor="middle" fill="#1565C0" font-weight="bold">diffused or work-hardened zone, 0.1 - 1 mm</text><text x="135" y="127.2" font-size="6.4" text-anchor="middle" fill="#666666" font-weight="normal">bulk metal: unchanged</text><path d="M230.0 57.0L240.0 57.0" fill="none" stroke="#9AA3AD" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="2,2"/><circle cx="230.0" cy="57.0" r="1.5" fill="#9AA3AD"/><text x="244" y="57.2" font-size="6.4" text-anchor="start" fill="#B66A00" font-weight="bold">coating or converted</text><text x="244" y="66.2" font-size="6.2" text-anchor="start" fill="#B66A00" font-weight="normal">layer, 5 - 25 micron</text><text x="40" y="166.2" font-size="6.4" text-anchor="start" fill="#666666" font-weight="normal">bending stress is highest at the surface: the outer 10 % of a</text><text x="40" y="176.2" font-size="6.4" text-anchor="start" fill="#666666" font-weight="normal">shaft carries 19 % of the moment, the outer 1 % carries 2 %.</text><rect x="6.0" y="184.0" width="348.0" height="68.0" rx="5" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1"/><text x="180.0" y="198.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">four things a surface has to do, and the process for each</text><text x="180.0" y="212.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">wear: a hard film or a nitrided skin, 900 - 1100 HV on a tough core</text><text x="180.0" y="224.2" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">corrosion: a barrier of paint, plating or oxide, or a sacrificial zinc</text><text x="180.0" y="235.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">fatigue: a compressive skin from shot peening or roller burnishing</text><text x="180.0" y="247.2" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">friction: phosphate plus oil, or a low-friction coating such as PTFE</text><text x="180.0" y="267.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">A part almost never fails in the middle: fretting, pitting, fatigue and wear all</text><text x="180.0" y="279.5" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">begin in the first few micrometres, which is why the surface is engineered.</text></svg>