<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="300" fill="#ffffff"/><text x="180.0" y="24.3" font-size="12.2" text-anchor="middle" fill="#222222" font-weight="bold">Every coating, on one scale of thickness</text><text x="180.0" y="40.2" font-size="9.2" text-anchor="middle" fill="#666666" font-weight="normal">from 0.3 micron to 220 micron</text><text x="120" y="64.2" font-size="6.4" text-anchor="end" fill="#222" font-weight="normal">chromate passivation</text><path d="M126.0 54.5L128.0 54.5L128.0 62.5L126.0 62.5Z" fill="#EFE4FB" stroke="#7B2CD9" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><text x="133.0" y="64.2" font-size="6.2" text-anchor="start" fill="#666666" font-weight="normal">0.3 um</text><text x="120" y="82.2" font-size="6.4" text-anchor="end" fill="#222" font-weight="normal">PVD TiN film</text><path d="M126.0 72.5L128.2 72.5L128.2 80.5L126.0 80.5Z" fill="#D8EDEA" stroke="#00695C" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><text x="133.15" y="82.2" font-size="6.2" text-anchor="start" fill="#666666" font-weight="normal">3 um</text><text x="120" y="100.2" font-size="6.4" text-anchor="end" fill="#222" font-weight="normal">phosphate coating</text><path d="M126.0 90.5L129.6 90.5L129.6 98.5L126.0 98.5Z" fill="#F6E3C5" stroke="#B66A00" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><text x="134.58333333333334" y="100.2" font-size="6.2" text-anchor="start" fill="#666666" font-weight="normal">5 um</text><text x="120" y="118.2" font-size="6.4" text-anchor="end" fill="#222" font-weight="normal">CVD coating</text><path d="M126.0 108.5L133.2 108.5L133.2 116.5L126.0 116.5Z" fill="#D8EDEA" stroke="#00695C" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><text x="138.16666666666666" y="118.2" font-size="6.2" text-anchor="start" fill="#666666" font-weight="normal">10 um</text><text x="120" y="136.2" font-size="6.4" text-anchor="end" fill="#222" font-weight="normal">electroplated zinc</text><path d="M126.0 126.5L136.8 126.5L136.8 134.5L126.0 134.5Z" fill="#DCEEFB" stroke="#1565C0" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><text x="141.75" y="136.2" font-size="6.2" text-anchor="start" fill="#666666" font-weight="normal">15 um</text><text x="120" y="154.2" font-size="6.4" text-anchor="end" fill="#222" font-weight="normal">anodised aluminium</text><path d="M126.0 144.5L140.3 144.5L140.3 152.5L126.0 152.5Z" fill="#DCEEFB" stroke="#1565C0" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><text x="145.33333333333334" y="154.2" font-size="6.2" text-anchor="start" fill="#666666" font-weight="normal">20 um</text><text x="120" y="172.2" font-size="6.4" text-anchor="end" fill="#222" font-weight="normal">hot dip galvanising</text><path d="M126.0 162.5L183.3 162.5L183.3 170.5L126.0 170.5Z" fill="#E9EDF1" stroke="#666666" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><text x="188.33333333333331" y="172.2" font-size="6.2" text-anchor="start" fill="#666666" font-weight="normal">80 um</text><text x="120" y="190.2" font-size="6.4" text-anchor="end" fill="#222" font-weight="normal">paint system, 3 coats</text><path d="M126.0 180.5L283.7 180.5L283.7 188.5L126.0 188.5Z" fill="#D8EEDA" stroke="#2E7D32" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><text x="288.66666666666663" y="190.2" font-size="6.2" text-anchor="start" fill="#666666" font-weight="normal">220 um</text><rect x="6.0" y="208.0" width="348.0" height="58.0" rx="5" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1"/><text x="180.0" y="222.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">what the thickness buys, and what it costs</text><text x="180.0" y="236.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">PVD is thin because it is hard and dense; paint is thick because it is a barrier</text><text x="180.0" y="248.2" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">zinc protects by being consumed, so its thickness is a life in years, not a finish</text><text x="180.0" y="259.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">hot dip 80 um in a rural atmosphere is 20 years; the same steel painted is 8</text><text x="180.0" y="283.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">Thickness is the first number on any coating specification, and the second is</text><text x="180.0" y="295.5" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">adhesion: a thick coat that lifts is worse than a thin one that stays.</text></svg>