<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 282" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="282" fill="#ffffff"/><text x="180.0" y="24.3" font-size="12.2" text-anchor="middle" fill="#222222" font-weight="bold">Embodied energy per kg, and what recycling saves</text><text x="180.0" y="40.2" font-size="9.2" text-anchor="middle" fill="#666666" font-weight="normal">MJ to deliver one kilogram, on a linear scale</text><text x="96" y="64.4" font-size="6.8" text-anchor="end" fill="#222" font-weight="normal">concrete</text><path d="M104.0 54.5L104.4 54.5L104.4 62.5L104.0 62.5Z" fill="#E9EDF1" stroke="#666666" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><text x="109.38" y="64.2" font-size="6.2" text-anchor="start" fill="#666666" font-weight="normal">1</text><text x="130.38" y="64.0" font-size="5.8" text-anchor="start" fill="#2E7D32" font-weight="normal">rec 0.9</text><text x="96" y="84.4" font-size="6.8" text-anchor="end" fill="#222" font-weight="normal">glass</text><path d="M104.0 74.5L109.7 74.5L109.7 82.5L104.0 82.5Z" fill="#D8EDEA" stroke="#00695C" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><text x="114.7" y="84.2" font-size="6.2" text-anchor="start" fill="#666666" font-weight="normal">15</text><text x="135.7" y="84.0" font-size="5.8" text-anchor="start" fill="#2E7D32" font-weight="normal">rec 12</text><text x="96" y="104.4" font-size="6.8" text-anchor="end" fill="#222" font-weight="normal">steel</text><path d="M104.0 94.5L113.5 94.5L113.5 102.5L104.0 102.5Z" fill="#DCEEFB" stroke="#1565C0" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><text x="118.5" y="104.2" font-size="6.2" text-anchor="start" fill="#666666" font-weight="normal">25</text><text x="139.5" y="104.0" font-size="5.8" text-anchor="start" fill="#2E7D32" font-weight="normal">rec 10</text><text x="96" y="124.4" font-size="6.8" text-anchor="end" fill="#222" font-weight="normal">PET plastic</text><path d="M104.0 114.5L134.4 114.5L134.4 122.5L104.0 122.5Z" fill="#F6E3C5" stroke="#B66A00" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><text x="139.4" y="124.2" font-size="6.2" text-anchor="start" fill="#666666" font-weight="normal">80</text><text x="160.4" y="124.0" font-size="5.8" text-anchor="start" fill="#2E7D32" font-weight="normal">rec 40</text><text x="96" y="144.4" font-size="6.8" text-anchor="end" fill="#222" font-weight="normal">aluminium</text><path d="M104.0 134.5L168.6 134.5L168.6 142.5L104.0 142.5Z" fill="#EFE4FB" stroke="#7B2CD9" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><text x="173.60000000000002" y="144.2" font-size="6.2" text-anchor="start" fill="#666666" font-weight="normal">170</text><text x="194.60000000000002" y="144.0" font-size="5.8" text-anchor="start" fill="#2E7D32" font-weight="normal">rec 8</text><text x="96" y="164.4" font-size="6.8" text-anchor="end" fill="#222" font-weight="normal">CFRP</text><path d="M104.0 154.5L294.0 154.5L294.0 162.5L104.0 162.5Z" fill="#F7DDE3" stroke="#BD2543" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><text x="299.0" y="164.2" font-size="6.2" text-anchor="start" fill="#666666" font-weight="normal">500</text><text x="320.0" y="164.0" font-size="5.8" text-anchor="start" fill="#2E7D32" font-weight="normal">rec 300</text><rect x="6.0" y="190.0" width="348.0" height="58.0" rx="5" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1"/><text x="180.0" y="204.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">why aluminium is the recycling material</text><text x="180.0" y="218.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">170 MJ/kg new against 8 MJ/kg from scrap: a saving of 95 % of the energy</text><text x="180.0" y="230.2" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">steel saves 60 %, glass 20 %, and a plastic only 50 % because it is a polymer</text><text x="180.0" y="241.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">one aluminium can recycled saves enough electricity to run a television for 3 h</text><text x="180.0" y="265.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">The energy is in the metal, not in the shape: melting scrap takes a furnace, but</text><text x="180.0" y="277.5" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">winning it from ore takes a mine, a refinery and a great deal of electricity.</text></svg>