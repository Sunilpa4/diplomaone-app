<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="320" fill="#ffffff"/><text x="180.0" y="24.3" font-size="12.2" text-anchor="middle" fill="#222222" font-weight="bold">Substitutional and interstitial solid solutions</text><text x="180.0" y="40.2" font-size="9.2" text-anchor="middle" fill="#666666" font-weight="normal">where the second atom goes</text><rect x="6.0" y="46.0" width="168.0" height="128.0" rx="6" fill="#FBFCFD" stroke="#9AA3AD" stroke-width="0.9"/><rect x="186.0" y="46.0" width="168.0" height="128.0" rx="6" fill="#FBFCFD" stroke="#9AA3AD" stroke-width="0.9"/><text x="90" y="64.8" font-size="8.0" text-anchor="middle" fill="#1565C0" font-weight="bold">substitutional: Cu-Ni</text><text x="270" y="64.8" font-size="8.0" text-anchor="middle" fill="#BD2543" font-weight="bold">interstitial: C in Fe</text><circle cx="34.0" cy="82.0" r="9.5" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.2"/><text x="34" y="85.7" font-size="5.2" text-anchor="middle" fill="#1565C0" font-weight="bold">Cu</text><circle cx="72.0" cy="82.0" r="9.5" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.2"/><text x="72" y="85.7" font-size="5.2" text-anchor="middle" fill="#1565C0" font-weight="bold">Cu</text><circle cx="110.0" cy="82.0" r="9.5" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.2"/><text x="110" y="85.7" font-size="5.2" text-anchor="middle" fill="#1565C0" font-weight="bold">Cu</text><circle cx="148.0" cy="82.0" r="9.5" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.2"/><text x="148" y="85.7" font-size="5.2" text-anchor="middle" fill="#1565C0" font-weight="bold">Cu</text><circle cx="34.0" cy="108.0" r="9.5" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.2"/><text x="34" y="111.7" font-size="5.2" text-anchor="middle" fill="#1565C0" font-weight="bold">Cu</text><circle cx="72.0" cy="108.0" r="9.5" fill="#FFF3E4" stroke="#B66A00" stroke-width="1.2"/><text x="72" y="111.7" font-size="5.2" text-anchor="middle" fill="#B66A00" font-weight="bold">Ni</text><circle cx="110.0" cy="108.0" r="9.5" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.2"/><text x="110" y="111.7" font-size="5.2" text-anchor="middle" fill="#1565C0" font-weight="bold">Cu</text><circle cx="148.0" cy="108.0" r="9.5" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.2"/><text x="148" y="111.7" font-size="5.2" text-anchor="middle" fill="#1565C0" font-weight="bold">Cu</text><circle cx="34.0" cy="134.0" r="9.5" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.2"/><text x="34" y="137.7" font-size="5.2" text-anchor="middle" fill="#1565C0" font-weight="bold">Cu</text><circle cx="72.0" cy="134.0" r="9.5" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.2"/><text x="72" y="137.7" font-size="5.2" text-anchor="middle" fill="#1565C0" font-weight="bold">Cu</text><circle cx="110.0" cy="134.0" r="9.5" fill="#FFF3E4" stroke="#B66A00" stroke-width="1.2"/><text x="110" y="137.7" font-size="5.2" text-anchor="middle" fill="#B66A00" font-weight="bold">Ni</text><circle cx="148.0" cy="134.0" r="9.5" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.2"/><text x="148" y="137.7" font-size="5.2" text-anchor="middle" fill="#1565C0" font-weight="bold">Cu</text><circle cx="34.0" cy="160.0" r="9.5" fill="#FFF3E4" stroke="#B66A00" stroke-width="1.2"/><text x="34" y="163.7" font-size="5.2" text-anchor="middle" fill="#B66A00" font-weight="bold">Ni</text><circle cx="72.0" cy="160.0" r="9.5" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.2"/><text x="72" y="163.7" font-size="5.2" text-anchor="middle" fill="#1565C0" font-weight="bold">Cu</text><circle cx="110.0" cy="160.0" r="9.5" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.2"/><text x="110" y="163.7" font-size="5.2" text-anchor="middle" fill="#1565C0" font-weight="bold">Cu</text><circle cx="148.0" cy="160.0" r="9.5" fill="#FFF3E4" stroke="#B66A00" stroke-width="1.2"/><text x="148" y="163.7" font-size="5.2" text-anchor="middle" fill="#B66A00" font-weight="bold">Ni</text><text x="90" y="188.2" font-size="6.2" text-anchor="middle" fill="#666666" font-weight="normal">Cu radius 128 pm, Ni 125 pm: a 2 % difference</text><text x="90" y="198.2" font-size="6.2" text-anchor="middle" fill="#666666" font-weight="normal">so either atom can take the other's place</text><circle cx="214.0" cy="82.0" r="11.0" fill="#EEF2F7" stroke="#8894A6" stroke-width="1.2"/><text x="214" y="85.8" font-size="5.4" text-anchor="middle" fill="#8894A6" font-weight="bold">Fe</text><circle cx="252.0" cy="82.0" r="11.0" fill="#EEF2F7" stroke="#8894A6" stroke-width="1.2"/><text x="252" y="85.8" font-size="5.4" text-anchor="middle" fill="#8894A6" font-weight="bold">Fe</text><circle cx="290.0" cy="82.0" r="11.0" fill="#EEF2F7" stroke="#8894A6" stroke-width="1.2"/><text x="290" y="85.8" font-size="5.4" text-anchor="middle" fill="#8894A6" font-weight="bold">Fe</text><circle cx="328.0" cy="82.0" r="11.0" fill="#EEF2F7" stroke="#8894A6" stroke-width="1.2"/><text x="328" y="85.8" font-size="5.4" text-anchor="middle" fill="#8894A6" font-weight="bold">Fe</text><circle cx="214.0" cy="108.0" r="11.0" fill="#EEF2F7" stroke="#8894A6" stroke-width="1.2"/><text x="214" y="111.8" font-size="5.4" text-anchor="middle" fill="#8894A6" font-weight="bold">Fe</text><circle cx="252.0" cy="108.0" r="11.0" fill="#EEF2F7" stroke="#8894A6" stroke-width="1.2"/><text x="252" y="111.8" font-size="5.4" text-anchor="middle" fill="#8894A6" font-weight="bold">Fe</text><circle cx="290.0" cy="108.0" r="11.0" fill="#EEF2F7" stroke="#8894A6" stroke-width="1.2"/><text x="290" y="111.8" font-size="5.4" text-anchor="middle" fill="#8894A6" font-weight="bold">Fe</text><circle cx="328.0" cy="108.0" r="11.0" fill="#EEF2F7" stroke="#8894A6" stroke-width="1.2"/><text x="328" y="111.8" font-size="5.4" text-anchor="middle" fill="#8894A6" font-weight="bold">Fe</text><circle cx="214.0" cy="134.0" r="11.0" fill="#EEF2F7" stroke="#8894A6" stroke-width="1.2"/><text x="214" y="137.8" font-size="5.4" text-anchor="middle" fill="#8894A6" font-weight="bold">Fe</text><circle cx="252.0" cy="134.0" r="11.0" fill="#EEF2F7" stroke="#8894A6" stroke-width="1.2"/><text x="252" y="137.8" font-size="5.4" text-anchor="middle" fill="#8894A6" font-weight="bold">Fe</text><circle cx="290.0" cy="134.0" r="11.0" fill="#EEF2F7" stroke="#8894A6" stroke-width="1.2"/><text x="290" y="137.8" font-size="5.4" text-anchor="middle" fill="#8894A6" font-weight="bold">Fe</text><circle cx="328.0" cy="134.0" r="11.0" fill="#EEF2F7" stroke="#8894A6" stroke-width="1.2"/><text x="328" y="137.8" font-size="5.4" text-anchor="middle" fill="#8894A6" font-weight="bold">Fe</text><circle cx="214.0" cy="160.0" r="11.0" fill="#EEF2F7" stroke="#8894A6" stroke-width="1.2"/><text x="214" y="163.8" font-size="5.4" text-anchor="middle" fill="#8894A6" font-weight="bold">Fe</text><circle cx="252.0" cy="160.0" r="11.0" fill="#EEF2F7" stroke="#8894A6" stroke-width="1.2"/><text x="252" y="163.8" font-size="5.4" text-anchor="middle" fill="#8894A6" font-weight="bold">Fe</text><circle cx="290.0" cy="160.0" r="11.0" fill="#EEF2F7" stroke="#8894A6" stroke-width="1.2"/><text x="290" y="163.8" font-size="5.4" text-anchor="middle" fill="#8894A6" font-weight="bold">Fe</text><circle cx="328.0" cy="160.0" r="11.0" fill="#EEF2F7" stroke="#8894A6" stroke-width="1.2"/><text x="328" y="163.8" font-size="5.4" text-anchor="middle" fill="#8894A6" font-weight="bold">Fe</text><circle cx="233.0" cy="95.0" r="3.2" fill="#BD2543"/><circle cx="271.0" cy="95.0" r="3.2" fill="#BD2543"/><circle cx="309.0" cy="95.0" r="3.2" fill="#BD2543"/><circle cx="233.0" cy="121.0" r="3.2" fill="#BD2543"/><circle cx="271.0" cy="121.0" r="3.2" fill="#BD2543"/><circle cx="309.0" cy="121.0" r="3.2" fill="#BD2543"/><circle cx="233.0" cy="147.0" r="3.2" fill="#BD2543"/><circle cx="271.0" cy="147.0" r="3.2" fill="#BD2543"/><circle cx="309.0" cy="147.0" r="3.2" fill="#BD2543"/><text x="270" y="188.2" font-size="6.2" text-anchor="middle" fill="#666666" font-weight="normal">carbon radius 77 pm against iron 126 pm</text><text x="270" y="198.2" font-size="6.2" text-anchor="middle" fill="#666666" font-weight="normal">so carbon sits in the gaps, not on a site</text><rect x="6.0" y="206.0" width="348.0" height="68.0" rx="5" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1"/><text x="180.0" y="220.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">the four Hume-Rothery rules for a substitutional solution</text><text x="180.0" y="234.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">1  size factor: the radii differ by less than 15 %</text><text x="180.0" y="246.2" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">2  crystal structure: the same lattice type</text><text x="180.0" y="257.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">3  valency: the same valency, or one metal dissolves less of a higher-valency one</text><text x="180.0" y="269.2" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">4  electronegativity: close values, else a compound forms instead of a solution</text><text x="180.0" y="289.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">Substitutional: brass (Zn in Cu), stainless steel (Cr, Ni in Fe).  Interstitial:</text><text x="180.0" y="301.5" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">carbon or nitrogen in iron - small atoms, few by count, but they control hardness.</text></svg>