" text-anchor="end" fill="#666666" font-weight="normal">20</text><path d="M325.0 92.5L328.0 92.5" fill="none" stroke="#666666" stroke-width="1.0" stroke-linecap="round"/><text x="323" y="97.4" font-size="6.6" text-anchor="end" fill="#666666" font-weight="normal">30</text><text x="331" y="50.7" font-size="7.6" text-anchor="end" fill="#666666" font-weight="bold">elongation (%)</text><path d="M71.4 92.5L92.8 102.8L135.5 127.0L178.3 144.2L221.1 161.5L263.8 171.8L306.6 178.8" fill="none" stroke="#2E7D32" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5,3"/><circle cx="71.4" cy="92.5" r="1.5" fill="#2E7D32"/><circle cx="92.8" cy="102.8" r="1.5" fill="#2E7D32"/><circle cx="135.5" cy="127.0" r="1.5" fill="#2E7D32"/><circle cx="178.3" cy="144.2" r="1.5" fill="#2E7D32"/><circle cx="221.1" cy="161.5" r="1.5" fill="#2E7D32"/><circle cx="263.8" cy="171.8" r="1.5" fill="#2E7D32"/><circle cx="306.6" cy="178.8" r="1.5" fill="#2E7D32"/><rect x="6.0" y="240.0" width="348.0" height="52.0" rx="5" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1"/><text x="180.0" y="254.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">what the two curves say together</text><text x="180.0" y="268.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">0.1 % C: 400 MPa but 30 % elongation - sheet, wire, car body</text><text x="180.0" y="280.2" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">0.4 % C: 600 MPa and 20 % - shafts and axles, the engineering compromise</text><text x="180.0" y="291.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">0.8 % C and above: 800 to 900 MPa with under 10 % - springs and cutting tools</text><text x="180.0" y="305.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">Strength x ductility is largest around 0.2 to 0.4 % C; above the eutectoid the</text><text x="180.0" y="317.5" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">cementite network makes the steel brittle faster than it makes it strong.</text></svg>