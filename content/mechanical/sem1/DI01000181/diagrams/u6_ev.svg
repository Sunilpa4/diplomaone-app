<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 296" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="296" fill="#ffffff"/><text x="180.0" y="24.3" font-size="12.2" text-anchor="middle" fill="#222222" font-weight="bold">What a 1500 kg electric car is made of</text><text x="180.0" y="40.2" font-size="9.2" text-anchor="middle" fill="#666666" font-weight="normal">mass in kilograms, and share of the car</text><text x="112" y="62.2" font-size="6.4" text-anchor="end" fill="#222" font-weight="normal">steel and AHSS</text><path d="M118.0 52.0L188.2 52.0L188.2 61.0L118.0 61.0Z" fill="#E9EDF1" stroke="#666666" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><text x="193.2" y="62.2" font-size="6.2" text-anchor="start" fill="#666666" font-weight="normal">675 kg</text><text x="228.2" y="62.1" font-size="6.0" text-anchor="start" fill="#222222" font-weight="normal">45 %</text><text x="112" y="83.2" font-size="6.4" text-anchor="end" fill="#222" font-weight="normal">aluminium</text><path d="M118.0 73.0L149.2 73.0L149.2 82.0L118.0 82.0Z" fill="#DCEEFB" stroke="#1565C0" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><text x="154.2" y="83.2" font-size="6.2" text-anchor="start" fill="#666666" font-weight="normal">300 kg</text><text x="189.2" y="83.1" font-size="6.0" text-anchor="start" fill="#222222" font-weight="normal">20 %</text><text x="112" y="104.2" font-size="6.4" text-anchor="end" fill="#222" font-weight="normal">battery pack</text><path d="M118.0 94.0L141.4 94.0L141.4 103.0L118.0 103.0Z" fill="#EFE4FB" stroke="#7B2CD9" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><text x="146.4" y="104.2" font-size="6.2" text-anchor="start" fill="#666666" font-weight="normal">225 kg</text><text x="181.4" y="104.1" font-size="6.0" text-anchor="start" fill="#222222" font-weight="normal">15 %</text><text x="112" y="125.2" font-size="6.4" text-anchor="end" fill="#222" font-weight="normal">polymers and composites</text><path d="M118.0 115.0L136.7 115.0L136.7 124.0L118.0 124.0Z" fill="#F6E3C5" stroke="#B66A00" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><text x="141.72" y="125.2" font-size="6.2" text-anchor="start" fill="#666666" font-weight="normal">180 kg</text><text x="176.72" y="125.1" font-size="6.0" text-anchor="start" fill="#222222" font-weight="normal">12 %</text><text x="112" y="146.2" font-size="6.4" text-anchor="end" fill="#222" font-weight="normal">copper</text><path d="M118.0 136.0L125.8 136.0L125.8 145.0L118.0 145.0Z" fill="#F6E3C5" stroke="#B66A00" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><text x="130.8" y="146.2" font-size="6.2" text-anchor="start" fill="#666666" font-weight="normal">75 kg</text><text x="165.8" y="146.1" font-size="6.0" text-anchor="start" fill="#222222" font-weight="normal">5 %</text><text x="112" y="167.2" font-size="6.4" text-anchor="end" fill="#222" font-weight="normal">glass and other</text><path d="M118.0 157.0L122.7 157.0L122.7 166.0L118.0 166.0Z" fill="#D8EDEA" stroke="#00695C" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><text x="127.68" y="167.2" font-size="6.2" text-anchor="start" fill="#666666" font-weight="normal">45 kg</text><text x="162.68" y="167.1" font-size="6.0" text-anchor="start" fill="#222222" font-weight="normal">3 %</text><text x="118" y="186.2" font-size="6.2" text-anchor="start" fill="#666666" font-weight="normal">total 1500 kg, of which 15 % is the battery</text><rect x="6.0" y="204.0" width="348.0" height="58.0" rx="5" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1"/><text x="180.0" y="218.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">three numbers that shape the material choice</text><text x="180.0" y="232.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">every 100 kg removed is about 0.4 kWh less energy per 100 km</text><text x="180.0" y="244.2" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">the pack is 225 kg and 35 kWh: 155 Wh per kg of pack, not of cell</text><text x="180.0" y="255.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">an EV uses 3 times the copper of a car with an engine: 75 kg against 23</text><text x="180.0" y="279.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">The green car is not a different material world: it is the same steel, aluminium</text><text x="180.0" y="291.5" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">and copper, rearranged around a battery that was not there before.</text></svg>