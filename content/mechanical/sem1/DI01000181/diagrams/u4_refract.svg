<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 310" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="310" fill="#ffffff"/><text x="180.0" y="24.3" font-size="12.2" text-anchor="middle" fill="#222222" font-weight="bold">A two-layer refractory wall</text><text x="180.0" y="40.2" font-size="9.2" text-anchor="middle" fill="#666666" font-weight="normal">1200 C outside-in, and where the drop happens</text><path d="M40.0 48.0L152.0 48.0L152.0 98.0L40.0 98.0Z" fill="#F6E3C5" stroke="#B66A00" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><path d="M152.0 48.0L232.0 48.0L232.0 98.0L152.0 98.0Z" fill="#DCEEFB" stroke="#1565C0" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><path d="M232.0 48.0L240.0 48.0L240.0 98.0L232.0 98.0Z" fill="#BFC6CE" stroke="#222222" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="96" y="68.6" font-size="7.4" text-anchor="middle" fill="#B66A00" font-weight="bold">firebrick</text><text x="96" y="81.2" font-size="6.4" text-anchor="middle" fill="#222222" font-weight="normal">230 mm, k 1.0</text><text x="192" y="68.6" font-size="7.4" text-anchor="middle" fill="#1565C0" font-weight="bold">insulation</text><text x="192" y="81.2" font-size="6.4" text-anchor="middle" fill="#222222" font-weight="normal">115 mm, k 0.12</text><text x="44" y="96.2" font-size="6.2" text-anchor="start" fill="#BD2543" font-weight="bold">hot face 1200 C</text><text x="246" y="96.2" font-size="6.2" text-anchor="start" fill="#666666" font-weight="bold">50 C</text><text x="246" y="68.2" font-size="6.2" text-anchor="start" fill="#666666" font-weight="normal">steel</text><text x="246" y="79.2" font-size="6.2" text-anchor="start" fill="#666666" font-weight="normal">shell</text><path d="M40.0 186.0L240.0 186.0" fill="none" stroke="#222222" stroke-width="1.2" stroke-linecap="round"/><path d="M40.0 112.0L40.0 186.0" fill="none" stroke="#222222" stroke-width="1.2" stroke-linecap="round"/><path d="M40.0 165.1L240.0 165.1" fill="none" stroke="#9AA3AD" stroke-width="0.9" stroke-linecap="round" stroke-dasharray="3,3"/><text x="36" y="169.8" font-size="6.2" text-anchor="end" fill="#666666" font-weight="normal">400</text><path d="M40.0 144.2L240.0 144.2" fill="none" stroke="#9AA3AD" stroke-width="0.9" stroke-linecap="round" stroke-dasharray="3,3"/><text x="36" y="148.9" font-size="6.2" text-anchor="end" fill="#666666" font-weight="normal">800</text><path d="M40.0 123.2L240.0 123.2" fill="none" stroke="#9AA3AD" stroke-width="0.9" stroke-linecap="round" stroke-dasharray="3,3"/><text x="36" y="128.0" font-size="6.2" text-anchor="end" fill="#666666" font-weight="normal">1200</text><path d="M40.0 123.2L152.0 134.9" fill="none" stroke="#BD2543" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M152.0 134.9L232.0 183.4" fill="none" stroke="#1565C0" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="40.0" cy="123.2" r="1.8" fill="#222222"/><circle cx="152.0" cy="134.9" r="1.8" fill="#222222"/><circle cx="232.0" cy="183.4" r="1.8" fill="#222222"/><text x="160.0" y="131.1" font-size="6.4" text-anchor="start" fill="#222222" font-weight="bold">977 C</text><text x="240" y="200.3" font-size="6.6" text-anchor="end" fill="#222222" font-weight="bold">thickness, mm</text><text x="8" y="108.4" font-size="6.8" text-anchor="start" fill="#222222" font-weight="bold">C</text><text x="250" y="126.3" font-size="6.6" text-anchor="start" fill="#222" font-weight="bold">q = 1150 / 1.188</text><text x="250" y="138.3" font-size="6.6" text-anchor="start" fill="#1565C0" font-weight="normal">= 968 W/m2</text><text x="250" y="154.2" font-size="6.2" text-anchor="start" fill="#666666" font-weight="normal">without the</text><text x="250" y="164.2" font-size="6.2" text-anchor="start" fill="#666666" font-weight="normal">insulation:</text><text x="250" y="176.2" font-size="6.4" text-anchor="start" fill="#BD2543" font-weight="bold">5000 W/m2</text><text x="250" y="188.2" font-size="6.4" text-anchor="start" fill="#2E7D32" font-weight="bold">80 % saved</text><rect x="6.0" y="206.0" width="348.0" height="68.0" rx="5" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1"/><text x="180.0" y="220.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">refractory families, and the slag rule</text><text x="180.0" y="234.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">acidic silica (SiO2) for glass tanks; basic magnesia and dolomite for steel ladles</text><text x="180.0" y="246.2" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">neutral chromite and graphite where the slag swings either way</text><text x="180.0" y="257.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">an acid brick against a basic slag is eaten in one campaign - match the slag</text><text x="180.0" y="269.2" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">the working face must also resist spalling: heat cycles crack a dense brick</text><text x="180.0" y="291.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">The firebrick takes 223 C of the drop and the thin insulation layer takes 927 C:</text><text x="180.0" y="303.5" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">the cheaper material does the hot work, the thin one does the saving.</text></svg>