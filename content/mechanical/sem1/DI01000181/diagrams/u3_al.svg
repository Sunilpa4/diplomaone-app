<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="330" fill="#ffffff"/><text x="180.0" y="24.3" font-size="12.2" text-anchor="middle" fill="#222222" font-weight="bold">Aluminium: the eight series and what they are for</text><text x="180.0" y="40.2" font-size="9.2" text-anchor="middle" fill="#666666" font-weight="normal">wrought alloys, 1xxx to 8xxx</text><path d="M6.0 48.0L174.0 48.0L174.0 74.0L6.0 74.0Z" fill="#FFF8EF" stroke="#B66A00" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><text x="12" y="61.7" font-size="7.6" text-anchor="start" fill="#B66A00" font-weight="bold">1xxx</text><text x="40" y="61.3" font-size="6.6" text-anchor="start" fill="#222" font-weight="normal">99 % Al</text><text x="40" y="71.0" font-size="5.8" text-anchor="start" fill="#666666" font-weight="normal">foil, busbar</text><path d="M114.0 63.0L123.9 63.0L123.9 69.0L114.0 69.0Z" fill="#C9DCF2" stroke="#1565C0" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M182.0 48.0L350.0 48.0L350.0 74.0L182.0 74.0Z" fill="#FFF8EF" stroke="#B66A00" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><text x="188" y="61.7" font-size="7.6" text-anchor="start" fill="#B66A00" font-weight="bold">2xxx</text><text x="216" y="61.3" font-size="6.6" text-anchor="start" fill="#222" font-weight="normal">Cu</text><text x="216" y="71.0" font-size="5.8" text-anchor="start" fill="#666666" font-weight="normal">aircraft skin</text><path d="M290.0 63.0L332.3 63.0L332.3 69.0L290.0 69.0Z" fill="#C9DCF2" stroke="#1565C0" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M6.0 78.0L174.0 78.0L174.0 104.0L6.0 104.0Z" fill="#FFF8EF" stroke="#B66A00" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><text x="12" y="91.7" font-size="7.6" text-anchor="start" fill="#B66A00" font-weight="bold">3xxx</text><text x="40" y="91.3" font-size="6.6" text-anchor="start" fill="#222" font-weight="normal">Mn</text><text x="40" y="101.0" font-size="5.8" text-anchor="start" fill="#666666" font-weight="normal">cooking utensils</text><path d="M114.0 93.0L125.7 93.0L125.7 99.0L114.0 99.0Z" fill="#C9DCF2" stroke="#1565C0" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M182.0 78.0L350.0 78.0L350.0 104.0L182.0 104.0Z" fill="#FFF8EF" stroke="#B66A00" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><text x="188" y="91.7" font-size="7.6" text-anchor="start" fill="#B66A00" font-weight="bold">4xxx</text><text x="216" y="91.3" font-size="6.6" text-anchor="start" fill="#222" font-weight="normal">Si</text><text x="216" y="101.0" font-size="5.8" text-anchor="start" fill="#666666" font-weight="normal">brazing sheet</text><path d="M290.0 93.0L305.3 93.0L305.3 99.0L290.0 99.0Z" fill="#C9DCF2" stroke="#1565C0" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M6.0 108.0L174.0 108.0L174.0 134.0L6.0 134.0Z" fill="#FFF8EF" stroke="#B66A00" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><text x="12" y="121.7" font-size="7.6" text-anchor="start" fill="#B66A00" font-weight="bold">5xxx</text><text x="40" y="121.3" font-size="6.6" text-anchor="start" fill="#222" font-weight="normal">Mg</text><text x="40" y="131.0" font-size="5.8" text-anchor="start" fill="#666666" font-weight="normal">marine plate</text><path d="M114.0 123.0L141.0 123.0L141.0 129.0L114.0 129.0Z" fill="#C9DCF2" stroke="#1565C0" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M182.0 108.0L350.0 108.0L350.0 134.0L182.0 134.0Z" fill="#FFF8EF" stroke="#B66A00" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><text x="188" y="121.7" font-size="7.6" text-anchor="start" fill="#B66A00" font-weight="bold">6xxx</text><text x="216" y="121.3" font-size="6.6" text-anchor="start" fill="#222" font-weight="normal">Mg + Si</text><text x="216" y="131.0" font-size="5.8" text-anchor="start" fill="#666666" font-weight="normal">extrusion, frames</text><path d="M290.0 123.0L317.9 123.0L317.9 129.0L290.0 129.0Z" fill="#C9DCF2" stroke="#1565C0" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M6.0 138.0L174.0 138.0L174.0 164.0L6.0 164.0Z" fill="#FFF8EF" stroke="#B66A00" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><text x="12" y="151.7" font-size="7.6" text-anchor="start" fill="#B66A00" font-weight="bold">7xxx</text><text x="40" y="151.3" font-size="6.6" text-anchor="start" fill="#222" font-weight="normal">Zn</text><text x="40" y="161.0" font-size="5.8" text-anchor="start" fill="#666666" font-weight="normal">aircraft wing</text><path d="M114.0 153.0L165.3 153.0L165.3 159.0L114.0 159.0Z" fill="#C9DCF2" stroke="#1565C0" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M182.0 138.0L350.0 138.0L350.0 164.0L182.0 164.0Z" fill="#FFF8EF" stroke="#B66A00" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/><text x="188" y="151.7" font-size="7.6" text-anchor="start" fill="#B66A00" font-weight="bold">8xxx</text><text x="216" y="151.3" font-size="6.6" text-anchor="start" fill="#222" font-weight="normal">other</text><text x="216" y="161.0" font-size="5.8" text-anchor="start" fill="#666666" font-weight="normal">bearings, foil</text><path d="M290.0 153.0L308.0 153.0L308.0 159.0L290.0 159.0Z" fill="#C9DCF2" stroke="#1565C0" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/><rect x="6.0" y="176.0" width="168.0" height="66.0" rx="6" fill="#FBFCFD" stroke="#9AA3AD" stroke-width="0.9"/><text x="90" y="192.6" font-size="7.4" text-anchor="middle" fill="#1565C0" font-weight="bold">wrought alloys</text><text x="90" y="206.1" font-size="6.0" text-anchor="middle" fill="#666666" font-weight="normal">rolled, forged, extruded</text><text x="90" y="220.1" font-size="6.0" text-anchor="middle" fill="#666666" font-weight="normal">1xxx - 8xxx, work hardened</text><text x="90" y="234.1" font-size="6.0" text-anchor="middle" fill="#666666" font-weight="normal">temper: O, H, T, F, W</text><rect x="186.0" y="176.0" width="168.0" height="66.0" rx="6" fill="#FBFCFD" stroke="#9AA3AD" stroke-width="0.9"/><text x="270" y="192.6" font-size="7.4" text-anchor="middle" fill="#7B2CD9" font-weight="bold">cast alloys</text><text x="270" y="206.1" font-size="6.0" text-anchor="middle" fill="#666666" font-weight="normal">sand, die, gravity cast</text><text x="270" y="220.1" font-size="6.0" text-anchor="middle" fill="#666666" font-weight="normal">LM6 (Al-Si 12): pistons</text><text x="270" y="234.1" font-size="6.0" text-anchor="middle" fill="#666666" font-weight="normal">A356-T6: wheels, housings</text><text x="180" y="174.1" font-size="6.0" text-anchor="middle" fill="#666666" font-weight="normal">bar length = tensile strength, 0 to 600 MPa</text><rect x="6.0" y="250.0" width="348.0" height="46.0" rx="5" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1"/><text x="180.0" y="264.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">why aluminium wins where weight matters</text><text x="180.0" y="278.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">density 2.70 against 7.85 for steel: the same part is 66 % lighter</text><text x="180.0" y="290.2" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">pure aluminium 110 MPa, 7075-T6 570 MPa - alloying and ageing do the work</text><text x="180.0" y="309.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">Aluminium is the third most abundant element but it never occurs free: it is won</text><text x="180.0" y="321.5" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">from bauxite by electrolysis, which is why its price follows the price of electricity.</text></svg>