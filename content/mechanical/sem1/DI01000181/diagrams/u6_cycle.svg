<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 350" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="350" fill="#ffffff"/><text x="180.0" y="24.3" font-size="12.2" text-anchor="middle" fill="#222222" font-weight="bold">The life of a material, and where it can be closed</text><text x="180.0" y="40.2" font-size="9.2" text-anchor="middle" fill="#666666" font-weight="normal">cradle to grave on the outside, cradle to cradle on the inside</text><rect x="6.0" y="48.0" width="168.0" height="58.0" rx="6" fill="#FBFCFD" stroke="#9AA3AD" stroke-width="0.9"/><text x="90" y="74.7" font-size="7.6" text-anchor="middle" fill="#666666" font-weight="bold">RAW MATERIAL</text><text x="90" y="92.2" font-size="6.2" text-anchor="middle" fill="#666666" font-weight="normal">ore, oil, biomass</text><rect x="186.0" y="48.0" width="168.0" height="58.0" rx="6" fill="#FBFCFD" stroke="#9AA3AD" stroke-width="0.9"/><text x="270" y="74.7" font-size="7.6" text-anchor="middle" fill="#1565C0" font-weight="bold">MANUFACTURE</text><text x="270" y="92.2" font-size="6.2" text-anchor="middle" fill="#666666" font-weight="normal">melting, forming, joining</text><rect x="6.0" y="152.0" width="168.0" height="58.0" rx="6" fill="#FBFCFD" stroke="#9AA3AD" stroke-width="0.9"/><text x="90" y="178.7" font-size="7.6" text-anchor="middle" fill="#B66A00" font-weight="bold">END OF LIFE</text><text x="90" y="196.2" font-size="6.2" text-anchor="middle" fill="#666666" font-weight="normal">scrap, shredding, sorting</text><rect x="186.0" y="152.0" width="168.0" height="58.0" rx="6" fill="#FBFCFD" stroke="#9AA3AD" stroke-width="0.9"/><text x="270" y="178.7" font-size="7.6" text-anchor="middle" fill="#00695C" font-weight="bold">USE</text><text x="270" y="196.2" font-size="6.2" text-anchor="middle" fill="#666666" font-weight="normal">the service life</text><path d="M176.0 76.0L184.0 76.0" fill="none" stroke="#222222" stroke-width="1.2" stroke-linecap="round"/><path d="M179.0 74.2L184.0 76.0L179.0 77.8Z" fill="#222222"/><path d="M270.0 108.0L270.0 150.0" fill="none" stroke="#222222" stroke-width="1.2" stroke-linecap="round"/><path d="M271.8 145.0L270.0 150.0L268.2 145.0Z" fill="#222222"/><path d="M184.0 180.0L176.0 180.0" fill="none" stroke="#222222" stroke-width="1.2" stroke-linecap="round"/><path d="M181.0 181.8L176.0 180.0L181.0 178.2Z" fill="#222222"/><path d="M64.0 150.0L64.0 108.0" fill="none" stroke="#2E7D32" stroke-width="1.5" stroke-linecap="round"/><path d="M62.2 113.0L64.0 108.0L65.8 113.0Z" fill="#2E7D32"/><text x="74" y="128.2" font-size="6.4" text-anchor="start" fill="#2E7D32" font-weight="bold">recycle closes the loop</text><path d="M64.0 212.0L64.0 234.0" fill="none" stroke="#BD2543" stroke-width="1.5" stroke-linecap="round"/><path d="M65.8 229.0L64.0 234.0L62.2 229.0Z" fill="#BD2543"/><text x="74" y="230.2" font-size="6.4" text-anchor="start" fill="#BD2543" font-weight="normal">landfill leaves it open</text><rect x="6.0" y="242.0" width="348.0" height="72.0" rx="5" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1"/><text x="180.0" y="256.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">a green material is green on four counts, and never on one</text><text x="180.0" y="270.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">renewable: grown again in a human lifetime - wood, cork, jute, bamboo</text><text x="180.0" y="282.2" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">recyclable: a second life with a fraction of the first energy - all metals</text><text x="180.0" y="293.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">low impact: little energy, water or toxicity per kilogram delivered</text><text x="180.0" y="305.2" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">durable: the greenest part is the one that does not have to be replaced</text><text x="180.0" y="333.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">Ask for the whole life, not the label: a bamboo chair glued with formaldehyde and</text><text x="180.0" y="345.5" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">flown across the world is not greener than a steel one that lasts forty years.</text></svg>