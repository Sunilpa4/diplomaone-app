 y="331.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">Steel holds up to 2.14 % C and cast iron above it; hypoeutectoid steel is ferrite</text><text x="180.0" y="343.5" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">plus pearlite, hypereutectoid steel is pearlite plus a brittle cementite network.</text></svg>