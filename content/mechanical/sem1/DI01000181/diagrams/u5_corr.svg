<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 274" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="274" fill="#ffffff"/><text x="180.0" y="24.3" font-size="12.2" text-anchor="middle" fill="#222222" font-weight="bold">Why steel rusts: a cell on one surface</text><text x="180.0" y="40.2" font-size="9.2" text-anchor="middle" fill="#666666" font-weight="normal">an anode, a cathode and an electrolyte between them</text><path d="M30.0 112.0L330.0 112.0L330.0 158.0L30.0 158.0Z" fill="#E7EDF3" stroke="#9AA3AD" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M30.0 84.0L330.0 84.0L330.0 112.0L30.0 112.0Z" fill="#DCEEFB" stroke="#1565C0" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/><text x="180" y="98.2" font-size="6.4" text-anchor="middle" fill="#1565C0" font-weight="normal">water film with dissolved oxygen: the electrolyte</text><text x="180" y="138.2" font-size="6.4" text-anchor="middle" fill="#666666" font-weight="normal">steel: the electron path</text><path d="M84.0 112.0L100.0 112.0L92.0 126.0Z" fill="#F7DDE3" stroke="#BD2543" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="92" y="66.5" font-size="7.0" text-anchor="middle" fill="#BD2543" font-weight="bold">anode</text><text x="92" y="75.2" font-size="6.2" text-anchor="middle" fill="#BD2543" font-weight="normal">Fe -&gt; Fe2+ + 2e-</text><path d="M92.0 78.0L92.0 90.0" fill="none" stroke="#BD2543" stroke-width="1.0" stroke-linecap="round"/><path d="M93.4 86.0L92.0 90.0L90.6 86.0Z" fill="#BD2543"/><text x="92" y="105.1" font-size="6.0" text-anchor="middle" fill="#BD2543" font-weight="normal">rust</text><text x="258" y="66.5" font-size="7.0" text-anchor="middle" fill="#1565C0" font-weight="bold">cathode</text><text x="258" y="75.2" font-size="6.2" text-anchor="middle" fill="#1565C0" font-weight="normal">O2 + 2H2O + 4e- -&gt; 4OH-</text><path d="M258.0 78.0L258.0 92.0" fill="none" stroke="#1565C0" stroke-width="1.0" stroke-linecap="round"/><path d="M259.4 88.0L258.0 92.0L256.6 88.0Z" fill="#1565C0"/><path d="M104.0 128.0L244.0 128.0" fill="none" stroke="#222222" stroke-width="1.2" stroke-linecap="round"/><path d="M239.0 126.2L244.0 128.0L239.0 129.8Z" fill="#222222"/><text x="174" y="126.2" font-size="6.2" text-anchor="middle" fill="#222222" font-weight="normal">electrons in the metal</text><rect x="6.0" y="168.0" width="348.0" height="68.0" rx="5" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1"/><text x="180.0" y="182.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">the four things every corrosion cell needs</text><text x="180.0" y="196.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">an anode that dissolves, a cathode that consumes electrons, an electrolyte, a path</text><text x="180.0" y="208.2" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">standard potentials: Mg -2.37, Zn -0.76, Fe -0.44, Cu +0.34 V against hydrogen</text><text x="180.0" y="219.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">a zinc to copper couple is 1.10 V, a zinc to iron couple is 0.32 V</text><text x="180.0" y="231.2" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">0.1 A per m2 of corrosion current is 0.116 mm of steel a year</text><text x="180.0" y="257.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">The cathode does not corrode and the anode does, so a small anode joined to a</text><text x="180.0" y="269.5" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">large cathode - a stainless bolt in a steel frame - pits through fast.</text></svg>