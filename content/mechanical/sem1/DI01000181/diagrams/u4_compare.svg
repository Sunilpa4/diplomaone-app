<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 292" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="292" fill="#ffffff"/><text x="180.0" y="24.3" font-size="12.2" text-anchor="middle" fill="#222222" font-weight="bold">Metals, ceramics and polymers side by side</text><text x="180.0" y="40.2" font-size="9.2" text-anchor="middle" fill="#666666" font-weight="normal">eight properties, one answer for each</text><rect x="6.0" y="46.0" width="74.0" height="16.0" rx="6" fill="#EFF2F6" stroke="#9AA3AD" stroke-width="0.9"/><text x="43.0" y="59.4" font-size="6.8" text-anchor="middle" fill="#222222" font-weight="bold">property</text><rect x="84.0" y="46.0" width="84.0" height="16.0" rx="6" fill="#EFF2F6" stroke="#9AA3AD" stroke-width="0.9"/><text x="126.0" y="59.4" font-size="6.8" text-anchor="middle" fill="#B66A00" font-weight="bold">METAL</text><rect x="172.0" y="46.0" width="84.0" height="16.0" rx="6" fill="#EFF2F6" stroke="#9AA3AD" stroke-width="0.9"/><text x="214.0" y="59.4" font-size="6.8" text-anchor="middle" fill="#00695C" font-weight="bold">CERAMIC</text><rect x="260.0" y="46.0" width="88.0" height="16.0" rx="6" fill="#EFF2F6" stroke="#9AA3AD" stroke-width="0.9"/><text x="304.0" y="59.4" font-size="6.8" text-anchor="middle" fill="#1565C0" font-weight="bold">POLYMER</text><text x="10" y="78.2" font-size="6.4" text-anchor="start" fill="#222" font-weight="bold">bond</text><text x="88" y="78.2" font-size="6.2" text-anchor="start" fill="#222222" font-weight="normal">metallic</text><text x="176" y="78.2" font-size="6.2" text-anchor="start" fill="#222222" font-weight="normal">ionic, covalent</text><text x="264" y="78.2" font-size="6.2" text-anchor="start" fill="#222222" font-weight="normal">van der Waals</text><path d="M8.0 81.0L346.0 81.0" fill="none" stroke="#E3E7EC" stroke-width="0.7" stroke-linecap="round"/><text x="10" y="93.2" font-size="6.4" text-anchor="start" fill="#222" font-weight="bold">strength</text><text x="88" y="93.2" font-size="6.2" text-anchor="start" fill="#222222" font-weight="normal">400 - 1200 MPa</text><text x="176" y="93.2" font-size="6.2" text-anchor="start" fill="#222222" font-weight="normal">100 - 1000 MPa</text><text x="264" y="93.2" font-size="6.2" text-anchor="start" fill="#222222" font-weight="normal">10 - 100 MPa</text><path d="M8.0 96.0L346.0 96.0" fill="none" stroke="#E3E7EC" stroke-width="0.7" stroke-linecap="round"/><text x="10" y="108.2" font-size="6.4" text-anchor="start" fill="#222" font-weight="bold">ductility</text><text x="88" y="108.2" font-size="6.2" text-anchor="start" fill="#222222" font-weight="normal">high</text><text x="176" y="108.2" font-size="6.2" text-anchor="start" fill="#222222" font-weight="normal">none, it cracks</text><text x="264" y="108.2" font-size="6.2" text-anchor="start" fill="#222222" font-weight="normal">high, low modulus</text><path d="M8.0 111.0L346.0 111.0" fill="none" stroke="#E3E7EC" stroke-width="0.7" stroke-linecap="round"/><text x="10" y="123.2" font-size="6.4" text-anchor="start" fill="#222" font-weight="bold">ceiling</text><text x="88" y="123.2" font-size="6.2" text-anchor="start" fill="#222222" font-weight="normal">500 - 1500 C</text><text x="176" y="123.2" font-size="6.2" text-anchor="start" fill="#222222" font-weight="normal">1500 - 2000 C</text><text x="264" y="123.2" font-size="6.2" text-anchor="start" fill="#222222" font-weight="normal">100 - 200 C</text><path d="M8.0 126.0L346.0 126.0" fill="none" stroke="#E3E7EC" stroke-width="0.7" stroke-linecap="round"/><text x="10" y="138.2" font-size="6.4" text-anchor="start" fill="#222" font-weight="bold">density</text><text x="88" y="138.2" font-size="6.2" text-anchor="start" fill="#222222" font-weight="normal">2.7 - 8.0</text><text x="176" y="138.2" font-size="6.2" text-anchor="start" fill="#222222" font-weight="normal">2.5 - 4.0</text><text x="264" y="138.2" font-size="6.2" text-anchor="start" fill="#222222" font-weight="normal">0.9 - 1.4</text><path d="M8.0 141.0L346.0 141.0" fill="none" stroke="#E3E7EC" stroke-width="0.7" stroke-linecap="round"/><text x="10" y="153.2" font-size="6.4" text-anchor="start" fill="#222" font-weight="bold">current</text><text x="88" y="153.2" font-size="6.2" text-anchor="start" fill="#222222" font-weight="normal">conducts</text><text x="176" y="153.2" font-size="6.2" text-anchor="start" fill="#222222" font-weight="normal">insulates</text><text x="264" y="153.2" font-size="6.2" text-anchor="start" fill="#222222" font-weight="normal">insulates</text><path d="M8.0 156.0L346.0 156.0" fill="none" stroke="#E3E7EC" stroke-width="0.7" stroke-linecap="round"/><text x="10" y="168.2" font-size="6.4" text-anchor="start" fill="#222" font-weight="bold">k, W/mK</text><text x="88" y="168.2" font-size="6.2" text-anchor="start" fill="#222222" font-weight="normal">15 - 400</text><text x="176" y="168.2" font-size="6.2" text-anchor="start" fill="#222222" font-weight="normal">2 - 30</text><text x="264" y="168.2" font-size="6.2" text-anchor="start" fill="#222222" font-weight="normal">0.1 - 0.5</text><path d="M8.0 171.0L346.0 171.0" fill="none" stroke="#E3E7EC" stroke-width="0.7" stroke-linecap="round"/><text x="10" y="183.2" font-size="6.4" text-anchor="start" fill="#222" font-weight="bold">failure</text><text x="88" y="183.2" font-size="6.2" text-anchor="start" fill="#222222" font-weight="normal">yields first</text><text x="176" y="183.2" font-size="6.2" text-anchor="start" fill="#222222" font-weight="normal">fractures sharply</text><text x="264" y="183.2" font-size="6.2" text-anchor="start" fill="#222222" font-weight="normal">creeps, softens</text><rect x="6.0" y="202.0" width="348.0" height="58.0" rx="5" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1"/><text x="180.0" y="216.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">choosing between them</text><text x="180.0" y="230.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">a polymer for a cover, a ceramic for a hot face, a metal for a load</text><text x="180.0" y="242.2" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">the word for it is a hybrid: a glass tank, a steel frame, nylon bushes</text><text x="180.0" y="253.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">the property you cannot change by design is the bond - choose the family first</text><text x="180.0" y="273.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">Every value in the table follows from the bond, so the table does not have to be</text><text x="180.0" y="285.5" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">memorised: derive it. Compare the ceiling, the density and the failure first.</text></svg>