<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="320" fill="#ffffff"/><text x="180.0" y="24.3" font-size="12.2" text-anchor="middle" fill="#222222" font-weight="bold">Lead-tin: a eutectic system</text><text x="180.0" y="40.2" font-size="9.2" text-anchor="middle" fill="#666666" font-weight="normal">two solid solutions and one eutectic point</text><path d="M50.0 224.0L50.0 52.0" fill="none" stroke="#222222" stroke-width="1.3" stroke-linecap="round"/><path d="M48.2 57.0L50.0 52.0L51.8 57.0Z" fill="#222222"/><path d="M50.0 224.0L338.0 224.0" fill="none" stroke="#222222" stroke-width="1.3" stroke-linecap="round"/><path d="M333.0 222.2L338.0 224.0L333.0 225.8Z" fill="#222222"/><path d="M50.0 224.0L50.0 227.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="50" y="239.9" font-size="8.2" text-anchor="middle" fill="#666666" font-weight="normal">0</text><path d="M106.4 224.0L106.4 227.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="106.4" y="239.9" font-size="8.2" text-anchor="middle" fill="#666666" font-weight="normal">20</text><path d="M162.8 224.0L162.8 227.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="162.8" y="239.9" font-size="8.2" text-anchor="middle" fill="#666666" font-weight="normal">40</text><path d="M219.2 224.0L219.2 227.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="219.2" y="239.9" font-size="8.2" text-anchor="middle" fill="#666666" font-weight="normal">60</text><path d="M275.6 224.0L275.6 227.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="275.6" y="239.9" font-size="8.2" text-anchor="middle" fill="#666666" font-weight="normal">80</text><path d="M332.0 224.0L332.0 227.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="332" y="239.9" font-size="8.2" text-anchor="middle" fill="#666666" font-weight="normal">100</text><path d="M47.0 224.0L50.0 224.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="45" y="229.5" font-size="8.2" text-anchor="end" fill="#666666" font-weight="normal">150</text><path d="M47.0 182.0L50.0 182.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="45" y="187.5" font-size="8.2" text-anchor="end" fill="#666666" font-weight="normal">200</text><path d="M47.0 140.0L50.0 140.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="45" y="145.5" font-size="8.2" text-anchor="end" fill="#666666" font-weight="normal">250</text><path d="M47.0 98.0L50.0 98.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="45" y="103.5" font-size="8.2" text-anchor="end" fill="#666666" font-weight="normal">300</text><path d="M47.0 56.0L50.0 56.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="45" y="61.5" font-size="8.2" text-anchor="end" fill="#666666" font-weight="normal">350</text><text x="338" y="251.1" font-size="8.799999999999999" text-anchor="end" fill="#222222" font-weight="bold">tin (% by weight)</text><text x="47" y="47.1" font-size="8.799999999999999" text-anchor="middle" fill="#222222" font-weight="bold">T (C)</text><path d="M104.1 196.3L324.9 196.3" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><path d="M50.0 75.3L78.2 93.8L106.4 114.8L134.6 133.3L162.8 155.1L191.0 171.9L224.6 196.3L247.4 187.9L275.6 177.8L303.8 166.9L332.0 155.1" fill="none" stroke="#B66A00" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round"/><path d="M50.0 75.3L64.1 98.0L78.2 123.2L104.1 196.3" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><path d="M104.1 196.3L72.6 211.4L55.6 224.0" fill="none" stroke="#1565C0" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4,3"/><path d="M332.0 155.1L327.8 177.8L324.9 196.3" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><path d="M324.9 196.3L329.2 211.4L332.0 224.0" fill="none" stroke="#2E7D32" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4,3"/><circle cx="224.6" cy="196.3" r="2.6" fill="#BD2543"/><text x="224.558" y="210.5" font-size="6.4" text-anchor="middle" fill="#BD2543" font-weight="normal">eutectic 183 C, 61.9 % Sn</text><text x="253.04" y="100.6" font-size="7.4" text-anchor="start" fill="#222222" font-weight="bold">L (liquid)</text><text x="117.67999999999999" y="142.4" font-size="6.8" text-anchor="start" fill="#1565C0" font-weight="normal">L + α</text><text x="258.68" y="150.8" font-size="6.8" text-anchor="start" fill="#2E7D32" font-weight="normal">L + β</text><text x="69.74000000000001" y="157.6" font-size="7.2" text-anchor="start" fill="#1565C0" font-weight="bold">α</text><path d="M305.2 170.2L327.5 182.8" fill="none" stroke="#666666" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="2,2"/><circle cx="305.2" cy="170.2" r="1.5" fill="#666666"/><text x="303.8" y="171.1" font-size="7.2" text-anchor="end" fill="#2E7D32" font-weight="bold">β</text><text x="275.6" y="219.4" font-size="6.2" text-anchor="middle" fill="#666666" font-weight="normal">α + β below the eutectic line</text><path d="M50.0 182.0L204.9 182.0" fill="none" stroke="#9AA3AD" stroke-width="0.9" stroke-linecap="round" stroke-dasharray="3,3"/><circle cx="99.1" cy="182.0" r="2.0" fill="#222222"/><circle cx="204.9" cy="182.0" r="2.0" fill="#222222"/><text x="102.07448275862069" y="179.2" font-size="6.4" text-anchor="start" fill="#1565C0" font-weight="normal">17 %</text><text x="207.88606896551724" y="179.2" font-size="6.4" text-anchor="start" fill="#B66A00" font-weight="normal">55 %</text><rect x="6.0" y="240.0" width="348.0" height="46.0" rx="5" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1"/><text x="180.0" y="254.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">lever rule for a 40 % Sn alloy at 200 C</text><text x="180.0" y="268.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">W(liquid) = (40 - 17)/(55 - 17) = 0.60   and   W(α) = 0.40</text><text x="180.0" y="280.2" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">only 19 % tin dissolves in lead at 183 C, so solder is a two-phase alloy</text><text x="180.0" y="299.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">Solder and type metal sit near a eutectic because a eutectic alloy melts and</text><text x="180.0" y="311.5" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">freezes at one low temperature, with no pasty range.</text></svg>