<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="330" fill="#ffffff"/><text x="180.0" y="24.3" font-size="12.2" text-anchor="middle" fill="#222222" font-weight="bold">Grain size sets the yield strength</text><text x="180.0" y="40.2" font-size="9.2" text-anchor="middle" fill="#666666" font-weight="normal">Hall-Petch: σy = σ0 + k d^-1/2</text><path d="M52.0 194.0L52.0 56.0" fill="none" stroke="#222222" stroke-width="1.3" stroke-linecap="round"/><path d="M50.2 61.0L52.0 56.0L53.8 61.0Z" fill="#222222"/><path d="M52.0 194.0L334.0 194.0" fill="none" stroke="#222222" stroke-width="1.3" stroke-linecap="round"/><path d="M329.0 192.2L334.0 194.0L329.0 195.8Z" fill="#222222"/><path d="M52.0 194.0L52.0 197.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="52" y="209.9" font-size="8.2" text-anchor="middle" fill="#666666" font-weight="normal">2</text><path d="M107.2 194.0L107.2 197.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="107.2" y="209.9" font-size="8.2" text-anchor="middle" fill="#666666" font-weight="normal">4</text><path d="M162.4 194.0L162.4 197.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="162.4" y="209.9" font-size="8.2" text-anchor="middle" fill="#666666" font-weight="normal">6</text><path d="M217.6 194.0L217.6 197.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="217.6" y="209.9" font-size="8.2" text-anchor="middle" fill="#666666" font-weight="normal">8</text><path d="M272.8 194.0L272.8 197.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="272.8" y="209.9" font-size="8.2" text-anchor="middle" fill="#666666" font-weight="normal">10</text><path d="M328.0 194.0L328.0 197.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="328" y="209.9" font-size="8.2" text-anchor="middle" fill="#666666" font-weight="normal">12</text><path d="M49.0 194.0L52.0 194.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="47" y="199.5" font-size="8.2" text-anchor="end" fill="#666666" font-weight="normal">100</text><path d="M49.0 160.5L52.0 160.5" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="47" y="166.0" font-size="8.2" text-anchor="end" fill="#666666" font-weight="normal">180</text><path d="M49.0 127.0L52.0 127.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="47" y="132.5" font-size="8.2" text-anchor="end" fill="#666666" font-weight="normal">260</text><path d="M49.0 93.5L52.0 93.5" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="47" y="99.0" font-size="8.2" text-anchor="end" fill="#666666" font-weight="normal">340</text><path d="M49.0 60.0L52.0 60.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="47" y="65.5" font-size="8.2" text-anchor="end" fill="#666666" font-weight="normal">420</text><text x="334" y="221.1" font-size="8.799999999999999" text-anchor="end" fill="#222222" font-weight="bold">d^-1/2  (mm^-1/2)</text><text x="49" y="51.1" font-size="8.799999999999999" text-anchor="middle" fill="#222222" font-weight="bold">yield (MPa)</text><path d="M52.0 174.4L79.6 164.6L107.2 154.8L134.8 145.0L162.4 135.2L217.6 115.6L272.8 96.0L328.0 76.4" fill="none" stroke="#7B2CD9" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="52.0" cy="174.4" r="1.8" fill="#222222"/><circle cx="79.6" cy="164.6" r="1.8" fill="#222222"/><circle cx="107.2" cy="154.8" r="1.8" fill="#222222"/><circle cx="134.8" cy="145.0" r="1.8" fill="#222222"/><circle cx="162.4" cy="135.2" r="1.8" fill="#222222"/><circle cx="217.6" cy="115.6" r="1.8" fill="#222222"/><circle cx="272.8" cy="96.0" r="1.8" fill="#222222"/><circle cx="328.0" cy="76.4" r="1.8" fill="#222222"/><text x="58.0" y="187.6" font-size="6.2" text-anchor="start" fill="#666666" font-weight="normal">grain size 0.25 mm</text><text x="324.0" y="71.6" font-size="6.2" text-anchor="end" fill="#666666" font-weight="normal">grain size 0.007 mm</text><text x="261.76" y="163.6" font-size="6.6" text-anchor="end" fill="#666666" font-weight="normal">σ0 = 100 MPa</text><text x="261.76" y="171.2" font-size="6.6" text-anchor="end" fill="#666666" font-weight="normal">k = 23.4 MPa mm^0.5</text><rect x="6.0" y="226.0" width="348.0" height="58.0" rx="5" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1"/><text x="180.0" y="240.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">same steel, two grain sizes</text><text x="180.0" y="254.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">d = 0.0625 mm (ASTM 6):  σy = 100 + 23.4 x 4 = 194 MPa</text><text x="180.0" y="266.2" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">d = 0.0156 mm (ASTM 10): σy = 100 + 23.4 x 8 = 287 MPa</text><text x="180.0" y="277.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">grain refinement is the one strengthening method that also raises toughness</text><text x="180.0" y="297.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">A grain boundary blocks a moving dislocation, so a finer grain forces the</text><text x="180.0" y="309.5" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">dislocation to turn more often; normalising a steel is done for this.</text></svg>