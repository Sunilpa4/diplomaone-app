<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 322" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="322" fill="#ffffff"/><text x="180.0" y="24.3" font-size="12.2" text-anchor="middle" fill="#222222" font-weight="bold">Vulcanisation: what sulphur does to rubber</text><text x="180.0" y="40.2" font-size="9.2" text-anchor="middle" fill="#666666" font-weight="normal">raw gum against a cured compound</text><path d="M44.0 214.0L44.0 60.0" fill="none" stroke="#222222" stroke-width="1.3" stroke-linecap="round"/><path d="M42.2 65.0L44.0 60.0L45.8 65.0Z" fill="#222222"/><path d="M44.0 214.0L318.0 214.0" fill="none" stroke="#222222" stroke-width="1.3" stroke-linecap="round"/><path d="M313.0 212.2L318.0 214.0L313.0 215.8Z" fill="#222222"/><path d="M44.0 214.0L44.0 217.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="44" y="229.7" font-size="7.6" text-anchor="middle" fill="#666666" font-weight="normal">0</text><path d="M120.6 214.0L120.6 217.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="120.57142857142857" y="229.7" font-size="7.6" text-anchor="middle" fill="#666666" font-weight="normal">200</text><path d="M197.1 214.0L197.1 217.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="197.14285714285714" y="229.7" font-size="7.6" text-anchor="middle" fill="#666666" font-weight="normal">400</text><path d="M273.7 214.0L273.7 217.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="273.71428571428567" y="229.7" font-size="7.6" text-anchor="middle" fill="#666666" font-weight="normal">600</text><path d="M41.0 214.0L44.0 214.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="39" y="219.3" font-size="7.6" text-anchor="end" fill="#666666" font-weight="normal">0</text><path d="M41.0 154.0L44.0 154.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="39" y="159.3" font-size="7.6" text-anchor="end" fill="#666666" font-weight="normal">10</text><path d="M41.0 94.0L44.0 94.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="39" y="99.3" font-size="7.6" text-anchor="end" fill="#666666" font-weight="normal">20</text><text x="318" y="240.9" font-size="8.2" text-anchor="end" fill="#222222" font-weight="bold"></text><text x="41" y="54.9" font-size="8.2" text-anchor="middle" fill="#222222" font-weight="bold">stress, MPa</text><text x="308" y="208.5" font-size="7.2" text-anchor="end" fill="#222" font-weight="bold">elongation, %</text><path d="M44.0 214.0L82.3 204.4L120.6 194.8L158.9 181.6L197.1 160.0L235.4 121.0L258.4 85.0" fill="none" stroke="#2E7D32" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M44.0 214.0L82.3 208.6L120.6 205.0L158.9 202.0L197.1 199.6L216.3 201.4" fill="none" stroke="#BD2543" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4,3"/><path d="M58.0 72.0L74.0 72.0" fill="none" stroke="#2E7D32" stroke-width="2.2" stroke-linecap="round"/><text x="78" y="76.3" font-size="6.6" text-anchor="start" fill="#2E7D32" font-weight="bold">vulcanised</text><path d="M58.0 84.0L74.0 84.0" fill="none" stroke="#BD2543" stroke-width="2.0" stroke-linecap="round" stroke-dasharray="4,3"/><text x="78" y="88.3" font-size="6.6" text-anchor="start" fill="#BD2543" font-weight="bold">raw gum</text><rect x="6.0" y="232.0" width="348.0" height="58.0" rx="5" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1"/><text x="180.0" y="246.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">the crosslink is the whole trick</text><text x="180.0" y="260.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">1 - 3 % sulphur at 140 - 160 C ties the chains together every few hundred atoms</text><text x="180.0" y="272.2" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">cured: 22 MPa and 550 %; raw gum: 2 MPa and 450 % with no elastic return</text><text x="180.0" y="283.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">Shore A 40 - 90: shoe sole 70, tyre tread 60, hard roller 90, soft gasket 45</text><text x="180.0" y="303.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">Rubber is the one material that can be strained 500 % and come back; the</text><text x="180.0" y="315.5" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">sulphur bridges stop the chains sliding past each other for good.</text></svg>