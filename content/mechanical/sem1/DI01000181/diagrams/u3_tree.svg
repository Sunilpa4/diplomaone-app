<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 296" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="296" fill="#ffffff"/><text x="180.0" y="24.3" font-size="12.2" text-anchor="middle" fill="#222222" font-weight="bold">Classification of the metals used in machines</text><text x="180.0" y="40.2" font-size="9.2" text-anchor="middle" fill="#666666" font-weight="normal">ferrous on the left, non-ferrous right</text><rect x="6.0" y="44.0" width="168.0" height="120.0" rx="6" fill="#EEF4FC" stroke="#9AA3AD" stroke-width="0.9"/><text x="90" y="61.0" font-size="8.6" text-anchor="middle" fill="#1565C0" font-weight="bold">FERROUS</text><text x="90" y="74.2" font-size="6.4" text-anchor="middle" fill="#666666" font-weight="normal">steel, 0.02 - 2.14 % C</text><path d="M14.0 82.0L166.0 82.0L166.0 103.0L14.0 103.0Z" fill="#FFFFFF" stroke="#1565C0" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/><text x="90" y="93.5" font-size="7.2" text-anchor="middle" fill="#222" font-weight="bold">plain carbon</text><text x="90" y="101.0" font-size="5.8" text-anchor="middle" fill="#666666" font-weight="normal">low / medium / high C</text><path d="M14.0 107.0L166.0 107.0L166.0 128.0L14.0 128.0Z" fill="#FFFFFF" stroke="#1565C0" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/><text x="90" y="118.5" font-size="7.2" text-anchor="middle" fill="#222" font-weight="bold">alloy steel</text><text x="90" y="126.0" font-size="5.8" text-anchor="middle" fill="#666666" font-weight="normal">stainless, tool, HSLA</text><path d="M14.0 132.0L166.0 132.0L166.0 153.0L14.0 153.0Z" fill="#FFFFFF" stroke="#1565C0" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/><text x="90" y="143.5" font-size="7.2" text-anchor="middle" fill="#222" font-weight="bold">cast iron</text><text x="90" y="151.0" font-size="5.8" text-anchor="middle" fill="#666666" font-weight="normal">2.14 - 6.67 % C</text><rect x="186.0" y="44.0" width="168.0" height="120.0" rx="6" fill="#FFF6EC" stroke="#9AA3AD" stroke-width="0.9"/><text x="270" y="61.0" font-size="8.6" text-anchor="middle" fill="#B66A00" font-weight="bold">NON-FERROUS</text><text x="270" y="74.2" font-size="6.4" text-anchor="middle" fill="#666666" font-weight="normal">no iron, so no rust</text><path d="M194.0 82.0L346.0 82.0L346.0 103.0L194.0 103.0Z" fill="#FFFFFF" stroke="#B66A00" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/><text x="270" y="93.5" font-size="7.2" text-anchor="middle" fill="#222" font-weight="bold">copper alloys</text><text x="270" y="101.0" font-size="5.8" text-anchor="middle" fill="#666666" font-weight="normal">brass, bronze, gunmetal</text><path d="M194.0 107.0L346.0 107.0L346.0 128.0L194.0 128.0Z" fill="#FFFFFF" stroke="#B66A00" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/><text x="270" y="118.5" font-size="7.2" text-anchor="middle" fill="#222" font-weight="bold">aluminium alloys</text><text x="270" y="126.0" font-size="5.8" text-anchor="middle" fill="#666666" font-weight="normal">wrought 1xxx-7xxx, cast</text><path d="M194.0 132.0L346.0 132.0L346.0 153.0L194.0 153.0Z" fill="#FFFFFF" stroke="#B66A00" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/><text x="270" y="143.5" font-size="7.2" text-anchor="middle" fill="#222" font-weight="bold">others</text><text x="270" y="151.0" font-size="5.8" text-anchor="middle" fill="#666666" font-weight="normal">Zn, Ni, Ti, Mg, Pb, Sn</text><rect x="6.0" y="172.0" width="348.0" height="58.0" rx="5" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1"/><text x="180.0" y="186.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">the three families inside each branch</text><text x="180.0" y="200.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">steel: carbon steels by %C, alloy steels by the element added (Cr, Ni, Mo, V)</text><text x="180.0" y="212.2" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">cast iron: grey, white, malleable, ductile and alloy - named by the graphite shape</text><text x="180.0" y="223.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">non-ferrous: one base metal (Cu, Al, Zn, Ni) plus the elements that strengthen it</text><text x="180.0" y="243.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">Nine of every ten tonnes of metal in engineering are ferrous, because iron ore,</text><text x="180.0" y="255.5" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">coke and limestone make steel cheap; the non-ferrous tenth carries current, saves</text><text x="180.0" y="271.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">weight or resists corrosion where steel cannot.</text><text x="180.0" y="283.5" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal"></text></svg>