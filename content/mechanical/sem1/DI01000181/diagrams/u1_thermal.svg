<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 312" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="312" fill="#ffffff"/><text x="180.0" y="24.3" font-size="12.2" text-anchor="middle" fill="#222222" font-weight="bold">Thermal and electrical properties</text><text x="180.0" y="40.2" font-size="9.2" text-anchor="middle" fill="#666666" font-weight="normal">why copper cools and rubber insulates</text><path d="M78.0 190.0L344.0 190.0" fill="none" stroke="#222222" stroke-width="1.3" stroke-linecap="round"/><path d="M78.0 190.0L78.0 84.0" fill="none" stroke="#222222" stroke-width="1.3" stroke-linecap="round"/><text x="78" y="76.5" font-size="7.2" text-anchor="start" fill="#222" font-weight="bold">W/(m K)</text><text x="344" y="76.2" font-size="6.2" text-anchor="end" fill="#666666" font-weight="normal">log scale</text><path d="M73.0 162.1L78.0 162.1" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="69" y="166.9" font-size="6.2" text-anchor="end" fill="#666666" font-weight="normal">1</text><path d="M73.0 136.3L78.0 136.3" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="69" y="141.1" font-size="6.2" text-anchor="end" fill="#666666" font-weight="normal">10</text><path d="M73.0 109.7L78.0 109.7" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="69" y="114.4" font-size="6.2" text-anchor="end" fill="#666666" font-weight="normal">100</text><rect x="86" y="94.0" width="30" height="96.0" rx="2" fill="#1565C0" fill-opacity="0.30" stroke="#1565C0" stroke-width="1.3"/><text x="101" y="89.3" font-size="6.6" text-anchor="middle" fill="#1565C0" font-weight="bold">385</text><text x="101" y="205.1" font-size="6.0" text-anchor="middle" fill="#222222" font-weight="normal">copper</text><rect x="129" y="101.3" width="30" height="88.7" rx="2" fill="#00695C" fill-opacity="0.30" stroke="#00695C" stroke-width="1.3"/><text x="144" y="96.6" font-size="6.6" text-anchor="middle" fill="#00695C" font-weight="bold">205</text><text x="144" y="205.1" font-size="6.0" text-anchor="middle" fill="#222222" font-weight="normal">aluminium</text><rect x="172" y="117.7" width="30" height="72.3" rx="2" fill="#666666" fill-opacity="0.30" stroke="#666666" stroke-width="1.3"/><text x="187" y="113.0" font-size="6.6" text-anchor="middle" fill="#666666" font-weight="bold">50</text><text x="187" y="205.1" font-size="6.0" text-anchor="middle" fill="#222222" font-weight="normal">steel</text><rect x="215" y="130.9" width="30" height="59.1" rx="2" fill="#B66A00" fill-opacity="0.30" stroke="#B66A00" stroke-width="1.3"/><text x="230" y="126.2" font-size="6.6" text-anchor="middle" fill="#B66A00" font-weight="bold">16</text><text x="230" y="205.1" font-size="6.0" text-anchor="middle" fill="#222222" font-weight="normal">stainless</text><rect x="258" y="162.1" width="30" height="27.9" rx="2" fill="#2E7D32" fill-opacity="0.30" stroke="#2E7D32" stroke-width="1.3"/><text x="273" y="157.4" font-size="6.6" text-anchor="middle" fill="#2E7D32" font-weight="bold">1</text><text x="273" y="205.1" font-size="6.0" text-anchor="middle" fill="#222222" font-weight="normal">glass</text><rect x="301" y="179.3" width="30" height="10.7" rx="2" fill="#BD2543" fill-opacity="0.30" stroke="#BD2543" stroke-width="1.3"/><text x="316" y="174.7" font-size="6.6" text-anchor="middle" fill="#BD2543" font-weight="bold">0.15</text><text x="316" y="205.1" font-size="6.0" text-anchor="middle" fill="#222222" font-weight="normal">rubber</text><rect x="6.0" y="214.0" width="348.0" height="54.0" rx="5" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1"/><text x="180.0" y="228.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">the numbers a designer carries in his head</text><text x="180.0" y="242.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">thermal conductivity: copper 385, aluminium 205, steel 50 W/(m K)</text><text x="180.0" y="254.2" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">electrical resistivity: copper 1.7e-8, aluminium 2.8e-8, iron 1.0e-7 ohm m</text><text x="180.0" y="265.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">thermal expansion: steel 12e-6, aluminium 23e-6, invar 1.2e-6 per K</text><text x="180.0" y="291.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">The same free electrons carry heat and current, so the two lists run in the same</text><text x="180.0" y="303.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">order. A busbar is aluminium when weight matters, copper when space matters.</text></svg>