hor="middle" fill="#666666" font-weight="normal">25</text><path d="M55.0 224.0L58.0 224.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="53" y="229.5" font-size="8.2" text-anchor="end" fill="#666666" font-weight="normal">0</text><path d="M55.0 186.5L58.0 186.5" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="53" y="192.0" font-size="8.2" text-anchor="end" fill="#666666" font-weight="normal">150</text><path d="M55.0 149.0L58.0 149.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="53" y="154.5" font-size="8.2" text-anchor="end" fill="#666666" font-weight="normal">300</text><path d="M55.0 111.5L58.0 111.5" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="53" y="117.0" font-size="8.2" text-anchor="end" fill="#666666" font-weight="normal">450</text><path d="M55.0 74.0L58.0 74.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="53" y="79.5" font-size="8.2" text-anchor="end" fill="#666666" font-weight="normal">600</text><text x="296" y="251.1" font-size="8.799999999999999" text-anchor="end" fill="#222222" font-weight="bold">strain (%)</text><text x="55" y="65.1" font-size="8.799999999999999" text-anchor="middle" fill="#222222" font-weight="bold">stress (MPa)</text><polygon points="58.0,224.0 58.0,224.0 65.4,161.5 76.6,161.5 81.4,158.4 86.2,155.2 91.0,152.1 95.9,149.1 100.7,146.0 105.5,143.1 110.3,140.2 115.2,137.4 120.0,134.7 124.8,132.1 129.6,129.6 134.5,127.3 139.3,125.1 144.1,123.0 148.9,121.0 153.8,119.3 158.6,117.7 163.4,116.3 168.2,115.0 173.1,113.9 177.9,113.1 182.7,112.4 187.5,111.9 192.4,111.6 197.2,111.5 201.8,112.0 206.5,113.0 211.1,114.5 215.8,116.4 220.4,118.6 225.0,121.2 229.7,124.1 234.3,127.3 239.0,130.8 243.6,134.6 248.2,138.6 252.9,143.0 257.5,147.6 262.2,152.4 266.8,157.5 271.4,162.8 276.1,168.4 280.7,174.2 285.4,180.2 290.0,186.5 290.0,224.0" fill="#1565C0" fill-opacity="0.10"/><path d="M58.0 224.0L65.4 161.5L76.6 161.5L81.4 158.4L86.2 155.2L91.0 152.1L95.9 149.1L100.7 146.0L105.5 143.1L110.3 140.2L115.2 137.4L120.0 134.7L124.8 132.1L129.6 129.6L134.5 127.3L139.3 125.1L144.1 123.0L148.9 121.0L153.8 119.3L158.6 117.7L163.4 116.3L168.2 115.0L173.1 113.9L177.9 113.1L182.7 112.4L187.5 111.9L192.4 111.6L197.2 111.5L201.8 112.0L206.5 113.0L211.1 114.5L215.8 116.4L220.4 118.6L225.0 121.2L229.7 124.1L234.3 127.3L239.0 130.8L243.6 134.6L248.2 138.6L252.9 143.0L257.5 147.6L262.2 152.4L266.8 157.5L271.4 162.8L276.1 168.4L280.7 174.2L285.4 180.2L290.0 186.5" fill="none" stroke="#1565C0" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round"/><circle cx="65.4" cy="161.5" r="2.8" fill="#BD2543"/><text x="71.424" y="175.8" font-size="6.6" text-anchor="start" fill="#BD2543" font-weight="normal">yield 250 MPa</text><circle cx="197.2" cy="111.5" r="2.8" fill="#BD2543"/><text x="193.2" y="104.8" font-size="6.6" text-anchor="end" fill="#BD2543" font-weight="normal">UTS 450 MPa</text><circle cx="290.0" cy="186.5" r="2.8" fill="#BD2543"/><text x="284.0" y="182.8" font-size="6.6" text-anchor="end" fill="#BD2543" font-weight="normal">fracture</text><text x="75.4" y="177.2" font-size="6.4" text-anchor="middle" fill="#1565C0" font-weight="normal">slope = E</text><text x="62.64" y="86.0" font-size="5.8" text-anchor="start" fill="#666666" font-weight="normal">elastic part drawn</text><text x="62.64" y="97.3" font-size="5.8" text-anchor="start" fill="#666666" font-weight="normal">wider than scale</text><text x="257.52" y="96.2" font-size="6.2" text-anchor="end" fill="#666666" font-weight="normal">toughness</text><text x="257.52" y="106.7" font-size="6.2" text-anchor="end" fill="#666666" font-weight="normal">= shaded area</text><rect x="6.0" y="244.0" width="348.0" height="52.0" rx="5" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1"/><text x="180.0" y="258.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">what each point is used for</text><text x="180.0" y="272.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">E = 200 GPa from the slope; yield 250 MPa decides the allowable stress</text><text x="180.0" y="284.2" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">UTS 450 MPa is the highest stress, not a safe working stress</text><text x="180.0" y="295.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">elongation 25 % and reduction in area 55 % measure the ductility</text><text x="180.0" y="315.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">A brittle material such as cast iron has almost no plastic part: the curve stops</text><text x="180.0" y="327.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">just after the straight line, which is why it is never loaded near its UTS.</text></svg>