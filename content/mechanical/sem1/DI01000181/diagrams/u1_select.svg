nd" fill="#666666" font-weight="normal">250</text><path d="M51.0 147.0L54.0 147.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="49" y="152.5" font-size="8.2" text-anchor="end" fill="#666666" font-weight="normal">500</text><path d="M51.0 104.5L54.0 104.5" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="49" y="110.0" font-size="8.2" text-anchor="end" fill="#666666" font-weight="normal">750</text><path d="M51.0 62.0L54.0 62.0" fill="none" stroke="#222222" stroke-width="1.0" stroke-linecap="round"/><text x="49" y="67.5" font-size="8.2" text-anchor="end" fill="#666666" font-weight="normal">1000</text><text x="328" y="259.1" font-size="8.799999999999999" text-anchor="end" fill="#222222" font-weight="bold">density (g/cm3)</text><text x="51" y="53.1" font-size="8.799999999999999" text-anchor="middle" fill="#222222" font-weight="bold">UTS (MPa)</text><path d="M54.0 232.0L322.0 155.5" fill="none" stroke="#9AA3AD" stroke-width="0.9" stroke-linecap="round" stroke-dasharray="4,3"/><path d="M54.0 232.0L322.0 79.0" fill="none" stroke="#9AA3AD" stroke-width="0.9" stroke-linecap="round" stroke-dasharray="4,3"/><path d="M54.0 232.0L202.9 62.0" fill="none" stroke="#9AA3AD" stroke-width="0.9" stroke-linecap="round" stroke-dasharray="4,3"/><path d="M54.0 232.0L128.4 62.0" fill="none" stroke="#9AA3AD" stroke-width="0.9" stroke-linecap="round" stroke-dasharray="4,3"/><circle cx="287.8" cy="155.5" r="3.4" fill="#1565C0"/><text x="280.75555555555553" y="151.7" font-size="6.4" text-anchor="end" fill="#1565C0" font-weight="normal">steel</text><circle cx="292.2" cy="130.0" r="3.4" fill="#1565C0"/><text x="285.22222222222223" y="126.2" font-size="6.4" text-anchor="end" fill="#1565C0" font-weight="normal">stainless</text><circle cx="134.4" cy="179.3" r="3.4" fill="#00695C"/><text x="126.4" y="174.5" font-size="6.4" text-anchor="end" fill="#00695C" font-weight="normal">al 6061</text><circle cx="185.9" cy="70.5" r="3.4" fill="#B6