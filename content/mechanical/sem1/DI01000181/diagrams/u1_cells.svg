width="1.2"/><circle cx="128.0" cy="152.0" r="9.5" fill="#EAF2FB" stroke="#2E7D32" stroke-width="1.2"/><circle cx="157.4" cy="58.2" r="9.5" fill="#EAF2FB" stroke="#2E7D32" stroke-width="1.2"/><circle cx="227.4" cy="58.2" r="9.5" fill="#EAF2FB" stroke="#2E7D32" stroke-width="1.2"/><circle cx="227.4" cy="128.2" r="9.5" fill="#EAF2FB" stroke="#2E7D32" stroke-width="1.2"/><circle cx="157.4" cy="128.2" r="9.5" fill="#EAF2FB" stroke="#2E7D32" stroke-width="1.2"/><circle cx="163.0" cy="82.0" r="9.5" fill="#EAF2FB" stroke="#2E7D32" stroke-width="1.2"/><circle cx="163.0" cy="152.0" r="9.5" fill="#EAF2FB" stroke="#2E7D32" stroke-width="1.2"/><circle cx="128.0" cy="117.0" r="9.5" fill="#EAF2FB" stroke="#2E7D32" stroke-width="1.2"/><circle cx="198.0" cy="117.0" r="9.5" fill="#EAF2FB" stroke="#2E7D32" stroke-width="1.2"/><circle cx="192.4" cy="70.1" r="9.5" fill="#EAF2FB" stroke="#2E7D32" stroke-width="1.2"/><circle cx="192.4" cy="140.1" r="9.5" fill="#EAF2FB" stroke="#2E7D32" stroke-width="1.2"/><path d="M323.2 155.8L292.0 173.8L260.8 155.8L260.8 119.8L292.0 101.8L323.2 119.8" fill="none" stroke="#222222" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M323.2 116.2L292.0 134.2L260.8 116.2L260.8 80.2L292.0 62.2L323.2 80.2" fill="none" stroke="#222222" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M323.2 116.2L323.2 155.8" fill="none" stroke="#222222" stroke-width="0.9" stroke-linecap="round"/><path d="M292.0 134.2L292.0 173.8" fill="none" stroke="#222222" stroke-width="0.9" stroke-linecap="round"/><path d="M260.8 116.2L260.8 155.8" fill="none" stroke="#222222" stroke-width="0.9" stroke-linecap="round"/><path d="M260.8 80.2L260.8 119.8" fill="none" stroke="#222222" stroke-width="0.9" stroke-linecap="round"/><path d="M292.0 62.2L292.0 101.8" fill="none" stroke="#222222" stroke-width="0.9" stroke-linecap="round"/><path d="M323.2 80.2L323.2 119.8" fill="none" stroke="#222222" stroke-width="0.9" stroke-linecap="round"/><circle cx="323.2" cy="116.2" r="7.2" fill="#EAF6EC" stroke="#B66A00" stroke-width="1.2"/><circle cx="292.0" cy="134.2" r="7.2" fill="#EAF6EC" stroke="#B66A00" stroke-width="1.2"/><circle cx="260.8" cy="116.2" r="7.2" fill="#EAF6EC" stroke="#B66A00" stroke-width="1.2"/><circle cx="260.8" cy="80.2" r="7.2" fill="#EAF6EC" stroke="#B66A00" stroke-width="1.2"/><circle cx="292.0" cy="62.2" r="7.2" fill="#EAF6EC" stroke="#B66A00" stroke-width="1.2"/><circle cx="323.2" cy="80.2" r="7.2" fill="#EAF6EC" stroke="#B66A00" stroke-width="1.2"/><circle cx="292.0" cy="98.2" r="7.2" fill="#EAF6EC" stroke="#B66A00" stroke-width="1.2"/><circle cx="323.2" cy="155.8" r="7.2" fill="#EAF6EC" stroke="#B66A00" stroke-width="1.2"/><circle cx="292.0" cy="173.8" r="7.2" fill="#EAF6EC" stroke="#B66A00" stroke-width="1.2"/><circle cx="260.8" cy="155.8" r="7.2" fill="#EAF6EC" stroke="#B66A00" stroke-width="1.2"/><circle cx="260.8" cy="119.8" r="7.2" fill="#EAF6EC" stroke="#B66A00" stroke-width="1.2"/><circle cx="292.0" cy="101.8" r="7.2" fill="#EAF6EC" stroke="#B66A00" stroke-width="1.2"/><circle cx="323.2" cy="119.8" r="7.2" fill="#EAF6EC" stroke="#B66A00" stroke-width="1.2"/><circle cx="292.0" cy="137.8" r="7.2" fill="#EAF6EC" stroke="#B66A00" stroke-width="1.2"/><circle cx="292.0" cy="127.9" r="7.2" fill="#FDF1E3" stroke="#B66A00" stroke-width="1.2"/><circle cx="276.4" cy="113.0" r="7.2" fill="#FDF1E3" stroke="#B66A00" stroke-width="1.2"/><circle cx="307.6" cy="113.0" r="7.2" fill="#FDF1E3" stroke="#B66A00" stroke-width="1.2"/><text x="58" y="190.9" font-size="8.4" text-anchor="middle" fill="#1565C0" font-weight="bold">BCC</text><text x="58" y="202.2" font-size="6.4" text-anchor="middle" fill="#222222" font-weight="normal">2 atoms, CN 8</text><text x="58" y="213.2" font-size="6.4" text-anchor="middle" fill="#222222" font-weight="normal">APF 0.68</text><text x="58" y="224.2" font-size="6.2" text-anchor="middle" fill="#666666" font-weight="normal">Fe-alpha, Cr, W</text><text x="172" y="190.9" font-size="8.4" text-anchor="middle" fill="#2E7D32" font-weight="bold">FCC</text><text x="172" y="202.2" font-size="6.4" text-anchor="middle" fill="#222222" font-weight="normal">4 atoms, CN 12</text><text x="172" y="213.2" font-size="6.4" text-anchor="middle" fill="#222222" font-weight="normal">APF 0.74</text><text x="172" y="224.2" font-size="6.2" text-anchor="middle" fill="#666666" font-weight="normal">Cu, Al, Ni, Fe-gamma</text><text x="292" y="190.9" font-size="8.4" text-anchor="middle" fill="#B66A00" font-weight="bold">HCP</text><text x="292" y="202.2" font-size="6.4" text-anchor="middle" fill="#222222" font-weight="normal">6 atoms, CN 12</text><text x="292" y="213.2" font-size="6.2" text-anchor="middle" fill="#222222" font-weight="normal">APF 0.74, c/a 1.633</text><text x="292" y="224.2" font-size="6.2" text-anchor="middle" fill="#666666" font-weight="normal">Mg, Zn, Ti, Cd</text><rect x="6.0" y="234.0" width="348.0" height="52.0" rx="5" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1"/><text x="180.0" y="248.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">why the numbers matter</text><text x="180.0" y="262.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">a corner atom is shared by 8 cells, a face atom by 2, so count fractions</text><text x="180.0" y="274.2" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">BCC: 8 x 1/8 + 1 = 2;  FCC: 8 x 1/8 + 6 x 1/2 = 4</text><text x="180.0" y="285.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">FCC and HCP are close packed: 12 neighbours, 74 % of the space filled</text><text x="180.0" y="307.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">Iron is BCC below 912 C and FCC between 912 and 1394 C; that change of cell</text><text x="180.0" y="319.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">is what makes steel hardenable, because FCC iron dissolves 2 % carbon.</text></svg>