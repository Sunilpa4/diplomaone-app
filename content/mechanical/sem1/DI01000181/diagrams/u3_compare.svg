<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="300" fill="#ffffff"/><text x="180.0" y="24.3" font-size="12.2" text-anchor="middle" fill="#222222" font-weight="bold">Metals against non-metals</text><text x="180.0" y="40.2" font-size="9.2" text-anchor="middle" fill="#666666" font-weight="normal">the test is the free electron</text><rect x="6.0" y="46.0" width="166.0" height="150.0" rx="6" fill="#EEF4FC" stroke="#9AA3AD" stroke-width="0.9"/><rect x="188.0" y="46.0" width="166.0" height="150.0" rx="6" fill="#F6F1FB" stroke="#9AA3AD" stroke-width="0.9"/><text x="89" y="65.2" font-size="9.0" text-anchor="middle" fill="#1565C0" font-weight="bold">METALS</text><text x="271" y="65.2" font-size="9.0" text-anchor="middle" fill="#7B2CD9" font-weight="bold">NON-METALS</text><text x="12" y="82.5" font-size="7.2" text-anchor="start" fill="#1565C0" font-weight="normal">-</text><text x="20" y="82.3" font-size="6.6" text-anchor="start" fill="#222" font-weight="normal">free electrons</text><text x="194" y="82.5" font-size="7.2" text-anchor="start" fill="#7B2CD9" font-weight="normal">-</text><text x="202" y="82.3" font-size="6.6" text-anchor="start" fill="#222" font-weight="normal">electrons held in bonds</text><text x="12" y="95.0" font-size="7.2" text-anchor="start" fill="#1565C0" font-weight="normal">-</text><text x="20" y="94.8" font-size="6.6" text-anchor="start" fill="#222" font-weight="normal">conduct heat and current</text><text x="194" y="95.0" font-size="7.2" text-anchor="start" fill="#7B2CD9" font-weight="normal">-</text><text x="202" y="94.8" font-size="6.6" text-anchor="start" fill="#222" font-weight="normal">insulators, a few semiconductors</text><text x="12" y="107.5" font-size="7.2" text-anchor="start" fill="#1565C0" font-weight="normal">-</text><text x="20" y="107.3" font-size="6.6" text-anchor="start" fill="#222" font-weight="normal">lustrous</text><text x="194" y="107.5" font-size="7.2" text-anchor="start" fill="#7B2CD9" font-weight="normal">-</text><text x="202" y="107.3" font-size="6.6" text-anchor="start" fill="#222" font-weight="normal">no lustre, dull</text><text x="12" y="120.0" font-size="7.2" text-anchor="start" fill="#1565C0" font-weight="normal">-</text><text x="20" y="119.8" font-size="6.6" text-anchor="start" fill="#222" font-weight="normal">malleable and ductile</text><text x="194" y="120.0" font-size="7.2" text-anchor="start" fill="#7B2CD9" font-weight="normal">-</text><text x="202" y="119.8" font-size="6.6" text-anchor="start" fill="#222" font-weight="normal">brittle, or soft as graphite</text><text x="12" y="132.5" font-size="7.2" text-anchor="start" fill="#1565C0" font-weight="normal">-</text><text x="20" y="132.3" font-size="6.6" text-anchor="start" fill="#222" font-weight="normal">sonorous</text><text x="194" y="132.5" font-size="7.2" text-anchor="start" fill="#7B2CD9" font-weight="normal">-</text><text x="202" y="132.3" font-size="6.6" text-anchor="start" fill="#222" font-weight="normal">no ring</text><text x="12" y="145.0" font-size="7.2" text-anchor="start" fill="#1565C0" font-weight="normal">-</text><text x="20" y="144.8" font-size="6.6" text-anchor="start" fill="#222" font-weight="normal">melting point usually high</text><text x="194" y="145.0" font-size="7.2" text-anchor="start" fill="#7B2CD9" font-weight="normal">-</text><text x="202" y="144.8" font-size="6.6" text-anchor="start" fill="#222" font-weight="normal">low or very high, no rule</text><text x="12" y="157.5" font-size="7.2" text-anchor="start" fill="#1565C0" font-weight="normal">-</text><text x="20" y="157.3" font-size="6.6" text-anchor="start" fill="#222" font-weight="normal">opaque</text><text x="194" y="157.5" font-size="7.2" text-anchor="start" fill="#7B2CD9" font-weight="normal">-</text><text x="202" y="157.3" font-size="6.6" text-anchor="start" fill="#222" font-weight="normal">transparent or coloured</text><text x="12" y="170.0" font-size="7.2" text-anchor="start" fill="#1565C0" font-weight="normal">-</text><text x="20" y="169.8" font-size="6.6" text-anchor="start" fill="#222" font-weight="normal">form cations, react with acids</text><text x="194" y="170.0" font-size="7.2" text-anchor="start" fill="#7B2CD9" font-weight="normal">-</text><text x="202" y="169.8" font-size="6.6" text-anchor="start" fill="#222" font-weight="normal">form anions, react with alkalis</text><text x="12" y="182.5" font-size="7.2" text-anchor="start" fill="#1565C0" font-weight="normal">-</text><text x="20" y="182.3" font-size="6.6" text-anchor="start" fill="#222" font-weight="normal">density high, 2.7 to 19</text><text x="194" y="182.5" font-size="7.2" text-anchor="start" fill="#7B2CD9" font-weight="normal">-</text><text x="202" y="182.3" font-size="6.6" text-anchor="start" fill="#222" font-weight="normal">density low, under 5</text><rect x="6.0" y="204.0" width="348.0" height="58.0" rx="5" fill="#F5EEFD" stroke="#7B2CD9" stroke-width="1"/><text x="180.0" y="218.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">the borderline cases worth knowing</text><text x="180.0" y="232.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">silicon and germanium are metalloids: shiny and brittle, and semiconductors</text><text x="180.0" y="244.2" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">graphite is a non-metal that conducts - its electrons move within a layer</text><text x="180.0" y="255.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="normal">diamond, silicon carbide and alumina are non-metals harder than any steel</text><text x="180.0" y="277.0" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">Every difference in the two columns comes from one thing: whether the outer</text><text x="180.0" y="289.5" font-size="8.6" text-anchor="middle" fill="#666666" font-weight="normal">electrons are free to move through the solid. That is the definition to write first.</text></svg>