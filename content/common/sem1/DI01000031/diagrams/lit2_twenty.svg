<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 392" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="392" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">After Twenty Years</text><text x="180" y="49.6" font-size="10.4" text-anchor="middle" fill="#666" font-weight="normal">two meetings, twenty years apart</text><rect x="12.0" y="61.0" width="336" height="26" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="77.3" font-size="9.3" text-anchor="middle" fill="#222" font-weight="normal">Twenty years ago: Bob and Jimmy dine at Big Joe Brady's</text><rect x="12.0" y="93.0" width="336" height="26" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="109.3" font-size="9.3" text-anchor="middle" fill="#222" font-weight="normal">They promise to meet on the same spot, same date</text><rect x="12.0" y="135.0" width="336" height="26" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="151.3" font-size="9.3" text-anchor="middle" fill="#222" font-weight="normal">10 pm tonight: Bob waits in a hardware-store doorway</text><rect x="12.0" y="167.0" width="336" height="26" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="183.3" font-size="9.3" text-anchor="middle" fill="#222" font-weight="normal">A policeman on the beat stops; Bob tells his story</text><rect x="12.0" y="209.0" width="336" height="26" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="225.3" font-size="9.3" text-anchor="middle" fill="#222" font-weight="normal">The policeman moves on - he is Jimmy Wells</text><rect x="12.0" y="241.0" width="336" height="26" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="257.3" font-size="9.3" text-anchor="middle" fill="#222" font-weight="normal">A tall man arrives, calls him Bob, and they walk</text><rect x="12.0" y="283.0" width="336" height="26" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="180" y="299.3" font-size="9.3" text-anchor="middle" fill="#222" font-weight="normal">Under the light Bob sees it is not Jimmy - he is arrested</text><rect x="12.0" y="315.0" width="336" height="26" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="180" y="331.3" font-size="9.3" text-anchor="middle" fill="#222" font-weight="normal">Note from Jimmy: 'I saw the face of the man wanted in Chicago'</text><text x="180" y="371.5" font-size="9.9" text-anchor="middle" fill="#666" font-weight="normal">Jimmy kept the appointment, but sent an officer to arrest him.</text></svg>