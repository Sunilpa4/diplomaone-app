<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 344" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="344" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">The seven Cs of a good message</text><text x="180" y="49.6" font-size="10.4" text-anchor="middle" fill="#666" font-weight="normal">check the list before you send</text><rect x="12.0" y="59.0" width="336" height="26" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="75.4" font-size="9.8" text-anchor="middle" fill="#222" font-weight="normal">Clear - one idea per sentence, no jargon</text><rect x="12.0" y="93.0" width="336" height="26" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="109.4" font-size="9.8" text-anchor="middle" fill="#222" font-weight="normal">Concise - short - say it in the fewest words</text><rect x="12.0" y="127.0" width="336" height="26" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="143.4" font-size="9.8" text-anchor="middle" fill="#222" font-weight="normal">Concrete - facts, figures and examples</text><rect x="12.0" y="161.0" width="336" height="26" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="177.4" font-size="9.8" text-anchor="middle" fill="#222" font-weight="normal">Correct - right grammar, spelling and data</text><rect x="12.0" y="195.0" width="336" height="26" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="211.4" font-size="9.8" text-anchor="middle" fill="#222" font-weight="normal">Coherent - logical order, one topic</text><rect x="12.0" y="229.0" width="336" height="26" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="245.4" font-size="9.8" text-anchor="middle" fill="#222" font-weight="normal">Complete - all the details the reader needs</text><rect x="12.0" y="263.0" width="336" height="26" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="279.4" font-size="9.8" text-anchor="middle" fill="#222" font-weight="normal">Courteous - polite, respectful tone</text><text x="180" y="321.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Seven Cs take ten seconds and prevent most misunderstandings.</text></svg>