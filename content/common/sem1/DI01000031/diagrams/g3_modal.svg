<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 536" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="536" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Modal auxiliaries by function</text><text x="180" y="49.6" font-size="10.4" text-anchor="middle" fill="#666" font-weight="normal">one meaning, one example</text><rect x="12.0" y="58.0" width="336" height="24" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="73.3" font-size="9.5" text-anchor="middle" fill="#222" font-weight="normal">Ability: can, could</text><text x="180" y="100.3" font-size="9.3" text-anchor="middle" fill="#444" font-weight="normal">"I can weld." / "He could weld at 16."</text><rect x="12.0" y="120.0" width="336" height="24" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="135.3" font-size="9.5" text-anchor="middle" fill="#222" font-weight="normal">Permission: may, can, could</text><text x="180" y="162.3" font-size="9.3" text-anchor="middle" fill="#444" font-weight="normal">"May I open the panel?"</text><rect x="12.0" y="182.0" width="336" height="24" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="197.3" font-size="9.5" text-anchor="middle" fill="#222" font-weight="normal">Possibility: may, might, could</text><text x="180" y="224.3" font-size="9.3" text-anchor="middle" fill="#444" font-weight="normal">"The seal may leak."</text><rect x="12.0" y="244.0" width="336" height="24" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="259.3" font-size="9.5" text-anchor="middle" fill="#222" font-weight="normal">Obligation: must, should, ought to</text><text x="180" y="286.3" font-size="9.3" text-anchor="middle" fill="#444" font-weight="normal">"You must wear goggles."</text><rect x="12.0" y="306.0" width="336" height="24" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="321.3" font-size="9.5" text-anchor="middle" fill="#222" font-weight="normal">Advice: should, ought to</text><text x="180" y="348.3" font-size="9.3" text-anchor="middle" fill="#444" font-weight="normal">"You should torque it twice."</text><rect x="12.0" y="368.0" width="336" height="24" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="180" y="383.3" font-size="9.5" text-anchor="middle" fill="#222" font-weight="normal">Future and offers: shall, will, would</text><text x="180" y="410.3" font-size="9.3" text-anchor="middle" fill="#444" font-weight="normal">"Shall we start?" / "I will call."</text><rect x="12.0" y="430.0" width="336" height="24" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="180" y="445.3" font-size="9.5" text-anchor="middle" fill="#222" font-weight="normal">Need and absence of need: need, need not</text><text x="180" y="472.3" font-size="9.3" text-anchor="middle" fill="#444" font-weight="normal">"You need not come."</text><text x="180" y="509.5" font-size="10.0" text-anchor="middle" fill="#666" font-weight="normal">No -s and no -ed: "he can", "must".</text><text x="180" y="525.5" font-size="10.0" text-anchor="middle" fill="#666" font-weight="normal">One modal per verb: "will can" becomes "will be able to".</text></svg>