<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 380" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="380" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Three kinds of communication</text><text x="180" y="49.6" font-size="10.4" text-anchor="middle" fill="#666" font-weight="normal">verbal, non-verbal and visual</text><rect x="13.0" y="63.0" width="334" height="26" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="79.6" font-size="10.4" text-anchor="middle" fill="#222" font-weight="normal">Verbal: words - spoken or written</text><rect x="13.0" y="95.0" width="334" height="26" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="111.4" font-size="9.6" text-anchor="middle" fill="#222" font-weight="normal">spoken: viva, phone call, lecture, interview</text><rect x="13.0" y="127.0" width="334" height="26" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="143.4" font-size="9.6" text-anchor="middle" fill="#222" font-weight="normal">written: e-mail, report, notice, WhatsApp text</text><rect x="13.0" y="165.0" width="334" height="26" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="181.6" font-size="10.4" text-anchor="middle" fill="#222" font-weight="normal">Non-verbal: body and voice, without words</text><rect x="13.0" y="197.0" width="334" height="26" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="213.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">gesture, posture, eye contact, tone, personal space</text><rect x="13.0" y="235.0" width="334" height="26" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="251.6" font-size="10.4" text-anchor="middle" fill="#222" font-weight="normal">Visual: pictures and layouts</text><rect x="13.0" y="267.0" width="334" height="26" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="283.4" font-size="9.6" text-anchor="middle" fill="#222" font-weight="normal">graph, chart, map, safety sign, icon, flowchart</text><rect x="13.0" y="306.0" width="334" height="24" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="180" y="321.4" font-size="9.8" text-anchor="middle" fill="#222" font-weight="normal">most messages mix all three at once</text><text x="180" y="359.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">A safety sign is visual, the warning shout is verbal,</text><text x="180" y="375.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">and the raised hand that stops the gang is non-verbal.</text></svg>