<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 342" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="342" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Subject-verb agreement</text><text x="180" y="49.6" font-size="10.4" text-anchor="middle" fill="#666" font-weight="normal">five rules that cover most sentences</text><rect x="12.0" y="55.0" width="336" height="38" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="77.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">One subject - one verb: The motor runs.</text><rect x="12.0" y="103.0" width="336" height="38" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="125.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">Two subjects with and - plural: The motor and the pump run.</text><rect x="12.0" y="151.0" width="336" height="38" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="167.6" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">either / or - the nearer subject decides:</text><text x="180" y="179.0" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">Either the belt or the bearings are worn.</text><rect x="12.0" y="199.0" width="336" height="38" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="221.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">Collective noun as one unit: The team is ready.</text><rect x="12.0" y="247.0" width="336" height="38" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="180" y="269.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">Uncountable and amounts: The water is hot. Fifty rupees is enough.</text><text x="180" y="321.5" font-size="10.0" text-anchor="middle" fill="#666" font-weight="normal">Find the subject first, ignore the words between it and the verb.</text><text x="180" y="337.5" font-size="10.0" text-anchor="middle" fill="#666" font-weight="normal">"The box of bolts is heavy" - the subject is box, not bolts.</text></svg>