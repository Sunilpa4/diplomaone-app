<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 268" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="268" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Four e-mails you will write</text><text x="180" y="49.6" font-size="10.3" text-anchor="middle" fill="#666" font-weight="normal">purpose and one line each</text><rect x="13.0" y="63.0" width="334" height="30" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="81.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">Inquiry: ask for rate, stock, delivery or terms</text><rect x="13.0" y="103.0" width="334" height="30" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="121.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">Reply to inquiry: answer every question, in order</text><rect x="13.0" y="143.0" width="334" height="30" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="161.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">Order: item, quantity, price, delivery, payment</text><rect x="13.0" y="183.0" width="334" height="30" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="180" y="201.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">Complaint: what is wrong, the evidence, the remedy</text><text x="180" y="245.5" font-size="9.9" text-anchor="middle" fill="#666" font-weight="normal">All four share one shape: purpose, details, action, close.</text><text x="180" y="261.5" font-size="9.9" text-anchor="middle" fill="#666" font-weight="normal">The only thing that changes is what you ask the reader to do.</text></svg>