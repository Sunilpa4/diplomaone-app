<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 374" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="374" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">The eight parts of speech</text><text x="180" y="49.6" font-size="10.4" text-anchor="middle" fill="#666" font-weight="normal">word class - one example each</text><rect x="12.0" y="59.0" width="336" height="26" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="75.4" font-size="9.6" text-anchor="middle" fill="#222" font-weight="normal">Noun - names: motor, Surat, honesty</text><rect x="12.0" y="93.0" width="336" height="26" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="109.4" font-size="9.6" text-anchor="middle" fill="#222" font-weight="normal">Pronoun - replaces a noun: it, they, who</text><rect x="12.0" y="127.0" width="336" height="26" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="143.4" font-size="9.6" text-anchor="middle" fill="#222" font-weight="normal">Verb - action or state: run, is, replace</text><rect x="12.0" y="161.0" width="336" height="26" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="177.4" font-size="9.6" text-anchor="middle" fill="#222" font-weight="normal">Adjective - describes a noun: hot, three, brass</text><rect x="12.0" y="195.0" width="336" height="26" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="211.4" font-size="9.6" text-anchor="middle" fill="#222" font-weight="normal">Adverb - describes a verb: quickly, daily, very</text><rect x="12.0" y="229.0" width="336" height="26" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="245.4" font-size="9.6" text-anchor="middle" fill="#222" font-weight="normal">Preposition - links to a place or time: under, at, after</text><rect x="12.0" y="263.0" width="336" height="26" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="180" y="279.4" font-size="9.6" text-anchor="middle" fill="#222" font-weight="normal">Conjunction - joins: and, but, because</text><rect x="12.0" y="297.0" width="336" height="26" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="180" y="313.4" font-size="9.6" text-anchor="middle" fill="#222" font-weight="normal">Interjection - sudden feeling: oh!, alas!, hurray!</text><text x="180" y="353.5" font-size="10.0" text-anchor="middle" fill="#666" font-weight="normal">Same word, different class: "paint" is a verb in "paint the wall",</text><text x="180" y="369.5" font-size="10.0" text-anchor="middle" fill="#666" font-weight="normal">and a noun in "the paint is wet".</text></svg>