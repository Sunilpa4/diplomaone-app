<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 334" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="334" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">The parts of a business e-mail</text><text x="180" y="49.6" font-size="10.3" text-anchor="middle" fill="#666" font-weight="normal">eight blocks, top to bottom</text><rect x="12.0" y="58.0" width="336" height="24" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="73.3" font-size="9.3" text-anchor="middle" fill="#222" font-weight="normal">To:  purchase@shreetools.in</text><rect x="12.0" y="88.0" width="336" height="24" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="103.3" font-size="9.3" text-anchor="middle" fill="#222" font-weight="normal">Cc:  stores@abctools.in</text><rect x="12.0" y="118.0" width="336" height="24" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="180" y="133.3" font-size="9.3" text-anchor="middle" fill="#222" font-weight="normal">Subject:  Inquiry - 12 mm MS plates, 2 tonnes</text><path d="[(14, 154), (346, 154)]" fill="none" stroke="#BBB" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="20" y="171.3" font-size="9.3" text-anchor="start" fill="#2E7D32" font-weight="normal">Dear Sir,</text><text x="20" y="189.3" font-size="9.3" text-anchor="start" fill="#666" font-weight="normal">We need 2 tonnes of 12 mm MS plates for a</text><text x="20" y="207.3" font-size="9.3" text-anchor="start" fill="#666" font-weight="normal">fabrication job at our Surat site.</text><text x="20" y="225.3" font-size="9.3" text-anchor="start" fill="#666" font-weight="normal">Please send your rate, delivery time and</text><text x="20" y="243.3" font-size="9.3" text-anchor="start" fill="#666" font-weight="normal">payment terms by Friday.</text><text x="20" y="265.3" font-size="9.3" text-anchor="start" fill="#2E7D32" font-weight="normal">Regards,</text><text x="20" y="283.1" font-size="9.0" text-anchor="start" fill="#666" font-weight="normal">R. Patel, Site Engineer, ABC Engineering</text><text x="180" y="313.5" font-size="9.9" text-anchor="middle" fill="#666" font-weight="normal">Subject and closing carry the most marks: one clear subject line,</text><text x="180" y="329.5" font-size="9.9" text-anchor="middle" fill="#666" font-weight="normal">one polite close, one signature with your name and role.</text></svg>