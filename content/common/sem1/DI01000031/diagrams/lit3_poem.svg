<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 328" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="328" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Stopping by Woods</text><text x="180" y="49.6" font-size="10.4" text-anchor="middle" fill="#666" font-weight="normal">four quatrains, one decision</text><rect x="12.0" y="64.0" width="336" height="28" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="81.3" font-size="9.5" text-anchor="middle" fill="#222" font-weight="normal">1  He stops to watch the woods fill up with snow</text><rect x="12.0" y="104.0" width="336" height="28" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="121.3" font-size="9.5" text-anchor="middle" fill="#222" font-weight="normal">2  The horse finds it strange: no farmhouse near</text><rect x="12.0" y="144.0" width="336" height="28" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="161.3" font-size="9.5" text-anchor="middle" fill="#222" font-weight="normal">3  The horse shakes its bells; the only other sound is the wind</text><rect x="12.0" y="184.0" width="336" height="28" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="180" y="201.3" font-size="9.5" text-anchor="middle" fill="#222" font-weight="normal">4  'But I have promises to keep' - he moves on</text><rect x="12.0" y="226.0" width="336" height="40" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="243.6" font-size="9.5" text-anchor="middle" fill="#222" font-weight="normal">Rhyme: aaba bbcb ccdc dddd</text><text x="180" y="255.1" font-size="9.5" text-anchor="middle" fill="#222" font-weight="normal">The last two lines repeat</text><text x="180" y="303.5" font-size="9.9" text-anchor="middle" fill="#666" font-weight="normal">Movement: attraction of the woods, then the pull of duty.</text><text x="180" y="319.5" font-size="9.9" text-anchor="middle" fill="#666" font-weight="normal">The repeated line sounds weary and resolved at once.</text></svg>