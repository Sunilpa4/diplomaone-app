<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 316" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="316" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">The Leopard: the plot</text><text x="180" y="49.6" font-size="10.4" text-anchor="middle" fill="#666" font-weight="normal">five steps, from trust to betrayal</text><rect x="12.0" y="61.0" width="336" height="30" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="79.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">1. The narrator walks the ravine every day</text><rect x="12.0" y="103.0" width="336" height="30" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="121.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">2. He meets a leopard at the stream; neither runs away</text><rect x="12.0" y="145.0" width="336" height="30" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="163.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">3. Hunters come and ask where it is; he says he has seen nothing</text><rect x="12.0" y="187.0" width="336" height="30" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="180" y="205.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">4. The leopard is killed and its skin is taken and sold</text><rect x="12.0" y="229.0" width="336" height="30" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="247.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">5. He walks home through a silent forest - the trust is broken</text><text x="180" y="291.5" font-size="9.9" text-anchor="middle" fill="#666" font-weight="normal">Turning point: the arrival of the shikaris - the narrator has to choose</text><text x="180" y="307.5" font-size="9.9" text-anchor="middle" fill="#666" font-weight="normal">between the hunters and the animal that trusted him.</text></svg>