<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 350" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="350" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">The shape of a paragraph</text><text x="180" y="49.6" font-size="10.3" text-anchor="middle" fill="#666" font-weight="normal">one idea, supported, then closed</text><rect x="15.0" y="62.0" width="330" height="28" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="79.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">Topic sentence: the one idea of the paragraph</text><rect x="15.0" y="100.0" width="330" height="28" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="117.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">Support 1: a fact, an example or a reason</text><rect x="15.0" y="138.0" width="330" height="28" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="155.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">Support 2: another fact or example</text><rect x="15.0" y="176.0" width="330" height="28" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="193.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">Support 3: a detail that makes it vivid</text><rect x="15.0" y="214.0" width="330" height="28" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="231.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">Concluding sentence: rounds off or looks ahead</text><rect x="15.0" y="259.0" width="330" height="30" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="180" y="271.6" font-size="9.5" text-anchor="middle" fill="#222" font-weight="normal">about 150 words = 12 to 15 lines</text><text x="180" y="283.1" font-size="9.5" text-anchor="middle" fill="#222" font-weight="normal">3 to 5 supporting sentences</text><text x="180" y="327.5" font-size="9.9" text-anchor="middle" fill="#666" font-weight="normal">One paragraph, one idea. A second idea needs a second paragraph.</text></svg>