<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 294" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="294" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">The Leopard: the conflicts</text><text x="180" y="49.6" font-size="10.4" text-anchor="middle" fill="#666" font-weight="normal">four tensions in one short story</text><rect x="12.0" y="63.0" width="336" height="34" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="83.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">Narrator against hunters: he hides the leopard; they hunt it</text><rect x="12.0" y="109.0" width="336" height="34" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="129.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">Man against nature: the hill station grows, the forest shrinks</text><rect x="12.0" y="155.0" width="336" height="34" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="175.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">Greed against care: a skin worth over 1,000 rupees in Delhi</text><rect x="12.0" y="201.0" width="336" height="34" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="180" y="221.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">Silence against speech: he says nothing; the forest falls silent</text><text x="180" y="269.5" font-size="9.9" text-anchor="middle" fill="#666" font-weight="normal">Each conflict ends the same way: the animal loses.</text><text x="180" y="285.5" font-size="9.9" text-anchor="middle" fill="#666" font-weight="normal">The narrator's silence protects the leopard for a while, then fails.</text></svg>