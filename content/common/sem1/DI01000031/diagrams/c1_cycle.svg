<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 400" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="400" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">The communication cycle</text><text x="180" y="49.6" font-size="10.4" text-anchor="middle" fill="#666" font-weight="normal">seven parts, in this order</text><rect x="15.0" y="61.0" width="330" height="26" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="77.5" font-size="9.9" text-anchor="middle" fill="#222" font-weight="normal">S - Sender: the person who has the idea</text><path d="M180 87 L180 106" fill="none" stroke="#666" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,106.0 183.5,99.0 176.5,99.0" fill="#666"/><rect x="15.0" y="106.0" width="330" height="26" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="122.5" font-size="9.9" text-anchor="middle" fill="#222" font-weight="normal">E - Encoding: the idea becomes words, signs or pictures</text><path d="M180 132 L180 151" fill="none" stroke="#666" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,151.0 183.5,144.0 176.5,144.0" fill="#666"/><rect x="15.0" y="151.0" width="330" height="26" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="167.5" font-size="9.9" text-anchor="middle" fill="#222" font-weight="normal">C - Channel: speech, e-mail, phone call, notice board</text><path d="M180 177 L180 196" fill="none" stroke="#666" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,196.0 183.5,189.0 176.5,189.0" fill="#666"/><rect x="15.0" y="196.0" width="330" height="26" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="212.5" font-size="9.9" text-anchor="middle" fill="#222" font-weight="normal">D - Decoding: the receiver works out what the words mean</text><path d="M180 222 L180 241" fill="none" stroke="#666" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,241.0 183.5,234.0 176.5,234.0" fill="#666"/><rect x="15.0" y="241.0" width="330" height="26" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="257.5" font-size="9.9" text-anchor="middle" fill="#222" font-weight="normal">R - Receiver: the person the message is meant for</text><path d="M180 267 L180 286" fill="none" stroke="#666" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,286.0 183.5,279.0 176.5,279.0" fill="#666"/><rect x="15.0" y="286.0" width="330" height="26" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="302.5" font-size="9.9" text-anchor="middle" fill="#222" font-weight="normal">F - Feedback: the reply that closes the loop</text><rect x="15.0" y="327.0" width="330" height="26" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="180" y="343.5" font-size="9.9" text-anchor="middle" fill="#222" font-weight="normal">N - Noise: anything that disturbs a part of the cycle</text><text x="180" y="379.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Feedback is what makes it communication, not just a broadcast.</text><text x="180" y="395.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Noise can enter at any stage - the room, the words, or the mood.</text></svg>