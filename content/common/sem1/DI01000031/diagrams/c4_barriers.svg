<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 350" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="350" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Five families of barriers</text><text x="180" y="49.6" font-size="10.4" text-anchor="middle" fill="#666" font-weight="normal">and one example of each</text><rect x="12.0" y="65.0" width="336" height="26" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="81.4" font-size="9.7" text-anchor="middle" fill="#222" font-weight="normal">Physical: noise, distance, weak network</text><rect x="12.0" y="101.0" width="336" height="26" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="117.4" font-size="9.7" text-anchor="middle" fill="#222" font-weight="normal">Language: jargon, wrong word, poor grammar</text><rect x="12.0" y="137.0" width="336" height="26" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="153.4" font-size="9.7" text-anchor="middle" fill="#222" font-weight="normal">Psychological: fear, stress, prejudice, no attention</text><rect x="12.0" y="173.0" width="336" height="26" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="180" y="189.4" font-size="9.7" text-anchor="middle" fill="#222" font-weight="normal">Cultural: customs, gestures that mean different things</text><rect x="12.0" y="209.0" width="336" height="26" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="225.4" font-size="9.7" text-anchor="middle" fill="#222" font-weight="normal">Organisational: too many levels, no clear channel</text><rect x="12.0" y="253.0" width="336" height="30" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="265.5" font-size="9.8" text-anchor="middle" fill="#222" font-weight="normal">cure: plan the message, use simple words,</text><text x="180" y="277.3" font-size="9.8" text-anchor="middle" fill="#222" font-weight="normal">listen, and confirm by feedback</text><text x="180" y="319.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Name the barrier first; the cure follows almost by itself.</text></svg>