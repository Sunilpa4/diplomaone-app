<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="330" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Tenses on a timeline</text><text x="180" y="49.6" font-size="10.4" text-anchor="middle" fill="#666" font-weight="normal">what the verb does, and when</text><path d="[(24, 74), (336, 74)]" fill="none" stroke="#666" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M316 74 L338 74" fill="none" stroke="#666" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="338.0,74.0 331.0,70.5 331.0,77.5" fill="#666"/><text x="40" y="69.4" font-size="9.6" text-anchor="middle" fill="#666" font-weight="normal">past</text><text x="180" y="69.4" font-size="9.6" text-anchor="middle" fill="#666" font-weight="normal">now</text><text x="316" y="69.4" font-size="9.6" text-anchor="middle" fill="#666" font-weight="normal">future</text><rect x="12.0" y="82.0" width="336" height="44" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="101.6" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">PAST: wrote / was writing / had written</text><text x="180" y="113.0" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">reported, described, finished before now</text><rect x="12.0" y="127.0" width="336" height="62" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="155.6" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">PRESENT: writes / is writing / has written / has been writing</text><text x="180" y="167.0" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">habits, facts, right now, finished with a present result, still going on</text><rect x="12.0" y="208.0" width="336" height="44" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="227.6" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">FUTURE: will write</text><text x="180" y="239.0" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">plans, promises, predictions</text><text x="180" y="303.5" font-size="10.0" text-anchor="middle" fill="#666" font-weight="normal">Markers decide the tense: yesterday, since Monday, tomorrow.</text><text x="180" y="319.5" font-size="10.0" text-anchor="middle" fill="#666" font-weight="normal">One sentence can mix tenses: "He has finished, so he will go home."</text></svg>