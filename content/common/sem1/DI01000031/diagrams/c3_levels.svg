<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 356" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="356" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Upward and downward</text><text x="180" y="49.6" font-size="10.4" text-anchor="middle" fill="#666" font-weight="normal">who sends, who receives</text><rect x="105.0" y="65.0" width="150" height="26" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="81.5" font-size="10.0" text-anchor="middle" fill="#222" font-weight="normal">Top management</text><rect x="105.0" y="135.0" width="150" height="26" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="151.5" font-size="10.0" text-anchor="middle" fill="#222" font-weight="normal">Middle level</text><rect x="105.0" y="205.0" width="150" height="26" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="221.5" font-size="10.0" text-anchor="middle" fill="#222" font-weight="normal">Workers and operators</text><path d="M180 91 L180 135" fill="none" stroke="#666" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,135.0 183.5,128.0 176.5,128.0" fill="#666"/><path d="M180 161 L180 205" fill="none" stroke="#666" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,205.0 183.5,198.0 176.5,198.0" fill="#666"/><path d="M96 205 L96 161" fill="none" stroke="#BD2543" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="96.0,161.0 92.5,168.0 99.5,168.0" fill="#BD2543"/><path d="M96 135 L96 91" fill="none" stroke="#BD2543" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="96.0,91.0 92.5,98.0 99.5,98.0" fill="#BD2543"/><text x="70" y="203.3" font-size="9.4" text-anchor="end" fill="#BD2543" font-weight="normal">upward</text><path d="M264 91 L264 135" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="264.0,135.0 267.5,128.0 260.5,128.0" fill="#1565C0"/><path d="M264 161 L264 205" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="264.0,205.0 267.5,198.0 260.5,198.0" fill="#1565C0"/><text x="292" y="203.3" font-size="9.4" text-anchor="start" fill="#1565C0" font-weight="normal">downward</text><rect x="12.0" y="254.0" width="336" height="24" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="269.4" font-size="9.6" text-anchor="middle" fill="#222" font-weight="normal">downward: orders, circulars, policy, instructions</text><rect x="12.0" y="286.0" width="336" height="24" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="180" y="301.4" font-size="9.6" text-anchor="middle" fill="#222" font-weight="normal">upward: reports, suggestions, grievances, feedback</text><text x="180" y="337.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Downward flows as authority; upward flows as information.</text><text x="180" y="353.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">A one-way downward flow quickly loses the workers' ideas.</text></svg>