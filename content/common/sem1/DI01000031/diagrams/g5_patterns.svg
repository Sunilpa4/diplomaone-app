<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 290" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="290" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">The four sentence patterns</text><text x="180" y="49.6" font-size="10.4" text-anchor="middle" fill="#666" font-weight="normal">subject, verb, and what follows</text><text x="26" y="97.0" font-size="11.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">SV</text><rect x="71.0" y="63.0" width="66" height="26" rx="7" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.6"/><text x="104" y="79.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">The motor</text><rect x="147.0" y="63.0" width="66" height="26" rx="7" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="79.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">failed</text><text x="26" y="143.0" font-size="11.5" text-anchor="middle" fill="#1565C0" font-weight="bold">SVO</text><rect x="71.0" y="109.0" width="66" height="26" rx="7" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.6"/><text x="104" y="125.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">The fitter</text><rect x="147.0" y="109.0" width="66" height="26" rx="7" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="125.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">replaced</text><rect x="220.0" y="109.0" width="84" height="26" rx="7" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.6"/><text x="262" y="125.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">the belt</text><text x="26" y="189.0" font-size="11.5" text-anchor="middle" fill="#B66A00" font-weight="bold">SVA</text><rect x="71.0" y="155.0" width="66" height="26" rx="7" fill="#FFFFFF" stroke="#B66A00" stroke-width="1.6"/><text x="104" y="171.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">The pump</text><rect x="147.0" y="155.0" width="66" height="26" rx="7" fill="#FFFFFF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="171.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">runs</text><rect x="220.0" y="155.0" width="84" height="26" rx="7" fill="#FFFFFF" stroke="#B66A00" stroke-width="1.6"/><text x="262" y="171.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">smoothly</text><text x="26" y="235.0" font-size="11.5" text-anchor="middle" fill="#BD2543" font-weight="bold">SVC</text><rect x="71.0" y="201.0" width="66" height="26" rx="7" fill="#FFFFFF" stroke="#BD2543" stroke-width="1.6"/><text x="104" y="217.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">The panel</text><rect x="147.0" y="201.0" width="66" height="26" rx="7" fill="#FFFFFF" stroke="#BD2543" stroke-width="1.6"/><text x="180" y="217.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">is</text><rect x="220.0" y="201.0" width="84" height="26" rx="7" fill="#FFFFFF" stroke="#BD2543" stroke-width="1.6"/><text x="262" y="217.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">hot</text><text x="180" y="267.5" font-size="10.0" text-anchor="middle" fill="#666" font-weight="normal">SVO needs an object, SVA an adverb, SVC a complement.</text><text x="180" y="283.5" font-size="10.0" text-anchor="middle" fill="#666" font-weight="normal">"Hot" describes the panel, so it is a complement, not an object.</text></svg>