<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 326" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="326" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Double angle from one triangle</text><text x="180" y="49.7" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal">Put B = A in the compound formulae</text><rect x="60.0" y="55.0" width="240" height="34" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="76.0" font-size="11.4" text-anchor="middle" fill="#222" font-weight="normal">sin A = 3/5,  cos A = 4/5</text><path d="M150 90 L110 116" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="110.0,116.0 117.8,115.1 114.0,109.3" fill="#333"/><path d="M210 90 L250 116" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="250.0,116.0 246.0,109.3 242.2,115.1" fill="#333"/><rect x="34.0" y="117.0" width="144" height="34" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="106" y="137.6" font-size="10.2" text-anchor="middle" fill="#222" font-weight="normal">sin 2A = 2 sin A cos A</text><rect x="182.0" y="117.0" width="144" height="34" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="254" y="137.6" font-size="10.2" text-anchor="middle" fill="#222" font-weight="normal">cos 2A = 1 − 2 sin²A</text><path d="M106 152 L106 176" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="106.0,176.0 109.5,169.0 102.5,169.0" fill="#333"/><path d="M254 152 L254 176" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="254.0,176.0 257.5,169.0 250.5,169.0" fill="#333"/><rect x="34.0" y="179.0" width="144" height="30" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="106" y="198.2" font-size="12" text-anchor="middle" fill="#1B5E20" font-weight="bold">= 24/25</text><rect x="182.0" y="179.0" width="144" height="30" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="254" y="198.2" font-size="12" text-anchor="middle" fill="#B66A00" font-weight="bold">= 7/25</text><rect x="20.0" y="229.0" width="320" height="30" rx="7" fill="#F4F4F4" stroke="#999" stroke-width="1.6"/><text x="180" y="247.7" font-size="10.6" text-anchor="middle" fill="#333" font-weight="normal">check: (24/25)² + (7/25)² = 1</text><text x="180" y="291.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Three forms of cos 2A: cos²A − sin²A, 2cos²A − 1, 1 − 2sin²A.</text><text x="180" y="307.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Pick the form that uses what the question gives you.</text></svg>