<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 376" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="376" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Parallel and perpendicular</text><text x="180" y="49.7" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal">m₁ = m₂   and   m₁m₂ = −1</text><text x="34" y="75.3" font-size="9.4" text-anchor="start" fill="#666" font-weight="normal">parallel</text><path d="M46 150 L206 82" fill="none" stroke="#1565C0" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M46 184 L206 116" fill="none" stroke="#1565C0" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/><text x="214" y="91.4" font-size="9.8" text-anchor="start" fill="#1565C0" font-weight="normal">m₁ = m₂</text><text x="214" y="109.1" font-size="8.8" text-anchor="start" fill="#666" font-weight="normal">same slope</text><text x="34" y="209.3" font-size="9.4" text-anchor="start" fill="#666" font-weight="normal">perpendicular</text><path d="M84 250 H268" fill="none" stroke="#2E7D32" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M176 198 V250" fill="none" stroke="#2E7D32" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M176 238 h12 v12" fill="none" stroke="#2E7D32" stroke-width="1.2"/><text x="186" y="223.3" font-size="9.4" text-anchor="start" fill="#2E7D32" font-weight="normal">90°</text><text x="276" y="241.4" font-size="9.8" text-anchor="end" fill="#2E7D32" font-weight="normal">m₁m₂ = −1</text><rect x="20.0" y="275.0" width="320" height="26" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="291.4" font-size="9.6" text-anchor="middle" fill="#222" font-weight="normal">general form:  a₁/a₂ = b₁/b₂   and   a₁a₂ + b₁b₂ = 0</text><text x="180" y="325.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Parallel lines never meet; perpendicular lines cross at 90°.</text><text x="180" y="341.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Change only the constant to slide a line without turning it.</text></svg>