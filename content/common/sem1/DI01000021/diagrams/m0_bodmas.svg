<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 384" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="384" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">BODMAS: one fixed order of work</text><text x="180" y="49.7" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal">Different orders give different answers</text><rect x="18" y="64" width="324" height="38" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.5"/><text x="108" y="87.0" font-size="11.5" text-anchor="middle" fill="#1565C0" font-weight="bold">B  Brackets</text><text x="258" y="86.8" font-size="10.8" text-anchor="middle" fill="#333" font-weight="normal">(5 − 3) = 2</text><rect x="18" y="108" width="324" height="38" rx="8" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.5"/><text x="108" y="131.0" font-size="11.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">O  Orders</text><text x="258" y="130.8" font-size="10.8" text-anchor="middle" fill="#333" font-weight="normal">2² = 4</text><rect x="18" y="152" width="324" height="38" rx="8" fill="#F4F4F4" stroke="#888" stroke-width="1.5"/><text x="108" y="175.0" font-size="11.5" text-anchor="middle" fill="#888" font-weight="bold">D  Division</text><text x="258" y="174.8" font-size="10.8" text-anchor="middle" fill="#333" font-weight="normal">none here</text><rect x="18" y="196" width="324" height="38" rx="8" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.5"/><text x="108" y="219.0" font-size="11.5" text-anchor="middle" fill="#B66A00" font-weight="bold">M  Multiplication</text><text x="258" y="218.8" font-size="10.8" text-anchor="middle" fill="#333" font-weight="normal">2 × 4 = 8</text><rect x="18" y="240" width="324" height="38" rx="8" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.5"/><text x="108" y="263.0" font-size="11.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">A  Addition</text><text x="258" y="262.8" font-size="10.8" text-anchor="middle" fill="#333" font-weight="normal">8 + 8 = 16</text><rect x="18" y="284" width="324" height="38" rx="8" fill="#F4F4F4" stroke="#888" stroke-width="1.5"/><text x="108" y="307.0" font-size="11.5" text-anchor="middle" fill="#888" font-weight="bold">S  Subtraction</text><text x="258" y="306.8" font-size="10.8" text-anchor="middle" fill="#333" font-weight="normal">none here</text><text x="180" y="337.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">8 + 2 × (5 − 3)² = 8 + 2(4) = 16</text><text x="180" y="353.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">2 + 3 × 4 = 14, never 20</text></svg>