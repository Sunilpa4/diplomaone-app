<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 384" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="384" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Allied angles: sign first, then value</text><text x="180" y="49.7" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal">Even multiple of 90° keeps the name</text><rect x="16" y="66" width="328" height="44" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.4"/><text x="26" y="90.3" font-size="12.2" text-anchor="start" fill="#222" font-weight="normal">sin(180° − θ) =  sin θ</text><text x="334" y="89.1" font-size="8.8" text-anchor="end" fill="#666" font-weight="normal">Q II, sine positive</text><rect x="16" y="118" width="328" height="44" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.4"/><text x="26" y="142.3" font-size="12.2" text-anchor="start" fill="#222" font-weight="normal">cos(180° − θ) = −cos θ</text><text x="334" y="141.1" font-size="8.8" text-anchor="end" fill="#666" font-weight="normal">Q II, cosine negative</text><rect x="16" y="170" width="328" height="44" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.4"/><text x="26" y="194.3" font-size="12.2" text-anchor="start" fill="#222" font-weight="normal">sin(180° + θ) = −sin θ</text><text x="334" y="193.1" font-size="8.8" text-anchor="end" fill="#666" font-weight="normal">Q III, sine negative</text><rect x="16" y="222" width="328" height="44" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.4"/><text x="26" y="246.3" font-size="12.2" text-anchor="start" fill="#222" font-weight="normal">tan(360° − θ) = −tan θ</text><text x="334" y="245.1" font-size="8.8" text-anchor="end" fill="#666" font-weight="normal">Q IV, tangent negative</text><rect x="16" y="274" width="328" height="44" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.4"/><text x="26" y="298.3" font-size="12.2" text-anchor="start" fill="#222" font-weight="normal">cos(−θ)      =  cos θ</text><text x="334" y="297.1" font-size="8.8" text-anchor="end" fill="#666" font-weight="normal">cosine is even</text><text x="180" y="333.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">For 90° and 270° the function also changes: sin ↔ cos.</text><text x="180" y="349.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Worked example: sin 150° = sin 30° = 1/2.</text></svg>