<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 356" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="356" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Reading the general circle</text><text x="180" y="49.7" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal">Centre and radius straight from the coefficients</text><rect x="20.0" y="59.0" width="320" height="30" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="78.1" font-size="11.6" text-anchor="middle" fill="#222" font-weight="normal">x² + y² + 2gx + 2fy + c = 0</text><path d="M180 89 L180 110" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,110.0 183.5,103.0 176.5,103.0" fill="#7B2CD9"/><rect x="20.0" y="113.0" width="320" height="30" rx="7" fill="#F4F4F4" stroke="#999" stroke-width="1.6"/><text x="180" y="131.7" font-size="10.6" text-anchor="middle" fill="#333" font-weight="normal">complete the square in x and in y</text><path d="M180 143 L180 164" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,164.0 183.5,157.0 176.5,157.0" fill="#7B2CD9"/><rect x="20.0" y="167.0" width="320" height="30" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="185.7" font-size="10.6" text-anchor="middle" fill="#222" font-weight="normal">(x + g)² + (y + f)² = g² + f² − c</text><path d="M128 197 L96 218" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="96.0,218.0 103.8,217.1 99.9,211.2" fill="#333"/><path d="M232 197 L264 218" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="264.0,218.0 260.1,211.2 256.2,217.1" fill="#333"/><rect x="21.0" y="219.0" width="150" height="34" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="96" y="239.7" font-size="10.6" text-anchor="middle" fill="#222" font-weight="normal">centre (−g, −f)</text><rect x="191.0" y="219.0" width="150" height="34" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="266" y="239.5" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">radius √(g² + f² − c)</text><rect x="20.0" y="273.0" width="320" height="30" rx="7" fill="#F6F2FB" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="291.6" font-size="10.2" text-anchor="middle" fill="#222" font-weight="normal">example: x² + y² − 6x + 8y − 11 = 0</text><text x="180" y="329.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">gives centre (3, −4) and radius 6.</text><text x="180" y="345.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Divide by 2 first if the coefficients are not 1.</text></svg>