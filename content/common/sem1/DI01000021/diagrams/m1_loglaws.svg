<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 378" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="378" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">The four logarithm laws</text><text x="180" y="49.7" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal">All four come from the index laws</text><rect x="16" y="64" width="328" height="56" rx="8" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.5"/><text x="30" y="89.7" font-size="10.6" text-anchor="start" fill="#2E7D32" font-weight="bold">Product</text><text x="30" y="110.3" font-size="12.4" text-anchor="start" fill="#222" font-weight="normal">log(xy) = log x + log y</text><text x="330" y="89.4" font-size="9.6" text-anchor="end" fill="#666" font-weight="normal">log 6 = log 2 + log 3</text><rect x="16" y="128" width="328" height="56" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.5"/><text x="30" y="153.7" font-size="10.6" text-anchor="start" fill="#1565C0" font-weight="bold">Quotient</text><text x="30" y="174.3" font-size="12.4" text-anchor="start" fill="#222" font-weight="normal">log(x/y) = log x − log y</text><text x="330" y="153.4" font-size="9.6" text-anchor="end" fill="#666" font-weight="normal">log 1.5 = log 3 − log 2</text><rect x="16" y="192" width="328" height="56" rx="8" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.5"/><text x="30" y="217.7" font-size="10.6" text-anchor="start" fill="#B66A00" font-weight="bold">Power</text><text x="30" y="238.3" font-size="12.4" text-anchor="start" fill="#222" font-weight="normal">log(xⁿ) = n log x</text><text x="330" y="217.4" font-size="9.6" text-anchor="end" fill="#666" font-weight="normal">log 8 = 3 log 2</text><rect x="16" y="256" width="328" height="56" rx="8" fill="#FDECF0" stroke="#BD2543" stroke-width="1.5"/><text x="30" y="281.7" font-size="10.6" text-anchor="start" fill="#BD2543" font-weight="bold">Change of base</text><text x="30" y="302.3" font-size="12.4" text-anchor="start" fill="#222" font-weight="normal">logₐ x = log_b x / log_b a</text><text x="330" y="281.4" font-size="9.6" text-anchor="end" fill="#666" font-weight="normal">log₄ 8 = log₂ 8 / log₂ 4</text><text x="180" y="329.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">The laws need positive arguments and a base a &gt; 0, a ≠ 1.</text><text x="180" y="345.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">log(x + y) does not split: only products, quotients and powers do.</text></svg>