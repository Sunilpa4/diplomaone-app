<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 358" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="358" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Compound angles: two terms each</text><text x="180" y="49.7" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal">Known angles replace an unknown one</text><rect x="30.0" y="55.0" width="300" height="30" rx="7" fill="#F4F4F4" stroke="#999" stroke-width="1.6"/><text x="180" y="74.0" font-size="11.4" text-anchor="middle" fill="#333" font-weight="normal">75°  =  45° + 30°</text><path d="M180 85 L180 106" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,106.0 183.5,99.0 176.5,99.0" fill="#7B2CD9"/><rect x="30.0" y="108.0" width="300" height="32" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="128.3" font-size="12.4" text-anchor="middle" fill="#1565C0" font-weight="bold">sin(A + B)</text><path d="M150 140 L106 164" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="106.0,164.0 113.8,163.7 110.5,157.6" fill="#333"/><path d="M210 140 L254 164" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="254.0,164.0 249.5,157.6 246.2,163.7" fill="#333"/><rect x="21.0" y="166.0" width="150" height="32" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="96" y="185.9" font-size="11.2" text-anchor="middle" fill="#222" font-weight="normal">sin A cos B</text><text x="180" y="191.9" font-size="14" text-anchor="middle" fill="#333" font-weight="bold">+</text><rect x="189.0" y="166.0" width="150" height="32" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="264" y="185.9" font-size="11.2" text-anchor="middle" fill="#222" font-weight="normal">cos A sin B</text><rect x="30.0" y="217.0" width="300" height="30" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="180" y="235.8" font-size="10.8" text-anchor="middle" fill="#222" font-weight="normal">cos(A + B) = cos A cos B − sin A sin B</text><rect x="30.0" y="261.0" width="300" height="30" rx="7" fill="#F6F2FB" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="279.6" font-size="10.2" text-anchor="middle" fill="#222" font-weight="normal">tan(A + B) = (tan A + tan B)/(1 − tan A tan B)</text><text x="180" y="323.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Sine keeps the sign of the bracket; cosine flips it.</text><text x="180" y="339.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Check: sin 75° = (√6 + √2)/4 ≈ 0.966.</text></svg>