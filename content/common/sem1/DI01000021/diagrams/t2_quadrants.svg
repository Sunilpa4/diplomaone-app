<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 366" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="366" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">ASTC: which functions are positive</text><text x="180" y="49.7" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal">All · Silver · Tea · Cups, anticlockwise</text><circle cx="180" cy="168" r="78" fill="#FFFFFF" stroke="#D9D2E6" stroke-width="1.2"/><path d="M86 168 H274" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M180 74 V262" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="210.3" cy="137.7" r="26" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.3"/><text x="210.3348809129029" y="141.6" font-size="17" text-anchor="middle" fill="#2E7D32" font-weight="bold">A</text><text x="210.3348809129029" y="154.7" font-size="8.6" text-anchor="middle" fill="#2E7D32" font-weight="normal">I</text><circle cx="149.7" cy="137.7" r="26" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.3"/><text x="149.6651190870971" y="141.6" font-size="17" text-anchor="middle" fill="#1565C0" font-weight="bold">S</text><text x="149.6651190870971" y="154.7" font-size="8.6" text-anchor="middle" fill="#1565C0" font-weight="normal">II</text><circle cx="149.7" cy="198.3" r="26" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.3"/><text x="149.6651190870971" y="202.3" font-size="17" text-anchor="middle" fill="#B66A00" font-weight="bold">T</text><text x="149.6651190870971" y="215.3" font-size="8.6" text-anchor="middle" fill="#B66A00" font-weight="normal">III</text><circle cx="210.3" cy="198.3" r="26" fill="#FDECF0" stroke="#BD2543" stroke-width="1.3"/><text x="210.3348809129029" y="202.3" font-size="17" text-anchor="middle" fill="#BD2543" font-weight="bold">C</text><text x="210.3348809129029" y="215.3" font-size="8.6" text-anchor="middle" fill="#BD2543" font-weight="normal">IV</text><text x="180" y="289.7" font-size="10.6" text-anchor="middle" fill="#333" font-weight="bold">A all  ·  S sin  ·  T tan  ·  C cos</text><text x="180" y="306.3" font-size="9.4" text-anchor="middle" fill="#666" font-weight="normal">sin, cosec in II · tan, cot in III · cos, sec in IV</text><text x="180" y="331.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">x negative on the left, y negative below the axis.</text><text x="180" y="347.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">The ratio of two negatives is positive - that is why tan wins in Q III.</text></svg>