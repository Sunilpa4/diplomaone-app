<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 366" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="366" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Centre, radius, tangent and normal</text><text x="180" y="49.7" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal">The tangent is perpendicular to the radius</text><path d="M40 258 H324" fill="none" stroke="#333" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M56 268 V70" fill="none" stroke="#333" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="158" cy="172" r="76" fill="#FBF8FD" stroke="#7B2CD9" stroke-width="1.8"/><path d="M95.7 215.6 L220.3 128.4" fill="none" stroke="#1565C0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/><circle cx="158" cy="172" r="4" fill="#7B2CD9"/><text x="148" y="195.4" font-size="9.6" text-anchor="end" fill="#7B2CD9" font-weight="normal">C(h, k)</text><text x="179.12777768298167" y="144.1" font-size="11" text-anchor="middle" fill="#1565C0" font-weight="bold">r</text><path d="M170.9 58.0 L254.7 177.6" fill="none" stroke="#2E7D32" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="220.3" cy="128.4" r="4" fill="#BD2543"/><text x="228.25555536596337" y="125.7" font-size="9.4" text-anchor="start" fill="#BD2543" font-weight="normal">P(x₁, y₁)</text><text x="264.1116001651324" y="191.8" font-size="9.6" text-anchor="start" fill="#2E7D32" font-weight="normal">tangent</text><text x="87.74444463403663" y="230.9" font-size="9.4" text-anchor="end" fill="#1565C0" font-weight="normal">normal</text><path d="M210.4 135.3 L217.3 145.1 L227.1 138.2" fill="none" stroke="#B66A00" stroke-width="1.3"/><rect x="20.0" y="278.0" width="320" height="28" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="295.6" font-size="10.2" text-anchor="middle" fill="#222" font-weight="normal">tangent: xx₁ + yy₁ = a²   for  x² + y² = a²</text><text x="180" y="337.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">The normal always passes through the centre.</text><text x="180" y="353.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Slopes of tangent and radius multiply to −1.</text></svg>