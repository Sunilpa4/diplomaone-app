<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 388" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="388" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">The five-step study cycle</text><text x="180" y="49.7" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal">Learn by doing, then loop back and revise</text><rect x="76.0" y="76.0" width="272" height="42" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="212" y="101.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal"></text><text x="212" y="93.9" font-size="11.2" text-anchor="middle" fill="#1565C0" font-weight="bold">1  Read a solved example</text><text x="212" y="110.6" font-size="10.2" text-anchor="middle" fill="#333" font-weight="normal">Cover the solution, predict each line</text><rect x="76.0" y="126.0" width="272" height="42" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="212" y="151.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal"></text><text x="212" y="143.9" font-size="11.2" text-anchor="middle" fill="#1565C0" font-weight="bold">2  Copy it closed-book</text><text x="212" y="160.6" font-size="10.2" text-anchor="middle" fill="#333" font-weight="normal">Compare line by line and mark the gap</text><rect x="76.0" y="176.0" width="272" height="42" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="212" y="201.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal"></text><text x="212" y="193.9" font-size="11.2" text-anchor="middle" fill="#1565C0" font-weight="bold">3  Change the numbers</text><text x="212" y="210.6" font-size="10.2" text-anchor="middle" fill="#333" font-weight="normal">Same skeleton, your own values</text><rect x="76.0" y="226.0" width="272" height="42" rx="8" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="212" y="251.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal"></text><text x="212" y="243.9" font-size="11.2" text-anchor="middle" fill="#2E7D32" font-weight="bold">4  Attempt an unsolved one</text><text x="212" y="260.6" font-size="10.2" text-anchor="middle" fill="#333" font-weight="normal">Write every step, even the wrong ones</text><rect x="76.0" y="276.0" width="272" height="42" rx="8" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="212" y="301.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal"></text><text x="212" y="293.9" font-size="11.2" text-anchor="middle" fill="#2E7D32" font-weight="bold">5  Log the error, revise</text><text x="212" y="310.6" font-size="10.2" text-anchor="middle" fill="#333" font-weight="normal">After 1 day, 1 week, 1 month</text><path d="M54 302 V104" fill="none" stroke="#B66A00" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><polygon points="54,96 50,104 58,104" fill="#B66A00"/><text x="180" y="337.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">One numerical daily beats two hours on Sunday.</text><text x="180" y="353.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Loop back to step 1 for every new topic.</text></svg>