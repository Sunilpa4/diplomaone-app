<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 352" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="352" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Angle between two vectors</text><text x="180" y="49.7" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal">cos θ = (a · b)/(|a||b|)</text><path d="M30 220 H330" fill="none" stroke="#333" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><polygon points="336,220 326,216 326,224" fill="#333"/><path d="M96 84 V260" fill="none" stroke="#333" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="332" y="215.5" font-size="10" text-anchor="end" fill="#333" font-weight="normal">x</text><text x="106" y="95.5" font-size="10" text-anchor="end" fill="#333" font-weight="normal">y</text><path d="M96 220 L296 150" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="296.0,150.0 288.2,149.0 290.5,155.6" fill="#1565C0"/><path d="M96 220 L275 232" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="275.0,232.0 268.2,228.0 267.8,235.0" fill="#2E7D32"/><path d="M140 220 A44 44 0 0 0 138 198" fill="none" stroke="#B66A00" stroke-width="1.5"/><text x="152" y="209.8" font-size="11" text-anchor="middle" fill="#B66A00" font-weight="bold">θ</text><text x="190.0" y="181.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">a</text><text x="187.5" y="246.2" font-size="12" text-anchor="middle" fill="#2E7D32" font-weight="bold">b</text><rect x="20.0" y="265.0" width="320" height="26" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="281.6" font-size="10.4" text-anchor="middle" fill="#222" font-weight="normal">θ = cos⁻¹[(a · b)/(|a||b|)]</text><text x="180" y="321.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Positive cosine: acute. Zero: right angle. Negative: obtuse.</text><text x="180" y="337.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">The formula is the definition of the dot product rearranged.</text></svg>