<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="360" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">The cross product gives a perpendicular</text><text x="180" y="49.7" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal">a × b points along n, the right-hand rule</text><path d="M120 232 H320" fill="none" stroke="#333" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text x="322" y="229.4" font-size="9.6" text-anchor="end" fill="#333" font-weight="normal">x</text><path d="M120 232 L40 180" fill="none" stroke="#333" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text x="50" y="179.4" font-size="9.6" text-anchor="end" fill="#333" font-weight="normal">y</text><path d="M120 232 V96" fill="none" stroke="#333" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text x="130" y="107.4" font-size="9.6" text-anchor="start" fill="#333" font-weight="normal">z</text><polygon points="120,232 250,232 306,148 176,148" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.1" opacity="0.75"/><path d="M120 232 L250 232" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="250.0,232.0 243.0,228.5 243.0,235.5" fill="#1565C0"/><path d="M120 232 L176 148" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="176.0,148.0 169.2,151.9 175.0,155.8" fill="#2E7D32"/><path d="M120 232 L120 108" fill="none" stroke="#BD2543" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="120.0,108.0 116.5,115.0 123.5,115.0" fill="#BD2543"/><text x="232" y="228.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">a</text><text x="160" y="162.2" font-size="12" text-anchor="middle" fill="#2E7D32" font-weight="bold">b</text><text x="132" y="123.8" font-size="11" text-anchor="start" fill="#BD2543" font-weight="bold">a × b</text><text x="258" y="141.4" font-size="9.6" text-anchor="middle" fill="#666" font-weight="normal">area = |a × b|</text><rect x="20.0" y="268.0" width="320" height="28" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="180" y="285.6" font-size="10.2" text-anchor="middle" fill="#222" font-weight="normal">a × b = i(a₂b₃ − a₃b₂) − j(...) + k(...)</text><text x="180" y="329.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Order matters: a × b = −(b × a).</text><text x="180" y="345.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Parallel vectors give a zero cross product.</text></svg>