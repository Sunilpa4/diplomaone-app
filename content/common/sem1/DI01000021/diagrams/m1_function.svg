<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 334" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="334" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">A function is a one-output machine</text><text x="180" y="49.7" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal">Here f(x) = x² + 1</text><text x="62" y="83.5" font-size="10" text-anchor="middle" fill="#666" font-weight="bold">INPUT  x</text><text x="300" y="83.5" font-size="10" text-anchor="middle" fill="#666" font-weight="bold">OUTPUT  f(x)</text><rect x="136.0" y="97.0" width="88" height="150" rx="10" fill="#F6F2FB" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="176.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal"></text><text x="180" y="166.4" font-size="24" text-anchor="middle" fill="#7B2CD9" font-weight="bold">f</text><text x="180" y="190.0" font-size="11.5" text-anchor="middle" fill="#7B2CD9" font-weight="normal">x² + 1</text><text x="180" y="219.4" font-size="9.8" text-anchor="middle" fill="#666" font-weight="normal">one rule</text><text x="180" y="235.4" font-size="9.8" text-anchor="middle" fill="#666" font-weight="normal">one output</text><rect x="20.0" y="102.0" width="84" height="32" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="62" y="121.8" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">x = −2</text><path d="M106 118 L128 118" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="128.0,118.0 121.0,114.5 121.0,121.5" fill="#333"/><path d="M226 118 L250 118" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="250.0,118.0 243.0,114.5 243.0,121.5" fill="#333"/><rect x="258.0" y="102.0" width="84" height="32" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="300" y="122.5" font-size="13" text-anchor="middle" fill="#1B5E20" font-weight="bold">5</text><rect x="20.0" y="156.0" width="84" height="32" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="62" y="175.8" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">x = 0</text><path d="M106 172 L128 172" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="128.0,172.0 121.0,168.5 121.0,175.5" fill="#333"/><path d="M226 172 L250 172" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="250.0,172.0 243.0,168.5 243.0,175.5" fill="#333"/><rect x="258.0" y="156.0" width="84" height="32" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="300" y="176.6" font-size="13" text-anchor="middle" fill="#1B5E20" font-weight="bold">1</text><rect x="20.0" y="210.0" width="84" height="32" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="62" y="229.8" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">x = 2</text><path d="M106 226 L128 226" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="128.0,226.0 121.0,222.5 121.0,229.5" fill="#333"/><path d="M226 226 L250 226" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="250.0,226.0 243.0,222.5 243.0,229.5" fill="#333"/><rect x="258.0" y="210.0" width="84" height="32" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="300" y="230.6" font-size="13" text-anchor="middle" fill="#1B5E20" font-weight="bold">5</text><text x="180" y="293.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Every input gives exactly one output, but two inputs may</text><text x="180" y="309.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">share an output: f(−2) = f(2) = 5.</text></svg>