<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 376" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="376" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Sum and product formulae</text><text x="180" y="49.7" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal">Two directions, one derivation</text><rect x="30.0" y="55.0" width="300" height="30" rx="7" fill="#F4F4F4" stroke="#999" stroke-width="1.6"/><text x="180" y="73.7" font-size="10.6" text-anchor="middle" fill="#333" font-weight="normal">add  sin(A+B) and sin(A−B)</text><path d="M180 85 L180 106" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,106.0 183.5,99.0 176.5,99.0" fill="#7B2CD9"/><rect x="20.0" y="109.0" width="320" height="30" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="127.6" font-size="10.4" text-anchor="middle" fill="#222" font-weight="normal">sin A cos B = ½[sin(A+B) + sin(A−B)]</text><path d="M180 139 L180 160" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,160.0 183.5,153.0 176.5,153.0" fill="#7B2CD9"/><rect x="20.0" y="163.0" width="320" height="30" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="181.6" font-size="10.4" text-anchor="middle" fill="#222" font-weight="normal">2 sin A cos B = sin(A+B) + sin(A−B)</text><path d="M180 193 L180 214" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,214.0 183.5,207.0 176.5,207.0" fill="#7B2CD9"/><rect x="20.0" y="217.0" width="320" height="30" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="235.4" font-size="9.8" text-anchor="middle" fill="#222" font-weight="normal">sin C + sin D = 2 sin((C+D)/2) cos((C−D)/2)</text><rect x="20.0" y="269.0" width="320" height="34" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="180" y="289.4" font-size="9.8" text-anchor="middle" fill="#222" font-weight="normal">cos C + cos D = 2 cos((C+D)/2) cos((C−D)/2)</text><text x="180" y="339.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">cos C − cos D carries a leading minus.</text><text x="180" y="355.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Use these to cancel common factors in simplification.</text></svg>