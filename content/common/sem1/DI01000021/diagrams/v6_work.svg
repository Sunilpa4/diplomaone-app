<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 352" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="352" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Work done: only the along part counts</text><text x="180" y="49.7" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal">W = F · d = |F||d| cos θ</text><path d="M40 226 H332" fill="none" stroke="#333" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="338,226 328,222 328,230" fill="#333"/><text x="320" y="247.3" font-size="9.4" text-anchor="end" fill="#333" font-weight="normal">displacement d</text><path d="M238 116 V226" fill="none" stroke="#B9A7D6" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><path d="M96 226 H238" fill="none" stroke="#B66A00" stroke-width="4.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M96 226 L238 116" fill="none" stroke="#BD2543" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="238.0,116.0 230.3,117.5 234.6,123.1" fill="#BD2543"/><text x="250" y="153.3" font-size="9.4" text-anchor="start" fill="#666" font-weight="normal">F sin θ</text><text x="228" y="215.3" font-size="9.4" text-anchor="end" fill="#B66A00" font-weight="normal">F cos θ</text><path d="M148 226 A52 52 0 0 0 136 193" fill="none" stroke="#7B2CD9" stroke-width="1.4"/><text x="158" y="213.6" font-size="10.4" text-anchor="middle" fill="#7B2CD9" font-weight="bold">θ</text><text x="248" y="124.2" font-size="12" text-anchor="start" fill="#BD2543" font-weight="bold">F</text><rect x="20.0" y="268.0" width="320" height="28" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="285.7" font-size="10.6" text-anchor="middle" fill="#222" font-weight="normal">W = |F||d| cos θ   (joule = N·m)</text><text x="180" y="325.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Only F cos θ does work; F sin θ presses the object down.</text><text x="180" y="341.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Force at 90° to the motion does no work at all.</text></svg>