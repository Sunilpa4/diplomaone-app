<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 302" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="302" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Principal ranges of the inverses</text><text x="180" y="49.7" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal">The range is what makes the inverse a function</text><text x="24" y="100.0" font-size="11.4" text-anchor="start" fill="#1565C0" font-weight="bold">sin⁻¹ x</text><rect x="100" y="84" width="180" height="18" rx="9" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.4"/><path d="M100 82 V104" fill="none" stroke="#1565C0" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="100" y="119.2" font-size="9.2" text-anchor="middle" fill="#666" font-weight="normal">−π/2</text><path d="M190 82 V104" fill="none" stroke="#1565C0" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="190" y="119.2" font-size="9.2" text-anchor="middle" fill="#666" font-weight="normal">0</text><path d="M280 82 V104" fill="none" stroke="#1565C0" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="280" y="119.2" font-size="9.2" text-anchor="middle" fill="#666" font-weight="normal">π/2</text><text x="92" y="99.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal"></text><text x="24" y="156.0" font-size="11.4" text-anchor="start" fill="#2E7D32" font-weight="bold">cos⁻¹ x</text><rect x="100" y="140" width="180" height="18" rx="9" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.4"/><path d="M100 138 V160" fill="none" stroke="#2E7D32" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="100" y="175.2" font-size="9.2" text-anchor="middle" fill="#666" font-weight="normal">0</text><path d="M190 138 V160" fill="none" stroke="#2E7D32" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="190" y="175.2" font-size="9.2" text-anchor="middle" fill="#666" font-weight="normal">π/2</text><path d="M280 138 V160" fill="none" stroke="#2E7D32" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="280" y="175.2" font-size="9.2" text-anchor="middle" fill="#666" font-weight="normal">π</text><text x="92" y="155.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal"></text><text x="24" y="212.0" font-size="11.4" text-anchor="start" fill="#B66A00" font-weight="bold">tan⁻¹ x</text><rect x="100" y="196" width="180" height="18" rx="9" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.4"/><path d="M100 194 V216" fill="none" stroke="#B66A00" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="100" y="231.2" font-size="9.2" text-anchor="middle" fill="#666" font-weight="normal">−π/2</text><path d="M190 194 V216" fill="none" stroke="#B66A00" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="190" y="231.2" font-size="9.2" text-anchor="middle" fill="#666" font-weight="normal">0</text><path d="M280 194 V216" fill="none" stroke="#B66A00" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="280" y="231.2" font-size="9.2" text-anchor="middle" fill="#666" font-weight="normal">π/2</text><text x="92" y="211.2" font-size="9" text-anchor="middle" fill="#222" font-weight="normal"></text><text x="180" y="261.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Endpoints: sin⁻¹ and tan⁻¹ include −π/2, π/2 (tan⁻¹ open).</text><text x="180" y="277.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">cos⁻¹ is the only one whose range starts at 0, so cos⁻¹(−x) &gt; π/2.</text></svg>