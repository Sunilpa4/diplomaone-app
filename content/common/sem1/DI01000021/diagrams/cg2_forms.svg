<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 356" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="356" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Four forms of a straight line</text><text x="180" y="49.7" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal">Pick the one that matches what you know</text><rect x="16" y="64" width="328" height="52" rx="8" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.4"/><text x="28" y="87.6" font-size="10.4" text-anchor="start" fill="#2E7D32" font-weight="bold">Slope-intercept</text><text x="28" y="108.1" font-size="11.6" text-anchor="start" fill="#222" font-weight="normal">y = mx + c</text><text x="332" y="87.1" font-size="8.8" text-anchor="end" fill="#666" font-weight="normal">slope + y-intercept</text><rect x="16" y="124" width="328" height="52" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.4"/><text x="28" y="147.6" font-size="10.4" text-anchor="start" fill="#1565C0" font-weight="bold">Point-slope</text><text x="28" y="168.1" font-size="11.6" text-anchor="start" fill="#222" font-weight="normal">y − y₁ = m(x − x₁)</text><text x="332" y="147.1" font-size="8.8" text-anchor="end" fill="#666" font-weight="normal">one point + slope</text><rect x="16" y="184" width="328" height="52" rx="8" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.4"/><text x="28" y="207.6" font-size="10.4" text-anchor="start" fill="#B66A00" font-weight="bold">Two-point</text><text x="28" y="228.1" font-size="11.6" text-anchor="start" fill="#222" font-weight="normal">(y − y₁)/(y₂ − y₁) = (x − x₁)/(x₂ − x₁)</text><text x="332" y="207.1" font-size="8.8" text-anchor="end" fill="#666" font-weight="normal">two points</text><rect x="16" y="244" width="328" height="52" rx="8" fill="#FDECF0" stroke="#BD2543" stroke-width="1.4"/><text x="28" y="267.6" font-size="10.4" text-anchor="start" fill="#BD2543" font-weight="bold">Intercept</text><text x="28" y="288.1" font-size="11.6" text-anchor="start" fill="#222" font-weight="normal">x/a + y/b = 1</text><text x="332" y="267.1" font-size="8.8" text-anchor="end" fill="#666" font-weight="normal">both intercepts</text><text x="180" y="311.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">All four describe the same object - a straight line.</text><text x="180" y="327.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Convert to ax + by + c = 0 for a final answer.</text></svg>