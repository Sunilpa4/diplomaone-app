<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 344" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="344" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Tangent from an external point</text><text x="180" y="49.7" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal">Length = √(x₁² + y₁² − a²)</text><circle cx="106" cy="196" r="58" fill="#FBF8FD" stroke="#7B2CD9" stroke-width="1.7"/><circle cx="106" cy="196" r="3.4" fill="#7B2CD9"/><text x="98" y="219.5" font-size="10" text-anchor="end" fill="#7B2CD9" font-weight="normal">C</text><circle cx="300" cy="196" r="4" fill="#BD2543"/><text x="296" y="223.3" font-size="9.4" text-anchor="end" fill="#BD2543" font-weight="normal">P(x₁, y₁)</text><path d="M300 196 H106" fill="none" stroke="#999" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M300 196 L123.3 140.7" fill="none" stroke="#2E7D32" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M106 196 L123.3 140.7" fill="none" stroke="#1565C0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 3"/><circle cx="123.3" cy="140.7" r="3.8" fill="#B66A00"/><text x="117.34020618556701" y="134.2" font-size="10" text-anchor="middle" fill="#B66A00" font-weight="bold">T</text><path d="M119.8 152.1 L131.2 155.7 L134.8 144.2" fill="none" stroke="#B66A00" stroke-width="1.3"/><text x="189.0" y="217.4" font-size="9.6" text-anchor="middle" fill="#666" font-weight="bold">CP</text><text x="206" y="161.4" font-size="9.6" text-anchor="middle" fill="#2E7D32" font-weight="normal">tangent</text><rect x="20.0" y="257.0" width="320" height="26" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="273.6" font-size="10.4" text-anchor="middle" fill="#222" font-weight="normal">CT² = CP² − r²,  so  tangent = √(CP² − r²)</text><text x="180" y="315.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">CP is the distance from the centre; CT is the radius r.</text><text x="180" y="331.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">CT is perpendicular to the tangent at T.</text></svg>