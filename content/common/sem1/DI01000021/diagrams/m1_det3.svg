<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 364" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="364" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Expanding a third-order determinant</text><text x="180" y="49.7" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal">Signs belong to the position: + − +</text><rect x="126" y="64" width="36" height="32" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.3"/><text x="144.0" y="84.5" font-size="13" text-anchor="middle" fill="#2E7D32" font-weight="bold">+</text><rect x="162" y="64" width="36" height="32" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.3"/><text x="180.0" y="84.5" font-size="13" text-anchor="middle" fill="#BD2543" font-weight="bold">−</text><rect x="198" y="64" width="36" height="32" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.3"/><text x="216.0" y="84.5" font-size="13" text-anchor="middle" fill="#2E7D32" font-weight="bold">+</text><rect x="126" y="96" width="36" height="32" fill="#F6F2FB" stroke="#B9A7D6" stroke-width="1.3"/><text x="144.0" y="116.5" font-size="13" text-anchor="middle" fill="#BD2543" font-weight="bold">−</text><rect x="162" y="96" width="36" height="32" fill="#F6F2FB" stroke="#B9A7D6" stroke-width="1.3"/><text x="180.0" y="116.5" font-size="13" text-anchor="middle" fill="#2E7D32" font-weight="bold">+</text><rect x="198" y="96" width="36" height="32" fill="#F6F2FB" stroke="#B9A7D6" stroke-width="1.3"/><text x="216.0" y="116.5" font-size="13" text-anchor="middle" fill="#BD2543" font-weight="bold">−</text><rect x="126" y="128" width="36" height="32" fill="#F6F2FB" stroke="#B9A7D6" stroke-width="1.3"/><text x="144.0" y="148.6" font-size="13" text-anchor="middle" fill="#2E7D32" font-weight="bold">+</text><rect x="162" y="128" width="36" height="32" fill="#F6F2FB" stroke="#B9A7D6" stroke-width="1.3"/><text x="180.0" y="148.6" font-size="13" text-anchor="middle" fill="#BD2543" font-weight="bold">−</text><rect x="198" y="128" width="36" height="32" fill="#F6F2FB" stroke="#B9A7D6" stroke-width="1.3"/><text x="216.0" y="148.6" font-size="13" text-anchor="middle" fill="#2E7D32" font-weight="bold">+</text><text x="246" y="83.4" font-size="9.6" text-anchor="start" fill="#666" font-weight="normal">row 1</text><text x="246" y="99.4" font-size="9.6" text-anchor="start" fill="#666" font-weight="normal">is used</text><rect x="18.0" y="173.0" width="324" height="30" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="192.0" font-size="11.4" text-anchor="middle" fill="#222" font-weight="normal">+ a₁ × det[b₂ c₂; b₃ c₃]</text><rect x="18.0" y="211.0" width="324" height="30" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="180" y="230.0" font-size="11.4" text-anchor="middle" fill="#222" font-weight="normal">− b₁ × det[a₂ c₂; a₃ c₃]</text><rect x="18.0" y="249.0" width="324" height="30" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="268.0" font-size="11.4" text-anchor="middle" fill="#222" font-weight="normal">+ c₁ × det[a₂ b₂; a₃ b₃]</text><text x="180" y="311.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Any row or column gives the same value.</text><text x="180" y="327.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Choose the line with the most zeros.</text></svg>