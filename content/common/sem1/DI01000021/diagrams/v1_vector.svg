<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 336" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="336" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">A vector has length and direction</text><text x="180" y="49.7" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal">Displacement, velocity, force - not mass or time</text><path d="M30 206 H330" fill="none" stroke="#333" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><polygon points="336,206 326,202 326,210" fill="#333"/><path d="M74 70 V246" fill="none" stroke="#333" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="332" y="201.5" font-size="10" text-anchor="end" fill="#333" font-weight="normal">x</text><text x="84" y="81.5" font-size="10" text-anchor="end" fill="#333" font-weight="normal">y</text><path d="M74 206 H262" fill="none" stroke="#B9A7D6" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M262 206 V104" fill="none" stroke="#B9A7D6" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M74 206 L262 104" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="262.0,104.0 254.2,104.3 257.5,110.4" fill="#1565C0"/><text x="164.0" y="201.8" font-size="11" text-anchor="middle" fill="#1565C0" font-weight="bold">a₁</text><text x="274" y="158.8" font-size="11" text-anchor="start" fill="#1565C0" font-weight="bold">a₂</text><text x="150" y="142.6" font-size="13" text-anchor="middle" fill="#1565C0" font-weight="bold">a</text><text x="108" y="183.7" font-size="10.5" text-anchor="middle" fill="#B66A00" font-weight="bold">θ</text><path d="M108 206 A34 34 0 0 0 96 182" fill="none" stroke="#B66A00" stroke-width="1.4"/><rect x="20.0" y="244.0" width="320" height="28" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="261.7" font-size="10.6" text-anchor="middle" fill="#222" font-weight="normal">a = a₁i + a₂j,   |a| = √(a₁² + a₂²)</text><text x="180" y="303.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">The arrow carries the direction; its length carries the magnitude.</text><text x="180" y="319.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Moving a vector parallel to itself changes nothing.</text></svg>