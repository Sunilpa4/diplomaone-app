<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 348" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="348" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">The dot product measures a shadow</text><text x="180" y="49.7" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal">a · b = |a||b| cos θ</text><path d="M30 218 H330" fill="none" stroke="#333" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><polygon points="336,218 326,214 326,222" fill="#333"/><path d="M66 80 V258" fill="none" stroke="#333" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="332" y="213.5" font-size="10" text-anchor="end" fill="#333" font-weight="normal">x</text><text x="76" y="91.5" font-size="10" text-anchor="end" fill="#333" font-weight="normal">y</text><path d="M66 218 L300 218" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="300.0,218.0 293.0,214.5 293.0,221.5" fill="#2E7D32"/><path d="M66 218 L190 116" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="190.0,116.0 182.4,117.7 186.8,123.1" fill="#1565C0"/><path d="M190 116 V218" fill="none" stroke="#B9A7D6" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><path d="M66 218 H190" fill="none" stroke="#B66A00" stroke-width="4.0" stroke-linecap="round" stroke-linejoin="round"/><text x="128.0" y="239.6" font-size="10.2" text-anchor="middle" fill="#B66A00" font-weight="bold">(a · b)/|b|</text><text x="292" y="212.2" font-size="12" text-anchor="end" fill="#2E7D32" font-weight="bold">b</text><text x="150" y="134.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">a</text><text x="94" y="211.5" font-size="10" text-anchor="middle" fill="#666" font-weight="bold">θ</text><rect x="20.0" y="254.0" width="320" height="28" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="271.6" font-size="10.4" text-anchor="middle" fill="#222" font-weight="normal">projection of a on b = (a · b)/|b|</text><text x="180" y="315.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">If θ = 90° the shadow vanishes, so a · b = 0.</text><text x="180" y="331.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">The sign of a · b tells you whether θ is acute or obtuse.</text></svg>