<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 362" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="362" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">e as the end of (1 + 1/n)^n</text><text x="180" y="49.7" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal">each bar is one more step; the values level off at e</text><path d="M44 236 H322" fill="none" stroke="#333" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M44 236 V74" fill="none" stroke="#333" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><rect x="60" y="226.0" width="26" height="10.0" rx="4" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.3"/><text x="73" y="257.0" font-size="8.6" text-anchor="middle" fill="#333" font-weight="normal">n=1</text><text x="73" y="222.0" font-size="8.6" text-anchor="middle" fill="#1565C0" font-weight="normal">2.00</text><rect x="104" y="176.0" width="26" height="60.0" rx="4" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.3"/><text x="117" y="257.0" font-size="8.6" text-anchor="middle" fill="#333" font-weight="normal">n=2</text><text x="117" y="172.0" font-size="8.6" text-anchor="middle" fill="#1565C0" font-weight="normal">2.25</text><rect x="148" y="152.0" width="26" height="84.0" rx="4" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.3"/><text x="161" y="257.0" font-size="8.6" text-anchor="middle" fill="#333" font-weight="normal">n=3</text><text x="161" y="148.0" font-size="8.6" text-anchor="middle" fill="#1565C0" font-weight="normal">2.37</text><rect x="192" y="137.8" width="26" height="98.2" rx="4" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.3"/><text x="205" y="257.0" font-size="8.6" text-anchor="middle" fill="#333" font-weight="normal">n=4</text><text x="205" y="133.8" font-size="8.6" text-anchor="middle" fill="#1565C0" font-weight="normal">2.44</text><rect x="236" y="128.4" width="26" height="107.6" rx="4" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.3"/><text x="249" y="257.0" font-size="8.6" text-anchor="middle" fill="#333" font-weight="normal">n=5</text><text x="249" y="124.4" font-size="8.6" text-anchor="middle" fill="#1565C0" font-weight="normal">2.49</text><rect x="280" y="121.6" width="26" height="114.4" rx="4" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.3"/><text x="293" y="257.0" font-size="8.6" text-anchor="middle" fill="#333" font-weight="normal">n=6</text><text x="293" y="117.6" font-size="8.6" text-anchor="middle" fill="#1565C0" font-weight="normal">2.52</text><path d="M48 82.3 H322" fill="none" stroke="#2E7D32" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><text x="320" y="78.6" font-size="9.4" text-anchor="end" fill="#2E7D32" font-weight="normal">e ≈ 2.718</text><text x="60" y="99.3" font-size="9.4" text-anchor="start" fill="#666" font-weight="normal">(1 + 1/n)^n</text><rect x="20.0" y="272.0" width="320" height="28" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="289.6" font-size="10.4" text-anchor="middle" fill="#222" font-weight="normal">the sequence climbs but never passes e</text><text x="180" y="331.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">e = lim (1 + 1/n)^n = lim (1 + x)^(1/x).</text><text x="180" y="347.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Compounding interest every instant is this same limit.</text></svg>