<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 368" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="368" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Two one-sided limits must agree</text><text x="180" y="49.7" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal">f(x) = x + 2 for x &lt; 1,   f(x) = 4x for x ≥ 1</text><path d="M70 262 H320" fill="none" stroke="#333" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><polygon points="326,262 316,258 316,266" fill="#333"/><path d="M70 262 V92" fill="none" stroke="#333" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="318" y="257.5" font-size="10" text-anchor="end" fill="#333" font-weight="normal">x</text><path d="M85.0 188.9 L167.0 161.0" fill="none" stroke="#1565C0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="170.0" cy="160.0" r="4.4" fill="#ffffff" stroke="#1565C0" stroke-width="2"/><path d="M170.0 126.0 L200.0 85.2" fill="none" stroke="#2E7D32" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="170.0" cy="126.0" r="4.4" fill="#2E7D32"/><text x="84" y="151.4" font-size="9.6" text-anchor="start" fill="#1565C0" font-weight="normal">left limit = 3</text><text x="240" y="125.4" font-size="9.6" text-anchor="start" fill="#2E7D32" font-weight="normal">right limit = 4</text><text x="178" y="257.3" font-size="9.4" text-anchor="start" fill="#333" font-weight="normal">x = 1</text><path d="M180.0 120.0 V166.0" fill="none" stroke="#A99BBF" stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><text x="184" y="150.1" font-size="8.8" text-anchor="start" fill="#666" font-weight="normal">jump</text><rect x="20.0" y="282.0" width="320" height="28" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="180" y="299.7" font-size="10.6" text-anchor="middle" fill="#222" font-weight="normal">3 ≠ 4  ⇒  the limit does not exist (a jump)</text><text x="180" y="341.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Both branches exist at x = 1, but they end at different heights.</text><text x="180" y="357.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">When the one-sided limits differ, no single L works.</text></svg>