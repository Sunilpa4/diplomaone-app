<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 366" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="366" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Moment of a force about a point</text><text x="180" y="49.7" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal">M = r × F, |M| = F × perpendicular distance</text><path d="M36 228 H324" fill="none" stroke="#333" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><polygon points="330,228 320,224 320,232" fill="#333"/><path d="M84 96 V258" fill="none" stroke="#333" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="84" cy="228" r="5" fill="#7B2CD9"/><text x="72" y="251.7" font-size="10.5" text-anchor="end" fill="#7B2CD9" font-weight="bold">O</text><path d="M84 228 L254 138" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="254.0,138.0 246.2,138.2 249.5,144.4" fill="#1565C0"/><text x="165.0" y="205.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">r</text><circle cx="254" cy="138" r="4.5" fill="#B66A00"/><path d="M254 130 L254 74" fill="none" stroke="#BD2543" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="254.0,74.0 250.5,81.0 257.5,81.0" fill="#BD2543"/><text x="266" y="108.2" font-size="12" text-anchor="start" fill="#BD2543" font-weight="bold">F</text><path d="M84 250 H254" fill="none" stroke="#B9A7D6" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><path d="M84 232 V258" fill="none" stroke="#B9A7D6" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M254 232 V258" fill="none" stroke="#B9A7D6" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><text x="169.0" y="269.1" font-size="9" text-anchor="middle" fill="#666" font-weight="normal">perpendicular distance</text><path d="M136 228 A52 52 0 0 0 128 202" fill="none" stroke="#2E7D32" stroke-width="1.4"/><text x="144" y="219.6" font-size="10.4" text-anchor="middle" fill="#2E7D32" font-weight="bold">θ</text><rect x="20.0" y="280.0" width="320" height="28" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="180" y="297.6" font-size="10.2" text-anchor="middle" fill="#222" font-weight="normal">|M| = |r||F| sin θ = F × perpendicular distance</text><text x="180" y="339.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">The moment is a vector, perpendicular to both r and F.</text><text x="180" y="355.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Measure r from the point the moment is taken about.</text></svg>