e-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M60 240 L300 118" fill="none" stroke="#1565C0" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M64 112 L298 234" fill="none" stroke="#2E7D32" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M232 148 A56 56 0 0 0 230 192" fill="none" stroke="#B66A00" stroke-width="1.5"/><text x="254" y="185.8" font-size="11" text-anchor="middle" fill="#B66A00" font-weight="bold">θ</text><text x="146" y="183.5" font-size="10" text-anchor="end" fill="#1565C0" font-weight="bold">m₁</text><text x="216" y="207.5" font-size="10" text-anchor="start" fill="#2E7D32" font-weight="bold">m₂</text><rect x="20.0" y="254.0" width="320" height="28" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="271.4" font-size="9.6" text-anchor="middle" fill="#222" font-weight="normal">vertical denominator ⇒ θ = 90°; equal slopes ⇒ θ = 0°</text><text x="180" y="317.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">The modulus gives the acute angle between the lines.</text><text x="180" y="333.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Subtract the result from 180° when the obtuse angle is asked.</text></svg>