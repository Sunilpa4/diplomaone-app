<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 418" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="418" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">y = x² − 4x + 3 is a parabola</text><text x="180" y="49.7" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal">Roots where y = 0, vertex where the curve turns</text><path d="M34 300 H336" fill="none" stroke="#333" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="342,300 332,296 332,304" fill="#333"/><path d="M70 96 V326" fill="none" stroke="#333" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="336" y="293.9" font-size="11" text-anchor="end" fill="#333" font-weight="normal">x</text><text x="82" y="103.8" font-size="11" text-anchor="end" fill="#333" font-weight="normal">y</text><polyline points="50.8 96.5 56.2 117.2 61.8 137.0 67.2 155.9 72.8 173.9 78.2 191.0 83.8 207.2 89.2 222.5 94.8 236.9 100.2 250.4 105.8 263.0 111.2 274.7 116.8 285.5 122.2 295.4 127.8 304.4 133.2 312.5 138.8 319.7 144.2 326.0 149.8 331.4 155.3 335.9 160.8 339.5 166.3 342.2 171.8 344.0 177.3 344.9 182.8 344.9 188.3 344.0 193.8 342.2 199.3 339.5 204.8 335.9 210.3 331.4 215.8 326.0 221.3 319.7 226.8 312.5 232.3 304.4 237.8 295.4 243.3 285.5 248.8 274.7 254.3 263.0 259.8 250.4 265.3 236.9 270.8 222.5 276.3 207.2 281.8 191.0 287.3 173.9" fill="none" stroke="#7B2CD9" stroke-width="2.4"/><path d="M70 296 V304" fill="none" stroke="#333" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text x="70" y="321.3" font-size="9.5" text-anchor="middle" fill="#333" font-weight="normal">0</text><path d="M125 296 V304" fill="none" stroke="#333" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text x="125" y="321.3" font-size="9.5" text-anchor="middle" fill="#333" font-weight="normal">1</text><path d="M180 296 V304" fill="none" stroke="#333" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text x="180" y="321.3" font-size="9.5" text-anchor="middle" fill="#333" font-weight="normal">2</text><path d="M235 296 V304" fill="none" stroke="#333" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text x="235" y="321.3" font-size="9.5" text-anchor="middle" fill="#333" font-weight="normal">3</text><path d="M290 296 V304" fill="none" stroke="#333" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text x="290" y="321.3" font-size="9.5" text-anchor="middle" fill="#333" font-weight="normal">4</text><circle cx="125" cy="300" r="4.2" fill="#2E7D32"/><circle cx="235" cy="300" r="4.2" fill="#2E7D32"/><circle cx="180" cy="345" r="4.2" fill="#BD2543"/><text x="256" y="352.6" font-size="10.2" text-anchor="middle" fill="#BD2543" font-weight="bold">vertex (2, −1)</text><text x="113" y="291.4" font-size="9.6" text-anchor="middle" fill="#2E7D32" font-weight="bold">root 1</text><text x="261" y="291.4" font-size="9.6" text-anchor="middle" fill="#2E7D32" font-weight="bold">root 3</text><text x="268" y="121.6" font-size="10.4" text-anchor="middle" fill="#7B2CD9" font-weight="bold">y = x² − 4x + 3</text><text x="180" y="373.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">a &gt; 0 so the parabola opens upward.</text><text x="180" y="389.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">D = b² − 4ac = 4 &gt; 0 gives two real roots.</text></svg>