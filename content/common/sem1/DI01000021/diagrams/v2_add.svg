<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 342" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="342" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Adding vectors: two equivalent laws</text><text x="180" y="49.7" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal">Triangle law and parallelogram law give a + b</text><path d="M30 212 H334" fill="none" stroke="#333" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><polygon points="340,212 330,208 330,216" fill="#333"/><path d="M70 78 V252" fill="none" stroke="#333" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="336" y="207.5" font-size="10" text-anchor="end" fill="#333" font-weight="normal">x</text><text x="80" y="89.5" font-size="10" text-anchor="end" fill="#333" font-weight="normal">y</text><path d="M70 212 L186 178" fill="none" stroke="#B9A7D6" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M186 178 L268 84" fill="none" stroke="#B9A7D6" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M70 212 L152 118" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="152.0,118.0 144.8,121.0 150.0,125.6" fill="#1565C0"/><path d="M152 118 L268 84" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="268.0,84.0 260.3,82.6 262.3,89.3" fill="#2E7D32"/><path d="M70 212 L268 84" fill="none" stroke="#BD2543" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="268.0,84.0 260.2,84.9 264.0,90.7" fill="#BD2543"/><text x="98" y="168.2" font-size="12" text-anchor="middle" fill="#1565C0" font-weight="bold">a</text><text x="240" y="116.2" font-size="12" text-anchor="middle" fill="#2E7D32" font-weight="bold">b</text><text x="132" y="204.0" font-size="11.5" text-anchor="middle" fill="#BD2543" font-weight="bold">a + b</text><text x="286" y="193.2" font-size="9" text-anchor="end" fill="#666" font-weight="normal">parallelogram</text><rect x="20.0" y="248.0" width="320" height="28" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="265.7" font-size="10.6" text-anchor="middle" fill="#222" font-weight="normal">a + b = (a₁ + b₁)i + (a₂ + b₂)j</text><text x="180" y="309.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Triangle: tail to head. Parallelogram: the diagonal.</text><text x="180" y="325.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Order does not matter - addition is commutative.</text></svg>