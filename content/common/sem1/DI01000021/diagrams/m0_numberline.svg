<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="240" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">One line holds every number</text><text x="180" y="49.7" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal">Right adds, left subtracts, |x| is the distance from 0</text><path d="M24 150 H330" fill="none" stroke="#333" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><polygon points="342,150 332,146 332,154" fill="#333"/><path d="M24 145 V155" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="24" y="173.2" font-size="9" text-anchor="middle" fill="#333" font-weight="normal">−6</text><path d="M50 145 V155" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="50" y="173.2" font-size="9" text-anchor="middle" fill="#333" font-weight="normal">−5</text><path d="M76 145 V155" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="76" y="173.2" font-size="9" text-anchor="middle" fill="#333" font-weight="normal">−4</text><path d="M102 145 V155" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="102" y="173.2" font-size="9" text-anchor="middle" fill="#333" font-weight="normal">−3</text><path d="M128 145 V155" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="128" y="173.2" font-size="9" text-anchor="middle" fill="#333" font-weight="normal">−2</text><path d="M154 145 V155" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="154" y="173.2" font-size="9" text-anchor="middle" fill="#333" font-weight="normal">−1</text><path d="M180 145 V155" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="180" y="173.2" font-size="9" text-anchor="middle" fill="#333" font-weight="normal">0</text><path d="M206 145 V155" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="206" y="173.2" font-size="9" text-anchor="middle" fill="#333" font-weight="normal">1</text><path d="M232 145 V155" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="232" y="173.2" font-size="9" text-anchor="middle" fill="#333" font-weight="normal">2</text><path d="M258 145 V155" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="258" y="173.2" font-size="9" text-anchor="middle" fill="#333" font-weight="normal">3</text><path d="M284 145 V155" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="284" y="173.2" font-size="9" text-anchor="middle" fill="#333" font-weight="normal">4</text><path d="M310 145 V155" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="310" y="173.2" font-size="9" text-anchor="middle" fill="#333" font-weight="normal">5</text><path d="M336 145 V155" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="336" y="173.2" font-size="9" text-anchor="middle" fill="#333" font-weight="normal">6</text><path d="M102 104 H232" fill="none" stroke="#2E7D32" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><text x="180" y="97.6" font-size="10.2" text-anchor="middle" fill="#2E7D32" font-weight="bold">distance = |2 − (−3)| = 5</text><circle cx="102" cy="150" r="4" fill="#BD2543"/><circle cx="232" cy="150" r="4" fill="#1565C0"/><text x="102" y="139.5" font-size="10" text-anchor="middle" fill="#BD2543" font-weight="bold">−3</text><text x="232" y="139.5" font-size="10" text-anchor="middle" fill="#1565C0" font-weight="bold">2</text><text x="180" y="199.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">−5 &lt; −2 because −5 is further left.</text><text x="180" y="215.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">|−3| = 3 and |2| = 2: absolute value drops the sign.</text></svg>