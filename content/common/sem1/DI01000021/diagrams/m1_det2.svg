<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 380" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="380" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">A second-order determinant</text><text x="180" y="49.7" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal">Main diagonal minus the other diagonal</text><path d="M112 118 V246" fill="none" stroke="#333" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M226 118 V246" fill="none" stroke="#333" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="146" y="167.7" font-size="22" text-anchor="middle" fill="#222" font-weight="bold">a</text><text x="196" y="167.7" font-size="22" text-anchor="middle" fill="#222" font-weight="bold">b</text><text x="146" y="223.7" font-size="22" text-anchor="middle" fill="#222" font-weight="bold">c</text><text x="196" y="223.7" font-size="22" text-anchor="middle" fill="#222" font-weight="bold">d</text><path d="M138 170 L204 206" fill="none" stroke="#1565C0" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><polygon points="208,208 198,206 202,198" fill="#1565C0"/><path d="M204 170 L138 206" fill="none" stroke="#BD2543" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><polygon points="134,208 144,206 140,198" fill="#BD2543"/><text x="258" y="153.8" font-size="11" text-anchor="middle" fill="#1565C0" font-weight="bold">a × d</text><text x="258" y="171.4" font-size="9.6" text-anchor="middle" fill="#1565C0" font-weight="normal">(add)</text><text x="258" y="219.8" font-size="11" text-anchor="middle" fill="#BD2543" font-weight="bold">b × c</text><text x="258" y="237.4" font-size="9.6" text-anchor="middle" fill="#BD2543" font-weight="normal">(subtract)</text><rect x="18.0" y="265.0" width="324" height="34" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="286.4" font-size="12.5" text-anchor="middle" fill="#1B5E20" font-weight="bold">value = ad − bc</text><text x="180" y="317.9" font-size="11" text-anchor="middle" fill="#333" font-weight="normal">|3 5; 2 4| = 12 − 10 = 2</text><text x="180" y="337.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Vertical bars mean a number; square brackets mean a matrix.</text></svg>