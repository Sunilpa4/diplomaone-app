<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 380" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="380" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Degrees and radians on one circle</text><text x="180" y="49.7" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal">π radians = 180°, one full turn = 2π</text><circle cx="150" cy="170" r="78" fill="#FCFCFD" stroke="#333" stroke-width="1.6"/><path d="M58 170 H244" fill="none" stroke="#999" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><path d="M150 78 V262" fill="none" stroke="#999" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><circle cx="228.0" cy="170.0" r="3.4" fill="#7B2CD9"/><text x="254.0" y="177.5" font-size="10" text-anchor="middle" fill="#222" font-weight="bold">0°</text><text x="202.0" y="177.5" font-size="10" text-anchor="middle" fill="#1565C0" font-weight="normal">0</text><circle cx="150.0" cy="92.0" r="3.4" fill="#7B2CD9"/><text x="150.0" y="73.5" font-size="10" text-anchor="middle" fill="#222" font-weight="bold">90°</text><text x="150.0" y="125.5" font-size="10" text-anchor="middle" fill="#1565C0" font-weight="normal">π/2</text><circle cx="72.0" cy="170.0" r="3.4" fill="#7B2CD9"/><text x="46.0" y="177.5" font-size="10" text-anchor="middle" fill="#222" font-weight="bold">180°</text><text x="98.0" y="177.5" font-size="10" text-anchor="middle" fill="#1565C0" font-weight="normal">π</text><circle cx="150.0" cy="248.0" r="3.4" fill="#7B2CD9"/><text x="149.99999999999997" y="281.5" font-size="10" text-anchor="middle" fill="#222" font-weight="bold">270°</text><text x="150.0" y="229.5" font-size="10" text-anchor="middle" fill="#1565C0" font-weight="normal">3π/2</text><path d="M150 170 L217.5 131.0" fill="none" stroke="#B66A00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="147.8" font-size="11" text-anchor="middle" fill="#B66A00" font-weight="bold">θ</text><rect x="0.0" y="287.0" width="300" height="30" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="150" y="306.1" font-size="11.6" text-anchor="middle" fill="#222" font-weight="normal">radians = degrees × π/180</text><text x="180" y="345.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Degrees sit outside the circle, radians inside.</text><text x="180" y="361.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">1 radian ≈ 57.3°.</text></svg>