<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 366" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="366" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">A limit fills in the hole</text><text x="180" y="49.7" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal">f(x) = (x² − 1)/(x − 1)  is  y = x + 1  with one point missing</text><path d="M70 250 H320" fill="none" stroke="#333" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><polygon points="326,250 316,246 316,254" fill="#333"/><path d="M70 250 V80" fill="none" stroke="#333" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="269.3" font-size="9.5" text-anchor="end" fill="#333" font-weight="normal">O</text><text x="318" y="245.5" font-size="10" text-anchor="end" fill="#333" font-weight="normal">x</text><text x="80" y="89.5" font-size="10" text-anchor="start" fill="#333" font-weight="normal">y</text><path d="M79.3 201.7 L287.0 61.0" fill="none" stroke="#1565C0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="132.0" cy="166.0" r="4.6" fill="#ffffff" stroke="#BD2543" stroke-width="2"/><text x="96" y="113.2" font-size="9" text-anchor="start" fill="#BD2543" font-weight="normal">f(1) is undefined: a hole</text><text x="150.0" y="152.3" font-size="9.4" text-anchor="start" fill="#BD2543" font-weight="normal">(1, 2)</text><path d="M172.0 166.0 H300" fill="none" stroke="#B9A7D6" stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><text x="302" y="173.5" font-size="10" text-anchor="start" fill="#7B2CD9" font-weight="bold">2</text><rect x="20.0" y="278.0" width="320" height="28" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="295.7" font-size="10.6" text-anchor="middle" fill="#222" font-weight="normal">limit = 2 although f(1) does not exist</text><text x="180" y="337.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">The graph is a straight line with a single missing point.</text><text x="180" y="353.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">A limit asks where the curve is heading, not whether it arrives.</text></svg>