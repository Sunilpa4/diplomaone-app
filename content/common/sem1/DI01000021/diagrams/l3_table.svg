<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 372" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="372" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">A table shows where the values go</text><text x="180" y="49.7" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal">f(x) = (x² − 1)/(x − 1) near x = 1</text><rect x="34" y="66" width="292" height="154" rx="8" fill="#FBF8FD" stroke="#C9B4E4" stroke-width="1.3"/><text x="104" y="87.4" font-size="9.6" text-anchor="middle" fill="#7B2CD9" font-weight="bold">x approaching 1</text><text x="266" y="87.4" font-size="9.6" text-anchor="middle" fill="#7B2CD9" font-weight="bold">f(x)</text><path d="M42 92 H318" fill="none" stroke="#D8C8EC" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><text x="104" y="115.6" font-size="10.4" text-anchor="middle" fill="#333" font-weight="normal">0.9</text><text x="266" y="115.6" font-size="10.4" text-anchor="middle" fill="#1565C0" font-weight="bold">1.9</text><path d="M42 120 H318" fill="none" stroke="#EFE6F8" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><text x="104" y="139.6" font-size="10.4" text-anchor="middle" fill="#333" font-weight="normal">0.99</text><text x="266" y="139.6" font-size="10.4" text-anchor="middle" fill="#1565C0" font-weight="bold">1.99</text><path d="M42 144 H318" fill="none" stroke="#EFE6F8" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><text x="104" y="163.6" font-size="10.4" text-anchor="middle" fill="#333" font-weight="normal">0.999</text><text x="266" y="163.6" font-size="10.4" text-anchor="middle" fill="#1565C0" font-weight="bold">1.999</text><path d="M42 168 H318" fill="none" stroke="#EFE6F8" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><text x="104" y="187.6" font-size="10.4" text-anchor="middle" fill="#333" font-weight="normal">1.001</text><text x="266" y="187.6" font-size="10.4" text-anchor="middle" fill="#1565C0" font-weight="bold">2.001</text><path d="M42 192 H318" fill="none" stroke="#EFE6F8" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><text x="104" y="211.6" font-size="10.4" text-anchor="middle" fill="#333" font-weight="normal">1.01</text><text x="266" y="211.6" font-size="10.4" text-anchor="middle" fill="#1565C0" font-weight="bold">2.01</text><text x="180" y="251.6" font-size="10.4" text-anchor="middle" fill="#2E7D32" font-weight="bold">both sides head for 2</text><rect x="20.0" y="287.0" width="320" height="26" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="303.6" font-size="10.2" text-anchor="middle" fill="#222" font-weight="normal">a table guesses the limit; algebra proves it</text><text x="180" y="343.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">The values below 1 and above 1 close in on the same number.</text><text x="180" y="359.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Note that f(1) itself is never evaluated.</text></svg>