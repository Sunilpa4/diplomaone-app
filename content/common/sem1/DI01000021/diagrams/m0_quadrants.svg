<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 350" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="350" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">The four quadrants</text><text x="180" y="49.7" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal">The sign of x and y names the quadrant</text><path d="M34 200 H332" fill="none" stroke="#333" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><polygon points="338,200 328,196 328,204" fill="#333"/><path d="M180 82 V272" fill="none" stroke="#333" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180,78 176 86 184 86" fill="#333"/><rect x="60" y="92" width="100" height="76" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.5"/><text x="110" y="120.5" font-size="13" text-anchor="middle" fill="#1565C0" font-weight="bold">II</text><text x="110" y="139.6" font-size="10.2" text-anchor="middle" fill="#222" font-weight="normal">x −, y +</text><text x="110" y="158.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">(−4, 3)</text><rect x="200" y="92" width="100" height="76" rx="8" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.5"/><text x="250" y="120.5" font-size="13" text-anchor="middle" fill="#2E7D32" font-weight="bold">I</text><text x="250" y="139.6" font-size="10.2" text-anchor="middle" fill="#222" font-weight="normal">x +, y +</text><text x="250" y="158.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">(3, 2)</text><rect x="60" y="212" width="100" height="76" rx="8" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.5"/><text x="110" y="240.6" font-size="13" text-anchor="middle" fill="#B66A00" font-weight="bold">III</text><text x="110" y="259.6" font-size="10.2" text-anchor="middle" fill="#222" font-weight="normal">x −, y −</text><text x="110" y="278.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">(−2, −5)</text><rect x="200" y="212" width="100" height="76" rx="8" fill="#FDECF0" stroke="#BD2543" stroke-width="1.5"/><text x="250" y="240.6" font-size="13" text-anchor="middle" fill="#BD2543" font-weight="bold">IV</text><text x="250" y="259.6" font-size="10.2" text-anchor="middle" fill="#222" font-weight="normal">x +, y −</text><text x="250" y="278.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">(6, −1)</text><text x="190" y="219.5" font-size="10" text-anchor="start" fill="#333" font-weight="normal">O</text><text x="180" y="313.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Plot x first, then y.</text><text x="180" y="329.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">A point on the x-axis has y = 0.</text></svg>