<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 292" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="292" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Three shapes you must recognise</text><text x="180" y="49.7" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal">The curve tells you the domain and the range</text><rect x="20" y="70" width="104" height="112" rx="8" fill="#FCFCFD" stroke="#DDD"/><path d="M26 176 H118" fill="none" stroke="#333" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 84 V176" fill="none" stroke="#333" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M32 168 L106 92" fill="none" stroke="#1565C0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="203.8" font-size="11" text-anchor="middle" fill="#1565C0" font-weight="bold">linear</text><text x="72" y="219.1" font-size="8.8" text-anchor="middle" fill="#666" font-weight="normal">y = mx + c</text><rect x="128" y="70" width="104" height="112" rx="8" fill="#FCFCFD" stroke="#DDD"/><path d="M134 176 H226" fill="none" stroke="#333" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M158 84 V176" fill="none" stroke="#333" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><polyline points="164.0 129.2 165.2 132.0 166.4 134.6 167.6 137.1 168.8 139.4 170.1 141.5 171.3 143.5 172.5 145.4 173.7 147.0 174.9 148.6 176.1 149.9 177.3 151.1 178.5 152.2 179.7 153.1 180.9 153.8 182.2 154.4 183.4 154.8 184.6 155.1 185.8 155.2 187.0 155.1 188.2 154.9 189.4 154.6 190.6 154.1 191.8 153.4 193.0 152.5 194.2 151.5 195.5 150.4 196.7 149.1 197.9 147.6 199.1 146.0 200.3 144.2 201.5 142.3 202.7 140.2 203.9 137.9 205.1 135.5 206.3 133.0 207.6 130.2 208.8 127.3 210.0 124.3 211.2 121.1 212.4 117.8" fill="none" stroke="#7B2CD9" stroke-width="2.2"/><text x="180" y="203.8" font-size="11" text-anchor="middle" fill="#7B2CD9" font-weight="bold">quadratic</text><text x="180" y="219.1" font-size="8.8" text-anchor="middle" fill="#666" font-weight="normal">y = ax² + bx + c</text><rect x="236" y="70" width="104" height="112" rx="8" fill="#FCFCFD" stroke="#DDD"/><path d="M242 176 H334" fill="none" stroke="#333" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M266 84 V176" fill="none" stroke="#333" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><polyline points="252.0 157.0 253.1 156.4 254.2 155.8 255.3 155.2 256.4 154.5 257.5 153.9 258.6 153.2 259.7 152.5 260.8 151.8 261.9 151.1 263.0 150.4 264.1 149.6 265.2 148.9 266.3 148.1 267.4 147.3 268.5 146.4 269.6 145.6 270.7 144.7 271.8 143.8 272.9 142.9 274.0 142.0 275.1 141.0 276.2 140.1 277.3 139.1 278.4 138.1 279.5 137.0 280.6 135.9 281.7 134.8 282.8 133.7 283.9 132.6 285.0 131.4 286.1 130.2 287.2 129.0 288.3 127.7 289.4 126.4 290.5 125.1 291.6 123.7 292.7 122.4 293.8 120.9 294.9 119.5 296.0 118.0" fill="none" stroke="#2E7D32" stroke-width="2.2"/><text x="288" y="203.8" font-size="11" text-anchor="middle" fill="#2E7D32" font-weight="bold">exponential</text><text x="288" y="219.1" font-size="8.8" text-anchor="middle" fill="#666" font-weight="normal">y = aˣ</text><text x="180" y="243.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Only the exponential never touches the x-axis: its range is y &gt; 0.</text><text x="180" y="259.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">The logarithm is its mirror image, so its domain is x &gt; 0.</text></svg>