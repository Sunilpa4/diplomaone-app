<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 364" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="364" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Which technique should I use?</text><text x="180" y="49.7" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal">work down the list until the 0/0 disappears</text><rect x="19.0" y="59.0" width="322" height="30" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="77.5" font-size="10.0" text-anchor="middle" fill="#222" font-weight="normal">1.  Substitute x = a</text><rect x="19.0" y="103.0" width="322" height="30" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="121.5" font-size="10.0" text-anchor="middle" fill="#222" font-weight="normal">2.  finite value?  that is the answer</text><rect x="19.0" y="147.0" width="322" height="30" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="165.5" font-size="10.0" text-anchor="middle" fill="#222" font-weight="normal">3.  0/0  →  factorise or rationalise</text><rect x="19.0" y="191.0" width="322" height="30" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="209.5" font-size="10.0" text-anchor="middle" fill="#222" font-weight="normal">4.  trigonometric or e?  use a standard limit</text><rect x="19.0" y="235.0" width="322" height="30" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="180" y="253.5" font-size="10.0" text-anchor="middle" fill="#222" font-weight="normal">5.  x → ∞  →  divide by the highest power</text><path d="M180 90 L180 102" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,102.0 183.5,95.0 176.5,95.0" fill="#7B2CD9"/><path d="M180 134 L180 146" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,146.0 183.5,139.0 176.5,139.0" fill="#7B2CD9"/><path d="M180 178 L180 190" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,190.0 183.5,183.0 176.5,183.0" fill="#7B2CD9"/><path d="M180 222 L180 234" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,234.0 183.5,227.0 176.5,227.0" fill="#7B2CD9"/><text x="180" y="315.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Stop as soon as substituting gives a number.</text><text x="180" y="331.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Each step is a rewrite, never a guess.</text></svg>