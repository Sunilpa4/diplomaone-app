<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 402" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="402" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Cramer's rule in four steps</text><text x="180" y="49.7" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal">Determinants replace the constants column</text><rect x="30.0" y="61.0" width="300" height="34" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="82.1" font-size="11.6" text-anchor="middle" fill="#222" font-weight="normal">2x + 3y = 12    and    x − y = 1</text><path d="M180 95 L180 116" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,116.0 183.5,109.0 176.5,109.0" fill="#7B2CD9"/><rect x="30.0" y="117.0" width="300" height="34" rx="7" fill="#F6F2FB" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="138.1" font-size="11.6" text-anchor="middle" fill="#222" font-weight="normal">D = |2 3; 1 −1| = −5</text><path d="M180 151 L180 174" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,174.0 183.5,167.0 176.5,167.0" fill="#7B2CD9"/><polygon points="180,178.0 228.0,204 180,230.0 132.0,204" fill="#FFF1DE" stroke="#E07B00" stroke-width="1.8"/><text x="180" y="208.0" font-size="11.5" text-anchor="middle" fill="#222" font-weight="normal">D ≠ 0 ?</text><path d="M228 204 L300 204 L300 236" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="300.0,236.0 303.5,229.0 296.5,229.0" fill="#2E7D32"/><text x="262" y="199.7" font-size="10.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">yes</text><rect x="193.0" y="237.0" width="150" height="34" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="268" y="257.9" font-size="11.2" text-anchor="middle" fill="#222" font-weight="normal">x = Dx/D,  y = Dy/D</text><path d="M132 204 L66 204 L66 236" fill="none" stroke="#BD2543" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="66.0,236.0 69.5,229.0 62.5,229.0" fill="#BD2543"/><text x="96" y="199.7" font-size="10.5" text-anchor="middle" fill="#C62828" font-weight="bold">no</text><rect x="20.0" y="239.0" width="108" height="46" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="74" y="259.5" font-size="9.8" text-anchor="middle" fill="#222" font-weight="normal">D = 0</text><text x="74" y="271.3" font-size="9.8" text-anchor="middle" fill="#222" font-weight="normal">then check Dx, Dy</text><path d="M268 271 L268 300" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="268.0,300.0 271.5,293.0 264.5,293.0" fill="#7B2CD9"/><rect x="183.0" y="303.0" width="170" height="30" rx="15.0" fill="#E3F5E6" stroke="#2E7D32" stroke-width="1.8"/><text x="268" y="321.5" font-size="10" text-anchor="middle" fill="#1B5E20" font-weight="bold">check both equations</text><text x="180" y="355.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Wrong column replaced is the classic error: Dx uses the</text><text x="180" y="371.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">constants in the x-column.</text></svg>