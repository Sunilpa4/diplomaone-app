<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 342" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="342" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Area model: (x + 2)(x + 3)</text><text x="180" y="49.7" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal">Every cell is one product of the expansion</text><rect x="60" y="84" width="170" height="130" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.4"/><rect x="230" y="84" width="70" height="130" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.4"/><rect x="60" y="214" width="170" height="50" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.4"/><rect x="230" y="214" width="70" height="50" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.4"/><rect x="60" y="84" width="240" height="180" fill="none" stroke="#333" stroke-width="2"/><text x="145.0" y="154.2" font-size="15" text-anchor="middle" fill="#1565C0" font-weight="bold">x²</text><text x="265.0" y="153.9" font-size="14" text-anchor="middle" fill="#B66A00" font-weight="bold">2x</text><text x="145.0" y="243.9" font-size="14" text-anchor="middle" fill="#B66A00" font-weight="bold">3x</text><text x="265.0" y="243.9" font-size="14" text-anchor="middle" fill="#2E7D32" font-weight="bold">6</text><text x="145.0" y="79.8" font-size="11" text-anchor="middle" fill="#333" font-weight="normal">x</text><text x="265.0" y="79.8" font-size="11" text-anchor="middle" fill="#333" font-weight="normal">2</text><text x="54" y="152.8" font-size="11" text-anchor="end" fill="#333" font-weight="normal">x</text><text x="54" y="242.8" font-size="11" text-anchor="end" fill="#333" font-weight="normal">3</text><text x="180" y="293.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Area = x² + 2x + 3x + 6 = x² + 5x + 6</text><text x="180" y="309.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Missing the cross terms is the classic expansion error.</text></svg>