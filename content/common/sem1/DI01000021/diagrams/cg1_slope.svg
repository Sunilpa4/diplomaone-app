e-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M104 208 L270 108" fill="none" stroke="#1565C0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M104 208 H270" fill="none" stroke="#B66A00" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M270 208 V108" fill="none" stroke="#2E7D32" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><circle cx="104" cy="208" r="4" fill="#BD2543"/><circle cx="270" cy="108" r="4" fill="#BD2543"/><text x="96" y="229.2" font-size="9.2" text-anchor="end" fill="#BD2543" font-weight="normal">(x₁, y₁)</text><text x="278" y="103.2" font-size="9.2" text-anchor="start" fill="#BD2543" font-weight="normal">(x₂, y₂)</text><text x="187.0" y="227.4" font-size="9.6" text-anchor="middle" fill="#B66A00" font-weight="normal">run</text><text x="280" y="161.4" font-size="9.6" text-anchor="start" fill="#2E7D32" font-weight="normal">rise</text><path d="M150 208 A46 46 0 0 0 146 191" fill="none" stroke="#7B2CD9" stroke-width="1.3"/><text x="158" y="205.5" font-size="10" text-anchor="middle" fill="#7B2CD9" font-weight="bold">θ</text><rect x="20.0" y="267.0" width="320" height="30" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="285.9" font-size="11.2" text-anchor="middle" fill="#222" font-weight="normal">m = rise/run = tan θ</text><text x="180" y="333.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">A larger slope means a steeper line; a negative slope falls.</text><text x="180" y="349.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Vertical line: slope undefined, x = a.</text></svg>