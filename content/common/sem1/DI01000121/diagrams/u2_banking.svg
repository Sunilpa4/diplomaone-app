<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 288" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="288" fill="#ffffff"/><text x="180" y="25.6" font-size="13.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Resolving the forces on a banked curve</text><text x="180" y="43.4" font-size="9.7" text-anchor="middle" fill="#666" font-weight="normal">friction ignored, so N does all the work</text><path d="M22 172L336 96L336 172Z" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.4"/><text x="112" y="163.0" font-size="8.6" text-anchor="middle" fill="#2E7D32" font-weight="normal">road surface</text><path d="M68 172 A46 46 0 0 0 66.0 161.2" fill="none" stroke="#B66A00" stroke-width="1.5"/><text x="74" y="163.7" font-size="10.5" text-anchor="middle" fill="#B66A00" font-weight="bold">θ</text><g transform="rotate(-13.4 186 132.30573248407643)"><rect x="171" y="112.30573248407643" width="30" height="18" rx="3" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.4"/></g><path d="M186 122.30573248407643L176.34025693797636 80.15412639524608" fill="none" stroke="#7B2CD9" stroke-width="2.0" stroke-linecap="round"/><path d="M175 74.30573248407643L173.0 80.9L179.7 79.4Z" fill="#7B2CD9"/><text x="156" y="74.0" font-size="10.5" text-anchor="middle" fill="#7B2CD9" font-weight="bold">N</text><path d="M194 134.30573248407643L194.0 166.30573248407643" fill="none" stroke="#BD2543" stroke-width="2.0" stroke-linecap="round"/><path d="M194 172.30573248407643L197.4 166.3L190.6 166.3Z" fill="#BD2543"/><text x="204" y="167.7" font-size="9.6" text-anchor="middle" fill="#BD2543" font-weight="bold">m g</text><rect x="12.0" y="184.0" width="336" height="24" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="199.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">N cos θ = m g   and   N sin θ = m v²/r</text><rect x="12.0" y="214.0" width="336" height="24" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="229.4" font-size="9.6" text-anchor="middle" fill="#222" font-weight="normal">divide: tan θ = v²/(r g)</text><text x="180" y="265.3" font-size="9.3" text-anchor="middle" fill="#666" font-weight="normal">For r = 100 m at 20 m/s: tan θ = 0.408, θ = 22.2°.</text><text x="180" y="280.3" font-size="9.3" text-anchor="middle" fill="#666" font-weight="normal">A cyclist leans by the same angle, tan θ = v²/rg.</text></svg>