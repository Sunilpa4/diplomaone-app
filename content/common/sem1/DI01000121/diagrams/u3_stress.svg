<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 312" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="312" fill="#ffffff"/><text x="180" y="25.6" font-size="13.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Stress against strain for a ductile metal</text><text x="180" y="43.4" font-size="9.7" text-anchor="middle" fill="#666" font-weight="normal">the slope of OA is Young's modulus</text><path d="M54 206L335.0 206.0" fill="none" stroke="#666" stroke-width="1.1" stroke-linecap="round"/><path d="M335.0 203.0L340 206L335.0 209.0Z" fill="#666"/><path d="M54 206L54.0 59.0" fill="none" stroke="#666" stroke-width="1.1" stroke-linecap="round"/><path d="M51.0 59.0L54 54L57.0 59.0Z" fill="#666"/><text x="314" y="224.1" font-size="8.8" text-anchor="middle" fill="#666" font-weight="normal">strain</text><text x="48" y="53.1" font-size="8.8" text-anchor="middle" fill="#666" font-weight="normal">stress</text><path d="M54 206L112 160" fill="none" stroke="#1565C0" stroke-width="2.2" stroke-linecap="round"/><path d="M112 160C126 152 137 148 152 146C186 132 200 100 240 90C264 102 280 120 306 134" fill="none" stroke="#1565C0" stroke-width="2.2" stroke-linecap="round"/><circle cx="112" cy="160" r="3.4" fill="#2E7D32"/><text x="110" y="153.6" font-size="10.4" text-anchor="middle" fill="#2E7D32" font-weight="bold">A</text><circle cx="152" cy="146" r="3.4" fill="#B66A00"/><text x="160" y="145.6" font-size="10.4" text-anchor="middle" fill="#B66A00" font-weight="bold">B</text><circle cx="240" cy="90" r="3.4" fill="#BD2543"/><text x="243" y="84.6" font-size="10.4" text-anchor="middle" fill="#BD2543" font-weight="bold">D</text><circle cx="306" cy="134" r="3.4" fill="#7B2CD9"/><text x="315" y="150.6" font-size="10.4" text-anchor="middle" fill="#7B2CD9" font-weight="bold">E</text><text x="42" y="220.6" font-size="10.4" text-anchor="middle" fill="#222" font-weight="bold">O</text><rect x="12.0" y="234.0" width="336" height="44" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="259.1" font-size="9.0" text-anchor="middle" fill="#222" font-weight="normal"></text><text x="180" y="251.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">A proportional limit  ·  B elastic limit</text><text x="180" y="266.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">D maximum stress  ·  E fracture point</text><text x="180" y="293.3" font-size="9.3" text-anchor="middle" fill="#666" font-weight="normal">Loading past B leaves a permanent stretch; past E the wire breaks.</text></svg>