<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 324" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="324" fill="#ffffff"/><text x="180" y="25.6" font-size="13.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Reading a mercury thermometer</text><text x="180" y="43.4" font-size="9.7" text-anchor="middle" fill="#666" font-weight="normal">mercury does not wet glass</text><rect x="162" y="74" width="12" height="136" rx="5" fill="#F2F5F8" stroke="#9AA5B1" stroke-width="1.1"/><circle cx="168" cy="222" r="14" fill="#C62828" stroke="#8E1B1B" stroke-width="1.1"/><rect x="164.8" y="138" width="6.4" height="68" fill="#C62828"/><path d="M175 86L183 86" fill="none" stroke="#666" stroke-width="0.9" stroke-linecap="round"/><text x="188" y="92.2" font-size="8.6" text-anchor="start" fill="#222" font-weight="normal">100</text><path d="M175 110L183 110" fill="none" stroke="#666" stroke-width="0.9" stroke-linecap="round"/><text x="188" y="116.2" font-size="8.6" text-anchor="start" fill="#222" font-weight="normal">80</text><path d="M175 134L183 134" fill="none" stroke="#666" stroke-width="0.9" stroke-linecap="round"/><text x="188" y="140.2" font-size="8.6" text-anchor="start" fill="#222" font-weight="normal">60</text><path d="M175 158L183 158" fill="none" stroke="#666" stroke-width="0.9" stroke-linecap="round"/><text x="188" y="164.2" font-size="8.6" text-anchor="start" fill="#222" font-weight="normal">40</text><path d="M175 182L183 182" fill="none" stroke="#666" stroke-width="0.9" stroke-linecap="round"/><text x="188" y="188.2" font-size="8.6" text-anchor="start" fill="#222" font-weight="normal">20</text><path d="M175 206L183 206" fill="none" stroke="#666" stroke-width="0.9" stroke-linecap="round"/><text x="188" y="212.2" font-size="8.6" text-anchor="start" fill="#222" font-weight="normal">0</text><text x="188" y="67.2" font-size="9.0" text-anchor="start" fill="#666" font-weight="normal">°C</text><path d="M142 138L151.0 138.0" fill="none" stroke="#BD2543" stroke-width="1.2" stroke-linecap="round"/><path d="M151.0 135.0L156 138L151.0 141.0Z" fill="#BD2543"/><text x="138" y="144.4" font-size="8.6" text-anchor="end" fill="#BD2543" font-weight="normal">read here</text><text x="138" y="156.9" font-size="8.2" text-anchor="end" fill="#666" font-weight="normal">top of column</text><text x="168" y="254.9" font-size="8.4" text-anchor="middle" fill="#666" font-weight="normal">bulb</text><rect x="12.0" y="259.0" width="336" height="26" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="275.1" font-size="9.0" text-anchor="middle" fill="#222" font-weight="normal">range −39 °C to 357 °C: mercury freezes at −39</text><text x="180" y="305.3" font-size="9.3" text-anchor="middle" fill="#666" font-weight="normal">Read it in place: the column falls as soon as it leaves the body.</text></svg>