<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 304" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="304" fill="#ffffff"/><text x="180" y="25.6" font-size="13.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">How many digits do you keep?</text><text x="180" y="43.4" font-size="9.7" text-anchor="middle" fill="#666" font-weight="normal">round once, at the very end</text><rect x="12.0" y="47.0" width="336" height="26" rx="7" fill="#F3EBFD" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="63.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">count the significant figures of every input</text><path d="M180 73L180 95" fill="none" stroke="#222" stroke-width="1.4" stroke-linecap="round"/><path d="M176.6 94.8L180 100L183.4 94.8Z" fill="#222"/><rect x="12.0" y="87.0" width="336" height="26" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="103.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">is the operation × / ÷ or + / − ?</text><path d="M96 113L96 137" fill="none" stroke="#222" stroke-width="1.4" stroke-linecap="round"/><path d="M92.6 136.8L96 142L99.4 136.8Z" fill="#222"/><path d="M264 113L264 137" fill="none" stroke="#222" stroke-width="1.4" stroke-linecap="round"/><path d="M260.6 136.8L264 142L267.4 136.8Z" fill="#222"/><rect x="22.0" y="136.0" width="148" height="44" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="96" y="161.5" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">× or ÷</text><text x="96" y="176.9" font-size="8.4" text-anchor="middle" fill="#2E7D32" font-weight="normal">keep the fewest s.f.</text><rect x="190.0" y="136.0" width="148" height="44" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="264" y="161.5" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">+ or −</text><text x="264" y="176.7" font-size="7.8" text-anchor="middle" fill="#B66A00" font-weight="normal">keep the fewest decimals</text><rect x="22.0" y="203.0" width="148" height="30" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="96" y="221.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">2.5 × 1.25 = 3.1</text><rect x="190.0" y="203.0" width="148" height="30" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="264" y="220.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">12.11 + 18.0 = 31.1</text><text x="180" y="273.3" font-size="9.3" text-anchor="middle" fill="#666" font-weight="normal">Dropped digit &gt; 5: round up. &lt; 5: keep. Exactly 5: make it even.</text><text x="180" y="288.3" font-size="9.3" text-anchor="middle" fill="#666" font-weight="normal">Never copy every digit of a calculator into your answer.</text></svg>