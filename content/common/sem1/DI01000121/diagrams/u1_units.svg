<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 272" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="272" fill="#ffffff"/><text x="180" y="25.6" font-size="13.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Seven base units carry every measurement</text><text x="180" y="43.4" font-size="9.7" text-anchor="middle" fill="#666" font-weight="normal">everything else is built from these</text><rect x="12" y="54" width="336" height="20" fill="#EAF3FD"/><text x="20" y="71.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">length</text><text x="150" y="71.4" font-size="9.8" text-anchor="start" fill="#1565C0" font-weight="normal">metre</text><text x="300" y="71.6" font-size="10.2" text-anchor="middle" fill="#1565C0" font-weight="bold">m</text><rect x="12" y="74" width="336" height="20" fill="#FFFFFF"/><text x="20" y="91.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">mass</text><text x="150" y="91.4" font-size="9.8" text-anchor="start" fill="#1565C0" font-weight="normal">kilogram</text><text x="300" y="91.6" font-size="10.2" text-anchor="middle" fill="#1565C0" font-weight="bold">kg</text><rect x="12" y="94" width="336" height="20" fill="#EAF3FD"/><text x="20" y="111.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">time</text><text x="150" y="111.4" font-size="9.8" text-anchor="start" fill="#1565C0" font-weight="normal">second</text><text x="300" y="111.6" font-size="10.2" text-anchor="middle" fill="#1565C0" font-weight="bold">s</text><rect x="12" y="114" width="336" height="20" fill="#FFFFFF"/><text x="20" y="131.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">current</text><text x="150" y="131.4" font-size="9.8" text-anchor="start" fill="#1565C0" font-weight="normal">ampere</text><text x="300" y="131.6" font-size="10.2" text-anchor="middle" fill="#1565C0" font-weight="bold">A</text><rect x="12" y="134" width="336" height="20" fill="#EAF3FD"/><text x="20" y="151.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">temperature</text><text x="150" y="151.4" font-size="9.8" text-anchor="start" fill="#1565C0" font-weight="normal">kelvin</text><text x="300" y="151.6" font-size="10.2" text-anchor="middle" fill="#1565C0" font-weight="bold">K</text><rect x="12" y="154" width="336" height="20" fill="#FFFFFF"/><text x="20" y="171.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">substance</text><text x="150" y="171.4" font-size="9.8" text-anchor="start" fill="#1565C0" font-weight="normal">mole</text><text x="300" y="171.6" font-size="10.2" text-anchor="middle" fill="#1565C0" font-weight="bold">mol</text><rect x="12" y="174" width="336" height="20" fill="#EAF3FD"/><text x="20" y="191.4" font-size="9.8" text-anchor="start" fill="#222" font-weight="normal">light</text><text x="150" y="191.4" font-size="9.8" text-anchor="start" fill="#1565C0" font-weight="normal">candela</text><text x="300" y="191.6" font-size="10.2" text-anchor="middle" fill="#1565C0" font-weight="bold">cd</text><text x="300" y="51.9" font-size="8.4" text-anchor="middle" fill="#666" font-weight="normal">symbol</text><path d="M12 54L348 54" fill="none" stroke="#BBB" stroke-width="1" stroke-linecap="round"/><path d="M12 54L348 54" fill="none" stroke="#BBB" stroke-width="1" stroke-linecap="round"/><path d="M12 194L348 194" fill="none" stroke="#BBB" stroke-width="1" stroke-linecap="round"/><path d="M12 54L12 194" fill="none" stroke="#BBB" stroke-width="1" stroke-linecap="round"/><path d="M348 54L348 194" fill="none" stroke="#BBB" stroke-width="1" stroke-linecap="round"/><rect x="12.0" y="202.0" width="336" height="28" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="219.2" font-size="9.0" text-anchor="middle" fill="#222" font-weight="normal">derived: 1 N = 1 kg·m/s² | 1 J = 1 N·m | 1 Pa = 1 N/m²</text><text x="180" y="253.3" font-size="9.3" text-anchor="middle" fill="#666" font-weight="normal">A number without a unit is not a measurement.</text><text x="180" y="268.3" font-size="9.3" text-anchor="middle" fill="#666" font-weight="normal">Convert to one system before you add or multiply.</text></svg>