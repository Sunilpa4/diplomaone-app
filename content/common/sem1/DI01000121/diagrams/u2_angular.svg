<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 322" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="322" fill="#ffffff"/><text x="180" y="25.6" font-size="13.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">One turn of the radius</text><text x="180" y="43.4" font-size="9.7" text-anchor="middle" fill="#666" font-weight="normal">θ in radians, ω and α are its rates</text><circle cx="132" cy="138" r="58" fill="none" stroke="#BBB" stroke-width="1.3"/><circle cx="132" cy="138" r="2.6" fill="#222"/><text x="132" y="155.7" font-size="7.6" text-anchor="middle" fill="#666" font-weight="normal">centre</text><path d="M132 138L190 138" fill="none" stroke="#666" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="3 2"/><path d="M132 138L161.0 87.77199999999999" fill="none" stroke="#222" stroke-width="1.6" stroke-linecap="round"/><circle cx="161.0" cy="87.77199999999999" r="4.4" fill="#1565C0"/><path d="M166 138 A34 34 0 0 0 149 108.6" fill="none" stroke="#B66A00" stroke-width="1.6"/><text x="172" y="128.0" font-size="11.5" text-anchor="middle" fill="#B66A00" font-weight="bold">θ</text><text x="142" y="107.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">r</text><path d="M165.0 85.77199999999999L189.77986688490833 71.73007543188527" fill="none" stroke="#2E7D32" stroke-width="2.0" stroke-linecap="round"/><path d="M195.0 68.77199999999999L188.1 68.8L191.5 74.7Z" fill="#2E7D32"/><text x="201.0" y="71.2" font-size="9.8" text-anchor="middle" fill="#2E7D32" font-weight="bold">v</text><rect x="12.0" y="205.0" width="336" height="22" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="219.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">θ = s/r   (radian, no unit)</text><rect x="12.0" y="231.0" width="336" height="22" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="245.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">ω = Δθ/Δt = 2π/T   (rad/s)</text><rect x="12.0" y="257.0" width="336" height="22" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="271.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">α = Δω/Δt   (rad/s²)</text><text x="180" y="303.3" font-size="9.3" text-anchor="middle" fill="#666" font-weight="normal">v = rω and a = rα: one ω for every point, different v.</text><text x="180" y="318.3" font-size="9.3" text-anchor="middle" fill="#666" font-weight="normal">1 rad = 57.3°, one full turn = 2π rad.</text></svg>