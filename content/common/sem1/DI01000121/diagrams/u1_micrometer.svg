<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 244" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="244" fill="#ffffff"/><text x="180" y="25.6" font-size="13.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Sleeve 4.5 mm, thimble 32 divisions</text><text x="180" y="43.4" font-size="9.7" text-anchor="middle" fill="#666" font-weight="normal">least count 0.01 mm gives 4.82 mm</text><rect x="16" y="74" width="90.0" height="20" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.3"/><path d="M16.0 94L16.0 103" fill="none" stroke="#2E7D32" stroke-width="1.2" stroke-linecap="round"/><text x="16.0" y="116.8" font-size="8.0" text-anchor="middle" fill="#666" font-weight="normal">3</text><path d="M46.0 94L46.0 99" fill="none" stroke="#2E7D32" stroke-width="1.2" stroke-linecap="round"/><text x="46.0" y="116.8" font-size="8.0" text-anchor="middle" fill="#666" font-weight="normal">3.5</text><path d="M76.0 94L76.0 103" fill="none" stroke="#2E7D32" stroke-width="1.2" stroke-linecap="round"/><text x="76.0" y="116.8" font-size="8.0" text-anchor="middle" fill="#666" font-weight="normal">4</text><path d="M106.0 94L106.0 99" fill="none" stroke="#2E7D32" stroke-width="1.2" stroke-linecap="round"/><text x="104.0" y="116.8" font-size="8.0" text-anchor="middle" fill="#666" font-weight="normal">4.5</text><text x="61.0" y="135.1" font-size="8.8" text-anchor="middle" fill="#2E7D32" font-weight="normal">sleeve: 4.5 mm exposed</text><rect x="116.0" y="58" width="100" height="58" rx="6" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.4"/><text x="166.0" y="78.2" font-size="9.2" text-anchor="middle" fill="#1565C0" font-weight="normal">thimble</text><text x="166.0" y="98.4" font-size="12.5" text-anchor="middle" fill="#1565C0" font-weight="bold">32 div</text><text x="166.0" y="109.7" font-size="7.6" text-anchor="middle" fill="#666" font-weight="normal">on the reference line</text><path d="M112.0 80L118.0 80" fill="none" stroke="#BD2543" stroke-width="1.6" stroke-linecap="round"/><rect x="12.0" y="143.0" width="336" height="26" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="159.4" font-size="9.6" text-anchor="middle" fill="#222" font-weight="normal">reading = S.S.R. + C.S.R. × L.C.</text><rect x="12.0" y="173.0" width="336" height="26" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="189.4" font-size="9.8" text-anchor="middle" fill="#222" font-weight="normal">4.5 + 32 × 0.01 = 4.82 mm</text><text x="180" y="223.3" font-size="9.3" text-anchor="middle" fill="#666" font-weight="normal">L.C. = pitch / circular divisions = 0.5 / 50 = 0.01 mm</text><text x="180" y="238.3" font-size="9.3" text-anchor="middle" fill="#666" font-weight="normal">A zero error of +0.02 mm makes the true diameter 4.80 mm.</text></svg>