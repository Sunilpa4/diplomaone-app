<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 310" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="310" fill="#ffffff"/><text x="180" y="25.6" font-size="13.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Three ways for heat to travel</text><text x="180" y="43.4" font-size="9.7" text-anchor="middle" fill="#666" font-weight="normal">only radiation crosses a vacuum</text><rect x="12" y="58" width="168" height="120" rx="8" fill="#EAF3FD" stroke="#1565C0" stroke-width="0.9"/><text x="96" y="79.4" font-size="9.6" text-anchor="middle" fill="#1565C0" font-weight="bold">conduction</text><text x="96" y="91.9" font-size="8.2" text-anchor="middle" fill="#666" font-weight="normal">solid, no bulk motion</text><rect x="180" y="58" width="168" height="120" rx="8" fill="#FFF4DF" stroke="#B66A00" stroke-width="0.9"/><text x="264" y="79.4" font-size="9.6" text-anchor="middle" fill="#B66A00" font-weight="bold">convection</text><text x="264" y="91.9" font-size="8.2" text-anchor="middle" fill="#666" font-weight="normal">the fluid itself moves</text><rect x="30" y="118" width="132" height="18" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.2"/><rect x="30" y="118" width="26" height="18" fill="#BD2543" opacity="0.65"/><text x="43" y="162.9" font-size="8.4" text-anchor="middle" fill="#BD2543" font-weight="normal">hot</text><text x="149" y="162.9" font-size="8.4" text-anchor="middle" fill="#1565C0" font-weight="normal">cold</text><path d="M62 127L69.0 127.0" fill="none" stroke="#1565C0" stroke-width="1.2" stroke-linecap="round"/><path d="M69.0 124.0L74 127L69.0 130.0Z" fill="#1565C0"/><path d="M80 127L87.0 127.0" fill="none" stroke="#1565C0" stroke-width="1.2" stroke-linecap="round"/><path d="M87.0 124.0L92 127L87.0 130.0Z" fill="#1565C0"/><path d="M98 127L105.0 127.0" fill="none" stroke="#1565C0" stroke-width="1.2" stroke-linecap="round"/><path d="M105.0 124.0L110 127L105.0 130.0Z" fill="#1565C0"/><path d="M116 127L123.0 127.0" fill="none" stroke="#1565C0" stroke-width="1.2" stroke-linecap="round"/><path d="M123.0 124.0L128 127L123.0 130.0Z" fill="#1565C0"/><path d="M134 127L141.0 127.0" fill="none" stroke="#1565C0" stroke-width="1.2" stroke-linecap="round"/><path d="M141.0 124.0L146 127L141.0 130.0Z" fill="#1565C0"/><rect x="218" y="86" width="92" height="68" rx="6" fill="#FFFFFF" stroke="#B66A00" stroke-width="1.2"/><path d="M284 146L284.0 99.0" fill="none" stroke="#BD2543" stroke-width="1.5" stroke-linecap="round"/><path d="M281.0 99.0L284 94L287.0 99.0Z" fill="#BD2543"/><path d="M244 94L244.0 141.0" fill="none" stroke="#1565C0" stroke-width="1.5" stroke-linecap="round"/><path d="M247.0 141.0L244 146L241.0 141.0Z" fill="#1565C0"/><text x="294" y="124.9" font-size="8.2" text-anchor="start" fill="#BD2543" font-weight="normal">up</text><text x="234" y="124.9" font-size="8.2" text-anchor="end" fill="#1565C0" font-weight="normal">down</text><text x="180" y="199.3" font-size="9.4" text-anchor="middle" fill="#7B2CD9" font-weight="bold">radiation: the Sun to the Earth</text><circle cx="66" cy="232" r="17" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.2"/><text x="66" y="264.9" font-size="8.4" text-anchor="middle" fill="#B66A00" font-weight="normal">Sun</text><circle cx="300" cy="232" r="13" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.2"/><text x="300" y="264.9" font-size="8.4" text-anchor="middle" fill="#1565C0" font-weight="normal">Earth</text><path d="M88 226L277.0 226.0" fill="none" stroke="#B66A00" stroke-width="1.1" stroke-linecap="round"/><path d="M277.0 223.0L282 226L277.0 229.0Z" fill="#B66A00"/><path d="M88 232L277.0 232.0" fill="none" stroke="#B66A00" stroke-width="1.1" stroke-linecap="round"/><path d="M277.0 229.0L282 232L277.0 235.0Z" fill="#B66A00"/><path d="M88 238L277.0 238.0" fill="none" stroke="#B66A00" stroke-width="1.1" stroke-linecap="round"/><path d="M277.0 235.0L282 238L277.0 241.0Z" fill="#B66A00"/><text x="180" y="212.9" font-size="8.4" text-anchor="middle" fill="#666" font-weight="normal">no medium needed</text><text x="180" y="295.3" font-size="9.3" text-anchor="middle" fill="#666" font-weight="normal">A thermos blocks all three: vacuum, silvered walls and a tight stopper.</text></svg>