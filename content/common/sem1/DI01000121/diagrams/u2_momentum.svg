<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 248" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="248" fill="#ffffff"/><text x="180" y="25.6" font-size="13.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Two trolleys, one conserved quantity</text><text x="180" y="43.4" font-size="9.7" text-anchor="middle" fill="#666" font-weight="normal">before and after a perfectly sticky hit</text><text x="14" y="47.1" font-size="9.0" text-anchor="start" fill="#666" font-weight="normal">before</text><rect x="29.0" y="58.0" width="74" height="24" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="66" y="73.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">2 kg</text><path d="M106 66L134.0 66.0" fill="none" stroke="#1565C0" stroke-width="2.0" stroke-linecap="round"/><path d="M140 66L134.0 62.6L134.0 69.4Z" fill="#1565C0"/><text x="122" y="90.9" font-size="8.4" text-anchor="middle" fill="#1565C0" font-weight="normal">3 m/s</text><rect x="221.0" y="58.0" width="74" height="24" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="258" y="73.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">1 kg</text><text x="295" y="90.9" font-size="8.4" text-anchor="middle" fill="#2E7D32" font-weight="normal">at rest</text><rect x="12.0" y="99.0" width="336" height="22" rx="7" fill="#F3EBFD" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="113.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">p = 2 × 3 + 1 × 0 = 6 kg·m/s</text><text x="14" y="149.2" font-size="9.0" text-anchor="start" fill="#666" font-weight="normal">after</text><rect x="72.0" y="144.0" width="108" height="24" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="126" y="159.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">3 kg together</text><path d="M240 152L280.0 152.0" fill="none" stroke="#B66A00" stroke-width="2.0" stroke-linecap="round"/><path d="M286 152L280.0 148.6L280.0 155.4Z" fill="#B66A00"/><text x="262" y="176.9" font-size="8.4" text-anchor="middle" fill="#B66A00" font-weight="normal">2 m/s</text><rect x="12.0" y="175.0" width="336" height="22" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="189.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">p = 3 × 2 = 6 kg·m/s, so v = 6/3 = 2 m/s</text><text x="180" y="229.3" font-size="9.3" text-anchor="middle" fill="#666" font-weight="normal">Momentum is a vector: opposite directions carry opposite signs.</text><text x="180" y="244.3" font-size="9.3" text-anchor="middle" fill="#666" font-weight="normal">Sticky collisions keep momentum but lose kinetic energy.</text></svg>