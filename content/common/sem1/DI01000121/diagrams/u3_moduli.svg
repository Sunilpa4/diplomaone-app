0 119.0L159 122L154.0 125.0Z" fill="#2E7D32"/><path d="M214 122L206.0 122.0" fill="none" stroke="#2E7D32" stroke-width="1.2" stroke-linecap="round"/><path d="M206.0 125.0L201 122L206.0 119.0Z" fill="#2E7D32"/><path d="M180 90L180.0 96.0" fill="none" stroke="#2E7D32" stroke-width="1.2" stroke-linecap="round"/><path d="M183.0 96.0L180 101L177.0 96.0Z" fill="#2E7D32"/><path d="M180 154L180.0 148.0" fill="none" stroke="#2E7D32" stroke-width="1.2" stroke-linecap="round"/><path d="M177.0 148.0L180 143L183.0 148.0Z" fill="#2E7D32"/><text x="180" y="165.0" font-size="8.6" text-anchor="middle" fill="#666" font-weight="normal">smaller</text><path d="M274 106L304 106L318 142L288 142Z" fill="#FFFFFF" stroke="#B66A00" stroke-width="1.4"/><path d="M304 96L317.0 96.0" fill="none" stroke="#B66A00" stroke-width="1.2" stroke-linecap="round"/><path d="M317.0 93.0L322 96L317.0 99.0Z" fill="#B66A00"/><text x="313" y="90.2" font-size="9.0" text-anchor="middle" fill="#B66A00" font-weight="normal">F</text><text x="296" y="165.0" font-size="8.6" text-anchor="middle" fill="#666" font-weight="normal">slanted</text><rect x="12.0" y="192.0" width="336" height="44" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="217.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal"></text><text x="180" y="210.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">Y = σ/ε  (wire)   ·   K = −ΔP/(ΔV/V)  (liquid)</text><text x="180" y="225.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">G = τ/φ  (block sheared sideways)</text><text x="180" y="249.3" font-size="9.3" text-anchor="middle" fill="#666" font-weight="normal">Solids have all three; liquids and gases only a bulk modulus.</text></svg>