<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 322" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="322" fill="#ffffff"/><text x="180" y="25.6" font-size="13.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Celsius, Fahrenheit and Kelvin</text><text x="180" y="43.4" font-size="9.7" text-anchor="middle" fill="#666" font-weight="normal">same heat, three numbering systems</text><path d="M62 68L62 244" fill="none" stroke="#1565C0" stroke-width="2.0" stroke-linecap="round"/><text x="62" y="61.6" font-size="10.4" text-anchor="middle" fill="#1565C0" font-weight="bold">°C</text><path d="M158 68L158 244" fill="none" stroke="#B66A00" stroke-width="2.0" stroke-linecap="round"/><text x="158" y="61.6" font-size="10.4" text-anchor="middle" fill="#B66A00" font-weight="bold">°F</text><path d="M254 68L254 244" fill="none" stroke="#2E7D32" stroke-width="2.0" stroke-linecap="round"/><text x="254" y="61.6" font-size="10.4" text-anchor="middle" fill="#2E7D32" font-weight="bold">K</text><path d="M57 236.0L336 236.0" fill="none" stroke="#DDDDDD" stroke-width="0.9" stroke-linecap="round"/><text x="52" y="242.5" font-size="8.8" text-anchor="end" fill="#1565C0" font-weight="normal">0</text><text x="149" y="242.5" font-size="8.8" text-anchor="end" fill="#B66A00" font-weight="normal">32</text><text x="263" y="242.5" font-size="8.8" text-anchor="start" fill="#2E7D32" font-weight="normal">273</text><path d="M57 156.0L336 156.0" fill="none" stroke="#DDDDDD" stroke-width="0.9" stroke-linecap="round"/><text x="52" y="162.5" font-size="8.8" text-anchor="end" fill="#1565C0" font-weight="normal">50</text><text x="149" y="162.5" font-size="8.8" text-anchor="end" fill="#B66A00" font-weight="normal">122</text><text x="263" y="162.5" font-size="8.8" text-anchor="start" fill="#2E7D32" font-weight="normal">323</text><path d="M57 76.0L336 76.0" fill="none" stroke="#DDDDDD" stroke-width="0.9" stroke-linecap="round"/><text x="52" y="82.5" font-size="8.8" text-anchor="end" fill="#1565C0" font-weight="normal">100</text><text x="149" y="82.5" font-size="8.8" text-anchor="end" fill="#B66A00" font-weight="normal">212</text><text x="263" y="82.5" font-size="8.8" text-anchor="start" fill="#2E7D32" font-weight="normal">373</text><text x="180" y="271.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">F = 9/5 C + 32   ·   K = C + 273.15</text><text x="180" y="301.3" font-size="9.3" text-anchor="middle" fill="#666" font-weight="normal">Ice point and steam point are the two fixed points of every scale.</text></svg>