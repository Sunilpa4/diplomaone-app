<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 302" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="302" fill="#ffffff"/><text x="180" y="25.6" font-size="13.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Same true value, different habits</text><text x="180" y="43.4" font-size="9.7" text-anchor="middle" fill="#666" font-weight="normal">the black dot is the true value</text><circle cx="104" cy="86" r="38" fill="#FFFFFF" stroke="#CCC" stroke-width="1.2"/><circle cx="104" cy="86" r="17" fill="none" stroke="#E2E2E2" stroke-width="1" stroke-dasharray="3 3"/><circle cx="104" cy="86" r="2.8" fill="#222"/><circle cx="102" cy="85" r="3.4" fill="#2E7D32"/><circle cx="109" cy="82" r="3.4" fill="#2E7D32"/><circle cx="99" cy="90" r="3.4" fill="#2E7D32"/><circle cx="107" cy="93" r="3.4" fill="#2E7D32"/><text x="104" y="140.2" font-size="9.2" text-anchor="middle" fill="#2E7D32" font-weight="bold">accurate + precise</text><circle cx="256" cy="86" r="38" fill="#FFFFFF" stroke="#CCC" stroke-width="1.2"/><circle cx="256" cy="86" r="17" fill="none" stroke="#E2E2E2" stroke-width="1" stroke-dasharray="3 3"/><circle cx="256" cy="86" r="2.8" fill="#222"/><circle cx="240" cy="74" r="3.4" fill="#B66A00"/><circle cx="244" cy="78" r="3.4" fill="#B66A00"/><circle cx="238" cy="80" r="3.4" fill="#B66A00"/><circle cx="243" cy="70" r="3.4" fill="#B66A00"/><text x="256" y="140.2" font-size="9.2" text-anchor="middle" fill="#B66A00" font-weight="bold">precise, not accurate</text><circle cx="104" cy="188" r="38" fill="#FFFFFF" stroke="#CCC" stroke-width="1.2"/><circle cx="104" cy="188" r="17" fill="none" stroke="#E2E2E2" stroke-width="1" stroke-dasharray="3 3"/><circle cx="104" cy="188" r="2.8" fill="#222"/><circle cx="82" cy="170" r="3.4" fill="#BD2543"/><circle cx="124" cy="202" r="3.4" fill="#BD2543"/><circle cx="92" cy="210" r="3.4" fill="#BD2543"/><circle cx="122" cy="168" r="3.4" fill="#BD2543"/><text x="104" y="242.2" font-size="9.2" text-anchor="middle" fill="#BD2543" font-weight="bold">neither</text><circle cx="256" cy="188" r="38" fill="#FFFFFF" stroke="#CCC" stroke-width="1.2"/><circle cx="256" cy="188" r="17" fill="none" stroke="#E2E2E2" stroke-width="1" stroke-dasharray="3 3"/><circle cx="256" cy="188" r="2.8" fill="#222"/><circle cx="230" cy="172" r="3.4" fill="#1565C0"/><circle cx="282" cy="206" r="3.4" fill="#1565C0"/><circle cx="262" cy="164" r="3.4" fill="#1565C0"/><circle cx="252" cy="212" r="3.4" fill="#1565C0"/><text x="256" y="242.2" font-size="9.2" text-anchor="middle" fill="#1565C0" font-weight="bold">accurate on average</text><text x="180" y="265.3" font-size="9.3" text-anchor="middle" fill="#666" font-weight="normal">Accuracy = close to the true value. Precision = close to each other.</text><text x="180" y="280.3" font-size="9.3" text-anchor="middle" fill="#666" font-weight="normal">Calibration buys accuracy; careful technique buys precision.</text></svg>