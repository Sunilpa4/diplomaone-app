<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 288" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="288" fill="#ffffff"/><text x="180" y="25.6" font-size="13.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Velocity tangential, force radial</text><text x="180" y="43.4" font-size="9.7" text-anchor="middle" fill="#666" font-weight="normal">a body on a string at constant speed</text><circle cx="148" cy="110" r="62" fill="none" stroke="#CCC" stroke-width="1.2" stroke-dasharray="4 3"/><circle cx="148" cy="110" r="2.8" fill="#222"/><text x="148" y="104.7" font-size="7.6" text-anchor="middle" fill="#666" font-weight="normal">centre</text><path d="M191.834 153.834L165.2426406871193 127.24264068711929" fill="none" stroke="#7B2CD9" stroke-width="1.9" stroke-linecap="round"/><path d="M161 123L162.8 129.6L167.6 124.8Z" fill="#7B2CD9"/><text x="174" y="147.8" font-size="11" text-anchor="middle" fill="#7B2CD9" font-weight="bold">F</text><circle cx="191.834" cy="153.834" r="5" fill="#1565C0"/><path d="M194.834 150.834L220.5913593128807 125.0766406871193" fill="none" stroke="#2E7D32" stroke-width="1.9" stroke-linecap="round"/><path d="M224.834 120.834L218.2 122.7L223.0 127.5Z" fill="#2E7D32"/><text x="231.834" y="121.5" font-size="10.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">v</text><rect x="12.0" y="184.0" width="336" height="24" rx="7" fill="#F3EBFD" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="199.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">F = m v²/r = m r ω², aimed at the centre</text><rect x="12.0" y="214.0" width="336" height="24" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="229.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">v is always along the tangent</text><text x="180" y="265.3" font-size="9.3" text-anchor="middle" fill="#666" font-weight="normal">Speed constant, velocity not: the direction turns every instant.</text><text x="180" y="280.3" font-size="9.3" text-anchor="middle" fill="#666" font-weight="normal">Cut the string and the body leaves along the tangent, not outward.</text></svg>