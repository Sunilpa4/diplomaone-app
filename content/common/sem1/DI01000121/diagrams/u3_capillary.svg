<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="330" fill="#ffffff"/><text x="180" y="25.6" font-size="13.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Water rising in a thin glass tube</text><text x="180" y="43.4" font-size="9.7" text-anchor="middle" fill="#666" font-weight="normal">h = 2T cos θ / (ρ g r)</text><rect x="18" y="206" width="324" height="42" fill="#EAF3FD"/><path d="M18 206L342 206" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-linecap="round"/><text x="292" y="227.1" font-size="8.8" text-anchor="middle" fill="#1565C0" font-weight="normal">water</text><path d="M157 206L157 106Q172.0 128 187 106L187 206Z" fill="#8FC4EE" opacity="0.8"/><path d="M154 54L154 248" fill="none" stroke="#9AA5B1" stroke-width="3.0" stroke-linecap="round"/><path d="M190 54L190 248" fill="none" stroke="#9AA5B1" stroke-width="3.0" stroke-linecap="round"/><path d="M132 205L132.0 131.0" fill="none" stroke="#222" stroke-width="1.0" stroke-linecap="round"/><path d="M129.0 131.0L132 126L135.0 131.0Z" fill="#222"/><path d="M132 126L132.0 200.0" fill="none" stroke="#222" stroke-width="1.0" stroke-linecap="round"/><path d="M135.0 200.0L132 205L129.0 200.0Z" fill="#222"/><text x="114" y="169.7" font-size="10.6" text-anchor="middle" fill="#222" font-weight="bold">h</text><text x="102" y="182.9" font-size="8.4" text-anchor="middle" fill="#666" font-weight="normal">7.35 cm</text><path d="M132 126L160 126" fill="none" stroke="#BBBBBB" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="2 2"/><path d="M132 205L160 205" fill="none" stroke="#BBBBBB" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="2 2"/><path d="M157 106L157 126" fill="none" stroke="#B66A00" stroke-width="1.0" stroke-linecap="round" stroke-dasharray="2 2"/><path d="M157 124A18 18 0 0 1 168 109" fill="none" stroke="#B66A00" stroke-width="1.2"/><text x="202" y="161.1" font-size="8.8" text-anchor="start" fill="#B66A00" font-weight="normal">θ ≈ 0°: water wets glass</text><path d="M206 150L198 118" fill="none" stroke="#BBBBBB" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="2 2"/><text x="258" y="91.1" font-size="8.8" text-anchor="middle" fill="#666" font-weight="normal">tube radius r = 0.2 mm</text><path d="M252 92L194 100" fill="none" stroke="#BBBBBB" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="2 2"/><rect x="12.0" y="263.0" width="336" height="26" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="279.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">weight of the column = upward pull of surface tension</text><text x="180" y="311.3" font-size="9.3" text-anchor="middle" fill="#666" font-weight="normal">Mercury has θ ≈ 140°, so h is negative and the level drops.</text></svg>