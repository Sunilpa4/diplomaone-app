<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 302" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="302" fill="#ffffff"/><text x="180" y="25.6" font-size="13.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">A gun at rest fires a bullet</text><text x="180" y="43.4" font-size="9.7" text-anchor="middle" fill="#666" font-weight="normal">the total momentum cannot change</text><rect x="12.0" y="48.0" width="336" height="24" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="63.1" font-size="9.0" text-anchor="middle" fill="#222" font-weight="normal">before firing: bullet 0 + rifle 0 = 0</text><path d="M180 72L180 99" fill="none" stroke="#222" stroke-width="1.4" stroke-linecap="round"/><path d="M176.6 98.8L180 104L183.4 98.8Z" fill="#222"/><rect x="20.0" y="99.0" width="152" height="26" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="96" y="115.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">bullet 20 g</text><rect x="190.0" y="99.0" width="152" height="26" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="266" y="115.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">rifle 5 kg</text><path d="M32 152L134.0 152.0" fill="none" stroke="#2E7D32" stroke-width="2.0" stroke-linecap="round"/><path d="M140 152L134.0 148.6L134.0 155.4Z" fill="#2E7D32"/><path d="M330 152L228.0 152.0" fill="none" stroke="#BD2543" stroke-width="2.0" stroke-linecap="round"/><path d="M222 152L228.0 155.4L228.0 148.6Z" fill="#BD2543"/><text x="86" y="173.1" font-size="8.8" text-anchor="middle" fill="#2E7D32" font-weight="normal">400 m/s</text><text x="276" y="173.1" font-size="8.8" text-anchor="middle" fill="#BD2543" font-weight="normal">1.6 m/s</text><text x="96" y="188.9" font-size="8.4" text-anchor="middle" fill="#2E7D32" font-weight="normal">p = 8 kg·m/s  →</text><text x="266" y="188.9" font-size="8.4" text-anchor="middle" fill="#BD2543" font-weight="normal">p = 8 kg·m/s  ←</text><rect x="12.0" y="200.0" width="336" height="24" rx="7" fill="#F3EBFD" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="215.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">equal and opposite: the total stays zero</text><rect x="12.0" y="232.0" width="336" height="24" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="247.2" font-size="9.2" text-anchor="middle" fill="#222" font-weight="normal">V = m v / M = (0.020 × 400)/5 = 1.6 m/s</text><text x="180" y="283.3" font-size="9.3" text-anchor="middle" fill="#666" font-weight="normal">Small speed, large momentum: the rifle is 250 times heavier.</text><text x="180" y="298.3" font-size="9.3" text-anchor="middle" fill="#666" font-weight="normal">A stock and a spring spread the change over a longer time.</text></svg>