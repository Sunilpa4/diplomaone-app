<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="340" fill="#ffffff"/><text x="180" y="25.3" font-size="12.4" text-anchor="middle" fill="#222222" font-weight="bold">Front and top given: build the side view</text><text x="180" y="42.3" font-size="9.4" text-anchor="middle" fill="#666666" font-weight="normal">an L block, 60 x 40 x 40</text><path d="M52.0 106.0L52.0 91.0L72.0 91.0L72.0 66.0L112.0 66.0L112.0 106.0Z" fill="none" stroke="#1565C0" stroke-width="1.7"/><text x="82.0" y="122.4" font-size="6.8" text-anchor="middle" fill="#666666" font-weight="normal">FRONT (given)</text><rect x="52.0" y="130.0" width="60" height="40" fill="none" stroke="#7B2CD9" stroke-width="1.7"/><path d="M72.0 130.0L72.0 170.0" fill="none" stroke="#7B2CD9" stroke-width="1.2" stroke-linecap="round"/><text x="82.0" y="186.4" font-size="6.8" text-anchor="middle" fill="#666666" font-weight="normal">TOP (given)</text><rect x="128.0" y="66.0" width="40" height="40" fill="none" stroke="#2E7D32" stroke-width="1.6" stroke-dasharray="6 4"/><path d="M128.0 91.0L168.0 91.0" fill="none" stroke="#2E7D32" stroke-width="1.0" stroke-linecap="round" stroke-dasharray="5 3"/><text x="148.0" y="122.4" font-size="6.8" text-anchor="middle" fill="#2E7D32" font-weight="normal">SIDE (to draw)</text><path d="M112.0 66.0L128.0 66.0" fill="none" stroke="#9AA3AD" stroke-width="0.7" stroke-linecap="round" stroke-dasharray="3 4"/><path d="M112.0 91.0L128.0 91.0" fill="none" stroke="#9AA3AD" stroke-width="0.7" stroke-linecap="round" stroke-dasharray="3 4"/><path d="M112.0 106.0L128.0 106.0" fill="none" stroke="#9AA3AD" stroke-width="0.7" stroke-linecap="round" stroke-dasharray="3 4"/><path d="M52.0 106.0L52.0 130.0" fill="none" stroke="#9AA3AD" stroke-width="0.7" stroke-linecap="round" stroke-dasharray="3 4"/><path d="M112.0 106.0L112.0 130.0" fill="none" stroke="#9AA3AD" stroke-width="0.7" stroke-linecap="round" stroke-dasharray="3 4"/><path d="M52.0 170.0L52.0 200.0" fill="none" stroke="#9AA3AD" stroke-width="0.7" stroke-linecap="round" stroke-dasharray="3 4"/><path d="M112.0 170.0L112.0 200.0" fill="none" stroke="#9AA3AD" stroke-width="0.7" stroke-linecap="round" stroke-dasharray="3 4"/><rect x="8" y="246" width="344" height="34" rx="5" fill="#F4F6F8" stroke="#9AA3AD" stroke-width="0.9"/><text x="180" y="263.6" font-size="7.4" text-anchor="middle" fill="#222" font-weight="normal">Width from the front view, height from the front view, depth from</text><text x="180" y="276.6" font-size="7.4" text-anchor="middle" fill="#222" font-weight="normal">the top view - the side view is the depth by the height.</text><text x="180" y="319.1" font-size="8.8" text-anchor="middle" fill="#666666" font-weight="normal">Project each corner across from the front view and carry each depth round</text><text x="180" y="332.1" font-size="8.8" text-anchor="middle" fill="#666666" font-weight="normal">from the top view; the hidden edge of the step becomes dashed.</text></svg>