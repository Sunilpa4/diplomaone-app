<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 322" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="322" fill="#ffffff"/><text x="180" y="25.3" font-size="12.4" text-anchor="middle" fill="#222222" font-weight="bold">A hole is drawn where it can be seen</text><text x="180" y="42.3" font-size="9.4" text-anchor="middle" fill="#666666" font-weight="normal">plate 60 x 40 x 15, hole 20 dia</text><rect x="40.0" y="70.0" width="60.0" height="40.0" fill="none" stroke="#1565C0" stroke-width="1.7"/><path d="M60.0 74.0L60.0 106.0" fill="none" stroke="#BD2543" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 3"/><path d="M80.0 74.0L80.0 106.0" fill="none" stroke="#BD2543" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 3"/><text x="70.0" y="124.5" font-size="7.0" text-anchor="middle" fill="#666666" font-weight="normal">FRONT</text><rect x="40.0" y="132.0" width="60.0" height="44" fill="none" stroke="#7B2CD9" stroke-width="1.7"/><circle cx="70.0" cy="154.0" r="20" fill="none" stroke="#BD2543" stroke-width="1.2"/><path d="M62.0 154.0L78.0 154.0" fill="none" stroke="#9AA3AD" stroke-width="0.6" stroke-linecap="round" stroke-dasharray="6 3"/><path d="M70.0 146.0L70.0 162.0" fill="none" stroke="#9AA3AD" stroke-width="0.6" stroke-linecap="round" stroke-dasharray="6 3"/><text x="70.0" y="190.4" font-size="7.0" text-anchor="middle" fill="#666666" font-weight="normal">TOP</text><rect x="130.0" y="70.0" width="44" height="40.0" fill="none" stroke="#2E7D32" stroke-width="1.7"/><path d="M142.0 74.0L142.0 106.0" fill="none" stroke="#BD2543" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 3"/><path d="M162.0 74.0L162.0 106.0" fill="none" stroke="#BD2543" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 3"/><text x="152.0" y="124.5" font-size="7.0" text-anchor="middle" fill="#666666" font-weight="normal">SIDE</text><text x="152.0" y="136.2" font-size="6.2" text-anchor="middle" fill="#666666" font-weight="normal">from the left</text><rect x="8" y="232" width="344" height="46" rx="5" fill="#F4F6F8" stroke="#9AA3AD" stroke-width="0.9"/><text x="180" y="250.6" font-size="7.4" text-anchor="middle" fill="#222" font-weight="normal">Solid line: an edge you can see. Dashed line: an edge hidden behind</text><text x="180" y="264.6" font-size="7.4" text-anchor="middle" fill="#222" font-weight="normal">material. Centre line: the axis of a hole or a cylinder.</text><text x="180" y="276.5" font-size="7.2" text-anchor="middle" fill="#666666" font-weight="normal">Never draw the hole solid in a view where the material hides it.</text><text x="180" y="303.1" font-size="8.8" text-anchor="middle" fill="#666666" font-weight="normal">The hole is 20 mm across in every view and its position is repeated exactly,</text><text x="180" y="316.1" font-size="8.8" text-anchor="middle" fill="#666666" font-weight="normal">because the three views are three looks at one object.</text></svg>