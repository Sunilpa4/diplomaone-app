<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 274" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="274" fill="#ffffff"/><text x="180" y="25.3" font-size="12.4" text-anchor="middle" fill="#222222" font-weight="bold">A sloping face is found by offsets</text><text x="180" y="42.3" font-size="9.4" text-anchor="middle" fill="#666666" font-weight="normal">wedge 50 x 30, height 20 at one end</text><path d="M118.0 104.0L159.1 127.8L134.5 142.0L93.3 118.2Z" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M118.0 104.0L118.0 85.0" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linecap="round"/><path d="M159.1 127.8L159.1 127.8" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-linecap="round"/><path d="M93.3 118.2L93.3 99.2" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-linecap="round"/><path d="M118.0 85.0L93.3 99.2" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-linecap="round"/><path d="M134.5 142.0L134.5 142.0" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-linecap="round"/><path d="M118.0 85.0L93.3 99.2L134.5 142.0L159.1 127.8Z" fill="none" stroke="#BD2543" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><path d="M118.0 85.0L159.1 127.8" fill="none" stroke="#BD2543" stroke-width="1.8" stroke-linecap="round"/><text x="108.0" y="83.2" font-size="6.4" text-anchor="end" fill="#666666" font-weight="normal">20</text><text x="138.56810333988042" y="120.2" font-size="6.4" text-anchor="middle" fill="#666666" font-weight="normal">50</text><circle cx="126.2" cy="113.5" r="2.6" fill="#7B2CD9"/><path d="M126.2 123.0L126.2 113.5" fill="none" stroke="#7B2CD9" stroke-width="0.9" stroke-linecap="round" stroke-dasharray="4 3"/><path d="M138.6 115.9L126.2 123.0" fill="none" stroke="#7B2CD9" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="4 3"/><path d="M105.7 111.1L126.2 123.0" fill="none" stroke="#7B2CD9" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="4 3"/><text x="130.22724133595216" y="112.1" font-size="7.4" text-anchor="start" fill="#7B2CD9" font-weight="None">P</text><text x="180" y="212.5" font-size="7.2" text-anchor="middle" fill="#666666" font-weight="normal">P is 25 along X, 15 along Y and 10 up: measure the three offsets from O,</text><text x="180" y="225.5" font-size="7.2" text-anchor="middle" fill="#666666" font-weight="normal">then join P to the corners of the sloping face.</text><text x="180" y="255.1" font-size="8.8" text-anchor="middle" fill="#666666" font-weight="normal">A line that is not parallel to an isometric axis has no true length in the</text><text x="180" y="268.1" font-size="8.8" text-anchor="middle" fill="#666666" font-weight="normal">drawing: its ends must be located by offsets, then joined.</text></svg>