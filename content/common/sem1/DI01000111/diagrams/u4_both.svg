<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 366" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="366" fill="#ffffff"/><text x="180" y="25.3" font-size="12.4" text-anchor="middle" fill="#222222" font-weight="bold">Inclined to both planes: two stages</text><text x="180" y="42.3" font-size="9.4" text-anchor="middle" fill="#666666" font-weight="normal">square 50 mm, 45 deg to HP, 30 deg to VP</text><path d="M16.0 168.0L344.0 168.0" fill="none" stroke="#222222" stroke-width="1.1" stroke-linecap="round"/><text x="342" y="165.5" font-size="7.2" text-anchor="end" fill="#666666" font-weight="normal">X Y</text><path d="M168.0 168.0L206.9 129.1" fill="none" stroke="#7B2CD9" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="5 3"/><path d="M168.0 190.0L206.9 190.0" fill="none" stroke="#7B2CD9" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 3"/><path d="M168.0 190.0L168.0 245.0" fill="none" stroke="#7B2CD9" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 3"/><path d="M206.9 190.0L206.9 245.0" fill="none" stroke="#7B2CD9" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 3"/><path d="M168.0 245.0L206.9 245.0" fill="none" stroke="#7B2CD9" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 3"/><text x="162.0" y="123.3" font-size="6.2" text-anchor="start" fill="#7B2CD9" font-weight="normal">stage 1: edge 50 at 45 deg</text><path d="M168.0 190.0L201.7 209.4L174.2 257.1L140.5 237.6Z" fill="none" stroke="#1565C0" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round"/><path d="M206.9 190.0A38.9 38.9 0 0 1 201.7 209.4" fill="none" stroke="#2E7D32" stroke-width="0.9" stroke-dasharray="4 3"/><text x="205.6804839632687" y="225.6" font-size="6.2" text-anchor="start" fill="#1565C0" font-weight="normal">plan swung 30 deg</text><path d="M160.0 129.1L236.9 129.1" fill="none" stroke="#9AA3AD" stroke-width="0.7" stroke-linecap="round" stroke-dasharray="4 3"/><path d="M160.0 168.0L236.9 168.0" fill="none" stroke="#9AA3AD" stroke-width="0.7" stroke-linecap="round" stroke-dasharray="4 3"/><path d="M168.0 168.0L201.7 129.1L174.2 129.1L140.5 168.0Z" fill="none" stroke="#BD2543" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round"/><path d="M201.7 209.4L201.7 129.1" fill="none" stroke="#9AA3AD" stroke-width="0.6" stroke-linecap="round" stroke-dasharray="3 3"/><path d="M174.2 257.1L174.2 129.1" fill="none" stroke="#9AA3AD" stroke-width="0.6" stroke-linecap="round" stroke-dasharray="3 3"/><path d="M140.5 237.6L140.5 168.0" fill="none" stroke="#9AA3AD" stroke-width="0.6" stroke-linecap="round" stroke-dasharray="3 3"/><text x="162.0" y="166.6" font-size="7.4" text-anchor="end" fill="#BD2543" font-weight="None">a'</text><text x="203.6804839632687" y="127.7" font-size="7.4" text-anchor="start" fill="#BD2543" font-weight="None">d'</text><text x="134.5" y="166.6" font-size="7.4" text-anchor="end" fill="#BD2543" font-weight="None">b'</text><text x="240.89087296526012" y="134.3" font-size="6.2" text-anchor="end" fill="#666666" font-weight="normal">locus of d'</text><rect x="8" y="286" width="344" height="38" rx="5" fill="#F4F6F8" stroke="#9AA3AD" stroke-width="0.9"/><text x="180" y="302.5" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">stage 1 edge 50 at 45 deg   |   stage 2 plan swung to 30 deg</text><text x="180" y="316.5" font-size="7.2" text-anchor="middle" fill="#666666" font-weight="normal">50 cos 45 = 35.4 across, and the depth 50 cos 30 = 43.3</text><text x="180" y="339.1" font-size="8.8" text-anchor="middle" fill="#666666" font-weight="normal">Make the plane perpendicular to VP first and finish the edge view; swing the</text><text x="180" y="352.1" font-size="8.8" text-anchor="middle" fill="#666666" font-weight="normal">plan for the second angle and read the final elevation off the locus lines.</text></svg>