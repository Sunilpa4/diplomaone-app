<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="280" fill="#ffffff"/><text x="180" y="25.3" font-size="12.4" text-anchor="middle" fill="#222222" font-weight="bold">The three positions worth memorising</text><rect x="4.0" y="52" width="112" height="176" rx="6" fill="#FBFCFD" stroke="#9AA3AD" stroke-width="0.9"/><text x="60.0" y="68.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="bold">parallel to both</text><path d="M10.0 140.0L110.0 140.0" fill="none" stroke="#222222" stroke-width="0.9" stroke-linecap="round"/><text x="108.0" y="138.1" font-size="6.0" text-anchor="end" fill="#666666" font-weight="normal">XY</text><rect x="124.0" y="52" width="112" height="176" rx="6" fill="#FBFCFD" stroke="#9AA3AD" stroke-width="0.9"/><text x="180.0" y="68.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="bold">perpendicular to HP</text><path d="M130.0 140.0L230.0 140.0" fill="none" stroke="#222222" stroke-width="0.9" stroke-linecap="round"/><text x="228.0" y="138.1" font-size="6.0" text-anchor="end" fill="#666666" font-weight="normal">XY</text><rect x="244.0" y="52" width="112" height="176" rx="6" fill="#FBFCFD" stroke="#9AA3AD" stroke-width="0.9"/><text x="300.0" y="68.7" font-size="7.6" text-anchor="middle" fill="#222222" font-weight="bold">parallel to HP</text><path d="M250.0 140.0L350.0 140.0" fill="none" stroke="#222222" stroke-width="0.9" stroke-linecap="round"/><text x="348.0" y="138.1" font-size="6.0" text-anchor="end" fill="#666666" font-weight="normal">XY</text><path d="M26.0 122.0L71.0 122.0" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linecap="round"/><path d="M26.0 158.0L71.0 158.0" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linecap="round"/><path d="M26.0 118.0L26.0 162.0" fill="none" stroke="#9AA3AD" stroke-width="0.6" stroke-linecap="round" stroke-dasharray="3 3"/><path d="M71.0 118.0L71.0 162.0" fill="none" stroke="#9AA3AD" stroke-width="0.6" stroke-linecap="round" stroke-dasharray="3 3"/><circle cx="26.0" cy="122.0" r="2.4" fill="none" stroke="#BD2543" stroke-width="1.3"/><circle cx="71.0" cy="122.0" r="2.4" fill="none" stroke="#BD2543" stroke-width="1.3"/><circle cx="26.0" cy="158.0" r="2.2" fill="#1565C0"/><circle cx="71.0" cy="158.0" r="2.2" fill="#1565C0"/><text x="64.0" y="198.3" font-size="6.6" text-anchor="middle" fill="#666666" font-weight="normal">TL 60 in both views</text><text x="64.0" y="210.2" font-size="6.4" text-anchor="middle" fill="#666666" font-weight="normal">25 above HP, 30 in front</text><circle cx="168.0" cy="122.0" r="3.0" fill="#BD2543"/><text x="168.0" y="118.2" font-size="6.4" text-anchor="middle" fill="#BD2543" font-weight="normal">a' and b'</text><path d="M168.0 152.0L168.0 186.0" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linecap="round"/><path d="M168.0 140.0L168.0 152.0" fill="none" stroke="#9AA3AD" stroke-width="0.6" stroke-linecap="round" stroke-dasharray="3 3"/><circle cx="168.0" cy="152.0" r="2.2" fill="none" stroke="#1565C0" stroke-width="1.3"/><circle cx="168.0" cy="186.0" r="2.4" fill="#1565C0"/><text x="168.0" y="202.3" font-size="6.6" text-anchor="middle" fill="#666666" font-weight="normal">plan shows TL</text><text x="168.0" y="214.2" font-size="6.4" text-anchor="middle" fill="#666666" font-weight="normal">elevation is a point</text><path d="M270.0 122.0L307.3 122.0" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linecap="round"/><path d="M270.0 150.0L307.3 181.3" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linecap="round"/><path d="M270.0 122.0L270.0 150.0" fill="none" stroke="#9AA3AD" stroke-width="0.6" stroke-linecap="round" stroke-dasharray="3 3"/><path d="M307.3 181.3L307.3 150.0" fill="none" stroke="#9AA3AD" stroke-width="0.6" stroke-linecap="round" stroke-dasharray="3 3"/><circle cx="270.0" cy="122.0" r="2.4" fill="none" stroke="#BD2543" stroke-width="1.3"/><circle cx="270.0" cy="150.0" r="2.4" fill="#1565C0"/><text x="304.0" y="202.3" font-size="6.6" text-anchor="middle" fill="#666666" font-weight="normal">plan TL at 40 deg</text><text x="304.0" y="214.2" font-size="6.4" text-anchor="middle" fill="#666666" font-weight="normal">elevation 65 cos 40 = 49.8</text><text x="180" y="255.1" font-size="8.8" text-anchor="middle" fill="#666666" font-weight="normal">An elevation is the view from the front, a plan from above;</text><text x="180" y="268.1" font-size="8.8" text-anchor="middle" fill="#666666" font-weight="normal">vertical projectors keep the two views tied together.</text></svg>