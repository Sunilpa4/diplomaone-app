<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 278" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="278" fill="#ffffff"/><text x="180" y="25.3" font-size="12.4" text-anchor="middle" fill="#222" font-weight="bold">Eight lines, eight meanings</text><text x="180" y="42.3" font-size="9.4" text-anchor="middle" fill="#666" font-weight="normal">thickness 0.5 mm or 0.25 mm, ratio 2 : 1</text><path d="M40 58L108 58" fill="none" stroke="#222" stroke-width="2.0" stroke-linecap="round"/><text x="114" y="57.7" font-size="7.6" text-anchor="start" fill="#1565C0" font-weight="bold">continuous thick</text><text x="114" y="67.4" font-size="6.8" text-anchor="start" fill="#666" font-weight="normal">visible outline and visible edge</text><text x="10" y="57.0" font-size="5.6" text-anchor="start" fill="#9AA3AD" font-weight="normal">0.5</text><path d="M40 82L108 82" fill="none" stroke="#222" stroke-width="0.9" stroke-linecap="round"/><text x="114" y="81.7" font-size="7.6" text-anchor="start" fill="#1565C0" font-weight="bold">continuous thin</text><text x="114" y="91.4" font-size="6.8" text-anchor="start" fill="#666" font-weight="normal">dimension, extension, leader, hatching</text><text x="10" y="81.0" font-size="5.6" text-anchor="start" fill="#9AA3AD" font-weight="normal">0.25</text><path d="M40 106L108 106" fill="none" stroke="#222" stroke-width="0.9" stroke-linecap="round" stroke-dasharray="6 3"/><text x="114" y="105.7" font-size="7.6" text-anchor="start" fill="#1565C0" font-weight="bold">dashed thin</text><text x="114" y="115.4" font-size="6.8" text-anchor="start" fill="#666" font-weight="normal">hidden edge or hidden outline</text><text x="10" y="105.0" font-size="5.6" text-anchor="start" fill="#9AA3AD" font-weight="normal">0.25</text><polyline points="40,127.6 44,127.6 48,132.4 52,132.4 56,127.6 60,127.6 64,132.4 68,132.4 72,127.6 76,127.6 80,132.4 84,132.4 88,127.6 92,127.6 96,132.4 100,132.4 104,127.6 108,127.6 112,132.4 116,132.4" fill="none" stroke="#222" stroke-width="0.9"/><text x="114" y="129.7" font-size="7.6" text-anchor="start" fill="#1565C0" font-weight="bold">wavy thin</text><text x="114" y="139.4" font-size="6.8" text-anchor="start" fill="#666" font-weight="normal">limit of a partial view</text><text x="10" y="129.0" font-size="5.6" text-anchor="start" fill="#9AA3AD" font-weight="normal">0.25</text><polyline points="40,157.0 44,157.0 48,154.0 52,154.0 56,157.0 60,157.0 64,154.0 68,154.0 72,157.0 76,157.0 80,154.0 84,154.0 88,157.0 92,157.0 96,154.0 100,154.0 104,157.0 108,157.0 112,154.0 116,154.0" fill="none" stroke="#222" stroke-width="0.9"/><text x="114" y="153.7" font-size="7.6" text-anchor="start" fill="#1565C0" font-weight="bold">zig-zag thin</text><text x="114" y="163.4" font-size="6.8" text-anchor="start" fill="#666" font-weight="normal">limit of a broken-out section</text><text x="10" y="153.0" font-size="5.6" text-anchor="start" fill="#9AA3AD" font-weight="normal">0.25</text><path d="M40 178L108 178" fill="none" stroke="#222" stroke-width="0.9" stroke-linecap="round" stroke-dasharray="10 3 2 3"/><text x="114" y="177.7" font-size="7.6" text-anchor="start" fill="#1565C0" font-weight="bold">chain thin</text><text x="114" y="187.4" font-size="6.8" text-anchor="start" fill="#666" font-weight="normal">centre line, pitch circle</text><text x="10" y="177.0" font-size="5.6" text-anchor="start" fill="#9AA3AD" font-weight="normal">0.25</text><path d="M40 202L48 202" fill="none" stroke="#222" stroke-width="2.0" stroke-linecap="round"/><path d="M100 202L108 202" fill="none" stroke="#222" stroke-width="2.0" stroke-linecap="round"/><path d="M52 202L96 202" fill="none" stroke="#222" stroke-width="0.9" stroke-linecap="round" stroke-dasharray="10 3 2 3"/><text x="114" y="201.7" font-size="7.6" text-anchor="start" fill="#1565C0" font-weight="bold">chain, thick ends</text><text x="114" y="211.4" font-size="6.8" text-anchor="start" fill="#666" font-weight="normal">cutting plane line of a section</text><text x="10" y="201.0" font-size="5.6" text-anchor="start" fill="#9AA3AD" font-weight="normal">0.25/0.5</text><path d="M40 226L108 226" fill="none" stroke="#222" stroke-width="0.9" stroke-linecap="round" stroke-dasharray="9 2.5 1.5 2.5"/><text x="114" y="225.7" font-size="7.6" text-anchor="start" fill="#1565C0" font-weight="bold">double dash thin</text><text x="114" y="235.4" font-size="6.8" text-anchor="start" fill="#666" font-weight="normal">adjacent part or alternate position</text><text x="10" y="225.0" font-size="5.6" text-anchor="start" fill="#9AA3AD" font-weight="normal">0.25</text><text x="180" y="257.1" font-size="8.8" text-anchor="middle" fill="#666" font-weight="normal">A hidden edge starts and ends with a dash, never with a gap.</text><text x="180" y="270.1" font-size="8.8" text-anchor="middle" fill="#666" font-weight="normal">A centre line runs 2 to 3 mm past the outline on both sides.</text></svg>