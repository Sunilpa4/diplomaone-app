<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 322" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="322" fill="#ffffff"/><text x="180" y="25.3" font-size="12.4" text-anchor="middle" fill="#222222" font-weight="bold">Revolved shapes: two rectangles and a circle</text><text x="180" y="42.3" font-size="9.4" text-anchor="middle" fill="#666666" font-weight="normal">diameter 40 mm, height 50 mm</text><ellipse cx="96.0" cy="58.0" rx="20.0" ry="10.0" fill="none" stroke="#1565C0" stroke-width="1.6"/><path d="M76.0 58.0L76.0 108.0" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-linecap="round"/><path d="M116.0 58.0L116.0 108.0" fill="none" stroke="#1565C0" stroke-width="1.6" stroke-linecap="round"/><path d="M76.0 108.0A20.0 10.0 0 0 0 116.0 108.0" fill="none" stroke="#1565C0" stroke-width="1.6"/><path d="M96.0 58.0L96.0 118.0" fill="none" stroke="#9AA3AD" stroke-width="0.6" stroke-linecap="round" stroke-dasharray="4 3"/><text x="122.0" y="68.2" font-size="6.4" text-anchor="start" fill="#666666" font-weight="normal">40</text><text x="100.0" y="90.2" font-size="6.4" text-anchor="start" fill="#666666" font-weight="normal">50</text><text x="96.0" y="134.4" font-size="7.0" text-anchor="middle" fill="#666666" font-weight="normal">pictorial view</text><rect x="216.0" y="74.0" width="40" height="50" fill="none" stroke="#1565C0" stroke-width="1.6"/><path d="M216.0 99.0L256.0 99.0" fill="none" stroke="#9AA3AD" stroke-width="0.7" stroke-linecap="round" stroke-dasharray="6 3"/><text x="236.0" y="136.4" font-size="7.0" text-anchor="middle" fill="#666666" font-weight="normal">FRONT</text><circle cx="236.0" cy="170.0" r="20" fill="none" stroke="#7B2CD9" stroke-width="1.6"/><path d="M210.0 170.0L262.0 170.0" fill="none" stroke="#9AA3AD" stroke-width="0.6" stroke-linecap="round" stroke-dasharray="6 3"/><path d="M236.0 144.0L236.0 196.0" fill="none" stroke="#9AA3AD" stroke-width="0.6" stroke-linecap="round" stroke-dasharray="6 3"/><text x="236.0" y="198.4" font-size="7.0" text-anchor="middle" fill="#666666" font-weight="normal">TOP</text><rect x="270.0" y="74.0" width="40" height="50" fill="none" stroke="#2E7D32" stroke-width="1.6"/><path d="M270.0 99.0L310.0 99.0" fill="none" stroke="#9AA3AD" stroke-width="0.7" stroke-linecap="round" stroke-dasharray="6 3"/><text x="290.0" y="136.4" font-size="7.0" text-anchor="middle" fill="#666666" font-weight="normal">SIDE</text><text x="180" y="303.1" font-size="8.8" text-anchor="middle" fill="#666666" font-weight="normal">A circular edge seen square-on is a circle, seen edge-on a line, and seen at an</text><text x="180" y="316.1" font-size="8.8" text-anchor="middle" fill="#666666" font-weight="normal">angle an ellipse - which is why the top view is the only place the circle appears.</text></svg>