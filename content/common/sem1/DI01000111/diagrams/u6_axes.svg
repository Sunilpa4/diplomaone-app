<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 326" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="326" fill="#ffffff"/><text x="180" y="25.3" font-size="12.4" text-anchor="middle" fill="#222222" font-weight="bold">Thirty degrees each way, and one axis up</text><text x="180" y="42.3" font-size="9.4" text-anchor="middle" fill="#666666" font-weight="normal">isometric drawing at full scale</text><path d="M118.0 152.0L187.3 112.0" fill="none" stroke="#BD2543" stroke-width="1.8" stroke-linecap="round"/><path d="M118.0 152.0L48.7 112.0" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round"/><path d="M118.0 152.0L118.0 72.0" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linecap="round"/><path d="M152.0 152.0A34 34 0 0 0 147.4 135.0" fill="none" stroke="#666666" stroke-width="0.7"/><text x="158.0" y="148.3" font-size="6.6" text-anchor="start" fill="#666666" font-weight="normal">30</text><text x="78.0" y="148.3" font-size="6.6" text-anchor="end" fill="#666666" font-weight="normal">30</text><text x="189.2820323027551" y="120.6" font-size="7.4" text-anchor="start" fill="#BD2543" font-weight="None">X</text><text x="46.7179676972449" y="120.6" font-size="7.4" text-anchor="end" fill="#2E7D32" font-weight="None">Y</text><text x="118.0" y="66.6" font-size="7.4" text-anchor="middle" fill="#1565C0" font-weight="None">Z</text><text x="118.0" y="170.5" font-size="7.2" text-anchor="middle" fill="#222222" font-weight="bold">O</text><text x="180" y="226.7" font-size="7.6" text-anchor="middle" fill="#666666" font-weight="normal">one 30 mm edge, drawn two ways</text><path d="M118.0 248.0L178.0 248.0" fill="none" stroke="#222222" stroke-width="2.0" stroke-linecap="round"/><text x="148" y="244.3" font-size="6.6" text-anchor="middle" fill="#222222" font-weight="normal">true 30 mm</text><path d="M118.0 272.0L167.0 272.0" fill="none" stroke="#7B2CD9" stroke-width="2.0" stroke-linecap="round"/><text x="152" y="266.3" font-size="6.6" text-anchor="middle" fill="#7B2CD9" font-weight="normal">isometric 24.5 mm</text><text x="198" y="254.3" font-size="6.6" text-anchor="start" fill="#222222" font-weight="normal">drawing: use 30 mm</text><text x="198" y="278.3" font-size="6.6" text-anchor="start" fill="#7B2CD9" font-weight="normal">projection: use 24.5</text><text x="180" y="303.1" font-size="8.8" text-anchor="middle" fill="#666666" font-weight="normal">Three axes at 120 degrees in space become two lines at 30 degrees</text><text x="180" y="316.1" font-size="8.8" text-anchor="middle" fill="#666666" font-weight="normal">and one straight up - all three equally foreshortened.</text></svg>