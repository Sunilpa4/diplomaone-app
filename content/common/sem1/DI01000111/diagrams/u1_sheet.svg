<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 276" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="276" fill="#ffffff"/><text x="180" y="25.3" font-size="12.4" text-anchor="middle" fill="#222" font-weight="bold">The sheet first, the drawing after</text><text x="180" y="42.3" font-size="9.4" text-anchor="middle" fill="#666" font-weight="normal">A2, 420 x 594 mm, landscape</text><rect x="22" y="54" width="210" height="152" fill="none" stroke="#222" stroke-width="1.1"/><rect x="36" y="59" width="191" height="142" fill="none" stroke="#1565C0" stroke-width="1.0"/><rect x="27" y="59" width="9" height="142" fill="#1565C0" fill-opacity="0.10" stroke="none"/><rect x="153" y="171" width="74" height="30" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.2"/><path d="M153 181L227 181" fill="none" stroke="#2E7D32" stroke-width="0.8" stroke-linecap="round"/><path d="M153 191L227 191" fill="none" stroke="#2E7D32" stroke-width="0.8" stroke-linecap="round"/><text x="190.0" y="180.2" font-size="6.4" text-anchor="middle" fill="#2E7D32" font-weight="bold">TITLE</text><text x="190.0" y="190.0" font-size="5.8" text-anchor="middle" fill="#222" font-weight="normal">name / roll no</text><text x="190.0" y="200.0" font-size="5.8" text-anchor="middle" fill="#222" font-weight="normal">scale / sheet</text><path d="M24 56L248 62" fill="none" stroke="#9AA3AD" stroke-width="0.7" stroke-linecap="round"/><path d="M26.5 130.0L248 96" fill="none" stroke="#9AA3AD" stroke-width="0.7" stroke-linecap="round"/><path d="M157 175L248 150" fill="none" stroke="#9AA3AD" stroke-width="0.7" stroke-linecap="round"/><text x="250" y="62.6" font-size="7.4" text-anchor="start" fill="#666" font-weight="normal">trimming edge</text><text x="250" y="96.6" font-size="7.4" text-anchor="start" fill="#1565C0" font-weight="normal">filing margin 20 mm</text><text x="250" y="108.6" font-size="7.4" text-anchor="start" fill="#1565C0" font-weight="normal">border 10 mm</text><text x="250" y="150.6" font-size="7.4" text-anchor="start" fill="#2E7D32" font-weight="normal">title block 65 x 30 mm</text><text x="250" y="162.6" font-size="7.4" text-anchor="start" fill="#666" font-weight="normal">bottom right corner</text><rect x="8" y="216" width="344" height="26" rx="5" fill="#F4F6F8" stroke="#9AA3AD" stroke-width="0.9"/><text x="180" y="230.6" font-size="7.4" text-anchor="middle" fill="#222" font-weight="normal">2H construction  |  H final outline  |  HB lettering</text><text x="180" y="240.4" font-size="7.0" text-anchor="middle" fill="#666" font-weight="normal">3 mm dimension figures, 5 mm entries, 7 mm title</text><text x="180" y="259.1" font-size="8.8" text-anchor="middle" fill="#666" font-weight="normal">The left margin is punched for filing - nothing is drawn in it.</text><text x="180" y="272.1" font-size="8.8" text-anchor="middle" fill="#666" font-weight="normal">Check the diagonals of the sheet before taping: a skewed sheet stays skewed.</text></svg>