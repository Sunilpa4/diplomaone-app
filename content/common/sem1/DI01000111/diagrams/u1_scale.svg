<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 190" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="190" fill="#ffffff"/><text x="180" y="25.3" font-size="12.4" text-anchor="middle" fill="#222" font-weight="bold">Six metres on 120 mm of paper</text><text x="180" y="42.3" font-size="9.4" text-anchor="middle" fill="#666" font-weight="normal">RF = 1 : 50, reads metres and decimetres</text><rect x="30.0" y="112" width="264.0" height="14" fill="#FFFFFF" stroke="#222" stroke-width="1.1"/><path d="M30.0 112L30.0 126" fill="none" stroke="#222" stroke-width="0.9" stroke-linecap="round"/><path d="M74.0 112L74.0 126" fill="none" stroke="#222" stroke-width="0.9" stroke-linecap="round"/><path d="M118.0 112L118.0 126" fill="none" stroke="#222" stroke-width="0.9" stroke-linecap="round"/><path d="M162.0 112L162.0 126" fill="none" stroke="#222" stroke-width="0.9" stroke-linecap="round"/><path d="M206.0 112L206.0 126" fill="none" stroke="#222" stroke-width="0.9" stroke-linecap="round"/><path d="M250.0 112L250.0 126" fill="none" stroke="#222" stroke-width="0.9" stroke-linecap="round"/><path d="M294.0 112L294.0 126" fill="none" stroke="#222" stroke-width="0.9" stroke-linecap="round"/><path d="M69.6 112L69.6 126" fill="none" stroke="#222" stroke-width="0.6" stroke-linecap="round"/><path d="M65.2 112L65.2 126" fill="none" stroke="#222" stroke-width="0.6" stroke-linecap="round"/><path d="M60.8 112L60.8 126" fill="none" stroke="#222" stroke-width="0.6" stroke-linecap="round"/><path d="M56.4 112L56.4 126" fill="none" stroke="#222" stroke-width="0.6" stroke-linecap="round"/><path d="M52.0 112L52.0 126" fill="none" stroke="#222" stroke-width="0.6" stroke-linecap="round"/><path d="M47.6 112L47.6 126" fill="none" stroke="#222" stroke-width="0.6" stroke-linecap="round"/><path d="M43.2 112L43.2 126" fill="none" stroke="#222" stroke-width="0.6" stroke-linecap="round"/><path d="M38.8 112L38.8 126" fill="none" stroke="#222" stroke-width="0.6" stroke-linecap="round"/><path d="M34.4 112L34.4 126" fill="none" stroke="#222" stroke-width="0.6" stroke-linecap="round"/><text x="74.0" y="108.7" font-size="7.6" text-anchor="middle" fill="#222" font-weight="bold">0</text><text x="118.0" y="108.7" font-size="7.6" text-anchor="middle" fill="#222" font-weight="bold">1</text><text x="162.0" y="108.7" font-size="7.6" text-anchor="middle" fill="#222" font-weight="bold">2</text><text x="206.0" y="108.7" font-size="7.6" text-anchor="middle" fill="#222" font-weight="bold">3</text><text x="250.0" y="108.7" font-size="7.6" text-anchor="middle" fill="#222" font-weight="bold">4</text><text x="294.0" y="108.7" font-size="7.6" text-anchor="middle" fill="#222" font-weight="bold">5</text><text x="74.0" y="141.7" font-size="7.6" text-anchor="middle" fill="#BD2543" font-weight="bold">0</text><text x="52.0" y="141.1" font-size="6.0" text-anchor="middle" fill="#666" font-weight="normal">0.5</text><text x="32.0" y="141.0" font-size="5.8" text-anchor="start" fill="#666" font-weight="normal">1.0</text><text x="188.4" y="99.4" font-size="6.8" text-anchor="middle" fill="#666" font-weight="normal">metres</text><text x="52.0" y="153.3" font-size="6.6" text-anchor="middle" fill="#666" font-weight="normal">ten parts of 2 mm = 0.1 m</text><path d="M43.2 78L206.0 78" fill="none" stroke="#BD2543" stroke-width="0.9" stroke-linecap="round"/><path d="M201.0 76.4L206.0 78.0L201.0 79.6Z" fill="#BD2543"/><path d="M43.2 74L43.2 82" fill="none" stroke="#BD2543" stroke-width="0.8" stroke-linecap="round"/><path d="M206.0 74L206.0 82" fill="none" stroke="#BD2543" stroke-width="0.8" stroke-linecap="round"/><text x="124.6" y="74.6" font-size="7.4" text-anchor="middle" fill="#BD2543" font-weight="bold">3.7 m = 74 mm</text><rect x="8" y="52" width="344" height="24" rx="5" fill="#F4F6F8" stroke="#9AA3AD" stroke-width="0.9"/><text x="180" y="64.7" font-size="7.6" text-anchor="middle" fill="#222" font-weight="bold">length of scale = (1/50) x 6000 mm = 120 mm</text><text x="180" y="73.5" font-size="7.0" text-anchor="middle" fill="#666" font-weight="normal">six parts of 20 mm = 1 m; the left part in ten of 2 mm = 1 dm</text><text x="180" y="171.1" font-size="8.8" text-anchor="middle" fill="#666" font-weight="normal">A plain scale reads two units, because a 2 mm division is the finest that can be</text><text x="180" y="184.1" font-size="8.8" text-anchor="middle" fill="#666" font-weight="normal">drawn and read. A diagonal scale splits that 2 mm again and reads a third unit.</text></svg>