<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 244" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="244" fill="#ffffff"/><text x="180" y="25.3" font-size="12.4" text-anchor="middle" fill="#222" font-weight="bold">Two short cuts worth knowing</text><text x="180" y="42.3" font-size="9.4" text-anchor="middle" fill="#666" font-weight="normal">hexagon R = side, octagon 0.414 a</text><circle cx="92.0" cy="138.0" r="56.0" fill="none" stroke="#9AA3AD" stroke-width="1.0"/><path d="M84.0 138.0L100.0 138.0" fill="none" stroke="#9AA3AD" stroke-width="0.8" stroke-linecap="round"/><path d="M92.0 74.0L92.0 202.0" fill="none" stroke="#9AA3AD" stroke-width="0.8" stroke-linecap="round"/><path d="M148.0 138.0L120.0 89.5L64.0 89.5L36.0 138.0L64.0 186.5L120.0 186.5Z" fill="none" stroke="#2E7D32" stroke-width="2.0"/><path d="M92.0 138.0L148.0 138.0" fill="none" stroke="#2E7D32" stroke-width="0.9" stroke-linecap="round"/><path d="M143.0 136.4L148.0 138.0L143.0 139.6Z" fill="#2E7D32"/><text x="124.0" y="144.7" font-size="7.6" text-anchor="middle" fill="#2E7D32" font-weight="bold">R</text><path d="M120.0 89.50257738807144L64.00000000000001 89.50257738807143" fill="none" stroke="#B66A00" stroke-width="0.9" stroke-linecap="round"/><path d="M69.0 91.1L64.0 89.5L69.0 87.9Z" fill="#B66A00"/><text x="122.0" y="84.0" font-size="7.0" text-anchor="end" fill="#B66A00" font-weight="normal">side = R</text><text x="92.0" y="64.6" font-size="7.4" text-anchor="middle" fill="#2E7D32" font-weight="bold">hexagon: step R six times</text><rect x="216.0" y="88.0" width="100.0" height="100.0" fill="none" stroke="#9AA3AD" stroke-width="1.0"/><path d="M216.0 88.0L316.0 188.0" fill="none" stroke="#9AA3AD" stroke-width="0.7" stroke-linecap="round" stroke-dasharray="4 3"/><path d="M316.0 88.0L216.0 188.0" fill="none" stroke="#9AA3AD" stroke-width="0.7" stroke-linecap="round" stroke-dasharray="4 3"/><circle cx="266.0" cy="138.0" r="50.0" fill="none" stroke="#9AA3AD" stroke-width="0.8" stroke-dasharray="3 3"/><path d="M245.3 88.0L286.7 88.0L316.0 117.3L316.0 158.7L286.7 188.0L245.3 188.0L216.0 158.7L216.0 117.3Z" fill="none" stroke="#7B2CD9" stroke-width="2.0"/><text x="266.0" y="203.4" font-size="7.0" text-anchor="middle" fill="#7B2CD9" font-weight="bold">side = 0.414 a</text><text x="266.0" y="64.6" font-size="7.4" text-anchor="middle" fill="#7B2CD9" font-weight="bold">octagon in a square</text><text x="180" y="227.1" font-size="8.8" text-anchor="middle" fill="#666" font-weight="normal">60 degrees is a set-square edge, and the octagon corner is trimmed by 0.293 a</text><text x="180" y="240.1" font-size="8.8" text-anchor="middle" fill="#666" font-weight="normal">on each side, so the side left is 0.414 a. Both close if nothing is re-set.</text></svg>