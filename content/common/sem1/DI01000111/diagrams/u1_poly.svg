<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 296" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="296" fill="#ffffff"/><text x="180" y="25.3" font-size="12.4" text-anchor="middle" fill="#222" font-weight="bold">Any polygon, one construction</text><text x="180" y="42.3" font-size="9.4" text-anchor="middle" fill="#666" font-weight="normal">pentagon in a circle of radius R</text><circle cx="180.0" cy="152.0" r="70.0" fill="none" stroke="#9AA3AD" stroke-width="1.0"/><path d="M172.0 152.0L188.0 152.0" fill="none" stroke="#9AA3AD" stroke-width="0.8" stroke-linecap="round"/><path d="M104.0 152.0L256.0 152.0" fill="none" stroke="#9AA3AD" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="1 3"/><path d="M180.0 74.0L180.0 230.0" fill="none" stroke="#9AA3AD" stroke-width="1.0" stroke-linecap="round"/><path d="M175.0 110.0L185.0 110.0" fill="none" stroke="#1565C0" stroke-width="1.2" stroke-linecap="round"/><path d="M175.0 138.0L185.0 138.0" fill="none" stroke="#1565C0" stroke-width="1.2" stroke-linecap="round"/><path d="M175.0 166.0L185.0 166.0" fill="none" stroke="#1565C0" stroke-width="1.2" stroke-linecap="round"/><path d="M175.0 194.0L185.0 194.0" fill="none" stroke="#1565C0" stroke-width="1.2" stroke-linecap="round"/><path d="M58.8 152.0 A140.0 140.0 0 0 0 301.2 152.0" fill="none" stroke="#B66A00" stroke-width="0.9" stroke-dasharray="5 3"/><circle cx="58.756443470178596" cy="152.0" r="2.2" fill="#B66A00"/><circle cx="301.2435565298214" cy="152.0" r="2.2" fill="#B66A00"/><text x="50.756443470178596" y="157.7" font-size="7.6" text-anchor="end" fill="#B66A00" font-weight="bold">P</text><text x="309.2435565298214" y="157.7" font-size="7.6" text-anchor="start" fill="#B66A00" font-weight="bold">Q</text><path d="M58.756443470178596 152.0L258.0 132.0" fill="none" stroke="#BD2543" stroke-width="0.9" stroke-linecap="round"/><path d="M301.2435565298214 152.0L102.0 132.0" fill="none" stroke="#BD2543" stroke-width="0.9" stroke-linecap="round"/><circle cx="180.0" cy="138.0" r="2.4" fill="#BD2543"/><text x="172.0" y="137.5" font-size="7.2" text-anchor="end" fill="#BD2543" font-weight="bold">2</text><path d="M180.0 82.0L246.6 130.4L221.1 208.6L138.9 208.6L113.4 130.4Z" fill="none" stroke="#7B2CD9" stroke-width="2.0"/><text x="180.0" y="76.7" font-size="7.6" text-anchor="middle" fill="#7B2CD9" font-weight="bold">A</text><text x="229.14496766047313" y="221.0" font-size="6.8" text-anchor="start" fill="#7B2CD9" font-weight="normal">step CD five times</text><text x="180" y="248.3" font-size="6.6" text-anchor="middle" fill="#1565C0" font-weight="normal">1 circle and vertical diameter  &gt;  2 divide it into n parts  &gt;  3 arcs from A, radius = diameter</text><text x="180" y="260.3" font-size="6.6" text-anchor="middle" fill="#1565C0" font-weight="normal">4 rays P and Q through point 2 give C and D  &gt;  5 step the chord CD round the circle n times</text><text x="180" y="279.1" font-size="8.8" text-anchor="middle" fill="#666" font-weight="normal">The chord found is one side: it closes after exactly n steps round the circle.</text><text x="180" y="292.1" font-size="8.8" text-anchor="middle" fill="#666" font-weight="normal">For a pentagon of 40 mm side the circle radius is 0.8507 x 40 = 34 mm.</text></svg>