<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 314" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="314" fill="#ffffff"/><text x="180" y="25.3" font-size="12.4" text-anchor="middle" fill="#222222" font-weight="bold">Where each view goes in first angle</text><rect x="60.0" y="74.0" width="96.0" height="58.0" fill="#1565C0" fill-opacity="0.12" stroke="#1565C0" stroke-width="1.8"/><text x="108.0" y="108.9" font-size="8.4" text-anchor="middle" fill="#1565C0" font-weight="bold">FRONT</text><text x="108.0" y="120.3" font-size="6.6" text-anchor="middle" fill="#666666" font-weight="normal">elevation</text><rect x="60.0" y="158.0" width="96.0" height="46" fill="#7B2CD9" fill-opacity="0.12" stroke="#7B2CD9" stroke-width="1.8"/><text x="108.0" y="187.8" font-size="8.0" text-anchor="middle" fill="#7B2CD9" font-weight="bold">TOP  (plan)</text><rect x="182.0" y="74.0" width="52" height="58.0" fill="#2E7D32" fill-opacity="0.12" stroke="#2E7D32" stroke-width="1.8"/><text x="208.0" y="103.8" font-size="8.0" text-anchor="middle" fill="#2E7D32" font-weight="bold">SIDE</text><text x="208.0" y="115.2" font-size="6.4" text-anchor="middle" fill="#666666" font-weight="normal">from the left</text><path d="M108.0 136.0L108.0 154.0" fill="none" stroke="#7B2CD9" stroke-width="1.1" stroke-linecap="round"/><path d="M109.6 149.0L108.0 154.0L106.4 149.0Z" fill="#7B2CD9"/><path d="M160.0 103.0L178.0 103.0" fill="none" stroke="#2E7D32" stroke-width="1.1" stroke-linecap="round"/><path d="M173.0 101.4L178.0 103.0L173.0 104.6Z" fill="#2E7D32"/><text x="114.0" y="150.2" font-size="6.4" text-anchor="start" fill="#7B2CD9" font-weight="normal">swings down</text><text x="168.0" y="99.2" font-size="6.2" text-anchor="start" fill="#2E7D32" font-weight="normal">turns</text><text x="180" y="248.8" font-size="8.0" text-anchor="middle" fill="#666666" font-weight="normal">The side view is placed on the right, the top view below: no view ever</text><text x="180" y="261.8" font-size="8.0" text-anchor="middle" fill="#666666" font-weight="normal">overlaps another, and every corner lines up on a projector.</text><rect x="8" y="272" width="344" height="34" rx="5" fill="#F4F6F8" stroke="#9AA3AD" stroke-width="0.9"/><text x="180" y="289.5" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">First angle: view placed beyond the object.  Third angle: view placed</text><text x="180" y="301.5" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">between the observer and the object, so the top view goes above.</text></svg>