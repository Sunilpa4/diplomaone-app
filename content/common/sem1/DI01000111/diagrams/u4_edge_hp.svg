<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 324" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="324" fill="#ffffff"/><text x="180" y="25.3" font-size="12.4" text-anchor="middle" fill="#222222" font-weight="bold">Perpendicular to HP, inclined to VP</text><text x="180" y="42.3" font-size="9.4" text-anchor="middle" fill="#666666" font-weight="normal">hexagon 30 mm side, 45 deg to VP</text><path d="M20.0 152.0L340.0 152.0" fill="none" stroke="#222222" stroke-width="1.1" stroke-linecap="round"/><text x="338" y="149.5" font-size="7.2" text-anchor="end" fill="#666666" font-weight="normal">X Y</text><path d="M198.5 104.0L185.3 71.5L158.7 71.5L145.5 104.0L158.7 136.5L185.3 136.5Z" fill="none" stroke="#1565C0" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round"/><circle cx="198.5" cy="104.0" r="2.0" fill="#1565C0"/><circle cx="185.3" cy="71.5" r="2.0" fill="#1565C0"/><circle cx="158.7" cy="71.5" r="2.0" fill="#1565C0"/><circle cx="145.5" cy="104.0" r="2.0" fill="#1565C0"/><circle cx="158.7" cy="136.5" r="2.0" fill="#1565C0"/><circle cx="185.3" cy="136.5" r="2.0" fill="#1565C0"/><text x="172.0" y="60.8" font-size="6.6" text-anchor="middle" fill="#1565C0" font-weight="normal">apparent shape</text><text x="172.0" y="49.7" font-size="6.2" text-anchor="middle" fill="#666666" font-weight="normal">60 cos 45 = 42.4 across</text><path d="M145.5 171.5L198.5 224.5" fill="none" stroke="#BD2543" stroke-width="2.4" stroke-linecap="round"/><circle cx="198.5" cy="224.5" r="2.2" fill="#BD2543"/><path d="M198.5 104.0L198.5 224.5" fill="none" stroke="#9AA3AD" stroke-width="0.7" stroke-linecap="round" stroke-dasharray="4 3"/><circle cx="185.3" cy="211.3" r="2.2" fill="#BD2543"/><path d="M185.3 71.5L185.3 211.3" fill="none" stroke="#9AA3AD" stroke-width="0.7" stroke-linecap="round" stroke-dasharray="4 3"/><circle cx="158.7" cy="184.7" r="2.2" fill="#BD2543"/><path d="M158.7 71.5L158.7 184.7" fill="none" stroke="#9AA3AD" stroke-width="0.7" stroke-linecap="round" stroke-dasharray="4 3"/><circle cx="145.5" cy="171.5" r="2.2" fill="#BD2543"/><path d="M145.5 104.0L145.5 171.5" fill="none" stroke="#9AA3AD" stroke-width="0.7" stroke-linecap="round" stroke-dasharray="4 3"/><circle cx="158.7" cy="184.7" r="2.2" fill="#BD2543"/><path d="M158.7 136.5L158.7 184.7" fill="none" stroke="#9AA3AD" stroke-width="0.7" stroke-linecap="round" stroke-dasharray="4 3"/><circle cx="185.3" cy="211.3" r="2.2" fill="#BD2543"/><path d="M185.3 136.5L185.3 211.3" fill="none" stroke="#9AA3AD" stroke-width="0.7" stroke-linecap="round" stroke-dasharray="4 3"/><text x="142.0" y="178.3" font-size="6.6" text-anchor="end" fill="#BD2543" font-weight="normal">edge at 45 deg</text><text x="142.0" y="188.2" font-size="6.4" text-anchor="end" fill="#666666" font-weight="normal">60 mm long in plan</text><text x="180" y="303.1" font-size="8.8" text-anchor="middle" fill="#666666" font-weight="normal">Now HP looks along the plane, so the plan is the edge. The elevation is</text><text x="180" y="316.1" font-size="8.8" text-anchor="middle" fill="#666666" font-weight="normal">the apparent hexagon: 42.4 mm across, 52 mm from flat to flat.</text></svg>