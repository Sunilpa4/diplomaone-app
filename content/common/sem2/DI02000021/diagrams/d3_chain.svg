<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 372" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="372" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Chain rule: one link at a time</text><text x="180" y="49.6" font-size="10.4" text-anchor="middle" fill="#666" font-weight="normal">y = (3x + 2)⁵ is a function of a function</text><rect x="15.0" y="79.0" width="62" height="34" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="46" y="100.0" font-size="11.4" text-anchor="middle" fill="#222" font-weight="normal">x</text><rect x="113.0" y="79.0" width="150" height="34" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="188" y="99.8" font-size="10.8" text-anchor="middle" fill="#222" font-weight="normal">u = 3x + 2</text><rect x="285.0" y="79.0" width="62" height="34" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="316" y="99.8" font-size="10.8" text-anchor="middle" fill="#222" font-weight="normal">y = u⁵</text><path d="M82 96 L108 96" fill="none" stroke="#666" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="108.0,96.0 101.0,92.5 101.0,99.5" fill="#666"/><path d="M268 96 L280 96" fill="none" stroke="#666" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="280.0,96.0 273.0,92.5 273.0,99.5" fill="#666"/><text x="188" y="135.2" font-size="9" text-anchor="middle" fill="#B66A00" font-weight="normal">inside</text><text x="316" y="135.2" font-size="9" text-anchor="middle" fill="#2E7D32" font-weight="normal">outside</text><text x="180" y="166.2" font-size="12" text-anchor="middle" fill="#7B2CD9" font-weight="bold">dy/dx = dy/du  ×  du/dx</text><rect x="15.0" y="184.0" width="330" height="24" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="199.6" font-size="10.4" text-anchor="middle" fill="#222" font-weight="normal">dy/du = 5u⁴    and    du/dx = 3</text><rect x="15.0" y="223.0" width="330" height="26" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="239.7" font-size="10.6" text-anchor="middle" fill="#222" font-weight="normal">dy/dx = 5u⁴ × 3 = 15(3x + 2)⁴</text><text x="180" y="275.5" font-size="10" text-anchor="middle" fill="#666" font-weight="normal">Put u back before you finish.</text><rect x="15.0" y="294.0" width="330" height="24" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="309.6" font-size="10.2" text-anchor="middle" fill="#222" font-weight="normal">log(sin x) → (1/sin x)·cos x = cot x</text><text x="180" y="343.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Differentiate the outside, then multiply by the inside.</text><text x="180" y="359.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Each extra layer adds one more factor.</text></svg>