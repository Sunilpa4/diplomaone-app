<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 382" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="382" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">The 2x2 inverse in three steps</text><text x="180" y="49.6" font-size="10.4" text-anchor="middle" fill="#666" font-weight="normal">A⁻¹ exists only when |A| ≠ 0</text><rect x="15.0" y="61.0" width="330" height="26" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="77.6" font-size="10.4" text-anchor="middle" fill="#222" font-weight="normal">step 1:  |A| = ad − bc  (it must not be 0)</text><rect x="15.0" y="99.0" width="330" height="26" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="115.6" font-size="10.4" text-anchor="middle" fill="#222" font-weight="normal">step 2:  swap a and d, negate b and c</text><text x="80" y="171.8" font-size="10.8" text-anchor="end" fill="#7B2CD9" font-weight="normal">A =</text><path d="M88 138 h-4 V194 h4" fill="none" stroke="#7B2CD9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M168 138 h4 V194 h-4" fill="none" stroke="#7B2CD9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="97.0" y="143.0" width="30.0" height="22.0" rx="3" fill="#FDECF0"/><text x="112.0" y="162.1" font-size="11.4" text-anchor="middle" fill="#7B1030" font-weight="bold">a</text><text x="144.0" y="162.1" font-size="11.4" text-anchor="middle" fill="#7B2CD9" font-weight="normal">b</text><text x="112.0" y="186.1" font-size="11.4" text-anchor="middle" fill="#7B2CD9" font-weight="normal">c</text><rect x="129.0" y="167.0" width="30.0" height="22.0" rx="3" fill="#FDECF0"/><text x="144.0" y="186.1" font-size="11.4" text-anchor="middle" fill="#7B1030" font-weight="bold">d</text><path d="M176 166 L198 166" fill="none" stroke="#666" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="198.0,166.0 191.0,162.5 191.0,169.5" fill="#666"/><text x="232" y="133.6" font-size="10.4" text-anchor="middle" fill="#2E7D32" font-weight="bold">adj A</text><path d="M206 138 h-4 V194 h4" fill="none" stroke="#2E7D32" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M286 138 h4 V194 h-4" fill="none" stroke="#2E7D32" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="230.0" y="162.1" font-size="11.4" text-anchor="middle" fill="#2E7D32" font-weight="normal">d</text><text x="262.0" y="162.1" font-size="11.4" text-anchor="middle" fill="#2E7D32" font-weight="normal">−b</text><text x="230.0" y="186.1" font-size="11.4" text-anchor="middle" fill="#2E7D32" font-weight="normal">−c</text><text x="262.0" y="186.1" font-size="11.4" text-anchor="middle" fill="#2E7D32" font-weight="normal">a</text><rect x="15.0" y="201.0" width="330" height="26" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="217.6" font-size="10.4" text-anchor="middle" fill="#222" font-weight="normal">step 3: divide the adjoint by the determinant</text><rect x="15.0" y="239.0" width="330" height="26" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="255.6" font-size="10.4" text-anchor="middle" fill="#222" font-weight="normal">A⁻¹ = adj A ÷ |A|  =  1/(ad − bc) · [d −b; −c a]</text><rect x="15.0" y="281.0" width="330" height="26" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="297.6" font-size="10.2" text-anchor="middle" fill="#222" font-weight="normal">A = [3 1; 5 2]  ⇒  |A| = 1,  A⁻¹ = [2 −1; −5 3]</text><rect x="15.0" y="319.0" width="330" height="26" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="180" y="335.6" font-size="10.4" text-anchor="middle" fill="#222" font-weight="normal">|A| = 0  ⇒  singular, so A⁻¹ does not exist</text><text x="180" y="365.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Always check A · A⁻¹ = I before you trust the answer.</text></svg>