<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 368" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="368" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Logarithmic differentiation for xˣ</text><text x="180" y="49.6" font-size="10.4" text-anchor="middle" fill="#666" font-weight="normal">a variable in the power needs a logarithm first</text><text x="180" y="82.5" font-size="13" text-anchor="middle" fill="#7B2CD9" font-weight="bold">y = xˣ</text><rect x="15.0" y="100.0" width="330" height="24" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="115.6" font-size="10.2" text-anchor="middle" fill="#222" font-weight="normal">1. take log of both sides:  log y = x log x</text><rect x="15.0" y="138.0" width="330" height="24" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="153.6" font-size="10.2" text-anchor="middle" fill="#222" font-weight="normal">2. differentiate:  (1/y)·dy/dx = x·(1/x) + log x·1</text><rect x="15.0" y="176.0" width="330" height="24" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="191.6" font-size="10.2" text-anchor="middle" fill="#222" font-weight="normal">3. tidy the right side: 1 + log x</text><rect x="15.0" y="215.0" width="330" height="26" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="231.6" font-size="10.4" text-anchor="middle" fill="#222" font-weight="normal">dy/dx = y (1 + log x) = xˣ (1 + log x)</text><text x="180" y="267.5" font-size="10" text-anchor="middle" fill="#666" font-weight="normal">Use it when the power also contains x</text><rect x="15.0" y="288.0" width="330" height="24" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="180" y="303.5" font-size="10.0" text-anchor="middle" fill="#222" font-weight="normal">xˣ is not xⁿ and not aˣ - it needs this method</text><text x="180" y="337.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Take the log, differentiate both sides, then multiply by y.</text><text x="180" y="353.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">The same trick handles (1 + x)ˣ and x^(sin x).</text></svg>