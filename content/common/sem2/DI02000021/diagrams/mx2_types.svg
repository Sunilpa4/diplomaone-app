<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 388" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="388" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Six matrix types to recognise</text><text x="180" y="49.6" font-size="10.4" text-anchor="middle" fill="#666" font-weight="normal">name the pattern, not the numbers</text><text x="88" y="95.4" font-size="9.6" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Identity I</text><path d="M60.0 100 h-4 V148 h4" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M116.0 100 h4 V148 h-4" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="78.0" y="121.1" font-size="10" text-anchor="middle" fill="#333" font-weight="normal">1</text><text x="98.0" y="121.1" font-size="10" text-anchor="middle" fill="#333" font-weight="normal">0</text><text x="78.0" y="141.1" font-size="10" text-anchor="middle" fill="#333" font-weight="normal">0</text><text x="98.0" y="141.1" font-size="10" text-anchor="middle" fill="#333" font-weight="normal">1</text><text x="88" y="169.1" font-size="8.8" text-anchor="middle" fill="#666" font-weight="normal">diagonal ones</text><text x="188" y="95.4" font-size="9.6" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Diagonal</text><path d="M160.0 100 h-4 V148 h4" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M216.0 100 h4 V148 h-4" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="178.0" y="121.1" font-size="10" text-anchor="middle" fill="#333" font-weight="normal">3</text><text x="198.0" y="121.1" font-size="10" text-anchor="middle" fill="#333" font-weight="normal">0</text><text x="178.0" y="141.1" font-size="10" text-anchor="middle" fill="#333" font-weight="normal">0</text><text x="198.0" y="141.1" font-size="10" text-anchor="middle" fill="#333" font-weight="normal">5</text><text x="188" y="169.1" font-size="8.8" text-anchor="middle" fill="#666" font-weight="normal">diagonal only</text><text x="288" y="95.4" font-size="9.6" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Zero O</text><path d="M260.0 100 h-4 V148 h4" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M316.0 100 h4 V148 h-4" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="278.0" y="121.1" font-size="10" text-anchor="middle" fill="#333" font-weight="normal">0</text><text x="298.0" y="121.1" font-size="10" text-anchor="middle" fill="#333" font-weight="normal">0</text><text x="278.0" y="141.1" font-size="10" text-anchor="middle" fill="#333" font-weight="normal">0</text><text x="298.0" y="141.1" font-size="10" text-anchor="middle" fill="#333" font-weight="normal">0</text><text x="288" y="169.1" font-size="8.8" text-anchor="middle" fill="#666" font-weight="normal">all entries 0</text><text x="88" y="213.4" font-size="9.6" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Triangular</text><path d="M60.0 218 h-4 V266 h4" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M116.0 218 h4 V266 h-4" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="78.0" y="239.1" font-size="10" text-anchor="middle" fill="#333" font-weight="normal">2</text><text x="98.0" y="239.1" font-size="10" text-anchor="middle" fill="#333" font-weight="normal">7</text><text x="78.0" y="259.1" font-size="10" text-anchor="middle" fill="#333" font-weight="normal">0</text><text x="98.0" y="259.1" font-size="10" text-anchor="middle" fill="#333" font-weight="normal">4</text><text x="88" y="287.1" font-size="8.8" text-anchor="middle" fill="#666" font-weight="normal">zeros on one side</text><text x="188" y="213.4" font-size="9.6" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Symmetric</text><path d="M160.0 218 h-4 V266 h4" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M216.0 218 h4 V266 h-4" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="178.0" y="239.1" font-size="10" text-anchor="middle" fill="#333" font-weight="normal">1</text><text x="198.0" y="239.1" font-size="10" text-anchor="middle" fill="#333" font-weight="normal">3</text><text x="178.0" y="259.1" font-size="10" text-anchor="middle" fill="#333" font-weight="normal">3</text><text x="198.0" y="259.1" font-size="10" text-anchor="middle" fill="#333" font-weight="normal">5</text><text x="188" y="287.1" font-size="8.8" text-anchor="middle" fill="#666" font-weight="normal">Aᵀ = A</text><text x="288" y="213.4" font-size="9.6" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Row / column</text><path d="M260.0 228 h-4 V256 h4" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M316.0 228 h4 V256 h-4" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="278.0" y="249.1" font-size="10" text-anchor="middle" fill="#333" font-weight="normal">4</text><text x="298.0" y="249.1" font-size="10" text-anchor="middle" fill="#333" font-weight="normal">2</text><text x="288" y="287.1" font-size="8.8" text-anchor="middle" fill="#666" font-weight="normal">one line of entries</text><rect x="12.0" y="311.0" width="336" height="26" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="327.6" font-size="10.4" text-anchor="middle" fill="#222" font-weight="normal">square = rows equal columns;  singular = |A| = 0</text><text x="180" y="359.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Diagonal, scalar and identity matrices are square.</text><text x="180" y="375.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">A triangular matrix is square too - one side is all zeros.</text></svg>