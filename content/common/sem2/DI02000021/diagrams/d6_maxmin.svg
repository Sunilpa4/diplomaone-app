<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 394" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="394" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Where the curve turns</text><text x="180" y="49.6" font-size="10.4" text-anchor="middle" fill="#666" font-weight="normal">y = x³ − 3x + 2 has a maximum and a minimum</text><path d="M28 262 H332" fill="none" stroke="#333" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M180 84 V280" fill="none" stroke="#333" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M76.0 262.0 L78.6 248.1 L81.2 235.1 L83.8 223.0 L86.4 211.8 L89.0 201.5 L91.6 192.0 L94.2 183.3 L96.8 175.5 L99.4 168.4 L102.0 162.0 L104.6 156.4 L107.2 151.4 L109.8 147.1 L112.4 143.5 L115.0 140.5 L117.6 138.1 L120.2 136.3 L122.8 135.0 L125.4 134.2 L128.0 134.0 L130.6 134.2 L133.2 134.9 L135.8 136.1 L138.4 137.6 L141.0 139.5 L143.6 141.8 L146.2 144.4 L148.8 147.3 L151.4 150.5 L154.0 154.0 L156.6 157.7 L159.2 161.6 L161.8 165.8 L164.4 170.1 L167.0 174.5 L169.6 179.1 L172.2 183.7 L174.8 188.4 L177.4 193.2 L180.0 198.0 L182.6 202.8 L185.2 207.6 L187.8 212.3 L190.4 216.9 L193.0 221.5 L195.6 225.9 L198.2 230.2 L200.8 234.4 L203.4 238.3 L206.0 242.0 L208.6 245.5 L211.2 248.7 L213.8 251.6 L216.4 254.2 L219.0 256.5 L221.6 258.4 L224.2 259.9 L226.8 261.1 L229.4 261.8 L232.0 262.0 L234.6 261.8 L237.2 261.0 L239.8 259.7 L242.4 257.9 L245.0 255.5 L247.6 252.5 L250.2 248.9 L252.8 244.6 L255.4 239.6 L258.0 234.0 L260.6 227.6 L263.2 220.5 L265.8 212.7 L268.4 204.0 L271.0 194.5 L273.6 184.2 L276.2 173.0 L278.8 160.9 L281.4 147.9 L284.0 134.0 L286.6 119.1" fill="none" stroke="#1565C0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="128.0" cy="134.0" r="4.2" fill="#BD2543"/><circle cx="232.0" cy="262.0" r="4.2" fill="#2E7D32"/><text x="118" y="127.3" font-size="9.4" text-anchor="end" fill="#BD2543" font-weight="normal">maximum at x = −1</text><text x="242" y="285.3" font-size="9.4" text-anchor="start" fill="#2E7D32" font-weight="normal">minimum at x = 1</text><rect x="15.0" y="302.0" width="330" height="24" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="317.6" font-size="10.2" text-anchor="middle" fill="#222" font-weight="normal">stationary points come from f′(x) = 0</text><rect x="15.0" y="336.0" width="330" height="24" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="351.6" font-size="10.2" text-anchor="middle" fill="#222" font-weight="normal">f″ &lt; 0 → maximum,   f″ &gt; 0 → minimum</text><text x="180" y="381.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">A zero slope alone is not enough: the second derivative decides.</text></svg>