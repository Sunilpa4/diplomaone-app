<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 378" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="378" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">The three working rules</text><text x="180" y="49.6" font-size="10.4" text-anchor="middle" fill="#666" font-weight="normal">differentiate part by part, then combine</text><rect x="15.0" y="69.0" width="330" height="26" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="85.6" font-size="10.4" text-anchor="middle" fill="#222" font-weight="normal">sum / difference:   (u ± v)′ = u′ ± v′</text><rect x="15.0" y="111.0" width="330" height="26" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="127.6" font-size="10.4" text-anchor="middle" fill="#222" font-weight="normal">product:   (uv)′ = u′v + uv′</text><rect x="15.0" y="153.0" width="330" height="26" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="180" y="169.6" font-size="10.4" text-anchor="middle" fill="#222" font-weight="normal">quotient:   (u/v)′ = (u′v − uv′)/v²</text><text x="180" y="205.5" font-size="10" text-anchor="middle" fill="#666" font-weight="normal">u and v are both functions of x</text><text x="180" y="239.7" font-size="10.6" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Take the product rule apart</text><rect x="15.0" y="250.0" width="330" height="24" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="265.6" font-size="10.2" text-anchor="middle" fill="#222" font-weight="normal">y = x²(3x + 5)  →  u = x²,  v = 3x + 5</text><text x="180" y="299.6" font-size="10.4" text-anchor="middle" fill="#7B1030" font-weight="bold">u′v + uv′ = 2x(3x + 5) + x²(3) = 9x² + 10x</text><rect x="15.0" y="318.0" width="330" height="24" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="333.6" font-size="10.4" text-anchor="middle" fill="#222" font-weight="normal">power rule first:  (xⁿ)′ = n xⁿ⁻¹</text><text x="180" y="363.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Never multiply the derivatives: (uv)′ is not u′v′.</text></svg>