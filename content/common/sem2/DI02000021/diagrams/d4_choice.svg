<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 430" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="430" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Separable or linear?</text><text x="180" y="49.6" font-size="10.4" text-anchor="middle" fill="#666" font-weight="normal">test the shape of the right-hand side</text><rect x="13.0" y="69.0" width="334" height="26" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="85.6" font-size="10.2" text-anchor="middle" fill="#222" font-weight="normal">can you write it as (x part) × (y part)?</text><rect x="13.0" y="106.0" width="334" height="24" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="121.7" font-size="10.6" text-anchor="middle" fill="#222" font-weight="normal">yes  →  variable separable</text><rect x="13.0" y="145.0" width="334" height="26" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="161.6" font-size="10.2" text-anchor="middle" fill="#222" font-weight="normal">otherwise: is y only to the first power?</text><rect x="13.0" y="182.0" width="334" height="24" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="197.7" font-size="10.6" text-anchor="middle" fill="#222" font-weight="normal">yes  →  linear, use the IF</text><rect x="13.0" y="221.0" width="334" height="26" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="180" y="237.6" font-size="10.2" text-anchor="middle" fill="#222" font-weight="normal">no  →  not in this unit's syllabus</text><text x="180" y="271.6" font-size="10.4" text-anchor="middle" fill="#7B2CD9" font-weight="bold">spot them by example</text><rect x="13.0" y="284.0" width="334" height="24" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="299.4" font-size="9.8" text-anchor="middle" fill="#222" font-weight="normal">dy/dx = x y²    →    separable</text><rect x="13.0" y="318.0" width="334" height="24" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="333.4" font-size="9.8" text-anchor="middle" fill="#222" font-weight="normal">dy/dx + 2y = eˣ    →    linear</text><rect x="13.0" y="352.0" width="334" height="24" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="367.4" font-size="9.8" text-anchor="middle" fill="#222" font-weight="normal">dy/dx = (x + 1)/y    →    separable</text><text x="180" y="403.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Always try to separate first - it is usually quicker.</text></svg>