<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 376" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="376" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Position, velocity, acceleration</text><text x="180" y="49.6" font-size="10.4" text-anchor="middle" fill="#666" font-weight="normal">s = t³ − 6t² + 8t  gives  v = s′  and  a = v′</text><rect x="15.0" y="72.0" width="330" height="28" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="89.7" font-size="10.6" text-anchor="middle" fill="#222" font-weight="normal">position:  s = t³ − 6t² + 8t</text><path d="M180 104 L180 130" fill="none" stroke="#666" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,130.0 183.5,123.0 176.5,123.0" fill="#666"/><text x="258" y="121.3" font-size="9.4" text-anchor="start" fill="#666" font-weight="normal">differentiate</text><rect x="15.0" y="134.0" width="330" height="28" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="151.7" font-size="10.6" text-anchor="middle" fill="#222" font-weight="normal">velocity:  v = ds/dt = 3t² − 12t + 8</text><path d="M180 166 L180 192" fill="none" stroke="#666" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,192.0 183.5,185.0 176.5,185.0" fill="#666"/><text x="258" y="183.3" font-size="9.4" text-anchor="start" fill="#666" font-weight="normal">differentiate again</text><rect x="15.0" y="196.0" width="330" height="28" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="213.7" font-size="10.6" text-anchor="middle" fill="#222" font-weight="normal">acceleration:  a = dv/dt = 6t − 12</text><rect x="12.0" y="249.0" width="336" height="26" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="265.6" font-size="10.2" text-anchor="middle" fill="#222" font-weight="normal">at t = 3:  v = 27 − 36 + 8 = −1,  a = 18 − 12 = 6</text><rect x="12.0" y="293.0" width="336" height="26" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="180" y="309.5" font-size="10.0" text-anchor="middle" fill="#222" font-weight="normal">v = 0 → at rest;  a &lt; 0 → slowing down</text><text x="180" y="343.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Differentiate position to get velocity, then again for acceleration.</text><text x="180" y="359.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Units: metres, metres per second, metres per second squared.</text></svg>