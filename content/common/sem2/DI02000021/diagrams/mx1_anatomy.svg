<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 348" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="348" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">A matrix is a block of numbers</text><text x="180" y="49.6" font-size="10.4" text-anchor="middle" fill="#666" font-weight="normal">order = rows × columns, and aᵢⱼ means row i, column j</text><path d="M112 92 h-4 V168 h4" fill="none" stroke="#7B2CD9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M260 92 h4 V168 h-4" fill="none" stroke="#7B2CD9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="142.0" y="121.7" font-size="12.2" text-anchor="middle" fill="#7B2CD9" font-weight="normal">a₁₁</text><text x="186.0" y="121.7" font-size="12.2" text-anchor="middle" fill="#7B2CD9" font-weight="normal">a₁₂</text><text x="230.0" y="121.7" font-size="12.2" text-anchor="middle" fill="#7B2CD9" font-weight="normal">a₁₃</text><text x="142.0" y="155.7" font-size="12.2" text-anchor="middle" fill="#7B2CD9" font-weight="normal">a₂₁</text><text x="186.0" y="155.7" font-size="12.2" text-anchor="middle" fill="#7B2CD9" font-weight="normal">a₂₂</text><rect x="209.0" y="131.0" width="42.0" height="32.0" rx="3" fill="#FDECF0"/><text x="230.0" y="155.7" font-size="12.2" text-anchor="middle" fill="#7B1030" font-weight="bold">a₂₃</text><text x="142.0" y="87.3" font-size="9.4" text-anchor="middle" fill="#1565C0" font-weight="normal">col 1</text><text x="186.0" y="87.3" font-size="9.4" text-anchor="middle" fill="#1565C0" font-weight="normal">col 2</text><text x="230.0" y="87.3" font-size="9.4" text-anchor="middle" fill="#1565C0" font-weight="normal">col 3</text><text x="104" y="120.3" font-size="9.4" text-anchor="end" fill="#1565C0" font-weight="normal">row 1</text><text x="104" y="154.3" font-size="9.4" text-anchor="end" fill="#1565C0" font-weight="normal">row 2</text><rect x="19.0" y="183.0" width="322" height="26" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="199.7" font-size="10.6" text-anchor="middle" fill="#222" font-weight="normal">2 rows and 3 columns  ⇒  order 2 × 3</text><text x="180" y="243.7" font-size="10.6" text-anchor="middle" fill="#7B1030" font-weight="bold">a₂₃ = row 2, column 3 (the red entry)</text><rect x="19.0" y="269.0" width="322" height="26" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="285.6" font-size="10.4" text-anchor="middle" fill="#222" font-weight="normal">a matrix is an array, not a single number</text><text x="180" y="319.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">A matrix has no value of its own - it is an arrangement.</text><text x="180" y="335.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Equality needs the same order and matching entries.</text></svg>