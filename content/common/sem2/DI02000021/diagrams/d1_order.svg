<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 378" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="378" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Order and degree of a DE</text><text x="180" y="49.6" font-size="10.4" text-anchor="middle" fill="#666" font-weight="normal">read the equation before you try to solve it</text><text x="180" y="82.5" font-size="13" text-anchor="middle" fill="#7B2CD9" font-weight="bold">d²y/dx²  +  3 (dy/dx)²  =  x</text><rect x="20.0" y="100.0" width="320" height="24" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="115.5" font-size="10.0" text-anchor="middle" fill="#222" font-weight="normal">order = 2 : the highest derivative that appears</text><rect x="20.0" y="134.0" width="320" height="24" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="149.5" font-size="10.0" text-anchor="middle" fill="#222" font-weight="normal">degree = 1 : the power of that highest derivative</text><rect x="20.0" y="168.0" width="320" height="24" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="183.5" font-size="10.0" text-anchor="middle" fill="#222" font-weight="normal">the (dy/dx)² does not change either of them</text><text x="180" y="215.6" font-size="10.4" text-anchor="middle" fill="#7B2CD9" font-weight="bold">quick check</text><rect x="20.0" y="228.0" width="320" height="24" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="180" y="243.4" font-size="9.8" text-anchor="middle" fill="#222" font-weight="normal">dy/dx + y = x    →    order 1, degree 1</text><rect x="20.0" y="262.0" width="320" height="24" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="180" y="277.4" font-size="9.8" text-anchor="middle" fill="#222" font-weight="normal">(dy/dx)³ + y = x²    →    order 1, degree 3</text><rect x="20.0" y="296.0" width="320" height="24" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="180" y="311.4" font-size="9.8" text-anchor="middle" fill="#222" font-weight="normal">d²y/dx² + y² = 0    →    order 2, degree 1</text><text x="180" y="347.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Order first, then degree.</text><text x="180" y="363.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Order counts derivatives; degree counts their powers.</text></svg>