<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 344" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="344" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Parts: split the product</text><text x="180" y="49.6" font-size="10.4" text-anchor="middle" fill="#666" font-weight="normal">∫ u dv = uv − ∫ v du</text><rect x="15.0" y="69.0" width="330" height="26" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="85.4" font-size="9.8" text-anchor="middle" fill="#222" font-weight="normal">pick u by LIATE: log, inverse trig, algebra, trig, exp</text><text x="180" y="119.7" font-size="10.6" text-anchor="middle" fill="#7B2CD9" font-weight="bold">worked example:  ∫ x eˣ dx</text><rect x="15.0" y="132.0" width="330" height="24" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="147.6" font-size="10.2" text-anchor="middle" fill="#222" font-weight="normal">u = x  →  du = dx</text><rect x="15.0" y="164.0" width="330" height="24" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="179.6" font-size="10.2" text-anchor="middle" fill="#222" font-weight="normal">dv = eˣ dx  →  v = eˣ</text><rect x="15.0" y="199.0" width="330" height="26" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="215.6" font-size="10.4" text-anchor="middle" fill="#222" font-weight="normal">= x eˣ − ∫ eˣ dx  =  x eˣ − eˣ + c</text><rect x="15.0" y="239.0" width="330" height="26" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="255.6" font-size="10.4" text-anchor="middle" fill="#222" font-weight="normal">= eˣ (x − 1) + c</text><rect x="15.0" y="280.0" width="330" height="24" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="295.5" font-size="10.0" text-anchor="middle" fill="#222" font-weight="normal">choose u so that du is simpler than u</text><text x="180" y="329.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Differentiate the answer to check: eˣ(x − 1) + eˣ = x eˣ.</text></svg>