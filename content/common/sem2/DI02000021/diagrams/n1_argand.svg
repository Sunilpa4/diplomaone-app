<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 386" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="386" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">The Argand diagram</text><text x="180" y="49.6" font-size="10.4" text-anchor="middle" fill="#666" font-weight="normal">a + ib is the point (a, b)</text><path d="M40 250 H330" fill="none" stroke="#333" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M150 260 V100" fill="none" stroke="#333" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="324" y="245.4" font-size="9.6" text-anchor="end" fill="#333" font-weight="normal">real</text><text x="158" y="111.4" font-size="9.6" text-anchor="start" fill="#333" font-weight="normal">imaginary</text><path d="M150 250 L210.0 170.0" fill="none" stroke="#1565C0" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M150 250 L210.0 250 M210.0 250 L210.0 170.0" fill="none" stroke="#1565C0" stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><circle cx="210.0" cy="170.0" r="3.6" fill="#1565C0"/><text x="218" y="167.3" font-size="9.4" text-anchor="start" fill="#1565C0" font-weight="normal">3 + 4i</text><path d="M150 250 L110.0 210.0" fill="none" stroke="#2E7D32" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M150 250 L110.0 250 M110.0 250 L110.0 210.0" fill="none" stroke="#2E7D32" stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><circle cx="110.0" cy="210.0" r="3.6" fill="#2E7D32"/><text x="101" y="215.3" font-size="9.4" text-anchor="end" fill="#2E7D32" font-weight="normal">−2 + 2i</text><text x="172" y="181.3" font-size="9.4" text-anchor="end" fill="#1565C0" font-weight="normal">r = |z| = 5</text><path d="M212.0 250.0 A62 62 0 0 1 187.2 200.4" fill="none" stroke="#B66A00" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="218" y="235.6" font-size="10.4" text-anchor="start" fill="#B66A00" font-weight="normal">θ</text><rect x="12.0" y="284.0" width="336" height="24" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="299.6" font-size="10.2" text-anchor="middle" fill="#222" font-weight="normal">z = a + ib : a is real, b is imaginary</text><rect x="12.0" y="320.0" width="336" height="24" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="335.4" font-size="9.8" text-anchor="middle" fill="#222" font-weight="normal">|z| = √(a² + b²) is the distance from the origin</text><text x="180" y="367.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Multiply by i and the point turns 90° anticlockwise.</text></svg>