<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="360" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Adjoint of a 3x3 matrix</text><text x="180" y="49.6" font-size="10.4" text-anchor="middle" fill="#666" font-weight="normal">adj A = transpose of the cofactor matrix</text><text x="80" y="81.4" font-size="9.8" text-anchor="middle" fill="#1565C0" font-weight="bold">A (3×3)</text><path d="M18 82 h-4 V156 h4" fill="none" stroke="#1565C0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M142 82 h4 V156 h-4" fill="none" stroke="#1565C0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="44.0" y="103.0" font-size="8.4" text-anchor="middle" fill="#1565C0" font-weight="normal">a₁₁</text><text x="80.0" y="103.0" font-size="8.4" text-anchor="middle" fill="#1565C0" font-weight="normal">a₁₂</text><text x="116.0" y="103.0" font-size="8.4" text-anchor="middle" fill="#1565C0" font-weight="normal">a₁₃</text><text x="44.0" y="125.0" font-size="8.4" text-anchor="middle" fill="#1565C0" font-weight="normal">a₂₁</text><text x="80.0" y="125.0" font-size="8.4" text-anchor="middle" fill="#1565C0" font-weight="normal">a₂₂</text><text x="116.0" y="125.0" font-size="8.4" text-anchor="middle" fill="#1565C0" font-weight="normal">a₂₃</text><text x="44.0" y="147.0" font-size="8.4" text-anchor="middle" fill="#1565C0" font-weight="normal">a₃₁</text><text x="80.0" y="147.0" font-size="8.4" text-anchor="middle" fill="#1565C0" font-weight="normal">a₃₂</text><text x="116.0" y="147.0" font-size="8.4" text-anchor="middle" fill="#1565C0" font-weight="normal">a₃₃</text><text x="152" y="125.8" font-size="11" text-anchor="middle" fill="#666" font-weight="normal">×</text><text x="199" y="81.4" font-size="9.8" text-anchor="middle" fill="#B66A00" font-weight="bold">signs</text><path d="M158 82 h-4 V156 h4" fill="none" stroke="#B66A00" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M240 82 h4 V156 h-4" fill="none" stroke="#B66A00" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="177.0" y="104.5" font-size="10.6" text-anchor="middle" fill="#B66A00" font-weight="normal">+</text><text x="199.0" y="104.5" font-size="10.6" text-anchor="middle" fill="#B66A00" font-weight="normal">−</text><text x="221.0" y="104.5" font-size="10.6" text-anchor="middle" fill="#B66A00" font-weight="normal">+</text><text x="177.0" y="126.5" font-size="10.6" text-anchor="middle" fill="#B66A00" font-weight="normal">−</text><text x="199.0" y="126.5" font-size="10.6" text-anchor="middle" fill="#B66A00" font-weight="normal">+</text><text x="221.0" y="126.5" font-size="10.6" text-anchor="middle" fill="#B66A00" font-weight="normal">−</text><text x="177.0" y="148.5" font-size="10.6" text-anchor="middle" fill="#B66A00" font-weight="normal">+</text><text x="199.0" y="148.5" font-size="10.6" text-anchor="middle" fill="#B66A00" font-weight="normal">−</text><text x="221.0" y="148.5" font-size="10.6" text-anchor="middle" fill="#B66A00" font-weight="normal">+</text><text x="250" y="125.8" font-size="11" text-anchor="middle" fill="#666" font-weight="normal">×</text><text x="300" y="81.4" font-size="9.8" text-anchor="middle" fill="#2E7D32" font-weight="bold">cofactors Cᵢⱼ</text><path d="M256 82 h-4 V156 h4" fill="none" stroke="#2E7D32" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M344 82 h4 V156 h-4" fill="none" stroke="#2E7D32" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="276.0" y="102.8" font-size="8.2" text-anchor="middle" fill="#2E7D32" font-weight="normal">C₁₁</text><text x="300.0" y="102.8" font-size="8.2" text-anchor="middle" fill="#2E7D32" font-weight="normal">C₁₂</text><text x="324.0" y="102.8" font-size="8.2" text-anchor="middle" fill="#2E7D32" font-weight="normal">C₁₃</text><text x="276.0" y="124.8" font-size="8.2" text-anchor="middle" fill="#2E7D32" font-weight="normal">C₂₁</text><text x="300.0" y="124.8" font-size="8.2" text-anchor="middle" fill="#2E7D32" font-weight="normal">C₂₂</text><text x="324.0" y="124.8" font-size="8.2" text-anchor="middle" fill="#2E7D32" font-weight="normal">C₂₃</text><text x="276.0" y="146.8" font-size="8.2" text-anchor="middle" fill="#2E7D32" font-weight="normal">C₃₁</text><text x="300.0" y="146.8" font-size="8.2" text-anchor="middle" fill="#2E7D32" font-weight="normal">C₃₂</text><text x="324.0" y="146.8" font-size="8.2" text-anchor="middle" fill="#2E7D32" font-weight="normal">C₃₃</text><rect x="15.0" y="166.0" width="330" height="24" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="181.6" font-size="10.2" text-anchor="middle" fill="#222" font-weight="normal">Cᵢⱼ = (−1)^(i+j) × minor of aᵢⱼ</text><rect x="15.0" y="204.0" width="330" height="24" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="219.4" font-size="9.6" text-anchor="middle" fill="#222" font-weight="normal">a minor is the 2x2 left after deleting its row and column</text><rect x="15.0" y="242.0" width="330" height="24" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="257.6" font-size="10.2" text-anchor="middle" fill="#222" font-weight="normal">reflect the cofactor matrix: rows become columns</text><rect x="15.0" y="281.0" width="330" height="26" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="180" y="297.6" font-size="10.4" text-anchor="middle" fill="#222" font-weight="normal">A⁻¹ = adj A ÷ |A| ,  only when |A| ≠ 0</text><text x="180" y="331.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">On the diagonal the sign is +, off the diagonal it is −.</text><text x="180" y="347.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">A 3x3 inverse needs 9 cofactors, so work slowly.</text></svg>