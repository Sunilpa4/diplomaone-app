<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 394" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="394" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Linear DE: dy/dx + P y = Q</text><text x="180" y="49.6" font-size="10.4" text-anchor="middle" fill="#666" font-weight="normal">first order, first degree, y only to power 1</text><rect x="12.0" y="69.0" width="336" height="26" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="85.6" font-size="10.2" text-anchor="middle" fill="#222" font-weight="normal">write it in this exact form first</text><path d="M180 95 L180 117" fill="none" stroke="#666" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,117.0 183.5,110.0 176.5,110.0" fill="#666"/><rect x="12.0" y="123.0" width="336" height="26" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="139.6" font-size="10.2" text-anchor="middle" fill="#222" font-weight="normal">P = coefficient of y ;  Q = the rest</text><path d="M180 149 L180 171" fill="none" stroke="#666" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,171.0 183.5,164.0 176.5,164.0" fill="#666"/><rect x="12.0" y="176.0" width="336" height="28" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="193.8" font-size="11.0" text-anchor="middle" fill="#222" font-weight="normal">integrating factor  IF = e^(∫P dx)</text><path d="M180 204 L180 226" fill="none" stroke="#666" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,226.0 183.5,219.0 176.5,219.0" fill="#666"/><rect x="12.0" y="233.0" width="336" height="26" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="249.5" font-size="10.0" text-anchor="middle" fill="#222" font-weight="normal">multiply through: d/dx ( y · IF ) = Q · IF</text><path d="M180 259 L180 281" fill="none" stroke="#666" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,281.0 183.5,274.0 176.5,274.0" fill="#666"/><rect x="12.0" y="287.0" width="336" height="26" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="303.6" font-size="10.4" text-anchor="middle" fill="#222" font-weight="normal">y · IF = ∫ Q · IF dx  +  c</text><rect x="12.0" y="325.0" width="336" height="26" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="180" y="341.7" font-size="10.6" text-anchor="middle" fill="#222" font-weight="normal">y = ( ∫ Q·IF dx + c ) / IF</text><text x="180" y="379.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">The IF turns the left side into one exact derivative.</text></svg>