 stroke="#2E7D32" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="249.3" font-size="9.4" text-anchor="start" fill="#2E7D32" font-weight="normal">tangent: slope 2</text><text x="238" y="155.2" font-size="9.2" text-anchor="start" fill="#B66A00" font-weight="normal">chord PQ: slope 2.6</text><rect x="15.0" y="308.0" width="330" height="24" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="323.6" font-size="10.4" text-anchor="middle" fill="#222" font-weight="normal">dy/dx = limit of Δy/Δx as Δx → 0</text><text x="180" y="357.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">The derivative is the slope of the tangent at a point.</text></svg>