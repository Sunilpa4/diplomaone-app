<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 370" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="370" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Three outcomes of two equations</text><text x="180" y="49.6" font-size="10.4" text-anchor="middle" fill="#666" font-weight="normal">D = a₁b₂ − a₂b₁ decides which one you get</text><path d="M30 160 H114" fill="none" stroke="#333" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M42 160 V102" fill="none" stroke="#333" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M34 156 L108 108" fill="none" stroke="#1565C0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M38 106 L106 162" fill="none" stroke="#2E7D32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="75" cy="132" r="3.6" fill="#BD2543"/><text x="72" y="189.3" font-size="9.4" text-anchor="middle" fill="#2E7D32" font-weight="bold">D ≠ 0: one point</text><path d="M138 160 H222" fill="none" stroke="#333" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M150 160 V102" fill="none" stroke="#333" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M144 150 L214 104" fill="none" stroke="#1565C0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M158 164 L220 122" fill="none" stroke="#2E7D32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="180" y="189.3" font-size="9.4" text-anchor="middle" fill="#BD2543" font-weight="bold">D = 0: no solution</text><path d="M246 160 H330" fill="none" stroke="#333" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M258 160 V102" fill="none" stroke="#333" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M252 152 L322 106" fill="none" stroke="#7B2CD9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="288" y="189.3" font-size="9.4" text-anchor="middle" fill="#B66A00" font-weight="bold">infinite solutions</text><rect x="14.0" y="212.0" width="332" height="24" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="227.6" font-size="10.4" text-anchor="middle" fill="#222" font-weight="normal">unique:  x = Dx/D  and  y = Dy/D</text><rect x="14.0" y="252.0" width="332" height="24" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="180" y="267.6" font-size="10.4" text-anchor="middle" fill="#222" font-weight="normal">no solution:  the lines are parallel</text><rect x="14.0" y="292.0" width="332" height="24" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="307.6" font-size="10.4" text-anchor="middle" fill="#222" font-weight="normal">infinite:  the same line written twice</text><text x="180" y="341.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Cramer's rule works only in the first case - check D first.</text><text x="180" y="357.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Dx swaps the x-column for the constants; Dy swaps y's.</text></svg>