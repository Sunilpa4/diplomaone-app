<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 390" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="390" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">The argument depends on the quadrant</text><text x="180" y="49.6" font-size="10.4" text-anchor="middle" fill="#666" font-weight="normal">θ = tan⁻¹(b/a), fixed by where z lies</text><rect x="122" y="142" width="116" height="116" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.0" stroke-dasharray="4 4"/><path d="M88 200 H272" fill="none" stroke="#333" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M180 108 V292" fill="none" stroke="#333" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="148" y="167.5" font-size="10.0" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Q2</text><text x="148" y="183.4" font-size="9.6" text-anchor="middle" fill="#333" font-weight="normal">π − α</text><text x="212" y="167.5" font-size="10.0" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Q1</text><text x="212" y="183.4" font-size="9.6" text-anchor="middle" fill="#333" font-weight="normal">α</text><text x="146" y="231.5" font-size="10.0" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Q3</text><text x="146" y="247.4" font-size="9.6" text-anchor="middle" fill="#333" font-weight="normal">−(π − α)</text><text x="212" y="231.5" font-size="10.0" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Q4</text><text x="212" y="247.4" font-size="9.6" text-anchor="middle" fill="#333" font-weight="normal">−α</text><text x="264" y="196.2" font-size="9.0" text-anchor="end" fill="#666" font-weight="normal">real</text><text x="187" y="121.2" font-size="9.0" text-anchor="start" fill="#666" font-weight="normal">imag</text><text x="180" y="309.4" font-size="9.8" text-anchor="middle" fill="#666" font-weight="normal">α = tan⁻¹|b/a| is the angle from the real axis</text><rect x="12.0" y="324.0" width="336" height="24" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="339.4" font-size="9.6" text-anchor="middle" fill="#222" font-weight="normal">Q1 and Q4 give α directly; Q2 and Q3 need a sign fix</text><text x="180" y="371.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Always draw the point before writing the argument.</text></svg>