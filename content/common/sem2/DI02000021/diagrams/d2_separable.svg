<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 392" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="392" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Variable separable: split x from y</text><text x="180" y="49.6" font-size="10.4" text-anchor="middle" fill="#666" font-weight="normal">works when the right side factors</text><rect x="15.0" y="69.0" width="330" height="26" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="85.8" font-size="11.0" text-anchor="middle" fill="#222" font-weight="normal">dy/dx = f(x) · g(y)</text><path d="M180 95 L180 117" fill="none" stroke="#666" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,117.0 183.5,110.0 176.5,110.0" fill="#666"/><rect x="15.0" y="123.0" width="330" height="26" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="139.6" font-size="10.2" text-anchor="middle" fill="#222" font-weight="normal">divide by g(y) and multiply by dx</text><path d="M180 149 L180 171" fill="none" stroke="#666" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,171.0 183.5,164.0 176.5,164.0" fill="#666"/><rect x="15.0" y="177.0" width="330" height="26" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="193.8" font-size="11.0" text-anchor="middle" fill="#222" font-weight="normal">∫ dy/g(y)  =  ∫ f(x) dx</text><path d="M180 203 L180 225" fill="none" stroke="#666" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,225.0 183.5,218.0 176.5,218.0" fill="#666"/><rect x="15.0" y="231.0" width="330" height="26" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="247.6" font-size="10.2" text-anchor="middle" fill="#222" font-weight="normal">integrate both sides, add one c</text><rect x="15.0" y="275.0" width="330" height="26" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="291.4" font-size="9.8" text-anchor="middle" fill="#222" font-weight="normal">dy/dx = x/y  →  y dy = x dx  →  y² = x² + c</text><rect x="15.0" y="314.0" width="330" height="24" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="180" y="329.4" font-size="9.8" text-anchor="middle" fill="#222" font-weight="normal">a point such as y(0) = 3 fixes the constant</text><text x="180" y="363.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Keep y on the left of dy and x on the left of dx.</text><text x="180" y="379.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Then each side integrates with respect to one variable only.</text></svg>