<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 376" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="376" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">De Moivre in four lines</text><text x="180" y="49.6" font-size="10.4" text-anchor="middle" fill="#666" font-weight="normal">worked: z = 1 + i√3, find z⁶</text><rect x="12.0" y="69.0" width="336" height="26" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="85.6" font-size="10.2" text-anchor="middle" fill="#222" font-weight="normal">step 1: r = √(1 + 3) = 2</text><path d="M180 95 L180 117" fill="none" stroke="#666" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,117.0 183.5,110.0 176.5,110.0" fill="#666"/><rect x="12.0" y="123.0" width="336" height="26" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="139.4" font-size="9.6" text-anchor="middle" fill="#222" font-weight="normal">step 2: θ = tan⁻¹(√3/1) = π/3 (first quadrant)</text><path d="M180 149 L180 171" fill="none" stroke="#666" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,171.0 183.5,164.0 176.5,164.0" fill="#666"/><rect x="12.0" y="177.0" width="336" height="26" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="193.6" font-size="10.4" text-anchor="middle" fill="#222" font-weight="normal">step 3: z = 2 cis (π/3)</text><path d="M180 203 L180 225" fill="none" stroke="#666" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,225.0 183.5,218.0 176.5,218.0" fill="#666"/><rect x="12.0" y="230.0" width="336" height="28" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="247.5" font-size="10.0" text-anchor="middle" fill="#222" font-weight="normal">step 4: z⁶ = 2⁶ cis (6 × π/3) = 64 cis 2π</text><rect x="12.0" y="274.0" width="336" height="24" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="289.6" font-size="10.2" text-anchor="middle" fill="#222" font-weight="normal">= 64 (cos 2π + i sin 2π) = 64</text><rect x="12.0" y="310.0" width="336" height="24" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="180" y="325.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">final answer is real - the argument completed a full turn</text><text x="180" y="357.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Modulus to the power, argument times the power.</text><text x="180" y="373.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Reduce the angle to its principal value before the final answer.</text></svg>