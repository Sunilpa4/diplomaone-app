<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 384" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="384" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Spin the area to get a volume</text><text x="180" y="49.6" font-size="10.4" text-anchor="middle" fill="#666" font-weight="normal">rotating y = f(x) about the x-axis gives discs</text><path d="M58 250 H330" fill="none" stroke="#333" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M58 250 V104" fill="none" stroke="#333" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="324" y="245.5" font-size="10" text-anchor="end" fill="#333" font-weight="normal">x</text><text x="66" y="115.5" font-size="10" text-anchor="start" fill="#333" font-weight="normal">y</text><path d="M90.0 232.0 L112.0 226.0 L134.0 220.0 L156.0 214.0 L178.0 208.0 L200.0 202.0 L222.0 196.0 L244.0 190.0 L266.0 184.0 L288.0 178.0" fill="none" stroke="#1565C0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M160 250 A40 40 0 0 1 240 250 Z" fill="#FFF4DF" fill-opacity="0.4" stroke="#B66A00" stroke-width="1.8"/><path d="M200 250 V210" fill="none" stroke="#BD2543" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="206" y="241.3" font-size="9.4" text-anchor="start" fill="#BD2543" font-weight="normal">radius y</text><text x="200" y="271.2" font-size="9.2" text-anchor="middle" fill="#B66A00" font-weight="normal">one slice</text><text x="96" y="269.2" font-size="9.2" text-anchor="start" fill="#666" font-weight="normal">x = a</text><text x="292" y="269.2" font-size="9.2" text-anchor="start" fill="#666" font-weight="normal">x = b</text><rect x="12.0" y="290.0" width="336" height="24" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="305.5" font-size="10.0" text-anchor="middle" fill="#222" font-weight="normal">each slice is a disc of radius y and thickness dx</text><rect x="12.0" y="325.0" width="336" height="26" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="341.7" font-size="10.6" text-anchor="middle" fill="#222" font-weight="normal">V = π ∫ y² dx  between a and b</text><text x="180" y="371.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Square the radius, integrate, then multiply by π.</text></svg>