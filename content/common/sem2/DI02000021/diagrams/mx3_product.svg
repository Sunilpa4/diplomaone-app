<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 368" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="368" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Row times column gives an entry of AB</text><text x="180" y="49.6" font-size="10.4" text-anchor="middle" fill="#666" font-weight="normal">A is 2 × 3 and B is 3 × 2, so AB is 2 × 2</text><text x="74" y="83.4" font-size="9.8" text-anchor="middle" fill="#1565C0" font-weight="bold">A (2×3)</text><path d="M28 88 h-4 V140 h4" fill="none" stroke="#1565C0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M122 88 h4 V140 h-4" fill="none" stroke="#1565C0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="37.0" y="93.0" width="24.0" height="20.0" rx="3" fill="#FDECF0"/><text x="49.0" y="110.4" font-size="10.4" text-anchor="middle" fill="#0D47A1" font-weight="bold">1</text><rect x="63.0" y="93.0" width="24.0" height="20.0" rx="3" fill="#FDECF0"/><text x="75.0" y="110.4" font-size="10.4" text-anchor="middle" fill="#0D47A1" font-weight="bold">2</text><rect x="89.0" y="93.0" width="24.0" height="20.0" rx="3" fill="#FDECF0"/><text x="101.0" y="110.4" font-size="10.4" text-anchor="middle" fill="#0D47A1" font-weight="bold">3</text><text x="49.0" y="132.4" font-size="10.4" text-anchor="middle" fill="#1565C0" font-weight="normal">4</text><text x="75.0" y="132.4" font-size="10.4" text-anchor="middle" fill="#1565C0" font-weight="normal">5</text><text x="101.0" y="132.4" font-size="10.4" text-anchor="middle" fill="#1565C0" font-weight="normal">6</text><text x="142" y="124.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">×</text><text x="196" y="83.4" font-size="9.8" text-anchor="middle" fill="#2E7D32" font-weight="bold">B (3×2)</text><path d="M154 88 h-4 V162 h4" fill="none" stroke="#2E7D32" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M222 88 h4 V162 h-4" fill="none" stroke="#2E7D32" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="163.0" y="93.0" width="24.0" height="20.0" rx="3" fill="#FDECF0"/><text x="175.0" y="110.4" font-size="10.4" text-anchor="middle" fill="#1B5E20" font-weight="bold">1</text><text x="201.0" y="110.4" font-size="10.4" text-anchor="middle" fill="#2E7D32" font-weight="normal">0</text><rect x="163.0" y="115.0" width="24.0" height="20.0" rx="3" fill="#FDECF0"/><text x="175.0" y="132.4" font-size="10.4" text-anchor="middle" fill="#1B5E20" font-weight="bold">2</text><text x="201.0" y="132.4" font-size="10.4" text-anchor="middle" fill="#2E7D32" font-weight="normal">1</text><rect x="163.0" y="137.0" width="24.0" height="20.0" rx="3" fill="#FDECF0"/><text x="175.0" y="154.4" font-size="10.4" text-anchor="middle" fill="#1B5E20" font-weight="bold">0</text><text x="201.0" y="154.4" font-size="10.4" text-anchor="middle" fill="#2E7D32" font-weight="normal">3</text><text x="233" y="124.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">=</text><text x="288" y="83.4" font-size="9.8" text-anchor="middle" fill="#BD2543" font-weight="bold">C (2×2)</text><path d="M244 88 h-4 V140 h4" fill="none" stroke="#BD2543" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M320 88 h4 V140 h-4" fill="none" stroke="#BD2543" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="253.0" y="93.0" width="28.0" height="20.0" rx="3" fill="#FDECF0"/><text x="267.0" y="110.4" font-size="10.4" text-anchor="middle" fill="#7B1030" font-weight="bold">5</text><text x="297.0" y="110.4" font-size="10.4" text-anchor="middle" fill="#BD2543" font-weight="normal">11</text><text x="267.0" y="132.4" font-size="10.4" text-anchor="middle" fill="#BD2543" font-weight="normal">14</text><text x="297.0" y="132.4" font-size="10.4" text-anchor="middle" fill="#BD2543" font-weight="normal">23</text><rect x="15.0" y="173.0" width="330" height="26" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="180" y="189.7" font-size="10.6" text-anchor="middle" fill="#222" font-weight="normal">c₁₁ = row 1 of A · column 1 of B</text><text x="180" y="226.1" font-size="11.6" text-anchor="middle" fill="#7B1030" font-weight="bold">= 1×1 + 2×2 + 3×0 = 5</text><rect x="15.0" y="249.0" width="330" height="26" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="265.6" font-size="10.4" text-anchor="middle" fill="#222" font-weight="normal">inner sizes must match: (2×3)(3×2)</text><rect x="15.0" y="289.0" width="330" height="26" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="305.6" font-size="10.4" text-anchor="middle" fill="#222" font-weight="normal">AB ≠ BA in general - order matters</text><text x="180" y="339.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Multiply each row of A into each column of B.</text><text x="180" y="355.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">The answer has rows of A and columns of B.</text></svg>