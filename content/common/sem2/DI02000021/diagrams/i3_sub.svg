<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 368" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="368" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Substitution undoes the chain rule</text><text x="180" y="49.6" font-size="10.4" text-anchor="middle" fill="#666" font-weight="normal">∫ 2x(x² + 1)³ dx  becomes  ∫ u³ du</text><rect x="15.0" y="69.0" width="330" height="26" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="85.6" font-size="10.4" text-anchor="middle" fill="#222" font-weight="normal">let u = x² + 1  (the inside of the power)</text><rect x="15.0" y="109.0" width="330" height="26" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="125.5" font-size="10.0" text-anchor="middle" fill="#222" font-weight="normal">then du = 2x dx  - and 2x dx is already in the question</text><rect x="15.0" y="149.0" width="330" height="26" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="165.6" font-size="10.4" text-anchor="middle" fill="#222" font-weight="normal">the integral is now  ∫ u³ du = u⁴/4 + c</text><rect x="15.0" y="189.0" width="330" height="26" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="205.6" font-size="10.4" text-anchor="middle" fill="#222" font-weight="normal">put u back:  (x² + 1)⁴/4 + c</text><text x="180" y="239.6" font-size="10.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Check: differentiate the answer</text><rect x="15.0" y="252.0" width="330" height="24" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="267.6" font-size="10.2" text-anchor="middle" fill="#222" font-weight="normal">4(x² + 1)³/4 × 2x = 2x(x² + 1)³  ✓</text><rect x="15.0" y="292.0" width="330" height="24" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="307.4" font-size="9.8" text-anchor="middle" fill="#222" font-weight="normal">choose u so that du appears (or can be made to appear)</text><text x="180" y="343.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Substitution is the chain rule read backwards.</text><text x="180" y="359.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Change the limits too when the integral is definite.</text></svg>