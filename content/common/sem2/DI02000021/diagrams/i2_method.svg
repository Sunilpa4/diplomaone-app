<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 366" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="366" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Which integration method?</text><text x="180" y="49.6" font-size="10.4" text-anchor="middle" fill="#666" font-weight="normal">look at the shape of the integrand first</text><rect x="30.0" y="67.0" width="300" height="26" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="83.6" font-size="10.4" text-anchor="middle" fill="#222" font-weight="normal">can you write it as a standard form?</text><path d="M180 94 L180 116" fill="none" stroke="#666" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,116.0 183.5,109.0 176.5,109.0" fill="#666"/><rect x="30.0" y="121.0" width="300" height="26" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="137.5" font-size="10.0" text-anchor="middle" fill="#222" font-weight="normal">no: does one part look like the derivative of another?</text><path d="M180 148 L180 170" fill="none" stroke="#666" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,170.0 183.5,163.0 176.5,163.0" fill="#666"/><rect x="30.0" y="175.0" width="300" height="26" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="191.6" font-size="10.2" text-anchor="middle" fill="#222" font-weight="normal">yes  →  substitution (u = that part)</text><path d="M180 202 L180 224" fill="none" stroke="#666" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,224.0 183.5,217.0 176.5,217.0" fill="#666"/><rect x="30.0" y="229.0" width="300" height="26" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="180" y="245.6" font-size="10.2" text-anchor="middle" fill="#222" font-weight="normal">no: is it a product of unlike functions?</text><path d="M180 256 L180 278" fill="none" stroke="#666" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,278.0 183.5,271.0 176.5,271.0" fill="#666"/><rect x="30.0" y="283.0" width="300" height="26" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="180" y="299.6" font-size="10.2" text-anchor="middle" fill="#222" font-weight="normal">yes  →  integration by parts (u dv)</text><text x="180" y="335.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Always check by differentiating the answer.</text><text x="180" y="351.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">The result must give the original integrand back.</text></svg>