<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 390" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="390" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Polar form: multiply or rotate</text><text x="180" y="49.6" font-size="10.4" text-anchor="middle" fill="#666" font-weight="normal">z = r(cos θ + i sin θ) = r cis θ</text><rect x="12.0" y="69.0" width="336" height="26" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="85.6" font-size="10.4" text-anchor="middle" fill="#222" font-weight="normal">r = |z|  and  θ = arg z</text><path d="M180 95 L180 117" fill="none" stroke="#666" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,117.0 183.5,110.0 176.5,110.0" fill="#666"/><rect x="12.0" y="123.0" width="336" height="26" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="139.5" font-size="10.0" text-anchor="middle" fill="#222" font-weight="normal">multiply: moduli multiply, arguments add</text><rect x="12.0" y="159.0" width="336" height="26" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="175.4" font-size="9.8" text-anchor="middle" fill="#222" font-weight="normal">r₁ cis θ₁ × r₂ cis θ₂ = r₁r₂ cis (θ₁ + θ₂)</text><path d="M180 185 L180 207" fill="none" stroke="#666" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,207.0 183.5,200.0 176.5,200.0" fill="#666"/><rect x="12.0" y="213.0" width="336" height="26" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="229.5" font-size="10.0" text-anchor="middle" fill="#222" font-weight="normal">divide: moduli divide, arguments subtract</text><rect x="12.0" y="249.0" width="336" height="26" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="265.5" font-size="10.0" text-anchor="middle" fill="#222" font-weight="normal">(r₁/r₂) cis (θ₁ − θ₂)</text><path d="M180 275 L180 297" fill="none" stroke="#666" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180.0,297.0 183.5,290.0 176.5,290.0" fill="#666"/><rect x="12.0" y="303.0" width="336" height="26" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="180" y="319.6" font-size="10.2" text-anchor="middle" fill="#222" font-weight="normal">De Moivre: (r cis θ)ⁿ = rⁿ cis (nθ)</text><text x="180" y="359.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Trig form and cis form are the same statement.</text><text x="180" y="375.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Keep θ in radians when nθ is substituted back.</text></svg>