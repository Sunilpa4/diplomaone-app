<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 376" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="376" fill="#ffffff"/><text x="180" y="28.9" font-size="14" text-anchor="middle" fill="#7B2CD9" font-weight="bold">The three cube roots of unity</text><text x="180" y="49.6" font-size="10.4" text-anchor="middle" fill="#666" font-weight="normal">z³ = 1 has exactly three roots</text><circle cx="180" cy="188" r="64" fill="none" stroke="#1565C0" stroke-width="1.2" stroke-dasharray="4 4"/><path d="M94 188 H266" fill="none" stroke="#333" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M180 102 V274" fill="none" stroke="#333" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M180 188 L244.0 188.0" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="244.0" cy="188.0" r="4" fill="#2E7D32"/><text x="253.0" y="180.8" font-size="11.0" text-anchor="start" fill="#2E7D32" font-weight="bold">1</text><path d="M180 188 L148.0 132.6" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="148.0" cy="132.6" r="4" fill="#1565C0"/><text x="139.0" y="134.4" font-size="11.0" text-anchor="end" fill="#1565C0" font-weight="bold">ω</text><path d="M180 188 L148.0 243.4" fill="none" stroke="#B66A00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="148.0" cy="243.4" r="4" fill="#B66A00"/><text x="138.99999999999997" y="250.3" font-size="11.0" text-anchor="end" fill="#B66A00" font-weight="bold">ω²</text><rect x="12.0" y="274.0" width="336" height="24" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="289.4" font-size="9.8" text-anchor="middle" fill="#222" font-weight="normal">ω = −1/2 + i√3/2 ,  ω² = −1/2 − i√3/2</text><rect x="12.0" y="310.0" width="336" height="24" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="325.6" font-size="10.2" text-anchor="middle" fill="#222" font-weight="normal">1 + ω + ω² = 0   and   ω³ = 1</text><text x="180" y="357.6" font-size="10.2" text-anchor="middle" fill="#666" font-weight="normal">Every cube root of 1 sits on the unit circle, 120° apart.</text></svg>