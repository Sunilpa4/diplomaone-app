<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 412" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="412" fill="#ffffff"/><text x="180" y="25.5" font-size="12.8" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Screens, settling, biology, polishing</text><text x="180" y="42.4" font-size="9.6" text-anchor="middle" fill="#666" font-weight="normal">each stage protects the one after it</text><rect x="30" y="52" width="300" height="40" rx="6" fill="#F7F9FC" stroke="#666" stroke-width="1.4"/><text x="180" y="72.4" font-size="9.6" text-anchor="middle" fill="#222" font-weight="bold">raw sewage</text><text x="180" y="84.9" font-size="8.2" text-anchor="middle" fill="#666" font-weight="normal">screen, grit, oil trap</text><rect x="30" y="104" width="300" height="40" rx="6" fill="#F7F9FC" stroke="#00695C" stroke-width="1.4"/><text x="180" y="124.4" font-size="9.6" text-anchor="middle" fill="#222" font-weight="bold">primary clarifier</text><text x="180" y="136.9" font-size="8.2" text-anchor="middle" fill="#666" font-weight="normal">TSS down 50-65 %</text><rect x="30" y="156" width="300" height="40" rx="6" fill="#F7F9FC" stroke="#1565C0" stroke-width="1.4"/><text x="180" y="176.4" font-size="9.6" text-anchor="middle" fill="#222" font-weight="bold">aeration tank</text><text x="180" y="188.9" font-size="8.2" text-anchor="middle" fill="#666" font-weight="normal">bacteria eat the organics</text><rect x="30" y="208" width="300" height="40" rx="6" fill="#F7F9FC" stroke="#00695C" stroke-width="1.4"/><text x="180" y="228.4" font-size="9.6" text-anchor="middle" fill="#222" font-weight="bold">secondary clarifier</text><text x="180" y="240.9" font-size="8.2" text-anchor="middle" fill="#666" font-weight="normal">sludge settles</text><rect x="30" y="260" width="300" height="40" rx="6" fill="#F7F9FC" stroke="#2E7D32" stroke-width="1.4"/><text x="180" y="280.4" font-size="9.6" text-anchor="middle" fill="#222" font-weight="bold">tertiary + disinfection</text><text x="180" y="292.9" font-size="8.2" text-anchor="middle" fill="#666" font-weight="normal">nutrients, colour, germs</text><path d="M180 92L180.0 99.8" fill="none" stroke="#666" stroke-width="1.4" stroke-linecap="round"/><path d="M182.5 98.0L180.0 104.0L177.5 98.0Z" fill="#666"/><path d="M180 144L180.0 151.8" fill="none" stroke="#666" stroke-width="1.4" stroke-linecap="round"/><path d="M182.5 150.0L180.0 156.0L177.5 150.0Z" fill="#666"/><path d="M180 196L180.0 203.8" fill="none" stroke="#666" stroke-width="1.4" stroke-linecap="round"/><path d="M182.5 202.0L180.0 208.0L177.5 202.0Z" fill="#666"/><path d="M180 248L180.0 255.8" fill="none" stroke="#666" stroke-width="1.4" stroke-linecap="round"/><path d="M182.5 254.0L180.0 260.0L177.5 254.0Z" fill="#666"/><path d="M180 300L180.0 313.8" fill="none" stroke="#2E7D32" stroke-width="1.4" stroke-linecap="round"/><path d="M182.5 312.0L180.0 318.0L177.5 312.0Z" fill="#2E7D32"/><text x="188" y="318.9" font-size="8.4" text-anchor="start" fill="#2E7D32" font-weight="normal">to river or reuse</text><rect x="8.0" y="331.0" width="344" height="26" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="347.0" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">30-50 % of the settled sludge returns to the aeration tank</text><text x="180" y="389.1" font-size="9.0" text-anchor="middle" fill="#666" font-weight="normal">BOD 300 mg/L comes in, about 20 mg/L goes out.</text><text x="180" y="403.1" font-size="9.0" text-anchor="middle" fill="#666" font-weight="normal">UASB replaces the aeration tank where the waste is warm and strong.</text></svg>