<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 298" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="298" fill="#ffffff"/><text x="180" y="25.5" font-size="12.8" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Sources on the left, effects on the right</text><text x="180" y="42.4" font-size="9.6" text-anchor="middle" fill="#666" font-weight="normal">PM2.5 does most of the health damage</text><rect x="8" y="56" width="146" height="34" rx="5" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.2"/><text x="14" y="73.2" font-size="9.0" text-anchor="start" fill="#222" font-weight="bold">vehicles</text><text x="14" y="84.8" font-size="8.0" text-anchor="start" fill="#666" font-weight="normal">NOx, CO, PM2.5</text><path d="M158 73L195.8 73.0" fill="none" stroke="#666" stroke-width="1.4" stroke-linecap="round"/><path d="M194.0 70.5L200.0 73.0L194.0 75.5Z" fill="#666"/><rect x="206" y="56" width="146" height="34" rx="5" fill="#FDECF0" stroke="#BD2543" stroke-width="1.2"/><text x="212" y="73.2" font-size="9.0" text-anchor="start" fill="#222" font-weight="bold">lungs and heart</text><text x="212" y="84.8" font-size="8.0" text-anchor="start" fill="#666" font-weight="normal">PM2.5, ozone</text><rect x="8" y="98" width="146" height="34" rx="5" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.2"/><text x="14" y="115.2" font-size="9.0" text-anchor="start" fill="#222" font-weight="bold">coal and oil</text><text x="14" y="126.8" font-size="8.0" text-anchor="start" fill="#666" font-weight="normal">SO2, PM2.5, CO2</text><path d="M158 115L195.8 115.0" fill="none" stroke="#666" stroke-width="1.4" stroke-linecap="round"/><path d="M194.0 112.5L200.0 115.0L194.0 117.5Z" fill="#666"/><rect x="206" y="98" width="146" height="34" rx="5" fill="#FDECF0" stroke="#BD2543" stroke-width="1.2"/><text x="212" y="115.2" font-size="9.0" text-anchor="start" fill="#222" font-weight="bold">acid rain</text><text x="212" y="126.8" font-size="8.0" text-anchor="start" fill="#666" font-weight="normal">SO2, NOx</text><rect x="8" y="140" width="146" height="34" rx="5" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.2"/><text x="14" y="157.2" font-size="9.0" text-anchor="start" fill="#222" font-weight="bold">construction</text><text x="14" y="168.8" font-size="8.0" text-anchor="start" fill="#666" font-weight="normal">coarse and fine dust</text><path d="M158 157L195.8 157.0" fill="none" stroke="#666" stroke-width="1.4" stroke-linecap="round"/><path d="M194.0 154.5L200.0 157.0L194.0 159.5Z" fill="#666"/><rect x="206" y="140" width="146" height="34" rx="5" fill="#FDECF0" stroke="#BD2543" stroke-width="1.2"/><text x="212" y="157.2" font-size="9.0" text-anchor="start" fill="#222" font-weight="bold">smog and haze</text><text x="212" y="168.8" font-size="8.0" text-anchor="start" fill="#666" font-weight="normal">NOx + VOC</text><rect x="8" y="182" width="146" height="34" rx="5" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.2"/><text x="14" y="199.2" font-size="9.0" text-anchor="start" fill="#222" font-weight="bold">open burning</text><text x="14" y="210.8" font-size="8.0" text-anchor="start" fill="#666" font-weight="normal">PM2.5, dioxins</text><path d="M158 199L195.8 199.0" fill="none" stroke="#666" stroke-width="1.4" stroke-linecap="round"/><path d="M194.0 196.5L200.0 199.0L194.0 201.5Z" fill="#666"/><rect x="206" y="182" width="146" height="34" rx="5" fill="#FDECF0" stroke="#BD2543" stroke-width="1.2"/><text x="212" y="199.2" font-size="9.0" text-anchor="start" fill="#222" font-weight="bold">climate</text><text x="212" y="210.8" font-size="8.0" text-anchor="start" fill="#666" font-weight="normal">CO2, black carbon</text><rect x="8.0" y="231.0" width="344" height="30" rx="7" fill="#E0F2F1" stroke="#00695C" stroke-width="1.6"/><text x="180" y="249.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">control at the source, collect what is left, never rely on a taller stack</text><text x="180" y="279.1" font-size="9.0" text-anchor="middle" fill="#666" font-weight="normal">Primary pollutants are emitted as such; secondary ones form in the air.</text><text x="180" y="293.1" font-size="9.0" text-anchor="middle" fill="#666" font-weight="normal">A clear plume is not clean air - CO and PM2.5 are invisible.</text></svg>