<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 244" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="244" fill="#ffffff"/><text x="180" y="25.4" font-size="12.6" text-anchor="middle" fill="#7B2CD9" font-weight="bold">All three, or it is just mass tourism</text><text x="180" y="42.4" font-size="9.6" text-anchor="middle" fill="#666" font-weight="normal">the tests a site has to pass</text><rect x="10" y="56" width="104" height="92" rx="7" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.5"/><text x="62" y="76.9" font-size="8.4" text-anchor="middle" fill="#2E7D32" font-weight="bold">conserves</text><text x="62" y="94.5" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">fee funds the</text><text x="62" y="108.5" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">trail and the reef</text><text x="62" y="122.5" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">capacity is set</text><rect x="128" y="56" width="104" height="92" rx="7" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.5"/><text x="180" y="76.9" font-size="8.4" text-anchor="middle" fill="#1565C0" font-weight="bold">benefits locals</text><text x="180" y="94.5" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">guides, homestays,</text><text x="180" y="108.5" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">craft and produce</text><text x="180" y="122.5" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">money stays here</text><rect x="246" y="56" width="104" height="92" rx="7" fill="#FFFFFF" stroke="#B66A00" stroke-width="1.5"/><text x="298" y="76.9" font-size="8.4" text-anchor="middle" fill="#B66A00" font-weight="bold">educates</text><text x="298" y="94.5" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">interpretation</text><text x="298" y="108.5" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">boards, and a</text><text x="298" y="122.5" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">guide who explains</text><rect x="8" y="160" width="344" height="30" rx="6" fill="#E0F2F1" stroke="#00695C" stroke-width="1.4"/><text x="180" y="176.8" font-size="8.0" text-anchor="middle" fill="#00695C" font-weight="bold">carrying capacity = visitors a day the place can absorb</text><text x="180" y="187.5" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">enforced by permits, a closed day and a peak-season fee</text><text x="180" y="209.2" font-size="9.0" text-anchor="middle" fill="#666" font-weight="normal">Greenwashing, leakage to enclave resorts and sewage are the usual failures.</text><text x="180" y="223.2" font-size="9.0" text-anchor="middle" fill="#666" font-weight="normal">A village committee that keeps the gate fee keeps the forest.</text></svg>