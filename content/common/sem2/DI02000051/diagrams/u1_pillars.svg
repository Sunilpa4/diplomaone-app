<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="300" fill="#ffffff"/><text x="180" y="25.6" font-size="13.0" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Three pillars carry one idea</text><text x="180" y="43.4" font-size="9.6" text-anchor="middle" fill="#666" font-weight="normal">environment · society · economy</text><rect x="16.0" y="45.0" width="112" height="34" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="72" y="65.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">environment</text><text x="72" y="92.9" font-size="8.4" text-anchor="middle" fill="#666" font-weight="normal">air · water · soil</text><rect x="232.0" y="45.0" width="112" height="34" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="288" y="65.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">society</text><text x="288" y="92.9" font-size="8.4" text-anchor="middle" fill="#666" font-weight="normal">health · equity</text><rect x="114.0" y="209.0" width="132" height="34" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="229.3" font-size="9.4" text-anchor="middle" fill="#222" font-weight="normal">economy</text><text x="180" y="256.9" font-size="8.4" text-anchor="middle" fill="#666" font-weight="normal">cost · jobs · payback</text><circle cx="180" cy="152" r="44" fill="#F3EBFD" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="149.6" font-size="10.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">sustain-</text><text x="180" y="165.6" font-size="10.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">ability</text><path d="M112 92L143.05025253169416 123.05025253169417" fill="none" stroke="#999" stroke-width="1.4" stroke-linecap="round"/><path d="M148 128L140.22182540694797 125.87867965644035L145.87867965644034 120.22182540694799Z" fill="#999"/><path d="M248 92L216.94974746830584 123.0502