<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 314" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="314" fill="#ffffff"/><text x="180" y="25.5" font-size="12.8" text-anchor="middle" fill="#7B2CD9" font-weight="bold">The hierarchy decides the route</text><text x="180" y="42.4" font-size="9.6" text-anchor="middle" fill="#666" font-weight="normal">segregation at source makes it possible</text><rect x="12.0" y="54" width="336" height="30" rx="5" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.5"/><text x="180" y="70.3" font-size="9.4" text-anchor="middle" fill="#2E7D32" font-weight="bold">1 refuse and reduce</text><text x="180" y="81.8" font-size="8.0" text-anchor="middle" fill="#666" font-weight="normal">buy less, design out the waste</text><rect x="25.0" y="92" width="310" height="30" rx="5" fill="#FFFFFF" stroke="#00695C" stroke-width="1.5"/><text x="180" y="108.3" font-size="9.4" text-anchor="middle" fill="#00695C" font-weight="bold">2 reuse</text><text x="180" y="119.8" font-size="8.0" text-anchor="middle" fill="#666" font-weight="normal">bottles, crates, refills</text><rect x="38.0" y="130" width="284" height="30" rx="5" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.5"/><text x="180" y="146.3" font-size="9.4" text-anchor="middle" fill="#1565C0" font-weight="bold">3 recycle</text><text x="180" y="157.8" font-size="8.0" text-anchor="middle" fill="#666" font-weight="normal">paper, metal, glass, PET</text><rect x="51.0" y="168" width="258" height="30" rx="5" fill="#FFFFFF" stroke="#B66A00" stroke-width="1.5"/><text x="180" y="184.3" font-size="9.4" text-anchor="middle" fill="#B66A00" font-weight="bold">4 recover</text><text x="180" y="195.8" font-size="8.0" text-anchor="middle" fill="#666" font-weight="normal">compost, biogas, RDF, heat</text><rect x="64.0" y="206" width="232" height="30" rx="5" fill="#FFFFFF" stroke="#BD2543" stroke-width="1.5"/><text x="180" y="222.3" font-size="9.4" text-anchor="middle" fill="#BD2543" font-weight="bold">5 dispose</text><text x="180" y="233.8" font-size="8.0" text-anchor="middle" fill="#666" font-weight="normal">sanitary landfill, inert only</text><path d="M348 60L348.0 223.8" fill="none" stroke="#666" stroke-width="1.4" stroke-linecap="round"/><path d="M350.5 222.0L348.0 228.0L345.5 222.0Z" fill="#666"/><rect x="8.0" y="249.0" width="344" height="26" rx="7" fill="#E0F2F1" stroke="#00695C" stroke-width="1.6"/><text x="180" y="265.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">wet 55 % to compost, dry 30 % to recycling or RDF</text><text x="180" y="295.1" font-size="9.0" text-anchor="middle" fill="#666" font-weight="normal">Only the inert reject should reach the landfill.</text><text x="180" y="309.1" font-size="9.0" text-anchor="middle" fill="#666" font-weight="normal">Mixed waste goes nowhere useful - it can only be dumped.</text></svg>