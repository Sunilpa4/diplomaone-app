<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 322" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="322" fill="#ffffff"/><text x="180" y="25.4" font-size="12.6" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Two costs per source: money and carbon</text><text x="180" y="42.4" font-size="9.6" text-anchor="middle" fill="#666" font-weight="normal">levelised cost in rupees per kWh, emissions per kWh</text><text x="20" y="68.9" font-size="8.4" text-anchor="start" fill="#666" font-weight="bold">source</text><text x="180" y="68.9" font-size="8.4" text-anchor="middle" fill="#666" font-weight="bold">cost, Rs/kWh</text><text x="348" y="68.9" font-size="8.4" text-anchor="end" fill="#666" font-weight="bold">g CO2/kWh</text><rect x="12" y="74" width="336" height="30" rx="5" fill="#F7F9FC" stroke="#2E7D32" stroke-width="1.3"/><text x="20" y="96.2" font-size="9.0" text-anchor="start" fill="#222" font-weight="bold">solar PV</text><text x="180" y="96.2" font-size="9.0" text-anchor="middle" fill="#2E7D32" font-weight="normal">2.5 - 3.2</text><text x="340" y="96.2" font-size="9.0" text-anchor="end" fill="#2E7D32" font-weight="normal">45</text><rect x="12" y="110" width="336" height="30" rx="5" fill="#F7F9FC" stroke="#00695C" stroke-width="1.3"/><text x="20" y="132.2" font-size="9.0" text-anchor="start" fill="#222" font-weight="bold">on-shore wind</text><text x="180" y="132.2" font-size="9.0" text-anchor="middle" fill="#00695C" font-weight="normal">3.0 - 3.8</text><text x="340" y="132.2" font-size="9.0" text-anchor="end" fill="#00695C" font-weight="normal">12</text><rect x="12" y="146" width="336" height="30" rx="5" fill="#F7F9FC" stroke="#BD2543" stroke-width="1.3"/><text x="20" y="168.2" font-size="9.0" text-anchor="start" fill="#222" font-weight="bold">new coal</text><text x="180" y="168.2" font-size="9.0" text-anchor="middle" fill="#BD2543" font-weight="normal">4.5 - 6.0</text><text x="340" y="168.2" font-size="9.0" text-anchor="end" fill="#BD2543" font-weight="normal">900</text><rect x="12" y="182" width="336" height="30" rx="5" fill="#F7F9FC" stroke="#B66A00" stroke-width="1.3"/><text x="20" y="204.2" font-size="9.0" text-anchor="start" fill="#222" font-weight="bold">natural gas</text><text x="180" y="204.2" font-size="9.0" text-anchor="middle" fill="#B66A00" font-weight="normal">5.0 - 6.5</text><text x="340" y="204.2" font-size="9.0" text-anchor="end" fill="#B66A00" font-weight="normal">450</text><rect x="12" y="218" width="336" height="30" rx="5" fill="#F7F9FC" stroke="#7B2CD9" stroke-width="1.3"/><text x="20" y="240.2" font-size="9.0" text-anchor="start" fill="#222" font-weight="bold">diesel genset</text><text x="180" y="240.2" font-size="9.0" text-anchor="middle" fill="#7B2CD9" font-weight="normal">18.0 - 22.0</text><text x="340" y="240.2" font-size="9.0" text-anchor="end" fill="#7B2CD9" font-weight="normal">780</text><rect x="8.0" y="253.0" width="344" height="30" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="271.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">cost per unit is not the same as cost per firm unit</text><text x="180" y="303.1" font-size="9.0" text-anchor="middle" fill="#666" font-weight="normal">Solar and wind are cheapest to run but variable; coal is firm and dirty.</text><text x="180" y="317.1" font-size="9.0" text-anchor="middle" fill="#666" font-weight="normal">Add storage or gas for the evening peak before comparing.</text></svg>