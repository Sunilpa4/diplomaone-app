<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 324" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="324" fill="#ffffff"/><text x="180" y="25.4" font-size="12.6" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Prefer the top rung whenever you can</text><text x="180" y="42.4" font-size="9.6" text-anchor="middle" fill="#666" font-weight="normal">each rung down costs energy and market</text><rect x="12" y="56" width="336" height="34" rx="5" fill="#2E7D32" fill-opacity="0.10" stroke="#2E7D32" stroke-width="1.3"/><text x="22" y="74.1" font-size="8.8" text-anchor="start" fill="#2E7D32" font-weight="bold">1 Refuse</text><text x="22" y="86.5" font-size="7.2" text-anchor="start" fill="#222" font-weight="normal">say no to the bag, the straw, the sampler</text><text x="338" y="80.4" font-size="6.8" text-anchor="end" fill="#666" font-weight="normal">no waste at all</text><rect x="26" y="96" width="322" height="34" rx="5" fill="#00695C" fill-opacity="0.10" stroke="#00695C" stroke-width="1.3"/><text x="36" y="114.1" font-size="8.8" text-anchor="start" fill="#00695C" font-weight="bold">2 Reduce</text><text x="36" y="126.5" font-size="7.2" text-anchor="start" fill="#222" font-weight="normal">five-star AC, bucket bath, half the print</text><text x="338" y="120.4" font-size="6.8" text-anchor="end" fill="#666" font-weight="normal">less per use</text><rect x="40" y="136" width="308" height="34" rx="5" fill="#1565C0" fill-opacity="0.10" stroke="#1565C0" stroke-width="1.3"/><text x="50" y="154.1" font-size="8.8" text-anchor="start" fill="#1565C0" font-weight="bold">3 Reuse</text><text x="50" y="166.5" font-size="7.2" text-anchor="start" fill="#222" font-weight="normal">steel bottle, refill pack, returnable crate</text><text x="338" y="160.4" font-size="6.8" text-anchor="end" fill="#666" font-weight="normal">same object, many uses</text><rect x="54" y="176" width="294" height="34" rx="5" fill="#B66A00" fill-opacity="0.10" stroke="#B66A00" stroke-width="1.3"/><text x="64" y="194.1" font-size="8.8" text-anchor="start" fill="#B66A00" font-weight="bold">4 Repurpose</text><text x="64" y="206.5" font-size="7.2" text-anchor="start" fill="#222" font-weight="normal">tyre planter, tub storage, crate shelf</text><text x="338" y="200.4" font-size="6.8" text-anchor="end" fill="#666" font-weight="normal">new job, no remaking</text><rect x="68" y="216" width="280" height="34" rx="5" fill="#7B2CD9" fill-opacity="0.10" stroke="#7B2CD9" stroke-width="1.3"/><text x="78" y="234.1" font-size="8.8" text-anchor="start" fill="#7B2CD9" font-weight="bold">5 Recycle</text><text x="78" y="246.5" font-size="7.2" text-anchor="start" fill="#222" font-weight="normal">paper, metal, glass and PET to a recycler</text><text x="338" y="240.4" font-size="6.8" text-anchor="end" fill="#666" font-weight="normal">energy is spent</text><rect x="8.0" y="256.0" width="344" height="28" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="272.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">the top three rungs need no energy and no market</text><text x="180" y="303.1" font-size="9.0" text-anchor="middle" fill="#666" font-weight="normal">Segregate at the source: mixed waste cannot be recycled, only dumped.</text><text x="180" y="317.1" font-size="9.0" text-anchor="middle" fill="#666" font-weight="normal">The fifth rung is the last resort, not the first plan.</text></svg>