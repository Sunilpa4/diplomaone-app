<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 334" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="334" fill="#ffffff"/><text x="180" y="25.4" font-size="12.6" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Five routes out of the same heap</text><text x="180" y="42.4" font-size="9.6" text-anchor="middle" fill="#666" font-weight="normal">the route decides the product</text><rect x="8.0" y="47.0" width="344" height="30" rx="7" fill="#E0F2F1" stroke="#00695C" stroke-width="1.6"/><text x="180" y="65.0" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">biomass: dung, straw, wood, oil and sugar</text><path d="M180 77L180.0 83.8" fill="none" stroke="#00695C" stroke-width="1.3" stroke-linecap="round"/><path d="M182.5 82.0L180.0 88.0L177.5 82.0Z" fill="#00695C"/><rect x="12" y="94" width="156" height="26" rx="5" fill="#FFFFFF" stroke="#B66A00" stroke-width="1.3"/><text x="90" y="113.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">burn it</text><path d="M170 107L179.8 107.0" fill="none" stroke="#B66A00" stroke-width="1.3" stroke-linecap="round"/><path d="M178.0 104.5L184.0 107.0L178.0 109.5Z" fill="#B66A00"/><rect x="186" y="94" width="162" height="26" rx="5" fill="#B66A00" fill-opacity="0.08" stroke="#B66A00" stroke-width="1.3"/><text x="267" y="113.8" font-size="8.0" text-anchor="middle" fill="#B66A00" font-weight="normal">heat and steam</text><rect x="12" y="128" width="156" height="26" rx="5" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.3"/><text x="90" y="147.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">digest it in a sealed tank</text><path d="M170 141L179.8 141.0" fill="none" stroke="#2E7D32" stroke-width="1.3" stroke-linecap="round"/><path d="M178.0 138.5L184.0 141.0L178.0 143.5Z" fill="#2E7D32"/><rect x="186" y="128" width="162" height="26" rx="5" fill="#2E7D32" fill-opacity="0.08" stroke="#2E7D32" stroke-width="1.3"/><text x="267" y="147.8" font-size="8.0" text-anchor="middle" fill="#2E7D32" font-weight="normal">biogas, 55-65 % methane</text><rect x="12" y="162" width="156" height="26" rx="5" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.3"/><text x="90" y="181.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">ferment it with yeast</text><path d="M170 175L179.8 175.0" fill="none" stroke="#1565C0" stroke-width="1.3" stroke-linecap="round"/><path d="M178.0 172.5L184.0 175.0L178.0 177.5Z" fill="#1565C0"/><rect x="186" y="162" width="162" height="26" rx="5" fill="#1565C0" fill-opacity="0.08" stroke="#1565C0" stroke-width="1.3"/><text x="267" y="181.8" font-size="8.0" text-anchor="middle" fill="#1565C0" font-weight="normal">ethanol, then distilled</text><rect x="12" y="196" width="156" height="26" rx="5" fill="#FFFFFF" stroke="#7B2CD9" stroke-width="1.3"/><text x="90" y="215.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">gasify it with little air</text><path d="M170 209L179.8 209.0" fill="none" stroke="#7B2CD9" stroke-width="1.3" stroke-linecap="round"/><path d="M178.0 206.5L184.0 209.0L178.0 211.5Z" fill="#7B2CD9"/><rect x="186" y="196" width="162" height="26" rx="5" fill="#7B2CD9" fill-opacity="0.08" stroke="#7B2CD9" stroke-width="1.3"/><text x="267" y="215.8" font-size="8.0" text-anchor="middle" fill="#7B2CD9" font-weight="normal">producer gas, CO + H2</text><rect x="12" y="230" width="156" height="26" rx="5" fill="#FFFFFF" stroke="#BD2543" stroke-width="1.3"/><text x="90" y="249.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">react oil with methanol</text><path d="M170 243L179.8 243.0" fill="none" stroke="#BD2543" stroke-width="1.3" stroke-linecap="round"/><path d="M178.0 240.5L184.0 243.0L178.0 245.5Z" fill="#BD2543"/><rect x="186" y="230" width="162" height="26" rx="5" fill="#BD2543" fill-opacity="0.08" stroke="#BD2543" stroke-width="1.3"/><text x="267" y="249.8" font-size="8.0" text-anchor="middle" fill="#BD2543" font-weight="normal">biodiesel + glycerol</text><rect x="8.0" y="266.0" width="344" height="28" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="282.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">1 t molasses -&gt; 245 L ethanol;  1 t dung -&gt; 40 m3 of biogas</text><text x="180" y="315.1" font-size="9.0" text-anchor="middle" fill="#666" font-weight="normal">Wet waste goes to a digester, dry waste to a gasifier, sugar to a fermenter.</text><text x="180" y="329.1" font-size="9.0" text-anchor="middle" fill="#666" font-weight="normal">Only a life-cycle sum tells you the real carbon saving.</text></svg>