<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 262" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="262" fill="#ffffff"/><text x="180" y="25.4" font-size="12.6" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Three mechanisms, one warming</text><text x="180" y="42.4" font-size="9.6" text-anchor="middle" fill="#666" font-weight="normal">land, sea and the living world</text><rect x="8" y="56" width="108" height="106" rx="7" fill="#FFFFFF" stroke="#B66A00" stroke-width="1.5"/><text x="62" y="77.2" font-size="9.2" text-anchor="middle" fill="#B66A00" font-weight="bold">land</text><text x="62" y="90.5" font-size="7.2" text-anchor="middle" fill="#666" font-weight="normal">hotter, drier soil</text><text x="62" y="106.5" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">desertification</text><text x="62" y="121.5" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">40 % of India degraded</text><text x="62" y="136.5" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">crop yield down</text><rect x="126" y="56" width="108" height="106" rx="7" fill="#FFFFFF" stroke="#00695C" stroke-width="1.5"/><text x="180" y="77.2" font-size="9.2" text-anchor="middle" fill="#00695C" font-weight="bold">ocean</text><text x="180" y="90.5" font-size="7.2" text-anchor="middle" fill="#666" font-weight="normal">warmer and more acidic</text><text x="180" y="106.5" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">pH 8.2 -&gt; 8.1</text><text x="180" y="121.5" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">corals bleach</text><text x="180" y="136.5" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">shells grow slowly</text><rect x="244" y="56" width="108" height="106" rx="7" fill="#FFFFFF" stroke="#BD2543" stroke-width="1.5"/><text x="298" y="77.2" font-size="9.2" text-anchor="middle" fill="#BD2543" font-weight="bold">life</text><text x="298" y="90.5" font-size="7.2" text-anchor="middle" fill="#666" font-weight="normal">ranges and timing shift</text><text x="298" y="106.5" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">species move 10 km/decade</text><text x="298" y="121.5" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">9 % at risk at 1.5 C</text><text x="298" y="136.5" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">29 % at 3 C</text><rect x="8" y="170" width="344" height="34" rx="6" fill="#F3EBFD" stroke="#7B2CD9" stroke-width="1.4"/><text x="180" y="187.9" font-size="8.4" text-anchor="middle" fill="#7B2CD9" font-weight="bold">risk = hazard x exposure x vulnerability</text><text x="180" y="199.7" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">the same heat kills more where people are poor</text><text x="180" y="229.2" font-size="9.0" text-anchor="middle" fill="#666" font-weight="normal">Reefs shelter a quarter of marine species and protect the coast.</text><text x="180" y="243.2" font-size="9.0" text-anchor="middle" fill="#666" font-weight="normal">Adaptation is local and immediate; mitigation is global and slow.</text></svg>