<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="320" fill="#ffffff"/><text x="180" y="25.4" font-size="12.6" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Three routes into the same bathtub</text><text x="180" y="42.4" font-size="9.6" text-anchor="middle" fill="#666" font-weight="normal">millimetres per year</text><rect x="12" y="66" width="336" height="36" rx="5" fill="#FFFFFF" stroke="#B66A00" stroke-width="1.3"/><text x="22" y="84.1" font-size="8.8" text-anchor="start" fill="#B66A00" font-weight="bold">thermal expansion</text><text x="22" y="96.6" font-size="7.4" text-anchor="start" fill="#666" font-weight="normal">water expands as it warms</text><rect x="196" y="76" width="64" height="14" rx="3" fill="#B66A00" fill-opacity="0.35" stroke="#B66A00" stroke-width="0.8"/><text x="264.4" y="89.7" font-size="7.8" text-anchor="start" fill="#B66A00" font-weight="normal">1.4 mm</text><rect x="12" y="108" width="336" height="36" rx="5" fill="#FFFFFF" stroke="#00695C" stroke-width="1.3"/><text x="22" y="126.1" font-size="8.8" text-anchor="start" fill="#00695C" font-weight="bold">mountain glaciers</text><text x="22" y="138.6" font-size="7.4" text-anchor="start" fill="#666" font-weight="normal">Himalaya, Alps, Andes</text><rect x="196" y="118" width="37" height="14" rx="3" fill="#00695C" fill-opacity="0.35" stroke="#00695C" stroke-width="0.8"/><text x="236.8" y="131.7" font-size="7.8" text-anchor="start" fill="#00695C" font-weight="normal">0.8 mm</text><rect x="12" y="150" width="336" height="36" rx="5" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.3"/><text x="22" y="168.1" font-size="8.8" text-anchor="start" fill="#1565C0" font-weight="bold">ice sheets</text><text x="22" y="180.6" font-size="7.4" text-anchor="start" fill="#666" font-weight="normal">Greenland, West Antarctica</text><rect x="196" y="160" width="37" height="14" rx="3" fill="#1565C0" fill-opacity="0.35" stroke="#1565C0" stroke-width="0.8"/><text x="236.8" y="173.7" font-size="7.8" text-anchor="start" fill="#1565C0" font-weight="normal">0.8 mm</text><path d="M12 198L348 198" fill="none" stroke="#666" stroke-width="1.0" stroke-linecap="round" stroke-dasharray="3 2"/><text x="180" y="219.0" font-size="8.6" text-anchor="middle" fill="#222" font-weight="bold">total about 4.5 mm a year, 20 cm since 1900</text><rect x="60" y="236" width="240" height="34" rx="2" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.2"/><text x="180" y="259.7" font-size="7.8" text-anchor="middle" fill="#1565C0" font-weight="normal">1 mm of sea level = 361 Gt of water</text><text x="180" y="295.1" font-size="9.0" text-anchor="middle" fill="#666" font-weight="normal">Melting sea ice adds nothing: it already floats.</text><text x="180" y="309.1" font-size="9.0" text-anchor="middle" fill="#666" font-weight="normal">The ice sheets hold enough water for 65 m, and respond over centuries.</text></svg>