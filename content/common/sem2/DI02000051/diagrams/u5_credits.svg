<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 292" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="292" fill="#ffffff"/><text x="180" y="25.4" font-size="12.6" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Follow one tonne of CO2e through the market</text><text x="180" y="42.4" font-size="9.6" text-anchor="middle" fill="#666" font-weight="normal">who measures, who pays</text><rect x="14" y="56" width="104" height="42" rx="6" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.5"/><text x="66" y="74.9" font-size="8.4" text-anchor="middle" fill="#1565C0" font-weight="bold">1 the project</text><text x="66" y="88.5" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">cuts beyond law</text><rect x="128" y="56" width="104" height="42" rx="6" fill="#FFFFFF" stroke="#00695C" stroke-width="1.5"/><text x="180" y="74.9" font-size="8.4" text-anchor="middle" fill="#00695C" font-weight="bold">2 the verifier</text><text x="180" y="88.5" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">checks baseline</text><rect x="242" y="56" width="104" height="42" rx="6" fill="#FFFFFF" stroke="#7B2CD9" stroke-width="1.5"/><text x="294" y="74.9" font-size="8.4" text-anchor="middle" fill="#7B2CD9" font-weight="bold">3 one credit</text><text x="294" y="88.5" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">= 1 t CO2e</text><path d="M118 77L123.8 77.0" fill="none" stroke="#666" stroke-width="1.2" stroke-linecap="round"/><path d="M122.0 74.5L128.0 77.0L122.0 79.5Z" fill="#666"/><path d="M232 77L237.8 77.0" fill="none" stroke="#666" stroke-width="1.2" stroke-linecap="round"/><path d="M236.0 74.5L242.0 77.0L236.0 79.5Z" fill="#666"/><rect x="8" y="108" width="344" height="32" rx="6" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.4"/><text x="180" y="124.9" font-size="8.2" text-anchor="middle" fill="#2E7D32" font-weight="bold">the buyer pays, then the credit is retired</text><text x="180" y="136.6" font-size="7.4" text-anchor="middle" fill="#222" font-weight="normal">one credit, one owner, one use - then cancelled</text><rect x="10" y="150" width="164" height="86" rx="6" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.4"/><text x="92" y="168.9" font-size="8.2" text-anchor="middle" fill="#2E7D32" font-weight="bold">what it gains</text><text x="92" y="186.5" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">cheapest cut first</text><text x="92" y="200.5" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">private money</text><text x="92" y="214.5" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">a tradeable unit</text><rect x="186" y="150" width="164" height="86" rx="6" fill="#FFFFFF" stroke="#BD2543" stroke-width="1.4"/><text x="268" y="168.9" font-size="8.2" text-anchor="middle" fill="#BD2543" font-weight="bold">what it risks</text><text x="268" y="186.5" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">additionality</text><text x="268" y="200.5" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">permanence, leakage</text><text x="268" y="214.5" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">double counting</text><text x="180" y="255.2" font-size="9.0" text-anchor="middle" fill="#666" font-weight="normal">A credit for what would have happened anyway is a payment.</text><text x="180" y="269.1" font-size="9.0" text-anchor="middle" fill="#666" font-weight="normal">Use the market last: cut your own emissions, then offset what is left.</text></svg>