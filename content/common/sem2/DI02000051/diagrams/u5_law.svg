<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 314" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="314" fill="#ffffff"/><text x="180" y="25.4" font-size="12.6" text-anchor="middle" fill="#7B2CD9" font-weight="bold">The chain from statute to compliance</text><text x="180" y="42.4" font-size="9.6" text-anchor="middle" fill="#666" font-weight="normal">who does what, in that order</text><rect x="22" y="56" width="316" height="36" rx="6" fill="#FFFFFF" stroke="#7B2CD9" stroke-width="1.5"/><text x="180" y="74.1" font-size="8.8" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Parliament - the Act</text><text x="180" y="86.6" font-size="7.4" text-anchor="middle" fill="#222" font-weight="normal">Water 1974, Air 1981, EP Act 1986 umbrella</text><path d="M180 92L180.0 97.8" fill="none" stroke="#666" stroke-width="1.2" stroke-linecap="round"/><path d="M182.5 96.0L180.0 102.0L177.5 96.0Z" fill="#666"/><rect x="22" y="103" width="316" height="36" rx="6" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.5"/><text x="180" y="121.1" font-size="8.8" text-anchor="middle" fill="#1565C0" font-weight="bold">MoEFCC - rules and standards</text><text x="180" y="133.6" font-size="7.4" text-anchor="middle" fill="#222" font-weight="normal">EIA 2006, waste rules, emission limits</text><path d="M180 139L180.0 144.8" fill="none" stroke="#666" stroke-width="1.2" stroke-linecap="round"/><path d="M182.5 143.0L180.0 149.0L177.5 143.0Z" fill="#666"/><rect x="22" y="150" width="316" height="36" rx="6" fill="#FFFFFF" stroke="#00695C" stroke-width="1.5"/><text x="180" y="168.1" font-size="8.8" text-anchor="middle" fill="#00695C" font-weight="bold">SPCB - consent to establish</text><text x="180" y="180.6" font-size="7.4" text-anchor="middle" fill="#222" font-weight="normal">site, process and planned control checked</text><path d="M180 186L180.0 191.8" fill="none" stroke="#666" stroke-width="1.2" stroke-linecap="round"/><path d="M182.5 190.0L180.0 196.0L177.5 190.0Z" fill="#666"/><rect x="22" y="197" width="316" height="36" rx="6" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.5"/><text x="180" y="215.1" font-size="8.8" text-anchor="middle" fill="#2E7D32" font-weight="bold">SPCB - consent to operate</text><text x="180" y="227.6" font-size="7.4" text-anchor="middle" fill="#222" font-weight="normal">quantity, quality, monitoring, conditions</text><rect x="8" y="244" width="344" height="28" rx="6" fill="#F3EBFD" stroke="#7B2CD9" stroke-width="1.4"/><text x="180" y="264.9" font-size="8.2" text-anchor="middle" fill="#7B2CD9" font-weight="bold">NGT 2010: appeal, compensation, restitution</text><text x="180" y="293.1" font-size="9.0" text-anchor="middle" fill="#666" font-weight="normal">An Act gives power, a rule gives a number, a consent gives permission.</text><text x="180" y="307.1" font-size="9.0" text-anchor="middle" fill="#666" font-weight="normal">Working outside a consent is an offence, not a paperwork issue.</text></svg>