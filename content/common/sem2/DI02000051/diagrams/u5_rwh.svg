<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 327" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="327" fill="#ffffff"/><text x="180" y="25.4" font-size="12.6" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Five stages from the terrace to the ground</text><text x="180" y="42.4" font-size="9.6" text-anchor="middle" fill="#666" font-weight="normal">a school roof of 800 m2</text><rect x="14" y="54" width="332" height="34" rx="6" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.4"/><text x="24" y="71.0" font-size="8.6" text-anchor="start" fill="#1565C0" font-weight="bold">1 roof catchment</text><text x="24" y="83.6" font-size="7.4" text-anchor="start" fill="#222" font-weight="normal">800 m2 terrace, sloping to four outlets</text><path d="M180 88L180.0 90.8" fill="none" stroke="#666" stroke-width="1.2" stroke-linecap="round"/><path d="M182.5 89.0L180.0 95.0L177.5 89.0Z" fill="#666"/><rect x="14" y="95" width="332" height="34" rx="6" fill="#FFFFFF" stroke="#00695C" stroke-width="1.4"/><text x="24" y="112.0" font-size="8.6" text-anchor="start" fill="#00695C" font-weight="bold">2 gutter and first flush</text><text x="24" y="124.6" font-size="7.4" text-anchor="start" fill="#222" font-weight="normal">mesh strainer; the first 2 mm is thrown away</text><path d="M180 129L180.0 131.8" fill="none" stroke="#666" stroke-width="1.2" stroke-linecap="round"/><path d="M182.5 130.0L180.0 136.0L177.5 130.0Z" fill="#666"/><rect x="14" y="136" width="332" height="34" rx="6" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.4"/><text x="24" y="153.0" font-size="8.6" text-anchor="start" fill="#2E7D32" font-weight="bold">3 filter</text><text x="24" y="165.6" font-size="7.4" text-anchor="start" fill="#222" font-weight="normal">sand, gravel and a charcoal layer</text><path d="M180 170L180.0 172.8" fill="none" stroke="#666" stroke-width="1.2" stroke-linecap="round"/><path d="M182.5 171.0L180.0 177.0L177.5 171.0Z" fill="#666"/><rect x="14" y="177" width="332" height="34" rx="6" fill="#FFFFFF" stroke="#B66A00" stroke-width="1.4"/><text x="24" y="194.0" font-size="8.6" text-anchor="start" fill="#B66A00" font-weight="bold">4 storage tank</text><text x="24" y="206.6" font-size="7.4" text-anchor="start" fill="#222" font-weight="normal">40 m3 RCC, mosquito-proof cover, overflow pipe</text><path d="M180 211L180.0 213.8" fill="none" stroke="#666" stroke-width="1.2" stroke-linecap="round"/><path d="M182.5 212.0L180.0 218.0L177.5 212.0Z" fill="#666"/><rect x="14" y="218" width="332" height="34" rx="6" fill="#FFFFFF" stroke="#7B2CD9" stroke-width="1.4"/><text x="24" y="235.0" font-size="8.6" text-anchor="start" fill="#7B2CD9" font-weight="bold">5 recharge pit</text><text x="24" y="247.6" font-size="7.4" text-anchor="start" fill="#222" font-weight="normal">3 m x 3 m of boulders, gravel and sand</text><rect x="8" y="259" width="344" height="28" rx="6" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.4"/><text x="180" y="273.9" font-size="8.2" text-anchor="middle" fill="#2E7D32" font-weight="bold">V = roof area x rain x runoff coefficient</text><text x="180" y="284.5" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">800 x 1.0 m x 0.85 = 680 m3, about 6,80,000 litres a year</text><text x="180" y="306.1" font-size="9.0" text-anchor="middle" fill="#666" font-weight="normal">Store what the school needs, recharge the rest into the aquifer.</text><text x="180" y="320.1" font-size="9.0" text-anchor="middle" fill="#666" font-weight="normal">A tank that is not cleaned is a mosquito farm, not a water source.</text></svg>