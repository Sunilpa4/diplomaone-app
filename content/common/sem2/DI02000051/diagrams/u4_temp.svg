<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 276" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="276" fill="#ffffff"/><text x="180" y="25.4" font-size="12.6" text-anchor="middle" fill="#7B2CD9" font-weight="bold">The curve, and the two fingerprints</text><text x="180" y="42.4" font-size="9.6" text-anchor="middle" fill="#666" font-weight="normal">global mean surface temperature</text><path d="M52 150L208 150" fill="none" stroke="#666" stroke-width="1.2" stroke-linecap="round"/><path d="M52 150L52 50" fill="none" stroke="#666" stroke-width="1.2" stroke-linecap="round"/><text x="44" y="64.7" font-size="7.6" text-anchor="end" fill="#666" font-weight="normal">+1.2 C</text><text x="44" y="154.7" font-size="7.6" text-anchor="end" fill="#666" font-weight="normal">0</text><text x="52" y="168.7" font-size="7.6" text-anchor="start" fill="#666" font-weight="normal">1850</text><text x="204" y="168.7" font-size="7.6" text-anchor="middle" fill="#666" font-weight="normal">2023</text><path d="M52 148L76 147L96 144L116 143L136 139L156 133L176 120L194 96L200 84" fill="none" stroke="#BD2543" stroke-width="2.2"/><text x="120" y="184.7" font-size="7.6" text-anchor="middle" fill="#666" font-weight="normal">measured record and proxies</text><text x="268" y="63.0" font-size="8.6" text-anchor="middle" fill="#7B2CD9" font-weight="bold">two fingerprints</text><rect x="210" y="70" width="138" height="42" rx="5" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.2"/><text x="279" y="86.7" font-size="7.6" text-anchor="middle" fill="#1565C0" font-weight="normal">with greenhouse gases</text><text x="279" y="98.5" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">troposphere warms,</text><text x="279" y="108.5" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">stratosphere cools</text><rect x="210" y="118" width="138" height="42" rx="5" fill="#FDECF0" stroke="#BD2543" stroke-width="1.2"/><text x="279" y="134.7" font-size="7.6" text-anchor="middle" fill="#BD2543" font-weight="normal">with a brighter sun</text><text x="279" y="146.5" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">both layers warm,</text><text x="279" y="156.5" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">so this is not it</text><rect x="8.0" y="194.0" width="344" height="28" rx="7" fill="#F3EBFD" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="210.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">nights warm faster than days, winters faster than summers</text><text x="180" y="249.2" font-size="9.0" text-anchor="middle" fill="#666" font-weight="normal">Ice cores hold 800 000 years of air; CO2 stayed under 300 ppm.</text><text x="180" y="263.1" font-size="9.0" text-anchor="middle" fill="#666" font-weight="normal">One cold winter is weather; the thirty-year average is climate.</text></svg>