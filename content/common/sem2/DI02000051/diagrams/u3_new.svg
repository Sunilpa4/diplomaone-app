<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 274" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="274" fill="#ffffff"/><text x="180" y="25.4" font-size="12.6" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Three sources for three different jobs</text><text x="180" y="42.4" font-size="9.6" text-anchor="middle" fill="#666" font-weight="normal">firm heat, tidal motion, clean carrier</text><rect x="8" y="58" width="108" height="118" rx="7" fill="#FFFFFF" stroke="#B66A00" stroke-width="1.5"/><text x="62" y="79.2" font-size="9.2" text-anchor="middle" fill="#B66A00" font-weight="bold">geothermal</text><text x="62" y="94.6" font-size="7.4" text-anchor="middle" fill="#666" font-weight="normal">heat from 3 km down</text><rect x="126" y="58" width="108" height="118" rx="7" fill="#FFFFFF" stroke="#00695C" stroke-width="1.5"/><text x="180" y="79.2" font-size="9.2" text-anchor="middle" fill="#00695C" font-weight="bold">ocean</text><text x="180" y="94.6" font-size="7.4" text-anchor="middle" fill="#666" font-weight="normal">tide, wave, OTEC</text><rect x="244" y="58" width="108" height="118" rx="7" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.5"/><text x="298" y="79.2" font-size="9.2" text-anchor="middle" fill="#1565C0" font-weight="bold">hydrogen</text><text x="298" y="94.6" font-size="7.4" text-anchor="middle" fill="#666" font-weight="normal">electrolysis, fuel cell</text><text x="62" y="118.6" font-size="7.4" text-anchor="middle" fill="#B66A00" font-weight="normal">binary</text><text x="62" y="130.6" font-size="7.4" text-anchor="middle" fill="#B66A00" font-weight="normal">cycle</text><text x="62" y="148.6" font-size="7.4" text-anchor="middle" fill="#B66A00" font-weight="normal">firm, 80 %</text><text x="62" y="160.6" font-size="7.4" text-anchor="middle" fill="#B66A00" font-weight="normal">capacity</text><text x="180" y="118.6" font-size="7.4" text-anchor="middle" fill="#00695C" font-weight="normal">barrage,</text><text x="180" y="130.6" font-size="7.4" text-anchor="middle" fill="#00695C" font-weight="normal">stream,</text><text x="180" y="142.6" font-size="7.4" text-anchor="middle" fill="#00695C" font-weight="normal">OTEC, wave</text><text x="180" y="160.6" font-size="7.4" text-anchor="middle" fill="#00695C" font-weight="normal">predictable</text><text x="298" y="118.6" font-size="7.4" text-anchor="middle" fill="#1565C0" font-weight="normal">green H2</text><text x="298" y="130.6" font-size="7.4" text-anchor="middle" fill="#1565C0" font-weight="normal">fuel cell</text><text x="298" y="148.6" font-size="7.4" text-anchor="middle" fill="#1565C0" font-weight="normal">zero at use</text><text x="298" y="160.6" font-size="7.4" text-anchor="middle" fill="#1565C0" font-weight="normal">30-35 %</text><rect x="8.0" y="181.0" width="344" height="30" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="198.9" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">geothermal 44 MW heat in, 5.3 MW out - a tidal basin 362 GJ per filling</text><text x="180" y="241.2" font-size="9.0" text-anchor="middle" fill="#666" font-weight="normal">Hydrogen is a carrier, not a source: it must be made first.</text><text x="180" y="255.2" font-size="9.0" text-anchor="middle" fill="#666" font-weight="normal">Tidal timing is fixed by the moon, so the output can be sold years ahead.</text></svg>