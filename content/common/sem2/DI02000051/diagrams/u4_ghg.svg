<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 316" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="316" fill="#ffffff"/><text x="180" y="25.4" font-size="12.6" text-anchor="middle" fill="#7B2CD9" font-weight="bold">GWP and share of the warming</text><text x="180" y="42.4" font-size="9.6" text-anchor="middle" fill="#666" font-weight="normal">strength per kilogram, then share</text><rect x="12" y="62" width="336" height="34" rx="5" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.3"/><text x="22" y="80.2" font-size="9.0" text-anchor="start" fill="#1565C0" font-weight="bold">CO2</text><text x="22" y="91.7" font-size="7.6" text-anchor="start" fill="#666" font-weight="normal">GWP 1</text><rect x="150" y="71" width="134" height="16" rx="3" fill="#1565C0" fill-opacity="0.30" stroke="#1565C0" stroke-width="0.8"/><text x="296" y="85.8" font-size="8.0" text-anchor="start" fill="#1565C0" font-weight="normal">64 %</text><rect x="12" y="102" width="336" height="34" rx="5" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.3"/><text x="22" y="120.2" font-size="9.0" text-anchor="start" fill="#2E7D32" font-weight="bold">CH4</text><text x="22" y="131.7" font-size="7.6" text-anchor="start" fill="#666" font-weight="normal">GWP 28</text><rect x="150" y="111" width="36" height="16" rx="3" fill="#2E7D32" fill-opacity="0.30" stroke="#2E7D32" stroke-width="0.8"/><text x="296" y="125.8" font-size="8.0" text-anchor="start" fill="#2E7D32" font-weight="normal">17 %</text><rect x="12" y="142" width="336" height="34" rx="5" fill="#FFFFFF" stroke="#B66A00" stroke-width="1.3"/><text x="22" y="160.2" font-size="9.0" text-anchor="start" fill="#B66A00" font-weight="bold">N2O</text><text x="22" y="171.7" font-size="7.6" text-anchor="start" fill="#666" font-weight="normal">GWP 265</text><rect x="150" y="151" width="13" height="16" rx="3" fill="#B66A00" fill-opacity="0.30" stroke="#B66A00" stroke-width="0.8"/><text x="296" y="165.8" font-size="8.0" text-anchor="start" fill="#B66A00" font-weight="normal">6 %</text><rect x="12" y="182" width="336" height="34" rx="5" fill="#FFFFFF" stroke="#7B2CD9" stroke-width="1.3"/><text x="22" y="200.2" font-size="9.0" text-anchor="start" fill="#7B2CD9" font-weight="bold">F-gases</text><text x="22" y="211.7" font-size="7.6" text-anchor="start" fill="#666" font-weight="normal">GWP up to 14 800</text><rect x="150" y="191" width="6" height="16" rx="3" fill="#7B2CD9" fill-opacity="0.30" stroke="#7B2CD9" stroke-width="0.8"/><text x="296" y="205.8" font-size="8.0" text-anchor="start" fill="#7B2CD9" font-weight="normal">3 %</text><text x="180" y="230.7" font-size="7.6" text-anchor="middle" fill="#666" font-weight="normal">bar = share of the observed warming</text><rect x="8.0" y="244.0" width="344" height="28" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="260.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">a tonne of landfill methane warms like 28 t of CO2</text><text x="180" y="293.1" font-size="9.0" text-anchor="middle" fill="#666" font-weight="normal">CO2 sets the long trend; methane sets the speed.</text><text x="180" y="307.1" font-size="9.0" text-anchor="middle" fill="#666" font-weight="normal">Water vapour is a feedback and is not counted as a forcing.</text></svg>