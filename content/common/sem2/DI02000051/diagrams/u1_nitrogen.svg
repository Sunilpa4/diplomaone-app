<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 292" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="292" fill="#ffffff"/><text x="180" y="25.6" font-size="13.0" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Five steps of the nitrogen cycle</text><text x="180" y="43.4" font-size="9.6" text-anchor="middle" fill="#666" font-weight="normal">N2 -&gt; NH3 -&gt; NO3- -&gt; life -&gt; N2</text><rect x="6.0" y="65.0" width="100" height="38" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="56" y="81.7" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">N2 in air</text><text x="56" y="92.5" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">78 %</text><rect x="128.0" y="65.0" width="104" height="38" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="81.7" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">fixation</text><text x="180" y="92.3" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">NH3 / NH4+</text><rect x="254.0" y="65.0" width="100" height="38" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="304" y="81.7" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">nitrification</text><text x="304" y="92.3" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">NO3-</text><rect x="254.0" y="167.0" width="100" height="38" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="304" y="189.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">plants absorb</text><rect x="128.0" y="167.0" width="104" height="38" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="189.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">animals eat</text><rect x="6.0" y="167.0" width="100" height="38" rx="7" fill="#EFEFEF" stroke="#888" stroke-width="1.6"/><text x="56" y="183.7" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">decomposers</text><text x="56" y="194.3" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">back to NH3</text><path d="M108 84L119.0 84.0" fill="none" stroke="#999" stroke-width="1.4" stroke-linecap="round"/><path d="M126 84L119.0 88.0L119.0 80.0Z" fill="#999"/><path d="M234 84L245.0 84.0" fill="none" stroke="#999" stroke-width="1.4" stroke-linecap="round"/><path d="M252 84L245.0 88.0L245.0 80.0Z" fill="#999"/><path d="M304 105L304.0 158.0" fill="none" stroke="#999" stroke-width="1.4" stroke-linecap="round"/><path d="M304 165L300.0 158.0L308.0 158.0Z" fill="#999"/><path d="M252 186L241.0 186.0" fill="none" stroke="#999" stroke-width="1.4" stroke-linecap="round"/><path d="M234 186L241.0 182.0L241.0 190.0Z" fill="#999"/><path d="M126 186L115.0 186.0" fill="none" stroke="#999" stroke-width="1.4" stroke-linecap="round"/><path d="M108 186L115.0 182.0L115.0 190.0Z" fill="#999"/><path d="M24 165L24.0 112.0" fill="none" stroke="#BD2543" stroke-width="1.6" stroke-linecap="round"/><path d="M24 105L28.0 112.0L20.0 112.0Z" fill="#BD2543"/><text x="32" y="140.8" font-size="8.0" text-anchor="start" fill="#BD2543" font-weight="normal">de-nitrification</text><text x="180" y="235.2" font-size="9.2" text-anchor="middle" fill="#666" font-weight="normal">Bacteria, lightning or the Haber-Bosch plant do the fixing;</text><text x="180" y="249.2" font-size="9.2" text-anchor="middle" fill="#666" font-weight="normal">excess nitrate washes out and causes eutrophication;</text><text x="180" y="263.2" font-size="9.2" text-anchor="middle" fill="#666" font-weight="normal">nitrous oxide from soil is a strong greenhouse gas.</text></svg>