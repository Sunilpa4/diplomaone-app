<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="300" fill="#ffffff"/><text x="180" y="25.4" font-size="12.6" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Short waves in, long waves out</text><text x="180" y="42.4" font-size="9.6" text-anchor="middle" fill="#666" font-weight="normal">340 W/m2 arrives, 340 W/m2 leaves</text><circle cx="52" cy="72" r="13" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.4"/><text x="52" y="96.9" font-size="8.2" text-anchor="middle" fill="#B66A00" font-weight="normal">sun</text><circle cx="222" cy="112" r="30" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><circle cx="222" cy="112" r="42" fill="none" stroke="#7B2CD9" stroke-width="1.0" stroke-dasharray="4 3"/><text x="222" y="113.1" font-size="8.8" text-anchor="middle" fill="#1565C0" font-weight="bold">earth</text><text x="222" y="124.9" font-size="8.2" text-anchor="middle" fill="#1565C0" font-weight="normal">15 C</text><text x="222" y="170.8" font-size="8.0" text-anchor="middle" fill="#7B2CD9" font-weight="normal">the greenhouse layer</text><path d="M68 78L187.8765246275208 101.20190799242339" fill="none" stroke="#B66A00" stroke-width="1.6" stroke-linecap="round"/><path d="M186.6 98.4L192.0 102.0L185.6 103.3Z" fill="#B66A00"/><text x="118" y="76.8" font-size="8.0" text-anchor="middle" fill="#B66A00" font-weight="normal">short wave, 340</text><path d="M198 92L145.7022158741209 63.98332993256476" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round"/><path d="M146.1 67.1L142.0 62.0L148.5 62.6Z" fill="#666"/><text x="126" y="56.7" font-size="7.8" text-anchor="middle" fill="#666" font-weight="normal">100 reflected</text><path d="M222 80L222.0 56.2" fill="none" stroke="#BD2543" stroke-width="1.6" stroke-linecap="round"/><path d="M219.5 58.0L222.0 52.0L224.5 58.0Z" fill="#BD2543"/><text x="232" y="52.9" font-size="8.2" text-anchor="start" fill="#BD2543" font-weight="normal">240 out</text><path d="M288 56L288.0 97.8" fill="none" stroke="#7B2CD9" stroke-width="1.6" stroke-linecap="round"/><path d="M290.5 96.0L288.0 102.0L285.5 96.0Z" fill="#7B2CD9"/><text x="294" y="76.8" font-size="8.0" text-anchor="start" fill="#7B2CD9" font-weight="normal">back</text><text x="294" y="88.8" font-size="8.0" text-anchor="start" fill="#7B2CD9" font-weight="normal">radiation</text><rect x="8.0" y="182.0" width="344" height="28" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="198.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">without the layer the surface would be -18 C, not 15 C</text><rect x="8.0" y="218.0" width="344" height="28" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="180" y="234.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">we have added about 3 W/m2 of forcing since 1750</text><text x="180" y="271.1" font-size="9.0" text-anchor="middle" fill="#666" font-weight="normal">Balance the flows and the temperature holds; unbalance them and it moves.</text><text x="180" y="285.1" font-size="9.0" text-anchor="middle" fill="#666" font-weight="normal">Water vapour is the strongest absorber but it follows the temperature.</text></svg>