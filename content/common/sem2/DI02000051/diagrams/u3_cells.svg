<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 374" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="374" fill="#ffffff"/><text x="180" y="25.4" font-size="12.6" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Efficiency of the cell families</text><text x="180" y="42.4" font-size="9.6" text-anchor="middle" fill="#666" font-weight="normal">laboratory best and commercial module</text><text x="12" y="77.0" font-size="8.6" text-anchor="start" fill="#222" font-weight="normal">perovskite / tandem</text><rect x="146" y="64" width="148" height="7" rx="2" fill="#7B2CD9" fill-opacity="0.28" stroke="#7B2CD9" stroke-width="0.8"/><rect x="146" y="72" width="122" height="7" rx="2" fill="#7B2CD9"/><text x="348" y="77.7" font-size="7.8" text-anchor="end" fill="#7B2CD9" font-weight="normal">27 / 33 %</text><text x="12" y="111.0" font-size="8.6" text-anchor="start" fill="#222" font-weight="normal">monocrystalline Si</text><rect x="146" y="98" width="117" height="7" rx="2" fill="#1565C0" fill-opacity="0.28" stroke="#1565C0" stroke-width="0.8"/><rect x="146" y="106" width="99" height="7" rx="2" fill="#1565C0"/><text x="348" y="111.7" font-size="7.8" text-anchor="end" fill="#1565C0" font-weight="normal">22 / 26 %</text><text x="12" y="145.0" font-size="8.6" text-anchor="start" fill="#222" font-weight="normal">CIGS thin film</text><rect x="146" y="132" width="104" height="7" rx="2" fill="#00695C" fill-opacity="0.28" stroke="#00695C" stroke-width="0.8"/><rect x="146" y="140" width="86" height="7" rx="2" fill="#00695C"/><text x="348" y="145.7" font-size="7.8" text-anchor="end" fill="#00695C" font-weight="normal">19 / 23 %</text><text x="12" y="179.0" font-size="8.6" text-anchor="start" fill="#222" font-weight="normal">polycrystalline Si</text><rect x="146" y="166" width="99" height="7" rx="2" fill="#1565C0" fill-opacity="0.28" stroke="#1565C0" stroke-width="0.8"/><rect x="146" y="174" width="76" height="7" rx="2" fill="#1565C0"/><text x="348" y="179.7" font-size="7.8" text-anchor="end" fill="#1565C0" font-weight="normal">17 / 22 %</text><text x="12" y="213.0" font-size="8.6" text-anchor="start" fill="#222" font-weight="normal">CdTe thin film</text><rect x="146" y="200" width="99" height="7" rx="2" fill="#B66A00" fill-opacity="0.28" stroke="#B66A00" stroke-width="0.8"/><rect x="146" y="208" width="81" height="7" rx="2" fill="#B66A00"/><text x="348" y="213.7" font-size="7.8" text-anchor="end" fill="#B66A00" font-weight="normal">18 / 22 %</text><text x="12" y="247.0" font-size="8.6" text-anchor="start" fill="#222" font-weight="normal">amorphous Si</text><rect x="146" y="234" width="63" height="7" rx="2" fill="#666" fill-opacity="0.28" stroke="#666" stroke-width="0.8"/><rect x="146" y="242" width="36" height="7" rx="2" fill="#666"/><text x="348" y="247.7" font-size="7.8" text-anchor="end" fill="#666" font-weight="normal">8 / 14 %</text><text x="146" y="274.7" font-size="7.6" text-anchor="start" fill="#666" font-weight="normal">module now</text><text x="146" y="286.7" font-size="7.6" text-anchor="start" fill="#666" font-weight="normal">laboratory record</text><rect x="8.0" y="300.0" width="344" height="28" rx="7" fill="#E0F2F1" stroke="#00695C" stroke-width="1.6"/><text x="180" y="317.0" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">a 22 % module on 2.1 m2 makes 460 W under 1 000 W/m2</text><text x="180" y="349.1" font-size="9.0" text-anchor="middle" fill="#666" font-weight="normal">Choose by area, climate and budget, not by the record in a laboratory.</text><text x="180" y="363.1" font-size="9.0" text-anchor="middle" fill="#666" font-weight="normal">Perovskite still fails in damp heat; thin film loses less in high temperature.</text></svg>