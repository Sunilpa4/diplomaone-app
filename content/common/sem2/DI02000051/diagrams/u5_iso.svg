<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 288" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="288" fill="#ffffff"/><text x="180" y="25.4" font-size="12.6" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Four steps, repeated, never finished</text><text x="180" y="42.4" font-size="9.6" text-anchor="middle" fill="#666" font-weight="normal">ISO 14001: the system, not the score</text><rect x="10" y="56" width="150" height="64" rx="7" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.5"/><text x="85" y="75.1" font-size="8.8" text-anchor="middle" fill="#1565C0" font-weight="bold">P - Plan</text><text x="85" y="89.5" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">aspects and impacts</text><text x="85" y="101.5" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">legal register</text><text x="85" y="113.5" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">objectives, targets</text><rect x="200" y="56" width="150" height="64" rx="7" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.5"/><text x="275" y="75.1" font-size="8.8" text-anchor="middle" fill="#2E7D32" font-weight="bold">D - Do</text><text x="275" y="89.5" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">roles and training</text><text x="275" y="101.5" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">operating procedures</text><text x="275" y="113.5" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">emergency drills</text><rect x="200" y="132" width="150" height="64" rx="7" fill="#FFFFFF" stroke="#B66A00" stroke-width="1.5"/><text x="275" y="151.1" font-size="8.8" text-anchor="middle" fill="#B66A00" font-weight="bold">C - Check</text><text x="275" y="165.5" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">monitor and measure</text><text x="275" y="177.5" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">calibrate, audit</text><text x="275" y="189.5" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">record non-conformity</text><rect x="10" y="132" width="150" height="64" rx="7" fill="#FFFFFF" stroke="#7B2CD9" stroke-width="1.5"/><text x="85" y="151.1" font-size="8.8" text-anchor="middle" fill="#7B2CD9" font-weight="bold">A - Act</text><text x="85" y="165.5" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">fix the root cause</text><text x="85" y="177.5" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">update the risk score</text><text x="85" y="189.5" font-size="7.2" text-anchor="middle" fill="#222" font-weight="normal">review and re-plan</text><path d="M162 88L193.8 88.0" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round"/><path d="M192.0 85.5L198.0 88.0L192.0 90.5Z" fill="#666"/><path d="M275 120L275.0 127.8" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round"/><path d="M277.5 126.0L275.0 132.0L272.5 126.0Z" fill="#666"/><path d="M198 164L166.2 164.0" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round"/><path d="M168.0 166.5L162.0 164.0L168.0 161.5Z" fill="#666"/><path d="M85 132L85.0 124.2" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round"/><path d="M82.5 126.0L85.0 120.0L87.5 126.0Z" fill="#666"/><text x="180" y="110.9" font-size="8.4" text-anchor="middle" fill="#666" font-weight="bold">PDCA</text><rect x="8" y="206" width="344" height="28" rx="6" fill="#E0F2F1" stroke="#00695C" stroke-width="1.4"/><text x="180" y="226.9" font-size="8.2" text-anchor="middle" fill="#00695C" font-weight="bold">aspect &gt; impact &gt; significant &gt; objective</text><text x="180" y="255.2" font-size="9.0" text-anchor="middle" fill="#666" font-weight="normal">The certificate audits the system; it does not measure the emissions.</text><text x="180" y="269.1" font-size="9.0" text-anchor="middle" fill="#666" font-weight="normal">A certified plant with weak targets is still a polluting plant.</text></svg>