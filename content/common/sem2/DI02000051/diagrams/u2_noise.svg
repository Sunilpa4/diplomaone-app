<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="320" fill="#ffffff"/><text x="180" y="25.5" font-size="12.8" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Decibels grow by powers of ten</text><text x="180" y="42.4" font-size="9.6" text-anchor="middle" fill="#666" font-weight="normal">add 3 dB for a doubling of energy</text><path d="M60 62L60 250" fill="none" stroke="#222" stroke-width="1.4" stroke-linecap="round"/><path d="M56 250.0L64 250.0" fill="none" stroke="#222" stroke-width="1.2" stroke-linecap="round"/><text x="50" y="255.9" font-size="8.2" text-anchor="end" fill="#666" font-weight="normal">0</text><path d="M56 218.66666666666666L64 218.66666666666666" fill="none" stroke="#222" stroke-width="1.2" stroke-linecap="round"/><text x="50" y="224.5" font-size="8.2" text-anchor="end" fill="#666" font-weight="normal">20</text><path d="M56 187.33333333333334L64 187.33333333333334" fill="none" stroke="#222" stroke-width="1.2" stroke-linecap="round"/><text x="50" y="193.2" font-size="8.2" text-anchor="end" fill="#666" font-weight="normal">40</text><path d="M56 156.0L64 156.0" fill="none" stroke="#222" stroke-width="1.2" stroke-linecap="round"/><text x="50" y="161.9" font-size="8.2" text-anchor="end" fill="#666" font-weight="normal">60</text><path d="M56 124.66666666666667L64 124.66666666666667" fill="none" stroke="#222" stroke-width="1.2" stroke-linecap="round"/><text x="50" y="130.5" font-size="8.2" text-anchor="end" fill="#666" font-weight="normal">80</text><path d="M56 93.33333333333331L64 93.33333333333331" fill="none" stroke="#222" stroke-width="1.2" stroke-linecap="round"/><text x="50" y="99.2" font-size="8.2" text-anchor="end" fill="#666" font-weight="normal">100</text><path d="M56 62.0L64 62.0" fill="none" stroke="#222" stroke-width="1.2" stroke-linecap="round"/><text x="50" y="67.9" font-size="8.2" text-anchor="end" fill="#666" font-weight="normal">120</text><path d="M64 218.66666666666666L200 218.66666666666666" fill="none" stroke="#2E7D32" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 2"/><text x="206" y="224.7" font-size="8.6" text-anchor="start" fill="#2E7D32" font-weight="normal">leaves - 20 dB</text><path d="M64 156.0L200 156.0" fill="none" stroke="#00695C" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 2"/><text x="206" y="162.0" font-size="8.6" text-anchor="start" fill="#00695C" font-weight="normal">conversation - 60 dB</text><path d="M64 124.66666666666667L200 124.66666666666667" fill="none" stroke="#B66A00" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 2"/><text x="206" y="130.7" font-size="8.6" text-anchor="start" fill="#B66A00" font-weight="normal">busy road - 80 dB</text><path d="M64 101.16666666666669L200 101.16666666666669" fill="none" stroke="#BD2543" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 2"/><text x="206" y="107.2" font-size="8.6" text-anchor="start" fill="#BD2543" font-weight="normal">factory floor - 95 dB</text><path d="M64 62.0L200 62.0" fill="none" stroke="#BD2543" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 2"/><text x="206" y="68.0" font-size="8.6" text-anchor="start" fill="#BD2543" font-weight="normal">jet at 50 m - 120 dB</text><rect x="8.0" y="255.0" width="344" height="26" rx="7" fill="#F3EBFD" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="271.0" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">day limits: 50 silence, 55 home, 65 market, 75 industry</text><text x="180" y="299.1" font-size="9.0" text-anchor="middle" fill="#666" font-weight="normal">Hearing is at risk above 85 dB for 8 hours; night limits are 5 dB lower.</text><text x="180" y="313.1" font-size="9.0" text-anchor="middle" fill="#666" font-weight="normal">Control at the source, then along the path, then at the ear.</text></svg>