<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 332" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="332" fill="#ffffff"/><text x="180" y="25.4" font-size="12.6" text-anchor="middle" fill="#7B2CD9" font-weight="bold">One axis points at the wind, one does not</text><text x="180" y="42.4" font-size="9.6" text-anchor="middle" fill="#666" font-weight="normal">Cp 0.45-0.50 vs 0.15-0.35</text><text x="96" y="63.3" font-size="9.4" text-anchor="middle" fill="#1565C0" font-weight="bold">HAWT</text><path d="M96 76L96 150" fill="none" stroke="#666" stroke-width="2.6" stroke-linecap="round"/><circle cx="96" cy="76" r="4" fill="#222"/><path d="M96 76L70.01923788646684 61.0" fill="none" stroke="#1565C0" stroke-width="2.2" stroke-linecap="round"/><path d="M96 76L96.0 46.0" fill="none" stroke="#1565C0" stroke-width="2.2" stroke-linecap="round"/><path d="M96 76L121.98076211353316 60.999999999999986" fill="none" stroke="#1565C0" stroke-width="2.2" stroke-linecap="round"/><text x="136" y="92.7" font-size="7.6" text-anchor="start" fill="#1565C0" font-weight="normal">3 blades</text><path d="M60 150L132 150" fill="none" stroke="#222" stroke-width="2.0" stroke-linecap="round"/><text x="96" y="168.7" font-size="7.8" text-anchor="middle" fill="#666" font-weight="normal">tower, 120 m</text><path d="M40 76L53.8 76.0" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round"/><path d="M52.0 73.5L58.0 76.0L52.0 78.5Z" fill="#666"/><text x="40" y="68.7" font-size="7.8" text-anchor="middle" fill="#666" font-weight="normal">wind</text><text x="264" y="63.3" font-size="9.4" text-anchor="middle" fill="#2E7D32" font-weight="bold">VAWT</text><path d="M264 62L264 150" fill="none" stroke="#666" stroke-width="2.6" stroke-linecap="round"/><ellipse cx="264" cy="100" rx="30" ry="34" fill="none" stroke="#2E7D32" stroke-width="2.0" stroke-dasharray="0"/><path d="M240 78L288 122" fill="none" stroke="#2E7D32" stroke-width="1.4" stroke-linecap="round"/><path d="M288 78L240 122" fill="none" stroke="#2E7D32" stroke-width="1.4" stroke-linecap="round"/><path d="M200 150L328 150" fill="none" stroke="#222" stroke-width="2.0" stroke-linecap="round"/><text x="264" y="168.7" font-size="7.8" text-anchor="middle" fill="#666" font-weight="normal">generator at ground</text><path d="M300 90L291.75659420219966 94.12170289890018" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round"/><path d="M294.5 95.6L288.0 96.0L292.2 91.1Z" fill="#666"/><text x="302" y="84.7" font-size="7.8" text-anchor="start" fill="#666" font-weight="normal">wind</text><text x="96" y="186.8" font-size="8.0" text-anchor="middle" fill="#666" font-weight="bold">point</text><text x="214" y="186.8" font-size="8.0" text-anchor="middle" fill="#1565C0" font-weight="bold">HAWT</text><text x="320" y="186.8" font-size="8.0" text-anchor="middle" fill="#2E7D32" font-weight="bold">VAWT</text><text x="96" y="202.9" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">needs yaw to face the wind</text><text x="214" y="202.9" font-size="8.2" text-anchor="middle" fill="#1565C0" font-weight="normal">yes</text><text x="320" y="202.9" font-size="8.2" text-anchor="middle" fill="#2E7D32" font-weight="normal">no</text><text x="96" y="218.9" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">Cp, share of wind power</text><text x="214" y="218.9" font-size="8.2" text-anchor="middle" fill="#1565C0" font-weight="normal">0.45-0.50</text><text x="320" y="218.9" font-size="8.2" text-anchor="middle" fill="#2E7D32" font-weight="normal">0.15-0.35</text><text x="96" y="234.9" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">typical size</text><text x="214" y="234.9" font-size="8.2" text-anchor="middle" fill="#1565C0" font-weight="normal">2-15 MW</text><text x="320" y="234.9" font-size="8.2" text-anchor="middle" fill="#2E7D32" font-weight="normal">1-100 kW</text><text x="96" y="250.9" font-size="8.2" text-anchor="middle" fill="#222" font-weight="normal">uses</text><text x="214" y="250.9" font-size="8.2" text-anchor="middle" fill="#1565C0" font-weight="normal">wind farms</text><text x="320" y="250.9" font-size="8.2" text-anchor="middle" fill="#2E7D32" font-weight="normal">roof, street, pump</text><rect x="8.0" y="267.0" width="344" height="26" rx="7" fill="#F3EBFD" stroke="#7B2CD9" stroke-width="1.6"/><text x="180" y="282.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">bladeless mast: silent and simple, but only a few per cent efficient</text><text x="180" y="313.1" font-size="9.0" text-anchor="middle" fill="#666" font-weight="normal">Betz: no rotor can take more than 59.3 % of the power in the wind.</text><text x="180" y="327.1" font-size="9.0" text-anchor="middle" fill="#666" font-weight="normal">Power goes with the cube of speed and the square of the rotor diameter.</text></svg>