<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 326" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="326" fill="#ffffff"/><text x="180" y="25.4" font-size="12.6" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Climb from the cheapest rung</text><text x="180" y="42.4" font-size="9.6" text-anchor="middle" fill="#666" font-weight="normal">cost per tonne of CO2 avoided, roughly</text><rect x="12" y="58" width="336" height="34" rx="5" fill="#2E7D32" fill-opacity="0.10" stroke="#2E7D32" stroke-width="1.3"/><text x="22" y="76.1" font-size="8.8" text-anchor="start" fill="#2E7D32" font-weight="bold">1 save it</text><text x="22" y="88.5" font-size="7.2" text-anchor="start" fill="#222" font-weight="normal">efficiency, LEDs, cool roofs</text><text x="340" y="82.5" font-size="7.2" text-anchor="end" fill="#666" font-weight="normal">pays back on its own</text><rect x="26" y="98" width="322" height="34" rx="5" fill="#00695C" fill-opacity="0.10" stroke="#00695C" stroke-width="1.3"/><text x="36" y="116.1" font-size="8.8" text-anchor="start" fill="#00695C" font-weight="bold">2 electrify it</text><text x="36" y="128.5" font-size="7.2" text-anchor="start" fill="#222" font-weight="normal">heat pumps, buses, two wheelers</text><text x="340" y="122.5" font-size="7.2" text-anchor="end" fill="#666" font-weight="normal">cuts fuel use by 3x</text><rect x="40" y="138" width="308" height="34" rx="5" fill="#1565C0" fill-opacity="0.10" stroke="#1565C0" stroke-width="1.3"/><text x="50" y="156.1" font-size="8.8" text-anchor="start" fill="#1565C0" font-weight="bold">3 clean the supply</text><text x="50" y="168.5" font-size="7.2" text-anchor="start" fill="#222" font-weight="normal">solar, wind, hydro, nuclear</text><text x="340" y="162.5" font-size="7.2" text-anchor="end" fill="#666" font-weight="normal">Rs 2.5 - 3.8 a unit</text><rect x="54" y="178" width="294" height="34" rx="5" fill="#7B2CD9" fill-opacity="0.10" stroke="#7B2CD9" stroke-width="1.3"/><text x="64" y="196.1" font-size="8.8" text-anchor="start" fill="#7B2CD9" font-weight="bold">4 capture the rest</text><text x="64" y="208.5" font-size="7.2" text-anchor="start" fill="#222" font-weight="normal">CCS on cement and steel</text><text x="340" y="202.5" font-size="7.2" text-anchor="end" fill="#666" font-weight="normal">20-30 % energy penalty</text><rect x="68" y="218" width="280" height="34" rx="5" fill="#B66A00" fill-opacity="0.10" stroke="#B66A00" stroke-width="1.3"/><text x="78" y="236.1" font-size="8.8" text-anchor="start" fill="#B66A00" font-weight="bold">5 offset the last</text><text x="78" y="248.5" font-size="7.2" text-anchor="start" fill="#222" font-weight="normal">forest, soil, direct air</text><text x="340" y="242.5" font-size="7.2" text-anchor="end" fill="#666" font-weight="normal">limited and reversible</text><rect x="8.0" y="258.0" width="344" height="28" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="274.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">net zero = every rung, plus sinks for what is left</text><text x="180" y="307.1" font-size="9.0" text-anchor="middle" fill="#666" font-weight="normal">The first three rungs can deliver most of the 2030 cut.</text><text x="180" y="321.1" font-size="9.0" text-anchor="middle" fill="#666" font-weight="normal">An offset is not a substitute for a rung you have not climbed.</text></svg>