<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 326" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="326" fill="#ffffff"/><text x="180" y="25.5" font-size="12.8" text-anchor="middle" fill="#7B2CD9" font-weight="bold">One tonne of e-waste, by mass</text><text x="180" y="42.4" font-size="9.6" text-anchor="middle" fill="#666" font-weight="normal">the small fractions carry the hazard</text><rect x="16.0" y="70" width="162.0" height="34" fill="#666" fill-opacity="0.25" stroke="#666" stroke-width="1.2"/><text x="98.0" y="93.0" font-size="8.6" text-anchor="middle" fill="#666" font-weight="bold">500 kg</text><rect x="180.0" y="70" width="66.9" height="34" fill="#B66A00" fill-opacity="0.25" stroke="#B66A00" stroke-width="1.2"/><text x="214.44" y="93.0" font-size="8.6" text-anchor="middle" fill="#B66A00" font-weight="bold">210 kg</text><rect x="248.9" y="70" width="40.6" height="34" fill="#00695C" fill-opacity="0.25" stroke="#00695C" stroke-width="1.2"/><rect x="291.5" y="70" width="17.7" height="34" fill="#BD2543" fill-opacity="0.25" stroke="#BD2543" stroke-width="1.2"/><rect x="311.2" y="70" width="21.0" height="34" fill="#1565C0" fill-opacity="0.25" stroke="#1565C0" stroke-width="1.2"/><rect x="334.2" y="70" width="7.8" height="34" fill="#BD2543" fill-opacity="0.25" stroke="#BD2543" stroke-width="1.2"/><rect x="16" y="113" width="4" height="14" fill="#666"/><text x="26" y="125.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="bold">metal</text><text x="160" y="124.9" font-size="8.2" text-anchor="start" fill="#666" font-weight="normal">worth recovering</text><text x="344" y="125.0" font-size="8.6" text-anchor="end" fill="#666" font-weight="normal">50 %</text><rect x="16" y="137" width="4" height="14" fill="#B66A00"/><text x="26" y="149.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="bold">plastic</text><text x="160" y="148.9" font-size="8.2" text-anchor="start" fill="#666" font-weight="normal">flame retardants</text><text x="344" y="149.0" font-size="8.6" text-anchor="end" fill="#B66A00" font-weight="normal">21 %</text><rect x="16" y="161" width="4" height="14" fill="#00695C"/><text x="26" y="173.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="bold">glass and ceramic</text><text x="160" y="172.9" font-size="8.2" text-anchor="start" fill="#666" font-weight="normal">screens, boards</text><text x="344" y="173.0" font-size="8.6" text-anchor="end" fill="#00695C" font-weight="normal">13 %</text><rect x="16" y="185" width="4" height="14" fill="#BD2543"/><text x="26" y="197.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="bold">circuit boards</text><text x="160" y="196.9" font-size="8.2" text-anchor="start" fill="#666" font-weight="normal">lead, gold, beryllium</text><text x="344" y="197.0" font-size="8.6" text-anchor="end" fill="#BD2543" font-weight="normal">6 %</text><rect x="16" y="209" width="4" height="14" fill="#1565C0"/><text x="26" y="221.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="bold">cables and other</text><text x="160" y="220.9" font-size="8.2" text-anchor="start" fill="#666" font-weight="normal">copper if stripped</text><text x="344" y="221.0" font-size="8.6" text-anchor="end" fill="#1565C0" font-weight="normal">7 %</text><rect x="16" y="233" width="4" height="14" fill="#BD2543"/><text x="26" y="245.1" font-size="8.8" text-anchor="start" fill="#222" font-weight="bold">batteries and lamps</text><text x="160" y="244.9" font-size="8.2" text-anchor="start" fill="#666" font-weight="normal">mercury, cadmium, lithium</text><text x="344" y="245.0" font-size="8.6" text-anchor="end" fill="#BD2543" font-weight="normal">3 %</text><rect x="8.0" y="260.0" width="344" height="28" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="180" y="277.0" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">burning cables and acid baths release dioxins and lead over the workers</text><text x="180" y="307.1" font-size="9.0" text-anchor="middle" fill="#666" font-weight="normal">Hand it to an authorised recycler against a manifest.</text><text x="180" y="321.1" font-size="9.0" text-anchor="middle" fill="#666" font-weight="normal">Extended producer responsibility pays for the take-back.</text></svg>