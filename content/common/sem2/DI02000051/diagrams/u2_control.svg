<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 304" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="304" fill="#ffffff"/><text x="180" y="25.5" font-size="12.8" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Match the collector to the particle</text><text x="180" y="42.4" font-size="9.6" text-anchor="middle" fill="#666" font-weight="normal">smaller particles need a finer device</text><rect x="12" y="56" width="336" height="28" rx="4" fill="#FFFFFF" stroke="#666" stroke-width="1.3"/><text x="20" y="77.1" font-size="8.9" text-anchor="start" fill="#222" font-weight="bold">settling chamber</text><text x="340" y="76.9" font-size="8.2" text-anchor="end" fill="#666" font-weight="normal">50 um and above, about 70 %</text><rect x="12" y="92" width="336" height="28" rx="4" fill="#F7F7F7" stroke="#00695C" stroke-width="1.3"/><text x="20" y="113.1" font-size="8.9" text-anchor="start" fill="#222" font-weight="bold">cyclone separator</text><text x="340" y="112.9" font-size="8.2" text-anchor="end" fill="#00695C" font-weight="normal">10 - 50 um, about 85 %</text><rect x="12" y="128" width="336" height="28" rx="4" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.3"/><text x="20" y="149.1" font-size="8.9" text-anchor="start" fill="#222" font-weight="bold">bag filter</text><text x="340" y="148.9" font-size="8.2" text-anchor="end" fill="#1565C0" font-weight="normal">1 - 10 um, 99 % plus</text><rect x="12" y="164" width="336" height="28" rx="4" fill="#F7F7F7" stroke="#7B2CD9" stroke-width="1.3"/><text x="20" y="185.1" font-size="8.9" text-anchor="start" fill="#222" font-weight="bold">electrostatic precipitator</text><text x="340" y="184.9" font-size="8.2" text-anchor="end" fill="#7B2CD9" font-weight="normal">below 1 um, 99.5 %</text><rect x="12" y="200" width="336" height="28" rx="4" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.3"/><text x="20" y="221.1" font-size="8.9" text-anchor="start" fill="#222" font-weight="bold">wet scrubber</text><text x="340" y="220.9" font-size="8.2" text-anchor="end" fill="#2E7D32" font-weight="normal">dust plus soluble gas, 95 %</text><rect x="8.0" y="235.0" width="344" height="30" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="253.0" font-size="8.6" text-anchor="middle" fill="#222" font-weight="normal">gas too hot, wet or corrosive? a scrubber cools and absorbs in one step</text><text x="180" y="285.1" font-size="9.0" text-anchor="middle" fill="#666" font-weight="normal">A cyclone is a pre-cleaner; a bag filter or ESP is the final stage.</text><text x="180" y="299.1" font-size="9.0" text-anchor="middle" fill="#666" font-weight="normal">Check the pressure drop and where the collected dust will go.</text></svg>