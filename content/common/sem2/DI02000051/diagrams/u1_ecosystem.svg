<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 288" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="288" fill="#ffffff"/><text x="180" y="25.6" font-size="13.0" text-anchor="middle" fill="#7B2CD9" font-weight="bold">The trophic pyramid of a pond</text><text x="180" y="43.4" font-size="9.6" text-anchor="middle" fill="#666" font-weight="normal">numbers and energy shrink upwards</text><rect x="30.0" y="183.0" width="300" height="30" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="201.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">producers: algae, plants</text><rect x="62.0" y="149.0" width="236" height="30" rx="7" fill="#EAF3FD" stroke="#1565C0" stroke-width="1.6"/><text x="180" y="167.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">primary consumers: zooplankton</text><rect x="94.0" y="115.0" width="172" height="30" rx="7" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.6"/><text x="180" y="133.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">secondary: small fish</text><rect x="124.0" y="81.0" width="112" height="30" rx="7" fill="#FDECF0" stroke="#BD2543" stroke-width="1.6"/><text x="180" y="99.1" font-size="8.8" text-anchor="middle" fill="#222" font-weight="normal">top consumer: heron</text><path d="M18 196L18.0 93.0" fill="none" stroke="#999" stroke-width="1.5" stroke-linecap="round"/><path d="M18 86L22.0 93.0L14.0 93.0Z" fill="#999"/><text x="180" y="247.2" font-size="9.2" text-anchor="middle" fill="#666" font-weight="normal">Energy flows up the pyramid, about 10 % a step,</text><text x="180" y="261.2" font-size="9.2" text-anchor="middle" fill="#666" font-weight="normal">so it must be wide at the bottom and narrow</text><text x="180" y="275.2" font-size="9.2" text-anchor="middle" fill="#666" font-weight="normal">at the top - the heron needs many fish.</text></svg>