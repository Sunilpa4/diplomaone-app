<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 302" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="302" fill="#ffffff"/><text x="180" y="25.4" font-size="12.6" text-anchor="middle" fill="#7B2CD9" font-weight="bold">Light in, current out</text><text x="180" y="42.4" font-size="9.6" text-anchor="middle" fill="#666" font-weight="normal">five layers and one junction</text><circle cx="36" cy="58" r="12" fill="#FFF4DF" stroke="#B66A00" stroke-width="1.4"/><path d="M20 42L11 33" fill="none" stroke="#B66A00" stroke-width="1.4" stroke-linecap="round"/><path d="M36 37.2L36 25.5" fill="none" stroke="#B66A00" stroke-width="1.4" stroke-linecap="round"/><path d="M52 42L61 33" fill="none" stroke="#B66A00" stroke-width="1.4" stroke-linecap="round"/><path d="M15.2 58L3.5 58" fill="none" stroke="#B66A00" stroke-width="1.4" stroke-linecap="round"/><path d="M52 64L84.68472068701944 89.42144942323733" fill="none" stroke="#B66A00" stroke-width="1.2" stroke-linecap="round"/><path d="M84.8 86.3L88.0 92.0L81.7 90.3Z" fill="#B66A00"/><path d="M52 73L84.64 97.48" fill="none" stroke="#B66A00" stroke-width="1.2" stroke-linecap="round"/><path d="M84.7 94.4L88.0 100.0L81.7 98.4Z" fill="#B66A00"/><path d="M52 82L84.59514724072051 105.5409396738537" fill="none" stroke="#B66A00" stroke-width="1.2" stroke-linecap="round"/><path d="M84.6 102.4L88.0 108.0L81.7 106.5Z" fill="#B66A00"/><text x="58" y="130.9" font-size="8.2" text-anchor="middle" fill="#B66A00" font-weight="normal">photons</text><rect x="92" y="74" width="132" height="14" rx="2" fill="#DDE9F8" stroke="#1565C0" stroke-width="1.2"/><rect x="92" y="88" width="132" height="14" rx="2" fill="#CFE3FA" stroke="#1565C0" stroke-width="1.2"/><path d="M92 102L224 102" fill="none" stroke="#7B2CD9" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="4 2"/><rect x="92" y="102" width="132" height="14" rx="2" fill="#F6DFE6" stroke="#BD2543" stroke-width="1.2"/><rect x="92" y="116" width="132" height="12" rx="2" fill="#E8E8E8" stroke="#666" stroke-width="1.2"/><text x="230" y="87.8" font-size="8.0" text-anchor="start" fill="#1565C0" font-weight="normal">glass + ARC</text><text x="230" y="102.8" font-size="8.0" text-anchor="start" fill="#1565C0" font-weight="normal">n-silicon</text><text x="230" y="116.8" font-size="8.0" text-anchor="start" fill="#BD2543" font-weight="normal">p-silicon</text><text x="230" y="130.8" font-size="8.0" text-anchor="start" fill="#666" font-weight="normal">back contact</text><text x="84" y="122.8" font-size="8.0" text-anchor="end" fill="#7B2CD9" font-weight="normal">junction</text><path d="M86 116L91 103" fill="none" stroke="#7B2CD9" stroke-width="0.9" stroke-linecap="round"/><path d="M112 99L112.0 94.2" fill="none" stroke="#1565C0" stroke-width="1.3" stroke-linecap="round"/><path d="M109.5 96.0L112.0 90.0L114.5 96.0Z" fill="#1565C0"/><text x="118" y="99.9" font-size="8.2" text-anchor="start" fill="#1565C0" font-weight="normal">e-</text><path d="M150 106L150.0 108.8" fill="none" stroke="#BD2543" stroke-width="1.3" stroke-linecap="round"/><path d="M152.5 107.0L150.0 113.0L147.5 107.0Z" fill="#BD2543"/><text x="156" y="113.9" font-size="8.2" text-anchor="start" fill="#BD2543" font-weight="normal">h+</text><path d="M200 74L200 58" fill="none" stroke="#222" stroke-width="1.3" stroke-linecap="round"/><path d="M200 58L330 58" fill="none" stroke="#222" stroke-width="1.3" stroke-linecap="round"/><path d="M330 58L330 190" fill="none" stroke="#222" stroke-width="1.3" stroke-linecap="round"/><path d="M330 190L186 190" fill="none" stroke="#222" stroke-width="1.3" stroke-linecap="round"/><rect x="146" y="181" width="40" height="18" rx="2" fill="#FFFFFF" stroke="#222" stroke-width="1.3"/><text x="166" y="196.7" font-size="7.8" text-anchor="middle" fill="#222" font-weight="normal">load</text><path d="M146 190L92 190" fill="none" stroke="#222" stroke-width="1.3" stroke-linecap="round"/><path d="M92 190L92 122" fill="none" stroke="#222" stroke-width="1.3" stroke-linecap="round"/><path d="M120 190L138.8 190.0" fill="none" stroke="#1565C0" stroke-width="1.3" stroke-linecap="round"/><path d="M137.0 187.5L143.0 190.0L137.0 192.5Z" fill="#1565C0"/><text x="120" y="206.8" font-size="8.0" text-anchor="middle" fill="#1565C0" font-weight="normal">current</text><rect x="8.0" y="212.0" width="344" height="28" rx="7" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.6"/><text x="180" y="228.9" font-size="8.4" text-anchor="middle" fill="#222" font-weight="normal">0.6 V per cell, about 10 A per module - series adds volts, parallel adds amps</text><text x="180" y="269.1" font-size="9.0" text-anchor="middle" fill="#666" font-weight="normal">Efficiency = power out / sunlight in; heat costs 0.4 % per degree.</text><text x="180" y="283.1" font-size="9.0" text-anchor="middle" fill="#666" font-weight="normal">Below the band gap the photon is wasted, above it the surplus becomes heat.</text></svg>