 in advance</text><rect x="238" y="99" width="108" height="38" rx="6" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.3"/><text x="292" y="116" font-size="8.4" fill="#2E7D32" text-anchor="middle" font-weight="bold">ORGANISING</text><text x="292" y="129" font-size="7.0" fill="#555555" text-anchor="middle">arrange work &amp; authority</text><rect x="194" y="201" width="108" height="38" rx="6" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.3"/><text x="248" y="218" font-size="8.4" fill="#2F5D8A" text-anchor="middle" font-weight="bold">STAFFING</text><text x="248" y="231" font-size="7.0" fill="#555555" text-anchor="middle">right people in boxes</text><rect x="58" y="201" width="108" height="38" rx="6" fill="#FFFFFF" stroke="#7B2CD9" stroke-width="1.3"/><text x="112" y="218" font-size="8.4" fill="#7B2CD9" text-anchor="middle" font-weight="bold">DIRECTING</text><text x="112" y="231" font-size="7.0" fill="#555555" text-anchor="middle">guide &amp; motivate daily</text><rect x="14" y="99" width="108" height="38" rx="6" fill="#FFFFFF" stroke="#BD2543" stroke-width="1.3"/><text x="68" y="116" font-size="8.4" fill="#BD2543" text-anchor="middle" font-weight="bold">CONTROLLING</text><text x="68" y="129" font-size="7.0" fill="#555555" text-anchor="middle">compare &amp; correct</text><circle cx="180" cy="150" r="34" fill="#FFFFFF" stroke="#7B2CD9" stroke-width="1.8"/><text x="180" y="146" font-size="8" fill="#7B2CD9" text-anchor="middle" font-weight="bold">MANAGE-</text><text x="180" y="158" font-size="8" fill="#7B2CD9" text-anchor="middle" font-weight="bold">MENT</text><text x="180" y="268" font-size="8" fill="#666666" text-anchor="middle" font-style="italic">A cycle, not a queue: controlling feeds the next plan — skip one, get its failure</text></svg>