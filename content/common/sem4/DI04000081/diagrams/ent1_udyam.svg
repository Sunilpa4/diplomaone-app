<svg xmlns="http://www.w3.org/2000/svg" width="360" height="290" viewBox="0 0 360 290" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="290" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Registering the enterprise</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Cards 1.8–1.9: two gateways, one pipeline</text><text x="95" y="56" font-size="9.5" fill="#2F5D8A" text-anchor="middle" font-weight="bold">UDYAM — for every MSME</text><text x="265" y="56" font-size="9.5" fill="#2E7D32" text-anchor="middle" font-weight="bold">DPIIT — for start-ups</text><rect x="11.0" y="73.0" width="168" height="38" rx="6" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.3"/><text x="95" y="91" font-size="8.6" fill="#2F5D8A" text-anchor="middle" font-weight="bold">1 · Open the official portal</text><text x="95" y="103" font-size="7.2" fill="#555555" text-anchor="middle">udyamregistration.gov.in — free</text><rect x="11.0" y="121.0" width="168" height="38" rx="6" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.3"/><text x="95" y="139" font-size="8.6" fill="#2F5D8A" text-anchor="middle" font-weight="bold">2 · Enter enterprise details</text><text x="95" y="151" font-size="7.2" fill="#555555" text-anchor="middle">Aadhaar-linked; PAN/GST as applicable</text><rect x="11.0" y="169.0" width="168" height="38" rx="6" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.3"/><text x="95" y="187" font-size="8.6" fill="#2F5D8A" text-anchor="middle" font-weight="bold">3 · Online verification</text><text x="95" y="199" font-size="7.2" fill="#555555" text-anchor="middle">no documents to upload, no fee</text><rect x="11.0" y="217.0" width="168" height="38" rx="6" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.3"/><text x="95" y="235" font-size="8.6" fill="#2F5D8A" text-anchor="middle" font-weight="bold">4 · Udyam certificate issued</text><text x="95" y="247" font-size="7.2" fill="#555555" text-anchor="middle">permanent registration number</text><rect x="181.0" y="73.0" width="168" height="38" rx="6" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.3"/><text x="265" y="91" font-size="8.6" fill="#2E7D32" text-anchor="middle" font-weight="bold">1 · Incorporate the entity</text><text x="265" y="103" font-size="7.2" fill="#555555" text-anchor="middle">Pvt Ltd company / LLP / partnership</text><rect x="181.0" y="121.0" width="168" height="38" rx="6" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.3"/><text x="265" y="139" font-size="8.6" fill="#2E7D32" text-anchor="middle" font-weight="bold">2 · Apply on Startup India portal</text><text x="265" y="151" font-size="7.2" fill="#555555" text-anchor="middle">with a brief on the innovation</text><rect x="181.0" y="169.0" width="168" height="38" rx="6" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.3"/><text x="265" y="187" font-size="8.6" fill="#2E7D32" text-anchor="middle" font-weight="bold">3 · Eligibility examined</text><text x="265" y="199" font-size="7.2" fill="#555555" text-anchor="middle">age, turnover and innovation tests</text><rect x="181.0" y="217.0" width="168" height="38" rx="6" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.3"/><text x="265" y="235" font-size="8.6" fill="#2E7D32" text-anchor="middle" font-weight="bold">4 · DPIIT recognition issued</text><text x="265" y="247" font-size="7.2" fill="#555555" text-anchor="middle">certificate and recognition number</text><text x="180" y="282" font-size="8" fill="#666666" text-anchor="middle" font-style="italic">SSIP and i-Hub Gujarat support student innovators before either registration</text></svg>