0" y="120" width="300" height="30" rx="6" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.2"/><text x="180" y="132" font-size="8.4" fill="#2F5D8A" text-anchor="middle" font-weight="bold">Plant &amp; machinery</text><text x="180" y="144" font-size="7.1" fill="#555555" text-anchor="middle">with installation, freight, electrification</text><rect x="30" y="156" width="300" height="30" rx="6" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.2"/><text x="180" y="168" font-size="8.4" fill="#2F5D8A" text-anchor="middle" font-weight="bold">Other fixed assets</text><text x="180" y="180" font-size="7.1" fill="#555555" text-anchor="middle">furniture, computers, vehicles</text><rect x="30" y="192" width="300" height="30" rx="6" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.2"/><text x="180" y="204" font-size="8.4" fill="#2F5D8A" text-anchor="middle" font-weight="bold">Pre-operative expenses</text><text x="180" y="216" font-size="7.1" fill="#555555" text-anchor="middle">registration, legal, trial runs, setup interest</text><rect x="30" y="228" width="300" height="30" rx="6" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.2"/><text x="180" y="240" font-size="8.4" fill="#2F5D8A" text-anchor="middle" font-weight="bold">Contingency</text><text x="180" y="252" font-size="7.1" fill="#555555" text-anchor="middle">the honest allowance for surprises</text><rect x="30" y="264" width="300" height="30" rx="6" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.2"/><text x="180" y="276" font-size="8.4" fill="#2F5D8A" text-anchor="middle" font-weight="bold">Working-capital margin</text><text x="180" y="288" font-size="7.1" fill="#555555" text-anchor="middle">your share of daily running funds</text><rect x="30" y="302" width="300" height="30" rx="6" fill="#DCE9F5" stroke="#2F5D8A" stroke-width="1.4"/><text x="180" y="320" font-size="8.4" fill="#2F5D8A" text-anchor="middle" font-weight="bold">= TOTAL PROJECT COST  ↔  MEANS OF FINANCE</text></svg>