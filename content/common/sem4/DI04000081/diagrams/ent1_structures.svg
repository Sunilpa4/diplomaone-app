<svg xmlns="http://www.w3.org/2000/svg" width="360" height="254" viewBox="0 0 360 254" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="254" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Types of business structures</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 1.5: who owns it, and who bears the risk</text><rect x="12" y="50" width="162" height="52" rx="6" fill="#FFFFFF" stroke="#B66A00" stroke-width="1.3"/><text x="93" y="68" font-size="8.8" fill="#B66A00" text-anchor="middle" font-weight="bold">Sole proprietorship</text><text x="93" y="82" font-size="7.2" fill="#555555" text-anchor="middle">1 owner ·</text><text x="93" y="94" font-size="7.2" fill="#555555" text-anchor="middle">unlimited liability ·  simplest start</text><rect x="186" y="50" width="162" height="52" rx="6" fill="#FFFFFF" stroke="#B66A00" stroke-width="1.3"/><text x="267" y="68" font-size="8.8" fill="#B66A00" text-anchor="middle" font-weight="bold">Partnership firm</text><text x="267" y="82" font-size="7.2" fill="#555555" text-anchor="middle">2+ partners ·</text><text x="267" y="94" font-size="7.2" fill="#555555" text-anchor="middle">unlimited, joint liability ·  deed-based</text><rect x="12" y="114" width="162" height="52" rx="6" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.3"/><text x="93" y="132" font-size="8.8" fill="#2F5D8A" text-anchor="middle" font-weight="bold">LLP</text><text x="93" y="146" font-size="7.2" fill="#555555" text-anchor="middle">2+ partners ·</text><text x="93" y="158" font-size="7.2" fill="#555555" text-anchor="middle">liability limited to contribution</text><rect x="186" y="114" width="162" height="52" rx="6" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.3"/><text x="267" y="132" font-size="8.8" fill="#2F5D8A" text-anchor="middle" font-weight="bold">One-Person Company</text><text x="267" y="146" font-size="7.2" fill="#555555" text-anchor="middle">1 founder ·</text><text x="267" y="158" font-size="7.2" fill="#555555" text-anchor="middle">limited liability ·  separate identity</text><rect x="12" y="178" width="162" height="52" rx="6" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.3"/><text x="93" y="196" font-size="8.8" fill="#2E7D32" text-anchor="middle" font-weight="bold">Private limited company</text><text x="93" y="210" font-size="7.2" fill="#555555" text-anchor="middle">2+ members ·</text><text x="93" y="222" font-size="7.2" fill="#555555" text-anchor="middle">limited liability ·  can raise investment</text><rect x="186" y="178" width="162" height="52" rx="6" fill="#FFFFFF" stroke="#7B2CD9" stroke-width="1.3"/><text x="267" y="196" font-size="8.8" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Co-operative society</text><text x="267" y="210" font-size="7.2" fill="#555555" text-anchor="middle">member collective ·</text><text x="267" y="222" font-size="7.2" fill="#555555" text-anchor="middle">democratic ownership</text><text x="180" y="246" font-size="8" fill="#666666" text-anchor="middle" font-style="italic">More protection and fundability usually mean more compliance</text></svg>