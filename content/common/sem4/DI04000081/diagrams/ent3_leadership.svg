<svg xmlns="http://www.w3.org/2000/svg" width="360" height="232" viewBox="0 0 360 232" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="232" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Leadership styles and models</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 3.3: who decides, and how much each side is cared for</text><rect x="14" y="62" width="112" height="44" rx="7" fill="#FFFFFF" stroke="#B66A00" stroke-width="1.4"/><text x="70" y="82" font-size="8.6" fill="#B66A00" text-anchor="middle" font-weight="bold">AUTOCRATIC</text><text x="70" y="97" font-size="7.2" fill="#555555" text-anchor="middle">leader decides alone</text><rect x="124" y="62" width="112" height="44" rx="7" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.4"/><text x="180" y="82" font-size="8.6" fill="#2E7D32" text-anchor="middle" font-weight="bold">DEMOCRATIC</text><text x="180" y="97" font-size="7.2" fill="#555555" text-anchor="middle">team is consulted</text><rect x="234" y="62" width="112" height="44" rx="7" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.4"/><text x="290" y="82" font-size="8.6" fill="#2F5D8A" text-anchor="middle" font-weight="bold">FREE-REIN</text><text x="290" y="97" font-size="7.2" fill="#555555" text-anchor="middle">team decides</text><line x1="20" y1="122" x2="340" y2="122" stroke="#888888" stroke-width="1.6"/><polygon points="340.0,122.0 332.0,118.4 332.0,125.6" fill="#888888"/><text x="14" y="136" font-size="7.6" fill="#777777" text-anchor="start">leader control</text><text x="346" y="136" font-size="7.6" fill="#777777" text-anchor="end">team freedom</text><rect x="54" y="152" width="252" height="52" rx="7" fill="#F3E5F5" stroke="#7B2CD9" stroke-width="1.3"/><text x="180" y="172" font-size="8.8" fill="#7B2CD9" text-anchor="middle" font-weight="bold">MANAGERIAL GRID (9,9) team style</text><text x="180" y="189" font-size="7.6" fill="#555555" text-anchor="middle">high concern for production AND for people</text><text x="180" y="224" font-size="8" fill="#666666" text-anchor="middle" font-style="italic">Situational rule: match the style to the person's readiness</text></svg>