<svg xmlns="http://www.w3.org/2000/svg" width="360" height="336" viewBox="0 0 360 336" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="336" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Market research process</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 2.4: evaluation is a sequence, not a hunch</text><rect x="60" y="48" width="240" height="34" rx="7" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.3"/><text x="180" y="62" font-size="9" fill="#2F5D8A" text-anchor="middle" font-weight="bold">1 · DEFINE THE QUESTION</text><text x="180" y="75" font-size="7.4" fill="#555555" text-anchor="middle">who might buy, what, at what price?</text><line x1="180" y1="82" x2="180" y2="92" stroke="#444444" stroke-width="1.6"/><polygon points="180.0,92.0 183.6,84.0 176.4,84.0" fill="#444444"/><rect x="60" y="94" width="240" height="34" rx="7" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.3"/><text x="180" y="108" font-size="9" fill="#2F5D8A" text-anchor="middle" font-weight="bold">2 · DESIGN QUESTIONNAIRE</text><text x="180" y="121" font-size="7.4" fill="#555555" text-anchor="middle">short, clear, pilot-tested</text><line x1="180" y1="128" x2="180" y2="138" stroke="#444444" stroke-width="1.6"/><polygon points="180.0,138.0 183.6,130.0 176.4,130.0" fill="#444444"/><rect x="60" y="140" width="240" height="34" rx="7" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.3"/><text x="180" y="154" font-size="9" fill="#2F5D8A" text-anchor="middle" font-weight="bold">3 · CHOOSE THE SAMPLE</text><text x="180" y="167" font-size="7.4" fill="#555555" text-anchor="middle">representative, not just reachable</text><line x1="180" y1="174" x2="180" y2="184" stroke="#444444" stroke-width="1.6"/><polygon points="180.0,184.0 183.6,176.0 176.4,176.0" fill="#444444"/><rect x="60" y="186" width="240" height="34" rx="7" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.3"/><text x="180" y="200" font-size="9" fill="#2F5D8A" text-anchor="middle" font-weight="bold">4 · CONDUCT THE SURVEY</text><text x="180" y="213" font-size="7.4" fill="#555555" text-anchor="middle">interview, online or observation</text><line x1="180" y1="220" x2="180" y2="230" stroke="#444444" stroke-width="1.6"/><polygon points="180.0,230.0 183.6,222.0 176.4,222.0" fill="#444444"/><rect x="60" y="232" width="240" height="34" rx="7" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.3"/><text x="180" y="246" font-size="9" fill="#2F5D8A" text-anchor="middle" font-weight="bold">5 · ANALYSE THE DATA</text><text x="180" y="259" font-size="7.4" fill="#555555" text-anchor="middle">tables, percentages, charts</text><line x1="180" y1="266" x2="180" y2="276" stroke="#444444" stroke-width="1.6"/><polygon points="180.0,276.0 183.6,268.0 176.4,268.0" fill="#444444"/><rect x="60" y="278" width="240" height="34" rx="7" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.3"/><text x="180" y="292" font-size="9" fill="#2F5D8A" text-anchor="middle" font-weight="bold">6 · DECIDE</text><text x="180" y="305" font-size="7.4" fill="#555555" text-anchor="middle">go · modify · drop — with evidence</text><text x="180" y="332" font-size="8" fill="#666666" text-anchor="middle" font-style="italic">Each step removes a guess before money is committed</text></svg>