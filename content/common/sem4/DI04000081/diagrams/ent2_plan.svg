MARKETING PLAN</text><text x="95" y="130" font-size="7.4" fill="#444444" text-anchor="middle">• market size &amp; target customers</text><text x="95" y="144" font-size="7.4" fill="#444444" text-anchor="middle">• competition and pricing</text><text x="95" y="158" font-size="7.4" fill="#444444" text-anchor="middle">• promotion &amp; sales channels</text><text x="95" y="172" font-size="7.4" fill="#444444" text-anchor="middle">• sales forecast</text><rect x="184" y="96" width="162" height="96" rx="7" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.3"/><text x="265" y="112" font-size="8.8" fill="#2E7D32" text-anchor="middle" font-weight="bold">FINANCIAL PLAN</text><text x="265" y="130" font-size="7.4" fill="#444444" text-anchor="middle">• project cost &amp; sources of funds</text><text x="265" y="144" font-size="7.4" fill="#444444" text-anchor="middle">• projected income and cash flow</text><text x="265" y="158" font-size="7.4" fill="#444444" text-anchor="middle">• repayment schedule</text><text x="265" y="172" font-size="7.4" fill="#444444" text-anchor="middle">• break-even expectation</text><rect x="34" y="208" width="292" height="30" rx="7" fill="#FFF7E8" stroke="#B66A00" stroke-width="1.2"/><text x="180" y="220" font-size="8.2" fill="#B66A00" text-anchor="middle" font-weight="bold">SOURCES OF CAPITAL</text><text x="180" y="233" font-size="7.6" fill="#555555" text-anchor="middle">own savings · family · bank / MUDRA · angel / VC · schemes</text></svg>