l="#FFFFFF" stroke="#2E7D32" stroke-width="1.3"/><text x="288" y="136" font-size="8.8" fill="#2E7D32" text-anchor="middle" font-weight="bold">PRICE</text><text x="288" y="149" font-size="7.2" fill="#555555" text-anchor="middle">price, discounts, credit</text><rect x="124" y="201" width="112" height="38" rx="6" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.3"/><text x="180" y="218" font-size="8.8" fill="#2F5D8A" text-anchor="middle" font-weight="bold">PLACE</text><text x="180" y="231" font-size="7.2" fill="#555555" text-anchor="middle">shop, dealers, online</text><rect x="16" y="119" width="112" height="38" rx="6" fill="#FFFFFF" stroke="#7B2CD9" stroke-width="1.3"/><text x="72" y="136" font-size="8.8" fill="#7B2CD9" text-anchor="middle" font-weight="bold">PROMOTION</text><text x="72" y="149" font-size="7.2" fill="#555555" text-anchor="middle">ads, offers, selling</text><circle cx="180" cy="140" r="36" fill="#FFFFFF" stroke="#7B2CD9" stroke-width="1.8"/><text x="180" y="136" font-size="8.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">TARGET</text><text x="180" y="149" font-size="8.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">CUSTOMER</text><text x="180" y="262" font-size="8" fill="#666666" text-anchor="middle" font-style="italic">Segment first, target second — then build the four Ps to fit</text></svg>