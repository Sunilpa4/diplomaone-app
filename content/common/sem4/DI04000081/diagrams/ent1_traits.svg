<svg xmlns="http://www.w3.org/2000/svg" width="360" height="300" viewBox="0 0 360 300" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="300" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Traits of an entrepreneur</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 1.1: the person at the centre of the venture</text><line x1="180" y1="158" x2="180" y2="56" stroke="#B9A8D9" stroke-width="1.1"/><line x1="180" y1="158" x2="62" y2="98" stroke="#B9A8D9" stroke-width="1.1"/><line x1="180" y1="158" x2="298" y2="98" stroke="#B9A8D9" stroke-width="1.1"/><line x1="180" y1="158" x2="62" y2="216" stroke="#B9A8D9" stroke-width="1.1"/><line x1="180" y1="158" x2="298" y2="216" stroke="#B9A8D9" stroke-width="1.1"/><line x1="180" y1="158" x2="180" y2="258" stroke="#B9A8D9" stroke-width="1.1"/><rect x="122.0" y="39.0" width="116" height="34" rx="6" fill="#F3E5F5" stroke="#7B2CD9" stroke-width="1.3"/><text x="180" y="55" font-size="8.6" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Need for achievement</text><rect x="4.0" y="81.0" width="116" height="34" rx="6" fill="#F3E5F5" stroke="#7B2CD9" stroke-width="1.3"/><text x="62" y="97" font-size="8.6" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Innovation</text><text x="62" y="109" font-size="7.2" fill="#555555" text-anchor="middle">new ways to create value</text><rect x="240.0" y="81.0" width="116" height="34" rx="6" fill="#F3E5F5" stroke="#7B2CD9" stroke-width="1.3"/><text x="298" y="97" font-size="8.6" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Calculated risk</text><text x="298" y="109" font-size="7.2" fill="#555555" text-anchor="middle">assessed, not blind</text><rect x="4.0" y="199.0" width="116" height="34" rx="6" fill="#F3E5F5" stroke="#7B2CD9" stroke-width="1.3"/><text x="62" y="215" font-size="8.6" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Leadership</text><text x="62" y="227" font-size="7.2" fill="#555555" text-anchor="middle">decides and carries people</text><rect x="240.0" y="199.0" width="116" height="34" rx="6" fill="#F3E5F5" stroke="#7B2CD9" stroke-width="1.3"/><text x="298" y="215" font-size="8.6" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Opportunity focus</text><text x="298" y="227" font-size="7.2" fill="#555555" text-anchor="middle">sees gaps others miss</text><rect x="122.0" y="241.0" width="116" height="34" rx="6" fill="#F3E5F5" stroke="#7B2CD9" stroke-width="1.3"/><text x="180" y="257" font-size="8.6" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Perseverance</text><text x="180" y="269" font-size="7.2" fill="#555555" text-anchor="middle">and self-confidence</text><circle cx="180" cy="158" r="37" fill="#FFFFFF" stroke="#7B2CD9" stroke-width="1.8"/><text x="180" y="162" font-size="8" fill="#7B2CD9" text-anchor="middle" font-weight="bold">ENTREPRENEUR</text><text x="180" y="292" font-size="8" fill="#666666" text-anchor="middle" font-style="italic">Traits are tendencies that can be developed — that is why this course exists</text></svg>