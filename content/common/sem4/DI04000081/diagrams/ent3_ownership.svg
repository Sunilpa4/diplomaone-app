<svg xmlns="http://www.w3.org/2000/svg" width="360" height="272" viewBox="0 0 360 272" font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="272" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BD2543"/></marker><marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B66A00"/></marker></defs><text x="180" y="19" font-size="12.5" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Forms of ownership at a glance</text><text x="180" y="34" font-size="9" fill="#666666" text-anchor="middle">Card 3.2: control and simplicity versus capital and protection</text><rect x="30" y="50" width="300" height="34" rx="7" fill="#FFFFFF" stroke="#B66A00" stroke-width="1.3"/><text x="180" y="64" font-size="8.8" fill="#B66A00" text-anchor="middle" font-weight="bold">Sole proprietorship</text><text x="180" y="77" font-size="7.4" fill="#555555" text-anchor="middle">one owner · unlimited liability · fastest start</text><rect x="30" y="92" width="300" height="34" rx="7" fill="#FFFFFF" stroke="#B66A00" stroke-width="1.3"/><text x="180" y="106" font-size="8.8" fill="#B66A00" text-anchor="middle" font-weight="bold">Partnership / LLP</text><text x="180" y="119" font-size="7.4" fill="#555555" text-anchor="middle">shared capital &amp; skills · LLP limits liability</text><rect x="30" y="134" width="300" height="34" rx="7" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.3"/><text x="180" y="148" font-size="8.8" fill="#2F5D8A" text-anchor="middle" font-weight="bold">Company (OPC–private–public)</text><text x="180" y="161" font-size="7.4" fill="#555555" text-anchor="middle">separate identity · limited liability · raises capital</text><rect x="30" y="176" width="300" height="34" rx="7" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.3"/><text x="180" y="190" font-size="8.8" fill="#2E7D32" text-anchor="middle" font-weight="bold">Co-operative society</text><text x="180" y="203" font-size="7.4" fill="#555555" text-anchor="middle">member-owned · one member, one vote</text><rect x="30" y="218" width="300" height="34" rx="7" fill="#FFFFFF" stroke="#7B2CD9" stroke-width="1.3"/><text x="180" y="232" font-size="8.8" fill="#7B2CD9" text-anchor="middle" font-weight="bold">Public-sector forms</text><text x="180" y="245" font-size="7.4" fill="#555555" text-anchor="middle">departmental · statutory corporation · govt company</text><text x="180" y="266" font-size="8" fill="#666666" text-anchor="middle" font-style="italic">Choose by capital need, risk tolerance, compliance capacity and ambition</text></svg>