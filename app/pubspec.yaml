name: diploma_one
description: "A new Flutter project."
publish_to: 'none'
version: 0.2.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  flutter_widget_from_html_core: ^0.17.4
  google_mobile_ads: ^9.2.0
  http: ^1.6.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/content/
    - assets/content/subjects/
    - assets/web/
  fonts:
    - family: DejaVu Sans
      fonts:
        - asset: assets/fonts/DejaVuSans.ttf
        - asset: assets/fonts/DejaVuSans-Bold.ttf
          weight: 700
    - family: DejaVu Sans Mono
      fonts:
        - asset: assets/fonts/DejaVuSansMono.ttf
        - asset: assets/fonts/DejaVuSansMono-Bold.ttf
          weight: 700
