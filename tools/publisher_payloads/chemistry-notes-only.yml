# One-file installation: sources are gzip/base64 encoded below, never credentials.
# Replace the old four-unit workflow at this same filename, if it exists.
name: Publish All Notes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'tools/export_app_content.py'
      - '.github/workflows/publish-hardware-notes.yml'

permissions:
  contents: write

concurrency:
  group: publish-diplomaone-notes
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source repository
        uses: actions/checkout@v4

      - name: Prepare shared lossless source transport preserving all previous native content
        run: |
          python3 - <<'MTPOOLCODE'
          import os,json,lzma,hashlib
          from pathlib import Path
          def _pht_unbase91(s):
              a='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!#$%&()*+,./:;<=>?@[]^_`{|}~"'
              table={c:i for i,c in enumerate(a)};v=-1;b=n=0;out=bytearray()
              for c in s:
                  d=table[c]
                  if v<0:v=d
                  else:
                      v+=d*91;b|=v<<n;n+=13 if(v&8191)>88 else 14
                      while n>=8:out.append(b&255);b>>=8;n-=8
                      v=-1
              if v>=0:out.append((b|(v<<n))&255)
              return bytes(out)
