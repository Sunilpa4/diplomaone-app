          buf=lzma.decompress(_pht_unbase91(payload.replace('-','$')))
          if not buf.startswith(b'MTP1\n'):raise SystemExit('Invalid source-pool header;no source changes made.')
          hlen=int.from_bytes(buf[5:13],'big');idx=json.loads(buf[13:13+hlen]);pos=13+hlen;verified=[]
          for item in idx:
              key=item['sha256'];size=item['length'];data=buf[pos:pos+size];pos+=size
              if len(key)!=64 or any(c not in '0123456789abcdef'for c in key)or hashlib.sha256(data).hexdigest()!=key:raise SystemExit('Source-pool checksum mismatch;no source changes made.')
              verified.append((key,data))
          if pos!=len(buf):raise SystemExit('Source-pool length mismatch;no source changes made.')
          root=Path(os.environ['RUNNER_TEMP'])/'mt-source-pool';root.mkdir(parents=True,exist_ok=True)
          for key,data in verified:
              p=root/(key+'.json');tmp=p.with_suffix('.tmp');tmp.write_bytes(data);tmp.replace(p)
          print('Verified '+str(len(verified))+' lossless source payloads;all existing installer ownership/collision rules retained.')
          MTPOOLCODE

      - name: Initialise source manifest
        run: |
          python3 - <<'MANIFEST'
          import json, os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'seeded_paths.json'
          if not p.exists():
              p.write_text(json.dumps([]), encoding='utf-8')
          print('seeded_paths.json ready')
          MANIFEST
      - name: Install Basic Chemistry DI01000161 all nine bilingual units and registration
        run: |
          python3 - <<'DI01000161CODE'
          import ast,json,os,re
          from pathlib import Path
          def _expand(bundle):
              assets=bundle.get('inline_assets') or []
              pat=re.compile(r'__([A-Z0-9]+)_DATA_(\d+)__')
              return {k:pat.sub(lambda m:assets[int(m.group(2))],v) for k,v in bundle['files'].items()}
          payload='shared:d3e02c41028fccc144dfd607822e39bd6efa62b8e66e1c462d9802f0702a0aa1'
          bundle=json.loads((Path(os.environ['RUNNER_TEMP'])/'mt-source-pool'/(payload[7:]+'.json')).read_bytes())
          files=_expand(bundle)
          roots=[Path(_x) for _x in ('content/chemical/sem1/DI01000161',)]
          replace=set()
          manifest_path=Path(os.environ['RUNNER_TEMP'])/'seeded_paths.json'
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'));planned={}
          for rel,value in files.items():
              p=Path(rel)
              if p.is_absolute() or '..' in p.parts or not any(str(p).startswith(str(r)+'/') for r in roots):raise SystemExit('Unsafe source path;no changes made: '+rel)
              if p.exists():
                  if p.suffix=='.json':
                      current=json.loads(p.read_text(encoding='utf-8'));expected=json.loads(value)
                      if p.name=='subject.json':
                          if current.get('code')!='DI01000161' or current.get('branch')!='chemical' or current.get('semester')!=1:raise SystemExit('Subject identity collision;no changes made: '+rel)
                      elif current.get('subject')!='DI01000161' or current.get('unit')!=expected['unit']:raise SystemExit('Unit identity collision;no changes made: '+rel)
                      if any(set(q)!={'q','marks'} for q in current.get('exam_questions',[])):raise SystemExit('Questions-only Exam collision;no changes made: '+rel)
                  if rel in replace:planned[rel]=value
                  else:print('Preserving existing owner source: '+rel)
              else:planned[rel]=value
          exporter=Path('tools/export_app_content.py');text=exporter.read_text(encoding='utf-8');updated=text
          if 'FONT_MAP = [' not in text:raise SystemExit('Exporter layout changed;no changes made.')
          _regs=[('# DiplomaOne registration: DI01000161 chemical semester 1',["if 'DI01000161' not in SUBJECTS:", "    SUBJECTS['DI01000161'] = ('Basic Chemistry','બેઝિક કેમિસ્ટ્રી','Basic Science',4,'theory',None)", "_chemical_sem1 = BRANCH_SEMS.setdefault('chemical',{}).setdefault(1,[])", "if 'DI01000161' not in _chemical_sem1:", "    _chemical_sem1.append('DI01000161')"])]
          for _marker,_lines in _regs:
              if _marker in updated:continue
              _snip=chr(10).join(_lines)
              updated=updated.replace('FONT_MAP = [',_marker+chr(10)+_snip+chr(10)+'FONT_MAP = [',1)
          ast.parse(updated)
          # No write happens until every preflight check has passed.
          for rel,value in planned.items():
              p=Path(rel);p.parent.mkdir(parents=True,exist_ok=True);p.write_text(value,encoding='utf-8');manifest.append(rel)
          if updated!=text:
              Path('tools/export_app_content.py').write_text(updated,encoding='utf-8');manifest.append('tools/export_app_content.py')
          manifest_path.write_text(json.dumps(sorted(set(manifest))),encoding='utf-8')
          print('chemical DI01000161 notes ready: 59 files, units [1, 2, 3, 4, 5, 6, 7, 8, 9]; existing owner source preserved.')
          DI01000161CODE
