      - name: Commit the two Basic Chemistry subjects
        run: |
          python3 - <<'COMMITCODE'
          import json, os, subprocess
          from pathlib import Path
          manifest = json.loads((Path(os.environ['RUNNER_TEMP']) / 'seeded_paths.json').read_text())
          manifest = [p for p in manifest if p.startswith('content/') or p == 'tools/export_app_content.py']
          if not manifest:
              raise SystemExit('nothing recorded to commit')
          subprocess.run(['git','config','user.name','DiplomaOne Bot'], check=True)
          subprocess.run(['git','config','user.email','Sunilpa4@users.noreply.github.com'], check=True)
          subprocess.run(['git','add','--'] + manifest, check=True)
          if subprocess.run(['git','diff','--cached','--quiet']).returncode == 1:
              subprocess.run(['git','commit','-m','Install Basic Chemistry DI01000161 and DI01000071 bilingual notes'], check=True)
              subprocess.run(['git','push','origin','HEAD:main'], check=True)
              print('committed and pushed %d paths' % len(manifest))
