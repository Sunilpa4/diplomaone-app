# Quick check (~2 min): every note, program, table and diagram must render in the app. Runs when content changes.
name: Test content

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "content/**"
      - "tools/**"
      - ".github/workflows/content-test.yml"
  push:
    branches: [main]
    paths:
      - "content/**"
      - "tools/**"
      - ".github/workflows/content-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true
      - name: Validate Communication Skills in English (DI01000031)
        run: |
          python3 -m unittest tools.test_DI01000031_u1 tools.test_DI01000031_u2 \
            tools.test_DI01000031_u3 tools.test_DI01000031_u4 tools.test_english_coverage
      - name: Validate Applied Physics (DI01000121)
        run: |
          python3 -m unittest tools.test_DI01000121_u1 tools.test_DI01000121_u2 \
            tools.test_DI01000121_u3 tools.test_DI01000121_u4 \
            tools.test_applied_physics_coverage
      - name: Export content and render every part
        run: |
          python3 tools/test_export_compatibility.py
          python3 tools/export_app_content.py
          cd app
          flutter pub get
          set +e
          flutter test test/all_content_test.dart --reporter json > "$RUNNER_TEMP/content-test.jsonl"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            python3 ../tools/report_flutter_test_failures.py "$RUNNER_TEMP/content-test.jsonl"
          fi
          exit "$status"
