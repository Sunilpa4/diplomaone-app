# DiplomaOne cloud build: signed Android APKs (public download), Play Store bundle (artifact), web app (GitHub Pages)
name: Build DiplomaOne

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build.yml"

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true

      - name: Export content and test that every note renders
        run: |
          python3 tools/export_app_content.py
          cd app
          flutter pub get
          flutter test

      - name: Signing key + faster Gradle (cloud machine has more memory)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/android/app/upload-keystore.jks
          printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=upload\nstoreFile=upload-keystore.jks\n" \
            "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > app/android/key.properties
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g/; s/^org.gradle.workers.max=.*/org.gradle.workers.max=4/; s/^kotlin.daemon.jvmargs=.*/kotlin.daemon.jvmargs=-Xmx1g/' app/android/gradle.properties

      - name: Build APKs, App Bundle and Web
        working-directory: app
        run: |
          V=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          echo "VERSION=$V" >> "$GITHUB_ENV"
          flutter build apk --release --split-per-abi --build-number=${{ github.run_number }}
          flutter build appbundle --release --build-number=${{ github.run_number }}
          flutter build web --release --no-wasm-dry-run --no-web-resources-cdn --base-href /diplomaone-content/
          mkdir -p ../out
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   "../out/DiplomaOne-$V-arm64.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "../out/DiplomaOne-$V-armv7-old-phones.apk"
          cp build/app/outputs/bundle/release/app-release.aab          "../out/DiplomaOne-$V-playstore.aab"
          ls -la ../out

      - name: Save all builds (incl. Play Store .aab)
        uses: actions/upload-artifact@v4
        with:
          name: DiplomaOne-${{ env.VERSION }}-build${{ github.run_number }}
          path: out/*
          retention-days: 90

      - name: Publish APKs as a public release
        uses: softprops/action-gh-release@v2
        with:
          repository: Sunilpa4/diplomaone-content
          token: ${{ secrets.CONTENT_TOKEN }}
          tag_name: v${{ env.VERSION }}-build${{ github.run_number }}
          name: DiplomaOne ${{ env.VERSION }} (build ${{ github.run_number }})
          make_latest: "true"
          files: out/*.apk
          body: |
            **Which file should I download?**
            * `DiplomaOne-${{ env.VERSION }}-arm64.apk` – almost all phones (2017 or newer)
            * `DiplomaOne-${{ env.VERSION }}-armv7-old-phones.apk` – only if the first one says "app not installed"

            Notes update automatically inside the app – you only need a new APK for new app features.

      - name: Deploy web app to GitHub Pages (keeps data/)
        env:
          CONTENT_TOKEN: ${{ secrets.CONTENT_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${CONTENT_TOKEN}@github.com/Sunilpa4/diplomaone-content.git" site
          find site -mindepth 1 -maxdepth 1 ! -name .git ! -name data ! -name README.md -exec rm -rf {} +
          cp -r app/build/web/. site/
          touch site/.nojekyll
          cd site
          git config user.name "DiplomaOne Bot"
          git config user.email "Sunilpa4@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Web app build ${{ github.run_number }}" && git push)
