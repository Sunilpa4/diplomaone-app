name: Publish uploaded solved papers

on:
  pull_request:
    paths:
      - 'papers-upload/**'
      - 'tools/publish_solved_papers.py'
      - 'tools/test_publish_solved_papers.py'
      - 'tools/test_pdf_batch.py'
      - 'tools/test_common_subject_papers.py'
      - 'tools/test_computer_papers.js'
      - 'tools/prepare_computer_papers.js'
      - 'tools/prepare_mechanical_papers.js'
      - 'tools/test_mechanical_papers.js'
      - 'tools/prepare_mechanical_refresh.js'
      - 'tools/test_mechanical_refresh.js'
      - 'tools/test_mechanical_refresh.py'
      - 'website/test_mechanical_listing.js'
      - 'tools/prepare_electrical_papers.js'
      - 'tools/test_electrical_papers.js'
      - 'tools/prepare_pdf_paper_cards.py'
      - 'tools/verify_pdf_card_rendering.py'
      - 'tools/paper-card-requirements.txt'
      - 'tools/test_paper_card_files.py'
      - 'website/test_card_refresh.js'
      - 'website/test_private_context.js'
      - '.github/workflows/publish-solved-papers.yml'
  push:
    branches: [main]
    paths:
      - 'papers-upload/**'
      - 'tools/publish_solved_papers.py'
      - 'tools/test_publish_solved_papers.py'
      - 'tools/test_pdf_batch.py'
      - 'tools/test_common_subject_papers.py'
      - 'tools/test_computer_papers.js'
      - 'tools/prepare_computer_papers.js'
      - 'tools/prepare_mechanical_papers.js'
      - 'tools/test_mechanical_papers.js'
      - 'tools/prepare_mechanical_refresh.js'
      - 'tools/test_mechanical_refresh.js'
      - 'tools/test_mechanical_refresh.py'
      - 'website/test_mechanical_listing.js'
      - 'tools/prepare_electrical_papers.js'
      - 'tools/test_electrical_papers.js'
      - 'tools/prepare_pdf_paper_cards.py'
      - 'tools/verify_pdf_card_rendering.py'
      - 'tools/paper-card-requirements.txt'
      - 'tools/test_paper_card_files.py'
      - 'website/test_card_refresh.js'
      - 'website/test_private_context.js'
      - '.github/workflows/publish-solved-papers.yml'

permissions:
  contents: read

concurrency:
  group: publish-solved-papers-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install paper reader test dependency
        run: npm install --no-save --ignore-scripts --no-package-lock jsdom@26.1.0
      - name: Check reader compatibility
        run: |
          node tools/test_computer_papers.js
          node tools/test_mechanical_papers.js
          node tools/test_mechanical_refresh.js
          node website/test_mechanical_listing.js
          node tools/test_electrical_papers.js
          node website/test_card_refresh.js
      - name: Check additive publishing and uploaded files
        run: |
          python3 tools/test_publish_solved_papers.py
          python3 tools/test_pdf_batch.py
          python3 tools/test_common_subject_papers.py
          python3 tools/test_paper_card_files.py
          mkdir "$RUNNER_TEMP/paper-check"
          python3 tools/publish_solved_papers.py papers-upload/papers "$RUNNER_TEMP/paper-check" --missing-originals papers-upload/missing-originals.json --replacements papers-upload/reviewed-paper-replacements.json
      - name: Verify lossless question excerpts against original PDFs
        run: |
          python3 -m pip install --disable-pip-version-check -r tools/paper-card-requirements.txt
          python3 tools/verify_pdf_card_rendering.py
          python3 tools/test_mechanical_refresh.py
      - name: Check out public site
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          repository: Sunilpa4/diplomaone-content
          ref: main
          path: public-site
          token: ${{ secrets.CONTENT_TOKEN }}
      # Public CLI now publishes only the two free subjects and small private
      # product metadata. Paid HTML/PDF/images can never be copied by this job.
      # Existing public copies require verified private import + owner cleanup;
      # this job does not delete source/history or silently declare migration.
      - name: Publish free readers and private-paper listing metadata only
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          python3 tools/publish_solved_papers.py papers-upload/papers public-site --missing-originals papers-upload/missing-originals.json --replacements papers-upload/reviewed-paper-replacements.json
          cd public-site
          git config user.name 'DiplomaOne Bot'
          git config user.email 'Sunilpa4@users.noreply.github.com'
          git add -- papers/
          if git diff --cached --quiet; then
            echo 'All papers already exist unchanged.'
            exit 0
          fi
          git commit -m 'Publish uploaded solved-paper sets'
          for attempt in 1 2 3 4 5; do
            git fetch --deepen=10 origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another publisher; retry $attempt of 5."
            sleep 3
          done
          echo 'Could not publish after retries; no force push was used.' >&2
          exit 1
