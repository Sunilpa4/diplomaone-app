name: Update solved-paper index

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/index_papers.py'
      - 'tools/test_index_papers.py'
      - '.github/workflows/index-papers.yml'
  pull_request:
    paths:
      - 'tools/index_papers.py'
      - 'tools/test_index_papers.py'
      - '.github/workflows/index-papers.yml'

permissions:
  contents: read

concurrency:
  group: index-papers-${{ github.event_name == 'pull_request' && github.ref || 'publisher' }}
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test indexing rules
        run: python3 tools/test_index_papers.py
      - name: Check out published papers
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          repository: Sunilpa4/diplomaone-content
          ref: main
          path: public-site
          token: ${{ secrets.CONTENT_TOKEN }}
      - name: Index papers without changing their contents
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          python3 tools/index_papers.py public-site/papers
          cd public-site
          git config user.name 'DiplomaOne Bot'
          git config user.email 'Sunilpa4@users.noreply.github.com'
          git add -- papers/index.json
          if git diff --cached --quiet; then
            echo 'Paper index is already up to date.'
            exit 0
          fi
          git commit -m 'Update solved-paper index'
          for attempt in 1 2 3 4 5; do
            git fetch --deepen=10 origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another publisher; retry $attempt of 5."
            sleep 3
          done
          echo 'Could not publish index after retries.' >&2
          exit 1
