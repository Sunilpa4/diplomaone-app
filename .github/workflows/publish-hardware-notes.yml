# One-file installation: sources are gzip/base64 encoded below, never credentials.
# Replace the old four-unit workflow at this same filename, if it exists.
name: Publish All Notes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'tools/export_app_content.py'
      - 'tools/publisher_payloads/**'
      - '.github/workflows/publish-hardware-notes.yml'

permissions:
  contents: write

concurrency:
  group: publish-diplomaone-notes
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source repository
        uses: actions/checkout@v4

      - name: Install missing Hardware source lessons and prepare reusable publisher
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import base64, gzip, json, os
          from pathlib import Path
          payload = Path('tools/publisher_payloads/hardware.b64').read_text(encoding='ascii').strip()
          decoded = json.loads(gzip.decompress(base64.b64decode(payload)))
          root = Path('content/computer/sem5/DI05007011')
          if not (root / 'subject.json').is_file():
              raise SystemExit('Existing Hardware subject.json is required; no source deleted.')
          manifest = []
          for number in range(2, 6):
              rel = 'unit' + str(number) + '.json'
              if (root / rel).exists():
                  print(rel + ' already exists; preserving existing source.')
                  continue
              unit = json.loads(decoded['files'][rel])
              needed = [rel] + ['diagrams/' + d['id'] + '.svg' for d in unit['diagrams']]
              for name in needed:
                  path = root / name
                  value = decoded['files'][name]
                  if path.exists() and path.read_text(encoding='utf-8') != value:
                      raise SystemExit('Source collision: ' + str(path))
              for name in needed:
                  path = root / name
                  if not path.exists():
                      path.parent.mkdir(parents=True, exist_ok=True)
                      path.write_text(decoded['files'][name], encoding='utf-8')
                      manifest.append(path.as_posix())
          temp = Path(os.environ['RUNNER_TEMP'])
          (temp / 'publish_content_safe.py').write_text(decoded['helper'], encoding='utf-8')
          (temp / 'seeded_paths.json').write_text(json.dumps(manifest), encoding='utf-8')
          print('Prepared ' + str(len(manifest)) + ' missing source files; existing units preserved.')
          PYCODE

      - name: Install missing bilingual Mechanical source and register Semester 1
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import ast, base64, gzip, json, os
          from pathlib import Path
          payload = Path('tools/publisher_payloads/mechanical-sem1-unit1.b64').read_text(encoding='ascii').strip()
          files = json.loads(gzip.decompress(base64.b64decode(payload)))
          temp = Path(os.environ['RUNNER_TEMP'])
          manifest_path = temp / 'seeded_paths.json'
          manifest = json.loads(manifest_path.read_text())
          for rel, text in files.items():
              p = Path(rel)
              if p.is_absolute() or '..' in p.parts:
                  raise SystemExit('Unsafe source path')
              if p.exists():
                  print('Preserving existing ' + rel)
                  continue
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(text, encoding='utf-8')
              manifest.append(rel)
          exporter = Path('tools/export_app_content.py')
          text = exporter.read_text(encoding='utf-8')
          marker = '# DiplomaOne registration: DI01000191 mechanical semester 1'
          if marker not in text:
              block = "\n".join([
                  marker,
                  "if 'DI01000191' not in SUBJECTS:",
                  "    SUBJECTS['DI01000191'] = ('Elements of Mechanical Engineering', 'મેકેનિકલ એન્જિનિયરિંગના મૂળતત્ત્વો', 'Professional Core', 4, 'theory', None)",
                  "_mechanical_sem1 = BRANCH_SEMS.setdefault('mechanical', {}).setdefault(1, [])",
                  "if 'DI01000191' not in _mechanical_sem1:",
                  "    _mechanical_sem1.append('DI01000191')",
                  "",
              ])
              if 'FONT_MAP = [' not in text:
                  raise SystemExit('Exporter layout changed; review registration manually')
              text = text.replace('FONT_MAP = [', block + '\nFONT_MAP = [', 1)
              ast.parse(text)
              exporter.write_text(text, encoding='utf-8')
              manifest.append(exporter.as_posix())
          manifest_path.write_text(json.dumps(sorted(set(manifest))), encoding='utf-8')
          print('Mechanical Semester 1 registration prepared; only completed Unit 1 is installed.')
          PYCODE

      - name: Install completed bilingual Mechanical Unit 2 with questions-only exam
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import base64, gzip, json, os
          payload = Path('tools/publisher_payloads/mechanical-sem1-unit2.b64').read_text(encoding='ascii').strip()
          files = json.loads(gzip.decompress(base64.b64decode(payload)))
          unit_path = Path('content/mechanical/sem1/DI01000191/unit2.json')
          manifest_path = Path(os.environ['RUNNER_TEMP']) / 'seeded_paths.json'
          manifest = json.loads(manifest_path.read_text())
          if unit_path.exists():
              print('Unit 2 already exists; preserving current source. No overwrite.')
          else:
              for rel, value in files.items():
                  path = Path(rel)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit('Unsafe source path')
                  if path.exists() and path.read_text(encoding='utf-8') != value:
                      raise SystemExit('Source collision: ' + rel)
              for rel, value in files.items():
                  path = Path(rel)
                  if not path.exists():
                      path.parent.mkdir(parents=True, exist_ok=True)
                      path.write_text(value, encoding='utf-8')
                      manifest.append(rel)
          unit = json.loads(unit_path.read_text(encoding='utf-8'))
          if any(set(q) - {'q', 'marks'} for q in unit.get('exam_questions', [])):
              raise SystemExit('Exam policy requires questions/marks only; review current Unit 2 source.')
          manifest_path.write_text(json.dumps(sorted(set(manifest))), encoding='utf-8')
          print('Mechanical Unit 2 ready; Exam contains no answer fields.')
          PYCODE

      - name: Install completed bilingual Mechanical Unit 3 with questions-only exam
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import base64, gzip, json, os
          payload = Path('tools/publisher_payloads/mechanical-sem1-unit3.b64').read_text(encoding='ascii').strip()
          files = json.loads(gzip.decompress(base64.b64decode(payload)))
          unit_path = Path('content/mechanical/sem1/DI01000191/unit3.json')
          manifest_path = Path(os.environ['RUNNER_TEMP']) / 'seeded_paths.json'
          manifest = json.loads(manifest_path.read_text())
          if unit_path.exists():
              print('Unit 3 already exists; preserving current source. No overwrite.')
          else:
              for rel, value in files.items():
                  path = Path(rel)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit('Unsafe source path')
                  if path.exists() and path.read_text(encoding='utf-8') != value:
                      raise SystemExit('Source collision: ' + rel)
              for rel, value in files.items():
                  path = Path(rel)
                  if not path.exists():
                      path.parent.mkdir(parents=True, exist_ok=True)
                      path.write_text(value, encoding='utf-8')
                      manifest.append(rel)
          unit = json.loads(unit_path.read_text(encoding='utf-8'))
          if any(set(q) - {'q', 'marks'} for q in unit.get('exam_questions', [])):
              raise SystemExit('Exam policy requires questions/marks only; review current Unit 3 source.')
          manifest_path.write_text(json.dumps(sorted(set(manifest))), encoding='utf-8')
          print('Mechanical Unit 3 ready; Exam contains no answer fields.')
          PYCODE

      - name: Install completed bilingual Mechanical Units 4 through 11
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import base64,gzip,json,os
          payload = Path('tools/publisher_payloads/mechanical-sem1-units4-11.b64').read_text(encoding='ascii').strip()
          files=json.loads(gzip.decompress(base64.b64decode(payload)))
          manifest_path=Path(os.environ['RUNNER_TEMP'])/'seeded_paths.json'
          manifest=json.loads(manifest_path.read_text())
          planned={}
          for n in range(4,12):
              rel=f'content/mechanical/sem1/DI01000191/unit{n}.json'
              path=Path(rel)
              if path.exists():
                  print(f'Unit {n} exists; preserving current source.')
                  unit=json.loads(path.read_text())
              else:
                  unit=json.loads(files[rel])
                  planned[rel]=files[rel]
                  for d in unit.get('diagrams',[]):
                      svg=str(path.parent/d['file'])
                      if svg not in files: raise SystemExit('Missing diagram payload: '+svg)
                      planned[svg]=files[svg]
              if any(set(q) - {'q','marks'} or 'q' not in q or 'marks' not in q for q in unit.get('exam_questions',[])):
                  raise SystemExit(f'Unit {n}: Exam must contain questions/marks only; review existing source.')
          # Preflight ALL collisions before making any writes.
          for rel,value in planned.items():
              path=Path(rel)
              if path.is_absolute() or '..' in path.parts: raise SystemExit('Unsafe source path')
              if path.exists() and path.read_text(encoding='utf-8')!=value: raise SystemExit('Source collision: '+rel)
          for rel,value in planned.items():
              path=Path(rel)
              if not path.exists():
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_text(value,encoding='utf-8');manifest.append(rel)
          manifest_path.write_text(json.dumps(sorted(set(manifest))),encoding='utf-8')
          print('Mechanical Units 4–11 ready. Existing source preserved; questions-only Exam validated.')
          PYCODE

      - name: Install Mechanical Semester 3 all six bilingual units and registration
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import base64,gzip,json,os,ast
          payload = Path('tools/publisher_payloads/mechanical-sem3-machines.b64').read_text(encoding='ascii').strip()
          files=json.loads(gzip.decompress(base64.b64decode(payload)))
          manifest_path=Path(os.environ['RUNNER_TEMP'])/'seeded_paths.json'
          manifest=json.loads(manifest_path.read_text())
          root=Path('content/mechanical/sem3/DI03000141')
          planned={}
          subject_rel=str(root/'subject.json')
          subject=json.loads(Path(subject_rel).read_text() if Path(subject_rel).exists() else files[subject_rel])
          if subject.get('code')!='DI03000141' or subject.get('branch')!='mechanical' or subject.get('semester')!=3:
              raise SystemExit('Existing subject identity conflict; review without overwriting.')
          if not Path(subject_rel).exists():planned[subject_rel]=files[subject_rel]
          for n in range(1,7):
              rel=str(root/f'unit{n}.json');p=Path(rel)
              unit=json.loads(p.read_text() if p.exists() else files[rel])
              if unit.get('subject')!='DI03000141' or unit.get('unit')!=n:raise SystemExit('Existing unit identity conflict: '+rel)
              if any(set(q)!={'q','marks'} for q in unit.get('exam_questions',[])):raise SystemExit('Questions-only Exam policy conflict: '+rel)
              if p.exists():print('Preserving existing '+rel)
              else:
                  planned[rel]=files[rel]
                  for d in unit.get('diagrams',[]):
                      svg=str(root/d['file'])
                      if svg not in files:raise SystemExit('Missing diagram payload: '+svg)
                      planned[svg]=files[svg]
          exporter=Path('tools/export_app_content.py');text=exporter.read_text(encoding='utf-8')
          marker='# DiplomaOne registration: DI03000141 mechanical semester 3'
          updated=text
          if marker not in text:
              block="\n".join([
                  marker,
                  "if 'DI03000141' not in SUBJECTS:",
                  "    SUBJECTS['DI03000141'] = ('Theory of Machines and Mechanisms', 'યંત્રો અને મિકેનિઝમ્સનો સિદ્ધાંત', 'Professional Core', 4, 'theory', None)",
                  "_mechanical_sem3 = BRANCH_SEMS.setdefault('mechanical', {}).setdefault(3, [])",
                  "if 'DI03000141' not in _mechanical_sem3:",
                  "    _mechanical_sem3.append('DI03000141')",
                  "",
              ])
              if 'FONT_MAP = [' not in text:raise SystemExit('Exporter layout changed; review registration manually.')
              updated=text.replace('FONT_MAP = [',block+'\nFONT_MAP = [',1)
              ast.parse(updated)
          # All preflight checks occur before installing this subject.
          for rel,value in planned.items():
              p=Path(rel)
              if p.is_absolute() or '..' in p.parts:raise SystemExit('Unsafe source path')
              if p.exists() and p.read_text(encoding='utf-8')!=value:raise SystemExit('Source collision: '+rel)
          for rel,value in planned.items():
              p=Path(rel)
              if not p.exists():
                  p.parent.mkdir(parents=True,exist_ok=True);p.write_text(value,encoding='utf-8');manifest.append(rel)
          if updated!=text:exporter.write_text(updated,encoding='utf-8');manifest.append(str(exporter))
          manifest_path.write_text(json.dumps(sorted(set(manifest))),encoding='utf-8')
          print('Mechanical Semester 3: all six units and registration ready; existing source preserved.')
          PYCODE

      - name: Install Manufacturing Engineering I Unit 1 detailed construction working and registration
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import base64,gzip,json,os,ast
          payload = Path('tools/publisher_payloads/mechanical-sem3-manufacturing-unit1.b64').read_text(encoding='ascii').strip()
          files=json.loads(gzip.decompress(base64.b64decode(payload)))
          manifest_path=Path(os.environ['RUNNER_TEMP'])/'seeded_paths.json'
          manifest=json.loads(manifest_path.read_text())
          root=Path('content/mechanical/sem3/DI03000161')
          planned={}
          subject_rel=str(root/'subject.json')
          subject=json.loads(Path(subject_rel).read_text() if Path(subject_rel).exists() else files[subject_rel])
          if subject.get('code')!='DI03000161' or subject.get('branch')!='mechanical' or subject.get('semester')!=3:
              raise SystemExit('Existing subject identity conflict; review without overwriting.')
          if not Path(subject_rel).exists():planned[subject_rel]=files[subject_rel]
          for n in range(1,2):
              rel=str(root/f'unit{n}.json');p=Path(rel)
              unit=json.loads(p.read_text() if p.exists() else files[rel])
              if unit.get('subject')!='DI03000161' or unit.get('unit')!=n:raise SystemExit('Existing unit identity conflict: '+rel)
              if any(set(q)!={'q','marks'} for q in unit.get('exam_questions',[])):raise SystemExit('Questions-only Exam policy conflict: '+rel)
              if p.exists():print('Preserving existing '+rel)
              else:
                  planned[rel]=files[rel]
                  for d in unit.get('diagrams',[]):
                      svg=str(root/d['file'])
                      if svg not in files:raise SystemExit('Missing diagram payload: '+svg)
                      planned[svg]=files[svg]
          exporter=Path('tools/export_app_content.py');text=exporter.read_text(encoding='utf-8')
          marker='# DiplomaOne registration: DI03000161 mechanical semester 3'
          updated=text
          if marker not in text:
              block="\n".join([
                  marker,
                  "if 'DI03000161' not in SUBJECTS:",
                  "    SUBJECTS['DI03000161'] = ('Manufacturing Engineering-I', 'ઉત્પાદન ઇજનેરી-I', 'Professional Core', 4, 'theory', None)",
                  "_mechanical_sem3 = BRANCH_SEMS.setdefault('mechanical', {}).setdefault(3, [])",
                  "if 'DI03000161' not in _mechanical_sem3:",
                  "    _mechanical_sem3.append('DI03000161')",
                  "",
              ])
              if 'FONT_MAP = [' not in text:raise SystemExit('Exporter layout changed; review registration manually.')
              updated=text.replace('FONT_MAP = [',block+'\nFONT_MAP = [',1)
              ast.parse(updated)
          # All preflight checks occur before installing this subject.
          for rel,value in planned.items():
              p=Path(rel)
              if p.is_absolute() or '..' in p.parts:raise SystemExit('Unsafe source path')
              if p.exists() and p.read_text(encoding='utf-8')!=value:raise SystemExit('Source collision: '+rel)
          for rel,value in planned.items():
              p=Path(rel)
              if not p.exists():
                  p.parent.mkdir(parents=True,exist_ok=True);p.write_text(value,encoding='utf-8');manifest.append(rel)
          if updated!=text:exporter.write_text(updated,encoding='utf-8');manifest.append(str(exporter))
          manifest_path.write_text(json.dumps(sorted(set(manifest))),encoding='utf-8')
          print('Manufacturing Engineering-I Unit 1 and registration ready; existing source preserved. Units 2–4 are not seeded.')
          PYCODE

      - name: Complete Manufacturing Engineering I Units 2 through 4 with detailed construction and working
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import base64,gzip,json,os
          payload = Path('tools/publisher_payloads/mechanical-sem3-manufacturing-units2-4.b64').read_text(encoding='ascii').strip()
          files=json.loads(gzip.decompress(base64.b64decode(payload)))
          root=Path('content/mechanical/sem3/DI03000161')
          manifest_path=Path(os.environ['RUNNER_TEMP'])/'seeded_paths.json'
          manifest=json.loads(manifest_path.read_text())
          subject=json.loads((root/'subject.json').read_text())
          if subject.get('code')!='DI03000161' or subject.get('branch')!='mechanical' or subject.get('semester')!=3:
              raise SystemExit('Manufacturing subject identity conflict; existing source not overwritten.')
          if not {1,2,3,4}.issubset({int(x['no'])for x in subject.get('units',[])}):
              raise SystemExit('Existing subject syllabus metadata needs review; not overwritten.')
          planned={}
          for n in range(2,5):
              rel=str(root/f'unit{n}.json');p=Path(rel)
              unit=json.loads(p.read_text() if p.exists() else files[rel])
              if unit.get('subject')!='DI03000161' or unit.get('unit')!=n:raise SystemExit('Existing unit identity conflict: '+rel)
              if not unit.get('exam_questions') or any(set(q)!={'q','marks'} for q in unit['exam_questions']):
                  raise SystemExit('Questions-only Exam policy conflict: '+rel)
              if p.exists():print('Preserving existing '+rel)
              else:
                  planned[rel]=files[rel]
                  for d in unit.get('diagrams',[]):
                      svg=str(root/d['file'])
                      if svg not in files:raise SystemExit('Missing diagram payload: '+svg)
                      planned[svg]=files[svg]
          # Preflight the entire new batch before any of its file writes.
          for rel,value in planned.items():
              p=Path(rel)
              if p.is_absolute() or '..' in p.parts:raise SystemExit('Unsafe source path')
              if p.exists() and p.read_text(encoding='utf-8')!=value:raise SystemExit('Source collision: '+rel)
          for rel,value in planned.items():
              p=Path(rel)
              if not p.exists():
                  p.parent.mkdir(parents=True,exist_ok=True);p.write_text(value,encoding='utf-8');manifest.append(rel)
          manifest_path.write_text(json.dumps(sorted(set(manifest))),encoding='utf-8')
          print('Manufacturing Engineering-I all four units ready; existing source retained.')
          PYCODE

      - name: Export source content into staging
        run: |
          python3 tools/export_app_content.py
          cp -a build/data "$RUNNER_TEMP/diplomaone-export"

      - name: Set up Flutter for existing content-render tests
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: Test app content before saving or publishing
        working-directory: app
        run: |
          test -f test/all_content_test.dart
          flutter pub get
          flutter test test/all_content_test.dart

      - name: Back up newly installed source and catalogue registration
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import json, os, subprocess
          from pathlib import Path
          manifest = json.loads((Path(os.environ['RUNNER_TEMP']) / 'seeded_paths.json').read_text())
          if manifest:
              subprocess.run(['git', 'config', 'user.name', 'DiplomaOne Bot'], check=True)
              subprocess.run(['git', 'config', 'user.email', 'Sunilpa4@users.noreply.github.com'], check=True)
              subprocess.run(['git', 'add', '--'] + manifest, check=True)
              diff = subprocess.run(['git', 'diff', '--cached', '--quiet'])
              if diff.returncode == 1:
                  subprocess.run(['git', 'commit', '-m', 'Install completed bilingual Mechanical notes and source updates'], check=True)
                  subprocess.run(['git', 'push', 'origin', 'HEAD:main'], check=True)
              elif diff.returncode != 0:
                  raise SystemExit('Unable to inspect source changes')
          else:
              print('No source installation needed; normal reusable publishing run.')
          PYCODE

      - name: Check publishing secret exists
        env:
          CONTENT_TOKEN: ${{ secrets.CONTENT_TOKEN }}
        run: |
          if [ -z "$CONTENT_TOKEN" ]; then
            echo 'CONTENT_TOKEN is missing from Actions secrets.'
            exit 1
          fi

      - name: Check out public content repository
        uses: actions/checkout@v4
        with:
          repository: Sunilpa4/diplomaone-content
          ref: main
          path: public-site
          token: ${{ secrets.CONTENT_TOKEN }}

      - name: Validate and merge all registered subjects and branches
        run: |
          python3 "$RUNNER_TEMP/publish_content_safe.py"             --exported "$RUNNER_TEMP/diplomaone-export"             --site public-site --apply

      - name: Commit only data changes and publish
        working-directory: public-site
        run: |
          git config user.name 'DiplomaOne Bot'
          git config user.email 'Sunilpa4@users.noreply.github.com'
          git add -- data/
          if git diff --cached --quiet; then
            echo 'No note changes to publish.'
          else
            git commit -m 'Publish updated DiplomaOne notes'
            git push origin HEAD:main
          fi

      - name: Summary
        run: |
          echo '## Notes publisher completed' >> "$GITHUB_STEP_SUMMARY"
          echo 'Registered source notes were validated and merged without deleting live content or changing website design.' >> "$GITHUB_STEP_SUMMARY"
          echo 'GitHub Pages deployment/cache refresh may still be pending. Verify public files and reopen the app.' >> "$GITHUB_STEP_SUMMARY"
