              if p.exists() and p.read_text(encoding='utf-8')!=value and rel not in replace_paths:raise SystemExit('Source collision: '+rel)
          for rel,value in planned.items():
              p=Path(rel)
              if not p.exists() or rel in replace_paths:
                  p.parent.mkdir(parents=True,exist_ok=True);p.write_text(value,encoding='utf-8');manifest.append(rel)
          if updated!=text:exporter.write_text(updated,encoding='utf-8');manifest.append(str(exporter))
          manifest_path.write_text(json.dumps(sorted(set(manifest))),encoding='utf-8')
          print('Thermal Engineering - II revision2 all five units ready;recognised revision1 baseline upgraded;owner edits preserved.')
          PYCODE

      - name: Install Semester 5 Manufacturing Engineering - III all five bilingual units and registration
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import base64,gzip,json,os,ast
          payload = Path('tools/publisher_payloads/mechanical-sem5-manufacturing.b64').read_text(encoding='ascii').strip()
          files=json.loads(gzip.decompress(base64.b64decode(payload)))
          manifest_path=Path(os.environ['RUNNER_TEMP'])/'seeded_paths.json'
          manifest=json.loads(manifest_path.read_text())
          root=Path('content/mechanical/sem5/DI05019011')
          planned={}
          subject_rel=str(root/'subject.json')
          subject=json.loads(Path(subject_rel).read_text() if Path(subject_rel).exists() else files[subject_rel])
          if subject.get('code')!='DI05019011' or subject.get('branch')!='mechanical' or subject.get('semester')!=5:
              raise SystemExit('Existing subject identity conflict; review without overwriting.')
          if not Path(subject_rel).exists():planned[subject_rel]=files[subject_rel]
          for n in range(1,6):
              rel=str(root/f'unit{n}.json');p=Path(rel)
              unit=json.loads(p.read_text() if p.exists() else files[rel])
              if unit.get('subject')!='DI05019011' or unit.get('unit')!=n:raise SystemExit('Existing unit identity conflict: '+rel)
              if any(set(q)!={'q','marks'} for q in unit.get('exam_questions',[])):raise SystemExit('Questions-only Exam policy conflict: '+rel)
              if p.exists():print('Preserving existing '+rel)
              else:
                  planned[rel]=files[rel]
                  for d in unit.get('diagrams',[]):
                      svg=str(root/d['file'])
                      if svg not in files:raise SystemExit('Missing diagram payload: '+svg)
                      planned[svg]=files[svg]
          exporter=Path('tools/export_app_content.py');text=exporter.read_text(encoding='utf-8')
          marker='# DiplomaOne registration: DI05019011 mechanical semester 5'
          updated=text
          if marker not in text:
              block="\n".join([
                  marker,
                  "if 'DI05019011' not in SUBJECTS:",
                  "    SUBJECTS['DI05019011'] = ('Manufacturing Engineering - III', 'મેન્યુફેક્ચરિંગ ઇજનેરી - III', 'Professional Core', 5, 'theory', None)",
                  "_mechanical_sem5 = BRANCH_SEMS.setdefault('mechanical', {}).setdefault(5, [])",
                  "if 'DI05019011' not in _mechanical_sem5:",
                  "    _mechanical_sem5.append('DI05019011')",
                  "",
              ])
              if 'FONT_MAP = [' not in text:raise SystemExit('Exporter layout changed; review registration manually.')
              updated=text.replace('FONT_MAP = [',block+'\nFONT_MAP = [',1)
              ast.parse(updated)
          # All preflight checks occur before installing this subject.
          for rel,value in planned.items():
              p=Path(rel)
              if p.is_absolute() or '..' in p.parts:raise SystemExit('Unsafe source path')
              if p.exists() and p.read_text(encoding='utf-8')!=value:raise SystemExit('Source collision: '+rel)
          for rel,value in planned.items():
              p=Path(rel)
              if not p.exists():
                  p.parent.mkdir(parents=True,exist_ok=True);p.write_text(value,encoding='utf-8');manifest.append(rel)
          if updated!=text:exporter.write_text(updated,encoding='utf-8');manifest.append(str(exporter))
          manifest_path.write_text(json.dumps(sorted(set(manifest))),encoding='utf-8')
          print('Manufacturing Engineering - III all five units and registration ready; existing source preserved.')
          PYCODE

      - name: Export source content into staging
        run: |
          python3 tools/export_app_content.py
          cp -a build/data "$RUNNER_TEMP/diplomaone-export"

      - name: Set up Flutter for existing content-render tests
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: Test app content before saving or publishing
        working-directory: app
        run: |
          test -f test/all_content_test.dart
          flutter pub get
          flutter test test/all_content_test.dart

      - name: Back up newly installed source and catalogue registration
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import json, os, subprocess
          from pathlib import Path
          manifest = json.loads((Path(os.environ['RUNNER_TEMP']) / 'seeded_paths.json').read_text())
          if manifest:
              subprocess.run(['git', 'config', 'user.name', 'DiplomaOne Bot'], check=True)
              subprocess.run(['git', 'config', 'user.email', 'Sunilpa4@users.noreply.github.com'], check=True)
              subprocess.run(['git', 'add', '--'] + manifest, check=True)
              diff = subprocess.run(['git', 'diff', '--cached', '--quiet'])
              if diff.returncode == 1:
                  subprocess.run(['git', 'commit', '-m', 'Install completed bilingual Mechanical notes and source updates'], check=True)
                  subprocess.run(['git', 'push', 'origin', 'HEAD:main'], check=True)
              elif diff.returncode != 0:
                  raise SystemExit('Unable to inspect source changes')
          else:
              print('No source installation needed; normal reusable publishing run.')
          PYCODE

      - name: Check publishing secret exists
        env:
          CONTENT_TOKEN: ${{ secrets.CONTENT_TOKEN }}
        run: |
          if [ -z "$CONTENT_TOKEN" ]; then
            echo 'CONTENT_TOKEN is missing from Actions secrets.'
            exit 1
          fi

      - name: Check out public content repository
        uses: actions/checkout@v4
        with:
          repository: Sunilpa4/diplomaone-content
          ref: main
          path: public-site
          token: ${{ secrets.CONTENT_TOKEN }}

      - name: Validate and merge all registered subjects and branches
        run: |
          python3 "$RUNNER_TEMP/publish_content_safe.py"             --exported "$RUNNER_TEMP/diplomaone-export"             --site public-site --apply

      - name: Commit only data changes and publish
        working-directory: public-site
        run: |
          git config user.name 'DiplomaOne Bot'
          git config user.email 'Sunilpa4@users.noreply.github.com'
          git add -- data/
          if git diff --cached --quiet; then
            echo 'No note changes to publish.'
          else
            git commit -m 'Publish updated DiplomaOne notes'
            git push origin HEAD:main
          fi

      - name: Summary
        run: |
          echo '## Notes publisher completed' >> "$GITHUB_STEP_SUMMARY"
          echo 'Registered source notes were validated and merged without deleting live content or changing website design.' >> "$GITHUB_STEP_SUMMARY"
          echo 'GitHub Pages deployment/cache refresh may still be pending. Verify public files and reopen the app.' >> "$GITHUB_STEP_SUMMARY"
