c48efeae5f88b', 'content/mechanical/sem5/DI05019021/unit3.json': 'ae657dd0ac56277c81bdcabc174cf576091a6f4a036d3f4905732381ea905ae5', 'content/mechanical/sem5/DI05019021/unit4.json': 'ef988d9feb709d18a7dea2f2e4214d2dd6731e1c390ab316ed46389b1455a3a2', 'content/mechanical/sem5/DI05019021/unit5.json': '19393dd862b193f547e2c09838ed38f76249ac351a01d2b5d745be4780a78434'}
