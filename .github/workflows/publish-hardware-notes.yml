# Publisher payloads are stored separately under tools/publisher_payloads/.
name: Publish All Notes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'tools/export_app_content.py'
      - 'tools/publisher_payloads/**'
      - '.github/workflows/publish-hardware-notes.yml'

permissions:
  contents: write

concurrency:
  group: publish-diplomaone-notes
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source repository
        uses: actions/checkout@v4

      - name: Install missing Hardware source lessons and prepare reusable publisher
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import base64, gzip, json, os
          from pathlib import Path
          payload = Path('tools/publisher_payloads/hardware.b64').read_text(encoding='ascii').strip()
          decoded = json.loads(gzip.decompress(base64.b64decode(payload)))
          root = Path('content/computer/sem5/DI05007011')
          if not (root / 'subject.json').is_file():
              raise SystemExit('Existing Hardware subject.json is required; no source deleted.')
          manifest = []
          for number in range(2, 6):
              rel = 'unit' + str(number) + '.json'
              if (root / rel).exists():
                  print(rel + ' already exists; preserving existing source.')
                  continue
              unit = json.loads(decoded['files'][rel])
              needed = [rel] + ['diagrams/' + d['id'] + '.svg' for d in unit['diagrams']]
              for name in needed:
                  path = root / name
                  value = decoded['files'][name]
                  if path.exists() and path.read_text(encoding='utf-8') != value:
                      raise SystemExit('Source collision: ' + str(path))
              for name in needed:
                  path = root / name
                  if not path.exists():
                      path.parent.mkdir(parents=True, exist_ok=True)
                      path.write_text(decoded['files'][name], encoding='utf-8')
                      manifest.append(path.as_posix())
          temp = Path(os.environ['RUNNER_TEMP'])
          (temp / 'publish_content_safe.py').write_text(decoded['helper'], encoding='utf-8')
          (temp / 'seeded_paths.json').write_text(json.dumps(manifest), encoding='utf-8')
          print('Prepared ' + str(len(manifest)) + ' missing source files; existing units preserved.')
          PYCODE

      - name: Install missing bilingual Mechanical source and register Semester 1
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import ast, base64, gzip, json, os
          from pathlib import Path
          payload = Path('tools/publisher_payloads/mechanical-sem1-unit1.b64').read_text(encoding='ascii').strip()
          files = json.loads(gzip.decompress(base64.b64decode(payload)))
          temp = Path(os.environ['RUNNER_TEMP'])
          manifest_path = temp / 'seeded_paths.json'
          manifest = json.loads(manifest_path.read_text())
          for rel, text in files.items():
              p = Path(rel)
              if p.is_absolute() or '..' in p.parts:
                  raise SystemExit('Unsafe source path')
              if p.exists():
                  print('Preserving existing ' + rel)
                  continue
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(text, encoding='utf-8')
              manifest.append(rel)
          exporter = Path('tools/export_app_content.py')
          text = exporter.read_text(encoding='utf-8')
          marker = '# DiplomaOne registration: DI01000191 mechanical semester 1'
          if marker not in text:
              block = "\n".join([
                  marker,
                  "if 'DI01000191' not in SUBJECTS:",
                  "    SUBJECTS['DI01000191'] = ('Elements of Mechanical Engineering', 'મેકેનિકલ એન્જિનિયરિંગના મૂળતત્ત્વો', 'Professional Core', 4, 'theory', None)",
                  "_mechanical_sem1 = BRANCH_SEMS.setdefault('mechanical', {}).setdefault(1, [])",
                  "if 'DI01000191' not in _mechanical_sem1:",
                  "    _mechanical_sem1.append('DI01000191')",
                  "",
              ])
              if 'FONT_MAP = [' not in text:
                  raise SystemExit('Exporter layout changed; review registration manually')
              text = text.replace('FONT_MAP = [', block + '\nFONT_MAP = [', 1)
              ast.parse(text)
              exporter.write_text(text, encoding='utf-8')
              manifest.append(exporter.as_posix())
          manifest_path.write_text(json.dumps(sorted(set(manifest))), encoding='utf-8')
          print('Mechanical Semester 1 registration prepared; only completed Unit 1 is installed.')
          PYCODE

      - name: Install completed bilingual Mechanical Unit 2 with questions-only exam
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import base64, gzip, json, os
          payload = Path('tools/publisher_payloads/mechanical-sem1-unit2.b64').read_text(encoding='ascii').strip()
          files = json.loads(gzip.decompress(base64.b64decode(payload)))
          unit_path = Path('content/mechanical/sem1/DI01000191/unit2.json')
          manifest_path = Path(os.environ['RUNNER_TEMP']) / 'seeded_paths.json'
          manifest = json.loads(manifest_path.read_text())
          if unit_path.exists():
              print('Unit 2 already exists; preserving current source. No overwrite.')
          else:
              for rel, value in files.items():
                  path = Path(rel)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit('Unsafe source path')
                  if path.exists() and path.read_text(encoding='utf-8') != value:
                      raise SystemExit('Source collision: ' + rel)
              for rel, value in files.items():
                  path = Path(rel)
                  if not path.exists():
                      path.parent.mkdir(parents=True, exist_ok=True)
                      path.write_text(value, encoding='utf-8')
                      manifest.append(rel)
          unit = json.loads(unit_path.read_text(encoding='utf-8'))
          if any(set(q) - {'q', 'marks'} for q in unit.get('exam_questions', [])):
              raise SystemExit('Exam policy requires questions/marks only; review current Unit 2 source.')
          manifest_path.write_text(json.dumps(sorted(set(manifest))), encoding='utf-8')
          print('Mechanical Unit 2 ready; Exam contains no answer fields.')
          PYCODE

      - name: Install completed bilingual Mechanical Unit 3 with questions-only exam
