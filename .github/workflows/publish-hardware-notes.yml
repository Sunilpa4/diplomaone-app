# One-file installation: sources are gzip/base64 encoded below, never credentials.
# Replace the old four-unit workflow at this same filename, if it exists.
name: Publish All Notes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'tools/export_app_content.py'
      - '.github/workflows/publish-hardware-notes.yml'

permissions:
  contents: write

concurrency:
  group: publish-diplomaone-notes
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source repository
        uses: actions/checkout@v4

      - name: Install missing Hardware source lessons and prepare reusable publisher
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import base64, gzip, json, os
          from pathlib import Path
          payload = ''
          decoded = json.loads(gzip.decompress(base64.b64decode(payload)))
          root = Path('content/computer/sem5/DI05007011')
          if not (root / 'subject.json').is_file():
              raise SystemExit('Existing Hardware subject.json is required; no source deleted.')
          manifest = []
          for number in range(2, 6):
              rel = 'unit' + str(number) + '.json'
              if (root / rel).exists():
                  print(rel + ' already exists; preserving existing source.')
                  continue
              unit = json.loads(decoded['files'][rel])
              needed = [rel] + ['diagrams/' + d['id'] + '.svg' for d in unit['diagrams']]
              for name in needed:
                  path = root / name
                  value = decoded['files'][name]
                  if path.exists() and path.read_text(encoding='utf-8') != value:
                      raise SystemExit('Source collision: ' + str(path))
              for name in needed:
                  path = root / name
                  if not path.exists():
                      path.parent.mkdir(parents=True, exist_ok=True)
                      path.write_text(decoded['files'][name], encoding='utf-8')
                      manifest.append(path.as_posix())
          temp = Path(os.environ['RUNNER_TEMP'])
          (temp / 'publish_content_safe.py').write_text(decoded['helper'], encoding='utf-8')
          (temp / 'seeded_paths.json').write_text(json.dumps(manifest), encoding='utf-8')
          print('Prepared ' + str(len(manifest)) + ' missing source files; existing units preserved.')
          PYCODE

      - name: Export source content into staging
        run: |
          python3 tools/export_app_content.py
          cp -a build/data "$RUNNER_TEMP/diplomaone-export"

      - name: Set up Flutter for existing content-render tests
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: Test app content before saving or publishing
        working-directory: app
        run: |
          test -f test/all_content_test.dart
          flutter pub get
          flutter test test/all_content_test.dart

      - name: Back up newly installed source files to private repository
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import json, os, subprocess
          from pathlib import Path
          manifest = json.loads((Path(os.environ['RUNNER_TEMP']) / 'seeded_paths.json').read_text())
          if manifest:
              subprocess.run(['git', 'config', 'user.name', 'DiplomaOne Bot'], check=True)
              subprocess.run(['git', 'config', 'user.email', 'Sunilpa4@users.noreply.github.com'], check=True)
              subprocess.run(['git', 'add', '--'] + manifest, check=True)
              diff = subprocess.run(['git', 'diff', '--cached', '--quiet'])
              if diff.returncode == 1:
                  subprocess.run(['git', 'commit', '-m', 'Install completed Hardware source units 2-5'], check=True)
                  subprocess.run(['git', 'push', 'origin', 'HEAD:main'], check=True)
              elif diff.returncode != 0:
                  raise SystemExit('Unable to inspect source changes')
          else:
              print('No source installation needed; normal reusable publishing run.')
          PYCODE

      - name: Check publishing secret exists
        env:
          CONTENT_TOKEN: ${{ secrets.CONTENT_TOKEN }}
        run: |
          if [ -z "$CONTENT_TOKEN" ]; then
            echo 'CONTENT_TOKEN is missing from Actions secrets.'
            exit 1
          fi

      - name: Check out public content repository
        uses: actions/checkout@v4
        with:
          repository: Sunilpa4/diplomaone-content
          ref: main
          path: public-site
          token: ${{ secrets.CONTENT_TOKEN }}

      - name: Validate and merge all registered subjects and branches
        run: |
          python3 "$RUNNER_TEMP/publish_content_safe.py"             --exported "$RUNNER_TEMP/diplomaone-export"             --site public-site --apply

      - name: Commit only data changes and publish
        working-directory: public-site
        run: |
          git config user.name 'DiplomaOne Bot'
          git config user.email 'Sunilpa4@users.noreply.github.com'
          git add -- data/
          if git diff --cached --quiet; then
            echo 'No note changes to publish.'
          else
            git commit -m 'Publish updated DiplomaOne notes'
            git push origin HEAD:main
          fi

      - name: Summary
        run: |
          echo '## Notes publisher completed' >> "$GITHUB_STEP_SUMMARY"
          echo 'Registered source notes were validated and merged without deleting live content or changing website design.' >> "$GITHUB_STEP_SUMMARY"
          echo 'GitHub Pages deployment/cache refresh may still be pending. Verify public files and reopen the app.' >> "$GITHUB_STEP_SUMMARY"
